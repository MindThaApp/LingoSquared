teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *читать* (کتاب خواندن)، *заниматься спортом* (ورزش کردن) و *готовить* (آشپزی کردن).'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*Свободное время* عبارت اصلی برای صحبت درباره‌ی سرگرمی‌هاست. صفت *свободное* برای هماهنگی با *время* به *-ое* ختم می‌شود.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Люблю* شکل *я* فعل *любить* است (دوست داشتن). بعد از آن، فعل دوم به شکل مصدر می‌ماند: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *слушать музыку* (موسیقی گوش دادن)، *рисовать* (نقاشی کردن) و *играть в игры* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: '*Слушать* مفعولش را مستقیم می‌گیرد: *музыку* حالت مفعولی (винительный) *музыка* است، با ختم *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*С друзьями* (با دوستان): بعد از حرف اضافه‌ی *с* حالت آلتی (творительный) می‌آید، به همین خاطر *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: 'چهار قید اصلی تکرار: *всегда*، *часто*، *иногда*، *никогда*. این‌ها هرگز شکلشان تغییر نمی‌کند.'
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Каждую неделю* و *каждые выходные* هر دو یعنی «هر»، اما ختم کلمه از اسم پیروی می‌کند: کارت بعدی را ببینین.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: '«هر»: مؤنث و جمع'
    gloss: '*Неделя* مؤنث است، پس *каждую неделю* می‌آید. *Выходные* جمع است، پس *каждые выходные* می‌آید.'
    note: '*Каждый* مثل هر صفت دیگر با اسمش هماهنگ می‌شود: *каждый день* (مذکر)، *каждую неделю* (مؤنث، مفعولی)، *каждые выходные* (جمع).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: ناستیا از سرگرمی‌ها شروع می‌کند
    gloss: 'ناستیا: ما اکثراً با هم قدم می‌زنیم. تو در وقت فارغ دیگر چه کار می‌کنی، دیما؟'
    note: '*Мы часто гуляем вместе*: برای *мы* (ما) فعل با ختم *-ем* می‌آید، و *гулять* یعنی برای تفریح قدم زدن.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: سرگرمی‌های دیما
    gloss: 'دیما: من آشپزی را دوست دارم، در خانه هم. و اکثراً ورزش هم می‌کنم.'
    note: '*И дома тоже* (در خانه هم): *и ... тоже* نشان می‌دهد که دیما برای تفریح آشپزی می‌کند، نه فقط در کار.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: ناستیا حیران می‌شود
    gloss: 'ناستیا: تو در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کار آشپزی می‌کنی!'
    note: '*Весь день* (تمام روز) تأکید می‌کند که دیما در کار خود همین حالا هم چقدر آشپزی می‌کند. *Весь* با *день* که مذکر است هماهنگ می‌شود.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: دیما توضیح می‌دهد
    gloss: 'دیما: بلی، ولی آشپزی برایم آرامش‌بخش است. و تو، چی کار کردن را دوست داری؟'
    note: '*Готовить меня расслабляет* اول کار را می‌آورد: معنی لفظی‌اش «آشپزی مرا آرام می‌کند» است و *меня* در حالت مفعولی (аккузатив) آمده است.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: سرگرمی‌های ناستیا
    gloss: 'ناستیا: من کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم.'
    note: 'دو فعل سرگرمی از درس‌های پیشین با *и* (و) وصل شده‌اند: *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: دیما درباره بازی می‌پرسد
    gloss: 'دیما: تو هم بازی (گیم) می‌کنی؟'
    note: 'یک سوال کوتاه بلی/نخیر: در روسی ترتیب کلمه‌ها همان می‌ماند و فقط آهنگ صدا بالا می‌رود: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: ناستیا جواب می‌دهد
    gloss: 'ناستیا: نخیر، من هرگز بازی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Никогда не* (هرگز) پیش از فعل یک *не* اضافی لازم دارد. *Иногда* (گاهی) در برابر آن قرار دارد.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و دیما اکثراً با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. دیما آشپزی کردن را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من کتاب خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم. گاهی نقاشی می‌کشم، ولی هرگز بازی نمی‌کنم. تو در وقت فراغت چی کار کردن را دوست داری؟
    note: پیام ناستیا مطالب درس چهارم را مرور می‌کند و با پرسش اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      гуляем: قدم می‌زنیم
      часто: اکثراً
      вместе: با هم
      другие: دیگر
      готовить: آشپزی می‌کند
      любит: دوست دارد
      дома: در خانه
      занимается: ورزش می‌کند
      читать: خواندن
      слушаю: گوش می‌کنم
      музыку: موسیقی
      рисую: نقاشی می‌کنم
      иногда: گاهی
      играю: ویدیوگیم بازی می‌کنی
      никогда: هرگز
      свободное: آزاد
      время: وقت
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: دیما درباره رخصتی آخر هفته می‌پرسد
    gloss: 'دیما: این آخر هفته چی کار می‌کنی؟'
    note: '*В эти выходные* (این آخر هفته): *выходные* جمع است، پس *эти* هم جمع است و *в* با زمان، حالت مفعولی (аккузатив) می‌گیرد.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: ناستیا هنوز تصمیم نگرفته
    gloss: 'ناستیا: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: '*Хочу ещё выйти на улицу* یعنی «می‌خواهم بیرون هم بروم». *Хочу* شکل ضمیر *я* از فعل *хотеть* است.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: دیما یک برنامه پیشنهاد می‌کند
    gloss: 'دیما: بیا با هم قدم بزنیم؟ بعدش برای ما غذا می‌پزم.'
    note: '*Давай погуляем* روش معمول پیشنهاد کاری به‌صورت دسته‌جمعی است و *потом* (بعدش) قدم بعدی را به ترتیب می‌آورد.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: ناستیا موافقت می‌کند
    gloss: 'ناستیا: فکر خوب است! هم قدم زدن را دوست دارم و هم آشپزی را.'
    note: '*Мне нравится* معنی لفظی‌اش «برایم پسندیده است» می‌باشد: شخص در حالت дательный (*мне*) می‌آید و چیزی که پسند است بعد از آن می‌آید.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: دیما تأیید می‌کند
    gloss: 'دیما: عالی. پس روز شنبه همدیگر را می‌بینیم!'
    note: '*Увидимся в субботу* (شنبه می‌بینیم): *в* با روزهای هفته حالت مفعولی (аккузатив) می‌گیرد، پس *суббота* به *субботу* تبدیل می‌شود.'
