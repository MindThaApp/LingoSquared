teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: بیا برویم...
    note: Давай نشانهٔ پیشنهاد غیررسمی است («بیا»)؛ пойдём شکل آیندهٔ «ما» از فعل «رفتن» است و با هم برای پیشنهاد یک کار می‌آیند.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: سینما
    note: кино اسم خنثی و بی‌صرف است و معنایش «سینما» است.
    example_gloss: بیا به سینما برویم.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: فردا، روز شنبه
    note: завтра یعنی «فردا»؛ در в субботу برای روز هفته в با حالت винительный می‌آید.
    example_gloss: بیا فردا به سینما برویم.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: خوب است، موافقم.
    note: согласен («موافق») را گوینده مرد می‌گوید؛ گوینده زن می‌گوید согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: متأسفانه نمی‌توانم.
    note: К сожалению («متأسفانه») رد کردن را نرم‌تر می‌کند؛ не могу یعنی «نمی‌توانم».
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: ساعت چند همدیگر را می‌بینیم؟
    note: Во сколько دربارهٔ ساعت می‌پرسد؛ встретимся شکل آیندهٔ «ما» از فعل «ملاقات کردن» است.
    example_gloss: بیا بگوییم ساعت هفت.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: ناستیا برنامه‌ای پیشنهاد می‌کند
    gloss: 'ناستیا: بیا روز شنبه به سینما برویم.'
    note: Настя گفتگو را با Давай пойдём в кино в субботу شروع می‌کند.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: دیما قبول می‌کند و ساعت را می‌پرسد
    gloss: 'دیما: خوب است، موافقم. ساعت چند همدیگر را می‌بینیم؟'
    note: Дима قبول می‌کند، بعد می‌پرسد Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: ناستیا وقت و جا را پیشنهاد می‌کند
    gloss: 'ناستیا: بیا ساعت هفت، پیش سینما.'
    note: у кинотеатра یعنی «پیش سینما / نزدیک سینما»؛ در اینجا у با حالت اضافی (genitive) آمده است.
