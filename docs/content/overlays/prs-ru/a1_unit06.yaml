teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: من ... دارم
    note: معنی تحت‌اللفظی آن «نزد من (هست) ...» است و روش معمول روسی برای گفتن «من ... دارم» است. در درس ۳ جملهٔ У меня два брата هم از همین ساختار У меня استفاده شد؛ وقتی جمله دربارهٔ تعداد است، есть معمولاً حذف می‌شود.
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: این ... است
    note: Это برای معرفی کردن یا نشان دادن یک شخص یا یک چیز استفاده می‌شود، بدون اینکه جنسیت دستوری آن شخص مهم باشد.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: مادر، پدر
    note: мать یکی از چند اسم مؤنث اندک روسی است که به نرم‌نشان (-ь) ختم می‌شوند.
    example_gloss:
    - این مادرم است.
    - این پدرم است.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: برادر، خواهر
    note: брат همان کلمه‌ای است که در درس ۳ با آن شمردید («У меня два брата»)؛ сестра همتای مؤنث آن است.
    example_gloss:
    - این برادرم است.
    - من یک خواهر دارم.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: من/مال من (مذکر)، من/مال من (مؤنث)
    note: мой با اسم‌های مذکر مثل отец و брат می‌آید؛ моя با اسم‌های مؤنث مثل мать و сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: مادرکلان، پدرکلان
    note: 'هر دو به -а ختم می‌شوند، اما дедушка به یک مرد اشاره دارد و در مطابقت مذکر است: мой дедушка، ولی моя бабушка.'
    example_gloss:
    - این مادرکلانم است.
    - این پدرکلانم است.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: شوهر، زن
    note: муж مذکر است و жена مؤنث، مطابق الگوی عادی پایان اسم‌ها.
    example_gloss:
    - این شوهر من است.
    - این زن من است.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: پسر، دختر
    note: дочь هم مثل мать اسم مؤنثی است که به نرم‌نشان (-ь) ختم می‌شود.
    example_gloss: من یک پسر و یک دختر دارم.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: بچه‌ها
    note: дети جمع بی‌قاعدهٔ ребёнок («بچه») است؛ مفرد و جمع آن دو کلمهٔ کاملاً متفاوت اند.
    example_gloss: شما بچه دارید؟
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: آیا ... دارید؟ (رسمی)
    note: از вас رسمی استفاده می‌کند، مطابق با شیوهٔ вы در درس ۲.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: این کیست؟
    note: روش معمول برای پرسیدن اینکه کسی کیست، مثلاً وقتی به یک عکس نگاه می‌کنین.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: نامش آنا است.
    note: تحت‌اللفظی «او را آنا صدا می‌کنند» است؛ Её («او را») مفعول فعل зовут است، نه فاعل.
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: ماکسیم دربارهٔ عکس می‌پرسد
    gloss: 'ماکسیم: این کیست در عکس؟'
    note: ماکسیم با اشاره به عکس شروع می‌کند و می‌پرسد Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: اولگا خانواده‌اش را معرفی می‌کند
    gloss: 'اولگا: این خانوادهٔ من است.'
    note: Это моя семья از семья («خانواده») استفاده می‌کند که اسم مؤنث است، پس моя با آن مطابقت دارد.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: اولگا سه عضو خانواده را نام می‌برد
    gloss: 'اولگا: این هم پدرم، مادرم و برادرم.'
    note: Вот («این هم») فهرست را شروع می‌کند؛ هر ضمیر ملکی (мой/моя) با اسمی که بعد از آن می‌آید مطابقت دارد.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: ماکسیم دربارهٔ دختر می‌پرسد
    gloss: 'ماکسیم: و این دختر کیست؟'
    note: А پرسش بعدی ماکسیم دربارهٔ نفر چهارم در عکس را به‌طور طبیعی شروع می‌کند.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: اولگا نام دخترش را می‌گوید
    gloss: 'اولگا: این دختر من است. نامش آنا است.'
    note: اولگا با моя дочь جواب می‌دهد و بعد با Её зовут Анна نام را می‌گوید.
