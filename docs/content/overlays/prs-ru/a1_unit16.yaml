teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: سرم درد می‌کند.
    note: у меня یعنی «من دارم» (به معنای لفظی «نزد من»)؛ болит یعنی «درد می‌کند» و با فاعل مفرد مثل голова (سر) می‌آید.
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: شکم
    note: живот یعنی «شکم». همین الگوی у меня болит... را با هر عضو بدن به کار ببرید.
    example_gloss: دلم درد می‌کند.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: گلو
    note: горло یعنی «گلو».
    example_gloss: گلویم درد می‌کند.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: تب دارم.
    note: температура در اصل یعنی «حرارت»، ولی در روسی راه معمول گفتن «تب» همین است.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: سرماخوردگی
    note: простуда یعنی «سرماخوردگی» (مریضی). У меня простуда یعنی «سرما خورده‌ام».
    example_gloss: من زکام استم.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: حالم بد است.
    note: Мне плохо راه عمومی گفتن است که حالتان خوب نیست، بدون اینکه نشانهٔ مشخصی را نام ببرید.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: دیما به داکتر سلام می‌کند
    gloss: 'دیما: سلام! سر و گلویم درد می‌کند.'
    note: Дима با Здравствуйте! که شکل رسمی است شروع می‌کند، چون داکتر برایش بیگانه است.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: داکتر می‌پرسد کجا درد می‌کند
    gloss: 'داکتر: کجایتان درد می‌کند؟ سر و گلو؟'
    note: داکتر شکل رسمی вас («شما»، رسمی/جمع) را به جای тебя (غیررسمی) به کار می‌برد.
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: دیما یک نشانهٔ دیگر را هم می‌گوید
    gloss: 'دیما: بلی، و تب هم دارم.'
    note: ещё یعنی «همچنان / علاوه بر آن» — и ещё... یک چیز دیگر را به گفته‌های قبلی اضافه می‌کند.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: داکتر مشوره می‌دهد
    gloss: 'داکتر: شما باید استراحت کنید و آب زیاد بنوشید.'
    note: Вам нужно + مصدر یعنی «شما باید...»؛ вам شکل رسمی «به شما» در حالت داتیو است.
