teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: چطور به ... برسم؟
    note: Как дойти до...? راه معمول و مؤدبانه برای پرسیدن آدرس از یک شخص ناشناس است؛ بعد از آن مقصد در حالت اضافی (genitive) می‌آید.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: موزیم
    note: музей مذکر است؛ музея شکل genitive آن است که بعد از до («تا») می‌آید.
    example_gloss: چطور به موزیم برسم؟
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: سیده / مستقیم
    note: прямо برای مستقیم رفتن است؛ Идите شکل امرِ مؤدبانهٔ «بروید» است.
    example_gloss: مستقیم برو.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: طرف راست
    note: направо جهت حرکت را نشان می‌دهد (پیچیدن به راست)؛ потом یعنی «بعد».
    example_gloss: مستقیم بروید، بعد به طرف راست.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: طرف چپ
    note: налево جهت حرکت را نشان می‌دهد و مقابل направо است.
    example_gloss: به چپ بپیچ.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: بپیچید (امر مؤدبانه)
    note: поверните امر مؤدبانهٔ повернуть («پیچیدن») است؛ за углом یعنی «پشت کنج».
    example_gloss: پشت کنج به چپ بپیچید.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: بلاک، دور
    note: квартал یک بلاکِ شهر است (квартала بعد از два)؛ далеко یعنی «دور» و отсюда یعنی «از اینجا».
    example_gloss:
    - دو بلاک بروید.
    - آنجا از اینجا دور است؟
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: سیاح راه را می‌پرسد
    gloss: 'سیاح: معذرت، چطور به موزیم برسم؟'
    note: Турист پیش از پرسیدن Как дойти до музея? با Простите («معذرت») شروع می‌کند.
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: رهگذر راه را نشان می‌دهد
    gloss: 'رهگذر: خیلی آسان است. دو بلاک مستقیم بروید، بعد به راست بپیچید.'
    note: Прохожий با Это очень просто جواب می‌دهد، بعد راهنمایی دو مرحله‌ای با Идите و поверните می‌دهد.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: سیاح می‌پرسد دور است یا نه
    gloss: 'سیاح: آنجا از اینجا دور است؟'
    note: Это далеко отсюда? برای پرسیدن فاصلهٔ پیاده‌روی است.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: رهگذر وقت را تخمین می‌کند
    gloss: 'رهگذر: نه، پنج دقیقه پیاده.'
    note: Прохожий با Нет, пять минут пешком («پیاده») جواب می‌دهد.
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: سیاح از رهگذر تشکر می‌کند
    gloss: 'سیاح: بسیار تشکر.'
    note: Спасибо большое گفتگو را مؤدبانه تمام می‌کند.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: رهگذر جواب می‌دهد
    gloss: 'رهگذر: خواهش می‌کنم.'
    note: Пожалуйста جواب спасибо است، یعنی «خواهش می‌کنم».
