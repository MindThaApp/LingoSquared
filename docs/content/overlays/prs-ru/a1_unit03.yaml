teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: من ... دارم
    note: در اصل یعنی «نزد من (است) ...»؛ روسی برای «داشتن» فعل جداگانه نمی‌گیرد و راه معمول گفتن آن همین ساختار است.
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: یک، دو
    note: بعد از два («دو») اسم یک شکل خاص مفرد حالت родительный می‌گیرد؛ брат («برادر») می‌شود брата، نه جمع معمولی.
    example_gloss:
    - من یک برادر دارم.
    - من دو برادر دارم.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: سه، چهار
    note: Три و четыре هم مثل два همین شکل مفرد родительный اسم را می‌گیرند؛ книга («کتاب») بعد از هر کدام از два/три/четыре می‌شود книги.
    example_gloss:
    - من سه کتاب دارم.
    - من چهار کتاب دارم.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: پنج
    note: از пять («پنج») به بعد اسم شکل جمع родительный را می‌گیرد؛ рубль («روبل») می‌شود рублей، نه рубли.
    example_gloss: من پنج روبل دارم.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: برادر؛ برادرها (بعد از ۲ تا ۴)
    note: брата شکل مفرد родительный است که مخصوصاً بعد از два، три و четыре می‌آید، نه جمع معمولی.
    example_gloss: من دو برادر دارم.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: کتاب؛ کتاب‌ها (بعد از ۲ تا ۴)
    note: книги هم همان الگوی مفرد родительный брата است که بعد از два، три و четыре می‌آید.
    example_gloss: من سه کتاب دارم.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: روبل؛ روبل‌ها (از ۵ به بالا)
    note: рублей شکل جمع родительный است که از пять («پنج») به بالا استعمال می‌شود.
    example_gloss: من پنج روبل دارم.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: شش، هفت
    note: مثل пять، شесть و семь هم اسم را به شکل جمع родительный می‌گیرند.
    example_gloss:
    - ساعت شش است.
    - من هفت روبل دارم.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: هشت، نه
    note: 'هر دو همین الگوی جمع родительный را ادامه می‌دهند: книга می‌شود книг و рубль می‌شود рублей.'
    example_gloss:
    - من هشت کتاب دارم.
    - من نه روبل دارم.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: ده
    note: در گفتن سن هم استعمال می‌شود، مثل Мне десять лет («من ده ساله استم»).
    example_gloss: من ده ساله استم.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: کتاب‌ها (جمع родительный، از ۵ به بالا)
    note: شکل جمع родительный کلمهٔ книга که از пять به بالا می‌آید؛ توجه کنید که مصوت آخر کاملاً می‌افتد، برخلاف книги که بعد از два/три/четыре می‌آید.
    example_gloss: من نه کتاب دارم.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: من ده ساله استم.
    note: سن در روسی با حالت дательный «мне» («برای من») و عدد و лет (جمع родительный «سال») گفته می‌شود و فعل «بودن» ندارد.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: شما چند ساله استید؟ (محترمانه)
    note: شکل رسمی дательный یعنی вам استعمال شده که با سطح вы در بخش ۲ مطابقت دارد.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: این چند است؟
    note: راه معمول پرسیدن قیمت یک جنس؛ فعل стоит («قیمت دارد»، مفرد) در آن استعمال می‌شود.
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: سیب‌ها چند است؟
    note: چون яблоки («سیب‌ها») جمع است، стоят (شکل جمع «قیمت دارند») استعمال شده؛ برخلاف стоит مفرد در Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: روبل (۱)؛ روبل (۲ تا ۴)؛ روبل (۵ به بالا)
    note: 'کلمهٔ «روبل» مطابق عددی که پیش از آن می‌آید تغییر می‌کند: بعد از یک рубль، بعد از два/три/четыре рубля، و از пять به بالا рублей.'
    example_gloss:
    - این یک روبل قیمت دارد.
    - این دو روبل قیمت دارد.
    - این پنج روبل قیمت دارد.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: مشتری به فروشنده سلام می‌دهد
    gloss: 'مشتری: سلام! سیب‌ها چند است؟'
    note: مشتری در دکان بازار پیش از پرسیدن قیمت مودبانه با Здравствуйте شروع می‌کند.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: فروشنده جواب می‌دهد
    gloss: 'فروشنده: سه روبل.'
    note: Три рубля شکل ۲ تا ۴ مفرد родительный «روبل» را استعمال می‌کند که با три مطابقت دارد.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: مشتری در مورد نان می‌پرسد
    gloss: 'مشتری: و نان چند پیسه است؟'
    note: مشتری با گفتن А («و») به شکل نرم، سوال بعدی را درباره جنس دوم می‌پرسد.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: فروشنده دوباره جواب می‌دهد
    gloss: 'فروشنده: شش روبل.'
    note: Шесть рублей شکل جمع حالت اضافی (родительный) را می‌گیرد که برای عدد پنج و بالاتر از آن استفاده می‌شود، مثل шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: مشتری با ادب خداحافظی می‌کند
    gloss: 'مشتری: خوب است، تشکر!'
    note: Хорошо, спасибо! گفتگوی بازار را دوستانه ختم می‌کند و از واژه‌های درس سلام و احوالپرسی استفاده می‌کند.
