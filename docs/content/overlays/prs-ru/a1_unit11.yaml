    example_gloss: من ساعت هشت چاشت می‌خورم.
  ru.a1.unit11.lesson01.teach.kogda:
    title: Когда вы встаёте?
    gloss: شما چه وقت از خواب بلند می‌شوید؟
    note: Когда یعنی «کی»؛ вы «شما» به شکل مؤدبانه یا جمع است.
  ru.a1.unit11.lesson02.teach.rabotayu:
    title: работаю
    gloss: من کار می‌کنم
    note: работаю صیغهٔ اول شخص مفرد работать («کار کردن») است؛ с ... до ... یعنی «از ... تا ...» برای بازهٔ زمانی.
    example_gloss: من از ساعت نه تا پنج کار می‌کنم.
  ru.a1.unit11.lesson02.teach.uzhinayu:
    title: ужинаю
    gloss: من نان شب می‌خورم
    note: ужинаю صیغهٔ اول شخص مفرد ужинать («نان شب خوردن») است؛ вечером یعنی «شام‌گاهی.»
    example_gloss: شام‌گاهی نان شب می‌خورم.
  ru.a1.unit11.lesson02.teach.lozhus_spat:
    title: ложусь спать
    gloss: من می‌خوابم
    note: ложусь спать عبارت بازتابی («دراز کشیدن برای خواب») و به معنی «خواب رفتن» است.
    example_gloss: من ساعت یازده می‌خوابم.
  ru.a1.unit11.lesson03.teach.oleg_chto_delayete:
    title: اولگ دربارهٔ صبح می‌پرسد
    gloss: 'اولگ: شما صبح چی کار می‌کنین؟'
    note: Олег با Что вы делаете утром? شروع می‌کند.
  ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu:
    title: ماریا صبح خود را شرح می‌دهد
    gloss: 'ماریا: من ساعت هفت از خواب پا می‌شوم، بعد ساعت هشت نان چاشت می‌خورم.'
    note: Мария دو کار را پشت هم می‌گوید و آن‌ها را با потом («بعد») وصل می‌کند.
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete:
    title: اولگ دربارهٔ ساعت‌های کار می‌پرسد
    gloss: 'اولگ: و شما کی کار می‌کنین؟'
    note: А پرسش بعدی اولگ را به نرمی شروع می‌کند.
  ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu:
    title: ماریا بقیهٔ روز خود را شرح می‌دهد
    gloss: 'ماریا: من از ساعت نه تا پنج کار می‌کنم. شام‌گاهی نان شب می‌خورم و ساعت یازده می‌خوابم.'
    note: Мария اول ساعت‌های کارش و بعد برنامهٔ شامگاهی‌اش را می‌گوید.
  ru.a1.unit11.lesson03.teach.oleg_ponyatno:
    title: اولگ تأیید می‌کند
    gloss: 'اولگ: فهمیدم، تشکر.'
    note: Понятно, спасибо گفتگو را تمام می‌کند.
