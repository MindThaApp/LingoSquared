    title: انا از ویکتور تشکر می‌کند
    gloss: 'انا: بسیار تشکر.'
    note: «Спасибо большое» با «большое» (بزرگ) «спасибо» را قوی‌تر می‌سازد و راه معمول گفتن «بسیار تشکر» است.
