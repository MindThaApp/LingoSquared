    gloss: 'انا: در سرک شما چه چیز است؟'
    note: انا گفتگو را با «Что есть на вашей улице?» شروع می‌کند.
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: ویکتور سه جا را نام می‌برد
    gloss: 'ویکتور: در سرک من یک دکان، یک کتابخانه و یک بانک است.'
    note: «На моей улице есть» با «есть» (وجود دارد) چیزها را فهرست می‌کند و آن‌ها با «и» وصل می‌شوند.
