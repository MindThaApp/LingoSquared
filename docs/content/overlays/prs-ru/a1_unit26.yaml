teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Высокий* برای آدم قدبلند و *невысокий* برای آدم قدکوتاه استفاده می‌شود (لفظاً «نه بلند»). ختم کلمه با جنسیت تغییر می‌کند: *высокая*، *невысокая*.'
    example_gloss:
    - لینا قدبلند است.
    - ایگور قدکوتاه است.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Старый* و *молодой* در اینجا تأثیر عمومی از سن را نشان می‌دهند، نه تعداد دقیق سال‌ها.'
    example_gloss:
    - بابه کلان پیر است.
    - دیما جوان است.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: صفت با جنسیت تغییر می‌کند
    gloss: 'صفت با شخص هماهنگ می‌شود: *он высокий, она высокая*؛ *он старый, она старая*.'
    note: صفت‌های مذکر به *-ый*، *-ий* یا *-ой* ختم می‌شوند (*высокий*، *молодой*)؛ صفت‌های مؤنث به *-ая* ختم می‌شوند (*высокая*، *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: لینا قدبلند است و ایگور قدکوتاه
    gloss: لینا قدبلند است و ایگور قدکوتاه.
    note: 'دو جمله با *а* (در حالی که، و) پهلوی هم گذاشته می‌شوند: *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: مو
    gloss: مو
    note: '*Волосы* (مو) در روسی جمع است: *У Насти светлые волосы*؛ هرگز به شکل مفرد نمی‌آید.'
    example_gloss: دیما موهای کوتاه سیاه دارد.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: 'سه رنگ مو به شکل جمع تا با *волосы* هماهنگ شوند: *светлые*، *каштановые*، *седые*.'
    example_gloss:
    - ناستیا موهای بور دارد.
    - ایگور موهای قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Длинные* (دراز) و *короткие* (کوتاه) هم با *волосы* که جمع است هماهنگ می‌شوند.'
    example_gloss:
    - لینا موهای دراز دارد.
    - ایگور موهای کوتاه دارد.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: صفت‌ها با волосы هماهنگ می‌شوند
    gloss: '*Волосы* جمع است، پس صفت هم جمع می‌آید: *длинные волосы*، *короткие волосы*، *светлые волосы*، *чёрные волосы*.'
    note: صفت‌های جمع به *-ые* یا *-ие* ختم می‌شوند. همین ختم را در درس بعدی با *глаза* هم می‌بینین.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У و حالت родительный
    gloss: 'بعد از *у* صاحب چیز در حالت родительный می‌آید: *у Насти* (ناستیا دارد)، *у Димы* (دیما دارد)، *у неё* (او دارد).'
    note: 'روسی «داشتن» را این‌طور می‌گوید: *у* + родительный + چیزی که دارد. فعل «داشتن» وجود ندارد.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: دیما موهای کوتاه سیاه دارد
    gloss: دیما موهای کوتاه سیاه دارد.
    note: '*Чёрные* (سیاه) با *волосы* که جمع است هماهنگ می‌شود. حرف *ё* در این کورس همیشه نوشته می‌شود.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: ناستیا موهای دراز بور دارد
    gloss: ناستیا موهای دراز بور دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  ru.a1.unit26.lesson03.teach.glaza:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Глаза* (چشم‌ها) جمع *глаз* است؛ ختم جمع *-а* است.'
    example_gloss: دیما چشم‌های قهوه‌یی دارد.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: '*Голубые* آبی روشن است، *карие* قهوه‌یی فقط برای چشم است و *зелёные* سبز است. هر سه جمع استند.'
    example_gloss:
    - ناستیا چشم‌های آبی دارد.
    - ایگور چشم‌های قهوه‌یی دارد.
    - لینا چشم‌های سبز دارد.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: صفت‌ها با глаза هماهنگ می‌شوند
    gloss: '*Глаза* جمع است، پس صفت هم جمع می‌آید: *голубые глаза*، *карие глаза*، *зелёные глаза*.'
    note: 'چشم قهوه‌یی *карие* است نه *коричневые*، و موی قهوه‌یی *каштановые*: روسی برای چشم و مو کلمه‌های جدا دارد.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: ناستیا چه شکلی دارد؟
    gloss: ناستیا چه شکلی دارد؟
    note: '*Как выглядит ...?* سوال اصلی این واحد است. فعل *выглядит* با فاعل مفرد هماهنگ می‌شود.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: ناستیا موهای دراز بور و چشم‌های آبی دارد
    gloss: ناستیا موهای دراز بور و چشم‌های آبی دارد.
    note: 'در جواب نمونه، مو و چشم با *и* وصل می‌شوند: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: ناستیا نینا را معرفی می‌کند
    gloss: 'ناستیا: یک دختر نو به کافهٔ زبان می‌آید. نامش نینا است.'
    note: '*Придёт* (خواهد آمد) آیندهٔ تام است. *Её зовут Нина* لفظاً یعنی «او را نینا صدا می‌کنند».'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: دیما می‌پرسد او چه شکلی دارد
    gloss: 'دیما: خوب! او چه شکلی دارد؟'
    note: باز هم سوال اصلی، این بار با *она* (او) به جای نام.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: ناستیا قد و موی نینا را توصیف می‌کند
    gloss: 'ناستیا: او قدکوتاه است و موهای کوتاه بور دارد.'
    note: '*невысокая* از درس اول را با کلمه‌های مو از درس دوم یکجا می‌کند. *И у неё* حقیقت دوم را اضافه می‌کند.'
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: دیما دربارهٔ چشم‌های او می‌پرسد
    gloss: 'دیما: و چشم‌هایش؟'
    note: '*Какие у неё глаза?* از *у неё* («او دارد») کار می‌گیرد. *Неё* شکل *она* بعد از حرف اضافهٔ *у* است.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: ناستیا چشم‌های نینا را توصیف می‌کند
    gloss: 'ناستیا: او چشم‌های سبز دارد.'
    note: '*зелёные глаза* از درس سوم دوباره می‌آید، با *у неё* برای «او دارد».'
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: دیما او را می‌شناسد
    gloss: 'دیما: تشکر! پس او را می‌شناسم.'
    note: '*Я её узнаю* (او را می‌شناسم): *её* حالت винительный *она* است، چون نینا مفعول است.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: مقایسهٔ ایگور و لینا
    gloss: ایگور و لینا برادر و خواهر استند، اما ظاهرشان فرق دارد. ایگور قدکوتاه است و موهای کوتاه قهوه‌یی و چشم‌های قهوه‌یی دارد. لینا از ایگور قدبلندتر است و موهای دراز قهوه‌یی و چشم‌های سبز دارد. تو چه شکلی استی؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      брат: برادر
      сестра: خواهر
      выглядят: ظاهر شدن، به نظر آمدن
      по-разному: فرق دار
      невысокий: کوتاه
      короткие: کوتاه
      каштановые: قهوه‌یی
      волосы: مو
      карие: قهوه‌یی
      глаза: چشم‌ها
      выше: قدبلندتر
      длинные: دراز
      зелёные: سبز
      выглядишь: تو معلوم می‌شوی / به نظر می‌رسی (مثل как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: مقایسه با выше
    gloss: 'بعد از *выше* (قدبلندتر) کسی که با او مقایسه می‌شود در حالت родительный می‌آید: *Лена выше Игоря*.'
    note: صفت تفضیلی *выше* با جنسیت تغییر نمی‌کند. کسی که با او مقایسه می‌شود در родительный می‌آید یا بعد از *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: موهای لینا از موهای ایگور درازتر است
    gloss: موهای لینا از موهای ایگور درازتر است.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* هرگز تغییر نمی‌کند و *чем* (از) بخش دوم را شروع می‌کند.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: 'یک جملهٔ نمونه برای ظاهر خودتان: *У меня* («من دارم») + صفت + اسم.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: دیما نینا را می‌بیند
    gloss: 'دیما: ببین، این نینا است؟ او موهای کوتاه بور و چشم‌های سبز دارد.'
    note: '*Смотри* (ببین) شکل غیررسمی امر است، مثل دیالوگ‌های قبلی.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: ناستیا تأیید می‌کند
    gloss: 'ناستیا: بلی، این نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: نینا به دیما سلام می‌کند
    gloss: 'نینا: سلام، تو دیما استی؟'
    note: 'یک سوال ساده و غیررسمی: روسی به فعل «بودن» ضرورت ندارد، فقط *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: دیما هم به نینا سلام می‌کند
    gloss: 'دیما: بلی! از آشنایی با تو خوشحال شدم، نینا.'
    note: '*Приятно познакомиться* عبارت معمول برای اولین دیدار با کسی است. *Познакомиться* یعنی با شخص نو آشنا شدن.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: دیالوگ را ختم می‌کند — دیما نینا را از توصیف قبلی ناستیا شناخت.
