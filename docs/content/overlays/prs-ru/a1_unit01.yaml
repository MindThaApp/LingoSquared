teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: جهت خواندن
    gloss: الفبای روسی از چپ به راست خوانده می‌شود، برعکس دری که از راست به چپ نوشته می‌شود.
    note: خط روسی (سیریلیک) از چپ به راست خوانده می‌شود، یعنی برعکس خط دری. پس عادت خواندن را باید عوض کنید و علاوه بر آن شکل‌ها و صدای حروف نو را هم یاد بگیرین.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: حرف З
    note: مثل «ز» در «زمین» تلفظ می‌شود. شکل کوچک آن، з، شبیه عدد ۳ است.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: حرف Д
    note: مثل «د» در «دروازه» تلفظ می‌شود. شکل کوچک д با «پایه‌های» کوتاه زیر خط نوشته می‌شود و به حرف لاتین «d» شباهت ندارد؛ پس شکل آن را از نو یاد بگیرین.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: حرف Р
    note: مثل «ر» دری، غلتان تلفظ می‌شود. شکلش شبیه «P» لاتین است، اما صدای «پ» ندارد؛ پس آن را «پ» نخوانید.
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: حرف А
    note: مثل «ا» در «بابا» تلفظ می‌شود. شکلش با «A/a» لاتین یکسان است و صدایش هم نزدیک به آن است.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: حرف В
    note: مثل «v» در «ویزا» تلفظ می‌شود. شکلش شبیه «B» لاتین است؛ از این شباهت فریب نخورید.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: حرف С
    note: مثل «س» در «سیب» تلفظ می‌شود. شکلش شبیه «C/c» لاتین است، اما در روسی هیچ‌وقت صدای «ک» نمی‌دهد.
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: حرف Т
    note: مثل «ت» در «تاب» تلفظ می‌شود. شکل کوچک т در دست‌نویس گاهی مثل «m» کوچک نوشته می‌شود؛ اول شکل چاپی را یاد بگیرین.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: حرف У
    note: مثل «و» کشیده در «دود» تلفظ می‌شود. شکلش شبیه «y» لاتین است، اما صدایش با آن فرق دارد.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: حرف Ye
    note: در آغاز کلمه یا بخش (سیلاب) مثل «یک» در «یخ» تلفظ می‌شود. شکلش با «E/e» لاتین یکسان است، اما صدایش کاملاً فرق دارد.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ و ь: علامت سخت و علامت نرم'
    gloss: علامت سخت ъ و علامت نرم ь صدای مخصوص خود ندارند؛ تلفظ حرف کنار خود را تغییر می‌دهند.
    note: این دو علامت به‌تنهایی صدایی ندارند؛ ь حرف بی‌صدای پیش از خود را نرم می‌سازد و ъ صداها را سخت از هم جدا می‌کند. وقتی در کلمه‌های واقعی بیایند، دوباره به آن‌ها برمی‌گردیم.
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: حرف Й (ی کوتاه)
    note: مثل «ی» در «سایه» تلفظ می‌شود؛ یک صدای سریع و لغزنده است، نه مصوت کامل. این حرف در Здравствуйте هم آمده، همان کلمه‌ای که درس به آن می‌رسد.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: سلام (رسمی)
    note: سلام کامل و رسمی که از حروف همین درس ساخته شده است. دراز و پر از حرف بی‌صدا به نظر می‌رسد، اما همهٔ حروف آن را در همین درس دیده‌اید.
    example_gloss: سلام! اسم من ویکتور است.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: سلام (رسمی)؛ سلام (غیررسمی)
    note: Здравствуйте سلام مطمئن و رسمی است که در هر وقت روز و با هر شخص نااشنا گفته می‌شود. Привет سلام دوستانه است و با دوستان و همسن‌وسالان استفاده می‌شود.
    example_gloss:
    - سلام! چطور استید؟ (رسمی)
    - سلام! چطور استی؟ (غیررسمی)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: صبح بخیر
    note: در صبح گفته می‌شود، تقریباً تا نزدیک چاشت.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: روز بخیر / سلام
    note: سلام معمول روز است و از نزدیک چاشت تا بعد از ظهر گفته می‌شود.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: شام بخیر
    note: وقتی شب جایی می‌رسید گفته می‌شود؛ این سلام است، نه خداحافظی.
  ru.a1.unit01.lesson02.teach.register_note:
    title: انتخاب سلام
    gloss: Здравствуйте برای هر وقت روز و در صحبت مؤدبانه درست است. Привет غیررسمی است و میان دوستان گفته می‌شود.
    note: اگر مطمئن نیستین وقت روز چیست یا با کی صحبت می‌کنین، Здравствуйте همیشه درست است؛ Привет فقط برای کسانی است که خوب می‌شناسید.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: چطور استی؟ (غیررسمی)
    note: راه معمول و غیررسمی احوال‌پرسی، با دوستان و همسن‌وسالان.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: حال شما چطور است؟ (رسمی)
    note: راه رسمی احوال‌پرسی که با شکل احترام вы مطابقت دارد.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: خوب، تشکر
    note: جواب ساده و مثبت که در هر دو حالت رسمی و غیررسمی استفاده می‌شود.
    example_gloss: چطور استی؟ — خوب، تشکر.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: معمولی
    note: جوابی بین خنثی و کمی منفی، وقتی که حال نه خیلی خوب است و نه بد.
    example_gloss: چطور استی؟ — معمولی.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: تو چطور؟ (غیررسمی)
    note: راه غیررسمی که همان سؤال را به طرف مقابل برمی‌گردانید؛ با شکل ты مطابقت دارد.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: خداحافظ (رسمی)
    note: خداحافظی معمول که در هر جا استفاده می‌شود؛ معنای تحت‌اللفظی آن نزدیک به «تا دیدار دوباره» است.
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: بامان خدا (غیررسمی)
    note: راه خیلی معمول و دوستانهٔ خداحافظی میان دوستان و آشنایان.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: تا فردا
    note: خداحافظی دوستانه، وقتی انتظار دارید فردا دوباره آن شخص را ببینین.
  ru.a1.unit01.lesson03.teach.anna:
    title: آنا به مکسیم سلام می‌دهد
    gloss: 'آنا می‌گوید: روز بخیر! چطور استی؟'
    note: آنا و مکسیم همکار استند و در روز به هم سلام می‌دهند؛ کلمهٔ дела نشان می‌دهد که صحبتشان غیررسمی است.
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: مکسیم جواب می‌دهد و می‌پرسد
    gloss: 'مکسیم می‌گوید: خوب، تشکر. تو چطور استی؟'
    note: مکسیم جواب می‌دهد و مثل آنا، غیررسمی سؤال را برمی‌گرداند.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: آنا گفتگو را تمام می‌کند
    gloss: 'آنا می‌گوید: من هم خوبم. خوب، تا فردا!'
    note: آنا صحبت کوتاه را تمام می‌کند و دوستانه خداحافظی می‌کند.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: مکسیم خداحافظی می‌کند
    gloss: 'مکسیم می‌گوید: تا فردا!'
    note: مکسیم خداحافظی آنا را تکرار می‌کند و گفتگو تمام می‌شود.
