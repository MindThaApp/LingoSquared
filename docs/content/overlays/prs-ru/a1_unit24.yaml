    example_gloss: نقد ممکن است.
  ru.a1.unit24.lesson01.teach.rubli:
    title: рубли
    gloss: روبل
    note: рубли واحد پول است؛ بعد از بعضی عددها рублей می‌آید.
    example_gloss: به روبل ضرورت دارم.
  ru.a1.unit24.lesson02.teach.chek_nuzhen:
    title: Чек нужен?
    gloss: رسید لازم دارید؟
    note: нужен با чек که مذکر است هماهنگ می‌شود.
    example_gloss: امروز رسید لازم دارید؟
  ru.a1.unit24.lesson02.teach.s_vas_trista:
    title: С вас триста рублей.
    gloss: سه صد روبل می‌شود.
    note: С вас... جملهٔ معمول صندوقدار برای گفتن مبلغ پرداختی است.
    example_gloss: امروز سه صد روبل می‌شود.
  ru.a1.unit24.lesson02.teach_tolko_nalichnymi:
    title: Только наличными.
    gloss: فقط نقد.
    note: Только یعنی «فقط».
