    title: Можно картой?
    gloss: آیا می‌توانم با کارت پرداخت کنم؟
    note: картой شکل آلتی (instrumental) کلمهٔ карта است و برای پرداخت با کارت به کار می‌رود.
    example_gloss: امروز میتانم با کارت پرداخت کنم؟
