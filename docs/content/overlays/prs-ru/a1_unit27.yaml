teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Животное* کلمهٔ عمومی برای حیوان است. *Домашнее животное* (در اصل «حیوان خانگی») به‌طور خاص یعنی حیوان خانگی که در خانه نگه می‌دارند.'
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم است.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: سگ و پشک
    gloss: سگ / پشک
    example_gloss:
    - ناستیا سگ دارد.
    - ایگور گربه دارد.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: ماهی و پرنده
    gloss: ماهی / پرنده
    example_gloss:
    - پدرکلان یک ماهی دارد.
    - Nina یک پرنده دارد.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: حیوان خانگی داری؟
    gloss: حیوان خانگی داری؟
    note: '*У тебя есть ...?* پرسش «داری؟» است: *у тебя* («نزد تو») + *есть* + چیز.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: بلی، سگ دارم
    gloss: بلی، یک سگ دارم.
    note: یک جواب مثبت ساده با واژه‌های جدید این درس.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: '*Нет* + حالت родительный می‌رساند که چیزی ندارین: *у меня нет домашнего животного*. یادداشت دستوری را ببینین.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет و حالت родительный
    gloss: 'بعد از *нет* چیزی که وجود ندارد در حالت родительный می‌آید: *у меня нет времени*، *у меня нет домашнего животного*.'
    note: 'با حالت مثبت مقایسه کنید: *у меня есть собака* (حالت именительный) اما *у меня нет собаки* (حالت родительный).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: گشت دادن (حیوان)
    gloss: حیوان را به گشت بردن
    note: '*Гулять с собакой* از *с* و حالت творительный یعنی *собакой* کار می‌گیرد. یادداشت دستوری را ببینین.'
    example_gloss: من هر روز سگ را به گشت می‌برم.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С و حالت творительный
    gloss: 'بعد از *с* («با») اسم در حالت творительный می‌آید: *гулять с собакой*، *играть с кошкой*.'
    note: 'اسم‌های مؤنث در حالت творительный به *-ой* یا *-ей* ختم می‌شوند: *собакой*، *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به پشک غذا می‌دهم.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: ایگور با گربه‌اش بازی می‌کند.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: من هر روز سگ را به گشت می‌برم
    gloss: من هر روز سگ را به گشت می‌برم.
    note: '*Каждый день* («هر روز») یک قید زمان است که حرف اضافه ندارد: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: من هر روز به پشک غذا می‌دهم
    gloss: من هر روز به پشک غذا می‌دهم.
    note: '*Кормить* حیوان را به‌صورت مفعول مستقیم در حالت винительный می‌گیرد: *кошка* می‌شود *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: حیوانات بعد از любить
    gloss: 'بعد از *любить* اسم حیوان در حالت винительный می‌آید، که برای اسم‌های جاندار جمع مثل حالت родительный است: *собак*، *кошек*، *птиц*، *рыб*.'
    note: الگوی جمع منظم روسی، که اینجا برای نخستین بار با اسم‌های حیوانات به‌عنوان مثال معرفی می‌شود.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: سگ‌ها و پشک‌ها
    gloss: سگ‌ها / پشک‌ها
    example_gloss:
    - دیما سگ‌ها را دوست دارد.
    - لینا گربه‌ها را دوست دارد.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - کاکا پرنده‌ها را خیلی دوست دارد.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: من حیوانات را خیلی دوست دارم
    gloss: من حیوانات را خیلی دوست دارم.
    note: '*Люблю* + حالت винительный: *Я люблю животных*. برای اسم‌های جاندار جمع، حالت винительный مثل родительный به نظر می‌رسد.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: لینا گربه‌ها را دوست دارد، ولی حیوان خانگی ندارد
    gloss: لینا گربه‌ها را دوست دارد، ولی حیوان خانگی ندارد.
    note: زمینه را برای تضادی آماده می‌کند که متن خواندنی بعدی بر آن ساخته شده است.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: دیما دربارهٔ حیوان خانگی می‌پرسد
    gloss: 'دیما: ناستیا، تو حیوان خانگی داری؟'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: ناستیا سگ دارد
    gloss: 'ناستیا: بلی، سگ دارم.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: دیما می‌پرسد که چه شکلی است
    gloss: 'دیما: چه شکلی است؟'
    note: پرسش *Как он выглядит?* برای حیوانات هم کار می‌رود. *Он* («او» برای نر) برای حیوان خانگی نر استفاده می‌شود.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: ناستیا سگش را توصیف می‌کند
    gloss: 'ناستیا: پشمش قهوه‌یی است و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر و قیافه دوباره آمده‌اند، این بار برای توصیف پشم یک حیوان، نه موی یک شخص.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: он و она برای حیوانات
    gloss: 'یک حیوان خانگی می‌تواند *он* یا *она* باشد، مثل انسان: *У меня собака, он маленький*.'
    note: از نظر دستور، *собака* مؤنث است، اما روس‌ها وقتی بدانند حیوان خانگی نر است، اکثراً *он* می‌گویند.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: دیما از قدم زدن می‌پرسد
    gloss: 'دیما: تو هر روز با او قدم می‌زنی؟'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: ناستیا روال روزانه‌اش را می‌گوید
    gloss: 'ناستیا: بلی، من هر روز با او قدم می‌زنم و به او غذا می‌دهم.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: دیما، لینا و ایگور دربارهٔ حیوانات
    gloss: 'دیما و لینا هر دو حیوانات را دوست دارند، اما هیچ‌کدام‌شان حیوان خانگی ندارند. دیما سگ‌ها را دوست دارد و لینا گربه‌ها را. اما ایگور حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به آن غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      любят: خیلی دوست دارند
      оба: هر دو
      животных: حیوانات
      обоих: هر دو
      домашнего: حیوان خانگی
      собак: سگ‌ها
      кошек: پشک‌ها
      кошка: پشک
      играет: بازی می‌کند
      даёт: می‌دهد
      каждый: هر
      корм: غذا
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: ایگور اکثراً با گربه‌اش بازی می‌کند
    gloss: ایگور اکثراً با گربه‌اش بازی می‌کند.
    note: '*Со своей кошкой*: *со* همان *с* است پیش از چند همخوان پشت سر هم، و *своей* یعنی «از خودش» و به فاعل جمله برمی‌گردد.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: ناستیا از نینا می‌پرسد
    gloss: 'ناستیا: نینا، تو هم حیوان خانگی داری؟'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina یک پرنده به نام Pico دارد
    gloss: 'Nina: بلی، یک پرنده دارم. نامش Pico است.'
    note: '*Его зовут Пико* لفظاً یعنی «او را پیکو صدا می‌کنند». روسی نام را این‌طور می‌گوید.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: واکنش دیما
    gloss: 'دیما: چه خوب! هر روز با او چه کار می‌کنی؟'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina هر روز به او غذا می‌دهد
    gloss: 'Nina: هر روز به او غذا می‌دهم.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: دیما هم پرنده‌ها را دوست دارد
    gloss: 'دیما: من هم پرنده‌ها را دوست دارم.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: ناستیا گفتگو را تمام می‌کند
    gloss: 'ناستیا: چه خوب که ما هر سه حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره حیوانات در این درس را کنار هم جمع‌بندی می‌کند.
