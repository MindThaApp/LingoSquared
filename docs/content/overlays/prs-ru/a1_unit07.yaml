teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: مینو
    note: меню اسم بی‌طرف و تصریف‌ناپذیر است که از فرانسوی گرفته شده -- شکلش هیچ‌وقت تغییر نمی‌کند.
    example_gloss: این هم فهرست غذا.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: پیشخدمت مرد، پیشخدمت زن
    note: официант مذکر و официантка مؤنث است، مطابق الگوی معمول پایان اسم‌ها برای جنسیت.
    example_gloss: پیشخدمت زن در رستورانت کار می‌کند.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: این میز خالی است؟
    note: столик شکل تصغیر стол («میز») است که معمولاً برای میز رستورانت به کار می‌رود؛ свободен («خالی») با اسم مذکر هماهنگ می‌شود.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: بلی، لطفاً بنشینید.
    note: садитесь شکل امر محترمانه/جمع садиться («نشستن») است و با вы به کار می‌رود.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: چه سفارش می‌تین؟
    note: будете заказывать عبارت زمان آینده است («سفارش خواهید داد») که پیشخدمت با آن می‌پرسد مشتری چه می‌خواهد.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: من ... می‌خواهم
    note: хочу شکل اول شخص مفرد хотеть («خواستن») است و برای سفارش غذا و نوشیدنی به کار می‌رود.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: چای، قهوه
    note: چای و кофе هر دو نوشیدنی‌های معمولِ سفارش‌اند؛ кофе تصریف‌ناپذیر و از نظر دستوری مذکر است، با آن‌که به -е ختم می‌شود.
    example_gloss:
    - من چای می‌خواهم.
    - من قهوه می‌خواهم.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: نان، بورش (شوربای چغندر)
    note: борщ شوربای کلاسیک چغندر در روسیه است؛ هر دو اسم مذکرند.
    example_gloss:
    - نان دارید؟
    - من بورش می‌خواهم.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: سالاد
    note: и («و») این‌جا برای وصل کردن دو چیزِ سفارش‌شده به کار رفته، مثل борщ и салат.
    example_gloss: من بورش و سالاد می‌خواهم.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: بستنی
    note: мороженое اسم بی‌طرف است که شبیه صفت دیده می‌شود («چیز یخ‌زده»)؛ این الگو در اسم‌های غذایی روسی معمول است.
    example_gloss: برای دسر بستنی بیاورید.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: لطفاً ... بیاورید
    note: Принесите شکل امر محترمانه/جمع принести («آوردن») است و با вы به کار می‌رود.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: تشکر.
    note: Спасибо شکل معمول تشکر در هر گفتگوی مؤدبانه است.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: پیشخدمت زن می‌پرسد چه سفارش می‌تین
    gloss: 'پیشخدمت: چه سفارش می‌تین؟'
    note: پیشخدمت زن گفتگو را با Что будете заказывать? شروع می‌کند.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: توریست غذا سفارش می‌دهد
    gloss: 'توریست: من بورش و سالاد می‌خواهم.'
    note: Турист («توریست») با Я хочу борщ и салат جواب می‌دهد.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: پیشخدمت زن از نوشیدنی می‌پرسد
    gloss: 'پیشخدمت: چه می‌نوشید؟'
    note: пить («نوشیدن») با будете می‌آید، مثل پرسش قبلی با заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: توریست نوشیدنی سفارش می‌دهد
    gloss: 'توریست: من چای می‌خواهم.'
    note: توریست ساده با Я хочу чай جواب می‌دهد.
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: پیشخدمت زن از دسر می‌پرسد
    gloss: 'پیشخدمت: و برای دسر؟'
    note: А на сладкое? پرسش کوتاهِ دنباله‌دار است -- «و برای بخش شیرین؟»
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: توریست دسر سفارش می‌دهد
    gloss: 'توریست: برای دسر لطفاً بستنی بیاورید.'
    note: توریست با На сладкое принесите мороженое, пожалуйста جواب می‌دهد.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: پیشخدمت زن سفارش را تأیید می‌کند
    gloss: 'پیشخدمت: خوب است. تشکر.'
    note: Хорошо («خوب، بسیار خوب») سفارش را تأیید می‌کند و Спасибо گفتگو را مؤدبانه تمام می‌کند.
