    title: ناستیا می‌گوید کجا زندگی می‌کند
    gloss: 'ناستیا: من در یک اپارتمان زندگی می‌کنم.'
    note: Настя جواب می‌دهد Я живу в квартире؛ живу شکل «من» از жить («زندگی کردن») است، و в квартире شکل حالت предложный کلمهٔ квартира است.
