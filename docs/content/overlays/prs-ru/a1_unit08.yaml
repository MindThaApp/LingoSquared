teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: دکان
    note: магазин اسم مذکر است و یعنی دکان یا دوکان.
    example_gloss: ما به دکان می‌رویم.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: چقدر
    note: сколько دربارهٔ مقدار یا قیمت می‌پرسد و اکثراً با стоит می‌آید.
    example_gloss: نان چند قیمت دارد؟
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: قیمت دارد
    note: стоит شکل سوم شخص مفرد فعل стоить («قیمت داشتن») است و با فاعل مفرد مثل хлеб می‌آید.
    example_gloss: نان صد روبل قیمت دارد.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: روبل
    note: рубль واحد پول روسیه است؛ сто («صد») باعث می‌شود شکل جمعِ родی рублей به کار برود.
    example_gloss: نان صد روبل قیمت دارد.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: نان، شیر
    note: хлеб مذکر و молоко خنثی است -- هر دو از مواد خوراکی عادی روزمره اند.
    example_gloss:
    - نان چند قیمت دارد؟
    - شیر چند قیمت دارد؟
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: لطفاً به من بتین ...
    note: Дайте امر محترمانه/جمع فعل дать («دادن») است و با «شما» به کار می‌رود.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: کیلوگرام
    note: килограмм واحد معمول برای خرید میوه و ترکاری یا نان به وزن است.
    example_gloss: لطفاً یک کیلوگرام بتین.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: نیم کیلو
    note: полкило از пол- («نیم») و кило (شکل کوتاه محاوره‌یی килограмм) ساخته شده است.
    example_gloss: لطفاً نیم کیلو بتین.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: دانه (عدد)
    note: штука برای شمردن دانه‌ها به کار می‌رود؛ пять штук بعد از عدد пять شکل جمعِ родی را می‌گیرد.
    example_gloss:
    - لطفاً یک دانه بتین.
    - لطفاً پنج دانه بتین.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: بادرنگ رومی، بادرنگ
    note: هر دو اسم جمع اند؛ помидоры و огурцы هر دو مذکر اند.
    example_gloss:
    - بادرنگ رومی دارید؟
    - بادرنگ دارید؟
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: کچالو، کلم
    note: картофель اسم جمعیِ مذکر است (مثل اسم ناشمارا به کار می‌رود) و капуста مؤنث است.
    example_gloss:
    - کچالو دارید؟
    - کلم دارید؟
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: سیب، مالته
    note: کیلو яблок بعد از کیلو به حالت اضافی جمع яблок می‌آید («یک کیلو سیب»)، مثل кило апельсинов.
    example_gloss:
    - یک کیلو سیب چند قیمت دارد؟
    - یک کیلو مالته چند قیمت دارد؟
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: آیا شما ... دارید؟ (محترمانه)
    note: این جمله شکل محترمانهٔ вас را دارد و روش معمولی پرسیدن از دوکاندار است که فلان جنس را دارد یا نه.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: بلی، ... دارم
    note: У меня есть (لفظاً «نزد من هست») روش معمولی گفتن «من دارم» است و جواب دوکاندار است.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: مشتری دربارهٔ بادرنگ‌رومی می‌پرسد
    gloss: 'مشتری: بادرنگ‌رومی دارید؟'
    note: مشتری گپ را با سوال مؤدبانهٔ У вас есть ...? شروع می‌کند.
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: فروشنده بلی می‌گوید
    gloss: 'فروشنده: بلی، داریم.'
    note: Да, есть جواب کوتاه و روزمره است، لفظاً «بلی، هست»، بدون اینکه نام جنس دوباره گفته شود.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: مشتری قیمت را می‌پرسد
    gloss: 'مشتری: یک کیلو سیب چند است؟'
    note: кило яблок بعد از кило به حالت اضافی جمع яблок می‌آید.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: فروشنده قیمت را می‌گوید
    gloss: 'فروشنده: دوصد روبل.'
    note: Двести یعنی «دوصد»؛ مثل сто، بعدش рублей به حالت اضافی جمع می‌آید.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: مشتری یک کیلو می‌خرد
    gloss: 'مشتری: لطفاً یک کیلو سیب بتین.'
    note: Дайте ..., пожалуйста از درس 2، حالا با килограмм яблок («یک کیلوگرام سیب»).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: فروشنده جنس را می‌دهد
    gloss: 'فروشنده: خوب است، بفرمایید.'
    note: Пожалуйста در اینجا وقتی فروشنده جنس را می‌دهد یعنی «بفرمایید»، نه «لطفاً».
