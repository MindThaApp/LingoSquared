teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: ساعت چند است؟
    note: طرز معمول پرسیدن ساعت؛ معنی تحت‌اللفظی آن «کدام ساعت» است.
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: حالا ساعت یک است.
    note: «Час» به تنهایی یعنی «ساعت یک»؛ در اینجا «один час» گفته نمی‌شود، برخلاف الگوی عددها از ۲ به بعد.
    example_gloss: ساعت چند است؟ — ساعت یک است.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: ساعت دو، ساعت سه
    note: بعد از два و три، کلمهٔ час شکل حالت اضافی مفرد یعنی часа را می‌گیرد، مثل الگوی عدد و اسم در درس ۳.
    example_gloss:
    - حالا ساعت دو است.
    - حالا ساعت سه است.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: ساعت پنج، ساعت ده
    note: از пять به بعد، کلمهٔ час شکل جمع اضافی یعنی часов را می‌گیرد، مثل الگوی ۵ به بعد در درس ۳.
    example_gloss:
    - حالا ساعت پنج است.
    - حالا ساعت ده است.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: ساعت چند؟
    note: برای پرسیدن وقت اتفاق افتادن یک کار استفاده می‌شود؛ اما Который час? فقط ساعت حالا را می‌پرسد.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: صبح، چاشت (در روز)
    note: این‌ها قید استند (حالت ابزاری) از утро و день و بدون حرف اضافه استفاده می‌شوند.
    example_gloss:
    - صبح‌ها چای قهوه می‌نوشم.
    - در روز کار می‌کنم.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: در شام، در شب
    note: همان الگوی قید ابزاری مثل утром/днём.
    example_gloss:
    - شام‌ها در خانه استم.
    - در شب می‌خوابم.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: ساعت دو بعد از ظهر.
    note: дня (حالت اضافی день) بعد از ساعت نشان می‌دهد که ساعت دو بعد از ظهر است، نه دو بجهٔ شب.
    example_gloss: جلسه ساعت چند است؟ — ساعت دو بعد از ظهر.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: ساعت هفت شام.
    note: вечера (حالت اضافی вечер) نشان می‌دهد که این ساعت هفت در شام است.
    example_gloss: دکان ساعت هفت شام بسته می‌شود.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: معذرت، لطفاً بگویین ساعت چند است؟
    note: Скажите, пожалуйста سوال را مؤدبانه می‌سازد و برای پرسیدن از یک آدم ناآشنا مناسب است.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: قطار کی حرکت می‌کند؟
    note: Отходит («حرکت می‌کند») فعل معمول برای رفتن قطار یا بس از ستیشن است.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: مسافر ساعت را می‌پرسد
    gloss: 'مسافر: معذرت، لطفاً بگویین ساعت چند است؟'
    note: مسافر مؤدبانه با Скажите, пожалуйста شروع می‌کند، که برای صحبت با کارمند ستیشن مناسب است.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: کارمند جواب می‌دهد
    gloss: 'کارمند: حالا ساعت هفت صبح است.'
    note: Сейчас семь часов утра ساعت حالا را می‌گوید و утра («صبح») را برای روشنی اضافه می‌کند.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: مسافر دربارهٔ قطار می‌پرسد
    gloss: 'مسافر: و قطار کی حرکت می‌کند؟'
    note: А سوال بعدی مسافر را نرم وصل می‌کند.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: کارمند وقت حرکت را می‌گوید
    gloss: 'کارمند: ساعت هشت صبح.'
    note: В восемь часов утра با حرف اضافهٔ в، ساعت و کلمهٔ وقت روز جواب می‌دهد.
