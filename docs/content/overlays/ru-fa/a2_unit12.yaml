    title: Визит к врачу
teaching:
  fa.a2.unit12.lesson01.teach.doctor_word:
    title: Врач
    gloss: врач
    note: '*دکتر* — общее слово для обозначения врача.'
    example_gloss: نیما ходил к врачу.
  fa.a2.unit12.lesson01.teach.headache_word:
    title: Головная боль
    gloss: головная боль
    note: '*سردرد* значит «головная боль».'
    example_gloss: У меня сильная головная боль.
  fa.a2.unit12.lesson01.teach.symptoms_word:
    title: Симптомы
    gloss: симптомы
    note: '*علائم* — общее слово для обозначения симптомов.'
    example_gloss: Врач спросил о моих симптомах.
  fa.a2.unit12.lesson01.teach.duration_word:
    title: Продолжительность
    gloss: продолжительность / промежуток времени
    note: '*مدت* — общее слово для обозначения продолжительности или промежутка времени.'
    example_gloss: Как давно у вас это состояние?
  fa.a2.unit12.lesson01.teach.prescription_word:
    title: Рецепт
    gloss: рецепт
    note: '*نسخه* значит «рецепт» (врачебный).'
    example_gloss: Врач выписал рецепт.
  fa.a2.unit12.lesson01.teach.rest_word:
    title: Отдых
    gloss: отдых
    note: '*استراحت* значит «отдых».'
    example_gloss: Мне нужно несколько дней отдохнуть.
  fa.a2.unit12.lesson01.teach.bayad_note:
    title: Должен / следует
    gloss: должен / следует
    note: '*باید* выражает обязанность или совет — «должен» или «следует»; эта грамматика уровня A2 используется в указаниях врача.'
    target_text: باید (must / should)
  fa.a2.unit12.lesson02.teach.headache_three_days_severe:
    title: Сказать о симптоме, его длительности и силе
    gloss: Уже три дня у меня сильная головная боль.
    note: '*از ... پیش* («... назад», «уже ...») указывает длительность; *شدید* (сильный) — силу симптома. Это шаг вперёд по сравнению с простым названием симптома на уровне A1.'
  fa.a2.unit12.lesson02.teach.doctor_instruction:
    title: Указание врача
    gloss: Врач сказал, что мне нужно взять лекарство по рецепту и отдохнуть.
    note: Здесь *باید* передаёт указание врача как совет.
  fa.a2.unit12.lesson02.teach.full_symptom_and_instruction:
    title: Объединить симптом и указание
    gloss: Уже три дня у меня сильная головная боль. Врач сказал, что мне нужно отдохнуть.
    note: Полная модель «симптом + указание», вокруг которой построен этот урок.
  fa.a2.unit12.lesson03.teach.appointment_word:
    title: Встреча
    gloss: встреча (назначенная)
    note: '*نوبت* — общее слово, обозначающее запись на приём или очередь.'
    example_gloss: Моя запись — во вторник в 11 утра.
  fa.a2.unit12.lesson03.teach.earlier_word:
    title: Раньше
    gloss: раньше
    note: '*زودتر* означает «раньше» или «пораньше».'
    example_gloss: Пожалуйста, приходите на 15 минут раньше.
  fa.a2.unit12.lesson03.teach.confirmation_text:
    title: Подтверждение записи на приём
    gloss: Ваш приём у доктора Резаи — во вторник в 11 утра. Пожалуйста, приходите на 15 минут раньше. Если через неделю симптомы не пройдут, позвоните снова.
    note: Короткое официальное подтверждение записи на приём — письменный стиль, которому учит этот раздел.
  fa.a2.unit12.lesson04.teach.whats_wrong:
    title: Что случилось?
    gloss: Слушаю вас — что случилось?
    note: '*بفرمایید، چی شده؟* — стандартная вежливая фраза врача в начале приёма.'
  fa.a2.unit12.lesson04.teach.turn01:
    title: Доктор Резаи спрашивает, что случилось
    gloss: Доктор Резаи предлагает ему рассказать и спрашивает, что случилось.
    note: Здесь повторяется начальная фраза из этого урока.
  fa.a2.unit12.lesson04.teach.turn02:
    title: Нима описывает свой симптом
    gloss: Нима говорит, что у него уже три дня сильная головная боль.
    note: 'Повторяется модель из урока 2: симптом с указанием длительности и силы.'
  fa.a2.unit12.lesson04.teach.turn03:
    title: Доктор Резаи спрашивает про температуру
    gloss: Доктор Резаи спрашивает, есть ли у него ещё и температура.
    note: '*تب هم دارید؟* — вопрос о дополнительном симптоме.'
  fa.a2.unit12.lesson04.teach.turn04:
    title: Нима отвечает про температуру
    gloss: Нима говорит, что нет, только голова болит, но сильно.
    note: '*فقط ... ولی ...* («только ..., но ...») сужает и противопоставляет.'
  fa.a2.unit12.lesson04.teach.turn05:
    title: Доктор Резаи дает указания
    gloss: 'Доктор Резаи говорит: хорошо, возьмите этот рецепт и несколько дней отдыхайте.'
    note: 'Указание врача по лечению: рецепт и отдых.'
  fa.a2.unit12.lesson04.teach.turn06:
    title: Нима благодарит врача
    gloss: 'Нима говорит: конечно, спасибо, доктор.'
    note: '*چشم* — вежливый, почтительный способ сказать «конечно» или «будет сделано» тому, кто старше или выше по положению.'
