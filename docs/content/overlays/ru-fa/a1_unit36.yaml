teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Добрый
    gloss: добрый / приветливый
    note: '*مهربون* описывает человека доброго, с отзывчивым сердцем.'
    example_gloss: Сара очень добрая.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Смешной
    gloss: смешной
    note: '*بامزه* описывает человека забавного, весёлого, с которым смешно.'
    example_gloss: Нима забавный.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Застенчивый
    gloss: застенчивый
    note: '*خجالتی* описывает застенчивого человека.'
    example_gloss: Он/она немного застенчив(а).
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Серьёзный
    gloss: серьёзный
    note: '*جدی* описывает серьёзного человека.'
    example_gloss: Наш учитель серьёзный.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Как «есть» сливается со словами о характере
    gloss: он/она добрый(ая) / забавный(ая) / застенчивый(ая) (слитная связка)
    note: '*مهربونه* — это *مهربون* + *است* вместе, потому что *مهربون* оканчивается на согласный. В *بامزه‌ست* перед *ست* пишется полупробел (ZWNJ), потому что *بامزه* уже оканчивается на гласную *ه*. В *خجالتیه* окончание *ه* присоединяется прямо к слову на *ی* — так же, как в *قهوه‌ایه* из урока о внешности.'
    target_text: مهربونه = مهربون + است (слитное «является», основа на согласный) / بامزه‌ست = بامزه + است (основа на гласный, с полупробелом) / خجالتیه = خجالتی + ه (основа на ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Умный
    gloss: умный / сообразительный
    note: '*زرنگ* описывает умного, сообразительного человека, особенно находчивого в практических делах.'
    example_gloss: Марьям очень сообразительная.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Ленивый
    gloss: ленивый
    note: '*تنبل* описывает ленивого человека.'
    example_gloss: Сегодня я немного ленивый.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Трудолюбивый
    gloss: трудолюбивый
    note: '*زحمت‌کش* описывает человека, который много и усердно трудится.'
    example_gloss: Мой отец очень трудолюбивый.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Терпеливый
    gloss: терпеливый
    note: '*صبور* описывает терпеливого человека.'
    example_gloss: Наш учитель очень терпеливый.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Отрицание черты характера
    gloss: он/она не ленивый(ая)
    note: '*نیست* отрицает слитную связку: *تنبل نیست* значит «он/она не ленивый(ая)». Это тот же *نیست*, который уже был в отрицании чувств.'
    target_text: تنبل نیست (он/она не ленивый/ленивая) -- نیست отрицает слитную связку
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Характер
    gloss: характер
    note: '*شخصیت* значит «личность», «характер».'
    example_gloss: У него/неё очень хороший характер.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Какой у него/неё характер?
    gloss: Какой у него/неё характер?
    note: '*چطوره؟* («как...?») уже было в уроке о приветствиях; *ش* — притяжательный суффикс «его/её», присоединённый к *شخصیت* («характер»).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: Он/она очень добрый(ая) и сообразительный(ая)
    gloss: Он/она очень добрый(ая) и сообразительный(ая)
    note: '*و* значит «и» и соединяет два слова о характере.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Какой он/она?
    gloss: Какой он/она?
    note: '*چه جوریه؟* — распространённый разговорный способ спросить «какой он/она?», альтернатива вопросу *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Характер / какой...? / каков...?
    gloss: характер / как...? / какой...?
    note: Эти три выражения помогут спросить о характере человека и назвать его.
    target_text: شخصیت (характер) / چطوره؟ (какой...?) / چه جوریه؟ (какой...?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Нима / Сара / Марьям / совсем нет / только / классный
    gloss: Нима / Сара / Марьям / совсем нет / только / классный
    note: '*مریم* — подруга *سارا*, она уже появлялась в уроке о внешности. *اصلاً* значит «совсем нет». *فقط* значит «только». *باحال* значит «классный, приятный».'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Хочу узнать её получше
    gloss: Хочу узнать её получше
    note: '*بیشتر* значит «больше». *باهاش* значит «с ним/с ней». *آشنا بشم* значит «чтобы я познакомился/познакомилась поближе».'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Нима: Сара, какая Марьям?'
    gloss: Сара, какая Марьям?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Сара: Она очень добрая и сообразительная.'
    gloss: Она очень добрая и сообразительная.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Нима: Она не ленивая?'
    gloss: Она не ленивая?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Сара: Нет, совсем нет, она ещё и очень трудолюбивая. Просто немного застенчивая.'
    gloss: Нет, совсем нет, она ещё и очень трудолюбивая. Просто немного застенчивая.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Нима: Классно, я хочу узнать её получше.'
    gloss: Классно, я хочу узнать её получше.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Чтение: Характер Марьям'
    gloss: Марьям — подруга Сары. Она очень добрая и сообразительная. На работе она тоже трудолюбивая и никогда не ленится. Просто она немного застенчивая, поэтому в больших компаниях почти не говорит.
    note: В тексте характер Марьям описан от третьего лица, теми же чертами, что и в диалоге.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Никогда (с отрицательным глаголом)
    gloss: никогда
    note: '*هیچ‌وقت* сочетается с отрицательным глаголом (*نیست*, *نمی‌زنه*) и значит «никогда». В русском похоже: при «никогда» тоже стоит отрицание — «никогда не ленится».'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Мне кажется, я очень трудолюбивый, но немного и ленивый
    gloss: Мне кажется, я очень трудолюбивый, но немного и ленивый
    note: '*فکر می‌کنم* значит «я думаю». *زحمت‌کشم* — это *زحمت‌کش* + *هستم* («я есть») вместе. *هستم* — полная, не слитная форма «я есть»; здесь она стоит после *هم* («тоже») для выразительности.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Какой у тебя характер?
    gloss: Какой у тебя характер?
    note: 'К слову *شخصیت* добавляется неформальный притяжательный суффикс *ت* («твой»): *شخصیتت* — это вариант слова *شخصیتش* для обращения на *تو*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Добрый / забавный / застенчивый / серьёзный / сообразительный / ленивый / трудолюбивый / терпеливый
    gloss: добрый / забавный / застенчивый / серьёзный / сообразительный / ленивый / трудолюбивый / терпеливый
    note: Это восемь основных слов о характере из этого урока.
