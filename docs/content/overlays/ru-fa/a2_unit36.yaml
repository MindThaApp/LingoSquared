teaching:
  fa.a2.unit36.lesson01.teach.going:
    title: Куда ходим
    gloss: я ходил, я хожу, вчера, сегодня
    note: '*رفتم* — простое прошедшее время («я ходил/пошёл»); *می‌رم* — разговорное настоящее («я иду / я хожу»).'
    example_gloss:
    - Вчера я ходил на рынок.
    - Сегодня я иду в банк.
  fa.a2.unit36.lesson01.teach.places:
    title: Места для дел
    gloss: банк, почта, рынок
    note: В разговорном персидском говорят *رفتم بانک* без слова, соответствующего предлогу «в».
    example_gloss:
    - Вчера я ходил в банк.
    - Сегодня я иду на почту.
    - Вчера я ходил на рынок.
  fa.a2.unit36.lesson01.teach.things:
    title: Что нужно для дел
    gloss: деньги, посылка, письмо, книга, один / какой-то
    note: '*یه* — обычная разговорная форма слова «один / какой-то».'
    example_gloss:
    - У меня есть деньги.
    - У меня есть посылка.
    - У меня есть письмо.
    - У меня есть книга.
  fa.a2.unit36.lesson01.teach.connectors:
    title: Два способа сказать «чтобы»
    gloss: чтобы, для того чтобы; чтобы (короче, в разговорной речи)
    note: '*برای اینکه* — полный союз; *تا* — более короткий и очень частый в разговорной речи. После обоих стоит одна и та же форма глагола.'
    example_gloss:
    - Я ходил в банк для того, чтобы снять деньги.
    - Я ходил в банк, чтобы снять деньги.
  fa.a2.unit36.lesson01.teach.purpose_verbs:
    title: Глаголы цели
    gloss: (чтобы) я получил, (чтобы) я купил, (чтобы) я отправил
    note: Эти формы (*بـ* + основа + *م*) — сослагательное наклонение (конъюнктив). Они называют цель, которой ещё нет.
    example_gloss:
    - Я ходил в банк, чтобы снять деньги.
    - Я ходил на рынок, чтобы купить книгу.
    - Я ходил на почту, чтобы отправить письмо.
  fa.a2.unit36.lesson01.teach.post_items:
    title: Почта и документы для поездки
    gloss: конверт, марка, паспорт, документы
    note: '*پاکت* и *تمبر* пригодятся на почте; *پاسپورت* и *مدارک* нужно подготовить перед поездкой.'
    example_gloss:
    - У меня есть конверт и марка.
    - У меня есть паспорт и документы.
  fa.a2.unit36.lesson01.teach.travel_items:
    title: Подготовка к поездке
    gloss: чемодан, иностранная валюта, список, пункт назначения
    note: '*چمدون* — обычная разговорная форма слова «чемодан». *مقصد* — место, куда ты собираешься добраться.'
    example_gloss:
    - У меня есть чемодан.
    - У меня есть иностранная валюта и список.
    - Ехать в пункт назначения.
  fa.a2.unit36.lesson01.teach.purpose_clause:
    title: برای اینکه + сослагательное наклонение
    gloss: Я ходил в банк, чтобы снять деньги
    note: 'Сначала скажи, что ты сделал, затем *برای اینکه*, затем цель в сослагательном наклонении: *رفتم بانک برای اینکه پول بگیرم*. Глагол цели не указывает на прошедшее время: он направлен вперёд, к цели.'
  fa.a2.unit36.lesson02.teach.learning_words:
    title: Слова для учёбы
    gloss: занятия, английский, (чтобы) я выучил, (чтобы) я заговорил
    note: '*یاد بگیرم* и *حرف بزنم* — составные глаголы; *بـ* сослагательного наклонения стоит на глагольной части (*بگیرم*, *بزنم*).'
    example_gloss:
    - Я хожу на занятия, чтобы выучить английский.
    - Я читаю книги, чтобы говорить по-английски.
  fa.a2.unit36.lesson02.teach.saving_words:
    title: Слова про накопление и чтение
    gloss: я коплю деньги, машина, (чтобы) я прочитал
    note: '*پول جمع می‌کنم* — обычное выражение для «коплю деньги». *جمع کنم* — его форма сослагательного наклонения.'
    example_gloss:
    - Я коплю деньги, чтобы купить машину.
    - Я читаю книги, чтобы выучить английский.
  fa.a2.unit36.lesson02.teach.subjunctive_shape:
    title: Как образуется сослагательное наклонение
    gloss: я получаю, чтобы я получил; я покупаю, чтобы я купил
    note: 'Убери *می‌* и поставь *بـ* перед основой: *می‌گیرم* превращается в *بگیرم*, *می‌خرم* — в *بخرم*. С глаголами на *کردن* *بـ* обычно опускается: *جمع می‌کنم* превращается в *جمع کنم*. Окончания остаются теми же (*-م* для «я»).'
  fa.a2.unit36.lesson02.teach.ta_connector:
    title: تا + сослагательное наклонение (и تا بتونم)
    gloss: чтобы снять деньги; чтобы я мог говорить по-английски
    note: '*تا* работает как *برای اینکه*: *رفتم بانک تا پول بگیرم*. Используй *تا بتونم* («чтобы я мог»), когда цель — иметь возможность что-то делать; *بتونم* — тоже сослагательное наклонение, и следующий глагол тоже.'
  fa.a2.unit36.lesson02.teach.baraye_noun:
    title: برای + существительное или отглагольное существительное
    gloss: для покупок; для отправки письма
    note: После *برای* можно поставить обычное существительное (*خرید*, «покупки») или отглагольное существительное на *-ن* (*فرستادن*, «отправка»). Тогда сослагательного наклонения и *اینکه* нет.
  fa.a2.unit36.lesson03.teach.reason_words:
    title: Слова для причины
    gloss: потому что, почему, что, мне было нужно, я люблю
    note: '*چون* вводит причину. *لازم داشتم* («мне было нужно») и *دوست دارم* («я люблю») — обычные глаголы, а не сослагательное наклонение.'
    example_gloss:
    - Я ходил в банк, потому что мне нужны были деньги.
    - Я хожу на занятия, потому что люблю английский.
  fa.a2.unit36.lesson03.teach.reason_vs_purpose:
    title: Причина (چون) и цель (تا)
    gloss: потому что мне нужны были деньги / чтобы снять деньги
    note: '*چون* смотрит назад, на причину, и использует обычный глагол: *چون پول لازم داشتم*. *تا* и *برای اینکه* смотрят вперёд, на цель, и требуют сослагательного наклонения: *تا پول بگیرم*.'
  fa.a2.unit36.lesson03.teach.which_verb_form:
    title: Как различить их по глаголу
    gloss: потому что мне нужны были деньги / чтобы снять деньги
    note: Если в клаузе обычное время (*داشتم*, *دارم*), союз — *چون*. Если там сослагательное наклонение (*بگیرم*, *بخرم*), союз — *برای اینکه* или *تا*.
  fa.a2.unit36.lesson04.teach.purpose_questions:
    title: Спрашиваем «зачем»
    gloss: Зачем ты ходил в банк? Зачем тебе деньги? Зачем ты ходишь на занятия?
    note: '*برای چی؟* спрашивает о цели. Ответ — цель с *تا* или *برای اینکه*.'
  fa.a2.unit36.lesson04.teach.answer_pattern:
    title: Вопрос и ответ
    gloss: Зачем ты ходил в банк? Я ходил, чтобы снять деньги.
    note: На вопрос *برای چی؟* отвечай действием плюс *تا* или *برای اینکه* плюс сослагательное наклонение. Короткий ответ, просто *تا پول بگیرم*, тоже звучит естественно.
  fa.a2.unit36.lesson05.teach.reading:
    title: День, полный дел
    gloss: Сегодня у меня были дела. Сначала я пошёл в банк, чтобы снять деньги. Потом пошёл на почту отправить письмо. В конце пошёл на рынок за покупками. Я коплю деньги, чтобы купить машину.
    note: Прочитай один раз, чтобы найти три дела, а потом ещё раз, чтобы понять цель каждого.
  fa.a2.unit36.lesson06.teach.turn01:
    title: Сара спрашивает, почему Нима опоздал
    gloss: 'Сара спрашивает: Нима, почему ты опоздал?'
    note: '*چرا* спрашивает о причине.'
  fa.a2.unit36.lesson06.teach.turn02:
    title: Нима объясняет причину
    gloss: 'Нима: Потому что в банке было многолюдно.'
    note: '*چون* плюс обычный глагол в прошедшем времени называет причину.'
  fa.a2.unit36.lesson06.teach.turn03:
    title: Сара спрашивает, зачем
    gloss: 'Сара: Зачем ты ходил в банк?'
    note: '*برای چی* теперь спрашивает о цели.'
  fa.a2.unit36.lesson06.teach.turn04:
    title: Два дела и их цели
    gloss: 'Нима: Я ходил в банк, чтобы снять деньги. Потом пошёл на почту отправить посылку.'
    note: В одном случае цель выражена через *تا* и сослагательную форму глагола (субъюнктив), в другом — через *برای* и отглагольное существительное.
  fa.a2.unit36.lesson06.teach.turn05:
    title: Сара спрашивает про деньги
    gloss: 'Сара: Зачем тебе деньги?'
    note: Ещё один вопрос с *برای چی* о цели.
  fa.a2.unit36.lesson06.teach.turn06:
    title: Нима называет цель
    gloss: 'Нима: Я коплю деньги, чтобы купить машину.'
    note: '*تا ماشین بخرم* называет цель.'
