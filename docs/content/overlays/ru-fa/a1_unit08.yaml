teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: Магазин
    gloss: магазин
    note: مغازه — общее слово для небольшого магазина или лавки.
    example_gloss: Этот магазин большой.
  fa.a1.unit08.lesson01.teach.price_word:
    title: Цена
    gloss: цена
    note: قیمت — общее слово для обозначения цены.
    example_gloss: Сколько это стоит?
  fa.a1.unit08.lesson01.teach.discount_word:
    title: Скидка
    gloss: скидка
    note: تخفیف означает «скидка» — частое слово в повседневных покупках и торге в Иране.
    example_gloss: У вас есть скидка?
  fa.a1.unit08.lesson01.teach.apple_word:
    title: Яблоко
    gloss: яблоко
    note: سیب — удобный пример товара для тренировки цен и количеств.
    example_gloss: Я хочу яблоко.
  fa.a1.unit08.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз, который встречается во всём этом уроке.
    target_text: و (и)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: Спросить, сколько что-то стоит
    gloss: Сколько это стоит?
    note: این چنده؟ — обычный разговорный способ спросить цену, сокращённая форма от این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: Назвать цену за килограмм
    gloss: Тридцать томанов за килограмм.
    note: کیلویی سی تومنه называет цену за килограмм с разговорным сокращением -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: Разговорное сокращение -e (повторение)
    gloss: تومنه — это разговорная форма от تومن است, которую обычно произносят в живой речи.
    note: Это та же модель сокращения, которая уже встречалась в словах о погоде, например в آفتابیه.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: Попросить килограмм яблок
    gloss: Мне килограмм яблок.
    note: В یک کیلو سیب می‌خوام слово کیلو (килограмм) служит мерой количества.
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: Попросить полкилограмма
    gloss: Мне полкило.
    note: В нصف کیلو می‌خوام слово نصف (половина) стоит вместо целого килограмма.
  fa.a1.unit08.lesson04.teach.discount_question:
    title: Попросить скидку
    gloss: Вы делаете скидку?
    note: 'تخفیف می‌دید؟ — естественный и частый вопрос на иранских базарах и в магазинах: торг считается нормальной, ожидаемой частью покупок, а не грубостью или чем-то необычным.'
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: Продавец предлагает цену пониже
    gloss: Посчитаю вам за 28 томанов.
    note: برات بیست و هشت تومن حساب می‌کنم — это небольшая скидка с первоначальной цены в 30 томанов.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: Сказать, что платишь наличными
    gloss: Я заплачу наличными.
    note: نقدی حساب می‌کنم сообщает о способе оплаты с помощью слова نقدی (наличными).
  fa.a1.unit08.lesson05.teach.card_question:
    title: Спросить об оплате картой
    gloss: Вы принимаете карты?
    note: کارت می‌گیرید؟ — вопрос о том, принимается ли оплата картой.
  fa.a1.unit08.lesson06.teach.please_review:
    title: Пожалуйста / прошу (повторение)
    gloss: пожалуйста / прошу
    note: بفرمایید встречалось в уроке о приветствиях; здесь продавец с его помощью приглашает покупателя.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: Спасибо (повторение)
    gloss: спасибо
    note: ممنون встречалось в уроке о приветствиях.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: Не за что (повторение)
    gloss: не стоит благодарности / не за что
    note: قابلی نداره — скромный и распространённый способ ответить на благодарность; он уже встречался в одном из прошлых уроков.
  fa.a1.unit08.lesson06.teach.turn01:
    title: Продавец приветствует покупателя
    gloss: Продавец здоровается с покупателем и приглашает его.
    note: بفرمایید приглашает покупателя осмотреться или спросить о чём-нибудь.
  fa.a1.unit08.lesson06.teach.turn02:
    title: Покупатель спрашивает цену
    gloss: Покупатель здоровается с продавцом и спрашивает цену яблок.
    note: این چنده؟ из второго урока, здесь со словом سیب‌ها (яблоки).
  fa.a1.unit08.lesson06.teach.turn03:
    title: Продавец называет цену
    gloss: Продавец говорит, что килограмм стоит 30 томанов.
    note: کیلویی سی تومنه из второго урока.
  fa.a1.unit08.lesson06.teach.turn04:
    title: Покупатель делает заказ и просит скидку
    gloss: Покупатель говорит, что ему нужен килограмм, и просит скидку.
    note: Здесь соединяются модель количества из третьего урока и вопрос о скидке из четвёртого.
  fa.a1.unit08.lesson06.teach.turn05:
    title: Продавец соглашается снизить цену
    gloss: Продавец соглашается и предлагает 28 томанов.
    note: باشه (хорошо) выражает согласие перед тем, как назвать цену со скидкой.
  fa.a1.unit08.lesson06.teach.turn06:
    title: Покупатель благодарит и платит
    gloss: Покупатель благодарит продавца и говорит, что заплатит наличными.
    note: Здесь соединяются лексика об оплате из пятого урока и простая благодарность.
  fa.a1.unit08.lesson06.teach.turn07:
    title: Продавец завершает разговор
    gloss: Продавец отвечает на благодарность и приглашает покупателя.
    note: قابلی نداره، بفرمایید вежливо завершает покупку.
