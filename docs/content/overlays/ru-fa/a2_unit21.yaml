  fa.a2.unit21.lesson03.giving_a_reason:
    title: Называем причину
  fa.a2.unit21.lesson04.new_time:
    title: Согласуем новое время
  fa.a2.unit21.lesson05.reading_and_listening:
    title: Чтение и аудирование
  fa.a2.unit21.lesson06.salon_conversation:
    title: Телефонный звонок в салон
teaching:
  fa.a2.unit21.lesson01.teach.appointment:
    title: Запись на приём, салон красоты
    gloss: запись (на приём), салон красоты
    note: '*وقت* означает и «время», и «запись на определённое время»: *وقت دارم* = «у меня есть запись» (или «у меня есть время»). *آرایشگاه* — парикмахерская или салон красоты.'
    example_gloss:
    - В четверг у меня запись в парикмахерской.
    - У меня запись к врачу.
  fa.a2.unit21.lesson01.teach.change_cancel:
    title: Менять, отменять
    gloss: перенести (запись), отменить
    note: 'Оба — глаголы с *کردن*. Объект *وقتم* получает *رو*: *وقتم رو عوض می‌کنم*. *کنسل کردن* — обычное слово для «отменить».'
    example_gloss:
    - Я переношу свою запись.
    - Я отменяю свою запись.
  fa.a2.unit21.lesson01.teach.sorry:
    title: К сожалению, извините
    gloss: к сожалению, извините
    note: '*متأسفانه* открывает вежливый отказ или плохую новость. *ببخشید* — обычное «извините / простите». *متأسفانه* часто пишут *متاسفانه* без хамзы; принимаются оба варианта.'
    example_gloss:
    - К сожалению, я не могу.
    - Извините, можно войти?
  fa.a2.unit21.lesson01.teach.cant_come_phrase:
    title: К сожалению, в четверг я не могу прийти.
    gloss: К сожалению, в четверг я не могу прийти.
    note: 'После *نمی‌تونم* («я не могу») идёт короткая форма глагола *بیام* (от *اومدن*, «приходить»). День ставится перед глаголом: *پنجشنبه نمی‌تونم بیام*.'
  fa.a2.unit21.lesson01.teach.can_change:
    title: Можно перенести мою запись?
    gloss: Можно перенести мою запись?
    note: '*می‌تونم* («я могу») + короткая форма глагола *کنم*. Так вежливо просят перенести запись.'
  fa.a2.unit21.lesson01.teach.can_rule:
    title: «Могу» и «не могу» + короткая форма глагола
    gloss: я могу прийти, я не могу прийти, я могу изменить
    note: 'После *می‌تونم* («я могу») и *نمی‌تونم* («я не могу») глагол стоит в короткой форме с *be-*: *بیام* («прийти»), *کنم* («сделать»). У обоих глаголов одно и то же окончание (*-م*): *نمی‌تونم بیام*. Для вежливого *вы* оба берут *-ید*: *می‌تونید بیاید؟*'
  fa.a2.unit21.lesson02.teach.days:
    title: Другой день, суббота, понедельник
    gloss: другой день, суббота, понедельник
    note: '*دیگه* после существительного значит «другой» или «ещё»: *یه روز دیگه* — «другой день». В Иране неделя начинается с *شنبه* (суббота).'
    example_gloss:
    - У меня запись в другой день.
    - В субботу я не могу.
    - В понедельник у меня есть время.
  fa.a2.unit21.lesson02.teach.can_it_be:
    title: Можно в понедельник?
    gloss: Можно в понедельник?
    note: '*می‌شه* («можно ли») + день + *باشه* («пусть будет»). Так обычно предлагают другой день: *می‌شه شنبه باشه؟*'
  fa.a2.unit21.lesson02.teach.suits_you:
    title: Вам подходит суббота?
    gloss: Вам подходит суббота? (вежливо)
    note: '*براتون مناسبه؟* — вопрос о том, подходит ли что-то вам. *براتون* — вежливое *вы*; с другом скажешь *برات مناسبه؟*'
  fa.a2.unit21.lesson02.teach.yes_fine:
    title: Да, хорошо.
    gloss: Да, хорошо.
    note: '*خوبه* («это хорошо») — короткий способ согласиться на время.'
  fa.a2.unit21.lesson02.teach.no_sorry:
    title: Нет, к сожалению, нет.
    gloss: Нет, к сожалению, нет.
    note: 'Вежливый отказ: *نه* вместе с *متأسفانه* смягчает ответ.'
  fa.a2.unit21.lesson02.teach.you_rule:
    title: «Ты» и «вы»
    gloss: Тебе / вам подходит? (другу / вежливо)
    note: 'С другом окончание *-ت*: *برات*. В службе или с незнакомым человеком используй *-تون*: *براتون*. В этом уроке салон использует вежливую форму.'
  fa.a2.unit21.lesson03.teach.because:
    title: Потому что, я болен
    gloss: потому что, я болен
    note: '*چون* («потому что») присоединяет причину к главной части: *نمی‌تونم بیام چون مریضم*. *مریضم* — это *مریض* («больной») + *-م* («я»).'
    example_gloss:
    - Я не могу прийти, потому что я болен.
    - Я не могу, потому что у меня работа.
  fa.a2.unit21.lesson03.teach.reason_work:
    title: Потому что мне надо работать.
    gloss: Потому что мне надо работать.
    note: '*باید* («надо») + короткая форма глагола *کنم*: *باید کار کنم*.'
  fa.a2.unit21.lesson03.teach.reason_other:
    title: Потому что у меня другая запись.
    gloss: Потому что у меня другая запись.
    note: '*یه وقت دیگه* — «другая запись».'
  fa.a2.unit21.lesson03.teach.reason_ill:
    title: Почему ты не можешь? Потому что я болен.
    gloss: Почему ты не можешь? Потому что я болен.
    note: '*چرا؟* спрашивает «почему»; коротким ответом может служить причина, начинающаяся с *چون*. *نمی‌تونی* — форма для *ты* от *نمی‌تونم*.'
  fa.a2.unit21.lesson03.teach.sorry_trouble:
    title: Извините за беспокойство.
    gloss: Извините за беспокойство.
    note: '*بابت زحمت* значит «за беспокойство». Говори это, когда доставляешь человеку лишние хлопоты, например переносишь запись.'
  fa.a2.unit21.lesson03.teach.reason_rule:
    title: Главная часть, потом причина
    gloss: Я не могу прийти, потому что мне надо работать.
    note: 'Сначала отказ, потом причина после *چون*. Короткий ответ может начинаться с *چون*: *چرا نمی‌تونی؟* *چون مریضم.*'
  fa.a2.unit21.lesson04.teach.time_words:
    title: В десять часов, за день до
    gloss: десять часов, за день до
    note: 'Час называется так: *ساعت* + число: *ساعت ده* (десять часов). *قبل* значит «до»: *یه روز قبل* — «за день до».'
    example_gloss:
    - В понедельник в десять часов хорошо.
    - Я позвоню за день до этого.
  fa.a2.unit21.lesson04.teach.monday_ten:
    title: В понедельник в десять часов хорошо.
    gloss: В понедельник в десять часов хорошо.
    note: 'Сначала день, потом время: *دوشنبه ساعت ده*.'
  fa.a2.unit21.lesson04.teach.can_you_come:
    title: Вы можете прийти в понедельник в десять?
    gloss: Вы можете прийти в понедельник в десять? (вежливо)
    note: У *می‌تونید* и *بیاید* окончание вежливого *вы* — *-ید*.
  fa.a2.unit21.lesson04.teach.see_you:
    title: Тогда увидимся в понедельник.
    gloss: Тогда увидимся в понедельник. (вежливо)
    note: '*پس* («тогда») завершает договорённость; *می‌بینمتون* — «я вас увижу» (вежливо).'
  fa.a2.unit21.lesson04.teach.new_appointment:
    title: Я запишусь на новое время.
    gloss: Я запишусь на новое время.
    note: '*وقت گرفتن* (буквально «взять время») — обычный способ сказать, что ты записываешься на приём.'
  fa.a2.unit21.lesson04.teach.time_rule:
    title: Сначала день, потом время
    gloss: понедельник, десять часов
    note: 'Сначала назови день, затем час, без предлога: *دوشنبه ساعت ده*. Если добавляешь глагол, он стоит в конце: *دوشنبه ساعت ده بیاید*.'
  fa.a2.unit21.lesson05.teach.spot_time:
    title: Найди день и время
    gloss: в понедельник в десять, за один день до этого
    note: Читая сообщение о записи, найди день, час и то, что нужно сделать, если это время тебе не подходит.
  fa.a2.unit21.lesson05.teach.reading_sms:
    title: Сообщение из салона
    gloss: Здравствуйте, господин Нима! Ваша запись перенесена на понедельник на десять часов. Если это время вам не подходит, пожалуйста, позвоните за день до этого. Мы назначим новое время.
    note: Короткое сообщение из салона. Прочитай его сначала ради нового времени, затем ещё раз ради того, что делать, если время не подходит.
  fa.a2.unit21.lesson06.teach.names:
    title: Нима, салон
    gloss: Нима, салон
    note: Нима, друг из прошлых уроков, звонит в парикмахерскую. Реплики сотрудника подписаны *آرایشگاه*.
    example_gloss:
    - Нима звонит в салон.
  fa.a2.unit21.lesson06.teach.please_great:
    title: Пожалуйста, говорите; конечно; спасибо; не за что
    gloss: пожалуйста, говорите; конечно; спасибо; не за что
    note: '*بفرمایید* — так тот, кто отвечает на звонок, приглашает тебя говорить. *البته* значит «конечно», *ممنون* — «спасибо», а *خواهش می‌کنم* — ответ на «спасибо».'
    example_gloss:
    - Салон, слушаю вас.
    - Да, конечно.
    - Спасибо. Не за что.
  fa.a2.unit21.lesson06.teach.dlg1:
    title: Салон отвечает
    gloss: Салон отвечает на звонок.
    note: 'Вежливый способ ответить: название места и *بفرمایید*.'
  fa.a2.unit21.lesson06.teach.dlg2:
    title: Нима объясняет и спрашивает
    gloss: Нима говорит, что у него запись на четверг, но, к сожалению, он не может прийти, и спрашивает, можно ли её перенести.
    note: '*ولی* («но») соединяет запись и проблему.'
  fa.a2.unit21.lesson06.teach.dlg3:
    title: Салон предлагает субботу
    gloss: Салон говорит «да, конечно» и спрашивает, подходит ли ему суббота.
    note: Вежливое *براتون*.
  fa.a2.unit21.lesson06.teach.dlg4:
    title: Нима отказывается и предлагает понедельник
    gloss: Нима говорит, что, к сожалению, нет, потому что ему надо работать, и спрашивает, можно ли в понедельник.
    note: Отказ, причина и новое предложение.
  fa.a2.unit21.lesson06.teach.dlg5:
    title: Салон соглашается
    gloss: Салон говорит, что понедельник в десять подходит.
    note: Сначала день, потом время.
  fa.a2.unit21.lesson06.teach.dlg6:
    title: Нима благодарит и извиняется
    gloss: 'Нима говорит: «Отлично, спасибо, и извините за беспокойство».'
    note: '*ببخشید بابت زحمت* — вежливое извинение в конце разговора.'
  fa.a2.unit21.lesson06.teach.dlg7:
    title: Салон завершает разговор
    gloss: Салон говорит «не за что» и «тогда до встречи в понедельник».
    note: '*خواهش می‌کنم* — ответ на «спасибо».'
  fa.a2.unit21.lesson06.teach.third_person:
    title: Он не может прийти, говорит она
    gloss: он/она не может прийти, он/она говорит, он/она хочет
    note: 'Чтобы сказать о том, что говорит или может сделать другой человек, используй окончания *он/она*: *نمی‌تونه* (он/она не может), *می‌گه* (он/она говорит), *می‌خواد* (он/она хочет) и краткую форму глагола *بیاد* (прийти).'
    example_gloss:
    - Нима не может прийти в четверг.
    - Салон говорит, что понедельник в десять подходит.
