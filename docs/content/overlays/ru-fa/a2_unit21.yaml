course:
  title: Персидский A2
  description: 'Фарси (Иран) для уровня ниже среднего с упором на грамматику: банк, мнения, записи на приём и другое. Сейчас ты учишься переносить запись: сказать, что не можешь прийти, предложить другой день, объяснить причину и согласовать новое время.'
units:
  fa.a2.unit21.reschedule_appointment:
    title: Перенос записи
