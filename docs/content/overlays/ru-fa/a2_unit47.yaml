teaching:
  fa.a2.unit47.lesson01.teach.now:
    title: Прямо сейчас
    gloss: сейчас, прямо сейчас, книга, что (ты) делаешь
    note: '*الان* — «сейчас»; *همین الان* — «прямо сейчас, в эту самую минуту».'
    example_gloss:
    - Сейчас я читаю книгу.
    - Прямо сейчас я читаю книгу.
    - Что ты делаешь сейчас?
  fa.a2.unit47.lesson01.teach.persons:
    title: В процессе действия
    gloss: я (сейчас делаю), ты, он / она, мы, вы, они
    note: Поставь *دارم* (или *داری, داره …*) перед глаголом в настоящем времени. Это значит, что действие происходит прямо сейчас.
    example_gloss:
    - Я читаю книгу.
    - Ты читаешь книгу.
    - Он / она читает книгу.
    - Мы читаем книгу.
    - Вы читаете книгу.
    - Они читают книгу.
  fa.a2.unit47.lesson01.teach.verbs:
    title: Настоящее время глагола خوندن
    gloss: я читаю, ты читаешь, он / она читает, мы читаем, вы читаете, они читают
    note: 'Обе части конструкции стоят в одном и том же лице: *دارم … می‌خونم*, *داری … می‌خونی*.'
    example_gloss:
    - Я читаю каждый день.
    - Ты читаешь каждый день.
    - Он / она читает каждый день.
    - Мы читаем каждый день.
    - Вы читаете каждый день.
    - Они читают каждый день.
  fa.a2.unit47.lesson01.teach.shape:
    title: دارم и настоящее время
    gloss: Я читаю книгу; он читает книгу
    note: 'Возьми разговорное настоящее время (*می‌خونم*) и поставь перед ним *دارم*. Меняй обе части по лицу: *دارم … می‌خونم*, *داره … می‌خونه*. Дополнение стоит между ними.'
  fa.a2.unit47.lesson02.teach.habit:
    title: Слова для привычных действий
    gloss: каждый, день, по ночам, работа
    note: '*هر روز* и *شب‌ها* показывают, что действие — привычка, а не то, что происходит прямо сейчас.'
    example_gloss:
    - Я работаю каждый день.
    - По ночам я читаю книги.
  fa.a2.unit47.lesson02.teach.work:
    title: Работать
    gloss: я работаю, я сейчас работаю
    note: '*کار می‌کنم* может означать привычку («я работаю»); *دارم کار می‌کنم* говорит, что ты работаешь в этот момент.'
    example_gloss:
    - Прямо сейчас я работаю.
    - Я работаю каждый день.
  fa.a2.unit47.lesson02.teach.contrast:
    title: Привычка или прямо сейчас
    gloss: Я работаю каждый день; прямо сейчас я работаю
    note: Простое настоящее время (*کار می‌کنم*) используется для привычек и общих фактов. С *دارم* тот же глагол означает, что действие идёт прямо сейчас. В речи простое настоящее иногда тоже относится к моменту речи, но с *دارم* это ясно сразу.
  fa.a2.unit47.lesson02.teach.negative:
    title: Как сказать, что ты этого не делаешь
    gloss: Сейчас я не читаю книгу
    note: 'В отрицании *دارم* не используется. Берётся обычное отрицательное настоящее время: *الان کتاب نمی‌خونم*.'
    example_gloss:
    - Сейчас я не читаю книгу.
  fa.a2.unit47.lesson03.teach.things:
    title: Слова о домашних делах
    gloss: одежда, посуда, подметание (веник), ужин
    note: '*لباس‌ها* и *ظرف‌ها* — существительные во множественном числе; с *رو* они обозначают то, что моют.'
    example_gloss:
    - Сейчас я стираю одежду.
    - Сейчас я мою посуду.
    - Сейчас я подметаю.
    - Сейчас я готовлю ужин.
  fa.a2.unit47.lesson03.teach.verbs:
    title: Глаголы домашних дел
    gloss: я мою, я подметаю, я готовлю
    note: От *شستن* образуется *می‌شورم*; *جارو کردن* и *درست کردن* — сочетания существительного с глаголом.
    example_gloss:
    - Я стираю одежду.
    - Я подметаю.
    - Я готовлю ужин.
  fa.a2.unit47.lesson03.teach.others:
    title: Кто-то другой
    gloss: Нима, он моет, он делает
    note: 'Для другого лица меняются и *دارم*, и глагол: *داره … می‌شوره*.'
    example_gloss:
    - Нима моет посуду.
    - Нима подметает.
  fa.a2.unit47.lesson03.teach.rule:
    title: Дополнение между двумя частями
    gloss: Я мою посуду; Нима моет посуду
    note: Дополнение с *رو* стоит между *دارم* и глаголом. Если глагол состоит из существительного и глагола, как *جارو می‌کنم*, то *دارم* ставится перед всем сочетанием.
  fa.a2.unit47.lesson04.teach.calls:
    title: Начало звонка
    gloss: алло (по телефону), где ты, что (ты) делаешь
    note: '*الو* — так отвечают на телефонный звонок или начинают разговор.'
    example_gloss:
    - Алло, где ты?
    - Алло, что ты сейчас делаешь?
  fa.a2.unit47.lesson04.teach.arrive:
    title: Я уже в пути
    gloss: Я иду, я подхожу
    note: '*دارم میام* значит «я уже в пути», а *دارم می‌رسم* — «я как раз подъезжаю / почти на месте».'
    example_gloss:
    - Я иду.
    - Я подъезжаю.
  fa.a2.unit47.lesson04.teach.talk:
    title: Разговор и звонки
    gloss: с, моя мама, разговаривать, я разговариваю, звонить, он / она звонит
    note: '*حرف زدن* — «разговаривать», а *زنگ زدن* — «звонить по телефону».'
    example_gloss:
    - Я разговариваю с мамой.
    - Мама звонит.
  fa.a2.unit47.lesson04.teach.rule:
    title: Процесс действия в телефонном разговоре
    gloss: Я иду; я разговариваю с мамой
    note: 'В телефонных разговорах часто используется форма длительного действия: она сообщает собеседнику, чем ты занят прямо сейчас. *میام* — обычная разговорная форма «я прихожу»; *دارم میام* значит, что ты уже в пути.'
  fa.a2.unit47.lesson05.teach.words:
    title: Слова для текста
    gloss: сейчас ночь, все, мы дома, дети, телевизор, они смотрят, тоже
    note: '*شبه* — «сейчас ночь»; *خونه‌ایم* — «мы дома».'
    example_gloss:
    - Сейчас ночь, и мы все дома.
    - Дети смотрят телевизор.
    - Мама тоже звонит.
  fa.a2.unit47.lesson05.teach.reading:
    title: Вечер дома
    gloss: Сейчас ночь, и мы все дома. Я готовлю ужин. Нима моет посуду. Дети смотрят телевизор. Мама тоже звонит.
    note: Сначала прочитай один раз, чтобы понять, кто что делает, а потом ещё раз — обращая внимание на глагольные формы с *دارم, داره, دارن*.
  fa.a2.unit47.lesson06.teach.turn01:
    title: Сара звонитНиме
    gloss: 'Сара: Алло, Нима, ты где?'
    note: '*کجایی؟* — вопрос «где ты?».'
  fa.a2.unit47.lesson06.teach.turn02:
    title: Нима уже в пути
    gloss: 'Нима: Я уже иду. А ты что делаешь?'
    note: '*دارم میام* значит, что он уже в пути.'
  fa.a2.unit47.lesson06.teach.turn03:
    title: Сара готовит
    gloss: 'Сара: Я готовлю ужин.'
    note: '*دارم … درست می‌کنم* — форма длительного действия.'
  fa.a2.unit47.lesson06.teach.turn04:
    title: Нима спрашивает о детях
    gloss: 'Нима: А дети?'
    note: Короткий вопрос, который подхватывает тему.
  fa.a2.unit47.lesson06.teach.turn05:
    title: Сара отвечает
    gloss: 'Сара: Они смотрят телевизор.'
    note: '*دارن … می‌بینن* — форма «они».'
  fa.a2.unit47.lesson06.teach.turn06:
    title: Нима подъезжает
    gloss: 'Нима: Хорошо. Я уже подъезжаю.'
    note: '*دارم می‌رسم* значит, что он почти на месте.'
