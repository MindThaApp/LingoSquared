course:
  title: Персидский A2
  description: 'Иранский фарси, уровень ниже среднего: открытие банковского счёта — как узнать, какие нужны документы, как вежливо выразить просьбу с условием и как понять разговор у банковского окна от просьбы до получения карты.'
units:
  fa.a2.unit11.banking:
    title: Открытие банковского счёта
lessons:
  fa.a2.unit11.lesson01.banking_vocabulary:
    title: Банковские слова
  fa.a2.unit11.lesson02.requesting_an_account:
    title: Просьба открыть счёт
  fa.a2.unit11.lesson03.reading_a_bank_notice:
    title: Читаем объявление банка
  fa.a2.unit11.lesson04.bank_counter_dialogue:
    title: У банковского окна
teaching:
  fa.a2.unit11.lesson01.teach.bank_word:
    title: Банк
    gloss: банк
    note: '*بانک* — общее слово для обозначения банка.'
    example_gloss: Банк рядом с моим новым домом.
  fa.a2.unit11.lesson01.teach.account_word:
    title: Счёт
    gloss: счёт
    note: '*حساب* — общее слово для обозначения счёта.'
    example_gloss: Я хочу открыть счёт.
  fa.a2.unit11.lesson01.teach.bank_card_word:
    title: Банковская карта
    gloss: банковская карта
    note: '*کارت بانکی* — обычная дебетовая банковская карта, которую выдают при открытии счёта.'
    example_gloss: У моей банковской карты есть ПИН-код.
  fa.a2.unit11.lesson01.teach.pin_word:
    title: ПИН-код
    gloss: ПИН-код / пароль
    note: '*رمز* — слово для ПИН-кода или пароля.'
    example_gloss: Не забудь ПИН-код своей карты.
  fa.a2.unit11.lesson01.teach.balance_word:
    title: Остаток
    gloss: остаток на счёте
    note: '*موجودی* — слово для обозначения остатка на счёте.'
    example_gloss: На моём счёте мало денег.
  fa.a2.unit11.lesson01.teach.document_word:
    title: Документ
    gloss: документ
    note: '*مدرک* — общее слово для документа; оно уже встречалось в предыдущем уроке о регистрации.'
    example_gloss: Чтобы открыть счёт, нужен документ.
  fa.a2.unit11.lesson01.teach.baz_kardan_note:
    title: Открыть (составной глагол)
    gloss: открыть
    note: '*باز کردن* буквально значит «открытым сделать» — в персидском многие глаголы образуются так: существительное или прилагательное плюс вспомогательный глагол, например *کردن*.'
  fa.a2.unit11.lesson01.teach.ra_note:
    title: Показатель прямого дополнения
    gloss: (показатель определённого прямого дополнения)
    note: '*رو* (разговорная форма литературного *را*) отмечает определённое прямое дополнение — оно ставится сразу после того, на что направлено действие.'
  fa.a2.unit11.lesson01.teach.recap_registration_terms:
    title: Национальная ID-карта и подтверждение адреса
    gloss: национальная ID-карта и документ, подтверждающий адрес
    note: '*کارت ملی* и *مدرک آدرس* — два документа, которые нужны для визита в банк в этом уроке; они уже встречались в уроке о регистрации.'
  fa.a2.unit11.lesson02.teach.i_want_to_open_account:
    title: Просьба открыть счёт
    gloss: Я хотел бы открыть банковский счёт.
    note: '*می‌خواستم ...* — та же вежливая смягчённая форма просьбы, что и в уроке о регистрации.'
  fa.a2.unit11.lesson02.teach.if_bring_documents:
    title: Условие с اگر («если»)
    gloss: Если вы принесёте документы, вы сможете открыть счёт уже сегодня.
    note: '*اگر ...، ...* — условная конструкция уровня A2: сначала условие, затем результат.'
  fa.a2.unit11.lesson02.teach.full_request_with_condition:
    title: Соединяем просьбу и условие
    gloss: Я хотел бы открыть банковский счёт. Если вы принесёте документы, это можно сделать уже сегодня.
    note: Полная модель «просьба + условие», вокруг которой построен этот урок.
  fa.a2.unit11.lesson03.teach.necessary_word:
    title: Нужный
    gloss: нужный / необходимый
    note: '*لازم* — общее слово со значением «нужный, необходимый».'
    example_gloss: Чтобы открыть счёт, нужна национальная ID-карта.
  fa.a2.unit11.lesson03.teach.working_hours_word:
    title: Часы работы
    gloss: часы работы
    note: '*ساعت کاری* — стандартное выражение для часов работы заведения.'
    example_gloss: Банк работает с 8 утра до 2 часов дня.
  fa.a2.unit11.lesson03.teach.notice_text:
    title: Объявление банка об открытии счёта
    gloss: Чтобы открыть счёт, нужны национальная ID-карта и документ, подтверждающий адрес. Банк работает с 8 утра до 2 часов дня.
    note: Короткое официальное объявление в нейтральном письменном стиле, хотя в нём всё же используется разговорное *لازمه*.
  fa.a2.unit11.lesson04.teach.how_can_i_help:
    title: Чем могу помочь?
    gloss: Пожалуйста, чем я могу вам помочь?
    note: '*بفرمایید، چه کمکی می‌تونم بکنم؟* — стандартное вежливое приветствие у окна обслуживания.'
  fa.a2.unit11.lesson04.teach.turn01:
    title: Сотрудник приветствует سارا
    gloss: Сотрудник здоровается и спрашивает, чем может помочь.
    note: Здесь повторяется фраза-приветствие из этого урока.
  fa.a2.unit11.lesson04.teach.turn02:
    title: سارا говорит о своей просьбе
    gloss: سارا говорит, что хотела бы открыть банковский счёт.
    note: Здесь повторяется модель *می‌خواستم ...* из предыдущего урока.
  fa.a2.unit11.lesson04.teach.turn03:
    title: کارمند просит документы
    gloss: Сотрудник спрашивает, есть ли у неё национальная ID-карта и документ, подтверждающий адрес.
    note: '*کارت ملی* и *مدرک آدرس* уже встречались в уроке о регистрации.'
  fa.a2.unit11.lesson04.teach.turn04:
    title: سارا подтверждает, что принесла
    gloss: 'Сара отвечает «да»: она принесла свой национальный паспорт-карту и счёт за электричество за новый дом.'
    note: В слове *قبض برق* (счёт за электричество) используется *قبض* — слово из прежнего урока о регистрации.
  fa.a2.unit11.lesson04.teach.turn05:
    title: کارمند подтверждает срок
    gloss: 'Сотрудница говорит: отлично, банковская карта будет готова через три дня.'
    note: '*تا سه روز دیگه* (в течение трёх дней) указывает срок изготовления.'
  fa.a2.unit11.lesson04.teach.turn06:
    title: سارا спрашивает о ПИН-коде
    gloss: Сара спрашивает, когда она получит ПИН-код.
    note: Здесь *کی* значит «когда»; это же слово значит и «кто», а различить их помогает контекст.
  fa.a2.unit11.lesson04.teach.turn07:
    title: کارمند отвечает про ПИН-код
    gloss: 'Сотрудница говорит: в тот же день, когда ты получишь карту.'
    note: '*همون روزی که ...* значит «в тот самый день, когда ...».'
