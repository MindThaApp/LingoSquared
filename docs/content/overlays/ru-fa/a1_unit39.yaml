teaching:
  fa.a1.unit39.lesson01.teach.review_komak:
    title: 'Повторение: помощь'
    gloss: помощь
    note: Слово *کمک* («помощь») ты уже встречал(а) раньше.
  fa.a1.unit39.lesson01.teach.lazame:
    title: Нужный
    gloss: нужен / нужна / нужно
    note: '*لازمه* — одно слово со значением «нужен / нужна / нужно». Оно образовано так же, как *قشنگه* («красивый / красиво») и *گرمه* («горячий / жарко»).'
    example_gloss: Нужна помощь!
  fa.a1.unit39.lesson01.teach.polis:
    title: Полиция
    gloss: полиция
    note: '*پلیس* означает «полиция». Это заимствованное слово, которое используется в повседневной речи.'
    example_gloss: Нужна полиция!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Скорая помощь
    gloss: скорая помощь
    note: '*آمبولانس* означает «скорая помощь» (машина скорой помощи).'
    example_gloss: Нужна скорая помощь!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: Пожарная служба
    gloss: пожарная служба
    note: '*آتش‌نشانی* означает «пожарная служба» или «пожарная охрана».'
    example_gloss: Нужна пожарная служба!
  fa.a1.unit39.lesson02.teach.atash:
    title: Огонь
    gloss: пожар
    note: '*آتش* означает «огонь, пожар». Это корень слова *آتش‌نشانی* («пожарная служба»).'
    example_gloss: Пожар! Нужна пожарная служба!
  fa.a1.unit39.lesson02.teach.khatar:
    title: Опасность
    gloss: опасность
    note: '*خطر* означает «опасность».'
    example_gloss: Опасность! Нужна полиция!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'Повторение: вежливая и неформальная формы приказа'
    gloss: сделайте! (вежливо) / сделай! (неформально)
    note: '*کنید* — окончание вежливой формы приказа или формы для нескольких людей (как «вы» в русском). Неформальное *کن*, которое ты использовал(а) с друзьями в *استراحت کن* («отдыхай!»), — форма для одного хорошо знакомого человека.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: На помощь!
    gloss: Помогите!
    note: '*کمک کنید!* — вежливый способ позвать на помощь, он подходит для незнакомых людей и сотрудников экстренных служб.'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: Авария
    gloss: авария
    note: '*تصادف* означает «авария» (столкновение).'
    example_gloss: Авария! Помогите!
  fa.a1.unit39.lesson03.teach.orjans:
    title: Экстренная ситуация
    gloss: экстренная ситуация
    note: '*اورژانس* означает «экстренная ситуация»; так же называется приёмное отделение скорой помощи в больнице.'
    example_gloss: Это экстренный случай! Помогите!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'Повторение: алло / хорошо / спасибо'
    gloss: алло (по телефону) / хорошо / спасибо
    note: Слова *الو*, *باشه* и *ممنون* ты уже встречал(а) раньше.
  fa.a1.unit39.lesson04.teach.review_miad:
    title: Едет
    gloss: едет
    note: '*میاد* («он / она / оно едет, идёт») изменяется по лицам так же, как *میام* («я иду, я приеду»), которое ты изучал(а) раньше.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: Приезжайте быстро!
    gloss: Приезжайте быстро!
    note: '*زود* означает «быстро»; *بیایید* — вежливая форма приказа «приходите, приезжайте!»'
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: Позвоните!
    gloss: Позвоните!
    note: '*زنگ بزنید!* — вежливая форма приказа от глагола *زنگ زدن* («звонить»), который ты изучал(а) раньше.'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'Нима: Алло! Помогите! Нужна полиция!'
    gloss: Алло! Помогите! Нужна полиция!
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'Сара: Хорошо. Полиция едет.'
    gloss: Хорошо. Полиция едет.
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'Нима: Спасибо! Приезжайте быстрее!'
    gloss: Спасибо! Приезжайте быстрее!
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'Сара: Хорошо!'
    gloss: Хорошо!
  fa.a1.unit39.lesson05.teach.reading_note:
    title: Об этом объявлении
    gloss: Авария / опасность / пожар
    note: 'В объявлении после каждого вида экстренной ситуации стоит вопросительный знак, как будто спрашивают: «В случае аварии?». Служба, которой нужно позвонить, названа сразу после него.'
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'Чтение: экстренное объявление'
    gloss: Авария? Нужна скорая помощь! Опасность? Нужна полиция! Пожар? Нужна пожарная служба! Звоните быстрее!
    note: Короткое объявление о том, в какую службу звонить при разных видах экстренных ситуаций.
  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: Нужна полиция! Помогите!
    gloss: Нужна полиция! Помогите!
    note: Повторительное предложение, составленное только из слов этого урока.
  fa.a1.unit39.lesson06.teach.review_orjans_biayid:
    title: Это экстренный случай! Приезжайте быстрее!
    gloss: Это экстренный случай! Приезжайте быстрее!
