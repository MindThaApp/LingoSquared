    - value: Книга, которую я купил, хорошая.
      status: correct
    feedback: '*کتابی که خریدم* — «книга, которую я купил»; *خوبه* говорит, что она хорошая.'
  fa.a2.unit40.lesson01.exercise02.recognize_bag:
