teaching:
  fa.a2.unit40.lesson01.teach.things:
    title: Повседневные вещи
    gloss: книга, сумка, ключ, телефон, часы
    note: '*ساعت* означает и «часы», и «час (время)»; какое значение, подскажет предложение.'
    example_gloss:
    - У меня есть книга.
    - У меня есть сумка.
    - У меня есть ключ.
    - У меня есть телефон.
    - У меня есть часы.
  fa.a2.unit40.lesson01.teach.verbs:
    title: Купил, потерял, нашёл
    gloss: я купил, я потерял, я нашёл
    note: 'Все три глагола стоят в простом прошедшем времени, в 1-м лице. *گم کردم* и *پیدا کردم* — глаголы из двух слов: сначала идёт существительное.'
    example_gloss:
    - Вчера я купил книгу.
    - Вчера я потерял ключ.
    - Вчера я нашёл телефон.
  fa.a2.unit40.lesson01.teach.rel1:
    title: 'Существительное + ی + که: «тот ..., который ...»'
    gloss: книга, которую я купил; сумка, которую я потерял; ключ, который я нашёл
    note: 'Чтобы указать, о какой именно вещи речь, добавь к существительному *ی*, затем *که* и короткую часть предложения: *کتاب* + *ی* + *که خریدم*. Вся группа works как одно существительное. Как и в русском, в этой части есть «который», но в персидском нет лишнего местоимения-дополнения: *کتابی که خریدم* (буквально «книга, что купил»), а не «книга, которую я купил её».'
  fa.a2.unit40.lesson01.teach.rel2:
    title: Вся группа — подлежащее предложения
    gloss: Книга, которую я купил, хорошая; сумка, которую я потерял, была маленькой
    note: 'Группа *کتابی که خریدم* может стоять в начале предложения, как любое существительное, а дальше идёт глагол или прилагательное: *کتابی که خریدم خوبه*.'
  fa.a2.unit40.lesson02.teach.people:
    title: Люди на работе
    gloss: коллега, руководитель, клиент, мужчина, женщина
    note: '*همکارم* — «мой коллега». *خانم* также вежливое обращение к женщине, вроде «госпожа».'
    example_gloss:
    - Мой коллега здесь.
    - Руководитель вон там.
    - Клиент здесь.
    - Тот мужчина вон там.
    - Та женщина здесь.
  fa.a2.unit40.lesson02.teach.verbs:
    title: Работает, сидит, позвонил
    gloss: он/она работает, сидит, позвонил(а)
    note: '*نشسته* значит «сидит» (состояние). *زنگ زد* — «позвонил (по телефону)».'
    example_gloss:
    - Мой коллега работает в банке.
    - Руководитель сидит вон там.
    - Клиент вчера позвонил.
  fa.a2.unit40.lesson02.teach.rel_subject:
    title: '«Который» о людях: та же модель'
    gloss: мужчина, который там сидит; коллега, который работает в банке; клиент, который позвонил
    note: Для людей в персидском используется тот же *که*, что и для вещей; отдельного слова вроде «кто» или «который» для людей нет. Человек — тот, кто выполняет действие глагола в этой части.
  fa.a2.unit40.lesson02.teach.rel_spelling:
    title: Написание ی после ه и ی
    gloss: 'после согласной: ی; после непроизносимой ه или конечной ی: ‌ای'
    note: 'После согласной окончание пишется *ی* (*کتابی*). После непроизносимой *ه* или после *ی* оно пишется *ای* с маленьким промежутком: *خونه‌ای*, *مشتری‌ای*. На слух это тот же звук «и».'
  fa.a2.unit40.lesson03.teach.which:
    title: Какой, тот, тот самый
    gloss: какой, тот, тот самый
    note: '*کدوم؟* спрашивает «какой?» (из нескольких). *اون* указывает на предмет; *همون* значит «тот самый».'
    example_gloss:
    - Какая книга?
    - Та книга хорошая.
    - Та самая книга здесь.
  fa.a2.unit40.lesson03.teach.answer:
    title: Отвечаем на «какой?» группой с «который»
    gloss: Какая сумка? Та, которую я потерял.
    note: 'Проще всего ответить на *کدوم؟* такой группой. Перед ней можно поставить *اون* или *همون*: *همون کیفی که گم کردم* (та самая сумка, которую я потерял).'
  fa.a2.unit40.lesson03.teach.time:
    title: Больше слов внутри группы
    gloss: книга, которую я купил вчера; часы, которые я нашёл сегодня
    note: 'В этой части могут быть и другие слова (время, место) перед глаголом. Глагол всё равно стоит последним: *کتابی که دیروز خریدم*.'
  fa.a2.unit40.lesson04.teach.lost_things:
    title: Что люди теряют
    gloss: очки, кошелёк, цвет
    note: '*کیف پول* — «кошелёк»: *کیف* (сумка) + *پول* (деньги).'
    example_gloss:
    - Мои очки здесь.
    - Мой кошелёк вон там.
    - Этот цвет красивый.
  fa.a2.unit40.lesson04.teach.colours:
    title: Цвета и «какого цвета?»
    gloss: чёрный, красный, синий, какой/что
    note: '*چه رنگیه؟* спрашивает «какого это цвета?».'
    example_gloss:
    - Моя сумка чёрная.
    - Мои очки красные.
    - Мой телефон синий.
    - Какого цвета твоя сумка?
  fa.a2.unit40.lesson04.teach.describe:
    title: Описываем потерянную вещь
    gloss: Какого цвета сумка, которую вы потеряли? Сумка, которую я потерял, чёрная.
    note: 'В бюро находок сотрудник спрашивает о вещи такой группой, а ты отвечаешь другой группой или просто цветом: *سیاهه*. Сотрудник обращается на «вы» (*شما*, *گم کردید*).'
  fa.a2.unit40.lesson05.teach.reading:
    title: Потерянная сумка
    gloss: 'Вчера Сара потеряла свою сумку. Сумка, которую она потеряла, была чёрной. В сумке были телефон и ключ. Сегодня Сара пошла в бюро находок. Сотрудник, который там работает, сказал: «Сумка, которую мы нашли, чёрная». Сара обрадовалась.'
    note: Прочитай один раз, чтобы понять, что произошло, а потом ещё раз — обращая внимание на группы с *که*.
  fa.a2.unit40.lesson06.teach.turn01:
    title: Нима сообщает о потерянной сумке
    gloss: 'Нима: Извините, я потерял сумку.'
    note: '*گم کردم* — «я потерял».'
  fa.a2.unit40.lesson06.teach.turn02:
    title: Сотрудник просит описание
    gloss: 'Сотрудник: Какого цвета сумка, которую вы потеряли?'
    note: 'Сотрудник говорит «вы» (*شما*): *گم کردید*.'
  fa.a2.unit40.lesson06.teach.turn03:
    title: Нима отвечает
    gloss: 'Нима: Чёрная.'
    note: Достаточно короткого ответа.
  fa.a2.unit40.lesson06.teach.turn04:
    title: Сотрудник уточняет, какая именно
    gloss: 'Сотрудник: Какая сумка? Та, что маленькая?'
    note: '*اونی که کوچیکه* — «та, которая маленькая»: *اونی* заменяет существительное.'
  fa.a2.unit40.lesson06.teach.turn05:
    title: Нима подтверждает
    gloss: 'Нима: Да, именно та сумка, которая маленькая.'
    note: '*همون کیفی که کوچیکه* повторяет описание.'
  fa.a2.unit40.lesson06.teach.turn06:
    title: Сотрудник показывает на коллегу
    gloss: 'Сотрудник: Коллега, который там сидит, нашёл сумку. Сумка, которую он нашёл, чёрная.'
    note: '*پیدا کرده* — перфект, «нашёл» (уже нашёл).'
