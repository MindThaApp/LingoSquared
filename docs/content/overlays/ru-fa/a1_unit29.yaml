course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: названия повседневных устройств (телефон, компьютер, интернет, приложение), действия с телефоном (отправить сообщение, позвонить, сфотографировать, скачать приложение), вопрос и ответ о том, как часто ты пользуешься телефоном (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), текст для чтения о том, как *نیما* и *سارا* пользуются устройствами, и итоговый диалог между *نیما* и *سارا* о том, как каждый из них использует технологии.'
