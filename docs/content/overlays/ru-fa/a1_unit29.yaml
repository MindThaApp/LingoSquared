  fa.a1.unit29.lesson01.teach.review_man_in_daram:
    title: Я / это / у меня есть
    gloss: я / этот / у меня есть
    note: Знакомые слова *من*, *این* и *دارم* снова встречаются здесь, когда речь идёт об устройствах, которые у тебя есть.
    target_text: من (я) / این (это) / دارم (у меня есть)
  fa.a1.unit29.lesson01.teach.review_estefade_mikonam:
    title: Использовать + я делаю = я использую
    gloss: использование + я делаю = я пользуюсь
    note: '*استفاده* вместе с *می‌کنم* («я делаю») означает «я пользуюсь». Предлог *از* указывает на то, чем пользуешься.'
    target_text: استفاده (использование) + می‌کنم (я делаю) = استفاده می‌کنم (я пользуюсь)
  fa.a1.unit29.lesson01.teach.combined_sentence:
    title: Я пользуюсь интернетом
    gloss: Я пользуюсь интернетом
    note: '*من از اینترنت استفاده می‌کنم* состоит из *من* + *از* + *اینترنت* + *استفاده می‌کنم*.'
