teaching:
  fa.a1.unit05.lesson01.teach.hotel:
    title: Отель
    gloss: отель
    note: هتل — обычное персидское слово для отеля.
    example_gloss: Наш отель близко.
  fa.a1.unit05.lesson01.teach.restoran:
    title: Ресторан
    gloss: ресторан
    note: رستوران — распространённое заимствованное слово, которым называют ресторан.
    example_gloss: Этот ресторан хороший.
  fa.a1.unit05.lesson01.teach.dastshooyi:
    title: Туалет
    gloss: туалет
    note: دستشویی — повседневное слово для туалета.
    example_gloss: Где туалет?
  fa.a1.unit05.lesson01.teach.inja_oonja:
    title: Здесь, там
    gloss: здесь, там
    note: اینجا («здесь») и اونجا («там», разговорная форма от آنجا) — обычные формы разговорной речи.
  fa.a1.unit05.lesson01.teach.kojast:
    title: Где отель?
    gloss: Где отель?
    note: کجاست состоит из کجا («где») и است («есть», «находится»).
  fa.a1.unit05.lesson01.teach.bebakhshid:
    title: Извините, где отель?
    gloss: Извините, где отель?
    note: ببخشید («извините») — стандартный вежливый способ начать вопрос к незнакомому человеку.
  fa.a1.unit05.lesson02.teach.samt:
    title: Сторона, направление
    gloss: сторона, направление
    note: سمت употребляется с راست/چپ в значении «правая/левая сторона».
    example_gloss: Отель в этой стороне.
  fa.a1.unit05.lesson02.teach.rast:
    title: Право
    gloss: направо; правый
    note: В других контекстах راست также означает «правда, верно», но здесь это обозначение направления.
    example_gloss: Идите направо.
  fa.a1.unit05.lesson02.teach.chap:
    title: Лево
    gloss: налево; левый
    note: چپ — обозначение направления.
    example_gloss: Идите налево.
  fa.a1.unit05.lesson02.teach.samte_rast:
    title: Это справа
    gloss: Это справа.
    note: В разговорной речи سمت راست است превращается в سمت راسته.
  fa.a1.unit05.lesson02.teach.samte_chap:
    title: Это слева
    gloss: Это слева.
    note: В разговорной речи سمت چپ است превращается в سمت چپه.
  fa.a1.unit05.lesson02.teach.restoran_samte_rast:
    title: Ресторан справа
    gloss: Ресторан справа.
    note: Сочетает слово رستوران с фразой о расположении из этого урока.
  fa.a1.unit05.lesson03.teach.mostaghim:
    title: Прямо
    gloss: прямо
    note: مستقیم — обычное слово для «идти прямо».
    example_gloss: Идите прямо.
  fa.a1.unit05.lesson03.teach.berid:
    title: Идите (вежливо)
    gloss: идите (вежливая форма)
    note: برید — вежливая форма, которую используют, когда говорят незнакомому человеку, куда идти.
    example_gloss: Идите направо.
  fa.a1.unit05.lesson03.teach.mostaghim_berid:
    title: Иди прямо
    gloss: Иди прямо.
    note: مستقیم برید — стандартное вежливое указание.
  fa.a1.unit05.lesson03.teach.bad:
    title: Потом, после этого
    gloss: потом, после этого
    note: بعد связывает два шага маршрута.
    example_gloss: Потом идите налево.
  fa.a1.unit05.lesson03.teach.mostaghim_bad_samte_rast:
    title: Идите прямо; справа есть ресторан
    gloss: Идите прямо. Потом справа будет ресторан.
    note: Здесь снова используется سمت راست (справа) из предыдущего урока, а фраза дополняется ориентиром.
  fa.a1.unit05.lesson03.teach.mamnoon:
    title: Спасибо. Пожалуйста.
    gloss: Спасибо. Пожалуйста.
    note: ممنون / خواهش می‌کنم — стандартный вежливый обмен репликами, который уже встречался в Уроке 1.
  fa.a1.unit05.lesson04.teach.kenar:
    title: Рядом с
    gloss: рядом с, возле
    note: 'کنار помещает один предмет рядом с другим: هتل کنار رستورانه означает «отель рядом с рестораном».'
    example_gloss: Отель рядом с рестораном.
  fa.a1.unit05.lesson04.teach.azadi:
    title: Азади (название)
    gloss: Азади (свобода)
    note: آزادی широко используется в иранских географических и коммерческих названиях, поэтому هتل آزادی звучит как естественное название отеля.
    example_gloss: Площадь Азади знаменита.
  fa.a1.unit05.lesson04.teach.hamoon:
    title: Тот самый
    gloss: тот самый
    note: همون — разговорная форма слова همان; указывает на только что упомянутый ресторан.
    example_gloss: Тот самый ресторан хороший.
  fa.a1.unit05.lesson04.teach.dialogue_line1:
    title: Извините, где отель «Азади»?
    gloss: 'Сара: Извините, где отель «Азади»?'
    note: Сара — уже знакомая героиня из Урока 2.
  fa.a1.unit05.lesson04.teach.dialogue_line2:
    title: Идите прямо; отель рядом с рестораном
    gloss: 'Прохожий: Идите прямо. Потом справа будет ресторан. Отель рядом с этим рестораном.'
    note: کنار означает «рядом с»; همون رستورانه указывает на только что упомянутый ресторан.
  fa.a1.unit05.lesson04.teach.dialogue_line3:
    title: Спасибо
    gloss: 'Сара: Спасибо.'
    note: Сара благодарит прохожего.
  fa.a1.unit05.lesson04.teach.dialogue_line4:
    title: Пожалуйста
    gloss: 'Прохожий: Пожалуйста.'
    note: Прохожий вежливо завершает разговор.
