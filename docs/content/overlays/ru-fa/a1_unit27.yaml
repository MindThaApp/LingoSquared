course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: названия видов спорта (футбол, баскетбол, волейбол, плавание), вопрос «Каким спортом ты увлекаешься?», где ты занимаешься спортом (спортзал, бассейн, парк), как часто (каждый день, каждую неделю, иногда, N раз), короткий текст о спортивном распорядке نیما и заключительный диалог между نیما и سارا: кто каким спортом занимается, как часто и где.'
