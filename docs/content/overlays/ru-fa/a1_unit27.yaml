teaching:
  fa.a1.unit27.lesson01.teach.man_review:
    title: Я
    gloss: я
    note: Слово *من* ты уже хорошо знаешь. Здесь оно снова встречается, когда ты говоришь о своём спорте.
  fa.a1.unit27.lesson01.teach.varzesh_review:
    title: Спорт / занятия спортом
    gloss: спорт / занятия спортом
    note: '*ورزش* — общее слово для «спорта» и «физических упражнений». На нём строится весь этот урок.'
    example_gloss: Спорт — это хорошо.
  fa.a1.unit27.lesson01.teach.mikonam_review:
    title: Я делаю
    gloss: я делаю
    note: '*می‌کنم* — глагол «делать». В этом уроке он используется, когда речь идёт о занятиях спортом.'
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: Футбол
    gloss: футбол
    note: '*فوتبال* — первый вид спорта в этом уроке.'
    example_gloss: Футбол — это спорт.
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: Я играю в футбол
    gloss: я играю в футбол
    note: '*فوتبال بازی می‌کنم* значит «я играю в футбол». *بازی* означает «игра; играть».'
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: Баскетбол
    gloss: баскетбол
    note: '*بسکتبال* — заимствованное слово, которое привычно используется в повседневной речи.'
    example_gloss: Я люблю баскетбол.
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: Я играю в баскетбол
    gloss: я играю в баскетбол
    note: '*بسکتبال بازی می‌کنم* строится точно так же, как *فوتبال بازی می‌کنم*: просто меняется вид спорта.'
  fa.a1.unit27.lesson02.teach.volleyball_word:
    title: Волейбол
    gloss: волейбол
    note: '*والیبال* — заимствованное слово, которое привычно используется в повседневной речи.'
    example_gloss: Он/она любит волейбол.
  fa.a1.unit27.lesson02.teach.volleyball_bazi_mikonam_phrase:
    title: Я играю в волейбол
    gloss: я играю в волейбол
    note: '*والیبال بازی می‌کنم* строится по той же модели *بازی می‌کنم*, что и футбол с баскетболом.'
  fa.a1.unit27.lesson02.teach.shena_word:
    title: Плавание
    gloss: плавание
    note: '*شنا* значит «плавание». В отличие от футбола, баскетбола и волейбола, это слово сочетается прямо с *می‌کنم*, а не с *بازی می‌کنم*, потому что это не игра с мячом.'
    example_gloss: Я люблю плавать.
  fa.a1.unit27.lesson02.teach.shena_mikonam_phrase:
    title: Я плаваю
    gloss: я плаваю
    note: '*شنا می‌کنم* значит «я плаваю», буквально «я делаю плавание».'
  fa.a1.unit27.lesson02.teach.che_review:
    title: Какой / что
    gloss: какой / что
    note: Слово *چه* используется здесь в новой модели вопроса.
  fa.a1.unit27.lesson02.teach.doost_dari_review:
    title: Ты любишь
    gloss: ты любишь
    note: '*دوست داری* снова встречается здесь, когда мы спрашиваем о спорте.'
  fa.a1.unit27.lesson02.teach.che_varzeshi_phrase:
    title: Каким спортом ты увлекаешься?
    gloss: какой спорт ты любишь?
    note: '*چه ورزشی دوست داری؟* сочетает *چه*, *ورزش* и окончание *-ی* (получается «какой спорт») с *دوست داری*. Так естественно спросить, какой спорт человеку нравится.'
  fa.a1.unit27.lesson03.teach.koja_review:
    title: Где
    gloss: где
    note: Слово *کجا* здесь работает так же — им спрашивают о месте занятий спортом.
  fa.a1.unit27.lesson03.teach.koja_varzesh_mikoni_phrase:
    title: Где ты занимаешься спортом?
    gloss: где ты занимаешься спортом?
    note: '*کجا ورزش می‌کنی؟* сочетает *کجا* со словом *ورزش* и формой 2-го лица от *می‌کنم*.'
  fa.a1.unit27.lesson03.teach.mieram_review:
    title: Я иду
    gloss: я хожу / я иду
    note: '*می‌رم* снова встречается здесь, когда речь идёт о походе в спортивное место.'
  fa.a1.unit27.lesson03.teach.bashgah_word:
    title: Спортзал
    gloss: спортзал
    note: '*باشگاه* значит «спортзал» или «клуб». Как и в *می‌رم سینما* из урока 24, предлог не нужен: просто *می‌رم* + место.'
    example_gloss: Я иду в спортзал.
  fa.a1.unit27.lesson03.teach.estakhr_word:
    title: Бассейн
    gloss: бассейн
    note: '*استخر* значит «плавательный бассейн».'
    example_gloss: Я хожу в бассейн и плаваю.
  fa.a1.unit27.lesson03.teach.park_word:
    title: Парк
    gloss: парк
    note: '*پارک* — заимствованное слово, «парк».'
    example_gloss: Я хожу в парк и играю в футбол.
  fa.a1.unit27.lesson04.teach.har_rooz_review:
    title: Каждый день
    gloss: каждый день
    note: '*هر روز* снова встречается здесь, когда речь идёт о частоте занятий спортом.'
  fa.a1.unit27.lesson04.teach.har_hafte_review:
    title: Каждую неделю
    gloss: каждую неделю
    note: '*هر هفته* снова встречается здесь.'
  fa.a1.unit27.lesson04.teach.gahi_review:
    title: Иногда
    gloss: иногда
    note: '*گاهی* снова встречается здесь.'
  fa.a1.unit27.lesson04.teach.baar_word:
    title: Раз / случай
    gloss: раз / случай
    note: '*بار* — счётное слово со значением «раз». Оно употребляется с числом, чтобы сказать, как часто что-то происходит.'
    example_gloss: Я занимаюсь спортом один раз.
  fa.a1.unit27.lesson04.teach.do_se_review:
    title: Два / три
    gloss: два / три
    note: '*دو* и *سه* используются здесь, чтобы посчитать, сколько раз.'
  fa.a1.unit27.lesson04.teach.do_baar_phrase:
    title: Два раза
    gloss: два раза
    note: '*دو بار* — это *دو* («два») и *بار*: «два раза».'
  fa.a1.unit27.lesson04.teach.se_baar_phrase:
    title: Три раза
    gloss: три раза
    note: '*سه بار* — это *سه* («три») и *بار*: «три раза».'
  fa.a1.unit27.lesson04.teach.har_hafte_do_baar_phrase:
    title: Я занимаюсь спортом два раза в неделю
    gloss: я занимаюсь спортом два раза в неделю
    note: '*هر هفته دو بار ورزش می‌کنم* объединяет всё из этого урока: «каждую неделю», «два раза» и «я занимаюсь спортом».'
  fa.a1.unit27.lesson05.teach.nima_review:
    title: Нима
    gloss: Нима
    note: '*نیما* — персонаж, с которым ты познакомился ещё в уроке 11. Здесь он снова появляется.'
    example_gloss: Нима любит спорт.
  fa.a1.unit27.lesson05.teach.dare_review:
    title: У него/неё есть / он/она любит
    gloss: у него/неё есть / он/она любит
    note: '*داره* — форма 3-го лица единственного числа. В выражении *ورزش دوست داره* оно значит «он/она любит спорт».'
  fa.a1.unit27.lesson05.teach.mikone_review:
    title: Он/она делает
    gloss: он/она делает
    note: '*می‌کنه* ты уже мельком видел в тексте для чтения в уроке 24. Это разговорная форма 3-го лица от *می‌کنم*.'
  fa.a1.unit27.lesson05.teach.mire_word:
    title: Он/она ходит
    gloss: он/она ходит
    note: '*می‌ره* — разговорная форма 3-го лица того же глагола, что и *می‌رم* («я иду») из урока 3.'
  fa.a1.unit27.lesson05.teach.ham_review:
    title: Тоже / также
    gloss: тоже / также
    note: '*هم* значит «тоже» или «также».'
  fa.a1.unit27.lesson05.teach.va_review:
    title: И
    gloss: и
    note: '*و* означает «и» — ты уже встречал это слово в таком значении в уроках 5, 14, 24, 25 и 26.'
  fa.a1.unit27.lesson05.teach.reading_text:
    title: 'Чтение: спорт Нимы'
    gloss: Нима любит спорт. Каждую неделю он три раза играет в футбол. Иногда он ещё ходит в бассейн и плавает.
    note: В этом тексте повторяются все конструкции из уроков 1–4 и форма *می‌ره* из урока 5. Нового почти ничего нет — нужно лишь узнавать знакомое в связном тексте.
  fa.a1.unit27.lesson06.teach.dam_review:
    title: У меня есть / я люблю
    gloss: у меня есть / я люблю
    note: '*دارم* снова встречается здесь.'
  fa.a1.unit27.lesson06.teach.are_review:
    title: Ага
    gloss: ага
    note: '*آره* — повседневное разговорное слово со значением «да».'
  fa.a1.unit27.lesson06.teach.tochi_review:
    title: А ты?
    gloss: а ты?
    note: '*تو چی؟* снова встречается здесь, чтобы задать встречный вопрос. *تو* само по себе — неформальное «ты».'
  fa.a1.unit27.lesson06.teach.chekhoob_review:
    title: Как хорошо!
    gloss: как хорошо!
    note: '*چه خوب!* — естественная реакция и в этой ситуации.'
  fa.a1.unit27.lesson06.teach.miri_word:
    title: Ты ходишь
    gloss: ты ходишь
    note: '*می‌ری* — неформальная форма 2-го лица того же глагола, что *می‌رم* (я хожу) из урока 3 и *می‌ره* (он/она ходит) из урока 5.'
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: Отлично / великолепно
    gloss: отлично / великолепно
    note: '*عالیه* — распространённый разговорный способ сказать «отлично» или «великолепно».'
    example_gloss: Этот спортзал великолепен.
  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: 'Нима: Каким видом спорта ты увлекаешься?'
    gloss: Каким видом спорта ты увлекаешься?
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: 'Сара: Я люблю плавание. Каждую неделю я три раза хожу в бассейн. А ты?'
    gloss: Я люблю плавание. Каждую неделю я три раза хожу в бассейн. А ты?
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: 'Нима: Я люблю футбол. Каждый день я хожу в парк и играю.'
    gloss: Я люблю футбол. Каждый день я хожу в парк и играю.
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: 'Сара: Как хорошо! А в спортзал ты тоже ходишь?'
    gloss: Как хорошо! А в спортзал ты тоже ходишь?
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: 'Нима: Ага, иногда я хожу и в спортзал.'
    gloss: Ага, иногда я хожу и в спортзал.
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: 'Сара: Отлично!'
    gloss: Отлично!
