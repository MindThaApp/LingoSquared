course:
  title: Персидский A2
  description: 'Персидский язык Ирана для среднего уровня: грамматика на основе повседневных ситуаций.'
units:
  fa.a2.unit39.pass_on_message:
    title: Передаём сообщение
lessons:
  fa.a2.unit39.lesson01.hearing_the_report:
    title: Говорить и спрашивать
  fa.a2.unit39.lesson02.questions_and_requests:
    title: Вопросы и просьбы
  fa.a2.unit39.lesson03.say_ask_want:
    title: Говорит, спрашивает или хочет?
  fa.a2.unit39.lesson04.passing_on_a_message:
    title: Передаём сообщение
  fa.a2.unit39.lesson05.reading_and_listening:
    title: Читаем и слушаем
  fa.a2.unit39.lesson06.message_dialogue:
    title: Разговор о сообщении
teaching:
  fa.a2.unit39.lesson01.teach.basic_words:
    title: Люди, дни и маленькие слова
    gloss: я, ты, он/она, они, Сара, Нима, сегодня, завтра, поздно, один/какой-то, и, или, нет
    note: '*اون* означает «он/она/то», а *اونا* — «они». Отдельных слов для «он» и «она» в персидском нет.'
    example_gloss:
    - Ты и я.
    - Сара и Нима.
    - Сегодня или завтра.
  fa.a2.unit39.lesson01.teach.have_forms:
    title: Быть занятым или иметь время
    gloss: у меня есть дела, у тебя есть время, у него/неё есть время
    note: '*کار دارم* значит «у меня есть дела / я занят(а)». Окончание меняется в зависимости от лица: *دارم*, *داری*, *داره*.'
    example_gloss:
    - Сегодня у меня дела.
    - У тебя есть время завтра?
    - Завтра у Сары есть время.
  fa.a2.unit39.lesson01.teach.message_words:
    title: Сообщения и записки
    gloss: сообщение, записка, телефон, мой коллега, мой друг
    note: Сообщение по телефону — это *پیغام*, а письменное может быть *یادداشت*. Слова *همکارم* и *دوستم* не показывают, мужчина это или женщина.
    example_gloss:
    - У моего друга есть сообщение.
    - У моего коллеги есть записка.
    - У Сары есть телефон.
  fa.a2.unit39.lesson01.teach.home_forms:
    title: Быть дома
    gloss: дом, есть/находится, нет, ты находишься
    note: '*خونه هست* значит «находится дома». *هستی* — форма для «ты», а *هست* — форма для «он/она».'
    example_gloss:
    - Нима дома.
    - Сары нет дома.
    - Ты дома?
  fa.a2.unit39.lesson01.teach.say_verbs:
    title: Глаголы для передачи сообщения
    gloss: он/она говорит, они говорят, он/она спрашивает, он/она хочет
    note: Каждый глагол стоит в настоящем времени, в третьем лице. *می‌گه* используется, чтобы передать утверждение, *می‌پرسه* — вопрос, а *می‌خواد* — просьбу.
    example_gloss:
    - Мой друг говорит.
    - Они говорят.
    - Мой коллега спрашивает.
    - Сара хочет.
  fa.a2.unit39.lesson01.teach.arrive_forms:
    title: Приезжать поздно
    gloss: я приезжаю поздно, он/она приезжает поздно
    note: Один и тот же глагол *می‌رسه* подходит и для «он», и для «она».
    example_gloss:
    - Сегодня я приеду поздно.
    - Сара приезжает поздно.
  fa.a2.unit39.lesson01.teach.say_that:
    title: 'Передаём утверждение: می‌گه که'
    gloss: Я приеду поздно. Сара говорит, что приедет поздно.
    note: 'Чтобы передать утверждение, назови того, кто говорит, затем *می‌گه که*, а потом то, что было сказано. Глагол остаётся в настоящем времени. Меняется лицо: *دیر می‌رسم* (я) становится *دیر می‌رسه* (он/она). *که* («что») в речи можно опустить, но с ним передача звучит яснее.'
  fa.a2.unit39.lesson02.teach.object_pronouns:
    title: мне, тебе, ему/ей, для тебя
    gloss: мне, тебе, ему/ей, для тебя
    note: 'Эти краткие формы присоединяют лицо к глагольной группе: *بهم* (мне), *بهت* (тебе), *بهش* (ему/ей).'
    example_gloss:
    - У меня для вас сообщение.
    - У Сары для него/неё есть сообщение.
    - У Нимы для меня есть сообщение.
  fa.a2.unit39.lesson02.teach.request_verbs:
    title: Что человек хочет, чтобы ты сделал
    gloss: позвонить, прийти, ответить, прочитать
    note: 'После *می‌خواد که* второй глагол стоит в форме «ты» с приставкой *ب*: *بزنی*, *بیای*, *بدی*, *بخونی*.'
    example_gloss:
    - Сара хочет, чтобы ты ей/ему позвонил.
    - Нима хочет, чтобы ты пришёл завтра.
    - Мой коллега хочет, чтобы ты ответил.
    - Мой друг хочет, чтобы ты прочитал записку.
  fa.a2.unit39.lesson02.teach.call_forms:
    title: Я звоню, он/она звонит
    gloss: Я звоню, он/она звонит
    note: 'Настоящее время употребляется и для планов: *فردا زنگ می‌زنم* может значить «завтра я позвоню».'
    example_gloss:
    - Завтра я позвоню.
    - Сара позвонит завтра.
  fa.a2.unit39.lesson02.teach.when_forms:
    title: Когда? Ты приезжаешь
    gloss: когда, ты приезжаешь
    note: '*کی* — вопросительное слово. В передаваемом вопросе оно не меняется: *می‌پرسه که کی می‌رسی*.'
    example_gloss:
    - Когда ты приедешь завтра?
    - Мой коллега спрашивает, когда ты приедешь.
    - Когда ты бываешь дома?
  fa.a2.unit39.lesson02.teach.asks_whether:
    title: 'Передаём вопрос: می‌پرسه'
    gloss: Он/Она спрашивает, есть ли у тебя время. Он/Она спрашивает, когда ты приедешь.
    note: 'Вопрос, на который отвечают «да» или «нет», превращается в *می‌پرسه که … یا نه*: *می‌پرسه که وقت داری یا نه*. Вопросительное слово остаётся на своём месте: *می‌پرسه که کی می‌رسی*. Вопросительный знак исчезает, а глагол остаётся в настоящем времени.'
  fa.a2.unit39.lesson02.teach.wants_you_to:
    title: 'Передаём просьбу: می‌خواد که + форма с ب'
    gloss: Он(а) хочет, чтобы ты ему (ей) позвонил(а).
    note: 'Чтобы передать просьбу, используй *می‌خواد که* и глагол с *ب*: *می‌خواد که بهش زنگ بزنی*. Это не «хочет позвонить»: окончание *ـی* («ты») показывает, что действовать должен ты. Слово *که* можно опустить: *می‌خواد بهش زنگ بزنی*.'
  fa.a2.unit39.lesson03.teach.key_car:
    title: Ключ и машина
    gloss: ключ, машина, мой ключ, его/её ключ, это машина
    note: 'Добавь *ـم* для «мой» и *ـش* для «его/её»: *کلیدم*, *کلیدش*. В *تو ماشینه* слово *تو* значит «в», а *ـه* значит «есть/находится».'
    example_gloss:
    - Мой ключ в машине.
    - Его/Её ключ в машине.
    - У Сары есть машина.
  fa.a2.unit39.lesson03.teach.they_forms:
    title: Они приезжают, у них есть
    gloss: они приезжают, у них есть
    note: 'Окончание «они» — *ـن*: *می‌رسن*, *دارن*, *می‌گن*.'
    example_gloss:
    - Они приезжают поздно.
    - Завтра у них работа.
  fa.a2.unit39.lesson03.teach.three_verbs:
    title: Утверждение, вопрос или просьба?
    gloss: Он(а) говорит, что завтра у него (неё) есть время. Он(а) спрашивает, есть ли у тебя завтра время. Он(а) просит тебя позвонить.
    note: Глагол показывает, какое это сообщение. *می‌گه* — утверждение, и оно заканчивается глаголом в форме «он/она» (*داره*). *می‌پرسه* — вопрос, его глагол относится к «ты» (*داری*). *می‌خواد* — просьба, после него идёт глагол с *ب* (*بزنی*).
  fa.a2.unit39.lesson03.teach.person_shift:
    title: Что меняется при передаче
    gloss: У меня есть дела. Он(а) говорит, что у него (неё) есть дела. Мой ключ. Его/Её ключ.
    note: 'Когда ты передаёшь чужие слова, «я» из оригинала становится «он/она». Окончание глагола *ـم* превращается в *ـه* (*دارم* → *داره*), а притяжательное *ـم* — в *ـش* (*کلیدم* → *کلیدش*). В персидском нет рода, поэтому *داره* значит и «у него есть», и «у неё есть». Время не меняется: настоящее остаётся настоящим.'
  fa.a2.unit39.lesson03.teach.says_vs_they_say:
    title: 'Один человек или несколько: می‌گه и می‌گن'
    gloss: Он(а) говорит, что поздно приезжает. Они говорят, что поздно приезжают.
    note: 'Одна буква отличает одного человека от нескольких: *می‌گه … می‌رسه* (он/она) и *می‌گن … می‌رسن* (они). Оба глагола в передаче должны согласовываться.'
  fa.a2.unit39.lesson04.teach.time_words:
    title: Сейчас, сегодня вечером, совещание
    gloss: сейчас, сегодня вечером, совещание
    note: '*جلسه* — это совещание, часто на работе.'
    example_gloss:
    - У меня сейчас совещание.
    - Ты сегодня вечером дома?
    - У моего коллеги сегодня вечером совещание.
  fa.a2.unit39.lesson04.teach.phone_phrases:
    title: Фразы для сообщений
    gloss: Что говорит твой коллега? Что ещё? От кого? Да.
    note: Эти короткие фразы помогают поддерживать разговор о сообщении.
  fa.a2.unit39.lesson04.teach.note_pattern:
    title: Записка с утверждением и вопросом
    gloss: Мой коллега говорит, что сегодня поздно приедет, и спрашивает, дома ли ты.
    note: 'В письменной записке соедини две передачи с помощью *و* и повтори глагол для каждой: *می‌گه که …* и *می‌پرسه که … یا نه*. Говорящий называется в начале и не повторяется.'
  fa.a2.unit39.lesson05.teach.reading:
    title: Записка для Нимы
    gloss: Нима, у меня для тебя сообщение. Твой коллега говорит, что сегодня у него (неё) совещание и он(а) поздно приедет. Он(а) спрашивает, есть ли у тебя завтра время, и просит тебя позвонить.
    note: Прочитай сначала, чтобы понять, от кого сообщение, а потом ещё раз, чтобы отделить утверждение, вопрос и просьбу.
  fa.a2.unit39.lesson06.teach.turn01:
    title: У Сары есть сообщение
    gloss: Сара говорит Ниме, что у неё есть для него сообщение.
    note: В начале называется сообщение.
  fa.a2.unit39.lesson06.teach.turn02:
    title: Нима спрашивает, от кого оно
    gloss: От кого?
    note: Короткий вопрос о том, кто отправитель.
  fa.a2.unit39.lesson06.teach.turn03:
    title: Сара называет отправителя и первое утверждение
    gloss: От твоего коллеги. Он(а) говорит, что сегодня поздно приедет.
    note: Сара передаёт утверждение с помощью *می‌گه که*.
  fa.a2.unit39.lesson06.teach.turn04:
    title: Нима просит рассказать дальше
    gloss: Что ещё он(а) говорит?
    note: '*دیگه چی* просит рассказать следующую часть.'
  fa.a2.unit39.lesson06.teach.turn05:
    title: Сара передаёт вопрос и просьбу
    gloss: Он(а) спрашивает, есть ли у тебя завтра время, и просит тебя позвонить.
    note: Одна передача — вопрос, другая — просьба.
  fa.a2.unit39.lesson06.teach.turn06:
    title: Нима отвечает
    gloss: Да, завтра у меня есть время. Я сейчас ему (ей) позвоню.
    note: Нима отвечает от первого лица, потому что говорит за себя.
exercises:
  fa.a2.unit39.lesson01.exercise01.recognize_says:
    instruction: Что значит эта передача?
    correct_option: Он(а) говорит, что поздно приедет.
    distractors:
    - Он(а) спрашивает, приедет ли он(а) поздно.
    - Он(а) хочет, чтобы ты приехал(а) поздно.
    - Они говорят, что поздно приедут.
    accepted_answers:
    - value: Он(а) говорит, что поздно приедет.
      status: correct
    feedback: '*می‌گه که* передаёт утверждение; *می‌رسه* значит «он(а) приезжает».'
  fa.a2.unit39.lesson01.exercise02.recognize_asks:
    instruction: Что значит эта передача?
    correct_option: Он(а) спрашивает, дома ли Нима.
    distractors:
    - Он(а) говорит, что Нима дома.
    - Он(а) хочет, чтобы Нима был дома.
    - Он(а) спрашивает, где Нима.
    accepted_answers:
    - value: Он(а) спрашивает, дома ли Нима.
      status: correct
    feedback: '*می‌پرسه … هست یا نه* передаёт вопрос, на который отвечают «да» или «нет».'
  fa.a2.unit39.lesson01.exercise03.match_report_words:
    instruction: Соедини каждое персидское выражение с его значением.
    accepted_answers:
    - value:
        می‌گه که: он/она говорит, что
        می‌پرسه که: он/она спрашивает, ли
        می‌خواد که: он/она хочет, чтобы
        می‌گن که: они говорят, что
        پیغام: сообщение
        یادداشت: записка
        گوشی: телефон
        همکارم: мой коллега
      status: correct
    feedback: Эти глаголы и существительные — основа для передачи сообщений.
    pairs:
    - left: می‌گه که
      right: он/она говорит, что
    - left: می‌پرسه که
      right: он/она спрашивает, ли
    - left: می‌خواد که
      right: он/она хочет, чтобы
    - left: می‌گن که
      right: они говорят, что
    - left: پیغام
      right: сообщение
    - left: یادداشت
      right: записка
    - left: گوشی
      right: телефон
    - left: همکارم
      right: мой коллега
  fa.a2.unit39.lesson01.exercise04.order_says_late:
    instruction: 'Расставь слова так, чтобы получилось: Сара говорит, что поздно приедет.'
    accepted_answers:
    - value:
      - سارا
      - می‌گه
      - که
      - دیر
      - می‌رسه
      status: correct
    feedback: '*سارا می‌گه که دیر می‌رسه*: говорящий, глагол, *که*, затем сообщение.'
  fa.a2.unit39.lesson01.exercise05.fill_says:
    instruction: 'Дополни передачу глаголом для утверждения: Сара говорит, что сегодня у неё есть дела.'
    accepted_answers:
    - value: می‌گه
      status: correct
    feedback: 'Полная передача: *سارا می‌گه که امروز کار داره*.'
  fa.a2.unit39.lesson01.exercise06.translate_colleague_time:
    instruction: 'Переведи, используя глагол для утверждения: Мой коллега говорит, что завтра у него (неё) есть время.'
    accepted_answers:
    - value: همکارم می‌گه که فردا وقت داره
      status: correct
    - value: همکارم می‌گه فردا وقت داره
      status: correct
    - value: اون می‌گه که فردا وقت داره
      status: acceptable_with_note
      note: Это верно, если коллега уже известен; в образце он назван.
    feedback: 'Образец: *همکارم می‌گه که فردا وقت داره.*'
  fa.a2.unit39.lesson02.exercise01.recognize_wants:
    instruction: Что значит эта передача?
    correct_option: Сара хочет, чтобы ты ей позвонил(а).
    distractors:
    - Сара хочет позвонить тебе.
    - Сара говорит, что звонит тебе.
    - Сара спрашивает, звонишь ли ты ей.
    accepted_answers:
    - value: Сара хочет, чтобы ты ей позвонил(а).
      status: correct
    feedback: Окончание *ـی* в *بزنی* означает «ты», поэтому позвонить должен ты.
  fa.a2.unit39.lesson02.exercise02.recognize_when:
    instruction: Что значит эта передача?
    correct_option: Мой коллега спрашивает, когда ты приедешь.
    distractors:
    - Мой коллега говорит, когда он(а) приедет.
    - Мой коллега спрашивает, приедешь ли ты.
    - Мой коллега хочет, чтобы ты приехал(а).
    accepted_answers:
    - value: Мой коллега спрашивает, когда ты приедешь.
      status: correct
    feedback: '*کی* значит «когда», а *می‌رسی* — форма «ты».'
  fa.a2.unit39.lesson02.exercise03.match_requests_questions:
    instruction: Сопоставь каждую передачу с её значением.
    accepted_answers:
    - value:
        می‌خواد که بیای: он/она хочет, чтобы ты пришёл
        می‌خواد که بهش زنگ بزنی: он/она хочет, чтобы ты ему/ей позвонил
        می‌خواد که جواب بدی: он/она хочет, чтобы ты ответил
        می‌خواد که یادداشت رو بخونی: он/она хочет, чтобы ты прочитал записку
        می‌پرسه که وقت داری یا نه: он/она спрашивает, есть ли у тебя время
        می‌پرسه که کی می‌رسی: он/она спрашивает, когда ты приедешь
        می‌پرسه که خونه هستی یا نه: он/она спрашивает, дома ли ты
        می‌گه که فردا زنگ می‌زنه: он/она говорит, что завтра позвонит
      status: correct
    feedback: Просьбы используют глаголы с *ب*, вопросы заканчиваются на *یا نه* или содержат вопросительное слово, а утверждения строятся с *می‌گه*.
    pairs:
    - left: می‌خواد که بیای
      right: он/она хочет, чтобы ты пришёл
    - left: می‌خواد که بهش زنگ بزنی
      right: он/она хочет, чтобы ты ему/ей позвонил
    - left: می‌خواد که جواب بدی
