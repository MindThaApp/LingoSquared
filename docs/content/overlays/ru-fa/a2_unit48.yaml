  fa.a2.unit48.lesson01.start_and_end:
    title: Начало и конец сообщения
  fa.a2.unit48.lesson02.what_happened:
    title: Что произошло
  fa.a2.unit48.lesson03.whats_next:
    title: Что дальше
  fa.a2.unit48.lesson04.because_and_so:
