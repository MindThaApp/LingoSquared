  fa.a2.unit48.lesson06.message_dialogue:
    title: Разговор с другом
teaching:
  fa.a2.unit48.lesson01.teach.greet_words:
    title: Слова для начала и конца
    gloss: привет, как дела, что нового, прости, пока
    note: Дружеское сообщение начинается с *سلام* и имени, а затем часто идёт *خوبی؟* или *چه خبر؟*. *ببخش که ...* — это короткое извинение. *فعلا* завершает сообщение, как «пока».
    example_gloss:
    - Привет, Нима, как дела?
    - Что нового?
    - Прости, что не позвонил(а).
    - Пока, Сара
  fa.a2.unit48.lesson01.teach.time_words:
    title: Слова о времени для сообщения
    gloss: вчера, выходные, пятница, суббота, завтра, потом
    note: 'Ставь слово о времени в начало: оно показывает другу, говоришь ты о том, что было, или о том, что будет.'
    example_gloss:
    - Вчера я устал(а).
    - На выходных у меня была работа.
    - В пятницу я ходил(а) в парк.
    - Завтра я тебе позвоню.
    - Я приду в субботу.
    - Я позвоню тебе позже.
  fa.a2.unit48.lesson01.teach.message_shape:
    title: Структура дружеского сообщения
    gloss: Привет, Сара, как дела? В пятницу я ходил в парк. Завтра я хочу пойти в кино. Пока, Нима
    note: 'Неформальное сообщение состоит из четырёх частей: приветствие, что произошло (прошлое), что будет дальше (будущее) и прощание. Короткие предложения и разговорные формы *می‌خوام* и *بهت* — это нормально; официальное начало письма не нужно.'
  fa.a2.unit48.lesson02.teach.birthday_gift:
    title: День рождения и подарок
    gloss: день рождения (праздник), подарок
    note: '*تولد* — это день рождения, а в речи *رفتم تولد دوستم* значит также «я ходил на день рождения к другу».'
    example_gloss:
    - В пятницу я ходил на день рождения к другу.
    - Я купил подарок для друга.
    - У Сары есть подарок.
  fa.a2.unit48.lesson02.teach.celebration_words:
    title: Праздники и поздравления
    gloss: праздник, свадьба, поздравление, с праздником (счастливый)
    note: '*جشن* — это праздник, *عروسی* — свадьба, а *مبارک* ставится после названия повода в коротких дружеских поздравлениях.'
    example_gloss:
    - В пятницу я ходил на праздник.
    - Свадьба была в пятницу.
    - С днём рождения, поздравляю!
  fa.a2.unit48.lesson02.teach.message_news:
    title: Делимся новостями в сообщении
    gloss: я отправил, я услышал, успех, спасибо
    note: С помощью этих слов ты можешь сказать, что отправил или услышал, и отреагировать на успех друга.
    example_gloss:
    - Я отправил сообщение.
    - Я услышал новость.
    - Поздравляю с успехом!
  fa.a2.unit48.lesson02.teach.past_verbs:
    title: 'Глаголы прошедшего времени: рассказываем, что произошло'
    gloss: я пошёл, я увидел, я поел, я пришёл, я остался, я купил, я написал, мы пошли
    note: 'Окончание прошедшего времени: *ـم* для «я» и *ـیم* для «мы». Отрицание добавляет *ن*: *نرفتم*, *نیومدم*, *نزدم*.'
    example_gloss:
    - Вчера я ходил в кино.
    - Я посмотрел фильм.
    - Я поужинал и пришёл домой.
    - В субботу я остался дома.
    - Я написал тебе сообщение.
    - Мы с Сарой ходили в парк.
  fa.a2.unit48.lesson02.teach.past_story:
    title: Рассказываем о событиях по порядку
    gloss: В пятницу я пошёл на день рождения к другу и купил подарок; мы сходили в кино, а потом поужинали
    note: Сначала назови время, затем события в том порядке, в котором они произошли. Соединяй их с помощью *و*, а *بعدش* («после этого») отмечает следующий шаг. Все глаголы остаются в простом прошедшем времени.
  fa.a2.unit48.lesson03.teach.want_to:
    title: Говорим о планах
    gloss: я хочу пойти, я хочу прийти, я хочу купить, я хочу поесть
    note: '*می‌خوام* и короткий глагол (*برم*, *بیام*, *بخرم*, *بخورم*) — обычный способ сказать, что ты собираешься делать. В сообщении это звучит как план, а не просто желание.'
    example_gloss:
    - Завтра я хочу пойти в кино.
    - В субботу я хочу прийти.
    - Я хочу купить подарок.
    - После кино я хочу поужинать.
  fa.a2.unit48.lesson03.teach.feelings_and_memories:
    title: Чувства и воспоминания
    gloss: воспоминание, расстроенный, тоска по кому-то, интересный
    note: '*ناراحت* значит, что ты расстроен, а *دلتنگ* — что ты скучаешь по кому-то. *جالب* описывает что-то интересное.'
    example_gloss:
    - Это воспоминание было интересным.
    - Вчера я был расстроен.
    - Я скучал по тебе.
  fa.a2.unit48.lesson03.teach.plain_present:
    title: Простое настоящее время для планов
    gloss: я приду, я пойду, я куплю, я позвоню тебе
    note: Со словом о времени, например *فردا* или *بعدا*, простое настоящее время означает и будущее. И *می‌خوام برم*, и *می‌رم* подходят для сообщения.
    example_gloss:
    - Я приду в субботу.
    - Завтра я иду в парк.
    - Позже я куплю подарок.
    - Завтра я тебе позвоню.
  fa.a2.unit48.lesson03.teach.next_pattern:
    title: Что дальше
    gloss: Завтра я хочу пойти в кино; после кино я тебе позвоню
    note: Сначала ставь слово о времени, затем план. *بعد از* используется с местом или событием (*بعد از سینما*), а *بعدش* — когда предыдущий шаг уже понятен.
  fa.a2.unit48.lesson04.teach.reasons:
    title: Причины в прошлом
    gloss: я устал, у меня были дела, я болел, погода была хорошая
    note: 'Причины, относящиеся к прошлому, выражаются в прошедшем времени: *بودم*, *داشتم*. О погоде говорят в третьем лице: *هوا خوب بود*.'
    example_gloss:
    - Вчера я устал(а).
    - На выходных у меня была работа.
    - В субботу я болел.
    - В пятницу была хорошая погода.
  fa.a2.unit48.lesson04.teach.because_so:
    title: Потому что и поэтому
    gloss: Потому что я устал, я не пришёл; я устал, поэтому не пришёл
    note: '*چون* вводит причину: *چون خسته بودم، نیومدم* или *نیومدم، چون خسته بودم*. *برای همین* вводит следствие и стоит после причины: *خسته بودم، برای همین نیومدم*. В одном предложении их вместе не используют.'
  fa.a2.unit48.lesson05.teach.reading:
    title: Сообщение от Нимы
    gloss: 'Привет, Сара, как дела? Прости, что не позвонил: на выходных у меня было очень много дел. В пятницу я ходил на день рождения к другу и купил подарок. День рождения был очень хороший, но я поздно пришёл домой и устал. Поэтому в субботу я не пошёл на занятие. Завтра я хочу пойти в кино, а после кино позвоню тебе. Пока, Нима'
    note: Прочитай один раз, чтобы увидеть четыре части (приветствие, что произошло, что дальше, прощание), а затем ещё раз — чтобы найти причины.
  fa.a2.unit48.lesson06.teach.turn01:
    title: Сара спрашивает, как дела
    gloss: Привет, Нима! Что нового? Что ты делал на выходных?
    note: Сара здоровается с Нимой и спрашивает, что он делал.
  fa.a2.unit48.lesson06.teach.turn02:
    title: Нима рассказывает, что произошло
    gloss: Привет, Сара! В пятницу я ходил на день рождения к другу. Я купил подарок, и всё было очень хорошо.
    note: Нима использует простое прошедшее время для событий.
  fa.a2.unit48.lesson06.teach.turn03:
    title: Сара спрашивает про субботу
    gloss: Здорово! А в субботу?
    note: Короткий уточняющий вопрос.
  fa.a2.unit48.lesson06.teach.turn04:
    title: Нима называет причину
    gloss: В субботу я остался дома, потому что устал.
    note: '*چون* указывает причину.'
  fa.a2.unit48.lesson06.teach.turn05:
    title: Сара спрашивает про завтра
    gloss: Что ты хочешь делать завтра?
    note: Сара спрашивает о планах.
  fa.a2.unit48.lesson06.teach.turn06:
    title: Нима говорит, что будет дальше
    gloss: Завтра я хочу пойти в кино. После кино я тебе позвоню.
    note: Для планов используются *می‌خوام* и простое настоящее время.
  fa.a2.unit48.lesson06.teach.turn07:
    title: Сара прощается
    gloss: Хорошо. Пока!
    note: Разговор заканчивается словом *فعلا*.
