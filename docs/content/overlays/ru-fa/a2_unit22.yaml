teaching:
  fa.a2.unit22.lesson01.teach.people_time:
    title: Люди и время
    gloss: я, ты, Сара, Нима, сегодня, утро, поздно
    note: '*امروز صبح* означает «сегодня утром». В персидском *من* часто опускают, потому что окончание глагола уже означает «я».'
    example_gloss:
    - Сегодня утром я проснулся поздно.
    - Сара сегодня позвонила Ниме.
  fa.a2.unit22.lesson01.teach.morning_nouns:
    title: Слова об утре и дороге
    gloss: дом, душ, одежда, завтрак, ключ, дверь, машина, автобус
    note: '*صبحونه* — обычная разговорная форма слова «завтрак»; в аккуратной письменной речи пишут *صبحانه*.'
    example_gloss:
    - Я принял душ дома.
    - Я позавтракал и оделся.
    - Мой ключ был в машине.
  fa.a2.unit22.lesson01.teach.actions:
    title: Четыре утренних действия
    gloss: я проснулся, я принял душ, я оделся, я позавтракал
    note: Каждое выражение заканчивается лёгким глаголом в простом прошедшем времени. Учи выражение целиком, как одно действие.
    example_gloss:
    - Сегодня утром я проснулся.
    - Потом я принял душ.
    - Я оделся и позавтракал.
  fa.a2.unit22.lesson01.teach.compound_shape:
    title: Составные глаголы в прошедшем времени
    gloss: я проснулся, принял душ, оделся
    note: 'Многие персидские действия состоят из двух частей: существительного или прилагательного и лёгкого глагола. Вторая часть передаёт прошедшее время: *بیدار شدم*, *دوش گرفتم*, *لباس پوشیدم*.'
  fa.a2.unit22.lesson02.teach.more_actions:
    title: Двери, машины, звонки и письма
    gloss: я открыл дверь, закрыл дверь, завёл машину, позвонил, написал письмо
    note: '*رو* отмечает определённый объект в разговорной речи: *در رو* — «дверь», а *ماشین رو* — «машину».'
    example_gloss:
    - Я открыл дверь, а потом закрыл её.
    - Я завёл машину.
    - Я позвонил Саре и написал письмо.
  fa.a2.unit22.lesson02.teach.small_words:
    title: Полезные маленькие слова
    gloss: к, один/какой-то, и, но, что, я приехал
    note: '*یه* — обычная разговорная форма слова «один/какой-то». *رسیدم* завершает рассказ о дороге: «я добрался».'
    example_gloss:
    - Я позвонил Саре.
    - Я написал письмо, но приехал поздно.
  fa.a2.unit22.lesson02.teach.sequence:
    title: Слова для последовательности
    gloss: сначала, потом, после этого, в конце концов, к тому времени
    note: 'С помощью этих слов порядок действий становится ясным. *تا اون موقع* значит «к тому времени». С ним более раннее событие стоит в предпрошедшем времени (причастие + بود): *اتوبوس رفته بود* = автобус уже ушёл. Эту форму ты отработаешь в одном из следующих уроков.'
    example_gloss:
    - Сначала я открыл дверь.
    - После этого я завёл машину.
    - К тому времени было уже поздно; в конце концов я добрался.
  fa.a2.unit22.lesson02.teach.light_verbs:
    title: Лёгкий глагол передаёт время
    gloss: открыл, включил, позвонил, проснулся
    note: 'Первая часть называет действие; вторая меняется по времени и лицу: *باز کردم*, *روشن کردم*, *زنگ زدم*, *بیدار شدم*.'
  fa.a2.unit22.lesson02.teach.ro_rule:
    title: Определённое رو, неопределённое یه
    gloss: Я открыл дверь; я написал письмо
    note: 'После определённого объекта в разговорной речи ставится *رو*: *در رو باز کردم*. Неопределённый объект с *یه* обычно стоит без *رو*: *یه نامه نوشتم*.'
  fa.a2.unit22.lesson03.teach.negative_forms:
    title: Отрицание составных глаголов
    gloss: я не работал, не позвонил, не позавтракал, не открыл дверь
    note: 'Приставка *نـ* ставится на спрягаемый лёгкий глагол: *کار نکردم*, *زنگ نزدم*, *صبحونه نخوردم*. Существительное не меняется.'
  fa.a2.unit22.lesson03.teach.negative_place:
    title: Отрицай лёгкий глагол, а не существительное
    gloss: нـ присоединяется к лёгкому глаголу
    note: Говори *کار نکردم* и *زنگ نزدم*. Если поставить отрицание на существительное, получится неверная форма.
  fa.a2.unit22.lesson03.teach.definite_indefinite:
    title: رو есть или нет
    gloss: Я закрыл дверь; я написал письмо
    note: '*در* — это известная, определённая дверь, поэтому с ней ставится *رو*. *یه نامه* — неопределённое, поэтому رو не нужно.'
  fa.a2.unit22.lesson04.teach.problem_actions:
    title: Когда утро идёт не так
    gloss: я нашёл, не нашёл, я забыл, я опоздал на автобус
    note: '*از دستم رفت* буквально значит «ушло из моей руки»; про автобус это означает «я его упустил».'
    example_gloss:
    - Я нашёл свой ключ.
    - Я не нашёл свой ключ и опоздал на автобус.
    - Я забыл про письмо.
  fa.a2.unit22.lesson04.teach.question:
    title: Что было дальше?
    gloss: Что случилось сегодня утром? Что было после этого?
    note: Эти вопросы просят рассказать всё по порядку, поэтому отвечай словами последовательности и формами прошедшего времени.
  fa.a2.unit22.lesson05.teach.reading:
    title: Утро, которое пошло не так
    gloss: Сегодня утром я проснулся поздно. Сначала я принял душ и оделся. Я не позавтракал. Потом я закрыл дверь, но не нашёл свой ключ. К тому времени автобус уже ушёл. В конце концов я позвонил Саре и приехал на машине.
    note: Прочитай один раз, чтобы увидеть последовательность действий, а потом ещё раз — чтобы найти два шага, которые пошли не по плану.
  fa.a2.unit22.lesson06.teach.turn01:
    title: Сара спрашивает, что случилось
    gloss: 'Сара спрашивает Ниму: «Что случилось сегодня утром?»'
    note: Начало просит рассказать всю последовательность.
  fa.a2.unit22.lesson06.teach.turn02:
    title: Нима начинает рассказ
    gloss: Нима проснулся поздно
    showered and dressed: null
    but did not eat breakfast.: null
    note: Отрицательный шаг контрастирует с выполненными шагами.
  fa.a2.unit22.lesson06.teach.turn03:
    title: Сара спрашивает о следующем шаге
    gloss: 'Сара спрашивает: «Что было после этого?»'
    note: '*بعدش* двигает рассказ дальше.'
  fa.a2.unit22.lesson06.teach.turn04:
    title: Проблема с дорогой
    gloss: Нима не нашёл ключ, и к тому времени автобус уже ушёл.
    note: Эти два факта объясняют, где утро пошло не так.
  fa.a2.unit22.lesson06.teach.turn05:
    title: Сара спрашивает о конце
    gloss: 'Сара спрашивает: «Что ты сделал в конце?»'
    note: '*آخرش* указывает на последний шаг.'
  fa.a2.unit22.lesson06.teach.turn06:
    title: Нима заканчивает рассказ
    gloss: Нима позвонил Саре
    started the car: null
    and finally arrived.: null
    note: Два последних выполненных действия решают проблему с дорогой.
