teaching:
  fa.a2.unit30.lesson01.teach.people_time:
    title: Люди и время
    gloss: я, ты, Сара, Нима, сегодня вечером, завтра
    note: '*امشب* значит «сегодня вечером», а *فردا* — «завтра». В персидском *من* обычно опускают, потому что окончание глагола уже показывает лицо.'
    example_gloss:
    - Завтра я могу прийти.
    - Сара не может прийти сегодня вечером.
  fa.a2.unit30.lesson01.teach.skills:
    title: Умения
    gloss: играть на гитаре, водить машину, готовить, плавать, говорить по-английски
    note: Это умения. Каждое из них — существительное с легким глаголом, и этот глагол меняется по лицам.
    example_gloss:
    - Я умею играть на гитаре.
    - Я не умею водить машину.
    - Нима умеет говорить по-английски.
  fa.a2.unit30.lesson01.teach.verbs_after:
    title: Глаголы после «мочь»
    gloss: чтобы я пришёл, чтобы я пошёл, чтобы я сыграл, чтобы я прочитал, чтобы я сделал
    note: Это глагольные формы «чтобы я...» (сослагательное наклонение, субъюнктив). В разговорном персидском одна из них стоит после *می‌تونم*.
    example_gloss:
    - Я могу прийти.
    - Я не могу пойти.
    - Я могу говорить по-английски.
  fa.a2.unit30.lesson01.teach.can_forms:
    title: Могу и не могу
    gloss: я могу, ты можешь, он/она может; я не могу, ты не можешь, он/она не может
    note: 'Разговорный глагол «мочь»: *می‌تونم* (я могу), *می‌تونی* (ты можешь), *می‌تونه* (он/она может). Чтобы получить «не могу», поставь *نـ* перед глаголом: *نمی‌تونم*.'
  fa.a2.unit30.lesson01.teach.can_plus_subjunctive:
    title: «Мочь» + глагол в форме «чтобы я...»
    gloss: я могу прийти; я не могу говорить
    note: 'После *می‌تونم* второй глагол стоит в форме субъюнктива, а не в инфинитиве: *می‌تونم بیام*, *نمی‌تونم صحبت کنم*. У второго глагола то же личное окончание, что и у *می‌تونم*.'
  fa.a2.unit30.lesson02.teach.person_word:
    title: Ты и он/она
    gloss: ты, он или она
    note: В разговорном персидском *اون* значит «он» или «она»; кто именно, видно по окончанию глагола.
    example_gloss:
    - Он или она может прийти.
    - Ты можешь пойти.
  fa.a2.unit30.lesson02.teach.endings:
    title: Три лица
    gloss: чтобы я/ты/он пришёл, пошёл, сыграл
    note: 'Окончание субъюнктива зависит от лица: -م (я), -ی (ты), -ه или -د (он/она). Эта схема одинакова для всех глаголов.'
    example_gloss:
    - Ты умеешь играть на гитаре.
    - Он или она может пойти.
  fa.a2.unit30.lesson02.teach.work_tech:
    title: Рабочие и технические навыки
    gloss: отправить электронное письмо, сделать фото, читать по-persидски, работать на компьютере, на телефоне
    note: Эти навыки связаны с работой и технологиями. *با* значит «с» или «на» (чем-то).
    example_gloss:
    - Нима умеет работать на компьютере.
    - Я могу отправить электронное письмо.
    - Ты можешь фотографировать на телефон.
  fa.a2.unit30.lesson02.teach.person_agreement:
    title: Оба глагола согласуются
    gloss: я могу прийти, ты можешь прийти, он/она может прийти
    note: 'Лицо меняется у обоих глаголов сразу: *می‌تونم بیام*, *می‌تونی بیای*, *می‌تونه بیاد*. Несовпадение, например *می‌تونی بیام*, — ошибка.'
  fa.a2.unit30.lesson03.teach.three_words:
    title: Должен, может быть, возможно
    gloss: должен, возможно, что; может быть
    note: '*باید* выражает необходимость. *ممکنه* и *شاید* выражают возможность. После всех трёх стоит субъюнктив.'
    example_gloss:
    - Мне нужно идти.
    - Возможно, я приду.
    - Может быть, я пойду.
  fa.a2.unit30.lesson03.teach.late_rain:
    title: Поздно, дождь, не приду
    gloss: поздно, чтобы я приехал/пришёл, дождь, чтобы я не пошёл, чтобы я не пришёл
    note: '*نیام* и *نرم* — отрицательный субъюнктив: *نـ* стоит перед глаголом.'
    example_gloss:
    - Возможно, я опоздаю.
    - Возможно, пойдёт дождь.
    - Возможно, я не приду.
  fa.a2.unit30.lesson03.teach.can_must_might:
    title: Могу, должен, возможно
    gloss: я могу пойти; мне нужно пойти; возможно, я пойду
    note: 'Глагол после остаётся тем же, но первое слово меняет смысл: *می‌تونم برم* (я могу или мне ничто не мешает), *باید برم* (я должен), *ممکنه برم* (возможно, я пойду).'
  fa.a2.unit30.lesson03.teach.possibility_rule:
    title: 'Возможность: ممکنه / شاید + субъюнктив'
    gloss: возможно, я опоздаю; может быть, пойдёт дождь; возможно, я не приду
    note: '*ممکنه* не меняется по лицам, а следующий глагол меняется: *ممکنه دیر برسم*, *ممکنه نیما نیاد*. *شاید* работает так же. Чтобы сказать «возможно, не...», поставь отрицание у второго глагола: *ممکنه نیام*.'
  fa.a2.unit30.lesson04.teach.availability:
    title: Занятость и свободное время
    gloss: у меня есть время, у меня нет времени, я свободен, я занят, у меня встреча, выходные
    note: '*وقت دارم* и *آزادم* значат, что ты свободен; *وقت ندارم* и *مشغولم* — что нет.'
    example_gloss:
    - Завтра у меня есть время.
    - Сегодня вечером я занят.
    - В выходные я свободен.
  fa.a2.unit30.lesson04.teach.linkers:
    title: Потому что, но, нет, и
    gloss: потому что, но, нет, и
    note: '*چون* вводит причину, а *ولی* добавляет противопоставление.'
    example_gloss:
    - Сегодня вечером я не могу прийти, потому что у меня встреча.
    - Завтра я свободен, но, возможно, опоздаю.
  fa.a2.unit30.lesson04.teach.maybe_able:
    title: 'Может быть, смогу: شاید بتونم'
    gloss: может быть, я смогу прийти
    note: 'Чтобы сказать «может быть, я смогу», поставь *شاید* перед *بتونم* (субъюнктив от «мочь»), а затем второй глагол в субъюнктиве: *شاید بتونم بیام*. В этом курсе образцом служит *شاید بتونم*.'
  fa.a2.unit30.lesson04.teach.reason_for_no:
    title: Не могу + причина
    gloss: Сегодня вечером я не могу прийти, потому что у меня встреча
    note: 'Отказ звучит естественно, если назвать причину: *نمی‌تونم بیام، چون ...*. Причина — обычное утверждение в настоящем времени.'
  fa.a2.unit30.lesson05.teach.reading:
    title: Сообщение от Нимы
    gloss: Привет, Сара! Сегодня вечером я не могу прийти, потому что у меня встреча. Завтра я свободен и могу прийти, но, возможно, опоздаю. Я умею работать на компьютере, но не умею играть на гитаре. Может быть, я смогу ещё и пофотографировать.
    note: Прочитай один раз, чтобы понять, что Нима может и чего не может, а потом ещё раз — чтобы понять, что может случиться.
  fa.a2.unit30.lesson06.teach.dialogue_words:
    title: Слова для ответа
    gloss: да, хорошо, ничего страшного, раньше
    note: '*اشکالی نداره* — дружелюбный ответ, «ничего страшного». *زودتر* значит «раньше».'
    example_gloss:
    - Хорошо, ничего страшного.
    - Может быть, я смогу прийти пораньше.
  fa.a2.unit30.lesson06.teach.turn01:
    title: Сара приглашает Диму
    gloss: 'Сара спрашивает: Нима, ты сможешь прийти сегодня вечером?'
    note: В начале разговора спрашивают о возможности и свободном времени.
  fa.a2.unit30.lesson06.teach.turn02:
    title: Нима отказывается
    gloss: 'Нима: Нет, сегодня вечером я не могу прийти. У меня встреча.'
    note: Отказ с указанием причины.
  fa.a2.unit30.lesson06.teach.turn03:
    title: Сара спрашивает про завтра
    gloss: 'Сара: А завтра? Завтра у тебя есть время?'
    note: '*فردا چی؟* переводит разговор на другое время.'
  fa.a2.unit30.lesson06.teach.turn04:
    title: 'Нима: могу, но можно опоздать'
    gloss: 'Нима: Да, завтра я свободен. Я могу прийти, но, возможно, опоздаю.'
    note: В одном ответе — и возможность, и вероятность.
  fa.a2.unit30.lesson06.teach.turn05:
    title: Сара спрашивает про фото
    gloss: 'Сара: Хорошо, ничего страшного. Ты можешь фотографировать на телефон?'
    note: Новый вопрос об умении.
  fa.a2.unit30.lesson06.teach.turn06:
    title: Нима заканчивает разговор
    gloss: 'Нима: Да, могу. Может быть, я смогу прийти пораньше.'
    note: Сначала возможность, затем надежда на лучшее.
