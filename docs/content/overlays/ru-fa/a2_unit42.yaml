  fa.a2.unit42.lesson06.lost_coat_dialogue:
    title: Чьё это пальто?
teaching:
  fa.a2.unit42.lesson01.teach.clothes:
    title: Одежда и сумки
    gloss: рубашка, обувь, сумка, брюки, пальто
    note: '*کفش* — это «обувь» (одно слово для пары).'
    example_gloss:
    - У меня есть рубашка.
    - У меня есть пара обуви.
    - У меня есть сумка.
    - У меня есть брюки.
    - У меня есть пальто.
  fa.a2.unit42.lesson01.teach.colours:
    title: Цвета
    gloss: белый, чёрный, красный, синий, зелёный
    note: Цвета — это прилагательные, и они стоят после существительного.
    example_gloss:
    - Моя рубашка белая.
    - Моя сумка чёрная.
    - Моя обувь красная.
    - Мои брюки синие.
    - Моё пальто зелёное.
  fa.a2.unit42.lesson01.teach.size_age:
    title: Большой, маленький, новый, старый
    gloss: большой, маленький, новый, старый
    note: '*نو* и *قدیمی* говорят о том, новая вещь или старая.'
    example_gloss:
    - Моя сумка большая.
    - Моя обувь маленькая.
    - Моё пальто не новое.
    - Моя рубашка старая.
  fa.a2.unit42.lesson01.teach.ezafe:
    title: 'Существительное + прилагательное: соединительный звук'
    gloss: красная сумка; белая рубашка; новая обувь
    note: 'В персидском прилагательное стоит после существительного. В речи их соединяет короткий гласный *-e* (эзафет): *کیف قرمز* произносится «kif-e qermez». После согласного этот гласный не пишется.'
  fa.a2.unit42.lesson02.teach.owners:
    title: Владельцы
    gloss: Сара, Нима, кто, чей он/чья она/чьё оно
    note: '*کیه؟* значит «кто это?» или «чей он (чья она)?».'
    example_gloss:
    - Чья это сумка?
    - Чья это обувь?
  fa.a2.unit42.lesson02.teach.owner_rule:
    title: Существительное + владелец
    gloss: сумка Сары; обувь Нимы; рубашка менеджера
    note: 'Владелец стоит после предмета и соединяется с ним тем же гласным *-e*: *کیف سارا* — «kif-e Sara». В русском владелец обычно выражается родительным падежом («сумка Сары»), а в персидском падежных окончаний нет: за предметом просто следует имя владельца.'
  fa.a2.unit42.lesson02.teach.whose:
    title: Чей он/она?
    gloss: Чья это сумка? Сумка Сары.
    note: 'Спрашивай *این ... کیه؟* и отвечай предметом и его владельцем. Чтобы сказать «это Нимы», присоедини *است* к имени: *این کفش نیماست*.'
  fa.a2.unit42.lesson03.teach.things:
    title: Дом и одежда
    gloss: дом, пальто, стул, стол
    note: '*خونه* оканчивается на непроизносимую *ه*; *پالتو* — на гласный *و*; *صندلی* — на *ی*.'
    example_gloss:
    - Дом большой.
    - Пальто чёрное.
    - Стул здесь.
    - Стол вон там.
  fa.a2.unit42.lesson03.teach.rule_h:
    title: 'После непроизносимой ه: ه‌ی'
    gloss: большой дом; дом Нимы
    note: 'После непроизносимой *ه* соединительный гласный пишется как *ی* с полупробелом: *خونه‌ی بزرگ*, *خونه‌ی نیما*.'
  fa.a2.unit42.lesson03.teach.rule_v:
    title: После و и ی
    gloss: чёрное пальто; пальто Сары; стул Нимы
    note: 'После *و* соединительный гласный пишется как *ی*: *پالتوی سیاه*. После *ی* ты произносишь «-ye», но ничего дополнительно не пишется: *صندلی نیما*.'
  fa.a2.unit42.lesson04.teach.materials:
    title: Материалы и диван
    gloss: кожаный, деревянный, диван
    note: '*چرمی* значит «сделанный из кожи», *چوبی* — «сделанный из дерева».'
    example_gloss:
    - Моя сумка кожаная.
    - Стол деревянный.
    - Диван здесь.
  fa.a2.unit42.lesson04.teach.chain1:
    title: Существительное + прилагательное + владелец
    gloss: красная сумка Сары; чёрное пальто Нимы; большой дом Нимы
    note: 'Ты можешь добавлять слова после существительного, каждое через соединительный гласный. Владелец стоит последним: *کیف قرمز سارا* (kif-e qermez-e Sara). Владелец — последнее звено.'
  fa.a2.unit42.lesson04.teach.chain2:
    title: Существительное + два прилагательных
    gloss: чёрная кожаная сумка; большой деревянный стол; новый красный диван
    note: 'Два прилагательных строятся по той же схеме. Возможны оба порядка; чуть чаще материал стоит перед цветом или размером: *کیف چرمی سیاه*, *میز چوبی بزرگ*.'
  fa.a2.unit42.lesson05.teach.reading:
    title: Потерянная сумка
    gloss: Я потерял(а) свою сумку. Моя сумка красная, кожаная и маленькая. В сумке лежит чёрный телефон. Мой чёрный телефон старый. В сумке ещё есть голубые очки. Голубые очки принадлежат Ниме.
    note: Сначала прочитай про сумку, потом ещё раз — про вещи внутри неё.
  fa.a2.unit42.lesson06.teach.turn01:
    title: Продавец показывает пальто
    gloss: 'Продавец: Извините, это чёрное пальто ваше?'
    note: '*مال شماست* — вежливое «принадлежит вам».'
  fa.a2.unit42.lesson06.teach.turn02:
    title: Нима описывает своё пальто
    gloss: 'Нима: Нет, моё пальто синее. Моё синее пальто большое.'
    note: '*پالتوی آبی من*: существительное + прилагательное + владелец.'
  fa.a2.unit42.lesson06.teach.turn03:
    title: Продавец предлагает сумку
    gloss: 'Продавец: Большого синего пальто у меня нет. А как насчёт этой красной кожаной сумки?'
    note: '*کیف قرمز چرمی*: существительное + цвет + материал (*کیف چرمی قرمز* тоже правильно).'
  fa.a2.unit42.lesson06.teach.turn04:
    title: Нима называет владелицу
    gloss: 'Нима: Это сумка Сары. Сумка Сары красная.'
    note: '*ساراست* — разговорная форма от *سارا است*.'
