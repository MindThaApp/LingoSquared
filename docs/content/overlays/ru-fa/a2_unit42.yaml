course:
  title: Персидский A2
  description: 'Персидский язык Ирана для среднего уровня: грамматика на основе повседневных ситуаций.'
units:
  fa.a2.unit42.describing_things:
    title: Описываем предметы правильно
lessons:
  fa.a2.unit42.lesson01.noun_adjective:
    title: Существительное + прилагательное
  fa.a2.unit42.lesson02.noun_owner:
    title: Существительное + владелец
  fa.a2.unit42.lesson03.after_vowels:
    title: После гласных
  fa.a2.unit42.lesson04.chains:
