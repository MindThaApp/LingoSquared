  fa.a1.unit06.lesson03.exercise01.recognize_menu_question:
    instruction: О чём спрашивает этот вопрос?
    correct_option: У вас есть меню?
    distractors:
    - Что вы посоветуете?
    - Что желаете? (спрашивает официант)
    - Не могли бы вы принести счёт?
    accepted_answers:
    - value: У вас есть меню?
      status: correct
