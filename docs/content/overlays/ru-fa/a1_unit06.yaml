course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: лексика еды и напитков, вежливый заказ в ресторане, вопросы о меню и рекомендациях, количества и ресторанный этикет, включая просьбу принести счёт.'
units:
  fa.a1.unit06.food:
    title: Еда и заказ блюд
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Еда и напитки
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Вежливый заказ
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Спросить про меню и попросить совет
  fa.a1.unit06.lesson04.quantities:
    title: Заказ определённого количества
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Ресторанный этикет и счёт
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Полный разговор в ресторане
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Хлеб
    gloss: хлеб
    note: نان — основа любой иранской трапезы, обычно это лепёшка, которую подают почти ко всему.
    example_gloss: Я люблю хлеб.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Рис
    gloss: рис
    note: برنج — центральная часть большинства иранских основных блюд.
    example_gloss: Рис с курицей очень вкусный.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Курица
    gloss: курица
    note: مرغ означает и птицу, и мясо.
    example_gloss: Я ем курицу.
  fa.a1.unit06.lesson01.teach.ab:
    title: Вода
    gloss: вода
    note: آب — обычное слово для воды.
    example_gloss: Я хочу воду.
  fa.a1.unit06.lesson01.teach.chai:
    title: Чай
    gloss: чай
    note: چای — напиток, который предлагают почти везде в Иране; он уже встречался в уроке о тарофе в Уроке 1.
    example_gloss: Один чай, пожалуйста.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Кофе
    gloss: кофе
    note: قهوه всё чаще встречается в иранских городах наряду с чаем.
    example_gloss: Кофе горячий.
  fa.a1.unit06.lesson01.teach.mive:
    title: Фрукты
    gloss: фрукты
    note: میوه — общее слово, обозначающее любые фрукты.
    example_gloss: Я люблю фрукты.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: И / или
    gloss: و (и), یا (или)
    note: Оба слова — частые соединительные слова, которыми связывают еду и напитки в заказе.
    target_text: و (и)، یا (или)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Вежливо заказать чай
    gloss: Я бы хотел(а) чай.
    note: می‌خواستم буквально — прошедшее время глагола «хотеть», но служит вежливой, смягчённой просьбой — это естественный регистр для незнакомого официанта или продавца.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Пожалуйста
    gloss: пожалуйста
    note: لطفاً можно добавить, чтобы смягчить почти любую просьбу.
    example_gloss: Помогите мне, пожалуйста.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Заказать чай неформально
    gloss: Я хочу чай.
    note: یه چای می‌خوام использует разговорное یه (один/какой-то) и می‌خوام (я хочу) — так говорят только с близким другом или родственником, но не с только что встреченным официантом.
  fa.a1.unit06.lesson02.teach.register_note:
    title: Как выбрать глагол для заказа
    gloss: С незнакомцем или официантом используй می‌خواستم; می‌خوام — только с близким другом.
    note: Это то же разделение по степени вежливости, что и в приветствиях из Урока 1, но применительно к заказу.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Вежливо заказать хлеб
    gloss: Я бы хотел(а) хлеба.
    note: Та же конструкция с می‌خواستم подходит для любого названия еды или напитка.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Меню
    gloss: меню
    note: منو — заимствованное слово, как и в русском («меню»), и употребляется в том же значении.
    example_gloss: Меню, пожалуйста.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Попросить меню
    gloss: У вас есть меню?
    note: منو دارید؟ буквально спрашивает «у вас есть меню?» — обычный способ попросить его.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Попросить совет
    gloss: Что вы посоветуете?
    note: چی توصیه می‌کنید؟ — естественный и частый вопрос к официанту.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Что спрашивает у тебя официант
    gloss: Что вы желаете?
    note: چی میل دارید؟ — вежливый стандартный вопрос, которым официант начинает приём заказа.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Куриный кебаб
    gloss: куриный кебаб
    note: جوجه‌کباب (маринованная курица на гриле) — одно из самых распространённых блюд в иранском меню.
    example_gloss: Я закажу куриный кебаб.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: Официант советует блюдо
    gloss: Куриный кебаб сегодня очень хорош.
    note: خوبه — разговорное сокращение от خوب است, естественное в непринуждённой рекомендации официанта.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Да, пожалуйста
    gloss: Да, пожалуйста.
    note: بله означает «да»; بفرمایید (уже встречалось в уроке о тарофе в Уроке 1) здесь снова используется, когда что-то подают, например меню.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Стакан чая
    gloss: стакан чая
    note: لیوان (стакан) — счётное слово для напитков, подаваемых в стакане.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Два куска хлеба
    gloss: два куска хлеба
    note: تا — счётное слово, которое ставится после числа при счёте большинства обычных предметов; здесь — два куска хлеба.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Тарелка риса
    gloss: тарелка риса
    note: بشقاب (тарелка) — счётное слово для еды, поданной на тарелке.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Составить полный заказ
    gloss: Тарелку риса и два куска хлеба, пожалуйста.
    note: Несколько фраз с количеством можно соединить в одном заказе с помощью و (и).
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Счётное слово تا
    gloss: 'تا ставится после числа при счёте предметов: دو تا (два), سه تا (три).'
    note: Это та же общая схема счёта, что и с числами в Уроке 3, но здесь она применена к заказу еды.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: Счёт
    gloss: счёт
    note: صورت‌حساب — стандартное слово для ресторанного счёта.
    example_gloss: Счёт, пожалуйста.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Попросить счёт
    gloss: Не могли бы вы принести счёт?
    note: صورت‌حساب رو لطف می‌کنید؟ — вежливый, естественный способ попросить счёт в ресторане.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Сказать, что еда была вкусной
    gloss: Было очень вкусно.
    note: خیلی خوشمزه بود — естественный комплимент официанту или хозяину после еды.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Приятного аппетита
    gloss: Приятного аппетита
    note: نوش جان говорят тому, кто ест или собирается есть, — примерно как «приятного аппетита»; сам едящий так о своей еде не говорит.
  fa.a1.unit06.lesson05.teach.chashm:
    title: Вежливый ответ официанта
    gloss: Сейчас принесу.
    note: 'چشم، الان میارم — уважительный ответ персонала на просьбу: они обещают сразу принести.'
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Ресторан
    gloss: ресторан
    note: رستوران — обычное слово для ресторана, место действия диалога этого урока.
    example_gloss: Этот ресторан хороший.
  fa.a1.unit06.lesson06.teach.turn01:
    title: Официант приветствует клиента
    gloss: Официант встречает клиента и спрашивает, что он желает.
    note: چی میل دارید؟ — тот же вежливый вопрос из третьего урока.
  fa.a1.unit06.lesson06.teach.turn02:
    title: Клиент просит меню
    gloss: Клиент здоровается с официантом и просит меню.
    note: منو دارید؟ начинает разговор о заказе.
  fa.a1.unit06.lesson06.teach.turn03:
    title: Официант приносит меню
    gloss: Официант соглашается и подаёт меню.
    note: بفرمایید — то же вежливое слово предложения, что и в Уроке 1; здесь его говорят, когда что-то подают.
  fa.a1.unit06.lesson06.teach.turn04:
    title: Клиент просит совета
    gloss: Клиент спрашивает, что посоветует официант.
    note: چی توصیه می‌کنید؟ — из урока 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: Официант советует блюдо
    gloss: Официант говорит, что куриный кебаб сегодня очень хорош.
    note: В фразе جوجه‌کباب امروز خیلی خوبه использована разговорная форма خوبه, естественная для устных советов.
  fa.a1.unit06.lesson06.teach.turn06:
    title: Клиент делает полный заказ
    gloss: Клиент соглашается и заказывает куриный кебаб с рисом и чай.
    note: Здесь используется می‌خواستم — это уместно по отношению к официанту, которого клиент лично не знает.
  fa.a1.unit06.lesson06.teach.turn07:
    title: Официант принимает заказ
    gloss: Официант говорит, что сейчас всё принесёт.
    note: چشم، الان میارم — из урока 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: Клиент хвалит еду и просит счёт
    gloss: Клиент говорит, что было очень вкусно, и просит счёт.
    note: Обе фразы напрямую повторяют лексику урока 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: Официант приносит счёт
    gloss: Официант соглашается и говорит, что сейчас принесёт.
    note: البته («конечно») — естественное вежливое согласие в такой ситуации.
