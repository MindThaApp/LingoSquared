    feedback: میوه означает «фрукты».
  fa.a1.unit06.lesson01.exercise07.write_own_drink:
    instruction: 'Напиши по-персидски слово для напитка, который ты любишь: чай или кофе.'
    accepted_answers:
    - value: چای
      status: correct
    - value: قهوه
      status: correct
    feedback: 'Подходят оба слова: и چای, и قهوه.'
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: Что означает эта фраза?
    correct_option: Мне бы хотелось чаю. (вежливо)
    distractors:
    - Хочу чаю. (неформально)
    - У вас есть чай?
    - Чай хороший.
    accepted_answers:
    - value: Мне бы хотелось чаю. (вежливо)
      status: correct
    feedback: می‌خواستم — вежливая форма заказа для человека, которого ты плохо знаешь.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام уместно сказать…
    correct_option: близкому другу, который заваривает чай дома
    distractors:
    - официанту, которого ты только что встретил
    - незнакомому продавцу
    - старшему человеку на официальном ужине
    accepted_answers:
    - value: близкому другу, который заваривает чай дома
      status: correct
    feedback: می‌خوام — разговорная неформальная форма, только для близкого, привычного общения.
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: Что означает эта фраза?
    correct_option: Мне бы хотелось чаю, пожалуйста. (вежливо)
    distractors:
    - Хочу чаю. (неформально)
    - У вас есть меню?
    - Что вы посоветуете?
    accepted_answers:
    - value: Мне бы хотелось чаю, пожалуйста. (вежливо)
      status: correct
    feedback: یک چای می‌خواستم، لطفاً означает «Мне бы хотелось чаю, пожалуйста» (вежливо).
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: Соотнеси каждый глагол заказа с ситуацией, где он уместен.
    accepted_answers:
    - value:
        می‌خواستم: я бы хотел(а) (вежливо)
        می‌خوام: я хочу (неформально)
      status: correct
    feedback: Эти две формы различаются только уровнем вежливости, а не тем, что заказывают.
    pairs:
    - left: می‌خواستم
      right: я бы хотел(а) (вежливо)
    - left: می‌خوام
      right: я хочу (неформально)
  fa.a1.unit06.lesson02.exercise05.order_polite_naan:
    instruction: Расставь слова так, чтобы вежливо заказать хлеб.
    accepted_answers:
    - value:
      - یک
      - نان
      - می‌خواستم
      status: correct
    feedback: یک نان می‌خواستم — вежливый заказ хлеба.
  fa.a1.unit06.lesson02.exercise06.translate_informal_order:
