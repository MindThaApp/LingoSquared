teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: Университет
    gloss: университет
    note: '*دانشگاه* — обычное, повседневное слово для «университета».'
    example_gloss: Этот университет хороший.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Студент
    gloss: студент
    note: '*دانشجو* означает «студент университета». В *من دانشجو هستم* («Я студент») используется привычная форма *هستم*.'
    example_gloss: Я студент.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Урок / предмет
    gloss: урок / предмет
    note: '*درس* означает и «урок», и шире — «учебный предмет».'
    example_gloss: Этот предмет интересный.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Язык
    gloss: язык
    note: '*زبان* — обычное слово для «языка».'
    example_gloss: Персидский — это язык.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Я / это
    gloss: я / этот
    note: '*من* и *این* снова встречаются здесь, когда речь идёт об учёбе.'
    target_text: من (я) / این (этот)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: В / на
    gloss: в / на
    note: '*در* значит «в» или «на»; здесь оно используется в значении «в университете».'
    target_text: در (в / на)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Учить/читать + я = я учу/читаю
    gloss: учиться/читать + я = я учусь/читаю
    note: '*خوندن* («читать» или «учиться», как в *کتاب خوندن*) принимает то же окончание настоящего времени *-م*, что и *می‌کنم*, и получается *می‌خونم* — «я учусь» или «я читаю».'
    target_text: خوندن (учиться/читать) + م = می‌خونم (я учусь/читаю)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Я учусь в университете
    gloss: Я учусь в университете
    note: '*من در دانشگاه درس می‌خونم* состоит из *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Математика
    gloss: математика
    note: '*ریاضی* — обычное слово для «математики».'
    example_gloss: Математика интересная.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Специальность / направление
    gloss: специальность / направление
    note: '*رشته* означает университетскую «специальность» или «направление обучения». В *رشته‌ی من* («моя специальность») дополнительное *ی* связывает существительное с *من*.'
    example_gloss: Моя специальность — языки.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Английский
    gloss: английский
    note: '*انگلیسی* («английский») снова встречается здесь как название предмета, который можно изучать.'
    target_text: انگلیسی (английский)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Учить + я = я учу
    gloss: учить + я = я учу
    note: '*یاد گرفتن* значит «учить, усваивать». Его форма настоящего времени *یاد می‌گیرم* использует тот же глагол *گرفتن*, что и *عکس می‌گیرم* («я фотографирую»), но в другом значении.'
    target_text: یاد گرفتن (учить, усваивать) + م = یاد می‌گیرم (я учу)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Ты учишь/читаешь (разговорная форма)
    gloss: ты учишься/читаешь (неформально)
    note: '*می‌خونی* — неформальная форма 2-го лица от *می‌خونم*; так спрашивают собеседника напрямую.'
    target_text: می‌خونی (ты учишься/читаешь, неформально)
  fa.a1.unit30.lesson02.teach.review_chi:
    title: Что
    gloss: что
    note: '*چی* («что») снова встречается здесь.'
    target_text: چی (что)
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: Что ты изучаешь?
    gloss: Что ты изучаешь?
    note: '*چی درس می‌خونی؟* объединяет все элементы этого урока.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Моя специальность — математика. Я ещё учу английский.
    gloss: Моя специальность — математика. Я ещё учу английский.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* называет твою специальность и дополнительный предмет; здесь используются показатель прямого дополнения *رو* и *هم* («тоже»).'
  fa.a1.unit30.lesson03.teach.review_koja:
    title: Где
    gloss: где
    note: '*کجا* («где») может употребляться отдельно как вопросительное слово, а также в вопросах вроде *کجاست؟*.'
    target_text: کجا (где)
  fa.a1.unit30.lesson03.teach.question_where_study:
    title: Где ты учишься?
    gloss: Где ты учишься?
    note: '*کجا درس می‌خونی؟* — так спрашивают, где человек учится.'
  fa.a1.unit30.lesson03.teach.review_be:
    title: В / на / к
    gloss: в, к
    note: '*به* («в, к») снова встречается здесь в значении «в университет».'
    target_text: به (в, к)
  fa.a1.unit30.lesson03.teach.review_miram:
    title: Я иду
    gloss: я иду
    note: '*می‌رم* («я иду») снова встречается здесь в значении «хожу в университет».'
    target_text: می‌رم (я иду)
  fa.a1.unit30.lesson03.teach.review_har_ruz:
    title: Каждый день
    gloss: каждый день
    note: '*هر روز* («каждый день») снова встречается здесь.'
    target_text: هر روز (каждый день)
  fa.a1.unit30.lesson03.teach.answer_frequency:
    title: Я каждый день хожу в университет
    gloss: Я каждый день хожу в университет
    note: '*هر روز به دانشگاه می‌رم* объединяет всё, что было в этом уроке.'
  fa.a1.unit30.lesson04.teach.sakhte_word:
    title: Это трудно
    gloss: это трудно
    note: '*سخته* (*سخت* + разговорная связка *-ه*) говорят о чём-то трудном.'
    example_gloss: Математика — это трудно.
  fa.a1.unit30.lesson04.teach.review_jalebe:
    title: Это интересно
    gloss: это интересно
    note: '*جالبه* («это интересно») встречается здесь снова.'
    target_text: جالبه (интересно)
  fa.a1.unit30.lesson04.teach.review_vali:
    title: Но
    gloss: но
    note: '*ولی* («но») встречается здесь снова.'
    target_text: ولی (но)
  fa.a1.unit30.lesson04.teach.review_are:
    title: Ага
    gloss: ага
    note: '*آره* («ага») встречается здесь снова.'
    target_text: آره (ага)
  fa.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Нима: Сара, что ты изучаешь?'
    gloss: Сара, что ты изучаешь?
  fa.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Сара: Я изучаю английский язык. А где ты учишься?'
    gloss: Я изучаю английский язык. А где ты учишься?
  fa.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Нима: Я изучаю математику в университете.'
    gloss: Я изучаю математику в университете.
  fa.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Сара: Математика — это трудно, да?'
    gloss: Математика — это трудно, да?
  fa.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Нима: Ага, трудно, но интересно.'
    gloss: Ага, трудно, но интересно.
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Сара: Как здорово!'
    gloss: Как здорово!
  fa.a1.unit30.lesson05.teach.review_mikhone:
    title: Он/она учит/читает
    gloss: он/она учится, изучает
    note: '*می‌خونه* — разговорная форма 3-го лица от *می‌خونم*. Она нужна, чтобы рассказать оНиме и Саре в этом тексте.'
    target_text: می‌خونه (он/она учится/читает)
  fa.a1.unit30.lesson05.teach.review_mire:
    title: Он/она идёт
    gloss: он/она идёт, ходит
    note: '*می‌ره* — разговорная форма 3-го лица от *می‌رم* («я иду, хожу»).'
    target_text: می‌ره (он/она идёт)
  fa.a1.unit30.lesson05.teach.review_oo:
    title: Он / она
    gloss: он / она
    note: '*او* — местоимение 3-го лица.'
    target_text: او (он/она)
  fa.a1.unit30.lesson05.teach.review_nima:
    title: Нима
    gloss: Нима
    note: '*نیما* — один из двух друзей, которые постоянно встречаются тебе в этих диалогах.'
  fa.a1.unit30.lesson05.teach.reading_text:
    title: 'Чтение: учёба Нимы и Сары'
    gloss: Нима изучает математику в университете. Математика трудная, но интересная. Сара изучает английский язык. Она каждый день ходит в университет.
    note: Этот текст пересказывает диалог от 3-го лица. Новых слов почти нет, так что это тренировка в узнавании слов в связном тексте.
  fa.a1.unit30.lesson06.teach.review_dooset_daram_vaght:
    title: Мне нравится / время / у меня нет
    gloss: мне нравится / время / у меня нет
    note: '*دوست دارم*, *وقت* и *ندارم* здесь соединяются в естественную фразу об учёбе: что нравится и что мешает.'
    target_text: دوست دارم (мне нравится) / وقت (время) / ندارم (у меня нет)
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: Иногда
    gloss: иногда
    note: '*گاهی* («иногда») встречается здесь снова.'
    target_text: گاهی (иногда)
  fa.a1.unit30.lesson06.teach.wrap_summary:
    title: Мне нравится учиться, но иногда это трудно
    gloss: Мне нравится учиться, но иногда это трудно
    note: '*درس رو دوست دارم ولی گاهی سخته* соединяет предпочтение и трудность с помощью *ولی*.'
