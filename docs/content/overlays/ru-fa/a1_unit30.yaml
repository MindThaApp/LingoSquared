course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: названия слов об университете и учёбе (университет, студент, урок/предмет, язык), рассказ о том, какой предмет ты изучаешь (математика, специальность, английский как предмет), вопрос и ответ о том, где ты учишься (*کجا درس می‌خونی؟*) и как часто ходишь, текст для чтения об учёбе *نیما* и *سارا* и заключительный диалог между *نیما* и *سارا* об их предметах и отношении к ним (трудно, но интересно).'
