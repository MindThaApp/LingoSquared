course:
  title: Персидский A2
  description: 'Персидский (Иран) для уровня ниже среднего с грамматической основой: банк, мнения, договорённости и многое другое; теперь начинаем простое прошедшее время как систему (основы, окончания и отрицательное прошедшее).'
units:
  fa.a2.unit19.last_weekend:
    title: Прошедшие выходные
lessons:
  fa.a2.unit19.lesson01.weekend_words:
    title: Слова о выходных и первые формы прошедшего
  fa.a2.unit19.lesson02.past_stem_and_endings:
    title: Как образуется простое прошедшее время
  fa.a2.unit19.lesson03.negative_past:
    title: Отрицательное прошедшее, прошедшее и настоящее
  fa.a2.unit19.lesson04.saying_what_you_did:
    title: Рассказываем по порядку, что ты делал
  fa.a2.unit19.lesson05.reading_and_listening:
    title: Чтение и аудирование
  fa.a2.unit19.lesson06.weekend_conversation:
    title: Разговор о выходных
teaching:
  fa.a2.unit19.lesson01.teach.weekend_phrase:
    title: Прошедшие выходные
    gloss: на прошлых выходных
    note: '*آخر هفته‌ی پیش* буквально значит «конец прошлой недели» — так по-персидски говорят «на прошлых выходных». В Иране выходные — четверг и пятница.'
    example_gloss: На прошлых выходных я остался дома.
  fa.a2.unit19.lesson01.teach.days:
    title: Четверг, пятница
    gloss: Четверг, пятница
    note: Эти два дня составляют иранские выходные, поэтому именно о них обычно и рассказывают.
    example_gloss:
    - В четверг я ходил в парк.
    - В пятницу я остался дома.
  fa.a2.unit19.lesson01.teach.parts_of_day:
    title: Утро, полдень, время после полудня
    gloss: утро, полдень, вторая половина дня
    note: '*عصر* — это вторая половина дня и начало вечера. Время суток ставится сразу после дня: *پنجشنبه صبح* — «в четверг утром».'
    example_gloss:
    - В четверг утром я ходил за покупками.
    - Я спал до полудня.
    - После полудня я ходил в парк.
  fa.a2.unit19.lesson01.teach.places:
    title: Парк, кино, банк
    gloss: парк, кино, банк
    note: 'С глаголом *رفتن* («идти, ехать») предлог *به* («в, на») в речи часто опускают: и *به پارک رفتم*, и *رفتم پارک* значат «я ходил в парк».'
    example_gloss:
    - В четверг я ходил в парк.
    - В пятницу я ходил в кино.
    - В четверг я ходил в банк.
  fa.a2.unit19.lesson01.teach.errands:
    title: Покупки
    gloss: покупки
    note: '*رفتم خرید* значит «я ходил за покупками». Это же слово *خرید* — форма прошедшего времени для «он/она» от глагола *خریدن*: «он/она купил(а)».'
    example_gloss: В четверг утром я ходил за покупками.
  fa.a2.unit19.lesson01.teach.home_book_film:
    title: Дом, книга, фильм
    gloss: дом, книга, фильм
    note: '*خونه* — разговорная форма слова *خانه* (дом). В речи обычно говорят *یه کتاب* («одна книга») вместо *یک کتاب*; допустимы оба варианта.'
    example_gloss:
    - В пятницу я остался дома.
    - Я читал(а) книгу.
    - Я посмотрел фильм.
  fa.a2.unit19.lesson01.teach.people:
    title: Мой друг, моя бабушка
    gloss: мой друг, моя бабушка
    note: 'Окончание *-م* у существительного значит «мой»: *دوست* (друг) превращается в *دوستم* (мой друг).'
    example_gloss:
    - В четверг пришёл мой друг.
    - В пятницу пришла моя бабушка.
  fa.a2.unit19.lesson01.teach.visit:
    title: Навестить
    gloss: навещать / видеть
    note: '*رفتن دیدن* и имя человека значит пойти навестить его: *رفتم دیدن دوستم* — «я ходил навестить друга». То же слово *دیدن* означает и «видеть».'
    example_gloss: Я ходил навестить бабушку.
  fa.a2.unit19.lesson01.teach.verbs_go_stay:
    title: Я пошёл, я пришёл, я остался
    gloss: Я пошёл, я пришёл, я остался
    note: Это формы простого прошедшего времени для *я*. В разговорной речи говорят *اومدم* и *موندم*, а в аккуратном письме — *آمدم* и *ماندم*.
    example_gloss:
    - В четверг я ходил в парк.
    - В пятницу я пришёл домой.
    - На прошлых выходных я остался дома.
  fa.a2.unit19.lesson01.teach.verbs_eat_see:
    title: Я ел, я видел, я читал, я спал
    gloss: Я ел, я видел, я читал, я спал
    note: Ещё четыре формы простого прошедшего времени для *я*. *خوندم* — разговорная форма от *خواندم*.
    example_gloss:
    - Я обедал(а).
    - Я посмотрел фильм.
    - Я читал(а) книгу.
    - В пятницу я спал.
  fa.a2.unit19.lesson02.teach.pronouns:
    title: Я, ты, он/она, мы
    gloss: я, ты, он / она, мы
    note: В разговорной речи местоимение обычно опускают, потому что окончание глагола уже показывает, кто действует. Его добавляют для выделения или противопоставления. *اون* значит «он» или «она».
    example_gloss:
    - В четверг я ходил в парк.
    - Ты остался дома?
    - Он пришёл в пятницу.
    - В четверг мы ходили в парк.
  fa.a2.unit19.lesson02.teach.stem_rule:
    title: Основа прошедшего времени
    gloss: 'Основы прошедшего: пошёл, съел, увидел, прочитал, остался, пришёл, поспал'
    note: 'Словарная форма глагола (инфинитив) оканчивается на *-ن*. Отбрось её — и получишь основу прошедшего времени: *رفتن* → *رفت*, *خوردن* → *خورد*, *دیدن* → *دید*, *خوندن* → *خوند*, *موندن* → *موند*, *اومدن* → *اومد*, *خوابیدن* → *خوابید*. Всё простое прошедшее строится на этой основе.'
  fa.a2.unit19.lesson02.teach.endings:
    title: Окончания на основе прошедшего времени
    gloss: я пошёл, ты пошёл, он/она пошёл(а), мы пошли, вы пошли, они пошли
    note: 'Добавь окончание к основе: *-م* (я), *-ی* (ты), без окончания (он/она), *-یم* (мы), *-ین* (вы; в разговорной речи: *رفتین*), *-ن* (они). В аккуратном письме для «вы» пишется *-ید* (*رفتید*), а для «они» *-ند* (*رفتند*). Обрати внимание: *رفتن* означает ещё и «идти, ехать» (инфинитив) — различить их помогает контекст. И не путай два *-م*: у существительного оно значит «мой» (*دوستم*), а у глагола в прошедшем времени — «я» (*رفتم*).'
  fa.a2.unit19.lesson02.teach.eat_forms:
    title: Те же окончания у глагола خورد
    gloss: я съел(а), ты съел(а), он/она съел(а), мы съели
    note: 'Те же окончания, другая основа: *خورد* + *-م*, *-ی*, ничего, *-یم*.'
  fa.a2.unit19.lesson02.teach.stay_forms:
    title: Те же окончания у глагола موند
    gloss: я остался(лась), ты остался(лась), он/она остался(лась), мы остались
    note: 'Основа *موند* принимает те же окончания. В форме «он/она» ничего добавлять не нужно: *اون خونه موند*.'
  fa.a2.unit19.lesson03.teach.and_but:
    title: Но, и
    gloss: но, и
    note: '*ولی* соединяет две противопоставленные части предложения, а *و* просто добавляет ещё что-то.'
    example_gloss:
    - Я сходил(а) в парк, но в кино не ходил(а).
    - В пятницу я остался(лась) дома и читал(а) книгу.
  fa.a2.unit19.lesson03.teach.time_words:
    title: Вчера, сегодня, каждый день
    gloss: вчера, сегодня, каждый день
    note: 'Слова времени помогают выбрать время глагола: *دیروز* указывает на прошлое, а *هر روز* (привычка) — на настоящее. *امروز* сочетается с обоими: *امروز نمی‌رم پارک* «Сегодня я не иду в парк», но *امروز رفتم پارک* «Сегодня я ходил(а) в парк», когда это уже случилось.'
    example_gloss:
    - Вчера я ходил(а) в парк.
    - Сегодня я не иду в парк.
    - Каждый день я хожу в парк.
  fa.a2.unit19.lesson03.teach.negative_rule:
    title: 'Прошедшее отрицательное: نـ + глагол'
    gloss: я не пошёл/не пошла, я не ел(а), я не видел(а), я не читал(а), я не остался(лась)
    note: 'Чтобы сказать, что ты НЕ сделал что-то, поставь *نـ* прямо перед глаголом в прошедшем времени, больше ничего не меняя: *رفتم* → *نرفتم*, *خوردم* → *نخوردم*, *ندیدم*, *نخوندم*, *نموندم*. Окончания остаются теми же: *نرفتم*, *نرفتی*, *نرفت*, *نرفتیم*. *نـ* пишется слитно с глаголом — это не отдельное слово *نه* («нет»): *نه، نرفتم* значит «Нет, я не ходил(а)».'
  fa.a2.unit19.lesson03.teach.neg_aamad:
    title: 'Исключение: اومدن'
    gloss: я не пришёл/не пришла, ты не пришёл/не пришла, он/она не пришёл/не пришла, мы не пришли
    note: '*اومدن* («приходить») начинается с гласной, поэтому *نـ* + *ا* превращается в *نی*: *اومدم* → *نیومدم* (никогда не *ناومدم*). Остальные окончания подчиняются обычному правилу: *نیومدی*, *نیومد*, *نیومدیم*. В аккуратном письме: *آمدم* → *نیامدم*.'
  fa.a2.unit19.lesson03.teach.past_vs_present:
    title: Прошедшее или настоящее?
    gloss: я иду, я ходил(а), я не иду, я не ходил(а)
    note: 'В простом прошедшем нет *می‌*, а используется основа прошедшего времени (*رفتم*); в настоящем есть *می‌* и основа настоящего времени (*می‌رم*). Время определяют основа и *می‌* вместе. Отрицание устроено так же: *نرفتم* «я не ходил(а)», но *نمی‌رم* «я не хожу / не иду». Произношение: в прошедшем отрицании *na-* (*نرفتم*, «наръфтам»), а *نمی‌* читается *ne-* (*نمی‌رم*, «неми́рам»).'
  fa.a2.unit19.lesson04.teach.sequence_words:
    title: Сначала, потом, в конце концов
    gloss: сначала, потом / затем, в конце концов
    note: '*اول* начинает последовательность, *بعد* продолжает её (его можно повторять), а *آخرش* завершает.'
    example_gloss:
    - Сначала я пошёл/пошла в банк.
    - Потом я пошёл/пошла за покупками.
    - В конце концов я пришёл/пришла домой.
  fa.a2.unit19.lesson04.teach.sequence_note:
    title: Рассказ о событиях по порядку
    gloss: Сначала я сходил(а) в банк, потом пошёл/пошла за покупками, а в конце пришёл/пришла домой.
    note: 'Рассказывай о событиях в том порядке, в котором они происходили. У каждой части свой глагол в прошедшем времени (с *رفتن* глагол часто стоит перед местом: *رفتم بانک*). Части соединяются запятой или *و*: *اول رفتم بانک و بعد رفتم خرید*. Отрицательное событие ставь туда, где оно по рассказу: *بعد رفتم پارک، ولی سینما نرفتم* или *بعد رفتم خرید، ولی ورزش نکردم*. *اومدم خونه* («я пришёл/пришла домой») — естественный способ закончить рассказ о дне.'
  fa.a2.unit19.lesson04.teach.question:
    title: Что ты делал(а) на прошлых выходных?
    gloss: Что ты делал(а) на прошлых выходных?
    note: '*چیکار کردی؟* (буквально «что ты сделал(а)?») — стандартный способ спросить. Отвечаешь глаголами в прошедшем времени, по одной части на каждое дело.'
  fa.a2.unit19.lesson04.teach.sport:
    title: Спорт
    gloss: спорт / физические упражнения
    note: '*ورزش کردن* значит заниматься спортом или физическими упражнениями.'
    example_gloss: В четверг я занимался/занималась спортом.
  fa.a2.unit19.lesson04.teach.compound_negative:
    title: Отрицание глаголов типа خرید کردن
    gloss: я сделал(а) покупки, я не делал(а) покупки, я занимался/занималась спортом, я не занимался/занималась спортом
    note: 'Глаголы вроде *خرید کردن* («делать покупки») и *ورزش کردن* состоят из существительного и *کردن* («делать»). *نـ* ставится на глагол, а не на существительное: *خرید نکردم*, но никогда не *نخرید کردم*. Форма «он/она» — *نکرد*: *ورزش نکرد*.'
  fa.a2.unit19.lesson04.teach.no_answer:
    title: Ответ на вопрос «да/нет» в прошедшем времени
    gloss: Ты ходил(а) в кино? Нет, не ходил(а).
    note: 'Чтобы ответить «нет» на вопрос о прошлом, повтори глагол с *نـ*: *نرفتم*. Очень часто спереди добавляют *نه* («нет»). Чтобы ответить «да», повтори глагол без نـ: *رفتم*.'
  fa.a2.unit19.lesson05.teach.spot_negative:
    title: Найди отрицание
    gloss: я не делал(а), я не ходил(а), я не видел(а)
    note: 'Когда читаешь или слушаешь, смотри на самое начало каждого глагола. Маленькая *نـ* полностью меняет смысл: *رفتم* «я ходил(а)», но *نرفتم* «я не ходил(а)». В рассказе о выходных отрицания показывают, чего НЕ было, так что замечай их так же внимательно, как и дела.'
  fa.a2.unit19.lesson05.teach.reading_message:
    title: Сообщение Сары подруге
    gloss: Привет! На прошлых выходных, в четверг утром, я ходила за покупками. Потом пошла в парк. Ближе к вечеру навестила бабушку. В пятницу осталась дома и читала книгу. Но спортом не занималась и в кино не ходила.
    note: Короткий письменный рассказ о выходных. Прочитай его сначала ради дел и их порядка, а потом ещё раз ради двух вещей, которые она НЕ делала.
  fa.a2.unit19.lesson06.teach.names:
    title: Сара, Нима
    gloss: Сара, Нима
    note: Двое друзей из прошлых уроков.
    example_gloss:
    - Сара ходила в парк в четверг.
    - Нима пришёл в пятницу.
  fa.a2.unit19.lesson06.teach.until:
    title: До
    gloss: до
    note: '*تا* перед временем или днём значит «до»: *تا ظهر* «до полудня».'
    example_gloss: Я спал до полудня.
  fa.a2.unit19.lesson06.teach.what_about:
    title: А как насчёт...?
    gloss: А в пятницу? А ты?
    note: '*چی؟* после слова значит «а что насчёт этого?» — быстрый способ продолжить разговор.'
  fa.a2.unit19.lesson06.teach.how_nice:
    title: Как хорошо!
    gloss: Как хорошо!
    note: Дружелюбная реакция на хорошую новость.
  fa.a2.unit19.lesson06.teach.turn01:
    title: Сара спрашивает о прошлых выходных
    gloss: Сара спрашивает Ниму, что он делал на прошлых выходных.
    note: Стандартный вопрос для рассказа о прошедших выходных.
  fa.a2.unit19.lesson06.teach.turn02:
    title: Четверг Нимы
    gloss: Нима говорит, что в четверг сначала пошёл в банк, потом за покупками.
    note: '*اول ... بعد ...* расставляет два дела по порядку.'
  fa.a2.unit19.lesson06.teach.turn03:
    title: Сара спрашивает о пятнице
    gloss: 'Сара спрашивает: а в пятницу? Ты занимался спортом?'
    note: '*ورزش کردی؟* — вопрос «да/нет» о действии в прошлом.'
  fa.a2.unit19.lesson06.teach.turn04:
    title: Пятница Нимы
    gloss: 'Нима отвечает «нет», спортом не занимался. Он спал до полудня, а ближе к вечеру пошёл навестить друга. Он спрашивает Сару: а ты?'
    note: '*ورزش نکردم* — *نـ* ставится на глагол. Остальная часть его пятницы — утвердительная.'
  fa.a2.unit19.lesson06.teach.turn05:
    title: Выходные Сары
    gloss: Сара говорит, что в четверг ходила в парк, а в пятницу осталась дома и читала книгу.
    note: Сара отвечает на *تو چی؟* с местоимением *من* — здесь местоимение уместно.
  fa.a2.unit19.lesson06.teach.turn06:
    title: Нима реагирует
    gloss: 'Нима говорит: как хорошо!'
    note: Короткая дружелюбная реакция в конце разговора.
  fa.a2.unit19.lesson06.teach.third_person:
    title: Рассказ о других людях
    gloss: Нима пошёл, Сара осталась, Нима не пошёл, Сара не делала
    note: 'Когда рассказываешь, что сделал кто-то другой, для «он/она» используй голую основу: *نیما رفت بانک*, *سارا خونه موند*. Отрицание — по-прежнему *نـ* + основа: *نیما نرفت*, *سارا ورزش نکرد*. Окончание не добавляется, поэтому о том, кто действовал, говорит имя (или *اون*).'
exercises:
  fa.a2.unit19.lesson01.exercise01.recognize_last_weekend:
    instruction: Что означает эта фраза?
    correct_option: на прошлых выходных
    distractors:
    - на следующих выходных
    - каждые выходные
    - вчера утром
    accepted_answers:
    - value: на прошлых выходных
      status: correct
    feedback: '*آخر هفته‌ی پیش* значит «на прошлых выходных».'
  fa.a2.unit19.lesson01.exercise02.recognize_went:
    instruction: Что значит этот глагол?
