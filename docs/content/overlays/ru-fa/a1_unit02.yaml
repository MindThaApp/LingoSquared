course:
  title: Персидский язык (Иран) A1
  description: 'Персидский язык Ирана для начинающих: чтение письма, понимание повседневной речи и вежливое общение в практических ситуациях.'
units:
  fa.a1.unit02.introductions:
    title: Имена, происхождение и знакомство
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Читаем буквы, нужные для знакомства
  fa.a1.unit02.lesson02.names:
    title: Спросить и назвать имя
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Местоимения единственного числа и глагол «быть»
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Страны и национальности
  fa.a1.unit02.lesson05.origin:
    title: Спросить, откуда человек
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Встреча на занятии по фарси
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Буквы ن и ت
    gloss: н и т
    note: ن обозначает звук «н». ت обозначает «т»; обе буквы соединяются с соседними с обеих сторон.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Буквы ش и چ
    gloss: ш и ч
    note: ش обозначает «ш», а چ — «ч».
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Буквы ی и ه
    gloss: й/долгое и и h (х)
    note: ی звучит как «й» или как долгое «и». ه — это «h» (мягкое «х»); при соединении она меняет форму.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Буквы ک и گ
    gloss: к и г
    note: ک обозначает «к»; при наборе текста используй персидскую ک, а не похожую арабскую букву. گ — это ک с дополнительной чертой, она обозначает «г».
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Буквы ج и د
    gloss: дж и д
    note: ج обозначает «дж». د обозначает «д» и не соединяется с следующей буквой слева.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Буквы ر и ف
    gloss: р и ф
    note: ر обозначает «р» и не соединяется со следующей буквой; ف обозначает «ф».
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Буквы و и ب
    gloss: в/о/у и б
    note: و может обозначать «в» или гласный звук и не соединяется со следующей буквой. ب обозначает «б».
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Буквы خ и ز
    gloss: х (kh) и з
    note: خ — звук, который обычно передают как «kh» (твёрдое «х»); ز обозначает «з».
  fa.a1.unit02.lesson02.teach.esm:
    title: Имя
    gloss: имя
    note: В обычном иранском персидском اسم читается «esm».
    example_gloss: Меня зовут Сара.
  fa.a1.unit02.lesson02.teach.man:
    title: Я
    gloss: я
    note: من — местоимение первого лица единственного числа («я»).
  fa.a1.unit02.lesson02.teach.sara:
    title: Сара
    gloss: Сара
    note: سارا — распространённое иранское имя.
    example_gloss: Сара — мой друг.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Формальное или письменное представление
    gloss: Меня зовут Сара.
    note: '*اسم من سارا است* — правильная, но формальная фраза; чаще всего её встретишь в письменной речи.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Естественное разговорное представление
    gloss: Меня зовут Сара.
    note: اسمم — сокращение от اسم من, а ساراست — слитно сказанные سارا и است.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Вежливо спросить имя
    gloss: Как тебя зовут?
    note: اسم شما چیه؟ — обычная нейтрально-вежливая разговорная фраза иранского фарси.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Спрашиваем имя неформально
    gloss: Как тебя зовут?
    note: اسمت چیه؟ — форма единственного числа, неформальная; используй её, только если отношения это позволяют.
  fa.a1.unit02.lesson03.teach.man:
    title: Я
    gloss: я
    note: У местоимения من нет грамматического рода.
  fa.a1.unit02.lesson03.teach.to:
    title: Ты (неформально, единственное число)
    gloss: ты
    note: تو — неформальное обращение в единственном числе; для вежливого обращения обычно используется شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: Он или она
    gloss: он / она
    note: او не различает рода и может означать как «он», так и «она».
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Я есть
    gloss: я есть
    note: هستم — полная форма глагола بودن («быть») для первого лица единственного числа.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Ты есть
    gloss: вы есть; вы
    note: هستی согласуется с неформальным местоимением единственного числа تو.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: Он или она есть
    gloss: он/она есть; он/она находится (имеется)
    note: هست — полная форма третьего лица единственного числа; часто выражает наличие или несёт акцент.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Формальное именное сказуемое
    gloss: Он/она иранец/иранка.
    note: В нейтральном формальном письменном предложении о принадлежности است — обычная связка 3-го лица.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Разговорное именное сказуемое
    gloss: Он/она иранец/иранка.
    note: ایرانیه — естественное разговорное сокращение от ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Иран
    gloss: Иран
    note: ایران — название страны.
    example_gloss: Я из Ирана.
  fa.a1.unit02.lesson04.teach.iranian:
    title: Иранец / иранский
    gloss: иранец / иранский
    note: ایرانی может указывать на национальность или происхождение.
    example_gloss: Я иранец (иранка).
  fa.a1.unit02.lesson04.teach.england:
    title: Англия
    gloss: Англия
    note: '*انگلیس* обычно означает Англию; в повседневной речи иранцы часто используют это слово для всего Соединённого Королевства.'
    example_gloss: Я из Англии.
  fa.a1.unit02.lesson04.teach.english:
    title: Англичанин / английский
    gloss: английский / англичанин
    note: انگلیسی может означать национальность, язык или что-то, связанное с Англией; значение определяется по контексту.
    example_gloss: Я англичанин (англичанка).
  fa.a1.unit02.lesson04.teach.france:
    title: Франция
    gloss: Франция
    note: فرانسه — название страны Франция.
    example_gloss: Я из Франции.
  fa.a1.unit02.lesson04.teach.french:
    title: Француз / французский
    gloss: французский / француз
    note: فرانسوی может указывать на национальность или на что-то, связанное с Францией.
    example_gloss: Я француз (француженка).
  fa.a1.unit02.lesson04.teach.country:
    title: Страна
    gloss: страна
    note: کشور — общее слово для обозначения страны.
    example_gloss: Иран — это страна.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Национальность
    gloss: национальность
    note: ملیت — официальное слово «национальность».
    example_gloss: Какая у вас национальность?
  fa.a1.unit02.lesson05.teach.ahl:
    title: Родом из
    gloss: родом из
    note: اهل связывает человека с местом его происхождения; оно не означает просто «живёт сейчас в каком-то месте».
    example_gloss: Он/она из Англии.
  fa.a1.unit02.lesson05.teach.koja:
    title: Где
    gloss: где
    note: کجا спрашивает о месте.
    example_gloss: Вы откуда?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Формальный стандартный вопрос
    gloss: Откуда вы?
    note: اهل کجا هستید؟ — вежливый стандартный персидский; подходит для официальной речи или аккуратного чтения.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Нейтрально-вежливый разговорный вопрос
    gloss: Откуда вы?
    note: اهل کجا هستین؟ — обычная вежливая разговорная форма в иранском фарси.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Неформальный вопрос
    gloss: Откуда вы?
    note: اهل کجایی؟ — неформальный вопрос к одному человеку (на «ты»).
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Назвать место происхождения
    gloss: Я из Ирана.
    note: من اهل ایران هستم указывает на происхождение, а не на нынешнее место жительства.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Короткий ответ о национальности
    gloss: Я иранец (иранка).
    note: '*ایرانی‌ام* — это *ایرانی* с окончанием *ـام* («я есть»), которое пишется через маленький полупробел.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Уточнить место
    gloss: Сара спрашивает, здесь ли занятия по фарси.
    note: ببخشید вежливо привлекает внимание перед практическим вопросом.
  fa.a1.unit02.lesson06.teach.yes:
    title: Да
    gloss: да
    note: بله — нейтрально-вежливое слово «да».
    example_gloss: Да, конечно.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Мина представляется
    gloss: Мина подтверждает, что это то самое место, представляется и спрашивает, как зовут Сару.
    note: Вежливый разговорный вопрос подходит для двух взрослых, которые знакомятся на занятии.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Сара называет своё имя
    gloss: Меня зовут Сара.
    note: Сара использует краткую разговорную модель, которую мы уже изучали.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Мина спрашивает о происхождении
    gloss: Откуда вы?
    note: هستین сохраняет вежливый, но непринуждённый тон разговора.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Обмен сведениями о происхождении
    gloss: Сара говорит, что она из Англии, и спрашивает, из Ирана ли Мина.
    note: Собеседницы сохраняют вежливые формы, потому что только что познакомились.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: 'Обмен вопросами о родном городе: ответ'
    gloss: Мина подтверждает, что она иранка.
    note: '*ایرانی‌ام* — краткая форма от *ایرانی هستم* («я иранец/иранка»).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Ответить на знакомство
    gloss: Сара говорит, что рада познакомиться с Миной.
    note: از آشنایی با شما خوشوقتم — естественное завершение их разговора.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Ответить на приветствие и войти в класс
    gloss: Мина говорит, что тоже рада, и приглашает Сару войти.
    note: من هم همین‌طور отвечает на вежливые слова Сары, а بفرمایید داخل продвигает сценку в классе дальше.
