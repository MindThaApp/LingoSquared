teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: Счастливый
    gloss: счастливый
    note: خوشحال означает «счастливый, довольный».
    example_gloss: Я рад.
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: Грустный
    gloss: грустный
    note: ناراحت означает «грустный, расстроенный».
    example_gloss: Мне грустно.
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: Я есть (краткая форма)
    gloss: я есть (сокращённая форма с прилагательным)
    note: '*خوشحالم* — это *خوشحال* + *هستم*, сокращённое до *-م*. После безмолвного *-ه* то же окончание пишется *-ام*, как в *خسته‌ام*.'
    target_text: خوشحالم = خوشحال + هستم (я рад / я рада, сокращённая форма)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Усталый
    gloss: усталый
    note: خسته означает «усталый».
    example_gloss: Я устал.
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: Мне нехорошо
    gloss: мне нехорошо
    note: خوب نیستم — отрицание уже знакомого خوبم («у меня всё хорошо») с помощью نیستم, отрицательной формы هستم.
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Голодный
    gloss: голодный
    note: '*گشنه* означает «голодный». Это обычная разговорная форма слова *گرسنه*, которое ты видел(а) в уроке 4.'
    example_gloss: Я голоден.
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: Немного
    gloss: немного
    note: یکم смягчает чувство, как русское «немного» или «чуть-чуть».
    example_gloss: Я немного устал.
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: Злой
    gloss: злой
    note: عصبانی означает «злой, сердитый».
    example_gloss: Почему ты злишься?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Обеспокоенный
    gloss: обеспокоенный
    note: نگران означает «обеспокоенный».
    example_gloss: Я волнуюсь.
  fa.a1.unit23.lesson03.teach.chera_word:
    title: Почему
    gloss: почему
    note: '*چرا* означает «почему»; *هستی* — неформальная форма «ты есть», она сокращается до *-ی*: *نگران هستی* становится *نگرانی*.'
    target_text: چرا (почему)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: Я работал(а)
    gloss: я работал(а)
    note: کار کردم буквально значит «работу я сделал».
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: Выходной
    gloss: выходной
    note: تعطیله означает «выходной, нерабочий день».
    example_gloss: Сегодня выходной.
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: Сегодня
    gloss: сегодня
    note: امروز означает «сегодня».
    example_gloss: Сегодня я устал.
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: Много
    gloss: много
    note: زیاد означает «много, слишком много».
    example_gloss: Я много работал.
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: Сара
    gloss: Сара
    note: سارا, героиня, знакомая нам ещё по уроку 14, снова появляется здесь.
    example_gloss: Сара устала.
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 'Чтение: день Сары'
    gloss: Сара сегодня немного устала, потому что много работала. Сара не грустит, она просто устала.
    note: '*خسته‌ست* и *کرده* — разговорные формы 3-го лица, соответствующие *خسته‌ام* и *کردم*; *نیست* — отрицание к *هست*; *فقط* означает «только».'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: Как хорошо!
    gloss: как хорошо!
    note: چه خوب! — частая положительная реакция, как «здорово!».
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: 'Нима: Сара, как дела?'
    gloss: Сара, как дела?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 'Сара: Я немного устала...'
    gloss: Сегодня я немного устала, потому что много работала. А ты как?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 'Нима: Я рад...'
    gloss: Я рад, потому что сегодня выходной.
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 'Сара: Как хорошо!'
    gloss: Как хорошо!
