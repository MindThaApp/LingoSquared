teaching:
  fa.a1.unit13.lesson01.teach.diruz_word:
    title: Вчера
    gloss: вчера
    note: دیروز означает «вчера».
    example_gloss: Вчера я ходил(а) в кино.
  fa.a1.unit13.lesson01.teach.raftam_word:
    title: Я пошёл / пошла
    gloss: я пошёл / я пошла
    note: رفتم — простое прошедшее время глагола رفتن («идти, ехать») в 1-м лице.
    example_gloss: Я ходил(а) в ресторан.
  fa.a1.unit13.lesson01.teach.khordam_word:
    title: Я поел(а)
    gloss: я ел(а)
    note: خوردم — простое прошедшее время глагола خوردن («есть») в 1-м лице.
    example_gloss: Я обедал(а).
  fa.a1.unit13.lesson01.teach.didam_word:
    title: Я видел(а)
    gloss: я видел(а)
    note: دیدم — простое прошедшее время глагола دیدن («видеть») в 1-м лице.
    example_gloss: Я посмотрел хороший фильм.
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: Кино
    gloss: кино
    note: سینما означает «кинотеатр» или «кино».
    example_gloss: Вчера я ходил(а) в кино.
  fa.a1.unit13.lesson02.teach.be_word:
    title: В / на / к
    gloss: в, к, на
    note: به означает «в, к, на» и ставится перед местом, куда идут.
    target_text: به (в, к)
  fa.a1.unit13.lesson02.teach.diruz_sinama_raftam:
    title: Вчера я ходил(а) в кино.
    gloss: Вчера я ходил(а) в кино.
    note: دیروز به سینما رفتم — полное предложение из слов этого урока.
  fa.a1.unit13.lesson03.teach.chikar_word:
    title: Что (за дело)
    gloss: что (делать)
    note: چیکار (букв. «какое дело») используется, чтобы спросить, что человек делал.
    example_gloss: Что ты делал(а) вчера?
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: Ты делал(а)
    gloss: ты делал(а)
    note: کردی — простое прошедшее время глагола کردن («делать») во 2-м лице единственного числа, разговорная форма.
    example_gloss: Что ты делал(а)?
  fa.a1.unit13.lesson03.teach.question_phrase:
    title: Что ты делал вчера?
    gloss: Что ты делал вчера?
    note: دیروز چیکار کردی؟ — обычный разговорный способ спросить, что человек делал вчера.
  fa.a1.unit13.lesson04.teach.film_word:
    title: Фильм
    gloss: фильм
    note: فیلم означает «фильм».
    example_gloss: Я посмотрел хороший фильм.
  fa.a1.unit13.lesson04.teach.khoob_word:
    title: Хороший
    gloss: хороший
    note: خوب означает «хороший».
    example_gloss: Фильм был хороший.
  fa.a1.unit13.lesson04.teach.recent_event_text:
    title: Пример текста о недавнем событии
    gloss: Вчера я ходил(а) в кино. Я посмотрел(а) хороший фильм. Потом я пообедал(а).
    note: Короткий рассказ от первого лица со словами прошедшего времени из этого раздела.
  fa.a1.unit13.lesson04.teach.va_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет два предложения или два слова.
    target_text: و (и)
  fa.a1.unit13.lesson05.teach.ketab_word:
    title: Книга
    gloss: книга
    note: کتاب означает «книга».
    example_gloss: Я читал(а) книгу.
  fa.a1.unit13.lesson05.teach.khoondam_word:
    title: Я читаю
    gloss: Я читаю
    note: خوندم — разговорная форма прошедшего времени глагола خواندن («читать») в 1-м лице.
    example_gloss: Вчера я читал(а) книгу.
  fa.a1.unit13.lesson06.teach.man_word:
    title: Я
    gloss: я
    note: من — личное местоимение «я»; здесь оно употреблено для выделения (من خونه موندم — «а я остался(лась) дома»).
    example_gloss: Я остался(лась) дома.
  fa.a1.unit13.lesson06.teach.names:
    title: Нима и Сара
    gloss: Нима, Сара
    note: نیما и سارا — двое собеседников в диалоге этого урока.
    example_gloss:
    - Нима остался дома и читал книгу.
    - Сара вчера ходила в кино.
  fa.a1.unit13.lesson06.teach.khooneh_moondam_word:
    title: Я остался(лась) дома
    gloss: я остался(лась) дома
    note: خونه موندم означает «я остался(лась) дома»; здесь используется разговорное خونه («дом»).
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: А ты?
    gloss: А ты?
    note: تو چی؟ буквально «ты, что?» — естественный способ вернуть вопрос собеседнику.
  fa.a1.unit13.lesson06.teach.alie_word:
    title: Отлично
    gloss: здорово
    note: عالیه — стяжённая форма по уже знакомой модели -e (عالی است → عالیه).
    example_gloss: Здорово, как это было?
  fa.a1.unit13.lesson06.teach.dialogue_line1:
    title: Что ты делал вчера?
    gloss: Что ты делал вчера?
    note: Нима начинает разговор и спрашивает Сару, что она делала вчера.
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: Я ходила в кино и посмотрела хороший фильм. А ты?
    gloss: Я ходила в кино и посмотрела хороший фильм. А ты?
    note: Сара отвечает и возвращает вопрос.
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: Я остался дома и читал книгу.
    gloss: Я остался дома и читал книгу.
    note: Нима рассказывает о своём дне.
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: Здорово!
    gloss: Здорово!
    note: Сара радостно реагирует и завершает разговор.
  fa.a1.unit13.lesson06.teach.third_person_past:
    title: Он/она пошёл/пошла, увидел/увидела, сделал/сделала, остался/осталась, прочитал/прочитала (3-е лицо)
    gloss: он/она ходил(а), видел(а), делал(а), остался(лась), читал(а) (3-е лицо)
    note: رفت، دید، کرد، موند، خوند — формы простого прошедшего времени 3-го лица; они нужны, чтобы сравнить, что делали Сара и Нима.
    target_text: رفت، دید، کرد، موند، خوند (он/она ходил(а), видел(а), делал(а), остался/осталась, читал(а) — третье лицо)
