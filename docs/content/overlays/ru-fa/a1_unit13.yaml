course:
  title: Персидский язык (Иран) A1
  description: 'Персидский (Иран) для начинающих: простое прошедшее время, рассказ о том, что произошло вчера, вопросы о недавнем событии, чтение и письмо о недавнем событии и диалог, в котором сравниваются выходные двух людей.'
