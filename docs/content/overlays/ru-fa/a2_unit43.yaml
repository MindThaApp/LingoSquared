teaching:
  fa.a2.unit43.lesson01.teach.foods:
    title: На рынке
    gloss: яблоко, апельсин, хлеб, пирожное
    note: '*نون* — разговорная форма слова *نان*.'
    example_gloss:
    - Яблоко дешёвое.
    - Апельсин дорогой.
    - Хлеб здесь.
    - Пирожное вон там.
  fa.a2.unit43.lesson01.teach.pointing:
    title: Этот, тот, один, сколько стоит
    gloss: этот, тот, один (из них), сколько это стоит
    note: '*این یکی* значит «вот этот», *اون یکی* — «вон тот».'
    example_gloss:
    - Сколько стоит это яблоко?
    - Тот апельсин дешёвый.
    - Этот дорогой.
    - Тот дешёвый.
  fa.a2.unit43.lesson01.teach.oneword:
    title: این и اون стоят перед существительным
    gloss: это яблоко; тот апельсин; вот этот; вон тот
    note: '*این* указывает на близкий предмет, *اون* — на далёкий. Они стоят перед существительным и не меняются по роду и числу, как русские «этот/эта». Чтобы не повторять существительное, используй *یکی*: *این یکی*, *اون یکی*.'
  fa.a2.unit43.lesson01.teach.want:
    title: 'Выбор: я хочу вон тот'
    gloss: Я хочу вон тот; я хочу вот этот
    note: 'Когда ты выбираешь конкретный предмет, после него ставится *رو*: *اون یکی رو می‌خوام*.'
  fa.a2.unit43.lesson02.teach.flowers:
    title: Цветы и книги
    gloss: цветок, книга, роман
    note: '*گل* — это цветок.'
    example_gloss:
    - Цветок красивый.
    - Книга здесь.
    - Роман вон там.
  fa.a2.unit43.lesson02.teach.plural:
    title: این / اون + множественное число
    gloss: эти яблоки; те цветы; эти книги; те апельсины
    note: 'Добавь к существительному *‌ها* (через полупробел), а *این* или *اون* оставь перед ним: *این سیب‌ها* — «эти яблоки». В речи *-ها* часто превращается в *-ا* (*سیبا*).'
  fa.a2.unit43.lesson02.teach.plural_use:
    title: Вопрос и выбор с множественным числом
    gloss: Сколько стоят эти яблоки? Я хочу те цветы.
    note: Выбранный предмет во множественном числе тоже получает *رو*. После *این* или *اون* + множественное число цену обычно спрашивают с помощью *چنده؟*.
  fa.a2.unit43.lesson03.teach.bookshop:
    title: В книжном магазине
    gloss: я хочу, у вас есть, дайте (мне)
    note: '*دارید؟* — вежливое «у вас есть?», а *بدید* — вежливое «дайте мне».'
    example_gloss:
    - Я хочу книгу.
    - У вас есть роман?
    - Дайте мне ту книгу.
  fa.a2.unit43.lesson03.teach.indef:
    title: 'Окончание -ی: какой-нибудь'
    gloss: Я хочу книгу (какую-нибудь); у вас есть роман?
    note: 'Добавь *ی* к существительному, когда имеешь в виду «какой-нибудь» и конкретный предмет не важен. Обычно *رو* при этом нет: *کتابی می‌خوام*.'
  fa.a2.unit43.lesson03.teach.indef_def:
    title: Неопределённое или определённое?
    gloss: Я хочу какую-нибудь книгу. Я хочу ту книгу.
    note: 'Сравни: *کتابی* — любая книга (без *رو*); *اون کتاب رو* — одна конкретная книга (с *رو*).'
  fa.a2.unit43.lesson04.teach.shopwords:
    title: Что-нибудь, пекарня, цветочный магазин
    gloss: что-нибудь, пекарня, цветочный магазин
    note: '*چیزی* — «что-нибудь»; в нём уже есть неопределённое *ی* на конце.'
    example_gloss:
    - Я хочу что-нибудь.
    - Пекарня вон там.
    - Цветочный магазин здесь.
  fa.a2.unit43.lesson04.teach.yeh:
    title: 'یه ... ی: какой-нибудь, некий'
    gloss: немного хлеба; какой-нибудь цветок; какое-нибудь пирожное; что-нибудь
    note: 'В речи часто сочетают *یه* перед существительным и *ی* после него: *یه نونی*, *یه گلی*. Звучит как «какой-нибудь / какой-то». После конечного *ی* окончание пишется *ای*: *یه شیرینی‌ای*.'
  fa.a2.unit43.lesson04.teach.yeh_use:
    title: Просьба о чём-нибудь неконкретном
    gloss: Дайте мне немного хлеба. Я хочу какой-нибудь цветок.
    note: Используй *یه ... ی*, когда просишь что-то и конкретный предмет не важен, например в пекарне или цветочном магазине.
  fa.a2.unit43.lesson05.teach.reading:
    title: Поход на рынок
    gloss: Сегодня я ходил(а) на рынок. Сначала я зашёл (зашла) в пекарню. Я купил(а) хлеба. Потом я пошёл (пошла) в цветочный магазин. Я увидел(а) те красные цветы. Эти цветы были дешёвые, а те были дорогие. Я купил(а) два цветка. Потом я ещё купил(а) книгу.
    note: Прочитай один раз, обращая внимание на магазины, а потом ещё раз — на *این*, *اون* и окончания *-ی*.
  fa.a2.unit43.lesson06.teach.turn01:
    title: Продавец приветствует Сару
    gloss: 'Продавец: Пожалуйста. Что вы хотите?'
    note: '*می‌خواید* — вежливое «вы хотите».'
  fa.a2.unit43.lesson06.teach.turn02:
    title: Сара просит цветок
    gloss: 'Сара: Мне хотелось бы какой-нибудь цветок. Сколько стоят эти цветы?'
    note: '*یه گلی* — неконкретный цветок; *این گل‌ها* указывает на «эти».'
  fa.a2.unit43.lesson06.teach.turn03:
    title: Продавец сравнивает
    gloss: 'Продавец: Те красные цветы дешёвые. Этот дорогой.'
    note: '*گل‌های قرمز*: существительное во множественном числе + прилагательное, связанные изафетом (соединительный звук *-e*, после гласной на письме *ی*).'
  fa.a2.unit43.lesson06.teach.turn04:
    title: Сара выбирает
    gloss: 'Сара: Я хочу вон тот. Дайте мне два.'
    note: '*دو تا* значит «два (штуки)».'
  fa.a2.unit43.lesson06.teach.turn05:
    title: Продавец отдаёт покупку
    gloss: 'Продавец: Пожалуйста.'
    note: '*بفرمایید* говорят, когда что-то подают или передают.'
