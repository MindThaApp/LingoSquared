teaching:
  fa.a2.unit49.lesson01.teach.event_words:
    title: Куда и на что можно пригласить
    gloss: кино, концерт, театр, день рождения, билет
    note: '*کنسرت* — это концерт, а *تئاتر* — спектакль или театр. *بلیت* — это билет на мероприятие.'
    example_gloss:
    - У меня есть два билета на концерт.
    - Спектакль был очень хороший.
    - В пятницу я иду в кино.
    - Я купил(а) подарок на день рождения друга.
  fa.a2.unit49.lesson01.teach.invite_words:
    title: Приглашение и «пойдём»
    gloss: приглашение, пойдём
    note: '*دعوت* — это приглашение. *بریم* («пойдём») завершает дружеское предложение, часто вместе с *با هم* («вместе»).'
    example_gloss:
    - Спасибо за приглашение.
    - Нима приглашает Сару.
    - Пойдём вместе в кино?
    - Пойдём сегодня вечером в парк?
  fa.a2.unit49.lesson01.teach.more_events:
    title: Другие виды встреч
    gloss: вечеринка, пикник, посиделки, праздник
    note: '*مهمونی* — это вечеринка, *پیک‌نیک* — пикник, *دورهمی* — неформальные посиделки, а *جشن* — праздник.'
    example_gloss:
    - Сегодня вечером у нас вечеринка.
    - В пятницу мы едем на пикник.
    - В субботу у нас праздник и посиделки.
  fa.a2.unit49.lesson01.teach.invitation_extras:
    title: Ещё слова для приглашений
    gloss: обед, прогулка, пригласительная открытка
    note: '*ناهار* — это обед, *گردش* — прогулка, а *دعوتنامه* — пригласительная открытка или письменное приглашение.'
    example_gloss:
    - В пятницу мы обедаем вместе.
    - Пойдём вместе погуляем?
    - У меня есть пригласительная открытка.
  fa.a2.unit49.lesson01.teach.invite_forms:
    title: Три простых способа пригласить
    gloss: Хочешь прийти на концерт? Ты пойдёшь со мной в театр? Пойдём вместе в кино?
    note: Все три фразы — вопросы. *می‌خوای بیای ...؟* спрашивает, хочет ли собеседник прийти. *با من میای ...؟* спрашивает напрямую. *با هم بریم ...؟* предлагает пойти вместе. Сначала добавь слово со временем (*فردا*, *جمعه شب*), чтобы приглашение было понятным.
  fa.a2.unit49.lesson02.teach.accept_words:
    title: Слова для согласия
    gloss: да, обязательно, как хорошо, здорово, хорошо, я приду
    note: '*آره* и *باشه* означают «да». *حتما* добавляет «обязательно». *چه خوب* и *عالیه* показывают, что ты рад(а).'
    example_gloss:
    - Да, я обязательно приду.
    - Как хорошо! Спасибо.
    - Хорошо, восемь часов подходит.
    - Здорово! Я приду в субботу.
  fa.a2.unit49.lesson02.teach.detail_words:
    title: Уточнение деталей
    gloss: во сколько, где, когда
    note: 'После согласия спроси о нужной детали: *ساعت چند؟* (во сколько), *کجا؟* (где), *کی؟* (когда).'
    example_gloss:
    - Во сколько мы идём?
    - Куда мы идём?
    - Когда мы идём?
  fa.a2.unit49.lesson02.teach.accept_forms:
    title: Сказать «да» и сказать «возможно»
    gloss: Спасибо за приглашение! Я обязательно приду; я могу прийти; возможно, я смогу прийти
    note: 'Твёрдое «да» — *حتما میام*. *می‌تونم بیام* значит, что ты можешь прийти. *شاید بتونم بیام* — осторожное «возможно»: это не обещание. Для вежливости начни с *ممنون از دعوت*.'
  fa.a2.unit49.lesson03.teach.decline_words:
    title: Слова для вежливого отказа
    gloss: к сожалению, извини, я не могу, но
    note: Смягчи отказ словами *متاسفانه* или *ببخشید* перед *نمی‌تونم بیام*.
    example_gloss:
    - К сожалению, я не смогу прийти.
    - Извини, в пятницу я не могу.
    - Спасибо, но я не могу.
  fa.a2.unit49.lesson03.teach.reason_words:
    title: Причины для отказа
    gloss: у меня работа, у меня встреча, у меня совещание, я болею, мне нужно учиться, мне нужно идти на занятия
    note: '*باید* («нужно») стоит перед коротким глаголом: *باید درس بخونم*, *باید برم کلاس*. Другие причины строятся с *دارم*: *کار دارم*, *قرار دارم*.'
    example_gloss:
    - В пятницу у меня работа.
    - Сегодня вечером у меня встреча.
    - Завтра у меня совещание.
    - Сегодня я болею.
    - Мне нужно учиться.
    - Мне нужно идти на занятия.
  fa.a2.unit49.lesson03.teach.future_reasons:
    title: Причина — твои планы
    gloss: потому что завтра я еду на север, потому что на выходных я еду в Тегеран
    note: 'Причиной может быть план: *چون* плюс *می‌خوام برم* и место.'
    example_gloss:
    - Потому что завтра я еду на север.
    - Потому что на выходных я еду в Тегеран.
  fa.a2.unit49.lesson03.teach.host_schedule:
    title: Хозяин и твой график
    gloss: хозяин, гость, занят, свободен
    note: '*میزبان* — это хозяин, а *مهمون* — гость. Говори *مشغولم*, когда ты занят(а), и *آزادم*, когда свободен (свободна).'
    example_gloss:
    - Сара принимает гостей на вечеринке.
    - Сегодня вечером у меня гость.
    - В пятницу я занят(а), а в субботу свободен (свободна).
  fa.a2.unit49.lesson03.teach.hosting_extras:
    title: Гостеприимство и время
    gloss: роль хозяина, угощение гостей, возможность / время
    note: '*میزبانی* — это роль хозяина, приём гостей. *پذیرایی* — угощение гостей. *فرصت* значит возможность или достаточно времени, чтобы что-то сделать.'
    example_gloss:
    - Сара принимает гостей.
    - Сара угощает гостя.
    - В субботу у меня есть время.
  fa.a2.unit49.lesson03.teach.decline_pattern:
    title: Отказ с объяснением причины
    gloss: Извини, я не смогу прийти, потому что мне нужно учиться
    note: 'Вежливый отказ состоит из трёх частей: извинение (*ببخشید* или *متاسفانه*), сам отказ (*نمی‌تونم بیام*) и причина с *چون*. Причина может стоять и в начале: *چون باید درس بخونم، نمی‌تونم بیام*.'
  fa.a2.unit49.lesson04.teach.alt_words:
    title: Предложение другого дня
    gloss: но, как насчёт субботы, на следующей неделе, в другой раз
    note: '*ولی* («но») соединяет отказ с новой идеей. *شنبه چطوره؟* предлагает другой день.'
    example_gloss:
    - В пятницу я не могу, но в субботу могу.
    - Как насчёт субботы?
    - На следующей неделе я могу.
    - Пойдём в другой раз.
  fa.a2.unit49.lesson04.teach.if_plan:
    title: Если у тебя есть время
    gloss: если у тебя есть время
    note: '*اگه* («если») плюс настоящее время — дружеское условие: *اگه وقت داری، با هم می‌ریم*.'
    example_gloss:
    - Если у тебя будет время, пойдём вместе.
    - Если у тебя есть время в субботу, приходи.
  fa.a2.unit49.lesson04.teach.alt_pattern:
    title: Нет — с причиной и другим предложением
    gloss: Я не могу прийти, потому что у меня работа. Но в субботу могу
    note: 'Хороший отказ не заканчивается на «нет». Назови причину с *چون*, а потом предложи другое время с *ولی*: *ولی شنبه می‌تونم*. Можно ещё спросить: *شنبه چطوره؟*'
  fa.a2.unit49.lesson05.teach.reading_invite:
    title: Приглашение Сары
    gloss: Привет, Нима! В пятницу вечером у меня два билета на концерт. Хочешь пойти со мной? Мы идём в восемь. Пока, Сара
    note: Найди событие, день и время.
  fa.a2.unit49.lesson05.teach.reading_reply:
    title: Ответ Нимы
    gloss: Привет, Сара! Спасибо за приглашение. К сожалению, в пятницу я не могу прийти, потому что мне надо заниматься. Но в субботу могу. Пойдём вместе в театр в субботу вечером? Пока, Нима
    note: Найди благодарность, отказ, причину и новое предложение.
  fa.a2.unit49.lesson06.teach.turn01:
    title: Сара приглашает Ниму
    gloss: Привет, Нима! Хочешь пойти со мной на концерт в пятницу вечером?
    note: Сара приглашает с помощью *می‌خوای*.
  fa.a2.unit49.lesson06.teach.turn02:
    title: Нима благодарит и отказывается
    gloss: Спасибо за приглашение! Но в пятницу, к сожалению, не могу, потому что мне надо заниматься.
    note: Благодарность, отказ и причина в одной реплике.
  fa.a2.unit49.lesson06.teach.turn03:
    title: Сара предлагает другой день
    gloss: Как насчёт субботы? Хочешь пойти в театр?
    note: Новый день и новое событие.
  fa.a2.unit49.lesson06.teach.turn04:
    title: Нима соглашается и спрашивает время
    gloss: Да, в субботу могу. Во сколько?
    note: Нима соглашается и уточняет деталь.
  fa.a2.unit49.lesson06.teach.turn05:
    title: Сара называет время
    gloss: В восемь.
    note: Короткий ответ.
  fa.a2.unit49.lesson06.teach.turn06:
    title: Нима подтверждает
    gloss: Отлично! Тогда я приду в субботу. Пока!
    note: '*پس* («тогда») подтверждает план.'
