    correct_option: На концерт в пятницу вечером.
    distractors:
    - На фильм в пятницу вечером.
    - На спектакль в субботу вечером.
    - День рождения в пятницу вечером.
    accepted_answers:
    - value: На концерт в пятницу вечером.
      status: correct
    feedback: 'В сообщении есть *جمعه شب* и *بلیت کنسرت*: речь о концерте в пятницу вечером.'
  fa.a2.unit49.lesson05.exercise02.read_why:
    instruction: Почему Нима не может прийти в пятницу?
    correct_option: Ему надо заниматься.
    distractors:
    - У него работа.
    - Он болен.
    - У него назначена встреча.
    accepted_answers:
    - value: Ему надо заниматься.
      status: correct
    feedback: В ответе сказано *چون باید درس بخونم* — «потому что мне надо заниматься».
  fa.a2.unit49.lesson05.exercise03.match_reply_parts:
    instruction: Соедини каждую строку сообщений с её функцией.
    accepted_answers:
    - value:
        می‌خوای با من بیای؟: приглашение
        ساعت هشت می‌ریم: время
        ممنون از دعوت: спасибо
        متاسفانه جمعه نمی‌تونم بیام: отказ
        چون باید درس بخونم: причина
        ولی شنبه می‌تونم: альтернатива
        شنبه شب با هم بریم تئاتر؟: новое предложение
        فعلا، نیما: прощание
      status: correct
    feedback: 'Приглашение и ответ на него строятся по одним и тем же шагам: спросить, поблагодарить, отказаться, назвать причину, предложить другое время.'
    pairs:
    - left: می‌خوای با من بیای؟
      right: приглашение
    - left: ساعت هشت می‌ریم
      right: время
    - left: ممنون از دعوت
      right: спасибо
    - left: متاسفانه جمعه نمی‌تونم بیام
      right: отказ
    - left: چون باید درس بخونم
      right: причина
    - left: ولی شنبه می‌تونم
      right: альтернатива
    - left: شنبه شب با هم بریم تئاتر؟
      right: новое предложение
    - left: فعلا، نیما
      right: прощание
  fa.a2.unit49.lesson05.exercise04.listen_invite:
    instruction: Послушай без текста. Что за приглашение?
    correct_option: Хочешь пойти со мной завтра на концерт? У меня два билета.
    distractors:
    - Хочешь пойти со мной завтра в кино? У меня два билета.
    - Хочешь пойти со мной сегодня вечером на концерт? У меня два билета.
    - Хочешь пойти со мной завтра на концерт? У меня один билет.
    accepted_answers:
    - value: Хочешь пойти со мной завтра на концерт? У меня два билета.
      status: correct
    feedback: В записи звучат *کنسرت*, *فردا* и *دو تا بلیت*.
  fa.a2.unit49.lesson05.exercise05.listen_decline:
    instruction: Послушай без текста. Что говорит говорящий?
    correct_option: Извини, я не смогу прийти, потому что завтра у меня работа. Но в субботу смогу.
    distractors:
    - Извини, я не смогу прийти, потому что завтра у меня работа. Но в пятницу смогу.
    - Извини, я не смогу прийти, потому что я болен. Но в субботу смогу.
    - Извини, я смогу прийти, но завтра у меня работа. В субботу не смогу.
    accepted_answers:
    - value: Извини, я не смогу прийти, потому что завтра у меня работа. Но в субботу смогу.
      status: correct
    feedback: В записи звучат отказ, причина (*چون فردا کار دارم*) и альтернатива (*ولی شنبه می‌تونم*).
  fa.a2.unit49.lesson05.exercise06.dictation_accept:
