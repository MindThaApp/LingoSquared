teaching:
  fa.a2.unit46.lesson01.teach.things:
    title: О чём можно поговорить
    gloss: книга, подарок, сумка
    note: '*یه* — разговорное «один / какой-то».'
    example_gloss:
    - У меня есть книга.
    - У меня есть подарок.
    - У меня есть сумка.
  fa.a2.unit46.lesson01.teach.verbs:
    title: Глаголы в прошедшем времени
    gloss: я купил(а), я видел(а), я прочитал(а), я получил(а), (показатель прямого дополнения)
    note: '*رو* ставится после того, на что направлено действие глагола. Окончания прошедшего времени: *-م* (я), *-ی* (ты) и нулевое окончание (он / она).'
    example_gloss:
    - Я купил(а) книгу.
    - Я увидел(а) подарок.
    - Я прочитал(а) книгу.
    - Я взял(а) сумку.
  fa.a2.unit46.lesson01.teach.clitic:
    title: Глагол + ش
    gloss: я купил(а) это, я увидел(а) это, я прочитал(а) это, я получил(а) это
    note: 'Окончание *-ش* заменяет уже упомянутый предмет или человека: «его», «её», «это». Оно добавляется в самый конец глагола.'
    example_gloss:
    - Вчера я это купил(а).
    - Вчера я это увидел(а).
    - Вчера я это прочитал(а).
    - Вчера я это получил(а).
  fa.a2.unit46.lesson01.teach.you:
    title: Вопрос «ты это видел(а)?»
    gloss: ты увидел(а), ты увидел(а) это, ты взял(а)
    note: '*دیدی* значит «ты увидел(а)»; добавь *-ش*, и получится «ты это увидел(а)».'
    example_gloss:
    - Ты видел(а) подарок?
    - Где ты это видел(а)?
    - Ты взял(а) сумку?
  fa.a2.unit46.lesson01.teach.rule:
    title: Назвать один раз, а потом использовать ش
    gloss: Я купил(а) книгу; я купил(а) её
    note: 'В первый раз назови предмет вместе с *رو*. Дальше опусти существительное и *رو* и добавь к глаголу *-ش*: *کتاب رو خریدم*, затем *خریدمش*.'
  fa.a2.unit46.lesson02.teach.people:
    title: Люди
    gloss: мой друг, мои друзья, дети
    note: '*دوستم* значит «мой друг», а *دوستام* — «мои друзья».'
    example_gloss:
    - Я видел(а) своего друга.
    - Я видел(а) своих друзей.
    - Я видел(а) детей.
  fa.a2.unit46.lesson02.teach.them:
    title: Как сказать «их» и «тебя»
    gloss: я видел(а) их, я видел(а) тебя
    note: Окончание *-شون* значит «их», а *-ت* — «тебя». Оба добавляются к глаголу, как и *-ش*.
    example_gloss:
    - Вчера я видел(а) их.
    - Вчера я видел(а) тебя.
  fa.a2.unit46.lesson02.teach.when:
    title: Вчера и где
    gloss: вчера, где
    note: '*دیروز* значит «вчера», *کجا* — «где».'
    example_gloss:
    - Вчера я видел(а) тебя.
    - Где ты это видел(а)?
  fa.a2.unit46.lesson02.teach.three:
    title: Три окончания
    gloss: я видел(а) его / её / это; я видел(а) их; я видел(а) тебя
    note: '*-ش* относится к одному человеку или предмету, *-شون* — к нескольким, а *-ت* значит «тебя». Для нескольких людей или предметов используй *-شون*.'
  fa.a2.unit46.lesson03.teach.actions:
    title: Дать, вернуть, одолжить
    gloss: я дал(а), обратно, я взял(а) в долг
    note: '*پس دادم* значит «я вернул(а)» (отдал(а) обратно); *قرض گرفتم* — «я взял(а) в долг, одолжил(а) у кого-то».'
    example_gloss:
    - Я дал(а) книгу.
    - Я вернул(а) книгу.
    - Я взял(а) книгу на время.
  fa.a2.unit46.lesson03.teach.fused:
    title: Предлог + ش
    gloss: ему / ей, у него / у неё, для него / для неё, с ним / с ней
    note: 'В разговорной речи *به، از، برای، با* сливаются с окончанием лица: *بهش, ازش, براش, باهاش*. Они указывают на уже названного человека.'
    example_gloss:
    - Я дал(а) ему / ей книгу.
    - Я взял(а) это у него / у неё.
    - Я купил(а) подарок для него / для неё.
    - Я пошёл / пошла с ним / с ней.
  fa.a2.unit46.lesson03.teach.me:
    title: Мне, для меня
    gloss: мне, для меня
    note: С окончанием *-م* те же слова значат «мне» и «для меня».
    example_gloss:
    - Он / она дал(а) мне это.
    - Он / она купил(а) это для меня.
  fa.a2.unit46.lesson03.teach.names:
    title: Сначала назвать человека
    gloss: Нима, Сара, я пошёл / пошла
    note: 'Сначала назови человека, потом отсылай к нему: *از نیما قرض گرفتم*, затем *ازش*.'
    example_gloss:
    - Я одолжил(а) это у Нимы.
    - Я пошёл / пошла с Сарой.
  fa.a2.unit46.lesson03.teach.rule:
    title: Клитики предлогов
    gloss: Я одолжил(а) у Нимы; я одолжил(а) у него
    note: Замени *از نیما* на *ازش*, *با سارا* на *باهاش*, *برای مینا* на *براش*. Человек уже известен, поэтому имя не нужно.
  fa.a2.unit46.lesson04.teach.questions:
    title: Вопрос об этом
    gloss: ты это купил(а), ты это прочитал(а), ты это получил(а)
    note: 'Для «ты» окончание прошедшего времени — *-ی*, а затем *-ش*: *خریدی* превращается в *خریدیش*.'
    example_gloss:
    - Ты купил(а) подарок?
    - Ты купил(а) это вчера?
    - Ты прочитал(а) это вчера?
    - Ты получил(а) это вчера?
  fa.a2.unit46.lesson04.teach.negative:
    title: Отрицание
    gloss: я этого не видел(а), я этого не купил(а), я этого не прочитал(а), я этого не получил(а)
    note: 'Поставь *ن* перед глаголом прошедшего времени: *دیدم* превращается в *ندیدم*, а *-ش* по-прежнему стоит в конце: *ندیدمش*.'
    example_gloss:
    - Вчера я этого не видел(а).
    - Вчера я этого не купил(а).
    - Вчера я этого не прочитал(а).
    - Вчера я этого не получил(а).
  fa.a2.unit46.lesson04.teach.answers:
    title: Да и нет
    gloss: да, нет
    note: '*آره* — разговорное «да».'
    example_gloss:
    - Да, я это видел(а).
    - Нет, я этого не видел(а).
  fa.a2.unit46.lesson04.teach.rule:
    title: Короткие ответы
    gloss: Ты прочитал(а) книгу? Да, прочитал(а). Нет, не прочитал(а).
    note: 'В коротком ответе существительное не нужно. Повтори глагол с *-ش*: *آره، خوندمش* или *نه، نخوندمش*.'
  fa.a2.unit46.lesson05.teach.words:
    title: Слова для текста
    gloss: день рождения, был, магазин, в, потом, счастливый, стал, тоже, дал
    note: '*خوشحال شد* значит «обрадовался / обрадовалась» (стал(а) счастливым). *هم* значит «тоже».'
    example_gloss:
    - Вчера у Нимы был день рождения.
    - В магазине я увидел(а) книгу.
    - Потом я подарил(а) ему книгу.
    - Он очень обрадовался.
    - Нима тоже подарил сумку.
  fa.a2.unit46.lesson05.teach.reading:
    title: День рождения Нимы
    gloss: Вчера у Нимы был день рождения. В магазине я увидел(а) книгу и купил(а) её. Потом я подарил(а) ему книгу. Он очень обрадовался. Нима тоже подарил мне сумку.
    note: Прочитай один раз, чтобы понять, что произошло, а потом ещё раз, чтобы найти, на что указывает каждое ش.
  fa.a2.unit46.lesson06.teach.turn01:
    title: Сара спрашивает о книге
    gloss: 'Сара: Нима, ты прочитал книгу?'
    note: Существительное *کتاب* называется один раз, с *رو*.
  fa.a2.unit46.lesson06.teach.turn02:
    title: Нима отвечает
    gloss: 'Нима: Да, прочитал. Она была очень хорошая.'
    note: '*خوندمش* отсылает к книге.'
  fa.a2.unit46.lesson06.teach.turn03:
    title: Сара спрашивает о подарке
    gloss: 'Сара: Ты купил подарок для Мины?'
    note: '*مینا* — имя; подарок назван один раз.'
  fa.a2.unit46.lesson06.teach.turn04:
    title: Нима отвечает
    gloss: 'Нима: Да, купил, и вчера подарил ей.'
    note: '*خریدمش* относится к подарку, а *بهش* — к Мине.'
  fa.a2.unit46.lesson06.teach.turn05:
    title: Сара спрашивает о Мине
    gloss: 'Сара: Она обрадовалась?'
    note: Подлежащее понятно из разговора.
  fa.a2.unit46.lesson06.teach.turn06:
    title: Нима отвечает
    gloss: 'Нима: Да, очень обрадовалась.'
    note: Короткий естественный ответ.
