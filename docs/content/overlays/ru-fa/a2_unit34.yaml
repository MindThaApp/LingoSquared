    instruction: Что означает это предложение?
    correct_option: Потому что шёл дождь, я не пришёл.
    distractors:
    - Шёл дождь, поэтому я пришёл.
    - Я не пришёл, поэтому шёл дождь.
    - Если будет дождь, я не приду.
    accepted_answers:
    - value: Потому что шёл дождь, я не пришёл.
      status: correct
