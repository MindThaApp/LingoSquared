course:
  title: Персидский A2
  description: 'Персидский язык Ирана для среднего уровня: грамматика на основе повседневных ситуаций.'
units:
  fa.a2.unit34.because_so:
    title: «Потому что» и «поэтому»
lessons:
  fa.a2.unit34.lesson01.reason_forms:
    title: «Потому что» и «поэтому»
  fa.a2.unit34.lesson02.because_of:
    title: «Из-за» + существительное
  fa.a2.unit34.lesson03.word_order:
    title: 'Причина и следствие: порядок слов'
  fa.a2.unit34.lesson04.excuses:
    title: Отговорки и изменения планов
  fa.a2.unit34.lesson05.reading_listening:
    title: Чтение и аудирование
  fa.a2.unit34.lesson06.dialogue:
    title: Разговор о причине и следствии
teaching:
  fa.a2.unit34.lesson01.teach.reason_nouns:
    title: Слова для причин
    gloss: дождь, пробки, работа, больной, вчера, сегодня
    note: '*بارون* — разговорная форма слова «дождь». Это обычные причины отговорок и изменений планов.'
    example_gloss:
    - Вчера был дождь.
    - Сегодня пробки.
    - Сегодня у меня работа.
    - Вчера у меня была работа.
    - Вчера я болел.
  fa.a2.unit34.lesson01.teach.past_actions:
    title: Следствия
    gloss: шёл дождь, я не пришёл, я не приду, я опоздал
    note: 'Эти короткие формы — следствия, которые ты будешь связывать с причиной (прошедшее: *نیومدم*; настоящее: *نمیام*). *نیومدم* — отрицание от *اومدم* («я пришёл»).'
    example_gloss:
    - Вчера шёл дождь.
    - Вчера я не пришёл.
    - Сегодня я не приду.
    - Сегодня я опоздал.
  fa.a2.unit34.lesson01.teach.connectors:
    title: Три союза
    gloss: потому что, поэтому, из-за
    note: Три способа связать причину и следствие. *چون* и *به خاطر* вводят причину; *برای همین* вводит следствие.
    example_gloss:
    - Потому что шёл дождь, я не пришёл.
    - Шёл дождь, поэтому я не пришёл.
    - Я не пришёл из-за дождя.
  fa.a2.unit34.lesson01.teach.weather_causes:
    title: Причины из-за погоды
    gloss: жара, холод
    note: Эти существительные о погоде ставь после *به خاطر*, чтобы назвать причину.
    example_gloss:
    - Я заболел из-за жары.
    - Я заболел из-за холода.
  fa.a2.unit34.lesson01.teach.everyday_causes:
    title: Обычные причины
    gloss: усталость, сон, сверхурочная работа, проект
    note: Эти существительные называют частые причины, связанные с усталостью и работой.
    example_gloss:
    - Я опоздал из-за усталости.
    - Я опоздал из-за сна.
    - Из-за проекта у меня были сверхурочные.
  fa.a2.unit34.lesson01.teach.chon:
    title: چون вводит причину
    gloss: Потому что шёл дождь, я не пришёл.
    note: '*چون* + полное предложение (со своим глаголом) называет причину, а после запятой идёт следствие: *چون بارون اومد، نیومدم*.'
  fa.a2.unit34.lesson01.teach.baraye_hamin:
    title: برای همین вводит следствие
    gloss: Шёл дождь, поэтому я не пришёл.
    note: 'Сначала назови причину отдельным предложением, потом *برای همین* + следствие: *بارون اومد، برای همین نیومدم*. Это значит «поэтому».'
  fa.a2.unit34.lesson02.teach.plan_changes:
    title: Отговорки и изменения планов
    gloss: моя машина сломалась, я не пошёл на работу, я не смог прийти, мы изменили нашу договорённость
    note: '*قرار* — это договорённость о встрече или заранее намеченный план. *سر کار نرفتم* = «я не пошёл на работу». *نتونستم بیام* = «я не смог прийти».'
    example_gloss:
    - Моя машина сломалась.
    - Вчера я не пошёл на работу.
    - Сегодня я не смог прийти.
    - Мы изменили нашу договорённость.
  fa.a2.unit34.lesson02.teach.khater:
    title: به خاطر + существительное
    gloss: Я не пришёл из-за дождя.
    note: 'После *به خاطر* стоит существительное, без собственного глагола: *به خاطر بارون*, *به خاطر ترافیک*, *به خاطر کار*. Остальная часть предложения выражает следствие: *به خاطر ترافیک دیر رسیدم*.'
  fa.a2.unit34.lesson02.teach.khater_vs_chon:
    title: Один смысл, две конструкции
    gloss: из-за пробок = потому что были пробки
    note: '*به خاطر ترافیک* и *چون ترافیک بود* выражают одну и ту же причину. Используй *به خاطر*, когда причина — просто существительное, а *چون* — когда называешь целое предложение.'
  fa.a2.unit34.lesson03.teach.order:
    title: Сначала причина, потом следствие
    gloss: Так как у меня была работа, я не пришёл / У меня была работа, поэтому я не пришёл
    note: С *چون* предложение с причиной стоит в начале, а следствие — в конце. С *برای همین* причина идёт первым отдельным предложением, а следствие — после *برای همین*. В обоих случаях причина называется раньше следствия.
  fa.a2.unit34.lesson03.teach.clause_vs_noun:
    title: Предложение или существительное
    gloss: چون + предложение, به خاطر + существительное
    note: После *چون* нужен глагол (*بارون اومد*, *ترافیک بود*). После *به خاطر* стоит только существительное (*بارون*, *ترافیک*). Не говори *به خاطر بارون اومد* в значении «потому что шёл дождь».
  fa.a2.unit34.lesson03.teach.one_connector:
    title: Один союз на одну связь
    gloss: Не соединяй چون и برای همین в одной связи
    note: Для одной причины и одного следствия используй либо *چون ... ،*, либо *... ، برای همین ...*. Если сказать оба сразу, смысл повторяется, и звучит это неправильно.
  fa.a2.unit34.lesson04.teach.excuse_questions:
    title: Спрашиваем «почему»
    gloss: почему, извините, ты приехал, ты не пришёл, и
    note: '*چرا* спрашивает о причине. *ببخشید* начинает извинение. *و* соединяет два факта.'
    example_gloss:
    - Почему ты вчера не пришёл?
    - Почему ты опоздал?
    - Извините, я опоздал.
    - Шёл дождь, и были пробки.
  fa.a2.unit34.lesson04.teach.answer_chon:
    title: Ответ на چرا
    gloss: Ответ на چرا начинается с چون
    note: 'Естественный ответ на *چرا* начинается с *چون* и называет только причину: *چون ترافیک بود*. Если хочешь, добавь следствие во втором предложении.'
  fa.a2.unit34.lesson05.teach.message:
    title: Сообщение о несостоявшейся встрече
    gloss: Привет, Сара. Вчера я не смог прийти, потому что моя машина сломалась. Из-за дождя ещё и были пробки. Сегодня я болен, поэтому я перенёс нашу встречу.
    note: Прочитай один раз, чтобы найти три причины, а потом ещё раз — чтобы увидеть, что из каждой последовало.
  fa.a2.unit34.lesson06.teach.dialogue_words:
    title: Слова для разговора
    gloss: мы, да, ну, нет, мы договаривались, ты придёшь, я приду, я не приду
    note: '*آره* — разговорная форма слова «да». *میای؟* значит «ты придёшь?»; ответы — *میام* и *نمیام*.'
    example_gloss:
    - Вчера мы договаривались о встрече.
    - Да, я приду.
    - Ну что, ты сегодня придёшь?
    - Нет, сегодня я не приду.
  fa.a2.unit34.lesson06.teach.turn01:
    title: Сара спрашивает о причине
    gloss: 'Сара спрашивает Ниму: Нима, почему ты вчера не пришёл?'
    note: Вопрос *چرا* спрашивает о причине.
  fa.a2.unit34.lesson06.teach.turn02:
    title: Нима называет причину
    gloss: 'Нима: Потому что шёл дождь.'
    note: Короткий ответ на *چرا* начинается с *چون*.
  fa.a2.unit34.lesson06.teach.turn03:
    title: Сара напоминает
    gloss: 'Сара: Но мы же договаривались.'
    note: '*قرار داشتیم* значит «мы договаривались о встрече».'
  fa.a2.unit34.lesson06.teach.turn04:
    title: Нима объясняет следствие
    gloss: 'Нима: Да, шёл дождь и были пробки, поэтому я не смог прийти.'
    note: Две причины соединены с помощью *و*, а затем *برای همین* вводит следствие.
  fa.a2.unit34.lesson06.teach.turn05:
    title: Сара спрашивает про сегодня
    gloss: 'Сара: Ну что, ты сегодня придёшь?'
    note: Вопрос в настоящем времени о договорённости.
  fa.a2.unit34.lesson06.teach.turn06:
    title: Нима называет причину в настоящем времени
    gloss: 'Нима: Нет, у меня сегодня работа, поэтому я не приду.'
    note: Причина в настоящем времени с *چون*, затем следствие.
exercises:
