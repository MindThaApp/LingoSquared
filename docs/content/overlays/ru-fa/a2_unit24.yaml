teaching:
  fa.a2.unit24.lesson01.teach.incident_words:
    title: Вчера
    when: null
    an incident: null
    gloss: вчера, когда, происшествие
    note: '*وقتی* вводит время, когда что-то произошло; *که* может связать длящееся действие с событием, которое его прервало.'
    example_gloss:
    - Вчера случилось происшествие.
    - Когда я пришёл, начался дождь.
  fa.a2.unit24.lesson01.teach.weather_traffic:
    title: Дождь
    traffic: null
    bus: null
    power: null
    gloss: дождь, пробка, автобус, электричество
    note: Это слова для маленьких происшествий в этом уроке.
    example_gloss:
    - Начался дождь.
    - Автобус остановился в пробке.
    - Отключили электричество.
  fa.a2.unit24.lesson01.teach.actions:
    title: Дом и фоновые занятия
    gloss: дом, книга, ужин, идти, читать, готовить
    note: Эти действия можно показать как уже идущие.
    example_gloss:
    - Я шёл домой.
    - Я читал книгу.
    - Я готовил ужин.
  fa.a2.unit24.lesson01.teach.past_events:
    title: Единичные события в прошлом
    gloss: начался, остановился, отключился, я пришёл, случилось
    note: Эти формы простого прошедшего называют одно событие, которое произошло посреди другого действия.
    example_gloss:
    - Начался дождь.
    - Автобус остановился.
    - Когда я пришёл, отключили электричество.
  fa.a2.unit24.lesson01.teach.progressive_form:
    title: Прошедшее длительное
    gloss: я шёл, я читал, я готовил
    note: 'Для действия в процессе используй *داشتن* в прошедшем времени и соответствующую форму прошедшего с *می‌*: *داشتم می‌رفتم*. Оба глагола согласуются с одним и тем же лицом.'
  fa.a2.unit24.lesson02.teach.people_forms:
    title: Я
    you: null
    he/she: null
    we: null
    they: null
    gloss: я, ты, он/она, мы, они
    note: В фарси эти местоимения часто опускают, потому что лицо показывают окончания обоих глаголов.
    example_gloss:
    - Я шёл.
    - Ты шёл.
    - Он/она шёл/шла.
    - Мы шли.
    - Они шли.
  fa.a2.unit24.lesson02.teach.form_agreement:
    title: Одинаковые окончания у обоих глаголов
    gloss: я шёл, ты шёл, он/она шёл/шла, мы шли, они шли
    note: 'У двух глаголов одинаковые окончания: *داشتم می‌رفتم*, *داشتی می‌رفتی*, *داشت می‌رفت*, *داشتیم می‌رفتیم*, *داشتن می‌رفتن*.'
  fa.a2.unit24.lesson02.teach.linkers:
    title: Два способа связать событие
    gloss: Я шёл, когда начался дождь. Когда я пришёл, они уходили.
    note: Поставь *که* после фонового действия или начни с *وقتی* и события. В обоих случаях одна часть — длящееся действие, а другая — единичное событие.
  fa.a2.unit24.lesson03.teach.time_contrast:
    title: Каждый день
    at that moment: null
    usually: null
    gloss: каждый день, в тот момент, обычно
    note: Эти слова времени отличают повторяющуюся привычку в прошлом от одной сцены в процессе.
    example_gloss:
    - Я каждый день ходил домой.
    - В тот момент я шёл домой.
    - Обычно я читал книги.
  fa.a2.unit24.lesson03.teach.habit_contrast:
    title: Привычка и процесс
    gloss: Я ходил каждый день. В тот момент я шёл.
    note: Простое *می‌رفتم* может описывать повторяющуюся привычку в прошлом. *داشتم می‌رفتم* показывает действие, которое шло в один момент прошлого.
  fa.a2.unit24.lesson04.teach.more_incidents:
    title: Улица
    car: null
    I waited: null
    then: null
    gloss: улица, машина, я подождал, потом
    note: С помощью этих слов можно закончить короткий рассказ о происшествии.
    example_gloss:
    - Я переходил улицу.
    - Машина остановилась.
    - Потом я подождал.
  fa.a2.unit24.lesson04.teach.crossing:
    title: Переходим улицу
    gloss: переходить улицу
    note: '*از خیابون رد شدن* значит «переходить улицу».'
    example_gloss: Я переходил улицу, когда машина остановилась.
  fa.a2.unit24.lesson04.teach.incident_pattern:
    title: Фон и прерывание
    gloss: Я ..., когда ... произошло
    note: Для фона используй прошедшее длительное, а после *که* поставь один глагол в простом прошедшем для прерывающего события.
  fa.a2.unit24.lesson05.teach.reading:
    title: Случай в автобусе
    gloss: Вчера я ехал домой на автобусе. В пробке я читал книгу, когда автобус остановился. Я подождал несколько минут. Потом автобус снова поехал.
    note: Прочитай один раз, обращая внимание на фоновые действия, и ещё раз — на единичное прерывающее событие.
  fa.a2.unit24.lesson06.teach.question:
    title: Что ты делал(а)?
    gloss: Что ты делал(а)?
    note: '*داشتی چیکار می‌کردی؟* — так спрашивают одного друга, чем он занимался в какой-то момент в прошлом.'
  fa.a2.unit24.lesson06.teach.turn01:
    title: Сара спрашивает про дождь
    gloss: Вчера, когда начался дождь, что ты делал(а)?
    note: Сара спрашивает о длившемся действии на заднем плане.
  fa.a2.unit24.lesson06.teach.turn02:
    title: Нима отвечает
    gloss: Я шёл (шла) домой. А ты?
    note: Нима отвечает формой длительного прошедшего времени в 1-м лице.
  fa.a2.unit24.lesson06.teach.turn03:
    title: Сара рассказывает об отключении света
    gloss: Я готовила ужин, когда отключили свет.
    note: Сара связывает своё длившееся занятие с одним событием.
  fa.a2.unit24.lesson06.teach.turn04:
    title: Нима спрашивает, что было дальше
    gloss: Что было дальше?
    note: Короткий вопрос двигает рассказ вперёд.
  fa.a2.unit24.lesson06.teach.turn05:
    title: Сара заканчивает рассказ
    gloss: Я подождала несколько минут. Потом свет включили.
    note: Два события в простом прошедшем времени завершают историю.
exercises:
  fa.a2.unit24.lesson01.exercise01.recognize_progressive:
    instruction: Что означает эта форма?
    correct_option: я шёл
    distractors:
    - Я ходил(а) каждый день
    - Я сходил(а) один раз
    - Я иду сейчас
    accepted_answers:
    - value: я шёл
      status: correct
    feedback: '*داشتم می‌رفتم* показывает действие, которое шло в какой-то момент в прошлом.'
  fa.a2.unit24.lesson01.exercise02.recognize_interrupt:
    instruction: Какое значение соответствует персидскому предложению?
    correct_option: Я шёл (шла) домой, когда начался дождь.
    distractors:
    - Я пошёл (пошла) домой после того, как дождь закончился.
    - Я ходил(а) домой всякий раз, когда шёл дождь.
    - Я был(а) дома до того, как начался дождь.
    accepted_answers:
    - value: Я шёл (шла) домой, когда начался дождь.
      status: correct
    feedback: '*داشتم می‌رفتم* — это фон, а *شروع شد* — событие, которое его прервало.'
  fa.a2.unit24.lesson01.exercise03.match_forms:
    instruction: Соедини каждую персидскую форму с её значением.
    accepted_answers:
    - value:
        داشتم می‌رفتم: я шёл
        داشتم می‌خوندم: я читал
        داشتم درست می‌کردم: я готовил
        بارون شروع شد: начался дождь
        اتوبوس وایساد: автобус остановился
        برق رفت: отключили электричество
      status: correct
    feedback: Первые три — длящиеся действия на фоне, последние три — отдельные события.
    pairs:
    - left: داشتم می‌رفتم
      right: я шёл
    - left: داشتم می‌خوندم
      right: я читал
    - left: داشتم درست می‌کردم
      right: я готовил
    - left: بارون شروع شد
      right: начался дождь
    - left: اتوبوس وایساد
      right: автобус остановился
    - left: برق رفت
      right: отключили электричество
  fa.a2.unit24.lesson01.exercise04.order_rain:
    instruction: 'Расставь слова так, чтобы получилось: Я шёл (шла) домой, когда начался дождь.'
    accepted_answers:
    - value:
      - داشتم
      - می‌رفتم
      - خونه
      - که
      - بارون
      - شروع
      - شد
      status: correct
    feedback: '*داشتم می‌رفتم خونه که بارون شروع شد.*'
  fa.a2.unit24.lesson01.exercise05.fill_progressive:
    instruction: Дополни предложение изученной формой прошедшего времени с *می‌* от глагола *رفتن* в 1-м лице.
    accepted_answers:
    - value: می‌رفتم
      status: correct
    feedback: '*داشتم می‌رفتم خونه.*'
  fa.a2.unit24.lesson01.exercise06.translate_rain:
    instruction: 'Переведи на персидский, используя *داشتم + می‌* и *که*: Я шёл (шла) домой, когда начался дождь.'
    accepted_answers:
    - value: داشتم می‌رفتم خونه که بارون شروع شد
      status: correct
    - value: من داشتم می‌رفتم خونه که بارون شروع شد
      status: correct
    feedback: '*داشتم می‌رفتم خونه که بارون شروع شد.*'
  fa.a2.unit24.lesson02.exercise01.recognize_they:
    instruction: Что означает это предложение?
    correct_option: Они уходили.
    distractors:
    - Мы уходили.
    - Они один раз ушли.
    - Они уходили каждый день.
    accepted_answers:
    - value: Они уходили.
      status: correct
    feedback: И *داشتن*, и *می‌رفتن* имеют разговорное окончание 3-го лица множественного числа.
  fa.a2.unit24.lesson02.exercise02.recognize_you:
    instruction: Что означает эта форма, когда говоришь с одним другом?
    correct_option: ты шёл (шла)
    distractors:
    - я шёл
    - он (она) шёл (шла)
    - ты один раз сходил(а)
    accepted_answers:
