    correct_option: Я готовила ужин, когда отключили свет.
    distractors:
    - Я приготовил(а) ужин после того, как включили свет.
    - Я ужинал(а), когда начался дождь.
    - Обычно я готовил(а) ужин без света.
    accepted_answers:
    - value: Я готовила ужин, когда отключили свет.
      status: correct
    feedback: '*داشتم ... می‌کردم* показывает, что приготовление еды шло в тот момент.'
  fa.a2.unit24.lesson04.exercise03.match_incidents:
    instruction: Соедини каждую фразу с её ролью в происшествии.
    accepted_answers:
    - value:
        داشتم می‌رفتم خونه: дорога как фон
        بارون شروع شد: помеха из-за погоды
