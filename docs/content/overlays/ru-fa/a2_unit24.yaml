    instruction: Соедини каждую форму с подлежащим.
    accepted_answers:
    - value:
        داشتم می‌رفتم: من
        داشتی می‌رفتی: تو
        داشت می‌رفت: اون
        داشتیم می‌رفتیم: ما
        داشتن می‌رفتن: اونا
      status: correct
    feedback: Оба глагола согласуются с одним и тем же подлежащим.
    pairs:
    - left: داشتم می‌رفتم
      right: من
    - left: داشتی می‌رفتی
      right: تو
    - left: داشت می‌رفت
      right: اون
    - left: داشتیم می‌رفتیم
      right: ما
    - left: داشتن می‌رفتن
      right: اونا
  fa.a2.unit24.lesson02.exercise04.order_they:
    instruction: 'Расставь слова так, чтобы получилось: Когда я пришёл (пришла), они уходили.'
    accepted_answers:
    - value:
      - وقتی
      - رسیدم
      - اونا
      - داشتن
      - می‌رفتن
      status: correct
    feedback: '*وقتی رسیدم، اونا داشتن می‌رفتن.*'
  fa.a2.unit24.lesson02.exercise05.fill_they:
    instruction: Дополни предложение изученной разговорной формой 3-го лица множественного числа вспомогательного глагола, который образует длительное прошедшее время.
    accepted_answers:
    - value: داشتن
      status: correct
    feedback: '*اونا داشتن می‌رفتن.*'
  fa.a2.unit24.lesson02.exercise06.write_you:
    instruction: 'Напиши по-персидски, используя форму длительного прошедшего времени для одного друга: Ты шёл (шла) домой.'
    accepted_answers:
    - value: داشتی می‌رفتی خونه
      status: correct
    - value: تو داشتی می‌رفتی خونه
      status: correct
    feedback: '*داشتی می‌رفتی خونه.*'
  fa.a2.unit24.lesson03.exercise01.recognize_habit:
    instruction: Что описывает это предложение?
    correct_option: повторяющуюся привычку в прошлом
    distractors:
    - одно действие, шедшее в определённый момент
    - одну завершённую поездку домой
    - план на будущее
    accepted_answers:
    - value: повторяющуюся привычку в прошлом
      status: correct
    feedback: '*هر روز* и простое *می‌رفتم* обозначают повторяющуюся привычку в прошлом.'
  fa.a2.unit24.lesson03.exercise02.recognize_moment:
    instruction: Что описывает это предложение?
    correct_option: действие, шедшее в тот момент
    distractors:
    - повторяющуюся ежедневную привычку
    - одно завершённое прибытие
    - привычку в настоящем
    accepted_answers:
    - value: действие, шедшее в тот момент
      status: correct
    feedback: '*اون لحظه* и *داشتم می‌رفتم* «приближают» одну конкретную сцену.'
  fa.a2.unit24.lesson03.exercise03.match_contrast:
    instruction: Соедини каждую форму с её употреблением или значением.
    accepted_answers:
    - value:
        هر روز می‌رفتم: привычное действие в прошлом
        اون لحظه داشتم می‌رفتم: действие в процессе
        معمولاً می‌خوندم: обычное занятие в прошлом
        داشتم می‌خوندم: чтение в тот момент
        داشتیم می‌رفتیم: мы шли
        داشتن می‌رفتن: они шли
      status: correct
    feedback: Дополнительное *داشتن* обозначает сцену в процессе, а простое прошедшее с *می‌* может обозначать привычку.
    pairs:
    - left: هر روز می‌رفتم
      right: привычное действие в прошлом
    - left: اون لحظه داشتم می‌رفتم
      right: действие в процессе
    - left: معمولاً می‌خوندم
      right: обычное занятие в прошлом
    - left: داشتم می‌خوندم
      right: чтение в тот момент
    - left: داشتیم می‌رفتیم
      right: мы шли
    - left: داشتن می‌رفتن
      right: они шли
  fa.a2.unit24.lesson03.exercise04.order_habit:
    instruction: 'Расставь слова так, чтобы описать привычку в прошлом: Я читал(а) книгу каждый день.'
    accepted_answers:
    - value:
      - هر
      - روز
      - کتاب
      - می‌خوندم
      status: correct
    feedback: '*هر روز کتاب می‌خوندم.*'
  fa.a2.unit24.lesson03.exercise05.fill_moment:
    instruction: Дополни предложение формой 1-го лица прошедшего времени с *می‌* от глагола *رفتن* после *داشتم*.
    accepted_answers:
    - value: می‌رفتم
      status: correct
    feedback: '*اون لحظه داشتم می‌رفتم خونه.*'
  fa.a2.unit24.lesson03.exercise06.translate_contrast:
    instruction: 'Переведи на персидский, используя простое прошедшее с *می‌* для привычки и *داشتم + می‌* для конкретного момента: Я каждый день ходил(а) домой, но в тот момент я читал(а) книгу.'
    accepted_answers:
    - value: هر روز می‌رفتم خونه ولی اون لحظه داشتم کتاب می‌خوندم
      status: correct
    - value: من هر روز می‌رفتم خونه ولی اون لحظه داشتم کتاب می‌خوندم
      status: correct
    feedback: '*هر روز می‌رفتم خونه ولی اون لحظه داشتم کتاب می‌خوندم.*'
  fa.a2.unit24.lesson04.exercise01.recognize_crossing:
    instruction: Какое значение соответствует персидскому предложению?
    correct_option: Я переходил улицу, когда машина остановилась.
    distractors:
    - Я перешёл (перешла) улицу после того, как машина уехала.
