    title: Я
    gloss: я
    note: '*من* означает «я» (повторение). Можно поставить его перед *مهندسم*, *معلمم* или *دکترم*, чтобы получилось более полное предложение: *من مهندسم*.'
    example_gloss: У меня всё хорошо.
