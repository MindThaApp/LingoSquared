  fa.a2.unit45.lesson02.exercise04.order_care:
    instruction: 'Составь из слов предложение: Я забочусь о себе.'
    accepted_answers:
    - value:
      - از
      - خودم
      - مراقبت
      - می‌کنم
      status: correct
    - value:
      - مراقبت
      - می‌کنم
      - از
      - خودم
      status: correct
    feedback: '*از خودم مراقبت می‌کنم*: тот, о ком заботишься, стоит после *از*.'
  fa.a2.unit45.lesson02.exercise05.fill_yourself:
    instruction: 'Допиши фразу для одного друга: Береги себя.'
    accepted_answers:
    - value: خودت
      status: correct
    feedback: 'Полная фраза: *مواظب خودت باش*.'
