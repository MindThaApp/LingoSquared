      right: Я счастлив
    - left: ناراحتم
      right: я расстроен
    - left: خسته‌م
      right: Я устала
    - left: عصبانیم
      right: я злюсь
    - left: نگرانم
      right: я беспокоюсь
    - left: حالم خوبه
      right: я хорошо себя чувствую
    - left: حالم بده
      right: я плохо себя чувствую
    - left: خیلی
      right: очень
  fa.a2.unit45.lesson01.exercise04.order_happy:
    instruction: 'Составь из слов предложение: Сегодня я очень счастлив(а).'
    accepted_answers:
    - value:
      - امروز
      - خیلی
      - خوشحالم
      status: correct
    - value:
      - خیلی
      - خوشحالم
      - امروز
      status: correct
    feedback: '*امروز خیلی خوشحالم*: время, степень, чувство.'
  fa.a2.unit45.lesson01.exercise05.fill_worried:
    instruction: 'Допиши предложение словом, обозначающим чувство: Сегодня я очень волнуюсь.'
    accepted_answers:
    - value: نگرانم
      status: correct
    feedback: 'Полное предложение: *امروز خیلی نگرانم*.'
  fa.a2.unit45.lesson01.exercise06.answer_feeling:
    instruction: 'Ответь по-персидски: скажи, что сегодня тебе плохо.'
    accepted_answers:
    - value: حالم بده
      status: correct
    - value: امروز حالم بده
      status: correct
    - value: من امروز حالم بده
      status: acceptable_with_note
      note: '*من* правильно, но обычно опускается.'
    feedback: 'Образец: *امروز حالم بده.*'
  fa.a2.unit45.lesson01.exercise07.translate_worried:
    instruction: 'Переведи на персидский: Сегодня я немного волнуюсь.'
    accepted_answers:
    - value: امروز یکم نگرانم
      status: correct
    - value: یکم نگرانم امروز
      status: correct
    - value: من امروز یکم نگرانم
      status: acceptable_with_note
      note: '*من* правильно, но обычно опускается.'
    - value: امروز یکم نگران هستم
      status: acceptable_with_note
      note: Это правильно, но звучит более официально, чем разговорное окончание.
    feedback: 'Образец: *امروز یکم نگرانم.*'
  fa.a2.unit45.lesson02.exercise01.recognize_myself:
    instruction: Что означает это предложение?
    correct_option: Я забочусь о себе.
    distractors:
    - Я забочусь о тебе.
    - Он заботится о себе.
    - Мы заботимся о себе.
    accepted_answers:
    - value: Я забочусь о себе.
      status: correct
    feedback: И *خودم*, и *می‌کنم* указывают на «я».
  fa.a2.unit45.lesson02.exercise02.recognize_take_care:
    instruction: Что означает это предложение?
    correct_option: Береги себя.
    distractors:
    - Я берегу себя.
    - Она бережёт себя.
    - Позаботься о ней.
    accepted_answers:
    - value: Береги себя.
      status: correct
    feedback: '*خودت* — «себя» (о тебе); *باش* — дружеское повелительное наклонение.'
  fa.a2.unit45.lesson02.exercise03.match_selves:
