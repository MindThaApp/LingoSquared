    title: Разговор о заботе
teaching:
  fa.a2.unit45.lesson01.teach.time:
    title: Сегодня и степень
    gloss: сегодня, очень, немного
    note: امروز говорит о времени, а *خیلی* и *یکم* показывают степень.
    example_gloss:
    - Сегодня я очень счастлив.
    - Сегодня я немного устала.
  fa.a2.unit45.lesson01.teach.feel:
    title: Чувства
    gloss: я рад, я расстроен, я устал, я зол, я переживаю
    note: 'Разговорное окончание *-م* означает «я»: *خسته‌م* — «я устал».'
    example_gloss:
    - Сегодня я рад.
    - Сегодня я расстроен.
    - Сегодня я устал.
    - Сегодня я зол.
    - Сегодня я переживаю.
  fa.a2.unit45.lesson01.teach.hal:
    title: Как ты себя чувствуешь
    gloss: моё состояние, твоё состояние, хорошо, плохо, как
    note: '*حال* — это состояние, в котором ты находишься: *حالم* — «как я себя чувствую», *حالت* — «как ты себя чувствуешь». *حالم خوبه* значит «я чувствую себя хорошо», *حالم بده* — «мне плохо».'
    example_gloss:
    - Я чувствую себя хорошо.
    - Я плохо себя чувствую.
    - Как ты себя чувствуешь?
  fa.a2.unit45.lesson01.teach.shape:
    title: Два способа сказать, как ты себя чувствуешь
    gloss: Я устал; мне плохо; как ты себя чувствуешь?
    note: 'Можно добавить *-م* к слову, обозначающему чувство (*خسته‌م*, *نگرانم*), или сказать *حالم* и *خوبه* либо *بده*. Чтобы спросить, меняй окончание: *حالت چطوره؟*'
  fa.a2.unit45.lesson02.teach.care:
    title: Забота и «от/о»
    gloss: забота, о / от
    note: '*مراقبت می‌کنم* значит «я забочусь». Тот, о ком ты заботишься, ставится после *از*.'
    example_gloss:
    - Я забочусь о своём друге.
  fa.a2.unit45.lesson02.teach.verbs:
    title: Настоящее время глагола کردن
    gloss: я делаю, ты делаешь, он / она делает, мы делаем, вы делаете, они делают
    note: 'Это разговорные окончания настоящего времени: *-م, -ی, -ه, -یم, -ین, -ن*.'
    example_gloss:
    - Я забочусь.
    - Ты заботишься.
    - Он / она заботится.
    - Мы заботимся.
    - Вы заботитесь.
    - Они заботятся.
  fa.a2.unit45.lesson02.teach.self_sg:
    title: Я сам, ты сам, он / она сам(а)
    gloss: себя (я), себя (ты), себя (он / она)
    note: '*خود* означает «сам, себя». Оно принимает те же окончания, что и другие существительные: *-م* (мой), *-ت* (твой), *-ش* (его / её).'
    example_gloss:
    - Я забочусь о себе.
    - Ты заботишься о себе.
    - Он / она заботится о себе.
  fa.a2.unit45.lesson02.teach.self_pl:
    title: Мы сами, вы сами, они сами
    gloss: себя (мы), себя (вы или вежливо «вы»), себя (они)
    note: В речи окончания множественного числа — *-مون, -تون, -شون*. *خودتون* также вежливая форма для одного человека.
    example_gloss:
    - Мы заботимся о себе.
    - Вы заботитесь о себе.
    - Они заботятся о себе.
  fa.a2.unit45.lesson02.teach.careful:
    title: Береги себя
    gloss: осторожный, будь (одному другу), будьте (нескольким людям или вежливо)
    note: '*مواظب خودت باش* говорят другу, который уходит или плохо себя чувствует. Нескольким людям или из вежливости говорят *مواظب خودتون باشین*.'
    example_gloss:
    - Береги себя.
    - Берегите себя.
  fa.a2.unit45.lesson02.teach.agree:
    title: خود согласуется с подлежащим
    gloss: Я забочусь о себе; ты заботишься о себе
    note: 'Окончание *خود* соответствует подлежащему, как и глагол: *من* сочетается с *خودم* и *می‌کنم*; *تو* — с *خودت* и *می‌کنی*; *ما* — с *خودمون* и *می‌کنیم*.'
  fa.a2.unit45.lesson03.teach.when:
    title: Когда ты это делаешь
    gloss: по утрам, по ночам, каждый день
    note: Окончание *-ها* у слов *صبح* и *شب* даёт значения «по утрам» и «по вечерам / ночам» как привычные действия.
    example_gloss:
    - По утрам я принимаю душ.
    - Вечером я чищу зубы.
    - Каждый день я занимаюсь спортом.
  fa.a2.unit45.lesson03.teach.body:
    title: Умывание и гигиена
    gloss: душ, чистка зубов, мои руки, моё лицо
    note: '*دوش* — это душ, а *مسواک* — зубная щётка; *دست‌هام* — «мои руки», *صورتم* — «моё лицо».'
    example_gloss:
    - Я принимаю душ.
    - Я чищу зубы.
    - Я мою руки.
    - Я умываюсь.
  fa.a2.unit45.lesson03.teach.verbs:
    title: Глаголы ухода за собой
    gloss: я беру, я бью (чищу), я мою
    note: 'В персидском для каждого действия свой глагол: *دوش می‌گیرم* (принимаю душ), *مسواک می‌زنم* (чищу зубы), *می‌شورم* (мою).'
    example_gloss:
    - Я принимаю душ.
    - Я чищу зубы.
    - Я умываюсь.
  fa.a2.unit45.lesson03.teach.rest:
    title: Спорт и отдых
    gloss: спорт, отдых, я сплю, рано
    note: '*ورزش* и *استراحت* сочетаются с *می‌کنم*: *ورزش می‌کنم* и *استراحت می‌کنم*.'
    example_gloss:
    - Я занимаюсь спортом каждый день.
    - Я немного отдыхаю.
    - Я рано ложусь спать.
  fa.a2.unit45.lesson03.teach.light:
    title: Существительное плюс глагол
    gloss: Я принимаю душ; я чищу зубы; я занимаюсь спортом; я отдыхаю
    note: Большинство действий по уходу за собой — это существительное плюс глагол. Существительное не меняется, меняется только глагол по лицу. Для каждого существительного глагол закреплён, поэтому учи их парами.
  fa.a2.unit45.lesson03.teach.ask:
    title: Вопрос «как»
    gloss: Как ты заботишься о себе?
    note: '*چطور* означает «как».'
  fa.a2.unit45.lesson03.teach.phrase:
    title: Забота о себе
    gloss: Я слежу за собой (за внешностью и самочувствием)
    note: '*به خودم می‌رسم* — устойчивое повседневное выражение: ты уделяешь время заботе о себе. Учи его целиком.'
  fa.a2.unit45.lesson04.teach.state:
    title: Готовимся, устаём
    gloss: готовый, усталый, (маркер объекта), я приготовил(а) / я сделал(а)
    note: '*آماده کردم* — «я подготовил(а)», а *خسته کردم* — «я утомил(а)»; с *خودم رو* они означают «я подготовился/подготовилась» и «я утомил(а) себя». *رو* отмечает то, на что направлено действие.'
    example_gloss:
    - Я подготовился.
    - Я себя утомил.
  fa.a2.unit45.lesson04.teach.time:
    title: На этой неделе
    gloss: этот, неделя
    note: '*این هفته* означает «на этой неделе».'
    example_gloss:
    - На этой неделе я сильно устал(а).
  fa.a2.unit45.lesson04.teach.make:
    title: Готовим ужин
    gloss: ужин, готовить, ты приготовил(а)
    note: '*درست کردم* означает «я приготовил(а)»: *شام درست کردم* — «я приготовил(а) ужин».'
    example_gloss:
    - Я сам(а) приготовил(а) ужин.
    - Ты сам(а) это приготовил(а)?
  fa.a2.unit45.lesson04.teach.reflexive:
    title: خود в роли прямого дополнения
    gloss: я подготовился/подготовилась; я себя утомил(а)
    note: 'Когда действие направлено на самого себя, *خود* с личным окончанием получает *رو* и ставится перед глаголом: *خودم رو آماده کردم*. В быстрой речи *خودم رو* часто произносят *خودمو*.'
  fa.a2.unit45.lesson04.teach.emphatic:
    title: خود для усиления
    gloss: я сам(а) приготовил(а) ужин; ты сам(а) приготовил(а)?
    note: '*خود* перед глаголом, без *رو*, подчёркивает, что это сделал именно ты, а не кто-то другой. Предложение строится точно так же, как и без *خودم*.'
  fa.a2.unit45.lesson05.teach.words:
    title: Слова для текста
    gloss: работа, у меня было, я был(а), было, плохой, пятница, сначала, потом, один / какой-то, час, теперь, и
    note: '*بودم* — «я был(а)», *بود* — «было»; *داشتم* — «у меня было».'
    example_gloss:
    - На этой неделе у меня была работа.
    - Я устал(а), и мне было плохо.
    - В пятницу я сначала принял(а) душ.
    - Потом я час отдыхал(а).
    - Теперь я счастлив(а).
  fa.a2.unit45.lesson05.teach.reading:
    title: Неделя и пятница
    gloss: На этой неделе у меня было очень много работы. Я устал(а), и мне было плохо. В пятницу я позаботился/позаботилась о себе. Сначала я принял(а) душ. Потом час отдыхал(а). Теперь я счастлив(а), и мне хорошо.
    note: Прочитай один раз, обращая внимание на чувства, а потом ещё раз — на то, что сделал говорящий, чтобы почувствовать себя лучше.
  fa.a2.unit45.lesson06.teach.turn01:
    title: Сара спрашивает, как себя чувствует Нима
    gloss: 'Сара: Нима, как ты себя чувствуешь?'
    note: '*حالت چطوره؟* — так спрашивают, как ты себя чувствуешь.'
  fa.a2.unit45.lesson06.teach.turn02:
    title: Нима говорит, что устал
    gloss: 'Нима: Я очень устал. На этой неделе я себя вымотал.'
    note: '*خودم رو خسته کردم* показывает возвратную конструкцию.'
  fa.a2.unit45.lesson06.teach.turn03:
    title: Сара даёт совет
    gloss: 'Сара: Тебе нужно заботиться о себе.'
    note: '*باید* вместе с *کنی* выражает, что кому-то нужно сделать.'
  fa.a2.unit45.lesson06.teach.turn04:
    title: Нима рассказывает о своём распорядке
    gloss: 'Нима: Да. По утрам я принимаю душ, но спортом не занимаюсь.'
    note: '*ولی* означает «но»; *نمی‌کنم* — отрицательная форма от *می‌کنم*.'
  fa.a2.unit45.lesson06.teach.turn05:
    title: 'Сара говорит: береги себя'
    gloss: 'Сара: Береги себя! Отдохни немного.'
    note: '*استراحت کن* — дружеский повелительный наклонение: убери *می‌* и личное окончание.'
  fa.a2.unit45.lesson06.teach.turn06:
    title: Нима соглашается
    gloss: 'Нима: Хорошо. Сегодня вечером лягу спать пораньше.'
    note: '*باشه* означает «хорошо», «ладно».'
exercises:
  fa.a2.unit45.lesson01.exercise01.recognize_tired:
    instruction: Что означает это предложение?
    correct_option: Сегодня я очень устал(а).
    distractors:
    - Вчера я очень устал(а).
    - Сегодня я немного устала.
    - Сегодня я очень волнуюсь.
    accepted_answers:
    - value: Сегодня я очень устал(а).
      status: correct
    feedback: '*خیلی* означает «очень», а *خسته‌م* — «я устал(а)».'
  fa.a2.unit45.lesson01.exercise02.recognize_bad:
    instruction: Что означает это предложение?
    correct_option: Я плохо себя чувствую.
    distractors:
    - Я чувствую себя хорошо.
    - Я злюсь.
    - Как ты себя чувствуешь?
    accepted_answers:
    - value: Я плохо себя чувствую.
      status: correct
    feedback: '*حالم بده* означает «мне плохо».'
  fa.a2.unit45.lesson01.exercise03.match_feelings:
