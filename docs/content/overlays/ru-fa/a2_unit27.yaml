teaching:
  fa.a2.unit27.lesson01.teach.time_words:
    title: Слова о времени для планов
    gloss: завтра, выходные, на следующей неделе, в следующем месяце, в следующем году, сегодня, сейчас
    note: '*هفته‌ی بعد*, *ماه دیگه* и *سال دیگه* — обычные способы сказать «на следующей неделе / в следующем месяце / в следующем году». *آخر هفته* — «выходные»; о каких именно выходных речь, понятно из контекста.'
    example_gloss:
    - Завтра у меня занятие.
    - В следующем месяце я уезжаю в путешествие.
    - В следующем году у меня будет новый дом.
  fa.a2.unit27.lesson01.teach.course_house:
    title: Курсы и переезд
    gloss: курс, занятие, язык, регистрация, дом, коробка
    note: '*ثبت‌نام* означает «регистрация / запись». Эти слова пригодятся для языкового курса Сары и переезда Нимы.'
    example_gloss:
    - У меня языковой курс.
    - У меня языковое занятие.
    - У меня есть коробки.
  fa.a2.unit27.lesson01.teach.plan_verbs:
    title: Глаголы для планов
    gloss: я иду, я начинаю, я записываюсь, я переезжаю, я покупаю коробки
    note: '*خونه عوض کردن* — разговорный способ сказать «переехать» (буквально «сменить дом»).'
    example_gloss:
    - Завтра я иду на занятия.
    - На следующей неделе я начинаю занятия.
    - Завтра я записываюсь.
    - В следующем месяце я переезжаю.
    - Завтра я покупаю коробки.
  fa.a2.unit27.lesson01.teach.things_to_buy:
    title: Что можно купить
    gloss: ковёр, штора, торт
    note: Эти повседневные существительные пригодятся, когда ты говоришь о делах и о том, что собираешься купить.
    example_gloss:
    - Завтра я покупаю ковёр.
    - Завтра я покупаю шторы.
    - Завтра я покупаю торт.
  fa.a2.unit27.lesson01.teach.places_and_events:
    title: Места и события
    gloss: ресторан, кафе, вечеринка
    note: '*مهمونی* — обычная разговорная форма слова «вечеринка».'
    example_gloss:
    - Завтра я иду в ресторан.
    - Завтра я иду в кафе.
    - В выходные у меня вечеринка.
  fa.a2.unit27.lesson01.teach.present_for_future:
    title: Настоящее время может означать план
    gloss: Завтра я иду; на следующей неделе начинаю
    note: В разговорном персидском для плана используется обычное настоящее время (*می‌رم*, *شروع می‌کنم*). Слово со значением времени, например *فردا* или *هفته‌ی بعد*, показывает, что действие относится к будущему. В повседневной речи отдельного глагола будущего времени нет.
  fa.a2.unit27.lesson02.teach.i_want:
    title: Я хочу, ты хочешь
    gloss: я хочу, ты хочешь, один/какой-то
    note: '*یه* — обычное разговорное «один / какой-то». *تو چی می‌خوای؟* значит «Что ты хочешь?»'
    example_gloss:
    - Я хочу купить дом.
    - Что ты хочешь?
  fa.a2.unit27.lesson02.teach.short_verbs:
    title: Краткие глагольные формы
    gloss: пойти, купить, начать, записаться, найти, выучить
    note: 'Это краткие глагольные формы, которые идут после *می‌خوام*. В составных глаголах меняется вторая часть: *شروع کنم*, *ثبت‌نام کنم*, *پیدا کنم*.'
    example_gloss:
    - Я хочу пойти на занятие.
    - Я хочу купить коробки.
    - Я хочу найти дом.
    - Я хочу выучить язык.
  fa.a2.unit27.lesson02.teach.want_plus_short:
    title: می‌خوام + краткий глагол
    gloss: Я хочу пойти; я хочу купить; я хочу начать
    note: 'Чтобы сказать, что ты хочешь или собираешься сделать, используй *می‌خوام* и краткую форму глагола. У второго глагола нет *می‌*: говори *می‌خوام برم*, а не *می‌خوام می‌رم*. Окончание второго глагола соответствует тому, кто хочет.'
  fa.a2.unit27.lesson02.teach.person_endings:
    title: Второй глагол согласуется с лицом
    gloss: Я хочу пойти; ты хочешь пойти; он/она хочет пойти
    note: 'Краткий глагол меняется по лицам: *برم* (я), *بری* (ты), *بره* (он/она). Так же работают *بخرم / بخری / بخره*. В этом уроке ты в основном строишь формы с *من*.'
  fa.a2.unit27.lesson03.teach.habit_words:
    title: Слова для привычек
    gloss: каждый день, каждую неделю, всегда, обычно
    note: Эти слова показывают повторяющееся действие. Глагол стоит в той же форме настоящего времени, что и в плане; слово со значением времени подсказывает, какое значение имеется в виду.
    example_gloss:
    - Я хожу на занятия каждый день.
    - Я всегда хожу на занятия.
    - Обычно я сижу дома.
    - У меня занятия два дня каждую неделю.
  fa.a2.unit27.lesson03.teach.habit_vs_plan:
    title: Тот же глагол, другое слово времени
    gloss: Я хожу каждый день; завтра я иду
    note: '*می‌رم* может означать привычку или план. *هر روز* и *همیشه* делают его привычкой; *فردا*, *هفته‌ی بعد* и *ماه دیگه* делают его планом. Всегда сначала смотри на слово со значением времени.'
  fa.a2.unit27.lesson03.teach.plan_vs_want:
    title: План или намерение?
    gloss: Завтра я иду; я хочу пойти
    note: '*فردا می‌رم* сообщает о плане со словом времени. *می‌خوام برم* говорит о желании или намерении и не требует слова времени. Помни: после *می‌خوام* второй глагол теряет *می‌*.'
  fa.a2.unit27.lesson03.teach.decided:
    title: Решил, намерен
    gloss: я решил(а), я намерен(а)
    note: '*تصمیم گرفتم* и *قصد دارم* — ещё два способа сказать о намерении. После обоих идёт краткая форма глагола.'
    example_gloss:
    - Я решил переехать.
    - Я намерен выучить язык.
  fa.a2.unit27.lesson03.teach.decided_plus_short:
    title: تصمیم گرفتم + краткий глагол
    gloss: Я решил пойти; я решил начать
    note: '*گرفتم* стоит в прошедшем времени, потому что решение уже принято, но следующий за ним глагол имеет краткую форму (*برم*, *شروع کنم*), потому что действие ещё впереди. Не добавляй к нему *می‌*.'
  fa.a2.unit27.lesson04.teach.plan_questions:
    title: Вопросы о планах
    gloss: Что ты делаешь завтра? Что ты хочешь делать? А ты?
    note: О плане спрашивают в настоящем времени со словом времени. О намерении спрашивают с помощью *می‌خوای ... کنی؟*.
    example_gloss:
    - Что ты делаешь в выходные?
    - Что ты хочешь делать в следующем году?
    - Я начинаю занятия; а ты?
  fa.a2.unit27.lesson04.teach.answer_mirrors_question:
    title: Ответ повторяет вопрос
    gloss: ты делаешь → я делаю; ты хочешь сделать → я хочу сделать
    note: 'На вопрос о плане отвечай настоящим временем и тем же словом времени: *فردا جعبه می‌خرم*. На вопрос о намерении отвечай с *می‌خوام* и краткой формой глагола, у которой окончание меняется с «ты» на «я»: *می‌خوای چیکار کنی؟* превращается в *می‌خوام ... کنم*.'
  fa.a2.unit27.lesson05.teach.reading_words:
    title: Слова для сообщения
    gloss: привет, работа, я не иду, поездка
    note: '*نمی‌رم* — отрицание от *می‌رم*: «я не иду / я не хожу». *برم سفر* значит «поехать в поездку».'
    example_gloss:
    - Привет, Сара!
    - Я хожу на работу каждый день.
    - Завтра я не иду на занятие.
    - В следующем году я еду в путешествие.
  fa.a2.unit27.lesson05.teach.reading:
    title: Сообщение от Нимы
    gloss: Привет, Сара! Я хожу на работу каждый день, но завтра не пойду. Завтра покупаю коробки. В следующем месяце переезжаю. Я решил поехать в путешествие в следующем году.
    note: Прочитай один раз и найди привычку, ближайшие планы и более отдалённое намерение.
  fa.a2.unit27.lesson06.teach.nice:
    title: Какая хорошая новость!
    gloss: как здорово
    note: '*چه خوب!* — дружелюбная реакция на чьи-то планы.'
    example_gloss:
    - Как здорово! Ты записываешься завтра?
  fa.a2.unit27.lesson06.teach.turn01:
    title: Сара спрашивает о завтрашнем дне
    gloss: 'Сара спрашиваетНиму: Что ты делаешь завтра?'
    note: В вопросе используется настоящее время и слово времени.
  fa.a2.unit27.lesson06.teach.turn02:
    title: Нима называет два плана
    gloss: 'Нима: Завтра покупаю коробки. В следующем месяце переезжаю. А ты?'
    note: Два плана и два слова времени.
  fa.a2.unit27.lesson06.teach.turn03:
    title: Сара рассказывает о своих планах
    gloss: 'Сара: Завтра я записываюсь. На следующей неделе начинаю языковые курсы.'
    note: '*من* здесь произносится, чтобы ответить на *تو چی؟*.'
  fa.a2.unit27.lesson06.teach.turn04:
    title: Нима спрашивает о намерениях
    gloss: 'Нима: Как здорово! Что ты хочешь делать в следующем году?'
    note: В вопросе используется *می‌خوای ... کنی؟*.
  fa.a2.unit27.lesson06.teach.turn05:
    title: Сара говорит о своём решении
    gloss: 'Сара: Я решила выучить язык. А ты?'
    note: После *تصمیم گرفتم* идёт краткая форма глагола.
  fa.a2.unit27.lesson06.teach.turn06:
    title: Нима говорит о своём намерении
    gloss: 'Нима: Я хочу поехать в путешествие.'
    note: '*می‌خوام برم* выражает намерение.'
