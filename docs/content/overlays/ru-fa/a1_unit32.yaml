    example_gloss: Мыть посуду — моя обязанность.
  fa.a1.unit32.lesson01.teach.lebas_shostan:
    title: Стирка
    gloss: стирка
    note: '*لباس شستن* буквально значит «мыть одежду» — так в повседневной речи говорят о стирке.'
    example_gloss: Стирать сегодня — моя обязанность.
  fa.a1.unit32.lesson01.teach.tamiz_kardan:
    title: Уборка
    gloss: уборка
    note: '*تمیز کردن* значит «убирать, чистить».'
    example_gloss: Я убираю комнату.
  fa.a1.unit32.lesson01.teach.jaru_zadan:
    title: Подметание
    gloss: подметание
    note: '*جارو زدن* значит «подметать» или «пылесосить» — в зависимости от дома и инструмента.'
    example_gloss: Я подметаю дом.
  fa.a1.unit32.lesson01.teach.review_house_words:
    title: Дом / комната / дело / мой, я / и
    gloss: дом / комната / дело / я, мой / и
    note: Слова *خونه*, *اتاق*, *کار*, *من* и *و* встречались в прошлых уроках и снова появляются здесь.
    target_text: خونه (дом) / اتاق (комната) / کار (работа, дело) / من (я, мой) / و (и)
  fa.a1.unit32.lesson01.teach.review_object_marker:
    title: Показатель прямого объекта / я делаю / нужно
    gloss: показатель прямого дополнения / я делаю / нужно
    note: '*رو* отмечает прямое дополнение; *می‌کنم* значит «я делаю»; *باید* значит «должен» или «нужно».'
    target_text: رو (показатель прямого дополнения) / می‌کنم (я делаю) / باید (должен, нужно)
  fa.a1.unit32.lesson01.teach.need_clean_room:
    title: Мне нужно убрать комнату
    gloss: Мне нужно убрать комнату
    note: '*باید اتاق رو تمیز کنم* — прямая и полезная фраза о домашних делах.'
  fa.a1.unit32.lesson02.teach.review_questions:
    title: Что / когда / сегодня
    gloss: что / когда / сегодня
    note: '*چی*, *کِی* и *امروز* — повторение вопросительных слов и слов времени.'
    target_text: چی (что) / کِی (когда) / امروز (сегодня)
  fa.a1.unit32.lesson02.teach.mikoni_pattern:
    title: Я делаю → ты делаешь
    gloss: я делаю -> ты делаешь
    note: '*می‌کنی* — разговорная форма «ты делаешь», параллельная к *می‌کنم* по образованию: меняется только окончание.'
    target_text: می‌کنم (я делаю) -> می‌کنی (ты делаешь, неформально)
  fa.a1.unit32.lesson02.teach.question_what_chore:
    title: Что ты делаешь сегодня?
    gloss: Что ты делаешь сегодня?
