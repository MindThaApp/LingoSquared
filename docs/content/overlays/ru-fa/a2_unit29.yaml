teaching:
  fa.a2.unit29.lesson01.teach.places:
    title: Правила и места
    gloss: правила, домашние правила, библиотека, бассейн, спортзал
    note: '*قانون* — это правило. У дома, библиотеки, бассейна и спортзала есть свои *قانون‌ها* (правила).'
    example_gloss:
    - В библиотеке есть правила.
    - В бассейне и в спортзале тоже есть правила.
    - В доме тоже есть правила.
  fa.a2.unit29.lesson01.teach.must:
    title: 'باید: что-то обязательно'
    gloss: тебе нужно идти; тебе нужно принять душ; тебе нужно принести карту
    note: '*باید* + сослагательная форма (субъюнктив) = «должен / нужно». Глагол после *باید* стоит в форме субъюнктива (*بری*, *بگیری*, *بیاری*), без *می‌*.'
  fa.a2.unit29.lesson01.teach.must_not:
    title: 'نباید: что-то запрещено'
    gloss: тебе нельзя есть; тебе нельзя кричать
    note: '*نباید* + субъюнктив = «нельзя». Так говорят, что действие запрещено. Глагол после него стоит в утвердительной форме: *بخوری*, *بزنی*.'
  fa.a2.unit29.lesson01.teach.not_needed:
    title: 'لازم نیست: это необязательно'
    gloss: тебе не нужно приходить; тебе не нужно платить
    note: '*لازم نیست* + субъюнктив = «не нужно». Действие необязательно, но и не запрещено.'
  fa.a2.unit29.lesson02.teach.rule_phrases:
    title: Фразы для правил
    gloss: вести себя тихо, вернуть книгу, принести полотенце, надеть спортивную обувь, бегать
    note: Каждая фраза — это субъюнктив с окончанием *-ی* для друга («ты»). Используй её после *باید* или *نباید*.
    example_gloss:
    - Ты должен вести себя тихо.
    - Ты должен вернуть книгу.
    - Ты должен надеть спортивную обувь.
  fa.a2.unit29.lesson02.teach.where:
    title: Где и когда действует правило
    gloss: в библиотеке, в бассейне, в спортзале, перед бассейном
    note: '*توی* значит «в», а *قبل از* — «перед». Обычно они стоят в начале правила.'
    example_gloss:
    - В библиотеке нужно вести себя тихо.
    - Перед бассейном нужно принять душ.
    - В спортзале нужно надевать спортивную обувь.
  fa.a2.unit29.lesson02.teach.polite:
    title: 'Незнакомые люди и объявления: окончание для «вы»'
    gloss: вы должны вести себя тихо (вежливо или во мн. числе); вы должны принять душ (вежливо или во мн. числе)
    note: 'Когда обращаются к незнакомым, официальным лицам или к нескольким людям, окончание *-ی* меняется на *-ید*: *باشی* → *باشید*, *بگیری* → *بگیرید*. В объявлениях используется эта форма.'
  fa.a2.unit29.lesson02.teach.no_mi:
    title: После باید нет می‌
    gloss: тебе нужно идти; тебе нельзя идти
    note: После *باید*, *نباید* и *لازم نیست* глагол стоит в простой форме субъюнктива (*بری*), а не в форме настоящего времени с *می‌*.
  fa.a2.unit29.lesson03.teach.contrast:
    title: نباید — это не لازم نیست
    gloss: тебе нельзя приходить; тебе не нужно приходить
    note: Как и в русском («нельзя» и «не нужно»), эти значения различаются. *نباید بیای* = приходить запрещено. *لازم نیست بیای* = ты можешь прийти, но не обязан.
  fa.a2.unit29.lesson03.teach.notice_form:
    title: 'Объявления: ممنوعه'
    gloss: есть запрещено; бегать запрещено
    note: 'В знаках и объявлениях часто называют действие и добавляют *ممنوعه* («запрещено»): *غذا خوردن ممنوعه*. Другу ты скажешь *نباید غذا بخوری*.'
  fa.a2.unit29.lesson03.teach.extra_rules:
    title: Ещё два правила
    gloss: купить билет, помыть посуду
    note: 'В упражнениях эти выражения идут после *لازم نیست*: ты можешь это сделать, но это не обязательно.'
    example_gloss:
    - Тебе не нужно покупать билет.
    - Тебе не нужно мыть посуду.
    - В бассейне нельзя есть.
  fa.a2.unit29.lesson04.teach.permission:
    title: Просьба о разрешении
    gloss: Можно войти? Ничего, если я здесь сяду?
    note: '*می‌تونم* + сослагательная форма (субжонктив) значит «Можно мне?» (*می‌تونم بیام؟*). *مشکلی نداره* + субжонктив значит «Ничего, если…?» (*مشکلی نداره بشینم؟*).'
  fa.a2.unit29.lesson04.teach.answers:
    title: Ответ на вопрос о разрешении
    gloss: Да, можно. Нет, нельзя. Да, без проблем. Нет, это запрещено.
    note: Чтобы сказать «да», используй *آره، می‌تونی* или *آره، مشکلی نداره*. Чтобы сказать «нет», используй *نه، نمی‌تونی* или *نه، ممنوعه*.
  fa.a2.unit29.lesson04.teach.ejaze:
    title: Ещё один вежливый вопрос
    gloss: Разрешите войти?
    note: '*اجازه هست؟* — вежливый способ спросить, можно ли что-то сделать. В этом уроке его нужно только узнавать.'
  fa.a2.unit29.lesson04.teach.house:
    title: 'Правила дома: сортировка мусора'
    gloss: сортировать мусор, бросить пластик в контейнер для бумаги
    note: '*زباله رو جدا کردن* значит «сортировать мусор». Правило гласит, что пластик нельзя бросать в контейнер для бумаги.'
    example_gloss:
    - Ты должен сортировать мусор.
    - Нельзя бросать пластик в контейнер для бумаги.
  fa.a2.unit29.lesson04.teach.night:
    title: Правило тишины
    gloss: Ночью нельзя громко разговаривать
    note: '*بلند حرف زدن* значит «громко разговаривать». *شب* («ночью») стоит в начале.'
    example_gloss:
    - Ночью нельзя громко разговаривать.
  fa.a2.unit29.lesson05.teach.notice:
    title: Объявление с правилами
    gloss: Правила. В библиотеке нужно соблюдать тишину. Есть запрещено. Перед бассейном нужно принять душ. В бассейне бегать запрещено. В спортзале нужно надевать спортивную обувь, но полотенце приносить не обязательно. Мусор нужно сортировать.
    note: Объявление обращено к незнакомым людям, поэтому в нём используется окончание *-ید*. Прочитай один раз и найди, что обязательно, что запрещено, а что не обязательно.
  fa.a2.unit29.lesson06.teach.turn01:
    title: Сара просит разрешения
    gloss: Сара спрашивает, можно ли ей тоже прийти в бассейн.
    note: '*مشکلی نداره* + субжонктив — просьба о разрешении.'
  fa.a2.unit29.lesson06.teach.turn02:
    title: Разрешение и требование
    gloss: Нима отвечает «да» и говорит, что сначала она должна принять душ.
    note: Ответ сначала разрешает, а потом добавляет обязанность.
  fa.a2.unit29.lesson06.teach.turn03:
    title: Сара спрашивает, что обязательно
    gloss: Сара спрашивает, нужно ли ей принести полотенце.
    note: '*باید* + *بیارم* — вопрос об обязанности.'
  fa.a2.unit29.lesson06.teach.turn04:
    title: Не обязательно и запрещено
    gloss: Нима говорит, что полотенце приносить не нужно, но в бассейне нельзя бегать.
    note: '*لازم نیست* — не обязательно; *نباید* — запрещено.'
  fa.a2.unit29.lesson06.teach.turn05:
    title: Второй вопрос
    gloss: Сара спрашивает, можно ли ей потом прийти в спортзал.
    note: '*می‌تونم* + субжонктив значит «Можно мне?»'
  fa.a2.unit29.lesson06.teach.turn06:
    title: Последнее правило
    gloss: Нима говорит «да», но ей нужно надеть спортивную обувь.
    note: 'И снова: сначала разрешение, потом правило.'
