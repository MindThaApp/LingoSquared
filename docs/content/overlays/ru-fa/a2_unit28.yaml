teaching:
  fa.a2.unit28.lesson01.teach.weather_words:
    title: Слова для прогноза погоды
    gloss: завтра, погода, дождь, снег, холодный, тёплый, солнечный
    note: '*بارون* — разговорная форма слова «дождь»; в аккуратной письменной речи пишут *باران*. *آفتابیه* значит «солнечно».'
    example_gloss:
    - Завтра будет солнечно.
    - Завтра будет дождь.
    - Завтра будет снег.
  fa.a2.unit28.lesson01.teach.forecast_verbs:
    title: Два глагола для прогноза
    gloss: идёт (дождь), становится
    note: '*می‌باره* значит «идёт дождь/снег». *می‌شه* значит «становится» и употребляется с прилагательным: *سرد می‌شه* = «похолодает».'
    example_gloss:
    - Завтра похолодает.
    - Завтра потеплеет.
  fa.a2.unit28.lesson01.teach.present_for_future:
    title: Разговорное настоящее время для будущего
    gloss: Завтра будет дождь. Завтра похолодает.
    note: 'Говоря о будущем, иранцы используют обычное настоящее время и слово со значением времени. *فردا بارون می‌باره* — «Завтра будет дождь». В разговорной речи нет отдельного будущего времени: *فردا* показывает, что речь о будущем.'
  fa.a2.unit28.lesson02.teach.possibility_words:
    title: «Возможно» и «вероятно»
    gloss: возможно, вероятно, Нима, Сара
    note: '*شاید* значит «возможно», а *احتمالا* — «вероятно». Нима и Сара — постоянные друзья-герои курса.'
    example_gloss:
    - Возможно, Нима придёт.
    - Скорее всего, будет дождь.
  fa.a2.unit28.lesson02.teach.subjunctive_verbs:
    title: Глаголы после شاید
    gloss: он/она/оно приходит, он/она/оно не приходит, становится
    note: 'После *شاید* глагол стоит в сослагательной форме (конъюнктив): *بیاد* (придёт), *نیاد* (не придёт), *بشه* (станет). В этой форме есть *ب-* и нет *می‌*.'
    example_gloss:
    - Возможно, будет дождь.
    - Возможно, дождя не будет.
    - Возможно, похолодает.
  fa.a2.unit28.lesson02.teach.shayad_note:
    title: شاید + конъюнктив
    gloss: Возможно, будет дождь. Возможно, похолодает. Возможно, дождя не будет.
    note: '*شاید* используется, когда что-то лишь возможно. Глагол стоит в конъюнктиве, без *می‌*: *شاید بارون بیاد*. Отрицание: *شاید بارون نیاد*. Сравни с простым прогнозом *بارون می‌باره*, где есть *می‌*.'
  fa.a2.unit28.lesson02.teach.ehtemalan_note:
    title: احتمالا + настоящее время
    gloss: Скорее всего, будет дождь. Скорее всего, похолодает.
    note: '*احتمالا* используется, когда что-то вероятно. Глагол остаётся в обычном настоящем времени, как и в простом прогнозе: *احتمالا بارون می‌باره*. Степень уверенности меняет одно лишь слово *احتمالا*.'
  fa.a2.unit28.lesson03.teach.negative_forecast:
    title: Отрицательный прогноз
    gloss: дождя нет
    note: '*نمی‌باره* — отрицание к *می‌باره*: *فردا بارون نمی‌باره* = «Завтра дождя не будет».'
    example_gloss:
    - Завтра дождя не будет.
    - Завтра, скорее всего, дождя не будет.
  fa.a2.unit28.lesson03.teach.certainty_contrast:
    title: Наверняка, вероятно или возможно?
    gloss: Будет дождь. Скорее всего, будет дождь. Возможно, будет дождь.
    note: 'Три степени уверенности. Простой прогноз: *بارون می‌باره* (настоящее время, *می‌*). Вероятно: *احتمالا بارون می‌باره* (настоящее время, *می‌*). Лишь возможно: *شاید بارون بیاد* (конъюнктив, без *می‌*). Не употребляй здесь *شاید* с обычным *می‌باره*.'
  fa.a2.unit28.lesson03.teach.negative_contrast:
    title: Отрицания рядом
    gloss: Дождя не будет. Возможно, дождя не будет.
    note: 'Простое отрицание: *نمی‌باره* (настоящее время, *نمی‌*). Возможное отрицание: *شاید بارون نیاد* (конъюнктив *نیاد*). В обоих есть *ن-*, но только во втором нет *می‌*.'
  fa.a2.unit28.lesson04.teach.promise_words:
    title: Слова для обещаний
    gloss: обещаю, обязательно, поздно, звонок, помогу тебе, так, ты не (будешь)
    note: '*قول می‌دم* = «обещаю». *حتما* = «обязательно». *زنگ* с *زدن* — «позвонить». *کمکت* — это *کمک* + *ت*, «помощь тебе». *دیر* = «поздно».'
    example_gloss:
    - Обязательно позвоню.
    - Обещаю помочь тебе.
  fa.a2.unit28.lesson04.teach.promise_verbs:
    title: Глаголы для обещаний
    gloss: я не делаю (конъюнктив), я позвоню (конъюнктив), я делаю (конъюнктив), я приду (конъюнктив), я звоню, ты звонишь
    note: 'После *قول می‌دم* глагол стоит в конъюнктиве: *نکنم*, *بزنم*, *کنم*, *بیام*. Обычное настоящее время *می‌زنم* употребляется с *حتما*.'
    example_gloss:
    - Обещаю, что не опоздаю.
    - Обещаю позвонить.
    - Обещаю прийти.
  fa.a2.unit28.lesson04.teach.promise_note:
    title: قول می‌دم + конъюнктив
    gloss: Обещаю, что не опоздаю. Обещаю позвонить. Обещаю прийти.
    note: 'Обещание — это *قول می‌دم* и глагол в конъюнктиве (без *می‌*): *قول می‌دم دیر نکنم*. Отрицание *ن-* ставится перед глаголом в конъюнктиве. Будущее время здесь не употребляется: конъюнктив говорит о том, что ты обязуешься сделать.'
  fa.a2.unit28.lesson04.teach.hatman_note:
    title: حتما + настоящее время, شاید + конъюнктив
    gloss: Обязательно позвоню. Возможно, я позвоню.
    note: Для твёрдого обещания можно сказать *حتما زنگ می‌زنم* (настоящее время с *می‌*). Если ты не уверен, скажи *شاید زنگ بزنم* (конъюнктив, без *می‌*). Это то же противопоставление, что и в прогнозе погоды.
  fa.a2.unit28.lesson05.teach.message_words:
    title: Слова для сообщения
    gloss: привет, после, от, работа, встреча, у нас есть, последний, неделя, тебе, и, но, час, десять, тоже, как
    note: '*قرار داریم* значит «мы договорились о встрече». *بعد از کار* — «после работы». *آخر هفته* — «выходные». *بهت* — разговорное «тебе».'
    example_gloss:
    - Завтра после работы мы договорились встретиться.
    - В выходные будет солнечно.
    - Я обязательно тебе позвоню.
  fa.a2.unit28.lesson05.teach.bulletin_words:
    title: Слова из сводок и объявлений
    gloss: метеорология, дождь (письменное), облачный, объявление, офис, закрытый, будет (вспомогательное), был/быть, шёл дождь, стал
    note: Эти слова относятся к письменным сводкам погоды и объявлениям. *باران* — письменная форма разговорного *بارون*. *خواهد* — письменное «будет» в сочетаниях *خواهد بود* и *خواهد شد*.
    example_gloss:
    - Объявление о погоде
    - Завтра офис будет закрыт.
  fa.a2.unit28.lesson05.teach.formal_future_note:
    title: Письменное будущее время с خواهد (только для узнавания)
    gloss: Станет облачно. Будет дождь. Офис будет закрыт.
    note: 'Только письменная/официальная речь. В сводках погоды и объявлениях используется письменное будущее время: *خواهد* + краткая форма глагола, например *خواهد شد* (станет), *خواهد بارید* (будет дождь), *خواهد بود* (будет). Тебе нужно лишь узнавать эти формы при чтении. В речи и в сообщениях друзьям говори *می‌شه*, *می‌باره*, *هست*; сам *خواهد* не употребляй.'
  fa.a2.unit28.lesson05.teach.reading_message:
    title: Сообщение от Сары
    gloss: Привет, Нима! Завтра после работы мы договорились встретиться. Завтра похолодает и, скорее всего, будет дождь. Возможно, в выходные пойдёт снег. Обещаю, что не опоздаю, и обязательно тебе позвоню.
    note: Прочитай сначала ради простого прогноза, потом ради того, что лишь вероятно или возможно, а затем ради обещания.
  fa.a2.unit28.lesson05.teach.reading_bulletin:
    title: Сводка погоды
    gloss: 'Сводка погоды: завтра будет облачно и пойдёт дождь. В выходные будет холодно.'
    note: Это письменная сводка. Формы с *خواهد* нужны только для узнавания.
  fa.a2.unit28.lesson06.teach.turn01:
    title: Сара спрашивает о завтрашнем дне
    gloss: 'Сара спрашивает Ниму: Какая завтра будет погода?'
    note: Вопрос просит предсказания.
  fa.a2.unit28.lesson06.teach.turn02:
    title: Нима предсказывает
    gloss: 'Нима: Скорее всего, будет дождь. Может быть, ещё и снег пойдёт.'
    note: '*احتمالا* — «вероятно»; *شاید* — «возможно», лишь допускает.'
  fa.a2.unit28.lesson06.teach.turn03:
    title: Сара проверяет планы
    gloss: 'Сара: Завтра в десять мы договорились встретиться. Ты ведь не опоздаешь?'
    note: Сара просит подтвердить обещание вопросом *دیر نمی‌کنی؟*
  fa.a2.unit28.lesson06.teach.turn04:
    title: Нима обещает
    gloss: 'Нима: Обещаю, что не опоздаю.'
    note: '*قول می‌دم* + сослагательное наклонение (конъюнктив).'
  fa.a2.unit28.lesson06.teach.turn05:
    title: Сара спрашивает про звонок
    gloss: 'Сара: Так ты позвонишь?'
    note: Настоящее время с *می‌* спрашивает о твёрдом плане.
  fa.a2.unit28.lesson06.teach.turn06:
    title: Нима подтверждает
    gloss: 'Нима: Обязательно позвоню.'
    note: '*حتما* + настоящее время даёт твёрдое обещание.'
