course:
  title: Персидский A2
  description: 'Персидский (Иран) уровня выше начального: возврат бракованной покупки — объяснить, что не так, прочитать объявление магазина об условиях возврата и выбрать между обменом и возвратом денег.'
units:
  fa.a2.unit18.shopping_complaint:
    title: Жалоба в магазине
lessons:
  fa.a2.unit18.lesson01.shopping_complaint_vocabulary:
    title: 'Возврат товара: слова'
  fa.a2.unit18.lesson02.explaining_the_problem:
    title: Объясняем проблему
  fa.a2.unit18.lesson03.reading_a_return_policy:
    title: Читаем условия возврата
  fa.a2.unit18.lesson04.shop_return_counter_dialogue:
    title: У стойки возврата
teaching:
  fa.a2.unit18.lesson01.teach.broken_word:
    title: Сломанный
    gloss: сломанный
    note: '*خراب* — общее слово для «сломанный, неисправный»; *خرابه* — его разговорная форма (*خراب* + *است*).'
    example_gloss: Эти наушники сломаны.
  fa.a2.unit18.lesson01.teach.receipt_word:
    title: Квитанция
    gloss: квитанция
    note: '*رسید* — слово для чека о покупке.'
    example_gloss: Я потерял чек.
  fa.a2.unit18.lesson01.teach.return_item_note:
    title: Вернуть товар (составной глагол)
    gloss: вернуть (товар)
    note: '*پس دادن* буквально значит «назад дать» — ещё одна конструкция с легким глаголом, как *باز کردن* из раздела о банке.'
  fa.a2.unit18.lesson01.teach.exchange_word:
    title: Обмен
    gloss: обмен
    note: '*تعویض* — слово для обмена; *تعویض کردن* («обменять») — форма с легким глаголом.'
    example_gloss: Я хочу обменять этот товар.
  fa.a2.unit18.lesson01.teach.refund_word:
    title: Возврат денег
    gloss: возврат денег
    note: '*بازپرداخت* — стандартное слово для возврата денежных средств.'
    example_gloss: Возврат денег занимает два дня.
  fa.a2.unit18.lesson01.teach.deadline_word:
    title: Срок
    gloss: срок
    note: '*مهلت* — общее слово для крайнего срока или отведённого времени.'
    example_gloss: Срок возврата — семь дней.
  fa.a2.unit18.lesson01.teach.recap_headphones:
    title: Я купил эти наушники
    gloss: Я купил эти наушники
    note: Повторная фраза со словом *هدفون* («наушники») — товаром, вокруг которого построена ситуация этого раздела.
  fa.a2.unit18.lesson02.teach.no_sound_word:
    title: Нет звука
    gloss: нет звука
    note: '*صدا نداره* (буквально «звука не имеет») говорит об устройстве, которое не воспроизводит звук.'
    example_gloss: В этих наушниках нет звука.
  fa.a2.unit18.lesson02.teach.i_want_to_exchange_or_refund:
    title: Я хочу обменять это или вернуть деньги
    gloss: Я хочу обменять эти наушники или вернуть деньги.
    note: '*یا* («или») предлагает магазину выбор между двумя вариантами, о которых идёт речь.'
  fa.a2.unit18.lesson02.teach.full_complaint_sentence:
    title: Называем проблему и просьбу вместе
    gloss: Я купил эти наушники, но в них нет звука. Я хочу обменять их или вернуть деньги.
    note: 'Полная схема жалобы, на которой построен этот урок: сначала проблема, потом просьба.'
  fa.a2.unit18.lesson03.teach.purchase_date_word:
    title: Дата покупки
    gloss: дата покупки
    note: '*تاریخ خرید* — стандартное выражение для даты покупки.'
    example_gloss: Дата покупки указана на чеке.
  fa.a2.unit18.lesson03.teach.policy_notice_text:
    title: Объявление магазина об условиях возврата
    gloss: 'Срок возврата товара: семь дней с даты покупки, при наличии чека.'
    note: Короткое официальное объявление магазина — письменный стиль, которому учит этот урок.
  fa.a2.unit18.lesson04.teach.please_word:
    title: Пожалуйста
    gloss: пожалуйста
    note: '*لطفاً* — вежливое слово, которое ставится в конце просьбы.'
    example_gloss: Обменяйте это, пожалуйста.
  fa.a2.unit18.lesson04.teach.turn01:
    title: نیما называет проблему
    gloss: نیما вежливо говорит, что купил эти наушники, но в них нет звука.
    note: Объединяет повторную фразу из первого урока и *صدا نداره* из второго.
  fa.a2.unit18.lesson04.teach.turn02:
    title: فروشنده просит чек и дату
    gloss: Сотрудник спрашивает, есть ли у него чек и в какой день он купил наушники.
    note: '*خریدینش* — разговорная вежливая форма «вы купили это» (в письменной речи *خریدید*, плюс местоимение *-ش* «это»).'
  fa.a2.unit18.lesson04.teach.turn03:
    title: نیما подтверждает и называет дату
    gloss: نیما говорит «да, пожалуйста» — он купил их три дня назад.
    note: '*بفرمایید* здесь значит «вот, пожалуйста», когда что-то протягивают.'
  fa.a2.unit18.lesson04.teach.turn04:
    title: فروشنده подтверждает, что срок не вышел, и предлагает выбор
    gloss: 'Сотрудник говорит, что проблем нет, семидневный срок не прошёл, и спрашивает: обмен или возврат денег?'
    note: '*تو مهلت هفت روزه هستید* («вы в пределах семидневного срока») подтверждает, что возврат возможен.'
  fa.a2.unit18.lesson04.teach.turn05:
    title: نیما просит обмен
    gloss: نیما вежливо просит обменять товар.
    note: '*کنید* — вежливая форма повелительного наклонения от *کردن* («делать»).'
  fa.a2.unit18.lesson04.teach.turn06:
    title: فروشنده оформляет обмен
    gloss: Сотрудник говорит «хорошо» и что сейчас даст ему новые наушники.
    note: '*بهتون می‌دم* («я вам дам») завершает обмен.'
