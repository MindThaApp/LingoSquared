course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: описываем погоду и температуру, спрашиваем, какая погода, и строим простой план с учётом погоды.'
units:
  fa.a1.unit07.weather:
    title: Погода и планы
lessons:
  fa.a1.unit07.lesson01.weather_conditions:
    title: Основные погодные условия
  fa.a1.unit07.lesson02.temperature_words:
    title: Жарко и холодно
  fa.a1.unit07.lesson03.asking_about_weather:
    title: Спросить о погоде
  fa.a1.unit07.lesson04.describing_todays_weather:
    title: Опиши сегодняшнюю погоду
  fa.a1.unit07.lesson05.weather_based_suggestions:
    title: Предложи что-то с учётом погоды
  fa.a1.unit07.lesson06.weather_plan_dialogue:
    title: Двое друзей строят планы с учётом погоды
teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: Солнечно
    gloss: солнечный
    note: آفتابی описывает солнечную погоду.
    example_gloss: Сегодня солнечно.
  fa.a1.unit07.lesson01.teach.rainy:
    title: Дождливый
    gloss: дождливый
    note: بارونی — разговорное написание и произношение слова بارانی («дождливый»).
    example_gloss: Завтра будет дождливая погода.
  fa.a1.unit07.lesson01.teach.cloudy:
    title: Облачно
    gloss: облачный
    note: ابری описывает облачную погоду.
    example_gloss: Погода облачная.
  fa.a1.unit07.lesson01.teach.snowy:
    title: Снежный
    gloss: снежный
    note: برفی описывает снежную погоду.
    example_gloss: Зимой погода снежная.
  fa.a1.unit07.lesson01.teach.or_word:
    title: Или
    gloss: или
    note: یا соединяет два альтернативных погодных состояния.
    target_text: یا (или)
  fa.a1.unit07.lesson02.teach.hot:
    title: Жарко
    gloss: жарко
    note: گرم описывает жаркую погоду или вообще тепло.
    example_gloss: Сегодня жаркая погода.
  fa.a1.unit07.lesson02.teach.cold:
    title: Холодно
    gloss: холодный
    note: سرد описывает холодную погоду или вообще холод.
    example_gloss: Зимой холодно.
  fa.a1.unit07.lesson02.teach.cool:
    title: Прохладный
    gloss: прохладный
    note: خنک описывает мягкую, прохладную погоду — между گرم и سرد.
    example_gloss: По вечерам прохладно.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: Погода
    gloss: погода
    note: هوا — общее слово для погоды (также означает «воздух»).
    example_gloss: Какая сегодня погода?
  fa.a1.unit07.lesson03.teach.weather_question:
    title: Спроси, какая погода
    gloss: Какая погода?
    note: В هوا چطوره؟ снова используется چطوره — разговорное «как», уже встречавшееся в фразе حالتون چطوره؟ в Уроке 1.
  fa.a1.unit07.lesson03.teach.today_word:
    title: Сегодня
    gloss: сегодня
    note: امروز называет текущий день.
    example_gloss: Сегодня хорошая погода.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: Завтра
    gloss: завтра
    note: فردا называет следующий день.
    example_gloss: До завтра.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: Скажи, что сегодня солнечная погода
    gloss: Сегодня солнечная погода.
    note: В امروز هوا آفتابیه используется разговорное стяжение -e (آفتابیه = آفتابی است), уже знакомое по этому курсу.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: Скажи, что сегодня холодно
    gloss: Сегодня холодно.
    note: امروز سرده строится по той же схеме стяжения.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: Разговорное стяжение -e
    gloss: آفتابیه — это обычная разговорная стяжённая форма от آفتابی است.
    note: 'Та же схема (прилагательное + ه) работает с любым словом о погоде: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: Скажи, что сегодня дождливо
    gloss: Сегодня дождливо.
    note: В امروز بارونیه то же стяжение -e применено к слову بارونی.
  fa.a1.unit07.lesson05.teach.because_word:
    title: Потому что / так как
    gloss: потому что / так как
    note: چون вводит причину, по которой что-то предлагают.
    example_gloss: Я надеваю пальто, потому что холодно.
  fa.a1.unit07.lesson05.teach.better_to:
    title: Предложи взять зонт
    gloss: Лучше взять зонт.
    note: В بهتره چتر ببریم разговорное بهتره («лучше») смягчает предложение.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: Соедини причину и предложение
    gloss: Раз дождь, лучше взять зонт.
    note: چون بارونیه، بهتره چتر ببریم соединяет причину, связанную с погодой, и предложение.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: Предложи надеть пальто
    gloss: Раз холодно, лучше надеть пальто.
    note: چون سرده، بهتره کت بپوشیم строится по той же схеме «причина + предложение», только про холодную погоду.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: Предложи надеть пальто
    gloss: лучше надеть пальто
    note: کت بپوشیم строится по той же схеме بهتره + глагол, что и چتر ببریم, только про холодную погоду.
    example_gloss: Холодно, давай наденем пальто.
  fa.a1.unit07.lesson06.teach.turn01:
    title: Сара спрашивает, какая сегодня погода
    gloss: Сара спрашивает, какая сегодня погода.
    note: هوا چطوره؟ — это вопрос из урока 3.
  fa.a1.unit07.lesson06.teach.turn02:
    title: Реза говорит, что дождливо
    gloss: Реза говорит, что, кажется, дождливо.
    note: 'فکر کنم («кажется», «я думаю») смягчает фразу: Реза не уверен, а предполагает.'
  fa.a1.unit07.lesson06.teach.turn03:
    title: Сара предлагает взять зонт
    gloss: Сара говорит, что тогда лучше взять зонт.
    note: پس («тогда», «значит») связывает факт о погоде с предложением.
  fa.a1.unit07.lesson06.teach.turn04:
    title: Реза соглашается и спрашивает про завтра
    gloss: Реза соглашается и спрашивает, что будет завтра.
    note: فردا چی؟ — естественный краткий способ спросить о следующем дне.
  fa.a1.unit07.lesson06.teach.turn05:
    title: Сара рассказывает о погоде на завтра
    gloss: Сара говорит, что завтра будет солнечно и жарко.
    note: В آفتابیه و گرمه два стяжённых слова о погоде соединены через و.
  fa.a1.unit07.lesson06.teach.turn06:
    title: Реза предлагает пойти в парк
    gloss: Реза говорит, что это здорово, и предлагает пойти в парк.
    note: عالیه («здорово») — это положительная реакция перед предложением плана.
  fa.a1.unit07.lesson06.teach.turn07:
    title: Сара соглашается и прощается
    gloss: Сара соглашается и говорит, что увидится с ним завтра.
    note: باشه («ладно») — распространённый разговорный способ согласиться с планом.
