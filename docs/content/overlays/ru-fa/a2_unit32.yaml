teaching:
  fa.a2.unit32.lesson01.teach.problems:
    title: Небольшие проблемы
    gloss: У меня болит голова, мне плохо, у меня экзамен, у меня нет денег
    note: 'Это проблемы, по поводу которых в уроке даются советы: здоровье, учёба и деньги. *سرم درد می‌کنه* буквально значит «моя голова болит».'
    example_gloss:
    - Сегодня у меня болит голова.
    - Завтра у меня экзамен.
    - Мне плохо, и у меня нет денег.
  fa.a2.unit32.lesson01.teach.helpers:
    title: Слова о здоровье, учёбе и деньгах
    gloss: отдых, врач, аптека, лекарство, вода, кофе, урок/учёба, расходы
    note: '*داروخونه* — обычная разговорная форма слова «аптека». *درس* — это «урок», а также объект при глаголе «учить, заниматься»: *درس بخونی*.'
    example_gloss:
    - У меня есть вода и кофе.
    - Сегодня вечером у меня урок.
    - Врач и аптека.
  fa.a2.unit32.lesson01.teach.advice_verbs:
    title: Глагольные формы для советов
    gloss: ты отдохнёшь, ты пойдёшь, ты выпьешь, ты позанимаешься, ты ляжешь спать, ты потратишь; рано, больше, меньше
    note: 'Это формы для *تو* с окончанием *-ی*: *کنی، بری، بخوری، بخونی، بخوابی*. Это сослагательная форма (конъюнктив), которая стоит после *بهتره*.'
    example_gloss:
    - (чтобы) ты лёг спать пораньше.
    - (чтобы) ты занимался больше.
    - (чтобы) ты тратил меньше.
  fa.a2.unit32.lesson01.teach.bahtare:
    title: بهتره + сослагательная форма
    gloss: Лучше, чтобы ты сходил к врачу; лучше, чтобы ты отдохнул
    note: '*بهتره* значит «лучше (чтобы)…» и выражает мягкий совет. Глагол после него стоит в сослагательной форме, здесь с окончанием *-ی* для *تو*: *بهتره بری*, *بهتره استراحت کنی*. Между *بهتره* и глаголом нет никакого дополнительного слова.'
  fa.a2.unit32.lesson02.teach.my_opinion:
    title: По моему мнению
    gloss: я думаю, по-моему
    note: '*به نظرم* буквально значит «на мой взгляд» и обычно используется, чтобы смягчить совет.'
    example_gloss:
    - Я думаю, тебе лучше выпить воды.
    - Я думаю, тебе лучше сходить к врачу.
  fa.a2.unit32.lesson02.teach.opinion_rule:
    title: به نظرم перед بهتره
    gloss: Я думаю, тебе лучше заниматься больше
    note: 'Поставь *به نظرم* в начало и сохрани после него ту же структуру: *به نظرم بهتره + subjunctive*. Тогда совет звучит как твоё мнение, а не как приказ.'
  fa.a2.unit32.lesson03.teach.negative_verbs:
    title: Отрицательные формы глагола
    gloss: (чтобы) ты не пил, не ходил, не спал, не делал; поздно, много, очень
    note: 'Отрицательная форма каждого сослагательного глагола для *تو* образуется добавлением *نـ* спереди: *بخوری → نخوری*, *بری → نری*, *بخوابی → نخوابی*, *کنی → نکنی*.'
    example_gloss:
    - (чтобы) ты не пил кофе.
    - (чтобы) ты не ложился спать поздно.
    - (чтобы) ты не тратил много.
  fa.a2.unit32.lesson03.teach.must:
    title: Должен
    gloss: должен, нужно
    note: '*باید* выражает сильную необходимость: *باید بری دکتر* = «тебе нужно (ты должен) сходить к врачу».'
    example_gloss:
    - Завтра ты должен заниматься больше.
    - Сегодня тебе нужно сходить к врачу.
  fa.a2.unit32.lesson03.teach.negative_rule:
    title: Отрицательный совет
    gloss: Тебе лучше не пить кофе; тебе лучше не ложиться спать поздно
    note: 'Чтобы сказать «лучше не…», оставь *بهتره* и поставь *نـ* перед глаголом: *بهتره قهوه نخوری*. Отрицание к самому *بهتره* не добавляется.'
  fa.a2.unit32.lesson03.teach.must_vs_better:
    title: باید сильнее, чем بهتره
    gloss: Тебе нужно сходить к врачу; тебе лучше сходить к врачу
    note: '*بهتره* используй для дружеского совета, которому можно и не последовать, а *باید* — когда что-то действительно необходимо. После обоих стоит одна и та же форма глагола, как *بری*.'
  fa.a2.unit32.lesson04.teach.question:
    title: Что мне делать?
    gloss: Что мне делать?
    note: '*چیکار کنم؟* — обычный разговорный способ попросить совета. Глагол *کنم* — сослагательная форма для *من*.'
  fa.a2.unit32.lesson04.teach.responses:
    title: Ответ на совет
    gloss: да, ты прав, это хорошая мысль, не знаю, может быть, нет
    note: '*حق با توئه* буквально значит «правда с тобой». Так по-дружески можно принять совет, выразить сомнение или отказаться.'
    example_gloss:
    - Да, ты прав.
    - Это хорошая мысль.
    - Не знаю, может быть.
  fa.a2.unit32.lesson04.teach.respond_rule:
    title: Три способа ответить на совет
    gloss: Да, хорошая мысль; не знаю, может быть
    note: Согласись словами *آره، حق با توئه* или *فکر خوبیه*. Если ты не уверен, скажи *نمی‌دونم، شاید*. Простое *نه* возможно, но звучит резко.
  fa.a2.unit32.lesson05.teach.reading:
    title: Сообщение и ответ
    gloss: Привет, Сара. Завтра у меня экзамен, но у меня болит голова и мне плохо. Что мне делать? Привет, Нима. Я думаю, тебе лучше сегодня вечером отдохнуть и выпить воды. Тебе лучше не пить кофе и лечь спать пораньше.
    note: Первые три предложения — сообщение Нимы, остальное — ответ Сары. Сначала найди проблему, потом три совета.
  fa.a2.unit32.lesson06.teach.turn01:
    title: Реплика 1
    gloss: Нима рассказывает о своей проблеме и спрашивает, что делать.
    note: Он называет два факта, а затем просит совета.
  fa.a2.unit32.lesson06.teach.turn02:
    title: Реплика 2
    gloss: Сара даёт два совета.
    note: '*به نظرم* смягчает совет.'
  fa.a2.unit32.lesson06.teach.turn03:
    title: Реплика 3
    gloss: Нима принимает совет, но говорит, что должен заниматься.
    note: '*باید* здесь выражает собственную сильную необходимость Нимы.'
  fa.a2.unit32.lesson06.teach.turn04:
    title: Реплика 4
    gloss: Сара советует ему сегодня вечером не заниматься и лечь спать пораньше.
    note: Сначала совет с отрицанием, потом — утвердительный совет.
  fa.a2.unit32.lesson06.teach.turn05:
    title: Реплика 5
    gloss: Нима не уверен, но признаёт, что она, возможно, права.
    note: Неуверенный ответ на совет.
  fa.a2.unit32.lesson06.teach.turn06:
    title: Реплика 6
    gloss: 'Сара добавляет: тогда лучше завтра сходить к врачу.'
    note: '*پس* означает «значит, тогда».'
