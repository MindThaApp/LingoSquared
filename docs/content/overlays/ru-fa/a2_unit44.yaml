teaching:
  fa.a2.unit44.lesson01.teach.orders:
    title: Заказы и бронирование
    gloss: заказ, комната, бронь, готов
    note: '*سفارش دادن* — «заказывать», *رزرو کردن* — «бронировать».'
    example_gloss:
    - Заказ здесь.
    - Комната здесь.
    - Бронь здесь.
    - Номер готов.
  fa.a2.unit44.lesson01.teach.neg:
    title: Ещё нет
    gloss: ещё нет, не пришёл, я не дал(а), я не сделал(а)
    note: '*هنوز* с отрицательным глаголом означает «ещё не».'
    example_gloss:
    - Мой заказ ещё не пришёл.
    - Я ещё не заказал(а).
    - Я ещё не забронировал(а).
    - Комната ещё не готова.
  fa.a2.unit44.lesson01.teach.rule:
    title: هنوز + отрицание = «ещё не»
    gloss: Мой заказ ещё не пришёл; я ещё не заказал(а); комната ещё не готова
    note: 'Поставь *هنوز* перед отрицательным глаголом, чтобы сказать, что что-то ещё не произошло. Подходит и перфект (*نیومده*), и простое прошедшее (*ندادم*). С утвердительным глаголом *هنوز* значит «всё ещё»: *اتاق هنوز اینجاست* (комната всё ещё здесь).'
  fa.a2.unit44.lesson02.teach.appointments:
    title: Приём и запись
    gloss: время приёма (запись), врач, свободный, работа
    note: '*وقت* — это запись на приём или свободное время.'
    example_gloss:
    - Приём у врача здесь.
    - Врач здесь.
    - Это время свободно.
  fa.a2.unit44.lesson02.teach.dige:
    title: Больше нет
    gloss: больше, я не хочу, он(а) не (работает)
    note: '*دیگه* с отрицательным глаголом означает «больше не».'
    example_gloss:
    - Я больше этого не хочу.
    - Врач больше здесь не работает.
    - Это время уже не свободно.
  fa.a2.unit44.lesson02.teach.rule:
    title: دیگه + отрицание = «больше не»
    gloss: Я больше не хочу кофе; врач больше здесь не работает; это время уже не свободно
    note: Поставь *دیگه* перед отрицательным глаголом, чтобы сказать, что раньше это было так, а теперь нет. В других предложениях *دیگه* также значит «другой / ещё один», но с отрицательным глаголом оно значит «больше не».
  fa.a2.unit44.lesson03.teach.hich_words:
    title: Ничего, никто, ни один ...
    gloss: ничего, никто, ни один
    note: '*هیچ* с отрицательным глаголом означает «ни один / никакой / ничего».'
    example_gloss:
    - Я ничего не хочу.
    - Здесь никого нет.
    - Ни один стол не свободен.
    - Стол здесь.
  fa.a2.unit44.lesson03.teach.rule:
    title: هیچ + отрицательный глагол
    gloss: Я ничего не хочу; никто не пришёл; ни один стол не свободен; ни одна комната не готова
    note: 'В персидском *هیچ* употребляется вместе с отрицательным глаголом, как и в русском («ничего не хочу»): *هیچی نمی‌خوام*. С существительным добавляется *ی*: *هیچ میزی*, *هیچ اتاقی*. Отрицание выражается дважды: словом *هیچ* и глаголом.'
  fa.a2.unit44.lesson04.teach.answers:
    title: Короткие ответы
    gloss: Вы заказали? Нет, ещё нет. Хотите кофе? Нет, больше не хочу. Хотите что-нибудь? Нет, ничего.
    note: 'Чтобы быстро исправить ошибку, начни с *نه*, а потом скажи одно короткое слово: *هنوز نه*, *دیگه نه*, *هیچی*. Затем можно добавить полное предложение.'
  fa.a2.unit44.lesson04.teach.phrases:
    title: Проверяем и исправляем
    gloss: верно, только, вода
    note: '*درسته؟* значит «верно?».'
    example_gloss:
    - Два кофе, верно?
    - Я хочу только воды.
  fa.a2.unit44.lesson05.teach.reading:
    title: Проблема с бронированием
    gloss: 'Нима забронировал комнату на две ночи. Сегодня он пришёл в отель, но комната ещё не была готова. Сотрудник сказал: «Свободных комнат нет». Нима сказал: «Тогда мне этот отель больше не нужен».'
    note: Прочитай один раз, чтобы понять, что произошло, а потом ещё раз, обращая внимание на *هنوز*, *هیچ* и *دیگه*.
  fa.a2.unit44.lesson06.teach.turn01:
    title: Официант приносит заказ
    gloss: 'Официант: Извините, ваш заказ готов. Два кофе, верно?'
    note: '*درسته؟* просит подтвердить.'
  fa.a2.unit44.lesson06.teach.turn02:
    title: 'Нима поправляет: ещё нет'
    gloss: 'Нима: Нет, я ещё не заказывал.'
    note: '*هنوز ... ندادم* означает «ещё не».'
  fa.a2.unit44.lesson06.teach.turn03:
    title: Официант понимает
    gloss: 'Официант: Тогда эти кофе не ваши.'
    note: '*مال شما نیست* — отрицание к *مال شماست*.'
  fa.a2.unit44.lesson06.teach.turn04:
    title: Нима поправляет снова
    gloss: 'Нима: Я уже пил кофе сегодня, поэтому больше не хочу кофе. Я ничего не хочу, только воды.'
    note: '*دیگه* и *هیچی* оба употребляются с отрицательным глаголом.'
