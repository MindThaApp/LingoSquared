  fa.a2.unit50.changing_arrangement.lesson06.arrangement_dialogue:
    title: Разговор о встрече
teaching:
  fa.a2.unit50.changing_arrangement.lesson01.teach.arrangement_words:
    title: Договорённость и её перенос
    gloss: договорённость, наша договорённость, менять, завтра
    note: '*قرار* — договорённость о встрече. *قرارمون* — «наша договорённость» (*ـمون* значит «наш»). *عوض کردن* значит «менять» и употребляется с *رو*.'
    example_gloss:
    - Завтра у меня встреча с Нимой.
    - Мы переносим нашу встречу.
    - Сегодня мы перенесли нашу встречу.
  fa.a2.unit50.changing_arrangement.lesson01.teach.sorry_words:
    title: Извините, к сожалению, я не могу
    gloss: извините, к сожалению, я не могу, мы не можем
    note: '*ببخشید* и *متأسفانه* смягчают плохую новость. *نمی‌تونم* — «я не могу», а *نمی‌تونیم* — «мы не можем».'
    example_gloss:
    - Извините, я не могу прийти завтра.
    - К сожалению, завтра у меня работа.
    - К сожалению, Нима не может прийти завтра.
  fa.a2.unit50.changing_arrangement.lesson01.teach.delay_words:
    title: Опоздания и занятость
    gloss: опоздание, я занят, срочный
    note: '*تأخیر دارم* значит, что ты опаздываешь. *گرفتارم* — «я занят», а *فوری* описывает что-то срочное.'
    example_gloss:
    - Я опаздываю.
    - Я занят, не могу прийти.
    - У меня срочная работа.
  fa.a2.unit50.changing_arrangement.lesson01.teach.polite_change:
    title: Вежливая просьба о переносе
    gloss: Извините, можно перенести нашу встречу?
    note: '*می‌شه … ؟* вежливо спрашивает, возможно ли что-то. Глагол оканчивается на *ـیم* («мы»), потому что в просьбе речь о «нас».'
  fa.a2.unit50.changing_arrangement.lesson01.teach.ask_to_change:
    title: 'Два способа спросить: می‌شه и می‌تونیم'
    gloss: Можно изменить наши планы? Мы можем изменить наши планы?
    note: Оба вопроса вежливые. *می‌شه* — обычная разговорная форма; *می‌تونیم* звучит чуть более прямо. После любого из них глагол стоит в форме *کنیم*, а не *می‌کنیم*.
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_words:
    title: Называем причину
    gloss: потому что, должен, работа, я болен
    note: '*چون* вводит причину и может стоять в начале или во второй части предложения. *باید کار کنم* значит «мне надо работать».'
    example_gloss:
    - Я не могу прийти, потому что я болен.
    - Потому что мне надо работать, я опаздываю.
    - Потому что у меня работа, я не могу.
  fa.a2.unit50.changing_arrangement.lesson02.teach.so_phrase:
    title: 'Сначала причина, потом следствие: برای همین'
    gloss: Я болен, поэтому не могу прийти.
    note: '*برای همین* значит «поэтому». Ставь его после причины вместо *چون*; оба слова в одном предложении не употребляются.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.new_time:
    title: Дни и часы для нового времени
    gloss: четверг, пятница, четыре часа, шесть часов
    note: Сначала назови день, затем *ساعت* и число.
    example_gloss:
    - В пятницу в четыре у меня есть время.
    - Я могу прийти в четверг в шесть.
    - Завтра в шесть у меня работа.
  fa.a2.unit50.changing_arrangement.lesson02.teach.is_it_good:
    title: Предлагаем время
    gloss: Пятница в четыре тебе подходит? Ты можешь прийти?
    note: '*برات خوبه؟* — вопрос о том, подходит ли время одному хорошо знакомому человеку (на «ты»). Если ты говоришь человеку *شما* («вы»), скажи *براتون خوبه؟*.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_then_time:
    title: Перенос встречи в три шага
    gloss: Завтра я не могу прийти, потому что мне надо работать. Пятница в четыре тебе подходит?
    note: Сначала скажи, что не можешь прийти, потом назови причину с *چون*, затем предложи новый день и час. Причина делает просьбу вежливой.
  fa.a2.unit50.changing_arrangement.lesson03.teach.finish_words:
    title: Закончить и позвонить
    gloss: закончилось, закончится / будет закончено, я тебе позвоню, позвони мне
    note: '*تموم شد* — прошедшее время («закончилось»); *تموم بشه* — форма, которая стоит после *وقتی*, когда речь о будущем.'
    example_gloss:
    - Моя работа закончилась.
    - Моя работа заканчивается в шесть.
    - Я позвоню тебе завтра.
    - Пожалуйста, позвони мне.
  fa.a2.unit50.changing_arrangement.lesson03.teach.confirm_or_postpone:
    title: Подтвердить или отложить
    gloss: подтверждённый, назад / позже, давай отложим
    note: '*قطعی* говорит, что договорённость подтверждена. *عقب بندازیم* — естественный разговорный способ сказать «давай отложим».'
    example_gloss:
    - Наша встреча подтверждена.
    - Давай отложим нашу встречу.
  fa.a2.unit50.changing_arrangement.lesson03.teach.when_clause:
    title: وقتی о будущем и о прошлом
    gloss: Когда моя работа закончится, я тебе позвоню. Когда моя работа закончилась, я тебе позвонил(а).
    note: Для будущего глагол после *وقتی* стоит в форме с *ب* (*تموم بشه*), а главный глагол — в обычном настоящем (*زنگ می‌زنم*). Для прошедшего оба глагола стоят в прошедшем времени.
  fa.a2.unit50.changing_arrangement.lesson03.teach.before_after:
    title: قبل از اینکه и بعد از اینکه
    gloss: Перед тем как я уйду, я тебе позвоню. После того как я приеду, я тебе позвоню.
    note: 'После *قبل از اینکه* («перед тем как») и *بعد از اینکه* («после того как») стоит глагол с *ب*, если речь о будущем: *برم*, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson03.teach.time_phrases:
    title: Та же модель в прошедшем времени
    gloss: Когда я приехал(а), я тебе позвонил(а). После того как я приехал(а), я тебе позвонил(а).
    note: 'В прошедшем времени в придаточной части стоит обычный глагол прошедшего времени: *رسیدم*. Сравни с будущим: *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_words:
    title: Если, подходящий, как насчёт, парикмахерская, велосипед
    gloss: если, не подходит, как насчёт?, парикмахерская, велосипед
    note: '*چطوره؟* предлагает другой вариант: *دوشنبه چطوره؟* значит «Как насчёт понедельника?»'
    example_gloss:
    - Как насчёт понедельника?
    - Суббота тебе не подходит?
    - В четверг я записан(а) в парикмахерскую.
    - Я хочу велосипед.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_clause:
    title: اگه для возможной ситуации
    gloss: Если у тебя будет время, мы можем поехать в субботу. Если пойдёт дождь, мы изменим наши планы.
    note: После *اگه* ставится форма с *ب* или *داشته باشی*; главная часть стоит в обычном настоящем. Часть с *اگه* ставь первой и отделяй запятой.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_cant:
    title: План Б с اگه
    gloss: Если ты не можешь прийти, позвони мне. Если суббота тебе не подходит, как насчёт понедельника?
    note: '*اگه … نمی‌تونی* даёт собеседнику возможность отказаться, а *چطوره؟* предлагает новый день.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.polite_please:
    title: Вежливые просьбы в сфере услуг
    gloss: Пожалуйста, назначьте мне другое время. Можно изменить моё время записи?
    note: В парикмахерской, магазине или пункте проката используй *لطفا* и глагол в форме *شما* (*بدید*). *می‌شه … ؟* подходит и для *شما*, и для *تو*.
  fa.a2.unit50.changing_arrangement.lesson05.teach.reading:
    title: Записка о переносе встречи
    gloss: Сара, привет! К сожалению, завтра я не могу прийти, потому что мне надо работать. Можно изменить наши планы? Пятница в четыре тебе подходит? Если в пятницу ты не можешь, я могу в субботу в десять. Когда я закончу работу, я тебе позвоню.
    note: Прочитай один раз, чтобы найти причину, и ещё раз — чтобы найти два предложенных времени.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn01:
    title: Сара напоминает Нима
    gloss: Нима, завтра в десять у нас встреча.
    note: Сара напоминает о встрече.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn02:
    title: Нима просит перенести
    gloss: Прости, Сара, к сожалению, завтра я не могу прийти, потому что мне надо работать. Можно изменить наши планы?
    note: Нима извиняется, называет причину и вежливо просит.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn03:
    title: Сара соглашается и предлагает пятницу
    gloss: Да, ничего страшного. Пятница в десять тебе подходит?
    note: Сара соглашается и предлагает новое время.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn04:
    title: Нима отказывается и предлагает субботу
    gloss: В пятницу я не могу, потому что у меня приём у врача. Как насчёт субботы?
    note: Нима называет причину и предлагает другой вариант.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn05:
    title: Сара соглашается на субботу
    gloss: Суббота в десять — хорошо. Я возьму велосипеды на субботу.
    note: Велосипеды тоже переносятся на новый день.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn06:
    title: Нима благодарит Сару
    gloss: Отлично, спасибо! Когда я закончу работу, я тебе позвоню.
    note: Нима заканчивает фразой с придаточным времени.
