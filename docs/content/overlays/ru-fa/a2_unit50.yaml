      status: correct
    feedback: '*قرارمون رو عوض کنیم* значит «изменить наши планы».'
  fa.a2.unit50.changing_arrangement.lesson01.exercise02.recognize_sorry:
    instruction: Что это значит?
    correct_option: К сожалению, завтра я не могу прийти.
    distractors:
    - К сожалению, завтра ты не можешь прийти.
    - К сожалению, вчера я не смог прийти.
    - Я рад прийти завтра.
    accepted_answers:
    - value: К сожалению, завтра я не могу прийти.
      status: correct
    feedback: '*نمی‌تونم* значит «я не могу», *فردا* — «завтра».'
  fa.a2.unit50.changing_arrangement.lesson01.exercise03.match_change_words:
