      right: срочный
  fa.a2.unit50.changing_arrangement.lesson01.exercise04.order_polite_change:
    instruction: 'Расставь слова, чтобы спросить: Можно изменить наши планы?'
    accepted_answers:
    - value:
      - می‌شه
      - قرارمون
      - رو
      - عوض
      - کنیم
      status: correct
