      status: correct
    feedback: 'Полный вопрос: *می‌شه قرارمون رو عوض کنیم؟*'
  fa.a2.unit50.changing_arrangement.lesson01.exercise06.translate_polite_change:
    instruction: 'Переведи на персидский (Иран), используя вежливое слово для «можно»: Извините, можно изменить наши планы?'
    accepted_answers:
    - value: ببخشید می‌شه قرارمون رو عوض کنیم
      status: correct
    - value: ببخشید می‌تونیم قرارمون رو عوض کنیم
      status: correct
    - value: می‌شه قرارمون رو عوض کنیم
      status: acceptable_with_note
      note: Слова «извините» нет, но просьба всё равно вежливая.
    - value: می‌تونیم قرارمون رو عوض کنیم
      status: acceptable_with_note
      note: Слова «извините» нет, но просьба всё равно вежливая.
    feedback: 'Образец: *ببخشید، می‌شه قرارمون رو عوض کنیم؟*'
  fa.a2.unit50.changing_arrangement.lesson02.exercise01.recognize_reason:
