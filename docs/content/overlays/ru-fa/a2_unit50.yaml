    correct_option: Предлагает новое время.
    distractors:
    - Называет причину.
    - Извиняется.
    - Окончательно отменяет встречу.
    accepted_answers:
    - value: Предлагает новое время.
      status: correct
    feedback: '*برات خوبه؟* спрашивает, подходит ли тебе время.'
  fa.a2.unit50.changing_arrangement.lesson02.exercise03.match_reasons_times:
