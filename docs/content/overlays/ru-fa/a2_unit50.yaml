course:
  title: Персидский A2
  description: 'Персидский язык Ирана для среднего уровня: грамматика на основе повседневных ситуаций.'
units:
  fa.a2.unit50.changing_arrangement:
    title: Перенос встречи
lessons:
  fa.a2.unit50.changing_arrangement.lesson01.asking_to_change:
    title: Просьба перенести
  fa.a2.unit50.changing_arrangement.lesson02.reason_and_new_time:
    title: Причина и новое время
  fa.a2.unit50.changing_arrangement.lesson03.time_clauses:
    title: Когда, перед тем как, после того как
  fa.a2.unit50.changing_arrangement.lesson04.if_and_polite:
