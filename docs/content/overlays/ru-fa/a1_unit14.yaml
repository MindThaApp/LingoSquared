course:
  title: Персидский язык (Иран) A1
  description: 'Персидский (Иран) для начинающих: говорим о том, что нравится и не нравится, спрашиваем о предпочтениях, выбираем из двух вариантов, называем простые причины; короткий текст и диалог о вкусах двух людей.'
units:
  fa.a1.unit14.preferences:
    title: Предпочтения
    description: Говорить и спрашивать о том, что нравится и не нравится, и называть простые причины.
lessons:
  fa.a1.unit14.lesson01.basic_likes:
    title: Простые «нравится» и «не нравится»
  fa.a1.unit14.lesson02.asking_preferences:
    title: Спрашиваем о предпочтениях
  fa.a1.unit14.lesson03.choosing_between_options:
    title: Выбор из двух вариантов
  fa.a1.unit14.lesson04.giving_reasons:
    title: Называем причину
  fa.a1.unit14.lesson05.reading_about_preferences:
    title: Читаем о предпочтениях
  fa.a1.unit14.lesson06.preferences_dialogue:
    title: Диалог о предпочтениях
teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: Мне нравится
    gloss: я люблю
    note: دوست دارم буквально значит «у меня есть дружба (с этим)» — это стандартный способ сказать «мне нравится».
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Кофе
    gloss: кофе
    note: قهوه означает «кофе».
    example_gloss: Мне нравится кофе.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Чай
    gloss: чай
    note: چای означает «чай».
    example_gloss: Я не люблю чай.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: Мне не нравится
    gloss: мне не нравится
    note: دوست ندارم — отрицательная форма от دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: Я
    gloss: я
    note: من означает «я». Как и в русском, местоимение часто опускают, потому что окончание глагола уже показывает подлежащее, но его можно добавить для выделения.
    example_gloss: Я люблю музыку.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Какой
    gloss: какой
    note: کدوم означает «какой (из них)».
    example_gloss: Какой тебе нравится?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: Музыка
    gloss: музыка
    note: موسیقی означает «музыка».
    example_gloss: Я люблю музыку.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Ты хочешь
    gloss: ты хочешь
    note: می‌خوای — разговорная неформальная форма 2-го лица от می‌خواهی («ты хочешь»).
    target_text: می‌خوای (ты хочешь, неформ.)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Какой тебе нравится?
    gloss: Какой тебе нравится?
    note: کدوم رو دوست داری؟ — رو отмечает прямое дополнение (разг. вместо را), داری — форма 2-го лица от داشتن («иметь»).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Больше
    gloss: больше
    note: بیشتر означает «больше».
    example_gloss: Кофе мне нравится больше.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Или
    gloss: или
    note: یا означает «или» и предлагает выбор из двух вариантов.
    target_text: یا (или)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Кофе или чай?
    gloss: Кофе или чай?
    note: قهوه یا چای؟ предлагает выбор из двух напитков, изученных в первом уроке.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Потому что
    gloss: потому что
    note: چون вводит причину.
    target_text: چون (потому что)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: Вкусно
    gloss: вкусно
    note: خوشمزه‌ست — разговорное стяжение от خوشمزه است («вкусно»).
    example_gloss: Кофе вкусный.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: Интересно
    gloss: интересно
    note: جالبه — разговорное стяжение от جالب است («интересно»).
    example_gloss: Эта музыка интересная.
  fa.a1.unit14.lesson04.teach.va_word:
    title: И
    gloss: и
    note: '*و* означает «и» и может связывать два коротких высказывания, например «мне нравится» и описание. Это связь более свободная, чем *چون* («потому что»), которое прямо называет причину.'
    target_text: و (и)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Сара
    gloss: Сара
    note: Распространённое иранское женское имя.
    example_gloss: Саре нравится чай.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: Ему/ей нравится
    gloss: ему/ей нравится
    note: داره — разговорная форма 3-го лица от دارد («имеет»). دوست داره означает «ему/ей нравится», как دوست دارم в 1-м лице.
    target_text: دوست داره (ему/ей нравится, разг. 3-е лицо)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: Ему/ей не нравится
    gloss: ему/ей не нравится
    note: نداره — разговорная отрицательная форма 3-го лица. دوست نداره означает «ему/ей не нравится».
    target_text: دوست نداره (ему/ей не нравится, разг. 3-е лицо)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: Горячий
    gloss: горячий
    note: گرمه — разговорное стяжение от گرم است («тёплый, горячий»).
    example_gloss: Чай горячий.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Пример текста о предпочтениях
    gloss: Саре нравится чай, потому что он горячий. Сара не любит музыку.
    note: Короткий рассказ о третьем лице с лексикой этого раздела о предпочтениях.
  fa.a1.unit14.lesson06.teach.names:
    title: Нима и Сара
    gloss: Нима, Сара
    note: Распространённые иранские имена, которые встречаются в этом курсе.
    example_gloss:
    - Ниме нравится чай.
    - Саре нравится кофе.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: А ты?
    gloss: А ты?
    note: تو چی؟ — короткий и частый способ вернуть вопрос собеседнику.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: Здорово
    gloss: здорово
    note: عالیه — разговорное стяжение от عالی است («отлично»).
    example_gloss: Это здорово.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Нима спрашивает
    gloss: Чай или кофе — что тебе нравится больше?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Сара отвечает
    gloss: Кофе я люблю больше, потому что он вкусный. А ты?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Нима отвечает
    gloss: Я люблю чай, потому что он тёплый.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Сара реагирует
    gloss: Здорово!
