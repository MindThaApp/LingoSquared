course:
  title: Персидский A2
  description: 'Персидский (Иран) для среднего уровня: рассказываем о типичной неделе, выстраиваем последовательность дел с помощью اول/بعد/در آخر и сравниваем будни с реальной иранской рабочей неделей — с субботы по среду — и выходными в четверг и пятницу (پنجشنبه/جمعه).'
units:
  fa.a2.unit17.weekly_schedule:
    title: Расписание недели
lessons:
  fa.a2.unit17.lesson01.weekly_schedule_vocabulary:
    title: Слова для расписания недели
  fa.a2.unit17.lesson02.sequencing_your_week:
    title: Последовательность дел на неделе
  fa.a2.unit17.lesson03.reading_a_weekly_schedule:
    title: Читаем расписание недели
  fa.a2.unit17.lesson04.weekly_schedule_conversation:
    title: Рассказываем о своей неделе
teaching:
  fa.a2.unit17.lesson01.teach.week_word:
    title: Неделя
    gloss: неделя
    note: '*هفته* — общее слово для обозначения недели.'
    example_gloss: Эта неделя очень загруженная.
  fa.a2.unit17.lesson01.teach.weekend_word:
    title: Выходные
    gloss: выходные
    note: '*آخر هفته* буквально означает «конец недели». В Иране это *پنجشنبه*/*جمعه* (четверг/пятница), а не суббота/воскресенье.'
    example_gloss: По выходным я не работаю.
  fa.a2.unit17.lesson01.teach.rest_word:
    title: Отдых
    gloss: отдых
    note: '*استراحت کردن* («отдыхать») — конструкция с «лёгким» глаголом, как *باز کردن* из раздела о банках.'
    example_gloss: По пятницам я отдыхаю.
  fa.a2.unit17.lesson01.teach.first_word:
    title: Сначала
    gloss: сначала
    note: '*اول* открывает последовательность дел.'
    example_gloss: Сначала я завтракаю.
  fa.a2.unit17.lesson01.teach.then_word:
    title: Потом
    gloss: потом
    note: '*بعد* продолжает последовательность; *بعدش* («потом», «после этого») — её обычная разговорная форма.'
    example_gloss: Потом я иду на работу.
  fa.a2.unit17.lesson01.teach.finally_word:
    title: В конце
    gloss: в конце концов / в конце
    note: '*در آخر* завершает последовательность дел.'
    example_gloss: В конце я отдыхаю.
  fa.a2.unit17.lesson01.teach.recap_weekdays:
    title: Дни недели
    gloss: суббота, воскресенье, понедельник, вторник, среда, четверг, пятница
    note: Повторение названий дней недели из раздела о датах; здесь они используются для недельного расписания.
  fa.a2.unit17.lesson02.teach.until_word:
    title: До / по (промежуток дней)
    gloss: до / по
    note: '*تا* соединяет два дня в промежуток, например *شنبه تا چهارشنبه* (с субботы по среду).'
  fa.a2.unit17.lesson02.teach.work_days_sentence:
    title: Называем рабочие дни промежутком
    gloss: Я работаю с субботы по среду.
    note: Это обычная иранская рабочая неделя (многие офисы и магазины работают с субботы по среду), а не схема с понедельника по пятницу.
  fa.a2.unit17.lesson02.teach.thursdays_habitual_note:
    title: 'Суффикс -ها при названии дня: повторяющееся действие'
    gloss: по четвергам (каждую неделю)
    note: '*پنجشنبه‌ها* (четверг + -ها) означает «по четвергам» как регулярную привычку, а не один конкретный четверг.'
  fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence:
    title: Противопоставляем будни и выходные
    gloss: В течение недели я работаю, а по выходным отдыхаю.
    note: '*در طول هفته* («в течение недели») противопоставляется *آخر هفته* («выходные») с помощью *ولی* («но»).'
  fa.a2.unit17.lesson03.teach.clean_word:
    title: Убирать
    gloss: убирать
    note: '*تمیز کردن* — ещё одна конструкция с «лёгким» глаголом: *تمیز* («чистый») + *کردن* («делать»).'
    example_gloss: По четвергам я убираю дом.
  fa.a2.unit17.lesson03.teach.schedule_note_text:
    title: Письменное недельное расписание سارا
    gloss: 'Моё расписание на неделю: я работаю с субботы по среду. По четвергам хожу за покупками и убираю дом. По пятницам, в выходной, встречаюсь с друзьями и отдыхаю.'
    note: Короткая запись в планере в непринуждённом разговорном стиле (*خونه*, *دوستامو*).
  fa.a2.unit17.lesson04.teach.good_week_phrase:
    title: Какая у тебя хорошая неделя!
    gloss: Какая у тебя хорошая неделя!
    note: Дружелюбная реплика после рассказа о недельных планах. Она комментирует неделю собеседника, а не является прощальным пожеланием «хорошей недели».
  fa.a2.unit17.lesson04.teach.turn01:
    title: نیما спрашивает о неделе سارا
    gloss: نیما спрашивает سارا, как у неё неделя и какие у неё планы.
    note: '*چطوره* и *چیه* — устоявшиеся разговорные сокращённые формы от «как есть» и «что есть».'
  fa.a2.unit17.lesson04.teach.turn02:
    title: سارا начинает с рабочих дней
    gloss: سارا говорит, что сначала она ходит на работу с субботы по среду.
    note: '*سر کار می‌رم* («иду на работу») повторяет уже знакомое выражение «ходить на работу».'
  fa.a2.unit17.lesson04.teach.turn03:
    title: نیما спрашивает, что дальше
    gloss: 'نیما спрашивает: а потом?'
    note: '*بعدش چی؟* — короткий и естественный способ спросить, что идёт дальше.'
  fa.a2.unit17.lesson04.teach.turn04:
    title: سارا рассказывает о четвергах
    gloss: سارا говорит, что потом по четвергам она ходит за покупками и убирает дом.
    note: Повторяет предложение о четверге из третьего урока.
  fa.a2.unit17.lesson04.teach.turn05:
    title: سارا рассказывает о пятницах
    gloss: سارا говорит, что в конце по пятницам она отдыхает и встречается с друзьями.
    note: Завершает последовательность с помощью *در آخر* («в конце»).
  fa.a2.unit17.lesson04.teach.turn06:
    title: نیما завершает разговор
    gloss: 'نیما говорит: какая у тебя хорошая неделя!'
    note: Повторяет заключительную фразу этого урока.
