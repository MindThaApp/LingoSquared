course:
  title: Персидский A2
  description: 'Персидский (Иран) для уровня ниже среднего: официальная запись на приём в учреждение госуслуг для обновления адреса — лексика, запись на приём, чтение официального объявления и сам приём.'
units:
  fa.a2.unit09.bureaucracy:
    title: Административные дела
lessons:
  fa.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Слова для визита в учреждение
  fa.a2.unit09.lesson02.making_an_appointment:
    title: Запись на приём
  fa.a2.unit09.lesson03.reading_the_notice:
    title: Читаем объявление
  fa.a2.unit09.lesson04.at_the_registry_office:
    title: В учреждении госуслуг
teaching:
  fa.a2.unit09.lesson01.teach.vaght_word:
    title: Встреча
    gloss: запись на приём / время приёма
    note: '*وقت* буквально значит «время»; *وقت گرفتن* (взять время приёма) — обычный способ сказать «записаться на приём» по-персидски.'
  fa.a2.unit09.lesson01.teach.madrak_word:
    title: Документ
    gloss: документ
    note: '*مدرک* — общее слово для официального документа или удостоверяющей бумаги.'
  fa.a2.unit09.lesson01.teach.address_word:
    title: Адрес
    gloss: адрес
    note: '*آدرس* — обычное слово для домашнего или почтового адреса.'
  fa.a2.unit09.lesson01.teach.ghabz_word:
    title: Квитанция за коммунальные услуги
    gloss: квитанция за коммунальные услуги
    note: '*قبض* — это счёт или квитанция (за воду, электричество, газ); её обычно принимают как подтверждение места проживания.'
  fa.a2.unit09.lesson01.teach.national_id_word:
    title: Национальное удостоверение личности
    gloss: национальное удостоверение личности
    note: '*کارت ملی* — национальная карта личности Ирана, документ, который обновляют в этом уроке.'
  fa.a2.unit09.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — распространённый соединительный союз, который встречается во всём этом уроке.'
  fa.a2.unit09.lesson02.teach.request_appointment:
    title: Просим записать на приём
    gloss: Я хотел бы записаться на приём, чтобы изменить адрес.
    note: '*می‌خواستم* (буквально «я хотел») смягчает просьбу — как и в русском «я хотел бы…» или «я хотел спросить…».'
  fa.a2.unit09.lesson02.teach.because_moved:
    title: Объясняем причину с چون («потому что»)
    gloss: Поскольку я переехал, мне нужно изменить адрес.
    note: '*چون* вводит причину — это придаточное предложение уровня A2, шаг вперёд по сравнению с простыми утверждениями A1.'
  fa.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Вежливо спрашиваем, что принести
    gloss: Не могли бы вы сказать, что мне нужно принести?
    note: '*می‌شه...؟* («можно ли...?») — вежливая форма косвенного вопроса.'
  fa.a2.unit09.lesson03.teach.lease_word:
    title: Договор аренды
    gloss: договор аренды
    note: '*اجاره‌نامه* — договор аренды жилья, один из возможных документов, подтверждающих место проживания.'
  fa.a2.unit09.lesson03.teach.deadline_word:
    title: Крайний срок
    gloss: крайний срок
    note: '*مهلت* — общее слово для крайнего срока или ограничения по времени.'
  fa.a2.unit09.lesson03.teach.notice_text:
    title: Объявление в учреждении об обновлении адреса
    gloss: Для изменения адреса, пожалуйста, принесите старое национальное удостоверение личности и квитанцию за воду или электричество. Срок регистрации — до конца этого месяца.
    note: Короткое официальное объявление в нейтральном письменном стиле. В нём всё же используется разговорное *بیارید* (вместо *بیاورید*) — так такие объявления часто и пишут.
  fa.a2.unit09.lesson03.teach.i_will_bring_bill:
    title: Говорим, что принесём
    gloss: Я принесу квитанцию за воду.
    note: '*میارم* — обычная разговорная форма от *می‌آورم* (я приношу).'
  fa.a2.unit09.lesson04.teach.turn01:
    title: Сотрудник приветствует سارا
    gloss: Сотрудник приглашает её подойти и спрашивает, чем может помочь.
    note: '*بفرمایید* приглашает её подойти; *چه کمکی از دستم برمیاد؟* — вежливый, обычный способ предложить помощь для сотрудника.'
  fa.a2.unit09.lesson04.teach.turn02:
    title: سارا просит записать её на приём
    gloss: سارا говорит, что хотела бы записаться на приём, чтобы изменить адрес.
    note: Снова используется модель просьбы с *می‌خواستم* из второго урока.
  fa.a2.unit09.lesson04.teach.turn03:
    title: Сотрудник спрашивает, с каких пор
    gloss: Сотрудник спрашивает, с каких пор она живёт по новому адресу.
    note: '*از کی...؟* значит «с каких пор?».'
  fa.a2.unit09.lesson04.teach.turn04:
    title: سارا отвечает и спрашивает, что принести
    gloss: Она отвечает, что с прошлого месяца, и спрашивает, что ей нужно принести.
    note: Соединяет факт *از ماه پیش* с вопросом *می‌شه بگید...؟* из второго урока.
  fa.a2.unit09.lesson04.teach.turn05:
    title: Сотрудник перечисляет документы
    gloss: Сотрудник говорит, что достаточно старого национального удостоверения личности и квитанции за воду или электричество.
    note: '*کافیه* (разговорное от *کافی است*) значит «достаточно».'
  fa.a2.unit09.lesson04.teach.turn06:
    title: سارا предлагает день
    gloss: Она спрашивает, можно ли прийти во вторник.
    note: '*می‌تونم...؟* спрашивает о возможности или разрешении; это разговорная форма от *می‌توانم*.'
  fa.a2.unit09.lesson04.teach.turn07:
    title: Сотрудник подтверждает и называет код отслеживания
    gloss: Сотрудник подтверждает вторник, десять часов, и называет код отслеживания 2214.
    note: '*کد پیگیری* — это код отслеживания записи на приём.'
