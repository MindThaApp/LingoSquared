    title: Собеседование
teaching:
  fa.a2.unit14.lesson01.teach.interview_word:
    title: Собеседование
    gloss: собеседование
    note: '*مصاحبه* — основное слово для обозначения собеседования.'
    example_gloss: Завтра у меня собеседование.
  fa.a2.unit14.lesson01.teach.experience_word:
    title: Опыт
    gloss: опыт
    note: '*تجربه* — основное слово для обозначения опыта.'
    example_gloss: У меня три года опыта работы.
  fa.a2.unit14.lesson01.teach.skill_word:
    title: Навык
    gloss: навык
    note: '*مهارت* — основное слово для обозначения навыка.'
    example_gloss: Какими навыками вы обладаете?
  fa.a2.unit14.lesson01.teach.salary_word:
    title: Зарплата
    gloss: зарплата
    note: '*حقوق* значит «зарплата».'
    example_gloss: Какая зарплата на этой работе?
  fa.a2.unit14.lesson01.teach.job_opportunity_word:
    title: Вакансия
    gloss: вакансия
    note: '*فرصت شغلی* значит «вакансия», «возможность трудоустройства».'
    example_gloss: Это хорошая вакансия.
  fa.a2.unit14.lesson01.teach.resume_word:
    title: Резюме
    gloss: резюме
    note: '*رزومه* — стандартное персидское слово для резюме (заимствовано из французского), как и в русском.'
    example_gloss: Я отправил(а) своё резюме.
  fa.a2.unit14.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — распространённый соединительный союз, который встречается во всём этом разделе.'
    target_text: و (и)
  fa.a2.unit14.lesson01.teach.ra_note:
    title: Object marker
    gloss: (отмечает определённое прямое дополнение)
    note: '*رو* (в разговорной речи вместо книжного *را*) отмечает определённое прямое дополнение — оно ставится сразу после того, на что направлено действие.'
    target_text: رو (показатель прямого дополнения)
  fa.a2.unit14.lesson02.teach.three_years_experience:
    title: Называем опыт работы с указанием срока
    gloss: У меня три года опыта работы.
    note: '*سه سال تجربه‌ی کار* указывает срок опыта — это шаг вперёд по сравнению с уровнем A1, где мы просто называли профессию.'
  fa.a2.unit14.lesson02.teach.can_start_next_week:
    title: Говорим, когда можем приступить
    gloss: Я могу начать со следующей недели.
    note: '*از هفته‌ی دیگه* («со следующей недели») показывает, когда ты можешь приступить к работе.'
  fa.a2.unit14.lesson02.teach.clarifying_question:
    title: Задаём уточняющий вопрос
    gloss: Какой рабочий график у этой работы?
    note: '*ساعت کاری این شغل چطوره؟* — естественный уточняющий вопрос к работодателю.'
  fa.a2.unit14.lesson03.teach.salesperson_word:
    title: Продавец
    gloss: продавец
    note: '*فروشنده* — основное слово для обозначения продавца.'
    example_gloss: Магазину нужен продавец.
  fa.a2.unit14.lesson03.teach.at_least_word:
    title: Как минимум
    gloss: как минимум / минимум
    note: '*حداقل* значит «как минимум», «минимум».'
    example_gloss: Нужен опыт не менее одного года.
  fa.a2.unit14.lesson03.teach.posting_text:
    title: Объявление о вакансии
    gloss: Магазину нужен продавец с опытом работы не менее одного года. Достойная зарплата. Собеседования пройдут на этой неделе.
    note: Короткое объявление о вакансии в нейтральном письменном стиле, хотя в нём всё же есть разговорные формы *داره* и *می‌شه*.
  fa.a2.unit14.lesson04.teach.tell_me_about_experience:
    title: Расскажите о своём опыте
    gloss: Пожалуйста, расскажите о своём опыте работы.
    note: '*لطفاً از تجربه‌ی کاریتون بگید.* — стандартная фраза, с которой интервьюер начинает разговор.'
  fa.a2.unit14.lesson04.teach.turn01:
    title: مصاحبه‌کننده спрашивает об опыте
    gloss: Интервьюер просит آرش рассказать о своём опыте работы.
    note: Здесь повторяется начальная фраза из этого урока.
  fa.a2.unit14.lesson04.teach.turn02:
    title: آرش рассказывает о своём опыте
    gloss: آرش говорит, что три года проработал в офисе.
    note: Здесь повторяется модель из урока 2 для срока опыта, но в немного другой форме.
  fa.a2.unit14.lesson04.teach.turn03:
    title: مصاحبه‌کننده спрашивает о навыках
    gloss: Интервьюер спрашивает, какими навыками он обладает.
    note: '*چه مهارت‌هایی دارید؟* — вопрос именно о навыках.'
  fa.a2.unit14.lesson04.teach.turn04:
    title: آرش рассказывает о своих навыках
    gloss: آرش говорит, что хорошо работает в команде и решает задачи.
    note: '*تو ... خوبم* («я хорош в ...») называет навык.'
  fa.a2.unit14.lesson04.teach.turn05:
    title: مصاحبه‌کننده спрашивает, когда он может приступить
    gloss: Интервьюер спрашивает, может ли он начать со следующей недели.
    note: Здесь повторяется модель из урока 2 о сроках начала работы, но в форме вопроса.
  fa.a2.unit14.lesson04.teach.turn06:
    title: آرش подтверждает
    gloss: آرش говорит, что да, может.
    note: Короткое и прямое подтверждение.
