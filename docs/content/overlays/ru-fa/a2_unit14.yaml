  fa.a2.unit14.lesson01.interview_vocabulary:
    title: Слова для собеседования
  fa.a2.unit14.lesson02.describing_experience_and_availability:
    title: Рассказываем об опыте и о сроках начала работы
  fa.a2.unit14.lesson03.reading_a_job_posting:
    title: Читаем объявление о вакансии
