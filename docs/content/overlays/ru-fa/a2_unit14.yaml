      status: correct
    - value: می‌تونم از هفته‌ی دیگه شروع کنم
      status: correct
    feedback: '*می‌تونم از هفته‌ی دیگه شروع کنم.* — так отвечают, когда можно начать.'
  fa.a2.unit14.lesson02.exercise04.translate_experience_and_availability:
    instruction: 'Переведи на фарси: У меня три года опыта работы, и я могу начать со следующей недели.'
    accepted_answers:
    - value: من سه سال تجربه‌ی کار دارم و می‌تونم از هفته‌ی دیگه شروع کنم.
      status: correct
    - value: من سه سال تجربه‌ی کار دارم، می‌تونم از هفته‌ی دیگه شروع کنم.
      status: correct
    - value: من سه سال تجربه‌ی کار دارم. می‌تونم از هفته‌ی دیگه شروع کنم.
      status: correct
    feedback: Соединить два предложения можно через *و*, запятую или поставить точку — все варианты здесь одинаково естественны.
  fa.a2.unit14.lesson02.exercise05.write_clarifying_question:
    instruction: 'Напиши: какой рабочий график у этой работы?'
    accepted_answers:
