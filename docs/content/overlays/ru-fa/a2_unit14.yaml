    feedback: '*می‌تونم از هفته‌ی دیگه شروع کنم.* — так сообщают, когда можно приступить к работе.'
  fa.a2.unit14.lesson02.exercise03.dialogue_response_availability:
    instruction: 'Интервьюер спрашивает: «Когда вы можете начать?» Ответь, что можешь начать со следующей недели.'
    accepted_answers:
