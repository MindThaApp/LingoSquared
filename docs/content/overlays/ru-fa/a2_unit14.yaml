      status: correct
    feedback: '*من سه سال تجربه‌ی کار دارم.* — так говорят о трёх годах опыта.'
  fa.a2.unit14.lesson02.exercise02.order_can_start_next_week:
    instruction: 'Расставь слова так, чтобы получилось: «Я могу начать со следующей недели».'
