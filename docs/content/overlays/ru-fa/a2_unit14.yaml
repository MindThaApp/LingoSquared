course:
  title: Персидский A2
  description: 'Персидский (Иран) для уровня ниже среднего: рассказываем об опыте работы и о том, когда можно приступить, читаем объявление о вакансии и понимаем простое собеседование от вопроса до ответа.'
units:
  fa.a2.unit14.job_interview:
    title: Собеседование
