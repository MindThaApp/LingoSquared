  fa.a2.unit14.lesson02.exercise01.recognize_experience_sentence:
    instruction: Какое предложение называет опыт работы с указанием срока?
    correct_option: У меня три года опыта работы.
    distractors:
    - Я могу начать со следующей недели.
    - Какой рабочий график у этой работы?
