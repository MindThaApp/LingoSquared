course:
  title: Персидский A2
  description: 'Персидский (иранский) язык для уровня ниже среднего: сообщить смотрителю дома о протекающей трубе, прочитать подтверждение заявки на ремонт и понять телефонный разговор, в котором договариваются о починке.'
units:
  fa.a2.unit13.maintenance:
    title: Сообщаем о бытовой проблеме
lessons:
  fa.a2.unit13.lesson01.maintenance_vocabulary:
    title: Слова о бытовых проблемах
  fa.a2.unit13.lesson02.reporting_the_problem:
    title: Сообщаем о проблеме
  fa.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Читаем уведомление о ремонте
  fa.a2.unit13.lesson04.maintenance_call_dialogue:
    title: Телефонный разговор
teaching:
  fa.a2.unit13.lesson01.teach.pipe_word:
    title: Труба
    gloss: труба
    note: '*لوله* — общее слово для обозначения трубы.'
    example_gloss: Труба в ванной течёт.
  fa.a2.unit13.lesson01.teach.leak_word:
    title: Протечка
    gloss: протечка / капание
    note: '*چکه* означает «протечка» или «капание» и употребляется с *کردن*: *چکه کردن* («протекать, капать»).'
    example_gloss: Труба течёт.
  fa.a2.unit13.lesson01.teach.radiator_word:
    title: Радиатор
    gloss: радиатор / батарея
    note: '*شوفاژ* — распространённое персидское слово для радиатора или отопительной батареи.'
    example_gloss: Радиатор сломался.
  fa.a2.unit13.lesson01.teach.broken_word:
    title: Сломано
    gloss: сломанный
    note: '*خراب* значит «сломанный, испорченный»; используется с *شدن* в выражении *خراب شدن* (ломаться, выходить из строя).'
    example_gloss: Радиатор сломался.
  fa.a2.unit13.lesson01.teach.super_word:
    title: Консьерж
    gloss: консьерж / смотритель дома
    note: '*سرایدار* — человек, который следит за жилым домом и поддерживает в нём порядок.'
    example_gloss: Я позвонил консьержу.
  fa.a2.unit13.lesson01.teach.repair_word:
    title: Ремонт
    gloss: ремонт
    note: '*تعمیر* — общее слово для обозначения ремонта.'
    example_gloss: Когда придут это чинить?
  fa.a2.unit13.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — самый частый соединительный союз, он встречается во всём этом разделе.'
    target_text: و (и)
  fa.a2.unit13.lesson01.teach.ra_note:
    title: Object marker
    gloss: (показывает определённое прямое дополнение)
    note: '*رو* (разговорная форма письменного *را*) показывает определённое прямое дополнение и стоит сразу после того, над чем совершается действие.'
    target_text: رو (показатель прямого дополнения)
  fa.a2.unit13.lesson02.teach.pipe_leaking:
    title: Сообщить о проблеме
    gloss: Труба в ванной течёт.
    note: '*داره چکه می‌کنه* — это настоящее продолженное время *داره + глагол*: оно описывает проблему, которая происходит сейчас, а не разовый факт.'
  fa.a2.unit13.lesson02.teach.when_can_repair:
    title: Спросить, когда придут чинить
    gloss: Когда вы сможете прийти это починить?
    note: '*کی می‌تونید ...؟* — вежливый вопрос о том, когда человек сможет что-то сделать.'
  fa.a2.unit13.lesson02.teach.full_report_and_question:
    title: Сообщение о проблеме и вопрос вместе
    gloss: В ванной течёт труба. Когда вы сможете прийти это починить?
    note: Полная модель «сообщение + вопрос», на которой построен этот урок.
  fa.a2.unit13.lesson03.teach.request_word:
    title: Заявка
    gloss: заявка
    note: '*درخواست* — общее слово для просьбы или заявки; здесь оно употреблено с *ثبت شد* («зарегистрирована»).'
    example_gloss: Ваша заявка на ремонт зарегистрирована.
  fa.a2.unit13.lesson03.teach.repairman_word:
    title: Мастер
    gloss: мастер по ремонту
    note: '*تعمیرکار* — человек, который приходит выполнить ремонт.'
    example_gloss: Мастер придёт завтра.
  fa.a2.unit13.lesson03.teach.notice_text:
    title: Подтверждение заявки на ремонт
    gloss: Ваша заявка на ремонт зарегистрирована. Мастер придёт завтра в 10 утра. Пожалуйста, будьте дома.
    note: Короткое официальное подтверждение в нейтральном письменном стиле, но в нём всё равно встречаются разговорные *میاد* и *خونه*.
  fa.a2.unit13.lesson04.teach.since_when:
    title: Спросить, с каких пор
    gloss: С каких пор это так?
    note: '*از کی این‌طوریه؟* — вопрос о том, как давно существует проблема.'
  fa.a2.unit13.lesson04.teach.turn01:
    title: سارا сообщает о проблеме
    gloss: سارا здоровается и говорит, что в её ванной течёт труба.
    note: Здесь повторяется модель настоящего продолженного времени из второго урока.
  fa.a2.unit13.lesson04.teach.turn02:
    title: سرایدار спрашивает, с каких пор
    gloss: Консьерж спрашивает, с каких пор это так.
    note: Здесь повторяется вопрос, с которого начинается этот урок.
  fa.a2.unit13.lesson04.teach.turn03:
    title: سارا называет срок и добавляет подробности
    gloss: 'سارا говорит: с вчерашнего дня. Вода течёт на пол.'
    note: '*از دیروز* («со вчерашнего дня») указывает срок; второе предложение добавляет подробности.'
  fa.a2.unit13.lesson04.teach.turn04:
    title: سرایدار соглашается прийти
    gloss: 'Консьерж говорит: хорошо, завтра утром приду и починю.'
    note: '*میام* (разговорная форма письменного *می‌آیم*, «я приду») выражает его собственный план.'
  fa.a2.unit13.lesson04.teach.turn05:
    title: سارا подтверждает, что будет дома
    gloss: 'سارا говорит: спасибо, я дома до 11 часов.'
    note: '*خونه‌ام* (разговорная форма письменного *خانه هستم*, «я дома») сообщает о её собственной доступности.'
  fa.a2.unit13.lesson04.teach.turn06:
    title: سرایدار подтверждает
    gloss: 'Консьерж говорит: отлично, тогда увидимся.'
    note: '*می‌بینمتون* («увидимся») — вежливое завершение разговора.'
