    note: В *تولدم دهم اردیبهشته* к названию месяца добавляется разговорное *-ه* («есть, является»), как и в других датах, которые ты уже видел(а).
  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: Приглашение / обязательно / я приду
