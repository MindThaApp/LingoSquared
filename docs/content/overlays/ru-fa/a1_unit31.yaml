    title: Когда у тебя день рождения?
    gloss: Когда у тебя день рождения?
    note: '*تولدت کِیه؟* состоит из *تولد* + неформального притяжательного окончания *-ت* («твой», как в *چند سالته؟*) + *کِیه* (*کِی* + разговорное *-ه*, «есть, является»).'
