  fa.a1.unit31.lesson01.teach.review_words:
    title: Сегодня / год / у меня есть / и
    gloss: сегодня / год / у меня есть / и
    note: Знакомые слова *امروز*, *سال*, *دارم* и *و* снова встречаются здесь, когда мы говорим о праздниках.
    target_text: امروز (сегодня) / سال (год) / دارم (у меня есть) / و (и)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: День рождения + мой + есть = у меня день рождения
    gloss: день рождения + мой + есть = у меня день рождения
    note: '*تولد* + притяжательное окончание *-م* («мой») + разговорное *-ه* («есть, является») дают *تولدمه* — «у меня день рождения».'
    target_text: تولد (день рождения) + م + ه = تولدمه (это мой день рождения)
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: Сегодня мой день рождения, и у меня вечеринка
    gloss: Сегодня мой день рождения, и у меня вечеринка
    note: '*امروز تولدمه و مهمونی دارم* состоит из *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*.'
  fa.a1.unit31.lesson02.teach.key_word:
    title: Когда
    gloss: когда
    note: '*کِی* означает «когда» — обрати внимание на знак касры, который отличает его от *کی* («кто»).'
    example_gloss: Когда вечеринка?
