  fa.a1.unit31.lesson05.teach.review_barash:
    title: Для тебя -> для него/неё
    gloss: для тебя -> для него/неё
    note: '*براش* («для него/неё») — форма 3-го лица к *برات* («для тебя»).'
    target_text: برات (для тебя) -> براش (для него/неё)
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: Он/она / это Нимы / он/она приходит
    gloss: он/она / это день рождения Нимы / он/она приходит
    note: '*او* и *میاد* нужны, чтобы говорить о *نیما* в 3-м лице; *نیماست* состоит из *نیما* + *است* («есть, является»).'
    target_text: او (он/она) / نیماست (это Нимы) / میاد (он/она придёт)
