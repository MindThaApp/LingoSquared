    title: Ты придёшь на мою вечеринку по случаю дня рождения?
    gloss: Ты придёшь на мою вечеринку по случаю дня рождения?
    note: В *میای به مهمونی تولدم؟* собраны все элементы этого урока.
  fa.a1.unit31.lesson03.teach.review_are:
    title: Ага
