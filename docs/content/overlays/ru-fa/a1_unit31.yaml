course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: слова о праздниках и дне рождения (день рождения, вечеринка, торт, подарок), вопрос и рассказ о том, когда твой день рождения (*تولدت کِیه؟*) с уже изученными месяцами и порядковыми числительными, приглашение на вечеринку и ответ на него (*میای به مهمونی؟* / *آره، حتماً میام*), диалог Нимы и Сары о дне рождения со словами *تولدت مبارک* («с днём рождения»), текст для чтения о дне рождения Нимы и итоговое повторение: назови праздники, которые тебе нравятся, и напиши своё приглашение или поздравление.'
