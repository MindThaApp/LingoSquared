    title: Праздник
    gloss: праздник
    note: '*جشن* — общее слово для «празднования, торжества»; оно отличается от более конкретного *مهمونی* («вечеринка»).'
    example_gloss: Это праздник по случаю моего дня рождения.
  fa.a1.unit31.lesson06.teach.review_ha_plural:
    title: Праздники / дни рождения
    gloss: праздники / дни рождения
    note: В *جشن‌ها* и *تولدها* суффикс множественного числа *-ها* присоединяется прямо к *جشن*/*تولد*.
    target_text: جشن‌ها (праздники) / تولدها (дни рождения)
  fa.a1.unit31.lesson06.teach.review_man_ro_doost:
    title: Я / показатель прямого объекта / мне нравится
    gloss: я / показатель прямого дополнения / мне нравится
    note: '*من*, *رو* и *دوست* соединяются здесь в предложение о том, что тебе нравится, — о праздниках.'
    target_text: من (я) / رو (показатель прямого дополнения) / دوست دارم (мне нравится)
  fa.a1.unit31.lesson06.teach.wrap_summary:
    title: Я люблю праздники и дни рождения
