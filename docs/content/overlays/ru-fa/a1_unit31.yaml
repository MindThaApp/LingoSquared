    note: Слова *دعوت*, *حتماً* и *میام* снова встречаются здесь, когда мы говорим о вечеринках.
    target_text: دعوت (приглашение) / حتماً (обязательно) / میام (я приду)
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: Я прихожу -> ты приходишь (разговорная форма)
    gloss: я прихожу -> ты приходишь (неформально)
    note: '*میای* — неформальная форма для «ты» от *میام* («я прихожу»), так же как *می‌خونی* соответствует *می‌خونم*.'
    target_text: میام (я приду) -> میای (ты придёшь, неформально)
  fa.a1.unit31.lesson03.teach.review_be:
    title: В / на / к
    gloss: в, на, к
    note: Предлог *به* («в, на, к») снова встречается здесь в сочетании «на вечеринку».
    target_text: به (в, на, к)
