    gloss: Да, обязательно приду. Куплю тебе подарок.
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Нима: Как здорово! Спасибо, Сара.'
    gloss: Как здорово! Спасибо, Сара.
