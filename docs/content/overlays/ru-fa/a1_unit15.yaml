teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Это
    gloss: этот
    note: این означает «это».
    example_gloss: Это больше, чем то.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: То
    gloss: то
    note: اون означает «то» (разговорная форма от آن).
    example_gloss: То меньше, чем это.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: Больше
    gloss: больше
    note: بزرگ‌تره — разговорное сокращение от بزرگ‌تر است («больше»). بزرگ‌تر — сравнительная степень от بزرگ («большой»).
    example_gloss: Это больше, чем то.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: Меньше
    gloss: меньше
    note: کوچیک‌تره — разговорное сокращение от کوچیک‌تر است («меньше»).
    example_gloss: То меньше, чем это.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Чем (в сравнении)
    gloss: чем
    note: 'از указывает, с чем сравнивают: X از Y بزرگ‌تره значит «X больше, чем Y».'
    target_text: از (чем)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Дороже
    gloss: дороже
    note: گرون‌تره — разговорное сокращение от گرون‌تر است. گرون‌تر — сравнительная степень от گرون («дорогой»).
    example_gloss: Это дороже, чем то.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Дешевле
    gloss: дешевле
    note: ارزون‌تره — разговорное сокращение от ارزون‌تر است. ارزون‌تر — сравнительная степень от ارزون («дешёвый»).
    example_gloss: То дешевле, чем это.
  fa.a1.unit15.lesson03.teach.names:
    title: Нима и Сара
    gloss: Нима, Сара
    note: Распространённые иранские имена, которые встретятся в курсе.
    example_gloss:
    - Нима выше Сары.
    - Сара моложе Нимы.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Выше ростом
    gloss: выше ростом / он выше, она выше
    note: '*قد بلندتره* буквально значит «рост выше»: *قد* (рост) + *بلندتر* (выше, сравнительная степень от *بلند*, высокий/длинный) + *است* (есть), которое сокращается до *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Младше
    gloss: моложе / он моложе, она моложе
    note: جوون‌تره — разговорное сокращение от جوون‌تر است. جوون‌تر — сравнительная степень от جوون («молодой»).
    example_gloss: Сара моложе Нимы.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: Лучше
    gloss: лучше
    note: '*بهتره* — разговорное сокращение от *بهتر است*. *بهتر* («лучше») — особая, неправильная сравнительная степень от *خوب* («хороший»).'
    example_gloss: Это лучше, чем то.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: Хуже
    gloss: хуже
    note: '*بدتره* — разговорное сокращение от *بدتر است*. *بدتر* («хуже») — правильная сравнительная степень от *بد* («плохой»): то же слово плюс обычное окончание *تر*, в отличие от *بهتر*, которое образуется нерегулярно.'
    example_gloss: То хуже, чем это.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Потому что
    gloss: потому что
    note: چون вводит причину.
    target_text: چون (потому что)
  fa.a1.unit15.lesson04.teach.va_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет два предложения или два элемента.
    target_text: و (и)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Пример текста со сравнением
    gloss: Нима выше Сары. Сара моложе Нимы.
    note: Короткое сравнение о третьем лице с лексикой этого урока.
  fa.a1.unit15.lesson06.teach.names:
    title: Нима и Сара
    gloss: Нима, Сара
    example_gloss:
    - Нима сказал, что это дороже.
    - Сара сказала, что то дешевле.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Но
    gloss: но
    note: ولی означает «но» и вводит противопоставление.
    target_text: ولی (но)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Ага
    gloss: ага
    note: آره — разговорная форма слова بله («да»).
    example_gloss: Ага, верно.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Нима говорит
    gloss: Это дороже, чем то, но лучше.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Сара отвечает
    gloss: Ага, но то дешевле.
