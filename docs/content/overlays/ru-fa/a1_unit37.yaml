  fa.a1.unit37.lesson01.teach.soorati:
    title: Розовый
    gloss: розовый
    note: '*صورتی* описывает что-то розовое.'
    example_gloss: Моя рубашка розовая.
  fa.a1.unit37.lesson01.teach.review_known_colors:
    title: 'Уже знакомые цвета: белый / чёрный / красный / синий / зелёный / коричневый'
    gloss: цвет / белый / чёрный / красный / синий / зелёный / коричневый
    note: '*رنگ* («цвет»), *سفید*, *سیاه*, *قرمز* и *آبی* уже были в разделе об одежде; *سبز* и *قهوه‌ای* — в разделе о внешности. В этом разделе все они используются снова, без повторного объяснения.'
    target_text: رنگ (цвет) / سفید (белый) / سیاه (чёрный) / قرمز (красный) / آبی (синий, голубой) / سبز (зелёный) / قهوه‌ای (коричневый) -- уже известны из прошлых разделов
  fa.a1.unit37.lesson02.teach.banafsh:
    title: Фиолетовый
    gloss: фиолетовый
    note: '*بنفش* описывает что-то фиолетовое.'
    example_gloss: Моя книга фиолетовая.
  fa.a1.unit37.lesson02.teach.khakestari:
    title: Серый
    gloss: серый
    note: '*خاکستری* обозначает серый цвет.'
    example_gloss: Стол серый.
  fa.a1.unit37.lesson02.teach.review_negation:
    title: Машина не чёрная, а белая
    gloss: Машина не чёрная, а белая.
    note: '*نیست* отрицает слитную связку, которую ты уже встречал(а) в разделе об эмоциях. Это та же модель, что и *تنبل نیست* («он/она не ленив(а)») из раздела о характере.'
    target_text: ماشین سیاه نیست، سفیده. (Машина не чёрная, а белая.) -- نیست отрицает слитную связку
  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: Какого он цвета?
    gloss: Какого он цвета?
    note: В слове *رنگش* к *رنگ* («цвет») присоединён притяжательный суффикс *ش* («его/её»), как в *شخصیتش*, *موهاش*, *چشماش*. Слово *چیه؟* («что это?») ты уже знаешь из раздела о знакомстве (*اسم شما چیه؟*).
  fa.a1.unit37.lesson03.teach.che_rangiye:
    title: Какого он цвета? (другой вариант)
    gloss: Какого он цвета?
    note: '*چه رنگیه؟* — ещё один, не менее частый способ задать тот же вопрос. Модель такая же, как в *چه جوریه؟* из раздела о характере.'
  fa.a1.unit37.lesson03.teach.answer_rang_mashinam:
    title: Моя машина синяя
    gloss: Моя машина синяя.
    note: В слове *ماشینم* к *ماشین* («машина») присоединён притяжательный суффикс *م* («мой»), как в *اسمم* и *پدرم*.
  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: Два способа спросить о цвете
    gloss: какого он цвета? / какого он цвета?
    note: '*رنگش چیه؟* и *چه رنگیه؟* задают один и тот же вопрос и взаимозаменяемы в разговорной речи.'
    target_text: رنگش چیه؟ (какого он цвета? -- ش притяжательный суффикс, как в شخصیتش/موهاش/چشماش) / چه رنگیه؟ (другая формулировка, та же модель, что چه جوریه؟)
  fa.a1.unit37.lesson04.teach.ketabet:
    title: Какого цвета твоя книга?
    gloss: Какого цвета твоя книга?
    note: '*کتابت* — это слово *کتاب* («книга») с неформальным притяжательным суффиксом *ت* («твой»). Тот же приём, что и в *شخصیتت* из урока о характере, в обращении на *تو*.'
  fa.a1.unit37.lesson04.teach.mashinet:
    title: Какого цвета твоя машина?
    gloss: Какого цвета твоя машина?
    note: В слове *ماشینت* тот же неформальный притяжательный суффикс *ت* присоединён к *ماشین* («машина»).
  fa.a1.unit37.lesson04.teach.review_dislike_like:
    title: Мне нравится синий цвет
    gloss: Мне нравится синий цвет.
    note: '*دوست دارم* («мне нравится») и *رو* (показатель прямого дополнения) ты уже знаешь из раздела о предпочтениях.'
    target_text: رنگ آبی رو دوست دارم. (Мне нравится синий цвет.) -- снова دوست دارم/رو из раздела о предпочтениях
  fa.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Нима: Сара, какого цвета твоя книга?'
    gloss: Сара, какого цвета твоя книга?
  fa.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Сара: Фиолетовая. А какого цвета твоя машина?'
    gloss: Фиолетовая. А какого цвета твоя машина?
  fa.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Нима: Синяя. Я очень люблю синий цвет.'
    gloss: Синяя. Я очень люблю синий цвет.
  fa.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Сара: Я тоже люблю фиолетовый цвет.'
    gloss: Я тоже люблю фиолетовый цвет.
  fa.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Нима: Классно!'
    gloss: Классно!
