    gloss: есть
    note: '*هست* означает «есть, имеется». Ты уже встречал(а) это слово в диалоге о маршруте в разделе о местах (*یه رستوران هست* — «есть ресторан»).'
  fa.a1.unit37.lesson06.teach.self_color_preference:
