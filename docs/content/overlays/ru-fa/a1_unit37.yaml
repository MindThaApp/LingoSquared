  fa.a1.unit37.lesson05.teach.reading_text:
    title: 'Чтение: Мой дом'
    gloss: Мой дом белый. В доме есть серый стол. На столе лежат красная книга и жёлтая книга. Моя кошка тоже там, она рыжая.
    note: В тексте описаны цвета нескольких обычных предметов в доме.
