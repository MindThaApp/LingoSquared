  fa.a1.unit37.lesson06.teach.review_all_colors:
    title: Жёлтый / оранжевый / розовый / фиолетовый / серый — пять новых цветов этого урока
    gloss: жёлтый / оранжевый / розовый / фиолетовый / серый
    note: Это пять новых названий цветов из этого раздела.
