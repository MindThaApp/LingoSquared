teaching:
  fa.a2.unit51.short_story.lesson01.teach.place_words:
    title: Места и угощения для выходного дня
    gloss: зоопарк, лодка, парк аттракционов, мороженое
    note: '*سوار قایق شدن* означает «сесть в лодку / покататься на лодке».'
    example_gloss:
    - Вчера мы ходили в зоопарк.
    - Мы покатались на лодке.
    - Завтра мы идём в парк аттракционов.
    - Мы ели мороженое.
  fa.a2.unit51.short_story.lesson01.teach.we_past_verbs:
    title: 'Что мы делали: прошедшее время с ـیم'
    gloss: мы пошли, мы увидели, мы купили, мы поели, мы взяли, мы сели
    note: Окончание прошедшего времени для «мы» — *ـیم*. Глагол обычно стоит в конце предложения.
    example_gloss:
    - Мы увидели львов и слонов.
    - Мы купили билеты.
    - Мы сфотографировали.
    - Мы сели в лодку.
  fa.a2.unit51.short_story.lesson01.teach.order_words:
    title: Слова, которые задают порядок событий
    gloss: сначала, потом, после этого, в конце
    note: '*بعدش* и *بعد* оба значат «потом, после этого». *آخرش* — «в конце концов, наконец»; с него начинается последнее событие.'
    example_gloss:
    - Сначала мы купили билеты.
    - Потом мы увидели льва.
    - После этого мы фотографировались.
    - В конце мы поели мороженого.
  fa.a2.unit51.short_story.lesson01.teach.tell_in_order:
    title: Рассказываем о дне по порядку
    gloss: Сначала мы пошли в зоопарк, потом покатались на лодке, в конце пошли в парк аттракционов.
    note: 'Рассказ следует порядку событий. Ставь *اول*, *بعدش* или *بعد* и *آخرش* в начало каждой части, а в каждой части — глагол в прошедшем времени. *ما* можно опустить: окончание *ـیم* уже означает «мы».'
  fa.a2.unit51.short_story.lesson02.teach.they_past_verbs:
    title: 'Что они делали: прошедшее время с ـن'
    gloss: они пошли, они увидели, они купили, они поели, они приехали, они вернулись
    note: В прошедшем времени «они» оканчивается на *ـن* (*رفتن*), а «мы» — на *ـیم* (*رفتیم*). Разговорное *ـن* совпадает по форме со словарной формой глагола, поэтому о том, кто действует, говорит контекст.
    example_gloss:
    - Сара и Нима вчера ходили в зоопарк.
    - Они увидели льва.
    - Они купили билеты.
    - В конце они вернулись домой.
  fa.a2.unit51.short_story.lesson02.teach.feeling_verbs:
    title: Испугался, засмеялся
    gloss: он/она испугался/испугалась, он/она засмеялся/засмеялась, они испугались, они засмеялись
    note: '*ترسید* и *خندید* — формы для «он/она», а *ترسیدن* и *خندیدن* — формы для «они».'
    example_gloss:
    - Нима испугался.
    - Сара засмеялась.
    - Сара и Нима много смеялись.
    - Они испугались.
  fa.a2.unit51.short_story.lesson02.teach.when_past:
    title: وقتی в рассказе
    gloss: Когда они приехали, они купили билеты. Когда они сели в лодку, Нима испугался.
    note: В рассказе после *وقتی* идёт глагол в прошедшем времени, а затем главный глагол в прошедшем времени. Часть с *وقتی* называет момент, а главная часть говорит, что тогда произошло.
  fa.a2.unit51.short_story.lesson02.teach.people_events:
    title: Начало рассказа
    gloss: Сара и Нима вчера ходили в зоопарк.
    note: Рассказ обычно начинается с того, кто, когда и где.
  fa.a2.unit51.short_story.lesson03.teach.progressive_forms:
    title: Что происходило в тот момент
    gloss: мы шли, он/она/оно шёл/шла/шло, они ели, он/она фотографировал/фотографировала
    note: '*داشت* плюс глагол с *می‌* показывает действие, которое шло в какой-то момент в прошлом. Используй это для того, что происходило, когда случилось что-то другое.'
    example_gloss:
    - Мы шли в зоопарк.
    - Сара фотографировала.
    - Они ели мороженое.
    - Я фотографировал.
    - Лодка плыла.
  fa.a2.unit51.short_story.lesson03.teach.progressive_note:
    title: Два действия одновременно
    gloss: Пока лодка плыла, Сара фотографировала.
    note: Первая часть задаёт обстановку (*قایق داشت می‌رفت*), вторая говорит, что ещё происходило (*سارا داشت عکس می‌گرفت*). Эта форма используется только в утверждениях, не в отрицаниях.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_forms:
    title: Что уже произошло раньше
    gloss: он/она купил/купила (раньше), мы ходили (раньше), они приехали (раньше), я видел (раньше)
    note: '*بود/بودیم/بودن/بودم* после формы глагола на *ـه* выражает действие, завершившееся раньше другого прошедшего события.'
    example_gloss:
    - Нима уже купил билеты.
    - Мы уже ходили туда раньше.
    - Они уже приехали.
    - Я уже видел льва раньше.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_note:
    title: То, что случилось раньше
    gloss: Когда мы приехали, Нима уже купил билеты.
    note: Эта форма показывает, что одно прошедшее событие произошло раньше другого. Два события здесь — *رسیدیم* (позже) и *خریده بود* (раньше).
  fa.a2.unit51.short_story.lesson04.teach.habit_words:
    title: Каждый год, когда я был ребёнком
    gloss: каждый год, я был ребёнком, моя мама
    note: '*هر سال* и *وقتی بچه بودم* показывают, что в прошлом что-то происходило снова и снова.'
    example_gloss:
    - Каждый год мы ходили в парк аттракционов.
    - Когда я был ребёнком, мы ходили туда с мамой.
    - Моя мама любит парки аттракционов.
  fa.a2.unit51.short_story.lesson04.teach.perfect_forms:
    title: Ты когда-нибудь...?
    gloss: до сих пор / когда-либо, я был, я не был, мы были, ты сел
    note: '*تا حالا* спрашивает или сообщает, случилось ли что-то до настоящего момента. В разговорной речи можно использовать и простое прошедшее время: *تا حالا سوار قایق شدی؟*'
    example_gloss:
    - Я ни разу не был в парке аттракционов.
    - Ты когда-нибудь катался на лодке?
    - Мы были в зоопарке.
  fa.a2.unit51.short_story.lesson04.teach.tense_choice:
    title: Какое прошедшее время для какого рассказа?
    gloss: Мы ходили вчера; мы ходили каждый год; мы уже ходили раньше; мы уже бывали там.
    note: Простое прошедшее время используй для одного завершённого события, прошедшее с *می‌ـ* — для привычки, *بود* — для действия, случившегося раньше другого, а *تا حالا* с формой на *ـه* — для опыта до настоящего момента.
  fa.a2.unit51.short_story.lesson04.teach.ever_phrase:
    title: Спрашиваем об опыте
    gloss: Ты когда-нибудь катался на лодке? Да, один раз.
    note: 'Короткий вопрос и короткий ответ: *یه بار* значит «один раз».'
  fa.a2.unit51.short_story.lesson05.teach.reading:
    title: Выходной день
    gloss: Вчера Сара и Нима ходили в зоопарк. Когда они приехали, Нима уже купил билеты. Сначала они увидели львов и слонов. Потом они покатались на лодке. Пока лодка плыла, Нима испугался, а Сара фотографировала. После этого они пошли в парк аттракционов и много смеялись. В конце они поели мороженого и вернулись домой.
    note: Прочитай один раз, следя за порядком мест, а потом ещё раз, следя за тем, кто что делал.
  fa.a2.unit51.short_story.lesson06.teach.turn01:
    title: Нима начинает
    gloss: Сара, вчера мы отлично провели время!
    note: Нима начинает с того, как прошёл день.
  fa.a2.unit51.short_story.lesson06.teach.turn02:
    title: Сара начинает рассказ
    gloss: Да! Сначала мы пошли в зоопарк и увидели львов и слонов.
    note: '*اول* начинает пересказ.'
  fa.a2.unit51.short_story.lesson06.teach.turn03:
    title: Нима продолжает
    gloss: Потом мы сели в лодку. Когда лодка плыла, я испугался.
    note: '*بعدش* продолжает последовательность; *داشت می‌رفت* — это фон.'
  fa.a2.unit51.short_story.lesson06.teach.turn04:
    title: Сара добавляет
    gloss: Но я смеялась и фотографировала! После этого мы пошли в парк аттракционов.
    note: '*بعد* двигает рассказ дальше.'
  fa.a2.unit51.short_story.lesson06.teach.turn05:
    title: Нима заканчивает рассказ
    gloss: Наконец мы поели мороженого. Раньше я никогда не был в парке аттракционов.
    note: '*نرفته بودم* оглядывается на то, что было раньше.'
  fa.a2.unit51.short_story.lesson06.teach.turn06:
    title: Сара планирует новую поездку
    gloss: Тогда на следующей неделе поедем снова!
    note: План, выраженный простым настоящим временем.
