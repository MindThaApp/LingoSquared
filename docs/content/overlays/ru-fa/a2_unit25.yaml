teaching:
  fa.a2.unit25.lesson01.teach.time_words:
    title: Когда-либо, никогда, ещё, раньше, однажды
    gloss: когда-либо / до сих пор; никогда; всё ещё / ещё; раньше; однажды
    note: '*تا حالا* задаёт рамку жизненного опыта. *هیچ‌وقت* («никогда») употребляется с отрицательным глаголом, и *هنوز* в значении «ещё не» — тоже с отрицательным глаголом.'
    example_gloss:
    - Ты когда-нибудь был в Ширазе?
    - Я никогда не ел индийскую еду.
    - Я ещё не был в Исфахане.
    - Я уже видел этот фильм.
    - Я однажды ездил верхом на лошади.
  fa.a2.unit25.lesson01.teach.people_places:
    title: Люди и места
    gloss: я, ты, Сара, Нима, Шираз, Исфахан
    note: В персидском *من* и *تو* часто опускаются, потому что лицо видно по окончанию глагола. Сара и Нима — давние друзья.
    example_gloss:
    - Я был в Ширазе.
    - Ты был в Исфахане?
    - Сара уже бывала в Ширазе.
    - Нима ещё не был в Исфахане.
    - Я был в Ширазе.
    - Я не был в Исфахане.
  fa.a2.unit25.lesson01.teach.experiences:
    title: Еда, фильмы и верховая езда
    gloss: индийская еда, корейская еда, фильм, верхом на лошади
    note: '*رو* — разговорный показатель прямого дополнения в *این فیلم رو دیده‌م*. Выражение *سوار اسب شدن* означает «ездить верхом на лошади».'
    example_gloss:
    - Я ел индийскую еду.
    - Я не ел корейскую еду.
    - Я видел этот фильм.
    - Я ездил верхом на лошади.
  fa.a2.unit25.lesson01.teach.perfect_shape:
    title: Разговорное перфектное время
    gloss: я ходил, ел, видел, стал / ездил верхом
    note: 'Перфект образуется от причастия на *-ه* и краткого личного окончания. Для «я» в разговорной речи добавляется *-م*: *رفت + ه + م* → *رفته‌م*.'
  fa.a2.unit25.lesson01.teach.negative_shape:
    title: Отрицательный перфект
    gloss: я не ходил, не ел, не видел, не стал / не ездил верхом
    note: 'Поставь *نـ* в начало причастия: *رفته‌م* → *نرفته‌م*. С *هیچ‌وقت* глагол остаётся отрицательным.'
  fa.a2.unit25.lesson01.teach.written_recognition:
    title: 'Письменная форма: только узнавать'
    gloss: رفته‌ام — письменный вариант разговорной формы رفته‌م
    note: В аккуратной письменной речи можно встретить *رفته‌ام*. Узнавай эту форму, но в заданиях этого раздела используй разговорную *رفته‌م*.
  fa.a2.unit25.lesson02.teach.verbs:
    title: Четыре глагола опыта
    gloss: идти, есть, видеть, становиться
    note: 'Их причастия: *رفته، خورده، دیده، شده*. В сочетании с *سوار اسب* глагол *شدن* образует выражение «ездить верхом на лошади».'
    example_gloss:
    - Ездить в Шираз — приятно.
    - Есть индийскую еду — приятно.
    - Смотреть этот фильм — приятно.
    - Ездить верхом — приятно.
  fa.a2.unit25.lesson02.teach.pronouns:
    title: Он/она, мы, вы, они
    gloss: он/она, мы, вы (мн. ч./вежливо), они
    note: Эти местоимения делают окончания лица заметными. В обычной беседе местоимение опускают, если из контекста и так всё ясно.
    example_gloss:
    - Он/она бывал(а) в Ширазе.
    - Мы бывали в Ширазе.
    - Вы бывали в Ширазе?
    - Они бывали в Ширазе.
  fa.a2.unit25.lesson02.teach.clitics:
    title: Личные окончания
    gloss: я, ты, он/она, мы, вы, они бывали (ездили)
    note: 'В разговорной речи набор такой: *-م، -ای،* без окончания, *-ایم، -این، -ن*. В этом уроке отрабатываются только показанные здесь формы.'
  fa.a2.unit25.lesson02.teach.other_participles:
    title: Те же окончания на других причастиях
    gloss: ты/он/она ел(а), видел(а), ездил(а) верхом
    note: 'Личное окончание присоединяется к каждому причастию одинаково: *خورده‌ای، دیده‌ای، شده‌ای*.'
  fa.a2.unit25.lesson03.teach.specific_time:
    title: В прошлом году, вчера
    gloss: в прошлом году, вчера
    note: Эти слова называют завершённое время, поэтому используется простое прошедшее, а не перфект опыта.
    example_gloss:
    - В прошлом году я ездил(а) в Шираз.
    - Вчера я ел(а) индийскую еду.
  fa.a2.unit25.lesson03.teach.simple_past:
    title: Завершённое событие и опыт
    gloss: В прошлом году я ездил(а) в Шираз. Я бывал(а) в Ширазе.
    note: '*پارسال* указывает, когда это произошло, поэтому нужно *رفتم*. С *تا حالا* и без завершённого времени для жизненного опыта используется *رفته‌م*.'
  fa.a2.unit25.lesson04.teach.responses:
    title: Да; я тоже
    gloss: да; я тоже
    note: На вопрос об опыте отвечай той же формой перфекта. *منم* означает «я тоже».
    example_gloss:
    - Да, я был один раз.
    - Я тоже ещё этого не ел.
  fa.a2.unit25.lesson04.teach.question_pattern:
    title: Ты когда-нибудь был в Ширазе?
    gloss: Ты когда-нибудь был в Ширазе?
    note: 'Чтобы спросить об опыте, используй *تا حالا* и перфект 2-го лица *رفته‌ای؟*. В повседневной речи с *تا حالا* часто употребляют простое прошедшее: *تا حالا رفتی؟*. Оба варианта допустимы.'
  fa.a2.unit25.lesson05.teach.reading:
    title: Сообщение об опыте
    gloss: Я бывал(а) в Ширазе и раньше ел(а) индийскую еду. Я никогда не ездил(а) верхом и ещё не пробовал(а) корейскую еду. Ты когда-нибудь бывал(а) в Ширазе?
    note: Прочитай один раз, отмечая случившийся опыт, а затем ещё раз — отмечая то, что никогда не случалось или ещё не случилось.
  fa.a2.unit25.lesson06.teach.turn01:
    title: Сара спрашивает Ниму
    gloss: Нима, ты когда-нибудь бывал в Ширазе?
    note: Сара задаёт вопрос об опыте с *تا حالا*.
  fa.a2.unit25.lesson06.teach.turn02:
    title: Нима отвечает и спрашивает
    gloss: Да, один раз был. А ты когда-нибудь ела индийскую еду?
    note: Нима называет один случай опыта и задаёт встречный вопрос об опыте.
  fa.a2.unit25.lesson06.teach.turn03:
    title: Сара противопоставляет два блюда
    gloss: Да, раньше ела, но корейскую еду никогда не ела.
    note: '*ولی* противопоставляет положительный опыт тому, чего Сара никогда не делала.'
  fa.a2.unit25.lesson06.teach.turn04:
    title: Нима соглашается
    gloss: Я тоже ещё этого не ел.
    note: '*هنوز نخورده‌م* означает, что до сих пор этого не случилось.'
