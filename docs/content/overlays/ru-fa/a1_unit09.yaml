course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: базовая лексика о времени, вопрос о времени и ответ на него, части суток и договорённость о конкретном времени встречи.'
units:
  fa.a1.unit09.time:
    title: Время
lessons:
  fa.a1.unit09.lesson01.basic_time_vocabulary:
    title: Базовая лексика о времени
  fa.a1.unit09.lesson02.asking_the_time:
