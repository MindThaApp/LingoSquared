  fa.a1.unit09.lesson03.telling_the_time:
    title: Говорим, который час
  fa.a1.unit09.lesson04.parts_of_the_day:
    title: Части суток
  fa.a1.unit09.lesson05.asking_about_an_appointment:
    title: Спросить о времени встречи
  fa.a1.unit09.lesson06.meeting_time_dialogue:
    title: Договориться о времени встречи
teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Час / часы
    gloss: час / часы
    note: ساعت значит и «час», и «часы» и служит основой для называния времени.
    example_gloss: Который час?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Минута
    gloss: минута
    note: دقیقه — слово «минута».
    example_gloss: Подожди пять минут.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Половина
    gloss: половина
    note: نیم значит «половина» и используется для получаса.
    example_gloss: Половина восьмого.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Четверть
    gloss: четверть
    note: ربع значит «четверть» и используется для четверти часа.
    example_gloss: Без четверти восемь.
  fa.a1.unit09.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз, который встречается во всём разделе.
    target_text: و (и)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Спросить, который час
    gloss: Который час?
    note: ساعت چنده؟ — обычный разговорный способ спросить время.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: Разговорное стяжение -e (повторение)
    gloss: چنده — обычная разговорная форма от چند است.
    note: Это то же стяжение, которое уже встречалось в словах о погоде и покупках, например آفتابیه и تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Сказать «половина четвёртого»
    gloss: Половина четвёртого.
    note: ساعت سه و نیمه соединяет час, و («и») и стяжённое نیمه («половина»).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: Разговорное стяжение -e в слове نیم
    gloss: نیمه — обычная разговорная форма от نیم است.
    note: Та же модель, что и в چنده, только с نیم вместо چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Утро
    gloss: утро
    note: صبح называет утро как часть суток.
    example_gloss: Утром я встаю рано.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Полдень
    gloss: полдень
    note: ظهر называет полдень.
    example_gloss: В полдень я обедаю.
  fa.a1.unit09.lesson04.teach.asr:
    title: День (после полудня)
    gloss: время после полудня
    note: عصر называет время после полудня и до раннего вечера.
    example_gloss: Я работаю во второй половине дня.
  fa.a1.unit09.lesson04.teach.shab:
    title: Ночь
    gloss: ночь
    note: شب называет ночь.
    example_gloss: Я рано ложусь спать вечером.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Встреча
    gloss: встреча
    note: قرار — общее слово для обозначения договорённости о встрече или назначенной встречи.
    example_gloss: У меня встреча.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Спроси, во сколько встреча
    gloss: Во сколько встреча?
    note: قرار ساعت چنده؟ применяет вопрос о времени из урока 2 к конкретной встрече.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Назови время с частью суток
    gloss: четыре часа дня
    note: ساعت چهار عصر соединяет час со словом عصر, чтобы отличить утро от дня.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Завтра (повторение)
    gloss: завтра
    note: Слово فردا уже встречалось в одном из прошлых уроков; здесь оно помогает назначить встречу.
    example_gloss: Завтра у меня встреча.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Скажи, что немного опоздаешь
    gloss: Я немного опоздаю.
    note: В *یکم دیر می‌شه* используются разговорное *یکم* (немного) и *دیر* (поздно).
  fa.a1.unit09.lesson06.teach.turn01:
    title: Негар спрашивает, во сколько завтрашняя встреча
    gloss: Негар спрашивает, во сколько завтра встреча.
    note: قرار فردا ساعت چنده؟ сочетает вопрос о встрече из урока 5 со словом فردا (завтра).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Араш отвечает неуверенно
    gloss: Араш говорит, что, кажется, в четыре часа.
    note: فکر کنم (кажется, думаю) смягчает ответ, потому что Араш не совсем уверен.
  fa.a1.unit09.lesson06.teach.turn03:
    title: 'Негар уточняет: утра или дня'
    gloss: Негар спрашивает, четыре часа дня или утра.
    note: 'Так снимается неопределённость: одно только ساعت چهار не говорит, о каких именно четырёх часах речь.'
  fa.a1.unit09.lesson06.teach.turn04:
    title: Араш уточняет
    gloss: 'Араш говорит: днём.'
    note: Ответ в одно слово звучит естественно, когда вопрос уже задал контекст.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Негар соглашается и уточняет время прихода
    gloss: Негар соглашается и говорит, что придёт в четверть пятого.
    note: ساعت چهار و ربع соединяет час со словом ربع (четверть).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Араш спрашивает, почему лишняя четверть часа
    gloss: Араш спрашивает, почему она говорит «и четверть».
    note: '*چرا ربع؟* — короткий способ спросить: «Почему четверть?»'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Негар объясняет, что немного задержится
    gloss: Негар объясняет, что немного задержится после работы.
    note: '*چون* (потому что) вводит причину; здесь используется *یکم دیر می‌شه* (я немного опоздаю), которое ты только что выучил(а) в этом уроке.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Араш успокаивает её
    gloss: 'Араш говорит: хорошо, никаких проблем.'
    note: مشکلی نیست (нет проблем) показывает Негар, что небольшая задержка — это нормально.
