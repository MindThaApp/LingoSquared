  fa.a2.unit23.lesson05.reading_listening:
    title: Читаем и слушаем
  fa.a2.unit23.lesson06.dialogue_production:
    title: Разговор о детстве
teaching:
  fa.a2.unit23.lesson01.teach.time_words:
    title: Слова о времени в детстве
    gloss: раньше, тогда, когда я был(-а) ребёнком, каждый день, каждое лето
    note: '*قبلا* и *اون موقع* задают сцену в прошлом. *هر روز* и *هر تابستون* указывают на повторяемость, поэтому они естественно сочетаются с прошедшим временем с *می‌* для привычных действий.'
    example_gloss:
    - Я каждый день ходил(-а) в школу пешком.
    - Тогда я был(-а) ребёнком.
    - Каждое лето мы играли в парке.
  fa.a2.unit23.lesson01.teach.places:
    title: Дом и места в районе
    gloss: дом, двор, район, школа, парк
    note: '*توی* — обычная разговорная форма для «в». С *رفتن* в речи *به* можно сохранять или опускать: *به مدرسه می‌رفتم* и *می‌رفتم مدرسه*.'
    example_gloss:
    - У нашего дома был двор.
    - Наш район был тихим.
    - Я ходил(-а) в школу пешком.
    - Мы играли в парке.
  fa.a2.unit23.lesson01.teach.descriptions:
    title: Описываем места
    gloss: тихий, шумный, большой, близкий, далёкий
    note: Используй эти слова с прошедшим *بود*, чтобы описать, каким было место. В разговорной речи *دوره* значит «это далеко».
    example_gloss:
    - Район был тихим.
    - В школе было шумно.
    - Двор был большим.
    - Школа была близко.
    - Теперь парк далеко.
  fa.a2.unit23.lesson01.teach.activities:
    title: Детские занятия
    gloss: пешком, книга, футбол, играть, читать, строить
    note: '*بازی کردن* — составной глагол. В прошедшем времени повторяющегося действия *می‌* ставится перед *کردن*: *بازی می‌کردم*.'
    example_gloss:
    - Я ходил(-а) в школу пешком.
    - Я читал(-а) книги.
    - Я играл(-а) в футбол.
    - Они что-то строили во дворе.
  fa.a2.unit23.lesson01.teach.habit_shape:
    title: Форма прошедшего времени повторяющегося действия
    gloss: я ходил(-а), я читал(-а), я делал(-а), они строили (обычно)
    note: 'Для повторяющегося действия в прошлом поставь *می‌* перед основой прошедшего времени и добавь личное окончание: *می‌رفت + م* → *می‌رفتم*. После *می‌* сохраняй полупробел (ZWNJ).'
  fa.a2.unit23.lesson02.teach.people_and_links:
    title: Люди и полезные связки
    gloss: я, мы, они, с, один/какой-то, что-то, по вечерам
    note: В разговорной речи подлежащие-местоимения часто опускают; эти слова нужны, чтобы при необходимости прямо назвать лицо или обстановку.
    example_gloss:
    - Я каждый день читал(-а) книгу.
    - Мы играли в парке.
    - Они что-то строили.
    - Я играл(-а) в футбол с Нимой.
    - У нас был большой двор.
    - По вечерам мы играли.
  fa.a2.unit23.lesson02.teach.now_words:
    title: Теперь и «больше не»
    gloss: сейчас, больше не, нет, там, как
    note: '*دیگه* с отрицательным глаголом значит «больше не»: *دیگه بازی نمی‌کنم*.'
    example_gloss:
    - Теперь в районе многолюдно.
    - Я там больше не играю.
    - Нет, школа была недалеко.
    - Каким был твой район?
  fa.a2.unit23.lesson02.teach.full_forms:
    title: Личные окончания с می‌رفت
    gloss: я, ты, он/она, мы, они ходили (обычно)
    note: 'Окончания прошедшего времени те же: *-م، -ی،* без окончания, *-یم، -ن*. В разговорной речи 3-е лицо множественного числа — *می‌رفتن*.'
  fa.a2.unit23.lesson02.teach.other_habits:
    title: 'Привычки: чтение и игры'
    gloss: ты/он/мы читали (обычно); я/мы играли (обычно)
    note: 'Та же модель работает и с другими основами прошедшего времени. Составной глагол сохраняет существительное отдельно: *بازی می‌کردیم*.'
  fa.a2.unit23.lesson02.teach.past_states:
    title: Состояния в прошлом с بودن и داشتن
    gloss: я был(-а) ребёнком; район был тихим; у нас был большой двор
    note: Прошедшее время *بودن* и *داشتن* используют для описания фона. Это состояния, поэтому здесь естественны формы *بودم، بود، داشتیم* без *می‌* для привычных действий.
  fa.a2.unit23.lesson03.teach.simple_contrast:
    title: Привычка и одно событие
    gloss: Я каждый день ходил(-а) в школу. Вчера я ходил(-а) в школу.
    note: '*هر روز می‌رفتم* — повторяющееся действие в прошлом. *دیروز رفتم* — одна завершённая поездка. Выражение времени и наличие или отсутствие *می‌* работают вместе.'
  fa.a2.unit23.lesson03.teach.negative_habit:
    title: Отрицательная форма прошедшего времени повторяющегося действия
    gloss: я не ходил(-а) обычно; я не читал(-а) обычно; я не играл(-а) обычно
    note: 'Поставь *نـ* перед *می‌*: *نمی‌رفتم، نمی‌خوندم، بازی نمی‌کردم*. *نمی‌* пиши слитно с основой через полупробел (ZWNJ).'
  fa.a2.unit23.lesson04.teach.then_now:
    title: Тогда и теперь
    gloss: Раньше наш район был тихим, а теперь он шумный.
    note: Сочетай *قبلا* или *اون موقع* с описанием в прошлом, а *حالا* — с контрастом в настоящем.
  fa.a2.unit23.lesson05.teach.reading:
    title: Район моего детства
    gloss: Когда я был ребёнком, наш район был тихим. У нас был дом с большим двором. Я каждый день ходил в школу пешком. По вечерам я играл во дворе в футбол. Теперь район шумный, и я там больше не играю.
    note: В тексте сочетаются состояние в прошлом, повторявшиеся привычки и контраст с настоящим.
  fa.a2.unit23.lesson06.teach.names:
    title: Сара и Нима
    gloss: Сара, Нима
    note: Сара и Нима — уже знакомые тебе друзья в этом разговоре.
    example_gloss:
    - Сара рассказывает о своём детстве.
    - Нима рассказывает о своём районе.
  fa.a2.unit23.lesson06.teach.turn01:
    title: Сара спрашивает о старом районе
    gloss: Каким был твой район, когда ты был ребёнком?
    note: Сара спрашивает о состоянии в прошлом, используя прошедшую форму глагола «быть».
  fa.a2.unit23.lesson06.teach.turn02:
    title: Нима рассказывает о своём детстве
    gloss: Наш район был тихим. У нас был дом с большим двором. Каждый день я ходил в школу пешком, а по вечерам играл во дворе в футбол. А ты?
    note: Нима сочетает состояния в прошлом (был, было) с повторявшимися привычками (ходил, играл).
  fa.a2.unit23.lesson06.teach.turn03:
    title: Сара добавляет контраст «тогда и теперь»
    gloss: Наша школа была близко. Каждое лето мы играли в парке. Теперь парк далеко, и я там больше не играю.
    note: Сара заканчивает конструкцией *حالا ... دیگه ... نمی‌کنم*, противопоставляя настоящее прошлому.
exercises:
