    instruction: Какое значение соответствует этому предложению о привычке в прошлом?
    correct_option: Я каждый день ходил в школу.
    distractors:
    - Вчера я один раз ходил в школу.
    - Теперь я каждый день хожу в школу.
    - Я раньше не ходил в школу.
    accepted_answers:
    - value: Я каждый день ходил в школу.
      status: correct
    feedback: '*هر روز می‌رفتم مدرسه* означает «Я каждый день ходил в школу».'
  fa.a2.unit23.lesson01.exercise02.match_first_habits:
