        می‌رفت: он или она ходил(-а) (обычно)
        می‌رفتیم: мы ходили (обычно)
        می‌رفتن: они ходили (обычно)
        می‌خوندیم: мы читали (обычно)
      status: correct
    feedback: Окончания указывают на лицо, даже если местоимение опущено.
    pairs:
