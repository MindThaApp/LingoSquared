        هر تابستون: каждое лето
      status: correct
    feedback: Приставка *می‌* отмечает формы повторявшегося действия в прошлом; слова со значением времени подчёркивают повторяемость.
    pairs:
    - left: می‌رفتم
      right: я ходил(-а) (обычно)
    - left: می‌خوندم
      right: я читал(-а) (обычно)
    - left: می‌کردم
      right: я делал(-а) (обычно)
    - left: می‌ساختن
