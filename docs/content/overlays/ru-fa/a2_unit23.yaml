course:
  title: Персидский A2
  description: 'Персидский (Иран) для уровня ниже среднего с упором на грамматику: детские привычки и описания «тогда и теперь».'
units:
  fa.a2.unit23.childhood_habits:
    title: Как всё было раньше
lessons:
  fa.a2.unit23.lesson01.form_recognition:
    title: Узнаём детские привычки
  fa.a2.unit23.lesson02.form_drag:
    title: Образуем прошедшее время повторяющегося действия
  fa.a2.unit23.lesson03.habit_or_event:
    title: Повторяющаяся привычка или одно завершённое событие
  fa.a2.unit23.lesson04.neighbourhood_then_now:
