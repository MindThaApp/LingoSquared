teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: Деньги
    gloss: деньги
    note: پول — общее слово для обозначения денег.
    example_gloss: Где мои деньги?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Банк
    gloss: банк
    note: بانک — общее слово для обозначения банка.
    example_gloss: Банк рядом.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Доллар
    gloss: доллар
    note: دلار — слово «доллар» (США), самая распространённая иностранная валюта в разговорах об обмене.
    example_gloss: У меня есть доллары.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Обмен
    gloss: обмен
    note: تبدیل значит «обмен, превращение»; употребляется с глаголом کردن («делать») в сочетании تبدیل کردن.
    example_gloss: Я хочу обменять (деньги).
  fa.a1.unit21.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз, повторение из прошлых разделов.
    target_text: и
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Сказать, что хочешь обменять валюту
    gloss: Я хочу обменять доллары на туманы.
    note: В фразе می‌خوام دلار به تومن تبدیل کنم предлог به («на, в») указывает, в какую валюту меняют.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Спросить, сколько долларов
    gloss: Сколько у вас долларов?
    note: В вопросе *چقدر دلار دارید؟* используется *چقدر* («сколько»), слово, которое ты уже встречал в прежних вопросах о количестве.
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Банкомат
    gloss: банкомат
    note: خودپرداز буквально значит «сам выдающий, сам платящий»; это стандартное слово для банкомата.
    example_gloss: Банкомат вон там.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Сказать, что хочешь снять деньги
    gloss: Я хочу снять деньги в банкомате.
    note: В фразе می‌خوام از خودپرداز پول بردارم используются از («из, с») и بردارم («я снимаю, беру»).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Попросить мелочь
    gloss: У вас есть мелочь?
    note: В фразе پول خرد دارید؟ слово خرد («мелкий, мелочь») стоит после پول («деньги»).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Пожалуйста, возьмите (повторение)
    gloss: пожалуйста, возьмите / прошу
    note: '*بفرمایید* уже встречалось в одном из прошлых разделов; здесь его говорят, когда что-то передают.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Курс
    gloss: курс
    note: نرخ — слово «курс» (обмена).
    example_gloss: Какой сегодня курс?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Назвать курс за один доллар
    gloss: Каждый доллар стоит 30 туманов.
    note: В фразе هر دلار سی تومنه используются هر («каждый») и разговорное окончание -e (*تومنه* = *تومن است*), которое ты уже встречал.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: Сто
    gloss: сто
    note: صد — число 100.
    example_gloss: У меня есть сто долларов.
  fa.a1.unit21.lesson06.teach.please_do:
    title: Пожалуйста, сделайте это
    gloss: пожалуйста, обменяйте
    note: لطفاً تبدیل کنید — вежливая форма повелительного наклонения от تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Сара просит обменять валюту
    gloss: Сара здоровается со служащим и говорит, что хочет обменять доллары на туманы.
    note: Повторяется фраза می‌خوام دلار به تومن تبدیل کنم из второго урока.
  fa.a1.unit21.lesson06.teach.turn02:
    title: Служащий спрашивает, сколько долларов
    gloss: Служащий здоровается с Сарой и спрашивает, сколько у неё долларов.
    note: Повторяется вопрос چقدر دلار دارید؟ из второго урока.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Сара называет сумму и спрашивает курс
    gloss: Сара говорит, что у неё сто долларов, и спрашивает сегодняшний курс.
    note: صد («сто») — новое слово; вопрос نرخ امروز چنده؟ повторяет вопрос о курсе из пятого урока.
  fa.a1.unit21.lesson06.teach.turn04:
    title: Служащий называет курс
    gloss: Служащий говорит, что каждый доллар стоит 30 туманов.
    note: Повторяется фраза هر دلار سی تومنه из пятого урока.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Сара соглашается и просит служащего продолжить
    gloss: Сара соглашается и просит служащего обменять деньги.
    note: لطفاً تبدیل کنید — фраза, которую мы разобрали ранее в этом уроке.
  fa.a1.unit21.lesson06.teach.turn06:
    title: Кассир называет итоговую сумму
    gloss: Пожалуйста, три тысячи туманов.
    note: '*سه هزار تومن* = 100 долларов × 30 туманов за доллар. Слово *هزار* (тысяча) повторяется из раздела о числах.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Сара благодарит кассира и спрашивает, есть ли у него ещё и мелочь
    gloss: Спасибо. А мелочь у вас тоже есть?
    note: Снова встречается фраза «پول خرد دارید؟» из урока 4, теперь со словом هم («тоже»).
  fa.a1.unit21.lesson06.teach.turn08:
    title: Кассир подтверждает и передаёт деньги
    gloss: Да, пожалуйста.
    note: بله («да») — уже знакомое слово; بفرمایید завершает этот обмен репликами.
