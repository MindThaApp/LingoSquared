    gloss: семья
    note: '*خانواده* — общее слово для семьи.'
  fa.a2.unit10.lesson03.teach.message_text:
    title: Письменное сообщение с мнением
    gloss: По-моему, удалённая работа намного лучше, потому что в тегеранских пробках теряется много времени, и я могу больше быть с семьёй.
    note: Короткое письменное мнение с двумя причинами, соединёнными через *و* («и»), в разговорном стиле, каким пишут сообщения коллегам.
  fa.a2.unit10.lesson04.teach.i_dont_agree:
    title: Вежливо не соглашаемся
    gloss: Я не согласен.
    note: '*من موافق نیستم* — простой и вежливый способ не согласиться: не грубо, просто прямо.'
  fa.a2.unit10.lesson04.teach.turn01:
    title: نگار высказывает своё мнение
    gloss: نگار говорит, что, по её мнению, удалённая работа лучше.
    note: Снова модель *به نظر من ... بهتره* из второго урока.
  fa.a2.unit10.lesson04.teach.turn02:
    title: آرش не соглашается
    gloss: آرش говорит, что он не согласен.
    note: '*من موافق نیستم* — из начала этого урока.'
  fa.a2.unit10.lesson04.teach.turn03:
    title: نگار спрашивает почему
    gloss: نگار спрашивает, почему.
    note: '*چرا؟* — обычное слово «почему?».'
  fa.a2.unit10.lesson04.teach.turn04:
    title: آرش объясняет свои причины
    gloss: آرش говорит, что дома не может сосредоточиться и что ему нравится видеть коллег.
    note: Две причины, соединённые через *و* («и»).
  fa.a2.unit10.lesson04.teach.turn05:
    title: نگار уступает, но повторяет свою причину
    gloss: 'نگار говорит: хорошо, но, по её мнению, пробки отнимают много времени.'
    note: '*باشه، ولی...* («хорошо, но...») — вежливо признаёт довод собеседника, прежде чем повторить свой.'
  fa.a2.unit10.lesson04.teach.turn06:
    title: آرش соглашается, но объясняет
    gloss: آرش соглашается, что это правда, но говорит, что он привык.
    note: '*درسته، ولی...* («это верно, но...») — признаёт довод собеседника.'
