    title: И
    gloss: и
    note: '*و* — обычный соединительный союз, который встречается во всём этом разделе.'
  fa.a2.unit10.lesson02.teach.in_my_opinion_better:
    title: Высказываем мнение
    gloss: По-моему, удалённая работа лучше.
    note: '*به نظر من ...* («по моему мнению...») — стандартный способ ввести мнение на персидском.'
  fa.a2.unit10.lesson02.teach.because_traffic_wastes_time:
    title: Приводим причину с چون («потому что»)
    gloss: Потому что в тегеранских пробках теряется много времени.
    note: '*چون* вводит причину — это шаг вперёд на уровне A2 по сравнению с простыми утверждениями A1.'
  fa.a2.unit10.lesson02.teach.full_opinion_with_reason:
    title: Соединяем мнение и причину
    gloss: По-моему, удалённая работа лучше, потому что в тегеранских пробках теряется много времени.
    note: Это полная модель به نظر من ... چون ..., вокруг которой построен весь раздел.
  fa.a2.unit10.lesson03.teach.message_word:
    title: Сообщение
    gloss: сообщение
    note: '*پیام* — общее слово для сообщения, устного или письменного.'
  fa.a2.unit10.lesson03.teach.family_word:
