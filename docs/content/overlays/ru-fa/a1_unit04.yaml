course:
  title: Персидский язык (Иран) A1
  description: 'Персидский язык Ирана для начинающих: чтение письма, понимание повседневной речи и вежливое общение в практических ситуациях.'
units:
  fa.a1.unit04.family:
    title: Семья
lessons:
  fa.a1.unit04.lesson01.immediate_family:
    title: Ближайшие родственники
  fa.a1.unit04.lesson02.describing_own_family:
    title: Расскажи о своей семье
  fa.a1.unit04.lesson03.extended_family:
    title: Дальние родственники
  fa.a1.unit04.lesson04.asking_about_family:
    title: Спроси о чьей-то семье
  fa.a1.unit04.lesson05.marriage_and_inlaws:
    title: Брак и внуки
  fa.a1.unit04.lesson06.family_photo_dialogue:
    title: Семейная фотография
teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Мать
    gloss: мать
    note: مادر — нейтральное книжное/официальное слово «мать».
    example_gloss: Моя мама добрая.
  fa.a1.unit04.lesson01.teach.maman:
    title: Мама
    gloss: мама
    note: مامان — повседневное разговорное слово, которым пользуется большинство семей.
    example_gloss: Мам, я голоден.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Отец
    gloss: отец
    note: پدر — нейтральное книжное/официальное слово «отец».
    example_gloss: Мой отец — врач.
  fa.a1.unit04.lesson01.teach.baba:
    title: Папа
    gloss: папа
    note: بابا — повседневное разговорное слово, которым пользуется большинство семей.
    example_gloss: Пап, ты где?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Брат
    gloss: брат
    note: برادر — «брат»; разговорная ласковая форма داداش встретится позже в этом уроке.
    example_gloss: У меня есть один брат.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Сестра
    gloss: сестра
    note: خواهر — стандартное слово «сестра».
    example_gloss: Моя сестра — студентка.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Официальные и повседневные слова
    gloss: Мама и папа — то же, что мать и отец, но более неформально.
    note: 'В персидском для родителей есть два настоящих регистра, а не строгое деление на официальный и неформальный: مامان/بابا — так большинство людей называет своих родителей, даже в вежливом обществе.'
  fa.a1.unit04.lesson02.teach.daram:
    title: У меня есть
    gloss: у меня есть
    note: '*دارم* — форма 1-го лица от *داشتن* («иметь»), главного глагола для рассказа о семье.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Один
    gloss: один
    note: یک ставится перед считаемым существительным, например یک برادر (один брат).
    example_gloss: У меня есть одна сестра.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: У меня есть один брат.
    gloss: У меня есть один брат.
    note: 'Порядок слов: подлежащее, количество + существительное, глагол — обычный персидский порядок SOV.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: У меня нет сестры.
    gloss: У меня нет сестры.
    note: ندارم — отрицательная форма от دارم; отдельного слова для «одна» не нужно.
  fa.a1.unit04.lesson02.teach.family_big:
    title: Моя семья большая.
    gloss: У меня большая семья.
    note: بزرگه — разговорная стяжённая форма от «بزرگ است» («большой»).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Наша семья маленькая.
    gloss: Наша семья маленькая.
    note: کوچیکه — разговорная стяжённая форма от «کوچک است» («маленький») с разговорным произношением کوچیک вместо книжного کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Дедушка
    gloss: дедушка
    note: پدربزرگ — буквально «большой отец»; говорят о дедушке с любой стороны семьи.
    example_gloss: Мой дедушка старый.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Бабушка
    gloss: бабушка
    note: مادربزرگ — буквально «большая мать»; говорят о бабушке с любой стороны семьи.
    example_gloss: Моя бабушка добрая.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Дядя по отцу
    gloss: дядя (брат отца)
    note: عمو означает именно брата отца, а не «дядю» вообще.
    example_gloss: Мой дядя живёт в Тегеране.
  fa.a1.unit04.lesson03.teach.amme:
    title: Тётя по отцу
    gloss: тётя (сестра отца)
    note: عمه означает именно сестру отца.
    example_gloss: Моя тётя — учительница.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Дядя по матери
    gloss: дядя (брат матери)
    note: 'دایی означает именно брата матери: в персидском для каждого дяди и каждой тёти различается, с какой они стороны семьи.'
    example_gloss: Мой дядя (брат матери) — инженер.
  fa.a1.unit04.lesson03.teach.khale:
    title: Тётя по матери
    gloss: тётя (сестра матери)
    note: خاله означает именно сестру матери.
    example_gloss: Моя тётя (сестра матери) живёт в Исфахане.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Сторона отца и сторона матери
    gloss: Дядя и тётя по отцу — со стороны отца; дядя и тётя по матери — со стороны матери.
    note: Это деление на четыре (عمو/عمه и دایی/خاله) в персидском выражено отдельными словами; русские «дядя» и «тётя» не различают сторону семьи.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Сколько
    gloss: сколько
    note: چند تا употребляется в неформальной речи перед счётом людей или предметов.
    example_gloss: Сколько у вас сестёр?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Сколько у вас братьев и сестёр? (вежливо)
    gloss: Сколько у тебя братьев и сестёр?
    note: دارید — вежливая форма/форма множественного числа глагола «иметь», соответствует شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Сколько у тебя братьев и сестёр? (неформально)
    gloss: Сколько у тебя братьев и сестёр?
    note: داری — неформальная форма единственного числа; её используют с ровесником или с тем, кто младше.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Сколько человек в вашей семье?
    gloss: Сколько человек в вашей семье?
    note: نفر — счётное слово для людей; نفرن — разговорная стяжённая форма от «نفر هستند» («... человек»).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Нас четверо: я, мама, папа и брат.'
    gloss: 'Нас четверо: я, мама, папа и брат.'
    note: نفریم = «نفر هستیم» («нас ... человек»), стяжённая разговорная форма.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Муж
    gloss: муж
    note: شوهر — стандартное слово «муж».
    example_gloss: Мой муж — инженер.
  fa.a1.unit04.lesson05.teach.zan:
    title: Жена
    gloss: жена
    note: زن означает также «женщина» вообще; значение понятно из контекста.
    example_gloss: Моя жена — учительница.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Женат / замужем
    gloss: женат / замужем
    note: متأهل — нейтральное, часто употребляемое прилагательное для семейного положения.
    example_gloss: Он женат. / Она замужем.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Не состоящий в браке
    gloss: холост / не замужем
    note: مجرد — стандартное слово для человека, не состоящего в браке.
    example_gloss: Я не женат. / Я не замужем.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Я не женат. / Я не замужем.
    gloss: Я не женат. / Я не замужем.
    note: مجردم = مجرد + م («я есть»), тот же суффикс 1-го лица, что в خوبم («я в порядке»).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Я женат. / Я замужем.
    gloss: Я женат. / Я замужем.
    note: متأهلم = متأهل + م («я есть»), та же модель, что в مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Внук / внучка
    gloss: внук / внучка
    note: 'نوه обозначает и внука, и внучку: в персидском пол здесь указывать не нужно.'
    example_gloss: У него/неё есть один внук (одна внучка).
  fa.a1.unit04.lesson05.teach.example:
    title: Мой брат женат; у него есть сын.
    gloss: Мой брат женат; у него есть сын.
    note: متأهله — разговорная стяжённая форма от «متأهل است» («женат»); داره — разговорная форма от «دارد» («имеет»).
  fa.a1.unit04.lesson06.teach.in_photo:
    title: Это фото твоей семьи?
    gloss: Это фото твоей семьи?
    note: خانواده‌ته = «خانواده‌ی تو است» («это твоей семьи»), стяжённая форма — очень частая в разговорной речи.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Да. Это моя мама, а это папа.
    gloss: Да. Это моя мама, а это папа.
    note: '*آره* — разговорное «да» (в отличие от книжного *بله*). *مامانمه* — это *مامانم* («моя мама») плюс разговорное окончание «есть».'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Кто этот мужчина?
    gloss: Кто этот мужчина?
    note: کیه = «کی است» («кто это»), разговорная стяжённая форма.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: Это мой брат. У меня один брат, сестры нет.
    gloss: Это мой брат. У меня один брат, сестры нет.
    note: داداش — ласковое повседневное слово «брат»; здесь оно используется вместо более нейтрального برادر из первого урока.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 'У меня в семье наоборот: две сестры, брата нет.'
    gloss: 'У меня в семье наоборот: две сестры, брата нет.'
    note: برعکسه = «برعکس است» («наоборот»), стяжённая форма.
  fa.a1.unit04.lesson06.teach.closing:
    title: Значит, у тебя в семье тоже шумно и весело!
    gloss: Значит, у тебя в семье тоже шумно и весело!
    note: شلوغه — разговорное сокращение от «شلوغ است» («многолюдно, шумно, оживлённо»). Так тепло и привычно говорят о семье, где несколько детей.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Официальный стиль: есть / нет / является'
    gloss: 'В разговорной речи: есть, нет. В официальном письме: есть, нет; он — мой брат.'
    note: 'دارد/ندارد/است — книжные формы, соответствующие разговорным داره/نداره, которые встречаются в этом диалоге. Обрати внимание: в официальном письме ласковое داداش заменяется нейтральным برادر.'
