teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Суббота, воскресенье
    gloss: суббота, воскресенье
    note: شنبه и یکشنبه — первые два дня иранской недели, которая начинается в субботу.
    example_gloss:
    - Сегодня суббота.
    - Завтра воскресенье.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Понедельник, вторник
    gloss: понедельник, вторник
    note: دوشنبه и سه‌شنبه идут после شنبه и یکشنبه.
    example_gloss:
    - В понедельник у меня занятие.
    - Во вторник у меня встреча.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Среда, четверг
    gloss: среда, четверг
    note: چهارشنبه и پنجشنبه — дни в середине и ближе к концу недели.
    example_gloss:
    - В среду я работаю.
    - Увидимся в четверг.
  fa.a1.unit10.lesson01.teach.jome:
    title: Пятница
    gloss: пятница
    note: جمعه — последний день недели и традиционный еженедельный выходной в Иране.
    example_gloss: В пятницу выходной.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: Еженедельный выходной
    gloss: Пятница — еженедельный выходной.
    note: جمعه (пятница) — традиционный еженедельный выходной в Иране, хотя некоторые современные организации теперь не работают и в четверг после обеда.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Фарвардин (1-й месяц)
    gloss: Фарвардин, первый месяц иранского солнечного года
    note: فروردین открывает иранский солнечный год, примерно в конце марта (около весеннего равноденствия и Новруза).
    example_gloss: Фарвардин — первый месяц года.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ордибехешт (2-й месяц)
    gloss: Ордибехешт, второй месяц
    note: اردیبهشت идёт после فروردین, примерно апрель — май.
    example_gloss: В Ордибехеште хорошая погода.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Хордад (3-й месяц)
    gloss: Хордад, третий месяц
    note: خرداد идёт после اردیبهشت, примерно май — июнь.
    example_gloss: Я родился в Хордаде.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: Иранский солнечный календарь
    gloss: Иран пользуется солнечным календарём хиджры (персидским календарём).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* — Иран использует эту систему календаря для повседневных дат. Той же системой пользуется Афганистан, но там месяцы носят арабские названия, а в Иране — персидские по происхождению.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Какой сегодня день недели?
    gloss: Какой сегодня день недели?
    note: 'امروز چندشنبه‌ست؟ буквально: «сегодня какой по счёту день недели?» — разговорное сокращение от چندشنبه است.'
  fa.a1.unit10.lesson03.teach.today_word:
    title: Сегодня
    gloss: сегодня
    note: امروز означает «сегодня».
    example_gloss: Какое сегодня число?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Сегодня четверг, десятое Ордибехешта.
    gloss: Сегодня четверг, десятое Ордибехешта.
    note: امروز پنجشنبه، دهم اردیبهشته объединяет в одном предложении день недели, порядковое числительное и название месяца; здесь используется разговорное сокращение -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Дата
    gloss: дата
    note: '*تاریخ* означает «дата» — общее слово для даты в календаре, например в *تاریخ جلسه* (дата собрания).'
    example_gloss: Какое сегодня число?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: В какой день собрание?
    gloss: В какой день встреча?
    note: جلسه کدوم روزه؟ — вопрос о том, в какой день недели будет событие.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Какого числа вторник в месяце ордибехешт?
    gloss: Какого числа вторник в месяце ордибехешт?
    note: سه‌شنبه چندم اردیبهشته؟ — вопрос о конкретной дате названного дня.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: восьмое
    gloss: восьмое (число)
    note: '*هشتم* означает «восьмое» (число месяца).'
    example_gloss: Сегодня восьмое.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Реза, в какой день встреча?
    gloss: Реза, в какой день встреча?
    note: Марьям начинает разговор и обращается к Резе напрямую, по имени.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Думаю, во вторник.
    gloss: Думаю, во вторник.
    note: 'فکر کنم («думаю») смягчает ответ Резы: он не совсем уверен.'
  fa.a1.unit10.lesson06.teach.turn03:
    title: Какого числа вторник в месяце ордибехешт?
    gloss: Какого числа вторник в месяце ордибехешт?
    note: Марьям уточняет конкретную дату.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Вторник — восьмое ордибехешта.
    gloss: Вторник — восьмое ордибехешта.
    note: Реза называет конкретную дату.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Хорошо, отлично. А в пятницу как, у тебя есть время?
    gloss: Хорошо, отлично. А в пятницу как, у тебя есть время?
    note: Марьям соглашается с датой, а затем спрашивает про другой день.
  fa.a1.unit10.lesson06.teach.turn06:
    title: Нет, в пятницу я занят.
    gloss: Нет, в пятницу я занят.
    note: سرم شلوغه (буквально «моя голова занята/забита») — естественный разговорный иранский способ сказать, что ты занят.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Ничего страшного, увидимся во вторник.
    gloss: Ничего страшного, увидимся во вторник.
    note: مشکلی نیست («нет проблем») вежливо принимает отказ Резы, а می‌بینمت означает «увижу тебя» — так подтверждается вторник как день встречи, в согласии с репликами 02 и 04.
  fa.a1.unit10.lesson06.teach.va_and:
    title: И
    gloss: и
    note: '*و* означает «и». Оно может соединять два дня, как в *دوشنبه و سه‌شنبه*, или два связанных вопроса, как в *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: У меня занятия в понедельник и вторник.
