course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский персидский: дни недели, названия месяцев иранского солнечного календаря, вопрос о сегодняшней дате и ответ на него, вопрос о дате в будущем и договорённость о дате встречи в разговоре.'
