teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: Рубашка
    gloss: рубашка
    note: پیراهن — общее слово для рубашки.
    example_gloss: Я хочу рубашку.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: Брюки
    gloss: брюки
    note: شلوار значит «брюки».
    example_gloss: Сколько стоят эти брюки?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: Обувь
    gloss: обувь
    note: کفش значит «обувь».
    example_gloss: У вас есть обувь?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: Пиджак
    gloss: куртка
    note: کت значит «пиджак» (костюмный пиджак или блейзер); тёплую зимнюю куртку обычно называют другим словом.
    example_gloss: Я хочу пиджак.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: Красивый
    gloss: красивый
    note: قشنگ — обычное повседневное слово со значением «красивый, симпатичный»; часто употребляется со стяжением -e (قشنگه).
    example_gloss: Этот пиджак красивый.
  fa.a1.unit20.lesson01.teach.want_word:
    title: Я хочу (повторение)
    gloss: я хочу
    note: '*می‌خوام* — разговорная форма от *می‌خواهم*. Ты уже встречал её в одном из прошлых уроков; здесь она используется во всех просьбах об одежде.'
    target_text: می‌خوام (я хочу)
  fa.a1.unit20.lesson01.teach.va_word:
    title: И (повторение)
    gloss: и
    note: '*و* — обычный соединительный союз «и», повторение из одного из прошлых уроков.'
    target_text: و (и)
  fa.a1.unit20.lesson02.teach.color_word:
    title: Цвет
    gloss: цвет
    note: رنگ — общее слово для цвета.
    example_gloss: Какой цвет вы хотите?
  fa.a1.unit20.lesson02.teach.red_word:
    title: Красный
    gloss: красный
    note: قرمز значит «красный».
    example_gloss: Эта рубашка красная.
  fa.a1.unit20.lesson02.teach.blue_word:
    title: Синий
    gloss: синий
    note: آبی значит «синий, голубой»; со стяжением -e (آبیه) получается «является синим».
    example_gloss: Мои брюки синие.
  fa.a1.unit20.lesson02.teach.black_word:
    title: Чёрный
    gloss: чёрный
    note: سیاه значит «чёрный».
    example_gloss: Чёрная обувь красивая.
  fa.a1.unit20.lesson02.teach.white_word:
    title: Белый
    gloss: белый
    note: سفید значит «белый».
    example_gloss: Я хочу белый пиджак.
  fa.a1.unit20.lesson03.teach.size_word:
    title: Размер
    gloss: размер
    note: سایز — повседневное слово для размера одежды.
    example_gloss: Какой размер вы хотите?
  fa.a1.unit20.lesson03.teach.big_word:
    title: Большой
    gloss: большой
    note: بزرگ значит «большой».
    example_gloss: Я хочу большой размер.
  fa.a1.unit20.lesson03.teach.small_word:
    title: Маленький
    gloss: маленький
    note: کوچیک значит «маленький»; со стяжением -e (کوچیکه) получается «является маленьким».
    example_gloss: Эта обувь мала.
  fa.a1.unit20.lesson03.teach.medium_word:
    title: Средний
    gloss: средний
    note: متوسط значит «средний» (о размере).
    example_gloss: У вас есть средний размер?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: Попросить примерить
    gloss: Можно примерить?
    note: می‌تونم امتحانش کنم؟ — обычный разговорный способ попросить примерить одежду.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: Да, пожалуйста
    gloss: Да, пожалуйста.
    note: '*بله، بفرمایید* — вежливый способ согласиться для продавца; *بفرمایید* уже встречалось в одном из прошлых уроков.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: Разговорная форма می‌تونم (повторение)
    gloss: я могу (разговорная форма)
    note: 'В разговорной речи письменное -ان- часто превращается в -ون-: *می‌توانم* становится *می‌تونم* (я могу). Такое же изменение ты уже видел в слове *تومن* — разговорной форме *تومان*.'
  fa.a1.unit20.lesson05.teach.label_text:
    title: Ярлык на одежде
    gloss: 'Размер: большой. Цвет: красный.'
    note: Короткий ярлык на одежде в том же виде, в каком ты увидишь его на настоящей вещи.
  fa.a1.unit20.lesson06.teach.please_review:
    title: Пожалуйста / прошу (повторение)
    gloss: пожалуйста / прошу
    note: Повторение из одного из прошлых уроков.
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: Спасибо (повторение)
    gloss: спасибо
    note: Повторение из одного из прошлых уроков.
  fa.a1.unit20.lesson06.teach.ok_review:
    title: Хорошо (повторение)
    gloss: в порядке
    note: Повторение из одного из прошлых уроков.
  fa.a1.unit20.lesson06.teach.turn01:
    title: Продавец приветствует покупателя
    gloss: Здравствуйте, прошу вас.
  fa.a1.unit20.lesson06.teach.turn02:
    title: Нима просит синюю рубашку
    gloss: Здравствуйте. Мне нужна синяя рубашка.
  fa.a1.unit20.lesson06.teach.turn03:
    title: Продавец спрашивает размер
    gloss: Какой размер вы хотите?
  fa.a1.unit20.lesson06.teach.turn04:
    title: Нима называет размер и просит примерить
    gloss: Средний размер. Можно примерить?
  fa.a1.unit20.lesson06.teach.turn05:
    title: Продавец соглашается
    gloss: Да, пожалуйста.
  fa.a1.unit20.lesson06.teach.turn06:
    title: Ниме нравится, и он спрашивает цену
    gloss: Красиво. Сколько это стоит?
  fa.a1.unit20.lesson06.teach.turn07:
    title: Продавец называет цену
    gloss: 30 000 туманов.
  fa.a1.unit20.lesson06.teach.turn08:
    title: Нима согласен заплатить наличными
    gloss: Хорошо, заплачу наличными. Спасибо.
