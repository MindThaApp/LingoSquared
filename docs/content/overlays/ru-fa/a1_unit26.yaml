    title: 'Диалог: кошка Сары'
teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: Я
    gloss: я
    note: '*من*, уже хорошо знакомое слово, снова встречается здесь, когда речь о своём питомце.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: Он / она
    gloss: он / она
    note: '*او* снова встречается здесь.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: У меня есть / у него-неё есть / у меня нет
    gloss: у меня есть / у него-неё есть / у меня нет
    note: '*دارم*/*داره* употребляются так же и с питомцем. *ندارم* («у меня нет») и *نداره* («у него/неё нет») — соответствующие отрицательные формы; обе уже встречались вместе в семейном диалоге 4-го модуля.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Животное
    gloss: животное
    note: '*حیوان* означает «животное».'
    example_gloss: Кошка — животное.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Питомец
    gloss: питомец
    note: '*حیوان خونگی* буквально значит «домашнее животное» — это стандартный способ сказать «питомец».'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Собака
    gloss: собака
    note: '*سگ* означает «собака».'
    example_gloss: У меня есть собака.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Кошка
    gloss: кошка
    note: '*گربه* означает «кошка».'
    example_gloss: У него есть кошка.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Птица
    gloss: птица
    note: '*پرنده* означает «птица».'
    example_gloss: У неё есть птица.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Рыба
    gloss: рыба
    note: '*ماهی* означает «рыба».'
    example_gloss: У меня есть рыбка.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: У тебя есть
    gloss: у тебя есть
    note: '*داری* снова встречается здесь — та же неформальная форма 2-го лица.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: У тебя есть питомец?
    gloss: у тебя есть питомец?
    note: '*حیوان خونگی داری؟* соединяет *حیوان خونگی* из первого урока с *داری* — естественный способ спросить, есть ли у человека питомец.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Ага
    gloss: ага
    note: '*آره* — обычное разговорное слово «да».'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Имя
    gloss: имя
    note: '*اسم* так же используется для клички питомца.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Как его зовут?
    gloss: как его/её зовут?
    note: '*اسمش چیه؟* соединяет притяжательный суффикс *-ش* (уже встречавшийся в *قدش*/*موهاش* в модуле 25) с *چیه؟* из модуля 2 — «как его/её зовут?»'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Еда
    gloss: еда
    note: '*غذا* — это то же слово, которое используется и для корма питомца.'
    example_gloss: Я люблю еду.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Я даю / кормлю
    gloss: я даю / кормлю
    note: '*می‌دم* (буквально «я даю»), уже мелькавшее в *گوش می‌دم* в модуле 24, в паре с *غذا* — естественный глагол для кормления питомца.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Моя собака
    gloss: моя собака
    note: '*سگم* — это *سگ* с притяжательным суффиксом *-م*, «моя собака»; тот же слитный образец, что и *اسمم* в модуле 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Я кормлю свою собаку.
    gloss: Я кормлю свою собаку.
    note: В *سگم رو غذا می‌دم* используется *رو* (показатель прямого объекта, уже встречавшийся в *قهوه رو بیشتر دوست دارم* в модуле 14), отмечающий *سگم* как того, кого кормят.
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: Какого он/она цвета?
    gloss: какого он/она цвета?
    note: '*چه رنگیه؟* так же используется, когда описывают цвет питомца.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Белый
    gloss: белый
    note: '*سفید* снова встречается здесь — для цвета питомца. *گربه‌ی* — форма изафета от *گربه*, которая ставится перед обладателем, как в *گربه‌ی من* («моя кошка»); тот же образец, что *خونه‌ی من* в модуле 19, — для слов на гласную вместо слитного суффикса.'
    example_gloss: Моя кошка белая.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Маленький
    gloss: маленький
    note: '*کوچیک* снова встречается здесь — для размера питомца.'
    example_gloss: Моя рыбка маленькая.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Большой
    gloss: большой
    note: '*بزرگ* снова встречается здесь — для размера питомца.'
    example_gloss: Моя собака большая.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: Сара
    gloss: Сара
    note: '*سارا*, персонаж, знакомый ещё по модулю 2, снова появляется здесь.'
    example_gloss: У Сары есть кошка.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: Один / какой-то
    gloss: один / какой-то
    note: '*یک* здесь употребляется как неопределённый артикль: «какой-то, один».'
  fa.a1.unit26.lesson05.teach.va_review:
    title: И
    gloss: и
    note: '*و* означает «и» — оно уже так употреблялось в модулях 14, 24 и 25.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Пашмак
    gloss: Пашмак
    note: '*پشمک* (буквально «сахарная вата») — распространённая в Иране кличка питомцев; так зовут кошку Сары.'
    example_gloss: Кошку Сары зовут Пашмак.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
