    gloss: каждый день
    note: '*هر روز* так же употребляется здесь, когда речь о кормлении питомца.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: Он/она даёт / кормит
    gloss: он/она даёт / кормит
    note: '*می‌ده* — разговорная форма 3-го лица того же глагола, что и *می‌دم* («я даю/кормлю») из урока 3.'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Текст: кошка Сары'
    gloss: У Сары есть кошка. Её зовут Пашмак. Пашмак белая и маленькая. Сара каждый день кормит Пашмак.
    note: В этом тексте повторяются все конструкции из уроков 1–4 — почти нет новых слов, нужно лишь узнавать их в связном тексте.
  fa.a1.unit26.lesson06.teach.in_word:
    title: Этот
    gloss: этот
    note: '*این* означает «этот»..'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: Чей он/она?
    gloss: чей он/она?
    note: '*کیه* здесь используется, чтобы спросить, чей это питомец.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: Он/она мой
    gloss: он/она мой
    note: '*منه* — разговорное сокращение от *من است*: «это моё». *گربه‌ی منه* означает «это моя кошка».'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: Это моя собака
    gloss: это моя собака
    note: '*سگمه* соединяет *سگم* («моя собака») из урока 3 с тем же окончанием *-ه* («есть, является»), что и в *منه*: «это моя собака».'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Симпатичный
    gloss: симпатичный
    note: '*خوشگل* значит «симпатичный» или «красивый». *خیلی* значит «очень».'
    example_gloss: Кошка Сары очень симпатичная.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: Благодарность
    gloss: спасибо
    note: '*ممنون* снова встречается здесь как естественная заключительная реплика.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Нима: Чья это кошка?'
    gloss: Чья это кошка?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Сара: Это моя кошка. Её зовут Пашмак.'
    gloss: Это моя кошка. Её зовут Пашмак.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Нима: Какого она цвета?'
    gloss: Какого она цвета?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Сара: Белая и маленькая.'
    gloss: Белая и маленькая.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Нима: Очень симпатичная!'
    gloss: Очень симпатичная!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Сара: Спасибо!'
    gloss: Спасибо!
