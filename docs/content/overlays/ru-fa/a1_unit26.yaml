course:
  title: Персидский язык (Иран) A1
  description: 'Разговорный персидский (Иран) для начинающих: названия домашних животных (собака, кошка, птица, рыба), вопрос «У тебя есть питомец?», кличка питомца и его кормление, описание цвета и размера питомца, небольшой текст о кошке Сары по имени پشمک и заключительный диалог между سارا и نیما, которые любуются پشمک.'
