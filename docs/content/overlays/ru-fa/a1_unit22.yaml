teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Телефон
    gloss: телефон
    note: تلفن — общее слово для обозначения телефона.
    example_gloss: Где мой телефон?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Сообщение
    gloss: сообщение
    note: پیام — это письменное или текстовое сообщение.
    example_gloss: У меня есть сообщение.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Звонить
    gloss: звонить
    note: زنگ زدن (буквально «звонить») — повседневный глагол, которым говорят «позвонить кому-то».
    example_gloss: Позвони мне.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Голос
    gloss: голос
    note: صدا значит «голос»; так описывают, как кто-то звучит во время звонка.
    example_gloss: У тебя хороший голос.
  fa.a1.unit22.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — самый обычный соединительный союз, повторение из прошлых разделов.
    target_text: و (и)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Алло (по телефону)
    gloss: алло, слушаю
    note: الو — приветствие именно для телефона (при личной встрече его не говорят); بفرمایید здесь значит примерно «слушаю вас».
  fa.a1.unit22.lesson02.teach.its_me:
    title: Это я, Наргес
    gloss: привет, это я, Наргес
    note: '*منم* — это *من* («я») плюс окончание глагола -م («есть»), то есть «это я»: очень распространённый способ назвать себя по телефону. (Так же пишется и «я тоже» — *من هم*; здесь из контекста всё ясно.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Ты можешь повторить?
    gloss: можете повторить?
    note: می‌شه (разговорная форма от می‌شود, «возможно ли») + تکرار کنید («повторите») — стандартная вежливая форма просьбы.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Говорите, пожалуйста, помедленнее
    gloss: говорите, пожалуйста, помедленнее
    note: آهسته‌تر — сравнительная степень от آهسته («медленно»), то есть «медленнее».
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: У меня для тебя сообщение
    gloss: у меня для тебя сообщение
    note: برات — сокращение от برای («для») + ت (разговорное «тебя/тебе»).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Приходи завтра в четыре в кафе
    gloss: приходи завтра в четыре в кафе
    note: بیا — разговорное повелительное наклонение от آمدن («приходить»), образованное от основы; так же образуются и другие повелительные формы, которые ты уже встречал на уровне A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Пока, поговорим позже
    gloss: пока, поговорим позже
    note: 'بعداً значит «позже»; صحبت می‌کنیم — форма настоящего/будущего времени: «мы поговорим».'
  fa.a1.unit22.lesson05.teach.better_now:
    title: Сейчас лучше?
    gloss: сейчас лучше?
    note: الان значит «сейчас»; بهتر شد буквально «стало лучше» — в прошедшем времени. В фарси так естественно спрашивают, наладилась ли связь; в русском тоже можно сказать «стало лучше?», но здесь обычно употребляют именно эту форму.
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Привет, Наргес, как дела?
    gloss: привет, Наргес, как дела?
    note: '*چطوری* — неформальное «как дела?»; оно уместно здесь, потому что Али и Наргес друзья.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Твой голос пропадает
    gloss: твой голос пропадает
    note: قطع و وصل می‌شه буквально «прерывается и соединяется» — естественное фарсийское выражение для плохой связи, когда звук пропадает.
  fa.a1.unit22.lesson06.teach.turn01:
    title: Али отвечает
    gloss: 'Али: Алло, слушаю.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Наргес называет себя
    gloss: 'Наргес: Привет, Али, это я, Наргес.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Али отвечает на приветствие
    gloss: 'Али: Привет, Наргес, как дела?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Наргес просит говорить медленнее
    gloss: 'Наргес: Хорошо, спасибо. Можешь, пожалуйста, говорить помедленнее? Твой голос пропадает.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Али уточняет
    gloss: 'Али: Хорошо, сейчас лучше?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Наргес передаёт сообщение
    gloss: 'Наргес: Да, лучше. У меня для тебя сообщение: приходи завтра в четыре в кафе.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Они идут (разговорная форма)
    gloss: они идут (разговорная форма)
    note: '*می‌رن* — разговорная форма от *می‌روند* («они идут»), в том же разговорном стиле, что и остальной курс.'
    target_text: می‌رن (они идут, разговорная форма)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Али соглашается
    gloss: 'Али: Хорошо, обязательно приду.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Наргес заканчивает разговор
    gloss: 'Наргес: Пока, поговорим позже.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Али прощается
    gloss: 'Али: Пока.'
