teaching:
  fa.a2.unit35.lesson01.teach.connectors:
    title: Три связки времени
    gloss: прежде чем, после того как, когда
    note: '*قبل از اینکه* значит «прежде чем», *بعد از اینکه* — «после того как», а *وقتی* — «когда». Каждое из этих слов начинает придаточную часть, которая говорит, когда что-то происходит.'
    example_gloss:
    - Прежде чем уйти, я закрываю дверь.
    - После того как я приехал, я позвонил Саре.
    - Когда я приехал, я позвонил Саре.
  fa.a2.unit35.lesson01.teach.home_words:
    title: Дом и повседневные слова
    gloss: дом, дверь, свет, зубная щётка, завтрак, еда, чай
    note: 'В разговорной речи *رو* отмечает определённое прямое дополнение: *در رو* — это «дверь» (конкретная). *مسواک* — это и сама щётка, и действие в *مسواک می‌زنم*.'
    example_gloss:
    - Я закрываю дверь.
    - Я выключаю свет.
    - Я поел и выпил чаю.
  fa.a2.unit35.lesson01.teach.subjunctive_verbs:
    title: Глаголы после «прежде чем»
    gloss: я уйду, я лягу спать, я приеду, я куплю, я приготовлю, я сяду
    note: 'После *قبل از اینکه* глагол стоит в сослагательной форме (конъюнктиве): *ب* + основа + окончание (*برم، بخوابم، برسم*). Приставки *می‌* здесь нет. Главный глагол выражает обычное действие: *می‌بندم، می‌زنم*.'
    example_gloss:
    - Перед сном я чищу зубы.
    - Прежде чем приехать, я звоню Саре.
    - Перед тем как сесть, я покупаю билет.
    - Прежде чем готовить, я мою овощи.
  fa.a2.unit35.lesson01.teach.past_verbs:
    title: Глаголы простого прошедшего
    gloss: я приехал, я позвонил, я поел
    note: Это обычные глаголы простого прошедшего времени. После *بعد از اینکه* и *وقتی* в рассказе о прошлом используется простое прошедшее.
    example_gloss:
    - Я приехал на вокзал.
    - Я позвонил Саре.
    - Я поел.
  fa.a2.unit35.lesson01.teach.before_subjunctive:
    title: قبل از اینکه + сослагательная форма
    gloss: Прежде чем уйти, я закрываю дверь
    note: 'После *قبل از اینکه* глагол стоит в сослагательной форме: *برم، بخوابم، برسم*. Действие в части с *قبل از اینکه* происходит вторым, а действие главной части — первым. В предложении *قبل از اینکه برم، در رو می‌بندم* сначала закрывают дверь, потом уходят.'
  fa.a2.unit35.lesson02.teach.travel_words:
    title: Слова о поездках
    gloss: поезд, билет, вокзал, я сел, я купил
    note: '*سوار شدم* — это всё действие целиком: «я сел» (в поезд, в автобус). *بلیت* — это билет.'
    example_gloss:
    - Я купил билет.
    - Я сел в поезд.
    - Я приехал на вокзал.
  fa.a2.unit35.lesson02.teach.cook_and_day_verbs:
    title: Ещё глаголы прошедшего времени
    gloss: я помыл, я приготовил, я поспал, я взял
    note: Эти формы простого прошедшего (*شستم، پختم، خوابیدم، گرفتم*) — глаголы, которые мы используем после *بعد از اینکه*.
    example_gloss:
    - Я помыл овощи.
    - Я приготовил еду.
    - Я принял душ.
    - Я поспал.
  fa.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + простое прошедшее
    gloss: После того как я приехал, я позвонил
    note: 'После *بعد از اینکه* используется простое прошедшее: *رسیدم، خریدم، شستم*. Действие в части с *بعد از اینکه* произошло первым. Пример: *بعد از اینکه بلیت خریدم، سوار قطار شدم* — сначала ты купил билет, потом сел в поезд. Сослагательной формы здесь нет.'
  fa.a2.unit35.lesson03.teach.contrast_verbs:
    title: 'Идти и закрывать: прошедшее и настоящее'
    gloss: я пошёл, я закрыл, я иду
    note: 'Вот формы, которые мы сравниваем: *رفتم* (я пошёл) и *می‌رم* (я иду) в сопоставлении с сослагательной формой *برم*.'
    example_gloss:
    - Я ушёл из дома.
    - Я закрыл дверь.
    - Я иду.
  fa.a2.unit35.lesson03.teach.contrast_forms:
    title: Сослагательная форма после قبل, прошедшее после بعد
    gloss: прежде чем я уйду / после того как я ушёл
    note: 'Для двух связок нужны разные формы глагола. *قبل از اینکه برم* (прежде чем я уйду): сослагательная форма, событие ещё не произошло. *بعد از اینکه رفتم* (после того как я ушёл): простое прошедшее, событие уже совершилось. Сравни: *برم / رفتم*, *بخرم / خریدم*, *برسم / رسیدم*.'
  fa.a2.unit35.lesson03.teach.before_any_tense:
    title: Глагол после قبل остаётся в сослагательной форме
    gloss: Прежде чем уйти, я закрыл дверь
    note: 'Глагол после *قبل از اینکه* стоит в сослагательной форме, даже если главный глагол в прошедшем времени: *قبل از اینکه برم، در رو بستم* значит «Прежде чем уйти, я закрыл дверь». Никогда не ставь *رفتم* после *قبل از اینکه*.'
  fa.a2.unit35.lesson04.teach.when_words:
    title: Слова для «когда»
    gloss: музыка, слушаю, пришёл, я приезжаю, я готовлю
    note: '*گوش می‌دم* — «я слушаю». *اومد* — разговорная форма прошедшего «пришёл». *رسیدی* — «ты приехал», а *چیکار کردی؟* — «что ты делал?».'
    example_gloss:
    - Когда я готовлю, я слушаю музыку.
    - Когда пришёл поезд, я сел в него.
    - Когда я приезжаю, я звоню Саре.
  fa.a2.unit35.lesson04.teach.when_forms:
    title: وقتی + прошедшее или настоящее
    gloss: Когда я приехал, я позвонил; когда я приезжаю, я звоню
    note: 'После *وقتی* глагол ставится в форме, которая соответствует времени. Завершённое событие требует простого прошедшего: *وقتی رسیدم، زنگ زدم* (когда я приехал, я позвонил). Привычка или план выражаются настоящим с *می‌*: *وقتی می‌رسم، زنگ می‌زنم* (когда я приезжаю, я звоню). *وقتی* не указывает, что было раньше, поэтому для строгой последовательности используй *قبل از اینکه* или *بعد از اینکه*.'
  fa.a2.unit35.lesson05.teach.yesterday_words:
    title: Слова для чтения
    gloss: вчера, утро, я выключил
    note: '*خاموش کردم* — простое прошедшее от «я выключил». *دیروز صبح* — «вчера утром».'
    example_gloss:
    - Вчера утром я принял душ.
    - Я выключил свет.
  fa.a2.unit35.lesson05.teach.reading:
    title: Утро и поезд
    gloss: Вчера утром, после того как я принял душ, я позавтракал. Прежде чем уйти из дома, я выключил свет и закрыл дверь. Когда я приехал на вокзал, я купил билет. После того как пришёл поезд, я сел в него.
    note: 'Прочитай один раз, чтобы понять порядок событий, а потом найди три связки: *بعد از اینکه، قبل از اینکه، وقتی*.'
  fa.a2.unit35.lesson06.teach.dialogue_words:
    title: Слова для разговора
    gloss: завтра, мне, ты приедешь, мы поели, мы пьём
    note: '*بهم* — «мне», а *بهت* — «тебе». *برسی* — сослагательная форма «ты приедешь». *خوردیم* — «мы поели», а *می‌خوریم* — «мы едим / пьём».'
    example_gloss:
    - Ты позвонишь мне завтра?
    - Да, я тебе позвоню.
    - Мы поели и выпьем чаю.
  fa.a2.unit35.lesson06.teach.turn01:
    title: Сара спрашивает про вчерашний день
    gloss: 'Сара спрашивает Ниму: После того как ты вчера приехал на вокзал, что ты делал?'
    note: Сара использует *بعد از اینکه* с прошедшим временем.
  fa.a2.unit35.lesson06.teach.turn02:
    title: Нима рассказывает по порядку
    gloss: После того как я приехал, я купил билет. Когда пришёл поезд, я сел в него.
    note: Нима отвечает с *بعد از اینکه* и *وقتی*, оба раза с глаголами в прошедшем времени.
  fa.a2.unit35.lesson06.teach.turn03:
    title: Сара спрашивает про завтра
    gloss: Завтра, прежде чем приедешь, ты мне позвонишь?
    note: Сара использует *قبل از اینکه* с сослагательной формой *برسی*.
  fa.a2.unit35.lesson06.teach.turn04:
    title: Нима соглашается
    gloss: Да, прежде чем приеду, я тебе позвоню.
    note: 'Нима повторяет сослагательную форму со своим окончанием: *برسم*.'
  fa.a2.unit35.lesson06.teach.turn05:
    title: Сара планирует ужин
    gloss: Хорошо. Прежде чем ты приедешь, я приготовлю еду.
    note: 'У каждого из них свой подлежащее: *من* и *تو*.'
  fa.a2.unit35.lesson06.teach.turn06:
    title: Нима планирует чай
    gloss: Отлично! После того как мы поедим, мы выпьем чаю.
    note: Здесь часть с *بعد از اینکه* стоит в прошедшем времени, а главная часть выражает план.
exercises:
  fa.a2.unit35.lesson01.exercise01.recognize_before:
    instruction: Какую последовательность событий описывает это предложение?
    correct_option: Сначала я закрываю дверь, потом ухожу.
    distractors:
    - Сначала я ухожу, потом закрываю дверь.
    - Я закрываю дверь в тот момент, когда ухожу.
    - Я не закрываю дверь.
    accepted_answers:
    - value: Сначала я закрываю дверь, потом ухожу.
      status: correct
    feedback: В предложении *قبل از اینکه برم، در رو می‌بندم* главное действие (закрыть дверь) происходит раньше ухода.
  fa.a2.unit35.lesson01.exercise02.recognize_after:
    instruction: Какую последовательность событий описывает это предложение?
    correct_option: Сначала я приехал, потом позвонил Саре.
    distractors:
    - Сначала я позвонил Саре, потом приехал.
    - Я позвонил(а) Саре, пока приезжал(а).
    - Я не звонил(а) Саре.
    accepted_answers:
    - value: Сначала я приехал, потом позвонил Саре.
      status: correct
    feedback: Сначала происходит то, что стоит в части с *بعد از اینکه* (приезд), а звонок — после него.
