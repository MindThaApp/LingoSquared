teaching:
  fa.a2.unit31.lesson01.teach.polite_words:
    title: Вежливые слова для начала разговора
    gloss: здравствуйте, извините, можно / не могли бы вы, пожалуйста, спасибо
    note: '*ببخشید* вежливо привлекает внимание, а *لطفا* значит «пожалуйста». *می‌شه* буквально спрашивает «возможно ли?»'
    example_gloss:
    - Здравствуйте, извините.
    - Спасибо, пожалуйста.
  fa.a2.unit31.lesson01.teach.things:
    title: О чём ты просишь
    gloss: дверь, окно, вода, стакан, хлеб, (показатель прямого объекта), один/какой-то
    note: '*رو* отмечает определённое прямое дополнение в разговорной речи: *در رو*, *پنجره رو*. *یه* — разговорное «один, какой-то».'
    example_gloss:
    - Стакан воды.
    - Буханка хлеба.
    - Дверь и окно.
  fa.a2.unit31.lesson01.teach.request_verbs:
    title: Глаголы вежливой просьбы
    gloss: закройте, откройте, принесите, дайте, помогите
    note: Это вежливые формы множественного числа на *-ید*. Их используют с соседями, продавцами и другими незнакомыми людьми.
    example_gloss:
    - Закройте дверь.
    - Откройте окно.
    - Принесите стакан воды.
    - Помогите мне.
  fa.a2.unit31.lesson01.teach.mishe_subjunctive:
    title: می‌شه + сослагательное наклонение
    gloss: Не могли бы вы закрыть дверь? Не могли бы вы мне помочь?
    note: 'Чтобы вежливо попросить, скажи *می‌شه*, а затем глагол в форме субъюнктива с *ب-*: *می‌شه در رو ببندید؟* В составном глаголе меняется вспомогательная часть: *می‌شه کمکم کنید؟*, *می‌شه پنجره رو باز کنید؟* Дополнение стоит перед глаголом.'
  fa.a2.unit31.lesson02.teach.offer_words:
    title: Предложение помощи
    gloss: Вам нужна помощь? Позвольте мне ...
    note: '*کمک می‌خواید؟* — это вопрос «Тебе нужна помощь?». *بذارید من ...* значит «позволь мне ...» и после него идёт глагол с окончанием лица *я*: *بیارم*, *بخرم*, *ببندم*, *کنم*.'
    example_gloss:
    - Тебе помочь?
    - Позвольте, я принесу воду.
    - Позвольте, я куплю хлеб.
    - Позвольте, я закрою дверь.
    - Позвольте, я вам помогу.
    - Не могли бы вы купить хлеб?
  fa.a2.unit31.lesson02.teach.reply_words:
    title: Согласие и отказ
    gloss: да, нет, конечно, сам, я сделаю, пожалуйста (в ответ на благодарность)
    note: '*بله، لطفا* — принять предложение. *نه، ممنون* — отказаться, а *خودم انجام می‌دم* добавляет «я сделаю это сам». *خواهش می‌کنم* — ответ на благодарность.'
    example_gloss:
    - Да, пожалуйста.
    - Нет, спасибо, я сделаю сам.
    - Пожалуйста.
  fa.a2.unit31.lesson02.teach.offer_pattern:
    title: 'Просьба и предложение: «вы» или «я»'
    gloss: Позвольте, я закрою дверь.
    note: Просьба с *می‌شه* использует окончание лица *вы* (*ببندید*), потому что ты просишь другого человека. Предложение помощи с *بذارید من* использует окончание лица *я* (*ببندم*), потому что действие выполнишь ты сам. Сравни *می‌شه در رو ببندید؟* и *بذارید من در رو ببندم*.
  fa.a2.unit31.lesson02.teach.reply_pattern:
    title: Вежливый ответ состоит из двух частей
    gloss: Да, пожалуйста. Нет, спасибо, я сделаю сам.
    note: Чтобы согласиться, скажи *بله* и *لطفا*. Чтобы отказаться, скажи *نه، ممنون* и добавь *خودم انجام می‌دم*, если хочешь сказать, что справишься сам.
  fa.a2.unit31.lesson03.teach.positive_imperatives:
    title: Утвердительные команды
    gloss: иди, приходи, делай; идите (вежливо), делайте (вежливо)
    note: 'Другу говорят короткую форму: *برو*, *بیا*, *بکن*. Незнакомым людям и группе говорят форму на *-ید*: *برید*, *بکنید*.'
    example_gloss:
    - Иди туда.
    - Иди сюда.
    - Сделай это.
    - Идите туда (вежливо).
  fa.a2.unit31.lesson03.teach.negative_imperatives:
    title: Отрицательные команды
    gloss: не иди, не приходи, не делай; вежливые формы и формы множественного числа
    note: 'Замени *ب-* на *نـ*: *برو* становится *نرو*, *بکن* — *نکن*, *بیا* — *نیا*. Вежливые формы: *نرید*, *نکنید* и устойчивое выражение *دست نزنید* (не трогайте).'
    example_gloss:
    - Не ходи туда.
    - Не приходи сюда.
    - Не делай этого.
    - Не ходите туда (вежливо).
    - Не делайте этого (вежливо).
    - Не трогайте (вежливо).
  fa.a2.unit31.lesson03.teach.negative_rule:
    title: نـ заменяет ب-
    gloss: برو и نرو, بیا и نیا, بکن и نکن
    note: 'Утвердительная команда начинается с *ب-*, а отрицательная — с *نـ*. *بیا* и *نیا* устроены так же: они отличаются только первой буквой. Только отрицательная форма меняет смысл на «не делай».'
  fa.a2.unit31.lesson03.teach.polite_plural:
    title: Друг или вежливое множественное число
    gloss: не иди (другу) и не идите (вежливо)
    note: 'Добавь *-ید* для незнакомого человека или для нескольких людей: *نرو* становится *نرید*, а *نکن* — *نکنید*. На табличках и в речи продавцов используются формы на *-ید*: *لطفا دست نزنید*.'
  fa.a2.unit31.lesson04.teach.places_people:
    title: Соседи и магазины
    gloss: сосед, магазин, продавец, сумка, чай
    note: '*کیفم* значит «моя сумка»; окончание *-م* значит «мой». *تو مغازه* значит «в магазине».'
    example_gloss:
    - Извините, не могли бы вы дать мне чай?
    - Извините, не могли бы вы дать мне мою сумку?
    - Здравствуйте, сосед, вам нужна помощь?
    - Ничего не трогайте в магазине.
  fa.a2.unit31.lesson04.teach.shop_request:
    title: Вежливая просьба в магазине
    gloss: Извините, не могли бы вы дать мне чай? Спасибо.
    note: Начни с *ببخشید*, попроси с помощью *می‌شه* и вежливого глагола, а закончи словом *ممنون*.
  fa.a2.unit31.lesson05.teach.reading:
    title: Записка соседу
    gloss: Здравствуйте, извините. Не могли бы вы сегодня купить хлеб? Меня нет дома. Пожалуйста, закройте дверь и не трогайте мою сумку. Спасибо.
    note: Прочитай один раз, чтобы понять просьбу, а затем ещё раз, чтобы найти просьбу не трогать сумку.
  fa.a2.unit31.lesson06.teach.turn01:
    title: Сара просит о помощи
    gloss: 'Сара: Извините, не могли бы вы мне помочь?'
    note: Вежливая просьба с *می‌شه* и окончанием лица *вы*.
  fa.a2.unit31.lesson06.teach.turn02:
    title: Сосед соглашается
    gloss: 'Сосед: Да, конечно. Что мне сделать?'
    note: '*چیکار کنم؟* спрашивает, что нужно сделать.'
  fa.a2.unit31.lesson06.teach.turn03:
    title: Конкретная просьба
    gloss: 'Сара: Не могли бы вы открыть дверь?'
    note: Дополнение *در رو* стоит перед вежливым глаголом.
  fa.a2.unit31.lesson06.teach.turn04:
    title: Сосед предлагает ещё помощь
    gloss: 'Сосед: Да. Позвольте, я понесу вашу сумку.'
    note: После *بذارید من ... ببرم* глагол стоит с окончанием лица *я*.
  fa.a2.unit31.lesson06.teach.turn05:
    title: Сара отказывается
    gloss: 'Сара: Нет, спасибо, я сделаю сам.'
    note: Вежливый отказ с объяснением.
  fa.a2.unit31.lesson06.teach.turn06:
    title: Сосед отвечает
    gloss: 'Сосед: Пожалуйста.'
    note: '*خواهش می‌کنم* — стандартный ответ на благодарность.'
