course:
  title: Персидский язык (Иран) A1
  description: 'Персидский язык Ирана для начинающих: чтение письма, понимание повседневной речи и вежливое общение в практических ситуациях.'
units:
  fa.a1.unit01.greetings:
    title: Приветствия и первые встречи
lessons:
  fa.a1.unit01.lesson01.script_ramp:
    title: Прочитай своё первое персидское слово
  fa.a1.unit01.lesson02.everyday_greetings:
    title: Повседневные приветствия
  fa.a1.unit01.lesson03.time_and_farewells:
    title: Приветствия и прощания в течение дня
  fa.a1.unit01.lesson04.formal_informal_wellbeing:
    title: Вежливый и неформальный светская беседа
  fa.a1.unit01.lesson05.taarof_basics:
    title: Первое знакомство с тарофом
  fa.a1.unit01.lesson06.first_meeting_dialogue:
    title: Диалог при первой встрече
teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Персидский пишется справа налево
    gloss: Персидский пишется справа налево.
    note: Читай по-персидски от правого края к левому.
  fa.a1.unit01.lesson01.teach.seen:
    title: Буква س
    gloss: с
    note: Буква س обычно передаёт звук «с».
  fa.a1.unit01.lesson01.teach.lam:
    title: Буква ل
    gloss: л
    note: Буква ل передаёт звук «л» и соединяется с соседними буквами.
  fa.a1.unit01.lesson01.teach.alef:
    title: Буква ا
    gloss: ā / а
    note: Буква ا часто обозначает долгий звук «ā» и не соединяется со следующей буквой.
  fa.a1.unit01.lesson01.teach.mim:
    title: Буква م
    gloss: м
    note: Буква م передаёт звук «м» и меняет форму при соединении.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Собери слово سلام
    gloss: привет
    note: سلام читается «salâm». Краткие гласные на письме обычно не обозначаются.
    example_gloss: Привет! Я Нима.
  fa.a1.unit01.lesson02.teach.salam:
    title: Привет
    gloss: привет
    note: سلام подходит и для официальных, и для неформальных ситуаций.
    example_gloss: Привет, как дела?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Доброе утро
    gloss: доброе утро
    note: صبح بخیر — нейтрально-вежливое приветствие утром.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Добрый день или добрый вечер
    gloss: добрый день / добрый вечер
    note: عصر بخیر говорят со второй половины дня и до вечера.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Прощание
    gloss: до свидания; прощай
    note: خداحافظ читается «khodâhâfez» и является стандартным универсальным прощанием.
    example_gloss: До свидания, увидимся позже!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Спасибо
    gloss: спасибо
    note: ممنون — обычное и естественное слово; متشکرم звучит несколько более официально.
    example_gloss: Большое спасибо.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: Пожалуйста
    gloss: не за что
    note: خواهش می‌کنم — привычный ответ на благодарность.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Как дела? Вежливая разговорная форма
    gloss: Как вы поживаете?
    note: حالتون چطوره؟ — нейтрально-вежливая разговорная форма иранского фарси. حال شما چطور است؟ — более официальный или письменный вариант.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: У меня всё хорошо
    gloss: у меня всё хорошо
    note: خوبم состоит из خوب и окончания 1-го лица ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Добрый день
    gloss: добрый день
    note: روز بخیر вежливо, но в неформальной речи встречается реже, чем سلام.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Спокойной ночи
    gloss: спокойной ночи
    note: شب بخیر обычно говорят при прощании или перед сном, а не при встрече.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Добро пожаловать
    gloss: добро пожаловать
    note: خوش آمدید — вежливая форма для одного или нескольких гостей.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Надеюсь на встречу
    gloss: надеюсь, увидимся / до новой встречи
    note: به امید دیدار — изысканное, нейтрально-вежливое прощание.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Пока
    gloss: пока
    note: فعلاً — разговорное слово, менее официальное, чем خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Хорошего дня
    gloss: хорошего дня
    note: باشید указывает на вежливую форму в этом устойчивом прощании.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Нейтрально-вежливая разговорная форма
    gloss: Как вы поживаете?
    note: Используй حالتون چطوره؟ с незнакомым взрослым или в обычной вежливой беседе. Явно официальная или письменная форма — حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Неформально
    gloss: Как вы поживаете?
    note: چطوری؟ — разговорная форма, уместная с друзьями, родными и ровесниками, если отношения позволяют.
  fa.a1.unit01.lesson04.teach.to:
    title: Неформальное «ты»
    gloss: ты
    note: تو — форма единственного числа, неформальная; не используй её по умолчанию с незнакомым взрослым.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Очень хорошо
    gloss: у меня всё очень хорошо
    note: خیلی усиливает خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Неплохо
    gloss: неплохо, спасибо
    note: بد نیستم — естественный сдержанный ответ, а не жалоба.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: А у вас? Вежливо
    gloss: А вы?
    note: Используй شما چطور؟, чтобы вежливо задать вопрос в ответ.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: А у тебя? Неформально
    gloss: А вы?
    note: تو چطور؟ подходит для неформальных отношений.
  fa.a1.unit01.lesson05.teach.chai:
    title: Чай
    gloss: чай
    note: '*چای* — это напиток. Ты услышишь это слово в предложении *چای بفرمایید* (угощайтесь чаем).'
    example_gloss: Пожалуйста, не хотите чаю?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Пожалуйста, прошу
    gloss: пожалуйста / прошу / вот, возьмите
    note: '*بفرمایید* меняет значение в зависимости от ситуации: «вот, возьмите» (при угощении чаем), «проходите» (у двери) или «после вас».'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Вы очень любезны
    gloss: вы очень любезны
    note: لطف دارید — вежливый ответ на комплимент.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Не беспокойтесь, пожалуйста
    gloss: пожалуйста, не утруждайте себя
    note: زحمت نکشید может быть искренним отказом или вежливой первой реакцией на конкретное предложение.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Спасибо за вашу любезность
    gloss: спасибо за вашу любезность
    note: Это теплее и выразительнее, чем просто ممنون.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Тароф
    gloss: иранские правила вежливости, зависящие от контекста
    note: Тароф — это зависящие от контекста правила того, как предлагать, отказываться, благодарить и выражать уважение. Практика различается в зависимости от отношений, поколения, региона и ситуации; никакое определённое число отказов или повторов не говорит о том, искренне ли предложение.
  fa.a1.unit01.lesson06.teach.line01:
    title: Добро пожаловать
    gloss: Али приветствует Наргес.
    note: Разговор начинается с приветствия, а потом идёт знакомство.
  fa.a1.unit01.lesson06.teach.line02:
    title: 'Приветствие: ответ'
    gloss: Наргес здоровается в ответ и благодарит его.
    note: ممنون (спасибо) — естественный ответ на приветствие гостя.
  fa.a1.unit01.lesson06.teach.line03:
    title: Обмен именами
    gloss: Али говорит, кто он.
    note: '*من علی هستم* значит «Я Али». *هستم* («есть, являюсь») стоит в конце предложения.'
  fa.a1.unit01.lesson06.teach.line04:
    title: Обмен именами, ответ
    gloss: Наргес говорит, кто она.
    note: Та же модель *من ... هستم*, которую только что использовал Али.
  fa.a1.unit01.lesson06.teach.line05:
    title: Очень приятно
    gloss: Али говорит, что рад знакомству с ней.
    note: '*خوشوقتم* значит «мне приятно». Вместе с *از آشنایی با شما* это стандартная вежливая фраза при знакомстве.'
  fa.a1.unit01.lesson06.teach.line06:
    title: 'Приятно познакомиться: ответ'
    gloss: Наргес отвечает тем же.
    note: همین‌طور в этом ответе значит «так же», «взаимно».
  fa.a1.unit01.lesson06.teach.line07:
    title: Спросить, как дела
    gloss: Али вежливо спрашивает, как у неё дела.
    note: Али использует нейтрально-вежливую разговорную форму с ـتون, потому что это вежливая первая встреча.
  fa.a1.unit01.lesson06.teach.line08:
    title: 'Спросить, как дела: ответ'
    gloss: Наргес отвечает и задаёт вопрос в ответ.
    note: شما چطور؟ повторяет вопрос, чтобы задать его собеседнику, — это распространённый короткий приём.
  fa.a1.unit01.lesson06.teach.line09:
    title: Приглашение
    gloss: Али говорит, что у него тоже всё хорошо, и приглашает Наргес войти.
    note: '*بفرمایید داخل* значит «пожалуйста, проходите». *داخل* («внутрь») показывает, что именно предлагают.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Вежливый отказ
    gloss: Наргес благодарит его, но объясняет, что ей нужно уйти.
    note: Вежливый отказ тоже начинается с благодарности. *ولی باید برم* значит «но мне нужно идти».
  fa.a1.unit01.lesson06.teach.line11:
    title: Завершение разговора
    gloss: Али принимает её ответ и надеется на новую встречу.
    note: Отклонённое приглашение естественно переходит в прощание.
  fa.a1.unit01.lesson06.teach.line12:
    title: Завершение разговора, ответ
    gloss: Наргес прощается.
    note: '*خداحافظ* — стандартное универсальное прощание.'
exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
