course:
  title: Персидский A2
  description: 'Персидский (Иран) для уровня ниже среднего: рассказываем о своих привычках в технологиях и социальных сетях и просто выражаем мнение о них с объяснением причины.'
units:
  fa.a2.unit16.online_habits:
    title: Привычки в интернете
lessons:
  fa.a2.unit16.lesson01.online_habits_vocabulary:
    title: Слова об интернете и социальных сетях
  fa.a2.unit16.lesson02.describing_your_habit:
    title: Рассказываем о своей привычке
  fa.a2.unit16.lesson03.reading_a_message_about_habits:
    title: Читаем сообщение о привычках
  fa.a2.unit16.lesson04.habits_conversation:
    title: Говорим о привычках в интернете
teaching:
  fa.a2.unit16.lesson01.teach.social_media_word:
    title: Социальные сети
    gloss: социальные сети
    note: '*شبکه‌ی اجتماعی* — стандартное выражение для социальных сетей.'
    example_gloss: Я каждый день пользуюсь социальными сетями.
  fa.a2.unit16.lesson01.teach.app_word:
    title: Приложение
    gloss: приложение
    note: '*اپلیکیشن* — распространённое заимствованное слово для приложения на телефоне или компьютере.'
    example_gloss: Моё любимое приложение — Инстаграм.
  fa.a2.unit16.lesson01.teach.screen_word:
    title: Экран
    gloss: экран
    note: '*صفحه* — слово для экрана, например экрана телефона или компьютера.'
    example_gloss: Экран моего телефона большой.
  fa.a2.unit16.lesson01.teach.useful_word:
    title: Полезный
    gloss: полезный
    note: '*مفید* — «полезный»; *مفیده* — его разговорная форма (*مفید* + *است*).'
    example_gloss: Читать новости полезно.
  fa.a2.unit16.lesson01.teach.news_word:
    title: Новости
    gloss: новости
    note: '*خبر* — общее слово для новостей.'
    example_gloss: Я каждый день читаю новости.
  fa.a2.unit16.lesson01.teach.entertaining_word:
    title: Развлекательный
    gloss: занимательный, весёлый
    note: '*سرگرم‌کننده* описывает то, чем интересно и весело пользоваться.'
    example_gloss: Это приложение очень занимательное.
  fa.a2.unit16.lesson01.teach.waste_time_note:
    title: Тратить время впустую (составной глагол)
    gloss: тратить время впустую
    note: '*وقت تلف کردن* буквально значит «время потеря делать» — ещё одна конструкция с составным глаголом, как *باز کردن* из предыдущего банковского раздела.'
    target_text: وقت تلف کردن (тратить время впустую, составной глагол)
  fa.a2.unit16.lesson01.teach.recap_opinion_pattern:
    title: По моему мнению ... потому что ...
    gloss: по моему мнению ... потому что ...
    note: Повторение модели *به نظر من ... چون ...* из предыдущего раздела о мнениях; здесь она используется, чтобы рассказать о привычке и высказать мнение о ней.
  fa.a2.unit16.lesson02.teach.about_word:
    title: Около / приблизительно
    gloss: около / приблизительно
    note: '*حدود* ставится перед количеством и означает «около» или «приблизительно».'
    example_gloss: У меня было около двух часов.
  fa.a2.unit16.lesson02.teach.how_much_word:
    title: Сколько ты пользуешься соцсетями каждый день?
    gloss: Сколько ты пользуешься соцсетями каждый день?
    note: '*چقدر* значит «сколько»; здесь речь о времени, которое тратится на занятие.'
  fa.a2.unit16.lesson02.teach.my_habit_sentence:
    title: Расскажи о своей привычке с указанием частоты
    gloss: Я пользуюсь соцсетями около двух часов каждый день.
    note: Сочетает *هر روز* (каждый день) и *حدود دو ساعت* (около двух часов), чтобы рассказать о привычке и её продолжительности.
  fa.a2.unit16.lesson03.teach.world_word:
    title: Мир
    gloss: мир
    note: '*دنیا* — общее слово для обозначения мира.'
    example_gloss: Я люблю быть в курсе того, что происходит в мире.
  fa.a2.unit16.lesson03.teach.message_text:
    title: Сообщение о чтении новостей в интернете
    gloss: Привет! Я каждый день читаю новости около часа. По-моему, читать новости полезно, потому что я в курсе того, что происходит в мире.
    note: Короткое письменное сообщение с оборотом *به نظر من ... چون ...* («по-моему ..., потому что ...») в разговорном стиле, каким пишут друзьям.
  fa.a2.unit16.lesson04.teach.favorite_word:
    title: Любимый
    gloss: любимый
    note: '*مورد علاقه* значит «любимый»; в *علاقه‌ام* присоединён суффикс принадлежности «мой».'
    example_gloss: Мой любимый цвет — синий.
  fa.a2.unit16.lesson04.teach.turn01:
    title: نیما спрашивает سارا о соцсетях
    gloss: نیما спрашивает سارا, сколько она пользуется соцсетями каждый день.
    note: Повторяется вопрос «сколько» из второго урока.
  fa.a2.unit16.lesson04.teach.turn02:
    title: سارا рассказывает о своей привычке
    gloss: 'سارا говорит: около двух часов; её любимое приложение — Инстаграм.'
    note: Повторяется оборот с *حدود* («около») из второго урока.
  fa.a2.unit16.lesson04.teach.turn03:
    title: نیما спрашивает её мнение
    gloss: نیما спрашивает, считает ли она это полезным.
    note: '*به نظرت* («по-твоему») — форма второго лица от *به نظر من* («по-моему»).'
  fa.a2.unit16.lesson04.teach.turn04:
    title: سارا высказывает своё мнение
    gloss: سارا говорит, что, по её мнению, это и развлечение, и иногда потеря времени.
    note: '*هم ... هم ...* («и ... и ...») соединяет два качества одного предмета, здесь одно положительное и одно отрицательное.'
  fa.a2.unit16.lesson04.teach.turn05:
    title: نیما противопоставляет свою привычку
    gloss: نیما говорит, что он в основном читает новости, а не сидит в соцсетях.
    note: '*بیشتر ..., نه ...* («в основном ..., а не ...») выражает предпочтение через противопоставление.'
  fa.a2.unit16.lesson04.teach.turn06:
    title: سارا реагирует
    gloss: 'سارا говорит: как здорово!'
    note: 'Короткая повседневная реакция: *چه خوب!* значит «как здорово!».'
