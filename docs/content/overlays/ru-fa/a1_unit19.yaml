teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: Дом
    gloss: дом
    note: خونه означает «дом» (разговорная форма слова خانه).
    example_gloss: Мой дом большой.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Спальня
    gloss: спальня
    note: اتاق خواب буквально означает «комната для сна» — спальня.
    example_gloss: В нём две спальни.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Кухня
    gloss: кухня
    note: آشپزخانه означает «кухня».
    example_gloss: Кухня большая.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Ванная
    gloss: ванная
    note: حموم означает «ванная» (разговорная форма слова حمام).
    example_gloss: Ванная чистая.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Сколько
    gloss: сколько
    note: چند تا означает «сколько» и употребляется с исчисляемыми существительными.
    target_text: چند تا (сколько)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Два
    gloss: два
    note: دو تا означает «два» (о чём-то исчисляемом).
    example_gloss: В нём две ванные.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: В нём/ней есть
    gloss: в нём есть
    note: داره — разговорная форма слова دارد («имеет»); используется при описании того, что есть в доме.
    target_text: داره (у него есть, разговорное)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Кровать
    gloss: кровать
    note: تخت означает «кровать».
    example_gloss: Кровать в спальне.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Стол
    gloss: стол
    note: میز означает «стол».
    example_gloss: Стол стоит рядом с окном.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Стул
    gloss: стул
    note: صندلی означает «стул».
    example_gloss: Рядом со столом стоит стул.
  fa.a1.unit19.lesson03.teach.ye_word:
    title: Один / какой-то
    gloss: один / какой-то
    note: یه — разговорная форма слова یک («один»).
    target_text: یه (один/какой-то, разговорное)
  fa.a1.unit19.lesson03.teach.va_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет два предложения или два элемента.
    target_text: و (и)
  fa.a1.unit19.lesson04.teach.too_word:
    title: В / внутри
    gloss: в / внутри
    note: تو означает «в, внутри» и указывает на место внутри помещения.
    target_text: تو (в/внутри)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: Рядом с
    gloss: рядом с
    note: کنار означает «рядом с».
    target_text: کنار (рядом с)
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: Над / на
    gloss: над / на верху
    note: بالای означает «над, на верху».
    target_text: بالای (над/на)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: Это кровать
    gloss: это кровать
    note: '*تخته* — это *تخت* («кровать») плюс разговорное -е со значением «есть/является» (от *است*). В предложении *میز کنار تخته* это -е в конце делает фразу законченным предложением: стол [находится] рядом с кроватью.'
    target_text: تخته (это кровать, разговорное)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: Это кухня
    gloss: это кухня
    note: '*آشپزخانه‌س* — это *آشپزخانه* («кухня») плюс разговорная связка «есть/является» после гласной (от *است*). В предложении *صندلی تو آشپزخانه‌س* она завершает фразу: стул [находится] на кухне.'
    target_text: آشپزخانه‌س (это кухня, разговорное)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: Тоже
    gloss: тоже / также
    note: هم означает «тоже, также» и ставится после слова, к которому относится.
    target_text: هم (тоже)
  fa.a1.unit19.lesson05.teach.man_word:
    title: Я
    gloss: я
    note: من означает «я».
    example_gloss: В моём доме две спальни.
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: Дом (кого-то) / мой дом
    gloss: дом (кого-то) / мой дом
    note: خونه‌ی — форма خونه с эзафетом, которая ставится перед владельцем (خونه‌ی من = мой дом).
    target_text: خونه‌ی (дом чего-то / мой дом, форма с эзафетом)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: Пример описания жилья
    gloss: В моём доме две спальни. Ещё есть кухня и ванная.
    note: Короткое описание от первого лица с лексикой этого урока о жилье.
  fa.a1.unit19.lesson06.teach.names:
    title: Нима и Сара
    gloss: Нима, Сара
    note: Распространённые иранские имена, которые встречаются в этом курсе.
    example_gloss:
    - Дом Нимы большой.
    - Дом Сары маленький.
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: Как твой дом?
    gloss: Как твой дом?
    note: خونه‌ت چطوره؟ состоит из خونه‌ت («твой дом») и چطوره؟ («какой он?»).
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: Это хорошо
    gloss: это хорошо
    note: خوبه — разговорное сокращение от خوب است («это хорошо»).
    example_gloss: Этот дом хороший.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Ага
    gloss: ага
    note: آره — разговорная форма слова بله («да»).
    example_gloss: Ага, хороший.
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: Нима спрашивает
    gloss: Как твой дом?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: Сара отвечает
    gloss: Хороший. В нём две спальни и кухня.
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: Нима спрашивает
    gloss: Ванная там тоже есть?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: Сара отвечает
    gloss: Ага, ванная тоже есть.
