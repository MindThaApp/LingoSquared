course:
  title: Персидский язык (Иран) A1
  description: 'Разговорный иранский фарси для начинающих: названия комнат, описание дома с числами, предметы домашнего обихода, расположение в доме, чтение короткого описания жилья и диалог о чьём-то доме.'
units:
  fa.a1.unit19.housing:
    title: Жильё
    description: Опиши простой дом, комнаты, предметы обихода и расположение.
lessons:
  fa.a1.unit19.lesson01.basic_room_vocab:
    title: Названия комнат
  fa.a1.unit19.lesson02.describing_with_numbers:
