teaching:
  fa.a2.unit41.lesson01.teach.phones:
    title: Слова о телефоне
    gloss: телефон, камера, аккумулятор
    note: '*گوشی* — обычное слово для мобильного телефона.'
    example_gloss:
    - В моём телефоне есть камера.
    - В этом телефоне есть аккумулятор.
    - Это телефон.
  fa.a2.unit41.lesson01.teach.adjs:
    title: Дешёвый, дорогой, хороший, плохой
    gloss: дешёвый, дорогой, хороший, плохой
    note: '*ارزون* и *گرون* — обычные разговорные формы.'
    example_gloss:
    - Этот телефон дешёвый.
    - Тот телефон дорогой.
    - Этот телефон хороший.
    - Тот телефон плохой.
  fa.a2.unit41.lesson01.teach.comparative:
    title: 'Повторим сравнительную степень: -تر'
    gloss: дешевле, дороже, лучше, хуже
    note: 'Ты уже знаешь *-تر* со значением «более»: *ارزون‌تر*. *بهتر* и *بدتر* — сравнительные формы слов «хороший» и «плохой».'
  fa.a2.unit41.lesson01.teach.superlative:
    title: 'Превосходная степень: -ترین перед существительным'
    gloss: самый дешёвый телефон, самый дорогой телефон, самый лучший телефон, самый плохой телефон
    note: 'Добавь *-ین* к сравнительной степени и поставь её перед существительным: из *ارزون‌تر* получается *ارزون‌ترین گوشی*. Между двумя словами нет эзафета (*ـِ*).'
  fa.a2.unit41.lesson02.teach.housing:
    title: Слова о жилье
    gloss: квартира, комната, дом, станция
    note: '*خونه* — разговорная форма слова *خانه*.'
    example_gloss:
    - Квартира здесь.
    - Комната вон там.
    - Дом здесь.
    - Станция вон там.
  fa.a2.unit41.lesson02.teach.size:
    title: Большой, маленький, близкий, далёкий, красивый
    gloss: большой, маленький, близкий, далёкий, красивый
    note: '*کوچیک* — обычная разговорная форма слова *کوچک*.'
    example_gloss:
    - Квартира большая.
    - Комната маленькая.
    - Станция близко.
    - Дом далеко.
    - Дом красивый.
  fa.a2.unit41.lesson02.teach.forms:
    title: Любое прилагательное + ترین
    gloss: самая большая квартира; самая маленькая комната; ближайшая станция; самый красивый дом
    note: 'Схема одинакова для всех прилагательных: прилагательное + *‌ترین* (с небольшим промежутком, пишется через полупробел) перед существительным.'
  fa.a2.unit41.lesson02.teach.spoken:
    title: 'В речи: از همه + сравнительная степень'
    gloss: Эта квартира самая большая (больше всех); эта комната самая маленькая
    note: 'Когда превосходная степень является сказуемым, в речи часто говорят «больше всех»: *از همه بزرگ‌تره*. Это значит «самый большой». Сказуемым может быть и сама превосходная степень: *این بزرگ‌ترینه* («это самое большое»).'
  fa.a2.unit41.lesson03.teach.holiday:
    title: Слова об отдыхе
    gloss: отель, поездка, море, гора
    note: '*سفر* — это поездка, путешествие.'
    example_gloss:
    - Отель здесь.
    - Поездка чудесная.
    - Море вон там.
    - Гора далеко.
  fa.a2.unit41.lesson03.teach.opinion:
    title: По моему мнению, какой
    gloss: по моему мнению, какой, какой это
    note: '*به نظر من* вводит твоё мнение. *کدومه؟* спрашивает: «какой это?».'
    example_gloss:
    - По-моему, этот отель хороший.
    - Какой отель?
  fa.a2.unit41.lesson03.teach.choose:
    title: Спрашиваем, что лучше всего
    gloss: Какой отель самый дешёвый? Отель в горах самый дешёвый.
    note: Чтобы выбрать один из трёх вариантов, спроси *کدوم ... از همه ...؟* и ответь по той же схеме.
  fa.a2.unit41.lesson04.teach.asas:
    title: Такой же ... как
    gloss: настолько же, как; не является
    note: После *به اندازه‌ی* идёт то, с чем ты сравниваешь.
    example_gloss:
    - Этот телефон такой же дешёвый, как тот.
    - Тот телефон не такой хороший, как этот.
  fa.a2.unit41.lesson04.teach.asas_rule:
    title: Равенство и неравенство
    gloss: Этот дом такой же большой, как тот; эта комната не такая большая, как та
    note: '*به اندازه‌ی* + существительное + прилагательное выражает равенство. Для «не такой ... как» в конце ставится *نیست*. В утвердительной фразе прилагательное принимает разговорную связку (*بزرگه* = *بزرگ* + *است*). В отрицательной связка заменяется на *نیست*, поэтому говорят *بزرگ نیست*, а не *بزرگه نیست*.'
  fa.a2.unit41.lesson05.teach.reading:
    title: Три квартиры
    gloss: Я хочу снять квартиру. Я посмотрел три квартиры. Первая квартира была самой дешёвой, но самой маленькой. Вторая квартира была самой большой, но очень далеко. Третья квартира была не такой большой, как вторая, но самой близкой. По-моему, третья квартира лучшая.
    note: Прочитай один раз, чтобы понять про три квартиры, а потом ещё раз — обращая внимание на слова с окончанием *-ترین*.
  fa.a2.unit41.lesson06.teach.turn01:
    title: Сара спрашивает, какой телефон лучше
    gloss: 'Сара: Нима, какой телефон лучше?'
    note: '*بهتره* — сравнительная степень «лучше».'
  fa.a2.unit41.lesson06.teach.turn02:
    title: Нима высказывает своё мнение
    gloss: 'Нима: По-моему, этот телефон самый лучший.'
    note: В *بهترین گوشی* превосходная степень стоит перед существительным.
  fa.a2.unit41.lesson06.teach.turn03:
    title: Сара замечает цену
    gloss: 'Сара: Но этот телефон самый дорогой.'
    note: '*از همه گرون‌تره* — разговорное «самый дорогой».'
  fa.a2.unit41.lesson06.teach.turn04:
    title: Нима сравнивает
    gloss: 'Нима: Да. Тот телефон самый дешёвый, но он не такой хороший, как этот.'
    note: '*ارزون‌ترینه* — превосходная степень в роли сказуемого.'
  fa.a2.unit41.lesson06.teach.turn05:
    title: Сара решает
    gloss: 'Сара: Тогда я куплю этот.'
    note: '*می‌خرم* в речи значит также «я куплю».'
