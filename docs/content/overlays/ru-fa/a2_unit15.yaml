course:
  title: Персидский A2
  description: 'Персидский (Иран) для уровня ниже среднего: что делать при задержке поезда — понимать объявление о сбое, вежливо спросить сотрудника вокзала об альтернативном маршруте и прочитать письменное уведомление о той же задержке.'
units:
  fa.a2.unit15.travel_disruption:
    title: Проблемы в поездке
lessons:
  fa.a2.unit15.lesson01.travel_disruption_vocabulary:
    title: Слова о задержке
  fa.a2.unit15.lesson02.asking_about_alternatives:
    title: Вопрос об альтернативном маршруте
  fa.a2.unit15.lesson03.reading_a_station_notice:
    title: Читаем объявление на вокзале
  fa.a2.unit15.lesson04.station_counter_dialogue:
    title: У кассы на вокзале
teaching:
  fa.a2.unit15.lesson01.teach.train_word:
    title: Поезд
    gloss: поезд
    note: '*قطار* — общее слово для обозначения поезда.'
    example_gloss: Мой поезд отправляется в девять.
  fa.a2.unit15.lesson01.teach.delay_word:
    title: Задержка
    gloss: задержка
    note: '*تاخیر* — общее слово для обозначения задержки.'
    example_gloss: Сегодня поезд задерживается.
  fa.a2.unit15.lesson01.teach.platform_word:
    title: Платформа
    gloss: платформа
    note: '*سکو* — слово для железнодорожной платформы; *سکوی* — его форма с изафетом перед числом, например *سکوی سه* («платформа три»).'
    example_gloss: Поезд отправляется с третьей платформы.
  fa.a2.unit15.lesson01.teach.cancel_word:
    title: Отменён
    gloss: отменён
    note: '*لغو* — слово «отменённый»; *لغو شدن* («быть отменённым») — глагольная конструкция, образованная от него.'
    example_gloss: Билет на поезд был отменён.
  fa.a2.unit15.lesson01.teach.announcement_word:
    title: Объявление
    gloss: объявление
    note: '*اعلامیه* — слово для письменного объявления или уведомления.'
    example_gloss: Это объявление очень важное.
  fa.a2.unit15.lesson01.teach.alternative_route_word:
    title: Альтернативный маршрут
    gloss: альтернативный маршрут
    note: '*مسیر جایگزین* состоит из *مسیر* («маршрут») и *جایگزین* («альтернативный», «замещающий»).'
    example_gloss: Альтернативный маршрут отправляется с пятой платформы.
  fa.a2.unit15.lesson01.teach.recap_numbers_time:
    title: Время и числа для этого раздела
    gloss: девять часов, десять часов, три, пять
    note: Краткое повторение чисел и времени, нужных в сценарии этого раздела.
  fa.a2.unit15.lesson02.teach.when_does_it_leave:
    title: Извините, когда отправляется поезд?
    gloss: Извините, когда отправляется поезд?
    note: '*ببخشید* вежливо открывает вопрос к незнакомому человеку или сотруднику.'
  fa.a2.unit15.lesson02.teach.is_there_an_alternative:
    title: Есть ли альтернативный маршрут?
    gloss: Есть ли альтернативный маршрут?
    note: '*هست؟* («есть ли?») — базовый вопрос о наличии, с помощью которого спрашивают, доступно ли что-то.'
  fa.a2.unit15.lesson02.teach.full_alternative_question:
    title: Вежливо спросить о более раннем альтернативном маршруте
    gloss: Извините, есть ли альтернативный маршрут, чтобы я приехал раньше?
    note: '*که زودتر برسم* («чтобы я приехал раньше») добавляет цель к простому вопросу о наличии.'
  fa.a2.unit15.lesson03.teach.because_of_note:
    title: Из-за (+ существительное)
    gloss: из-за ...
    note: После *به خاطر* сразу идёт СУЩЕСТВИТЕЛЬНОЕ (*به خاطر مشکل فنی* — «из-за технической проблемы»), в отличие от *چون* («потому что»), после которого стоит целое предложение.
  fa.a2.unit15.lesson03.teach.technical_problem_word:
    title: Техническая проблема
    gloss: техническая проблема
    note: '*مشکل فنی* — стандартное выражение для технической проблемы, частое в объявлениях о поездках.'
    example_gloss: Поезд задерживается из-за технической проблемы.
  fa.a2.unit15.lesson03.teach.notice_text:
    title: Объявление на вокзале о задержке
    gloss: 'Внимание: поезд в Исфахан в девять часов задерживается на один час из-за технической проблемы и отправится в десять с третьей платформы. Резервный автобус отправляется в девять тридцать с пятой платформы.'
    note: Короткое официальное объявление на вокзале в нейтральном письменном стиле, но с повседневными разговорными глагольными окончаниями (*داره*, *می‌کنه*).
  fa.a2.unit15.lesson04.teach.i_will_wait:
    title: Я подожду поезд
    gloss: Я подожду поезд.
    note: '*منتظر ... می‌مونم* («останусь ждать ...») — стандартный способ сказать, что ты будешь чего-то ждать.'
  fa.a2.unit15.lesson04.teach.turn01:
    title: نیما спрашивает, когда отправляется поезд
    gloss: نیما вежливо спрашивает, когда отправляется поезд в Исфахан в девять часов.
    note: Здесь повторяется вводная фраза из этого же урока.
  fa.a2.unit15.lesson04.teach.turn02:
    title: کارمند объясняет задержку
    gloss: Сотрудник говорит, что, к сожалению, из-за технической проблемы поезд задерживается на час и теперь отправится в десять с третьей платформы.
    note: '*متاسفانه* («к сожалению») смягчает сообщение плохой новости.'
  fa.a2.unit15.lesson04.teach.turn03:
    title: نیما спрашивает об альтернативе
    gloss: نیما спрашивает, есть ли альтернативный маршрут, чтобы приехать раньше.
    note: Здесь повторяется полный вопрос об альтернативном маршруте из второго урока.
  fa.a2.unit15.lesson04.teach.turn04:
    title: کارمند предлагает альтернативный автобус
    gloss: 'Сотрудник отвечает «да»: автобус отправляется в девять тридцать с пятой платформы, но Нима придётся купить новый билет.'
    note: '*باید ... بخرید* («вам нужно будет купить») называет реальную цену альтернативы.'
  fa.a2.unit15.lesson04.teach.turn05:
    title: نیما отказывается и ждёт
    gloss: نیما говорит, что всё в порядке, он подождёт поезд.
    note: '*مشکلی نیست* (нет проблем / всё в порядке) — вежливый отказ от предложения.'
  fa.a2.unit15.lesson04.teach.turn06:
    title: کارمند подтверждает план
    gloss: 'Сотрудник говорит: хорошо, тогда ждите в десять на платформе три.'
    note: '*پس* (значит / тогда) подводит итог тому, что решил نیما.'
