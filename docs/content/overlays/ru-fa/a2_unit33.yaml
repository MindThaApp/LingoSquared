teaching:
  fa.a2.unit33.lesson01.teach.people:
    title: Люди
    gloss: я, Сара, Нима
    note: Сара и Нима — друзья, которые говорят о своих привычках. *من* обычно опускается, потому что окончание глагола уже показывает «я».
    example_gloss:
    - Я виделНиму.
    - Сара и Нима — друзья.
  fa.a2.unit33.lesson01.teach.sport_words:
    title: Слова о спорте и хобби
    gloss: бег, плавание, занятия спортом, чтение книг, спортзал, парк
    note: 'Занятия называются отглагольным существительным на *-ن*: *دویدن* (бег), *خوندن* (чтение). Составные глаголы образуются с *کردن*: *شنا کردن*, *ورزش کردن*.'
    example_gloss:
    - Я начал бегать в парке.
    - Я занимаюсь спортом в спортзале.
  fa.a2.unit33.lesson01.teach.screen_food:
    title: Слова об экранах и еде
    gloss: телефон, телевизор, газировка, сладости, вода, час
    note: '*نگاه کردن* — обычный разговорный глагол для просмотра телевизора: *تلویزیون نگاه کردن*. Форма множественного числа *شب‌ها* означает «по вечерам, ночью» как привычку.'
    example_gloss:
    - По вечерам я час смотрю телевизор.
    - Я час пользуюсь телефоном.
  fa.a2.unit33.lesson01.teach.time_words:
    title: Слова о времени и привычках
    gloss: каждый день, месяц, неделя, назад, с, больше (не), рано, поздно, меньше
    note: '*از ماه پیش* означает «с месяца назад», то есть «уже месяц»; *پیش* после слова о времени значит «назад». *دیگه* с отрицательным глаголом означает «больше не».'
    example_gloss:
    - Уже месяц я бегаю каждый день.
    - С прошлой недели я по вечерам рано ложусь спать.
  fa.a2.unit33.lesson01.teach.start_form:
    title: 'Начало: شروع کردم به + отглагольное существительное'
    gloss: я начал бегать; я начал плавать
    note: 'Чтобы сказать, что ты начал привычку, используй *شروع کردم به* и отглагольное существительное (форма на *-ن*): *شروع کردم به دویدن*. Второй глагол не спрягается.'
  fa.a2.unit33.lesson01.teach.stop_form:
    title: 'Прекращение: دیگه ... نمی‌کنم и ترک کردم'
    gloss: я больше не пью газировку; я бросил сладкое
    note: 'Два естественных способа сказать, что бросил: *دیگه* и отрицательный глагол настоящего времени (*دیگه نمی‌دوم* = я больше не бегаю) или *X رو ترک کردم* (я бросил X) с маркером определённого прямого дополнения *رو*.'
  fa.a2.unit33.lesson02.teach.subjunctive_verbs:
    title: Глаголы в «желательной» форме
    gloss: чтобы я спал, проснулся, бегал, ел/пил, позвонил, пошёл, сделал
    note: 'Эти окончания (*-م*) стоят после *سعی* и *یادم رفت*. В составных глаголах существительное сохраняется, а меняется вспомогательный глагол: *ورزش کنم*, *زنگ بزنم*, *بیدار شم*.'
    example_gloss:
    - Я хочу бегать каждый день.
    - Мне нужно рано вставать.
  fa.a2.unit33.lesson02.teach.try_forget_words:
    title: Стараться и забывать
    gloss: стараться, я забыл, что, вчера, сегодня
    note: '*یادم رفت* состоит из *یاد* (память) + *م* + *رفت*: «это ушло из моей памяти». Та же конструкция работает для любого лица: *یادش رفت*, *یادت رفت*.'
    example_gloss:
    - Вчера я забыл выпить воды.
    - Сегодня я стараюсь рано лечь спать.
  fa.a2.unit33.lesson02.teach.try_form:
    title: 'Старание: سعی می‌کنم / سعی کردم + сослагательная форма'
    gloss: я стараюсь рано спать; я старался рано вставать
    note: '*سعی می‌کنم* — «я стараюсь», а *سعی کردم* — «я старался». Второй глагол всегда стоит в форме с *ب-* с тем же личным окончанием, без *به*: *سعی کردم زود بیدار شم*.'
  fa.a2.unit33.lesson02.teach.forget_form:
    title: 'Забывание: یادم رفت (که) + сослагательная форма'
    gloss: я забыл позвонить; я забыл выпить воды
    note: '*یادم رفت* и форма с *ب-* означают «я забыл это сделать». Слово *که* в речи необязательно: *یادم رفت زنگ بزنم* = *یادم رفت که زنگ بزنم*.'
  fa.a2.unit33.lesson02.teach.subjunctive_shape:
    title: Как образуется «желательная» форма
    gloss: ب + основа + личное окончание
    note: 'У большинства глаголов *ب-* добавляется перед основой: *بدوم*, *بخورم*, *بخوابم*. В составных глаголах оно стоит на вспомогательном глаголе (*زنگ بزنم*) или используются *کنم* и *شم*. В речи *بیدار بشم* часто сокращается до *بیدار شم*.'
  fa.a2.unit33.lesson03.teach.four_frames:
    title: Четыре конструкции — четыре значения
    gloss: начал бегать / пытался бегать / забыл побегать / больше не бегаю
    note: 'Одно и то же занятие меняет значение в зависимости от конструкции: *شروع کردم به دویدن* (я начал), *سعی کردم بدوم* (я пытался), *یادم رفت بدوم* (я забыл), *دیگه نمی‌دوم* (я больше не).'
  fa.a2.unit33.lesson03.teach.noun_or_subjunctive:
    title: Отглагольное существительное или «желательная» форма?
    gloss: به + отглагольное существительное или форма с ب-
    note: 'После *شروع کردم به* ставь отглагольное существительное (*شنا کردن*). После *سعی کردم* и *یادم رفت* ставь личную форму на *-م* (*شنا کنم*). Не смешивай их: *سعی کردم به شنا کردن* — неправильно.'
  fa.a2.unit33.lesson03.teach.dige_negative:
    title: دیگه + отрицание значит «больше не»
    gloss: Я больше не смотрю телевизор по вечерам
    note: '*دیگه* перед отрицательным глаголом показывает, что раньше что-то происходило, а теперь прекратилось. Без *دیگه* фраза *نوشابه نمی‌خورم* — просто общий факт («я не пью газировку»), а не перемена.'
  fa.a2.unit33.lesson04.teach.questions:
    title: Вопросы о привычках
    gloss: С каких пор ты начал? От чего ты отказался?
    note: 'Вопрос оканчивается на форму «ты» с *-ی*: *شروع کردی* = ты начал, *ترک کردی* = ты бросил. Отвечай в форме на *-م*.'
    example_gloss:
    - С каких пор ты начал?
    - От чего ты отказался?
  fa.a2.unit33.lesson04.teach.answer_since:
    title: Ответ с указанием времени начала
    gloss: с прошлого месяца я начал бегать
    note: 'Сначала ставь время: *از ماه پیش شروع کردم به دویدن*. Если ты что-то бросил, сначала ставь объект и добавляй *رو*: *نوشابه رو ترک کردم*.'
  fa.a2.unit33.lesson05.teach.link_words:
    title: Соединительные слова
    gloss: но, тоже, выключено
    note: '*هم* после существительного или глагольной группы значит «тоже». *خاموش کردن* — «выключать»; с определённым объектом ставится *رو*.'
    example_gloss:
    - Я выключил телефон.
    - Я пытался, но забыл.
  fa.a2.unit33.lesson05.teach.reading_note:
    title: Текст об изменившихся привычках
    gloss: ''
    note: Прочитай один раз, чтобы найти два изменения (одно начато, два брошены), а потом ещё раз — чтобы понять, что говорящий старается делать и что забыл.
  fa.a2.unit33.lesson06.teach.chat_words:
    title: Слова для чата
    gloss: как дела с этим, это хорошо, молодец, прости, тогда, почему, нет, ты пьёшь, ты не позвонил
    note: '*آفرین* — похвала другу («молодец»). *ببخش* — неформальное «прости»; с незнакомыми говори *ببخشید*.'
    example_gloss:
    - Как идут тренировки? Хорошо!
    - Так почему ты не позвонил?
  fa.a2.unit33.lesson06.teach.turn01:
    title: Сара спрашивает о спорте
    gloss: 'Сара спрашивает Ниму: Как тренировки?'
    note: Этот вопрос начинает разговор о его новых привычках.
  fa.a2.unit33.lesson06.teach.turn02:
    title: Нима говорит, что начал
    gloss: 'Нима: Хорошо! Месяц назад я начал бегать.'
    note: '*شروع کردم به* плюс отглагольное существительное *دویدن*.'
  fa.a2.unit33.lesson06.teach.turn03:
    title: Сара хвалит и спрашивает
    gloss: 'Сара: Молодец! А газировку ты пьёшь?'
    note: '*هم* значит «тоже».'
  fa.a2.unit33.lesson06.teach.turn04:
    title: Нима бросил газировку
    gloss: 'Нима: Нет, я бросил газировку. Ещё я стараюсь меньше пользоваться телефоном.'
    note: Один отказ (*ترک کردم*) и одна попытка (*سعی می‌کنم*).
  fa.a2.unit33.lesson06.teach.turn05:
    title: Сара спрашивает, почему не было звонка
    gloss: 'Сара: Так почему ты вчера не позвонил?'
    note: В вопросе используется форма «ты» с *-ی*.
  fa.a2.unit33.lesson06.teach.turn06:
    title: Нима признаёт, что забыл
    gloss: 'Нима: Прости, я забыл позвонить.'
    note: '*یادم رفت* плюс форма с *ب-*.'
