  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: Выпей воды (приказ)
    gloss: пей воду
    note: 'آب بخور — неформальная форма повелительного наклонения: «выпей воды!»'
  fa.a1.unit17.lesson04.teach.va_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет два предложения или два слова.
    target_text: و (и)
  fa.a1.unit17.lesson05.teach.reading_text:
    title: Короткая записка о симптомах
    gloss: У меня болит голова и жар. Я устал(а).
    note: Короткая записка от первого лица со словами о симптомах из этого урока.
  fa.a1.unit17.lesson06.teach.names:
    title: Нима и Сара
    gloss: Нима, Сара
    note: Распространённые иранские имена, которые встречаются в этом курсе.
    example_gloss:
    - У Нимы болит голова.
    - Сара помогает Ниме.
  fa.a1.unit17.lesson06.teach.ham_word:
    title: Тоже
    gloss: тоже / также
    note: هم означает «тоже, также» и ставится после слова, к которому относится (آب هم بخور = выпей ещё и воды).
    target_text: هم (тоже)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: В порядке
    gloss: в порядке
    note: باشه — разговорная форма от باشد (хорошо, ладно).
    example_gloss: Хорошо, я отдохну.
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: Благодарность
    gloss: спасибо
    note: ممنون означает «спасибо».
    example_gloss: Спасибо за помощь.
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: У него/неё есть
    gloss: у него/неё есть
    note: داره — разговорная форма 3-го лица от دارد (имеет); соответствует форме دارم в 1-м лице.
    target_text: داره (у него/неё есть, разговорная форма 3-го лица)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: Нима говорит
    gloss: Мне нехорошо. У меня болит голова и жар.
  fa.a1.unit17.lesson06.teach.dialogue_line2:
