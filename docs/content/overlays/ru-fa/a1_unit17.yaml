teaching:
  fa.a1.unit17.lesson01.teach.halam_khoob_nist_phrase:
    title: Я плохо себя чувствую
    gloss: я плохо себя чувствую
    note: حالم خوب نیست буквально означает «моё состояние нехорошее» — это стандартный способ сказать, что тебе нехорошо.
  fa.a1.unit17.lesson01.teach.sardard_word:
    title: Головная боль
    gloss: головная боль
    note: سردرد означает «головная боль».
    example_gloss: У меня болит голова.
  fa.a1.unit17.lesson01.teach.daram_word:
    title: У меня есть
    gloss: у меня есть
    note: دارم означает «у меня есть» и употребляется с названием симптома (سردرد دارم = «у меня болит голова»).
    target_text: دارم (у меня есть)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: Температура
    gloss: температура (жар)
    note: تب означает «температура, жар».
    example_gloss: У меня температура.
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: У меня болит живот
    gloss: у меня болит живот
    note: دلم درد می‌کنه буквально значит «моё нутро/живот делает боль» — так по-разговорному говорят, что болит живот.
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: Я устал(а)
    gloss: я устал(а)
    note: '*خسته‌ام* значит «я устал(а)»: окончание *-ام* — краткая форма от *هستم* (я есть), присоединённая к *خسته* (усталый). Форма одинакова для мужчины и женщины.'
    example_gloss: Сегодня я устал(а).
  fa.a1.unit17.lesson03.teach.komak_word:
    title: Помощь
    gloss: помощь
    note: کمک означает «помощь».
    example_gloss: Ты можешь мне помочь?
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: Ты можешь
    gloss: ты можешь
    note: می‌تونی — разговорная форма от می‌توانی (ты можешь), неформальное обращение на «ты».
    target_text: می‌تونی (ты можешь, неформально)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: Можешь мне помочь?
    gloss: Можешь мне помочь?
    note: '*می‌تونی کمکم کنی؟* состоит из *می‌تونی* (ты можешь) и *کمکم کنی* (буквально «сделать мою помощь», то есть помочь мне).'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: Врач
    gloss: врач
    note: دکتر означает «врач».
    example_gloss: Врач сказал отдыхать.
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: Лекарство
    gloss: лекарство
    note: دارو означает «лекарство».
    example_gloss: Прими это лекарство.
  fa.a1.unit17.lesson04.teach.esterahat_kon_phrase:
    title: Отдохни (приказ)
    gloss: отдохни
