teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: Я просыпаюсь
    gloss: я просыпаюсь
    note: بیدار می‌شم — разговорная тегеранская форма от بیدار می‌شوم.
    example_gloss: Я просыпаюсь каждый день в семь.
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: Я завтракаю
    gloss: я завтракаю
    note: В صبحونه می‌خورم используется разговорное слово صبحونه («завтрак») вместо более формального صبحانه.
    example_gloss: Я завтракаю и иду на работу.
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: Я иду на работу
    gloss: я иду на работу
    note: میرم سر کار — разговорная форма от می‌روم سر کار.
    example_gloss: Потом я иду на работу.
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: Я ложусь спать
    gloss: я ложусь спать
    note: می‌خوابم означает «сплю» или «ложусь спать».
    example_gloss: Ночью я рано ложусь спать.
  fa.a1.unit11.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — обычный соединительный союз, которым связывают действия распорядка дня; он уже встречался в разделе 9.'
    example_gloss: Я просыпаюсь и завтракаю.
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: Во сколько ты просыпаешься?
    gloss: Во сколько ты просыпаешься?
    note: В *ساعت چند بیدار می‌شی؟* повторяется *ساعت چند* («во сколько») из уроков о времени в разделе 9.
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: Я просыпаюсь в семь.
    gloss: Я просыпаюсь в семь.
    note: ساعت هفت بیدار می‌شم — указание конкретного времени пробуждения.
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: Каждый день
    gloss: каждый день
    note: هر روز означает «каждый день»; так показывают, что действие привычное.
    example_gloss: Я просыпаюсь каждый день в семь.
  fa.a1.unit11.lesson03.teach.bad:
    title: После этого
    gloss: после этого
    note: بعدش означает «после этого»; слово помогает выстроить действия по порядку.
    example_gloss: Я просыпаюсь, потом завтракаю.
  fa.a1.unit11.lesson03.teach.parts_of_day:
    title: Утро, полдень, вторая половина дня, ночь
    gloss: утро, полдень, вторая половина дня, ночь
    note: '*صبح*, *ظهر*, *عصر* и *شب* — четыре части суток, они повторяются из раздела 9.'
    example_gloss:
    - Я просыпаюсь утром.
    - В полдень я обедаю.
    - Я работаю во второй половине дня.
    - Я сплю ночью.
  fa.a1.unit11.lesson03.teach.night_routine:
    title: По ночам я ложусь спать в одиннадцать.
    gloss: По ночам я ложусь спать в одиннадцать.
    note: '*شب‌ها ساعت یازده می‌خوابم* опирается на слово *شب* («ночь») из раздела 9 о частях суток; *شب‌ها* означает «по ночам», то есть regularно.'
  fa.a1.unit11.lesson04.teach.routine_text:
    title: Текст о распорядке дня
    gloss: Каждый день я просыпаюсь в семь. После этого я завтракаю и иду на работу.
    note: Это настоящий связный рассказ об утреннем распорядке; действия выстроены по порядку с помощью هر روز и بعدش.
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: А ты?
    gloss: А ты?
    note: تو چی؟ — так возвращают вопрос собеседнику.
  fa.a1.unit11.lesson05.teach.yekam_dirtar:
    title: Немного позже
    gloss: немного позже
    note: یه‌کم دیرتر означает «немного позже»; так сравнивают два распорядка дня.
  fa.a1.unit11.lesson06.teach.turn01:
    title: Во сколько ты просыпаешься каждый день?
    gloss: Во сколько ты просыпаешься каждый день?
    note: Сара начинает с вопроса к Ниме о времени пробуждения.
  fa.a1.unit11.lesson06.teach.turn02:
    title: Я просыпаюсь в семь. А ты?
    gloss: Я просыпаюсь в семь. А ты?
    note: Нима отвечает и возвращает вопрос Саре.
  fa.a1.unit11.lesson06.teach.turn03:
    title: Я немного позже, в восемь.
    gloss: Я немного позже, в восемь.
    note: Сара сравнивает своё время пробуждения со временем Нимы.
  fa.a1.unit11.lesson06.teach.turn04:
    title: Что ты делаешь после пробуждения?
    gloss: Что ты делаешь после пробуждения?
    note: Нима спрашивает о следующем пункте в распорядке Сары.
  fa.a1.unit11.lesson06.teach.turn05:
    title: Я завтракаю и иду на работу. По ночам я обычно ложусь спать в одиннадцать.
    gloss: Я завтракаю и иду на работу. По ночам я обычно ложусь спать в одиннадцать.
    note: Сара одним связным ответом описывает остальную часть своего распорядка; время сна и пробуждения совпадает с тем, что было раньше в разделе.
  fa.a1.unit11.lesson06.teach.third_person_forms:
    title: Он/она просыпается, он/она ложится спать
    gloss: он/она просыпается, он/она ложится спать
    note: بیدار می‌شه и می‌خوابه — формы 3-го лица (او); они нужны, чтобы рассказать о Саре или Ниме, в отличие от форм 1-го лица (بیدار می‌شم، می‌خوابم), которые использовались в этом разделе раньше.
