teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: Он / она
    gloss: он / она
    note: '*او* снова встречается здесь как подлежащее в описаниях внешности.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Рост
    gloss: рост
    note: '*قد* снова встречается здесь само по себе. В *قدش* добавлен притяжательный суффикс *-ش* (его/её рост) — как в *امتحانش* из Урока 20.'
    example_gloss: Нима высокий.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Высокий
    gloss: высокий
    note: '*بلند* значит «высокий» (или «длинный»). *قدش بلنده* буквально значит «его/её рост высокий» — это естественный разговорный способ сказать, что человек высокий.'
    example_gloss: Он высокого роста.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Низкий
    gloss: низкий
    note: '*کوتاه* значит «низкий» (о росте), «короткий».'
    example_gloss: Он низкого роста.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: Волосы
    gloss: волосы
    note: '*مو* значит «волосы». *موی* — форма с эзафетом (соединительная), которая ставится перед прилагательным, как в *موی بلند* (длинные волосы).'
    example_gloss: У него длинные волосы.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Его / её волосы
    gloss: его / её волосы
    note: '*موهاش* состоит из формы множественного числа *موها* (волосы) и притяжательного суффикса *-ش* — «его/её волосы».'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Чёрный
    gloss: чёрный
    note: '*مشکی* — обычное разговорное слово для чёрных волос и глаз; здесь оно естественнее, чем *سیاه* из Урока 20, которое больше подходит для одежды.'
    example_gloss: У неё чёрные волосы.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Светлый (о волосах)
    gloss: светлый, блонд
    note: '*بلوند* (заимствованное слово) значит «светловолосый, блонд».'
    example_gloss: У неё светлые волосы.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Глаз
    gloss: глаз
    note: '*چشم* значит «глаз». *چشمای* — разговорная форма множественного числа с эзафетом (глаза ...), как в *چشمای آبی* (голубые глаза).'
    example_gloss: У него карие глаза.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Его / её глаза
    gloss: его / её глаза
    note: '*چشماش* состоит из разговорной формы множественного числа *چشما* и притяжательного суффикса *-ش* — «его/её глаза». Обрати внимание: в *چشماش آبیه* стоит окончание единственного числа *-ه*, хотя *چشما* — множественное число. Для персидского это нормально: при неодушевлённых предметах во множественном числе обычно ставится глагол в единственном числе.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Карий
    gloss: карий, коричневый
    note: '*قهوه‌ای* (буквально «кофейного цвета») значит «карий, коричневый».'
    example_gloss: У неё карие глаза.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Зелёный
    gloss: зелёный
    note: '*سبز* значит «зелёный».'
    example_gloss: У неё зелёные глаза.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Синий
    gloss: синий
    note: '*آبی* снова встречается здесь для обозначения цвета глаз.'
    example_gloss: У неё голубые глаза.
  fa.a1.unit25.lesson04.teach.man_review:
    title: Я
    gloss: я
    note: '*من*, хорошо тебе знакомое, снова встречается здесь в описании себя.'
    example_gloss: У меня каштановые волосы.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: У меня есть / у него-неё есть
    gloss: у меня есть / у него-неё есть
    note: '*دارم*/*داره* так же используются и с внешним признаком: *موی مشکی دارم* значит «У меня чёрные волосы».'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Очки
    gloss: очки
    note: '*عینک* значит «очки».'
    example_gloss: Он носит очки.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: Он/она носит
    gloss: он/она носит
    note: '*می‌زنه* (буквально «бьёт, ударяет») — естественный глагол для ношения очков: *عینک می‌زنه* значит «носит очки». Это другой глагол, не *می‌کنم* (делать) из Уроков 8 и 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: Как он/она выглядит?
    gloss: как он/она выглядит?
    note: '*چه شکلیه؟* буквально значит «какой он формы?» — стандартный разговорный вопрос о внешности человека.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: И
    gloss: и
    note: '*و* значит «и» — так оно уже использовалось в Уроках 14 и 24.'
    example_gloss: Он высокий, волосы у него чёрные.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Нима
    gloss: Нима
    note: '*نیما*, персонаж, с которым ты познакомился ещё в Уроке 11, снова появляется здесь.'
    example_gloss: Нима — друг Сары.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Чтение: внешность Нимы'
    gloss: Нима высокий. Волосы у него чёрные, а глаза карие. Он носит очки.
    note: 'В этом тексте повторяются все конструкции из уроков 1–4: почти нет новых слов, нужно лишь узнавать их в связном тексте.'
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Марьям
    gloss: Марьям
    note: '*مریم* — новый персонаж, подруга سارا, с которой نیما ещё не знаком.'
    example_gloss: Марьям — подруга Сары.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Сейчас
    gloss: сейчас
    note: Слово *الان* встречается здесь снова.
    example_gloss: Марьям сейчас придёт.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Идёт, приходит
    gloss: придёт
    note: '*میاد* — разговорная форма настоящего времени от *آمدن* (приходить).'
    example_gloss: Марьям сейчас придёт.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: Какого он цвета?
    gloss: какого он цвета?
    note: '*چه رنگیه؟* состоит из *چه* (что, какой, из lesson04), *رنگی* (цветной, от *رنگ* + *-ی*) и *-ه* (есть): «какого цвета?»'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Хорошо, спасибо
    gloss: хорошо, спасибо
    note: '*باشه* и *ممنون*, уже изученные раньше, здесь объединяются в естественную заключительную фразу.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Сара: Марьям сейчас придёт.'
    gloss: Марьям сейчас придёт.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Нима: Как выглядит Марьям?'
    gloss: Как выглядит Марьям?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Сара: Она высокая, волосы чёрные.'
    gloss: Она высокая, волосы у неё чёрные.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Нима: Какого цвета у неё глаза?'
    gloss: Какого цвета у неё глаза?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Сара: Глаза у неё карие.'
    gloss: Глаза у неё карие.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Нима: Хорошо, спасибо.'
    gloss: Хорошо, спасибо.
