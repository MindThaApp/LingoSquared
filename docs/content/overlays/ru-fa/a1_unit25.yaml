course:
  title: Персидский язык (Иран) A1
  description: 'Начальный персидский (Иран): описание роста человека (высокий/низкий), волос (длина и цвет: чёрные, светлые), цвета глаз (карие, зелёные, голубые) и того, носит ли он очки; вопрос «Как он/она выглядит?», короткий текст для чтения о внешности نیما и заключительный диалог между نیما и سارا о том, как узнать подругу Сары — مریم.'
