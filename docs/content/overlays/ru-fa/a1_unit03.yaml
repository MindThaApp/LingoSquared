    correct_option: одна
    distractors:
    - две
    - пять
    - десять
    accepted_answers:
    - value: одна
      status: correct
    feedback: یک означает «один».
  fa.a1.unit03.lesson01.exercise02.recognize_panj:
    instruction: Выбери значение слова پنج.
    correct_option: пять
    distractors:
    - одна
    - восемь
    - три
    accepted_answers:
    - value: пять
      status: correct
    feedback: پنج означает «пять».
  fa.a1.unit03.lesson01.exercise03.recognize_zero_to_five_reading:
    instruction: Какие это числа по порядку?
    correct_option: 0, 1, 2, 3, 4, 5
    distractors:
    - 1, 2, 3, 4, 5, 6
    - 0, 2, 4, 6, 8, 10
    - 5, 4, 3, 2, 1, 0
    accepted_answers:
