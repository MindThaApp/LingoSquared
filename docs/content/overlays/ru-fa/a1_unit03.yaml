course:
  title: Персидский язык (Иран) A1
  description: 'Персидский язык Ирана для начинающих: чтение письма, понимание повседневной речи и вежливое общение в практических ситуациях.'
units:
  fa.a1.unit03.numbers:
    title: Числа
lessons:
  fa.a1.unit03.lesson01.zero_to_ten:
    title: От нуля до десяти
  fa.a1.unit03.lesson02.eleven_to_ninety_nine:
    title: От одиннадцати до девяноста девяти
  fa.a1.unit03.lesson03.phone_numbers:
    title: Номера телефонов
  fa.a1.unit03.lesson04.ages_and_quantities:
    title: Возраст и количество
  fa.a1.unit03.lesson05.prices:
    title: Цены в томанах
  fa.a1.unit03.lesson06.dialogue_phone_numbers:
    title: Обмениваемся номерами телефонов
teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Номер
    gloss: номер
    note: عدد — общее слово для обозначения числа.
    example_gloss: Это число.
  fa.a1.unit03.lesson01.teach.zero:
    title: Ноль
    gloss: 0 — ноль
    note: صفر означает ноль, в том числе как цифру внутри длинного числа, например номера телефона.
    example_gloss: Ноль — это число.
  fa.a1.unit03.lesson01.teach.one:
    title: Один
    gloss: 1 — один
    note: یک — это «один».
    example_gloss: У меня одна книга.
  fa.a1.unit03.lesson01.teach.two:
    title: Два
    gloss: 2 — два
    note: دو — это «два».
    example_gloss: У меня два яблока.
  fa.a1.unit03.lesson01.teach.three:
    title: Три
    gloss: 3 — три
    note: سه — это «три».
    example_gloss: У него три брата.
  fa.a1.unit03.lesson01.teach.four:
    title: Четыре
    gloss: 4 — четыре
    note: چهار — это «четыре».
    example_gloss: Четыре часа.
  fa.a1.unit03.lesson01.teach.five:
    title: Пять
    gloss: 5 — пять
    note: پنج — это «пять».
    example_gloss: Подождите пять минут.
  fa.a1.unit03.lesson01.teach.six:
    title: Шесть
    gloss: 6 — шесть
    note: شش — это «шесть».
    example_gloss: Там шесть стульев.
  fa.a1.unit03.lesson01.teach.seven:
    title: Семь
    gloss: 7 — семь
    note: هفت — это «семь».
    example_gloss: В неделе семь дней.
  fa.a1.unit03.lesson01.teach.eight:
    title: Восемь
    gloss: 8 — восемь
    note: هشت — это «восемь».
    example_gloss: Увидимся в восемь.
  fa.a1.unit03.lesson01.teach.nine:
    title: Девять
    gloss: 9 — девять
    note: 'نه — это «девять». Это также обычное слово «нет»: какое значение имеется в виду, понятно из контекста (когда слово звучит в счёте или в числе).'
    example_gloss: Здесь девять учеников.
  fa.a1.unit03.lesson01.teach.ten:
    title: Десять
    gloss: 10 — десять
    note: ده — это «десять».
    example_gloss: У меня десять пальцев.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Одиннадцать
    gloss: 11 — одиннадцать
    note: یازده — это «одиннадцать».
    example_gloss: В одиннадцать у меня занятие.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Двенадцать
    gloss: 12 — двенадцать
    note: دوازده — это «двенадцать».
    example_gloss: В году двенадцать месяцев.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Тринадцать
    gloss: 13 — тринадцать
    note: سیزده — это «тринадцать».
    example_gloss: Ему/ей тринадцать лет.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Четырнадцать
    gloss: 14 — четырнадцать
    note: چهارده — это «четырнадцать».
    example_gloss: Я приду через четырнадцать дней.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Пятнадцать
    gloss: 15 — пятнадцать
    note: پانزده — это «пятнадцать».
    example_gloss: У него/неё пятнадцать книг.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Шестнадцать
    gloss: 16 — шестнадцать
    note: شانزده — это «шестнадцать». Слово нельзя вывести из шش (шесть) + ده (десять), поэтому его стоит выучить отдельно.
    example_gloss: Ему/ей шестнадцать лет.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Семнадцать
    gloss: 17 — семнадцать
    note: هفده — это «семнадцать».
    example_gloss: Пришли семнадцать человек.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Восемнадцать
    gloss: 18 — восемнадцать
    note: هجده — это «восемнадцать».
    example_gloss: Ему/ей восемнадцать лет.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Девятнадцать
    gloss: 19 — девятнадцать
    note: نوزده — это «девятнадцать».
    example_gloss: Осталось девятнадцать дней.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Двадцать
    gloss: 20 — двадцать
    note: بیست — это «двадцать».
    example_gloss: У меня двадцать книг.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Тридцать
    gloss: 30 — тридцать
    note: سی — это «тридцать».
    example_gloss: В этом месяце тридцать дней.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: От сорока до девяноста
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود — остальные круглые десятки.
    example_gloss:
    - Ему/ей сорок лет.
    - Там пятьдесят стульев.
    - Шестьдесят минут — это один час.
    - В этой книге семьдесят страниц.
    - У него/неё восемьдесят книг.
    - Ему/ей девяносто лет.
  fa.a1.unit03.lesson02.teach.combining:
    title: Как соединять десятки и единицы
    gloss: двадцать пять
    note: 'بیست و پنج буквально значит «двадцать и пять»: слово для десятков, و, слово для единиц.'
  fa.a1.unit03.lesson03.teach.shomare:
    title: Номер
    gloss: номер
    note: شماره используется для номера-идентификатора, например номера телефона или дома, в отличие от عدد в общем значении «число».
    example_gloss: Это мой номер телефона.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Телефон
    gloss: телефон
    note: تلفن означает телефон вообще, включая мобильный.
    example_gloss: У меня нет телефона.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Спросить номер телефона
    gloss: Какой у тебя номер телефона?
    note: شماره تلفنتون چنده؟ — обычный вежливый способ спросить номер телефона. Называть номер по одной цифре всегда понятно, и для начинающего это самый надёжный способ; в живой речи цифры часто группируют, но на этом уроке сначала отрабатывается более простая форма — по одной цифре.
  fa.a1.unit03.lesson03.teach.chande:
    title: Сколько / какой это?
    gloss: сколько это? / какой это (номер)?
    note: چنده؟ — сокращение от چند است; вопрос о числе, количестве или цене, в зависимости от контекста.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Читаем номер по одной цифре
    gloss: ноль, девять, один, два, три, четыре, пять, шесть, семь, восемь, восемь
    note: На этом уроке номера читаются по одной цифре. Настоящий иранский мобильный номер состоит из 11 цифр и начинается с 0, например 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: Год
    gloss: год
    note: سال используется и для календарных лет, и для указания возраста.
    example_gloss: Мне двадцать лет.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Я (повторение)
    gloss: я
    note: 'Короткое напоминание о من: оно нужно, чтобы назвать свой возраст целым предложением.'
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Спросить о возрасте (неформально)
    gloss: Сколько тебе лет?
    note: چند سالته؟ — неформальная форма для одного человека (на «ты»); چند سالتونه؟ — вежливая форма (на «вы»).
  fa.a1.unit03.lesson04.teach.salame:
    title: Назвать свой возраст
    gloss: Мне 25 лет.
    note: В سالمه к слову سال напрямую присоединяется притяжательное окончание ـم (мой), а затем разговорная связка ـه (есть) — буквально «мой-год-есть».
  fa.a1.unit03.lesson04.teach.ta:
    title: Счётное слово
    gloss: (счётное слово, в русском нет прямого соответствия)
    note: 'تا — универсальное счётное слово при счёте большинства предметов: число + تا + существительное.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Яблоко
    gloss: яблоко
    note: سیب — это яблоко.
    example_gloss: Я люблю яблоки.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Книга
    gloss: книга
    note: کتاب — это книга.
    example_gloss: Это хорошая книга.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Попросить определённое количество
    gloss: Я хочу два яблока.
    note: В دو تا سیب می‌خوام сначала идёт количество, а потом существительное — так всегда бывает с تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Цена
    gloss: цена
    note: قیمت — общее слово для обозначения цены.
    example_gloss: Сколько это стоит?
  fa.a1.unit03.lesson05.teach.toman:
    title: Томан
    gloss: томан (иранская денежная единица в повседневной речи)
    note: Официальная валюта Ирана — риал, но в повседневной устной речи цены почти всегда называют в томанах (1 томан = 10 риалов).
    example_gloss: Это стоит десять тысяч томанов.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Тысяча
    gloss: тысяча
    note: هزار — это тысяча; цены обычно называют в тысячах томанов.
    example_gloss: У меня есть тысяча томанов.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Спросить цену
    gloss: Сколько это стоит?
    note: این چنده؟ — обычный способ спросить цену вещи, которая находится перед вами.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Назвать цену
    gloss: Это стоит 30 000 томанов.
    note: 'تومنه — сокращение от تومن است; полная схема: число + هزار + تومنه.'
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Сара предлагает заниматься вместе
    gloss: Сара говорит, что хочет вместе с Миной практиковать персидский, и спрашивает номер телефона Мины.
    note: باهم значит «вместе»; می‌خوام ... تمرین کنیم значит «я хочу, чтобы мы потренировались»; а сам по себе вопрос تمرین کنیم может означать и «потренируемся?»
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Мина называет свой номер
    gloss: Мина соглашается и читает свой 11-значный номер по одной цифре.
    note: شماره‌ام — сокращение от شماره من; هشته — сокращение от هشت است, оно завершает счёт.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Сара проверяет, правильно ли записала
    gloss: Сара просит Мину подождать, пока она запишет номер, а затем зачитывает его, чтобы проверить.
    note: درسته؟ («это верно?») — распространённый способ проверить только что услышанный номер или факт.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Мина подтверждает и спрашивает в ответ
    gloss: Мина подтверждает, что всё верно, и спрашивает номер Сары.
    note: آره — неформальное «да», более разговорное, чем بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Сара называет свой номер
    gloss: Сара читает свой 11-значный номер по одной цифре.
    note: یکه — сокращение от یک است; оно завершает счёт так же, как هشته в номере Мины.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Мина соглашается позвонить
    gloss: Мина говорит, что позвонит Саре завтра.
    note: زنگ می‌زنم بهت значит «я тебе позвоню» — буквально «я ударяю в звонок тебе».
