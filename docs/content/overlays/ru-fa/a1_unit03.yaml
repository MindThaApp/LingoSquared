      status: correct
    feedback: صفر، یک، دو، سه، چهار، پنج — счёт от 0 до 5 по порядку.
  fa.a1.unit03.lesson01.exercise04.match_low:
    instruction: Соедини каждое числительное с цифрой.
    accepted_answers:
