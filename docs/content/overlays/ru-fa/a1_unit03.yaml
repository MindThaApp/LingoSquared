      right: '0'
    - left: هفت
      right: '7'
    - left: ده
      right: '10'
  fa.a1.unit03.lesson02.exercise05.match_teens_high:
    instruction: Соедини каждое числительное с цифрой.
    accepted_answers:
    - value:
        پانزده: '15'
        شانزده: '16'
        هفده: '17'
        هجده: '18'
        نوزده: '19'
        بیست: '20'
      status: correct
    feedback: От پانزده до بیست — числа от 15 до 20.
    pairs:
    - left: پانزده
