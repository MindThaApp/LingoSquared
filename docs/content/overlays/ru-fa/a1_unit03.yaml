        صفر: '0'
        یک: '1'
        دو: '2'
        سه: '3'
        چهار: '4'
        پنج: '5'
        شش: '6'
      status: correct
    feedback: От صفر до شش — числа от 0 до 6.
    pairs:
    - left: صفر
      right: '0'
    - left: یک
      right: '1'
    - left: دو
      right: '2'
    - left: سه
      right: '3'
    - left: چهار
      right: '4'
    - left: پنج
      right: '5'
    - left: شش
      right: '6'
  fa.a1.unit03.lesson01.exercise05.match_high:
    instruction: Соедини каждое слово с его значением.
    accepted_answers:
    - value:
        هفت: '7'
        هشت: '8'
        نه: '9'
        ده: '10'
        عدد: номер
        صفر: '0'
      status: correct
    feedback: هفت، هشت، نه، ده — числа от 7 до 10; عدد — слово «число»; صفر — ноль.
    pairs:
    - left: هفت
      right: '7'
    - left: هشت
      right: '8'
    - left: نه
      right: '9'
    - left: ده
      right: '10'
    - left: عدد
      right: номер
    - left: صفر
      right: '0'
  fa.a1.unit03.lesson01.exercise06.order_ascending:
    instruction: Расставь числа от меньшего к большему.
    accepted_answers:
    - value:
      - یک
      - دو
      - سه
      status: correct
    feedback: یک، دو، سه — правильный порядок по возрастанию.
  fa.a1.unit03.lesson01.exercise07.fill_seven:
    instruction: Впиши персидское слово для числа 7.
    accepted_answers:
    - value: هفت
      status: correct
    feedback: ۷ — это هفت.
  fa.a1.unit03.lesson01.exercise08.translate_nine:
    instruction: 'Переведи на персидский: девять.'
    accepted_answers:
    - value: نه
      status: correct
    feedback: نه означает «девять».
  fa.a1.unit03.lesson02.exercise01.recognize_bist:
    instruction: Выбери значение слова بیست.
    correct_option: двадцать
    distractors:
    - двенадцать
    - десять
    - две
    accepted_answers:
    - value: двадцать
      status: correct
    feedback: بیست означает «двадцать».
  fa.a1.unit03.lesson02.exercise02.recognize_hejdah:
    instruction: Выбери значение слова هجده.
    correct_option: восемнадцать
    distractors:
    - восемь
    - восемьдесят
    - восьмой
    accepted_answers:
    - value: восемнадцать
      status: correct
    feedback: هجده означает «восемнадцать».
  fa.a1.unit03.lesson02.exercise03.recognize_teens_reading:
    instruction: Какие это числа по порядку?
    correct_option: 11, 12, 13, 14, 15
