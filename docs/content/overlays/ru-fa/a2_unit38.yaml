teaching:
  fa.a2.unit38.lesson01.teach.polite_words:
    title: Вежливые начала фраз
    gloss: извините, вы знаете (вежливо), я не знаю
    note: '*ببخشید* открывает вежливый вопрос к незнакомому человеку. *می‌دونید* — вежливая форма «вы знаете» (с *شما*).'
    example_gloss:
    - Извините, вы не знаете, который час?
    - Не знаю, извините.
  fa.a2.unit38.lesson01.teach.places:
    title: Места и билет
    gloss: станция, офис, музей, библиотека, билет
    note: '*کتابخونه* — обычная разговорная форма слова «библиотека»; на письме используют *کتابخانه*.'
    example_gloss:
    - Станция вон там.
    - Офис здесь.
    - Музей вон там.
    - Библиотека здесь.
    - Билет здесь.
  fa.a2.unit38.lesson01.teach.where_time:
    title: Где это? Который час?
    gloss: где это, который час, это здесь, это там
    note: '*ساعت چنده* — вопрос о времени. *اینجاست* и *اونجاست* — типичные короткие ответы о месте.'
    example_gloss:
    - Где офис?
    - Который час?
    - Библиотека здесь.
  fa.a2.unit38.lesson01.teach.frame:
    title: 'Вежливая рамка: می‌دونید + вопрос'
    gloss: Извините, вы не знаете, где станция? Извините, вы не знаете, который час?
    note: 'Чтобы вежливо спросить незнакомого человека, поставь *ببخشید، می‌دونید* перед обычным вопросом. Сам вопрос не меняется: *ایستگاه کجاست؟* превращается в *ببخشید، می‌دونید ایستگاه کجاست؟*.'
  fa.a2.unit38.lesson02.teach.open_closed:
    title: Открыто, закрыто, сегодня, завтра
    gloss: открыто, закрыто, сегодня, завтра
    note: '*باز* означает «открыто», а *بسته* — «закрыто». *هست* подтверждает, что так и есть.'
    example_gloss:
    - Сегодня музей открыт.
    - Сегодня офис закрыт.
    - Завтра музей открыт.
    - Завтра библиотека закрыта.
  fa.a2.unit38.lesson02.teach.when_or_not:
    title: Когда, или, не, да
    gloss: когда, становится / происходит, или, нет / не, да
    note: '*باز می‌شه* означает «открывается», *بسته می‌شه* — «закрывается». *نه* — это «нет», а также конец пары *یا نه* («или нет»).'
    example_gloss:
    - Когда открывается музей?
    - Открыто или нет?
    - Да, открыто.
  fa.a2.unit38.lesson02.teach.when_pattern:
    title: 'Вложенное «когда»: вопросительное слово остаётся на месте'
    gloss: Вы не знаете, когда открывается музей?
    note: 'В русском придаточный вопрос вводится словом «когда» после «вы знаете», а в персидском вопрос просто присоединяется как есть: *موزه کی باز می‌شه؟* идёт сразу после *می‌دونید*. Вопросительное слово *کی* остаётся на том же месте, что и в прямом вопросе.'
  fa.a2.unit38.lesson02.teach.whether_pattern:
    title: 'Вложенный вопрос «да/нет»: ... یا نه'
    gloss: Вы не знаете, открыт ли музей (или нет)?
    note: Для «ли» возьми простое утверждение *موزه باز هست* и закончи его словами *یا نه*. В русском для этого есть частица «ли», а в персидском в конце добавляется *یا نه*.
  fa.a2.unit38.lesson03.teach.you_forms:
    title: «Ты» другу, «вы» незнакомому
    gloss: ты (другу), вы (вежливо), ты знаешь (другу)
    note: Сара и Нима — друзья, поэтому говорят *تو* и *می‌دونی*. Незнакомому человеку говорят *شما* и *می‌دونید*.
    example_gloss:
    - Сара, ты знаешь, где офис?
    - Вы не знаете, где офис? (незнакомому человеку)
  fa.a2.unit38.lesson03.teach.same_order:
    title: Порядок слов не меняется
    gloss: Где станция? Вы знаете, где станция?
    note: 'В прямом и во вложенном вопросе слова одни и те же и стоят в том же порядке: *ایستگاه کجاست؟* / *می‌دونید ایستگاه کجاست؟*. Добавляется только вежливая рамка. В персидском порядок слов в вопросе не меняется.'
  fa.a2.unit38.lesson03.teach.friend_stranger:
    title: می‌دونی или می‌دونید?
    gloss: ты знаешь (другу); вы знаете (незнакомому)
    note: Используй *می‌دونی* с другом, а *می‌دونید* — с незнакомым человеком, служащим или любым собеседником, к которому обращаешься на «вы». Вежливый вопрос незнакомому человеку также начинается с *ببخشید*.
  fa.a2.unit38.lesson03.teach.dont_know:
    title: 'Я не знаю ...: это утверждение, а не вопрос'
    gloss: Я не знаю, где станция; я не знаю, где станция
    note: 'После *نمی‌دونم* идёт тот же вложенный вопрос: *نمی‌دونم موزه کی باز می‌شه*. Это утверждение, поэтому вопросительного знака нет. После него можно добавить *که* (*نمی‌دونم که ...*), но в разговорной речи его обычно опускают.'
  fa.a2.unit38.lesson03.teach.ke:
    title: که (необязательное связующее слово)
    gloss: что (необязательное связующее слово)
    note: Здесь *که* просто связывает *نمی‌دونم* с вопросом. Оно не добавляет смысла и обычно опускается.
    example_gloss:
    - Я не знаю, где офис.
  fa.a2.unit38.lesson04.teach.directions:
    title: Указания, которые ты можешь услышать
    gloss: прямо, идите (вежливо), сторона/направление, правый, левый, потом, и
    note: 'Незнакомый человек отвечает вежливыми командами: *مستقیم برید* — «идите прямо». *سمت راست* — «справа», *سمت چپ* — «слева».'
    example_gloss:
    - Идите прямо.
    - Идите направо.
    - Идите прямо, а потом налево.
  fa.a2.unit38.lesson04.teach.times_thanks:
    title: Часы и благодарность
    gloss: восемь часов, пять часов, спасибо
    note: '*ساعت هشت* — «в восемь часов». Говори *ممنون* после любого ответа.'
    example_gloss:
    - Музей открывается в восемь.
    - Офис закрывается в пять.
    - Спасибо!
  fa.a2.unit38.lesson04.teach.package:
    title: Один вежливый набор
    gloss: Извините, вы не знаете, когда закрывается офис?
    note: 'Любой вежливый вопрос строится в три шага: *ببخشید*, затем *می‌دونید*, затем обычный вопрос со своим вопросительным словом (*کجاست*, *کی ... می‌شه*, *... هست یا نه*). Внутри вопроса ничего не переставляется.'
  fa.a2.unit38.lesson05.teach.greeting:
    title: Привет и «я»
    gloss: привет, я
    note: '*من* нужно редко, потому что окончание глагола уже означает «я». Его добавляют для противопоставления.'
    example_gloss:
    - Здравствуйте, я не знаю.
    - Завтра я иду в музей.
  fa.a2.unit38.lesson05.teach.reading:
    title: Короткая записка с просьбой об информации
    gloss: Здравствуйте. Извините, вы не знаете, где офис? Вы не знаете, открыт ли он завтра? Я не знаю. Спасибо. Нима
    note: Прочитай один раз, чтобы найти два вопроса, и ещё раз, чтобы увидеть вежливую рамку в каждом.
  fa.a2.unit38.lesson06.teach.passerby:
    title: Прохожий
    gloss: прохожий (незнакомый человек на улице)
    note: 'Обрати внимание: вложенный вопрос так же следует за *می‌دونه* («он/она знает»): ничего не переставляется.'
    example_gloss:
    - Прохожий знает, где офис.
  fa.a2.unit38.lesson06.teach.turn01:
    title: Сара спрашивает друга
    gloss: 'Сара спрашивает Ниму, используя форму для друга: Ты знаешь, где офис?'
    note: Она говорит *می‌دونی*, потому что они друзья.
  fa.a2.unit38.lesson06.teach.turn02:
    title: Нима спрашивает незнакомого человека
    gloss: Нима не знает, поэтому спрашивает прохожего, используя вежливую рамку.
    note: Для незнакомого человека он переходит на *می‌دونید*.
  fa.a2.unit38.lesson06.teach.turn03:
    title: Прохожий показывает дорогу
    gloss: 'Да: идите прямо. Офис справа.'
    note: В ответе используются вежливые команды.
  fa.a2.unit38.lesson06.teach.turn04:
    title: Нима спрашивает, открыт ли офис
    gloss: Спасибо. Вы не знаете, открыт ли офис?
    note: Во втором вопросе используется *یا نه*.
  fa.a2.unit38.lesson06.teach.turn05:
    title: Офис открыт и закрывается в пять
    gloss: Да, открыт. Закрывается в пять.
    note: 'Два факта: сейчас открыт, закрывается в пять.'
  fa.a2.unit38.lesson06.teach.turn06:
    title: Нима благодарит его и говорит Саре
    gloss: Спасибо. Сара, офис вон там.
    note: Он благодарит незнакомого человека и сообщает другу.
