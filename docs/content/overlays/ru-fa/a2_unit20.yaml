course:
  title: Персидский A2
  description: 'Персидский (Иран) для среднего уровня с упором на грамматику: банк, мнения, встречи и другое, а теперь ещё и рассказ о том, что ты собираешься делать: ближайшие планы, намерения, «может быть» и «обязательно».'
units:
  fa.a2.unit20.holiday_plans:
    title: Планы на отпуск
lessons:
  fa.a2.unit20.lesson01.near_plans:
    title: 'Ближайшие планы: настоящее время с می‌'
  fa.a2.unit20.lesson02.intentions:
    title: 'Намерения: می‌خوام и قصد دارم'
  fa.a2.unit20.lesson03.maybe_and_certain:
    title: Может быть, обязательно и отказ
  fa.a2.unit20.lesson04.asking_about_plans:
    title: Спрашиваем о планах
  fa.a2.unit20.lesson05.reading_and_listening:
    title: Чтение и аудирование
  fa.a2.unit20.lesson06.holiday_conversation:
    title: Разговор об отпуске
teaching:
  fa.a2.unit20.lesson01.teach.holiday:
    title: Отпуск, лето
    gloss: отпуск, каникулы, лето
    note: В разговорной речи *تابستون* — обычная форма слова *تابستان* (лето). *تعطیلات* выглядит как множественное число, но это обычное слово для «отпуск, каникулы».
    example_gloss:
    - Летом у меня отпуск.
    - Отпуск — это здорово.
  fa.a2.unit20.lesson01.teach.when:
    title: На следующей неделе, в следующем году, август
    gloss: на следующей неделе, в следующем году, мордад
    note: '*بعد* после слова о времени значит «следующий»: *هفته‌ی بعد*, *سال بعد*. *مرداد* — иранский месяц, который приходится в основном на август.'
    example_gloss:
    - На следующей неделе у меня встреча.
    - В следующем году я еду в Исфахан.
    - В мордаде у меня отпуск.
  fa.a2.unit20.lesson01.teach.travel_verbs:
    title: Путешествовать, бронировать
    gloss: путешествовать, бронировать
    note: 'Оба глагола состоят из существительного и *کردن*: *سفر* (поездка) + *کردن* = путешествовать; *رزرو* (бронь) + *کردن* = бронировать. В настоящем времени *می‌* ставится перед *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*.'
    example_gloss:
    - На следующей неделе я уезжаю в путешествие.
    - Я бронирую отель.
  fa.a2.unit20.lesson01.teach.north:
    title: Север, отель
    gloss: север (побережье Каспия), отель
    note: '*شمال* (север) — так иранцы называют ещё и побережье Каспия, классический регион летнего отдыха: *می‌رم شمال* = «я еду на север (отдыхать)».'
    example_gloss:
    - Летом я еду на север.
    - На севере я бронирую отель.
  fa.a2.unit20.lesson01.teach.sister_mom:
    title: С, моя сестра, моя мама, мой брат
    gloss: с, моя сестра, моя мама, мой брат
    note: 'Окончание *-م* значит «мой»: *خواهر* (сестра) превращается в *خواهرم*, *مامان* — в *مامانم*, *برادر* — в *برادرم*.'
    example_gloss:
    - Я еду на север с сестрой.
    - Я остаюсь у мамы дома.
    - Я путешествую с братом.
  fa.a2.unit20.lesson01.teach.question:
    title: Что ты делаешь летом?
    gloss: Что ты делаешь летом?
    note: 'Один и тот же вопрос значит и «что ты делаешь?», и «что ты будешь делать?»: слово о времени (*تابستون*) показывает, что речь о будущем.'
  fa.a2.unit20.lesson01.teach.present_for_plans:
    title: Ближайшие планы выражаются настоящим временем
    gloss: В мордаде я еду на север, я бронирую отель.
    note: 'В персидском нет обычного будущего времени в разговорной речи. Для твёрдых или близких планов используй настоящее время с *می‌* и добавь слово о времени: *مرداد می‌رم شمال* буквально «в мордаде еду на север» и значит «в мордаде я поеду на север». Слово о времени показывает слушателю, что речь о будущем.'
  fa.a2.unit20.lesson02.teach.course_money:
    title: Курс, деньги
    gloss: курс, деньги
    note: '*دوره* — это курс или серия занятий: *یه دوره‌ی زبان* (языковой курс). *دوره‌ی* с *-ی* связывает слово со следующим существительным.'
    example_gloss:
    - У меня есть языковой курс.
    - У меня нет денег.
  fa.a2.unit20.lesson02.teach.later:
    title: Позже, через месяц
    gloss: позже, через месяц
    note: '*یه ماه دیگه* буквально «ещё один месяц» и значит «через месяц». *بعدا* — это общее «позже».'
    example_gloss:
    - Позже я еду на север.
    - Через месяц я уезжаю в путешествие.
  fa.a2.unit20.lesson02.teach.want_course:
    title: Я хочу пойти на курс.
    gloss: Я хочу пойти на курс. / Я планирую пойти на курс.
    note: '*می‌خوام* (я хочу) плюс второй глагол в краткой форме с *be-*: *بگیرم* (от *گرفتن*, брать, получать). Оба глагола имеют окончание *-م*: *می‌خوام بگیرم*. Та же модель с *رفتن* (идти, ехать) даёт *می‌خوام برم*.'
  fa.a2.unit20.lesson02.teach.want_house:
    title: Я хочу переехать.
    gloss: Я хочу переехать. / Я планирую переехать.
    note: '*خونه عوض کردن* значит переезжать на другую квартиру. В модели с *می‌خوام* глагол принимает форму *کنم*: *می‌خوام خونه عوض کنم*.'
  fa.a2.unit20.lesson02.teach.want_save:
    title: Я хочу копить деньги.
    gloss: Я хочу копить деньги. / Я планирую копить деньги.
    note: '*پول جمع کردن* значит копить деньги (буквально «собирать деньги»). Та же модель: *می‌خوام پول جمع کنم*.'
  fa.a2.unit20.lesson02.teach.qasd:
    title: Я намерен пойти на курс.
    gloss: Я намерен пойти на курс.
    note: '*قصد دارم* (я намерен) немного formal­нее, чем *می‌خوام*, но после него тоже идёт краткая форма глагола: *قصد دارم بگیرم*.'
  fa.a2.unit20.lesson02.teach.want_pattern:
    title: می‌خوام + краткая форма глагола
    gloss: я хочу пойти, я хочу взять, я хочу накопить
    note: 'Для более отдалённых планов и желаний используй *می‌خوام* + второй глагол в краткой форме с *be-*: *برم* (пойти), *بگیرم* (взять), *بخرم* (купить) и *کنم* (сделать, как в *پول جمع کنم*). У обоих глаголов одно и то же окончание (*-م* для «я»): *می‌خوام برم*. Для ближайших, твёрдых планов используй обычное настоящее время: *فردا می‌رم*, но *سال بعد می‌خوام یه دوره بگیرم*.'
  fa.a2.unit20.lesson03.teach.maybe_certain:
    title: Может быть, обязательно
    gloss: может быть, обязательно
    note: '*شاید* и *حتما* стоят в начале предложения и показывают, насколько ты уверен.'
    example_gloss:
    - Может быть, я схожу в кино.
    - Я обязательно поеду.
  fa.a2.unit20.lesson03.teach.this_year:
    title: В этом году, этим летом
    gloss: в этом году, этим летом
    note: '*این* перед словом со значением времени значит «этот»: *این تابستون*. *امسال* — одно слово со значением «в этом году».'
    example_gloss:
    - В этом году я остаюсь дома.
    - Этим летом я работаю.
  fa.a2.unit20.lesson03.teach.maybe_rule:
    title: После «может быть» — краткий глагол
    gloss: Может, поеду; я обязательно еду
    note: 'После *شاید* стоит краткая форма с *be-* (*برم*), потому что план — лишь возможность. После *حتما* стоит обычное настоящее время (*می‌رم*), потому что план твёрдый: *شاید برم سینما*, но *حتما می‌رم سینما*.'
  fa.a2.unit20.lesson03.teach.not_want:
    title: Я не хочу
    gloss: Я не хочу
    note: 'Поставь *نـ* перед *می‌خوام*, чтобы сказать, что не хочешь или не собираешься что-то делать: *نمی‌خوام برم*. Чтобы просто отрицать план, отрицай настоящее время: *می‌رم* превращается в *نمی‌رم*.'
    example_gloss:
    - Я не хочу переезжать.
    - В этом году я не еду на север.
    - Этим летом я не путешествую.
  fa.a2.unit20.lesson03.teach.later_cinema:
    title: Может, потом схожу в кино.
    gloss: Может, потом схожу в кино.
    note: Слово со значением времени *بعدا* может стоять между *شاید* и глаголом.
  fa.a2.unit20.lesson04.teach.q_words:
    title: Куда, с кем, сколько недель
    gloss: где/куда, с кем, сколько недель
    note: '*با کی* буквально «с кем»: так спрашивают, с кем ты едешь. *چند هفته* спрашивает, как долго (сколько недель).'
    example_gloss:
    - Куда ты идёшь?
    - С кем ты едешь?
    - Сколько недель ты пробудешь?
  fa.a2.unit20.lesson04.teach.q_where:
    title: Куда ты идёшь?
    gloss: Куда ты идёшь?
    note: 'Вопросительное слово стоит первым, а глагол имеет окончание *-ی* (ты): *می‌ری* (ты идёшь/едешь).'
  fa.a2.unit20.lesson04.teach.q_who:
    title: С кем ты едешь?
    gloss: С кем ты едешь?
    note: 'Отвечай так: *با* + человек + глагол: *با خواهرم می‌رم*.'
  fa.a2.unit20.lesson04.teach.q_howlong:
    title: Сколько недель ты пробудешь?
    gloss: Сколько недель ты пробудешь?
    note: '*می‌مونی* — форма *ты* от *می‌مونم* (я остаюсь).'
  fa.a2.unit20.lesson04.teach.durations:
    title: Одна неделя, две недели, два дня
    gloss: одна неделя, две недели, два дня
    note: 'После числительного существительное остаётся в единственном числе: *دو هفته*, *دو روز*. *یه هفته* — разговорное «одна неделя».'
    example_gloss:
    - Я остаюсь на неделю.
    - Я путешествую две недели.
    - Я остаюсь там на два дня.
  fa.a2.unit20.lesson04.teach.you_forms:
    title: Ты хочешь, ты делаешь (краткая форма)
    gloss: ты хочешь, ты делаешь (краткая форма)
    note: '*می‌خوای* — форма *ты* от *می‌خوام*; короткий глагол после него тоже получает окончание *ты*: *کنی* (от *کنم*), *بری* (от *برم*).'
    example_gloss:
    - Что ты хочешь делать?
    - Ты хочешь поехать?
  fa.a2.unit20.lesson04.teach.answer_pair:
    title: Ты идёшь / я иду
    gloss: Ты едешь? Я еду.
    note: В вопросе используется окончание *ты* — *-ی* (*می‌ری*, *می‌مونی*, *می‌کنی*); в ответе — окончание *я* — *-م* (*می‌رم*, *می‌مونم*, *می‌کنم*). Время и глагол остаются теми же.
  fa.a2.unit20.lesson05.teach.spot_plans:
    title: Определи вид плана
    gloss: я иду, я хочу, может, пойду
    note: 'Когда читаешь, обращай внимание, насколько твёрд каждый план: простое настоящее с *می‌* (*می‌رم*) — решённое дело, *می‌خوام* — намерение, а *شاید* — лишь возможность.'
  fa.a2.unit20.lesson05.teach.reading_message:
    title: Сообщение об отпуске
    gloss: Привет! Летом у меня каникулы. В мордаде я с сестрой еду на север. Неделю мы живём в отеле. Потом на два дня еду к маме. В следующем году хочу пройти курс. А может, ещё поеду в Исфахан.
    note: Короткое сообщение о планах на лето. Прочитай его сначала ради планов, потом ещё раз — чтобы понять, насколько твёрд каждый из них.
  fa.a2.unit20.lesson06.teach.names:
    title: Сара, Нима
    gloss: Сара, Нима
    note: Двое друзей из предыдущих уроков.
    example_gloss:
    - Сара работает в тире.
    - Нима едет в Турцию в мордаде.
  fa.a2.unit20.lesson06.teach.dlg1:
    title: Сара спрашивает об отпуске
    gloss: Сара спрашиваетНиму, что он делает в летние каникулы.
    note: Стандартный вопрос о планах на каникулы.
  fa.a2.unit20.lesson06.teach.dlg2:
    title: План Нимы
    gloss: Нима говорит, что в мордаде едет в Турцию и бронирует отель.
    note: Два твёрдых плана, оба в настоящем времени с *می‌*.
  fa.a2.unit20.lesson06.teach.dlg3:
    title: Сара спрашивает, с кем
    gloss: Сара говорит «как здорово» и спрашивает, с кем он едет.
    note: '*با کی* спрашивает, с кем он едет.'
  fa.a2.unit20.lesson06.teach.dlg4:
    title: С кем и на сколько
    gloss: Нима говорит, что едет с братом и они остаются там на неделю.
    note: 'В ответе можно опустить глагол: достаточно *با برادرم*.'
  fa.a2.unit20.lesson06.teach.dlg5:
    title: Сара спрашивает о следующем годе
    gloss: 'Сара спрашивает: а в следующем году? Что ты хочешь делать?'
    note: '*می‌خوای* — форма *ты* от *می‌خوام*; *کنی* — короткий глагол с окончанием *ты*.'
  fa.a2.unit20.lesson06.teach.dlg6:
    title: Намерение Нимы
    gloss: 'Нима говорит, что хочет пройти курс, и спрашивает Сару: а ты?'
    note: Намерение с *می‌خوام* и кратким глаголом.
  fa.a2.unit20.lesson06.teach.dlg7:
    title: Планы Сары
    gloss: Сара говорит, что работает в тире, а потом, может быть, поедет к маме.
    note: Твёрдый план в настоящем времени и возможность с *شاید*.
  fa.a2.unit20.lesson06.teach.third_person:
    title: Он/она идёт, остаётся, делает, хочет
    gloss: он/она идёт, остаётся, делает, хочет
    note: 'Чтобы рассказать о плане другого человека, в настоящем времени используется окончание *он/она* — *-ه* (*می‌ره*, *می‌مونه*, *می‌کنه*). *می‌خواد* — форма *он/она* от *می‌خوام*, а короткий глагол после него тоже оканчивается на *-ه*: *می‌خواد بره*, *می‌خواد بگیره*.'
    example_gloss:
    - Нима хочет пройти курс.
    - Сара хочет поехать к маме.
exercises:
  fa.a2.unit20.lesson01.exercise01.recognize_holiday:
    instruction: Что значит это слово?
    correct_option: отпуск, каникулы
    distractors:
    - встреча
    - выходные
    - лето
    accepted_answers:
    - value: отпуск, каникулы
      status: correct
    feedback: '*تعطیلات* значит «каникулы, отпуск».'
  fa.a2.unit20.lesson01.exercise02.recognize_next_week_travel:
    instruction: Какое предложение соответствует этому персидскому?
    correct_option: На следующей неделе я уезжаю в путешествие.
    distractors:
    - На прошлой неделе я путешествовал.
    - На следующей неделе я остаюсь дома.
    - В следующем году я путешествую.
    accepted_answers:
    - value: На следующей неделе я уезжаю в путешествие.
      status: correct
    feedback: '*هفته‌ی بعد سفر می‌کنم* — следующая неделя, путешествие: настоящее время с *می‌* и слово со значением времени.'
  fa.a2.unit20.lesson01.exercise03.match_holiday_words:
    instruction: Соедини каждое слово или фразу с её значением.
    accepted_answers:
    - value:
        تعطیلات: отпуск, каникулы
        تابستون: лето
        هفته‌ی بعد: на следующей неделе
        سال بعد: в следующем году
        سفر کردن: ездить, путешествовать
        رزرو کردن: бронировать
        شمال: север (побережье Каспия)
        هتل: отель
      status: correct
    feedback: Слова со значением времени и два глагола вида «существительное + *کردن*» — это строительные блоки плана.
    pairs:
    - left: تعطیلات
      right: отпуск, каникулы
    - left: تابستون
      right: лето
    - left: هفته‌ی بعد
      right: на следующей неделе
    - left: سال بعد
      right: в следующем году
    - left: سفر کردن
      right: ездить, путешествовать
    - left: رزرو کردن
      right: бронировать
    - left: شمال
      right: север (побережье Каспия)
    - left: هتل
      right: отель
  fa.a2.unit20.lesson01.exercise04.order_summer_north:
    instruction: 'Составь из слов фразу: Летом я еду на север.'
    accepted_answers:
    - value:
      - تابستون
      - می‌رم
      - شمال
      status: correct
    - value:
      - تابستون
      - شمال
      - می‌رم
      status: correct
    - value:
      - می‌رم
      - شمال
      - تابستون
      status: correct
    feedback: '*تابستون می‌رم شمال* — сначала слово со значением времени, затем глагол и место.'
  fa.a2.unit20.lesson01.exercise05.listen_book_hotel:
    instruction: Послушай и выбери то, что слышишь.
    correct_option: На следующей неделе я бронирую отель.
    distractors:
    - На следующей неделе я живу в отеле.
    - На прошлой неделе я забронировал отель.
    - В следующем году я бронирую отель.
