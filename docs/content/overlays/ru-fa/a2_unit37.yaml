teaching:
  fa.a2.unit37.lesson01.teach.weather_words:
    title: Слова о погоде
    gloss: погода, дождь, снег, солнечный, холодный, тёплый, завтра, сегодня
    note: '*بارون* — обычная разговорная форма слова «дождь»; на письме аккуратно пишут *باران*. В разговорной речи *آفتابیه*, *سرده* и *گرمه* оканчиваются на *-ه* со значением «есть».'
    example_gloss:
    - Завтра солнечно.
    - Сегодня холодно.
    - Тепло.
  fa.a2.unit37.lesson01.teach.plan_words:
    title: Места и глаголы планов
    gloss: парк, дом, рынок, кино, снаружи, в, мы идём, мы не идём, мы остаёмся
    note: 'Для планов используется настоящее время: *می‌ریم* — «мы идём» или «мы пойдём», а *نمی‌ریم* — «мы не идём» или «мы не пойдём».'
    example_gloss:
    - Завтра мы идём в парк.
    - Мы остаёмся дома.
    - Сегодня мы никуда не идём.
  fa.a2.unit37.lesson01.teach.if_words:
    title: اگه и глаголы условия
    gloss: если, придёт (пойдёт дождь), будет, идёт (настоящее время)
    note: '*اگه* — разговорная форма слова *اگر* («если»). *بارون بیاد* буквально значит «дождь пусть придёт»; так по-персидски говорят «если пойдёт дождь».'
    example_gloss:
    - Если пойдёт снег, мы не пойдём на улицу.
    - Если будет холодно, мы не пойдём в парк.
  fa.a2.unit37.lesson01.teach.subjunctive_condition:
    title: اگه и сослагательное наклонение
    gloss: Если пойдёт дождь, мы не пойдём в парк.
    note: 'Для возможного условия глагол после *اگه* ставится в сослагательное наклонение: *بیاد*, *باشه*. Результат выражается обычным настоящим временем: *نمی‌ریم*. Между двумя частями ставится запятая.'
  fa.a2.unit37.lesson01.teach.present_condition:
    title: اگه и настоящее время
    gloss: Если завтра пойдёт дождь, мы останемся дома.
    note: 'После *اگه* можно услышать и настоящее время: *اگه بارون میاد*. Значение то же — реальное условие. В этом разделе ты сам(а) будешь использовать сослагательное наклонение (*بیاد*); форму настоящего времени нужно лишь узнавать на слух.'
  fa.a2.unit37.lesson02.teach.time_tired:
    title: Время, усталый, работа
    gloss: время, усталый, работа, я, мы
    note: '*وقت دارم* означает «у меня есть время». Это не время по часам.'
    example_gloss:
    - Завтра у меня есть время.
    - Сегодня у меня нет времени.
    - Сегодня у нас есть дела.
  fa.a2.unit37.lesson02.teach.come_forms:
    title: Формы «прийти» и «иметь время»
    gloss: я прихожу, ты приходишь, я не приду, у меня будет (сослагательное), у тебя будет (сослагательное), мы устанем
    note: '*میام* — разговорное «я приду / я приду». В условии используй *داشته باشم*, *داشته باشی*, *خسته باشیم*: это формы сослагательного наклонения.'
    example_gloss:
    - Ты придёшь завтра?
    - Сегодня я не приду.
  fa.a2.unit37.lesson02.teach.person_endings:
    title: Подбери окончание к лицу
    gloss: у меня есть, у тебя есть, у него или у неё есть, у нас есть
    note: 'Окончание после *داشته* меняется по лицам: *باشم* (я), *باشی* (ты), *باشه* (он/она), *باشیم* (мы). Местоимение в персидском обычно опускают, потому что лицо видно по окончанию.'
  fa.a2.unit37.lesson02.teach.result_tense:
    title: Результат — в настоящем времени
    gloss: Если у меня будет время, я приду.
    note: Отдельная форма будущего времени здесь не нужна. Настоящее время в части-результате, *میام*, уже означает «я приду».
  fa.a2.unit37.lesson03.teach.time_clause_words:
    title: Когда, прийти, работа закончена, магазин
    gloss: когда, я приду, моя работа, закончена, станет, магазин, открыт, к, я тебе позвоню
    note: '*وقتی* означает «когда». *کارم تموم بشه* — «моя работа закончится». *بهت زنگ می‌زنم* — «я тебе позвоню».'
    example_gloss:
    - Когда я закончу работу, я приду.
    - Завтра я тебе позвоню.
  fa.a2.unit37.lesson03.teach.negative_forms:
    title: Отрицательные формы условия и «идти/оставаться»
    gloss: ты не придёшь, он (оно) не придёт, не будет (не является), у меня нет (чтобы у меня не было), один (одна), я иду, я остаюсь
    note: 'Чтобы сделать условие отрицательным, поставь *نـ* перед глаголом в сослагательном наклонении: *نیای*, *نیاد*, *نباشه*, *نداشته باشم*.'
    example_gloss:
    - Я иду один.
    - Сегодня я остаюсь дома.
  fa.a2.unit37.lesson03.teach.negative_condition:
    title: Отрицательное условие
    gloss: Если ты не придёшь, я пойду один. Если не будет дождя, мы пойдём в парк.
    note: 'Отрицательное условие — это тоже возможное условие. Глагол в сослагательном наклонении делается отрицательным с помощью *نـ*: *اگه نیای*, *اگه بارون نیاد*. Результат может быть как утвердительным, так и отрицательным.'
  fa.a2.unit37.lesson03.teach.if_vs_when:
    title: اگه — «возможно», وقتی — «точно»
    gloss: Когда я закончу работу, я приду. Если у меня будет время, я приду.
    note: '*وقتی* употребляется, когда событие обязательно произойдёт и ты лишь говоришь, когда именно. *اگه* употребляется, когда событие может и не произойти. После обоих союзов идёт глагол в сослагательном наклонении, а результат — в настоящем времени.'
  fa.a2.unit37.lesson04.teach.shop_words:
    title: Слова для магазина
    gloss: чек, деньги, товар, бракованный, скидка, этот, у вас есть, открыт
    note: '*جنس* — это товар, который ты покупаешь. *رسید دارید؟* — вежливый вопрос покупателю.'
    example_gloss:
    - Этот товар бракованный.
    - У вас есть чек?
    - Магазин сегодня открыт.
  fa.a2.unit37.lesson04.teach.policy_verbs:
    title: Глаголы для правил магазина
    gloss: мы обменяем его, мы вернём, вы купите, вы получите, у вас есть, ваши деньги
    note: 'Продавцы обращаются к покупателям на вежливое *شما* с окончаниями: *داشته باشید*, *بخرید*, *می‌گیرید*, а также с *-تون* в *پولتون*. *رو* ставится после определённого прямого дополнения.'
    example_gloss:
    - Мы обмениваем этот товар.
    - Сегодня вы получаете скидку.
  fa.a2.unit37.lesson04.teach.shop_pattern:
    title: Правило магазина с اگه
    gloss: Если у вас есть чек, мы вернём вам деньги.
    note: 'Правило магазина строится так же, как план: *اگه* плюс условие в сослагательном наклонении, затем результат в настоящем времени. С покупателями используй вежливые окончания *-ید* и *-تون*.'
  fa.a2.unit37.lesson04.teach.what_if_phrase:
    title: А что, если...?
    gloss: А если пойдёт дождь? А если у меня не будет чека?
    note: Добавь *چی؟* после условия, чтобы спросить «а что, если...?».
  fa.a2.unit37.lesson04.teach.what_if_question:
    title: اگه ... چی؟
    gloss: А если пойдёт дождь?
    note: 'Условие сохраняет глагол в сослагательном наклонении, а *چی؟* стоит в конце, без главной части. Собеседник отвечает результатом: *اگه بارون بیاد، می‌ریم سینما.*'
  fa.a2.unit37.lesson05.teach.reading_words:
    title: Слова для сообщений и объявлений
    gloss: привет, хороший, приходи, ты не можешь, прийти, мне, позвони, объявление
    note: '*بیا* и *بزن* — дружеские приказы. *بهم زنگ بزن* значит «позвони мне».'
    example_gloss:
    - Привет! Погода хорошая.
    - Если не сможешь прийти, позвони мне.
  fa.a2.unit37.lesson05.teach.message:
    title: Сообщение о завтрашнем дне
    gloss: Привет, Нима! Если завтра будет солнечная погода, мы пойдём в парк. Если пойдёт дождь, мы пойдём в кино. Если у тебя будет время, приходи. Если не сможешь прийти, позвони мне.
    note: Читай и находи каждое условие и его результат.
  fa.a2.unit37.lesson05.teach.notice:
    title: Объявление в магазине
    gloss: 'Объявление магазина: Если товар бракованный, мы обменяем его. Если у вас есть чек, мы вернём вам деньги. Если у вас нет чека, деньги мы не возвращаем. Если вы купите сегодня, вы получите скидку.'
    note: Каждое предложение — это одно правило с условием и результатом.
  fa.a2.unit37.lesson06.teach.dialogue_words:
    title: Да, хорошо, после этого
    gloss: да, хорошо, после этого
    note: '*آره* — обычное разговорное «да». *بعدش* значит «после этого».'
    example_gloss:
    - Да, мы идём завтра.
    - Хорошо! После этого мы идём на рынок.
  fa.a2.unit37.lesson06.teach.turn01:
    title: Сара предлагает пойти в парк
    gloss: 'Сара спрашивает: Нима, мы завтра идём в парк?'
    note: Вопрос в настоящем времени может спрашивать о плане.
  fa.a2.unit37.lesson06.teach.turn02:
    title: Нима называет условие
    gloss: 'Нима отвечает: Да, если не будет дождя.'
    note: 'Отрицательное условие может быть целым ответом: *اگه بارون نیاد، آره.*'
  fa.a2.unit37.lesson06.teach.turn03:
    title: Сара спрашивает «а если»
    gloss: 'Сара спрашивает: А если пойдёт дождь?'
    note: '*اگه ... چی؟* спрашивает о другой возможности.'
  fa.a2.unit37.lesson06.teach.turn04:
    title: Нима предлагает другой план
    gloss: 'Нима отвечает: Если пойдёт дождь, мы пойдём в кино.'
    note: Ответ — это условие плюс результат в настоящем времени.
  fa.a2.unit37.lesson06.teach.turn05:
    title: Сара добавляет второй план
    gloss: 'Сара говорит: Хорошо. Если у тебя будет время, после этого мы пойдём на рынок.'
    note: Второй план зависит от нового условия.
  fa.a2.unit37.lesson06.teach.turn06:
    title: Нима различает «если» и «когда»
    gloss: 'Нима говорит: Если у меня будет время, я приду. Когда я закончу работу, я тебе позвоню.'
    note: '*اگه* — это возможность; *وقتی* — то, что обязательно произойдёт.'
