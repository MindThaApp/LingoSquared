    correct_option: Если у меня будет время, я приду.
    distractors:
    - Если у тебя будет время, я приду.
    - У меня есть время, поэтому я пришёл.
    - Если я приду, у меня будет время.
    accepted_answers:
    - value: Если у меня будет время, я приду.
      status: correct
    feedback: '*باشم* — окончание «я», а *میام* — результат в настоящем времени: «я приду».'
  fa.a2.unit37.lesson02.exercise02.recognize_tired_condition:
    instruction: Что означает это предложение?
    correct_option: Если ты устал, мы не пойдём на улицу.
    distractors:
    - Если я устал, мы не пойдём на улицу.
    - Если мы устали, ты не пойдёшь на улицу.
    - Ты устал, поэтому мы пошли на улицу.
