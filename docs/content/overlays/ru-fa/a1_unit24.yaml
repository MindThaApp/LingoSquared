course:
  title: Персидский язык (Иран) A1
  description: 'Начальный иранский фарси: понятие хобби и свободного времени, четыре повседневных занятия (чтение, музыка, фильмы, спорт/футбол), рассказ о том, как часто ты этим занимаешься, вопрос о том, чем человек занимается в свободное время, короткий текст о хобби نیما и заключительный диалог между نیما и سارا.'
