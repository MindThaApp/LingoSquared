teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: Свободное время
    gloss: свободное время
    note: '*وقت آزاد* означает «свободное время» — буквально «свободное/открытое время».'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Хобби
    gloss: хобби
    note: '*سرگرمی* означает «хобби» или «увлечение».'
    example_gloss: Чтение — это хобби.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Чтение книг
    gloss: чтение книг
    note: '*کتاب خوندن* буквально «чтение книг»: слово *کتاب* (книга) уже встречалось, *خوندن* (читать) здесь новое.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: Мне нравится ...
    gloss: я люблю
    note: '*دوست دارم* работает одинаково и с предметом, и с действием: *کتاب خوندن دوست دارم* означает «Я люблю читать книги».'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: Музыка
    gloss: музыка
    note: Слово *موسیقی* встречается снова.
    example_gloss: Я слушаю музыку.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: Я слушаю
    gloss: я слушаю
    note: '*گوش می‌دم* буквально значит «я даю ухо» — так по-фарсийски естественно сказать «я слушаю».'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Фильм
    gloss: фильм
    note: Слово *فیلم* встречается снова.
    example_gloss: Я смотрю фильмы.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Я смотрю / Я вижу
    gloss: я смотрю / я вижу
    note: '*می‌بینم* — форма настоящего времени глагола, прошедшее время которого (*دیدم*, «я видел(а)») уже встречалось.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Спорт / упражнения
    gloss: спорт / упражнения
    note: '*ورزش* означает и «спорт», и «физические упражнения» в целом.'
    example_gloss: Я занимаюсь спортом.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Я делаю
    gloss: я делаю
    note: '*می‌کنم* — общий глагол «делать», который используется в составных глаголах, например *ورزش می‌کنم* (я занимаюсь спортом).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Футбол
    gloss: футбол
    note: '*فوتبال* означает «футбол».'
    example_gloss: Я люблю футбол.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Я играю в футбол
    gloss: я играю в футбол
    note: '*بازی* означает «игра» или «играть»: *فوتبال بازی می‌کنم* буквально значит «я делаю футбольную игру».'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Неделя
    gloss: неделя
    note: '*هفته* означает «неделя».'
    example_gloss: Я занимаюсь спортом каждую неделю.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: Каждую неделю
    gloss: каждую неделю
    note: '*هر* так же сочетается с *هفته*, образуя *هر هفته* (каждую неделю).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Иногда
    gloss: иногда
    note: '*گاهی* означает «иногда».'
    example_gloss: Иногда я читаю книги.
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: Чем ты занимаешься в свободное время?
    gloss: Чем ты занимаешься в свободное время?
    note: '*چیکار می‌کنی* уже встречалось. Здесь оно используется, чтобы спросить именно о свободном времени.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: Нима
    gloss: Нима
    note: '*نیما* — персонаж, с которым ты познакомился(-лась) в юните 11. Он снова появляется здесь.'
    example_gloss: Нима любит читать книги.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: Несколько / сколько
    gloss: несколько / сколько
    note: '*چند* (сколько / несколько) вместе со счётным словом *تا* означает «несколько» или «сколько» перед исчисляемым существительным.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: Он/она читает
    gloss: он/она читает
    note: '*می‌خونه* — разговорная форма 3-го лица от *خوندن* (читать).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: Тоже / также
    gloss: тоже / также
    note: '*هم* означает «тоже, также». Так это слово уже использовалось в юните 11.'
    example_gloss: Нима тоже играет в футбол.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: Он/она делает
    gloss: он/она делает
    note: '*می‌کنه* — разговорная форма 3-го лица от *می‌کنم* (я делаю).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Чтение: свободное время Нимы'
    gloss: Нима любит читать книги. Каждую неделю он прочитывает несколько книг. Иногда он ещё играет в футбол.
    note: '*چند تا* перед *کتاب* означает «несколько книг». *می‌خونه* и *می‌کنه* — разговорные формы 3-го лица, которые используются, когда говорят о другом человеке.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Сара
    gloss: Сара
    note: '*سارا* — персонаж, с которым ты познакомился(-лась) в юните 14. Она снова появляется здесь.'
    example_gloss: Сара любит смотреть фильмы.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: Смотреть / видеть
    gloss: смотреть / видеть
    note: '*دیدن* — инфинитив глагола, настоящее время которого (*می‌بینم*) было в уроке 2, а прошедшее (*دیدم*) — в юните 13.'
    example_gloss: Я люблю смотреть фильмы.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Я хожу в кино
    gloss: я хожу в кино
    note: '*سینما* (кино) уже встречалось. *می‌رم* (я иду) было в выражении *می‌رم سر کار* (я иду на работу).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Что
    gloss: что
    note: '*چی* означает «что». Так это слово уже было в юните 14 в фразе *تو چی؟* (А ты?).'
    example_gloss: А ты?
  fa.a1.unit24.lesson06.teach.va_word:
    title: И
    gloss: и
    note: '*و* означает «и». Так это слово уже использовалось в юните 14.'
    example_gloss: Я люблю читать и люблю футбол.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: Как здорово!
    gloss: как здорово!
    note: '*چه خوب!* уже встречалось. Это частая положительная реакция, как «здорово!».'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Нима: Сара, что ты делаешь в свободное время?'
    gloss: Сара, что ты делаешь в свободное время?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Сара: Я люблю смотреть фильмы...'
    gloss: Я люблю смотреть фильмы. Каждую неделю хожу в кино. А ты?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Нима: Я люблю читать книги...'
    gloss: Я люблю читать книги. Иногда ещё играю в футбол.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Сара: Как здорово!'
    gloss: Как здорово!
