    gloss: ага
    note: '*آره* — обиходное разговорное «да»; оно снова встречается здесь.'
  fa.a1.unit28.lesson06.teach.dialogue_line1:
    title: 'Нима: Я каждый день езжу на работу на автобусе. А ты?'
    gloss: Я каждый день езжу на работу на автобусе. А ты?
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: 'Сара: Я езжу в школу на велосипеде.'
    gloss: Я езжу в школу на велосипеде.
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: 'Нима: Автобус или велосипед — что лучше?'
    gloss: Автобус или велосипед — что лучше?
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: 'Сара: Велосипед лучше, потому что это спорт.'
    gloss: Велосипед лучше, потому что это спорт.
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: 'Нима: Да, но иногда я хожу и пешком.'
    gloss: Да, но иногда я хожу и пешком.
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: 'Сара: Как здорово!'
    gloss: Как здорово!
