    gloss: или
    note: '*یا* соединяет здесь два варианта транспорта.'
    target_text: یا (или)
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: Автобус или метро, что лучше?
    gloss: Автобус или метро, что лучше?
    note: В *اتوبوس یا مترو، کدوم بهتره؟* *یا* перечисляет варианты, а *کدوم بهتره؟* просит совета.
  fa.a1.unit28.lesson04.teach.belit_review:
