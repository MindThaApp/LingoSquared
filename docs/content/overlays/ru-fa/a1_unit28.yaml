  description: 'Начальный иранский фарси: названия способов передвижения (автобус, метро, машина, велосипед, пешком, такси), рассказ о том, как ты регулярно добираешься (каждый день на автобусе на работу), вопрос о том, какой транспорт лучше (اتوبوس یا مترو، کدوم بهتره؟), вопрос о цене местного билета и чтение короткой фразы из расписания, текст для чтения о ежедневных поездках نیما и سارا и итоговый диалог نیما и سارا, где они сравнивают, как каждый из них добирается.'
