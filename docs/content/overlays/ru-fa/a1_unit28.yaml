teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: Я
    gloss: я
    note: '*من* уже хорошо знакомо и снова встречается здесь, когда речь о том, как ты добираешься.'
  fa.a1.unit28.lesson01.teach.ba_word:
    title: На (транспорте) / с
    gloss: на / с
    note: '*با* — предлог, который используется с транспортом: *با* + название транспорта + *می‌رم* означает «Я езжу на [транспорте]».'
    target_text: با (на / с)
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: Автобус
    gloss: автобус
    note: '*اتوبوس* — обычное слово для «автобус».'
    example_gloss: Я езжу на автобусе.
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: Я езжу на автобусе
    gloss: Я езжу на автобусе
    note: '*با اتوبوس می‌رم* состоит из *با* + *اتوبوس* + *می‌رم* («я иду/еду»).'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: Метро
    gloss: метро
    note: '*مترو* — прямое повседневное заимствование: тегеранское метро так и называется — *مترو*.'
    example_gloss: Я езжу на метро.
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: Я езжу на метро
    gloss: Я езжу на метро
    note: '*با مترو می‌رم* строится точно так же: *با* + транспорт + *می‌رم*, как и с автобусом.'
  fa.a1.unit28.lesson02.teach.mashin_word:
    title: Машина
    gloss: машина
    note: '*ماشین* — обычное слово для «машина».'
    example_gloss: Я езжу на машине.
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: Я езжу на машине
    gloss: Я езжу на машине
    note: '*با ماشین می‌رم* строится по той же модели: *با* + транспорт + *می‌رم*.'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Велосипед
    gloss: велосипед
    note: '*دوچرخه* значит «велосипед», буквально «два колеса».'
    example_gloss: Я езжу на велосипеде.
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: Я езжу на велосипеде
    gloss: Я езжу на велосипеде
    note: '*با دوچرخه می‌رم* — снова та же модель.'
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: Каждый день
    gloss: каждый день
    note: '*هر روز* снова встречается здесь, когда речь о регулярной поездке.'
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: Работать
    gloss: работать
    note: '*سر کار* значит «на работу» — предлог не нужен, просто *می‌رم* + *سر کار*.'
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: Каждый день я езжу на работу на машине
    gloss: Каждый день я езжу на работу на машине
    note: '*هر روز با ماشین می‌رم سر کار* объединяет всё из этого урока: частотность, транспорт и место назначения.'
  fa.a1.unit28.lesson03.teach.piyade_word:
    title: Пешком
    gloss: пешком
    note: '*پیاده* значит «пешком» — в отличие от прежних видов транспорта, здесь НЕ нужно *با*: говорят *پیاده می‌رم*, а не *با پیاده می‌رم*.'
    example_gloss: Я хожу пешком.
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: Я хожу пешком (без با)
    gloss: Я хожу пешком
    note: '*پیاده می‌رم* — *پیاده* здесь работает как наречие, подобно русскому «пешком», которому тоже не нужен предлог.'
    target_text: پیاده می‌رم (без با)
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: Такси
    gloss: такси
    note: '*تاکسی* — прямое повседневное заимствование, «такси», и оно БЕРЁТ *با*, как и другие виды транспорта.'
    example_gloss: Я езжу на такси.
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: Я езжу на такси
    gloss: Я езжу на такси
    note: '*با تاکسی می‌رم* следует обычной модели *با* + транспорт.'
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: Который / какой
    gloss: какой
    note: '*کدوم* значит «какой (из них)» — здесь им спрашивают, какой транспорт лучше.'
    target_text: کدوم (какой)
  fa.a1.unit28.lesson03.teach.behtare_review:
    title: Лучше
    gloss: лучше
    note: '*بهتره* — это слово «лучше».'
  fa.a1.unit28.lesson03.teach.ya_review:
