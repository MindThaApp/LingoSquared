teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: 门票
    gloss: 这张门票
    note: '*Het kaartje* 是中性名词,要用 *het*,不用 *de*。'
    example_gloss: 我想买一张去乌特勒支的票。
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: 请求买票
    gloss: 我想买一张去乌特勒支的票。
    note: '*Wil graag* 使请求显得更委婉,和第6单元点餐时用的句型相同。'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: 售票员询问票种
    gloss: 您要单程票还是往返票?
    note: '*Wilt u* 是 *willen* 的敬称形式,这里用于面对不认识的车站工作人员。'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: 礼貌地回答
    gloss: 请给我往返票。
    note: '*Alstublieft* 是敬称的“请”,与这段对话中 *u* 的正式语气相配。'
  nl.a1.unit15.lesson01.teach.register_note:
    title: 售票窗口的称呼方式
    gloss: 在柜台前,通常使用礼貌的称呼 u。
    note: 延续第1单元介绍的 *jij*/*je* 与 *u* 的区别:对担任服务角色的陌生人,默认用 *u*。
  nl.a1.unit15.lesson02.teach.perron:
    title: 站台
    gloss: 站台
    note: '*Het perron* 是中性名词,要用 *het*,不用 *de*。'
    example_gloss: 去乌特勒支的火车从哪个站台出发?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: 询问站台
    gloss: 去乌特勒支的火车从哪个站台出发?
    note: '*Van welk perron* 专门询问站台,不同于询问一般的地点。'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: 说明发车信息
    gloss: 火车九点三刻从五号站台发车。
    note: '*Kwart voor tien* 沿用了第4单元的钟点表达方式。'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: 询问到达时间
    gloss: 火车几点到?
    note: '*Komt ... aan* 是可分动词(*aankomen*)的用法;在问句中 *aan* 移到句末。'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: 说明到达时间
    gloss: 火车十一点到。
    note: '*Komt aan* 再次表明可分动词的两个部分在句中被分开。'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: 准时/延误
    gloss: 准时;延误
    note: '*Op tijd* 是固定表达,表示按时发生。*De vertraging*(晚点)是 de 类名词。'
    example_gloss:
    - 火车没有准时发车。
    - 请注意:去乌特勒支的火车晚点了。
  nl.a1.unit15.lesson03.teach.let_op:
    title: 一则广播
    gloss: 请注意:去乌特勒支的火车晚点了。
    note: '*Let op*(字面意思是“注意”)用于车站广播的开头,类似汉语里的“各位乘客请注意”。'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: 否定“准时”
    gloss: 火车没有准时发车。
    note: '*Niet* 放在 *op tijd* 之前,否定整个表达。'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: 站台变更
    gloss: 火车改从三号站台发车,而不是五号站台。
    note: '*In plaats van* 的意思是“而不是”“代替”。'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: 说明晚点时长
    gloss: 火车晚点十分钟。
    note: '*Heeft vertraging*(字面意思是“有晚点”)是表达晚点的自然说法,此外还有形容词 *vertraagd*。'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: 入口、出口、候车室
    gloss: 入口;出口;候车室
    note: '*De ingang*、*de uitgang* 和 *de wachtruimte* 都是 de 类名词。'
    example_gloss:
    - 入口在哪里?
    - 出口在哪里?
    - 候车室在哪里?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: 询问站台在哪里
    gloss: 七号站台在哪里？
    note: 这里沿用了第9单元问路课中的 *Waar is...?* 句型。
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: 指路
    gloss: 一直往前走,然后向右转。
    note: '*Rechtdoor* 和 *rechts* 就是第9单元学过的方向词,这里用在车站场景中。'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: 询问候车室
    gloss: 候车室在哪里?
    note: 同一个问句句型,用在新的地点上。
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: 读一张车票
    gloss: 车票:阿姆斯特丹中央车站至乌特勒支中央车站。出发:十点十分,七号站台。到达:十点五十分。往返。价格:十二欧元四十分。
    note: 请找出发车时间和站台、到达时间、票种以及票价。
    glosses:
      Kaartje: 门票
      Vertrek: 发船
      tien: 十
      perron: 站台
      zeven: 七
      Aankomst: 到达
      elf: 十一
      Retour: 往返票
      Prijs: 票价
      twaalf: 十二
      euro: 欧元
      veertig: 四十
  nl.a1.unit15.lesson06.teach.omar_open:
    title: 奥马尔说出计划
    gloss: 奥马尔:我们得去七号站台。火车十点十分出发。
    note: 这里的 *Moeten*(必须、得)表示实际需要,而不是严格的义务。
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: 洛特看指示牌
    gloss: 洛特:看,那边的牌子上写着:晚点,十分钟。
    note: '*Daar staat*(字面意思是“那里立着”)是表示牌子上显示着某内容的自然说法。'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: 奥马尔保持镇定
    gloss: 奥马尔:没问题,我们还有时间喝杯咖啡。
    note: '*Geen probleem* 是常见的、随意的安慰说法。'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: 火车到了
    gloss: 洛特:好主意。哦,火车已经来了。七号站台,正好!
    note: '*Al*(已经)表示考虑到刚刚广播的晚点,火车来得比预期早。'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: 他们上了火车
    gloss: 奥马尔:走吧,我们上车。乌特勒支,我们来啦!
    note: '*Stappen in*(上车)是可分动词;*in* 移到分句末尾。*We komen eraan*(字面意思是“我们正朝它而来”)是荷兰语中表达“我们来啦”的自然说法,逐字翻译会显得不地道。'
