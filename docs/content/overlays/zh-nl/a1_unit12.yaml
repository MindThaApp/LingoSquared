teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: 荷兰语的日常过去时
    gloss: 在对话中，表示已完成的事件，通常用 hebben 或 zijn 加过去分词。
    note: 荷兰语日常谈论过去发生的事，通常就用这种“助动词＋过去分词”的形式。*Ik heb koffie gedronken* 可以表示“我喝了咖啡”，也可以表示“我喝过咖啡”。汉语靠“了”“过”等助词表达，荷兰语则靠助动词加过去分词。
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: 我喝了咖啡
    gloss: 喝 → 我喝了咖啡。
    note: '*Heb* 是助动词，*gedronken* 是 *drinken* 的过去分词。'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: 我去了超市
    gloss: 去 → 我去了超市。
    note: '*Gaan* 用 *zijn*：*ik ben gegaan*。'
  nl.a1.unit12.lesson01.teach.word_order:
    title: 过去分词放在句末
    gloss: 过去分词放在句末：Ik heb koffie gedronken。想一想 Ik sta op 中 op 所在的句末位置。
    note: 第10单元已经训练过你留意从句末尾的重要成分。这里句末的成分是过去分词。
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: 大多数动词用 hebben
    gloss: 大多数动词用 hebben。
    note: 本单元中，*drinken*、*eten*、*werken* 和 *kopen* 都用 *hebben*。
  nl.a1.unit12.lesson02.teach.drinken:
    title: drinken 搭配 hebben
    gloss: 喝 → 我喝了咖啡。
    note: 完整的结构是 *ik + heb + 宾语 + gedronken*。
  nl.a1.unit12.lesson02.teach.eten:
    title: eten 搭配 hebben
    gloss: 吃 → 我吃了面包。
    note: '*eten* 的过去分词是 *gegeten*。'
  nl.a1.unit12.lesson02.teach.werken:
    title: werken 搭配 hebben
    gloss: 工作 → 我工作了。
    note: '*werken* 的过去分词是 *gewerkt*。'
  nl.a1.unit12.lesson02.teach.kopen:
    title: kopen 搭配 hebben
    gloss: 买 → 我买了苹果。
    note: '*kopen* 的过去分词是 *gekocht*。'
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: gaan 和 komen 用 zijn
    gloss: gaan 和 komen 要用 zijn。
    note: 在这里学的表示已完成事件的结构中，这两个常用的移动动词用 *zijn*，不用 *hebben*。
  nl.a1.unit12.lesson03.teach.gaan:
    title: gaan 搭配 zijn
    gloss: 去 → 我去了超市。
    note: '*ik* 后面用 *ben*，*gegaan* 放在句末。'
  nl.a1.unit12.lesson03.teach.komen:
    title: komen 搭配 zijn
    gloss: 来 → 我来了语言咖啡馆。
    note: '*ik* 后面用 *ben*，*gekomen* 放在句末。'
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: 比较助动词
    gloss: 我工作了，但是我去了超市。
    note: '*Werken* 搭配 *hebben*；*gaan* 搭配 *zijn*。'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: 昨天，今天早上
    gloss: 昨天，今天早上
    note: '*Gisteren* 指今天的前一天；*vanmorgen* 指今天的早上。'
    example_gloss:
    - 昨天我工作了。
    - 今天早上八点我喝了咖啡。
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: 我昨天工作了
    gloss: 昨天我工作了。
    note: 当 *gisteren* 放在句首时，*heb* 要放在 *ik* 前面。
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: 今天早上的咖啡
    gloss: 今天早上八点我喝了咖啡。
    note: 这里再次用到第4单元学过的钟点说法 *om acht uur*。
  nl.a1.unit12.lesson04.teach.time_order:
    title: 时间词在句首会改变语序
    gloss: Gisteren 或 Vanmorgen 之后，动词放在 ik 前面：Gisteren heb ik ...
    note: 这和第10单元中 *daarna* 之后动词放在 *ik* 前面的语序相同。
  nl.a1.unit12.lesson05.teach.recent_text:
    title: 一段最近事件的叙述
    gloss: 今天早上我去了超市。我买了苹果。然后我去了语言咖啡馆。我在那里喝了咖啡。
    note: 阅读时留意一个时间表达、几个地点，以及每个已完成的动作。
    glosses:
      Vanmorgen: 今天早上
      supermarkt: 超市
      gegaan: 去了
      appels: 苹果
      gekocht: 买了
      Daarna: 之后
      taalcafé: 语言咖啡馆
      Daar: 那里
      koffie: 咖啡
      gedronken: 喝了(过去式)
  nl.a1.unit12.lesson06.teach.question:
    title: 你昨天做了什么？
    gloss: Lotte:你昨天做了什么,Omar?
    note: '*Wat heb je ... gedaan?* 是询问别人做了什么的日常非正式问法。'
  nl.a1.unit12.lesson06.teach.answer:
    title: Omar 的三件事
    gloss: Omar:我工作了。然后我去了超市。我买了苹果。
    note: 回答用三个独立的句子说出三件已经完成的简单动作。
  nl.a1.unit12.lesson06.teach.morning_question:
    title: 那今天早上呢?
    gloss: Lotte:那你今天早上做了什么?
    note: 把 *gisteren* 换成 *vanmorgen*,就可以询问另一个最近的时间。
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Omar 来到了语言咖啡馆
    gloss: Omar:今天早上八点我来了语言咖啡馆。
    note: '*Komen* 使用 *zijn*:*ben ... gekomen*。'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Lotte 喝了咖啡
    gloss: Lotte:不错。我今天早上喝了咖啡。
    note: '*Drinken* 使用 *hebben*:*heb ... gedronken*。'
