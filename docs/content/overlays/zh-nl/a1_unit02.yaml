course:
  title: 荷兰语 A1
  description: 适合初学者的荷兰语课程，学习在荷兰日常生活的常见场景中使用数字。
units:
  nl.a1.unit02.basic_numbers:
    title: 日常生活中的数字
lessons:
  nl.a1.unit02.lesson01.nul_tot_twaalf:
    title: 零到十二
  nl.a1.unit02.lesson02.vanaf_dertien:
    title: 十三到九十九
  nl.a1.unit02.lesson03.telefoon_en_huisnummer:
    title: 电话号码和门牌号
  nl.a1.unit02.lesson04.leeftijd_en_aantallen:
    title: 年龄和数量
  nl.a1.unit02.lesson05.prijzen:
    title: 欧元价格
  nl.a1.unit02.lesson06.inschrijven_bij_de_bibliotheek:
    title: 报名参加语言咖啡馆
teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: 零到四
    gloss: 0——零，1——一，2——二，3——三，4——四
    note: 荷兰语的 nul 就是零，电话号码的第一位数字也是如此。één 上的重音符号在书面上用来区分数字 één 和冠词 een;在普通的荷兰语文本中，意思清楚时有时会省略这些符号。
    example_gloss:
    - 我有零欧元。
    - 我有一本书。
    - 我有两把椅子。
    - 我有三本书。
    - 有四个人。
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: 五到八
    gloss: 5——五，6——六，7——七，8——八
    note: Vijf、zes、zeven 和 acht 与 nul 到 vier 一样简单易学。
    example_gloss:
    - 我有五欧元。
    - 我有六本书。
    - 我有七把椅子。
    - 有八个人。
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: 九到十二
    gloss: 9——九，10——十，11——十一，12——十二
    note: Negen、tien、elf 和 twaalf 补全了十二以内的数字。
    example_gloss:
    - 我有九欧元。
    - 我有十把椅子。
    - 我有十一本书。
    - 有十二个人。
  nl.a1.unit02.lesson01.teach.how_many:
    title: 询问数量
    gloss: 多少？
    note: Hoeveel 用来询问数目或数量。
  nl.a1.unit02.lesson02.teach.teens:
    title: 十几
    gloss: 13–19：十三、十四、十五、十六、十七、十八、十九
    note: 荷兰语中从十三到十九的数词(除 vijftien 外的写法也一样)都以 -tien 结尾。
    example_gloss:
    - 我十三岁。
    - 我有十四欧元。
    - 我十五岁。
    - 我有十六本书。
    - 有十七个人。
    - 我十八岁。
    - 我有十九把椅子。
  nl.a1.unit02.lesson02.teach.tens:
    title: 整十数
    gloss: 20–90：二十、三十、四十、五十、六十、七十、八十、九十
    note: 把这些整十数当作构成更大两位数的基础来学习。
    example_gloss:
    - 我二十岁。
    - 那个要30欧元。
    - 我有四十欧元。
    - 有五十个人。
    - 我六十岁。
    - 那个要70欧元。
    - 有八十个人。
    - 我有九十欧元。
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: 个位在十位之前
    gloss: 21–99(30、40等整十数除外)：个位 + en + 十位
    note: 荷兰语通常先说个位，再说十位，这与汉语先说十位不同：42字面上是“二和四十”。整十数只用十位的词。
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: 二十一
    gloss: 21——二十一
    note: Eenentwintig 把 een + en + twintig 合写成一个词。
    example_gloss: 语言咖啡馆在二十一号教室。
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: 二十二
    gloss: 22——二十二
    note: tweeëntwintig 中 ë 上的两点表示相邻的元音分属不同的音节。
    example_gloss: 我二十二岁。
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: 三十二
    gloss: 32——三十二
    note: Tweeëndertig 写成一个词，中间连接处的 ë 带有两点。
    example_gloss: Omar 三十二岁。
  nl.a1.unit02.lesson02.teach.forty_two:
    title: 四十二
    gloss: 42是四十二。
    note: 先说个位再说十位：twee-en-veertig,连写为 tweeënveertig。
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: 四十八
    gloss: 48——四十八
    note: Achtenveertig 由 acht + en + veertig 组成，写成一个词。
    example_gloss: 我住在四十八号。
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: 七十五
    gloss: 75 — 七十五
    note: Vijfenzeventig 是把 vijf 放在 zeventig 前面。
    example_gloss: 那个要七十五欧分。
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: 九十九
    gloss: 99 — 九十九
    note: Negenennegentig 是一个复合词。
    example_gloss: 我九十九岁。
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: 询问电话号码
    gloss: 你的电话号码是多少？
    note: Je 使问句保持非正式，符合 Lotte 和 Omar 所处的语言咖啡馆场景。
  nl.a1.unit02.lesson03.teach.phone_number:
    title: 说出荷兰手机号码
    gloss: 我的电话号码是 06 21 43 65 87。
    note: 荷兰手机号码以 06 开头，通常写成 06 加八位数字。
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: 分组说出电话号码
    gloss: 零六，二十一，四十三，六十五，八十七
    note: 人们分组念电话号码的方式各不相同。本课程示范的是 06 后面每两位一组；需要说清楚时，一个数字一个数字地念也很正常。
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: 询问门牌号
    gloss: 你家的门牌号是多少？
    note: Huisnummer 指地址中的门牌号码。
  nl.a1.unit02.lesson03.teach.house_number:
    title: 说出门牌号
    gloss: 我家的门牌号是 48。
    note: 在书面地址或表格里，直接写数字很自然。
  nl.a1.unit02.lesson03.teach.live_number:
    title: 用门牌号说明住处
    gloss: 我住在四十八号。
    note: 当街道已经知道时，Op nummer ... 是说明门牌号的自然说法。
  nl.a1.unit02.lesson03.teach.repeat:
    title: 请求重复
    gloss: 你能重复一遍吗？
    note: 电话号码说得太快、没听清时很有用。
  nl.a1.unit02.lesson04.teach.ask_age:
    title: 非正式地询问年龄
    gloss: 你多大了？
    note: 这里用的是非正式的 je；只有在语境相关时，询问年龄才合适。
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: 说出年龄
    gloss: 我二十八岁。
    note: 荷兰语表示年龄要用 ben（“是”）加 jaar：Ik ben ... jaar，jaar 始终保持单数形式。
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: 说出 Omar 的年龄
    gloss: Omar 三十二岁。
    note: 表示年龄时，jaar 放在数字后面不加复数词尾。
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: 询问人数
    gloss: 有多少人？
    note: Hoeveel 直接放在名词 mensen 前面。
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: 说出人数
    gloss: 有十二个人。
    note: Er zijn 是表示“有”的常规复数结构。
  nl.a1.unit02.lesson04.teach.three_books:
    title: 数书的数量
    gloss: 我有三本书。
    note: 数字大于一时，boek 要用复数 boeken。
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: 数椅子的数量
    gloss: 七把椅子
    note: Stoelen 是 stoel 的复数。
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: 欧元
    note: 说出金额后，euro 通常保持单数：twee euro，而不是 twee euro's。
    example_gloss: 那个要两欧元。
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: 欧分
    note: 表示价格时，cent 放在数字后面通常也保持单数。
    example_gloss: 那个五十欧分。
  nl.a1.unit02.lesson05.teach.ask_price:
    title: 询问价格
    gloss: 这个多少钱？
    note: Hoeveel 询问数量，kost 的意思是“价格为”。
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: 两欧元五十分
    gloss: €2.50 — 两欧元五十分
    note: 荷兰语小数用逗号书写，写作 €2,50（汉语用小数点）。日常口语中通常说 twee euro vijftig，中间不加 en。
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: 七十五欧分
    gloss: €0.75 — 七十五欧分
    note: 金额不足一欧元时，只说分的数额很自然。
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: 十二欧元
    gloss: €12 — 十二欧元
    note: 整数欧元的价格不需要再说分。
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: 四欧元五十分
    gloss: €4.50 — 四欧元五十分
    note: 同样的口语模式适用于其他“几欧元几分”的价格。
  nl.a1.unit02.lesson05.teach.costs:
    title: 说出价格
    gloss: 那个两欧元五十分。
    note: Dat kost ... 可直接回答 Hoeveel kost dit?
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar 报名
    gloss: 工作人员：下午好。你是来参加语言咖啡馆的吗？Omar：是的，我想报名。
    note: 这一场景接续第 1 单元中 Omar 去图书馆语言咖啡馆的情节。
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: 报出电话号码
    gloss: 工作人员：好的。你的电话号码是多少？Omar：06 21 43 65 87。
    note: Omar 按前面练习过的每两位一组来报号码。
  nl.a1.unit02.lesson06.teach.house_turn:
    title: 说出门牌号
    gloss: 工作人员：那你家的门牌号是多少？Omar：四十八。
    note: 当问题已经提供了语境时，只回答一个数字很自然。
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: 听懂费用
    gloss: 工作人员：费用是两欧元五十分。Omar：好的。
    note: 口语报价遵循日常“欧元加分”的模式。
  nl.a1.unit02.lesson06.teach.group_turn:
    title: 询问小组人数
    gloss: Omar：小组里有多少人？工作人员：十二个。
    note: 这一场景再次使用本单元前面学过的 Hoeveel mensen ... 问句。
  nl.a1.unit02.lesson06.teach.room_turn:
    title: 找到房间号
    gloss: 工作人员：语言咖啡馆在二十一号厅。
    note: Zaal 指用于举办活动的房间或大厅。
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: 找到 Lotte 的桌子
    gloss: Lotte：嗨，Omar！我们坐在七号桌。
    note: 对话最后让 Omar 在同样轻松的场合与 Lotte 重新会合。
