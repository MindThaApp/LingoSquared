teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: 打电话
    gloss: 打电话
    note: 表示打电话的动词的不定式。
    example_gloss: 我得给你打电话。
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: 说你会打电话
    gloss: 我给你打电话。
    note: '*Bel* 是 *bellen* 的 ik 形式；这里荷兰语用现在时来表示打算做的事。'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: 接电话
    gloss: 你好，我是 Lotte。
    note: '*Met* + 名字（字面意思是“与名字”）是荷兰语中接电话时自报姓名的标准说法。'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: Omar 也这样接电话
    gloss: 你好，我是 Omar。
    note: 与 *Hallo, met Lotte* 相同的 *met* + 名字句型。
  nl.a1.unit22.lesson02.teach.met_wie:
    title: 询问对方是谁
    gloss: 请问您是哪位？
    note: '*Met wie spreek ik?* 是对不认识的来电者使用的标准正式说法。'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: 礼貌地表明身份
    gloss: 您正在和 Lotte 通话。
    note: '*U spreekt met* + 名字是非正式的 *met* + 名字对应的正式说法。'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: 请对方重复
    gloss: 你能重复一遍吗？
    note: '*Kun je* ...？（你能……吗？）加上 *herhalen*（重复）和 *dat*（那个）。'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: 请对方说慢一点
    gloss: 请别说得这么快。
    note: '*Niet zo* + 形容词否定的是程度，而不是动词本身：意思是“别那么快”，不是“别说话”。'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: 说你听不清
    gloss: 我听不清你说话。
    note: '*Horen*（听见）加 *niet goed*（不太清楚）表示听不清，和 *verstaan*（听懂）不同。'
  nl.a1.unit22.lesson04.teach.sms:
    title: 短信
    gloss: 短信
    note: 一个 de 类名词：*de sms*，来自国际通用的缩写。
    example_gloss: 这条短信是 Lotte 发来的。
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: 说你会发短信
    gloss: 我给你发条短信。
    note: '*Sturen*（发送）先接间接宾语（*je*），再接直接宾语（*een sms*）。'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: 说你会回电话
    gloss: 我稍后给你回电话。
    note: '*Terug*（回）是放在句末的可分动词词缀；*bellen* + *terug* 的意思就是“回电话”。'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: 阅读短信对话
    gloss: Omar：嗨，Lotte，你能给我打个电话吗？我有件事要告诉你。Lotte：好啊，当然，我五分钟后给你回电话。
    note: 注意 Omar 提出了什么请求、为什么，以及 Lotte 说什么时候回电话。
    glosses:
      Hoi: 你好
      kun: 能够;可以
      bellen: 打电话;称呼
      moet: 必须;得
      iets: 某事物
      vertellen: 讲述;告诉
      natuurlijk: 当然
      bel: 打电话;称呼
      vijf: 五
      minuten: 分钟
      terug: 回;返回
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: Omar 接电话
    gloss: Omar：你好，我是 Omar。
    note: 前面学过的 *met* + 名字句型，现在用在真正的通话中：接电话的人先开口并报上自己的名字。
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: Lotte 自报姓名
    gloss: Lotte：嗨，Omar，我是 Lotte。Omar：你打来真好！
    note: '*Fijn dat* ...（很高兴……）表示对某件事的积极反应。'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: Lotte 询问第一次上班的情况
    gloss: 洛特：你的第一个班上得怎么样？
    note: '*Was* 是 *zijn* 的简单过去时，和第12单元学过的完成时（hebben/zijn + 过去分词，例如 *Ik heb gewerkt*）是不同的结构；请看下一句之后的说明。'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: 奥马尔报喜讯
    gloss: 奥马尔：非常顺利，比我想的还要好。
    note: '*Ging* 是 *gaan*（去）的简单过去时，这里表示“进展、结果如何”；*dacht* 是 *denken*（想）的简单过去时。'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was、ging、dacht 是简单过去时的形式
    gloss: was → 是，ging → 去，dacht → 想
    note: '*Was*、*ging* 和 *dacht* 是不规则的简单过去时（verleden tijd）形式，与第12单元的完成时（hebben/zijn + 过去分词）不同，目前还没有系统讲解。现在请把 was/ging/dacht 当作本课出现的固定说法来记；完整的简单过去时变位规则会在后面的级别学习。'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: 洛特很自豪
    gloss: 洛特：听到这个真高兴！我为你感到骄傲。
    note: '*Trots op*（为……骄傲）是固定搭配，必须用 *op*，不能用 *van*。'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: 奥马尔很感动
    gloss: 奥马尔：谢谢你，这对我来说意义重大。
    note: '*Betekent* 是 *betekenen*（意味着）的第三人称形式；*voor me*（对我来说）表示对谁而言重要。'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: 他的
    gloss: 他的第一个班进行得非常顺利。
    note: 这里的 *Zijn* 是物主代词“他的”，不是动词“是”；这两个长得一样的词要靠上下文区分。
