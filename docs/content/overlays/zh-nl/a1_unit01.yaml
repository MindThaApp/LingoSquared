    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij 和 je 是非正式的单数形式;u 是正式的。
  nl.a1.unit01.lesson01.exercise02.choose_formal:
