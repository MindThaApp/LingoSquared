  nl.a1.unit01.lesson06.eerste_ontmoeting:
    title: 结束初次见面
teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: 你好与嗨
    gloss: 你好／嗨
    note: '*Hallo* 是中性的说法,非正式和正式场合都可以用。*Hoi* 很常见,属于非正式用语。'
    example_gloss:
    - 你好,你是新来的吗?
    - 嗨,我是 Noor。
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: “你”:非正式与正式形式
    gloss: 你(非正式,重读)/ 你(非正式,轻读)/ 您(正式)
    note: '*Jij* 是非正式的单数“你”,在需要强调或对比时使用。*Je* 是日常口语中常用的非正式单数轻读形式。*U* 表示尊重和距离感。在荷兰,对年长的陌生人和明确的正式关系中使用 u 很自然,但在许多商店和工作场所,成年人之间也常用 jij/je。'
    example_gloss:
    - 你是新来的吗?(非正式,重读)
    - 你是新来的。(非正式,轻读)
    - 您是新来的吗?(正式)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: 问同辈的人是不是新来的
    gloss: 你是新来的吗?
    note: 在疑问句中,*jij bent* 变为 *ben jij*:*jij* 位于动词之后时,动词词尾的 -t 要去掉。
  nl.a1.unit01.lesson01.teach.formal_new:
    title: 正式地问对方是不是新来的
    gloss: 你是新来的吗?
    note: 与 *u* 连用时,要用 *bent u*,-t 保留。
  nl.a1.unit01.lesson01.teach.register_rule:
    title: 选择“你”的形式
    gloss: jij/je:非正式 · u:正式或礼貌
    note: 对朋友、同辈、孩子,以及在许多轻松的现代场合,用 *jij/je*。当关系需要尊重或保持距离时,用 *u*;实际习惯因人而异,可以跟随对方的用法。
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: 早上、下午和晚上的问候
    gloss: 早上好 / 下午好 / 晚上好
    note: '*Goedemorgen* 用于早上,通常到中午前后。*Goedemiddag* 从中午前后用到下午。*Goedenavond* 是晚上的问候语。'
    example_gloss:
    - 早上好!你好吗?
    - 下午好,您好吗?(正式)
    - 晚上好!你是新来的吗?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: 最近怎么样?
    gloss: 您好吗?
    note: '*Hoe gaat het?* 是询问近况时常见的中性说法。'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: 你好吗?非正式
    gloss: 您好吗?
    note: '*Met je* 明确指出所问的对象,并且是非正式的。'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: 您好吗?正式
    gloss: 您好吗?
    note: 在需要正式称呼的场合,用 *met u*。
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 很好,谢谢:非正式
    gloss: 很好,谢谢。
    note: '*Dank je* 与非正式的称呼相配。'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 很好,谢谢:正式
    gloss: 很好,谢谢。
    note: '*Dank u* 与正式的称呼相配。'
  nl.a1.unit01.lesson02.teach.prima:
    title: 很棒
    gloss: 很棒 / 很好
    note: '*Prima* 是一个简短而积极的回答。'
    example_gloss: 很好,谢谢。
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: 不错
    gloss: 不错
    note: '*Niet slecht* 通常是略带积极意味的回答。'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: 你呢?非正式
    gloss: 您呢?
    note: '*Jou* 是 *met* 之后使用的非正式重读形式。'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: 您呢?正式
    gloss: 您呢?
    note: '*U* 让反问也保持正式。'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: 非正式地询问姓名
    gloss: 您叫什么名字?
    note: '*Hoe heet je?* 是最常用的非正式询问姓名的说法。'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: 正式地询问姓名
    gloss: 您叫什么名字?
    note: '*Hoe heet u?* 很礼貌;*Wat is uw naam?* 是另一种更像办理手续时用的正式说法,这里不作测试。'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: 说出你的名字
    gloss: 我叫 Noor。
    note: '*Ik heet ...* 是直接而标准的自报姓名的方式。'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: 自然地自我介绍
    gloss: 我是 Noor。
    note: '*Ik ben ...* 在口语自我介绍中尤其常见。'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: 我的名字是
    gloss: 我叫 Noor。
    note: '*Mijn naam is ...* 是正确的,但比 *Ik ben ...* 或 *Ik heet ...* 稍显郑重。'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: 很高兴认识你
    gloss: 很高兴认识你。
    note: 这句话友好自然,适合初次见面。
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: 幸会
    gloss: 幸会
    note: '*Aangenaam* 是惯用的客套话,比 *Leuk je te ontmoeten* 更正式。'
    example_gloss: 幸会!我是 Noor。
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: 询问对方来自哪里
    gloss: 您是哪里人?
    note: '*Kom je* 是非正式的疑问句形式。'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: 正式地询问对方来自哪里
    gloss: 您是哪里人?
    note: 与 *u* 连用时,动词是 *komt*:*Waar komt u vandaan?*
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: 来自荷兰
    gloss: 我来自荷兰。
    note: 在表示来源国的名称前使用 *uit*。
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: 来自比利时
    gloss: 我来自比利时。
    note: '*België* 的第二个 e 上有分音符。'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: 来自德国
    gloss: 我来自德国。
    note: '*Duitsland* 是国家名;*Duits* 是语言名。'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: 荷兰国籍
    gloss: 我是荷兰人。
    note: '*Nederlands* 既可以表示荷兰国籍,也可以表示荷兰语。'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: 比利时国籍
    gloss: 我是比利时人。
    note: '*Belgisch* 在这里表示比利时国籍。'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: 说荷兰语
    gloss: 我说荷兰语。
    note: 荷兰语中,语言名称的首字母要大写,汉语则没有这种书写区别。
  nl.a1.unit01.lesson04.teach.speak_english:
    title: 说英语
    gloss: 我说英语。
    note: '*Engels* 是荷兰语中表示英语的词。'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: 说德语
    gloss: 我说德语。
    note: '*Duits* 是荷兰语中表示德语的词。'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: 语言咖啡馆与图书馆
    gloss: 语言咖啡馆 / 图书馆
    note: '*taalcafé* 是一种轻松无压力的聚会,大家在这里与他人练习荷兰语。荷兰的公共图书馆常常举办各种本地活动,包括语言咖啡馆。'
    example_gloss:
    - 我是来参加语言咖啡馆的。
    - 我在图书馆学荷兰语。
  nl.a1.unit01.lesson05.teach.location:
    title: 见面的地点
    gloss: 语言咖啡馆在图书馆里。
    note: 这句话交代了场景的设定。
  nl.a1.unit01.lesson05.teach.here_for:
    title: 确认共同参加的活动
    gloss: 你是来参加语言咖啡馆的吗?
    note: 当两个人为同一个活动而来时,这是一句自然的非正式开场白。
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: 确认所参加的活动
    gloss: 是的,我是来参加语言咖啡馆的。
    note: 回答中清楚地重复了这项活动。
  nl.a1.unit01.lesson05.teach.learning:
    title: 说说你在学什么
    gloss: 我在学荷兰语。
    note: '*Leer* 是 *leren*(学习)的第一人称形式。'
  nl.a1.unit01.lesson05.teach.me_too:
    title: 我也是
    gloss: 我也是。
    note: '*Ik ook* 是表达彼此有共同点时简短而自然的说法。'
  nl.a1.unit01.lesson05.teach.first_time:
    title: 问对方是不是第一次来
    gloss: 这是你第一次来吗?
    note: 在经常举办的活动中,这是友好的闲聊。
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: 说这是你第一次来
    gloss: 是的,这是我第一次来。
    note: '*Mijn* 的意思是“我的”。'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: 洛特开启对话
    gloss: 洛特:嗨,我是洛特。你叫什么名字?
    note: 在这种轻松的小组场合,洛特使用非正式的 *je*。
  nl.a1.unit01.lesson06.teach.omar_name:
    title: 奥马尔说出自己的名字
    gloss: 奥马尔:我叫奥马尔。很高兴认识你。
    note: 他回答了关于名字的问题,并对这次见面表示问候。
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: 洛特询问对方来自哪里
    gloss: 洛特:我也是!你是哪里人?
    note: '*Jou ook!* 是回应 *Leuk je te ontmoeten* 的自然简短说法。'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: 奥马尔说出自己来自哪里
    gloss: 奥马尔:我来自埃及。你呢?
    note: '*En jij?* 是用非正式的方式把同一个问题抛回给对方。'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: 洛特继续闲聊
    gloss: 洛特:我来自荷兰。这是你第一次来语言咖啡馆吗?
    note: '*Bij het taalcafé* 指的是参加语言咖啡馆这项活动。'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: 奥马尔作答,并说明自己在学什么
    gloss: 奥马尔:是的,这是我第一次来。我在学荷兰语。
    note: 他先回答了洛特的问题,再补充了一条basic的个人信息。
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: 再见
    gloss: 再见!
    note: '*Tot ziens* 是一种中性的告别用语。'
  nl.a1.unit01.lesson06.teach.closing:
    title: 自然的结束语
    gloss: 洛特:好的!下周见。奥马尔:下周见!
    note: 当双方都预期会再见面时,重复说 *Tot volgende week* 很自然。
