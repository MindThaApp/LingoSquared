    instruction: 听音频,输入完整的荷兰语问句。
    accepted_answers:
    - value: Bent u nieuw hier?
      status: correct
    - value: Bent u nieuw hier
      status: correct
    - value: bent u nieuw hier?
      status: correct
    - value: bent u nieuw hier
      status: correct
    feedback: 录音说的是 Bent u nieuw hier?
  nl.a1.unit01.lesson02.exercise01.choose_morning:
    instruction: 选择适合 08:30 的问候语。
    correct_option: Goedemorgen
    distractors:
    - Goedemiddag
    - Goedenavond
