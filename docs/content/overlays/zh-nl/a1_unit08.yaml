  nl.a1.unit08.lesson04.teach.tussen_bij:
    title: 之间、附近/在
    gloss: 之间、附近/在
    note: 用 *tussen ... en ...* 表示一处在另外两处之间。*Bij* 表示一处在另一处附近,比 *naast* 不那么精确。
    example_gloss:
