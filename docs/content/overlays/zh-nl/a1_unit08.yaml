teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: 车站、超市、图书馆、医院
    gloss: 车站、超市、图书馆、医院
    note: '*station* 用 *het*:*het station*。*supermarkt* 在荷兰语中写成一个词:*de supermarkt*。*bibliotheek* 用 *de*:*de bibliotheek*。*ziekenhuis* 在荷兰语中写成一个词:*het ziekenhuis*。荷兰语名词有 de 和 het 两类,汉语没有这种区分,需要连同名词一起记。'
    example_gloss:
    - 车站在哪里?
    - 超市在车站旁边。
    - 图书馆在车站对面。
    - 医院在图书馆后面。
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: 银行、邮局、公交车站
    gloss: 银行、邮局、公交车站
    note: 表示金融机构的银行,荷兰语用 *de bank*。*postkantoor* 在荷兰语中写成一个词,用 *het*:*het postkantoor*。*bushalte* 在荷兰语中写成一个词,用 *de*:*de bushalte*。
    example_gloss:
    - 银行在超市旁边。
    - 邮局在图书馆和医院之间。
    - 公交车站在车站前面。
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: 旁边、对面
    gloss: 旁边、对面
    note: '*Naast* 表示一处紧挨着另一处。*Tegenover* 表示两个地方相对,常常隔着一条街或一片空地。'
    example_gloss:
    - 银行在超市旁边。
    - 图书馆在车站对面。
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: 超市在车站旁边
    gloss: 超市在车站旁边。
    note: '*Naast* 表示紧挨着:*De supermarkt is naast het station*。'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: 图书馆在车站对面
    gloss: 图书馆在车站对面。
    note: '*station* 仍然用 *het*:*tegenover het station*。'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: 后面、前面
    gloss: 后面、前面
    note: '*Achter* 表示一处在另一处后面。这里 *voor* 表示“在……前面”;在别的句子里它可以有其他意思。'
    example_gloss:
    - 医院在图书馆后面。
    - 公交车站在车站前面。
  nl.a1.unit08.lesson03.teach.hospital_behind:
    title: 医院在图书馆后面
    gloss: 医院在图书馆后面。
    note: 把 *achter* 放在另一个地点之前:*achter de bibliotheek*。
  nl.a1.unit08.lesson03.teach.stop_in_front:
    title: 公交车站在车站前面
    gloss: 公交车站在车站前面。
    note: 这里 *voor* 说明公交车站的位置。
  nl.a1.unit08.lesson04.teach.waar_is:
    title: ……在哪里?
    gloss: ……在哪里?
    note: 用 *Waar is ...?* 询问某一个地方的位置。
  nl.a1.unit08.lesson04.teach.where_post_office:
