teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: 询问别人的工作
    gloss: 您从事什么工作？
    note: 询问别人职业的标准随意说法。
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: 职业／厨师
    gloss: 职业；厨师
    note: '*Het beroep*(职业)是中性名词。*Kok*(厨师)是常见的职业名词,不分性别,男女都可以用:*een kok*,*de kok*。'
    example_gloss:
    - 你的职业是什么？
    - 我是厨师。
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: 说你是厨师
    gloss: 我是厨师。
    note: 说明职业的标准句型是 *werken als* + 职业,职业名词前不用冠词。
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: 护士
    gloss: 护士
    note: 这个职业的现代中性说法，适用于任何性别。
    example_gloss: 我是护士。
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: 说你是护士
    gloss: 我是护士。
    note: 和 *kok* 一样,用的是 *werken als* 句型。
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: 询问工作地点
    gloss: 你在哪里工作？
    note: 这是紧接着 *Wat doe je voor werk?* 的常见追问。
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: 在餐厅工作
    gloss: 我在一家餐厅工作。
    note: 这里 *een restaurant* 用不定冠词,因为指的是众多餐厅中的一家。
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: 医院
    gloss: 医院
    note: 这是中性名词:*het ziekenhuis*。
    example_gloss: 我在医院工作。
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: 在医院工作
    gloss: 我在医院工作。
    note: '*Het ziekenhuis* 用定冠词,因为荷兰语把它看作说话双方都知道的特定机构。'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: 在办公室工作
    gloss: 有些人在办公室工作。
    note: '*Op kantoor*(在办公室)是不带冠词的固定说法,不同于 *in een restaurant*、*in het ziekenhuis*。'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: 开始时间
    gloss: 我九点开始。
    note: '*Begin* 是 *beginnen*(开始)的 ik 形式,沿用了第4单元的钟点表达。'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: 工作日
    gloss: 我星期一到星期五工作。
    note: '*Van... tot...* 沿用了第3单元表示星期范围的句型。'
  nl.a1.unit17.lesson03.teach.pauze:
    title: 休息
    gloss: 休息
    note: 这是通性名词:*de pauze*。
    example_gloss: 我十二点休息。
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: 休息
    gloss: 我十二点休息。
    note: '*Pauze hebben*(休息)是自然的固定搭配。'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: 结束时间
    gloss: 我五点下班。
    note: '*Stop* 是 *stoppen*(停止、下班)的 ik 形式。'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: 完整的一个工作日
    gloss: 我九点开始，五点结束。
    note: 用 *en* 把 *begin* 和 *stop* 连成一句,描述一整个工作日。
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: 第三人称的动词词尾
    gloss: 主语是“他”或“她”时,动词通常要加一个 -t:他工作,她工作。
    note: 主语是 *hij*/*zij* 时,*werk* 变成 *werkt*,这是荷兰语现在时第三人称的规则变化。
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: Lotte的工作
    gloss: Lotte是一名护士。
    note: 用 *werkt* 而不是 *werk*,因为主语是第三人称的名字,不是 *ik*。
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: Omar的工作
    gloss: Omar是一名厨师。
    note: 和 *Lotte werkt als verpleegkundige* 一样,第三人称动词加 -t。
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: 使用代词
    gloss: 她在医院工作。他在一家餐厅工作。
    note: '*Zij*/*hij* 代替了 Lotte/Omar 的名字,但动词仍用同样的第三人称 -t 形式。'
  nl.a1.unit17.lesson05.teach.profiel:
    title: 阅读两份工作简介
    gloss: Lotte在医院当护士。她七点开始上班,星期一到星期五工作。Omar在餐厅当厨师。他十一点开始上班,四点休息。
    note: 分别留意每个人的职业、工作地点和时间安排。
    glosses:
      werkt: 工作
      verpleegkundige: 护士
      ziekenhuis: 医院
      begint: 开始
      zeven: 七
      maandag: 周一
      vrijdag: 星期五
      kok: 厨师
      restaurant: 餐厅
      elf: 十一
      pauze: 休息
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte问起工作
    gloss: Lotte:嗨,Omar!我很好奇,你到底是做什么工作的?
    note: '*Eigenlijk*(到底、其实)让问题听起来是友好的好奇,而不像盘问。'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar的回答
    gloss: Omar:我在餐厅当厨师。你呢?
    note: '*En jij?* 是把问题反问给对方的标准说法。'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte的回答
    gloss: Lotte:我在医院当护士。
    note: 与前面课程中已经出现的职业和工作地点一致。
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar问工作时间
    gloss: Omar:你的工作时间是怎样的?
    note: '*Uren maken*(字面意思是“制造小时”)是描述工作时间安排的固定习惯用语。'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte说明她的工作时间
    gloss: Lotte:我七点开始上班,星期一到星期五工作。
    note: 与前面阅读材料中已经出现的时间安排一致。
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Omar的反应
    gloss: Omar:那很早啊!我开始得晚一些,十一点。
    note: 与前面课程中已经出现的Omar的上班时间一致。
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte结束话题
    gloss: Lotte:我想,每份工作都有自己的节奏。
    note: 这是一句自然、带点感慨的结束语——理解意思即可，不必原样复述。
