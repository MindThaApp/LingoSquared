  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: 询问天气
    gloss: 天气怎么样？
    note: '*Wat voor* + 名词表示“什么样的”；这是非常常用的一般性提问。'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: 晴天
    gloss: 天气晴朗。
    note: '*Het is* + 天气形容词是标准句型，其中的 *het* 是不指代具体事物的虚主语。'
  nl.a1.unit19.lesson01.teach.regent:
    title: 下雨
    gloss: 正在下雨。
    note: '*Regenen*（下雨）用作无人称动词：*het regent*，不需要另外加形容词。'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: 多云
    gloss: 天气多云。
    note: 和 *zonnig* 一样，采用 *het is* + 形容词的句型。
  nl.a1.unit19.lesson02.teach.koud:
    title: 寒冷
    gloss: 今天很冷。
    note: '*Vandaag*（今天）说明天气描述所指的时间。'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: 今天很暖和。
    note: 在日常荷兰语谈论天气时，*warm* 既可以指“暖和”，也可以指“热”。
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: 对比气温
    gloss: 不冷，很暖和。
    note: '*Niet* 直接放在形容词 *koud* 前面进行否定。'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: 天气预报
    gloss: 天气预报
    note: 中性名词：*het weerbericht*，由 *weer*（天气）和 *bericht*（报告）组成的复合词。
    example_gloss: 天气预报怎么说？
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: 明天的天气
    gloss: 明天天气晴朗。
    note: '*Morgen*（明天）放在句首，所以后面的 *is het* 要倒装。'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: 两天的天气预报
    gloss: 周六晴朗温暖，但周日下一整天的雨。
    note: '*De hele dag*（整天）强调了雨下了多久。'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: 散步
    gloss: 这次散步
    note: 通性名词：*de wandeling*。
    example_gloss: 我们去散步好吗？
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: 提议散步
    gloss: 我们去散步好吗？
    note: '*Zullen we...?* 沿用了第11单元中提出计划的句型；*een wandeling maken*（字面意思是“做一次散步”）是表示“去散步”的固定说法。'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: 有条件的计划
    gloss: 如果下雨，我们就待在室内。
    note: '*Als*（如果）引出条件；因为 als 从句在前面，主句 *blijven we binnen* 中的主语和动词要倒装。'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: 同意并提议
    gloss: 好主意！我们去散步吧。
    note: '*Laten we...*（我们……吧）是另一种常见的提议方式，可与第11单元的 *Zullen we...?* 搭配使用。'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: 阅读两天的天气预报
    gloss: 天气预报：周六晴朗温暖。周日下一整天的雨。
    note: 注意看每一天对应的天气。
    glosses:
      Weerbericht: 天气预报
      zaterdag: 星期六
      zonnig: 晴朗的
      warm: 温暖的
      Zondag: 星期日
      regent: 下雨
      hele: 整个的
      dag: 天
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte 询问周末的天气
    gloss: Lotte：这个周末天气怎么样？
    note: '*Dit weekend*（这个周末）把问题放在不久的将来。'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar 说明天气预报
    gloss: Omar：星期六晴朗又暖和，但星期日整天下雨。
    note: 与前面阅读的天气预报完全一致。
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte 提出一个计划
    gloss: Lotte：那我们星期六去散步，好吗？
    note: '*Dan*（那么）把这个提议和 Omar 刚说的好天气直接联系起来。'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar 同意了，并安排星期日
    gloss: Omar：好主意。星期日我们就舒舒服服地待在家里。
    note: '*Lekker* 在这里是语气词，大致相当于“舒舒服服地”，常用在形容词或动词前，让句子听起来更惬意。'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte 敲定计划
    gloss: Lotte：太好了，那我们就看电影。
    note: '*Kijken*（看）自然地与 *een film*（一部电影）搭配。'
