teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: 父亲和母亲
    gloss: 父亲／母亲
    note: '*Vader* 是表示父亲的标准中性词。*Moeder* 是表示母亲的标准中性词。'
    example_gloss:
    - 这是我的父亲。
    - 那是我的母亲。
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: 父母、兄弟和姐妹
    gloss: 父母／兄弟／姐妹
    note: '*Ouders* 在这个意思上总是复数；*de broer* 和 *de zus* 都用 *de*。'
    example_gloss:
    - 我的父母住在乌得勒支。
    - 我有一个兄弟。
    - 我有一个姐妹。
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: 孩子和孩子们
    gloss: 孩子／孩子们
    note: '*Kind* 是 het 词：*het kind*。复数 *kinderen* 用 *de*，尽管单数 *kind* 用 *het*。'
    example_gloss:
    - 我姐姐／妹妹有一个孩子。
    - 我的叔叔和婶婶有两个孩子。
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: 我有一个哥哥／弟弟和一个姐姐／妹妹
    gloss: 我有一个兄弟和一个姐妹。
    note: '*Ik heb ...* 是说明自己有哪些家庭成员的标准说法。'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: 爷爷／外公、奶奶／外婆、叔叔／舅舅和阿姨／婶婶
    gloss: 爷爷／外公／奶奶／外婆／叔叔／舅舅／阿姨／婶婶
    note: '*Opa* 是日常说的“爷爷／外公”，*grootvader* 更正式，多用于书面。*Oma* 是日常说的“奶奶／外婆”，*grootmoeder* 更正式，多用于书面。*De oom*。*De tante*。'
    example_gloss:
    - 我的爷爷和奶奶住在鹿特丹。
    - 我的奶奶九十九岁了。
    - 我的叔叔住在阿姆斯特丹。
    - 我的叔叔和婶婶有两个孩子。
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: 表亲与侄甥的称呼有歧义
    gloss: neef = 堂／表兄弟或侄子／外甥；nicht = 堂／表姐妹或侄女／外甥女
    note: 汉语里堂表亲和侄甥有不同的称呼，荷兰语则不用不同的词来区分，要靠上下文判断指的是哪一种。本单元的练习不考这一点，这里只是让你以后遇到这些词时能认出来。
    target_text: neef = 堂兄弟／表兄弟，或侄子／外甥；nicht = 堂姐妹／表姐妹，或侄女／外甥女
  nl.a1.unit05.lesson02.teach.gezin:
    title: 家庭（同住的家人）
    gloss: 家庭（一家人）
    note: '*Gezin* 指一起生活的家庭（通常是父母和孩子）；*familie* 范围更广，泛指大家族和亲戚。'
    example_gloss: 我的家人住在乌得勒支。
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: 我的爷爷奶奶住在鹿特丹
    gloss: 我的爷爷和奶奶住在鹿特丹。
    note: '*Wonen in* 后面加城市名，表示某人住在哪里。'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: 我的叔叔和婶婶有两个孩子
    gloss: 我的叔叔和婶婶有两个孩子。
    note: 这里用 *hebben*，因为 *oom en tante* 指两个人。
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: 我的和你的（非重读与重读）
    gloss: 我的／你的（非重读）／你的（重读）
    note: '*Mijn* 无论后面是 de 词还是 het 词、是单数还是复数，形式都不变。*Je* 是不强调“是谁的”时常用的非正式形式，后面接任何名词形式也都不变。*Jouw* 比 *je* 语气更强，在对比两个人的家人时必须使用；它后面接任何名词形式同样不变。'
    example_gloss:
    - 这是我的兄弟。
    - 这是你的姐姐／妹妹吗？
    - 那是你的姐姐／妹妹吗？
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je 与 jouw 的区别
    gloss: je 和 jouw 都表示非正式的“你的”
    note: 不特别强调时用 *je*。强调是谁的，尤其是在对比时，用 *jouw*。没有对比时也可以用完整形式 *jouw*，但这时 *je* 更常见。
    target_text: je 和 jouw 都表示非正式的“你的”。不强调时通常用 je；jouw 语气更强，在表示对比时必须用。两者放在任何名词前形式都不变。
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: 这是我的哥哥／弟弟
    gloss: 这是我的兄弟。
    note: '*Dit is ...* 用来介绍身边的人。'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: 那是你的姐姐／妹妹吗？
    gloss: 那是你的姐姐／妹妹吗？
    note: '*Dat is ...* 指离得较远或已经提到过的人。'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: 他的和她的
    gloss: 他的／她的
    note: '*Zijn* 的形式始终不变，和 *mijn*、*je*、*jouw* 一样。*Haar* 的形式也始终不变。'
    example_gloss:
    - 这是他的父亲。
    - 那是她的母亲。
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn 与 haar 的区别
    gloss: zijn = 他的，haar = 她的
    note: 在这些例子里，所属者是男性就选 *zijn*，是女性就选 *haar*。后面的家人称呼不影响选择：*zijn vader* 和 *zijn moeder*；*haar vader* 和 *haar moeder*。
    target_text: zijn = 他的，haar = 她的；无论后面是什么名词，两者形式都不变。
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: 这是他的父亲
    gloss: 这是他的父亲。
    note: '*Zijn vader*——他的父亲。'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: 那是她的母亲
    gloss: 那是她的母亲。
    note: '*Haar moeder*——她的母亲。'
  nl.a1.unit05.lesson05.teach.heet:
    title: 名叫／叫做
    gloss: 叫（名字）
    note: '*Ik heet...* / *Hij heet...*——说出某人名字的标准说法，在第 1 单元已经出现过。'
    example_gloss: 我叫洛特。
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 家人的名字：Sander、Fenna、Jan 和 Marieke
    gloss: 桑德（荷兰男性名）／芬娜（荷兰女性名）／扬（荷兰男性名）／玛丽克（荷兰女性名）
    note: 这四个都是常见的荷兰人名：Sander 和 Jan 是男性名，Fenna 和 Marieke 是女性名。
    example_gloss:
    - 我的哥哥／弟弟叫桑德。
    - 我的姐姐／妹妹叫芬娜。
    - 我的父亲叫扬。
    - 我的母亲叫玛丽克。
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: 鹿特丹
    note: 荷兰的一座大城市。
    example_gloss: 洛特的爷爷和奶奶住在鹿特丹。
  nl.a1.unit05.lesson05.teach.profile:
    title: Lotte 的家庭介绍
    gloss: 我叫洛特。我有一个哥哥／弟弟和一个姐姐／妹妹。我的哥哥／弟弟叫桑德，我的姐姐／妹妹叫芬娜。我的父亲叫扬，我的母亲叫玛丽克。我的爷爷和奶奶住在鹿特丹。
    note: 洛特用口语简短介绍自己的家人，用到了本单元前面几课学过的词汇。
  nl.a1.unit05.lesson06.teach.egypte:
    title: 埃及
    gloss: 埃及
    note: 奥马尔的祖国，与前面的单元一致。
    example_gloss: 我的父母住在埃及。
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: 每个月
    gloss: 每个月
    note: '*Elke* + 单数名词表示“每……”。'
    example_gloss: 是的，每个月。
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: 你有兄弟姐妹吗？
    gloss: 洛特：奥马尔，你有兄弟姐妹吗？奥马尔：有，我有两个姐妹，没有兄弟。你呢？洛特：我有一个哥哥／弟弟和一个姐姐／妹妹。
    note: '*Broers of zussen*——兄弟或姐妹，用的是复数形式。'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: 你的父母也住在荷兰吗？
    gloss: 奥马尔：你的父母也住在荷兰吗？洛特：是的，我的父母住在乌得勒支。你的家人呢？奥马尔：我的父母住在埃及，但我的叔叔住在这里的阿姆斯特丹。
    note: '*Wonen ook in*——也住在……，用来询问别人是否同样如此。'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: 你经常见到他吗？
    gloss: 洛特：真好！你经常见他吗？奥马尔：是的，每个月都见。
    note: '*Zie je hem vaak?*——询问见面频率的自然、常用的说法。'
