teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: 饮食用 lekker vinden
    gloss: 说到饮食，荷兰语常用 lekker vinden。
    note: 汉语的“喜欢”在荷兰语里没有唯一对应的说法。说到味道时，用 *Ik vind ... lekker*，字面意思是“我觉得……好吃”。
  nl.a1.unit13.lesson01.teach.koffie:
    title: 喜欢咖啡
    gloss: 我喜欢咖啡。
    note: 食物或饮料放在 *vind* 和 *lekker* 之间。
  nl.a1.unit13.lesson01.teach.thee:
    title: 不喜欢茶
    gloss: 我不喜欢茶。
    note: 把 *niet* 放在 *lekker* 前面，表示不喜欢这个味道。
  nl.a1.unit13.lesson01.teach.question:
    title: 询问口味
    gloss: 你喜欢西红柿汤吗？
    note: 在非正式的问句中，*vind* 放在 *je* 前面。这延续了本课程中 *jij/je* 的称呼方式。
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: 活动用 leuk vinden
    gloss: 说到活动，荷兰语常用 leuk vinden：我喜欢骑自行车。
    note: 像骑自行车这样的活动用 *leuk*，不用 *lekker*。
  nl.a1.unit13.lesson02.teach.walking:
    title: 喜欢散步
    gloss: 我喜欢散步。
    note: 活动 *wandelen* 放在 *vind* 和 *leuk* 之间。
  nl.a1.unit13.lesson02.teach.dislike:
    title: 不喜欢逛街
    gloss: 我不喜欢逛街。
    note: '*Niet* 放在 *leuk* 前面。'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: 询问喜欢的活动
    gloss: 你喜欢做什么？
    note: '*Wat vind je leuk om te doen?* 是询问别人喜欢哪些活动的自然的通用问句。'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: 更强烈或更普遍的喜爱
    gloss: Houden van 表示强烈或普遍的喜爱。
    note: 要有选择地使用。对某种具体食物或活动的普通反应，更自然的说法是 *lekker vinden* 或 *leuk vinden*。
  nl.a1.unit13.lesson03.teach.music:
    title: 热爱音乐
    gloss: 我热爱音乐／我非常喜欢音乐。
    note: '*Houd* 是 *houden* 的 *ik* 形式，后面接 *van*。'
  nl.a1.unit13.lesson03.teach.films:
    title: 不喜欢电影
    gloss: 我不喜欢电影。
    note: 否定句中，*niet* 位于 *houd* 和 *van* 之间。
  nl.a1.unit13.lesson03.teach.contrast:
    title: 选择自然的表达
    gloss: 表达普通的口味，也可以说：我喜欢咖啡。表达活动，则说：我喜欢散步。
    note: 不要把汉语里每个“喜欢”都机械地译成 *houden van*。
  nl.a1.unit13.lesson04.teach.choice_question:
    title: 提供两个选项
    gloss: 你想喝咖啡还是茶？
    note: '*Wil je ... of ...?* 是请对方在两者中做选择。'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: 说出你更想要什么
    gloss: 我更想喝茶。
    note: 在这种普通的选择句式中，*liever* 跟在 *wil* 后面。
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: 更喜欢某一件东西
    gloss: 我更喜欢那件蓝色毛衣。
    note: 在两件东西中选一件时，也可以自然地说 *Ik heb liever ...*。
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever 表示更喜欢的选项
    gloss: Liever 表示你在两个选项中选择其中一个。
    note: 如果对话中两个选项都很清楚，比较的对象可以不说出来。
  nl.a1.unit13.lesson05.teach.message:
    title: 阅读多个喜好
    gloss: 你好，洛特，我喜欢这部电影，但奥马尔不喜欢电影。他更想去公园。我也喜欢散步。
    note: 注意谁喜欢这部电影，谁不喜欢电影，以及奥马尔选择了哪个替代方案。
    glosses:
      Hoi: 你好
      vind: 觉得；喜欢
      film: 电影
      leuk: 有趣；好玩
      maar: 但是
      houdt: 喜欢
      films: 电影（复数）
      wil: 想要
      liever: 更想；更喜欢
      park: 公园
      wandelen: 散步
  nl.a1.unit13.lesson06.teach.food_question:
    title: 洛特提供两种食物
    gloss: 洛特：你想吃什么，奥马尔？你想吃面包还是番茄汤？
    note: 第二个问句给出了两个选项。
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: 奥马尔选择汤
    gloss: 奥马尔：我更想喝番茄汤。我觉得番茄汤很好吃。你呢？
    note: 奥马尔先用 *liever* 做出选择，再用 *lekker* 说明这是出于口味。
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: 洛特选择面包
    gloss: 洛特：我更喜欢面包。我觉得番茄汤不太好吃。
    note: '*Niet zo lekker* 使否定的语气更委婉，在友好的交谈中很自然。'
  nl.a1.unit13.lesson06.teach.activity:
    title: 选择接下来做什么
    gloss: 奥马尔：吃完饭后你想做什么？洛特：我喜欢散步。
    note: '*Leuk* 用来形容活动 *wandelen*。'
  nl.a1.unit13.lesson06.teach.plan:
    title: 他们有相同的喜好
    gloss: 奥马尔：我也是。我很喜爱散步。我们去公园好吗？洛特：好主意。
    note: 这里再次用到了第11单元中非正式的约定计划的说法。
