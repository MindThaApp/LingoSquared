teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: 一起
    gloss: 一起
    note: '*Samen* 表明大家一起做这件事。'
    example_gloss: 我们一起喝杯咖啡好吗？
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: 喝咖啡
    gloss: 喝咖啡
    note: 荷兰语字面上说 *koffie drinken*，即“喝咖啡”。
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: 去看电影
    gloss: 去看电影
    note: '*Naar de film gaan* 是表示去看电影的常用说法，不需要再说出具体的地点词。'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: 我们喝杯咖啡好吗？
    gloss: 我们喝杯咖啡好吗？
    note: '*Zullen we ...?* 是荷兰语中提议一起做某事的标准句式。'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: 使用 Zullen we
    gloss: Zullen we + 活动？是提议一起做某事的常用说法。
    note: 活动放在 *we* 之后，动词放在句末：*Zullen we koffie drinken?*
  nl.a1.unit11.lesson01.teach.zin_om:
    title: 你想去看电影吗？
    gloss: 你想去看电影吗？
    note: '*Heb je zin om ...?* 用比较随意的方式询问对方是否想做某事。这里 *gaan* 前面要用 *te*。'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: 好呀，太好了！
    gloss: 好呀，太好了！
    note: '*Ja, leuk!* 是简短而热情的接受方式。'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: 好主意
    gloss: 好主意！
    note: '*Goed idee!* 通过正面评价提议来表示接受。'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: 这是个好计划
    gloss: 这是个好计划。
    note: 这是一种稍微完整一点的肯定回答。
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: 说明理由的拒绝
    gloss: 对不起，我去不了，因为我要工作。
    note: '*Sorry* 使拒绝的语气更委婉，*want* 引出简短的理由。'
  nl.a1.unit11.lesson02.teach.no_time:
    title: 我没有时间
    gloss: 我没有时间。
    note: '*Ik heb geen tijd* 是一个直接但很平常的拒绝理由。'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: 友好的拒绝
    gloss: Sorry + 我不行 + 简短的理由，会让拒绝显得友好。
    note: 在对话中理由不是必须的，但加上理由会让这个说法更实用、更礼貌。
  nl.a1.unit11.lesson03.teach.afspreken:
    title: 约见面
    gloss: 约定见面
    note: 在 *Zullen we* 之后，*afspreken* 写成一个词。在 *We spreken vrijdag af* 中，它分成 *spreken* 和 *af*。
    example_gloss: 我们星期五两点半见面好吗？
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: 星期五两点半见面
    gloss: 我们星期五两点半见面好吗？
    note: 这里把第 3 单元的星期名称与第 4 单元的 *om* 加时间结合起来。
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: half drie 是两点半
    gloss: half drie = 2:30；om half drie 表示约定的时间。
    note: 荷兰语是朝下一个整点来数的：*half drie* 是“到三点还差半小时”，所以是 2:30。
  nl.a1.unit11.lesson03.teach.date_time:
    title: 日期和时间
    gloss: 4月17日星期五三点一刻
    note: 星期和月份仍用小写。日期用 *op*，钟点用 *om*。
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: 确认时间
    gloss: 好的，星期五两点半我可以。
    note: '*Is goed* 表示确认所提议的安排可行。'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: 消息、邀请、语言咖啡馆
    gloss: 消息、邀请、语言咖啡馆
    note: '*Bericht* 是简短的书面或电子消息，*uitnodiging* 是邀请人参加活动，*taalcafé*（一个复合词，保留重音符号）是小组聚会的地点。'
    example_gloss:
    - 我收到了 Lotte 的一条消息。
    - 这是语言咖啡馆的邀请。
    - 我们在语言咖啡馆喝咖啡。
  nl.a1.unit11.lesson04.teach.invitation:
    title: Lotte 的邀请
    gloss: 你好 Omar，4 月 18 日星期六两点半，你想不想在语言咖啡馆喝杯咖啡？Lotte 敬上。
    note: 阅读时注意四个细节：活动、日期、时间和地点。
    glosses:
      Hoi: 你好
      zin: 想做某事（heb je zin = 你想不想）
      zaterdag: 星期六
      april: 四月
      half: 朝下一个整点数的“半”（half acht = 7:30）
      drie: 三
      koffie: 咖啡
      drinken: 喝
      taalcafé: 语言咖啡馆
      Groet: 此致
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: 一条提议的消息
    gloss: 你好 Omar，我们星期五两点半喝杯咖啡好吗？Lotte 敬上。
    note: 这条消息包括问候、活动、日期、时间和结束语。
    glosses:
      Hoi: 你好
      zullen: (我们)去……好吗
      vrijdag: 星期五
      half: 朝下一个整点数的“半”（half acht = 7:30）
      drie: 三
      koffie: 咖啡
      drinken: 喝
      Groet: 此致
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: 一条确认的消息
    gloss: 你好 Lotte，好啊，不错！星期五两点半可以。星期五见！Omar。
    note: 这条回复既接受了活动，又重复了时间安排来加以确认。
    glosses:
      Hoi: 你好
      leuk: 真好 / 太好了
      Vrijdag: 星期五
      half: 朝下一个整点数的“半”（half acht = 7:30）
      drie: 三
      goed: 好 / 合适
      Tot: 到……为止 / 再见
      vrijdag: 星期五
  nl.a1.unit11.lesson05.teach.message_shape:
    title: 消息包含什么
    gloss: 一条简短的消息要说明活动、日期或星期几，以及时间。
    note: 问候和结束语很有用，但最重要的细节是活动和发生的时间。
  nl.a1.unit11.lesson06.teach.proposal:
    title: Lotte 提议喝咖啡
    gloss: Lotte：我们星期五喝杯咖啡好吗？Omar：好啊，不错！几点？
    note: Omar 先接受了这个活动，然后再问时间。
  nl.a1.unit11.lesson06.teach.first_time:
    title: Lotte 提出的第一个时间
    gloss: Lotte：两点半。
    note: '*Half drie* 表示 2:30，与第 4 单元的规则一致。'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Omar 提出另一个时间
    gloss: Omar：抱歉，两点半我不行。三点一刻可以吗？
    note: '*Kan het om ...?* 是询问另一个时间是否可行的简洁说法。'
  nl.a1.unit11.lesson06.teach.confirm:
    title: 他们确认最终计划
    gloss: Lotte：好的，三点一刻可以。Omar：好主意。那我们就约星期五三点一刻见。
    note: 这里 *afspreken* 分开了：*spreken* 靠近句首，*af* 在句末。
