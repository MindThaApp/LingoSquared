teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: 询问总价
    gloss: 一共多少钱?
    note: '*In totaal*（总共）表示你想问的是合计的总价，而不是单件商品的价格。'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: 说出总价
    gloss: 一共二十五欧元。
    note: '*Kost* 是 *kosten*（花费、价格为）的第三人称单数形式。'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: 刷卡或用现金付款
    gloss: 刷卡支付,用现金支付
    note: '*Pinnen* 是荷兰语特有的“刷卡支付”动词，来源于授权付款用的密码（PIN）；*contant betalen*（付现金）是对应的现金支付说法，其中 *contant* 作副词，放在 *betalen* 之前。'
    example_gloss:
    - 我可以在这里刷卡吗?
    - 我付现金。
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: 询问是否可以刷卡
    gloss: 这里可以刷卡吗?
    note: '*Hier*（这里）表明这个问题针对的是当前所在的地点。'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: 询问付款偏好
    gloss: 您想用现金还是刷卡?
    note: '*Wilt u* ...? 是 *wil je* ...? 的正式说法，这里是不认识的收银员使用的。'
  nl.a1.unit23.lesson03.teach.rekening:
    title: 账单
    gloss: 账单
    note: 这是一个通性名词：*de rekening*。
    example_gloss: 我们分摊账单好吗?
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: 提议分摊账单
    gloss: 我们分摊账单好吗?
    note: '*Zullen we* ...? 沿用了第11单元和第19单元学过的提议计划的句式。'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: 请求分开付款
    gloss: 我可以分开付款吗?
    note: '*Apart*（分开地）修饰 *afrekenen*（结账）；afrekenen 与 *betalen* 意思相近，专指最后结清付款。'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: 找零
    gloss: 找零
    note: 这是一个中性名词：*het wisselgeld*，由 *wisselen*（兑换）和 *geld*（钱）组成的复合词。
    example_gloss: 这是您的找零。
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: 递上找零
    gloss: 这是您的找零。
    note: '*Uw* 是正式的物主代词“您的”，适用于柜台、收银台这类正式场合。'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: 谢绝找零
    gloss: 我不需要找零。
    note: '*Nodig hebben*（需要）沿用了第14单元 *rugzak nodig hebben* 的结构。'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: 三十五
    gloss: 三十五
    note: '*Vijfendertig*（字面是“五和三十”）遵循荷兰语复合数字先说个位、后说十位的标准规则。'
    example_gloss: 三十五欧元。
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: 阅读餐厅账单
    gloss: 账单:两份主菜和两杯咖啡。总计:三十五欧元。已刷卡支付。
    note: 注意点了什么、总额是多少以及付款方式。
    glosses:
      Rekening: 账单
      twee: 二
      hoofdgerechten: 主菜
      koffies: 咖啡
      Totaal: 总计
      vijfendertig: 三十五
      euro: 欧元
      Betaald: 已支付
      pin: 银行卡
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: 洛特要买单
    gloss: 洛特：我们叫服务员买单吧？
    note: '*Vragen*（要、请求）以 *de rekening* 作直接宾语。'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: 奥马尔询问总价
    gloss: 奥马尔：好，好主意。一共多少钱？
    note: 沿用了第一课中的问句 *hoeveel kost het in totaal?*。
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: 洛特说出总价
    gloss: 洛特：三十五欧元。我们分摊吧？
    note: '*Delen*（分摊）在这里根据上下文指的是 *de rekening*。'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: 奥马尔坚持付账
    gloss: 奥马尔：不用，今天我来付。你帮了我这么多。
    note: '*Laat mij* ...（让我来……）是主动提出做某事的标准说法；*geholpen* 是 *helpen*（帮助）的过去分词。'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: 洛特很感动
    gloss: 洛特：你真好！谢谢。
    note: '*Lief van je*（你真好）是对慷慨举动常用的温暖称赞。'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: 奥马尔询问能否刷卡
    gloss: 奥马尔：这里可以刷卡吗？
    note: 沿用了第二课中的问句 *kan ik hier pinnen?*，这次是在真实的餐厅场景里。
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: Betaalt：第三人称单数形式
    gloss: 奥马尔付账。
    note: '*Betaalt* 是 *betalen*（付款）的第三人称单数形式。'
