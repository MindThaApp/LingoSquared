teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: 小时
    gloss: 小时
    note: '*Uur* 跟在数字后面表示整点：*twee uur* 就是两点整。'
    example_gloss: 现在两点整。
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: 两点整
    gloss: 2:00 — 两点整
    note: 表示整点时，先说数字，再加 *uur*。
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: 三点整
    gloss: 3:00 — 三点整
    note: '*Drie uur* 正好是3:00。'
  nl.a1.unit04.lesson01.teach.half_three:
    title: 朝三点走到一半
    gloss: 2:30 — 两点半
    note: 与汉语的关键区别：汉语说“两点半”,以刚过去的整点为基准；荷兰语的 *half drie* 说的却是即将到来的整点，表示2:30,而不是3:30。
  nl.a1.unit04.lesson01.teach.half_rule:
    title: half 指向下一个整点
    gloss: 三点的一半 = 朝三点走到一半 = 2:30
    note: 把 *half* + 钟点理解为朝那个钟点走到一半。因此 *half vier* 是3:30。
  nl.a1.unit04.lesson01.teach.half_four:
    title: 朝四点走到一半
    gloss: 3:30 — 三点半
    note: '*Half vier* 是朝四点走到一半，所以表示3:30。'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: 说出半点
    gloss: 现在两点半。
    note: '*Het is ...* 是陈述当前时间的常用句式。'
  nl.a1.unit04.lesson02.teach.quarter:
    title: 一刻钟
    gloss: 一刻钟
    note: '*Kwart* 用在固定的钟点表达 *kwart over* 和 *kwart voor* 中。'
    example_gloss: 一刻钟是十五分钟。
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: 两点一刻
    gloss: 2:15 — 两点一刻
    note: '*Kwart over twee* 是两点过后十五分钟。'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over 表示“过”
    gloss: 过 = 整点之后
    note: 在钟点表达中，*over* 从刚刚过去的整点往后数。
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: 差一刻三点
    gloss: 2:45 — 差一刻三点
    note: '*Kwart voor drie* 是三点前十五分钟，所以是2:45。'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor 表示“差”
    gloss: 差 = 下一个整点之前
    note: 在钟点表达中，*voor* 指向下一个整点。
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: 三点一刻
    gloss: 3:15 — 三点一刻
    note: '*Over* 保留刚刚过去的整点：*kwart over drie*。'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: 差一刻四点
    gloss: 3:45 — 差一刻四点
    note: '*Voor* 说出即将到来的整点：*kwart voor vier* 是3:45。'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: 询问时间
    gloss: 几点了？
    note: '*Hoe laat is het?* 是询问当前时间的标准日常问句。'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: 说出时间
    gloss: 现在两点半。
    note: 请记住，荷兰语的钟点词 *drie*（三）在这里表示的是 2:30。
  nl.a1.unit04.lesson03.teach.ask_start:
    title: 询问活动几点开始
    gloss: 语言咖啡馆几点开始？
    note: '*Hoe laat* 用来引出询问具体钟点的问句。'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: 在两点一刻
    gloss: 两点一刻。
    note: 说明某件事在什么时间发生时，要在时间前面用 *om*。
  nl.a1.unit04.lesson03.teach.at_rule:
    title: 用 om 表示事件的时间
    gloss: 在＋时间：两点整、两点半
    note: 只用 *Het is* 说现在几点时，不要用 *om*。
  nl.a1.unit04.lesson03.teach.late:
    title: 询问自己是否迟到
    gloss: 我迟到了吗？
    note: 这里的 *Laat* 表示“迟、晚”；这句话常用于谈论时间的对话中。
  nl.a1.unit04.lesson03.teach.on_time:
    title: 说某人准时
    gloss: 不，你准时到了。
    note: '*Op tijd* 表示准时。*Je* 让这段对话显得随意、不拘礼节。'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: 十四点整
    gloss: 14:00——十四点整
    note: 时刻表和广播通常使用24小时制。*Veertien uur* 是14:00不会产生歧义的口语读法。
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: 十八点整
    gloss: 18:00——十八点整
    note: '*Achttien uur* 是下午6点的24小时制说法。'
  nl.a1.unit04.lesson04.teach.morning:
    title: 早上七点
    gloss: 7:00——早上七点
    note: '*''s Ochtends* 表示“在早上”。开头的 *''s* 是这个固定表达的一部分。'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: 下午两点
    gloss: 14:00——下午两点
    note: '*''s Middags* 指下午，大约从中午开始；在12小时制的口语中，它能把14:00和02:00区分开。'
  nl.a1.unit04.lesson04.teach.evening:
    title: 晚上八点
    gloss: 20:00——晚上八点
    note: '*''s Avonds* 用于晚上，大致从傍晚过后到午夜前后。'
  nl.a1.unit04.lesson04.teach.night:
    title: 夜里两点
    gloss: 2:00——夜里两点
    note: '*''s Nachts* 用于夜间时段；02:00自然就说 *twee uur ''s nachts*。'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: 一天中的时段
    gloss: 早上 · 下午 · 晚上 · 夜里
    note: 荷兰语中这些时段的界限只是大致的：*ochtend* 到中午前后，*middag* 从中午到整个下午，*avond* 持续整个晚上，*nacht* 指夜间时段。
    example_gloss:
    - 我早上喝咖啡。
    - 语言咖啡馆在下午。
    - 我晚上看书。
    - 我夜里睡觉。
  nl.a1.unit04.lesson05.teach.schedule:
    title: 时间表
    gloss: 时间表
    note: '*Rooster* 列出各项活动及其时间。'
    example_gloss: 我看时间表。
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: 语言咖啡馆开放时间
    gloss: 语言咖啡馆开放：14:00–16:00
    note: 荷兰的时间表常在小时和分钟之间用句点；14.00 和 14:00 是同一个时间。
  nl.a1.unit04.lesson05.teach.welcome:
    title: 欢迎环节的时间
    gloss: 14:15 欢迎
    note: 在日常12小时制的口语里，14.15 可以说成 *kwart over twee*。
  nl.a1.unit04.lesson05.teach.workshop:
    title: 工作坊的时间
    gloss: 14:45 工作坊
    note: 14.45 是 *kwart voor drie*：三点前的一刻钟。
  nl.a1.unit04.lesson05.teach.break:
    title: 休息时间
    gloss: 15:30 休息
    note: 15.30 是 *half vier*，意思是朝四点走了一半，也就是三点半，而不是四点半。
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: 询问时间表上的时间
    gloss: 工作坊几点开始？
    note: '*Begint* 用来询问活动何时开始。'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: 说出工作坊的时间
    gloss: 在三点差一刻。
    note: 时间表上的 14.45 对应 *kwart voor drie*。
  nl.a1.unit04.lesson06.teach.start_turn:
    title: 确认语言咖啡馆的时间
    gloss: Lotte：语言咖啡馆星期五几点开始？Omar：两点一刻，也就是14:15。
    note: Omar 把两种说法都说了出来：*kwart over twee* 和 14.15 是同一个时间，与课程五时间表上的欢迎环节时间一致。
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: 询问工作坊的情况
    gloss: Lotte：那工作坊几点开始？Omar：三点差一刻。
    note: '*Kwart voor drie* 是14:45，与课程五的时间表一致。'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: 说明到达时间
    gloss: Lotte：好的。那我两点到。
    note: Lotte 打算14:00到达，比14:15的开始时间早十五分钟。
  nl.a1.unit04.lesson06.teach.close_turn:
    title: 敲定计划
    gloss: Omar：好的，星期五下午见！
    note: '*Vrijdagmiddag* 是一个自然的复合词，意思是星期五下午。'
