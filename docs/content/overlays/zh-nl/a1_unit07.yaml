teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: 市场、商店、摊位
    gloss: 市场、商店、摊位
    note: '*De markt* 可以泛指市场，也可以指定期举行的露天市集。*De winkel* 是商店。*Kraam* 是露天市场上的摊位。'
    example_gloss:
    - 我去市场。
    - 我去商店。
    - 这个摊位卖苹果。
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: 苹果、梨、番茄、甜椒
    gloss: 苹果、梨、番茄、甜椒
    note: 单数是 *appel*，复数是 *appels*。单数是 *peer*，复数是 *peren*。单数是 *tomaat*，复数是 *tomaten*。荷兰语中 *paprika* 指甜椒，书面复数是 *paprika's*。荷兰语名词有单复数的形式变化，而汉语名词通常不变。
    example_gloss:
    - 我想要苹果。
    - 我想要梨。
    - 我想要番茄。
    - 我想要甜椒。
  nl.a1.unit07.lesson02.teach.kilo:
    title: 一公斤
    gloss: 一公斤
    note: '*Een kilo* 就是一公斤。'
    example_gloss: 我想要一公斤苹果。
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: 每公斤
    note: 市场上的标签常常按每公斤标价。
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: 一公斤苹果多少钱？
    gloss: 一公斤苹果多少钱？
    note: '*Hoeveel kost ...?* 用来问价格。这里花钱的对象是 *een kilo*，所以动词用单数 *kost*。'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: 一公斤苹果 €2,50
    gloss: 一公斤苹果 €2,50。
    note: 荷兰的价格用小数逗号，写作 €2,50；中文则用小数点，写作 €2.50。
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: 两欧元五十
    gloss: €2,50——两欧元五十
    note: €2,50 通常说成 *twee euro vijftig*，中间不加 *en*，也不说 *cent*。
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: 克、斤、一个、两个
    gloss: 一百克、一斤（500 克）、一个、两个
    note: 数字后面这里用 *gram*，不用 *grammen*。日常荷兰语中 *een pond* 指 500 克，与中文的“斤”相近，是旧时的非正式说法，不是官方公制单位。*Per stuk* 表示每件各有自己的价格；单独说数量、且数字大于一时，用 *stuks*，如 *twee stuks*。
    example_gloss:
    - 我要一百克奶酪。
    - 请给我一斤苹果。
    - 我可以要一个吗？
    - 我想要两个，谢谢。
  nl.a1.unit07.lesson03.teach.how_much:
    title: 您要多少？
    gloss: 您要多少？
    note: 摊主用礼貌的 *u*（您）。*Hoeveel* 既可以问重量，也可以问个数。
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: 请给我一斤番茄
    gloss: 请给我一斤（500 克）番茄。
    note: 摊主问 *Hoeveel wilt u?* 时，这是一个完整而自然的简短回答。
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: 价签
    gloss: 价签
    note: '*Prijskaartje* 写成一个词。请把整个词一起记住。'
    example_gloss: 价签上写着 €2,50。
  nl.a1.unit07.lesson04.teach.market_labels:
    title: 市场上的价签
    gloss: 苹果：每公斤 €2,50。梨：每公斤 €3,00。番茄：每公斤 €2,00。甜椒：每个 €1,00。
    note: '*per kilo* 读作“每公斤”，*per stuk* 读作“每件”。荷兰语的价签用逗号表示小数点。'
    glosses:
      Appels: 苹果
      kilo: 公斤
      Peren: 梨
      Tomaten: 番茄
      stuk: 件／个
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: 您想要什么？
    gloss: 您想要什么?
    note: '*Wat mag het zijn?* 是市场摊贩或店员常用的亲切问句。'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: 那我要一公斤梨
    gloss: 那我要一公斤梨，谢谢。
    note: 听到价格后决定买什么时，说 *Dan neem ik ...* 很自然。
  nl.a1.unit07.lesson05.teach.anything_else:
    title: 还要别的吗？
    gloss: 还要别的吗？
    note: 摊贩常用的简短追问。
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: 不用了，谢谢
    gloss: 不用了，谢谢。
    note: '*Dank u* 中的 *u* 是对摊贩使用的礼貌称呼，与之相配。'
  nl.a1.unit07.lesson05.teach.total:
    title: 一共是3,00欧元
    gloss: 一共是3,00欧元——三欧元。
    note: '*Dat is dan ...* 是摊贩报总价时的常用说法。书面的价格 €3,00 口语中读作 *drie euro*。'
  nl.a1.unit07.lesson05.teach.pin:
    title: 可以刷卡吗？
    gloss: 可以刷卡吗？
    note: '*Pinnen* 是荷兰语日常用语，指在刷卡机上用借记卡或信用卡付款。'
  nl.a1.unit07.lesson06.teach.opening:
    title: 问候并询问价格
    gloss: 摊贩：下午好。您想要什么？洛特：下午好。一公斤苹果多少钱？
    note: 这是顾客和摊贩之间友好而礼貌的对话。
  nl.a1.unit07.lesson06.teach.purchase:
    title: 选择数量
    gloss: 摊贩：每公斤两欧五十分。洛特：那我要一公斤，谢谢。
    note: 上一句已经说明是苹果，所以洛特可以自然地只说 *een kilo*。
  nl.a1.unit07.lesson06.teach.payment:
    title: 刷卡付款
    gloss: 摊贩：一共是两欧五十分。洛特：可以刷卡吗？摊贩：当然可以。
    note: '*Kan ik pinnen?* 是付款时常用的实用问句。'
  nl.a1.unit07.lesson06.teach.closing:
    title: 结束对话
    gloss: 洛特：谢谢。再见！摊贩：再见！
    note: '*Tot ziens* 适合用来结束这种礼貌的服务对话。'
