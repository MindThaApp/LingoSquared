teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词：*lezen*（阅读）、*sporten*（运动）和 *koken*（做饭）。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: 空闲时间
    gloss: 空闲时间
    note: '*De vrije tijd* 是用冠词 de 的名词：*de vrije tijd*。这是谈论爱好的关键短语。'
    example_gloss: 我空闲时喜欢阅读。
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Lees* 是 *lezen*（阅读）的第一人称单数形式。'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个爱好动词：*muziek luisteren*（听音乐）、*tekenen*（画画）和 *gamen*（玩电子游戏），后者是荷兰语中常用的外来词。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Luisteren naar*（听）后面带宾语时，总是要加 *naar*。'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Met vrienden*（和朋友一起）沿用了第1课中的 *vrienden*。'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个最基本的频率副词。*Vaak* 已在第5单元的 *Zie je hem vaak?* 中出现过；其余三个是新词。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Elke week* 和 *elk weekend* 都表示“每”，但形式随名词的性而变化——见下一张卡片。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke 与 elk
    gloss: 像 week 这样的 de 词用 elke；像 weekend 这样的 het 词用 elk。
    note: '*Week* 是 de 词（*de week*），所以用 *elke*；*weekend* 是 het 词（*het weekend*），所以用 *elk*——这与第23单元中 *de rekening* 和 *het wisselgeld* 背后的 de/het 搭配规律相同。'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: 洛特提起爱好
    gloss: 洛特：我们经常一起散步。不过奥马尔，你空闲时间还做些什么？
    note: '*We wandelen vaak samen* 呼应第13单元：洛特和奥马尔都说过喜欢 *wandelen*。'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: 奥马尔的爱好
    gloss: 奥马尔：我喜欢做饭，在家也做。我还经常运动。
    note: '*Ook thuis*（在家也做）说明奥马尔做饭是出于兴趣，不只是餐厅的工作。'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: 洛特很惊讶
    gloss: 洛特：你在家也做饭？你上班已经做了一整天饭了！
    note: '*Al de hele dag*（已经一整天）强调奥马尔在工作中已经做了很多饭。'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: 奥马尔的解释
    gloss: 奥马尔：是啊，不过我觉得做饭很放松。你呢，你喜欢做什么？
    note: '*Koken vind ik ontspannend* 把宾语 *koken* 提到句首以示强调——字面意思是“做饭，我觉得很放松”。'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: 洛特的爱好
    gloss: 洛特：我喜欢阅读，也经常听音乐。
    note: 用 *en*（和）把第1至2课的两个爱好动词连在一个句子里。
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: 奥马尔问起玩游戏
    gloss: 奥马尔：你也玩游戏吗？
    note: 一个用到第2课 *gamen* 的简短是非问句。
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: 洛特的回答
    gloss: 洛特：不，我从不玩游戏。不过我有时画画！
    note: 第3课的 *nooit*（从不）和 *soms*（有时）在同一个回答中形成对比。
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: 比较爱好
    gloss: 奥马尔和我经常一起散步。不过我们也有别的爱好。奥马尔喜欢做饭，在家也做，而且经常运动。我喜欢阅读，也经常听音乐。我有时画画，但从不玩游戏。你空闲时间喜欢做什么？
    note: 洛特的留言回顾了第4课的内容，并以本单元的核心问题向读者提问作结。
    glosses:
      wandelen: 散步
      vaak: 经常
      samen: 一起
      andere: 其他的
      kookt: 做饭
      graag: 喜欢
      thuis: 在家
      sport: 锻炼
      lees: 阅读
      luister: 听
      muziek: 音乐
      teken: 画画
      soms: 有时
      game: 玩电子游戏
      nooit: 从不
      vrije: 空闲的
      tijd: 时间
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: 奥马尔问周末的安排
    gloss: 奥马尔：这个周末你做什么？
    note: '*Dit weekend*（这个周末）沿用了第19单元的时间表达。'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: 洛特还没决定
    gloss: 洛特：我还不知道。我喜欢看书，但也想出去走走。
    note: '*Naar buiten*（出去，字面意思是“到外面”）是表示想出门的常见说法。'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar提出一个计划
    gloss: Omar：我们一起散步好吗？之后我给我们做饭。
    note: '*Daarna*（之后）沿用了第10单元 *eerst, dan, daarna* 中的顺序词。'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte表示同意
    gloss: Lotte：好主意！散步和做饭我都喜欢。
    note: '*Allebei*（两个都）表示Lotte同样喜欢这两件事，没有偏爱其中一件。'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar确认计划
    gloss: Omar：太好了。那星期六见！
    note: 一句友好的结束语，确认了 *zaterdag*（星期六）的计划。
