teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag:
    title: 星期一到星期三
    gloss: 星期一，星期二，星期三
    note: 荷兰语的星期名称通常以小写字母开头。
    example_gloss:
    - 今天是星期一。
    - 今天是星期二。
    - 今天是星期三。
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag:
    title: 星期四、星期五
    gloss: 星期四、星期五
    note: donderdag 和 vrijdag 接着星期的顺序往下排，同样用小写。
    example_gloss:
    - 今天是星期四。
    - 语言咖啡馆在星期五。
  nl.a1.unit03.lesson01.teach.zaterdag_zondag:
    title: 星期六、星期日
    gloss: 星期六、星期日
    note: zaterdag 和 zondag 是周末的两天。
    example_gloss:
    - 今天是星期六。
    - 今天是星期日。
  nl.a1.unit03.lesson01.teach.ask_day:
    title: 询问今天星期几
    gloss: 今天星期几？
    note: Welke dag ... 问的是星期几，而不是几号。
  nl.a1.unit03.lesson01.teach.today_wednesday:
    title: 说出今天是星期几
    gloss: 今天是星期三。
    note: 星期名称在句子中间仍然用小写。
  nl.a1.unit03.lesson01.teach.lowercase_days:
    title: 星期名称小写
    gloss: 星期名称通常不大写：星期一、星期五。
    note: 荷兰语的星期名称除了在句首，一般都用小写字母书写。
  nl.a1.unit03.lesson02.teach.jan_mar:
    title: 一月到三月
    gloss: 一月、二月、三月
    note: 荷兰语的月份名称通常以小写字母开头。
    example_gloss:
    - 我的生日在一月。
    - 我二月学习荷兰语。
    - 我的生日在三月。
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: 四月到六月
    gloss: 四月、五月、六月
    note: 荷兰语的 mei 是五月；juni 是六月。
    example_gloss:
    - 我四月学习荷兰语。
    - 我的生日在五月。
    - 我六月学习荷兰语。
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: 七月到九月
    gloss: 七月、八月、九月
    note: 荷兰语的 juli 和 juni 词尾的元音不同，注意区分。
    example_gloss:
    - 我的生日在七月。
    - 我八月学习荷兰语。
    - 我的生日在九月。
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: 十月到十二月
    gloss: 十月、十一月、十二月
    note: 荷兰语的 oktober 要用字母 k 拼写。
    example_gloss:
    - 我十月学习荷兰语。
    - 我的生日在十一月。
    - 我十二月学习荷兰语。
  nl.a1.unit03.lesson02.teach.year:
    title: 年
    gloss: 年
    note: jaar 指日历上的“年”。
    example_gloss: 我今年学习荷兰语。
  nl.a1.unit03.lesson02.teach.lowercase_months:
    title: 月份名称小写
    gloss: 月份名称通常不大写：四月、九月。
    note: 荷兰语的月份名称除了在句首，一律用小写字母书写。
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: 第一到第四
    gloss: 1–4：第一、第二、第三、第四
    note: eerste、tweede 和 derde 要直接记住；vierde 由 vier 构成。
    example_gloss:
    - 今天是4月1日。
    - 今天是4月2日。
    - 今天是4月3日。
    - 今天是4月4日。
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: 第五到第八
    gloss: 5–8：第五、第六、第七、第八
    note: 这几个日期的说法是 vijfde、zesde、zevende 和 achtste。
    example_gloss:
    - 今天是4月5日。
    - 今天是4月6日。
    - 今天是4月7日。
    - 今天是2026年4月8日。
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: 第九到第十二
    gloss: 9–12：第九、第十、第十一、第十二
    note: 这些形式涵盖了本单元后面会用到的月初日期。
    example_gloss:
    - 今天是4月9日。
    - 今天是4月10日。
    - 今天是4月11日。
    - 今天是4月12日。
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: 第十三到第十九
    gloss: 13–19：第十三、第十四、第十五、第十六、第十七、第十八、第十九
    note: 这些写成文字的日期序数词以 -de 结尾。
    example_gloss:
    - 今天是4月13日。
    - 今天是4月14日。
    - 今天是4月15日。
    - 今天是4月16日。
    - 今天是4月17日。
    - 今天是4月18日。
    - 今天是4月19日。
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: 第二十到第二十四
    gloss: 20–24：第二十、第二十一、第二十二、第二十三、第二十四
    note: 从 twintig 起，这些序数词以 -ste 结尾，并且连写成一个词。
    example_gloss:
    - 今天是4月20日。
    - 这本书必须在4月21日还回去。
    - 今天是4月22日。
    - 今天是4月23日。
    - 今天是4月24日。
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth:
    title: 第二十五到第二十九
    gloss: 25–29：第二十五、第二十六、第二十七、第二十八、第二十九
    note: 这些复合序数词以 -ste 结尾，并且连写成一个词。
    example_gloss:
    - 今天是4月25日。
    - 今天是4月26日。
    - 今天是4月27日。
    - 今天是4月28日。
    - 今天是4月29日。
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: 第三十和第三十一
    gloss: 30–31：第三十、第三十一
    note: 这是一个月中最后两个可能出现的日期数字。
    example_gloss:
    - 今天是4月30日。
    - 今天是12月31日。
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: 用序数词说日期
    gloss: 4月3日——四月三号
    note: 本单元示范在把日期的数字完整读出来时使用序数词；荷兰语把“日”放在“月”前面，与汉语“月—日”的顺序相反。
  nl.a1.unit03.lesson03.teach.on_date:
    title: 在某一天
    gloss: 在4月3日——在四月三号
    note: 日期用数字书写时，说 op 3 april；序数词写成文字时，说 op de derde april。
  nl.a1.unit03.lesson04.teach.ask_date:
    title: 询问日历上的日期
    gloss: 今天几月几号？
    note: Welke datum ... 明确询问的是日历上的日期。
  nl.a1.unit03.lesson04.teach.ask_which_date:
    title: 询问今天是几号
    gloss: 今天几号？
    note: De hoeveelste ... 是口语中询问几号的常见说法。
  nl.a1.unit03.lesson04.teach.date_answer:
    title: 说出完整的日期
    gloss: 今天是2026年4月3日。
    note: 荷兰语的日期顺序是日—月—年，与汉语的年—月—日正好相反，而且 april 用小写。
  nl.a1.unit03.lesson04.teach.date_words:
    title: 用序数词说出日期
    gloss: 今天是4月3日。
    note: 写成文字的序数词前面要加 de：de derde april。
  nl.a1.unit03.lesson04.teach.written_order:
    title: 日—月—年的顺序
    gloss: 日—月—年：2026年4月3日，或写作 3-4-2026
    note: 数字写法不是美式的月—日—年：3-4-2026 表示2026年4月3日。
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: 星期和日期一起说
    gloss: 今天是4月10日，星期五。
    note: vrijdag 和 april 在句子中间都用小写。2026年4月10日确实是星期五。
  nl.a1.unit03.lesson05.teach.when:
    title: 什么时候
    gloss: 什么时候
    note: Wanneer 用来询问某事在什么时间或哪一天发生。
    example_gloss: 语言咖啡馆什么时候开？
  nl.a1.unit03.lesson05.teach.book:
    title: 书
    gloss: 书
    note: 这里的 Boek 指的是图书馆借的书。
    example_gloss: 我有这本书。
  nl.a1.unit03.lesson05.teach.due_date:
    title: 到期日
    gloss: 到期日
    note: inleverdatum 指的是必须归还东西的最后日期。
    example_gloss: 这本书的到期日是什么时候?
  nl.a1.unit03.lesson05.teach.ask_due:
    title: 询问书什么时候到期
    gloss: 这本书什么时候要还?
    note: Moet ... terug 是询问借来的东西何时必须归还的一种自然又简单的说法。
  nl.a1.unit03.lesson05.teach.due_answer:
    title: 说出到期日
    gloss: 4月21日。
    note: 简短的回答用 op 加日期数字和小写的月份。
  nl.a1.unit03.lesson05.teach.due_words:
    title: 用文字说出到期日
    gloss: 这本书必须在4月21日归还。
    note: 当序数词用文字写出时,op 后面要加 de。
  nl.a1.unit03.lesson05.teach.label:
    title: 读懂到期日标签
    gloss: 到期日:2026年4月21日
    note: 这种数字标签按日—月—年的顺序书写。
  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: Lotte 询问星期几
    gloss: Lotte:今天星期几?Omar:星期三。
    note: 回答要说出星期几。
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: Lotte 询问日期
    gloss: Lotte:那今天几号?Omar:2026年4月8日。
    note: 荷兰语口语回答中日期用序数词 de achtste;2026年4月8日确实是星期三,与上一句相符。
  nl.a1.unit03.lesson06.teach.next:
    title: 下一个
    gloss: 下一个的
    note: volgende 用来指接下来的那一次。
    example_gloss: 下一次语言咖啡馆是什么时候?
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: 询问下次聚会的日期
    gloss: Lotte:下一次语言咖啡馆是什么时候?Omar:4月10日,星期五。
    note: 回答由 op、小写的星期、日期数字和小写的月份组成。2026年4月10日确实是星期五,比8日晚两天。
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: 结束对话
    gloss: Lotte:好的,星期五见!Omar:到时见!
    note: Tot vrijdag 说出了下次见面的那一天。
