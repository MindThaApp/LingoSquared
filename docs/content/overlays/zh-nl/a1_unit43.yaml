    title: Ik vind 句型
    gloss: '*Ik vind* + 季节 + 特点，表示你对某个季节的看法：我喜欢夏天。'
    note: 这里再次用到已学过的 *Ik vind X Y* 表达看法的句型（Ik vind koffie lekker，Ik vind Fenna nieuwsgierig），没有新语法，只是新的用法。主语是 *Ik*（第一人称），所以 *vind* 不加 -t；疑问句 *Welk seizoen vind jij mooi?* 中 *jij* 位于动词之后（倒装），vind 同样不加 -t。第三人称形式 *vindt*（如 *Omar vindt ...*）是之后才会学的另一个语法点，目前还没有教。
