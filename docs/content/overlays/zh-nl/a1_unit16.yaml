teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: 觉得不舒服
    gloss: 我感觉不舒服。
    note: '*Voelen* 在这里是反身动词（*je*/*me voelen*）；*niet lekker* 是表示不太对劲的一般、委婉说法。'
  nl.a1.unit16.lesson01.teach.ziek:
    title: 生病
    gloss: 生病的
    note: 基本形容词，与 *zijn*（是）连用。
    example_gloss: 我生病了。
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: 生病了
    gloss: 我生病了。
    note: '*Ziek* 比 *niet lekker* 表示更笼统、更严重的状态。'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: 头疼
    gloss: 头疼
    note: 跟在 *hebben* 后面不用冠词：*Ik heb hoofdpijn*，而不是 *Ik heb een hoofdpijn*。
    example_gloss: 我头痛。
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: 头疼
    gloss: 我头痛。
    note: 荷兰语中，表示症状通常与 *hebben*（有）连用，症状名词前不加冠词。
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: 胃痛
    gloss: 胃痛
    note: 与 *hoofdpijn* 一样不用冠词。
    example_gloss: 我胃痛。
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: 胃痛
    gloss: 我胃痛。
    note: 与 *hoofdpijn* 一样使用 *hebben* 句型。
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: 一般性的询问
    gloss: 你怎么了？
    note: 这是询问是否出了什么问题的通用说法。
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: 常用习惯说法
    gloss: 你怎么了?
    note: '*Scheelt eraan* 是固定习语（字面意思接近“它缺了什么”）；不要逐字翻译。'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: 喉咙痛
    gloss: 喉咙痛
    note: 与 *hoofdpijn*/*buikpijn* 一样不用冠词。
    example_gloss: 我喉咙痛。
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: 喉咙痛
    gloss: 我喉咙痛。
    note: 与其他症状一样使用 *hebben* 句型。
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: 关心某人
    gloss: 你还好吗?不,我觉得不舒服。
    note: '*Gaat het?* 是朋友之间很常见、很随意的关心问句。'
  nl.a1.unit16.lesson03.teach.koorts:
    title: 发烧
    gloss: 发烧
    note: 和其他症状一样，跟在 *hebben* 后面不用冠词。
    example_gloss: 我发烧了。
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: 发烧
    gloss: 我发烧了。
    note: 使用 *hebben* 句型。
  nl.a1.unit16.lesson03.teach.verkouden:
    title: 感冒
    gloss: 感冒了
    note: 这是与 *zijn* 连用的形容词，不是与 *hebben* 连用的名词——这是常见的易错点。
    example_gloss: 请翻译成中文:Estoy resfriado
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: 说自己感冒了
    gloss: 请翻译成中文:Estoy resfriado
    note: 荷兰语用 *zijn* + *verkouden*（相当于“感冒了”），不能说 *Ik heb een verkouden*。
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: 用 zijn 还是 hebben，取决于词类，而不是持续时间
    gloss: Ziek 和 verkouden 是形容词，用 zijn：我病了，我感冒了。Koorts 和 hoofdpijn 是名词，用 hebben。
    note: 选择 *zijn* 还是 *hebben*，取决于词类（形容词还是表示症状的名词），而不是状况持续的时间长短——*koorts*（名词）和 *verkouden*（形容词）同样是暂时的，但 koorts 仍然用 *hebben*，而不是 *zijn*。
  nl.a1.unit16.lesson04.teach.apotheek:
    title: 药店
    gloss: 药店
    note: 通性名词：*de apotheek*。
    example_gloss: 我去药店。
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: 药剂师的问候
    gloss: 您需要什么?
    note: '*Waarmee kan ik u helpen?* 是标准的正式服务问候语，延续了第1单元和第15单元礼貌称呼课中的 *u* 语体。'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: 为某种症状求药
    gloss: 您有治头痛的药吗？
    note: '*Iets tegen* + 症状是询问药品的自然说法。'
  nl.a1.unit16.lesson04.teach.tablet:
    title: 一片药
    gloss: 药片
    note: 中性名词：*het tablet*，不过这里是泛指，所以说 *een tablet*。
    example_gloss: 我吃一片药。
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: 用药说明
    gloss: 一天吃两次,每次一片。
    note: '*Neem* 是 *nemen*（拿，服用）的命令式，用于给出指示。'
  nl.a1.unit16.lesson04.teach.register_note:
    title: 在药店使用的称呼
    gloss: 在药店要使用礼貌形式 u。
    note: 药剂师是不熟悉的服务行业成年人，礼貌规则与第15单元的售票窗口相同。
  nl.a1.unit16.lesson05.teach.advies:
    title: 阅读药店的建议
    gloss: 建议:一天吃两次药片,每次一片,用水送服。好好休息,多喝水。三天后还是觉得不舒服吗?那就去看医生。
    note: 请留意用药剂量、两条药物之外的建议,以及什么时候该去看医生。
    glosses:
      Advies: 建议
      neem: 服用
      keer: 次
      dag: 天
      tablet: 药片
      Rust: 休息
      drink: 喝
      Voel: 感觉
      steeds: 仍然
      lekker: 好地
      huisarts: 医生
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte 来问候
    gloss: Lotte：嗨，Omar，你好吗？感觉好些了吗？
    note: '*Al*（已经）表示 Lotte 在问 Omar 自上次交谈以来是否好转了。'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar 仍然不舒服
    gloss: Omar：还不是很好。我还是头痛，而且很累。
    note: '*Nog steeds*（仍然）表示之前的头痛还没有好；*moe*（累）是一个新的实用形容词。'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte 问起吃药的事
    gloss: Lotte：你吃药了吗？
    note: '*Genomen* 是 *nemen* 的过去分词，用的是第12单元学过的 *heb* + 过去分词结构。'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar 确认
    gloss: Omar：吃了，我吃了一片药。我现在去休息。
    note: '*Ga nu rusten*（现在去休息）使用的是 *gaan* + 不定式的近将来结构。'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte 祝他早日康复
    gloss: Lotte：好主意。好好休息。早日康复！
    note: '*Beterschap!* 是祝人早日康复的标准固定说法。'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar 道别
    gloss: Omar：谢谢，明天见！
    note: '*Tot morgen!* 沿用了前面单元告别语中的 *tot* + 时间结构。'
