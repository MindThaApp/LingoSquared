teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: 开心、伤心和生气
    gloss: 开心，伤心，生气
    note: 三个常用的基本情绪词，与 zijn（是）连用来描述自己的感受。
    example_gloss:
    - 我很开心。
    - 我很伤心。
    - 我很生气。
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: 表达你很开心
    gloss: 我很开心。
    note: 荷兰语表达感受时，形容词前必须有动词 *Zijn*（是）：Ik ben ...。
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: 对比不同的感受
    gloss: 我没有生气，我很难过。
    note: '*Niet* 直接否定 *boos*；第二个分句再说出真正的感受。'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: 询问原因
    gloss: 你为什么开心？
    note: '*Waarom*（为什么）是询问原因的标准疑问词。'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: 说明原因
    gloss: 我很开心，因为我有了新公寓。
    note: '*Omdat*（因为）引出原因从句；动词移到从句末尾（*heb* 移到 *appartement* 之后）。'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: 消极的原因
    gloss: 我很难过，因为在下雨。
    note: 原因从句沿用了天气单元的 *regent*（下雨）。
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: 紧张
    gloss: 紧张
    note: 表示紧张的标准词。
    example_gloss: 我对第一次上班感到紧张。
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: 说明你为什么紧张
    gloss: 我对第一次上班感到紧张。
    note: '*Voor*（字面意思是“为了”）引出紧张的对象，相当于汉语的“对……感到紧张”。'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: 安慰别人
    gloss: 别担心。
    note: '*Maak je geen zorgen*（字面意思是“不要给自己制造忧虑”）是固定的安慰用语。'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: 询问别人的感受
    gloss: Omar 感觉如何？
    note: '*Voelen zich*（感觉，反身动词）是询问或描述情绪状态的标准说法，不同于第16单元健康课中表示身体感觉的 *voelen*。'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: 描述别人的感受
    gloss: 他感到紧张。
    note: '*Zich*（他自己）是第三人称反身代词，与 *voelt* 搭配。'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: 询问别人为什么有某种感受
    gloss: 他为什么感到紧张？
    note: 把 *waarom* 与 *Hij voelt zich zenuwachtig* 中的 *voelt zich* 结构结合在一起。
  nl.a1.unit21.lesson05.teach.bericht:
    title: 阅读一条关于感受的消息
    gloss: 嗨，Lotte，我对第一次独自上班有点紧张。但我也很开心，因为我有了新工作和新公寓。我想会没事的。
    note: 注意写信的人对什么感到紧张、什么让他高兴，以及他总体的看法。
    glosses:
      beetje: 有点
      zenuwachtig: 紧张
      eerste: 第一个
      dienst: 班次
      alleen: 独自
      blij: 高兴的
      want: 因为
      nieuwe: 新的
      baan: 工作
      nieuw: 新的
      appartement: 公寓
      denk: 认为
      komt: 会顺利
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte 问 Omar 感觉如何
    gloss: Lotte：嗨，Omar，你对第一个班感觉怎么样？
    note: '*Voor je eerste dienst*（对于你的第一个班）沿用了第3课的 *voor* + 名词结构。'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar 承认自己紧张
    gloss: Omar：说实话，我有点紧张。
    note: '*Eerlijk gezegd*（说实话）让这个坦白听起来更委婉。'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte 安慰他
    gloss: Lotte：别担心，你可以的！
    note: '*Je kunt het goed*（字面意思是“你能把它做好”）是一句鼓励人的固定表达。'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar 向她道谢
    gloss: Omar：谢谢你，这真的有帮助。
    note: '*Helpt* 是 *helpen*（帮助）的第三人称形式。'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte 预测结果
    gloss: Lotte：之后你肯定会非常开心，也非常自豪。
    note: '*Vast*（肯定、想必）表示有把握的预测；*trots*（自豪）是一个有用的新形容词。'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar 表示同意
    gloss: Omar：是的，我也这么想。
    note: '*Dat denk ik ook*（字面意思是“这个我也想”）是表示赞同别人看法的自然说法。'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: 用 is、zijn 和 hem 来概括
    gloss: Omar 对他的第一次上班感到紧张。Lotte 帮助他。
    note: '*Is* 是 *zijn*（是）的第三人称形式；这里的 *zijn* 意思是“他的”；*hem* 意思是“他”，用作宾语——这是谈论别人时三个很小却必不可少的词。'
