  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: '*Geen* 否定不定名词 *een huisdier* —— 见语法说明。'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: Geen：否定不定名词
    gloss: Geen用来否定不定名词，例如你已经学过的 Ik heb geen tijd，以及这里的 Ik heb geen huisdier。
    note: 这里沿用之前教过的 *Ik heb geen tijd* 中 *geen* 的用法——不是新语法，只是换了一个新名词。
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: 遛（动物）
