  nl.a1.unit31.lesson05.teach.tekst:
    title: Omar、Fenna和Sander谈动物
    gloss: Omar和Fenna都喜爱动物，但两个人都没有宠物。Omar喜爱狗，Fenna喜爱猫。Sander倒是有宠物：一只猫。他经常和他的猫玩，每天给猫喂食。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      houden: 喜爱
      allebei: 两者都
      dieren: 动物
      beiden: 两者都
      huisdier: 宠物
      honden: 狗
      katten: 猫
      kat: 猫
      speelt: 玩
      geeft: 给
      elke: 每一
      eten: 食物
