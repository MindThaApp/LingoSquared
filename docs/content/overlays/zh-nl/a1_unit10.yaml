teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: 起床
    gloss: 起床 → 我起床
    note: '*Opstaan* 在主句中会分开：*Ik sta op*。前缀 *op* 移到句末。'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: 穿衣服
    gloss: 穿衣服 → 我穿衣服
    note: '*Zich aankleden* 是反身动词，也是可分动词。主语是 *ik* 时用 *me*，并把 *aan* 移到句末：*Ik kleed me aan*。'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: 吃早餐
    gloss: 吃早餐 → 我吃早餐
    note: '*Ontbijten* 不分开：*Ik ontbijt*。'
  nl.a1.unit10.lesson01.teach.werken:
    title: 工作
    gloss: 工作 → 我工作
    note: '*Werken* 不分开：*Ik werk*。'
  nl.a1.unit10.lesson01.teach.eten:
    title: 吃
    gloss: 吃 → 我吃
    note: '*eten* 的 *ik* 形式是 *eet*：*Ik eet*。'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: 洗碗
    gloss: 洗碗 → 我洗碗
    note: '*Afwassen* 会分开：*Ik was af*。前缀 *af* 移到句末。'
  nl.a1.unit10.lesson01.teach.slapen:
    title: 睡觉
    gloss: 睡觉 → 我睡觉
    note: '*Slapen* 不分开。它的 *ik* 形式是长元音：*Ik slaap*。'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: 分开的规则
    gloss: 在普通的主句中，动词的前一部分移到句末：opstaan → Ik sta op。
    note: 不要说 *Ik opsta*。要把主要动词变位，再把短前缀放在主句的末尾。
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: 句中的 Opstaan
    gloss: 起床：我七点起床。
    note: 时间表达放在 *sta* 和句末的前缀 *op* 之间。
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: 句中的 Aankleden
    gloss: 穿衣服：我穿衣服。
    note: 句型是 *Ik* + *kleed* + *me* + *aan*。*Aan* 留在句末。
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: 句中的 Afwassen
    gloss: 洗碗：我吃完饭后洗碗。
    note: '*Na het eten* 放在 *was* 和句末的前缀 *af* 之间。'
  nl.a1.unit10.lesson02.teach.contrast:
    title: 不会分开的动词
    gloss: 不可分：我吃早餐。我工作。我睡觉。句末没有任何附加部分。
    note: 在这些主句中，*Ontbijten*、*werken* 和 *slapen* 保持为一个完整的动词形式。
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: 七点半起床
    gloss: 我七点半起床。
    note: 请记住荷兰语的钟点说法：*half acht* 指“差半小时到八点”，即 7:30。*Op* 仍在句末。
  nl.a1.unit10.lesson03.teach.dress_time:
    title: 七点四十五分穿衣服
    gloss: 我七点四十五分穿衣服。
    note: 时间放在句末的可分前缀 *aan* 之前。
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: 八点吃早餐
    gloss: 我八点吃早餐。
    note: 时间前面用 *om*。*Ontbijt* 不分开。
  nl.a1.unit10.lesson03.teach.work_time:
    title: 从九点工作到五点
    gloss: 我从九点工作到五点。
    note: '*Van ... tot ...* 表示开始和结束的时间。'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: 六点半吃饭
    gloss: 我下午六点半吃饭。
    note: '*''s Avonds* 明确指出是晚上，所以这里的 *half zeven* 是 18:30。'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: 十一点睡觉
    gloss: 我十一点睡觉。
    note: 时间前面用 *om*：*om elf uur*。
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: 首先、然后、之后
    gloss: 首先、然后、之后
    note: '*Eerst* 表示第一个活动，*dan* 转到下一个，*daarna* 承接前面发生的事。'
    example_gloss:
    - 首先我起床。
    - 然后我穿衣服。
    - 之后我吃早餐。
  nl.a1.unit10.lesson04.teach.sequence:
    title: 早晨的三个步骤
    gloss: 首先我起床。然后我穿衣服。之后我吃早餐。
    note: 可分前缀仍然放在分句末尾：*sta ik op*；*kleed ik me aan*。
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: 动词在 ik 之前
    gloss: 在 eerst、dan 和 daarna 之后，动词放在 ik 之前：Daarna ontbijt ik。
    note: 以顺序词开头，*Ik ontbijt* 就变成 *Daarna ontbijt ik*。
  nl.a1.unit10.lesson05.teach.routine_text:
    title: 我的一天
    gloss: 我的一天——我七点半起床。之后我穿衣服，八点吃早餐。我从九点工作到五点。下午六点半我吃饭。之后我洗碗。十一点我睡觉。
    note: 阅读时既要注意活动的先后顺序，也要注意时间。留意可分动词分句末尾的 *op*、*aan* 和 *af*。
    glosses:
      Mijn: 我的
      dag: 天
      sta: 起床（与 op 连用）
      half: 差半小时到下一个整点（half acht = 7:30）
      acht: 八
      Daarna: 之后
      kleed: 穿衣服（与 me ... aan 连用）
      uur: 点钟／小时
      ontbijt: 吃早餐
      werk: 工作
      negen: 九
      vijf: 五
      zeven: 七
      avonds: 在傍晚
      eet: 吃饭
      was: 洗碗（与 af 连用）
      elf: 十一
      slaap: 睡觉
  nl.a1.unit10.lesson06.teach.question:
    title: 询问一天的安排
    gloss: Lotte：Omar，你的一天是怎么过的？
    note: '*Hoe ziet jouw dag eruit?* 是邀请别人讲述自己一天的非正式说法。*Eruitzien* 是可分动词：*ziet ... eruit*。'
  nl.a1.unit10.lesson06.teach.morning:
    title: Omar 的早晨
    gloss: Omar：我七点半起床。然后穿衣服，八点吃早餐。
    note: Omar 把三项早晨的活动连在一起，并把 *op* 和 *aan* 留在各分句的末尾。
  nl.a1.unit10.lesson06.teach.work:
    title: Omar 的工作日
    gloss: Lotte：你什么时候工作？Omar：我从九点工作到五点。
    note: Lotte 和 Omar 彼此使用非正式的 *je*。
  nl.a1.unit10.lesson06.teach.evening:
    title: Omar 的晚上
    gloss: Omar：晚上六点半我吃饭。然后我洗碗。十一点我睡觉。
    note: 以时间或 *daarna* 开头时，动词放在 *ik* 之前：*eet ik*、*was ik*、*slaap ik*。*Af* 仍留在句末。
  nl.a1.unit10.lesson06.teach.lotte:
    title: Lotte 的早晨
    gloss: Lotte：我六点起床，但要到六点半才吃早餐。
    note: 这里的 *Pas* 是“直到……才”的意思。Lotte 对比了她的起床时间和吃早餐的时间。
