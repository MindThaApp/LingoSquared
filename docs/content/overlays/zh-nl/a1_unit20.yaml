teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: 大衣、毛衣
    gloss: 大衣、毛衣
    note: '*De jas* 和 *de trui* 都是通性名词。'
    example_gloss:
    - 我在找一件大衣。
    - 我有一件毛衣。
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: 裤子、鞋子
    gloss: 裤子、鞋子
    note: '*Broek* 指一条裤子，用单数：一条裤子是 *een broek*，不说 *broeken*。*Schoenen* 是 *schoen* 的复数；谈到鞋子时几乎总是用复数。'
    example_gloss:
    - 我在找一条裤子。
    - 我在找鞋子。
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: 说出你在找什么
    gloss: 我在找一件大衣。
    note: '*Zoeken*（寻找）后面直接接宾语，不加介词。（也有 *zoeken naar* 的说法，但直接接宾语是最简单的句型。）'
  nl.a1.unit20.lesson02.teach.maat:
    title: 尺码
    gloss: 尺码
    note: 通性名词：*de maat*。
    example_gloss: 您穿多大尺码？
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: 询问尺码
    gloss: 你穿什么尺码？
    note: 这里用 *Welke*（哪一个），是因为 *maat* 的可能答案很有限（S、M、L 或某个数字）。
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: 说出自己的尺码
    gloss: 我穿M码。
    note: 这里用 *Hebben*（有），说“我有M码”，而不是用“是”或“穿”。
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: 黑色，蓝色
    gloss: 黑色，蓝色
    note: 本课的两个基本颜色形容词。
    example_gloss:
    - 我要黑色的大衣。
    - 这件你们还有蓝色的吗？
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: 指定颜色
    gloss: 我要黑色的大衣。
    note: 订购或询问衣服颜色时，标准说法是 *In het* + 颜色。
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: 询问其他颜色
    gloss: 这件你们还有蓝色的吗？
    note: '*Ook*（也）用来询问有没有其他颜色，这里用的是正式的 *u*。'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: 询问是否合身
    gloss: 这件大衣你穿合身吗？
    note: '*Passen*（合身）是描述衣服合不合身的自然动词，不同于表示“试穿”的 *passen*。'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: 表示很合身
    gloss: 很合身。
    note: '*Goed*（好）描述衣服合身的程度。'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: 太小
    gloss: 太小了。
    note: '*Te*（太）放在形容词前，表示过度。'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: 太大
    gloss: 太大了。
    note: 与上一张卡片 *te klein* 的 *te* + 形容词结构相同。
  nl.a1.unit20.lesson05.teach.negentig:
    title: 九十
    gloss: 九十
    note: '*Negentig* 是数字90，这里用在外套的价格里。'
    example_gloss: 这件大衣九十欧元。
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: 说出价格
    gloss: 这件大衣九十欧元。
    note: '*Kost* 是 *kosten*（价格为）的第三人称单数形式。'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: 阅读商店小票
    gloss: 冬季大衣：M码，黑色。价格：九十欧元。这件大衣很合身，而且很暖和。
    note: 注意找出尺码、颜色、价格，以及大衣的两个优点。
    glosses:
      Winterjas: 冬季大衣
      maat: 尺码
      kleur: 颜色
      zwart: 黑色
      Prijs: 票价
      negentig: 九十
      euro: 欧元
      jas: 大衣
      past: 合身
      warm: 温暖的
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotte 注意到那件外套
    gloss: Lotte：这件外套真好看！你穿什么尺码？
    note: '*Mooi*（好看）是一般的正面反应，前面的单元用过。'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omar 请求试穿
    gloss: Omar：我穿M码。我可以试穿吗？
    note: '*Mag ik ...?*（我可以……吗？）是礼貌地请求许可的标准说法；这里的 *passen* 是“试穿”，不是“合身”。'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotte 问合不合身
    gloss: Lotte：当然可以。合身吗？
    note: '*Hij*（他／它）指代 *de jas*，这是一个通性名词。'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omar 确认
    gloss: Omar：是的，很合身，而且很暖和。
    note: 与前面阅读的小票完全一致——这是同一件大衣。
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotte 问颜色
    gloss: Lotte：太好了！你想要黑色的还是蓝色的？
    note: '*Wil je... of...?* 沿用了第13单元偏好课中提供选择的句型。'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omar 做决定
    gloss: Omar：我要黑色的。
    note: '*Nemen*（拿）是确定购买选择时的自然动词，与收据上写明的颜色相符。'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem 与 neemt
    gloss: Neem 是 nemen（拿）的第一人称单数形式；neemt 是第三人称单数形式（hij、zij）。
    note: 规则的现在时变位：*ik neem, jij/hij/zij neemt*。
