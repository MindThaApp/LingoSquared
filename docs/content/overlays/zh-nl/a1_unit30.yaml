teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Lang* 形容个子高的人；*klein* 形容个子矮的人（本课程其他地方也用同一个词形容小的物体）。'
    example_gloss:
    - Fenna个子高。
    - Sander个子矮。
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: 这里的 *oud* 和 *jong* 描述的是大致的外貌印象，而不是确切的年龄。
    example_gloss:
    - 爷爷年纪大了。
    - Omar很年轻。
  nl.a1.unit30.lesson01.teach.oud_note:
    title: Oud：确切的数字还是大致的印象
    gloss: Oud 可以表示确切的年数，如 Hoe oud ben je?，也可以表示没有具体数字的大致印象，如 Opa is oud。
    note: 你已经在询问确切年龄时学过 *oud*（*Hoe oud ben je?*）。这里它描述的是一个人看起来有多老，不带具体数字。
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna个子高，Sander个子矮
    gloss: Fenna个子高，Sander个子矮。
    note: 一个用 *en*（和）连接的简单合并句，为第5课的直接比较做铺垫。
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: 头发
    gloss: 头发
    note: '*Haar* 是 het 词：*het haar*。'
    example_gloss: Omar留着黑色短发。
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色。*Zwart*(黑色)之前在衣服单元学过，这里用来形容头发。
    example_gloss:
    - Lotte 是金发。
    - Sander 是棕色头发。
    - 爷爷头发灰白。
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Lang*(长)与第1课表示身高的词相同，这里用来形容头发的长度。*Kort*(短)是本课的新词。'
    example_gloss:
    - Fenna 留着长发。
    - Sander 留着短发。
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar 前的形容词不加词尾
    gloss: Haar 是 het 词，前面没有冠词，所以形容词保持原形：kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar。
    note: 在这种不定、无冠词的结构里，*haar* 前的形容词不加 -e。请与第3课的 *ogen* 对比，后者要加 -e。
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: Haar：两个意思
    gloss: Haar 有两个意思：“头发”（本课的新名词）和“她的”（第5单元学过的物主词，如 haar moeder）。具体是哪个意思，要看上下文。
    note: 这是荷兰语真正的同形词：名词 *haar*（头发）和物主词 *haar*（她的）拼写完全相同，而汉语里是“头发”和“她的”两个不同的词。句子的其余部分总能说明是哪个意思。
    target_text: Haar 有两个意思：“头发”（本课的新名词）和“她的”（物主词，如 haar moeder）。要根据上下文来判断是哪个意思。
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar 留着黑色短发
    gloss: Omar留着黑色短发。
    note: 这里再次用到第20单元衣服主题中的 *zwart*（黑色）。
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte 留着金色长发
    gloss: Lotte留着金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: 眼睛
    gloss: 眼睛
    note: '*Ogen* 是 *het oog* 的复数；复数一律用 *de*。'
    example_gloss: Omar 有一双棕色的眼睛。
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: '*Blauw*（蓝色）之前在衣服单元学过；*bruin*（棕色）刚在第2课学过，用于头发；*groen*（绿色）是本课的新词。'
    example_gloss:
    - Lotte有蓝色的眼睛。
    - Sander有棕色的眼睛。
    - Fenna有绿色的眼睛。
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen 要加 -e
    gloss: ogen（复数）前的形容词要多加一个 -e：blauwe ogen, bruine ogen, groene ogen。
    note: 请与第2课的 *haar* 对比，后者的形容词保持原形。复数名词前的形容词一律加 -e，不论是 de 词还是 het 词。
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Lotte长什么样？
    gloss: Lotte长什么样？
    note: '*Hoe ziet ... eruit?* 是本单元的核心问句，可以用来询问任何人的外貌。'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte 留着金色长发，有一双蓝眼睛
    gloss: Lotte 留着金色长发，有一双蓝眼睛。
    note: 这是一个范例回答，用 *en* 把头发和眼睛合在一句话里。
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte 介绍 Nina
    gloss: Lotte：有一个新来的女孩要来语言咖啡馆。她叫 Nina。
    note: '*Er komt*（来了／要来）用来引出场景中新出现的人。'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar 问她长什么样
    gloss: Omar：好啊！她长什么样？
    note: 这里再次用到本单元的核心问句，只是把名字换成了 *ze*（她）。
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte 描述 Nina 的身高和头发
    gloss: Lotte：她个子小，留着金色短发。
    note: 把第1课的 *klein* 与第2课的头发词汇结合在一起。
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar 问她的眼睛
    gloss: Omar：那她的眼睛呢？
    note: 这里的 *haar* 是“她的”（第5单元学过的物主词），不是“头发”。请参见第2课关于同形词的说明。
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte 描述 Nina 的眼睛
    gloss: Lotte：她有一双绿眼睛。
    note: 再次用到第3课的 *groene ogen*。
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar 能认出她
    gloss: Omar：谢谢！那我肯定能认出她。
    note: '*Herken ik haar wel*，意思是“我肯定能认出她”。这里的 *haar* 同样是代词“她”，不是“头发”。'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: 比较Sander和Fenna
    gloss: Sander 和 Fenna 是兄妹，但他们长得不一样。Sander 个子矮，留着棕色短发，有一双棕色的眼睛。Fenna 比 Sander 高，留着棕色长发，有一双绿眼睛。你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      broer: 兄弟
      zus: 姐妹
      zien: 看起来
      anders: 不同的
      klein: 矮的
      kort: 矮的
      bruin: 棕色的
      haar: 头发
      bruine: 棕色的
      ogen: 眼睛
      langer: 更高的
      lang: 长的
      groene: 绿色的
      eruit: （“eruit zien”的一部分，意思是“看起来”）
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: 再次使用比较结构
    gloss: 这个结构你在比较句里已经学过：形容词加 er 再加 dan。这里用来比较人：Fenna is langer dan Sander。（Fenna 比 Sander 高。）
    note: 这与第14单元背包购物中学过的 *形容词 + -er + dan* 句型完全相同，现在用来描述人，而不是物品。
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna 的头发比 Sander 的长
    gloss: Fenna 的头发比 Sander 的长。
    note: '*Langer* 在 *haar*（het 词）前保持原形，与第2课讲的规则相同，比较级也一样。'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 这是一个用 *Ik heb ...* 的第一人称范例句，描述自己的外貌时可以直接套用。
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar 看到了 Nina
    gloss: Omar：看，那是 Nina 吗？她留着金色短发，有一双绿眼睛。
    note: '*Kijk*（看）在第14单元的对话里也是这样用的。'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte 确认
    gloss: Lotte：对，那就是 Nina！
    note: 这是一个简短自然的肯定回答。
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina 向 Omar 打招呼
    gloss: Nina：嗨，你是 Omar 吗？
    note: 一个简单的非正式问候问句：*ben jij ...?*
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar 回应 Nina
    gloss: Omar：对！很高兴认识你，Nina。
    note: '*Leuk je te ontmoeten* 是初次见面的标准说法（见第1单元）；*leuk je te zien* 则用于已经认识的人。'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话结束：Omar 根据 Lotte 之前的描述，成功认出了 Nina。
