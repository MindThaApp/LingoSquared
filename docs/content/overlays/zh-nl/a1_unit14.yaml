teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: 比较级的构成
    gloss: 做比较时，通常在形容词后加 -er，并使用 dan。
    note: '*Dan* 相当于汉语的“比”，但位置不同：它总是放在比较级形容词之后，引出比较的对象。'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: 大，小
    gloss: 大，小
    note: '*Groot* 和 *klein* 是基本形容词，还没有加 -er。'
    example_gloss:
    - 这个背包很大。
    - 这个手提包很小。
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: 背包更大
    gloss: 背包比手提包大。
    note: '*Groter* 是 *groot* + *er*；*dan* 引出被比较的第二个对象。'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: 手提包更小
    gloss: 手提包比背包小。
    note: '*Kleiner* 是 *klein* + *er*，规则相同。'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: 背包的价格
    gloss: 这个背包四十五欧元。
    note: '*Kost* 是 *kosten*（价钱为）的第三人称单数形式。'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: 手提包的价格
    gloss: 这个手提包二十欧元。
    note: 价格比背包低，为接下来的比较做铺垫。
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: 贵、便宜
    gloss: 贵，便宜
    note: '*Duur* 和 *goedkoop* 是基本形容词，还没有加 *-der*／*-er*。'
    example_gloss:
    - 这个背包很贵。
    - 这个手提包很便宜。
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: 背包更贵
    gloss: 背包比手提包贵。
    note: '*Duurder* 是 *duur* + *der*。以 r 结尾的词后面加 *-der*，而不是 *-er*。'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: 手提包更便宜
    gloss: 手提包比背包便宜。
    note: '*Goedkoper* 是 *goedkoop* + *er*，与上一句正好相反。'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: 表示同等程度的比较
    gloss: 用 net zo 加形容词再加 als，表示两样东西程度相同。
    note: 这相当于汉语的“和……一样……”结构。
  nl.a1.unit14.lesson03.teach.mooi:
    title: 同样好看
    gloss: 这个背包和那个包一样好看。
    note: '*Mooi*（好看，漂亮）位于 *net zo* 和 *als* 之间，形式不变，不加 -er。'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: 同样实用
    gloss: 背包和手提包一样实用。
    note: 任何原形形容词都可以放进 *net zo ... als* 这个位置。
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: 最高级的构成
    gloss: 最高级通常用 het 加形容词再加 st。
    note: 这种表语形式（用在 *is* 之后）无论名词是什么性，都用 *het*。
  nl.a1.unit14.lesson04.teach.duurst:
    title: 两者中最贵的
    gloss: 这两个当中，背包最贵。
    note: '*Duurst* 是 *duur* + *st*。即使只在两个选项之间比较，荷兰语也可以使用最高级。'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 不规则变化：goed, beter, best
    gloss: Goed, beter, best 是不规则变化：这是最佳选择。Veel, meer, meest 也是同样的情况。
    note: '*goed/beter/best* 和 *veel/meer/meest* 这两组变化都不遵循规则的 -er/-st 模式，需要单独记忆。'
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: 旅行的最佳选择
    gloss: 这个背包是长途火车旅行的最佳选择。
    note: '*Beste* 是定语形式（用在名词前），带有荷兰语形容词在名词前通常要加的 -e 词尾。'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: 更多空间
    gloss: 背包比手提包空间大。
    note: '*Meer* 是 *veel*（很多）的不规则比较级，不能按规则加 -er。'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: 阅读商店广告
    gloss: Bergsport 背包：四十五欧元。这个背包又大又结实。Stad 单肩包：二十欧元。这个包比背包更小更轻，但不那么结实。长途旅行的话，背包是最佳选择，因为它更结实，空间也更大。
    note: 留意两件商品的价格、大小，以及广告推荐哪一件、为什么。
    glosses:
      Rugzak: 背包
      vijfenveertig: 四十五
      euro: 欧元
      groot: 大的
      sterk: 结实
      Schoudertas: 单肩包
      twintig: 二十
      tas: 包
      kleiner: 更小
      lichter: 更轻
      minder: 更少
      lange: 长的
      reis: 旅行
      beste: 最好的
      keuze: 选择
      sterker: 更强
      ruimte: 空间
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte指出大小
    gloss: Lotte：看，这个背包比那个包大。
    note: '*Kijk*（看）是引起别人注意某样东西的常用说法。'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar解释为什么需要它
    gloss: Omar：是的，而且空间更大。我需要一个大包去坐火车旅行。
    note: '*Nodig hebben*（需要）是固定搭配；所需要的东西放在 *hebben* 和 *nodig* 之间。'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte确认选择
    gloss: Lotte：那这个背包就是你的最佳选择。
    note: 这里的 *Dan* 表示“那么”，不是第1课里表示比较的 *dan*——同一个拼写有两种用法。
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar询问Lotte的意见
    gloss: Omar：没错。你觉得哪个包最好看？
    note: '*Vind jij het mooist* 沿用了第13单元 *vinden* 课中表达看法的句型。'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte选了单肩包
    gloss: Lotte：我觉得这个单肩包最好看。而且它很轻。
    note: '*Licht*（重量轻）是一个有用的新形容词，可用来描述包和行李。'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: 他们敲定了决定
    gloss: Omar：好，那我买背包，你买单肩包。
    note: 第二个分句省略了重复的动词 *koop*——当语境已经清楚时，口语中这样说很自然。
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop 与 koopt
    gloss: Koop 是 kopen（买）的第一人称单数形式；koopt 是第三人称单数形式。
    note: 规则的现在时变位：*ik koop*，*jij/hij/zij koopt*。
