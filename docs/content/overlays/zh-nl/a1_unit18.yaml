teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: 公寓、客厅、卧室
    gloss: 公寓、客厅、卧室
    note: '*Het appartement*是中性名词；*de woonkamer*和*de slaapkamer*是通性名词。'
    example_gloss:
    - 我有一套公寓。
    - 我有一间客厅。
    - 我有一间卧室。
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: 厨房、浴室
    gloss: 厨房、浴室
    note: '*De keuken*和*de badkamer*都是通性名词。'
    example_gloss:
    - 我有一间厨房。
    - 我有一间浴室。
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: 说明你有一套公寓
    gloss: 我有一套公寓。
    note: 描述自己拥有什么样的住所，自然会用 *hebben*（有）这个动词，和汉语说“我有一套公寓”一样。这里只是一个通用例句；奥马尔自己在乌得勒支的公寓会在本单元稍后介绍。
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: 列出所有房间
    gloss: 我有客厅、卧室、厨房和浴室。
    note: 一个句子里列出了本课词汇中的四个房间，用逗号隔开，最后一个前面用 *en*（和）连接。
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: 询问有几个房间
    gloss: 你有几个房间？
    note: '*Hoeveel*（多少）沿用了前面数字课中询问数量的句型。'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: 说明房间数量
    gloss: 我有两间卧室。
    note: '*Slaapkamers*是 *slaapkamer* 的复数形式，规则地加 -s 构成。'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: 说明房间总数
    gloss: 这套公寓有三个房间。
    note: '*Kamers*泛指房间，不只限于卧室。'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: 阳台、花园
    gloss: 阳台，花园
    note: '*Het balkon*是中性名词；*de tuin*是通性名词。'
    example_gloss:
    - 有一个阳台。
    - 没有花园。
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: 表示某物存在
    gloss: 有一个阳台。
    note: '*Er is* 是荷兰语表示“存在”的标准结构，相当于汉语的“有”。'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: 表示某物不存在
    gloss: 没有花园。
    note: '*Geen*用来否定不定指的名词——说 *geen tuin*，而不是 *niet een tuin*。'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: 温馨舒适
    gloss: 温馨的
    note: 这是荷兰语中非常常用、极具荷兰特色的形容词，表示温馨舒适的氛围，汉语里没有一个完全对应的词。
    example_gloss: 这套公寓小，但很温馨。
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: 常见的描述句式
    gloss: 这套公寓小，但很温馨。
    note: '*Klein maar gezellig*是荷兰人积极地形容小巧住所时非常常用、很自然的说法。'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: 描述房间的大小
    gloss: 客厅很大。
    note: '*Groot*在这里形容某个具体的房间，而不是整个住所。'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: 描述另一个房间的大小
    gloss: 厨房很小。
    note: 句型和上一张卡片的 *groot* 相同，只是换成另一个房间，并用 *klein*。
  nl.a1.unit18.lesson05.teach.advertentie:
    title: 阅读租房广告
    gloss: 乌得勒支的公寓：一间卧室、一间客厅、一间厨房和一间浴室。有阳台，但没有花园。公寓小而温馨。
    note: 留意房间数量、有哪些设施、没有哪些设施，以及整体给人的印象。
    glosses:
      Appartement: 公寓
      slaapkamer: 卧室
      woonkamer: 客厅
      keuken: 厨房
      badkamer: 卫生间
      balkon: 阳台
      tuin: 花园
      klein: 小的
      gezellig: 温馨的
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: 洛特询问公寓的情况
    gloss: 洛特：嗨，奥马尔，你在乌得勒支的新公寓怎么样？
    note: '*Nieuwe*是 *nieuw*（新的）的变化形式，用在名词前面。'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: 奥马尔描述公寓
    gloss: 奥马尔：小而温馨。我有一间卧室、一间客厅、一间厨房和一间浴室。
    note: 和第五课读到的租房广告完全一致——这就是奥马尔的真实公寓。
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: 洛特问起阳台
    gloss: 洛特：你有阳台吗？
    note: 这是一个直接的是非问句，沿用了前面单元学过的 *heb je ...?*。
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: 奥马尔回答
    gloss: 奥马尔：有，我有阳台，但没有花园。
    note: 与前面广告中“有阳台、没有花园”的信息一致。
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: 用 hij 指代奥马尔
    gloss: 除了说 Omar，也可以用 hij（他）：他有一个阳台。
    note: 对话中已经提到过奥马尔之后，就可以用 *hij*（他）代替他的名字。
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: 洛特热情地回应
    gloss: 洛特：听起来真不错！我很快就去你那儿看看。
    note: '*Komen langs*（顺道拜访）是可分动词；*langs*要移到分句的末尾。'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: 奥马尔欢迎她
    gloss: 奥马尔：好啊，随时欢迎你。
    note: '*Altijd welkom*是邀请别人再来时热情又自然的说法。'
