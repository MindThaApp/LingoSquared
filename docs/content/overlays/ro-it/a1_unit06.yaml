teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: mama, tatăl
    note: 'Substantivele italiene se folosesc cu articol în funcție de gen: *la* pentru feminin, *il* pentru masculin.'
    example_gloss:
    - Acesta este tatăl meu.
    - Aceasta este mama mea.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: fratele, sora
    note: '*fratello* este masculin (*il*), iar *sorella* este feminin (*la*).'
    example_gloss:
    - Am un frate și o soră.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: Acesta este tatăl meu. Aceasta este mama mea.
    note: '*Questo/Questa* se acordă în gen cu persoana despre care vorbești: *questo* pentru un bărbat, *questa* pentru o femeie.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: bunicul, bunica
    note: Același tipar de articole masculin/feminin ca la *padre/madre*.
    example_gloss:
    - Bunicul meu locuiește la Roma.
    - Bunica mea gătește foarte bine.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: Ai frați sau surori?
    note: '*Hai* (ai) + cuvântul pentru rudă + *o* (sau) este formula obișnuită pentru a întreba despre frați și surori.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: Am un frate și o soră.
    note: '*Ho* (am) răspunde la întrebare, împreună cu *un* (un, masculin) și *una* (o, feminin).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: soțul, soția
    note: Încă o pereche masculin/feminin, cu același tipar de articole.
    example_gloss:
    - Sam are o soție.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: Ai copii?
    note: '*figli* (copii) este pluralul folosit când întrebi în general, indiferent de număr sau de sex.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Da, am doi copii. Un băiat și o fată.
    note: '*maschio* (băiat) și *femmina* (fată) precizează sexul copiilor după ce ai spus numărul total.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: fiul, fiica
    note: Formele de singular ale lui *figli*, cu același tipar de articole masculin/feminin.
    example_gloss:
    - Elena are un fiu și o fiică.
