    title: Mi piace + anotimp
    gloss: 'Mi piace + anotimp spune ce părere ai despre un anotimp: Mi piace l''estate. Pentru două anotimpuri se folosește mi piacciono: Mi piacciono l''estate e l''inverno.'
    note: 'În italiană, lucrul care îți place este subiectul gramatical, deci verbul se acordă cu el: mi piace l''estate (un singur anotimp), mi piacciono l''estate e l''inverno (două). La fel ca în română (îmi place vara, îmi plac vara și iarna), verbul se schimbă după numărul lucrului care place.'
