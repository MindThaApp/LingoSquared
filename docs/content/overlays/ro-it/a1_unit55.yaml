    title: O conversație despre anotimpuri
    gloss: 'Acum este primăvară. Lalelele sunt frumoase. Nina întreabă: Ce anotimp ți se pare cel mai frumos? Marco spune: Îmi place vara. Vara înotăm. Giulia spune: Îmi place iarna. Iarna patinăm pe gheață.'
    note: Recapitulează conversația din cafeneaua de limbi străine, prin povestire cu citate directe, ca textele de recapitulare din celelalte unități.
