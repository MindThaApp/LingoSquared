teaching:
  it.a1.unit09.lesson01.teach.farmacia_banca:
    title: la farmacia, la banca
    gloss: farmacia, banca
    note: Ambele substantive sunt de genul feminin (*la*).
    example_gloss:
    - Scuzați-mă, unde este farmacia?
  it.a1.unit09.lesson01.teach.stazione_ufficio_postale:
    title: la stazione, l'ufficio postale
    gloss: gara, oficiul poștal
    note: '*stazione* este feminin (*la*); *ufficio* este masculin, dar primește *l''* înaintea unei vocale.'
    example_gloss:
    - Gara este aproape.
  it.a1.unit09.lesson01.teach.scusi_dove_la_farmacia:
    title: Scusi, dov'è la farmacia?
    gloss: Scuzați-mă, unde este farmacia?
    note: '*Scusi* (scuzați-mă, formal) deschide întrebarea, înaintea lui *dov''è* (unde este).'
  it.a1.unit09.lesson01.teach.e_qui_vicino:
    title: È qui vicino, in Via Roma.
    gloss: Este aproape, pe Via Roma.
    note: După *qui vicino* (aproape, prin apropiere) poate urma numele unei străzi, pentru a da o locație mai exactă.
  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: Este o bancă prin apropiere?
    note: '*C''è* (există, este) întreabă despre existența a ceva, urmat de *qui vicino* (prin apropiere).'
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: Da, este una prin apropiere.
    note: '*ce n''è una* (este una) răspunde la întrebările cu *c''è* și se referă la substantivul feminin *banca*.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: Lângă gară.
    note: '*accanto a* (lângă) împreună cu articolul indică un loc precis față de un punct de reper.'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Mulțumesc mult.
    note: Literal „o mie de mulțumiri”, o formulă mai puternică decât simplul *grazie*.
  it.a1.unit09.lesson03.teach.dove_e_la_stazione:
    title: Dov'è la stazione?
    gloss: Unde este gara?
    note: '*Dov''è* (unde este) urmat de substantiv întreabă unde se află un anumit loc.'
    example_gloss:
    - Gara este lângă bancă.
