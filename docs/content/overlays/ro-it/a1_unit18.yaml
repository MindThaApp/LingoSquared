teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: bucătărie, living
    note: '*la cucina* (bucătăria) este feminin; *il soggiorno* (livingul) este masculin.'
    example_gloss:
    - Bucătăria este mare.
    - Livingul este confortabil.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: dormitor, baie
    note: '*la camera da letto* înseamnă literal „camera pentru pat” (*letto* = pat); *il bagno* este baia.'
    example_gloss:
    - Dormitorul este mic.
    - Baia este curată.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: Aceasta este casa mea.
    note: '*Questa* (aceasta, feminin) se acordă cu *casa* (casa), care este de genul feminin.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Sunt patru camere.
    note: '*Ci sono* (sunt) + un număr + *stanze* (camere); *quattro* (patru) a fost învățat în Unitatea 3.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: pat, masă
    note: '*il letto* (patul) și *il tavolo* (masa) sunt amândouă de genul masculin.'
    example_gloss:
    - Patul este în dormitor.
    - Masa este în bucătărie.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: scaun, canapea
    note: '*la sedia* (scaunul) este de genul feminin; *il divano* (canapeaua) este de genul masculin.'
    example_gloss:
    - Scaunul este lângă masă.
    - Canapeaua este în living.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: Patul este în dormitor.
    note: '*nella* este forma contrasă din *in* + *la* și înseamnă „în”.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: Canapeaua este în living.
    note: '*nel* este forma contrasă din *in* + *il* (masculin) și înseamnă „în”.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: lângă, în fața
    note: Ambele sunt prepoziții din două cuvinte care se termină în *a*, ce se contractă cu articolul următor (*al*, *alla*).
    example_gloss:
    - Scaunul este lângă masă.
    - Patul este în fața ferestrei.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: în spatele, deasupra / pe, sub
    note: 'Încă trei cuvinte pentru loc: *dietro* (în spatele), *sopra* (deasupra/pe), *sotto* (sub) — niciunul nu cere *a* înaintea articolului.'
    example_gloss:
    - Canapeaua este în spatele mesei.
    - Cartea este pe masă.
    - Pisica este sub pat.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: Unde este patul?
    note: '*Dov''è* este contragerea lui *dove* (unde) + *è* (este).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: Patul este lângă fereastră.
    note: '*vicino alla finestra* folosește *vicino a* + *la finestra* (fereastra), contrase în *alla*.'
