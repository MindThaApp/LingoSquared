teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: Alo? Cine vorbește?
    note: '*Pronto* este modul obișnuit de a răspunde la telefon în italiană, nu *ciao*.'
    example_gloss:
    - Alo, sunt Elena.
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: telefonul, un mesaj
    note: '*Messaggio* este masculin; folosește *un messaggio*.'
    example_gloss:
    - Îți trimit un mesaj.
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: Sunt Elena.
    note: La telefon, în italiană se folosește de obicei *sono* pentru a te prezenta, ca și în română „sunt…”.
    example_gloss:
    - Alo, sunt Elena.
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: Salut, Sam, sunt Elena.
    note: '*Sono Elena* este o formulă naturală pentru „sunt Elena” într-un apel.'
    example_gloss:
    - Salut, Sam, sunt Elena la telefon.
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: Poți repeta, te rog?
    note: '*Puoi* este informal, potrivit între Elena și Sam.'
    example_gloss:
    - Sam, poți repeta, te rog?
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: Mai încet, te rog.
    note: '*Più piano* înseamnă „mai încet”; este modul obișnuit de a ruga pe cineva să vorbească mai rar.'
    example_gloss:
    - Vorbește mai încet, te rog.
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: Îți trimit un mesaj.
    note: '*Ti mando* înseamnă „îți trimit” în vorbirea informală.'
    example_gloss:
    - Salut, Sam, îți trimit un mesaj.
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: Da, sunt Elena.
    note: '*Sì* se scrie cu accent; nu scrie *si* fără accent pentru „da”.'
    example_gloss:
    - Da, sunt Elena la telefon.
