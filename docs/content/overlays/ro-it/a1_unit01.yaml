course:
  title: Italiană A1
  description: Învață italiana la nivel A1 pentru salutările de zi cu zi și schimburi sociale scurte, cu explicații detaliate în română.
units:
  it.a1.unit01.greetings_and_introductions:
    title: Saluturi și prezentări
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: 'Tu și Lei: salutul informal și cel formal'
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: Cum răspunzi și cum îți iei rămas-bun
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 'Cum te prezinți: prima zi la birou'
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: salut, bună ziua
    note: '*Ciao* este un salut informal, folosit în orice moment al zilei între prieteni și colegi. *Buongiorno* este salutul obișnuit, mai formal, de peste zi — se poate folosi de dimineața până după-amiaza.'
    example_gloss:
    - Salut, ce mai faci?
    - Bună ziua, ce mai faceți?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: ce mai faci, ce mai faceți
    note: '*come stai* se folosește cu *tu* (un prieten, un coleg); *come sta* se folosește cu *Lei* (o persoană necunoscută, un șef, cineva față de care arăți respect). Aceeași întrebare, alt registru.'
    example_gloss:
    - Salut, ce mai faci azi?
    - Bună ziua, ce mai faceți azi?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Salut, ce mai faci?
    note: Salutul informal urmat de întrebare, folosit cu prieteni, colegi de clasă sau persoane de aceeași vârstă.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Bună ziua, ce mai faceți?
    note: Varianta formală, folosită cu cineva căruia i te adresezi cu respect, de exemplu șeful unui coleg nou.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: informal · Lei: formal sau respectuos'
    note: '*tu* este forma obișnuită între prieteni, colegi de clasă și persoane de aceeași vârstă. *Lei* este forma de politețe, pentru necunoscuți, pentru relațiile ierarhice de la serviciu sau pentru cineva pe care îl cunoști acum — are forme verbale proprii (compară *tu stai* cu *Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Bine, mulțumesc
    note: Un răspuns simplu și neutru la „ce mai faci?”, potrivit în ambele registre dacă îl completezi cu *e tu?* sau *e Lei?*
    example_gloss:
    - Bine, mulțumesc, și tu?
    - Bine, mulțumesc, și dumneavoastră?
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: Dar tu? (informal)
    note: Modul informal de a întoarce întrebarea unui prieten sau coleg.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: Dar dumneavoastră? (formal)
    note: Modul formal de a întoarce întrebarea, în registrul lui *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Bine, mulțumesc, și tu?
    note: Răspunsul complet informal, cu întrebarea întoarsă, spus unui prieten sau coleg.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Bine, mulțumesc, și dumneavoastră?
    note: Răspunsul complet formal, cu întrebarea întoarsă, spus cuiva căruia i te adresezi cu respect.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: bună seara, noapte bună
    note: '*Buonasera* este un salut folosit când ajungi undeva seara. *Buonanotte* este o urare de despărțire, spusă când cineva merge la culcare sau încheie ziua — nu se folosește niciodată ca salut.'
    example_gloss:
    - Bună seara, ce mai faci?
    - Noapte bună, ne vedem mâine.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: La revedere, ne vedem mâine.
    note: '*Arrivederla* este formula formală de rămas-bun, folosită cu *Lei*, potrivită la serviciu sau cu un necunoscut.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: Pa, ne vedem mâine!
    note: Rămas-bun informal, folosit cu prieteni și colegi pe care îi revezi a doua zi.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: Cum vă numiți, vă rog?
    note: '*Come si chiama?* înseamnă literal „cum vă numiți?”, în registrul formal *Lei*; adăugarea lui *scusi* („scuzați-mă”) este o formulă politicoasă firească atunci când te adresezi unui necunoscut.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: Cum te cheamă?
    note: Varianta informală, folosită cu un prieten, un coleg sau cineva de vârsta ta.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Mă numesc Elena.
    note: '*chiamarsi* înseamnă „a se numi” — este modul obișnuit de a-ți spune numele, potrivit în ambele registre.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Eu sunt Sam.
    note: O alternativă simplă la *mi chiamo*, cu verbul *essere* („a fi”) urmat direct de nume.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: încântat, încântat de cunoștință (formal)
    note: '*Piacere* singur este o formulă scurtă și frecventă pentru „încântat”, în ambele registre. *Piacere di conoscerla* este varianta completă, formală, folosită cu *Lei*.'
    example_gloss:
    - Încântat, Sam!
    - Încântat de cunoștință, doamnă Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: Bun venit la birou!
    note: '*Benvenuto* este forma de masculin a lui „bun venit” (pentru un bărbat; unei femei i se spune *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Mulțumesc mult.
    note: O formulă mai puternică și mai apăsată decât un simplu *Grazie*.
