  it.a1.unit41.lesson05.marco_e_giulia_confrontano:
    title: Marco și Giulia își compară hobby-urile
  it.a1.unit41.lesson06.programmare_un_fine_settimana:
    title: Planuri pentru un weekend împreună
teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'Trei verbe frecvente pentru hobby-uri, la infinitiv: *leggere* (a citi), *fare sport* (a face sport) și *cucinare* (a găti). Infinitivele italiene se termină în -are, -ere sau -ire.'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Timpul liber
    gloss: timpul liber
    note: '*Il tempo libero* este un substantiv masculin, de aceea primește *il*. Este expresia-cheie pentru a vorbi despre hobby-uri.'
    example_gloss: În timpul liber, îmi place să citesc.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: '*Leggo* este forma pentru *io* a verbului *leggere* (a citi). În italiană pronumele subiect se omite de obicei: spui *Leggo*, nu *Io leggo*, la fel ca în română.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei hobby-uri: *ascoltare musica* (a asculta muzică), *disegnare* (a desena) și *giocare ai videogiochi* (a juca jocuri video).'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: '*Ascoltare* are complement direct: *ascolto musica*, fără nicio prepoziție între verb și complement.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: '*Con gli amici* înseamnă „cu prietenii”. *Gli* este articolul hotărât plural înaintea unui substantiv masculin care începe cu vocală.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: 'Patru cuvinte de frecvență. *Mai* (niciodată) cere *non* înaintea verbului: *non gioco mai*.'
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*Ogni* („fiecare”, „în fiecare”) nu se schimbă niciodată: *ogni settimana*, *ogni fine settimana*. Vezi cardul următor.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai cere non; ogni nu se schimbă
    gloss: 'Cu mai, verbul primește și non: Non gioco mai. Ogni rămâne neschimbat pentru orice substantiv: ogni settimana, ogni fine settimana.'
    note: 'Ca și în română, negația se dublează: *non gioco mai* (literal „nu joc niciodată”). *Ogni* este întotdeauna urmat de un substantiv la singular.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia aduce vorba despre hobby-uri
    gloss: 'Giulia: Ne plimbăm des împreună. Dar tu ce altceva mai faci în timpul liber, Marco?'
    note: '*Passeggiamo* este forma pentru *noi* a verbului *passeggiare*. *Spesso* se pune după verb.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Hobby-urile lui Marco
    gloss: 'Marco: Gătesc cu plăcere, chiar și acasă. Și fac sport des.'
    note: '*Anche a casa* („și acasă”) arată că Marco gătește pentru plăcere, nu doar la serviciu. *A casa* înseamnă „acasă”, fără articol.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia este surprinsă
    gloss: 'Giulia: Gătești și acasă? Tu gătești deja toată ziua la serviciu!'
    note: '*Già* („deja”) și *tutto il giorno* („toată ziua”) arată cât de mult gătește Marco deja la serviciu.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco explică
    gloss: 'Marco: Da, dar gătitul mă relaxează. Și tu, ce îți place să faci?'
    note: '*Cucinare mi rilassa* înseamnă literal „gătitul mă relaxează”: activitatea este subiectul, iar *mi* („mă”) este complementul.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Hobby-urile Giuliei
    gloss: 'Giulia: Citesc cu plăcere și ascult des muzică.'
    note: 'Două hobby-uri unite prin *e* („și”). Ambele verbe rămân la forma pentru *io*: *leggo* și *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco întreabă despre jocurile video
    gloss: 'Marco: Joci și jocuri video?'
    note: 'O întrebare cu răspuns da/nu păstrează ordinea din propoziția afirmativă; se schimbă doar intonația: *Giochi anche ai videogiochi?* *Anche* înseamnă „și”, „de asemenea”.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia răspunde
    gloss: 'Giulia: Nu, nu joc niciodată jocuri video. Dar uneori desenez!'
    note: '*Non ... mai* („niciodată”) și *a volte* („uneori”) puse în contrast într-un singur răspuns. *Ma* înseamnă „dar”.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Comparăm hobby-urile
    gloss: Marco și cu mine ne plimbăm des împreună. Dar avem și alte hobby-uri. Marco gătește cu plăcere, chiar și acasă, și face sport des. Eu citesc cu plăcere și ascult des muzică. Desenez uneori, dar nu joc niciodată jocuri video. Ție ce îți place să faci în timpul liber?
    note: Mesajul Giuliei recapitulează ce s-a spus în lecție și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      passeggiamo: ne plimbăm
      spesso: des
      insieme: împreună
      altri: alte
      cucina: gătește
      volentieri: cu plăcere
      casa: acasă (a casa = acasă)
      sport: sport (fa sport = face sport)
      leggo: citesc
      ascolto: ascult
      musica: muzică
      disegno: desenez
      volte: ori (a volte = uneori)
      videogiochi: jocuri video
      mai: niciodată
      libero: liber
      tempo: timp
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco întreabă despre weekend
    gloss: 'Marco: Ce faci în acest weekend?'
    note: '*Questo fine settimana* („acest weekend”) este masculin, de aceea se folosește *questo*. *Fai* este forma pentru *tu* a verbului *fare* („a face”).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia nu s-a hotărât
    gloss: 'Giulia: Încă nu știu. Citesc cu plăcere, dar vreau să și ies.'
    note: '*Non lo so ancora* („încă nu știu”): *lo* înlocuiește ceea ce nu știi și se pune înaintea verbului. *Uscire* înseamnă „a ieși”.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco propune un plan
    gloss: 'Marco: Facem o plimbare împreună? Apoi gătesc eu pentru noi.'
    note: '*Poi* („apoi”, „după aceea”) ordonează planurile. *Cucino io* (cu *io* după verb) subliniază „eu voi găti”.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia este de acord
    gloss: 'Giulia: Bună idee! Îmi place și să mă plimb, și să gătesc.'
    note: '*Sia ... sia ...* înseamnă „și ... și ...”: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco confirmă
    gloss: 'Marco: Perfect. Atunci ne vedem sâmbătă!'
    note: '*Ci vediamo sabato* („ne vedem sâmbătă”): nu se pune articol înaintea zilei când este vorba de cea apropiată.'
