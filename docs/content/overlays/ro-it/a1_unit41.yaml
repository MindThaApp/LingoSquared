course:
  title: Italiană A1
  description: 'Italiană pentru începători, pentru a vorbi despre activitățile din timpul liber: vocabular despre hobby-uri, expresii de frecvență, cum întrebi și răspunzi ce face cineva în timpul liber și cum compari hobby-urile a două persoane.'
