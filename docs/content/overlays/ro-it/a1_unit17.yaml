teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: slujbă / muncă
    note: '*il lavoro* este un substantiv masculin care înseamnă atât „slujbă”, cât și „muncă” în general.'
    example_gloss:
    - Slujba mea este interesantă.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: profesor, vânzător
    note: '*insegnante* (profesor) are aceeași formă pentru bărbați și femei; *commesso* (vânzător) este masculin — forma de feminin este *commessa*.'
    example_gloss:
    - Sunt profesor, nu vânzător.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Cu ce vă ocupați?
    note: '*Che lavoro fai?* (literal „Ce slujbă faci?”) este modul obișnuit de a întreba cu ce se ocupă cineva.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Sunt profesoară.
    note: 'În italiană nu se folosește articolul înaintea unei profesii fără alte precizări: *Sono insegnante*, nu *Sono un insegnante*. La fel se întâmplă și în română: „Sunt profesor”.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Sunt vânzător.
    note: Același tipar fără articol ca la *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: birou, școală
    note: La *l'ufficio* (birou) articolul se elidează înaintea vocalei; *la scuola* (școală) este feminin.
    example_gloss:
    - Lucrez într-un birou.
    - Lucrez la o școală.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: Unde lucrezi?
    note: '*Dove* (unde) plus *lavori* (lucrezi, forma informală).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Lucrez la un birou.
    note: '*Lavoro in* (lucrez la) plus *un ufficio* (un birou).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Lucrez la o școală.
    note: Același tipar cu *una scuola* (o școală).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: încep, termin
    note: '*inizio* (încep) și *finisco* (termin) sunt formele de persoana întâi singular, la prezent, ale verbelor *iniziare* și *finire*.'
    example_gloss:
    - Încep la nouă.
    - Termin la cinci.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: La ce oră începi?
    note: '*A che ora* (la ce oră) plus *inizi* (începi, forma informală).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: Încep la nouă și termin la cinci.
    note: '*alle nove* / *alle cinque* (la nouă / la cinci) folosește *alle* înaintea orei, ca în expresiile pentru oră din Unitatea 5.'
