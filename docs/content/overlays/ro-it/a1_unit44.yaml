    title: Giulia și Chiara despre sport
    gloss: Giulia face yoga de două ori pe săptămână. Îi place să se miște în ritm calm. Chiara nu face yoga, dar iubește să înoate. Chiara înoată des, aproape în fiecare săptămână. Tu ce sport faci?
    note: 'Pune în contrast două sporturi și două moduri de a spune cât de des. Observă *nuota* (înoată) și *nuotare* (a înota): terminația arată persoana.'
