teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: la dreapta, la stânga
    note: '*a destra* (la dreapta) și *a sinistra* (la stânga) sunt cele două direcții de bază pentru viraj.'
    example_gloss:
    - Virați la dreapta, vă rog.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: drept înainte, la intersecție
    note: '*sempre dritto* (drept înainte) și *all''incrocio* (la intersecție) arată cum și unde trebuie să virezi.'
    example_gloss:
    - Mergeți drept înainte până la intersecție.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: Scuzați-mă, cum ajung la muzeu?
    note: '*Scusi* (scuzați-mă, formal) deschide întrebarea, înaintea lui *come arrivo* (cum ajung) plus destinația.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: Mergeți drept înainte, apoi virați la dreapta la intersecție.
    note: '*Vada* și *giri* sunt imperative de politețe (forma Lei), felul în care un necunoscut dă indicații.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: Este departe de aici?
    note: '*È lontano* (este departe) plus *da qui* (de aici) întreabă despre distanță.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: Nu, sunt doar cinci minute pe jos.
    note: '*a piedi* (pe jos) precizează cum se măsoară distanța.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: Mulțumesc mult, sunteți foarte amabil.
    note: '*molto gentile* (foarte amabil) adaugă căldură după ce mulțumești cuiva pentru ajutor.'
    example_gloss:
    - Foarte amabil, mulțumesc încă o dată.
  it.a1.unit10.lesson03.teach.vada_giri_continui:
    title: Vada, giri, continui.
    gloss: Mergeți, virați, continuați.
    note: Trei verbe la imperativ de politețe (Lei) folosite frecvent împreună atunci când indici direcția.
  it.a1.unit10.lesson03.teach.dove_e_il_museo:
    title: Dov'è il museo?
    gloss: Unde este muzeul?
    note: '*Dov''è* (unde este) urmat de substantiv întreabă unde se află un loc.'
    example_gloss:
    - Muzeul este departe de aici.
