teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: fericit, trist
    note: '*Felice* și *triste* se termină în *-e*, deci aceeași formă se folosește la masculin și la feminin (*Sam è felice*, *Elena è felice*).'
    example_gloss:
    - Azi sunt fericit.
    - Azi sunt trist.
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: obosit, nervos
    note: Aceste adjective își pot schimba terminația; în această unitate înveți formele de dicționar de masculin.
    example_gloss:
    - Sam este obosit.
    - Azi sunt nervos.
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: Cum vă simțiți?
    note: '*Ti senti* este forma informală, „tu simți”, folosită cu un prieten.'
    example_gloss:
    - Cum te simți azi?
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: Sunt fericit.
    note: Folosește *sono* împreună cu un adjectiv care exprimă o stare.
    example_gloss:
    - Azi sunt fericit.
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: pentru că / de ce
    note: În această unitate, *perché* arată cauza unei stări.
    example_gloss:
    - Sunt fericit pentru că azi e soare.
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: Sunt fericit pentru că azi e soare.
    note: Aceasta este o propoziție completă, cu o stare și cauza ei.
    example_gloss:
    - La Milano sunt fericit pentru că azi e soare.
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: Sunt puțin obosit.
    note: '*Stanca* este la feminin aici, pentru că Elena este cea care vorbește.'
    example_gloss:
    - Azi sunt puțin obosită.
  it.a1.unit22.lesson02.teach_ma_sto_bene:
    title: ma sto bene
    gloss: dar mă simt bine
    note: '*Ma* pune în contrast oboseala cu faptul că ești bine.'
    example_gloss:
    - Sunt obosit, dar mă simt bine.
