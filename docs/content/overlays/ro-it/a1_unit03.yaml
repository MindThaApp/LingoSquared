teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: zero, unu, doi, trei, patru, cinci
    note: 'Primele șase numere: baza pentru prețuri, vârste și numere de telefon în această unitate.'
    example_gloss:
    - Am doi frați.
    - Este ora cinci.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: șase, șapte, opt, nouă, zece
    note: Numerele de la șase la zece, care completează seria de la 0 la 10.
    example_gloss:
    - Lucrez opt ore pe zi.
    - Magazinul se deschide la zece.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: Câți ani ai?
    note: 'Literal „câți ani ai”: în italiană, vârsta se exprimă cu *avere* (a avea), ca în română, nu cu „a fi”.'
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: Am treizeci de ani.
    note: 'O expresie fixă pentru a spune vârsta cu *avere* („am treizeci de ani”); „treizeci” nu este predat aici ca număr de numărat: în această unitate numerele rămân între 0 și 10, plus 30 și 50, care apar doar în această expresie fixă și în prețuri.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: Cât costă o cafea?
    note: '*Quanto costa* este modul obișnuit de a întreba prețul unui singur produs.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: un euro, doi euro
    note: 'În italiană, *euro* nu își schimbă forma la plural: și *un euro*, și *due euro* folosesc *euro*.'
    example_gloss:
    - Costă un euro.
    - Fac doi euro și cincizeci.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: Și un croissant?
    note: O întrebare scurtă de continuare, pentru prețul unui al doilea produs, un *cornetto* (croissantul italian de la micul dejun).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: Fac doi euro și cincizeci.
    note: '*e cinquanta* adaugă cei cincizeci de cenți: literal „și cincizeci”, folosit la fel pentru orice preț cu cincizeci de cenți.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: Câte doriți?
    note: Modul formal în care un barista sau un vânzător întreabă câte bucăți dorești; *ne* ține locul produsului deja menționat.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: Aș vrea trei, mulțumesc.
    note: '*Ne vorrei* + un număr este modul politicos de a cere o cantitate, folosind din nou *ne* pentru produsul deja menționat.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: Care este numărul tău de telefon?
    note: Modul informal de a cere numărul de telefon al cuiva, cu *tuo* (al tău, informal).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: Te sun mâine!
    note: Un mod prietenos de a încheia conversația după ce ai primit numărul cuiva.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: numărul meu
    note: Numerele de telefon italiene se citesc de obicei cifră cu cifră, cu numerele din prima lecție.
    example_gloss: Numărul meu este zero, trei, patru, doi, unu.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: Numărul meu este zero, trei, patru, doi, unu.
    note: Sam își spune numărul de telefon cifră cu cifră, modul obișnuit de a citi un număr de telefon în italiană.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: Perfect, mulțumesc!
    note: Un mod scurt și vesel de a încheia conversația după ce ai primit informația de care aveai nevoie.
