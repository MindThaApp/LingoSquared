teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: ieri, azi-dimineață
    note: '*ieri* și *stamattina* sunt cele două repere de timp folosite pentru a vorbi despre evenimente recente.'
    example_gloss:
    - Ieri am fost acasă.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: am mers (masculin), am mers (feminin)
    note: '*sono andato/andata* este passato prossimo al verbului *andare*, format cu auxiliarul *essere*; participiul se acordă în gen cu subiectul.'
    example_gloss:
    - Azi-dimineață am mers la muncă.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Ieri am mers la cinema.
    note: '*Sono andato* (vorbitor de gen masculin) plus *al cinema* plus *ieri* descrie o acțiune încheiată în trecut.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: Am văzut un film frumos!
    note: '*Ho visto* folosește auxiliarul *avere* cu participiul neregulat *visto* (de la *vedere*, a vedea).'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: Am mâncat un sandviș la prânz.
    note: '*Ho mangiato* folosește *avere* plus participiul regulat *mangiato* (de la *mangiare*, a mânca); *a pranzo* înseamnă „la prânz”.'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: Ce ați făcut ieri?
    note: '*hai fatto* este passato prossimo al verbului *fare* (a face), folosit aici pentru a întreba despre un eveniment recent din trecut.'
    example_gloss:
    - Ce ai făcut azi-dimineață?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: aseară
    note: '*ieri sera* combină *ieri* cu *sera* pentru a indica un moment precis din trecut.'
    example_gloss:
    - Aseară am mers la cinema.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Azi-dimineață am mers la muncă, ca întotdeauna.
    note: '*sono andata* (vorbitoare de gen feminin) plus *come sempre* descrie o acțiune obișnuită din trecut.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
