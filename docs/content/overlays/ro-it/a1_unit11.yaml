teaching:
  it.a1.unit11.lesson01.teach.faccio_colazione:
    title: faccio colazione, vado al lavoro
    gloss: Iau micul dejun, merg la serviciu
    note: '*faccio colazione* (iau micul dejun) și *vado al lavoro* (merg la serviciu) sunt două verbe obișnuite pentru rutina zilnică.'
    example_gloss:
    - Iau micul dejun la șapte.
  it.a1.unit11.lesson01.teach.torno_a_casa_vado_a_letto:
    title: torno a casa, vado a letto
    gloss: Mă întorc acasă, mă culc
    note: '*torno a casa* (mă întorc acasă) și *vado a letto* (mă culc) descriu sfârșitul zilei.'
    example_gloss:
    - Seara mă întorc acasă.
  it.a1.unit11.lesson01.teach.a_che_ora_fai_colazione:
    title: A che ora fai colazione di solito?
    gloss: La ce oră iei de obicei micul dejun?
    note: '*A che ora* (la ce oră) împreună cu *di solito* (de obicei) întreabă despre o rutină obișnuită.'
  it.a1.unit11.lesson01.teach.faccio_colazione_alle_sette:
    title: Faccio colazione alle sette e poi vado al lavoro.
    gloss: Iau micul dejun la șapte și apoi merg la serviciu.
    note: '*alle sette* (la șapte) folosește *alle* + ora pentru a indica ora exactă.'
  it.a1.unit11.lesson02.teach.a_che_ora_torni_a_casa:
    title: A che ora torni a casa la sera?
    gloss: La ce oră te întorci acasă seara?
    note: '*torni* este forma de persoana a doua singular (*tu*) a verbului *tornare* (a se întoarce), într-o întrebare despre rutina de seară.'
  it.a1.unit11.lesson02.teach.torno_alle_sei_e_trenta:
    title: Torno a casa alle sei e trenta, di solito.
    gloss: De obicei mă întorc acasă la șase și jumătate.
    note: '*alle sei e trenta* (la șase și jumătate) adaugă minutele după oră cu *e*.'
  it.a1.unit11.lesson02.teach.vado_a_letto_presto:
    title: Vado a letto presto.
    gloss: Mă culc devreme.
    note: '*presto* (devreme) precizează *vado a letto* (mă culc).'
    example_gloss:
    - Seara mă culc devreme.
  it.a1.unit11.lesson03.teach.anche_io:
    title: Anch'io faccio colazione alle sette.
    gloss: Și eu iau micul dejun la șapte.
    note: '*Anch''io* (și eu) arată că ești de acord cu ce tocmai a spus altcineva.'
  it.a1.unit11.lesson03.teach.e_tu:
    title: E tu, a che ora fai colazione?
    gloss: Și tu, la ce oră iei micul dejun?
    note: '*E tu* (și tu) întoarce întrebarea către celălalt vorbitor.'
    example_gloss:
    - Și tu, la ce oră te întorci acasă?
