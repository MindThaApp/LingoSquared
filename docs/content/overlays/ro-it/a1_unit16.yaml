teaching:
  it.a1.unit16.lesson01.teach.mi_fa_male:
    title: mi fa male
    gloss: mă doare / mă doare ...
    note: '*mi fa male* înseamnă literal „îmi face rău”: pune după el o parte a corpului ca să spui că te doare.'
    example_gloss:
    - Mă doare capul.
  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola:
    title: la testa, la pancia, la gola
    gloss: cap, burtă / stomac, gât
    note: Trei părți ale corpului folosite cu *mi fa male* pentru a spune ce te doare.
    example_gloss:
    - Mă doare burta.
    - Mă doare gâtul.
  it.a1.unit16.lesson01.teach.cosa_hai:
    title: Cosa hai?
    gloss: Ce s-a întâmplat?
    note: '*Cosa hai?* (literal „Ce ai?”) este modul în care întrebi pe cineva ce probleme are.'
  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: Mă doare capul.
    note: '*la testa* (capul) este de genul feminin, de aceea se folosește cu *la*.'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: nu mă simt bine
    note: '*mi sento* (mă simt) plus *bene* (bine); *non* îl neagă, ca să spui că nu te simți bine.'
    example_gloss:
    - Astăzi nu mă simt bine.
  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: febră, tuse
    note: 'Simptome frecvente, folosite cu *avere* (a avea): *Ho la febbre* (Am febră).'
    example_gloss:
    - Am febră.
    - Am tuse.
  it.a1.unit16.lesson02.teach.non_mi_sento_bene_phrase:
    title: Non mi sento bene.
    gloss: Nu mă simt bine.
    note: O expresie generală pentru a spune că nu te simți bine, utilă înainte de a numi un simptom anume.
  it.a1.unit16.lesson02.teach.ho_la_febbre_e_la_tosse:
    title: Ho la febbre e la tosse.
    gloss: Am febră și tuse.
    note: '*Ho* (am) plus două simptome unite prin *e* (și).'
  it.a1.unit16.lesson03.teach.il_dottore_la_dottoressa:
    title: il dottore, la dottoressa
    gloss: doctor, doctoriță
    note: '*il dottore* și *la dottoressa* sunt forma masculină și forma feminină pentru „doctor”.'
    example_gloss:
    - Trebuie să merg la doctor.
    - Trebuie să merg la doctoriță.
  it.a1.unit16.lesson03.teach.riposa_la_medicina:
    title: riposa, la medicina
    gloss: odihnește-te!, medicament
    note: '*riposa* este imperativul informal al verbului *riposare* (a se odihni); *la medicina* este medicamentul.'
    example_gloss:
    - Odihnește-te astăzi.
    - Ia acest medicament.
  it.a1.unit16.lesson03.teach.devo_andare_dal_dottore:
    title: Devo andare dal dottore.
    gloss: Trebuie să merg la doctor.
    note: '*Devo* (trebuie să, sunt nevoit să) plus *andare dal dottore* (a merge la doctor); *dal* este *da* + *il*.'
  it.a1.unit16.lesson03.teach.prendi_questa_medicina_e_riposa:
    title: Prendi questa medicina e riposa.
    gloss: Ia acest medicament și odihnește-te.
    note: '*Prendi* (ia, imperativ informal) plus *questa medicina* (acest medicament) și *riposa* (odihnește-te).'
