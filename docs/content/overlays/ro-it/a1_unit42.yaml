course:
  title: Italiană A1
  description: 'Italiană pentru începători, pentru a descrie aspectul fizic de bază al unei persoane: impresii despre înălțime și vârstă, culoarea părului și a ochilor, întrebarea de bază Com''è? și compararea aspectului a două persoane.'
units:
