  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: Comparându-i pe Luca și Chiara
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: Marco o recunoaște pe Nina
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*Alto* descrie o persoană înaltă, iar *basso* una scundă. Adjectivele italiene se acordă cu persoana: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara este înaltă.
    - Luca este scund.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: '*Anziano* („în vârstă”) și *giovane* („tânăr”) dau o impresie generală, nu un număr exact de ani. *Giovane* se termină în -e, deci este la fel pentru bărbați și pentru femei.'
    example_gloss:
    - Bunicul este bătrân.
    - Marco este tânăr.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Vârsta: avere anni sau anziano'
    gloss: 'Pentru vârsta exactă, italiana folosește avere + anni: Quanti anni hai? Pentru o impresie generală folosește un adjectiv: Il nonno è anziano.'
    note: Ca în română, italiana spune „am 30 de ani” (*ho trent'anni*), nu „sunt”. Adjectivul *anziano* arată cât de în vârstă pare cineva.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara este înaltă, iar Luca este scund
    gloss: Chiara este înaltă, iar Luca este scund.
    note: 'Două adjective unite prin *e* („și”). Fiecare se acordă cu persoana ei: *alta* (feminin) și *basso* (masculin).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Părul
    gloss: părul
    note: '*I capelli* este la plural în italiană: italienii vorbesc despre păr ca despre „firele de păr”. Singularul *il capello* înseamnă un singur fir de păr.'
    example_gloss: Marco are părul scurt și negru.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: 'Trei culori de păr la masculin plural, acordate cu *capelli*: *biondi*, *castani*, *grigi*. *Neri* („negru”) se folosește și pentru păr.'
    example_gloss:
    - Giulia are părul blond.
    - Luca are părul șaten.
    - Bunicul are părul cărunt.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*Lunghi* („lung”) și *corti* („scurt”) sunt la plural, ca *capelli*. Cuvântul *alto* („înalt”) se folosește doar pentru persoane, nu pentru păr.'
    example_gloss:
    - Chiara are părul lung.
    - Luca are părul scurt.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli este la plural
    gloss: 'Capelli este la plural, deci și adjectivul este la plural: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'Adjectivul urmează după substantiv și se acordă în gen și număr: *capelli lunghi* (masculin plural), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: Părul și ochii se construiesc cu avere
    gloss: 'Pentru a descrie o persoană, italiana folosește avere cu părul și ochii: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'Ca în română, italiana folosește articolul hotărât: *i capelli*, *gli occhi* („părul”, „ochii”), dar el stă înaintea substantivului. Poți spune și *è bionda*, dar aici învățăm structura cu *avere*.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco are părul scurt și negru
    gloss: Marco are părul scurt și negru.
    note: '*Neri* („negru”) este masculin plural, acordat cu *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia are părul lung și blond
    gloss: Giulia are părul lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Ochii
    gloss: ochii
    note: '*Occhio* („ochi”) este masculin; pluralul este *occhi* și ia articolul *gli* pentru că începe cu o vocală.'
    example_gloss: Marco are ochii căprui.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: 'Culorile ochilor: *azzurri* („albaștri”), *marroni* („căprui”), *verdi* („verzi”). Aceste forme de plural sunt la fel pentru ambele genuri.'
    example_gloss:
    - Giulia are ochii albaștri.
    - Luca are ochii căprui.
    - Chiara are ochii verzi.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Culorile se acordă la plural
    gloss: 'Culorile ochilor se pun la plural, ca occhi: occhi azzurri, marroni, verdi.'
    note: 'Adjectivele care la singular se termină în -e (*verde*, *marrone*) se termină în -i la plural: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Cum arată Giulia?
    gloss: Cum arată Giulia?
    note: '*Com''è?* este întrebarea de bază pentru aspect. *Com''è* este *come è*, cu apostrof în locul lui e.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia are părul lung și blond și ochii albaștri
    gloss: Giulia are părul lung și blond și ochii albaștri.
    note: 'Un răspuns model: *avere* + păr + *e* + ochi, într-o singură propoziție.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia o prezintă pe Nina
    gloss: 'Giulia: La cafeneaua lingvistică vine o fată nouă. O cheamă Nina.'
    note: '*Viene* („vine”) introduce pe cineva nou. *Si chiama* înseamnă „o cheamă”, literal „se numește”.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco întreabă cum arată
    gloss: 'Marco: Bine! Cum arată?'
    note: 'Aceeași întrebare, fără nume: subiectul reiese din context.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia descrie înălțimea și părul Ninei
    gloss: 'Giulia: Este scundă și are părul scurt și blond.'
    note: '*È bassa* („este scundă”) folosește femininul *bassa*; urmează descrierea părului cu *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco întreabă despre ochii ei
    gloss: 'Marco: Dar ochii?'
    note: '*E gli occhi?* omite verbul. Ca și româna, italiana omite adesea cuvintele pe care contextul le face clare.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia descrie ochii Ninei
    gloss: 'Giulia: Are ochii verzi.'
    note: '*Ha gli occhi verdi*: nu e nevoie de pronume subiect, pentru că terminația verbului arată deja că este vorba despre „ea”.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco o va recunoaște
    gloss: 'Marco: Mulțumesc! Atunci o recunosc.'
    note: '*La riconosco* („o recunosc”): pronumele complement *la* stă înaintea verbului.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Comparându-i pe Luca și Chiara
    gloss: Luca și Chiara sunt frate și soră, dar arată foarte diferit. Luca este scund, are părul scurt și șaten și ochii căprui. Chiara este mai înaltă decât Luca, are părul lung și șaten și ochii verzi. Tu cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      fratello: frate
      sorella: soră
      sembrano: arată / par
      diversi: diferit
      basso: scund
      corti: scund
      castani: castaniu
      capelli: păr
      marroni: castaniu
      occhi: ochi
      alta: înaltă (più alta = mai înaltă)
      lunghi: lung
      verdi: verde
      come: cum (Tu come sei? = Tu cum arăți?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Comparația: più ... di'
    gloss: 'Italiana compară cu più + adjectiv + di: Chiara è più alta di Luca.'
    note: 'Pune *più* înaintea adjectivului și *di* înaintea persoanei cu care compari. Adjectivul își păstrează genul: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara are părul mai lung decât Luca
    gloss: Chiara are părul mai lung decât Luca.
    note: '*I capelli più lunghi di Luca*: adjectivul rămâne la plural pentru a se acorda cu *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: '*Ho i capelli corti e castani*: folosește *avere* pentru a-ți descrie propriul aspect.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco o zărește pe Nina
    gloss: 'Marco: Uite, aceea e Nina? Are părul scurt și blond și ochii verzi.'
    note: '*Guarda* (uită-te) este forma de imperativ pentru *tu*. *Quella* înseamnă „aceea” pentru o femeie sau o fată.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia confirmă
    gloss: 'Giulia: Da, e Nina!'
    note: O confirmare scurtă și naturală.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina îl salută pe Marco
    gloss: 'Nina: Bună, tu ești Marco?'
    note: '*Sei Marco?* este întrebarea informală: *sei* este forma de *tu* a verbului *essere*, deci nu e nevoie de *tu*.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco o salută și el pe Nina
    gloss: 'Marco: Da! Încântat de cunoștință, Nina.'
    note: '*Piacere di conoscerti* este formula folosită când cunoști pe cineva pentru prima dată; *-ti* înseamnă „te”.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Marco a recunoscut-o pe Nina după descrierea făcută mai devreme de Giulia.'
