  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: Cât este ceasul?
    note: Modul standard de a întreba ora în italiană; literal „ce ore sunt”.
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Este ora trei.
    note: '*Sono le* + un număr spune ora pentru orice oră, în afară de ora unu.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: ora unu, ora două, ora trei, ora douăsprezece
    note: Ora unu este singura care folosește *è l'una* (singular) în loc de *sono le* (plural), pentru că „unu” este singular.
    example_gloss:
    - Este ora unu.
    - Este ora douăsprezece.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: ora patru, ora cinci, ora șase
    note: Acestea continuă același tipar *sono le* + număr folosit pentru ora trei.
    example_gloss:
    - Este ora patru.
    - Este ora șase.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Este trei și jumătate.
    note: '*e mezzo* (și jumătate) adaugă treizeci de minute la oră.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Este trei și un sfert.
    note: '*e un quarto* (și un sfert) adaugă cincisprezece minute la oră.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Este patru fără un sfert.
    note: '*meno un quarto* (fără un sfert) numără înapoi de la ora URMĂTOARE, ca în română: „patru fără un sfert”.'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: La ce oră ne vedem?
    note: '*A che ora* întreabă la ce oră are loc ceva; *ci vediamo* înseamnă „ne vedem”.'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: Ne vedem la trei și jumătate.
    note: '*alle* (la) se folosește înaintea unei ore precise, spre deosebire de *sono le*, care doar spune cât este ceasul.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: dimineața, după-amiaza, seara
    note: Acestea precizează în ce parte a zilei se află ora, pentru că orele de la 1 la 12 pot fi atât de dimineață, cât și de seară.
    example_gloss:
    - Este o întâlnire de dimineață sau de seară?
    - Este după-amiază, la trei și jumătate.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: Este după-amiază, la trei și jumătate.
    note: Îmbină expresia pentru partea zilei cu ora exactă, pentru a elimina orice neclaritate între dimineață și seară.
