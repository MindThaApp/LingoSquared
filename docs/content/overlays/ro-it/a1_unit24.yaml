    example_gloss:
    - Am bani.
    - Plătesc cu cardul.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: numerar, bon
    note: '*Contanti* este la plural; *scontrino* este bonul obișnuit de la magazin.'
    example_gloss:
    - Plătesc în numerar.
    - Poftiți bonul.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Plătesc cu cardul.
    note: Folosește *con la carta* pentru a plăti cu cardul.
    example_gloss:
    - Plătesc cu cardul la cafenea.
