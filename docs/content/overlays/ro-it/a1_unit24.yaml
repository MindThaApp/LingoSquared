  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: Sunt zece euro.
    note: 'Pentru prețuri, italiana folosește des pluralul *sono*, ca româna: „sunt zece euro”.'
    example_gloss:
    - Tricoul costă zece euro.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Da, desigur.
    note: Pentru „da” folosește *Sì* cu accent; *si* fără accent are alt sens.
    example_gloss:
