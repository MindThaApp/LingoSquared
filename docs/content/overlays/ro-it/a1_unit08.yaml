teaching:
  it.a1.unit08.lesson01.teach.mele_banane:
    title: le mele, le banane
    gloss: merele, bananele
    note: Ambele substantive sunt de genul feminin, la plural (*le*).
    example_gloss:
    - Aș vrea un kilogram de mere.
  it.a1.unit08.lesson01.teach.pomodori_patate:
    title: i pomodori, le patate
    gloss: roșiile, cartofii
    note: '*pomodori* este de genul masculin, la plural (*i*); *patate* este de genul feminin, la plural (*le*).'
    example_gloss:
    - Cât costă roșiile?
  it.a1.unit08.lesson01.teach.quanto_costano:
    title: Quanto costano le mele?
    gloss: Cât costă merele?
    note: '*Quanto costano?* se folosește pentru mai multe produse, adică „cât costă acestea?”.'
  it.a1.unit08.lesson01.teach.costano_tre_euro:
    title: Costano tre euro al chilo.
    gloss: Costă trei euro kilogramul.
    note: '*al chilo* (pe kilogram) arată prețul pentru o unitate de greutate.'
  it.a1.unit08.lesson02.teach.quanto_costa_questo:
    title: Quanto costa questo?
    gloss: Cât costă asta?
    note: '*Quanto costa?* (la singular) se folosește când întrebi despre un singur produs.'
  it.a1.unit08.lesson02.teach.un_euro_e_cinquanta:
    title: Un euro e cinquanta.
    gloss: Un euro cincizeci.
    note: '*e* (și) leagă suma în euro de cenți; în italiană se spune literal „un euro și cincizeci”, în timp ce în română se spune de obicei „un euro cincizeci”.'
  it.a1.unit08.lesson02.teach.vorrei_un_chilo:
    title: Vorrei un chilo di mele, per favore.
    gloss: Aș vrea un kilogram de mere, vă rog.
    note: '*un chilo di* (un kilogram de) indică cantitatea înainte de a numi produsul.'
  it.a1.unit08.lesson03.teach.va_bene_lo_prendo:
    title: Va bene, lo prendo.
    gloss: Bine, îl iau.
    note: '*lo prendo* (îl iau) confirmă cumpărarea; *lo* se referă la produsul tocmai numit.'
  it.a1.unit08.lesson03.teach.un_chilo_mezzo_chilo:
    title: un chilo, mezzo chilo
    gloss: un kilogram, jumătate de kilogram
    note: '*mezzo* (jumătate) stă înaintea lui *chilo* pentru a arăta o cantitate mai mică.'
    example_gloss:
    - Aș vrea jumătate de kilogram de cartofi.
