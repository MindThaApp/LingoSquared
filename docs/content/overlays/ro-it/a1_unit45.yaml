    title: In + mijloc de transport, a piedi = pe jos
    gloss: 'Pentru mijloacele de transport, în italiană se spune in: in treno, in bicicletta, in macchina. Pentru „pe jos” se spune a piedi: vado a piedi.'
    note: 'În română spunem „cu trenul”, iar în italiană se spune *in treno*, fără articol: *in treno*, nu *nel treno*.'
