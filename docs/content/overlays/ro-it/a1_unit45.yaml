  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: Cine merge cum?
    gloss: Giulia călătorește în fiecare zi cu trenul la serviciu. Marco merge de obicei cu bicicleta, dar când plouă ia și trenul. Luca preferă să meargă cu mașina. Chiara locuiește aproape și merge pe jos la serviciu. Tu cum mergi la serviciu?
    note: 'Compară patru moduri de a călători și o condiție (*quando piove*, când plouă). *Andare* (a merge) este neregulat: *vado*, *va*.'
    glosses:
      viaggia: călătorește
      ogni: fiecare
      giorno: zi
      treno: tren
      lavoro: serviciu
      bicicletta: bicicletă (in bicicletta = cu bicicleta)
      solito: obișnuit (di solito = de obicei)
      piove: plouă
      prende: ia
      andare: a merge (andare in macchina = a merge cu mașina)
      preferisce: preferă
      macchina: mașină
      abita: locuiește
      vicino: în apropiere
      piedi: picioare (a piedi = pe jos)
      vai: mergi
