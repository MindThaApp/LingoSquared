  it.a1.unit45.lesson06.teach.luca_preferisco_andare:
    title: Luca preferă mașina
    gloss: 'Luca: Prefer să merg cu mașina.'
  it.a1.unit45.lesson06.teach.chiara_io_vado:
    title: Chiara merge pe jos
    gloss: 'Chiara: Eu merg pe jos, e aproape.'
