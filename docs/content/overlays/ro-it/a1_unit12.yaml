teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: diseară, mâine
    note: '*stasera* (diseară) și *domani* (mâine) sunt cele două momente folosite pentru a propune un plan.'
    example_gloss:
    - Ești liber diseară?
  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: bine / în regulă, hai să mergem
    note: '*va bene* (în regulă) acceptă o propunere; *andiamo* (hai să mergem) este forma de „noi” a verbului *andare*, folosită ca invitație.'
    example_gloss:
    - Bine, hai să mergem împreună.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: Mergem diseară la cinema?
    note: '*Andiamo* folosit ca întrebare propune să faceți ceva împreună.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: Bine, hai să mergem!
    note: '*Va bene* acceptă propunerea, iar *andiamo* repetă invitația cu entuziasm.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: La ce oră ne vedem?
    note: '*ci vediamo* (ne vedem) este forma reciprocă a verbului *vedersi*.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: Ne vedem la opt, în fața cinematografului.
    note: '*davanti a* („în fața”) împreună cu articolul indică locul întâlnirii.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: Perfect, atunci ne vedem diseară!
    note: '*a stasera* („ne vedem diseară”) este o formulă de rămas-bun care numește momentul stabilit.'
    example_gloss:
    - Perfect, atunci ne vedem mâine!
  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: Dacă diseară nu merge, mergem mâine.
    note: '*Se* („dacă”) introduce un plan alternativ pentru cazul în care primul nu merge.'
  it.a1.unit12.lesson03.teach.domani_va_bene:
    title: Sì, domani va bene.
    gloss: Da, mâine e bine.
    note: '*va bene* („e bine, merge”) confirmă că ziua alternativă este potrivită.'
    example_gloss:
    - Da, mâine îmi convine foarte bine.
