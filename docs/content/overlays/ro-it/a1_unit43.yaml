  it.a1.unit43.lesson01.cane_gatto_pesce_e:
    title: Câine, pisică, pește și pasăre
  it.a1.unit43.lesson02.prendersi_cura_di_un:
    title: Îngrijirea unui animal de companie
  it.a1.unit43.lesson03.amare_gli_animali:
