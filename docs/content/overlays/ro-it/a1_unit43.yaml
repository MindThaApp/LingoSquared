  it.a1.unit43.lesson06.l_uccello_di_nina:
    title: Pasărea Ninei
teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*Animale* este cuvântul general; *animale domestico* înseamnă animal de companie (literal, animal domestic).'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Giulia are un câine.
    - Luca are o pisică.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: '*Hai ...?* este forma de *tu* a verbului *avere*. Doar intonația transformă afirmația în întrebare.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: 'Pentru a spune că nu ai ceva, pune *non* înaintea verbului: *non ho*. Vezi nota de gramatică.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non înaintea verbului
    gloss: 'Pentru a spune că nu ai ceva, pune non înaintea verbului: Non ho tempo, Non ho animali domestici.'
    note: 'După *non ho*, substantivul nu are de obicei articol: *non ho tempo*, *non ho animali*. Și în română se spune „nu am timp”, „nu am animale”, fără articol.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: '*Portare a spasso* este o expresie fixă pentru a scoate un animal la plimbare. Pronumele stă înaintea verbului: *lo porto a spasso*.'
    example_gloss: Scot câinele la plimbare în fiecare zi.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Pronumele stau înaintea verbului
    gloss: 'Pronumele lo înlocuiește câinele și stă înaintea verbului: lo porto a spasso, gli do da mangiare.'
    note: 'În română, pronumele poate sta înaintea verbului („îl scot la plimbare”), la fel ca în italiană: *lo* și *gli* se pun în față: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Luca se joacă cu pisica lui.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: '*Ogni giorno* (în fiecare zi) stă la sfârșitul propoziției, ca în *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: '*Dare da mangiare* (a hrăni) înseamnă literal „a da de mâncare”. *Do* este forma de *io* a verbului *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Pluralul: il cane -> i cani'
    gloss: 'Pluralul schimbă ultima vocală și articolul: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: Modelul regulat al pluralului în italiană, prezentat aici pentru prima dată, cu substantive care denumesc animale.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Marco iubește câinii.
    - Chiara iubește pisicile.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: '*Amare* (a iubi) își ia complementul direct: *amo gli animali*. Substantivul la plural cere articolul de plural *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara iubește pisicile, dar nu are animale de companie
    gloss: Chiara iubește pisicile, dar nu are un animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco întreabă despre un animal de companie
    gloss: 'Marco: Ai un animal de companie, Giulia?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia are un câine
    gloss: 'Giulia: Da, am un câine.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco întreabă cum arată
    gloss: 'Marco: Cum este?'
    note: '*Com''è?* se poate folosi și pentru animale. Răspunsul folosește *è* sau *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia își descrie câinele
    gloss: 'Giulia: Are părul castaniu și este mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Animalele sunt de genul masculin sau feminin
    gloss: 'Un animal este de genul masculin sau feminin, ca o persoană: il cane este lui, la gatta este lei.'
    note: 'În italiană nu există neutru: fiecare substantiv este masculin sau feminin, deci câinele este *lui*, iar pisica este *lei*, iar pronumele se acordă (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco întreabă despre plimbări
    gloss: 'Marco: Îl scoți la plimbare în fiecare zi?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia își descrie rutina
    gloss: 'Giulia: Da, îl scot la plimbare în fiecare zi și îi dau de mâncare.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara și Luca despre animale
    gloss: 'Marco și Chiara iubesc amândoi animalele, dar niciunul dintre ei nu are un animal de companie. Marco iubește câinii, iar Chiara iubește pisicile. Luca, în schimb, are un animal de companie: o pisică. Se joacă des cu pisica lui și îi dă de mâncare în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      amano: iubesc
      entrambi: amândoi
      animali: animale
      due: doi (nessuno dei due = niciunul dintre ei)
      domestico: domestic (animale domestico = animal de companie)
      cani: câini
      gatti: pisici
      gatto: pisică
      gioca: se joacă
      dà: dă
      ogni: fiecare
      mangiare: a mânca (dare da mangiare = a hrăni, a da de mâncare)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca se joacă des cu pisica lui
    gloss: Luca se joacă des cu pisica lui.
    note: '*Spesso* (des) stă după verb: *gioca spesso*. *Giocare con* înseamnă a se juca cu.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia o întreabă pe Nina
    gloss: 'Giulia: Nina, ai și tu un animal de companie?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina are o pasăre pe nume Pico
    gloss: 'Nina: Da, am o pasăre. Se numește Pico.'
    note: '*Si chiama Pico* înseamnă că se numește Pico, literal „se cheamă Pico”.'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Reacția lui Marco
    gloss: 'Marco: Ce frumos! Ce faci cu el în fiecare zi?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Și Marco iubește păsările
    gloss: 'Marco: Și eu iubesc păsările.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia încheie conversația
    gloss: 'Giulia: Ce frumos că toți trei iubim animalele!'
    note: O replică de încheiere care leagă informațiile despre animale ale tuturor celor trei personaje.
