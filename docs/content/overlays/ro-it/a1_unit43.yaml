course:
  title: Italiană A1
  description: 'Italiană pentru începători, pentru a vorbi despre animalele de companie și animalele obișnuite: cum se numesc, îngrijirea de bază (plimbare, hrănire, joacă), cum spui ce animale iubești chiar dacă nu ai unul și pluralul în italiană.'
