course:
  title: Italiană A1
  description: Învață italiana la nivel A1 pentru salutările de zi cu zi și schimburi sociale scurte, cu explicații detaliate în română.
units:
  it.a1.unit02.origin_nationality_language:
    title: De unde ești, naționalitate și limbă
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: De unde ești? Cum întrebi și cum spui de unde ești
  it.a1.unit02.lesson02.parlare_italiano:
    title: 'Vorbim italiană: nivel și limbi'
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: Muncă și bun venit la Milano
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: de unde
    note: '*di dove* este elementul de bază pentru a întreba sau a spune de unde ești; se folosește cu *sei* (informal) sau cu *è* (formal).'
    example_gloss:
    - Sam, de unde ești?
    - Elena, de unde sunteți? (formal)
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: De unde sunteți?
    note: Întrebarea informală, folosită cu un coleg sau cu un prieten, corespunzătoare lui *tu* din Unitatea 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: De unde veniți? (formal)
    note: Întrebarea formală, corespunzătoare lui *Lei* din Unitatea 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Sunt american, din Chicago.
    note: Indică împreună naționalitatea și orașul de origine.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Sunt italiancă, din Milano.
    note: '*italiana* este forma de feminin a naționalității, folosită pentru că Elena este femeie.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: american/americancă, italian/italiancă
    note: 'Ca și în română, cuvintele pentru naționalitate își schimbă finala după genul persoanei: *-o* pentru un bărbat, *-a* pentru o femeie (*Sam è americano*, *Elena è italiana*).'
    example_gloss:
    - Sam este american.
    - Elena este italiancă.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: Vorbești italiană?
    note: Întrebarea informală, cu forma de *tu* a verbului *parlare* (a vorbi).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: Vorbiți italiană? (formal)
    note: Întrebarea formală, cu forma de *Lei* a verbului *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Vorbesc puțin italiană
    note: O modalitate modestă și frecventă de a-ți descrie nivelul; *un po'* înseamnă „puțin”.
    example_gloss: Vorbesc puțin italiană, o studiez de un an.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Vorbesc engleză.
    note: Aceeași construcție cu *parlo* (vorbesc), cu o altă limbă.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: Studiez italiana de un an.
    note: '*da un anno* înseamnă „de un an”; descrie o acțiune care a început în trecut și continuă și acum.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: De cât timp studiezi?
    note: '*Da quanto* („de cât timp”) + prezentul *studi* (studiezi, informal) întreabă de cât timp durează o activitate. Răspunzi cu același tipar: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: Vorbești bine italiană!
    note: Un compliment prietenos despre nivelul de limbă al cuiva, cu forma informală de *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Cu ce vă ocupați?
    note: Întrebarea informală, cu forma de *tu* a verbului *fare* (a face).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: Cu ce vă ocupați? (formal)
    note: Întrebarea formală, cu forma de *Lei* a verbului *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Sunt inginer
    note: 'Ca în română, numele profesiilor se folosesc de obicei fără articol: *sono ingegnere*, nu *sono un ingegnere*.'
    example_gloss: Sunt inginer, lucrez la Milano.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Sunt aici pentru muncă.
    note: '*per lavoro* explică motivul pentru care ești undeva: munca, nu turismul.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Sunt aici pentru doi ani.
    note: Aceeași construcție ca *per lavoro*, dar care indică o durată, nu un motiv.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: Ce frumos, bun venit la Milano!
    note: '*Che bello* este o reacție entuziastă frecventă, cu sensul „ce frumos / ce bine”.'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: Mulțumesc mult!
    note: Aceleași mulțumiri apăsate din Unitatea 1, spuse aici ca răspuns la o primire călduroasă.
