teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: mai mult, mai puțin
    note: '*più* (mai mult) și *meno* (mai puțin) sunt cuvintele de bază ale comparativului; se folosesc înaintea unui adjectiv sau împreună cu *di* pentru a compara.'
    example_gloss:
    - Vreau mai multă cafea, mai puțin ceai.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: decât / de
    note: 'După *più*/*meno*, *di* (de) înseamnă „decât” (*più di due euro*); înaintea articolului hotărât se contrage: *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - Cafeaua costă mai mult de două euro.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Merele costă mai mult decât roșiile.
    note: '*più dei pomodori* folosește *di* + *i* (contras în *dei*) pentru a compara cu *i pomodori*.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Roșiile costă mai puțin decât merele.
    note: '*meno delle mele* folosește *di* + *le* (contras în *delle*) pentru a compara cu *le mele*.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: Pe care le preferi, merele sau roșiile?
    note: '*Quale* (care) îi cere interlocutorului să aleagă între cele două lucruri tocmai numite.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Prefer merele.
    note: '*Preferisco* (prefer) împreună cu *le mele* (merele) răspunde la întrebare printr-o alegere.'
    example_gloss:
    - Prefer roșiile.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: ca / la fel ca
    note: '*come* (ca) se folosește cu *buono/a* pentru a compara două lucruri egale.'
    example_gloss:
    - Ceaiul este la fel de bun ca cafeaua.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Merele sunt la fel de bune ca roșiile.
    note: '*sono buone* (sunt bune, feminin plural) se acordă cu *le mele*; *come* introduce comparația de egalitate.'
