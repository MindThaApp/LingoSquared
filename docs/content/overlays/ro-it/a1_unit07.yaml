teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: cafeaua, croissantul
    note: 'Ambele substantive sunt masculine (*il*): *caffè* este espresso-ul italian obișnuit, iar *cornetto* este produsul de patiserie tipic pentru micul dejun.'
    example_gloss:
    - Aș dori o cafea, vă rog.
    - Aș dori un croissant, vă rog.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: sandvișul, apa
    note: '*panino* este masculin (*il*); *acqua* este feminin, dar primește *l''* înaintea unei vocale.'
    example_gloss:
    - Aș dori un sandviș, vă rog.
    - Aș dori o apă, vă rog.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: Ce doriți?
    note: Întrebarea politicoasă, cu forma de politețe *Lei*, pe care barmanul o adresează clientului.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: Aș dori o cafea și un croissant, vă rog.
    note: '*Vorrei* („aș dori”) este modul politicos de a comanda; cu *e* („și”) adaugi un al doilea produs.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: Aș dori două cafele, vă rog.
    note: '*due* („două”) ține locul articolului când comanzi mai multe bucăți din același lucru.'
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: Și pentru dumneavoastră?
    note: '*E per Lei?* îl întreabă pe al doilea client ce dorește, folosind forma de politețe *Lei*.'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: Asta e tot, mulțumesc.
    note: Formula obișnuită prin care închei o comandă când nu mai vrei nimic.
  it.a1.unit07.lesson03.teach.il_menu_il_conto:
    title: il menù, il conto
    gloss: meniul, nota de plată
    note: Ambele substantive sunt masculine (*il*).
    example_gloss:
    - Nota de plată, vă rog.
  it.a1.unit07.lesson03.teach.panino_acqua_conto:
    title: Un panino e un'acqua, per favore.
    gloss: Un sandviș și o apă, vă rog.
    note: '*un''acqua* folosește forma cu apostrof a lui *una* înaintea lui *acqua*, care începe cu vocală.'
