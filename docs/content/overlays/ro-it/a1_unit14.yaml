    note: '*E a te?* (și ție?) îl întreabă pe celălalt despre propria lui preferință.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: Și eu prefer cafeaua!
    note: '*Anch''io* (și eu) exprimă acordul cu o preferință tocmai spusă cu *preferisco*. (Pentru a fi de acord cu o afirmație cu *mi piace*, italiana spune *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: Eu nu, prefer ceaiul.
    note: '*A me no* (eu nu) exprimă dezacordul cu o afirmație cu *mi piace* (preia *a me* din construcția plăcerii) înainte de a spune propria preferință. Pentru a contrazice o afirmație cu *preferisco*, italiana spune în schimb *Io no*.'
    example_gloss:
    - Eu nu, prefer cafeaua.
