  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Azi este joi.
    note: '*Oggi* (azi) + *è* (este) + numele zilei răspunde direct la întrebare.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Mâine este vineri.
    note: '*Domani* (mâine) urmează același tipar ca *oggi* pentru a numi o zi.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: Ce dată este azi?
    note: '*Che data* (ce dată) se folosește în loc de *che giorno* când întrebi data din calendar, nu ziua săptămânii.'
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: ianuarie, februarie, martie, aprilie
    note: Primele patru luni ale anului în italiană; toate lunile se scriu cu literă mică, ca în română.
    example_gloss:
    - Azi este cinci ianuarie.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Azi este cinci ianuarie.
    note: Datele în italiană se formează cu *il* + numărul zilei + numele lunii, folosind numărul simplu, de exemplu *cinque*. Singura excepție este prima zi a lunii, care folosește numeralul ordinal *primo* (*il primo gennaio*).
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: 15 martie
    note: Alt exemplu de tipar zi + lună, care funcționează la fel pentru orice dată.
