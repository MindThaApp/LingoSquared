    title: Quando arrivi a Roma?
    gloss: Când ajungi la Roma?
    note: '*Quando* (când) + *arrivi* (ajungi, forma pentru tu) întreabă despre o sosire viitoare.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: Ajung joi după-amiază.
    note: '*Arrivo* (ajung) + ziua + momentul zilei formează un răspuns complet despre când ajungi.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: azi, mâine, poimâine
    note: '*Dopodomani* este un singur cuvânt pentru „poimâine” — literal *dopo* (după) + *domani* (mâine).'
    example_gloss:
