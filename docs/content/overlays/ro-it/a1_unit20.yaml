  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: e cald, e frig
    note: Pentru temperatură, italiana spune *fa caldo/freddo* (literal „face cald/frig”), cu verbul „a face”, în timp ce româna spune „e cald/frig”.
    example_gloss:
    - Azi e cald.
    - Azi e frig.
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: plouă, e soare
    note: '*Piove* este o propoziție meteo dintr-un singur cuvânt; *c''è il sole* înseamnă literal „este soarele”.'
    example_gloss:
    - Azi plouă.
    - Azi e soare.
  it.a1.unit20.lesson01.teach.che_tempo_fa:
    title: Che tempo fa oggi?
