  it.a1.unit20.lesson02.teach_restiamo_a_casa:
    title: Restiamo a casa.
    gloss: Să stăm acasă.
    note: '*Restiamo* este o formă de persoana I plural, folosită ca simplă propunere.'
    example_gloss:
    - Să stăm acasă.
  it.a1.unit20.lesson02.teach_andiamo_al_museo:
