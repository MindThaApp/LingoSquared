units:
  de.a1.unit17.gesundheit:
    title: La santé
teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: mal de tête
    note: '*Kopfschmerzen* est pluriel dans sa forme, mais s’emploie pour dire « un mal de tête ».'
    example_gloss: J’ai mal à la tête.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: mal au ventre
    note: '*Bauch* signifie ventre ; *Schmerzen* signifie douleurs.'
    example_gloss: J’ai mal au ventre.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: gorge / cou
    note: '*Hals* signifie gorge ou cou selon le contexte.'
    example_gloss: J’ai mal à la gorge.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: J’ai mal à la tête.
    note: 'Là où le français dit « avoir mal à » une partie du corps, l’allemand dit que cette partie du corps « fait mal » : *tut weh*.'
    example_gloss: J’ai mal au ventre.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: Je me sens mal.
    note: Ne traduis pas mot à mot par « je suis mauvais » ; *Mir ist schlecht* est la formule naturelle.
    example_gloss: Je me sens mal ; j’ai mal au ventre.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: Avez-vous besoin d’aide ?
    note: Le *Sie* de politesse rend la question polie.
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: J’ai besoin d’eau.
    note: '*brauche* signifie « avoir besoin de », et non « utiliser ».'
    example_gloss: 'En contexte : J’ai besoin d’eau et d’une pause.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: pause
    note: '*eine Pause* est un court moment de repos.'
    example_gloss: J’ai besoin d’une pause.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: Buvez de l’eau. Faites une pause.
    note: Le *Sie* de politesse rend la consigne polie.
    example_gloss: Faites une pause.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Le problème d’Anna
    gloss: Le problème d’Anna
    note: Le court texte indique le symptôme et le besoin immédiat.
    example_gloss: Elle a besoin d’eau.
  de.a1.unit17.lesson02.teach.line01:
    title: Felix demande à Anna comment elle va
    gloss: 'Felix : Anna, est-ce que ça va ?'
    note: 'Felix vouvoie Anna : il emploie *Ihnen*.'
  de.a1.unit17.lesson02.teach.line02:
    title: Anna dit quel est son problème
    gloss: 'Anna : Non, j’ai mal à la tête.'
    note: La réponse énonce simplement le symptôme.
  de.a1.unit17.lesson02.teach.line03:
    title: Felix propose son aide
    gloss: 'Felix : Avez-vous besoin d’aide ?'
    note: Une simple proposition d’aide.
  de.a1.unit17.lesson02.teach.line04:
    title: Anna dit de quoi elle a besoin
    gloss: 'Anna : Oui, s’il vous plaît. J’ai besoin d’eau et d’une pause.'
    note: La réponse dit *Ja, bitte* et nomme les besoins immédiats.
    example_gloss: 'En contexte : J’ai besoin d’eau et d’une pause.'
