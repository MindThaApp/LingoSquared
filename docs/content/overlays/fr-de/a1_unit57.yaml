    title: Quel verbe pour quel sport
    gloss: 'Le verbe dépend du sport : spielen avec le football, machen avec le yoga, gehen plus un infinitif avec la natation et la course.'
    note: 'Une seule construction ne couvre pas tous les sports : à ce niveau, retiens simplement le verbe qui accompagne chaque sport.'
