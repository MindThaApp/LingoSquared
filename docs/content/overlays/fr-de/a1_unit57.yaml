    gloss: 'Tu connais déjà Sport treiben grâce à la leçon sur les loisirs (Ich treibe samstags Sport). Avec un sport précis, on le nomme avec spielen ou machen : Ich spiele Fußball. Les deux sont de l’allemand correct.'
