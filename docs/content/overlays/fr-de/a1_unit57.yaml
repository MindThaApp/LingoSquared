    title: Mal pro Woche, jeden Tag et oft
    gloss: Tu connais déjà jeden Tag (tous les jours) et oft (souvent). Zwei Mal pro Woche (deux fois par semaine) est une façon nouvelle et plus précise de dire à quelle fréquence.
