    title: Le temps
teaching:
  de.a1.unit20.lesson01.teach.wetter:
    title: Wetter
    gloss: le temps (météo)
    note: '*Wetter* est neutre : *das Wetter*.'
    example_gloss: Quel temps fait-il ?
  de.a1.unit20.lesson01.teach.sonnig:
    title: sonnig
    gloss: ensoleillé
    note: Pour dire « Il y a du soleil », on utilise *Es ist sonnig*.
    example_gloss: Il y a du soleil.
  de.a1.unit20.lesson01.teach.kalt:
    title: kalt
    gloss: froid
    note: '*kalt* décrit la température.'
    example_gloss: Il fait froid.
  de.a1.unit20.lesson01.teach.warm:
    title: warm
    gloss: chaud
    note: '*warm* se prononce avec un « a » bref, un « r » allemand et un « m » bien net à la fin.'
    example_gloss: Il fait chaud.
  de.a1.unit20.lesson01.teach.regnet:
    title: Es regnet.
    gloss: Il pleut.
    note: 'En allemand, *Es* est obligatoire ici, comme « il » dans « il pleut » : ne supprime pas le sujet.'
  de.a1.unit20.lesson02.teach.dann:
    title: dann
    gloss: ensuite
    note: '*dann* relie le temps qu’il fait à un projet.'
    example_gloss: Ensuite, nous allons au café.
  de.a1.unit20.lesson02.teach.ins_cafe:
    title: Wir gehen ins Cafe.
    gloss: Nous allons au café.
    note: '*ins* signifie « dans le / au » avec les lieux neutres comme *das Cafe*.'
    example_gloss: 'En contexte : Alors on va au café.'
  de.a1.unit20.lesson02.teach.morgen:
    title: morgen
    gloss: demain
    note: Écrit avec une minuscule, *morgen* signifie « demain ».
    example_gloss: Demain, il y a du soleil.
  de.a1.unit20.lesson02.teach.forecast:
    title: Wetterbericht
    gloss: bulletin météo
    note: Les prévisions opposent aujourd’hui et demain.
    example_gloss: Demain, il y a du soleil.
  de.a1.unit20.lesson02.teach.line01:
    title: Anna demande quel temps il fait
    gloss: 'Anna : Quel temps fait-il aujourd’hui ?'
    note: Une question directe sur la météo.
  de.a1.unit20.lesson02.teach.line02:
    title: Felix décrit le temps d’aujourd’hui
    gloss: 'Felix : Il fait froid et il pleut.'
    note: La réponse associe la température et la pluie.
  de.a1.unit20.lesson02.teach.line03:
    title: Anna fait un projet
    gloss: 'Anna : Alors on va au café.'
    note: Le projet découle du temps pluvieux.
  de.a1.unit20.lesson02.teach.line04:
    title: Felix parle de demain
    gloss: 'Felix : Bonne idée. Demain, il y a du soleil.'
    note: Felix ajoute le temps de demain.
