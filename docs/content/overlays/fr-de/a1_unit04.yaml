teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: lundi
    note: En Allemagne, en Autriche et en Suisse, *Montag* est le premier jour de la semaine, comme en France.
    example_gloss: J’ai le temps lundi.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: mardi
    note: '*Dienstag* est le deuxième jour de la semaine.'
    example_gloss: J’ai le temps mardi.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: mercredi
    note: '*Mittwoch* signifie littéralement « milieu de la semaine » : c’est vraiment le jour du milieu de la semaine de travail allemande.'
    example_gloss: J’ai le temps mercredi.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: jeudi
    note: '*Donnerstag* doit son nom au dieu germanique Donar (Thor).'
    example_gloss: J’ai le temps jeudi.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: vendredi
    note: '*Freitag* doit son nom à la déesse germanique Frigg.'
    example_gloss: J’ai le temps vendredi.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: samedi
    note: '*Samstag* est le mot habituel pour « samedi » dans la plus grande partie de l’Allemagne ; *Sonnabend* est une variante régionale (nord et est de l’Allemagne).'
    example_gloss: J’ai le temps samedi.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: dimanche
    note: '*Sonntag* signifie littéralement « jour du soleil » (Sonne + Tag) ; le mot français « dimanche » a une autre origine.'
    example_gloss: J’ai le temps dimanche.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: '*heute* signifie « aujourd’hui » ; *Welcher Tag* = « quel jour ».'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: janvier
    note: '*Januar* est le premier mois de l’année.'
    example_gloss: Mon anniversaire est en janvier.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: mars
    note: '*März* est le troisième mois de l’année.'
    example_gloss: Mon anniversaire est en mars.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: mai
    note: '*Mai* est court et facile à retenir : il ressemble beaucoup au français « mai ».'
    example_gloss: Mon anniversaire est en mai.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: juillet
    note: '*Juli* est le septième mois de l’année.'
    example_gloss: Mon anniversaire est en juillet.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: septembre
    note: En allemand, *September* se termine par -er, alors qu'en français on écrit « septembre ».
    example_gloss: Mon anniversaire est en septembre.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: décembre
    note: '*Dezember* est le dernier mois de l’année.'
    example_gloss: Mon anniversaire est en décembre.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: Quel mois sommes-nous ?
    note: '*Monat* signifie « mois » ; *es* = « il » (sujet impersonnel).'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: Quelle est la date aujourd’hui ?
    note: 'Littéralement : « le combientième est aujourd’hui ? ». C’est la manière habituelle de demander la date en allemand.'
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Aujourd’hui, nous sommes le 7 juillet.
    note: 'Comme en français, l’allemand dit le jour avant le mois, mais avec un ordinal : *der siebte Juli* = « le septième (de) juillet ». Apprends *der siebte Juli* comme une expression entière.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Aujourd’hui, nous sommes mardi 7 juillet.
    note: Ajoute le jour de la semaine avant la date, séparé par une virgule.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: On peut aussi l’écrire 7.7.
    note: 'En allemand, les dates en chiffres mettent le jour d’abord, puis le mois, chacun suivi d’un point : 7.7. = 7 juillet. Contrairement au français, on utilise des points et non des barres obliques.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: Quand est votre anniversaire ?
    note: 'Littéralement « Quand avez-vous anniversaire ? » : en allemand, on dit qu''on *a* son anniversaire.'
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Mon anniversaire est le 3 mars.
    note: '*Mein Geburtstag* = « mon anniversaire » ; *der dritte März* = « le 3 mars » (le jour d’abord, puis le mois).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: ouvre
    note: '*öffnet* est la forme de la 3ᵉ personne du singulier de *öffnen* (ouvrir) ; elle sert à dire « il/elle ouvre », par exemple pour un magasin ou une bibliothèque.'
    example_gloss: Le magasin ouvre lundi.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: de nouveau
    note: '*wieder* signifie « de nouveau, à nouveau » ; ici, on l’emploie pour demander quand quelque chose rouvre.'
    example_gloss: La bibliothèque rouvre lundi.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: le / la / les
    note: '*die* est l’article défini du féminin singulier et de tous les pluriels ; ici, il accompagne le nom féminin *Bibliothek*.'
    example_gloss: La bibliothèque est grande.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: bibliothèque
    note: '*Bibliothek* est un nom féminin (*die Bibliothek*).'
    example_gloss: Je vais à la bibliothèque.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: le / à la (avec un jour ou une date)
    note: '*am* est la contraction de *an dem* ; on l’emploie devant les jours de la semaine et les dates (*am Montag* = « lundi »).'
    example_gloss: Le lundi, je travaille.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: le (masculin, accusatif)
    note: '*den* est la forme de *der* à l’accusatif masculin. On le trouve dans les dates complètes après un jour de la semaine, comme dans *am Donnerstag, den neunten Juli* : apprends-le comme un schéma figé, sans analyser le cas à ce niveau. (Tu verras aussi *dem* après *am*, qui est tout aussi correct.)'
    example_gloss: Nous nous retrouvons jeudi 9 juillet.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: neuvième
    note: '*neunten* est la forme déclinée de l’ordinal construit sur *neun* (neuf), utilisée dans les dates : *der neunte Juli* (nominatif) devient *den neunten Juli* dans cette construction de date complète.'
    example_gloss: Mon anniversaire est le 9 juillet.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix demande la date
    gloss: 'Felix dit : Quelle est la date aujourd’hui ?'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna donne la date
    gloss: 'Anna dit : Aujourd’hui, nous sommes mardi 7 juillet.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix pose une question sur la bibliothèque
    gloss: 'Felix dit : Quand la bibliothèque rouvre-t-elle ?'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna répond
    gloss: 'Anna dit : Elle rouvre jeudi 9 juillet.'
    note: 'Ici, *Sie* signifie « elle » : le mot reprend *die Bibliothek* (un nom féminin).'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix prend congé
    gloss: 'Felix dit : Bien, à jeudi.'
    note: '*bis Donnerstag* = « jusqu’à jeudi » : c’est une façon courante de dire « à jeudi ».'
  de.a1.unit04.lesson04.teach.notiz:
    title: Un mot sur la porte
    gloss: Fermé jusqu’au jeudi 9 juillet.
    note: '*Geschlossen* signifie « fermé ».'
