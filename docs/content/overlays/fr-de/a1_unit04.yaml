    title: Les jours, les mois et la date
lessons:
  de.a1.unit04.lesson01.wochentage:
    title: Les jours de la semaine
  de.a1.unit04.lesson02.monate:
    title: Les mois
  de.a1.unit04.lesson03.das_datum:
    title: Dire la date
  de.a1.unit04.lesson04.im_gespraech_ueber_das_datum:
