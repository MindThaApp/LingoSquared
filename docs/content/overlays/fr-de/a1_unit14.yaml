    title: Préférences
teaching:
  de.a1.unit14.lesson01.teach.moegen_sie:
    title: Mögen Sie Kaffee?
    gloss: Aimez-vous le café ?
    note: 'Forme de politesse de la question : *Mögen Sie...?*'
  de.a1.unit14.lesson01.teach.ich_mag:
    title: Ich mag Tee.
    gloss: J'aime le thé.
    note: '*ich mag* signifie « j''aime ».'
    example_gloss: 'En contexte : Oui, j''aime le café.'
  de.a1.unit14.lesson01.teach.nicht_moegen:
    title: Ich mag Kaffee nicht.
    gloss: Je n'aime pas le café.
    note: Contrairement au français, où ne … pas encadre le verbe, l'allemand place ici *nicht* après ce qu'on n'aime pas, et non directement après *ich*.
    example_gloss: 'En contexte : Je n''aime pas le thé.'
  de.a1.unit14.lesson01.teach.lieber:
    title: lieber
    gloss: plutôt / préférer
    note: '*lieber* exprime une préférence entre plusieurs possibilités.'
    example_gloss: 'En contexte : Je préfère boire du thé.'
  de.a1.unit14.lesson01.teach.nehmen:
    title: Ich nehme Wasser.
    gloss: Je prends de l'eau.
    note: '*nehmen* est naturel quand on choisit quelque chose.'
  de.a1.unit14.lesson01.teach.was_nehmen_sie:
    title: Was nehmen Sie?
    gloss: Qu'est-ce que vous prenez ?
    note: Question de politesse avec *Sie* pour demander le choix de quelqu'un ; la réponse utilise *ich nehme*.
    example_gloss: Qu'est-ce que vous prenez ? Je prends de l'eau.
  de.a1.unit14.lesson02.teach.aber:
    title: aber
    gloss: mais
    note: '*aber* relie deux idées qui s''opposent.'
    example_gloss: 'En contexte : J''aime le café, mais je préfère boire du thé.'
  de.a1.unit14.lesson02.teach.preference_text:
    title: Vorlieben im Cafe
    gloss: préférences au café
    note: Ce court texte oppose les choix d'Anna et de Felix.
    example_gloss: Il prend de l'eau.
  de.a1.unit14.lesson02.teach.line01:
    title: Felix demande si on aime le café
    gloss: 'Felix : Aimez-vous le café ?'
    note: Une question directe sur les goûts.
  de.a1.unit14.lesson02.teach.line02:
    title: Anna dit sa préférence
    gloss: 'Anna : Oui, j''aime le café, mais je préfère le thé.'
    note: Anna aime le café, mais elle préfère le thé.
    example_gloss: 'En contexte : Je préfère boire du thé.'
  de.a1.unit14.lesson02.teach.line03:
    title: Felix choisit l'eau
    gloss: 'Felix : Je n''aime pas le thé. Je prends de l''eau.'
    note: Felix dit ce qu'il n'aime pas, puis fait son choix.
    example_gloss: 'En contexte : Je prends de l''eau.'
  de.a1.unit14.lesson02.teach.line04:
    title: Anna choisit le thé
    gloss: 'Anna : Bien, je prends du thé.'
    note: Anna confirme son choix.
    example_gloss: 'En contexte : Je prends du thé.'
