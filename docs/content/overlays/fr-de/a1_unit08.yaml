  description: Apprends l’allemand de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées en français.
units:
  de.a1.unit08.einkaufen:
    title: 'Les achats : prix et quantités'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: une livre de pommes
    note: 'En Allemagne, *Pfund* s’emploie encore couramment à l’oral : un *Pfund* allemand correspond exactement à 500 g (un demi-kilo), même si le pays utilise officiellement le système métrique.'
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: une douzaine d’œufs
    note: '*Dutzend* signifie « douzaine » (douze).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: une bouteille d’eau
    note: '*Flasche* signifie « bouteille ».'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: un sachet de riz
    note: '*Tüte* signifie « sachet » ou « sac ».'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: un kilo de tomates
    note: '*Kilo* est l’unité de poids métrique standard ; on l’emploie bien plus que *Pfund* dès qu’il ne s’agit plus de quantités courantes et informelles.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: Combien coûtent les pommes ?
    note: '*kosten* signifie « coûter » ; littéralement : « Que coûtent les pommes ? »'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Elles coûtent deux euros la livre.
    note: 'Ici, *Sie* signifie « elles » (les pommes), et non le « vous » de politesse. Le *Sie* de politesse et le *sie* pluriel (« elles/ils ») ont exactement la même forme verbale (*kosten*) et prennent tous deux une majuscule en début de phrase : seul le contexte permet de trancher. Ici, le sujet dont on parle, ce sont les pommes, pas une personne.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: Je peux avoir deux livres, s’il vous plaît ?
    note: Une formule de demande polie, semblable à *Ich möchte..., bitte* de l’unité 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: Est-ce que c’est frais ?
    note: '*frisch* signifie « frais ». Ici, *es* reprend un nom neutre (comme das Brot) ; pour un nom masculin, tu dis *Ist er frisch?* (der Reis) et pour un nom féminin *Ist sie frisch?* (die Milch). Le pronom change selon le genre du nom : il n’est pas toujours *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: par livre
    note: '*pro* signifie « par » ; on l’emploie aussi bien sur les étiquettes de prix que dans les prix annoncés à l’oral.'
    example_gloss: Les pommes coûtent deux euros la livre.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Étiquette de prix du marché
    note: Une simple étiquette de prix qui présente trois produits avec leur prix à l’unité.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: Ça fait huit euros.
    note: '*Das macht...* est la façon habituelle d’annoncer un prix total, déjà vue dans l’unité 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix demande le prix
    gloss: 'Felix dit : Combien coûtent les pommes ?'
    note: C’est la même question que dans la leçon 2, mais cette fois dans une vraie conversation.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna donne le prix
    gloss: 'Anna dit : Elles coûtent deux euros la livre.'
    note: Une réponse complète indique le prix à l’unité.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix passe sa commande
    gloss: 'Felix dit : D’accord, je peux avoir deux livres, s’il vous plaît ?'
    note: 'Ici, *Gut* signifie « d’accord / bien » : Felix accepte le prix avant de commander.'
  de.a1.unit08.lesson04.teach.line04:
    title: Anna demande s’il désire autre chose
    gloss: 'Anna dit : Bien sûr. Et avec ceci ?'
    note: '*Natürlich* signifie « bien sûr / naturellement ».'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix commande autre chose
    gloss: 'Felix dit : Oui, et aussi une douzaine d’œufs.'
    note: '*auch* signifie « aussi ».'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna annonce le total
    gloss: 'Anna dit : Ça fait huit euros.'
    note: Deux livres de pommes (4 €) plus une douzaine d’œufs (4 €) font un total de huit euros.
