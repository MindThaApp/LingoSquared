course:
  title: Allemand A1
  description: Apprends l’allemand de niveau A1 pour les échanges du quotidien, avec des explications en français.
units:
  de.a1.unit22.gefuehle:
    title: Les émotions
teaching:
  de.a1.unit22.lesson01.teach.gefuehl:
    title: Gefühl
    gloss: sentiment / émotion
    note: '*Gefühl* est le mot général pour un sentiment.'
    example_gloss: Content est un sentiment.
  de.a1.unit22.lesson01.teach.froh:
    title: froh
    gloss: content / heureux
    note: '*froh* est un mot simple, adapté au niveau A1, pour parler d’un sentiment.'
    example_gloss: Je suis content.
  de.a1.unit22.lesson01.teach.muede:
    title: müde
    gloss: fatigué
    note: '*müde* signifie fatigué.'
    example_gloss: Je suis fatigué.
  de.a1.unit22.lesson01.teach.traurig:
    title: traurig
    gloss: triste
    note: '*traurig* signifie triste.'
    example_gloss: Je suis triste.
  de.a1.unit22.lesson01.teach.wie_fuehlen:
    title: Wie fühlen Sie sich?
    gloss: Comment te sens-tu ?
    note: Comme en français (« vous vous sentez »), l’allemand emploie ici le pronom réfléchi *sich*.
    example_gloss: 'En contexte : Comment vous sentez-vous aujourd’hui ?'
  de.a1.unit22.lesson02.teach.weil:
    title: weil
    gloss: parce que
    note: '*weil* introduit une raison.'
    example_gloss: Je suis content parce que j’ai congé.
  de.a1.unit22.lesson02.teach.frei:
    title: frei
    gloss: libre / en congé
    note: '*frei haben* signifie avoir du temps libre, être en congé.'
    example_gloss: Aujourd’hui, j’ai congé.
  de.a1.unit22.lesson02.teach.viel:
    title: viel
    gloss: beaucoup
    note: '*viel* exprime une grande quantité.'
    example_gloss: Je travaille beaucoup.
  de.a1.unit22.lesson02.teach.reason_happy:
    title: Ich bin froh, weil ich frei habe.
    gloss: Je suis content parce que j’ai congé.
    note: La phrase donne un sentiment et sa raison.
  de.a1.unit22.lesson02.teach.reason_tired:
    title: Ich bin müde, weil ich viel arbeite.
    gloss: Je suis fatigué parce que je travaille beaucoup.
    note: À ce niveau, apprends la phrase entière comme une phrase utile pour donner une raison.
  de.a1.unit22.lesson02.teach.feeling_text:
    title: Gefühle und Gründe
    gloss: sentiments et raisons
    note: Ce court texte relie chaque sentiment à une cause simple.
    example_gloss: Anna est contente.
  de.a1.unit22.lesson02.teach.line01:
    title: Felix demande à Anna comment elle va
    gloss: 'Felix : Comment vous sentez-vous aujourd’hui ?'
    note: Le *Sie* de politesse rend la question polie, comme le vouvoiement en français.
  de.a1.unit22.lesson02.teach.line02:
    title: Anna dit ce qu’elle ressent et pourquoi
    gloss: 'Anna : Je suis contente parce que je ne travaille pas aujourd’hui. Et vous ?'
    note: Anna dit ce qu’elle ressent, puis renvoie la question.
    example_gloss: 'En contexte : je suis contente parce que je ne travaille pas aujourd’hui.'
  de.a1.unit22.lesson02.teach.line03:
    title: Felix donne sa raison
    gloss: 'Felix : Je suis fatigué parce que je travaille beaucoup.'
    note: Felix dit qu’il est fatigué et explique pourquoi.
  de.a1.unit22.lesson02.teach.line04:
    title: Anna propose un café
    gloss: 'Anna : Alors on boit un café.'
    note: Anna réagit avec un projet simple et immédiat.
