course:
  title: Allemand A1
  description: 'Allemand pour débutants afin de décrire l’apparence physique d’une personne : impressions de taille et d’âge, couleur des cheveux et des yeux, la question essentielle Wie sieht ... aus ? et la comparaison de l’apparence de deux personnes.'
units:
  de.a1.unit55.aussehen:
    title: Décrire l’apparence physique
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Grand, petit, âgé et jeune
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Décrire les cheveux
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Les yeux et demander à quoi ressemble quelqu’un
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna décrit Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Comparer Jonas et Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix reconnaît Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Grand et petit
    gloss: grand / petit
    note: '*Groß* décrit une personne grande et *klein* une personne petite. Pour les personnes, l’allemand dit groß (grand) et non lang (long).'
    example_gloss:
    - Lena est grande.
    - Jonas est petit.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Alt* et *jung* décrivent ici une impression générale d''âge, pas un nombre d''années précis.'
    example_gloss:
    - Grand-père est âgé.
    - Felix est jeune.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt : un nombre ou une impression'
    gloss: Alt peut s’employer avec un nombre d’années, comme dans Ich bin dreißig Jahre alt, ou exprimer une impression générale, comme dans Opa ist alt.
    note: Tu peux demander l'âge exact de quelqu'un avec *Wie alt bist du?* Ici, *alt* décrit l'âge que quelqu'un PARAÎT avoir, sans nombre.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena est grande et Jonas est petit
    gloss: Lena est grande et Jonas est petit.
    note: Une phrase simple avec *und* (et), qui prépare la comparaison directe de la leçon 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: Les cheveux
    gloss: les cheveux
    note: '*Haare* est un nom pluriel : *die Haare*. L’allemand a aussi le singulier das Haar, mais pour les cheveux de la tête on dit en général Haare.'
    example_gloss: Felix a les cheveux courts et noirs.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: 'Trois couleurs de cheveux : blond, braun, grau. Devant un nom pluriel sans article, elles prennent -e : blonde, braune, graue Haare.'
    example_gloss:
    - Anna a les cheveux blonds.
    - Jonas a les cheveux bruns.
    - Grand-père a les cheveux gris.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Kurz* (court) et *lang* (long) décrivent la longueur des cheveux. Là encore la terminaison -e : kurze Haare, lange Haare.'
    example_gloss:
    - Lena a les cheveux longs.
    - Jonas a les cheveux courts.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare prend la terminaison -e
    gloss: 'Haare est un pluriel sans article, donc l’adjectif prend la terminaison -e : kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Sans article, un adjectif devant un nom pluriel prend -e. C'est le même schéma que pour *Augen* dans la leçon 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre : son / sa / ses (à elle)'
    gloss: 'Ihre signifie ici « ses » : ihre Haare = ses cheveux. Anna a les cheveux longs, et ses cheveux sont blonds.'
    note: '*Ihre* (avec un i minuscule) est le possessif « son/sa/ses » et s’accorde avec le nom pluriel Haare. Avec un I majuscule, *Ihre* signifie « votre/vos » (forme de politesse).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix a les cheveux courts et noirs
    gloss: Felix a les cheveux courts et noirs.
    note: 'On réutilise *schwarz* (noir), maintenant pour les cheveux : schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna a les cheveux longs et blonds
    gloss: Anna a les cheveux longs et blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Les yeux
    gloss: les yeux
    note: '*Augen* est le pluriel de *das Auge*. L''allemand emploie généralement le pluriel, car on a deux yeux.'
    example_gloss: Felix a les yeux marron.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: 'Les couleurs : blau (bleu), braun (marron) et grün (vert).'
    example_gloss:
    - Anna a les yeux bleus.
    - Jonas a les yeux marron.
    - Lena a les yeux verts.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen prend -e
    gloss: 'Augen est un pluriel, donc l’adjectif prend la terminaison -e : blaue Augen, braune Augen, grüne Augen.'
    note: 'Même règle que pour Haare : pas d’article et un nom pluriel donnent la terminaison -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Comment est Anna physiquement ?
    gloss: Comment est Anna physiquement ?
    note: '*Wie sieht ... aus?* est la question centrale de cette unité. *Aussehen* est un verbe à particule séparable : sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna a les cheveux longs et blonds et les yeux bleus
    gloss: Anna a les cheveux longs et blonds et les yeux bleus.
    note: Une réponse modèle qui réunit cheveux et yeux dans une seule phrase avec *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna présente Nina
    gloss: 'Anna : Une nouvelle fille arrive au café des langues. Elle s''appelle Nina.'
    note: '*Ein neues Mädchen kommt* présente une nouvelle personne. Après *kommt*, la direction *ins* (in das) Sprachcafé demande l''accusatif.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix demande à quoi elle ressemble
    gloss: 'Felix : D''accord ! Comment est-elle ?'
    note: 'On réutilise la question centrale de l''unité, maintenant avec *sie* (elle) au lieu d''un prénom : wie sieht sie aus ?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna décrit la taille et les cheveux de Nina
    gloss: 'Anna : Elle est petite et a les cheveux courts et blonds.'
    note: 'Associe *klein* au vocabulaire des cheveux de la leçon 02. Le second *sie* est omis : sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix demande pour ses yeux
    gloss: 'Felix : Et ses yeux ?'
    note: '*Ihre* signifie ici « ses » (possessif), et non une forme de « vous ». Il s’accorde avec le pluriel Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna décrit les yeux de Nina
    gloss: 'Anna : Elle a les yeux verts.'
    note: Reprend *grüne Augen* de la leçon 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix la reconnaîtra
    gloss: 'Felix : Merci ! Alors je la reconnaîtrai sûrement.'
    note: '*Dann erkenne ich sie bestimmt* signifie « alors je la reconnaîtrai sûrement ». Après *dann*, le verbe est en deuxième position : dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Comparaison de Jonas et Lena
    gloss: Jonas et Lena sont frère et sœur, mais ils ne se ressemblent pas. Jonas est petit et a les cheveux courts et bruns et les yeux marron. Lena est plus grande que Jonas et a de longs cheveux bruns et les yeux verts. Et toi, à quoi ressembles-tu ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      Bruder: frère
      Schwester: sœur
      sehen: apparence
      unterschiedlich: différent
      klein: petit
      kurze: petit
      braune: châtain
      Haare: cheveux
      Augen: yeux
      größer: plus grand
      lange: long
      grüne: vert
      aus: (fait partie de « aussehen » = avoir l'air, ressembler à)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: Le comparatif, encore
    gloss: 'Tu connais déjà le schéma adjectif + -er + als (que). Ici, on l''utilise pour des personnes : Lena est plus grande que Jonas.'
    note: 'Le même schéma *-er + als* que dans l''unité sur les comparaisons. Groß devient größer : la voyelle prend un tréma (Umlaut).'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena a les cheveux plus longs que Jonas
    gloss: Lena a les cheveux plus longs que Jonas.
    note: '*Längere Haare* : länger prend -e devant un nom pluriel sans article, et lang prend un Umlaut au comparatif.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: Une phrase modèle à la première personne avec *Ich habe ...*, à réutiliser pour te décrire.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix repère Nina
    gloss: 'Felix : Regarde, c''est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Schau mal* (regarde un peu) est une façon amicale d''attirer l''attention. C''est l''impératif de la forme du.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna confirme
    gloss: 'Anna : Oui, c''est Nina !'
    note: Une confirmation courte et naturelle.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina salue Felix
    gloss: 'Nina : Salut, tu es Felix ?'
    note: 'Une question simple et familière : *bist du ...?* (es-tu… ?). Bist est la forme de sein avec du.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix salue Nina à son tour
    gloss: 'Felix : Oui ! Enchanté, Nina.'
    note: '*Freut mich* est la formule habituelle pour une première rencontre, comme dans l''unité 2. Pour quelqu''un que tu connais déjà, tu dirais *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Fin du dialogue : Felix a bien reconnu Nina grâce à la description d''Anna.'
