course:
  title: Allemand A1
  description: 'Allemand pour débutants : parler des animaux de compagnie et des animaux courants, les nommer, les soins de base (promener, nourrir, jouer), dire quels animaux tu aimes même sans en avoir, et le pluriel allemand régulier.'
units:
  de.a1.unit56.tiere:
    title: Les animaux et les animaux de compagnie
lessons:
  de.a1.unit56.lesson01.hund_katze_fisch_und:
    title: Le chien, le chat, le poisson et l’oiseau
  de.a1.unit56.lesson02.sich_um_ein_haustier:
    title: S’occuper d’un animal de compagnie
  de.a1.unit56.lesson03.tiere_lieben:
    title: Adorer les animaux
  de.a1.unit56.lesson04.felix_fragt_nach_annas:
    title: Felix interroge Anna sur son chien
  de.a1.unit56.lesson05.felix_lena_und_jonas:
    title: Felix, Lena et Jonas parlent des animaux
  de.a1.unit56.lesson06.ninas_vogel:
    title: L’oiseau de Nina
teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Tier* est le mot général pour « animal » ; *Haustier* (littéralement « animal de maison ») désigne précisément un animal de compagnie.'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  de.a1.unit56.lesson01.teach.der_hund_die:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Anna a un chien.
    - Jonas a un chat.
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: 'C’est le même schéma de question *Hast du ...?* que dans les unités précédentes : le verbe est en première position.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: '*Kein* nie le nom *ein Haustier* : voir la note de grammaire.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein : nier un nom'
    gloss: 'Kein nie un nom qui serait précédé de ein- : Ich habe einen Hund, mais Ich habe kein Haustier.'
    note: '*Kein* remplace *ein* dans une phrase négative et prend les mêmes terminaisons : ein Haustier devient kein Haustier, einen Hund devient keinen Hund. Pour nier un verbe ou un adjectif, on utilise *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: Promener un animal
    gloss: promener un animal
    note: 'Un verbe à particule séparable : voir la note de grammaire.'
    example_gloss: Je promène le chien tous les jours.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen est séparable
    gloss: 'Ausführen est séparable, comme aufstehen : ich führe den Hund aus.'
    note: 'C’est exactement le même schéma que pour les verbes séparables de la routine quotidienne : radical + … + particule à la fin.'
  de.a1.unit56.lesson02.teach.futter_geben:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Jonas joue avec son chat.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: Combine *ausführen* avec *jeden Tag* (tous les jours). *Jeden* se termine par -en parce que Tag est masculin et à l’accusatif.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: 'Combine *Futter geben* avec *jeden Tag*. L’animal est au datif : der Katze (au chat).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'Les pluriels allemands varient : der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Apprends le pluriel avec chaque nom.'
    note: Premier aperçu des schémas de pluriel en allemand, avec des noms d’animaux comme exemples.
  de.a1.unit56.lesson03.teach.hunde_katzen:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Felix aime les chiens.
    - Lena aime les chats.
  de.a1.unit56.lesson03.teach.fische_voegel:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  de.a1.unit56.lesson03.teach.ich_liebe_tiere:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*Lieben* (aimer) se construit avec un complément direct, sans préposition : ich liebe Tiere.'
  de.a1.unit56.lesson03.teach.lena_liebt_katzen:
    title: Lena aime les chats, mais n’a pas d’animal
    gloss: Lena aime les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  de.a1.unit56.lesson04.teach.felix_hast_du:
    title: Felix demande si Anna a un animal
    gloss: 'Felix : Tu as un animal de compagnie, Anna ?'
  de.a1.unit56.lesson04.teach.anna_ja_ich:
    title: Anna a un chien
    gloss: 'Anna : Oui, j’ai un chien.'
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix demande à quoi il ressemble
    gloss: 'Felix : Il est comment ?'
    note: 'Reprend la question *Wie sieht ... aus?* de l’unité sur l’apparence, posée ici à propos d’un animal : wie sieht er aus ?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna décrit son chien
    gloss: 'Anna : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn pour les animaux
    gloss: 'Pour les animaux, c’est le genre du mot qui décide : der Hund est er (il), die Katze est sie (elle).'
    note: 'Comme en français, le pronom allemand suit le genre grammatical du nom : der Hund -> er (accusatif : ihn), die Katze -> sie, das Tier -> es.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix demande s’il le promène
    gloss: 'Felix : Tu le promènes tous les jours ?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna décrit sa routine
    gloss: 'Anna : Oui, je le promène tous les jours et je lui donne à manger.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena et Jonas parlent des animaux
    gloss: 'Felix et Lena aiment tous les deux les animaux, mais ni l’un ni l’autre n’a d’animal de compagnie. Felix aime les chiens et Lena aime les chats. Jonas, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, tu as un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      lieben: adorer
      beide: tous les deux
      Tiere: animaux
      beiden: tous les deux
      Haustier: animal de compagnie
      Hunde: chiens
      Katzen: chats
      Katze: chat
      spielt: joue
      gibt: donne
      jeden: tous les
      Futter: nourriture
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas joue souvent avec son chat
    gloss: Jonas joue souvent avec son chat.
    note: '*Oft* se place généralement juste après le verbe : Jonas spielt oft mit seiner Katze.'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna interroge Nina
    gloss: 'Anna : Nina, tu as aussi un animal de compagnie ?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*Er heißt Pico* reprend le verbe *heißen* de la toute première unité. Er renvoie à der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix réagit
    gloss: 'Felix : Comme c’est joli ! Qu’est-ce que tu fais avec lui tous les jours ?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: Felix aime aussi les oiseaux
    gloss: 'Felix : Moi aussi, j’aime les oiseaux.'
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna conclut la conversation
    gloss: 'Anna : C’est bien que nous trois, nous aimions les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
