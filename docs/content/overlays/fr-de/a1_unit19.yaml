    title: Le logement
teaching:
  de.a1.unit19.lesson01.teach.wohnung:
    title: Wohnung
    gloss: appartement
    note: '*Wohnung* est le mot courant pour désigner un appartement.'
    example_gloss: Mon appartement est petit.
  de.a1.unit19.lesson01.teach.zimmer:
    title: Zimmer
    gloss: pièce
    note: '*Zimmer* peut désigner une pièce d''un logement ou une chambre d''hôtel.'
    example_gloss: L'appartement a deux pièces.
  de.a1.unit19.lesson01.teach.kueche:
    title: Küche
    gloss: cuisine
    note: '*Küche* est la pièce où l''on cuisine.'
    example_gloss: La cuisine est lumineuse.
  de.a1.unit19.lesson01.teach.bad:
    title: Bad
    gloss: salle de bains
    note: '*Bad* est le mot court et courant pour la salle de bains.'
    example_gloss: La salle de bains est petite.
  de.a1.unit19.lesson01.teach.hell:
    title: hell
    gloss: lumineux
    note: '*hell* décrit une pièce bien éclairée.'
    example_gloss: Mon appartement est lumineux.
  de.a1.unit19.lesson02.teach.wohnzimmer:
    title: Wohnzimmer
    gloss: salon
    note: '*Wohnzimmer* signifie littéralement « pièce de vie ».'
    example_gloss: La table est dans le salon.
  de.a1.unit19.lesson02.teach.tisch:
    title: Tisch
    gloss: table
    note: '*Tisch* est masculin : *der Tisch*.'
    example_gloss: Il y a une table.
  de.a1.unit19.lesson02.teach.stuhl:
    title: Stuhl
    gloss: chaise
    note: '*Stuhl* désigne une chaise.'
    example_gloss: Il y a une chaise.
  de.a1.unit19.lesson02.teach.es_gibt:
    title: Es gibt einen Tisch.
    gloss: Il y a une table.
    note: '*Es gibt* est l''expression de base pour dire « il y a ».'
    example_gloss: Il y a une table dans le salon.
  de.a1.unit19.lesson02.teach.steht:
    title: Der Tisch steht im Wohnzimmer.
    gloss: La table est dans le salon.
    note: En allemand, on emploie souvent *steht* (littéralement « se tient debout ») pour dire où se trouve un meuble.
  de.a1.unit19.lesson02.teach.home_text:
    title: Wohnung in Berlin
    gloss: appartement à Berlin
    note: La courte description indique le lieu, les pièces et les meubles.
    example_gloss: Mon appartement est à Berlin.
  de.a1.unit19.lesson02.teach.line01:
    title: Felix pose des questions sur l'appartement
    gloss: 'Felix : Comment est votre appartement, Anna ?'
    note: '*Ihre*, la forme de politesse, correspond à *Sie*.'
    example_gloss: Comment est votre appartement ?
  de.a1.unit19.lesson02.teach.line02:
    title: Anna décrit les pièces
    gloss: 'Anna : Mon appartement est petit mais lumineux. Il a deux pièces, une cuisine et une salle de bains.'
    note: 'Anna indique la taille, la luminosité et le nombre de pièces. Ici, *Sie hat* signifie « il a » : *Sie* reprend *die Wohnung*.'
    example_gloss: Il a deux pièces.
  de.a1.unit19.lesson02.teach.line03:
    title: Felix pose une question sur les meubles
    gloss: 'Felix : Y a-t-il une table ?'
    note: '*Gibt es...?* sert à demander si quelque chose existe.'
  de.a1.unit19.lesson02.teach.line04:
    title: Anna dit où se trouve la table
    gloss: 'Anna : Oui, la table est dans le salon.'
    note: La réponse indique l'emplacement du meuble.
    example_gloss: La table est dans le salon.
