teaching:
  de.a1.unit12.lesson01.teach.zeit_haben:
    title: Haben Sie morgen Zeit?
    gloss: Avez-vous du temps demain ?
    note: En allemand, on dit « avoir du temps » avec *Zeit haben*, comme en français.
  de.a1.unit12.lesson01.teach.gehen_wir:
    title: Gehen wir ins Museum?
    gloss: On va au musée ?
    note: '*Gehen wir...?* est une façon courte de proposer de faire quelque chose ensemble.'
  de.a1.unit12.lesson01.teach.ja_gern:
    title: Ja, gern.
    gloss: Oui, volontiers.
    note: '*gern* rend l’acceptation chaleureuse et naturelle.'
  de.a1.unit12.lesson01.teach.leider:
    title: leider
    gloss: malheureusement
    note: '*Leider* adoucit un refus.'
    example_gloss: 'En contexte : Malheureusement, je ne peux pas.'
  de.a1.unit12.lesson01.teach.kann_nicht:
    title: Leider kann ich nicht.
    gloss: Malheureusement, je ne peux pas.
    note: Après *Leider* en début de phrase, le verbe *kann* vient avant *ich*.
  de.a1.unit12.lesson02.teach.am_abend:
    title: am Abend
    gloss: le soir
    note: On emploie *am* avec les moments de la journée.
    example_gloss: 'En contexte : Oui, le soir.'
  de.a1.unit12.lesson02.teach.um_wie_viel_uhr:
    title: Um wie viel Uhr?
    gloss: À quelle heure ?
    note: Utilise cette question pour demander l’heure exacte.
  de.a1.unit12.lesson02.teach.vor_dem_museum:
    title: um achtzehn Uhr vor dem Museum
    gloss: à 18 h devant le musée
    note: En Allemagne, les horaires sont souvent indiqués sur 24 heures.
  de.a1.unit12.lesson02.teach.einladung_text:
    title: Nachricht von Anna
    gloss: message d’Anna
    note: Une courte invitation peut mentionner l’activité, le jour, l’heure et le lieu.
    example_gloss: Le message est d’Anna.
  de.a1.unit12.lesson02.teach.line01:
    title: Anna demande si Felix est libre
    gloss: 'Anna : Avez-vous du temps demain ?'
    note: Le projet commence par une vérification des disponibilités.
  de.a1.unit12.lesson02.teach.line02:
    title: Felix dit quand il est libre
    gloss: 'Felix : Oui, le soir.'
    note: Une réponse courte peut indiquer le moment de la journée où l’on est disponible.
  de.a1.unit12.lesson02.teach.line03:
    title: Anna propose le musée
    gloss: 'Anna : On va au musée ?'
    note: Cette phrase propose l’activité.
  de.a1.unit12.lesson02.teach.line04:
    title: Felix accepte
    gloss: 'Felix : Oui, volontiers. À quelle heure ?'
    note: Felix accepte et demande l’heure.
    example_gloss: 'En contexte : À quelle heure ?'
  de.a1.unit12.lesson02.teach.line05:
    title: Anna donne l’heure et le lieu
    gloss: 'Anna : À 18 h devant le musée.'
    note: La réponse donne à la fois l’horaire et le lieu de rendez-vous.
  de.a1.unit12.lesson02.teach.line06:
    title: Felix confirme
    gloss: 'Felix : Très bien, à demain.'
    note: Une formule de clôture naturelle une fois le projet arrêté.
