    title: Jonas consulte la météo chaque matin
    gloss: Jonas consulte la météo chaque matin.
  de.a1.unit59.lesson05.teach.lena_schickt_anna:
    title: Lena envoie souvent un message à Anna
    gloss: Lena envoie souvent un message à Anna.
  de.a1.unit59.lesson06.teach.anna_ich_sehe:
    title: Anna confirme le projet
    gloss: 'Anna : Je vois le message. On fait du sport samedi à dix heures au parc ?'
  de.a1.unit59.lesson06.teach.felix_ja_und:
    title: Felix confirme la météo
    gloss: 'Felix : Oui, et samedi, il y a du soleil !'
  de.a1.unit59.lesson06.teach.jonas_dann_jogge:
    title: Le projet de Jonas
    gloss: 'Jonas : Alors je cours. Après, je joue aussi au foot.'
    note: '*Danach* (après) est en première position, donc le verbe vient juste après : danach spiele ich.'
  de.a1.unit59.lesson06.teach.lena_ich_schwimme:
    title: Le projet de Lena
    gloss: 'Lena : Je préfère nager, mais je viens aussi au parc.'
    note: '*Lieber* (plutôt, de préférence) se place juste après le verbe : ich schwimme lieber.'
  de.a1.unit59.lesson06.teach.anna_schoen_bis:
    title: Anna conclut la conversation
    gloss: 'Anna : Super ! À samedi au parc !'
    note: Conclut en une phrase l’échange de messages de cette unité et le programme de l’unité sur le sport.
