  de.a1.unit59.lesson02.teach.du_kennst_schon:
    title: Wetterbericht et Nachricht
    gloss: Tu connais déjà der Wetterbericht (Wetter + Bericht). Die Nachricht désigne un message que tu peux envoyer (ich schicke, du schickst) ou lire (ich lese, du liest).
    note: Associe le nouveau mot au nom composé déjà appris dans l’unité sur la météo.
  de.a1.unit59.lesson02.teach.anna_schickt_eine:
    title: Anna envoie un message par l’appli
    gloss: Anna envoie un message par l’appli.
    note: '*Schicken* (envoyer) : ich schicke, sie schickt. Le message est le complément d’objet direct, donc il se met à l’accusatif : eine Nachricht.'
  de.a1.unit59.lesson02.teach.felix_liest_die:
    title: Felix lit le message
    gloss: Felix lit le message.
  de.a1.unit59.lesson03.teach.nachschauen:
    title: Chercher
    gloss: chercher
    example_gloss: Je consulte les prévisions météo.
  de.a1.unit59.lesson03.teach.nachschauen_ist_trennbar:
    title: Nachschauen est séparable
    gloss: 'Nachschauen est séparable, comme aufstehen et ausführen : ich schaue nach, du schaust nach. Mais benutzen n’est pas séparable : ich benutze es.'
    note: 'À l’opposé des verbes séparables vus dans l’unité sur les routines : benutzen (avec le préfixe be-) ne se sépare jamais.'
  de.a1.unit59.lesson03.teach.jonas_schaut_im:
    title: Jonas consulte la météo
    gloss: Jonas consulte la météo.
  de.a1.unit59.lesson03.teach.dann_geht_er:
    title: Ensuite, il va courir
    gloss: Ensuite, il va courir.
    note: 'Reprend *joggen*, déjà vu dans l’unité sur le sport. Après dann, le verbe est en deuxième position : dann geht er joggen.'
  de.a1.unit59.lesson04.teach.anna_wollen_wir:
    title: Anna fait une proposition
    gloss: 'Anna : On fait du sport samedi à dix heures ?'
  de.a1.unit59.lesson04.teach.felix_gute_idee:
    title: Felix est d’accord
    gloss: 'Felix : Bonne idée ! Je regarde la météo.'
    note: Reprend *Gute Idee*, déjà vu dans l’unité sur les projets.
  de.a1.unit59.lesson04.teach.felix_am_samstag:
    title: Felix vérifie la météo
    gloss: 'Felix : Samedi, il y a du soleil !'
    note: Reprend *sonnig*, déjà vu dans l’unité sur la météo.
  de.a1.unit59.lesson04.teach.jonas_ich_sehe:
    title: Jonas voit le message
    gloss: 'Jonas : Je vois le message. À samedi !'
  de.a1.unit59.lesson04.teach.du_kennst_schon:
    title: Bis bald et Bis + un jour
    gloss: 'Tu connais déjà Bis bald ! Tu peux aussi nommer un jour : Bis Samstag !, Bis morgen !'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  de.a1.unit59.lesson05.teach.anna_ruft_felix:
    title: Qui utilise quoi ?
    gloss: Anna appelle Felix tous les jours. Elle utilise son téléphone, pas une appli. Felix n’a pas d’ordinateur à la maison, mais il utilise Internet sur son téléphone. Jonas consulte la météo chaque matin. Ensuite, il va courir. Lena envoie souvent un message à Anna. Et toi, tu utilises aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
