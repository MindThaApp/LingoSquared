teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: Comment vous appelez-vous ? (forme de politesse)
    note: '*Wie heißen Sie?* demande littéralement « comment êtes-vous appelé », avec la forme de politesse *Sie* vue à l’unité 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: Je m’appelle Anna.
    note: '*heißen* signifie « s’appeler » : c’est la façon habituelle de donner son nom.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: Comment t’appelles-tu ? (forme familière)
    note: La version familière, avec *du* vu à l’unité 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Je m’appelle Felix.
    note: Même construction que *Ich heiße Anna*, avec un autre prénom.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Enchanté(e).
    note: Une façon courte et fréquente de dire qu’on est content de rencontrer quelqu’un, utilisable dans les deux registres.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Moi de même. / Tout le plaisir est pour moi.
    note: 'La réponse naturelle à *Freut mich* : littéralement « tout à fait de mon côté ».'
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: je
    note: En allemand, *ich* s'écrit avec une minuscule, sauf en début de phrase (comme dans *Ich bin Anna.*), exactement comme « je » en français.
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: tu (forme familière)
    note: Déjà vu à l’unité 1 ; on le revoit ici comme sujet d’une phrase complète.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Je suis Anna.
    note: '*bin* est la forme de *sein* (être) avec *ich*.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: Tu es Felix.
    note: '*bist* est la forme de *sein* avec *du*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: l’Allemagne
    note: 'En allemand, les noms de pays n''ont généralement pas d''article : on dit simplement *Deutschland*, et non *das Deutschland*.'
    example_gloss: Je viens d’Allemagne.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: l’Angleterre
    note: Ce nom s'écrit autrement qu'en français (Angleterre) et se prononce avec les sons de l'allemand.
    example_gloss: Je viens d’Angleterre.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: la France
    note: 'Attention : l''orthographe allemande *Frankreich* diffère du français « France ».'
    example_gloss: Je viens de France.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: l’Italie
    note: Se prononce à peu près « i-TA-li-en ».
    example_gloss: Je viens d’Italie.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: l’Espagne
    note: Se prononce à peu près « CHPA-ni-en ».
    example_gloss: Je viens d’Espagne.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: la Russie
    note: Formé de *Russ-* + *-land*, comme *Deutschland*.
    example_gloss: Je viens de Russie.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: D’où venez-vous ? (forme de politesse)
    note: '*Woher* signifie « d’où » : comme en français, le sens de « de » est déjà inclus dans le mot interrogatif.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: Je viens d’Allemagne.
    note: '*aus* + nom de pays exprime l’origine ; pas besoin ici d’un adjectif de nationalité.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: D’où viens-tu ? (forme familière)
    note: La version familière, avec *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: Je viens d’Angleterre.
    note: Même construction que *Ich komme aus Deutschland*, avec un autre pays.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: Et vous ? (forme de politesse)
    note: Une façon courte de renvoyer la question, au même registre que *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix salue Anna
    gloss: 'Felix dit : Bonjour !'
    note: Felix et Anna sont voisins et se sont déjà croisés une fois (unité 1), sans échanger leurs prénoms. Ils se retrouvent, cette fois à l’arrêt de bus.
  de.a1.unit02.lesson05.teach.line02:
    title: Anna répond à la salutation et demande son nom
    gloss: 'Anna dit : Bonjour ! Comment vous appelez-vous ?'
    note: Anna emploie le *Sie* de politesse, comme dans l’unité 1, où ils se sont rencontrés en tant qu’inconnus.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix donne son nom et pose la question en retour
    gloss: 'Felix dit : Je m’appelle Felix. Et vous ?'
    note: Felix répond et retourne la question sur le ton de la politesse.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna donne son nom
    gloss: 'Anna dit : Je m’appelle Anna. Enchantée.'
    note: Anna répond de la même manière et ajoute une formule de politesse.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix répond et demande d’où elle vient
    gloss: 'Felix dit : Moi de même. D’où venez-vous ?'
    note: Felix retourne la formule de politesse et oriente la conversation vers l’origine.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna répond et pose la question en retour
    gloss: 'Anna dit : Je viens d’Allemagne. Et vous ?'
    note: Cela confirme qu’Anna est allemande, ce qui est logique pour deux voisins dans une ville germanophone.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix répond
    gloss: 'Felix dit : Je viens d’Angleterre.'
    note: 'On apprend maintenant que Felix vient d’Angleterre : c’est un voisin anglais qui vit en Allemagne.'
  de.a1.unit02.lesson05.teach.line08:
    title: Anna dit au revoir
    gloss: 'Anna dit : Au revoir !'
    note: La formule d’au revoir polie de l’unité 1, en accord avec le *Sie* qu’ils continuent d’employer.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix dit au revoir
    gloss: 'Felix dit : Au revoir !'
    note: Felix termine de la même façon, en gardant le même registre tout au long de cette rencontre.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Un court profil écrit
    gloss: 'Nom : Felix. Pays : Angleterre.'
    note: 'Une fiche de profil simple, avec un nom et une information d’identité : ce que Felix a dit à voix haute plus tôt dans le dialogue.'
