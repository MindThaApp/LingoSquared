course:
  title: Allemand A1
  description: Apprends l’allemand de niveau A1 pour les échanges du quotidien, avec des explications en français.
units:
  de.a1.unit21.kleidung:
    title: Les vêtements
teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: vêtements
    note: '*Kleidung* est un mot général pour parler des vêtements.'
    example_gloss: J’achète des vêtements.
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: chemise
    note: '*Hemd* désigne une chemise, souvent une chemise à boutons.'
    example_gloss: Je cherche une chemise.
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: pantalon
    note: En allemand, *Hose* est au singulier pour désigner un seul pantalon, alors qu'en français on dit aussi « un pantalon » au singulier.
    example_gloss: Je cherche un pantalon.
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: veste
    note: '*Jacke* ressemble au français « jaquette » ou « jacquette », mais désigne une veste.'
    example_gloss: La veste est chaude.
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: Je cherche une chemise.
    note: '*suche* est utile dans les magasins : je cherche.'
    example_gloss: Je cherche une veste.
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: taille
    note: '*Größe* désigne la taille d’un vêtement.'
    example_gloss: Taille M, s’il vous plaît.
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: bleu
    note: Pour demander une couleur, l’allemand peut dire *in Blau* (littéralement « en bleu »), comme le français dit « en bleu ».
    example_gloss: Je cherche une chemise bleue.
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: rouge
    note: '*rot* signifie rouge.'
    example_gloss: La veste est rouge.
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: La chemise va bien.
    note: '*passt* signifie « va bien » (taille) pour un vêtement.'
    example_gloss: 'En contexte : Oui, la chemise me va bien.'
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: Je cherche une chemise bleue, taille M.
    note: La demande indique l’article, la couleur et la taille.
  de.a1.unit21.lesson02.teach.label:
    title: Kleidungsetikett
    gloss: étiquette de vêtement
    note: Une étiquette peut indiquer la couleur, la taille et le prix.
    example_gloss: 'Couleur : bleu. Taille : M.'
  de.a1.unit21.lesson02.teach.line01:
    title: Le vendeur demande
    gloss: 'Le vendeur : Bonjour. Que cherchez-vous ?'
    note: Un vendeur demande au client ce qu’il cherche.
    example_gloss: Que cherchez-vous ?
  de.a1.unit21.lesson02.teach.line02:
    title: Felix indique l’article, la couleur et la taille
    gloss: 'Felix : Je cherche une chemise bleue, taille M.'
    note: Felix donne les trois précisions demandées.
  de.a1.unit21.lesson02.teach.line03:
    title: Le vendeur propose l’article
    gloss: 'Le vendeur : Voilà. Voulez-vous l’acheter ?'
    note: Le *Sie* de politesse garde l’échange poli dans le magasin.
    example_gloss: Voulez-vous l’acheter ?
  de.a1.unit21.lesson02.teach.line04:
    title: Felix vérifie la taille et demande le prix
    gloss: 'Felix : Oui, la chemise me va bien. Combien coûte-t-elle ?'
    note: Felix dit que ça va et demande le prix.
    example_gloss: 'En contexte : Oui, la chemise me va bien.'
exercises:
  de.a1.unit21.lesson01.exercise01.listen_hemd:
    instruction: Écoute et choisis le vêtement que tu entends.
    correct_option: Hemd
    distractors:
    - Hose
    - Jacke
    - Kleidung
    accepted_answers:
    - value: Hemd
      status: correct
    feedback: '*Hemd* signifie chemise.'
  de.a1.unit21.lesson01.exercise02.choose_shirt:
    instruction: Quelle phrase signifie « Je cherche une chemise » ?
    correct_option: Ich suche ein Hemd.
    distractors:
    - Ich suche Hemd ein.
    - Ich bin suche ein Hemd.
    - Ich suche eine Hemd.
    accepted_answers:
    - value: Ich suche ein Hemd.
      status: correct
    feedback: Utilise *Ich suche* suivi de l’article.
  de.a1.unit21.lesson01.exercise03.match_clothes:
    instruction: Associe chaque mot allemand à sa signification.
    accepted_answers:
    - value:
      - left: les vêtements (le mot général)
        right: Kleidung
      - left: la chemise
        right: Hemd
      - left: le pantalon
        right: Hose
      - left: la veste
        right: Jacke
      - left: (je) cherche
        right: suche
      - left: (j’)achète
        right: kaufe
      status: correct
    feedback: Ces mots servent à formuler une demande simple en matière de vêtements.
    pairs:
    - left: les vêtements (le mot général)
      right: Kleidung
    - left: la chemise
      right: Hemd
    - left: le pantalon
      right: Hose
    - left: la veste
      right: Jacke
    - left: (je) cherche
      right: suche
    - left: (j’)achète
      right: kaufe
    localize_pair_lefts: 'yes'
