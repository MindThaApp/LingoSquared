      geduldig: patient
      arbeitet: travaille
      Krankenschwester: infirmière
      lustig: drôle
      besucht: suit / fréquente
      Kurs: cours
      Spanisch: espagnol
      neugierig: curieux
      lernt: apprend
      gern: aime
