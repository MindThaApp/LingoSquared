    title: La construction Ich finde
    gloss: '*Ich finde* + personne + trait de caractère dit ce que tu penses de quelqu''un : je trouve Lena curieuse.'
    note: 'Comme en français avec « je trouve », *Ich finde* + personne + adjectif exprime une opinion : la personne est un complément d''objet, donc à l''accusatif (Ich finde Lena neugierig). Le même schéma sert pour toute opinion : Ich finde den Kaffee gut.'
