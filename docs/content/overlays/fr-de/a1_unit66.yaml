  de.a1.unit66.lesson05.teach.nina_ist_neu:
    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café linguistique. Elle demande à Felix comment sont les autres. Felix lui raconte. Anna est gentille et patiente ; elle travaille comme infirmière. Jonas est drôle et suit un cours d'espagnol. Lena est curieuse ; elle aime apprendre de nouvelles choses. Felix, lui, est calme.
    note: Ce texte récapitule les traits de caractère des membres du groupe en les comparant.
