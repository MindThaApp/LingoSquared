teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: salut / bonjour
    note: '*Hallo* est une salutation décontractée qui convient à tout moment de la journée, comme « salut » en français.'
    example_gloss: Salut, Felix !
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: bonjour
    note: '*Guten Morgen* s’emploie le matin, à peu près jusqu’à la fin de la matinée.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: bonjour
    note: '*Guten Tag* est la salutation habituelle de la journée, un peu plus formelle ; on l’emploie de la fin de la matinée jusqu’à l’après-midi.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: bonsoir
    note: '*Guten Abend* s’emploie quand on arrive quelque part le soir : c’est une salutation, pas une formule d’adieu.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: salut (au revoir)
    note: '*Tschüss* est une façon décontractée et très courante de dire au revoir entre amis et connaissances.'
    example_gloss: Salut, à bientôt !
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: au revoir (formel)
    note: '*Auf Wiedersehen* signifie littéralement « jusqu’à ce qu’on se revoie » : c’est la formule d’adieu habituelle, plus formelle, adaptée avec des inconnus ou dans un cadre professionnel.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: à bientôt
    note: '*Bis bald* est une façon amicale de dire au revoir quand on pense revoir la personne bientôt.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: à plus tard
    note: '*Bis später* s’emploie quand on reverra la personne plus tard dans la même journée.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: bonne nuit
    note: '*Gute Nacht* se dit quand quelqu’un va se coucher ou termine sa journée : contrairement à *Guten Abend*, c’est une formule d’adieu, pas une salutation.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: vous (formel)
    note: '*Sie* est le « vous » de politesse ; il prend toujours une majuscule, même au milieu d’une phrase. On l’emploie avec des inconnus, des personnes plus âgées ou dans des situations formelles ou professionnelles. Comme en français avec « vous », il s’accompagne de la 3e personne du pluriel du verbe.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: tu (informel)
    note: '*du* est le « tu » informel, employé avec les amis, la famille et les enfants. Employer *du* avec un inconnu peut sembler trop familier, voire impoli.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: Comment allez-vous ? (formel)
    note: 'La façon formelle de demander comment va quelqu’un : *Ihnen* est le datif de politesse de « vous », en accord avec le registre de *Sie*.'
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: Ça va ? (informel)
    note: '*Wie geht''s* est la contraction de *Wie geht es* : c’est la façon informelle et courante de demander comment va quelqu’un.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Bien, merci.
    note: Une réponse simple et neutre, utilisable dans les deux registres.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Très bien, merci.
    note: Une réponse plus enthousiaste que *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: Et vous ? (formel)
    note: La façon formelle de renvoyer la question, en accord avec le registre de *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: Et toi ? (informel)
    note: 'La façon informelle de renvoyer la question : *dir* est le datif de « tu », en accord avec le registre de *du*.'
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: merci
    note: '*Danke* est déjà apparu dans les réponses précédentes ; ici, c’est le mot employé seul.'
    example_gloss: Merci beaucoup !
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: s’il vous plaît / de rien
    note: '*Bitte* a vraiment deux sens courants selon le contexte : « s’il vous plaît / s’il te plaît » quand on fait une demande, ou « de rien » quand on répond à un remerciement. C’est le contexte qui indique le sens ; ce n’est ni un hasard ni une erreur, les deux emplois sont tout à fait standard.'
    example_gloss:
    - Un café, s’il vous plaît.
    - Je vous en prie !
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: excusez-moi / pardon
    note: '*Entschuldigung* s’emploie aussi bien pour attirer poliment l’attention de quelqu’un que pour s’excuser brièvement.'
    example_gloss: Excusez-moi, où sont les toilettes ?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: pas de problème
    note: Une réponse décontractée et amicale, proche par le ton de « pas de problème » en français.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: avec plaisir
    note: Une façon plus complète et plus explicite de dire « de rien » que le simple *Bitte*.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna salue Felix
    gloss: 'Anna dit : Bonjour !'
    note: 'Anna et Felix se rencontrent pour la première fois : ils sont voisins dans le même immeuble.'
  de.a1.unit01.lesson05.teach.line02:
    title: Felix rend la salutation et demande comment elle va
    gloss: 'Felix dit : Bonjour ! Comment allez-vous ?'
    note: Felix emploie le registre formel *Sie*, car ils viennent de se rencontrer.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna répond et renvoie la question
    gloss: 'Anna dit : Bien, merci. Et vous ?'
    note: Anna répond et renvoie la question de façon formelle, en accord avec le registre de Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix répond
    gloss: 'Felix dit : Très bien, merci.'
    note: Une réponse un peu plus enthousiaste qu’un simple *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Anna dit au revoir
    gloss: 'Anna dit : Au revoir !'
    note: Anna emploie la formule d’adieu plus formelle, en accord avec le registre *Sie* utilisé depuis le début.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix dit au revoir et à bientôt
    gloss: 'Felix dit : Au revoir, à bientôt !'
    note: Felix associe l’adieu formel à « à bientôt », en restant fidèle au registre *Sie* que les deux interlocuteurs ont employé pendant toute cette première rencontre.
