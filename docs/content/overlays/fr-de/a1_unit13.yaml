course:
  title: Allemand A1
  description: Apprends l’allemand de niveau A1 pour les échanges du quotidien, avec des explications en français.
units:
  de.a1.unit13.vergangenes:
    title: Événements passés
teaching:
  de.a1.unit13.lesson01.teach.gestern:
    title: gestern
    gloss: hier
    note: '*gestern* situe l’événement dans le passé récent.'
    example_gloss: Hier, j’étais au parc.
  de.a1.unit13.lesson01.teach.gemacht:
    title: Was haben Sie gestern gemacht?
    gloss: Qu’avez-vous fait hier ?
    note: Comme le passé composé français, l’allemand emploie souvent *haben* avec un participe passé pour les événements récents et terminés.
  de.a1.unit13.lesson01.teach.gekauft:
    title: Ich habe Brot gekauft.
    gloss: J’ai acheté du pain.
    note: Le participe *gekauft* se place à la fin.
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: J’ai mangé de la soupe.
    note: '*gegessen* est le participe passé de *essen*.'
    example_gloss: 'En contexte : j’ai acheté du pain et mangé de la soupe.'
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: Je suis allé(e) au marché.
    note: Un déplacement vers un lieu se construit avec *bin ... gegangen*, et non *habe ... gegangen*.
  de.a1.unit13.lesson02.teach.war:
    title: Es war sehr gut.
    gloss: C’était très bien.
    note: '*war* est le prétérit de *sein* (être) : *es ist* (c’est) devient *es war* (c’était).'
  de.a1.unit13.lesson02.teach.bericht_text:
    title: Kurzer Bericht
    gloss: court compte rendu
    note: Le compte rendu présente plusieurs actions terminées à la suite.
    example_gloss: Hier, je suis allé(e) au marché.
  de.a1.unit13.lesson02.teach.line01:
    title: Felix demande ce qui s’est passé hier
    gloss: 'Felix : Qu’avez-vous fait hier ?'
    note: Une manière courante de demander ce qu’on a fait hier.
  de.a1.unit13.lesson02.teach.line02:
    title: Anna raconte sa journée
    gloss: 'Anna : Je suis allée au marché. J’ai acheté du pain et mangé de la soupe.'
    note: Anna emploie *bin* pour aller quelque part et *habe* pour acheter et manger.
    example_gloss: 'En contexte : j’ai acheté du pain.'
  de.a1.unit13.lesson02.teach.line03:
    title: Felix demande comment c’était
    gloss: 'Felix : C’était bien ?'
    note: '*War es gut?* demande comment c’était.'
  de.a1.unit13.lesson02.teach.line04:
    title: Anna dit que c’était bien
    gloss: 'Anna : Oui, c’était très bien.'
    note: Une simple appréciation pour conclure.
