teaching:
  de.a1.unit18.lesson01.teach.beruf:
    title: Beruf
    gloss: métier / profession
    note: '*Beruf* est le mot général pour désigner la profession de quelqu’un.'
    example_gloss: Je suis ingénieur de métier.
  de.a1.unit18.lesson01.teach.ingenieur:
    title: Ingenieur
    gloss: ingénieur
    note: Comme en français (« Je suis ingénieur »), l’allemand dit normalement *Ich bin Ingenieur*, sans article.
    example_gloss: Je suis ingénieur.
  de.a1.unit18.lesson01.teach.lehrerin:
    title: Lehrerin
    gloss: enseignante
    note: '*Lehrerin* est le nom de métier au féminin.'
    example_gloss: Elle est enseignante.
  de.a1.unit18.lesson01.teach.kellnerin:
    title: Kellnerin
    gloss: serveuse
    note: Cela correspond au travail d’Anna au café.
    example_gloss: Anna est serveuse au café.
  de.a1.unit18.lesson01.teach.was_machen_sie:
    title: Was machen Sie beruflich?
    gloss: Quel métier fais-tu ?
    note: '*beruflich* fait porter la question sur le travail, et non sur les activités en général.'
  de.a1.unit18.lesson02.teach.buero:
    title: Büro
    gloss: bureau
    note: '*im Büro* signifie « au bureau ».'
    example_gloss: Je travaille au bureau.
  de.a1.unit18.lesson02.teach.arbeite:
    title: Ich arbeite im Cafe.
    gloss: Je travaille au café.
    note: '*arbeite* est la forme de la première personne : je travaille.'
  de.a1.unit18.lesson02.teach.bringe:
    title: Ich bringe Kaffee und Tee.
    gloss: J’apporte du café et du thé.
    note: '*bringe* exprime une activité professionnelle simple.'
  de.a1.unit18.lesson02.teach.work_profile:
    title: Arbeitsprofile
    gloss: profils professionnels
    note: Le profil indique le métier, le lieu de travail et l’activité.
    example_gloss: Il travaille au bureau.
  de.a1.unit18.lesson02.teach.line01:
    title: Anna pose une question sur le travail
    gloss: 'Anna : Que faites-vous dans la vie ?'
    note: Une question polie sur le travail.
  de.a1.unit18.lesson02.teach.line02:
    title: Felix décrit son travail
    gloss: 'Felix : Je suis ingénieur. Je travaille au bureau. Et vous ?'
    note: Felix indique sa profession et son lieu de travail.
    example_gloss: Je travaille au bureau.
  de.a1.unit18.lesson02.teach.line03:
    title: Anna décrit son travail au café
    gloss: 'Anna : Je travaille au café. J’apporte du café et du thé.'
    note: Anna nomme son lieu de travail et ce qu’elle y fait.
    example_gloss: 'Dans le contexte : j’apporte du café et du thé.'
