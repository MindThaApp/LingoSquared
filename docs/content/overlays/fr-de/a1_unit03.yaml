teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: zéro, un, deux, trois, quatre
    note: Les chiffres allemands de 0 à 4.
    example_gloss:
    - Je n’ai aucune pomme.
    - Je suis le numéro un !
    - J'ai deux pommes.
    - J'ai trois pommes.
    - J'ai quatre pommes.
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: cinq, six, sept, huit, neuf, dix
    note: Les chiffres allemands de 5 à 10.
    example_gloss:
    - J'ai cinq pommes.
    - J'ai six pommes.
    - J'ai sept pommes.
    - J'ai huit pommes.
    - J'ai neuf pommes.
    - J'ai dix pommes.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: onze, douze
    note: '*elf* et *zwölf* sont irréguliers : ils ne suivent pas le modèle des nombres à partir de 13.'
    example_gloss:
    - Mon numéro de maison est le onze.
    - Mon numéro de maison est le douze.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: treize, quatorze, quinze, seize
    note: 'À partir de 13, les nombres allemands se forment avec le chiffre de base + *-zehn* (l’équivalent de *-teen* en anglais). Attention : *sechzehn* et non *sechszehn* : le *s* disparaît.'
    example_gloss:
    - Mon numéro de maison est le treize.
    - Mon numéro de maison est le quatorze.
    - Mon numéro de maison est le quinze.
    - Mon numéro de maison est le seize.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: dix-sept, dix-huit, dix-neuf, vingt
    note: 'Attention : *siebzehn*, et non *siebenzehn* : le *-en* de *sieben* disparaît devant *-zehn*.'
    example_gloss:
    - Mon numéro de maison est le dix-sept.
    - Mon numéro de maison est le dix-huit.
    - Mon numéro de maison est le dix-neuf.
    - Mon numéro de maison est le vingt.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: trente, quarante, cinquante
    note: 'Attention : *dreißig*, et non *dreizig* : 30 se termine par *-ßig* et non par *-zig* (20, *zwanzig*, est lui aussi irrégulier).'
    example_gloss:
    - Ça coûte trente euros.
    - Ça coûte quarante euros.
    - Ça coûte cinquante euros.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: soixante, soixante-dix, quatre-vingts, quatre-vingt-dix
    note: 'À partir de 40, le schéma est régulier : chiffre + *-zig* (avec les mêmes raccourcissements *sech-* et *sieb-* que dans les nombres de 13 à 19).'
    example_gloss:
    - Ça coûte soixante euros.
    - Ça coûte soixante-dix euros.
    - Ça coûte quatre-vingts euros.
    - Ça coûte quatre-vingt-dix euros.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: cent
    note: '*hundert* seul signifie « cent » ou « un cent » : il n''est pas nécessaire de mettre *ein* devant (*einhundert* existe aussi, mais il est moins courant à l''oral).'
    example_gloss: Ça coûte cent euros.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: vingt et un
    note: 'En allemand, les nombres composés de 21 à 99 inversent l''ordre du français : unité + *und* (« et ») + dizaine, le tout en UN seul mot. *einundzwanzig* = *ein* (un) + *und* (et) + *zwanzig* (vingt) = littéralement « un-et-vingt ».'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: trente-deux
    note: 'Même modèle : *zwei* (deux) + *und* + *dreißig* (trente) = « deux-et-trente » = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: Quel âge avez-vous ? (forme de politesse)
    note: '*alt* signifie « vieux, âgé » : littéralement « comment âgé êtes-vous ». Attention : en allemand, on dit « être » et non « avoir » pour l''âge.'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: Quel âge as-tu ? (forme familière)
    note: La forme familière, avec *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: J'ai vingt-huit ans.
    note: '*Jahre alt* (ans) se place toujours après le nombre. Là où le français dit « j’ai … ans » avec le verbe avoir, l’allemand dit « je suis … ans » avec le verbe être.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix demande son âge à Anna
    gloss: 'Felix dit : Quel âge avez-vous, si je peux me permettre ?'
    note: '*wenn ich fragen darf* (« si je peux me permettre de demander ») adoucit une question qui pourrait sembler un peu directe : une marque de politesse qui convient à leur registre de vouvoiement (*Sie*).'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna répond et pose la question à son tour
    gloss: 'Anna dit : J''ai vingt-huit ans. Et vous ?'
    note: Anna donne son âge et renvoie la question, comme dans l'unité 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix répond
    gloss: 'Felix dit : J''ai trente et un ans.'
    note: Cela confirme que Felix a trois ans de plus qu'Anna.
