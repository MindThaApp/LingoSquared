  de.a1.unit06.lesson02.teach.mein_vater:
    title: mein Vater
    gloss: mon père
    note: '*Vater* est masculin, donc « mon » se dit *mein*.'
  de.a1.unit06.lesson02.teach.meine_mutter:
    title: meine Mutter
    gloss: ma mère
    note: '*Mutter* est féminin, donc « ma » se dit *meine*. Le possessif s’accorde avec le genre du nom possédé, et non avec celui du possesseur.'
  de.a1.unit06.lesson02.teach.sein_bruder:
    title: sein Bruder
    gloss: son frère
    note: '*sein* = « son » (à lui). Même règle : un nom masculin prend *sein* (*sein Bruder*), un nom féminin prend *seine* (*seine Schwester*).'
  de.a1.unit06.lesson02.teach.ihr_vater_formal:
    title: Ihr Vater
    gloss: votre père (forme de politesse)
    note: '*Ihr* avec une majuscule = « votre » de politesse, comme *Sie*. Les noms masculins prennent *Ihr* (*Ihr Vater*) ; les noms féminins prennent *Ihre* (*Ihre Mutter*).'
  de.a1.unit06.lesson02.teach.wer_ist_ihr_vater:
    title: Wer ist Ihr Vater?
    gloss: Qui est votre père ? (forme de politesse)
    note: '*Wer* = « qui ».'
  de.a1.unit06.lesson03.teach.das_ist_mein_bruder:
    title: Das ist mein Bruder.
    gloss: C’est mon frère.
    note: '*Das ist...* = « C’est... » ou « Voici... » : la façon simple de présenter quelqu’un.'
  de.a1.unit06.lesson03.teach.er_ist_zwanzig:
    title: Er ist zwanzig Jahre alt.
    gloss: Il a vingt ans.
    note: '*Er* = « il ». L’âge suit le modèle vu à l’unité 3 : nombre + *Jahre alt*.'
  de.a1.unit06.lesson03.teach.ich_habe_zwei_schwestern:
    title: Ich habe zwei Schwestern.
    gloss: J’ai deux sœurs.
    note: '*Schwestern* est le pluriel de *Schwester*.'
  de.a1.unit06.lesson03.teach.haben_sie_geschwister:
    title: Haben Sie Geschwister?
    gloss: Avez-vous des frères et sœurs ? (formel)
    note: '*Geschwister* désigne les frères et sœurs ensemble : l’allemand a un seul mot courant pour cela.'
  de.a1.unit06.lesson03.teach.nein_einzelkind:
    title: Nein, ich habe keine Geschwister. Ich bin Einzelkind.
    gloss: Non, je n’ai pas de frères et sœurs. Je suis enfant unique.
    note: '*keine* = « pas de / aucun ». *Einzelkind* = « enfant unique » : en allemand, il n’y a pas d’article ici : *Ich bin Einzelkind*.'
  de.a1.unit06.lesson04.teach.foto:
    title: Foto
    gloss: photo
    example_gloss: J’ai une photo.
  de.a1.unit06.lesson04.teach.line01:
    title: Felix pose une question sur la photo
    gloss: 'Felix dit : C’est votre famille ?'
    note: '*Ihre Familie* : *Familie* est féminin, donc « votre » de politesse se dit *Ihre*.'
  de.a1.unit06.lesson04.teach.line02:
    title: Anna présente ses parents
    gloss: 'Anna dit : Oui. Voici ma mère et voici mon père.'
  de.a1.unit06.lesson04.teach.line03:
    title: Felix demande qui est une personne
    gloss: 'Felix dit : Qui est-ce ?'
  de.a1.unit06.lesson04.teach.line04:
    title: Anna présente sa sœur
    gloss: 'Anna dit : C’est ma sœur. Ma sœur est professeure.'
    note: 'Comme en français, l’allemand n’utilise pas d’article devant un métier : *Meine Schwester ist Lehrerin* = « Ma sœur est professeure ». *Lehrerin* est la forme féminine de *Lehrer*.'
  de.a1.unit06.lesson04.teach.line05:
    title: Felix pose une question sur les frères
    gloss: 'Felix dit : Avez-vous des frères ?'
    note: '*Brüder* est le pluriel de *Bruder*.'
  de.a1.unit06.lesson04.teach.line06:
    title: Anna répond
    gloss: 'Anna dit : Non. J’ai seulement une sœur.'
    note: '*nur* = « seulement ».'
  de.a1.unit06.lesson04.teach.bildunterschrift:
    title: Une légende de photo
    gloss: 'Ma famille : ma mère, mon père et ma sœur.'
