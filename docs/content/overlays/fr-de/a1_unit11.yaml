course:
  title: Allemand A1
  description: Apprends l’allemand de niveau A1 pour les échanges du quotidien, avec des explications en français.
units:
  de.a1.unit11.alltag:
    title: Les routines quotidiennes
teaching:
  de.a1.unit11.lesson01.teach.aufstehen:
    title: aufstehen
    gloss: se lever
    note: '*aufstehen* est séparable : dans *Ich stehe ... auf*, *auf* passe à la fin.'
    example_gloss: 'En contexte : Je me lève à sept heures.'
  de.a1.unit11.lesson01.teach.fruehstuecken:
    title: frühstücken
    gloss: prendre le petit-déjeuner
    note: '*frühstücken* est un verbe régulier qui signifie prendre son petit-déjeuner.'
    example_gloss: Quand prenez-vous le petit-déjeuner ?
  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: travailler
    note: '*arbeiten* prend la terminaison normale de *ich* : *ich arbeite*.'
    example_gloss: 'En contexte : Je travaille l’après-midi.'
  de.a1.unit11.lesson01.teach.lernen:
    title: lernen
    gloss: apprendre / étudier
    note: '*lernen* peut signifier « étudier » quand le complément est une matière comme l’allemand.'
    example_gloss: 'En contexte : Le soir, j’étudie l’allemand.'
  de.a1.unit11.lesson01.teach.schlafen:
    title: schlafen gehen
    gloss: aller dormir / aller se coucher
    note: '*schlafen gehen* signifie aller se coucher pour la nuit.'
    example_gloss: 'En contexte : Je vais me coucher à dix heures.'
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: Ensuite, je prends mon petit-déjeuner.
    note: 'Après *dann*, le verbe vient tout de suite en deuxième position : *Dann frühstücke ich*, et non *Dann ich frühstücke*. En français, on dit « Ensuite, je prends… », avec le sujet avant le verbe.'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: À quelle heure vous levez-vous ?
    note: Question avec le *Sie* de politesse ; le préfixe séparable *auf* reste à la fin.
  de.a1.unit11.lesson02.teach.ich_stehe_auf:
    title: Ich stehe um sieben Uhr auf.
    gloss: Je me lève à sept heures.
    note: '*um* sert à indiquer l’heure.'
  de.a1.unit11.lesson02.teach.am_nachmittag:
    title: am Nachmittag
    gloss: l’après-midi
    note: '*am* s’emploie avec les moments de la journée, comme *am Nachmittag* et *am Abend*.'
    example_gloss: 'En contexte : Je travaille l’après-midi.'
  de.a1.unit11.lesson02.teach.routine_text:
    title: Annas Tag
    gloss: La journée d’Anna
    note: Un court texte sur la routine relie des activités à des heures.
    example_gloss: 'En contexte : Le soir, elle étudie l’allemand.'
  de.a1.unit11.lesson02.teach.line01:
    title: Felix pose des questions sur la routine
    gloss: 'Felix : À quelle heure vous levez-vous ?'
    note: Felix interroge Anna sur sa routine, en la vouvoyant.
  de.a1.unit11.lesson02.teach.line02:
    title: Anna décrit sa matinée
    gloss: 'Anna : Je me lève à sept heures. Ensuite, je prends mon petit-déjeuner.'
    note: Deux actions de la routine, dans l’ordre.
    example_gloss: 'En contexte : Je me lève à sept heures.'
  de.a1.unit11.lesson02.teach.line03:
    title: Felix pose une question sur le travail
    gloss: 'Felix : Travaillez-vous aujourd’hui ?'
    note: '*Sie* de politesse avec la forme verbale *arbeiten*.'
  de.a1.unit11.lesson02.teach.line04:
    title: Anna décrit le reste de sa journée
    gloss: 'Anna : Oui, je travaille au café l’après-midi. Le soir, j’étudie l’allemand et à dix heures, je vais me coucher.'
    note: Une routine peut s’exprimer avec plusieurs phrases courtes qui s’enchaînent.
    example_gloss: 'En contexte : Oui, je travaille au café l’après-midi.'
