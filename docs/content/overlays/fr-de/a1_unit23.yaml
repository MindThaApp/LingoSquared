  de.a1.unit23.lesson02.teach.line01:
    title: Anna répond au téléphone
    gloss: 'Anna : Allô, ici Anna.'
    note: Anna décroche et donne son nom.
    example_gloss: Allô, ici Anna.
  de.a1.unit23.lesson02.teach.line02:
    title: Felix donne la raison de son appel
    gloss: 'Felix : Bonjour, Anna. J’appelle au sujet du rendez-vous. Nous nous retrouvons à neuf heures devant le café.'
    note: Felix dit pourquoi il appelle et donne l’heure et le lieu.
    example_gloss: J’appelle au sujet du rendez-vous.
  de.a1.unit23.lesson02.teach.line03:
    title: Anna demande à Felix de répéter
    gloss: 'Anna : Excusez-moi, pourriez-vous répéter, s’il vous plaît ?'
    note: Anna demande à Felix de répéter l’information.
    example_gloss: Excusez-moi, pourriez-vous répéter, s’il vous plaît ?
  de.a1.unit23.lesson02.teach.line04:
    title: Felix répète les détails
    gloss: 'Felix : Oui. Nous nous retrouvons à neuf heures devant le café.'
    note: Felix répète l’heure et le lieu.
    example_gloss: Nous nous retrouvons à neuf heures.
  de.a1.unit23.lesson02.teach.line05:
    title: Anna promet un message
    gloss: 'Anna : Merci. Je vous écris un message.'
    note: Anna dit qu’elle va écrire un message.
    example_gloss: Je vous écris un message.
