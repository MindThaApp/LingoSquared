    gloss: appeler par téléphone
    note: '*Ich rufe ... an* signifie « j’appelle ».'
    example_gloss: J’appelle Felix.
  de.a1.unit23.lesson01.teach.wiederholen:
    title: Können Sie das bitte wiederholen?
    gloss: Pourriez-vous répéter, s’il vous plaît ?
    note: Utilise cette demande polie quand tu n’as pas bien compris.
  de.a1.unit23.lesson01.teach.langsam:
    title: Sprechen Sie bitte langsam.
    gloss: Parlez lentement, s’il vous plaît.
