course:
  title: Allemand A1
  description: Apprends l’allemand de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées en français.
units:
  de.a1.unit10.wegbeschreibungen:
    title: Demander son chemin et suivre un itinéraire
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Tourne à gauche.
    note: '*abbiegen* (tourner) est un verbe à particule séparable : la particule *ab* passe tout à la fin de la phrase : *Biegen Sie... ab*, et non *Sie biegen ab* ni *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Tourne à droite.
    note: Même construction avec un verbe séparable que pour *links abbiegen*, mais avec *rechts* (à droite).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Va tout droit.
    note: '*geradeaus* signifie « tout droit » : il n’y a pas de particule séparable ici, c’est un impératif de politesse plus simple.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Arrêtez-vous ici.
    note: '*anhalten* (s’arrêter) est aussi séparable : *an* passe à la fin, comme pour *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: coin (de rue)
    note: '*Ecke* signifie « coin » : nom féminin, *die Ecke*.'
    example_gloss: Tournez à gauche au coin de la rue.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: Comment aller à la banque ?
    note: '*zur* est la contraction de *zu der* (datif féminin, die Bank) : c’est le même type de contraction que *vom* (von + dem) vu à l’unité 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Allez tout droit, puis tournez à gauche au coin de la rue.
    note: '*dann* (puis) relie deux étapes de l’itinéraire ; *an der Ecke* (au coin) utilise l’article au datif féminin, comme les prépositions de lieu vues à l’unité 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: Est-ce loin ?
    note: '*weit* signifie « loin ».'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: C’est à deux minutes d’ici.
    note: '*nur* signifie « seulement ».'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: Vous ne pouvez pas le rater.
    note: '*verfehlen* signifie « rater » (ne pas trouver) ; mot à mot : « Cela pouvez vous ne pas rater ».'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Prenez la première rue à gauche.
    note: '*erste* signifie « première » : c’est un nombre ordinal, qui prend ici une terminaison, comme un adjectif.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Prenez la deuxième rue à droite.
    note: '*zweite* signifie « deuxième ».'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: Itinéraire jusqu’à la pharmacie
    note: Un court itinéraire écrit qui réunit plusieurs expressions déjà vues.
  de.a1.unit10.lesson04.teach.line01:
    title: Felix demande son chemin
    gloss: 'Felix : Excusez-moi, comment aller à la banque ?'
    note: La même formule de politesse que dans l’unité 9, mais ici pour demander un itinéraire et non seulement un lieu.
  de.a1.unit10.lesson04.teach.line02:
    title: Anna indique le chemin
    gloss: 'Anna : Allez tout droit, puis tournez à gauche au coin de la rue.'
    note: Une réponse complète relie deux étapes avec *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Felix confirme et pose une autre question
    gloss: 'Felix : À gauche au coin, d’accord. C’est loin ?'
    note: Felix répète l’indication pour confirmer qu’il a compris, puis pose une question qui vient naturellement.
  de.a1.unit10.lesson04.teach.line04:
    title: Anna répond sur la distance
    gloss: 'Anna : Non, c’est à seulement deux minutes d’ici. Vous ne pouvez pas le rater.'
    note: Une réponse complète et rassurante.
