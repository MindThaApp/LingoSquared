teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: Quelle heure est-il ?
    note: Littéralement « Quelle heure tardive est-il ? » -- la façon habituelle de demander l’heure.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: Il est trois heures.
    note: '*Uhr* = « heure(s) ». Les heures pleines se disent avec le nombre + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: Il est trois heures et demie (3 h 30).
    note: 'L’allemand nomme la demi-heure d’après l’heure VERS laquelle on va : *halb vier* = « la moitié (en route) vers quatre » = 3 h 30, et non 4 h 30. Le français, lui, part de l’heure écoulée : trois heures et demie.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: Il est cinq heures.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: Il est trois heures et quart (3 h 15).
    note: '*Viertel* = « quart » ; *nach* = « après ».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: Il est quatre heures moins le quart (3 h 45).
    note: '*vor* = « avant ».'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: Il est quatre heures dix (4 h 10).
    note: 'En allemand : minutes + *nach* + heure, soit « dix après quatre » ; en français, on dit simplement « quatre heures dix ».'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: Il est cinq heures moins dix (4 h 50).
    note: 'En allemand : minutes + *vor* + l’heure suivante, comme en français « cinq heures moins dix ».'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: matin
    note: '*Morgen* est le nom pour le matin, environ de 6 h à 12 h.'
    example_gloss: Bonjour, Felix !
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: midi
    note: '*Mittag* est midi même, le milieu entre Morgen et Nachmittag.'
    example_gloss: Il est midi.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: après-midi
    note: '*Nachmittag* couvre environ de 12 h à 18 h.'
    example_gloss: Je travaille l’après-midi.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: soir
    note: '*Abend* couvre environ de 18 h à 22 h.'
    example_gloss: Bonsoir, Anna !
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: nuit
    note: '*Nacht* couvre environ de 22 h à 6 h.'
    example_gloss: Bonne nuit, Felix !
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: minuit
    note: '*Mitternacht* correspond exactement à minuit, soit 0 Uhr.'
    example_gloss: La fête se termine à minuit.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: dix-huit
    note: '*achtzehn* = 18, utilisé ici avec l’horloge de 24 heures pour les horaires officiels (achtzehn Uhr = 18 h).'
    example_gloss: Le magasin ferme à 18 h.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: Le magasin ouvre à neuf heures du matin.
    note: '*um* + heure = « à » une heure précise ; *morgens* = « le matin ».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: Le magasin ferme à 18 h.
    note: '*schließt* = « ferme ». Les horaires d’ouverture officiels utilisent l’horloge de 24 heures.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: quand
    note: '*Wann* introduit une question sur le moment.'
    example_gloss: Quand venez-vous ?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: ouvre la
    note: '*öffnet* est la 3e personne du singulier de *öffnen* (ouvrir) ; *die* est l’article défini féminin/pluriel, qui s’accorde avec *die Bibliothek*.'
    example_gloss: Quand la bibliothèque ouvre-t-elle ?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: bibliothèque
    note: '*Bibliothek* est un nom féminin (*die Bibliothek*), le même lieu que dans l’unité 4.'
    example_gloss: Je vais à la bibliothèque.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: il / elle / ils / elles (minuscule)
    note: Ici, *sie* est le pronom de la 3e personne qui remplace le nom féminin *die Bibliothek* -- « elle » ; ne le confonds pas avec *Sie* à majuscule (« vous » de politesse), que s’adressent Anna et Felix.
    example_gloss: J’aime la bibliothèque. Je la visite souvent.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: alors
    note: '*dann* est employé ici dans la formule de clôture *Bis dann!* (« à tout à l’heure ! »).'
    example_gloss: À tout à l’heure !
  de.a1.unit05.lesson04.teach.line01:
    title: Felix se renseigne sur la bibliothèque
    gloss: 'Felix dit : Quand la bibliothèque ouvre-t-elle ?'
  de.a1.unit05.lesson04.teach.line02:
    title: Anna répond
    gloss: 'Anna dit : Elle ouvre à neuf heures du matin.'
    note: '*Sie* signifie ici « elle » : il renvoie à *die Bibliothek* ; il prend une majuscule uniquement parce qu’il commence la phrase.'
  de.a1.unit05.lesson04.teach.line03:
    title: Felix pose une autre question
    gloss: 'Felix dit : Et quand ferme-t-elle ?'
  de.a1.unit05.lesson04.teach.line04:
    title: Anna répond encore
    gloss: 'Anna dit : Elle ferme à 18 h.'
  de.a1.unit05.lesson04.teach.line05:
    title: Felix prend congé
    gloss: 'Felix dit : Bien, à tout à l’heure !'
  de.a1.unit05.lesson04.teach.schild:
    title: Une affiche sur la porte
    gloss: 'Horaires d’ouverture : de 9 h à 18 h.'
    note: '*Öffnungszeiten* = « horaires d’ouverture » ; *bis* = « jusqu’à ».'
