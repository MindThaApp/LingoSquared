course:
  title: Allemand A1
  description: Apprends l’allemand de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées en français.
units:
  de.a1.unit09.orte:
    title: Lieux et endroits courants
teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: banque
    note: '*Bank* signifie « banque » ; c’est un nom féminin : *die Bank*.'
    example_gloss: Je dois aller à la banque.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: hôpital
    note: '*Krankenhaus* signifie littéralement « maison des malades » – nom neutre : *das Krankenhaus*.'
    example_gloss: Mon ami est à l’hôpital.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: pharmacie
    note: '*Apotheke* signifie pharmacie – nom féminin : *die Apotheke*.'
    example_gloss: La pharmacie est ouverte aujourd’hui.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: parc
    note: '*Park* signifie parc – nom masculin : *der Park*.'
    example_gloss: Nous aimons nous promener dans le parc.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: restaurant
    note: '*Restaurant* signifie restaurant – nom neutre : *das Restaurant*.'
    example_gloss: Ce restaurant sert de la bonne cuisine.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: La pharmacie est à côté du parc.
    note: '*neben* signifie « à côté de ». C’est une préposition à double case : pour un lieu fixe (comme ici), elle se construit avec le datif, donc *der Park* (masculin) devient *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: La pharmacie est en face de l’hôpital.
    note: '*gegenüber von* signifie « en face de ». *vom* est la contraction usuelle de *von dem* (datif neutre, *das Krankenhaus*), à l’oral comme à l’écrit.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: La pharmacie est entre la banque et le parc.
    note: '*zwischen* signifie « entre ». Remarque les deux formes du datif : *der Bank* (féminin) et *dem Park* (masculin).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: Le restaurant est derrière la banque.
    note: '*hinter* signifie « derrière » – *der Bank* est le datif féminin.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: Le parc est devant l’hôpital.
    note: '*vor* signifie « devant » – *dem Krankenhaus* est le datif neutre.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: Où se trouve la banque ?
    note: '*Wo ist...?* est la façon habituelle de demander où se trouve quelque chose.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: Elle est à côté du parc.
    note: '*Sie* signifie ici « elle » (il renvoie à *die Bank*, féminin). Il prend une majuscule uniquement parce qu’il est en début de phrase. Le verbe *ist* montre qu’il ne s’agit pas du « vous » de politesse, qui serait *Sie sind*.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: Est-ce que c’est loin d’ici ?
    note: '*weit* signifie « loin ». Ici, *es* est un sujet neutre qui renvoie à la situation en général, sans s’accorder avec le genre d’un nom précis.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: Non, ce n’est pas loin.
    note: '*nicht* nie l’adjectif *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Excusez-moi, où est la pharmacie ?
    note: '*Entschuldigung* a déjà été vu au sens de « excusez-moi / pardon » – ici, il sert à introduire poliment une question.'
  de.a1.unit09.lesson04.teach.line01:
    title: Felix demande son chemin
    gloss: 'Felix dit : Excusez-moi, où est la pharmacie ?'
    note: C’est la même formule de politesse que dans la phrase vue plus haut, mais ici dans une vraie conversation.
  de.a1.unit09.lesson04.teach.line02:
    title: Anna indique l’emplacement
    gloss: 'Anna dit : Elle est en face de l’hôpital.'
    note: Une réponse complète situe la pharmacie par rapport à un repère connu.
  de.a1.unit09.lesson04.teach.line03:
    title: Felix demande si c’est loin
    gloss: 'Felix dit : Est-ce que c’est loin d’ici ?'
    note: C’est une question de suivi naturelle quand on connaît déjà la direction générale.
  de.a1.unit09.lesson04.teach.line04:
    title: Anna répond au sujet de la distance
    gloss: 'Anna dit : Non, ce n’est pas loin. Elle est entre la banque et le parc.'
    note: Une réponse complète rassure sur la distance, puis donne un second repère plus précis.
