course:
  title: Allemand A1
  description: 'Allemand pour débutants afin de parler de ses loisirs : vocabulaire des passe-temps, expressions de fréquence, demander et dire ce que l’on fait pendant son temps libre, et comparer les loisirs de deux personnes.'
units:
  de.a1.unit54.hobbys:
    title: Les loisirs et le temps libre
lessons:
  de.a1.unit54.lesson01.lesen_sport_und_kochen:
    title: Lire, faire du sport et cuisiner
  de.a1.unit54.lesson02.musik_zeichnen_und_videospiele:
    title: Musique, dessin et jeux vidéo
  de.a1.unit54.lesson03.was_machst_du_in:
    title: Que fais-tu pendant ton temps libre ?
  de.a1.unit54.lesson04.anna_und_felix_sprechen:
    title: Anna et Felix parlent de leurs loisirs
  de.a1.unit54.lesson05.felix_und_anna_vergleichen:
    title: Felix et Anna comparent leurs loisirs
  de.a1.unit54.lesson06.ein_wochenende_zusammen_planen:
    title: Organiser un week-end ensemble
teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes de loisirs courants : *lesen* (lire), *Sport treiben* (faire du sport) et *kochen* (cuisiner). Sport est un nom, donc il prend une majuscule.'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Le temps libre
    gloss: temps libre
    note: '*Die Freizeit* est un nom féminin : apprends-le toujours avec son article die. C’est le mot clé pour parler de ses loisirs.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Lese* est la forme de ich de *lesen* (lire). La phrase commence par un complément de temps, mais le verbe reste en deuxième position : in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres expressions de loisirs : *Musik hören* (écouter de la musique), *zeichnen* (dessiner) et *Videospiele spielen* (jouer aux jeux vidéo). Musik et Videospiele sont des noms, donc ils prennent une majuscule.'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: En allemand, on dit *Musik hören* sans préposition, comme en français « écouter de la musique ».
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*Mit Freunden* (avec des amis) : mit est toujours suivi du datif, donc Freunde devient Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: 'Les quatre adverbes de fréquence essentiels : immer, oft, manchmal, nie. Ils se placent en général juste après le verbe : ich spiele nie.'
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*Jede Woche* et *jedes Wochenende* signifient tous deux « chaque », mais la terminaison change selon le genre du nom : voir la carte suivante.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede ou jedes
    gloss: Die Woche est féminin, donc on dit jede Woche. Das Wochenende est neutre, donc on dit jedes Wochenende.
    note: '*Woche* est féminin (*die Woche*), donc il prend *jede* ; *Wochenende* est neutre (*das Wochenende*), donc il prend *jedes*. Apprends chaque nom avec son article et tu connais la terminaison.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna parle des loisirs
    gloss: 'Anna : Nous allons souvent nous promener ensemble. Mais que fais-tu d’autre pendant ton temps libre, Felix ?'
    note: '*Wir gehen oft zusammen spazieren* utilise gehen avec un second verbe : le verbe conjugué gehen est en deuxième position, l’infinitif spazieren part à la fin.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Les loisirs de Felix
    gloss: 'Felix : J’aime cuisiner, aussi chez moi. Et je fais souvent du sport.'
    note: '*Auch zu Hause* (aussi chez soi) précise que Felix cuisine par plaisir, pas seulement pour son travail au restaurant.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna est surprise
    gloss: 'Anna : Tu cuisines aussi chez toi ? Mais tu cuisines déjà toute la journée au travail !'
    note: '*Den ganzen Tag* (toute la journée) est à l’accusatif, c’est pourquoi der Tag devient den Tag. Les durées de ce type se mettent à l’accusatif.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix explique
    gloss: 'Felix : Oui, mais je trouve que cuisiner est relaxant. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Kochen finde ich entspannend* place Kochen en tête pour le mettre en valeur. Le verbe reste en deuxième position, donc ich passe derrière lui.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Les loisirs d’Anna
    gloss: 'Anna : J’aime lire et j’écoute souvent de la musique.'
    note: Cette phrase réunit deux verbes de loisirs des leçons 01-02 avec *und* (et).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix demande si elle joue aux jeux vidéo
    gloss: 'Felix : Tu joues aussi aux jeux vidéo ?'
    note: 'Une courte question fermée : le verbe vient en premier, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna répond
    gloss: 'Anna : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*Nie* (jamais) et *manchmal* (parfois) de la leçon 03, opposés dans une même réponse. Tous deux se placent juste après le verbe.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Comparer des loisirs
    gloss: Felix et moi, nous allons souvent nous promener ensemble. Mais nous avons aussi d’autres loisirs. Felix aime cuisiner, aussi chez lui, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Et toi, qu’est-ce que tu aimes faire pendant ton temps libre ?
    note: Le message d’Anna reprend les faits de la leçon 04 et se termine par la question centrale de l’unité.
    glosses:
      spazieren: se promener
      oft: souvent
      zusammen: ensemble
      andere: autre
      kocht: cuisine
      gern: aime
      Hause: à la maison
      Sport: fait du sport
      lese: lire
      höre: écouter
      Musik: musique
      zeichne: dessiner
      manchmal: parfois
      spiele: jouer aux jeux vidéo
      nie: jamais
      freien: libre
      Zeit: temps
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix demande ce qu’elle fait ce week-end
    gloss: 'Felix : Qu’est-ce que tu fais ce week-end ?'
    note: '*Dieses Wochenende* (ce week-end) a la terminaison neutre -es, parce que das Wochenende est neutre.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna hésite
    gloss: 'Anna : Je ne sais pas encore. J’aime lire, mais j’ai aussi envie de sortir.'
    note: '*Nach draußen* (dehors, littéralement « vers l’extérieur ») est une façon courante de dire qu’on veut sortir de chez soi.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix propose un programme
    gloss: 'Felix : On va se promener ensemble ? Ensuite, je cuisine pour nous.'
    note: '*Danach* (ensuite) vient en premier, donc le verbe suit, puis le sujet : danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna est d’accord
    gloss: 'Anna : Bonne idée ! J’aime me promener et j’aime aussi cuisiner.'
    note: '*Gern* après le verbe montre que tu aimes faire quelque chose : ich gehe gern spazieren, ich koche gern. Cela fonctionne avec presque tous les verbes.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix confirme
    gloss: 'Felix : Parfait. Alors, on se voit samedi !'
    note: 'Une phrase de conclusion amicale qui confirme le projet pour *Samstag* (samedi). Avec les jours de la semaine, on emploie *am* : am Samstag.'
