teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: Работа
    gloss: работа
    note: 'عمل (ʿamal) означает «работа». ما عملك؟ — вопрос о чьей-то работе; окончание ـك значит «твой»: ʿamaluka к мужчине, ʿamaluki к женщине, пишется одинаково.'
    example_gloss: Кем ты работаешь?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Инженер
    gloss: инженер
    note: مهندس (muhandis) — форма мужского рода, её использует Юсуф; женщина скажет أنا مهندسة (anā muhandisa).
    example_gloss: Я инженер.
  ar.a1.unit18.lesson01.teach.office:
    title: Офис
    gloss: офис
    note: مكتب (maktab) — «офис»; في مكتب значит «в офисе».
    example_gloss: Я работаю в офисе.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Я работаю в офисе
    gloss: Я работаю в офисе
    note: أعمل (aʿmal) означает «я работаю»; у него тот же корень, что и у عمل («работа»), а أ в начале указывает на «я».
    example_gloss: 'Юсуф сказал: Я работаю в офисе.'
  ar.a1.unit18.lesson02.teach.write:
    title: Я пишу
    gloss: Я пишу
    note: أكتب (aktub) означает «я пишу».
    example_gloss: Я пишу на работе.
  ar.a1.unit18.lesson02.teach.read:
    title: Я читаю
    gloss: Я читаю
    note: أقرأ (aqraʾ) означает «я читаю».
    example_gloss: Я читаю на работе.
  ar.a1.unit18.lesson02.teach.at_work:
    title: На работе
    gloss: на работе
    note: العمل (al-ʿamal) — «работа» с определённостью; في العمل значит «на работе».
    example_gloss: Я пишу и читаю на работе.
  ar.a1.unit18.lesson02.teach.line01:
    title: Спросить о работе
    gloss: Лейла спрашивает Юсуфа о его работе.
    note: يا يوسف — обращение к Юсуфу по имени.
    example_gloss: 'Лейла сказала: Кем ты работаешь, Юсуф?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Назвать профессию
    gloss: Юсуф говорит, что он инженер.
    note: Отдельное слово для «есть/являюсь» не нужно.
    example_gloss: 'Юсуф сказал: Я инженер.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Назвать место работы
    gloss: Юсуф говорит, что работает в офисе.
    note: أعمل في указывает место работы.
    example_gloss: 'Юсуф сказал: Я работаю в офисе.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Спросить о занятиях
    gloss: Лейла спрашивает, что Юсуф делает каждый день.
    note: 'Это уже знакомый вопрос о распорядке дня; تفعل обращено к мужчине. К женщине: ماذا تفعلين كل يوم؟'
    example_gloss: 'Лейла сказала: Что ты делаешь каждый день?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Рассказать о занятиях
    gloss: Юсуф говорит, что пишет и читает на работе.
    note: 'و (wa, «и») соединяет два действия и пишется слитно со следующим словом: وأقرأ.'
    example_gloss: 'Юсуф сказал: Я пишу и читаю на работе.'
