  ar.a1.unit01.lesson01.script_ramp:
    title: Прочитай своё первое арабское слово
  ar.a1.unit01.lesson02.everyday_greetings:
    title: Повседневные приветствия
  ar.a1.unit01.lesson03.time_and_farewells:
    title: Приветствия и прощания в течение дня
  ar.a1.unit01.lesson04.wellbeing_exchange:
    title: Как спросить, как дела
teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: Арабский пишется справа налево
    gloss: Арабский пишется справа налево.
    note: Читай по-арабски от правого края к левому.
  ar.a1.unit01.lesson01.teach.mim:
    title: Буква م
    gloss: м
    note: م обозначает звук «м» и меняет форму в зависимости от положения в слове.
  ar.a1.unit01.lesson01.teach.ra:
    title: Буква ر
    gloss: р
    note: ر обозначает раскатистый звук «р» и не соединяется со следующей буквой.
  ar.a1.unit01.lesson01.teach.ha:
    title: Буква ح
    gloss: ḥ
    note: ح — это придыхательный звук «х», образуемый глубоко в горле; он не похож на русское «х».
  ar.a1.unit01.lesson01.teach.ba:
    title: Буква ب
    gloss: б
    note: ب обозначает звук «б» и соединяется с соседними буквами.
  ar.a1.unit01.lesson01.teach.alef:
    title: Буква ا
    gloss: ā / а
    note: ا обозначает долгий гласный ā и не соединяется со следующей буквой.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Составь слово مرحبا
    gloss: привет
    note: مرحبا читается marḥaban. Краткие гласные на письме обычно не обозначаются.
    example_gloss: Привет! Я Сара.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Привет
    gloss: привет
    note: مرحبا — тёплое универсальное приветствие, подходящее почти для любой ситуации.
    example_gloss: Привет, как дела?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Доброе утро
    gloss: доброе утро
    note: صباح الخير читается ṣabāḥ al-khayr, буквально «утро добра».
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Добрый день или добрый вечер
    gloss: добрый день / добрый вечер
    note: مساء الخير читается masāʾ al-khayr и используется с позднего дня до вечера.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Прощание
    gloss: до свидания; прощай
    note: مع السلامة читается maʿa as-salāma, буквально «с безопасностью» — стандартное прощание на все случаи.
    example_gloss: Спасибо, до свидания!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Спасибо
    gloss: спасибо
    note: شكرا читается shukran и подходит для любого стиля общения.
    example_gloss: Большое спасибо.
  ar.a1.unit01.lesson02.teach.afwan:
    title: Пожалуйста
    gloss: не за что
    note: عفوا (ʿafwan) — принятый ответ на شكرا; в другом контексте это слово может означать и «извините».
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Спокойной ночи
    gloss: спокойной ночи
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) говорят, прощаясь на ночь или ложась спать; это не приветствие при встрече. تصبح — форма для мужчины; женщине говорят تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Добро пожаловать
    gloss: добро пожаловать
    note: أهلا وسهلا (ahlan wa sahlan) — так встречают гостя или тепло приветствуют при приходе.
    example_gloss: Добро пожаловать! Добро пожаловать к нам.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: До встречи
    gloss: до встречи / до свидания
    note: إلى اللقاء (ilā al-liqāʾ) — вежливое нейтральное прощание.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Доброе утро — ответ
    gloss: доброе утро [ответ]
    note: صباح النور (ṣabāḥ an-nūr, «утро света») — принятый ответ на صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Добрый вечер — ответ
    gloss: добрый вечер [ответ]
    note: مساء النور (masāʾ an-nūr) — принятый ответ на مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Хорошего дня
    gloss: хорошего дня
    note: يوما سعيدا (yawman saʿīdan) — тёплое пожелание на прощание.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Как дела?
    gloss: Как вы поживаете?
    note: كيف حالك؟ (kayfa ḥāluk) — стандартный способ спросить, как дела; без огласовок написание подходит для любого собеседника.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: «Ты» в мужском и женском роде
    gloss: ты (м.) / ты (ж.)
    note: В устной арабской речи различаются أنتَ (anta, к мужчине) и أنتِ (anti, к женщине), так же как حالَك и حالِك. Без показанных здесь огласовок письменные формы, используемые в этом курсе, одинаковы для обоих.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Хорошо
    gloss: хорошо
    note: بخير (bikhayr) — стандартный положительный ответ на كيف حالك؟
    example_gloss: Сегодня у меня всё хорошо.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Слава Богу
    gloss: слава Богу / хвала Богу
    note: 'الحمد لله (al-ḥamdu lillāh) очень часто добавляют после بخير, независимо от религиозности говорящего: это обычная разговорная формула, похожая на русское «слава богу» или «к счастью».'
    example_gloss: Хорошо, слава Богу.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: А ты?
    gloss: А вы?
    note: وأنت؟ (wa anta — мужчине, wa anti — женщине) возвращает вопрос собеседнику; без огласовок написание одинаково для обоих.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Отлично
    gloss: отлично / великолепно
    note: ممتاز (mumtāz) — более восторженный ответ, чем بخير.
    example_gloss: Сегодня у меня всё отлично!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Неплохо
    gloss: неплохо
    note: لا بأس (lā baʾs) — естественный умеренный ответ, а не жалоба.
