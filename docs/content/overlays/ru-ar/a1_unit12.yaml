teaching:
  ar.a1.unit12.lesson01.teach.tomorrow:
    title: Завтра
    gloss: завтра
    note: غدا (ghadan) относит действие к ближайшему будущему.
    example_gloss: Я учусь завтра.
  ar.a1.unit12.lesson01.teach.go:
    title: Мы идём
    gloss: мы идём / мы пойдём
    note: نذهب (nadh-hab) значит «мы идём»; ن в начале указывает на «мы». С غدا глагол в настоящем времени выражает план.
    example_gloss: Мы идём в кафе.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Завтра в пять
    gloss: завтра в пять часов
    note: في الساعة («в час») ставится перед временем по часам, как в уроке о времени.
    example_gloss: Мы идём завтра в пять часов.
  ar.a1.unit12.lesson02.teach.propose:
    title: Предложить план
    gloss: Пойдём завтра в кафе?
    note: 'هل (hal) превращает утверждение в вопрос, на который отвечают «да» или «нет»; с نذهب это звучит как предложение: пойдём?'
    example_gloss: 'Лейла сказала: Пойдём завтра в кафе?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Согласиться и назвать время
    gloss: Да, в пять часов
    note: Можно ответить просто نعم и время; глагол не нужен.
    example_gloss: 'Юсуф сказал: Да, в пять часов.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Простой отказ
    gloss: Нет, у меня урок
    note: لا — простой отказ, после него называют причину с عندي («у меня есть»).
    example_gloss: Нет, у меня завтра урок.
  ar.a1.unit12.lesson02.teach.line01:
    title: Лейла предлагает
    gloss: Лейла предлагает пойти завтра в кафе.
    note: Эта реплика начинает обсуждение плана.
    example_gloss: 'Лейла сказала: Пойдём завтра в кафе?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Юсуф соглашается
    gloss: Юсуф соглашается и называет время.
    note: Теперь у плана есть занятие, день и время.
    example_gloss: 'Юсуф сказал: Да, в пять часов.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Лейла подтверждает
    gloss: Лейла говорит «хорошо» и «до свидания».
    note: جيد (jayyid) значит «хорошо»; здесь это подтверждение плана. إلى اللقاء — прощание из урока о приветствиях.
    example_gloss: 'Лейла сказала: Хорошо. До свидания.'
