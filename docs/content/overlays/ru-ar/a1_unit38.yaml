  ar.a1.unit38.lesson05.teach.nwr_wlyla_tdhhban:
    title: Нур и Лейла покупают розы
    gloss: Нур и Лейла идут в субботу на цветочный рынок. Какой цвет хочет Лейла? Лейла хочет красный. Какой цвет хочет Нур? Нур хочет жёлтый. Они покупают пять роз. Это стоит десять дирхамов. Розы очень красивые!
    note: 'Короткий текст о поездке на рынок. Цвет согласуется с тем, что он описывает: الأحمر (al-aḥmar) — это сам цвет, а الورود حمراء (al-wurūd ḥamrāʾ) — форма женского рода для роз.'
