      الأصدقاء: друзья
      ستأتي: приходит
      الجميع: все
      سعداء: довольный
  ar.a1.unit32.lesson05.teach.ywsf_ydaw_krym:
    title: Юсуф приглашает Карима и Лейлу
    gloss: Юсуф приглашает Карима и Лейлу на вечеринку.
  ar.a1.unit32.lesson05.teach.aljmya_sadaa_mn:
    title: Все рады за Сару
