    title: Местоимения, присоединённые к глаголу
    gloss: 'Местоимение присоединяется к концу глагола: أدعوك (adʿūka, «я приглашаю тебя»), أدعوه (adʿūhu, «я приглашаю его»), أدعوها (adʿūhā, «я приглашаю её»).'
