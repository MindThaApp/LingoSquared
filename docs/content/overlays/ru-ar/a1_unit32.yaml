  ar.a1.unit32.lesson05.teach.ywm_alsbt_ayd:
    title: Кто что делает для вечеринки?
    gloss: В субботу день рождения Сары. Мы празднуем вечеринкой. Юсуф приглашает Карима и Лейлу на вечеринку. Карим любит праздновать с друзьями. Лейла тоже придёт на вечеринку. Все рады за Сару.
    note: Краткое повторение плана вечеринки.
    glosses:
      السبت: суббота
      ميلاد: рождение (как в «день рождения»)
      نحتفل: празднуем
      بحفلة: вечеринка
      يدعو: приглашает
      إلى: на (в «приглашает ... на вечеринку»)
