teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Дом
    gloss: дом
    note: بيت (bayt) — «дом»; окончание ـي означает «мой», поэтому بيتي (baytī) — «мой дом».
    example_gloss: Мой дом рядом с библиотекой.
  ar.a1.unit19.lesson01.teach.room:
    title: Комната
    gloss: комната
    note: غرفة (ghurfa) — женского рода (оканчивается на ة), поэтому после неё стоит женская форма واحدة.
    example_gloss: В моём доме одна комната.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Кухня
    gloss: кухня
    note: 'مطبخ (maṭbakh) — «кухня». Отдельного слова для «есть» здесь в арабском нет: эту роль выполняет начало في بيتي («в моём доме»).'
    example_gloss: В моём доме есть кухня.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Одна комната
    gloss: одна комната
    note: 'Числительное «один» стоит после существительного и согласуется с ним: غرفة واحدة (ghurfa wāḥida); с существительным мужского рода будет واحد.'
    example_gloss: В моём доме одна комната.
  ar.a1.unit19.lesson02.teach.table:
    title: Стол
    gloss: стол
    note: طاولة (ṭāwila) — «стол»; как и غرفة, оно оканчивается на ة и женского рода.
    example_gloss: У меня в комнате есть стол.
  ar.a1.unit19.lesson02.teach.in_room:
    title: В комнате
    gloss: в комнате
    note: الغرفة (al-ghurfa) означает «комната» с определённым артиклем ال, то есть «эта/та самая комната».
    example_gloss: Стол в комнате.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Рядом с библиотекой
    gloss: рядом с библиотекой
    note: قرب (qurb) значит «рядом»; المكتبة — «библиотека» из темы о местах.
    example_gloss: Мой дом рядом с библиотекой.
  ar.a1.unit19.lesson02.teach.line01:
    title: Спросить «где»
    gloss: Лейла спрашивает, где дом Юсуфа.
    note: أين значит «где»; بيتك (baytuka) — «твой дом» (к мужчине); к женщине — baytuki, пишется так же.
    example_gloss: 'Лейла спросила: Где твой дом, Юсуф?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Где находится дом
    gloss: Юсуф говорит, что его дом рядом с библиотекой.
    note: بيتي значит «мой дом».
    example_gloss: 'Юсуф сказал: Мой дом рядом с библиотекой.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Комнаты
    gloss: Юсуф говорит, что в его доме одна комната и кухня.
    note: 'و (wa, «и») соединяет две части дома и пишется слитно со следующим словом: ومطبخ.'
    example_gloss: 'Юсуф сказал: В моём доме одна комната и кухня.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Спросить о предмете
    gloss: Лейла спрашивает, есть ли у Юсуфа стол.
    note: هل начинает вопрос, на который отвечают «да» или «нет»; عندك (ʿindaka) — «у тебя есть» (к мужчине); к женщине — ʿindaki, пишется так же.
    example_gloss: 'Лейла сказала: У тебя есть стол?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Где стоит предмет
    gloss: Юсуф говорит, что у него в комнате есть стол.
    note: 'عندي выражает принадлежность: «у меня есть».'
    example_gloss: 'Юсуф сказал: Да, у меня в комнате есть стол.'
