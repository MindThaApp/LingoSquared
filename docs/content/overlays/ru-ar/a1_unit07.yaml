teaching:
  ar.a1.unit07.lesson01.teach.water:
    title: Вода
    gloss: вода
    note: ماء (māʾ) — «вода».
    example_gloss: Я хочу воду.
  ar.a1.unit07.lesson01.teach.coffee:
    title: Кофе
    gloss: кофе
    note: قهوة (qahwa) — «кофе».
    example_gloss: Я хочу воду и кофе.
  ar.a1.unit07.lesson01.teach.bread:
    title: Хлеб
    gloss: хлеб
    note: خبز (khubz) — «хлеб». Как прямое дополнение после глагола, например أريد или تريدين, он пишется خبزا (khubzan).
    example_gloss: Я хочу хлеб.
  ar.a1.unit07.lesson01.teach.i_want:
    title: Я хочу
    gloss: я хочу
    note: أريد (urīdu) — прямая, но вполне нормальная форма просьбы.
    example_gloss: Я хочу воду.
  ar.a1.unit07.lesson01.teach.please:
    title: Пожалуйста
    gloss: пожалуйста
    note: من فضلك (min faḍlika; женщине — min faḍliki) добавляет вежливость после просьбы; эту фразу можно поставить и в начало.
    example_gloss: Я хочу воды, пожалуйста.
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: Хотите хлеба?
    gloss: Хотите хлеба?
    note: تريدين (turīdīna) — «ты хочешь» (к женщине, здесь к Лейле); к мужчине говорят تريد (turīdu).
    example_gloss: 'Официант спросил: «Хотите хлеба?»'
  ar.a1.unit07.lesson02.teach.one_bread:
    title: Один кусок хлеба
    gloss: один кусок хлеба
    note: قطعة خبز واحدة (qiṭʿat khubz wāḥida) выделяет из хлеба счётную единицу; واحدة — женского рода, согласуется со словом قطعة.
    example_gloss: Я хочу один кусок хлеба.
  ar.a1.unit07.lesson02.teach.here_you_are:
    title: Вот, держите
    gloss: вот, держите
    note: تفضلي (tafaḍḍalī) говорят женщине, когда что-то передают; мужчине говорят تفضل (tafaḍḍal).
    example_gloss: 'Официант сказал: «Вот, держите».'
  ar.a1.unit07.lesson02.teach.line01:
    title: Сделать заказ
    gloss: Лейла вежливо заказывает воду и кофе.
    note: Просьба строится из أريد и названий того, что нужно.
    example_gloss: 'Лейла сказала: «Здравствуйте. Я хочу воду и кофе, пожалуйста».'
  ar.a1.unit07.lesson02.teach.line02:
    title: Задать уточняющий вопрос
    gloss: Официант спрашивает, хочет ли она хлеба.
    note: هل открывает вопрос, на который отвечают «да» или «нет».
    example_gloss: 'Официант сказал: «Хотите хлеба?»'
  ar.a1.unit07.lesson02.teach.line03:
    title: Ответить на вопрос
    gloss: Лейла отвечает «да» и просит один кусок хлеба.
    note: نعم выражает ответ «да».
    example_gloss: 'Лейла сказала: «Да, я хочу один кусок хлеба».'
  ar.a1.unit07.lesson02.teach.line04:
    title: Подать заказ
    gloss: 'Официант говорит: «Вот, держите».'
    note: تفضلي завершает этот обмен репликами.
    example_gloss: 'Официант сказал: «Вот, держите».'
