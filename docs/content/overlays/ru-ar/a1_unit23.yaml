teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Телефон
    gloss: телефон
    note: هاتف (hātif) означает «телефон».
    example_gloss: Это телефон.
  ar.a1.unit23.lesson01.teach.hear:
    title: Я тебя слышу
    gloss: я тебя слышу
    note: أسمعك (asmaʿuka — мужчине, asmaʿuki — женщине) означает «я тебя слышу»; لا أسمعك (lā asmaʿuk) — «я тебя не слышу».
    example_gloss: Я тебя не слышу.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Повторить
    gloss: повтори
    note: 'أعد (aʿid) говорят мужчине; женщине: أعيدي (aʿīdī). أعد من فضلك — вежливая просьба повторить.'
    example_gloss: Я тебя не слышу. Повтори, пожалуйста.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Говорить медленно
    gloss: говори медленно
    note: 'تكلم ببطء (takallam bi-buṭʾ) говорят мужчине; женщине: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Говори медленнее, пожалуйста.
  ar.a1.unit23.lesson02.teach.message:
    title: Сообщение
    gloss: сообщение
    note: رسالة (risāla) — это сообщение; также может означать «письмо».
    example_gloss: Это сообщение.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Встреча
    gloss: запись, приём
    note: موعد (mawʿid) означает «встреча, назначенное время»; الموعد (al-mawʿid) — это «назначенная встреча».
    example_gloss: Встреча в пять часов.
  ar.a1.unit23.lesson02.teach.line01:
    title: Ответ по телефону
    gloss: Юсуф здоровается с Лейлой по телефону и называет своё имя.
    note: По телефону أنا يوسف (anā Yūsuf) — так называют себя, когда звонят.
    example_gloss: 'Юсуф сказал: Здравствуйте, я Юсуф.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Плохо слышно
    gloss: Лейла говорит, что не слышит Юсуфа.
    note: Эта фраза подводит к просьбе уточнить.
    example_gloss: 'Лейла сказала: Здравствуй, Юсуф, я тебя не слышу.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Просьба говорить медленнее
    gloss: Лейла просит Юсуфа говорить медленно.
    note: من فضلك делает просьбу вежливой; Лейла говорит تكلم, потому что обращается к мужчине.
    example_gloss: 'Лейла сказала: Говори медленно, пожалуйста.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Главная деталь
    gloss: Юсуф говорит, что встреча в пять часов.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) означает «в пять часов».
    example_gloss: 'Юсуф сказал: Встреча в пять часов.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Просьба повторить
    gloss: Лейла просит Юсуфа повторить.
    note: أعد من فضلك — это просьба повторить.
    example_gloss: 'Лейла сказала: Повтори, пожалуйста.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Повтор детали
    gloss: Юсуф повторяет время встречи.
    note: Повторённая фраза подтверждает время.
    example_gloss: 'Юсуф сказал: Встреча в пять часов.'
