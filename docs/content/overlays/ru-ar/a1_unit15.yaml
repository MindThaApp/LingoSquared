teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Чем
    gloss: чем
    note: من (min) — то же слово, что и «из» (أنا من لبنان); после сравнительной формы оно означает «чем».
    example_gloss: Рынок больше, чем кафе.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Больше
    gloss: больше
    note: أكبر (akbar) образовано от كبير (kabīr, «большой»). Сравнительные формы أكبر, أصغر, أقرب и أرخص начинаются с أ и одинаковы для мужского и женского рода.
    example_gloss: Рынок больше, чем кафе.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Меньше
    gloss: меньше
    note: أصغر (aṣghar), «меньше», строится по той же модели с أ, что и أكبر.
    example_gloss: Кафе меньше, чем рынок.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Ближе
    gloss: ближе
    note: 'أقرب (aqrab) сравнивает расстояние: «ближе».'
    example_gloss: Кафе ближе, чем рынок.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: Рынок больше
    gloss: Рынок больше, чем кафе
    note: В таком сравнении в арабском не нужно отдельное слово для «есть».
    example_gloss: 'Юсуф сказал: Рынок больше, чем кафе.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Ближе
    gloss: ближе
    note: 'أقرب (aqrab) сравнивает расстояние: «ближе».'
    example_gloss: Кафе ближе, чем рынок.
  ar.a1.unit15.lesson02.teach.cheaper:
    title: Дешевле
    gloss: дешевле
    note: 'أرخص (arkhaṣ) сравнивает цену: «дешевле».'
    example_gloss: Вода дешевле, чем кофе.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: Кафе ближе
    gloss: Кафе ближе, чем рынок
    note: Перед вторым предметом сравнения всегда ставится من.
    example_gloss: 'Юсуф сказал: Кафе ближе, чем рынок.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Спросить о предпочтении
    gloss: Лейла спрашивает, что предпочитает Юсуф.
    note: 'Лейла говорит تفضل (tufaḍḍil), потому что обращается к мужчине; к женщине: ماذا تفضلين؟'
    example_gloss: 'Лейла сказала: Что ты предпочитаешь?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Предпочитаю кафе
    gloss: Юсуф говорит, что предпочитает кафе.
    note: После أفضل можно назвать место как предпочитаемый вариант.
    example_gloss: 'Юсуф сказал: Я предпочитаю кафе.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Сравнение расстояния
    gloss: Юсуф говорит, что кафе ближе, чем рынок.
    note: أقرب من называет причину.
    example_gloss: 'Юсуф сказал: Кафе ближе, чем рынок.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Сравнение размера
    gloss: Нур добавляет, что рынок больше, чем кафе.
    note: 'والسوق (was-sūq) — это و («и»), слитное с السوق: «и рынок».'
    example_gloss: 'Нур сказала: А рынок больше, чем кафе.'
