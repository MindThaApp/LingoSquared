teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: Боль
    gloss: боль
    note: ألم (alam) значит «боль»; عندي ألم (ʿindī alam) — «у меня боль».
    example_gloss: У меня боль.
  ar.a1.unit17.lesson01.teach.head:
    title: Голова
    gloss: голова
    note: الرأس (ar-raʾs) — это голова. По-арабски говорят عندي ألم في الرأس — «у меня боль в голове», тогда как по-русски обычно говорят «у меня болит голова».
    example_gloss: У меня боль в голове.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Желудок
    gloss: живот
    note: البطن (al-baṭn) — это живот, область живота.
    example_gloss: У меня боль в животе.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Боль в голове
    gloss: У меня болит голова
    note: عندي ألم, буквально «у меня (есть) боль», — так по-арабски говорят о боли; في + часть тела указывает, где болит.
    example_gloss: 'Лейла сказала: У меня болит голова.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: В чём проблема?
    gloss: В чём проблема?
    note: ما (mā) значит «что»; المشكلة (al-mushkila) — «проблема».
    example_gloss: В чём проблема, Лейла?
  ar.a1.unit17.lesson02.teach.drink:
    title: Пей воду
    gloss: пей воду
    note: اشربي (ishrabī) — команда «пей!», обращённая к женщине, здесь к Лейле; к мужчине говорят اشرب (ishrab).
    example_gloss: 'Юсуф сказал: Пей воду.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Отдых
    gloss: отдохни
    note: استريحي (istarīḥī) — команда «отдохни!», обращённая к женщине; к мужчине говорят استرح (istariḥ).
    example_gloss: Сегодня отдыхай.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Мне нужна помощь
    gloss: Мне нужна помощь
    note: أحتاج (aḥtāj) означает «мне нужно», а مساعدة (musāʿada) — «помощь». Тебе встретится и أحتاج إلى مساعدة, с إلى; оба варианта правильны.
    example_gloss: У меня болит. Мне нужна помощь.
  ar.a1.unit17.lesson02.teach.line01:
    title: Спросить о проблеме
    gloss: Юсуф спрашивает Лейлу, что случилось.
    note: يا ليلى — обращение к Лейле по имени.
    example_gloss: 'Юсуф сказал: Что случилось, Лейла?'
  ar.a1.unit17.lesson02.teach.line02:
    title: Назвать симптом
    gloss: Лейла говорит, что у неё болит голова.
    note: Симптом называется прямо.
    example_gloss: 'Лейла сказала: У меня болит голова.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Простой совет
    gloss: Юсуф советует Лейле выпить воды и отдохнуть.
    note: 'Обе команды в женском роде, потому что Юсуф обращается к Лейле; و (wa, «и») пишется слитно со следующим словом: واستريحي.'
    example_gloss: 'Юсуф сказал: Выпей воды и отдохни.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Благодарность
    gloss: Лейла говорит «спасибо».
    note: شكرا завершает короткий обмен репликами.
    example_gloss: 'Лейла сказала: Спасибо.'
