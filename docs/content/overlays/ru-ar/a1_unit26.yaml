course:
  title: Арабский язык A1
  description: 'Арабский для начинающих: как описать внешность человека — рост и возраст, цвет волос и глаз, вопрос كيف تبدو؟ (kayfa tabdū?) и сравнение двух людей с помощью أطول من (aṭwal min).'
