teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: 'طويل (ṭawīl) значит «высокий», а قصير (qaṣīr) — «низкий, невысокий». Для женщины к ним добавляется ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Сара высокая.
    - Карим невысокий.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: كبير في السن (kabīr fī as-sinn) и صغير في السن (ṣaghīr fī as-sinn) передают общее впечатление о возрасте, а не точное число лет.
    example_gloss:
    - Дедушка пожилой.
    - Юсуф молодой.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'Возраст: число или впечатление'
    gloss: كم عمرك؟ (kam ʿumruka?) спрашивает о числе лет, а كبير في السن (kabīr fī as-sinn) даёт общее впечатление без числа, как в фразе الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Чтобы узнать точный возраст человека, спрашивай كم عمرك؟. А كبير في السن лишь описывает, насколько человек выглядит немолодым.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Сара высокая, а Карим невысокий
    gloss: Сара высокая, а Карим невысокий.
    note: 'و (wa-) соединяет два предложения и пишется слитно со следующим словом: وكريم (wa-karīm). Прилагательные согласуются: سارة طويلة — женский род, а كريم قصير — мужской.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Волосы
    gloss: волосы
    note: 'الشعر (ash-shaʿr) означает «волосы». Буква ش — «солнечная», поэтому ل артикля ال не произносится: ash-shaʿr.'
    example_gloss: У Юсуфа короткие чёрные волосы.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: 'أشقر (ashqar), بني (bunnī) и رمادي (ramādī) описывают волосы и стоят после существительного: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - У Лейлы светлые волосы.
    - У Карима каштановые волосы.
    - У дедушки седые волосы.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: 'طويل (ṭawīl) и قصير (qaṣīr) тоже описывают волосы: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Они стоят после شعر, которое мужского рода.'
    example_gloss:
    - У Сары длинные волосы.
    - У Карима короткие волосы.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Прилагательное стоит после существительного
    gloss: 'В арабском языке прилагательное стоит после существительного и согласуется с ним: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) мужского рода, поэтому и его прилагательные мужского рода. Если существительное неопределённое, ни одно из двух слов не принимает ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Волосы и её волосы
    gloss: شعر (shaʿr) означает «волосы». Добавь местоимение ها (hā, её) — получится شعرها (shaʿruhā, её волосы).
    note: 'Окончание ها указывает на владельца: شعرها (её волосы), اسمها (её имя), عيناها (её глаза). Оно пишется слитно со словом.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: У Юсуфа короткие чёрные волосы
    gloss: У Юсуфа короткие чёрные волосы.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) перед именем означает «у … есть» и пишется слитно с именем.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: У Лейлы длинные светлые волосы
    gloss: У Лейлы длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Глаза
    gloss: глаза
    note: 'العينان (al-ʿaynān) означает «глаза». Это существительное в двойственном числе: в арабском есть особое окончание ان для ровно двух предметов.'
    example_gloss: У Юсуфа карие глаза.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: 'أزرق (azraq) «синий», بني (bunnī) «карий» и أخضر (akhḍar) «зелёный» — формы мужского рода. С عينان используются формы двойственного числа: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - У Лейлы голубые глаза.
    - У Карима карие глаза.
    - У Сары зелёные глаза.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Глаза в двойственном числе и прилагательное в двойственном числе
    gloss: 'عينان (ʿaynān) стоит в двойственном числе, поэтому прилагательное тоже в двойственном числе: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: В двойственном числе окончание ان добавляется и к существительному, и к прилагательному. Прилагательное при этом женского рода, потому что عين — существительное женского рода.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Как выглядит Лейла?
    gloss: Как выглядит Лейла?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) — «Как выглядит Лейла?» تبدو (tabdū) в женском роде, потому что Лейла — женщина; о мужчине говорят يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: У Лейлы длинные светлые волосы и голубые глаза
    gloss: У Лейлы длинные светлые волосы и голубые глаза.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + имя означает «у … есть», а و соединяет волосы и глаза.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Лейла рассказывает о Нур
    gloss: 'Лейла: В языковое кафе придёт новая девушка. Её зовут Нур.'
    note: 'ستأتي (sa-taʾtī) означает «она придёт»: س (sa-) указывает на будущее время, а ت (ta-) означает «она». اسمها (ismuhā) означает «её имя».'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Юсуф спрашивает, как она выглядит
    gloss: 'Юсуф: Хорошо! Как она выглядит?'
    note: 'В вопросе كيف تبدو؟ (kayfa tabdū?) на этот раз нет имени: глагол تبدو уже означает «она выглядит».'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Лейла описывает рост и волосы Нур
    gloss: 'Лейла: Она невысокая, у неё короткие светлые волосы.'
    note: قصيرة (qaṣīra) в женском роде, потому что Нур — женщина, но в شعر قصير أشقر прилагательные остаются в мужском роде, так как شعر — существительное мужского рода.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Юсуф спрашивает о её глазах
    gloss: 'Юсуф: А глаза?'
    note: 'وعيناها (wa-ʿaynāhā) означает «и её глаза»: و (wa-) пишется слитно с существительным, а ها (hā) на конце означает «её».'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Лейла описывает глаза Нур
    gloss: 'Лейла: У неё зелёные глаза.'
    note: 'لها (lahā) означает «у неё есть»: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) — существительное в двойственном числе с прилагательным в двойственном числе.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Юсуф узнает её
    gloss: 'Юсуф: Спасибо! Тогда я её узнаю.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) означает «я её узнаю»: س (sa-) указывает на будущее время, а ها в عليها означает «её».'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Сравниваем Карима и Сару
    gloss: Карим и Сара — брат и сестра, но выглядят они по-разному. Карим невысокого роста, у него короткие каштановые волосы и карие глаза. Сара выше Карима, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      أخ: брат
      أخت: сестра
      تبدو: выглядеть
      مختلفان: разный
      القامة: невысокий (о росте)
      قصير: невысокий
      بني: карий
      شعر: волосы
      بنيتان: карий
      وعينان: глаза
      أطول: выше
      طويل: длинный
      خضراوان: зелёный
      المظهر: внешность (как выглядит человек)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Сравнение с أفعل
    gloss: 'Чтобы сравнить, используй форму أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm) — «Сара выше Карима».'
    note: طويل (ṭawīl) в сравнительной степени превращается в أطول (aṭwal), а من (min) означает «чем». Эта форма не меняется для женщины.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: У Сары волосы длиннее, чем у Карима
    gloss: У Сары волосы длиннее, чем у Карима.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول остаётся в мужском роде, потому что شعر — существительное мужского рода.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: 'لدي (ladayya) означает «у меня есть»; в арабском нет глагола «иметь». Прилагательные стоят после существительного: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Юсуф замечает Нур
    gloss: 'Юсуф: Смотри, это Нур? У неё короткие светлые волосы и зелёные глаза.'
    note: انظري (unẓurī) — повелительное наклонение для женщины, потому что Юсуф обращается к Лейле; для мужчины говорят انظر (unẓur). هذه (hādhihi) означает «эта» и употребляется с существительным женского рода.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Лейла подтверждает
    gloss: 'Лейла: Да, это Нур!'
    note: Короткое естественное подтверждение.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Нур здоровается с Юсуфом
    gloss: 'Нур: Привет, ты Юсуф?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) — вопрос с ответом «да» или «нет»: هل (hal) + предложение без глагола «быть».'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Юсуф отвечает на приветствие Нур
    gloss: 'Юсуф: Да! Рад познакомиться, Нур.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) — вежливая фраза при первой встрече. ب (bi-) пишется слитно с معرفتك, а ك на конце означает «тебя».
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Нур отвечает на приветствие
    gloss: 'Нур: Я тоже рада познакомиться!'
    note: 'Диалог заканчивается: Юсуф успешно узнал Нур по описанию Лейлы.'
