course:
  title: Арабский язык A1
  description: 'Арабский для начинающих: разговор о домашних животных и распространённых зверях — как их назвать, как за ними ухаживать (гулять, кормить, играть), как сказать, что ты любишь животных, даже если у тебя их нет, и частые формы множественного числа.'
