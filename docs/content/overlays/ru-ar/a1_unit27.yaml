teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: حيوان (ḥayawān) означает «животное», а حيوان أليف (ḥayawān alīf) — «домашнее животное». أليف (alīf) — прилагательное со значением «ручной», оно стоит после существительного.
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Собака и кот
    gloss: собака / кот
    example_gloss:
    - У Лейлы есть собака.
    - У Карима есть кошка.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нур есть птица.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: 'هل لديك (hal ladayka) значит «у тебя есть ...?». К женщине пишется так же, но последняя гласная — i: ladayki. هل (hal) начинает вопрос с ответом «да/нет».'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: 'ليس لدي (laysa ladayya) означает «у меня нет»: ليس (laysa) выражает отрицание, а لدي (ladayya) — «у меня есть».'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Отсутствие: ليس لدي'
    gloss: 'Чтобы сказать, что у тебя чего-то нет, используй ليس لدي (laysa ladayya): ليس لدي وقت (у меня нет времени), ليس لدي حيوان أليف (у меня нет домашнего животного).'
    note: ليس لدي употребляется с любым существительным и не меняется по роду. Для «у него» и «у неё» говори ليس لديه (laysa ladayhi) и ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) буквально означает «взять животное на прогулку». Глагол أخذ значит «брать».
    example_gloss: Я выгуливаю собаку каждый день.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Глагол изменяется по лицам
    gloss: 'Глагол изменяется по лицам: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha) — «я веду собаку гулять»; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha) — «Карим ведёт свою собаку гулять».'
    note: Начальная буква أ (a-) обозначает «я», а ي (ya-) — «он». نزهة (nuzha) — это прогулка или короткая вылазка.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Играть с
    gloss: играть с
    example_gloss: Карим играет со своей кошкой.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: 'كل يوم (kull yawm) означает «каждый день»: كل + существительное в единственном числе без ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: أطعم (uṭʿim) означает «я кормлю». القطة (al-qiṭṭa) — женского рода, а артикль ال пишется слитно с существительным.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Множественное число: كلب → كلاب'
    gloss: 'Многие формы множественного числа неправильные, поэтому учи их вместе с существительным: كلب (kalb) → كلاب (kilāb), قطة (qiṭṭa) → قطط (qiṭaṭ), طائر (ṭāʾir) → طيور (ṭuyūr).'
    note: В арабском в основном «ломаные» формы множественного числа, поэтому каждую форму учат вместе с её существительным; при множественном числе названий животных прилагательное ставится в женском роде единственного числа.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Юсуф любит собак.
    - Сара любит кошек.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Рыбы и птицы
    gloss: рыбы / птицы
    example_gloss:
    - Я обожаю рыбок.
    - Дедушка обожает птиц.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) означает «я люблю животных». Множественное число оканчивается на ات и принимает артикль ال, пишущийся слитно.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Сара любит кошек, но у неё нет домашнего животного
    gloss: Сара любит кошек, но у неё нет домашнего животного.
    note: 'Готовит противопоставление, на котором построен текст для чтения: любить животных и иметь питомца.'
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Юсуф спрашивает о домашнем животном
    gloss: 'Юсуф: У тебя есть домашнее животное, Лейла?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: У Лейлы есть собака
    gloss: 'Лейла: Да, у меня есть собака.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Юсуф спрашивает, как он выглядит
    gloss: 'Юсуф: Как он выглядит?'
    note: كيف يبدو؟ (kayfa yabdū?) — «Как он выглядит?». يبدو (yabdū) стоит в мужском роде, потому что كلب, «собака», — существительное мужского рода.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Лейла описывает свою собаку
    gloss: 'Лейла: У него коричневая шерсть, и он маленький.'
    note: Слова о цвете волос и размере из раздела о внешности, но теперь они описывают шерсть животного, а не волосы человека.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Местоимения для животных
    gloss: 'Каждое слово для животного — мужского или женского рода: собака — هو (huwa, он), кошка — هي (hiya, она). Окончание ه в أطعمه (uṭʿimuhu) значит «его».'
    note: Название животного мужского рода, например كلب, требует местоимений и прилагательных мужского рода, а женского рода, например قطة, — женского.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Юсуф спрашивает о прогулках
    gloss: 'Юсуф: Ты гуляешь с ним каждый день?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Лейла рассказывает о своём распорядке
    gloss: 'Лейла: Да, я гуляю с ним каждый день и кормлю его.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Юсуф, Сара и Карим о животных
    gloss: 'Юсуф и Сара оба любят животных, но ни у одного из них нет питомца. Юсуф любит собак, а Сара любит кошек. А вот у Карима есть питомец: кошка. Он много играет со своей кошкой и каждый день кормит её. А у тебя есть питомец?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      يحبان: обожать
      كلاهما: оба
      الحيوانات: животные
      منهما: из них (ни у одного из них)
      أليف: питомец (букв. ручной)
      الكلاب: собаки
      القطط: коты
      قطة: кот
      يلعب: играет
      ويعطي: даёт
      كل: каждый
      طعاما: еда
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Карим много играет со своей кошкой
    gloss: Карим много играет со своей кошкой.
    note: 'قطته (qiṭṭatuhu) значит «его кошка»: окончание ه (hu) означает «его», а ة в слове قطة перед ним превращается в ت.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Я обожаю собак. У меня нет питомца.
    gloss: Я обожаю собак. У меня нет питомца.
    note: Образец ответа из двух предложений, который можно использовать в письменном задании раздела.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Лейла спрашивает Нур
    gloss: 'Лейла: Нур, а у тебя тоже есть питомец?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: У Нур есть птица по имени Пико
    gloss: 'Нур: Да, у меня есть птица. Её зовут Пико.'
    note: اسمه (ismuhu) значит «его имя»; ه на конце означает «его». بيكو (bīkū) — имя птицы.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Реакция Юсуфа
    gloss: 'Юсуф: Как здорово! Что ты делаешь с ним каждый день?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Нур каждый день кормит птицу
    gloss: 'Нур: Я кормлю его каждый день.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Юсуф тоже любит птиц
    gloss: 'Юсуф: Я тоже люблю птиц.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Лейла завершает разговор
    gloss: 'Лейла: Как здорово, что мы втроём любим животных!'
    note: Подводит итог всем фактам о животных, которые рассказали три героя раздела.
