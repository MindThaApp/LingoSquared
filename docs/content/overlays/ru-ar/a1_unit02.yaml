teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Как тебя зовут?
    gloss: Как вас зовут?
    note: ما اسمك؟ (mā ismuk) — стандартный способ спросить имя; без огласовок написание подходит для любого собеседника.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Меня зовут
    gloss: меня зовут
    note: اسمي (ismī) состоит из слова اسم («имя») и притяжательного окончания ـي («мой»).
    example_gloss: Меня зовут Карим.
  ar.a1.unit02.lesson01.teach.ana:
    title: Я
    gloss: я
    note: أنا (anā) — личное местоимение «я»; в арабском глагол сам указывает на лицо, но أنا используется для выделения и в простых предложениях без глагола, как это.
    example_gloss: Я Сара.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Приятно познакомиться
    gloss: приятно познакомиться
    note: تشرفنا (tasharrafnā), буквально «мы удостоены чести», — стандартный взаимный ответ при знакомстве; первым это может сказать любой из собеседников.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: Откуда ты?
    gloss: Откуда вы?
    note: من أين أنت؟ (min ayna anta — мужчине, min ayna anti — женщине) — вопрос о происхождении; без огласовок написание одинаково для обоих.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Я из
    gloss: я из
    note: За أنا من (anā min) сразу следует название страны или города.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Ливан
    gloss: Ливан
    note: لبنان (lubnān) употребляется без определённого артикля, в отличие от большинства других стран в этом уроке.
    example_gloss: Я из Ливана.
  ar.a1.unit02.lesson02.teach.misr:
    title: Египет
    gloss: Египет
    note: مصر (miṣr) тоже употребляется без определённого артикля.
    example_gloss: Я из Египта.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Иордания
    gloss: Иордания
    note: الأردن (al-ʾurdun) всегда употребляется с определённым артиклем الـ как частью названия, как и المغرب и العراق в этом уроке.
    example_gloss: Я из Иордании.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Марокко
    gloss: Марокко
    note: المغرب (al-maghrib) буквально означает «запад» — тот же корень, что и в названии вечерней молитвы при закате.
    example_gloss: Я из Марокко.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Сирия
    gloss: Сирия
    note: سوريا (sūryā) употребляется без определённого артикля.
    example_gloss: Я из Сирии.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Ирак
    gloss: Ирак
    note: العراق (al-ʿirāq) употребляется с определённым артиклем.
    example_gloss: Я из Ирака.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Ты из...?
    gloss: Ты из Египта?
    note: هل (hal) — вопросительная частица для вопросов с ответом «да/нет». Она ставится в начале предложения и сама по себе ничего не значит.
  ar.a1.unit02.lesson03.teach.naam:
    title: Да
    gloss: да
    note: نعم (naʿam) — обычный утвердительный ответ.
    example_gloss: Да, я из Египта.
  ar.a1.unit02.lesson03.teach.laa:
    title: Нет
    gloss: нет
    note: لا (lā) — обычный отрицательный ответ.
    example_gloss: Нет, я из Ливана.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Рад был познакомиться
    gloss: Рад был познакомиться
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) — более тёплая заключительная фраза, чем تشرفنا; её часто говорят перед самым прощанием.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Добро пожаловать
    gloss: добро пожаловать / тебе здесь рады
    note: 'مرحبا بك (marḥaban bik) содержит بك — «тебе»: предлог بـ с местоименным суффиксом ـك («ты»). Это тот же بك, что и в أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Первое приветствие
    gloss: Юсуф приветствует Лейлу.
    note: Разговор начинается с простого مرحبا, ещё до того как собеседники назвали свои имена.
  ar.a1.unit02.lesson04.teach.line02:
    title: Первое приветствие, ответ
    gloss: Лейла отвечает на приветствие.
    note: Одно и то же слово مرحبا подходит обеим сторонам при приветствии.
  ar.a1.unit02.lesson04.teach.line03:
    title: Вопрос об имени
    gloss: Юсуф спрашивает, как её зовут.
    note: ما اسمك؟ — с этого вопроса начинается знакомство.
  ar.a1.unit02.lesson04.teach.line04:
    title: Вопрос об имени, ответ
    gloss: Лейла отвечает и задаёт тот же вопрос ему.
    note: وأنت؟ повторяет вопрос, не произнося всю фразу заново, — это обычный короткий приём.
  ar.a1.unit02.lesson04.teach.line05:
    title: Ответ и взаимная радость
    gloss: Юсуф называет своё имя и говорит, что рад знакомству.
    note: تشرفنا завершает обмен именами.
  ar.a1.unit02.lesson04.teach.line06:
    title: Взаимная радость, ответ
    gloss: Лейла отвечает той же фразой.
    note: تشرفنا естественно говорят оба собеседника, а не только один.
  ar.a1.unit02.lesson04.teach.line07:
    title: Вопрос о происхождении
    gloss: Юсуф спрашивает, откуда она.
    note: من أين أنت؟ переводит разговор на тему того, кто откуда.
  ar.a1.unit02.lesson04.teach.line08:
    title: Вопрос о происхождении, ответ
    gloss: Лейла отвечает и спрашивает его в ответ.
    note: Она снова использует وأنت؟ — тот же короткий приём, что и раньше в диалоге.
  ar.a1.unit02.lesson04.teach.line09:
    title: Рассказ о происхождении
    gloss: Юсуф говорит, что он из Ливана.
    note: أنا من لبنان построено по той же модели, что и в предыдущем уроке.
  ar.a1.unit02.lesson04.teach.line10:
    title: Завершение разговора
    gloss: Лейла говорит, что рада была познакомиться.
    note: سعدت بلقائك показывает, что разговор подходит к концу.
  ar.a1.unit02.lesson04.teach.line11:
    title: Прощание
    gloss: Юсуф говорит, что всегда рад её видеть, и прощается.
    note: دائما («всегда») превращает مرحبا بك в приглашение приходить в любое время перед прощанием مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Прощание, ответ
    gloss: Лейла прощается.
    note: مع السلامة завершает разговор; эта фраза уже встречалась в первом уроке.
