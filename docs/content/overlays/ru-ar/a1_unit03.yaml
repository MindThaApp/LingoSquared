teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Один
    gloss: один
    note: واحد (wāḥid) используется и сам по себе, без существительного, чтобы ответить на вопрос «сколько?»
    example_gloss: У меня одна книга.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Два
    gloss: два
    note: اثنان (ithnān) — самостоятельная словарная форма числа «два».
    example_gloss: У меня два брата.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Три
    gloss: три
    note: ثلاثة (thalātha) — самостоятельная словарная форма числа «три».
    example_gloss: Один, два, три.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Четыре
    gloss: четыре
    note: أربعة (arbaʿa) — самостоятельная словарная форма числа «четыре».
    example_gloss: У меня четыре книги.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Пять
    gloss: пять
    note: خمسة (khamsa) — самостоятельная словарная форма числа «пять».
    example_gloss: У меня пять книг.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Шесть
    gloss: шесть
    note: ستة (sitta) — самостоятельная словарная форма числа «шесть».
    example_gloss: У меня шесть книг.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Семь
    gloss: семь
    note: سبعة (sabʿa) — самостоятельная словарная форма числа «семь».
    example_gloss: У меня семь книг.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Восемь
    gloss: восемь
    note: ثمانية (thamāniya) — самостоятельная словарная форма числа «восемь».
    example_gloss: У меня восемь книг.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Девять
    gloss: девять
    note: تسعة (tisʿa) — самостоятельная словарная форма числа «девять».
    example_gloss: У меня девять дирхамов.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Десять
    gloss: десять
    note: عشرة (ʿashara) — самостоятельная словарная форма числа «десять».
    example_gloss: У меня десять динаров.
  ar.a1.unit03.lesson03.teach.kam:
    title: Сколько это стоит?
    gloss: Сколько это стоит?
    note: كم هذا؟ (kam hādhā) — простой способ спросить цену; очень часто говорят и بكم هذا؟ (bi-kam hādhā, буквально «за сколько это?»).
  ar.a1.unit03.lesson03.teach.raqam:
    title: Номер
    gloss: номер
    note: رقم (raqam) — общее слово для числа или номера, например номера телефона.
    example_gloss: Мой номер — один.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Спросить цену
    gloss: Юсуф спрашивает, сколько что-то стоит.
    note: كم هذا؟ начинает разговор.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Назвать цену
    gloss: Лейла отвечает, что это стоит пять.
    note: بخمسة присоединяет предлог بـ («за», «по цене») прямо к числу.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Спроси о другой вещи
    gloss: Юсуф показывает на другую вещь.
    note: وهذا؟ сокращает вопрос, опираясь на предыдущий контекст.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Назови вторую цену
    gloss: Лейла отвечает, что это стоит десять.
    note: بعشرة строится так же, как بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Скажи спасибо
    gloss: Юсуф благодарит её.
    note: شكرا из раздела о приветствиях завершает разговор.
