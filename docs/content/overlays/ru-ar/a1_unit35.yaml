  ar.a1.unit35.lesson05.teach.and_lyla_trd:
    title: Лейла отправляет посылку
    gloss: У Лейлы есть посылка для бабушки и дедушки в Бейруте. Она покупает марку на почте. Она пишет адрес на посылке. Посылка прибудет к ним завтра. Письмо идёт три дня.
    note: 'Короткий текст о посылке. Глагол согласуется с подлежащим: الطرد يصل (aṭ-ṭard yaṣil) для существительного мужского рода, но ليلى تشتري (Layla tashtarī) для женщины.'
    glosses:
      طرد: посылка
      لجدها: для её дедушки
      وجدتها: и её бабушка
      تشتري: покупает
      طابعا: марка
      البريد: почта
      تكتب: пишет
      العنوان: адрес
      يصل: прибывает (глагол мужского рода)
      غدا: завтра
      إليهما: к ним (двоим); глагол с этим словом означает «прибывает к ним»
      الرسالة: письмо
      تستغرق: занимает (столько-то времени)
      ثلاثة: три
      أيام: дни
