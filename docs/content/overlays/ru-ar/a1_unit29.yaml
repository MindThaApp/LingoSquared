  ar.a1.unit29.lesson03.teach.and_shbak_altdhakr:
    title: 'Вежливая просьба: من فضلك'
    gloss: 'В кассе, чтобы вежливо попросить билет, говорят من فضلك (min faḍlik, «пожалуйста»): تذكرة إلى القاهرة، من فضلك — «Билет до Каира, пожалуйста». Для мужчины и для женщины это пишется одинаково.'
    note: Повторяем вежливую форму общения, которую ты уже встречал(а) в ситуациях обслуживания.
  ar.a1.unit29.lesson03.teach.tdhkra_ila_alqahra:
