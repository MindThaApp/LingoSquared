  ar.a1.unit29.lesson02.teach.kthyra_wkl_ywm:
    title: Те же слова для транспорта
    gloss: 'كثيرا (kathīran) и كل يوم (kull yawm) тебе уже знакомы, и с транспортом они тоже работают: أركب الدراجة كثيرا (arkab ad-darrāja kathīran) — «Я часто езжу на велосипеде», أسافر بالقطار كل يوم (usāfir bi-l-qiṭār kull yawm) — «Я езжу на поезде каждый день».'
    note: Повторяем лексику о частоте, которую ты уже учил(а) в темах о хобби и спорте, теперь в теме поездок на работу.
