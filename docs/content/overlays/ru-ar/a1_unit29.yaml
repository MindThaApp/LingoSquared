    gloss: 'Сара: Как ты добираешься до работы, Юсуф?'
  ar.a1.unit29.lesson04.teach.ywsf_arkb_aldraja:
    title: Юсуф отвечает
    gloss: 'Юсуф: Обычно езжу на велосипеде, это недалеко.'
  ar.a1.unit29.lesson04.teach.sara_wmadha_lw:
    title: Сара спрашивает про дождь
    gloss: 'Сара: А если идёт дождь?'
  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: Глагол изменяется по лицам
    gloss: 'Глагол изменяется по лицам: أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī) — «Я еду на работу на велосипеде», يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi) — «Юсуф едет на работу на велосипеде».'
    note: Начальная буква أ (a-) указывает на «я», а ي (ya-) — на «он». Окончание ي в слове عملي означает «мой», а окончание ه в слове عمله — «его».
  ar.a1.unit29.lesson04.teach.ywsf_idhn_adhhb:
    title: Юсуф отвечает
    gloss: 'Юсуф: Тогда я еду на поезде вместе с Лейлой.'
  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Кто как добирается?
    gloss: Лейла ездит на работу на поезде каждый день. Юсуф обычно ездит на велосипеде, но когда идёт дождь, тоже едет на поезде. Карим предпочитает водить машину. Сара живёт рядом и ходит на работу пешком. А как ты добираешься до работы?
    note: Глаголы, относящиеся к женщинам (تسافر, تسكن, تمشي), начинаются с ت (ta-), а глаголы, относящиеся к мужчинам (يركب, يذهب, يقود, يفضل), — с ي (ya-).
    glosses:
      تسافر: ездит
      كل: каждый
      يوم: день
      بالقطار: на поезде
      عملها: работать
      يركب: ездит на велосипеде
      غالبا: обычно
      أمطرت: идёт дождь
      يذهب: едет, садится (на транспорт)
      يقود: ездит на машине
      يفضل: предпочитает
      السيارة: машина
      تسكن: живёт
      قريبا: близко
      وتمشي: ходит пешком
      تذهب: ездишь, добираешься
  ar.a1.unit29.lesson05.teach.sara_tskn_qryba:
    title: Сара живёт рядом и ходит на работу пешком
    gloss: Сара живёт рядом и ходит на работу пешком.
  ar.a1.unit29.lesson06.teach.lyla_hl_nrkb:
    title: Лейла предлагает
    gloss: 'Лейла: Поедем вместе на велосипедах в языковое кафе?'
  ar.a1.unit29.lesson06.teach.krym_afdl_an:
    title: Карим предпочитает машину
    gloss: 'Карим: Я лучше поеду на машине.'
  ar.a1.unit29.lesson06.teach.sara_amshy_fhw:
    title: Сара пойдёт пешком
    gloss: 'Сара: Я пойду пешком, это близко.'
  ar.a1.unit29.lesson06.teach.ywsf_hsna_idhn:
    title: Юсуф соглашается
    gloss: 'Юсуф: Хорошо, тогда я поеду с тобой на велосипеде, Лейла!'
    note: 'Подводим итог: у всех четырёх героев есть свой способ добираться, о которых шла речь в этом уроке.'
