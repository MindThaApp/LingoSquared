  ar.a1.unit30.lesson02.teach.alrsala:
    title: Сообщение
    gloss: сообщение
    example_gloss: Я отправляю сообщение через приложение.
  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Сообщение: отправить и прочитать'
    gloss: رسالة (risāla) — это сообщение, которое ты отправляешь (أرسل رسالة, ursil risāla) или читаешь (أقرأ رسالة, aqraʾ risāla).
    note: Связывает новое слово с текстом прогноза погоды и с сообщениями, которые люди отправляют и читают.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Лейла отправляет сообщение через приложение
    gloss: Лейла отправляет сообщение через приложение.
    note: 'ترسل (tursil) означает «она отправляет»: начальная буква ت (ta-) указывает на «она». عبر (ʿabra) означает «через».'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Юсуф читает сообщение
    gloss: Юсуф читает сообщение.
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: Искать
    gloss: искать
    example_gloss: Я ищу прогноз погоды.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: Глагол с عن
    gloss: 'После глагола أبحث (abḥath) стоит предлог عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). А أستخدم (astakhdim) присоединяет дополнение напрямую: أستخدم هاتفي.'
    note: عن (ʿan) означает «о» или «в поисках». У каждого арабского глагола свой предлог, поэтому учи их вместе.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Карим ищет прогноз погоды
    gloss: Карим ищет прогноз погоды.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Потом он идёт бегать
    gloss: Потом он идёт бегать.
    note: 'ثم (thumma) означает «потом» и пишется отдельным словом, в отличие от و. يذهب للركض (yadhhab li-r-rakḍ) означает «он идёт бегать»: ل + الركض превращается в للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Лейла предлагает
    gloss: 'Лейла: Займёмся спортом в субботу в десять?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Юсуф соглашается
    gloss: 'Юсуф: Хорошая идея! Я посмотрю прогноз погоды.'
    note: 'فكرة جيدة (fikra jayyida): прилагательное جيدة оканчивается на ة, как и существительное, потому что оба слова женского рода. سأبحث (sa-abḥath) — будущее время: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Юсуф проверяет погоду
    gloss: 'Юсуф: В субботу будет солнечно!'
    note: الجو مشمس (al-jaww mushmis) означает «погода солнечная», без слова «есть» или «является». مشمس мужского рода, чтобы согласоваться с الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Карим видит сообщение
    gloss: 'Карим: Вижу сообщение. До встречи в субботу!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + день
    gloss: 'Ты уже знаешь выражение إلى اللقاء (ilā al-liqāʾ, «до свидания»). К нему можно добавить день: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Модель прощания из темы приветствий переносится на конкретный день.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Кто чем пользуется?
    gloss: Лейла каждый день звонит Юсуфу. Она пользуется телефоном, а не приложением. У Юсуфа нет компьютера дома, но он пользуется интернетом на телефоне. Карим каждое утро смотрит прогноз погоды. Потом он идёт бегать. Сара часто отправляет Лейле сообщения. А ты тоже каждый день пользуешься телефоном?
    note: Сравнивает, как четыре героя пользуются устройствами, по образцу сравнительного текста из темы спорта.
    glosses:
      تتصل: звонит
      كل: каждый
      يوم: день
      تستخدم: пользуется
      هاتفها: телефон
      تطبيقا: приложение
      حاسوب: компьютер
      البيت: дома
      الإنترنت: интернет
      يبحث: ищет, смотрит
      صباح: утро
      توقعات: прогноз (прогноз погоды)
      يذهب: идёт
      للركض: бегать (на пробежку)
      ترسل: отправляет
      كثيرا: часто
      رسالة: сообщение
      تستعمل: пользуешься
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Карим каждое утро ищет прогноз
    gloss: Карим каждое утро ищет прогноз погоды.
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: Сара часто пишет Лейле
    gloss: Сара часто отправляет Лейле сообщения.
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: Лейла подтверждает план
    gloss: 'Лейла: Вижу сообщение. Займёмся спортом в субботу в десять в парке?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Юсуф подтверждает погоду
    gloss: 'Юсуф: Да, и в субботу будет солнечно!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: План Карима
    gloss: 'Карим: Тогда я побегаю. А потом ещё поиграю в футбол.'
    note: 'سأركض (sa-arkuḍ) означает «я побегу»: س указывает на будущее время. بعد ذلك (baʿda dhālik) означает «после этого».'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: План Сары
    gloss: 'Сара: Я бы лучше поплавала, но в парк я тоже приду.'
    note: أفضل (ufaḍḍil) означает «я предпочитаю». لكنني (lākinnanī) означает «но я», а سآتي (sa-ātī) — «я приду».
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Лейла завершает разговор
    gloss: 'Лейла: Отлично! До встречи в субботу в парке!'
    note: Одной фразой завершает переписку этого урока и план из темы спорта.
