teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: Семья
    gloss: семья
    note: عائلة (ʿāʾila) — общее слово «семья». В примере используется هذه — женская форма от هذا («этот»), потому что عائلة женского рода.
    example_gloss: Это семья.
  ar.a1.unit06.lesson01.teach.father:
    title: Отец
    gloss: отец
    note: أب (ab) означает «отец».
    example_gloss: У меня есть отец.
  ar.a1.unit06.lesson01.teach.mother:
    title: Мать
    gloss: мать
    note: أم (umm) означает «мать».
    example_gloss: У меня есть мама.
  ar.a1.unit06.lesson01.teach.brother:
    title: Брат
    gloss: брат
    note: أخ (akh) означает «брат».
    example_gloss: У меня есть брат.
  ar.a1.unit06.lesson01.teach.sister:
    title: Сестра
    gloss: сестра
    note: أخت (ukht) означает «сестра».
    example_gloss: У меня есть брат и сестра.
  ar.a1.unit06.lesson01.teach.i_have:
    title: У меня есть
    gloss: у меня есть
    note: عندي (ʿindī, буквально «при мне») — простой способ сказать на уровне A1, что у тебя что-то есть; لدي (ladayya) — более официальный вариант.
    example_gloss: У меня есть сестра.
  ar.a1.unit06.lesson02.teach.in_family:
    title: В твоей семье
    gloss: в твоей семье
    note: 'Здесь من читается man и значит «кто», а не min «из», как в من أين أنت؟ — пишутся они одинаково. عائلتك значит «твоя семья»: ʿāʾilatuka — к мужчине, ʿāʾilatuki — к женщине.'
    example_gloss: Кто в твоей семье?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Её зовут Нур
    gloss: её зовут Нур
    note: اسمها означает «её имя».
    example_gloss: 'Юсуф сказал: «Её зовут Нур».'
  ar.a1.unit06.lesson02.teach.line01:
    title: Спросить о семье
    gloss: Лейла спрашивает, кто есть в семье Юсуфа.
    note: من (man) здесь значит «кто». يا يوسف — обращение к Юсуфу по имени.
    example_gloss: 'Лейла сказала: «Кто есть в твоей семье, Юсуф?»'
  ar.a1.unit06.lesson02.teach.line02:
    title: Рассказать о семье
    gloss: Юсуф говорит, что у него есть отец, мать и сестра.
    note: و соединяет членов семьи.
    example_gloss: 'Юсуф сказал: «У меня есть отец, мать и сестра».'
  ar.a1.unit06.lesson02.teach.line03:
    title: Спросить имя сестры
    gloss: Лейла спрашивает, как зовут его сестру.
    note: 'أختك значит «твоя сестра»: ukhtuka — к мужчине, ukhtuki — к женщине. Здесь Лейла обращается к Юсуфу, поэтому ukhtuka.'
    example_gloss: 'Лейла сказала: «Как зовут твою сестру?»'
  ar.a1.unit06.lesson02.teach.line04:
    title: Назвать её имя
    gloss: Юсуф говорит, что её зовут Нур.
    note: 'Окончание ـها означает «её»: اسمها (ismuhā) — «её имя».'
    example_gloss: 'Юсуф сказал: «Её зовут Нур».'
