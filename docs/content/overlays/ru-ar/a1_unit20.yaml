teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: Погода
    gloss: погода
    note: الجو (al-jaww) — обычное слово для «погоды»; الطقس (aṭ-ṭaqs), как в названии раздела, тоже значит «погода».
    example_gloss: Какая сегодня погода?
  ar.a1.unit20.lesson01.teach.sunny:
    title: Солнечно
    gloss: солнечный
    note: مشمس (mushmis) значит «солнечный»; слово мужского рода, потому что согласуется с الجو.
    example_gloss: Сегодня солнечно.
  ar.a1.unit20.lesson01.teach.cold:
    title: Холодно
    gloss: холодный
    note: بارد (bārid) значит «холодный».
    example_gloss: Сегодня холодно.
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: Сегодня солнечно
    gloss: сегодня солнечно
    note: В арабском не нужно отдельное слово для связки «есть» (в русском в настоящем времени её тоже нет).
    example_gloss: 'Юсуф сказал: «Сегодня солнечно».'
  ar.a1.unit20.lesson02.teach.hot:
    title: Жарко
    gloss: жарко
    note: حار (ḥārr) значит «жаркий».
    example_gloss: Жарко.
  ar.a1.unit20.lesson02.teach.weather_question:
    title: Какая погода?
    gloss: Какая сегодня погода?
    note: كيف (kayfa) значит «как», например в вопросе كيف حالك؟
    example_gloss: 'Лейла спросила: «Какая сегодня погода?»'
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: Давай выпьем воды
    gloss: давай выпьем воды
    note: هيا (hayyā) + глагол в форме «мы» значит «давай»; نشرب (nashrab) значит «мы пьём».
    example_gloss: Жарко. Давай выпьем воды.
  ar.a1.unit20.lesson02.teach.line01:
    title: Спросить о погоде
    gloss: Лейла спрашивает о сегодняшней погоде.
    note: اليوم значит «сегодня».
    example_gloss: 'Лейла сказала: «Какая сегодня погода?»'
  ar.a1.unit20.lesson02.teach.line02:
    title: Солнечно и жарко
    gloss: Юсуф говорит, что погода солнечная и жаркая.
    note: 'و (wa, «и») соединяет два слова о погоде и пишется слитно со следующим словом: وحار.'
    example_gloss: 'Юсуф сказал: «Солнечно и жарко».'
  ar.a1.unit20.lesson02.teach.line03:
    title: Предложить кафе
    gloss: Лейла предлагает пойти в кафе.
    note: هل نذهب значит «пойдём ли мы?», то есть «, может, сходим?»
    example_gloss: 'Лейла сказала: «Сходим в кафе?»'
  ar.a1.unit20.lesson02.teach.line04:
    title: План с водой
    gloss: Юсуф соглашается и предлагает выпить воды.
    note: هيا نشرب значит «давай выпьем».
    example_gloss: 'Юсуф сказал: «Да, давай выпьем воды».'
