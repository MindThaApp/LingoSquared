teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: Мне нравится
    gloss: я люблю
    note: أحب (uḥibbu) означает «я люблю». Для вещей вообще в арабском используется ال (определённый артикль), поэтому «я люблю кофе» — أحب القهوة, буквально «я люблю этот кофе».
    example_gloss: Мне нравится кофе.
  ar.a1.unit14.lesson01.teach.tea:
    title: Чай
    gloss: чай
    note: شاي (shāy) — «чай»; الشاي (ash-shāy) — с ال, так в арабском говорят о чае вообще.
    example_gloss: Я не люблю чай.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Я не люблю
    gloss: я не люблю
    note: В русском отрицание — частица «не» перед глаголом; в арабском перед أحب ставится لا, и никакой вспомогательный глагол не нужен.
    example_gloss: Я не люблю чай.
  ar.a1.unit14.lesson01.teach.water:
    title: Вода
    gloss: вода
    note: الماء (al-māʾ) — это ماء («вода», из темы о еде) с ال, когда речь о воде вообще.
    example_gloss: Я люблю воду.
  ar.a1.unit14.lesson01.teach.and_not:
    title: И не
    gloss: и не
    note: 'ولا (wa-lā) — это و («и») плюс لا («не»): она добавляет нелюбовь после любви.'
    example_gloss: Я люблю кофе и не люблю чай.
  ar.a1.unit14.lesson02.teach.prefer:
    title: Я предпочитаю
    gloss: я предпочитаю
    note: 'أفضل (ufaḍḍilu) означает «я предпочитаю»: ты выбираешь один вариант вместо другого.'
    example_gloss: Я предпочитаю кофе.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Что ты предпочитаешь?
    gloss: Что ты предпочитаешь?
    note: تفضل здесь — tufaḍḍil, «ты предпочитаешь», обращение к мужчине; к женщине — تفضلين (tufaḍḍilīn). Это другое слово, чем تفضل (tafaḍḍal, «пожалуйста, возьмите») из темы о еде, хотя пишутся они одинаково.
    example_gloss: 'Нур сказала: Что ты предпочитаешь, Юсуф?'
  ar.a1.unit14.lesson02.teach.line01:
    title: Нур спрашивает
    gloss: Нур спрашивает Юсуфа, что он предпочитает.
    note: 'Нур — сестра Юсуфа. Она говорит تفضل, потому что обращается к мужчине; к женщине: ماذا تفضلين؟'
    example_gloss: 'Нур сказала: Что ты предпочитаешь, Юсуф?'
  ar.a1.unit14.lesson02.teach.line02:
    title: Юсуф предпочитает кофе
    gloss: Юсуф говорит, что предпочитает кофе.
    note: أفضل выбирает один вариант из нескольких; أحب просто говорит, что тебе что-то нравится.
    example_gloss: 'Юсуф сказал: Я предпочитаю кофе.'
  ar.a1.unit14.lesson02.teach.line03:
    title: Юсуф не любит чай
    gloss: Юсуф говорит, что не любит чай.
    note: لا أحب просто выражает нелюбовь.
    example_gloss: 'Юсуф сказал: Я не люблю чай.'
  ar.a1.unit14.lesson02.teach.line04:
    title: Нур любит воду
    gloss: Нур говорит, что любит воду.
    note: أنا можно добавить для выделения.
    example_gloss: 'Нур сказала: Я люблю воду.'
