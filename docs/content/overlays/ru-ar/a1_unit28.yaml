  ar.a1.unit28.lesson06.teach.lyla_hl_nmars:
    title: Лейла предлагает
    gloss: 'Лейла: Займёмся спортом вместе?'
  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: Предлагаем что-то сделать вместе
    gloss: 'Чтобы предложить что-то сделать вместе, используй هل (hal) + глагол в форме «мы»: هل نتمشى؟ (hal natamashshā?) и هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: Здесь используется та же конструкция для предложения, что и в уроке о планах.
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: Сара соглашается
    gloss: 'Сара: Да, здорово! Я люблю плавание.'
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
    title: Юсуф предпочитает футбол
    gloss: 'Юсуф: Я бы лучше поиграл в футбол.'
  ar.a1.unit28.lesson06.teach.krym_wana_ahb:
    title: Карим любит бег
    gloss: 'Карим: А я люблю бегать.'
  ar.a1.unit28.lesson06.teach.lyla_idhn_nmars:
    title: Лейла завершает разговор
    gloss: 'Лейла: Тогда на этой неделе мы вчетвером займёмся спортом вместе!'
    note: Завершает разговор, объединяя спортивные предпочтения всех четырёх героев урока.
