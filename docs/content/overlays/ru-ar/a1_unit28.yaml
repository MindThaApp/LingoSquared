    title: Я играю в футбол
    gloss: Я играю в футбол.
    note: 'ألعب (alʿab) — глагол для игр с мячом: ألعب كرة القدم (alʿab kurat al-qadam). Буквально كرة القدم — «мяч стопы».'
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Глаголы для спорта: أمارس и ألعب'
    gloss: 'Перед большинством видов спорта говори أمارس (umāris, «занимаюсь»): أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Для игр с мячом говори ألعب (alʿab, «играю»): ألعب كرة القدم.'
    note: أمارس (umāris) подходит для большинства видов спорта, но для игр с мячом нужен ألعب (alʿab), поэтому учи глагол вместе с названием спорта.
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Раз в неделю
    gloss: раз в неделю
    example_gloss: Я занимаюсь йогой два раза в неделю.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Раз в неделю
    gloss: كثيرا (kathīran) и كل يوم (kull yawm) — общие выражения, а مرتين في الأسبوع (marratayn fī al-usbūʿ) точно говорит, как часто. مرتين — двойственное число от مرة (marra, «раз»).
    note: Расширяет лексику о частоте, уже знакомую по теме увлечений.
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
    title: Я занимаюсь йогой два раза в неделю
    gloss: Я занимаюсь йогой два раза в неделю.
  ar.a1.unit28.lesson02.teach.ywsf_ylab_kra:
    title: Юсуф часто играет в футбол
    gloss: Юсуф часто играет в футбол.
    note: 'يلعب (yalʿab) значит «он играет»: начальная буква ي (ya-) указывает на «он». كثيرا (kathīran) значит «часто».'
  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Два способа говорить о спорте
    gloss: أمارس الرياضة (umāris ar-riyāḍa) говорит о спорте вообще, а أمارس اليوغا (umāris al-yūghā) называет конкретный вид спорта. Оба варианта верны.
    note: رياضة (riyāḍa) — существительное женского рода, а اليوغا (al-yūghā) — название вида спорта с артиклем ال.
  ar.a1.unit28.lesson03.teach.mmarsa_alryada:
