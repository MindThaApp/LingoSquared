  ar.a1.unit28.lesson03.teach.sara_thb_alsbaha:
    title: Сара любит плавание
    gloss: Сара любит плавание.
    note: 'تحب (tuḥibb) значит «она любит»: начальная буква ت (ta-) указывает на «она». السباحة (as-sibāḥa) начинается с солнечной буквы, поэтому мы пишем as-sibāḥa.'
  ar.a1.unit28.lesson04.teach.ywsf_hl_trkd:
    title: Юсуф спрашивает Карима
    gloss: 'Юсуф: Ты часто бегаешь, Карим?'
  ar.a1.unit28.lesson04.teach.krym_nam_arkd:
    title: Карим отвечает
    gloss: 'Карим: Да, я бегаю два раза в неделю.'
  ar.a1.unit28.lesson04.teach.ywsf_ayn_trkd:
    title: Юсуф спрашивает, где
    gloss: 'Юсуф: Где ты бегаешь?'
  ar.a1.unit28.lesson04.teach.krym_fy_alhdyqa:
    title: Карим отвечает, где
    gloss: 'Карим: В парке, рядом с моим домом.'
  ar.a1.unit28.lesson04.teach.ytghyr_alfal_ma:
    title: Глагол изменяется по лицам
    gloss: 'Глагол меняется в зависимости от лица: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'Первая буква глагола показывает, кто совершает действие: أ (a-) — «я», ي (ya-) — «он», ت (ta-) — «ты» или «она».'
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: Юсуф реагирует
    gloss: 'Юсуф: Как здорово, я там часто играю в футбол.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Лейла и Сара о спорте
    gloss: Лейла занимается йогой два раза в неделю. Она любит двигаться спокойно. Сара не занимается йогой, но любит плавание. Сара плавает часто, почти каждую неделю. Каким видом спорта занимаешься ты?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) и سارة تسبح (sāra tasbaḥ) — глаголы начинаются с ت (ta-), потому что обе героини — женщины. لا перед глаголом делает его отрицательным.
    glosses:
      تمارس: занимается
      مرتين: дважды (два раза)
      الأسبوع: неделя
      اليوغا: йога
      تحب: обожает
      بهدوء: спокойно
      تتحرك: двигаться
      السباحة: плавание
      تسبح: плавает
      كثيرا: часто
      تقريبا: почти
      ما: какой
      الرياضة: спорт
  ar.a1.unit28.lesson05.teach.sara_tsbh_kthyra:
    title: Сара плавает часто, почти каждую неделю
    gloss: Сара плавает часто, почти каждую неделю.
  ar.a1.unit28.lesson05.teach.alab_kra_alqdm:
