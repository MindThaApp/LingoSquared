  ar.a1.unit39.lesson06.teach.lyla_ahb_alshtaa:
    title: Лейла отвечает
    gloss: 'Лейла: Я люблю зиму. Зимой мы катаемся на коньках.'
  ar.a1.unit39.lesson06.teach.krym_ara_alkhryf:
    title: Карим отвечает
    gloss: 'Карим: Я считаю осень красивой. Осень — спокойное время.'
