    title: Разговор о временах года
    gloss: 'Сейчас весна. Розы прекрасны. Нур спрашивает: «Какое время года ты считаешь красивым?» Юсуф говорит: «Я люблю лето. Летом мы плаваем». Лейла говорит: «Я люблю зиму. Зимой мы катаемся на коньках».'
    note: Короткий текст, повторяющий разговор о временах года. Названия времён года — слова мужского рода с ال, например الصيف (aṣ-ṣayf) и الشتاء (ash-shitāʾ).
    glosses:
      الربيع: весна
      الورود: розы
      جميلة: красивые
      تسأل: спрашивает
      فصل: время года
      تراه: считать, находить
      يقول: говорит
      الصيف: лето
      أحب: любить (я люблю)
      نسبح: плаваем
      الشتاء: зима
      نتزلج: катаемся на коньках
  ar.a1.unit39.lesson05.teach.alhwar_an_alfswl:
