teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Место
    gloss: место
    note: مكان (makān) — общее слово для «места». هذا («этот, это») было в уроке о числах.
    example_gloss: Это место.
  ar.a1.unit09.lesson01.teach.library:
    title: Библиотека
    gloss: библиотека
    note: مكتبة (maktaba) может значить «библиотека» или «книжный магазин»; здесь это библиотека. المكتبة (al-maktaba) — «библиотека» с определённым артиклем.
    example_gloss: Библиотека здесь.
  ar.a1.unit09.lesson01.teach.market:
    title: Рынок
    gloss: рынок
    note: سوق (sūq) означает «рынок»; السوق (as-sūq) — «этот рынок» (с определённым артиклем).
    example_gloss: Рынок здесь.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Кафе
    gloss: кафе
    note: مقهى (maqhā) означает «кафе»; слово связано с قهوة («кофе»). المقهى (al-maqhā) — «кафе» с определённым артиклем.
    example_gloss: Кафе здесь.
  ar.a1.unit09.lesson01.teach.here:
    title: Здесь
    gloss: здесь
    note: 'هنا (hunā) обычно стоит после названия места: المقهى هنا — «кафе здесь». В таком предложении в арабском не нужен глагол-связка «есть».'
    example_gloss: Кафе здесь.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Где библиотека?
    gloss: Где библиотека?
    note: أين (ayna) значит «где»; ты уже встречал это слово во фразе من أين أنت؟ («откуда ты?»).
    example_gloss: 'Юсуф спросил: «Где библиотека?»'
  ar.a1.unit09.lesson02.teach.near:
    title: Близко
    gloss: около, поблизости от
    note: 'قرب (qurba) значит «рядом, около» и стоит перед словом, к которому относится: قرب المكتبة — «рядом с библиотекой». بالقرب من (bi-l-qurbi min) значит то же самое.'
    example_gloss: Кафе рядом с библиотекой.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: Библиотека рядом с рынком
    gloss: Библиотека рядом с рынком
    note: Как и в русском в настоящем времени, здесь в арабском не нужен отдельный глагол «есть».
    example_gloss: 'Лейла сказала: «Библиотека рядом с рынком».'
  ar.a1.unit09.lesson02.teach.line01:
    title: Спросить, где
    gloss: Юсуф спрашивает, где библиотека.
    note: Вопрос о местонахождении начинается со слова أين.
    example_gloss: 'Юсуф спросил: «Где библиотека?»'
  ar.a1.unit09.lesson02.teach.line02:
    title: Указать, где библиотека
    gloss: Лейла говорит, что библиотека здесь, рядом с рынком.
    note: 'هنا и قرب могут стоять вместе: здесь, рядом с рынком.'
    example_gloss: 'Лейла сказала: «Библиотека здесь, рядом с рынком».'
  ar.a1.unit09.lesson02.teach.line03:
    title: Спросить про кафе
    gloss: Юсуф спрашивает, где кафе.
    note: 'و (wa, «и») пишется слитно со следующим словом: وأين (wa-ayna) — «а где».'
    example_gloss: 'Юсуф сказал: «А где кафе?»'
  ar.a1.unit09.lesson02.teach.line04:
    title: Указать, где кафе
    gloss: Лейла говорит, что кафе рядом с библиотекой.
    note: 'Место + قرب + второе место: المقهى قرب المكتبة — «кафе рядом с библиотекой».'
    example_gloss: 'Лейла сказала: «Кафе рядом с библиотекой».'
