    title: Нур узнаёт обо всех
    gloss: Нур — новенькая в языковом кафе. Она спрашивает Юсуфа, какие остальные. Юсуф рассказывает. Лейла добрая и терпеливая, она работает медсестрой. Карим забавный и ходит на курс испанского языка. Сара любопытная, она любит узнавать новое. Сам Юсуф спокойный.
    note: 'Короткий текст о компании. Прилагательные согласуются с человеком: لطيفة (laṭīfa) — о женщине, مضحك (muḍḥik) — о мужчине.'
