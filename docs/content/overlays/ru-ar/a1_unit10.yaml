teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: Право
    gloss: правая сторона
    note: يمين (yamīn) обозначает правую сторону; اليمين (al-yamīn) — «правая сторона» с определённым артиклем.
    example_gloss: Направо.
  ar.a1.unit10.lesson01.teach.left:
    title: Лево
    gloss: левая сторона
    note: يسار (yasār) обозначает левую сторону; اليسار (al-yasār) — «левая сторона» с определённым артиклем.
    example_gloss: Налево.
  ar.a1.unit10.lesson01.teach.forward:
    title: Прямо
    gloss: прямо
    note: إلى الأمام (ilā l-amām) буквально значит «вперёд, к передней части»; так обычно говорят «прямо» или «вперёд».
    example_gloss: Библиотека прямо.
  ar.a1.unit10.lesson01.teach.to_right:
    title: Направо
    gloss: направо
    note: إلى (ilā) указывает на движение к направлению или месту.
    example_gloss: Рынок справа.
  ar.a1.unit10.lesson02.teach.walk:
    title: Идти
    gloss: иди
    note: امش (imshi) — команда «иди!», обращённая к мужчине; к женщине обращаются امشي (imshī). Это обычный глагол, когда объясняют дорогу пешком.
    example_gloss: Иди прямо.
  ar.a1.unit10.lesson02.teach.then:
    title: Потом
    gloss: тогда
    note: ثم (thumma) соединяет два шага маршрута по порядку.
    example_gloss: Иди прямо, потом направо.
  ar.a1.unit10.lesson02.teach.route:
    title: Два шага маршрута
    gloss: Иди прямо, потом направо
    note: Первый шаг + ثم + второй шаг. После ثم глагол не повторяется.
    example_gloss: 'Лейла сказала: «Иди прямо, потом направо».'
  ar.a1.unit10.lesson02.teach.line01:
    title: Спросить про библиотеку
    gloss: Юсуф спрашивает, где библиотека.
    note: Вопрос أين المكتبة؟ уже встречался в теме о местах.
    example_gloss: 'Юсуф сказал: «Где библиотека?»'
  ar.a1.unit10.lesson02.teach.line02:
    title: Объяснить дорогу
    gloss: Лейла называет два простых шага маршрута.
    note: Лейла говорит امش, потому что обращается к мужчине; к женщине она сказала бы امشي.
    example_gloss: 'Лейла сказала: «Иди прямо, потом направо».'
  ar.a1.unit10.lesson02.teach.line03:
    title: Поблагодарить
    gloss: Юсуф говорит «спасибо».
    note: شكرا вежливо завершает разговор, в котором тебе помогли.
    example_gloss: 'Юсуф сказал: «Спасибо».'
  ar.a1.unit10.lesson02.teach.line04:
    title: Подтвердить место
    gloss: Лейла говорит, что библиотека находится рядом с рынком.
    note: 'Здесь снова используется قرب из темы о местах: библиотека рядом с рынком.'
    example_gloss: 'Лейла сказала: «Библиотека рядом с рынком».'
