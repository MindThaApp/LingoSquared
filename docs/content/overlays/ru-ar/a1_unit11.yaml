teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: Каждый день
    gloss: каждый день
    note: كل يوم (kull yawm) часто стоит после глагола (أدرس كل يوم), но может и начинать предложение (كل يوم أدرس).
    example_gloss: Я занимаюсь каждый день.
  ar.a1.unit11.lesson01.teach.wake:
    title: Я просыпаюсь
    gloss: я просыпаюсь
    note: أستيقظ (astayqiẓ) означает «я просыпаюсь»; أ в начале показывает «я» в глаголах настоящего времени. السابعة (as-sābiʿa) — «семь» в обозначении времени.
    example_gloss: Я просыпаюсь в семь часов.
  ar.a1.unit11.lesson01.teach.study:
    title: Я занимаюсь
    gloss: я занимаюсь
    note: أدرس (adrus) означает «я занимаюсь, учусь»; у него тот же корень, что и у درس («урок»). التاسعة (at-tāsiʿa) — «девять» в обозначении времени.
    example_gloss: Я занимаюсь в девять часов.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Я сплю
    gloss: я сплю / я ложусь спать
    note: أنام (anām) означает «я сплю»; с указанием времени — «я ложусь спать». العاشرة (al-ʿāshira) — «десять» в обозначении времени.
    example_gloss: Я сплю в десять часов.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Что ты делаешь каждый день?
    gloss: Что ты делаешь каждый день?
    note: ماذا (mādhā) значит «что», а تفعل (tafʿal) — «ты делаешь» (мужчине); женщине говорят تفعلين (tafʿalīn).
    example_gloss: 'Лейла сказала: «Что ты делаешь каждый день?»'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Три предложения о распорядке дня
    gloss: Я просыпаюсь в семь. Я занимаюсь в девять. Я ложусь спать в десять.
    note: Каждое предложение состоит из глагола + في الساعة + час; вместе они описывают целый день.
    example_gloss: Каждый день я просыпаюсь в семь. Занимаюсь в девять. Ложусь спать в десять.
  ar.a1.unit11.lesson02.teach.line01:
    title: Спросить о распорядке дня
    gloss: Лейла спрашивает Юсуфа, что он делает каждый день.
    note: 'Лейла говорит تفعل, потому что спрашивает мужчину; женщину она спросила бы: ماذا تفعلين كل يوم؟'
    example_gloss: 'Лейла сказала: «Что ты делаешь каждый день?»'
  ar.a1.unit11.lesson02.teach.line02:
    title: Время подъёма
    gloss: Юсуф говорит, что просыпается в семь.
    note: Перед временем ставится في الساعة.
    example_gloss: 'Юсуф сказал: «Я просыпаюсь в семь часов».'
  ar.a1.unit11.lesson02.teach.line03:
    title: Время занятий
    gloss: Юсуф говорит, что занимается в девять.
    note: Та же модель времени подходит и к глаголу أدرس.
    example_gloss: 'Юсуф сказал: Я учусь в девять часов.'
  ar.a1.unit11.lesson02.teach.line04:
    title: Время сна
    gloss: Юсуф говорит, что ложится спать в десять.
    note: Последнее дело его дня строится по той же модели времени с أنام.
    example_gloss: 'Юсуф сказал: Я сплю в десять часов.'
