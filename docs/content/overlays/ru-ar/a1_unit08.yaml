  ar.a1.unit08.lesson01.teach.dirhams:
    title: Дирхамы
    gloss: дирхамы
    note: دراهم (darāhim) — множественное число от درهم (dirham), валюты Марокко и ОАЭ; после чисел от 3 до 10 употребляется множественное число.
    example_gloss: У меня десять дирхамов.
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: Сколько стоят яблоки?
    gloss: Сколько стоят яблоки?
    note: كم سعر التفاح؟ (kam siʿr at-tuffāḥ) буквально значит «сколько цена яблок?». Также нормативны ما سعر التفاح؟ («какова цена яблок?») и بكم التفاح؟ («за сколько яблоки?»).
    example_gloss: 'Лейла спросила: «Сколько стоят яблоки?»'
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: За десять дирхамов
    gloss: за десять дирхамов
    note: 'Приставка بـ (bi-) указывает цену: بعشرة (bi-ʿashara) — «за десять».'
    example_gloss: Яблоки стоят десять дирхамов.
  ar.a1.unit08.lesson02.teach.two_apples:
    title: Два яблока
    gloss: два яблока
    note: تفاحتين (tuffāḥatayn) — двойственное число от تفاحة («яблоко») в форме прямого дополнения, которая стоит после أريد.
    example_gloss: Два яблока.
  ar.a1.unit08.lesson02.teach.want_two:
    title: Я хочу два яблока
    gloss: я хочу два яблока
    note: Ставь أريد перед тем, что хочешь получить.
    example_gloss: Я хочу два яблока.
  ar.a1.unit08.lesson02.teach.line01:
    title: Спросить цену
    gloss: Лейла спрашивает цену яблок.
    note: Это тот же образец вопроса о цене.
    example_gloss: 'Лейла спросила: «Сколько стоят яблоки?»'
  ar.a1.unit08.lesson02.teach.line02:
    title: Назвать цену
    gloss: Продавец говорит, что яблоки стоят десять дирхамов.
    note: 'К слову عشرة присоединяется приставка цены بـ: بعشرة.'
    example_gloss: 'Продавец сказал: «Яблоки стоят десять дирхамов».'
  ar.a1.unit08.lesson02.teach.line03:
    title: Попросить определённое количество
    gloss: Лейла вежливо просит два яблока.
    note: من فضلك делает просьбу вежливой.
    example_gloss: 'Лейла сказала: «Я хочу два яблока, пожалуйста».'
  ar.a1.unit08.lesson02.teach.line04:
    title: Подать товар
    gloss: 'Продавец говорит: «Вот, возьмите».'
    note: تفضلي уже встречалось в уроке о еде; так говорят женщине (мужчине — تفضل).
    example_gloss: 'Продавец сказал: «Вот, возьмите».'
