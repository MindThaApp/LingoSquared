teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: Время
    gloss: время / час
    note: الساعة (as-sāʿa) буквально означает «час» (а также «часы»); ответы о времени начинаются с этого слова.
    example_gloss: Три часа.
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: Который час?
    gloss: Который час?
    note: 'كم الساعة؟ буквально спрашивает: «сколько часов?»'
    example_gloss: 'Лейла спросила: Который час?'
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: Три часа
    gloss: Три часа.
    note: 'الثالثة (ath-thālitha) — порядковое числительное «третья» в женском роде, согласуется с الساعة (женский род): буквально «третий час».'
    example_gloss: 'Лейла сказала: Три часа.'
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: Пять часов
    gloss: Пять часов.
    note: الخامسة (al-khāmisa) — «пятый (час)». На уровне A1 используются только целые часы.
    example_gloss: 'Лейла сказала: Пять часов.'
  ar.a1.unit05.lesson01.teach.sabah:
    title: Утром
    gloss: утром
    note: صباحا (ṣabāḥan) уточняет, что время утреннее; في الصباح означает то же самое.
    example_gloss: Пять утра.
  ar.a1.unit05.lesson01.teach.masaa:
    title: Вечером
    gloss: вечером
    note: مساء (masāʾan) уточняет, что время вечернее; في المساء означает то же самое.
    example_gloss: Пять вечера.
  ar.a1.unit05.lesson02.teach.mata:
    title: Когда
    gloss: когда
    note: متى (matā) спрашивает, когда что-то происходит.
    example_gloss: Когда урок?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: Когда урок?
    gloss: Когда урок?
    note: В таком простом вопросе по-арабски нет глагола «быть».
    example_gloss: 'Юсуф спросил: Когда урок?'
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: Урок в пять
    gloss: Урок в пять часов.
    note: الساعة можно использовать и для времени по расписанию.
    example_gloss: 'Лейла сказала: Урок в пять часов.'
  ar.a1.unit05.lesson02.teach.line01:
    title: Спросить, который час
    gloss: Юсуф спрашивает, который час.
    note: كم الساعة؟ спрашивает о текущем времени.
    example_gloss: 'Юсуф спросил: Который час?'
  ar.a1.unit05.lesson02.teach.line02:
    title: Говорим, который час
    gloss: Лейла говорит, что сейчас три часа.
    note: Ответ начинается с الساعة.
    example_gloss: 'Лейла сказала: Три часа.'
  ar.a1.unit05.lesson02.teach.line03:
    title: Спроси «когда»
    gloss: Юсуф спрашивает, когда урок.
    note: و связывает этот вопрос с предыдущей репликой.
    example_gloss: 'Юсуф спросил: А когда урок?'
  ar.a1.unit05.lesson02.teach.line04:
    title: Назови время по расписанию
    gloss: Лейла говорит, что урок в пять.
    note: Это ответ о расписании.
    example_gloss: 'Лейла сказала: Урок в пять часов.'
exercises:
