teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: القراءة (al-qirāʾa) — «чтение», ممارسة الرياضة (mumārasat ar-riyāḍa) — «занятия спортом», الطبخ (aṭ-ṭabkh) — «приготовление еды». Все они — существительные, поэтому к ним присоединён артикль ال.
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Свободное время
    gloss: свободное время
    note: وقت الفراغ (waqt al-farāgh) буквально «время пустоты, свободы». У первого слова нет ال; артикль берёт только второе слово.
    example_gloss: В свободное время я люблю читать.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: أحب (uḥibb) означает «я люблю» и одинаково для мужчины и женщины. Буква ي в конце слова فراغي (farāghī) означает «мой».
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) — «слушание музыки», الرسم (ar-rasm) — «рисование», لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) — «игра в видеоигры».
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'После الاستماع (al-istimāʿ) нужно إلى (ilā, «к») перед тем, что слушают: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: 'مع (maʿa) означает «с»: مع الأصدقاء (maʿa al-aṣdiqāʾ). Артикль ال остаётся присоединённым к слову الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) и أبدا (abadan) — наречия, поэтому они не изменяются по родам. Конечная ا (алиф) пишется без каких-либо знаков.
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: В كل أسبوع (kull usbūʿ) и كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) используется كل (kull, «каждый»); см. следующую карточку.
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: '«Каждый»: كل'
    gloss: 'После كل (kull, «каждый») существительное стоит в единственном числе и без ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) не изменяется: это же слово употребляется перед существительным мужского рода, например أسبوع, и женского рода, например عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Лейла заводит разговор о хобби
    gloss: 'Лейла: Мы часто гуляем вместе. А чем ты ещё занимаешься в свободное время, Юсуф?'
    note: Начальная буква ن (na-) в слове نتمشى (natamashshā) означает «мы», поэтому отдельное слово для «мы» в арабском не нужно. معا (maʿan) означает «вместе».
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Хобби Юсуфа
    gloss: 'Юсуф: Я люблю готовить, и дома тоже. И часто занимаюсь спортом.'
    note: في البيت أيضا (fī al-bayt ayḍan) добавляет «и дома тоже». وأمارس (wa-umāris) соединяет و («и») с глаголом и пишется как одно слово.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Лейла удивлена
    gloss: 'Лейла: Ты и дома готовишь? Ты же и так целый день готовишь на работе!'
    note: تطبخ (taṭbukh) — глагол «ты готовишь» для мужчины; к женщине обращаются تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) означает «целый день напролёт».
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Юсуф объясняет
    gloss: 'Юсуф: Да, но я нахожу готовку расслабляющей. А ты, что ты любишь делать?'
    note: 'أجد (ajid) означает «я нахожу», а مريحا (murīḥan) — «расслабляющий, приятный». وأنت (wa-anta) — это و, присоединённое к أنت: «а ты».'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Хобби Лейлы
    gloss: 'Лейла: Я люблю читать и часто слушаю музыку.'
    note: 'و соединяет два занятия: أحب القراءة (uḥibb al-qirāʾa) и وأستمع (wa-astamiʿ, «и я слушаю»). Оно пишется слитно со следующим словом.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Юсуф спрашивает про видеоигры
    gloss: 'Юсуф: Ты тоже играешь в видеоигры?'
    note: تلعبين (talʿabīn) — глагол «ты играешь» для женщины, ведь Юсуф спрашивает Лейлу; для мужчины говорят تلعب (talʿab). هل (hal) начинает вопрос, на который отвечают «да» или «нет».
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Лейла отвечает
    gloss: 'Лейла: Нет, я никогда не играю в видеоигры. Но иногда я рисую!'
    note: 'أبدا (abadan) означает «никогда», а أحيانا (aḥyānan) — «иногда». Глагол отрицается с помощью لا (lā): لا ألعب (lā alʿab) — «я не играю».'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Сравниваем увлечения
    gloss: Мы с Юсуфом часто гуляем вместе. Но у нас есть и другие хобби. Юсуф любит готовить, и дома тоже, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда я рисую, но в видеоигры никогда не играю. А что ты любишь делать в свободное время?
    note: В сообщении Лейла напоминает уже известные факты и в конце задаёт читателю главный вопрос этого урока.
    glosses:
      نتمشى: гуляем
      كثيرا: часто
      معا: вместе
      أخرى: другие
      يطبخ: готовит
      يحب: нравится
      البيت: дом (дома)
      ويمارس: занимается спортом
      أقرأ: читать
      وأستمع: слушаю
      الموسيقى: музыка
      أرسم: рисую
      أحيانا: иногда
      ألعب: играть (в видеоигры)
      أبدا: никогда
      فراغك: твоё свободное (время)
      وقت: время
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Юсуф спрашивает о выходных
    gloss: 'Юсуф: Что ты делаешь в эти выходные?'
    note: 'ستفعلين (sa-tafʿalīn) — будущее время: его показывает начальная буква س (sa-), а окончание ين указывает на женщину. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) — выходные.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Лейла ещё не решила
    gloss: 'Лейла: Пока не знаю. Я люблю читать, но ещё хочу куда-нибудь выйти.'
    note: لا أعرف بعد (lā aʿrif baʿd) значит «я пока не знаю». أن أخرج (an akhruj) значит «выйти, пойти куда-то».
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Юсуф предлагает план
    gloss: 'Юсуф: Давай погуляем вместе? А потом я приготовлю нам поесть.'
    note: 'هل نتمشى (hal natamashshā) — обычный способ предложить что-то сделать вместе: هل + глагол в форме «мы». لنا (lanā) — это ل («для») + نا («нас»), пишется как одно слово.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Лейла соглашается
    gloss: 'Лейла: Хорошая идея! Я люблю и гулять, и готовить.'
    note: 'كليهما (kilayhimā) значит «и то и другое» и стоит в конце, относясь к двум занятиям: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Юсуф подтверждает
    gloss: 'Юсуф: Отлично. Тогда увидимся в субботу!'
    note: يوم السبت (yawm as-sabt) значит «в субботу». Буква ل артикля ال не произносится перед س — «солнечной» буквой, поэтому читается as-sabt.
