teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Вчера
    gloss: вчера
    note: أمس (ams) значит «вчера». Слово употребляется с глаголом в прошедшем времени, например ذهبت, и может стоять в конце или в начале предложения.
    example_gloss: Вчера я ходил на рынок.
  ar.a1.unit13.lesson01.teach.went:
    title: Я пошёл / пошла
    gloss: я пошёл / я пошла
    note: 'ذهبت (dhahabtu) значит «я ходил/ходила»: окончание прошедшего времени -tu указывает на «я». Без огласовок те же буквы можно прочитать как dhahabta / dhahabti («ты ходил» к мужчине / «ты ходила» к женщине) или dhahabat («она ходила»); нужный вариант подсказывает контекст.'
    example_gloss: Я ходил на рынок.
  ar.a1.unit13.lesson01.teach.bought:
    title: Я купил(а)
    gloss: я купил(а)
    note: اشتريت (ishtaraytu) значит «я купил/купила»; как и ذهبت, оно оканчивается на -tu, обозначающее «я».
    example_gloss: Я купил яблоки.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Яблоки
    gloss: яблоки
    note: تفاحا (tuffāḥan) — это تفاح («яблоки», из темы о покупках) в роли прямого дополнения; лишняя ا передаёт окончание -an.
    example_gloss: Я купил яблоки.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Что ты делал вчера?
    gloss: Что ты делал вчера?
    note: 'ماذا (mādhā) значит «что»; فعلت здесь значит «ты сделал/сделала»: faʿalta к мужчине, faʿalti к женщине (пишется одинаково). Юсуф спрашивает Лейлу, поэтому он говорит faʿalti.'
    example_gloss: 'Юсуф сказал: «Что ты делала вчера?»'
  ar.a1.unit13.lesson02.teach.drank:
    title: Я выпил(а)
    gloss: я выпил
    note: شربت (sharibtu) значит «я выпил/выпила»; у него то же окончание -tu («я»), что у ذهبت и اشتريت.
    example_gloss: Я выпил кофе.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Последовательность недавних событий
    gloss: Я ходил на рынок. Я купил яблоки. Я выпил кофе.
    note: Несколько коротких предложений в прошедшем времени подряд рассказывают, что ты делал. Каждый глагол оканчивается на -tu («я»).
    example_gloss: Вчера я ходил на рынок. Я купил яблоки. Я выпил кофе.
  ar.a1.unit13.lesson02.teach.line01:
    title: Вопрос о вчерашнем дне
    gloss: Юсуф спрашивает, что Лейла делала вчера.
    note: Юсуф спрашивает Лейлу, женщину, поэтому فعلت здесь читается faʿalti; к мужчине — faʿalta.
    example_gloss: 'Юсуф сказал: «Что ты делала вчера?»'
  ar.a1.unit13.lesson02.teach.line02:
    title: Ходила на рынок
    gloss: Лейла говорит, что ходила на рынок.
    note: ذهبت показывает завершённое движение.
    example_gloss: 'Лейла сказала: «Я ходила на рынок».'
  ar.a1.unit13.lesson02.teach.line03:
    title: Купила яблоки
    gloss: Лейла говорит, что купила яблоки.
    note: Это добавляет второе завершённое действие.
    example_gloss: 'Лейла сказала: «Я купила яблоки».'
  ar.a1.unit13.lesson02.teach.line04:
    title: Выпила кофе
    gloss: Лейла говорит, что выпила кофе.
    note: Это завершает короткий рассказ о событиях.
    example_gloss: 'Лейла сказала: «Я выпила кофе».'
