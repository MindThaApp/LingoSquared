teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: Одежда
    gloss: одежда
    note: ملابس (malābis) — существительное во множественном числе, «одежда».
    example_gloss: Я хочу одежду.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Рубашка
    gloss: рубашка
    note: 'قميص (qamīṣ) значит «рубашка»; после أريد оно получает окончание прямого дополнения -an: قميصا (qamīṣan).'
    example_gloss: Я хочу рубашку.
  ar.a1.unit21.lesson01.teach.blue:
    title: Синий
    gloss: синий
    note: 'أزرق (azraq) — форма мужского рода, согласуется с قميص; с существительным женского рода она становится زرقاء (zarqāʾ). После أريد к أزرق не добавляется алиф: قميصا أزرق.'
    example_gloss: Я хочу синюю рубашку.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Синяя рубашка
    gloss: синяя рубашка
    note: 'В арабском языке цвет стоит после предмета: قميصا أزرق (qamīṣan azraq), а не перед ним, как в русском.'
    example_gloss: Я хочу синюю рубашку.
  ar.a1.unit21.lesson02.teach.size:
    title: Размер
    gloss: размер
    note: مقاس (maqās) значит «размер»; ما المقاس؟ (mā l-maqās) — «какой размер?».
    example_gloss: Какой размер?
  ar.a1.unit21.lesson02.teach.medium:
    title: Средний размер
    gloss: средний размер
    note: 'متوسط (mutawassiṭ) значит «средний»; с بـ (bi-, «в») оно присоединяется к предмету: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ) — рубашка среднего размера.'
    example_gloss: Я хочу рубашку среднего размера.
  ar.a1.unit21.lesson02.teach.price:
    title: Десять дирхамов
    gloss: десять дирхамов
    note: 'بعشرة (bi-ʿashara) значит «за десять»: приставка بـ указывает цену, как в уроке о покупках.'
    example_gloss: Рубашка стоит десять дирхамов.
  ar.a1.unit21.lesson02.teach.line01:
    title: Просьба о вещи
    gloss: Лейла просит синюю рубашку.
    note: من فضلك делает просьбу вежливой.
    example_gloss: 'Лейла сказала: Я хочу синюю рубашку, пожалуйста.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Вопрос о размере
    gloss: Продавец спрашивает, какой нужен размер.
    note: 'Продавец спрашивает о размере: ما المقاس؟'
    example_gloss: 'Продавец сказал: Какой размер?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Назвать размер
    gloss: 'Лейла говорит: средний размер.'
    note: Это прямой ответ на вопрос о размере.
    example_gloss: 'Лейла сказала: Средний размер.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Подать вещь и назвать цену
    gloss: Продавец подаёт рубашку и называет цену.
    note: تفضلي (tafaḍḍalī) говорят женщине, когда что-то ей подают; мужчине говорят تفضل (tafaḍḍal).
    example_gloss: 'Продавец сказал: Пожалуйста. Рубашка стоит десять дирхамов.'
