teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: Чувство
    gloss: чувство
    note: شعور (shuʿūr) значит «чувство».
    example_gloss: Это чувство.
  ar.a1.unit22.lesson01.teach.happy:
    title: Счастливый
    gloss: счастливый
    note: سعيد (saʿīd) говорит о мужчине; женщина скажет أنا سعيدة (anā saʿīda).
    example_gloss: Я рад.
  ar.a1.unit22.lesson01.teach.sad:
    title: Грустный
    gloss: грустный
    note: حزين (ḥazīn) говорит о мужчине; женщина скажет أنا حزينة (anā ḥazīna).
    example_gloss: Мне грустно.
  ar.a1.unit22.lesson01.teach.because:
    title: Потому что
    gloss: потому что
    note: لأن (li-anna) вводит причину.
    example_gloss: Я счастлив, потому что погода солнечная.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: Как ты себя чувствуешь?
    gloss: Как ты себя чувствуешь?
    note: 'كيف تشعر؟ (kayfa tashʿur) — так спрашивают мужчину, как он себя чувствует; женщину спрашивают: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: Как ты себя чувствуешь, Юсуф?
  ar.a1.unit22.lesson02.teach.tired:
    title: Усталый
    gloss: усталый
    note: متعب (mutʿab) говорит о мужчине; متعبة (mutʿaba) — о женщине, поэтому Лейла говорит أنا متعبة.
    example_gloss: Я устал.
  ar.a1.unit22.lesson02.teach.okay:
    title: В порядке
    gloss: в порядке
    note: بخير (bi-khayr) означает «в порядке», буквально «в добром (здравии)».
    example_gloss: Ты в порядке?
  ar.a1.unit22.lesson02.teach.line01:
    title: Спросить о самочувствии
    gloss: Лейла спрашивает Юсуфа, как он себя чувствует.
    note: يا (yā) ставится перед именем того, к кому обращаются.
    example_gloss: 'Лейла сказала: Как ты себя чувствуешь, Юсуф?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Чувство и причина
    gloss: Юсуф говорит, что он счастлив, потому что погода солнечная.
    note: В этой реплике есть и чувство, и причина.
    example_gloss: 'Юсуф сказал: Я счастлив, потому что погода солнечная.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Другое чувство
    gloss: Лейла говорит, что она устала, потому что у неё работа.
    note: متعبة согласуется с Лейлой (женский род).
    example_gloss: 'Лейла сказала: Я устала, потому что у меня работа.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Узнать, всё ли в порядке
    gloss: Юсуф спрашивает Лейлу, всё ли у неё в порядке.
    note: 'هل (hal) начинает вопрос, на который отвечают «да» или «нет». Юсуф обращается к Лейле, поэтому أنت читается anti (для мужчины: anta).'
    example_gloss: 'Юсуф сказал: Ты в порядке?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Ответить «да»
    gloss: Лейла отвечает «да» и благодарит его.
    note: نعم — это ответ «да».
    example_gloss: 'Лейла сказала: Да, спасибо.'
