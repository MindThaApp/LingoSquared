course:
  title: 达里语 A1
  description: 喀布尔达里语入门：服装词汇、颜色、尺码、试穿衣物、看懂服装标签，以及买衬衫的完整商店对话。
units:
  prs.a1.unit21.clothing:
    title: 买衣服
    description: 认识常见服装，并完成一次简单的服装购买。
lessons:
  prs.a1.unit21.lesson01.clothing_vocabulary:
    title: 服装词汇
  prs.a1.unit21.lesson02.colors:
    title: 颜色
  prs.a1.unit21.lesson03.sizes:
    title: 尺码
  prs.a1.unit21.lesson04.trying_on_and_reading_a_label:
    title: 试穿与看标签
  prs.a1.unit21.lesson05.clothing_shop_dialogue:
    title: 服装店里的对话
  prs.a1.unit21.lesson06.wrap_up_reading:
    title: 总结阅读
teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: 衣服
    gloss: 衣服
    note: لباس 的意思是“衣服”（泛指）。
    example_gloss: 这些是新衣服。
  prs.a1.unit21.lesson01.teach.perahan:
    title: 衬衫
    gloss: 衬衫
    note: پیراهن 的意思是“衬衫”。
    example_gloss: 这件衬衫很漂亮。
  prs.a1.unit21.lesson01.teach.patlun:
    title: 裤子
    gloss: 裤子
    note: پطلون 的意思是“裤子”，是地道的阿富汗达里语词（源自英语借词 pantaloon），与伊朗波斯语的 شلوار 不同。
    example_gloss: 这条裤子很贵。
  prs.a1.unit21.lesson01.teach.kafsh:
    title: 鞋子
    gloss: 鞋子
    note: کفش 的意思是“鞋子”。
    example_gloss: 这双鞋很便宜。
  prs.a1.unit21.lesson01.teach.review_ast:
    title: 是
    gloss: 是
    note: است（是）——在问候单元中已经学过。
    example_gloss: 这是一件衬衫。
  prs.a1.unit21.lesson01.teach.review_geran:
    title: 贵
    gloss: 贵
    note: گران（贵）——在购物单元中已经学过。
    example_gloss: 这条裤子很贵。
  prs.a1.unit21.lesson02.teach.rang:
    title: 颜色
    gloss: 颜色
    note: رنگ 的意思是“颜色”。
    example_gloss: 这件衬衫是什么颜色的？
  prs.a1.unit21.lesson02.teach.siyah:
    title: 黑色
    gloss: 黑色
    note: سیاه 的意思是“黑色”。
    example_gloss: 这条裤子是黑色的。
  prs.a1.unit21.lesson02.teach.safid:
    title: 白色
    gloss: 白色
    note: سفید 的意思是“白色”。
    example_gloss: 这件衬衫是白色的。
  prs.a1.unit21.lesson02.teach.sorkh:
    title: 红色
    gloss: 红色
    note: سرخ 的意思是“红色”，是达里语／古典波斯语的说法，不同于伊朗口语的 قرمز。
    example_gloss: 这双鞋是红色的。
  prs.a1.unit21.lesson03.teach.andaza:
    title: 尺码
    gloss: 尺码
    note: اندازه 的意思是“尺码”（名词）。
    example_gloss: 您穿多大尺码？
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: 您穿多大尺码？
    gloss: 您穿多大尺码？
    note: اندازه شما چند است؟ 字面意思是“您的尺码是多少？”
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: 这是您的尺码吗？
    gloss: 这是您的尺码吗？
    note: این اندازه شما است؟ 中用到了 این（这），在此首次出现。
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: 大
    gloss: 大的
    note: بزرگ（大）——在比较单元中已经学过。
    example_gloss: 这件衬衫很大。
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: 小
    gloss: 小的
    note: کوچک（小）——在比较单元中已经学过。
    example_gloss: 这双鞋太小了。
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: 我可以试穿这个吗？
    gloss: 我可以试穿这个吗？
    note: پرو کردن 的意思是“试穿”（源自法语的借词，达里语和伊朗波斯语都用）。می‌توانم این را پرو کنم؟ 字面意思是“我能这个试穿吗？”
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: 可以，您可以试穿
    gloss: 可以，您可以试穿。
    note: می‌توانین پرو کنین 是同一动词的第二人称敬称形式。
  prs.a1.unit21.lesson04.teach.label_text:
    title: 衣服标签
    gloss: 衬衫：大号，白色，500阿富汗尼
    note: 一张简单的标签，标明商品、尺码、颜色和价格。
  prs.a1.unit21.lesson04.teach.review_ra:
    title: 宾语标记
    gloss: (宾语标记)
    note: را 用来标记直接宾语——在前面单元的句型中已经见过。
    example_gloss: 我要这件衬衫。
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: 阿富汗尼
    gloss: 阿富汗尼
    note: افغانی（阿富汗尼）——阿富汗的货币，在购物单元中已经学过。
    example_gloss: 这个是500阿富汗尼。
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: 这件衬衫是什么颜色的？
    gloss: 这件衬衫是什么颜色的？
    note: این پیراهن چه رنگ دارد؟ 中用到了 دارد（有），在此首次出现。
  prs.a1.unit21.lesson05.teach.turn01:
    title: 店主打招呼
    gloss: 你好，欢迎光临。
  prs.a1.unit21.lesson05.teach.turn02:
    title: 扎尔米娜提问
    gloss: 你好。这件衬衫有什么颜色？
    note: زرمینه（扎尔米娜）是本课程中反复出现的人物，最早出现在时间和日常作息单元中。
  prs.a1.unit21.lesson05.teach.turn03:
    title: 店主回答
    gloss: 我有黑色和白色的。
  prs.a1.unit21.lesson05.teach.turn04:
    title: 扎尔米娜做选择
    gloss: 我要白色的衬衫。尺码是大号的吗？
    note: اندازه‌اش（它的尺码）是在 اندازه 后加上了所属后缀。
  prs.a1.unit21.lesson05.teach.turn05:
    title: 店主确认
    gloss: 是的，是大号。您可以试穿。
  prs.a1.unit21.lesson05.teach.turn06:
    title: 扎尔米娜试穿
    gloss: 谢谢。这是我的尺码。多少钱？
  prs.a1.unit21.lesson05.teach.turn07:
    title: 店主说出价格
    gloss: 500阿富汗尼。
  prs.a1.unit21.lesson05.teach.turn08:
    title: 扎尔米娜同意购买
    gloss: 很好，我买了。
    note: می‌خرم 是 خریدن（买）的第一人称现在时。
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: 店主
    gloss: 店主
    note: دوکاندار（店主）——在购物单元中已经学过。
    example_gloss: 店主卖衬衫。
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: 很好
    gloss: 很好
    note: بسیار خوب（很好）——在购物单元中已经学过。
    example_gloss: 很好，谢谢。
  prs.a1.unit21.lesson05.teach.review_che:
    title: 什么
    gloss: 什么
    note: چه（什么）——在前面单元的疑问句型中已经见过。
    example_gloss: 这是什么颜色？
  prs.a1.unit21.lesson06.teach.review_va:
    title: 和
    gloss: 和
    note: و（和）——在购物单元中已经学过。
    example_gloss: 我买衬衫和裤子。
  prs.a1.unit21.lesson06.teach.review_yak:
    title: 一
    gloss: 一
    note: یک（一）——在数字单元中已经学过。
    example_gloss: 我买一件衬衫。
  prs.a1.unit21.lesson06.teach.review_ba:
    title: 到；去
    gloss: 到；去（某地）
    note: به（到、往）——在方位和日常作息单元中已经学过。
    example_gloss: 我去商店。
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: 商店
    gloss: 商店
    note: دوکان（商店）——在购物单元中已经学过。
    example_gloss: 这家商店很大。
  prs.a1.unit21.lesson06.teach.review_raft:
    title: 去了
    gloss: 去了
    note: رفت（去了，第三人称）——在过去事件单元中已经学过。
    example_gloss: 扎尔米娜去了商店。
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: 它的价格
    gloss: 它的价格
    note: قیمتش（它的价格）——在购物单元中已经学过。
    example_gloss: 它的价格是500阿富汗尼。
  prs.a1.unit21.lesson06.teach.summary_text:
    title: 购物小结
    gloss: 扎尔米娜去了商店。她买了一件白色的大号衬衫。价格是500阿富汗尼。
    note: خرید（买了）和 بود（是／曾是）都是简单过去时形式，在过去事件单元中已经学过。
