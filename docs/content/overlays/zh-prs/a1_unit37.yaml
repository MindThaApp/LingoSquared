course:
  title: 达里语 A1
  description: 喀布尔达里语入门：学会说出基本性格特点，询问某人是什么样的人，用“因为”给出简单理由，并用一小段话描述一个人的性格。
units:
  prs.a1.unit37.personality:
    title: 性格
    description: 描述一个人的基本性格特点，并询问某人是什么样的人。
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: 性格词汇
  prs.a1.unit37.lesson02.more_traits:
    title: 更多性格特点
  prs.a1.unit37.lesson03.asking_about_personality:
    title: 询问性格
  prs.a1.unit37.lesson04.personality_dialogue:
    title: 性格对话
  prs.a1.unit37.lesson05.personality_reading:
    title: 性格阅读
  prs.a1.unit37.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: 友善
    gloss: 友善的
    note: مهربان 是达里语中形容善良、热心的人的标准用词。
    example_gloss: 他/她很善良。
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: 勤劳
    gloss: 勤劳
    note: زحمتکش 字面意思是“吃苦出力的人”，即勤劳的人。
    example_gloss: 他/她很勤劳。
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: 聪明
    gloss: 聪明
    note: باهوش 由 با（有）和 هوش（智慧）组成，指聪明、机灵的人。
    example_gloss: 他/她很聪明。
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: 懒
    gloss: 懒
    note: تنبل 的意思是懒惰。
    example_gloss: 他/她很懒。
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 复习：他/她、是、和、但是
    gloss: 他/她 / 是 / 和 / 但是
    note: او、است、و 和 اما 是复习的词，本单元的性格描述句中会反复用到。
    target_text: او（他/她）/ است（是）/ و（和）/ اما（但是）
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: 他/她善良又勤劳
    gloss: 他/她善良又勤劳。
    note: و 把两个特点连成一个句子。
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: 他/她聪明，但是很懒
    gloss: 他/她聪明，但是很懒。
    note: اما 在一个句子里表示两个特点之间的转折。
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: 有趣
    gloss: 幽默 / 爱开玩笑
    note: شوخ 形容爱开玩笑、风趣的人。
    example_gloss: 他/她很幽默。
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: 寡言
    gloss: 寡言 / 内敛
    note: کم‌حرف 字面意思是“话少”，指安静、内敛的人。
    example_gloss: 他/她话不多。
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: 诚实
    gloss: 诚实
    note: راستگو 由 راست（真实、正直）和 گو（说话者）组成，指说真话的诚实的人。
    example_gloss: 他/她很诚实。
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 复习：和、但是
    gloss: 和 / 但是
    note: و 和 اما 是复习的词，用来连接或对比各种特点。
    target_text: و（和）/ اما（但是）
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: 他/她幽默又诚实
    gloss: 他/她幽默又诚实。
    note: 用 و 把两个优点连在一起。
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: 他/她话不多，但是很善良
    gloss: 他/她话不多，但是很善良。
    note: اما 把内敛的特点与温暖的特点对比起来。
  prs.a1.unit37.lesson03.teach.person_word:
    title: 人
    gloss: 人
    note: آدم 是常用词，指人，不分性别。
    example_gloss: 他/她是个好人。
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 复习：怎样/什么样、因为、帮助
    gloss: 怎样，什么样 / 因为 / 帮助
    note: چطور、چون 和 کمک 是复习的词，用来询问和解释一个人的性格。
    target_text: چطور（怎样，什么样）/ چون（因为）/ کمک（帮助）
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: 他/她是什么样的人？
    gloss: 他/她是什么样的人？
    note: او چطور آدم است؟ 字面意思是“他/她是怎样（的）人？”，是询问某人是什么样的人的自然说法。
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: 他/她很善良，因为他/她乐于助人
    gloss: 他/她很善良，因为他/她乐于助人。
    note: چون 引出原因；کمک می‌کند 字面意思是“做帮助”，即帮忙。
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: 他/她很勤劳，因为他/她工作很多
    gloss: 他/她很勤劳，因为他/她工作很多。
    note: زیاد کار می‌کند 字面意思是“做很多工作”。
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: 是的／一点／总是
    gloss: 是的 / 一点，稍微 / 总是
    note: بلی、کمی 和 همیشه 是复习的词，会用在性格对话中。
    target_text: بلی（是的）/ کمی（一点）/ همیشه（总是）
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 胡马云：扎尔米娜，卡里姆是什么样的人？
    gloss: 扎尔米娜，卡里姆是什么样的人？
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 扎尔米娜：卡里姆善良又勤劳。
    gloss: 卡里姆善良又勤劳。
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 胡马云：他聪明吗？
    gloss: 他聪明吗？
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 扎尔米娜：是的，他很聪明，不过有点寡言。
    gloss: 是的，他很聪明，不过有点寡言。
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 胡马云：他诚实吗？
    gloss: 他诚实吗？
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 扎尔米娜：是的，他一向很诚实。
    gloss: 是的，他一向很诚实。
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: 有时，每个人，宾语标记，他们喜欢
    gloss: 有时 / 大家 / 宾语标记 / 他们喜欢
    note: 阅读短文中用到了 گاهی（有时）和 همه（大家）；را 用来标记确指的直接宾语；دوست دارند 是 دوست دارم（我喜欢）的第三人称复数形式。
    target_text: گاهی（有时）/ همه（大家）/ را（宾语标记）/ دوست دارند（他们喜欢）
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: 关于胡马云的性格的短文
    gloss: 胡马云善良又勤奋。他很聪明，不过有时寡言。他一向很诚实。大家都喜欢他。
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 复习：我是、您是（敬称）
    gloss: 我是 / 您是（敬称）
    note: استم 和 استین 是复习用的系动词形式，分别表示“我是”和“您是”（敬称），本课总结部分的句子都会用到。
    target_text: استم（我是）/ استین（您是，敬称）
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: 我很善良，不过有时很懒
    gloss: 我很善良，不过有时很懒。
    note: 用 من（我）和 استم（我是）可以直接描述自己的性格，句型与本单元一直使用的 او/است 相同。
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: 您是什么样的人？
    gloss: 您是什么样的人？
    note: 在第3课的同一问句基础上加入 شما（您，敬称）和 استین（您是，敬称），现在直接向学习者提问。
