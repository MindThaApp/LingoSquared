course:
  title: 达里语 A1
  description: 喀布尔达里语入门：基本情绪词（高兴、难过、累、生气、担心）、用 چرا 询问原因、用 چون 说明理由，以及扎尔米娜和胡马云比较各自心情的对话。
units:
