    gloss: 这 / 是 / 在 / 好
    note: 这些是复习词汇（本课程中经常用到），用来谈论博物馆。
    target_text: این（这）/ است（是）/ در（在）/ خوب（好）
  prs.a1.unit53.lesson01.teach.museum_word:
    title: 博物馆
    gloss: 博物馆
    note: 这是阿富汗达里语中表示“博物馆”的标准词，不同于伊朗波斯语的 موزه。
    example_gloss: 博物馆很好。
