  prs.a1.unit30.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: 科技
    gloss: 科技
    note: تکنالوژی 意为“科技”，是阿富汗的标准拼写，与伊朗的拼写 تکنولوژی 不同。
    example_gloss: 科技很好。
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: 手机
    gloss: 手机
    note: موبایل 意为“手机”，与更泛指的 تلفن（电话，第7单元已学）不同。
    example_gloss: 我有一部手机。
  prs.a1.unit30.lesson01.teach.computer_word:
    title: 电脑
    gloss: 电脑
    note: کمپیوتر 意为“电脑”，是波斯语和达里语共用的标准外来词。
    example_gloss: 电脑在办公室。
  prs.a1.unit30.lesson01.teach.internet_word:
    title: 互联网
    gloss: 互联网
    note: انترنت 意为“互联网”，是波斯语和达里语共用的标准外来词。
    example_gloss: 网速很慢。
  prs.a1.unit30.lesson01.teach.app_word:
    title: 应用
    gloss: 应用
    note: اپلیکیشن 的意思是“应用程序”（App），是波斯语和达里语通用的标准外来词。
    example_gloss: 这个应用很好。
  prs.a1.unit30.lesson01.teach.photo_word:
    title: 照片
    gloss: 照片
    note: عکس 的意思是“照片”或“图片”。
    example_gloss: 这张照片很好。
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: 使用
    gloss: 使用 + 做 → 我使用
    note: استفاده（使用）与 کردن（做，复习）搭配，构成 استفاده می‌کنم（我使用）。这与本课程中已出现的轻动词结构相同，例如第29课的 بازی می‌کنم 和 ورزش می‌کنم。
    target_text: استفاده（使用）+ کردن（做）= استفاده می‌کنم（我使用）
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: 我使用互联网
    gloss: 我使用互联网。
    note: 由 من（我，复习）、از（从／用，复习）、انترنت 和 استفاده می‌کنم 组合而成。
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: 消息
    gloss: 消息
    note: پیام 的意思是“消息”。
    target_text: پیام（信息）
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: 我发消息
    gloss: 我发消息
    note: می‌فرستم 的意思是“我发送”，是一个新动词，不同于第7课表示留言的动词 بگذارم（留言）。
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: 我打电话
    gloss: 我打电话
    note: زنگ می‌زنم 的意思是“我打电话”。
    target_text: زنگ می‌زنم（我打电话）
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: 我拍照
    gloss: 我拍照
    note: عکس می‌گیرم 沿用了 می‌گیرم（我拿／接收，第23课复习），搭配 عکس 使用。
  prs.a1.unit30.lesson02.teach.download_word:
    title: 下载
    gloss: 下载
    note: دانلود 是达里语中表示“下载”的标准外来词，与 کردن（做，复习）构成轻动词结构，例如 دانلود می‌کنم（我下载）。
    example_gloss: 我下载一个应用程序。
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: 我想下载一个应用
    gloss: 我想下载一个应用
    note: 与第7课 می‌خواهم یک پیام بگذارم（我想留一条消息）的 می‌خواهم + 虚拟式结构相同。
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: 多少／次
    gloss: 多少／次（次数）
    note: چند بار 在这里用来询问频率。
    target_text: چند（几）/ بار（次）
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: 天
    gloss: 天
    note: روز 的意思是“天”。
    target_text: روز（天）
  prs.a1.unit30.lesson03.teach.review_mikonin:
