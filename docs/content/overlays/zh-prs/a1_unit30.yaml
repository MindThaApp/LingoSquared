    target_text: استفاده می‌کنین（您使用，敬称）
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: 你一天用几次手机？
    gloss: 你一天用几次手机？
    note: 由 چند بار（几次）、در روز（每天）、از موبایل（用手机）和 استفاده می‌کنین 组合而成。
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: 我每天都用网络
    gloss: 我每天都上网。
    note: هر روز（每天）与 از انترنت استفاده می‌کنم 搭配使用。
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: 他／她使用
    gloss: 他/她使用
    note: استفاده می‌کند 是第三人称形式，与第29课复习过的 می‌کند 结构一致。
    target_text: استفاده می‌کند（他/她使用，第三人称）
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: 你（非正式）／你使用（非正式）
    gloss: 你（非正式）／你使用（非正式）
    note: تو 和 می‌کنی 是همایون与زرمینه之间使用的非正式说法。
    target_text: تو（你，非正式）/ می‌کنی（你使用，非正式）
  prs.a1.unit30.lesson04.teach.review_koja:
    title: 哪里
    gloss: 哪里
    note: کجا 的意思是哪里。
