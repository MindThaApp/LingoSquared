course:
  title: 达里语 A1
  description: 喀布尔达里语入门：科技与设备词汇（手机、电脑、互联网、应用、照片），手机操作用语（发信息、打电话、拍照、下载应用），询问并回答一天用几次手机，以及扎尔米娜和霍马云关于手机、电脑和互联网使用的对话。
units:
  prs.a1.unit30.technology:
    title: 科技
    description: 谈谈手机、电脑、互联网和应用，以及你使用它们的频率。
