    note: دوست دارم（我喜欢）、وقت（时间）和 ندارم（我没有）都是第11、14、26、29课学过的内容。
    target_text: دوست دارم（我喜欢）/ وقت（时间）/ ندارم（我没有）
  prs.a1.unit30.lesson06.teach.wrap_summary:
