course:
  title: 达里语 A1
  description: 喀布尔达里语初级：金钱与支付词汇、询问支付方式、在 صرافی（货币兑换商）兑换货币，以及扎尔米娜与霍马云把美元换成阿富汗尼的对话。
units:
  prs.a1.unit23.money:
    title: 钱
    description: 能够处理基本的金钱事务，例如兑换货币、付款和询问支付方式。
lessons:
  prs.a1.unit23.lesson01.money_vocabulary:
    title: 金钱词汇
  prs.a1.unit23.lesson02.payment_method:
    title: 支付方式
  prs.a1.unit23.lesson03.currency_exchange:
    title: 货币兑换
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: 在货币兑换处
  prs.a1.unit23.lesson05.reading_receipt:
    title: 看收据
  prs.a1.unit23.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: 钱
    gloss: 钱
    note: پول 的意思是钱。
    example_gloss: 我有钱。
  prs.a1.unit23.lesson01.teach.naqd:
    title: 现金
    gloss: 现金
    note: نقد 的意思是现金。
    example_gloss: 我付现金。
  prs.a1.unit23.lesson01.teach.kart:
    title: 银行卡
    gloss: 卡
    note: کارت 的意思是卡（支付卡）。
    example_gloss: 我有一张卡。
  prs.a1.unit23.lesson01.teach.dollar:
    title: 美元
    gloss: 美元
    note: دالر 的意思是美元——在阿富汗日常货币兑换中很常用，常与阿富汗尼一起报价。
    example_gloss: 我有一百美元。
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: 我有
    gloss: 我有
    note: دارم 的意思是“我有”（第10单元购物中已学过）。
    example_gloss: 我有钱。
  prs.a1.unit23.lesson01.teach.review_sad:
    title: 一百
    gloss: 一百
    note: صد 的意思是一百——第4单元数字中已学过，第10单元购物中也用过。
    example_gloss: 我有一百美元。
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: 我付款
    gloss: 我付款
    note: می‌پردازم 的意思是“我支付”。
    example_gloss: 我付现金。
  prs.a1.unit23.lesson02.teach.ya:
    title: 或者
    gloss: 或者
    note: یا 的意思是或者、还是。
    example_gloss: 我付现金或刷卡。
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: 现金还是刷卡？
    gloss: 您付现金还是刷卡？
    note: 在商店或兑换柜台常听到的问句。
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: 我能
    gloss: 我能
    note: می‌توانم 的意思是“我能”（课程前面已学过）。
    example_gloss: 我可以付现金。
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: 支付
    gloss: 支付
    note: بپردازم 是“支付”的虚拟式（接续式）形式，用在 می‌توانم（我能）之后——می‌توانم نقد بپردازم 字面意思是“我能付现金”。
    example_gloss: 我可以付现金。
  prs.a1.unit23.lesson03.teach.sarafi:
    title: 货币兑换商
    gloss: 货币兑换商
    note: صرافی 是阿富汗常见的货币兑换场所——与正规的 بانک（银行）不同。
    example_gloss: 我去货币兑换商那里。
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: 兑换
    gloss: 兑换
    note: تبدیل کردن 的意思是“兑换”（货币）。
    example_gloss: 我把美元换成阿富汗尼。
  prs.a1.unit23.lesson03.teach.narkh:
    title: 汇率
    gloss: 汇率
    note: نرخ 的意思是比率、汇率。
    example_gloss: 今天美元的汇率是多少？
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: 今天汇率是多少？
    gloss: 今天美元的汇率是多少？
    note: 询问汇率的标准说法。
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: 阿富汗尼
    gloss: 阿富汗尼
    note: افغانی 是阿富汗的货币（第10单元购物中已学过，例如“صد افغانی”）。
    example_gloss: 我有一百阿富汗尼。
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 复习：是、今天、多少
    gloss: 是／今天／多少
    note: است、امروز 和 چند 是复习词（课程前面已学过），在本课的汇率问句中组合使用。
    example_gloss: 今天美元的汇率是多少？
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 复习：到／往、宾语标记、我做、做、我想要
    gloss: 到／往／宾语标记／我做／做／我想要
    note: به、را、می‌کنم、کنم 和 می‌خواهم 是复习词（课程前面已学过），在本课的兑换句子中组合使用。
    example_gloss: 我想把美元换成阿富汗尼。
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: 我要
    gloss: 我想要
    note: می‌خواهم 的意思是“我想要”（前面的单元已学过）。
    example_gloss: 我想兑换美元。
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: 您有多少？
    gloss: 您有多少美元?
    note: دارین 是“有”的礼貌／复数形式，用于称呼顾客。
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: 给您
    gloss: 给您
    note: بفرمایین 是递东西给对方时使用的礼貌用语。
    example_gloss: 给您，七千阿富汗尼。
  prs.a1.unit23.lesson04.teach.hazar:
    title: 千
    gloss: 千
    note: هزار 的意思是千。
    example_gloss: 七千阿富汗尼。
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: 扎尔米娜
    gloss: 扎尔米娜
    note: زرمینه 是课程中反复出现的固定人物。
    example_gloss: 扎尔米娜去货币兑换店。
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: 很好
    gloss: 很好
    note: بسیار خوب 之前已学过，这里用来接受对方的提议。
    example_gloss: 很好，谢谢。
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 复习：七十、谢谢、做了
    gloss: 七十／谢谢／做了（他／她）
    note: هفتاد 和 تشکر 是复习词；کرد 是 کردن（做）的第三人称过去式，已在第20单元的过去时课中出现，这里用来概括这次兑换。
    example_gloss: 扎尔米娜把一百美元兑换成了阿富汗尼。
  prs.a1.unit23.lesson04.teach.turn01:
    title: 扎尔米娜：您好，我想把美元兑换成阿富汗尼。
    gloss: 您好，我想把美元兑换成阿富汗尼。
  prs.a1.unit23.lesson04.teach.turn02:
    title: 兑换商：您有多少美元？
    gloss: 您有多少美元?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 扎尔米娜：我有一百美元。今天的汇率是多少？
    gloss: 我有一百美元。今天的汇率是多少？
  prs.a1.unit23.lesson04.teach.turn04:
    title: 兑换商：今天一美元兑七十阿富汗尼。
    gloss: 今天一美元兑七十阿富汗尼。
  prs.a1.unit23.lesson04.teach.turn05:
    title: 扎尔米娜：很好，请兑换吧。
    gloss: 很好，请兑换吧。
    note: تبدیل کنین 是礼貌的祈使句，意思是“请兑换”。
  prs.a1.unit23.lesson04.teach.turn06:
    title: 兑换商：给您，七千阿富汗尼。
    gloss: 给您，七千阿富汗尼。
  prs.a1.unit23.lesson04.teach.turn07:
    title: 扎尔米娜：谢谢。
    gloss: 谢谢。
  prs.a1.unit23.lesson05.teach.rasid:
    title: 收据
    gloss: 收据
    note: رسید 的意思是收据。
    example_gloss: 我拿收据。
  prs.a1.unit23.lesson05.teach.migiram:
    title: 我拿／我收到
    gloss: 我拿／我收到
    note: می‌گیرم 的意思是“我拿／我收到”。
    example_gloss: 我收下钱。
  prs.a1.unit23.lesson05.teach.reading_text:
    title: 阅读短文
    gloss: 扎尔米娜去了货币兑换店。她有一百美元，想把美元兑换成阿富汗尼。今天的汇率是七十阿富汗尼。扎尔米娜拿到了七千阿富汗尼，还拿了一张收据。
  prs.a1.unit23.lesson05.teach.review_raft:
    title: 去了
    gloss: 去了
    note: رفت 是过去式，意思是“去了”（他／她）。
    example_gloss: 扎尔米娜去了货币兑换店。
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 复习：七、拿了／收到了（他／她）、我拿了／我收到了
    gloss: 七／拿了、收到了（他／她）／我拿了、我收到了
    note: هفت 是复习过的数字；گرفت 和 گرفتم 分别是 گرفتن（拿／收到）的第三人称和第一人称过去式，这里用来说明扎尔米娜收到的金额。
    example_gloss: 扎尔米娜收到了七千阿富汗尼。
  prs.a1.unit23.lesson06.teach.review_summary:
    title: 总结
    gloss: 我有钱：现金和银行卡。我可以在货币兑换店把美元兑换成阿富汗尼。今天一美元兑七十阿富汗尼。
  prs.a1.unit23.lesson06.teach.review_bara:
    title: 给、为
    gloss: 给、为
    note: برای 的意思是“为了；给；每”。
    example_gloss: 一美元兑七十阿富汗尼。
  prs.a1.unit23.lesson06.teach.review_va:
    title: 和
    gloss: 和
    note: و 的意思是“和”，在前面的单元中已经学过。
    example_gloss: 我有钱：现金和银行卡。
