course:
  title: 达里语 A1
  description: 喀布尔达里语入门：基本比较（更大／更小、更贵／更便宜、更高／更年轻）、为比较给出理由，以及一段比较两样事物的简短阅读／对话。
units:
  prs.a1.unit15.comparisons:
    title: 比较
    description: 能够对熟悉的人、物品或选项进行基本的比较，并听懂别人的比较。
