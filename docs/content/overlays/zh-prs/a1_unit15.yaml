  prs.a1.unit15.lesson05.reading_a_comparison:
    title: 阅读比较短文
  prs.a1.unit15.lesson06.comparisons_dialogue:
    title: 比较两样东西的对话
teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: 这个
    gloss: 这个
    note: این 的意思是“这个”。
    example_gloss: 这个更大。
  prs.a1.unit15.lesson01.teach.aan_word:
    title: 那个
    gloss: 那个
    note: آن 的意思是“那个”——本课程的方言使用完整形式 آن，而不是伊朗口语的 اون。
    example_gloss: 那个更小。
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: 它更大
    gloss: 更大
    note: بزرگ‌تر است 是完整、未缩写的形式（它更大）：*بزرگ‌تر* 是 *بزرگ*（大）的比较级，*است* 仍是单独的一个词。
    example_gloss: 这个比那个大。
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: 它更小
    gloss: 更小
    note: کوچک‌تر است 是完整形式（它更小）——کوچک 是标准的达里语拼写（不是伊朗口语的 کوچیک）。
    example_gloss: 那个比这个小。
  prs.a1.unit15.lesson01.teach.az_word:
    title: 比
    gloss: 比
    note: از 用来引出比较的对象——X از Y بزرگ‌تر است 意思是 X 比 Y 大。
    target_text: از（比）
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: 它更贵
    gloss: 更贵
    note: گران‌تر است 是完整形式（它更贵）——گران 是标准的达里语拼写（不是伊朗口语的 گرون）。
    example_gloss: 这个比那个贵。
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: 它更便宜
    gloss: 更便宜
    note: ارزان‌تر است 是完整形式（它更便宜）——ارزان 是标准的达里语拼写（不是伊朗口语的 ارزون）。
    example_gloss: 那个比这个便宜。
  prs.a1.unit15.lesson03.teach.names:
    title: 卡里姆和尼加尔
    gloss: 卡里姆，尼加尔
    note: 本课程中反复使用的阿富汗常见人名。
    example_gloss:
    - 我是卡里姆。
    - 我是尼加尔。
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: 更高
    gloss: 更高/他(她)更高
    note: '*قد بلندتر است* 字面意思是“个子更高”：*قد*（身高），*بلندتر*（更高，是 *بلند*“高”的比较级），*است*（是）。'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: 更年轻
    gloss: 更年轻/他(她)更年轻
    note: جوان‌تر است 是完整形式（更年轻）——جوان 是标准的达里语拼写（不是伊朗口语的 جوون）。
    example_gloss: 尼加尔比卡里姆年轻。
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: 它更好
    gloss: 它更好
    note: بهتر است 是完整形式——بهتر（更好）是 خوب（好）的不规则比较级。
    example_gloss: 这个比那个好。
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: 它更差
    gloss: 它更差
    note: بدتر است 是完整形式——بدتر（更差）是 بد（坏）的不规则比较级。
    example_gloss: 那个比这个差。
  prs.a1.unit15.lesson04.teach.choon_word:
    title: 因为
    gloss: 因为
    note: چون 用来引出理由。
    target_text: چون（因为）
  prs.a1.unit15.lesson04.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，用来连接两个分句或两个事物。
    target_text: و（和）
  prs.a1.unit15.lesson05.teach.reading_text:
    title: 比较短文示例
    gloss: 卡里姆比尼加尔个子高。尼加尔比卡里姆年轻。
    note: 一段简短的第三人称比较，综合运用了本单元的词汇。
  prs.a1.unit15.lesson06.teach.names:
    title: 卡里姆和尼加尔
    gloss: 卡里姆，尼加尔
    example_gloss:
    - 卡里姆个子更高。
    - 尼加尔更年轻。
  prs.a1.unit15.lesson06.teach.ama_word:
    title: 但是
    gloss: 但是
    note: اما 意思是“但是”，用来引出转折。
    target_text: اما（但是）
  prs.a1.unit15.lesson06.teach.bali_word:
    title: 是
    gloss: 是
    note: بلی 是表示“是”的礼貌、正式的说法，与本课程的语体一致。
    example_gloss: 是的，这个更贵。
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: 卡里姆说
    gloss: 这个比那个贵，但是更好。
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: 尼加尔回答
    gloss: 是的，但那个更便宜。
