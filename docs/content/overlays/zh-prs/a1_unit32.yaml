    gloss: 庆祝／聚会
    note: جشن 的意思是庆祝活动或聚会。
    example_gloss: 我们的庆祝活动很盛大。
  prs.a1.unit32.lesson01.teach.cake_word:
    title: 蛋糕
    gloss: 蛋糕
    note: کیک 的意思是蛋糕，是波斯语和达里语共有的常用外来词。
    example_gloss: 蛋糕很好吃。
  prs.a1.unit32.lesson01.teach.gift_word:
    title: 礼物
    gloss: 礼物
    note: هدیه 的意思是礼物，是达里语／波斯语的日常常用词（也可以说 تحفه）。
    example_gloss: 这份礼物是给您的。
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: 祝贺
    gloss: 祝贺
    note: تبریک 的意思是祝贺，日常说法是与 می‌گویم（我说）连用的 تبریک می‌گویم（我向你道贺）。
    example_gloss: 恭喜！
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: 生日快乐（构成方式）
    gloss: 你的生日（非正式）＋吉祥 → 生日快乐
    note: تولدت 由 تولد（生日）加上非正式的“你的”后缀 -ت 构成；مبارک 的意思是吉祥、喜庆。合起来，تولدت مبارک 就是达里语／波斯语中标准的生日祝福语。
    target_text: تولدت（你的生日，非正式）+ مبارک（祝贺、吉祥）= تولدت مبارک（生日快乐）
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: 生日快乐！
    gloss: 生日快乐！
    note: 这是达里语／波斯语中地道且被广泛使用的生日祝福语（تولدتان مبارک 是正式场合的说法，本单元练习不涉及）。
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: 您／在／是
    gloss: 您（敬称）／在／是
    note: شما（您，敬称）、در（在）和 است（是）都是前面单元学过的内容。
    target_text: شما（您，敬称）/ در（在）/ است（是）
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: 我／哪个
    gloss: 我／哪一个
    note: من（我）和 کدام（哪一个）都是前面单元学过的内容。
    target_text: من（我）/ کدام（哪一个）
  prs.a1.unit32.lesson02.teach.month_word:
