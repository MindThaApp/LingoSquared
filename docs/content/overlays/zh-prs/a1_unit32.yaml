    example_gloss: 这个月很暖和。
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: 哈马尔
    gloss: 哈玛尔月（第一个月）
    note: حمل 是阿富汗太阳历（伊朗历）的第一个月。
    target_text: حمل（哈玛尔，第一个月）
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: 您的生日在哪个月？
    gloss: 您的生日在哪个月？
    note: 由 تولد（生日，复习）、شما（您，敬称，复习）、در（在，复习）、کدام（哪一个，复习）和 ماه（月份）组成。
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: 我的生日在哈玛尔月
    gloss: 我的生日在哈玛尔月。
    note: 把 تولد من در ... است（我的生日在……，复习过的句型）与 حمل（哈玛尔月）结合起来。
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: 邀请／聚会
    gloss: 邀请／聚会
    note: دعوت 和 مهمانی 按本课程每个单元各自列出词汇的规则，在此再次列出。
    target_text: دعوت（邀请）/ مهمانی（聚会）
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: 宾语标记／向、给
    gloss: 宾语标记／到，向
    note: را（宾语标记）和 به（到／向）都是复习过的功能词。
