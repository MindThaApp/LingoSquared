    target_text: می‌کنم（我做）— دعوت می‌کنم（我邀请）
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: 我邀请您参加生日聚会
    gloss: 我邀请您参加生日聚会。
    note: 把 من ... را به ... دعوت می‌کنم（我邀请……参加……，复习过的句型）与 جشن تولد（生日聚会）结合起来。
