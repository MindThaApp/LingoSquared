    example_gloss:
    - 我是莱拉。
    - 我是费里敦。
  prs.a1.unit19.lesson06.teach.you_word:
    title: 您（礼貌）
    gloss: 你
    note: شما 是礼貌的第二人称代词。
    target_text: شما（您／你们——礼貌称呼）
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: 多少
    gloss: 多少
    note: چند 的意思是多少、几。
    target_text: چند（多少）
  prs.a1.unit19.lesson06.teach.yes_word:
    title: 是
    gloss: 是
    note: بلی 是表示“是”的礼貌／正式说法，与本课程的语体一致。
    example_gloss: 是的，很大。
  prs.a1.unit19.lesson06.teach.dialogue_line1:
    title: 费里敦提问
    gloss: 您家有几个房间？
  prs.a1.unit19.lesson06.teach.dialogue_line2:
    title: 莱拉回答
    gloss: 有两间卧室。
