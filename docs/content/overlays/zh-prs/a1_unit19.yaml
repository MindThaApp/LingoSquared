  prs.a1.unit19.lesson05.teach.longer_description_text:
    title: 较长的住宅描述
    gloss: 这座房子有两间卧室，有一间厨房和一间卫生间。厨房很大。桌子在窗户对面。
    note: 与上一篇相同的描述，增加了大小和位置的信息。
