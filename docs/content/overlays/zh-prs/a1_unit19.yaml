    example_gloss: 我有一间卧室。
  prs.a1.unit19.lesson01.teach.kitchen_word:
    title: 厨房
    gloss: 厨房
    note: آشپزخانه 的意思是厨房。
    example_gloss: 我有一间厨房。
  prs.a1.unit19.lesson01.teach.bathroom_word:
    title: 浴室
    gloss: 浴室
    note: تشناب 是阿富汗达里语中表示卫生间／厕所的标准说法，不同于伊朗波斯语的 دستشویی。
    example_gloss: 我有一间浴室。
  prs.a1.unit19.lesson01.teach.have_word:
    title: 我有
    gloss: 我有
    note: دارم 是 داشتن（有）的第一人称现在时。
    target_text: دارم（我有）
  prs.a1.unit19.lesson02.teach.table_word:
    title: 桌子
    gloss: 桌子
    note: میز 的意思是桌子。
    example_gloss: 我有一张桌子。
  prs.a1.unit19.lesson02.teach.chair_word:
    title: 椅子
    gloss: 椅子
    note: چوکی 是阿富汗达里语中表示椅子的标准说法，不同于伊朗波斯语的 صندلی。
    example_gloss: 我有一把椅子。
  prs.a1.unit19.lesson02.teach.bed_word:
    title: 床
    gloss: 床
    note: تخت 的意思是床。
    example_gloss: 我有一张床。
  prs.a1.unit19.lesson02.teach.window_word:
