teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: 商店
    gloss: 商店
    note: دوکان 是阿富汗达里语中表示当地小店铺的地道说法，不同于伊朗波斯语的 مغازه。
    example_gloss: 这家商店很大。
  prs.a1.unit10.lesson01.teach.qeymat:
    title: 价格
    gloss: 价格
    note: قیمت 的意思是“价格”。
    example_gloss: 这个的价格是多少？
  prs.a1.unit10.lesson01.teach.arzan:
    title: 便宜
    gloss: 便宜
    note: ارزان 的意思是“便宜的、不贵的”。
    example_gloss: 这个很便宜。
  prs.a1.unit10.lesson01.teach.gran:
    title: 贵
    gloss: 贵
    note: گران 与 ارزان 意思相反。
    example_gloss: 这个很贵。
  prs.a1.unit10.lesson01.teach.takhfif:
    title: 折扣
    gloss: 折扣
    note: تخفیف 的意思是“价格折扣、优惠”。
    example_gloss: 有折扣吗?
  prs.a1.unit10.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是常用的连接词，用来连接两个简短的陈述或请求，相当于“和”。
    example_gloss: 我要买苹果和馕。
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: 多少钱？
    gloss: 一共多少钱？
    note: قیمتش چند است؟ 字面意思是“它的价格是多少？”。
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: 一百阿富汗尼。
    gloss: 一百阿富汗尼。
    note: صد افغانی است 用阿富汗货币 افغانی（阿富汗尼）来说明价格。
  prs.a1.unit10.lesson03.teach.sib:
    title: 苹果
    gloss: 苹果
    note: سیب 的意思是“苹果”，这里泛指正在售卖的一批苹果，不分单复数。
    example_gloss: 我要一公斤苹果。
  prs.a1.unit10.lesson03.teach.kilo:
    title: 公斤
    gloss: 公斤
    note: کیلو 是按重量出售农产品时的标准单位。
    example_gloss: 我要一公斤苹果。
  prs.a1.unit10.lesson03.teach.label_text:
    title: 苹果：一公斤一百阿富汗尼
    gloss: 苹果：一公斤一百阿富汗尼
    note: 'سیب: یک کیلو صد افغانی 是集市上常见的价格标签。'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: 我要一公斤苹果。
    gloss: 我要一公斤苹果。
    note: یک کیلو سیب می‌خواهم 使用第8单元点餐时学过的 یک [物品] می‌خواهم 句型。
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: 我要两公斤。
    gloss: 我要两公斤。
    note: دو کیلو می‌خواهم 把数字换成 دو（二），表示需要更多的量。
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: 可以给我打个折吗？
    gloss: 可以给我打个折吗？
    note: تخفیف می‌توانین بدهین؟ 用 می‌توانین（您能……）礼貌地请求降价。
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: 给您算一百八十阿富汗尼。
    gloss: 给您算一百八十阿富汗尼。
    note: برای شما صد و هشتاد افغانی می‌شه 给出了优惠后的总价：两公斤每公斤一百，原价两百，少收二十阿富汗尼。
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: 请，请便
    gloss: 请，请进
    note: بفرمایین 是店主在顾客到来时使用的热情礼貌的招呼或邀请用语。
    example_gloss: 给您，这是价钱。
  prs.a1.unit10.lesson06.teach.turn01:
    title: 你好，请进。
    gloss: 你好，请进。
    note: 店主热情地招呼顾客。
  prs.a1.unit10.lesson06.teach.turn02:
    title: 你好。苹果多少钱？
    gloss: 你好。苹果多少钱？
    note: 顾客询问苹果的价格。
  prs.a1.unit10.lesson06.teach.turn03:
    title: 一公斤一百阿富汗尼。
    gloss: 一公斤一百阿富汗尼。
    note: 店主说出每公斤的价格。
  prs.a1.unit10.lesson06.teach.turn04:
    title: 我要两公斤。可以打个折吗？
    gloss: 我要两公斤。可以打个折吗？
    note: 顾客说明数量并请求优惠。
  prs.a1.unit10.lesson06.teach.turn05:
    title: 可以，给您两公斤算一百八十阿富汗尼。
    gloss: 可以，给您两公斤算一百八十阿富汗尼。
    note: 店主答应并给出优惠后的总价，与前面每公斤一百阿富汗尼的价格一致（两百减去二十阿富汗尼的折扣）。
  prs.a1.unit10.lesson06.teach.turn06:
    title: 很好，谢谢。
    gloss: 很好，谢谢。
    note: 顾客接受价格并向店主道谢。
