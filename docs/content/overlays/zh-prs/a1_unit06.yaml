  prs.a1.unit06.lesson01.teach.right:
    title: 右
    gloss: 右
    note: راست 是方向“右”。
    example_gloss: 向右拐。
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: 转弯（礼貌的命令式）
    gloss: 转弯
    note: بپیچین 是动词“转弯”的礼貌命令式，用于给别人指路。
    example_gloss: 向右拐。
  prs.a1.unit06.lesson01.teach.to_word:
    title: 到／向
    gloss: 到／向
    note: به 与方向词连用，如 به چپ（向左）。
    target_text: به（到／向）
  prs.a1.unit06.lesson02.teach.go_straight:
    title: 让别人直走
    gloss: 一直往前走。
    note: مستقیم بروین 是最基本的指路说法，用的是礼貌的命令式。
  prs.a1.unit06.lesson02.teach.turn_left:
    title: 让别人向左转
    gloss: 向左拐。
    note: به چپ بپیچین 字面意思是“向左转”。
  prs.a1.unit06.lesson02.teach.turn_right:
    title: 让别人向右转
    gloss: 向右拐。
    note: به راست بپیچین 句型相同，只是把 چپ 换成 راست。
  prs.a1.unit06.lesson03.teach.first_word:
    title: 首先
    gloss: 首先
    note: اول 标示一连串指路步骤中的第一步。
    example_gloss: 先直走。
  prs.a1.unit06.lesson03.teach.then_word:
    title: 然后
    gloss: 然后
    note: بعد 标示第一步之后的下一步。
    example_gloss: 然后向左转。
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: 把两个指路步骤连起来
    gloss: 先直走，然后向右转。
    note: اول 和 بعد 可以把多个指路步骤连在一句话里。
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: 礼貌地询问怎么去某地
    gloss: 您能告诉我怎么去市场吗？
    note: می‌توانین بگویین...؟ 是礼貌地问“您能告诉我……吗？”的说法，适合向陌生人问路。بروم 意思是“我去”，所以整句是在问我该怎么去那里。
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: 询问某地在哪里（复习）
    gloss: 请问，药店在哪里？
    note: ببخشین، [地点] کجاست؟ 在地点单元学过，是问路前很自然的开场白。
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: 表示你听明白了
    gloss: 非常感谢，我明白了。
    note: تشکر زیاد، فهمیدم 礼貌地结束对话，并表明已听懂路线。
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: 办公室（复习）
    gloss: 办公室
    note: دفتر 在前面的单元已学过，这里作为目的地，用来练习礼貌问路的句型。
    example_gloss: 办公室很近。
  prs.a1.unit06.lesson05.teach.after_word:
    title: 之后
    gloss: 之后
    note: بعد از 用来指出位于目的地之前的地标。
    example_gloss: 过了清真寺，就是银行。
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: 在……对面
    gloss: 在……对面
    note: روبه‌رو 是 مقابل（对面）的新同义词，مقابل 在地点单元学过；日常达里语中两者都表示“对面”。
    example_gloss: 银行在清真寺对面。
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: 借助地标指路
    gloss: 过了清真寺，银行就在您对面。
    note: بعد از مسجد، بانک روبه‌روی شماست 把地标（بعد از مسجد）和相对位置（روبه‌روی شماست）结合在一起。
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: 学校（复习）
    gloss: 学校
    note: مکتب 在地点单元学过，这里在练习句中用作地标。
    example_gloss: 学校很近。
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila 问路
    gloss: Sohaila 礼貌地问店主怎么去药店。
    note: ببخشین 恭敬地引出问题，می‌توانین بگویین؟ 是第4课学过的礼貌问路说法。
  prs.a1.unit06.lesson06.teach.turn02:
    title: 店主说出第一步
    gloss: 店主肯定地回答，并说先直走。
    note: اول مستقیم بروین 开启了一连串的指路步骤。
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila 确认后问下一步
    gloss: Sohaila 重复“直走”以确认，然后问接下来怎么走。
    note: بعد چطور؟ 是询问下一步的自然、简洁的说法。
  prs.a1.unit06.lesson06.teach.turn04:
    title: 店主说出第二步和地标
    gloss: 店主说向左转，然后以清真寺和银行为地标说明药店的位置。
    note: 这里结合了第2课的转弯指示和第5课的地标句型。
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila 道谢并表示听明白了
    gloss: Sohaila 非常感谢他，并说自己明白了。
    note: تشکر زیاد، فهمیدم 用来结束对话，第4课学过。
  prs.a1.unit06.lesson06.teach.turn06:
    title: 店主谦虚的回应与告别
    gloss: 店主谦虚地回应谢意，并祝她一路顺利。
    note: قابلی نداره 在地点单元学过；سفر خوش（一路顺风／一路平安）是对即将出发的人很自然的告别语。
