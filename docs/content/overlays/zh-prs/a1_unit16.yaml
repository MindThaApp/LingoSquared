course:
  title: 达里语 A1
  description: 喀布尔达里语入门：基础出行词汇、买票、询问发车时间和站台、阅读简短时刻表，以及售票处对话。
units:
  prs.a1.unit16.travel:
    title: 旅行
    description: 能够处理基本的交通信息、车票、目的地和出发详情。
lessons:
  prs.a1.unit16.lesson01.basic_travel_vocab:
    title: 基础出行词汇
  prs.a1.unit16.lesson02.buying_a_ticket:
    title: 买车票
  prs.a1.unit16.lesson03.asking_departure_details:
    title: 询问发车时间和站台
  prs.a1.unit16.lesson04.reading_a_schedule:
    title: 阅读发车时刻表
  prs.a1.unit16.lesson05.ticket_counter_dialogue:
    title: 售票处对话
  prs.a1.unit16.lesson06.confirming_travel_plans:
    title: 确认出行计划
teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: 票
    gloss: 车票
    note: تکت 意思是“票”。这是阿富汗达里语的日常用词；بلیط（也写作 بلیت，伊朗式说法）也能听懂并被接受，但平时最常听到的是 تکت。
    example_gloss: 我有一张票。
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: 火车
    gloss: 火车
    note: قطار 的意思是“火车”。
    example_gloss: 火车很好。
  prs.a1.unit16.lesson01.teach.bas_word:
    title: 公共汽车
    gloss: 公共汽车
    note: بس 意思是“公共汽车”，是阿富汗达里语的常见用法。
    example_gloss: 公共汽车很好。
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: 机场
    gloss: 机场
    note: میدان هوایی 意思是“机场”——这是本课程一贯采用的阿富汗达里语说法（不是伊朗的 فرودگاه），与第5单元一致。
    example_gloss: 机场很好。
  prs.a1.unit16.lesson01.teach.yak_word:
    title: 一个
    gloss: 一／一个
    note: یک 的意思是“一”，这里用来表示不确定的“一张／一个”（一张票）。
    target_text: یک（一／一个）
  prs.a1.unit16.lesson01.teach.az_word:
    title: 从
    gloss: 从
    note: از 的意思是“从”，表示起点（它在比较句中还有“比”的另一种用法，二者不同）。
    target_text: از（从）
  prs.a1.unit16.lesson01.teach.doo_word:
    title: 二
    gloss: 二
    note: دو 的意思是“二”。
    example_gloss: 我有两张票。
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: 二号站台
    gloss: 二号站台
    note: سکوی دو 由 سکو（站台）、连接成分 ezafe -ی 和 دو（二）组成。
    target_text: سکوی دو（二号站台）
  prs.a1.unit16.lesson02.teach.herat_word:
    title: 赫拉特
    gloss: 赫拉特
    note: 阿富汗西部的一座大城市。
    example_gloss: 我要去赫拉特。
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: 我想要
    gloss: 我想要
    note: می‌خواهم 是“我想要”的完整、未缩写形式，与本课程的语体一致。
    target_text: می‌خواهم（我想要）
  prs.a1.unit16.lesson02.teach.be_word:
    title: 到／去
    gloss: 到
    note: به 用来标示目的地——به هرات 意思是“去赫拉特”。
    target_text: به（到／往）
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: 我要一张去赫拉特的票
    gloss: 我要一张去赫拉特的票
    note: یک تکت به هرات می‌خواهم 把本课的词汇组合在一起，是买票时的标准说法。
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: 站台
    gloss: 站台
    note: سکو 的意思是“站台”（火车站的）。
    example_gloss: 火车从二号站台出发。
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: 它出发
    gloss: 它出发
    note: حرکت می‌کند 是“它出发／行驶”的完整、未缩写形式。
    target_text: حرکت می‌کند（它出发）
  prs.a1.unit16.lesson03.teach.kay_word:
    title: 什么时候
    gloss: 什么时候
    note: کی 的意思是“什么时候”，用来询问时间。
    target_text: کی（什么时候）
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: 早晨
    gloss: 早上
    note: صبح 的意思是“早上”。
    example_gloss: 火车早上八点出发。
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: 时刻表示例文本
    gloss: 开往赫拉特的火车早上八点从二号站台发车。
    note: 一则简短的实用通知，综合了本单元的出行词汇。由于暂无音频，这段文字代替车站的语音广播。
  prs.a1.unit16.lesson05.teach.farda_word:
    title: 明天
    gloss: 明天
    note: فردا 的意思是“明天”。
    example_gloss: 我明天早上去。
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: 很好／好的
    gloss: 很好／好的
    note: بسیار خوب 是表示“好的／很好”的完整、正式的说法，与本课程的语体一致（不用口语的 باشه）。
    example_gloss: 这趟火车很好。
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: 旅客说
    gloss: 我要一张去赫拉特的票。
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: 售票员问
    gloss: 您想什么时候走？
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: 旅客回答
    gloss: 明天早上。
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: 售票员确认
    gloss: 好的，火车早上八点从二号站台发车。
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: 多谢
    gloss: 多谢
    note: تشکر زیاد 是常用的礼貌说法，意思是“非常感谢”，在第5、6单元中已学过。
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: 不客气
    gloss: 不客气
    note: قابلی نداره 是回应感谢的标准礼貌说法，意思是“不客气”，在第5、6单元中已学过。
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: 一路平安
    gloss: 一路平安
    note: سفر خوش 是对即将出行的人常说的告别祝福，在第6单元中已学过。
  prs.a1.unit16.lesson06.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，用来连接两个分句或两个事物。
    target_text: و（和）
