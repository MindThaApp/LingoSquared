teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: 面包
    gloss: 面包
    note: نان 是阿富汗每顿饭的主食。
    example_gloss: 面包很新鲜。
  prs.a1.unit08.lesson01.teach.palaw:
    title: 抓饭
    gloss: 抓饭
    note: پلو 是阿富汗的抓饭，调味很有特色，常与肉、胡萝卜或葡萄干一起烹制，并不只是白米饭。
    example_gloss: 抓饭很好吃。
  prs.a1.unit08.lesson01.teach.qorma:
    title: 肉炖蔬菜
    gloss: 肉炖蔬菜
    note: قورمه 泛指肉和蔬菜一起炖煮的菜肴，通常浇在 پلو 上食用。
    example_gloss: 我用炖菜配抓饭吃。
  prs.a1.unit08.lesson01.teach.chai_review:
    title: 茶（复习）
    gloss: 茶
    note: چای 是阿富汗几乎随处都会招待的饮品。
    example_gloss: 请来一杯茶。
  prs.a1.unit08.lesson01.teach.ab_water:
    title: 水
    gloss: 水
    note: آب 是“水”的普通说法。
    example_gloss: 请来一杯水。
  prs.a1.unit08.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是常用的连接词，用来连接一串食物。
    target_text: و（和）
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: 礼貌地点茶
    gloss: 我要一杯茶。
    note: یک چای می‌خواهم 是一种中性而礼貌的点餐方式，直接使用 می‌خواهم（我要），而不是更委婉的说法。
  prs.a1.unit08.lesson02.teach.lotfan:
    title: 请
    gloss: 请
    note: لطفاً 可以加在几乎任何请求里，使语气更委婉。
    example_gloss: 请帮帮忙。
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: 礼貌地点馕
    gloss: 我要一个馕。
    note: 任何食物或饮品名词都可以套用同样的 یک [item] می‌خواهم 句式。
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: 询问有什么可选
    gloss: 你们有什么？
    note: چی دارین؟ 是向店主或服务员询问有哪些食物的自然说法。
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: 回答有什么可供选择
    gloss: 我们有抓饭和炖菜。
    note: پلو و قورمه داریم 用了 داریم（我们有），即 دارم 的“我们”形式。店主代表整家店说话，所以用“我们”。
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: 新鲜的
    gloss: 新鲜的
    note: تازه 用来形容刚做好的食物。
    example_gloss: 这个馕是新鲜的。
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: 一盘抓饭
    gloss: 一盘抓饭
    note: بشقاب（盘子）是用盘子盛的食物所用的量词。
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: 两个馕
    gloss: 两个馕
    note: تا 是放在数字后面的通用量词，适用于大多数可数的东西，这里指两块馕。
  prs.a1.unit08.lesson04.teach.combined_order:
    title: 合起来点完整的一餐
    gloss: 请给我一盘抓饭和两个馕。
    note: 点餐时可以用 و（和）把多个数量短语连在一起。
  prs.a1.unit08.lesson05.teach.bill_word:
    title: 账单
    gloss: 账单
    note: بل 是阿富汗人日常用来指餐馆账单的词，借自英语。
    example_gloss: 请买单。
  prs.a1.unit08.lesson05.teach.bill_request:
    title: 询问账单总共多少钱
    gloss: 账单多少钱？
    note: بل چند می‌شه؟ 字面意思是“账单变成多少”，是询问总价的日常自然说法。می‌شه 是 می‌شود 的口语形式，在店里听到的是它，书面则写 می‌شود。
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: 称赞食物好吃
    gloss: 非常好吃。
    note: خیلی خوش‌مزه بود 是饭后很自然的称赞用语。
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: 茶馆
    gloss: 茶馆／简易餐馆
    note: چایخانه 是阿富汗常见的一种简易餐馆，在喀布尔尤其多，供应茶和简单的饭菜。
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: 欢迎光临（复习）
    gloss: 欢迎
    note: خوش آمدین 在问候单元中学过，这里用作店主的迎客用语。
  prs.a1.unit08.lesson06.teach.turn01:
    title: 店主招呼顾客
    gloss: 店主欢迎顾客，并询问他们想要什么。
    note: چی میل دارین؟ 是礼貌的开场问句，作用与 چی دارین؟ 相似，但是从顾客的意愿出发来问。
  prs.a1.unit08.lesson06.teach.turn02:
    title: 顾客询问有什么可选
    gloss: 顾客向店主问好，并询问有什么。
    note: چی دارین؟ 开启点餐的对话，出自第3课。
  prs.a1.unit08.lesson06.teach.turn03:
    title: 店主介绍有哪些食物
    gloss: 店主说有抓饭和炖肉，两样都很新鲜。
    note: هردو（两个都）表示提到的两道菜都是新鲜的。
  prs.a1.unit08.lesson06.teach.turn04:
    title: 顾客点完整的一餐
    gloss: 顾客同意，并点了一盘抓饭配炖肉，再加一杯茶。
    note: 这句结合了第4课的数量句式和第1课的食物词汇。
  prs.a1.unit08.lesson06.teach.turn05:
    title: 店主答应顾客的点单
    gloss: 店主说马上就端来。
    note: چشم 字面意思是“在我眼上”，是表示“当然可以”的尊敬说法。می‌آرم 是 می‌آورم（我带来）的口语形式，همین حالا 意思是“马上”。
  prs.a1.unit08.lesson06.teach.turn06:
    title: 顾客夸赞食物好吃，并要求结账
    gloss: 顾客说很好吃，并请服务员拿账单。
    note: 这两句话都直接用到了第5课的词汇。
  prs.a1.unit08.lesson06.teach.turn07:
    title: 店主说出总价
    gloss: 店主道谢，并说一共是两百阿富汗尼。
    note: افغانی 是阿富汗的货币；دوصد（两百）加上货币名称就可以说出价格。
