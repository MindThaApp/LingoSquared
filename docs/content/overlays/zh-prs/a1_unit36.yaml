teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: 厨房
    gloss: 厨房
    note: آشپزخانه 是表示“厨房”的标准达里语词。
    example_gloss: 今天我在厨房里。
  prs.a1.unit36.lesson01.teach.food_word:
    title: 食物
    gloss: 食物／饭菜
    note: غذا 泛指食物或一餐饭，不同于 پلو 这样的具体菜肴。
    example_gloss: 饭菜很好吃。
  prs.a1.unit36.lesson01.teach.onion_word:
    title: 洋葱
    gloss: 洋葱
    note: پیاز 是洋葱的常用达里语词，在阿富汗菜中经常用到。
    example_gloss: 洋葱很新鲜。
  prs.a1.unit36.lesson01.teach.meat_word:
    title: 肉
    gloss: 肉
    note: گوشت 的意思是肉。
    example_gloss: 肉很新鲜。
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 复习：一、想要、在、是
    gloss: 一／一个／我想要／在／我是（我在）
    note: یک、می‌خواهم、در 和 استم 是复习内容，会用在本单元的烹饪句子中。
    target_text: یک（一／一个）/ می‌خواهم（我想要）/ در（在）/ استم（我是／我在）
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: 我做饭
    gloss: 我做饭。
    note: می‌پزم 是 پختن（煮、烹饪）的第一人称现在时形式。
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: 我在厨房里
    gloss: 我在厨房里。
    note: استم 是系动词的第一人称形式，这里与 در 搭配表示所在位置。
  prs.a1.unit36.lesson02.teach.salt_word:
    title: 盐
    gloss: 盐
    note: نمک 的意思是盐。
    example_gloss: 我想要盐。
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: 米饭
    gloss: 米饭
    note: برنج 指未煮的米（谷物），不同于 پلو——后者是食物单元中学到的煮好的米饭菜肴。
    example_gloss: 我煮米饭。
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 复习：我做、切
    gloss: 我做／切碎的
    note: می‌کنم 是复习内容；خرد 是新词，与 کردن 的各种形式搭配，表示切或切碎。
    target_text: می‌کنم（我做）/ خرد（切碎的）
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: 我切洋葱
    gloss: 我切洋葱。
    note: خرد می‌کنم 字面意思是“我把它弄成切碎的”——这是标准的复合动词结构。
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: 我加盐
    gloss: 我加盐。
    note: می‌اندازم（来自 انداختن，扔、放入）是达里语中表示加入配料的自然动词。
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: 我煮肉
    gloss: 我煮肉。
    note: 把 گوشت 换成 برنج，就可以说煮其他食物。
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 复习：先、然后
    gloss: 首先 / 然后
    note: اول 和 بعد 是复习词，用来表示做饭步骤的先后顺序。
    target_text: اول（首先）/ بعد（然后）
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 复习：水、热
    gloss: 水／热
    note: آب 和 گرم 是前面单元学过的复习词。
    target_text: آب（水）/ گرم（热的）
  prs.a1.unit36.lesson03.teach.pour_word:
    title: 我倒
    gloss: 我倒
    note: می‌ریزم（来自 ریختن，意为“倒”）是加入液体时自然的动词，不同于加入固体配料时用的 می‌اندازم。
    example_gloss: 我倒水。
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: 首先我切洋葱
    gloss: 我先切洋葱。
    note: اول 表示一系列步骤中的第一步。
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: 然后我煮肉
    gloss: 然后我煮肉。
    note: بعد 表示一系列步骤中的下一步。
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: 我倒热水
    gloss: 我倒热水。
    note: 由 گرم（热）和 می‌ریزم（我倒）组合而成。
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: 你好／是的／请／好的／谢谢／炖菜／好吃／是
    gloss: 你好／是的／请／好的、没问题／谢谢／炖菜／好吃／是
    note: سلام、بلی、لطفاً、چشم、تشکر、قورمه、خوش‌مزه 和 است 是厨房对话中用到的复习词。
    target_text: سلام（你好）/ بلی（是）/ لطفاً（请）/ چشم（好的）/ تشکر（谢谢）/ قورمه（炖菜）/ خوش‌مزه（好吃）/ است（是）
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 娜迪亚：你好，您在做什么菜？
    gloss: 你好，你在做什么菜？
    note: چی می‌پزین؟ 使用了敬称“您”的动词形式 می‌پزین。
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 法里德：我在做库尔马。
    gloss: 我在做库尔马。
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 娜迪亚：我来帮忙好吗？
    gloss: 我来帮忙好吗？
    note: کمک می‌کنم؟ 字面意思是“我帮忙吗？”，是提出帮忙的自然说法。
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 法里德：好的，请切洋葱。
    gloss: 好的，请切洋葱。
    note: کنین 是敬称的命令式，意思是“请做／切”。
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 娜迪亚：好的。
    gloss: 好的。
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 法里德：谢谢，饭菜很好吃。
    gloss: 谢谢，饭菜很好吃。
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: 他／她，在，做，煮，很，高兴，是
    gloss: 他／她／在／他／她做／他／她煮／很／高兴／是
    note: او 是达利语中表示“他”或“她”的代词；می‌کند 和 می‌پزد 是本单元前面所学动词的第三人称形式。
    target_text: او（他／她）/ در（在）/ می‌کند（他／她做）/ می‌پزد（他／她煮）/ بسیار（很）/ خوشحال（高兴）/ است（是）
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 阅读：娜迪亚做饭
    gloss: 娜迪亚在厨房里。她切洋葱。然后她煮肉。饭菜非常好吃。娜迪亚很高兴。
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم（我喜欢）/ را（宾语标记）/ اما（但是）/ وقت ندارم（我没有时间）
