  prs.a1.unit18.lesson01.teach.teacher_word:
    title: 教师
    gloss: 老师
    note: معلم 的意思是“老师”。
    example_gloss: 我是老师。
  prs.a1.unit18.lesson01.teach.engineer_word:
    title: 工程师
    gloss: 工程师
    note: مهندس 的意思是“工程师”。
    example_gloss: 我是工程师。
  prs.a1.unit18.lesson01.teach.doctor_word:
    title: 医生
    gloss: 医生
    note: داکتر 是阿富汗达里语中“医生”的标准拼写和读音。
    example_gloss: 我是医生。
  prs.a1.unit18.lesson01.teach.shopkeeper_word:
    title: 店主
    gloss: 店主
    note: دوکاندار 是阿富汗达里语中“店主”的标准说法，在本课程的购物单元中已经学过。
    example_gloss: 我是店主。
  prs.a1.unit18.lesson01.teach.work_word:
    title: 工作
    gloss: 工作
    note: کار 的意思是“工作”。
    example_gloss: 我有事要做。
  prs.a1.unit18.lesson01.teach.am_word:
    title: 我是
    gloss: 我是
    note: استم 是第一人称的礼貌系动词形式，与本课程中 استم/استین 的用法一致。
    target_text: استم（我是）
  prs.a1.unit18.lesson02.teach.office_word:
    title: 办公室
    gloss: 办公室
    note: دفتر 的意思是“办公室”。
    example_gloss: 我在办公室工作。
  prs.a1.unit18.lesson02.teach.shop_word:
    title: 商店
    gloss: 商店
    note: دوکان 的意思是“商店”。
    example_gloss: 我在商店工作。
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: 医院
    gloss: 医院
    note: شفاخانه 是阿富汗达里语中地道的“医院”一词，在本课程的地点单元中已经学过。
    example_gloss: 我在医院工作。
  prs.a1.unit18.lesson02.teach.school_word:
    title: 学校
    gloss: 学校
    note: مکتب 是阿富汗达里语中地道的“学校”一词，在本课程的地点单元中已经学过。
    example_gloss: 我在一所学校工作。
  prs.a1.unit18.lesson02.teach.in_word:
    title: 在
    gloss: 在
    note: در 表示事情发生的地点，در مکتب 的意思是“在学校”。
    target_text: در（在）
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: 我工作
    gloss: 做／工作
    note: می‌کنم 是 کردن（做）的第一人称现在时，کار می‌کنم 字面意思是“做工作”，也就是“我工作”。
    target_text: کار می‌کنم（我工作）
  prs.a1.unit18.lesson03.teach.where_word:
    title: 哪里
    gloss: 哪里
    note: کجا 的意思是哪里。
    target_text: کجا（哪里）
  prs.a1.unit18.lesson03.teach.you_work_word:
    title: 您工作（礼貌）
    gloss: 你工作
    note: کار می‌کنین 的意思是“您工作”（礼貌说法）。
    target_text: کار می‌کنین（您工作——礼貌）
  prs.a1.unit18.lesson03.teach.and_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，用来连接两个分句或两个事物。
    target_text: و（和）
  prs.a1.unit18.lesson04.teach.is_word:
    title: 是（第三人称）
    gloss: 是
    note: است 是第三人称系动词，معلم است 的意思是“（她／他）是老师”。
    target_text: است（是——第三人称）
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: 他／她工作
    gloss: 他/她工作
    note: می‌کند 是 کردن（做）的第三人称现在时，کار می‌کند 的意思是“他／她工作”。
    target_text: کار می‌کند（他/她工作）
  prs.a1.unit18.lesson04.teach.laila_word:
    title: 莱拉
    gloss: 莱拉
    note: 本课程中反复出现的人名，在介绍单元中首次出现。
    example_gloss: 莱拉是老师。
  prs.a1.unit18.lesson04.teach.profile_text:
    title: 简短的工作简介
    gloss: 莱拉是老师。她在学校工作。
    note: 一段简短的第三人称简介，说明职业和工作地点。
  prs.a1.unit18.lesson05.teach.every_word:
    title: 每
    gloss: 每
    note: هر 的意思是“每”。
    example_gloss: 我每天工作。
  prs.a1.unit18.lesson05.teach.day_word:
    title: 天
    gloss: 天
    note: روز 的意思是“天”，هر روز 的意思是“每天”。
    example_gloss: 她每天都上课。
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: 课
    gloss: 课
    note: درس 的意思是“课”。
    example_gloss: 莱拉教书。
  prs.a1.unit18.lesson05.teach.gives_word:
    title: 他／她给
    gloss: 他／她给
    note: می‌دهد 是 دادن（给）的第三人称现在时，درس می‌دهد 字面意思是“给课”，也就是“教书、授课”。
    target_text: می‌دهد（他/她给——درس می‌دهد 意为教课）
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: 较长的工作简介
    gloss: 莱拉是老师。她在学校工作。她每天都教书。
    note: 与上一课相同的简介，增加了日常工作内容。
  prs.a1.unit18.lesson06.teach.names:
    title: 巴希尔和尼加尔
    gloss: 巴希尔，尼加尔
    note: 本课程中反复出现的人物。
    example_gloss:
    - 我是巴希尔。
    - 我是尼加尔。
  prs.a1.unit18.lesson06.teach.you_word:
    title: 您（礼貌）
    gloss: 你
    note: شما 是礼貌的第二人称代词，相当于“您”。
    target_text: شما（您——礼貌）
  prs.a1.unit18.lesson06.teach.what_is_word:
    title: ……是什么
    gloss: 是什么
    note: چیست 的意思是“是什么”，کار شما چیست؟ 的意思是“您做什么工作？”。
    target_text: چیست（是什么）
  prs.a1.unit18.lesson06.teach.yes_word:
    title: 是
    gloss: 是
    note: بلی 是礼貌、正式的“是”，与本课程的语体一致。
    example_gloss: 是的，我每天都工作。
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: 巴希尔提问
    gloss: 您做什么工作？
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: 尼加尔回答
    gloss: 我是医生。我在医院工作。
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: 巴希尔提问
    gloss: 您每天都工作吗？
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: 尼加尔回答
    gloss: 是的，我每天都工作。
