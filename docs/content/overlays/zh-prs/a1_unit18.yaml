course:
  title: 达里语 A1
  description: 喀布尔达里语入门：基本职业（教师、工程师、医生、店主）、工作场所（办公室、商店、医院、学校），将职业与工作场所结合起来表达，阅读简短和较长的职业介绍，以及询问他人职业的对话。
units:
  prs.a1.unit18.work:
    title: 工作
    description: 能说出基本的职业、工作场所和简单的工作内容。
