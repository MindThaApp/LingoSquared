  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: 一通完整的电话
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: 喂(接电话时)
    gloss: 喂（接电话时）
    note: الو 专门用于接听或开始一通电话，与当面打招呼用的 سلام 不同。
    example_gloss: 喂，我是卡里姆。
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: 请对方继续说
    gloss: 可以，请。
    note: 接起电话后，自然的回应是 بلی، بفرمایین。这里的 بفرمایین 与本课程前面用过的礼貌用语相同，意为“请”“请说”，并不是“我在听”的字面翻译。
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: 电话（复习）
    gloss: 电话
    note: تلفن 在数字单元中出现过，本单元以它作为整个主题的场景。
    example_gloss: 我的电话坏了。
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: 询问对方是谁
    gloss: 请问，您是哪位？
    note: ببخشین، کی صحبت می‌کند؟ 用来礼貌地询问来电者的身份。
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: 自报身份
    gloss: 我是法里德。
    note: من فرید استم 直接说明来电者是谁，用的是前面单元学过的 استم 句型。
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: 说明与接电话者的关系
    gloss: 我是胡马雍的同事。
    note: همکار همایون استم 说明来电的缘由，在接电话的人不认识你时很有用。
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: 请对方说慢一点
    gloss: 请说慢一点。
    note: 当通话信号不好，或你是初学者时，لطفاً آهسته صحبت کنین 是自然而礼貌的请求。
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: 请对方重复（复习）
    gloss: 您能再说一遍吗？
    note: می‌توانین دوباره بگویین؟ 在自我介绍单元出现过，用在电话中同样自然。
  prs.a1.unit07.lesson03.teach.combined_request:
    title: 把两个请求合在一起
    gloss: 请说慢一点，再说一遍。
    note: و 把两个请求连成一句自然的话。
  prs.a1.unit07.lesson04.teach.payam_word:
    title: 消息
    gloss: 消息
    note: پیام 是“消息、信息”的通称，口头或书面的都可以用。
    example_gloss: 我有一条信息要告诉你。
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: 说明想要留言
    gloss: 我想留言。
    note: 当你要找的人不在时，就说 می‌خواهم یک پیام بگذارم。
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: 说明稍后再打
    gloss: 我稍后再打。
    note: بعد زنگ می‌زنم 是不留言时的简单替代说法。
  prs.a1.unit07.lesson05.teach.short_message:
    title: 短信
    gloss: 短信
    note: پیام کوتاه 字面意思是“简短的消息”，是日常指称短信的说法。
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: 一条留言示例
    gloss: 明天九点开会。
    note: فردا جلسه ساعت نه است 是一条自然而完整的、可以转达的信息。
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: 确认会转达留言
    gloss: 我会转达。
    note: می‌رسانم 表示会把消息传到收信人那里。
  prs.a1.unit07.lesson06.teach.turn01:
    title: 莉玛接电话
    gloss: 莉玛用接电话的问候语回应。
    note: الو؟ 是接听来电的标准说法。
  prs.a1.unit07.lesson06.teach.turn02:
    title: 法里德问候她并确认她的身份
    gloss: 法里德向她问好，并问她是不是莉玛。
    note: الو، سلام 把电话问候语和日常问候语结合在一起。
  prs.a1.unit07.lesson06.teach.turn03:
    title: 莉玛请他继续说，并问他是谁
    gloss: 莉玛请他继续说，并问他是哪位。
    note: بلی، بفرمایین 和 کی صحبت می‌کند؟ 都出自第一、二课。
  prs.a1.unit07.lesson06.teach.turn04:
    title: 法里德自报身份
    gloss: 法里德说他是霍马云的同事。
    note: 这里沿用了第二课“说明同事关系”的句型，让莉玛有理由信任这通电话。
  prs.a1.unit07.lesson06.teach.turn05:
    title: 莉玛请他说慢一点
    gloss: 莉玛向他问好，并请他说慢一点。
    note: آهسته صحبت کنین، لطفاً 沿用了第三课的请求说法。
  prs.a1.unit07.lesson06.teach.turn06:
    title: 法里德答应，并说想留言
    gloss: 法里德表示同意，并说想给霍马云留言。
    note: 这里把第四课的 پیام 句型扩展为指明收信人（برای همایون，“给霍马云”）。
  prs.a1.unit07.lesson06.teach.turn07:
    title: 莉玛答应记下来
    gloss: 莉玛请他说，并说自己会记下来。
    note: 这里的 بفرمایین 是请法里德继续说。
  prs.a1.unit07.lesson06.teach.turn08:
    title: 法里德说出留言内容
    gloss: 法里德请她转告：明天九点开会。
    note: 这里直接沿用了第五课的示例留言内容。
  prs.a1.unit07.lesson06.teach.turn09:
    title: 莉玛确认并承诺转达
    gloss: 莉玛确认了细节，并说她会转达。
    note: 如第五课所学，می‌رسانم 为留言环节画上句号。
  prs.a1.unit07.lesson06.teach.turn10:
    title: 法里德道谢并告别
    gloss: 法里德连声道谢并说再见。
    note: تشکر زیاد 和 خدا حافظ 都是前面单元学过的词汇。
  prs.a1.unit07.lesson06.teach.turn11:
    title: 莉玛告别
    gloss: 莉玛说再见。
    note: خدا حافظ 结束通话。
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: 说某人留了言（过去时）
    gloss: 法里德留了言。
    note: گذاشت 是动词的简单过去时（“留下了”）。第四课 می‌خواهم یک پیام بگذارم 中的 بگذارم 意为“我留下”。通话结束后可以用它来概述发生的事。
    target_text: فرید پیام گذاشت（法里德留了言）
