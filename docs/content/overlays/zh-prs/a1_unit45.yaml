course:
  title: 达里语 A1
  description: 入门级喀布尔达里语：入住酒店，询问房间设施（卫生间、早餐、无线网络）和钥匙，说明住几晚，阅读简短的订房确认，并询问退房时间。
units:
  prs.a1.unit45.accommodation:
    title: 酒店与房间
    description: 入住酒店，询问房间设施和钥匙，说明住宿时长，阅读订房确认，并询问退房时间。
