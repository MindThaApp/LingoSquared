teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 复习：这、是、在
    gloss: 这／是／在
    note: این、است 和 در（本课程中经常出现）是复习词，用来谈论酒店和房间。
    target_text: این（这）/ است（是）/ در（在）
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: 酒店
    gloss: 酒店
    note: هوتل 是阿富汗达里语中“酒店”的说法，带有 و 字母，不同于伊朗波斯语的 هتل。
    example_gloss: 这是一家酒店。
  prs.a1.unit45.lesson01.teach.room_word:
    title: 房间
    gloss: 房间
    note: اتاق 是日常用语中表示“房间”的词。
    example_gloss: 房间在酒店里。
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: 房间在酒店里
    gloss: 房间在酒店里。
    note: اتاق در هوتل است 综合了本课前面学过的词。
  prs.a1.unit45.lesson01.teach.key_word:
    title: 钥匙
    gloss: 钥匙
    note: کلید 是达里语中表示“钥匙”的标准词。
    example_gloss: 这是一把钥匙。
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: 房间钥匙
    gloss: 房间钥匙
    note: کلید اتاق 由 کلید（钥匙）和 اتاق（房间）组成。
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: 这是房间钥匙
    gloss: 这是房间钥匙。
    note: این کلید اتاق است 综合了本课前面学过的词。
  prs.a1.unit45.lesson02.teach.review_have:
    title: 复习：我有、它有
    gloss: 我有／它有
    note: دارم 和 دارد 是复习词，用来询问房间设施。
    target_text: دارم（我有）/ دارد（它有）
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: 浴室
    gloss: 浴室
    note: تشناب 是日常用语中表示“卫生间”或“洗手间”的词。
    example_gloss: 房间里有卫生间。
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: 房间里有卫生间吗？
    gloss: 房间里有卫生间吗？
    note: اتاق تشناب دارد؟ 是一般疑问句，用升调表示，不需要单独的疑问词。
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: 是的，有卫生间
    gloss: 是的，有卫生间。
    note: بلی 是复习词，表示“是的”。
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: 预订
    gloss: 预订
    note: رزرو 是常用的外来词，表示预订。
    example_gloss: 我有预订。
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: 我有预订
    gloss: 我有预订。
    note: رزرو دارم 由 رزرو（预订）和 دارم（我有）组成。
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 复习：多少／几、为了／给、我想要
    gloss: 多少／几／为了／我想要
    note: چند、برای 和 می‌خواهم 是复习词，用来询问有关房间的事。
    target_text: چند（多少／几）/ برای（为了／给）/ می‌خواهم（我想要）
  prs.a1.unit45.lesson03.teach.number_word:
    title: 数字；号码
    gloss: 号码
    note: نمبر 是阿富汗达里语日常使用的外来词，表示号码，用于房间号、电话号码等。
    example_gloss: 房间号
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: 房间号是多少？
    gloss: 房间号是多少？
    note: نمبر اتاق چند است؟ 用 چند 来询问房间号。
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 复习：夜晚、二、三
    gloss: 夜晚／二／三
    note: شب、دو 和 سه 是复习词，用来说明住宿时长。
    target_text: شب（夜晚）/ دو（二）/ سه（三）
  prs.a1.unit45.lesson03.teach.stay_word:
    title: 我住
    gloss: 我住
    note: می‌مانم 来自 ماندن，意思是停留或留下。
    example_gloss: 我住两晚。
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: 我住两晚
    gloss: 我住两晚。
    note: دو شب می‌مانم 由 دو شب（两晚）和 می‌مانم（我住）组成。
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: 我想订两晚
    gloss: 我想订两晚。
    note: برای دو شب می‌خواهم 把 برای（为了）与复习词 می‌خواهم 搭配使用。
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 复习：您住（敬称）
    gloss: 您住／你们住（敬称）
    note: می‌مانین 是 می‌مانم 的敬称／复数形式，与本课程中其他地方的 می‌خواهین、کنین 同属 -ین 形式。
    target_text: می‌مانین（您住／你们住，敬称）
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: 您住几晚？
    gloss: 您住几晚？
    note: چند شب می‌مانین؟ 是酒店前台人员会用的正式问句。
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 复习:欢迎、您叫什么名字?、我是
    gloss: 欢迎 / 您叫什么名字? / 我是
    note: خوش آمدین、نام‌تان چیست؟ 和 استم 是入住登记时用到的复习词语。
    target_text: خوش آمدین（欢迎）/ نام‌تان چیست؟（您叫什么名字？）/ استم（我是）
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 复习:也、……呢、给您、非常感谢
    gloss: 也 / ……呢 / 给您 / 非常感谢
    note: هم、چطور、بفرمایین 和 تشکر زیاد(之前单元学过)是用来结束对话的复习词语。
    target_text: هم（也）/ چطور（……怎么样）/ بفرمایین（给您）/ تشکر زیاد（多谢）
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: 早餐
    gloss: 早餐
    note: چای صبح 字面意思是“早晨的茶”,是阿富汗达里语中表示早餐的日常说法,由 چای(茶,第8单元)和 صبح(早晨,第16单元)构成。
  prs.a1.unit45.lesson04.teach.included_word:
    title: 包含在内
    gloss: 包含的
    note: شامل 意思是“包含”,用来说明房间附带某项服务。
    example_gloss: 含早餐。
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: 无线网络
    gloss: 无线网络
    note: وای‌فای 是表示无线网络(WiFi)的标准外来词。
    example_gloss: 也有无线网络。
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 霍马云:您好。我有预订。我住两晚。
    gloss: 您好。我有预订。我住两晚。
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 酒店前台:欢迎光临。您叫什么名字?
    gloss: 欢迎。您叫什么名字？
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 霍马云:我是霍马云。
    gloss: 我是霍马云。
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 酒店前台:很好。房间带卫生间,含早餐。
    gloss: 很好。房间有卫生间，含早餐。
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 霍马云:无线网络呢?
    gloss: 无线网络呢？
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 酒店前台:有的,也有无线网络。这是钥匙,给您。
    gloss: 是的，也有无线网络。这是钥匙。
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 复习:预订、号码、五、星期一、星期二、和
    gloss: 预订 / 号码 / 五 / 星期一 / 星期二 / 和
    note: رزرو、نمبر(本单元学过)、پنج、دوشنبه、سه‌شنبه 和 و 是阅读短文中用到的复习词语。
    target_text: رزرو（预订）/ نمبر（号码）/ پنج（五）/ دوشنبه（星期一）/ سه‌شنبه（星期二）/ و（和）
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 复习:他/她住
    gloss: 他／她住
    note: می‌ماند 是本单元前面学过的 می‌مانم/می‌مانین 这一组动词的第三人称形式。
    target_text: می‌ماند（他／她住）
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: 阅读胡马云的预订
    gloss: 这是霍马云的预订。房间是五号房。霍马云住两晚:星期一和星期二。房间带卫生间,含早餐。
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 复习:但是、您(敬称)、小时/点钟、时间、七、十二
    gloss: 但是 / 您(敬称) / 小时/点钟 / 时间 / 七 / 十二
    note: اما、شما、ساعت、وقت(之前单元学过)以及 هفت/دوازده 是用来说明时间安排的复习词语。
    target_text: اما（但是）/ شما（您，敬称）/ ساعت（小时／点钟）/ وقت（时间）/ هفت（七）/ دوازده（十二）
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: 退房 / 离开
    gloss: 退房／出口
    note: خروج 指退房,如 وقت خروج(退房时间)。
    example_gloss: 退房时间
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: 退房时间是十二点
    gloss: 退房时间是十二点。
    note: وقت خروج ساعت دوازده است 用来说明退房时间。
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: 早餐是七点,但退房是十二点
    gloss: 早餐是七点,但退房时间是十二点。
    note: اما 用来对比早餐时间和退房时间。
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: 您的退房时间是几点？
    gloss: 您的退房时间是几点？
    note: 这是带有敬称 شما 的正式问法,用来询问退房时间。
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب（很好）/ چای（茶）/ صبح（早晨）/ و（和）
