    title: 复习：这、衬衫、汽车、书、我、和、但是
    gloss: 这 / 衬衫 / 汽车 / 书 / 我 / 和 / 但是
    note: این、پیراهن、موتر、کتاب、من、و 和 اما 是用来构成本单元颜色句子的复习词。
    target_text: این（这）/ پیراهن（衬衫）/ موتر（汽车）/ کتاب（书）/ من（我）/ و（和）/ اما（但是）
