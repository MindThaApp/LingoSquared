course:
  title: 达里语 A1
  description: 喀布尔达里语入门：爱好与空闲时间词汇（读书、听音乐、看电影、散步、做饭），用 دوست دارین 询问别人空闲时喜欢做什么，用 هر هفته/آخر هفته 表示频率，以及泽尔米娜与胡马云比较各自如何度过空闲时间的对话。
