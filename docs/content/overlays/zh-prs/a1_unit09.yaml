teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: 星期六和星期日
    gloss: 星期六、星期日
    note: شنبه（星期六）是阿富汗一周的第一天；其后是 یکشنبه（星期日）。
    example_gloss:
    - 今天是星期六。
    - 明天是星期天。
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: 星期一和星期二
    gloss: 星期一，星期二
    note: دوشنبه 和 سه‌شنبه 字面意思是 شنبه 之后的“第二天”和“第三天”。
    example_gloss:
    - 我星期一有课。
    - 我星期二有个约会。
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: 星期三和星期四
    gloss: 星期三，星期四
    note: چهارشنبه 和 پنجشنبه 延续同样的“第四天”“第五天”的规律。
    example_gloss:
    - 我星期三上班。
    - 星期四见。
  prs.a1.unit09.lesson01.teach.jomeh:
    title: 星期五
    gloss: 星期五
    note: جمعه 是阿富汗每周的休息日，作用相当于周末。
    example_gloss: 星期五是假日。
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: 日期
    gloss: 日期
    note: تاریخ 是表示日历日期的通用词。
    example_gloss: 今天几号？
  prs.a1.unit09.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是本单元通篇使用的常见连接词。
    target_text: و（和）
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: 每周的休息日
    gloss: 星期五是每周的休息日。
    note: 阿富汗每周主要的休息日是 *جمعه*（星期五），而不是周六和周日；星期四往往只上半天班。
  prs.a1.unit09.lesson02.teach.hamal:
    title: 哈马尔月（第1个月）
    gloss: 哈马尔月，伊朗太阳历的第一个月（约3月下旬至4月）
    note: حمل 是阿富汗太阳历新年的开始，与诺鲁孜节新年同时。
    example_gloss: 哈马尔月是一年的第一个月。
  prs.a1.unit09.lesson02.teach.sawr:
    title: 萨瓦尔月（第2个月）
    gloss: 萨瓦尔月，第二个月（约4月至5月）
    note: ثور 紧接在 حمل 之后。
    example_gloss: 萨瓦尔月天气很好。
  prs.a1.unit09.lesson02.teach.jawza:
    title: 贾瓦扎月（第3个月）
    gloss: 贾瓦扎月，第三个月（约5月至6月）
    note: جوزا 紧接在 ثور 之后。
    example_gloss: 我是贾瓦扎月出生的。
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: 阿富汗的历法
    gloss: 阿富汗使用伊朗太阳历（太阳希吉拉历）。
    note: 这与伊朗使用的是同一种太阳历，不同于公历，也不同于阴历的伊斯兰希吉拉历。
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: 询问今天星期几
    gloss: 今天星期几？
    note: امروز چند شنبه است؟ 字面是“今天是第几个 -shanbe”，是询问星期几的自然说法。
  prs.a1.unit09.lesson03.teach.today_word:
    title: 今天
    gloss: 今天
    note: امروز 指当天。
    example_gloss: 今天几号？
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: 说出完整的日期
    gloss: 今天是星期四，哈马尔月15日。
    note: امروز پنجشنبه، پانزدهم حمل است 依次说出星期、序数日期和月份名称。
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: 询问活动是哪一天
    gloss: 会议是哪一天？
    note: جلسه کدام روز است؟ 用 کدام（哪一个）来询问活动在哪一天。
  prs.a1.unit09.lesson05.teach.which_date:
    title: 询问具体日期
    gloss: 星期一是哈马尔月几号？
    note: دوشنبه چندم حمل است؟ 询问星期一是这个月的第几号。
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19日
    gloss: 19日
    note: '*نوزدهم* 是“十九”的序数形式，构成方式与 *پانزدهم*（15日）相同。'
    example_gloss: 今天是19日。
  prs.a1.unit09.lesson06.teach.turn01:
    title: 胡马云询问会议是哪一天
    gloss: 胡马云问巴希尔会议是哪一天。
    note: جلسه کدام روز است؟ 出自第5课。
  prs.a1.unit09.lesson06.teach.turn02:
    title: 巴希尔回答
    gloss: 巴希尔说他想是星期一。
    note: فکر می‌کنم（我想）使语气委婉，因为他并不完全确定。
  prs.a1.unit09.lesson06.teach.turn03:
    title: 胡马云询问确切日期
    gloss: 胡马云问星期一是哈马尔月几号。
    note: دوشنبه چندم حمل است؟ 出自第5课。
  prs.a1.unit09.lesson06.teach.turn04:
    title: 巴希尔说出确切日期
    gloss: 巴希尔说星期一是哈马尔月19日。
    note: '*دوشنبه نوزدهم حمل است* 把星期、序数日期和月份结合在一起，如第4课所教的句型。'
  prs.a1.unit09.lesson06.teach.turn05:
    title: 胡马云问星期五的情况
    gloss: 胡马云表示同意，并问巴希尔星期五有没有空。
    note: وقت داری؟（你有时间吗？）是询问对方是否有空的自然说法。
  prs.a1.unit09.lesson06.teach.turn06:
    title: 巴希尔说他很忙
    gloss: 巴希尔说不行，他星期五很忙。
    note: مصروف استم（我很忙）说明了为什么星期五不行。
  prs.a1.unit09.lesson06.teach.turn07:
    title: 胡马雍确认星期一
    gloss: 胡马雍说没问题，星期一见巴希尔。
    note: مشکل نیست（没问题）化解了时间上的冲突，然后再确认原定的星期一。
