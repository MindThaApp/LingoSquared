  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: 我的钱包又小又黑
    gloss: 我的钱包又小又黑。
    note: و（和）连接两个描述词：کوچک（小）和 سیاه（黑）。
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 复习：什么、非常感谢
    gloss: 什么／非常感谢
    note: چه 和 تشکر زیاد 是对话中用到的复习词。
    target_text: چه（什么）/ تشکر زیاد（非常感谢）
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 复习：是的、不客气
    gloss: 是的／不客气
