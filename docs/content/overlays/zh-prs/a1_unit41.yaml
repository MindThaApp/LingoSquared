teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 复习：这、是
    gloss: 这／是
    note: این 和 است 是前面学过的基础词，用来说明某物是什么。
    target_text: این（这）/ است（是）
  prs.a1.unit41.lesson01.teach.review_have:
    title: 复习：我有
    gloss: 我有
    note: دارم 是复习过的词，用来说你拥有或带着什么东西。
    target_text: دارم（我有）
  prs.a1.unit41.lesson01.teach.bag_word:
    title: 包
    gloss: 包
    note: خریطه 是达里语中表示“包”的标准词。
    example_gloss: 我有一个包。
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: 钱包
    gloss: 钱包
    note: کیف پول 意为“钱包”，字面由 کیف（包、袋）和 پول（钱）组成。
    example_gloss: 我有一个钱包。
  prs.a1.unit41.lesson01.teach.key_word:
    title: 钥匙
    gloss: 钥匙
    note: کلید 意为“钥匙”。
    example_gloss: 我有一把钥匙。
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: 眼镜
    gloss: 眼镜
    note: عینک 意为“眼镜”。
    example_gloss: 我有眼镜。
  prs.a1.unit41.lesson01.teach.lost_word:
    title: 丢了
    gloss: 丢了
    note: گم شده 由 گم（丢失）和 شده（变成了）组成，是表达“东西丢了”的标准说法，结构与第40单元的 زخمی است（受伤了）相同。
    example_gloss: 我的包丢了。
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: 我的钱包丢了！
    gloss: 我的钱包丢了！
    note: کیف پولم 是 کیف پول 加上表示“我的”的后缀 -م，结构与前面学过的 خانه‌ام（我的家）相同。
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 复习：您能否、我、帮助、请做（礼貌祈使）
    gloss: 您能否／我／帮助／请做
    note: می‌توانین、مه ره、کمک 和 کنین 组合起来，可以用来请求帮助。
    target_text: می‌توانین（您能）/ مه ره（我）/ کمک（帮助）/ کنین（做——礼貌命令式）
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 复习：（宾语标记）
    gloss: (宾语标记)
    note: را 标记动作所作用的对象，这里指被看见的东西。
    target_text: را（宾语标记）
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: 您看见了吗？
    gloss: 您看见了吗
    note: دیدین 是 دیدن（看见）的礼貌second人称复数过去式形式，在第2单元的 از دیدن شما خوشحال شدم 中已经接触过。
    example_gloss: 您看见我的包了吗？
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: 您看见我的包了吗？
    gloss: 您看见我的包了吗？
    note: 把 خریطه‌ام（我的包）与 را 和 دیدین 结合起来，用来询问对方有没有注意到它。
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: 找到了／已被找到
    gloss: 找到了／已被找到
    note: پیدا شده 由 پیدا（找到、出现）和 شده（变成了）组成，是询问东西是否已经找到的标准说法。
    example_gloss: 我的钥匙找到了。
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: 我的钥匙找到了吗？
    gloss: 我的钥匙找到了吗？
    note: کلیدم 是 کلید 加上表示“我的”的后缀 -م（我的钥匙）。
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 复习：颜色、黑色、白色、和
    gloss: 颜色／黑色／白色／和
    note: رنگ、سیاه、سفید 和 و 用来描述物品的颜色。
    target_text: رنگ（颜色）/ سیاه（黑色）/ سفید（白色）/ و（和）
  prs.a1.unit41.lesson03.teach.review_size:
    title: 复习：大、小
