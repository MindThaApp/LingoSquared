    gloss: 胡马雍：我步行去，很近。你怎么去？
    note: نزدیک 的意思是近，是这句中的新词。
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 扎米娜：我坐出租车去，直达又快
    gloss: 扎米娜：我坐出租车去，直达又快。
    note: تیز 的意思是快，是这句中的新词。
  prs.a1.unit24.lesson04.teach.dialogue_line4:
