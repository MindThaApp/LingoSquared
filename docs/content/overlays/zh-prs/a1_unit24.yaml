  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 扎米娜：是啊，不过出租车更快
    gloss: 扎米娜：是啊，不过出租车更快。
    note: اما 的意思是“但是”；تیزتر 是比较级“更快”。
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: 通勤阅读
    gloss: 扎米娜每天坐出租车去城里。出租车很快，但不便宜。胡马雍走路去，因为他家很近。他在为买车存钱。
    note: 一篇简短的阅读短文，复习本单元的词汇和连词“چون”（因为）。
