course:
  title: 达里语 A1
  description: 初级喀布尔达里语：外貌词汇（高、矮、头发、眼睛、胡子、眼镜），用 قیافه‌اش چطور است؟询问某人长什么样，头发和眼睛的颜色（رنگ مو/رنگ چشم），以及扎尔米娜与胡马云通过外貌认人的对话。
units:
  prs.a1.unit27.appearance:
    title: 外貌
    description: 描述一个人的基本外貌，并询问某人长什么样。
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: 外貌词汇
  prs.a1.unit27.lesson02.appearance_question:
    title: 询问外貌
  prs.a1.unit27.lesson03.hair_eye_color:
    title: 头发和眼睛的颜色
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: 外貌对话
  prs.a1.unit27.lesson05.reading_appearance:
    title: 外貌阅读
  prs.a1.unit27.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: 高
    gloss: 高的
    note: قد بلند 字面意思是“高的身高”，由 قد（身高）+ بلند（高）构成。
    example_gloss: 他/她个子高。
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: 矮
    gloss: 矮的
    note: قد کوتاه 字面意思是“矮的身高”，由 قد（身高，复习）+ کوتاه（矮）构成。
    example_gloss: 他/她个子矮。
  prs.a1.unit27.lesson01.teach.hair_word:
    title: 头发
    gloss: 头发
    note: مو 意为头发；موی 是同一个词的连接形式，用在另一个词之前（如 موی سیاه，“黑头发”）。
    example_gloss: 他/她的头发是黑色的。
  prs.a1.unit27.lesson01.teach.eye_word:
    title: 眼睛
    gloss: 眼睛
    note: چشم 意为眼睛（描述眼睛颜色时用单数，这是日常自然的说法）。
    example_gloss: 他/她的眼睛是黑色的。
  prs.a1.unit27.lesson01.teach.beard_word:
    title: 胡子
    gloss: 胡子
    note: ریش 意为胡子。
    example_gloss: 他/她有胡子。
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: 眼镜
    gloss: 眼镜
    note: عینک 意为眼镜。
    example_gloss: 他/她戴眼镜。
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: 是／有（第三人称）
    gloss: 是／有（第三人称）
    note: است（是）和 دارد（有，第三人称）都是前面学过的内容，本单元用它们来描述某人的外貌。
    target_text: است（是）/ دارد（有，第三人称）
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: 外貌／长相
    gloss: 外貌／长相
    note: قیافه 指一个人的长相或外貌（如 خوش قیافه，“长得好看”）。
    example_gloss: 他/她长得好看。
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: 怎么样
    gloss: 怎么样
    note: چطور 意为“怎么样”（前面已在 چطور استین؟ 等问候语中学过）。
    target_text: چطور（怎么样）
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: 他/她的长相
    gloss: 他/她的外貌
    note: قیافه‌اش 由 قیافه（长相）加所有格后缀 ‌اش（“他/她的”）构成。
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: 他/她长什么样？
    gloss: 他/她长什么样？
    note: قیافه‌اش چطور است؟ 是询问某人长什么样的自然说法；不能只说 چطور است؟，因为单独这样说是“他/她好吗？”（问候健康状况）。
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: 他/她个子高
    gloss: 他/她个子高。
    note: 把 او（他/她，复习）与本单元的 قد بلند است 结合起来。
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: 他/她有黑头发
    gloss: 他/她有黑头发。
    note: 把 موی（头发）、سیاه（黑色）和 دارد（有）结合起来。
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: 他/她有胡子
    gloss: 他/她有胡子。
    note: 使用 ریش دارد，与上面“黑头发”的“有”句型相同。
  prs.a1.unit27.lesson03.teach.review_rang:
    title: 颜色
    gloss: 颜色
    note: رنگ 意为颜色（前面第21单元的服装部分已学过）。
    target_text: رنگ（颜色）
  prs.a1.unit27.lesson03.teach.blue_word:
    title: 蓝色
    gloss: 蓝色的
    note: آبی 意为蓝色。
    example_gloss: 他/她的眼睛是蓝色的。
  prs.a1.unit27.lesson03.teach.brown_word:
    title: 棕色
    gloss: 棕色的
    note: قهوه‌ای 意为棕色（可用于头发或眼睛的颜色）。
    example_gloss: 他/她的头发是棕色的。
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: 眼睛颜色
    gloss: 眼睛的颜色
    note: رنگ چشم 字面意思是“眼睛的颜色”，由 رنگ（颜色）+ چشم（眼睛）构成。
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: 头发颜色
    gloss: 头发的颜色
    note: رنگ مو 字面意思是“头发的颜色”，由 رنگ（颜色）+ مو（头发）构成。
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: 他/她的眼睛是蓝色的
    gloss: 他/她的眼睛是蓝色的。
    note: 把本课的 آبی 用在 چشم 上。
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: 他/她的头发是棕色的
    gloss: 他/她的头发是棕色的。
    note: 把本课的 قهوه‌ای 用在 موی 上。
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: 兄弟／你的兄弟
    gloss: 哥哥／弟弟／你的哥哥／弟弟（非正式）
    note: برادر（兄弟）是第3单元学过的内容；برادرت 加上了非正式的所有格后缀 ‌ت（“你的”），与前面学过的 تو 非正式用法一致。
    target_text: برادر（兄弟）/ برادرت（你的兄弟，非正式）
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: 是的／谢谢／也
    gloss: 是／谢谢／也
    note: بلی（是）、تشکر（谢谢）和 هم（也）都是前面学过的内容。
    target_text: بلی（是的）/ تشکر（谢谢）/ هم（也）
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 胡马云：扎尔米娜，你哥哥长什么样？
    gloss: 胡马云：扎尔米娜，你哥哥长什么样？
    note: 朋友之间的非正式提问，在 برادر 后使用 ‌ت 所有格。
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 扎尔米娜：他个子高，有黑头发。
    gloss: 扎尔米娜：他个子高，有黑头发。
    note: 用 و（和）连接两个特征。
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 胡马云：他有胡子吗？
    gloss: 胡马云：他有胡子吗？
    note: 只需在 ریش دارد 上用升调，就构成了是非疑问句。
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 扎尔米娜：有，他有胡子，还戴眼镜。
    gloss: 扎尔米娜：有，他有胡子，还戴眼镜。
    note: 把 هم（也）用在第二个特征上。
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 胡马云：好的，谢谢。
    gloss: 胡马云：好的，谢谢。
    note: خوب（好）是一个新的简单结束语；تشکر（谢谢）是复习内容。
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: 外貌阅读
    gloss: 卡里姆个子高。他有黑头发和棕色眼睛。他没有胡子，但戴眼镜。
    note: 一段简短的阅读短文，复习本单元的外貌词汇，引入人物名字 کریم（卡里姆，沿用比较单元中已出现的人物）和 ندارد（没有，دارد 的第三人称否定形式）。
  prs.a1.unit27.lesson06.teach.review_ama:
    title: 但是
    gloss: 但是
    note: اما 意为“但是”（本单元第5课的阅读短文中出现过，之前的单元也学过）。
    target_text: اما（但是）
  prs.a1.unit27.lesson06.teach.review_astam:
    title: 我是／我有
    gloss: 我是／我有
    note: استم（我是）和 دارم（我有）都是前面学过的内容，这里用于第一人称的外貌描述。
    target_text: استم（我是）/ دارم（我有）
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: 我个子矮，但是有黑头发
    gloss: 我个子矮，但是有黑头发。
    note: 用 اما 连接两个外貌信息。
