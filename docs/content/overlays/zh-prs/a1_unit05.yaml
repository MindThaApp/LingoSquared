course:
  title: 达里语 A1
  description: 达里语（阿富汗）入门：说出城市中常见的地点，询问某处在哪里，简单回答位置，并听懂前往某地的基本指路。
units:
  prs.a1.unit05.places:
    title: 城市中的重要地点
lessons:
  prs.a1.unit05.lesson01.everyday_places:
    title: 城市中的日常地点
  prs.a1.unit05.lesson02.civic_and_travel_places:
    title: 公共与出行场所
  prs.a1.unit05.lesson03.asking_where:
    title: 询问某处在哪里
  prs.a1.unit05.lesson04.simple_location_answers:
    title: 近、远、这里和那里
  prs.a1.unit05.lesson05.prepositions_of_place:
    title: 方位介词
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: 在街区里找药店
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: 市场
    gloss: 市场／巴扎
    note: بازار 是指市场区域的日常用词，常常是一整条街或一整片商铺区。
    example_gloss: 巴扎很近。
  prs.a1.unit05.lesson01.teach.bank:
    title: 银行
    gloss: 银行
    note: بانک 是直接借用外来词，与汉语“银行”所指相同；读音是借自外语的音译词。
    example_gloss: 银行在哪里？
  prs.a1.unit05.lesson01.teach.mosque:
    title: 清真寺
    gloss: 清真寺
    note: مسجد 是“清真寺”的标准说法。
    example_gloss: 清真寺很大。
  prs.a1.unit05.lesson01.teach.hospital:
    title: 医院
    gloss: 医院
    note: شفاخانه 是阿富汗达里语中“医院”的日常说法，不同于伊朗波斯语的 بیمارستان；达里语使用者可能听得懂，但自己通常不会这样说。
    example_gloss: 医院很远。
  prs.a1.unit05.lesson01.teach.school:
    title: 学校
    gloss: 学校
    note: مکتب 是阿富汗达里语中“学校”的日常说法，不同于伊朗波斯语的 مدرسه；在达里语中，后者通常特指宗教学校。
    example_gloss: 学校在房子附近。
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: 药店
    gloss: 药店
    note: دواخانه 是阿富汗达里语中“药店”的日常说法（来自 دوا，意为“药”），不同于伊朗波斯语的 داروخانه。
    example_gloss: 药店在哪里？
  prs.a1.unit05.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是常用的连接词，用来把几个地点连在一起。
    target_text: و（和）
  prs.a1.unit05.lesson02.teach.post_office:
    title: 邮局
    gloss: 邮局
    note: پوسته خانه 由 پوسته（邮政／邮件）和 خانه（房子／建筑）组合而成。
    example_gloss: 邮局关门了。
  prs.a1.unit05.lesson02.teach.embassy:
    title: 大使馆
    gloss: 大使馆
    note: سفارت 是“大使馆”的标准说法。
    example_gloss: 大使馆在喀布尔。
  prs.a1.unit05.lesson02.teach.airport:
    title: 机场
    gloss: 机场
    note: میدان هوایی 是阿富汗达里语中“机场”的日常说法（字面意思是“空中场地”），不同于伊朗波斯语的 فرودگاه。
    example_gloss: 机场很远。
  prs.a1.unit05.lesson02.teach.office_review:
    title: 办公室（复习）
    gloss: 办公室
    note: دفتر 在前面的单元已经学过，这里与其他公共场所一起再次出现。
    example_gloss: 我的办公室很近。
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: 询问市场在哪里
    gloss: 市场在哪里？
    note: بازار کجاست؟ 是询问任何地点在哪里的基本句型。
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: 询问医院在哪里
    gloss: 医院在哪里？
    note: 任何表示地点的名词都可以用同样的 کجاست 句型。
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: 礼貌地引起别人的注意
    gloss: 打扰一下，请问药店在哪里？
    note: ببخشین 用来礼貌地向陌生人开口提问，作用相当于汉语的“打扰一下”“请问”。
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: کجاست 的构成
    gloss: کجاست 由 کجا（哪里）加 است（是、在）连写缩合而成。
    note: 了解这种拆分方式，有助于看出其中的规律，而不是把 کجاست 当作一个无法分析的整体死记。
  prs.a1.unit05.lesson04.teach.near:
    title: 近
    gloss: 附近
    note: نزدیک 表示离得近。
    example_gloss: 银行很近。
  prs.a1.unit05.lesson04.teach.far:
    title: 远
    gloss: 远
    note: دور 表示有一段距离。
    example_gloss: 医院很远。
  prs.a1.unit05.lesson04.teach.here:
    title: 这里
    gloss: 这里
    note: این‌جا 指说话人目前所在的地方。
    example_gloss: 银行在这里。
  prs.a1.unit05.lesson04.teach.there:
    title: 那里
    gloss: 那里
    note: آن‌جا 指离说话人较远的地方。
    example_gloss: 药房在那里。
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: 说市场很近
    gloss: 市场很近。
    note: بازار نزدیک است 用的是本课程中一直出现的系动词 است。
  prs.a1.unit05.lesson04.teach.airport_far:
    title: 说机场很远
    gloss: 机场很远。
    note: میدان هوایی دور است 的句型相同，只是用 دور 代替了 نزدیک。
  prs.a1.unit05.lesson05.teach.next_to:
    title: 在旁边
    gloss: 在……旁边
    note: در کنار 字面意思是“在……旁边”。
  prs.a1.unit05.lesson05.teach.behind:
    title: 后面
    gloss: 在……后面
    note: پشت 表示某处位于另一个地方的后面。
    example_gloss: 药房在学校后面。
  prs.a1.unit05.lesson05.teach.opposite:
    title: 对面
    gloss: 在……对面
    note: مقابل 表示某处正对着另一个地方。
    example_gloss: 银行在清真寺对面。
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: 以清真寺为参照说明医院的位置
    gloss: 医院在清真寺旁边。
    note: شفاخانه در کنار مسجد است 由地点名词、表示位置的 در کنار 和系动词 است 组成。
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: 非常感谢
    gloss: 非常感谢。
    note: تشکر زیاد 加强了前面已学的日常用语 تشکر 的语气。
  prs.a1.unit05.lesson06.teach.turn01:
    title: 扎尔米娜询问药房在哪里
    gloss: 扎尔米娜礼貌地向路人询问药房在哪里。
    note: ببخشین 恭敬地引出问题，适合对陌生人使用。
  prs.a1.unit05.lesson06.teach.turn02:
    title: 路人指路
    gloss: 路人说药房不远，让她一直往前走，药房就在学校旁边。
    note: 这句话综合了本单元的几个句型：دور نیست（دور 的否定）、مستقیم بروین 和 در کنار。
  prs.a1.unit05.lesson06.teach.turn03:
    title: 扎尔米娜向路人道谢
    gloss: 扎尔米娜非常感谢他。
    note: تشکر زیاد 礼貌地结束这次对话。
  prs.a1.unit05.lesson06.teach.turn04:
    title: 路人谦虚的回答
    gloss: 不客气／没什么。
    note: قابلی نداره 是阿富汗达里语日常中常用的谦虚回应，用来回应别人的感谢，作用与 خواهش می‌کنم 相近，但更随意。نداره 是 ندارد 的口语形式：口语中会听到 نداره，而规范书面语用 ندارد。
