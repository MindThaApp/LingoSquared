  prs.a1.unit40.lesson03.describing_the_emergency:
    title: 受伤和流血
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: 紧急情况对话
  prs.a1.unit40.lesson05.emergency_reading:
    title: 阅读：紧急求助
  prs.a1.unit40.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 复习：帮助、我想要
    gloss: 帮助／我想要
    note: کمک 和 می‌خواهم 是复习过的词，本单元用它们来说明需要哪种帮助。
    target_text: کمک（帮助）/ می‌خواهم（我想要）
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 复习：这、是
    gloss: 这／是
    note: این 和 است 是前面学过的词，用来说明这是什么情况。
    target_text: این（这）/ است（是）
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: 紧急情况
    gloss: 紧急情况
    note: اضطراری 的意思是紧急的、紧急情况。
    example_gloss: 这是紧急情况。
  prs.a1.unit40.lesson01.teach.police_word:
    title: 警察
    gloss: 警察
    note: پولیس 是阿富汗达里语中表示“警察”的标准说法（来自外来词）。
    example_gloss: 我需要警察。
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: 救护车
    gloss: 救护车
    note: امبولانس 的意思是救护车。
    example_gloss: 我需要救护车。
  prs.a1.unit40.lesson01.teach.fire_word:
    title: 火
    gloss: 火
    note: آتش 的意思是火。
    example_gloss: 着火了。
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: 消防队
    gloss: 消防队
    note: اطفائیه 是喀布尔日常对消防队的说法。
    example_gloss: 我需要消防队。
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: 这是紧急情况！我需要警察！
    gloss: 这是紧急情况！我需要警察！
    note: این اضطراری است 由 این（这）、اضطراری（紧急情况）和 است（是）组成。
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 复习：您能……吗、请做、给／为、快
    gloss: 您能……吗／请做／给／快
    note: می‌توانین、کنین、به 和 زود（前面单元学过）可以和其他词组合，构成礼貌的请求和指令。
    target_text: می‌توانین（您能……吗）/ کنین（做——礼貌祈使）/ به（给／为）/ زود（快）
  prs.a1.unit40.lesson02.teach.mera_word:
    title: 我（宾语）
    gloss: 我（宾语）
    note: مه ره 是喀布尔达里语口语，相当于 مرا（作宾语的“我”）：مه 是 من 的口语形式，ره 是宾语标记 را 的口语形式。书面中通常写作 مرا，也可接受。
    example_gloss: 你能帮我吗？
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: 你能帮我吗?
    gloss: 你能帮我吗?
    note: 这是一句真实常用的达里语，用来直接请求帮助。
  prs.a1.unit40.lesson02.teach.call_word:
    title: 请打电话！（祈使）
    gloss: 打电话
    note: زنگ بزنین 是 زنگ زدن（打电话）的礼貌祈使形式，以前面学过的 زنگ می‌زنم（我打电话）为基础。
    example_gloss: 请给警察打电话！
  prs.a1.unit40.lesson02.teach.come_word:
    title: 请来！（祈使）
    gloss: 来
    note: بیایین 是 آمدن（来）的礼貌祈使形式。
    example_gloss: 请快来！
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: 请叫救护车！
    gloss: 请叫救护车！
    note: به（给／向）加 امبولانس（救护车），再加祈使形式 زنگ بزنین。
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 复习：他/她、他/她有
    gloss: 他/她／他/她有
    note: او 和 دارد 是复习过的形式，用来描述紧急情况中别人的状况。
    target_text: او（他／她）/ دارد（他／她有）
  prs.a1.unit40.lesson03.teach.injured_word:
    title: 受伤的
    gloss: 受伤的
    note: زخمی 的意思是受伤的。
    example_gloss: 他/她受伤了。
  prs.a1.unit40.lesson03.teach.bleeding_word:
