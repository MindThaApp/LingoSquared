course:
  title: 达里语 A1
  description: 喀布尔达里语入门：识别基本的紧急情况，求助，说明需要警察、救护车还是消防队，描述受伤情况，并阅读一段与紧急情况相关的短文。
units:
  prs.a1.unit40.emergencies:
    title: 紧急情况
    description: 识别基本的紧急情况，开口求助，并说明需要哪种帮助（警察、救护车或消防队）。
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: 紧急求助
  prs.a1.unit40.lesson02.asking_for_help:
