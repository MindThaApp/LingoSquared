    example_gloss: 他/她在流血。
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: 他/她受伤了！我需要救护车！
    gloss: 他/她受伤了！我需要救护车！
    note: 把 زخمی 与前面学过的 امبولانس می‌خواهم 结合在一起。
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: 他/她在流血！请快来！
    gloss: 他/她在流血！请快来！
    note: 把 خون‌ریزی 与前面学过的 زود بیایین 结合在一起。
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 复习：什么、他/她来、我打电话、非常感谢
    gloss: 什么／他/她来／我打电话／非常感谢
    note: چه、می‌آید、زنگ می‌زنم 和 تشکر زیاد 是复习过的词，用在紧急情况对话中。
    target_text: چه（什么）/ می‌آید（他／她来）/ زنگ می‌زنم（我打电话）/ تشکر زیاد（多谢）
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 胡马云：扎米娜，帮帮忙！救命！
    gloss: 扎米娜，帮帮忙！救命！
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 扎米娜：怎么了？
    gloss: 怎么了？
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 胡马云：他/她受伤了！他/她在流血！
    gloss: 他/她受伤了！他/她在流血！
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 扎米娜：我需要救护车。我这就打电话！
    gloss: 我需要救护车。我这就打电话！
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 胡马云：非常感谢！
    gloss: 非常感谢！
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 扎米娜：救护车很快就到。
    gloss: 救护车很快就到。
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 复习：一、人、城市、他/她做、在
    gloss: 一／人／城市／他/她做／在
    note: یک、نفر、شهر、می‌کند 和 در 是复习过的词，用在这篇短文中。
    target_text: یک（一）/ نفر（人）/ شهر（城市）/ می‌کند（他／她做）/ در（在）
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: 阅读：紧急情况
    gloss: 城里有一个人受伤了。他/她在流血。胡马云在帮忙。救护车来了。
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 复习：电话、我没有、但是、您（正式）
    gloss: 电话／我没有／但是／您（正式）
    note: تلفن、ندارم、اما 和 شما 是复习过的词，用来表达需求与限制之间的转折，并提出正式的问句。
    target_text: تلفن（电话）/ ندارم（我没有）/ اما（但是）/ شما（您，正式）
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: 我需要帮助，但是我没有电话
