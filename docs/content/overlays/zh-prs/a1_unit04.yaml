course:
  title: 达里语 A1
  description: 阿富汗达利语入门：从一数到一百，询问和表达年龄，交换电话号码。
units:
  prs.a1.unit04.numbers:
    title: 数数和数字
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: 从一数到十
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: 从十一数到二十
  prs.a1.unit04.lesson03.tens:
    title: 整十数，直到一百
  prs.a1.unit04.lesson04.asking_age:
    title: 询问和说出年龄
  prs.a1.unit04.lesson05.phone_numbers:
    title: 交换电话号码
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: 两个朋友比较年龄和电话号码
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: 一、二、三
    gloss: 1, 2, 3
    note: یک، دو، سه 是波斯语系的基本数字，达利语和伊朗波斯语通用。
    example_gloss:
    - 我有一个兄弟。
    - 我有两本书。
    - 我有三个姐妹。
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: 四、五、六
    gloss: 4, 5, 6
    note: چهار 是标准书面形式；有些人在日常口语中会简化为 چار，但本课程使用标准拼写。
    example_gloss:
    - 我有四本书。
    - 请等五分钟。
    - 他/她有六本书。
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: 七、八
    gloss: 7, 8
    note: هفت، هشت 接着往下数。
    example_gloss:
    - 一周有七天。
    - 我八点来。
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: 九、十
    gloss: 9, 10
    note: نه، ده 补全了一到十的数字。
    example_gloss:
    - 班里有九个人。
    - 我有十根手指。
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: 十一、十二、十三
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده 是各自独立的词，不是由个位数简单组合而成的。
    example_gloss:
    - 我十一点有课。
    - 一年有十二个月。
    - 他/她十三岁。
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: 十四、十五、十六
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده 接着数十几。
    example_gloss:
    - 我十四天后来。
    - 他/她有十五本书。
    - 他/她十六岁。
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: 十七、十八、十九
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده 补全了十几的数字。
    example_gloss:
    - 他/她有十七本书。
    - 他/她十八岁。
    - 还剩十九天。
  prs.a1.unit04.lesson02.teach.twenty:
    title: 二十
    gloss: '20'
    note: بیست 是整十数的开头，下一课会详细讲解。
    example_gloss: 我有二十本书。
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: 二十、三十、四十
    gloss: 20, 30, 40
    note: بیست، سی، چهل 是表示整十数的词，每个都是独立的形式，没有可预测的规律。
    example_gloss:
    - 我二十岁。
    - 这个月有三十天。
    - 他/她四十岁。
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: 五十、六十
    gloss: 50, 60
    note: پنجاه، شصت 接着数整十数。
    example_gloss:
    - 他/她有五十本书。
    - 六十分钟是一小时。
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: 七十、八十
    gloss: 70, 80
    note: هفتاد، هشتاد 接着数整十数。
    example_gloss:
    - 这本书有七十页。
    - 他/她有八十本书。
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: 九十、一百
    gloss: 90, 100
    note: نود، صد 补全了直到一百的数字。
    example_gloss:
    - 他/她九十岁。
    - 他/她有一百本书。
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: 组合十位数和个位数
    gloss: 25 字面上是“二十和五”。
    note: 十位数词和个位数词用 و（和）连接，本课程其他地方也用这个连接词，例如 بیست و پنج（25）。
  prs.a1.unit04.lesson04.teach.chand:
    title: 多少
    gloss: 多少
    note: چند 用来引出询问数量的问句，包括询问年龄。
    example_gloss: 你多大了？
  prs.a1.unit04.lesson04.teach.sal_word:
    title: 年
    gloss: 年
    note: 说年龄时用 سال，字面意思是“年”。
    example_gloss: 我二十岁。
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: 礼貌地询问年龄
    gloss: 你多大了？
    note: چند ساله استین؟ 字面意思是“你几岁”，用的是 استین 这种尊敬形式，适合不太熟的人。
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: 询问亲密朋友的年龄
    gloss: 你多大了？
    note: چند ساله استی؟ 用的是非正式的 استی，只适合亲密的朋友或同辈，与本课程其他地方的语体规则一致。
  prs.a1.unit04.lesson04.teach.age_answer:
    title: 说出你的年龄
    gloss: 我25岁。
    note: بیست و پنج ساله استم 由数字、ساله（……岁）和 استم 组合而成。
  prs.a1.unit04.lesson05.teach.number_word:
    title: 数字；号码
    gloss: 号码
    note: نمبر 是阿富汗日常广泛使用的词（源自波斯语/英语），表示号码，尤其指电话号码。
    example_gloss: 这是我的电话号码。
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: 电话
    gloss: 电话
    note: تلفن 是表示电话的标准词。
    example_gloss: 我的手机坏了。
  prs.a1.unit04.lesson05.teach.phone_question:
    title: 询问电话号码
    gloss: 你的电话号码是多少？
    note: نمبر تلفن‌تان چند است؟ 使用了与询问年龄相同的 چند 句型，这里用来问电话号码。
  prs.a1.unit04.lesson05.teach.zero_word:
    title: 零
    gloss: 零
    note: 读阿富汗的大多数电话号码都需要用到 صفر。
    example_gloss: 零是一个数字。
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: 告诉对方你的电话号码
    gloss: 我的电话号码是079-345-678。
    note: 阿富汗的电话号码通常分成几小组来读，而不是逐位数字读出，如本例所示。
  prs.a1.unit04.lesson06.teach.turn01:
    title: 胡马云向巴希尔问好
    gloss: 胡马云问巴希尔过得怎么样，用的是适合亲密朋友的非正式语体。
    note: جور استی؟ 表明两人已经是亲密的朋友，所以整段对话都使用非正式语体。
  prs.a1.unit04.lesson06.teach.turn02:
    title: 巴希尔回答并问胡马云的年龄
    gloss: 巴希尔说他很好，并问胡马云多大了。
    note: چند ساله استی؟ 使用非正式语体，与两人的友谊相符。
  prs.a1.unit04.lesson06.teach.turn03:
    title: 胡马云回答并反问
    gloss: 胡马云说他28岁，并用同样的问题问巴希尔。
    note: 这里直接沿用了第四课的年龄回答句型。
  prs.a1.unit04.lesson06.teach.turn04:
    title: 巴希尔回答
    gloss: 巴希尔说他26岁。
    note: 年龄的问答到此完成。
  prs.a1.unit04.lesson06.teach.turn05:
    title: 胡马云问巴希尔的电话号码
    gloss: 胡马云问巴希尔的电话号码。
    note: تلفنت 使用非正式的所有格词尾，与这段对话其余部分的语体一致。
  prs.a1.unit04.lesson06.teach.turn06:
    title: 巴希尔告诉对方他的电话号码
    gloss: 巴希尔把他的电话号码分成几小组读出来。
    note: 号码的读法和第五课的例子一样，按自然的分组方式读出。
  prs.a1.unit04.lesson06.teach.turn07:
    title: 胡马云确认已经保存
    gloss: 胡马云道谢，并说他马上就保存。
    note: سیف می‌کنم（源自英语 save）是阿富汗常见的非正式科技类外来词，适合朋友之间的随意交谈。
