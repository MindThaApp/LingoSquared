    example_gloss: 我喜欢文学。
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: 我的专业是医学
    gloss: 我的专业是医学。
    note: 由 رشته من（我的专业，复习）和本课新学的 است（是）组合而成。
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: 我学医
    gloss: 我学医。
    note: 把 من ... می‌خوانم（我学习，复习）直接用于专业名称，例如 طب。
  prs.a1.unit31.lesson03.teach.review_koja:
    title: 哪里
    gloss: 哪里
    note: کجا 的意思是哪里。
    target_text: کجا（哪里）
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: 您学习（正式）
    gloss: 您学习（正式）
    note: درس می‌خوانین 是正式的“您学习”，与已学过的 -ین 正式动词形式一致（如第30单元的 استفاده می‌کنین）。
    target_text: درس می‌خوانین（您学习，正式）
  prs.a1.unit31.lesson03.teach.question_where:
    title: 你在哪里学习？
    gloss: 你在哪里学习？
    note: 由 شما（您，正式，复习）、کجا（哪里）、درس 和 می‌خوانین 组合而成。
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: 我在喀布尔大学学习
    gloss: 我在喀布尔大学学习。
    note: 由 من در ... درس می‌خوانم（我在……学习，复习）和 پوهنتون کابل（喀布尔大学）组合而成。
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: 他／她学习
    gloss: 他/她学习
    note: درس می‌خواند 是第三人称形式，与已学过的第三人称 -د 动词形式一致（如第30单元的 استفاده می‌کند）。
    target_text: درس می‌خواند（他/她学习，第三人称）
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: 你（非正式）／你学习（非正式）
    gloss: 你（非正式）／你学习（非正式）
    note: تو 和 می‌خوانی 是非正式说法，用于 Karim 和 Parwin 之间。
    target_text: تو（你，非正式）/ می‌خوانی（你学习，非正式）
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: Karim：Parwin，你在哪里学习？
    gloss: Parwin，你在哪里学习？
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: Parwin：我在喀布尔大学学习。我的专业是医学。
    gloss: 我在喀布尔大学学习。我的专业是医学。
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: Karim：医学难吗？
    gloss: 医学难吗？
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 帕尔温：是的，很难，但很有意思。你呢？
    gloss: 是的，很难，但很有意思。你呢？
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 卡里姆：我在学校读书。
    gloss: 我在学校读书。
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 帕尔温：太棒了！
    gloss: 太棒了！
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: 关于教育的阅读
    gloss: 帕尔温在喀布尔大学读书。她的专业是医学。医学很难，但很有意思。卡里姆在学校读书。
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: 我喜欢／时间／我没有
    gloss: 我喜欢 / 时间 / 我没有
    note: دوست دارم（喜欢）、وقت（时间）和 ندارم（我没有）都是在第11、14、26、29、30单元学过的内容，这里是复习。
    target_text: دوست دارم（我喜欢）/ وقت（时间）/ ندارم（我没有）
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: 我喜欢学习，但没有时间
