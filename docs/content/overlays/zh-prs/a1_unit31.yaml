course:
  title: 达里语 A1
  description: 喀布尔达里语入门：教育与学习词汇（大学、学校、专业、大学生、课），说出自己的专业（医学、法律、经济学、文学），询问和回答在哪里学习，以及 Karim 和 Parwin 谈论学习和感受的对话。
units:
