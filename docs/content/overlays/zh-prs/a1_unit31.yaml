  prs.a1.unit31.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: 教育
    gloss: 教育／学业
    note: تحصیل 泛指教育或学业，是本单元的主题词。
    example_gloss: 教育很好。
  prs.a1.unit31.lesson01.teach.university_word:
    title: 大学
    gloss: 大学
    note: پوهنتون 意思是“大学”，是阿富汗的标准说法（如喀布尔大学的名称），与伊朗的 دانشگاه 不同。
    example_gloss: 大学在喀布尔。
  prs.a1.unit31.lesson01.teach.school_word:
    title: 学校
    gloss: 学校
    note: مکتب 意思是“学校”。
    example_gloss: 这所学校很好。
  prs.a1.unit31.lesson01.teach.field_word:
    title: 专业
    gloss: 专业
    note: رشته 指学习领域或大学专业，是波斯语和达里语共用的标准词。
    example_gloss: 我的专业是医学。
  prs.a1.unit31.lesson01.teach.student_word:
    title: 学生
    gloss: 学生
    note: محصل 意思是“大学生”，是阿富汗达里语的标准说法，与伊朗的 دانشجو 不同。
    example_gloss: 他/她是大学生。
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: 课
    gloss: 课
    note: درس 意思是“课”，与 خواندن（读）搭配，构成表示“学习”的动词短语。
    example_gloss: 我每天学习。
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: 学习
    gloss: 课 + 读 → 我学习
    note: درس（课）与 خواندن（读）搭配，构成 درس می‌خوانم（我学习），字面意思是“我读课”，是本课程中全新的“名词＋动词”结构。
    target_text: درس（课）+ خواندن（读）= درس می‌خوانم（我学习）
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: 我在大学学习
    gloss: 我在大学学习。
    note: 由 من（我，复习）、در（在，复习）、پوهنتون 和 درس می‌خوانم 组合而成。
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: 药
    gloss: 药
    note: طب 意思是“医学”，指一个专业领域，是波斯语和达里语共用的标准词。
    example_gloss: 医学很难。
  prs.a1.unit31.lesson02.teach.law_word:
    title: 法律
    gloss: 法律
    note: حقوق 意思是“法律”，指一个专业领域，是波斯语和达里语共用的标准词。
    example_gloss: 法律很有意思。
  prs.a1.unit31.lesson02.teach.economics_word:
    title: 经济学
    gloss: 经济学
    note: اقتصاد 意思是“经济学”，指一个专业领域，是波斯语和达里语共用的标准词。
    example_gloss: 经济学也很难。
  prs.a1.unit31.lesson02.teach.literature_word:
    title: 文学
