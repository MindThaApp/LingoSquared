    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: 可接受的空格写法。
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: 常见的完整回答形式。
    - value: و علیکم السلام
      status: acceptable_with_note
      note: 常见的带空格连词的完整回答形式。
    feedback: وعلیکم سلام 是惯用的回答；含有 السلام 的常见完整形式也正确。
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: 请回应 سلام علیکم。
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: 能听懂，但不如完整回答那样回应对方。
    feedback: وعلیکم سلام 和 وعلیکم السلام 都是惯用的完整回答。
