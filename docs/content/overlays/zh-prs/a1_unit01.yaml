      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م 组成 سلام。
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: 请选出表示“你好”的连写单词。
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام 的意思是“你好”。
    prompt_blocks:
    - 你好
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
