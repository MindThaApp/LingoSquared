    correct_option: 你好（愿你平安）
    distractors:
    - 再见
    - 欢迎
    - 谢谢
    accepted_answers:
    - value: 你好（愿你平安）
      status: correct
    feedback: سلام علیکم 的意思是“你好”（字面意思是“愿你平安”）。
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 翻译成达里语（阿富汗）：“也愿你平安”（对 سلام علیکم 的惯用回答）。
