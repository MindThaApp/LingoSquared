    - 谢谢
    - 晚安
    accepted_answers:
    - value: 欢迎
      status: correct
    feedback: خوش آمدین 的意思是“欢迎”。
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 翻译成达里语（阿富汗）：谢谢。
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
      status: acceptable_with_note
      note: 在达里语中能听懂；本课程推荐使用 تشکر。
    - value: ممنونم
      status: acceptable_with_note
      note: 在达里语中能听懂；本课程推荐使用 تشکر。
    feedback: 在本课程中，تشکر 是阿富汗达里语的首选说法。
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
