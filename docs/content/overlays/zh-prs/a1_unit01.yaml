course:
  title: 达里语 A1
  description: 阿富汗达里语入门：学习阅读波斯-阿拉伯文字，听懂日常阿富汗口语，进行较长的问候寒暄，并在喀布尔的职场中得体地完成初次见面。
units:
  prs.a1.unit01.greetings:
    title: 问候与初次见面
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: 认读本单元的字母
  prs.a1.unit01.lesson02.everyday_greetings:
    title: 互相说日常问候语
  prs.a1.unit01.lesson03.time_and_farewells:
    title: 在不同时间问候和道别
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: 礼貌与随意的寒暄
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: 问候家人并礼待客人
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: 在喀布尔职场的第一天
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: 字母 ا、ب、ت 和 د
    gloss: a/ā、b、t 和 d
    note: 达里语从右向左书写。د 不与左边的字母相连。
  prs.a1.unit01.lesson01.teach.re_ze:
    title: 字母 ر 和 ز
    gloss: r 和 z
    note: 这两个字母都不与后面的字母相连。
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: 字母 س、ش 和 ص
    gloss: s、sh 和 s
    note: 在普通达里语中，س 和 ص 都读 s；ش 读 sh。
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: 字母 ج、چ、ح 和 خ
    gloss: j、ch、h 和 kh
    note: چ 读 ch。خ 的音通常转写为 kh。
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: 字母 ع、غ、ف 和 ق
    gloss: ʿ、gh、f 和 q
    note: غ 和 ق 的具体发音因说话人而异；拼写时要把它们区分开。
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: 字母 ک、گ、ل 和 م
    gloss: k、g、l 和 m
    note: ک 是波斯语的 kaf，达里语用它表示 k。ل 和 م 与左右两边的字母都相连。
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: 字母 ن、و、ه 和 ی
    gloss: n、w/v/o/u、h 和 y/长音 i
    note: ی 是波斯语的 yeh，表示 y 和长元音 ee。و 可以是辅音（w/v），也可以是长元音（o/oo）。
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: 认读连写的单词
    gloss: 你好
    note: 这些字母连写成 سلام。短元音通常不写出来。
    example_gloss: 你好！我是卡里姆。
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: 一句尊重对方的日常问候
    gloss: 愿你平安／你好
    note: سلام علیکم 在阿富汗很普遍，熟人之间和需要表示尊重的场合都可以使用。
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: 回应问候
    gloss: 也愿你平安
    note: وعلیکم سلام 是回应 سلام علیکم 的惯用语。含有 السلام 的形式也可以接受。
  prs.a1.unit01.lesson02.teach.salam:
    title: 简短的问候
    gloss: 你好
    note: سلام 是一种更简短、用法灵活的问候语。
    example_gloss: 你好，你好吗？
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: 欢迎
    gloss: 欢迎
    note: خوش آمدین 是尊敬的口语欢迎语，对一个人或多个人都可以说。
  prs.a1.unit01.lesson02.teach.tashakor:
    title: 谢谢
    gloss: 谢谢
    note: 本课程优先使用阿富汗达里语的 تشکر。ممنون 和 ممنونم 是次要的说法，能听懂即可。
    example_gloss: 非常感谢。
  prs.a1.unit01.lesson02.teach.khahesh:
    title: 对感谢的正式回应
    gloss: 不客气
    note: خواهش می‌کنم 是各地波斯语通用的礼貌回应，并不是阿富汗独有的口语说法。
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: 再见
    gloss: 再见
    note: خدا حافظ 是阿富汗达里语常用的告别语，常写成两个词。
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: 早晨的问候
    gloss: 早上好
    note: صبح بخیر 用于早晨。
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: 白天的问候
    gloss: 日安
    note: روز بخیر 是白天使用的礼貌问候语。
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: 傍晚前后的问候
    gloss: 下午好／晚上好
    note: عصر بخیر 适用于一天中较晚的时段。
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: 夜间用语
    gloss: 晚安
    note: شب بخیر 通常用于结束一个夜晚，而不是在白天见面时开场。
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: 白天礼貌的道别
    gloss: 祝您今天愉快
    note: روز خوش 是各地通用、礼貌而略显正式的道别语，并不是独特的阿富汗口语说法。
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: 直到下次见面
    gloss: 希望再见到你
    note: به امید دیدار 是亲切而不失尊重的道别语。
  prs.a1.unit01.lesson04.teach.polite_question:
    title: 礼貌地询问对方近况
    gloss: 您好吗？
    note: استین 是阿富汗达里语常见的礼貌口语形式，与 شما 搭配使用。
  prs.a1.unit01.lesson04.teach.informal_question:
    title: 询问同辈或亲密的朋友
    gloss: 您好吗？
    note: تو 和 استی 是非正式的单数形式；对长辈或新认识的人，不要不假思索地使用这种搭配。
  prs.a1.unit01.lesson04.teach.good_answer:
    title: 说自己很好
    gloss: 我很好，谢谢。
    note: استم 的意思是“我是”。这是本课程通篇使用的阿富汗达里语口语形式。
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: 说自己身体健康或一切都好
    gloss: 我很好。
    note: جور 含有身体安好、健康的意思，在阿富汗的问候中很常见。
  prs.a1.unit01.lesson04.teach.not_bad:
    title: 含蓄的回答
    gloss: 还不错。
    note: بد نیستم 是一种中性的回答。
  prs.a1.unit01.lesson04.teach.and_you:
    title: 把问题回问对方
    gloss: 您呢？
    note: و شما؟ 能让对话既礼貌又简洁。
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: 延伸问候
    gloss: 大家都好吗？
    note: 阿富汗人的问候可以继续下去，在谈正事之前先问候对方的家人。
  prs.a1.unit01.lesson05.teach.family_well:
    title: 问候对方的家人
    gloss: 你的家人都好吗？
    note: 问候家人是阿富汗长问候中常见的一部分。本课程把表示“你们的”的形式写作 فامیل‌تان。
  prs.a1.unit01.lesson05.teach.household_well:
    title: 问候家中的人
    gloss: 家里人都好吗？
    note: اهل خانه 泛指家中的所有成员。
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: 回答对家人的问候
    gloss: 感谢真主，大家都很好。
    note: 这里的 شکر 是表示感恩的简略说法，不是字面上食物“糖”的意思。
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: 礼貌而热情的回应
    gloss: 愿你长寿／谢谢。
    note: زنده باشین 是阿富汗常用的礼貌套话，常用来回应感谢或好意的话。باشین 是对“您”的尊敬口语形式。
  prs.a1.unit01.lesson05.teach.own_home:
    title: 热情欢迎客人
    gloss: 这里就是您自己的家。
    note: خانهٔ خودتان است 让客人放心，表示他们受到欢迎。
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: 请客人坐上座
    gloss: 请上座。
    note: 在待客的房间里，بالا بفرمایین 是请客人坐到远离门口、更尊贵的位置，不一定是指楼上。
  prs.a1.unit01.lesson05.teach.elders_first:
    title: 先问候长辈
    gloss: 我们先向长辈问好。
    note: 先问候长辈表示尊重。是否有身体接触的问候，要看彼此的关系、性别和具体情形；学习者不要想当然地认为可以握手。
  prs.a1.unit01.lesson06.teach.daftar:
    title: 办公室
    gloss: 办公室
    note: دفتر 指办公室或工作的地方。
    example_gloss: 我的办公室在喀布尔。
  prs.a1.unit01.lesson06.teach.kabul:
    title: 喀布尔
    gloss: 喀布尔
    note: کابل 是阿富汗的首都，也是本对话的场景。
    example_gloss: 我住在喀布尔。
  prs.a1.unit01.lesson06.teach.line01:
    title: 哈米德介绍自己是新同事
    gloss: 哈米德说他是新来的同事。
    note: 两位说话人都是成年男同事，在喀布尔的一间办公室里见面。
  prs.a1.unit01.lesson06.teach.line02:
    title: 纳吉卜欢迎他并询问他的名字
    gloss: 纳吉卜欢迎他，并询问他的名字。
    note: خوش آمدین 是达里语口语中表示尊敬的欢迎语，对一个人或几个人都适用。
  prs.a1.unit01.lesson06.teach.line03:
    title: 哈米德说出自己的名字
    gloss: 哈米德说出自己的名字。
    note: نامم حامد است（我叫哈米德）是日常口语形式；نامم 是 نام + -م（我的）。书面中也会见到 نام من حامد است。两种说法都正确。
  prs.a1.unit01.lesson06.teach.line04:
    title: 纳吉布自我介绍，并说很高兴认识对方
    gloss: 纳吉布自我介绍，并说很高兴认识对方。
    note: از آشنایی با شما خوش شدم 明确指“认识”，因此适合初次见面。
  prs.a1.unit01.lesson06.teach.line05:
    title: 哈米德同样表示高兴，并问纳吉布近况
    gloss: 哈米德同样表示高兴，并问纳吉布近况。
    note: 新同事之间的这段对话一直使用表示尊敬的 شما 和 استین。
  prs.a1.unit01.lesson06.teach.line06:
    title: 纳吉布作答
    gloss: 纳吉布说他很好，谢谢。
    note: جور استم، تشکر 回答的是询问近况的问题，本单元前面已学过。
  prs.a1.unit01.lesson06.teach.line07:
    title: 纳吉布问候哈米德的家人
    gloss: 纳吉布问候哈米德的家人。
    note: 询问家人的情况，使问候得以延续，之后他们才转入工作。
  prs.a1.unit01.lesson06.teach.line08:
    title: 哈米德说大家都好
    gloss: 哈米德说大家都好。
    note: شکر، همه جور استند 回答对家人的问候，本单元前面已学过。
  prs.a1.unit01.lesson06.teach.line09:
    title: 纳吉布提出介绍其他同事
    gloss: 纳吉布提出介绍其他同事。
    note: بفرمایین 在这里是请哈米德跟着走，而不是请他坐下或拿东西。
  prs.a1.unit01.lesson06.teach.line10:
    title: 哈米德道谢并表示同意
    gloss: 哈米德道谢并表示同意。
    note: بسیار خوب 在这里作为明确的肯定回答首次出现。
  prs.a1.unit01.lesson06.teach.line11:
    title: 纳吉布热情回应，并指出哈米德的办公桌
    gloss: 纳吉布热情回应，并指出哈米德的办公桌。
    note: 对话以开始一天的工作作结，而不是重复到家拜访时的告别流程。
  prs.a1.unit01.lesson06.teach.line12:
    title: 哈米德向他道谢
    gloss: 哈米德向他道谢。
    note: تشکر 简单地结束了这段交流。
