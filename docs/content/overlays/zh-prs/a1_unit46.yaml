    gloss: 但是／您（正式）／多少
    note: اما、شما 和 چند 是前面单元学过的词，用来说明服药安排。
    target_text: اما（但是）/ شما（您）/ چند（多少）
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 复习：早上、晚上、二、三、片、是、您的处方
    gloss: 早上／晚上／二／三／片／是／您的处方
    note: صبح、شب、دو、سه、دانه、است（来自前面单元和本单元）以及 نسخه‌تان（您的处方，所用的 -تان 后缀与本课程其他地方的 نام‌تان／تلفن‌تان 相同）是用来结束本单元的复习词。
    target_text: صبح（早上）/ شب（晚上）/ دو（二）/ سه（三）/ دانه（粒）/ است（是）/ نسخه‌تان（您的处方）
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: 早上两片，但晚上三片
    gloss: 早上两片，但晚上三片。
    note: اما 用来对比早上和晚上的剂量。
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: 您的处方是几片？
    gloss: 您的处方是几片？
    note: 这是带有 شما 所属后缀 -تان 的正式说法，用来询问处方的剂量。
