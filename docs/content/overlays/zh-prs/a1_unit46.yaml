    title: 复习：这、是、胡马云、从／的
    gloss: 这／是／胡马云／从／的
    note: این、است 和 همایون 是阅读短文中用到的复习词。از（前面学过，通常表示“从”）在这里与 است 连用，表示所属：این نسخه از همایون است 字面是“这处方来自胡马云”，实际意思是“这是胡马云的处方”，与 این کتاب از من است（“这本书是我的”）结构相同。
    target_text: این（这）/ است（是）/ همایون（胡马云）/ از（来自，的）
