course:
  title: 达里语 A1
  description: 喀布尔达里语入门：向药剂师购买常用药，描述简单症状（头疼、肚子疼或牙疼），要药片或糖浆，并听懂基本的用药说明。
units:
  prs.a1.unit46.pharmacy:
    title: 药房与药
    description: 向药剂师购买常用药，描述简单症状，要药片或糖浆，并听懂基本的用药说明。
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: 药房与药剂师
  prs.a1.unit46.lesson02.symptom_vocabulary:
