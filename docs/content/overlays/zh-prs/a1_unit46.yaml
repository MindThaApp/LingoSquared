    note: یک、قرص、روز、سه、دانه 和 بگیرین（来自本单元）是阅读短文中用到的复习词。
    target_text: یک（一）/ قرص（药片）/ روز（天）/ سه（三）/ دانه（粒）/ بگیرین（请服用）
