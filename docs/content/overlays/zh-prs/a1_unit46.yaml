  prs.a1.unit46.lesson03.medicine_forms:
    title: 药片和糖浆
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: 药房对话
  prs.a1.unit46.lesson05.reading:
    title: 看懂处方
  prs.a1.unit46.lesson06.wrap_up:
    title: 小结
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 复习：这、是、在
    gloss: 这 / 是 / 在
    note: این、است 和 در（本课程中经常用到）是复习词，用来谈论药房。
    target_text: این（这）/ است（是）/ در（在）
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: 药店
    gloss: 药店
    note: دواخانه 字面意思是“药之屋”，构词方式与 کتابخانه（“书之屋”，即图书馆，第43单元）相同。
    example_gloss: 这是药店。
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: 这是药房
    gloss: 这是药房。
    note: این دواخانه است 由本课前面学过的词组成。
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: 药剂师
    gloss: 药剂师
    note: دواساز 字面意思是“制药的人”。
    example_gloss: 药剂师在药房里。
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: 药剂师在药房里
    gloss: 药剂师在药房里。
    note: دواساز در دواخانه است 由 دواساز（药剂师）和 دواخانه（药房）组合而成。
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 复习：药、我要
    gloss: 药 / 我想要
    note: دوا 和 می‌خواهم 是复习词，用来要药。
    target_text: دوا（药）/ می‌خواهم（我要）
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: 我要买药
    gloss: 我要买药。
    note: دوا می‌خواهم 由 دوا（药）和 می‌خواهم（我要）组成。
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 复习：头疼、肚子疼、我有、您有
    gloss: 头疼 / 肚子疼 / 我有 / 您有（敬称）
    note: سردرد、دل‌درد、دارم 和 دارین 是复习词，用来描述症状。
    target_text: سردرد（头疼）/ دل‌درد（肚子疼）/ دارم（我有）/ دارین（您有，敬称）
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 复习：很、是的、不
    gloss: 很 / 是的 / 不
    note: بسیار、بلی 和 نخیر（前面单元学过）是复习词，用来回答关于症状的提问。
    target_text: بسیار（很）/ بلی（是的）/ نخیر（不）
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: 牙疼
    gloss: 牙疼
    note: دندان‌درد 由 دندان（牙，第42单元）加上 -درد（“疼”）构成，与已学的 سردرد 和 دل‌درد 构词相同。
    example_gloss: 我牙疼。
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: 我牙很疼
    gloss: 我牙很疼。
    note: بسیار دندان‌درد دارم 用 بسیار（很）来加强症状的程度。
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: 你头疼吗？
    gloss: 你头疼吗？
    note: سردرد دارین؟ 是靠升调构成的是非疑问句，不需要单独的疑问词。
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: 不，我牙疼
    gloss: 不，我牙疼。
    note: نخیر 用来回答前一个问题，并说出真正的症状。
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 复习：我要、一个
    gloss: 我要／一个／一
    note: می‌خواهم 和 یک 是前面单元学过的词，这里用来要某种剂型的药。
    target_text: می‌خواهم（我要）/ یک（一）
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: 药片
    gloss: 药片
    note: قرص 是达利语中表示药片的常用词。
    example_gloss: 我要一片药。
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: 我要一片药
    gloss: 我要一片药。
    note: یک قرص می‌خواهم 由 یک（一）和 قرص（药片）组成。
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: 糖浆
    gloss: 糖浆
    note: شربت 是达利语中表示液体药或糖浆的常用词。
    example_gloss: 我要糖浆。
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: 我要糖浆
    gloss: 我要糖浆。
    note: شربت می‌خواهم 由 شربت（糖浆）和 می‌خواهم（我要）组成。
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 复习：哪一个、药、您要（礼貌）
    gloss: 哪一个／药／您要（礼貌）
    note: کدام、دوا 和 می‌خواهین 是复习词，用来询问顾客想要什么。
    target_text: کدام（哪个）/ دوا（药）/ می‌خواهین（您要，敬称）
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: 您要哪种药？
    gloss: 您要哪种药？
    note: کدام دوا می‌خواهین؟ 是药剂师会用的礼貌问句。
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 复习：你好、肚子疼、我有
    gloss: 你好／肚子疼／我有
    note: سلام、دل‌درد 和 دارم 是前面单元学过的词，这里用来开启对话。
    target_text: سلام（你好）/ دل‌درد（肚子疼）/ دارم（我有）
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 复习：药、您要（礼貌）、是的
    gloss: 药／您要（礼貌）／是的
    note: دوا、می‌خواهین 和 بلی 是前面单元学过的词，用在药剂师的提问中。
    target_text: دوا（药）/ می‌خواهین（您要，敬称）/ بلی（是的）
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 复习：这、药片、好、是
    gloss: 这／药片／好／是
    note: این、قرص、خوب 和 است 是前面单元和本课学过的词，用来描述药。
    target_text: این（这）/ قرص（药片）/ خوب（好）/ است（是）
  prs.a1.unit46.lesson04.teach.piece_word:
    title: 片／粒
    gloss: 片／粒／剂量
