teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: 头疼
    gloss: 头痛
    note: سردرد 由 سر（头）和 درد（疼痛）组成。
    example_gloss: 我头痛。
  prs.a1.unit17.lesson01.teach.fever_word:
    title: 发烧
    gloss: 发烧
    note: تب 的意思是发烧。
    example_gloss: 我发烧了。
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: 肚子痛
    gloss: 肚子痛
    note: دل‌درد 由 دل（口语中指肚子、胃）和 درد（疼痛）组成。
    example_gloss: 我肚子痛。
  prs.a1.unit17.lesson01.teach.have_word:
    title: 我有
    gloss: 我有
    note: دارم 是 داشتن（有）的第一人称现在时形式。
    target_text: دارم（我有）
  prs.a1.unit17.lesson02.teach.sick_word:
    title: 生病
    gloss: 生病的
    note: مریض 的意思是“生病的”。
    example_gloss: 我生病了。
  prs.a1.unit17.lesson02.teach.am_word:
    title: 我是
    gloss: 我是
    note: استم 是第一人称的礼貌系动词形式，与本课程使用的 استم／استین 语体一致。
    target_text: استم（我是）
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: 我的感觉
    gloss: 我的感觉／我的状况
    note: حالم（حال + م）字面意思是“我的状况”；حالم خوب نیست 的意思是“我不舒服”。
    target_text: حالم（我的感觉／我的状况）
  prs.a1.unit17.lesson02.teach.good_word:
    title: 好
    gloss: 好的
    note: خوب 的意思是“好”。
    example_gloss: 我不舒服。
  prs.a1.unit17.lesson02.teach.not_word:
    title: 不是
    gloss: 不是
    note: نیست 是否定的系动词；خوب نیست 的意思是“不好”。
    target_text: نیست（不是）
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: 医生
    gloss: 医生
    note: داکتر 是阿富汗达利语中“医生”的标准拼写和读音（有别于伊朗波斯语的 دکتر）。
    example_gloss: 我要看医生。
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: 药
    gloss: 药
    note: دوا 的意思是“药”。
    example_gloss: 我要药。
  prs.a1.unit17.lesson03.teach.want_word:
    title: 我想要
    gloss: 我想要
    note: می‌خواهم 的意思是“我要”。
    target_text: می‌خواهم（我要）
  prs.a1.unit17.lesson04.teach.rest_word:
    title: 休息
    gloss: 休息
    note: استراحت 是名词“休息”，与 کنین 搭配构成命令式“请休息！”
    example_gloss: 请休息。
  prs.a1.unit17.lesson04.teach.do_word:
    title: 做（礼貌）
    gloss: 做（礼貌命令式）
    note: کنین 是 کردن（做）的礼貌命令式；استراحت کنین 字面意思是“做休息”，即“请休息”。
    target_text: کنین（做——礼貌命令式）
  prs.a1.unit17.lesson04.teach.water_word:
    title: 水
    gloss: 水
    note: آب 的意思是“水”。
    example_gloss: 请多喝水。
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: 很多
    gloss: 很多；非常多
    note: زیاد 的意思是“很多”。
    example_gloss: 请多喝水。
  prs.a1.unit17.lesson04.teach.drink_word:
    title: 喝（礼貌）
    gloss: 喝（礼貌命令式）
    note: بنوشین 是 نوشیدن（喝）的礼貌命令式。
    target_text: بنوشین（喝——礼貌命令式）
  prs.a1.unit17.lesson04.teach.advice_text:
    title: 健康须知
    gloss: 请休息。请多喝水。
    note: 一则简短的便条，给出两条基本的健康建议。
  prs.a1.unit17.lesson05.teach.hello_word:
    title: 你好
    gloss: 你好
    note: سلام 的意思是“你好”。
    example_gloss: 你好。我生病了。
  prs.a1.unit17.lesson05.teach.and_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，用来连接两个事物或两个分句。
    target_text: و（和）
  prs.a1.unit17.lesson05.teach.message_text:
    title: 一条简短的健康消息
    gloss: 你好。我生病了。我头痛，还发烧。
    note: 一条简短的第一人称留言，描述了两种症状。
  prs.a1.unit17.lesson06.teach.names:
    title: 巴希尔和医生
    gloss: 巴希尔，医生
    note: 巴希尔是本课程中反复出现的人物；称呼医生时要加敬称 صاحب。
    example_gloss:
    - 我是巴希尔。
    - 我是医生。
  prs.a1.unit17.lesson06.teach.how_word:
    title: 怎么样
    gloss: 怎么样
    note: چطور 的意思是“怎么样、如何”。
    target_text: چطور（怎么样）
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: 您是（礼貌）
    gloss: 您是
    note: استین 是礼貌的第二人称系动词“是”，与本课程中 استم/استین 的用法一致。
    target_text: استین（您是——礼貌）
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: 道谢
    gloss: 谢谢
    note: تشکر 的意思是“谢谢”。
    example_gloss: 谢谢您，医生。
  prs.a1.unit17.lesson06.teach.sir_word:
    title: 先生
    gloss: 先生
    note: صاحب 是加在姓名或头衔之后的尊敬称呼——داکتر صاحب 意为恭敬地称呼“医生”，是地道的阿富汗用法。
    example_gloss: 谢谢您，医生。
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: 医生向巴希尔问好
    gloss: 你好。您好吗？
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: 巴希尔回答
    gloss: 你好。我生病了。我头痛，还发烧。
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: 医生的建议
    gloss: 请休息。请多喝水。
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: 巴希尔感谢医生
    gloss: 谢谢您，医生。
