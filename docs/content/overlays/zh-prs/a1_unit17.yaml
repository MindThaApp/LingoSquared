course:
  title: 达里语 A1
  description: 喀布尔达利语入门：基本症状（头痛、发烧、肚子痛），说自己不舒服，请求看医生或要药，阅读简短的健康须知和描述症状的短消息，以及与医生的对话。
units:
  prs.a1.unit17.health:
    title: 健康
    description: 能说出基本的健康问题，并听懂简单的应急建议。
