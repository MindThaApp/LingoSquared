teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: 动物
    gloss: 动物
    note: حیوان 的意思是动物，是涵盖宠物和其他动物的通用词。
    example_gloss: 狗是一种动物。
  prs.a1.unit28.lesson01.teach.dog_word:
    title: 狗
    gloss: 狗
    note: سگ 的意思是狗。
    example_gloss: 我有一条狗。
  prs.a1.unit28.lesson01.teach.cat_word:
    title: 猫
    gloss: 猫
    note: پشک 的意思是猫，是阿富汗达里语的日常用词，不同于伊朗波斯语的 گربه。
    example_gloss: 我有一只猫。
  prs.a1.unit28.lesson01.teach.bird_word:
    title: 鸟
    gloss: 鸟
    note: پرنده 的意思是鸟。
    example_gloss: 我有一只鸟。
  prs.a1.unit28.lesson01.teach.fish_word:
    title: 鱼
    gloss: 鱼
    note: ماهی 的意思是鱼。
    example_gloss: 我有一条鱼。
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: 宠物
    gloss: 宠物
    note: حیوان خانگی 字面意思是“家里的动物”——حیوان（动物，复习）+ خانگی（家养的）。
    example_gloss: 狗是我的宠物。
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: 我有／您有（正式）／是
    gloss: 我有／您有（敬称）／是
    note: دارم（我有）、دارین（您有，敬称）和 است（是）都是前面学过的内容，本单元用它们来谈论宠物。
    target_text: دارم（我有）／ دارین（您有，敬称）／ است（是）
  prs.a1.unit28.lesson02.teach.pet_question:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: حیوان خانگی دارین؟ 是询问对方是否养宠物的礼貌、正式的说法。
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: بلی（是，第3单元学过）加上本单元的 سگ دارم。
  prs.a1.unit28.lesson02.teach.no_answer:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: نخیر（正式的“不”，第3单元学过）加上 حیوان خانگی ندارم（我没有宠物）。
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: 是／不／我没有
    gloss: 是／不／我没有
    note: بلی、نخیر 和 ندارم 都是第3单元谈家庭成员时学过的，这里用来谈是否养宠物。
    target_text: بلی（是）／ نخیر（不）／ ندارم（我没有）
  prs.a1.unit28.lesson03.teach.review_rang:
    title: 颜色
    gloss: 颜色
    note: رنگ 的意思是颜色（第21单元服装中学过）。
    target_text: رنگ（颜色）
  prs.a1.unit28.lesson03.teach.black_word:
    title: 黑色
    gloss: 黑色
    note: سیاه 的意思是“黑色”。
    example_gloss: 我的狗是黑色的。
  prs.a1.unit28.lesson03.teach.white_word:
    title: 白色
    gloss: 白色
    note: سفید 的意思是“白色”。
    example_gloss: 我的猫是白色的。
  prs.a1.unit28.lesson03.teach.small_word:
