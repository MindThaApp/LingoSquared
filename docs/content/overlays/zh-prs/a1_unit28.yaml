    note: تو（你，非正式）和 داری（你有，非正式）都是学过的内容，在本课亲近朋友之间的非正式对话中使用。
    target_text: تو（你，非正式）／ داری（你有，非正式）
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: 什么／每天
    gloss: 什么／哪个／每天
    note: چه（什么／哪个，第21单元“什么颜色”中学过）和 هر روز（每天，第24单元学过）一起用来询问宠物的照料。
    target_text: چه（什么／哪个）／ هر روز（每天）
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 胡马雍：扎尔米娜，你有宠物吗？
    gloss: 胡马雍：扎尔米娜，你有宠物吗？
    note: 朋友之间的非正式提问，使用非正式的 داری 形式。
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 扎尔米娜：是的，我有一只猫
    gloss: 扎尔米娜：是的，我有一只猫。
    note: 用 بلی 和 یک پشک دارم 来回答。
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 胡马云：你的猫是什么颜色的？
    gloss: 胡马云：你的猫是什么颜色的？
    note: 使用 چه رنگ（什么颜色），句型与第21单元购物时的提问相同。
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 扎尔米娜：是白色的
    gloss: 扎尔米娜：是白色的。
    note: 简短的回答——只说颜色加 است。问句里已经说明是猫，所以不必再重复 پشک。
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 胡马云：你每天都喂它吗？
    gloss: 胡马云：你每天都喂它吗？
    note: 引入 غذا می‌دهی（你喂食，非正式），由 غذا（食物）+ می‌دهی 构成，是第18单元 می‌دهد 的非正式对应形式。
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 扎尔米娜：是的，我每天都喂它
    gloss: 扎尔米娜：是的，我每天都喂它。
    note: 把 هر روز（每天）用在 می‌دهم（我喂，第一人称）上。
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: 阅读：宠物
    gloss: 扎尔米娜有一只猫。她的猫又白又小。扎尔米娜每天都喂猫。
    note: 一篇简短的阅读短文，复习本单元的宠物词汇，并出现 دارد（有，第三人称，复习第26/27单元）和 می‌دهد（给／喂，第三人称，复习第18单元）。
  prs.a1.unit28.lesson06.teach.review_ama:
    title: 但是
    gloss: 但是
    note: اما 的意思是“但是”（前面的单元已学过）。
    target_text: اما（但是）
  prs.a1.unit28.lesson06.teach.review_astam:
    title: 我是
    gloss: 我是
