    target_text: استم（我是）
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: 我有一条狗，但没有猫
    gloss: 我有一条狗，但没有猫。
    note: 用 اما 把两个关于养宠物的事实连在一起。
