course:
  title: 达里语 A1
  description: 喀布尔达里语入门：动物和宠物词汇（狗、猫、鸟、鱼），用 حیوان خانگی دارین؟ 询问和回答是否养宠物，描述宠物的大小和颜色，以及扎尔米娜与胡马雍关于养猫和喂猫的对话。
units:
  prs.a1.unit28.animals:
    title: 动物
    description: 谈论宠物和常见动物，包括你是否养宠物以及基本的照料。
