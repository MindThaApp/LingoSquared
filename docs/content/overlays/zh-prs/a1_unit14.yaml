course:
  title: 达里语 A1
  description: 喀布尔达里语入门：表达喜好与不喜欢、询问偏好、在选项中做选择、给出简单理由，以及一段关于两个人喜好的简短阅读／对话。
units:
  prs.a1.unit14.preferences:
    title: 偏好
    description: 表达和询问基本的喜好、厌恶以及简单的理由。
lessons:
  prs.a1.unit14.lesson01.basic_likes:
    title: 简单的喜欢与不喜欢
  prs.a1.unit14.lesson02.asking_preferences:
    title: 询问偏好
  prs.a1.unit14.lesson03.choosing_between_options:
    title: 在两样东西之间选择
  prs.a1.unit14.lesson04.giving_reasons:
    title: 说明原因
  prs.a1.unit14.lesson05.reading_about_preferences:
    title: 阅读：偏好
  prs.a1.unit14.lesson06.preferences_dialogue:
    title: 关于偏好的对话
teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: 我喜欢
    gloss: 我喜欢
    note: دوست دارم 字面意思是“我有（对它的）友情”，是表达“我喜欢”的标准说法。
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: 咖啡
    gloss: 咖啡
    note: قهوه 的意思是“咖啡”。
    example_gloss: 我喜欢咖啡。
  prs.a1.unit14.lesson01.teach.chai_word:
    title: 茶
    gloss: 茶
    note: چای 的意思是“茶”。
    example_gloss: 我不喜欢茶。
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: 我不喜欢
    gloss: 我不喜欢
    note: دوست ندارم 是 دوست دارم 的否定形式。
  prs.a1.unit14.lesson01.teach.man_word:
    title: 我
    gloss: 我
    note: من 是独立的第一人称代词。
    example_gloss: 我喜欢咖啡。
  prs.a1.unit14.lesson01.teach.ra_word:
    title: （宾语标记）
    gloss: （标记动词的宾语）
    note: را 标记确指的直接宾语。在达里语中，日常口语和书面语都使用它；不使用伊朗式的 رو。
    target_text: را（宾语标记）
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: 哪个
    gloss: 哪个
    note: کدام 的意思是“哪一个”。
    example_gloss: 你喜欢哪一个？
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: 音乐
    gloss: 音乐
    note: موسیقی 的意思是“音乐”。
    example_gloss: 我喜欢音乐。
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: 您有／您喜欢（礼貌）
    gloss: 您有／您喜欢
    note: دارین 是 داشتن（有）的敬称／复数第二人称形式，与本课程以 استم/استین 为先的敬称风格一致。
    target_text: دارین（您有／您喜欢，敬称）
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: 你喜欢哪一个？
    gloss: 你喜欢哪一个？
    note: کدام را دوست دارین؟——را 标记宾语，这里指你所选择的事物。
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: 更
    gloss: 更
    note: بیشتر 的意思是“更”“更多”。
    example_gloss: 我更喜欢咖啡。
  prs.a1.unit14.lesson03.teach.ya_word:
    title: 或者
    gloss: 或者
    note: یا 的意思是“或者”，用来在两样东西之间提供选择。
    target_text: یا（或者）
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: 咖啡还是茶？
    gloss: 咖啡还是茶？
    note: قهوه یا چای؟ 是在第一课学过的两种饮品之间做选择。
  prs.a1.unit14.lesson04.teach.choon_word:
    title: 因为
    gloss: 因为
    note: چون 用来引出理由。
    target_text: چون（因为）
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: 很好吃
    gloss: 很好吃
    note: خوش‌مزه است 是完整的、未缩略的形式（它很好吃）——本课程的风格是把 است 单独保留，而不缩略。
    example_gloss: 我喜欢咖啡，因为它很好喝。
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: 很有趣
    gloss: 很有趣
    note: جالب است 是完整的、未缩略的形式（它很有趣）。
    example_gloss: 我喜欢音乐，因为它很有趣。
  prs.a1.unit14.lesson04.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，用来连接两个分句或两个事物。
    target_text: و（和）
  prs.a1.unit14.lesson05.teach.negar_name:
    title: 内加尔
    gloss: 内加尔
    note: 阿富汗常见的女性名字。
    example_gloss: 尼加尔喜欢茶。
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: 他／她喜欢
    gloss: 他／她喜欢
    note: دارد 是 داشتن（有）的完整第三人称形式——دوست دارد 的意思是“他／她喜欢”，与第一人称的 دوست دارم 对应。
    target_text: دوست دارد（他／她喜欢，第三人称完整形式）
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: 他／她不喜欢
    gloss: 他／她不喜欢
    note: ندارد 是完整的第三人称否定形式——دوست ندارد 的意思是“他／她不喜欢”。
    target_text: دوست ندارد（他／她不喜欢，第三人称完整形式）
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: 是热的
    gloss: 是热的
    note: گرم است 是完整的、未缩略的形式（它是热的）。
    example_gloss: 尼加尔喜欢茶，因为它是热的。
  prs.a1.unit14.lesson05.teach.reading_text:
    title: 偏好短文示例
    gloss: 尼加尔喜欢茶，因为它是热的。尼加尔不喜欢音乐。
    note: 一段简短的第三人称叙述，综合运用了本单元的偏好词汇。
  prs.a1.unit14.lesson06.teach.names:
    title: 卡里姆和尼加尔
    gloss: 卡里姆，尼加尔
    note: 本课程中经常使用的阿富汗常见名字。
    example_gloss:
    - 我是卡里姆。
    - 我是尼加尔。
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: 你呢？
    gloss: 你呢？
    note: شما چطور؟ 是把问题礼貌地抛回给对方的说法，与 استین 一类的敬称风格一致。
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: 太棒了
    gloss: 太棒了
    note: عالی است 是完整的、未缩略的形式（它很棒）。
    example_gloss: 咖啡很棒。
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: 卡里姆提问
    gloss: 茶还是咖啡,你更喜欢哪个?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: 尼加尔的回答
    gloss: 我更喜欢咖啡,因为很好喝。你呢?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: 卡里姆回答
    gloss: 我喜欢茶,因为它是热的。
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: 尼加尔的回应
    gloss: 太棒了!
