    title: 在聚会上结识朋友
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: 礼貌地询问对方的名字
    gloss: 您叫什么名字？
    note: نام‌تان چیست؟ 是面对新认识的成年人时使用的恭敬说法，延续第1单元的 شما/استین 语体。
  prs.a1.unit02.lesson01.teach.name_answer:
    title: 用 است 说出你的名字
    gloss: 我叫法里敦。
    note: نام من ... است 是表达姓名的书面说法。口语中人们通常说 نامم ... است（نامم = نام + -م，即“我的名字”）。两种说法都正确。
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: 用 استم 说出你的名字
    gloss: 我是法里敦。
    note: استم 直接接在名字后面，就是第1单元学过的第一人称系动词。
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: 询问亲近朋友的名字
    gloss: 你叫什么名字？
    note: نامت چیست؟ 使用随便的所属后缀 -ت，只用于同辈或亲近的朋友，和第1单元的 تو/استی 一样。
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: “名字”这个词
    gloss: 名字
    note: نام 是单独的名词，在上面的礼貌和随便两种问句中都会用到。
    example_gloss: 您叫什么名字？
  prs.a1.unit02.lesson01.teach.register_note:
    title: 礼貌称呼与亲密朋友称呼的所有格
    gloss: -تان 用于需要尊敬对待的人；-ت 用于亲密的朋友。
    note: 第一单元中 شما/تو 的敬称与亲昵之分，同样体现在 نام 后面的所有格词尾上。
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: 询问对方来自哪里
    gloss: 您是哪里人？
    note: شما از کجا استین؟ 保持了敬称 شما 与 استین 的搭配。
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: 说你来自喀布尔
    gloss: 我来自喀布尔。
    note: من از کابل استم 遵循 من از [地名] استم 的句型，任何城市都可以这样说。
  prs.a1.unit02.lesson02.teach.from_herat:
    title: 说你来自赫拉特
    gloss: 我来自赫拉特。
    note: هرات 是阿富汗西部的一座大城市。
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: 说你来自马扎里沙里夫
    gloss: 我来自马扎里沙里夫。
    note: مزار شریف 分写成两个词，是阿富汗北部的一座大城市。
  prs.a1.unit02.lesson02.teach.country:
    title: 阿富汗
    gloss: 阿富汗
    note: افغانستان 的用法与城市名相同，放在 از 之后。
    example_gloss: 我来自阿富汗。
  prs.a1.unit02.lesson02.teach.city_word:
    title: “城市”一词
    gloss: 城市
    note: شهر 泛指城市，与具体的城市名不同。
    example_gloss: 喀布尔是一座大城市。
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: 询问对方的职业
    gloss: 你做什么工作？
    note: کار شما چیست؟ 字面意思是“您的工作是什么”，是询问职业的日常说法。
  prs.a1.unit02.lesson03.teach.doctor:
    title: 医生
    gloss: 医生
    note: داکتر 是达里语中常用的职业词，指医生，非正式场合也用来称呼有博士学位的人。
    example_gloss: 他/她是医生。
  prs.a1.unit02.lesson03.teach.teacher:
    title: 教师
    gloss: 女教师
    note: معلم 是对各级学校教师的通称。
    example_gloss: 他/她是老师。
  prs.a1.unit02.lesson03.teach.engineer:
    title: 工程师
    gloss: 工程师
    note: مهندس 泛指工程师，不特指某一个工程专业。
    example_gloss: 他/她是工程师。
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: 店主
    gloss: 店员
    note: دوکاندار（来自 دوکان，意为商店）是喀布尔的日常用词；本课程使用达里语拼写 دوکان，而不是伊朗波斯语的 مغازه。
    example_gloss: 他/她是店主。
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: 说明自己的职业
    gloss: 我是老师。
    note: من [职业] استم 是本课所学各种职业通用的句型。
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: 正式地介绍某人
    gloss: 请允许我介绍我的同事。
    note: اجازه بدهین همکارم را معرفی کنم 是把第三个人引入谈话时的一种礼貌说法。
  prs.a1.unit02.lesson04.teach.this_is:
    title: 说出你所介绍的人的名字
    gloss: 这是我的同事阿雷祖。
    note: این [人名] است 直接说出被介绍的人是谁。
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: 说很高兴认识对方
    gloss: 很高兴认识您。
    note: از آشنایی با شما خوش شدم 与第一单元的初次见面用语相同，这里用于介绍第三者之后。
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: 回答说你也很高兴
    gloss: 我也很高兴。
    note: من هم خوش شدم 是自然简短的回答。
  prs.a1.unit02.lesson04.teach.friend_word:
    title: 朋友
    gloss: 朋友
    note: دوست 是“朋友”的通称，不说明关系的亲疏。
    example_gloss: 他/她是我的朋友。
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: 同事
    gloss: 同事
    note: همکار 指一起工作的人，在第一单元的职场对话中已经出现过。
    example_gloss: 他/她是我的同事。
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: 先生
    gloss: 先生
    note: جناب 放在男士的名字或头衔前，是尊敬的称呼，在阿富汗城市的日常生活中很常见。
    example_gloss: 先生，请。
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: 女士
    gloss: 女士
    note: خانم 放在女士的名字前，无论婚否都可以使用。
    example_gloss: 女士，请。
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: 礼貌地称呼男士
    gloss: 法里敦先生
    note: جناب 加名字是常见的礼貌称呼，不一定需要带姓。
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: 礼貌地称呼女士
    gloss: 阿尔祖女士
    note: خانم 加名字的用法与对男士的 جناب 相同。
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: 何时使用哪种称呼
    gloss: 对刚认识的人用 شما 和 استین；只有对亲密的朋友才用 تو 和 استی。
    note: 这里针对介绍场合，重申了第一单元的敬称规则。
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: 礼貌地请对方重复姓名
    gloss: 您可以再说一遍您的名字吗？
    note: می‌توانین نام‌تان را دوباره بگویین؟ 是请对方重复时自然而礼貌的说法，不会令人尴尬。
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: 聚会
    gloss: 聚会
    note: مهمانی 指非正式的社交聚会，是本课对话的场景。
    example_gloss: 聚会很好。
  prs.a1.unit02.lesson06.teach.turn01:
    title: 莱拉开始自我介绍
    gloss: 莱拉向法里敦问好，并用敬称 جناب 称呼他，询问他的名字。
    note: 莱拉和法里敦以前没有见过面，所以她一开始就使用敬称。
  prs.a1.unit02.lesson06.teach.turn02:
    title: 法里敦说出自己的名字
    gloss: 法里敦回应问候，并说出自己的名字。
    note: سلام علیکم 是第一单元学过的较完整的问候语，适合初次见面。法里敦在对话中说 نامم فریدون است（نامم 即 نام من，“我的名字”），这是日常口语形式。
  prs.a1.unit02.lesson06.teach.turn03:
    title: 莱拉问他来自哪里
    gloss: 莱拉说很高兴认识他，并问他来自哪里。
    note: 同样的 از آشنایی با شما خوش شدم 一句，在第一单元的职场对话中也出现过。
  prs.a1.unit02.lesson06.teach.turn04:
    title: 法里敦回答并反问
    gloss: 法里敦说他来自赫拉特，并向莱拉提出同样的问题。
    note: و شما؟ 是简洁的反问方式，第一单元中已经见过。
  prs.a1.unit02.lesson06.teach.turn05:
    title: 莱拉回答并询问职业
    gloss: 莱拉说她来自喀布尔，并问法里敦的职业。
    note: 谈话自然地从籍贯转到了职业。
  prs.a1.unit02.lesson06.teach.turn06:
    title: 法里敦回答并反问
    gloss: 法里敦说他是工程师，并向莱拉提出同样的问题。
    note: شما چطور؟ 是在上下文已明确时，简短地反问对方的说法。
  prs.a1.unit02.lesson06.teach.turn07:
    title: 莱拉说明自己的职业
    gloss: 莱拉说她是老师。
    note: 用本单元前面学过的句型完成职业的问答。
  prs.a1.unit02.lesson06.teach.turn08:
    title: 法里敦介绍第三个人
    gloss: 法里敦介绍他的同事阿尔祖。
    note: 这里用 lesson04 中学过的正式介绍用语，把第三个人引入谈话。
  prs.a1.unit02.lesson06.teach.turn09:
    title: 莱拉欢迎阿尔祖
    gloss: 莱拉欢迎阿尔祖，并用敬称 خانم 称呼她。
    note: خوش آمدین 是第一单元学过的欢迎用语，这里用于刚被介绍的人。
  prs.a1.unit02.lesson06.teach.turn10:
    title: 阿尔祖回应
    gloss: 阿尔祖向莱拉道谢，并说很高兴见到她。
    note: از دیدن شما خوشحال شدم 是“很高兴认识您”的一种自然变体，用 دیدن（见）代替 آشنایی。
exercises:
