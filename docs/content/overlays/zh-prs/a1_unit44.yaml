    target_text: رنگ（颜色）/ سبز（绿色）/ آبی（蓝色）
  prs.a1.unit44.lesson01.teach.bin_word:
    title: 桶
    gloss: 桶／垃圾桶
    note: سطل 是达里语中表示桶或垃圾桶的常用词。
    example_gloss: 垃圾桶是绿色的。
