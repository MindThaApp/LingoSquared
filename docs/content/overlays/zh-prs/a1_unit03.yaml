      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من 的意思是“我的奶奶／外婆”。
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 请补全：我母亲的兄弟是我的舅舅。
    accepted_answers:
