teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: 母亲
    gloss: 母亲
    note: مادر 是达里语中表示“母亲”的中性词。
    example_gloss: 我的母亲很善良。
  prs.a1.unit03.lesson01.teach.father:
    title: 父亲
    gloss: 父亲
    note: پدر 是达里语中表示“父亲”的中性词。
    example_gloss: 我的父亲是医生。
  prs.a1.unit03.lesson01.teach.brother:
    title: 哥哥／弟弟
    gloss: 兄弟
    note: برادر 的意思是兄弟（哥哥或弟弟）。
    example_gloss: 我有一个兄弟。
  prs.a1.unit03.lesson01.teach.sister:
    title: 姐姐／妹妹
    gloss: 姐妹
    note: خواهر 的意思是姐妹（姐姐或妹妹）。
    example_gloss: 我的姐姐／妹妹是老师。
  prs.a1.unit03.lesson01.teach.parents:
    title: 父母
    gloss: 父亲和母亲；父母
    note: 达里语提到自己的父母时，常说 پدر و مادر。
    example_gloss: 我的父母住在喀布尔。
  prs.a1.unit03.lesson01.teach.my_mother:
    title: 介绍你的母亲
    gloss: 这是我的母亲。
    note: مادرم 中的词尾 ـم 表示“我的”。
  prs.a1.unit03.lesson02.teach.grandfather:
    title: 祖父
    gloss: 祖父；外祖父
    note: پدرکلان 是阿富汗达里语的常用说法，字面意思是“大父亲”或“年长的父亲”。
    example_gloss: 我的祖父年纪大了。
  prs.a1.unit03.lesson02.teach.grandmother:
    title: 祖母
    gloss: 祖母；外祖母
    note: مادرکلان 是阿富汗达里语的常用说法，字面意思是“大母亲”或“年长的母亲”。
    example_gloss: 我的祖母很和蔼。
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: 父亲的兄弟
    gloss: 伯父；叔父
    note: کاکا 专指你父亲的兄弟。
    example_gloss: 我的叔叔住在赫拉特。
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: 父亲的姐妹
    gloss: 姑母；姑妈
    note: عمه 专指你父亲的姐妹。
    example_gloss: 我的姑姑是老师。
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: 母亲的兄弟
    gloss: 舅舅
    note: 在达里语中，ماما 专指你母亲的兄弟。
    example_gloss: 我的舅舅是工程师。
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: 母亲的姐妹
    gloss: 姨妈
    note: خاله 专指你母亲的姐妹。
    example_gloss: 我的姨妈住在喀布尔。
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: 分清父系和母系
    gloss: کاکا 和 عمه 属父系；ماما 和 خاله 属母系。
    note: 和汉语一样，达里语也区分父系和母系的亲戚：کاکا、عمه 属父亲一方，ماما、خاله 属母亲一方，这四个词不能混用。
  prs.a1.unit03.lesson03.teach.family:
    title: 家庭
    gloss: 家庭
    note: فامیل 是阿富汗达里语中表示“家庭”的普通词。
    example_gloss: 我的家庭很大。
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: 礼貌地询问家里有几口人
    gloss: 您家有几口人？
    note: ـتان 表示礼貌的“您的”；نفر 是称量人数的量词。
  prs.a1.unit03.lesson03.teach.five_people:
    title: 说出家里有几口人
    gloss: 我们家有五口人。
    note: 达里语用 نفر است 加数字来表示家里的人数。
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: 说说你有几个兄弟姐妹
    gloss: 我有一个哥哥／弟弟和两个姐姐／妹妹。
    note: دارم 的意思是“我有”。数字后面的名词仍用单数形式。
  prs.a1.unit03.lesson03.teach.only_child:
    title: 独生子女
    gloss: 我是独生子女。
    note: استم 是本课程所教的喀布尔达里语第一人称形式。
  prs.a1.unit03.lesson03.teach.possession:
    title: “有”的各种形式
    gloss: 我有；我们有；您有／你们有
    note: 在喀布尔受过教育者的口语中，دارین 表示尊敬的“您有”或复数的“你们有”。
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: 询问有没有兄弟姐妹
    gloss: 您有兄弟姐妹吗？
    note: دارین 使这个问句带有尊敬或复数的意味。
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: 询问有几个兄弟姐妹
    gloss: 您有几个兄弟姐妹？
    note: چند 用来询问“多少、几个”。
  prs.a1.unit03.lesson04.teach.parents_well:
    title: 问候对方的父母
    gloss: 您的父母都好吗？
    note: جور استند 是阿富汗人常用的“他们很好”的说法。
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: 肯定的回答
    gloss: 是的，我有一个哥哥／弟弟。
    note: بلی 是阿富汗礼貌的标准肯定回答“是”。
  prs.a1.unit03.lesson04.teach.no_answer:
    title: 否定的回答
    gloss: 不，我没有姐姐／妹妹。
    note: نخیر 是尊敬的否定回答“不”；ندارم 的意思是“我没有”。
  prs.a1.unit03.lesson04.teach.polite_your:
    title: 礼貌的“您的”
    gloss: 您的家庭；您的母亲；您的父亲
    note: 所有格词尾 ـتان 表示尊敬或复数。本课程用零宽不连字符把它与前面的词连接。
  prs.a1.unit03.lesson05.teach.married:
    title: 已婚
    gloss: 已婚
    note: متأهل 是表示婚姻状况的中性词。
    example_gloss: 他/她已婚。
  prs.a1.unit03.lesson05.teach.single:
    title: 单身
    gloss: 单身；未婚
    note: 在此语境中，مجرد 的意思是“未婚”。
    example_gloss: 我是单身。
  prs.a1.unit03.lesson05.teach.husband:
    title: 丈夫
    gloss: 丈夫
    note: شوهر 是表示“丈夫”的普通词。
    example_gloss: 我的丈夫是工程师。
  prs.a1.unit03.lesson05.teach.wife:
    title: 妻子
    gloss: 妻子
    note: خانم 可以指“妻子”，也可以是对女士的礼貌称呼，要根据语境区分。
    example_gloss: 我的妻子是老师。
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: 礼貌地询问婚姻状况
    gloss: 您结婚了吗？
    note: 字面意思是“您结过婚了吗？”词尾 ـین 是喀布尔话的礼貌形式。
  prs.a1.unit03.lesson05.teach.married_answer:
    title: 说明自己已婚
    gloss: 是的，我已婚。
    note: استم 是这里使用的阿富汗达里语第一人称系动词。
  prs.a1.unit03.lesson05.teach.children:
    title: 询问有没有孩子
    gloss: 你有孩子吗？
    note: اولاد 是常用的集合词，指一个或多个孩子。
  prs.a1.unit03.lesson06.teach.turn01:
    title: 玛丽亚姆询问家里有几口人
    gloss: 您家有几口人？
    note: 玛丽亚姆使用了表示尊敬的 ـتان。
  prs.a1.unit03.lesson06.teach.turn02:
    title: 弗雷什特介绍自己的兄弟姐妹
    gloss: 五口人。我有一个哥哥／弟弟和一个姐姐／妹妹。
    note: 家庭成员用 نفر 来计数。
  prs.a1.unit03.lesson06.teach.turn03:
    title: 玛丽亚姆询问婚姻状况
    gloss: 您结婚了吗？
    note: 这个问句形式礼貌而中性。
  prs.a1.unit03.lesson06.teach.turn04:
    title: 弗雷什特介绍她的丈夫
    gloss: 是的，我已婚。我丈夫是大学生。
    note: 这里表示“学生”用的是阿富汗达里语固有的词 محصل，而不是伊朗的 دانشجو。
  prs.a1.unit03.lesson06.teach.turn05:
    title: 玛丽亚姆询问有没有孩子
    gloss: 你有孩子吗？
    note: دارین 继续保持尊敬的称呼。
  prs.a1.unit03.lesson06.teach.turn06:
    title: 弗雷什特回答
    gloss: 不，我们还没有孩子。
    note: نخیر 是尊敬的“不”；نداریم 的意思是“我们没有”。
