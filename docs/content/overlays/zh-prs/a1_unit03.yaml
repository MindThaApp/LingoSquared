      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: 请使用 این、带“我的”的亲属称谓，以及 است。
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: 请选择 پدرکلان 的意思。
    correct_option: 祖父；外祖父
    distractors:
    - 祖母；外祖母
    - 父亲
    - 伯父；叔父
    accepted_answers:
    - value: 祖父；外祖父
      status: correct
    feedback: 在阿富汗达里语中，پدرکلان 的意思是“爷爷／祖父”。
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: ماما 指的是哪种亲属关系？
    correct_option: 舅舅（母亲的兄弟）
    distractors:
