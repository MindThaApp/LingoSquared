course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Say what you started, stopped, tried or forgot to do, for example a sport, a habit or screen time."
units:
  ru.a2.unit78.nachat_perestat: {"title": "Started, stopped, trying, forgot", "description": "Say what you started, stopped, tried or forgot to do, with начать, перестать, пытаться and забыть plus an infinitive."}
lessons:
  ru.a2.unit78.lesson01.nachal: {"title": "I started"}
  ru.a2.unit78.lesson02.perestal: {"title": "Stopped"}
  ru.a2.unit78.lesson03.pytayus: {"title": "I am trying"}
  ru.a2.unit78.lesson04.zabyl: {"title": "Forgot"}
  ru.a2.unit78.lesson05.zapiska: {"title": "Dima's note"}
  ru.a2.unit78.lesson06.dialog: {"title": "How are things"}
teaching:
  ru.a2.unit78.lesson01.teach.nachal: {"title": "начать in the past", "gloss": "started (masc.) / started (fem.) / started (plural)", "note": "*Начал, начала, начали* agree with the subject in gender and number. They are followed by an imperfective infinitive.", "example_gloss": ["Dima started running.", "Nastya started reading every day.", "We started learning words.", "I started running (a man speaking)."]}
  ru.a2.unit78.lesson01.teach.sport: {"title": "Sport and mornings", "gloss": "do sport / sport / in the mornings", "note": "*Заниматься спортом* is a fixed phrase for 'to do sport'. *По утрам* means 'in the mornings' (every morning).", "example_gloss": ["Dima started doing sport.", "Dima runs in the mornings.", "Nastya started doing sport."]}
  ru.a2.unit78.lesson01.teach.gn_nachal: {"title": "Started + infinitive", "gloss": "He started running. She started reading. We started learning.", "note": "*Начать* in the past is *начал* (he), *начала* (she), *начали* (we, they). After it comes an imperfective infinitive: *бегать*, *читать*, *учить*."}
  ru.a2.unit78.lesson01.teach.gn_ya: {"title": "I started: man or woman", "gloss": "I started running (man). I started running (woman).", "note": "With *я* the form shows who is speaking: a man says *я начал*, a woman says *я начала*."}
  ru.a2.unit78.lesson02.teach.perestal: {"title": "перестать in the past", "gloss": "stopped (masc.) / stopped (fem.) / stopped (plural)", "note": "*Перестал, перестала, перестали* mean 'stopped'. An imperfective infinitive follows: *перестал пить*.", "example_gloss": ["Dima stopped drinking coffee in the evening.", "Nastya stopped watching TV.", "We stopped sitting on our phones."]}
  ru.a2.unit78.lesson02.teach.screen: {"title": "Screen time", "gloss": "watch / phone / TV / sit", "note": "*Сидеть в телефоне* is a common way to say that someone spends time on the phone.", "example_gloss": ["Nastya is watching TV.", "Dima is sitting on the phone.", "I do not like watching TV."]}
  ru.a2.unit78.lesson02.teach.gn_perestal: {"title": "Stopped + infinitive", "gloss": "He stopped drinking coffee. She stopped watching TV. We stopped sitting on our phones.", "note": "*Перестать* agrees in the past like *начать*: *перестал, перестала, перестали*. The infinitive is imperfective."}
  ru.a2.unit78.lesson02.teach.gn_pair: {"title": "Start and stop together", "gloss": "Dima started running and stopped drinking coffee.", "note": "Join a beginning and an ending with *и*: both verbs are in the past and agree with the subject."}
  ru.a2.unit78.lesson03.teach.pyt: {"title": "пытаться: present", "gloss": "I try / you try / he tries / we try / you (plural) try / they try", "note": "*Пытаться* means 'to try to'. It is followed by an imperfective infinitive.", "example_gloss": ["I am trying to get up early.", "Dima is trying to sit on the phone less.", "We are trying to learn words.", "They are trying to run every day."]}
  ru.a2.unit78.lesson03.teach.past: {"title": "пытаться: past", "gloss": "tried (masc.) / tried (fem.) / tried (plural) / hard", "note": "In the past the reflexive ending is *-ся* after a consonant and *-сь* after a vowel: *пытался, пыталась, пытались*.", "example_gloss": ["Dima tried to get up early, but it is hard.", "Nastya tried to read every day.", "We tried to run in the mornings."]}
  ru.a2.unit78.lesson03.teach.gn_pyt: {"title": "Present of пытаться", "gloss": "I try, you try, he tries, we try, you (plural) try, they try", "note": "*Пытаться* has the endings *-юсь, -ешься, -ется, -емся, -етесь, -ются*: *я пытаюсь, ты пытаешься, он пытается, мы пытаемся, вы пытаетесь, они пытаются*."}
  ru.a2.unit78.lesson03.teach.gn_past: {"title": "Past of пытаться", "gloss": "Dima tried. Nastya tried. We tried.", "note": "The past tense follows the same gender and number rule: *пытался* (he), *пыталась* (she), *пытались* (we, they)."}
  ru.a2.unit78.lesson04.teach.zabyl: {"title": "забыть in the past", "gloss": "forgot (masc.) / forgot (fem.) / forgot (plural)", "note": "*Забыл, забыла, забыли* are followed by a perfective infinitive when one action was forgotten: *забыл позвонить*.", "example_gloss": ["I forgot to call (a man speaking).", "Nastya forgot to buy bread.", "We forgot to close the window.", "Dima forgot to take the card."]}
  ru.a2.unit78.lesson04.teach.ne_zab: {"title": "Do not forget", "gloss": "do not forget / I will not forget / yesterday / sorry / it is fine", "note": "*Не забудь* is the ты-imperative; *не забудьте* is for вы. *Извини* is 'sorry' to a friend and *ничего* answers it: 'it is fine'.", "example_gloss": ["Do not forget to call tomorrow!", "I will not forget!", "Yesterday I forgot to call. Sorry.", "It is fine, all is well."]}
  ru.a2.unit78.lesson04.teach.gn_zabyl: {"title": "Forgot + one action", "gloss": "I forgot to call. Nastya forgot to buy bread.", "note": "After *забыл* use a perfective infinitive: *позвонить*, *купить*, *закрыть*. It names the one action that did not happen."}
  ru.a2.unit78.lesson04.teach.gn_ne_zab: {"title": "Reminding: не забудь", "gloss": "Do not forget to call tomorrow!", "note": "A reminder is *не забудь* + a perfective infinitive. The answer is *не забуду*: I will not forget."}
  ru.a2.unit78.lesson05.teach.v5: {"title": "Words for the note", "gloss": "hi / bye / to you / less", "note": "Dima writes to Nastya as to a friend, so he uses *ты*.", "example_gloss": ["Hi, Nastya!", "I am trying to sit on the phone less.", "Bye, Nastya!"]}
  ru.a2.unit78.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! I started running in the mornings and stopped drinking coffee in the evening. I am trying to sit on my phone less, but it is hard. Yesterday I forgot to call you. Sorry! Bye! Dima", "note": "The note uses all four verbs: *начал*, *перестал*, *пытаюсь*, *забыл*.", "glosses": {"трудно": "hard, difficult", "извини": "sorry (to a friend)", "вчера": "yesterday"}}
  ru.a2.unit78.lesson06.teach.q: {"title": "Nastya asks how things are", "gloss": "Nastya: Dima, how are things? Did you start running?"}
  ru.a2.unit78.lesson06.teach.a: {"title": "Dima says what he started and stopped", "gloss": "Dima: Yes, I started running in the mornings and stopped drinking coffee in the evening."}
  ru.a2.unit78.lesson06.teach.q2: {"title": "Nastya praises him", "gloss": "Nastya: Well done! And the phone?"}
  ru.a2.unit78.lesson06.teach.a2: {"title": "Dima says what he is trying and forgot", "gloss": "Dima: I am trying to sit on the phone less, but it is hard. Yesterday I forgot to call you. Sorry."}
  ru.a2.unit78.lesson06.teach.q3: {"title": "Nastya reminds him", "gloss": "Nastya: It is fine. Do not forget to call tomorrow!"}
  ru.a2.unit78.lesson06.teach.end: {"title": "Dima promises", "gloss": "Dima: I will not forget!"}
exercises:
  ru.a2.unit78.lesson01.exercise01.dima: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима начал бегать.", "distractors": ["Дима начала бегать.", "Дима начали бегать.", "Дима начал бегает."], "accepted_answers": [{"value": "Дима начал бегать.", "status": "correct"}], "feedback": "*Дима* is masculine, so *начал*."}
  ru.a2.unit78.lesson01.exercise02.nastya: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя начала читать каждый день.", "distractors": ["Настя начал читать каждый день.", "Настя начали читать каждый день.", "Настя начала читает каждый день."], "accepted_answers": [{"value": "Настя начала читать каждый день.", "status": "correct"}], "feedback": "*Настя* is feminine, so *начала*, and the infinitive *читать*."}
  ru.a2.unit78.lesson01.exercise03.w1: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "начал", "right": "started (masculine)"}, {"left": "начала", "right": "started (feminine)"}, {"left": "начали", "right": "started (plural)"}, {"left": "бегать", "right": "to run"}, {"left": "заниматься спортом", "right": "to do sport"}, {"left": "по утрам", "right": "in the mornings"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit78.lesson01.exercise04.slova: {"instruction": "Put the words in order to say 'We started learning words.'", "correct_option": "Мы начали учить слова", "accepted_answers": [{"value": "Мы начали учить слова", "status": "correct"}, {"value": "Слова мы начали учить", "status": "correct"}], "feedback": "*Начали* agrees with *мы*."}
  ru.a2.unit78.lesson01.exercise05.blank_nachal: {"instruction": "Complete the sentence: 'Dima started running.'", "correct_option": "начал", "accepted_answers": [{"value": "начал", "status": "correct"}], "feedback": "*Дима* is masculine: *начал*."}
  ru.a2.unit78.lesson01.exercise06.sport: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Настя начала заниматься спортом.", "status": "correct"}, {"value": "Настя начала заниматься спортом", "status": "correct"}], "feedback": "*Настя* is feminine: *начала*."}
  ru.a2.unit78.lesson01.exercise07.ya_beg: {"instruction": "Write the requested Russian sentence.", "correct_option": "Я начала бегать.", "accepted_answers": [{"value": "Я начала бегать.", "status": "correct"}, {"value": "Я начала бегать", "status": "correct"}, {"value": "Я начала бегать по утрам.", "status": "correct"}, {"value": "Я начала бегать по утрам", "status": "correct"}], "feedback": "A woman says *начала*."}
  ru.a2.unit78.lesson02.exercise01.tv: {"instruction": "Choose the correct English meaning.", "correct_option": "Nastya stopped watching TV.", "distractors": ["Nastya started watching TV.", "Nastya will watch TV.", "Nastya does not like TV."], "accepted_answers": [{"value": "Nastya stopped watching TV.", "status": "correct"}], "feedback": "*Перестала* = stopped."}
  ru.a2.unit78.lesson02.exercise02.kofe: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима перестал пить кофе вечером.", "distractors": ["Дима перестала пить кофе вечером.", "Дима перестали пить кофе вечером.", "Дима начал пить кофе вечером."], "accepted_answers": [{"value": "Дима перестал пить кофе вечером.", "status": "correct"}], "feedback": "*Дима* is masculine: *перестал*."}
  ru.a2.unit78.lesson02.exercise03.w2: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "перестал", "right": "stopped (masculine)"}, {"left": "перестала", "right": "stopped (feminine)"}, {"left": "перестали", "right": "stopped (plural)"}, {"left": "смотреть", "right": "to watch"}, {"left": "телефон", "right": "phone"}, {"left": "телевизор", "right": "TV"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit78.lesson02.exercise04.tel: {"instruction": "Put the words in order to say 'We stopped sitting on our phones.'", "correct_option": "Мы перестали сидеть в телефоне", "accepted_answers": [{"value": "Мы перестали сидеть в телефоне", "status": "correct"}, {"value": "Мы в телефоне перестали сидеть", "status": "correct"}], "feedback": "*Перестали* agrees with *мы*."}
  ru.a2.unit78.lesson02.exercise05.blank_perestala: {"instruction": "Complete the sentence: 'Nastya stopped watching TV.'", "correct_option": "перестала", "accepted_answers": [{"value": "перестала", "status": "correct"}], "feedback": "*Настя* is feminine: *перестала*."}
  ru.a2.unit78.lesson02.exercise06.kofe2: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Дима перестал пить кофе.", "status": "correct"}, {"value": "Дима перестал пить кофе", "status": "correct"}], "feedback": "*Дима* is masculine: *перестал*."}
  ru.a2.unit78.lesson02.exercise07.mytv: {"instruction": "Write the requested Russian sentence.", "correct_option": "Мы перестали смотреть телевизор.", "accepted_answers": [{"value": "Мы перестали смотреть телевизор.", "status": "correct"}, {"value": "Мы перестали смотреть телевизор", "status": "correct"}], "feedback": "*Мы* takes the plural *перестали*."}
  ru.a2.unit78.lesson03.exercise01.try: {"instruction": "Choose the correct English meaning.", "correct_option": "I am trying to sit on my phone less.", "distractors": ["I stopped sitting on my phone.", "I forgot my phone.", "I started sitting on my phone."], "accepted_answers": [{"value": "I am trying to sit on my phone less.", "status": "correct"}], "feedback": "*Пытаюсь* = I am trying."}
  ru.a2.unit78.lesson03.exercise02.pytaemsya: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы пытаемся учить слова.", "distractors": ["Мы пытается учить слова.", "Мы пытаюсь учить слова.", "Мы пытаетесь учить слова."], "accepted_answers": [{"value": "Мы пытаемся учить слова.", "status": "correct"}], "feedback": "*Мы* goes with *пытаемся*."}
  ru.a2.unit78.lesson03.exercise03.w3: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "я пытаюсь", "right": "I try"}, {"left": "ты пытаешься", "right": "you try (to one friend)"}, {"left": "он пытается", "right": "he tries"}, {"left": "мы пытаемся", "right": "we try"}, {"left": "вы пытаетесь", "right": "you try (formal or plural)"}, {"left": "они пытаются", "right": "they try"}], "status": "correct"}], "feedback": "Each person has its own ending."}
  ru.a2.unit78.lesson03.exercise04.dima: {"instruction": "Put the words in order to say 'Dima is trying to sit on the phone less.'", "correct_option": "Дима пытается меньше сидеть в телефоне", "accepted_answers": [{"value": "Дима пытается меньше сидеть в телефоне", "status": "correct"}, {"value": "Дима пытается сидеть в телефоне меньше", "status": "correct"}], "feedback": "*Пытается* + infinitive."}
  ru.a2.unit78.lesson03.exercise05.blank_pyt: {"instruction": "Complete the sentence: 'Nastya tried to read every day.'", "correct_option": "пыталась", "accepted_answers": [{"value": "пыталась", "status": "correct"}], "feedback": "*Настя* is feminine: *пыталась*."}
  ru.a2.unit78.lesson03.exercise06.rano: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я пытаюсь вставать рано.", "status": "correct"}, {"value": "Я пытаюсь вставать рано", "status": "correct"}], "feedback": "*Пытаюсь* + imperfective infinitive."}
  ru.a2.unit78.lesson03.exercise07.nast: {"instruction": "Write the requested Russian sentence.", "correct_option": "Настя пытается читать каждый день.", "accepted_answers": [{"value": "Настя пытается читать каждый день.", "status": "correct"}, {"value": "Настя пытается читать каждый день", "status": "correct"}, {"value": "Настя каждый день пытается читать.", "status": "correct"}, {"value": "Настя каждый день пытается читать", "status": "correct"}], "feedback": "*Настя* is *она*: *пытается*."}
  ru.a2.unit78.lesson04.exercise01.buy: {"instruction": "Choose the correct English meaning.", "correct_option": "Nastya forgot to buy bread.", "distractors": ["Nastya bought bread.", "Nastya started buying bread.", "Nastya stopped buying bread."], "accepted_answers": [{"value": "Nastya forgot to buy bread.", "status": "correct"}], "feedback": "*Забыла* = forgot."}
  ru.a2.unit78.lesson04.exercise02.okno: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы забыли закрыть окно.", "distractors": ["Мы забыл закрыть окно.", "Мы забыла закрыть окно.", "Мы забыли открыть окно."], "accepted_answers": [{"value": "Мы забыли закрыть окно.", "status": "correct"}], "feedback": "*Мы* takes the plural *забыли*."}
  ru.a2.unit78.lesson04.exercise03.w4: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "забыл", "right": "forgot (masculine)"}, {"left": "забыла", "right": "forgot (feminine)"}, {"left": "забыли", "right": "forgot (plural)"}, {"left": "не забудь", "right": "do not forget (to a friend)"}, {"left": "вчера", "right": "yesterday"}, {"left": "извини", "right": "sorry (to a friend)"}, {"left": "ничего", "right": "it is fine"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit78.lesson04.exercise04.zvon: {"instruction": "Put the words in order to say 'Do not forget to call tomorrow.'", "correct_option": "Не забудь позвонить завтра", "accepted_answers": [{"value": "Не забудь позвонить завтра", "status": "correct"}, {"value": "Завтра не забудь позвонить", "status": "correct"}, {"value": "Не забудь завтра позвонить", "status": "correct"}], "feedback": "*Не забудь* + perfective infinitive."}
  ru.a2.unit78.lesson04.exercise05.blank_zabyl: {"instruction": "Complete the sentence: 'Dima forgot to take the card.'", "correct_option": "забыл", "accepted_answers": [{"value": "забыл", "status": "correct"}], "feedback": "*Дима* is masculine: *забыл*."}
  ru.a2.unit78.lesson04.exercise06.vchera: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Вчера я забыл позвонить тебе.", "status": "correct"}, {"value": "Вчера я забыл позвонить тебе", "status": "correct"}, {"value": "Я вчера забыл позвонить тебе.", "status": "correct"}, {"value": "Я вчера забыл позвонить тебе", "status": "correct"}, {"value": "Я забыл позвонить тебе вчера.", "status": "correct"}, {"value": "Я забыл позвонить тебе вчера", "status": "correct"}, {"value": "Вчера я забыл тебе позвонить.", "status": "correct"}, {"value": "Вчера я забыл тебе позвонить", "status": "correct"}], "feedback": "A man says *забыл*."}
  ru.a2.unit78.lesson04.exercise07.w4b: {"instruction": "Write the requested Russian sentences.", "correct_option": "Вчера я забыла позвонить. Извини.", "accepted_answers": [{"value": "Вчера я забыла позвонить. Извини.", "status": "correct"}, {"value": "Вчера я забыла позвонить. Извини", "status": "correct"}, {"value": "Я вчера забыла позвонить. Извини.", "status": "correct"}, {"value": "Я вчера забыла позвонить. Извини", "status": "correct"}, {"value": "Я забыла позвонить вчера. Извини.", "status": "correct"}, {"value": "Я забыла позвонить вчера. Извини", "status": "correct"}], "feedback": "A woman says *забыла*; *извини* is for a friend."}
  ru.a2.unit78.lesson05.exercise01.r1: {"instruction": "Read Dima's note and choose the answer.", "correct_option": "Running in the mornings.", "distractors": ["Reading in the evenings.", "Learning words.", "Swimming."], "accepted_answers": [{"value": "Running in the mornings.", "status": "correct"}], "feedback": "*Я начал бегать по утрам.*"}
  ru.a2.unit78.lesson05.exercise02.r2: {"instruction": "Read Dima's note and choose the answer.", "correct_option": "To call Nastya.", "distractors": ["To buy bread.", "To close the window.", "To take a card."], "accepted_answers": [{"value": "To call Nastya.", "status": "correct"}], "feedback": "*Вчера я забыл позвонить тебе.*"}
