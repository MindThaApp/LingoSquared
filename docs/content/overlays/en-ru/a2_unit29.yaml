      - {value: "Во всей квартире и на кухне течёт кран", status: "correct"}
      - {value: "Во всей квартире, и на кухне кран течёт.", status: "correct"}
      - {value: "Во всей квартире, и на кухне течет кран.", status: "correct"}
      - {value: "Во всей квартире, и на кухне кран течет.", status: "correct"}
    feedback: "The answer gives the scope and adds the second problem."
