course:
  title: "Russian A2"
  description: "Learn A2-level Russian for reporting a maintenance problem."

units:
  ru.a2.unit29.remont: {title: "Problem in the apartment"}

lessons:
  ru.a2.unit29.lesson01.problema: {title: "The heating is not working"}
  ru.a2.unit29.lesson02.kran_i_master: {title: "The tap is leaking"}
  ru.a2.unit29.lesson03.upravlyayushchiy: {title: "Dialogue: building manager"}

teaching:
  ru.a2.unit29.lesson01.teach.problema: {title: "проблема", gloss: "problem", note: "*проблема* is feminine; in this unit it is a household problem.", example_gloss: "I have a problem in the apartment."}
  ru.a2.unit29.lesson01.teach.otoplenie: {title: "отопление", gloss: "heating", note: "*отопление* is neuter; *не работает отопление* is natural for \"the heating is not working.\"", example_gloss: "The heating is not working."}
  ru.a2.unit29.lesson01.teach.ne_rabotaet: {title: "не работает", gloss: "is not working", note: "*не работает* is the natural way to say a device or system \"is not working.\"", example_gloss: "The heating is not working in the apartment."}
  ru.a2.unit29.lesson02.teach.techet_kran: {title: "течёт кран", gloss: "the tap is leaking", note: "*течёт* is used for leaking water.", example_gloss: "The tap is leaking in the kitchen."}
  ru.a2.unit29.lesson02.teach.master: {title: "мастер", gloss: "repair worker", note: "In repair contexts, *мастер* is the person who comes to fix the problem.", example_gloss: "The repair worker will come tomorrow."}
  ru.a2.unit29.lesson02.teach.pridet: {title: "придёт", gloss: "will come", note: "*придёт* is future: will come.", example_gloss: "The repair worker will come tomorrow morning."}
  ru.a2.unit29.lesson03.teach.nastya_heating: {title: "Nastya reports the heating", gloss: "Nastya: Hello. The heating in my apartment is not working.", note: "She uses formal service register with the manager."}
  ru.a2.unit29.lesson03.teach.manager_room: {title: "The manager asks scope", gloss: "Manager: I see. Is the problem in one room or in the whole apartment?", note: "This checks the scope of the issue."}
  ru.a2.unit29.lesson03.teach.nastya_all_flat: {title: "Nastya adds a second problem", gloss: "Nastya: In the whole apartment, and the kitchen tap is leaking.", note: "She reports both problems clearly."}
  ru.a2.unit29.lesson03.teach.manager_master: {title: "The manager schedules repair", gloss: "Manager: The repair worker will come tomorrow morning.", note: "This gives the repair timing."}
  ru.a2.unit29.lesson03.teach.nastya_time: {title: "Nastya asks the time", gloss: "Nastya: Please tell me, at what time?", note: "This asks about repair timing."}
  ru.a2.unit29.lesson03.teach.manager_nine: {title: "The manager gives the time", gloss: "Manager: At nine o'clock.", note: "The exact repair time is nine."}

exercises:
  ru.a2.unit29.lesson01.exercise01.recognize_otoplenie: {instruction: "Which word means \"heating\"?", correct_option: "отопление", distractors: ["кухня", "квартира", "проблема"], accepted_answers: [{value: "отопление", status: "correct"}], feedback: "*отопление* means \"heating.\""}
  ru.a2.unit29.lesson01.exercise02.recognize_ne_rabotaet: {instruction: "Which phrase means \"is not working\"?", correct_option: "не работает", distractors: ["работает", "в квартире", "понятно"], accepted_answers: [{value: "не работает", status: "correct"}], feedback: "*не работает* means \"is not working.\""}
  ru.a2.unit29.lesson01.exercise03.listen_select_heating: {instruction: "Listen. What problem is reported?", correct_option: "The heating is not working.", distractors: ["The tap is leaking.", "The card is free.", "The passport is missing."], accepted_answers: [{value: "The heating is not working.", status: "correct"}], feedback: "The recording says *не работает отопление*."}
  ru.a2.unit29.lesson01.exercise04.match_problem_words:
    instruction: "Match each household word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "проблема", right: "problem"}
          - {left: "квартира", right: "apartment"}
          - {left: "отопление", right: "heating"}
          - {left: "не работает", right: "is not working"}
          - {left: "кухня", right: "kitchen"}
          - {left: "У меня проблема.", right: "I have a problem."}
        status: "correct"
    feedback: "These are the core repair-report words."
  ru.a2.unit29.lesson01.exercise05.order_ne_rabotaet: {instruction: "Put the words in order to say \"The heating is not working.\"", accepted_answers: [{value: ["Не", "работает", "отопление"], status: "correct"}, {value: ["отопление", "Не", "работает"], status: "correct"}], feedback: "The correct order is *Не работает отопление*."}
  ru.a2.unit29.lesson01.exercise06.write_heating_problem:
    instruction: "Write: The heating in my apartment is not working."
    accepted_answers:
      - {value: "У меня в квартире не работает отопление.", status: "correct"}
      - {value: "У меня в квартире не работает отопление", status: "correct"}
      - {value: "У меня в квартире отопление не работает.", status: "correct"}
    feedback: "The model answer is *У меня в квартире не работает отопление*."
  ru.a2.unit29.lesson02.exercise01.recognize_kran: {instruction: "Which word means \"tap\" or \"faucet\"?", correct_option: "кран", distractors: ["мастер", "утром", "отопление"], accepted_answers: [{value: "кран", status: "correct"}], feedback: "*кран* means \"tap\" or \"faucet.\""}
  ru.a2.unit29.lesson02.exercise02.recognize_master: {instruction: "Which word means \"repair worker\"?", correct_option: "мастер", distractors: ["кран", "адрес", "заявление"], accepted_answers: [{value: "мастер", status: "correct"}], feedback: "*мастер* is the repair worker here."}
  ru.a2.unit29.lesson02.exercise03.listen_select_master: {instruction: "Listen. When will the repair worker come?", correct_option: "Tomorrow morning.", distractors: ["Today at ten.", "Friday evening.", "Next week."], accepted_answers: [{value: "Tomorrow morning.", status: "correct"}], feedback: "The recording says *завтра утром*."}
  ru.a2.unit29.lesson02.exercise04.match_repair_timing:
    instruction: "Match each repair phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "течёт кран", right: "the tap is leaking"}
          - {left: "мастер", right: "repair worker"}
          - {left: "придёт", right: "will come"}
          - {left: "завтра утром", right: "tomorrow morning"}
          - {left: "во сколько", right: "at what time"}
          - {left: "в девять часов", right: "at nine o'clock"}
        status: "correct"
    feedback: "These phrases report the leak and arrange timing."
  ru.a2.unit29.lesson02.exercise05.order_techet_kran: {instruction: "Put the words in order to say \"The tap is leaking in the kitchen.\"", accepted_answers: [{value: ["На", "кухне", "течёт", "кран"], status: "correct"}, {value: ["На", "кухне", "кран", "течёт"], status: "correct"}], feedback: "The correct order is *На кухне течёт кран*."}
  ru.a2.unit29.lesson02.exercise06.write_time_question:
    instruction: "Write a formal question asking what time the repair worker will come."
    accepted_answers:
      - {value: "Скажите, пожалуйста, во сколько придёт мастер?", status: "correct"}
      - {value: "Скажите пожалуйста во сколько придёт мастер?", status: "correct"}
      - {value: "Во сколько придёт мастер?", status: "correct"}
      - {value: "Скажите, пожалуйста, во сколько мастер придёт?", status: "correct"}
      - {value: "Во сколько мастер придёт?", status: "correct"}
      - {value: "Скажите, пожалуйста, во сколько придет мастер?", status: "correct"}
      - {value: "Во сколько придет мастер?", status: "correct"}
      - {value: "Скажите, пожалуйста, во сколько мастер придет?", status: "correct"}
      - {value: "Во сколько мастер придет?", status: "correct"}
    feedback: "The fuller formal model is *Скажите, пожалуйста, во сколько придёт мастер?*"
  ru.a2.unit29.lesson03.exercise01.choose_report: {instruction: "Which sentence reports a heating problem in an apartment?", correct_option: "У меня в квартире не работает отопление.", distractors: ["Мастер придёт завтра утром.", "Скажите, пожалуйста, во сколько?", "На кухне есть стол."], accepted_answers: [{value: "У меня в квартире не работает отопление.", status: "correct"}], feedback: "This reports the apartment problem directly."}
  ru.a2.unit29.lesson03.exercise02.dialogue_comprehension_repair:
    instruction: "Listen to the dialogue. What problems does Nastya report, and when will the repair worker come?"
    correct_option: "The heating is not working in the whole apartment and the kitchen tap is leaking; the repair worker will come tomorrow at nine"
    distractors: ["The bathroom light is broken; someone comes Friday", "A bank card is expensive; the employee comes at ten", "A passport copy is missing; no time is scheduled"]
    accepted_answers: [{value: "The heating is not working in the whole apartment and the kitchen tap is leaking; the repair worker will come tomorrow at nine", status: "correct"}]
    feedback: "Nastya reports heating and tap problems; the manager says tomorrow at nine."
  ru.a2.unit29.lesson03.exercise03.match_repair_dialogue:
    instruction: "Match each Russian line to its meaning."
    accepted_answers:
      - value:
          - {left: "У меня в квартире не работает отопление.", right: "The heating in my apartment is not working."}
          - {left: "Проблема в одной комнате?", right: "Is the problem in one room?"}
          - {left: "во всей квартире", right: "in the whole apartment"}
          - {left: "На кухне течёт кран.", right: "The kitchen tap is leaking."}
          - {left: "Мастер придёт завтра утром.", right: "The repair worker will come tomorrow morning."}
          - {left: "Во сколько?", right: "At what time?"}
        status: "correct"
    feedback: "These lines report the problem and arrange the repair."
  ru.a2.unit29.lesson03.exercise04.order_master_tomorrow: {instruction: "Put the words in order to say \"The repair worker will come tomorrow morning.\"", accepted_answers: [{value: ["Мастер", "придёт", "завтра", "утром"], status: "correct"}, {value: ["завтра", "утром", "Мастер", "придёт"], status: "correct"}], feedback: "The correct order is *Мастер придёт завтра утром*."}
  ru.a2.unit29.lesson03.exercise05.reply_problem_scope:
    instruction: "The manager asks whether the problem is in one room or the whole apartment. Answer: in the whole apartment, and the kitchen tap is leaking."
    accepted_answers:
