  ru.b1.unit48.lesson03.exercise01.choose_complete_plans: {instruction: "Which answer states a fixed plan, an intention, AND an uncertain prediction with a certainty marker, all in one?", correct_option: "В субботу мы идём в кино. Я собираюсь начать бегать по утрам. Наверное, завтра будет дождь.", distractors: ["Мне надо было взять зонт.", "Я хочу, чтобы вы прислали другого мастера.", "Тебе стоит меньше пить кофе вечером."], accepted_answers: [{value: "В субботу мы идём в кино. Я собираюсь начать бегать по утрам. Наверное, завтра будет дождь.", status: "correct"}], feedback: "The correct answer combines a fixed plan, an intention, and an uncertain prediction."}
