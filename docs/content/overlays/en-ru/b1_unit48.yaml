course:
  title: "Russian B1"
  description: "Learn B1-level Russian for describing fixed plans, intentions, and uncertain predictions with the right certainty markers, using present tense, собираюсь + infinitive, and наверное + future tense."

units:
  ru.b1.unit48.plany: {title: "Plans"}

lessons:
  ru.b1.unit48.lesson01.v_subbotu_idyom: {title: "On Saturday we're going..."}
  ru.b1.unit48.lesson02.sobirayus_nachat_begat: {title: "I'm planning to start..."}
  ru.b1.unit48.lesson03.subbota_dozhd: {title: "Saturday and the rain"}

teaching:
  ru.b1.unit48.lesson01.teach.v_subbotu_idyom_v_kino: {title: "В субботу мы идём в кино.", gloss: "On Saturday we're going to the cinema.", note: "Present tense used for a fixed, scheduled future arrangement.", example_gloss: null}
  ru.b1.unit48.lesson01.teach.u_nas_uzhe_est_bilety: {title: "У нас уже есть билеты.", gloss: "We already have tickets.", note: "Confirms the plan is fixed, not just an idea.", example_gloss: null}
  ru.b1.unit48.lesson01.teach.present_fixed_plan_grammar: {title: "настоящее время = точный план", gloss: "present tense = a fixed plan", note: "Russian uses the present tense of a motion verb (like идём) to describe a fixed, scheduled future arrangement.", example_gloss: "On Saturday we're going to the cinema — this is the present tense for a fixed plan."}
  ru.b1.unit48.lesson02.teach.sobirayus_nachat_begat: {title: "Я собираюсь начать бегать по утрам.", gloss: "I'm planning to start running in the mornings.", note: "*собираюсь* + infinitive expresses an intention, less fixed than a scheduled arrangement.", example_gloss: null}
  ru.b1.unit48.lesson02.teach.sobirayus_grammar: {title: "собираюсь + инфинитив = намерение", gloss: "sobirayus + infinitive = an intention", note: "Use собираюсь plus an infinitive to state a personal intention or plan you have decided on.", example_gloss: "I'm planning to start running in the mornings — this is an intention."}
  ru.b1.unit48.lesson02.teach.mozhet_byt_ty_tozhe: {title: "Может быть, ты тоже начнёшь бегать?", gloss: "Maybe you'll start running too?", note: "Invites the listener to share the intention.", example_gloss: null}
  ru.b1.unit48.lesson03.teach.nastya_plan: {title: "Nastya states the fixed plan", gloss: "Nastya: On Saturday we're going to the cinema. We already have tickets.", note: "Opens with a fixed, scheduled arrangement."}
  ru.b1.unit48.lesson03.teach.dima_intention: {title: "Dima states his intention", gloss: "Dima: Great! And I'm planning to start running in the mornings.", note: "Contrasts a personal intention with Nastya's fixed plan."}
  ru.b1.unit48.lesson03.teach.nastya_prediction: {title: "Nastya makes an uncertain prediction", gloss: "Nastya: Good idea. But it'll probably rain tomorrow.", note: "*наверное* + future tense marks an uncertain prediction."}
  ru.b1.unit48.lesson03.teach.dima_agree: {title: "Dima agrees and adjusts", gloss: "Dima: Yes, you're right. I'll run on Saturday instead.", note: "Responds to the prediction by adjusting the intention."}

exercises:
  ru.b1.unit48.lesson01.exercise01.recognize_v_subbotu_idyom: {instruction: "Which Russian phrase means \"on Saturday we're going to the cinema\"?", correct_option: "в субботу мы идём в кино", distractors: ["я собираюсь начать бегать", "наверное завтра будет дождь", "у нас уже есть билеты"], accepted_answers: [{value: "в субботу мы идём в кино", status: "correct"}], feedback: "Present tense here marks a fixed, scheduled plan."}
  ru.b1.unit48.lesson01.exercise02.recognize_bilety: {instruction: "Which Russian phrase means \"we already have tickets\"?", correct_option: "у нас уже есть билеты", distractors: ["в субботу мы идём в кино", "я собираюсь начать бегать", "может быть ты тоже начнёшь"], accepted_answers: [{value: "у нас уже есть билеты", status: "correct"}], feedback: "*У нас уже есть* means \"we already have.\""}
  ru.b1.unit48.lesson01.exercise03.listen_select_v_subbotu: {instruction: "Listen. What is the fixed plan?", correct_option: "Going to the cinema on Saturday.", distractors: ["Going running on Saturday.", "Going to the cinema next week.", "Staying home on Saturday."], accepted_answers: [{value: "Going to the cinema on Saturday.", status: "correct"}], feedback: "The recording says *В субботу мы идём в кино*."}
  ru.b1.unit48.lesson01.exercise04.match_fixed_plan_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "В субботу", right: "On Saturday"}
          - {left: "мы идём", right: "we're going"}
