      - {value: "Мы идем в кино в субботу.", status: "correct"}
      - {value: "Мы идем в кино в субботу", status: "correct"}
    feedback: "The model answer is *В субботу мы идём в кино*."
  ru.b1.unit48.lesson02.exercise01.recognize_sobirayus: {instruction: "Which Russian phrase means \"I'm planning to start running in the mornings\"?", correct_option: "я собираюсь начать бегать по утрам", distractors: ["в субботу мы идём в кино", "наверное завтра будет дождь", "может быть ты тоже начнёшь"], accepted_answers: [{value: "я собираюсь начать бегать по утрам", status: "correct"}], feedback: "*собираюсь* + infinitive states an intention."}
  ru.b1.unit48.lesson02.exercise02.recognize_mozhet_byt: {instruction: "Which Russian phrase means \"maybe you'll start running too?\"", correct_option: "может быть ты тоже начнёшь бегать", distractors: ["я собираюсь начать бегать", "у нас уже есть билеты", "наверное завтра будет дождь"], accepted_answers: [{value: "может быть ты тоже начнёшь бегать", status: "correct"}], feedback: "*Может быть* invites the listener to share the intention."}
  ru.b1.unit48.lesson02.exercise03.listen_select_sobirayus: {instruction: "Listen. What intention is stated?", correct_option: "Starting to run in the mornings.", distractors: ["Going to the cinema.", "Buying tickets.", "Fixing a faucet."], accepted_answers: [{value: "Starting to run in the mornings.", status: "correct"}], feedback: "The recording says *Я собираюсь начать бегать по утрам*."}
