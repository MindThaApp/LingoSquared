teaching:
  ru.a2.unit72.lesson01.teach.slova: {"title": "Train station words", "gloss": "train / station / shop / film / lesson / already", "note": "*Уже* means 'already' and usually stands before the verb.", "example_gloss": ["Dima is at the station.", "The train has already left.", "The shop has already closed.", "The film has already started.", "The lesson has already ended."]}
  ru.a2.unit72.lesson01.teach.glagoly: {"title": "Left and came", "gloss": "he left / she left / they left / he came / she came / they came", "note": "These are past forms of the perfective verbs *уйти* (to leave, go away) and *прийти* (to come, arrive on foot).", "example_gloss": ["Dima has already left.", "Nastya has already left.", "They have already left.", "Dima came to the station.", "Nastya came home."]}
  ru.a2.unit72.lesson01.teach.gn_uzhe: {"title": "Already: уже + past", "gloss": "The train has already left. The shop has already closed. The lesson has already ended.", "note": "Russian has no 'had done' tense. To say that something was already finished, use *уже* with the ordinary past tense of a perfective verb (*ушёл, закрылся, закончился*). The result is complete; the time frame comes from the context."}
  ru.a2.unit72.lesson01.teach.gn_rod: {"title": "Past tense agrees with the subject", "gloss": "Dima left. Nastya left. They left.", "note": "The past tense ends in *-л* for a masculine subject (*ушёл*), *-ла* for a feminine one (*ушла*) and *-ли* for plural (*ушли*). The verb *ушёл* is spelled with *ё*."}
  ru.a2.unit72.lesson01.teach.fraza: {"title": "A short story", "gloss": "I came, and the train had already left.", "note": "*А* joins two contrasting events: I arrived, but the train was already gone."}
  ru.a2.unit72.lesson02.teach.glagoly2: {"title": "More past forms", "gloss": "he arrived / she arrived / he called / she called / he bought / she bought / ticket", "note": "*Приехать* means to arrive by transport; *позвонить* is to phone someone (the person is in the dative: *Диме, Насте*).", "example_gloss": ["Dima arrived at the station.", "Nastya called Dima.", "Dima bought a ticket.", "I (a woman) arrived home."]}
  ru.a2.unit72.lesson02.teach.poteryal: {"title": "Lost and forgotten", "gloss": "lost (he) / lost (she) / forgot (he) / forgot (she) / wallet / phone / at home", "note": "*Потерял* means he lost something; *забыл* means he forgot or left something behind. Both are perfective.", "example_gloss": ["Dima lost his wallet.", "Nastya forgot her phone.", "I (a man) forgot my phone at home.", "I (a woman) lost my wallet."]}
  ru.a2.unit72.lesson02.teach.gn_kogda: {"title": "Когда + past, already + past", "gloss": "When I came to the station, the train had already left.", "note": "Both verbs are in the simple past. The word *уже* and the meaning show that the train left first. Put a comma between the *когда* clause and the main clause."}
  ru.a2.unit72.lesson02.teach.gn_ya: {"title": "Я and gender", "gloss": "When I came, Nastya had already left. When I came, Dima had already left.", "note": "*Я* can be a man or a woman, so the past tense shows who is speaking: *я пришёл* (a man) and *я пришла* (a woman). The verb in the other clause agrees with its own subject."}
  ru.a2.unit72.lesson02.teach.k_tomu: {"title": "By that time", "gloss": "By that time Nastya had already left.", "note": "*К тому времени* marks the later moment you are comparing with: 'by then'."}
  ru.a2.unit72.lesson03.teach.seq: {"title": "Sequence words", "gloss": "first / then / before / after / until, before / home / earlier", "note": "*Перед* takes the instrumental (*перед уроком*); *после* takes the genitive (*после урока*).", "example_gloss": ["First Dima bought a ticket, then he went to the station.", "Before the lesson Nastya called Dima.", "Nastya came home after the lesson.", "I called earlier."]}
  ru.a2.unit72.lesson03.teach.dotogo: {"title": "Before / after + clause", "gloss": "before (+ clause) / after (+ clause)", "note": "With a full clause use *до того как* and *после того как*.", "example_gloss": ["Before I came, the train left.", "After the train left, I called Nastya.", "After Nastya came home, she called Dima."]}
  ru.a2.unit72.lesson03.teach.gn_do_posle: {"title": "Past tense after both", "gloss": "Before I came, the train left. After the train left, I called Nastya.", "note": "After both *до того как* and *после того как* the verb is in the past. Note that *до того как я пришёл* uses a past form even though the train left first: the clause only names the point of comparison. Put a comma after the clause."}
  ru.a2.unit72.lesson03.teach.gn_perval: {"title": "First, then", "gloss": "First the train left, then I came. Before the lesson Nastya called.", "note": "A simpler way to give the order is *сначала ..., потом ...*. With a noun use *перед* or *после*: *перед уроком, после урока*."}
  ru.a2.unit72.lesson03.teach.a_potom: {"title": "Order of events", "gloss": "The train left, and then Dima came.", "note": "*А потом* adds the next event."}
  ru.a2.unit72.lesson04.teach.eshche: {"title": "Not yet, and late", "gloss": "still, yet / not yet / was late (he) / was late (she)", "note": "*Опоздать на поезд* means to miss the train by being late.", "example_gloss": ["Nastya has not come yet.", "The train has not left yet.", "Dima missed the train.", "I (a woman) was late for the lesson."]}
  ru.a2.unit72.lesson04.teach.gn_eshche_ne: {"title": "Ещё не: had not yet", "gloss": "When I came, Nastya had not come yet. When I called, the train had not left yet.", "note": "*Ещё не* + perfective past says that something had not happened yet at that moment. The verb stays in the ordinary past tense."}
  ru.a2.unit72.lesson04.teach.gn_uzhe_ili: {"title": "Уже or ещё не", "gloss": "The lesson has not started yet. The film has not ended yet. The lesson has already started.", "note": "*Уже* and *ещё не* are a pair: *уже начался* (it has begun) and *ещё не начался* (it has not begun yet)."}
  ru.a2.unit72.lesson04.teach.gn_porjadok: {"title": "Which event came first?", "gloss": "First the train left. Then I came. When I came, the train had already left.", "note": "The event with *уже* is the earlier one; the *когда* event is the later point you compare it with."}
  ru.a2.unit72.lesson04.teach.k_tomu_vremeni: {"title": "Not yet by then", "gloss": "By that time Dima had not called yet.", "note": "*К тому времени* works with both *уже* and *ещё не*."}
  ru.a2.unit72.lesson05.teach.slova5: {"title": "Words for a message", "gloss": "hi / another, different / that is why / now / I am calling", "note": "*Привет* is a friendly greeting. *Поэтому* gives a result. *Звоню* is the present tense: 'I am calling'.", "example_gloss": ["Hi, Nastya!", "I bought another ticket.", "I forgot my phone, so I did not call.", "Now I am calling Nastya."]}
  ru.a2.unit72.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! I missed the train. I forgot my phone at home, so I did not call you earlier. When I came to the station, the train had already left. After the train left, I bought a ticket for another train. Now I am calling you. Dima", "note": "Notice how the message gives the story in order: first the phone was forgotten, then the train left, then Dima bought a new ticket.", "glosses": {"тебе": "to you", "опоздал": "was late", "раньше": "earlier"}}
  ru.a2.unit72.lesson06.teach.t1_alo: {"title": "Nastya answers", "gloss": "Nastya: Hello, Dima! Where are you?"}
  ru.a2.unit72.lesson06.teach.t2_vokzal: {"title": "Dima explains", "gloss": "Dima: I am at the station. When I came, the train had already left."}
  ru.a2.unit72.lesson06.teach.t3_zhal: {"title": "Nastya is sorry", "gloss": "Nastya: Oh, what a pity! I have already gone home."}
  ru.a2.unit72.lesson06.teach.t4_bilet: {"title": "Dima has a plan", "gloss": "Dima: Never mind. I have already bought a ticket for another train."}
  ru.a2.unit72.lesson06.teach.t5_pochemu: {"title": "Nastya asks why", "gloss": "Nastya: Good. And why did you not call earlier?"}
  ru.a2.unit72.lesson06.teach.t6_telefon: {"title": "Dima answers", "gloss": "Dima: I forgot my phone at home. Now I am calling from another phone."}
exercises:
