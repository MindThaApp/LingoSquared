  ru.a2.unit72.lesson01.exercise03.match_events: {"instruction": "Match each Russian sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Поезд уже ушёл.", "right": "The train has already left."}, {"left": "Магазин уже закрылся.", "right": "The shop has already closed."}, {"left": "Фильм уже начался.", "right": "The film has already started."}, {"left": "Урок уже закончился.", "right": "The lesson has already ended."}, {"left": "Настя уже ушла.", "right": "Nastya has already gone."}, {"left": "Они уже ушли.", "right": "They have already departed."}], "status": "correct"}], "feedback": "Each sentence pairs *уже* with a perfective past verb."}
