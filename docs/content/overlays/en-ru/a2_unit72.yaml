  ru.a2.unit72.lesson01.poezd_ushel: {"title": "The train has left"}
  ru.a2.unit72.lesson02.kogda_ya_prishel: {"title": "When I came"}
  ru.a2.unit72.lesson03.do_i_posle: {"title": "Before and after"}
  ru.a2.unit72.lesson04.eshche_ne: {"title": "Not yet"}
  ru.a2.unit72.lesson05.soobshchenie: {"title": "Dima's message"}
