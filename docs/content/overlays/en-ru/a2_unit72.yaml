review: {status: "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the unit on saying that something had already happened before a later past event (уже, когда, до того как, после того как, ещё не). OPEN NATIVE QUESTIONS: (1) [resolved by reviewer: closing question removed so the message does not contradict the dialogue]; (2) is \"Поезд ушёл, а потом Дима пришёл.\" idiomatic A2 phrasing for the order of events; (3) confirm \"Сейчас я звоню с другого телефона.\" and \"К тому времени Дима ещё не позвонил.\" read naturally; (4) should \"приехал/приехала\" for arriving at a station be preferred over \"пришёл/пришла\" in the translation answers."}
course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Say that something had already happened before a later event, using уже, когда, до того как, после того как and ещё не."
units:
  ru.a2.unit72.poezd_uzhe_ushel: {"title": "The train had already left", "description": "Explain what had already happened before a certain moment: a train that left before you arrived, using the ordinary past tense of perfective verbs with уже and ещё не."}
