course:
  title: "Russian A1"
  description: "Learn A1-level Russian for asking about and expressing basic feelings with simple reasons."

units:
  ru.a1.unit22.emotions: {title: "How do you feel?"}

lessons:
  ru.a1.unit22.lesson01.ya_rad: {title: "I'm happy"}
  ru.a1.unit22.lesson02.ya_ustal: {title: "I'm tired"}
  ru.a1.unit22.lesson03.posle_raboty: {title: "Dialogue: after work"}

teaching:
  ru.a1.unit22.lesson01.teach.ya_rad: {title: "Я рад.", gloss: "I'm happy. (male speaker)", note: "Use рад if you are male and рада if you are female.", example_gloss: "Today I'm happy. (male speaker)"}
  ru.a1.unit22.lesson01.teach.ya_rada: {title: "Я рада.", gloss: "I'm happy. (female speaker)", note: "рада is used by a female speaker.", example_gloss: "Today I'm happy. (female speaker)"}
  ru.a1.unit22.lesson01.teach.grustno: {title: "грустно", gloss: "sad", note: "Мне грустно literally means \"to me it is sad,\" a common Russian feeling pattern.", example_gloss: "I feel sad."}
  ru.a1.unit22.lesson02.teach.ya_ustal: {title: "Я устал.", gloss: "I'm tired. (male speaker)", note: "устал is used by a male speaker.", example_gloss: "Today I'm tired. (male speaker)"}
  ru.a1.unit22.lesson02.teach.ya_ustala: {title: "Я устала.", gloss: "I'm tired. (female speaker)", note: "устала is used by a female speaker.", example_gloss: "Today I'm tired. (female speaker)"}
  ru.a1.unit22.lesson02.teach.potomu_chto: {title: "потому что", gloss: "because", note: "потому что gives a simple reason.", example_gloss: "I'm tired because there is a lot of work."}
  ru.a1.unit22.lesson03.teach.dima_kak_chuvstvuyesh: {title: "Dima asks how Nastya feels", gloss: "Dima: Nastya, how do you feel?", note: "Как ты себя чувствуешь? is informal ты register."}
  ru.a1.unit22.lesson03.teach.nastya_ustala: {title: "Nastya gives a feeling and reason", gloss: "Nastya: I'm tired because there is a lot of work today. And you?", note: "Настя uses устала because she is female."}
  ru.a1.unit22.lesson03.teach.dima_rad_vyhodnoy: {title: "Dima gives his feeling and reason", gloss: "Dima: I'm happy because tomorrow is a day off.", note: "Дима uses рад because he is male."}

exercises:
  ru.a1.unit22.lesson01.ya_rad.exercise09.dictation_ya_rad_neutral:
    instruction: "Type what you hear."
    correct_option: "Я рад"
    accepted_answers: [{value: "Я рад", status: correct}]
    orthography_strict: true

  ru.a1.unit22.lesson01.exercise01.recognize_rad:
    instruction: "Which word means \"happy\" for a male speaker?"
    correct_option: "рад"
    distractors: ["рада", "грустно", "устал"]
    accepted_answers: [{value: "рад", status: "correct"}]
    feedback: "рад means \"happy/glad\" for a male speaker."
  ru.a1.unit22.lesson01.exercise02.recognize_grustno:
    instruction: "Which word means \"sad\"?"
    correct_option: "грустно"
    distractors: ["рад", "рада", "мне"]
    accepted_answers: [{value: "грустно", status: "correct"}]
    feedback: "грустно means \"sad.\""
  ru.a1.unit22.lesson01.exercise03.listen_select_ya_rad:
    instruction: "Listen to the recording. How does the speaker feel?"
    correct_option: "Happy."
    distractors: ["Sad.", "Tired.", "Busy."]
    accepted_answers: [{value: "Happy.", status: "correct"}]
    feedback: "The recording says Я рад."
  ru.a1.unit22.lesson01.exercise04.match_feeling_words:
    instruction: "Match each Russian phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "Я рад.", right: "I'm happy. (male speaker)"}
          - {left: "Я рада.", right: "I'm happy. (female speaker)"}
          - {left: "Мне грустно.", right: "I feel sad."}
          - {left: "рад", right: "glad / happy"}
          - {left: "грустно", right: "sad"}
          - {left: "мне", right: "to me"}
        status: "correct"
    feedback: "рад/рада change by speaker gender; Мне грустно uses a different pattern."
  ru.a1.unit22.lesson01.exercise05.order_ya_rad:
    instruction: "Put the words in the correct order to say \"I'm happy\" for a male speaker."
    accepted_answers:
      - {value: ["Я", "рад"], status: "correct"}
    feedback: "The correct order is Я рад."
  ru.a1.unit22.lesson01.exercise06.listen_order_ya_rad:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Я", "рад"], status: "correct"}
    feedback: "The correct order is Я рад."
  ru.a1.unit22.lesson01.exercise07.complete_mne_grustno:
    instruction: "Complete the sentence: Мне ___. (sad)"
    accepted_answers:
      - {value: "грустно", status: "correct"}
      - {value: "Мне грустно", status: "correct"}
    feedback: "Мне грустно means \"I feel sad.\""
  ru.a1.unit22.lesson01.exercise08.write_happy:
    instruction: "Write a sentence saying you are happy: use \"Я рад\" for a male speaker or \"Я рада\" for a female speaker."
    accepted_answers:
      - {value: "Я рад.", status: "correct"}
      - {value: "Я рада.", status: "correct"}
      - {value: "Я рад", status: "correct"}
      - {value: "Я рада", status: "correct"}
    feedback: "Use Я рад for a male speaker or Я рада for a female speaker."

  ru.a1.unit22.lesson02.exercise01.recognize_ustal:
    instruction: "Which word means \"tired\" for a male speaker?"
    correct_option: "устал"
    distractors: ["устала", "рад", "потому что"]
    accepted_answers: [{value: "устал", status: "correct"}]
    feedback: "устал means \"tired\" for a male speaker."
  ru.a1.unit22.lesson02.exercise02.recognize_potomu_chto:
    instruction: "Which phrase means \"because\"?"
    correct_option: "потому что"
    distractors: ["много работы", "мне грустно", "я устал"]
    accepted_answers: [{value: "потому что", status: "correct"}]
    feedback: "потому что means \"because.\""
  ru.a1.unit22.lesson02.exercise03.listen_select_mne_grustno:
    instruction: "Listen to the recording. How does the speaker feel?"
    correct_option: "Sad."
    distractors: ["Happy.", "Tired.", "Off work."]
    accepted_answers: [{value: "Sad.", status: "correct"}]
    feedback: "The recording says Мне грустно."
  ru.a1.unit22.lesson02.exercise04.match_feeling_cause:
    instruction: "Match each Russian phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "Я устал.", right: "I'm tired. (male speaker)"}
          - {left: "Я устала.", right: "I'm tired. (female speaker)"}
          - {left: "потому что", right: "because"}
          - {left: "много работы", right: "a lot of work"}
          - {left: "Мне грустно.", right: "I feel sad."}
          - {left: "Я рад.", right: "I'm happy. (male speaker)"}
        status: "correct"
    feedback: "Use потому что to connect a feeling to a reason."
  ru.a1.unit22.lesson02.exercise05.order_ya_ustal:
    instruction: "Put the words in the correct order to say \"I'm tired\" for a male speaker."
    accepted_answers:
      - {value: ["Я", "устал"], status: "correct"}
    feedback: "The correct order is Я устал."
  ru.a1.unit22.lesson02.exercise06.listen_order_mne_grustno:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Мне", "грустно"], status: "correct"}
    feedback: "The correct order is Мне грустно."
  ru.a1.unit22.lesson02.exercise07.complete_potomu_chto:
    instruction: "Complete the sentence: Я устал, ___ много работы. (because)"
    accepted_answers:
      - {value: "потому что", status: "correct"}
      - {value: "Я устал, потому что много работы", status: "correct"}
    feedback: "потому что means \"because.\""
  ru.a1.unit22.lesson02.exercise08.write_tired_reason:
    instruction: "Write a sentence saying you are tired because there is a lot of work. Use \"устал\" for a male speaker or \"устала\" for a female speaker."
    accepted_answers:
      - {value: "Я устал, потому что много работы.", status: "correct"}
      - {value: "Я устала, потому что много работы.", status: "correct"}
      - {value: "Я устал, потому что много работы", status: "correct"}
      - {value: "Я устала, потому что много работы", status: "correct"}
    feedback: "A complete answer uses Я устал/устала, потому что много работы."

  ru.a1.unit22.lesson03.exercise01.choose_ask_feeling:
    instruction: "You want to ask a friend how they feel. What do you say?"
    correct_option: "Как ты себя чувствуешь?"
    distractors: ["Я рад.", "Мне грустно.", "Потому что много работы."]
    accepted_answers: [{value: "Как ты себя чувствуешь?", status: "correct"}]
    feedback: "Как ты себя чувствуешь? asks \"How do you feel?\""
  ru.a1.unit22.lesson03.exercise02.listen_select_kak_chuvstvuyesh:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "How do you feel?"
    distractors: ["Why are you tired?", "Are you working today?", "Is tomorrow a day off?"]
    accepted_answers: [{value: "How do you feel?", status: "correct"}]
    feedback: "The recording says Как ты себя чувствуешь?"
  ru.a1.unit22.lesson03.exercise03.dialogue_comprehension_posle_raboty:
    instruction: "Listen to the dialogue. How do Nastya and Dima feel, and why?"
    correct_option: "Nastya is tired because there is a lot of work; Dima is happy because tomorrow is a day off"
    distractors: ["Nastya is happy because tomorrow is a day off; Dima is sad", "Both are tired because of the weather", "Dima is tired because he works at school"]
    accepted_answers: [{value: "Nastya is tired because there is a lot of work; Dima is happy because tomorrow is a day off", status: "correct"}]
    feedback: "Настя says Я устала... много работы. Дима says Я рад... завтра выходной."
  ru.a1.unit22.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Как ты себя чувствуешь?", right: "How do you feel?"}
          - {left: "Я устала.", right: "I'm tired. (female speaker)"}
          - {left: "Потому что много работы.", right: "Because there is a lot of work."}
          - {left: "Я рад.", right: "I'm happy. (male speaker)"}
          - {left: "Завтра выходной.", right: "Tomorrow is a day off."}
          - {left: "А ты?", right: "And you?"}
        status: "correct"
    feedback: "These lines ask about and state feelings with reasons."
  ru.a1.unit22.lesson03.exercise05.order_kak_ty_sebya_chuvstvuyesh:
    instruction: "Put the words in the correct order to ask \"How do you feel?\""
    accepted_answers:
      - {value: ["Как", "ты", "себя", "чувствуешь"], status: "correct"}
    feedback: "The correct order is Как ты себя чувствуешь?"
  ru.a1.unit22.lesson03.exercise06.reply_kak_chuvstvuyesh:
    instruction: "Someone asks \"Как ты себя чувствуешь?\" Reply that you are tired because there is a lot of work today."
    accepted_answers:
      - {value: "Я устала, потому что сегодня много работы.", status: "correct"}
      - {value: "Я устал, потому что сегодня много работы.", status: "correct"}
      - {value: "Я устала, потому что сегодня много работы", status: "correct"}
      - {value: "Я устал, потому что сегодня много работы", status: "correct"}
    feedback: "Use Я устал/устала, потому что сегодня много работы."
  ru.a1.unit22.lesson03.exercise07.complete_ya_rad_potomu:
    instruction: "Complete the sentence: Я рад, ___ завтра выходной. (because)"
    accepted_answers:
      - {value: "потому что", status: "correct"}
      - {value: "Я рад, потому что завтра выходной", status: "correct"}
    feedback: "потому что introduces the reason."
  ru.a1.unit22.lesson03.exercise08.write_feeling_with_reason:
    instruction: "Write one of these meanings using \"потому что\": \"I am glad because tomorrow is a day off\" or \"I am tired because there is a lot of work.\""
    accepted_answers:
      - {value: "Я рад, потому что завтра выходной.", status: "correct"}
      - {value: "Я рад, потому что завтра выходной", status: "correct"}
      - {value: "Я рада, потому что завтра выходной.", status: "correct"}
      - {value: "Я рада, потому что завтра выходной", status: "correct"}
      - {value: "Я устал, потому что много работы.", status: "correct"}
      - {value: "Я устал, потому что много работы", status: "correct"}
      - {value: "Я устала, потому что много работы.", status: "correct"}
      - {value: "Я устала, потому что много работы", status: "correct"}
    feedback: "A complete answer states a feeling and a reason with потому что."
