course:
  title: "Russian A1"
  description: "Learn A1-level Russian for stating a basic occupation, workplace, and simple work activity, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit17.work: {title: "What do you work as?"}

lessons:
  ru.a1.unit17.lesson01.ya_vrach: {title: "I'm a doctor"}
  ru.a1.unit17.lesson02.kem_ty_rabotayesh: {title: "What do you work as?"}
  ru.a1.unit17.lesson03.kem_ty_rabotayesh_dima: {title: "Dialogue: what do you work as?"}

teaching:
  ru.a1.unit17.lesson01.teach.ya_vrach_rabotayu_v_bolnitse: {title: "Я врач. Я работаю в больнице.", gloss: "I'm a doctor. I work at a hospital.", note: "врач means \"doctor\" (the profession); работаю в + prepositional case means \"I work at/in.\""}
  ru.a1.unit17.lesson01.teach.uchitel: {title: "учитель", gloss: "teacher", note: "учитель means \"teacher.\" работает is the \"he/she works\" form of работать.", example_gloss: "She's a teacher. She works at a school."}
  ru.a1.unit17.lesson01.teach.inzhener: {title: "инженер", gloss: "engineer", note: "инженер means \"engineer.\" офис means \"office\"; в офисе is the prepositional form, \"in the office.\"", example_gloss: "He's an engineer. He works in an office."}

  ru.a1.unit17.lesson02.teach.kem_ty_rabotayesh: {title: "Кем ты работаешь?", gloss: "What do you work as?", note: "Кем ты работаешь? is the standard way to ask someone's job; кем is the instrumental case of \"who,\" used with работать."}
  ru.a1.unit17.lesson02.teach.prodavets: {title: "продавец", gloss: "salesperson / shop assistant", note: "продавец means \"salesperson\" (works in a shop). магазин means \"shop\"; в магазине is the prepositional form.", example_gloss: "He's a salesperson. He works at a shop."}
  ru.a1.unit17.lesson02.teach.povar: {title: "повар", gloss: "cook", note: "повар means \"cook.\" ресторан means \"restaurant\"; в ресторане is the prepositional form.", example_gloss: "She's a cook. She works at a restaurant."}

  ru.a1.unit17.lesson03.teach.nastya_kem_ty_rabotayesh: {title: "Nastya asks Dima's job", gloss: "Nastya: What do you work as, Dima?", note: "Настя opens with Кем ты работаешь, Дима?"}
  ru.a1.unit17.lesson03.teach.dima_inzhener_ofise: {title: "Dima answers and asks back", gloss: "Dima: I'm an engineer. I work in an office. And you?", note: "Дима answers Я инженер. Я работаю в офисе. А ты?"}
  ru.a1.unit17.lesson03.teach.nastya_uchitel_shkole: {title: "Nastya answers", gloss: "Nastya: I'm a teacher. I work at a school.", note: "Настя closes with Я учитель. Я работаю в школе."}

