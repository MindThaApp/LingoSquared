  ru.a2.unit31.lesson03.exercise01.choose_polite_alternative: {instruction: "Which sentence politely asks about another train?", correct_option: "Скажите, пожалуйста, есть другой поезд?", distractors: ["Мой поезд задерживается.", "Я не успею на пересадку.", "С третьей платформы."], accepted_answers: [{value: "Скажите, пожалуйста, есть другой поезд?", status: "correct"}], feedback: "This asks staff about an alternative option politely."}
