  ru.a2.unit31.lesson02.exercise02.recognize_platforma: {instruction: "Which word means \"platform\"?", correct_option: "платформа", distractors: ["поезд", "рейс", "отмена"], accepted_answers: [{value: "платформа", status: "correct"}], feedback: "*платформа* means \"platform.\""}
