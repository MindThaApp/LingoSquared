  ru.a2.unit31.lesson02.alternativa: {title: "Is there another train?"}
  ru.a2.unit31.lesson03.u_sotrudnika: {title: "Dialogue: with a staff member"}

teaching:
  ru.a2.unit31.lesson01.teach.zaderzhka: {title: "задержка", gloss: "delay", note: "*задержка поезда* means a train delay.", example_gloss: "A train delay."}
  ru.a2.unit31.lesson01.teach.zaderzhivaetsya: {title: "Поезд задерживается.", gloss: "The train is delayed.", note: "*задерживается* is used when transport is running late.", example_gloss: "The train is delayed by twenty minutes."}
  ru.a2.unit31.lesson01.teach.otmena: {title: "отмена", gloss: "cancellation", note: "*отмена рейса* means a service or trip has been cancelled.", example_gloss: "A service cancellation."}
  ru.a2.unit31.lesson02.teach.peresadka: {title: "пересадка", gloss: "connection / transfer", note: "*не успею на пересадку* means you will not make the connection.", example_gloss: "I will miss my connection."}
  ru.a2.unit31.lesson02.teach.drugoy_poezd: {title: "Есть другой поезд?", gloss: "Is there another train?", note: "*другой* means another or different.", example_gloss: "Is there another train in an hour?"}
  ru.a2.unit31.lesson02.teach.platforma: {title: "платформа", gloss: "platform", note: "*С какой платформы?* asks from which platform.", example_gloss: "From which platform?"}
  ru.a2.unit31.lesson03.teach.dima_delay: {title: "Dima explains the delay", gloss: "Dima: Hello. My train is delayed.", note: "He uses polite service-counter language."}
  ru.a2.unit31.lesson03.teach.dima_connection: {title: "Dima explains the consequence", gloss: "Dima: I will miss my connection.", note: "This gives the result of the delay."}
  ru.a2.unit31.lesson03.teach.staff_other_train: {title: "The staff member gives an alternative", gloss: "Staff member: I understand. There is another train in an hour.", note: "The staff member offers an alternative: *другой поезд через час* (another train in an hour)."}
