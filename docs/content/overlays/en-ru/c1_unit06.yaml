review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Overlay for ru's C1 unit06 on idiomatic, collocational, and figurative
    language. English-speaker interference risks: (1) these idioms are fixed
    set expressions whose meaning cannot be built from their parts (like
    English 'out of the blue'), so the production prompts name the exact idiom
    to use; (2) the literal reading of each idiom is a plausible wrong answer,
    so recognition exercises offer literal glosses as distractors; (3) Russian
    gendered past-tense would force a speaker-gender choice, so the culminating
    models use мы + plural past and are reproducible verbatim by any learner;
    (4) the culminating speaking and writing exercises each require the WHOLE
    act, and their accepted answers are the exact taught model. No
    sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    grading against backend/app/review/grading.py (casefold, internal
    punctuation, no ё/е folding, equal-token spoken grading, byte-strict
    dictation), prompt visibility (instruction + target_blocks only),
    accepted-answer coverage, glosses, titles and learner-visible notes.
    Fixes: lesson06.exercise01.recognize_polnyj: the Russian description was
    only in tested_text -> added it as a ru target_block and re-asked as 'In
    what order does this description present its ideas?' (old stem spelled out
    the answer); lesson06.exercise03.speak_polnyj: open prompt pinned to the
    exact taught model (Новость пришла как снег на голову, но мы засучили
    рукава. В итоге дело в шляпе.) and the equally correct three-sentence
    variant without но accepted; lesson06.exercise04.write_polnyj: accepted
    the ', но мы засучили рукава' joined rewrite (±period);
    lesson05.exercise03.match_rewrite: instruction -> 'Match each Russian
    sentence or word to its English meaning.'; lesson03.teach.modello_itog +
    lesson03.exercise02.listen_itog: дело glossed as 'deal' -> 'In the end,
    it's in the bag.' / 'In the end, it's all settled.' (distractor 'we lost
    the deal' -> 'we lost everything', feedback aligned); lesson05 title
    'Переписываю буквально' / 'Rewriting literally' -> 'От буквального к
    образному' / 'From literal to idiomatic'. NATIVE FLAG:
    lesson05.exercise04.write_rewrite_sneg -- decide whether 'Новость
    появилась как снег на голову' (original verb kept) should be accepted.
    DEFERRED (owner decision, backend/app/review/grading.py, Codex lane):
    em-dash token handling in spoken grading and ё/е folding for Russian.

course:
  title: "Russian C1"
  description: "Advanced Russian idiom and figurative language: use and interpret idiomatic and collocational expressions naturally and avoid literal calques."

units:
  ru.c1.unit06.idiomy:
    title: "Idioms and figurative language"
    description: "Understand and use Russian idioms, marked collocations, and metaphor naturally — and rewrite literal phrasing as idiomatic prose."

lessons:
  ru.c1.unit06.idiomy.lesson01.obrazno_ili_bukvalno:
    title: "Figurative or literal"
  ru.c1.unit06.idiomy.lesson02.rabotat_zasuchiv_rukava:
    title: "Working with your sleeves rolled up"
  ru.c1.unit06.idiomy.lesson03.delo_v_shlyape:
    title: "It's in the bag"
  ru.c1.unit06.idiomy.lesson04.chitayu_obraznyj_tekst:
    title: "Reading a figurative text"
  ru.c1.unit06.idiomy.lesson05.perepisyvayu_bukvalno:
    title: "From literal to idiomatic"
  ru.c1.unit06.idiomy.lesson06.polnyj_obraznyj_otvet:
    title: "The complete idiomatic response"

teaching:
  ru.c1.unit06.idiomy.lesson01.teach.v_dvukh_slovakh:
    title: "in a nutshell"
    gloss: "in a nutshell"
    note: "*В двух словах* ('in two words') is a fixed collocation meaning 'in a nutshell, briefly'. The words are literal, but the phrase is a set formula — no one is counting words."
  ru.c1.unit06.idiomy.lesson01.teach.kak_sneg_na_golovu:
    title: "out of the blue"
    gloss: "out of the blue"
    note: "*Как снег на голову* (lit. 'like snow on the head') means 'unexpectedly, out of the blue'. Its literal image has nothing to do with the weather."
  ru.c1.unit06.idiomy.lesson01.teach.modello_obraz:
    title: "A figurative opening"
    gloss: "In a nutshell: the news came out of the blue."
    note: "The collocation *в двух словах* opens the account; the idiom *как снег на голову* carries the unexpected news."

  ru.c1.unit06.idiomy.lesson02.teach.zasuchili_rukava:
    title: "we rolled up our sleeves"
    gloss: "we rolled up our sleeves"
    note: "*Засучили рукава* (lit. 'rolled up the sleeves') means to get down to serious work. *Мы* + plural past is gender-neutral."
  ru.c1.unit06.idiomy.lesson02.teach.ne_pokladaya_ruk:
    title: "worked tirelessly"
    gloss: "worked tirelessly"
    note: "*Не покладая рук* (lit. 'without laying down the hands') means 'tirelessly, without stopping'. *Покладая* is a fixed adverbial participle."
  ru.c1.unit06.idiomy.lesson02.teach.spustya_rukava:
    title: "carelessly"
    gloss: "carelessly / half-heartedly"
    note: "*Спустя рукава* (lit. 'having let down the sleeves') is the antonym of *засучив рукава* — doing something carelessly, without effort."
  ru.c1.unit06.idiomy.lesson02.teach.modello_usilie:
    title: "Hard work"
    gloss: "We rolled up our sleeves and worked tirelessly."
    note: "Pairs the effort idiom *засучили рукава* with *не покладая рук*."

  ru.c1.unit06.idiomy.lesson03.teach.delo_v_shlyape:
    title: "it's in the bag"
    gloss: "it's settled / in the bag"
    note: "*Дело в шляпе* (lit. 'the matter is in the hat') means the outcome is settled and success is guaranteed."
  ru.c1.unit06.idiomy.lesson03.teach.tyanut_kota:
    title: "to drag things out"
    gloss: "to drag things out"
    note: "*Тянуть кота за хвост* (lit. 'to pull the cat by its tail') means to drag something out, to delay needlessly."
  ru.c1.unit06.idiomy.lesson03.teach.s_gorem_popolam:
    title: "barely, with difficulty"
    gloss: "barely / with great difficulty"
    note: "*С горем пополам* (lit. 'with grief in half') means 'barely, with great difficulty'."
  ru.c1.unit06.idiomy.lesson03.teach.modello_itog:
    title: "The settled outcome"
    gloss: "In the end, it's in the bag."
    note: "*В итоге* ('in the end') introduces the closing idiom *дело в шляпе*."

  ru.c1.unit06.idiomy.lesson04.teach.u_tebya_zolotye_ruki:
    title: "you have golden hands"
    gloss: "Дима, you have golden hands"
    note: "Настя addresses Дима with informal ты: *Дима, у тебя золотые руки* ('you have golden hands') — a metaphor for great skill. *Тебя* is the ты form."
  ru.c1.unit06.idiomy.lesson04.teach.u_dimy_zolotye_ruki:
    title: "Дима has golden hands"
    gloss: "Дима has golden hands"
    note: "In narrative voice the same metaphor becomes *у Димы золотые руки* (*Димы* is the genitive of *Дима*)."
  ru.c1.unit06.idiomy.lesson04.teach.modello_text:
    title: "A figurative passage"
    gloss: "In a nutshell: the news came out of the blue. We rolled up our sleeves and worked tirelessly. Дима has golden hands, so in the end it's in the bag."
    note: "The passage mixes a marked collocation (*в двух словах*), idioms (*как снег на голову*, *не покладая рук*, *дело в шляпе*), and a metaphor (*золотые руки*)."

  ru.c1.unit06.idiomy.lesson05.teach.literal_novost:
    title: "the news appeared unexpectedly"
    gloss: "The news appeared unexpectedly."
    note: "This literal sentence states the fact plainly. The idiomatic rewrite replaces it with *как снег на голову*."
  ru.c1.unit06.idiomy.lesson05.teach.idiom_sneg:
    title: "the idiomatic rewrite"
    gloss: "The news came out of the blue."
    note: "*Новость пришла как снег на голову* is the natural idiomatic version of the literal sentence above."
  ru.c1.unit06.idiomy.lesson05.teach.literal_usilie:
    title: "we started working very diligently"
    gloss: "We started to work very diligently."
    note: "A literal, plain phrasing. The idiomatic rewrite uses *засучили рукава*."
  ru.c1.unit06.idiomy.lesson05.teach.idiom_rukava:
    title: "the idiomatic rewrite"
    gloss: "We rolled up our sleeves."
    note: "*Мы засучили рукава* is the natural idiomatic rewrite."

  ru.c1.unit06.idiomy.lesson06.teach.modello_polnyj:
    title: "The complete idiomatic description"
    gloss: "The news came out of the blue, but we rolled up our sleeves. In the end it's in the bag."
    note: "The complete model: idiom *как снег на голову* (surprise) + *засучили рукава* (hard work) + *дело в шляпе* (success). Gender-neutral (мы + plural past)."
  ru.c1.unit06.idiomy.lesson06.teach.idioma:
    title: "an idiom"
    gloss: "an idiom"
    note: "*Идиома* (idiom) is a set expression whose meaning is not the sum of its words."
    example_gloss: "«Like snow on the head» is an idiom."

exercises:
  ru.c1.unit06.idiomy.lesson01.exercise01.recognize_obraz:
    instruction: "Which Russian phrase means that something happened unexpectedly, as a complete surprise?"
    correct_option: "как снег на голову"
    distractors: ["в двух словах", "снег на голове", "дело в шляпе"]
    accepted_answers: [{value: "как снег на голову", status: correct}]
    feedback: "*Как снег на голову* means 'out of the blue' — the idiom, not a weather report."
  ru.c1.unit06.idiomy.lesson01.exercise02.listen_obraz:
    instruction: "Listen and select what the speaker means."
    correct_option: "In a nutshell: the news came as a complete surprise."
    distractors: ["In a nutshell: the news came very slowly.", "In a nutshell: the news was planned long in advance.", "In a nutshell: it started to snow."]
    accepted_answers: [{value: "In a nutshell: the news came as a complete surprise.", status: correct}]
    feedback: "В двух словах: новость пришла как снег на голову means in a nutshell, the news came as a complete surprise."
  ru.c1.unit06.idiomy.lesson01.exercise03.match_obraz:
    instruction: "Match each Russian expression to its English meaning."
    accepted_answers:
      - value: {"в двух словах": "in a nutshell", "как снег на голову": "out of the blue", "новость": "the news", "пришла": "came / arrived", "снег": "snow", "голову": "head"}
        status: correct
    feedback: "The idiom как снег на голову means 'out of the blue', not its literal parts."
  ru.c1.unit06.idiomy.lesson01.exercise04.order_obraz:
    instruction: "Put the Russian words in order to form the idiom."
    accepted_answers:
      - {value: "как снег на голову", status: correct}
    feedback: "The idiom is как снег на голову — out of the blue."
  ru.c1.unit06.idiomy.lesson01.exercise05.write_obraz:
    instruction: "Write the exact taught sentence: В двух словах plus новость пришла как снег на голову."
    accepted_answers:
      - {value: "В двух словах: новость пришла как снег на голову.", status: correct}
      - {value: "В двух словах: новость пришла как снег на голову", status: correct}
    feedback: "В двух словах: новость пришла как снег на голову."

  ru.c1.unit06.idiomy.lesson02.exercise01.recognize_usilie:
    instruction: "Which Russian phrase means to work tirelessly, without stopping?"
    correct_option: "не покладая рук"
    distractors: ["спустя рукава", "засучили рукава", "с горем пополам"]
    accepted_answers: [{value: "не покладая рук", status: correct}]
    feedback: "*Не покладая рук* means 'tirelessly'. Its antonym *спустя рукава* means 'carelessly'."
  ru.c1.unit06.idiomy.lesson02.exercise02.listen_usilie:
    instruction: "Listen and select what the speaker means."
    correct_option: "We rolled up our sleeves and worked tirelessly."
    distractors: ["We rolled up our sleeves and worked carelessly.", "We crossed our arms and stopped working.", "We rolled up our sleeves and worked only a little."]
    accepted_answers: [{value: "We rolled up our sleeves and worked tirelessly.", status: correct}]
    feedback: "Мы засучили рукава и работали не покладая рук means we rolled up our sleeves and worked tirelessly."
  ru.c1.unit06.idiomy.lesson02.exercise03.match_usilie:
    instruction: "Match each Russian effort idiom to its English meaning."
    accepted_answers:
      - value: {"Мы засучили рукава": "we rolled up our sleeves", "работали не покладая рук": "worked tirelessly", "спустя рукава": "carelessly / half-heartedly", "засучили": "rolled up", "покладая": "laying down", "спустя": "letting down"}
        status: correct
    feedback: "Rolling up your sleeves (засучили рукава) is the opposite of letting them down (спустя рукава)."
  ru.c1.unit06.idiomy.lesson02.exercise04.order_usilie:
    instruction: "Put the Russian words in order to form the phrase for working tirelessly."
    accepted_answers:
      - {value: "работали не покладая рук", status: correct}
    feedback: "The phrase is работали не покладая рук — worked tirelessly."
  ru.c1.unit06.idiomy.lesson02.exercise05.translate_usilie:
    instruction: "Translate into Russian: We rolled up our sleeves and worked tirelessly."
    accepted_answers:
      - {value: "Мы засучили рукава и работали не покладая рук.", status: correct}
      - {value: "Мы засучили рукава и работали не покладая рук", status: correct}
    feedback: "Мы засучили рукава и работали не покладая рук."

  ru.c1.unit06.idiomy.lesson03.exercise01.recognize_itog:
    instruction: "Which Russian phrase means that something is done and settled — a guaranteed success?"
    correct_option: "дело в шляпе"
    distractors: ["тянуть кота за хвост", "с горем пополам", "в двух словах"]
    accepted_answers: [{value: "дело в шляпе", status: correct}]
    feedback: "*Дело в шляпе* means 'it's settled, in the bag' — the outcome is guaranteed."
  ru.c1.unit06.idiomy.lesson03.exercise02.listen_itog:
    instruction: "Listen and select what the speaker means."
    correct_option: "In the end, it's all settled."
    distractors: ["In the end, everything fell apart.", "In the end, the plan is still undecided.", "In the end, we lost everything."]
    accepted_answers: [{value: "In the end, it's all settled.", status: correct}]
    feedback: "В итоге дело в шляпе means in the end, it's all settled — it's in the bag."
  ru.c1.unit06.idiomy.lesson03.exercise03.match_itog:
    instruction: "Match each Russian outcome idiom to its English meaning."
    accepted_answers:
      - value: {"дело в шляпе": "it's settled / in the bag", "тянуть кота за хвост": "to drag things out", "с горем пополам": "barely / with great difficulty", "шляпе": "hat", "кота": "the cat", "горем": "grief"}
        status: correct
    feedback: "Дело в шляпе means 'in the bag'; тянуть кота за хвост means 'to drag things out'."
  ru.c1.unit06.idiomy.lesson03.exercise04.order_itog:
    instruction: "Put the Russian words in order to form the idiom for dragging things out."
    accepted_answers:
      - {value: "тянуть кота за хвост", status: correct}
    feedback: "The idiom is тянуть кота за хвост — to drag things out."
  ru.c1.unit06.idiomy.lesson03.exercise05.write_itog:
    instruction: "Write the exact taught sentence that uses the idiom дело в шляпе to say the outcome is settled."
    accepted_answers:
      - {value: "В итоге дело в шляпе.", status: correct}
      - {value: "В итоге дело в шляпе", status: correct}
    feedback: "В итоге дело в шляпе."

  ru.c1.unit06.idiomy.lesson04.exercise01.listen_zolotye:
    instruction: "Listen and select what Настя means."
    correct_option: "Дима, you are very skilled."
    distractors: ["Дима, your hands are literally made of gold.", "Дима, go wash your hands.", "Дима, your hands are cold."]
    accepted_answers: [{value: "Дима, you are very skilled.", status: correct}]
    feedback: "Дима, у тебя золотые руки means Дима, you have golden hands — you are very skilled."
  ru.c1.unit06.idiomy.lesson04.exercise02.read_text:
    instruction: "How does the idiom «как снег на голову» shape the opening of the passage?"
    correct_option: "It presents the news as sudden and unexpected."
    distractors: ["It describes the weather that day.", "It says the news was long expected.", "It means the news was unimportant."]
    accepted_answers: [{value: "It presents the news as sudden and unexpected.", status: correct}]
    feedback: "«Как снег на голову» presents the news as sudden and unexpected — figurative, not a weather report."
  ru.c1.unit06.idiomy.lesson04.exercise03.interpret_metafora:
    instruction: "What does the metaphor «золотые руки» tell you about Дима?"
    correct_option: "He is highly skilled."
    distractors: ["He literally has gold-colored hands.", "He is careless.", "He is wealthy."]
    accepted_answers: [{value: "He is highly skilled.", status: correct}]
    feedback: "«Золотые руки» is a metaphor for great skill, not a literal description of his hands."
  ru.c1.unit06.idiomy.lesson04.exercise04.match_funkcii:
    instruction: "Match each expression from the passage to what it contributes."
    accepted_answers:
      - value: {"в двух словах": "marked collocation — 'in brief'", "как снег на голову": "idiom — 'out of the blue'", "не покладая рук": "idiom — 'tirelessly'", "золотые руки": "metaphor — 'great skill'", "дело в шляпе": "idiom — 'settled / done'", "засучили рукава": "idiom — 'got to work'"}
        status: correct
    feedback: "The passage blends a collocation, idioms, and a metaphor — each with a non-literal meaning."

  ru.c1.unit06.idiomy.lesson05.exercise01.recognize_rewrite:
    instruction: "Which sentence is the natural idiomatic rewrite of «Новость появилась неожиданно»?"
    correct_option: "Новость пришла как снег на голову"
    distractors: ["Новость появилась неожиданно", "Новость пришла неожиданно", "Новость была неожиданной"]
    accepted_answers: [{value: "Новость пришла как снег на голову", status: correct}]
    feedback: "*Новость пришла как снег на голову* is the idiomatic rewrite — the news came out of the blue."
  ru.c1.unit06.idiomy.lesson05.exercise02.listen_rewrite:
    instruction: "Listen and select what the speaker means."
    correct_option: "We rolled up our sleeves and got to work."
    distractors: ["We put on long sleeves.", "We lowered our sleeves and worked carelessly.", "We bought new sleeves."]
    accepted_answers: [{value: "We rolled up our sleeves and got to work.", status: correct}]
    feedback: "Мы засучили рукава means we rolled up our sleeves — we got down to serious work."
  ru.c1.unit06.idiomy.lesson05.exercise03.match_rewrite:
    instruction: "Match each Russian sentence or word to its English meaning."
    accepted_answers:
      - value: {"Новость появилась неожиданно": "the news appeared unexpectedly (literal)", "Новость пришла как снег на голову": "the news came out of the blue (idiomatic)", "Мы начали работать очень усердно": "we started working very diligently (literal)", "Мы засучили рукава": "we rolled up our sleeves (idiomatic)", "появилась": "appeared", "усердно": "diligently"}
        status: correct
    feedback: "Literal phrasing states the fact; the idiomatic rewrite uses the taught idiom."
  ru.c1.unit06.idiomy.lesson05.exercise04.write_rewrite_sneg:
    instruction: "Rewrite this literal sentence using the taught idiom как снег на голову: «Новость появилась неожиданно.»"
    accepted_answers:
      - {value: "Новость пришла как снег на голову.", status: correct}
      - {value: "Новость пришла как снег на голову", status: correct}
    feedback: "Новость пришла как снег на голову."
  ru.c1.unit06.idiomy.lesson05.exercise05.write_rewrite_rukava:
    instruction: "Rewrite this literal sentence using the taught idiom засучили рукава: «Мы начали работать очень усердно.»"
    accepted_answers:
      - {value: "Мы засучили рукава.", status: correct}
      - {value: "Мы засучили рукава", status: correct}
    feedback: "Мы засучили рукава."

  ru.c1.unit06.idiomy.lesson06.exercise01.recognize_polnyj:
    instruction: "In what order does this description present its ideas?"
    correct_option: "surprise → hard work → success"
    distractors: ["success → hard work → surprise", "surprise → success → hard work", "hard work → surprise → success"]
    accepted_answers: [{value: "surprise → hard work → success", status: correct}]
    feedback: "The description runs from the surprise (как снег на голову), through the work (засучили рукава), to the outcome (дело в шляпе)."
  ru.c1.unit06.idiomy.lesson06.exercise02.match_review:
    instruction: "Match each taught idiom to its meaning."
    accepted_answers:
      - value: {"в двух словах": "in a nutshell", "как снег на голову": "out of the blue", "засучили рукава": "rolled up their sleeves", "не покладая рук": "tirelessly", "спустя рукава": "carelessly", "дело в шляпе": "settled / in the bag", "золотые руки": "great skill", "идиома": "an idiom"}
        status: correct
    feedback: "These are the idioms and collocations of the unit — each a fixed, non-literal expression."
  ru.c1.unit06.idiomy.lesson06.exercise03.speak_polnyj:
    instruction: "Say aloud the exact taught complete description of how the project went: start with Новость пришла как снег на голову for the surprise, continue with но мы засучили рукава for getting down to work, and close with В итоге дело в шляпе for the successful outcome."
    accepted_answers:
      - {value: "Новость пришла как снег на голову, но мы засучили рукава. В итоге дело в шляпе.", status: correct}
      - {value: "Новость пришла как снег на голову, но мы засучили рукава. В итоге дело в шляпе", status: correct}
      - {value: "Новость пришла как снег на голову. Мы засучили рукава. В итоге дело в шляпе.", status: correct}
    feedback: "Новость пришла как снег на голову, но мы засучили рукава. В итоге дело в шляпе."
  ru.c1.unit06.idiomy.lesson06.exercise04.write_polnyj:
    instruction: "Rewrite these two literal sentences into natural idiomatic Russian, using как снег на голову and засучили рукава: «Новость появилась неожиданно. Мы начали работать очень усердно.»"
    accepted_answers:
      - {value: "Новость пришла как снег на голову. Мы засучили рукава.", status: correct}
      - {value: "Новость пришла как снег на голову. Мы засучили рукава", status: correct}
      - {value: "Новость пришла как снег на голову, но мы засучили рукава.", status: correct}
