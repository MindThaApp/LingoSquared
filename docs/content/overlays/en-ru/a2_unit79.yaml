course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Explain why something happened or is so, with потому что and поэтому."
units:
  ru.a2.unit79.potomu_chto_poetomu: {"title": "Why? Because, so", "description": "Give a reason with потому что, state a result with поэтому, and answer почему."}
lessons:
  ru.a2.unit79.lesson01.pochemu: {"title": "Why? Because"}
  ru.a2.unit79.lesson02.poetomu: {"title": "So, that is why"}
  ru.a2.unit79.lesson03.kontrast: {"title": "Because or so"}
  ru.a2.unit79.lesson04.ne_prishel: {"title": "Why did you not come"}
  ru.a2.unit79.lesson05.soobshchenie: {"title": "Nastya's message"}
  ru.a2.unit79.lesson06.dialog: {"title": "Why did you not come"}
teaching:
  ru.a2.unit79.lesson01.teach.pochemu: {"title": "Why and because", "gloss": "why / because / at home / tired (man) / tired (woman) / it is cold / late", "note": "*Почему* asks for a reason and the answer begins with *потому что*. *Устал* is for a man, *устала* for a woman.", "example_gloss": ["Why are you at home?", "Because it is raining.", "Dima is at home because he is tired.", "Nastya is not walking because it is cold.", "We are not going to the cinema because it is already late."]}
  ru.a2.unit79.lesson01.teach.gn_pochemu: {"title": "Why? Because", "gloss": "Why are you at home? Because it is raining.", "note": "*Почему* asks the reason. The answer starts with *потому что* and then comes a clause with its own verb: *идёт дождь*."}
  ru.a2.unit79.lesson01.teach.gn_clause: {"title": "Reason after a comma", "gloss": "Dima is at home because he is tired. Nastya is at home because she is tired.", "note": "Put a comma before *потому что*. The tired person is named again with *он* or *она*, and *устал/устала* agrees with it."}
  ru.a2.unit79.lesson02.teach.poetomu: {"title": "So and sleep", "gloss": "so / to sleep / a lot / drinks / tea", "note": "*Поэтому* introduces the result. The reason comes first, then a comma, then *поэтому*.", "example_gloss": ["It is raining, so we are at home.", "It is already late, so I am going to sleep.", "Dima works a lot, so he is tired.", "It is cold, so Nastya drinks tea."]}
  ru.a2.unit79.lesson02.teach.gn_poetomu: {"title": "Reason, then result", "gloss": "It is raining, so we are at home.", "note": "*Поэтому* starts the second part and tells the result of the first: first the reason, then *поэтому* and the result."}
  ru.a2.unit79.lesson02.teach.gn_both: {"title": "Two ways, one meaning", "gloss": "We are at home because it is raining. It is raining, so we are at home.", "note": "Both sentences say the same. After *потому что* comes the reason; after *поэтому* comes the result. The word order inside each part does not change."}
  ru.a2.unit79.lesson03.teach.hochu: {"title": "Thirsty and tired", "gloss": "I want / he wants / to drink / (we) are tired / I drink", "note": "*Хочу пить* literally means 'I want to drink', which is how Russians say 'I am thirsty'.", "example_gloss": ["I am thirsty.", "Dima is thirsty, so he drinks tea.", "We are tired, so we are going home.", "I am drinking tea because I am thirsty."]}
  ru.a2.unit79.lesson03.teach.gn_contrast: {"title": "What happened and why", "gloss": "I am drinking tea because I am thirsty. I am thirsty, so I am drinking tea.", "note": "Ask yourself which part is the reason. After *потому что* stands the reason; after *поэтому* stands the result."}
  ru.a2.unit79.lesson03.teach.gn_short: {"title": "Short answers", "gloss": "Why are you drinking tea? Because I am thirsty.", "note": "A short answer can begin with *Потому что* and stand alone. Do not use *поэтому* to answer *почему*."}
  ru.a2.unit79.lesson04.teach.past: {"title": "Came, worked, was ill", "gloss": "came (man) / came (woman) / worked (man) / was ill (woman) / forgot (woman) / called (woman)", "note": "Past forms agree with the person: *пришёл* for a man, *пришла* for a woman. Both the question and the answer can be in the past.", "example_gloss": ["Why did you not come? (to a man)", "Because I worked a lot.", "Why did Nastya not come?", "Because she was ill.", "Why did you not call? Because I forgot. (to a woman)"]}
  ru.a2.unit79.lesson04.teach.gn_q: {"title": "Question and answer in the past", "gloss": "Why did you not come? Because I was working.", "note": "The question has *не* before the verb. The answer repeats the person (*я*) and gives the reason in the past."}
  ru.a2.unit79.lesson04.teach.gn_pair: {"title": "Because or so", "gloss": "Nastya was ill, so she did not come. Nastya did not come because she was ill.", "note": "The same facts can be told in either order: *поэтому* after the reason, *потому что* before it."}
  ru.a2.unit79.lesson05.teach.v5: {"title": "Words for the message", "gloss": "yesterday / today / tomorrow / I feel better / I will come / sorry", "note": "*Мне лучше* is a fixed phrase: 'I feel better'. *Приду* is the future of 'to come' and means a single arrival.", "example_gloss": ["Yesterday I did not come.", "Today I am at home.", "I feel better.", "Tomorrow I will come.", "Sorry, Dima!"]}
  ru.a2.unit79.lesson05.teach.reading: {"title": "Nastya writes to Dima", "gloss": "Hi, Dima! Yesterday I did not come because I was ill. Sorry! Today I am at home because it is cold. I feel better, so I will come tomorrow. Bye! Nastya", "note": "The message uses both *потому что* and *поэтому*.", "glosses": {"приду": "I will come", "лучше": "better"}}
  ru.a2.unit79.lesson06.teach.q: {"title": "Dima asks why", "gloss": "Дима: Nastya, hi! Why did you not come yesterday?"}
  ru.a2.unit79.lesson06.teach.a: {"title": "Nastya gives reasons", "gloss": "Настя: Because I was ill. Today I am at home because it is cold."}
  ru.a2.unit79.lesson06.teach.q2: {"title": "Dima asks how she is", "gloss": "Дима: How are you?"}
  ru.a2.unit79.lesson06.teach.a2: {"title": "Nastya says she feels better", "gloss": "Настя: I feel better, so I will come tomorrow."}
  ru.a2.unit79.lesson06.teach.end: {"title": "Dima says goodbye", "gloss": "Дима: Good! Bye, Nastya."}
exercises:
  ru.a2.unit79.lesson01.exercise01.q: {"instruction": "Choose the correct Russian question.", "correct_option": "Почему ты дома?", "distractors": ["Где ты дома?", "Когда ты дома?", "Кто дома?"], "accepted_answers": [{"value": "Почему ты дома?", "status": "correct"}], "feedback": "*Почему* = why."}
  ru.a2.unit79.lesson01.exercise02.cold: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя не гуляет, потому что холодно.", "distractors": ["Настя не гуляет, потому что идёт дождь.", "Настя гуляет, потому что холодно.", "Настя не гуляет, почему холодно."], "accepted_answers": [{"value": "Настя не гуляет, потому что холодно.", "status": "correct"}], "feedback": "*Потому что* introduces the reason."}
  ru.a2.unit79.lesson01.exercise03.w1: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "почему", "right": "why"}, {"left": "потому что", "right": "because"}, {"left": "дома", "right": "at home"}, {"left": "устал", "right": "tired (a man)"}, {"left": "устала", "right": "tired (a woman)"}, {"left": "холодно", "right": "it is cold"}, {"left": "поздно", "right": "late"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit79.lesson01.exercise04.home: {"instruction": "Put the words in order to say 'We are at home because it is raining.'", "correct_option": "Мы дома потому что идёт дождь", "accepted_answers": [{"value": "Мы дома потому что идёт дождь", "status": "correct"}], "feedback": "Comma before *потому что*."}
  ru.a2.unit79.lesson01.exercise05.tired: {"instruction": "Complete the sentence: 'Dima is at home because he is tired.'", "correct_option": "устал", "accepted_answers": [{"value": "устал", "status": "correct"}], "feedback": "*Дима* is masculine: *устал*."}
  ru.a2.unit79.lesson01.exercise06.cinema: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Мы не идём в кино, потому что уже поздно.", "status": "correct"}, {"value": "Мы не идём в кино, потому что уже поздно", "status": "correct"}, {"value": "Мы не идём в кино, потому что поздно.", "status": "correct"}, {"value": "Мы не идём в кино, потому что поздно", "status": "correct"}], "feedback": "*Потому что* + the reason."}
  ru.a2.unit79.lesson01.exercise07.nastya: {"instruction": "Write the requested Russian sentence.", "correct_option": "Настя дома, потому что она устала.", "accepted_answers": [{"value": "Настя дома, потому что она устала.", "status": "correct"}, {"value": "Настя дома, потому что она устала", "status": "correct"}, {"value": "Настя дома, потому что устала.", "status": "correct"}, {"value": "Настя дома, потому что устала", "status": "correct"}], "feedback": "*Настя* is feminine: *устала*."}
  ru.a2.unit79.lesson02.exercise01.late: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Уже поздно, поэтому я иду спать.", "distractors": ["Уже поздно, потому что я иду спать.", "Я иду спать, поэтому уже поздно.", "Уже поздно, почему я иду спать."], "accepted_answers": [{"value": "Уже поздно, поэтому я иду спать.", "status": "correct"}], "feedback": "*Поэтому* is followed by the result."}
  ru.a2.unit79.lesson02.exercise02.work: {"instruction": "Choose the correct English meaning.", "correct_option": "Dima works a lot, so he is tired.", "distractors": ["Dima is tired, so he works a lot.", "Dima works a lot, but he is not tired.", "Dima works a lot because he is tired."], "accepted_answers": [{"value": "Dima works a lot, so he is tired.", "status": "correct"}], "feedback": "The result (he is tired) comes after *поэтому*."}
  ru.a2.unit79.lesson02.exercise03.w2: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "поэтому", "right": "so, that is why"}, {"left": "спать", "right": "to sleep"}, {"left": "много", "right": "a lot"}, {"left": "чай", "right": "tea"}, {"left": "пьёт", "right": "drinks"}, {"left": "уже поздно", "right": "it is already late"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit79.lesson02.exercise04.tea: {"instruction": "Put the words in order to say 'It is cold, so Nastya drinks tea.'", "correct_option": "Холодно поэтому Настя пьёт чай", "accepted_answers": [{"value": "Холодно поэтому Настя пьёт чай", "status": "correct"}], "feedback": "Reason first, then *поэтому* and the result."}
  ru.a2.unit79.lesson02.exercise05.so: {"instruction": "Complete the sentence: 'It is already late, so I am going to sleep.'", "correct_option": "поэтому", "accepted_answers": [{"value": "поэтому", "status": "correct"}], "feedback": "The result follows *поэтому*."}
  ru.a2.unit79.lesson02.exercise06.rain: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Идёт дождь, поэтому мы дома.", "status": "correct"}, {"value": "Идёт дождь, поэтому мы дома", "status": "correct"}], "feedback": "*Поэтому* + the result."}
  ru.a2.unit79.lesson02.exercise07.tea2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Холодно, поэтому Настя пьёт чай.", "accepted_answers": [{"value": "Холодно, поэтому Настя пьёт чай.", "status": "correct"}, {"value": "Холодно, поэтому Настя пьёт чай", "status": "correct"}], "feedback": "Reason first, then *поэтому* and the result."}
  ru.a2.unit79.lesson03.exercise01.tired: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы устали, поэтому мы идём домой.", "distractors": ["Мы устали, потому что мы идём домой.", "Мы идём домой, поэтому мы устали.", "Мы устали, почему мы идём домой."], "accepted_answers": [{"value": "Мы устали, поэтому мы идём домой.", "status": "correct"}], "feedback": "The result (going home) follows *поэтому*."}
  ru.a2.unit79.lesson03.exercise02.why_tea: {"instruction": "Choose the correct answer.", "correct_option": "Потому что он хочет пить.", "distractors": ["Поэтому он хочет пить.", "Потому что он пьёт чай.", "Поэтому он пьёт чай."], "accepted_answers": [{"value": "Потому что он хочет пить.", "status": "correct"}], "feedback": "An answer to *почему* begins with *потому что*."}
  ru.a2.unit79.lesson03.exercise03.w3: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "я хочу", "right": "I want"}, {"left": "он хочет", "right": "he wants"}, {"left": "хочу пить", "right": "I am thirsty"}, {"left": "мы устали", "right": "we are tired"}, {"left": "потому что", "right": "because"}, {"left": "поэтому", "right": "so, that is why"}], "status": "correct"}], "feedback": "Do not mix up the reason and the result."}
  ru.a2.unit79.lesson03.exercise04.home: {"instruction": "Put the words in order to say 'We are tired, so we are going home.'", "correct_option": "Мы устали поэтому мы идём домой", "accepted_answers": [{"value": "Мы устали поэтому мы идём домой", "status": "correct"}], "feedback": "Reason first, then *поэтому*."}
  ru.a2.unit79.lesson03.exercise05.tired2: {"instruction": "Complete the sentence: 'We are going home because we are tired.'", "correct_option": "устали", "accepted_answers": [{"value": "устали", "status": "correct"}], "feedback": "*Мы* takes the plural *устали*."}
  ru.a2.unit79.lesson03.exercise06.dima: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Дима хочет пить, поэтому он пьёт чай.", "status": "correct"}, {"value": "Дима хочет пить, поэтому он пьёт чай", "status": "correct"}], "feedback": "*Хочет пить* = is thirsty."}
  ru.a2.unit79.lesson03.exercise07.tea3: {"instruction": "Write the requested Russian sentence.", "correct_option": "Я пью чай, потому что я хочу пить.", "accepted_answers": [{"value": "Я пью чай, потому что я хочу пить.", "status": "correct"}, {"value": "Я пью чай, потому что я хочу пить", "status": "correct"}, {"value": "Я пью чай, потому что хочу пить.", "status": "correct"}, {"value": "Я пью чай, потому что хочу пить", "status": "correct"}], "feedback": "The reason comes after *потому что*."}
  ru.a2.unit79.lesson04.exercise01.ans: {"instruction": "Choose the correct answer.", "correct_option": "Потому что я работал.", "distractors": ["Поэтому я работал.", "Потому что я работала.", "Потому что ты работал."], "accepted_answers": [{"value": "Потому что я работал.", "status": "correct"}], "feedback": "The speaker is a man (*пришёл*), so *работал*."}
  ru.a2.unit79.lesson04.exercise02.qn: {"instruction": "Choose the correct Russian question.", "correct_option": "Почему Настя не пришла?", "distractors": ["Почему Настя не пришёл?", "Почему Настя не пришли?", "Почему Настя пришла?"], "accepted_answers": [{"value": "Почему Настя не пришла?", "status": "correct"}], "feedback": "*Настя* is feminine: *пришла*."}
  ru.a2.unit79.lesson04.exercise03.w4: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "пришёл", "right": "came (a man)"}, {"left": "пришла", "right": "came (a woman)"}, {"left": "работал", "right": "worked (a man)"}, {"left": "болела", "right": "was ill (a woman)"}, {"left": "забыла", "right": "forgot (a woman)"}, {"left": "позвонила", "right": "called (a woman)"}], "status": "correct"}], "feedback": "Past forms show who did it."}
  ru.a2.unit79.lesson04.exercise04.q: {"instruction": "Put the words in order to ask 'Why did Nastya not come?'", "correct_option": "Почему Настя не пришла", "accepted_answers": [{"value": "Почему Настя не пришла", "status": "correct"}, {"value": "Почему не пришла Настя", "status": "correct"}], "feedback": "*Не* stands before the verb."}
  ru.a2.unit79.lesson04.exercise05.ill: {"instruction": "Complete the sentence: 'Nastya did not come because she was ill.'", "correct_option": "болела", "accepted_answers": [{"value": "болела", "status": "correct"}], "feedback": "*Она* (Nastya): *болела*."}
  ru.a2.unit79.lesson04.exercise06.work: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я не пришёл, потому что я работал.", "status": "correct"}, {"value": "Я не пришёл, потому что я работал", "status": "correct"}, {"value": "Я не пришёл, потому что работал.", "status": "correct"}, {"value": "Я не пришёл, потому что работал", "status": "correct"}], "feedback": "A man says *пришёл* and *работал*."}
  ru.a2.unit79.lesson04.exercise07.call: {"instruction": "Write the requested Russian sentence.", "correct_option": "Я не позвонила, потому что я забыла.", "accepted_answers": [{"value": "Я не позвонила, потому что я забыла.", "status": "correct"}, {"value": "Я не позвонила, потому что я забыла", "status": "correct"}, {"value": "Я не позвонила, потому что забыла.", "status": "correct"}, {"value": "Я не позвонила, потому что забыла", "status": "correct"}], "feedback": "A woman says *позвонила* and *забыла*."}
  ru.a2.unit79.lesson05.exercise01.r1: {"instruction": "Read the text and choose the answer.", "correct_option": "She was ill.", "distractors": ["She was working.", "She forgot.", "It was raining."], "accepted_answers": [{"value": "She was ill.", "status": "correct"}], "feedback": "*Потому что я болела.*"}
  ru.a2.unit79.lesson05.exercise02.r2: {"instruction": "Read the text and choose the answer.", "correct_option": "She feels better.", "distractors": ["It is warm.", "Dima called her.", "She has a day off."], "accepted_answers": [{"value": "She feels better.", "status": "correct"}], "feedback": "*Мне лучше, поэтому завтра я приду.*"}
  ru.a2.unit79.lesson05.exercise03.m5: {"instruction": "Match each sentence from the message to its English meaning.", "accepted_answers": [{"value": [{"left": "Вчера я не пришла.", "right": "Yesterday I did not come."}, {"left": "Я болела.", "right": "I was ill."}, {"left": "Сегодня я дома.", "right": "Today I am at home."}, {"left": "Холодно.", "right": "It is cold."}, {"left": "Мне лучше.", "right": "I feel better."}, {"left": "Завтра я приду.", "right": "Tomorrow I will come."}], "status": "correct"}], "feedback": "All lines are from Nastya's message."}
  ru.a2.unit79.lesson05.exercise04.o5: {"instruction": "Put the words in order to say 'I feel better, so I will come tomorrow.'", "correct_option": "Мне лучше поэтому завтра я приду", "accepted_answers": [{"value": "Мне лучше поэтому завтра я приду", "status": "correct"}], "feedback": "Reason first, then *поэтому*."}
  ru.a2.unit79.lesson05.exercise05.t5: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Сегодня я дома, потому что холодно.", "status": "correct"}, {"value": "Сегодня я дома, потому что холодно", "status": "correct"}, {"value": "Я сегодня дома, потому что холодно.", "status": "correct"}, {"value": "Я сегодня дома, потому что холодно", "status": "correct"}], "feedback": "*Потому что холодно* gives the reason."}
  ru.a2.unit79.lesson05.exercise06.d1: {"instruction": "Type what you hear.", "correct_response": "Вчера я не пришла, потому что я болела.", "orthography_strict": true, "feedback": "You heard *Вчера я не пришла, потому что я болела.*"}
  ru.a2.unit79.lesson05.exercise07.d2: {"instruction": "Type what you hear.", "correct_response": "Мне лучше, поэтому завтра я приду.", "orthography_strict": true, "feedback": "You heard *Мне лучше, поэтому завтра я приду.*"}
  ru.a2.unit79.lesson06.exercise01.l1: {"instruction": "Listen and select Dima's opening line.", "correct_option": "Настя, привет! Почему ты вчера не пришла?", "distractors": ["Настя, привет! Почему ты вчера не пришёл?", "Настя, привет! Почему ты вчера пришла?", "Дима, привет! Почему ты вчера не пришла?"], "accepted_answers": [{"value": "Настя, привет! Почему ты вчера не пришла?", "status": "correct"}], "feedback": "Dima opens with *Настя, привет! Почему ты вчера не пришла?*"}
  ru.a2.unit79.lesson06.exercise02.c1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Because it is cold.", "distractors": ["Because she is working.", "Because she is tired.", "Because she forgot."], "accepted_answers": [{"value": "Because it is cold.", "status": "correct"}], "feedback": "Nastya says: *Сегодня я дома, потому что холодно.*"}
  ru.a2.unit79.lesson06.exercise03.m6: {"instruction": "Match each line from the dialogue to its English meaning.", "accepted_answers": [{"value": [{"left": "Почему ты вчера не пришла?", "right": "Why did you not come yesterday?"}, {"left": "Потому что я болела.", "right": "Because I was ill."}, {"left": "Сегодня я дома, потому что холодно.", "right": "Today I am at home because it is cold."}, {"left": "Как ты?", "right": "How are you?"}, {"left": "Мне лучше, поэтому завтра я приду.", "right": "I feel better, so I will come tomorrow."}, {"left": "Пока, Настя.", "right": "Bye, Nastya."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
