course:
  title: "Russian C1"
  description: "Advanced Russian persuasion: rhetorical questions, parallelism, emphasis, and audience appeals that move a listener or reader to action."

units:
  ru.c1.unit08.persuaziya_ritorika:
    title: "Persuasion and rhetoric"
    description: "Persuade an audience with rhetorical devices — a rhetorical question, parallel structure, deliberate emphasis, and a call to action — while modulating intensity."

lessons:
  ru.c1.unit08.persuaziya_ritorika.lesson01.ritoricheskij_vopros:
    title: "The rhetorical question"
  ru.c1.unit08.persuaziya_ritorika.lesson02.parallelizm:
    title: "Parallelism"
  ru.c1.unit08.persuaziya_ritorika.lesson03.emfaza:
    title: "Emphasis"
  ru.c1.unit08.persuaziya_ritorika.lesson04.prizyv_k_dejstviju:
    title: "The call to action"
  ru.c1.unit08.persuaziya_ritorika.lesson05.chitayu_persuaziju:
    title: "Reading a persuasive appeal"
  ru.c1.unit08.persuaziya_ritorika.lesson06.polnoe_vystuplenie:
    title: "The complete appeal"

teaching:
  ru.c1.unit08.persuaziya_ritorika.lesson01.teach.neuzheli:
    title: "Are we really ready..."
    gloss: "Are we really ready to trade the green park for asphalt?"
    note: "*Неужели...?* opens a rhetorical question — asked for effect, not for an answer. *Променять ... на ...* = 'to trade ... for ...'."
  ru.c1.unit08.persuaziya_ritorika.lesson01.teach.razve:
    title: "Can we really stay silent?"
    gloss: "Can we really stay silent?"
    note: "*Разве...?* is a second rhetorical-question opener. *Молчать* = 'to stay silent'."
  ru.c1.unit08.persuaziya_ritorika.lesson01.teach.ritoricheskij_vopros:
    title: "the rhetorical question"
    gloss: "rhetorical question"
    note: "*Риторический вопрос* is a question asked for effect; the speaker does not expect an answer."
    example_gloss: "A rhetorical question needs no answer."
  ru.c1.unit08.persuaziya_ritorika.lesson01.teach.modello_vopros:
    title: "Two rhetorical questions"
    gloss: "Are we really ready to trade the green park for asphalt? Can we really stay silent?"
    note: "Both *Неужели* and *Разве* turn a statement into a rhetorical question the speaker answers implicitly."

  ru.c1.unit08.persuaziya_ritorika.lesson02.teach.zdes_gulyayut:
    title: "Here our children play"
    gloss: "Here our children play."
    note: "*Здесь* ('here') opens the first of three parallel clauses."
  ru.c1.unit08.persuaziya_ritorika.lesson02.teach.zdes_otdyhayut:
    title: "Here our parents rest"
    gloss: "Here our parents rest."
    note: "The second clause repeats *Здесь* — the same opening as the first."
  ru.c1.unit08.persuaziya_ritorika.lesson02.teach.zdes_dyshit:
    title: "Here the whole district breathes"
    gloss: "Here the whole district breathes."
    note: "The third *Здесь* clause completes the parallel structure. *Дышит* = 'breathes'."
  ru.c1.unit08.persuaziya_ritorika.lesson02.teach.parallelizm:
    title: "parallelism"
    gloss: "parallelism"
    note: "*Параллелизм* repeats the same opening to build a rhythmic, memorable argument."
    example_gloss: "Parallelism strengthens a speech."
  ru.c1.unit08.persuaziya_ritorika.lesson02.teach.modello_parallelizm:
    title: "A parallel structure"
    gloss: "Here our children play, here our parents rest, here the whole district breathes."
    note: "Three clauses open with *Здесь*, building intensity through repetition."

  ru.c1.unit08.persuaziya_ritorika.lesson03.teach.imenno:
    title: "Precisely this park"
    gloss: "Precisely this park"
    note: "*Именно* ('precisely / it is ... that') singles out the park for deliberate emphasis."
  ru.c1.unit08.persuaziya_ritorika.lesson03.teach.edinstvennoe_mesto:
    title: "the only green place that we have left"
    gloss: "the only green place that we have left"
    note: "*Единственное* ('the only') strengthens the emphasis; *которое у нас осталось* = 'that we have left'."
  ru.c1.unit08.persuaziya_ritorika.lesson03.teach.emfaza:
    title: "emphasis"
    gloss: "emphasis"
    note: "*Эмфаза* underlines the single most important point of the argument."
    example_gloss: "Emphasis underlines the main point."
  ru.c1.unit08.persuaziya_ritorika.lesson03.teach.modello_emfaza:
    title: "Deliberate emphasis"
    gloss: "Precisely this park is the only green place that we have left."
    note: "*Именно ... единственное ...* pins the park as unique — the emphasis this appeal builds toward."

  ru.c1.unit08.persuaziya_ritorika.lesson04.teach.podderzhite:
    title: "Support our protest"
    gloss: "Support our protest"
    note: "*Поддержите* is a direct plural *вы* imperative addressing the audience. *Протест* = 'protest'."
  ru.c1.unit08.persuaziya_ritorika.lesson04.teach.podpishite:
    title: "sign the petition today"
    gloss: "sign the petition today"
    note: "*Подпишите петицию* ('sign the petition') is the specific action the appeal asks for; *сегодня* = 'today' adds urgency."
  ru.c1.unit08.persuaziya_ritorika.lesson04.teach.ostanetsya:
    title: "and the green park will stay with us"
    gloss: "and the green park will stay with us"
    note: "*Останется с нами* ('will stay with us') states the reward the appeal promises."
  ru.c1.unit08.persuaziya_ritorika.lesson04.teach.prizyv_k_dejstviju:
    title: "the call to action"
    gloss: "call to action"
    note: "*Призыв к действию* is the direct appeal that tells the audience exactly what to do."
    example_gloss: "A call to action ends the speech."
  ru.c1.unit08.persuaziya_ritorika.lesson04.teach.modello_prizyv:
    title: "A call to action"
    gloss: "Support our protest — sign the petition today, and the green park will stay with us."
    note: "The appeal closes with imperatives that urge the audience to act, then promises the result."

  ru.c1.unit08.persuaziya_ritorika.lesson05.teach.polnyj_tekst:
    title: "The full persuasive appeal"
    gloss: "Are we really ready to trade the green park for asphalt? Here our children play, here our parents rest, here the whole district breathes. Precisely this park is the only green place that we have left. Support our protest — sign the petition today, and the green park will stay with us."
    note: "The complete appeal: a rhetorical question, a parallel structure, deliberate emphasis, and a call to action — intensity rising from a calm question to an urgent imperative."

  ru.c1.unit08.persuaziya_ritorika.lesson06.teach.modello_polnyj:
    title: "The model to reproduce"
    gloss: "Are we really ready to trade the green park for asphalt? Here our children play, here our parents rest, here the whole district breathes. Precisely this park is the only green place that we have left. Support our protest — sign the petition today, and the green park will stay with us."
    note: "Learn this exact model: rhetorical question, parallel structure, emphasis, and call to action, in that order."
  ru.c1.unit08.persuaziya_ritorika.lesson06.teach.ubezhdenie:
    title: "persuasion"
    gloss: "persuasion"
    note: "*Убеждение* is the goal of the whole speech — moving the audience to act."
    example_gloss: "Persuasion is the goal of this speech."
  ru.c1.unit08.persuaziya_ritorika.lesson06.teach.auditorija:
    title: "the audience"
    gloss: "audience"
    note: "*Аудитория* is the audience the appeal is aimed at; each device is chosen to suit it."
    example_gloss: "The audience listens attentively."

exercises:
  ru.c1.unit08.persuaziya_ritorika.lesson01.exercise01.recognize_vopros:
    instruction: "Which Russian sentence is a rhetorical question — a question asked for effect, not for an answer?"
    correct_option: "Неужели мы готовы променять зелёный сквер на асфальт?"
    distractors: ["Мы готовы променять зелёный сквер на асфальт.", "Мы можем молчать.", "Зелёный сквер находится рядом."]
    accepted_answers: [{value: "Неужели мы готовы променять зелёный сквер на асфальт?", status: correct}]
    feedback: "*Неужели...?* marks a rhetorical question — the speaker asks for effect, not for an answer."
  ru.c1.unit08.persuaziya_ritorika.lesson01.exercise02.listen_vopros:
    instruction: "Listen and select what you hear."
    correct_option: "Are we really ready to trade the green park for asphalt?"
    distractors: ["Are we really ready to trade the green park for a garden?", "We are ready to trade the green park for asphalt.", "Are we ready to keep the green park without asphalt?"]
    accepted_answers: [{value: "Are we really ready to trade the green park for asphalt?", status: correct}]
    feedback: "Неужели мы готовы променять зелёный сквер на асфальт means are we really ready to trade the green park for asphalt."
  ru.c1.unit08.persuaziya_ritorika.lesson01.exercise03.match_vopros:
    instruction: "Match each rhetorical-question element to its English meaning."
    accepted_answers:
      - value: {"Неужели мы готовы": "are we really ready", "променять зелёный сквер": "to trade the green park", "на асфальт": "for asphalt", "Разве мы можем молчать": "can we really stay silent", "готовы": "ready", "молчать": "to stay silent"}
        status: correct
    feedback: "Неужели and Разве both open rhetorical questions that expect no answer."
  ru.c1.unit08.persuaziya_ritorika.lesson01.exercise04.order_vopros:
    instruction: "Put the Russian words in order to form the rhetorical question."
    accepted_answers:
      - {value: "Неужели мы готовы променять зелёный сквер на асфальт", status: correct}
      - {value: "Неужели мы готовы зелёный сквер променять на асфальт", status: correct}
    feedback: "Неужели мы готовы променять зелёный сквер на асфальт — are we really ready to trade the green park for asphalt."
  ru.c1.unit08.persuaziya_ritorika.lesson01.exercise05.write_vopros:
    instruction: "Write the exact taught rhetorical question that opens the appeal."
    accepted_answers:
      - {value: "Неужели мы готовы променять зелёный сквер на асфальт?", status: correct}
      - {value: "Неужели мы готовы променять зелёный сквер на асфальт", status: correct}
      - {value: "Неужели мы готовы променять зеленый сквер на асфальт?", status: correct}
      - {value: "Неужели мы готовы променять зеленый сквер на асфальт", status: correct}
    feedback: "Неужели мы готовы променять зелёный сквер на асфальт?"

  ru.c1.unit08.persuaziya_ritorika.lesson02.exercise01.recognize_parallelizm:
    instruction: "Which Russian sentence uses parallel structure — the same opening repeated three times?"
    correct_option: "Здесь гуляют наши дети, здесь отдыхают наши родители, здесь дышит весь район."
    distractors: ["Наши дети гуляют в сквере каждый день.", "Родители отдыхают вместе.", "Весь район дышит свежим воздухом."]
    accepted_answers: [{value: "Здесь гуляют наши дети, здесь отдыхают наши родители, здесь дышит весь район.", status: correct}]
    feedback: "The three clauses repeat *Здесь*, building a parallel, rhythmic structure."
  ru.c1.unit08.persuaziya_ritorika.lesson02.exercise02.listen_parallelizm:
    instruction: "Listen and select what you hear."
    correct_option: "Here our children play, here our parents rest, here the whole district breathes."
    distractors: ["Here our children play, here our parents work, here the whole district breathes.", "Here our children play, here our parents rest, here the whole district sleeps.", "Here our children play, and our parents rest at home."]
    accepted_answers: [{value: "Here our children play, here our parents rest, here the whole district breathes.", status: correct}]
    feedback: "Здесь гуляют наши дети, здесь отдыхают наши родители, здесь дышит весь район means here our children play, here our parents rest, here the whole district breathes."
  ru.c1.unit08.persuaziya_ritorika.lesson02.exercise03.match_parallelizm:
    instruction: "Match each parallel clause to its English meaning."
    accepted_answers:
      - value: {"Здесь гуляют наши дети": "here our children play", "здесь отдыхают наши родители": "here our parents rest", "здесь дышит весь район": "here the whole district breathes", "гуляют": "play / stroll", "отдыхают": "rest", "дышит": "breathes"}
        status: correct
    feedback: "Three clauses open with Здесь, each adding a new subject the park serves."
  ru.c1.unit08.persuaziya_ritorika.lesson02.exercise04.order_parallelizm:
    instruction: "Put the Russian words in order to form one parallel clause."
    accepted_answers:
      - {value: "здесь отдыхают наши родители", status: correct}
      - {value: "наши родители здесь отдыхают", status: correct}
      - {value: "здесь наши родители отдыхают", status: correct}
    feedback: "Здесь отдыхают наши родители — here our parents rest."
  ru.c1.unit08.persuaziya_ritorika.lesson02.exercise05.translate_parallelizm:
    instruction: "Translate into Russian: Here our children play, here our parents rest, here the whole district breathes."
    accepted_answers:
      - {value: "Здесь гуляют наши дети, здесь отдыхают наши родители, здесь дышит весь район.", status: correct}
      - {value: "Здесь гуляют наши дети, здесь отдыхают наши родители, здесь дышит весь район", status: correct}
    feedback: "Здесь гуляют наши дети, здесь отдыхают наши родители, здесь дышит весь район."

  ru.c1.unit08.persuaziya_ritorika.lesson03.exercise01.recognize_emfaza:
    instruction: "Which Russian phrase adds deliberate emphasis by singling out the park?"
    correct_option: "Именно этот сквер"
    distractors: ["Может быть, этот сквер", "Наверное, этот сквер", "Кстати, этот сквер"]
    accepted_answers: [{value: "Именно этот сквер", status: correct}]
    feedback: "*Именно* singles out the park for deliberate emphasis — 'precisely this park'."
  ru.c1.unit08.persuaziya_ritorika.lesson03.exercise02.listen_emfaza:
    instruction: "Listen and select what you hear."
    correct_option: "Precisely this park is the only green place that we have left."
    distractors: ["This park is one of the green places that we have left.", "Precisely this park is the only green place that we have built.", "This park is the only green place that we left."]
    accepted_answers: [{value: "Precisely this park is the only green place that we have left.", status: correct}]
    feedback: "Именно этот сквер — единственное зелёное место, которое у нас осталось means precisely this park is the only green place that we have left."
  ru.c1.unit08.persuaziya_ritorika.lesson03.exercise03.match_emfaza:
    instruction: "Match each emphasis element to its English meaning."
    accepted_answers:
      - value: {"Именно этот сквер": "precisely this park", "единственное зелёное место": "the only green place", "которое у нас осталось": "that we have left", "Именно": "precisely", "единственное": "the only", "осталось": "remained / is left"}
        status: correct
    feedback: "Именно and единственное together make the park the one thing that matters."
  ru.c1.unit08.persuaziya_ritorika.lesson03.exercise04.order_emfaza:
    instruction: "Put the Russian words in order to build the emphasis."
    accepted_answers:
      - {value: "именно этот сквер единственное зелёное место", status: correct}
    feedback: "Именно этот сквер — единственное зелёное место — precisely this park is the only green place."
