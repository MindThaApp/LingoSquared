course:
  title: "Russian B1"
  description: "Learn B1-level Russian for expressing real conditions and their consequences, including negated conditions."

units:
  ru.b1.unit41.uslovija: {title: "Conditions"}

lessons:
  ru.b1.unit41.lesson01.pogoda_i_park: {title: "Weather and the park"}
  ru.b1.unit41.lesson02.pomoshch_nasti: {title: "Nastya's help"}
  ru.b1.unit41.lesson03.plan_na_vykhodnye: {title: "Weekend plan"}

teaching:
  ru.b1.unit41.lesson01.teach.esli_pogoda_budet: {title: "Если погода будет хорошая, мы пойдём в парк.", gloss: "If the weather is good, we'll go to the park.", note: "Russian uses future tense in BOTH clauses for a real future condition, unlike English present+future.", example_gloss: "Nastya, if the weather is good, we'll go to the park."}
  ru.b1.unit41.lesson01.teach.esli_ne_budet_pogoda: {title: "Если погода не будет хорошая, мы останемся дома.", gloss: "If the weather is not good, we'll stay home.", note: "Negate the condition with *не* before *будет*.", example_gloss: "If the weather is not good tomorrow, we'll stay home."}
  ru.b1.unit41.lesson01.teach.chto_budesh_delat: {title: "Что ты будешь делать, если будет дождь?", gloss: "What will you do if it rains?", note: "*если будет дождь* states the real future condition.", example_gloss: "Dima, what will you do if it rains?"}
  ru.b1.unit41.lesson02.teach.esli_u_nasti_budet: {title: "Если у Насти будет время, она поможет Диме.", gloss: "If Nastya has time, she'll help Dima.", note: "*у Насти будет время* = \"Nastya will have time\" (possession construction).", example_gloss: "If Nastya has time tomorrow, she'll help Dima."}
  ru.b1.unit41.lesson02.teach.esli_ne_budet_vremeni: {title: "Если у Насти не будет времени, она не поможет.", gloss: "If Nastya doesn't have time, she won't help.", note: "The negated condition pairs with a negated consequence.", example_gloss: "If Nastya doesn't have time today, she won't help."}
  ru.b1.unit41.lesson02.teach.esli_pozvonyu: {title: "Если у меня не будет времени утром, я позвоню тебе позже.", gloss: "If I don't have time in the morning, I'll call you later.", note: "*утром* = \"in the morning\"; *позже* = \"later\".", example_gloss: "If I don't have time in the morning, I'll call you later today."}
  ru.b1.unit41.lesson03.teach.nastya_question: {title: "Nastya asks about the plan", gloss: "Nastya: Dima, what will you do if it rains?", note: "Opens the weekend-plan dialogue."}
  ru.b1.unit41.lesson03.teach.dima_rain: {title: "Dima answers about rain", gloss: "Dima: If it rains, we'll stay home.", note: "Real condition with consequence."}
  ru.b1.unit41.lesson03.teach.nastya_good_weather: {title: "Nastya asks about good weather", gloss: "Nastya: And if the weather is good?", note: "*А если...* asks about the alternative condition."}
  ru.b1.unit41.lesson03.teach.dima_good_weather: {title: "Dima answers about good weather", gloss: "Dima: If the weather is good, we'll go to the park.", note: "Second real condition with consequence."}
  ru.b1.unit41.lesson03.teach.dima_no_time: {title: "Dima adds a negated condition", gloss: "Dima: If I don't have time in the morning, I'll call you later.", note: "Completes the dialogue with a negated condition."}

exercises:
  ru.b1.unit41.lesson01.exercise01.recognize_condition: {instruction: "Which Russian phrase means \"if the weather is good\"?", correct_option: "если погода будет хорошая", distractors: ["если будет дождь", "если мы пойдём в парк", "если погода не будет хорошая"], accepted_answers: [{value: "если погода будет хорошая", status: "correct"}], feedback: "*если погода будет хорошая* states the real future condition."}
  ru.b1.unit41.lesson01.exercise02.recognize_negated_condition: {instruction: "Which Russian phrase means \"if the weather is not good\"?", correct_option: "если погода не будет хорошая", distractors: ["если погода будет хорошая", "если мы останемся дома", "если будет дождь"], accepted_answers: [{value: "если погода не будет хорошая", status: "correct"}], feedback: "*не* before *будет* negates the condition."}
  ru.b1.unit41.lesson01.exercise03.listen_select_condition: {instruction: "Listen. What will they do if the weather is good?", correct_option: "They'll go to the park.", distractors: ["They'll stay home.", "They'll call later.", "They'll check the weather."], accepted_answers: [{value: "They'll go to the park.", status: "correct"}], feedback: "The recording says *если погода будет хорошая, мы пойдём в парк*."}
  ru.b1.unit41.lesson01.exercise04.match_condition_words:
    instruction: "Match each Russian word to its meaning."
    accepted_answers:
      - value:
          - {left: "погода", right: "weather"}
          - {left: "хорошая", right: "good"}
          - {left: "пойдём", right: "we'll go"}
          - {left: "парк", right: "park"}
          - {left: "останемся", right: "we'll stay"}
          - {left: "дождь", right: "rain"}
        status: "correct"
    feedback: "These words build real-condition sentences about weekend plans."
  ru.b1.unit41.lesson01.exercise05.order_condition: {instruction: "Put the words in order to say \"If the weather is good, we'll go to the park.\"", accepted_answers: [{value: ["Если", "погода", "будет", "хорошая", "мы", "пойдём", "в", "парк"], status: "correct"}], feedback: "The correct order is *Если погода будет хорошая, мы пойдём в парк*."}
  ru.b1.unit41.lesson01.exercise06.write_condition:
    instruction: "Write exactly this real-condition sentence with Если: If the weather is good, we'll go to the park."
    accepted_answers:
      - {value: "Если погода будет хорошая, мы пойдём в парк.", status: "correct"}
      - {value: "Если погода будет хорошая мы пойдём в парк.", status: "correct"}
      - {value: "Если погода будет хорошая, мы пойдём в парк", status: "correct"}
      - {value: "Если погода будет хорошая мы пойдём в парк", status: "correct"}
    feedback: "The model answer is *Если погода будет хорошая, мы пойдём в парк*."
  ru.b1.unit41.lesson02.exercise01.recognize_help_condition: {instruction: "Which Russian sentence means \"If Nastya has time, she'll help Dima\"?", correct_option: "если у насти будет время она поможет диме", distractors: ["если у насти не будет времени она не поможет", "если погода будет хорошая мы пойдём в парк", "если будет дождь мы останемся дома"], accepted_answers: [{value: "если у насти будет время она поможет диме", status: "correct"}], feedback: "*у Насти будет время* states the real condition; *она поможет Диме* is the consequence."}
  ru.b1.unit41.lesson02.exercise02.recognize_negated_help: {instruction: "Which Russian sentence means \"If Nastya doesn't have time, she won't help\"?", correct_option: "если у насти не будет времени она не поможет", distractors: ["если у насти будет время она поможет диме", "если у меня не будет времени утром я позвоню тебе позже", "если погода не будет хорошая мы останемся дома"], accepted_answers: [{value: "если у насти не будет времени она не поможет", status: "correct"}], feedback: "*не* negates both the condition and the consequence here."}
  ru.b1.unit41.lesson02.exercise03.listen_select_negated_help: {instruction: "Listen. What happens if Nastya doesn't have time?", correct_option: "She won't help.", distractors: ["She'll call later.", "She'll go to the park.", "She'll stay home."], accepted_answers: [{value: "She won't help.", status: "correct"}], feedback: "The recording says *если у Насти не будет времени, она не поможет*."}
  ru.b1.unit41.lesson02.exercise04.match_help_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "у Насти", right: "Nastya has"}
          - {left: "поможет", right: "will help"}
          - {left: "Диме", right: "Dima (object)"}
          - {left: "позвоню", right: "I'll call"}
          - {left: "тебе", right: "you"}
          - {left: "позже", right: "later"}
        status: "correct"
    feedback: "These build sentences about helping and calling later."
  ru.b1.unit41.lesson02.exercise05.order_negated_help: {instruction: "Put the words in order to say \"If Nastya doesn't have time, she won't help.\"", accepted_answers: [{value: ["Если", "у", "Насти", "не", "будет", "времени", "она", "не", "поможет"], status: "correct"}], feedback: "The correct order is *Если у Насти не будет времени, она не поможет*."}
  ru.b1.unit41.lesson02.exercise06.write_negated_help:
    instruction: "Write exactly this negated-condition sentence: If I don't have time in the morning, I'll call you later."
    accepted_answers:
      - {value: "Если у меня не будет времени утром, я позвоню тебе позже.", status: "correct"}
      - {value: "Если у меня не будет времени утром я позвоню тебе позже.", status: "correct"}
      - {value: "Если у меня не будет времени утром, я позвоню тебе позже", status: "correct"}
      - {value: "Если у меня не будет времени утром я позвоню тебе позже", status: "correct"}
    feedback: "The model answer is *Если у меня не будет времени утром, я позвоню тебе позже*."
  ru.b1.unit41.lesson03.exercise01.choose_complete_conditions: {instruction: "Which answer states a real condition and consequence, AND a negated condition and its consequence?", correct_option: "Если будет дождь, мы останемся дома. Если погода будет хорошая, мы пойдём в парк. Если у меня не будет времени утром, я позвоню тебе позже.", distractors: ["Сначала я читал письмо, потом коллега позвонил.", "Я работаю, чтобы зарабатывать деньги.", "Она сказала, что встреча уже началась."], accepted_answers: [{value: "Если будет дождь, мы останемся дома. Если погода будет хорошая, мы пойдём в парк. Если у меня не будет времени утром, я позвоню тебе позже.", status: "correct"}], feedback: "The correct answer states two real conditions and one negated condition, each with its consequence."}
  ru.b1.unit41.lesson03.exercise02.dialogue_comprehension_plan:
    instruction: "Listen to the dialogue. What is the weekend plan?"
    correct_option: "If it rains they'll stay home; if the weather is good they'll go to the park; if Dima has no time in the morning he'll call later"
    distractors: ["If it rains they'll go to the park; if the weather is good they'll stay home", "Nastya will check the weather and send Dima a form", "Dima will read an email and then call Nastya"]
    accepted_answers: [{value: "If it rains they'll stay home; if the weather is good they'll go to the park; if Dima has no time in the morning he'll call later", status: "correct"}]
    feedback: "Dima gives two real conditions and one negated condition, each with its consequence."
  ru.b1.unit41.lesson03.exercise03.match_dialogue_conditions:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Что ты будешь делать, если будет дождь?", right: "What will you do if it rains?"}
          - {left: "мы останемся дома", right: "we'll stay home"}
          - {left: "если погода будет хорошая", right: "if the weather is good"}
          - {left: "мы пойдём в парк", right: "we'll go to the park"}
          - {left: "если у меня не будет времени", right: "if I don't have time"}
          - {left: "я позвоню тебе позже", right: "I'll call you later"}
        status: "correct"
    feedback: "These phrases build the full weekend-plan dialogue."
  ru.b1.unit41.lesson03.exercise04.order_good_weather: {instruction: "Put the words in order to say \"If the weather is good, we'll go to the park.\"", accepted_answers: [{value: ["Если", "погода", "будет", "хорошая", "мы", "пойдём", "в", "парк"], status: "correct"}], feedback: "The correct order is *Если погода будет хорошая, мы пойдём в парк*."}
  ru.b1.unit41.lesson03.exercise05.reply_what_you_do:
    instruction: "Nastya asks \"Дима, что ты будешь делать, если будет дождь?\" Answer with exactly two sentences: \"Если будет дождь, мы останемся дома. Если погода будет хорошая, мы пойдём в парк.\""
    accepted_answers:
      - {value: "Если будет дождь, мы останемся дома. Если погода будет хорошая, мы пойдём в парк.", status: "correct"}
      - {value: "Если будет дождь мы останемся дома. Если погода будет хорошая мы пойдём в парк.", status: "correct"}
    feedback: "The model answer gives both real conditions with their consequences."
  ru.b1.unit41.lesson03.exercise06.write_full_plan:
    instruction: "As Дима, write three sentences about the weekend plan: a real condition with its consequence (rain -> stay home), another real condition with its consequence (good weather -> go to the park), and one NEGATED condition with its consequence (no time in the morning -> call later)."
    accepted_answers:
      - {value: "Если будет дождь, мы останемся дома. Если погода будет хорошая, мы пойдём в парк. Если у меня не будет времени утром, я позвоню тебе позже.", status: "correct"}
      - {value: "Если будет дождь мы останемся дома. Если погода будет хорошая мы пойдём в парк. Если у меня не будет времени утром я позвоню тебе позже.", status: "correct"}
    feedback: "A complete answer states two real conditions and one negated condition, each with its consequence."
