course:
  title: "Russian A2"
  description: "Learn A2-level Russian for a job interview."

units:
  ru.a2.unit30.sobesedovanie: {title: "Job interview"}

lessons:
  ru.a2.unit30.lesson01.opyt: {title: "Work experience"}
  ru.a2.unit30.lesson02.grafik: {title: "When can you start?"}
  ru.a2.unit30.lesson03.interview: {title: "Dialogue: job interview"}

teaching:
  ru.a2.unit30.lesson01.teach.sobesedovanie: {title: "собеседование", gloss: "job interview", note: "*собеседование* is the standard word for an interview.", example_gloss: "I have an interview today."}
  ru.a2.unit30.lesson01.teach.opyt_raboty: {title: "опыт работы", gloss: "work experience", note: "*работы* is genitive: experience of work.", example_gloss: "I have work experience."}
  ru.a2.unit30.lesson01.teach.rasskazhite: {title: "Расскажите, пожалуйста.", gloss: "Please tell us.", note: "*Расскажите* is formal and fits an interview question.", example_gloss: "Please tell us about your experience."}
  ru.a2.unit30.lesson02.teach.mozhete_nachat: {title: "Когда вы можете начать?", gloss: "When can you start?", note: "*вы можете* is formal; do not use *ты можешь* in an interview.", example_gloss: "When can you start work?"}
  ru.a2.unit30.lesson02.teach.mogu_nachat: {title: "Я могу начать в понедельник.", gloss: "I can start on Monday.", note: "*в понедельник* means on Monday.", example_gloss: "I can start work on Monday."}
  ru.a2.unit30.lesson02.teach.grafik: {title: "график", gloss: "schedule", note: "*график* is the work schedule in this context.", example_gloss: "The schedule is nine to five."}
  ru.a2.unit30.lesson02.teach.dolzhnost: {title: "должность", gloss: "position / role", note: "*на этой должности* means in this position.", example_gloss: "What position is this?"}
  ru.a2.unit30.lesson03.teach.manager_experience: {title: "The interviewer asks about experience", gloss: "Manager: Please tell us about your experience.", note: "Formal *вашем* matches the interview setting."}
  ru.a2.unit30.lesson03.teach.nastya_experience: {title: "Nastya describes experience", gloss: "Nastya: I have work experience at a school. I worked with children.", note: "*Я работала* is the feminine past tense: Настя is a woman."}
  ru.a2.unit30.lesson03.teach.manager_start: {title: "The interviewer asks availability", gloss: "Manager: When can you start?", note: "The question is about availability."}
  ru.a2.unit30.lesson03.teach.nastya_monday: {title: "Nastya gives availability", gloss: "Nastya: I can start on Monday.", note: "This answers the availability question."}
  ru.a2.unit30.lesson03.teach.nastya_schedule: {title: "Nastya asks a role question", gloss: "Nastya: Please tell me, what is the schedule for this position?", note: "Asking about the schedule is a good clarifying question at an interview."}
  ru.a2.unit30.lesson03.teach.manager_schedule: {title: "The interviewer answers", gloss: "Manager: The schedule is from nine to five.", note: "The interviewer gives the schedule."}

