schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.a1.unit18"
source_language: "en"
target_language: "ru"
status: "draft"
generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context", notes: "Newly authored 2026-07-12, pending mandatory fresh-context review."}

course:
  title: "Russian A1"
  description: "Learn A1-level Russian for describing a basic home, its rooms, furniture, and location, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit18.housing: {title: "This is my apartment"}

lessons:
  ru.a1.unit18.lesson01.eto_moya_kvartira: {title: "This is my apartment"}
  ru.a1.unit18.lesson02.divan_v_gostinoy: {title: "The sofa is in the living room"}
  ru.a1.unit18.lesson03.moya_kvartira_dialogue: {title: "Dialogue: my apartment"}

teaching:
  ru.a1.unit18.lesson01.teach.eto_moya_kvartira: {title: "Это моя квартира.", gloss: "This is my apartment.", note: "Это means \"this is\"; моя (\"my,\" feminine) agrees with the feminine noun квартира (\"apartment\")."}
  ru.a1.unit18.lesson01.teach.kuhnya: {title: "кухня", gloss: "kitchen", note: "кухня means \"kitchen.\" стол means \"table.\"", example_gloss: "There's a table in the kitchen."}
  ru.a1.unit18.lesson01.teach.spalnya: {title: "спальня", gloss: "bedroom", note: "спальня means \"bedroom.\" кровать means \"bed.\"", example_gloss: "There's a bed in the bedroom."}

  ru.a1.unit18.lesson02.teach.divan_v_gostinoy: {title: "Диван в гостиной.", gloss: "The sofa is in the living room.", note: "диван means \"sofa\"; гостиная means \"living room\" (гостиной is its prepositional-case form after в, \"in\")."}
  ru.a1.unit18.lesson02.teach.stol_na_kuhne: {title: "на", gloss: "on / at", note: "на is used with кухня (\"on the kitchen,\" idiomatically \"in the kitchen\") instead of в, unlike most rooms.", example_gloss: "The table is in the kitchen."}
  ru.a1.unit18.lesson02.teach.vannaya: {title: "ванная", gloss: "bathroom", note: "ванная means \"bathroom.\"", example_gloss: "The bathroom is next to the bedroom."}

  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh: {title: "Dima asks where Nastya lives", gloss: "Dima: Nastya, where do you live?", note: "Дима opens with Настя, где ты живёшь?"}
  ru.a1.unit18.lesson03.teach.nastya_skolko_komnat: {title: "Nastya answers and asks about rooms", gloss: "Nastya: I live in an apartment. How many rooms are in the apartment?", note: "Настя answers Я живу в квартире. Сколько комнат в квартире?"}
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty: {title: "Nastya lists the rooms", gloss: "Nastya: Two rooms: a bedroom and a living room. There's also a kitchen and a bathroom.", note: "Настя continues Две комнаты: спальня и гостиная. Кухня и ванная тоже есть."}

exercises:
  ru.a1.unit18.lesson01.exercise01.recognize_kvartira:
    instruction: "Which word means \"apartment\"?"
    correct_option: "квартира"
    distractors: ["кухня", "спальня", "моя"]
    accepted_answers: [{value: "квартира", status: "correct"}]
    feedback: "квартира means \"apartment.\""
  ru.a1.unit18.lesson01.exercise02.recognize_kuhnya:
    instruction: "Which word means \"kitchen\"?"
    correct_option: "кухня"
    distractors: ["спальня", "квартира", "стол"]
    accepted_answers: [{value: "кухня", status: "correct"}]
    feedback: "кухня means \"kitchen.\""
  ru.a1.unit18.lesson01.exercise03.listen_select_eto_moya_kvartira:
    instruction: "Listen to the recording. What is the speaker showing?"
    correct_option: "Their apartment."
    distractors: ["Their kitchen.", "Their bedroom.", "Their office."]
    accepted_answers: [{value: "Their apartment.", status: "correct"}]
    feedback: "The recording says Это моя квартира. (\"This is my apartment.\")"
  ru.a1.unit18.lesson01.exercise04.match_room_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "квартира", right: "apartment"}
          - {left: "кухня", right: "kitchen"}
          - {left: "спальня", right: "bedroom"}
          - {left: "стол", right: "table"}
          - {left: "кровать", right: "bed"}
          - {left: "Это моя квартира.", right: "This is my apartment."}
        status: "correct"
    feedback: "квартира=apartment, кухня=kitchen, спальня=bedroom, стол=table, кровать=bed."
  ru.a1.unit18.lesson01.exercise05.order_eto_moya_kvartira:
    instruction: "Put the words in the correct order to say \"This is my apartment.\""
    accepted_answers:
      - {value: ["Это", "моя", "квартира"], status: "correct"}
    feedback: "The correct order is Это моя квартира."
  ru.a1.unit18.lesson01.exercise06.listen_order_eto_moya_kvartira:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Это", "моя", "квартира"], status: "correct"}
    feedback: "The correct order is Это моя квартира (\"This is my apartment\")."
  ru.a1.unit18.lesson01.exercise07.complete_na_kuhne_stol:
    instruction: "Complete the sentence: На ___ стол. (in the kitchen)"
    accepted_answers:
      - {value: "кухне", status: "correct"}
      - {value: "На кухне стол", status: "correct"}
    feedback: "кухне is the prepositional form of кухня, \"kitchen.\""
  ru.a1.unit18.lesson01.exercise08.write_about_bedroom:
    instruction: "Write a sentence saying there is a bed in the bedroom, using \"В спальне\"."
    accepted_answers:
      - {value: "В спальне кровать.", status: "correct"}
      - {value: "В спальне кровать", status: "correct"}
    feedback: "В спальне кровать. means \"There's a bed in the bedroom.\""

  ru.a1.unit18.lesson02.exercise01.recognize_divan:
    instruction: "Which word means \"sofa\"?"
    correct_option: "диван"
    distractors: ["гостиной", "стол", "ванная"]
    accepted_answers: [{value: "диван", status: "correct"}]
    feedback: "диван means \"sofa.\""
  ru.a1.unit18.lesson02.exercise02.recognize_gostinaya:
    instruction: "Which word means \"living room\"?"
    correct_option: "гостиной"
    distractors: ["диван", "стол", "ванная"]
    accepted_answers: [{value: "гостиной", status: "correct"}]
    feedback: "гостиной is the prepositional form of гостиная, \"living room.\""
  ru.a1.unit18.lesson02.exercise03.listen_select_divan_v_gostinoy:
    instruction: "Listen to the recording. Where is the sofa?"
    correct_option: "In the living room."
    distractors: ["In the kitchen.", "In the bedroom.", "In the bathroom."]
    accepted_answers: [{value: "In the living room.", status: "correct"}]
    feedback: "The recording says Диван в гостиной. (\"The sofa is in the living room.\")"
  ru.a1.unit18.lesson02.exercise04.match_furniture_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "диван", right: "sofa"}
          - {left: "гостиная", right: "living room"}
          - {left: "стол", right: "table"}
          - {left: "ванная", right: "bathroom"}
          - {left: "Стол на кухне.", right: "The table is in the kitchen."}
          - {left: "Диван в гостиной.", right: "The sofa is in the living room."}
        status: "correct"
    feedback: "диван=sofa, гостиная=living room, стол=table, ванная=bathroom."
  ru.a1.unit18.lesson02.exercise05.order_divan_v_gostinoy:
    instruction: "Put the words in the correct order to say \"The sofa is in the living room.\""
    accepted_answers:
      - {value: ["Диван", "в", "гостиной"], status: "correct"}
    feedback: "The correct order is Диван в гостиной."
  ru.a1.unit18.lesson02.exercise06.listen_order_divan_v_gostinoy:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Диван", "в", "гостиной"], status: "correct"}
    feedback: "The correct order is Диван в гостиной (\"The sofa is in the living room\")."
  ru.a1.unit18.lesson02.exercise07.complete_stol_na_kuhne:
    instruction: "Complete the sentence: Стол ___ кухне. (on/at)"
    accepted_answers:
      - {value: "на", status: "correct"}
      - {value: "Стол на кухне", status: "correct"}
    feedback: "Стол на кухне uses на (\"on/at\"), an exception among room names, which normally use в (\"in\")."
  ru.a1.unit18.lesson02.exercise08.write_where_sofa_is:
    instruction: "Write a sentence saying the sofa is in the living room."
    accepted_answers:
      - {value: "Диван в гостиной.", status: "correct"}
      - {value: "Диван в гостиной", status: "correct"}
    feedback: "Диван в гостиной. means \"The sofa is in the living room.\""

  ru.a1.unit18.lesson03.exercise01.choose_ask_where_live:
    instruction: "You want to ask a friend where they live. What do you say?"
    correct_option: "Где ты живёшь?"
    distractors: ["Кем ты работаешь?", "Сколько комнат?", "Это моя квартира."]
    accepted_answers: [{value: "Где ты живёшь?", status: "correct"}]
    feedback: "Где ты живёшь? means \"Where do you live?\""
  ru.a1.unit18.lesson03.exercise02.listen_select_gde_ty_zhivyosh:
    instruction: "Listen to the recording. What is Dima asking?"
    correct_option: "Where do you live?"
    distractors: ["What do you work as?", "How many rooms are there?", "Is there a kitchen?"]
    accepted_answers: [{value: "Where do you live?", status: "correct"}]
    feedback: "The recording says Настя, где ты живёшь? (\"Nastya, where do you live?\")"
  ru.a1.unit18.lesson03.exercise03.dialogue_comprehension_moya_kvartira:
    instruction: "Listen to the dialogue. Where does Nastya live, and what rooms does her home have?"
    correct_option: "She lives in an apartment with a bedroom, a living room, a kitchen, and a bathroom"
    distractors: ["She lives in a house with only a kitchen", "She lives in an apartment with no bathroom", "She lives with Dima in an office"]
    accepted_answers: [{value: "She lives in an apartment with a bedroom, a living room, a kitchen, and a bathroom", status: "correct"}]
    feedback: "Настя says Я живу в квартире... Две комнаты: спальня и гостиная. Кухня и ванная тоже есть."
  ru.a1.unit18.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Настя, где ты живёшь?", right: "Nastya, where do you live?"}
          - {left: "Я живу в квартире.", right: "I live in an apartment."}
          - {left: "Сколько комнат в квартире?", right: "How many rooms in the apartment?"}
          - {left: "Две комнаты: спальня и гостиная.", right: "Two rooms: a bedroom and a living room."}
          - {left: "Кухня и ванная тоже есть.", right: "There's also a kitchen and a bathroom."}
          - {left: "Это моя квартира.", right: "This is my apartment."}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange about someone's home between friends."
  ru.a1.unit18.lesson03.exercise05.order_ya_zhivu_v_kvartire:
    instruction: "Put the words in the correct order to say \"I live in an apartment.\""
    accepted_answers:
      - {value: ["Я", "живу", "в", "квартире"], status: "correct"}
    feedback: "The correct order is Я живу в квартире."
  ru.a1.unit18.lesson03.exercise06.reply_gde_ty_zhivyosh:
    instruction: "Someone asks \"Где ты живёшь?\" Reply that you live in an apartment."
    accepted_answers:
      - {value: "Я живу в квартире.", status: "correct"}
      - {value: "Я живу в квартире", status: "correct"}
    feedback: "Я живу в квартире. means \"I live in an apartment.\""
  ru.a1.unit18.lesson03.exercise07.complete_dve_komnaty:
    instruction: "Complete the sentence: ___ комнаты: спальня и гостиная. (two)"
    accepted_answers:
      - {value: "Две", status: "correct"}
      - {value: "Две комнаты: спальня и гостиная", status: "correct"}
    feedback: "Две means \"two\" (feminine, agreeing with комнаты)."
  ru.a1.unit18.lesson03.exercise08.write_describe_your_home:
    instruction: "Write two or three sentences describing your home: what kind of home it is and what rooms it has."
    accepted_answers:
      - {value: "Я живу в квартире. Есть спальня и кухня.", status: "correct"}
      - {value: "Это моя квартира. Есть кухня и ванная.", status: "correct"}
    feedback: "A natural description uses Я живу в... or Это моя..., then lists rooms with Есть..."
