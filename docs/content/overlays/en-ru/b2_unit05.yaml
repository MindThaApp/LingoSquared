course:
  title: "Russian B2"
  description: >-
    Upper-intermediate Russian: adapt your formality to the audience -- say
    the same thing appropriately to a close friend and to an institution.
    Switch between informal ты and formal Вы, between Привет/Пока and
    Уважаемая администрация / С уважением, and between a direct request
    (Можешь...?) and an indirect polite one (Не могли бы Вы...?), around
    the everyday task of rescheduling an appointment.

units:
  ru.b2.unit05.registr:
    title: "Register"
    description: Adapt your formality to who you are addressing -- deliver the same request appropriately to a close friend and to an institution, switching pronouns, greetings, closings and directness.

lessons:
  ru.b2.unit05.lesson01.ty_ili_vy:
    title: "You (ты) or you (Вы)?"
  ru.b2.unit05.lesson02.privetstvija_i_proshchanija:
    title: "Greetings and farewells"
  ru.b2.unit05.lesson03.pryamota:
    title: "Direct or polite?"
  ru.b2.unit05.lesson04.perenesti_vstrechu:
    title: "Rescheduling the appointment"
  ru.b2.unit05.lesson05.dva_soobshchenija:
    title: "Two messages, two readers"
  ru.b2.unit05.lesson06.vybrat_registr:
    title: "Choosing the right register"

teaching:
  ru.b2.unit05.lesson01.teach.soobshchenie:
    title: "Nastya is writing a message."
    gloss: "Nastya is writing a message."
    note: "The situation this whole unit works with: your friend Настя has to send the same request to two very different readers. *Сообщение* = 'a message'."
  ru.b2.unit05.lesson01.teach.ty:
    title: "you (informal)"
    gloss: "you / your (informal)"
    note: "The informal 'you': *ты* as the subject ('you'), *тебя* as the object, *тебе* as the dative ('to you'), *твой/твоя* as the possessive ('your'). Use it with friends, family and peers -- like Настя with Дима."
    example_gloss: "I'm writing you a message."
  ru.b2.unit05.lesson01.teach.vy:
    title: "you (formal)"
    gloss: "you / your (formal)"
    note: "The formal 'you': *Вы* covers the subject, *вас* the object, *вам* the dative, *ваш/ваша* the possessive. Use it with strangers, officials and institutions. In writing to one specific person, *Вы/Вас/Ваш* are capitalized -- a marker of respect, though the app's grading does not distinguish it from lowercase."
    example_gloss: "I'm writing you a message."
  ru.b2.unit05.lesson01.teach.u_tebya_est_vremya:
    title: "Do you have time? (informal)"
    gloss: "Do you have time?"
    note: "Informal. *У тебя есть время?* -- literally 'is there time by you?', the standard way to ask if someone has time. Compare the formal version on the next card -- same question, different register."
  ru.b2.unit05.lesson01.teach.u_vas_est_vremya:
    title: "Do you have time? (formal)"
    gloss: "Do you have time?"
    note: "Formal. *У вас есть время?* -- the same construction, just swapping *тебя* for *вас*. Nothing else in the sentence changes."
  ru.b2.unit05.lesson01.teach.mozhesh_pomoch:
    title: "Can you help? (informal)"
    gloss: "Can you help?"
    note: "Informal. *Можешь помочь?* is the ты-form of *мочь* ('can'). Direct and perfectly polite between friends."
  ru.b2.unit05.lesson01.teach.mozhete_pomoch:
    title: "Can you help? (formal)"
    gloss: "Can you help?"
    note: "Formal. *Можете помочь?* -- the Вы-form of *мочь*. Same question as *Можешь помочь?*, shifted up in formality."
  ru.b2.unit05.lesson01.teach.grammar_ty_vy:
    title: "Do you have time? / Do you have time? Can you help? / Can you help?"
    gloss: "Do you have time? (informal / formal). Can you help? (informal / formal)."
    note: "The core move of this unit: *ты -> Вы* changes the verb form too. *можешь -> можете*, *у тебя -> у вас*. Choose *ты* for a friend and *Вы* for an institution."

  ru.b2.unit05.lesson02.teach.privet:
    title: "Hi"
    gloss: "Hi"
    note: "*Привет* is an informal greeting -- for a friend, a text, a chat. *Привет, Дима!* is exactly how Настя opens a message to Дима."
    example_gloss: "Hi Dima!"
  ru.b2.unit05.lesson02.teach.poka:
    title: "Bye (farewell)"
    gloss: "Bye / see you"
    note: "*Пока* as a farewell is the informal way to close a message to a friend. Note this is the same word as the connective *пока* ('while') from an earlier unit -- a common Russian homograph, distinguishable only from context. Never use the farewell *Пока* in a formal letter."
    example_gloss: "Bye, Dima!"
  ru.b2.unit05.lesson02.teach.zdravstvuyte:
    title: "Hello"
    gloss: "Hello"
    note: "*Здравствуйте* is a neutral-to-polite greeting, safe when you don't know someone well or are speaking to a stranger, but not as distancing as a full formal letter salutation."
    example_gloss: "Hello, this is Nastya."
  ru.b2.unit05.lesson02.teach.uvazhaemaya_administracija:
    title: "Dear administration,"
    gloss: "Dear administration,"
    note: "*Уважаемая администрация,* is the standard formal salutation when you're writing to an institution rather than a named person -- the opener for a letter or e-mail to an office. *Уважаемая* = 'esteemed/dear' (feminine agreement, as *администрация* is feminine)."
  ru.b2.unit05.lesson02.teach.s_uvazheniem:
    title: "Sincerely,"
    gloss: "Sincerely, / With respect,"
    note: "*С уважением,* ('with respect') is the everyday formal closing -- the standard way to end a polite e-mail or letter, whatever the reader's gender."
  ru.b2.unit05.lesson02.teach.anastasija:
    title: "Anastasia"
    gloss: "Anastasia (formal full form of Nastya)"
    note: "*Настя* is the everyday short form of the full name *Анастасия*. Using the full form to sign a formal letter is itself a register marker -- the same shift as *Привет* becoming *Уважаемая администрация*, but on a name."
    example_gloss: "Nastya is [short for] Anastasia."
  ru.b2.unit05.lesson02.teach.grammar_privetstvija:
    title: "Hi, Dima! Bye! Hello! Dear administration, ... Sincerely, Anastasia."
    gloss: "Hi, Dima! Bye! Hello! Dear administration, ... Sincerely, Anastasia."
    note: "Openings and closings come in matched registers. Informal: *Привет* ... *Пока*. Formal: *Уважаемая администрация* ... *С уважением*, signed with the full name *Анастасия*. Mixing them reads as a mistake."

  ru.b2.unit05.lesson03.teach.sdelay_pozhalusta:
    title: "Do this, please. (informal)"
    gloss: "Do this, please."
    note: "Informal and direct: the ты-imperative *Сделай* plus *пожалуйста*. Between friends a direct request softened only by *пожалуйста* is the normal, friendly choice."
  ru.b2.unit05.lesson03.teach.ne_mogli_by_vy:
    title: "Would you be able to do this? (formal)"
    gloss: "Would you be able to do this?"
    note: "Formal and indirect. Where English can stay direct and still sound polite ('Can you...?'), formal Russian often prefers an indirect question: *Не могли бы Вы это сделать?* ('would you be able to do this?'). *Могли бы* is a conditional form of *мочь*."
  ru.b2.unit05.lesson03.teach.bud_te_dobry:
    title: "Be so kind as to help."
    gloss: "Be so kind as to help."
    note: "The very polite formal opener *Будьте добры,* ('be so kind') can front an imperative and still stay formal. *Будьте* is the Вы-form, so it goes with anyone you address as Вы -- a stranger, a shop assistant, an office or institution -- not with a close friend."
  ru.b2.unit05.lesson03.teach.grammar_pryamota:
    title: "Do this, please. Would you be able to do this? Be so kind as to help."
    gloss: "Do this, please. Would you be able to do this? Be so kind as to help."
    note: "Directness is a register signal. Informal: a direct ты-imperative (*Сделай...*) softened with *пожалуйста*. Formal: an indirect *Не могли бы Вы...?* or the polite opener *Будьте добры*. The more indirect, the more formal."

  ru.b2.unit05.lesson04.teach.vstrecha:
    title: "the meeting"
    gloss: "the meeting / get-together"
    note: "*Встреча* = 'meeting / get-together' -- the general word for meeting someone, used both with friends and at work (*деловая встреча* = 'a business meeting'). This is what Настя wants to change with Дима."
    example_gloss: "I have a meetup today."
  ru.b2.unit05.lesson04.teach.priyom:
    title: "the appointment"
    gloss: "the appointment (e.g. at a clinic)"
    note: "*Приём* = 'appointment' -- a scheduled slot with a doctor or at an office (not a meeting between friends). This is what Настя wants to change with the clinic."
    example_gloss: "I want to reschedule the appointment."
  ru.b2.unit05.lesson04.teach.poliklinika:
    title: "the clinic"
    gloss: "the clinic"
    note: "*Поликлиника* = 'the (public/district) clinic' -- the institution Настя needs to write to formally."
    example_gloss: "The clinic is open in the morning."
  ru.b2.unit05.lesson04.teach.perenesti:
    title: "to reschedule"
    gloss: "to reschedule / move"
    note: "*Перенести* = 'to move' something to another time, i.e. 'to reschedule'. Works with both *встречу* (the meetup with Дима) and *приём* (the clinic appointment) -- the verb itself is register-neutral."
    example_gloss: "I want to reschedule the meetup."
  ru.b2.unit05.lesson04.teach.ponedelnik:
    title: "Monday"
    gloss: "Monday"
    note: "*Понедельник* = 'Monday'. *Я не могу в понедельник* = 'I can't (make it) on Monday'. *Могу* = 'I can' (the *я* form of *мочь*)."
    example_gloss: "I can't on Monday."
  ru.b2.unit05.lesson04.teach.k_sozhaleniyu:
    title: "unfortunately"
    gloss: "unfortunately"
    note: "*К сожалению* = 'unfortunately' -- a softener that makes a refusal sound more considerate, useful in both registers."
    example_gloss: "Unfortunately, I can't on Monday."
  ru.b2.unit05.lesson04.teach.informal_request:
    title: "Can we reschedule the meetup? (informal)"
    gloss: "Can we reschedule the meetup?"
    note: "The request in its informal form, to a friend: *Можем перенести встречу?* Direct, no softening frame. *Можем* = 'we can'."
  ru.b2.unit05.lesson04.teach.formal_request:
    title: "Would you be able to reschedule my appointment? (formal)"
    gloss: "Would you be able to reschedule my appointment?"
    note: "The SAME request in formal form, to the clinic: *Не могли бы Вы перенести мой приём?* Indirect and polite. *Мой* = 'my'."
  ru.b2.unit05.lesson04.teach.grammar_perenesti:
    title: "Can we reschedule the meetup? / Would you be able to reschedule my appointment?"
    gloss: "Can we reschedule the meetup? (informal) / Would you be able to reschedule my appointment? (formal)"
    note: "One request, two registers. Informal: *Можем перенести встречу?* Formal: *Не могли бы Вы перенести мой приём?* Same content, different wrapping for a different reader -- the whole point of this unit."

  ru.b2.unit05.lesson05.teach.udobno:
    title: "convenient"
    gloss: "convenient"
    note: "*Удобно* = 'convenient'. *Вам удобно на следующей неделе?* = 'is next week convenient for you?' -- a polite, slightly formal way to propose a new time, the counterpart to the informal *Может, на следующей неделе?*"
    example_gloss: "Is next week convenient for you?"
  ru.b2.unit05.lesson05.teach.tekst_informalnyj:
    title: "Informal message (to Dima)"
    gloss: "Hi, Dima! Can we reschedule the meetup? Unfortunately I can't on Monday. Maybe next week? Bye, Nastya"
    glosses:
      Привет: "Hi (informal greeting)"
      Можем: "can (we) (form of мочь)"
      встречу: "meetup (accusative of встреча)"
      могу: "can (I) (form of мочь)"
      понедельник: "Monday"
      Может: "maybe"
      следующей: "next (inflected form of следующая)"
      неделе: "week (dative/prepositional of неделя)"
      Пока: "bye (informal farewell)"
  ru.b2.unit05.lesson05.teach.tekst_formalnyj:
    title: "Formal message (to the clinic)"
    gloss: "Dear administration, would you be able to reschedule my appointment? Unfortunately I can't on Monday. Would next week be convenient? Sincerely, Anastasia"
    glosses:
      Уважаемая: "dear / esteemed (formal salutation)"
      администрация: "administration"
      могли: "could (in не могли бы Вы)"
      бы: "would (conditional particle)"
      Вы: "you (formal)"
      приём: "appointment"
      могу: "can (1st person of мочь)"
      понедельник: "Monday"
      удобно: "convenient"
      ли: "whether (question particle)"
      следующей: "next"
      неделе: "week"
      уважением: "respect (in с уважением)"
      Анастасия: "Anastasia (formal full form of Nastya)"

  ru.b2.unit05.lesson06.teach.bez_problem:
    title: "No problem."
    gloss: "No problem."
    note: "*Без проблем* = 'no problem' -- a relaxed, informal reply."
  ru.b2.unit05.lesson06.teach.smozhesh:
    title: "you'll be able to"
    gloss: "you'll be able to (perfective future of смочь)"
    note: "*Сможешь* = 'you'll be able to'. *Когда сможешь?* = 'when can you (make it)?' -- a natural follow-up after someone says they can't make a time. *Тогда* = 'then'."
    example_gloss: "When can you make it?"
  ru.b2.unit05.lesson06.teach.eshcho_nado:
    title: "And I still need to write to the clinic."
    gloss: "And I still need to write to the clinic."
    note: "*И мне ещё нужно написать в поликлинику* = 'and I still need to write to the clinic'. *Ещё* = 'still / also', *нужно* = 'need to', *написать* = 'to write'."
  ru.b2.unit05.lesson06.teach.po_drugomu:
    title: "To them, of course, you write differently."
    gloss: "There, of course, you write differently."
    note: "*Туда, конечно, ты пишешь по-другому* = 'there [to the clinic], of course, you write differently' -- exactly the skill of this unit. *Туда* = 'there (to)', *по-другому* = 'differently'."
  ru.b2.unit05.lesson06.teach.dialogue_nastya_open:
    title: "Nastya: Hi, Dima! Can we reschedule the meetup? Unfortunately I can't on Monday."
    gloss: "Nastya: Hi, Dima! Can we reschedule the meetup? Unfortunately I can't on Monday."
  ru.b2.unit05.lesson06.teach.dialogue_dima_ok:
    title: "Dima: No problem. When can you make it?"
    gloss: "Dima: No problem. When can you make it?"
  ru.b2.unit05.lesson06.teach.dialogue_nastya_next_week:
    title: "Nastya: Maybe next week? And I still need to write to the clinic."
    gloss: "Nastya: Maybe next week? And I still need to write to the clinic."
  ru.b2.unit05.lesson06.teach.dialogue_dima_po_drugomu:
    title: "Dima: Yeah, to them, of course, you write differently."
    gloss: "Dima: Yeah, to them, of course, you write differently."
  ru.b2.unit05.lesson06.teach.grammar_oba_registra:
    title: "Can you reschedule the meetup? / Would you be able to reschedule my appointment?"
    gloss: "Can you reschedule the meetup? (informal) / Would you be able to reschedule my appointment? (formal)"
    note: "This is what you produce in this lesson: one request, delivered in the register that fits each reader. Informal to Дима: *Можешь перенести встречу?* Formal to the clinic: *Не могли бы Вы перенести мой приём?*"

exercises:
  ru.b2.unit05.lesson01.exercise01.recognize_vy:
    instruction: "Who do you address as 'Вы'?"
    correct_option: "someone you treat formally (a stranger or an institution)"
    distractors: ["a close friend", "a child in your family", "your best friend"]
    accepted_answers: [{value: "someone you treat formally (a stranger or an institution)", status: "correct"}]
    feedback: "Вы is the formal 'you' -- for strangers, officials and institutions. For a friend you use ты."
  ru.b2.unit05.lesson01.exercise02.listen_u_tebya:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have time? (informal)"
    distractors: ["Do you have time? (formal)", "Can you help? (informal)", "No problem."]
    accepted_answers: [{value: "Do you have time? (informal)", status: "correct"}]
    feedback: "У тебя есть время? is the informal 'do you have time?' -- addressed with тебя."
  ru.b2.unit05.lesson01.exercise03.match_pronouns:
    instruction: "Match each word to its meaning and register."
    accepted_answers:
      - value:
          - {left: "ты", right: "you (informal, subject)"}
          - {left: "тебя", right: "you (informal, object)"}
          - {left: "твой", right: "your (informal)"}
          - {left: "вы", right: "you (formal, subject)"}
          - {left: "вас", right: "you (formal, object)"}
          - {left: "ваш", right: "your (formal)"}
          - {left: "можешь", right: "can you (informal)"}
          - {left: "можете", right: "can you (formal)"}
          - {left: "время", right: "time"}
        status: "correct"
    feedback: "ты/тебя/твой are the informal set; вы/вас/ваш are the formal set -- and the verb follows (можешь vs можете)."
  ru.b2.unit05.lesson01.exercise04.order_u_tebya:
    instruction: "Put the words in order to say \"Do you have time?\" (informal)."
    accepted_answers:
      - {value: ["У", "тебя", "есть", "время"], status: "correct"}
    feedback: "У тебя есть время? -- the informal тебя form."
  ru.b2.unit05.lesson01.exercise05.translate_u_vas:
    instruction: "Translate into Russian, formal (addressing the person as Вы): Do you have time?"
    accepted_answers:
      - {value: "У вас есть время", status: "correct"}
      - {value: "У Вас есть время", status: "correct"}
    feedback: "У вас есть время? -- вас replaces тебя in the formal register."
  ru.b2.unit05.lesson01.exercise06.translate_mozhesh:
    instruction: "Translate into Russian, informal (addressing the person as ты): Can you help?"
    accepted_answers:
      - {value: "Можешь помочь", status: "correct"}
      - {value: "Ты можешь помочь", status: "correct"}
    feedback: "Можешь помочь? -- the informal ты form of мочь."
  ru.b2.unit05.lesson01.exercise07.speak_mozhete:
    instruction: "Say aloud in Russian, formal (addressing the person as Вы): Can you help?"
    accepted_answers:
      - {value: "Можете помочь", status: "correct"}
      - {value: "Вы можете помочь", status: "correct"}
    feedback: "Можете помочь? -- with Вы the verb is можете, not можешь."
  ru.b2.unit05.lesson01.exercise08.dictation_u_tebya:
    instruction: "Type what you hear."
    correct_response: "У тебя есть время"
    orthography_strict: true
    feedback: "You heard У тебя есть время? — the informal 'do you have time?', addressed with тебя."

  ru.b2.unit05.lesson02.exercise01.recognize_uvazhaemaya:
    instruction: "When would you write 'Уважаемая администрация'?"
