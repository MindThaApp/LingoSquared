    distractors: ["To cancel a planned meeting.", "To confirm Monday.", "To ask for directions."]
    accepted_answers: [{value: "To reschedule a planned meeting.", status: "correct"}]
    feedback: "Both ask to reschedule (перенести) -- same content, different register."
  ru.b2.unit05.lesson05.exercise04.read_signal:
    instruction: "Which feature marks the second message as the one for an institution?"
    correct_option: "It uses 'Вы', not 'ты'."
    distractors: ["It is shorter.", "It asks about a different day.", "It does not mention the appointment."]
    accepted_answers: [{value: "It uses 'Вы', not 'ты'.", status: "correct"}]
    feedback: "The formal message marks its audience through Вы and the indirect Не могли бы Вы frame."
  ru.b2.unit05.lesson05.exercise05.match_register_features:
    instruction: "Match each register feature with what it is."
    accepted_answers:
      - value:
          - {left: "Привет, Дима", right: "informal greeting (to a friend)"}
          - {left: "Уважаемая администрация", right: "formal greeting (to an institution)"}
          - {left: "Пока", right: "informal closing"}
          - {left: "С уважением", right: "formal closing"}
          - {left: "удобно", right: "convenient"}
          - {left: "следующей неделе", right: "next week"}
        status: "correct"
    feedback: "The greetings and closings are what most clearly signal who each message is for."
  ru.b2.unit05.lesson05.exercise06.translate_udobno:
