  notes: >-
    Overlay for ru's fifth B2 unit (register -- adapting formality to the
    audience), authored alongside the realization (no adaptable
    intermediate/upper-level public-domain Russian source exists for this
    topic; see the realization provenance note). English speakers' real
    interference risks for this outcome: (1) English has ONE 'you', so the
    informal ты vs formal Вы split -- and the verb shift it forces (можешь
    -> можете) -- has no English anchor and is drilled explicitly in
    lesson01; (2) English requests can stay direct and still sound polite
    ('Can you...?'), whereas formal Russian avoids the bare imperative
    altogether in favour of an indirect conditional (Не могли бы Вы...?) --
    lesson03 contrasts the direct informal ты-imperative + пожалуйста
    against the indirect formal frames so a learner does not carry English
    directness into a formal Russian letter; (3) letter openings/closings
    differ sharply by register (Привет/Пока vs Уважаемая администрация / С
    уважением) and are taught as fixed formulas in lesson02, along with the
    Russian-specific nuance that a name itself can shift register (Настя
    informally, Анастасия formally) -- English names don't do this; (4) 'вы'
    capitalized as 'Вы' when addressing one person formally in writing is a
    real Russian convention, but the app's grading casefolds input, so no
    exercise here keys correctness to that capitalization alone -- it is
    only explained in the realization's grammar note. This unit
    DELIBERATELY teaches both registers -- each individual exercise stays in
    one consistent register, and every production prompt names the register
    AND the frame wanted so a correct answer in the OTHER register is not
    marked wrong. The culminating lesson06 exercise07 asks for the SAME
    request in BOTH registers; its accepted answers cover the natural
    punctuation variants. No sibling-direction file (ru-en b2) was
    consulted.

