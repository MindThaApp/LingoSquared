      - {value: "Удобно ли на следующей неделе", status: "correct"}
      - {value: "Вам удобно на следующей неделе", status: "correct"}
      - {value: "Вам удобно на следующей неделе?", status: "correct"}
    feedback: "Удобно ли на следующей неделе? (or Вам удобно на следующей неделе?) -- удобно ('convenient') is the polite, formal way to propose a new time."
  ru.b2.unit05.lesson05.exercise07.write_mozhet:
    instruction: "Write in Russian, informal: Maybe next week?"
    accepted_answers:
      - {value: "Может на следующей неделе", status: "correct"}
      - {value: "Может, на следующей неделе", status: "correct"}
    feedback: "Может, на следующей неделе? -- the informal way to propose next week to a friend."

  ru.b2.unit05.lesson06.exercise01.comprehend_register_fit:
    instruction: "How does Настя address Дима, and does that register fit the situation?"
    correct_option: "Informally -- and it fits, because Дима is a close friend."
    distractors: ["Formally -- and it fits, because he is a stranger.", "Informally -- but it does not fit; she should be formal.", "Formally -- but it does not fit; she should be informal."]
    accepted_answers: [{value: "Informally -- and it fits, because Дима is a close friend.", status: "correct"}]
    feedback: "Настя speaks informally to Дима (Привет, his first name, no Вы), which is exactly right for a friend -- the register fits the audience."
  ru.b2.unit05.lesson06.exercise02.comprehend_mismatch:
    instruction: "What would it signal if Настя wrote to the clinic in the SAME informal way she talks to Дима?"
    correct_option: "It would come across as too casual and disrespectful for an institution."
    distractors: ["It would come across as more efficient and clear.", "It would come across as too formal and distant.", "It would make no difference at all."]
    accepted_answers: [{value: "It would come across as too casual and disrespectful for an institution.", status: "correct"}]
    feedback: "As Дима says, 'туда, конечно, ты пишешь по-другому' -- informal register with an institution reads as too casual."
  ru.b2.unit05.lesson06.exercise03.comprehend_request:
    instruction: "What does Настя want to do?"
    correct_option: "Reschedule the meetup."
    distractors: ["Cancel the meetup for good.", "Meet Дима on Monday after all.", "Complain to the clinic."]
    accepted_answers: [{value: "Reschedule the meetup.", status: "correct"}]
    feedback: "Настя asks 'можем перенести встречу?' -- she wants to reschedule."
  ru.b2.unit05.lesson06.exercise04.speak_informal:
    instruction: "Say aloud in Russian the SAME request, first to your friend Дима -- informal, using Можешь: Can you reschedule the meetup?"
    accepted_answers:
      - {value: "Можешь перенести встречу", status: "correct"}
      - {value: "Ты можешь перенести встречу", status: "correct"}
    feedback: "Можешь перенести встречу? -- direct and informal, the right register for Дима."
  ru.b2.unit05.lesson06.exercise05.speak_formal:
    instruction: "Now say aloud in Russian the SAME request to the clinic -- formal, using Не могли бы Вы: Would you be able to reschedule my appointment?"
    accepted_answers:
      - {value: "Не могли бы Вы перенести мой приём", status: "correct"}
      - {value: "Не могли бы Вы перенести мой прием", status: "correct"}
    feedback: "Не могли бы Вы перенести мой приём? -- indirect and formal, the right register for the clinic."
  ru.b2.unit05.lesson06.exercise06.write_rewrite_formal:
    instruction: "Rewrite this informal message to Дима as a FORMAL one to the clinic. Informal: 'Привет, Дима, можем перенести встречу?' Write the formal version as two parts: the salutation Уважаемая администрация, then the request using Не могли бы Вы and мой приём (my appointment)."
    accepted_answers:
      - {value: "Уважаемая администрация, не могли бы Вы перенести мой приём?", status: "correct"}
      - {value: "Уважаемая администрация, не могли бы Вы перенести мой приём", status: "correct"}
      - {value: "Уважаемая администрация не могли бы Вы перенести мой приём?", status: "correct"}
      - {value: "Уважаемая администрация не могли бы Вы перенести мой приём", status: "correct"}
      - {value: "Уважаемая администрация, не могли бы Вы перенести мой прием?", status: "correct"}
    feedback: "The formal rewrite swaps 'Привет, Дима' for 'Уважаемая администрация' and the direct question for the indirect 'Не могли бы Вы перенести мой приём?'."
  ru.b2.unit05.lesson06.exercise07.write_both_registers:
    instruction: "Write the SAME request TWICE. (1) informally to your friend Дима, using Можешь: Can you reschedule the meetup? (2) formally to the clinic, using Не могли бы Вы: Would you be able to reschedule my appointment?"
    accepted_answers:
      - {value: "Можешь перенести встречу? Не могли бы Вы перенести мой приём?", status: "correct"}
      - {value: "Можешь перенести встречу? Не могли бы Вы перенести мой приём", status: "correct"}
      - {value: "Можешь перенести встречу Не могли бы Вы перенести мой приём?", status: "correct"}
      - {value: "Можешь перенести встречу Не могли бы Вы перенести мой приём", status: "correct"}
      - {value: "Можешь перенести встречу? Не могли бы Вы перенести мой прием?", status: "correct"}
      - {value: "Ты можешь перенести встречу? Не могли бы Вы перенести мой приём?", status: "correct"}
      - {value: "Ты можешь перенести встречу? Не могли бы Вы перенести мой прием?", status: "correct"}
    feedback: "Same request, two registers: informal 'Можешь перенести встречу?' for Дима, formal 'Не могли бы Вы перенести мой приём?' for the clinic."
