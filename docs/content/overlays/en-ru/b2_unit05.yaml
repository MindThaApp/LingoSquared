    accepted_answers: [{value: "to open a formal letter to an institution whose contact person you don't know", status: "correct"}]
    feedback: "Уважаемая администрация is the formal salutation for an institution -- not a friend."
  ru.b2.unit05.lesson02.exercise02.listen_s_uvazheniem:
    instruction: "Listen and select what you hear."
    correct_option: "Sincerely, Anastasia (formal closing)"
    distractors: ["Bye (informal farewell)", "Dear administration (formal opening)", "Hi, Dima!"]
    accepted_answers: [{value: "Sincerely, Anastasia (formal closing)", status: "correct"}]
    feedback: "С уважением, Анастасия is the everyday formal closing plus the formal full form of her name."
  ru.b2.unit05.lesson02.exercise03.match_openers_closers:
    instruction: "Match each opening or closing with its meaning and register."
    accepted_answers:
      - value:
          - {left: "Привет", right: "informal 'hi'"}
          - {left: "Пока", right: "informal 'bye'"}
          - {left: "Здравствуйте", right: "neutral-to-polite greeting"}
          - {left: "Уважаемая администрация", right: "formal salutation (Dear administration)"}
          - {left: "С уважением", right: "formal closing (kind regards / sincerely)"}
          - {left: "Анастасия", right: "formal full form of Настя"}
        status: "correct"
    feedback: "Informal Привет/Пока, neutral Здравствуйте, formal Уважаемая администрация/С уважением."
  ru.b2.unit05.lesson02.exercise04.order_s_uvazheniem:
    instruction: "Put the words in order, the formal closing: Sincerely, Anastasia."
    accepted_answers:
      - {value: ["С", "уважением", "Анастасия"], status: "correct"}
    feedback: "С уважением, Анастасия -- the standard formal sign-off, with the formal full name."
  ru.b2.unit05.lesson02.exercise05.translate_uvazhaemaya:
    instruction: "Write the formal Russian salutation for a letter to an institution: Dear administration."
    accepted_answers:
      - {value: "Уважаемая администрация", status: "correct"}
      - {value: "Уважаемая администрация,", status: "correct"}
    feedback: "Уважаемая администрация -- the formal opening for an institution."
  ru.b2.unit05.lesson02.exercise06.write_poka:
    instruction: "Write an informal Russian sign-off to a friend, from Настя: Bye, Nastya."
    accepted_answers:
      - {value: "Пока, Настя", status: "correct"}
      - {value: "Пока Настя", status: "correct"}
    feedback: "Пока, Настя -- the informal way to close a message to a friend."
  ru.b2.unit05.lesson02.exercise07.recognize_most_formal:
    instruction: "Which closing is the MOST formal here?"
    correct_option: "С уважением"
    distractors: ["Пока", "Привет", "Здравствуйте"]
    accepted_answers: [{value: "С уважением", status: "correct"}]
    feedback: "С уважением is the formal closing -- Пока and Привет are informal, Здравствуйте is a greeting, not a closing."

  ru.b2.unit05.lesson03.exercise01.recognize_bud_te_dobry:
    instruction: "What does this phrase do, and in which register?"
    correct_option: "opens a very polite formal request"
    distractors: ["opens an informal request", "declines an offer", "says goodbye"]
    accepted_answers: [{value: "opens a very polite formal request", status: "correct"}]
    feedback: "Будьте добры ('be so kind') opens a formal, polite request -- never used with a close friend."
  ru.b2.unit05.lesson03.exercise02.listen_ne_mogli_by_vy:
    instruction: "Listen and select what you hear."
    correct_option: "Would you be able to do this? (formal)"
    distractors: ["Do this, please. (informal)", "Do you want to do this? (informal)", "Be so kind as to help."]
    accepted_answers: [{value: "Would you be able to do this? (formal)", status: "correct"}]
    feedback: "Не могли бы Вы это сделать? is the formal, indirect request -- 'would you be able to do this?'."
  ru.b2.unit05.lesson03.exercise03.match_directness:
    instruction: "Match each form with its meaning and register."
    accepted_answers:
      - value:
          - {left: "Сделай", right: "do (informal imperative)"}
          - {left: "пожалуйста", right: "please"}
          - {left: "Не могли бы Вы", right: "would you be able to (formal)"}
          - {left: "Будьте добры", right: "be so kind (formal)"}
          - {left: "помогите", right: "help (formal imperative)"}
          - {left: "это", right: "this / it"}
        status: "correct"
    feedback: "Informal and direct: Сделай, пожалуйста. Formal and indirect: Не могли бы Вы, Будьте добры."
  ru.b2.unit05.lesson03.exercise04.order_ne_mogli_by_vy:
    instruction: "Put the words in order, formal: Would you be able to do this?"
    accepted_answers:
      - {value: ["Не", "могли", "бы", "Вы", "это", "сделать"], status: "correct"}
    feedback: "Не могли бы Вы это сделать? -- the formal register softens the request by avoiding the imperative."
  ru.b2.unit05.lesson03.exercise05.translate_sdelay:
    instruction: "Translate into Russian, informal and direct (using the ты-imperative Сделай): Do this, please."
    accepted_answers:
      - {value: "Сделай это пожалуйста", status: "correct"}
      - {value: "Сделай это, пожалуйста", status: "correct"}
    feedback: "Сделай это, пожалуйста -- direct is the friendly, normal choice between friends."
  ru.b2.unit05.lesson03.exercise06.speak_ne_mogli_by_vy:
    instruction: "Say aloud in Russian, formal (using Не могли бы Вы): Would you be able to do this?"
    accepted_answers:
      - {value: "Не могли бы Вы это сделать", status: "correct"}
    feedback: "Не могли бы Вы это сделать? -- a very common polite, indirect formal frame."
  ru.b2.unit05.lesson03.exercise07.write_bud_te_dobry:
    instruction: "Write in Russian, very formal (using Будьте добры): Be so kind as to help."
    accepted_answers:
      - {value: "Будьте добры, помогите", status: "correct"}
      - {value: "Будьте добры помогите", status: "correct"}
    feedback: "Будьте добры, помогите -- Будьте добры opens a very polite formal request."

  ru.b2.unit05.lesson04.exercise01.recognize_perenesti:
    instruction: "What does this word mean?"
    correct_option: "to reschedule / move"
    distractors: ["to cancel", "to confirm", "to attend"]
    accepted_answers: [{value: "to reschedule / move", status: "correct"}]
    feedback: "Перенести means to move something to another time -- to reschedule."
  ru.b2.unit05.lesson04.exercise02.listen_mozhem_perenesti:
    instruction: "Listen and select what you hear."
    correct_option: "Can we reschedule the meetup? (informal)"
    distractors: ["Would you be able to reschedule the appointment? (formal)", "Can we cancel the meetup? (informal)", "Do we have a meetup? (informal)"]
    accepted_answers: [{value: "Can we reschedule the meetup? (informal)", status: "correct"}]
    feedback: "Можем перенести встречу? is the informal form of the request -- direct, no softening frame."
  ru.b2.unit05.lesson04.exercise03.match_appointment_words:
    instruction: "Match each Russian word or phrase with its meaning."
    accepted_answers:
      - value:
          - {left: "встреча", right: "meeting / get-together"}
          - {left: "приём", right: "appointment (at a clinic or office)"}
          - {left: "поликлиника", right: "clinic"}
          - {left: "перенести", right: "to reschedule / move"}
          - {left: "понедельник", right: "Monday"}
          - {left: "к сожалению", right: "unfortunately"}
        status: "correct"
    feedback: "встреча and приём are the words the request is built from -- the same content will be wrapped in either register."
  ru.b2.unit05.lesson04.exercise04.order_formal_request:
    instruction: "Put the words in order, formal: Would you be able to reschedule my appointment?"
    accepted_answers:
      - {value: ["Не", "могли", "бы", "Вы", "перенести", "мой", "приём"], status: "correct"}
    feedback: "Не могли бы Вы перенести мой приём? -- the indirect, polite formal request."
  ru.b2.unit05.lesson04.exercise05.translate_informal_request:
    instruction: "Translate into Russian, informal (to your friend Дима): Can we reschedule the meetup?"
    accepted_answers:
      - {value: "Можем перенести встречу", status: "correct"}
      - {value: "Мы можем перенести встречу", status: "correct"}
    feedback: "Можем перенести встречу? -- direct and informal, for a friend."
  ru.b2.unit05.lesson04.exercise06.translate_formal_request:
    instruction: "Translate into Russian, formal (to the clinic, using Не могли бы Вы): Would you be able to reschedule my appointment?"
    accepted_answers:
      - {value: "Не могли бы Вы перенести мой приём", status: "correct"}
      - {value: "Не могли бы Вы перенести мой прием", status: "correct"}
    feedback: "Не могли бы Вы перенести мой приём? -- the SAME request, wrapped for an institution."
  ru.b2.unit05.lesson04.exercise07.write_k_sozhaleniyu:
    instruction: "Write in Russian, starting with 'unfortunately': Unfortunately I can't on Monday."
    accepted_answers:
      - {value: "К сожалению я не могу в понедельник", status: "correct"}
