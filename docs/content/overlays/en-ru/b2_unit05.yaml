    feedback: "К сожалению, я не могу в понедельник -- к сожалению softens the refusal, in either register."
  ru.b2.unit05.lesson04.exercise08.dictation_perenesti:
    instruction: "Type what you hear."
    correct_response: "Можем перенести встречу"
    orthography_strict: true
    feedback: "You heard Можем перенести встречу? — 'can we reschedule the meetup?', the informal way to ask to move a get-together."

  ru.b2.unit05.lesson05.exercise01.read_friend:
    instruction: "Which message is written to a close friend?"
    correct_option: "The one that opens 'Привет, Дима!' and signs off 'Пока, Настя'."
    distractors: ["The one that opens 'Уважаемая администрация' and signs off 'С уважением'.", "Neither -- both are formal.", "Both are informal."]
    accepted_answers: [{value: "The one that opens 'Привет, Дима!' and signs off 'Пока, Настя'.", status: "correct"}]
    feedback: "Привет and Пока are informal -- markers of a message to a friend."
  ru.b2.unit05.lesson05.exercise02.read_institution:
    instruction: "Which message is written to an institution?"
    correct_option: "The one that opens 'Уважаемая администрация' and signs off 'С уважением'."
    distractors: ["The one that opens 'Привет, Дима!' and signs off 'Пока, Настя'.", "Neither -- both are informal.", "Both are formal."]
    accepted_answers: [{value: "The one that opens 'Уважаемая администрация' and signs off 'С уважением'.", status: "correct"}]
    feedback: "Уважаемая администрация and С уважением are formal -- markers of a message to an institution."
  ru.b2.unit05.lesson05.exercise03.read_same_request:
    instruction: "Both messages make the SAME request. What is it?"
