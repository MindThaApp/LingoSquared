review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Overlay for ru's C1 unit03 on fine-grained control of tone and register.
    English-speaker interference risks: (1) the four tone markers
    (*Уважаемый/сообщаю*, *к сожалению/надеюсь на понимание*, *ну конечно/
    как всегда*, *честно говоря/просто необходимо*) are fixed, low-frequency
    constructions an English speaker will not build compositionally, so the
    production prompts name the exact marker for each tone; (2) the culminating
    model is gender-neutral (*готов* agrees with *отчёт*, *сообщаю* is present
    tense, *просто необходимо* is impersonal) so a learner of either gender
    reproduces it exactly; (3) the culminating speaking and writing exercises
    each require the WHOLE act — the same message first in a formal/diplomatic
    style, then in an emphatic style — and their accepted answers are the exact
    taught model (with and without the final period). No sibling-direction file
    was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    accepted answers against grading (no ё/е folding), distractors,
    instructions, notes. Fixes: lesson01.exercise01.recognize_oficialny
    distractor 'Здравствуйте, Иван Петрович' (a valid formal salutation) ->
    'Привет, Ваня'; е-spelled variants added to accepted_answers of
    write_oficialny, translate_diplomatichny, write_ironichny,
    speak_emfatichesky, speak_ves_akt, write_ves_akt;
    recognize_diplomatichny and recognize_emfatichesky instructions no
    longer name the answer's opening words; match_sravnenie accepted value
    'Ну конечно' -> 'pretended agreement (irony)' (mirrors realization);
    lesson06.teach.modello_polnyj note de-meta'd ('This is the model to
    reproduce: ...'); lesson01.teach.pryamoe_soobshchenie note's
    course-construction sentence rewritten. NATIVE FLAGS: (a) the ironic
    model 'Ну конечно, отчёт будет готов ещё вчера, как всегда' blends
    future будет готов with ещё вчера -- the natural sarcastic idiom is
    'отчёт нужен был ещё вчера' / 'должен был быть готов ещё вчера';
    changing it means every copy, the audio asset and the glosses; (b)
    formal-letter convention: '!' after the salutation and capitalized 'Вам'
    for a single addressee -- not graded (case-insensitive), but the unit
    teaches formal register. DEFERRED: dictation_ves_akt
    (orthography_strict, single correct_response with отчёт) marks a learner
    typing отчет wrong -- needs an owner decision on ru ё/е folding in
    backend/app/review/grading.py (Codex lane), which would also make the
    е-variant additions redundant and cover mixed ё/е spellings; English
    target_blocks that duplicate the overlay instruction (compiler prints
    both) are a structural ru-C1 authoring pattern -- owner decision.

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 2 fixes - overlay lesson05.exercise02.read_formal and exercise03.read_emfatichesky: instructions named the Russian markers that gave the answer away (and called the emphatic message 'informal'); reworded to ask for the formal/emphatic message without naming markers. NATIVE FLAGS: first 'formal diplomatic' label covers a formal-only message (diplomatic markers are in lesson02); 'будет готов ещё вчера' is a deliberate joke idiom, prior flag stands. DEFERRED: dictation ё/е folding (owner decision) stands.

course:
  title: "Russian C1"
  description: "Advanced Russian register: shift the same message between formal, diplomatic, ironic, and emphatic styles to suit the audience."

units:
  ru.c1.unit03.ton_i_registr:
    title: "Tone and register"
    description: "Control tone and register precisely: deliver the same core message in a formal, diplomatic, ironic, or emphatic style for different audiences."

lessons:
  ru.c1.unit03.ton_i_registr.lesson01.oficialny_ton:
    title: "The formal tone"
  ru.c1.unit03.ton_i_registr.lesson02.diplomatichny_ton:
    title: "The diplomatic tone"
  ru.c1.unit03.ton_i_registr.lesson03.ironichny_ton:
    title: "The ironic tone"
  ru.c1.unit03.ton_i_registr.lesson04.emfatichesky_ton:
    title: "The emphatic tone"
  ru.c1.unit03.ton_i_registr.lesson05.sravnenie_tonov:
    title: "Comparing the tones"
  ru.c1.unit03.ton_i_registr.lesson06.ves_akt:
    title: "The whole act"

teaching:
  ru.c1.unit03.ton_i_registr.lesson01.teach.pryamoe_soobshchenie:
    title: "The direct message"
    gloss: "The report is delayed. I need two more days."
    note: "*Отчёт задерживается* ('the report is delayed') states the plain fact; *мне нужно ещё два дня* ('I need two more days') is the blunt request. This blunt version is the neutral baseline that each tone below reshapes."
  ru.c1.unit03.ton_i_registr.lesson01.teach.uvazhaemyj:
    title: "the formal salutation"
    gloss: "Dear Ivan Petrovich"
    note: "*Уважаемый Иван Петрович* ('Dear Ivan Petrovich') is the formal written salutation to a superior. *Иван Петрович* is a first name plus patronymic."
  ru.c1.unit03.ton_i_registr.lesson01.teach.soobshchayu:
    title: "reporting the delay formally"
    gloss: "I inform you that the report will be ready a bit later."
    note: "*Сообщаю вам* ('I inform you') is a formal reporting verb that takes the formal dative *вам*. *Отчёт будет готов немного позже* means 'the report will be ready a bit later'."
  ru.c1.unit03.ton_i_registr.lesson01.teach.modello_oficialny:
    title: "A formal message"
    gloss: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later."
    note: "The formal message pairs the salutation *Уважаемый Иван Петрович* with the formal verb *сообщаю* and formal *вам*."

  ru.c1.unit03.ton_i_registr.lesson02.teach.k_sozhaleniyu:
    title: "softening bad news"
    gloss: "Unfortunately, the report will be ready a bit later."
    note: "*К сожалению* ('unfortunately') softens bad news — it acknowledges regret before stating the delay."
  ru.c1.unit03.ton_i_registr.lesson02.teach.nadeyus_na_ponimanie:
    title: "appealing for understanding"
    gloss: "I hope for your understanding."
    note: "*Надеюсь на ваше понимание* ('I hope for your understanding') is a diplomatic appeal; *на ваше понимание* uses formal *ваше*."
  ru.c1.unit03.ton_i_registr.lesson02.teach.potrebuetsya_vremya:
    title: "asking for more time"
    gloss: "We will need a bit more time."
    note: "*Нам потребуется ещё немного времени* ('we will need a bit more time') is a softened way to ask for a delay, avoiding a blunt 'I am late'."
  ru.c1.unit03.ton_i_registr.lesson02.teach.modello_diplomatichny:
    title: "A diplomatic message"
    gloss: "Unfortunately, the report will be ready a bit later. I hope for your understanding."
    note: "The diplomatic message softens the delay with *к сожалению* and closes with the appeal *надеюсь на ваше понимание*."

  ru.c1.unit03.ton_i_registr.lesson03.teach.nu_konechno:
    title: "pretending agreement"
    gloss: "Oh sure, the report will be ready already yesterday."
    note: "*Ну конечно* ('oh sure') pretends to agree while the rest of the sentence reveals the opposite — the report cannot be ready *ещё вчера* ('already yesterday')."
  ru.c1.unit03.ton_i_registr.lesson03.teach.kak_vsegda:
    title: "the ironic aside"
    gloss: "As always, everything at the last moment."
    note: "*Как всегда* ('as always') and *в последний момент* ('at the last moment') turn a statement into an ironic aside about a recurring problem."
  ru.c1.unit03.ton_i_registr.lesson03.teach.modello_ironichny:
    title: "An ironic remark"
    gloss: "Oh sure, the report will be ready yesterday, as always."
    note: "Irony pretends to agree (*ну конечно*) while *ещё вчера* and *как всегда* expose the opposite meaning."

  ru.c1.unit03.ton_i_registr.lesson04.teach.chestno_govorya:
    title: "stressing the truth"
    gloss: "Honestly, the report is almost ready."
    note: "*Честно говоря* ('honestly') opens an emphatic statement that stresses the truth of what follows."
  ru.c1.unit03.ton_i_registr.lesson04.teach.prosto_neobkhodimo:
    title: "stressing a need"
    gloss: "I simply need two more days."
    note: "*Просто необходимо* ('simply necessary') intensifies the need — stronger than plain *нужно*."
  ru.c1.unit03.ton_i_registr.lesson04.teach.obyazatelno:
    title: "a firm promise"
    gloss: "The report will definitely be ready tomorrow."
    note: "*Обязательно* ('definitely') expresses firm commitment."
  ru.c1.unit03.ton_i_registr.lesson04.teach.modello_emfatichesky:
    title: "An emphatic message"
    gloss: "Honestly, the report is almost ready, but I simply need two more days."
    note: "The emphatic message stresses honesty (*честно говоря*), progress (*почти готов*), and a firm need (*просто необходимо*)."

  ru.c1.unit03.ton_i_registr.lesson05.teach.sravnenie:
    title: "Two versions of one message"
    gloss: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later. Honestly, the report is almost ready, but I simply need two more days."
    note: "The same delayed-report message, delivered first in a formal diplomatic register and then in an emphatic register. Compare the salutation and verb in the first with the markers in the second."
  ru.c1.unit03.ton_i_registr.lesson05.teach.ton:
    title: "tone"
    gloss: "tone"
    note: "*Тон* ('tone') is the emotional and stylistic colouring a speaker gives a message — formal, diplomatic, ironic, or emphatic."
    example_gloss: "The tone of this letter is very formal."

  ru.c1.unit03.ton_i_registr.lesson06.teach.modello_polnyj:
    title: "The model to reproduce"
    gloss: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later. Honestly, the report is almost ready, but I simply need two more days."
    note: "This is the model to reproduce: the same core message delivered first in a formal diplomatic style, then in an emphatic style."
  ru.c1.unit03.ton_i_registr.lesson06.teach.registr:
    title: "register"
    gloss: "register"
    note: "*Регистр* ('register') is the level of formality — official or informal — chosen to suit the audience."
    example_gloss: "The formal register requires «вы»."

exercises:
  ru.c1.unit03.ton_i_registr.lesson01.exercise01.recognize_oficialny:
    instruction: "Which Russian phrase is the formal salutation for a message to a superior?"
    correct_option: "Уважаемый Иван Петрович"
    distractors: ["Привет, Иван Петрович", "Дорогой Иван Петрович", "Привет, Ваня"]
    accepted_answers: [{value: "Уважаемый Иван Петрович", status: correct}]
    feedback: "*Уважаемый Иван Петрович* is the formal written salutation — 'Dear Ivan Petrovich' — used for a superior."
  ru.c1.unit03.ton_i_registr.lesson01.exercise02.listen_oficialny:
    instruction: "Listen and select what you hear."
    correct_option: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later."
    distractors: ["Dear Ivan Petrovich, I inform you that the report is ready.", "Dear Ivan Petrovich, I inform you that the report will be ready much later.", "Dear Ivan Petrovich, I ask you whether the report will be ready a bit later."]
    accepted_answers: [{value: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later.", status: correct}]
    feedback: "Уважаемый Иван Петрович, сообщаю вам, что отчёт будет готов немного позже means Dear Ivan Petrovich, I inform you that the report will be ready a bit later."
  ru.c1.unit03.ton_i_registr.lesson01.exercise03.match_oficialny:
    instruction: "Match each Russian formal-message element to its English meaning."
    accepted_answers:
      - value: {"Уважаемый Иван Петрович": "Dear Ivan Petrovich (formal salutation)", "сообщаю вам": "I inform you (formal)", "отчёт будет готов": "the report will be ready", "немного позже": "a bit later", "отчёт задерживается": "the report is delayed", "ещё два дня": "two more days"}
        status: correct
    feedback: "These elements build the formal message that reports a delay to a superior."
  ru.c1.unit03.ton_i_registr.lesson01.exercise04.order_oficialny:
    instruction: "Put the Russian words in order to state when the report will be ready."
    accepted_answers:
      - {value: "отчёт будет готов немного позже", status: correct}
    feedback: "Отчёт будет готов немного позже — the report will be ready a bit later."
  ru.c1.unit03.ton_i_registr.lesson01.exercise05.write_oficialny:
    instruction: "Write the exact taught formal message to a superior: the salutation Уважаемый Иван Петрович, then Сообщаю вам, что отчёт будет готов немного позже."
    accepted_answers:
      - {value: "Уважаемый Иван Петрович, сообщаю вам, что отчёт будет готов немного позже.", status: correct}
      - {value: "Уважаемый Иван Петрович, сообщаю вам, что отчёт будет готов немного позже", status: correct}
      - {value: "Уважаемый Иван Петрович, сообщаю вам, что отчет будет готов немного позже.", status: correct}
    feedback: "Уважаемый Иван Петрович, сообщаю вам, что отчёт будет готов немного позже."

  ru.c1.unit03.ton_i_registr.lesson02.exercise01.recognize_diplomatichny:
    instruction: "Which Russian sentence states the bad news diplomatically, softening it with an expression of regret?"
    correct_option: "К сожалению, отчёт будет готов немного позже."
    distractors: ["Сообщаю вам, что отчёт будет готов немного позже.", "Надеюсь на ваше понимание.", "Отчёт задерживается."]
    accepted_answers: [{value: "К сожалению, отчёт будет готов немного позже.", status: correct}]
    feedback: "*К сожалению* ('unfortunately') is the diplomatic opener that softens bad news."
  ru.c1.unit03.ton_i_registr.lesson02.exercise02.listen_diplomatichny:
    instruction: "Listen and select what you hear."
    correct_option: "Unfortunately, the report will be ready a bit later. I hope for your understanding."
    distractors: ["Unfortunately, the report will be ready much later. I hope for your understanding.", "Fortunately, the report will be ready a bit later. I hope for your understanding.", "Unfortunately, the report will be ready a bit later. I do not hope for your understanding."]
    accepted_answers: [{value: "Unfortunately, the report will be ready a bit later. I hope for your understanding.", status: correct}]
    feedback: "К сожалению, отчёт будет готов немного позже. Надеюсь на ваше понимание means unfortunately, the report will be ready a bit later; I hope for your understanding."
  ru.c1.unit03.ton_i_registr.lesson02.exercise03.match_diplomatichny:
    instruction: "Match each Russian diplomatic element to its English meaning."
    accepted_answers:
      - value: {"К сожалению": "unfortunately", "Надеюсь на ваше понимание": "I hope for your understanding", "Нам потребуется ещё немного времени": "we will need a bit more time", "немного позже": "a bit later", "отчёт задерживается": "the report is delayed", "потребуется": "will be needed"}
        status: correct
    feedback: "These elements soften bad news diplomatically instead of stating it bluntly."
  ru.c1.unit03.ton_i_registr.lesson02.exercise04.order_diplomatichny:
    instruction: "Put the Russian words in order to express diplomatic hope."
    accepted_answers:
      - {value: "Надеюсь на ваше понимание", status: correct}
    feedback: "Надеюсь на ваше понимание — I hope for your understanding."
  ru.c1.unit03.ton_i_registr.lesson02.exercise05.translate_diplomatichny:
    instruction: "Translate into Russian: Unfortunately, the report will be ready a bit later. I hope for your understanding."
    accepted_answers:
      - {value: "К сожалению, отчёт будет готов немного позже. Надеюсь на ваше понимание.", status: correct}
      - {value: "К сожалению, отчёт будет готов немного позже. Надеюсь на ваше понимание", status: correct}
      - {value: "К сожалению, отчет будет готов немного позже. Надеюсь на ваше понимание.", status: correct}
    feedback: "К сожалению, отчёт будет готов немного позже. Надеюсь на ваше понимание."

  ru.c1.unit03.ton_i_registr.lesson03.exercise01.recognize_ironichny:
    instruction: "Which Russian phrase is ironic — pretending agreement while meaning the opposite?"
    correct_option: "Ну конечно, отчёт будет готов ещё вчера."
    distractors: ["Сообщаю вам, что отчёт будет готов немного позже.", "К сожалению, отчёт будет готов немного позже.", "Отчёт задерживается."]
    accepted_answers: [{value: "Ну конечно, отчёт будет готов ещё вчера.", status: correct}]
    feedback: "*Ну конечно* ('oh sure') pretends to agree, while *ещё вчера* ('already yesterday') exposes the opposite — the report cannot be ready yesterday."
  ru.c1.unit03.ton_i_registr.lesson03.exercise02.listen_ironichny:
    instruction: "Listen and select what you hear."
    correct_option: "Oh sure, the report will be ready yesterday, as always."
    distractors: ["Oh sure, the report will be ready today, as always.", "Oh sure, the report was ready yesterday, as always.", "Oh sure, the report will be ready yesterday, for once."]
    accepted_answers: [{value: "Oh sure, the report will be ready yesterday, as always.", status: correct}]
    feedback: "Ну конечно, отчёт будет готов ещё вчера, как всегда means oh sure, the report will be ready yesterday, as always — ironic, since a report cannot be ready yesterday."
  ru.c1.unit03.ton_i_registr.lesson03.exercise03.match_ironichny:
    instruction: "Match each Russian ironic element to its English meaning."
    accepted_answers:
      - value: {"Ну конечно": "oh sure (ironic)", "ещё вчера": "already yesterday", "как всегда": "as always", "в последний момент": "at the last moment", "отчёт будет готов": "the report will be ready", "задерживается": "is delayed"}
        status: correct
    feedback: "These elements build an ironic remark that pretends to agree while meaning the opposite."
  ru.c1.unit03.ton_i_registr.lesson03.exercise04.order_ironichny:
    instruction: "Put the Russian words in order to form the ironic claim."
    accepted_answers:
      - {value: "отчёт будет готов ещё вчера", status: correct}
    feedback: "Отчёт будет готов ещё вчера — the report will be ready already yesterday (ironic)."
  ru.c1.unit03.ton_i_registr.lesson03.exercise05.write_ironichny:
    instruction: "Write the exact taught ironic sentence: Ну конечно, отчёт будет готов ещё вчера, как всегда."
    accepted_answers:
      - {value: "Ну конечно, отчёт будет готов ещё вчера, как всегда.", status: correct}
      - {value: "Ну конечно, отчёт будет готов ещё вчера, как всегда", status: correct}
      - {value: "Ну конечно, отчет будет готов еще вчера, как всегда.", status: correct}
    feedback: "Ну конечно, отчёт будет готов ещё вчера, как всегда."

  ru.c1.unit03.ton_i_registr.lesson04.exercise01.recognize_emfatichesky:
    instruction: "Which Russian phrase is emphatic — stressing the truth of what follows?"
    correct_option: "Честно говоря, отчёт почти готов."
    distractors: ["Сообщаю вам, что отчёт будет готов немного позже.", "К сожалению, отчёт будет готов немного позже.", "Ну конечно, отчёт будет готов ещё вчера."]
    accepted_answers: [{value: "Честно говоря, отчёт почти готов.", status: correct}]
    feedback: "*Честно говоря* ('honestly') is the emphatic opener that stresses the truth of what follows."
  ru.c1.unit03.ton_i_registr.lesson04.exercise02.listen_emfatichesky:
    instruction: "Listen and select what you hear."
    correct_option: "Honestly, the report is almost ready, but I simply need two more days."
    distractors: ["Honestly, the report is almost ready, but I simply need one more day.", "Honestly, the report is fully ready, but I simply need two more days.", "Honestly, the report is almost ready, so I simply need two more days."]
    accepted_answers: [{value: "Honestly, the report is almost ready, but I simply need two more days.", status: correct}]
    feedback: "Честно говоря, отчёт почти готов, но мне просто необходимо ещё два дня means honestly, the report is almost ready, but I simply need two more days."
  ru.c1.unit03.ton_i_registr.lesson04.exercise03.match_emfatichesky:
    instruction: "Match each Russian emphatic element to its English meaning."
    accepted_answers:
      - value: {"Честно говоря": "honestly", "почти готов": "almost ready", "просто необходимо": "simply necessary", "обязательно": "definitely", "ещё два дня": "two more days", "завтра": "tomorrow"}
        status: correct
    feedback: "These elements build an emphatic statement that stresses urgency and commitment."
  ru.c1.unit03.ton_i_registr.lesson04.exercise04.order_emfatichesky:
    instruction: "Put the Russian words in order to stress what you need."
    accepted_answers:
      - {value: "мне просто необходимо ещё два дня", status: correct}
    feedback: "Мне просто необходимо ещё два дня — I simply need two more days."
  ru.c1.unit03.ton_i_registr.lesson04.exercise05.speak_emfatichesky:
    instruction: "Say aloud the exact taught emphatic message: Честно говоря, отчёт почти готов, но мне просто необходимо ещё два дня."
    accepted_answers:
      - {value: "Честно говоря, отчёт почти готов, но мне просто необходимо ещё два дня.", status: correct}
      - {value: "Честно говоря, отчёт почти готов, но мне просто необходимо ещё два дня", status: correct}
      - {value: "Честно говоря, отчет почти готов, но мне просто необходимо еще два дня.", status: correct}
    feedback: "Честно говоря, отчёт почти готов, но мне просто необходимо ещё два дня."

  ru.c1.unit03.ton_i_registr.lesson05.exercise01.listen_sravnenie:
    instruction: "Listen to the two messages. In what order are the two registers delivered?"
    correct_option: "formal diplomatic message, then emphatic message"
    distractors: ["emphatic message, then formal diplomatic message", "two formal diplomatic messages", "two emphatic messages"]
    accepted_answers: [{value: "formal diplomatic message, then emphatic message", status: correct}]
    feedback: "The clip delivers the same delayed-report message first in a formal diplomatic register, then in an emphatic register."
  ru.c1.unit03.ton_i_registr.lesson05.exercise02.read_formal:
    instruction: "Read the passage. Which of these messages is the formal one, addressed to a superior?"
    correct_option: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later."
    distractors: ["Honestly, the report is almost ready, but I simply need two more days.", "Unfortunately, the report will be ready a bit later. I hope for your understanding.", "Oh sure, the report will be ready yesterday, as always."]
    accepted_answers: [{value: "Dear Ivan Petrovich, I inform you that the report will be ready a bit later.", status: correct}]
    feedback: "The first message is the formal one — *Уважаемый Иван Петрович* opens it and *сообщаю* states the news formally."
  ru.c1.unit03.ton_i_registr.lesson05.exercise03.read_emfatichesky:
