  ru.a2.unit33.lesson03.exercise04.order_weekend: {instruction: "Put the words in order to say \"On the weekend I meet friends.\"", accepted_answers: [{value: ["В", "выходные", "я", "встречаюсь", "с", "друзьями"], status: "correct"}, {value: ["Я", "встречаюсь", "с", "друзьями", "в", "выходные"], status: "correct"}], feedback: "The correct order is *В выходные я встречаюсь с друзьями*."}
  ru.a2.unit33.lesson03.exercise05.respond_week:
    instruction: "Dima asks \"Как обычно проходит твоя неделя?\" Answer with the exact sentence: \"В будни я работаю в школе.\""
