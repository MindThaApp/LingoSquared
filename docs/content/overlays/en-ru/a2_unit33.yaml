      - {value: "В будни я работаю в школе", status: "correct"}
    feedback: "The model answer is *В будни я работаю в школе*."
  ru.a2.unit33.lesson03.exercise06.write_weekly_schedule_message:
    instruction: "Write four short sentences describing a typical week: say that on weekdays you work at school, on Tuesdays after work you go to classes, then you have dinner at home, and on the weekend you rest."
