overlay_key: "en-ru.a2.unit33"
source_language: "en"
target_language: "ru"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "codex", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Codex-authored draft. Needs fresh-context review."}

course:
  title: "Russian A2"
  description: "Learn A2-level Russian for weekly schedules."

units:
  ru.a2.unit33.nedelja: {title: "Week"}

lessons:
  ru.a2.unit33.lesson01.budni: {title: "On weekdays and on the weekend"}
  ru.a2.unit33.lesson02.posle: {title: "After work"}
  ru.a2.unit33.lesson03.tipichnaya: {title: "Dialogue: a typical week"}

teaching:
  ru.a2.unit33.lesson01.teach.nedelya: {title: "неделя", gloss: "week", note: "*обычная неделя* means a typical week.", example_gloss: "What is your typical week like?"}
  ru.a2.unit33.lesson01.teach.budni: {title: "в будни", gloss: "on weekdays", note: "*будни* are weekdays or workdays.", example_gloss: "On weekdays I work at school."}
  ru.a2.unit33.lesson01.teach.vyhodnye: {title: "в выходные", gloss: "on the weekend", note: "*выходные* are days off or the weekend.", example_gloss: "On the weekend I rest."}
  ru.a2.unit33.lesson02.teach.vtornik: {title: "во вторник", gloss: "on Tuesday", note: "Russian uses *во* before *вторник*.", example_gloss: "On Tuesday I go to a course."}
  ru.a2.unit33.lesson02.teach.posle_raboty: {title: "после работы", gloss: "after work", note: "*после* takes genitive: *работы*.", example_gloss: "After work I go to a course."}
  ru.a2.unit33.lesson02.teach.potom: {title: "потом", gloss: "then / after that", note: "*потом* sequences the next activity.", example_gloss: "Then I have dinner at home."}
  ru.a2.unit33.lesson03.teach.dima_week: {title: "Dima asks about Nastya's week", gloss: "Dima: Nastya, what is your typical week like?", note: "Friends use informal *у тебя*."}
  ru.a2.unit33.lesson03.teach.nastya_weekdays: {title: "Nastya starts with weekdays", gloss: "Nastya: On weekdays I work at school.", note: "This stays consistent with Настя being a teacher."}
  ru.a2.unit33.lesson03.teach.nastya_tuesday: {title: "Nastya gives a Tuesday activity", gloss: "Nastya: On Tuesday after work I go to a course.", note: "This gives a day and activity."}
  ru.a2.unit33.lesson03.teach.nastya_then: {title: "Nastya sequences the next activity", gloss: "Nastya: Then I have dinner at home.", note: "*потом* marks the sequence."}
  ru.a2.unit33.lesson03.teach.nastya_weekend: {title: "Nastya contrasts the weekend", gloss: "Nastya: On the weekend I rest and meet friends.", note: "This contrasts weekdays with the weekend."}

exercises:
  ru.a2.unit33.lesson01.exercise01.recognize_budni: {instruction: "Which phrase means \"on weekdays\"?", correct_option: "в будни", distractors: ["в выходные", "во вторник", "после работы"], accepted_answers: [{value: "в будни", status: "correct"}], feedback: "*в будни* means \"on weekdays.\""}
  ru.a2.unit33.lesson01.exercise02.recognize_vyhodnye: {instruction: "Which phrase means \"on the weekend\"?", correct_option: "в выходные", distractors: ["в будни", "после работы", "обычная неделя"], accepted_answers: [{value: "в выходные", status: "correct"}], feedback: "*в выходные* means \"on the weekend.\""}
  ru.a2.unit33.lesson01.exercise03.listen_select_weekdays_weekend: {instruction: "Listen. What weekly contrast does the speaker make?", correct_option: "She works on weekdays and rests on the weekend.", distractors: ["She studies on Monday and travels on Tuesday.", "She shops online every evening.", "She asks staff about another train."], accepted_answers: [{value: "She works on weekdays and rests on the weekend.", status: "correct"}], feedback: "The recording contrasts *в будни* with *в выходные*."}
  ru.a2.unit33.lesson01.exercise04.match_week_parts:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "неделя", right: "week"}
          - {left: "обычная неделя", right: "typical week"}
          - {left: "в будни", right: "on weekdays"}
          - {left: "в выходные", right: "on the weekend"}
          - {left: "работаю", right: "I work"}
          - {left: "отдыхаю", right: "I rest"}
        status: "correct"
    feedback: "These pieces contrast weekdays and the weekend."
  ru.a2.unit33.lesson01.exercise05.order_weekdays: {instruction: "Put the words in order to say \"On weekdays I work.\"", accepted_answers: [{value: ["В", "будни", "я", "работаю"], status: "correct"}], feedback: "The correct order is *В будни я работаю*."}
  ru.a2.unit33.lesson01.exercise06.write_contrast:
    instruction: "Write exactly this contrast: On weekdays I work, and on the weekend I rest."
    accepted_answers:
      - {value: "В будни я работаю, а в выходные отдыхаю.", status: "correct"}
      - {value: "В будни я работаю а в выходные отдыхаю", status: "correct"}
    feedback: "The model answer is *В будни я работаю, а в выходные отдыхаю*."
  ru.a2.unit33.lesson02.exercise01.recognize_vtornik: {instruction: "Which phrase means \"on Tuesday\"?", correct_option: "во вторник", distractors: ["в будни", "потом", "в выходные"], accepted_answers: [{value: "во вторник", status: "correct"}], feedback: "*во вторник* means \"on Tuesday.\""}
  ru.a2.unit33.lesson02.exercise02.recognize_posle: {instruction: "Which phrase means \"after work\"?", correct_option: "после работы", distractors: ["во вторник", "в выходные", "дома"], accepted_answers: [{value: "после работы", status: "correct"}], feedback: "*после работы* means \"after work.\""}
  ru.a2.unit33.lesson02.exercise03.listen_select_course: {instruction: "Listen. What happens after work?", correct_option: "The speaker goes to a course.", distractors: ["The speaker reads news.", "The speaker asks for a refund.", "The speaker misses a connection."], accepted_answers: [{value: "The speaker goes to a course.", status: "correct"}], feedback: "The recording says *После работы я иду на курс*."}
  ru.a2.unit33.lesson02.exercise04.match_sequence:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "во вторник", right: "on Tuesday"}
          - {left: "после работы", right: "after work"}
          - {left: "иду на курс", right: "I go to a course"}
          - {left: "потом", right: "then / after that"}
          - {left: "ужинаю", right: "I have dinner"}
          - {left: "дома", right: "at home"}
        status: "correct"
    feedback: "These phrases sequence activities during the week."
  ru.a2.unit33.lesson02.exercise05.order_after_work: {instruction: "Put the words in order to say \"After work I go to a course.\"", accepted_answers: [{value: ["После", "работы", "я", "иду", "на", "курс"], status: "correct"}], feedback: "The correct order is *После работы я иду на курс*."}
  ru.a2.unit33.lesson02.exercise06.write_sequence:
    instruction: "Write two sentences: On Tuesday after work I go to a course. Then I have dinner at home."
    accepted_answers:
      - {value: "Во вторник после работы я иду на курс. Потом я ужинаю дома.", status: "correct"}
      - {value: "Во вторник после работы я иду на курс. Потом я ужинаю дома", status: "correct"}
    feedback: "The model answer uses *во вторник*, *после работы*, and *потом*."
  ru.a2.unit33.lesson03.exercise01.choose_week_sequence: {instruction: "Which answer describes a weekly sequence?", correct_option: "В будни я работаю. Во вторник после работы я иду на курс. Потом я ужинаю дома.", distractors: ["Где платформа?", "Я часто пользуюсь телефоном.", "Есть другой поезд?"], accepted_answers: [{value: "В будни я работаю. Во вторник после работы я иду на курс. Потом я ужинаю дома.", status: "correct"}], feedback: "This answer sequences three weekly activities."}
  ru.a2.unit33.lesson03.exercise02.dialogue_comprehension_week:
    instruction: "Listen to the dialogue. Which activities happen on weekdays, Tuesday after work, and the weekend?"
    correct_option: "On weekdays Nastya works at school; on Tuesday after work she goes to a course; on the weekend she rests and meets friends"
    distractors: ["On weekdays Nastya watches videos; on Tuesday she returns a shirt; on the weekend she opens an account", "On weekdays Nastya misses a train; on Tuesday she asks a doctor; on the weekend she files a form", "On weekdays Nastya buys medicine; on Tuesday she changes a platform; on the weekend she starts a job"]
    accepted_answers: [{value: "On weekdays Nastya works at school; on Tuesday after work she goes to a course; on the weekend she rests and meets friends", status: "correct"}]
    feedback: "The dialogue gives weekday work, Tuesday course, dinner after that, and weekend rest with friends."
  ru.a2.unit33.lesson03.exercise03.match_dialogue_week:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "обычная неделя", right: "typical week"}
          - {left: "В будни я работаю.", right: "On weekdays I work."}
          - {left: "во вторник", right: "on Tuesday"}
          - {left: "после работы", right: "after work"}
          - {left: "Потом я ужинаю.", right: "Then I have dinner."}
          - {left: "встречаюсь с друзьями", right: "I meet friends"}
        status: "correct"
    feedback: "These phrases describe and sequence a typical week."
  ru.a2.unit33.lesson03.exercise04.order_weekend: {instruction: "Put the words in order to say \"On the weekend I meet friends.\"", accepted_answers: [{value: ["В", "выходные", "я", "встречаюсь", "с", "друзьями"], status: "correct"}], feedback: "The correct order is *В выходные я встречаюсь с друзьями*."}
  ru.a2.unit33.lesson03.exercise05.respond_week:
    instruction: "Dima asks \"Как обычно проходит твоя неделя?\" Answer with the exact sentence: \"В будни я работаю в школе.\""
    accepted_answers:
      - {value: "В будни я работаю в школе.", status: "correct"}
      - {value: "В будни я работаю в школе", status: "correct"}
    feedback: "The model answer is *В будни я работаю в школе*."
  ru.a2.unit33.lesson03.exercise06.write_weekly_schedule_message:
    instruction: "Write four short sentences describing a typical week: say that on weekdays you work at school, on Tuesday after work you go to a course, then you have dinner at home, and on the weekend you rest."
    accepted_answers:
      - {value: "В будни я работаю в школе. Во вторник после работы я иду на курс. Потом я ужинаю дома. В выходные я отдыхаю.", status: "correct"}
      - {value: "В будни я работаю в школе. Во вторник после работы я иду на курс. Потом я ужинаю дома. В выходные я отдыхаю", status: "correct"}
    feedback: "A complete answer contrasts weekdays and weekend and sequences at least three activities."
