course:
  title: "Russian A2"
  description: "Learn A2-level Russian for weekly schedules."

units:
  ru.a2.unit33.nedelja: {title: "Week"}

lessons:
  ru.a2.unit33.lesson01.budni: {title: "On weekdays and on the weekend"}
  ru.a2.unit33.lesson02.posle: {title: "After work"}
  ru.a2.unit33.lesson03.tipichnaya: {title: "Dialogue: a typical week"}

teaching:
  ru.a2.unit33.lesson01.teach.nedelya: {title: "неделя", gloss: "week", note: "*обычная неделя* means a typical week.", example_gloss: "What is your typical week like?"}
  ru.a2.unit33.lesson01.teach.budni: {title: "в будни", gloss: "on weekdays", note: "*будни* are weekdays or workdays.", example_gloss: "On weekdays I work at school."}
  ru.a2.unit33.lesson01.teach.vyhodnye: {title: "в выходные", gloss: "on the weekend", note: "*выходные* are days off or the weekend.", example_gloss: "On the weekend I rest."}
  ru.a2.unit33.lesson02.teach.vtornik: {title: "во вторник", gloss: "on Tuesday", note: "Russian uses *во* before *вторник*: *во вторник* means on (one) Tuesday.", example_gloss: "On Tuesday I work."}
  ru.a2.unit33.lesson02.teach.po_vtornikam: {title: "по вторникам", gloss: "on Tuesdays", note: "*по вторникам* means every Tuesday, for something you do regularly.", example_gloss: "On Tuesdays I work."}
  ru.a2.unit33.lesson02.teach.posle_raboty: {title: "после работы", gloss: "after work", note: "*после* takes genitive: *работы*. For a regular, repeated trip Russian uses *хожу* (not *иду*); *курсы* are classes or a course you attend.", example_gloss: "After work I go to classes."}
  ru.a2.unit33.lesson02.teach.potom: {title: "потом", gloss: "then / after that", note: "*потом* sequences the next activity.", example_gloss: "Then I have dinner at home."}
  ru.a2.unit33.lesson03.teach.dima_week: {title: "Dima asks about Nastya's week", gloss: "Dima: Nastya, what is your typical week like?", note: "Friends use informal *твоя* (the *ты* form of \"your\")."}
  ru.a2.unit33.lesson03.teach.nastya_weekdays: {title: "Nastya starts with weekdays", gloss: "Nastya: On weekdays I work at school.", note: "*в школе* means at school; Настя is a teacher."}
  ru.a2.unit33.lesson03.teach.nastya_tuesday: {title: "Nastya gives a Tuesday activity", gloss: "Nastya: On Tuesdays after work I go to classes.", note: "*по вторникам* and *хожу* show a regular weekly activity."}
  ru.a2.unit33.lesson03.teach.nastya_then: {title: "Nastya sequences the next activity", gloss: "Nastya: Then I have dinner at home.", note: "*потом* marks the sequence."}
  ru.a2.unit33.lesson03.teach.nastya_weekend: {title: "Nastya contrasts the weekend", gloss: "Nastya: On the weekend I rest and meet friends.", note: "This contrasts weekdays with the weekend."}

exercises:
  ru.a2.unit33.lesson01.exercise01.recognize_budni: {instruction: "Which phrase means \"on weekdays\"?", correct_option: "в будни", distractors: ["в выходные", "во вторник", "после работы"], accepted_answers: [{value: "в будни", status: "correct"}], feedback: "*в будни* means \"on weekdays.\""}
  ru.a2.unit33.lesson01.exercise02.recognize_vyhodnye: {instruction: "Which phrase means \"on the weekend\"?", correct_option: "в выходные", distractors: ["в будни", "после работы", "обычная неделя"], accepted_answers: [{value: "в выходные", status: "correct"}], feedback: "*в выходные* means \"on the weekend.\""}
  ru.a2.unit33.lesson01.exercise03.listen_select_weekdays_weekend: {instruction: "Listen. What weekly contrast does the speaker make?", correct_option: "She works on weekdays and rests on the weekend.", distractors: ["She studies on Monday and travels on Tuesday.", "She shops online every evening.", "She asks staff about another train."], accepted_answers: [{value: "She works on weekdays and rests on the weekend.", status: "correct"}], feedback: "The recording contrasts *в будни* with *в выходные*."}
  ru.a2.unit33.lesson01.exercise04.match_week_parts:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "неделя", right: "week"}
          - {left: "обычная неделя", right: "typical week"}
          - {left: "в будни", right: "on weekdays"}
          - {left: "в выходные", right: "on the weekend"}
          - {left: "работаю", right: "I work"}
          - {left: "отдыхаю", right: "I rest"}
        status: "correct"
    feedback: "These pieces contrast weekdays and the weekend."
  ru.a2.unit33.lesson01.exercise05.order_weekdays: {instruction: "Put the words in order to say \"On weekdays I work.\"", accepted_answers: [{value: ["В", "будни", "я", "работаю"], status: "correct"}, {value: ["Я", "работаю", "в", "будни"], status: "correct"}], feedback: "The correct order is *В будни я работаю*."}
  ru.a2.unit33.lesson01.exercise06.write_contrast:
    instruction: "Write exactly this contrast: On weekdays I work, and on the weekend I rest."
    accepted_answers:
      - {value: "В будни я работаю, а в выходные отдыхаю.", status: "correct"}
      - {value: "В будни я работаю а в выходные отдыхаю", status: "correct"}
    feedback: "The model answer is *В будни я работаю, а в выходные отдыхаю*."
  ru.a2.unit33.lesson02.exercise01.recognize_vtornik: {instruction: "Which phrase means \"on Tuesday\"?", correct_option: "во вторник", distractors: ["в будни", "потом", "в выходные"], accepted_answers: [{value: "во вторник", status: "correct"}], feedback: "*во вторник* means \"on Tuesday.\""}
  ru.a2.unit33.lesson02.exercise02.recognize_posle: {instruction: "Which phrase means \"after work\"?", correct_option: "после работы", distractors: ["во вторник", "в выходные", "дома"], accepted_answers: [{value: "после работы", status: "correct"}], feedback: "*после работы* means \"after work.\""}
  ru.a2.unit33.lesson02.exercise03.listen_select_course: {instruction: "Listen. What happens after work?", correct_option: "The speaker goes to classes.", distractors: ["The speaker reads news.", "The speaker asks for a refund.", "The speaker misses a connection."], accepted_answers: [{value: "The speaker goes to classes.", status: "correct"}], feedback: "The recording says *После работы я хожу на курсы*."}
  ru.a2.unit33.lesson02.exercise04.match_sequence:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "по вторникам", right: "on Tuesdays"}
          - {left: "после работы", right: "after work"}
          - {left: "хожу на курсы", right: "I go to classes"}
          - {left: "потом", right: "then / after that"}
          - {left: "ужинаю", right: "I have dinner"}
          - {left: "дома", right: "at home"}
        status: "correct"
    feedback: "These phrases sequence activities during the week."
  ru.a2.unit33.lesson02.exercise05.order_after_work: {instruction: "Put the words in order to say \"After work I go to classes.\"", accepted_answers: [{value: ["После", "работы", "я", "хожу", "на", "курсы"], status: "correct"}, {value: ["Я", "хожу", "на", "курсы", "после", "работы"], status: "correct"}], feedback: "The correct order is *После работы я хожу на курсы*."}
  ru.a2.unit33.lesson02.exercise06.write_sequence:
    instruction: "Write two sentences: On Tuesdays after work I go to classes. Then I have dinner at home."
    accepted_answers:
      - {value: "По вторникам после работы я хожу на курсы. Потом я ужинаю дома.", status: "correct"}
      - {value: "По вторникам после работы я хожу на курсы. Потом я ужинаю дома", status: "correct"}
      - {value: "По вторникам после работы хожу на курсы. Потом ужинаю дома.", status: "correct"}
      - {value: "По вторникам после работы я хожу на курсы. Потом ужинаю дома.", status: "correct"}
      - {value: "По вторникам после работы хожу на курсы. Потом я ужинаю дома.", status: "correct"}
    feedback: "The model answer uses *по вторникам*, *после работы*, *хожу*, and *потом*."
  ru.a2.unit33.lesson03.exercise01.choose_week_sequence: {instruction: "Which answer describes a weekly sequence?", correct_option: "В будни я работаю. По вторникам после работы я хожу на курсы. Потом я ужинаю дома.", distractors: ["Где платформа?", "Я часто пользуюсь телефоном.", "Есть другой поезд?"], accepted_answers: [{value: "В будни я работаю. По вторникам после работы я хожу на курсы. Потом я ужинаю дома.", status: "correct"}], feedback: "This answer sequences three weekly activities."}
  ru.a2.unit33.lesson03.exercise02.dialogue_comprehension_week:
    instruction: "Listen to the dialogue. Which activities happen on weekdays, on Tuesdays after work, and on the weekend?"
    correct_option: "On weekdays Nastya works at school; on Tuesdays after work she goes to classes; on the weekend she rests and meets friends"
    distractors: ["On weekdays Nastya watches videos; on Tuesdays she returns a shirt; on the weekend she opens an account", "On weekdays Nastya misses a train; on Tuesdays she asks a doctor; on the weekend she files a form", "On weekdays Nastya buys medicine; on Tuesdays she changes a platform; on the weekend she starts a job"]
    accepted_answers: [{value: "On weekdays Nastya works at school; on Tuesdays after work she goes to classes; on the weekend she rests and meets friends", status: "correct"}]
    feedback: "The dialogue gives weekday work, Tuesday classes, dinner after that, and weekend rest with friends."
