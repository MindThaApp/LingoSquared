review:
  status: "unreviewed"
  required_next_reviewer: >-
    Fresh-context review needed (DRAFT). Confirm the English glosses match
    idiomatic Russian, that the пока/когда/как только distinction reads
    correctly, and that накануне вечером reads unambiguously as
    "the evening before" (pre-past), not "yesterday evening" in general.
    Also confirm every first-person exercise instruction is unambiguously
    framed as reproducing Dima's account, not the learner's own story --
    see the realization file's review block for the full priority list.
  notes: >-
    Overlay for ru's fourth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "while" covers both ongoing background (Russian пока) and,
    loosely, contrast -- Russian пока is unambiguously the ongoing-time
    sense here, glossed precisely; (2) English marks the pre-past with a
    dedicated pluperfect ("had forgotten"), but Russian has no such tense
    -- накануне вечером + a plain perfective past does the same job, which
    can look to an English speaker like it's not marked at all; flagged
    explicitly in lesson02's grammar note; (3) когда can mean either "when"
    (a single past point, this unit's usage) or introduce a general/
    habitual time clause in other contexts -- this unit's model sentences
    only use the single-point sense. No sibling-direction file (ru-en b2)
    was consulted.

course:
  title: Russian B2
  description: >-
    Upper-intermediate Russian: recount a complex sequence of past events
    with shifting time reference -- an ongoing background (пока), a single
    interrupting event (когда), immediate sequence (как только), and an
    event that happened even earlier (накануне вечером, since Russian has
    no separate pluperfect) -- around the story of why Dima was late for
    work.

units:
  ru.b2.unit04.slozhnyj_rasskaz:
    title: "A complex story"
    description: Recount a complex sequence of events with shifting time reference -- background versus foreground, an event before other past events -- keeping the timeline unambiguous.

lessons:
  ru.b2.unit04.lesson01.fon_i_sobytie:
    title: "Background and the main event"
  ru.b2.unit04.lesson02.eshcho_ranshe:
    title: "Even earlier: before this morning"
  ru.b2.unit04.lesson03.poka_kogda_kak_tolko:
    title: "While, when, as soon as"
  ru.b2.unit04.lesson04.vsya_istoriya_po_poryadku:
    title: "The whole story in order"
  ru.b2.unit04.lesson05.chtenie_rasskaza:
    title: "Reading Dima's message"
  ru.b2.unit04.lesson06.rasskazat_istoriyu:
    title: "Telling the story"

teaching:
  ru.b2.unit04.lesson01.teach.utrom:
    title: "in the morning"
    gloss: "in the morning"
    example_gloss: "In the morning I usually drink coffee."
  ru.b2.unit04.lesson01.teach.avtobus:
    title: bus
    gloss: bus
    example_gloss: "The bus comes every ten minutes."
  ru.b2.unit04.lesson01.teach.zhdal_avtobus:
    title: "was waiting for the bus"
    gloss: "was waiting for the bus"
    note: "*Ждал* is imperfective past (masculine) -- an ongoing action, not a single completed event."
  ru.b2.unit04.lesson01.teach.shel_dozhd:
    title: "it was raining"
    gloss: "it was raining"
    note: "*Шёл дождь* -- literally 'rain was going/falling' -- is the standard way to say it was raining; imperfective, describing an ongoing state."
  ru.b2.unit04.lesson01.teach.poka:
    title: while
    gloss: "while (an ongoing background)"
    note: "*Пока* introduces the ongoing scene something else happens against -- paired with an imperfective verb, as in this lesson's model."
    example_gloss: "While I was making breakfast, it was raining."
  ru.b2.unit04.lesson01.teach.claim_model:
    title: "I was waiting for the bus. It was raining."
    gloss: "I was waiting for the bus. It was raining."
    note: "This is Dima's account of his morning -- the background scene, before anything happens."
  ru.b2.unit04.lesson01.teach.nakonets_prishel:
    title: "finally came"
    gloss: "finally came / arrived"
    note: "*Пришёл* is perfective past (masculine) -- a single completed event, unlike the imperfective *ждал* above."
  ru.b2.unit04.lesson01.teach.perepolnen:
    title: "packed / overcrowded"
    gloss: "packed / overcrowded"
    example_gloss: "The morning bus is often overcrowded."
  ru.b2.unit04.lesson01.teach.kogda_naprimer:
    title: "When the bus finally came, it was overcrowded."
    gloss: "When the bus finally came, it was overcrowded."
    note: "*Когда* introduces the single event that interrupts the background scene -- contrast with *пока* above."
  ru.b2.unit04.lesson01.teach.grammar_fon_sobytie:
    title: "Пока is the background, ongoing: while I was waiting. Когда is a single event, interrupting the background: when the bus came."
    gloss: "Пока is the background, ongoing: while I was waiting. Когда is a single event, interrupting the background: when the bus came."
    note: "This aspect contrast (imperfective for background, perfective for the interrupting event) is the core grammar of this lesson."

  ru.b2.unit04.lesson02.teach.nakanune_vecherom:
    title: "the evening before"
    gloss: "the evening before"
    note: "*Накануне вечером* marks an event as happening even before the morning being narrated -- Russian's way of marking pre-past time, since it has no separate pluperfect tense."
  ru.b2.unit04.lesson02.teach.zabyl:
    title: forgot
    gloss: "forgot (masculine past, perfective)"
    example_gloss: "He forgot his keys at home."
  ru.b2.unit04.lesson02.teach.zaryadit_telefon:
    title: "to charge the phone"
    gloss: "to charge the phone"
  ru.b2.unit04.lesson02.teach.claim_model:
    title: "The evening before, I forgot to charge my phone."
    gloss: "The evening before, I forgot to charge my phone."
    note: "This is Dima's account -- the event that happened even before the background scene of lesson01."
  ru.b2.unit04.lesson02.teach.poetomu:
    title: "therefore / so"
    gloss: "therefore / so"
    example_gloss: "I was tired, so I went to bed early."
  ru.b2.unit04.lesson02.teach.razryazhen:
    title: "dead / discharged"
    gloss: "dead / discharged (of a battery, masculine short form)"
    example_gloss: "My phone is dead right now."
  ru.b2.unit04.lesson02.teach.ne_uvidel_soobshchenie:
    title: "didn't see the message"
    gloss: "didn't see the message"
  ru.b2.unit04.lesson02.teach.ob_otmene:
    title: "about the bus cancellation"
    gloss: "about the bus cancellation"
  ru.b2.unit04.lesson02.teach.claim_model_2:
    title: "So the phone was dead, and I didn't see the message about the bus cancellation."
    gloss: "So the phone was dead, and I didn't see the message about the bus cancellation."
  ru.b2.unit04.lesson02.teach.grammar_predproshloe:
    title: "Russian has no separate pluperfect tense. The evening before with the past tense shows the event happened earlier than the background."
    gloss: "Russian has no separate pluperfect tense. The evening before with the past tense shows the event happened earlier than the background."
    note: "Where English marks pre-past with a dedicated tense ('had forgotten'), Russian just uses a plain past verb together with a time adverbial like *накануне вечером* that makes the relative timing explicit."

  ru.b2.unit04.lesson03.teach.kak_tolko:
    title: "as soon as"
    gloss: "as soon as"
    note: "*Как только* marks one event following another immediately, with no gap -- distinct from both *пока* (ongoing) and *когда* (a single point, not necessarily immediate)."
  ru.b2.unit04.lesson03.teach.voshel_vnutr:
    title: "got on / went inside"
    gloss: "got on / went inside"
  ru.b2.unit04.lesson03.teach.claim_model:
    title: "As soon as the bus came, I got on."
    gloss: "As soon as the bus came, I got on."
  ru.b2.unit04.lesson03.teach.uspel:
    title: "made it in time"
    gloss: "made it in time (masculine past, perfective)"
    example_gloss: "I barely made it to the meeting in time."
  ru.b2.unit04.lesson03.teach.uzhe:
    title: already
    gloss: already
    example_gloss: "The bus has already left."
  ru.b2.unit04.lesson03.teach.claim_model_2:
    title: "But today I didn't make it in time -- the bus was already overcrowded."
    gloss: "But today I didn't make it in time -- the bus was already overcrowded."
  ru.b2.unit04.lesson03.teach.grammar_tri_svyazki:
    title: "Пока is the background, ongoing. Когда is one interrupting event. Как только is immediately after, with no pause."
    gloss: "Пока is the background, ongoing. Когда is one interrupting event. Как только is immediately after, with no pause."
    note: "All three connectives from lesson01-03 side by side: choose based on whether you're describing an ongoing scene, a single interrupting event, or immediate succession."

  ru.b2.unit04.lesson04.teach.snachala:
    title: first
    gloss: "first / at first"
    example_gloss: "First I drank coffee."
  ru.b2.unit04.lesson04.teach.potom:
    title: then
    gloss: "then / after that"
    example_gloss: "Then I left the house."
  ru.b2.unit04.lesson04.teach.v_itoge:
    title: "in the end"
    gloss: "in the end / eventually"
  ru.b2.unit04.lesson04.teach.opozdal_na_rabotu:
    title: "was late for work"
    gloss: "was late for work (masculine past, perfective)"
  ru.b2.unit04.lesson04.teach.claim_model:
    title: "In the end I was late for work."
    gloss: "In the end I was late for work."
    note: "The punchline of Dima's story -- the final outcome of the whole chain of events."
  ru.b2.unit04.lesson04.teach.grammar_polnyj_rasskaz:
    title: "First, the evening before, I forgot to charge my phone. Then I waited for the bus in the rain, and when it came, it was overcrowded. In the end I was late."
    gloss: "First, the evening before, I forgot to charge my phone. Then, in the morning, I was waiting for the bus -- it was raining. When the bus finally came, it was overcrowded. In the end I was late for work."
    note: "The full chain in order: pre-past event (сначала, накануне вечером) -> background (потом, пока) -> interrupting event (когда) -> outcome (в итоге). This is exactly what you produce in this lesson's writing task."

  ru.b2.unit04.lesson05.teach.tekst:
    title: "Reading: Dima's message to Nastya"
    gloss: "Nastya, sorry I'm late! The evening before, I forgot to charge my phone, so in the morning it was dead. While I was waiting for the bus, it was raining. When the bus finally came, it turned out to be overcrowded, and I didn't make it in time to get on. I had to wait for the next one. In the end I was almost an hour late for work."
    glosses:
      извини: "sorry / excuse me"
      опоздание: "being late"
      оказался: "turned out to be"
      сесть: "to get on / to sit down"
      Пришлось: "I had to"
      ждать: "to wait"
      следующий: "the next one"
      почти: almost
      час: "an hour"

  ru.b2.unit04.lesson06.teach.chto_sluchilos_pochemu_opozdal:
    title: "What happened? Why were you late?"
    gloss: "What happened? Why were you late?"
  ru.b2.unit04.lesson06.teach.dolgaya_istoriya:
    title: "A long story."
    gloss: "It's a long story."
    note: "*Долгая история* is the everyday way to signal you're about to give a fuller explanation than a one-line answer."
  ru.b2.unit04.lesson06.teach.oh_ponyatno:
    title: "Oh, I see."
    gloss: "Oh, I see."
  ru.b2.unit04.lesson06.teach.dialogue_nastya_ask:
    title: "Nastya: Dima, what happened? Why were you late?"
    gloss: "Nastya: Dima, what happened? Why were you late?"
  ru.b2.unit04.lesson06.teach.dialogue_dima_explain:
    title: "Dima: It's a long story. The evening before, I forgot to charge my phone."
    gloss: "Dima: It's a long story. The evening before, I forgot to charge my phone."
  ru.b2.unit04.lesson06.teach.dialogue_nastya_react:
    title: "Nastya: Oh, I see."
    gloss: "Nastya: Oh, I see."
  ru.b2.unit04.lesson06.teach.dialogue_dima_continue:
    title: "Dima: While I was waiting for the bus, it was raining. When it finally came, it was already overcrowded."
    gloss: "Dima: While I was waiting for the bus, it was raining. When it finally came, it was already overcrowded."
  ru.b2.unit04.lesson06.teach.dialogue_dima_conclude:
    title: "Dima: In the end I was late for work."
    gloss: "Dima: In the end I was late for work."
  ru.b2.unit04.lesson06.teach.grammar_tri_sloya:
    title: "Pre-past: forgot to charge the phone. Background: waiting for the bus in the rain. Interrupting event: the bus finally came. Outcome: late for work."
    gloss: "Before the background: the evening before, I forgot to charge my phone. Background: while I was waiting for the bus, it was raining. Interrupting event: when it finally came. Outcome: I was late for work."
    note: "The three time layers of this unit, mapped onto Dima's full story: pre-past, background, interrupting event, and outcome."

