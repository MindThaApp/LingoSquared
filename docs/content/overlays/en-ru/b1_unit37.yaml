  notes: "New Codex-authored B1 draft. Needs fresh-context review. Fresh-context review 2026-10-11 (content-reviewer.md checklist): Checked word-order tile variants, accepted-answer coverage, example_gloss vs example, learner-visible notes for course-internal wording, gendered first-person answers, and prior teaching of production vocabulary. Fixes: ru.b1.audio.dialogue.gipotezy_o_forme.01 and ru.b1.unit37.lesson03.teach.dima_unreal 'я попросил бы Настю проверить адрес' -> 'я попросил бы тебя проверить адрес' (Dima is speaking to Nastya; тебя added to dima_unreal introduced_tokens since it is new in this course; ex02 tested_text and dima_unreal gloss updated to match, 'ask you'); example_gloss of lesson01.teach.esli_budet, lesson02.teach.esli_by_bylo and lesson02.teach.vremeni_ne_bylo now translate the leading 'Dima,'; lesson02.exercise05.order_unreal_condition accepts 'я бы проверил адрес'; lesson03.exercise04.order_ask_nastya accepts 'я бы попросил Настю'. lesson03.exercise06 kept 'Настю' because the prompt pins that result and does not frame it as addressed to Nastya. NATIVE FLAGS: lesson01 ex05 alternative orders ('Я проверю адрес, если будет время') are not accepted; 'Если бы у меня было время' is more idiomatic than 'Если бы было время'. DEFERRED: none."

course:
  title: "Russian B1"
  description: "Learn B1-level Russian for real and unreal conditional statements."

units:
  ru.b1.unit37.gipotezy: {title: "Hypotheses"}

lessons:
  ru.b1.unit37.lesson01.esli_budet: {title: "If there is time"}
  ru.b1.unit37.lesson02.esli_by: {title: "If there were time"}
  ru.b1.unit37.lesson03.dialogue_conditions: {title: "Dialogue: real and unreal if"}

teaching:
  ru.b1.unit37.lesson01.teach.esli_budet: {title: "Если будет время, я проверю адрес.", gloss: "If there is time, I will check the address.", note: "*Если будет...* presents a real possible future condition.", example_gloss: "Dima, if there is time, I will check the address."}
  ru.b1.unit37.lesson01.teach.otpravlyu_formu: {title: "Я отправлю форму.", gloss: "I will send the form.", note: "*отправлю* is a future result action.", example_gloss: "If there is time, I will send the form."}
  ru.b1.unit37.lesson01.teach.chto_sdelayesh: {title: "Что ты сделаешь, если будет время?", gloss: "What will you do if there is time?", note: "This asks about a real future condition.", example_gloss: "Dima, what will you do if there is time?"}
  ru.b1.unit37.lesson02.teach.esli_by_bylo: {title: "Если бы было время, я проверил бы адрес.", gloss: "If there were time, I would check the address.", note: "*Если бы... проверил бы...* marks an unreal condition and result for a male speaker.", example_gloss: "Dima, if there were time, I would check the address."}
  ru.b1.unit37.lesson02.teach.vremeni_ne_bylo: {title: "Если бы времени не было, я попросил бы Настю.", gloss: "If there were no time, I would ask Nastya.", note: "The result clause also keeps *бы*.", example_gloss: "Dima, if there were no time, I would ask Nastya."}
  ru.b1.unit37.lesson02.teach.proverit_adres: {title: "проверить адрес", gloss: "to check the address", note: "Use this infinitive after *попросил бы Настю*.", example_gloss: "I would ask Nastya to check the address."}
  ru.b1.unit37.lesson03.teach.nastya_real_question: {title: "Nastya asks about a real condition", gloss: "Nastya: Dima, what will you do if there is time?", note: "This uses the real future frame *если будет*."}
  ru.b1.unit37.lesson03.teach.dima_real: {title: "Dima gives the real result", gloss: "Dima: If there is time, I will check the address and send the form.", note: "The result has future verbs."}
  ru.b1.unit37.lesson03.teach.nastya_unreal_question: {title: "Nastya asks about an unreal condition", gloss: "Nastya: And if there were no time?", note: "*если бы* changes the frame to unreal."}
  ru.b1.unit37.lesson03.teach.dima_unreal: {title: "Dima gives the unreal result", gloss: "Dima: If there were no time, I would ask you to check the address.", note: "The result uses *попросил бы*."}

exercises:
  ru.b1.unit37.lesson01.exercise01.recognize_esli_budet: {instruction: "Which Russian phrase means \"if there is time\"?", correct_option: "если будет время", distractors: ["если бы было время", "времени не было", "я проверил бы"], accepted_answers: [{value: "если будет время", status: "correct"}], feedback: "*если будет время* means \"if there is time.\""}
  ru.b1.unit37.lesson01.exercise02.recognize_proveryu: {instruction: "Which Russian phrase means \"I will check\"?", correct_option: "я проверю", distractors: ["я проверил бы", "я попросил бы", "я должен"], accepted_answers: [{value: "я проверю", status: "correct"}], feedback: "*я проверю* means \"I will check.\""}
  ru.b1.unit37.lesson01.exercise03.listen_select_real_condition: {instruction: "Listen. What will the speaker do if there is time?", correct_option: "Check the address.", distractors: ["Ask Nastya.", "Be late to the office.", "Explain where the office is."], accepted_answers: [{value: "Check the address.", status: "correct"}], feedback: "The recording says *Если будет время, я проверю адрес*."}
  ru.b1.unit37.lesson01.exercise04.match_real_condition:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Если будет время", right: "If there is time"}
          - {left: "я проверю адрес", right: "I will check the address"}
          - {left: "я отправлю форму", right: "I will send the form"}
          - {left: "Что ты сделаешь?", right: "What will you do?"}
          - {left: "адрес", right: "address"}
          - {left: "форма", right: "form"}
        status: "correct"
    feedback: "These phrases build a real future condition and result."
  ru.b1.unit37.lesson01.exercise05.order_real_condition: {instruction: "Put the words in order to say \"If there is time, I will check the address.\"", accepted_answers: [{value: ["Если", "будет", "время", "я", "проверю", "адрес"], status: "correct"}], feedback: "The correct order is *Если будет время, я проверю адрес*."}
  ru.b1.unit37.lesson01.exercise06.write_real_condition:
    instruction: "Write exactly this real future condition and result: If there is time, I will check the address."
    accepted_answers:
      - {value: "Если будет время, я проверю адрес.", status: "correct"}
      - {value: "Если будет время я проверю адрес.", status: "correct"}
      - {value: "Если будет время, я проверю адрес", status: "correct"}
      - {value: "Если будет время я проверю адрес", status: "correct"}
    feedback: "The model answer is *Если будет время, я проверю адрес*."
  ru.b1.unit37.lesson02.exercise01.recognize_esli_by: {instruction: "Which Russian phrase means \"if there were time\"?", correct_option: "если бы было время", distractors: ["если будет время", "если будет адрес", "я проверю"], accepted_answers: [{value: "если бы было время", status: "correct"}], feedback: "*если бы было время* means \"if there were time.\""}
  ru.b1.unit37.lesson02.exercise02.recognize_proveril_by: {instruction: "Which Russian phrase means \"I would check\" for a male speaker?", correct_option: "я проверил бы", distractors: ["я проверю", "я отправлю", "я должен"], accepted_answers: [{value: "я проверил бы", status: "correct"}], feedback: "*я проверил бы* means \"I would check\" for a male speaker."}
  ru.b1.unit37.lesson02.exercise03.listen_select_unreal_condition: {instruction: "Listen. What would the speaker check if there were time?", correct_option: "The address.", distractors: ["The form.", "The train.", "The receipt."], accepted_answers: [{value: "The address.", status: "correct"}], feedback: "The recording says *Если бы было время, я проверил бы адрес*."}
  ru.b1.unit37.lesson02.exercise04.match_unreal_condition:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Если бы было время", right: "If there were time"}
          - {left: "я проверил бы адрес", right: "I would check the address"}
          - {left: "Если бы времени не было", right: "If there were no time"}
          - {left: "я попросил бы Настю", right: "I would ask Nastya"}
          - {left: "проверить адрес", right: "to check the address"}
          - {left: "бы", right: "would marker"}
        status: "correct"
    feedback: "These phrases build unreal condition-result pairs."
  ru.b1.unit37.lesson02.exercise05.order_unreal_condition: {instruction: "Put the words in order to say \"If there were time, I would check the address.\" Use both instances of бы.", accepted_answers: [{value: ["Если", "бы", "было", "время", "я", "проверил", "бы", "адрес"], status: "correct"}, {value: ["Если", "бы", "было", "время", "я", "бы", "проверил", "адрес"], status: "correct"}], feedback: "The correct order is *Если бы было время, я проверил бы адрес*."}
  ru.b1.unit37.lesson02.exercise06.write_unreal_condition:
    instruction: "Write exactly this unreal condition and result with если бы and проверил бы: If there were time, I would check the address."
    accepted_answers:
      - {value: "Если бы было время, я проверил бы адрес.", status: "correct"}
      - {value: "Если бы было время я проверил бы адрес.", status: "correct"}
      - {value: "Если бы было время, я проверил бы адрес", status: "correct"}
      - {value: "Если бы было время я проверил бы адрес", status: "correct"}
    feedback: "The model answer is *Если бы было время, я проверил бы адрес*."
  ru.b1.unit37.lesson03.exercise01.choose_real_unreal: {instruction: "Which answer contrasts a real future condition with an unreal condition?", correct_option: "Если будет время, я проверю адрес. Если бы было время, я проверил бы адрес.", distractors: ["Если будет время, я проверю адрес.", "Если бы было время, я проверил бы адрес.", "Сегодня я должен отправить форму. В офисе нельзя опаздывать."], accepted_answers: [{value: "Если будет время, я проверю адрес. Если бы было время, я проверил бы адрес.", status: "correct"}], feedback: "The correct answer contrasts *если будет* with *если бы*."}
  ru.b1.unit37.lesson03.exercise02.dialogue_comprehension_conditions:
    instruction: "Listen to the dialogue. What real condition and unreal condition does Dima give?"
    correct_option: "If there is time, he will check the address and send the form; if there were no time, he would ask Nastya to check the address"
    distractors: ["If there is time, he will be late; if there were no time, he would send the form", "He must send the form; he should have checked the address yesterday", "He can say the document is ready; he could explain where the office is"]
    accepted_answers: [{value: "If there is time, he will check the address and send the form; if there were no time, he would ask Nastya to check the address", status: "correct"}]
    feedback: "Dima gives one real future condition and one unreal condition."
  ru.b1.unit37.lesson03.exercise03.match_dialogue_conditions:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Что ты сделаешь?", right: "What will you do?"}
          - {left: "если будет время", right: "if there is time"}
          - {left: "я проверю адрес", right: "I will check the address"}
          - {left: "я отправлю форму", right: "I will send the form"}
          - {left: "если бы времени не было", right: "if there were no time"}
          - {left: "я попросил бы Настю", right: "I would ask Nastya"}
        status: "correct"
    feedback: "These phrases contrast real and unreal conditions."
  ru.b1.unit37.lesson03.exercise04.order_ask_nastya: {instruction: "Put the words in order to say \"I would ask Nastya to check the address.\"", accepted_answers: [{value: ["я", "попросил", "бы", "Настю", "проверить", "адрес"], status: "correct"}, {value: ["я", "бы", "попросил", "Настю", "проверить", "адрес"], status: "correct"}], feedback: "The correct order is *я попросил бы Настю проверить адрес*."}
  ru.b1.unit37.lesson03.exercise05.reply_real_condition:
    instruction: "Nastya asks \"Дима, что ты сделаешь, если будет время?\" Answer with the exact sentence: \"Если будет время, я проверю адрес и отправлю форму.\""
    accepted_answers:
      - {value: "Если будет время, я проверю адрес и отправлю форму.", status: "correct"}
      - {value: "Если будет время я проверю адрес и отправлю форму.", status: "correct"}
      - {value: "Если будет время, я проверю адрес и отправлю форму", status: "correct"}
      - {value: "Если будет время я проверю адрес и отправлю форму", status: "correct"}
    feedback: "The model answer is *Если будет время, я проверю адрес и отправлю форму*."
  ru.b1.unit37.lesson03.exercise06.write_real_unreal_contrast:
    instruction: "As Дима, write two sentences. First write a real future condition with если будет время and the result я проверю адрес и отправлю форму. Then write an unreal condition with если бы времени не было and the result я попросил бы Настю проверить адрес."
    accepted_answers:
      - {value: "Если будет время, я проверю адрес и отправлю форму. Если бы времени не было, я попросил бы Настю проверить адрес.", status: "correct"}
      - {value: "Если будет время я проверю адрес и отправлю форму. Если бы времени не было я попросил бы Настю проверить адрес.", status: "correct"}
    feedback: "A complete answer contrasts a real future condition and result with an unreal condition and result."
  ru.b1.unit37.lesson01.esli_budet.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Если будет время, я проверю адрес."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
