schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.a1.unit11"
source_language: "en"
target_language: "ru"
status: "reviewed"
generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false}
review: {status: "reviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Fresh-context review 2026-07-12: matching_pairs mirror realization, listen/dialogue distractors unspoken, reflexive-verb/time-range glosses accurate, fill_in placement matches; compiler 0 errors."}

course:
  title: "Russian A1"
  description: "Learn A1-level Russian for describing a simple daily routine using common reflexive verbs and time expressions, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit11.routines: {title: "My daily routine"}

lessons:
  ru.a1.unit11.lesson01.vstavat_zavtrakat: {title: "Getting up, having breakfast"}
  ru.a1.unit11.lesson02.rabotat_uzhinat: {title: "Working, having dinner"}
  ru.a1.unit11.lesson03.moy_den: {title: "Dialogue: my day"}

teaching:
  ru.a1.unit11.lesson01.teach.vstayu: {title: "встаю", gloss: "I get up", note: "встаю is the first-person singular of вставать (\"to get up\"); встаёте is the вы form used to ask someone else.", example_gloss: "I get up at seven o'clock."}
  ru.a1.unit11.lesson01.teach.zavtrakayu: {title: "завтракаю", gloss: "I have breakfast", note: "завтракаю is the first-person singular of завтракать (\"to have breakfast\").", example_gloss: "I have breakfast at eight o'clock."}
  ru.a1.unit11.lesson01.teach.kogda: {title: "Когда вы встаёте?", gloss: "When do you get up?", note: "Когда means \"when\"; вы is the polite/plural \"you.\""}

  ru.a1.unit11.lesson02.teach.rabotayu: {title: "работаю", gloss: "I work", note: "работаю is the first-person singular of работать (\"to work\"); с ... до ... means \"from ... to ...\" for a time range.", example_gloss: "I work from nine to five."}
  ru.a1.unit11.lesson02.teach.uzhinayu: {title: "ужинаю", gloss: "I have dinner", note: "ужинаю is the first-person singular of ужинать (\"to have dinner\"); вечером means \"in the evening.\"", example_gloss: "In the evening I have dinner."}
  ru.a1.unit11.lesson02.teach.lozhus_spat: {title: "ложусь спать", gloss: "I go to bed", note: "ложусь спать is a reflexive phrase (\"lie down to sleep\") meaning \"go to bed.\"", example_gloss: "I go to bed at eleven o'clock."}

  ru.a1.unit11.lesson03.teach.oleg_chto_delayete: {title: "Oleg asks about the morning", gloss: "Oleg: What do you do in the morning?", note: "Олег opens with Что вы делаете утром?"}
  ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu: {title: "Maria describes her morning", gloss: "Maria: I get up at seven o'clock, then I have breakfast at eight.", note: "Мария lists two actions in sequence, joined by потом (\"then\")."}
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete: {title: "Oleg asks about work hours", gloss: "Oleg: And when do you work?", note: "А smoothly introduces Oleg's follow-up question."}
  ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu: {title: "Maria describes the rest of her day", gloss: "Maria: I work from nine to five. In the evening I have dinner and go to bed at eleven o'clock.", note: "Мария answers with her work hours, then her evening routine."}
  ru.a1.unit11.lesson03.teach.oleg_ponyatno: {title: "Oleg acknowledges", gloss: "Oleg: I understand, thank you.", note: "Понятно, спасибо closes the exchange."}

exercises:
  ru.a1.unit11.lesson01.exercise01.recognize_vstayu:
    instruction: "Which word means \"I get up\"?"
    correct_option: "встаю"
    distractors: ["завтракаю", "когда", "часов"]
    accepted_answers: [{value: "встаю", status: "correct"}]
    feedback: "встаю means \"I get up.\""
  ru.a1.unit11.lesson01.exercise02.recognize_zavtrakayu:
    instruction: "Which word means \"I have breakfast\"?"
    correct_option: "завтракаю"
    distractors: ["встаю", "когда", "часов"]
    accepted_answers: [{value: "завтракаю", status: "correct"}]
    feedback: "завтракаю means \"I have breakfast.\""
  ru.a1.unit11.lesson01.exercise03.listen_select_kogda_vstayete:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "When do you get up?"
    distractors: ["I have breakfast at eight.", "I go to bed at eleven.", "What do you do in the morning?"]
    accepted_answers: [{value: "When do you get up?", status: "correct"}]
    feedback: "The recording says Когда вы встаёте? (\"When do you get up?\")."
  ru.a1.unit11.lesson01.exercise04.match_morning_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "встаю", right: "I get up"}
          - {left: "завтракаю", right: "I have breakfast"}
          - {left: "когда", right: "when"}
          - {left: "часов", right: "o'clock"}
          - {left: "Я встаю в семь часов.", right: "I get up at seven o'clock."}
          - {left: "Когда вы встаёте?", right: "When do you get up?"}
        status: "correct"
    feedback: "встаю=I get up, завтракаю=I have breakfast, когда=when, часов=o'clock."
  ru.a1.unit11.lesson01.exercise05.order_ya_vstayu_v_sem:
    instruction: "Put the words in the correct order to say \"I get up at seven o'clock.\""
    accepted_answers:
      - {value: ["Я", "встаю", "в", "семь", "часов"], status: "correct"}
    feedback: "The correct order is Я встаю в семь часов."
  ru.a1.unit11.lesson01.exercise06.listen_order_ya_vstayu:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Я", "встаю", "в", "семь", "часов"], status: "correct"}
    feedback: "The correct order is Я встаю в семь часов (\"I get up at seven o'clock\")."
  ru.a1.unit11.lesson01.exercise07.complete_ya_zavtrakayu:
    instruction: "Complete the sentence: Я ___ в восемь часов. (have breakfast)"
    accepted_answers:
      - {value: "завтракаю", status: "correct"}
      - {value: "Я завтракаю в восемь часов", status: "correct"}
    feedback: "завтракаю means \"I have breakfast.\""
  ru.a1.unit11.lesson01.exercise08.write_morning_routine:
    instruction: "Write a sentence about when you get up and have breakfast."
    accepted_answers:
      - {value: "Я встаю в семь часов и завтракаю в восемь.", status: "correct"}
      - {value: "Я встаю в семь часов и завтракаю в восемь", status: "correct"}
    feedback: "A natural sentence uses Я встаю в ... часов и завтракаю в ... часов."

  ru.a1.unit11.lesson02.exercise01.recognize_rabotayu:
    instruction: "Which word means \"I work\"?"
    correct_option: "работаю"
    distractors: ["ужинаю", "ложусь спать", "вечером"]
    accepted_answers: [{value: "работаю", status: "correct"}]
    feedback: "работаю means \"I work.\""
  ru.a1.unit11.lesson02.exercise02.recognize_uzhinayu:
    instruction: "Which word means \"I have dinner\"?"
    correct_option: "ужинаю"
    distractors: ["работаю", "ложусь спать", "вечером"]
    accepted_answers: [{value: "ужинаю", status: "correct"}]
    feedback: "ужинаю means \"I have dinner.\""
  ru.a1.unit11.lesson02.exercise03.listen_select_ya_lozhus_spat:
    instruction: "Listen to the recording. What is being described?"
    correct_option: "I go to bed at eleven o'clock."
    distractors: ["I work from nine to five.", "I have dinner in the evening.", "I get up at seven o'clock."]
    accepted_answers: [{value: "I go to bed at eleven o'clock.", status: "correct"}]
    feedback: "The recording says Я ложусь спать в одиннадцать часов. (\"I go to bed at eleven o'clock.\")"
  ru.a1.unit11.lesson02.exercise04.match_evening_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "работаю", right: "I work"}
          - {left: "ужинаю", right: "I have dinner"}
          - {left: "ложусь спать", right: "I go to bed"}
          - {left: "вечером", right: "in the evening"}
          - {left: "Я работаю с девяти до пяти.", right: "I work from nine to five."}
          - {left: "Я ложусь спать в одиннадцать часов.", right: "I go to bed at eleven o'clock."}
        status: "correct"
    feedback: "работаю=I work, ужинаю=I have dinner, ложусь спать=I go to bed, вечером=in the evening."
  ru.a1.unit11.lesson02.exercise05.order_ya_rabotayu_s_devyati:
    instruction: "Put the words in the correct order to say \"I work from nine to five.\""
    accepted_answers:
      - {value: ["Я", "работаю", "с", "девяти", "до", "пяти"], status: "correct"}
    feedback: "The correct order is Я работаю с девяти до пяти."
  ru.a1.unit11.lesson02.exercise06.listen_order_lozhus_spat:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Я", "ложусь", "спать", "в", "одиннадцать", "часов"], status: "correct"}
    feedback: "The correct order is Я ложусь спать в одиннадцать часов (\"I go to bed at eleven o'clock\")."
  ru.a1.unit11.lesson02.exercise07.complete_vecherom_ya_uzhinayu:
    instruction: "Complete the sentence: ___ я ужинаю. (in the evening)"
    accepted_answers:
      - {value: "Вечером", status: "correct"}
      - {value: "Вечером я ужинаю", status: "correct"}
    feedback: "Вечером means \"in the evening.\""
  ru.a1.unit11.lesson02.exercise08.write_evening_routine:
    instruction: "Write a sentence about what you do in the evening and when you go to bed."
    accepted_answers:
      - {value: "Вечером я ужинаю и ложусь спать в одиннадцать часов.", status: "correct"}
      - {value: "Вечером я ужинаю и ложусь спать в одиннадцать часов", status: "correct"}
    feedback: "A natural sentence uses Вечером я ужинаю и ложусь спать в ... часов."

  ru.a1.unit11.lesson03.exercise01.choose_ask_morning_routine:
    instruction: "You want to ask someone what they do in the morning. What do you say?"
    correct_option: "Что вы делаете утром?"
    distractors: ["Когда вы встаёте?", "Понятно, спасибо.", "Я работаю с девяти до пяти."]
    accepted_answers: [{value: "Что вы делаете утром?", status: "correct"}]
    feedback: "Что вы делаете утром? means \"What do you do in the morning?\""
  ru.a1.unit11.lesson03.exercise02.listen_select_zavtrakayu_v_vosem:
    instruction: "Listen to the recording. What is being described?"
    correct_option: "I have breakfast at eight o'clock."
    distractors: ["I get up at seven o'clock.", "I go to bed at eleven o'clock.", "I work from nine to five."]
    accepted_answers: [{value: "I have breakfast at eight o'clock.", status: "correct"}]
    feedback: "The recording says Я завтракаю в восемь часов. (\"I have breakfast at eight o'clock.\")"
  ru.a1.unit11.lesson03.exercise03.dialogue_comprehension_moy_den:
    instruction: "Listen to the dialogue. At what times does Maria get up, have breakfast, work, and go to bed?"
    correct_option: "Up at seven, breakfast at eight, work nine to five, bed at eleven"
    distractors: ["Up at seven, breakfast at eight, work nine to six, bed at eleven", "Up at eight, breakfast at nine, work nine to five, bed at eleven", "Up at seven, breakfast at eight, work nine to five, bed at ten"]
    accepted_answers: [{value: "Up at seven, breakfast at eight, work nine to five, bed at eleven", status: "correct"}]
    feedback: "Мария says встаю в семь, завтракаю в восемь, работаю с девяти до пяти, and ложусь спать в одиннадцать."
  ru.a1.unit11.lesson03.exercise04.match_daily_routine_phrases:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Что вы делаете утром?", right: "What do you do in the morning?"}
          - {left: "Я встаю в семь часов.", right: "I get up at seven o'clock."}
          - {left: "Я работаю с девяти до пяти.", right: "I work from nine to five."}
          - {left: "Вечером я ужинаю.", right: "In the evening I have dinner."}
          - {left: "Я ложусь спать в одиннадцать часов.", right: "I go to bed at eleven o'clock."}
          - {left: "Понятно, спасибо.", right: "I understand, thank you."}
        status: "correct"
    feedback: "Each phrase describes a step in a typical daily routine."
  ru.a1.unit11.lesson03.exercise05.order_ya_uzhinayu_i_lozhus:
    instruction: "Put the words in the correct order to say \"I have dinner and go to bed.\""
    accepted_answers:
      - {value: ["Я", "ужинаю", "и", "ложусь", "спать"], status: "correct"}
    feedback: "The correct order is Я ужинаю и ложусь спать."
  ru.a1.unit11.lesson03.exercise06.reply_chto_vy_delayete_utrom:
    instruction: "Someone asks \"Что вы делаете утром?\" Reply that you get up at seven and have breakfast at eight."
    accepted_answers:
      - {value: "Я встаю в семь часов и завтракаю в восемь.", status: "correct"}
      - {value: "Я встаю в семь часов и завтракаю в восемь", status: "correct"}
    feedback: "Я встаю в семь часов и завтракаю в восемь means \"I get up at seven o'clock and have breakfast at eight.\""
  ru.a1.unit11.lesson03.exercise07.complete_kogda_vy_rabotayete:
    instruction: "Complete the question: ___ вы работаете? (when)"
    accepted_answers:
      - {value: "Когда", status: "correct"}
      - {value: "Когда вы работаете", status: "correct"}
    feedback: "Когда means \"when.\""
  ru.a1.unit11.lesson03.exercise08.write_full_daily_routine:
    instruction: "Write several connected sentences describing your daily routine: when you get up, work, and go to bed."
    accepted_answers:
      - {value: "Я встаю в семь часов. Я работаю с девяти до пяти. Я ложусь спать в одиннадцать часов.", status: "correct"}
      - {value: "Я встаю в семь часов, работаю с девяти до пяти и ложусь спать в одиннадцать часов.", status: "correct"}
    feedback: "A natural description chains встаю, работаю, and ложусь спать with time expressions."
