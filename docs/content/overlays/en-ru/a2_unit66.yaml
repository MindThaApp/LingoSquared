teaching:
  ru.a2.unit66.lesson01.teach.otpusk_letniy_otpusk:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*Отпуск* is the general word for time off work; *летний отпуск* is the long summer break. Students have *каникулы* instead.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  ru.a2.unit66.lesson01.teach.na_sleduyushchey_nedele:
    title: When something happens
    gloss: next week / next year / soon
    note: 'After *на* the word for ''week'' takes the prepositional case: *на следующей неделе*. With ''year'' the preposition is *в*: *в следующем году*. *Скоро* never changes.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Belgium.
    - Soon I have a holiday.
  ru.a2.unit66.lesson01.teach.puteshestvovat_bronirovat_ostavatsya:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: These are infinitives. *Бронировать* is imperfective (the process of booking); the perfective *забронировать* appears in *Я забронирую отель* and means a finished booking.
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  ru.a2.unit66.lesson01.teach.otel_kemping:
    title: Where to stay
    gloss: the hotel / the campsite
    note: 'Both *отель* and *кемпинг* are masculine. After *в* they take the prepositional case: *в отеле*, *в кемпинге*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  ru.a2.unit66.lesson01.teach.chto_ty_budesh:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: '*Что ты будешь делать?* uses *будешь* (''you will be'') with an infinitive. This is the future tense of an imperfective verb.'
  ru.a2.unit66.lesson01.teach.v_avguste_ya:
    title: 'Near plans: the future tense'
    gloss: In August I am going to travel to Germany. I am going to book a hotel.
    note: 'Russian has no ''going to'' construction for near plans: use the future tense. A perfective verb has its own future form (*Я забронирую отель*). An imperfective verb uses *буду* + infinitive (*Завтра я буду работать*). A time word can come first without changing the verb: *В августе я поеду в Германию*.'
  ru.a2.unit66.lesson01.teach.ya_zabroniruyu_otel:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  ru.a2.unit66.lesson02.teach.proyti_kurs_pereekhat:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*Пройти курс* is the usual phrase for taking a course. *Переехать* is moving to a new home (*переезжать* is the imperfective).'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  ru.a2.unit66.lesson02.teach.pozzhe_cherez_mesyats:
    title: Further ahead
    gloss: later / in a month
    note: '*Через месяц* means ''a month from now''. It works with other periods too: *через неделю*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  ru.a2.unit66.lesson02.teach.cherez_mesyats_nachinaetsya:
    title: A course that starts
    gloss: In a month my course starts.
  ru.a2.unit66.lesson02.teach.ya_planiruyu_proyti:
    title: 'Intentions: планировать + infinitive'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *я планирую* and then an infinitive: *Я планирую пройти курс*. *Я собираюсь* means almost the same. Use it for things you want to do, not for fixed arrangements.'
  ru.a2.unit66.lesson02.teach.ya_planiruyu_pereekhat:
    title: Planning to move house
    gloss: I plan to move house.
  ru.a2.unit66.lesson02.teach.ya_planiruyu_kopit:
    title: Planning to save
    gloss: I plan to save money.
  ru.a2.unit66.lesson02.teach.zavtra_ya_poydu:
    title: Future tense or планирую?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use the future tense for the near, settled future: *Завтра я пойду на рынок*. Use *планирую* for an intention that is further away or less certain: *Позже я планирую переехать*.'
  ru.a2.unit66.lesson03.teach.vozmozhno_tochno:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*Возможно* expresses doubt. *Точно* means ''for sure''. Both are adverbs, so they never change.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  ru.a2.unit66.lesson03.teach.v_etom_godu:
    title: This year, this summer
    gloss: this year / this summer
    note: '*В этом году* uses *в* + the prepositional case. ''This summer'' alone is instrumental: *этим летом*, with no preposition.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  ru.a2.unit66.lesson03.teach.etim_letom_ya:
    title: Staying at home
    gloss: This summer I am staying at home.
  ru.a2.unit66.lesson03.teach.zavtra_ya_budu:
    title: Возможно and word order
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: '*Возможно* does not change the rest of the sentence: *Возможно, позже я пойду в кино*. The neutral order is subject, verb, then the rest, and a time word can open the sentence: *Завтра я буду работать*.'
  ru.a2.unit66.lesson03.teach.ya_ne_poedu:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *не* directly before the verb it negates: *Я не поеду в отпуск*. With *планирую* the negation goes before *планирую*, and the infinitive after it is usually imperfective: *Я не планирую переезжать*.'
  ru.a2.unit66.lesson04.teach.s_kem_kak:
    title: Two question phrases
    gloss: with whom / how long
    note: '*С кем* asks about a person you do something with; *с* is followed by the instrumental. *Как долго* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  ru.a2.unit66.lesson04.teach.kuda_ty_edesh:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Куда* asks about a direction (''where to''); *где* asks about a place (''where'').'
  ru.a2.unit66.lesson04.teach.s_kem_ty:
    title: Who with?
    gloss: Who are you going on holiday with?
  ru.a2.unit66.lesson04.teach.kak_dolgo_ty:
    title: How long?
    gloss: How long are you staying there?
  ru.a2.unit66.lesson04.teach.ya_edu_s:
    title: Answering
    gloss: I am going with my sister.
  ru.a2.unit66.lesson04.teach.nedelya_dve_nedeli:
    title: Weeks
    gloss: one week / two weeks
    note: 'After 2, 3 and 4 the noun is genitive singular: *две недели*. After 5 and more it is genitive plural: *пять недель*.'
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  ru.a2.unit66.lesson04.teach.kuda_ty_edesh_2:
    title: Questions about plans
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first and then the verb: *Куда ты едешь?* Russian needs no helper verb for present-tense plans. For a longer stay use the perfective future (*Как долго ты пробудешь?*), or *будешь* + infinitive (*Что ты будешь делать?*).'
  ru.a2.unit66.lesson05.teach.privet_nastya_skoro:
    title: A message from Lena
    gloss: Hi Nastya! Soon I have a holiday. In August I am going to Belgium with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Lena describes near plans in the future tense and a longer-term intention with *планирую*. Notice the case endings: *с сестрой*, *в Бельгию*, *к родителям*.'
    glosses:
      скоро: soon
      отпуск: holiday
      августе: August
      сестрой: sister
      в: to
      бельгию: Belgium
      отеле: hotel
      останемся: to stay
      потом: after that
      родителям: parents
      дня: days
      следующем: next
      году: year
      планирую: I plan (to)
      курс: course
      пройти: to take (a course)
      возможно: maybe
      перееду: to move house
      тогда: then
      также: also
  ru.a2.unit66.lesson06.teach.privet_dima_u:
    title: Nastya asks Dima about his plans
    gloss: 'Nastya: Hi Dima! Do you have plans for the summer holiday yet?'
  ru.a2.unit66.lesson06.teach.da_v_avguste:
    title: Dima answers
    gloss: 'Dima: Yes! In August I am going to Germany. I am going to book a hotel.'
  ru.a2.unit66.lesson06.teach.zdorovo_s_kem:
    title: Nastya asks who he is going with
    gloss: 'Nastya: Nice! Who are you going with?'
  ru.a2.unit66.lesson06.teach.s_moim_dyadey:
    title: Dima says who and how long
    gloss: 'Dima: With my uncle. We are going to stay for a week.'
  ru.a2.unit66.lesson06.teach.a_potom_chto:
    title: Nastya asks about later
    gloss: 'Nastya: And later? What do you plan to do?'
  ru.a2.unit66.lesson06.teach.v_sleduyushchem_godu:
    title: Dima names an intention and asks back
    gloss: 'Dima: Next year I plan to take a course. And you?'
  ru.a2.unit66.lesson06.teach.v_iyule_ya:
    title: Nastya answers
    gloss: 'Nastya: In July I am going to work. Maybe I will go to my parents'' after that.'
