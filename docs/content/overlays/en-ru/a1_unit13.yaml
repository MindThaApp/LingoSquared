course:
  title: "Russian A1"
  description: "Learn A1-level Russian for telling someone what you did yesterday using the past tense, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit13.past_events: {title: "What did you do yesterday?"}

lessons:
  ru.a1.unit13.lesson01.vchera_byl_doma: {title: "Yesterday I was home"}
  ru.a1.unit13.lesson02.hodil_v_kino: {title: "I went to the movies"}
  ru.a1.unit13.lesson03.chto_ty_delal: {title: "Dialogue: what did you do yesterday?"}

teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl: {title: "Вчера я был дома.", gloss: "Yesterday I was home.", note: "вчера means \"yesterday\"; был is the masculine past tense of \"to be,\" used by a male speaker."}
  ru.a1.unit13.lesson01.teach.byla: {title: "была", gloss: "was (said by a woman)", note: "была is the feminine past tense of \"to be\"; the verb agrees with the gender of the subject.", example_gloss: "Yesterday she was home."}
  ru.a1.unit13.lesson01.teach.vecherom: {title: "вечером", gloss: "in the evening", note: "вечером means \"in the evening,\" used to narrow down when a past event happened.", example_gloss: "Yesterday evening I was home."}

  ru.a1.unit13.lesson02.teach.hodil_v_kino: {title: "Вчера я ходил в кино.", gloss: "Yesterday I went to the movies.", note: "ходил (masculine) is the past tense of \"to go (on foot),\" used for a completed round trip."}
  ru.a1.unit13.lesson02.teach.hodila: {title: "ходила", gloss: "went (said by a woman)", note: "ходила is the feminine past-tense form of \"to go (on foot).\"", example_gloss: "Yesterday she went to the movies."}
  ru.a1.unit13.lesson02.teach.smotrel_film: {title: "смотрел фильм", gloss: "watched a film", note: "смотрел (masculine) / смотрела (feminine) is the past tense of \"to watch\"; фильм means \"film/movie.\"", example_gloss: "I watched a film."}

  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal: {title: "Nastya asks what Dima did", gloss: "Nastya: What did you do yesterday?", note: "Настя opens with Что ты делал вчера?"}
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel: {title: "Dima answers and asks back", gloss: "Dima: I went to the movies. I watched a good film. And you?", note: "Дима answers Я ходил в кино. Смотрел хороший фильм. А ты?"}
  ru.a1.unit13.lesson03.teach.nastya_byla_otdyhala: {title: "Nastya answers", gloss: "Nastya: I was home. I rested.", note: "Настя closes with Я была дома. Отдыхала."}

