review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Overlay for Russian C1 unit 02 on implicit meaning. English-speaker
    interference risks: (1) Russian irony reverses the literal sense without
    any grammatical marker, so the production prompts name the exact ironic
    and understated models rather than leaving the wording open; (2) the
    production models are gender-neutral for the learner (the subject is the
    third-person он), so a learner of either gender reproduces them exactly;
    (3) the culminating speaking and writing exercises each require the WHOLE
    act, and their accepted answers are the exact taught models with and
    without the final period. No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    irony/understatement models, gender neutrality, grading against allowed
    variants, MC defensibility, character canon. Fixes: lesson04.exercise04
    translate_kontekst -- added 'отчет' (е) spelling plus 'опять отчёт/отчет
    не прислал' and 'снова не прислал отчёт/отчет' variants;
    lesson06.exercise03 write_s_podtekstom -- added the 'отчет' spelling;
    lesson02.exercise04 order_namyok -- added 'он опять не сделал ничего' and
    'опять он ничего не сделал' (compiler warns on these intended alternate
    orders); lesson05.exercise03 cue_konechno -- single-word cue 'конечно' was
    indefensible (the irony is the whole formula plus context/tone); reframed
    (realization prompt + overlay) as 'What signals that Настя's Ну да,
    конечно is ironic?' with correct option 'The whole phrase plus the
    context: he always promises tomorrow' and parallel 'The word Ну/да/конечно
    on its own' distractors; teach.modello_obmen note now names the whole
    formula plus context and tone. NATIVE FLAGS: lesson01.exercise01
    distractors 'Да, конечно' and 'Ну да, наверное' are also commonly ironic
    in speech; CEFR fit -- content nearer A2/B1 than C1, production is
    verbatim reproduction. DEFERRED (owner call, needs audio):
    lesson05.teach.obmen_dima + media ru.c1.audio.ironiya.kollega.01 -- 'Наш
    коллега' spoken by Дима to Настя breaks canon (engineer vs teacher, no
    shared colleague); fix would be 'Мой коллега...' with regenerated asset,
    or drop the Дима/Настя attribution.

course:
  title: "Russian C1"
  description: "Advanced Russian inference: grasp and convey implicit meaning — irony, implication, and understatement — and read between the lines."

units:
  ru.c1.unit02.implicit_ironiya:
    title: "Implicit irony"
    description: "Recognize and produce irony, implication, and understatement: say the opposite of what is meant, soften a critical judgement, and read between the lines."

lessons:
  ru.c1.unit02.implicit_ironiya.lesson01.ironiya:
    title: "Irony: saying the opposite"
  ru.c1.unit02.implicit_ironiya.lesson02.namyok:
    title: "Implication and subtext"
  ru.c1.unit02.implicit_ironiya.lesson03.nedomolvka:
    title: "Understatement: to put it mildly"
  ru.c1.unit02.implicit_ironiya.lesson04.chitayu_mezhdu_strok:
    title: "Reading between the lines"
  ru.c1.unit02.implicit_ironiya.lesson05.slyshu_podtekst:
    title: "Hearing the subtext"
  ru.c1.unit02.implicit_ironiya.lesson06.govoryu_i_pishu:
    title: "Speaking and writing with subtext"

teaching:
  ru.c1.unit02.implicit_ironiya.lesson01.teach.ironiya:
    title: "irony"
    gloss: "irony"
    note: "*Ирония* is when you say one thing but mean the opposite; the real meaning comes from context and tone."
    example_gloss: "That was irony."
  ru.c1.unit02.implicit_ironiya.lesson01.teach.nu_da:
    title: "oh sure, of course"
    gloss: "oh sure, of course (I don't believe it)"
    note: "*Ну да, конечно* literally agrees ('well yes, of course') but, said ironically, means the speaker does NOT believe it."
  ru.c1.unit02.implicit_ironiya.lesson01.teach.prekrasno:
    title: "great / just great"
    gloss: "great (said ironically)"
    note: "*Прекрасно* ('great') said about something actually bad is an ironic reversal."
  ru.c1.unit02.implicit_ironiya.lesson01.teach.genialnaya_ideya:
    title: "a brilliant idea"
    gloss: "a brilliant idea (said ironically)"
    note: "*Гениальная идея* ('a brilliant idea') is ironic when the idea is actually poor; *гениальная* agrees with *идея*."
  ru.c1.unit02.implicit_ironiya.lesson01.teach.modello_ironiya:
    title: "ironic reversals"
    gloss: "Oh sure, of course. Great. Of course, a brilliant idea."
    note: "Irony reverses the literal sense: each of these means the opposite of its literal wording."

  ru.c1.unit02.implicit_ironiya.lesson02.teach.to_est:
    title: "that is"
    gloss: "that is / in other words"
    note: "*То есть* ('that is') spells out what was actually meant, making the implicit explicit."
  ru.c1.unit02.implicit_ironiya.lesson02.teach.nichego_ne_sdelal:
    title: "he again did nothing"
    gloss: "he again did nothing"
    note: "*Он опять ничего не сделал* states the unspoken judgement behind the colleague's promise; *сделал* agrees with *он*."
  ru.c1.unit02.implicit_ironiya.lesson02.teach.imet_v_vidu:
    title: "to mean"
    gloss: "to mean / to have in mind"
    note: "*Иметь в виду* means 'to have in mind'; *что ты имеешь в виду?* = 'what do you mean?'."
  ru.c1.unit02.implicit_ironiya.lesson02.teach.namekat:
    title: "to hint"
    gloss: "to hint"
    note: "*Намекать* ('to hint') is to suggest something without saying it directly."
    example_gloss: "He hints but does not say it directly."
  ru.c1.unit02.implicit_ironiya.lesson02.teach.modello_namyok:
    title: "making the implicit explicit"
    gloss: "That is, he again did nothing."
    note: "*То есть* converts an implication into a plain statement."

  ru.c1.unit02.implicit_ironiya.lesson03.teach.myagko_govorya:
    title: "to put it mildly"
    gloss: "to put it mildly"
    note: "*Мягко говоря* ('to put it mildly') softens a critical judgement while still conveying it."
  ru.c1.unit02.implicit_ironiya.lesson03.teach.ne_sovsem:
    title: "not exactly"
    gloss: "not exactly / not quite"
    note: "*Не совсем* ('not exactly') hedges a negative judgement — an understatement instead of a direct criticism."
  ru.c1.unit02.implicit_ironiya.lesson03.teach.skazhem_tak:
    title: "let's say"
    gloss: "let's say / shall we say"
    note: "*Скажем так* ('let's say') introduces a deliberately mild wording."
  ru.c1.unit02.implicit_ironiya.lesson03.teach.preumenshenie:
    title: "understatement"
    gloss: "understatement"
    note: "*Преуменьшение* ('understatement') is saying less than you mean to soften a judgement."
    example_gloss: "That was a clear understatement."
  ru.c1.unit02.implicit_ironiya.lesson03.teach.modello_nedomolvka:
    title: "an understated judgement"
    gloss: "To put it mildly, he is not the most punctual person."
    note: "*Мягко говоря, он не самый пунктуальный человек* says he is unreliable by understatement: 'not the most punctual' implies quite unpunctual."

  ru.c1.unit02.implicit_ironiya.lesson04.teach.kollega_kontekst:
    title: "our colleague again did not send the report"
    gloss: "Our colleague again did not send the report."
    note: "*Наш коллега опять не прислал отчёт* sets the context — the fact the judgement is about."
  ru.c1.unit02.implicit_ironiya.lesson04.teach.skazal_zavtra:
    title: "he said he'd send it tomorrow"
    gloss: "He said he would send it tomorrow."
    note: "*Он сказал, что пришлёт его завтра* is the colleague's own literal claim — the words, not the reality."
  ru.c1.unit02.implicit_ironiya.lesson04.teach.podtekst:
    title: "subtext"
    gloss: "subtext"
    note: "*Подтекст* ('subtext') is the meaning that is implied but not stated."
    example_gloss: "The letter has a hidden subtext."
  ru.c1.unit02.implicit_ironiya.lesson04.teach.chitat_mezhdu_strok:
    title: "to read between the lines"
    gloss: "to read between the lines"
    note: "*Читать между строк* ('to read between the lines') is to recover the subtext."
    example_gloss: "A good teacher knows how to read between the lines."
  ru.c1.unit02.implicit_ironiya.lesson04.teach.passazh:
    title: "the passage"
    gloss: "Our colleague again did not send the report. He said he would send it tomorrow. Oh sure, of course. To put it mildly, he is not the most punctual person."
    note: "Read the passage for what it states literally and what the writer actually means."

  ru.c1.unit02.implicit_ironiya.lesson05.teach.obmen_dima:
    title: "Дима reports the situation"
    gloss: "Our colleague again did not send the report. He said he would send it tomorrow."
    note: "Дима reports the facts: the report is late again, and the colleague keeps promising 'tomorrow'."
  ru.c1.unit02.implicit_ironiya.lesson05.teach.obmen_nastya:
    title: "Настя's ironic reply"
    gloss: "Oh sure, of course."
    note: "Настя's *Ну да, конечно* means 'I don't believe it' — the opposite of its literal agreement."
  ru.c1.unit02.implicit_ironiya.lesson05.teach.modello_obmen:
    title: "the exchange"
    gloss: "Our colleague again did not send the report. He said he would send it tomorrow. Oh sure, of course."
    note: "In a short exchange, the ironic line reverses its literal sense; the cue is the whole formula *ну да, конечно* plus the known context and the speaker's tone."

  ru.c1.unit02.implicit_ironiya.lesson06.teach.model_govoryu:
    title: "the speaking model"
    gloss: "Oh sure, of course. That is, he again did nothing."
    note: "The speaking model: an ironic remark (*Ну да, конечно*) followed by the explanation of the unstated judgement (*То есть он опять ничего не сделал*)."
  ru.c1.unit02.implicit_ironiya.lesson06.teach.model_pishu:
    title: "the writing model"
    gloss: "Our colleague again did not send the report. To put it mildly, he is not the most punctual person."
    note: "The writing model: a context (*Наш коллега опять не прислал отчёт*) plus an understated message (*Мягко говоря, он не самый пунктуальный человек*)."
  ru.c1.unit02.implicit_ironiya.lesson06.teach.ne_yavnyj_smysl:
    title: "implicit meaning"
    gloss: "implicit meaning"
    note: "*Неявный смысл* ('implicit meaning') is meaning that is conveyed without being stated outright."
    example_gloss: "His words carry an implicit meaning."

exercises:
  ru.c1.unit02.implicit_ironiya.lesson01.exercise01.recognize_ironiya:
    instruction: "Which Russian phrase says the opposite of what it literally means?"
    correct_option: "Ну да, конечно"
    distractors: ["Да, конечно", "Может быть", "Ну да, наверное"]
    accepted_answers: [{value: "Ну да, конечно", status: correct}]
    feedback: "*Ну да, конечно* literally agrees but, said ironically, means the speaker does not believe it."
  ru.c1.unit02.implicit_ironiya.lesson01.exercise02.listen_ironiya:
    instruction: "Listen and select what you hear."
    correct_option: "Just great."
    distractors: ["Just terrible.", "Of course.", "Maybe."]
    accepted_answers: [{value: "Just great.", status: correct}]
    feedback: "Прекрасно means 'great' / 'just great' — the word at the heart of the ironic reversal."
  ru.c1.unit02.implicit_ironiya.lesson01.exercise03.match_ironiya:
    instruction: "Match each Russian irony element to its English meaning."
    accepted_answers:
      - value: {"ирония": "irony", "Ну да, конечно": "oh sure, of course (I don't believe it)", "Прекрасно": "great (said ironically)", "гениальная идея": "a brilliant idea (said ironically)", "конечно": "of course", "идея": "idea"}
        status: correct
    feedback: "These phrases reverse their literal sense when used ironically."
  ru.c1.unit02.implicit_ironiya.lesson01.exercise04.order_ironiya:
    instruction: "Put the Russian words in order to form the ironic phrase."
    accepted_answers:
      - {value: "Ну да конечно", status: correct}
    feedback: "Ну да, конечно — oh sure, of course."
  ru.c1.unit02.implicit_ironiya.lesson01.exercise05.write_ironiya:
    instruction: "Write the exact taught ironic phrase that means you do not believe something."
    accepted_answers:
      - {value: "Ну да, конечно.", status: correct}
      - {value: "Ну да, конечно", status: correct}
    feedback: "Ну да, конечно."

  ru.c1.unit02.implicit_ironiya.lesson02.exercise01.recognize_to_est:
    instruction: "Which Russian phrase introduces the real, unstated meaning of what was just said?"
    correct_option: "То есть"
    distractors: ["Например", "Кстати", "В общем"]
    accepted_answers: [{value: "То есть", status: correct}]
    feedback: "*То есть* spells out what was actually meant."
  ru.c1.unit02.implicit_ironiya.lesson02.exercise02.listen_namyok:
    instruction: "Listen and select what you hear."
    correct_option: "That is, he again did nothing."
    distractors: ["That is, he again did everything.", "That is, he again did something.", "That is, he did nothing today."]
    accepted_answers: [{value: "That is, he again did nothing.", status: correct}]
    feedback: "То есть он опять ничего не сделал means that is, he again did nothing."
  ru.c1.unit02.implicit_ironiya.lesson02.exercise03.match_namyok:
    instruction: "Match each Russian implication element to its English meaning."
    accepted_answers:
      - value: {"То есть": "that is / in other words", "он опять ничего не сделал": "he again did nothing", "иметь в виду": "to mean / to have in mind", "намекать": "to hint", "ничего": "nothing", "сделал": "did"}
        status: correct
    feedback: "These phrases convert an implication into an explicit statement."
  ru.c1.unit02.implicit_ironiya.lesson02.exercise04.order_namyok:
    instruction: "Put the Russian words in order to state the unspoken judgement."
    accepted_answers:
      - {value: "он опять ничего не сделал", status: correct}
      - {value: "он опять не сделал ничего", status: correct}
      - {value: "опять он ничего не сделал", status: correct}
    feedback: "Он опять ничего не сделал — he again did nothing."
  ru.c1.unit02.implicit_ironiya.lesson02.exercise05.write_namyok:
    instruction: "Write the exact taught sentence that states the unspoken judgement."
    accepted_answers:
      - {value: "То есть он опять ничего не сделал.", status: correct}
      - {value: "То есть он опять ничего не сделал", status: correct}
    feedback: "То есть он опять ничего не сделал."

  ru.c1.unit02.implicit_ironiya.lesson03.exercise01.recognize_nedomolvka:
    instruction: "Which Russian phrase softens a critical judgement instead of stating it directly?"
    correct_option: "Мягко говоря"
    distractors: ["Прямо говоря", "Короче говоря", "Грубо говоря"]
    accepted_answers: [{value: "Мягко говоря", status: correct}]
    feedback: "*Мягко говоря* ('to put it mildly') softens a critical judgement."
  ru.c1.unit02.implicit_ironiya.lesson03.exercise02.listen_nedomolvka:
    instruction: "Listen and select what you hear."
    correct_option: "To put it mildly, he is not the most punctual person."
    distractors: ["To put it mildly, he is the most punctual person.", "To be direct, he is not punctual.", "To put it mildly, he is always late."]
    accepted_answers: [{value: "To put it mildly, he is not the most punctual person.", status: correct}]
    feedback: "Мягко говоря, он не самый пунктуальный человек means to put it mildly, he is not the most punctual person."
  ru.c1.unit02.implicit_ironiya.lesson03.exercise03.match_nedomolvka:
    instruction: "Match each Russian understatement element to its English meaning."
    accepted_answers:
      - value: {"преуменьшение": "understatement", "Мягко говоря": "to put it mildly", "не совсем": "not exactly / not quite", "скажем так": "let's say / shall we say", "самый": "the most", "пунктуальный": "punctual"}
        status: correct
    feedback: "These phrases soften a judgement instead of stating it directly."
  ru.c1.unit02.implicit_ironiya.lesson03.exercise04.order_nedomolvka:
    instruction: "Put the Russian words in order to form the understated judgement."
    accepted_answers:
      - {value: "он не самый пунктуальный человек", status: correct}
    feedback: "Он не самый пунктуальный человек — he is not the most punctual person."
  ru.c1.unit02.implicit_ironiya.lesson03.exercise05.write_nedomolvka:
    instruction: "Write the exact taught understatement."
    accepted_answers:
      - {value: "Мягко говоря, он не самый пунктуальный человек.", status: correct}
      - {value: "Мягко говоря, он не самый пунктуальный человек", status: correct}
    feedback: "Мягко говоря, он не самый пунктуальный человек."

  ru.c1.unit02.implicit_ironiya.lesson04.exercise01.read_stance:
    instruction: "Read the passage. Which sentence uses irony to show the writer does NOT believe the colleague?"
    correct_option: "Oh sure, of course."
    distractors: ["Our colleague again did not send the report.", "He said he would send it tomorrow.", "To put it mildly, he is not the most punctual person."]
    accepted_answers: [{value: "Oh sure, of course.", status: correct}]
    feedback: "Ну да, конечно is the ironic line: it literally agrees but actually expresses disbelief."
  ru.c1.unit02.implicit_ironiya.lesson04.exercise02.read_literal:
    instruction: "Read the passage. Which sentence is the colleague's own literal claim — what was actually said?"
    correct_option: "He said he would send it tomorrow."
    distractors: ["Our colleague again did not send the report.", "Oh sure, of course.", "To put it mildly, he is not the most punctual person."]
    accepted_answers: [{value: "He said he would send it tomorrow.", status: correct}]
    feedback: "Он сказал, что пришлёт его завтра is the literal claim; the writer's own stance is the irony and understatement around it."
  ru.c1.unit02.implicit_ironiya.lesson04.exercise03.match_funktsiya:
    instruction: "Match each sentence of the passage to its function."
    accepted_answers:
      - value: {"Наш коллега опять не прислал отчёт": "the fact / the context", "Он сказал, что пришлёт его завтра": "the literal claim", "Ну да, конечно": "ironic disbelief", "Мягко говоря, он не самый пунктуальный человек": "understated judgement", "подтекст": "subtext", "читать между строк": "to read between the lines"}
        status: correct
    feedback: "The passage separates the literal claim from the writer's actual stance."
  ru.c1.unit02.implicit_ironiya.lesson04.exercise04.translate_kontekst:
    instruction: "Translate into Russian: Our colleague again did not send the report."
    accepted_answers:
      - {value: "Наш коллега опять не прислал отчёт.", status: correct}
      - {value: "Наш коллега опять не прислал отчёт", status: correct}
      - {value: "Наш коллега опять не прислал отчет", status: correct}
      - {value: "Наш коллега опять отчёт не прислал", status: correct}
      - {value: "Наш коллега опять отчет не прислал", status: correct}
      - {value: "Наш коллега снова не прислал отчёт", status: correct}
      - {value: "Наш коллега снова не прислал отчет", status: correct}
    feedback: "Наш коллега опять не прислал отчёт."

  ru.c1.unit02.implicit_ironiya.lesson05.exercise01.listen_situatsiya:
    instruction: "Listen. What situation does Дима report?"
    correct_option: "The colleague again did not send the report."
    distractors: ["The colleague again sent the report on time.", "The colleague lost the report.", "The colleague finished the report early."]
    accepted_answers: [{value: "The colleague again did not send the report.", status: correct}]
    feedback: "Наш коллега опять не прислал отчёт means our colleague again did not send the report."
  ru.c1.unit02.implicit_ironiya.lesson05.exercise02.listen_nastya:
    instruction: "Дима has just said the colleague keeps promising to send the report 'tomorrow'. You hear Настя's reply. What does she actually mean?"
    correct_option: "She does not believe it — her 'of course' is ironic."
    distractors: ["She genuinely agrees.", "She is pleased with the news.", "She is asking for more details."]
    accepted_answers: [{value: "She does not believe it — her 'of course' is ironic.", status: correct}]
    feedback: "Ну да, конечно literally agrees but here means the opposite: Настя does not believe the colleague will send it."
  ru.c1.unit02.implicit_ironiya.lesson05.exercise03.cue_konechno:
    instruction: "What signals that Настя's 'Ну да, конечно' is ironic (she agrees on the surface but means the opposite)?"
    correct_option: "The whole phrase plus the context: he always promises 'tomorrow'"
    distractors: ["The word Ну on its own", "The word да on its own", "The word конечно on its own"]
    accepted_answers: [{value: "The whole phrase plus the context: he always promises 'tomorrow'", status: correct}]
    feedback: "No single word carries the irony: the whole formula *Ну да, конечно*, said in a knowing tone after Дима reports that the colleague always promises 'tomorrow', flips agreement into disbelief."
  ru.c1.unit02.implicit_ironiya.lesson05.exercise04.match_review:
    instruction: "Match each Russian item to its function in the exchange."
    accepted_answers:
      - value: {"Наш коллега опять не прислал отчёт": "the situation", "Ну да, конечно": "the ironic reply", "намекать": "to hint", "подтекст": "subtext", "преуменьшение": "understatement", "ирония": "irony"}
        status: correct
    feedback: "These are the tools for conveying implicit meaning."

  ru.c1.unit02.implicit_ironiya.lesson06.exercise01.match_chasti:
    instruction: "Match each part of the production models to its role."
    accepted_answers:
      - value: {"Ну да, конечно": "the ironic remark", "То есть он опять ничего не сделал": "the explanation of the unstated judgement", "Наш коллега опять не прислал отчёт": "the context", "Мягко говоря, он не самый пунктуальный человек": "the understated message", "неявный смысл": "implicit meaning", "ирония": "irony"}
        status: correct
    feedback: "Each production model pairs a remark with the meaning it leaves unstated."
  ru.c1.unit02.implicit_ironiya.lesson06.exercise02.speak_s_podtekstom:
    instruction: "Respond to the situation aloud: first give the ironic remark Ну да, конечно, then explain the unstated judgement with То есть он опять ничего не сделал."
    accepted_answers:
      - {value: "Ну да, конечно. То есть он опять ничего не сделал.", status: correct}
      - {value: "Ну да, конечно. То есть он опять ничего не сделал", status: correct}
    feedback: "Ну да, конечно. То есть он опять ничего не сделал."
  ru.c1.unit02.implicit_ironiya.lesson06.exercise03.write_s_podtekstom:
    instruction: "Write the exact taught context and message: first the context Наш коллега опять не прислал отчёт, then the understated judgement Мягко говоря, он не самый пунктуальный человек."
    accepted_answers:
      - {value: "Наш коллега опять не прислал отчёт. Мягко говоря, он не самый пунктуальный человек.", status: correct}
      - {value: "Наш коллега опять не прислал отчёт. Мягко говоря, он не самый пунктуальный человек", status: correct}
      - {value: "Наш коллега опять не прислал отчет. Мягко говоря, он не самый пунктуальный человек.", status: correct}
    feedback: "Наш коллега опять не прислал отчёт. Мягко говоря, он не самый пунктуальный человек."
