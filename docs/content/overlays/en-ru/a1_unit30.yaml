    gloss: Do you have internet at home?
  ru.a1.unit30.lesson01.teach.ya_kazhdyy_den:
    title: I use my phone every day
    gloss: I use my phone every day.
    note: '*Каждый день* (every day) is reused: *Я каждый день пользуюсь телефоном*. After *пользоваться* the thing is in the instrumental.'
  ru.a1.unit30.lesson02.teach.prilozhenie:
    title: The app
    gloss: the app
    example_gloss: I have an app for the weather forecast.
  ru.a1.unit30.lesson02.teach.soobshchenie:
    title: The message
    gloss: the message
    example_gloss: I'll send a message through the app.
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды and сообщение
    gloss: '*Прогноз погоды* is two words, and the second one, *погоды*, is in the genitive. *Сообщение* is a message you can send or read.'
    note: Ties the new word to the already-taught compound noun from the weather unit.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastya sends a message through the app
    gloss: Nastya sends a message through the app.
    note: '*Отправляет* (sends) is a regular verb. The message is the object in the accusative, and *через приложение* means ''through the app''.'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima reads the message
    gloss: Dima reads the message.
  ru.a1.unit30.lesson03.teach.iskat:
    title: To look up
    gloss: to look up
    example_gloss: I look up the weather forecast.
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться and искать
    gloss: '*Пользоваться* takes the instrumental (*пользоваться телефоном*), while *искать* takes the accusative (*искать прогноз*).'
    note: 'Both verbs are regular: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor looks up the weather forecast
    gloss: Igor looks up the weather forecast.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Then he goes running
    gloss: Then he goes running.
    note: '*Идёт бегать* means ''goes to run'': *идёт* is a motion verb followed by the infinitive of what he goes to do.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastya proposes
    gloss: 'Nastya: Shall we exercise Saturday at ten?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima agrees
    gloss: 'Dima: Good idea! I''ll look up the weather forecast.'
    note: '*Хорошая идея* is a feminine adjective with a feminine noun. *Поищу* is the perfective future, ''I will look up''.'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima checks the weather
    gloss: 'Dima: It''s sunny on Saturday!'
    note: '*Солнечно* is the weather word. No verb ''to be'' is needed: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor sees the message
    gloss: 'Igor: I see the message. See you Saturday!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До plus genitive
    gloss: 'You know *До свидания!* You can also name a day: *До субботы!*, *До завтра!* After *до* the noun is in the genitive.'
    note: Extends the greetings unit's farewell pattern to a specific day.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Who uses what?
    gloss: Nastya calls Dima every day. She uses her phone, not an app. Dima has no computer at home, but he uses internet on his phone. Igor looks up the weather forecast every morning. Then he goes running. Lena often sends Nastya a message. Do you also use your phone every day?
    note: Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape.
    glosses:
      звонит: calls
      каждый: every
      день: day
      пользуется: uses
      телефоном: phone
      приложением: app
      компьютера: computer
      дома: at home
      интернетом: internet
      ищет: looks up
      утро: morning
      прогноз: weather forecast
      идёт: goes
      бегать: running
      отправляет: sends
      часто: often
      сообщение: message
      пользуешься: use
  ru.a1.unit30.lesson05.teach.igor_kazhdoe_utro:
    title: Igor looks up the forecast every morning
    gloss: Igor looks up the weather forecast every morning.
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: Lena often messages Nastya
    gloss: Lena often sends Nastya a message.
  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: Nastya confirms the plan
    gloss: 'Nastya: I see the message. Shall we exercise Saturday at ten in the park?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima confirms the weather
    gloss: 'Dima: Yes, and it''s sunny on Saturday!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: Igor's plan
    gloss: 'Igor: I''ll run then. Afterward I''ll also play football.'
    note: '*Потом* (afterward) puts the second plan after the first, and *побегаю* is perfective: ''I will run for a while''.'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Lena's plan
    gloss: 'Lena: I''d rather swim, but I''m coming to the park too.'
    note: '*Я лучше поплаваю* means ''I would rather swim''. *Лучше* before the verb expresses preference.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastya closes the conversation
    gloss: 'Nastya: Nice! See you Saturday in the park!'
    note: Closes both this unit's messaging thread and the sports unit's plan in one line.
