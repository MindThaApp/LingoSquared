  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Overlay for ru's C1 unit01 on extended-discourse structure. English-speaker
    interference risks: (1) the discourse markers are fixed, low-frequency
    connectors (*во-первых*, *во-вторых*, *кстати*, *вернёмся*) that an
    English speaker will not build compositionally, so the production prompts
    name the exact marker for each move; (2) the digression verb *смущала*
    agrees with its subject *цена*, not the speaker, so the model stays
    gender-neutral and a learner of either gender reproduces it exactly; (3)
    the culminating speaking and writing exercises each require the WHOLE act,
    and their accepted answers are the exact taught model (with and without
    the final period). No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    discourse-move coverage, gender neutrality, grading against allowed
    variants, word_order tile alternatives, learner-visible notes. Fixes
    (overlay): lesson04.exercise05 write_vozvrat_sintez, lesson06.exercise03
    speak_polnyj and lesson06.exercise04 write_polnyj -- added the 'вернемся'
    (е for ё) spelling of the model, since grading has no ё/е equivalence and
    STT outputs е; lesson01.exercise04 order_napravlenie -- added 'Я сейчас
    объясню почему мы решили переехать'; lesson03.exercise04 order_otstuplenie
    -- added 'сначала цена меня смущала', 'цена меня сначала смущала',
    'сначала меня смущала цена' (compiler warns on these intended alternate
    orders); lesson06.teach.modello_polnyj note no longer refers to 'the final
    speaking and writing tasks'. NATIVE FLAGS: lesson01.exercise01 distractor
    'Сейчас я объясняю' can colloquially mean 'I'll explain right now'
    (borderline second correct option); CEFR fit -- the content sits nearer
    A2/B1 than C1 and C1 production is verbatim reproduction of a taught
    model. DEFERRED: none.

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 0 fixes. NATIVE FLAGS: none new (prior flags stand; CEFR fit nearer A2/B1). DEFERRED: none.

course:
  title: "Russian C1"
  description: "Advanced Russian discourse: structure an extended contribution — announce its direction, develop linked points with a digression and return, and close with a synthesis."

units:
  ru.c1.unit01.struktura_diskursa:
    title: "Discourse structure"
    description: "Structure an extended spoken or written contribution: signpost its direction, develop two linked points, make a controlled digression, return explicitly, and draw the strands together."

lessons:
  ru.c1.unit01.struktura_diskursa.lesson01.obyavlyayu_napravlenie:
    title: "Announcing your direction"
  ru.c1.unit01.struktura_diskursa.lesson02.razvivayu_mysl:
    title: "Developing your points"
  ru.c1.unit01.struktura_diskursa.lesson03.otstuplenie:
    title: "The digression"
  ru.c1.unit01.struktura_diskursa.lesson04.vozvrat_i_vyvod:
    title: "Return and synthesis"
  ru.c1.unit01.struktura_diskursa.lesson05.chitayu_strukturu:
    title: "Reading an extended structure"
  ru.c1.unit01.struktura_diskursa.lesson06.vsya_struktura:
    title: "The whole contribution"

teaching:
  ru.c1.unit01.struktura_diskursa.lesson01.teach.obyasnyu:
    title: "Now I'll explain"
    gloss: "Now I'll explain why we decided to move."
    note: "*Сейчас я объясню* ('now I'll explain') opens a longer contribution by announcing its direction. *Почему мы решили переехать* = 'why we decided to move'."
  ru.c1.unit01.struktura_diskursa.lesson01.teach.pervykh_vtorykh:
    title: "firstly, secondly"
    gloss: "firstly, secondly"
    note: "*Во-первых* ('firstly') and *во-вторых* ('secondly') signpost the numbered points of a structured contribution."
  ru.c1.unit01.struktura_diskursa.lesson01.teach.modello_plan:
    title: "Announcing the plan"
    gloss: "Now I'll explain why we decided to move. Firstly, secondly."
    note: "A structured contribution starts by announcing its direction, then signposts its points."

  ru.c1.unit01.struktura_diskursa.lesson02.teach.blizhe:
    title: "the first point"
    gloss: "First, the new apartment is closer to work."
    note: "*Ближе* ('closer') is the comparative of *близко*. *Ближе к работе* = 'closer to work'."
  ru.c1.unit01.struktura_diskursa.lesson02.teach.tishe:
    title: "the second point"
    gloss: "Second, it's much quieter there."
    note: "*Тише* ('quieter') is the comparative of *тихо*. *Гораздо* ('much') strengthens it."
  ru.c1.unit01.struktura_diskursa.lesson02.teach.modello_dva_punkta:
    title: "Two linked points"
    gloss: "First, the new apartment is closer to work. Second, it's much quieter there."
    note: "The two points are linked — both are reasons for moving. *Во-первых* ... *во-вторых* holds them together."

  ru.c1.unit01.struktura_diskursa.lesson03.teach.kstati:
    title: "a digression"
    gloss: "By the way, the price bothered me at first."
    note: "*Кстати* ('by the way') opens a controlled digression — a relevant side remark the speaker will later step away from. *Цена ... меня смущала* = 'the price bothered me'; the verb agrees with *цена*, not the speaker."
  ru.c1.unit01.struktura_diskursa.lesson03.teach.otvlekus:
    title: "I'll digress a little"
    gloss: "I will digress a little."
    note: "*Я немного отвлекусь* ('I'll digress a little') explicitly announces a digression before stepping off the main line."
  ru.c1.unit01.struktura_diskursa.lesson03.teach.modello_otstuplenie:
    title: "A controlled digression"
    gloss: "By the way, the price bothered me at first. I will digress a little."
    note: "A digression is a controlled detour: it stays relevant, and the speaker later returns to the main line."

  ru.c1.unit01.struktura_diskursa.lesson04.teach.vernemsya:
    title: "returning to the main point"
    gloss: "But let's return to the main point."
    note: "*Но вернёмся к главному* ('but let's return to the main point') is the explicit return signal that closes the digression."
  ru.c1.unit01.struktura_diskursa.lesson04.teach.sintez:
    title: "the synthesis"
    gloss: "Both reasons matter, so in the end this is the right decision."
    note: "*Обе причины важны* ('both reasons matter') pulls the strands together; *поэтому в итоге* ('so in the end') introduces the conclusion. *Это правильное решение* = 'this is the right decision'."
  ru.c1.unit01.struktura_diskursa.lesson04.teach.modello_vozvrat:
    title: "Return and synthesis"
    gloss: "But let's return to the main point. Both reasons matter, so in the end this is the right decision."
    note: "The contribution closes by returning to the main line and then drawing the two points together into a synthesis."

  ru.c1.unit01.struktura_diskursa.lesson05.teach.polnaya_struktura:
    title: "The full contribution"
    gloss: "Now I'll explain why we decided to move. First, the new apartment is closer to work. Second, it's much quieter there. By the way, the price bothered me at first. But let's return to the main point. Both reasons matter, so in the end this is the right decision."
    note: "This is the complete extended contribution: it announces its direction, develops two linked points, digresses, returns, and closes with a synthesis."

  ru.c1.unit01.struktura_diskursa.lesson06.teach.modello_polnyj:
    title: "The model to reproduce"
    gloss: "Now I'll explain why we decided to move. First, the new apartment is closer to work. Second, it's much quieter there. By the way, the price bothered me at first. But let's return to the main point. Both reasons matter, so in the end this is the right decision."
    note: "This is the model to reproduce when you speak and write: announce the direction, give two linked points, digress, return, and close with a synthesis — in that order."
  ru.c1.unit01.struktura_diskursa.lesson06.teach.struktura:
    title: "the structure"
    gloss: "structure"
    note: "*Структура* ('structure') is the shape of an extended contribution — its roadmap, points, digression, return, and conclusion."
    example_gloss: "My talk has a clear structure."

