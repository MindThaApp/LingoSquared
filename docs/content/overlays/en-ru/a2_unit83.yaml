  ru.a2.unit83.lesson01.exercise06.bank: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Простите, вы не знаете, где банк?", "status": "correct"}, {"value": "Простите, вы не знаете, где банк", "status": "correct"}, {"value": "Простите, вы не знаете, где здесь банк?", "status": "correct"}, {"value": "Простите, вы не знаете, где здесь банк", "status": "correct"}], "feedback": "*Простите, вы не знаете, где ...?*"}
  ru.a2.unit83.lesson01.exercise07.nastya2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Я не знаю, где Настя.", "accepted_answers": [{"value": "Я не знаю, где Настя.", "status": "correct"}, {"value": "Я не знаю, где Настя", "status": "correct"}], "feedback": "*Я не знаю*, then *где*."}
  ru.a2.unit83.lesson02.exercise01.bank: {"instruction": "Choose the correct English meaning.", "correct_option": "Do you know when the bank opens?", "distractors": ["Do you know where the bank is?", "Do you know whether the bank is open?", "Do you know how much the bank costs?"], "accepted_answers": [{"value": "Do you know when the bank opens?", "status": "correct"}], "feedback": "*Когда* = when."}
