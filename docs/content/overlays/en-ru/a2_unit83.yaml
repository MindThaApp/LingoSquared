  ru.a2.unit83.lesson05.exercise05.t5: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Ты не знаешь, работает ли банк сегодня?", "status": "correct"}, {"value": "Ты не знаешь, работает ли банк сегодня", "status": "correct"}], "feedback": "*Работает ли банк сегодня*."}
