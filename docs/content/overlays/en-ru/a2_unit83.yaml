teaching:
  ru.a2.unit83.lesson01.teach.gde: {"title": "Do you know where", "gloss": "you know (polite) / you know (to a friend) / I know / where / station / here / excuse me", "note": "*Вы не знаете* is a polite way to ask for information. To a friend say *ты не знаешь*.", "example_gloss": ["Excuse me, do you know where the bank is?", "Do you know where the station is?", "I do not know where the pharmacy is here.", "Do you know where Nastya is? (to a friend)"]}
  ru.a2.unit83.lesson01.teach.gn_vy: {"title": "Polite question", "gloss": "Do you know where the station is?", "note": "Start with *вы не знаете*, add a comma and the question word *где*. After it the words stand as in a statement: *где вокзал*."}
  ru.a2.unit83.lesson01.teach.gn_znat: {"title": "Forms of знать", "gloss": "I do not know where the station is. Do you know where Nastya is?", "note": "*Знать*: я знаю, ты знаешь, вы знаете. The question word and the rest come after the comma."}
  ru.a2.unit83.lesson02.teach.kogda: {"title": "More question words", "gloss": "when / how much / costs / ticket / opens / arrives / bus", "note": "The question words *когда* and *сколько* work like *где*: after the comma comes a normal statement.", "example_gloss": ["Do you know when the bank opens?", "Do you know how much the ticket costs?", "I do not know when the bus arrives.", "Do you know when Dima is coming? (to a friend)"]}
  ru.a2.unit83.lesson02.teach.gn_kogda: {"title": "Other question words", "gloss": "Do you know when the bank opens? Do you know how much the ticket costs?", "note": "After *вы не знаете* any question word can follow: *где, когда, сколько*. Then comes a normal clause."}
  ru.a2.unit83.lesson02.teach.gn_stat: {"title": "Statement or question", "gloss": "I do not know when the bus arrives. Do you know when the bus arrives?", "note": "The second part is the same in both: *когда приходит автобус*. Only the first part and the final punctuation change."}
  ru.a2.unit83.lesson03.teach.li: {"title": "Whether", "gloss": "whether / whether there is / whether it works / whether he will come / today", "note": "*Ли* means 'whether' or 'if' in a question about yes or no. It comes right after the word you ask about.", "example_gloss": ["Do you know whether the bank is working?", "I do not know whether Dima will come.", "Do you know whether there is a pharmacy here?", "I do not know whether the bank is working today."]}
  ru.a2.unit83.lesson03.teach.gn_li: {"title": "ли after the verb", "gloss": "Do you know whether the bank is working?", "note": "For a yes-or-no question put the verb first and *ли* right after it: *работает ли*."}
  ru.a2.unit83.lesson03.teach.gn_est: {"title": "есть ли, придёт ли", "gloss": "I do not know whether Dima will come. Do you know whether there is a pharmacy here?", "note": "The same rule for other verbs: *придёт ли*, *есть ли*. With a question word like *где* you do not need *ли*."}
  ru.a2.unit83.lesson04.teach.skazhite: {"title": "Asking and answering", "gloss": "tell (me) / please / there / to the left / to the right / thank you", "note": "*Скажите, пожалуйста* is a very polite way to start a question to a stranger.", "example_gloss": ["Please tell me where the pharmacy is here.", "The pharmacy is over there, on the left.", "Please tell me how much the ticket costs.", "The bank is over there, on the right."]}
  ru.a2.unit83.lesson04.teach.gn_skazhite: {"title": "Скажите, пожалуйста", "gloss": "Please tell me where the pharmacy is here.", "note": "After *скажите, пожалуйста* put a comma and the question word. The rest is a normal clause."}
  ru.a2.unit83.lesson04.teach.gn_levels: {"title": "Three levels of politeness", "gloss": "Where is the station? Do you know where the station is? Please tell me where the station is.", "note": "The direct question is short. *Вы не знаете* is polite, and *скажите, пожалуйста* is the most polite. The words after the question word stay the same."}
  ru.a2.unit83.lesson05.teach.v5: {"title": "Words for the message", "gloss": "at the station / write! (to a friend)", "note": "*Напиши* is the ты-command 'write'.", "example_gloss": ["I am at the station.", "If you know, write to me."]}
  ru.a2.unit83.lesson05.teach.reading: {"title": "Nastya writes to Dima", "gloss": "Hi, Dima! I am at the station, but I do not know when the bus arrives. I do not know where the pharmacy is here. Do you know whether the bank is working today? If you know, write to me. Nastya", "note": "The message uses где, когда and ли in indirect questions.", "glosses": {"напиши": "write (to a friend)"}}
  ru.a2.unit83.lesson06.teach.q: {"title": "Nastya asks a stranger", "gloss": "Настя: Excuse me, do you know where the pharmacy is here?"}
  ru.a2.unit83.lesson06.teach.a: {"title": "The passer-by answers", "gloss": "Прохожий: I do. The pharmacy is over there, on the left."}
  ru.a2.unit83.lesson06.teach.q2: {"title": "Nastya asks about the bank", "gloss": "Настя: Thank you! And please tell me whether the bank is working today."}
  ru.a2.unit83.lesson06.teach.a2: {"title": "The passer-by answers", "gloss": "Прохожий: Yes, the bank is working. It opens at nine."}
  ru.a2.unit83.lesson06.teach.end: {"title": "Nastya thanks him", "gloss": "Настя: Thank you very much!"}
