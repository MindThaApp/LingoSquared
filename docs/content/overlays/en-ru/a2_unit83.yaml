  ru.a2.unit83.lesson05.exercise01.r1: {"instruction": "Read the text and choose the answer.", "correct_option": "When it arrives.", "distractors": ["Where it stops.", "How much it costs.", "Whether it is coming."], "accepted_answers": [{"value": "When it arrives.", "status": "correct"}], "feedback": "*Я не знаю, когда приходит автобус.*"}
  ru.a2.unit83.lesson05.exercise02.r2: {"instruction": "Read the text and choose the answer.", "correct_option": "Whether the bank is working today.", "distractors": ["Where the bank is.", "When the bank opens.", "How much the ticket costs."], "accepted_answers": [{"value": "Whether the bank is working today.", "status": "correct"}], "feedback": "*Ты не знаешь, работает ли банк сегодня?*"}
