  ru.a2.unit83.lesson01.exercise02.apt: {"instruction": "Choose the correct English meaning.", "correct_option": "I do not know where the pharmacy is here.", "distractors": ["I do not know when the pharmacy is open.", "I know where the pharmacy is.", "Do you know where the pharmacy is?"], "accepted_answers": [{"value": "I do not know where the pharmacy is here.", "status": "correct"}], "feedback": "*Не знаю* = I do not know."}
  ru.a2.unit83.lesson01.exercise03.w1: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "вы знаете", "right": "you know (polite)"}, {"left": "ты знаешь", "right": "you know (to a friend)"}, {"left": "я знаю", "right": "I know"}, {"left": "где", "right": "where"}, {"left": "вокзал", "right": "station"}, {"left": "здесь", "right": "here"}], "status": "correct"}], "feedback": "These words recur in the unit."}
