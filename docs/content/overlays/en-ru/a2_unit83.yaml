course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Ask for information politely with indirect questions."
units:
  ru.a2.unit83.vy_ne_znaete: {"title": "Do you know where", "description": "Ask polite indirect questions with вы не знаете, где, когда, сколько and ли."}
lessons:
  ru.a2.unit83.lesson01.gde: {"title": "Do you know where"}
  ru.a2.unit83.lesson02.kogda: {"title": "When, how much"}
  ru.a2.unit83.lesson03.li: {"title": "Whether the bank works"}
  ru.a2.unit83.lesson04.skazhite: {"title": "Please tell me"}
