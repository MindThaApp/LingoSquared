  ru.a2.unit83.lesson03.exercise01.bank: {"instruction": "Choose the correct Russian question.", "correct_option": "Вы не знаете, работает ли банк?", "distractors": ["Вы не знаете, ли работает банк?", "Вы не знаете, работает банк ли?", "Вы не знаете, работают ли банк?"], "accepted_answers": [{"value": "Вы не знаете, работает ли банк?", "status": "correct"}], "feedback": "*Работает ли* = whether it works."}
