  ru.a2.unit83.lesson04.exercise06.apt: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Скажите, пожалуйста, где аптека?", "status": "correct"}, {"value": "Скажите, пожалуйста, где аптека", "status": "correct"}, {"value": "Скажите, пожалуйста, где здесь аптека?", "status": "correct"}, {"value": "Скажите, пожалуйста, где здесь аптека", "status": "correct"}], "feedback": "*Скажите, пожалуйста, где ...?*"}
