course:
  title: "Russian A1"
  description: "Learn A1-level Russian for asking where common places are located and describing your street, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit09.places: {title: "Places in the city"}

lessons:
  ru.a1.unit09.lesson01.gde_nakhoditsya: {title: "Where is ...?"}
  ru.a1.unit09.lesson02.mesta_v_gorode: {title: "Places in the city"}
  ru.a1.unit09.lesson03.moya_ulitsa: {title: "Dialogue: my street"}

teaching:
  ru.a1.unit09.lesson01.teach.gde: {title: "где", gloss: "where", note: "где asks about location, often paired with находится.", example_gloss: "Where is the store?"}
  ru.a1.unit09.lesson01.teach.nakhoditsya: {title: "находится", gloss: "is located", note: "находится is the third-person singular of находиться (\"to be located\"), used with a singular subject like магазин.", example_gloss: "Where is the store located?"}
  ru.a1.unit09.lesson01.teach.ulitsa: {title: "улица", gloss: "street", note: "улица is feminine; на Тверской улице (\"on Tverskaya Street\") uses the prepositional case after на.", example_gloss: "The store is on Tverskaya Street."}
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin: {title: "Где находится магазин?", gloss: "Where is the store located?", note: "The standard question pattern for asking where any place is."}

  ru.a1.unit09.lesson02.teach.bank_apteka: {title: "банк, аптека", gloss: "bank, pharmacy", note: "банк is masculine and аптека is feminine -- both common places around town.", example_gloss: ["Where is the bank located?", "Where is the pharmacy located?"]}
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa: {title: "вокзал, гостиница", gloss: "train station, hotel", note: "вокзал is masculine and гостиница is feminine.", example_gloss: ["Where is the train station located?", "Where is the hotel located?"]}
  ru.a1.unit09.lesson02.teach.restoran_biblioteka: {title: "ресторан, библиотека", gloss: "restaurant, library", note: "ресторан is masculine and библиотека is feminine; street names like Чайковского, Горького, and Пушкина appear in the genitive case after улица.", example_gloss: ["Where is the restaurant located?", "Where is the library located?"]}

  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse: {title: "Что есть на вашей улице?", gloss: "What is on your street?", note: "вашей is the formal possessive \"your,\" agreeing with the feminine noun улице in the prepositional case."}
  ru.a1.unit09.lesson03.teach.anna_chto_est: {title: "Anna asks about the street", gloss: "Anna: What is on your street?", note: "Anna opens the dialogue with Что есть на вашей улице?"}
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse: {title: "Viktor lists three places", gloss: "Viktor: On my street there's a store, a library, and a bank.", note: "На моей улице есть lists items using есть (\"there is/are\"), joined with и."}
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank: {title: "Anna asks where the bank is", gloss: "Anna: And where is the bank located?", note: "А smoothly introduces Anna's follow-up question about one of the places Viktor named."}
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina: {title: "Viktor names the bank's street", gloss: "Viktor: The bank is on Pushkin Street.", note: "Виктор answers with Банк на улице Пушкина, using the genitive Пушкина after улице."}
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe: {title: "Anna thanks Viktor", gloss: "Anna: Thank you very much.", note: "Спасибо большое intensifies спасибо with большое (\"big/great\"), a common way to say \"thank you very much.\""}

exercises:
  ru.a1.unit09.lesson01.exercise01.recognize_gde:
    instruction: "Which word means \"where\"?"
    correct_option: "где"
    distractors: ["находится", "улица", "магазин"]
    accepted_answers: [{value: "где", status: "correct"}]
    feedback: "где means \"where.\""
  ru.a1.unit09.lesson01.exercise02.recognize_ulitsa:
    instruction: "Which word means \"street\"?"
    correct_option: "улица"
    distractors: ["где", "находится", "магазин"]
    accepted_answers: [{value: "улица", status: "correct"}]
    feedback: "улица means \"street.\""
  ru.a1.unit09.lesson01.exercise03.listen_select_gde_magazin:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "Where is the store located?"
    distractors: ["Is this table free?", "What is on your street?", "How much does the store cost?"]
    accepted_answers: [{value: "Where is the store located?", status: "correct"}]
    feedback: "The recording says Где находится магазин? (\"Where is the store located?\")."
  ru.a1.unit09.lesson01.exercise04.match_location_words:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "где", right: "where"}
          - {left: "находится", right: "is located"}
          - {left: "улица", right: "street"}
          - {left: "магазин", right: "store"}
        status: "correct"
    feedback: "где=where, находится=is located, улица=street, магазин=store."
  ru.a1.unit09.lesson01.exercise05.order_gde_nakhoditsya_magazin:
    instruction: "Put the words in the correct order to say \"Where is the store located?\""
    accepted_answers:
      - {value: ["Где", "находится", "магазин"], status: "correct"}
    feedback: "The correct order is Где находится магазин?"
  ru.a1.unit09.lesson01.exercise06.listen_order_magazin_na_tverskoy:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Магазин", "на", "Тверской", "улице"], status: "correct"}
    feedback: "The correct order is Магазин на Тверской улице (\"The store is on Tverskaya Street\")."
  ru.a1.unit09.lesson01.exercise07.complete_gde_nakhoditsya:
    instruction: "Complete the question: ___ находится магазин? (Where)"
    accepted_answers:
      - {value: "Где", status: "correct"}
      - {value: "Где находится магазин", status: "correct"}
    feedback: "Где means \"where,\" asking about the store's location."
  ru.a1.unit09.lesson01.exercise08.write_ask_where_store:
    instruction: "Write a question asking where the store is, using \"Где находится...?\"."
    accepted_answers:
      - {value: "Где находится магазин?", status: "correct"}
      - {value: "Где находится магазин", status: "correct"}
    feedback: "Где находится магазин? means \"Where is the store located?\""

  ru.a1.unit09.lesson02.exercise01.recognize_apteka:
    instruction: "Which word means \"pharmacy\"?"
    correct_option: "аптека"
    distractors: ["банк", "вокзал", "гостиница"]
    accepted_answers: [{value: "аптека", status: "correct"}]
    feedback: "аптека means \"pharmacy.\""
  ru.a1.unit09.lesson02.exercise02.recognize_vokzal:
    instruction: "Which word means \"train station\"?"
    correct_option: "вокзал"
    distractors: ["аптека", "банк", "гостиница"]
    accepted_answers: [{value: "вокзал", status: "correct"}]
    feedback: "вокзал means \"train station.\""
  ru.a1.unit09.lesson02.exercise03.listen_select_gde_apteka:
    instruction: "Listen to the recording. What place is being asked about?"
    correct_option: "The pharmacy"
    distractors: ["The bank", "The train station", "The hotel"]
    accepted_answers: [{value: "The pharmacy", status: "correct"}]
    feedback: "The recording says Где находится аптека? (\"Where is the pharmacy located?\")."
  ru.a1.unit09.lesson02.exercise04.match_places_around_town:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "банк", right: "bank"}
          - {left: "аптека", right: "pharmacy"}
          - {left: "вокзал", right: "train station"}
          - {left: "гостиница", right: "hotel"}
          - {left: "ресторан", right: "restaurant"}
          - {left: "библиотека", right: "library"}
        status: "correct"
    feedback: "банк=bank, аптека=pharmacy, вокзал=train station, гостиница=hotel, ресторан=restaurant, библиотека=library."
  ru.a1.unit09.lesson02.exercise05.order_gde_nakhoditsya_bank:
    instruction: "Put the words in the correct order to say \"Where is the bank located?\""
    accepted_answers:
      - {value: ["Где", "находится", "банк"], status: "correct"}
    feedback: "The correct order is Где находится банк?"
  ru.a1.unit09.lesson02.exercise06.listen_order_apteka_na_ulitse:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Аптека", "на", "улице", "Чайковского"], status: "correct"}
    feedback: "The correct order is Аптека на улице Чайковского (\"The pharmacy is on Tchaikovsky Street\")."
  ru.a1.unit09.lesson02.exercise07.complete_gde_nakhoditsya_biblioteka:
    instruction: "Complete the question: Где ___ библиотека? (is located)"
    accepted_answers:
      - {value: "находится", status: "correct"}
      - {value: "Где находится библиотека", status: "correct"}
    feedback: "находится means \"is located.\""
  ru.a1.unit09.lesson02.exercise08.write_ask_where_library:
    instruction: "Write a question asking where the library is, using \"Где находится...?\"."
    accepted_answers:
      - {value: "Где находится библиотека?", status: "correct"}
      - {value: "Где находится библиотека", status: "correct"}
    feedback: "Где находится библиотека? means \"Where is the library located?\""

  ru.a1.unit09.lesson03.exercise01.choose_ask_whats_on_street:
    instruction: "You want to ask someone what places are on their street. What do you say?"
    correct_option: "Что есть на вашей улице?"
    distractors: ["Где находится банк?", "Спасибо большое.", "Банк на улице Пушкина."]
    accepted_answers: [{value: "Что есть на вашей улице?", status: "correct"}]
    feedback: "Что есть на вашей улице? means \"What is on your street?\""
  ru.a1.unit09.lesson03.exercise02.listen_select_chto_est:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "What is on your street?"
    distractors: ["Where is the bank located?", "Is this table free?", "Do you have a pharmacy?"]
    accepted_answers: [{value: "What is on your street?", status: "correct"}]
    feedback: "The recording says Что есть на вашей улице? (\"What is on your street?\")."
  ru.a1.unit09.lesson03.exercise03.dialogue_comprehension_moya_ulitsa:
    instruction: "Listen to the dialogue. What three places are on Viktor's street, and where is the bank located?"
    correct_option: "A store, a library, and a bank; the bank is on Pushkin Street"
    distractors: ["A store, a restaurant, and a bank; the bank is on Pushkin Street", "A store, a library, and a bank; the bank is on Tverskaya Street", "A pharmacy, a library, and a bank; the bank is on Pushkin Street"]
    accepted_answers: [{value: "A store, a library, and a bank; the bank is on Pushkin Street", status: "correct"}]
    feedback: "Viktor names магазин, библиотека and банк, and says Банк на улице Пушкина."
  ru.a1.unit09.lesson03.exercise04.match_street_phrases:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Где находится банк?", right: "Where is the bank?"}
          - {left: "Банк на улице Пушкина.", right: "The bank is on Pushkin Street."}
          - {left: "Что есть на вашей улице?", right: "What is on your street?"}
          - {left: "На моей улице есть магазин.", right: "On my street there's a store."}
          - {left: "Спасибо большое.", right: "Thank you very much."}
          - {left: "Пожалуйста.", right: "You're welcome."}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange asking about and describing a street."
  ru.a1.unit09.lesson03.exercise05.order_bank_na_ulitse_pushkina:
    instruction: "Put the words in the correct order to say \"The bank is on Pushkin Street.\""
    accepted_answers:
      - {value: ["Банк", "на", "улице", "Пушкина"], status: "correct"}
    feedback: "The correct order is Банк на улице Пушкина."
  ru.a1.unit09.lesson03.exercise06.reply_gde_nakhoditsya_restoran:
    instruction: "Someone asks \"Где находится ресторан?\" Reply that the restaurant is on Gorky Street."
    accepted_answers:
      - {value: "Ресторан на улице Горького.", status: "correct"}
      - {value: "Ресторан на улице Горького", status: "correct"}
    feedback: "Ресторан на улице Горького means \"The restaurant is on Gorky Street.\""
  ru.a1.unit09.lesson03.exercise07.complete_na_moey_ulitse:
    instruction: "Complete the sentence: На ___ улице есть магазин. (my)"
    accepted_answers:
      - {value: "моей", status: "correct"}
      - {value: "На моей улице есть магазин", status: "correct"}
    feedback: "моей is the possessive \"my,\" agreeing with the feminine noun улице."
  ru.a1.unit09.lesson03.exercise08.write_describe_street:
    instruction: "Write two or three sentences describing what places are on your street."
    accepted_answers:
      - {value: "На моей улице есть магазин, библиотека и банк.", status: "correct"}
      - {value: "На моей улице есть магазин и ресторан. Банк на улице Пушкина.", status: "correct"}
    feedback: "A natural description uses На моей улице есть with a list of places joined by и."
