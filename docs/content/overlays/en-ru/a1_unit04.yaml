course:
  title: "Russian A1"
  description: "Learn A1-level Russian for everyday greetings and short social exchanges, with detailed English explanations of the Cyrillic alphabet and the вы/ты formality distinction."

units:
  ru.a1.unit04.dates: {title: "Dates and days of the week"}

lessons:
  ru.a1.unit04.lesson01.dni_nedeli: {title: "Days of the week"}
  ru.a1.unit04.lesson02.mesyatsy_i_chisla: {title: "Months and dates of the month"}
  ru.a1.unit04.lesson03.naznachaem_vstrechu: {title: "Arranging a meeting"}

teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den: {title: "Какой сегодня день?", gloss: "What day is it today?", note: "Какой agrees with the masculine noun день (\"day\")."}
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik: {title: "понедельник, вторник", gloss: "Monday, Tuesday", note: "Days of the week are not capitalized in Russian, unlike English.", example_gloss: ["Today is Monday.", "Today is Tuesday."]}
  ru.a1.unit04.lesson01.teach.sreda_chetverg: {title: "среда, четверг", gloss: "Wednesday, Thursday", note: "Like all Russian weekday names, среда and четверг stay lowercase even at the start of a sentence.", example_gloss: ["Today is Wednesday.", "Today is Thursday."]}
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota: {title: "пятница, суббота", gloss: "Friday, Saturday", note: "суббота has a double б -- a common spelling trap.", example_gloss: ["Today is Friday.", "Today is Saturday."]}
  ru.a1.unit04.lesson01.teach.voskresenye: {title: "воскресенье", gloss: "Sunday", note: "The last day of the Russian week list.", example_gloss: "Today is Sunday."}
  ru.a1.unit04.lesson01.teach.segodnya: {title: "Сегодня ...", gloss: "Today is ...", note: "Сегодня plus a day name needs no linking verb, unlike English \"is.\""}

  ru.a1.unit04.lesson02.teach.kakoe_chislo: {title: "Какое сегодня число?", gloss: "What is today's date?", note: "Какое agrees with the neuter noun число (\"date/number\"), unlike какой день above."}
  ru.a1.unit04.lesson02.teach.pervoe_tretye: {title: "первое, третье", gloss: "1st, 3rd", note: "Ordinal dates take the neuter ending (-ое/-ье) to agree with the understood noun число.", example_gloss: ["Today is January 1st.", "Today is January 3rd."]}
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe: {title: "пятое, десятое", gloss: "5th, 10th", note: "Same neuter ordinal pattern as первое/третье.", example_gloss: ["Today is October 5th.", "Today is April 10th."]}
  ru.a1.unit04.lesson02.teach.yanvar_aprel: {title: "января, апреля", gloss: "of January, of April", note: "The month name switches to the genitive case after a date, so январь becomes января and апрель becomes апреля.", example_gloss: ["Today is January 3rd.", "Today is April 10th."]}
  ru.a1.unit04.lesson02.teach.oktyabrya: {title: "октября", gloss: "of October", note: "Genitive form of октябрь, following the same after-a-date pattern as января/апреля.", example_gloss: "Today is October 5th."}

  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo: {title: "Какое сегодня число?", gloss: "What is today's date?", note: "The standard way to ask for the calendar date."}
  ru.a1.unit04.lesson03.teach.vo_vtornik: {title: "во вторник", gloss: "on Tuesday", note: "The preposition в becomes во before вторник for easier pronunciation; the day name itself doesn't change form."}
  ru.a1.unit04.lesson03.teach.vstrecha: {title: "встреча", gloss: "meeting", note: "A common noun for a scheduled meeting or appointment.", example_gloss: "The meeting is on Tuesday."}
  ru.a1.unit04.lesson03.teach.anna_kakoy_den: {title: "Anna asks the day", gloss: "Anna: What day is it today?", note: "Anna opens the exchange with the день question from lesson01."}
  ru.a1.unit04.lesson03.teach.viktor_sreda: {title: "Viktor answers with day and date", gloss: "Viktor: Today is Wednesday, January 3rd.", note: "Viktor states both the weekday and the ordinal date together, third januarya using the genitive month form."}
  ru.a1.unit04.lesson03.teach.anna_khorosho: {title: "Anna proposes Tuesday", gloss: "Anna: Good. Is the meeting on Tuesday?", note: "Хорошо acknowledges Viktor's answer before Anna asks her follow-up question."}
  ru.a1.unit04.lesson03.teach.viktor_da: {title: "Viktor confirms the date", gloss: "Viktor: Yes, on Tuesday, January 9th.", note: "Да confirms, then Viktor restates the day and the genitive date девятого января (\"January 9th\")."}

exercises:
  ru.a1.unit04.lesson01.dni_nedeli.exercise09.dictation_segodnya_subbota_neutral:
    instruction: "Type what you hear."
    correct_option: "Сегодня суббота"
    accepted_answers: [{value: "Сегодня суббота", status: correct}]
    orthography_strict: true

  ru.a1.unit04.lesson01.exercise01.recognize_sreda:
    instruction: "Which day is this?"
    correct_option: "среда"
    distractors: ["вторник", "четверг", "суббота"]
    accepted_answers: [{value: "среда", status: "correct"}]
    feedback: "среда means \"Wednesday.\""
  ru.a1.unit04.lesson01.exercise02.recognize_subbota:
    instruction: "Which day is this?"
    correct_option: "суббота"
    distractors: ["пятница", "воскресенье", "среда"]
    accepted_answers: [{value: "суббота", status: "correct"}]
    feedback: "суббота means \"Saturday.\""
  ru.a1.unit04.lesson01.exercise03.listen_select_first_day:
    instruction: "Listen to the recording. Which day is first?"
    correct_option: "понедельник"
    distractors: ["четверг", "пятница", "воскресенье"]
    accepted_answers: [{value: "понедельник", status: "correct"}]
    feedback: "понедельник (\"Monday\") is the first day named in the recording."
  ru.a1.unit04.lesson01.exercise04.match_days:
    instruction: "Match each Russian day of the week to its English meaning."
    accepted_answers:
      - value:
          - {left: "понедельник", right: "Monday"}
          - {left: "вторник", right: "Tuesday"}
          - {left: "среда", right: "Wednesday"}
          - {left: "четверг", right: "Thursday"}
          - {left: "пятница", right: "Friday"}
          - {left: "суббота", right: "Saturday"}
          - {left: "воскресенье", right: "Sunday"}
        status: "correct"
    feedback: "понедельник=Monday through воскресенье=Sunday, in order."
  ru.a1.unit04.lesson01.exercise05.order_today_friday:
    instruction: "Put the words in the correct order to say \"Today is Friday.\""
    accepted_answers:
      - {value: ["Сегодня", "пятница"], status: "correct"}
    feedback: "The correct order is Сегодня пятница."
  ru.a1.unit04.lesson01.exercise06.listen_order_today_saturday:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Сегодня", "суббота"], status: "correct"}
    feedback: "The correct order is Сегодня суббота (\"Today is Saturday\")."
  ru.a1.unit04.lesson01.exercise07.complete_day:
    instruction: "Complete the reply: Какой сегодня день? -- ___ среда. (today)"
    accepted_answers:
      - {value: "Сегодня", status: "correct"}
      - {value: "Сегодня среда", status: "correct"}
    feedback: "Сегодня means \"today.\""
  ru.a1.unit04.lesson01.exercise08.write_today:
    instruction: "Write a sentence saying today is Sunday, using \"Сегодня ...\"."
    accepted_answers:
      - {value: "Сегодня воскресенье.", status: "correct"}
      - {value: "Сегодня воскресенье", status: "correct"}
    feedback: "Сегодня воскресенье means \"Today is Sunday.\""

  ru.a1.unit04.lesson02.exercise01.recognize_desyatoe:
    instruction: "Which ordinal is this? (used for a date)"
    correct_option: "десятое"
    distractors: ["первое", "третье", "пятое"]
    accepted_answers: [{value: "десятое", status: "correct"}]
    feedback: "десятое means \"10th.\""
  ru.a1.unit04.lesson02.exercise02.recognize_aprelya:
    instruction: "Which word means \"of April\"? (used after a date)"
    correct_option: "апреля"
    distractors: ["января", "октября", "пятое"]
    accepted_answers: [{value: "апреля", status: "correct"}]
    feedback: "апреля is the genitive form of апрель, used after a date."
  ru.a1.unit04.lesson02.exercise03.listen_select_date:
    instruction: "Listen to the recording. Which date is stated?"
    correct_option: "Сегодня десятое апреля."
    distractors: ["Сегодня третье января.", "Сегодня пятое октября.", "Сегодня первое января."]
    accepted_answers: [{value: "Сегодня десятое апреля.", status: "correct"}]
    feedback: "The recording says Сегодня десятое апреля (\"Today is April 10th\")."
  ru.a1.unit04.lesson02.exercise04.match_ordinals:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "первое", right: "1st"}
          - {left: "третье", right: "3rd"}
          - {left: "пятое", right: "5th"}
          - {left: "десятое", right: "10th"}
          - {left: "января", right: "of January"}
          - {left: "апреля", right: "of April"}
          - {left: "октября", right: "of October"}
        status: "correct"
    feedback: "первое=1st, третье=3rd, пятое=5th, десятое=10th; января/апреля/октября name the month after a date."
  ru.a1.unit04.lesson02.exercise05.order_fifth_october:
    instruction: "Put the words in the correct order to say \"Today is October 5th.\""
    accepted_answers:
      - {value: ["Сегодня", "пятое", "октября"], status: "correct"}
    feedback: "The correct order is Сегодня пятое октября."
  ru.a1.unit04.lesson02.exercise06.listen_order_third_january:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Сегодня", "третье", "января"], status: "correct"}
    feedback: "The correct order is Сегодня третье января (\"Today is January 3rd\")."
  ru.a1.unit04.lesson02.exercise07.complete_date:
    instruction: "Complete the sentence: Сегодня ___ апреля. (10th)"
    accepted_answers:
      - {value: "десятое", status: "correct"}
      - {value: "Сегодня десятое апреля", status: "correct"}
    feedback: "десятое means \"10th.\""
  ru.a1.unit04.lesson02.exercise08.write_date:
    instruction: "Write today's date as January 1st, using \"Сегодня ...\"."
    accepted_answers:
      - {value: "Сегодня первое января.", status: "correct"}
      - {value: "Сегодня первое января", status: "correct"}
    feedback: "Сегодня первое января means \"Today is January 1st.\""

  ru.a1.unit04.lesson03.exercise01.choose_ask_day:
    instruction: "You want to ask what day of the week it is today. Which question do you use?"
    correct_option: "Какой сегодня день?"
    distractors: ["Сколько это стоит?", "Как вас зовут?", "Который час?"]
    accepted_answers: [{value: "Какой сегодня день?", status: "correct"}]
    feedback: "Какой сегодня день? means \"What day is it today?\""
  ru.a1.unit04.lesson03.exercise02.listen_select_meeting:
    instruction: "Listen and select the day and date the meeting is on."
    correct_option: "Встреча во вторник, девятого января."
    distractors: ["Встреча в среду, пятого октября.", "Встреча в четверг, третьего апреля.", "Встреча в субботу, десятого октября."]
    accepted_answers: [{value: "Встреча во вторник, девятого января.", status: "correct"}]
    feedback: "The recording says Встреча во вторник, девятого января (\"The meeting is on Tuesday, January 9th\")."
  ru.a1.unit04.lesson03.exercise03.dialogue_comprehension_meeting:
    instruction: "Listen to the dialogue. What day and date is today, and what day and date is the meeting?"
    correct_option: "Today: Wednesday, January 3rd. Meeting: Tuesday, January 9th."
    distractors: ["Today: Tuesday, January 9th. Meeting: Wednesday, January 3rd.", "Today: Wednesday, January 9th. Meeting: Tuesday, January 3rd.", "Today: Tuesday, January 3rd. Meeting: Wednesday, January 9th."]
    accepted_answers: [{value: "Today: Wednesday, January 3rd. Meeting: Tuesday, January 9th.", status: "correct"}]
    feedback: "Viktor says today is среда, третье января; the meeting is во вторник, девятого января."
  ru.a1.unit04.lesson03.exercise04.match_day_date:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "среда, третье января", right: "Wednesday, January 3rd"}
          - {left: "вторник, девятого января", right: "Tuesday, January 9th"}
          - {left: "среда", right: "Wednesday"}
          - {left: "вторник", right: "Tuesday"}
          - {left: "третье", right: "3rd"}
          - {left: "января", right: "of January"}
        status: "correct"
    feedback: "среда, третье января=Wednesday, January 3rd; вторник, девятого января=Tuesday, January 9th."
  ru.a1.unit04.lesson03.exercise05.order_meeting_tuesday:
    instruction: "Put the words in the correct order to say \"The meeting is on Tuesday.\""
    accepted_answers:
      - {value: ["Встреча", "во", "вторник"], status: "correct"}
    feedback: "The correct order is Встреча во вторник."
  ru.a1.unit04.lesson03.exercise06.listen_type_meeting_question:
    instruction: "Listen and type the question you hear."
    accepted_answers:
      - {value: "Какое сегодня число?", status: "correct"}
      - {value: "Какое сегодня число", status: "correct"}
    feedback: "Какое сегодня число? means \"What is today's date?\""
  ru.a1.unit04.lesson03.exercise07.reply_ask_day:
    instruction: "Someone asks \"Какой сегодня день?\" Reply that today is Wednesday, January 3rd."
    accepted_answers:
      - {value: "Сегодня среда, третье января.", status: "correct"}
      - {value: "Сегодня среда, третье января", status: "correct"}
    feedback: "Сегодня среда, третье января means \"Today is Wednesday, January 3rd.\""
  ru.a1.unit04.lesson03.exercise08.complete_meeting_date:
    instruction: "Complete the sentence: Встреча во вторник, ___ января. (9th)"
    accepted_answers:
      - {value: "девятого", status: "correct"}
      - {value: "Встреча во вторник, девятого января", status: "correct"}
    feedback: "девятого means \"9th\" (genitive ordinal, used before the month)."
  ru.a1.unit04.lesson03.exercise09.write_arrange_meeting:
    instruction: "Write a short exchange arranging a meeting: state the day and a date in a month."
    accepted_answers:
      - {value: "Какой сегодня день? Сегодня среда, третье января. Встреча во вторник, девятого января.", status: "correct"}
      - {value: "Встреча во вторник, девятого января.", status: "correct"}
    feedback: "A natural arrangement states the day and date together, e.g. Встреча во вторник, девятого января."
