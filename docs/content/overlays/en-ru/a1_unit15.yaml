review: {status: "reviewed", required_next_reviewer: "none", notes: "Fresh-context review 2026-07-12: matching_pairs mirror reviewed realization pairs exactly; listen_select comprehension options and dialogue_comprehension have exactly one correct answer, distractors plausible-but-wrong; gendered past (byl/byla, hodil/hodila) and dative nravitsya/comparative glosses case-correct; no bare-boolean/jargon footguns; en-ru 15-unit compile 0 errors. No defects."}

course:
  title: "Russian A1"
  description: "Learn A1-level Russian for proposing, accepting, declining, and scheduling a simple near-future plan, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit15.comparisons: {title: "Coffee is better than tea"}

lessons:
  ru.a1.unit15.lesson01.luchshe_huzhe: {title: "Better and worse"}
  ru.a1.unit15.lesson02.bolshe_menshe: {title: "Bigger and smaller"}
  ru.a1.unit15.lesson03.kakoye_kafe_luchshe: {title: "Dialogue: which cafe is better?"}

teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay: {title: "Кофе лучше, чем чай.", gloss: "Coffee is better than tea.", note: "лучше (\"better\") plus чем (\"than\") forms the basic comparative."}
  ru.a1.unit15.lesson01.teach.huzhe: {title: "хуже", gloss: "worse", note: "хуже (\"worse\") is the opposite comparative of лучше, used the same way with чем.", example_gloss: "Tea is worse than coffee."}
  ru.a1.unit15.lesson01.teach.kakoy: {title: "какой / какое", gloss: "which / what kind of", note: "какой (masculine) and какое (neuter) ask which one of two things, agreeing in gender with the noun.", example_gloss: "Which coffee is better?"}

  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe: {title: "Это кафе больше, чем то.", gloss: "This cafe is bigger than that one.", note: "больше (\"bigger/more\") plus чем forms a size comparative; это/то (\"this/that\") point out the two cafes."}
  ru.a1.unit15.lesson02.teach.menshe: {title: "меньше", gloss: "smaller / less", note: "меньше (\"smaller/less\") is the opposite comparative of больше.", example_gloss: "That cafe is smaller than this one."}
  ru.a1.unit15.lesson02.teach.dom: {title: "дом", gloss: "house", note: "дом (\"house\") plus этот/тот (\"this/that\") lets you compare the size of two houses.", example_gloss: "This house is bigger than that one."}

  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe: {title: "Nastya asks which cafe is better", gloss: "Nastya: Which cafe is better?", note: "Настя opens with Какое кафе лучше?"}
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe: {title: "Dima answers", gloss: "Dima: This cafe is better than that one.", note: "Дима answers Это кафе лучше, чем то."}
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe: {title: "Nastya asks about size, Dima confirms", gloss: "Nastya: And is this cafe bigger? Dima: Yes, this cafe is bigger than that one.", note: "Настя asks А это кафе больше?, and Дима confirms Да, это кафе больше, чем то."}

exercises:
  ru.a1.unit15.lesson01.luchshe_huzhe.exercise09.dictation_kofe_luchshe_chem_chay_neutral:
    instruction: "Type what you hear."
    correct_option: "Кофе лучше, чем чай"
    accepted_answers: [{value: "Кофе лучше, чем чай", status: correct}]
    orthography_strict: true

  ru.a1.unit15.lesson01.exercise01.recognize_luchshe:
    instruction: "Which word means \"better\"?"
    correct_option: "лучше"
    distractors: ["хуже", "какой", "чем"]
    accepted_answers: [{value: "лучше", status: "correct"}]
    feedback: "лучше means \"better.\""
  ru.a1.unit15.lesson01.exercise02.recognize_huzhe:
    instruction: "Which word means \"worse\"?"
    correct_option: "хуже"
    distractors: ["лучше", "какой", "чем"]
    accepted_answers: [{value: "хуже", status: "correct"}]
    feedback: "хуже means \"worse.\""
  ru.a1.unit15.lesson01.exercise03.listen_select_kofe_luchshe:
    instruction: "Listen to the recording. Which drink does the speaker say is better?"
    correct_option: "Coffee"
    distractors: ["Tea", "Juice", "Neither"]
    accepted_answers: [{value: "Coffee", status: "correct"}]
    feedback: "The recording says Кофе лучше, чем чай. (\"Coffee is better than tea.\")"
  ru.a1.unit15.lesson01.exercise04.match_comparison_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "лучше", right: "better"}
          - {left: "хуже", right: "worse"}
          - {left: "чем", right: "than"}
          - {left: "какой", right: "which/what kind of"}
          - {left: "кофе", right: "coffee"}
          - {left: "чай", right: "tea"}
          - {left: "Кофе лучше, чем чай.", right: "Coffee is better than tea."}
          - {left: "Чай хуже, чем кофе.", right: "Tea is worse than coffee."}
        status: "correct"
    feedback: "лучше=better, хуже=worse, чем=than, какой=which/what kind of, кофе=coffee, чай=tea."
  ru.a1.unit15.lesson01.exercise05.order_kofe_luchshe_chem_chay:
    instruction: "Put the words in the correct order to say \"Coffee is better than tea.\""
    accepted_answers:
      - {value: ["Кофе", "лучше", "чем", "чай"], status: "correct"}
    feedback: "The correct order is Кофе лучше, чем чай."
  ru.a1.unit15.lesson01.exercise06.listen_order_kofe_luchshe:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Кофе", "лучше", "чем", "чай"], status: "correct"}
    feedback: "The correct order is Кофе лучше, чем чай (\"Coffee is better than tea\")."
  ru.a1.unit15.lesson01.exercise07.complete_chay_huzhe:
    instruction: "Complete the sentence: Чай ___, чем кофе. (worse)"
    accepted_answers:
      - {value: "хуже", status: "correct"}
      - {value: "Чай хуже чем кофе", status: "correct"}
    feedback: "хуже means \"worse.\""
  ru.a1.unit15.lesson01.exercise08.write_a_comparison:
    instruction: "Write a sentence comparing coffee and tea, using \"лучше, чем\"."
    accepted_answers:
      - {value: "Кофе лучше, чем чай.", status: "correct"}
      - {value: "Кофе лучше чем чай", status: "correct"}
    feedback: "Кофе лучше, чем чай. means \"Coffee is better than tea.\""

  ru.a1.unit15.lesson02.exercise01.recognize_bolshe:
    instruction: "Which word means \"bigger / more\"?"
    correct_option: "больше"
    distractors: ["меньше", "лучше", "хуже"]
    accepted_answers: [{value: "больше", status: "correct"}]
    feedback: "больше means \"bigger / more.\""
  ru.a1.unit15.lesson02.exercise02.recognize_menshe:
    instruction: "Which word means \"smaller / less\"?"
    correct_option: "меньше"
    distractors: ["больше", "лучше", "хуже"]
    accepted_answers: [{value: "меньше", status: "correct"}]
    feedback: "меньше means \"smaller / less.\""
  ru.a1.unit15.lesson02.exercise03.listen_select_eto_kafe_bolshe:
    instruction: "Listen to the recording. Which cafe does the speaker say is bigger?"
    correct_option: "This cafe"
    distractors: ["That cafe", "Neither", "Both are the same size"]
    accepted_answers: [{value: "This cafe", status: "correct"}]
    feedback: "The recording says Это кафе больше, чем то. (\"This cafe is bigger than that one.\")"
  ru.a1.unit15.lesson02.exercise04.match_size_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "больше", right: "bigger / more"}
          - {left: "меньше", right: "smaller / less"}
          - {left: "это кафе", right: "this cafe"}
          - {left: "то кафе", right: "that cafe"}
          - {left: "этот дом", right: "this house"}
          - {left: "лучше", right: "better"}
          - {left: "хуже", right: "worse"}
          - {left: "Это кафе больше, чем то.", right: "This cafe is bigger than that one."}
        status: "correct"
    feedback: "больше=bigger/more, меньше=smaller/less, это кафе=this cafe, то кафе=that cafe, этот дом=this house."
  ru.a1.unit15.lesson02.exercise05.order_eto_kafe_bolshe_chem_to:
    instruction: "Put the words in the correct order to say \"This cafe is bigger than that one.\""
    accepted_answers:
      - {value: ["Это", "кафе", "больше", "чем", "то"], status: "correct"}
    feedback: "The correct order is Это кафе больше, чем то."
  ru.a1.unit15.lesson02.exercise06.listen_order_etot_dom_bolshe:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Это", "кафе", "больше", "чем", "то"], status: "correct"}
    feedback: "The correct order is Это кафе больше, чем то (\"This cafe is bigger than that one\")."
  ru.a1.unit15.lesson02.exercise07.complete_to_kafe_menshe:
    instruction: "Complete the sentence: То кафе ___, чем это. (smaller)"
    accepted_answers:
      - {value: "меньше", status: "correct"}
      - {value: "То кафе меньше чем это", status: "correct"}
    feedback: "меньше means \"smaller.\""
  ru.a1.unit15.lesson02.exercise08.write_size_comparison:
    instruction: "Write a sentence comparing the size of two familiar things, using \"больше, чем\" or \"меньше, чем\"."
    accepted_answers:
      - {value: "Этот дом больше, чем тот.", status: "correct"}
      - {value: "Этот дом больше чем тот", status: "correct"}
    feedback: "Этот дом больше, чем тот. means \"This house is bigger than that one.\""

  ru.a1.unit15.lesson03.exercise01.choose_ask_which_better:
    instruction: "You want to ask which cafe is better. What do you say?"
    correct_option: "Какое кафе лучше?"
    distractors: ["Это кафе больше, чем то.", "Кофе лучше, чем чай.", "То кафе меньше, чем это."]
    accepted_answers: [{value: "Какое кафе лучше?", status: "correct"}]
    feedback: "Какое кафе лучше? means \"Which cafe is better?\""
  ru.a1.unit15.lesson03.exercise02.listen_select_kakoye_kafe_luchshe:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "Which cafe is better?"
    distractors: ["Which cafe is bigger?", "Is coffee better than tea?", "Which house is bigger?"]
    accepted_answers: [{value: "Which cafe is better?", status: "correct"}]
    feedback: "The recording says Какое кафе лучше? (\"Which cafe is better?\")"
  ru.a1.unit15.lesson03.exercise03.dialogue_comprehension_kakoye_kafe_luchshe:
    instruction: "Listen to the dialogue. Which cafe is better, and which is bigger?"
    correct_option: "This cafe is better, and this cafe is also bigger"
    distractors: ["That cafe is better, and this cafe is bigger", "This cafe is better, but that cafe is bigger", "Both cafes are the same"]
    accepted_answers: [{value: "This cafe is better, and this cafe is also bigger", status: "correct"}]
    feedback: "Дима says Это кафе лучше, чем то. and Да, это кафе больше, чем то."
  ru.a1.unit15.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Какое кафе лучше?", right: "Which cafe is better?"}
          - {left: "Это кафе лучше, чем то.", right: "This cafe is better than that one."}
          - {left: "А это кафе больше?", right: "And is this cafe bigger?"}
          - {left: "Да, это кафе больше, чем то.", right: "Yes, this cafe is bigger than that one."}
          - {left: "лучше", right: "better"}
          - {left: "больше", right: "bigger / more"}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange comparing two cafes."
  ru.a1.unit15.lesson03.exercise05.order_eto_kafe_luchshe_chem_to:
    instruction: "Put the words in the correct order to say \"This cafe is better than that one.\""
    accepted_answers:
      - {value: ["Это", "кафе", "лучше", "чем", "то"], status: "correct"}
    feedback: "The correct order is Это кафе лучше, чем то."
  ru.a1.unit15.lesson03.exercise06.reply_kakoye_kafe_luchshe:
    instruction: "Someone asks \"Какое кафе лучше?\" Reply that this cafe is better than that one."
    accepted_answers:
      - {value: "Это кафе лучше, чем то.", status: "correct"}
      - {value: "Это кафе лучше чем то", status: "correct"}
    feedback: "Это кафе лучше, чем то. means \"This cafe is better than that one.\""
  ru.a1.unit15.lesson03.exercise07.complete_eto_kafe_bolshe:
    instruction: "Complete the sentence: Это кафе ___, чем то. (bigger)"
    accepted_answers:
      - {value: "больше", status: "correct"}
      - {value: "Это кафе больше чем то", status: "correct"}
    feedback: "больше means \"bigger.\""
  ru.a1.unit15.lesson03.exercise08.write_cafe_comparison:
    instruction: "Write two sentences comparing two cafes: which is better and which is bigger."
    accepted_answers:
      - {value: "Это кафе лучше, чем то. Это кафе больше, чем то.", status: "correct"}
      - {value: "Это кафе лучше чем то это кафе больше чем то", status: "correct"}
    feedback: "This combines a quality comparison and a size comparison."
