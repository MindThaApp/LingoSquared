    accepted_answers:
      - {value: "В каком-то смысле фильм медленный", status: "correct"}
      - {value: "В каком-то смысле фильм медленный.", status: "correct"}
    feedback: "В каком-то смысле фильм медленный means in a sense, the film is slow."
  ru.b2.unit03.lesson02.exercise06.translate_kak_mne_kazhetsya:
    instruction: "Translate into Russian, using как мне кажется: As it seems to me, the film is a bit dragged out."
    accepted_answers:
      - {value: "Как мне кажется, фильм немного затянутый", status: "correct"}
      - {value: "Как мне кажется, фильм немного затянутый.", status: "correct"}
    feedback: "Как мне кажется, фильм немного затянутый means as it seems to me, the film is a bit dragged out."
  ru.b2.unit03.lesson02.exercise07.write_claim:
    instruction: "Write in Russian: The ending, as it seems to me, is a bit predictable."
    accepted_answers:
      - {value: "Концовка, как мне кажется, немного предсказуема", status: "correct"}
