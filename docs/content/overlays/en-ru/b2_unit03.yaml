review:
  status: "unreviewed"
  required_next_reviewer: >-
    Fresh-context review needed (DRAFT). Confirm the English glosses match
    idiomatic Russian, that the hedge-vs-emphasis ordering reads
    correctly, and that the culminating "same claim twice" exercise
    (lesson06 exercise05/06) keeps identical propositional content between
    the hedged and emphatic versions. See the realization file's review
    block for the full priority list.
  notes: >-
    Overlay for ru's third B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "quite" is ambiguous between "rather" (British, a hedge) and
    "very" (American, closer to emphasis) -- *довольно* is unambiguously a
    hedge, glossed precisely; (2) *именно* has no single-word English
    equivalent -- it is glossed as "exactly / precisely" and taught
    explicitly as a focus particle that precedes the word it puts weight
    on, not as a stray intensifier; (3) the instrumental-predicate
    construction in "делает фильм хорошим" (literally "makes the film
    good-INSTRUMENTAL") has no analogous case marking in English -- noted
    in lesson04. No sibling-direction file (ru-en b2) was consulted.

course:
  title: Russian B2
  description: >-
    Upper-intermediate Russian: express nuance by softening or
    strengthening a statement -- hedges (мне кажется, что; вроде бы;
    довольно; немного; в каком-то смысле; как мне кажется), emphasis
    (действительно; совершенно; безусловно), and the focus particle именно
    -- so the same content can be delivered tentatively, neutrally, or
    emphatically, around two friends' opinions of a film they watched.

units:
  ru.b2.unit03.njuansy:
    title: "Nuance"
    description: Soften or strengthen a statement -- hedging, qualification, emphasis, and focus -- so the same content can be delivered tentatively, neutrally, or emphatically.

lessons:
  ru.b2.unit03.lesson01.smyagchit_mnenie:
    title: "Softening an opinion"
  ru.b2.unit03.lesson02.ostorozhnye_formulirovki:
    title: "More tentative framing"
  ru.b2.unit03.lesson03.usilenie_i_akcent:
    title: "Emphasis and degree"
  ru.b2.unit03.lesson04.fokus_imenno:
    title: "Focus: именно"
  ru.b2.unit03.lesson05.retsenzija:
    title: "Reading a review"
  ru.b2.unit03.lesson06.mnenija_v_razgovore:
    title: "Opinions in a conversation"

teaching:
  ru.b2.unit03.lesson01.teach.film:
    title: film
    gloss: "film / movie"
    example_gloss: "We watched a new film."
  ru.b2.unit03.lesson01.teach.mne_kazhetsya_chto:
    title: "it seems to me that..."
    gloss: "it seems to me that..."
    note: "*Мне кажется, что...* is the everyday, neutral way to hedge an opinion."
  ru.b2.unit03.lesson01.teach.vrode_by:
    title: "kind of / sort of"
    gloss: "kind of / sort of"
    note: "*Вроде бы* is a light, conversational hedge -- softer and less formal than *мне кажется*."
    example_gloss: "The weather is kind of improving."
  ru.b2.unit03.lesson01.teach.dovolno:
    title: "quite / rather"
    gloss: "quite / rather (a hedge, not an intensifier)"
    note: "*Довольно* moderates a claim -- it is unambiguously a softener in Russian, unlike English 'quite', which can go either way."
    example_gloss: "That's quite interesting."
  ru.b2.unit03.lesson01.teach.nemnogo:
    title: "a bit"
    gloss: "a bit / a little"
    example_gloss: "I'm a bit tired."
  ru.b2.unit03.lesson01.teach.neplohoy:
    title: "not bad / pretty good"
    gloss: "not bad / pretty good"
    note: "*Неплохой* -- literally 'not bad' -- is a mildly positive, hedged way to praise something."
    example_gloss: "We have a pretty good plan."
  ru.b2.unit03.lesson01.teach.dlinnyy:
    title: long
    gloss: long
    example_gloss: "This film is quite long."
  ru.b2.unit03.lesson01.teach.claim_model:
    title: "It seems to me that the film is quite good."
    gloss: "It seems to me that the film is quite good."
  ru.b2.unit03.lesson01.teach.grammar_smyagchenie:
    title: "It seems to me that... kind of... quite... a bit... -- all of these words soften an opinion."
    gloss: "It seems to me that... kind of... quite... a bit... -- all of these words soften an opinion."
    note: "Softening an opinion means presenting it as tentative rather than a flat assertion. All of this lesson's words do that, at slightly different strengths."

  ru.b2.unit03.lesson02.teach.v_kakom_to_smysle:
    title: "in a sense"
    gloss: "in a sense"
    note: "*В каком-то смысле* qualifies a claim as true only from a particular angle -- more tentative than *довольно* or *немного*."
  ru.b2.unit03.lesson02.teach.kak_mne_kazhetsya:
    title: "as it seems to me"
    gloss: "as it seems to me"
    note: "*Как мне кажется* can be inserted mid-sentence (set off by commas), unlike *мне кажется, что*, which opens the sentence."
  ru.b2.unit03.lesson02.teach.medlennyy:
    title: slow
    gloss: slow
    example_gloss: "At the start the film is quite slow."
  ru.b2.unit03.lesson02.teach.zatyanutyy:
    title: "dragged out"
    gloss: "dragged out / overlong in places"
    example_gloss: "The film is a bit dragged out."
  ru.b2.unit03.lesson02.teach.kontsovka:
    title: "the ending"
    gloss: "the ending"
    example_gloss: "I liked the ending a lot."
  ru.b2.unit03.lesson02.teach.predskazuema:
    title: predictable
    gloss: "predictable (feminine, agreeing with концовка)"
    example_gloss: "This ending isn't predictable at all."
  ru.b2.unit03.lesson02.teach.muzyka:
    title: music
    gloss: music
    example_gloss: "This film has great music."
  ru.b2.unit03.lesson02.teach.claim_model:
    title: "The ending, as it seems to me, is a bit predictable."
    gloss: "The ending, as it seems to me, is a bit predictable."
  ru.b2.unit03.lesson02.teach.grammar_ostorozhnost:
    title: "In a sense and as it seems to me phrase an opinion even more tentatively than kind of and quite."
    gloss: "In a sense and as it seems to me phrase an opinion even more tentatively than kind of and quite."
    note: "These are more deliberate, considered hedges than lesson01's -- useful when you want to sound thoughtful rather than casually unsure."

  ru.b2.unit03.lesson03.teach.deystvitelno:
    title: "really / indeed"
    gloss: "really / indeed"
    note: "*Действительно* confirms a claim is genuinely true -- the core emphasis word of this lesson."
    example_gloss: "He's really busy."
  ru.b2.unit03.lesson03.teach.sovershenno:
    title: "absolutely for sure"
    gloss: "absolutely / completely (совершенно точно = absolutely for sure)"
    note: "*Совершенно* on its own means 'absolutely / completely'; paired with *точно* ('for sure'), *совершенно точно* is the everyday collocation for confirming a claim with full confidence."
    example_gloss: "Absolutely, this is the best option."
  ru.b2.unit03.lesson03.teach.bezuslovno:
    title: undoubtedly
    gloss: undoubtedly
    example_gloss: "Undoubtedly, this is important."
  ru.b2.unit03.lesson03.teach.potryasajushchaya:
    title: "amazing / stunning"
    gloss: "amazing / stunning (feminine, agreeing with музыка)"
    example_gloss: "This music is simply amazing."
  ru.b2.unit03.lesson03.teach.luchshiy:
    title: best
    gloss: best
    example_gloss: "This is the best option."
  ru.b2.unit03.lesson03.teach.claim_model:
    title: "The music is really amazing. This is, undoubtedly, the best film."
    gloss: "The music is really amazing. This is, undoubtedly, the best film."
  ru.b2.unit03.lesson03.teach.grammar_usilenie:
    title: "Really, absolutely, and undoubtedly strengthen an opinion. Kind of, quite, and a bit soften it."
    gloss: "Really, absolutely, and undoubtedly strengthen an opinion. Kind of, quite, and a bit soften it."
    note: "The direct opposite pole from lesson01/02's hedges -- the same claim, delivered with confidence instead of tentativeness."

  ru.b2.unit03.lesson04.teach.imenno:
    title: "exactly / precisely"
    gloss: "exactly / precisely"
    note: "*Именно* is a focus particle: it goes right before the word or phrase it puts weight on, marking that thing (and not something else) as the point."
    example_gloss: "That's exactly what I wanted."
  ru.b2.unit03.lesson04.teach.delaet_horoshim:
    title: "makes the film good"
    gloss: "makes the film good"
    note: "*Делает фильм хорошим* -- Russian marks the resulting quality with the instrumental case (*хорошим*, not *хороший*) after *делает X Y*."
  ru.b2.unit03.lesson04.teach.claim_model:
    title: "It's the music that makes the film good."
    gloss: "It's the music that makes the film good."
    note: "*Именно музыка...* -- fronting *именно* + the focused noun is how Russian expresses an English it-cleft ('it's X that...') without needing a separate clause structure."
  ru.b2.unit03.lesson04.teach.vsem_ponravilsya:
    title: "everyone liked the film"
    gloss: "everyone liked the film"
    note: "*Понравился* (liked, masculine past, agreeing with *фильм*) + *всем* (to everyone, dative)."
  ru.b2.unit03.lesson04.teach.imenno_iz_za_kontsovki:
    title: "It's because of the ending that everyone liked the film."
    gloss: "It's because of the ending that everyone liked the film."
  ru.b2.unit03.lesson04.teach.vot_chto_ya_imeju_v_vidu:
    title: "That's what I mean."
    gloss: "That's what I mean."
  ru.b2.unit03.lesson04.teach.imenno_v_etom_i_problema:
    title: "That's exactly the problem."
    gloss: "That's exactly the problem."
    note: "*И* here is emphatic ('precisely this'), not the conjunction 'and'."
  ru.b2.unit03.lesson04.teach.grammar_fokus:
    title: "Именно before a word puts the focus on it: exactly the music (not something else) makes the film good."
    gloss: "Именно before a word puts the focus on it: exactly the music (not something else) makes the film good."
    note: "This is the closest Russian gets to an English cleft sentence ('it's X that...') -- *именно* fronts whatever answers the implicit question 'what exactly?'."

  ru.b2.unit03.lesson05.teach.tekst:
    title: "Reading: a film review, hedged and emphatic"
    gloss: "Yesterday we watched this film. It seems to me that it's quite good, although the ending, as it seems to me, is a bit predictable. The music is really amazing -- it's the music that makes the film special. This is, undoubtedly, the best film of this year, although the plot is kind of a bit dragged out in the middle."
    glosses:
      Вчера: yesterday
      посмотрели: "watched (we watched, from посмотреть)"
      он: "it (referring to the masculine noun фильм)"
      особенным: "special (instrumental, after делает)"
      сюжет: "the plot"
      середине: "the middle (в середине = in the middle)"
      этого: "this (genitive, этого года = of this year)"
      года: "year (genitive)"

  ru.b2.unit03.lesson06.teach.po_tvoemu:
    title: "And in your opinion?"
    gloss: "And in your opinion?"
    note: "*По-твоему* is the informal-*ты* counterpart of *по-моему* -- asking someone directly for their opinion."
  ru.b2.unit03.lesson06.teach.kakaya:
    title: "what kind (feminine)"
    gloss: "what kind / how (feminine, agreeing with музыка)"
    example_gloss: "What's the music like in this film?"
  ru.b2.unit03.lesson06.teach.horoshaya:
    title: "good (feminine)"
    gloss: "good (feminine, agreeing with музыка)"
    example_gloss: "The music here is quite good."
  ru.b2.unit03.lesson06.teach.dialogue_nastya_hedge:
    title: "Nastya: It seems to me that the film is quite good."
    gloss: "Nastya: It seems to me that the film is quite good."
  ru.b2.unit03.lesson06.teach.dialogue_dima_ask:
    title: "Dima: And in your opinion, what's the music like?"
    gloss: "Dima: And in your opinion, what's the music like?"
  ru.b2.unit03.lesson06.teach.dialogue_nastya_emphasize:
    title: "Nastya: In my opinion, the music is really amazing. This is undoubtedly the best film."
    gloss: "Nastya: In my opinion, the music is really amazing. This is undoubtedly the best film."
  ru.b2.unit03.lesson06.teach.dialogue_dima_agree:
    title: "Dima: Yes, I agree: it's the music that makes this film special."
    gloss: "Dima: Yes, I agree: it's the music that makes this film special."
  ru.b2.unit03.lesson06.teach.grammar_modulyacija:
    title: "It seems to me that the music is quite good -- soft. The music is really amazing -- strong. One and the same opinion, different force."
    gloss: "It seems to me that the music is quite good -- soft. The music is really amazing -- strong. One and the same opinion, different force."
    note: "The same underlying opinion about the music, delivered twice at two different strengths -- this is exactly what you produce in this lesson's speaking and writing tasks."

