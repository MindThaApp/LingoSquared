    instruction: "Listen and select what you hear."
    correct_option: "It seems to me that the film is quite good."
    distractors: ["It seems to me that the film is quite bad.", "It seems to me that the film is really good.", "I know that the film is quite good."]
    accepted_answers: [{value: "It seems to me that the film is quite good.", status: "correct"}]
