    feedback: "Концовка, как мне кажется, немного предсказуема means the ending, as it seems to me, is a bit predictable."
  ru.b2.unit03.lesson02.exercise08.dictation_kontsovka:
    instruction: "Type what you hear."
    correct_response: "Концовка, как мне кажется, немного предсказуема."
    orthography_strict: true
    feedback: "You heard Концовка, как мне кажется, немного предсказуема — the ending, as it seems to me, is a bit predictable."

  ru.b2.unit03.lesson03.exercise01.recognize_deystvitelno:
    instruction: "What does this word mean?"
    correct_option: "really / indeed"
    distractors: ["kind of", "quite", "a bit"]
    accepted_answers: [{value: "really / indeed", status: "correct"}]
    feedback: "Действительно means really / indeed -- it strengthens a claim."
  ru.b2.unit03.lesson03.exercise02.listen_potryasajushchaya:
    instruction: "Listen and select what you hear."
    correct_option: "The music is really amazing."
    distractors: ["The music is kind of amazing.", "The music is really bad.", "The film is really amazing."]
    accepted_answers: [{value: "The music is really amazing.", status: "correct"}]
