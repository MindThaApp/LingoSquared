    feedback: "Мне кажется, что фильм довольно неплохой means it seems to me that the film is quite good."
  ru.b2.unit03.lesson01.exercise08.dictation_claim:
    instruction: "Type what you hear."
    correct_response: "Мне кажется, что фильм довольно неплохой."
