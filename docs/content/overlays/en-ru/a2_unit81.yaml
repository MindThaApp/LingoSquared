course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Say what you do things for, with чтобы and для."
units:
  ru.a2.unit81.zachem_chtoby: {"title": "What for? In order to", "description": "Say why you do things with зачем, чтобы, чтобы не and для."}
lessons:
  ru.a2.unit81.lesson01.zachem: {"title": "What for? In order to"}
  ru.a2.unit81.lesson02.chtoby_ne: {"title": "So as not to"}
  ru.a2.unit81.lesson03.dlya: {"title": "For whom, for what"}
  ru.a2.unit81.lesson04.kuda: {"title": "What are you going for"}
  ru.a2.unit81.lesson05.plany: {"title": "Nastya's plans"}
  ru.a2.unit81.lesson06.dialog: {"title": "Why get up early"}
teaching:
  ru.a2.unit81.lesson01.teach.zachem: {"title": "What for and in order to", "gloss": "what for / in order to / to buy / bread / gets up / early", "note": "*Зачем* asks about the aim: 'what for'. The answer is *чтобы* plus an infinitive.", "example_gloss": ["What are you going to the shop for?", "I am going to the shop to buy bread.", "Dima gets up early to run.", "Nastya learns words to read books."]}
  ru.a2.unit81.lesson01.teach.gn_zachem: {"title": "Question and answer", "gloss": "What are you going to the shop for? To buy bread.", "note": "*Зачем* asks for the aim. The answer begins with *чтобы* and an infinitive: *чтобы купить*."}
  ru.a2.unit81.lesson01.teach.gn_chtoby: {"title": "чтобы + infinitive", "gloss": "I am going to the shop to buy bread. Dima gets up early to run.", "note": "Put a comma before *чтобы*. The person who goes is the person who buys, so the verb after *чтобы* is an infinitive. A single result takes a perfective infinitive (*купить*), a repeated activity an imperfective one (*бегать*)."}
  ru.a2.unit81.lesson02.teach.ne: {"title": "So as not to", "gloss": "not to forget / not to be late / not to sleep / list / alarm clock / writes / I set", "note": "*Чтобы не* is followed by an infinitive and means 'so as not to'.", "example_gloss": ["We drink coffee so as not to sleep.", "Dima writes a list so as not to forget.", "Nastya sets an alarm so as not to be late.", "I set an alarm so as not to be late."]}
  ru.a2.unit81.lesson02.teach.gn_ne: {"title": "чтобы не + infinitive", "gloss": "We drink coffee so as not to sleep. Dima writes a list so as not to forget.", "note": "*Не* stands right after *чтобы* and before the infinitive: *чтобы не забыть, чтобы не опоздать*."}
  ru.a2.unit81.lesson02.teach.gn_vs: {"title": "Почему or зачем", "gloss": "Why are you drinking coffee? Because I am thirsty. What are you drinking coffee for? So as not to sleep.", "note": "*Почему* asks for a cause and is answered by *потому что*. *Зачем* asks for an aim and is answered by *чтобы*."}
  ru.a2.unit81.lesson03.teach.dlya: {"title": "For", "gloss": "for / present / friend / for a friend / for Nastya / for Dima / for dinner / for work / I buy", "note": "*Для* means 'for'. The word after it takes a special form: *Настя - для Насти*, *Дима - для Димы*, *друг - для друга*.", "example_gloss": ["This is a present for Nastya.", "This is a letter for Dima.", "Dima buys coffee for work.", "I am buying bread for dinner."]}
  ru.a2.unit81.lesson03.teach.gn_dlya: {"title": "для + name or noun", "gloss": "This is a present for Nastya. This is a present for Dima. This is a present for a friend.", "note": "After *для* the noun changes its ending: *Настя - Насти*, *Дима - Димы*, *друг - друга*. Learn these as chunks."}
  ru.a2.unit81.lesson03.teach.gn_dlya_chtoby: {"title": "Noun or verb", "gloss": "What do you buy coffee for? For work. What are you buying coffee for? To work.", "note": "Use *для* + noun (*для работы*) or *чтобы* + verb (*чтобы работать*). Both answer the aim."}
  ru.a2.unit81.lesson04.teach.kuda: {"title": "Places and aims", "gloss": "to the post office / to the pharmacy / to the bank / to send / medicine / to open an account", "note": "With *идти* the place takes *в* or *на* and a special form: *в аптеку, в банк, на почту*.", "example_gloss": ["What is Dima going to the post office for?", "To send a letter.", "Nastya is going to the pharmacy to buy medicine.", "What are you going to the bank for? (formal)", "To open an account."]}
  ru.a2.unit81.lesson04.teach.gn_idti: {"title": "Going somewhere for a reason", "gloss": "What are you going to the post office for? To send a letter.", "note": "Name the place after *идти* (*на почту, в аптеку, в банк*) and give the aim with *чтобы* + infinitive."}
  ru.a2.unit81.lesson04.teach.gn_vy: {"title": "Asking politely", "gloss": "What are you going to the bank for? To open an account.", "note": "With *вы* (polite or plural) the verb is *идёте*; with *ты* it is *идёшь*."}
  ru.a2.unit81.lesson05.teach.v5: {"title": "Words for the message", "gloss": "tomorrow / call! / present / in the evening / I get up", "note": "*Позвони* is the ты-command 'call'.", "example_gloss": ["Tomorrow I get up early.", "Call me in the evening!", "This is a present for a friend."]}
  ru.a2.unit81.lesson05.teach.reading: {"title": "Nastya writes to Dima", "gloss": "Hi, Dima! Tomorrow I get up early so as not to be late. I am going to the shop to buy a present for a friend. Then I am going to the post office to send a letter. Call me in the evening! Nastya", "note": "The text uses чтобы, чтобы не and для.", "glosses": {"позвони": "call (to a friend)", "мне": "me"}}
  ru.a2.unit81.lesson06.teach.q: {"title": "Dima asks what for", "gloss": "Дима: Nastya, what are you getting up early tomorrow for?"}
  ru.a2.unit81.lesson06.teach.a: {"title": "Nastya explains", "gloss": "Настя: So as not to be late. I am going to the shop to buy a present for a friend."}
  ru.a2.unit81.lesson06.teach.q2: {"title": "Dima asks about the post office", "gloss": "Дима: And what are you going to the post office for?"}
  ru.a2.unit81.lesson06.teach.a2: {"title": "Nastya answers", "gloss": "Настя: To send a letter."}
  ru.a2.unit81.lesson06.teach.end: {"title": "Dima asks for a call", "gloss": "Дима: Good! Call me in the evening."}
  ru.a2.unit81.lesson06.teach.end2: {"title": "Nastya promises", "gloss": "Настя: I will call!"}
exercises:
  ru.a2.unit81.lesson01.exercise01.bread: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Я иду в магазин, чтобы купить хлеб.", "distractors": ["Я иду в магазин, потому что купить хлеб.", "Я иду в магазин, чтобы купил хлеб.", "Я иду в магазин, поэтому купить хлеб."], "accepted_answers": [{"value": "Я иду в магазин, чтобы купить хлеб.", "status": "correct"}], "feedback": "*Чтобы* + infinitive expresses the aim."}
  ru.a2.unit81.lesson01.exercise02.run: {"instruction": "Choose the correct English meaning.", "correct_option": "Dima gets up early to run.", "distractors": ["Dima gets up early and does not run.", "Dima runs, so he gets up early.", "Dima runs early in the morning."], "accepted_answers": [{"value": "Dima gets up early to run.", "status": "correct"}], "feedback": "*Чтобы бегать* = in order to run."}
  ru.a2.unit81.lesson01.exercise03.w1: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "зачем", "right": "what for"}, {"left": "чтобы", "right": "in order to"}, {"left": "купить", "right": "to buy"}, {"left": "встаёт", "right": "gets up"}, {"left": "рано", "right": "early"}, {"left": "бегать", "right": "to run"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit81.lesson01.exercise04.run: {"instruction": "Put the words in order to say 'Dima gets up early to run.'", "correct_option": "Дима встаёт рано чтобы бегать", "accepted_answers": [{"value": "Дима встаёт рано чтобы бегать", "status": "correct"}], "feedback": "Comma before *чтобы*."}
  ru.a2.unit81.lesson01.exercise05.chtoby: {"instruction": "Complete the sentence: 'I am going to the shop to buy bread.'", "correct_option": "чтобы", "accepted_answers": [{"value": "чтобы", "status": "correct"}], "feedback": "The aim is introduced by *чтобы*."}
  ru.a2.unit81.lesson01.exercise06.shop: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Зачем ты идёшь в магазин? Чтобы купить хлеб.", "status": "correct"}, {"value": "Зачем ты идёшь в магазин? Чтобы купить хлеб", "status": "correct"}], "feedback": "*Зачем* asks, *чтобы* answers."}
  ru.a2.unit81.lesson01.exercise07.dima: {"instruction": "Write the requested Russian sentence.", "correct_option": "Дима встаёт рано, чтобы бегать.", "accepted_answers": [{"value": "Дима встаёт рано, чтобы бегать.", "status": "correct"}, {"value": "Дима встаёт рано, чтобы бегать", "status": "correct"}], "feedback": "*Чтобы* + infinitive."}
  ru.a2.unit81.lesson02.exercise01.coffee: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы пьём кофе, чтобы не спать.", "distractors": ["Мы пьём кофе, чтобы спать.", "Мы не пьём кофе, чтобы спать.", "Мы пьём кофе, потому что не спать."], "accepted_answers": [{"value": "Мы пьём кофе, чтобы не спать.", "status": "correct"}], "feedback": "*Чтобы не спать* = so as not to sleep."}
  ru.a2.unit81.lesson02.exercise02.alarm: {"instruction": "Choose the correct English meaning.", "correct_option": "Nastya sets an alarm so as not to be late.", "distractors": ["Nastya sets an alarm because she was late.", "Nastya sets an alarm to be late.", "Nastya is not setting an alarm."], "accepted_answers": [{"value": "Nastya sets an alarm so as not to be late.", "status": "correct"}], "feedback": "*Чтобы не опоздать* = so as not to be late."}
  ru.a2.unit81.lesson02.exercise03.w2: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "не забыть", "right": "not to forget"}, {"left": "не опоздать", "right": "not to be late"}, {"left": "не спать", "right": "not to sleep"}, {"left": "список", "right": "list"}, {"left": "будильник", "right": "alarm clock"}, {"left": "пишет", "right": "writes"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit81.lesson02.exercise04.list: {"instruction": "Put the words in order to say 'Dima writes a list so as not to forget.'", "correct_option": "Дима пишет список чтобы не забыть", "accepted_answers": [{"value": "Дима пишет список чтобы не забыть", "status": "correct"}], "feedback": "*Не* stands before the infinitive."}
  ru.a2.unit81.lesson02.exercise05.ne: {"instruction": "Complete the sentence: 'Nastya sets an alarm so as not to be late.'", "correct_option": "не", "accepted_answers": [{"value": "не", "status": "correct"}], "feedback": "*Чтобы не опоздать*."}
  ru.a2.unit81.lesson02.exercise06.list: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Дима пишет список, чтобы не забыть.", "status": "correct"}, {"value": "Дима пишет список, чтобы не забыть", "status": "correct"}], "feedback": "*Чтобы не забыть*."}
  ru.a2.unit81.lesson02.exercise07.alarm2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Я ставлю будильник, чтобы не опоздать.", "accepted_answers": [{"value": "Я ставлю будильник, чтобы не опоздать.", "status": "correct"}, {"value": "Я ставлю будильник, чтобы не опоздать", "status": "correct"}], "feedback": "*Я ставлю*, *чтобы не опоздать*."}
  ru.a2.unit81.lesson03.exercise01.nastya: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Это подарок для Насти.", "distractors": ["Это подарок для Настя.", "Это подарок для Настю.", "Это подарок чтобы Насти."], "accepted_answers": [{"value": "Это подарок для Насти.", "status": "correct"}], "feedback": "After *для*: *Насти*."}
  ru.a2.unit81.lesson03.exercise02.work: {"instruction": "Choose the correct English meaning.", "correct_option": "Dima buys coffee for work.", "distractors": ["Dima buys coffee at work.", "Dima does not buy coffee for work.", "Dima drinks coffee after work."], "accepted_answers": [{"value": "Dima buys coffee for work.", "status": "correct"}], "feedback": "*Для работы* = for work."}
  ru.a2.unit81.lesson03.exercise03.w3: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "для", "right": "for"}, {"left": "подарок", "right": "present"}, {"left": "друг", "right": "friend"}, {"left": "для друга", "right": "for a friend"}, {"left": "для Насти", "right": "for Nastya"}, {"left": "для ужина", "right": "for dinner"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit81.lesson03.exercise04.gift: {"instruction": "Put the words in order to say 'This is a present for a friend.'", "correct_option": "Это подарок для друга", "accepted_answers": [{"value": "Это подарок для друга", "status": "correct"}], "feedback": "*Для друга* = for a friend."}
  ru.a2.unit81.lesson03.exercise05.dlya: {"instruction": "Complete the sentence: 'This is a present for a friend.'", "correct_option": "для", "accepted_answers": [{"value": "для", "status": "correct"}], "feedback": "*Для* + *друга*."}
  ru.a2.unit81.lesson03.exercise06.bread: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я покупаю хлеб для ужина.", "status": "correct"}, {"value": "Я покупаю хлеб для ужина", "status": "correct"}], "feedback": "*Для ужина* = for dinner."}
  ru.a2.unit81.lesson03.exercise07.dima: {"instruction": "Write the requested Russian sentence.", "correct_option": "Это подарок для Димы.", "accepted_answers": [{"value": "Это подарок для Димы.", "status": "correct"}, {"value": "Это подарок для Димы", "status": "correct"}], "feedback": "After *для*, *Дима* becomes *Димы*."}
  ru.a2.unit81.lesson04.exercise01.post: {"instruction": "Choose the correct answer.", "correct_option": "Чтобы отправить письмо.", "distractors": ["Потому что отправить письмо.", "Для отправить письмо.", "Поэтому он идёт на почту."], "accepted_answers": [{"value": "Чтобы отправить письмо.", "status": "correct"}], "feedback": "*Зачем* is answered by *чтобы* + infinitive."}
  ru.a2.unit81.lesson04.exercise02.apt: {"instruction": "Choose the correct Russian question.", "correct_option": "Зачем ты идёшь в аптеку?", "distractors": ["Зачем ты идёшь аптеку?", "Зачем ты идёт в аптеку?", "Где ты идёшь в аптеку?"], "accepted_answers": [{"value": "Зачем ты идёшь в аптеку?", "status": "correct"}], "feedback": "*Ты идёшь в аптеку*."}
  ru.a2.unit81.lesson04.exercise03.w4: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "на почту", "right": "to the post office"}, {"left": "в аптеку", "right": "to the pharmacy"}, {"left": "в банк", "right": "to the bank"}, {"left": "отправить", "right": "to send"}, {"left": "лекарство", "right": "medicine"}, {"left": "открыть счёт", "right": "to open an account"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit81.lesson04.exercise04.vy: {"instruction": "Put the words in order to ask 'What are you going to the bank for?' (to a stranger)", "correct_option": "Зачем вы идёте в банк", "accepted_answers": [{"value": "Зачем вы идёте в банк", "status": "correct"}], "feedback": "*Вы идёте*."}
  ru.a2.unit81.lesson04.exercise05.na: {"instruction": "Complete the sentence: 'What is Dima going to the post office for?'", "correct_option": "на", "accepted_answers": [{"value": "на", "status": "correct"}], "feedback": "*На почту*."}
  ru.a2.unit81.lesson04.exercise06.apt: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я иду в аптеку, чтобы купить лекарство.", "status": "correct"}, {"value": "Я иду в аптеку, чтобы купить лекарство", "status": "correct"}], "feedback": "*Чтобы купить лекарство*."}
  ru.a2.unit81.lesson04.exercise07.post2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Настя идёт на почту, чтобы отправить письмо.", "accepted_answers": [{"value": "Настя идёт на почту, чтобы отправить письмо.", "status": "correct"}, {"value": "Настя идёт на почту, чтобы отправить письмо", "status": "correct"}], "feedback": "*Идёт на почту, чтобы отправить*."}
  ru.a2.unit81.lesson05.exercise01.r1: {"instruction": "Read the text and choose the answer.", "correct_option": "To buy a present for a friend.", "distractors": ["To buy bread.", "To send a letter.", "To meet Dima."], "accepted_answers": [{"value": "To buy a present for a friend.", "status": "correct"}], "feedback": "*Я иду в магазин, чтобы купить подарок для друга.*"}
  ru.a2.unit81.lesson05.exercise02.r2: {"instruction": "Read the text and choose the answer.", "correct_option": "So as not to be late.", "distractors": ["To run.", "To call Dima.", "To buy medicine."], "accepted_answers": [{"value": "So as not to be late.", "status": "correct"}], "feedback": "*Завтра я встаю рано, чтобы не опоздать.*"}
  ru.a2.unit81.lesson05.exercise03.m5: {"instruction": "Match each sentence from the message to its English meaning.", "accepted_answers": [{"value": [{"left": "Завтра я встаю рано.", "right": "Tomorrow I get up early."}, {"left": "Чтобы не опоздать.", "right": "So as not to be late."}, {"left": "Я иду в магазин.", "right": "I am going to the shop."}, {"left": "Подарок для друга.", "right": "A present for a friend."}, {"left": "Я иду на почту.", "right": "I am going to the post office."}, {"left": "Позвони мне вечером!", "right": "Call me in the evening!"}], "status": "correct"}], "feedback": "All lines are from Nastya's message."}
  ru.a2.unit81.lesson05.exercise04.o5: {"instruction": "Put the words in order to say 'I am going to the post office to send a letter.' (Nastya is speaking)", "correct_option": "Я иду на почту чтобы отправить письмо", "accepted_answers": [{"value": "Я иду на почту чтобы отправить письмо", "status": "correct"}], "feedback": "*Чтобы* + infinitive."}
  ru.a2.unit81.lesson05.exercise05.t5: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я иду в магазин, чтобы купить подарок.", "status": "correct"}, {"value": "Я иду в магазин, чтобы купить подарок", "status": "correct"}], "feedback": "*Чтобы купить подарок*."}
  ru.a2.unit81.lesson05.exercise06.d1: {"instruction": "Type what you hear.", "correct_response": "Завтра я встаю рано, чтобы не опоздать.", "orthography_strict": true, "feedback": "You heard *Завтра я встаю рано, чтобы не опоздать.*"}
  ru.a2.unit81.lesson05.exercise07.d2: {"instruction": "Type what you hear.", "correct_response": "Позвони мне вечером!", "orthography_strict": true, "feedback": "You heard *Позвони мне вечером!*"}
  ru.a2.unit81.lesson06.exercise01.l1: {"instruction": "Listen and select Dima's opening question.", "correct_option": "Настя, зачем ты завтра встаёшь рано?", "distractors": ["Настя, почему ты завтра встаёшь рано?", "Дима, зачем ты завтра встаёшь рано?", "Настя, зачем ты вчера вставала рано?"], "accepted_answers": [{"value": "Настя, зачем ты завтра встаёшь рано?", "status": "correct"}], "feedback": "Dima opens with *Настя, зачем ты завтра встаёшь рано?*"}
  ru.a2.unit81.lesson06.exercise02.c1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "To send a letter.", "distractors": ["To buy medicine.", "To open an account.", "To call Dima."], "accepted_answers": [{"value": "To send a letter.", "status": "correct"}], "feedback": "Nastya says: *Чтобы отправить письмо.*"}
  ru.a2.unit81.lesson06.exercise03.m6: {"instruction": "Match each line from the dialogue to its English meaning.", "accepted_answers": [{"value": [{"left": "Зачем ты завтра встаёшь рано?", "right": "What are you getting up early tomorrow for?"}, {"left": "Чтобы не опоздать.", "right": "So as not to be late."}, {"left": "Я иду в магазин, чтобы купить подарок.", "right": "I am going to the shop to buy a present."}, {"left": "А зачем ты идёшь на почту?", "right": "And what are you going to the post office for?"}, {"left": "Чтобы отправить письмо.", "right": "To send a letter."}, {"left": "Позвоню!", "right": "I will call!"}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
  ru.a2.unit81.lesson06.exercise04.o6: {"instruction": "Put the words in order to say 'I am going to the shop to buy a present for a friend.'", "correct_option": "Я иду в магазин чтобы купить подарок для друга", "accepted_answers": [{"value": "Я иду в магазин чтобы купить подарок для друга", "status": "correct"}], "feedback": "*Чтобы* + infinitive, *для друга*."}
