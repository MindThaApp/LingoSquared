schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.a2.unit27"
source_language: "en"
target_language: "ru"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "codex", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Codex-authored draft. Needs fresh-context review."}

course:
  title: "Russian A2"
  description: "Learn A2-level Russian for opening a bank account."

units:
  ru.a2.unit27.bank: {title: "Open an account"}

lessons:
  ru.a2.unit27.lesson01.schet: {title: "I want to open an account"}
  ru.a2.unit27.lesson02.trebovaniya: {title: "Passport and address"}
  ru.a2.unit27.lesson03.v_banke: {title: "Dialogue: at the bank"}

teaching:
  ru.a2.unit27.lesson01.teach.otkryt_schet: {title: "Я хочу открыть счёт.", gloss: "I want to open an account.", note: "*открыть счёт* is the standard phrase for opening an account.", example_gloss: "I want to open an account at the bank."}
  ru.a2.unit27.lesson01.teach.bank: {title: "банк", gloss: "bank", note: "*в банке* is the prepositional form used for \"at the bank.\"", example_gloss: "The bank is near the office."}
  ru.a2.unit27.lesson01.teach.sotrudnik_banka: {title: "сотрудник банка", gloss: "bank employee", note: "*банка* is genitive: employee of the bank.", example_gloss: "The bank employee helps."}
  ru.a2.unit27.lesson02.teach.nomer_telefona: {title: "номер телефона", gloss: "phone number", note: "*телефона* is genitive: number of the phone.", example_gloss: "A phone number is needed."}
  ru.a2.unit27.lesson02.teach.obsluzhivanie: {title: "обслуживание", gloss: "service / maintenance", note: "For cards and accounts, *обслуживание* means account/card service.", example_gloss: "Card service is free."}
  ru.a2.unit27.lesson02.teach.besplatnoe: {title: "бесплатное", gloss: "free of charge", note: "*бесплатное* agrees with neuter *обслуживание*.", example_gloss: "Service is free of charge."}
  ru.a2.unit27.lesson03.teach.dima_open: {title: "Dima requests an account", gloss: "Dima: Hello. I want to open an account.", note: "The bank exchange uses formal service register."}
  ru.a2.unit27.lesson03.teach.employee_pasport: {title: "The employee asks for basics", gloss: "Bank employee: Of course. Do you have a passport and address?", note: "*У вас есть...?* is formal and practical."}
  ru.a2.unit27.lesson03.teach.dima_adres: {title: "Dima answers", gloss: "Dima: Yes, I have a passport. The address is new.", note: "He answers the identity and address question."}
  ru.a2.unit27.lesson03.teach.employee_nomer: {title: "The employee adds requirements", gloss: "Bank employee: A phone number and application form are needed.", note: "This lists the extra required information."}
  ru.a2.unit27.lesson03.teach.dima_card: {title: "Dima asks about the card", gloss: "Dima: Please tell me, will the card be free of charge?", note: "This is the clarifying question about an account feature."}
  ru.a2.unit27.lesson03.teach.employee_free: {title: "The employee confirms the feature", gloss: "Bank employee: Yes, card service is free of charge.", note: "The answer gives a basic account feature."}

exercises:
  ru.a2.unit27.lesson01.exercise01.recognize_schet: {instruction: "Which word means \"account\"?", correct_option: "счёт", distractors: ["банк", "карта", "адрес"], accepted_answers: [{value: "счёт", status: "correct"}], feedback: "*счёт* means \"account.\""}
  ru.a2.unit27.lesson01.exercise02.recognize_otkryt: {instruction: "Which word means \"to open\"?", correct_option: "открыть", distractors: ["нужен", "будет", "есть"], accepted_answers: [{value: "открыть", status: "correct"}], feedback: "*открыть* means \"to open.\""}
  ru.a2.unit27.lesson01.exercise03.listen_select_hochu_schet: {instruction: "Listen. What does the customer want?", correct_option: "To open an account.", distractors: ["To close a card.", "To change cash.", "To get a receipt."], accepted_answers: [{value: "To open an account.", status: "correct"}], feedback: "The recording says *Я хочу открыть счёт*."}
  ru.a2.unit27.lesson01.exercise04.match_bank_basics:
    instruction: "Match each bank word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "открыть счёт", right: "open an account"}
          - {left: "банк", right: "bank"}
          - {left: "в банке", right: "at/in the bank"}
          - {left: "сотрудник банка", right: "bank employee"}
          - {left: "карта", right: "card"}
          - {left: "паспорт", right: "passport"}
        status: "correct"
    feedback: "These are the basic bank-account words."
  ru.a2.unit27.lesson01.exercise05.order_otkryt_schet: {instruction: "Put the words in order to say \"I want to open an account.\"", accepted_answers: [{value: ["Я", "хочу", "открыть", "счёт"], status: "correct"}], feedback: "The correct order is *Я хочу открыть счёт*."}
  ru.a2.unit27.lesson01.exercise06.write_account_request:
    instruction: "Write a formal bank opening: Hello. I want to open an account."
    accepted_answers:
      - {value: "Здравствуйте. Я хочу открыть счёт.", status: "correct"}
      - {value: "Здравствуйте, я хочу открыть счёт.", status: "correct"}
      - {value: "Здравствуйте я хочу открыть счёт", status: "correct"}
    feedback: "The model answer is *Здравствуйте. Я хочу открыть счёт*."
  ru.a2.unit27.lesson02.exercise01.recognize_nomer: {instruction: "Which phrase means \"phone number\"?", correct_option: "номер телефона", distractors: ["обслуживание", "адрес", "заявление"], accepted_answers: [{value: "номер телефона", status: "correct"}], feedback: "*номер телефона* means \"phone number.\""}
  ru.a2.unit27.lesson02.exercise02.recognize_besplatnoe: {instruction: "Which word means \"free of charge\"?", correct_option: "бесплатное", distractors: ["новый", "нужен", "конечно"], accepted_answers: [{value: "бесплатное", status: "correct"}], feedback: "*бесплатное* means \"free of charge.\""}
  ru.a2.unit27.lesson02.exercise03.listen_select_pasport_adres: {instruction: "Listen. What information or document is needed?", correct_option: "Passport and address.", distractors: ["Phone number only.", "Card and receipt.", "Rental contract."], accepted_answers: [{value: "Passport and address.", status: "correct"}], feedback: "The recording says *Нужен паспорт и адрес*."}
  ru.a2.unit27.lesson02.exercise04.match_requirements:
    instruction: "Match each bank requirement or feature to its meaning."
    accepted_answers:
      - value:
          - {left: "номер телефона", right: "phone number"}
          - {left: "обслуживание", right: "service/maintenance"}
          - {left: "бесплатное", right: "free of charge"}
          - {left: "адрес", right: "address"}
          - {left: "заявление", right: "application form"}
          - {left: "паспорт", right: "passport"}
        status: "correct"
    feedback: "These are common requirements and features."
  ru.a2.unit27.lesson02.exercise05.order_nuzhen_nomer: {instruction: "Put the words in order to say \"A phone number is needed.\"", accepted_answers: [{value: ["Нужен", "номер", "телефона"], status: "correct"}], feedback: "The correct order is *Нужен номер телефона*."}
  ru.a2.unit27.lesson02.exercise06.write_card_question:
    instruction: "Write a formal question asking whether the card will be free of charge."
    accepted_answers:
      - {value: "Скажите, пожалуйста, карта будет бесплатной?", status: "correct"}
      - {value: "Скажите пожалуйста карта будет бесплатной?", status: "correct"}
    feedback: "The fuller formal model is *Скажите, пожалуйста, карта будет бесплатной?*"
  ru.a2.unit27.lesson03.exercise01.choose_open_account: {instruction: "What should Dima say to request a new bank account?", correct_option: "Я хочу открыть счёт.", distractors: ["Карта будет бесплатной?", "Нужен номер телефона.", "Адрес новый."], accepted_answers: [{value: "Я хочу открыть счёт.", status: "correct"}], feedback: "*Я хочу открыть счёт* requests the account."}
  ru.a2.unit27.lesson03.exercise02.dialogue_comprehension_bank:
    instruction: "Listen to the dialogue. What does Dima want, what is required, and what card feature does he ask about?"
    correct_option: "He wants to open an account; passport, address, phone number, and application are required; he asks if the card is free"
    distractors: ["He wants a doctor appointment; a photo is required; he asks about Friday", "He wants apartment repair; medicine is required; he asks about heating", "He wants a job interview; an insurance policy is required; he asks about school"]
    accepted_answers: [{value: "He wants to open an account; passport, address, phone number, and application are required; he asks if the card is free", status: "correct"}]
    feedback: "Dima asks to open an account, the employee asks for documents/details, and Dima asks whether the card is free."
  ru.a2.unit27.lesson03.exercise03.match_bank_dialogue:
    instruction: "Match each Russian line to its meaning."
    accepted_answers:
      - value:
          - {left: "Я хочу открыть счёт.", right: "I want to open an account."}
          - {left: "У вас есть паспорт и адрес?", right: "Do you have a passport and address?"}
          - {left: "Адрес новый.", right: "The address is new."}
          - {left: "Нужен номер телефона.", right: "A phone number is needed."}
          - {left: "Карта будет бесплатной?", right: "Will the card be free?"}
          - {left: "Обслуживание карты бесплатное.", right: "Card service is free."}
        status: "correct"
    feedback: "These lines complete a basic account-opening exchange."
  ru.a2.unit27.lesson03.exercise04.order_karta_budet: {instruction: "Put the words in order to ask \"Will the card be free?\"", accepted_answers: [{value: ["Карта", "будет", "бесплатной"], status: "correct"}], feedback: "The correct order is *Карта будет бесплатной?*"}
  ru.a2.unit27.lesson03.exercise05.reply_bank_questions:
    instruction: "The employee asks \"У вас есть паспорт и адрес?\" Answer: \"Yes, I have a passport. The address is new.\""
    accepted_answers:
      - {value: "Да, паспорт есть. Адрес новый.", status: "correct"}
      - {value: "Да паспорт есть. Адрес новый", status: "correct"}
    feedback: "The model answer is *Да, паспорт есть. Адрес новый*."
  ru.a2.unit27.lesson03.exercise06.write_bank_message:
    instruction: "Write a short formal message to a bank: say you want to open an account, say you have a passport and address, and ask whether the card will be free."
    accepted_answers:
      - {value: "Здравствуйте. Я хочу открыть счёт. У меня есть паспорт и адрес. Скажите, пожалуйста, карта будет бесплатной?", status: "correct"}
      - {value: "Здравствуйте, я хочу открыть счёт. У меня есть паспорт и адрес. Скажите, пожалуйста, карта будет бесплатной?", status: "correct"}
      - {value: "Здравствуйте. Я хочу открыть счёт. У меня есть паспорт и адрес. Скажите пожалуйста карта будет бесплатной?", status: "correct"}
    feedback: "A complete message requests the account, answers identity/address basics, and asks about the card feature."
  ru.a2.unit27.lesson03.exercise07.dictation_otkryt_schet: {correct_response: "Я хочу открыть счёт.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  ru.a2.unit27.lesson03.exercise08.dictation_pasport_adres: {correct_response: "Нужен паспорт и адрес.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
