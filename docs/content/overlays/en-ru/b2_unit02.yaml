  ru.b2.unit02.lesson01.exercise07.write_claim:
    instruction: "Write in Russian: Olya isn't here yet. She's probably stuck in traffic."
    accepted_answers:
      - {value: "Оли ещё нет. Наверное, она застряла в пробке", status: "correct"}
      - {value: "Оли ещё нет. Наверное, она застряла в пробке.", status: "correct"}
    feedback: "Оли ещё нет. Наверное, она застряла в пробке means Olya isn't here yet. She's probably stuck in traffic."
  ru.b2.unit02.lesson01.exercise08.dictation_navernoe_probka:
    instruction: "Type what you hear."
    correct_response: "Оли ещё нет. Наверное, она застряла в пробке."
    orthography_strict: true
    feedback: "You heard Оли ещё нет. Наверное, она застряла в пробке — Olya isn't here yet. She's probably stuck in traffic."

  ru.b2.unit02.lesson02.exercise01.recognize_znachit:
    instruction: "What does this word mean?"
    correct_option: "so / that means"
    distractors: ["because", "apparently", "in short"]
    accepted_answers: [{value: "so / that means", status: "correct"}]
    feedback: "Значит draws a conclusion from evidence -- a light deduction marker."
  ru.b2.unit02.lesson02.exercise02.listen_dolzhno_byt_probka:
    instruction: "Listen and select what you hear."
    correct_option: "She must be running late because of a traffic jam."
