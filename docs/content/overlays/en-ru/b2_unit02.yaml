  ru.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "потому что", right: "because"}
          - {left: "значит", right: "so / that means"}
          - {left: "судя по всему", right: "apparently / by all appearances"}
          - {left: "опаздывает", right: "is running late"}
