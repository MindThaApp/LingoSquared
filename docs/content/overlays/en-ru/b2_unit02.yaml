    accepted_answers: [{value: "Maybe it's just a traffic jam, or maybe something happened.", status: "correct"}]
    feedback: "Может быть, это просто пробка, а может быть, что-то случилось means maybe it's just a traffic jam, or maybe something happened."
  ru.b2.unit02.lesson03.exercise03.match_dogadka_words:
    instruction: "Match each word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "догадка", right: "a guess"}
          - {left: "дедукция", right: "a deduction"}
          - {left: "я не уверен, но...", right: "I'm not sure, but..."}
          - {left: "судя по тому, что...", right: "judging by the fact that..."}
