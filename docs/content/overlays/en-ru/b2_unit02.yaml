  ru.b2.unit02.lesson02.exercise04.order_dolzhno_byt:
    instruction: "Put the words in order to say \"She must be running late because of a traffic jam.\""
    accepted_answers:
      - {value: ["Должно", "быть", "она", "опаздывает", "из-за", "пробки"], status: "correct"}
    feedback: "Должно быть, она опаздывает из-за пробки means she must be running late because of a traffic jam."
  ru.b2.unit02.lesson02.exercise05.translate_znachit:
    instruction: "Translate into Russian: Apparently, the roads are very busy."
    accepted_answers:
      - {value: "Судя по всему, дороги очень заняты", status: "correct"}
      - {value: "Судя по всему, дороги очень заняты.", status: "correct"}
    feedback: "Судя по всему, дороги очень заняты means apparently, the roads are very busy."
  ru.b2.unit02.lesson02.exercise06.translate_potomu_chto:
    instruction: "Translate into Russian, using потому что: She is running late because the roads are busy."
    accepted_answers:
      - {value: "Она опаздывает, потому что дороги заняты", status: "correct"}
