    feedback: "Она опаздывает, потому что дороги заняты means she is running late because the roads are busy."
  ru.b2.unit02.lesson02.exercise07.write_dolzhno_byt:
    instruction: "Write in Russian, using должно быть: She must be running late because of a traffic jam."
    accepted_answers:
      - {value: "Должно быть, она опаздывает из-за пробки", status: "correct"}
      - {value: "Должно быть, она опаздывает из-за пробки.", status: "correct"}
    feedback: "Должно быть, она опаздывает из-за пробки means she must be running late because of a traffic jam."
  ru.b2.unit02.lesson02.exercise08.dictation_dolzhno_byt_probka:
    instruction: "Type what you hear."
    correct_response: "Должно быть, она опаздывает из-за пробки."
    orthography_strict: true
    feedback: "You heard Должно быть, она опаздывает из-за пробки — she must be running late because of a traffic jam."

  ru.b2.unit02.lesson03.exercise01.recognize_dedukcija:
    instruction: "What does this word mean?"
    correct_option: "a deduction"
    distractors: ["a guess", "a fact", "a question"]
    accepted_answers: [{value: "a deduction", status: "correct"}]
    feedback: "Дедукция means a deduction -- a conclusion reasoned from evidence."
  ru.b2.unit02.lesson03.exercise02.listen_mozhet_byt_ili_znachit:
    instruction: "Listen and select what you hear."
    correct_option: "Maybe it's just a traffic jam, or maybe something happened."
