  ru.b2.unit02.lesson01.exercise04.order_claim:
    instruction: "Put the words in order to say \"She's probably stuck in traffic.\""
    accepted_answers:
      - {value: ["Наверное", "она", "застряла", "в", "пробке"], status: "correct"}
    feedback: "Наверное, она застряла в пробке means she's probably stuck in traffic."
  ru.b2.unit02.lesson01.exercise05.translate_vozmozhno:
    instruction: "Translate into Russian: Possibly, she got stuck in traffic."
    accepted_answers:
      - {value: "Возможно, она застряла в пробке", status: "correct"}
      - {value: "Возможно, она застряла в пробке.", status: "correct"}
    feedback: "Возможно, она застряла в пробке means possibly, she got stuck in traffic."
  ru.b2.unit02.lesson01.exercise06.speak_ne_mozhet_byt:
    instruction: "Say aloud in Russian: It can't be that she's stuck in traffic."
    accepted_answers:
      - {value: "Не может быть, что она застряла", status: "correct"}
