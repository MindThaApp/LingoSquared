review:
  status: "unreviewed"
  required_next_reviewer: >-
    Fresh-context review needed (DRAFT). Confirm the English glosses match
    idiomatic Russian, that the certainty-scale ordering (может быть <
    возможно < наверное < должно быть < не может быть, что) reads
    correctly, and that the past-deduction accepted answers cover the
    punctuation forms a correct learner would actually produce. See the
    realization file's review block for the full priority list.
  notes: >-
    Overlay for ru's second B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "must be" covers both present deduction (должно быть, она
    опаздывает) and past deduction (должно быть, она проспала) with no
    surface change, whereas Russian keeps должно быть invariant but
    changes the following verb's tense/aspect -- flagged in lesson04; (2)
    "может быть" (a genuine guess, no evidence) and "должно быть" (a
    deduction from evidence) both often get flattened to English "maybe"
    in casual translation -- kept sharply distinct in lesson03's
    contrast; (3) "не может быть, что..." literally negates possibility
    ("it cannot be the case that...") and is stronger than English
    "probably not" -- glossed precisely. No sibling-direction file
    (ru-en b2) was consulted.

course:
  title: Russian B2
  description: >-
    Upper-intermediate Russian: speculate about causes and consequences
    with graded certainty (может быть, возможно, наверное, должно быть, не
    может быть, что), in the present and the past, and distinguish a
    deduction based on evidence from a plain guess -- around the everyday
    puzzle of a friend running late.

units:
  ru.b2.unit02.predpolozhenija:
    title: "Speculation"
    description: Speculate about causes and consequences with graded certainty -- say what may, might, must, or cannot be the case, and distinguish a deduction from a guess.

lessons:
  ru.b2.unit02.lesson01.shkala_uverennosti:
    title: "How certain are you?"
  ru.b2.unit02.lesson02.dedukcija_iz_ulik:
    title: "Deduction: drawing a conclusion from evidence"
  ru.b2.unit02.lesson03.dogadka_ili_dedukcija:
    title: "A guess or a deduction?"
  ru.b2.unit02.lesson04.predpolozhenija_o_proshlom:
    title: "Speculating about the past"
  ru.b2.unit02.lesson05.fakt_ili_predpolozhenie:
    title: "Fact or speculation?"
  ru.b2.unit02.lesson06.predpolozhenija_v_razgovore:
    title: "Speculating in a conversation"

teaching:
  ru.b2.unit02.lesson01.teach.mozhet_byt:
    title: maybe
    gloss: "maybe / perhaps"
    note: "*Может быть* is the weakest certainty level -- a plain guess with no evidence behind it."
    example_gloss: "Maybe she's running late."
  ru.b2.unit02.lesson01.teach.vozmozhno:
    title: possibly
    gloss: possibly
    note: "*Возможно* is slightly more considered than *может быть*, but still a real guess."
    example_gloss: "Possibly the bus is delayed."
  ru.b2.unit02.lesson01.teach.navernoe:
    title: probably
    gloss: probably
    note: "*Наверное* signals fairly strong confidence, short of certainty."
    example_gloss: "She probably forgot her phone."
  ru.b2.unit02.lesson01.teach.dolzhno_byt:
    title: "it must be"
    gloss: "it must be / must have"
    note: "*Должно быть* is the strongest speculation short of stated fact -- a deduction, not a guess. It stays the same regardless of tense; only the following verb changes."
  ru.b2.unit02.lesson01.teach.ne_mozhet_byt_chto:
    title: "it can't be that..."
    gloss: "it can't be that... / that can't be right"
    note: "*Не может быть, что...* rules a possibility out -- stronger than English 'probably not'."
  ru.b2.unit02.lesson01.teach.ona:
    title: "she"
    gloss: "she"
    example_gloss: "She usually arrives on time."
  ru.b2.unit02.lesson01.teach.zastryala_v_probke:
    title: "got stuck in traffic"
    gloss: "got stuck in traffic"
    note: "*Застряла* is feminine past tense (Оля is the one stuck); *в пробке* = 'in a traffic jam'."
  ru.b2.unit02.lesson01.teach.oli_eshcho_net:
    title: "Olya isn't here yet."
    gloss: "Olya isn't here yet."
    note: "*Оли ещё нет* -- Russian negates existence with the genitive: *Оли нет* = 'there is no Olya (here)'."
  ru.b2.unit02.lesson01.teach.claim_model:
    title: "Olya isn't here yet. She's probably stuck in traffic."
    gloss: "Olya isn't here yet. She's probably stuck in traffic."
    note: "The model speculation for this unit."
  ru.b2.unit02.lesson01.teach.grammar_shkala:
    title: "maybe < possibly < probably < it must be < it can't be that"
    gloss: "maybe < possibly < probably < it must be < it can't be that"
    note: "The certainty scale runs from a bare guess (*может быть*) to a confident deduction (*должно быть*) to ruling something out (*не может быть, что*). Getting the right point on this scale is the core skill of this unit."

  ru.b2.unit02.lesson02.teach.potomu_chto:
    title: because
    gloss: because
    example_gloss: "She must be late, because the road is busy."
  ru.b2.unit02.lesson02.teach.znachit:
    title: "so / that means"
    gloss: "so / that means / which means"
    note: "*Значит* draws a conclusion from evidence -- a light deduction marker."
    example_gloss: "She isn't answering, so she's driving."
  ru.b2.unit02.lesson02.teach.sudya_po_vsemu:
    title: apparently
    gloss: "apparently / by all appearances"
    note: "*Судя по всему* signals a deduction from the general situation, not a specific piece of evidence (compare *судя по тому, что...*, lesson03, which cites one specific fact)."
  ru.b2.unit02.lesson02.teach.opazdyvaet:
    title: "is running late"
    gloss: "is running late"
    example_gloss: "The bus is late every day."
  ru.b2.unit02.lesson02.teach.iz_za:
    title: "because of"
    gloss: "because of (governs the genitive)"
    example_gloss: "Being late because of the rain is common."
  ru.b2.unit02.lesson02.teach.dorogi:
    title: roads
    gloss: roads
    example_gloss: "The roads are very busy today."
  ru.b2.unit02.lesson02.teach.dolzhno_byt_opazdyvaet:
    title: "She must be running late because of a traffic jam."
    gloss: "She must be running late because of a traffic jam."
  ru.b2.unit02.lesson02.teach.grammar_dedukcija:
    title: "She must be running late because of a traffic jam. Apparently, the roads are very busy."
    gloss: "She must be running late because of a traffic jam. Apparently, the roads are very busy."
    note: "A deduction reasons from evidence to a confident conclusion. *Должно быть*, *значит*, and *судя по всему* all mark this move, unlike the bare guesses of lesson01."

  ru.b2.unit02.lesson03.teach.dogadka:
    title: "a guess"
    gloss: "a guess"
    example_gloss: "That's just a guess, not a fact."
  ru.b2.unit02.lesson03.teach.dedukcija:
    title: "a deduction"
    gloss: "a deduction"
    example_gloss: "A deduction is based on evidence."
  ru.b2.unit02.lesson03.teach.ya_ne_uveren_no:
    title: "I'm not sure, but..."
    gloss: "I'm not sure, but... (я не уверен if a man is speaking, я не уверена if a woman is speaking)"
    note: "A hedge that admits low confidence before offering a guess anyway. *Уверен* is masculine, *уверена* is feminine -- both mean 'not sure', and either is correct depending on who's speaking."
  ru.b2.unit02.lesson03.teach.sudya_po_tomu_chto:
    title: "judging by the fact that..."
    gloss: "judging by the fact that..."
    note: "*Судя по тому, что...* cites one specific piece of evidence, which is what turns a guess into a deduction."
  ru.b2.unit02.lesson03.teach.vsegda_pishet_zaranee:
    title: "always texts ahead of time"
    gloss: "always texts ahead of time"
    example_gloss: "Olya always texts ahead of time if she's running late."
  ru.b2.unit02.lesson03.teach.chto_to_sluchilos:
    title: "something happened"
    gloss: "something happened"
  ru.b2.unit02.lesson03.teach.prosto:
    title: "just / simply"
    gloss: "just / simply"
    example_gloss: "It's just a traffic jam, nothing serious."
  ru.b2.unit02.lesson03.teach.grammar_dogadka_dedukcija:
    title: "Maybe is a guess with no evidence. It must be and so are a deduction: judging by the fact that Olya always texts ahead of time, something must have happened."
    gloss: "Maybe is a guess with no evidence. It must be and so are a deduction: judging by the fact that Olya always texts ahead of time, something must have happened."
    note: "The key contrast of this lesson: a guess (*может быть*) has no cited evidence; a deduction (*должно быть*, *значит*) reasons from a specific fact, usually introduced with *судя по тому, что...*."

  ru.b2.unit02.lesson04.teach.prospala:
    title: overslept
    gloss: overslept
    note: "*Проспала* is feminine past perfective (Olya overslept, a single completed event)."
    example_gloss: "It seems she overslept today."
  ru.b2.unit02.lesson04.teach.zabyla:
    title: forgot
    gloss: forgot
    note: "*Забыла*, feminine past perfective of *забыть*."
    example_gloss: "Olya forgot her umbrella at home."
  ru.b2.unit02.lesson04.teach.ne_mogla:
    title: "couldn't have"
    gloss: "couldn't have"
    note: "*Не могла* + infinitive negates a past possibility: 'she couldn't have (done it)'."
  ru.b2.unit02.lesson04.teach.dolzhno_byt_prospala:
    title: "She must have overslept."
    gloss: "She must have overslept."
    note: "*Должно быть* stays the same for past deduction; only the following verb (*проспала*, perfective past) marks the tense."
  ru.b2.unit02.lesson04.teach.navernoe_zabyla:
    title: "She probably forgot about the meeting."
    gloss: "She probably forgot about the meeting."
  ru.b2.unit02.lesson04.teach.ne_mogla_zabyt:
    title: "She couldn't have forgotten."
    gloss: "She couldn't have forgotten."
    note: "*Не могла забыть* = 'couldn't have forgotten' -- ruling out a past cause, the past-tense counterpart of *не может быть, что*."
  ru.b2.unit02.lesson04.teach.grammar_proshloe:
    title: "She must have overslept. She probably forgot about the meeting. It can't be that she forgot -- she couldn't have forgotten."
    gloss: "She must have overslept. She probably forgot about the meeting. It can't be that she forgot -- she couldn't have forgotten."
    note: "Past speculation uses the same modal frames as present speculation (должно быть, наверное, не может быть, что), just with a past-tense verb following. *Не могла* is the natural way to rule a past cause out."

  ru.b2.unit02.lesson05.teach.tekst:
    title: "Reading: is Olya just stuck in traffic?"
    gloss: "Olya usually arrives on time, but today she isn't here yet. She's probably stuck in traffic -- the roads downtown are often busy in the mornings. Possibly she just overslept, though she rarely does that. Judging by the fact that she always texts ahead of time if she's running late, and today she hasn't written a word, something more serious must have happened. Maybe her car broke down. We don't know for sure yet -- these are only speculations."
    glosses:
      сегодня: today
      её: "her (possessive)"
      центре: "downtown / in the center"
      часто: often
      загружены: "busy / congested"
      по: "in (по утрам = in the mornings)"
      утрам: mornings
      редко: rarely
      это: "that / it"
      делает: "does (from делать)"
      написала: "wrote / texted (from написать)"
      ни: "not even (ни слова = not a word)"
      слова: "a word"
      более: more
      серьёзное: "serious (agreeing with что-то)"
      у: "at / with (у неё = she has, literally 'at her')"
      неё: "her (after a preposition)"
      сломалась: "broke down"
      машина: car
      Мы: we
      пока: "for now / yet"
      не: not
      знаем: "know (from знать)"
      точно: "for sure / exactly"
      только: only
      предположения: "speculations / assumptions"

  ru.b2.unit02.lesson06.teach.smotri:
    title: "Look, she texted!"
    gloss: "Look, she texted!"
    note: "*Смотри* is the informal imperative 'look' -- a natural way to interrupt with new information."
  ru.b2.unit02.lesson06.teach.begu:
    title: "I'm running / on my way"
    gloss: "I'm running / I'm on my way"
    note: "*Бегу* (literally 'I'm running') is the everyday way to text that you're hurrying over."
    example_gloss: "Sorry, I'm running late, I'm on my way!"
  ru.b2.unit02.lesson06.teach.dialogue_dima_claim:
    title: "Dima: Olya isn't here yet. She's probably stuck in traffic."
    gloss: "Dima: Olya isn't here yet. She's probably stuck in traffic."
  ru.b2.unit02.lesson06.teach.dialogue_nastya_guess:
    title: "Nastya: Maybe, or maybe something happened."
    gloss: "Nastya: Maybe, or maybe something happened."
  ru.b2.unit02.lesson06.teach.dialogue_dima_deduction:
    title: "Dima: Judging by the fact that she always texts ahead of time, something must have happened to her."
    gloss: "Dima: Judging by the fact that she always texts ahead of time, something must have happened to her."
  ru.b2.unit02.lesson06.teach.dialogue_nastya_reject:
    title: "Nastya: It can't be that she just forgot about the meeting."
    gloss: "Nastya: It can't be that she just forgot about the meeting."
  ru.b2.unit02.lesson06.teach.dialogue_dima_resolve:
    title: "Dima: Look, she texted: \"Overslept, on my way!\""
    gloss: "Dima: Look, she texted: \"Overslept, on my way!\""
  ru.b2.unit02.lesson06.teach.grammar_polnoe_predpolozhenie:
    title: "Maybe is a weak guess. Probably is stronger. It must be is a deduction, based on evidence."
    gloss: "Maybe is a weak guess. Probably is stronger. It must be is a deduction, based on evidence."
    note: "The full certainty scale in action across one conversation: a weak guess (*может быть*), a stronger deduction (*должно быть*, backed by evidence), and a ruled-out possibility (*не может быть, что*) -- resolved by real information arriving."

exercises:
