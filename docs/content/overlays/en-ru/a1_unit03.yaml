course:
  title: "Russian A1"
  description: "Learn A1-level Russian for everyday greetings and short social exchanges, with detailed English explanations of the Cyrillic alphabet and the вы/ты formality distinction."

units:
  ru.a1.unit03.numbers: {title: "Numbers"}

lessons:
  ru.a1.unit03.lesson01.chisla_1_5: {title: "Numbers one through five"}
  ru.a1.unit03.lesson02.chisla_6_10: {title: "Numbers six through ten"}
  ru.a1.unit03.lesson03.na_rynke: {title: "At the market: counting money"}

teaching:
  ru.a1.unit03.lesson01.teach.u_menya: {title: "У меня ...", gloss: "I have ...", note: "Literally \"at me (there is) ...\" -- the standard Russian way to say \"I have,\" not a word-for-word match of the English verb \"to have.\""}
  ru.a1.unit03.lesson01.teach.odin_dva: {title: "один, два", gloss: "one, two", note: "After два (\"two\"), the noun takes a special singular genitive form -- notice брат (\"brother\") becomes брата, not the plural you'd expect in English.", example_gloss: ["I have one brother.", "I have two brothers."]}
  ru.a1.unit03.lesson01.teach.tri_chetyre: {title: "три, четыре", gloss: "three, four", note: "Три and четыре both take the same singular genitive noun form as два -- книга (\"book\") becomes книги after any of два/три/четыре.", example_gloss: ["I have three books.", "I have four books."]}
  ru.a1.unit03.lesson01.teach.pyat: {title: "пять", gloss: "five", note: "From пять (\"five\") upward, the noun switches to the genitive plural form instead -- рубль (\"ruble\") becomes рублей, not рубли.", example_gloss: "I have five rubles."}
  ru.a1.unit03.lesson01.teach.brat_bratya: {title: "брат, брата", gloss: "brother; brothers (after 2-4)", note: "брата is the singular genitive form used specifically after два, три, and четыре -- not the regular plural.", example_gloss: "I have two brothers."}
  ru.a1.unit03.lesson01.teach.kniga_knigi: {title: "книга, книги", gloss: "book; books (after 2-4)", note: "книги is the same singular-genitive pattern as брата, used after два, три, and четыре.", example_gloss: "I have three books."}
  ru.a1.unit03.lesson01.teach.rubl_rubley: {title: "рубль, рублей", gloss: "ruble; rubles (5 and up)", note: "рублей is the genitive plural form used from пять (\"five\") upward.", example_gloss: "I have five rubles."}

  ru.a1.unit03.lesson02.teach.shest_sem: {title: "шесть, семь", gloss: "six, seven", note: "Like пять, both шесть and семь take the genitive plural noun form.", example_gloss: ["It is six o'clock.", "I have seven rubles."]}
  ru.a1.unit03.lesson02.teach.vosem_devyat: {title: "восемь, девять", gloss: "eight, nine", note: "Both continue the genitive-plural pattern: книга becomes книг, and рубль becomes рублей.", example_gloss: ["I have eight books.", "I have nine rubles."]}
  ru.a1.unit03.lesson02.teach.desyat: {title: "десять", gloss: "ten", note: "Also used in age expressions, as in Мне десять лет (\"I am ten years old\").", example_gloss: "I am ten years old."}
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural: {title: "книг", gloss: "books (genitive plural, 5 and up)", note: "The genitive plural form of книга, used from пять upward -- notice it drops the final vowel entirely, unlike книги used after два/три/четыре.", example_gloss: "I have nine books."}
  ru.a1.unit03.lesson02.teach.mne_let: {title: "Мне десять лет.", gloss: "I am ten years old.", note: "Age in Russian is expressed with the dative \"to me\" (мне) plus a number and лет (the genitive plural of \"years\"), not a verb like English \"I am.\""}
  ru.a1.unit03.lesson02.teach.skolko_vam_let: {title: "Сколько вам лет?", gloss: "How old are you? (formal)", note: "Uses the formal dative вам, matching the вы register from unit02."}

  ru.a1.unit03.lesson03.teach.skolko_stoit: {title: "Сколько это стоит?", gloss: "How much does this cost?", note: "The standard way to ask the price of a single item, using стоит (\"it costs,\" singular)."}
  ru.a1.unit03.lesson03.teach.skolko_stoyat: {title: "Сколько стоят яблоки?", gloss: "How much do the apples cost?", note: "Uses стоят (the plural form of \"cost\") because яблоки (\"apples\") is plural -- unlike the singular стоит in Сколько это стоит?"}
  ru.a1.unit03.lesson03.teach.rubley: {title: "рубль, рубля, рублей", gloss: "ruble (1); rubles (2-4); rubles (5+)", note: "The word for \"ruble\" changes form based on the number before it: рубль after one, рубля after два/три/четыре, and рублей from пять upward.", example_gloss: ["This costs one ruble.", "This costs two rubles.", "This costs five rubles."]}
  ru.a1.unit03.lesson03.teach.pokupatel_greeting: {title: "The customer greets the seller", gloss: "Customer: Hello! How much do the apples cost?", note: "A customer at a market stall opens politely with Здравствуйте before asking the price."}
  ru.a1.unit03.lesson03.teach.prodavets_apples: {title: "The seller answers", gloss: "Seller: Three rubles.", note: "Три рубля uses the 2-4 genitive singular form of \"ruble,\" matching три."}
  ru.a1.unit03.lesson03.teach.pokupatel_bread: {title: "The customer asks about bread", gloss: "Customer: And how much does the bread cost?", note: "The customer uses А (\"and\") to smoothly ask a follow-up question about a second item."}
  ru.a1.unit03.lesson03.teach.prodavets_bread: {title: "The seller answers again", gloss: "Seller: Six rubles.", note: "Шесть рублей uses the 5-and-up genitive plural form, matching шесть."}
  ru.a1.unit03.lesson03.teach.pokupatel_close: {title: "The customer closes politely", gloss: "Customer: Good, thanks!", note: "Хорошо, спасибо! closes the market exchange on a friendly note, reusing the greetings-unit vocabulary."}

exercises:
  ru.a1.unit03.lesson02.chisla_6_10.exercise09.dictation_mne_desyat_let_neutral:
    instruction: "Type what you hear."
    correct_option: "Мне десять лет"
    accepted_answers: [{value: "Мне десять лет", status: correct}]
    orthography_strict: true

  ru.a1.unit03.lesson01.exercise01.recognize_two:
    instruction: "Which number is this?"
    correct_option: "два"
    distractors: ["один", "три", "пять"]
    accepted_answers: [{value: "два", status: "correct"}]
    feedback: "два means \"two.\""
  ru.a1.unit03.lesson01.exercise02.recognize_four:
    instruction: "Which number is this?"
    correct_option: "четыре"
    distractors: ["три", "пять", "два"]
    accepted_answers: [{value: "четыре", status: "correct"}]
    feedback: "четыре means \"four.\""
  ru.a1.unit03.lesson01.exercise03.listen_select_five:
    instruction: "Listen to the recording. Which number is last?"
    correct_option: "пять"
    distractors: ["один", "три", "четыре"]
    accepted_answers: [{value: "пять", status: "correct"}]
    feedback: "пять (\"five\") is the last number in the recording."
  ru.a1.unit03.lesson01.exercise04.match_digits:
    instruction: "Match each Russian number word to its digit."
    accepted_answers:
      - value:
          - {left: "один", right: "1"}
          - {left: "два", right: "2"}
          - {left: "три", right: "3"}
          - {left: "четыре", right: "4"}
          - {left: "пять", right: "5"}
        status: "correct"
    feedback: "один=1, два=2, три=3, четыре=4, пять=5."
  ru.a1.unit03.lesson01.exercise05.order_three_books:
    instruction: "Put the words in the correct order to say \"I have three books.\""
    accepted_answers:
      - {value: ["У", "меня", "три", "книги"], status: "correct"}
    feedback: "The correct order is У меня три книги."
  ru.a1.unit03.lesson01.exercise06.listen_order_two_brothers:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["У", "меня", "два", "брата"], status: "correct"}
    feedback: "The correct order is У меня два брата (\"I have two brothers\")."
  ru.a1.unit03.lesson01.exercise07.complete_number:
    instruction: "Complete the sentence: У меня ___ рублей. (5)"
    accepted_answers:
      - {value: "пять", status: "correct"}
      - {value: "У меня пять рублей", status: "correct"}
    feedback: "пять means \"five.\""
  ru.a1.unit03.lesson01.exercise08.write_count:
    instruction: "Write a sentence saying you have four of something, using \"У меня четыре ...\"."
    accepted_answers:
      - {value: "У меня четыре книги.", status: "correct"}
      - {value: "У меня четыре брата.", status: "correct"}
    feedback: "У меня четыре ... uses the 2-4 genitive singular noun form."

  ru.a1.unit03.lesson02.exercise01.recognize_eight:
    instruction: "Which number is this?"
    correct_option: "восемь"
    distractors: ["семь", "девять", "шесть"]
    accepted_answers: [{value: "восемь", status: "correct"}]
    feedback: "восемь means \"eight.\""
  ru.a1.unit03.lesson02.exercise02.recognize_ten:
    instruction: "Which number is this?"
    correct_option: "десять"
    distractors: ["девять", "восемь", "семь"]
    accepted_answers: [{value: "десять", status: "correct"}]
    feedback: "десять means \"ten.\""
  ru.a1.unit03.lesson02.exercise03.listen_select_seven:
    instruction: "Listen to the recording. Which number is second?"
    correct_option: "семь"
    distractors: ["шесть", "восемь", "десять"]
    accepted_answers: [{value: "семь", status: "correct"}]
    feedback: "семь (\"seven\") is second in the recording, after шесть."
  ru.a1.unit03.lesson02.exercise04.match_digits_high:
    instruction: "Match each Russian number word to its digit."
    accepted_answers:
      - value:
          - {left: "один", right: "1"}
          - {left: "два", right: "2"}
          - {left: "три", right: "3"}
          - {left: "четыре", right: "4"}
          - {left: "пять", right: "5"}
          - {left: "шесть", right: "6"}
          - {left: "семь", right: "7"}
          - {left: "восемь", right: "8"}
          - {left: "девять", right: "9"}
          - {left: "десять", right: "10"}
        status: "correct"
    feedback: "один=1 through десять=10, in order."
  ru.a1.unit03.lesson02.exercise05.order_age_sentence:
    instruction: "Put the words in the correct order to say \"I am ten years old.\""
    accepted_answers:
      - {value: ["Мне", "десять", "лет"], status: "correct"}
    feedback: "The correct order is Мне десять лет."
  ru.a1.unit03.lesson02.exercise06.listen_order_nine_books:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["У", "меня", "девять", "книг"], status: "correct"}
    feedback: "The correct order is У меня девять книг (\"I have nine books\")."
  ru.a1.unit03.lesson02.exercise07.complete_age:
    instruction: "Complete the question: ___ вам лет? (How old are you? -- formal)"
    accepted_answers:
      - {value: "Сколько", status: "correct"}
      - {value: "Сколько вам лет", status: "correct"}
    feedback: "Сколько вам лет? means \"How old are you?\" (formal)."
  ru.a1.unit03.lesson02.exercise08.listen_type_age:
    instruction: "Listen and type the sentence you hear."
    accepted_answers:
      - {value: "Мне десять лет.", status: "correct"}
      - {value: "Мне десять лет", status: "correct"}
    feedback: "Мне десять лет means \"I am ten years old.\""

  ru.a1.unit03.lesson03.exercise01.choose_price_question:
    instruction: "You want to ask the price of an item at a market stall. Which question do you use?"
    correct_option: "Сколько это стоит?"
    distractors: ["Как вас зовут?", "Откуда вы?", "Сколько вам лет?"]
    accepted_answers: [{value: "Сколько это стоит?", status: "correct"}]
    feedback: "Сколько это стоит? means \"How much does this cost?\""
  ru.a1.unit03.lesson03.exercise02.listen_select_price_question:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Сколько это стоит?"
    distractors: ["Сколько вам лет?", "Как тебя зовут?", "Добрый день!"]
    accepted_answers: [{value: "Сколько это стоит?", status: "correct"}]
    feedback: "Сколько это стоит? means \"How much does this cost?\""
  ru.a1.unit03.lesson03.exercise03.dialogue_comprehension_prices:
    instruction: "Listen to the market dialogue. What do the apples and the bread cost?"
    correct_option: "Apples: 3 rubles; bread: 6 rubles"
    distractors: ["Apples: 6 rubles; bread: 3 rubles", "Apples: 5 rubles; bread: 10 rubles", "Apples: 3 rubles; bread: 3 rubles"]
    accepted_answers: [{value: "Apples: 3 rubles; bread: 6 rubles", status: "correct"}]
    feedback: "The seller says Три рубля for the apples and Шесть рублей for the bread."
  ru.a1.unit03.lesson03.exercise04.match_prices:
    instruction: "Match each price phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "один рубль", right: "1 ruble"}
          - {left: "два рубля", right: "2 rubles"}
          - {left: "пять рублей", right: "5 rubles"}
        status: "correct"
    feedback: "один рубль=1 ruble (singular), два рубля=2 rubles (2-4 form), пять рублей=5 rubles (5+ form)."
  ru.a1.unit03.lesson03.exercise05.order_price_answer:
    instruction: "Put the words in the correct order to say \"Five rubles.\""
    accepted_answers:
      - {value: ["Пять", "рублей"], status: "correct"}
    feedback: "The correct order is Пять рублей."
  ru.a1.unit03.lesson03.exercise06.listen_order_price:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Пять", "рублей"], status: "correct"}
    feedback: "The correct order is Пять рублей."
  ru.a1.unit03.lesson03.exercise07.reply_price_question:
    instruction: "Someone asks \"Сколько стоят яблоки?\" Reply that they cost three rubles."
    accepted_answers:
      - {value: "Три рубля.", status: "correct"}
      - {value: "Три рубля", status: "correct"}
    feedback: "Три рубля uses the 2-4 genitive singular form of \"ruble.\""
  ru.a1.unit03.lesson03.exercise08.complete_price:
    instruction: "Complete the reply: Сколько стоит хлеб? -- ___ рублей. (6)"
    accepted_answers:
      - {value: "Шесть", status: "correct"}
      - {value: "Шесть рублей", status: "correct"}
    feedback: "Шесть рублей means \"six rubles.\""
  ru.a1.unit03.lesson03.exercise09.write_market_exchange:
    instruction: "Write a short market exchange: ask the price of something and give an answer in rubles."
    accepted_answers:
      - {value: "Сколько это стоит? Пять рублей.", status: "correct"}
      - {value: "Сколько стоят яблоки? Три рубля.", status: "correct"}
    feedback: "A natural market exchange combines Сколько это/эти стоит/стоят? with a numbered ruble answer."
