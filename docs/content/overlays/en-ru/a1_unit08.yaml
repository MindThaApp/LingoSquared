course:
  title: "Russian A1"
  description: "Learn A1-level Russian for shopping and asking about prices and quantities, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit08.shopping: {title: "Shopping"}

lessons:
  ru.a1.unit08.lesson01.skolko_stoit: {title: "How much does it cost?"}
  ru.a1.unit08.lesson02.kolichestvo: {title: "Please give me ..."}
  ru.a1.unit08.lesson03.na_rynke: {title: "At the market"}

teaching:
  ru.a1.unit08.lesson01.teach.magazin: {title: "магазин", gloss: "store", note: "магазин is a masculine noun for a shop or store.", example_gloss: "We're going to the store."}
  ru.a1.unit08.lesson01.teach.skolko: {title: "сколько", gloss: "how much", note: "сколько asks about quantity or price and is often paired with стоит.", example_gloss: "How much does the bread cost?"}
  ru.a1.unit08.lesson01.teach.stoit: {title: "стоит", gloss: "costs", note: "стоит is the third-person singular of стоить (\"to cost\"), used with a singular subject like хлеб.", example_gloss: "The bread costs one hundred rubles."}
  ru.a1.unit08.lesson01.teach.rubl: {title: "рубль", gloss: "ruble", note: "рубль is the Russian currency; сто (\"one hundred\") triggers the genitive plural рублей.", example_gloss: "The bread costs one hundred rubles."}
  ru.a1.unit08.lesson01.teach.khleb_moloko: {title: "хлеб, молоко", gloss: "bread, milk", note: "хлеб is masculine and молоко is neuter -- both common everyday grocery items.", example_gloss: ["How much does the bread cost?", "How much does the milk cost?"]}

  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta: {title: "Дайте, пожалуйста, ...", gloss: "Please give me ...", note: "Дайте is the formal/plural imperative of дать (\"to give\"), used with вы."}
  ru.a1.unit08.lesson02.teach.kilogramm: {title: "килограмм", gloss: "kilogram", note: "килограмм is the standard unit for buying produce or bread by weight.", example_gloss: "Please give me a kilogram."}
  ru.a1.unit08.lesson02.teach.polkilo: {title: "полкило", gloss: "half a kilo", note: "полкило is a compound of пол- (\"half\") and кило (an informal short form of килограмм).", example_gloss: "Please give me half a kilo."}
  ru.a1.unit08.lesson02.teach.shtuka: {title: "штука", gloss: "piece (item)", note: "штука counts individual items; пять штук uses the genitive plural after the number пять.", example_gloss: ["Please give me one piece.", "Please give me five pieces."]}

  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy: {title: "помидоры, огурцы", gloss: "tomatoes, cucumbers", note: "Both are plural produce nouns; помидоры is masculine and огурцы is masculine.", example_gloss: ["Do you have tomatoes?", "Do you have cucumbers?"]}
  ru.a1.unit08.lesson03.teach.kartofel_kapusta: {title: "картофель, капуста", gloss: "potatoes, cabbage", note: "картофель is a masculine collective noun (used like an uncountable) and капуста is feminine.", example_gloss: ["Do you have potatoes?", "Do you have cabbage?"]}
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny: {title: "яблоки, апельсины", gloss: "apples, oranges", note: "кило яблок uses the genitive plural яблок after кило (\"a kilo of apples\"), the same pattern as кило апельсинов.", example_gloss: ["How much does a kilo of apples cost?", "How much does a kilo of oranges cost?"]}
  ru.a1.unit08.lesson03.teach.u_vas_est: {title: "У вас есть ...?", gloss: "Do you have ...? (formal)", note: "Uses the formal вас register, the standard way to ask a shopkeeper if they have an item."}
  ru.a1.unit08.lesson03.teach.da_u_menya_est: {title: "Да, у меня есть ...", gloss: "Yes, I have ...", note: "У меня есть (\"at me there is\") is the standard way to say \"I have,\" the shopkeeper's response."}

exercises:
  ru.a1.unit08.lesson01.exercise01.recognize_magazin:
    instruction: "Which word means \"store\"?"
    correct_option: "магазин"
    distractors: ["сколько", "стоит", "рубль"]
    accepted_answers: [{value: "магазин", status: "correct"}]
    feedback: "магазин means \"store.\""
  ru.a1.unit08.lesson01.exercise02.recognize_skolko:
    instruction: "Which word means \"how much\"?"
    correct_option: "сколько"
    distractors: ["магазин", "стоит", "рубль"]
    accepted_answers: [{value: "сколько", status: "correct"}]
    feedback: "сколько means \"how much.\""
  ru.a1.unit08.lesson01.exercise03.listen_select_skolko_stoit_khleb:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "How much does the bread cost?"
    distractors: ["Please give me a kilogram.", "Do you have bread?", "Is this store open?"]
    accepted_answers: [{value: "How much does the bread cost?", status: "correct"}]
    feedback: "The recording says Сколько стоит хлеб? (\"How much does the bread cost?\")."
  ru.a1.unit08.lesson01.exercise04.match_price_words:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "магазин", right: "store"}
          - {left: "сколько", right: "how much"}
          - {left: "стоит", right: "costs"}
          - {left: "рубль", right: "ruble"}
        status: "correct"
    feedback: "магазин=store, сколько=how much, стоит=costs, рубль=ruble."
  ru.a1.unit08.lesson01.exercise05.order_skolko_stoit_khleb:
    instruction: "Put the words in the correct order to say \"How much does the bread cost?\""
    accepted_answers:
      - {value: ["Сколько", "стоит", "хлеб"], status: "correct"}
    feedback: "The correct order is Сколько стоит хлеб?"
  ru.a1.unit08.lesson01.exercise06.listen_order_khleb_sto_rubley:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Хлеб", "стоит", "сто", "рублей"], status: "correct"}
    feedback: "The correct order is Хлеб стоит сто рублей (\"The bread costs one hundred rubles\")."
  ru.a1.unit08.lesson01.exercise07.complete_skolko_stoit_moloko:
    instruction: "Complete the question: ___ стоит молоко? (How much)"
    accepted_answers:
      - {value: "Сколько", status: "correct"}
      - {value: "Сколько стоит молоко", status: "correct"}
    feedback: "Сколько means \"how much,\" asking about the milk's price."
  ru.a1.unit08.lesson01.exercise08.write_ask_price_bread:
    instruction: "Write a question asking how much the bread costs, using \"Сколько стоит...?\"."
    accepted_answers:
      - {value: "Сколько стоит хлеб?", status: "correct"}
      - {value: "Сколько стоит хлеб", status: "correct"}
    feedback: "Сколько стоит хлеб? means \"How much does the bread cost?\""

  ru.a1.unit08.lesson02.exercise01.recognize_kilogramm:
    instruction: "Which word means \"kilogram\"?"
    correct_option: "килограмм"
    distractors: ["полкило", "штука", "дайте"]
    accepted_answers: [{value: "килограмм", status: "correct"}]
    feedback: "килограмм means \"kilogram.\""
  ru.a1.unit08.lesson02.exercise02.recognize_shtuka:
    instruction: "Which word means \"piece (item)\"?"
    correct_option: "штука"
    distractors: ["килограмм", "полкило", "дайте"]
    accepted_answers: [{value: "штука", status: "correct"}]
    feedback: "штука means \"piece (item).\""
  ru.a1.unit08.lesson02.exercise03.listen_select_dayte_kilogramm:
    instruction: "Listen to the recording. What quantity is being requested?"
    correct_option: "A kilogram"
    distractors: ["Half a kilo", "Five pieces", "One piece"]
    accepted_answers: [{value: "A kilogram", status: "correct"}]
    feedback: "The recording says Дайте килограмм, пожалуйста (\"Please give me a kilogram\")."
  ru.a1.unit08.lesson02.exercise04.match_quantity_words:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "килограмм", right: "kilogram"}
          - {left: "полкило", right: "half a kilo"}
          - {left: "штука", right: "piece"}
          - {left: "дайте", right: "give me"}
        status: "correct"
    feedback: "килограмм=kilogram, полкило=half a kilo, штука=piece, дайте=give me."
  ru.a1.unit08.lesson02.exercise05.order_dayte_kilogramm:
    instruction: "Put the words in the correct order to say \"Please give me a kilogram.\""
    accepted_answers:
      - {value: ["Дайте", "килограмм", "пожалуйста"], status: "correct"}
    feedback: "The correct order is Дайте килограмм, пожалуйста."
  ru.a1.unit08.lesson02.exercise06.listen_order_pyat_shtuk:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Дайте", "пять", "штук", "пожалуйста"], status: "correct"}
    feedback: "The correct order is Дайте пять штук, пожалуйста (\"Please give me five pieces\")."
  ru.a1.unit08.lesson02.exercise07.complete_dayte_kilogramm:
    instruction: "Complete the sentence: Дайте, пожалуйста, ___. (a kilogram)"
    accepted_answers:
      - {value: "килограмм", status: "correct"}
      - {value: "Дайте, пожалуйста, килограмм", status: "correct"}
    feedback: "килограмм means \"a kilogram,\" the quantity being requested."
  ru.a1.unit08.lesson02.exercise08.write_ask_half_kilo:
    instruction: "Write a request for half a kilo of something, using \"Дайте, пожалуйста, ...\"."
    accepted_answers:
      - {value: "Дайте, пожалуйста, полкило.", status: "correct"}
      - {value: "Дайте, пожалуйста, полкило", status: "correct"}
    feedback: "Дайте, пожалуйста, полкило means \"Please give me half a kilo.\""

  ru.a1.unit08.lesson03.exercise01.choose_ask_have_tomatoes:
    instruction: "You want to ask if the shop has any tomatoes. What do you say?"
    correct_option: "У вас есть помидоры?"
    distractors: ["Дайте килограмм, пожалуйста.", "Сколько стоит хлеб?", "Да, у меня есть."]
    accepted_answers: [{value: "У вас есть помидоры?", status: "correct"}]
    feedback: "У вас есть помидоры? means \"Do you have tomatoes?\""
  ru.a1.unit08.lesson03.exercise02.listen_select_kilo_yablok:
    instruction: "Listen to the recording. What is the shopper asking the price of?"
    correct_option: "A kilo of apples"
    distractors: ["A kilo of oranges", "Half a kilo of tomatoes", "A piece of cabbage"]
    accepted_answers: [{value: "A kilo of apples", status: "correct"}]
    feedback: "The recording says Сколько стоит кило яблок? (\"How much does a kilo of apples cost?\")."
  ru.a1.unit08.lesson03.exercise03.dialogue_comprehension_magazin_pomidory:
    instruction: "Listen to the dialogue. What does the shopper ask for, and what does it cost?"
    correct_option: "A kilogram of apples, for two hundred rubles"
    distractors: ["A kilogram of tomatoes, for two hundred rubles", "A kilogram of apples, for one hundred rubles", "Half a kilo of apples, for two hundred rubles"]
    accepted_answers: [{value: "A kilogram of apples, for two hundred rubles", status: "correct"}]
    feedback: "The shopper asks Сколько стоит кило яблок? (Двести рублей) and then requests Дайте килограмм яблок, пожалуйста."
  ru.a1.unit08.lesson03.exercise04.match_produce_words:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "помидоры", right: "tomatoes"}
          - {left: "огурцы", right: "cucumbers"}
          - {left: "картофель", right: "potatoes"}
          - {left: "капуста", right: "cabbage"}
          - {left: "яблоки", right: "apples"}
          - {left: "апельсины", right: "oranges"}
        status: "correct"
    feedback: "помидоры=tomatoes, огурцы=cucumbers, картофель=potatoes, капуста=cabbage, яблоки=apples, апельсины=oranges."
  ru.a1.unit08.lesson03.exercise05.order_u_vas_est_pomidory:
    instruction: "Put the words in the correct order to say \"Do you have tomatoes?\""
    accepted_answers:
      - {value: ["У", "вас", "есть", "помидоры"], status: "correct"}
    feedback: "The correct order is У вас есть помидоры?"
  ru.a1.unit08.lesson03.exercise06.reply_have_tomatoes:
    instruction: "Someone asks \"У вас есть помидоры?\" Reply that yes, you have tomatoes."
    accepted_answers:
      - {value: "Да, у меня есть помидоры.", status: "correct"}
      - {value: "Да, у меня есть помидоры", status: "correct"}
    feedback: "Да, у меня есть помидоры means \"Yes, I have tomatoes.\""
  ru.a1.unit08.lesson03.exercise07.complete_skolko_stoit_kilo:
    instruction: "Complete the question: Сколько стоит ___ яблок? (a kilo)"
    accepted_answers:
      - {value: "кило", status: "correct"}
      - {value: "Сколько стоит кило яблок", status: "correct"}
    feedback: "кило means \"a kilo,\" the informal short form of килограмм."
  ru.a1.unit08.lesson03.exercise08.write_ask_produce_price:
    instruction: "Write two sentences: ask if the shop has tomatoes, then ask how much a kilo of tomatoes costs."
    accepted_answers:
      - {value: "У вас есть помидоры? Сколько стоит кило помидоров?", status: "correct"}
      - {value: "У вас есть помидоры? Сколько стоит кило помидоров", status: "correct"}
    feedback: "У вас есть помидоры? asks about availability; Сколько стоит кило помидоров? asks the price per kilo."
