course:
  title: "Russian B1"
  description: "Learn B1-level Russian for describing events with time clauses, distinguishing a habitual/present когда-clause from a past one."

units:
  ru.b1.unit42.posledovatelnost: {title: "Sequence"}

lessons:
  ru.b1.unit42.lesson01.obychnyj_vecher: {title: "A usual evening"}
  ru.b1.unit42.lesson02.vchera_vecherom: {title: "Yesterday evening"}
  ru.b1.unit42.lesson03.rasporyadok_i_vchera: {title: "Routine and yesterday"}

teaching:
  ru.b1.unit42.lesson01.teach.kogda_prikhozhu: {title: "Когда я прихожу домой, я готовлю ужин.", gloss: "When I come home, I cook dinner.", note: "*прихожу* is imperfective present, used for a habitual routine.", example_gloss: "Every day, when I come home, I cook dinner."}
  ru.b1.unit42.lesson01.teach.obychno_vecherom: {title: "Что ты обычно делаешь вечером?", gloss: "What do you usually do in the evening?", note: "*обычно* signals a habitual routine.", example_gloss: "Dima, what do you usually do in the evening?"}
  ru.b1.unit42.lesson01.teach.kazhdyj_den: {title: "Каждый день я готовлю ужин дома.", gloss: "Every day I cook dinner at home.", note: "*Каждый день* reinforces the habitual time frame.", example_gloss: "Every day, when I come home, I cook dinner at home."}
  ru.b1.unit42.lesson02.teach.kogda_prishel: {title: "Когда я пришёл домой вчера, зазвонил телефон.", gloss: "When I came home yesterday, the phone rang.", note: "*пришёл* is perfective past, used for one specific past occasion.", example_gloss: "When I came home yesterday evening, the phone rang."}
  ru.b1.unit42.lesson02.teach.kontrast_vremeni: {title: "прихожу = обычно, пришёл = один раз вчера", gloss: "prikhozhu = usually, prishyol = one time yesterday", note: "Contrast the habitual present form with the one-time past form.", example_gloss: "Prikhozhu shows a habit, and prishyol shows one time yesterday."}
  ru.b1.unit42.lesson02.teach.eto_byla_ty: {title: "Это была ты.", gloss: "It was you.", note: "*была* agrees with the feminine subject *ты* (referring to Nastya).", example_gloss: "When the phone rang, it was you."}
  ru.b1.unit42.lesson03.teach.nastya_question: {title: "Nastya asks about the routine", gloss: "Nastya: Dima, what do you usually do in the evening?", note: "Opens the routine-and-yesterday dialogue."}
  ru.b1.unit42.lesson03.teach.dima_habitual: {title: "Dima states his routine", gloss: "Dima: When I come home, I cook dinner.", note: "Habitual/present time clause."}
  ru.b1.unit42.lesson03.teach.nastya_yesterday_question: {title: "Nastya asks about yesterday", gloss: "Nastya: And what happened yesterday?", note: "Shifts the conversation to a specific past event."}
  ru.b1.unit42.lesson03.teach.dima_past: {title: "Dima reports yesterday's event", gloss: "Dima: When I came home yesterday, the phone rang.", note: "Past time clause, contrasting with the habitual one."}
  ru.b1.unit42.lesson03.teach.dima_it_was_you: {title: "Dima reveals the caller", gloss: "Dima: It was you.", note: "Concludes the past narrative."}

