  ru.b1.unit42.lesson01.exercise02.recognize_gotovlyu: {instruction: "Which Russian phrase means \"I cook dinner\"?", correct_option: "я готовлю ужин", distractors: ["я прихожу домой", "зазвонил телефон", "это была ты"], accepted_answers: [{value: "я готовлю ужин", status: "correct"}], feedback: "*я готовлю ужин* means \"I cook dinner.\""}
  ru.b1.unit42.lesson01.exercise03.listen_select_habitual: {instruction: "Listen. What does the speaker habitually do when they come home?", correct_option: "They cook dinner.", distractors: ["They call a friend.", "The phone rings.", "They check the weather."], accepted_answers: [{value: "They cook dinner.", status: "correct"}], feedback: "The recording says *Когда я прихожу домой, я готовлю ужин*."}
