  ru.b1.unit42.lesson02.exercise03.listen_select_past_clause: {instruction: "Listen. What happened when the speaker came home yesterday?", correct_option: "The phone rang.", distractors: ["They cooked dinner.", "A colleague called.", "They read a letter."], accepted_answers: [{value: "The phone rang.", status: "correct"}], feedback: "The recording says *Когда я пришёл домой вчера, зазвонил телефон*."}
