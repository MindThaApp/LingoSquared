course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Make a polite request, offer help, and accept or decline an offer or request politely."
units:
  ru.a2.unit76.ne_mogli_by_vy: {"title": "Could you?", "description": "Make polite requests with не могли бы вы and the imperative, and offer or accept help politely."}
lessons:
  ru.a2.unit76.lesson01.ne_mogli: {"title": "Could you"}
  ru.a2.unit76.lesson02.otkroyte: {"title": "Open, please"}
  ru.a2.unit76.lesson03.ne_otkryvayte: {"title": "Do not open"}
  ru.a2.unit76.lesson04.predlozhenie: {"title": "Shall I help you"}
  ru.a2.unit76.lesson05.zapiska: {"title": "A note to the neighbours"}
  ru.a2.unit76.lesson06.dialog: {"title": "In the shop"}
teaching:
  ru.a2.unit76.lesson01.teach.verbs: {"title": "Verbs for requests", "gloss": "show / help / wait / open / close / please", "note": "These infinitives follow *не могли бы вы*. *Пожалуйста* makes any request softer.", "example_gloss": ["Could you open the window?", "Could you wait, please?", "Could you help me?"]}
  ru.a2.unit76.lesson01.teach.things: {"title": "Things", "gloss": "window / door / lamp / to me", "note": "*Мне* is the dative of *я*: *помочь мне* = help me, *показать мне* = show me.", "example_gloss": ["Could you close the door?", "Could you show me the lamp?", "There is a window and a door here."]}
  ru.a2.unit76.lesson01.teach.gn_ne_mogli: {"title": "Polite request: не могли бы вы + infinitive", "gloss": "Could you open the window? Could you wait?", "note": "*Не могли бы вы* is the standard polite request. *Бы* makes it a possibility, so it sounds gentle. It is always followed by an infinitive. It uses *вы*, so it is for strangers or formal situations."}
  ru.a2.unit76.lesson01.teach.gn_mozhete: {"title": "Simpler: можете and можешь", "gloss": "Can you open the window? (to a stranger) Can you open the window? (to a friend)", "note": "A shorter request is *Вы можете…?* to a stranger and *Ты можешь…?* to a friend. Add *пожалуйста* to keep it polite."}
  ru.a2.unit76.lesson02.teach.vy: {"title": "Imperative with вы", "gloss": "open! / close! / wait! / help! / look! / repeat! / call!", "note": "The вы-imperative ends in *-те*: *откройте*, *закройте*, *подождите*. It is polite with *пожалуйста*.", "example_gloss": ["Open the window, please.", "Wait, please.", "Look, here is the lamp.", "Repeat, please."]}
  ru.a2.unit76.lesson02.teach.ty: {"title": "Imperative with ты", "gloss": "open! / close! / wait! / help! / look! / repeat! / call!", "note": "To a friend the ending is *-и* or *-й* with no *-те*: *открой*, *закрой*, *подожди*, *помоги*, *позвони*.", "example_gloss": ["Open the window, please.", "Wait for me, please.", "Help me, please.", "Call me in the evening."]}
  ru.a2.unit76.lesson02.teach.gn_imp: {"title": "Making the imperative", "gloss": "open (вы), open (ты), wait (вы), wait (ты)", "note": "For a request to one action, use a perfective verb: *открыть → откройте / открой*, *подождать → подождите / подожди*."}
  ru.a2.unit76.lesson02.teach.gn_pozh: {"title": "Where to put пожалуйста", "gloss": "Open, please, the window.", "note": "*Пожалуйста* can open the request, close it, or stand after the verb. Commas set it off."}
  ru.a2.unit76.lesson03.teach.neg: {"title": "Negative imperatives", "gloss": "do not open / do not close / do not call / do not make noise / do not wait", "note": "After *не* the imperfective imperative is used: *не открывайте*, *не звоните*. *Шуметь* is 'to make noise'.", "example_gloss": ["Do not open the window, please.", "Do not close the door.", "Do not make noise, please.", "Do not wait for me."]}
  ru.a2.unit76.lesson03.teach.negt: {"title": "Negative with ты", "gloss": "do not open / do not close / do not call / do not make noise", "note": "To a friend: *не открывай*, *не закрывай*, *не звони*, *не шуми*.", "example_gloss": ["Do not open the window.", "Do not call me in the evening, please.", "Do not make noise, please."]}
  ru.a2.unit76.lesson03.teach.gn_aspect: {"title": "Request: perfective. Do not: imperfective", "gloss": "Open the window. Do not open the window.", "note": "A positive request uses the perfective (*откройте*). A negative request uses the imperfective (*не открывайте*)."}
  ru.a2.unit76.lesson03.teach.gn_zvon: {"title": "Call me, do not call me", "gloss": "Call me. Do not call me.", "note": "The same pair works for ты: *позвони* (perfective) and *не звони* (imperfective)."}
  ru.a2.unit76.lesson04.teach.offer: {"title": "Offering help", "gloss": "may I help you? / let us / of course / with pleasure", "note": "*Вам помочь?* is the short offer 'shall I help you?'. *Давайте я помогу* means 'let me help'.", "example_gloss": ["Shall I help you?", "Let me help you.", "Of course, with pleasure."]}
  ru.a2.unit76.lesson04.teach.answers: {"title": "Accepting and declining", "gloss": "yes, please / no, thank you / thank you / unfortunately", "note": "*Да, пожалуйста* accepts. *Нет, спасибо* declines. *К сожалению* means 'unfortunately' and softens a refusal.", "example_gloss": ["Yes, please.", "No, thank you, there is no need.", "Unfortunately, I cannot."]}
  ru.a2.unit76.lesson04.teach.gn_offer: {"title": "Offers", "gloss": "Shall I help you? Let me help you.", "note": "Offer help with *Вам помочь?* or with *Давайте я помогу*, where *я* + perfective future says what you will do."}
  ru.a2.unit76.lesson04.teach.gn_reply: {"title": "Replies", "gloss": "Yes, please. No, thank you. Unfortunately, I cannot.", "note": "Accept with *Да, пожалуйста*; decline with *Нет, спасибо*; refuse a request with *К сожалению, не могу*."}
  ru.a2.unit76.lesson05.teach.v5: {"title": "Words for the note", "gloss": "hello / next door / during the day / thank you very much", "note": "*Здравствуйте* is the formal hello. *Днём* means 'during the day'. *Большое спасибо* is 'thank you very much'.", "example_gloss": ["Hello, I am Dima.", "Do not make noise during the day, please.", "Thank you very much!", "I live in the flat next door."]}
  ru.a2.unit76.lesson05.teach.reading: {"title": "Dima's note", "gloss": "Hello! I live in the flat next door. I work at home. Could you not make noise during the day? Thank you very much! I will not make noise in the evening either. Dima", "note": "A polite note uses *вы*: *Не могли бы вы…?* and a thanks. Dima also promises not to make noise himself.", "glosses": {"днём": "during the day", "рядом": "next door, nearby", "шуметь": "to make noise"}}
  ru.a2.unit76.lesson06.teach.q: {"title": "The shop assistant offers help", "gloss": "Shop assistant: Hello! Shall I help you?"}
  ru.a2.unit76.lesson06.teach.a: {"title": "Dima accepts and asks", "gloss": "Dima: Yes, please. Could you show me the lamp?"}
  ru.a2.unit76.lesson06.teach.show: {"title": "The shop assistant shows the lamp", "gloss": "Shop assistant: Of course. Look, here is the lamp. It costs five hundred roubles."}
  ru.a2.unit76.lesson06.teach.price: {"title": "Dima asks the price", "gloss": "Dima: Thank you. Please repeat how much it costs?"}
  ru.a2.unit76.lesson06.teach.cost: {"title": "The price", "gloss": "Shop assistant: Five hundred roubles."}
  ru.a2.unit76.lesson06.teach.buy: {"title": "Dima decides", "gloss": "Dima: OK, I will buy it. Thank you!"}
exercises:
  ru.a2.unit76.lesson01.exercise01.open: {"instruction": "Choose the correct English meaning.", "correct_option": "Could you open the window, please?", "distractors": ["You cannot open the window.", "Did you open the window?", "Must you open the window?"], "accepted_answers": [{"value": "Could you open the window, please?", "status": "correct"}], "feedback": "*Не могли бы вы* + infinitive is a polite request."}
  ru.a2.unit76.lesson01.exercise02.wait: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Не могли бы вы подождать, пожалуйста?", "distractors": ["Не могли бы ты подождать, пожалуйста?", "Могли бы не вы подождать, пожалуйста?", "Не бы могли вы подождать, пожалуйста?"], "accepted_answers": [{"value": "Не могли бы вы подождать, пожалуйста?", "status": "correct"}], "feedback": "The fixed order is *не могли бы вы* + infinitive."}
  ru.a2.unit76.lesson01.exercise03.w1: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "открыть", "right": "to open"}, {"left": "закрыть", "right": "to close"}, {"left": "подождать", "right": "to wait"}, {"left": "помочь", "right": "to help"}, {"left": "показать", "right": "to show"}, {"left": "окно", "right": "window"}, {"left": "дверь", "right": "door"}, {"left": "лампа", "right": "lamp"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit76.lesson01.exercise04.dver: {"instruction": "Put the words in order to say 'Could you close the door?'", "correct_option": "Не могли бы вы закрыть дверь", "accepted_answers": [{"value": "Не могли бы вы закрыть дверь", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь", "status": "correct"}], "feedback": "Both orders are polite requests."}
  ru.a2.unit76.lesson01.exercise05.blank_mogli: {"instruction": "Complete the sentence: 'Could you open the window, please?'", "correct_option": "могли", "accepted_answers": [{"value": "могли", "status": "correct"}], "feedback": "*Не могли бы вы* + infinitive."}
  ru.a2.unit76.lesson01.exercise06.pomoch: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Не могли бы вы мне помочь, пожалуйста?", "status": "correct"}, {"value": "Не могли бы вы мне помочь, пожалуйста", "status": "correct"}, {"value": "Не могли бы вы мне помочь пожалуйста?", "status": "correct"}, {"value": "Не могли бы вы мне помочь пожалуйста", "status": "correct"}, {"value": "Не могли бы вы помочь мне, пожалуйста?", "status": "correct"}, {"value": "Не могли бы вы помочь мне, пожалуйста", "status": "correct"}, {"value": "Не могли бы вы помочь мне пожалуйста?", "status": "correct"}, {"value": "Не могли бы вы помочь мне пожалуйста", "status": "correct"}, {"value": "Не могли бы вы мне помочь?", "status": "correct"}, {"value": "Не могли бы вы мне помочь", "status": "correct"}, {"value": "Не могли бы вы помочь мне?", "status": "correct"}, {"value": "Не могли бы вы помочь мне", "status": "correct"}, {"value": "Вы не могли бы мне помочь, пожалуйста?", "status": "correct"}, {"value": "Вы не могли бы мне помочь, пожалуйста", "status": "correct"}, {"value": "Вы не могли бы мне помочь пожалуйста?", "status": "correct"}, {"value": "Вы не могли бы мне помочь пожалуйста", "status": "correct"}, {"value": "Вы не могли бы помочь мне?", "status": "correct"}, {"value": "Вы не могли бы помочь мне", "status": "correct"}], "feedback": "*Мне* can come before or after *помочь*."}
  ru.a2.unit76.lesson01.exercise07.zakr: {"instruction": "Write the requested Russian sentence.", "correct_option": "Не могли бы вы закрыть дверь, пожалуйста?", "accepted_answers": [{"value": "Не могли бы вы закрыть дверь, пожалуйста?", "status": "correct"}, {"value": "Не могли бы вы закрыть дверь, пожалуйста", "status": "correct"}, {"value": "Не могли бы вы закрыть дверь пожалуйста?", "status": "correct"}, {"value": "Не могли бы вы закрыть дверь пожалуйста", "status": "correct"}, {"value": "Не могли бы вы, пожалуйста, закрыть дверь?", "status": "correct"}, {"value": "Не могли бы вы, пожалуйста, закрыть дверь", "status": "correct"}, {"value": "Не могли бы вы пожалуйста закрыть дверь?", "status": "correct"}, {"value": "Не могли бы вы пожалуйста закрыть дверь", "status": "correct"}, {"value": "Не могли бы вы закрыть дверь?", "status": "correct"}, {"value": "Не могли бы вы закрыть дверь", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь, пожалуйста?", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь, пожалуйста", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь пожалуйста?", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь пожалуйста", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь?", "status": "correct"}, {"value": "Вы не могли бы закрыть дверь", "status": "correct"}], "feedback": "*Не могли бы вы* + infinitive."}
  ru.a2.unit76.lesson02.exercise01.podozhd: {"instruction": "Choose the correct English meaning.", "correct_option": "Please wait (to someone you call вы).", "distractors": ["Please wait (to a friend).", "Please open (to someone you call вы).", "Please call (to someone you call вы)."], "accepted_answers": [{"value": "Please wait (to someone you call вы).", "status": "correct"}], "feedback": "*Подождите* is the вы-form; *подожди* is the ты-form."}
  ru.a2.unit76.lesson02.exercise02.otkroy: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Открой, пожалуйста, окно.", "distractors": ["Закрой, пожалуйста, окно.", "Открой, пожалуйста, дверь.", "Открыть, пожалуйста, окно."], "accepted_answers": [{"value": "Открой, пожалуйста, окно.", "status": "correct"}], "feedback": "A friend gets *открой*."}
  ru.a2.unit76.lesson02.exercise03.w2: {"instruction": "Match each Russian imperative to its English meaning.", "accepted_answers": [{"value": [{"left": "откройте", "right": "open! (formal or plural)"}, {"left": "открой", "right": "open! (to a friend)"}, {"left": "закройте", "right": "close! (formal or plural)"}, {"left": "закрой", "right": "close! (to a friend)"}, {"left": "подождите", "right": "wait! (formal or plural)"}, {"left": "подожди", "right": "wait! (to a friend)"}], "status": "correct"}], "feedback": "*-те* marks the вы-form."}
  ru.a2.unit76.lesson02.exercise04.okno: {"instruction": "Put the words in order to say 'Open the window, please.' (to someone you call вы)", "correct_option": "Откройте пожалуйста окно", "accepted_answers": [{"value": "Откройте пожалуйста окно", "status": "correct"}, {"value": "Пожалуйста откройте окно", "status": "correct"}, {"value": "Откройте окно пожалуйста", "status": "correct"}], "feedback": "*Пожалуйста* is flexible."}
  ru.a2.unit76.lesson02.exercise05.blank_zakr: {"instruction": "Complete the sentence: 'Close the door, please' (to someone you call вы).", "correct_option": "Закройте", "accepted_answers": [{"value": "Закройте", "status": "correct"}, {"value": "закройте", "status": "correct"}], "feedback": "*Закройте* is the вы-imperative of *закрыть*."}
  ru.a2.unit76.lesson02.exercise06.pomogi: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Помоги мне, пожалуйста.", "status": "correct"}, {"value": "Помоги мне, пожалуйста", "status": "correct"}, {"value": "Помоги мне пожалуйста.", "status": "correct"}, {"value": "Помоги мне пожалуйста", "status": "correct"}, {"value": "Пожалуйста, помоги мне.", "status": "correct"}, {"value": "Пожалуйста, помоги мне", "status": "correct"}, {"value": "Пожалуйста помоги мне.", "status": "correct"}, {"value": "Пожалуйста помоги мне", "status": "correct"}], "feedback": "*Помоги* is the ты-imperative."}
  ru.a2.unit76.lesson02.exercise07.zvoni: {"instruction": "Write the requested Russian sentence.", "correct_option": "Позвони мне вечером, пожалуйста.", "accepted_answers": [{"value": "Позвони мне вечером, пожалуйста.", "status": "correct"}, {"value": "Позвони мне вечером, пожалуйста", "status": "correct"}, {"value": "Позвони мне вечером пожалуйста.", "status": "correct"}, {"value": "Позвони мне вечером пожалуйста", "status": "correct"}, {"value": "Позвони, пожалуйста, мне вечером.", "status": "correct"}, {"value": "Позвони, пожалуйста, мне вечером", "status": "correct"}, {"value": "Позвони пожалуйста мне вечером.", "status": "correct"}, {"value": "Позвони пожалуйста мне вечером", "status": "correct"}, {"value": "Пожалуйста, позвони мне вечером.", "status": "correct"}, {"value": "Пожалуйста, позвони мне вечером", "status": "correct"}, {"value": "Пожалуйста позвони мне вечером.", "status": "correct"}, {"value": "Пожалуйста позвони мне вечером", "status": "correct"}, {"value": "Позвони мне, пожалуйста, вечером.", "status": "correct"}, {"value": "Позвони мне, пожалуйста, вечером", "status": "correct"}, {"value": "Позвони мне пожалуйста вечером.", "status": "correct"}, {"value": "Позвони мне пожалуйста вечером", "status": "correct"}, {"value": "Вечером позвони мне, пожалуйста.", "status": "correct"}, {"value": "Вечером позвони мне, пожалуйста", "status": "correct"}, {"value": "Вечером позвони мне пожалуйста.", "status": "correct"}, {"value": "Вечером позвони мне пожалуйста", "status": "correct"}], "feedback": "*Позвони* is the ты-imperative."}
  ru.a2.unit76.lesson03.exercise01.noopen: {"instruction": "Choose the correct English meaning.", "correct_option": "Please do not open the window.", "distractors": ["Please open the window.", "Please close the window.", "Please do not close the window."], "accepted_answers": [{"value": "Please do not open the window.", "status": "correct"}], "feedback": "*Не открывайте* = do not open."}
  ru.a2.unit76.lesson03.exercise02.nezvoni: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Не звони мне, пожалуйста.", "distractors": ["Не позвони мне, пожалуйста.", "Не позвоните мне, пожалуйста.", "Не звонить мне, пожалуйста."], "accepted_answers": [{"value": "Не звони мне, пожалуйста.", "status": "correct"}], "feedback": "After *не* use the imperfective *звони*, not *позвони*."}
  ru.a2.unit76.lesson03.exercise03.w3: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "не открывайте", "right": "do not open (formal or plural)"}, {"left": "не открывай", "right": "do not open (to a friend)"}, {"left": "не закрывайте", "right": "do not close (formal or plural)"}, {"left": "не звоните", "right": "do not call (formal or plural)"}, {"left": "не звони", "right": "do not call (to a friend)"}, {"left": "не шумите", "right": "do not make noise (formal or plural)"}], "status": "correct"}], "feedback": "These are imperfective imperatives."}
  ru.a2.unit76.lesson03.exercise04.dver2: {"instruction": "Put the words in order to say 'Please do not close the door.' (to someone you call вы)", "correct_option": "Не закрывайте дверь пожалуйста", "accepted_answers": [{"value": "Не закрывайте дверь пожалуйста", "status": "correct"}, {"value": "Пожалуйста не закрывайте дверь", "status": "correct"}, {"value": "Не закрывайте пожалуйста дверь", "status": "correct"}], "feedback": "*Пожалуйста* is flexible."}
  ru.a2.unit76.lesson03.exercise05.blank_neopen: {"instruction": "Complete the sentence: 'Please do not open the window' (to someone you call вы).", "correct_option": "открывайте", "accepted_answers": [{"value": "открывайте", "status": "correct"}], "feedback": "After *не* use the imperfective *открывайте*."}
  ru.a2.unit76.lesson03.exercise06.shum: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Не шумите, пожалуйста.", "status": "correct"}, {"value": "Не шумите, пожалуйста", "status": "correct"}, {"value": "Не шумите пожалуйста.", "status": "correct"}, {"value": "Не шумите пожалуйста", "status": "correct"}, {"value": "Пожалуйста, не шумите.", "status": "correct"}, {"value": "Пожалуйста, не шумите", "status": "correct"}, {"value": "Пожалуйста не шумите.", "status": "correct"}, {"value": "Пожалуйста не шумите", "status": "correct"}], "feedback": "*Не шумите* is a polite negative request."}
