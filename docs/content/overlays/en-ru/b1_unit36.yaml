  ru.b1.unit36.lesson03.exercise01.choose_full_obligation: {instruction: "Which answer includes present obligation, prohibition, and past regret?", correct_option: "Сегодня я должен отправить форму. В офисе нельзя опаздывать. Мне нужно было проверить адрес вчера, но я не успел.", distractors: ["Сегодня я могу сказать, что документ готов.", "В офисе нельзя опаздывать.", "Мне нужно проверить адрес сегодня."], accepted_answers: [{value: "Сегодня я должен отправить форму. В офисе нельзя опаздывать. Мне нужно было проверить адрес вчера, но я не успел.", status: "correct"}], feedback: "The correct answer has должен, нельзя, and нужно было plus the unfulfilled part."}
