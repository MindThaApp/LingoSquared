  ru.b1.unit36.lesson01.exercise03.listen_select_obligation: {instruction: "Listen. What must the speaker do today?", correct_option: "Send the form.", distractors: ["Be late to the office.", "Check the address yesterday.", "Explain where the office is."], accepted_answers: [{value: "Send the form.", status: "correct"}], feedback: "The recording says *Сегодня я должен отправить форму*."}
