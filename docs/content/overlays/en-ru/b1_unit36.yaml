course:
  title: "Russian B1"
  description: "Learn B1-level Russian for obligation, prohibition, and past regret."

units:
  ru.b1.unit36.objazannosti: {title: "Obligations"}

lessons:
  ru.b1.unit36.lesson01.dolzhen_otpravit: {title: "Must send"}
  ru.b1.unit36.lesson02.nelzya_i_regret: {title: "Must not and should have"}
  ru.b1.unit36.lesson03.objazannosti_dialogue: {title: "Dialogue: what needs to be done"}

teaching:
  ru.b1.unit36.lesson01.teach.dolzhen: {title: "Сегодня я должен отправить форму.", gloss: "Today I must send the form.", note: "*должен* is the male-speaker form for a personal obligation.", example_gloss: "Dima, today I must send the form."}
  ru.b1.unit36.lesson01.teach.nuzhno: {title: "Мне нужно проверить адрес.", gloss: "I need to check the address.", note: "*Мне нужно* is a common Russian way to say that something is necessary.", example_gloss: "I need to check the address today."}
  ru.b1.unit36.lesson01.teach.chto_dolzhen: {title: "Что ты должен сделать сегодня?", gloss: "What must you do today?", note: "Настя uses informal *ты* with Дима.", example_gloss: "Dima, what must you do today?"}
  ru.b1.unit36.lesson02.teach.nelzya: {title: "В офисе нельзя опаздывать.", gloss: "In the office, you must not be late.", note: "*нельзя* gives a prohibition: something is not allowed.", example_gloss: "Dima, in the office you must not be late."}
  ru.b1.unit36.lesson02.teach.nuzhno_bylo: {title: "Мне нужно было проверить адрес вчера, но я не успел.", gloss: "I should have checked the address yesterday, but I did not manage to.", note: "*нужно было* plus the added clause makes the unfulfilled obligation explicit.", example_gloss: "Dima, I should have checked the address yesterday, but I did not manage to."}
  ru.b1.unit36.lesson02.teach.ne_uspel: {title: "Я не успел.", gloss: "I did not manage to.", note: "For Дима, use masculine *успел*.", example_gloss: "I should have checked the address yesterday, but I did not manage to."}
  ru.b1.unit36.lesson03.teach.nastya_question: {title: "Nastya asks about an obligation", gloss: "Nastya: Dima, what must you do today?", note: "The friends use informal *ты*."}
  ru.b1.unit36.lesson03.teach.dima_obligation: {title: "Dima states the obligation", gloss: "Dima: Today I must send the form.", note: "This gives the present obligation."}
  ru.b1.unit36.lesson03.teach.dima_prohibition_regret: {title: "Dima adds prohibition and regret", gloss: "Dima: In the office, you must not be late. I should have checked the address yesterday, but I did not manage to.", note: "This combines prohibition with past regret."}
  ru.b1.unit36.lesson03.teach.nastya_answer: {title: "Nastya responds", gloss: "Nastya: I understand. Then send the form today.", note: "Настя keeps the conversation practical and informal."}

