    title: Lena's birthday is Saturday the eighteenth
    gloss: Lena's birthday is on Saturday the eighteenth of April.
    note: '*Лены* is the genitive of *Лена* and shows possession: *день рождения Лены*, with no word for ''of''.'
  ru.a1.unit32.lesson03.teach.priglashat:
    title: To invite
    gloss: to invite
    example_gloss: I invite you.
  ru.a1.unit32.lesson03.teach.kogo_priglashayut_stoit:
    title: Приглашать plus accusative
    gloss: 'The person you invite is in the accusative: *я приглашаю тебя*, *я приглашаю Настю*.'
    note: 'The accusative of feminine names ends in *-у* or *-ю*: *Настя* becomes *Настю*.'
