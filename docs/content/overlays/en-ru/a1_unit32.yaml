  ru.a1.unit32.lesson06.teach.nastya_pozdravlyayu_vot:
    title: Nastya gives a gift
    gloss: 'Nastya: Congratulations! Here''s a gift for you.'
  ru.a1.unit32.lesson06.teach.lena_spasibo_vam:
    title: Lena thanks them
    gloss: 'Lena: Thank you both! That''s really sweet.'
  ru.a1.unit32.lesson06.teach.igor_nachnyom_vecherinku:
    title: Igor suggests starting
    gloss: 'Igor: Shall we start the party?'
  ru.a1.unit32.lesson06.teach.lena_da_davayte:
    title: Lena agrees
    gloss: 'Lena: Yes, let''s celebrate it!'
