    title: Igor agrees
    gloss: 'Igor: Yes, I''ll invite Nastya.'
  ru.a1.unit32.lesson05.teach.v_subbotu_den:
    title: Who's doing what for the party?
    gloss: Saturday is Lena's birthday. We're celebrating with a party. Dima invites Igor and Nastya to the party. Igor loves celebrating with friends. Nastya is also coming to the party. Everyone is happy for Lena.
    note: Recaps the party plan, mirroring the studies unit's own comparison-reading shape.
    glosses:
      субботу: Saturday
      рождения: birthday
      отмечаем: celebrate
      вечеринкой: party
      приглашает: invites
      на: 'to (as in приглашает на: invites to)'
      праздновать: celebrates
      любит: likes to
      друзьями: friends
      придёт: comes
      Все: everyone
      рады: happy
