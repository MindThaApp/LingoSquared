  ru.a1.unit32.lesson04.teach.igor_kak_zdorovo:
    title: Igor reacts
    gloss: 'Igor: How nice! Shall we celebrate with a party?'
  ru.a1.unit32.lesson04.teach.dima_da_v:
    title: Dima proposes Saturday
    gloss: 'Dima: Yes, we''re celebrating with a party on Saturday. Will you invite Nastya?'
