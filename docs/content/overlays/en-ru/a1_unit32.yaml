  ru.a1.unit32.lesson01.teach.moy_den_rozhdeniya:
    title: My birthday is on the eighteenth of April
    gloss: My birthday is on the eighteenth of April.
    note: 'Dates use the genitive of the ordinal and the month: *восемнадцатого апреля* (literally ''of the eighteenth of April''), with no preposition.'
  ru.a1.unit32.lesson02.teach.otmechat:
    title: To celebrate
    gloss: to celebrate
    example_gloss: We are celebrating Lena's birthday.
  ru.a1.unit32.lesson02.teach.vecherinka:
    title: The party
    gloss: the party
    example_gloss: The party is on Saturday.
