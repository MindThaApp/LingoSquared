course:
  title: "Russian B1"
  description: "Learn B1-level Russian for debating with nuance -- conceding a valid point with хотя before restating your own position, and using тем не менее, a stronger contrastive connector than но, to structure a multi-point argument."

units:
  ru.b1.unit53.ustupki: {title: "Concessions"}

lessons:
  ru.b1.unit53.lesson01.hotja_udobna: {title: "Although it's convenient..."}
  ru.b1.unit53.lesson02.tem_ne_menee: {title: "Nevertheless..."}
  ru.b1.unit53.lesson03.debaty_rabota_doma: {title: "Debating working from home"}

teaching:
  ru.b1.unit53.lesson01.teach.hotja_udobna: {title: "Хотя работа из дома удобна, мне не хватает общения с коллегами.", gloss: "Although working from home is convenient, I miss talking with colleagues.", note: "хотя introduces a concession before the speaker's real point.", example_gloss: null}
  ru.b1.unit53.lesson01.teach.hotja_grammar: {title: "хотя + придаточное = уступительная связка", gloss: "although + clause = a concessive connector", note: "Use хотя to concede a valid point on the other side before restating your own position or complaint.", example_gloss: "Although working from home is convenient, I miss talking with colleagues -- хотя introduces a concession before stating an opinion."}
  ru.b1.unit53.lesson02.teach.tem_ne_menee_hvataet: {title: "Работа из дома удобна. Тем не менее мне не хватает общения с коллегами.", gloss: "Working from home is convenient. Nevertheless, I miss talking with colleagues.", note: "тем не менее contrasts the two statements more strongly than но would.", example_gloss: null}
  ru.b1.unit53.lesson02.teach.tem_ne_menee_grammar: {title: "тем не менее = более сильная связка контраста, чем но", gloss: "nevertheless = a stronger contrastive connector than but", note: "Use тем не менее, not a simple но, to structure a multi-point argument with a stronger contrast.", example_gloss: "Working from home is convenient. Nevertheless, I miss talking with colleagues -- тем не менее is stronger than но."}
  ru.b1.unit53.lesson03.teach.nastya_position: {title: "Nastya states her position", gloss: "Nastya: I think working from home is better, because you save time.", note: "Opens the debate with a stated opinion and reason."}
  ru.b1.unit53.lesson03.teach.dima_concede: {title: "Dima concedes a point", gloss: "Dima: Although working from home really is convenient, I miss talking with colleagues.", note: "хотя concedes Nastya's point before Dima states his own complaint."}
  ru.b1.unit53.lesson03.teach.nastya_acknowledge: {title: "Nastya acknowledges", gloss: "Nastya: I understand.", note: "A short, natural acknowledgment."}
  ru.b1.unit53.lesson03.teach.dima_restate: {title: "Dima grants a point with тем не менее", gloss: "Dima: Nevertheless, I agree it's easier to concentrate at home.", note: "After his complaint, Dima uses тем не менее to grant Nastya a further point anyway: it's easier to concentrate at home."}

