  ru.b1.unit53.lesson02.exercise02.recognize_tem_ne_menee_grammar: {instruction: "Which Russian phrase says that тем не менее is a stronger contrastive connector than но?", correct_option: "тем не менее более сильная связка контраста чем но", distractors: ["хотя придаточное уступительная связка", "работа из дома удобна тем не менее", "мне не хватает общения с коллегами"], accepted_answers: [{value: "тем не менее более сильная связка контраста чем но", status: "correct"}], feedback: "более сильная связка контраста, чем но means \"a stronger contrastive connector than but.\""}
