course:
  title: "Russian B1"
  description: "Learn B1-level Russian for debating with nuance -- conceding a valid point with хотя before restating your own position, and using тем не менее, a stronger contrastive connector than но, to structure a multi-point argument."

units:
  ru.b1.unit53.ustupki: {title: "Concessions"}

lessons:
  ru.b1.unit53.lesson01.hotja_udobna: {title: "Although it's convenient..."}
  ru.b1.unit53.lesson02.tem_ne_menee: {title: "Nevertheless..."}
  ru.b1.unit53.lesson03.debaty_rabota_doma: {title: "Debating working from home"}

teaching:
  ru.b1.unit53.lesson01.teach.hotja_udobna: {title: "Хотя работа из дома удобна, мне не хватает общения с коллегами.", gloss: "Although working from home is convenient, I miss talking with colleagues.", note: "хотя introduces a concession before the speaker's real point.", example_gloss: null}
  ru.b1.unit53.lesson01.teach.hotja_grammar: {title: "хотя + придаточное = уступительная связка", gloss: "although + clause = a concessive connector", note: "Use хотя to concede a valid point on the other side before restating your own position or complaint.", example_gloss: "Although working from home is convenient, I miss talking with colleagues -- хотя introduces a concession before stating an opinion."}
  ru.b1.unit53.lesson02.teach.tem_ne_menee_hvataet: {title: "Работа из дома удобна. Тем не менее, мне не хватает общения с коллегами.", gloss: "Working from home is convenient. Nevertheless, I miss talking with colleagues.", note: "тем не менее contrasts the two statements more strongly than но would.", example_gloss: null}
  ru.b1.unit53.lesson02.teach.tem_ne_menee_grammar: {title: "тем не менее = более сильная связка контраста, чем но", gloss: "nevertheless = a stronger contrastive connector than but", note: "Use тем не менее, not а simple но, to structure a multi-point argument with a stronger contrast.", example_gloss: "Working from home is convenient. Nevertheless, I miss talking with colleagues -- тем не менее is stronger than но."}
  ru.b1.unit53.lesson03.teach.nastya_position: {title: "Nastya states her position", gloss: "Nastya: I think working from home is better, because you save time.", note: "Opens the debate with a stated opinion and reason."}
  ru.b1.unit53.lesson03.teach.dima_concede: {title: "Dima concedes a point", gloss: "Dima: Although working from home really is convenient, I miss talking with colleagues.", note: "хотя concedes Nastya's point before Dima states his own complaint."}
  ru.b1.unit53.lesson03.teach.nastya_acknowledge: {title: "Nastya acknowledges", gloss: "Nastya: I understand.", note: "A short, natural acknowledgment."}
  ru.b1.unit53.lesson03.teach.dima_restate: {title: "Dima restates with тем не менее", gloss: "Dima: Nevertheless, I agree it's easier to concentrate at home.", note: "тем не менее restates Dima's own position with a stronger contrast than но."}

exercises:
  ru.b1.unit53.lesson01.exercise01.recognize_hotja_udobna: {instruction: "Which Russian sentence means \"although working from home is convenient, I miss talking with colleagues\"?", correct_option: "хотя работа из дома удобна мне не хватает общения с коллегами", distractors: ["работа из дома удобна тем не менее мне не хватает общения с коллегами", "я думаю что работа из дома это лучше потому что экономишь время", "тем не менее я согласен что дома легче сосредоточиться"], accepted_answers: [{value: "хотя работа из дома удобна мне не хватает общения с коллегами", status: "correct"}], feedback: "хотя concedes a point before the speaker's real complaint."}
  ru.b1.unit53.lesson01.exercise02.recognize_hotja_grammar: {instruction: "Which Russian phrase names хотя as a concessive connector?", correct_option: "хотя придаточное уступительная связка", distractors: ["тем не менее более сильная связка контраста чем но", "хотя работа из дома удобна", "работа из дома удобна тем не менее"], accepted_answers: [{value: "хотя придаточное уступительная связка", status: "correct"}], feedback: "уступительная связка means \"a concessive connector.\""}
  ru.b1.unit53.lesson01.exercise03.listen_select_hotja_udobna: {instruction: "Listen. What point is conceded, and what is the speaker's real complaint?", correct_option: "Working from home is conceded as convenient; the complaint is missing colleagues.", distractors: ["Working from home is conceded as inconvenient; the complaint is missing time.", "Colleagues are conceded as difficult; the complaint is working from home.", "Working from home is conceded as convenient; the complaint is too much noise."], accepted_answers: [{value: "Working from home is conceded as convenient; the complaint is missing colleagues.", status: "correct"}], feedback: "The recording says *Хотя работа из дома удобна, мне не хватает общения с коллегами*."}
  ru.b1.unit53.lesson01.exercise04.match_hotja_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Хотя работа из дома удобна", right: "Although working from home is convenient"}
          - {left: "мне не хватает", right: "I miss"}
          - {left: "общения с коллегами", right: "talking with colleagues"}
          - {left: "придаточное", right: "a subordinate clause"}
          - {left: "уступительная связка", right: "a concessive connector"}
          - {left: "удобна", right: "convenient"}
        status: "correct"
    feedback: "These build the хотя concession sentence."
  ru.b1.unit53.lesson01.exercise05.order_hotja_udobna: {instruction: "Put the words in order to say \"Although working from home is convenient, I miss talking with colleagues.\"", accepted_answers: [{value: ["Хотя", "работа", "из", "дома", "удобна", "мне", "не", "хватает", "общения", "с", "коллегами"], status: "correct"}], feedback: "The correct order is *Хотя работа из дома удобна, мне не хватает общения с коллегами*."}
  ru.b1.unit53.lesson01.exercise06.write_hotja_udobna:
    instruction: "Write exactly this sentence conceding a point with хотя before stating a complaint: Although working from home is convenient, I miss talking with colleagues."
    accepted_answers:
      - {value: "Хотя работа из дома удобна, мне не хватает общения с коллегами.", status: "correct"}
      - {value: "Хотя работа из дома удобна, мне не хватает общения с коллегами", status: "correct"}
    feedback: "The model answer is *Хотя работа из дома удобна, мне не хватает общения с коллегами*."
  ru.b1.unit53.lesson02.exercise01.recognize_tem_ne_menee: {instruction: "Which Russian sentence pair means \"working from home is convenient; nevertheless, I miss talking with colleagues\"?", correct_option: "работа из дома удобна тем не менее мне не хватает общения с коллегами", distractors: ["хотя работа из дома удобна мне не хватает общения с коллегами", "я думаю что работа из дома это лучше потому что экономишь время", "тем не менее я согласен что дома легче сосредоточиться"], accepted_answers: [{value: "работа из дома удобна тем не менее мне не хватает общения с коллегами", status: "correct"}], feedback: "тем не менее contrasts the two statements more strongly than но."}
  ru.b1.unit53.lesson02.exercise02.recognize_tem_ne_menee_grammar: {instruction: "Which Russian phrase says that тем не менее is a stronger contrastive connector than но?", correct_option: "тем не менее более сильная связка контраста чем но", distractors: ["хотя придаточное уступительная связка", "работа из дома удобна тем не менее", "мне не хватает общения с коллегами"], accepted_answers: [{value: "тем не менее более сильная связка контраста чем но", status: "correct"}], feedback: "более сильная связка контраста, чем но means \"a stronger contrastive connector than but.\""}
  ru.b1.unit53.lesson02.exercise03.listen_select_tem_ne_menee: {instruction: "Listen. How does the speaker contrast the two statements?", correct_option: "With тем не менее, a stronger connector than но.", distractors: ["With но, a simple connector.", "With хотя, a concessive connector.", "With no connector at all."], accepted_answers: [{value: "With тем не менее, a stronger connector than но.", status: "correct"}], feedback: "The recording says *Работа из дома удобна. Тем не менее, мне не хватает общения с коллегами*."}
  ru.b1.unit53.lesson02.exercise04.match_tem_ne_menee_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Работа из дома удобна.", right: "Working from home is convenient."}
          - {left: "Тем не менее", right: "Nevertheless"}
          - {left: "мне не хватает общения", right: "I miss talking"}
          - {left: "с коллегами", right: "with colleagues"}
          - {left: "более сильная связка контраста", right: "a stronger contrastive connector"}
          - {left: "чем но", right: "than but"}
        status: "correct"
    feedback: "These build the тем не менее contrast sentence."
  ru.b1.unit53.lesson02.exercise05.order_tem_ne_menee: {instruction: "Put the words in order to say \"Nevertheless, I miss talking with colleagues.\"", accepted_answers: [{value: ["Тем", "не", "менее", "мне", "не", "хватает", "общения", "с", "коллегами"], status: "correct"}], feedback: "The correct order is *Тем не менее, мне не хватает общения с коллегами*."}
  ru.b1.unit53.lesson02.exercise06.write_tem_ne_menee:
    instruction: "Write exactly these two sentences using тем не менее as a stronger contrastive connector than но: Working from home is convenient. Nevertheless, I miss talking with colleagues."
    accepted_answers:
      - {value: "Работа из дома удобна. Тем не менее, мне не хватает общения с коллегами.", status: "correct"}
      - {value: "Работа из дома удобна. Тем не менее, мне не хватает общения с коллегами", status: "correct"}
    feedback: "The model answer is *Работа из дома удобна. Тем не менее, мне не хватает общения с коллегами*."
  ru.b1.unit53.lesson03.exercise01.choose_full_debate: {instruction: "Which answer concedes a valid point with хотя AND then uses тем не менее (a stronger connector than но) to restate the speaker's own position?", correct_option: "Хотя работа из дома действительно удобна, мне не хватает общения с коллегами. Тем не менее, я согласен, что дома легче сосредоточиться.", distractors: ["Я бы предложил перенести встречу на пятницу.", "Это моя коллега, с которой я работаю над новым проектом.", "Во-первых, мы гуляли в лесу. Во-вторых, мы готовили ужин."], accepted_answers: [{value: "Хотя работа из дома действительно удобна, мне не хватает общения с коллегами. Тем не менее, я согласен, что дома легче сосредоточиться.", status: "correct"}], feedback: "The correct answer concedes a point with хотя, then restates a position with тем не менее."}
  ru.b1.unit53.lesson03.exercise02.dialogue_comprehension_debaty:
    instruction: "Listen to the dialogue. What is Nastya's opinion, what point does Dima concede, and what does Dima restate with тем не менее?"
    correct_option: "Nastya thinks working from home is better because it saves time; Dima concedes it's convenient but misses colleagues; Dima restates that it's easier to concentrate at home"
    distractors: ["Nastya thinks the office is better; Dima concedes he dislikes colleagues; Dima restates that time is wasted", "Dima thinks working from home is better; Nastya concedes it's convenient; Nastya restates that she misses colleagues", "Nastya thinks working from home saves money; Dima concedes nothing; Dima restates that he prefers the office"]
    accepted_answers: [{value: "Nastya thinks working from home is better because it saves time; Dima concedes it's convenient but misses colleagues; Dima restates that it's easier to concentrate at home", status: "correct"}]
    feedback: "The debate moves from opinion, to a хотя concession, to a тем не менее restatement."
  ru.b1.unit53.lesson03.exercise03.match_dialogue_debaty:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я думаю, что работа из дома — это лучше.", right: "I think working from home is better."}
          - {left: "потому что экономишь время", right: "because you save time"}
          - {left: "Хотя работа из дома действительно удобна", right: "Although working from home really is convenient"}
          - {left: "мне не хватает общения с коллегами", right: "I miss talking with colleagues"}
          - {left: "Тем не менее, я согласен", right: "Nevertheless, I agree"}
          - {left: "дома легче сосредоточиться", right: "it's easier to concentrate at home"}
        status: "correct"
    feedback: "These phrases build the full debate, from opinion to concession to restated position."
  ru.b1.unit53.lesson03.exercise04.order_dima_restate: {instruction: "Put the words in order to say \"Nevertheless, I agree it's easier to concentrate at home.\"", accepted_answers: [{value: ["Тем", "не", "менее", "я", "согласен", "что", "дома", "легче", "сосредоточиться"], status: "correct"}], feedback: "The correct order is *Тем не менее, я согласен, что дома легче сосредоточиться*."}
  ru.b1.unit53.lesson03.exercise05.reply_concede_and_restate:
    instruction: "Nastya says \"Я думаю, что работа из дома — это лучше, потому что экономишь время.\" Reply, conceding first, with exactly: \"Тем не менее, я согласен, что дома легче сосредоточиться.\""
    accepted_answers:
      - {value: "Тем не менее, я согласен, что дома легче сосредоточиться.", status: "correct"}
      - {value: "Тем не менее, я согласен, что дома легче сосредоточиться", status: "correct"}
      - {value: "Тем не менее, я согласна, что дома легче сосредоточиться.", status: "correct"}
      - {value: "Тем не менее, я согласна, что дома легче сосредоточиться", status: "correct"}
    feedback: "The model answer restates a position with тем не менее."
  ru.b1.unit53.lesson03.exercise06.write_full_debate:
    instruction: "Write a short two-part argument about working from home: (1) concede one valid point using Хотя (working from home really is convenient), before stating your complaint (you miss talking with colleagues); (2) then use Тем не менее, a stronger connector than но, to restate your own position (you agree it's easier to concentrate at home)."
    accepted_answers:
      - {value: "Хотя работа из дома действительно удобна, мне не хватает общения с коллегами. Тем не менее, я согласен, что дома легче сосредоточиться.", status: "correct"}
      - {value: "Хотя работа из дома действительно удобна, мне не хватает общения с коллегами. Тем не менее, я согласна, что дома легче сосредоточиться.", status: "correct"}
    feedback: "A complete argument concedes one point with хотя before restating the position with тем не менее."
