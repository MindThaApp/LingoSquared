schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.a2.unit32"
source_language: "en"
target_language: "ru"
status: "reviewed"
generation_provenance: {method: "ai_generated", authoring_system: "codex", human_reviewed: false}
review: {status: "reviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Codex-authored draft. Needs fresh-context review."}

course:
  title: "Russian A2"
  description: "Learn A2-level Russian for online habits."

units:
  ru.a2.unit32.onlain_zhizn: {title: "Online life"}

lessons:
  ru.a2.unit32.lesson01.internet: {title: "Online every day"}
  ru.a2.unit32.lesson02.telefon: {title: "Phone and news"}
  ru.a2.unit32.lesson03.privychki: {title: "Dialogue: online habits"}

teaching:
  ru.a2.unit32.lesson01.teach.internet: {title: "интернет", gloss: "internet", note: "*интернетом* is the instrumental form after *пользуюсь*.", example_gloss: "Every day I use the internet."}
  ru.a2.unit32.lesson01.teach.polzuyus: {title: "Я пользуюсь интернетом.", gloss: "I use the internet.", note: "*пользоваться* takes instrumental: *интернетом*.", example_gloss: "How often do you use the internet?"}
  ru.a2.unit32.lesson01.teach.chasto: {title: "часто", gloss: "often", note: "*Как часто?* asks how often something happens.", example_gloss: "I am often online."}
  ru.a2.unit32.lesson02.teach.telefon: {title: "телефон", gloss: "phone", note: "*с телефона* means from or on a phone.", example_gloss: "I use the internet on my phone."}
  ru.a2.unit32.lesson02.teach.novosti: {title: "новости", gloss: "news", note: "*читать новости* means to read the news.", example_gloss: "I read the news online."}
  ru.a2.unit32.lesson02.teach.video: {title: "видео", gloss: "video", note: "*смотрю видео* means I watch videos.", example_gloss: "In the evening I watch videos."}
  ru.a2.unit32.lesson03.teach.nastya_frequency: {title: "Nastya asks about frequency", gloss: "Nastya: Dima, how often do you use the internet?", note: "Friends use informal *ты*."}
  ru.a2.unit32.lesson03.teach.dima_habit: {title: "Dima describes online habits", gloss: "Dima: Every day. I read the news online and watch videos.", note: "This gives the activity and frequency."}
  ru.a2.unit32.lesson03.teach.nastya_opinion: {title: "Nastya gives an opinion", gloss: "Nastya: In my opinion, it is useful, but sometimes takes a lot of time.", note: "*но* adds a simple contrast."}
  ru.a2.unit32.lesson03.teach.dima_limit: {title: "Dima describes a limit", gloss: "Dima: I agree. In the evening I try not to stay online.", note: "*стараюсь* means I try."}

exercises:
  ru.a2.unit32.lesson01.exercise01.recognize_internet: {instruction: "Which word means \"internet\"?", correct_option: "интернет", distractors: ["телефон", "новости", "видео"], accepted_answers: [{value: "интернет", status: "correct"}], feedback: "*интернет* means \"internet.\""}
  ru.a2.unit32.lesson01.exercise02.recognize_chasto: {instruction: "Which word means \"often\"?", correct_option: "часто", distractors: ["редко", "онлайн", "долго"], accepted_answers: [{value: "часто", status: "correct"}], feedback: "*часто* means \"often.\""}
  ru.a2.unit32.lesson01.exercise03.listen_select_news: {instruction: "Listen. What online habit does the speaker describe?", correct_option: "Using the internet every day.", distractors: ["Watching videos in the evening.", "Calling a staff member.", "Buying a phone."], accepted_answers: [{value: "Using the internet every day.", status: "correct"}], feedback: "The recording says *Каждый день я пользуюсь интернетом*."}
  ru.a2.unit32.lesson01.exercise04.match_online_basics:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "интернет", right: "internet"}
          - {left: "онлайн", right: "online"}
          - {left: "каждый день", right: "every day"}
          - {left: "часто", right: "often"}
          - {left: "редко", right: "rarely"}
          - {left: "пользуюсь интернетом", right: "I use the internet"}
        status: "correct"
    feedback: "These phrases describe how often you are online."
  ru.a2.unit32.lesson01.exercise05.order_use_internet: {instruction: "Put the words in order to say \"I use the internet every day.\"", accepted_answers: [{value: ["Я", "пользуюсь", "интернетом", "каждый", "день"], status: "correct"}], feedback: "The correct order is *Я пользуюсь интернетом каждый день*."}
  ru.a2.unit32.lesson01.exercise06.write_daily_use:
    instruction: "Write exactly this sentence: Every day I use the internet."
    accepted_answers:
      - {value: "Каждый день я пользуюсь интернетом.", status: "correct"}
      - {value: "Каждый день я пользуюсь интернетом", status: "correct"}
    feedback: "The model answer is *Каждый день я пользуюсь интернетом*."
  ru.a2.unit32.lesson02.exercise01.recognize_telefon: {instruction: "Which word means \"phone\"?", correct_option: "телефон", distractors: ["интернет", "новости", "видео"], accepted_answers: [{value: "телефон", status: "correct"}], feedback: "*телефон* means \"phone.\""}
  ru.a2.unit32.lesson02.exercise02.recognize_novosti: {instruction: "Which word means \"news\"?", correct_option: "новости", distractors: ["телефон", "видео", "онлайн"], accepted_answers: [{value: "новости", status: "correct"}], feedback: "*новости* means \"news.\""}
  ru.a2.unit32.lesson02.exercise03.listen_select_phone: {instruction: "Listen. What does the speaker use often?", correct_option: "A phone.", distractors: ["A laptop.", "A train.", "A receipt."], accepted_answers: [{value: "A phone.", status: "correct"}], feedback: "The recording says *Я часто пользуюсь телефоном*."}
  ru.a2.unit32.lesson02.exercise04.match_activities:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "телефон", right: "phone"}
          - {left: "пользуюсь телефоном", right: "I use a phone"}
          - {left: "новости", right: "news"}
          - {left: "читаю новости", right: "I read the news"}
          - {left: "видео", right: "video"}
          - {left: "смотрю видео", right: "I watch videos"}
        status: "correct"
    feedback: "These phrases name common online activities."
  ru.a2.unit32.lesson02.exercise05.order_read_news: {instruction: "Put the words in order to say \"I read the news online.\"", accepted_answers: [{value: ["Я", "читаю", "новости", "онлайн"], status: "correct"}], feedback: "The correct order is *Я читаю новости онлайн*."}
  ru.a2.unit32.lesson02.exercise06.write_phone_habit:
    instruction: "Write exactly this sentence: I often use my phone."
    accepted_answers:
      - {value: "Я часто пользуюсь телефоном.", status: "correct"}
      - {value: "Я часто пользуюсь телефоном", status: "correct"}
    feedback: "The model answer is *Я часто пользуюсь телефоном*."
  ru.a2.unit32.lesson03.exercise01.choose_habit_opinion: {instruction: "Which answer gives an online habit and an opinion?", correct_option: "Каждый день я читаю новости онлайн. По-моему, это полезно.", distractors: ["Как часто ты пользуешься интернетом?", "Телефон новый.", "Я редко онлайн."], accepted_answers: [{value: "Каждый день я читаю новости онлайн. По-моему, это полезно.", status: "correct"}], feedback: "This gives a habit and a simple opinion."}
  ru.a2.unit32.lesson03.exercise02.dialogue_comprehension_online:
    instruction: "Listen to the dialogue. What does Dima do online, how often, and what limit does he mention?"
    correct_option: "He reads news and watches videos every day; in the evening he tries not to stay online"
    distractors: ["He opens a bank account and asks about a card", "He reports a broken heater and asks for a repair", "He misses a train connection and asks about a platform"]
    accepted_answers: [{value: "He reads news and watches videos every day; in the evening he tries not to stay online", status: "correct"}]
    feedback: "Dima says he reads news and watches videos every day, then says he tries not to stay online in the evening."
  ru.a2.unit32.lesson03.exercise03.match_dialogue_online:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Как часто?", right: "How often?"}
          - {left: "Каждый день.", right: "Every day."}
          - {left: "читаю новости", right: "I read the news"}
          - {left: "смотрю видео", right: "I watch videos"}
          - {left: "это полезно", right: "it is useful"}
          - {left: "не сидеть онлайн", right: "not stay online"}
        status: "correct"
    feedback: "These lines describe online habits and an opinion."
  ru.a2.unit32.lesson03.exercise04.order_use_phone: {instruction: "Put the words in order to say \"I often use my phone.\"", accepted_answers: [{value: ["Я", "часто", "пользуюсь", "телефоном"], status: "correct"}], feedback: "The correct order is *Я часто пользуюсь телефоном*."}
  ru.a2.unit32.lesson03.exercise05.respond_frequency:
    instruction: "Nastya asks \"Как часто ты пользуешься интернетом?\" Answer with the exact sentence: \"Каждый день я читаю новости онлайн.\""
    accepted_answers:
      - {value: "Каждый день я читаю новости онлайн.", status: "correct"}
      - {value: "Каждый день я читаю новости онлайн", status: "correct"}
    feedback: "The model answer is *Каждый день я читаю новости онлайн*."
  ru.a2.unit32.lesson03.exercise06.write_online_habit_message:
    instruction: "Write three short sentences: say you use the internet on your phone every day, say you often read news online, and give the opinion \"По-моему, это полезно, но иногда занимает много времени.\""
    accepted_answers:
      - {value: "Каждый день я пользуюсь интернетом с телефона. Я часто читаю новости онлайн. По-моему, это полезно, но иногда занимает много времени.", status: "correct"}
      - {value: "Каждый день я пользуюсь интернетом с телефона. Я часто читаю новости онлайн. По-моему это полезно но иногда занимает много времени.", status: "correct"}
    feedback: "A complete message gives daily use, an online activity, and one opinion."
