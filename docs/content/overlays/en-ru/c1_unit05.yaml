  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Overlay for ru's C1 unit05 on counterfactual reasoning. English-speaker
    interference risks: (1) Russian counterfactuals use "бы + past tense" for
    BOTH past and present hypothetical results, so the time reference comes
    from the time adverb ("тогда" vs "сейчас") and the verb's aspect — the
    overlay glosses pin each sentence's time explicitly; (2) the production
    prompts name the exact taught model and accept that string with and
    without the final period, so a learner is never asked to choose among
    several counterfactual forms; (3) every production model is gender-neutral
    (impersonal "мне ... предложили", "надо было + infinitive", neuter "всё
    ... было бы / сложилось бы"), so a learner of either gender reproduces the
    exact string; (4) the culminating speaking and writing exercises each
    require the WHOLE act — one past counterfactual, one mixed conditional
    with a present consequence, and one expression of regret. No
    sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    accepted answers against grading (no ё/е folding; spoken 'все' graded
    INCORRECT), instructions, notes. Fixes: е-spelled variants added to
    write_nado_bylo, speak_smeshannyj, speak_cep, speak_analiz, write_analiz
    (the three speak_* were HIGH: a correct speaker was graded incorrect);
    lesson02.exercise05.translate_tretiy_tip widened to every combination of
    'мне тогда'/'тогда мне', 'всё сложилось бы'/'всё бы сложилось', ё/е;
    notes de-meta'd: lesson05.teach.zveno_cepi (dropped 'It is the exact
    link the listening task tests.'), lesson06.teach.modello_polnyj ('This
    is the model to reproduce: ...'), lesson06.teach.kontrfaktualnyj_analiz
    (dropped 'the written product this outcome asks you to produce'),
    lesson02.teach.slozhilos_by_inache_again ('already met in lesson 1' ->
    cites the lesson01 model sentence). NATIVE FLAG: narrative coherence
    (see realization review). DEFERRED: dictation_smeshannyj ё/е (grader
    folding, owner decision).

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 3 fixes
    (word_order alternates) -- overlay order_nado_bylo, order_tretiy_tip,
    order_smeshannyj, order_sozhalenie: added valid word-order variants
    (Тогда надо было / ...согласиться тогда; тогда мне / мне предложили
    тогда; всё сейчас / сейчас всё бы; тянуть с решением так долго). Written
    and typed ё/е answers re-checked: OK. NATIVE FLAGS: carried over
    narrative-coherence flag (offer vs no offer). DEFERRED:
    dictation_smeshannyj ё/е (grader folding, owner decision).

course:
  title: "Russian C1"
  description: "Advanced Russian reasoning: past counterfactuals, mixed conditionals, and expressions of regret."

units:
  ru.c1.unit05.kontrfaktualy:
    title: "Counterfactuals"
    description: "Reason about unreal situations: past conditionals, mixed conditionals, and regret for a past decision."

lessons:
  ru.c1.unit05.kontrfaktualy.lesson01.nado_bylo:
    title: "Should have"
  ru.c1.unit05.kontrfaktualy.lesson02.tretiy_tip:
    title: "The third type: если бы"
  ru.c1.unit05.kontrfaktualy.lesson03.smeshannyj_tip:
    title: "The mixed conditional"
  ru.c1.unit05.kontrfaktualy.lesson04.sozhalenie:
    title: "Regret"
  ru.c1.unit05.kontrfaktualy.lesson05.cep_kontrfaktualov:
    title: "The counterfactual chain"
  ru.c1.unit05.kontrfaktualy.lesson06.polnyj_analiz:
    title: "The complete analysis"

teaching:
  ru.c1.unit05.kontrfaktualy.lesson01.teach.nado_bylo_soglasitsya:
    title: "I should have agreed"
    gloss: "I should have agreed back then."
    note: "*Надо было* ('should have' — literally 'it was necessary') plus an infinitive expresses a past obligation that was not met. *Тогда* = 'back then'. The whole phrase is gender-neutral, so any speaker can say it."
  ru.c1.unit05.kontrfaktualy.lesson01.teach.slozhilos_by_inache:
    title: "everything would have turned out differently"
    gloss: "Everything would have turned out differently."
    note: "*Сложилось бы* is the past conditional of *сложиться* (to turn out): past-tense *сложилось* + particle *бы*. *Иначе* = 'differently'. The subject *всё* (everything) is neuter, so there is no gender agreement to worry about."
  ru.c1.unit05.kontrfaktualy.lesson01.teach.moglo_by_slozhitsya:
    title: "everything could have turned out differently"
    gloss: "Everything could have turned out differently."
    note: "*Могло бы сложиться* ('could have turned out') swaps *сложилось* for the modal *могло* (could) + infinitive *сложиться*. *Могло* is neuter, matching *всё*."
  ru.c1.unit05.kontrfaktualy.lesson01.teach.modello_nado_bylo:
    title: "A past counterfactual"
    gloss: "I should have agreed back then, and everything would have turned out differently."
    note: "This is a past counterfactual: an unmet past obligation (*надо было согласиться*) is linked by *и* (and) to a past hypothetical result (*всё сложилось бы иначе*). What actually happened is left unsaid — the counterfactual is the whole point."

  ru.c1.unit05.kontrfaktualy.lesson02.teach.esli_by_predlozhili:
    title: "if I had been offered this job"
    gloss: "If I had been offered this job back then"
    note: "*Если бы* ('if only / had') plus a past tense builds an unreal past condition. *Мне ... предложили* is impersonal — the third-person plural *предложили* (they offered) with dative *мне* (to me), so no speaker gender is forced."
  ru.c1.unit05.kontrfaktualy.lesson02.teach.slozhilos_by_inache_again:
    title: "the past hypothetical result"
    gloss: "everything would have turned out differently"
    note: "The result clause *всё сложилось бы иначе* is the same past hypothetical result as in *Надо было тогда согласиться, и всё сложилось бы иначе*; here it completes an unreal *если бы* condition."
  ru.c1.unit05.kontrfaktualy.lesson02.teach.esli_by_poshlo_inache:
    title: "if everything had gone differently"
    gloss: "If everything had gone differently"
    note: "*Если бы всё пошло иначе* is another unreal past condition. *Пошло* (went, neuter) agrees with the neuter subject *всё*."
  ru.c1.unit05.kontrfaktualy.lesson02.teach.modello_tretiy_tip:
    title: "A third-type conditional"
    gloss: "If I had been offered this job back then, everything would have turned out differently."
    note: "This third-type conditional pairs an unreal past condition (*если бы ... предложили*) with a past hypothetical result (*всё сложилось бы иначе*). Both halves refer to the past, which never actually happened."

  ru.c1.unit05.kontrfaktualy.lesson03.teach.esli_by_ne_somneniya:
    title: "if not for my doubts"
    gloss: "If not for my doubts"
    note: "*Если бы не* + a noun ('if it were not for') states an unreal condition through a noun rather than a past verb. *Мои сомнения* = 'my doubts'. Using a noun avoids the gendered past-tense form entirely."
  ru.c1.unit05.kontrfaktualy.lesson03.teach.seychas_bylo_by_inache:
    title: "now everything would be different"
    gloss: "Now everything would be different."
    note: "*Сейчас* ('now') marks the present consequence. *Всё было бы иначе* uses the conditional *было бы* (neuter, with *всё*) — present hypothetical, not past."
  ru.c1.unit05.kontrfaktualy.lesson03.teach.vyglyadelo_by_inache:
    title: "now everything would look different"
    gloss: "Now everything would look different."
    note: "*Выглядело бы* ('would look', neuter past of *выглядеть* + *бы*) is another present-consequence form. It contrasts with *было бы* (would be) — look vs. be."
  ru.c1.unit05.kontrfaktualy.lesson03.teach.modello_smeshannyj:
    title: "A mixed conditional"
    gloss: "If not for my doubts, now everything would be different."
    note: "A mixed conditional links a past unreal condition (*если бы не мои сомнения*) to a present consequence (*сейчас всё было бы иначе*). The condition is past, the consequence is present."

  ru.c1.unit05.kontrfaktualy.lesson04.teach.ne_nado_bylo_tyanut:
    title: "I should not have dragged out the decision"
    gloss: "I should not have dragged out the decision so long."
    note: "*Не надо было* ('I shouldn't have') is the negated *надо было*. *Так долго* = 'so long', *тянуть* = 'to drag out', *с решением* = 'with the decision'. This is a pure regret — no result clause follows."
  ru.c1.unit05.kontrfaktualy.lesson04.teach.nado_bylo_reshat_ranshe:
    title: "I should have decided earlier"
    gloss: "I should have decided earlier."
    note: "*Надо было решать* ('I should have decided') + *раньше* ('earlier') is the affirmative form of the same regret pattern."
  ru.c1.unit05.kontrfaktualy.lesson04.teach.ne_hvatilo_reshitelnosti:
    title: "I lacked decisiveness"
    gloss: "I lacked decisiveness."
    note: "*Мне не хватило решительности* ('I lacked decisiveness') names the failing. *Хватило* (neuter past of *хватить*) is impersonal; *решительности* is the genitive of *решительность*."
  ru.c1.unit05.kontrfaktualy.lesson04.teach.modello_sozhalenie:
    title: "An expression of regret"
    gloss: "I should not have dragged out the decision so long."
    note: "This sentence regrets the delay — the regret is about the timing of the decision, not about the decision itself, and no hypothetical result is stated."

  ru.c1.unit05.kontrfaktualy.lesson05.teach.fakt:
    title: "the real fact"
    gloss: "Actually, nothing changed."
    note: "*На самом деле* ('actually / in fact') introduces the real timeline. *Ничего не изменилось* = 'nothing changed' — the fact that actually happened, against which every counterfactual is measured."
  ru.c1.unit05.kontrfaktualy.lesson05.teach.zveno_cepi:
    title: "a link in the chain"
    gloss: "If I had been offered this job back then, now everything would be different."
    note: "This single sentence is a mixed counterfactual chain: a past unreal condition (*если бы ... предложили*) linked to a present consequence (*сейчас всё было бы иначе*)."
  ru.c1.unit05.kontrfaktualy.lesson05.teach.polnaya_cep:
    title: "the counterfactual chain"
    gloss: "Actually, nothing changed. If I had been offered this job back then, everything would have turned out differently. If not for my doubts, now everything would be different. I should not have dragged out the decision so long."
    note: "The chain assembles the real fact, a past counterfactual, a mixed conditional, and a regret. It distinguishes what happened from every hypothetical alternative."

  ru.c1.unit05.kontrfaktualy.lesson06.teach.modello_polnyj:
    title: "The complete analysis"
    gloss: "If I had been offered this job back then, everything would have turned out differently. If not for my doubts, now everything would be different. I should not have dragged out the decision so long."
    note: "This is the model to reproduce: a past counterfactual, a mixed conditional with a present consequence, and an expression of regret, in that order."
  ru.c1.unit05.kontrfaktualy.lesson06.teach.kontrfaktualnyj_analiz:
    title: "the counterfactual analysis"
    gloss: "counterfactual analysis"
    note: "*Контрфактуальный анализ* ('counterfactual analysis') is an account of how things could or would have been different."
    example_gloss: "This is a counterfactual analysis."

