course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Talk about real conditions and what follows, with если."
units:
  ru.a2.unit82.esli_to: {"title": "If, then", "description": "Talk about real conditions with если in the present, the future and with a command."}
lessons:
  ru.a2.unit82.lesson01.esli_seychas: {"title": "If it rains (general)"}
  ru.a2.unit82.lesson02.esli_budet: {"title": "If it will be"}
  ru.a2.unit82.lesson03.esli_hochesh: {"title": "If you want, come"}
  ru.a2.unit82.lesson04.chto_sdelaesh: {"title": "What will you do if"}
  ru.a2.unit82.lesson05.subbota: {"title": "Saturday plans"}
  ru.a2.unit82.lesson06.dialog: {"title": "What are we doing on Saturday"}
teaching:
  ru.a2.unit82.lesson01.teach.esli: {"title": "If", "gloss": "if / I stay / busy (man) / busy (woman) / answers", "note": "*Если* introduces a condition that is true in general or happens regularly. The verb stays in the present.", "example_gloss": ["If it is raining, I stay at home.", "If Nastya is busy, she does not answer.", "If Dima is busy, he does not answer.", "If it is cold, we drink tea."]}
  ru.a2.unit82.lesson01.teach.gn_esli: {"title": "Если + present", "gloss": "If it is raining, I stay at home.", "note": "*Если* begins the condition. Put a comma at its end and then say the result. Both parts are in the present for a general rule."}
  ru.a2.unit82.lesson01.teach.gn_to: {"title": "То after the comma", "gloss": "If it is raining, then I stay at home.", "note": "After the comma you may add *то* ('then'). It is optional: the sentence means the same without it."}
  ru.a2.unit82.lesson02.teach.budet: {"title": "Future conditions", "gloss": "will be / time / will come / we will stay / we will have dinner / together", "note": "For the future Russian uses the future after *если*: *будет*, *придёт*. Do not use the present as English does.", "example_gloss": ["If it rains tomorrow, we will stay at home.", "If I have time, I will call you.", "If Dima comes, we will have dinner together."]}
  ru.a2.unit82.lesson02.teach.gn_budet: {"title": "Future after если", "gloss": "If it rains tomorrow, we will stay at home.", "note": "When the condition is about the future, put the future in both parts: *будет дождь* and *мы останемся*."}
  ru.a2.unit82.lesson02.teach.gn_vremya: {"title": "У меня будет", "gloss": "If I have time, I will call you.", "note": "*У меня будет время* literally means 'to me there will be time'. The result *я позвоню* is also in the future."}
  ru.a2.unit82.lesson03.teach.hochesh: {"title": "If you want", "gloss": "you want / come! / put on! / jacket / have a rest! / ask! / on Saturday", "note": "After *если* you can give a friend advice with a command: *приходи, надень, отдохни, спроси*.", "example_gloss": ["If you want, come on Saturday.", "If it is cold, put on a jacket.", "If you are tired, have a rest.", "If you do not know, ask."]}
  ru.a2.unit82.lesson03.teach.gn_imp: {"title": "Если + command", "gloss": "If you want, come. If it is cold, put on a jacket.", "note": "The first part says the condition, the second part is a command to a friend (*ты*)."}
  ru.a2.unit82.lesson03.teach.gn_ne: {"title": "Не знаешь, спроси", "gloss": "If you do not know, ask. If you are tired, have a rest.", "note": "The condition can be negative: *не знаешь*. For a short condition you may drop *ты*."}
  ru.a2.unit82.lesson04.teach.sdelaesh: {"title": "What will you do if", "gloss": "you will do / he or she will do / (it) starts / I will be late / you will be late / will call", "note": "*Если пойдёт дождь* means 'if it starts to rain'. *Сделаешь* and *опоздаешь* are future forms for *ты*.", "example_gloss": ["What will you do if it rains?", "If it rains, I will stay at home.", "What will you do if you are late?", "What will Nastya do if Dima does not call?"]}
  ru.a2.unit82.lesson04.teach.gn_q: {"title": "Question and answer", "gloss": "What will you do if it rains? If it rains, I will stay at home.", "note": "The question puts *если* at the end. The answer starts with *если* and gives the result."}
  ru.a2.unit82.lesson04.teach.gn_pers: {"title": "The verb follows the person", "gloss": "If you are late, I will call. If I am late, I will call.", "note": "In the condition the verb agrees with its own person: *ты опоздаешь*, *я опоздаю*."}
  ru.a2.unit82.lesson05.teach.v5: {"title": "Words for the note", "gloss": "to walk / I will buy / hi / bye", "note": "*Идти гулять* means 'to go for a walk'.", "example_gloss": ["On Saturday we are going for a walk.", "If I have time, I will buy bread."]}
  ru.a2.unit82.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! On Saturday we are going for a walk. If it rains, we will stay at home. If it is cold, I will put on a jacket. If you want, call me in the evening. If I have time, I will buy bread. Bye! Dima", "note": "The note uses если with the future (будет) and with a command (позвони).", "glosses": {"надену": "I will put on", "куплю": "I will buy"}}
  ru.a2.unit82.lesson06.teach.q: {"title": "Nastya asks about Saturday", "gloss": "Настя: Dima, what are we doing on Saturday?"}
  ru.a2.unit82.lesson06.teach.a: {"title": "Dima gives the plan", "gloss": "Дима: We are going for a walk. If it rains, we will stay at home."}
  ru.a2.unit82.lesson06.teach.q2: {"title": "Nastya asks about the cold", "gloss": "Настя: And if it is cold?"}
  ru.a2.unit82.lesson06.teach.a2: {"title": "Dima answers", "gloss": "Дима: If it is cold, I will put on a jacket. If you want, call me in the evening."}
  ru.a2.unit82.lesson06.teach.end: {"title": "Nastya agrees", "gloss": "Настя: Good. If I have time, I will call."}
exercises:
  ru.a2.unit82.lesson01.exercise01.rain: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Если идёт дождь, я остаюсь дома.", "distractors": ["Если идёт дождь, я иду гулять.", "Идёт дождь, если я остаюсь дома.", "Если идёт дождь, я остаётся дома."], "accepted_answers": [{"value": "Если идёт дождь, я остаюсь дома.", "status": "correct"}], "feedback": "*Если* + the condition, then the result."}
  ru.a2.unit82.lesson01.exercise02.busy: {"instruction": "Choose the correct English meaning.", "correct_option": "If Nastya is busy, she does not answer.", "distractors": ["If Nastya is busy, she answers.", "Nastya is busy because she does not answer.", "If Nastya answers, she is busy."], "accepted_answers": [{"value": "If Nastya is busy, she does not answer.", "status": "correct"}], "feedback": "*Если* = if."}
  ru.a2.unit82.lesson01.exercise03.w1: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "если", "right": "if"}, {"left": "остаюсь", "right": "I stay"}, {"left": "занят", "right": "busy (a man)"}, {"left": "занята", "right": "busy (a woman)"}, {"left": "отвечает", "right": "answers"}, {"left": "то", "right": "then"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit82.lesson01.exercise04.tea: {"instruction": "Put the words in order to say 'If it is cold, we drink tea.'", "correct_option": "Если холодно мы пьём чай", "accepted_answers": [{"value": "Если холодно мы пьём чай", "status": "correct"}], "feedback": "The condition comes first."}
  ru.a2.unit82.lesson01.exercise05.esli: {"instruction": "Complete the sentence: 'If it is raining, I stay at home.'", "correct_option": "Если", "accepted_answers": [{"value": "Если", "status": "correct"}], "feedback": "*Если* = if."}
  ru.a2.unit82.lesson01.exercise06.tired: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Если я устал, я остаюсь дома.", "status": "correct"}, {"value": "Если я устал, я остаюсь дома", "status": "correct"}], "feedback": "A man says *устал*."}
  ru.a2.unit82.lesson01.exercise07.nastya: {"instruction": "Write the requested Russian sentence.", "correct_option": "Если холодно, Настя пьёт чай.", "accepted_answers": [{"value": "Если холодно, Настя пьёт чай.", "status": "correct"}, {"value": "Если холодно, Настя пьёт чай", "status": "correct"}, {"value": "Если холодно, то Настя пьёт чай.", "status": "correct"}, {"value": "Если холодно, то Настя пьёт чай", "status": "correct"}], "feedback": "*Если* + condition, then the result."}
  ru.a2.unit82.lesson02.exercise01.dima: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Если Дима придёт, мы поужинаем вместе.", "distractors": ["Если Дима пришла, мы поужинаем вместе.", "Если Дима придёт, мы поужинали вместе.", "Если Дима придёт, мы поужинал вместе."], "accepted_answers": [{"value": "Если Дима придёт, мы поужинаем вместе.", "status": "correct"}], "feedback": "Future in both parts."}
  ru.a2.unit82.lesson02.exercise02.time: {"instruction": "Choose the correct English meaning.", "correct_option": "If I have time, I will call you.", "distractors": ["If I had time, I called you.", "If I call you, I will have time.", "I have time, so I will call you."], "accepted_answers": [{"value": "If I have time, I will call you.", "status": "correct"}], "feedback": "*Будет время* = there will be time."}
  ru.a2.unit82.lesson02.exercise03.w2: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "будет", "right": "will be"}, {"left": "время", "right": "time"}, {"left": "придёт", "right": "will come"}, {"left": "останемся", "right": "we will stay"}, {"left": "поужинаем", "right": "we will have dinner"}, {"left": "вместе", "right": "together"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit82.lesson02.exercise04.rain: {"instruction": "Put the words in order to say 'If it rains tomorrow, we will stay at home.'", "correct_option": "Если завтра будет дождь мы останемся дома", "accepted_answers": [{"value": "Если завтра будет дождь мы останемся дома", "status": "correct"}], "feedback": "Future in both parts."}
  ru.a2.unit82.lesson02.exercise05.budet: {"instruction": "Complete the sentence: 'If it rains tomorrow, we will stay at home.'", "correct_option": "будет", "accepted_answers": [{"value": "будет", "status": "correct"}], "feedback": "*Будет дождь* = it will rain."}
  ru.a2.unit82.lesson02.exercise06.time: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Если у меня будет время, я позвоню тебе.", "status": "correct"}, {"value": "Если у меня будет время, я позвоню тебе", "status": "correct"}], "feedback": "*У меня будет время*."}
  ru.a2.unit82.lesson02.exercise07.dima2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Если Дима придёт, мы поужинаем вместе.", "accepted_answers": [{"value": "Если Дима придёт, мы поужинаем вместе.", "status": "correct"}, {"value": "Если Дима придёт, мы поужинаем вместе", "status": "correct"}], "feedback": "*Придёт* and *поужинаем* are both future."}
  ru.a2.unit82.lesson03.exercise01.hochesh: {"instruction": "Choose the correct English meaning.", "correct_option": "If you want, come on Saturday.", "distractors": ["If you come on Saturday, I want.", "If I want, I will come on Saturday.", "If you want, do not come on Saturday."], "accepted_answers": [{"value": "If you want, come on Saturday.", "status": "correct"}], "feedback": "*Приходи* = come (to a friend)."}
  ru.a2.unit82.lesson03.exercise02.jacket: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Если холодно, надень куртку.", "distractors": ["Если холодно, надень куртка.", "Если холодно, надень куртки.", "Если холодно, надела куртку."], "accepted_answers": [{"value": "Если холодно, надень куртку.", "status": "correct"}], "feedback": "A command to a friend: *надень*."}
  ru.a2.unit82.lesson03.exercise03.w3: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "хочешь", "right": "you want"}, {"left": "приходи", "right": "come!"}, {"left": "надень", "right": "put on!"}, {"left": "куртку", "right": "jacket"}, {"left": "отдохни", "right": "have a rest!"}, {"left": "спроси", "right": "ask!"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit82.lesson03.exercise04.ask: {"instruction": "Put the words in order to say 'If you do not know, ask.'", "correct_option": "Если не знаешь спроси", "accepted_answers": [{"value": "Если не знаешь спроси", "status": "correct"}], "feedback": "*Не* stands before the verb."}
  ru.a2.unit82.lesson03.exercise05.rest: {"instruction": "Complete the sentence: 'If you are tired, have a rest.'", "correct_option": "отдохни", "accepted_answers": [{"value": "отдохни", "status": "correct"}], "feedback": "A friend is told: *отдохни*."}
  ru.a2.unit82.lesson03.exercise06.come: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Если хочешь, приходи в субботу.", "status": "correct"}, {"value": "Если хочешь, приходи в субботу", "status": "correct"}], "feedback": "*Приходи* is the ты-command."}
  ru.a2.unit82.lesson03.exercise07.jacket2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Если холодно, надень куртку.", "accepted_answers": [{"value": "Если холодно, надень куртку.", "status": "correct"}, {"value": "Если холодно, надень куртку", "status": "correct"}], "feedback": "*Надень куртку*."}
  ru.a2.unit82.lesson04.exercise01.q: {"instruction": "Choose the correct answer.", "correct_option": "Если пойдёт дождь, я останусь дома.", "distractors": ["Если пойдёт дождь, я останемся дома.", "Если пойдёт дождь, я остался дома.", "Если пойдёт дождь, поэтому я останусь дома."], "accepted_answers": [{"value": "Если пойдёт дождь, я останусь дома.", "status": "correct"}], "feedback": "Future in both parts."}
  ru.a2.unit82.lesson04.exercise02.late: {"instruction": "Choose the correct Russian question.", "correct_option": "Что ты сделаешь, если опоздаешь?", "distractors": ["Что ты сделаешь, если опоздаю?", "Что я сделаешь, если опоздаешь?", "Что ты сделал, если опоздаешь?"], "accepted_answers": [{"value": "Что ты сделаешь, если опоздаешь?", "status": "correct"}], "feedback": "*Ты ... опоздаешь*."}
  ru.a2.unit82.lesson04.exercise03.w4: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "сделаешь", "right": "you will do"}, {"left": "сделает", "right": "he or she will do"}, {"left": "пойдёт", "right": "(it) starts to go"}, {"left": "опоздаю", "right": "I will be late"}, {"left": "опоздаешь", "right": "you will be late"}, {"left": "позвонит", "right": "he or she will call"}], "status": "correct"}], "feedback": "The ending shows the person."}
  ru.a2.unit82.lesson04.exercise04.q: {"instruction": "Put the words in order to ask 'What will you do if it rains?'", "correct_option": "Что ты сделаешь если пойдёт дождь", "accepted_answers": [{"value": "Что ты сделаешь если пойдёт дождь", "status": "correct"}], "feedback": "*Если* ends the question."}
  ru.a2.unit82.lesson04.exercise05.late: {"instruction": "Complete the sentence: 'If I am late, I will call.'", "correct_option": "опоздаю", "accepted_answers": [{"value": "опоздаю", "status": "correct"}], "feedback": "With *я* the ending is *-ю*: *опоздаю*."}
  ru.a2.unit82.lesson04.exercise06.nastya: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Что Настя сделает, если Дима не позвонит?", "status": "correct"}, {"value": "Что Настя сделает, если Дима не позвонит", "status": "correct"}], "feedback": "*Если Дима не позвонит*."}
  ru.a2.unit82.lesson04.exercise07.rain: {"instruction": "Write the requested Russian sentence.", "correct_option": "Если пойдёт дождь, я останусь дома.", "accepted_answers": [{"value": "Если пойдёт дождь, я останусь дома.", "status": "correct"}, {"value": "Если пойдёт дождь, я останусь дома", "status": "correct"}, {"value": "Если пойдёт дождь, то я останусь дома.", "status": "correct"}, {"value": "Если пойдёт дождь, то я останусь дома", "status": "correct"}], "feedback": "Future in both parts."}
  ru.a2.unit82.lesson05.exercise01.r1: {"instruction": "Read the text and choose the answer.", "correct_option": "Stay at home.", "distractors": ["Go for a walk.", "Buy bread.", "Call a friend."], "accepted_answers": [{"value": "Stay at home.", "status": "correct"}], "feedback": "*Если будет дождь, мы останемся дома.*"}
  ru.a2.unit82.lesson05.exercise02.r2: {"instruction": "Read the text and choose the answer.", "correct_option": "Put on a jacket.", "distractors": ["Stay at home.", "Have dinner.", "Call Nastya."], "accepted_answers": [{"value": "Put on a jacket.", "status": "correct"}], "feedback": "*Если будет холодно, я надену куртку.*"}
  ru.a2.unit82.lesson05.exercise03.m5: {"instruction": "Match each sentence from the note to its English meaning.", "accepted_answers": [{"value": [{"left": "В субботу мы идём гулять.", "right": "On Saturday we are going for a walk."}, {"left": "Если будет дождь, мы останемся дома.", "right": "If it rains, we will stay at home."}, {"left": "Если будет холодно, я надену куртку.", "right": "If it is cold, I will put on a jacket."}, {"left": "Если хочешь, позвони мне вечером.", "right": "If you want, call me in the evening."}, {"left": "Если у меня будет время, я куплю хлеб.", "right": "If I have time, I will buy bread."}, {"left": "Пока!", "right": "Bye!"}], "status": "correct"}], "feedback": "All lines are from Dima's note."}
  ru.a2.unit82.lesson05.exercise04.o5: {"instruction": "Put the words in order to say 'If it rains, we will stay at home.' (Dima is writing)", "correct_option": "Если будет дождь мы останемся дома", "accepted_answers": [{"value": "Если будет дождь мы останемся дома", "status": "correct"}], "feedback": "Future in both parts."}
  ru.a2.unit82.lesson05.exercise05.t5: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Если хочешь, позвони мне вечером.", "status": "correct"}, {"value": "Если хочешь, позвони мне вечером", "status": "correct"}, {"value": "Если хочешь, вечером позвони мне.", "status": "correct"}, {"value": "Если хочешь, вечером позвони мне", "status": "correct"}], "feedback": "*Позвони* is the ты-command."}
  ru.a2.unit82.lesson05.exercise06.d1: {"instruction": "Type what you hear.", "correct_response": "Если будет дождь, мы останемся дома.", "orthography_strict": true, "feedback": "You heard *Если будет дождь, мы останемся дома.*"}
  ru.a2.unit82.lesson05.exercise07.d2: {"instruction": "Type what you hear.", "correct_response": "Если будет холодно, я надену куртку.", "orthography_strict": true, "feedback": "You heard *Если будет холодно, я надену куртку.*"}
  ru.a2.unit82.lesson06.exercise01.l1: {"instruction": "Listen and select Nastya's opening question.", "correct_option": "Дима, что мы делаем в субботу?", "distractors": ["Дима, что мы делали в субботу?", "Настя, что мы делаем в субботу?", "Дима, что ты делаешь в субботу?"], "accepted_answers": [{"value": "Дима, что мы делаем в субботу?", "status": "correct"}], "feedback": "Nastya opens with *Дима, что мы делаем в субботу?*"}
  ru.a2.unit82.lesson06.exercise02.c1: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "Put on a jacket.", "distractors": ["Stay at home.", "Call Nastya.", "Buy bread."], "accepted_answers": [{"value": "Put on a jacket.", "status": "correct"}], "feedback": "Dima says: *Если будет холодно, я надену куртку.*"}
  ru.a2.unit82.lesson06.exercise03.m6: {"instruction": "Match each line from the dialogue to its English meaning.", "accepted_answers": [{"value": [{"left": "Что мы делаем в субботу?", "right": "What are we doing on Saturday?"}, {"left": "Мы идём гулять.", "right": "We are going for a walk."}, {"left": "А если будет холодно?", "right": "And if it is cold?"}, {"left": "Я надену куртку.", "right": "I will put on a jacket."}, {"left": "Если хочешь, позвони мне вечером.", "right": "If you want, call me in the evening."}, {"left": "Если у меня будет время, я позвоню.", "right": "If I have time, I will call."}], "status": "correct"}], "feedback": "These lines come from the dialogue."}
  ru.a2.unit82.lesson06.exercise04.o6: {"instruction": "Put the words in order to say 'If it is cold, I will put on a jacket.' (Dima is speaking)", "correct_option": "Если будет холодно я надену куртку", "accepted_answers": [{"value": "Если будет холодно я надену куртку", "status": "correct"}], "feedback": "Future in both parts."}
