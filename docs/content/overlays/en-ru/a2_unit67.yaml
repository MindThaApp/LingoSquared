teaching:
  ru.a2.unit67.lesson01.teach.perenesti_otmenit:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*Перенести* means to move an appointment to another time. *Отменить* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  ru.a2.unit67.lesson01.teach.k_sozhaleniyu_izvinite:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*К сожалению* is a polite way to give bad news. *Извините* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  ru.a2.unit67.lesson01.teach.parikmakherskaya:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*Парикмахерская* is the place; *парикмахер* is the person.'
    example_gloss: The salon is open from nine to six.
  ru.a2.unit67.lesson01.teach.mogu_ya_perenesti:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: '*Могу я ...?* asks whether something is possible. The infinitive *перенести* follows *могу*.'
  ru.a2.unit67.lesson01.teach.k_sozhaleniyu_ya:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  ru.a2.unit67.lesson01.teach.ya_ne_mogu:
    title: Могу + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *могу* the second verb is an infinitive. In a statement, *не* goes directly before *могу*: *Я не могу прийти в четверг*. The day (*в четверг*) comes after the infinitive. In a question *могу* comes first: *Могу я перенести запись?*'
  ru.a2.unit67.lesson02.teach.drugoy_den:
    title: Another day
    gloss: another day
    note: '*Другой* agrees with the noun: *другой день* (masculine), *другая встреча* (feminine).'
    example_gloss: Can it also be on another day?
  ru.a2.unit67.lesson02.teach.a_v_ponedelnik:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'A weekday takes *в* + accusative: *в понедельник*, *в пятницу* (feminine nouns change their ending), *во вторник*. *Можно* means ''is it possible?'''
  ru.a2.unit67.lesson02.teach.vam_podkhodit_pyatnitsa:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*Подходить* means ''to suit''. The person who is suited goes in the dative: *Вам подходит пятница?* (formal *Вы* becomes *Вам*; with a friend it would be *Тебе*).'
  ru.a2.unit67.lesson02.teach.da_mne_eto:
    title: Saying yes
    gloss: Yes, that suits me well.
  ru.a2.unit67.lesson02.teach.k_sozhaleniyu_net:
    title: Saying no politely
    gloss: Unfortunately not.
  ru.a2.unit67.lesson02.teach.vam_podkhodit_pyatnitsa_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: 'Say *подходить* in one piece: *Вам подходит пятница?* The person it suits goes in the dative (*вам*, *мне*). The answer *Да, мне это отлично подходит* confirms; a polite refusal is *К сожалению, нет*.'
  ru.a2.unit67.lesson03.teach.potomu_chto_mne:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Потому что* joins two full sentences and gives the reason; put a comma before it. *Мне жаль* is a more careful apology than *извините*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  ru.a2.unit67.lesson03.teach.neudobstvo:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Извините за неудобство* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  ru.a2.unit67.lesson03.teach.ya_ne_mogu:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  ru.a2.unit67.lesson03.teach.ya_ne_mogu_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  ru.a2.unit67.lesson03.teach.ya_ne_mogu_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: 'After *потому что* the word order is the ordinary one: subject, then verb. Always put a comma before *потому что*: *Я не могу прийти, потому что я болею.* Keep both words; *потому* alone is not enough.'
  ru.a2.unit67.lesson04.teach.dogovoritsya_zaranee:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*Договориться* is to agree on a time or place together. *Заранее* means ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  ru.a2.unit67.lesson04.teach.v_ponedelnik_v:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  ru.a2.unit67.lesson04.teach.vy_smozhete_priyti:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*Вы сможете* is the polite form of *ты сможешь*. The infinitive *прийти* follows.'
  ru.a2.unit67.lesson04.teach.togda_zhdyom_vas:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  ru.a2.unit67.lesson04.teach.togda_ya_sdelayu:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  ru.a2.unit67.lesson04.teach.v_ponedelnik_v_2:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'Give the day with *в* + accusative and the time with *в* + the hour: *в понедельник в десять часов*. In a polite question use *Вы сможете ...?* and put the infinitive after it.'
  ru.a2.unit67.lesson05.teach.uvazhaemyy_dima_vasha:
    title: A message from the salon
    gloss: Dear Dima, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then call us a day in advance. Then we will make a new appointment. See you Monday! Lana hairdresser's
    note: This is a typical short message from a business, so it uses the polite *Вы* in *Ваша* and *позвоните*. *Перенесена* means 'has been moved'.
    glosses:
      уважаемый: dear
      дима: Dima
      ваша: your (formal)
      запись: appointment
      перенесена: moved
      новая: new
      понедельник: Monday
      десять: ten
      часов: o'clock
      подходит: suits
      это: this
      не: not
      вам: to you (formal)
      позвоните: call
      нам: us
      тогда: then
      заранее: in advance
      сделаем: make
      мы: we
      до: until, see you
      парикмахерская: hairdresser's
      лана: Lana (the salon's name)
  ru.a2.unit67.lesson06.teach.parikmakherskaya_lana_dobryy:
    title: The salon answers
    gloss: 'Hairdresser: Lana hairdresser''s, good afternoon.'
  ru.a2.unit67.lesson06.teach.dobryy_den_s:
    title: Dima explains and asks
    gloss: 'Dima: Good afternoon, you are speaking to Dima. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  ru.a2.unit67.lesson06.teach.konechno_vam_podkhodit:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  ru.a2.unit67.lesson06.teach.k_sozhaleniyu_net:
    title: Dima suggests Monday
    gloss: 'Dima: Unfortunately not, because I have to work. Can it also be Monday?'
  ru.a2.unit67.lesson06.teach.v_ponedelnik_v:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  ru.a2.unit67.lesson06.teach.eto_mne_podkhodit:
    title: Dima accepts and apologises
    gloss: 'Dima: That suits me well. Thank you very much and sorry for the inconvenience.'
  ru.a2.unit67.lesson06.teach.bez_problem_do:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
