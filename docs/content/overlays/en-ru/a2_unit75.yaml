course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Say what you can and cannot do and what might happen, and describe your availability."
units:
  ru.a2.unit75.moch_i_umet: {"title": "I can and I know how to", "description": "Say what you can, cannot or know how to do, and give your availability with мочь, уметь and свободен."}
lessons:
  ru.a2.unit75.lesson01.mogu: {"title": "I can"}
  ru.a2.unit75.lesson02.umeyu: {"title": "I know how to"}
  ru.a2.unit75.lesson03.mogu_umeyu: {"title": "Can: possible or learned"}
  ru.a2.unit75.lesson04.svoboden: {"title": "When are you free"}
  ru.a2.unit75.lesson05.pismo: {"title": "Dima's note"}
  ru.a2.unit75.lesson06.dialog: {"title": "The pool on Sunday"}
teaching:
  ru.a2.unit75.lesson01.teach.mogu: {"title": "мочь: могу, можешь...", "gloss": "I can / you can / he can / we can / you (plural) can / they can", "note": "*Мочь* means 'to be able to'. It is followed by an infinitive: *я могу прийти* = I can come.", "example_gloss": ["I can come tomorrow.", "Can you wait at home?", "Nastya can call in the evening.", "We can read here.", "They can work at home."]}
  ru.a2.unit75.lesson01.teach.ne: {"title": "Cannot and when", "gloss": "today / now / I cannot", "note": "Put *не* before the form of *мочь*: *я не могу* = I cannot. *Сегодня* and *сейчас* say when.", "example_gloss": ["Today I cannot.", "I cannot talk now.", "We cannot wait.", "I cannot come today."]}
  ru.a2.unit75.lesson01.teach.gn_moch: {"title": "Present tense of мочь", "gloss": "I can, you can, he can, we can, you (plural) can, they can", "note": "The verb changes its consonant: *г* in *я могу* and *они могут*, *ж* in *ты можешь, он может, мы можем, вы можете*."}
  ru.a2.unit75.lesson01.teach.gn_neg: {"title": "Cannot", "gloss": "I cannot come. We cannot wait.", "note": "*Не* stands before *мочь*, and the infinitive follows: *не могу прийти*, *не можем ждать*."}
  ru.a2.unit75.lesson02.teach.umeyu: {"title": "уметь: умею, умеешь...", "gloss": "I know how / you know how / he knows how / we know how / you (plural) know how / they know how", "note": "*Уметь* means 'to know how to do something', a learned skill. It is followed by an infinitive.", "example_gloss": ["I know how to swim.", "Do you know how to cook?", "Nastya knows how to cook.", "We can play the piano.", "They know how to swim."]}
  ru.a2.unit75.lesson02.teach.skills: {"title": "Skills", "gloss": "swim / cook / play / piano / on", "note": "*Играть на пианино* is 'to play the piano'. *Пианино* never changes.", "example_gloss": ["Dima knows how to swim.", "I cannot play the piano.", "Nastya knows how to cook."]}
  ru.a2.unit75.lesson02.teach.gn_umet: {"title": "Present tense of уметь", "gloss": "I know how, you know how, he knows how, we know how, you (plural) know how, they know how", "note": "*Уметь* is regular: *умею, умеешь, умеет, умеем, умеете, умеют*."}
  ru.a2.unit75.lesson02.teach.gn_skill: {"title": "A skill", "gloss": "I know how to swim. I do not know how to cook.", "note": "Use *уметь* for something you have learned. *Не умею* means you never learned."}
  ru.a2.unit75.lesson03.teach.kont: {"title": "Skill or possibility", "gloss": "but / now / today", "note": "*Но* (but) joins what you know how to do with what you can do now.", "example_gloss": ["I know how to cook, but I cannot now.", "I know how to swim, but today I cannot.", "Today I can swim."]}
  ru.a2.unit75.lesson03.teach.gn_kont: {"title": "Умею or могу", "gloss": "I know how to swim. Today I can swim.", "note": "*Умею* is a skill. *Могу* is a possibility: you have time, permission or nothing stops you. You may know how and still be unable now."}
  ru.a2.unit75.lesson03.teach.gn_no: {"title": "Skill, but not now", "gloss": "I know how to swim, but today I cannot.", "note": "Say the skill first with *умею*, then add *но* and *не могу* for the situation."}
  ru.a2.unit75.lesson04.teach.dni: {"title": "Days", "gloss": "Saturday / Sunday / Friday / on Saturday / on Sunday / on Friday", "note": "*В* + the accusative gives the day: *в субботу*, *в пятницу*. *В воскресенье* looks the same as the plain word.", "example_gloss": ["On Saturday I cannot.", "On Sunday I can.", "On Friday I am working.", "When can you?"]}
  ru.a2.unit75.lesson04.teach.svob: {"title": "Free and busy", "gloss": "free (man) / free (woman) / busy (man) / busy (woman)", "note": "These short adjectives agree with the speaker: a man says *я свободен* or *я занят*, a woman says *я свободна* or *я занята*.", "example_gloss": ["On Sunday Dima is free.", "On Friday Nastya is busy.", "Today I am busy (a man speaking).", "Today I am busy (a woman speaking)."]}
  ru.a2.unit75.lesson04.teach.time: {"title": "Time", "gloss": "at two o'clock / at five o'clock", "note": "*В два часа* = at two o'clock; *в пять часов* = at five o'clock.", "example_gloss": ["I can come at two o'clock.", "I can at five o'clock.", "I work until six."]}
  ru.a2.unit75.lesson04.teach.gn_svob: {"title": "Free or busy: gender", "gloss": "I am free (man / woman). I am busy (man / woman).", "note": "Short adjectives take no ending for a man and *-а* for a woman: *свободен / свободна*, *занят / занята*."}
  ru.a2.unit75.lesson04.teach.gn_why: {"title": "Saying why not", "gloss": "On Saturday I cannot, I am working.", "note": "After *не могу* you can add a reason as a separate clause, with a comma."}
  ru.a2.unit75.lesson05.teach.v5: {"title": "Words for the note", "gloss": "pool / let us go / maybe", "note": "*Пойдём* is 'let us go'. *Бассейн* is a swimming pool.", "example_gloss": ["Let us go to the pool!", "I work until six.", "Maybe we could go to the pool?"]}
  ru.a2.unit75.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! On Saturday I cannot, I am working until six. But on Sunday I am free. I can come at two o'clock. I do not know how to cook, but I know how to swim. Maybe we could go to the pool? Bye! Dima", "note": "Dima gives his availability (*не могу*, *свободен*, *могу*) and his skills (*не умею*, *умею*).", "glosses": {"шести": "six (genitive, after до)", "бассейн": "swimming pool", "пойдём": "let us go"}}
  ru.a2.unit75.lesson06.teach.q: {"title": "Nastya asks about Saturday", "gloss": "Nastya: Dima, can you on Saturday?"}
  ru.a2.unit75.lesson06.teach.a: {"title": "Dima gives his availability", "gloss": "Dima: On Saturday I cannot, I am working until six. But on Sunday I am free."}
  ru.a2.unit75.lesson06.teach.q2: {"title": "Nastya suggests a time", "gloss": "Nastya: OK. Can you come at two o'clock?"}
  ru.a2.unit75.lesson06.teach.a2: {"title": "Dima agrees", "gloss": "Dima: Yes, I can. I do not know how to cook, but I know how to swim."}
  ru.a2.unit75.lesson06.teach.end: {"title": "Nastya decides", "gloss": "Nastya: Then let us go to the pool!"}
exercises:
  ru.a2.unit75.lesson01.exercise01.mozhem: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы можем читать здесь.", "distractors": ["Мы может читать здесь.", "Мы могу читать здесь.", "Мы можете читать здесь."], "accepted_answers": [{"value": "Мы можем читать здесь.", "status": "correct"}], "feedback": "*Мы* goes with *можем*."}
  ru.a2.unit75.lesson01.exercise02.mogut: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Они могут работать дома.", "distractors": ["Они можем работать дома.", "Они можете работать дома.", "Они может работать дома."], "accepted_answers": [{"value": "Они могут работать дома.", "status": "correct"}], "feedback": "*Они* goes with *могут*."}
  ru.a2.unit75.lesson01.exercise03.forms: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "я могу", "right": "I can"}, {"left": "ты можешь", "right": "you can (to one friend)"}, {"left": "он может", "right": "he can"}, {"left": "мы можем", "right": "we can"}, {"left": "вы можете", "right": "you can (formal or plural)"}, {"left": "они могут", "right": "they can"}], "status": "correct"}], "feedback": "Each person has its own form of *мочь*."}
  ru.a2.unit75.lesson01.exercise04.zavtra: {"instruction": "Put the words in order to say 'I can come tomorrow.'", "correct_option": "Я могу прийти завтра", "accepted_answers": [{"value": "Я могу прийти завтра", "status": "correct"}, {"value": "Завтра я могу прийти", "status": "correct"}, {"value": "Я завтра могу прийти", "status": "correct"}], "feedback": "*Могу* + infinitive."}
  ru.a2.unit75.lesson01.exercise05.blank_mogu: {"instruction": "Complete the sentence: 'Today I cannot come.'", "correct_option": "могу", "accepted_answers": [{"value": "могу", "status": "correct"}], "feedback": "*Я* goes with *могу*."}
  ru.a2.unit75.lesson01.exercise06.nastya: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Настя может позвонить вечером.", "status": "correct"}, {"value": "Настя может позвонить вечером", "status": "correct"}, {"value": "Вечером Настя может позвонить.", "status": "correct"}, {"value": "Вечером Настя может позвонить", "status": "correct"}, {"value": "Настя может вечером позвонить.", "status": "correct"}, {"value": "Настя может вечером позвонить", "status": "correct"}, {"value": "Настя вечером может позвонить.", "status": "correct"}, {"value": "Настя вечером может позвонить", "status": "correct"}], "feedback": "*Настя* is *она*, so *может*."}
  ru.a2.unit75.lesson01.exercise07.ne_mozhem: {"instruction": "Write the requested Russian sentence.", "correct_option": "Мы не можем ждать.", "accepted_answers": [{"value": "Мы не можем ждать.", "status": "correct"}, {"value": "Мы не можем ждать", "status": "correct"}], "feedback": "*Мы* + *не можем* + infinitive."}
  ru.a2.unit75.lesson02.exercise01.umeem: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы умеем играть на пианино.", "distractors": ["Мы умеет играть на пианино.", "Мы умею играть на пианино.", "Мы умеете играть на пианино."], "accepted_answers": [{"value": "Мы умеем играть на пианино.", "status": "correct"}], "feedback": "*Мы* goes with *умеем*."}
  ru.a2.unit75.lesson02.exercise02.umeyut: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Они умеют плавать.", "distractors": ["Они умеем плавать.", "Они умеете плавать.", "Они умеет плавать."], "accepted_answers": [{"value": "Они умеют плавать.", "status": "correct"}], "feedback": "*Они* goes with *умеют*."}
  ru.a2.unit75.lesson02.exercise03.w2: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "умею", "right": "I know how"}, {"left": "умеешь", "right": "you know how (to one friend)"}, {"left": "умеет", "right": "he or she knows how"}, {"left": "плавать", "right": "to swim"}, {"left": "готовить", "right": "to cook"}, {"left": "играть", "right": "to play"}, {"left": "пианино", "right": "piano"}], "status": "correct"}], "feedback": "These are the skill words of the unit."}
  ru.a2.unit75.lesson02.exercise04.pianino: {"instruction": "Put the words in order to say 'We know how to play the piano.'", "correct_option": "Мы умеем играть на пианино", "accepted_answers": [{"value": "Мы умеем играть на пианино", "status": "correct"}, {"value": "Играть на пианино мы умеем", "status": "correct"}], "feedback": "*Умеем* + infinitive."}
  ru.a2.unit75.lesson02.exercise05.blank_umeyu: {"instruction": "Complete the sentence: 'I do not know how to play the piano.'", "correct_option": "умею", "accepted_answers": [{"value": "умею", "status": "correct"}], "feedback": "*Я* goes with *умею*."}
  ru.a2.unit75.lesson02.exercise06.gotov: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Ты умеешь готовить?", "status": "correct"}, {"value": "Ты умеешь готовить", "status": "correct"}, {"value": "Умеешь готовить?", "status": "correct"}, {"value": "Умеешь готовить", "status": "correct"}], "feedback": "*Ты* goes with *умеешь*."}
  ru.a2.unit75.lesson02.exercise07.dima: {"instruction": "Write the requested Russian sentence.", "correct_option": "Дима умеет плавать.", "accepted_answers": [{"value": "Дима умеет плавать.", "status": "correct"}, {"value": "Дима умеет плавать", "status": "correct"}, {"value": "Дима плавать умеет.", "status": "correct"}, {"value": "Дима плавать умеет", "status": "correct"}], "feedback": "*Дима* is *он*, so *умеет*."}
  ru.a2.unit75.lesson03.exercise01.sw: {"instruction": "Choose the correct English meaning.", "correct_option": "I know how to swim.", "distractors": ["I do not know how to swim.", "I cannot swim today.", "I can come for a swim today."], "accepted_answers": [{"value": "I know how to swim.", "status": "correct"}], "feedback": "*Умею* = a learned skill."}
  ru.a2.unit75.lesson03.exercise02.sw2: {"instruction": "Choose the correct English meaning.", "correct_option": "I cannot swim today (something stops me).", "distractors": ["I do not know how to swim.", "I do not like swimming.", "I can swim today."], "accepted_answers": [{"value": "I cannot swim today (something stops me).", "status": "correct"}], "feedback": "*Не могу* = a situation stops me."}
  ru.a2.unit75.lesson03.exercise03.w3: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "умею", "right": "I know how"}, {"left": "не умею", "right": "I do not know how"}, {"left": "могу", "right": "I can (it is possible)"}, {"left": "не могу", "right": "I cannot (it is not possible)"}, {"left": "плавать", "right": "to swim"}, {"left": "готовить", "right": "to cook"}], "status": "correct"}], "feedback": "*Уметь* is a skill, *мочь* is a possibility."}
  ru.a2.unit75.lesson03.exercise04.sw3: {"instruction": "Put the words in order to say 'Today I cannot swim.'", "correct_option": "Сегодня я не могу плавать", "accepted_answers": [{"value": "Сегодня я не могу плавать", "status": "correct"}, {"value": "Я сегодня не могу плавать", "status": "correct"}, {"value": "Я не могу плавать сегодня", "status": "correct"}], "feedback": "*Не могу* + infinitive."}
  ru.a2.unit75.lesson03.exercise05.blank_sw: {"instruction": "Complete the sentence: 'I know how to swim, but today I cannot.'", "correct_option": "могу", "accepted_answers": [{"value": "могу", "status": "correct"}], "feedback": "*Не могу* = a situation stops me."}
  ru.a2.unit75.lesson03.exercise06.g3: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я умею готовить, но сейчас не могу.", "status": "correct"}, {"value": "Я умею готовить, но сейчас не могу", "status": "correct"}, {"value": "Я умею готовить но сейчас не могу.", "status": "correct"}, {"value": "Я умею готовить но сейчас не могу", "status": "correct"}, {"value": "Я умею готовить, но сейчас я не могу.", "status": "correct"}, {"value": "Я умею готовить, но сейчас я не могу", "status": "correct"}, {"value": "Я умею готовить но сейчас я не могу.", "status": "correct"}, {"value": "Я умею готовить но сейчас я не могу", "status": "correct"}, {"value": "Я умею готовить, но не могу сейчас.", "status": "correct"}, {"value": "Я умею готовить, но не могу сейчас", "status": "correct"}, {"value": "Я умею готовить но не могу сейчас.", "status": "correct"}, {"value": "Я умею готовить но не могу сейчас", "status": "correct"}], "feedback": "Skill (*умею*), then situation (*не могу*)."}
  ru.a2.unit75.lesson03.exercise07.w3b: {"instruction": "Write the requested Russian sentences.", "correct_option": "Я не умею готовить. Я умею плавать.", "accepted_answers": [{"value": "Я не умею готовить. Я умею плавать.", "status": "correct"}, {"value": "Я не умею готовить. Я умею плавать", "status": "correct"}, {"value": "Я не умею готовить. Плавать я умею.", "status": "correct"}, {"value": "Я не умею готовить. Плавать я умею", "status": "correct"}, {"value": "Готовить я не умею. Я умею плавать.", "status": "correct"}, {"value": "Готовить я не умею. Я умею плавать", "status": "correct"}, {"value": "Готовить я не умею. Плавать я умею.", "status": "correct"}, {"value": "Готовить я не умею. Плавать я умею", "status": "correct"}], "feedback": "*Не умею* for what you never learned, *умею* for what you know."}
  ru.a2.unit75.lesson04.exercise01.sub: {"instruction": "Choose the correct English meaning.", "correct_option": "On Saturday I cannot.", "distractors": ["On Saturday I am free.", "On Sunday I cannot.", "On Friday I cannot."], "accepted_answers": [{"value": "On Saturday I cannot.", "status": "correct"}], "feedback": "*В субботу* = on Saturday."}
  ru.a2.unit75.lesson04.exercise02.nastya: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя свободна в пятницу.", "distractors": ["Настя свободен в пятницу.", "Настя занят в пятницу.", "Настя занята в пятницу."], "accepted_answers": [{"value": "Настя свободна в пятницу.", "status": "correct"}], "feedback": "*Настя* is a woman, so *свободна*."}
  ru.a2.unit75.lesson04.exercise03.w4: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "суббота", "right": "Saturday"}, {"left": "воскресенье", "right": "Sunday"}, {"left": "пятница", "right": "Friday"}, {"left": "свободен", "right": "free (said by a man)"}, {"left": "свободна", "right": "free (said by a woman)"}, {"left": "занят", "right": "busy (said by a man)"}, {"left": "занята", "right": "busy (said by a woman)"}], "status": "correct"}], "feedback": "Short adjectives agree with the speaker."}
  ru.a2.unit75.lesson04.exercise04.vosk: {"instruction": "Put the words in order to say 'On Sunday I can come at two o'clock.'", "correct_option": "В воскресенье я могу прийти в два часа", "accepted_answers": [{"value": "В воскресенье я могу прийти в два часа", "status": "correct"}, {"value": "Я могу прийти в воскресенье в два часа", "status": "correct"}, {"value": "В воскресенье в два часа я могу прийти", "status": "correct"}], "feedback": "Day first, then time."}
  ru.a2.unit75.lesson04.exercise05.blank_svob: {"instruction": "Complete the sentence: 'On Sunday I am free.'", "correct_option": "свободен", "accepted_answers": [{"value": "свободен", "status": "correct"}, {"value": "свободна", "status": "correct"}], "feedback": "A man says *свободен*, a woman *свободна*."}
  ru.a2.unit75.lesson04.exercise06.zan: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "В пятницу я занят, а в субботу могу.", "status": "correct"}, {"value": "В пятницу я занят, а в субботу могу", "status": "correct"}, {"value": "В пятницу я занят а в субботу могу.", "status": "correct"}, {"value": "В пятницу я занят а в субботу могу", "status": "correct"}, {"value": "В пятницу я занята, а в субботу могу.", "status": "correct"}, {"value": "В пятницу я занята, а в субботу могу", "status": "correct"}, {"value": "В пятницу я занята а в субботу могу.", "status": "correct"}, {"value": "В пятницу я занята а в субботу могу", "status": "correct"}, {"value": "В пятницу я занят, а в субботу я могу.", "status": "correct"}, {"value": "В пятницу я занят, а в субботу я могу", "status": "correct"}, {"value": "В пятницу я занят а в субботу я могу.", "status": "correct"}, {"value": "В пятницу я занят а в субботу я могу", "status": "correct"}, {"value": "В пятницу я занята, а в субботу я могу.", "status": "correct"}, {"value": "В пятницу я занята, а в субботу я могу", "status": "correct"}, {"value": "В пятницу я занята а в субботу я могу.", "status": "correct"}, {"value": "В пятницу я занята а в субботу я могу", "status": "correct"}], "feedback": "A man says *занят*, a woman *занята*."}
  ru.a2.unit75.lesson04.exercise07.w4b: {"instruction": "Write the requested Russian sentence.", "correct_option": "В воскресенье я свободна.", "accepted_answers": [{"value": "В воскресенье я свободна.", "status": "correct"}, {"value": "В воскресенье я свободна", "status": "correct"}, {"value": "Я свободна в воскресенье.", "status": "correct"}, {"value": "Я свободна в воскресенье", "status": "correct"}], "feedback": "A woman says *свободна*."}
