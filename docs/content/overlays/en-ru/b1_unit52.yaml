course:
  title: "Russian B1"
  description: "Learn B1-level Russian for summarizing and retelling -- flagging the main point with Короче говоря / Главное — это, and retelling an account's main points in condensed, ordered form with Во-первых / Во-вторых / В итоге, distinguishing main points from detail."

units:
  ru.b1.unit52.pereskaz: {title: "Retelling"}

lessons:
  ru.b1.unit52.lesson01.koroche_govorja: {title: "In short..."}
  ru.b1.unit52.lesson02.vo_pervyh_vo_vtoryh: {title: "First... Second..."}
  ru.b1.unit52.lesson03.pereskaz_vyhodnyh: {title: "Retelling the weekend"}

teaching:
  ru.b1.unit52.lesson01.teach.koroche_govorja_poezdka: {title: "Короче говоря, поездка была отличной.", gloss: "In short, the trip was great.", note: "Короче говоря flags the sentence that follows as the main point.", example_gloss: null}
  ru.b1.unit52.lesson01.teach.glavnoje_eto: {title: "Главное — это то, что все были довольны.", gloss: "The main thing is that everyone was happy.", note: "Главное — это то, что also flags the main point of an account.", example_gloss: null}
  ru.b1.unit52.lesson01.teach.summary_connector_grammar: {title: "Короче говоря / Главное — это = связки для главной мысли", gloss: "In short / The main thing is = connectors for the main point", note: "Both connectors introduce the main point of a summary, distinguishing it from supporting detail.", example_gloss: "In short, the trip was great. The main thing is that everyone was happy -- both flag the main point."}
  ru.b1.unit52.lesson02.teach.vo_pervyh_guljali: {title: "Во-первых, мы гуляли в лесу. Во-вторых, мы готовили ужин. В итоге, выходные были прекрасными.", gloss: "First, we walked in the forest. Second, we cooked dinner. In the end, the weekend was wonderful.", note: "во-первых / во-вторых / в итоге give the main points of a retelling in condensed, ordered form.", example_gloss: null}
  ru.b1.unit52.lesson02.teach.pereskaz_grammar: {title: "во-первых / во-вторых / в итоге = порядок пересказа", gloss: "first / second / in the end = the order of a retelling", note: "Use these connectors to retell the main points of an account in a condensed, ordered sequence.", example_gloss: "First we walked in the forest. Second we cooked dinner. In the end the weekend was wonderful -- an ordered retelling."}
  ru.b1.unit52.lesson03.teach.nastya_source_account: {title: "Nastya tells the source account", gloss: "Nastya: On Saturday we went to the dacha. It was cold but sunny, and we walked in the forest. In the evening we cooked dinner with friends.", note: "The full source account, with both main points and supporting detail (the weather)."}
  ru.b1.unit52.lesson03.teach.dima_retell_condensed: {title: "Dima retells it condensed", gloss: "Dima: First, you walked in the forest. Second, you cooked dinner with friends. In the end, the weekend was wonderful, right?", note: "Dima's retelling keeps the two main points and drops the weather detail."}
  ru.b1.unit52.lesson03.teach.nastya_confirm: {title: "Nastya confirms", gloss: "Nastya: Yes, exactly. The main thing is that everyone was happy.", note: "Confirms the retelling and restates the main point."}

exercises:
  ru.b1.unit52.lesson01.exercise01.recognize_koroche_govorja: {instruction: "Which Russian sentence means \"in short, the trip was great\"?", correct_option: "короче говоря поездка была отличной", distractors: ["главное это то что все были довольны", "во-первых мы гуляли в лесу", "в итоге выходные были прекрасными"], accepted_answers: [{value: "короче говоря поездка была отличной", status: "correct"}], feedback: "Короче говоря flags the main point."}
  ru.b1.unit52.lesson01.exercise02.recognize_glavnoje_eto: {instruction: "Which Russian sentence means \"the main thing is that everyone was happy\"?", correct_option: "главное это то что все были довольны", distractors: ["короче говоря поездка была отличной", "во-вторых мы готовили ужин", "во-первых мы гуляли в лесу"], accepted_answers: [{value: "главное это то что все были довольны", status: "correct"}], feedback: "Главное — это то, что also flags the main point."}
  ru.b1.unit52.lesson01.exercise03.listen_select_koroche_govorja: {instruction: "Listen. What is flagged as the main point?", correct_option: "The trip was great.", distractors: ["The weekend was cold.", "Everyone was tired.", "The trip was cancelled."], accepted_answers: [{value: "The trip was great.", status: "correct"}], feedback: "The recording says *Короче говоря, поездка была отличной*."}
  ru.b1.unit52.lesson01.exercise04.match_summary_connector_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Короче говоря", right: "In short"}
          - {left: "поездка была отличной", right: "the trip was great"}
          - {left: "Главное — это то, что", right: "The main thing is that"}
          - {left: "все были довольны", right: "everyone was happy"}
          - {left: "связки", right: "connectors"}
          - {left: "главной мысли", right: "of the main idea"}
        status: "correct"
    feedback: "These build the two main-point connectors."
  ru.b1.unit52.lesson01.exercise05.order_glavnoje_eto: {instruction: "Put the words in order to say \"The main thing is that everyone was happy.\"", accepted_answers: [{value: ["Главное", "это", "то", "что", "все", "были", "довольны"], status: "correct"}], feedback: "The correct order is *Главное — это то, что все были довольны*."}
  ru.b1.unit52.lesson01.exercise06.write_koroche_govorja:
    instruction: "Write exactly this sentence flagging the main point with Короче говоря: In short, the trip was great."
    accepted_answers:
      - {value: "Короче говоря, поездка была отличной.", status: "correct"}
      - {value: "Короче говоря, поездка была отличной", status: "correct"}
    feedback: "The model answer is *Короче говоря, поездка была отличной*."
  ru.b1.unit52.lesson02.exercise01.recognize_vo_pervyh: {instruction: "Which Russian retelling means \"first we walked in the forest, second we cooked dinner, in the end the weekend was wonderful\"?", correct_option: "во-первых мы гуляли в лесу во-вторых мы готовили ужин в итоге выходные были прекрасными", distractors: ["короче говоря поездка была отличной", "главное это то что все были довольны", "во-первых мы готовили ужин во-вторых мы гуляли в лесу"], accepted_answers: [{value: "во-первых мы гуляли в лесу во-вторых мы готовили ужин в итоге выходные были прекрасными", status: "correct"}], feedback: "во-первых / во-вторых / в итоге give the main points in order."}
  ru.b1.unit52.lesson02.exercise02.recognize_pereskaz_grammar: {instruction: "Which Russian phrase names the ordering connectors used to retell main points in sequence?", correct_option: "во-первых во-вторых в итоге порядок пересказа", distractors: ["короче говоря главное это", "связки главной мысли", "во-первых мы гуляли в лесу"], accepted_answers: [{value: "во-первых во-вторых в итоге порядок пересказа", status: "correct"}], feedback: "порядок пересказа means \"the order of a retelling.\""}
  ru.b1.unit52.lesson02.exercise03.listen_select_vo_pervyh: {instruction: "Listen. What two main points are given, and what is the conclusion?", correct_option: "Walking in the forest, then cooking dinner; the weekend was wonderful.", distractors: ["Cooking dinner, then walking in the forest; the weekend was cold.", "Walking in the forest, then sleeping; the weekend was short.", "Buying tickets, then cooking dinner; the weekend was wonderful."], accepted_answers: [{value: "Walking in the forest, then cooking dinner; the weekend was wonderful.", status: "correct"}], feedback: "The recording gives the two main points in order, then a conclusion."}
  ru.b1.unit52.lesson02.exercise04.match_vo_pervyh_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Во-первых, мы гуляли", right: "First, we walked"}
          - {left: "в лесу", right: "in the forest"}
          - {left: "Во-вторых, мы готовили", right: "Second, we cooked"}
          - {left: "ужин", right: "dinner"}
          - {left: "В итоге, выходные были", right: "In the end, the weekend was"}
          - {left: "прекрасными", right: "wonderful"}
        status: "correct"
    feedback: "These build the ordered retelling."
  ru.b1.unit52.lesson02.exercise05.order_vo_vtoryh: {instruction: "Put the words in order to say \"Second, we cooked dinner.\"", accepted_answers: [{value: ["Во-вторых", "мы", "готовили", "ужин"], status: "correct"}], feedback: "The correct order is *Во-вторых, мы готовили ужин*."}
  ru.b1.unit52.lesson02.exercise06.write_vo_pervyh_full:
    instruction: "Write exactly this three-part retelling using во-первых / во-вторых / в итоге to give the main points in order: First we walked in the forest. Second we cooked dinner. In the end the weekend was wonderful."
    accepted_answers:
      - {value: "Во-первых, мы гуляли в лесу. Во-вторых, мы готовили ужин. В итоге, выходные были прекрасными.", status: "correct"}
      - {value: "Во-первых, мы гуляли в лесу. Во-вторых, мы готовили ужин. В итоге, выходные были прекрасными", status: "correct"}
    feedback: "The model answer gives the two main points in order, then the conclusion."
  ru.b1.unit52.lesson03.exercise01.choose_condensed_retelling: {instruction: "Which answer is a condensed, ordered retelling of the weekend that keeps only the main points and drops the weather detail?", correct_option: "Во-первых, вы гуляли в лесу. Во-вторых, вы готовили ужин с друзьями. В итоге, выходные были прекрасными, правда?", distractors: ["Было холодно, но солнечно, и мы гуляли в лесу.", "Я бы предложил перенести встречу на пятницу.", "Это моя коллега, с которой я работаю над новым проектом."], accepted_answers: [{value: "Во-первых, вы гуляли в лесу. Во-вторых, вы готовили ужин с друзьями. В итоге, выходные были прекрасными, правда?", status: "correct"}], feedback: "The condensed retelling keeps the two main points and drops the weather detail."}
  ru.b1.unit52.lesson03.exercise02.dialogue_comprehension_pereskaz:
    instruction: "Listen to the dialogue. What are the main points of Nastya's weekend, and what supporting detail does Dima's retelling drop?"
    correct_option: "The main points are walking in the forest and cooking dinner with friends; Dima's retelling drops the detail that it was cold but sunny"
    distractors: ["The main points are the weather and the dacha; Dima's retelling drops the detail about dinner", "The main points are cooking dinner and buying tickets; Dima's retelling drops the detail about the forest", "The main point is that it was cold; Dima's retelling drops the detail about the weekend being wonderful"]
    accepted_answers: [{value: "The main points are walking in the forest and cooking dinner with friends; Dima's retelling drops the detail that it was cold but sunny", status: "correct"}]
    feedback: "Dima's retelling condenses the account to its two main points, in order."
  ru.b1.unit52.lesson03.exercise03.match_dialogue_pereskaz:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "В субботу мы поехали на дачу.", right: "On Saturday we went to the dacha."}
          - {left: "Было холодно, но солнечно.", right: "It was cold but sunny."}
          - {left: "Во-первых, вы гуляли в лесу.", right: "First, you walked in the forest."}
          - {left: "Во-вторых, вы готовили ужин с друзьями.", right: "Second, you cooked dinner with friends."}
          - {left: "В итоге, выходные были прекрасными, правда?", right: "In the end, the weekend was wonderful, right?"}
          - {left: "Да, именно так.", right: "Yes, exactly."}
        status: "correct"
    feedback: "These phrases build the full account and its condensed retelling."
  ru.b1.unit52.lesson03.exercise04.order_nastya_source_weather: {instruction: "Put the words in order to say \"It was cold but sunny.\"", accepted_answers: [{value: ["Было", "холодно", "но", "солнечно"], status: "correct"}], feedback: "The correct order is *Было холодно, но солнечно*."}
  ru.b1.unit52.lesson03.exercise05.reply_confirm_summary:
    instruction: "Dima asks \"В итоге, выходные были прекрасными, правда?\" Reply with exactly: \"Да, именно так.\""
    accepted_answers:
      - {value: "Да, именно так.", status: "correct"}
      - {value: "Да, именно так", status: "correct"}
    feedback: "A short, natural confirmation."
  ru.b1.unit52.lesson03.exercise06.write_condensed_summary:
    instruction: "Someone tells you: \"On Saturday we went to the dacha. It was cold but sunny, and we walked in the forest. In the evening we cooked dinner with friends.\" Write a condensed, ordered summary of ONLY the main points (drop the weather detail), using во-первых / во-вторых / в итоге: First we walked in the forest. Second we cooked dinner with friends. In the end the weekend was wonderful."
    accepted_answers:
      - {value: "Во-первых, мы гуляли в лесу. Во-вторых, мы готовили ужин с друзьями. В итоге, выходные были прекрасными.", status: "correct"}
      - {value: "Во-первых, мы гуляли в лесу. Во-вторых, мы готовили ужин с друзьями. В итоге, выходные были прекрасными", status: "correct"}
      - {value: "Во-первых, вы гуляли в лесу. Во-вторых, вы готовили ужин с друзьями. В итоге, выходные были прекрасными.", status: "correct"}
      - {value: "Во-первых, вы гуляли в лесу. Во-вторых, вы готовили ужин с друзьями. В итоге, выходные были прекрасными", status: "correct"}
    feedback: "A complete summary keeps only the two main points, in order, and drops the weather detail."
  ru.b1.unit52.lesson01.koroche_govorja.exercise07.dictation:
