course:
  title: "Russian A1"
  description: "Learn A1-level Russian for identifying clothing and asking for a clothing item by size and color."

units:
  ru.a1.unit21.clothing: {title: "A blue shirt"}

lessons:
  ru.a1.unit21.lesson01.mne_nuzhna_kurtka: {title: "I need a jacket"}
  ru.a1.unit21.lesson02.razmer_i_tsvet: {title: "Size and color"}
  ru.a1.unit21.lesson03.v_magazine_odezhdy: {title: "Dialogue: in a clothing shop"}

teaching:
  ru.a1.unit21.lesson01.teach.mne_nuzhna_kurtka: {title: "Мне нужна куртка.", gloss: "I need a jacket.", note: "Мне нужна literally means \"to me is needed\" and agrees with the feminine noun куртка.", example_gloss: "Today I need a jacket."}
  ru.a1.unit21.lesson01.teach.rubashka: {title: "рубашка", gloss: "shirt", note: "рубашка means \"shirt.\"", example_gloss: "I need a shirt."}
  ru.a1.unit21.lesson01.teach.platye: {title: "платье", gloss: "dress", note: "платье means \"dress.\"", example_gloss: "This is a dress."}
  ru.a1.unit21.lesson02.teach.kakoy_razmer: {title: "Какой размер?", gloss: "What size?", note: "Какой размер? is the standard size question in a shop."}
  ru.a1.unit21.lesson02.teach.sredniy_razmer: {title: "средний размер", gloss: "medium size", note: "средний means \"medium\" for masculine размер.", example_gloss: "Medium size, please."}
  ru.a1.unit21.lesson02.teach.sinyaya: {title: "синяя", gloss: "blue", note: "синяя is the feminine form of \"blue,\" used with рубашка.", example_gloss: "A blue shirt."}
  ru.a1.unit21.lesson03.teach.nastya_est_sinyaya: {title: "Nastya asks for a shirt", gloss: "Nastya: Hello! Do you have a blue shirt?", note: "У вас есть...? is a polite shop question."}
  ru.a1.unit21.lesson03.teach.prodavets_kakoy_razmer: {title: "The salesperson asks the size", gloss: "Salesperson: Yes. What size?", note: "The salesperson asks Какой размер?"}
  ru.a1.unit21.lesson03.teach.nastya_sredniy: {title: "Nastya gives the size", gloss: "Nastya: Medium size, please.", note: "Средний размер, пожалуйста is a complete shop answer."}
  ru.a1.unit21.lesson03.teach.prodavets_vot_rubashka: {title: "The salesperson shows the shirt", gloss: "Salesperson: Here is the shirt.", note: "Вот means \"here is.\""}
  ru.a1.unit21.lesson03.teach.nastya_skolko_stoit: {title: "Nastya asks the price", gloss: "Nastya: Thank you. How much does it cost?", note: "Сколько стоит? asks the price."}

