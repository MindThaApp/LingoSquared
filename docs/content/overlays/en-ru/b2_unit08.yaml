    accepted_answers: [{value: "That the coffee is tasty.", status: "correct"}]
    feedback: "Both say the coffee is tasty -- Настя: 'кофе там вкусный', Дима: 'кофе вкусный, это правда'. That is their agreement."
  ru.b2.unit08.lesson06.exercise02.comprehend_conflict:
    instruction: "On what point do Настя and Дима CONFLICT?"
    correct_option: "The price."
    distractors: ["The coffee.", "The location.", "Nothing -- they fully agree."]
    accepted_answers: [{value: "The price.", status: "correct"}]
    feedback: "Дима finds it 'слишком дорого' while Настя says 'и всё же, по-моему, это недорого' -- they conflict on the price."
  ru.b2.unit08.lesson06.exercise03.comprehend_better_supported:
    instruction: "Whose view on the price is better supported, and why?"
    correct_option: "Dima's -- he gives a concrete price (one cup costs 300 rubles)."
    distractors: ["Nastya's -- she gives a reason.", "Both back it with evidence.", "Neither gives any reason."]
    accepted_answers: [{value: "Dima's -- he gives a concrete price (one cup costs 300 rubles).", status: "correct"}]
    feedback: "Дима backs 'слишком дорого' with 'одна чашка стоит триста рублей'; Настя only insists 'по-моему, это недорого'. Dima's view is better supported."
