    distractors: ["The coffee.", "The name of the coffee shop.", "How busy it is."]
    accepted_answers: [{value: "The price.", status: "correct"}]
    feedback: "The price is the clash: Ольга says 'это недорого', Павел says 'там слишком дорого'. Same topic, opposite claim."
  ru.b2.unit08.lesson05.exercise03.read_olga_price:
    instruction: "What does Ольга claim about the price?"
    correct_option: "That it isn't expensive."
    distractors: ["That it is too expensive.", "That one cup costs three hundred rubles.", "She doesn't mention the price."]
    accepted_answers: [{value: "That it isn't expensive.", status: "correct"}]
    feedback: "Ольга writes 'это недорого' -- she claims it isn't expensive, but gives no figure to back it up."
  ru.b2.unit08.lesson05.exercise04.read_better_supported:
    instruction: "Which review backs up its view on the price with a concrete reason?"
    correct_option: "Pavel's -- he names a price (one cup costs 300 rubles)."
    distractors: ["Olga's -- she explains why it is cheap.", "Both give a concrete reason.", "Neither gives any reason."]
    accepted_answers: [{value: "Pavel's -- he names a price (one cup costs 300 rubles).", status: "correct"}]
    feedback: "Павел backs 'слишком дорого' with a figure -- 'одна чашка стоит триста рублей'. Ольга only asserts 'недорого', so Павел's review is лучше обоснована (better supported)."
  ru.b2.unit08.lesson05.exercise05.match_reading_words:
    instruction: "Match each word with its meaning."
