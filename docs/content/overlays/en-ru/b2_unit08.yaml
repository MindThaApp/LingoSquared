course:
  title: "Russian B2"
  description: >-
    Upper-intermediate Russian: summarize and evaluate multiple sources --
    attribute a claim to its source (по словам, утверждает, считает, судя
    по ..., можно сказать, что), compare two sources side by side (оба, в
    то время как, напротив, в отличие от), name where they agree (они
    сходятся во мнении о) and where they conflict (они расходятся во
    мнении о, противоречат друг другу в вопросе), and give a reasoned
    judgement between them (наиболее убедителен, лучше обоснован, взвесив
    всё), around two conflicting reviews of a new coffee shop.

units:
  ru.b2.unit08.sintez:
    title: "Synthesis"
    description: Summarize and evaluate two sources -- attribute each claim, name where the two reviews agree and where they conflict, weigh which is better supported, and write a synthesis that gives a reasoned judgement between them.

lessons:
  ru.b2.unit08.lesson01.kto_chto_govorit:
    title: "Who says what?"
  ru.b2.unit08.lesson02.sravnenie:
    title: "Two sources side by side"
  ru.b2.unit08.lesson03.soglasie:
    title: "Where do they agree?"
  ru.b2.unit08.lesson04.konflikt:
    title: "Where do they contradict each other?"
  ru.b2.unit08.lesson05.dve_recenzii:
    title: "Two reviews side by side"
  ru.b2.unit08.lesson06.sintez_v_razgovore:
    title: "Summarize and judge"

teaching:
  ru.b2.unit08.lesson01.teach.zyorna:
    title: "«Zyorna» is a new coffee shop."
    gloss: "«Zyorna» is a new coffee shop."
    note: "The situation: two people have reviewed a new coffee shop, *«Зёрна»* ('Grains/Beans'), and you have to weigh what they say."
  ru.b2.unit08.lesson01.teach.recenzija:
    title: "the review"
    gloss: "the review"
    note: "*Рецензия* = 'the review'; plural *рецензии*. Each review is one of your two sources. *Какая...?* = 'Which...?'."
    example_gloss: "Which review is this?"
  ru.b2.unit08.lesson01.teach.istochnik:
    title: "the source"
    gloss: "the source"
    note: "*Источник* ('source'), plural *источники*, is the general word for anything you draw information from -- here, a review. Synthesis means weighing more than one *источник*."
    example_gloss: "A review is a source."
  ru.b2.unit08.lesson01.teach.po_slovam:
    title: "according to"
    gloss: "according to"
    note: "*По словам X* = 'according to X' -- the simplest way to attribute a claim to its source instead of asserting it yourself."
    example_gloss: "According to Olga, the coffee there is tasty."
  ru.b2.unit08.lesson01.teach.cena:
    title: "the price"
    gloss: "the price"
    note: "*Цена* = 'the price' -- the point the two reviews will end up disagreeing about. *Высокая* = 'high'."
    example_gloss: "The price is high."
  ru.b2.unit08.lesson01.teach.utverzhdaet:
    title: "claims (утверждает)"
    gloss: "claims / asserts"
    note: "*Утверждает* ('claims', from *утверждать*) attributes a claim to a source without vouching for it yourself: *Ольга утверждает, что это недорого*. *Недорого* = 'not expensive'."
    example_gloss: "Olga claims that it isn't expensive."
  ru.b2.unit08.lesson01.teach.schitaet:
    title: "thinks / holds (считает)"
    gloss: "thinks / holds the view that"
    note: "*Считает* ('thinks', from *считать*) reports a source's opinion, slightly more neutral than *утверждает*."
    example_gloss: "Pavel thinks that it is expensive."
  ru.b2.unit08.lesson01.teach.sudya_po:
    title: "judging by ..., one can say that"
    gloss: "judging by ..., one can say that"
    note: "*Судя по X, можно сказать, что...* -- attribute a conclusion to the evidence itself. More formal-sounding than *по словам*, and it points at a source as evidence."
    example_gloss: "Judging by the review, one can say that the coffee is good."
  ru.b2.unit08.lesson01.teach.grammar_atributirovanie:
    title: "According to Olga it isn't expensive. Pavel claims it is expensive. Judging by the review, one can say the coffee is good."
    gloss: "According to Olga it isn't expensive. Pavel claims it is expensive. Judging by the review, one can say the coffee is good."
    note: "Attributing keeps a claim at arm's length -- you report who says it, you don't assert it yourself. Toolkit: *по словам X*, *X утверждает/считает, что...*, *судя по X, можно сказать, что...*. This is the first move of synthesis."

  ru.b2.unit08.lesson02.teach.oba:
    title: "both (of them)"
    gloss: "both (of them)"
    note: "*Оба* = 'both (of them)' -- points at two people/things you have already named. *Они* = 'they'."
    example_gloss: "Both of them think the coffee is tasty."
  ru.b2.unit08.lesson02.teach.oba_istochnika:
    title: "both sources"
    gloss: "both sources"
    note: "*Оба источника* = 'both sources' used directly before the noun."
    example_gloss: "Both sources think the coffee there is good."
  ru.b2.unit08.lesson02.teach.nedorogo:
    title: "not expensive"
    gloss: "not expensive / inexpensive"
    note: "*Недорого* = 'not expensive' -- Ольга's take on the price."
    example_gloss: "Olga thinks it isn't expensive there."
  ru.b2.unit08.lesson02.teach.v_to_vremya_kak:
    title: "whereas"
    gloss: "whereas (contrastive)"
    note: "*В то время как* is the CONTRASTIVE 'whereas' here, not the literal time-sense 'while'. Unlike some languages, it does NOT change Russian word order."
    example_gloss: "Olga thinks it isn't expensive there, whereas Pavel thinks it's expensive."
  ru.b2.unit08.lesson02.teach.polozhitelno:
    title: positively
    gloss: "positively"
    note: "*Положительно* = 'positively' -- a compact label for one source's overall stance."
    example_gloss: "Olga is positive."
  ru.b2.unit08.lesson02.teach.otricatelno:
    title: negatively
    gloss: "negatively"
    note: "*Отрицательно* = 'negatively' -- the opposite stance."
    example_gloss: "Pavel is negative."
  ru.b2.unit08.lesson02.teach.naprotiv:
    title: "by contrast"
    gloss: "by contrast / on the contrary"
    note: "*Напротив* = 'by contrast' -- flags the second, opposing source."
    example_gloss: "Olga is positive. Pavel, by contrast, is negative."
  ru.b2.unit08.lesson02.teach.v_otlichie_ot:
    title: "in contrast to"
    gloss: "in contrast to / unlike"
    note: "*В отличие от X* = 'in contrast to / unlike X' -- sets one source against the other before you state the second view."
    example_gloss: "In contrast to Olga, Pavel finds it expensive."
  ru.b2.unit08.lesson02.teach.s_odnoy_i_s_drugoy:
    title: "on one hand ... on the other hand"
    gloss: "on one hand ... on the other hand"
    note: "*С одной стороны ... с другой стороны ...* holds the two views in balance in a single sentence."
    example_gloss: "On one hand it's tasty, on the other hand it's expensive."
  ru.b2.unit08.lesson02.teach.grammar_sravnenie:
    title: "Both sources think the coffee there is good. Olga thinks it isn't expensive, whereas Pavel finds it expensive."
    gloss: "Both sources think the coffee there is good. Olga thinks it isn't expensive, whereas Pavel finds it expensive."
    note: "Comparing is the second move of synthesis: line the two sources up. Signal what they SHARE with *оба / оба источника*, and what SEPARATES them with *в то время как / напротив / в отличие от*."

  ru.b2.unit08.lesson03.teach.skhodyatsya_vo_mnenii:
    title: "to agree about"
    gloss: "to agree about"
    note: "*Сходиться во мнении о X* = 'to agree about X' -- the fixed frame for naming a point of agreement."
    example_gloss: "They agree about the coffee."
  ru.b2.unit08.lesson03.teach.vopros:
    title: "the point / question"
    gloss: "the point / question (at issue)"
    note: "*Вопрос* = 'the point (at issue)': *в этом вопросе* ('on this point'). It lets you say exactly WHERE two sources agree or clash."
    example_gloss: "On this point they agree."
  ru.b2.unit08.lesson03.teach.v_voprose:
    title: "on the point of"
    gloss: "on the point of / in the matter of"
    note: "*В вопросе X* = 'on the point of X' -- names the exact issue, whether the sources agree or clash on it."
    example_gloss: "They agree on the point of coffee."
  ru.b2.unit08.lesson03.teach.govoryat:
    title: "they say"
    gloss: "they say (говорить)"
    note: "*Говорят* ('they say', from *говорить*): a plainer alternative to *утверждают/считают* for reporting both sources at once. *Одинаково* = 'identically / the same way'."
    example_gloss: "Both say the same thing: that the coffee is tasty."
  ru.b2.unit08.lesson03.teach.to_zhe_samoe:
    title: "the same (thing)"
    gloss: "the same (thing)"
    note: "*То же самое* = 'the same (thing)': *Они считают то же самое* ('they think the same thing'). A quick way to state agreement."
    example_gloss: "They think the same thing."
  ru.b2.unit08.lesson03.teach.grammar_soglasie:
    title: "They agree about the coffee. They both say the same thing: that the coffee is tasty."
    gloss: "They agree about the coffee. They both say the same thing: that the coffee is tasty."
    note: "Naming AGREEMENT is the third move of synthesis. Say where the sources line up with *они сходятся во мнении о*, *в вопросе X*, or *они одинаково говорят, что...*."

  ru.b2.unit08.lesson04.teach.raskhodyatsya:
    title: "to disagree about"
    gloss: "to disagree about"
    note: "*Расходиться во мнении о X* = 'to disagree about X' -- the mirror of *сходиться во мнении о*."
    example_gloss: "They disagree about the price."
  ru.b2.unit08.lesson04.teach.raznica:
    title: "the difference"
    gloss: "the difference"
    note: "*Разница* = 'the difference': *Разница — это цена* ('the difference is the price')."
    example_gloss: "The difference is the price."
  ru.b2.unit08.lesson04.teach.protivorechat:
    title: "contradict each other"
    gloss: "contradict each other"
    note: "*Противоречить друг другу* = 'to contradict each other'. *Друг другу* = 'each other'. Stronger than merely differing -- the two claims cannot both be right."
    example_gloss: "They contradict each other."
  ru.b2.unit08.lesson04.teach.protivorechat_v_voprose:
    title: "contradict each other on the point of the price"
    gloss: "contradict each other on the point of the price"
    note: "Combine the two frames to pin the clash exactly: *они противоречат друг другу в вопросе цены*."
  ru.b2.unit08.lesson04.teach.vsyo_zhe:
    title: "and yet"
    gloss: "and yet / still"
    note: "*И всё же* = 'and yet' -- holds a view against a competing one. It marks where a source digs in."
    example_gloss: "The coffee is tasty, and yet it's expensive."
  ru.b2.unit08.lesson04.teach.grammar_konflikt:
    title: "They disagree about the price. They contradict each other on the point of the price."
    gloss: "They disagree about the price. They contradict each other on the point of the price."
    note: "Naming CONFLICT is the fourth move of synthesis. Say where the sources clash with *они расходятся во мнении о X*, *они противоречат друг другу в вопросе X*, or by naming *разница*."

  ru.b2.unit08.lesson05.teach.recenzija_olgi:
    title: "Review 1 (Olga)"
    gloss: "I really like the «Zyorna» coffee shop. The coffee there is tasty, and it isn't expensive. I'll definitely come back."
    glosses:
      очень: "very / really"
      нравится: "likes / is pleasing (мне нравится = I like)"
      вкусный: "tasty"
      недорого: "not expensive"
      вернусь: "I'll come back (from вернуться)"
      ещё: "again / still"
      раз: "time (ещё раз = one more time)"
  ru.b2.unit08.lesson05.teach.recenzija_pavla:
    title: "Review 2 (Pavel)"
    gloss: "The coffee at «Zyorna» is tasty, that's true. But, in my opinion, it's too expensive there: one cup costs three hundred rubles. For that price I expect more."
    glosses:
      вкусный: "tasty"
      правда: "true"
      слишком: "too (excessively)"
      дорого: "expensive"
      одна: "one"
      чашка: "cup"
      стоит: "costs"
      триста: "three hundred"
      рублей: "rubles"
      цену: "price (accusative of цена)"
      жду: "I expect (from ждать)"
      большего: "more"
  ru.b2.unit08.lesson05.teach.prichina:
    title: "the reason"
    gloss: "the reason"
    note: "*Причина* = 'the reason'; *Павел приводит причину* ('Pavel gives a reason'). Whether a source backs its view with a reason is what makes one review better supported than the other."
    example_gloss: "Pavel gives a reason."
  ru.b2.unit08.lesson05.teach.obosnovan:
    title: "backed up / well-supported"
    gloss: "backed up / well-supported"
    note: "*Обоснован* = 'backed up with evidence'. *Лучше обоснована* = 'better supported': a review that gives a concrete reason (Павел names a price) is better supported than one that only asserts (Ольга)."
    example_gloss: "Pavel's review is better supported."
  ru.b2.unit08.lesson05.teach.grammar_fakt_konflikt:
    title: "Both reviews think the coffee is tasty. But they disagree about the price."
    gloss: "Both reviews think the coffee is tasty. But they disagree about the price."
    note: "Reading two sources: first find what they SHARE (both call the coffee tasty), then the ONE point they CONFLICT on (the price), then judge which side is *лучше обоснована* -- backs its claim with a reason. *Обе* = 'both' (feminine agreement, with *рецензии*)."

  ru.b2.unit08.lesson06.teach.nravitsya:
    title: "I like"
    gloss: "I like (мне нравится)"
    note: "*Мне нравится* = 'I like' (literally 'to me it is pleasing'). The thing liked is the grammatical subject, so the verb agrees with it: *мне нравится кофейня «Зёрна»* (кофейня is singular). The name *«Зёрна»* on its own is plural ('grains'), which is why Павел writes *в «Зёрнах»*."
    example_gloss: "I like the «Zyorna» coffee shop."
  ru.b2.unit08.lesson06.teach.kto_ubeditelnee:
    title: "Who is more convincing?"
    gloss: "Who is more convincing — Nastya or Dima?"
    note: "*Убедительнее* = 'more convincing' (comparative of *убедительный*); *или* = 'or'. *Кто* = 'who'."
  ru.b2.unit08.lesson06.teach.znachit:
    title: "so / that means"
    gloss: "so / that means"
    note: "*Значит* = 'so / that means' -- draws the conclusion of your synthesis."
    example_gloss: "So we agree about the coffee."
  ru.b2.unit08.lesson06.teach.naibolee_ubeditelen:
    title: "the most convincing (наиболее убедителен / убедительна)"
    gloss: "the most convincing (male: наиболее убедителен; female: наиболее убедительна)"
    note: "*Наиболее убедителен* = 'the most convincing' -- the core judgement frame, another short-form predicate adjective agreeing with the subject's gender. This is where you evaluate, not just summarize."
    example_gloss: "The most convincing is Dima."
  ru.b2.unit08.lesson06.teach.schitayu_silnee:
    title: "I find X more convincing"
    gloss: "I find X more convincing"
    note: "*Я считаю X более убедительным* -- an alternative judgement frame."
    example_gloss: "I find Dima more convincing."
  ru.b2.unit08.lesson06.teach.potomu_chto_prichinu:
    title: "because he gives a reason"
    gloss: "because he gives a reason"
    note: "*Потому что он приводит причину* -- attaches the REASON to your judgement. A judgement without a *потому что* is just a preference. *Он* = 'he'."
    example_gloss: "Dima is convincing, because he gives a reason."
  ru.b2.unit08.lesson06.teach.vzvesiv_vsyo:
    title: "in general / weighing everything"
    gloss: "in general / weighing everything up"
    note: "*В целом* = 'in general'; *взвесив всё* = 'having weighed everything up'. Either one opens your final verdict. *Взвесив* is a verbal adverb, so its doer must be the subject of the main clause -- the person judging, not Дима: *Взвесив всё, можно сказать, что...* or *Взвесив всё, я считаю...*."
    example_gloss: "Weighing everything up, one can say that Dima is the most convincing."
  ru.b2.unit08.lesson06.teach.dialogue_nastya_open:
    title: "Nastya: I like the «Zyorna» coffee shop. The coffee there is tasty, and it isn't expensive."
    gloss: "Nastya: I like the «Zyorna» coffee shop. The coffee there is tasty, and it isn't expensive."
  ru.b2.unit08.lesson06.teach.dialogue_dima_price:
    title: "Dima: The coffee is tasty, that's true. But, in my opinion, it's too expensive there. One cup costs three hundred rubles."
    gloss: "Dima: The coffee is tasty, that's true. But, in my opinion, it's too expensive there. One cup costs three hundred rubles."
  ru.b2.unit08.lesson06.teach.dialogue_nastya_hold:
    title: "Nastya: And yet, in my opinion, it isn't expensive."
    gloss: "Nastya: And yet, in my opinion, it isn't expensive."
  ru.b2.unit08.lesson06.teach.dialogue_dima_summary:
    title: "Dima: So we agree about the coffee, but disagree about the price."
    gloss: "Dima: So we agree about the coffee, but disagree about the price."
  ru.b2.unit08.lesson06.teach.grammar_polnyj_sintez:
    title: "They agree about the coffee. They disagree about the price. The most convincing is Dima, because he gives a reason."
    gloss: "They agree about the coffee. They disagree about the price. The most convincing is Dima, because he gives a reason."
    note: "A full synthesis has THREE named parts: the AGREEMENT (*они сходятся во мнении о*), the CONFLICT (*они расходятся во мнении о*), and a reasoned JUDGEMENT (*наиболее убедителен X, потому что...*). Either order works for the verdict: *наиболее убедителен Дима* or *Дима наиболее убедителен*."

