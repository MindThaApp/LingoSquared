      - {value: "Они сходятся во мнении о кофе, но расходятся во мнении о цене. Наиболее убедителен Дима", status: "correct"}
      - {value: "Они сходятся во мнении о кофе но расходятся во мнении о цене. Наиболее убедителен Дима.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе но расходятся во мнении о цене. Наиболее убедителен Дима", status: "correct"}
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Наиболее убедителен Дима.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе, но они расходятся во мнении о цене. Наиболее убедителен Дима.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе, но расходятся во мнении о цене. Дима наиболее убедителен.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Дима наиболее убедителен.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе, но они расходятся во мнении о цене. Дима наиболее убедителен.", status: "correct"}
    feedback: "A synthesis with a judgement: agreement (они сходятся во мнении о кофе), conflict (они расходятся во мнении о цене), and a verdict (наиболее убедителен Дима)."
  ru.b2.unit08.lesson06.exercise06.write_sintez:
    instruction: "Write a THREE-sentence synthesis of the two speakers. (1) Name their AGREEMENT, using они сходятся во мнении о: They agree about the coffee. (2) Name their CONFLICT, using они расходятся во мнении о: They disagree about the price. (3) Give a reasoned JUDGEMENT, using наиболее убедителен + потому что: The most convincing is Dima, because he gives a reason."
    accepted_answers:
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Наиболее убедителен Дима, потому что он приводит причину.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Наиболее убедителен Дима, потому что он приводит причину", status: "correct"}
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Наиболее убедителен Дима потому что он приводит причину.", status: "correct"}
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Наиболее убедителен Дима потому что он приводит причину", status: "correct"}
      - {value: "Они сходятся во мнении о кофе. Они расходятся во мнении о цене. Дима наиболее убедителен, потому что он приводит причину.", status: "correct"}
    feedback: "A full synthesis names all three: the agreement (они сходятся во мнении о кофе), the conflict (они расходятся во мнении о цене), and a reasoned judgement (наиболее убедителен Дима, потому что он приводит причину)."
