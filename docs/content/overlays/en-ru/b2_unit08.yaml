    feedback: "Both reviews call the coffee tasty -- Ольга: 'кофе там вкусный', Павел: 'кофе ... вкусный, это правда'. That is their point of agreement."
  ru.b2.unit08.lesson05.exercise02.read_conflict:
    instruction: "On what point do the two reviews CONFLICT?"
