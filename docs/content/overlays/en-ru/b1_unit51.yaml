schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.b1.unit51"
source_language: "en"
target_language: "ru"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Claude-authored B1 draft. Needs fresh-context review."}

course:
  title: "Russian B1"
  description: "Learn B1-level Russian for combining two facts about a person into one sentence using the relative pronoun который, agreeing in gender and number, and combined with a preposition (с которым / с которой)."

units:
  ru.b1.unit51.opisanija: {title: "Descriptions"}

lessons:
  ru.b1.unit51.lesson01.kotoryi_kotoraja: {title: "который / которая"}
  ru.b1.unit51.lesson02.s_kotorym_s_kotoroj: {title: "с которым / с которой"}
  ru.b1.unit51.lesson03.opisanija_kollegi: {title: "Describing colleagues"}

teaching:
  ru.b1.unit51.lesson01.teach.eto_dima_kotoryi: {title: "Это Дима, который работает инженером.", gloss: "This is Dima, who works as an engineer.", note: "который is masculine, agreeing with Дима, the noun it describes.", example_gloss: null}
  ru.b1.unit51.lesson01.teach.eto_nastja_kotoraja: {title: "Это Настя, которая работает учительницей.", gloss: "This is Nastya, who works as a teacher.", note: "которая is feminine, agreeing with Настя.", example_gloss: null}
  ru.b1.unit51.lesson01.teach.kotoryi_grammar: {title: "который / которая / которое / которые = относительное местоимение, согласуется в роде и числе", gloss: "который / которая / которое / которые = a relative pronoun, agrees in gender and number", note: "The relative pronoun который changes form to agree in gender and number with the noun it describes, not with the following verb.", example_gloss: "который for masculine, которая for feminine: This is Dima, who works as an engineer. This is Nastya, who works as a teacher."}
  ru.b1.unit51.lesson02.teach.eto_kollega_s_kotorym: {title: "Это коллега, с которым я работаю над проектом.", gloss: "This is the colleague I work on the project with.", note: "с которым combines который (masculine) with the preposition с, in the instrumental case.", example_gloss: null}
  ru.b1.unit51.lesson02.teach.eto_podruga_s_kotoroj: {title: "Это подруга, с которой я хожу в кино.", gloss: "This is the friend I go to the cinema with.", note: "с которой is the feminine instrumental form combined with с.", example_gloss: null}
  ru.b1.unit51.lesson02.teach.s_kotorym_grammar: {title: "с которым / с которой = который + предлог в творительном падеже", gloss: "with whom (masc.) / with whom (fem.) = который + preposition in the instrumental case", note: "который can combine with a preposition; the pronoun then takes the case that preposition requires, here the instrumental (creative) case after с.", example_gloss: "который can combine with a preposition: This is the colleague I work on the project with."}
  ru.b1.unit51.lesson03.teach.nastya_intro_dima: {title: "Nastya introduces Dima", gloss: "Nastya: This is Dima, who works as an engineer.", note: "Reuses the masculine relative-clause introduction."}
  ru.b1.unit51.lesson03.teach.dima_intro_kollega: {title: "Dima introduces his colleague", gloss: "Dima: And this is my colleague, with whom I work on a new project.", note: "Uses the feminine instrumental с которой to add identifying detail."}
  ru.b1.unit51.lesson03.teach.nastya_ask_proekt: {title: "Nastya asks about the project", gloss: "Nastya: Nice to meet you! The project you're talking about, is it interesting?", note: "о котором combines который with the preposition о, in the prepositional case."}
  ru.b1.unit51.lesson03.teach.dima_confirm: {title: "Dima confirms", gloss: "Dima: Yes, very.", note: "A short, natural confirmation."}

exercises:
  ru.b1.unit51.lesson01.exercise01.recognize_kotoryi_dima: {instruction: "Which Russian sentence means \"this is Dima, who works as an engineer\"?", correct_option: "это дима который работает инженером", distractors: ["это настя которая работает учительницей", "это коллега с которым я работаю над проектом", "это подруга с которой я хожу в кино"], accepted_answers: [{value: "это дима который работает инженером", status: "correct"}], feedback: "который is masculine, agreeing with Дима."}
  ru.b1.unit51.lesson01.exercise02.recognize_kotoraja_nastja: {instruction: "Which Russian sentence means \"this is Nastya, who works as a teacher\"?", correct_option: "это настя которая работает учительницей", distractors: ["это дима который работает инженером", "это подруга с которой я хожу в кино", "это коллега с которым я работаю над проектом"], accepted_answers: [{value: "это настя которая работает учительницей", status: "correct"}], feedback: "которая is feminine, agreeing with Настя."}
  ru.b1.unit51.lesson01.exercise03.listen_select_kotoryi_dima: {instruction: "Listen. Which relative pronoun form is used, and why?", correct_option: "который, because Dima is masculine.", distractors: ["которая, because Dima is masculine.", "который, because engineer is feminine.", "которое, because Dima is neuter."], accepted_answers: [{value: "который, because Dima is masculine.", status: "correct"}], feedback: "The recording says *Это Дима, который работает инженером*."}
  ru.b1.unit51.lesson01.exercise04.match_kotoryi_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Это Дима, который", right: "This is Dima, who"}
          - {left: "работает инженером", right: "works as an engineer"}
          - {left: "Это Настя, которая", right: "This is Nastya, who"}
          - {left: "работает учительницей", right: "works as a teacher"}
          - {left: "относительное местоимение", right: "a relative pronoun"}
          - {left: "согласуется в роде и числе", right: "agrees in gender and number"}
        status: "correct"
    feedback: "These build the two gender-agreeing relative-clause sentences."
  ru.b1.unit51.lesson01.exercise05.order_kotoraja_nastja: {instruction: "Put the words in order to say \"This is Nastya, who works as a teacher.\"", accepted_answers: [{value: ["Это", "Настя", "которая", "работает", "учительницей"], status: "correct"}], feedback: "The correct order is *Это Настя, которая работает учительницей*."}
  ru.b1.unit51.lesson01.exercise06.write_kotoryi_dima:
    instruction: "Write exactly this sentence combining two facts with the masculine relative pronoun который: This is Dima, who works as an engineer."
    accepted_answers:
      - {value: "Это Дима, который работает инженером.", status: "correct"}
      - {value: "Это Дима, который работает инженером", status: "correct"}
    feedback: "The model answer is *Это Дима, который работает инженером*."
  ru.b1.unit51.lesson02.exercise01.recognize_s_kotorym: {instruction: "Which Russian sentence means \"this is the colleague I work on the project with\"?", correct_option: "это коллега с которым я работаю над проектом", distractors: ["это подруга с которой я хожу в кино", "это дима который работает инженером", "это настя которая работает учительницей"], accepted_answers: [{value: "это коллега с которым я работаю над проектом", status: "correct"}], feedback: "с которым combines который with the preposition с."}
  ru.b1.unit51.lesson02.exercise02.recognize_s_kotoroj: {instruction: "Which Russian sentence means \"this is the friend I go to the cinema with\"?", correct_option: "это подруга с которой я хожу в кино", distractors: ["это коллега с которым я работаю над проектом", "это дима который работает инженером", "это настя которая работает учительницей"], accepted_answers: [{value: "это подруга с которой я хожу в кино", status: "correct"}], feedback: "с которой is the feminine instrumental form."}
  ru.b1.unit51.lesson02.exercise03.listen_select_s_kotorym: {instruction: "Listen. Who is described, and how?", correct_option: "A colleague, described by the project worked on with them.", distractors: ["A friend, described by the cinema trip.", "Dima, described by his job.", "Nastya, described by her job."], accepted_answers: [{value: "A colleague, described by the project worked on with them.", status: "correct"}], feedback: "The recording says *Это коллега, с которым я работаю над проектом*."}
  ru.b1.unit51.lesson02.exercise04.match_s_kotorym_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "коллега, с которым", right: "the colleague, with whom"}
          - {left: "работаю над проектом", right: "I work on the project"}
          - {left: "подруга, с которой", right: "the friend, with whom"}
          - {left: "хожу в кино", right: "I go to the cinema"}
          - {left: "творительном падеже", right: "the instrumental case"}
          - {left: "предлог", right: "a preposition"}
        status: "correct"
    feedback: "These build the two preposition-combined relative-clause sentences."
  ru.b1.unit51.lesson02.exercise05.order_s_kotoroj_podruga: {instruction: "Put the words in order to say \"This is the friend I go to the cinema with.\"", accepted_answers: [{value: ["Это", "подруга", "с", "которой", "я", "хожу", "в", "кино"], status: "correct"}], feedback: "The correct order is *Это подруга, с которой я хожу в кино*."}
  ru.b1.unit51.lesson02.exercise06.write_s_kotorym_kollega:
    instruction: "Write exactly this sentence using с которым (relative pronoun combined with a preposition, instrumental case, masculine): This is the colleague I work on the project with."
    accepted_answers:
      - {value: "Это коллега, с которым я работаю над проектом.", status: "correct"}
      - {value: "Это коллега, с которым я работаю над проектом", status: "correct"}
    feedback: "The model answer is *Это коллега, с которым я работаю над проектом*."
  ru.b1.unit51.lesson03.exercise01.choose_full_description: {instruction: "Which answer combines two facts about a colleague into one sentence using a gender-agreeing который that also combines with a preposition?", correct_option: "Это моя коллега, с которой я работаю над новым проектом.", distractors: ["Я бы предложил перенести встречу на пятницу.", "Это Настя, которая работает учительницей.", "Если бы у меня было больше времени, я бы путешествовал больше."], accepted_answers: [{value: "Это моя коллега, с которой я работаю над новым проектом.", status: "correct"}], feedback: "с которой agrees in gender (feminine) and combines with the preposition с."}
  ru.b1.unit51.lesson03.exercise02.dialogue_comprehension_opisanija:
    instruction: "Listen to the dialogue. Who is Dima, who is the colleague, and what does Nastya ask about the project?"
    correct_option: "Dima is described as an engineer; the colleague is the person Dima works on a new project with; Nastya asks whether the project is interesting"
    distractors: ["Dima is described as a teacher; the colleague is Nastya's friend from the cinema; Nastya asks whether the project is finished", "Nastya is described as an engineer; the colleague is the person she works with; Dima asks whether the project is interesting", "Dima is described as an engineer; the colleague is his sister; Nastya asks how long the project will take"]
    accepted_answers: [{value: "Dima is described as an engineer; the colleague is the person Dima works on a new project with; Nastya asks whether the project is interesting", status: "correct"}]
    feedback: "Each description combines two facts with an agreeing, preposition-marked который."
  ru.b1.unit51.lesson03.exercise03.match_dialogue_opisanija:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Это Дима, который работает инженером.", right: "This is Dima, who works as an engineer."}
          - {left: "А это моя коллега, с которой я работаю над новым проектом.", right: "And this is my colleague, with whom I work on a new project."}
          - {left: "Приятно познакомиться!", right: "Nice to meet you!"}
          - {left: "Проект, о котором вы говорите, интересный?", right: "The project you're talking about, is it interesting?"}
          - {left: "Да, очень.", right: "Yes, very."}
          - {left: "новым проектом", right: "a new project"}
        status: "correct"
    feedback: "These phrases build the full descriptions dialogue."
  ru.b1.unit51.lesson03.exercise04.order_dima_intro_kollega: {instruction: "Put the words in order to say \"And this is my colleague, with whom I work on a new project.\"", accepted_answers: [{value: ["А", "это", "моя", "коллега", "с", "которой", "я", "работаю", "над", "новым", "проектом"], status: "correct"}], feedback: "The correct order is *А это моя коллега, с которой я работаю над новым проектом*."}
  ru.b1.unit51.lesson03.exercise05.reply_ask_proekt:
    instruction: "Nastya asks \"Проект, о котором вы говорите, интересный?\" Reply with exactly: \"Да, очень.\""
    accepted_answers:
      - {value: "Да, очень.", status: "correct"}
      - {value: "Да, очень", status: "correct"}
    feedback: "A short, natural confirmation."
  ru.b1.unit51.lesson03.exercise06.write_full_description:
    instruction: "Combine these two facts into one sentence using с которой (feminine relative pronoun combined with a preposition, instrumental case): \"She is my colleague.\" + \"I work with her on a new project.\""
    accepted_answers:
      - {value: "Это моя коллега, с которой я работаю над новым проектом.", status: "correct"}
      - {value: "Это моя коллега, с которой я работаю над новым проектом", status: "correct"}
    feedback: "The model answer is *Это моя коллега, с которой я работаю над новым проектом*."
