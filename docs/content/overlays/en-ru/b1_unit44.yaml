course:
  title: "Russian B1"
  description: "Learn B1-level Russian for explaining the purpose or goal behind an action with чтобы, across study, work, and saving-money topics."

units:
  ru.b1.unit44.celi: {title: "Goals"}

lessons:
  ru.b1.unit44.lesson01.uchitsya_chtoby: {title: "Studying, in order to..."}
  ru.b1.unit44.lesson02.otkladyvaet_chtoby: {title: "Saving, so that..."}
  ru.b1.unit44.lesson03.zachem_ty_uchishsya: {title: "Why do you study?"}

teaching:
  ru.b1.unit44.lesson01.teach.uchitsya_po_vecheram: {title: "Дима учится по вечерам, чтобы получить повышение.", gloss: "Dima studies in the evenings in order to get a promotion.", note: "*чтобы получить* uses the infinitive because the subject of both clauses is the same (Dima).", example_gloss: "Every week Dima studies in the evenings in order to get a promotion."}
  ru.b1.unit44.lesson01.teach.chtoby_infinitive: {title: "чтобы + инфинитив = один субъект", gloss: "chtoby + infinitive = one subject", note: "Use чтобы with an infinitive when the same person does both actions.", example_gloss: "If the subject is the same person, use chtoby plus infinitive: studies in order to get a promotion."}
  ru.b1.unit44.lesson01.teach.zachem_uchishsya: {title: "Зачем ты учишься по вечерам?", gloss: "Why do you study in the evenings?", note: "*Зачем* asks specifically about purpose/goal, not just cause.", example_gloss: "Dima, why do you study in the evenings?"}
  ru.b1.unit44.lesson02.teach.otkladyvaet_dengi: {title: "Настя откладывает деньги, чтобы Дима мог купить машину.", gloss: "Nastya saves money so that Dima could buy a car.", note: "*чтобы Дима мог купить* uses a past-tense form because the subjects differ (Nastya saves, Dima buys).", example_gloss: "Every month Nastya saves money so that Dima could buy a car."}
  ru.b1.unit44.lesson02.teach.chtoby_past_different_subject: {title: "чтобы + прошедшее время = разные субъекты", gloss: "chtoby + past tense = different subjects", note: "When the two clauses have different subjects, чтобы takes a past-tense verb form regardless of the actual time meant.", example_gloss: "If the subjects are different, use chtoby plus past tense: saves so that Dima could buy."}
  ru.b1.unit44.lesson02.teach.zachem_otkladyvaesh: {title: "Зачем ты откладываешь деньги?", gloss: "Why do you save money?", note: "*откладываешь* = \"you save/set aside\" (habitual present).", example_gloss: "Nastya, why do you save money?"}
  ru.b1.unit44.lesson03.teach.nastya_question: {title: "Nastya asks why Dima studies", gloss: "Nastya: Dima, why do you study in the evenings?", note: "Opens the goals dialogue."}
  ru.b1.unit44.lesson03.teach.dima_answer: {title: "Dima gives his purpose", gloss: "Dima: I study in order to get a promotion.", note: "Same-subject purpose with чтобы + infinitive."}
  ru.b1.unit44.lesson03.teach.dima_question: {title: "Dima asks about saving money", gloss: "Dima: And why do you save money?", note: "Turns the question back to Nastya."}
  ru.b1.unit44.lesson03.teach.nastya_answer: {title: "Nastya gives her purpose", gloss: "Nastya: I save money so that you could buy a car.", note: "Different-subject purpose with чтобы + past-tense form."}

exercises:
  ru.b1.unit44.lesson01.exercise01.recognize_purpose_infinitive: {instruction: "Which Russian phrase means \"in order to get a promotion\"?", correct_option: "чтобы получить повышение", distractors: ["чтобы дима мог купить машину", "по вечерам учится", "зачем ты откладываешь"], accepted_answers: [{value: "чтобы получить повышение", status: "correct"}], feedback: "*чтобы получить* uses the infinitive for a same-subject purpose."}
  ru.b1.unit44.lesson01.exercise02.recognize_uchitsya: {instruction: "Which Russian phrase means \"Dima studies in the evenings\"?", correct_option: "дима учится по вечерам", distractors: ["настя откладывает деньги", "дима мог купить машину", "зачем ты учишься"], accepted_answers: [{value: "дима учится по вечерам", status: "correct"}], feedback: "*учится по вечерам* means \"studies in the evenings.\""}
  ru.b1.unit44.lesson01.exercise03.listen_select_purpose_infinitive: {instruction: "Listen. Why does Dima study in the evenings?", correct_option: "To get a promotion.", distractors: ["To buy a car.", "To save money.", "To help Nastya."], accepted_answers: [{value: "To get a promotion.", status: "correct"}], feedback: "The recording says *Дима учится по вечерам, чтобы получить повышение*."}
  ru.b1.unit44.lesson01.exercise04.match_purpose_infinitive_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "учится", right: "studies"}
          - {left: "по вечерам", right: "in the evenings"}
          - {left: "чтобы", right: "in order to"}
          - {left: "получить", right: "to get"}
          - {left: "повышение", right: "promotion"}
          - {left: "Зачем", right: "why / for what purpose"}
        status: "correct"
    feedback: "These build a same-subject purpose sentence."
  ru.b1.unit44.lesson01.exercise05.order_purpose_infinitive: {instruction: "Put the words in order to say \"Dima studies in the evenings in order to get a promotion.\"", accepted_answers: [{value: ["Дима", "учится", "по", "вечерам", "чтобы", "получить", "повышение"], status: "correct"}], feedback: "The correct order is *Дима учится по вечерам, чтобы получить повышение*."}
  ru.b1.unit44.lesson01.exercise06.write_purpose_infinitive:
    instruction: "Write exactly this purpose sentence with чтобы + infinitive (same subject): Dima studies in the evenings in order to get a promotion."
    accepted_answers:
      - {value: "Дима учится по вечерам, чтобы получить повышение.", status: "correct"}
      - {value: "Дима учится по вечерам чтобы получить повышение.", status: "correct"}
      - {value: "Дима учится по вечерам, чтобы получить повышение", status: "correct"}
      - {value: "Дима учится по вечерам чтобы получить повышение", status: "correct"}
    feedback: "The model answer is *Дима учится по вечерам, чтобы получить повышение*."
  ru.b1.unit44.lesson02.exercise01.recognize_purpose_past_subject: {instruction: "Which Russian phrase means \"so that Dima could buy a car\"?", correct_option: "чтобы дима мог купить машину", distractors: ["чтобы получить повышение", "настя откладывает деньги", "зачем ты учишься"], accepted_answers: [{value: "чтобы дима мог купить машину", status: "correct"}], feedback: "*чтобы Дима мог купить* uses a past-tense form because the subjects differ."}
  ru.b1.unit44.lesson02.exercise02.recognize_otkladyvaet: {instruction: "Which Russian phrase means \"Nastya saves money\"?", correct_option: "настя откладывает деньги", distractors: ["дима учится по вечерам", "настя мог купить машину", "зачем откладываешь"], accepted_answers: [{value: "настя откладывает деньги", status: "correct"}], feedback: "*откладывает деньги* means \"saves money.\""}
  ru.b1.unit44.lesson02.exercise03.listen_select_purpose_past_subject: {instruction: "Listen. Why does Nastya save money?", correct_option: "So that Dima could buy a car.", distractors: ["So that she could get a promotion.", "So that she could study in the evenings.", "So that Dima could cook dinner."], accepted_answers: [{value: "So that Dima could buy a car.", status: "correct"}], feedback: "The recording says *Настя откладывает деньги, чтобы Дима мог купить машину*."}
  ru.b1.unit44.lesson02.exercise04.match_purpose_past_subject_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "откладывает", right: "saves / sets aside"}
          - {left: "деньги", right: "money"}
          - {left: "мог", right: "could"}
          - {left: "купить", right: "to buy"}
          - {left: "машину", right: "car"}
          - {left: "разные субъекты", right: "different subjects"}
        status: "correct"
    feedback: "These build a different-subject purpose sentence."
  ru.b1.unit44.lesson02.exercise05.order_purpose_past_subject: {instruction: "Put the words in order to say \"Nastya saves money so that Dima could buy a car.\"", accepted_answers: [{value: ["Настя", "откладывает", "деньги", "чтобы", "Дима", "мог", "купить", "машину"], status: "correct"}], feedback: "The correct order is *Настя откладывает деньги, чтобы Дима мог купить машину*."}
  ru.b1.unit44.lesson02.exercise06.write_purpose_past_subject:
    instruction: "Write exactly this purpose sentence with чтобы + past-tense form (different subjects): Nastya saves money so that Dima could buy a car."
    accepted_answers:
      - {value: "Настя откладывает деньги, чтобы Дима мог купить машину.", status: "correct"}
      - {value: "Настя откладывает деньги чтобы Дима мог купить машину.", status: "correct"}
      - {value: "Настя откладывает деньги, чтобы Дима мог купить машину", status: "correct"}
      - {value: "Настя откладывает деньги чтобы Дима мог купить машину", status: "correct"}
    feedback: "The model answer is *Настя откладывает деньги, чтобы Дима мог купить машину*."
  ru.b1.unit44.lesson03.exercise01.choose_complete_purpose: {instruction: "Which answer states a same-subject purpose with чтобы + infinitive AND a different-subject purpose with чтобы + past tense?", correct_option: "Я учусь, чтобы получить повышение. Я откладываю деньги, чтобы ты мог купить машину.", distractors: ["Если будет дождь, мы останемся дома.", "Дима сказал, что он придёт в офис.", "Когда я прихожу домой, я готовлю ужин."], accepted_answers: [{value: "Я учусь, чтобы получить повышение. Я откладываю деньги, чтобы ты мог купить машину.", status: "correct"}], feedback: "The correct answer contrasts чтобы + infinitive (same subject) with чтобы + past tense (different subjects)."}
  ru.b1.unit44.lesson03.exercise02.dialogue_comprehension_purpose:
    instruction: "Listen to the dialogue. Why does each person do what they do?"
    correct_option: "Dima studies in the evenings to get a promotion; Nastya saves money so that Dima could buy a car"
    distractors: ["Dima studies to buy a car; Nastya saves money to get a promotion", "Dima saves money to help Nastya; Nastya studies to become a teacher", "Dima works late to fix the report; Nastya checks the address"]
    accepted_answers: [{value: "Dima studies in the evenings to get a promotion; Nastya saves money so that Dima could buy a car", status: "correct"}]
    feedback: "Dima and Nastya each state their own purpose using чтобы."
  ru.b1.unit44.lesson03.exercise03.match_dialogue_purpose:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Зачем ты учишься по вечерам?", right: "Why do you study in the evenings?"}
          - {left: "Я учусь, чтобы получить повышение.", right: "I study in order to get a promotion."}
          - {left: "А зачем ты откладываешь деньги?", right: "And why do you save money?"}
          - {left: "Я откладываю деньги", right: "I save money"}
          - {left: "чтобы ты мог купить машину", right: "so that you could buy a car"}
          - {left: "повышение", right: "promotion"}
        status: "correct"
    feedback: "These phrases build the full goals dialogue."
  ru.b1.unit44.lesson03.exercise04.order_dima_answer: {instruction: "Put the words in order to say \"I study in order to get a promotion.\"", accepted_answers: [{value: ["Я", "учусь", "чтобы", "получить", "повышение"], status: "correct"}], feedback: "The correct order is *Я учусь, чтобы получить повышение*."}
  ru.b1.unit44.lesson03.exercise05.reply_why_study:
    instruction: "Nastya asks \"Дима, зачем ты учишься по вечерам?\" Answer with exactly this sentence: \"Я учусь, чтобы получить повышение.\""
    accepted_answers:
      - {value: "Я учусь, чтобы получить повышение.", status: "correct"}
      - {value: "Я учусь чтобы получить повышение.", status: "correct"}
    feedback: "The model answer states the same-subject purpose."
  ru.b1.unit44.lesson03.exercise06.write_full_purpose_exchange:
    instruction: "Write two purpose sentences: as Дима, say why you study in the evenings using чтобы + infinitive (to get a promotion); as Настя, say why you save money using чтобы + past-tense form with a different subject (so that Dima could buy a car)."
    accepted_answers:
      - {value: "Я учусь, чтобы получить повышение. Я откладываю деньги, чтобы ты мог купить машину.", status: "correct"}
      - {value: "Я учусь чтобы получить повышение. Я откладываю деньги чтобы ты мог купить машину.", status: "correct"}
    feedback: "A complete answer contrasts чтобы + infinitive with чтобы + past tense across the two topics."
