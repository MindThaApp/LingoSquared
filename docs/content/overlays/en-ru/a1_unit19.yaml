course:
  title: "Russian A1"
  description: "Learn A1-level Russian for handling a basic train journey, buying a ticket, and asking about time and platform."

units:
  ru.a1.unit19.travel: {title: "A ticket to Tula"}

lessons:
  ru.a1.unit19.lesson01.bilet_do_tuly: {title: "A ticket to Tula"}
  ru.a1.unit19.lesson02.poezd_v_desyat: {title: "The train is at ten o'clock"}
  ru.a1.unit19.lesson03.na_vokzale: {title: "Dialogue: at the station"}

teaching:
  ru.a1.unit19.lesson01.teach.bilet_do_tuly: {title: "Билет до Тулы, пожалуйста.", gloss: "A ticket to Tula, please.", note: "до means \"to\" for a destination. Тула becomes Тулы after до.", example_gloss: "A ticket to Tula for today, please."}
  ru.a1.unit19.lesson01.teach.vokzal: {title: "вокзал", gloss: "station", note: "вокзал is a train station.", example_gloss: "The station is nearby."}
  ru.a1.unit19.lesson01.teach.poezd: {title: "поезд", gloss: "train", note: "поезд means \"train.\"", example_gloss: "The train is here."}
  ru.a1.unit19.lesson02.teach.poezd_v_desyat: {title: "Поезд в десять часов.", gloss: "The train is at ten o'clock.", note: "в + time tells when something happens.", example_gloss: "The train is today at ten o'clock."}
  ru.a1.unit19.lesson02.teach.platforma: {title: "платформа", gloss: "platform", note: "платформа means \"platform.\"", example_gloss: "Platform two."}
  ru.a1.unit19.lesson02.teach.segondya: {title: "сегодня", gloss: "today", note: "сегодня means \"today.\"", example_gloss: "The train is today."}
  ru.a1.unit19.lesson03.teach.dima_bilet_do_tuly: {title: "Dima asks for a ticket", gloss: "Dima: Hello! A ticket to Tula, please.", note: "Дима uses polite service-counter language."}
  ru.a1.unit19.lesson03.teach.kassir_na_segodnya: {title: "The cashier asks the date", gloss: "Cashier: For today?", note: "На сегодня? is a short service question."}
  ru.a1.unit19.lesson03.teach.dima_da_vo_skolko: {title: "Dima asks the time", gloss: "Dima: Yes, for today. What time is the train?", note: "Во сколько поезд? asks the train time."}
  ru.a1.unit19.lesson03.teach.kassir_poezd_platforma: {title: "The cashier gives the details", gloss: "Cashier: The train is at ten o'clock, platform two.", note: "The answer includes both departure time and platform."}
  ru.a1.unit19.lesson03.teach.dima_spasibo: {title: "Dima thanks the cashier", gloss: "Dima: Thank you.", note: "Спасибо closes the exchange politely."}

exercises:
  ru.a1.unit19.lesson02.poezd_v_desyat.exercise09.dictation_poezd_v_desyat_neutral:
    instruction: "Type what you hear."
    correct_option: "Поезд в десять часов"
    accepted_answers: [{value: "Поезд в десять часов", status: correct}]
    orthography_strict: true

  ru.a1.unit19.lesson01.exercise01.recognize_bilet:
    instruction: "Which word means \"ticket\"?"
    correct_option: "билет"
    distractors: ["поезд", "вокзал", "до"]
    accepted_answers: [{value: "билет", status: "correct"}]
    feedback: "билет means \"ticket.\""
  ru.a1.unit19.lesson01.exercise02.recognize_poezd:
    instruction: "Which word means \"train\"?"
    correct_option: "поезд"
    distractors: ["билет", "вокзал", "Тулы"]
    accepted_answers: [{value: "поезд", status: "correct"}]
    feedback: "поезд means \"train.\""
  ru.a1.unit19.lesson01.exercise03.listen_select_bilet_do_tuly:
    instruction: "Listen to the recording. What does the speaker want?"
    correct_option: "A ticket to Tula."
    distractors: ["A train at ten.", "Platform two.", "A station near Tula."]
    accepted_answers: [{value: "A ticket to Tula.", status: "correct"}]
    feedback: "The recording says Билет до Тулы, пожалуйста."
  ru.a1.unit19.lesson01.exercise04.match_travel_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "билет", right: "ticket"}
          - {left: "поезд", right: "train"}
          - {left: "вокзал", right: "station"}
          - {left: "до Тулы", right: "to Tula"}
          - {left: "Билет до Тулы.", right: "A ticket to Tula."}
          - {left: "пожалуйста", right: "please"}
        status: "correct"
    feedback: "билет=ticket, поезд=train, вокзал=station, до Тулы=to Tula."
  ru.a1.unit19.lesson01.exercise05.order_bilet_do_tuly:
    instruction: "Put the words in the correct order to say \"A ticket to Tula, please.\""
    accepted_answers:
      - {value: ["Билет", "до", "Тулы", "пожалуйста"], status: "correct"}
    feedback: "The correct order is Билет до Тулы, пожалуйста."
  ru.a1.unit19.lesson01.exercise06.listen_order_bilet_do_tuly:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Билет", "до", "Тулы", "пожалуйста"], status: "correct"}
    feedback: "The correct order is Билет до Тулы, пожалуйста."
  ru.a1.unit19.lesson01.exercise07.complete_bilet_do_tuly:
    instruction: "Complete the sentence: Билет ___ Тулы. (to)"
    accepted_answers:
      - {value: "до", status: "correct"}
      - {value: "Билет до Тулы", status: "correct"}
    feedback: "до means \"to\" here."
  ru.a1.unit19.lesson01.exercise08.write_ticket_request:
    instruction: "Write a polite request for a ticket to Tula."
    accepted_answers:
      - {value: "Билет до Тулы, пожалуйста.", status: "correct"}
      - {value: "Билет до Тулы пожалуйста", status: "correct"}
    feedback: "Билет до Тулы, пожалуйста. is a natural ticket-counter request."

  ru.a1.unit19.lesson02.exercise01.recognize_platforma:
    instruction: "Which word means \"platform\"?"
    correct_option: "платформа"
    distractors: ["поезд", "сегодня", "часов"]
    accepted_answers: [{value: "платформа", status: "correct"}]
    feedback: "платформа means \"platform.\""
  ru.a1.unit19.lesson02.exercise02.recognize_segodnya:
    instruction: "Which word means \"today\"?"
    correct_option: "сегодня"
    distractors: ["платформа", "поезд", "десять"]
    accepted_answers: [{value: "сегодня", status: "correct"}]
    feedback: "сегодня means \"today.\""
  ru.a1.unit19.lesson02.exercise03.listen_select_poezd_v_desyat:
    instruction: "Listen to the recording. When is the train?"
    correct_option: "At ten o'clock."
    distractors: ["Today.", "From platform two.", "To Tula."]
    accepted_answers: [{value: "At ten o'clock.", status: "correct"}]
    feedback: "The recording says Поезд в десять часов."
  ru.a1.unit19.lesson02.exercise04.match_schedule_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "поезд", right: "train"}
          - {left: "платформа", right: "platform"}
          - {left: "сегодня", right: "today"}
          - {left: "десять часов", right: "ten o'clock"}
          - {left: "Платформа два.", right: "Platform two."}
          - {left: "Поезд в десять часов.", right: "The train is at ten o'clock."}
        status: "correct"
    feedback: "These are the core words for reading simple journey details."
  ru.a1.unit19.lesson02.exercise05.order_poezd_v_desyat:
    instruction: "Put the words in the correct order to say \"The train is at ten o'clock.\""
    accepted_answers:
      - {value: ["Поезд", "в", "десять", "часов"], status: "correct"}
    feedback: "The correct order is Поезд в десять часов."
  ru.a1.unit19.lesson02.exercise06.listen_order_poezd_v_desyat:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Поезд", "в", "десять", "часов"], status: "correct"}
    feedback: "The correct order is Поезд в десять часов."
  ru.a1.unit19.lesson02.exercise07.complete_platforma_dva:
    instruction: "Complete the sentence: ___ два. (platform)"
    accepted_answers:
      - {value: "Платформа", status: "correct"}
      - {value: "Платформа два", status: "correct"}
    feedback: "Платформа два means \"platform two.\""
  ru.a1.unit19.lesson02.exercise08.write_train_time:
    instruction: "Write a sentence saying the train is at ten o'clock."
    accepted_answers:
      - {value: "Поезд в десять часов.", status: "correct"}
      - {value: "Поезд в десять часов", status: "correct"}
    feedback: "Поезд в десять часов. means \"The train is at ten o'clock.\""

  ru.a1.unit19.lesson03.exercise01.choose_ask_train_info:
    instruction: "You want to ask what time the train is. What do you say?"
    correct_option: "Во сколько поезд?"
    distractors: ["Билет до Тулы.", "Платформа два.", "На сегодня?"]
    accepted_answers: [{value: "Во сколько поезд?", status: "correct"}]
    feedback: "Во сколько поезд? asks \"What time is the train?\""
  ru.a1.unit19.lesson03.exercise02.listen_select_s_kakoy_platformy:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "Which platform the train leaves from."
    distractors: ["What time the train leaves.", "Whether the ticket is for today.", "Where Tula is."]
    accepted_answers: [{value: "Which platform the train leaves from.", status: "correct"}]
    feedback: "С какой платформы поезд? asks which platform the train is from."
  ru.a1.unit19.lesson03.exercise03.dialogue_comprehension_na_vokzale:
    instruction: "Listen to the dialogue. What journey details does Dima get?"
    correct_option: "A ticket to Tula for today; the train is at ten from platform two"
    distractors: ["A ticket to Moscow tomorrow; the train is at seven", "A bus ticket to Tula from platform three", "Only the platform, not the time"]
    accepted_answers: [{value: "A ticket to Tula for today; the train is at ten from platform two", status: "correct"}]
    feedback: "The cashier says Поезд в десять часов, платформа два."
  ru.a1.unit19.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Билет до Тулы, пожалуйста.", right: "A ticket to Tula, please."}
          - {left: "На сегодня?", right: "For today?"}
          - {left: "Во сколько поезд?", right: "What time is the train?"}
          - {left: "Поезд в десять часов.", right: "The train is at ten o'clock."}
          - {left: "Платформа два.", right: "Platform two."}
          - {left: "Спасибо.", right: "Thank you."}
        status: "correct"
    feedback: "These phrases complete a basic ticket-counter exchange."
  ru.a1.unit19.lesson03.exercise05.order_vo_skolko_poezd:
    instruction: "Put the words in the correct order to ask \"What time is the train?\""
    accepted_answers:
      - {value: ["Во", "сколько", "поезд"], status: "correct"}
    feedback: "The correct order is Во сколько поезд?"
  ru.a1.unit19.lesson03.exercise06.reply_na_segodnya:
    instruction: "Someone asks \"На сегодня?\" Reply \"Yes, for today.\""
    accepted_answers:
      - {value: "Да, на сегодня.", status: "correct"}
      - {value: "Да, на сегодня", status: "correct"}
    feedback: "Да, на сегодня. means \"Yes, for today.\""
  ru.a1.unit19.lesson03.exercise07.complete_poezd_v_desyat:
    instruction: "Complete the sentence: Поезд в ___ часов. (ten)"
    accepted_answers:
      - {value: "десять", status: "correct"}
      - {value: "Поезд в десять часов", status: "correct"}
    feedback: "десять means \"ten.\""
  ru.a1.unit19.lesson03.exercise08.write_journey_request:
    instruction: "Write two short sentences: ask for a ticket to Tula and ask what time the train is."
    accepted_answers:
      - {value: "Билет до Тулы, пожалуйста. Во сколько поезд?", status: "correct"}
      - {value: "Билет до Тулы пожалуйста. Во сколько поезд?", status: "correct"}
    feedback: "A complete request is Билет до Тулы, пожалуйста. Во сколько поезд?"
  ru.a1.unit19.lesson03.exercise09.read_ticket_details:
    instruction: "Read the ticket card. Which journey details does it show?"
    correct_option: "To Tula, ten o'clock, platform two."
    distractors: ["To Tula, platform ten, two o'clock.", "For today, ten o'clock, no platform.", "A ticket to Tula, no time, platform two."]
    accepted_answers: [{value: "To Tula, ten o'clock, platform two.", status: "correct"}]
    feedback: "до Тулы is the destination, десять часов is the time, and платформа два is platform two."
