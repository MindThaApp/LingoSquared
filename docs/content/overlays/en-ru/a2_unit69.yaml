course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Describe how life used to be, for example in childhood, and say how it differs from now."
units:
  ru.a2.unit69.ranshe_i_teper: {title: "Then and now", description: "Describe past habits and states with the imperfective past, and contrast then with now."}
lessons:
  ru.a2.unit69.lesson01.gde_ya_zhil: {"title": "Where I lived before"}
  ru.a2.unit69.lesson02.kazhdyj_den: {"title": "Every day"}
  ru.a2.unit69.lesson03.u_nas_byl_dom: {"title": "We had a house"}
  ru.a2.unit69.lesson04.togda_i_sejchas: {"title": "Then and now"}
  ru.a2.unit69.lesson05.pismo_ot_dimy: {"title": "A letter from Dima"}
  ru.a2.unit69.lesson06.nastya_sprashivaet: {"title": "Nastya asks Dima"}
teaching:
  ru.a2.unit69.lesson01.teach.glagoly_proshedshee: {"title": "Past tense: live, go, play, like", "gloss": "lived / went / played / liked (masculine, feminine, plural)", "note": "These are imperfective past forms of *жить*, *ходить*, *играть* and *любить*. They tell what used to happen or how things used to be. Masculine ends in -л, feminine in -ла, plural in -ли.", "example_gloss": ["Dima used to live in a village.", "Nastya used to go to school.", "We used to play in the yard.", "Dima liked reading."]}
  ru.a2.unit69.lesson01.teach.slova_mesto: {"title": "Then, now and places", "gloss": "before, in the past / now / village / city / school / yard", "note": "*В* + prepositional case says where: *в деревне*, *в городе*, *во дворе*. *Раньше* looks back; *теперь* means 'now'.", "example_gloss": ["Before, I lived in a city.", "We did not live in a village.", "Nastya and Dima played in the yard."]}
  ru.a2.unit69.lesson01.teach.mestoimeniya: {"title": "Pronouns and not", "gloss": "I / you / he / she / we / you (plural) / they / not", "note": "In the past tense the verb agrees with the subject in gender and number. *Ты* and *я* take the form of the person speaking or spoken to.", "example_gloss": ["He used to live in a city.", "She went to school.", "You did not play in the yard.", "They lived in a village."]}
  ru.a2.unit69.lesson01.teach.gn_proshedshee: {"title": "Past tense endings", "gloss": "he lived, she lived, we lived, you lived, they lived", "note": "The past tense has no person endings, only gender and number: *-л* (masculine), *-ла* (feminine), *-ли* (plural). A man says *я жил*, a woman says *я жила*. *Мы*, *вы* and *они* always take *-ли*."}
  ru.a2.unit69.lesson01.teach.gn_ne: {"title": "Negation with не", "gloss": "Dima did not live in a city. We did not play in the yard.", "note": "Put *не* directly before the past-tense verb. The verb form does not change."}
  ru.a2.unit69.lesson02.teach.markery: {"title": "Habit words", "gloss": "every day / on Sundays / usually / often / always / back then", "note": "These time words show a habit or a repeated action. Imperfective past verbs go naturally with them.", "example_gloss": ["Dima got up early every day.", "On Sundays we went to grandmother's.", "Usually Nastya read in the evening.", "Back then I always played in the yard.", "We often went to the park."]}
  ru.a2.unit69.lesson02.teach.glagoly_privychka: {"title": "More past-tense verbs", "gloss": "got up / went (by transport) / read / worked (masculine, feminine, plural)", "note": "*Вставать*, *ездить*, *читать* and *работать* form the past like the verbs in lesson 1. *Ездить* means going by transport, while *ходить* means going on foot.", "example_gloss": ["In the morning he got up early.", "I went to see a friend.", "In the evening she read a book.", "Back then Nastya worked at a school."]}
  ru.a2.unit69.lesson02.teach.slova_den: {"title": "Times and people", "gloss": "early / in the morning / in the evening / grandmother / park / book / friend", "note": "*Утром* and *вечером* are time-of-day adverbs and need no preposition.", "example_gloss": ["Grandmother lived in a village.", "We went to the park.", "Dima read a book.", "A friend lived in a city."]}
  ru.a2.unit69.lesson02.teach.gn_privychka: {"title": "Habits in the past", "gloss": "Every day I got up early. On Sundays we went to grandmother's.", "note": "A repeated or habitual action in the past uses the imperfective past tense. Words like *каждый день*, *по воскресеньям*, *часто* and *всегда* signal a habit. How this differs from a single finished action is covered in the next unit."}
  ru.a2.unit69.lesson02.teach.gn_poryadok: {"title": "Where the habit word goes", "gloss": "Usually Dima read in the evening. Dima usually read in the evening.", "note": "Words like *обычно*, *часто* and *всегда* are flexible: they can open the sentence or stand before the verb. The meaning stays the same."}
  ru.a2.unit69.lesson03.teach.veshchi: {"title": "Things and people", "gloss": "house / flat / garden / dog / lake / bicycle / friends", "note": "Gender decides the past form of *быть*: *дом*, *сад* and *велосипед* are masculine, *квартира* and *собака* feminine, *озеро* neuter, *друзья* plural.", "example_gloss": ["We had a house.", "She had a flat.", "We had a garden.", "We had a dog.", "There was a lake nearby.", "I had a bicycle.", "He had friends."]}
  ru.a2.unit69.lesson03.teach.u_kogo: {"title": "Who had it? Where?", "gloss": "I have / you have / he has / she has / we have / you (plural) have / they have / nearby / there", "note": "Russian says 'have' with *у* + a pronoun: *у меня был дом* literally means 'at me there was a house'.", "example_gloss": ["Did you have a bicycle?", "They had a garden.", "There was a lake there.", "In the village I had friends."]}
  ru.a2.unit69.lesson03.teach.gn_byl: {"title": "быть in the past", "gloss": "there was a house, there was a flat, there was a lake, there were friends", "note": "The past of *быть* has four forms: *был* (masculine), *была* (feminine), *было* (neuter) and *были* (plural). It agrees with the thing that was there or that someone had, not with the person."}
  ru.a2.unit69.lesson03.teach.gn_u_nas: {"title": "Saying what you had", "gloss": "We had a house. She had a dog. They had friends.", "note": "Use *у* + pronoun for the owner, then *был/была/было/были* + the thing owned. Do not use *жить* or a verb meaning 'to have' here."}
  ru.a2.unit69.lesson04.teach.nastoyashchee: {"title": "Present tense: now", "gloss": "I live / he, she lives / we live / I work / he, she works / I read / he, she reads / I go / he, she goes / I get up / he, she gets up", "note": "These present-tense forms describe how things are now. Compare them with the past forms: *жил* and *живу*, *ходил* and *ходит*.", "example_gloss": ["Before, we lived in a village, but now we live in a city.", "Before, he went to school, but now he works.", "Before, I got up early, but now I get up late.", "Right now Nastya is reading a book."]}
  ru.a2.unit69.lesson04.teach.slova_kogda: {"title": "When I was little", "gloss": "but / when / in childhood / late / at home / now / small (instrumental m. / f. / pl.)", "note": "After *был/была/были* the adjective is in the instrumental case: *был маленьким* (masculine), *была маленькой* (feminine), *были маленькими* (plural). *Сейчас* and *теперь* both mean 'now'.", "example_gloss": ["In my childhood I lived in a village.", "When I was little, I liked reading.", "When Nastya was little, she played in the yard.", "Right now Dima works at home.", "When we were little, we lived in a city."]}
  ru.a2.unit69.lesson04.teach.gn_teper: {"title": "Present tense of жить", "gloss": "I live, you live, he lives, we live, you (plural) live, they live", "note": "For *теперь* and *сейчас* use the present tense, which has endings for each person. The past tense only changes for gender and number."}
  ru.a2.unit69.lesson04.teach.gn_kontrast: {"title": "Then and now", "gloss": "Before, I lived in a village, but now I live in a city. Before, we played in the yard, but now we work.", "note": "Use the past tense with *раньше* and *тогда*, the present tense with *теперь* and *сейчас*. *А* links the two halves and marks the contrast; put a comma before it."}
  ru.a2.unit69.lesson04.teach.gn_tvorit: {"title": "Был маленьким, была маленькой", "gloss": "I was little. She was little. We were little.", "note": "The adjective after *был/была/были* is in the instrumental: *-им* (masculine), *-ой* (feminine), *-ими* (plural). A man says *я был маленьким*, a woman *я была маленькой*."}
  ru.a2.unit69.lesson05.teach.slova_pismo: {"title": "Letter words", "gloss": "hi / bye / big / letter", "note": "*Привет* and *пока* are informal greetings between friends, so there is no *вы* here.", "example_gloss": ["Hi, Nastya!", "Bye, Dima!", "We had a big house."]}
  ru.a2.unit69.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! In my childhood I lived in a small village. We had a big house, and there was a lake nearby. Every day I got up early and played in the yard. On Sundays we went to grandmother's. Now I live in a city and work at home. Bye! Dima", "note": "Dima contrasts then (past tense, habit words) with now (present tense).", "glosses": {"детстве": "childhood", "рядом": "nearby", "озеро": "lake", "бабушке": "grandmother (dative)"}}
  ru.a2.unit69.lesson06.teach.gde: {"title": "Nastya asks", "gloss": "Nastya: Dima, where did you live before?"}
  ru.a2.unit69.lesson06.teach.derevnya: {"title": "Dima answers", "gloss": "Dima: Before, I lived in a village. We had a house and a garden."}
  ru.a2.unit69.lesson06.teach.chto_delal: {"title": "Nastya asks about his days", "gloss": "Nastya: And what did you do every day?"}
  ru.a2.unit69.lesson06.teach.vstaval: {"title": "Dima describes his habits", "gloss": "Dima: I got up early and played in the yard. On Sundays we went to grandmother's."}
  ru.a2.unit69.lesson06.teach.teper: {"title": "Nastya asks about now", "gloss": "Nastya: And now do you live in a city?"}
  ru.a2.unit69.lesson06.teach.da: {"title": "Dima answers", "gloss": "Dima: Yes, now I live in a city and work at home."}
exercises:
  ru.a2.unit69.lesson01.exercise01.choose_zhil: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима раньше жил в деревне.", "distractors": ["Дима раньше жила в деревне.", "Дима раньше жили в деревне.", "Дима раньше жить в деревне."], "accepted_answers": [{"value": "Дима раньше жил в деревне.", "status": "correct"}], "feedback": "A masculine subject takes *жил*: *Дима раньше жил в деревне.*"}
  ru.a2.unit69.lesson01.exercise02.choose_hodila: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя ходила в школу.", "distractors": ["Настя ходил в школу.", "Настя ходили в школу.", "Настя ходит в школу."], "accepted_answers": [{"value": "Настя ходила в школу.", "status": "correct"}], "feedback": "*Настя* is feminine, so the verb ends in *-ла*; *ходит* is present tense."}
  ru.a2.unit69.lesson01.exercise03.match_slova: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "раньше", "right": "before, in the past"}, {"left": "теперь", "right": "now"}, {"left": "деревня", "right": "village"}, {"left": "город", "right": "city"}, {"left": "школа", "right": "school"}, {"left": "двор", "right": "yard"}], "status": "correct"}], "feedback": "These words recur through the whole unit."}
  ru.a2.unit69.lesson01.exercise04.order_igrali: {"instruction": "Put the words in order to say 'We used to play in the yard.'", "correct_option": "Мы раньше играли во дворе", "accepted_answers": [{"value": "Мы раньше играли во дворе", "status": "correct"}, {"value": "Раньше мы играли во дворе", "status": "correct"}, {"value": "Мы играли во дворе раньше", "status": "correct"}], "feedback": "*Играли* is plural and agrees with *мы*; *раньше* can stand before or after the subject."}
  ru.a2.unit69.lesson01.exercise05.complete_hodila: {"instruction": "Complete with the past tense of *ходить* (the subject is Nastya).", "correct_option": "ходила", "accepted_answers": [{"value": "ходила", "status": "correct"}], "feedback": "*Настя* is feminine, so *ходила*."}
  ru.a2.unit69.lesson01.exercise06.translate_zhili: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Мы раньше жили в деревне.", "status": "correct"}, {"value": "Мы раньше жили в деревне", "status": "correct"}, {"value": "Раньше мы жили в деревне.", "status": "correct"}, {"value": "Раньше мы жили в деревне", "status": "correct"}, {"value": "Мы жили в деревне раньше.", "status": "correct"}, {"value": "Мы жили в деревне раньше", "status": "correct"}, {"value": "Мы жили в деревне.", "status": "correct"}, {"value": "Мы жили в деревне", "status": "correct"}], "feedback": "*Мы раньше жили в деревне* = We used to live in a village. *Жили* is the plural form."}
  ru.a2.unit69.lesson01.exercise07.write_igral: {"instruction": "Write the requested Russian sentence.", "correct_option": "Дима раньше играл во дворе.", "accepted_answers": [{"value": "Дима раньше играл во дворе.", "status": "correct"}, {"value": "Дима раньше играл во дворе", "status": "correct"}, {"value": "Дима играл во дворе.", "status": "correct"}, {"value": "Дима играл во дворе", "status": "correct"}, {"value": "Раньше Дима играл во дворе.", "status": "correct"}, {"value": "Раньше Дима играл во дворе", "status": "correct"}, {"value": "Дима играл во дворе раньше.", "status": "correct"}, {"value": "Дима играл во дворе раньше", "status": "correct"}], "feedback": "*Дима раньше играл во дворе* = Dima used to play in the yard."}
  ru.a2.unit69.lesson02.exercise01.choose_vstaval: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Каждый день Дима вставал рано.", "distractors": ["Каждый день Дима вставала рано.", "Каждый день Дима вставали рано.", "Каждый день Дима встаёт рано."], "accepted_answers": [{"value": "Каждый день Дима вставал рано.", "status": "correct"}], "feedback": "*Дима* is masculine, so *вставал*. *Встаёт* is present tense."}
  ru.a2.unit69.lesson02.exercise02.choose_ezdili: {"instruction": "Choose the correct Russian sentence.", "correct_option": "По воскресеньям мы ездили к бабушке.", "distractors": ["По воскресеньям мы ездил к бабушке.", "По воскресеньям мы ездила к бабушке.", "По воскресеньям я ездили к бабушке."], "accepted_answers": [{"value": "По воскресеньям мы ездили к бабушке.", "status": "correct"}], "feedback": "*Мы* takes the plural *ездили*."}
  ru.a2.unit69.lesson02.exercise03.match_markery: {"instruction": "Match each Russian habit word to its English meaning.", "accepted_answers": [{"value": [{"left": "каждый день", "right": "every day"}, {"left": "по воскресеньям", "right": "on Sundays"}, {"left": "обычно", "right": "usually"}, {"left": "часто", "right": "often"}, {"left": "всегда", "right": "always"}, {"left": "тогда", "right": "back then"}], "status": "correct"}], "feedback": "These words signal repeated actions."}
  ru.a2.unit69.lesson02.exercise04.order_chitala: {"instruction": "Put the words in order to say 'Usually Nastya read in the evening.'", "correct_option": "Обычно Настя читала вечером", "accepted_answers": [{"value": "Обычно Настя читала вечером", "status": "correct"}, {"value": "Настя обычно читала вечером", "status": "correct"}, {"value": "Настя читала вечером обычно", "status": "correct"}, {"value": "Вечером Настя обычно читала", "status": "correct"}, {"value": "Обычно вечером Настя читала", "status": "correct"}], "feedback": "*Читала* is feminine to match *Настя*; the habit word can open the sentence or stand before the verb."}
  ru.a2.unit69.lesson02.exercise05.complete_ezdil: {"instruction": "Complete with the past tense of *ездить* (the subject is Dima).", "correct_option": "ездил", "accepted_answers": [{"value": "ездил", "status": "correct"}], "feedback": "*Дима* is masculine, so *ездил*."}
  ru.a2.unit69.lesson02.exercise06.translate_vecherom: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Обычно мы читали вечером.", "status": "correct"}, {"value": "Обычно мы читали вечером", "status": "correct"}, {"value": "Мы обычно читали вечером.", "status": "correct"}, {"value": "Мы обычно читали вечером", "status": "correct"}, {"value": "Вечером мы обычно читали.", "status": "correct"}, {"value": "Вечером мы обычно читали", "status": "correct"}, {"value": "Обычно вечером мы читали.", "status": "correct"}, {"value": "Обычно вечером мы читали", "status": "correct"}, {"value": "Мы читали вечером.", "status": "correct"}, {"value": "Мы читали вечером", "status": "correct"}], "feedback": "*Обычно мы читали вечером* = Usually we read in the evening. The habit word is flexible."}
  ru.a2.unit69.lesson02.exercise07.write_togda: {"instruction": "Write the requested Russian sentence (a man or a woman may be speaking).", "correct_option": "Тогда я всегда вставал рано.", "accepted_answers": [{"value": "Тогда я всегда вставал рано.", "status": "correct"}, {"value": "Тогда я всегда вставал рано", "status": "correct"}, {"value": "Тогда я всегда вставала рано.", "status": "correct"}, {"value": "Тогда я всегда вставала рано", "status": "correct"}, {"value": "Я тогда всегда вставал рано.", "status": "correct"}, {"value": "Я тогда всегда вставал рано", "status": "correct"}, {"value": "Я тогда всегда вставала рано.", "status": "correct"}, {"value": "Я тогда всегда вставала рано", "status": "correct"}, {"value": "Я всегда тогда вставал рано.", "status": "correct"}, {"value": "Я всегда тогда вставал рано", "status": "correct"}, {"value": "Я всегда тогда вставала рано.", "status": "correct"}, {"value": "Я всегда тогда вставала рано", "status": "correct"}, {"value": "Я всегда вставал рано тогда.", "status": "correct"}, {"value": "Я всегда вставал рано тогда", "status": "correct"}, {"value": "Я всегда вставала рано тогда.", "status": "correct"}, {"value": "Я всегда вставала рано тогда", "status": "correct"}], "feedback": "*Тогда я всегда вставал рано* = Back then I always got up early. A woman writes *вставала*."}
  ru.a2.unit69.lesson03.exercise01.choose_u_nas: {"instruction": "Choose the correct Russian sentence.", "correct_option": "У нас был дом.", "distractors": ["У нас была дом.", "У нас были дом.", "У нас было дом."], "accepted_answers": [{"value": "У нас был дом.", "status": "correct"}], "feedback": "*Дом* is masculine, so *был*."}
  ru.a2.unit69.lesson03.exercise02.choose_u_neyo: {"instruction": "Choose the correct Russian sentence.", "correct_option": "У неё была собака.", "distractors": ["У неё был собака.", "У неё было собака.", "У неё были собака."], "accepted_answers": [{"value": "У неё была собака.", "status": "correct"}], "feedback": "*Собака* is feminine, so *была*."}
  ru.a2.unit69.lesson03.exercise03.match_veshchi: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "дом", "right": "house"}, {"left": "квартира", "right": "flat"}, {"left": "сад", "right": "garden"}, {"left": "собака", "right": "dog"}, {"left": "озеро", "right": "lake"}, {"left": "велосипед", "right": "bicycle"}, {"left": "друзья", "right": "friends"}], "status": "correct"}], "feedback": "These are the things people had in the past."}
  ru.a2.unit69.lesson03.exercise04.order_ozero: {"instruction": "Put the words in order to say 'We had a lake nearby.'", "correct_option": "У нас рядом было озеро", "accepted_answers": [{"value": "У нас рядом было озеро", "status": "correct"}, {"value": "Рядом у нас было озеро", "status": "correct"}, {"value": "У нас было озеро рядом", "status": "correct"}], "feedback": "*Озеро* is neuter, so *было*."}
  ru.a2.unit69.lesson03.exercise05.complete_byli: {"instruction": "Complete with the past tense of *быть*.", "correct_option": "были", "accepted_answers": [{"value": "были", "status": "correct"}], "feedback": "*Друзья* is plural, so *были*."}
  ru.a2.unit69.lesson03.exercise06.translate_dom: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "У них был дом в деревне.", "status": "correct"}, {"value": "У них был дом в деревне", "status": "correct"}, {"value": "У них в деревне был дом.", "status": "correct"}, {"value": "У них в деревне был дом", "status": "correct"}, {"value": "В деревне у них был дом.", "status": "correct"}, {"value": "В деревне у них был дом", "status": "correct"}], "feedback": "*У них был дом в деревне* = They had a house in the village. *Дом* is masculine, so *был*."}
