course:
  title: "Russian B1"
  description: "Learn B1-level Russian for agreeing and disagreeing with reasons."

units:
  ru.b1.unit38.debaty: {title: "Debate"}

lessons:
  ru.b1.unit38.lesson01.soglasen_s_tem_chto: {title: "I agree with the idea that..."}
  ru.b1.unit38.lesson02.ne_soglasna_s_tem_chto: {title: "I disagree with the idea that..."}
  ru.b1.unit38.lesson03.debaty_dialogue: {title: "Dialogue: agreement and reason"}

teaching:
  ru.b1.unit38.lesson01.teach.soglasen_s_tem: {title: "Я согласен с тем, что работать дома удобно.", gloss: "I agree with the idea that working at home is convenient.", note: "*согласен с тем, что...* references the other person's view before giving your stance.", example_gloss: "Dima agrees with the idea that working at home is convenient."}
  ru.b1.unit38.lesson01.teach.potomu_chto_tiho: {title: "потому что там тихо", gloss: "because it is quiet there", note: "*потому что* introduces the reason.", example_gloss: "I agree with the idea that working at home is convenient because it is quiet there."}
  ru.b1.unit38.lesson01.teach.mnenie_dima: {title: "Дима думает, что работать дома удобно.", gloss: "Dima thinks that working at home is convenient.", note: "*думает, что...* reports Dima's view.", example_gloss: "Dima thinks that working at home is convenient."}
  ru.b1.unit38.lesson02.teach.ne_soglasna_s_tem: {title: "Я не согласна с тем, что встреча лишняя.", gloss: "I disagree with the idea that the meeting is unnecessary.", note: "*согласна* is the female-speaker form used by Настя.", example_gloss: "Nastya disagrees with the idea that the meeting is unnecessary."}
  ru.b1.unit38.lesson02.teach.nuzhno_obsudit: {title: "Нам нужно обсудить план.", gloss: "We need to discuss the plan.", note: "This gives a clear reason for keeping the meeting.", example_gloss: "We need to discuss the plan."}
  ru.b1.unit38.lesson02.teach.mnenie_vstrecha: {title: "Дима думает, что встреча лишняя.", gloss: "Dima thinks that the meeting is unnecessary.", note: "This is the view Настя responds to.", example_gloss: "Dima thinks that the meeting is unnecessary."}
  ru.b1.unit38.lesson03.teach.dima_opinion: {title: "Dima gives an opinion", gloss: "Dima: I think that the meeting tomorrow is unnecessary.", note: "The opinion is reported with *думаю, что*."}
  ru.b1.unit38.lesson03.teach.nastya_disagrees: {title: "Nastya disagrees with a reason", gloss: "Nastya: I disagree with the idea that the meeting is unnecessary because we need to discuss the plan.", note: "This gives a stance, references the view, and gives a reason."}
  ru.b1.unit38.lesson03.teach.dima_understands: {title: "Dima acknowledges", gloss: "Dima: I understand.", note: "A short acknowledgement keeps the exchange natural."}
  ru.b1.unit38.lesson03.teach.dima_agrees: {title: "Dima agrees with a reason", gloss: "Dima: I agree with the idea that the plan is important because the project is urgent.", note: "This uses the same stance-plus-reason frame."}

exercises:
  ru.b1.unit38.lesson01.exercise01.recognize_soglasen_s_tem: {instruction: "Which Russian phrase means \"I agree with the idea that\"?", correct_option: "я согласен с тем, что", distractors: ["я не согласна с тем, что", "я думаю, что", "потому что там тихо"], accepted_answers: [{value: "я согласен с тем, что", status: "correct"}], feedback: "*Я согласен с тем, что...* means \"I agree with the idea that...\""}
  ru.b1.unit38.lesson01.exercise02.recognize_potomu_chto_tiho: {instruction: "Which Russian phrase means \"because it is quiet there\"?", correct_option: "потому что там тихо", distractors: ["потому что проект срочный", "нам нужно обсудить план", "встреча лишняя"], accepted_answers: [{value: "потому что там тихо", status: "correct"}], feedback: "*потому что там тихо* gives the reason."}
  ru.b1.unit38.lesson01.exercise03.listen_select_agree_reason: {instruction: "Listen. What reason does the speaker give for agreeing?", correct_option: "It is quiet there.", distractors: ["The meeting is unnecessary.", "The plan is urgent.", "They need to discuss the plan."], accepted_answers: [{value: "It is quiet there.", status: "correct"}], feedback: "The recording says *потому что там тихо*."}
  ru.b1.unit38.lesson01.exercise04.match_agreement_reason:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я согласен", right: "I agree"}
          - {left: "с тем, что", right: "with the idea that"}
          - {left: "работать дома", right: "to work at home"}
          - {left: "удобно", right: "it is convenient"}
          - {left: "потому что", right: "because"}
          - {left: "там тихо", right: "it is quiet there"}
        status: "correct"
    feedback: "These phrases build an agreement statement with a reason."
  ru.b1.unit38.lesson01.exercise05.order_agree_reason: {instruction: "Put the words in order to say \"I agree with the idea that working at home is convenient because it is quiet there.\"", accepted_answers: [{value: ["Я", "согласен", "с", "тем", "что", "работать", "дома", "удобно", "потому", "что", "там", "тихо"], status: "correct"}], feedback: "The correct order is *Я согласен с тем, что работать дома удобно, потому что там тихо*."}
  ru.b1.unit38.lesson01.exercise06.write_agree_reason:
    instruction: "Write exactly this agreement sentence: use Я согласен с тем, что, state that working at home is convenient, and give the reason потому что там тихо."
    accepted_answers:
      - {value: "Я согласен с тем, что работать дома удобно, потому что там тихо.", status: "correct"}
      - {value: "Я согласен с тем что работать дома удобно потому что там тихо.", status: "correct"}
      - {value: "Я согласен с тем, что работать дома удобно, потому что там тихо", status: "correct"}
      - {value: "Я согласен с тем что работать дома удобно потому что там тихо", status: "correct"}
    feedback: "The model answer is *Я согласен с тем, что работать дома удобно, потому что там тихо*."
  ru.b1.unit38.lesson02.exercise01.recognize_ne_soglasna: {instruction: "Which Russian phrase means \"I disagree with the idea that\" for a female speaker?", correct_option: "я не согласна с тем, что", distractors: ["я согласен с тем, что", "я думаю, что", "я согласна с тем, что"], accepted_answers: [{value: "я не согласна с тем, что", status: "correct"}], feedback: "*Я не согласна с тем, что...* is the female-speaker disagreement form."}
  ru.b1.unit38.lesson02.exercise02.recognize_vstrecha_lishnyaya: {instruction: "Which Russian phrase means \"the meeting is unnecessary\"?", correct_option: "встреча лишняя", distractors: ["план важен", "проект срочный", "там тихо"], accepted_answers: [{value: "встреча лишняя", status: "correct"}], feedback: "*встреча лишняя* means \"the meeting is unnecessary.\""}
  ru.b1.unit38.lesson02.exercise03.listen_select_disagree_reason: {instruction: "Listen. Why does the speaker disagree?", correct_option: "They need to discuss the plan.", distractors: ["It is quiet there.", "The project is urgent.", "Working at home is convenient."], accepted_answers: [{value: "They need to discuss the plan.", status: "correct"}], feedback: "The recording says *потому что нам нужно обсудить план*."}
  ru.b1.unit38.lesson02.exercise04.match_disagreement_reason:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я не согласна", right: "I disagree"}
          - {left: "встреча лишняя", right: "the meeting is unnecessary"}
          - {left: "нам нужно", right: "we need to"}
          - {left: "обсудить план", right: "discuss the plan"}
          - {left: "Дима думает", right: "Dima thinks"}
          - {left: "план", right: "plan"}
        status: "correct"
    feedback: "These phrases build a disagreement statement with a reason."
  ru.b1.unit38.lesson02.exercise05.order_disagree_reason: {instruction: "Put the words in order to say \"I disagree with the idea that the meeting is unnecessary because we need to discuss the plan.\"", accepted_answers: [{value: ["Я", "не", "согласна", "с", "тем", "что", "встреча", "лишняя", "потому", "что", "нам", "нужно", "обсудить", "план"], status: "correct"}], feedback: "The correct order is *Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план*."}
  ru.b1.unit38.lesson02.exercise06.write_disagree_reason:
    instruction: "As Настя, write exactly this disagreement sentence: use Я не согласна с тем, что, state that the meeting is unnecessary, and give the reason that we need to discuss the plan."
    accepted_answers:
      - {value: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.", status: "correct"}
      - {value: "Я не согласна с тем что встреча лишняя потому что нам нужно обсудить план.", status: "correct"}
      - {value: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план", status: "correct"}
      - {value: "Я не согласна с тем что встреча лишняя потому что нам нужно обсудить план", status: "correct"}
    feedback: "The model answer is *Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план*."
  ru.b1.unit38.lesson03.exercise01.choose_full_debate: {instruction: "Which answer disagrees with Dima's view and gives a reason?", correct_option: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.", distractors: ["Я согласен с тем, что работать дома удобно, потому что там тихо.", "Я думаю, что встреча завтра лишняя.", "Понимаю."], accepted_answers: [{value: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.", status: "correct"}], feedback: "The correct answer disagrees with the view and gives the reason."}
  ru.b1.unit38.lesson03.exercise02.dialogue_comprehension_debate:
    instruction: "Listen to the dialogue. What stance and reason does Nastya give?"
    correct_option: "She disagrees that the meeting is unnecessary because they need to discuss the plan"
    distractors: ["She agrees that working at home is convenient because it is quiet", "She says the plan is important because the project is urgent", "She says the meeting is tomorrow and gives no reason"]
    accepted_answers: [{value: "She disagrees that the meeting is unnecessary because they need to discuss the plan", status: "correct"}]
    feedback: "Настя says she disagrees and gives the reason that they need to discuss the plan."
  ru.b1.unit38.lesson03.exercise03.match_dialogue_debate:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я думаю, что", right: "I think that"}
          - {left: "встреча лишняя", right: "the meeting is unnecessary"}
          - {left: "Я не согласна", right: "I disagree"}
          - {left: "обсудить план", right: "discuss the plan"}
          - {left: "план важен", right: "the plan is important"}
          - {left: "проект срочный", right: "the project is urgent"}
        status: "correct"
    feedback: "These phrases show the opinion, stance, and reasons in the dialogue."
  ru.b1.unit38.lesson03.exercise04.order_plan_important: {instruction: "Put the words in order to say \"I agree with the idea that the plan is important because the project is urgent.\"", accepted_answers: [{value: ["Я", "согласен", "с", "тем", "что", "план", "важен", "потому", "что", "проект", "срочный"], status: "correct"}], feedback: "The correct order is *Я согласен с тем, что план важен, потому что проект срочный*."}
  ru.b1.unit38.lesson03.exercise05.reply_disagree:
    instruction: "Dima says \"Я думаю, что встреча завтра лишняя.\" As Настя, answer with the exact sentence: \"Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.\""
    accepted_answers:
      - {value: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.", status: "correct"}
      - {value: "Я не согласна с тем что встреча лишняя потому что нам нужно обсудить план.", status: "correct"}
      - {value: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план", status: "correct"}
      - {value: "Я не согласна с тем что встреча лишняя потому что нам нужно обсудить план", status: "correct"}
    feedback: "The model answer is *Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план*."
  ru.b1.unit38.lesson03.exercise06.write_full_debate_response:
    instruction: "As Настя, write one informal response to Dima. Use exactly the female disagreement form Я не согласна с тем, что; reference Dima's view that the meeting is unnecessary; and give the reason that you need to discuss the plan."
    accepted_answers:
      - {value: "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.", status: "correct"}
      - {value: "Я не согласна с тем что встреча лишняя потому что нам нужно обсудить план.", status: "correct"}
    feedback: "A complete answer states disagreement, references the view with *с тем, что*, and gives a reason."
  ru.b1.unit38.lesson01.soglasen_s_tem_chto.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Я согласен с тем, что работать дома удобно, потому что там тихо."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
