course:
  title: "Russian A1"
  description: "Learn A1-level Russian for describing weather and making a simple weather-related plan."

units:
  ru.a1.unit20.weather: {title: "Today it's cold"}

lessons:
  ru.a1.unit20.lesson01.segodnya_holodno: {title: "Today it's cold"}
  ru.a1.unit20.lesson02.idet_dozhd: {title: "It's raining"}
  ru.a1.unit20.lesson03.pogoda_i_plan: {title: "Dialogue: weather and a plan"}

teaching:
  ru.a1.unit20.lesson01.teach.segodnya_holodno: {title: "Сегодня холодно.", gloss: "Today it's cold.", note: "Russian often uses an impersonal weather word: холодно, literally \"coldly.\"", example_gloss: "Today it's cold, Dima."}
  ru.a1.unit20.lesson01.teach.teplo: {title: "тепло", gloss: "warm", note: "тепло works like холодно for weather or temperature.", example_gloss: "It's warm at home."}
  ru.a1.unit20.lesson01.teach.pogoda: {title: "погода", gloss: "weather", note: "погода means \"weather.\"", example_gloss: "The weather is good today."}
  ru.a1.unit20.lesson02.teach.idet_dozhd: {title: "Идёт дождь.", gloss: "It's raining.", note: "Russian says дождь идёт, literally \"rain is going.\" English speakers often expect a dummy \"it,\" but Russian does not use one here.", example_gloss: "It's raining today."}
  ru.a1.unit20.lesson02.teach.solntse: {title: "солнце", gloss: "sun", note: "Сегодня есть солнце is a simple way to say there is sun today.", example_gloss: "There is sun today."}
  ru.a1.unit20.lesson02.teach.veter: {title: "ветер", gloss: "wind", note: "На улице ветер is a natural way to say it is windy outside.", example_gloss: "It is windy outside."}
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda: {title: "Nastya asks about the weather", gloss: "Nastya: What's the weather like today?", note: "Какая сегодня погода? is the standard question."}
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd: {title: "Dima describes the weather", gloss: "Dima: Today it's cold and raining.", note: "Дима combines two weather facts with и."}
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma: {title: "Nastya suggests a plan", gloss: "Nastya: Then let's stay home.", note: "Давай останемся дома is an informal suggestion."}
  ru.a1.unit20.lesson03.teach.dima_doma_teplo: {title: "Dima agrees", gloss: "Dima: Okay, it's warm at home.", note: "Дома тепло gives a reason for the plan."}

exercises:
  ru.a1.unit20.lesson01.exercise01.recognize_holodno:
    instruction: "Which word means \"cold\"?"
    correct_option: "холодно"
    distractors: ["тепло", "погода", "сегодня"]
    accepted_answers: [{value: "холодно", status: "correct"}]
    feedback: "холодно means \"cold.\""
  ru.a1.unit20.lesson01.exercise02.recognize_pogoda:
    instruction: "Which word means \"weather\"?"
    correct_option: "погода"
    distractors: ["холодно", "тепло", "сегодня"]
    accepted_answers: [{value: "погода", status: "correct"}]
    feedback: "погода means \"weather.\""
  ru.a1.unit20.lesson01.exercise03.listen_select_segodnya_holodno:
    instruction: "Listen to the recording. What is the weather like?"
    correct_option: "It's cold today."
    distractors: ["It's warm today.", "It's raining today.", "It's windy today."]
    accepted_answers: [{value: "It's cold today.", status: "correct"}]
    feedback: "The recording says Сегодня холодно."
  ru.a1.unit20.lesson01.exercise04.match_weather_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "сегодня", right: "today"}
          - {left: "холодно", right: "cold"}
          - {left: "тепло", right: "warm"}
          - {left: "погода", right: "weather"}
          - {left: "Сегодня холодно.", right: "Today it's cold."}
          - {left: "Дома тепло.", right: "It's warm at home."}
        status: "correct"
    feedback: "These are the core words for simple weather descriptions."
  ru.a1.unit20.lesson01.exercise05.order_segodnya_holodno:
    instruction: "Put the words in the correct order to say \"Today it's cold.\""
    accepted_answers:
      - {value: ["Сегодня", "холодно"], status: "correct"}
    feedback: "The correct order is Сегодня холодно."
  ru.a1.unit20.lesson01.exercise06.listen_order_segodnya_holodno:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Сегодня", "холодно"], status: "correct"}
    feedback: "The correct order is Сегодня холодно."
  ru.a1.unit20.lesson01.exercise07.complete_segodnya_holodno:
    instruction: "Complete the sentence: Сегодня ___. (cold)"
    accepted_answers:
      - {value: "холодно", status: "correct"}
      - {value: "Сегодня холодно", status: "correct"}
    feedback: "Сегодня холодно means \"Today it's cold.\""
  ru.a1.unit20.lesson01.exercise08.write_today_cold:
    instruction: "Write a sentence saying it is cold today."
    accepted_answers:
      - {value: "Сегодня холодно.", status: "correct"}
      - {value: "Сегодня холодно", status: "correct"}
    feedback: "Сегодня холодно. is the natural sentence."

  ru.a1.unit20.lesson02.exercise01.recognize_dozhd:
    instruction: "Which word means \"rain\"?"
    correct_option: "дождь"
    distractors: ["солнце", "ветер", "идёт"]
    accepted_answers: [{value: "дождь", status: "correct"}]
    feedback: "дождь means \"rain.\""
  ru.a1.unit20.lesson02.exercise02.recognize_solntse:
    instruction: "Which word means \"sun\"?"
    correct_option: "солнце"
    distractors: ["дождь", "ветер", "холодно"]
    accepted_answers: [{value: "солнце", status: "correct"}]
    feedback: "солнце means \"sun.\""
  ru.a1.unit20.lesson02.exercise03.listen_select_idet_dozhd:
    instruction: "Listen to the recording. What is happening?"
    correct_option: "It's raining."
    distractors: ["It's sunny.", "It's windy.", "It's warm."]
    accepted_answers: [{value: "It's raining.", status: "correct"}]
    feedback: "The recording says Идёт дождь."
  ru.a1.unit20.lesson02.exercise04.match_weather_conditions:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "дождь", right: "rain"}
          - {left: "солнце", right: "sun"}
          - {left: "ветер", right: "wind"}
          - {left: "идёт дождь", right: "it's raining"}
          - {left: "Сегодня есть солнце.", right: "There is sun today."}
          - {left: "На улице ветер.", right: "It is windy outside."}
        status: "correct"
    feedback: "Идёт дождь is the Russian way to say \"It's raining.\""
  ru.a1.unit20.lesson02.exercise05.order_idet_dozhd:
    instruction: "Put the words in the correct order to say \"It's raining.\""
    accepted_answers:
      - {value: ["Идёт", "дождь"], status: "correct"}
    feedback: "The correct order is Идёт дождь."
  ru.a1.unit20.lesson02.exercise06.listen_order_idet_dozhd:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Идёт", "дождь"], status: "correct"}
    feedback: "The correct order is Идёт дождь."
  ru.a1.unit20.lesson02.exercise07.complete_idet_dozhd:
    instruction: "Complete the sentence: Идёт ___. (rain)"
    accepted_answers:
      - {value: "дождь", status: "correct"}
      - {value: "Идёт дождь", status: "correct"}
    feedback: "Идёт дождь means \"It's raining.\""
  ru.a1.unit20.lesson02.exercise08.write_its_raining:
    instruction: "Write a sentence saying it is raining."
    accepted_answers:
      - {value: "Идёт дождь.", status: "correct"}
      - {value: "Идёт дождь", status: "correct"}
    feedback: "Идёт дождь. means \"It's raining.\""

  ru.a1.unit20.lesson03.exercise01.choose_ask_weather:
    instruction: "You want to ask what the weather is like today. What do you say?"
    correct_option: "Какая сегодня погода?"
    distractors: ["Сегодня холодно.", "Идёт дождь.", "Давай останемся дома."]
    accepted_answers: [{value: "Какая сегодня погода?", status: "correct"}]
    feedback: "Какая сегодня погода? asks \"What's the weather like today?\""
  ru.a1.unit20.lesson03.exercise02.listen_select_ostanemsya_doma:
    instruction: "Listen to the recording. What plan is being suggested?"
    correct_option: "Stay home."
    distractors: ["Go to the station.", "Buy a ticket.", "Go to school."]
    accepted_answers: [{value: "Stay home.", status: "correct"}]
    feedback: "The recording says Давай останемся дома."
  ru.a1.unit20.lesson03.exercise03.dialogue_comprehension_pogoda_i_plan:
    instruction: "Listen to the dialogue. What is the weather, and what plan do they make?"
    correct_option: "It's cold and raining, so they will stay home"
    distractors: ["It's sunny, so they will go to the park", "It's warm, so they will go to Tula", "It's windy, so they will buy tickets"]
    accepted_answers: [{value: "It's cold and raining, so they will stay home", status: "correct"}]
    feedback: "Дима says холодно and идёт дождь; Настя suggests Давай останемся дома."
  ru.a1.unit20.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Какая сегодня погода?", right: "What's the weather like today?"}
          - {left: "Сегодня холодно.", right: "Today it's cold."}
          - {left: "Идёт дождь.", right: "It's raining."}
          - {left: "Давай останемся дома.", right: "Let's stay home."}
          - {left: "Дома тепло.", right: "It's warm at home."}
          - {left: "Тогда", right: "then / in that case"}
        status: "correct"
    feedback: "These phrases describe weather and make a simple plan."
  ru.a1.unit20.lesson03.exercise05.order_kakaya_segodnya_pogoda:
    instruction: "Put the words in the correct order to ask \"What's the weather like today?\""
    accepted_answers:
      - {value: ["Какая", "сегодня", "погода"], status: "correct"}
    feedback: "The correct order is Какая сегодня погода?"
  ru.a1.unit20.lesson03.exercise06.reply_kakaya_pogoda:
    instruction: "Someone asks \"Какая сегодня погода?\" Reply that it is cold and raining today."
    accepted_answers:
      - {value: "Сегодня холодно и идёт дождь.", status: "correct"}
      - {value: "Сегодня холодно и идёт дождь", status: "correct"}
    feedback: "Сегодня холодно и идёт дождь. gives the weather and condition."
  ru.a1.unit20.lesson03.exercise07.complete_ostanemsya_doma:
    instruction: "Complete the sentence: Давай ___ дома. (stay)"
    accepted_answers:
      - {value: "останемся", status: "correct"}
      - {value: "Давай останемся дома", status: "correct"}
    feedback: "Давай останемся дома means \"Let's stay home.\""
  ru.a1.unit20.lesson03.exercise08.write_weather_plan:
    instruction: "Write either \"Сегодня холодно. Идёт дождь. Давай останемся дома.\" or \"Сегодня холодно и идёт дождь. Давай останемся дома.\""
    accepted_answers:
      - {value: "Сегодня холодно. Идёт дождь. Давай останемся дома.", status: "correct"}
      - {value: "Сегодня холодно. Идёт дождь. Давай останемся дома", status: "correct"}
      - {value: "Сегодня холодно и идёт дождь. Давай останемся дома.", status: "correct"}
      - {value: "Сегодня холодно и идёт дождь. Давай останемся дома", status: "correct"}
    feedback: "A complete answer names the weather and follows with Давай останемся дома."
