  ru.b1.unit47.lesson02.zhal_chto_ne: {title: "It's a pity I didn't..."}
  ru.b1.unit47.lesson03.mokryi_dima: {title: "Dima is all wet"}

teaching:
  ru.b1.unit47.lesson01.teach.ne_vzyal_zont: {title: "Я не взял зонт, и теперь я весь мокрый.", gloss: "I didn't take an umbrella, and now I'm all wet.", note: "States what actually happened, setting up the regret.", example_gloss: null}
  ru.b1.unit47.lesson01.teach.mne_nado_bylo: {title: "Мне надо было взять зонт.", gloss: "I should have taken an umbrella.", note: "*надо было* + infinitive expresses regret about what should have been done.", example_gloss: null}
  ru.b1.unit47.lesson01.teach.nado_bylo_grammar: {title: "надо было + инфинитив = сожаление о прошлом", gloss: "nado bylo + infinitive = regret about the past", note: "Use надо было plus an infinitive to say what you should have done but didn't.", example_gloss: "I should have taken an umbrella — this is regret about the past."}
  ru.b1.unit47.lesson02.teach.zhal_chto_ne_vzyal: {title: "Жаль, что я не взял зонт.", gloss: "It's a pity I didn't take an umbrella.", note: "*жаль, что не* + past tense expresses a wish the past had been different.", example_gloss: null}
  ru.b1.unit47.lesson02.teach.zhal_chto_grammar: {title: "жаль, что не + прошедшее время = сожаление", gloss: "zhal, chto ne + past tense = regret", note: "Use жаль, что не plus a past-tense verb to wish something in the past had gone differently.", example_gloss: null}
  ru.b1.unit47.lesson02.teach.esli_by_ty_vzyal: {title: "Если бы ты взял зонт, ты бы не промок.", gloss: "If you had taken an umbrella, you wouldn't have gotten wet.", note: "A past-hypothetical conditional reinforcing the same regret.", example_gloss: null}
  ru.b1.unit47.lesson03.teach.nastya_question: {title: "Nastya asks what happened", gloss: "Nastya: Dima, you're all wet! What happened?", note: "Opens the regret dialogue."}
  ru.b1.unit47.lesson03.teach.dima_explain: {title: "Dima explains and regrets", gloss: "Dima: I didn't take an umbrella, and now I'm all wet. I should have taken an umbrella.", note: "States what happened, then expresses regret with надо было."}
  ru.b1.unit47.lesson03.teach.nastya_sympathize: {title: "Nastya sympathizes", gloss: "Nastya: Yes, it's a pity you didn't take an umbrella. If you had taken an umbrella, you wouldn't have gotten wet.", note: "Echoes the regret with жаль, что не and a past-hypothetical conditional."}

