    correct_option: "Признаю, что открыть свою школу рискованно."
    distractors: ["Я возражаю.", "Это не имеет значения.", "Я отказываюсь."]
    accepted_answers: [{value: "Признаю, что открыть свою школу рискованно.", status: correct}]
    feedback: "*Признаю, что* concedes the opposing point — it opens the argument by accepting that the risk is real."
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.exercise02.listen_ustupka:
    instruction: "Listen and select what you hear."
    correct_option: "I admit that opening my own school is risky."
    distractors: ["I admit that opening my own school is safe.", "I deny that opening my own school is risky.", "I admit that opening my own office is risky."]
    accepted_answers: [{value: "I admit that opening my own school is risky.", status: correct}]
    feedback: "Признаю, что открыть свою школу рискованно means I admit that opening my own school is risky."
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.exercise03.match_ustupka:
    instruction: "Match each concession element to its English meaning."
    accepted_answers:
      - value: {"Признаю, что": "I admit that", "открыть свою школу": "to open my own school", "рискованно": "risky", "Действительно": "indeed", "у этого решения есть минусы": "this decision has its drawbacks", "Это справедливое замечание": "that is a fair point"}
        status: correct
    feedback: "These phrases concede the opposing point as valid before the argument turns."
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.exercise04.order_ustupka:
