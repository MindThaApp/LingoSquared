review:
  status: "unreviewed"
  required_next_reviewer: "fresh_context_reviewer"
  notes: >-
    Overlay for ru's C1 unit04 on conceding and countering with subtlety.
    English-speaker interference risks: (1) the concession and counterargument
    connectors (*признаю, что*, *однако*, *тем не менее*, *в итоге*) are fixed
    discourse markers an English speaker will not build compositionally, so the
    production prompts name the exact marker for each move; (2) the model
    argument is deliberately gender-neutral (present-tense *признаю* and
    impersonal *нужно взвесить*, no gendered past tense of *я*), so a learner of
    either gender reproduces it verbatim; (3) the culminating speaking and
    writing exercises each require the WHOLE act, and their accepted answers are
    the exact taught model (with and without the final period). No
    sibling-direction file was consulted.

course:
  title: "Russian C1"
  description: "Advanced Russian argumentation: concede a valid point, qualify its scope, counter it, and weigh the competing considerations."

units:
  ru.c1.unit04.ustupka_i_kontrargument:
    title: "Concession and counterargument"
    description: "Argue with subtlety: genuinely concede an opposing point, narrow or rebut it, and weigh it against a competing consideration."

lessons:
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.priznayu_silnuyu_storonu:
    title: "Conceding the strong point"
  ru.c1.unit04.ustupka_i_kontrargument.lesson02.ogranichivayu_obyom:
    title: "Narrowing the scope"
  ru.c1.unit04.ustupka_i_kontrargument.lesson03.privozhu_kontrargument:
    title: "Presenting the counterargument"
  ru.c1.unit04.ustupka_i_kontrargument.lesson04.vzveshivayu_soobrazheniya:
    title: "Weighing the considerations"
  ru.c1.unit04.ustupka_i_kontrargument.lesson05.chitayu_vzveshennyj_argument:
    title: "Reading a balanced argument"
  ru.c1.unit04.ustupka_i_kontrargument.lesson06.polnyj_kontrargument:
    title: "The complete counterargument"

teaching:
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.teach.priznayu:
    title: "I admit that"
    gloss: "I admit that opening my own school is risky."
    note: "*Признаю, что* ('I admit that') concedes the other side's strongest valid point before arguing back. *Открыть свою школу* = 'to open my own school'; *рискованно* = 'risky'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.teach.deystvitelno:
    title: "indeed, there are drawbacks"
    gloss: "Indeed, this decision has its drawbacks."
    note: "*Действительно* ('indeed') strengthens a concession — it signals that the speaker genuinely accepts the point. *Минусы* = 'drawbacks'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.teach.spravedlivoe:
    title: "that is a fair point"
    gloss: "That is a fair point."
    note: "*Это справедливое замечание* ('that is a fair point') concedes a point as valid without yet agreeing to its conclusion."
  ru.c1.unit04.ustupka_i_kontrargument.lesson01.teach.modello_ustupka:
    title: "A concession"
    gloss: "I admit that opening my own school is risky. Indeed, this decision has its drawbacks. That is a fair point."
    note: "A concession accepts the opposing point as valid before qualifying or rebutting it."

  ru.c1.unit04.ustupka_i_kontrargument.lesson02.teach.odnako:
    title: "however, the risk is justified"
    gloss: "However, the risk is justified when there is a clear plan."
    note: "*Однако* ('however') introduces a qualification that narrows the conceded point. *Риск оправдан* = 'the risk is justified'; *чёткий план* = 'a clear plan'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson02.teach.kasaetsya_lish:
    title: "this concerns only one case"
    gloss: "This concerns only one case."
    note: "*Касается лишь* ('concerns only') limits the scope of a conceded point. *Лишь* narrows it further."
  ru.c1.unit04.ustupka_i_kontrargument.lesson02.teach.vmeste_s_tem:
    title: "at the same time"
    gloss: "At the same time, this does not cancel my arguments."
    note: "*Вместе с тем* ('at the same time') qualifies without rejecting — it adds a limit to a point the speaker has partly granted. *Доводы* = 'arguments'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson02.teach.modello_ogovorka:
    title: "A qualification"
    gloss: "However, the risk is justified when there is a clear plan. At the same time, this does not cancel my arguments."
    note: "A qualification narrows the scope of a conceded point rather than dismissing it."

  ru.c1.unit04.ustupka_i_kontrargument.lesson03.teach.tem_ne_menee:
    title: "nevertheless"
    gloss: "Nevertheless, staying in place is also risky."
    note: "*Тем не менее* ('nevertheless') pivots from concession to counterargument. *Оставаться на месте* = 'to stay in place'; *тоже* = 'also'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson03.teach.nesmotrya:
    title: "despite this"
    gloss: "Despite this, the decision still stands."
    note: "*Несмотря на это* ('despite this') concedes a point and immediately moves past it. *Остаётся в силе* = 'still stands'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson03.teach.s_drugoj_storony:
    title: "on the other hand"
    gloss: "On the other hand, freedom matters more."
    note: "*С другой стороны* ('on the other hand') introduces the competing consideration. *Важнее* = 'matters more'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson03.teach.modello_kontrargument:
    title: "A counterargument"
    gloss: "Nevertheless, staying in place is also risky. On the other hand, freedom matters more."
    note: "A counterargument concedes a point, then presents a proportionate competing consideration."

  ru.c1.unit04.ustupka_i_kontrargument.lesson04.teach.s_odnoj_storony:
    title: "on the one hand"
    gloss: "On the one hand, stability matters."
    note: "*С одной стороны* ('on the one hand') opens the weighing of competing considerations. *Стабильность* = 'stability'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson04.teach.perieveshivaet:
    title: "freedom outweighs stability"
    gloss: "Freedom outweighs stability."
    note: "*Перевешивает* ('outweighs') states which consideration wins after weighing. *Свобода* = 'freedom'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson04.teach.vzvesit:
    title: "weigh the pros and cons"
    gloss: "One must weigh all the pros and cons."
    note: "*Взвесить все за и против* ('to weigh all the pros and cons') is the act of comparing competing considerations."
  ru.c1.unit04.ustupka_i_kontrargument.lesson04.teach.v_itoge:
    title: "in the end"
    gloss: "In the end, if you weigh all the pros and cons, freedom outweighs stability."
    note: "*В итоге* ('in the end') introduces the conclusion of the weighing. *Если* = 'if'."
  ru.c1.unit04.ustupka_i_kontrargument.lesson04.teach.modello_vzveshivanie:
    title: "Weighing"
    gloss: "On the one hand, stability matters. Freedom outweighs stability. One must weigh all the pros and cons."
    note: "Weighing compares competing considerations and states which one wins."

  ru.c1.unit04.ustupka_i_kontrargument.lesson05.teach.modello_polnyj:
    title: "The full argument"
    gloss: "I admit that opening my own school is risky. However, the risk is justified when there is a clear plan. Nevertheless, staying in place is also risky. In the end, if you weigh all the pros and cons, freedom outweighs stability."
    note: "This is the complete argument: it concedes a point, qualifies it, counters, and weighs. Read it before the comprehension questions."
  ru.c1.unit04.ustupka_i_kontrargument.lesson05.teach.vzveshennyj_argument:
    title: "a balanced argument"
    gloss: "a balanced / weighed argument"
    note: "*Взвешенный аргумент* ('a balanced argument') weighs competing considerations rather than dismissing them."
    example_gloss: "This is a balanced argument, not emotion."

  ru.c1.unit04.ustupka_i_kontrargument.lesson06.teach.modello_polnyj2:
    title: "The model to reproduce"
    gloss: "I admit that opening my own school is risky. However, the risk is justified when there is a clear plan. Nevertheless, staying in place is also risky. In the end, if you weigh all the pros and cons, freedom outweighs stability."
    note: "This is the exact model for the final speaking and writing tasks: concede, qualify, counter, and weigh — in that order."
  ru.c1.unit04.ustupka_i_kontrargument.lesson06.teach.kontrargument:
    title: "the counterargument"
    gloss: "counterargument"
    note: "*Контраргумент* ('counterargument') is the opposing point you present after conceding the other side's valid point."
    example_gloss: "This is not an objection but a counterargument."

exercises:
