course:
  title: Russian A1
  description: 'Beginner Russian for describing a person''s basic physical appearance: height and age impressions, hair and eye color, the core question Hoe ziet ... eruit?, and comparing two people''s appearance.'
units:
  ru.a1.unit26.appearance:
    title: Describing appearance
lessons:
  ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i:
    title: Tall, short, old, and young
  ru.a1.unit26.lesson02.opisyvaem_volosy:
    title: Describing hair
  ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit:
    title: Eyes and what does someone look like?
  ru.a1.unit26.lesson04.nastya_opisyvaet_ninu:
    title: Nastya describes Nina
  ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu:
    title: Comparing Igor and Lena
  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima recognizes Nina
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Tall and short
    gloss: tall / short
    note: '*Высокий* describes a tall person and *невысокий* a short one (literally ''not tall''). The ending changes with gender: *высокая*, *невысокая*.'
    example_gloss:
    - Lena is tall.
    - Igor is short.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Old and young
    gloss: old / young
    note: '*Старый* and *молодой* here describe a general impression of age, not an exact number of years.'
    example_gloss:
    - Grandpa is old.
    - Dima is young.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Adjectives change with gender
    gloss: 'An adjective agrees with the person: *он высокий, она высокая*; *он старый, она старая*.'
    note: Masculine adjectives end in *-ый*, *-ий* or *-ой* (*высокий*, *молодой*); feminine ones end in *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena is tall and Igor is short
    gloss: Lena is tall and Igor is short.
    note: 'Two statements are set side by side with *а* (while, and): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: Hair
    gloss: the hair
    note: '*Волосы* (hair) is plural in Russian: *У Насти светлые волосы*, never a singular noun.'
    example_gloss: Dima has short black hair.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: 'Three hair colours in the plural to agree with *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastya has blond hair.
    - Igor has brown hair.
    - Grandpa has grey hair.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Длинные* (long) and *короткие* (short) also agree with the plural *волосы*.'
    example_gloss:
    - Lena has long hair.
    - Igor has short hair.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Adjectives agree with волосы
    gloss: '*Волосы* is plural, so the adjective is plural too: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Plural adjectives end in *-ые* or *-ие*. You will see the same ending with *глаза* in the next lesson.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У plus genitive
    gloss: 'After *у* the owner is in the genitive: *у Насти* (Nastya has), *у Димы* (Dima has), *у неё* (she has).'
    note: 'This is how Russian says ''has'': *у* + genitive + the thing owned. There is no verb ''to have''.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima has short black hair
    gloss: Dima has short black hair.
    note: '*Чёрные* (black) agrees with the plural *волосы*. The letter *ё* is always written in this course.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastya has long blond hair
    gloss: Nastya has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Eyes
    gloss: the eyes
    note: '*Глаза* (eyes) is the plural of *глаз*; the plural ending is *-а*.'
    example_gloss: Dima has brown eyes.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: '*Голубые* is light blue, *карие* is brown for eyes only, and *зелёные* is green. All three are plural.'
    example_gloss:
    - Nastya has blue eyes.
    - Igor has brown eyes.
    - Lena has green eyes.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Adjectives agree with глаза
    gloss: '*Глаза* is plural, so the adjective is plural too: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Brown eyes are *карие*, not *коричневые*, and brown hair is *каштановые*: Russian uses different words for eyes and hair.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: What does Nastya look like?
    gloss: What does Nastya look like?
    note: '*Как выглядит ...?* is this unit''s core question. The verb *выглядит* agrees with a singular subject.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastya has long blond hair and blue eyes
    gloss: Nastya has long blond hair and blue eyes.
    note: 'A model answer joins hair and eyes with *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastya introduces Nina
    gloss: 'Nastya: A new girl is coming to the taalcafé. Her name is Nina.'
    note: '*Придёт* (will come) is the perfective future. *Её зовут Нина* literally means ''they call her Nina''.'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima asks what she looks like
    gloss: 'Dima: Okay! What does she look like?'
    note: The core question again, now with *она* (she) instead of a name.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastya describes Nina's height and hair
    gloss: 'Nastya: She is short and she has short blond hair.'
    note: Combines *невысокая* from lesson 1 with the hair words from lesson 2. *И у неё* adds the second fact.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima asks about her eyes
    gloss: 'Dima: And her eyes?'
    note: '*Какие у неё глаза?* uses *у неё* (''she has''). *Неё* is the form of *она* after the preposition *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastya describes Nina's eyes
    gloss: 'Nastya: She has green eyes.'
    note: Reuses *зелёные глаза* from lesson 3, with *у неё* for 'she has'.
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima will recognize her
    gloss: 'Dima: Thanks! Then I''ll recognize her.'
    note: '*Я её узнаю* (I will recognise her): *её* is the accusative of *она*, because Nina is the object.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Comparing Igor and Lena
    gloss: Igor and Lena are brother and sister, but they look different. Igor is short and has short brown hair and brown eyes. Lena is taller than Igor and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      брат: brother
      сестра: sister
      выглядят: look
      по-разному: different
      невысокий: short
      короткие: short
      каштановые: brown
      волосы: hair
      карие: brown
      глаза: eyes
      выше: taller
      длинные: long
      зелёные: green
      выглядишь: (part of 'eruit zien' = to look/appear)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Comparing with выше
    gloss: 'After *выше* (taller) the person you compare with is in the genitive: *Лена выше Игоря*.'
    note: The comparative *выше* does not change for gender. The person compared with is in the genitive, or comes after *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena has longer hair than Igor
    gloss: Lena has longer hair than Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* never changes, and *чем* (than) starts the second part.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: 'A model sentence for your own appearance: *У меня* (''I have'') + adjective + noun.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima spots Nina
    gloss: 'Dima: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Смотри* (look) is the informal command, used the same way in earlier dialogues.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastya confirms
    gloss: 'Nastya: Yes, that''s Nina!'
    note: A short, natural confirmation.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina greets Dima
    gloss: 'Nina: Hi, are you Dima?'
    note: 'A simple informal question: Russian needs no verb ''to be'', just *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima greets Nina back
    gloss: 'Dima: Yes! Nice to meet you, Nina.'
    note: '*Приятно познакомиться* is the standard phrase for meeting someone for the first time. *Познакомиться* means to get to know a new person.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Dima successfully recognized Nina from Nastya's earlier description.
