schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.b1.unit50"
source_language: "en"
target_language: "ru"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Claude-authored B1 draft. Needs fresh-context review."}

course:
  title: "Russian B1"
  description: "Learn B1-level Russian for communicating professionally in meetings -- a formal-register softened suggestion with Я бы предложил, a formal-register softened request with Не могли бы вы, and a short work-meeting exchange."

units:
  ru.b1.unit50.soveshchanija: {title: "Meetings"}

lessons:
  ru.b1.unit50.lesson01.ja_by_predlozhil: {title: "I would suggest..."}
  ru.b1.unit50.lesson02.ne_mogli_by_vy: {title: "Could you..."}
  ru.b1.unit50.lesson03.soveshchanie_perenos: {title: "Meeting and rescheduling"}

teaching:
  ru.b1.unit50.lesson01.teach.ja_by_predlozhil_perenesti: {title: "Я бы предложил перенести встречу на пятницу.", gloss: "I would suggest moving the meeting to Friday.", note: "Я бы предложил is a formal-register softened suggestion, appropriate with colleagues or a manager.", example_gloss: null}
  ru.b1.unit50.lesson01.teach.formal_suggestion_grammar: {title: "Я бы предложил / Я бы порекомендовал = формальное смягчённое предложение", gloss: "I would suggest / I would recommend = a formal softened suggestion", note: "Use Я бы предложил or Я бы порекомендовал plus an infinitive to make a formal-register suggestion.", example_gloss: "I would suggest moving the meeting to Friday -- a formal softened suggestion."}
  ru.b1.unit50.lesson01.teach.u_menja_esche_net_dannyh: {title: "У меня ещё нет всех данных для отчёта.", gloss: "I don't have all the data for the report yet.", note: "Gives the reason for the suggested reschedule.", example_gloss: null}
  ru.b1.unit50.lesson02.teach.ne_mogli_by_vy_otchyot: {title: "Не могли бы вы отправить отчёт до пятницы?", gloss: "Could you please send the report by Friday?", note: "Не могли бы вы + infinitive is a formal-register softened request, addressed with вы.", example_gloss: null}
  ru.b1.unit50.lesson02.teach.formal_request_grammar: {title: "Не могли бы вы + инфинитив = формальная смягчённая просьба", gloss: "Could you (not) + infinitive = a formal softened request", note: "Не могли бы вы plus an infinitive politely requests something in formal register.", example_gloss: "Could you please send the report by Friday? -- a formal softened request."}
  ru.b1.unit50.lesson02.teach.otpravlju_tablitsu: {title: "Конечно, отправлю таблицу сегодня.", gloss: "Colleague: Of course, I'll send the table today.", note: "A colleague's response agreeing to the request.", example_gloss: null}
  ru.b1.unit50.lesson03.teach.dima_suggest: {title: "Dima makes a formal suggestion", gloss: "Dima: I would suggest moving the meeting to Friday.", note: "Opens the meeting exchange with a formal softened suggestion."}
  ru.b1.unit50.lesson03.teach.kollega_ask_why: {title: "The colleague asks why", gloss: "Colleague: Okay, and why?", note: "A short, natural follow-up in a meeting."}
  ru.b1.unit50.lesson03.teach.dima_explain_request: {title: "Dima explains and requests", gloss: "Dima: I don't have all the data for the report yet. Could you please send me the table by Wednesday?", note: "Gives the reason, then adds a formal softened request."}
  ru.b1.unit50.lesson03.teach.kollega_agree: {title: "The colleague agrees", gloss: "Colleague: Of course, I'll send it today.", note: "Closes the exchange with agreement."}

exercises:
  ru.b1.unit50.lesson01.exercise01.recognize_ja_by_predlozhil: {instruction: "Which Russian sentence means \"I would suggest moving the meeting to Friday\"?", correct_option: "я бы предложил перенести встречу на пятницу", distractors: ["не могли бы вы отправить отчёт до пятницы", "у меня ещё нет всех данных для отчёта", "конечно отправлю таблицу сегодня"], accepted_answers: [{value: "я бы предложил перенести встречу на пятницу", status: "correct"}], feedback: "Я бы предложил is a formal-register softened suggestion."}
  ru.b1.unit50.lesson01.exercise02.recognize_net_dannyh: {instruction: "Which Russian sentence means \"I don't have all the data for the report yet\"?", correct_option: "у меня ещё нет всех данных для отчёта", distractors: ["я бы предложил перенести встречу на пятницу", "не могли бы вы отправить отчёт до пятницы", "конечно отправлю таблицу сегодня"], accepted_answers: [{value: "у меня ещё нет всех данных для отчёта", status: "correct"}], feedback: "*У меня ещё нет* means \"I don't have yet.\""}
  ru.b1.unit50.lesson01.exercise03.listen_select_ja_by_predlozhil: {instruction: "Listen. What formal-register suggestion is made?", correct_option: "Moving the meeting to Friday.", distractors: ["Sending the report by Friday.", "Cancelling the meeting entirely.", "Moving the meeting to Wednesday."], accepted_answers: [{value: "Moving the meeting to Friday.", status: "correct"}], feedback: "The recording says *Я бы предложил перенести встречу на пятницу*."}
  ru.b1.unit50.lesson01.exercise04.match_formal_suggestion_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я бы предложил", right: "I would suggest"}
          - {left: "перенести встречу", right: "moving the meeting"}
          - {left: "на пятницу", right: "to Friday"}
          - {left: "У меня ещё нет", right: "I don't yet have"}
          - {left: "всех данных", right: "all the data"}
          - {left: "для отчёта", right: "for the report"}
        status: "correct"
    feedback: "These build the formal suggestion and its reason."
  ru.b1.unit50.lesson01.exercise05.order_ja_by_predlozhil: {instruction: "Put the words in order to say \"I would suggest moving the meeting to Friday.\"", accepted_answers: [{value: ["Я", "бы", "предложил", "перенести", "встречу", "на", "пятницу"], status: "correct"}], feedback: "The correct order is *Я бы предложил перенести встречу на пятницу*."}
  ru.b1.unit50.lesson01.exercise06.write_ja_by_predlozhil:
    instruction: "Write exactly this formal-register softened suggestion using Я бы предложил: I would suggest moving the meeting to Friday."
    accepted_answers:
      - {value: "Я бы предложил перенести встречу на пятницу.", status: "correct"}
      - {value: "Я бы предложила перенести встречу на пятницу.", status: "correct"}
      - {value: "Я бы предложил перенести встречу на пятницу", status: "correct"}
      - {value: "Я бы предложила перенести встречу на пятницу", status: "correct"}
    feedback: "The model answer is *Я бы предложил перенести встречу на пятницу*."
  ru.b1.unit50.lesson02.exercise01.recognize_ne_mogli_by_vy: {instruction: "Which Russian sentence means \"could you please send the report by Friday?\" (a formal softened request)?", correct_option: "не могли бы вы отправить отчёт до пятницы", distractors: ["я бы предложил перенести встречу на пятницу", "конечно отправлю таблицу сегодня", "у меня ещё нет всех данных для отчёта"], accepted_answers: [{value: "не могли бы вы отправить отчёт до пятницы", status: "correct"}], feedback: "Не могли бы вы + infinitive is a formal softened request."}
  ru.b1.unit50.lesson02.exercise02.recognize_otpravlju_tablitsu: {instruction: "Which Russian sentence means \"of course, I'll send the table today\"?", correct_option: "конечно отправлю таблицу сегодня", distractors: ["не могли бы вы отправить отчёт до пятницы", "я бы предложил перенести встречу на пятницу", "у меня ещё нет всех данных для отчёта"], accepted_answers: [{value: "конечно отправлю таблицу сегодня", status: "correct"}], feedback: "A colleague's agreeing reply."}
  ru.b1.unit50.lesson02.exercise03.listen_select_ne_mogli_by_vy: {instruction: "Listen. What formal request is made, and by when?", correct_option: "Send the report by Friday.", distractors: ["Send the table by Wednesday.", "Move the meeting to Friday.", "Send the report today."], accepted_answers: [{value: "Send the report by Friday.", status: "correct"}], feedback: "The recording says *Не могли бы вы отправить отчёт до пятницы?*"}
  ru.b1.unit50.lesson02.exercise04.match_formal_request_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Не могли бы вы", right: "Could you (please)"}
          - {left: "отправить отчёт", right: "send the report"}
          - {left: "до пятницы", right: "by Friday"}
          - {left: "Конечно", right: "Of course"}
          - {left: "отправлю таблицу", right: "I'll send the table"}
          - {left: "формальная смягчённая просьба", right: "a formal softened request"}
        status: "correct"
    feedback: "These build the formal request and its reply."
  ru.b1.unit50.lesson02.exercise05.order_ne_mogli_by_vy: {instruction: "Put the words in order to say \"Could you please send the report by Friday?\"", accepted_answers: [{value: ["Не", "могли", "бы", "вы", "отправить", "отчёт", "до", "пятницы"], status: "correct"}], feedback: "The correct order is *Не могли бы вы отправить отчёт до пятницы?*"}
  ru.b1.unit50.lesson02.exercise06.write_ne_mogli_by_vy:
    instruction: "Write exactly this formal-register softened request using Не могли бы вы + infinitive: Could you please send the report by Friday?"
    accepted_answers:
      - {value: "Не могли бы вы отправить отчёт до пятницы?", status: "correct"}
      - {value: "Не могли бы вы отправить отчёт до пятницы", status: "correct"}
    feedback: "The model answer is *Не могли бы вы отправить отчёт до пятницы?*"
  ru.b1.unit50.lesson03.exercise01.choose_full_meeting: {instruction: "Which answer makes a formal-register softened suggestion AND a formal-register softened request, both directed at a colleague?", correct_option: "Я бы предложил перенести встречу на пятницу. Не могли бы вы отправить мне таблицу до среды?", distractors: ["У меня ещё нет всех данных для отчёта.", "Ты бы мог помочь мне с этим?", "Если бы у меня было больше времени, я бы путешествовал больше."], accepted_answers: [{value: "Я бы предложил перенести встречу на пятницу. Не могли бы вы отправить мне таблицу до среды?", status: "correct"}], feedback: "The correct answer combines a formal suggestion with a formal request, both in вы register."}
  ru.b1.unit50.lesson03.exercise02.dialogue_comprehension_meeting:
    instruction: "Listen to the dialogue. What does Dima suggest, why, and what does he request?"
    correct_option: "Dima suggests moving the meeting to Friday because he doesn't have all the data yet, and asks the colleague to send him the table by Wednesday"
    distractors: ["Dima suggests cancelling the meeting because he is sick, and asks the colleague to send him the report today", "The colleague suggests moving the meeting because Dima is missing data, and Dima agrees to send the table", "Dima suggests moving the meeting to Wednesday because the report is finished, and asks for nothing further"]
    accepted_answers: [{value: "Dima suggests moving the meeting to Friday because he doesn't have all the data yet, and asks the colleague to send him the table by Wednesday", status: "correct"}]
    feedback: "The dialogue combines a formal suggestion, its reason, and a formal request."
  ru.b1.unit50.lesson03.exercise03.match_dialogue_meeting:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я бы предложил перенести встречу на пятницу.", right: "I would suggest moving the meeting to Friday."}
          - {left: "Хорошо, а почему?", right: "Okay, and why?"}
          - {left: "У меня ещё нет всех данных для отчёта.", right: "I don't have all the data for the report yet."}
          - {left: "Не могли бы вы отправить мне таблицу до среды?", right: "Could you please send me the table by Wednesday?"}
          - {left: "Конечно, отправлю сегодня.", right: "Of course, I'll send it today."}
          - {left: "среды", right: "Wednesday"}
        status: "correct"
    feedback: "These phrases build the full meeting exchange."
  ru.b1.unit50.lesson03.exercise04.order_dima_explain_request: {instruction: "Put the words in order to say \"Could you please send me the table by Wednesday?\"", accepted_answers: [{value: ["Не", "могли", "бы", "вы", "отправить", "мне", "таблицу", "до", "среды"], status: "correct"}], feedback: "The correct order is *Не могли бы вы отправить мне таблицу до среды?*"}
  ru.b1.unit50.lesson03.exercise05.reply_ask_why:
    instruction: "The colleague says \"Хорошо, а почему?\" Reply with exactly this reason: \"У меня ещё нет всех данных для отчёта.\""
    accepted_answers:
      - {value: "У меня ещё нет всех данных для отчёта.", status: "correct"}
      - {value: "У меня ещё нет всех данных для отчёта", status: "correct"}
    feedback: "The model answer states the reason for the suggested reschedule."
  ru.b1.unit50.lesson03.exercise06.write_professional_message:
    instruction: "Write a brief professional message to a colleague, in formal вы register: (1) suggest moving the meeting to Friday, using Я бы предложил; (2) ask, using Не могли бы вы, whether they could send you the table by Wednesday."
    accepted_answers:
      - {value: "Я бы предложил перенести встречу на пятницу. Не могли бы вы отправить мне таблицу до среды?", status: "correct"}
      - {value: "Я бы предложила перенести встречу на пятницу. Не могли бы вы отправить мне таблицу до среды?", status: "correct"}
      - {value: "Я бы предложил перенести встречу на пятницу. Не могли бы вы отправить мне таблицу до среды", status: "correct"}
      - {value: "Я бы предложила перенести встречу на пятницу. Не могли бы вы отправить мне таблицу до среды", status: "correct"}
    feedback: "A complete message combines the formal suggestion with the formal request."
  ru.b1.unit50.lesson01.ja_by_predlozhil.exercise07.dictation:
    instruction: "Type what you hear."
    correct_response: "Я бы предложил перенести встречу на пятницу."
    orthography_strict: true
    feedback: "Check every word and punctuation mark."
