    the realization provenance note). English speakers' real interference
    risks for this outcome: (1) "во-первых" (firstly) vs "кроме того" (in
    addition) both signpost added reasons but are not interchangeable
    order words -- kept distinct in lesson02; (2) "но" / "однако" / "тем
    не менее" all cover English "but/however/nevertheless" but differ in
    register and force -- kept distinct in lesson04's glosses; (3) English
    lets you run an argument together, whereas the taught signposts
    (во-первых, конечно, тем не менее) must actually appear -- the
    culminating lesson06 prompts name the required signposts so a correct
    answer is well-determined. No sibling-direction file (ru-en b2) was
    consulted.

course:
  title: Russian B2
  description: >-
    Upper-intermediate Russian: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (во-первых, например,
    исследования показывают, что), acknowledge the strongest opposing
    point (с одной стороны ... с другой стороны, хотя, конечно), and
    rebut it without conceding (но, однако, тем не менее, это не меняет
    того, что, короче говоря), around the everyday debate of working from
    home.

units:
  ru.b2.unit01.argumentacija:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  ru.b2.unit01.lesson01.tochka_zreniya:
    title: "Taking a position"
  ru.b2.unit01.lesson02.dovody_i_fakty:
    title: "Giving reasons and evidence"
  ru.b2.unit01.lesson03.drugaya_storona:
    title: "Acknowledging the other side"
  ru.b2.unit01.lesson04.vozrazhenie:
    title: "Rebutting"
  ru.b2.unit01.lesson05.chtenie_argumenta:
    title: "Reading an argument"
  ru.b2.unit01.lesson06.zashchita_pozitsii:
    title: "Defending a position"

teaching:
  ru.b2.unit01.lesson01.teach.rabota_iz_doma:
    title: "working from home"
    gloss: "working from home"
    note: "*Работа из дома* is the everyday phrase for working from home. It is the topic this whole unit argues about."
    example_gloss: "Working from home saves time."
  ru.b2.unit01.lesson01.teach.rabota_v_ofise:
    title: "working at the office"
    gloss: "working at the office"
    note: "The opposite pole of the debate. *В офисе* means 'at the office' (prepositional case after *в*)."
  ru.b2.unit01.lesson01.teach.tochka_zreniya:
    title: "a point of view / position"
    gloss: "a point of view / a position"
    note: "*Точка зрения* -- literally 'a point of view' -- is the claim you are going to defend. This is the thing an argument is built around."
    example_gloss: "I have a clear point of view."
  ru.b2.unit01.lesson01.teach.ya_schitayu_chto:
    title: "I think that..."
    gloss: "I think that... / I believe that..."
    note: "*Я считаю, что...* introduces your own opinion. The comma before *что* is required in written Russian."
  ru.b2.unit01.lesson01.teach.po_moemu:
    title: "in my opinion..."
    gloss: "in my opinion... / to my mind..."
    note: "*По-моему* is a softer, very common way to open an opinion. It is set off by a comma when it opens a sentence: *По-моему, работа из дома лучше*."
  ru.b2.unit01.lesson01.teach.luchshe:
    title: better
    gloss: better
    example_gloss: "This approach is better."
  ru.b2.unit01.lesson01.teach.chem:
    title: than
    gloss: than
    note: "*Чем* is 'than' in a comparison: *лучше, чем* = 'better than'. It is usually set off by a comma."
    example_gloss: "Working from home is better than working at the office."
  ru.b2.unit01.lesson01.teach.claim_model:
    title: "I think that working from home is better than working at the office."
    gloss: "I think that working from home is better than working at the office."
    note: "The model claim for this unit."
  ru.b2.unit01.lesson01.teach.eto_moya_tochka_zreniya:
    title: "This is my point of view."
    gloss: "This is my point of view."
    note: "*Это моя точка зрения* -- *моя* agrees with the feminine noun *точка*, not with the speaker, so this sentence is the same regardless of who says it."
  ru.b2.unit01.lesson01.teach.grammar_tochka_zreniya:
    title: "I think that working from home is better than working at the office. In my opinion, this is my point of view."
    gloss: "I think that working from home is better than working at the office. In my opinion, this is my point of view."
    note: "A claim is the position you will defend. Both *я считаю, что...* and *по-моему...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  ru.b2.unit01.lesson02.teach.vo_pervyh_vtorykh:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*Во-первых... во-вторых...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  ru.b2.unit01.lesson02.teach.ekonomit_vremya:
    title: "to save time"
    gloss: "to save time"
    note: "*Экономить* = to save (time, money). Everyday informal forms: *ты экономишь* (you save), *времени* is the genitive form used after *много*."
    example_gloss: "Working from home helps you save time."
  ru.b2.unit01.lesson02.teach.ty:
    title: "you (informal / generic)"
    gloss: "you (informal / generic)"
    note: "*Ты* here is the generic, informal 'you' addressed to a friend -- the natural way this unit's speakers state a general point in an argument."
    example_gloss: "You save a lot of time."
  ru.b2.unit01.lesson02.teach.mnogo:
    title: "a lot / much"
    gloss: "a lot / much"
    note: "*Много* takes the genitive case: *много времени* = 'a lot of time'."
    example_gloss: "You save a lot of time."
  ru.b2.unit01.lesson02.teach.naprimer:
    title: "for example"
    gloss: "for example"
    note: "*Например* introduces a concrete example that backs up a reason."
    example_gloss: "You save time, for example commute time."
  ru.b2.unit01.lesson02.teach.vremya_na_dorogu:
    title: "commute time"
    gloss: "commute time / time on the road"
    example_gloss: "Firstly, you save commute time."
  ru.b2.unit01.lesson02.teach.issledovaniya_pokazyvayut:
    title: "research shows that..."
    gloss: "research shows that..."
    note: "*Исследования показывают, что...* is how you cite evidence in an argument."
  ru.b2.unit01.lesson02.teach.produktivnee:
    title: "more productive"
    gloss: "more productive"
    example_gloss: "At home you are more productive."
  ru.b2.unit01.lesson02.teach.doma:
    title: "at home"
    gloss: "at home"
    note: "*Дома* is the adverb 'at home' -- the same written form as the genitive of *дом* used inside *работа из дома*, but here it stands alone."
    example_gloss: "I work at home on Fridays."
  ru.b2.unit01.lesson02.teach.grammar_dovody:
    title: "Firstly, you save commute time. In addition, you are more productive."
    gloss: "Firstly, you save commute time. In addition, you are more productive."
    note: "Support = the reasons and evidence behind your claim. Number them (*во-первых*), and cite evidence (*исследования показывают, что*) so the argument is easy to follow. *Кроме того* ('in addition') adds a further reason."

  ru.b2.unit01.lesson03.teach.s_odnoy_storony:
    title: "on the one hand... on the other hand..."
    gloss: "on the one hand... on the other hand..."
    note: "*С одной стороны...* opens a balanced view; it is almost always paired with *с другой стороны...* to introduce the opposing point you are about to acknowledge."
  ru.b2.unit01.lesson03.teach.hotya:
    title: although
    gloss: although
    note: "*Хотя* concedes a point at the start of a clause: *Хотя это удобно,...*. It sets up a contrast the main clause will answer."
    example_gloss: "Although it is convenient, I remain flexible."
  ru.b2.unit01.lesson03.teach.konechno:
    title: "of course"
    gloss: "of course / naturally"
    note: "*Конечно* concedes that the opposing point is fair -- a polite way to acknowledge before you push back."
    example_gloss: "Of course, that's true."
  ru.b2.unit01.lesson03.teach.eto_pravda:
    title: "That's true."
    gloss: "That's true. / That's correct."
    note: "*Это правда* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  ru.b2.unit01.lesson03.teach.nekotorye_schitayut:
    title: "some people think that..."
    gloss: "some people think that..."
    note: "*Некоторые считают, что...* introduces a common objection without owning it yourself -- 'some people think that...' -- so you can then answer it."
  ru.b2.unit01.lesson03.teach.kollegi:
    title: colleagues
    gloss: colleagues
    example_gloss: "My colleagues are friendly."
  ru.b2.unit01.lesson03.teach.mne_ne_hvataet:
    title: "I miss... / I lack..."
    gloss: "I miss... / I lack..."
    note: "*Мне не хватает...* (literally 'to me is lacking...') takes the genitive case for what's missing: *мне не хватает общения* = 'I miss socializing'."
  ru.b2.unit01.lesson03.teach.obshcheniya_s_kollegami:
    title: "contact with colleagues"
    gloss: "contact / socializing with colleagues"
    note: "*Общения с коллегами* -- the social contact with colleagues is the classic point people raise against working from home."
  ru.b2.unit01.lesson03.teach.inogda:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I miss socializing."
  ru.b2.unit01.lesson03.teach.grammar_priznanie:
    title: "On the one hand working from home is convenient, on the other hand sometimes you miss the contact with colleagues."
    gloss: "On the one hand working from home is convenient, on the other hand sometimes you miss the contact with colleagues."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *С одной стороны... с другой стороны...*, *хотя*, *конечно*, and *это правда* all do this without giving up your own position. *Удобна* ('convenient') agrees with the feminine noun *работа*."

  ru.b2.unit01.lesson04.teach.no:
    title: but
    gloss: but
    note: "*Но* is the everyday contrast word. It pivots from the acknowledged point back to your claim."
    example_gloss: "It is convenient, but not perfect."
  ru.b2.unit01.lesson04.teach.odnako:
    title: however
    gloss: however
    note: "*Однако* is a more formal 'however' than *но*, often set off by a comma."
    example_gloss: "Working from home is convenient. However, sometimes it can be lonely."
  ru.b2.unit01.lesson04.teach.tem_ne_menee:
    title: nevertheless
    gloss: "nevertheless / all the same"
    note: "*Тем не менее* answers a concession: you grant the objection, then *тем не менее...* ('nevertheless, ...') reasserts your claim. It is the core rebuttal phrase of this unit."
    example_gloss: "At the office it is noisy; at home, nevertheless, it is quieter."
  ru.b2.unit01.lesson04.teach.eto_ne_menyaet:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*Это не меняет того, что...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim."
  ru.b2.unit01.lesson04.teach.koroche_govorya:
    title: "in short"
    gloss: "in short / to sum up"
    note: "*Короче говоря* signposts your conclusion -- it wraps the argument up."
    example_gloss: "In short, working from home is better."
  ru.b2.unit01.lesson04.teach.plyusy:
    title: advantages
    gloss: "advantages / pros"
    example_gloss: "This solution has clear advantages."
  ru.b2.unit01.lesson04.teach.minusy:
    title: disadvantages
    gloss: "disadvantages / cons"
    example_gloss: "This idea also has disadvantages."
  ru.b2.unit01.lesson04.teach.perevesh_ivayut:
    title: outweigh
    gloss: "outweigh / tip the balance"
    note: "*Перевешивают* (they outweigh) and *перевешивает* (it outweighs) -- Russian *перевешивать* here means 'to carry more weight' in an argument."
    example_gloss: "The advantages outweigh the disadvantages."
  ru.b2.unit01.lesson04.teach.svoboda:
    title: freedom
    gloss: freedom
    example_gloss: "Freedom is the main advantage of this job."
  ru.b2.unit01.lesson04.teach.imeet_plyusy:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Работа в офисе имеет плюсы* concedes the other side has advantages -- before you rebut."
  ru.b2.unit01.lesson04.teach.grammar_vozrazhenie:
    title: "That's true, but that does not change the fact that the advantages outweigh. In short, working from home is better."
    gloss: "That's true, but that does not change the fact that the advantages outweigh. In short, working from home is better."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Тем не менее*, *но*, *однако*, and *это не меняет того, что...* all pivot back to your position; *короче говоря* signposts the conclusion."

  ru.b2.unit01.lesson05.teach.tekst:
    title: "Reading: working from home is a good phenomenon"
    gloss: "More and more people work from home. I think that this is a good phenomenon. Firstly, you save a lot of commute time, and research shows that people who work from home are often more productive. Of course, some say that at home you miss the contact with colleagues. That's true, but that does not change the fact that you can video-call. In short, the advantages outweigh the disadvantages."
    glosses:
      Всё: "all (всё больше = more and more)"
      больше: "more"
      людей: "people (genitive plural)"
      работают: "work (they work, from работать)"
      хорошее: "good (agreeing with явление)"
      явление: "phenomenon"
      а: "and / whereas (a mild contrast connector)"
      которые: "who / which"
      часто: often
      более: "more (более продуктивны = more productive)"
      продуктивны: "productive (plural predicate form)"
      говорят: "say (they say, from говорить)"
      можно: "one can / it is possible"
      созваниваться: "to video-call / call each other"
      по: "via / by (по видеосвязи = via video call)"
      видеосвязи: "video call / video link"

  ru.b2.unit01.lesson06.teach.pochemu_ty_tak_dumaesh:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*Почему ты так думаешь?* asks a debating partner to support their claim -- the cue to give your reasons and evidence."
  ru.b2.unit01.lesson06.teach.v_etom_chto_to_est:
    title: "There's something to that."
    gloss: "There's something to that. / You have a point."
    note: "*В этом что-то есть* concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion."
  ru.b2.unit01.lesson06.teach.dialogue_nastya_claim:
    title: "Nastya: I think working from home is better than working at the office."
    gloss: "Nastya: I think working from home is better than working at the office."
  ru.b2.unit01.lesson06.teach.dialogue_dima_why:
    title: "Dima: Why do you think that?"
    gloss: "Dima: Why do you think that?"
  ru.b2.unit01.lesson06.teach.dialogue_nastya_support:
    title: "Nastya: Firstly, you save commute time. In addition, you are more productive."
    gloss: "Nastya: Firstly, you save commute time. In addition, you are more productive."
  ru.b2.unit01.lesson06.teach.dialogue_dima_objection:
    title: "Dima: On the other hand, I miss the contact with colleagues."
    gloss: "Dima: On the other hand, I miss the contact with colleagues."
  ru.b2.unit01.lesson06.teach.dialogue_nastya_rebuttal:
    title: "Nastya: That's true, but that does not change the fact that you can video-call. In short, the advantages outweigh."
    gloss: "Nastya: That's true, but that does not change the fact that you can video-call. In short, the advantages outweigh."
  ru.b2.unit01.lesson06.teach.dialogue_dima_concede:
    title: "Dima: There's something to that."
    gloss: "Dima: There's something to that."
  ru.b2.unit01.lesson06.teach.grammar_polnyj_argument:
    title: "I think working from home is better than working at the office. Firstly, you save commute time. Of course, sometimes I miss my colleagues. Nevertheless, the advantages outweigh the disadvantages."
    gloss: "I think working from home is better than working at the office. Firstly, you save commute time. Of course, sometimes I miss my colleagues. Nevertheless, the advantages outweigh the disadvantages."
    note: "A complete argument has four moves: claim (*я считаю, что...*), support (*во-первых...*), acknowledged objection (*конечно...*), and rebuttal (*тем не менее...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  ru.b2.unit01.lesson01.exercise01.recognize_tochka_zreniya:
    instruction: "What does this phrase mean?"
    correct_option: "a point of view / position"
    distractors: ["a question", "an answer", "an agreement"]
    accepted_answers: [{value: "a point of view / position", status: "correct"}]
    feedback: "Точка зрения is a point of view or position -- the claim you defend."
  ru.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that working from home is better than working at the office."
    distractors: ["I think that working at the office is better than working from home.", "I think that working from home is nicer than commuting.", "I know that working from home is better than working at the office."]
    accepted_answers: [{value: "I think that working from home is better than working at the office.", status: "correct"}]
    feedback: "Я считаю, что работа из дома лучше, чем работа в офисе means I think that working from home is better than working at the office."
  ru.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "работа из дома", right: "working from home"}
          - {left: "работа в офисе", right: "working at the office"}
          - {left: "точка зрения", right: "a point of view / position"}
          - {left: "я считаю, что...", right: "I think that..."}
          - {left: "по-моему...", right: "in my opinion..."}
          - {left: "лучше", right: "better"}
          - {left: "чем", right: "than"}
          - {left: "Это моя точка зрения.", right: "This is my point of view."}
        status: "correct"
    feedback: "These are this lesson's claim-stating words."
  ru.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order to say \"I think that working from home is better.\""
    accepted_answers:
      - {value: ["Я", "считаю", "что", "работа", "из", "дома", "лучше"], status: "correct"}
    feedback: "Я считаю, что работа из дома лучше means I think that working from home is better."
  ru.b2.unit01.lesson01.exercise05.translate_po_moemu:
    instruction: "Translate into Russian: In my opinion, working from home is better."
    accepted_answers:
      - {value: "По-моему, работа из дома лучше", status: "correct"}
      - {value: "По-моему, работа из дома лучше.", status: "correct"}
    feedback: "По-моему, работа из дома лучше means in my opinion, working from home is better."
  ru.b2.unit01.lesson01.exercise06.speak_eto_moya_tochka_zreniya:
    instruction: "Say aloud in Russian: This is my point of view."
    accepted_answers:
      - {value: "Это моя точка зрения", status: "correct"}
    feedback: "Это моя точка зрения means this is my point of view."
  ru.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in Russian: I think that working from home is better than working at the office."
    accepted_answers:
      - {value: "Я считаю, что работа из дома лучше, чем работа в офисе", status: "correct"}
      - {value: "Я считаю, что работа из дома лучше, чем работа в офисе.", status: "correct"}
    feedback: "Я считаю, что работа из дома лучше, чем работа в офисе means I think that working from home is better than working at the office."
  ru.b2.unit01.lesson01.exercise08.dictation_claim_rabota_doma:
    instruction: "Type what you hear."
    correct_response: "Я считаю, что работа из дома лучше, чем работа в офисе."
    orthography_strict: true
    feedback: "You heard Я считаю, что работа из дома лучше, чем работа в офисе — I think that working from home is better than working at the office."

  ru.b2.unit01.lesson02.exercise01.recognize_vo_pervyh:
    instruction: "What does this word mean?"
    correct_option: firstly
    distractors: ["secondly", "for example", "in addition"]
    accepted_answers: [{value: firstly, status: "correct"}]
    feedback: "Во-первых means firstly -- it numbers the first reason in an argument."
  ru.b2.unit01.lesson02.exercise02.listen_vo_pervyh_vremya:
    instruction: "Listen and select what you hear."
    correct_option: "Firstly, you save a lot of time."
    distractors: ["Secondly, you save a lot of time.", "Firstly, you save a little time.", "Firstly, you save a lot of money."]
    accepted_answers: [{value: "Firstly, you save a lot of time.", status: "correct"}]
    feedback: "Во-первых, ты экономишь много времени means firstly, you save a lot of time."
  ru.b2.unit01.lesson02.exercise03.match_argument_words:
    instruction: "Match each word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "во-первых", right: "firstly"}
          - {left: "во-вторых", right: "secondly"}
          - {left: "кроме того", right: "in addition"}
          - {left: "например", right: "for example"}
          - {left: "исследования показывают, что...", right: "research shows that..."}
          - {left: "время на дорогу", right: "commute time"}
          - {left: "продуктивнее", right: "more productive"}
          - {left: "экономишь", right: "(you) save"}
        status: "correct"
    feedback: "These are this lesson's reason- and evidence-signposting words."
  ru.b2.unit01.lesson02.exercise04.order_vo_pervyh:
    instruction: "Put the words in order to say \"Firstly, you save a lot of time.\""
    accepted_answers:
      - {value: ["Во-первых", "ты", "экономишь", "много", "времени"], status: "correct"}
    feedback: "Во-первых, ты экономишь много времени means firstly, you save a lot of time."
  ru.b2.unit01.lesson02.exercise05.translate_naprimer:
    instruction: "Translate into Russian, using например: For example, you save commute time."
    accepted_answers:
