review: {status: unreviewed, required_next_reviewer: native_speaker_review, notes: "English overlay for the past-tense morning unit (gender agreement, prefixed motion verbs, sequence words). OPEN NATIVE QUESTIONS: (1) 'В конце' used as 'at the end' of a morning sequence - confirm it sounds natural at A2 (vs 'наконец'); (2) 'Очень занятое!' as an elliptical reply to 'Как прошло твоё утро?'; (3) 'сесть в автобус' glossed as 'get on the bus' and 'приехал на работу' vs 'пришёл на работу' both accepted for 'arrived at work'; (4) 'доехал до работы' naturalness."}
course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian for telling what happened, in order, in the past."
  learning_goal: "Describe step by step how a morning went, from getting ready to arriving, using past-tense gender forms, prefixed motion verbs and sequence words."
units:
  ru.a2.unit68.zanyatoe_utro: {"title": "A busy morning", "description": "Tell how a morning went: get ready, set off, arrive, using the past tense with the right gender."}
lessons:
  ru.a2.unit68.lesson01.gotovimsya: {"title": "Getting ready"}
  ru.a2.unit68.lesson02.eshchyo_glagoly: {"title": "More verbs, we and they"}
  ru.a2.unit68.lesson03.po_doroge: {"title": "The way to work and school"}
  ru.a2.unit68.lesson04.snachala_potom: {"title": "First, then, after that"}
  ru.a2.unit68.lesson05.pismo_nasti: {"title": "Nastya's message"}
  ru.a2.unit68.lesson06.dima_i_nastya: {"title": "Dima and Nastya talk about the morning"}
teaching:
  ru.a2.unit68.lesson01.teach.glagoly_utro: {"title": "Morning verbs", "gloss": "to wake up / to get up / to wash / to get dressed / to have breakfast", "note": "These verbs describe the start of a day. Each is given as an infinitive; the past tense is the focus of this unit.", "example_gloss": ["Dima woke up at seven o'clock.", "Nastya woke up at seven o'clock.", "Dima got up, washed and got dressed.", "Nastya got up, washed and got dressed.", "Dima had breakfast.", "Nastya had breakfast."]}
  ru.a2.unit68.lesson01.teach.slova_utro: {"title": "Small words and times", "gloss": "I / you / he / she / in the morning / today / at seven o'clock / at eight o'clock", "note": "*В* plus a number and *часов* gives a clock time: *в семь часов*. *Часов* stays the same for the numbers 5 to 20.", "example_gloss": ["This morning I got up at seven o'clock.", "Did you get up at eight o'clock?", "He washed.", "She got dressed."]}
  ru.a2.unit68.lesson01.teach.druzya: {"title": "Two friends", "gloss": "Nastya / Dima", "note": "The two friends from this course. *Настя* is a teacher and *Дима* is an engineer; they use *ты* with each other.", "example_gloss": ["Nastya is a teacher and Dima is an engineer.", "Nastya and Dima are friends."]}
  ru.a2.unit68.lesson01.teach.gn_proshedshee: {"title": "Past tense: -л, -ла, -ло, -ли", "gloss": "He got up. She got up. It got up. They got up.", "note": "The past tense is built from the infinitive: drop *-ть* and add *-л*. The ending shows the gender of the subject: *-л* masculine (*Дима встал*), *-ла* feminine (*Настя встала*), *-ло* neuter, *-ли* plural (*они встали*). There is no person form: *я*, *ты*, *он* all use the same past form."}
  ru.a2.unit68.lesson01.teach.gn_vozvratnye: {"title": "Reflexive verbs in the past", "gloss": "woke up (he / she / they). Dima washed. Nastya washed. They got dressed.", "note": "Reflexive verbs keep *-ся* after a consonant (*проснулся*, *умылся*, *оделся*) but change to *-сь* after a vowel (*проснулась*, *умылась*, *оделась*, *оделись*)."}
  ru.a2.unit68.lesson01.teach.gn_ya_ty: {"title": "Gender with я and ты", "gloss": "I got up (man). I got up (woman). Did you get up (to a man)? Did you get up (to a woman)?", "note": "With *я* and *ты* the form depends on who the person is. A man says *я встал*, a woman says *я встала*. Ask a man *ты встал?* and a woman *ты встала?*"}
  ru.a2.unit68.lesson02.teach.glagoly_zavtrak: {"title": "More morning verbs", "gloss": "to drink coffee / to brush the teeth / to make breakfast / to get ready", "note": "Four more morning verbs. *Собраться* is reflexive, like *умыться*.", "example_gloss": ["Nastya drank coffee.", "Dima drank coffee.", "Dima and Nastya drank coffee.", "Nastya brushed her teeth.", "Dima brushed his teeth.", "We made breakfast.", "Dima got ready quickly.", "Nastya got ready quickly."]}
  ru.a2.unit68.lesson02.teach.slova_rano: {"title": "Adverbs and plural pronouns", "gloss": "quickly / early / we / you (plural) / they / morning / busy (neuter)", "note": "*Занятое* is the neuter form of 'busy' and goes with *утро* (a neuter noun).", "example_gloss": ["We got up early.", "Did you wake up early?", "They got dressed quickly.", "The morning was busy."]}
  ru.a2.unit68.lesson02.teach.gn_byt: {"title": "Past of быть", "gloss": "Dima was at home. Nastya was at home. The morning was busy. They were at home.", "note": "*Быть* ('to be') has a past tense but no present: *был* (m), *была* (f), *было* (n), *были* (pl). Its endings follow the same pattern as other past verbs."}
  ru.a2.unit68.lesson02.teach.gn_mnozhestvo: {"title": "Plural past: -ли", "gloss": "We got up. Dima and Nastya got up. Did you (plural) get up? They got dressed.", "note": "Plural subjects (*мы*, *вы*, *они*, or two people such as *Дима и Настя*) take *-ли*. Gender does not matter in the plural. The polite singular *вы* also takes *-ли*."}
  ru.a2.unit68.lesson02.teach.gn_sredniy: {"title": "Neuter past: -ло, -лось", "gloss": "The morning began early. The morning passed quickly.", "note": "A neuter noun such as *утро* takes *-ло* in the past, and a reflexive verb becomes *-лось*: *началось*. *Прошло* is the past of 'to pass'."}
  ru.a2.unit68.lesson03.teach.glagoly_dvizheniya1: {"title": "Leaving and getting there", "gloss": "to go out / to walk as far as / to sit down, to get on / to travel as far as", "note": "Prefixed motion verbs in the perfective past. The prefix says the direction: *вы-* out, *до-* as far as. *Сесть в автобус* means 'to get on a bus'.", "example_gloss": ["Dima left the house.", "Nastya left the house.", "Dima walked to the stop.", "Nastya walked to the stop.", "Dima got on the bus.", "Nastya got on the bus.", "Dima travelled as far as work.", "Nastya travelled as far as school."]}
  ru.a2.unit68.lesson03.teach.glagoly_dvizheniya2: {"title": "Arriving and dropping in", "gloss": "to arrive (by transport) / to drop in / to come, to arrive on foot", "note": "*При-* means arrival, *за-* means dropping in somewhere on the way.", "example_gloss": ["Dima arrived at work at nine o'clock.", "Nastya arrived at school.", "Dima dropped into the shop.", "Nastya dropped into the cafe.", "Dima came to the cafe.", "Nastya came to the shop."]}
  ru.a2.unit68.lesson03.teach.mesta: {"title": "Places and transport", "gloss": "house, home / stop / bus / shop / work / school / cafe", "note": "Places on the way. The nouns change their endings after prepositions: *из дома*, *до остановки*, *в автобус*, *на работу*, *в школу*.", "example_gloss": ["This is a stop.", "This is a bus.", "This is a school.", "This is a cafe."]}
  ru.a2.unit68.lesson03.teach.gn_vyshel: {"title": "Irregular-looking: вышел, пришёл", "gloss": "left (m / f / pl). came (m / f / pl). dropped in (m / f / pl).", "note": "These verbs look irregular, but they follow the same endings. They are made from the root *-шёл* with a prefix: *вы-шел*, *при-шёл*. The masculine ends in *-шёл* (*пришёл*), but the feminine and plural lose the *ё*: *пришла*, *пришли*. After *вы-* the masculine is *вышел* (no *ё*)."}
  ru.a2.unit68.lesson03.teach.gn_predlogi: {"title": "Prefix and preposition", "gloss": "left the house, walked to the stop, got on the bus, arrived at work, dropped into the shop", "note": "The prefix and the preposition match: *вы-* goes with *из* (out of), *до-* with *до* (as far as), *при-* and *за-* with *в* or *на* (into, to). *Из* and *до* are followed by the genitive (*из дома*, *до остановки*); *в* and *на* of direction are followed by the accusative (*в автобус*, *на работу*)."}
  ru.a2.unit68.lesson03.teach.gn_na_v: {"title": "На or в?", "gloss": "arrived at work, arrived at school, dropped into a cafe, came to the stop", "note": "Use *на* for work, a stop and events (*на работу*, *на остановку*). Use *в* for buildings and enclosed places (*в школу*, *в магазин*, *в кафе*). This must be learned word by word."}
  ru.a2.unit68.lesson04.teach.slova_poryadok: {"title": "Sequence words", "gloss": "first / then / after that / at the end", "note": "These words put the steps of a morning in order. They usually come at the start of the sentence or right before the verb.", "example_gloss": ["First Dima washed.", "Then he got dressed.", "After that he had breakfast.", "At the end Dima left the house."]}
  ru.a2.unit68.lesson04.teach.slova_dni: {"title": "Days", "gloss": "on Monday / yesterday / today", "note": "Time words for saying when the morning happened.", "example_gloss": ["On Monday Nastya got up early.", "Yesterday I woke up late.", "Today we had breakfast quickly."]}
  ru.a2.unit68.lesson04.teach.gn_posledovatelnost: {"title": "Telling steps in order", "gloss": "First Dima washed. Then he got dressed. After that he had breakfast.", "note": "Use *сначала* for the first step, *потом* and *после этого* for the next steps, and *в конце* for the last one. The verbs are all in the past, and each verb keeps the gender of its subject."}
  ru.a2.unit68.lesson04.teach.gn_poryadok_slov: {"title": "Word order and the dropped subject", "gloss": "First I washed, then I got dressed. I first washed, then I got dressed.", "note": "The sequence word can come before or after the subject (*сначала я* or *я сначала*). If the subject stays the same, you do not need to repeat *я*: *потом оделась*. A comma usually separates the two steps."}
  ru.a2.unit68.lesson04.teach.gn_i: {"title": "Several verbs, one subject", "gloss": "Nastya got up, washed and got dressed. Dima got up, washed and had breakfast.", "note": "When one subject does several things in a row, put commas between the verbs and *и* before the last one. All verbs agree with the same subject."}
  ru.a2.unit68.lesson04.teach.obrazec: {"title": "A model morning", "gloss": "First I woke up and washed. Then I got dressed and had breakfast. After that I left the house. At the end I arrived at school.", "note": "A model for telling your own morning. A man would use *проснулся, умылся, оделся, позавтракал, вышел, приехал*."}
  ru.a2.unit68.lesson05.teach.slova_pismo: {"title": "Words for the message", "gloss": "hi / bye / very / late / but / tea", "note": "Words used in the message.", "example_gloss": ["Hi, Dima!", "Bye, Nastya!", "The morning was very busy.", "The bus arrived late, but I got there.", "I drank tea."]}
  ru.a2.unit68.lesson05.teach.gn_do_v: {"title": "До or в?", "gloss": "I walked as far as the stop. I travelled as far as the school. I arrived at school.", "note": "*До* stresses the point you reach (*дошла до остановки*), while *приехала в школу* says you arrived inside. After *до* the noun is in the genitive, after *в* it is in the accusative."}
  ru.a2.unit68.lesson05.teach.pismo: {"title": "Nastya's message", "gloss": "Hi! On Monday my morning was very busy. First I woke up at six o'clock and washed quickly. Then I got dressed and drank coffee. After that I left the house and walked to the stop. The bus arrived late, but I got on the bus and arrived at school at eight o'clock. At the end I dropped into a cafe and drank tea. Bye, Nastya", "note": "Nastya tells a friend how her Monday morning went. Notice how each step uses a sequence word and a feminine past verb.", "glosses": {"поздно": "late", "но": "but", "чай": "tea"}}
  ru.a2.unit68.lesson06.teach.vopros: {"title": "Dima asks", "gloss": "Dima: Hi, Nastya! How was your morning?"}
  ru.a2.unit68.lesson06.teach.nastya1: {"title": "Nastya answers", "gloss": "Nastya: Hi, Dima! Very busy! First I woke up at six o'clock and got dressed quickly."}
  ru.a2.unit68.lesson06.teach.zavtrak: {"title": "Dima asks about breakfast", "gloss": "Dima: Did you have breakfast?"}
  ru.a2.unit68.lesson06.teach.kofe: {"title": "Nastya tells more", "gloss": "Nastya: Yes, I drank coffee. Then I left the house and walked to the stop."}
  ru.a2.unit68.lesson06.teach.avtobus: {"title": "Dima asks about the bus", "gloss": "Dima: Did you get on the bus?"}
  ru.a2.unit68.lesson06.teach.shkola: {"title": "Nastya arrives", "gloss": "Nastya: Yes. I arrived at school at eight o'clock."}
  ru.a2.unit68.lesson06.teach.dima: {"title": "Dima's turn", "gloss": "Dima: And I arrived at work at nine o'clock."}
exercises:
  ru.a2.unit68.lesson01.exercise01.vybor_dima: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима встал в семь часов.", "distractors": ["Дима встала в семь часов.", "Дима встало в семь часов.", "Дима встали в семь часов."], "accepted_answers": [{"value": "Дима встал в семь часов.", "status": "correct"}], "feedback": "*Дима* is masculine, so the verb ends in *-л*: *встал*."}
  ru.a2.unit68.lesson01.exercise02.vybor_nastya: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя проснулась в восемь часов.", "distractors": ["Настя проснулся в восемь часов.", "Настя проснулись в восемь часов.", "Настя проснулось в восемь часов."], "accepted_answers": [{"value": "Настя проснулась в восемь часов.", "status": "correct"}], "feedback": "*Настя* is feminine: *проснулась*, with *-сь* after the vowel."}
  ru.a2.unit68.lesson01.exercise03.slova: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "проснуться", "right": "to wake up"}, {"left": "встать", "right": "to get up"}, {"left": "умыться", "right": "to wash"}, {"left": "одеться", "right": "to get dressed"}, {"left": "позавтракать", "right": "to have breakfast"}, {"left": "утром", "right": "in the morning"}, {"left": "сегодня", "right": "today"}], "status": "correct"}], "feedback": "These are the words for the start of the day."}
  ru.a2.unit68.lesson01.exercise04.poryadok_nastya: {"instruction": "Put the words in order to say 'Nastya got up at seven o'clock.'", "correct_option": "Настя встала в семь часов", "accepted_answers": [{"value": "Настя встала в семь часов", "status": "correct"}, {"value": "В семь часов Настя встала", "status": "correct"}, {"value": "Настя в семь часов встала", "status": "correct"}], "feedback": "*Настя встала в семь часов*: the past verb agrees with the feminine subject."}
  ru.a2.unit68.lesson01.exercise05.propusk_dima: {"instruction": "Complete with the past tense of 'to get dressed' for Dima.", "correct_option": "оделся", "accepted_answers": [{"value": "оделся", "status": "correct"}], "feedback": "*Дима* is masculine and the verb is reflexive: *оделся*."}
  ru.a2.unit68.lesson01.exercise06.perevod_nastya: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Настя проснулась в семь часов.", "status": "correct"}, {"value": "Настя проснулась в семь часов", "status": "correct"}, {"value": "Настя проснулась в семь.", "status": "correct"}, {"value": "Настя проснулась в семь", "status": "correct"}, {"value": "В семь часов Настя проснулась.", "status": "correct"}, {"value": "В семь часов Настя проснулась", "status": "correct"}, {"value": "Настя в семь часов проснулась.", "status": "correct"}, {"value": "Настя в семь часов проснулась", "status": "correct"}], "feedback": "*Настя проснулась в семь часов.*"}
  ru.a2.unit68.lesson01.exercise07.pismo_dima: {"instruction": "Write the sentence in Russian.", "correct_option": "Дима умылся и оделся.", "accepted_answers": [{"value": "Дима умылся и оделся.", "status": "correct"}, {"value": "Дима умылся и оделся", "status": "correct"}], "feedback": "*Дима умылся и оделся.*"}
  ru.a2.unit68.lesson02.exercise01.vybor_my: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы встали рано.", "distractors": ["Мы встал рано.", "Мы встала рано.", "Мы встало рано."], "accepted_answers": [{"value": "Мы встали рано.", "status": "correct"}], "feedback": "*Мы* is plural, so the verb ends in *-ли*."}
  ru.a2.unit68.lesson02.exercise02.vybor_utro: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Утро было занятое.", "distractors": ["Утро был занятое.", "Утро была занятое.", "Утро были занятое."], "accepted_answers": [{"value": "Утро было занятое.", "status": "correct"}], "feedback": "*Утро* is neuter, so the past of *быть* is *было*."}
  ru.a2.unit68.lesson02.exercise03.frazy: {"instruction": "Match each Russian sentence to its English meaning.", "accepted_answers": [{"value": [{"left": "Дима почистил зубы", "right": "Dima brushed his teeth"}, {"left": "Настя выпила кофе", "right": "Nastya drank coffee"}, {"left": "Мы приготовили завтрак", "right": "We made breakfast"}, {"left": "Утро началось рано", "right": "The morning began early"}, {"left": "Они оделись", "right": "They got dressed"}, {"left": "Дима собрался быстро", "right": "Dima got ready quickly"}], "status": "correct"}], "feedback": "Check the ending of each verb against its subject."}
  ru.a2.unit68.lesson02.exercise04.poryadok_oni: {"instruction": "Put the words in order to say 'They got dressed quickly.'", "correct_option": "Они быстро оделись", "accepted_answers": [{"value": "Они быстро оделись", "status": "correct"}, {"value": "Они оделись быстро", "status": "correct"}, {"value": "Быстро они оделись", "status": "correct"}], "feedback": "*Они быстро оделись*: plural subject, verb in *-ись*."}
  ru.a2.unit68.lesson02.exercise05.propusk_zavtrak: {"instruction": "Complete with the past tense of 'to make' (plural subject).", "correct_option": "приготовили", "accepted_answers": [{"value": "приготовили", "status": "correct"}], "feedback": "Two people make a plural subject: *приготовили*."}
  ru.a2.unit68.lesson02.exercise06.perevod_rano: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Дима и Настя встали рано.", "status": "correct"}, {"value": "Дима и Настя встали рано", "status": "correct"}, {"value": "Дима и Настя рано встали.", "status": "correct"}, {"value": "Дима и Настя рано встали", "status": "correct"}, {"value": "Настя и Дима встали рано.", "status": "correct"}, {"value": "Настя и Дима встали рано", "status": "correct"}, {"value": "Настя и Дима рано встали.", "status": "correct"}, {"value": "Настя и Дима рано встали", "status": "correct"}], "feedback": "*Дима и Настя встали рано.* Two subjects need a plural verb."}
  ru.a2.unit68.lesson02.exercise07.pismo_kofe: {"instruction": "Write the sentence in Russian.", "correct_option": "Настя выпила кофе и почистила зубы.", "accepted_answers": [{"value": "Настя выпила кофе и почистила зубы.", "status": "correct"}, {"value": "Настя выпила кофе и почистила зубы", "status": "correct"}], "feedback": "*Настя выпила кофе и почистила зубы.*"}
  ru.a2.unit68.lesson03.exercise01.vybor_vyshel: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима вышел из дома.", "distractors": ["Дима вышла из дома.", "Дима вышли из дома.", "Дима вышел в дом."], "accepted_answers": [{"value": "Дима вышел из дома.", "status": "correct"}], "feedback": "*Вышел из* means 'went out of'. *Дима* is masculine."}
  ru.a2.unit68.lesson03.exercise02.vybor_shkola: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя приехала в школу.", "distractors": ["Настя приехал в школу.", "Настя приехали в школу.", "Настя приехала из школы."], "accepted_answers": [{"value": "Настя приехала в школу.", "status": "correct"}], "feedback": "Use *в* with *школа* and a feminine verb."}
  ru.a2.unit68.lesson03.exercise03.glagoly: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "вышел из дома", "right": "left the house"}, {"left": "дошла до остановки", "right": "walked to the stop"}, {"left": "села в автобус", "right": "got on the bus"}, {"left": "приехал на работу", "right": "arrived at work"}, {"left": "зашла в магазин", "right": "dropped into the shop"}, {"left": "пришёл в кафе", "right": "came to the cafe"}], "status": "correct"}], "feedback": "Each verb is paired with its own preposition."}
  ru.a2.unit68.lesson03.exercise04.poryadok_doshyol: {"instruction": "Put the words in order to say 'Dima walked to the stop.'", "correct_option": "Дима дошёл до остановки", "accepted_answers": [{"value": "Дима дошёл до остановки", "status": "correct"}], "feedback": "*До остановки* follows the verb *дошёл*."}
