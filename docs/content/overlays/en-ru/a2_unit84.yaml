course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Pass on a simple message or question with что and ли."
units:
  ru.a2.unit84.peredat_soobshchenie: {"title": "Passing on a message", "description": "Pass on what someone said or asked with говорит, сказал, спросил and передай."}
lessons:
  ru.a2.unit84.lesson01.govorit: {"title": "Says that"}
  ru.a2.unit84.lesson02.skazal: {"title": "Said"}
  ru.a2.unit84.lesson03.sprosil: {"title": "Asked where"}
  ru.a2.unit84.lesson04.peredaj: {"title": "Pass on that"}
  ru.a2.unit84.lesson05.zapiska: {"title": "Dima's note"}
  ru.a2.unit84.lesson06.dialog: {"title": "What did Anya say"}
teaching:
  ru.a2.unit84.lesson01.teach.govorit: {"title": "Saying", "gloss": "says / they say / I say / that", "note": "*Говорит* introduces what someone says. After a comma comes *что* and the message.", "example_gloss": ["Dima says that he is tired.", "Nastya says that she is at home.", "They say that it will rain tomorrow.", "I say that I am at home."]}
  ru.a2.unit84.lesson01.teach.gn_direct: {"title": "From quote to report", "gloss": "Dima says: 'I am tired.' Dima says that he is tired.", "note": "To pass on what someone says, put a comma and *что*. The person changes: *я* becomes *он* when you talk about Dima."}
  ru.a2.unit84.lesson01.teach.gn_tense: {"title": "The tense stays", "gloss": "Nastya says that she is at home. They say that it will rain tomorrow.", "note": "The verb keeps the tense of the original words: *дома* (present) and *будет* (future) stay as they were said."}
  ru.a2.unit84.lesson02.teach.skazal: {"title": "Said", "gloss": "said (man) / said (woman) / said (plural) / will come / will call", "note": "*Сказал* is for a man, *сказала* for a woman, *сказали* for several people.", "example_gloss": ["Dima said that he would come.", "Nastya said that she was tired.", "Nastya said that she would call tomorrow.", "They said that they were at home."]}
  ru.a2.unit84.lesson02.teach.gn_skazal: {"title": "сказал or сказала", "gloss": "Dima said that he would come. Nastya said that she was tired.", "note": "The verb *сказать* agrees with who spoke: *сказал* (Dima), *сказала* (Nastya)."}
  ru.a2.unit84.lesson02.teach.gn_keep: {"title": "Same tense as the words", "gloss": "Nastya said that she was tired. Nastya said that she would call tomorrow.", "note": "Russian does not shift the tense: Nastya said 'I am tired' becomes *она устала*, 'I will call' becomes *позвонит*."}
  ru.a2.unit84.lesson03.teach.sprosil: {"title": "Asking", "gloss": "asks / asked (man) / asked (woman) / whether", "note": "To pass on a question use *спрашивает* or *спросил/спросила* and a question word. For yes or no use *ли*.", "example_gloss": ["Dima asks where Nastya is.", "Nastya asked when Dima would come.", "Nastya asked whether Dima would come.", "Dima asked where you are."]}
  ru.a2.unit84.lesson03.teach.gn_sprosil: {"title": "Question words", "gloss": "Dima asks where Nastya is. Nastya asked when Dima would come.", "note": "The question word (*где, когда*) starts the clause after the comma. There is no question mark."}
  ru.a2.unit84.lesson03.teach.gn_li: {"title": "ли for yes or no", "gloss": "Nastya asked whether Dima would come.", "note": "When the question can be answered yes or no, use *ли* after the verb: *придёт ли*."}
  ru.a2.unit84.lesson04.teach.peredaj: {"title": "Passing on a message", "gloss": "pass on! (to a friend) / pass on! (polite) / I will pass on / to Anya / to Nastya / to Dima / I will be late", "note": "*Передай* means 'pass on, tell'. After it comes the person: *Ане, Насте, Диме*. Learn these forms as chunks.", "example_gloss": ["Tell Anya that I will be late.", "Tell Nastya that I will call.", "Please tell Dima that I called. (a woman, polite)", "Fine, I will pass it on!"]}
  ru.a2.unit84.lesson04.teach.gn_peredaj: {"title": "Передай + person + что", "gloss": "Tell Nastya that I will call.", "note": "Say *передай*, then the person (*Насте*), a comma, *что* and the message. The message is in the words of the speaker: *я позвоню*."}
  ru.a2.unit84.lesson04.teach.gn_polite: {"title": "Friend or polite", "gloss": "Tell Dima that I am at home. Please tell Dima that I am at home.", "note": "To a friend say *передай*; to a stranger or several people say *передайте*."}
  ru.a2.unit84.lesson05.teach.v5: {"title": "Words for the note", "gloss": "called / asks / to pass on / tired", "note": "*Просит передать* means 'asks to pass on'. After it comes *что* and the message.", "example_gloss": ["Anya called.", "Anya is tired.", "Anya asks me to pass on that she will call."]}
  ru.a2.unit84.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! Anya called. She said that she is tired and will not come tomorrow. She asked where you are. I said that you are at home. She asks me to pass on that she will call in the evening. Dima", "note": "The note passes on what Anya said and asked.", "glosses": {"звонила": "called", "просит": "asks"}}
  ru.a2.unit84.lesson06.teach.q: {"title": "Nastya asks", "gloss": "Настя: Dima, what did Anya say?"}
  ru.a2.unit84.lesson06.teach.a: {"title": "Dima passes on the message", "gloss": "Дима: She said that she is tired and will not come tomorrow. She asked where you are."}
  ru.a2.unit84.lesson06.teach.q2: {"title": "Nastya asks him to pass on", "gloss": "Настя: Tell Anya that I am at home. I will call in the evening."}
  ru.a2.unit84.lesson06.teach.end: {"title": "Dima agrees", "gloss": "Дима: Fine, I will pass it on!"}
exercises:
  ru.a2.unit84.lesson01.exercise01.dima: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима говорит, что он устал.", "distractors": ["Дима говорит, что я устал.", "Дима говорит, что он устала.", "Дима говорит, почему он устал."], "accepted_answers": [{"value": "Дима говорит, что он устал.", "status": "correct"}], "feedback": "*Что* + the message."}
  ru.a2.unit84.lesson01.exercise02.nastya: {"instruction": "Choose the correct English meaning.", "correct_option": "Nastya says that she is at home.", "distractors": ["Nastya says that I am at home.", "Nastya asks where she is.", "Nastya says that you are at home."], "accepted_answers": [{"value": "Nastya says that she is at home.", "status": "correct"}], "feedback": "*Она* = Nastya."}
  ru.a2.unit84.lesson01.exercise03.w1: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "говорит", "right": "he or she says"}, {"left": "говорю", "right": "I say"}, {"left": "говорят", "right": "they say"}, {"left": "что", "right": "that"}, {"left": "он устал", "right": "he is tired"}, {"left": "она дома", "right": "she is at home"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit84.lesson01.exercise04.rain: {"instruction": "Put the words in order to say 'They say that it will rain tomorrow.'", "correct_option": "Они говорят что завтра будет дождь", "accepted_answers": [{"value": "Они говорят что завтра будет дождь", "status": "correct"}], "feedback": "Comma and *что*."}
  ru.a2.unit84.lesson01.exercise05.chto: {"instruction": "Complete the sentence: 'Dima says that he is tired.'", "correct_option": "что", "accepted_answers": [{"value": "что", "status": "correct"}], "feedback": "*Что* introduces the message."}
  ru.a2.unit84.lesson01.exercise06.tired: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Настя говорит, что она устала.", "status": "correct"}, {"value": "Настя говорит, что она устала", "status": "correct"}, {"value": "Настя говорит, что устала.", "status": "correct"}, {"value": "Настя говорит, что устала", "status": "correct"}], "feedback": "*Она устала*."}
  ru.a2.unit84.lesson01.exercise07.cold: {"instruction": "Write the requested Russian sentence.", "correct_option": "Они говорят, что завтра будет холодно.", "accepted_answers": [{"value": "Они говорят, что завтра будет холодно.", "status": "correct"}, {"value": "Они говорят, что завтра будет холодно", "status": "correct"}], "feedback": "*Будет холодно* stays in the future."}
  ru.a2.unit84.lesson02.exercise01.dima: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима сказал, что он придёт.", "distractors": ["Дима сказал, что я приду.", "Дима сказала, что он придёт.", "Дима сказал, что он пришёл."], "accepted_answers": [{"value": "Дима сказал, что он придёт.", "status": "correct"}], "feedback": "*Придёт* = will come."}
  ru.a2.unit84.lesson02.exercise02.nastya: {"instruction": "Choose the correct English meaning.", "correct_option": "Nastya said that she was tired.", "distractors": ["Nastya said that she would be tired.", "Nastya said that I was tired.", "Nastya asked whether she was tired."], "accepted_answers": [{"value": "Nastya said that she was tired.", "status": "correct"}], "feedback": "*Устала* = was tired."}
