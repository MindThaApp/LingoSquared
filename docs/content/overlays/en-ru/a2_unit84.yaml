  ru.a2.unit84.lesson03.exercise01.dima: {"instruction": "Choose the correct English meaning.", "correct_option": "Dima asks where Nastya is.", "distractors": ["Dima says that Nastya is at home.", "Dima asks whether Nastya is coming.", "Nastya asks where Dima is."], "accepted_answers": [{"value": "Dima asks where Nastya is.", "status": "correct"}], "feedback": "*Спрашивает, где* = asks where."}
  ru.a2.unit84.lesson03.exercise02.li: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя спросила, придёт ли Дима.", "distractors": ["Настя спросила, придёшь ли Дима.", "Настя спросил, придёт ли Дима.", "Настя спросила, ли придёт Дима."], "accepted_answers": [{"value": "Настя спросила, придёт ли Дима.", "status": "correct"}], "feedback": "*Придёт ли* = whether he will come."}
