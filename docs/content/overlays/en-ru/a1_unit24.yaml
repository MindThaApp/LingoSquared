course:
  title: "Russian A1"
  description: "Learn A1-level Russian for payment, cash/card questions, receipts, and basic currency needs."

units:
  ru.a1.unit24.money: {title: "Can I pay by card?"}

lessons:
  ru.a1.unit24.lesson01.mozhno_kartoy: {title: "Can I pay by card?"}
  ru.a1.unit24.lesson02.chek_nuzhen: {title: "Do you need a receipt?"}
  ru.a1.unit24.lesson03.oplata_v_kafe: {title: "Dialogue: paying at a cafe"}

teaching:
  ru.a1.unit24.lesson01.teach.mozhno_kartoy: {title: "Можно картой?", gloss: "Can I pay by card?", note: "картой is the instrumental form of карта, used for paying by card.", example_gloss: "Can I pay by card today?"}
  ru.a1.unit24.lesson01.teach.nalichnymi: {title: "наличными", gloss: "in cash", note: "наличными means paying with cash.", example_gloss: "Cash is possible."}
  ru.a1.unit24.lesson01.teach.rubli: {title: "рубли", gloss: "rubles", note: "рубли is the currency; after many numbers you see рублей.", example_gloss: "I need rubles."}
  ru.a1.unit24.lesson02.teach.chek_nuzhen: {title: "Чек нужен?", gloss: "Do you need a receipt?", note: "нужен agrees with masculine чек.", example_gloss: "Do you need a receipt today?"}
  ru.a1.unit24.lesson02.teach.s_vas_trista: {title: "С вас триста рублей.", gloss: "That will be three hundred rubles.", note: "С вас... is a common cashier phrase for the amount due.", example_gloss: "Today that will be three hundred rubles."}
  ru.a1.unit24.lesson02.teach_tolko_nalichnymi: {title: "Только наличными.", gloss: "Cash only.", note: "Только means \"only.\"", example_gloss: "Today, cash only."}
  ru.a1.unit24.lesson03.teach.dima_mozhno_kartoy: {title: "Dima asks about card payment", gloss: "Dima: Can I pay by card?", note: "This asks about an accepted payment method."}
  ru.a1.unit24.lesson03.teach.kassir_da_s_vas: {title: "The cashier gives the amount", gloss: "Cashier: Yes, you can. That will be three hundred rubles.", note: "The cashier confirms card payment and states the amount."}
  ru.a1.unit24.lesson03.teach.dima_vot_karta: {title: "Dima gives the card", gloss: "Dima: Here is the card.", note: "Вот карта is a simple handover phrase."}
  ru.a1.unit24.lesson03.teach.kassir_chek: {title: "The cashier asks about a receipt", gloss: "Cashier: Thank you. Do you need a receipt?", note: "Чек нужен? asks whether a receipt is needed."}
  ru.a1.unit24.lesson03.teach.dima_da_pozhaluysta: {title: "Dima asks for the receipt", gloss: "Dima: Yes, please.", note: "Да, пожалуйста accepts the offered receipt."}

