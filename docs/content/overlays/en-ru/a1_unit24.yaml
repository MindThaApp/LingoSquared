    feedback: "The correct order is С вас триста рублей."
  ru.a1.unit24.lesson03.exercise06.reply_chek_nuzhen:
    instruction: "Someone asks \"Чек нужен?\" Reply \"Yes, please.\""
    accepted_answers:
      - {value: "Да, пожалуйста.", status: "correct"}
      - {value: "Да, пожалуйста", status: "correct"}
    feedback: "Да, пожалуйста. means \"Yes, please.\""
  ru.a1.unit24.lesson03.exercise07.complete_mne_nuzhny_rubli:
    instruction: "Complete the sentence: Мне нужны ___. (rubles)"
    accepted_answers:
      - {value: "рубли", status: "correct"}
      - {value: "Мне нужны рубли", status: "correct"}
    feedback: "Мне нужны рубли means \"I need rubles.\""
  ru.a1.unit24.lesson03.exercise08.write_payment_note:
    instruction: "Write: \"I need rubles.\""
    accepted_answers:
      - {value: "Мне нужны рубли.", status: "correct"}
      - {value: "Мне нужны рубли", status: "correct"}
    feedback: "Мне нужны рубли. means \"I need rubles\"; нужны agrees with plural рубли."
