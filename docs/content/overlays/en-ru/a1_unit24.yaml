          - {left: "Да, пожалуйста.", right: "Yes, please."}
        status: "correct"
    feedback: "These lines complete a basic payment exchange."
  ru.a1.unit24.lesson03.exercise05.order_s_vas_trista:
    instruction: "Put the words in the correct order to say \"That will be three hundred rubles.\""
    accepted_answers:
