  ru.a1.unit24.lesson02.exercise05.order_chek_nuzhen:
    instruction: "Put the words in the correct order to ask \"Do you need a receipt?\""
    accepted_answers:
      - {value: ["Чек", "нужен"], status: "correct"}
    feedback: "The correct order is Чек нужен?"
  ru.a1.unit24.lesson02.exercise06.listen_order_tolko_nalichnymi:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Только", "наличными"], status: "correct"}
    feedback: "The correct order is Только наличными."
  ru.a1.unit24.lesson02.exercise07.complete_s_vas_trista:
    instruction: "Complete the sentence: С вас ___ рублей. (three hundred)"
    accepted_answers:
      - {value: "триста", status: "correct"}
      - {value: "С вас триста рублей", status: "correct"}
    feedback: "С вас триста рублей. means \"That will be three hundred rubles.\""
  ru.a1.unit24.lesson02.exercise08.write_cash_only:
    instruction: "Write a short sign saying \"Cash only.\""
    accepted_answers:
      - {value: "Только наличными.", status: "correct"}
      - {value: "Только наличными", status: "correct"}
    feedback: "Только наличными. means \"Cash only.\""

  ru.a1.unit24.lesson03.exercise01.choose_pay_by_card:
    instruction: "You want to ask if you can pay by card. What do you say?"
    correct_option: "Можно картой?"
    distractors: ["Чек нужен?", "С вас триста рублей.", "Только наличными."]
    accepted_answers: [{value: "Можно картой?", status: "correct"}]
