    instruction: "Listen to the recording. What payment method is being asked about?"
    correct_option: "Paying by card."
    distractors: ["Paying in cash.", "Getting a receipt.", "Changing money."]
    accepted_answers: [{value: "Paying by card.", status: "correct"}]
    feedback: "The recording says Можно картой?"
  ru.a1.unit24.lesson01.exercise04.match_payment_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "картой", right: "by card"}
          - {left: "наличными", right: "in cash"}
          - {left: "рубли", right: "rubles"}
          - {left: "рублей", right: "rubles (after numbers)"}
