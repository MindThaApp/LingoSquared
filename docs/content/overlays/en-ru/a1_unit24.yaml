          - {left: "Можно наличными.", right: "Cash is possible."}
        status: "correct"
    feedback: "These are common payment-method words."
  ru.a1.unit24.lesson01.exercise05.order_mozhno_kartoy:
    instruction: "Put the words in the correct order to ask \"Can I pay by card?\""
    accepted_answers:
      - {value: ["Можно", "картой"], status: "correct"}
    feedback: "The correct order is Можно картой?"
  ru.a1.unit24.lesson01.exercise06.listen_order_mozhno_kartoy:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Можно", "картой"], status: "correct"}
    feedback: "The correct order is Можно картой?"
  ru.a1.unit24.lesson01.exercise07.complete_mozhno_kartoy:
    instruction: "Complete the sentence: Можно ___? (by card)"
    accepted_answers:
      - {value: "картой", status: "correct"}
      - {value: "Можно картой", status: "correct"}
    feedback: "Можно картой? asks whether card payment is possible."
  ru.a1.unit24.lesson01.exercise08.write_pay_by_card:
    instruction: "Write a question asking if you can pay by card."
    accepted_answers:
      - {value: "Можно картой?", status: "correct"}
      - {value: "Можно картой", status: "correct"}
    feedback: "Можно картой? is the natural question."

  ru.a1.unit24.lesson02.exercise01.recognize_chek:
    instruction: "Which word means \"receipt\"?"
