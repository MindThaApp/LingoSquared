    feedback: "чек means \"receipt.\""
  ru.a1.unit24.lesson02.exercise02.recognize_trista:
    instruction: "Which word means \"three hundred\"?"
    correct_option: "триста"
    distractors: ["рублей", "чек", "только"]
    accepted_answers: [{value: "триста", status: "correct"}]
    feedback: "триста means \"three hundred.\""
  ru.a1.unit24.lesson02.exercise03.listen_select_tolko_nalichnymi:
    instruction: "Listen to the recording. What payment method is accepted?"
    correct_option: "Cash only."
    distractors: ["Card only.", "Both card and cash.", "Rubles by card."]
    accepted_answers: [{value: "Cash only.", status: "correct"}]
    feedback: "The recording says Только наличными."
  ru.a1.unit24.lesson02.exercise04.match_receipt_amount:
    instruction: "Match each Russian phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "Чек нужен?", right: "Do you need a receipt?"}
          - {left: "С вас триста рублей.", right: "That will be three hundred rubles."}
          - {left: "Только наличными.", right: "Cash only."}
          - {left: "чек", right: "receipt"}
          - {left: "триста", right: "three hundred"}
          - {left: "рублей", right: "rubles"}
        status: "correct"
