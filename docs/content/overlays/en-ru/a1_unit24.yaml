    accepted_answers: [{value: "Можно картой", status: correct}]
    orthography_strict: true

  ru.a1.unit24.lesson01.exercise01.recognize_kartoy:
    instruction: "Which word means \"by card\"?"
    correct_option: "картой"
    distractors: ["наличными", "рубли", "можно"]
    accepted_answers: [{value: "картой", status: "correct"}]
    feedback: "картой means \"by card.\""
  ru.a1.unit24.lesson01.exercise02.recognize_nalichnymi:
    instruction: "Which word means \"in cash\"?"
