  ru.a1.unit24.lesson03.exercise02.listen_select_mne_nuzhny_rubli:
    instruction: "Listen to the recording. What does the speaker need?"
    correct_option: "Rubles."
    distractors: ["A card.", "A receipt.", "Cash only."]
    accepted_answers: [{value: "Rubles.", status: "correct"}]
    feedback: "The recording says Мне нужны рубли."
  ru.a1.unit24.lesson03.exercise03.dialogue_comprehension_oplata:
    instruction: "Listen to the dialogue. How does Dima pay, how much is it, and does he want a receipt?"
    correct_option: "He pays by card; it is three hundred rubles; he wants a receipt"
    distractors: ["He pays cash; it is three hundred rubles; he does not want a receipt", "He exchanges rubles; it is two hundred rubles", "He asks for cash only and no receipt"]
    accepted_answers: [{value: "He pays by card; it is three hundred rubles; he wants a receipt", status: "correct"}]
    feedback: "Дима asks Можно картой?, the cashier says С вас триста рублей, and Дима answers Да, пожалуйста to Чек нужен?"
  ru.a1.unit24.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Можно картой?", right: "Can I pay by card?"}
          - {left: "Да, можно.", right: "Yes, you can."}
          - {left: "С вас триста рублей.", right: "That will be three hundred rubles."}
