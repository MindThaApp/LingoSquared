    accepted_answers: [{value: "He was reading an email; a colleague called; the colleague said the meeting had started; Dima opened the link", status: "correct"}]
    feedback: "Dima gives the sequence with *Сначала*, *Потом*, and *После этого*."
  ru.b1.unit40.lesson03.exercise03.match_dialogue_narrative:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Что случилось вчера?", right: "What happened yesterday?"}
          - {left: "Сначала", right: "first"}
          - {left: "Когда я читал письмо", right: "when I was reading the email"}
          - {left: "коллега позвонил", right: "a colleague called"}
          - {left: "он сказал, что", right: "he said that"}
          - {left: "После этого", right: "after that"}
        status: "correct"
    feedback: "These phrases build the full past narrative."
  ru.b1.unit40.lesson03.exercise04.order_after_that: {instruction: "Put the words in order to say \"After that I quickly opened the link.\"", accepted_answers: [{value: ["После", "этого", "я", "быстро", "открыл", "ссылку"], status: "correct"}], feedback: "The correct order is *После этого я быстро открыл ссылку*."}
  ru.b1.unit40.lesson03.exercise05.reply_what_happened:
    instruction: "Nastya asks \"Дима, что случилось вчера?\" Answer with exactly three sentences: \"Сначала я читал письмо. Когда я читал письмо, коллега позвонил. Потом он сказал, что встреча уже началась.\""
    accepted_answers:
