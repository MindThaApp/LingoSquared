      - {value: "Сначала я читал письмо. Когда я читал письмо коллега позвонил. Потом он сказал что встреча уже началась.", status: "correct"}
    feedback: "The model answer gives the first event, the interrupted background action, and reported speech."
  ru.b1.unit40.lesson03.exercise06.write_full_past_narrative:
