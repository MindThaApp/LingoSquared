course:
  title: "Russian B1"
  description: "Learn B1-level Russian for recounting past experiences with sequence, aspect choice, and reported speech."

units:
  ru.b1.unit40.rasskaz: {title: "Story"}

lessons:
  ru.b1.unit40.lesson01.fon_i_sobytie: {title: "Background and event"}
  ru.b1.unit40.lesson02.vid_i_posledovatelnost: {title: "Aspect and sequence"}
  ru.b1.unit40.lesson03.rasskaz_o_vstreche: {title: "Story about a meeting"}

teaching:
  ru.b1.unit40.lesson01.teach.chital_background: {title: "Я читал письмо.", gloss: "I was reading an email.", note: "*читал* presents an ongoing background action in the past.", example_gloss: "Dima was reading an email."}
  ru.b1.unit40.lesson01.teach.pozvonil_event: {title: "Коллега позвонил.", gloss: "A colleague called.", note: "*позвонил* presents one completed event.", example_gloss: "A colleague called yesterday."}
  ru.b1.unit40.lesson01.teach.kogda_background_event: {title: "Когда я читал письмо, коллега позвонил.", gloss: "When I was reading an email, a colleague called.", note: "*Когда* links the background action to the main event.", example_gloss: "When I was reading an email yesterday, a colleague called."}
  ru.b1.unit40.lesson02.teach.aspect_chital: {title: "читал = процесс в прошлом", gloss: "chital = a process in the past", note: "Use imperfective *читал* for background action that was in progress.", example_gloss: "Chital shows a process in the past."}
  ru.b1.unit40.lesson02.teach.aspect_pozvonil: {title: "позвонил = одно законченное событие", gloss: "pozvonil = one completed event", note: "Use perfective *позвонил* for the completed event in the story line.", example_gloss: "Pozvonil shows one completed event."}
  ru.b1.unit40.lesson02.teach.sequence_markers: {title: "Сначала я читал письмо. Потом коллега позвонил.", gloss: "First I was reading an email. Then a colleague called.", note: "*Сначала* and *Потом* order the events.", example_gloss: "First I was reading an email. Then a colleague called yesterday."}
  ru.b1.unit40.lesson02.teach.reported_speech: {title: "Потом он сказал, что встреча уже началась.", gloss: "Then he said that the meeting had already started.", note: "*сказал, что...* reports what someone said.", example_gloss: "Then he said that the meeting had already started today."}
  ru.b1.unit40.lesson03.teach.nastya_question: {title: "Nastya asks what happened", gloss: "Nastya: Dima, what happened yesterday?", note: "This prompts a past narrative."}
  ru.b1.unit40.lesson03.teach.dima_first: {title: "Dima starts the story", gloss: "Dima: First I was reading an email.", note: "*Сначала* starts the sequence."}
  ru.b1.unit40.lesson03.teach.dima_when: {title: "Dima gives background and event", gloss: "Dima: When I was reading an email, a colleague called.", note: "This contrasts imperfective background and perfective event."}
  ru.b1.unit40.lesson03.teach.dima_said: {title: "Dima reports what was said", gloss: "Dima: Then he said that the meeting had already started.", note: "*сказал, что...* reports another person's words."}
  ru.b1.unit40.lesson03.teach.dima_after: {title: "Dima adds the next event", gloss: "Dima: After that I quickly opened the link.", note: "*После этого* continues the sequence."}

exercises:
  ru.b1.unit40.lesson01.exercise01.recognize_kogda: {instruction: "Which Russian phrase means \"when I was reading the email\"?", correct_option: "когда я читал письмо", distractors: ["потом он сказал", "после этого я открыл", "коллега позвонил"], accepted_answers: [{value: "когда я читал письмо", status: "correct"}], feedback: "*когда я читал письмо* gives the background time."}
  ru.b1.unit40.lesson01.exercise02.recognize_pozvonil: {instruction: "Which Russian phrase means \"a colleague called\"?", correct_option: "коллега позвонил", distractors: ["коллега читал", "встреча началась", "я открыл"], accepted_answers: [{value: "коллега позвонил", status: "correct"}], feedback: "*коллега позвонил* means \"a colleague called.\""}
  ru.b1.unit40.lesson01.exercise03.listen_select_interruption: {instruction: "Listen. What happened while the speaker was reading the email?", correct_option: "A colleague called.", distractors: ["The meeting started.", "He opened the link.", "Nastya asked a question."], accepted_answers: [{value: "A colleague called.", status: "correct"}], feedback: "The recording says *Когда я читал письмо, коллега позвонил*."}
  ru.b1.unit40.lesson01.exercise04.match_background_event:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Когда", right: "when"}
          - {left: "я читал", right: "I was reading"}
          - {left: "письмо", right: "email"}
          - {left: "коллега", right: "colleague"}
          - {left: "позвонил", right: "called"}
          - {left: "вчера", right: "yesterday"}
        status: "correct"
    feedback: "These phrases link a background action and a main event."
  ru.b1.unit40.lesson01.exercise05.order_background_event: {instruction: "Put the words in order to say \"When I was reading the email, a colleague called.\"", accepted_answers: [{value: ["Когда", "я", "читал", "письмо", "коллега", "позвонил"], status: "correct"}], feedback: "The correct order is *Когда я читал письмо, коллега позвонил*."}
  ru.b1.unit40.lesson01.exercise06.write_background_event:
    instruction: "Write exactly this past sentence with Когда: When I was reading the email, a colleague called."
    accepted_answers:
      - {value: "Когда я читал письмо, коллега позвонил.", status: "correct"}
      - {value: "Когда я читал письмо коллега позвонил.", status: "correct"}
      - {value: "Когда я читал письмо, коллега позвонил", status: "correct"}
      - {value: "Когда я читал письмо коллега позвонил", status: "correct"}
      - {value: "Когда я читала письмо, коллега позвонил.", status: "correct"}
      - {value: "Когда я читал письмо, коллега позвонила.", status: "correct"}
      - {value: "Когда я читала письмо, коллега позвонила.", status: "correct"}
    feedback: "The model answer is *Когда я читал письмо, коллега позвонил*."
  ru.b1.unit40.lesson02.exercise01.recognize_chital_aspect: {instruction: "Which Russian form means \"was reading\" or \"read for a while\"?", correct_option: "читал", distractors: ["позвонил", "открыл", "сказал"], accepted_answers: [{value: "читал", status: "correct"}], feedback: "*читал* is used for the background process."}
  ru.b1.unit40.lesson02.exercise02.recognize_pozvonil_aspect: {instruction: "Which Russian form means a completed call event?", correct_option: "позвонил", distractors: ["читал", "работал", "ждал"], accepted_answers: [{value: "позвонил", status: "correct"}], feedback: "*позвонил* is the completed event form."}
  ru.b1.unit40.lesson02.exercise03.listen_select_reported_speech: {instruction: "Listen. What did he say?", correct_option: "That the meeting had already started.", distractors: ["That the email was still in progress.", "That the report was ready.", "That a colleague called."], accepted_answers: [{value: "That the meeting had already started.", status: "correct"}], feedback: "The recording says *он сказал, что встреча уже началась*."}
  ru.b1.unit40.lesson02.exercise04.match_aspect_sequence:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "читал", right: "was reading"}
          - {left: "позвонил", right: "called"}
          - {left: "процесс", right: "process"}
          - {left: "событие", right: "event"}
          - {left: "Сначала", right: "first"}
          - {left: "Потом", right: "then"}
        status: "correct"
    feedback: "These items distinguish background process, completed event, and sequence."
  ru.b1.unit40.lesson02.exercise05.order_reported_speech: {instruction: "Put the words in order to say \"Then he said that the meeting had already started.\"", accepted_answers: [{value: ["Потом", "он", "сказал", "что", "встреча", "уже", "началась"], status: "correct"}], feedback: "The correct order is *Потом он сказал, что встреча уже началась*."}
  ru.b1.unit40.lesson02.exercise06.write_reported_speech:
    instruction: "Write exactly this reported-speech sentence with Потом and сказал, что: Then he said that the meeting had already started."
    accepted_answers:
      - {value: "Потом он сказал, что встреча уже началась.", status: "correct"}
      - {value: "Потом он сказал что встреча уже началась.", status: "correct"}
      - {value: "Потом он сказал, что встреча уже началась", status: "correct"}
      - {value: "Потом он сказал что встреча уже началась", status: "correct"}
    feedback: "The model answer is *Потом он сказал, что встреча уже началась*."
  ru.b1.unit40.lesson03.exercise01.choose_complete_narrative: {instruction: "Which answer recounts a past experience with sequence, background action, main event, and reported speech?", correct_option: "Сначала я читал письмо. Когда я читал письмо, коллега позвонил. Потом он сказал, что встреча уже началась. После этого я быстро открыл ссылку.", distractors: ["Я отвечаю за отчёт и проверяю данные.", "Я не согласна с тем, что встреча лишняя, потому что нам нужно обсудить план.", "Если будет время, я проверю адрес и отправлю форму."], accepted_answers: [{value: "Сначала я читал письмо. Когда я читал письмо, коллега позвонил. Потом он сказал, что встреча уже началась. После этого я быстро открыл ссылку.", status: "correct"}], feedback: "The correct answer includes sequencing, background action, main event, and reported speech."}
  ru.b1.unit40.lesson03.exercise02.dialogue_comprehension_narrative:
    instruction: "Listen to the dialogue. What sequence does Dima report?"
    correct_option: "He was reading an email; a colleague called; the colleague said the meeting had started; Dima opened the link"
