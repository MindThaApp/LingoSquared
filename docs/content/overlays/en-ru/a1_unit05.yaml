course:
  title: "Russian A1"
  description: "Learn A1-level Russian for everyday greetings and short social exchanges, with detailed English explanations of the Cyrillic alphabet and the вы/ты formality distinction."

units:
  ru.a1.unit05.time: {title: "What time is it?"}

lessons:
  ru.a1.unit05.lesson01.skolko_seychas_vremeni: {title: "What time is it now"}
  ru.a1.unit05.lesson02.chasti_dnya: {title: "At what time: parts of the day"}
  ru.a1.unit05.lesson03.na_vokzale: {title: "At the train station: when the train leaves"}

teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas: {title: "Который час?", gloss: "What time is it?", note: "The standard way to ask the time, literally \"which hour.\""}
  ru.a1.unit05.lesson01.teach.seychas_chas: {title: "Сейчас час.", gloss: "It is one o'clock now.", note: "\"Час\" alone means \"one o'clock\" -- Russian doesn't say \"один час\" here, unlike the numeral pattern for 2 and up.", example_gloss: "What time is it? -- It's one o'clock."}
  ru.a1.unit05.lesson01.teach.dva_tri_chasa: {title: "два часа, три часа", gloss: "two o'clock, three o'clock", note: "After два and три, час takes the genitive singular form часа, matching the numeral-noun pattern from unit03.", example_gloss: ["It is two o'clock now.", "It is three o'clock now."]}
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov: {title: "пять часов, десять часов", gloss: "five o'clock, ten o'clock", note: "From пять upward, час switches to the genitive plural form часов, again matching unit03's 5-and-up pattern.", example_gloss: ["It is five o'clock now.", "It is ten o'clock now."]}

  ru.a1.unit05.lesson02.teach.v_kotorom_chasu: {title: "В котором часу?", gloss: "At what time?", note: "Used to ask when something happens, as opposed to Который час? which just asks the current time."}
  ru.a1.unit05.lesson02.teach.utrom_dnem: {title: "утром, днём", gloss: "in the morning, in the daytime", note: "These are adverb forms (instrumental case) of утро and день, used without a preposition.", example_gloss: ["In the morning I drink coffee.", "In the daytime I work."]}
  ru.a1.unit05.lesson02.teach.vecherom_nochyu: {title: "вечером, ночью", gloss: "in the evening, at night", note: "Same instrumental adverb pattern as утром/днём.", example_gloss: ["In the evening I am at home.", "At night I sleep."]}
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya: {title: "В два часа дня.", gloss: "At two o'clock in the afternoon.", note: "дня (genitive of день) added after the hour clarifies it's the afternoon two o'clock, not two a.m.", example_gloss: "At what time is the meeting? -- At two o'clock in the afternoon."}
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera: {title: "В семь часов вечера.", gloss: "At seven o'clock in the evening.", note: "вечера (genitive of вечер) clarifies this seven o'clock is in the evening.", example_gloss: "The store closes at seven o'clock in the evening."}

  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta: {title: "Скажите, пожалуйста, который час?", gloss: "Excuse me, could you tell me what time it is?", note: "Скажите, пожалуйста softens the question, appropriate for asking a stranger."}
  ru.a1.unit05.lesson03.teach.kogda_otkhodit: {title: "Когда отходит поезд?", gloss: "When does the train leave?", note: "Отходит (\"departs\") is the standard verb for a train or bus leaving a station."}
  ru.a1.unit05.lesson03.teach.passazhir_vopros: {title: "The passenger asks the time", gloss: "Passenger: Excuse me, could you tell me what time it is?", note: "The passenger opens politely with Скажите, пожалуйста, appropriate for addressing station staff."}
  ru.a1.unit05.lesson03.teach.kassir_sem: {title: "The clerk answers", gloss: "Clerk: It's seven o'clock in the morning.", note: "Сейчас семь часов утра states the current time with утра (\"in the morning\") for clarity."}
  ru.a1.unit05.lesson03.teach.passazhir_kogda: {title: "The passenger asks about the train", gloss: "Passenger: And when does the train leave?", note: "А smoothly introduces the passenger's follow-up question."}
  ru.a1.unit05.lesson03.teach.kassir_vosem: {title: "The clerk gives the departure time", gloss: "Clerk: At eight o'clock in the morning.", note: "В восемь часов утра answers with the preposition в plus the hour and time-of-day word."}

exercises:
  ru.a1.unit05.lesson01.skolko_seychas_vremeni.exercise09.dictation_kotoryy_chas_formal:
    instruction: "Type what you hear."
    correct_option: "Который час"
    accepted_answers: [{value: "Который час", status: correct}]
    orthography_strict: true

  ru.a1.unit05.lesson01.exercise01.recognize_tri_chasa:
    instruction: "Which time is this?"
    correct_option: "три часа"
    distractors: ["час", "два часа", "десять часов"]
    accepted_answers: [{value: "три часа", status: "correct"}]
    feedback: "три часа means \"3 o'clock.\""
  ru.a1.unit05.lesson01.exercise02.recognize_desyat_chasov:
    instruction: "Which time is this?"
    correct_option: "десять часов"
    distractors: ["пять часов", "два часа", "час"]
    accepted_answers: [{value: "десять часов", status: "correct"}]
    feedback: "десять часов means \"10 o'clock.\""
  ru.a1.unit05.lesson01.exercise03.listen_select_time:
    instruction: "Listen to the recording. What is the person asking?"
    correct_option: "Который час?"
    distractors: ["Сколько это стоит?", "Как вас зовут?", "Сколько вам лет?"]
    accepted_answers: [{value: "Который час?", status: "correct"}]
    feedback: "Который час? means \"What time is it?\""
  ru.a1.unit05.lesson01.exercise04.match_hours:
    instruction: "Match each Russian time phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "час", right: "1 o'clock"}
          - {left: "два часа", right: "2 o'clock"}
          - {left: "три часа", right: "3 o'clock"}
          - {left: "пять часов", right: "5 o'clock"}
          - {left: "десять часов", right: "10 o'clock"}
        status: "correct"
    feedback: "час=1 o'clock, два/три часа=2/3 o'clock, пять/десять часов=5/10 o'clock."
  ru.a1.unit05.lesson01.exercise05.order_three_oclock:
    instruction: "Put the words in the correct order to say \"It is 3 o'clock now.\""
    accepted_answers:
      - {value: ["Сейчас", "три", "часа"], status: "correct"}
    feedback: "The correct order is Сейчас три часа."
  ru.a1.unit05.lesson01.exercise06.listen_order_ten_oclock:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Сейчас", "десять", "часов"], status: "correct"}
    feedback: "The correct order is Сейчас десять часов (\"It is 10 o'clock now\")."
  ru.a1.unit05.lesson01.exercise07.complete_time:
    instruction: "Complete the reply: Который час? -- Сейчас ___ часа. (3)"
    accepted_answers:
      - {value: "три", status: "correct"}
      - {value: "Сейчас три часа", status: "correct"}
    feedback: "три means \"3.\""
  ru.a1.unit05.lesson01.exercise08.write_time:
    instruction: "Write a sentence saying it is now 5 o'clock, using \"Сейчас ...\"."
    accepted_answers:
      - {value: "Сейчас пять часов.", status: "correct"}
      - {value: "Сейчас пять часов", status: "correct"}
    feedback: "Сейчас пять часов means \"It is 5 o'clock now.\""

  ru.a1.unit05.lesson02.exercise01.recognize_vecherom:
    instruction: "Which word matches this meaning?"
    correct_option: "вечером"
    distractors: ["утром", "днём", "ночью"]
    accepted_answers: [{value: "вечером", status: "correct"}]
    feedback: "вечером means \"in the evening.\""
  ru.a1.unit05.lesson02.exercise02.recognize_utrom:
    instruction: "Which word matches this meaning?"
    correct_option: "утром"
    distractors: ["днём", "ночью", "вечером"]
    accepted_answers: [{value: "утром", status: "correct"}]
    feedback: "утром means \"in the morning.\""
  ru.a1.unit05.lesson02.exercise03.listen_select_when:
    instruction: "Listen to the recording. What is the person asking?"
    correct_option: "В котором часу?"
    distractors: ["Сколько это стоит?", "Как вас зовут?", "Добрый день!"]
    accepted_answers: [{value: "В котором часу?", status: "correct"}]
    feedback: "В котором часу? means \"At what time?\""
  ru.a1.unit05.lesson02.exercise04.match_parts_of_day:
    instruction: "Match each Russian word to its meaning."
    accepted_answers:
      - value:
          - {left: "утром", right: "in the morning"}
          - {left: "днём", right: "in the daytime"}
          - {left: "вечером", right: "in the evening"}
          - {left: "ночью", right: "at night"}
        status: "correct"
    feedback: "утром=in the morning, днём=in the daytime, вечером=in the evening, ночью=at night."
  ru.a1.unit05.lesson02.exercise05.order_two_pm:
    instruction: "Put the words in the correct order to say \"At two o'clock in the afternoon.\""
    accepted_answers:
      - {value: ["В", "два", "часа", "дня"], status: "correct"}
    feedback: "The correct order is В два часа дня."
  ru.a1.unit05.lesson02.exercise06.listen_order_seven_pm:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["В", "семь", "часов", "вечера"], status: "correct"}
    feedback: "The correct order is В семь часов вечера (\"At seven o'clock in the evening\")."
  ru.a1.unit05.lesson02.exercise07.complete_when:
    instruction: "Complete the sentence: В ___ часа дня. (2)"
    accepted_answers:
      - {value: "два", status: "correct"}
      - {value: "В два часа дня", status: "correct"}
    feedback: "два means \"2.\""
  ru.a1.unit05.lesson02.exercise08.listen_type_evening_time:
    instruction: "Listen and type the sentence you hear."
    accepted_answers:
      - {value: "Сейчас три часа.", status: "correct"}
      - {value: "Сейчас три часа", status: "correct"}
    feedback: "Сейчас три часа means \"It is 3 o'clock now.\""

  ru.a1.unit05.lesson03.exercise01.choose_ask_time_polite:
    instruction: "You want to politely ask a stranger for the time. Which question do you use?"
    correct_option: "Скажите, пожалуйста, который час?"
    distractors: ["Как вас зовут?", "Сколько это стоит?", "Сколько вам лет?"]
    accepted_answers: [{value: "Скажите, пожалуйста, который час?", status: "correct"}]
    feedback: "Скажите, пожалуйста, который час? means \"Excuse me, could you tell me what time it is?\""
  ru.a1.unit05.lesson03.exercise02.listen_select_departure:
    instruction: "Listen and select what time the train leaves."
    correct_option: "Поезд отходит в восемь часов утра."
    distractors: ["Поезд отходит в семь часов вечера.", "Сейчас восемь часов утра.", "В два часа дня."]
    accepted_answers: [{value: "Поезд отходит в восемь часов утра.", status: "correct"}]
    feedback: "The recording says Поезд отходит в восемь часов утра (\"The train leaves at eight o'clock in the morning\")."
  ru.a1.unit05.lesson03.exercise03.dialogue_comprehension_station:
    instruction: "Listen to the dialogue. What time is it now, and when does the train leave?"
    correct_option: "Now: 7am. Train: 8am."
    distractors: ["Now: 8am. Train: 7am.", "Now: 7pm. Train: 8am.", "Now: 7am. Train: 8pm."]
    accepted_answers: [{value: "Now: 7am. Train: 8am.", status: "correct"}]
    feedback: "The clerk says Сейчас семь часов утра, then В восемь часов утра for the train."
  ru.a1.unit05.lesson03.exercise04.match_station_times:
    instruction: "Match each Russian time phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "семь часов утра", right: "7am"}
          - {left: "восемь часов утра", right: "8am"}
          - {left: "три часа", right: "3 o'clock"}
          - {left: "десять часов", right: "10 o'clock"}
          - {left: "два часа дня", right: "2pm"}
          - {left: "семь часов вечера", right: "7pm"}
        status: "correct"
    feedback: "утра=am, вечера/дня=pm forms; семь часов утра=7am, восемь часов утра=8am."
  ru.a1.unit05.lesson03.exercise05.order_eight_am:
    instruction: "Put the words in the correct order to say \"At eight o'clock in the morning.\""
    accepted_answers:
      - {value: ["В", "восемь", "часов", "утра"], status: "correct"}
    feedback: "The correct order is В восемь часов утра."
  ru.a1.unit05.lesson03.exercise06.listen_type_when_train:
    instruction: "Listen and type the question you hear."
    accepted_answers:
      - {value: "Когда отходит поезд?", status: "correct"}
      - {value: "Когда отходит поезд", status: "correct"}
    feedback: "Когда отходит поезд? means \"When does the train leave?\""
  ru.a1.unit05.lesson03.exercise07.reply_when_train:
    instruction: "Someone asks \"Когда отходит поезд?\" Reply that it leaves at eight o'clock in the morning."
    accepted_answers:
      - {value: "В восемь часов утра.", status: "correct"}
      - {value: "В восемь часов утра", status: "correct"}
    feedback: "В восемь часов утра means \"At eight o'clock in the morning.\""
  ru.a1.unit05.lesson03.exercise08.complete_departure:
    instruction: "Complete the sentence: Поезд отходит в ___ часов утра. (8)"
    accepted_answers:
      - {value: "восемь", status: "correct"}
      - {value: "Поезд отходит в восемь часов утра", status: "correct"}
    feedback: "восемь means \"8.\""
  ru.a1.unit05.lesson03.exercise09.write_station_exchange:
    instruction: "Write a short exchange at a train station: ask the time and ask when a train leaves."
    accepted_answers:
      - {value: "Который час? Сейчас семь часов утра. Когда отходит поезд? В восемь часов утра.", status: "correct"}
      - {value: "Скажите, пожалуйста, который час? Когда отходит поезд?", status: "correct"}
      - {value: "Скажите, пожалуйста, который час? А когда отходит поезд?", status: "correct"}
      - {value: "Который час? Когда отходит поезд?", status: "correct"}
      - {value: "Который час? А когда отходит поезд?", status: "correct"}
      - {value: "Скажите, пожалуйста, который час? Сейчас семь часов утра. А когда отходит поезд? В восемь часов утра.", status: "correct"}
    feedback: "A natural station exchange combines a time question with a когда отходит поезд? question."
