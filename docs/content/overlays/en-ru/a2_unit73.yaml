course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Predict what will happen, say what will probably or possibly happen, and make a simple promise."
units:
  ru.a2.unit73.zavtra_budet: {"title": "Tomorrow will be", "description": "Say what you will be doing, predict the weather, and make promises with the imperfective and perfective future."}
lessons:
  ru.a2.unit73.lesson01.budu_delat: {"title": "What I will be doing"}
  ru.a2.unit73.lesson02.pogoda: {"title": "What the weather will be"}
  ru.a2.unit73.lesson03.sdelayu: {"title": "I will do it"}
  ru.a2.unit73.lesson04.kontrast: {"title": "Will be doing or will do"}
  ru.a2.unit73.lesson05.pismo: {"title": "A message from Nastya"}
  ru.a2.unit73.lesson06.dialog: {"title": "A phone talk"}
teaching:
  ru.a2.unit73.lesson01.teach.budu: {"title": "Future of быть: буду, будешь...", "gloss": "I will be / you will be / he will be / we will be / you (plural) will be / they will be", "note": "Together with an infinitive these forms say what you will be doing: *буду работать* = I will be working. They are the imperfective future.", "example_gloss": ["Tomorrow I will be working.", "Will you be reading?", "Dima will be resting at home.", "We will walk in the park.", "They will be waiting."]}
  ru.a2.unit73.lesson01.teach.slova: {"title": "Time words and activities", "gloss": "tomorrow / then / in the evening / read / work / rest / walk / wait / at home / in the park", "note": "*Завтра* and *потом* place the plan in time. The verbs here are infinitives; the form of *буду* carries the person.", "example_gloss": ["Then I will be resting.", "In the evening we will walk in the park.", "Nastya will be waiting at home.", "Tomorrow Dima will be working."]}
  ru.a2.unit73.lesson01.teach.gn_budu: {"title": "Future with буду + infinitive", "gloss": "I will read, you will read, he will read, we will read, you (plural) will read, they will read", "note": "To say what will be going on, take a form of *быть* and add the infinitive. The infinitive never changes: *я буду читать*, *мы будем читать*."}
  ru.a2.unit73.lesson01.teach.gn_ne: {"title": "Negation", "gloss": "Tomorrow I will not work. We will not walk.", "note": "Put *не* before the form of *быть*: *я не буду работать*. The infinitive stays the same."}
  ru.a2.unit73.lesson02.teach.pogoda: {"title": "Weather nouns", "gloss": "weather / rain / snow / wind / sun", "note": "With these nouns *будет* alone means 'there will be': *будет дождь* = there will be rain.", "example_gloss": ["Tomorrow there will be rain.", "On Saturday there will be snow.", "In the evening there will be wind.", "In the morning there will be sun."]}
  ru.a2.unit73.lesson02.teach.nar: {"title": "Weather adverbs", "gloss": "hot / warm / cold / outside / on Sunday", "note": "*Жарко*, *тепло* and *холодно* describe the weather and need no subject: *Завтра будет холодно*.", "example_gloss": ["Tomorrow it will be hot.", "On Sunday it will be warm.", "In the morning it will be cold outside."]}
  ru.a2.unit73.lesson02.teach.veroyat: {"title": "Probably, maybe, for sure", "gloss": "probably / maybe / definitely", "note": "*Наверное* means 'probably'; *может быть* means 'maybe'; *обязательно* means 'definitely'. They usually stand before *будет*, with a comma after them.", "example_gloss": ["Tomorrow it will probably rain.", "Maybe there will be snow.", "On Sunday it will definitely be warm."]}
  ru.a2.unit73.lesson02.teach.gn_pogoda: {"title": "Weather with будет", "gloss": "Tomorrow there will be rain. Tomorrow it will be cold.", "note": "For the weather the verb is always *будет*, with no subject word like 'it'. After it comes a noun (*дождь*) or an adverb (*холодно*)."}
  ru.a2.unit73.lesson02.teach.gn_nav: {"title": "Predicting with наверное and может быть", "gloss": "Probably there will be rain. Maybe there will be snow.", "note": "*Наверное* is a strong guess, *может быть* a weaker one. Both are set off by commas."}
  ru.a2.unit73.lesson03.teach.pf: {"title": "Perfective future: one finished action", "gloss": "I will write / I will call / I will buy / I will do / I will read / I will come", "note": "These verbs are perfective. Their future forms look like a present tense but mean one finished action in the future: *я напишу письмо* = I will write the letter (and finish it).", "example_gloss": ["Tomorrow I will write the letter.", "In the evening I will call you.", "I will buy bread.", "I will come at six o'clock.", "I will read the book through."]}
  ru.a2.unit73.lesson03.teach.pf2: {"title": "Other persons", "gloss": "you will write / he will write / we will write / you (plural) will write / they will write", "note": "The endings are the ones of the present tense. *Напишешь*, *напишет*, *напишем*, *напишете*, *напишут*.", "example_gloss": ["Will you write the letter?", "Dima will write the letter.", "We will call in the evening.", "They will come tomorrow."]}
  ru.a2.unit73.lesson03.teach.gn_pf: {"title": "I will write the letter", "gloss": "I will write, you will write, he will write, we will write, you (plural) will write, they will write", "note": "A perfective verb has no *буду* form. Its future is made by the verb itself: *я напишу, ты напишешь, он напишет, мы напишем, вы напишете, они напишут*."}
  ru.a2.unit73.lesson03.teach.gn_pf_sent: {"title": "Perfective future in a sentence", "gloss": "I will write the letter. We will call in the evening.", "note": "Use the perfective future for one action that will be done and finished, not for something that will go on for a long time."}
  ru.a2.unit73.lesson04.teach.kont: {"title": "Duration and speed", "gloss": "all day / for a long time / at once / everything", "note": "*Весь день* and *долго* go with the imperfective future (a process). *Сразу* goes with the perfective (one finished result).", "example_gloss": ["Tomorrow I will be writing the letter all day.", "I will read for a long time.", "I will write the letter right away.", "I will do everything."]}
  ru.a2.unit73.lesson04.teach.obesh: {"title": "Promising", "gloss": "I promise / definitely / do not worry / OK", "note": "To promise, use the perfective future: *Я позвоню*. *Обещаю* and *обязательно* make the promise stronger.", "example_gloss": ["I promise, I will come.", "Do not worry, I will do everything.", "OK, I will buy bread.", "I will be writing for a long time."]}
  ru.a2.unit73.lesson04.teach.gn_kontrast: {"title": "Process or result", "gloss": "Tomorrow I will be writing a letter. Tomorrow I will write the letter.", "note": "*Буду писать* = the action will be in progress (all day, for a long time). *Напишу* = the action will be completed. Choose by what you mean."}
  ru.a2.unit73.lesson04.teach.gn_obesh: {"title": "Promises", "gloss": "I will definitely call. I promise, I will come.", "note": "A promise is a decision to finish something, so it takes the perfective future: *позвоню*, *приду*, *куплю*. *Обещаю* can open the sentence."}
  ru.a2.unit73.lesson05.teach.slova5: {"title": "Words for the message", "gloss": "notebooks / check / morning / hi / bye", "note": "*Проверять тетради* means to check students' notebooks. *Привет* and *пока* are informal.", "example_gloss": ["In the morning I will be checking notebooks.", "Hi, Dima!", "Bye, Nastya!"]}
  ru.a2.unit73.lesson05.teach.reading: {"title": "Nastya writes to Dima", "gloss": "Hi, Dima! Tomorrow it will probably be rainy and cold. In the morning I will be checking notebooks, and then I will be reading at home. In the evening I will definitely call you. I promise! Nastya", "note": "The message mixes a prediction (*наверное, будет*), plans in progress (*буду проверять*, *буду читать*) and a promise (*позвоню*).", "glosses": {"тетради": "notebooks", "проверять": "to check", "обещаю": "I promise"}}
  ru.a2.unit73.lesson06.teach.q: {"title": "Dima asks about the weather", "gloss": "Dima: Nastya, what will the weather be like tomorrow?"}
  ru.a2.unit73.lesson06.teach.a: {"title": "Nastya predicts", "gloss": "Nastya: It will probably be rainy and cold."}
  ru.a2.unit73.lesson06.teach.plan: {"title": "Dima plans his day", "gloss": "Dima: Then I will be working at home. And what will you be doing?"}
  ru.a2.unit73.lesson06.teach.plan2: {"title": "Nastya's plans and promise", "gloss": "Nastya: In the morning I will be checking notebooks, and then I will be reading. In the evening I will definitely call you."}
  ru.a2.unit73.lesson06.teach.ok: {"title": "Dima agrees", "gloss": "Dima: OK. I will be waiting."}
  ru.a2.unit73.lesson06.teach.prom: {"title": "Nastya promises", "gloss": "Nastya: I promise!"}
exercises:
  ru.a2.unit73.lesson01.exercise01.buduet: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Завтра Дима будет работать.", "distractors": ["Завтра Дима буду работать.", "Завтра Дима будут работать.", "Завтра Дима будешь работать."], "accepted_answers": [{"value": "Завтра Дима будет работать.", "status": "correct"}], "feedback": "*Дима* is *он*, so *будет*: *Дима будет работать*."}
  ru.a2.unit73.lesson01.exercise02.gulyat: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мы будем гулять в парке.", "distractors": ["Мы будет гулять в парке.", "Мы будут гулять в парке.", "Мы будешь гулять в парке."], "accepted_answers": [{"value": "Мы будем гулять в парке.", "status": "correct"}], "feedback": "*Мы* goes with *будем*."}
  ru.a2.unit73.lesson01.exercise03.forms: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "я буду", "right": "I will be"}, {"left": "ты будешь", "right": "you will be (to one friend)"}, {"left": "он будет", "right": "he will be"}, {"left": "мы будем", "right": "we will be"}, {"left": "вы будете", "right": "you will be (formal or plural)"}, {"left": "они будут", "right": "they will be"}], "status": "correct"}], "feedback": "Each person has its own form of *быть*."}
  ru.a2.unit73.lesson01.exercise04.vecherom: {"instruction": "Put the words in order to say 'In the evening we will walk in the park.'", "correct_option": "Вечером мы будем гулять в парке", "accepted_answers": [{"value": "Вечером мы будем гулять в парке", "status": "correct"}, {"value": "Мы будем гулять в парке вечером", "status": "correct"}, {"value": "Мы вечером будем гулять в парке", "status": "correct"}], "feedback": "*Будем* agrees with *мы*; the time word can open the sentence or come at the end."}
  ru.a2.unit73.lesson01.exercise05.blank_budu: {"instruction": "Complete the sentence: 'Tomorrow I will be working.'", "correct_option": "буду", "accepted_answers": [{"value": "буду", "status": "correct"}], "feedback": "*Я* goes with *буду*."}
  ru.a2.unit73.lesson01.exercise06.otdyhat: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Потом ты будешь отдыхать дома.", "status": "correct"}, {"value": "Потом ты будешь отдыхать дома", "status": "correct"}, {"value": "Ты потом будешь отдыхать дома.", "status": "correct"}, {"value": "Ты потом будешь отдыхать дома", "status": "correct"}, {"value": "Ты будешь отдыхать дома потом.", "status": "correct"}, {"value": "Ты будешь отдыхать дома потом", "status": "correct"}, {"value": "Потом будешь отдыхать дома.", "status": "correct"}, {"value": "Потом будешь отдыхать дома", "status": "correct"}], "feedback": "*Ты* goes with *будешь*."}
  ru.a2.unit73.lesson01.exercise07.zavtra_mu: {"instruction": "Write the requested Russian sentence.", "correct_option": "Завтра мы будем работать.", "accepted_answers": [{"value": "Завтра мы будем работать.", "status": "correct"}, {"value": "Завтра мы будем работать", "status": "correct"}, {"value": "Мы завтра будем работать.", "status": "correct"}, {"value": "Мы завтра будем работать", "status": "correct"}, {"value": "Мы будем работать завтра.", "status": "correct"}, {"value": "Мы будем работать завтра", "status": "correct"}], "feedback": "*Мы* + *будем* + infinitive."}
  ru.a2.unit73.lesson02.exercise01.dozhd: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Завтра будет дождь.", "distractors": ["Завтра будет снег.", "Завтра будет ветер.", "Завтра буду дождь."], "accepted_answers": [{"value": "Завтра будет дождь.", "status": "correct"}], "feedback": "*Дождь* is rain; *будет* is used for the weather."}
  ru.a2.unit73.lesson02.exercise02.teplo: {"instruction": "Choose the correct English meaning.", "correct_option": "In the evening it will be warm outside.", "distractors": ["In the morning it will be cold outside.", "In the evening it will be hot outside.", "In the evening there will be rain outside."], "accepted_answers": [{"value": "In the evening it will be warm outside.", "status": "correct"}], "feedback": "*Вечером* = in the evening; *тепло* = warm."}
  ru.a2.unit73.lesson02.exercise03.pog: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "погода", "right": "weather"}, {"left": "дождь", "right": "rain"}, {"left": "снег", "right": "snow"}, {"left": "ветер", "right": "wind"}, {"left": "солнце", "right": "sun"}, {"left": "жарко", "right": "hot"}, {"left": "холодно", "right": "cold"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit73.lesson02.exercise04.naver: {"instruction": "Put the words in order to say 'Tomorrow it will probably rain.'", "correct_option": "Наверное завтра будет дождь", "accepted_answers": [{"value": "Наверное завтра будет дождь", "status": "correct"}, {"value": "Завтра наверное будет дождь", "status": "correct"}, {"value": "Завтра будет дождь наверное", "status": "correct"}], "feedback": "*Наверное* can open the sentence or follow *завтра*."}
  ru.a2.unit73.lesson02.exercise05.blank_holod: {"instruction": "Complete the sentence: 'Tomorrow it will be cold outside.'", "correct_option": "холодно", "accepted_answers": [{"value": "холодно", "status": "correct"}], "feedback": "*Холодно* = cold."}
  ru.a2.unit73.lesson02.exercise06.mozhet: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Может быть, в субботу будет снег.", "status": "correct"}, {"value": "Может быть, в субботу будет снег", "status": "correct"}, {"value": "Может быть в субботу будет снег.", "status": "correct"}, {"value": "Может быть в субботу будет снег", "status": "correct"}, {"value": "В субботу, может быть, будет снег.", "status": "correct"}, {"value": "В субботу, может быть, будет снег", "status": "correct"}, {"value": "В субботу может быть будет снег.", "status": "correct"}, {"value": "В субботу может быть будет снег", "status": "correct"}, {"value": "Может быть, будет снег в субботу.", "status": "correct"}, {"value": "Может быть, будет снег в субботу", "status": "correct"}, {"value": "Может быть будет снег в субботу.", "status": "correct"}, {"value": "Может быть будет снег в субботу", "status": "correct"}, {"value": "В субботу будет снег, может быть.", "status": "correct"}, {"value": "В субботу будет снег, может быть", "status": "correct"}, {"value": "В субботу будет снег может быть.", "status": "correct"}, {"value": "В субботу будет снег может быть", "status": "correct"}], "feedback": "*Может быть* is set off by commas."}
  ru.a2.unit73.lesson02.exercise07.zhar: {"instruction": "Write the requested Russian sentence.", "correct_option": "Завтра, наверное, будет жарко.", "accepted_answers": [{"value": "Завтра, наверное, будет жарко.", "status": "correct"}, {"value": "Завтра, наверное, будет жарко", "status": "correct"}, {"value": "Завтра наверное будет жарко.", "status": "correct"}, {"value": "Завтра наверное будет жарко", "status": "correct"}, {"value": "Наверное, завтра будет жарко.", "status": "correct"}, {"value": "Наверное, завтра будет жарко", "status": "correct"}, {"value": "Наверное завтра будет жарко.", "status": "correct"}, {"value": "Наверное завтра будет жарко", "status": "correct"}, {"value": "Завтра будет жарко, наверное.", "status": "correct"}, {"value": "Завтра будет жарко, наверное", "status": "correct"}, {"value": "Завтра будет жарко наверное.", "status": "correct"}, {"value": "Завтра будет жарко наверное", "status": "correct"}], "feedback": "*Наверное* means 'probably'."}
  ru.a2.unit73.lesson03.exercise01.napishu: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Завтра я напишу письмо.", "distractors": ["Завтра я напишешь письмо.", "Завтра я напишем письмо.", "Завтра я напишут письмо."], "accepted_answers": [{"value": "Завтра я напишу письмо.", "status": "correct"}], "feedback": "*Я* goes with *напишу*."}
  ru.a2.unit73.lesson03.exercise02.pozvonyu: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Вечером я позвоню тебе.", "distractors": ["Вечером я позвонит тебе.", "Вечером я позвонишь тебе.", "Вечером я позвоним тебе."], "accepted_answers": [{"value": "Вечером я позвоню тебе.", "status": "correct"}], "feedback": "*Я* goes with *позвоню*."}
  ru.a2.unit73.lesson03.exercise03.pf3: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "я напишу", "right": "I will write it"}, {"left": "я позвоню", "right": "I will call"}, {"left": "я куплю", "right": "I will buy"}, {"left": "я сделаю", "right": "I will do it"}, {"left": "я прочитаю", "right": "I will read it through"}, {"left": "я приду", "right": "I will come"}], "status": "correct"}], "feedback": "All six are perfective future forms."}
  ru.a2.unit73.lesson03.exercise04.hleb: {"instruction": "Put the words in order to say 'In the evening I will buy bread.'", "correct_option": "Вечером я куплю хлеб", "accepted_answers": [{"value": "Вечером я куплю хлеб", "status": "correct"}, {"value": "Я куплю хлеб вечером", "status": "correct"}, {"value": "Я вечером куплю хлеб", "status": "correct"}], "feedback": "*Куплю* is the perfective future of *покупать*'s partner *купить*."}
  ru.a2.unit73.lesson03.exercise05.blank_nap: {"instruction": "Complete the sentence: 'Tomorrow I will write the letter.'", "correct_option": "напишу", "accepted_answers": [{"value": "напишу", "status": "correct"}], "feedback": "*Я* + perfective: *напишу*."}
  ru.a2.unit73.lesson03.exercise06.zvon: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Вечером я позвоню тебе.", "status": "correct"}, {"value": "Вечером я позвоню тебе", "status": "correct"}, {"value": "Я позвоню тебе вечером.", "status": "correct"}, {"value": "Я позвоню тебе вечером", "status": "correct"}, {"value": "Я вечером позвоню тебе.", "status": "correct"}, {"value": "Я вечером позвоню тебе", "status": "correct"}, {"value": "Вечером позвоню тебе.", "status": "correct"}, {"value": "Вечером позвоню тебе", "status": "correct"}], "feedback": "*Позвоню* is a single finished call."}
  ru.a2.unit73.lesson03.exercise07.kupl: {"instruction": "Write the requested Russian sentence.", "correct_option": "Завтра я куплю хлеб.", "accepted_answers": [{"value": "Завтра я куплю хлеб.", "status": "correct"}, {"value": "Завтра я куплю хлеб", "status": "correct"}, {"value": "Я завтра куплю хлеб.", "status": "correct"}, {"value": "Я завтра куплю хлеб", "status": "correct"}, {"value": "Я куплю хлеб завтра.", "status": "correct"}, {"value": "Я куплю хлеб завтра", "status": "correct"}], "feedback": "*Куплю хлеб* — one finished purchase."}
  ru.a2.unit73.lesson04.exercise01.vesden: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Завтра я буду писать письмо весь день.", "distractors": ["Завтра я напишу письмо весь день.", "Завтра я писать письмо весь день.", "Завтра ты буду писать письмо весь день."], "accepted_answers": [{"value": "Завтра я буду писать письмо весь день.", "status": "correct"}], "feedback": "*Весь день* describes a process, so *буду писать*."}
  ru.a2.unit73.lesson04.exercise02.obyaz: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Я обязательно позвоню тебе вечером.", "distractors": ["Я обязательно позвонить тебе вечером.", "Я обязательно позвонишь тебе вечером.", "Я обязательно позвоню ты вечером."], "accepted_answers": [{"value": "Я обязательно позвоню тебе вечером.", "status": "correct"}], "feedback": "A promise uses the perfective future: *позвоню*."}
  ru.a2.unit73.lesson04.exercise03.kont2: {"instruction": "Match each Russian form to its English meaning.", "accepted_answers": [{"value": [{"left": "буду читать", "right": "I will be reading"}, {"left": "прочитаю", "right": "I will read it through"}, {"left": "буду делать", "right": "I will be doing"}, {"left": "сделаю", "right": "I will do it (and finish)"}, {"left": "буду звонить", "right": "I will be making calls"}, {"left": "позвоню", "right": "I will call once"}], "status": "correct"}], "feedback": "Imperfective = in progress; perfective = finished."}
