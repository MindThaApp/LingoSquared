  ru.a2.unit77.lesson04.exercise03.w4: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "Хороший совет!", "right": "Good advice!"}, {"left": "Спасибо за совет.", "right": "Thank you for the advice."}, {"left": "Я попробую.", "right": "I will try."}, {"left": "А что ещё?", "right": "And what else?"}, {"left": "Я плохо сплю.", "right": "I sleep badly."}, {"left": "Я много трачу.", "right": "I spend a lot."}], "status": "correct"}], "feedback": "These phrases are used with advice."}
