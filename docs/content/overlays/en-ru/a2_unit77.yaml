  ru.a2.unit77.lesson03.exercise07.gul2: {"instruction": "Write the requested Russian sentence.", "correct_option": "Советую тебе больше гулять.", "accepted_answers": [{"value": "Советую тебе больше гулять.", "status": "correct"}, {"value": "Советую тебе больше гулять", "status": "correct"}, {"value": "Я советую тебе больше гулять.", "status": "correct"}, {"value": "Я советую тебе больше гулять", "status": "correct"}, {"value": "Советую тебе гулять больше.", "status": "correct"}, {"value": "Советую тебе гулять больше", "status": "correct"}, {"value": "Я советую тебе гулять больше.", "status": "correct"}, {"value": "Я советую тебе гулять больше", "status": "correct"}], "feedback": "*Советую тебе* + infinitive."}
  ru.a2.unit77.lesson04.exercise01.thx: {"instruction": "Choose the correct English meaning.", "correct_option": "Thank you for the advice. I will try.", "distractors": ["Thank you for the help. I will wait.", "Thank you for the book. I will read.", "Good advice. I cannot."], "accepted_answers": [{"value": "Thank you for the advice. I will try.", "status": "correct"}], "feedback": "*Спасибо за совет* thanks for advice."}
