  ru.a2.unit77.lesson03.exercise01.lozh: {"instruction": "Choose the correct English meaning.", "correct_option": "I advise you to go to bed earlier.", "distractors": ["I advise you to sleep later.", "You advise me to go to bed earlier.", "I do not advise you to go to bed."], "accepted_answers": [{"value": "I advise you to go to bed earlier.", "status": "correct"}], "feedback": "*Советую тебе* = I advise you."}
