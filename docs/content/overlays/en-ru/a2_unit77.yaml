  ru.a2.unit77.lesson04.exercise06.chto: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Хороший совет! А что ещё?", "status": "correct"}, {"value": "Хороший совет! А что ещё", "status": "correct"}, {"value": "Хороший совет. А что ещё?", "status": "correct"}, {"value": "Хороший совет. А что ещё", "status": "correct"}, {"value": "Хороший совет! Что ещё?", "status": "correct"}, {"value": "Хороший совет! Что ещё", "status": "correct"}, {"value": "Хороший совет. Что ещё?", "status": "correct"}, {"value": "Хороший совет. Что ещё", "status": "correct"}], "feedback": "A reply and a request for more."}
  ru.a2.unit77.lesson04.exercise07.w4b: {"instruction": "Write the requested Russian sentences.", "correct_option": "Я плохо сплю. Спасибо за совет.", "accepted_answers": [{"value": "Я плохо сплю. Спасибо за совет.", "status": "correct"}, {"value": "Я плохо сплю. Спасибо за совет", "status": "correct"}, {"value": "Я плохо сплю. Большое спасибо за совет.", "status": "correct"}, {"value": "Я плохо сплю. Большое спасибо за совет", "status": "correct"}, {"value": "Плохо сплю. Спасибо за совет.", "status": "correct"}, {"value": "Плохо сплю. Спасибо за совет", "status": "correct"}, {"value": "Плохо сплю. Большое спасибо за совет.", "status": "correct"}, {"value": "Плохо сплю. Большое спасибо за совет", "status": "correct"}], "feedback": "A problem, then thanks."}
