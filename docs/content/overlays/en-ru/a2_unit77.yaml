course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Give and respond to simple advice about a problem such as health, study or money."
units:
  ru.a2.unit77.luchshe_stoit: {"title": "You had better", "description": "Give and answer simple advice with лучше, стоит and советую."}
lessons:
  ru.a2.unit77.lesson01.luchshe: {"title": "You had better"}
  ru.a2.unit77.lesson02.stoit: {"title": "You should"}
  ru.a2.unit77.lesson03.sovetuyu: {"title": "I advise"}
  ru.a2.unit77.lesson04.otvet: {"title": "Thank you for the advice"}
  ru.a2.unit77.lesson05.pismo: {"title": "Nastya's advice"}
  ru.a2.unit77.lesson06.dialog: {"title": "Dima asks for advice"}
teaching:
  ru.a2.unit77.lesson01.teach.probl: {"title": "A health problem", "gloss": "head / hurts / badly / I sleep / you sleep", "note": "*У меня болит голова* = I have a headache (literally 'at me the head hurts'). *Плохо* means 'badly'.", "example_gloss": ["I have a headache.", "I sleep badly.", "Do you sleep badly?"]}
  ru.a2.unit77.lesson01.teach.luchshe: {"title": "лучше + infinitive", "gloss": "better / rest / lie down / sleep / go home", "note": "*Лучше* means 'better'. *Тебе лучше отдохнуть* = you had better rest.", "example_gloss": ["You had better rest.", "You had better lie down and sleep.", "You had better go home."]}
  ru.a2.unit77.lesson01.teach.gn_luchshe: {"title": "Advice with лучше", "gloss": "You had better rest. You had better go home.", "note": "Put the person in the dative, then *лучше* and an infinitive: *тебе лучше отдохнуть*. It is advice, softer than *нужно*."}
  ru.a2.unit77.lesson01.teach.gn_ne: {"title": "Лучше не", "gloss": "You had better not work in the evening.", "note": "*Лучше не* + an imperfective infinitive says what to avoid: *тебе лучше не работать*."}
  ru.a2.unit77.lesson02.teach.stoit: {"title": "стоит + infinitive", "gloss": "it is worth / more / less / walk / learn / words", "note": "*Стоит* with an infinitive means 'it is worth doing'. *Больше* and *меньше* mean 'more' and 'less'.", "example_gloss": ["You should walk more.", "You should work less.", "You should learn words every day."]}
  ru.a2.unit77.lesson02.teach.vrach: {"title": "Doctor and money", "gloss": "doctor / to the doctor / spend", "note": "*К врачу* is 'to the doctor' (*к* + dative). *Тратить* is 'to spend' money.", "example_gloss": ["You should go to the doctor.", "I spend a lot.", "The doctor works here."]}
  ru.a2.unit77.lesson02.teach.gn_stoit: {"title": "Advice with стоит", "gloss": "You should go to the doctor. You should walk more.", "note": "*Тебе стоит* + infinitive is a friendly suggestion: it is worth doing. Use *вам стоит* to a stranger."}
  ru.a2.unit77.lesson02.teach.gn_more: {"title": "Больше and меньше", "gloss": "Walk more. Work less.", "note": "*Больше* and *меньше* come before the verb: *больше гулять*, *меньше работать*."}
  ru.a2.unit77.lesson03.teach.sovet: {"title": "Advising", "gloss": "I advise / advice / good / coffee", "note": "*Советую* means 'I advise'. *Совет* is the noun 'advice'.", "example_gloss": ["I advise you to go to bed earlier.", "That is good advice.", "I advise you to drink less coffee."]}
  ru.a2.unit77.lesson03.teach.gn_sovetuyu: {"title": "Советую + dative + infinitive", "gloss": "I advise you to go to bed earlier.", "note": "*Советую* is followed by the person in the dative (*тебе*, *вам*) and an imperfective infinitive for general advice: *ложиться спать*."}
  ru.a2.unit77.lesson03.teach.gn_ne_sov: {"title": "Не советую", "gloss": "I do not advise you to drink coffee in the evening.", "note": "*Не советую* + imperfective infinitive warns against something."}
  ru.a2.unit77.lesson04.teach.otvet: {"title": "Responding to advice", "gloss": "thank you for the advice / I will try / what else?", "note": "*За совет* is 'for the advice' (*за* + accusative). *Попробую* is the perfective future of *пробовать*.", "example_gloss": ["Thank you for the advice.", "I will try.", "And what else?", "I spend a lot.", "I learn words badly."]}
  ru.a2.unit77.lesson04.teach.gn_otvet: {"title": "Replying to advice", "gloss": "Good advice. Thank you for the advice. I will try.", "note": "Reply with *Хороший совет*, *Спасибо за совет* or *Я попробую*. To ask for more, say *А что ещё?*."}
  ru.a2.unit77.lesson04.teach.gn_pair: {"title": "Problem and advice", "gloss": "I sleep badly. You had better go to bed earlier.", "note": "A problem is often followed by advice with *лучше*, *стоит* or *советую*."}
  ru.a2.unit77.lesson05.teach.v5: {"title": "Words for the message", "gloss": "you / you have (lit. at you) / in the park / hi / bye", "note": "The message gives three pieces of advice.", "example_gloss": ["You have a headache.", "You should walk in the park.", "Hi, Dima!", "Bye, Nastya!"]}
  ru.a2.unit77.lesson05.teach.reading: {"title": "Nastya writes to Dima", "gloss": "Hi, Dima! You sleep badly and you have a headache. You had better work less in the evening. You should walk more in the park. I advise you to go to bed earlier and not drink coffee in the evening. Bye! Nastya", "note": "The message uses all three patterns: *лучше*, *стоит* and *советую*.", "glosses": {"парке": "park (prepositional case)", "советую": "I advise", "вечером": "in the evening"}}
  ru.a2.unit77.lesson06.teach.q: {"title": "Dima describes the problem", "gloss": "Dima: Nastya, I have a headache and I sleep badly."}
  ru.a2.unit77.lesson06.teach.a: {"title": "Nastya's first advice", "gloss": "Nastya: You had better work less in the evening."}
  ru.a2.unit77.lesson06.teach.q2: {"title": "Dima asks for more", "gloss": "Dima: Good advice. And what else?"}
  ru.a2.unit77.lesson06.teach.a2: {"title": "Nastya gives more advice", "gloss": "Nastya: You should walk more. And I advise you to go to bed earlier."}
  ru.a2.unit77.lesson06.teach.end: {"title": "Dima thanks her", "gloss": "Dima: Thank you for the advice. I will try."}
exercises:
  ru.a2.unit77.lesson01.exercise01.rest: {"instruction": "Choose the correct English meaning.", "correct_option": "You had better rest.", "distractors": ["You may not rest.", "You do not need to rest.", "You are resting."], "accepted_answers": [{"value": "You had better rest.", "status": "correct"}], "feedback": "*Лучше* + infinitive gives advice."}
  ru.a2.unit77.lesson01.exercise02.golova: {"instruction": "Choose the correct Russian sentence.", "correct_option": "У меня болит голова.", "distractors": ["Меня болит голова.", "Я болит голова.", "У мне болит голова."], "accepted_answers": [{"value": "У меня болит голова.", "status": "correct"}], "feedback": "*У меня* shows who has the problem."}
  ru.a2.unit77.lesson01.exercise03.w1: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "лучше", "right": "better, had better"}, {"left": "отдохнуть", "right": "to rest"}, {"left": "спать", "right": "to sleep"}, {"left": "голова", "right": "head"}, {"left": "болит", "right": "hurts"}, {"left": "плохо", "right": "badly"}, {"left": "дома", "right": "at home"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit77.lesson01.exercise04.domoy: {"instruction": "Put the words in order to say 'You had better go home.'", "correct_option": "Тебе лучше идти домой", "accepted_answers": [{"value": "Тебе лучше идти домой", "status": "correct"}, {"value": "Лучше тебе идти домой", "status": "correct"}], "feedback": "*Лучше* + infinitive."}
  ru.a2.unit77.lesson01.exercise05.blank_luchshe: {"instruction": "Complete the sentence with the Russian word for 'better': 'You had better rest.'", "correct_option": "лучше", "accepted_answers": [{"value": "лучше", "status": "correct"}], "feedback": "*Лучше* gives advice."}
  ru.a2.unit77.lesson01.exercise06.two: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "У меня болит голова, и я плохо сплю.", "status": "correct"}, {"value": "У меня болит голова, и я плохо сплю", "status": "correct"}, {"value": "У меня болит голова и я плохо сплю.", "status": "correct"}, {"value": "У меня болит голова и я плохо сплю", "status": "correct"}, {"value": "Я плохо сплю, и у меня болит голова.", "status": "correct"}, {"value": "Я плохо сплю, и у меня болит голова", "status": "correct"}, {"value": "Я плохо сплю и у меня болит голова.", "status": "correct"}, {"value": "Я плохо сплю и у меня болит голова", "status": "correct"}], "feedback": "A problem and its second part."}
  ru.a2.unit77.lesson01.exercise07.ne_rab: {"instruction": "Write the requested Russian sentence.", "correct_option": "Тебе лучше не работать вечером.", "accepted_answers": [{"value": "Тебе лучше не работать вечером.", "status": "correct"}, {"value": "Тебе лучше не работать вечером", "status": "correct"}, {"value": "Вечером тебе лучше не работать.", "status": "correct"}, {"value": "Вечером тебе лучше не работать", "status": "correct"}, {"value": "Тебе лучше вечером не работать.", "status": "correct"}, {"value": "Тебе лучше вечером не работать", "status": "correct"}, {"value": "Лучше тебе не работать вечером.", "status": "correct"}, {"value": "Лучше тебе не работать вечером", "status": "correct"}], "feedback": "*Лучше не* + imperfective infinitive."}
  ru.a2.unit77.lesson02.exercise01.vrach: {"instruction": "Choose the correct English meaning.", "correct_option": "You should go to the doctor.", "distractors": ["You went to the doctor.", "You cannot go to the doctor.", "You do not need to go to the doctor."], "accepted_answers": [{"value": "You should go to the doctor.", "status": "correct"}], "feedback": "*Стоит* + infinitive is a suggestion."}
  ru.a2.unit77.lesson02.exercise02.bolshe: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Тебе стоит больше гулять.", "distractors": ["Тебе стоит меньше гулять.", "Ты стоит больше гулять.", "Тебя стоит больше гулять."], "accepted_answers": [{"value": "Тебе стоит больше гулять.", "status": "correct"}], "feedback": "The person is in the dative: *тебе*."}
  ru.a2.unit77.lesson02.exercise03.w2: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "больше", "right": "more"}, {"left": "меньше", "right": "less"}, {"left": "стоит", "right": "it is worth"}, {"left": "учить", "right": "to learn"}, {"left": "слова", "right": "words"}, {"left": "врач", "right": "doctor"}, {"left": "гулять", "right": "to walk"}], "status": "correct"}], "feedback": "These words are used for suggestions."}
