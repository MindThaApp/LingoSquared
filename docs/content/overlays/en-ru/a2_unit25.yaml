schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.a2.unit25"
source_language: "en"
target_language: "ru"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "codex", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Codex-authored draft. Needs fresh-context review."}

course:
  title: "Russian A2"
  description: "Learn A2-level Russian for registering with local authorities."

units:
  ru.a2.unit25.dokumenty: {title: "Registration"}

lessons:
  ru.a2.unit25.lesson01.dokumenty: {title: "Which documents are needed?"}
  ru.a2.unit25.lesson02.adres_i_vopros: {title: "New address"}
  ru.a2.unit25.lesson03.v_mfts: {title: "Dialogue: at the registration office"}

teaching:
  ru.a2.unit25.lesson01.teach.registratsiya: {title: "регистрация", gloss: "registration", note: "*Зарегистрироваться* means to register yourself; English speakers often forget the reflexive idea.", example_gloss: "I want to register."}
  ru.a2.unit25.lesson01.teach.pasport: {title: "паспорт", gloss: "passport", note: "*паспорт* is the core ID document in this scenario.", example_gloss: "I have a passport."}
  ru.a2.unit25.lesson01.teach.zayavlenie: {title: "заявление", gloss: "application form", note: "*заявление* is a written application or form, not a spoken statement here.", example_gloss: "An application form is needed."}
  ru.a2.unit25.lesson01.teach.dogovor_arendy: {title: "договор аренды", gloss: "rental contract", note: "*аренды* is genitive: literally contract of rent/lease.", example_gloss: "The rental contract is at my home."}
  ru.a2.unit25.lesson02.teach.novyy_adres: {title: "по новому адресу", gloss: "at the new address", note: "Russian uses *по ... адресу* for being registered at an address.", example_gloss: "I live at the new address."}
  ru.a2.unit25.lesson02.teach.kopiya: {title: "копия", gloss: "copy", note: "*копия паспорта* uses genitive: copy of the passport.", example_gloss: "A copy of the passport is needed."}
  ru.a2.unit25.lesson02.teach.skazhite_pozhaluysta: {title: "Скажите, пожалуйста.", gloss: "Please tell me.", note: "*Скажите* is the formal/polite command for asking an official to tell you something.", example_gloss: "Please tell me, is a copy needed?"}
  ru.a2.unit25.lesson02.teach.prihodite: {title: "приходите", gloss: "come", note: "*Приходите* is formal or plural; it fits an official speaking to a visitor.", example_gloss: "Come tomorrow at ten."}
  ru.a2.unit25.lesson03.teach.sotrudnik_na_registratsiyu: {title: "The official asks the purpose", gloss: "Official: Hello. Are you here for registration?", note: "Formal *вы* marks the official setting."}
  ru.a2.unit25.lesson03.teach.dima_hochu: {title: "Dima states his goal", gloss: "Dima: Yes, I want to register at the new address.", note: "Dima stays formal and direct."}
  ru.a2.unit25.lesson03.teach.sotrudnik_dokumenty: {title: "The official lists documents", gloss: "Official: A passport, application form, and rental contract are needed.", note: "The list gives the required documents."}
  ru.a2.unit25.lesson03.teach.dima_kopiya: {title: "Dima asks a clarifying question", gloss: "Dima: Please tell me, is a passport copy needed?", note: "This delivers the clarification part of the outcome."}
  ru.a2.unit25.lesson03.teach.sotrudnik_zavtra: {title: "The official confirms timing", gloss: "Official: Yes, a copy is needed too. Come tomorrow at ten.", note: "The official gives both a requirement and a time."}

exercises:
  ru.a2.unit25.lesson01.exercise01.recognize_pasport:
    instruction: "Which word means \"passport\"?"
    correct_option: "паспорт"
    distractors: ["заявление", "адрес", "копия"]
    accepted_answers: [{value: "паспорт", status: "correct"}]
    feedback: "*паспорт* means \"passport.\""
  ru.a2.unit25.lesson01.exercise02.recognize_zayavlenie:
    instruction: "Which word means \"application form\"?"
    correct_option: "заявление"
    distractors: ["паспорт", "договор", "адрес"]
    accepted_answers: [{value: "заявление", status: "correct"}]
    feedback: "*заявление* means an application form here."
  ru.a2.unit25.lesson01.exercise03.listen_select_nuzhen_pasport:
    instruction: "Listen. Which document is required?"
    correct_option: "Passport."
    distractors: ["Application form.", "Rental contract.", "Address."]
    accepted_answers: [{value: "Passport.", status: "correct"}]
    feedback: "The recording says *Нужен паспорт*."
  ru.a2.unit25.lesson01.exercise04.match_documents:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "регистрация", right: "registration"}
          - {left: "паспорт", right: "passport"}
          - {left: "заявление", right: "application form"}
          - {left: "договор аренды", right: "rental contract"}
          - {left: "копия", right: "copy"}
          - {left: "адрес", right: "address"}
        status: "correct"
    feedback: "These are the registration-document words."
  ru.a2.unit25.lesson01.exercise05.order_nuzhen_pasport:
    instruction: "Put the words in order to say \"A passport is needed.\""
    accepted_answers: [{value: ["Нужен", "паспорт"], status: "correct"}]
    feedback: "The correct order is *Нужен паспорт*."
  ru.a2.unit25.lesson01.exercise06.write_have_passport:
    instruction: "Write: I have a passport."
    accepted_answers:
      - {value: "У меня есть паспорт.", status: "correct"}
      - {value: "У меня есть паспорт", status: "correct"}
    feedback: "The model answer is *У меня есть паспорт*."
  ru.a2.unit25.lesson02.exercise01.recognize_kopiya:
    instruction: "Which word means \"copy\"?"
    correct_option: "копия"
    distractors: ["адрес", "паспорт", "заявление"]
    accepted_answers: [{value: "копия", status: "correct"}]
    feedback: "*копия* means \"copy.\""
  ru.a2.unit25.lesson02.exercise02.recognize_adres:
    instruction: "Which word means \"address\"?"
    correct_option: "адрес"
    distractors: ["аренды", "копия", "договор"]
    accepted_answers: [{value: "адрес", status: "correct"}]
    feedback: "*адрес* means \"address.\""
  ru.a2.unit25.lesson02.exercise03.match_registration_phrases:
    instruction: "Match each registration phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "по новому адресу", right: "at the new address"}
          - {left: "копия паспорта", right: "copy of the passport"}
          - {left: "Скажите, пожалуйста.", right: "Please tell me."}
          - {left: "Копия нужна?", right: "Is a copy needed?"}
          - {left: "Приходите завтра.", right: "Come tomorrow."}
          - {left: "к десяти", right: "by/at ten"}
        status: "correct"
    feedback: "These phrases handle address, copies, and timing."
  ru.a2.unit25.lesson02.exercise04.order_kopiya_nuzhna:
    instruction: "Put the words in order to ask whether a passport copy is needed."
    accepted_answers: [{value: ["Копия", "паспорта", "нужна?"], status: "correct"}]
    feedback: "The correct order is *Копия паспорта нужна?*"
  ru.a2.unit25.lesson02.exercise05.complete_skazhite:
    instruction: "Complete the question: ___, пожалуйста, копия нужна? (tell me)"
    accepted_answers:
      - {value: "Скажите", status: "correct"}
      - {value: "Скажите пожалуйста копия нужна", status: "correct"}
      - {value: "Скажите, пожалуйста, копия нужна?", status: "correct"}
    feedback: "The formal prompt starts with *Скажите, пожалуйста*."
  ru.a2.unit25.lesson02.exercise06.write_clarifying_question:
    instruction: "Write a formal clarifying question asking whether a passport copy is needed."
    accepted_answers:
      - {value: "Скажите, пожалуйста, копия паспорта нужна?", status: "correct"}
      - {value: "Скажите пожалуйста копия паспорта нужна?", status: "correct"}
      - {value: "Скажите, пожалуйста, копия паспорта нужна", status: "correct"}
    feedback: "The model answer is *Скажите, пожалуйста, копия паспорта нужна?*"
  ru.a2.unit25.lesson03.exercise01.choose_register:
    instruction: "You are at an official desk and need to register at a new address. What do you say?"
    correct_option: "Я хочу зарегистрироваться по новому адресу."
    distractors: ["Копия паспорта нужна?", "Приходите завтра к десяти.", "У меня есть чек."]
    accepted_answers: [{value: "Я хочу зарегистрироваться по новому адресу.", status: "correct"}]
    feedback: "*Я хочу зарегистрироваться по новому адресу* states the registration goal."
  ru.a2.unit25.lesson03.exercise02.listen_dialogue_requirements:
    instruction: "Listen to the dialogue. What documents are required, and when should Dima come?"
    correct_option: "Passport, application form, rental contract, and passport copy; tomorrow at ten"
    distractors: ["Photo and insurance policy; today at seven", "Receipt and card; Friday at five", "Only a photo; next week"]
    accepted_answers: [{value: "Passport, application form, rental contract, and passport copy; tomorrow at ten", status: "correct"}]
    feedback: "The official asks for *паспорт*, *заявление*, *договор аренды*, and *копия*, then says *завтра к десяти*."
  ru.a2.unit25.lesson03.exercise03.match_dialogue:
    instruction: "Match each Russian line to its meaning."
    accepted_answers:
      - value:
          - {left: "Вы на регистрацию?", right: "Are you here for registration?"}
          - {left: "Я хочу зарегистрироваться.", right: "I want to register."}
          - {left: "по новому адресу", right: "at the new address"}
          - {left: "Нужен паспорт.", right: "A passport is needed."}
          - {left: "Копия паспорта нужна?", right: "Is a passport copy needed?"}
          - {left: "Приходите завтра к десяти.", right: "Come tomorrow at ten."}
        status: "correct"
    feedback: "These are the main lines of the official exchange."
  ru.a2.unit25.lesson03.exercise04.order_hochu_zareg:
    instruction: "Put the words in order to say \"I want to register.\""
    accepted_answers: [{value: ["Я", "хочу", "зарегистрироваться"], status: "correct"}]
    feedback: "The correct order is *Я хочу зарегистрироваться*."
  ru.a2.unit25.lesson03.exercise05.reply_documents:
    instruction: "The official asks \"Паспорт и заявление есть?\" Answer: \"I have a passport and application form.\""
    accepted_answers:
      - {value: "У меня есть паспорт и заявление.", status: "correct"}
      - {value: "У меня есть паспорт и заявление", status: "correct"}
    feedback: "The model answer is *У меня есть паспорт и заявление*."
  ru.a2.unit25.lesson03.exercise06.write_registration_request:
    instruction: "Write a short formal message: say you want to register at a new address, say you have a passport and application, and ask whether a passport copy is needed."
    accepted_answers:
      - {value: "Здравствуйте. Я хочу зарегистрироваться по новому адресу. У меня есть паспорт и заявление. Скажите, пожалуйста, копия паспорта нужна?", status: "correct"}
      - {value: "Здравствуйте, я хочу зарегистрироваться по новому адресу. У меня есть паспорт и заявление. Скажите, пожалуйста, копия паспорта нужна?", status: "correct"}
      - {value: "Здравствуйте. Я хочу зарегистрироваться по новому адресу. У меня есть паспорт и заявление. Скажите пожалуйста копия паспорта нужна?", status: "correct"}
    feedback: "A complete answer states the goal, lists what you have, and asks the clarifying question."
