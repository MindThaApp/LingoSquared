course:
  title: "Russian B1"
  description: "Learn B1-level Russian for making a formal complaint and asking for a concrete resolution, describing what already happened and what is still wrong, with a building manager (вы register)."

units:
  ru.b1.unit46.zhaloba_serioznaja: {title: "A serious complaint"}

lessons:
  ru.b1.unit46.lesson01.master_prihodil: {title: "The repairman came, but..."}
  ru.b1.unit46.lesson02.hochu_chtoby_vy_prislali: {title: "I want you to send..."}
  ru.b1.unit46.lesson03.zhaloba_kran: {title: "Complaint about the faucet"}

teaching:
  ru.b1.unit46.lesson01.teach.zdravstvuite_pozhalovatsya: {title: "Здравствуйте, я хочу пожаловаться.", gloss: "Hello, I want to complain.", note: "Opens a formal complaint politely, using вы register.", example_gloss: null}
  ru.b1.unit46.lesson01.teach.master_prihodil_vchera: {title: "Мастер приходил вчера, но кран всё ещё течёт.", gloss: "The repairman came yesterday, but the faucet is still leaking.", note: "States what already happened (the repairman's visit) and what is still wrong.", example_gloss: null}
  ru.b1.unit46.lesson01.teach.no_vsyo_eshcho_grammar: {title: "но + всё ещё = проблема не решена", gloss: "no + vsyo yeshcho = the problem is not solved", note: "Use но (but) with всё ещё (still) to show an action happened yet the problem remains.", example_gloss: "no plus vsyo yeshcho shows the problem is not solved: the repairman came, but the faucet is still leaking."}
  ru.b1.unit46.lesson02.teach.hochu_chtoby_vy_prislali: {title: "Я хочу, чтобы вы прислали другого мастера сегодня.", gloss: "I want you to send a different repairman today.", note: "*хочу, чтобы вы* + past-tense verb form is the polite way to state what you want the other person to do.", example_gloss: null}
  ru.b1.unit46.lesson02.teach.hochu_chtoby_grammar: {title: "хочу, чтобы вы + прошедшее время = вежливая просьба", gloss: "khochu, chtoby vy + past tense = a polite request", note: "Russian uses a past-tense verb form after чтобы even though the request is about the future.", example_gloss: "khochu chtoby vy plus past tense makes a polite request: I want you to send a different repairman."}
  ru.b1.unit46.lesson02.teach.prishlite_pozhaluista: {title: "Пришлите, пожалуйста, другого мастера сегодня.", gloss: "Please send a different repairman today.", note: "A direct polite imperative alternative to хочу, чтобы вы.", example_gloss: null}
  ru.b1.unit46.lesson03.teach.nastya_complaint: {title: "Nastya states the complaint", gloss: "Nastya: Hello. The repairman came yesterday, but the faucet is still leaking.", note: "Opens the complaint dialogue with вы register."}
  ru.b1.unit46.lesson03.teach.upravlyayushchii_sorry: {title: "The manager apologizes and asks", gloss: "Manager: I'm very sorry. What do you want us to do?", note: "Acknowledges the complaint and invites a concrete resolution."}
  ru.b1.unit46.lesson03.teach.nastya_request: {title: "Nastya asks for a resolution", gloss: "Nastya: I want you to send a different repairman today.", note: "States the concrete resolution requested."}
  ru.b1.unit46.lesson03.teach.upravlyayushchii_agree: {title: "The manager agrees", gloss: "Manager: OK, the repairman will come this afternoon.", note: "Confirms the resolution."}

exercises:
  ru.b1.unit46.lesson01.exercise01.recognize_pozhalovatsya: {instruction: "Which Russian phrase means \"hello, I want to complain\"?", correct_option: "здравствуйте я хочу пожаловаться", distractors: ["мастер приходил вчера", "я хочу чтобы вы прислали мастера", "пришлите пожалуйста другого мастера"], accepted_answers: [{value: "здравствуйте я хочу пожаловаться", status: "correct"}], feedback: "*Здравствуйте, я хочу пожаловаться* politely opens a complaint."}
  ru.b1.unit46.lesson01.exercise02.recognize_master_prihodil: {instruction: "Which Russian phrase means \"the repairman came yesterday, but the faucet is still leaking\"?", correct_option: "мастер приходил вчера но кран всё ещё течёт", distractors: ["я хочу пожаловаться", "пришлите другого мастера сегодня", "мастер придёт сегодня днём"], accepted_answers: [{value: "мастер приходил вчера но кран всё ещё течёт", status: "correct"}], feedback: "*приходил...но...всё ещё* describes what happened and what is still wrong."}
  ru.b1.unit46.lesson01.exercise03.listen_select_master_prihodil: {instruction: "Listen. What is the problem?", correct_option: "The repairman came yesterday but the faucet is still leaking.", distractors: ["The repairman never came.", "The heating still doesn't work.", "The faucet was fixed yesterday."], accepted_answers: [{value: "The repairman came yesterday but the faucet is still leaking.", status: "correct"}], feedback: "The recording says *Мастер приходил вчера, но кран всё ещё течёт*."}
  ru.b1.unit46.lesson01.exercise04.match_complaint_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "пожаловаться", right: "to complain"}
          - {left: "мастер", right: "repairman"}
          - {left: "приходил", right: "came"}
          - {left: "вчера", right: "yesterday"}
          - {left: "кран", right: "faucet"}
          - {left: "всё ещё течёт", right: "is still leaking"}
        status: "correct"
    feedback: "These build the complaint's opening and problem statement."
  ru.b1.unit46.lesson01.exercise05.order_master_prihodil: {instruction: "Put the words in order to say \"The repairman came yesterday, but the faucet is still leaking.\"", accepted_answers: [{value: ["Мастер", "приходил", "вчера", "но", "кран", "всё", "ещё", "течёт"], status: "correct"}], feedback: "The correct order is *Мастер приходил вчера, но кран всё ещё течёт*."}
  ru.b1.unit46.lesson01.exercise06.write_master_prihodil:
    instruction: "Write exactly this sentence describing what already happened and what is still wrong: The repairman came yesterday, but the faucet is still leaking."
    accepted_answers:
      - {value: "Мастер приходил вчера, но кран всё ещё течёт.", status: "correct"}
      - {value: "Мастер приходил вчера но кран всё ещё течёт.", status: "correct"}
      - {value: "Мастер приходил вчера, но кран всё ещё течёт", status: "correct"}
      - {value: "Мастер приходил вчера но кран всё ещё течёт", status: "correct"}
    feedback: "The model answer is *Мастер приходил вчера, но кран всё ещё течёт*."
  ru.b1.unit46.lesson02.exercise01.recognize_hochu_chtoby: {instruction: "Which Russian phrase means \"I want you to send a different repairman today\"?", correct_option: "я хочу чтобы вы прислали другого мастера сегодня", distractors: ["мастер приходил вчера но кран течёт", "здравствуйте я хочу пожаловаться", "хорошо мастер придёт сегодня днём"], accepted_answers: [{value: "я хочу чтобы вы прислали другого мастера сегодня", status: "correct"}], feedback: "*хочу, чтобы вы прислали* politely states the requested resolution."}
  ru.b1.unit46.lesson02.exercise02.recognize_prishlite: {instruction: "Which Russian phrase means \"please send a different repairman today\"?", correct_option: "пришлите пожалуйста другого мастера сегодня", distractors: ["я хочу пожаловаться", "мастер приходил вчера", "мне очень жаль"], accepted_answers: [{value: "пришлите пожалуйста другого мастера сегодня", status: "correct"}], feedback: "*Пришлите, пожалуйста* is a direct polite imperative request."}
  ru.b1.unit46.lesson02.exercise03.listen_select_hochu_chtoby: {instruction: "Listen. What resolution is requested?", correct_option: "Send a different repairman today.", distractors: ["Fix the faucet yourself.", "Refund the repair fee.", "Come back next week."], accepted_answers: [{value: "Send a different repairman today.", status: "correct"}], feedback: "The recording says *Я хочу, чтобы вы прислали другого мастера сегодня*."}
  ru.b1.unit46.lesson02.exercise04.match_resolution_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "хочу, чтобы вы", right: "I want you to"}
          - {left: "прислали", right: "sent"}
          - {left: "другого мастера", right: "a different repairman"}
          - {left: "сегодня", right: "today"}
          - {left: "Пришлите", right: "send (polite imperative)"}
          - {left: "пожалуйста", right: "please"}
        status: "correct"
    feedback: "These build the request for a concrete resolution."
  ru.b1.unit46.lesson02.exercise05.order_hochu_chtoby: {instruction: "Put the words in order to say \"I want you to send a different repairman today.\"", accepted_answers: [{value: ["Я", "хочу", "чтобы", "вы", "прислали", "другого", "мастера", "сегодня"], status: "correct"}], feedback: "The correct order is *Я хочу, чтобы вы прислали другого мастера сегодня*."}
  ru.b1.unit46.lesson02.exercise06.write_hochu_chtoby:
    instruction: "Write exactly this polite request for a concrete resolution: I want you to send a different repairman today."
    accepted_answers:
      - {value: "Я хочу, чтобы вы прислали другого мастера сегодня.", status: "correct"}
      - {value: "Я хочу чтобы вы прислали другого мастера сегодня.", status: "correct"}
      - {value: "Я хочу, чтобы вы прислали другого мастера сегодня", status: "correct"}
      - {value: "Я хочу чтобы вы прислали другого мастера сегодня", status: "correct"}
    feedback: "The model answer is *Я хочу, чтобы вы прислали другого мастера сегодня*."
  ru.b1.unit46.lesson03.exercise01.choose_complete_complaint: {instruction: "Which answer describes what already happened, what is still wrong, AND asks for a concrete resolution?", correct_option: "Мастер приходил вчера, но кран всё ещё течёт. Я хочу, чтобы вы прислали другого мастера сегодня.", distractors: ["Если бы я был на твоём месте, я бы пил меньше кофе.", "Дима сказал, что он придёт в офис.", "Мне надо было взять зонт."], accepted_answers: [{value: "Мастер приходил вчера, но кран всё ещё течёт. Я хочу, чтобы вы прислали другого мастера сегодня.", status: "correct"}], feedback: "The correct answer states what happened, what is still wrong, and requests a concrete resolution."}
  ru.b1.unit46.lesson03.exercise02.dialogue_comprehension_complaint:
    instruction: "Listen to the dialogue. What is Nastya's complaint, and what resolution does she request and receive?"
    correct_option: "The repairman came yesterday but the faucet still leaks; Nastya asks for a different repairman today and the manager agrees"
    distractors: ["The heating is broken and no one has come; Nastya asks for a refund and is refused", "Nastya lost her key; she asks for a new one and receives it next week", "The faucet was fixed but the bill is wrong; Nastya asks for a correction"]
    accepted_answers: [{value: "The repairman came yesterday but the faucet still leaks; Nastya asks for a different repairman today and the manager agrees", status: "correct"}]
    feedback: "Nastya describes the unresolved problem and asks for a concrete resolution, which the manager grants."
  ru.b1.unit46.lesson03.exercise03.match_dialogue_complaint:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Мастер приходил вчера, но кран всё ещё течёт.", right: "The repairman came yesterday, but the faucet is still leaking."}
          - {left: "Мне очень жаль.", right: "I'm very sorry."}
          - {left: "Что вы хотите, чтобы мы сделали?", right: "What do you want us to do?"}
          - {left: "Я хочу, чтобы вы прислали другого мастера сегодня.", right: "I want you to send a different repairman today."}
          - {left: "Хорошо, мастер придёт сегодня днём.", right: "OK, the repairman will come this afternoon."}
          - {left: "кран", right: "faucet"}
        status: "correct"
    feedback: "These phrases build the full complaint-and-resolution dialogue."
  ru.b1.unit46.lesson03.exercise04.order_upravlyayushchii_agree: {instruction: "Put the words in order to say \"OK, the repairman will come this afternoon.\"", accepted_answers: [{value: ["Хорошо", "мастер", "придёт", "сегодня", "днём"], status: "correct"}], feedback: "The correct order is *Хорошо, мастер придёт сегодня днём*."}
  ru.b1.unit46.lesson03.exercise05.reply_what_do_you_want:
    instruction: "The manager asks \"Мне очень жаль. Что вы хотите, чтобы мы сделали?\" Answer with exactly this sentence: \"Я хочу, чтобы вы прислали другого мастера сегодня.\""
    accepted_answers:
      - {value: "Я хочу, чтобы вы прислали другого мастера сегодня.", status: "correct"}
      - {value: "Я хочу чтобы вы прислали другого мастера сегодня.", status: "correct"}
    feedback: "The model answer states the concrete resolution requested."
  ru.b1.unit46.lesson03.exercise06.write_full_complaint:
    instruction: "Write a full complaint as Настя to the Управляющий, using вы: say the repairman came yesterday but the faucet is still leaking, and ask them to send a different repairman today."
    accepted_answers:
      - {value: "Мастер приходил вчера, но кран всё ещё течёт. Я хочу, чтобы вы прислали другого мастера сегодня.", status: "correct"}
      - {value: "Мастер приходил вчера но кран всё ещё течёт. Я хочу чтобы вы прислали другого мастера сегодня.", status: "correct"}
    feedback: "A complete complaint states what happened, what is still wrong, and requests a concrete resolution."
