course:
  title: "Russian B1"
  description: "Learn B1-level Russian for expressing hypothetical conditions with если бы + past tense and бы + past tense, and for softening a request or preference with бы alone."

units:
  ru.b1.unit49.gipoteza_uslovie: {title: "Hypothesis and condition"}

lessons:
  ru.b1.unit49.lesson01.esli_by_bolshe_vremeni: {title: "If I had..."}
  ru.b1.unit49.lesson02.ty_by_mog_pomoch: {title: "Could you help..."}
  ru.b1.unit49.lesson03.esli_by_i_prosba: {title: "If... and a request"}

teaching:
  ru.b1.unit49.lesson01.teach.esli_by_bolshe_vremeni: {title: "Если бы у меня было больше времени, я бы путешествовал больше.", gloss: "If I had more time, I would travel more.", note: "если бы + past tense states an unreal condition; бы + past tense states its hypothetical result.", example_gloss: null}
  ru.b1.unit49.lesson01.teach.esli_by_grammar: {title: "если бы + прошедшее время, ... бы + прошедшее время = нереальное условие", gloss: "if + бы + past tense, ... бы + past tense = an unreal condition", note: "Use если бы with the past tense for the condition, and бы with the past tense again for the hypothetical result.", example_gloss: "If I had more money, I would buy a new car."}
  ru.b1.unit49.lesson01.teach.esli_by_bolshe_deneg: {title: "Если бы у меня было больше денег, я бы купил новую машину.", gloss: "If I had more money, I would buy a new car.", note: "A second example of если бы + бы conditional.", example_gloss: null}
  ru.b1.unit49.lesson02.teach.ty_by_mog_pomoch: {title: "Ты бы мог помочь мне с этим?", gloss: "Could you help me with this?", note: "бы alone (no если) softens a request.", example_gloss: null}
  ru.b1.unit49.lesson02.teach.bare_by_grammar: {title: "бы + прошедшее время (без если) = смягчённая просьба", gloss: "бы + past tense (without если) = a softened request", note: "Bare бы with the past tense, with no если-clause, softens a suggestion, request, or preference.", example_gloss: "Could you help me with this? -- a softened request, with no если."}
  ru.b1.unit49.lesson02.teach.ja_by_khotela_kofe: {title: "Я бы хотела чашку кофе, пожалуйста.", gloss: "I would like a cup of coffee, please.", note: "бы alone also softens a stated preference.", example_gloss: null}
  ru.b1.unit49.lesson03.teach.nastya_hypothetical: {title: "Nastya states a hypothetical", gloss: "Nastya: If I had more time, I would travel more.", note: "Opens with a hypothetical condition and result."}
  ru.b1.unit49.lesson03.teach.dima_ask_time: {title: "Dima asks for time", gloss: "Dima: I understand. Do you have time right now to help me with this report?", note: "Shifts from the hypothetical to a real request."}
  ru.b1.unit49.lesson03.teach.nastya_soft_request: {title: "Nastya softens a request", gloss: "Nastya: Could you first explain what needs to be done?", note: "бы alone softens the request, with no если-clause."}
  ru.b1.unit49.lesson03.teach.dima_hypothetical_reply: {title: "Dima replies with another hypothetical", gloss: "Dima: Of course. If it were simple, I wouldn't be asking.", note: "Closes with a second если бы + бы hypothetical."}

exercises:
  ru.b1.unit49.lesson01.exercise01.recognize_esli_by_vremeni: {instruction: "Which Russian sentence means \"if I had more time, I would travel more\"?", correct_option: "если бы у меня было больше времени я бы путешествовал больше", distractors: ["ты бы мог помочь мне с этим", "если бы у меня было больше денег я бы купил новую машину", "я бы хотела чашку кофе пожалуйста"], accepted_answers: [{value: "если бы у меня было больше времени я бы путешествовал больше", status: "correct"}], feedback: "если бы + past tense states the condition; бы + past tense states the result."}
  ru.b1.unit49.lesson01.exercise02.recognize_esli_by_deneg: {instruction: "Which Russian sentence means \"if I had more money, I would buy a new car\"?", correct_option: "если бы у меня было больше денег я бы купил новую машину", distractors: ["если бы у меня было больше времени я бы путешествовал больше", "ты бы мог помочь мне с этим", "я бы хотела чашку кофе пожалуйста"], accepted_answers: [{value: "если бы у меня было больше денег я бы купил новую машину", status: "correct"}], feedback: "Another если бы + бы conditional sentence."}
  ru.b1.unit49.lesson01.exercise03.listen_select_esli_by: {instruction: "Listen. What is the hypothetical condition and result?", correct_option: "Having more time would mean traveling more.", distractors: ["Having more money would mean buying a car.", "Having less time would mean traveling less.", "Having more time would mean working more."], accepted_answers: [{value: "Having more time would mean traveling more.", status: "correct"}], feedback: "The recording says *Если бы у меня было больше времени, я бы путешествовал больше*."}
  ru.b1.unit49.lesson01.exercise04.match_esli_by_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Если бы", right: "If"}
          - {left: "у меня было больше времени", right: "I had more time"}
          - {left: "я бы путешествовал больше", right: "I would travel more"}
          - {left: "больше денег", right: "more money"}
          - {left: "я бы купил", right: "I would buy"}
          - {left: "новую машину", right: "a new car"}
        status: "correct"
    feedback: "These build the two hypothetical condition sentences."
  ru.b1.unit49.lesson01.exercise05.order_esli_by_deneg: {instruction: "Put the words in order to say \"If I had more money, I would buy a new car.\"", accepted_answers: [{value: ["Если", "бы", "у", "меня", "было", "больше", "денег", "я", "бы", "купил", "новую", "машину"], status: "correct"}, {value: ["Если", "бы", "у", "меня", "было", "больше", "денег", "я", "купил", "бы", "новую", "машину"], status: "correct"}], feedback: "The correct order is *Если бы у меня было больше денег, я бы купил новую машину*."}
  ru.b1.unit49.lesson01.exercise06.write_esli_by_vremeni:
    instruction: "Write exactly this hypothetical sentence using если бы + past tense for the condition and бы + past tense for the result: If I had more time, I would travel more."
    accepted_answers:
      - {value: "Если бы у меня было больше времени, я бы путешествовал больше.", status: "correct"}
      - {value: "Если бы у меня было больше времени, я бы путешествовал больше", status: "correct"}
      - {value: "Если бы у меня было больше времени, я бы путешествовала больше.", status: "correct"}
      - {value: "Если бы у меня было больше времени, я бы путешествовала больше", status: "correct"}
      - {value: "Если бы у меня было больше времени, я бы больше путешествовал.", status: "correct"}
      - {value: "Если бы у меня было больше времени, я бы больше путешествовала.", status: "correct"}
      - {value: "Если бы у меня было больше времени, я путешествовал бы больше.", status: "correct"}
      - {value: "Если бы у меня было больше времени, я путешествовала бы больше.", status: "correct"}
    feedback: "The model answer is *Если бы у меня было больше времени, я бы путешествовал(а) больше*."
  ru.b1.unit49.lesson02.exercise01.recognize_ty_by_mog: {instruction: "Which Russian sentence means \"could you help me with this?\" (a softened request, no если)?", correct_option: "ты бы мог помочь мне с этим", distractors: ["если бы у меня было больше времени я бы путешествовал больше", "я бы хотела чашку кофе пожалуйста", "если бы у меня было больше денег я бы купил новую машину"], accepted_answers: [{value: "ты бы мог помочь мне с этим", status: "correct"}], feedback: "бы alone, with no если, softens the request."}
  ru.b1.unit49.lesson02.exercise02.recognize_ja_by_khotela: {instruction: "Which Russian sentence means \"I would like a cup of coffee, please\" (a softened preference)?", correct_option: "я бы хотела чашку кофе пожалуйста", distractors: ["ты бы мог помочь мне с этим", "если бы у меня было больше времени я бы путешествовал больше", "если бы у меня было больше денег я бы купил новую машину"], accepted_answers: [{value: "я бы хотела чашку кофе пожалуйста", status: "correct"}], feedback: "бы alone also softens a preference."}
  ru.b1.unit49.lesson02.exercise03.listen_select_ty_by_mog: {instruction: "Listen. What softened request is made?", correct_option: "A request for help with something.", distractors: ["A request for a cup of coffee.", "A request to buy a new car.", "A request to travel more."], accepted_answers: [{value: "A request for help with something.", status: "correct"}], feedback: "The recording says *Ты бы мог помочь мне с этим?*"}
  ru.b1.unit49.lesson02.exercise04.match_bare_by_words:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
