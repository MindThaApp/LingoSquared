        status: "correct"
    feedback: "These build the softened request and preference."
  ru.b1.unit49.lesson02.exercise05.order_ja_by_khotela: {instruction: "Put the words in order to say \"I would like a cup of coffee, please.\"", accepted_answers: [{value: ["Я", "бы", "хотела", "чашку", "кофе", "пожалуйста"], status: "correct"}, {value: ["Я", "хотела", "бы", "чашку", "кофе", "пожалуйста"], status: "correct"}], feedback: "The correct order is *Я бы хотела чашку кофе, пожалуйста*."}
  ru.b1.unit49.lesson02.exercise06.write_ty_by_mog:
    instruction: "Write exactly this softened request using бы alone (no если): Could you help me with this?"
    accepted_answers:
      - {value: "Ты бы мог помочь мне с этим?", status: "correct"}
      - {value: "Ты бы мог помочь мне с этим", status: "correct"}
      - {value: "Ты бы могла помочь мне с этим?", status: "correct"}
      - {value: "Вы бы могли помочь мне с этим?", status: "correct"}
      - {value: "Ты мог бы помочь мне с этим?", status: "correct"}
      - {value: "Ты могла бы помочь мне с этим?", status: "correct"}
      - {value: "Вы могли бы помочь мне с этим?", status: "correct"}
    feedback: "The model answer is *Ты бы мог помочь мне с этим?* (to a woman: *Ты бы могла...*; polite: *Вы бы могли...*)."
  ru.b1.unit49.lesson03.exercise01.choose_full_hypothetical: {instruction: "Which answer states a hypothetical condition-and-result with если бы AND uses бы alone to soften a request, all in one exchange?", correct_option: "Если бы у меня было больше времени, я бы путешествовала больше. Ты бы мог сначала объяснить, что нужно сделать?", distractors: ["Я бы хотела чашку кофе, пожалуйста. Ты бы мог помочь мне с этим?", "Если бы у меня было больше денег, я бы купил новую машину. Если бы это было просто, я бы не просил.", "Не могли бы вы отправить отчёт до пятницы?"], accepted_answers: [{value: "Если бы у меня было больше времени, я бы путешествовала больше. Ты бы мог сначала объяснить, что нужно сделать?", status: "correct"}], feedback: "The correct answer combines an если бы hypothetical with a bare-бы softened request."}
  ru.b1.unit49.lesson03.exercise02.dialogue_comprehension_hypothetical:
    instruction: "Listen to the dialogue. What does Nastya say she would do, what does Dima ask for, and what does Dima say about the request being simple?"
    correct_option: "Nastya says she would travel more with more time; Dima asks Nastya to help with the report; Dima says if it were simple he wouldn't be asking"
    distractors: ["Nastya says she would buy a car with more money; Dima asks Nastya for a cup of coffee; Dima says he already explained everything", "Dima says he would travel more with more time; Nastya asks Dima to explain the report; Nastya says if it were simple she wouldn't be asking", "Nastya says she has no time to travel; Dima asks Nastya to finish the report alone; Dima says the report is already simple"]
    accepted_answers: [{value: "Nastya says she would travel more with more time; Dima asks Nastya to help with the report; Dima says if it were simple he wouldn't be asking", status: "correct"}]
    feedback: "The dialogue moves from a hypothetical to a real, softened request."
