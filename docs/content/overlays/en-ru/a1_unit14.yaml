course:
  title: "Russian A1"
  description: "Learn A1-level Russian for proposing, accepting, declining, and scheduling a simple near-future plan, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit14.preferences: {title: "I like..."}

lessons:
  ru.a1.unit14.lesson01.mne_nravitsya: {title: "I like coffee"}
  ru.a1.unit14.lesson02.ya_hochu: {title: "I want tea"}
  ru.a1.unit14.lesson03.tebe_nravitsya_kofe: {title: "Dialogue: do you like coffee?"}

teaching:
  ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe: {title: "Мне нравится кофе.", gloss: "I like coffee.", note: "мне нравится (\"is pleasing to me\") uses the dative pronoun мне with нравится to express liking."}
  ru.a1.unit14.lesson01.teach.ne_nravitsya: {title: "не нравится", gloss: "don't like", note: "не (\"not\") placed before нравится negates the liking construction.", example_gloss: "I don't like tea."}
  ru.a1.unit14.lesson01.teach.chay: {title: "чай", gloss: "tea", note: "чай is the word for \"tea.\"", example_gloss: "I like tea."}

  ru.a1.unit14.lesson02.teach.ya_hochu_chay: {title: "Я хочу чай.", gloss: "I want tea.", note: "хочу (\"I want\") is the first-person present of хотеть, used with a direct object to state a want."}
  ru.a1.unit14.lesson02.teach.ne_hochu: {title: "не хочу", gloss: "don't want", note: "не хочу negates хочу to mean \"I don't want.\"", example_gloss: "I don't want coffee."}
  ru.a1.unit14.lesson02.teach.sok: {title: "сок", gloss: "juice", note: "сок is the word for \"juice.\"", example_gloss: "I want juice."}

  ru.a1.unit14.lesson03.teach.nastya_tebe_nravitsya: {title: "Nastya asks if Dima likes coffee", gloss: "Nastya: Do you like coffee?", note: "Настя opens with Тебе нравится кофе?"}
  ru.a1.unit14.lesson03.teach.dima_da_mne_nravitsya: {title: "Dima answers and asks back", gloss: "Dima: Yes, I like coffee. And you?", note: "Дима answers Да, мне нравится кофе. А тебе?"}
  ru.a1.unit14.lesson03.teach.nastya_ne_nravitsya_hochu_chay: {title: "Nastya answers and states what she wants", gloss: "Nastya: I don't like coffee. I want tea.", note: "Настя answers Мне не нравится кофе. Я хочу чай."}

exercises:
  ru.a1.unit14.lesson01.exercise01.recognize_nravitsya:
    instruction: "Which word means \"is pleasing to (used for 'like')\"?"
    correct_option: "нравится"
    distractors: ["чай", "не", "кофе"]
    accepted_answers: [{value: "нравится", status: "correct"}]
    feedback: "нравится is used with a dative pronoun (like мне) to mean \"like.\""
  ru.a1.unit14.lesson01.exercise02.recognize_chay:
    instruction: "Which word means \"tea\"?"
    correct_option: "чай"
    distractors: ["нравится", "не", "кофе"]
    accepted_answers: [{value: "чай", status: "correct"}]
    feedback: "чай means \"tea.\""
  ru.a1.unit14.lesson01.exercise03.listen_select_mne_nravitsya_kofe:
    instruction: "Listen to the recording. What does the speaker like?"
    correct_option: "Coffee"
    distractors: ["Tea", "Juice", "Neither"]
    accepted_answers: [{value: "Coffee", status: "correct"}]
    feedback: "The recording says Мне нравится кофе. (\"I like coffee.\")"
  ru.a1.unit14.lesson01.exercise04.match_liking_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "мне", right: "to me"}
          - {left: "нравится", right: "is pleasing (like)"}
          - {left: "не нравится", right: "don't like"}
          - {left: "кофе", right: "coffee"}
          - {left: "чай", right: "tea"}
          - {left: "Мне нравится кофе.", right: "I like coffee."}
        status: "correct"
    feedback: "мне=to me, нравится=is pleasing (like), не нравится=don't like, кофе=coffee, чай=tea."
  ru.a1.unit14.lesson01.exercise05.order_mne_nravitsya_kofe:
    instruction: "Put the words in the correct order to say \"I like coffee.\""
    accepted_answers:
      - {value: ["Мне", "нравится", "кофе"], status: "correct"}
    feedback: "The correct order is Мне нравится кофе."
  ru.a1.unit14.lesson01.exercise06.listen_order_mne_ne_nravitsya_chay:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Мне", "нравится", "кофе"], status: "correct"}
    feedback: "The correct order is Мне нравится кофе (\"I like coffee\")."
  ru.a1.unit14.lesson01.exercise07.complete_mne_nravitsya_chay:
    instruction: "Complete the sentence: Мне ___ чай. (I like tea)"
    accepted_answers:
      - {value: "нравится", status: "correct"}
      - {value: "Мне нравится чай", status: "correct"}
    feedback: "нравится means \"is pleasing / like.\""
  ru.a1.unit14.lesson01.exercise08.write_a_preference:
    instruction: "Write a sentence saying you like coffee or tea, using \"Мне нравится...\"."
    accepted_answers:
      - {value: "Мне нравится кофе.", status: "correct"}
      - {value: "Мне нравится чай.", status: "correct"}
      - {value: "Мне нравится кофе", status: "correct"}
      - {value: "Мне нравится чай", status: "correct"}
    feedback: "Мне нравится кофе. or Мне нравится чай. means \"I like coffee/tea.\""

  ru.a1.unit14.lesson02.exercise01.recognize_hochu:
    instruction: "Which word means \"I want\"?"
    correct_option: "хочу"
    distractors: ["сок", "нравится", "чай"]
    accepted_answers: [{value: "хочу", status: "correct"}]
    feedback: "хочу means \"I want.\""
  ru.a1.unit14.lesson02.exercise02.recognize_sok:
    instruction: "Which word means \"juice\"?"
    correct_option: "сок"
    distractors: ["хочу", "нравится", "чай"]
    accepted_answers: [{value: "сок", status: "correct"}]
    feedback: "сок means \"juice.\""
  ru.a1.unit14.lesson02.exercise03.listen_select_ya_hochu_chay:
    instruction: "Listen to the recording. What does the speaker want?"
    correct_option: "Tea"
    distractors: ["Coffee", "Juice", "Nothing"]
    accepted_answers: [{value: "Tea", status: "correct"}]
    feedback: "The recording says Я хочу чай. (\"I want tea.\")"
  ru.a1.unit14.lesson02.exercise04.match_wanting_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "я хочу", right: "I want"}
          - {left: "не хочу", right: "don't want"}
          - {left: "сок", right: "juice"}
          - {left: "кофе", right: "coffee"}
          - {left: "чай", right: "tea"}
          - {left: "мне нравится", right: "I like"}
          - {left: "Я хочу чай.", right: "I want tea."}
          - {left: "Мне нравится кофе.", right: "I like coffee."}
        status: "correct"
    feedback: "я хочу=I want, не хочу=don't want, сок=juice, кофе=coffee, чай=tea, мне нравится=I like."
  ru.a1.unit14.lesson02.exercise05.order_ya_hochu_sok:
    instruction: "Put the words in the correct order to say \"I want juice.\""
    accepted_answers:
      - {value: ["Я", "хочу", "сок"], status: "correct"}
    feedback: "The correct order is Я хочу сок."
  ru.a1.unit14.lesson02.exercise06.listen_order_ya_hochu_chay:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Я", "хочу", "чай"], status: "correct"}
    feedback: "The correct order is Я хочу чай (\"I want tea\")."
  ru.a1.unit14.lesson02.exercise07.complete_ya_hochu_sok:
    instruction: "Complete the sentence: Я ___ сок. (I want juice)"
    accepted_answers:
      - {value: "хочу", status: "correct"}
      - {value: "Я хочу сок", status: "correct"}
    feedback: "хочу means \"I want.\""
  ru.a1.unit14.lesson02.exercise08.write_what_you_want:
    instruction: "Write a sentence saying what you want to drink, using \"Я хочу...\"."
    accepted_answers:
      - {value: "Я хочу чай.", status: "correct"}
      - {value: "Я хочу сок.", status: "correct"}
      - {value: "Я хочу чай", status: "correct"}
      - {value: "Я хочу сок", status: "correct"}
    feedback: "Я хочу чай. or Я хочу сок. means \"I want tea/juice.\""

  ru.a1.unit14.lesson03.exercise01.choose_ask_if_liked:
    instruction: "You want to ask a friend if they like coffee. What do you say?"
    correct_option: "Тебе нравится кофе?"
    distractors: ["Я хочу чай.", "Мне нравится кофе.", "Я хочу сок."]
    accepted_answers: [{value: "Тебе нравится кофе?", status: "correct"}]
    feedback: "Тебе нравится кофе? means \"Do you like coffee?\""
  ru.a1.unit14.lesson03.exercise02.listen_select_tebe_nravitsya:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "Do you like coffee?"
    distractors: ["Do you want tea?", "Do you like juice?", "What do you want?"]
    accepted_answers: [{value: "Do you like coffee?", status: "correct"}]
    feedback: "The recording says Тебе нравится кофе? (\"Do you like coffee?\")"
  ru.a1.unit14.lesson03.exercise03.dialogue_comprehension_tebe_nravitsya_kofe:
    instruction: "Listen to the dialogue. Who likes coffee, and what do they each want instead?"
    correct_option: "Dima likes coffee; Nastya doesn't like coffee and wants tea; Dima wants juice"
    distractors: ["Nastya likes coffee and wants tea; Dima doesn't like coffee and wants juice", "Both like coffee and both want juice", "Dima doesn't like coffee; Nastya likes coffee and wants tea"]
    accepted_answers: [{value: "Dima likes coffee; Nastya doesn't like coffee and wants tea; Dima wants juice", status: "correct"}]
    feedback: "Дима says Да, мне нравится кофе., Настя says Мне не нравится кофе. Я хочу чай., and Дима says Я хочу сок."
  ru.a1.unit14.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Тебе нравится кофе?", right: "Do you like coffee?"}
          - {left: "Да, мне нравится кофе.", right: "Yes, I like coffee."}
          - {left: "Мне не нравится кофе.", right: "I don't like coffee."}
          - {left: "Я хочу чай.", right: "I want tea."}
          - {left: "Я хочу сок.", right: "I want juice."}
          - {left: "А тебе?", right: "And you?"}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange asking about and stating drink preferences."
  ru.a1.unit14.lesson03.exercise05.order_mne_ne_nravitsya_kofe:
    instruction: "Put the words in the correct order to say \"I don't like coffee.\""
    accepted_answers:
      - {value: ["Мне", "не", "нравится", "кофе"], status: "correct"}
    feedback: "The correct order is Мне не нравится кофе."
  ru.a1.unit14.lesson03.exercise06.reply_tebe_nravitsya_kofe:
    instruction: "Someone asks \"Тебе нравится кофе?\" Reply that yes, you like coffee."
    accepted_answers:
      - {value: "Да, мне нравится кофе.", status: "correct"}
      - {value: "Да мне нравится кофе", status: "correct"}
    feedback: "Да, мне нравится кофе. means \"Yes, I like coffee.\""
  ru.a1.unit14.lesson03.exercise07.complete_ya_hochu_chay:
    instruction: "Complete the sentence: Мне не нравится кофе. Я ___ чай. (I want)"
    accepted_answers:
      - {value: "хочу", status: "correct"}
      - {value: "Мне не нравится кофе Я хочу чай", status: "correct"}
    feedback: "хочу means \"I want.\""
  ru.a1.unit14.lesson03.exercise08.write_preference_exchange:
    instruction: "Write a short exchange: ask if a friend likes coffee, then answer with your own preference."
    accepted_answers:
      - {value: "Тебе нравится кофе? Да, мне нравится кофе.", status: "correct"}
      - {value: "Тебе нравится кофе Мне не нравится кофе Я хочу чай", status: "correct"}
    feedback: "Example: Тебе нравится кофе? Да, мне нравится кофе."
