course:
  title: "Russian B2"
  description: >-
    Upper-intermediate Russian: negotiate and resolve an everyday
    disagreement -- make a proposal and state your terms (я предлагаю,
    чтобы / давай / что если мы), decline a term politely (к сожалению,
    это не получится / лучше не надо), offer a conditional concession
    (если...то / при условии, что / но только если / разве что), and
    reach agreement (договорились / хорошо / полностью согласен(на)),
    around the everyday puzzle of two friends dividing the work and
    splitting the cost for a birthday party they are organizing together.

units:
  ru.b2.unit07.peregovory:
    title: "Negotiation"
    description: Negotiate and resolve a disagreement -- state your terms, decline a term politely, offer a conditional concession ("I can do X, but only if you do Y"), and reach an agreement, while telling what's settled from what's still open.

lessons:
  ru.b2.unit07.lesson01.predlozhenie:
    title: "Making a proposal"
  ru.b2.unit07.lesson02.vezhlivyj_otkaz:
    title: "Declining politely"
  ru.b2.unit07.lesson03.uslovie:
    title: "Attaching a condition"
  ru.b2.unit07.lesson04.dogovorilis:
    title: "Reaching an agreement"
  ru.b2.unit07.lesson05.chitat_soglashenie:
    title: "What was agreed?"
  ru.b2.unit07.lesson06.peregovory_v_razgovore:
    title: "Negotiating in conversation"

teaching:
  ru.b2.unit07.lesson01.teach.den_rozhdeniya:
    title: "We're organizing a birthday party together."
    gloss: "We're organizing a birthday party together."
    note: "The situation this whole unit negotiates: you and Дима are organizing a birthday party for a friend and have to divide the work. *День рождения* = 'birthday'."
  ru.b2.unit07.lesson01.teach.torta:
    title: "the cake"
    gloss: "the cake"
    note: "*Торт* = 'cake'. *Испечь* = 'to bake' (perfective infinitive). This is the first task on the table to divide."
    example_gloss: "I want to bake the cake."
  ru.b2.unit07.lesson01.teach.ukrashenija:
    title: "the decorations"
    gloss: "the decorations"
    note: "*Украшения* = 'decorations'. *Купить* = 'to buy' (perfective infinitive); *куплю* = 'I'll buy', *купишь* = 'you'll buy'."
    example_gloss: "I'll buy the decorations."
  ru.b2.unit07.lesson01.teach.ya_predlagayu:
    title: "I propose that..."
    gloss: "I propose that..."
    note: "*Я предлагаю, чтобы...* opens a proposal. After *чтобы* the verb takes the past-tense subjunctive-like form: *чтобы торт испекла я* ('that I bake the cake', literally 'that the cake baked I')."
  ru.b2.unit07.lesson01.teach.davay:
    title: "let's / shall we...?"
    gloss: "let's...? / shall we...?"
    note: "*Давай...?* floats a joint plan -- 'let's / shall we...?'. *Давай устроим день рождения?* = 'shall we organize a birthday party?'. *Устроить* = 'to organize / put on'."
    example_gloss: "Shall we organize a birthday party?"
  ru.b2.unit07.lesson01.teach.chto_esli_my:
    title: "what if we...?"
    gloss: "what if we...?"
    note: "*Что если мы...?* raises a possibility to consider together. *Разделить расходы* = 'to split the costs'."
    example_gloss: "What if we split the costs?"
  ru.b2.unit07.lesson01.teach.moyo_predlozhenie:
    title: "my proposal is..."
    gloss: "my proposal is..."
    note: "*Моё предложение — ...* states your terms plainly. *Испечёшь* = 'you'll bake' (the ты-form)."
    example_gloss: "My proposal is that you bake the cake."
  ru.b2.unit07.lesson01.teach.grammar_predlozhenie:
    title: "I propose that I bake the cake. Shall we organize a birthday party? What if we split the costs?"
    gloss: "I propose that I bake the cake. Shall we organize a birthday party? What if we split the costs?"
    note: "Four ways to put a term on the table: *я предлагаю, чтобы...*, *давай...?*, *что если мы...?*, *моё предложение — ...*. Stating your terms is the opening move of any negotiation."

  ru.b2.unit07.lesson02.teach.ne_poluchitsya:
    title: "Unfortunately, that won't work out."
    gloss: "Unfortunately, that won't work out."
    note: "*К сожалению, это не получится* is the everyday polite decline -- literally 'unfortunately, this won't come out / succeed'. *К сожалению* keeps it soft rather than blunt."
  ru.b2.unit07.lesson02.teach.ne_mogu:
    title: "I can't."
    gloss: "I can't."
    note: "*Я не могу* = 'I can't' -- declines because you're unable, not unwilling."
  ru.b2.unit07.lesson02.teach.ne_mogu_soglasitsya:
    title: "I can't agree to that."
    gloss: "I can't agree to that."
    note: "*Я не могу с этим согласиться* = 'I can't agree to that' -- a firmer, still-polite refusal of a proposed term. *Согласиться* = 'to agree' (perfective infinitive)."
  ru.b2.unit07.lesson02.teach.luchshe_ne_nado:
    title: "better not to"
    gloss: "better not to / had better not"
    note: "*Лучше не надо* = 'better not to' -- the gentlest decline of all, softer than a flat refusal."
    example_gloss: "It's better not to do that."
  ru.b2.unit07.lesson02.teach.ubirat:
    title: "to clean up"
    gloss: "to clean up"
    note: "*Убирать* = 'to clean up' -- another task in the mix (someone has to clean up after the party). *Должен* (male speaker) / *должна* (female speaker) = 'must / have to'."
    example_gloss: "I have to clean up after the party."
  ru.b2.unit07.lesson02.teach.ne_vsyo:
    title: "I can't do everything."
    gloss: "I can't do everything."
    note: "*Я не могу сделать всё* = 'I can't do everything' -- the honest reason a negotiation is needed at all."
  ru.b2.unit07.lesson02.teach.grammar_otkaz:
    title: "Unfortunately, that won't work out. I can't agree to that. It's better not to do that."
    gloss: "Unfortunately, that won't work out. I can't agree to that. It's better not to do that."
    note: "Declining a term without giving offence: *к сожалению, это не получится* (soft), *я не могу с этим согласиться* (firm), *лучше не надо* (gentle preference). A polite 'no' keeps the negotiation alive."

  ru.b2.unit07.lesson03.teach.uberyosh:
    title: "you'll clean up"
    gloss: "you'll clean up (perfective future of убрать)"
    note: "*Уберёшь* = 'you'll clean up' -- the task you'll trade in the core move of this unit. *Хочу* = 'I want'."
    example_gloss: "I don't want to clean up today."
  ru.b2.unit07.lesson03.teach.esli_to:
    title: "if... then..."
    gloss: "if... then..."
    note: "*Если... то...* is the basic conditional -- 'if... then...'. *Если ты уберёшь, то я испеку торт* = 'if you clean up, then I'll bake the cake'."
    example_gloss: "If you clean up, then I'll bake the cake."
  ru.b2.unit07.lesson03.teach.no_tolko_esli:
    title: "I can bake the cake, but only if you buy the decorations."
    gloss: "I can bake the cake, but only if you buy the decorations."
    note: "This is the heart of the unit: a CONDITIONAL CONCESSION -- 'I can do X, but only if you do Y'. *Но только если* ('but only if') attaches the condition to what you're offering."
  ru.b2.unit07.lesson03.teach.pri_uslovii:
    title: "on condition that..."
    gloss: "on condition that..."
    note: "*При условии, что...* = 'on condition that...' -- a more formal-sounding way to attach a condition than *но только если*, but still natural in everyday negotiation."
    example_gloss: "I'll buy the decorations, on condition that you bake the cake."
  ru.b2.unit07.lesson03.teach.razve_chto:
    title: "unless"
    gloss: "unless"
    note: "*Разве что* = 'unless' -- the negative conditional, naming the one case that would change your offer, distinct from the other three (positive) conditionals in this lesson."
    example_gloss: "I'll do it, unless you want to do it yourself."
  ru.b2.unit07.lesson03.teach.ya_soglasen:
    title: "I agree, but only if you clean up after."
    gloss: "I agree, but only if you clean up after."
    note: "*Я согласен* = 'I agree' (male speaker; a female speaker would say *согласна* -- see unit06). Pair it with a condition to concede on your own terms: *после* = 'afterward'."
  ru.b2.unit07.lesson03.teach.grammar_uslovie:
    title: "I can bake the cake, but only if you buy the decorations. I agree, on condition that you clean up after."
    gloss: "I can bake the cake, but only if you buy the decorations. I agree, on condition that you clean up after."
    note: "A conditional concession gives ground WITHOUT giving in: you offer something (*я могу испечь*, *я согласен*) but attach a condition (*но только если...*, *при условии, что...*). This is the move that resolves most real disagreements."

  ru.b2.unit07.lesson04.teach.dogovorilis:
    title: "It's a deal!"
    gloss: "Agreed! / It's a deal!"
    note: "*Договорились!* seals an agreement -- literally 'we've agreed'. It's the single word you say once both sides are happy with the terms."
  ru.b2.unit07.lesson04.teach.khorosho:
    title: "That's fine."
    gloss: "That's fine. / Okay."
    note: "*Хорошо* accepts a proposed term -- 'that's fine by me'. A plain, friendly yes."
  ru.b2.unit07.lesson04.teach.polnostyu_soglasen:
    title: "completely agreed (полностью согласен / согласна)"
    gloss: "completely agreed (male speaker: полностью согласен; female speaker: полностью согласна)"
    note: "*Полностью согласен* (male speaker) / *полностью согласна* (female speaker) = 'completely agreed' -- a stronger yes than *хорошо*, reusing the gendered short-form adjective from unit06."
    example_gloss:
      - "Completely agreed. (male speaker)"
      - "Completely agreed. (female speaker)"
  ru.b2.unit07.lesson04.teach.schyot:
    title: "the bill"
    gloss: "the bill"
    note: "*Счёт* = 'the bill'. *Делить счёт* = 'to split the bill' -- the money side of the negotiation, on top of who does which task."
    example_gloss: "We're splitting the bill."
  ru.b2.unit07.lesson04.teach.podelim_porovnu:
    title: "Shall we split the bill equally?"
    gloss: "Shall we split the bill equally?"
    note: "*Давай поделим счёт поровну* = 'shall we split the bill equally?'. *Поделить* = 'to split / divide'; *поровну* = 'equally / evenly'."
  ru.b2.unit07.lesson04.teach.prishli_k_soglasheniyu:
    title: "We reached an agreement."
    gloss: "We reached an agreement."
    note: "*Прийти к соглашению* = 'to reach an agreement / come to terms'. *Мы пришли к соглашению* = 'we reached an agreement' -- the goal of the whole exchange."
  ru.b2.unit07.lesson04.teach.grammar_soglashenie:
    title: "Shall we split the bill equally? It's a deal. That's fine, completely agreed."
    gloss: "Shall we split the bill equally? It's a deal. That's fine, completely agreed."
    note: "Closing the deal: once the terms and conditions are settled, seal it with *договорились*, *хорошо*, or *полностью согласен/согласна*. That's how you *прийти к соглашению* (reach agreement)."

  ru.b2.unit07.lesson05.teach.tekst:
    title: "Reading: dividing the party"
    gloss: "Dima: I propose that you bake the cake. Shall we buy the decorations together? Nastya: I'd rather not buy the decorations, because I have no time. But I agree, on condition that you also clean up after. Dima: It's a deal. And the bill? Nastya: We'll split that equally. We'll talk about the decorations again tomorrow."
    glosses:
      купим: "we'll buy (from купить)"
      буду: "will (I) (future auxiliary, in не буду покупать)"
      покупать: "to buy (imperfective infinitive)"
      некогда: "no time / too busy"
      тоже: "also / too"
      его: "it (accusative of он)"
      про: "about"
      поговорим: "we'll talk (from поговорить)"
      завтра: "tomorrow"

  ru.b2.unit07.lesson06.teach.khoroshaya_ideya:
    title: "good idea"
    gloss: "good idea"
    note: "*Хорошая идея* = 'good idea' -- how you accept the other side's opening before you add your own terms."
    example_gloss: "That's a good idea."
  ru.b2.unit07.lesson06.teach.togda:
    title: "Will you buy the decorations, then?"
    gloss: "Will you buy the decorations, then?"
    note: "*А украшения купишь ты тогда?* = 'and will you buy the decorations, then?'. *А* introduces a follow-up question."
  ru.b2.unit07.lesson06.teach.sam_khochesh:
    title: "Unless you want to yourself."
    gloss: "Unless you want to (do it) yourself."
    note: "*Сам* = '(your)self' (said to a male; to a female: *сама*). *Хочешь* = 'you want'."
  ru.b2.unit07.lesson06.teach.dialogue_nastya_open:
    title: "Nastya: Shall we organize a birthday party together?"
    gloss: "Nastya: Shall we organize a birthday party together?"
  ru.b2.unit07.lesson06.teach.dialogue_dima_propose:
    title: "Dima: Good idea. I propose that you bake the cake."
    gloss: "Dima: Good idea. I propose that you bake the cake."
  ru.b2.unit07.lesson06.teach.dialogue_nastya_ask:
    title: "Nastya: Will you buy the decorations, then?"
    gloss: "Nastya: Will you buy the decorations, then?"
  ru.b2.unit07.lesson06.teach.dialogue_dima_decline_concede:
    title: "Dima: Unfortunately, that won't work out. But I agree, on condition that you clean up after."
    gloss: "Dima: Unfortunately, that won't work out. But I agree, on condition that you clean up after."
  ru.b2.unit07.lesson06.teach.dialogue_nastya_bill:
    title: "Nastya: It's a deal. And we'll split the bill equally."
    gloss: "Nastya: It's a deal. And we'll split the bill equally."
  ru.b2.unit07.lesson06.teach.dialogue_dima_agree:
    title: "Dima: That's fine."
    gloss: "Dima: That's fine."
  ru.b2.unit07.lesson06.teach.grammar_polnyj:
    title: "I propose that you bake the cake. I'd rather not buy the decorations, but I agree on condition that you clean up after."
    gloss: "I propose that you bake the cake. I'd rather not buy the decorations, but I agree on condition that you clean up after."
    note: "A whole negotiation move in one breath: STATE a term (*я предлагаю, чтобы торт испекла ты*), DECLINE another (*украшения я лучше не буду покупать*), and offer a CONDITIONAL CONCESSION (*но я согласен, при условии, что ты уберёшь после*). This is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  ru.b2.unit07.lesson01.exercise01.recognize_predlagayu:
    instruction: "What does this word do?"
    correct_option: "I propose (something)"
    distractors: ["I agree", "I refuse", "I pay"]
    accepted_answers: [{value: "I propose (something)", status: "correct"}]
    feedback: "Я предлагаю... opens a proposal -- you put a term on the table."
  ru.b2.unit07.lesson01.exercise02.listen_predlagayu_ispech:
    instruction: "Listen and select what you hear."
    correct_option: "I propose that I bake the cake."
    distractors: ["I propose that you bake the cake.", "Shall we bake the cake together?", "I'd rather not bake the cake."]
    accepted_answers: [{value: "I propose that I bake the cake.", status: "correct"}]
    feedback: "Я предлагаю, чтобы торт испекла я means I propose that I bake the cake -- stating your own term."
  ru.b2.unit07.lesson01.exercise03.match_proposing:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value:
          - {left: "я предлагаю, чтобы", right: "I propose that"}
          - {left: "давай", right: "let's / shall we"}
          - {left: "что если мы", right: "what if we"}
          - {left: "моё предложение", right: "my proposal is"}
          - {left: "торт", right: "cake"}
          - {left: "украшения", right: "decorations"}
          - {left: "расходы", right: "costs / expenses"}
        status: "correct"
    feedback: "These put a term on the table: я предлагаю чтобы, давай, что если мы, моё предложение -- plus the tasks and costs you'll divide."
  ru.b2.unit07.lesson01.exercise04.order_predlagayu:
    instruction: "Put the words in order: I propose that I bake the cake."
    accepted_answers:
      - {value: ["Я", "предлагаю", "чтобы", "торт", "испекла", "я"], status: "correct"}
    feedback: "Я предлагаю, чтобы торт испекла я."
  ru.b2.unit07.lesson01.exercise05.translate_chto_esli:
    instruction: "Translate into Russian, proposing with что если мы: What if we split the costs?"
    accepted_answers:
      - {value: "Что если мы разделим расходы", status: "correct"}
    feedback: "Что если мы разделим расходы? means what if we split the costs?"
  ru.b2.unit07.lesson01.exercise06.speak_moyo_predlozhenie:
    instruction: "Say aloud in Russian, stating a term with моё предложение: My proposal is that you bake the cake."
    accepted_answers:
      - {value: "Моё предложение торт испечёшь ты", status: "correct"}
      - {value: "Мое предложение торт испечешь ты", status: "correct"}
      - {value: "Моё предложение ты испечёшь торт", status: "correct"}
      - {value: "Мое предложение ты испечешь торт", status: "correct"}
    feedback: "Моё предложение — торт испечёшь ты means my proposal is that you bake the cake."
  ru.b2.unit07.lesson01.exercise07.write_den_rozhdeniya:
    instruction: "Write in Russian: We're organizing a birthday party together."
    accepted_answers:
      - {value: "Мы вместе устраиваем день рождения", status: "correct"}
      - {value: "Мы устраиваем день рождения вместе", status: "correct"}
    feedback: "Мы вместе устраиваем день рождения means we're organizing a birthday party together."
  ru.b2.unit07.lesson01.exercise08.dictation_predlagayu_ispech:
    instruction: "Type what you hear."
    correct_response: "Я предлагаю, чтобы торт испекла я"
    orthography_strict: true
    feedback: "You heard Я предлагаю, чтобы торт испекла я — I propose that I bake the cake."

  ru.b2.unit07.lesson02.exercise01.recognize_poluchitsya:
    instruction: "What does this word mean here?"
    correct_option: "will work out / will succeed"
    distractors: ["will get", "will receive", "will happen suddenly"]
    accepted_answers: [{value: "will work out / will succeed", status: "correct"}]
    feedback: "Получится here means 'will work out' -- in это не получится, 'that won't work out'."
  ru.b2.unit07.lesson02.exercise02.listen_ne_poluchitsya:
    instruction: "Listen and select what you hear."
    correct_option: "Unfortunately, that won't work out."
    distractors: ["That's fine.", "I agree to that.", "Shall we do that?"]
    accepted_answers: [{value: "Unfortunately, that won't work out.", status: "correct"}]
    feedback: "К сожалению, это не получится means unfortunately, that won't work out -- a polite decline."
  ru.b2.unit07.lesson02.exercise03.match_declining:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
