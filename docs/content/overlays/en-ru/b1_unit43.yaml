course:
  title: "Russian B1"
  description: "Learn B1-level Russian for reporting what someone said or asked, without backshifting the original tense."

units:
  ru.b1.unit43.kosvennaja_rech: {title: "Reported speech"}

lessons:
  ru.b1.unit43.lesson01.chto_skazal_dima: {title: "What Dima said"}
  ru.b1.unit43.lesson02.nastya_sprosila: {title: "Nastya asked"}
  ru.b1.unit43.lesson03.chto_skazal_dima_dialog: {title: "What Dima said — the conversation"}

teaching:
  ru.b1.unit43.lesson01.teach.dima_skazal_chto: {title: "Дима сказал, что он придёт в офис.", gloss: "Dima said that he will come to the office.", note: "*сказал, что* reports a statement without changing the tense of *придёт*.", example_gloss: "Today Dima said that he will come to the office."}
  ru.b1.unit43.lesson01.teach.original_tense: {title: "сказал, что он придёт = без изменения времени", gloss: "he said that he will come = without changing the tense", note: "Unlike English, Russian reported speech keeps the SAME tense the original speaker used.", example_gloss: "Russian conveys reported speech without changing the tense."}
  ru.b1.unit43.lesson01.teach.nastya_skazala: {title: "Настя сказала, что Дима придёт позже.", gloss: "Nastya said that Dima will come later.", note: "The reporting verb agrees with the reporter (*сказала*, feminine).", example_gloss: "Nastya told a colleague that Dima will come later."}
  ru.b1.unit43.lesson02.teach.sprosila_li: {title: "Настя спросила, придёт ли он.", gloss: "Nastya asked whether he would come.", note: "*ли* reports a yes/no question; there is no \"if\" or \"that\" here.", example_gloss: "Yesterday Nastya asked whether he would come."}
  ru.b1.unit43.lesson02.teach.sprosila_chto_delaet: {title: "Она спросила, что он делает.", gloss: "She asked what he is doing.", note: "A wh-question reported with the question word itself, keeping the original tense.", example_gloss: "She asked a colleague what he is doing."}
  ru.b1.unit43.lesson02.teach.li_word_order: {title: "придёт ли он = ли стоит после глагола", gloss: "pridyot li on = li comes right after the verb", note: "*ли* follows the word being questioned — here, and most often, the verb.", example_gloss: "In a li-question, li comes after the verb: pridyot li on."}
  ru.b1.unit43.lesson03.teach.kollega_question: {title: "A colleague asks what Dima said", gloss: "Colleague: Nastya, what did Dima say?", note: "*Что сказал Дима?* = \"What did Dima say?\" — in a question with a question word, the subject often comes after the verb."}
  ru.b1.unit43.lesson03.teach.nastya_reports: {title: "Nastya reports the statement", gloss: "Nastya: Dima said that he will come to the office.", note: "Reported statement, original tense kept."}
  ru.b1.unit43.lesson03.teach.kollega_asked_when: {title: "The colleague asks about the question", gloss: "Colleague: And did you ask when?", note: "*А вы спросили...?* = \"And did you ask...?\" — the colleague uses polite *вы* at work."}
  ru.b1.unit43.lesson03.teach.nastya_asked_li: {title: "Nastya reports her question", gloss: "Nastya: Yes, I asked whether he would come today.", note: "Reported yes/no question with *ли*."}
  ru.b1.unit43.lesson03.teach.nastya_after_lunch: {title: "Nastya reports his answer", gloss: "Nastya: He said that he'll come after lunch.", note: "*после обеда* = \"after lunch\"."}

exercises:
  ru.b1.unit43.lesson01.exercise01.recognize_reported_statement: {instruction: "Which Russian sentence means \"Dima said that he will come to the office\"?", correct_option: "дима сказал что он придёт в офис", distractors: ["настя спросила придёт ли он", "дима придёт после обеда", "она спросила что он делает"], accepted_answers: [{value: "дима сказал что он придёт в офис", status: "correct"}], feedback: "*сказал, что он придёт* keeps the original future tense."}
  ru.b1.unit43.lesson01.exercise02.recognize_pridet: {instruction: "Which Russian word means \"he will come\"?", correct_option: "он придёт", distractors: ["он делает", "он сказал", "он спросил"], accepted_answers: [{value: "он придёт", status: "correct"}], feedback: "*придёт* is the future-tense form of \"come.\""}
  ru.b1.unit43.lesson01.exercise03.listen_select_reported_statement: {instruction: "Listen. What did Dima say he would do?", correct_option: "He'll come to the office.", distractors: ["He'll cook dinner.", "He'll ask a question.", "He'll call later."], accepted_answers: [{value: "He'll come to the office.", status: "correct"}], feedback: "The recording says *Дима сказал, что он придёт в офис*."}
  ru.b1.unit43.lesson01.exercise04.match_reported_statement:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "сказал", right: "said"}
          - {left: "что", right: "that"}
          - {left: "придёт", right: "will come"}
          - {left: "без изменения времени", right: "without changing the tense"}
          - {left: "офис", right: "office"}
          - {left: "позже", right: "later"}
        status: "correct"
    feedback: "These build reported statements in the original tense."
  ru.b1.unit43.lesson01.exercise05.order_reported_statement: {instruction: "Put the words in order to say \"Dima said that he will come to the office.\"", accepted_answers: [{value: ["Дима", "сказал", "что", "он", "придёт", "в", "офис"], status: "correct"}], feedback: "The correct order is *Дима сказал, что он придёт в офис*."}
  ru.b1.unit43.lesson01.exercise06.write_reported_statement:
    instruction: "Write exactly this reported-speech sentence with сказал, что: Dima said that he will come to the office. (Keep the original future tense — do not backshift it.)"
    accepted_answers:
      - {value: "Дима сказал, что он придёт в офис.", status: "correct"}
      - {value: "Дима сказал что он придёт в офис.", status: "correct"}
      - {value: "Дима сказал, что он придёт в офис", status: "correct"}
      - {value: "Дима сказал что он придёт в офис", status: "correct"}
      - {value: "Дима сказал, что придёт в офис.", status: "correct"}
      - {value: "Дима сказал, что он придет в офис.", status: "correct"}
      - {value: "Дима сказал, что придет в офис.", status: "correct"}
    feedback: "The model answer is *Дима сказал, что он придёт в офис*."
  ru.b1.unit43.lesson02.exercise01.recognize_reported_yesno_question: {instruction: "Which Russian sentence means \"Nastya asked whether he would come\"?", correct_option: "настя спросила придёт ли он", distractors: ["дима сказал что он придёт в офис", "она спросила что он делает", "настя сказала что дима придёт позже"], accepted_answers: [{value: "настя спросила придёт ли он", status: "correct"}], feedback: "*придёт ли он* reports a yes/no question."}
  ru.b1.unit43.lesson02.exercise02.recognize_sprosila_chto: {instruction: "Which Russian sentence means \"she asked what he is doing\"?", correct_option: "она спросила что он делает", distractors: ["настя спросила придёт ли он", "дима сказал что он придёт в офис", "он сказал что придёт после обеда"], accepted_answers: [{value: "она спросила что он делает", status: "correct"}], feedback: "*спросила, что он делает* reports a wh-question."}
  ru.b1.unit43.lesson02.exercise03.listen_select_reported_question: {instruction: "Listen. What did Nastya ask?", correct_option: "Whether he would come.", distractors: ["What he is doing.", "When the meeting starts.", "Where the office is."], accepted_answers: [{value: "Whether he would come.", status: "correct"}], feedback: "The recording says *Настя спросила, придёт ли он*."}
  ru.b1.unit43.lesson02.exercise04.match_reported_question:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "спросила", right: "asked"}
          - {left: "ли", right: "whether"}
          - {left: "делает", right: "is doing"}
          - {left: "стоит после глагола", right: "comes after the verb"}
          - {left: "придёт ли он", right: "whether he would come"}
          - {left: "что он делает", right: "what he is doing"}
        status: "correct"
    feedback: "These build reported yes/no and wh-questions."
  ru.b1.unit43.lesson02.exercise05.order_reported_question: {instruction: "Put the words in order to say \"Nastya asked whether he would come.\"", accepted_answers: [{value: ["Настя", "спросила", "придёт", "ли", "он"], status: "correct"}], feedback: "The correct order is *Настя спросила, придёт ли он*."}
  ru.b1.unit43.lesson02.exercise06.write_reported_question:
    instruction: "Write exactly this reported yes/no question with ли: Nastya asked whether he would come."
    accepted_answers:
      - {value: "Настя спросила, придёт ли он.", status: "correct"}
      - {value: "Настя спросила придёт ли он.", status: "correct"}
      - {value: "Настя спросила, придёт ли он", status: "correct"}
      - {value: "Настя спросила придёт ли он", status: "correct"}
      - {value: "Настя спросила, придет ли он.", status: "correct"}
    feedback: "The model answer is *Настя спросила, придёт ли он*."
  ru.b1.unit43.lesson03.exercise01.choose_complete_reported_speech: {instruction: "Which answer reports both what Dima said AND what Nastya asked him, in indirect speech without backshifting the tense?", correct_option: "Дима сказал, что он придёт в офис. Я спросила, придёт ли он сегодня. Он сказал, что придёт после обеда.", distractors: ["Если будет дождь, мы останемся дома.", "Когда я прихожу домой, я готовлю ужин.", "Я работаю, чтобы зарабатывать деньги."], accepted_answers: [{value: "Дима сказал, что он придёт в офис. Я спросила, придёт ли он сегодня. Он сказал, что придёт после обеда.", status: "correct"}], feedback: "The correct answer reports a statement, a yes/no question, and the reply, all in the original tense."}
  ru.b1.unit43.lesson03.exercise02.dialogue_comprehension_reported_speech:
    instruction: "Listen to the dialogue. What does Nastya report?"
    correct_option: "Dima said he'll come to the office; she asked whether he'd come today; he said he'll come after lunch"
    distractors: ["Dima said he'll cook dinner; she asked when; he said tomorrow", "Dima said he'll stay home if it rains; she asked why", "Dima said he read a letter; she asked what happened"]
    accepted_answers: [{value: "Dima said he'll come to the office; she asked whether he'd come today; he said he'll come after lunch", status: "correct"}]
    feedback: "Nastya reports the statement, her own question, and the answer, all without backshifting the tense."
  ru.b1.unit43.lesson03.exercise03.match_dialogue_reported_speech:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Что сказал Дима?", right: "What did Dima say?"}
          - {left: "Дима сказал, что он придёт в офис.", right: "Dima said that he will come to the office."}
          - {left: "А вы спросили, когда?", right: "And did you ask when?"}
          - {left: "я спросила, придёт ли он сегодня", right: "I asked whether he would come today"}
          - {left: "он сказал, что придёт после обеда", right: "he said that he'll come after lunch"}
          - {left: "после обеда", right: "after lunch"}
        status: "correct"
    feedback: "These phrases build the full reported-speech conversation."
  ru.b1.unit43.lesson03.exercise04.order_after_lunch: {instruction: "Put the words in order to say \"He said that he'll come after lunch.\"", accepted_answers: [{value: ["Он", "сказал", "что", "придёт", "после", "обеда"], status: "correct"}], feedback: "The correct order is *Он сказал, что придёт после обеда*."}
  ru.b1.unit43.lesson03.exercise05.reply_what_dima_said:
    instruction: "Коллега asks \"Настя, что сказал Дима?\" Answer with exactly this sentence: \"Дима сказал, что он придёт в офис.\""
    accepted_answers:
      - {value: "Дима сказал, что он придёт в офис.", status: "correct"}
      - {value: "Дима сказал что он придёт в офис.", status: "correct"}
      - {value: "Дима сказал, что он придет в офис.", status: "correct"}
    feedback: "The model answer reports Dima's statement in the original tense."
  ru.b1.unit43.lesson03.exercise06.write_full_reported_exchange:
    instruction: "As Настя, write three sentences reporting the exchange: report what Dima said (he will come to the office), report the yes/no question you asked him (whether he would come today) using ли, and report his answer (he'll come after lunch). Keep the original tense in every что-clause."
    accepted_answers:
      - {value: "Дима сказал, что он придёт в офис. Я спросила, придёт ли он сегодня. Он сказал, что придёт после обеда.", status: "correct"}
      - {value: "Дима сказал что он придёт в офис. Я спросила придёт ли он сегодня. Он сказал что придёт после обеда.", status: "correct"}
      - {value: "Дима сказал, что он придет в офис. Я спросила, придет ли он сегодня. Он сказал, что придет после обеда.", status: "correct"}
      - {value: "Дима сказал, что он придёт в офис. Я спросила, придёт ли он сегодня. Он сказал, что он придёт после обеда.", status: "correct"}
      - {value: "Дима сказал, что он придет в офис. Я спросила, придет ли он сегодня. Он сказал, что он придет после обеда.", status: "correct"}
      - {value: "Дима сказал, что придёт в офис. Я спросила, придёт ли он сегодня. Он сказал, что придёт после обеда.", status: "correct"}
      - {value: "Дима сказал, что придет в офис. Я спросила, придет ли он сегодня. Он сказал, что придет после обеда.", status: "correct"}
      - {value: "Дима сказал, что придёт в офис. Я спросила, придёт ли он сегодня. Он сказал, что он придёт после обеда.", status: "correct"}
      - {value: "Дима сказал, что придет в офис. Я спросила, придет ли он сегодня. Он сказал, что он придет после обеда.", status: "correct"}
    feedback: "A complete answer reports the statement, the yes/no question, and the reply, all in the original tense."
  ru.b1.unit43.lesson01.chto_skazal_dima.exercise07.dictation:
