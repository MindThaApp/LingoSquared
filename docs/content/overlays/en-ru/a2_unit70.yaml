review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the Russian past-tense unit (aspect pairs, когда and пока). OPEN NATIVE QUESTIONS: (1) is \"Когда Дима ехал домой, вдруг автобус остановился\" natural or should it be \"вдруг остановился автобус\"; (2) is \"Автобус уже поехал\" a natural way to say the bus has set off; (3) is \"Настя звонила Диме\" (imperfective) acceptable beside \"Настя позвонила Диме\"; (4) is \"Пока Дима готовил, Настя читала\" / \"Когда Дима ждал автобус, шёл дождь\" fully natural with когда as accepted variants."}
course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian for telling what was going on when something else happened."
  learning_goal: "Describe a small incident in the past using imperfective and perfective verbs, когда and пока."
units:
  ru.a2.unit70.chto_proishodilo: {"title": "What was happening", "description": "Say what was going on in the background and what suddenly happened, using aspect pairs, когда and пока."}
lessons:
  ru.a2.unit70.lesson01.fon_shyol_dozhd: {"title": "What was going on"}
  ru.a2.unit70.lesson02.protsess_i_rezultat: {"title": "Process or result"}
  ru.a2.unit70.lesson03.kogda_vdrug: {"title": "When something happened"}
  ru.a2.unit70.lesson04.poka_odnovremenno: {"title": "While two things happened"}
  ru.a2.unit70.lesson05.soobshchenie_dimy: {"title": "Dima's message"}
  ru.a2.unit70.lesson06.zvonok_v_probke: {"title": "Where were you when I called?"}
teaching:
  ru.a2.unit70.lesson01.teach.pogoda: {"title": "Weather and traffic", "gloss": "it was raining / it was cold / there was a traffic jam / the bus was standing", "note": "The imperfective past describes the background: what was going on. *Шёл* belongs to *дождь* (masculine), *было* to *холодно* (neuter), *была* to *пробка* (feminine).", "example_gloss": ["It rained yesterday.", "It was cold in the evening.", "There was a traffic jam outside.", "The bus was standing."]}
  ru.a2.unit70.lesson01.teach.glagoly: {"title": "Verbs of activity", "gloss": "was reading / was writing / was watching / was cooking / was doing", "note": "These imperfective past forms show an action in progress.", "example_gloss": ["Dima was reading a book.", "Nastya was writing a letter.", "Dima was watching a film.", "Nastya was cooking dinner.", "What was Dima doing?"]}
  ru.a2.unit70.lesson01.teach.lyudi: {"title": "People and pronouns", "gloss": "Nastya / Dima / I / you / he / she / we / they", "note": "Nastya is a teacher and Dima is an engineer. The two are friends and use *ты* with each other.", "example_gloss": ["Nastya is a teacher and Dima is an engineer.", "Nastya and Dima are friends.", "We were reading and they were writing.", "Dima, what were you doing yesterday?"]}
  ru.a2.unit70.lesson01.teach.gn_proshedshee: {"title": "The past tense ending", "gloss": "he was reading, she was reading, we were reading, it was cold", "note": "The past tense is built from the infinitive stem plus *-л* (masculine), *-ла* (feminine), *-ло* (neuter) or *-ли* (plural). The ending agrees with the gender of the subject, not with the person: a woman says *я читала*, a man *я читал*."}
  ru.a2.unit70.lesson01.teach.gn_chto_delal: {"title": "What was he doing?", "gloss": "What was Dima doing? What was Nastya doing? What were they doing?", "note": "*Что делал...?* asks about an action in progress. The verb agrees with the subject: *делал* (masculine), *делала* (feminine), *делали* (plural)."}
  ru.a2.unit70.lesson02.teach.pary1: {"title": "Aspect pairs, part 1", "gloss": "was reading and read / was writing and wrote / was watching and watched", "note": "The first verb of each pair is imperfective (process), the second perfective (finished result). The perfective is usually formed with a prefix: *про-, на-, по-*.", "example_gloss": ["Dima read the book for a long time.", "Dima finished the book.", "Nastya wrote the letter for a long time.", "Nastya wrote the letter.", "Dima was watching a film.", "Dima watched the film."]}
  ru.a2.unit70.lesson02.teach.pary2: {"title": "Aspect pairs, part 2", "gloss": "was cooking and cooked / was doing and did / was calling and called", "note": "Same contrast with three more pairs. *Приготовить* and *сделать* name the result; *позвонить* names one completed call.", "example_gloss": ["Nastya was cooking dinner.", "Nastya cooked dinner.", "Dima was doing his work.", "Dima did his work.", "Nastya was calling Dima.", "Nastya called Dima."]}
  ru.a2.unit70.lesson02.teach.narechiya: {"title": "Time words", "gloss": "for a long time / then / suddenly / finally", "note": "*Долго* fits a process (imperfective); *вдруг* and *наконец* fit a single event (perfective). *Упал* is the perfective of 'to fall'.", "example_gloss": ["Dima walked home for a long time.", "Then he read the book.", "Suddenly it started to rain.", "Finally she called.", "Suddenly a glass fell."]}
  ru.a2.unit70.lesson02.teach.gn_vid1: {"title": "Process and result", "gloss": "Dima was reading the book. Dima read (finished) the book.", "note": "The imperfective (*читал*) names the process and does not say whether it ended. The perfective (*прочитал*) names a completed action with a result."}
  ru.a2.unit70.lesson02.teach.gn_vid2: {"title": "Sudden events", "gloss": "It was raining. Suddenly it started to rain. Suddenly Nastya called.", "note": "The perfective *пошёл* means the rain began: a single event. The imperfective *шёл* means it was already going on. *Вдруг* goes with perfective verbs."}
  ru.a2.unit70.lesson02.teach.gn_vid3: {"title": "Делал or сделал", "gloss": "What was Dima doing? What did Dima do (get done)?", "note": "*Что делал?* asks about the activity in progress; *Что сделал?* asks about the result."}
  ru.a2.unit70.lesson03.teach.vremya: {"title": "Time and place", "gloss": "when / (to) home / at home / at this time / at this moment", "note": "*Домой* shows direction, *дома* shows location. *В этот момент* points to a single event.", "example_gloss": ["When I was walking home, it started to rain.", "Dima was at home.", "At that time Nastya was cooking dinner.", "At that moment a glass fell."]}
  ru.a2.unit70.lesson03.teach.sobytiya: {"title": "A small incident", "gloss": "was riding / stopped / heard / answered / window / telephone", "note": "*Ехал* is for going by vehicle. *Слышать* is 'to hear' (imperfective); *ответить* and *остановиться* are perfective.", "example_gloss": ["Dima was going home by bus.", "Suddenly the bus stopped.", "Nastya did not hear the phone.", "Dima did not answer.", "Dima was looking out of the window."]}
  ru.a2.unit70.lesson03.teach.gn_kogda1: {"title": "Когда: background and event", "gloss": "When I was walking home, it started to rain. When Dima was going home, the bus stopped.", "note": "After *когда* the long action is imperfective (*шёл, ехал*); the sudden event in the main clause is perfective (*пошёл, остановился*). A comma separates the clauses."}
  ru.a2.unit70.lesson03.teach.gn_kogda2: {"title": "What were you doing when...", "gloss": "What were you doing (m.) when I called (f.)? What were you doing (f.) when Dima called?", "note": "The question uses the imperfective *делал/делала* for the background and the perfective *позвонил/позвонила* for the event. The gender follows the person asked or the person who called."}
  ru.a2.unit70.lesson03.teach.gn_poryadok: {"title": "Changing the order", "gloss": "It started to rain when I was walking home. The bus stopped when Dima was going home.", "note": "The two clauses can swap places without changing the meaning. The comma stays before *когда*."}
  ru.a2.unit70.lesson04.teach.poka: {"title": "While", "gloss": "while / was listening / was waiting / was sitting / music", "note": "*Пока* means 'while' and joins two actions happening at the same time.", "example_gloss": ["While Dima was waiting, he listened to music.", "While Nastya was cooking, Dima was sitting at home.", "While the bus was standing, Dima looked out of the window.", "We were waiting for the bus."]}
  ru.a2.unit70.lesson04.teach.zanyatiya: {"title": "More activities", "gloss": "was drinking / tea / was talking / on the phone", "note": "*Пила* is feminine, *разговаривал* masculine. *По телефону* means 'on the phone'.", "example_gloss": ["Dima was talking on the phone.", "Nastya was drinking tea.", "While Dima was talking on the phone, Nastya was drinking tea."]}
  ru.a2.unit70.lesson04.teach.gn_poka: {"title": "Пока with two imperfectives", "gloss": "While I was cooking, Nastya was reading. While Dima was waiting, he was listening to music.", "note": "Two actions at the same time: both verbs are imperfective. A woman would say *Пока я готовила*."}
  ru.a2.unit70.lesson04.teach.gn_poka_kogda: {"title": "Пока or когда", "gloss": "While Dima was talking, Nastya was drinking tea. When Dima called, Nastya was drinking tea.", "note": "*Пока* links two long actions. *Когда* + perfective (*позвонил*) names one moment, during which the other action was in progress."}
  ru.a2.unit70.lesson04.teach.gn_dozhd: {"title": "Weather as background", "gloss": "While Dima was waiting for the bus, it was raining. While it was raining, it was cold.", "note": "Weather and states also work as the second imperfective: *шёл дождь*, *было холодно*."}
  ru.a2.unit70.lesson05.teach.slova: {"title": "Words for a message", "gloss": "hi / message / your / to you", "note": "*Твоё* agrees with the neuter *сообщение*. *Тебе* is 'to you'.", "example_gloss": ["Hi, Nastya!", "Dima read your message.", "Nastya called you."]}
  ru.a2.unit70.lesson05.teach.gn_no: {"title": "Но, слушать and слышать", "gloss": "Nastya was calling, but Dima did not answer. Dima was listening to music, but did not hear the phone.", "note": "*Но* means 'but'. *Слушать* is to listen on purpose; *слышать* is to hear."}
  ru.a2.unit70.lesson05.teach.reading: {"title": "Dima writes to Nastya", "gloss": "Hi, Nastya! Yesterday evening I was going home by bus. It was raining and it was cold. Suddenly the bus stopped. There was a traffic jam. While the bus was standing, I looked out of the window and listened to music. At that time you were calling, but I did not hear the phone. Then I read your message and called you. Dima", "note": "Notice the pattern: imperfective verbs set the scene (*ехал, шёл, стоял*), perfective verbs move the story forward (*остановился, прочитал, позвонил*).", "glosses": {"вдруг": "suddenly", "пробка": "traffic jam", "сообщение": "message", "окно": "window"}}
  ru.a2.unit70.lesson06.teach.vopros: {"title": "Nastya asks", "gloss": "Nastya: Dima, what were you doing when I called?"}
  ru.a2.unit70.lesson06.teach.otvet: {"title": "Dima answers", "gloss": "Dima: I was going home by bus. It was raining and there was a traffic jam."}
  ru.a2.unit70.lesson06.teach.ne_otvetil: {"title": "Nastya says she called", "gloss": "Nastya: I was calling, but you did not answer."}
  ru.a2.unit70.lesson06.teach.izvini: {"title": "Dima apologises", "gloss": "Dima: Sorry! The bus was standing and I was listening to music."}
  ru.a2.unit70.lesson06.teach.poka: {"title": "Nastya says what she did", "gloss": "Nastya: While you were standing in the traffic jam, I was cooking dinner."}
  ru.a2.unit70.lesson06.teach.poehal: {"title": "Dima ends the call", "gloss": "Dima: Good! The bus has already set off."}
exercises:
  ru.a2.unit70.lesson01.exercise01.choose_rain: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Шёл дождь.", "distractors": ["Шла дождь.", "Шло дождь.", "Шли дождь."], "accepted_answers": [{"value": "Шёл дождь.", "status": "correct"}], "feedback": "*Дождь* is masculine, so the past form is *шёл*."}
  ru.a2.unit70.lesson01.exercise02.choose_read: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя читала.", "distractors": ["Настя читал.", "Настя читало.", "Настя читали."], "accepted_answers": [{"value": "Настя читала.", "status": "correct"}], "feedback": "*Настя* is feminine, so the verb ends in *-ла*."}
  ru.a2.unit70.lesson01.exercise03.match_background: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "Шёл дождь.", "right": "It was raining."}, {"left": "Было холодно.", "right": "It was cold."}, {"left": "Была пробка.", "right": "There was a traffic jam."}, {"left": "Автобус стоял.", "right": "The bus was standing."}, {"left": "Дима читал книгу.", "right": "Dima was reading a book."}, {"left": "Настя готовила ужин.", "right": "Nastya was cooking dinner."}], "status": "correct"}], "feedback": "All six sentences use the imperfective past to describe a situation or an ongoing action."}
  ru.a2.unit70.lesson01.exercise04.order_cold: {"instruction": "Put the words in order to say 'It was cold yesterday evening.'", "correct_option": "Вчера вечером было холодно", "accepted_answers": [{"value": "Вчера вечером было холодно", "status": "correct"}, {"value": "Было холодно вчера вечером", "status": "correct"}], "feedback": "*Было холодно* stays together; the time words can come first or last."}
  ru.a2.unit70.lesson01.exercise05.complete_bylo: {"instruction": "Choose the past form of 'to be' that fits an impersonal weather sentence.", "correct_option": "было", "distractors": ["была", "был", "были"], "accepted_answers": [{"value": "было", "status": "correct"}], "feedback": "Weather sentences with *холодно* use the neuter form: *было холодно*."}
  ru.a2.unit70.lesson01.exercise06.translate_rain_cold: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Шёл дождь, и было холодно.", "status": "correct"}, {"value": "Шёл дождь, и было холодно", "status": "correct"}, {"value": "Шёл дождь и было холодно.", "status": "correct"}, {"value": "Шёл дождь и было холодно", "status": "correct"}, {"value": "Шёл дождь, было холодно.", "status": "correct"}, {"value": "Шёл дождь, было холодно", "status": "correct"}], "feedback": "*Шёл дождь, и было холодно.* Both parts are background."}
  ru.a2.unit70.lesson01.exercise07.write_dima_read: {"instruction": "Write the requested Russian sentence.", "correct_option": "Дима читал книгу.", "accepted_answers": [{"value": "Дима читал книгу.", "status": "correct"}, {"value": "Дима читал книгу", "status": "correct"}], "feedback": "*Дима читал книгу.* = Dima was reading a book."}
  ru.a2.unit70.lesson02.exercise01.choose_finished: {"instruction": "Choose the sentence that says Dima finished the book.", "correct_option": "Дима прочитал книгу.", "distractors": ["Дима читал книгу.", "Дима прочитала книгу.", "Дима прочитали книгу."], "accepted_answers": [{"value": "Дима прочитал книгу.", "status": "correct"}], "feedback": "The perfective *прочитал* gives the finished result."}
  ru.a2.unit70.lesson02.exercise02.choose_long: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя долго писала письмо.", "distractors": ["Настя долго написала письмо.", "Настя долго писал письмо.", "Настя долго писали письмо."], "accepted_answers": [{"value": "Настя долго писала письмо.", "status": "correct"}], "feedback": "*Долго* describes a process, so the imperfective *писала* fits."}
  ru.a2.unit70.lesson02.exercise03.match_aspect: {"instruction": "Match each Russian verb form to its English meaning.", "accepted_answers": [{"value": [{"left": "читал", "right": "was reading"}, {"left": "прочитал", "right": "read (finished)"}, {"left": "писала", "right": "was writing"}, {"left": "написала", "right": "wrote (finished)"}, {"left": "смотрел", "right": "was watching"}, {"left": "посмотрел", "right": "watched (finished)"}, {"left": "готовила", "right": "was cooking"}, {"left": "приготовила", "right": "cooked (finished)"}, {"left": "звонила", "right": "was calling"}, {"left": "позвонила", "right": "called (once)"}], "status": "correct"}], "feedback": "In each pair the first form is a process and the second a finished action."}
  ru.a2.unit70.lesson02.exercise04.order_letter: {"instruction": "Put the words in order to say 'Then Nastya wrote the letter.'", "correct_option": "Потом Настя написала письмо", "accepted_answers": [{"value": "Потом Настя написала письмо", "status": "correct"}, {"value": "Настя потом написала письмо", "status": "correct"}], "feedback": "The perfective *написала* describes the finished result."}
  ru.a2.unit70.lesson02.exercise05.complete_pro: {"instruction": "Choose the masculine past verb that shows Dima finished the book.", "correct_option": "прочитал", "distractors": ["читала", "прочитала", "прочитали"], "accepted_answers": [{"value": "прочитал", "status": "correct"}], "feedback": "*Потом* introduces a completed step, so the perfective *прочитал* fits."}
  ru.a2.unit70.lesson02.exercise06.translate_wrote: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Настя написала письмо.", "status": "correct"}, {"value": "Настя написала письмо", "status": "correct"}], "feedback": "*Написала* is the perfective of *писать*."}
  ru.a2.unit70.lesson02.exercise07.write_cooked: {"instruction": "Write the two requested Russian sentences.", "correct_option": "Настя долго готовила ужин. Потом она приготовила ужин.", "accepted_answers": [{"value": "Настя долго готовила ужин. Потом она приготовила ужин.", "status": "correct"}, {"value": "Настя долго готовила ужин. Потом она приготовила ужин", "status": "correct"}, {"value": "Настя долго готовила ужин. Потом Настя приготовила ужин.", "status": "correct"}, {"value": "Настя долго готовила ужин. Потом Настя приготовила ужин", "status": "correct"}], "feedback": "First the process (*готовила*), then the result (*приготовила*)."}
  ru.a2.unit70.lesson03.exercise01.choose_kogda: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Когда Дима шёл домой, пошёл дождь.", "distractors": ["Когда Дима пошёл домой, пошёл дождь.", "Когда Дима шли домой, пошёл дождь.", "Когда Дима шёл домой, пошла дождь."], "accepted_answers": [{"value": "Когда Дима шёл домой, пошёл дождь.", "status": "correct"}], "feedback": "Background *шёл*, event *пошёл*."}
  ru.a2.unit70.lesson03.exercise02.choose_question: {"instruction": "Choose the correct Russian question.", "correct_option": "Что делала Настя, когда Дима позвонил?", "distractors": ["Что делал Настя, когда Дима позвонил?", "Что сделала Настя, когда Дима позвонил?", "Что делали Настя, когда Дима позвонил?"], "accepted_answers": [{"value": "Что делала Настя, когда Дима позвонил?", "status": "correct"}], "feedback": "*Настя* is feminine: *делала*."}
  ru.a2.unit70.lesson03.exercise03.match_event: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "в это время", "right": "at that time"}, {"left": "в этот момент", "right": "at that moment"}, {"left": "вдруг", "right": "suddenly"}, {"left": "Дима ехал домой", "right": "Dima was going home"}, {"left": "автобус остановился", "right": "the bus stopped"}, {"left": "Дима не ответил", "right": "Dima did not answer"}, {"left": "Настя не слышала телефон", "right": "Nastya did not hear the phone"}, {"left": "Что ты делал?", "right": "What were you doing?"}], "status": "correct"}], "feedback": "These phrases build the story of a small incident."}
  ru.a2.unit70.lesson03.exercise04.order_stop: {"instruction": "Put the words in order to say 'When Dima was going home, the bus stopped.'", "correct_option": "Когда Дима ехал домой автобус остановился", "accepted_answers": [{"value": "Когда Дима ехал домой автобус остановился", "status": "correct"}, {"value": "Автобус остановился когда Дима ехал домой", "status": "correct"}], "feedback": "Either clause may come first; a comma separates them."}
  ru.a2.unit70.lesson03.exercise05.complete_stopped: {"instruction": "Choose the past form that agrees with the bus (masculine).", "correct_option": "остановился", "distractors": ["остановилась", "остановились", "остановилось"], "accepted_answers": [{"value": "остановился", "status": "correct"}], "feedback": "*Автобус* is masculine, so the verb ends in *-ся* after *-л*: *остановился*."}
  ru.a2.unit70.lesson03.exercise06.translate_cooking_call: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Когда Настя готовила, Дима позвонил.", "status": "correct"}, {"value": "Когда Настя готовила, Дима позвонил", "status": "correct"}, {"value": "Когда Настя готовила ужин, Дима позвонил.", "status": "correct"}, {"value": "Когда Настя готовила ужин, Дима позвонил", "status": "correct"}, {"value": "Дима позвонил, когда Настя готовила.", "status": "correct"}, {"value": "Дима позвонил, когда Настя готовила", "status": "correct"}, {"value": "Дима позвонил, когда Настя готовила ужин.", "status": "correct"}, {"value": "Дима позвонил, когда Настя готовила ужин", "status": "correct"}], "feedback": "Background *готовила*, event *позвонил*."}
  ru.a2.unit70.lesson03.exercise07.write_walking_rain: {"instruction": "Write the requested Russian sentence.", "correct_option": "Когда я шёл домой, пошёл дождь.", "accepted_answers": [{"value": "Когда я шёл домой, пошёл дождь.", "status": "correct"}, {"value": "Когда я шёл домой, пошёл дождь", "status": "correct"}, {"value": "Когда я шла домой, пошёл дождь.", "status": "correct"}, {"value": "Когда я шла домой, пошёл дождь", "status": "correct"}, {"value": "Пошёл дождь, когда я шёл домой.", "status": "correct"}, {"value": "Пошёл дождь, когда я шёл домой", "status": "correct"}, {"value": "Пошёл дождь, когда я шла домой.", "status": "correct"}, {"value": "Пошёл дождь, когда я шла домой", "status": "correct"}], "feedback": "Use *шёл* for a man and *шла* for a woman; the event is always *пошёл дождь*."}
  ru.a2.unit70.lesson04.exercise01.choose_poka_wait: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Пока Дима ждал, он слушал музыку.", "distractors": ["Пока Дима ждал, он слушали музыку.", "Пока Дима ждала, он слушал музыку.", "Пока Дима ждал, она слушал музыку."], "accepted_answers": [{"value": "Пока Дима ждал, он слушал музыку.", "status": "correct"}], "feedback": "Both verbs are imperfective and agree with the subject."}
