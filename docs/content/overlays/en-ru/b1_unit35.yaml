      - {value: "Сейчас я могу сказать что документ готов.", status: "correct"}
      - {value: "Сейчас я могу сказать, что документ готов", status: "correct"}
      - {value: "Сейчас я могу сказать что документ готов", status: "correct"}
      - {value: "Я сейчас могу сказать, что документ готов.", status: "correct"}
      - {value: "Я сейчас могу сказать, что документ готов", status: "correct"}
    feedback: "The model answer is *Сейчас я могу сказать, что документ готов*."
  ru.b1.unit35.lesson02.exercise01.recognize_ranshe_mog: {instruction: "Which Russian phrase means \"before, I could\" for a male speaker?", correct_option: "раньше я мог", distractors: ["сейчас я могу", "я должен", "мне нужно"], accepted_answers: [{value: "раньше я мог", status: "correct"}], feedback: "*Раньше я мог* means \"before, I could\" for a male speaker."}
  ru.b1.unit35.lesson02.exercise02.recognize_gde_ofis: {instruction: "Which Russian clause means \"where the office is\"?", correct_option: "где офис", distractors: ["что документ готов", "что адрес правильный", "если будет время"], accepted_answers: [{value: "где офис", status: "correct"}], feedback: "*где офис* means \"where the office is.\""}
  ru.b1.unit35.lesson02.exercise03.listen_select_past_ability: {instruction: "Listen. What could the speaker explain before?", correct_option: "Where the office is.", distractors: ["That the document is ready.", "That a rule is strict.", "That he must call."], accepted_answers: [{value: "Where the office is.", status: "correct"}], feedback: "The recording says *Раньше я мог объяснить, где офис*."}
  ru.b1.unit35.lesson02.exercise04.match_past_hypothetical_ability:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Раньше я мог", right: "Before, I could"}
          - {left: "объяснить, где офис", right: "explain where the office is"}
          - {left: "Если бы было время", right: "If there were time"}
