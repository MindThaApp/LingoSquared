course:
  title: "Russian B1"
  description: "Learn B1-level Russian for saying what you can or could do using embedded clauses."

units:
  ru.b1.unit35.umenija: {title: "Abilities"}

lessons:
  ru.b1.unit35.lesson01.mogu_skazat_chto: {title: "I can say that..."}
  ru.b1.unit35.lesson02.mog_objasnit_gde: {title: "I could explain where..."}
  ru.b1.unit35.lesson03.ofis_dialogue: {title: "Dialogue: what Dima can do"}

teaching:
  ru.b1.unit35.lesson01.teach.seychas_mogu: {title: "Сейчас я могу сказать, что документ готов.", gloss: "Now I can say that the document is ready.", note: "Use *могу сказать, что...* to state what you can say, then add the full embedded clause.", example_gloss: "Dima, now I can say that the document is ready."}
  ru.b1.unit35.lesson01.teach.vy_mozhete: {title: "Вы можете сказать, что документ готов?", gloss: "Can you say that the document is ready?", note: "*Вы можете* is the formal question form.", example_gloss: "Dima, can you say that the document is ready?"}
  ru.b1.unit35.lesson01.teach.dima: {title: "Дима", gloss: "Dima", note: "*Дима* is the everyday short form of the name *Дмитрий*. Дима is an engineer.", example_gloss: "Dima can say that the document is ready."}
  ru.b1.unit35.lesson02.teach.ranshe_mog: {title: "Раньше я мог объяснить, где офис.", gloss: "Before, I could explain where the office is.", note: "*мог* is the past form for a male speaker.", example_gloss: "Dima, before, I could explain where the office is."}
  ru.b1.unit35.lesson02.teach.mogli: {title: "Вы могли объяснить, где офис?", gloss: "Could you explain where the office is?", note: "*могли* works with formal *вы*.", example_gloss: "Dima, could you explain where the office is?"}
  ru.b1.unit35.lesson02.teach.esli_by: {title: "Если бы было время, я мог бы проверить, что адрес правильный.", gloss: "If there were time, I could check that the address is correct.", note: "*Если бы... мог бы...* marks a hypothetical ability.", example_gloss: "Dima, if there were time, I could check that the address is correct."}
  ru.b1.unit35.lesson03.teach.staff_greeting: {title: "The employee greets Dima", gloss: "Employee: Hello, Dima.", note: "*Здравствуйте* is the formal greeting used in the office dialogue."}
  ru.b1.unit35.lesson03.teach.dima_greeting: {title: "Dima returns the greeting", gloss: "Dima: Hello.", note: "*Здравствуйте* is also the polite reply to a formal greeting."}
  ru.b1.unit35.lesson03.teach.staff_present: {title: "The employee asks about present ability", gloss: "Employee: Dima, can you say that the document is ready?", note: "The question uses formal *вы* in an office setting."}
  ru.b1.unit35.lesson03.teach.dima_present: {title: "Dima answers about present ability", gloss: "Dima: Yes, now I can say that the document is ready.", note: "This gives present ability plus an embedded clause."}
  ru.b1.unit35.lesson03.teach.staff_past: {title: "The employee asks about past ability", gloss: "Employee: And before, could you explain where the office is?", note: "This asks about a past ability with *могли*."}
  ru.b1.unit35.lesson03.teach.dima_past_hypothetical: {title: "Dima contrasts past and hypothetical ability", gloss: "Dima: Yes, before I could explain where the office is. If there were time, I could check that the address is correct.", note: "This contrasts past ability and hypothetical ability."}

exercises:
