  ru.b1.unit35.lesson01.exercise02.recognize_chto_gotov: {instruction: "Which Russian clause means \"that the document is ready\"?", correct_option: "что документ готов", distractors: ["где офис", "если бы было время", "что адрес правильный"], accepted_answers: [{value: "что документ готов", status: "correct"}], feedback: "*что документ готов* means \"that the document is ready.\""}
  ru.b1.unit35.lesson01.exercise03.listen_select_present_ability: {instruction: "Listen. What can the speaker say now?", correct_option: "That the document is ready.", distractors: ["Where the office is.", "That the address is wrong.", "That there is no time."], accepted_answers: [{value: "That the document is ready.", status: "correct"}], feedback: "The recording says *Сейчас я могу сказать, что документ готов*."}
  ru.b1.unit35.lesson01.exercise04.match_present_ability:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Сейчас", right: "now"}
          - {left: "я могу сказать", right: "I can say"}
          - {left: "Вы можете сказать?", right: "Can you say?"}
          - {left: "что документ готов", right: "that the document is ready"}
          - {left: "документ", right: "document"}
          - {left: "готов", right: "ready"}
        status: "correct"
    feedback: "These pieces build a present-ability sentence with an embedded clause."
  ru.b1.unit35.lesson01.exercise05.order_present_ability: {instruction: "Put the words in order to say \"Now I can say that the document is ready.\"", accepted_answers: [{value: ["Сейчас", "я", "могу", "сказать", "что", "документ", "готов"], status: "correct"}, {value: ["я", "Сейчас", "могу", "сказать", "что", "документ", "готов"], status: "correct"}], feedback: "The correct order is *Сейчас я могу сказать, что документ готов*."}
