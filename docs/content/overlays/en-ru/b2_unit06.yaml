review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Overlay for ru's B2 abstraction unit, authored alongside the
    realization (no adaptable intermediate/upper-level public-domain
    Russian source exists for this topic; see the realization provenance
    note). English speakers' real interference risks for this outcome: (1)
    English learners tend to state a flat opinion ("I think X") and stop;
    the unit forces a QUALIFIED opinion (opinion frame + a qualifier such
    as до некоторой степени / не обязательно) and a DIRECT response to an
    opposing view, not a restatement of one's own; (2) 'не обязательно' is
    "not necessarily", not "not obligatory" in the narrow bureaucratic
    sense -- glossed to keep the everyday reading; (3) 'это правда, но...'
    and 'я понимаю твою мысль, но всё же...' are concession-then-pushback
    moves (agree on a point, then disagree), which English learners often
    flatten into a bare "but"; (4) Russian short-form predicate adjectives
    agree with the SPEAKER's grammatical gender -- убеждён/убеждена,
    согласен/согласна -- which has no English analogue at all; every
    production prompt requiring one of these forms names the specific
    speaker (Настя or Дима) so the required form is unambiguous, never left
    to the learner's own gender. The culminating lesson06 writing prompt
    names both the frame and the content required for each sentence so a
    correct answer is well-determined. No sibling-direction file (ru-en b2)
    was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked token coverage course-wide, character canon, dialogue cards
    vs audio, listen/dialogue distractors, example_glosses, overlay
    coverage, YAML booleans, internal-jargon notes, ё/е and word-order
    grading gaps. Fixes (realization + en-ru overlay):
    lesson01.teach.po_moemu gloss "in my opinion / my way" -> "in my
    opinion"; lesson01.teach.grammar_mneniya note ordering fixed (casual
    по-моему, neutral я считаю, что, firm я убеждён/убеждена, что);
    lesson02.exercise05.translate_v_celom +удаленная and
    "Удалённая/Удаленная работа в целом лучше" variants;
    lesson03.exercise07.write_ponimayu_mysl +"все же" variant;
    lesson04.teach.minus example "Есть и минус." -> "Это большой минус."
    with большой moved into its introduced_tokens (was only nominally
    introduced on grammar_vzveshivanie, whose text lacks it),
    example_gloss "That's a big disadvantage.", note glosses большой;
    lesson05.exercise01-04 read_* now show the reading passage as a ru
    target_block before the question;
    lesson06.exercise05.speak_qualified_opinion +"До некоторой степени
    это правда, но..." order and удаленная variants;
    lesson06.exercise06.write_qualified_response +"не всем это подходит"
    (taught chunk) and удаленная variants;
    lesson06.exercise07.respond_qualified instruction pinned to the
    exact content ("That is true to a certain extent, but in my opinion
    remote work is better for freedom.") +taught-order and удаленная
    variants. NATIVE FLAGS: free-standing "Это зависит" (vs "Смотря как"
    / "Это зависит от ситуации"); speak_ubezhdena puts "командная работа
    важнее" in Настя's mouth while she argues for remote work elsewhere
    (stance inconsistency, not a grading defect). DEFERRED: dictation
    lesson01.exercise08 requires "удалённая" byte-exact (dictation ё
    policy, owner decision); grader-level ё/е fold (Codex lane).

course:
  title: "Russian B2"
  description: >-
    Upper-intermediate Russian: discuss an abstract topic -- ideas and
    values -- by giving a QUALIFIED opinion (я считаю, что / по-моему + до
    некоторой степени, в целом, не обязательно, это зависит) and responding
    directly to an opposing view (это правда, но...; я понимаю твою мысль,
    но всё же...; я (не) согласен(на), потому что...), around the everyday
    debate of whether everyone should be allowed to work remotely.

units:
  ru.b2.unit06.abstrakcija:
    title: "Abstract ideas and values"
    description: Discuss an abstract topic -- weigh a value, give a qualified opinion rather than a flat one, weigh two sides, and respond directly to an opposing view.

lessons:
  ru.b2.unit06.lesson01.chto_ty_dumaesh:
    title: "What do you think?"
  ru.b2.unit06.lesson02.vzveshennoe_mnenie:
    title: "A qualified opinion"
  ru.b2.unit06.lesson03.otvet_na_vozrazhenie:
    title: "Responding to a counter-argument"
  ru.b2.unit06.lesson04.za_i_protiv:
    title: "For and against"
  ru.b2.unit06.lesson05.chtenie_mneniya:
    title: "Reading someone else's opinion"
  ru.b2.unit06.lesson06.v_razgovore:
    title: "In conversation: a qualified opinion"

teaching:
  ru.b2.unit06.lesson01.teach.rabota_udalyonno:
    title: "Many people want to work remotely."
    gloss: "Many people want to work remotely."
    note: "This unit debates one abstract question: should everyone be allowed to work remotely (*удалённо*)? *Многие* = 'many people'."
  ru.b2.unit06.lesson01.teach.ya_schitayu:
    title: "I think that..."
    gloss: "I think that... / I consider that..."
    note: "*Я считаю, что...* introduces an OPINION -- the most everyday, neutral opinion frame at B2."
    example_gloss: "I think it's a good idea."
  ru.b2.unit06.lesson01.teach.svoboda:
    title: "freedom"
    gloss: "freedom"
    note: "*Свобода* ('freedom') is one abstract VALUE at stake in this debate -- the freedom to choose where you work. Abstract-value nouns like this are the raw material of a B2 discussion."
    example_gloss: "Freedom is important."
  ru.b2.unit06.lesson01.teach.po_moemu:
    title: "in my opinion"
    gloss: "in my opinion"
    note: "*По-моему* = 'in my opinion' -- a touch more casual than *я считаю, что*, common in everyday spoken Russian."
  ru.b2.unit06.lesson01.teach.ya_ubezhdyon:
    title: "I'm convinced that... (убеждён / убеждена)"
    gloss: "I'm convinced that..."
    note: "*Я убеждён, что...* (male speaker) / *я убеждена, что...* (female speaker) -- the strongest opinion frame, for a view held firmly. Russian short-form predicate adjectives like this agree with the SPEAKER's own gender, with no English equivalent distinction."
  ru.b2.unit06.lesson01.teach.komanda:
    title: "teamwork"
    gloss: "teamwork"
    note: "*Командная работа* ('teamwork') is the opposing VALUE -- the case for working together in person. A B2 discussion weighs one value against another, not just facts."
    example_gloss: "Teamwork is important."
  ru.b2.unit06.lesson01.teach.grammar_mneniya:
    title: "I think remote work is good. In my opinion, freedom is important. I'm convinced that teamwork matters more."
    gloss: "I think remote work is good. In my opinion, freedom is important. I'm convinced that teamwork matters more."
    note: "Three ways to open an opinion: casual *по-моему*, neutral *я считаю, что*, and firm *я убеждён/убеждена, что*. At B2 you pair one of these with a QUALIFIER (next lesson) so your opinion is nuanced, not flat."

  ru.b2.unit06.lesson02.teach.do_nekotoroy_stepeni:
    title: "to a certain extent"
    gloss: "to a certain extent"
    note: "*До некоторой степени* = 'to a certain extent' -- the key QUALIFIER. It grants that something is partly true without agreeing fully. Qualifying is what turns a flat opinion into a B2 one."
  ru.b2.unit06.lesson02.teach.v_celom:
    title: "in general"
    gloss: "in general / on the whole"
    note: "*В целом* = 'in general' -- claims something is usually, not always, so. It softens a sweeping statement."
  ru.b2.unit06.lesson02.teach.ne_vsegda:
    title: "not always"
    gloss: "not always"
    note: "*Не всегда* = 'not always' -- another hedge that avoids an absolute claim."
    example_gloss: "That's not always so."
  ru.b2.unit06.lesson02.teach.ne_obyazatelno:
    title: "not necessarily"
    gloss: "not necessarily"
    note: "*Не обязательно* = 'not necessarily' (the everyday reading, not the narrower 'not obligatory'). It concedes a point may hold sometimes while denying it must always."
    example_gloss: "That's not necessarily bad."
  ru.b2.unit06.lesson02.teach.eto_zavisit:
    title: "that depends"
    gloss: "that depends / it depends"
    note: "*Это зависит* = 'that depends' -- refuses a yes/no and signals a conditional view. The most compact way to qualify: you neither agree nor disagree outright."
  ru.b2.unit06.lesson02.teach.otvetstvennost:
    title: "responsibility"
    gloss: "responsibility"
    note: "*Ответственность* ('responsibility') is another abstract value in play -- who is responsible for making remote work succeed, the individual or the team? *Каждого* = 'of everyone / each person'."
    example_gloss: "Everyone has a responsibility."
  ru.b2.unit06.lesson02.teach.grammar_nyuans:
    title: "That is true to a certain extent. In general, that's good. That depends."
    gloss: "That is true to a certain extent. In general, that's good. That depends."
    note: "A QUALIFIED opinion hedges its claim instead of asserting it flat. Reach for *до некоторой степени*, *в целом*, *не обязательно*, or *это зависит* to grant a point partly -- the core B2 move for discussing values."

  ru.b2.unit06.lesson03.teach.slozhno:
    title: "difficult"
    gloss: "difficult"
    note: "*Сложно* = 'difficult'. *Иногда* = 'sometimes' -- an honest concession this debate needs: remote work is not always simple."
    example_gloss: "Working remotely is sometimes difficult."
  ru.b2.unit06.lesson03.teach.eto_pravda_no:
    title: "That's true, but it's difficult."
    gloss: "That's true, but it's difficult."
    note: "*Это правда, но...* concedes the other person's point THEN pushes back -- the polite spine of a disagreement. You acknowledge before you object, rather than a bare 'no'."
  ru.b2.unit06.lesson03.teach.ponimayu_mysl:
    title: "I understand your point, still..."
    gloss: "I understand your point, but still... / I get your point, still..."
    note: "*Я понимаю твою мысль, но всё же...* = 'I understand your point, still...'. *Всё же* = 'still / nevertheless' -- it signals you have heard the objection and disagree anyway. *Думаю по-другому* = 'I think differently'."
  ru.b2.unit06.lesson03.teach.soglasen_soglasna:
    title: "agree (согласен / согласна)"
    gloss: "agree (male speaker: согласен; female speaker: согласна)"
    note: "*Я согласен* (male speaker) / *я согласна* (female speaker) = 'I agree' -- another short-form predicate adjective that agrees with the SPEAKER's own gender, unlike anything in English."
    example_gloss:
      - "Yes, I agree. (male speaker)"
      - "Yes, I agree. (female speaker)"
  ru.b2.unit06.lesson03.teach.ne_soglasen:
    title: "I disagree with that, because it's difficult."
    gloss: "I disagree with that, because it's difficult."
    note: "*Я с этим не согласен, потому что...* = 'I disagree with that, because...' (male speaker; a female speaker would say *не согласна*). *Этим* = 'with that'."
  ru.b2.unit06.lesson03.teach.grammar_otvet:
    title: "That's true, but it's difficult. I understand your point, still I think differently. I disagree with that, because it's difficult."
    gloss: "That's true, but it's difficult. I understand your point, still I think differently. I disagree with that, because it's difficult."
    note: "Responding to an opposing view means engaging with it, not restating your own. Concede first (*это правда* / *я понимаю твою мысль*), then push back (*но* / *всё же*), or disagree outright with a reason (*я с этим не согласен/не согласна, потому что...*)."

  ru.b2.unit06.lesson04.teach.s_odnoy_storony:
    title: "on one hand ... on the other hand"
    gloss: "on one hand ... on the other hand"
    note: "*С одной стороны ... с другой стороны ...* weighs two sides in one breath -- the hallmark of a balanced B2 opinion."
  ru.b2.unit06.lesson04.teach.plyus:
    title: "advantage"
    gloss: "the advantage / plus"
    note: "*Плюс* = 'advantage / plus'. Weighing *плюс* against *минус* is how you argue a value."
    example_gloss: "Freedom is an advantage."
  ru.b2.unit06.lesson04.teach.minus:
    title: "disadvantage"
    gloss: "the disadvantage / minus"
    note: "*Минус* = 'disadvantage / minus' -- the mirror of *плюс*. Naming both sides is what makes an opinion balanced rather than one-sided. *Большой* = 'big'."
    example_gloss: "That's a big disadvantage."
  ru.b2.unit06.lesson04.teach.obshchestvo:
    title: "society"
    gloss: "society"
    note: "*Общество* ('society') is the collective-value angle: what is good *для общества* ('for society'), not just for you. A core abstract noun for values talk."
    example_gloss: "That is good for society."
  ru.b2.unit06.lesson04.teach.effektivnost:
    title: "efficiency"
    gloss: "efficiency"
    note: "*Эффективность* = 'efficiency'. *Повышает* = 'raises / increases' -- a concrete benefit you can weigh in the abstract debate."
    example_gloss: "That raises efficiency."
  ru.b2.unit06.lesson04.teach.grammar_vzveshivanie:
    title: "On one hand there's an advantage, on the other hand there's a disadvantage. That is good for society."
    gloss: "On one hand there's an advantage, on the other hand there's a disadvantage. That is good for society."
    note: "Weighing a value means holding both sides at once: a *плюс* and a *минус*, what's good for the individual and what's good *для общества*. *С одной стороны ... с другой стороны* frames the balance explicitly."

  ru.b2.unit06.lesson05.teach.tekst:
    title: "Reading: is remote work good?"
    gloss: "I think remote work is good. On one hand that's better for freedom, on the other hand I understand that it doesn't suit everyone. To a certain extent that's true. Still, I'm convinced that teamwork doesn't suffer from it. It isn't necessarily easy, but it's worth it."
    glosses:
      считаю: "think, consider (я считаю, что = I think that)"
      удалённая: "remote (inflected form of удалённо)"
      работа: "work"
      это: "this / that"
      хорошо: "good"
      одной: "one (inflected form, in с одной стороны)"
      стороны: "side / hand (in с одной / другой стороны)"
      лучше: "better"
      свободы: "of freedom (genitive of свобода)"
      другой: "other (in с другой стороны)"
      понимаю: "understand (from понимать)"
      всем: "everyone (dative plural)"
      подходит: "suits / works for"
      некоторой: "a certain (in до некоторой степени)"
      степени: "extent (in до некоторой степени)"
      правда: "true"
      убеждён: "convinced (male speaker)"
      командная: "team (adjective, in командная работа)"
      страдает: "suffers"
      обязательно: "necessarily (in не обязательно)"
      легко: "easy"
      того: "it (in того стоит)"
      стоит: "is worth (in того стоит)"

  ru.b2.unit06.lesson06.teach.mnogikh:
    title: "for many people"
    gloss: "for many (genitive plural of многие)"
    note: "*Многих* = 'of/for many people' -- the object form of *многие* used after *для*."
    example_gloss: "That's better for many people."
  ru.b2.unit06.lesson06.teach.vse_dolzhny_v_ofise:
    title: "Everyone should work in the office."
    gloss: "Everyone should work in the office."
    note: "The opposing view this lesson's culminating task answers. *Все* = 'everyone', *должны* = 'should / must', *в офисе* = 'in the office'."
  ru.b2.unit06.lesson06.teach.dialogue_nastya_open:
    title: "Nastya: I think remote work is good. That's better for freedom."
    gloss: "Nastya: I think remote work is good. That's better for freedom."
  ru.b2.unit06.lesson06.teach.dialogue_dima_concede:
    title: "Dima: That's true, but it doesn't suit everyone."
    gloss: "Dima: That's true, but it doesn't suit everyone."
  ru.b2.unit06.lesson06.teach.dialogue_nastya_push:
    title: "Nastya: I understand your point, still it's better for many people."
    gloss: "Nastya: I understand your point, still it's better for many people."
  ru.b2.unit06.lesson06.teach.dialogue_dima_qualify:
    title: "Dima: I agree with that to a certain extent. But it depends."
    gloss: "Dima: I agree with that to a certain extent. But it depends."
  ru.b2.unit06.lesson06.teach.dialogue_nastya_conviction:
    title: "Nastya: I'm convinced that it's worth it."
    gloss: "Nastya: I'm convinced that it's worth it."
  ru.b2.unit06.lesson06.teach.dialogue_dima_final:
    title: "Dima: In my opinion, that's not necessarily better."
    gloss: "Dima: In my opinion, that's not necessarily better."
  ru.b2.unit06.lesson06.teach.grammar_vzveshennoe:
    title: "I think remote work is good, but it depends. I don't necessarily agree with that."
    gloss: "I think remote work is good, but it depends. I don't necessarily agree with that."
    note: "A real discussion mixes an opinion frame, a qualifier, and a response to the other side: state a view (*я считаю, что*), qualify it (*это зависит*, *не обязательно*), and answer the opposing view directly (*я (не) согласен/согласна*). That is exactly what you produce in this lesson's speaking and writing tasks."

exercises:
  ru.b2.unit06.lesson01.exercise01.recognize_svoboda:
    instruction: "What does this word mean?"
    correct_option: "freedom"
    distractors: ["sustainability", "responsibility", "society"]
    accepted_answers: [{value: "freedom", status: "correct"}]
    feedback: "Свобода means freedom -- one of the abstract values this unit weighs."
  ru.b2.unit06.lesson01.exercise02.listen_schitayu:
    instruction: "Listen and select what you hear."
    correct_option: "I think remote work is good."
    distractors: ["In my opinion, work is remote.", "I'm convinced that work is good.", "I think the office is better."]
    accepted_answers: [{value: "I think remote work is good.", status: "correct"}]
    feedback: "Я считаю, что удалённая работа — это хорошо means I think remote work is good -- an opinion frame plus the debated claim."
  ru.b2.unit06.lesson01.exercise03.match_opinion_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value:
          - {left: "я считаю, что", right: "I consider that / I think that"}
          - {left: "по-моему", right: "in my opinion"}
          - {left: "я убеждён", right: "I'm convinced (male speaker)"}
          - {left: "я убеждена", right: "I'm convinced (female speaker)"}
          - {left: "свобода", right: "freedom"}
          - {left: "командная работа", right: "teamwork"}
          - {left: "удалённо", right: "remotely"}
        status: "correct"
    feedback: "The opinion frames run from everyday (я считаю, что) to firm (я убеждён/убеждена); свобода and командная работа are the values in play."
  ru.b2.unit06.lesson01.exercise04.order_schitayu:
    instruction: "Put the words in order: I think remote work is good."
    accepted_answers:
      - {value: ["Я", "считаю", "что", "удалённая", "работа", "это", "хорошо"], status: "correct"}
    feedback: "Я считаю, что удалённая работа — это хорошо."
  ru.b2.unit06.lesson01.exercise05.translate_po_moemu:
    instruction: "Translate into Russian, using по-моему: In my opinion, freedom is important."
    accepted_answers:
      - {value: "По-моему свобода важна", status: "correct"}
      - {value: "По-моему, свобода важна", status: "correct"}
    feedback: "По-моему, свобода важна means in my opinion, freedom is important."
  ru.b2.unit06.lesson01.exercise06.speak_ubezhdena:
    instruction: "This is Настя's opinion. Say aloud in Russian, using я убеждена: I'm convinced that teamwork matters more."
    accepted_answers:
      - {value: "Я убеждена что командная работа важнее", status: "correct"}
    feedback: "Я убеждена, что командная работа важнее means I'm convinced that teamwork matters more (female speaker form)."
  ru.b2.unit06.lesson01.exercise07.write_schitayu:
    instruction: "Write in Russian, using я считаю: I think it's a good idea."
    accepted_answers:
      - {value: "Я считаю что это хорошая идея", status: "correct"}
      - {value: "Я считаю, что это хорошая идея", status: "correct"}
    feedback: "Я считаю, что это хорошая идея means I think it's a good idea."
  ru.b2.unit06.lesson01.exercise08.dictation_schitayu:
    instruction: "Type what you hear."
    correct_response: "Я считаю, что удалённая работа — это хорошо"
    orthography_strict: true
    feedback: "You heard Я считаю, что удалённая работа — это хорошо — I think remote work is good."

  ru.b2.unit06.lesson02.exercise01.recognize_otvetstvennost:
    instruction: "What does this word mean?"
    correct_option: "responsibility"
    distractors: ["freedom", "efficiency", "society"]
    accepted_answers: [{value: "responsibility", status: "correct"}]
    feedback: "Ответственность means responsibility -- an abstract value about who should act."
  ru.b2.unit06.lesson02.exercise02.listen_do_nekotoroy_stepeni:
    instruction: "Listen and select what you hear."
    correct_option: "That is true to a certain extent."
    distractors: ["That is completely true.", "That is not true at all.", "That is true in general."]
    accepted_answers: [{value: "That is true to a certain extent.", status: "correct"}]
    feedback: "До некоторой степени это правда means that's true to a certain extent -- a partial, qualified agreement."
  ru.b2.unit06.lesson02.exercise03.match_nyuans_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value:
          - {left: "до некоторой степени", right: "to a certain extent"}
          - {left: "в целом", right: "in general"}
          - {left: "не обязательно", right: "not necessarily"}
          - {left: "это зависит", right: "that depends"}
          - {left: "ответственность", right: "responsibility"}
          - {left: "не всегда", right: "not always"}
        status: "correct"
    feedback: "These are qualifiers: each grants a point only partly, turning a flat opinion into a nuanced one."
  ru.b2.unit06.lesson02.exercise04.order_ne_obyazatelno:
    instruction: "Put the words in order: That's not necessarily bad."
    accepted_answers:
      - {value: ["Это", "не", "обязательно", "плохо"], status: "correct"}
    feedback: "Это не обязательно плохо -- не обязательно means 'not necessarily', not 'not at all'."
  ru.b2.unit06.lesson02.exercise05.translate_v_celom:
    instruction: "Translate into Russian, using в целом: In general, remote work is better."
    accepted_answers:
      - {value: "В целом удалённая работа лучше", status: "correct"}
      - {value: "В целом удаленная работа лучше", status: "correct"}
      - {value: "Удалённая работа в целом лучше", status: "correct"}
      - {value: "Удаленная работа в целом лучше", status: "correct"}
    feedback: "В целом удалённая работа лучше means in general, remote work is better."
  ru.b2.unit06.lesson02.exercise06.write_eto_zavisit:
    instruction: "Write in Russian: That depends."
    accepted_answers:
      - {value: "Это зависит", status: "correct"}
