course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Say in what order things happen, with сначала, потом, после and перед."
units:
  ru.a2.unit80.snachala_potom: {"title": "First, then, after, before", "description": "Put events in order with сначала, потом, после, перед, после того как and перед тем как."}
lessons:
  ru.a2.unit80.lesson01.snachala: {"title": "First, then, finally"}
  ru.a2.unit80.lesson02.posle_pered: {"title": "After and before"}
  ru.a2.unit80.lesson03.posle_togo_kak: {"title": "After + clause, before + clause"}
  ru.a2.unit80.lesson04.vchera: {"title": "Yesterday in order"}
  ru.a2.unit80.lesson05.den: {"title": "Dima's long day"}
  ru.a2.unit80.lesson06.dialog: {"title": "What did you do yesterday"}
teaching:
  ru.a2.unit80.lesson01.teach.snachala: {"title": "First, then, finally", "gloss": "first / then / finally / has lunch / I work / goes to work", "note": "*Сначала* marks the first event, *потом* the next one and *наконец* the last one.", "example_gloss": ["First I drink coffee, then I go to work.", "First Dima works, then he has lunch.", "First Nastya reads, then she sleeps.", "First I work, then I walk, finally I go home."]}
  ru.a2.unit80.lesson01.teach.gn_order: {"title": "Order of events", "gloss": "First I drink coffee, then I go to work.", "note": "The order of the words is the order of the events. After *сначала* and *потом* the normal order stays: the person, then the verb."}
  ru.a2.unit80.lesson01.teach.gn_three: {"title": "Three steps", "gloss": "First I work, then I walk, finally I go home.", "note": "For three steps use *сначала, потом, наконец*. The person can be named only once: *я* stands before the first verb."}
  ru.a2.unit80.lesson02.teach.posle: {"title": "After and before", "gloss": "after work / before work / after lunch / before lunch / before bed / after breakfast", "note": "Learn these as set phrases: *после* is followed by *работы, обеда, завтрака*; *перед* by *работой, обедом, сном*.", "example_gloss": ["After work Dima goes home.", "Before work I drink coffee.", "After lunch Nastya goes for a walk.", "Before lunch I read.", "Before bed we drink tea."]}
  ru.a2.unit80.lesson02.teach.gn_posle: {"title": "после + phrase", "gloss": "After work Dima goes home. After lunch Nastya goes for a walk.", "note": "*После* means 'after'. The word that follows has a special form: *работы*, *обеда*, *завтрака*."}
  ru.a2.unit80.lesson02.teach.gn_pered: {"title": "перед + phrase", "gloss": "Before work I drink coffee. Before bed we drink tea.", "note": "*Перед* means 'before'. The word that follows ends in *-ой* or *-ом*: *работой*, *обедом*, *сном*."}
  ru.a2.unit80.lesson03.teach.clauses: {"title": "Clauses with after and before", "gloss": "after (a clause follows) / before (a clause follows) / came / had dinner / to go to bed / to leave", "note": "*После того как* and *перед тем как* are followed by a whole clause or an infinitive, not just a noun.", "example_gloss": ["After Dima came home, he had dinner.", "Before going to bed, I drink tea.", "Before leaving, Nastya closed the window.", "After we had dinner, we went for a walk."]}
  ru.a2.unit80.lesson03.teach.gn_posle_clause: {"title": "После того как + past", "gloss": "After Dima came home, he had dinner.", "note": "After *после того как* put the finished action in the past, then a comma and the next action."}
  ru.a2.unit80.lesson03.teach.gn_pered_clause: {"title": "Перед тем как + infinitive", "gloss": "Before going to bed, I drink tea. Before leaving, Nastya closed the window.", "note": "When the same person does both actions, *перед тем как* is followed by an infinitive: *лечь, уйти*. The tense is shown in the main clause."}
  ru.a2.unit80.lesson03.teach.gn_same: {"title": "Two ways to say it", "gloss": "First Dima came home, then he had dinner. After Dima came home, he had dinner.", "note": "Both sentences give the same order of events."}
  ru.a2.unit80.lesson04.teach.past: {"title": "Then, finally, went", "gloss": "then / went (man) / went (woman) / went (plural) / had lunch / had dinner / shop", "note": "*Затем* is a slightly more formal way to say 'then'. *Пошёл, пошла, пошли* mean that someone set off and went somewhere.", "example_gloss": ["Yesterday first I worked, then I had lunch.", "Then Dima went to the shop.", "Finally Nastya went home.", "In the evening we had dinner and walked."]}
  ru.a2.unit80.lesson04.teach.gn_story: {"title": "Telling the day in order", "gloss": "First I worked, then I had lunch, then I went to the shop.", "note": "Use *сначала, потом, затем, наконец* to link the events. The verbs are in the past and agree with the person."}
  ru.a2.unit80.lesson04.teach.gn_pasha: {"title": "Went: пошёл, пошла, пошли", "gloss": "Finally Nastya went home. Finally we went home.", "note": "*Пошёл* is for a man, *пошла* for a woman, *пошли* for several people."}
  ru.a2.unit80.lesson05.teach.v5: {"title": "Words for the story", "gloss": "long / day / was / at home / closed / tea", "note": "*У меня был длинный день* is a natural way to say 'I had a long day'.", "example_gloss": ["Yesterday I had a long day.", "I worked at home.", "I closed the window.", "Before bed I drank tea."]}
  ru.a2.unit80.lesson05.teach.reading: {"title": "Dima writes about yesterday", "gloss": "Yesterday I had a long day. First I worked at home. After lunch I went to the shop. Before leaving, I closed the window. After I came home, I had dinner. Before bed I drank tea. Dima", "note": "The text uses сначала, после, перед тем как and после того как.", "glosses": {"пил": "drank", "длинный": "long"}}
  ru.a2.unit80.lesson06.teach.q: {"title": "Nastya asks about yesterday", "gloss": "Настя: Dima, what did you do yesterday?"}
  ru.a2.unit80.lesson06.teach.a: {"title": "Dima tells the first part", "gloss": "Дима: First I worked at home, and after lunch I went to the shop."}
  ru.a2.unit80.lesson06.teach.q2: {"title": "Nastya asks what next", "gloss": "Настя: And then?"}
  ru.a2.unit80.lesson06.teach.a2: {"title": "Dima tells the rest", "gloss": "Дима: After I came home, I had dinner. Before bed I drank tea."}
  ru.a2.unit80.lesson06.teach.end: {"title": "Nastya says she does the same", "gloss": "Настя: I also drink tea before bed!"}
exercises:
  ru.a2.unit80.lesson01.exercise01.coffee: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Сначала я пью кофе, потом я иду на работу.", "distractors": ["Сначала я иду на работу, потом я пью кофе.", "Сначала я пью кофе, поэтому я иду на работу.", "Наконец я пью кофе, сначала я иду на работу."], "accepted_answers": [{"value": "Сначала я пью кофе, потом я иду на работу.", "status": "correct"}], "feedback": "*Сначала* comes first and *потом* second."}
  ru.a2.unit80.lesson01.exercise02.read: {"instruction": "Choose the correct English meaning.", "correct_option": "First Nastya reads, then she sleeps.", "distractors": ["First Nastya sleeps, then she reads.", "Nastya reads because she sleeps.", "Nastya reads and does not sleep."], "accepted_answers": [{"value": "First Nastya reads, then she sleeps.", "status": "correct"}], "feedback": "*Потом* = then."}
  ru.a2.unit80.lesson01.exercise03.w1: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "сначала", "right": "first"}, {"left": "потом", "right": "then, later"}, {"left": "наконец", "right": "finally"}, {"left": "обедает", "right": "has lunch"}, {"left": "идёт на работу", "right": "goes to work"}, {"left": "пить кофе", "right": "to drink coffee"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit80.lesson01.exercise04.dima: {"instruction": "Put the words in order to say 'First Dima drinks coffee, then he works.'", "correct_option": "Сначала Дима пьёт кофе потом он работает", "accepted_answers": [{"value": "Сначала Дима пьёт кофе потом он работает", "status": "correct"}], "feedback": "The order of the words follows the order of events."}
  ru.a2.unit80.lesson01.exercise05.potom: {"instruction": "Complete the sentence: 'First I drink coffee, then I go to work.'", "correct_option": "потом", "accepted_answers": [{"value": "потом", "status": "correct"}], "feedback": "*Потом* introduces the second step."}
  ru.a2.unit80.lesson01.exercise06.lunch: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Сначала Дима работает, потом он обедает.", "status": "correct"}, {"value": "Сначала Дима работает, потом он обедает", "status": "correct"}, {"value": "Сначала Дима работает, потом обедает.", "status": "correct"}, {"value": "Сначала Дима работает, потом обедает", "status": "correct"}, {"value": "Сначала Дима работает, а потом он обедает.", "status": "correct"}, {"value": "Сначала Дима работает, а потом он обедает", "status": "correct"}], "feedback": "*Сначала* ... *потом*."}
  ru.a2.unit80.lesson01.exercise07.work: {"instruction": "Write the requested Russian sentence.", "correct_option": "Сначала я пью кофе, потом я работаю.", "accepted_answers": [{"value": "Сначала я пью кофе, потом я работаю.", "status": "correct"}, {"value": "Сначала я пью кофе, потом я работаю", "status": "correct"}, {"value": "Сначала я пью кофе, потом работаю.", "status": "correct"}, {"value": "Сначала я пью кофе, потом работаю", "status": "correct"}], "feedback": "*Сначала* ... *потом*."}
  ru.a2.unit80.lesson02.exercise01.home: {"instruction": "Choose the correct Russian sentence.", "correct_option": "После работы Дима идёт домой.", "distractors": ["Перед работой Дима идёт домой.", "Перед работы Дима идёт домой.", "После работа Дима идёт домой."], "accepted_answers": [{"value": "После работы Дима идёт домой.", "status": "correct"}], "feedback": "*После работы* = after work."}
  ru.a2.unit80.lesson02.exercise02.sleep: {"instruction": "Choose the correct English meaning.", "correct_option": "We drink tea before bed.", "distractors": ["We drink tea after sleeping.", "We drink tea in bed.", "We do not drink tea before bed."], "accepted_answers": [{"value": "We drink tea before bed.", "status": "correct"}], "feedback": "*Перед сном* = before bed."}
  ru.a2.unit80.lesson02.exercise03.w2: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "после работы", "right": "after work"}, {"left": "перед работой", "right": "before work"}, {"left": "после обеда", "right": "after lunch"}, {"left": "перед обедом", "right": "before lunch"}, {"left": "перед сном", "right": "before bed"}, {"left": "после завтрака", "right": "after breakfast"}], "status": "correct"}], "feedback": "Do not mix up *после* and *перед*."}
  ru.a2.unit80.lesson02.exercise04.coffee: {"instruction": "Put the words in order to say 'Before work I drink coffee.'", "correct_option": "Перед работой я пью кофе", "accepted_answers": [{"value": "Перед работой я пью кофе", "status": "correct"}, {"value": "Я пью кофе перед работой", "status": "correct"}], "feedback": "*Перед работой* = before work."}
  ru.a2.unit80.lesson02.exercise05.posle: {"instruction": "Complete the sentence: 'After lunch Nastya goes for a walk.'", "correct_option": "После", "accepted_answers": [{"value": "После", "status": "correct"}], "feedback": "With *обеда* use *после*."}
  ru.a2.unit80.lesson02.exercise06.read: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Перед обедом я читаю.", "status": "correct"}, {"value": "Перед обедом я читаю", "status": "correct"}, {"value": "Я читаю перед обедом.", "status": "correct"}, {"value": "Я читаю перед обедом", "status": "correct"}], "feedback": "*Перед обедом* = before lunch."}
  ru.a2.unit80.lesson02.exercise07.breakfast: {"instruction": "Write the requested Russian sentence.", "correct_option": "После завтрака Дима идёт на работу.", "accepted_answers": [{"value": "После завтрака Дима идёт на работу.", "status": "correct"}, {"value": "После завтрака Дима идёт на работу", "status": "correct"}, {"value": "Дима идёт на работу после завтрака.", "status": "correct"}, {"value": "Дима идёт на работу после завтрака", "status": "correct"}], "feedback": "*После завтрака* = after breakfast."}
  ru.a2.unit80.lesson03.exercise01.after: {"instruction": "Choose the correct Russian sentence.", "correct_option": "После того как Дима пришёл домой, он поужинал.", "distractors": ["Перед тем как Дима пришёл домой, он поужинал.", "После того как Дима пришла домой, он поужинал.", "После того как Дима поужинал, он пришёл домой."], "accepted_answers": [{"value": "После того как Дима пришёл домой, он поужинал.", "status": "correct"}], "feedback": "*После того как* introduces what happened first."}
  ru.a2.unit80.lesson03.exercise02.before: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Перед тем как уйти, Настя закрыла окно.", "distractors": ["После того как уйти, Настя закрыла окно.", "Перед тем как уйти, Настя закрыл окно.", "Перед тем как закрыть окно, Настя ушла."], "accepted_answers": [{"value": "Перед тем как уйти, Настя закрыла окно.", "status": "correct"}], "feedback": "*Перед тем как* + infinitive."}
  ru.a2.unit80.lesson03.exercise03.w3: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "после того как", "right": "after (a clause follows)"}, {"left": "перед тем как", "right": "before (a clause follows)"}, {"left": "пришёл", "right": "came (a man)"}, {"left": "поужинал", "right": "had dinner (a man)"}, {"left": "лечь спать", "right": "to go to bed"}, {"left": "уйти", "right": "to leave"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit80.lesson03.exercise04.bed: {"instruction": "Put the words in order to say 'Before going to bed, I drink tea.'", "correct_option": "Перед тем как лечь спать я пью чай", "accepted_answers": [{"value": "Перед тем как лечь спать я пью чай", "status": "correct"}], "feedback": "*Перед тем как* + infinitive."}
  ru.a2.unit80.lesson03.exercise05.lech: {"instruction": "Complete the sentence: 'Before going to bed, I drink tea.'", "correct_option": "лечь", "accepted_answers": [{"value": "лечь", "status": "correct"}], "feedback": "After *перед тем как* comes the infinitive."}
  ru.a2.unit80.lesson03.exercise06.walk: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "После того как мы поужинали, мы гуляли.", "status": "correct"}, {"value": "После того как мы поужинали, мы гуляли", "status": "correct"}, {"value": "После того как мы поужинали, мы пошли гулять.", "status": "correct"}, {"value": "После того как мы поужинали, мы пошли гулять", "status": "correct"}], "feedback": "*После того как* + past."}
  ru.a2.unit80.lesson03.exercise07.window: {"instruction": "Write the requested Russian sentence.", "correct_option": "Перед тем как уйти, Дима закрыл окно.", "accepted_answers": [{"value": "Перед тем как уйти, Дима закрыл окно.", "status": "correct"}, {"value": "Перед тем как уйти, Дима закрыл окно", "status": "correct"}], "feedback": "*Перед тем как уйти* + the main clause."}
  ru.a2.unit80.lesson04.exercise01.home: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Наконец Настя пошла домой.", "distractors": ["Наконец Настя пошёл домой.", "Наконец Настя идёт домой.", "Наконец Настя пошли домой."], "accepted_answers": [{"value": "Наконец Настя пошла домой.", "status": "correct"}], "feedback": "*Настя* is feminine: *пошла*."}
  ru.a2.unit80.lesson04.exercise02.shop: {"instruction": "Choose the correct English meaning.", "correct_option": "Then Dima went to the shop.", "distractors": ["Dima went to the shop first.", "Dima did not go to the shop.", "Then Dima went home."], "accepted_answers": [{"value": "Then Dima went to the shop.", "status": "correct"}], "feedback": "*Затем* = then."}
  ru.a2.unit80.lesson04.exercise03.w4: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "затем", "right": "then"}, {"left": "наконец", "right": "finally"}, {"left": "пошёл", "right": "went (a man)"}, {"left": "пошла", "right": "went (a woman)"}, {"left": "пошли", "right": "went (several people)"}, {"left": "обедал", "right": "had lunch (a man)"}], "status": "correct"}], "feedback": "These words recur in the unit."}
  ru.a2.unit80.lesson04.exercise04.worked: {"instruction": "Put the words in order to say 'First I worked, then I had lunch.' (a man is speaking)", "correct_option": "Сначала я работал потом я обедал", "accepted_answers": [{"value": "Сначала я работал потом я обедал", "status": "correct"}], "feedback": "The order of words follows the order of events."}
  ru.a2.unit80.lesson04.exercise05.lunch: {"instruction": "Complete the sentence: 'First Dima worked, then he had lunch.'", "correct_option": "обедал", "accepted_answers": [{"value": "обедал", "status": "correct"}], "feedback": "*Дима* is masculine: *обедал*."}
  ru.a2.unit80.lesson04.exercise06.two: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Затем Дима пошёл в магазин. Наконец он пошёл домой.", "status": "correct"}, {"value": "Затем Дима пошёл в магазин. Наконец он пошёл домой", "status": "correct"}, {"value": "Потом Дима пошёл в магазин. Наконец он пошёл домой.", "status": "correct"}, {"value": "Потом Дима пошёл в магазин. Наконец он пошёл домой", "status": "correct"}], "feedback": "*Затем* or *потом*, then *наконец*."}
  ru.a2.unit80.lesson04.exercise07.yest: {"instruction": "Write the requested Russian sentence.", "correct_option": "Вчера сначала я работал, потом я обедал.", "accepted_answers": [{"value": "Вчера сначала я работал, потом я обедал.", "status": "correct"}, {"value": "Вчера сначала я работал, потом я обедал", "status": "correct"}, {"value": "Вчера сначала я работал, потом обедал.", "status": "correct"}, {"value": "Вчера сначала я работал, потом обедал", "status": "correct"}, {"value": "Вчера я сначала работал, потом обедал.", "status": "correct"}, {"value": "Вчера я сначала работал, потом обедал", "status": "correct"}, {"value": "Вчера я сначала работал, потом я обедал.", "status": "correct"}, {"value": "Вчера я сначала работал, потом я обедал", "status": "correct"}, {"value": "Сначала я работал, потом я обедал вчера.", "status": "correct"}, {"value": "Сначала я работал, потом я обедал вчера", "status": "correct"}], "feedback": "A man says *работал* and *обедал*."}
  ru.a2.unit80.lesson05.exercise01.r1: {"instruction": "Read the text and choose the answer.", "correct_option": "He worked at home.", "distractors": ["He went to the shop.", "He had dinner.", "He drank tea."], "accepted_answers": [{"value": "He worked at home.", "status": "correct"}], "feedback": "*Сначала я работал дома.*"}
  ru.a2.unit80.lesson05.exercise02.r2: {"instruction": "Read the text and choose the answer.", "correct_option": "He closed the window.", "distractors": ["He drank tea.", "He called Nastya.", "He had lunch."], "accepted_answers": [{"value": "He closed the window.", "status": "correct"}], "feedback": "*Перед тем как уйти, я закрыл окно.*"}
  ru.a2.unit80.lesson05.exercise03.m5: {"instruction": "Match each sentence from the text to its English meaning.", "accepted_answers": [{"value": [{"left": "Сначала я работал дома.", "right": "First I worked at home."}, {"left": "После обеда я пошёл в магазин.", "right": "After lunch I went to the shop."}, {"left": "Я закрыл окно.", "right": "I closed the window."}, {"left": "Я пришёл домой.", "right": "I came home."}, {"left": "Я поужинал.", "right": "I had dinner."}, {"left": "Перед сном я пил чай.", "right": "Before bed I drank tea."}], "status": "correct"}], "feedback": "All lines are from Dima's text."}
  ru.a2.unit80.lesson05.exercise04.o5: {"instruction": "Put the words in order to say 'After I came home, I had dinner.' (Dima is speaking)", "correct_option": "После того как я пришёл домой я поужинал", "accepted_answers": [{"value": "После того как я пришёл домой я поужинал", "status": "correct"}], "feedback": "*После того как* + past."}
  ru.a2.unit80.lesson05.exercise05.t5: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Перед сном я пил чай.", "status": "correct"}, {"value": "Перед сном я пил чай", "status": "correct"}, {"value": "Я пил чай перед сном.", "status": "correct"}, {"value": "Я пил чай перед сном", "status": "correct"}], "feedback": "*Перед сном* = before bed."}
  ru.a2.unit80.lesson05.exercise06.d1: {"instruction": "Type what you hear.", "correct_response": "Сначала я работал дома.", "orthography_strict": true, "feedback": "You heard *Сначала я работал дома.*"}
  ru.a2.unit80.lesson05.exercise07.d2: {"instruction": "Type what you hear.", "correct_response": "Перед тем как уйти, я закрыл окно.", "orthography_strict": true, "feedback": "You heard *Перед тем как уйти, я закрыл окно.*"}
  ru.a2.unit80.lesson06.exercise01.l1: {"instruction": "Listen and select Nastya's opening question.", "correct_option": "Дима, что ты делал вчера?", "distractors": ["Дима, что ты делаешь сегодня?", "Настя, что ты делал вчера?", "Дима, что ты будешь делать завтра?"], "accepted_answers": [{"value": "Дима, что ты делал вчера?", "status": "correct"}], "feedback": "Nastya opens with *Дима, что ты делал вчера?*"}
