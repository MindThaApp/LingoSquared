teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs: *читать* (to read), *заниматься спортом* (to exercise or play sports) and *готовить* (to cook).'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Free time
    gloss: free time
    note: '*Свободное время* is the key phrase for talking about hobbies. The adjective *свободное* ends in *-ое* to agree with *время*.'
    example_gloss: In my free time, I like to read.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Люблю* is the *я* form of *любить* (to like, to love). After it the second verb stays in the infinitive: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobbies: *слушать музыку* (to listen to music), *рисовать* (to draw) and *играть в игры* (to play video games).'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*Слушать* takes its object directly: *музыку* is the accusative of *музыка*, with the ending *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*С друзьями* (with friends): the preposition *с* is followed by the instrumental case, hence *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: 'The four core frequency adverbs: *всегда*, *часто*, *иногда*, *никогда*. They never change their form.'
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*Каждую неделю* and *каждые выходные* both mean ''every'', but the ending follows the noun: see the next card.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Every: feminine and plural'
    gloss: '*Неделя* is feminine, so it takes *каждую неделю*. *Выходные* is plural, so it takes *каждые выходные*.'
    note: '*Каждый* agrees with its noun like any adjective: *каждый день* (masculine), *каждую неделю* (feminine, accusative), *каждые выходные* (plural).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastya brings up hobbies
    gloss: 'Nastya: We often walk together. But what else do you do in your free time, Dima?'
    note: '*Мы часто гуляем вместе*: *мы* (we) takes the verb ending *-ем*, and *гулять* means to walk for pleasure.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Dima's hobbies
    gloss: 'Dima: I like cooking, at home too. And I exercise often.'
    note: '*И дома тоже* (at home too): *и ... тоже* shows that Dima cooks for fun, not only at work.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastya is surprised
    gloss: 'Nastya: You cook at home too? You already cook all day at your job!'
    note: '*Весь день* (all day) stresses how much Dima already cooks at work. *Весь* agrees with the masculine *день*.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima explains
    gloss: 'Dima: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Готовить меня расслабляет* puts the activity first: literally ''cooking relaxes me'', with *меня* in the accusative.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Nastya's hobbies
    gloss: 'Nastya: I like reading and I often listen to music.'
    note: 'Two hobby verbs from the earlier lessons are joined with *и* (and): *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima asks about gaming
    gloss: 'Dima: Do you also game?'
    note: 'A short yes/no question: Russian keeps the word order and only the intonation rises: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastya answers
    gloss: 'Nastya: No, I never game. But I sometimes draw!'
    note: '*Никогда не* (never) needs the extra *не* before the verb. *Иногда* (sometimes) is the contrast.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Comparing hobbies
    gloss: Dima and I often walk together. But we also have other hobbies. Dima likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Настя's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      гуляем: walk
      часто: often
      вместе: together
      другие: other
      готовить: cooks
      любит: likes to
      дома: at home
      занимается: exercises
      читать: read
      слушаю: listen
      музыку: music
      рисую: draw
      иногда: sometimes
      играю: play video games
      никогда: never
      свободное: free
      время: time
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima asks about the weekend
    gloss: 'Dima: What are you doing this weekend?'
    note: '*В эти выходные* (this weekend): *выходные* is plural, so *эти* is plural too, and *в* with a time takes the accusative.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastya is undecided
    gloss: 'Nastya: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Хочу ещё выйти на улицу* means ''I also want to go outside''. *Хочу* is the *я* form of *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima suggests a plan
    gloss: 'Dima: Shall we walk together? I''ll cook for us afterward.'
    note: '*Давай погуляем* is the usual way to suggest doing something together, and *потом* (afterward) puts the next step in order.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastya agrees
    gloss: 'Nastya: Good idea! I like both walking and cooking.'
    note: '*Мне нравится* literally means ''to me is pleasing'': the person is in the dative (*мне*) and the thing liked follows.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima confirms
    gloss: 'Dima: Perfect. Then I''ll see you Saturday!'
    note: '*Увидимся в субботу* (see you on Saturday): *в* with a weekday takes the accusative, so *суббота* becomes *субботу*.'
