teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Животное* is the general word for animal. *Домашнее животное* (literally ''domestic animal'') means specifically a pet.'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Nastya has a dog.
    - Igor has a cat.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: '*У тебя есть ...?* is the question for ''do you have'': *у тебя* (''at you'') + *есть* + the thing.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: '*Нет* + genitive says you do not have something: *у меня нет домашнего животного*. See the grammar note.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет plus genitive
    gloss: 'After *нет* the missing thing is in the genitive: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Compare the positive: *у меня есть собака* (nominative) but *у меня нет собаки* (genitive).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*Гулять с собакой* uses *с* plus the instrumental, *собакой*. See the grammar note.'
    example_gloss: I walk the dog every day.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С plus instrumental
    gloss: 'After *с* (with) the noun is in the instrumental: *гулять с собакой*, *играть с кошкой*.'
    note: 'The instrumental of feminine nouns ends in *-ой* or *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: To play with
    gloss: to play with
    example_gloss: Igor plays with his cat.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: '*Каждый день* (every day) is a time expression with no preposition: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: '*Кормить* takes the animal as a direct object in the accusative: *кошка* becomes *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Animals after любить
    gloss: 'After *любить* an animal noun is in the accusative, which for animate nouns equals the genitive plural: *собак*, *кошек*, *птиц*, *рыб*.'
    note: The regular Russian plural pattern, introduced here for the first time with animal nouns as the example set.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Dima loves dogs.
    - Lena loves cats.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: I love animals
    gloss: I love animals.
    note: '*Люблю* + accusative: *Я люблю животных*. For animate plural nouns the accusative looks like the genitive.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena loves cats, but has no pet
    gloss: Lena loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima asks about a pet
    gloss: 'Dima: Do you have a pet, Nastya?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastya has a dog
    gloss: 'Nastya: Yes, I have a dog.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima asks what it looks like
    gloss: 'Dima: What does he look like?'
    note: The question *Как он выглядит?* works for animals too. *Он* (he) is used for a male pet.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastya describes her dog
    gloss: 'Nastya: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он and она for animals
    gloss: 'A pet can be *он* or *она*, like a person: *У меня собака, он маленький*.'
    note: Grammatically *собака* is feminine, but Russians often say *он* when they know the pet is male.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima asks about walks
    gloss: 'Dima: Do you walk him every day?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastya describes her routine
    gloss: 'Nastya: Yes, I walk him every day and I feed him.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena, and Igor on animals
    gloss: 'Dima and Lena both love animals, but neither of them has a pet. Dima loves dogs and Lena loves cats. Igor does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      любят: love
      оба: both
      животных: animals
      обоих: both
      домашнего: pet
      собак: dogs
      кошек: cats
      кошка: cat
      играет: plays
      даёт: gives
      каждый: every
      корм: food
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor often plays with his cat
    gloss: Igor often plays with his cat.
    note: '*Со своей кошкой*: *со* is *с* before a cluster of consonants, and *своей* means ''his own'', referring back to the subject.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastya asks Nina
    gloss: 'Nastya: Nina, do you have a pet too?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*Его зовут Пико* literally means ''they call him Pico''. This is how Russian gives a name.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Dima reacts
    gloss: 'Dima: How nice! What do you do with him every day?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Dima loves birds too
    gloss: 'Dima: I love birds too.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastya closes the conversation
    gloss: 'Nastya: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
