review: {"status": "unreviewed", "required_next_reviewer": "native_speaker_review", "notes": "English overlay for the life-experience unit (когда-нибудь, никогда не, уже / ещё не, counting times). OPEN NATIVE QUESTIONS: (1) confirm that 'Давай поедем вместе!' is natural and acceptable at A2 (perfective future after 'давай'); (2) confirm 'Ты когда-нибудь был ...?' with an imperfective past verb is the best default for life experience and that the accepted word orders (e.g. 'Ты был когда-нибудь в Казани') are natural; (3) confirm 'Нет, ещё не был' and 'ещё не прочитал/читал' do not need a perfective note at this level; (4) confirm 'на Байкале' and 'за границей' phrasing in the reading text."}
course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian for talking about life experiences."
  learning_goal: "Ask and say what you have or have never done, and whether you have already done something yet."
units:
  ru.a2.unit71.kogda_nibud_bylo: {"title": "Have you ever...?", "description": "Ask and say what you have or have never done, and whether you have already done something yet."}
lessons:
  ru.a2.unit71.lesson01.ty_kogda_nibud_byl: {"title": "Have you ever been?"}
  ru.a2.unit71.lesson02.nikogda_ne: {"title": "I have never ..."}
  ru.a2.unit71.lesson03.uzhe_i_eshche_ne: {"title": "Already or not yet?"}
  ru.a2.unit71.lesson04.skolko_raz: {"title": "How many times?"}
  ru.a2.unit71.lesson05.soobshchenie_nasti: {"title": "Nastya's message"}
  ru.a2.unit71.lesson06.plan_poezdki: {"title": "Planning a trip"}
teaching:
  ru.a2.unit71.lesson01.teach.mesta: {"title": "Places", "gloss": "in Moscow / in St Petersburg / in Kazan / at Lake Baikal / abroad", "note": "These phrases answer 'where?'. Use *в* with Moscow, St Petersburg and Kazan, *на* with Baikal, and *за границей* for abroad.", "example_gloss": ["Dima has been to Moscow.", "Nastya has been to St Petersburg.", "We have been to Kazan.", "They have been to Lake Baikal.", "I have been abroad."]}
  ru.a2.unit71.lesson01.teach.slova: {"title": "Small words", "gloss": "I / you / he / she / we / they / yes / no", "note": "Between friends we use *ты* for 'you'.", "example_gloss": ["He has been to Moscow.", "She has been to Kazan.", "Yes, I have.", "No, I haven't."]}
  ru.a2.unit71.lesson01.teach.druzya: {"title": "Friends and 'ever'", "gloss": "Nastya / Dima / ever, at some time", "note": "Nastya and Dima are the friends in this course. *Когда-нибудь* means 'ever' in questions.", "example_gloss": ["Nastya and Dima are friends.", "Have you ever been to Moscow?"]}
  ru.a2.unit71.lesson01.teach.gn_byl: {"title": "Past tense of быть: gender", "gloss": "I was (m.), I was (f.), you were (m.), you were (f.), he was, she was, we were, you were (pl.), they were", "note": "In the past tense, *был* is masculine, *была* is feminine and *были* is plural. The form depends on who is speaking or being asked, not on the pronoun: a man says *я был*, a woman says *я была*."}
  ru.a2.unit71.lesson01.teach.gn_kogda: {"title": "Life experience: past tense + когда-нибудь", "gloss": "Have you ever been to Moscow? (to a man) Have you ever been to Moscow? (to a woman) Yes, I have. Yes, I have. No, I haven't. No, I haven't.", "note": "Russian has no present perfect. To ask 'have you ever...?' use the simple past tense plus *когда-нибудь*. Choose *был* or *была* by the gender of the person you ask. Short answers repeat the verb: *Да, был.* / *Нет, не был.*"}
  ru.a2.unit71.lesson01.teach.fraza: {"title": "Two questions", "gloss": "Dima, have you ever been to Kazan? Nastya, have you ever been to Kazan?", "note": "Same question, two genders: *был* for Dima, *была* for Nastya."}
  ru.a2.unit71.lesson02.teach.glagoly: {"title": "Experience verbs", "gloss": "ate / saw / tried / read / flew / travelled", "note": "These are masculine past forms. For a woman: *ела, видела, пробовала, читала, летала, ездила*; for 'we/they': *ели, видели, пробовали*. For experience, the imperfective verb is normal.", "example_gloss": ["Dima has seen Lake Baikal.", "Nastya has read Pushkin.", "Nastya has tried sushi.", "We have eaten borscht.", "I have flown in a plane.", "They have been (travelled) to Lake Baikal."]}
  ru.a2.unit71.lesson02.teach.nikogda: {"title": "Never", "gloss": "never / not", "note": "*Никогда* means 'never' and always goes together with *не* before the verb.", "example_gloss": ["I have never been to Moscow.", "We have never been to Kazan.", "Nastya has never been abroad."]}
  ru.a2.unit71.lesson02.teach.gn_nikogda: {"title": "Never = никогда не + past", "gloss": "I have never eaten sushi. (man) I have never eaten sushi. (woman) We have never been to Kazan.", "note": "Russian uses a double negative: *никогда* and *не* together. Never leave out *не*: *Я никогда не ел суши*, not *Я никогда ел*. The verb stays in the past tense."}
  ru.a2.unit71.lesson02.teach.gn_formy: {"title": "Past forms by gender and number", "gloss": "ate (m., f., pl.). saw (m., f., pl.). tried (m., f., pl.).", "note": "Past verbs end in *-л* for a man, *-ла* for a woman and *-ли* for plural."}
  ru.a2.unit71.lesson02.teach.otvet: {"title": "Short answers", "gloss": "No, never. No, I have never been (m.). No, I have never been (f.).", "note": "A short answer can be just *Нет, никогда.*"}
  ru.a2.unit71.lesson03.teach.uzhe: {"title": "Already, not yet", "gloss": "already / not yet", "note": "*Уже* means 'already'; *ещё не* means 'not yet' and suggests that you may do it later.", "example_gloss": ["Have you already been to St Petersburg?", "Yes, I have already been.", "No, I haven't been yet.", "I have already seen Lake Baikal.", "I haven't tried borscht yet."]}
  ru.a2.unit71.lesson03.teach.soobshchenie: {"title": "Message, finished reading", "gloss": "message / read (to the end)", "note": "*Прочитал* is a perfective verb: it means you finished reading.", "example_gloss": ["Dima has already read the message.", "Nastya has already read the message."]}
  ru.a2.unit71.lesson03.teach.gn_uzhe: {"title": "Already and not yet", "gloss": "Have you already been to St Petersburg? Yes, already. No, not yet.", "note": "Use *уже* in a question or a positive answer, and *ещё не* in a negative answer. Both go before the verb, and the verb stays in the past tense."}
  ru.a2.unit71.lesson03.teach.gn_nikogda_eshche: {"title": "Never or not yet?", "gloss": "I have never been to Moscow. I haven't been to Moscow yet.", "note": "*Никогда не* talks about your whole life: it is a fact. *Ещё не* means the thing has not happened so far, but it still can. Use *ещё не* for plans, *никогда не* for experience."}
  ru.a2.unit71.lesson03.teach.gn_vid: {"title": "Ever or finished result", "gloss": "Dima has read Pushkin. Dima has already read the message.", "note": "For experience ('have you ever...?') the imperfective verb is normal: *читал, видел, ел*. With *уже*, when one particular thing is completed, you can use a perfective verb: *прочитал*."}
  ru.a2.unit71.lesson04.teach.razy: {"title": "How many times", "gloss": "once / twice / three times / five times / many times", "note": "The word for 'time' changes with the number: *один раз*, *два/три/четыре раза*, *пять раз* and more.", "example_gloss": ["I have been to Kazan once.", "Dima has been to Lake Baikal twice.", "Nastya has been to Moscow three times.", "Dima has flown in a plane five times.", "We have eaten sushi many times."]}
  ru.a2.unit71.lesson04.teach.skolko: {"title": "How many times?", "gloss": "how many times", "note": "Ask *Сколько раз ...?* to find out how often someone did something.", "example_gloss": ["How many times have you been to Moscow?", "I have been to Moscow twice."]}
  ru.a2.unit71.lesson04.teach.gn_raz: {"title": "Раз, раза, раз", "gloss": "once, twice, three times, four times, five times, many times", "note": "After *один* use *раз*; after *два, три, четыре* use *раза*; after *пять* and bigger numbers, and after *много*, use *раз*."}
  ru.a2.unit71.lesson04.teach.gn_ni_razu: {"title": "Not once: ни разу не", "gloss": "I have not been to Moscow even once. Nastya has not eaten sushi even once.", "note": "*Ни разу не* means 'not once'. It is stronger than *никогда не* and counts the times: zero. The verb is in the past tense and *не* is still required."}
  ru.a2.unit71.lesson04.teach.fraza: {"title": "Three answers", "gloss": "I have been once. I have been many times. I have never been.", "note": "Three ways to answer *Сколько раз?*"}
  ru.a2.unit71.lesson05.teach.privet: {"title": "Hi, and, but", "gloss": "hi / and / and, but", "note": "*А* joins two contrasting or different ideas: 'and', 'while'. *И* just adds.", "example_gloss": ["Hi, Dima!", "I have been to St Petersburg and Kazan.", "Dima has been to Moscow, and Nastya has been to Kazan."]}
  ru.a2.unit71.lesson05.teach.reading: {"title": "Nastya writes to Dima", "gloss": "Hi, Dima! I have already been to St Petersburg and Kazan. I have been to Moscow three times. I haven't been to Lake Baikal yet. I have never been abroad. And have you already been to Lake Baikal? Nastya", "note": "Nastya uses every pattern of the unit: *уже была*, *ещё не была*, *никогда не была* and a number of times.", "glosses": {"уже": "already", "ещё": "still, yet", "никогда": "never", "раза": "times"}}
  ru.a2.unit71.lesson06.teach.turn1: {"title": "Dima asks", "gloss": "Dima: Nastya, have you ever been to St Petersburg?"}
  ru.a2.unit71.lesson06.teach.turn2: {"title": "Nastya answers and asks back", "gloss": "Nastya: Yes, twice. And have you already been to St Petersburg?"}
  ru.a2.unit71.lesson06.teach.turn3: {"title": "Dima has not been yet", "gloss": "Dima: No, not yet. I have only been to Moscow and Kazan."}
  ru.a2.unit71.lesson06.teach.turn4: {"title": "Nastya asks about Baikal", "gloss": "Nastya: And have you ever been to Lake Baikal?"}
  ru.a2.unit71.lesson06.teach.turn5: {"title": "Dima has never been", "gloss": "Dima: No, never. And you?"}
  ru.a2.unit71.lesson06.teach.turn6: {"title": "Nastya makes a plan", "gloss": "Nastya: I haven't been yet either. Let's go together!"}
exercises:
  ru.a2.unit71.lesson01.exercise01.choose_moscow: {"instruction": "Choose the correct Russian question.", "correct_option": "Дима, ты когда-нибудь был в Москве?", "distractors": ["Дима, ты когда-нибудь была в Москве?", "Дима, ты когда-нибудь были в Москве?", "Дима, ты когда-нибудь был в Москва?"], "accepted_answers": [{"value": "Дима, ты когда-нибудь был в Москве?", "status": "correct"}], "feedback": "Dima is male, so the verb is *был*, and *в* takes *Москве*."}
  ru.a2.unit71.lesson01.exercise02.choose_kazan: {"instruction": "Choose the correct Russian question.", "correct_option": "Настя, ты когда-нибудь была в Казани?", "distractors": ["Настя, ты когда-нибудь был в Казани?", "Настя, ты когда-нибудь были в Казани?", "Настя, ты когда-нибудь была в Казань?"], "accepted_answers": [{"value": "Настя, ты когда-нибудь была в Казани?", "status": "correct"}], "feedback": "Nastya is female, so the verb is *была*."}
  ru.a2.unit71.lesson01.exercise03.match_places: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "в Москве", "right": "in Moscow"}, {"left": "в Петербурге", "right": "in St Petersburg"}, {"left": "в Казани", "right": "in Kazan"}, {"left": "на Байкале", "right": "at Lake Baikal"}, {"left": "за границей", "right": "abroad"}, {"left": "когда-нибудь", "right": "ever"}], "status": "correct"}], "feedback": "These are the places and the key word of this lesson."}
  ru.a2.unit71.lesson01.exercise04.order_kazan: {"instruction": "Put the words in order to say 'Have you ever been to Kazan?'", "correct_option": "Ты когда-нибудь был в Казани", "accepted_answers": [{"value": "Ты когда-нибудь был в Казани", "status": "correct"}, {"value": "Ты был когда-нибудь в Казани", "status": "correct"}], "feedback": "*Когда-нибудь* normally comes right after *ты*."}
  ru.a2.unit71.lesson01.exercise05.fill_byla: {"instruction": "Complete with the past-tense form of *быть* that fits Nastya.", "correct_option": "была", "accepted_answers": [{"value": "была", "status": "correct"}], "feedback": "Nastya is female, so *была*."}
  ru.a2.unit71.lesson01.exercise06.translate_petersburg: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Ты когда-нибудь был в Петербурге?", "status": "correct"}, {"value": "Ты когда-нибудь был в Петербурге", "status": "correct"}, {"value": "Ты когда-нибудь была в Петербурге?", "status": "correct"}, {"value": "Ты когда-нибудь была в Петербурге", "status": "correct"}, {"value": "Ты был когда-нибудь в Петербурге?", "status": "correct"}, {"value": "Ты был когда-нибудь в Петербурге", "status": "correct"}, {"value": "Ты была когда-нибудь в Петербурге?", "status": "correct"}, {"value": "Ты была когда-нибудь в Петербурге", "status": "correct"}], "feedback": "Both *был* and *была* are correct, depending on whom you ask."}
  ru.a2.unit71.lesson01.exercise07.write_two: {"instruction": "Write the two requested Russian sentences.", "correct_option": "Дима был в Москве. Настя была в Казани.", "accepted_answers": [{"value": "Дима был в Москве. Настя была в Казани.", "status": "correct"}, {"value": "Дима был в Москве Настя была в Казани", "status": "correct"}, {"value": "Дима был в Москве. Настя была в Казани", "status": "correct"}], "feedback": "*Дима был в Москве. Настя была в Казани.*"}
  ru.a2.unit71.lesson02.exercise01.choose_sushi: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Я никогда не ел суши.", "distractors": ["Я никогда ел суши.", "Я не никогда ел суши.", "Я никогда не ела суши."], "accepted_answers": [{"value": "Я никогда не ел суши.", "status": "correct"}], "feedback": "You need *никогда не* and the masculine *ел*."}
  ru.a2.unit71.lesson02.exercise02.choose_abroad: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя никогда не была за границей.", "distractors": ["Настя никогда была за границей.", "Настя никогда не был за границей.", "Настя не никогда была за границей."], "accepted_answers": [{"value": "Настя никогда не была за границей.", "status": "correct"}], "feedback": "*Никогда не* plus the feminine *была*."}
  ru.a2.unit71.lesson02.exercise03.match_verbs: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "ел", "right": "ate"}, {"left": "видел", "right": "saw"}, {"left": "пробовал", "right": "tried"}, {"left": "читал", "right": "read"}, {"left": "летал", "right": "flew"}, {"left": "ездил", "right": "travelled"}, {"left": "никогда", "right": "never"}, {"left": "суши", "right": "sushi"}], "status": "correct"}], "feedback": "These are the experience verbs of this lesson, in the masculine form."}
  ru.a2.unit71.lesson02.exercise04.order_kazan2: {"instruction": "Put the words in order to say 'We have never been to Kazan.'", "correct_option": "Мы никогда не были в Казани", "accepted_answers": [{"value": "Мы никогда не были в Казани", "status": "correct"}], "feedback": "The order is *никогда не* + verb."}
  ru.a2.unit71.lesson02.exercise05.fill_videl: {"instruction": "Complete with the past-tense verb meaning 'saw' (masculine).", "correct_option": "видел", "accepted_answers": [{"value": "видел", "status": "correct"}], "feedback": "Dima is male: *видел*."}
  ru.a2.unit71.lesson02.exercise06.translate_sushi: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Я никогда не ел суши.", "status": "correct"}, {"value": "Я никогда не ел суши", "status": "correct"}, {"value": "Я никогда не ела суши.", "status": "correct"}, {"value": "Я никогда не ела суши", "status": "correct"}, {"value": "Никогда не ел суши.", "status": "correct"}, {"value": "Никогда не ел суши", "status": "correct"}, {"value": "Никогда не ела суши.", "status": "correct"}, {"value": "Никогда не ела суши", "status": "correct"}, {"value": "Я суши никогда не ел.", "status": "correct"}, {"value": "Я суши никогда не ел", "status": "correct"}, {"value": "Я суши никогда не ела.", "status": "correct"}, {"value": "Я суши никогда не ела", "status": "correct"}], "feedback": "Use *ел* if the speaker is a man and *ела* if a woman; both are accepted."}
  ru.a2.unit71.lesson02.exercise07.write_two2: {"instruction": "Write the two requested Russian sentences.", "correct_option": "Дима никогда не был в Казани. Настя никогда не пробовала борщ.", "accepted_answers": [{"value": "Дима никогда не был в Казани. Настя никогда не пробовала борщ.", "status": "correct"}, {"value": "Дима никогда не был в Казани Настя никогда не пробовала борщ", "status": "correct"}, {"value": "Дима никогда не был в Казани. Настя никогда не пробовала борщ", "status": "correct"}], "feedback": "*Дима никогда не был в Казани. Настя никогда не пробовала борщ.*"}
  ru.a2.unit71.lesson03.exercise01.choose_uzhe: {"instruction": "Choose the correct Russian question.", "correct_option": "Настя, ты уже была в Петербурге?", "distractors": ["Настя, ты уже был в Петербурге?", "Настя, ты уже была в Петербург?", "Настя, ты уже были в Петербурге?"], "accepted_answers": [{"value": "Настя, ты уже была в Петербурге?", "status": "correct"}], "feedback": "Nastya is female: *была*, and *в Петербурге*."}
  ru.a2.unit71.lesson03.exercise02.choose_eshche: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Я ещё не пробовал борщ.", "distractors": ["Я не ещё пробовал борщ.", "Я ещё не пробовала борщ.", "Я уже не пробовал борщ."], "accepted_answers": [{"value": "Я ещё не пробовал борщ.", "status": "correct"}], "feedback": "*Ещё не* goes before the verb; *уже не* would mean 'no longer'."}
  ru.a2.unit71.lesson03.exercise03.match_uzhe: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "уже", "right": "already"}, {"left": "ещё не", "right": "not yet"}, {"left": "Да, уже был.", "right": "Yes, I have already been."}, {"left": "Нет, ещё не был.", "right": "No, I haven't been yet."}, {"left": "сообщение", "right": "message"}, {"left": "борщ", "right": "borscht"}, {"left": "прочитал", "right": "finished reading"}], "status": "correct"}], "feedback": "These are the key words and answers of this lesson."}
  ru.a2.unit71.lesson03.exercise04.order_uzhe: {"instruction": "Put the words in order to say 'I have already seen Baikal. (Nastya)'", "correct_option": "Я уже видела Байкал", "accepted_answers": [{"value": "Я уже видела Байкал", "status": "correct"}, {"value": "Я Байкал уже видела", "status": "correct"}], "feedback": "The word *уже* goes before the verb."}
  ru.a2.unit71.lesson03.exercise05.fill_ne: {"instruction": "Complete with the negative particle (Dima has not been to Kazan yet).", "correct_option": "не", "accepted_answers": [{"value": "не", "status": "correct"}], "feedback": "*Ещё не был* = has not been yet."}
  ru.a2.unit71.lesson03.exercise06.translate_baikal: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Ты уже видел Байкал?", "status": "correct"}, {"value": "Ты уже видел Байкал", "status": "correct"}, {"value": "Ты уже видела Байкал?", "status": "correct"}, {"value": "Ты уже видела Байкал", "status": "correct"}, {"value": "Ты видел уже Байкал?", "status": "correct"}, {"value": "Ты видел уже Байкал", "status": "correct"}, {"value": "Ты видела уже Байкал?", "status": "correct"}, {"value": "Ты видела уже Байкал", "status": "correct"}], "feedback": "Use *видел* for a man and *видела* for a woman."}
  ru.a2.unit71.lesson03.exercise07.write_two3: {"instruction": "Write the two requested Russian sentences.", "correct_option": "Дима уже был в Петербурге. Он ещё не был в Казани.", "accepted_answers": [{"value": "Дима уже был в Петербурге. Он ещё не был в Казани.", "status": "correct"}, {"value": "Дима уже был в Петербурге Он ещё не был в Казани", "status": "correct"}, {"value": "Дима уже был в Петербурге. Он ещё не был в Казани", "status": "correct"}], "feedback": "*Дима уже был в Петербурге. Он ещё не был в Казани.*"}
  ru.a2.unit71.lesson04.exercise01.choose_two: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Дима был на Байкале два раза.", "distractors": ["Дима был на Байкале два раз.", "Дима был на Байкале два раза не.", "Дима была на Байкале два раза."], "accepted_answers": [{"value": "Дима был на Байкале два раза.", "status": "correct"}], "feedback": "After *два* the word is *раза*."}
  ru.a2.unit71.lesson04.exercise02.choose_five: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Настя была в Москве пять раз.", "distractors": ["Настя была в Москве пять раза.", "Настя был в Москве пять раз.", "Настя была в Москву пять раз."], "accepted_answers": [{"value": "Настя была в Москве пять раз.", "status": "correct"}], "feedback": "After *пять* the word is *раз*."}
  ru.a2.unit71.lesson04.exercise03.match_raz: {"instruction": "Match each Russian phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "один раз", "right": "once"}, {"left": "два раза", "right": "twice"}, {"left": "три раза", "right": "three times"}, {"left": "четыре раза", "right": "four times"}, {"left": "пять раз", "right": "five times"}, {"left": "много раз", "right": "many times"}, {"left": "сколько раз", "right": "how many times"}, {"left": "ни разу", "right": "not once"}], "status": "correct"}], "feedback": "These are the counting phrases of this lesson."}
