course:
  title: "Russian C1"
  description: "Advanced Russian mediation: relay two complex or conflicting sources to a non-specialist audience while preserving attribution, agreement, disagreement, and uncertainty."

units:
  ru.c1.unit07.mediaciya:
    title: "Mediation"
    description: "Distill two partially conflicting sources and relay them accurately and appropriately for a specific audience — condensing, resolving terminology, and preserving material disagreement."

lessons:
  ru.c1.unit07.mediaciya.lesson01.dva_istochnika:
    title: "Two sources"
  ru.c1.unit07.mediaciya.lesson02.raznoglasie:
    title: "The disagreement"
  ru.c1.unit07.mediaciya.lesson03.otbor:
    title: "What to keep, what to omit"
  ru.c1.unit07.mediaciya.lesson04.dostupnyj_yazyk:
    title: "In accessible language"
  ru.c1.unit07.mediaciya.lesson05.chitayu_i_posrednichayu:
    title: "Reading to mediate"
  ru.c1.unit07.mediaciya.lesson06.polnaya_mediaciya:
    title: "The complete mediation"

teaching:
  ru.c1.unit07.mediaciya.lesson01.teach.istochnik:
    title: "source"
    gloss: "source"
    note: "*Источник* (source) is the document, article, or expert whose position you relay. Mediation always names its sources."
    example_gloss: "The first source claims that homework is useful."
  ru.c1.unit07.mediaciya.lesson01.teach.pervyj_istochnik:
    title: "the first source's claim"
    gloss: "The first source claims that homework reinforces the material."
    note: "*Первый источник утверждает, что* (the first source claims that) opens a mediation by attributing a position. *Домашние задания закрепляют материал* = 'homework reinforces the material'."
  ru.c1.unit07.mediaciya.lesson01.teach.vtoroj_istochnik:
    title: "the second source's claim"
    gloss: "The second source believes that excessive homework causes stress."
    note: "*Второй источник считает, что* (the second source believes that) introduces the contrasting account. *Чрезмерные задания вызывают стресс* = 'excessive homework causes stress'."
  ru.c1.unit07.mediaciya.lesson01.teach.modello_dva_istochnika:
    title: "two opposing sources"
    gloss: "The first source claims that homework reinforces the material. The second source believes that excessive homework causes stress."
    note: "A mediation opens by relaying the two sources' positions, each with its own attribution verb (*утверждает*, *считает*)."

  ru.c1.unit07.mediaciya.lesson02.teach.skhodyatsya:
    title: "both sources agree"
    gloss: "Both sources agree that practice is useful."
    note: "*Оба источника сходятся в том, что* (both sources agree that) records the shared ground. *Практика полезна* = 'practice is useful'."
  ru.c1.unit07.mediaciya.lesson02.teach.raskhodyatsya:
    title: "they disagree"
    gloss: "However, they disagree about the amount of homework."
    note: "*Однако они расходятся во мнениях о* (however, they disagree about) preserves the point of conflict. *Количество заданий* = 'the amount of homework'."
  ru.c1.unit07.mediaciya.lesson02.teach.nedokazano:
    title: "not proven"
    gloss: "According to the second source, the benefit is not proven."
    note: "*По словам второго источника* (according to the second source) keeps attribution explicit. *Польза не доказана* = 'the benefit is not proven' — the short adjective agrees with *польза*."
  ru.c1.unit07.mediaciya.lesson02.teach.modello_raznoglasie:
    title: "the disagreement"
    gloss: "Both sources agree that practice is useful. However, they disagree about the amount of homework. According to the second source, the benefit is not proven."
    note: "A fair mediation records agreement, disagreement, and uncertainty without erasing the conflict."

  ru.c1.unit07.mediaciya.lesson03.teach.sut:
    title: "the essence"
    gloss: "The essence is that practice is useful, but the amount of homework is disputed."
    note: "*Суть в том, что* (the essence is that) distills a source down to its core. *А объём заданий спорен* = 'but the amount of homework is disputed'."
  ru.c1.unit07.mediaciya.lesson03.teach.opusit:
    title: "omit"
    gloss: "Unnecessary details can be omitted."
    note: "*Лишние детали можно опустить* (unnecessary details can be omitted) is the mediator's decision to cut what the audience does not need."
  ru.c1.unit07.mediaciya.lesson03.teach.sohranit:
    title: "preserve"
    gloss: "The disagreement between the sources must be preserved."
    note: "*Разногласие ... нужно сохранить* (the disagreement must be preserved) — a mediator never pretends conflicting sources agree."
  ru.c1.unit07.mediaciya.lesson03.teach.modello_otbor:
    title: "selecting what to keep"
    gloss: "The essence is that practice is useful, but the amount of homework is disputed. Unnecessary details can be omitted. The disagreement between the sources must be preserved."
    note: "Mediation selects: keep the essence and the disagreement, omit unnecessary details."

  ru.c1.unit07.mediaciya.lesson04.teach.prostymi_slovami:
    title: "in simple words"
    gloss: "I will explain this in simple words."
    note: "*Объясню это простыми словами* (I will explain this in simple words) announces an accessible relay for a non-specialist."
  ru.c1.unit07.mediaciya.lesson04.teach.izlozhit:
    title: "set out in accessible language"
    gloss: "I will set out the essence in accessible language."
    note: "*Изложу суть доступным языком* (I will set out the essence in accessible language) condenses while staying clear."
  ru.c1.unit07.mediaciya.lesson04.teach.termin:
    title: "a technical term"
    gloss: "I will replace the term 'independence' with a plain word."
    note: "*Термин ... я заменю простым словом* (I will replace the term with a plain word) resolves specialist vocabulary for the audience."
  ru.c1.unit07.mediaciya.lesson04.teach.modello_pereskaz:
    title: "relaying in plain language"
    gloss: "I will explain this in simple words. I will set out the essence in accessible language. I will replace the term 'independence' with a plain word."
    note: "These three moves condense source material and resolve terminology for a non-specialist audience."

  ru.c1.unit07.mediaciya.lesson05.teach.polnyj_istochnik_a:
    title: "the full first source"
    gloss: "The first source claims that homework reinforces the material and teaches children independence."
    note: "*И учат детей самостоятельности* (and teach children independence) completes the first source's claim."
  ru.c1.unit07.mediaciya.lesson05.teach.polnyj_istochnik_b:
    title: "the full second source"
    gloss: "The second source believes that excessive homework causes stress and increases inequality."
    note: "*И усиливают неравенство* (and increase inequality) completes the second source's counterclaim."
  ru.c1.unit07.mediaciya.lesson05.teach.mladshie_klassy:
    title: "for younger grades"
    gloss: "the benefit for younger grades"
    note: "*Польза для младших классов* (the benefit for younger grades) narrows the point where the sources conflict."
  ru.c1.unit07.mediaciya.lesson05.teach.nereshennyj:
    title: "remains unresolved"
    gloss: "Therefore this question remains unresolved."
    note: "*Поэтому этот вопрос остаётся нерешённым* (therefore this question remains unresolved) preserves the uncertainty rather than resolving it."
  ru.c1.unit07.mediaciya.lesson05.teach.celevaya_auditoriya:
    title: "target audience"
    gloss: "target audience"
    note: "*Целевая аудитория* (target audience) is who the mediation is written or spoken for — a named, non-specialist reader."
  ru.c1.unit07.mediaciya.lesson05.teach.modello_polnyj:
    title: "the complete mediation"
    gloss: "The first source claims that homework reinforces the material and teaches children independence. The second source believes that excessive homework causes stress and increases inequality. Both sources agree that practice is useful. However, they disagree about the amount of homework for younger grades. According to the second source, the benefit for younger grades is not proven, so this question remains unresolved."
    note: "This is the complete mediation: attribute both claims, record the agreement and disagreement, and preserve the uncertainty — in that order."

  ru.c1.unit07.mediaciya.lesson06.teach.modello_mediaciya:
    title: "the model to reproduce"
    gloss: "The first source claims that homework reinforces the material and teaches children independence. The second source believes that excessive homework causes stress and increases inequality. Both sources agree that practice is useful. However, they disagree about the amount of homework for younger grades. According to the second source, the benefit for younger grades is not proven, so this question remains unresolved."
    note: "Learn this exact model: the first claim, the counterclaim, the agreement, the disagreement, and the preserved uncertainty — in that order."
  ru.c1.unit07.mediaciya.lesson06.teach.mediaciya:
    title: "mediation"
    gloss: "mediation"
    note: "*Медиация* (mediation) is the act of relaying sources to an audience — condensing, resolving terminology, and preserving disagreement."
    example_gloss: "Mediation is an accurate retelling of the sources for the reader."

exercises:
  ru.c1.unit07.mediaciya.lesson01.exercise01.recognize_istochnik:
    instruction: "Which Russian word means a source of information that you relay?"
    correct_option: "источник"
    distractors: ["утверждает", "задания", "стресс"]
    accepted_answers: [{value: "источник", status: correct}]
    feedback: "*Источник* means source — the document or expert whose position a mediation relays."
  ru.c1.unit07.mediaciya.lesson01.exercise02.listen_istochnik_a:
    instruction: "Listen and select what you hear."
    correct_option: "The first source claims that homework reinforces the material."
    distractors: ["The first source claims that homework causes stress.", "The second source claims that homework reinforces the material.", "The first source denies that homework reinforces the material."]
    accepted_answers: [{value: "The first source claims that homework reinforces the material.", status: correct}]
    feedback: "Первый источник утверждает, что домашние задания закрепляют материал means the first source claims that homework reinforces the material."
  ru.c1.unit07.mediaciya.lesson01.exercise03.match_istochniki:
    instruction: "Match each Russian mediation element to its English meaning."
    accepted_answers:
      - value: {"Первый источник": "the first source", "утверждает": "claims", "домашние задания": "homework", "закрепляют материал": "reinforce the material", "Второй источник": "the second source", "вызывают стресс": "cause stress"}
        status: correct
    feedback: "These elements open a mediation by naming both sources and their positions."
  ru.c1.unit07.mediaciya.lesson01.exercise04.order_istochnik_a:
    instruction: "Put the Russian words in order to state the first source's claim."
    accepted_answers:
      - {value: "домашние задания закрепляют материал", status: correct}
      - {value: "домашние задания материал закрепляют", status: correct}
    feedback: "домашние задания закрепляют материал — homework reinforces the material."
  ru.c1.unit07.mediaciya.lesson01.exercise05.write_istochnik_a:
    instruction: "Write the exact taught sentence: Первый источник утверждает plus the first source's claim about homework (it reinforces the material)."
    accepted_answers:
      - {value: "Первый источник утверждает, что домашние задания закрепляют материал.", status: correct}
      - {value: "Первый источник утверждает, что домашние задания закрепляют материал", status: correct}
    feedback: "Первый источник утверждает, что домашние задания закрепляют материал."

  ru.c1.unit07.mediaciya.lesson02.exercise01.recognize_raznoglasie:
    instruction: "Which Russian phrase signals that two sources disagree?"
    correct_option: "Они расходятся во мнениях"
    distractors: ["Они сходятся во мнениях", "Они утверждают одно и то же", "Они не обсуждают этот вопрос"]
    accepted_answers: [{value: "Они расходятся во мнениях", status: correct}]
    feedback: "*Они расходятся во мнениях* means they disagree — the mediator preserves this conflict."
  ru.c1.unit07.mediaciya.lesson02.exercise02.listen_istochnik_b:
    instruction: "Listen and select what you hear."
    correct_option: "The second source believes that excessive homework causes stress."
    distractors: ["The second source believes that homework reduces stress.", "The first source believes that excessive homework causes stress.", "The second source believes that homework reinforces the material."]
    accepted_answers: [{value: "The second source believes that excessive homework causes stress.", status: correct}]
    feedback: "Второй источник считает, что чрезмерные задания вызывают стресс means the second source believes that excessive homework causes stress."
  ru.c1.unit07.mediaciya.lesson02.exercise03.match_raznoglasie:
    instruction: "Match each Russian agreement/disagreement element to its English meaning."
    accepted_answers:
      - value: {"Оба источника сходятся": "both sources agree", "в том, что": "that", "практика полезна": "practice is useful", "Однако": "however", "они расходятся во мнениях": "they disagree", "о количестве заданий": "about the amount of homework"}
        status: correct
    feedback: "These elements record the shared ground and the point of conflict between the two sources."
  ru.c1.unit07.mediaciya.lesson02.exercise04.order_skhodyatsya:
    instruction: "Put the Russian words in order to state the shared point."
    accepted_answers:
      - {value: "оба источника сходятся в том что практика полезна", status: correct}
    feedback: "Оба источника сходятся в том, что практика полезна — both sources agree that practice is useful."
  ru.c1.unit07.mediaciya.lesson02.exercise05.write_soglasie:
    instruction: "Write the exact taught agreement sentence: Оба источника сходятся в том, что plus the shared point (practice is useful)."
    accepted_answers:
      - {value: "Оба источника сходятся в том, что практика полезна.", status: correct}
      - {value: "Оба источника сходятся в том, что практика полезна", status: correct}
    feedback: "Оба источника сходятся в том, что практика полезна."

  ru.c1.unit07.mediaciya.lesson03.exercise01.recognize_sohranit:
    instruction: "Which Russian phrase names what a mediator must preserve when relaying sources?"
    correct_option: "Разногласие нужно сохранить"
    distractors: ["Разногласие нужно опустить", "Детали нужно сохранить", "Согласие нужно скрыть"]
    accepted_answers: [{value: "Разногласие нужно сохранить", status: correct}]
    feedback: "*Разногласие нужно сохранить* means the disagreement must be preserved — never erase it to sound tidy."
  ru.c1.unit07.mediaciya.lesson03.exercise02.listen_raskhodyatsya:
    instruction: "Listen and select what you hear."
    correct_option: "However, they disagree about the amount of homework."
    distractors: ["However, they agree about the amount of homework.", "However, they disagree about the quality of teaching.", "Therefore, they agree about the amount of homework."]
    accepted_answers: [{value: "However, they disagree about the amount of homework.", status: correct}]
    feedback: "Однако они расходятся во мнениях о количестве заданий means however, they disagree about the amount of homework."
  ru.c1.unit07.mediaciya.lesson03.exercise03.match_otbor:
    instruction: "Match each Russian selection element to its English meaning."
    accepted_answers:
      - value: {"Суть в том, что": "the essence is that", "объём заданий спорен": "the amount of homework is disputed", "Лишние детали": "unnecessary details", "можно опустить": "can be omitted", "Разногласие между источниками": "the disagreement between the sources", "нужно сохранить": "must be preserved"}
        status: correct
    feedback: "These decisions — keep the essence, omit the extras, preserve the disagreement — are the mediator's selection."
  ru.c1.unit07.mediaciya.lesson03.exercise04.order_sohranit:
    instruction: "Put the Russian words in order to state what must be preserved."
    accepted_answers:
      - {value: "разногласие между источниками нужно сохранить", status: correct}
      - {value: "нужно сохранить разногласие между источниками", status: correct}
    feedback: "Разногласие между источниками нужно сохранить — the disagreement between the sources must be preserved."
  ru.c1.unit07.mediaciya.lesson03.exercise05.translate_otbor:
    instruction: "Translate into Russian: Unnecessary details can be omitted, but the disagreement must be preserved."
    accepted_answers:
      - {value: "Лишние детали можно опустить, а разногласие нужно сохранить.", status: correct}
      - {value: "Лишние детали можно опустить, а разногласие нужно сохранить", status: correct}
      - {value: "Лишние детали можно опустить, но разногласие нужно сохранить.", status: correct}
      - {value: "Лишние детали можно опустить, но разногласие нужно сохранить", status: correct}
    feedback: "Лишние детали можно опустить, а разногласие нужно сохранить."

  ru.c1.unit07.mediaciya.lesson04.exercise01.recognize_dostupno:
    instruction: "Which Russian phrase means 'with a plain word' — what you replace a difficult term with?"
    correct_option: "простым словом"
    distractors: ["доступным языком", "сложным словом", "точным термином"]
    accepted_answers: [{value: "простым словом", status: correct}]
    feedback: "*Заменить простым словом* means to replace a term with a plain word — resolving specialist vocabulary."
  ru.c1.unit07.mediaciya.lesson04.exercise02.listen_dostupno:
    instruction: "Listen and select what you hear."
    correct_option: "I will set out the essence in accessible language."
    distractors: ["I will set out the details in formal language.", "I will omit the essence in accessible language.", "I will set out the essence in technical terms."]
    accepted_answers: [{value: "I will set out the essence in accessible language.", status: correct}]
    feedback: "Изложу суть доступным языком means I will set out the essence in accessible language."
  ru.c1.unit07.mediaciya.lesson04.exercise03.match_dostupno:
    instruction: "Match each Russian relaying element to its English meaning."
    accepted_answers:
      - value: {"Объясню это": "I will explain this", "простыми словами": "in simple words", "Изложу суть": "I will set out the essence", "доступным языком": "in accessible language", "Термин": "a technical term", "заменю простым словом": "I will replace with a plain word"}
        status: correct
    feedback: "These moves condense source material and resolve terminology for a non-specialist audience."
  ru.c1.unit07.mediaciya.lesson04.exercise04.order_dostupno:
    instruction: "Put the Russian words in order to state the relay."
    accepted_answers:
      - {value: "изложу суть доступным языком", status: correct}
      - {value: "доступным языком изложу суть", status: correct}
    feedback: "Изложу суть доступным языком — I will set out the essence in accessible language."
  ru.c1.unit07.mediaciya.lesson04.exercise05.speak_dostupno:
    instruction: "Say aloud in Russian the taught relay opener: I'll put the gist in plain language."
    accepted_answers:
      - {value: "Изложу суть доступным языком.", status: correct}
      - {value: "Изложу суть доступным языком", status: correct}
    feedback: "Изложу суть доступным языком."

  ru.c1.unit07.mediaciya.lesson05.exercise01.read_sohranit:
    instruction: "Read the passage. Which point must be RETAINED when relaying it to a parent audience?"
    correct_option: "The disagreement about the amount of homework."
    distractors: ["The exact page numbers of each article.", "The authors' email addresses.", "A single source's claim with the other omitted."]
    accepted_answers: [{value: "The disagreement about the amount of homework.", status: correct}]
    feedback: "A mediator retains the essential claim and the disagreement, and drops details the audience does not need."
  ru.c1.unit07.mediaciya.lesson05.exercise02.read_opusit:
    instruction: "Read the passage. Which kind of detail can be OMITTED for a parent audience?"
    correct_option: "Unnecessary details the audience does not need."
    distractors: ["The unresolved uncertainty.", "The fact that the sources disagree.", "Which source made which claim."]
    accepted_answers: [{value: "Unnecessary details the audience does not need.", status: correct}]
    feedback: "You omit unnecessary details and replace specialist terms with plain words, but keep attribution, disagreement, and uncertainty."
  ru.c1.unit07.mediaciya.lesson05.exercise03.match_mediaciya:
    instruction: "Match each Russian sentence from the mediation to its function."
    accepted_answers:
      - value: {"Первый источник утверждает": "the first source states", "домашние задания закрепляют материал": "homework reinforces the material", "Второй источник считает": "the second source holds", "Оба источника сходятся": "the point where they agree", "Однако они расходятся во мнениях": "the point where they disagree", "По словам второго источника, польза не доказана": "the preserved uncertainty"}
        status: correct
    feedback: "Each sentence carries one mediation move: attribute, attribute, agree, disagree, and preserve uncertainty."
  ru.c1.unit07.mediaciya.lesson05.exercise04.listen_polnaya:
    instruction: "Listen to the complete mediation. In what order do the moves appear?"
    correct_option: "first claim → counterclaim → agreement → disagreement → uncertainty"
    distractors: ["first claim → counterclaim → disagreement → agreement → uncertainty", "counterclaim → first claim → agreement → uncertainty → disagreement", "agreement → first claim → counterclaim → disagreement → uncertainty"]
    accepted_answers: [{value: "first claim → counterclaim → agreement → disagreement → uncertainty", status: correct}]
    feedback: "The mediation attributes both claims, records agreement, then disagreement, and closes by preserving the uncertainty."

  ru.c1.unit07.mediaciya.lesson06.exercise01.read_map:
    instruction: "Read the passage. Which roadmap best describes a complete mediation?"
    correct_option: "attribute both claims → note agreement → note disagreement → preserve uncertainty"
