course:
  title: "Russian B1"
  description: "Learn B1-level Russian for giving advice and suggestions and responding to them, using тебе стоит + infinitive and if-I-were-you conditional advice."

units:
  ru.b1.unit45.sovety: {title: "Advice"}

lessons:
  ru.b1.unit45.lesson01.tebe_stoit: {title: "You should..."}
  ru.b1.unit45.lesson02.esli_by_ya_byl: {title: "If I were you..."}
  ru.b1.unit45.lesson03.sovet_kofe: {title: "Advice about coffee"}

teaching:
  ru.b1.unit45.lesson01.teach.u_menya_problema: {title: "У меня проблема, я плохо сплю по ночам.", gloss: "I have a problem, I sleep badly at night.", note: "States the problem before asking for advice.", example_gloss: "Dima, I have a problem, I sleep badly at night."}
  ru.b1.unit45.lesson01.teach.tebe_stoit_menshe_pit: {title: "Тебе стоит меньше пить кофе вечером.", gloss: "You should drink less coffee in the evening.", note: "*тебе стоит* + infinitive gives direct advice.", example_gloss: "If you sleep badly, you should drink less coffee in the evening."}
  ru.b1.unit45.lesson01.teach.stoit_infinitive_advice: {title: "тебе стоит + инфинитив = совет", gloss: "tebe stoit + infinitive = advice", note: "Use тебе стоит plus an infinitive to give someone direct advice.", example_gloss: "tebe stoit plus infinitive gives direct advice: you should drink less coffee."}
  ru.b1.unit45.lesson02.teach.esli_by_ya_byl: {title: "Если бы я был на твоём месте, я бы пил меньше кофе.", gloss: "If I were you, I would drink less coffee.", note: "*если бы...я бы* + past tense expresses conditional advice.", example_gloss: "If I were you, I would drink less coffee in the evening."}
  ru.b1.unit45.lesson02.teach.esli_by_grammar: {title: "если бы я был на твоём месте, я бы + прошедшее время = совет", gloss: "yesli by ya byl na tvoyom meste, ya by + past tense = advice", note: "This hypothetical construction softens advice by framing it as what the speaker would do.", example_gloss: null}
  ru.b1.unit45.lesson02.teach.chto_by_ty_sdelal: {title: "Что бы ты сделал на моём месте?", gloss: "What would you do in my place?", note: "A way to invite advice by asking a hypothetical question.", example_gloss: null}
  ru.b1.unit45.lesson03.teach.nastya_problem: {title: "Nastya states her problem", gloss: "Nastya: I have a problem, I sleep badly at night. What should I do?", note: "*Что мне делать?* = \"What should I do?\" — literally \"what (is there) for me to do\": dative *мне* + infinitive."}
  ru.b1.unit45.lesson03.teach.dima_advice: {title: "Dima gives advice", gloss: "Dima: You should drink less coffee in the evening.", note: "Direct advice with тебе стоит + infinitive."}
  ru.b1.unit45.lesson03.teach.nastya_accept: {title: "Nastya accepts and follows up", gloss: "Nastya: OK, I'll try. And what else can be done?", note: "Accepts the advice, then asks a follow-up question."}

