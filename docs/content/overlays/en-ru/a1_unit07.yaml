review: {status: "reviewed", required_next_reviewer: null, notes: "Fresh-context full review 2026-07-12 (new en-ru lane, full review). Zero defects: matching_pairs accepted_answers mirror realization pairs; listen_select/dialogue distractors never in tested audio, one correct each; glosses/case notes accurate; fill_in_blank single-word answers match blank placement; no bare-boolean YAML. Compiles 0 errors across all 9 units.\n\nSecond-pass review 2026-10-18: 5 fixes — teach.da_saditites: садитесь wrongly attributed to сесть, corrected to садиться; new teach.ofitsiantka_khorosho gloss/note for the previously untaught final audio turn; lesson03.exercise07.complete_a_na_sladkoe: added full-sentence variant with пожалуйста; lesson02.exercise08.write_order_food_drink: added the other 5 taught food+drink combinations; lesson03.exercise08.write_full_order: added 6 common variants. NATIVE FLAGS: Я хочу ... as the restaurant ordering frame is blunt (Мне, пожалуйста, ... / Я буду ... more natural)."}

course:
  title: "Russian A1"
  description: "Learn A1-level Russian for ordering a simple meal at a restaurant, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit07.food: {title: "Food"}

lessons:
  ru.a1.unit07.lesson01.v_restorane: {title: "At the restaurant"}
  ru.a1.unit07.lesson02.zakaz_edy: {title: "Ordering food and drinks"}
  ru.a1.unit07.lesson03.zakaz_dialog: {title: "Dialogue: ordering at a restaurant"}

teaching:
  ru.a1.unit07.lesson01.teach.menyu: {title: "меню", gloss: "menu", note: "меню is an indeclinable neuter noun borrowed from French -- it never changes form.", example_gloss: "Here is the menu."}
  ru.a1.unit07.lesson01.teach.ofitsiant: {title: "официант, официантка", gloss: "waiter, waitress", note: "официант is masculine and официантка is feminine, following the regular gender-noun ending pattern.", example_gloss: "The waitress works at a restaurant."}
  ru.a1.unit07.lesson01.teach.stol_svoboden: {title: "Этот столик свободен?", gloss: "Is this table free?", note: "столик is a diminutive of стол (\"table\") commonly used for a restaurant table; свободен (\"free/vacant\") agrees with the masculine noun."}
  ru.a1.unit07.lesson01.teach.da_saditites: {title: "Да, садитесь, пожалуйста.", gloss: "Yes, please sit down.", note: "садитесь is the formal/plural imperative of садиться (\"to sit down\"), used with вы."}
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat: {title: "Что будете заказывать?", gloss: "What will you be ordering?", note: "будете заказывать is a future-tense phrase (\"will be ordering\") the waiter uses to ask what the customer wants."}

  ru.a1.unit07.lesson02.teach.ya_khochu: {title: "Я хочу ...", gloss: "I want ...", note: "хочу is the first-person singular form of хотеть (\"to want\"), used to order food and drink."}
  ru.a1.unit07.lesson02.teach.chay_kofe: {title: "чай, кофе", gloss: "tea, coffee", note: "Both чай and кофе are commonly ordered drinks; кофе is indeclinable and grammatically masculine despite its -е ending.", example_gloss: ["I want tea.", "I want coffee."]}
  ru.a1.unit07.lesson02.teach.khleb_borshch: {title: "хлеб, борщ", gloss: "bread, borscht (beet soup)", note: "борщ is the classic Russian beet soup; both nouns are masculine.", example_gloss: ["Do you have bread?", "I want borscht."]}
  ru.a1.unit07.lesson02.teach.salat: {title: "салат", gloss: "salad", note: "и (\"and\") is used here to join two ordered items, as in борщ и салат.", example_gloss: "I want borscht and salad."}

  ru.a1.unit07.lesson03.teach.morozhenoe: {title: "мороженое", gloss: "ice cream", note: "мороженое is a neuter noun that looks like an adjective (\"frozen [thing]\"), a common pattern for Russian food nouns.", example_gloss: "For dessert, bring ice cream."}
  ru.a1.unit07.lesson03.teach.prinesite: {title: "Принесите, пожалуйста, ...", gloss: "Please bring ...", note: "Принесите is the formal/plural imperative of принести (\"to bring\"), used with вы."}
  ru.a1.unit07.lesson03.teach.spasibo: {title: "Спасибо.", gloss: "Thank you.", note: "Спасибо is the standard way to say thank you in any polite exchange."}
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete: {title: "The waitress asks what to order", gloss: "Waitress: What will you be ordering?", note: "The waitress opens by asking Что будете заказывать?"}
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch: {title: "The tourist orders food", gloss: "Tourist: I want borscht and salad.", note: "Турист (\"tourist\") answers with Я хочу борщ и салат."}
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit: {title: "The waitress asks about drinks", gloss: "Waitress: What will you drink?", note: "пить (\"to drink\") pairs with будете, mirroring the earlier заказывать question."}
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay: {title: "The tourist orders a drink", gloss: "Tourist: I want tea.", note: "The tourist answers simply with Я хочу чай."}
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe: {title: "The waitress asks about dessert", gloss: "Waitress: And for dessert?", note: "А на сладкое? is a shorthand follow-up question -- \"and for the sweet [course]?\""}
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe: {title: "The tourist orders dessert", gloss: "Tourist: For dessert, please bring ice cream.", note: "The tourist replies with На сладкое принесите мороженое, пожалуйста."}
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho: {title: "The waitress confirms the order", gloss: "Waitress: All right. Thank you.", note: "Хорошо (\"all right, OK\") confirms the order, and Спасибо closes the exchange politely."}

exercises:
  ru.a1.unit07.lesson02.zakaz_edy.exercise09.dictation_ya_khochu_chay_neutral:
    instruction: "Type what you hear."
    correct_option: "Я хочу чай"
    accepted_answers: [{value: "Я хочу чай", status: correct}]
    orthography_strict: true

  ru.a1.unit07.lesson01.exercise01.recognize_menyu:
    instruction: "Which word means \"menu\"?"
    correct_option: "меню"
    distractors: ["официант", "столик", "свободен"]
    accepted_answers: [{value: "меню", status: "correct"}]
    feedback: "меню means \"menu.\""
  ru.a1.unit07.lesson01.exercise02.recognize_ofitsiant:
    instruction: "Which word means \"waiter\"?"
    correct_option: "официант"
    distractors: ["меню", "столик", "пожалуйста"]
    accepted_answers: [{value: "официант", status: "correct"}]
    feedback: "официант means \"waiter.\""
  ru.a1.unit07.lesson01.exercise03.listen_select_stolik_svoboden:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "Is this table free?"
    distractors: ["What will you be ordering?", "Please sit down.", "Here is the menu."]
    accepted_answers: [{value: "Is this table free?", status: "correct"}]
    feedback: "The recording says Этот столик свободен? (\"Is this table free?\")."
  ru.a1.unit07.lesson01.exercise04.match_restaurant_basics:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "меню", right: "menu"}
          - {left: "официант", right: "waiter"}
          - {left: "стол", right: "table"}
          - {left: "свободен", right: "free (vacant)"}
        status: "correct"
    feedback: "меню=menu, официант=waiter, стол=table, свободен=free (vacant)."
  ru.a1.unit07.lesson01.exercise05.order_stolik_svoboden:
    instruction: "Put the words in the correct order to say \"Is this table free?\""
    accepted_answers:
      - {value: ["Этот", "столик", "свободен"], status: "correct"}
    feedback: "The correct order is Этот столик свободен?"
  ru.a1.unit07.lesson01.exercise06.listen_order_saditites:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Да", "садитесь", "пожалуйста"], status: "correct"}
    feedback: "The correct order is Да, садитесь, пожалуйста (\"Yes, please sit down\")."
  ru.a1.unit07.lesson01.exercise07.complete_stolik_svoboden:
    instruction: "Complete the question: Этот столик ___? (free)"
    accepted_answers:
      - {value: "свободен", status: "correct"}
      - {value: "Этот столик свободен", status: "correct"}
    feedback: "свободен means \"free (vacant),\" agreeing with столик."
  ru.a1.unit07.lesson01.exercise08.write_ask_table_free:
    instruction: "Write a question asking if this table is free, using \"Этот столик...?\"."
    accepted_answers:
      - {value: "Этот столик свободен?", status: "correct"}
      - {value: "Этот столик свободен", status: "correct"}
    feedback: "Этот столик свободен? means \"Is this table free?\""

  ru.a1.unit07.lesson02.exercise01.recognize_chay:
    instruction: "Which word means \"tea\"?"
    correct_option: "чай"
    distractors: ["кофе", "хлеб", "борщ"]
    accepted_answers: [{value: "чай", status: "correct"}]
    feedback: "чай means \"tea.\""
  ru.a1.unit07.lesson02.exercise02.recognize_borshch:
    instruction: "Which word means \"borscht (beet soup)\"?"
    correct_option: "борщ"
    distractors: ["салат", "чай", "хлеб"]
    accepted_answers: [{value: "борщ", status: "correct"}]
    feedback: "борщ means \"borscht (beet soup).\""
  ru.a1.unit07.lesson02.exercise03.listen_select_khochu_chay:
    instruction: "Listen to the recording. What does the speaker want to drink?"
    correct_option: "Tea"
    distractors: ["Coffee", "Bread", "Salad"]
    accepted_answers: [{value: "Tea", status: "correct"}]
    feedback: "The recording says Я хочу чай (\"I want tea\")."
  ru.a1.unit07.lesson02.exercise04.match_food_drink_words:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "чай", right: "tea"}
          - {left: "кофе", right: "coffee"}
          - {left: "хлеб", right: "bread"}
          - {left: "борщ", right: "borscht"}
          - {left: "салат", right: "salad"}
        status: "correct"
    feedback: "чай=tea, кофе=coffee, хлеб=bread, борщ=borscht, салат=salad."
  ru.a1.unit07.lesson02.exercise05.order_ya_khochu_kofe:
    instruction: "Put the words in the correct order to say \"I want coffee.\""
    accepted_answers:
      - {value: ["Я", "хочу", "кофе"], status: "correct"}
    feedback: "The correct order is Я хочу кофе."
  ru.a1.unit07.lesson02.exercise06.listen_order_borshch_salat:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Я", "хочу", "борщ", "и", "салат"], status: "correct"}
    feedback: "The correct order is Я хочу борщ и салат (\"I want borscht and salad\")."
  ru.a1.unit07.lesson02.exercise07.complete_ya_khochu:
    instruction: "Complete the sentence: Я ___ чай. (want)"
    accepted_answers:
      - {value: "хочу", status: "correct"}
      - {value: "Я хочу чай", status: "correct"}
    feedback: "хочу means \"want,\" the first-person form of хотеть."
  ru.a1.unit07.lesson02.exercise08.write_order_food_drink:
    instruction: "Write a sentence ordering one food and one drink, using \"Я хочу...\"."
    accepted_answers:
      - {value: "Я хочу борщ и чай.", status: "correct"}
      - {value: "Я хочу борщ и чай", status: "correct"}
      - {value: "Я хочу борщ и кофе", status: "correct"}
      - {value: "Я хочу салат и чай", status: "correct"}
      - {value: "Я хочу салат и кофе", status: "correct"}
      - {value: "Я хочу хлеб и чай", status: "correct"}
      - {value: "Я хочу хлеб и кофе", status: "correct"}
    feedback: "Я хочу борщ и чай means \"I want borscht and tea.\""

  ru.a1.unit07.lesson03.exercise01.choose_ask_menu:
    instruction: "You want the waiter to bring you a menu. What do you say?"
    correct_option: "Принесите, пожалуйста, меню."
    distractors: ["Что будете заказывать?", "Спасибо.", "Я хочу чай."]
    accepted_answers: [{value: "Принесите, пожалуйста, меню.", status: "correct"}]
    feedback: "Принесите, пожалуйста, меню means \"Please bring the menu.\""
  ru.a1.unit07.lesson03.exercise02.listen_select_dessert:
    instruction: "Listen to the recording. What dessert is ordered?"
    correct_option: "Ice cream"
    distractors: ["Bread", "Salad", "Coffee"]
    accepted_answers: [{value: "Ice cream", status: "correct"}]
    feedback: "The recording says На сладкое принесите мороженое (\"For dessert, bring ice cream\")."
  ru.a1.unit07.lesson03.exercise03.dialogue_comprehension_restoran_zakaz:
    instruction: "Listen to the dialogue. What did the tourist order to eat, drink, and for dessert?"
    correct_option: "Borscht and salad, tea, and ice cream"
    distractors: ["Bread and salad, coffee, and ice cream", "Borscht and salad, coffee, and cake", "Borscht only, tea, and no dessert"]
    accepted_answers: [{value: "Borscht and salad, tea, and ice cream", status: "correct"}]
    feedback: "The tourist orders борщ и салат, then чай, then мороженое for dessert."
  ru.a1.unit07.lesson03.exercise04.match_order_phrases:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Что будете заказывать?", right: "What will you be ordering?"}
          - {left: "Принесите, пожалуйста, меню.", right: "Bring me a menu, please."}
          - {left: "Я хочу борщ.", right: "I want borscht."}
          - {left: "На сладкое принесите мороженое.", right: "For dessert, bring ice cream."}
          - {left: "Спасибо.", right: "Thank you."}
          - {left: "Вот меню.", right: "Here's the menu."}
        status: "correct"
    feedback: "Each phrase is part of a typical restaurant-ordering exchange."
  ru.a1.unit07.lesson03.exercise05.order_na_sladkoe_morozhenoe:
    instruction: "Put the words in the correct order to say \"For dessert, bring ice cream.\""
    accepted_answers:
      - {value: ["На", "сладкое", "принесите", "мороженое"], status: "correct"}
    feedback: "The correct order is На сладкое принесите мороженое."
  ru.a1.unit07.lesson03.exercise06.reply_chto_budete_zakazyvat:
    instruction: "The waitress asks \"Что будете заказывать?\" Reply that you want borscht and tea."
    accepted_answers:
      - {value: "Я хочу борщ и чай.", status: "correct"}
      - {value: "Я хочу борщ и чай", status: "correct"}
    feedback: "Я хочу борщ и чай means \"I want borscht and tea.\""
  ru.a1.unit07.lesson03.exercise07.complete_a_na_sladkoe:
    instruction: "Complete the sentence: На сладкое ___ мороженое, пожалуйста. (bring)"
    accepted_answers:
      - {value: "принесите", status: "correct"}
      - {value: "На сладкое принесите мороженое", status: "correct"}
      - {value: "На сладкое принесите мороженое, пожалуйста", status: "correct"}
    feedback: "принесите means \"bring\" (formal imperative)."
  ru.a1.unit07.lesson03.exercise08.write_full_order:
    instruction: "Write two or three sentences ordering a main dish, a drink, and a dessert."
    accepted_answers:
      - {value: "Я хочу борщ и чай. На сладкое принесите мороженое, пожалуйста.", status: "correct"}
      - {value: "Я хочу борщ и салат. Я хочу чай. На сладкое принесите мороженое.", status: "correct"}
      - {value: "Я хочу борщ и салат. Я хочу чай. На сладкое принесите мороженое, пожалуйста.", status: "correct"}
      - {value: "Я хочу борщ и чай. На сладкое принесите мороженое.", status: "correct"}
      - {value: "Я хочу борщ. Я хочу чай. На сладкое принесите мороженое, пожалуйста.", status: "correct"}
      - {value: "Я хочу борщ. Я хочу чай. На сладкое принесите мороженое.", status: "correct"}
      - {value: "Я хочу салат и кофе. На сладкое принесите мороженое, пожалуйста.", status: "correct"}
      - {value: "Я хочу борщ и кофе. На сладкое принесите мороженое, пожалуйста.", status: "correct"}
    feedback: "A natural order combines Я хочу with a main dish and drink, then На сладкое принесите for dessert."
