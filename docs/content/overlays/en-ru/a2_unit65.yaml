    feedback: '*В воскресенье я ездил к дяде* = On Sunday I went to my uncle''s. *Я ездил к дяде в воскресенье* is also correct. A woman says *ездила*.'
  ru.a2.unit65.lesson02.exercise01.choose_katalsya_na_velosipede:
    instruction: Which is the correct masculine past tense of *кататься* (to ride, to cycle)?
    correct_option: катался на велосипеде
    distractors:
    - катал на велосипеде
    - катаюсь на велосипеде
    - кататься на велосипеде
    accepted_answers:
    - value: катался на велосипеде
      status: correct
    feedback: '*Кататься* ends in *-ться*, so it keeps *-ся* in the past tense: *катался*. *Катал* (without *-ся*) is a different, transitive verb, *катаюсь* is the present and *кататься* the infinitive.'
  ru.a2.unit65.lesson02.exercise02.listen_ya_katalsya_na:
    instruction: Listen and select what you hear.
    correct_option: Я катался на велосипеде.
    distractors:
