teaching:
  ru.a2.unit65.lesson01.teach.vykhodnye_proshlye_vykhodnye:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Выходные* is a plural noun (a day or days off) and takes the plural: *Выходные начинаются*. *Прошлые выходные* means the weekend that has just passed; with *на* it answers ''when'': *на прошлых выходных*.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  ru.a2.unit65.lesson01.teach.subbota_voskresene:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: Day names are not capitalised in Russian unless they start a sentence.
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  ru.a2.unit65.lesson01.teach.khodit_po_magazinam:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*Ходить по магазинам* is the usual phrase for going shopping; *ходить* is the verb for going on foot and coming back, and *по магазинам* means ''round the shops''. For one particular errand you can say *делать покупки*.'
    example_gloss: Every Saturday I do the shopping.
  ru.a2.unit65.lesson01.teach.khodit_v_gosti:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*Ходить в гости* means to visit people at their home; add *к* + dative for the person: *ходить в гости к дяде*. For a longer trip by transport use *ездить к дяде*.'
    example_gloss: I often go and visit my uncle.
  ru.a2.unit65.lesson01.teach.rynok_park_kino:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*Рынок* and *парк* are masculine, *кино* is neuter and never changes. *На рынок / на рынке* take *на*, *в парк / в парке* take *в*, and *в кино* stays the same.'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  ru.a2.unit65.lesson01.teach.rabotat_gotovit_est:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  ru.a2.unit65.lesson01.teach.chto_ty_delal:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *Делал* is the past tense of *делать*; the *ты* form is masculine here, a woman would be asked *Что ты делала*.
  ru.a2.unit65.lesson01.teach.v_subbotu_ya:
    title: 'The past tense: -л, -ла, -ло, -ли'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'Russian has only one past tense and no helper verb. Take the infinitive, drop *-ть* and add *-л*: *ходить → ходил*. The ending shows the gender of the subject: *-л* for a man (*я ходил*), *-ла* for a woman (*я ходила*), *-ло* for a neuter noun (*оно было*), *-ли* for a plural (*мы ходили*). The verb agrees with the speaker, so a man and a woman say the same sentence in slightly different ways: *Я ездил к дяде / Я ездила к дяде*.'
  ru.a2.unit65.lesson02.teach.gulyat_katatsya_na:
    title: Four weekend activities
    gloss: to walk / to cycle / to play / to do sports
    note: '*Играть в* + accusative is used for games and sports with a ball (*играть в футбол*); *играть на* + prepositional is for instruments. *Заниматься спортом* means doing sports in general; it is reflexive, so it keeps *-ся*.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  ru.a2.unit65.lesson02.teach.rabotat_rabotal_gotovit:
    title: 'Regular past forms: infinitive − ть + л'
    gloss: work → worked, cook → cooked, walk → walked, play → played, cycle → cycled
    note: 'Most verbs are regular: drop *-ть* from the infinitive and add *-л* (masculine), *-ла* (feminine), *-ло* (neuter) or *-ли* (plural): *работать → работал, работала, работало, работали*. Reflexive verbs keep *-ся* after the ending: *кататься → катался, каталась, катались*. Stress usually stays on the same syllable, with a few exceptions you learn with the verb (*быть → был, была, было, были*).'
  ru.a2.unit65.lesson02.teach.ya_zanimayus_sportom:
    title: Reflexive verbs keep -ся
    gloss: I exercise. I exercised.
    note: 'Reflexive verbs keep *-ся* in the past tense: *заниматься → занимался* (masculine), *занималась* (feminine). After a consonant the ending is *-ся* (*занимался*), after a vowel it is *-сь* (*занималась*).'
  ru.a2.unit65.lesson02.teach.ya_gulyal_v:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*Гулять* describes walking around without a destination, so it is a good verb for a stroll: *гулять в парке*. With a destination you say *ходить* or *идти*.'
  ru.a2.unit65.lesson02.teach.ya_igral_v:
    title: Playing football
    gloss: I played football.
    note: 'Sports with a ball take *в* + accusative: *играть в футбол → я играл в футбол*.'
  ru.a2.unit65.lesson03.teach.byt_ostatsya:
    title: To be and to stay
    gloss: to be / to stay
    note: '*Быть* (to be) has no present tense in Russian, but it does have a past tense: *был, была, было, были*. *Остаться* (to stay) is a perfective verb: *я остался, я осталась*.'
    example_gloss:
    - I want to stay at home too.
    - It can be fun.
  ru.a2.unit65.lesson03.teach.idti_shyol_priyti:
    title: Past forms without -л
    gloss: go → went. arrive → arrived. can → could. lie down → lay down. carry → carried. help → helped. lead → led.
    note: 'A few verbs have a masculine past with no *-л*: *идти → шёл, мочь → мог, лечь → лёг*. Only the masculine is irregular. The other forms are regular: *шла, шло, шли*; *могла, могло, могли*. Learn these verbs as whole words, because the masculine ending is not predictable.'
  ru.a2.unit65.lesson03.teach.ya_posmotrel_film:
    title: Watching a film
    gloss: I saw a film.
    note: '*Посмотреть фильм* is the perfective verb for watching a film from start to end. *Смотреть фильм* (imperfective) stresses the time you spent watching.'
  ru.a2.unit65.lesson03.teach.ya_dolgo_spal:
    title: Two verbs, one subject
    gloss: I slept for a long time and read a book.
    note: 'With one subject and two actions, you need the subject only once and both verbs agree with it: *Я долго спал и читал книгу.* Both verbs are imperfective because they describe a process that lasted.'
  ru.a2.unit65.lesson03.teach.ya_navestil_dyadyu:
    title: Visiting someone
    gloss: I visited my uncle.
    note: '*Навестить* (perfective) means to pay a visit to a person and is followed by the accusative: *навестить дядю*. It is close in meaning to *Я был у дяди* or *Я ездил к дяде*.'
  ru.a2.unit65.lesson03.teach.ya_posmotrel_film_2:
    title: Process or result?
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: 'Most Russian verbs come in pairs of aspects. Use the imperfective for a process, a repeated action or how long something lasted: *Я читал книгу* (I was reading / I read for a while). Use the perfective for one finished result: *Я прочитал книгу* (I finished the book). Perfective verbs often add a prefix: *читать → прочитать, смотреть → посмотреть, готовить → приготовить, делать → сделать*. For a first telling of the weekend, the imperfective is the safe choice; use the perfective when the result matters. Things that happened by themselves take the neuter: *Стало поздно* (It got late).'
  ru.a2.unit65.lesson03.teach.idti_shyol_ekhat:
    title: Verbs of movement and change (past forms)
    gloss: go (on foot) → went, go (by vehicle) → went, stay → stayed, become → became, be → was
    note: 'These five verbs are very common in a weekend story: *я шёл, я ехал, я остался, я стал, я был*. For the women, the endings are *-ла* (*шла, ехала, осталась, стала, была*). Verbs of motion come in pairs: *ходить / идти* (on foot), *ездить / ехать* (by vehicle); the first of each pair is for habits and round trips (*Я ездил к дяде*).'
  ru.a2.unit65.lesson04.teach.snachala_potom:
    title: First and then
    gloss: first / after that
    note: '*Сначала* and *потом* put actions in order. They are the connectors you need to tell a weekend story in sequence; *потом* can be replaced by *затем* or *после этого*.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  ru.a2.unit65.lesson04.teach.snachala_ya_khodil:
    title: 'Telling it in order: сначала, потом'
    gloss: First I went to the market, then I cooked.
    note: 'Russian word order is flexible, and no helper verb moves. *Сначала* and *потом* simply open the clause, and the subject can be dropped in the second part if it is the same: *Сначала я ходил на рынок, потом готовил.* The verb always agrees in gender with the person.'
  ru.a2.unit65.lesson04.teach.ya_ne_rabotal:
    title: 'Saying what you did not do: не'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'Put *не* directly before the verb: *Я не работал*. It is the same word for every type of negation with a verb, and it stays in front of the past-tense verb. The object does not change here: *Я не читал книгу*. With the verb *быть* the negative past is *не было*, and the thing that is missing goes in the genitive: *У меня не было времени*.'
  ru.a2.unit65.lesson04.teach.ya_ne_pil:
    title: 'Saying you had none: не было, ни'
    gloss: I didn't drink any coffee. I didn't have time. I didn't see a single film.
    note: 'For ''I didn''t have X'' Russian uses *у меня не было* + genitive: *У меня не было времени*. For ''not even one'' use *ни одного* (masculine) or *ни одной* (feminine) + genitive: *Я не смотрел ни одного фильма*. Do not use *нет* with a past-tense verb: *нет* only means ''there isn''t''.'
  ru.a2.unit65.lesson04.teach.ty_zanimalsya_sportom:
    title: Nastya asks about exercise
    gloss: 'Nastya: Did you exercise?'
    note: 'A yes/no question keeps the same word order as the statement and only the intonation rises: *Ты занимался спортом?* The answer repeats the verb: *Нет, я не занимался спортом.*'
  ru.a2.unit65.lesson04.teach.net_ya_ne:
    title: Dima says no
    gloss: 'Dima: No, I didn''t exercise.'
  ru.a2.unit65.lesson05.teach.privet_nastya_eto:
    title: A message from Lena
    gloss: Hi Nastya! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Lena is telling Nastya about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Notice that every past-tense verb ends in *-ла*, because Lena is a woman: *ходила, купила, гуляла, готовила, осталась, спала, читала*. *Днём* and *вечером* mean ''in the afternoon'' and ''in the evening''.'
    glosses:
      Привет: hi
      спокойные: quiet, calm
      выходные: weekend
      были: were (past of быть)
      утром: morning
      рынок: market
      хлеб: bread
      купила: bought (past of купить)
      Днём: in the afternoon, during the day
      парке: park
      гуляла: walked (past of гулять)
      Вечером: in the evening
      готовила: cooked (past of готовить)
      не: not
      занималась: did sport (past of заниматься)
      ни: not even one
      фильма: film
      смотрела: watched (past of смотреть)
      воскресенье: Sunday
      осталась: stayed at home
      долго: long, for a long time
      спала: slept (past of спать)
      книгу: book
      читала: read (past of читать)
  ru.a2.unit65.lesson06.teach.privet_dima_chto:
    title: Nastya asks Dima about his weekend
    gloss: 'Nastya: Hi Dima! What did you do last weekend?'
  ru.a2.unit65.lesson06.teach.v_subbotu_ya:
    title: Dima describes Saturday
    gloss: 'Dima: On Saturday I went to my uncle''s in Saint Petersburg. I ate at my uncle''s.'
    note: '*К дяде* is the direction (to my uncle''s), *у дяди* is the place (at my uncle''s): *Я ездил к дяде. Я обедал у дяди.* *К* takes the dative (*дяде*) and *у* takes the genitive (*дяди*).'
  ru.a2.unit65.lesson06.teach.zdorovo_a_v:
    title: Nastya asks about Sunday
    gloss: 'Nastya: Nice! And Sunday?'
  ru.a2.unit65.lesson06.teach.v_voskresene_ya:
    title: Dima describes Sunday and asks back
    gloss: 'Dima: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  ru.a2.unit65.lesson06.teach.ya_ezdila_k:
    title: Nastya describes her weekend
    gloss: 'Nastya: I went to my parents''. I didn''t do any shopping, but I cooked.'
exercises:
  ru.a2.unit65.lesson01.exercise01.choose_v_subbotu_ya:
    instruction: Choose the Russian sentence meaning 'On Saturday I did the shopping.'
    correct_option: В субботу я ходил по магазинам.
    distractors:
    - В субботу я ходить по магазинам.
    - В воскресенье я ходил по магазинам.
    - В субботу я хожу по магазинам.
    accepted_answers:
    - value: В субботу я ходил по магазинам.
      status: correct
    feedback: '*В субботу я ходил по магазинам* = On Saturday I did the shopping. The past tense is the infinitive without *-ть* plus *-л*; the present *хожу* and the bare infinitive *ходить* do not tell a story about last weekend.'
  ru.a2.unit65.lesson01.exercise02.listen_chto_ty_delal:
