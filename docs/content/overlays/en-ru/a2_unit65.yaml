    - Что ты пил на прошлых выходных?
    accepted_answers:
    - value: Что ты делал на прошлых выходных?
      status: correct
    feedback: '*Что ты делал на прошлых выходных?* = What did you do last weekend? *Делал* is the past tense of *делать*.'
