course:
  title: "Russian A2"
  description: "Grammar-led A2 Russian continuing the Nastya and Dima storyline."
  learning_goal: "Ask whether something is allowed and state what must be done, what must not be done and what does not need to be done."
units:
  ru.a2.unit74.mozhno_nelzya: {"title": "What is allowed and what is needed", "description": "Ask what is allowed and state rules with можно, нельзя, нужно and не нужно."}
lessons:
  ru.a2.unit74.lesson01.mozhno: {"title": "May I?"}
  ru.a2.unit74.lesson02.nelzya: {"title": "Not allowed"}
  ru.a2.unit74.lesson03.nuzhno: {"title": "I need to"}
  ru.a2.unit74.lesson04.ne_nuzhno: {"title": "No need, or not allowed"}
  ru.a2.unit74.lesson05.pravila: {"title": "Library rules"}
  ru.a2.unit74.lesson06.dialog: {"title": "In the library"}
teaching:
  ru.a2.unit74.lesson01.teach.mozhno: {"title": "можно + infinitive", "gloss": "it is allowed / come in / sit / read / take", "note": "*Можно* + infinitive says that something is allowed. With a question mark it asks permission: *Можно войти?* = May I come in?", "example_gloss": ["May I come in?", "You can sit and read here.", "You can take books."]}
  ru.a2.unit74.lesson01.teach.slova: {"title": "Library words", "gloss": "library / here / books / at home (direction)", "note": "*В библиотеке* is 'in the library' (prepositional case). *Домой* means 'home' as a direction.", "example_gloss": ["In the library you can take books.", "You can read here.", "You can take books home."]}
  ru.a2.unit74.lesson01.teach.gn_mozhno: {"title": "Allowed: можно", "gloss": "May I come in? You can sit here.", "note": "*Можно* has no endings and needs no subject. Put the infinitive after it: *можно сидеть*, *можно брать*. In a question it asks 'is it allowed?'."}
  ru.a2.unit74.lesson01.teach.gn_dat: {"title": "Who is allowed: мне, тебе, вам", "gloss": "I may come in. You may sit here.", "note": "To say who is allowed, add a pronoun in the dative case before *можно*: *мне можно*, *тебе можно*, *вам можно*."}
  ru.a2.unit74.lesson02.teach.nelzya: {"title": "нельзя + infinitive", "gloss": "it is not allowed / take photos / loudly / speak / eat / drink", "note": "*Нельзя* + infinitive says that something is not allowed or not possible: *нельзя пить*.", "example_gloss": ["You may not take photos here.", "You may not talk loudly in the library.", "You may not eat or drink here."]}
  ru.a2.unit74.lesson02.teach.sv: {"title": "Linking words", "gloss": "no / but / also", "note": "*Но* links an allowed thing with a forbidden one. *Нет* is 'no'. *Тоже* means 'also'.", "example_gloss": ["No, you may not drink here.", "Reading is allowed, but taking photos is not.", "Talking loudly is not allowed either."]}
  ru.a2.unit74.lesson02.teach.gn_nelzya: {"title": "Not allowed: нельзя", "gloss": "You may not take photos here. You may not talk loudly.", "note": "*Нельзя* is the opposite of *можно*. It is used for a ban and it takes an imperfective infinitive: *нельзя говорить*."}
  ru.a2.unit74.lesson02.teach.gn_no: {"title": "Allowed but not allowed", "gloss": "Reading is allowed, but eating is not.", "note": "Put *можно* and *нельзя* together with *но* to say what is and is not allowed."}
  ru.a2.unit74.lesson03.teach.nuzhno: {"title": "нужно, надо + infinitive", "gloss": "it is necessary / it is necessary (everyday) / go / take / come / wait", "note": "*Нужно* and *надо* say that something must be done. *Надо* is a little more everyday. Take a perfective infinitive for one action: *взять*, *прийти*.", "example_gloss": ["I have to go.", "You have to get a card.", "We have to come tomorrow.", "He has to wait at home."]}
  ru.a2.unit74.lesson03.teach.dat: {"title": "Pronouns in the dative", "gloss": "to me / to you (friend) / to him / to her / to us / to you (formal or plural) / to them", "note": "The person who must do something goes in the dative: *мне нужно*, *тебе нужно*, *ему нужно*.", "example_gloss": ["I have to go.", "She has to wait.", "You have to get a card.", "They have to come tomorrow."]}
  ru.a2.unit74.lesson03.teach.gn_dat2: {"title": "Who must: dative + нужно", "gloss": "I have to, you have to, he has to, she has to, we have to, you have to, they have to", "note": "In Russian 'I must' is 'to me it is necessary': *мне нужно*, *тебе нужно*, *ему нужно*, *ей нужно*, *нам нужно*, *вам нужно*, *им нужно*."}
  ru.a2.unit74.lesson03.teach.gn_nuzhno: {"title": "нужно or надо", "gloss": "I have to go. We have to go.", "note": "*Нужно* and *надо* mean the same. The infinitive follows them; it does not change."}
  ru.a2.unit74.lesson04.teach.pay: {"title": "Pay and free", "gloss": "to pay / free / to come (repeatedly) / there is no need / there is no need (everyday)", "note": "*Платить* is 'to pay', *бесплатно* is 'free'. *Приходить* is an imperfective infinitive; *не нужно* and *не надо* say that something is not necessary.", "example_gloss": ["It is free here, you do not need to pay.", "You do not need to come tomorrow.", "I do not need to wait."]}
  ru.a2.unit74.lesson04.teach.gn_ne: {"title": "No need: не нужно", "gloss": "You do not need to pay.", "note": "*Не нужно* and *не надо* mean there is no need. They take an imperfective infinitive: *не нужно платить*."}
  ru.a2.unit74.lesson04.teach.gn_contrast: {"title": "Нельзя is a ban, не нужно is no need", "gloss": "You may not talk loudly. You do not need to talk loudly.", "note": "*Нельзя* forbids. *Не нужно* only says that it is not necessary. Compare: *нельзя фотографировать* (banned) and *не нужно платить* (not required)."}
  ru.a2.unit74.lesson04.teach.gn_aspect: {"title": "Нужно + one action, не нужно + repetition", "gloss": "You need to take a card. You do not need to take a card.", "note": "After *нужно* a perfective infinitive usually names one action (*взять*). After *не нужно* the imperfective is the normal choice (*брать*)."}
  ru.a2.unit74.lesson05.teach.v5: {"title": "Words for the rules", "gloss": "here are / rules / this", "note": "*Вот* points to something: *Вот правила* = Here are the rules.", "example_gloss": ["Here are the library rules.", "This is free.", "These are the rules."]}
  ru.a2.unit74.lesson05.teach.reading: {"title": "Rules from Nastya", "gloss": "Hi, Dima! Here are the library rules. Here you can read and take books home. You need to get a card. You do not need to pay: it is free. You may not talk loudly, and you may not eat or drink. Taking photos is not allowed either. Nastya", "note": "Allowed (*можно*), forbidden (*нельзя*), necessary (*нужно*) and not necessary (*не нужно*) all appear in the rules.", "glosses": {"правила": "rules", "карточку": "card (accusative)", "бесплатно": "free of charge"}}
  ru.a2.unit74.lesson06.teach.q: {"title": "Dima asks about photos", "gloss": "Dima: Nastya, may I take photos here?"}
  ru.a2.unit74.lesson06.teach.a: {"title": "Nastya says what is allowed", "gloss": "Nastya: No, you may not. But you can read and take books home."}
  ru.a2.unit74.lesson06.teach.q2: {"title": "Dima asks about a card", "gloss": "Dima: And do I need to get a card?"}
  ru.a2.unit74.lesson06.teach.a2: {"title": "Nastya answers", "gloss": "Nastya: Yes, you need to get a card."}
  ru.a2.unit74.lesson06.teach.q3: {"title": "Dima asks about paying", "gloss": "Dima: And do I need to pay?"}
  ru.a2.unit74.lesson06.teach.a3: {"title": "Nastya says it is free", "gloss": "Nastya: No, you do not need to pay. It is free."}
exercises:
  ru.a2.unit74.lesson01.exercise01.sit: {"instruction": "Choose the correct English meaning.", "correct_option": "You can sit and read here.", "distractors": ["You cannot sit and read here.", "You have to sit and read here.", "You can sit and write here."], "accepted_answers": [{"value": "You can sit and read here.", "status": "correct"}], "feedback": "*Можно* = it is allowed."}
  ru.a2.unit74.lesson01.exercise02.voyti: {"instruction": "Choose the correct English meaning.", "correct_option": "May I come in?", "distractors": ["Must I come in?", "Did he come in?", "Can you come in?"], "accepted_answers": [{"value": "May I come in?", "status": "correct"}], "feedback": "*Можно войти?* asks for permission."}
  ru.a2.unit74.lesson01.exercise03.w1: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "можно", "right": "it is allowed"}, {"left": "войти", "right": "to come in"}, {"left": "сидеть", "right": "to sit"}, {"left": "читать", "right": "to read"}, {"left": "брать", "right": "to take"}, {"left": "здесь", "right": "here"}, {"left": "библиотека", "right": "library"}, {"left": "книги", "right": "books"}], "status": "correct"}], "feedback": "These words recur in the whole unit."}
  ru.a2.unit74.lesson01.exercise04.bib: {"instruction": "Put the words in order to say 'In the library you can take books.'", "correct_option": "В библиотеке можно брать книги", "accepted_answers": [{"value": "В библиотеке можно брать книги", "status": "correct"}, {"value": "Можно брать книги в библиотеке", "status": "correct"}, {"value": "Книги можно брать в библиотеке", "status": "correct"}, {"value": "В библиотеке книги можно брать", "status": "correct"}], "feedback": "*Можно* is followed by the infinitive."}
  ru.a2.unit74.lesson01.exercise05.blank_mozhno: {"instruction": "Complete the sentence: 'You can sit here.'", "correct_option": "можно", "accepted_answers": [{"value": "можно", "status": "correct"}], "feedback": "*Можно* = it is allowed."}
  ru.a2.unit74.lesson01.exercise06.sidet: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Здесь можно сидеть?", "status": "correct"}, {"value": "Здесь можно сидеть", "status": "correct"}, {"value": "Можно здесь сидеть?", "status": "correct"}, {"value": "Можно здесь сидеть", "status": "correct"}, {"value": "Можно сидеть здесь?", "status": "correct"}, {"value": "Можно сидеть здесь", "status": "correct"}], "feedback": "A question uses the same words; the voice rises."}
  ru.a2.unit74.lesson01.exercise07.knigi: {"instruction": "Write the requested Russian sentence.", "correct_option": "В библиотеке можно брать книги.", "accepted_answers": [{"value": "В библиотеке можно брать книги.", "status": "correct"}, {"value": "В библиотеке можно брать книги", "status": "correct"}, {"value": "Можно брать книги в библиотеке.", "status": "correct"}, {"value": "Можно брать книги в библиотеке", "status": "correct"}, {"value": "В библиотеке книги можно брать.", "status": "correct"}, {"value": "В библиотеке книги можно брать", "status": "correct"}, {"value": "Книги можно брать в библиотеке.", "status": "correct"}, {"value": "Книги можно брать в библиотеке", "status": "correct"}], "feedback": "*Можно* + infinitive."}
  ru.a2.unit74.lesson02.exercise01.gromko: {"instruction": "Choose the correct English meaning.", "correct_option": "You may not talk loudly in the library.", "distractors": ["You can talk loudly in the library.", "You have to talk loudly in the library.", "You can read loudly in the library."], "accepted_answers": [{"value": "You may not talk loudly in the library.", "status": "correct"}], "feedback": "*Нельзя* = it is not allowed."}
  ru.a2.unit74.lesson02.exercise02.foto: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Здесь нельзя фотографировать.", "distractors": ["Здесь можно фотографировать.", "Здесь нет фотографировать.", "Здесь нельзя библиотека."], "accepted_answers": [{"value": "Здесь нельзя фотографировать.", "status": "correct"}], "feedback": "*Нельзя* + infinitive."}
  ru.a2.unit74.lesson02.exercise03.w2: {"instruction": "Match each Russian word to its English meaning.", "accepted_answers": [{"value": [{"left": "нельзя", "right": "it is not allowed"}, {"left": "можно", "right": "it is allowed"}, {"left": "но", "right": "but"}, {"left": "громко", "right": "loudly"}, {"left": "говорить", "right": "to speak"}, {"left": "есть", "right": "to eat"}, {"left": "пить", "right": "to drink"}], "status": "correct"}], "feedback": "These words are used for rules."}
  ru.a2.unit74.lesson02.exercise04.read: {"instruction": "Put the words in order to say 'Reading is allowed, but taking photos is not.'", "correct_option": "Читать можно но фотографировать нельзя", "accepted_answers": [{"value": "Читать можно но фотографировать нельзя", "status": "correct"}, {"value": "Фотографировать нельзя но читать можно", "status": "correct"}], "feedback": "*Но* joins the two halves."}
  ru.a2.unit74.lesson02.exercise05.blank_nelzya: {"instruction": "Complete the sentence: 'You may not talk loudly here.'", "correct_option": "нельзя", "accepted_answers": [{"value": "нельзя", "status": "correct"}], "feedback": "*Нельзя* = it is not allowed."}
  ru.a2.unit74.lesson02.exercise06.est: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Читать можно, но есть нельзя.", "status": "correct"}, {"value": "Читать можно, но есть нельзя", "status": "correct"}, {"value": "Читать можно но есть нельзя.", "status": "correct"}, {"value": "Читать можно но есть нельзя", "status": "correct"}, {"value": "Можно читать, но нельзя есть.", "status": "correct"}, {"value": "Можно читать, но нельзя есть", "status": "correct"}, {"value": "Можно читать но нельзя есть.", "status": "correct"}, {"value": "Можно читать но нельзя есть", "status": "correct"}, {"value": "Читать можно, а есть нельзя.", "status": "correct"}, {"value": "Читать можно, а есть нельзя", "status": "correct"}, {"value": "Читать можно а есть нельзя.", "status": "correct"}, {"value": "Читать можно а есть нельзя", "status": "correct"}, {"value": "Можно читать, а есть нельзя.", "status": "correct"}, {"value": "Можно читать, а есть нельзя", "status": "correct"}, {"value": "Можно читать а есть нельзя.", "status": "correct"}, {"value": "Можно читать а есть нельзя", "status": "correct"}], "feedback": "*Но* (or *а*) links the two halves."}
  ru.a2.unit74.lesson02.exercise07.pit: {"instruction": "Write the requested Russian sentence.", "correct_option": "Здесь нельзя пить.", "accepted_answers": [{"value": "Здесь нельзя пить.", "status": "correct"}, {"value": "Здесь нельзя пить", "status": "correct"}, {"value": "Здесь пить нельзя.", "status": "correct"}, {"value": "Здесь пить нельзя", "status": "correct"}, {"value": "Нельзя здесь пить.", "status": "correct"}, {"value": "Нельзя здесь пить", "status": "correct"}, {"value": "Нельзя пить здесь.", "status": "correct"}, {"value": "Нельзя пить здесь", "status": "correct"}, {"value": "Пить здесь нельзя.", "status": "correct"}, {"value": "Пить здесь нельзя", "status": "correct"}], "feedback": "*Нельзя* + infinitive."}
  ru.a2.unit74.lesson03.exercise01.karta: {"instruction": "Choose the correct English meaning.", "correct_option": "You need to get a card.", "distractors": ["You can get a card.", "You may not get a card.", "You do not need to get a card."], "accepted_answers": [{"value": "You need to get a card.", "status": "correct"}], "feedback": "*Нужно* = it is necessary."}
  ru.a2.unit74.lesson03.exercise02.idti: {"instruction": "Choose the correct Russian sentence.", "correct_option": "Мне нужно идти.", "distractors": ["Я нужно идти.", "Меня нужно идти.", "Мы нужно идти."], "accepted_answers": [{"value": "Мне нужно идти.", "status": "correct"}], "feedback": "The person who must goes in the dative: *мне*."}
  ru.a2.unit74.lesson03.exercise03.dat3: {"instruction": "Match each Russian pronoun to its English meaning.", "accepted_answers": [{"value": [{"left": "мне", "right": "to me"}, {"left": "тебе", "right": "to you (to one friend)"}, {"left": "ему", "right": "to him"}, {"left": "ей", "right": "to her"}, {"left": "нам", "right": "to us"}, {"left": "вам", "right": "to you (formal or plural)"}, {"left": "им", "right": "to them"}], "status": "correct"}], "feedback": "These are dative forms."}
  ru.a2.unit74.lesson03.exercise04.zavtra: {"instruction": "Put the words in order to say 'We have to come tomorrow.'", "correct_option": "Нам надо прийти завтра", "accepted_answers": [{"value": "Нам надо прийти завтра", "status": "correct"}, {"value": "Завтра нам надо прийти", "status": "correct"}, {"value": "Нам завтра надо прийти", "status": "correct"}], "feedback": "*Нам* is the dative of *мы*."}
  ru.a2.unit74.lesson03.exercise05.blank_tebe: {"instruction": "Complete the sentence: 'You have to get a card' (said to a friend).", "correct_option": "Тебе", "accepted_answers": [{"value": "Тебе", "status": "correct"}, {"value": "тебе", "status": "correct"}], "feedback": "*Ты* becomes *тебе* before *нужно*."}
  ru.a2.unit74.lesson03.exercise06.emu: {"instruction": "Translate into Russian.", "accepted_answers": [{"value": "Ему нужно ждать дома.", "status": "correct"}, {"value": "Ему нужно ждать дома", "status": "correct"}, {"value": "Ему надо ждать дома.", "status": "correct"}, {"value": "Ему надо ждать дома", "status": "correct"}, {"value": "Дома ему нужно ждать.", "status": "correct"}, {"value": "Дома ему нужно ждать", "status": "correct"}], "feedback": "*Ему* = to him."}
  ru.a2.unit74.lesson03.exercise07.nam: {"instruction": "Write the requested Russian sentence.", "correct_option": "Нам нужно прийти завтра.", "accepted_answers": [{"value": "Нам нужно прийти завтра.", "status": "correct"}, {"value": "Нам нужно прийти завтра", "status": "correct"}, {"value": "Нам надо прийти завтра.", "status": "correct"}, {"value": "Нам надо прийти завтра", "status": "correct"}, {"value": "Завтра нам нужно прийти.", "status": "correct"}, {"value": "Завтра нам нужно прийти", "status": "correct"}, {"value": "Завтра нам надо прийти.", "status": "correct"}, {"value": "Завтра нам надо прийти", "status": "correct"}], "feedback": "*Нам* + *нужно* + infinitive."}
  ru.a2.unit74.lesson04.exercise01.nepay: {"instruction": "Choose the correct English meaning.", "correct_option": "You do not need to pay here.", "distractors": ["You may not pay here.", "You can pay here.", "You have to pay here."], "accepted_answers": [{"value": "You do not need to pay here.", "status": "correct"}], "feedback": "*Не нужно* = there is no need."}
  ru.a2.unit74.lesson04.exercise02.noph: {"instruction": "Choose the correct English meaning.", "correct_option": "You are not allowed to take photos here.", "distractors": ["You do not need to take photos here.", "You have to take photos here.", "You can take photos here."], "accepted_answers": [{"value": "You are not allowed to take photos here.", "status": "correct"}], "feedback": "*Нельзя* = banned."}
  ru.a2.unit74.lesson04.exercise03.w4: {"instruction": "Match each Russian word or phrase to its English meaning.", "accepted_answers": [{"value": [{"left": "можно", "right": "it is allowed"}, {"left": "нельзя", "right": "it is forbidden"}, {"left": "нужно", "right": "it is necessary"}, {"left": "не нужно", "right": "there is no need"}, {"left": "платить", "right": "to pay"}, {"left": "бесплатно", "right": "free of charge"}], "status": "correct"}], "feedback": "The four rule words are the core of this unit."}
  ru.a2.unit74.lesson04.exercise04.platit: {"instruction": "Put the words in order to say 'You do not need to pay here.'", "correct_option": "Здесь платить не нужно", "accepted_answers": [{"value": "Здесь платить не нужно", "status": "correct"}, {"value": "Здесь не нужно платить", "status": "correct"}, {"value": "Платить здесь не нужно", "status": "correct"}, {"value": "Не нужно здесь платить", "status": "correct"}, {"value": "Не нужно платить здесь", "status": "correct"}], "feedback": "*Не нужно* + imperfective infinitive."}
