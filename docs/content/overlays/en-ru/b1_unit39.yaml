  ru.b1.unit39.lesson03.exercise01.choose_professional_help: {instruction: "Which answer professionally asks a colleague for help?", correct_option: "Помогите, пожалуйста, проверить таблицу сегодня.", distractors: ["За что вы отвечаете на этой неделе?", "Отчёт ещё в работе.", "Я отвечаю за отчёт."], accepted_answers: [{value: "Помогите, пожалуйста, проверить таблицу сегодня.", status: "correct"}], feedback: "*Помогите, пожалуйста...* is the professional help request."}
