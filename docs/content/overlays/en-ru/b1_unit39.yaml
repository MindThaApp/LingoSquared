  ru.b1.unit39.lesson02.exercise05.order_update: {instruction: "Put the words in order to say \"The report is still in progress because I am waiting for data from colleagues.\"", accepted_answers: [{value: ["Отчёт", "ещё", "в", "работе", "потому", "что", "я", "жду", "данные", "от", "коллег"], status: "correct"}], feedback: "The correct order is *Отчёт ещё в работе, потому что я жду данные от коллег*."}
