course:
  title: "Russian B1"
  description: "Learn B1-level Russian for workplace responsibilities, status updates, and professional help requests."

units:
  ru.b1.unit39.rabota: {title: "Work"}

lessons:
  ru.b1.unit39.lesson01.otvechayu_za: {title: "I am responsible for..."}
  ru.b1.unit39.lesson02.status_obnovlenie: {title: "Status: still in progress"}
  ru.b1.unit39.lesson03.pomogite_pozhaluysta: {title: "Please help"}

teaching:
  ru.b1.unit39.lesson01.teach.otvechayu_za: {title: "Я отвечаю за отчёт.", gloss: "I am responsible for the report.", note: "*отвечаю за* names a work responsibility.", example_gloss: "Dima, I am responsible for the report."}
  ru.b1.unit39.lesson01.teach.proveryayu_dannye: {title: "Я проверяю данные.", gloss: "I check the data.", note: "This adds a concrete work task.", example_gloss: "I am checking the data today."}
  ru.b1.unit39.lesson01.teach.za_chto_vy: {title: "За что вы отвечаете?", gloss: "What are you responsible for?", note: "Use formal *вы* in this professional question.", example_gloss: "Dima, what are you responsible for?"}
  ru.b1.unit39.lesson02.teach.esche_v_rabote: {title: "Отчёт ещё в работе.", gloss: "The report is still in progress.", note: "*ещё в работе* gives an in-progress status.", example_gloss: "Today the report is still in progress."}
  ru.b1.unit39.lesson02.teach.zhdu_dannye: {title: "я жду данные от коллег", gloss: "I am waiting for data from colleagues.", note: "This gives the reason for the status.", example_gloss: "The report is still in progress because I am waiting for data from colleagues."}
  ru.b1.unit39.lesson02.teach.otchet_gotov: {title: "Отчёт готов.", gloss: "The report is ready.", note: "*готов* gives a completed status.", example_gloss: "Today the report is ready."}
  ru.b1.unit39.lesson03.teach.manager_question: {title: "The colleague asks about responsibilities", gloss: "Colleague: Dima, what are you responsible for this week?", note: "The colleague uses formal *вы*."}
  ru.b1.unit39.lesson03.teach.dima_responsibility: {title: "Dima names the responsibility", gloss: "Dima: I am responsible for the report and check the data.", note: "This names the work area and task."}
  ru.b1.unit39.lesson03.teach.dima_update: {title: "Dima gives a status update", gloss: "Dima: The report is still in progress because I am waiting for data from colleagues.", note: "The update includes both status and reason."}
  ru.b1.unit39.lesson03.teach.dima_help: {title: "Dima asks for help", gloss: "Dima: Please help check the spreadsheet today.", note: "*Помогите, пожалуйста* is a professional request."}
  ru.b1.unit39.lesson03.teach.manager_ok: {title: "The colleague agrees", gloss: "Colleague: All right, I will look after lunch.", note: "This confirms the help request."}

exercises:
  ru.b1.unit39.lesson01.exercise01.recognize_otvechayu: {instruction: "Which Russian phrase means \"I am responsible for\"?", correct_option: "я отвечаю за", distractors: ["я жду", "я посмотрю", "я открыл"], accepted_answers: [{value: "я отвечаю за", status: "correct"}], feedback: "*Я отвечаю за...* names a responsibility."}
  ru.b1.unit39.lesson01.exercise02.recognize_dannye: {instruction: "Which Russian word means \"data\"?", correct_option: "данные", distractors: ["отчёт", "таблица", "неделя"], accepted_answers: [{value: "данные", status: "correct"}], feedback: "*данные* means \"data.\""}
  ru.b1.unit39.lesson01.exercise03.listen_select_responsibility: {instruction: "Listen. What is the speaker responsible for?", correct_option: "The report and checking data.", distractors: ["The meeting and the plan.", "The email and the link.", "The address and the form."], accepted_answers: [{value: "The report and checking data.", status: "correct"}], feedback: "The recording says *Я отвечаю за отчёт и проверяю данные*."}
  ru.b1.unit39.lesson01.exercise04.match_responsibilities:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Я отвечаю за", right: "I am responsible for"}
          - {left: "отчёт", right: "report"}
          - {left: "Я проверяю", right: "I check"}
          - {left: "данные", right: "data"}
          - {left: "За что?", right: "For what?"}
          - {left: "вы отвечаете", right: "you are responsible"}
        status: "correct"
    feedback: "These phrases name a workplace responsibility."
  ru.b1.unit39.lesson01.exercise05.order_responsibility: {instruction: "Put the words in order to say \"I am responsible for the report and check the data.\"", accepted_answers: [{value: ["Я", "отвечаю", "за", "отчёт", "и", "проверяю", "данные"], status: "correct"}], feedback: "The correct order is *Я отвечаю за отчёт и проверяю данные*."}
  ru.b1.unit39.lesson01.exercise06.write_responsibility:
    instruction: "Write exactly this professional responsibility sentence: I am responsible for the report and check the data."
    accepted_answers:
      - {value: "Я отвечаю за отчёт и проверяю данные.", status: "correct"}
      - {value: "Я отвечаю за отчёт и проверяю данные", status: "correct"}
      - {value: "Я отвечаю за отчет и проверяю данные.", status: "correct"}
    feedback: "The model answer is *Я отвечаю за отчёт и проверяю данные*."
  ru.b1.unit39.lesson02.exercise01.recognize_v_rabote: {instruction: "Which Russian phrase means \"still in progress\"?", correct_option: "ещё в работе", distractors: ["уже готов", "после обеда", "на этой неделе"], accepted_answers: [{value: "ещё в работе", status: "correct"}], feedback: "*ещё в работе* means \"still in progress.\""}
  ru.b1.unit39.lesson02.exercise02.recognize_zhdu: {instruction: "Which Russian phrase means \"I am waiting for data from colleagues\"?", correct_option: "я жду данные от коллег", distractors: ["я проверяю данные", "я отвечаю за данные", "я посмотрю данные"], accepted_answers: [{value: "я жду данные от коллег", status: "correct"}], feedback: "*Я жду данные от коллег* means \"I am waiting for data from colleagues.\""}
  ru.b1.unit39.lesson02.exercise03.listen_select_update: {instruction: "Listen. What is the status of the report?", correct_option: "It is still in progress because the speaker is waiting for data from colleagues.", distractors: ["It is ready after lunch.", "It is unnecessary because the plan changed.", "It is delayed because the meeting started."], accepted_answers: [{value: "It is still in progress because the speaker is waiting for data from colleagues.", status: "correct"}], feedback: "The recording says the report is still in progress because the speaker is waiting for data from colleagues."}
  ru.b1.unit39.lesson02.exercise04.match_updates:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Отчёт", right: "the report"}
          - {left: "ещё в работе", right: "still in progress"}
          - {left: "потому что", right: "because"}
          - {left: "я жду данные от коллег", right: "I am waiting for data from colleagues"}
          - {left: "Отчёт готов", right: "the report is ready"}
          - {left: "данные", right: "data"}
        status: "correct"
