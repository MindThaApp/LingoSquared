course:
  title: "Russian A1"
  description: "Learn A1-level Russian for everyday greetings and short social exchanges, with detailed English explanations of the Cyrillic alphabet and the вы/ты formality distinction."

units:
  ru.a1.unit02.introductions: {title: "Introductions"}

lessons:
  ru.a1.unit02.lesson01.kak_vas_zovut: {title: "What is your name?"}
  ru.a1.unit02.lesson02.vy_i_ty: {title: "Formal вы and informal ты"}
  ru.a1.unit02.lesson03.davayte_poznakomimsya: {title: "Let's get acquainted"}

teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut: {title: "Как вас зовут?, Как тебя зовут?", gloss: "What is your name? (formal); What is your name? (informal)", note: "Как вас зовут? uses the formal вас and is used with strangers or in polite settings. Как тебя зовут? uses the informal тебя, used with friends, children, and peers.", example_gloss: ["Hello! What is your name?", "Hi! What is your name?"]}
  ru.a1.unit02.lesson01.teach.menya_zovut: {title: "Меня зовут Виктор.", gloss: "My name is Viktor.", note: "Меня зовут (literally \"they call me\") is the standard way to give your name in Russian, regardless of register."}
  ru.a1.unit02.lesson01.teach.menya_zovut_anna: {title: "Меня зовут Анна.", gloss: "My name is Anna.", note: "The same pattern, Меня зовут ..., with a different name -- this phrase doesn't change based on the speaker's own gender."}
  ru.a1.unit02.lesson01.teach.register_note: {title: "Choosing the right question", gloss: "Как вас зовут? is polite or for strangers. Как тебя зовут? is for friends, children, and peers.", note: "The formal/informal split here mirrors the вы/ты distinction taught fully in lesson02 -- вас and тебя are the object-case forms of вы and ты."}

  ru.a1.unit02.lesson02.teach.vy_ty: {title: "вы, ты", gloss: "you (formal); you (informal)", note: "Russian has no single-word equivalent to this distinction in English -- вы is used with strangers, elders, and in professional settings; ты with friends, family, and children.", example_gloss: ["Where are you from? (formal)", "Where are you from? (informal)"]}
  ru.a1.unit02.lesson02.teach.vy_ty_rule: {title: "When to use each", gloss: "Вы is formal: with strangers, at work, with elders. Ты is informal: with friends, family, children.", note: "Using ты with someone who expects вы can sound overly familiar or even rude -- when in doubt, start with вы."}
  ru.a1.unit02.lesson02.teach.mozhno_na_ty: {title: "Можно на ты?", gloss: "Can we switch to informal ты?", note: "A polite way to propose moving from the formal вы register to the informal ты register, once a relationship is friendly enough."}
  ru.a1.unit02.lesson02.teach.davayte_pereydyom: {title: "Давайте перейдём на ты.", gloss: "Let's switch to informal ты.", note: "A slightly more direct, inviting way of proposing the same register shift as Можно на ты?"}
  ru.a1.unit02.lesson02.teach.otkuda_vy: {title: "Откуда вы?", gloss: "Where are you from? (formal)", note: "Uses the formal вы, matching the register of a first meeting or professional context."}
  ru.a1.unit02.lesson02.teach.otkuda_ty: {title: "Откуда ты?", gloss: "Where are you from? (informal)", note: "The informal counterpart, used with someone you already know well."}
  ru.a1.unit02.lesson02.teach.ya_iz_kanady: {title: "Я из Канады.", gloss: "I am from Canada.", note: "Из (\"from\") takes the genitive case, so Канада becomes Канады here -- this genitive-of-origin pattern is worth noticing even though full case grammar comes later."}
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy: {title: "Я из Москвы.", gloss: "I am from Moscow.", note: "Same genitive-of-origin pattern as Я из Канады: Москва becomes Москвы after из."}

  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya: {title: "Давайте познакомимся.", gloss: "Let's get acquainted.", note: "A polite, common way to open an introduction between people meeting for the first time."}
  ru.a1.unit02.lesson03.teach.ochen_priyatno: {title: "Очень приятно", gloss: "nice to meet you", note: "A standard, polite reply once someone has just given their name.", example_gloss: "My name is John. -- Nice to meet you."}
  ru.a1.unit02.lesson03.teach.irina_greeting: {title: "Irina Petrovna opens the introduction", gloss: "Irina Petrovna says: Hello! Let's get acquainted. My name is Irina Petrovna.", note: "Irina Petrovna is meeting John in a formal office setting for the first time, so she uses the polite Здравствуйте and the вы register throughout."}
  ru.a1.unit02.lesson03.teach.john_reply: {title: "John replies with his name", gloss: "John says: Nice to meet you. My name is John.", note: "John matches Irina Petrovna's formal, polite register with Очень приятно."}
  ru.a1.unit02.lesson03.teach.irina_question: {title: "Irina Petrovna asks where John is from", gloss: "Irina Petrovna asks: Where are you from, John?", note: "She uses the formal Откуда вы, consistent with the office setting."}
  ru.a1.unit02.lesson03.teach.john_answer: {title: "John answers and asks back", gloss: "John says: I am from Canada. And where are you from?", note: "John gives his origin and politely returns the question with А вы откуда?"}
  ru.a1.unit02.lesson03.teach.irina_answer: {title: "Irina Petrovna answers", gloss: "Irina Petrovna says: I am from Moscow.", note: "She completes the exchange, matching the genitive-of-origin pattern from lesson02."}

exercises:
  ru.a1.unit02.lesson01.exercise01.choose_formal_question:
    instruction: "You are meeting your new manager for the first time. Which question do you ask?"
    correct_option: "Как вас зовут?"
    distractors: ["Как тебя зовут?", "Откуда ты?", "Можно на ты?"]
    accepted_answers: [{value: "Как вас зовут?", status: "correct"}]
    feedback: "Как вас зовут? is the formal way to ask someone's name."
  ru.a1.unit02.lesson01.exercise02.listen_select_informal_question:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Как тебя зовут?"
    distractors: ["Как вас зовут?", "Откуда ты?", "Очень приятно"]
    accepted_answers: [{value: "Как тебя зовут?", status: "correct"}]
    feedback: "Как тебя зовут? is the informal way to ask someone's name."
  ru.a1.unit02.lesson01.exercise03.choose_natural_answer:
    instruction: "Someone asks \"Как вас зовут?\" What is a natural reply?"
    correct_option: "Меня зовут Виктор."
    distractors: ["Очень приятно.", "Откуда вы?", "До свидания."]
    accepted_answers: [{value: "Меня зовут Виктор.", status: "correct"}]
    feedback: "Меня зовут ... states your name, the natural reply to that question."
  ru.a1.unit02.lesson01.exercise04.match_question_register:
    instruction: "Match each question to its register."
    accepted_answers:
      - value:
          - {left: "Как вас зовут?", right: "formal / polite"}
          - {left: "Как тебя зовут?", right: "informal"}
        status: "correct"
    feedback: "Как вас зовут?=formal, Как тебя зовут?=informal."
  ru.a1.unit02.lesson01.exercise05.order_name_statement:
    instruction: "Put the words in the correct order to say \"My name is Anna.\""
    accepted_answers:
      - {value: ["Меня", "зовут", "Анна"], status: "correct"}
    feedback: "The correct order is Меня зовут Анна."
  ru.a1.unit02.lesson01.exercise06.listen_order_formal_name:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Меня", "зовут", "Виктор"], status: "correct"}
    feedback: "The correct order is Меня зовут Виктор."
  ru.a1.unit02.lesson01.exercise07.complete_name_answer:
    instruction: "Complete the reply: Как тебя зовут? -- ___ зовут Анна."
    accepted_answers:
      - {value: "Меня", status: "correct"}
      - {value: "Меня зовут Анна", status: "correct"}
    feedback: "Меня зовут Анна means \"My name is Anna.\""
  ru.a1.unit02.lesson01.exercise08.write_self_name:
    instruction: "Write a sentence giving your own name in Russian, using \"Меня зовут ...\"."
    accepted_answers:
      - {value: "Меня зовут Анна.", status: "correct"}
      - {value: "Меня зовут Виктор.", status: "correct"}
    feedback: "Меня зовут ... states your name."

  ru.a1.unit02.lesson02.exercise01.choose_formal_pronoun:
    instruction: "You are speaking with your new landlord, whom you have never met. Which pronoun do you use?"
    correct_option: "вы"
    distractors: ["ты", "тебя", "вас"]
    accepted_answers: [{value: "вы", status: "correct"}]
    feedback: "вы is the formal \"you,\" appropriate with strangers."
  ru.a1.unit02.lesson02.exercise02.choose_informal_pronoun:
    instruction: "You are speaking with your younger cousin. Which pronoun do you use?"
    correct_option: "ты"
    distractors: ["вы", "вас", "Ваш"]
    accepted_answers: [{value: "ты", status: "correct"}]
    feedback: "ты is the informal \"you,\" appropriate with family and friends."
  ru.a1.unit02.lesson02.exercise03.listen_select_shift_offer:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Давайте перейдём на ты."
    distractors: ["Можно на ты?", "Откуда вы?", "Как вас зовут?"]
    accepted_answers: [{value: "Давайте перейдём на ты.", status: "correct"}]
    feedback: "Давайте перейдём на ты means \"Let's switch to informal ты.\""
  ru.a1.unit02.lesson02.exercise04.match_register_use:
    instruction: "Match each phrase to how it's used."
    accepted_answers:
      - value:
          - {left: "вы", right: "a stranger, a boss, an elderly person"}
          - {left: "ты", right: "a close friend, a child, a sibling"}
          - {left: "Можно на ты?", right: "Can we switch to informal ты?"}
        status: "correct"
    feedback: "вы=formal register, ты=informal register, Можно на ты?=proposing the informal register."
  ru.a1.unit02.lesson02.exercise05.order_origin_question_formal:
    instruction: "Put the words in the correct order to formally ask where someone is from."
    accepted_answers:
      - {value: ["Откуда", "вы"], status: "correct"}
    feedback: "The correct order is Откуда вы?"
  ru.a1.unit02.lesson02.exercise06.listen_order_origin_answer:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Я", "из", "Канады"], status: "correct"}
    feedback: "The correct order is Я из Канады."
  ru.a1.unit02.lesson02.exercise07.complete_origin:
    instruction: "Complete the reply: Откуда вы? -- Я ___ Москвы."
    accepted_answers:
      - {value: "из", status: "correct"}
      - {value: "Я из Москвы", status: "correct"}
    feedback: "Я из Москвы means \"I am from Moscow.\""
  ru.a1.unit02.lesson02.exercise08.write_origin_sentence:
    instruction: "Write a sentence saying where you are from, using \"Я из ...\"."
    accepted_answers:
      - {value: "Я из Канады.", status: "correct"}
      - {value: "Я из Москвы.", status: "correct"}
    feedback: "Я из ... states where you are from."

  ru.a1.unit02.lesson03.exercise01.choose_meeting_reply:
    instruction: "Someone says \"Меня зовут Джон.\" How do you reply?"
    correct_option: "Очень приятно."
    distractors: ["Откуда вы?", "До свидания.", "Как вас зовут?"]
    accepted_answers: [{value: "Очень приятно.", status: "correct"}]
    feedback: "Очень приятно means \"nice to meet you,\" a natural reply."
  ru.a1.unit02.lesson03.exercise02.listen_select_opener:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Давайте познакомимся."
    distractors: ["Очень приятно.", "Откуда вы?", "До свидания."]
    accepted_answers: [{value: "Давайте познакомимся.", status: "correct"}]
    feedback: "Давайте познакомимся means \"Let's get acquainted.\""
  ru.a1.unit02.lesson03.exercise03.dialogue_comprehension_origins:
    instruction: "Listen to the office dialogue. Where is each speaker from?"
    correct_option: "John is from Canada; Irina Petrovna is from Moscow"
    distractors: ["John is from Moscow; Irina Petrovna is from Canada", "Both are from Moscow", "John is from London; Irina Petrovna is from Canada"]
    accepted_answers: [{value: "John is from Canada; Irina Petrovna is from Moscow", status: "correct"}]
    feedback: "John says Я из Канады, and Irina Petrovna says Я из Москвы."
  ru.a1.unit02.lesson03.exercise04.match_intro_lines:
    instruction: "Match each Russian phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "Давайте познакомимся.", right: "Let's get acquainted."}
          - {left: "Очень приятно.", right: "Nice to meet you."}
          - {left: "Откуда вы?", right: "Where are you from? (formal)"}
          - {left: "Я из Канады.", right: "I am from Canada."}
          - {left: "Как вас зовут?", right: "What is your name? (formal)"}
          - {left: "Меня зовут Джон.", right: "My name is John."}
        status: "correct"
    feedback: "Давайте познакомимся=Let's get acquainted, Очень приятно=Nice to meet you, Откуда вы=Where are you from, Я из Канады=I am from Canada, Как вас зовут=What is your name, Меня зовут Джон=My name is John."
  ru.a1.unit02.lesson03.exercise05.order_meeting_reply:
    instruction: "Put the words in the correct order to say \"My name is John.\""
    accepted_answers:
      - {value: ["Меня", "зовут", "Джон"], status: "correct"}
    feedback: "The correct order is Меня зовут Джон."
  ru.a1.unit02.lesson03.exercise06.listen_order_pleasure:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Очень", "приятно"], status: "correct"}
    feedback: "The correct order is Очень приятно."
  ru.a1.unit02.lesson03.exercise07.reply_to_introduction:
    instruction: "Someone says \"Здравствуйте! Давайте познакомимся. Меня зовут Ирина Петровна.\" Reply politely and give your own name."
    accepted_answers:
      - {value: "Очень приятно. Меня зовут Джон.", status: "correct"}
      - {value: "Очень приятно, меня зовут Джон.", status: "correct"}
      - {value: "Очень приятно Меня зовут Джон", status: "correct"}
    feedback: "Очень приятно. Меня зовут ... replies politely and gives your name."
  ru.a1.unit02.lesson03.exercise08.complete_reciprocal_question:
    instruction: "Complete the question: Я из Канады. ___ вы откуда?"
    accepted_answers:
      - {value: "А", status: "correct"}
      - {value: "А вы откуда", status: "correct"}
    feedback: "А вы откуда? means \"And where are you from?\""
  ru.a1.unit02.lesson03.exercise09.write_full_introduction:
    instruction: "Write a short formal introduction: give your name, say nice to meet you, and say where you are from."
    accepted_answers:
      - {value: "Меня зовут Джон. Очень приятно. Я из Канады.", status: "correct"}
      - {value: "Меня зовут Анна. Очень приятно. Я из Москвы.", status: "correct"}
    feedback: "A natural introduction combines Меня зовут ..., Очень приятно, and Я из ..."
