course:
  title: "Russian A1"
  description: "Learn A1-level Russian for proposing, accepting, declining, and scheduling a simple near-future plan, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit12.plans: {title: "Our plans"}

lessons:
  ru.a1.unit12.lesson01.davay_poydyom: {title: "Let's go..."}
  ru.a1.unit12.lesson02.soglasen_ne_mogu: {title: "Agreed / I can't"}
  ru.a1.unit12.lesson03.plany_na_subbotu: {title: "Dialogue: plans for Saturday"}

teaching:
  ru.a1.unit12.lesson01.teach.davay: {title: "Давай пойдём...", gloss: "Let's go...", note: "Давай is an informal proposal marker (\"let's\"); пойдём is the \"we\" future form of \"to go,\" used together to propose an activity."}
  ru.a1.unit12.lesson01.teach.kino: {title: "кино", gloss: "the movies", note: "кино is an indeclinable neuter noun for \"cinema/the movies.\"", example_gloss: "Let's go to the movies."}
  ru.a1.unit12.lesson01.teach.zavtra_subbotu: {title: "завтра, в субботу", gloss: "tomorrow, on Saturday", note: "завтра means \"tomorrow\"; в субботу uses в + accusative for a day of the week.", example_gloss: "Let's go to the movies tomorrow."}

  ru.a1.unit12.lesson02.teach.soglasen: {title: "Хорошо, я согласен.", gloss: "Okay, I agree.", note: "согласен (\"agreed\") is used by a male speaker; a female speaker would say согласна."}
  ru.a1.unit12.lesson02.teach.ne_mogu: {title: "К сожалению, я не могу.", gloss: "Unfortunately, I can't.", note: "К сожалению (\"unfortunately\") softens a decline; не могу is \"I can't.\""}
  ru.a1.unit12.lesson02.teach.vo_skolko: {title: "Во сколько мы встретимся?", gloss: "What time will we meet?", note: "Во сколько asks about clock time; встретимся is the \"we\" future form of \"to meet.\""}

  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom: {title: "Nastya proposes a plan", gloss: "Nastya: Let's go to the movies on Saturday.", note: "Настя opens with Давай пойдём в кино в субботу."}
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen: {title: "Dima agrees and asks the time", gloss: "Dima: Okay, I agree. What time will we meet?", note: "Дима accepts, then asks Во сколько мы встретимся?"}
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem: {title: "Nastya proposes a time and place", gloss: "Nastya: Let's say seven o'clock, at the movie theater.", note: "у кинотеатра means \"at/by the movie theater,\" using у + genitive."}
  ru.a1.unit12.lesson03.teach.dima_otlichno: {title: "Dima confirms", gloss: "Dima: Great, see you Saturday.", note: "Отлично, до субботы closes the exchange; до субботы literally \"until Saturday.\""}

exercises:
  ru.a1.unit12.lesson01.exercise01.recognize_davay:
    instruction: "Which word means \"let's\" (informal proposal)?"
    correct_option: "давай"
    distractors: ["завтра", "кино", "субботу"]
    accepted_answers: [{value: "давай", status: "correct"}]
    feedback: "давай means \"let's\" (informal proposal)."
  ru.a1.unit12.lesson01.exercise02.recognize_zavtra:
    instruction: "Which word means \"tomorrow\"?"
    correct_option: "завтра"
    distractors: ["давай", "кино", "субботу"]
    accepted_answers: [{value: "завтра", status: "correct"}]
    feedback: "завтра means \"tomorrow.\""
  ru.a1.unit12.lesson01.exercise03.listen_select_davay_poydyom:
    instruction: "Listen to the recording. What is being proposed?"
    correct_option: "Let's go to the movies tomorrow."
    distractors: ["Okay, I agree.", "What time will we meet?", "Unfortunately, I can't."]
    accepted_answers: [{value: "Let's go to the movies tomorrow.", status: "correct"}]
    feedback: "The recording says Давай пойдём в кино завтра. (\"Let's go to the movies tomorrow.\")"
  ru.a1.unit12.lesson01.exercise04.match_plan_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "давай", right: "let's"}
          - {left: "пойдём", right: "let's go"}
          - {left: "кино", right: "the movies"}
          - {left: "завтра", right: "tomorrow"}
          - {left: "в субботу", right: "on Saturday"}
          - {left: "Давай пойдём в кино.", right: "Let's go to the movies."}
        status: "correct"
    feedback: "давай=let's, пойдём=let's go, кино=the movies, завтра=tomorrow, в субботу=on Saturday."
  ru.a1.unit12.lesson01.exercise05.order_davay_poydyom_v_kino:
    instruction: "Put the words in the correct order to say \"Let's go to the movies tomorrow.\""
    accepted_answers:
      - {value: ["Давай", "пойдём", "в", "кино", "завтра"], status: "correct"}
    feedback: "The correct order is Давай пойдём в кино завтра."
  ru.a1.unit12.lesson01.exercise06.listen_order_davay_poydyom:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Давай", "пойдём", "в", "кино", "завтра"], status: "correct"}
    feedback: "The correct order is Давай пойдём в кино завтра (\"Let's go to the movies tomorrow\")."
  ru.a1.unit12.lesson01.exercise07.complete_davay_poydyom:
    instruction: "Complete the sentence: ___ пойдём в кино. (let's, informal)"
    accepted_answers:
      - {value: "Давай", status: "correct"}
      - {value: "Давай пойдём в кино", status: "correct"}
    feedback: "Давай means \"let's\" (informal)."
  ru.a1.unit12.lesson01.exercise08.write_propose_plan:
    instruction: "Write a sentence proposing to go to the movies tomorrow, using \"Давай пойдём...\"."
    accepted_answers:
      - {value: "Давай пойдём в кино завтра.", status: "correct"}
      - {value: "Давай пойдём в кино завтра", status: "correct"}
    feedback: "Давай пойдём в кино завтра. means \"Let's go to the movies tomorrow.\""

  ru.a1.unit12.lesson02.exercise01.recognize_soglasen:
    instruction: "Which word means \"agreed\" (said by a male speaker)?"
    correct_option: "согласен"
    distractors: ["не могу", "сожалению", "встретимся"]
    accepted_answers: [{value: "согласен", status: "correct"}]
    feedback: "согласен means \"agreed\" (said by a male speaker)."
  ru.a1.unit12.lesson02.exercise02.recognize_ne_mogu:
    instruction: "Which phrase means \"I can't\"?"
    correct_option: "не могу"
    distractors: ["согласен", "сожалению", "встретимся"]
    accepted_answers: [{value: "не могу", status: "correct"}]
    feedback: "не могу means \"I can't.\""
  ru.a1.unit12.lesson02.exercise03.listen_select_vo_skolko:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "What time will we meet?"
    distractors: ["Okay, I agree.", "Unfortunately, I can't.", "Let's go to the movies tomorrow."]
    accepted_answers: [{value: "What time will we meet?", status: "correct"}]
    feedback: "The recording says Во сколько мы встретимся? (\"What time will we meet?\")."
  ru.a1.unit12.lesson02.exercise04.match_response_phrases:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Хорошо, я согласен.", right: "Okay, I agree."}
          - {left: "К сожалению, я не могу.", right: "Unfortunately, I can't."}
          - {left: "Во сколько мы встретимся?", right: "What time will we meet?"}
          - {left: "Давай в семь часов.", right: "Let's say seven o'clock."}
          - {left: "Давай пойдём в кино.", right: "Let's go to the movies."}
          - {left: "завтра", right: "tomorrow"}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange accepting, declining, or scheduling a plan."
  ru.a1.unit12.lesson02.exercise05.order_k_sozhaleniyu_ne_mogu:
    instruction: "Put the words in the correct order to say \"Unfortunately, I can't.\""
    accepted_answers:
      - {value: ["К", "сожалению", "я", "не", "могу"], status: "correct"}
    feedback: "The correct order is К сожалению, я не могу."
  ru.a1.unit12.lesson02.exercise06.listen_order_davay_v_sem:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Давай", "в", "семь", "часов"], status: "correct"}
    feedback: "The correct order is Давай в семь часов (\"Let's say seven o'clock\")."
  ru.a1.unit12.lesson02.exercise07.complete_ya_soglasen:
    instruction: "Complete the sentence: Хорошо, я ___. (agreed, said by a man)"
    accepted_answers:
      - {value: "согласен", status: "correct"}
      - {value: "Хорошо, я согласен", status: "correct"}
    feedback: "согласен means \"agreed\" (said by a man)."
  ru.a1.unit12.lesson02.exercise08.write_accept_or_decline:
    instruction: "Write a sentence accepting a plan or a sentence declining a plan, using \"Я согласен\" or \"Я не могу\"."
    accepted_answers:
      - {value: "Хорошо, я согласен.", status: "correct"}
      - {value: "К сожалению, я не могу.", status: "correct"}
    feedback: "A natural response is either Хорошо, я согласен. or К сожалению, я не могу."

  ru.a1.unit12.lesson03.exercise01.choose_propose_saturday_plan:
    instruction: "You want to propose going to the movies on Saturday. What do you say?"
    correct_option: "Давай пойдём в кино в субботу."
    distractors: ["Во сколько мы встретимся?", "К сожалению, я не могу.", "Отлично, до субботы."]
    accepted_answers: [{value: "Давай пойдём в кино в субботу.", status: "correct"}]
    feedback: "Давай пойдём в кино в субботу. means \"Let's go to the movies on Saturday.\""
  ru.a1.unit12.lesson03.exercise02.listen_select_ne_mogu:
    instruction: "Listen to the recording. What is being said?"
    correct_option: "Unfortunately, I can't."
    distractors: ["Okay, I agree.", "What time will we meet?", "Let's go to the movies on Saturday."]
    accepted_answers: [{value: "Unfortunately, I can't.", status: "correct"}]
    feedback: "The recording says К сожалению, я не могу. (\"Unfortunately, I can't.\")"
  ru.a1.unit12.lesson03.exercise03.dialogue_comprehension_plany_na_subbotu:
    instruction: "Listen to the dialogue. What are they doing, when, and what time will they meet?"
    correct_option: "Going to the movies on Saturday, meeting at seven at the movie theater"
    distractors: ["Going to the movies on Saturday, meeting at eight at the movie theater", "Going to a restaurant on Saturday, meeting at seven at the movie theater", "Going to the movies on Sunday, meeting at seven at the movie theater"]
    accepted_answers: [{value: "Going to the movies on Saturday, meeting at seven at the movie theater", status: "correct"}]
    feedback: "Настя proposes Давай пойдём в кино в субботу and Давай в семь часов, у кинотеатра."
  ru.a1.unit12.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Давай пойдём в кино в субботу.", right: "Let's go to the movies on Saturday."}
          - {left: "Хорошо, я согласен.", right: "Okay, I agree."}
          - {left: "Во сколько мы встретимся?", right: "What time will we meet?"}
          - {left: "Давай в семь часов, у кинотеатра.", right: "Let's say seven o'clock, at the movie theater."}
          - {left: "Отлично, до субботы.", right: "Great, see you Saturday."}
          - {left: "К сожалению, я не могу.", right: "Unfortunately, I can't."}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange proposing and scheduling a plan."
  ru.a1.unit12.lesson03.exercise05.order_davay_v_sem_u_kinoteatra:
    instruction: "Put the words in the correct order to say \"Let's say seven o'clock, at the movie theater.\""
    accepted_answers:
      - {value: ["Давай", "в", "семь", "часов", "у", "кинотеатра"], status: "correct"}
    feedback: "The correct order is Давай в семь часов у кинотеатра."
  ru.a1.unit12.lesson03.exercise06.reply_davay_poydyom_v_kino:
    instruction: "Someone says \"Давай пойдём в кино в субботу.\" Reply that you agree."
    accepted_answers:
      - {value: "Хорошо, я согласен.", status: "correct"}
      - {value: "Хорошо, я согласен", status: "correct"}
    feedback: "Хорошо, я согласен means \"Okay, I agree.\""
  ru.a1.unit12.lesson03.exercise07.complete_do_subboty:
    instruction: "Complete the sentence: Отлично, ___ субботы. (until/see you)"
    accepted_answers:
      - {value: "до", status: "correct"}
      - {value: "Отлично, до субботы", status: "correct"}
    feedback: "до means \"until,\" here in the sense of \"see you Saturday.\""
  ru.a1.unit12.lesson03.exercise08.write_plan_message:
    instruction: "Write a short message proposing a plan: what to do, and what day and time, using \"Давай пойдём...\"."
    accepted_answers:
      - {value: "Давай пойдём в кино в субботу в семь часов.", status: "correct"}
      - {value: "Давай пойдём в кино в субботу в семь часов", status: "correct"}
    feedback: "A natural proposal uses Давай пойдём + destination + day + time."
