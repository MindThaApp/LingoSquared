review: {status: "reviewed", required_next_reviewer: "native_speaker", notes: "Fresh-context full review (new-language lane, no sampling), 2026-07-12. Glosses/registers faithful; script-ramp overlay usable pre-alphabet (English glosses/notes carry each letter). Fixed 1 defect: exercise01 recognize_z distractor 'З (mirrored)' rendered as the correct glyph (text can't mirror), so two options showed identical letters — replaced with a distinct confusable letter Ч. listen_select distractors verified absent from each audio script. matching_pairs left values unique. Native-speaker review pending."}

course:
  title: "Russian A1"
  description: "Learn A1-level Russian for everyday greetings and short social exchanges, with detailed English explanations of the Cyrillic alphabet and the вы/ты formality distinction."

units:
  ru.a1.unit01.greetings: {title: "Greetings and farewells"}

lessons:
  ru.a1.unit01.lesson01.script_ramp: {title: "Meet the Cyrillic alphabet"}
  ru.a1.unit01.lesson02.vremya_dnya: {title: "Greetings for different times of day"}
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie: {title: "How are you? and saying goodbye"}

teaching:
  ru.a1.unit01.lesson01.teach.direction: {title: "Reading direction", gloss: "The Russian alphabet reads left to right, like English.", note: "Russian (Cyrillic script) reads in the same direction as English, so no new reading-direction habit is needed here -- only new letter shapes and sounds."}
  ru.a1.unit01.lesson01.teach.letter_z: {title: "З з", gloss: "the letter Z", note: "Pronounced like the \"z\" in \"zoo.\" The lowercase form з looks similar to a number 3."}
  ru.a1.unit01.lesson01.teach.letter_d: {title: "Д д", gloss: "the letter D", note: "Pronounced like the \"d\" in \"door.\" The lowercase form д has a distinctive loop that doesn't resemble the Latin \"d\" at all -- learn the shape fresh."}
  ru.a1.unit01.lesson01.teach.letter_r: {title: "Р р", gloss: "the letter R", note: "Pronounced as a rolled/trilled \"r,\" not the English \"r.\" Looks like a Latin \"P\" -- a classic false-friend shape, so don't read it as \"p.\""}
  ru.a1.unit01.lesson01.teach.letter_a: {title: "А а", gloss: "the letter A", note: "Pronounced like the \"a\" in \"father.\" Looks identical to the Latin \"A/a\" and sounds close to it too."}
  ru.a1.unit01.lesson01.teach.letter_v: {title: "В в", gloss: "the letter V", note: "Pronounced like the \"v\" in \"van.\" Looks like a Latin \"B\" -- another false-friend shape to watch for."}
  ru.a1.unit01.lesson01.teach.letter_s: {title: "С с", gloss: "the letter S", note: "Pronounced like the \"s\" in \"sun.\" Looks and sounds like the Latin \"C/c,\" but it is never a \"k\" sound in Russian."}
  ru.a1.unit01.lesson01.teach.letter_t: {title: "Т т", gloss: "the letter T", note: "Pronounced like the \"t\" in \"top.\" The lowercase form т is sometimes handwritten to look like a small \"m\" -- the printed shape here is the one to learn first."}
  ru.a1.unit01.lesson01.teach.letter_u: {title: "У у", gloss: "the letter U", note: "Pronounced like the \"oo\" in \"moon.\" Looks like a Latin \"y\" -- another shape that doesn't map onto its English lookalike sound."}
  ru.a1.unit01.lesson01.teach.letter_ye: {title: "Е е", gloss: "the letter Ye", note: "Pronounced like the \"ye\" in \"yes\" at the start of a word or syllable. Looks identical to the Latin \"E/e\" but sounds quite different."}
  ru.a1.unit01.lesson01.teach.hard_sign_note: {title: "ъ and ь: hard sign and soft sign", gloss: "The hard sign ъ and soft sign ь have no sound of their own: they change the pronunciation of the letter next to them.", note: "These two signs never represent a sound by themselves -- ь softens the preceding consonant, and ъ marks a hard separation between sounds. Both will come up again once real words use them."}
  ru.a1.unit01.lesson01.teach.letter_short_i: {title: "Й й", gloss: "the letter short I", note: "Pronounced like the \"y\" in \"boy\" -- a quick glide sound, not a full vowel. It appears in Здравствуйте, the word this lesson builds toward."}
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape: {title: "Здравствуйте", gloss: "hello (formal)", note: "The full formal greeting, built from the letters just introduced. It looks long and consonant-heavy, but every letter in it has already been covered in this lesson.", example_gloss: "Hello! My name is Viktor."}

  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet: {title: "Здравствуйте, Привет", gloss: "hello (formal); hi (informal)", note: "Здравствуйте is the safe, all-purpose formal greeting for any time of day or any stranger. Привет is casual, used with friends and peers.", example_gloss: ["Hello! How are you? (formal)", "Hi! How's it going? (informal)"]}
  ru.a1.unit01.lesson02.teach.dobroe_utro: {title: "Доброе утро!", gloss: "good morning", note: "Used in the morning, roughly until late morning."}
  ru.a1.unit01.lesson02.teach.dobryy_den: {title: "Добрый день!", gloss: "good day / hello", note: "The standard daytime greeting, usable from late morning through the afternoon."}
  ru.a1.unit01.lesson02.teach.dobryy_vecher: {title: "Добрый вечер!", gloss: "good evening", note: "Used when arriving somewhere in the evening -- it's a greeting, not a farewell."}
  ru.a1.unit01.lesson02.teach.register_note: {title: "Choosing a greeting", gloss: "Здравствуйте works at any time of day and in polite company. Привет is informal, used among friends.", note: "When in doubt about time of day or who you're speaking to, Здравствуйте is always safe; Привет is reserved for people you already know well."}

  ru.a1.unit01.lesson03.teach.kak_dela: {title: "Как дела?", gloss: "How are you? (informal)", note: "The everyday informal way to ask how someone is doing, used with friends and peers."}
  ru.a1.unit01.lesson03.teach.kak_pozhivaete: {title: "Как поживаете?", gloss: "How are you? (formal)", note: "The formal way to ask how someone is doing, matching the вы register."}
  ru.a1.unit01.lesson03.teach.horosho_spasibo: {title: "Хорошо, спасибо", gloss: "fine, thanks", note: "A simple, positive reply usable in either register.", example_gloss: "How are you? -- Fine, thanks."}
  ru.a1.unit01.lesson03.teach.tak_sebe: {title: "Так себе", gloss: "so-so", note: "A neutral-to-mildly-negative reply, used when things are neither great nor bad.", example_gloss: "How are you? -- So-so."}
  ru.a1.unit01.lesson03.teach.a_u_tebya: {title: "А у тебя?", gloss: "And you? (informal)", note: "The informal way to return the question to the other person, matching the ты register."}
  ru.a1.unit01.lesson03.teach.do_svidaniya: {title: "До свидания!", gloss: "goodbye (neutral/formal)", note: "The standard, all-purpose farewell -- literally close to \"until we see each other again.\""}
  ru.a1.unit01.lesson03.teach.poka: {title: "Пока!", gloss: "bye (informal)", note: "A casual, very common way to say goodbye among friends and acquaintances."}
  ru.a1.unit01.lesson03.teach.do_zavtra: {title: "До завтра!", gloss: "see you tomorrow", note: "A friendly farewell used when you expect to see the person again the next day."}
  ru.a1.unit01.lesson03.teach.anna: {title: "Anna greets Maksim", gloss: "Anna says: Good day! How are you?", note: "Anna and Maksim are colleagues greeting each other during the day, at the level of familiarity implied by дела (informal register)."}
  ru.a1.unit01.lesson03.teach.maksim_reply: {title: "Maksim replies and asks back", gloss: "Maksim says: Fine, thanks. And you?", note: "Maksim answers and returns the question informally, matching Anna's register."}
  ru.a1.unit01.lesson03.teach.anna_close: {title: "Anna closes the exchange", gloss: "Anna says: Also good. Well, see you tomorrow!", note: "Anna wraps up the small talk and moves to a friendly farewell."}
  ru.a1.unit01.lesson03.teach.maksim_close: {title: "Maksim says goodbye", gloss: "Maksim says: See you tomorrow!", note: "Maksim echoes Anna's farewell, closing the exchange."}

exercises:
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie.exercise11.dictation_poka_informal:
    instruction: "Type what you hear."
    correct_option: "Пока"
    accepted_answers: [{value: "Пока", status: correct}]
    orthography_strict: true

  ru.a1.unit01.lesson01.exercise01.recognize_z:
    instruction: "Which letter sounds like English 'z' (as in 'zoo')?"
    correct_option: "З"
    distractors: ["Э", "Ж", "Ч"]
    accepted_answers: [{value: "З", status: "correct"}]
    feedback: "This is З, pronounced like the \"z\" in \"zoo.\""
  ru.a1.unit01.lesson01.exercise02.recognize_d:
    instruction: "Which letter sounds like English 'd' (as in 'door')?"
    correct_option: "Д"
    distractors: ["Л", "П", "Ф"]
    accepted_answers: [{value: "Д", status: "correct"}]
    feedback: "This is Д, pronounced like the \"d\" in \"door.\""
  ru.a1.unit01.lesson01.exercise03.recognize_r:
    instruction: "Which letter is the rolled 'r' sound?"
    correct_option: "Р"
    distractors: ["Я", "Ф", "Г"]
    accepted_answers: [{value: "Р", status: "correct"}]
    feedback: "This is Р, a rolled \"r\" -- note it looks like a Latin \"P\" but is not that sound."
  ru.a1.unit01.lesson01.exercise04.match_letters_sounds:
    instruction: "Match each letter to its sound."
    accepted_answers:
      - value:
          - {left: "З", right: "\"z\" as in zoo"}
          - {left: "Д", right: "\"d\" as in door"}
          - {left: "Р", right: "rolled \"r\""}
          - {left: "А", right: "\"a\" as in father"}
          - {left: "В", right: "\"v\" as in van"}
          - {left: "С", right: "\"s\" as in sun"}
          - {left: "Т", right: "\"t\" as in top"}
          - {left: "У", right: "\"oo\" as in moon"}
          - {left: "Е", right: "\"ye\" as in yes"}
        status: "correct"
    feedback: "З=\"z\", Д=\"d\", Р=rolled \"r\", А=\"a\" as in father, В=\"v\", С=\"s\", Т=\"t\", У=\"oo\", Е=\"ye\" as in yes."
  ru.a1.unit01.lesson01.exercise05.order_letters:
    instruction: "Arrange the letters to spell the word for \"hello\" (formal)."
    accepted_answers:
      - {value: ["З", "Д", "Р", "А", "В", "С", "Т", "В", "У", "Й", "Т", "Е"], status: "correct"}
    feedback: "The letters spell Здравствуйте, the formal greeting."
  ru.a1.unit01.lesson01.exercise06.listen_select_word:
    instruction: "Listen and select the word you hear."
    correct_option: "Здравствуйте"
    distractors: ["Привет", "До свидания", "Спасибо"]
    accepted_answers: [{value: "Здравствуйте", status: "correct"}]
    feedback: "Здравствуйте means \"hello\" (formal)."
  ru.a1.unit01.lesson01.exercise07.copy_word:
    instruction: "Listen and copy the formal greeting word you hear."
    accepted_answers:
      - {value: "Здравствуйте", status: "correct"}
      - {value: "Здравствуйте.", status: "correct"}
    feedback: "Здравствуйте means \"hello\" (formal)."

  ru.a1.unit01.lesson02.exercise01.choose_morning:
    instruction: "It is 08:30. Which greeting is appropriate?"
    correct_option: "Доброе утро"
    distractors: ["Добрый вечер", "Спокойной ночи", "Пока"]
    accepted_answers: [{value: "Доброе утро", status: "correct"}]
    feedback: "Доброе утро means \"good morning.\""
  ru.a1.unit01.lesson02.exercise02.choose_evening:
    instruction: "It is 20:00. Which greeting is appropriate?"
    correct_option: "Добрый вечер"
    distractors: ["Доброе утро", "Добрый день", "До свидания"]
    accepted_answers: [{value: "Добрый вечер", status: "correct"}]
    feedback: "Добрый вечер means \"good evening.\""
  ru.a1.unit01.lesson02.exercise03.listen_select_formal:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Здравствуйте"
    distractors: ["Добрый вечер", "Доброе утро", "Привет"]
    accepted_answers: [{value: "Здравствуйте", status: "correct"}]
    feedback: "Здравствуйте is the all-purpose formal greeting for any time of day."
  ru.a1.unit01.lesson02.exercise04.match_times:
    instruction: "Match each greeting to the time of day it's used."
    accepted_answers:
      - value:
          - {left: "Доброе утро", right: "08:30"}
          - {left: "Добрый день", right: "14:00"}
          - {left: "Добрый вечер", right: "20:00"}
        status: "correct"
    feedback: "Доброе утро=morning, Добрый день=daytime, Добрый вечер=evening."
  ru.a1.unit01.lesson02.exercise05.order_good_evening:
    instruction: "Put the words in the correct order to say \"good evening.\""
    accepted_answers:
      - {value: ["Добрый", "вечер"], status: "correct"}
    feedback: "The correct order is Добрый вечер."
  ru.a1.unit01.lesson02.exercise06.listen_order_morning:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Доброе", "утро"], status: "correct"}
    feedback: "The correct order is Доброе утро."
  ru.a1.unit01.lesson02.exercise07.complete_greeting:
    instruction: "Complete the greeting: it is 2 PM."
    accepted_answers:
      - {value: "день", status: "correct"}
      - {value: "Добрый день", status: "correct"}
    feedback: "Добрый день is the daytime greeting."
  ru.a1.unit01.lesson02.exercise08.write_informal_greeting:
    instruction: "Write the informal greeting you would use with a close friend."
    accepted_answers:
      - {value: "Привет", status: "correct"}
      - {value: "Привет!", status: "correct"}
    feedback: "Привет is the casual, informal greeting."

  ru.a1.unit01.lesson03.exercise01.choose_reply_informal:
    instruction: "A friend says \"Привет! Как дела?\" How do you reply?"
    correct_option: "Хорошо, спасибо"
    distractors: ["Добрый вечер", "До свидания", "Как вас зовут"]
    accepted_answers: [{value: "Хорошо, спасибо", status: "correct"}]
    feedback: "Хорошо, спасибо means \"Fine, thanks.\""
  ru.a1.unit01.lesson03.exercise02.listen_select_farewell:
    instruction: "Listen and select the phrase you hear."
    correct_option: "До свидания"
    distractors: ["Пока", "До завтра", "Привет"]
    accepted_answers: [{value: "До свидания", status: "correct"}]
    feedback: "До свидания is the neutral/formal way to say goodbye."
  ru.a1.unit01.lesson03.exercise03.choose_casual_bye:
    instruction: "You are saying goodbye to a close friend. Which word do you use?"
    correct_option: "Пока"
    distractors: ["До свидания", "Здравствуйте", "Добрый вечер"]
    accepted_answers: [{value: "Пока", status: "correct"}]
    feedback: "Пока is the casual, informal way to say bye."
  ru.a1.unit01.lesson03.exercise04.match_responses:
    instruction: "Match each Russian phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "Хорошо, спасибо.", right: "Fine, thanks."}
          - {left: "Так себе.", right: "So-so."}
          - {left: "До свидания!", right: "Goodbye! (neutral/formal)"}
          - {left: "Пока!", right: "Bye! (informal)"}
          - {left: "Здравствуйте!", right: "Hello! (formal/neutral)"}
          - {left: "Привет!", right: "Hi! (informal)"}
          - {left: "Доброе утро!", right: "Good morning!"}
          - {left: "Добрый вечер!", right: "Good evening!"}
        status: "correct"
    feedback: "Хорошо, спасибо=Fine thanks, Так себе=So-so, До свидания=Goodbye, Пока=Bye, Здравствуйте=Hello (formal), Привет=Hi, Доброе утро=Good morning, Добрый вечер=Good evening."
  ru.a1.unit01.lesson03.exercise05.order_how_are_things:
    instruction: "Put the words in the correct order to informally ask how someone is."
    accepted_answers:
      - {value: ["Как", "дела"], status: "correct"}
    feedback: "The correct order is Как дела?"
  ru.a1.unit01.lesson03.exercise06.listen_order_and_you:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["А", "у", "тебя"], status: "correct"}
    feedback: "The correct order is А у тебя? (\"And you?\", informal)."
  ru.a1.unit01.lesson03.exercise07.dialogue_comprehension_names:
    instruction: "Listen to the dialogue. What are the two speakers' names?"
    correct_option: "Anna and Maksim"
    distractors: ["Irina and John", "Sara and Viktor", "Anna and John"]
    accepted_answers: [{value: "Anna and Maksim", status: "correct"}]
    feedback: "The two colleagues in the hallway are Anna and Maksim."
  ru.a1.unit01.lesson03.exercise08.reply_how_are_you:
    instruction: "A friend says \"Привет! Как дела?\" Reply that you're fine, thanks, and ask them back informally."
    accepted_answers:
      - {value: "Хорошо, спасибо. А у тебя?", status: "correct"}
      - {value: "Хорошо, спасибо, а у тебя?", status: "correct"}
      - {value: "Хорошо спасибо А у тебя", status: "correct"}
    feedback: "Хорошо, спасибо. А у тебя? replies informally and returns the question."
  ru.a1.unit01.lesson03.exercise09.complete_farewell:
    instruction: "Complete the farewell: see you tomorrow."
    accepted_answers:
      - {value: "завтра", status: "correct"}
      - {value: "До завтра", status: "correct"}
    feedback: "До завтра means \"see you tomorrow.\""
  ru.a1.unit01.lesson03.exercise10.write_short_exchange:
    instruction: "Write a short informal greeting exchange: say hi, ask how things are, and answer."
    accepted_answers:
      - {value: "Привет! Как дела? Хорошо, спасибо.", status: "correct"}
      - {value: "Привет Как дела Хорошо спасибо", status: "correct"}
    feedback: "A natural informal exchange: Привет! Как дела? -- Хорошо, спасибо."
