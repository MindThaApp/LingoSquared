course:
  title: "Russian A1"
  description: "Learn A1-level Russian for asking for and following short directions to a nearby place, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit10.directions: {title: "Getting around"}

lessons:
  ru.a1.unit10.lesson01.kak_doyti: {title: "How do I get to ...?"}
  ru.a1.unit10.lesson02.povorachivayte: {title: "Turn left"}
  ru.a1.unit10.lesson03.dialog_k_muzeyu: {title: "Dialogue: to the museum"}

teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti: {title: "Как дойти до...?", gloss: "How do I get to...?", note: "Как дойти до...? is the standard polite way to ask a stranger for directions to a place, followed by the destination in the genitive case."}
  ru.a1.unit10.lesson01.teach.muzeya: {title: "музей", gloss: "museum", note: "музей is masculine; музея is its genitive form, used after до (\"to/until\").", example_gloss: "How do I get to the museum?"}
  ru.a1.unit10.lesson01.teach.pryamo: {title: "прямо", gloss: "straight ahead", note: "прямо describes going straight; Идите is the polite command form of \"go.\"", example_gloss: "Go straight ahead."}
  ru.a1.unit10.lesson01.teach.napravo: {title: "направо", gloss: "to the right", note: "направо indicates direction of movement (turning to the right); потом means \"then.\"", example_gloss: "Go straight ahead, then to the right."}

  ru.a1.unit10.lesson02.teach.nalevo: {title: "налево", gloss: "to the left", note: "налево indicates direction of movement, the mirror of направо.", example_gloss: "Turn left."}
  ru.a1.unit10.lesson02.teach.povernite: {title: "поверните", gloss: "turn (polite command)", note: "поверните is the polite imperative of повернуть (\"to turn\"); за углом means \"around the corner.\"", example_gloss: "Turn left around the corner."}
  ru.a1.unit10.lesson02.teach.kvartal_daleko: {title: "квартал, далеко", gloss: "block, far", note: "квартал is a city block (квартала after два); далеко means \"far,\" and отсюда means \"from here.\"", example_gloss: ["Go two blocks.", "Is that far from here?"]}

  ru.a1.unit10.lesson03.teach.tourist_prostite: {title: "Tourist asks the way", gloss: "Tourist: Excuse me, how do I get to the museum?", note: "Турист opens with Простите (\"excuse me\") before asking Как дойти до музея?"}
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto: {title: "Passerby gives directions", gloss: "Passerby: It's very simple. Go straight two blocks, then turn right.", note: "Прохожий answers with Это очень просто, then a two-step direction using Идите and поверните."}
  ru.a1.unit10.lesson03.teach.tourist_daleko: {title: "Tourist asks if it's far", gloss: "Tourist: Is that far from here?", note: "Это далеко отсюда? follows up to check the walking distance."}
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut: {title: "Passerby estimates the time", gloss: "Passerby: No, five minutes on foot.", note: "Прохожий answers with Нет, пять минут пешком (\"on foot\")."}
  ru.a1.unit10.lesson03.teach.tourist_spasibo: {title: "Tourist thanks the passerby", gloss: "Tourist: Thank you very much.", note: "Спасибо большое closes the exchange politely."}

exercises:
  ru.a1.unit10.lesson01.exercise01.recognize_pryamo:
    instruction: "Which word means \"straight ahead\"?"
    correct_option: "прямо"
    distractors: ["направо", "музей", "дойти"]
    accepted_answers: [{value: "прямо", status: "correct"}]
    feedback: "прямо means \"straight ahead.\""
  ru.a1.unit10.lesson01.exercise02.recognize_napravo:
    instruction: "Which word means \"to the right\"?"
    correct_option: "направо"
    distractors: ["прямо", "музей", "дойти"]
    accepted_answers: [{value: "направо", status: "correct"}]
    feedback: "направо means \"to the right.\""
  ru.a1.unit10.lesson01.exercise03.listen_select_kak_doyti_muzeya:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "How do I get to the museum?"
    distractors: ["Turn left around the corner.", "Is it far from here?", "How do I get to the bank?"]
    accepted_answers: [{value: "How do I get to the museum?", status: "correct"}]
    feedback: "The recording says Как дойти до музея? (\"How do I get to the museum?\")."
  ru.a1.unit10.lesson01.exercise04.match_direction_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "как дойти", right: "how to get"}
          - {left: "музей", right: "museum"}
          - {left: "прямо", right: "straight ahead"}
          - {left: "направо", right: "to the right"}
          - {left: "потом", right: "then"}
          - {left: "до", right: "to/until"}
        status: "correct"
    feedback: "как дойти=how to get, музей=museum, прямо=straight ahead, направо=to the right, потом=then, до=to/until."
  ru.a1.unit10.lesson01.exercise05.order_kak_doyti_do_muzeya:
    instruction: "Put the words in the correct order to say \"How do I get to the museum?\""
    accepted_answers:
      - {value: ["Как", "дойти", "до", "музея"], status: "correct"}
    feedback: "The correct order is Как дойти до музея?"
  ru.a1.unit10.lesson01.exercise06.listen_order_idite_pryamo_napravo:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Идите", "прямо", "потом", "направо"], status: "correct"}
    feedback: "The correct order is Идите прямо, потом направо (\"Go straight ahead, then to the right\")."
  ru.a1.unit10.lesson01.exercise07.complete_kak_doyti_do_muzeya:
    instruction: "Complete the question: Как дойти ___ музея? (to)"
    accepted_answers:
      - {value: "до", status: "correct"}
      - {value: "Как дойти до музея", status: "correct"}
    feedback: "до means \"to/until,\" used before the destination in the genitive case."
  ru.a1.unit10.lesson01.exercise08.write_ask_way_to_museum:
    instruction: "Write a question asking how to get to the museum, using \"Как дойти до...?\"."
    accepted_answers:
      - {value: "Как дойти до музея?", status: "correct"}
      - {value: "Как дойти до музея", status: "correct"}
    feedback: "Как дойти до музея? means \"How do I get to the museum?\""

  ru.a1.unit10.lesson02.exercise01.recognize_povernite:
    instruction: "Which word means \"turn\" (polite command)?"
    correct_option: "поверните"
    distractors: ["далеко", "квартал", "отсюда"]
    accepted_answers: [{value: "поверните", status: "correct"}]
    feedback: "поверните means \"turn\" (polite command)."
  ru.a1.unit10.lesson02.exercise02.recognize_daleko:
    instruction: "Which word means \"far\"?"
    correct_option: "далеко"
    distractors: ["поверните", "квартал", "налево"]
    accepted_answers: [{value: "далеко", status: "correct"}]
    feedback: "далеко means \"far.\""
  ru.a1.unit10.lesson02.exercise03.listen_select_eto_daleko:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "Is that far from here?"
    distractors: ["Turn left around the corner.", "How do I get to the museum?", "Go straight two blocks."]
    accepted_answers: [{value: "Is that far from here?", status: "correct"}]
    feedback: "The recording says Это далеко отсюда? (\"Is that far from here?\")."
  ru.a1.unit10.lesson02.exercise04.match_more_direction_phrases:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "поверните", right: "turn"}
          - {left: "налево", right: "to the left"}
          - {left: "квартал", right: "block"}
          - {left: "далеко", right: "far"}
          - {left: "за углом", right: "around the corner"}
          - {left: "отсюда", right: "from here"}
        status: "correct"
    feedback: "поверните=turn, налево=to the left, квартал=block, далеко=far, за углом=around the corner, отсюда=from here."
  ru.a1.unit10.lesson02.exercise05.order_povernite_nalevo_za_uglom:
    instruction: "Put the words in the correct order to say \"Turn left around the corner.\""
    accepted_answers:
      - {value: ["Поверните", "налево", "за", "углом"], status: "correct"}
    feedback: "The correct order is Поверните налево за углом."
  ru.a1.unit10.lesson02.exercise06.listen_order_povernite_nalevo:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["Поверните", "налево", "за", "углом"], status: "correct"}
    feedback: "The correct order is Поверните налево за углом (\"Turn left around the corner\")."
  ru.a1.unit10.lesson02.exercise07.complete_eto_daleko:
    instruction: "Complete the question: Это ___ отсюда? (far)"
    accepted_answers:
      - {value: "далеко", status: "correct"}
      - {value: "Это далеко отсюда", status: "correct"}
    feedback: "далеко means \"far.\""
  ru.a1.unit10.lesson02.exercise08.write_directions_to_bank:
    instruction: "Write one or two direction steps: go straight, then turn left, using \"Идите\" and \"Поверните\"."
    accepted_answers:
      - {value: "Идите прямо, потом поверните налево.", status: "correct"}
      - {value: "Идите прямо. Поверните налево.", status: "correct"}
    feedback: "A natural direction combines Идите прямо with поверните налево."

  ru.a1.unit10.lesson03.exercise01.choose_ask_way_to_museum:
    instruction: "You want to politely ask a stranger how to get to the museum. What do you say?"
    correct_option: "Простите, как дойти до музея?"
    distractors: ["Поверните направо за углом.", "Это далеко отсюда?", "Спасибо большое."]
    accepted_answers: [{value: "Простите, как дойти до музея?", status: "correct"}]
    feedback: "Простите, как дойти до музея? means \"Excuse me, how do I get to the museum?\""
  ru.a1.unit10.lesson03.exercise02.listen_select_kak_doyti_do_bank:
    instruction: "Listen to the recording. What is being asked?"
    correct_option: "How do I get to the bank?"
    distractors: ["How do I get to the museum?", "Is that far from here?", "Turn right around the corner."]
    accepted_answers: [{value: "How do I get to the bank?", status: "correct"}]
    feedback: "The recording says Как дойти до банка? (\"How do I get to the bank?\")."
  ru.a1.unit10.lesson03.exercise03.dialogue_comprehension_k_muzeyu:
    instruction: "Listen to the dialogue. How many blocks does the tourist walk, and how far is the museum on foot?"
    correct_option: "Two blocks, then turn right; five minutes on foot"
    distractors: ["Two blocks, then turn left; five minutes on foot", "Three blocks, then turn right; ten minutes on foot", "Two blocks, then turn right; ten minutes on foot"]
    accepted_answers: [{value: "Two blocks, then turn right; five minutes on foot", status: "correct"}]
    feedback: "Прохожий says Идите прямо два квартала, потом поверните направо, and Нет, пять минут пешком."
  ru.a1.unit10.lesson03.exercise04.match_dialogue_phrases:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Простите, как дойти до музея?", right: "Excuse me, how do I get to the museum?"}
          - {left: "Идите прямо два квартала.", right: "Go straight two blocks."}
          - {left: "Поверните направо.", right: "Turn right."}
          - {left: "Это далеко отсюда?", right: "Is it far from here?"}
          - {left: "Пять минут пешком.", right: "Five minutes on foot."}
          - {left: "Спасибо большое.", right: "Thank you very much."}
        status: "correct"
    feedback: "Each phrase is part of a typical exchange asking for and following directions."
  ru.a1.unit10.lesson03.exercise05.order_idite_pryamo_dva_kvartala:
    instruction: "Put the words in the correct order to say \"Go straight two blocks.\""
    accepted_answers:
      - {value: ["Идите", "прямо", "два", "квартала"], status: "correct"}
    feedback: "The correct order is Идите прямо два квартала."
  ru.a1.unit10.lesson03.exercise06.reply_kak_doyti_do_banka:
    instruction: "Someone asks \"Как дойти до банка?\" Reply that they should go straight ahead, then to the right."
    accepted_answers:
      - {value: "Идите прямо, потом направо.", status: "correct"}
      - {value: "Идите прямо, потом направо", status: "correct"}
    feedback: "Идите прямо, потом направо means \"Go straight ahead, then to the right.\""
  ru.a1.unit10.lesson03.exercise07.complete_pyat_minut_peshkom:
    instruction: "Complete the sentence: Пять минут ___. (on foot)"
    accepted_answers:
      - {value: "пешком", status: "correct"}
      - {value: "Пять минут пешком", status: "correct"}
    feedback: "пешком means \"on foot.\""
  ru.a1.unit10.lesson03.exercise08.write_directions_dialogue:
    instruction: "Write two or three sentences giving someone directions to a nearby place."
    accepted_answers:
      - {value: "Идите прямо два квартала, потом поверните направо.", status: "correct"}
      - {value: "Идите прямо. Поверните налево за углом. Это пять минут пешком.", status: "correct"}
    feedback: "A natural set of directions uses Идите/поверните with блоки/квартал and an optional distance note."
