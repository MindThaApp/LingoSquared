course:
  title: "Russian A1"
  description: "Learn A1-level Russian for stating a basic health problem, understanding simple immediate advice, and holding a short doctor's-office exchange, with detailed English explanations of vocabulary, phrases, and dialogue."

units:
  ru.a1.unit16.health: {title: "My head hurts"}

lessons:
  ru.a1.unit16.lesson01.u_menya_bolit_golova: {title: "My head hurts"}
  ru.a1.unit16.lesson02.u_menya_temperatura: {title: "I have a fever"}
  ru.a1.unit16.lesson03.u_vracha: {title: "Dialogue: at the doctor's"}

teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova: {title: "У меня болит голова.", gloss: "My head hurts.", note: "у меня means \"I have\" (literally \"at me\"); болит means \"hurts/aches,\" agreeing with a singular subject like голова (head)."}
  ru.a1.unit16.lesson01.teach.zhivot: {title: "живот", gloss: "stomach", note: "живот means \"stomach/belly.\" Use the same у меня болит... pattern with any body part.", example_gloss: "My stomach hurts."}
  ru.a1.unit16.lesson01.teach.gorlo: {title: "горло", gloss: "throat", note: "горло means \"throat.\"", example_gloss: "My throat hurts."}

  ru.a1.unit16.lesson02.teach.u_menya_temperatura: {title: "У меня температура.", gloss: "I have a fever.", note: "температура literally means \"temperature\" but is the standard way to say \"a fever\" in Russian."}
  ru.a1.unit16.lesson02.teach.prostuda: {title: "простуда", gloss: "a cold", note: "простуда means \"a cold\" (the illness). Say у меня простуда to mean \"I have a cold.\"", example_gloss: "I have a cold."}
  ru.a1.unit16.lesson02.teach.mne_ploho: {title: "Мне плохо.", gloss: "I feel bad / I feel unwell.", note: "Мне плохо is a general way to say you feel unwell, without naming a specific symptom."}

  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit: {title: "Dima greets the doctor", gloss: "Dima: Hello! My head and throat hurt.", note: "Дима opens with the formal Здравствуйте! since the doctor is a stranger."}
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit: {title: "The doctor asks what hurts", gloss: "Doctor: What hurts? Your head and throat?", note: "The doctor uses formal вас (\"you,\" formal/plural) instead of informal тебя."}
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura: {title: "Dima adds one more symptom", gloss: "Dima: Yes, and also a fever.", note: "ещё means \"also / in addition\" — и ещё... adds one more item to what you have just said."}
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat: {title: "The doctor gives advice", gloss: "Doctor: You need to rest and drink a lot of water.", note: "Вам нужно + infinitive means \"you need to...\"; вам is the formal dative \"you.\""}

exercises:
  ru.a1.unit16.lesson01.exercise01.recognize_bolit:
    instruction: "Which word means \"hurts / aches\"?"
    correct_option: "болит"
    distractors: ["голова", "живот", "горло"]
    accepted_answers: [{value: "болит", status: "correct"}]
    feedback: "болит means \"hurts / aches.\""
  ru.a1.unit16.lesson01.exercise02.recognize_golova:
    instruction: "Which word means \"head\"?"
    correct_option: "голова"
    distractors: ["живот", "горло", "болит"]
    accepted_answers: [{value: "голова", status: "correct"}]
    feedback: "голова means \"head.\""
  ru.a1.unit16.lesson01.exercise03.listen_select_u_menya_bolit_golova:
    instruction: "Listen to the recording. What hurts?"
    correct_option: "My head hurts."
    distractors: ["My stomach hurts.", "My throat hurts.", "I have a fever."]
    accepted_answers: [{value: "My head hurts.", status: "correct"}]
    feedback: "The recording says У меня болит голова. (\"My head hurts.\")"
  ru.a1.unit16.lesson01.exercise04.match_body_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "у меня", right: "I have (at me)"}
          - {left: "болит", right: "hurts"}
          - {left: "голова", right: "head"}
          - {left: "живот", right: "stomach"}
          - {left: "горло", right: "throat"}
          - {left: "У меня болит голова.", right: "My head hurts."}
        status: "correct"
    feedback: "у меня=I have, болит=hurts, голова=head, живот=stomach, горло=throat."
  ru.a1.unit16.lesson01.exercise05.order_u_menya_bolit_golova:
    instruction: "Put the words in the correct order to say \"My head hurts.\""
    accepted_answers:
      - {value: ["У", "меня", "болит", "голова"], status: "correct"}
    feedback: "The correct order is У меня болит голова."
  ru.a1.unit16.lesson01.exercise06.listen_order_u_menya_bolit_golova:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["У", "меня", "болит", "голова"], status: "correct"}
    feedback: "The correct order is У меня болит голова (\"My head hurts\")."
  ru.a1.unit16.lesson01.exercise07.complete_bolit_golova:
    instruction: "Complete the sentence: У меня ___ голова. (hurts)"
    accepted_answers:
      - {value: "болит", status: "correct"}
      - {value: "У меня болит голова", status: "correct"}
    feedback: "болит means \"hurts.\""
  ru.a1.unit16.lesson01.exercise08.write_stomach_hurts:
    instruction: "Write a sentence saying your stomach hurts, using \"болит\"."
    accepted_answers:
      - {value: "У меня болит живот.", status: "correct"}
      - {value: "У меня болит живот", status: "correct"}
    feedback: "У меня болит живот. means \"My stomach hurts.\""

  ru.a1.unit16.lesson02.exercise01.recognize_temperatura:
    instruction: "Which word means \"fever / temperature\"?"
    correct_option: "температура"
    distractors: ["простуда", "плохо", "горло"]
    accepted_answers: [{value: "температура", status: "correct"}]
    feedback: "температура means \"fever / temperature.\""
  ru.a1.unit16.lesson02.exercise02.recognize_ploho:
    instruction: "Which word means \"bad(ly) / unwell\"?"
    correct_option: "плохо"
    distractors: ["температура", "простуда", "болит"]
    accepted_answers: [{value: "плохо", status: "correct"}]
    feedback: "плохо means \"bad(ly)\"; Мне плохо means \"I feel unwell.\""
  ru.a1.unit16.lesson02.exercise03.listen_select_u_menya_temperatura:
    instruction: "Listen to the recording. What's wrong with the speaker?"
    correct_option: "The speaker has a fever."
    distractors: ["The speaker has a cold.", "The speaker's head hurts.", "The speaker feels fine."]
    accepted_answers: [{value: "The speaker has a fever.", status: "correct"}]
    feedback: "The recording says У меня температура. (\"I have a fever.\")"
  ru.a1.unit16.lesson02.exercise04.match_symptom_words:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "температура", right: "fever"}
          - {left: "простуда", right: "a cold"}
          - {left: "Мне плохо.", right: "I feel bad."}
          - {left: "болит голова", right: "head hurts"}
          - {left: "живот", right: "stomach"}
          - {left: "У меня температура.", right: "I have a fever."}
        status: "correct"
    feedback: "температура=fever, простуда=a cold, Мне плохо=I feel bad, болит голова=head hurts, живот=stomach."
  ru.a1.unit16.lesson02.exercise05.order_u_menya_temperatura:
    instruction: "Put the words in the correct order to say \"I have a fever.\""
    accepted_answers:
      - {value: ["У", "меня", "температура"], status: "correct"}
    feedback: "The correct order is У меня температура."
  ru.a1.unit16.lesson02.exercise06.listen_order_u_menya_temperatura:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["У", "меня", "температура"], status: "correct"}
    feedback: "The correct order is У меня температура (\"I have a fever\")."
  ru.a1.unit16.lesson02.exercise07.complete_prostuda:
    instruction: "Complete the sentence: У меня ___. (a cold)"
    accepted_answers:
      - {value: "простуда", status: "correct"}
      - {value: "У меня простуда", status: "correct"}
    feedback: "простуда means \"a cold.\""
  ru.a1.unit16.lesson02.exercise08.write_have_fever:
    instruction: "Write a sentence saying you have a fever."
    accepted_answers:
      - {value: "У меня температура.", status: "correct"}
      - {value: "У меня температура", status: "correct"}
    feedback: "У меня температура. means \"I have a fever.\""

  ru.a1.unit16.lesson03.exercise01.choose_tell_doctor_hurts:
    instruction: "You want to tell the doctor your head and throat hurt. What do you say?"
    correct_option: "У меня болит голова и горло."
    distractors: ["Что у вас болит?", "Вам нужно отдыхать.", "У меня простуда."]
    accepted_answers: [{value: "У меня болит голова и горло.", status: "correct"}]
    feedback: "У меня болит голова и горло. means \"My head and throat hurt.\""
  ru.a1.unit16.lesson03.exercise02.listen_select_chto_u_vas_bolit:
    instruction: "Listen to the recording. What is the doctor asking?"
    correct_option: "What hurts?"
    distractors: ["What is your name?", "Do you feel unwell?", "Do you need water?"]
    accepted_answers: [{value: "What hurts?", status: "correct"}]
    feedback: "The recording says Что у вас болит? (\"What hurts?\")"
  ru.a1.unit16.lesson03.exercise03.dialogue_comprehension_u_vracha:
    instruction: "Listen to the dialogue. What does Dima say hurts, and what does the doctor recommend?"
    correct_option: "Dima's head and throat hurt and he has a fever; the doctor says to rest and drink a lot of water"
    distractors: ["Dima's stomach hurts; the doctor says to eat more", "Dima feels fine; the doctor says to go home", "Dima's head hurts; the doctor says to go to the hospital"]
    accepted_answers: [{value: "Dima's head and throat hurt and he has a fever; the doctor says to rest and drink a lot of water", status: "correct"}]
    feedback: "Дима says У меня болит голова и горло... и ещё температура, and the doctor says Вам нужно отдыхать и пить много воды."
  ru.a1.unit16.lesson03.exercise04.match_dialogue_lines:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "У меня болит голова и горло.", right: "My head and throat hurt."}
          - {left: "Что у вас болит?", right: "What hurts?"}
          - {left: "И ещё температура.", right: "And also a fever."}
          - {left: "Вам нужно отдыхать.", right: "You need to rest."}
          - {left: "Пить много воды.", right: "Drink a lot of water."}
          - {left: "Здравствуйте!", right: "Hello! (formal)"}
        status: "correct"
    feedback: "Each phrase is part of a typical formal doctor's-office exchange."
  ru.a1.unit16.lesson03.exercise05.order_vam_nuzhno_otdyhat:
    instruction: "Put the words in the correct order to say \"You need to rest.\""
    accepted_answers:
      - {value: ["Вам", "нужно", "отдыхать"], status: "correct"}
    feedback: "The correct order is Вам нужно отдыхать."
  ru.a1.unit16.lesson03.exercise06.reply_chto_u_vas_bolit:
    instruction: "Someone asks \"Что у вас болит?\" Reply that your head and throat hurt."
    accepted_answers:
      - {value: "У меня болит голова и горло.", status: "correct"}
      - {value: "У меня болит голова и горло", status: "correct"}
    feedback: "У меня болит голова и горло. means \"My head and throat hurt.\""
  ru.a1.unit16.lesson03.exercise07.complete_vam_nuzhno_otdyhat:
    instruction: "Complete the sentence: Вам нужно ___ и пить много воды. (rest)"
    accepted_answers:
      - {value: "отдыхать", status: "correct"}
      - {value: "Вам нужно отдыхать и пить много воды", status: "correct"}
    feedback: "отдыхать means \"to rest.\""
  ru.a1.unit16.lesson03.exercise08.write_symptoms_and_advice:
    instruction: "Write two or three sentences telling a doctor what hurts and that you have a fever."
    accepted_answers:
      - {value: "У меня болит горло. У меня температура.", status: "correct"}
      - {value: "У меня болит горло, и у меня температура.", status: "correct"}
      - {value: "У меня болит горло. И у меня температура.", status: "correct"}
    feedback: "A natural account uses У меня болит... for the symptom and У меня температура. for the fever."
