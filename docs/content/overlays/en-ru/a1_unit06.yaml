review: {status: "reviewed", required_next_reviewer: "native_speaker", notes: "Fresh-context full review (new-language lane, no sampling), 2026-07-12. Zero defects. All three matching_pairs (match_close_family 4, match_extended_family 6, match_photo_people 6) mirror the realization pairs exactly; match_close_family §16 low-count warning is a pre-existing realization decision. listen_select distractors verified absent from each referenced audio. мой/моя possessive-gender glosses correct. Native-speaker review pending.\n\nSecond-pass review 2026-10-18: 6 fixes — teach.u_menya_est: false claim that У меня есть was taught in unit03 corrected; teach.brat_sestra: false claim that сестра appeared in unit03 corrected; teach.babushka_dedushka: 'grammatically feminine-pattern' clarified to masculine agreement (мой дедушка); teach.deti: muddled note replaced with plural of ребёнок; exercise07.complete_daughter_name: added ё-less Ее variants; exercise08.write_family_intro: added Вот/сестра variants. NATIVE FLAGS: мать/отец in a casual photo chat between friends (мама/папа would be more natural colloquially); Olga's young daughter is named Анна, the same name as the established adult colleague Анна (units 01/04) whom Максим knows — possibly confusing canon."}

course:
  title: "Russian A1"
  description: "Learn A1-level Russian for everyday greetings and short social exchanges, with detailed English explanations of the Cyrillic alphabet and the вы/ты formality distinction."

units:
  ru.a1.unit06.family: {title: "Family"}

lessons:
  ru.a1.unit06.lesson01.blizkaya_semya: {title: "Mother, father, brother, sister"}
  ru.a1.unit06.lesson02.rasshirennaya_semya: {title: "Grandmother, grandfather, husband, wife, children"}
  ru.a1.unit06.lesson03.semeynoe_foto: {title: "A family photo"}

teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est: {title: "У меня есть ...", gloss: "I have ...", note: "Literally \"at me (there is)...\" -- the standard Russian way to say \"I have.\" Unit 3's У меня два брата used the same У меня frame; есть is usually dropped when the sentence is about how many you have."}
  ru.a1.unit06.lesson01.teach.eto: {title: "Это ...", gloss: "This is ...", note: "Это is used to introduce or point out a person or thing, regardless of that person's grammatical gender."}
  ru.a1.unit06.lesson01.teach.mat_otets: {title: "мать, отец", gloss: "mother, father", note: "мать is one of Russian's small class of feminine nouns ending in a soft sign (-ь).", example_gloss: ["This is my mother.", "This is my father."]}
  ru.a1.unit06.lesson01.teach.brat_sestra: {title: "брат, сестра", gloss: "brother, sister", note: "брат is the word you already counted with in Unit 3 (\"У меня два брата\"); сестра is its feminine counterpart.", example_gloss: ["This is my brother.", "I have a sister."]}
  ru.a1.unit06.lesson01.teach.moy_moya: {title: "мой, моя", gloss: "my (masculine), my (feminine)", note: "мой is used with masculine nouns like отец and брат; моя is used with feminine nouns like мать and сестра."}

  ru.a1.unit06.lesson02.teach.babushka_dedushka: {title: "бабушка, дедушка", gloss: "grandmother, grandfather", note: "Both end in -а, but дедушка refers to a man and is masculine for agreement: мой дедушка, but моя бабушка.", example_gloss: ["This is my grandmother.", "This is my grandfather."]}
  ru.a1.unit06.lesson02.teach.muzh_zhena: {title: "муж, жена", gloss: "husband, wife", note: "муж is masculine and жена is feminine, following the regular gender-noun ending pattern.", example_gloss: ["This is my husband.", "This is my wife."]}
  ru.a1.unit06.lesson02.teach.syn_doch: {title: "сын, дочь", gloss: "son, daughter", note: "дочь, like мать, is a feminine noun ending in a soft sign (-ь).", example_gloss: "I have a son and a daughter."}
  ru.a1.unit06.lesson02.teach.deti: {title: "дети", gloss: "children", note: "дети is the irregular plural of ребёнок (\"child\") -- the singular and plural are completely different words.", example_gloss: "Do you have children?"}
  ru.a1.unit06.lesson02.teach.u_vas_est: {title: "У вас есть ...?", gloss: "Do you have ...? (formal)", note: "Uses the formal вас, matching the вы register from Unit 2."}

  ru.a1.unit06.lesson03.teach.kto_eto: {title: "Кто это?", gloss: "Who is this?", note: "The standard way to ask who someone is, for example when looking at a photo."}
  ru.a1.unit06.lesson03.teach.eyo_zovut: {title: "Её зовут Анна.", gloss: "Her name is Anna.", note: "Literally \"they call her Anna\" -- Её (\"her\") is the object of the verb зовут, not the subject."}
  ru.a1.unit06.lesson03.teach.maksim_kto_eto: {title: "Maksim asks about the photo", gloss: "Maksim: Who is this in the photo?", note: "Maksim opens by pointing at the photo and asking Кто это на фото?"}
  ru.a1.unit06.lesson03.teach.olga_moya_semya: {title: "Olga introduces her family", gloss: "Olga: This is my family.", note: "Это моя семья uses семья (\"family\"), a feminine noun, so моя agrees with it."}
  ru.a1.unit06.lesson03.teach.olga_vot_otets: {title: "Olga names three family members", gloss: "Olga: Here are my father, my mother, and my brother.", note: "Вот (\"here is/are\") introduces the list; each possessive (мой/моя) agrees with the noun that follows it."}
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka: {title: "Maksim asks about the girl", gloss: "Maksim: And who is that girl?", note: "А smoothly introduces Maksim's follow-up question about a fourth person in the photo."}
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch: {title: "Olga names her daughter", gloss: "Olga: This is my daughter. Her name is Anna.", note: "Olga answers with моя дочь and then gives the name using Её зовут Анна."}

exercises:
  ru.a1.unit06.lesson01.blizkaya_semya.exercise09.dictation_moy_brat_neutral:
    instruction: "Type what you hear."
    correct_option: "Это мой брат"
    accepted_answers: [{value: "Это мой брат", status: correct}]
    orthography_strict: true

  ru.a1.unit06.lesson01.exercise01.recognize_mat:
    instruction: "Which word means \"mother\"?"
    correct_option: "мать"
    distractors: ["отец", "брат", "сестра"]
    accepted_answers: [{value: "мать", status: "correct"}]
    feedback: "мать means \"mother.\""
  ru.a1.unit06.lesson01.exercise02.recognize_brat:
    instruction: "Which word means \"brother\"?"
    correct_option: "брат"
    distractors: ["сестра", "отец", "мать"]
    accepted_answers: [{value: "брат", status: "correct"}]
    feedback: "брат means \"brother.\""
  ru.a1.unit06.lesson01.exercise03.listen_select_brat:
    instruction: "Listen to the recording. Who is being introduced?"
    correct_option: "Это мой брат."
    distractors: ["Это моя сестра.", "Это мой отец.", "Это моя мать."]
    accepted_answers: [{value: "Это мой брат.", status: "correct"}]
    feedback: "The recording says Это мой брат (\"This is my brother\")."
  ru.a1.unit06.lesson01.exercise04.match_close_family:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "мать", right: "mother"}
          - {left: "отец", right: "father"}
          - {left: "брат", right: "brother"}
          - {left: "сестра", right: "sister"}
        status: "correct"
    feedback: "мать=mother, отец=father, брат=brother, сестра=sister."
  ru.a1.unit06.lesson01.exercise05.order_this_my_father:
    instruction: "Put the words in the correct order to say \"This is my father.\""
    accepted_answers:
      - {value: ["Это", "мой", "отец"], status: "correct"}
    feedback: "The correct order is Это мой отец."
  ru.a1.unit06.lesson01.exercise06.listen_order_have_sister:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["У", "меня", "есть", "сестра"], status: "correct"}
    feedback: "The correct order is У меня есть сестра (\"I have a sister\")."
  ru.a1.unit06.lesson01.exercise07.complete_family:
    instruction: "Complete the sentence: Это ___ мать. (my)"
    accepted_answers:
      - {value: "моя", status: "correct"}
      - {value: "Это моя мать", status: "correct"}
    feedback: "моя means \"my\" (feminine), agreeing with мать."
  ru.a1.unit06.lesson01.exercise08.write_sibling:
    instruction: "Write a sentence saying you have a brother, using \"У меня есть ...\"."
    accepted_answers:
      - {value: "У меня есть брат.", status: "correct"}
      - {value: "У меня есть брат", status: "correct"}
    feedback: "У меня есть брат means \"I have a brother.\""

  ru.a1.unit06.lesson02.exercise01.recognize_babushka:
    instruction: "Which word means \"grandmother\"?"
    correct_option: "бабушка"
    distractors: ["дедушка", "муж", "жена"]
    accepted_answers: [{value: "бабушка", status: "correct"}]
    feedback: "бабушка means \"grandmother.\""
  ru.a1.unit06.lesson02.exercise02.recognize_deti:
    instruction: "Which word means \"children\"?"
    correct_option: "дети"
    distractors: ["сын", "дочь", "бабушка"]
    accepted_answers: [{value: "дети", status: "correct"}]
    feedback: "дети means \"children.\""
  ru.a1.unit06.lesson02.exercise03.listen_select_babushka:
    instruction: "Listen to the recording. Who is being introduced?"
    correct_option: "Это моя бабушка."
    distractors: ["Это мой дедушка.", "Это моя жена.", "Это мой муж."]
    accepted_answers: [{value: "Это моя бабушка.", status: "correct"}]
    feedback: "The recording says Это моя бабушка (\"This is my grandmother\")."
  ru.a1.unit06.lesson02.exercise04.match_extended_family:
    instruction: "Match each Russian word to its English meaning."
    accepted_answers:
      - value:
          - {left: "бабушка", right: "grandmother"}
          - {left: "дедушка", right: "grandfather"}
          - {left: "муж", right: "husband"}
          - {left: "жена", right: "wife"}
          - {left: "сын", right: "son"}
          - {left: "дочь", right: "daughter"}
        status: "correct"
    feedback: "бабушка=grandmother, дедушка=grandfather, муж=husband, жена=wife, сын=son, дочь=daughter."
  ru.a1.unit06.lesson02.exercise05.order_this_my_wife:
    instruction: "Put the words in the correct order to say \"This is my wife.\""
    accepted_answers:
      - {value: ["Это", "моя", "жена"], status: "correct"}
    feedback: "The correct order is Это моя жена."
  ru.a1.unit06.lesson02.exercise06.listen_order_son_and_daughter:
    instruction: "Listen and put the words in the correct order."
    accepted_answers:
      - {value: ["У", "меня", "есть", "сын", "и", "дочь"], status: "correct"}
    feedback: "The correct order is У меня есть сын и дочь (\"I have a son and a daughter\")."
  ru.a1.unit06.lesson02.exercise07.complete_children_question:
    instruction: "Complete the question: У вас ___ дети? (есть)"
    accepted_answers:
      - {value: "есть", status: "correct"}
      - {value: "У вас есть дети", status: "correct"}
    feedback: "есть means \"is/are (there)\" here, used to ask about possession."
  ru.a1.unit06.lesson02.exercise08.listen_type_children_question:
    instruction: "Listen and type the question you hear."
    accepted_answers:
      - {value: "У вас есть дети?", status: "correct"}
      - {value: "У вас есть дети", status: "correct"}
    feedback: "У вас есть дети? means \"Do you have children?\""

  ru.a1.unit06.lesson03.exercise01.choose_ask_who:
    instruction: "You want to ask who someone in a photo is. Which question do you use?"
    correct_option: "Кто это?"
    distractors: ["Как вас зовут?", "Сколько это стоит?", "Который час?"]
    accepted_answers: [{value: "Кто это?", status: "correct"}]
    feedback: "Кто это? means \"Who is this?\""
  ru.a1.unit06.lesson03.exercise02.listen_select_daughter_name:
    instruction: "Listen to the recording. What is the daughter's name?"
    correct_option: "Её зовут Анна."
    distractors: ["Её зовут Ольга.", "Её зовут Мария.", "Её зовут Наташа."]
    accepted_answers: [{value: "Её зовут Анна.", status: "correct"}]
    feedback: "The recording says Её зовут Анна (\"Her name is Anna\")."
  ru.a1.unit06.lesson03.exercise03.dialogue_comprehension_family_photo:
    instruction: "Listen to the dialogue. Who are the people Olga names, and what is the daughter's name?"
    correct_option: "Father, mother, brother, and a daughter named Anna"
    distractors: ["Father, mother, sister, and a daughter named Olga", "Grandfather, grandmother, brother, and a daughter named Anna", "Father, mother, brother, and a son named Anton"]
    accepted_answers: [{value: "Father, mother, brother, and a daughter named Anna", status: "correct"}]
    feedback: "Olga names мой отец, моя мать, мой брат, and моя дочь -- Её зовут Анна."
  ru.a1.unit06.lesson03.exercise04.match_photo_people:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "мой отец", right: "my father"}
          - {left: "моя мать", right: "my mother"}
          - {left: "мой брат", right: "my brother"}
          - {left: "моя дочь", right: "my daughter"}
          - {left: "моя бабушка", right: "my grandmother"}
          - {left: "мой дедушка", right: "my grandfather"}
        status: "correct"
    feedback: "мой agrees with masculine nouns (отец, брат, дедушка); моя agrees with feminine nouns (мать, дочь, бабушка)."
  ru.a1.unit06.lesson03.exercise05.order_this_my_family:
    instruction: "Put the words in the correct order to say \"This is my family.\""
    accepted_answers:
      - {value: ["Это", "моя", "семья"], status: "correct"}
    feedback: "The correct order is Это моя семья."
  ru.a1.unit06.lesson03.exercise06.reply_who_is_this:
    instruction: "Someone asks \"Кто это на фото?\" Reply that this is your daughter."
    accepted_answers:
      - {value: "Это моя дочь.", status: "correct"}
      - {value: "Это моя дочь", status: "correct"}
    feedback: "Это моя дочь means \"This is my daughter.\""
  ru.a1.unit06.lesson03.exercise07.complete_daughter_name:
    instruction: "Complete the sentence: Это моя дочь. ___ зовут Анна. (Her)"
    accepted_answers:
      - {value: "Её", status: "correct"}
      - {value: "Её зовут Анна", status: "correct"}
      - {value: "Ее", status: "correct"}
      - {value: "Ее зовут Анна", status: "correct"}
    feedback: "Её means \"her\" here, the object of зовут."
  ru.a1.unit06.lesson03.exercise08.write_family_intro:
    instruction: "Write two or three sentences introducing your family in a photo (parents and a sibling)."
    accepted_answers:
      - {value: "Это моя семья. Вот мой отец и моя мать. Это мой брат.", status: "correct"}
      - {value: "Это моя семья. Это мой отец, моя мать и мой брат.", status: "correct"}
      - {value: "Это моя семья. Вот мой отец, моя мать и мой брат.", status: "correct"}
      - {value: "Это моя семья. Вот мой отец, моя мать и моя сестра.", status: "correct"}
      - {value: "Это моя семья. Это мой отец, моя мать и моя сестра.", status: "correct"}
      - {value: "Это моя семья. Вот мой отец и моя мать. Это моя сестра.", status: "correct"}
    feedback: "A natural introduction combines Это моя семья with мой/моя plus each family member."
