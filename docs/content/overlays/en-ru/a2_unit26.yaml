course:
  title: "Russian A1"
  description: "Learn A2-level Russian for giving opinions with reasons."

units:
  ru.a2.unit26.mnenija: {title: "In my opinion"}

lessons:
  ru.a2.unit26.lesson01.mnenie: {title: "In my opinion, it is convenient"}
  ru.a2.unit26.lesson02.soglasie: {title: "I agree"}
  ru.a2.unit26.lesson03.rabota_doma: {title: "Dialogue: working at home"}

teaching:
  ru.a2.unit26.lesson01.teach.po_moemu: {title: "По-моему, это удобно.", gloss: "In my opinion, it is convenient.", note: "*По-моему* is a compact opinion starter.", example_gloss: "In my opinion, it is convenient today."}
  ru.a2.unit26.lesson01.teach.ya_dumayu: {title: "Я думаю, что это важно.", gloss: "I think that this is important.", note: "Unlike English, Russian often keeps *что* after *Я думаю*.", example_gloss: "I think Russian is important."}
  ru.a2.unit26.lesson01.teach.potomu_chto: {title: "потому что", gloss: "because", note: "*потому что* introduces the reason.", example_gloss: "It is convenient because it is quick."}
  ru.a2.unit26.lesson02.teach.soglasen: {title: "согласен", gloss: "agree", note: "*согласен* is for a male speaker; *согласна* is for a female speaker.", example_gloss: "Dima agrees."}
  ru.a2.unit26.lesson02.teach.ne_soglasna: {title: "Я не согласна.", gloss: "I disagree. (female speaker)", note: "Настя uses *согласна* because she is female.", example_gloss: "Nastya disagrees."}
  ru.a2.unit26.lesson02.teach.ponimayu: {title: "понимаю", gloss: "I understand", note: "*Понимаю* softens a disagreement before giving your own view.", example_gloss: "I understand your opinion."}
  ru.a2.unit26.lesson03.teach.nastya_kak_dumayesh: {title: "Nastya asks for Dima's opinion", gloss: "Nastya: Dima, what do you think, is working at home convenient?", note: "Friends use informal *ты*."}
  ru.a2.unit26.lesson03.teach.dima_udobno: {title: "Dima gives an opinion and reason", gloss: "Dima: In my opinion, it is convenient because there is no need to travel to the office.", note: "This line has both the opinion and the reason."}
  ru.a2.unit26.lesson03.teach.nastya_ne_soglasna: {title: "Nastya gives a contrasting opinion", gloss: "Nastya: I disagree. At school it is better to work together with people.", note: "Her reason fits her established teacher canon."}
  ru.a2.unit26.lesson03.teach.dima_ponimayu: {title: "Dima responds", gloss: "Dima: I understand. For me, it is calmer at home.", note: "This responds to someone else's opinion without changing register."}

exercises:
  ru.a2.unit26.lesson01.exercise01.recognize_po_moemu:
    instruction: "Which phrase means \"in my opinion\"?"
    correct_option: "по-моему"
    distractors: ["потому что", "быстро", "важно"]
    accepted_answers: [{value: "по-моему", status: "correct"}]
    feedback: "*по-моему* means \"in my opinion.\""
  ru.a2.unit26.lesson01.exercise02.recognize_potomu_chto:
    instruction: "Which phrase means \"because\"?"
    correct_option: "потому что"
    distractors: ["по-моему", "я думаю", "удобно"]
    accepted_answers: [{value: "потому что", status: "correct"}]
    feedback: "*потому что* means \"because.\""
  ru.a2.unit26.lesson01.exercise03.listen_select_udobno:
    instruction: "Listen. What opinion does the speaker give?"
    correct_option: "It is convenient."
    distractors: ["It is important.", "It is hard.", "It is expensive."]
    accepted_answers: [{value: "It is convenient.", status: "correct"}]
    feedback: "The recording says *По-моему, это удобно*."
  ru.a2.unit26.lesson01.exercise04.match_opinion_starters:
    instruction: "Match each Russian word or phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "По-моему", right: "in my opinion"}
          - {left: "Я думаю", right: "I think"}
          - {left: "потому что", right: "because"}
          - {left: "удобно", right: "convenient"}
          - {left: "важно", right: "important"}
          - {left: "быстро", right: "quick"}
        status: "correct"
    feedback: "These pieces build an opinion with a reason."
  ru.a2.unit26.lesson01.exercise05.order_po_moemu:
    instruction: "Put the words in order to say \"In my opinion, it is convenient.\""
    accepted_answers: [{value: ["По-моему", "это", "удобно"], status: "correct"}]
    feedback: "The correct order is *По-моему, это удобно*."
  ru.a2.unit26.lesson01.exercise06.write_opinion:
    instruction: "Write an opinion with a reason: In my opinion, this is convenient because it is quick."
    accepted_answers:
      - {value: "По-моему, это удобно, потому что быстро.", status: "correct"}
      - {value: "По-моему это удобно потому что быстро", status: "correct"}
      - {value: "Я думаю, что это удобно, потому что быстро.", status: "correct"}
    feedback: "A complete answer includes an opinion plus *потому что*."
  ru.a2.unit26.lesson02.exercise01.recognize_soglasen:
    instruction: "Which word means \"agree\" for a male speaker?"
    correct_option: "согласен"
    distractors: ["согласна", "понимаю", "мнение"]
    accepted_answers: [{value: "согласен", status: "correct"}]
    feedback: "*согласен* is the male-speaker form."
  ru.a2.unit26.lesson02.exercise02.recognize_ponimayu:
    instruction: "Which word means \"I understand\"?"
    correct_option: "понимаю"
    distractors: ["согласен", "мнение", "лучше"]
    accepted_answers: [{value: "понимаю", status: "correct"}]
    feedback: "*понимаю* means \"I understand.\""
  ru.a2.unit26.lesson02.exercise03.listen_select_soglasen:
    instruction: "Listen. Does the speaker agree?"
    correct_option: "Yes, he agrees."
    distractors: ["No, he disagrees.", "He asks a question.", "He gives a time."]
    accepted_answers: [{value: "Yes, he agrees.", status: "correct"}]
    feedback: "The recording says *Я согласен*."
  ru.a2.unit26.lesson02.exercise04.match_agreement:
    instruction: "Match each Russian phrase to its English meaning."
    accepted_answers:
      - value:
          - {left: "Я согласен.", right: "I agree. (male speaker)"}
          - {left: "Я согласна.", right: "I agree. (female speaker)"}
          - {left: "Я не согласна.", right: "I disagree. (female speaker)"}
          - {left: "Понимаю.", right: "I understand."}
          - {left: "мнение", right: "opinion"}
          - {left: "для меня", right: "for me"}
        status: "correct"
    feedback: "Russian agreement forms reflect the speaker."
  ru.a2.unit26.lesson02.exercise05.order_ya_ne_soglasna:
    instruction: "Put the words in order to say \"I disagree\" as a female speaker."
    accepted_answers: [{value: ["Я", "не", "согласна"], status: "correct"}]
    feedback: "The correct order is *Я не согласна*."
  ru.a2.unit26.lesson02.exercise06.write_disagree_reason:
    instruction: "Write a female-speaker disagreement with a reason: I disagree because this is hard."
    accepted_answers:
      - {value: "Я не согласна, потому что это трудно.", status: "correct"}
      - {value: "Я не согласна потому что это трудно", status: "correct"}
    feedback: "The model answer is *Я не согласна, потому что это трудно*."
  ru.a2.unit26.lesson03.exercise01.choose_opinion_reason:
    instruction: "Which answer gives an opinion and a reason?"
    correct_option: "По-моему, это удобно, потому что не нужно ехать в офис."
    distractors: ["Как ты думаешь?", "Я не согласна.", "Понимаю."]
    accepted_answers: [{value: "По-моему, это удобно, потому что не нужно ехать в офис.", status: "correct"}]
    feedback: "It has the opinion *это удобно* and the reason after *потому что*."
  ru.a2.unit26.lesson03.exercise02.dialogue_comprehension_opinions:
    instruction: "Listen to the dialogue. What does Dima think, and why does Nastya disagree?"
    correct_option: "Dima thinks working at home is convenient because he does not need to travel to the office; Nastya prefers working with people at school"
    distractors: ["Dima thinks school is better; Nastya prefers the office", "Both agree that working at home is difficult", "Nastya says working at home is expensive"]
    accepted_answers: [{value: "Dima thinks working at home is convenient because he does not need to travel to the office; Nastya prefers working with people at school", status: "correct"}]
    feedback: "Dima says *удобно* because no travel to the office is needed; Nastya says school is better with people."
  ru.a2.unit26.lesson03.exercise03.match_dialogue_opinions:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Как ты думаешь?", right: "What do you think?"}
          - {left: "По-моему, это удобно.", right: "In my opinion, it is convenient."}
          - {left: "потому что не нужно ехать", right: "because there is no need to travel"}
          - {left: "Я не согласна.", right: "I disagree. (female speaker)"}
          - {left: "Понимаю.", right: "I understand."}
          - {left: "Для меня дома спокойнее.", right: "For me, it is calmer at home."}
        status: "correct"
    feedback: "These lines ask, give, and respond to opinions."
  ru.a2.unit26.lesson03.exercise04.order_dlya_menya:
    instruction: "Put the words in order to say \"For me, it is calmer at home.\""
    accepted_answers: [{value: ["Для", "меня", "дома", "спокойнее"], status: "correct"}]
    feedback: "The correct order is *Для меня дома спокойнее*."
  ru.a2.unit26.lesson03.exercise05.respond_opinion:
    instruction: "Dima says \"По-моему, работать дома удобно.\" Respond with a contrasting female-speaker opinion and a reason about school."
    accepted_answers:
      - {value: "Я не согласна, потому что в школе лучше работать вместе.", status: "correct"}
      - {value: "Я не согласна потому что в школе лучше работать вместе", status: "correct"}
    feedback: "The answer names disagreement and gives the reason."
  ru.a2.unit26.lesson03.exercise06.write_opinion_response:
    instruction: "Write two short sentences: give an opinion about working at home with a reason, then respond to the contrasting opinion with \"I understand, but I disagree\" and a reason."
    accepted_answers:
      - {value: "По-моему, работать дома удобно, потому что дома спокойнее. Я понимаю, но я не согласна, потому что в школе лучше работать вместе.", status: "correct"}
      - {value: "По-моему работать дома удобно потому что дома спокойнее. Я понимаю но я не согласна потому что в школе лучше работать вместе.", status: "correct"}
      - {value: "Я думаю, что работать дома удобно, потому что дома спокойнее. Я понимаю, но я не согласна, потому что в школе лучше работать вместе.", status: "correct"}
    feedback: "A complete response gives your opinion, reason, and a response to the other view."
