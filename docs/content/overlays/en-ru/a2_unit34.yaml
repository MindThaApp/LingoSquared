schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: "en-ru.a2.unit34"
source_language: "en"
target_language: "ru"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "codex", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "New Codex-authored draft. Needs fresh-context review."}

course:
  title: "Russian A2"
  description: "Learn A2-level Russian for making a shopping complaint."

units:
  ru.a2.unit34.zhaloba: {title: "Complaint"}

lessons:
  ru.a2.unit34.lesson01.pokupka: {title: "I bought a shirt"}
  ru.a2.unit34.lesson02.problem: {title: "It is too small"}
  ru.a2.unit34.lesson03.v_magazine: {title: "Dialogue: complaint in a shop"}

teaching:
  ru.a2.unit34.lesson01.teach.kupila: {title: "Я купила эту рубашку.", gloss: "I bought this shirt. (female speaker)", note: "Настя uses *купила* because she is female.", example_gloss: "I bought this shirt yesterday."}
  ru.a2.unit34.lesson01.teach.chek: {title: "чек", gloss: "receipt", note: "*Вот чек* means here is the receipt.", example_gloss: "Here is the receipt."}
  ru.a2.unit34.lesson01.teach.magazin: {title: "магазин", gloss: "shop", note: "*в магазине* means in a shop.", example_gloss: "I am in the shop."}
  ru.a2.unit34.lesson02.teach.mala: {title: "Она мне мала.", gloss: "It is too small for me.", note: "*мала* agrees with feminine *рубашка*; *мне* makes the clothing complaint natural.", example_gloss: "The shirt is too small for me."}
  ru.a2.unit34.lesson02.teach.obmenyat: {title: "Можно обменять?", gloss: "Can I exchange it?", note: "*Можно ...?* is a polite service-counter request.", example_gloss: "Can I exchange the shirt?"}
  ru.a2.unit34.lesson02.teach.razmer: {title: "размер", gloss: "size", note: "*на другой размер* means for another size.", example_gloss: "For another size."}
  ru.a2.unit34.lesson03.teach.nastya_purchase_problem: {title: "Nastya states the purchase and problem", gloss: "Nastya: Hello. I bought this shirt yesterday, but it is too small.", note: "This line gives the problem clearly and politely."}
  ru.a2.unit34.lesson03.teach.seller_receipt: {title: "The seller asks for the receipt", gloss: "Seller: Do you have the receipt?", note: "Shop employees use polite *вас* with customers."}
  ru.a2.unit34.lesson03.teach.nastya_receipt_exchange: {title: "Nastya asks for an exchange", gloss: "Nastya: Yes, here is the receipt. Can I exchange it for another size?", note: "This delivers the exchange-request part of the outcome."}
  ru.a2.unit34.lesson03.teach.seller_exchange_today: {title: "The seller offers the exchange", gloss: "Seller: Yes, of course. You can exchange it today.", note: "The seller offers a specific resolution."}

exercises:
  ru.a2.unit34.lesson01.exercise01.recognize_kupila: {instruction: "Which word means \"bought\" for a female speaker?", correct_option: "купила", distractors: ["мала", "чек", "размер"], accepted_answers: [{value: "купила", status: "correct"}], feedback: "*купила* is \"bought\" for a female speaker."}
  ru.a2.unit34.lesson01.exercise02.recognize_chek: {instruction: "Which word means \"receipt\"?", correct_option: "чек", distractors: ["размер", "рубашка", "магазин"], accepted_answers: [{value: "чек", status: "correct"}], feedback: "*чек* means \"receipt.\""}
  ru.a2.unit34.lesson01.exercise03.listen_select_receipt: {instruction: "Listen. What does the speaker say?", correct_option: "She bought this shirt yesterday.", distractors: ["She can exchange it today.", "She asks for another train.", "She reads news online."], accepted_answers: [{value: "She bought this shirt yesterday.", status: "correct"}], feedback: "The recording says *Я купила эту рубашку вчера*."}
  ru.a2.unit34.lesson01.exercise04.match_purchase:
    instruction: "Match each Russian word or phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "купила", right: "bought (female speaker)"}
          - {left: "эту рубашку", right: "this shirt"}
          - {left: "вчера", right: "yesterday"}
          - {left: "чек", right: "receipt"}
          - {left: "Вот чек.", right: "Here is the receipt."}
          - {left: "магазин", right: "shop"}
        status: "correct"
    feedback: "These phrases identify the purchase and receipt."
  ru.a2.unit34.lesson01.exercise05.order_bought_shirt: {instruction: "Put the words in order to say \"I bought this shirt yesterday.\" Use the female-speaker form.", accepted_answers: [{value: ["Я", "купила", "эту", "рубашку", "вчера"], status: "correct"}], feedback: "The correct order is *Я купила эту рубашку вчера*."}
  ru.a2.unit34.lesson01.exercise06.write_purchase:
    instruction: "Write exactly this sentence: I bought this shirt yesterday. Use the female-speaker form купила."
    accepted_answers:
      - {value: "Я купила эту рубашку вчера.", status: "correct"}
      - {value: "Я купила эту рубашку вчера", status: "correct"}
    feedback: "The model answer is *Я купила эту рубашку вчера*."
  ru.a2.unit34.lesson02.exercise01.recognize_mala: {instruction: "Which word means \"too small\" for рубашка?", correct_option: "мала", distractors: ["другой", "сегодня", "купила"], accepted_answers: [{value: "мала", status: "correct"}], feedback: "*мала* means too small for a feminine noun like *рубашка*."}
  ru.a2.unit34.lesson02.exercise02.recognize_obmenyat: {instruction: "Which word means \"exchange\"?", correct_option: "обменять", distractors: ["купила", "пользуюсь", "отдыхаю"], accepted_answers: [{value: "обменять", status: "correct"}], feedback: "*обменять* means \"exchange.\""}
  ru.a2.unit34.lesson02.exercise03.listen_select_exchange: {instruction: "Listen. What does the customer ask to do?", correct_option: "Exchange it.", distractors: ["Pay by card.", "Open an account.", "Go to a course."], accepted_answers: [{value: "Exchange it.", status: "correct"}], feedback: "The recording asks *Можно обменять?*"}
  ru.a2.unit34.lesson02.exercise04.match_problem_resolution:
    instruction: "Match each Russian phrase to its meaning."
    accepted_answers:
      - value:
          - {left: "Она мне мала.", right: "It is too small for me."}
          - {left: "Можно обменять?", right: "Can I exchange it?"}
          - {left: "другой размер", right: "another size"}
          - {left: "на другой размер", right: "for another size"}
          - {left: "рубашка", right: "shirt"}
          - {left: "размер", right: "size"}
        status: "correct"
    feedback: "These phrases explain the problem and request an exchange."
  ru.a2.unit34.lesson02.exercise05.order_exchange: {instruction: "Put the words in order to ask \"Can I exchange it for another size?\"", accepted_answers: [{value: ["Можно", "обменять", "на", "другой", "размер"], status: "correct"}], feedback: "The correct order is *Можно обменять на другой размер?*"}
  ru.a2.unit34.lesson02.exercise06.write_exchange_request:
    instruction: "Write exactly this request: Can I exchange it for another size?"
    accepted_answers:
      - {value: "Можно обменять на другой размер?", status: "correct"}
      - {value: "Можно обменять на другой размер", status: "correct"}
    feedback: "The model request is *Можно обменять на другой размер?*"
  ru.a2.unit34.lesson03.exercise01.choose_complaint: {instruction: "Which answer explains the problem and asks for an exchange?", correct_option: "Я купила эту рубашку вчера, но она мне мала. Можно обменять на другой размер?", distractors: ["У вас есть чек?", "Да, конечно. Можно обменять сегодня.", "Я часто читаю новости онлайн."], accepted_answers: [{value: "Я купила эту рубашку вчера, но она мне мала. Можно обменять на другой размер?", status: "correct"}], feedback: "This answer gives the purchase, problem, and requested exchange."}
  ru.a2.unit34.lesson03.exercise02.dialogue_comprehension_complaint:
    instruction: "Listen to the dialogue. What is wrong, and what resolution does the seller offer?"
    correct_option: "The shirt is too small; the seller says it can be exchanged today"
    distractors: ["The train is delayed; staff offer another train", "The phone is online too often; Dima tries to stop", "The course is on Tuesday; Nastya has dinner at home"]
    accepted_answers: [{value: "The shirt is too small; the seller says it can be exchanged today", status: "correct"}]
    feedback: "Настя says the shirt is too small, and the seller offers an exchange today."
  ru.a2.unit34.lesson03.exercise03.match_dialogue_complaint:
    instruction: "Match each Russian line to its meaning."
    accepted_answers:
      - value:
          - {left: "Я купила эту рубашку.", right: "I bought this shirt."}
          - {left: "Она мне мала.", right: "It is too small for me."}
          - {left: "У вас есть чек?", right: "Do you have the receipt?"}
          - {left: "Вот чек.", right: "Here is the receipt."}
          - {left: "Можно обменять?", right: "Can I exchange it?"}
          - {left: "сегодня", right: "today"}
        status: "correct"
    feedback: "These lines make and resolve a basic complaint."
  ru.a2.unit34.lesson03.exercise04.order_problem: {instruction: "Put the words in order to say \"It is too small for me.\"", accepted_answers: [{value: ["Она", "мне", "мала"], status: "correct"}], feedback: "The correct order is *Она мне мала*."}
  ru.a2.unit34.lesson03.exercise05.respond_receipt:
    instruction: "The seller asks \"У вас есть чек?\" Answer with the exact two-part response: \"Да, вот чек. Можно обменять на другой размер?\""
    accepted_answers:
      - {value: "Да, вот чек. Можно обменять на другой размер?", status: "correct"}
      - {value: "Да вот чек. Можно обменять на другой размер?", status: "correct"}
      - {value: "Да, вот чек. Можно обменять на другой размер", status: "correct"}
    feedback: "The model response is *Да, вот чек. Можно обменять на другой размер?*"
  ru.a2.unit34.lesson03.exercise06.write_complaint_message:
    instruction: "Write a short formal complaint: greet the employee, say you bought this shirt yesterday, say it is too small, say here is the receipt, and ask to exchange it for another size."
    accepted_answers:
      - {value: "Здравствуйте. Я купила эту рубашку вчера, но она мне мала. Вот чек. Можно обменять на другой размер?", status: "correct"}
      - {value: "Здравствуйте, я купила эту рубашку вчера, но она мне мала. Вот чек. Можно обменять на другой размер?", status: "correct"}
      - {value: "Здравствуйте. Я купила эту рубашку вчера но она мне мала. Вот чек. Можно обменять на другой размер?", status: "correct"}
    feedback: "A complete complaint gives the purchase, problem, receipt, and exchange request."
