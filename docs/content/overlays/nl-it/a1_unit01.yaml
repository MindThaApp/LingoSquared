teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: hoi / hallo, goedemorgen
    note: '*Ciao* is een informele groet voor allerlei situaties, onder vrienden en leeftijdsgenoten, op elk moment van de dag. *Buongiorno* is de standaardgroet overdag, beleefder en te gebruiken vanaf de ochtend tot in de middag.'
    example_gloss:
    - Hoi, hoe gaat het?
    - Goedemorgen, hoe gaat het met u?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: hoe gaat het met je, hoe gaat het met u
    note: '*come stai* hoort bij *tu* (een vriend, een leeftijdsgenoot); *come sta* hoort bij *Lei* (een onbekende, een baas, iemand die je respect toont). Dezelfde vraag, ander register.'
    example_gloss:
    - Hoi, hoe gaat het vandaag met je?
    - Goedemorgen, hoe gaat het vandaag met u?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Hoi, hoe gaat het?
    note: De informele groet met vraag, die je gebruikt bij vrienden, klasgenoten of leeftijdsgenoten.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Goedemorgen, hoe gaat het met u?
    note: De formele tegenhanger, voor iemand die je met respect aanspreekt, zoals de leidinggevende van een nieuwe collega.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: informeel · Lei: formeel of respectvol'
    note: '*tu* is het alledaagse ''je/jij'' onder vrienden, klasgenoten en leeftijdsgenoten. *Lei* is het beleefde ''u'' voor onbekenden, op de werkvloer of bij iemand die je voor het eerst ontmoet. Het heeft eigen werkwoordsvormen (vergelijk *tu stai* met *Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Goed, dank je
    note: Een eenvoudig, neutraal antwoord op 'hoe gaat het?'. Je kunt het in beide registers gebruiken door *e tu?* of *e Lei?* toe te voegen.
    example_gloss:
    - Goed, dank je, en jij?
    - Goed, dank u, en u? (formeel)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: En met jou?
    note: De informele manier om de vraag terug te stellen aan een vriend of leeftijdsgenoot.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: En met u?
    note: De formele manier om de vraag terug te stellen, passend bij het register van *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Goed, dank je, en jij?
    note: Het volledige informele antwoord met wedervraag, tegen een vriend of leeftijdsgenoot.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Goed, dank u, en u?
    note: Het volledige formele antwoord met wedervraag, tegen iemand die je met respect aanspreekt.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: goedenavond, welterusten
    note: '*Buonasera* is een groet bij aankomst in de avond. *Buonanotte* is een afscheidsgroet voor iemand die naar bed gaat of de dag afsluit. Het is nooit een begroeting.'
    example_gloss:
    - Goedenavond, hoe gaat het?
    - Welterusten, tot morgen.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: Tot ziens, tot morgen.
    note: '*Arrivederla* is het formele afscheid, bij *Lei*, passend op de werkvloer of bij een onbekende.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: Doei, tot morgen!
    note: Het informele afscheid, voor vrienden en leeftijdsgenoten die je de volgende dag weer ziet.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: Hoe heet u, pardon? (formeel)
    note: '*Come si chiama?* vraagt letterlijk ''hoe noemt u zich'' in het formele register van *Lei*. Met *scusi* (''pardon'') erbij klink je beleefd tegen een onbekende.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: Hoe heet je? (informeel)
    note: De informele versie, voor een vriend, leeftijdsgenoot of iemand van jouw leeftijd.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Ik heet Elena.
    note: '*chiamarsi* betekent ''heten'' (letterlijk: zich noemen). Zo noem je gewoonlijk je eigen naam, in beide registers.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Ik ben Sam.
    note: Een eenvoudig alternatief voor *mi chiamo*, met *essere* (zijn) en direct je naam.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: aangenaam, prettig kennis te maken (formeel)
    note: '*Piacere* alleen is een korte, gangbare manier om ''aangenaam'' te zeggen, in beide registers. *Piacere di conoscerla* is de uitgebreidere, formele versie, bij *Lei*.'
    example_gloss:
    - Aangenaam, Sam!
    - Prettig kennis te maken, mevrouw Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: Welkom op kantoor!
    note: '*Benvenuto* is de mannelijke vorm van ''welkom'' (voor een man; een vrouw heet je welkom met *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Hartelijk bedankt. / Dank u zeer.
    note: Een sterkere, nadrukkelijkere manier om te bedanken dan een gewoon *Grazie*.
