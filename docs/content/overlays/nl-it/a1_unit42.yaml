    title: Marco herkent Nina
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Lang en klein
    gloss: lang / klein
    note: '*Alto* beschrijft een lange persoon en *basso* een kleine. Italiaanse bijvoeglijke naamwoorden passen zich aan de persoon aan: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara is lang.
    - Luca is klein.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Oud en jong
    gloss: oud / jong
    note: '*Anziano* (oud) en *giovane* (jong) geven een algemene indruk, geen exact aantal jaren. *Giovane* eindigt op -e, dus het is hetzelfde voor mannen en vrouwen.'
    example_gloss:
    - Opa is oud.
    - Marco is jong.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Leeftijd: avere anni of anziano'
    gloss: 'Voor een exacte leeftijd gebruikt het Italiaans avere + anni: Quanti anni hai? Voor een algemene indruk gebruikt het een bijvoeglijk naamwoord: Il nonno è anziano.'
    note: In het Nederlands zeg je 'ik ben 30'; in het Italiaans zeg je letterlijk 'ik heb 30 jaar' (*ho trent'anni*). Het bijvoeglijk naamwoord *anziano* gebruik je voor hoe oud iemand lijkt.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara is lang en Luca is klein
    gloss: Chiara is lang en Luca is klein.
    note: 'Twee bijvoeglijke naamwoorden verbonden met *e* (en). Elk past zich aan zijn persoon aan: *alta* (vrouwelijk) en *basso* (mannelijk).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Haar
    gloss: het haar
    note: '*I capelli* is in het Italiaans meervoud: Italianen spreken over haar als ''de haren''. Het enkelvoud *il capello* betekent één enkele haar.'
    example_gloss: Marco heeft kort zwart haar.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: 'Drie haarkleuren in het mannelijk meervoud, passend bij *capelli*: *biondi*, *castani*, *grigi*. *Neri* (zwart) gebruik je ook voor haar.'
    example_gloss:
    - Giulia heeft blond haar.
    - Luca heeft bruin haar.
    - Opa heeft grijs haar.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Lunghi* (lang) en *corti* (kort) staan in het meervoud, net als *capelli*. Het woord *alto* (lang) gebruik je alleen voor mensen, niet voor haar.'
    example_gloss:
    - Chiara heeft lang haar.
    - Luca heeft kort haar.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli is meervoud
    gloss: 'Capelli is meervoud, dus het bijvoeglijk naamwoord staat ook in het meervoud: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'Het bijvoeglijk naamwoord staat na het zelfstandig naamwoord en komt overeen in geslacht en getal: *capelli lunghi* (mannelijk meervoud), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: Haar en ogen met avere
    gloss: 'Om een persoon te beschrijven gebruikt het Italiaans avere bij haar en ogen: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'Het Italiaans heeft ook het lidwoord nodig, anders dan in het Nederlands (''heeft blond haar''): *i capelli*, *gli occhi*. Je kunt ook *è bionda* zeggen, maar *avere* is hier het patroon dat je moet leren.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco heeft kort zwart haar
    gloss: Marco heeft kort zwart haar.
    note: '*Neri* (zwart) is het mannelijk meervoud, passend bij *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia heeft lang blond haar
    gloss: Giulia heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Ogen
    gloss: de ogen
    note: '*Occhio* (oog) is mannelijk; het meervoud is *occhi* en krijgt *gli* omdat het met een klinker begint.'
    example_gloss: Marco heeft bruine ogen.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: 'Oogkleuren: *azzurri* (blauw), *marroni* (bruin), *verdi* (groen). Deze meervoudsvormen gelden voor beide geslachten.'
    example_gloss:
    - Giulia heeft blauwe ogen.
    - Luca heeft bruine ogen.
    - Chiara heeft groene ogen.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Kleuren staan in het meervoud
    gloss: 'Oogkleuren staan in het meervoud, passend bij occhi: occhi azzurri, marroni, verdi.'
    note: 'Bijvoeglijke naamwoorden die in het enkelvoud op -e eindigen (*verde*, *marrone*), eindigen in het meervoud op -i: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Hoe ziet Giulia eruit?
    gloss: Hoe ziet Giulia eruit?
    note: '*Com''è?* is de kernvraag over uiterlijk. *Com''è* is *come è* met een apostrof op de plek waar de e wegvalt.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia heeft lang blond haar en blauwe ogen
    gloss: Giulia heeft lang blond haar en blauwe ogen.
    note: 'Een voorbeeldantwoord: *avere* + haar + *e* + ogen in één zin.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia vertelt over Nina
    gloss: 'Giulia: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Viene* (komt) kondigt iemand nieuws aan. *Si chiama* betekent ''ze heet'', letterlijk ''ze noemt zich''.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco vraagt hoe ze eruitziet
    gloss: 'Marco: Oké! Hoe ziet ze eruit?'
    note: 'Dezelfde vraag nog eens, zonder naam: het onderwerp is duidelijk uit de context.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia beschrijft de lengte en het haar van Nina
    gloss: 'Giulia: Ze is klein en heeft kort blond haar.'
    note: '*È bassa* (ze is klein) gebruikt het vrouwelijke *bassa*; daarna volgt de beschrijving van het haar met *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco vraagt naar haar ogen
    gloss: 'Marco: En haar ogen?'
    note: '*E gli occhi?* laat het werkwoord weg. In het Italiaans laat je vaak woorden weg die uit de context duidelijk zijn.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia beschrijft de ogen van Nina
    gloss: 'Giulia: Ze heeft groene ogen.'
    note: '*Ha gli occhi verdi*: een onderwerpsvoornaamwoord is niet nodig, want de werkwoordsuitgang zegt al dat het om ''zij'' gaat.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco zal haar herkennen
    gloss: 'Marco: Bedankt! Dan herken ik haar.'
    note: '*La riconosco* (ik herken haar): het voornaamwoord *la* staat vóór het werkwoord.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Luca en Chiara vergelijken
    gloss: Luca en Chiara zijn broer en zus, maar ze zien er heel verschillend uit. Luca is klein en heeft kort bruin haar en bruine ogen. Chiara is groter dan Luca en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      fratello: broer
      sorella: zus
      sembrano: ze lijken / zien eruit
      diversi: verschillend
      basso: kort
      corti: kort
      castani: bruin
      capelli: haar
      marroni: bruin
      occhi: ogen
      alta: lang (più alta = groter)
      lunghi: lang
      verdi: groen
      come: hoe (Tu come sei? = Hoe zie jij eruit?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Vergelijken: più ... di'
    gloss: 'Het Italiaans vergelijkt met più + bijvoeglijk naamwoord + di: Chiara è più alta di Luca.'
    note: 'Zet *più* voor het bijvoeglijk naamwoord en *di* voor de persoon met wie je vergelijkt. Het bijvoeglijk naamwoord behoudt zijn geslacht: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara heeft langer haar dan Luca
    gloss: Chiara heeft langer haar dan Luca.
    note: '*I capelli più lunghi di Luca*: het adjectief blijft meervoud, omdat het congrueert met *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: '*Ho i capelli corti e castani*: gebruik *avere* om je eigen uiterlijk te beschrijven.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco ziet Nina
    gloss: 'Marco: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Guarda* (kijk) is de gebiedende wijs van *tu*. *Quella* betekent ''die daar'' voor een vrouw of meisje.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia bevestigt het
    gloss: 'Giulia: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina begroet Marco
    gloss: 'Nina: Hoi, ben jij Marco?'
    note: '*Sei Marco?* is de informele vraag: *sei* is de *tu*-vorm van *essere*, dus *tu* is niet nodig.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco begroet Nina terug
    gloss: 'Marco: Ja! Aangenaam kennis te maken, Nina.'
    note: '*Piacere di conoscerti* zeg je als je iemand voor het eerst ontmoet; *-ti* betekent ''je''.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Marco heeft Nina herkend aan Giulia''s eerdere beschrijving.'
