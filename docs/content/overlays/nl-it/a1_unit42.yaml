course:
  title: Italiaans A1
  description: 'Italiaans voor beginners om het basisuiterlijk van een persoon te beschrijven: indrukken van lengte en leeftijd, haar- en oogkleur, de kernvraag Com''è? en het vergelijken van het uiterlijk van twee mensen.'
