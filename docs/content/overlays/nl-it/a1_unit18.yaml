  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: slaapkamer, badkamer
    note: '*la camera da letto* is letterlijk ''de kamer voor het bed'' (*letto* = bed); *il bagno* is de badkamer.'
    example_gloss:
    - De slaapkamer is klein.
    - De badkamer is schoon.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: Dit is mijn huis.
    note: '*Questa* (deze, vrouwelijk) komt overeen met *casa* (huis), dat vrouwelijk is.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Er zijn vier kamers.
    note: '*Ci sono* (er zijn) plus een getal en *stanze* (kamers); *quattro* (vier) kwam in Unit 3 aan bod.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: bed, tafel
    note: '*il letto* (bed) en *il tavolo* (tafel) zijn allebei mannelijk.'
    example_gloss:
    - Het bed staat in de slaapkamer.
    - De tafel staat in de keuken.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: stoel, bank
    note: '*la sedia* (stoel) is vrouwelijk; *il divano* (bank) is mannelijk.'
    example_gloss:
    - De stoel staat bij de tafel.
    - De bank staat in de woonkamer.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: Het bed staat in de slaapkamer.
    note: '*nella* is *in* + *la* en betekent ''in de''.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: De bank staat in de woonkamer.
    note: '*nel* is *in* + *il* (mannelijk) en betekent ''in het''.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: dichtbij, voor
    note: Beide zijn voorzetsels van twee woorden die eindigen op *a*; dat smelt samen met een lidwoord erachter (*al*, *alla*).
    example_gloss:
    - De stoel staat bij de tafel.
    - Het bed staat voor het raam.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: achter, boven / op, onder
    note: 'Nog drie woorden voor plaats: *dietro* (achter), *sopra* (boven/op), *sotto* (onder). Geen van deze heeft *a* nodig voor een lidwoord.'
    example_gloss:
    - De bank staat achter de tafel.
    - Het boek ligt op de tafel.
    - De kat zit onder het bed.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: Waar is het bed?
    note: '*Dov''è* is een samentrekking van *dove* (waar) + *è* (is).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: Het bed staat bij het raam.
    note: '*vicino alla finestra* gebruikt *vicino a* + *la finestra* (het raam), samengetrokken tot *alla*.'
