    title: Een tekst over de brand
    gloss: 'In het taalcafé in de bibliotheek is brand. De medewerker zegt: Ga naar de nooduitgang! Nina heeft hulp nodig. Giulia is bij Nina. Marco belt de brandweer. Iedereen is buiten. Dat is goed!'
