      emergenza: nood (uscita di emergenza = nooduitgang)
      aiuto: hulp
      bisogno: nodig hebben (ho bisogno di = ik heb ... nodig)
      chiama: belt
      vigili: brandweerlieden (vigili del fuoco = brandweer)
      tutti: iedereen
      fuori: buiten
