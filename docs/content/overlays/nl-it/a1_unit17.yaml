teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: baan / werk
    note: '*il lavoro* is een mannelijk woord en betekent zowel ''baan'' als ''werk'' in het algemeen.'
    example_gloss:
    - Mijn baan is interessant.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: leraar/lerares, winkelbediende
    note: '*insegnante* (leraar/lerares) heeft dezelfde vorm voor mannen en vrouwen; *commesso* (winkelbediende) is mannelijk, de vrouwelijke vorm is *commessa*.'
    example_gloss:
    - Ik ben leraar, geen winkelbediende.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Wat doet u voor werk?
    note: '*Che lavoro fai?* (letterlijk ''Wat voor werk doe je?'') is de standaardvraag naar iemands beroep.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Ik ben lerares.
    note: 'Voor een beroep zonder bijvoeging laat het Italiaans het lidwoord weg: *Sono insegnante*, niet *Sono un insegnante*.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Ik ben winkelbediende.
    note: Hetzelfde patroon zonder lidwoord als bij *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: kantoor, school
    note: Bij *l'ufficio* (kantoor) wordt het lidwoord voor een klinker afgekort; *la scuola* (school) is vrouwelijk.
    example_gloss:
    - Ik werk op een kantoor.
    - Ik werk op een school.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: Waar werk je?
    note: '*Dove* (waar) plus *lavori* (je werkt, informeel).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Ik werk op een kantoor.
    note: '*Lavoro in* (ik werk in) plus *un ufficio* (een kantoor).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Ik werk op een school.
    note: Hetzelfde patroon met *una scuola* (een school).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: ik begin, ik eindig
    note: '*inizio* (ik begin) en *finisco* (ik eindig) zijn de vormen voor de eerste persoon enkelvoud van *iniziare* en *finire*.'
    example_gloss:
    - Ik begin om negen uur.
    - Ik eindig om vijf uur.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: Hoe laat begin je?
    note: '*A che ora* (om hoe laat) plus *inizi* (je begint, informeel).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
