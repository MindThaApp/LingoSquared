    title: Wie reist hoe?
    gloss: Giulia reist elke dag met de trein naar haar werk. Marco gaat meestal met de fiets, maar als het regent neemt hij ook de trein. Luca gaat liever met de auto. Chiara woont dichtbij en loopt naar haar werk. Hoe ga jij naar je werk?
    note: 'Vier manieren van reizen en één voorwaarde (*quando piove*, als het regent) staan tegenover elkaar. *Andare* (gaan) is onregelmatig: *vado*, *va*.'
    glosses:
      viaggia: reist
      ogni: elke
      giorno: dag
      treno: trein
      lavoro: werk
      bicicletta: fiets (in bicicletta = met de fiets)
      solito: gebruikelijk (di solito = meestal)
      piove: regent
      prende: neemt
      andare: gaan (andare in macchina = met de auto gaan)
      preferisce: heeft liever
      macchina: auto
      abita: woont
      vicino: dichtbij
      piedi: voeten (a piedi = te voet)
      vai: jij gaat
