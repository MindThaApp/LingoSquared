teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: de moeder, de vader
    note: 'Italiaanse zelfstandige naamwoorden hebben een lidwoord dat bij het geslacht hoort: *la* voor vrouwelijk, *il* voor mannelijk. Net als in het Nederlands (de/het) moet je het lidwoord bij het woord leren.'
    example_gloss:
    - Dit is mijn vader.
    - Dit is mijn moeder.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: de broer, de zus
    note: '*fratello* is mannelijk (*il*) en *sorella* is vrouwelijk (*la*).'
    example_gloss:
    - Ik heb één broer en één zus.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: Dit is mijn vader. Dit is mijn moeder.
    note: '*Questo/Questa* (dit/deze) past zich aan het geslacht aan van de persoon naar wie je wijst: *questo* voor een man, *questa* voor een vrouw.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: de opa, de oma
    note: Hetzelfde patroon van mannelijk/vrouwelijk lidwoord als bij *padre/madre*.
    example_gloss:
    - Mijn opa woont in Rome.
    - Mijn oma kookt heel goed.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: Heb je broers of zussen?
    note: '*Hai* (je hebt) + het familiewoord + *o* (of) is de standaardmanier om naar broers en zussen te vragen.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: Ik heb één broer en één zus.
    note: '*Ho* (ik heb) beantwoordt de vraag, met *un* (een, mannelijk) en *una* (een, vrouwelijk).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: de echtgenoot, de echtgenote
    note: Nog een mannelijk/vrouwelijk paar, met hetzelfde patroon van lidwoorden.
    example_gloss:
    - Sam heeft een vrouw.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: Heb je kinderen?
    note: '*figli* (kinderen) is het meervoud dat je gebruikt als je algemeen vraagt, ongeacht hoeveel het er zijn of van welk geslacht.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Ja, ik heb twee kinderen. Een jongen en een meisje.
    note: '*maschio* (jongen) en *femmina* (meisje) geven het geslacht van de kinderen aan, nadat je het totaal hebt genoemd.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: de zoon, de dochter
    note: De enkelvoudsvormen van *figli*, met het gebruikelijke patroon van mannelijk/vrouwelijk lidwoord.
    example_gloss:
    - Elena heeft een zoon en een dochter.
