course:
  title: Italiaans A1
  description: 'Italiaans voor beginners over vrijetijdsbesteding: hobbywoordenschat, frequentie-uitdrukkingen, vragen en vertellen wat iemand in zijn vrije tijd doet en de hobby''s van twee mensen vergelijken.'
