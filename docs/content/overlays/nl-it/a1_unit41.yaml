  it.a1.unit41.lesson05.marco_e_giulia_confrontano:
    title: Marco en Giulia vergelijken hun hobby's
  it.a1.unit41.lesson06.programmare_un_fine_settimana:
    title: Samen een weekend plannen
teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelvoorkomende hobbywerkwoorden in de infinitief: *leggere* (lezen), *fare sport* (sporten) en *cucinare* (koken). Italiaanse infinitieven eindigen op -are, -ere of -ire.'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*Il tempo libero* is mannelijk, dus het krijgt *il*. Het is de sleuteluitdrukking om over hobby''s te praten.'
    example_gloss: In mijn vrije tijd lees ik graag.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*Leggo* is de *io*-vorm van *leggere* (lezen). In het Italiaans laat je het onderwerp meestal weg: zeg *Leggo*, niet *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobby''s: *ascoltare musica* (naar muziek luisteren), *disegnare* (tekenen) en *giocare ai videogiochi* (videogames spelen).'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: '*Ascoltare* heeft direct een lijdend voorwerp: *ascolto musica*, zonder voorzetsel ertussen. In het Nederlands zeg je wel ''naar muziek luisteren''.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*Con gli amici* betekent met vrienden. *Gli* is het meervoudige lidwoord voor een mannelijk woord dat met een klinker begint.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: 'Vier frequentiewoorden. *Mai* (nooit) heeft *non* voor het werkwoord nodig: *non gioco mai*.'
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*Ogni* (elke) verandert nooit: *ogni settimana*, *ogni fine settimana*. Zie de volgende kaart.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai heeft non nodig; ogni verandert nooit
    gloss: 'Bij mai krijgt het werkwoord ook non: Non gioco mai. Ogni blijft bij elk zelfstandig naamwoord hetzelfde: ogni settimana, ogni fine settimana.'
    note: Nederlands zegt 'ik speel nooit'; Italiaans zegt *non gioco mai* (letterlijk 'ik speel niet nooit'). *Ogni* wordt altijd gevolgd door een zelfstandig naamwoord in het enkelvoud.
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia begint over hobby's
    gloss: 'Giulia: We wandelen vaak samen. Maar wat doe jij nog meer in je vrije tijd, Marco?'
    note: '*Passeggiamo* is de *noi*-vorm (wij) van *passeggiare*. *Spesso* staat na het werkwoord.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Marco's hobby's
    gloss: 'Marco: Ik kook graag, ook thuis. En ik sport vaak.'
    note: '*Anche a casa* (ook thuis) laat zien dat Marco voor zijn plezier kookt, niet alleen op zijn werk. *A casa* betekent thuis, zonder lidwoord.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia is verrast
    gloss: 'Giulia: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*Già* (al) en *tutto il giorno* (de hele dag) laten zien hoeveel Marco op zijn werk al kookt.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco legt uit
    gloss: 'Marco: Ja, maar van koken word ik rustig. En jij, wat doe jij graag?'
    note: '*Cucinare mi rilassa* betekent letterlijk ''koken ontspant mij'': de activiteit is het onderwerp en *mi* (mij) is het lijdend voorwerp.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Giulia's hobby's
    gloss: 'Giulia: Ik lees graag en luister vaak naar muziek.'
    note: 'Twee hobby''s verbonden met *e* (en). Beide werkwoorden blijven in de *io*-vorm: *leggo* en *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco vraagt naar gamen
    gloss: 'Marco: Game jij ook?'
    note: 'Een ja/nee-vraag heeft dezelfde woordvolgorde als een bewering; alleen de intonatie gaat omhoog: *Giochi anche ai videogiochi?* *Anche* betekent ook.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia antwoordt
    gloss: 'Giulia: Nee, ik game nooit. Maar ik teken soms!'
    note: '*Non ... mai* (nooit) en *a volte* (soms) tegenover elkaar in één antwoord. *Ma* betekent maar.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Hobby's vergelijken
    gloss: Marco en ik wandelen vaak samen. Maar we hebben ook andere hobby's. Marco kookt graag, ook thuis, en sport vaak. Ik lees graag en luister vaak naar muziek. Ik teken soms, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Giulia's bericht vat de feiten uit de les samen en eindigt met de kernvraag van deze unit aan de lezer.
    glosses:
      passeggiamo: wij maken een wandeling
      spesso: vaak
      insieme: samen
      altri: andere
      cucina: kookt
      volentieri: graag
      casa: thuis (a casa = thuis)
      sport: sport (fa sport = sport)
      leggo: lees
      ascolto: luister
      musica: muziek
      disegno: teken
      volte: keren (a volte = soms)
      videogiochi: videogames
      mai: nooit
      libero: vrij
      tempo: tijd
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco vraagt naar het weekend
    gloss: 'Marco: Wat doe je dit weekend?'
    note: '*Questo fine settimana* (dit weekend) is mannelijk, dus het is *questo*. *Fai* is de *tu*-vorm van *fare* (doen).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia twijfelt
    gloss: 'Giulia: Ik weet het nog niet. Ik lees graag, maar ik wil ook graag naar buiten.'
    note: '*Non lo so ancora* (ik weet het nog niet): *lo* staat voor datgene wat je niet weet en staat voor het werkwoord. *Uscire* betekent uitgaan, naar buiten gaan.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco doet een voorstel
    gloss: 'Marco: Gaan we samen wandelen? Daarna kook ik voor ons.'
    note: '*Poi* (dan, daarna) zet de plannen op volgorde. *Cucino io* (met *io* na het werkwoord) benadrukt ''ik ga koken''.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia stemt in
    gloss: 'Giulia: Goed idee! Ik vind zowel wandelen als koken leuk.'
    note: '*Sia ... sia ...* betekent zowel ... als ...: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco bevestigt
    gloss: 'Marco: Perfect. Dan zie ik je zaterdag!'
    note: '*Ci vediamo sabato* (tot zaterdag): geen lidwoord voor de dag als je de komende dag bedoelt.'
