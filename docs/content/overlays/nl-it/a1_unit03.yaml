teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: nul, één, twee, drie, vier, vijf
    note: De eerste zes getallen – de bouwstenen voor prijzen, leeftijden en telefoonnummers in deze unit.
    example_gloss:
    - Ik heb twee broers.
    - Het is vijf uur.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: zes, zeven, acht, negen, tien
    note: De getallen zes tot en met tien, waarmee het bereik van 0 tot 10 compleet is.
    example_gloss:
    - Ik werk acht uur per dag.
    - De winkel gaat om tien uur open.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: Hoe oud ben je?
    note: 'Letterlijk ''hoeveel jaren heb je'' – het Italiaans vraagt naar de leeftijd met *avere* (hebben), terwijl het Nederlands ''zijn'' gebruikt: ''Hoe oud ben je?'''
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: Ik ben dertig jaar.
    note: 'Een vaste uitdrukking om je leeftijd te noemen met *avere* (letterlijk: ik heb dertig jaar). ''Dertig'' wordt hier niet als telwoord geleerd: in deze unit blijven de getallen bij 0-10, plus 30 en 50 die alleen in deze vaste zin en in prijzen voorkomen.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: Hoeveel kost een koffie?
    note: '*Quanto costa* is de gewone manier om naar de prijs van één product te vragen.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: één euro, twee euro
    note: 'In het Italiaans blijft *euro* in het meervoud hetzelfde: zowel *un euro* als *due euro* gebruikt *euro*.'
    example_gloss:
    - Het kost één euro.
    - Dat is twee euro vijftig.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: En een croissant?
    note: 'Een korte vervolgvraag naar de prijs van een tweede product: een *cornetto* (de Italiaanse ontbijtcroissant).'
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: Dat is twee euro vijftig.
    note: '*e cinquanta* voegt de centen toe, letterlijk ''en vijftig''. Je gebruikt het zo bij elke prijs met vijftig cent.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: Hoeveel wilt u er?
    note: Zo vraagt een barista of winkelier beleefd hoeveel stuks je wilt; *ne* verwijst naar het product dat al genoemd is.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: Ik wil er graag drie, dank u.
    note: '*Ne vorrei* + een getal is de beleefde manier om een hoeveelheid te vragen; ook hier verwijst *ne* terug naar het product.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: Wat is je telefoonnummer?
    note: De informele manier om iemand naar zijn of haar telefoonnummer te vragen, met *tuo* (jouw).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: Ik bel je morgen!
    note: Een vriendelijke manier om af te sluiten nadat je iemands nummer hebt gekregen.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: mijn nummer
    note: Italiaanse telefoonnummers worden meestal cijfer voor cijfer voorgelezen, met de getallen uit les 1.
    example_gloss: Mijn nummer is nul, drie, vier, twee, één.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: Mijn nummer is nul, drie, vier, twee, één.
    note: Sam noemt zijn telefoonnummer cijfer voor cijfer, de gewone manier om in het Italiaans een telefoonnummer voor te lezen.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: Perfect, bedankt!
    note: Een korte, opgewekte manier om een gesprek af te sluiten nadat je de informatie hebt gekregen die je nodig had.
