teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: gisteren, vanochtend
    note: '*ieri* (gisteren) en *stamattina* (vanochtend) zijn twee tijdsaanduidingen om over recente gebeurtenissen te praten.'
    example_gloss:
    - Gisteren was ik thuis.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: ik ging (mannelijk), ik ging (vrouwelijk)
    note: '*sono andato/andata* is de passato prossimo van *andare*, met het hulpwerkwoord *essere*; het voltooid deelwoord komt overeen met het geslacht van het onderwerp.'
    example_gloss:
    - Vanochtend ben ik naar mijn werk gegaan.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Ik ben gisteren naar de bioscoop gegaan.
    note: '*Sono andato* (een mannelijke spreker) plus *al cinema* (naar de bioscoop) plus *ieri* (gisteren) beschrijft een afgeronde gebeurtenis in het verleden.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: Ik heb een mooie film gezien!
    note: '*Ho visto* gebruikt het hulpwerkwoord *avere* met het onregelmatige voltooid deelwoord *visto* (van *vedere*, zien).'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: Ik heb een broodje gegeten als lunch.
    note: '*Ho mangiato* gebruikt *avere* plus het regelmatige voltooid deelwoord *mangiato* (van *mangiare*, eten); *a pranzo* betekent ''als lunch'' of ''tijdens de lunch''.'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: Wat hebt u gisteren gedaan?
    note: '*hai fatto* is de passato prossimo van *fare* (doen), hier gebruikt om naar een recente gebeurtenis te vragen.'
    example_gloss:
    - Wat heb je vanochtend gedaan?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: gisteravond
    note: '*ieri sera* combineert *ieri* (gisteren) met *sera* (avond) voor een bepaald moment in het verleden.'
    example_gloss:
    - Ik ben gisteravond naar de bioscoop gegaan.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Vanochtend ben ik naar mijn werk gegaan, zoals altijd.
    note: '*sono andata* (een vrouwelijke spreker) plus *come sempre* (zoals altijd) beschrijft een routinehandeling in het verleden.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: En jij, wat heb jij vanochtend gedaan?
    note: '*E tu* (en jij) stuurt de vraag terug naar de andere spreker.'
    example_gloss:
    - En jij, wat heb jij gisteravond gedaan?
