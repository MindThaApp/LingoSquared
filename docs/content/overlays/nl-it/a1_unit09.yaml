    title: Sì, ce n'è una qui vicino.
    gloss: Ja, er is er een in de buurt.
    note: '*ce n''è una* (er is er een) is het antwoord op een *c''è*-vraag en verwijst terug naar het vrouwelijke woord *banca*.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: Naast het station.
    note: '*accanto a* (naast) plus het lidwoord geeft een precieze plek ten opzichte van een herkenningspunt.'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Hartelijk bedankt.
    note: 'Letterlijk ''duizend dank'': sterker dan een gewoon *grazie*.'
  it.a1.unit09.lesson03.teach.dove_e_la_stazione:
    title: Dov'è la stazione?
    gloss: Waar is het station?
    note: '*Dov''è* (waar is) met een zelfstandig naamwoord vraagt naar de plek van iets bepaalds.'
    example_gloss:
