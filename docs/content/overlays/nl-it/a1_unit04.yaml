  it.a1.unit04.lesson01.teach.che_giorno_e_oggi:
    title: Che giorno è oggi?
    gloss: Welke dag is het vandaag?
    note: De gewone manier om te vragen welke dag van de week het is.
  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Vandaag is het donderdag.
    note: '*Oggi* (vandaag) + *è* (is) + de naam van de dag geeft direct antwoord op de vraag.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Morgen is het vrijdag.
    note: '*Domani* (morgen) volgt hetzelfde patroon als *oggi* om een dag te noemen.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: Welke datum is het vandaag?
    note: '*Che data* (welke datum) gebruik je in plaats van *che giorno* als je naar de datum op de kalender vraagt en niet naar de dag van de week.'
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: januari, februari, maart, april
    note: De eerste vier maanden van het jaar in het Italiaans; alle maanden schrijf je met een kleine letter.
    example_gloss:
    - Vandaag is het vijf januari.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Vandaag is het vijf januari.
    note: 'Italiaanse datums gebruiken *il* + het dagnummer + de maandnaam, zonder rangtelwoord: gewoon het hoofdtelwoord *cinque*. De enige uitzondering is de eerste van de maand, die het rangtelwoord *primo* gebruikt (*il primo gennaio*).'
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: 15 maart
    note: Nog een voorbeeld van het patroon dag + maand; het werkt voor elke datum hetzelfde.
  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: Wanneer kom je in Rome aan?
    note: '*Quando* (wanneer) + *arrivi* (jij komt aan, informeel) vraagt naar een aankomst in de toekomst.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: Ik kom donderdagmiddag aan.
    note: '*Arrivo* (ik kom aan) + dag + dagdeel geeft een volledig antwoord op de vraag wanneer je aankomt.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: vandaag, morgen, overmorgen
    note: '*Dopodomani* is één woord voor ''overmorgen'' -- letterlijk *dopo* (na) + *domani* (morgen).'
    example_gloss:
    - Overmorgen is het zaterdag.
  it.a1.unit04.lesson03.teach.ci_vediamo_giovedi:
    title: Ci vediamo giovedì!
    gloss: Tot donderdag!
    note: Een vriendelijke manier om af te sluiten nadat je een dag hebt afgesproken.
