course:
  title: Italiaans A1
  description: 'Italiaans voor beginners om te praten over huisdieren en veelvoorkomende dieren: ze benoemen, basiszorg (uitlaten, voeren, spelen), zeggen van welke dieren je houdt ook als je er geen hebt, en het Italiaanse meervoud.'
