  it.a1.unit43.lesson06.l_uccello_di_nina:
    title: Nina's vogel
teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Animale* is het algemene woord; *animale domestico* betekent huisdier (letterlijk: tam dier).'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Giulia heeft een hond.
    - Luca heeft een kat.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: '*Hai ...?* is de *tu*-vorm van *avere*. Alleen de intonatie maakt van de bewering een vraag.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: 'Om te zeggen dat je iets niet hebt, zet je *non* voor het werkwoord: *non ho*. Zie de grammaticanotitie.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non voor het werkwoord
    gloss: 'Om te zeggen dat je iets niet hebt, zet je non voor het werkwoord: Non ho tempo, Non ho animali domestici.'
    note: 'Na *non ho* staat het zelfstandig naamwoord meestal zonder lidwoord: *non ho tempo*, *non ho animali*. In het Nederlands gebruik je hier ''geen'' of ''niet ... een''.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*Portare a spasso* is een vaste uitdrukking voor het uitlaten van een dier. Het voornaamwoord staat voor het werkwoord: *lo porto a spasso*.'
    example_gloss: Ik laat de hond elke dag uit.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Voornaamwoorden staan voor het werkwoord
    gloss: 'Het voornaamwoord lo vervangt de hond en staat voor het werkwoord: lo porto a spasso, gli do da mangiare.'
    note: 'Nederlands zet het voornaamwoord vóór of achter het werkwoord in de zin (''ik laat hem uit''); in het Italiaans staan *lo* en *gli* vlak voor het vervoegde werkwoord: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: Spelen met
    gloss: spelen met
    example_gloss: Luca speelt met zijn kat.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: '*Ogni giorno* (elke dag) staat aan het einde van de zin, zoals in *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: '*Dare da mangiare* (te eten geven) is letterlijk ''te eten geven''. *Do* is de *io*-vorm van *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Meervoud: il cane -> i cani'
    gloss: 'Het meervoud verandert de laatste klinker en het lidwoord: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: Het regelmatige Italiaanse meervoudspatroon, hier voor het eerst geïntroduceerd met dierennamen als voorbeelden.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Marco houdt van honden.
    - Chiara houdt van katten.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*Amare* (houden van) krijgt direct een lijdend voorwerp: *amo gli animali*. Het meervoud vraagt hier het meervoudslidwoord *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara houdt van katten, maar heeft geen huisdier
    gloss: Chiara houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco vraagt naar een huisdier
    gloss: 'Marco: Heb je een huisdier, Giulia?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia heeft een hond
    gloss: 'Giulia: Ja, ik heb een hond.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco vraagt hoe hij eruitziet
    gloss: 'Marco: Hoe ziet hij eruit?'
    note: '*Com''è?* kan ook voor dieren. Het antwoord gebruikt *è* of *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia beschrijft haar hond
    gloss: 'Giulia: Hij heeft een bruine vacht en is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Dieren zijn mannelijk of vrouwelijk
    gloss: 'Een dier is mannelijk of vrouwelijk, net als een persoon: il cane is lui, la gatta is lei.'
    note: 'Italiaans heeft geen onzijdig ''het'': elk zelfstandig naamwoord is mannelijk of vrouwelijk, dus een hond is *lui* en een kat is *lei*, en de voornaamwoorden volgen (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco vraagt naar het uitlaten
    gloss: 'Marco: Laat je hem elke dag uit?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia beschrijft haar routine
    gloss: 'Giulia: Ja, ik laat hem elke dag uit en ik geef hem te eten.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara en Luca over dieren
    gloss: 'Marco en Chiara houden allebei van dieren, maar geen van beiden heeft een huisdier. Marco houdt van honden en Chiara houdt van katten. Luca heeft wel een huisdier: een kat. Hij speelt vaak met zijn kat en geeft hem elke dag te eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      amano: houden van
      entrambi: beide
      animali: dieren
      due: twee (nessuno dei due = geen van beiden)
      domestico: tam (animale domestico = huisdier)
      cani: honden
      gatti: katten
      gatto: kat
      gioca: speelt
      dà: geeft
      ogni: elke
      mangiare: eten (dare da mangiare = te eten geven)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca speelt vaak met zijn kat
    gloss: Luca speelt vaak met zijn kat.
    note: '*Spesso* (vaak) staat na het werkwoord: *gioca spesso*. *Giocare con* betekent spelen met.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia vraagt het aan Nina
    gloss: 'Giulia: Nina, heb jij ook een huisdier?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*Si chiama Pico* betekent dat hij Pico heet, letterlijk ''hij noemt zichzelf Pico''.'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco reageert
    gloss: 'Marco: Wat leuk! Wat doe je elke dag met hem?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco houdt ook van vogels
    gloss: 'Marco: Ik houd ook van vogels.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia sluit het gesprek af
    gloss: 'Giulia: Wat fijn dat wij alle drie van dieren houden!'
    note: Een afsluitende zin die de dierenfeiten van alle drie de personages samenbrengt.
