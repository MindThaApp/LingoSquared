teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: geld, kaart
    note: '*Soldi* is in het Italiaans meervoud (het Nederlandse ''geld'' is enkelvoud); *carta* is de gewone korte vorm voor een betaalkaart.'
    example_gloss:
    - Ik heb geld.
    - Ik betaal met de kaart.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: contant geld, bonnetje
    note: '*Contanti* is meervoud; *scontrino* is het gewone kassabonnetje.'
    example_gloss:
    - Ik betaal contant.
    - Hier is het bonnetje.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Ik betaal met de kaart.
    note: Gebruik *con la carta* om te zeggen dat je met de kaart betaalt.
    example_gloss:
    - Ik betaal met de kaart in het café.
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: Ik betaal contant.
    note: Gebruik *in contanti* om te zeggen dat je contant betaalt.
    example_gloss:
    - Vandaag betaal ik contant.
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: Kan ik met de kaart betalen?
    note: '*Posso pagare...?* vraagt of een betaalmethode wordt geaccepteerd.'
    example_gloss:
    - Kan ik vandaag met de kaart betalen?
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: Het is tien euro.
    note: Bij prijzen gebruikt het Italiaans vaak het meervoud *sono*.
    example_gloss:
    - Het T-shirt kost tien euro.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Ja, zeker.
    note: Schrijf *Sì* met accent voor 'ja'; *si* zonder accent betekent iets anders.
    example_gloss:
    - Ja, natuurlijk, ik betaal met de kaart.
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: Hier is het bonnetje.
    note: '*Ecco* wijst iets aan: hier is / hier zijn.'
    example_gloss:
    - Dank u, hier is het bonnetje.
