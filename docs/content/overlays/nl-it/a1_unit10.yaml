  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: naar rechts, naar links
    note: '*a destra* (naar rechts) en *a sinistra* (naar links) zijn de twee basisrichtingen om af te slaan.'
    example_gloss:
    - Sla rechtsaf, alstublieft.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: rechtdoor, bij het kruispunt
    note: '*sempre dritto* (rechtdoor) en *all''incrocio* (bij het kruispunt) vertellen hoe en waar je moet afslaan.'
    example_gloss:
    - Ga rechtdoor tot het kruispunt.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: Pardon, hoe kom ik bij het museum?
    note: '*Scusi* (pardon, beleefd) opent de vraag, gevolgd door *come arrivo* (hoe kom ik) plus de bestemming.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: Ga rechtdoor en sla dan bij het kruispunt rechtsaf.
    note: '*Vada* en *giri* zijn beleefde gebiedende wijzen (Lei), de nette manier waarop je een onbekende de weg wijst.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: Is het ver van hier?
    note: '*È lontano* (is het ver) plus *da qui* (van hier) vraagt naar de afstand.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: Nee, het is maar vijf minuten lopen.
    note: '*a piedi* (te voet) geeft aan hoe de afstand wordt gemeten.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: Hartelijk bedankt, erg vriendelijk.
    note: '*molto gentile* (erg vriendelijk) voegt warmte toe nadat je iemand voor hulp bedankt hebt.'
    example_gloss:
