  it.a1.unit10.lesson03.teach.vada_giri_continui:
    title: Vada, giri, continui.
    gloss: Ga, sla af, ga door.
    note: Drie vormen van de beleefde gebiedende wijs (Lei) die vaak samen worden gebruikt om de weg te wijzen.
  it.a1.unit10.lesson03.teach.dove_e_il_museo:
