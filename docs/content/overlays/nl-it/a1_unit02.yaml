course:
  title: Italiaans A1
  description: Leer Italiaans op A1-niveau voor alledaagse begroetingen en korte sociale gesprekjes, met uitgebreide uitleg in het Nederlands.
units:
  it.a1.unit02.origin_nationality_language:
    title: Waar kom je vandaan, nationaliteit en taal
