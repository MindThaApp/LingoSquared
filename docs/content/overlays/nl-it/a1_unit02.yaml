teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: waar vandaan
    note: '*di dove* is de basis om naar iemands herkomst te vragen of die te noemen – het combineert met *sei* (informeel) of *è* (formeel).'
    example_gloss:
    - Sam, waar kom je vandaan?
    - Elena, waar komt u vandaan?
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: Waar komt u vandaan?
    note: De informele vraag, voor een leeftijdsgenoot of vriend, passend bij *tu* uit Unit 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: Waar komt u vandaan? (formeel)
    note: De formele vraag, passend bij *Lei* uit Unit 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Ik ben Amerikaan, uit Chicago.
    note: Noemt nationaliteit en herkomststad tegelijk.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Ik ben Italiaanse, uit Milaan.
    note: '*italiana* is de vrouwelijke vorm van de nationaliteit, gebruikt omdat Elena een vrouw is.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: Amerikaan/Amerikaanse, Italiaan/Italiaanse
    note: 'Italiaanse nationaliteitswoorden veranderen van uitgang naargelang het geslacht van de persoon: *-o* voor een man, *-a* voor een vrouw (*Sam è americano*, *Elena è italiana*).'
    example_gloss:
    - Sam is Amerikaan.
    - Elena is Italiaanse.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: Spreek je Italiaans?
    note: De informele vraag, met de *tu*-vorm van *parlare* (spreken).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: Spreekt u Italiaans?
    note: De formele vraag, met de *Lei*-vorm van *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Ik spreek een beetje Italiaans
    note: Een bescheiden, veelgebruikte manier om je eigen niveau te beschrijven – *un po'* betekent 'een beetje'.
    example_gloss: Ik spreek een beetje Italiaans, ik leer het al een jaar.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Ik spreek Engels.
    note: Dezelfde *parlo*-constructie (ik spreek) met een andere taal.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: Ik leer al een jaar Italiaans.
    note: '*da un anno* betekent ''al een jaar'' en beschrijft een handeling die in het verleden begon en nu nog doorgaat.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: Hoelang leer je al?
    note: '*Da quanto* (sinds hoelang) + de tegenwoordige tijd *studi* (jij studeert, informeel) vraagt hoelang een lopende bezigheid al duurt. Antwoord met hetzelfde patroon: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: Je spreekt goed Italiaans!
    note: Een vriendelijk compliment over iemands taalniveau, met de informele *tu*-vorm.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Wat doet u voor werk?
    note: De informele vraag, met de *tu*-vorm van *fare* (doen).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: Wat voor werk doet u?
    note: De formele vraag, met de *Lei*-vorm van *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Ik ben ingenieur
    note: 'Beroepen krijgen in het Italiaans meestal geen lidwoord, net als in het Nederlands: *sono ingegnere*, niet *sono un ingegnere*.'
    example_gloss: Ik ben ingenieur, ik werk in Milaan.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Ik ben hier voor mijn werk.
    note: '*per lavoro* geeft de reden aan waarom je ergens bent – werk, geen toerisme.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Ik ben hier voor twee jaar.
    note: Dezelfde constructie als *per lavoro*, maar nu met een duur in plaats van een reden.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: Wat leuk, welkom in Milaan!
    note: '*Che bello* is een veelgebruikte, enthousiaste reactie voor ''wat mooi/leuk/fijn''.'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: Heel erg bedankt!
    note: Hetzelfde nadrukkelijke bedankje uit Unit 1, hier als antwoord op een hartelijk welkom.
