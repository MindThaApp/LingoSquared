teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: de voorkeur geven aan, ik geef de voorkeur aan
    note: '*preferire* (de voorkeur geven aan) is een -ire-werkwoord met een tussenvoegsel -isc- in de meeste vormen van de tegenwoordige tijd; *preferisco* is ''ik geef de voorkeur aan''.'
    example_gloss:
    - Ik heb liever thee dan koffie.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: Heb je liever koffie of thee?
    note: '*Preferisci* (jij geeft de voorkeur aan) plus *o* (of) biedt een keuze tussen twee dingen.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: Ik heb liever koffie.
    note: '*Preferisco* (ik geef de voorkeur aan) plus *il caffè* (de koffie) geeft een voorkeur aan.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: Ik vind de croissant erg lekker.
    note: '*Mi piace* (het bevalt me / ik vind het leuk) plus *molto* (veel) drukt een sterke voorliefde uit.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: Ik vind thee 's ochtends niet lekker.
    note: '*Non mi piace* (ik vind het niet leuk) ontkent de constructie met ''bevallen''; *la mattina* betekent ''s ochtends''.'
    example_gloss:
    - Ik vind koffie 's avonds niet lekker.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: En u?
    note: '*E a te?* (en aan jou?) vraagt de ander naar zijn of haar eigen voorkeur.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: Ik ook, ik heb liever koffie!
    note: '*Anch''io* (ik ook) sluit aan bij een voorkeur die iemand net met *preferisco* heeft genoemd. Om het eens te zijn met een uitspraak met *mi piace* zegt het Italiaans *Anche a me*.'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: Ik niet, ik heb liever thee.
    note: '*A me no* (ik niet) spreekt een uitspraak met *mi piace* tegen (het spiegelt de *a me* van de constructie met mi piace), voordat je je eigen voorkeur noemt. Om een uitspraak met *preferisco* tegen te spreken, zegt het Italiaans in plaats daarvan *Io no*.'
    example_gloss:
    - Ik niet, ik heb liever koffie.
