teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: meer, minder
    note: '*più* (meer) en *meno* (minder) zijn de basiswoorden voor de vergrotende trap. Je gebruikt ze voor een bijvoeglijk naamwoord of met *di* om te vergelijken.'
    example_gloss:
    - Ik wil meer koffie en minder thee.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: dan / van
    note: 'Na *più*/*meno* betekent *di* (van) ''dan'' (*più di due euro*). Voor een bepaald lidwoord smelt het samen: *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - De koffie kost meer dan twee euro.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Appels kosten meer dan tomaten.
    note: '*più dei pomodori* gebruikt *di* + *i* (samengetrokken tot *dei*) om te vergelijken met *i pomodori*.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Tomaten kosten minder dan appels.
    note: '*meno delle mele* gebruikt *di* + *le* (samengetrokken tot *delle*) om te vergelijken met *le mele*.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: Welke heb je liever, appels of tomaten?
    note: '*Quale* (welke) vraagt de ander om te kiezen tussen de twee net genoemde dingen.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Ik heb liever appels.
    note: '*Preferisco* (ik heb liever) plus *le mele* (de appels) beantwoordt de vraag met een keuze.'
    example_gloss:
    - Ik heb liever tomaten.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: als / zoals
    note: '*come* (als/zoals) gebruik je met *buono/a* om twee dingen als gelijk te vergelijken.'
    example_gloss:
    - Thee is net zo lekker als koffie.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Appels zijn net zo lekker als tomaten.
    note: '*sono buone* (zijn goed, vrouwelijk meervoud) komt overeen met *le mele*; *come* leidt de vergelijking van gelijkheid in.'
