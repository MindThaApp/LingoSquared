teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: Hoe laat is het?
    note: De standaardmanier om in het Italiaans naar de tijd te vragen; letterlijk 'welke uren zijn het'.
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Het is drie uur.
    note: '*Sono le* + een getal geeft de tijd aan, voor elk uur behalve één uur.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: één uur, twee uur, drie uur, twaalf uur
    note: Alleen één uur gebruikt *è l'una* (enkelvoud) in plaats van *sono le* (meervoud), omdat 'één' enkelvoud is.
    example_gloss:
    - Het is één uur.
    - Het is twaalf uur.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: vier uur, vijf uur, zes uur
    note: Deze volgen hetzelfde patroon *sono le* + getal als bij drie uur.
    example_gloss:
    - Het is vier uur.
    - Het is zes uur.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Het is drie uur dertig.
    note: '*e mezzo* (en een half) telt dertig minuten bij het uur op.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Het is kwart over drie.
    note: '*e un quarto* (en een kwart) telt vijftien minuten bij het uur op.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Het is kwart voor vier.
    note: '*meno un quarto* (min een kwart) telt terug vanaf het VOLGENDE uur, net zoals je in het Nederlands ''kwart voor vier'' zegt.'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: Hoe laat spreken we af?
    note: '*A che ora* vraagt hoe laat iets gebeurt; *ci vediamo* betekent ''we zien elkaar''.'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: We zien elkaar om drie uur dertig.
    note: '*alle* (om) gebruik je bij een precies kloktijdstip, anders dan *sono le*, dat alleen de tijd aangeeft.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: '''s ochtends, ''s middags, ''s avonds'
    note: Hiermee geef je aan op welk deel van de dag een tijd slaat, want een kloktijd van 1 tot 12 geeft dat zelf niet aan.
    example_gloss:
    - Is het een afspraak in de ochtend of in de avond?
    - Het is 's middags, om drie uur dertig.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: Het is 's middags, om drie uur dertig.
    note: Combineert het dagdeel met het precieze kloktijdstip, zodat er geen twijfel over ochtend of middag overblijft.
