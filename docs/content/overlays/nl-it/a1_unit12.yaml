teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: vanavond, morgen
    note: '*stasera* (vanavond) en *domani* (morgen) zijn de twee momenten die je gebruikt om een plan voor te stellen.'
    example_gloss:
    - Ben je vanavond vrij?
  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: goed / oké, laten we gaan
    note: '*va bene* (goed) gebruik je om een voorstel te accepteren; *andiamo* (laten we gaan) is de ''wij''-vorm van *andare* en werkt als uitnodiging.'
    example_gloss:
    - Oké, laten we samen gaan.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: Gaan we vanavond naar de film?
    note: '*Andiamo* als vraag gebruik je om voor te stellen iets samen te doen.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: Oké, laten we gaan!
    note: '*Va bene* accepteert het voorstel, en *andiamo* herhaalt de uitnodiging enthousiast.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: Hoe laat spreken we af?
    note: '*ci vediamo* (we zien elkaar / laten we afspreken) is de wederkerige vorm van *vedersi*.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: We spreken om acht uur af, voor de bioscoop.
    note: '*davanti a* (voor) plus het lidwoord geeft de plek van afspraak aan.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: Perfect, tot vanavond dan!
    note: '*a stasera* (tot vanavond) is een afscheidsgroet die het afgesproken moment noemt.'
    example_gloss:
    - Perfect, tot morgen dan!
  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: Als het vanavond niet uitkomt, gaan we morgen.
    note: '*Se* (als) leidt een alternatief plan in voor het geval het eerste niet lukt.'
  it.a1.unit12.lesson03.teach.domani_va_bene:
    title: Sì, domani va bene.
