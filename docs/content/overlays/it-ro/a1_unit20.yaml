teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Ripasso: Vreau, Un, Ce'
    gloss: Vreau (voglio) · Un (un/uno, masch./neutro) · Ce (che cosa / che)
    note: '*Vreau* (voglio), *un* (un/uno) e *ce* (che cosa, come in *Ce mai faceți?*) sono parole che conosci già: qui le riutilizzi per chiedere un capo di abbigliamento.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: Maglietta
    gloss: maglietta
    note: 'Un sostantivo neutro: vuole lo stesso *un* (non *o*) degli altri sostantivi neutri e maschili già visti, come *un leu*.'
    example_gloss:
    - Voglio una maglietta.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Colore
    gloss: colore
    note: Un sostantivo femminile, utile per chiedere in che colore è disponibile qualcosa.
    example_gloss:
    - Di che colore?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Rosso
    gloss: rosso
    note: 'Si mette dopo il sostantivo a cui si riferisce, come di norma per gli aggettivi rumeni: *tricou roșu*, letteralmente «maglietta rossa».'
    example_gloss:
    - Voglio una maglietta rossa.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Blu
    gloss: blu
    note: 'Stesso schema di *roșu*: va dopo il sostantivo, *tricou albastru*.'
    example_gloss:
    - Voglio una maglietta blu.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Voglio una maglietta rossa.
    gloss: voglio una maglietta rossa
    note: 'La richiesta di base: *vreau* (voglio) + *un tricou* (una maglietta) + *roșu* (rosso), con il colore dopo il sostantivo.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Ripasso: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (Quanto costa?) · Vă rog (per favore, formale)
    note: '*Cât costă?* viene dalla lezione sul mercato; *vă rog* è il «per favore» formale: qui lo riutilizzi per chiedere il prezzo di un capo e addolcire la richiesta.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Ripasso: Mic, Mică, Mare'
    gloss: Mic/Mică (piccolo/piccola, masch.-neutro/femm.) · Mare (grande, stessa forma per masch. e femm. singolare)
    note: 'Le parole per le dimensioni che conosci già dal confronto tra cibi e bevande: qui le riutilizzi per le taglie dei vestiti.'
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Pantaloni
    gloss: pantaloni
    note: 'In rumeno si usa normalmente al plurale, proprio come in italiano *pantaloni*: indica un solo paio di pantaloni.'
    example_gloss:
    - Voglio dei pantaloni.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Taglia
    gloss: taglia
    note: 'Un sostantivo femminile: si accompagna al femminile *mică* (piccola), già ripassato sopra, e a *mare* (grande), che non cambia.'
    example_gloss:
    - Che taglia?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: Che taglia?
    gloss: Che taglia?
    note: 'La domanda tipica al banco di un negozio: breve e senza verbo, della stessa forma ellittica di *Ce culoare?* (Di che colore?).'
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Taglia piccola, per favore.
    gloss: taglia piccola, per favore
    note: '*Mică* è la forma femminile di *mic* e concorda con il femminile *mărime*; con il già ripassato *vă rog* indichi la tua taglia in modo cortese.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: Quanto costano i pantaloni?
    gloss: Quanto costano i pantaloni?
    note: '*Pantalonii* è la forma determinata di *pantaloni* («i pantaloni»): i sostantivi maschili plurali aggiungono *-i* per l''articolo (*pantaloni* → *pantalonii*). Si combina con il già ripassato *cât costă*.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Ripasso: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (ciao) · Mulțumesc (grazie) · Bine (bene) · La revedere (arrivederci) · Și (e)
    note: Saluti di tutti i giorni più *și* (e), riutilizzati qui per aprire e chiudere il dialogo al negozio.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Ripasso: Zece, Douăzeci, De, Lei'
    gloss: Zece (dieci) · Douăzeci (venti) · De (di, usato prima di lei da 20 in su) · Lei (la valuta, plurale di leu)
    note: 'I numeri e la valuta *leu/lei* che conosci già: qui li riutilizzi per i prezzi della maglietta e dei pantaloni.'
  ro.a1.unit20.lesson03.teach.line01:
    title: Salutare Mihai e chiedere una maglietta rossa
    gloss: Ana saluta Mihai e dice che vuole una maglietta rossa.
    note: 'La frase di richiesta della prima lezione: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Chiedere la taglia
    gloss: Mihai chiede che taglia vuole.
    note: La domanda tipica del negozio *Ce mărime?* (Che taglia?).
  ro.a1.unit20.lesson03.teach.line03:
    title: Dire la taglia, con cortesia, e chiedere il prezzo
    gloss: Ana chiede una taglia piccola, poi chiede quanto costa.
    note: '*Mărime mică, vă rog* (taglia piccola, per favore), poi *Cât costă?* (Quanto costa?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Dire il prezzo
    gloss: Mihai dice che costa cinquanta lei.
    note: Usa il già ripassato *cincizeci de lei*.
  ro.a1.unit20.lesson03.teach.line05:
    title: Accettare e chiedere anche dei pantaloni
    gloss: Ana accetta, poi dice che vuole anche dei pantaloni e ne chiede il prezzo.
    note: 'Qui *și* significa «anche»: *Vreau și pantaloni*, cioè «voglio anche dei pantaloni».'
  ro.a1.unit20.lesson03.teach.line06:
    title: Dire il prezzo dei pantaloni
    gloss: Mihai dice che i pantaloni costano centoventi lei.
    note: 'Dal venti in su il rumeno mette *de* tra il numero e il sostantivo: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Ringraziare Mihai e salutare
    gloss: Ana lo ringrazia e lo saluta.
    note: Un ringraziamento e un saluto cortesi.
  ro.a1.unit20.lesson03.teach.line08:
    title: Salutare
    gloss: Mihai saluta.
    note: Un semplice saluto, con l'aggiunta del nome di Ana.
