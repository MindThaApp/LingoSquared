answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tricou, culoare, roșu, albastru, pantaloni, mărime) is used only in invariant or elliptical constructions ("Vreau un tricou roșu," "Ce mărime?," "Mărime mică, vă rog," "Pantalonii costă o sută douăzeci de lei") with no register distinction of its own. No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other (reused "vă rog," not "te rog").
course:
  title: Rumeno A1
  description: Riconoscere e comprare capi di abbigliamento in rumeno -- Tricou (maglietta), Culoare (colore), Roșu (rosso), Albastru (blu), Pantaloni (pantaloni) e Mărime (taglia) -- mentre Ana chiede a Mihai una maglietta rossa e un paio di pantaloni al banco di un negozio.
units:
  ro.a1.unit20.clothing:
    title: L'abbigliamento
