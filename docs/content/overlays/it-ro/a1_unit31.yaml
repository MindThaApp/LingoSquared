answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumeno A1
  description: 'Rumeno per principianti per descrivere l''aspetto fisico di base di una persona: impressioni su altezza ed età, colore di capelli e occhi, la domanda fondamentale Cum arată ...? e il confronto tra l''aspetto di due persone.'
units:
  ro.a1.unit31.aspect:
    title: Descrivere l'aspetto
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Alto, basso, anziano e giovane
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Descrivere i capelli
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Gli occhi e «Com'è?»
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana descrive Nina
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Confrontiamo Andrei ed Elena
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai riconosce Nina
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Alto e basso
    gloss: alto / basso
    note: '*Înalt* descrive una persona alta e *scund* una persona bassa. Entrambi hanno le forme femminili: *înaltă*, *scundă*.'
    example_gloss:
    - Elena è alta.
    - Andrei è basso.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: '*Bătrân* e *tânăr* qui descrivono un''impressione generale dell''età, non un numero esatto di anni. Forme femminili: *bătrână*, *tânără*.'
    example_gloss:
    - Il nonno è anziano.
    - Mihai è giovane.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: un''impressione o un numero'
    gloss: Per l'età esatta chiedi Câți ani ai?, mentre bătrân dà un'impressione generale, come in Bunicul este bătrân.
    note: Puoi chiedere l'età esatta con *Câți ani ai?* Qui *bătrân* descrive quanto qualcuno SEMBRA anziano, senza alcun numero.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena è alta e Andrei è basso
    gloss: Elena è alta e Andrei è basso.
    note: 'Una semplice frase composta con *și* (e), che prepara il confronto diretto della lezione 5; l''aggettivo si accorda con il soggetto: *înaltă* per Elena, *scund* per Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: I capelli
    gloss: i capelli
    note: '*Păr* è un sostantivo maschile; l''articolo si attacca alla fine: *părul* (i capelli).'
    example_gloss: Mihai ha i capelli corti e neri.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: Tre colori di capelli. Seguono il sostantivo *păr* (maschile), quindi si dice *părul blond*, *păr maro*, *păr cărunt*.
    example_gloss:
    - Ana ha i capelli biondi.
    - Andrei ha i capelli castani.
    - Il nonno ha i capelli grigi.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*Lung* (lungo) e *scurt* (corto) descrivono la lunghezza dei capelli; come i colori, vanno dopo il sostantivo.'
    example_gloss:
    - Elena ha i capelli lunghi.
    - Andrei ha i capelli corti.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: L'aggettivo segue il nome
    gloss: 'L''aggettivo viene dopo il sostantivo: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: In rumeno l'aggettivo viene DOPO il sostantivo (*păr scurt*), mentre in italiano la posizione è spesso simile ("capelli corti"), ma in rumeno è la regola generale.
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: Il suo e il suo vengono dopo il sostantivo
    gloss: 'Il possessivo viene dopo il sostantivo: părul ei (i suoi capelli, di lei), ochii lui (i suoi occhi, di lui).'
    note: '*Ei* significa "di lei" e *lui* significa "di lui"; entrambi vanno dopo il sostantivo: *părul ei*. Il contesto mostra a chi ci si riferisce.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai ha i capelli corti e neri
    gloss: Mihai ha i capelli corti e neri.
    note: '*Negru* (nero) è un aggettivo di colore; viene dopo il sostantivo: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana ha i capelli lunghi e biondi
    gloss: Ana ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Gli occhi
    gloss: gli occhi
    note: '*Ochi* (occhio/occhi) è uguale al singolare e al plurale; è l''articolo a indicare il numero: *ochiul* (l''occhio), *ochii* (gli occhi).'
    example_gloss: Mihai ha gli occhi castani.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: '*Albastru* (azzurro/blu), *maro* (marrone) e *verde* (verde) sono aggettivi di colore. *Maro* non cambia mai; al plurale *albastru* diventa *albaștri* e *verde* diventa *verzi*.'
    example_gloss:
    - Ana ha gli occhi azzurri.
    - Andrei ha gli occhi castani.
    - Elena ha gli occhi verdi.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Aggettivi al plurale
    gloss: 'Al plurale l''aggettivo cambia: ochi albaștri, ochi maro, ochi verzi.'
    note: Con *ochi* al plurale l'aggettivo prende la forma plurale (*albaștri*, *verzi*); *maro* resta uguale. Confronta il singolare *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Che aspetto ha Ana?
    gloss: Che aspetto ha Ana?
    note: '*Cum arată ...?* è la domanda centrale di questa unità; usala per chiedere l''aspetto di chiunque.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Ana ha i capelli lunghi e biondi e gli occhi azzurri.
    note: Una risposta modello che unisce capelli e occhi in un'unica frase con *și*.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana presenta Nina
    gloss: 'Ana: Arriva una ragazza nuova al caffè delle lingue straniere. Si chiama Nina.'
    note: '*Vine o fată nouă* ("arriva una ragazza nuova") introduce una persona nuova; *O cheamă Nina* ne dice il nome.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai chiede che aspetto abbia
    gloss: 'Mihai: Bene! Che aspetto ha?'
    note: 'Riprende la domanda centrale di questa unità senza il nome: *Cum arată?* (la persona è chiara dal contesto).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana descrive l'altezza e i capelli di Nina
    gloss: 'Ana: È bassa e ha i capelli corti e biondi.'
    note: Unisce *scundă* della lezione 1 con il lessico dei capelli della lezione 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai chiede degli occhi
    gloss: 'Mihai: E i suoi occhi?'
    note: '*Și ochii?* ("E gli occhi?") è una breve domanda di seguito; la persona si capisce dal contesto.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana descrive gli occhi di Nina
    gloss: 'Ana: Ha gli occhi verdi.'
    note: Riprende *ochi verzi* della lezione 3.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai la riconoscerà
    gloss: 'Mihai: Grazie! Allora la riconosco di sicuro.'
    note: '*O recunosc* significa "la riconosco": *o* è il pronome complemento "la" e va prima del verbo.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Confrontiamo Andrei ed Elena
    gloss: Andrei ed Elena sono fratello e sorella, ma hanno un aspetto diverso. Andrei è basso, ha i capelli corti e castani e gli occhi castani. Elena è più alta di Andrei, ha i capelli lunghi e castani e gli occhi verdi. E tu, che aspetto hai?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      frate: fratello
      soră: sorella
      arată: essere (di aspetto)
      diferit: diverso
      scund: basso
      scurt: basso
      maro: castano
      părul: i capelli
      ochi: gli occhi
      înaltă: più alto
      lung: lungo
      verzi: verde
      arăți: avere un aspetto (come sei fisicamente)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Il confronto con mai ... decât
    gloss: 'Il comparativo si forma con mai + aggettivo + decât: Elena este mai înaltă decât Andrei.'
    note: 'Il rumeno mette *mai* ("più") prima dell''aggettivo e *decât* ("di", "che") prima del secondo termine di paragone: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena ha i capelli più lunghi di Andrei
    gloss: Elena ha i capelli più lunghi di Andrei.
    note: '*Mai lung* funziona allo stesso modo prima di *decât*: *părul mai lung decât Andrei*; l''aggettivo segue comunque *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: Una frase modello in prima persona con *Am ...*, da riutilizzare quando descrivi il tuo aspetto.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai nota Nina
    gloss: 'Mihai: Guarda, è Nina quella? Ha i capelli corti e biondi e gli occhi verdi.'
    note: '*Uite* (guarda) attira l''attenzione su qualcosa; *ea e Nina?* chiede "è Nina quella?".'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana conferma
    gloss: 'Ana: Sì, è Nina!'
    note: Una conferma breve e naturale.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina saluta Mihai
    gloss: 'Nina: Ciao, sei Mihai?'
    note: 'Una semplice domanda di saluto informale: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai saluta Nina a sua volta
    gloss: 'Mihai: Sì! Piacere di conoscerti, Nina.'
    note: '*Mă bucur să te cunosc* ("sono contento di conoscerti") è la formula abituale per un primo incontro.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Mihai ha riconosciuto Nina grazie alla descrizione di Ana.'
