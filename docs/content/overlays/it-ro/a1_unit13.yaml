teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Ripasso: cafea, ceai, pâine'
    gloss: cafea (caffè) · ceai (tè) · pâine (pane)
    note: 'Parole già viste nell''Unità 6: qui si combinano con le nuove strutture di questa unità per dire cosa piace e cosa no.'
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: mi piace
    gloss: Îmi place (mi piace)
    note: 'Alla lettera: «a me piace» -- *îmi* (a me) più *place* (piace), che non cambia. Come in italiano, per parlare di ciò che ci piace in generale il rumeno usa la forma determinata del nome (*cafeaua*, non il semplice *cafea* già noto dall''Unità 6): «mi piace il caffè».'
    example_gloss:
    - Mi piace il caffè.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: Mi piace il caffè
    gloss: Îmi place cafeaua. (Mi piace il caffè.)
    note: 'La struttura completa: Îmi place + il nome nella forma determinata.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: Mi piace il tè
    gloss: Îmi place ceaiul. (Mi piace il tè.)
    note: 'Stessa struttura di *Îmi place cafeaua*, con un''altra bevanda: *ceaiul* è la forma determinata di *ceai*, già noto dall''Unità 6.'
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: non mi piace
    gloss: Nu-mi place (non mi piace)
    note: 'La negazione di *Îmi place*: nel parlare quotidiano il rumeno contrae *nu îmi* in *nu-mi*, quindi questa forma con il trattino è quella naturale, non una semplice scorciatoia.'
    example_gloss:
    - Non mi piace il pane.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: Non mi piace il pane
    gloss: Nu-mi place pâinea. (Non mi piace il pane.)
    note: '*Pâinea* è la forma determinata di *pâine*, già nota dall''Unità 6, con lo stesso schema di *cafeaua*/*ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Ripasso: Îmi place, Nu-mi place'
    gloss: Îmi place (mi piace) · Nu-mi place (non mi piace)
    note: 'Entrambe dalla prima lezione di questa unità: qui si aggiunge la forma interrogativa.'
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Ripasso: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (il caffè) · ceaiul (il tè) · pâinea (il pane)
    note: 'Tutte dalla prima lezione di questa unità: qui si riutilizzano nelle forme di domanda e di preferenza.'
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: Le piace...?
    gloss: Vă place...? (Le piace...?)
    note: 'La forma interrogativa di cortesia di *Îmi place*: *vă* (a Lei, forma di cortesia) sostituisce *îmi* (a me), con lo stesso registro di *dumneavoastră* già usato in *aveți*/*faceți*. Dopo si aggiunge un nome determinato, oppure si usa da solo quando l''argomento è già chiaro.'
    example_gloss:
    - Le piace il caffè?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: Le piace il caffè?
    gloss: Vă place cafeaua? (Le piace il caffè?)
    note: 'La struttura completa: Vă place + il nome determinato, con l''intonazione ascendente della domanda.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: preferisco
    gloss: Prefer (preferisco)
    note: 'Un verbo molto simile all''italiano: non serve la costruzione «a me», *prefer* funziona come un verbo normale. Si usa *Prefer* + ciò che si preferisce, nella forma determinata come con *Îmi place*.'
    example_gloss:
    - Preferisco il caffè.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Preferisco il caffè
    gloss: Prefer cafeaua. (Preferisco il caffè.)
    note: Un'affermazione più forte di *Îmi place cafeaua*, utile quando si sceglie tra due cose.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: o
    gloss: Sau (o)
    note: Collega due opzioni quando si offre o si chiede una scelta; diverso da *și* (e) delle Unità 10 e 12, che unisce due cose vere insieme.
    example_gloss:
    - Caffè o tè?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: Caffè o tè?
    gloss: Cafea sau ceai? (Caffè o tè?)
    note: 'Un modo breve e naturale per offrire una scelta: qui si usano le forme semplici (*cafea*, *ceai*) e non quelle determinate *cafeaua*/*ceaiul*, perché è un''offerta aperta e non un''affermazione generale sul caffè o sul tè.'
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Ripasso: Vă place, Prefer, Sau'
    gloss: Vă place? (Le piace?) · Prefer (preferisco) · Sau (o)
    note: 'Tutte dalla seconda lezione di questa unità: qui Ana e Mihai le usano insieme.'
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Ripasso: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (mi piace) · Nu-mi place (non mi piace) · cafeaua (il caffè) · ceaiul (il tè) · pâinea (il pane)
    note: 'Tutte dalla prima lezione di questa unità: qui Ana e Mihai dicono cosa piace e cosa non piace a ciascuno.'
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Ripasso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: 'Tutte già viste nelle unità precedenti: lo stesso schema cordiale di apertura e chiusura di ogni dialogo del corso.'
  ro.a1.unit13.lesson03.teach.line01:
    title: Salutare e chiedere di caffè o tè
    gloss: Mihai saluta Ana e le chiede se le piace il caffè o il tè.
    note: Unisce *Vă place...?* di questa unità con *sau* per proporre entrambe le opzioni in una sola domanda.
  ro.a1.unit13.lesson03.teach.line02:
    title: Esprimere una preferenza e un gusto negativo
    gloss: Ana dice che preferisce il caffè e che il tè non le piace.
    note: 'Unisce *Prefer* e *Nu-mi place*: la sua preferenza per il caffè coincide con quanto già visto per lei nelle Unità 6 e 12.'
  ro.a1.unit13.lesson03.teach.line03:
    title: Dire la preferenza opposta
    gloss: Mihai dice che gli piace il tè e che il caffè non gli piace.
    note: Coincide con quanto già visto per Mihai nelle Unità 6 e 12 (ceai, mai cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Chiedere anche del pane
    gloss: Ana chiede a Mihai se gli piace anche il pane.
    note: Si apre con la breve domanda *Și pâinea?* (E il pane?), poi chiede per esteso con *Vă place...?* su un argomento nuovo, *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Confermare, ringraziare e salutare
    gloss: Mihai dice di sì, che gli piace il pane, ringrazia Ana e la saluta.
    note: 'Coincide con quanto già visto per Mihai nell''Unità 6 (pâine): è la stessa chiusura con cui terminano i dialoghi delle unità precedenti.'
  ro.a1.unit13.lesson03.teach.line06:
    title: Chiudere la conversazione
    gloss: Ana ricambia il saluto, usando il nome di Mihai.
    note: Lo stesso schema cordiale di chiusura con cui terminano i dialoghi delle unità precedenti.
