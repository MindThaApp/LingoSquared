answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: Rumeno A1
  description: Chiedere e seguire semplici indicazioni stradali in rumeno -- Cum pot să ajung...? (Come posso arrivare a...?), Mergeți înainte (vada dritto), la dreapta / la stânga (a destra / a sinistra) e aici / acolo (qui / lì) -- con Ana e Mihai, mentre Ana chiede a Mihai come arrivare alla stazione.
units:
  ro.a1.unit09.directions:
    title: Indicazioni stradali
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: Come posso arrivare a...?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: A destra, a sinistra
  ro.a1.unit09.lesson03.pe_strada:
    title: In strada
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Ripasso: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (dove) · este (è) · gară (stazione) · magazin (negozio) · bancă (banca) · aproape (vicino)
    note: Tutte parole già viste -- unde dall'Unità 7, este dall'Unità 3/4, gară/magazin/bancă/aproape dall'Unità 8 -- qui si combinano nelle domande e negli esempi sulle indicazioni.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: Come posso arrivare a...?
    gloss: Cum pot să ajung...? (Come posso arrivare a...?)
    note: Il modo più comune per chiedere come raggiungere un luogo -- *pot* (posso) era già comparso nell'Unità 7 in *Unde pot să cumpăr...?*; *ajung* (arrivo) è nuovo.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Vada
    gloss: Mergeți (vada / andate -- imperativo di cortesia)
    note: '*Mergeți* è l''imperativo del registro di cortesia (dumneavoastră), il modo educato di dire a qualcuno di andare, in linea con il modo in cui Ana e Mihai già si parlano.'
    example_gloss:
    - Vada dritto.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Dritto
    gloss: înainte (dritto)
    note: Si abbina a *Mergeți* per dare l'indicazione più semplice possibile.
    example_gloss:
    - Vada dritto.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Andare dritto
    gloss: Mergeți înainte. (Vada dritto.)
    note: Un'indicazione breve e completa -- la risposta più semplice a *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: Come posso arrivare alla stazione?
    gloss: Cum pot să ajung la gară? (Come posso arrivare alla stazione?)
    note: 'Unisce *Cum pot să ajung...?* e *gară* in un''unica domanda completa -- *la* (a) collega la domanda alla destinazione. Dopo *la* il nome resta nella forma semplice: *la gară*, non *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: Come posso arrivare alla banca?
    gloss: Cum pot să ajung la bancă? (Come posso arrivare alla banca?)
    note: Stesso schema, ora con la banca -- una domanda naturale, dato che nell'Unità 8 si è visto che la banca è lontana.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: A destra, a sinistra
    gloss: la dreapta (a destra) · la stânga (a sinistra)
    note: 'Le due svolte fondamentali -- impara ciascuna come coppia fissa con *la* (a): *la dreapta*, *la stânga*.'
    example_gloss:
    - Vada a destra.
    - Vada a sinistra.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Vada a destra
    gloss: Mergeți la dreapta. (Vada a destra.)
    note: Lo stesso comando *Mergeți* di *Mergeți înainte.*, ora con una svolta invece di dritto.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Vada a sinistra
    gloss: Mergeți la stânga. (Vada a sinistra.)
    note: La svolta opposta -- stesso schema semplice.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Qui, lì
    gloss: aici (qui) · acolo (lì)
    note: Un modo semplice per indicare dove si trova qualcosa quando sei arrivato o lo vedi, diverso da aproape/departe dell'Unità 8 (che descrivono la distanza, non la posizione).
    example_gloss:
    - Il negozio è qui.
    - La stazione è laggiù.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: Il negozio è qui
    gloss: Magazinul este aici. (Il negozio è qui.)
    note: Un'affermazione breve e completa -- *aici* indica qualcosa proprio dove ti trovi.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: La stazione è laggiù
    gloss: Gara este acolo. (La stazione è laggiù.)
    note: '*Acolo* indica qualcosa di visibile, ma non proprio dove ti trovi: è il modo naturale per concludere una serie di indicazioni.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Ripasso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · da (sì) · Ana, Mihai (nomi)
    note: 'Tutte parole già viste nelle unità precedenti: qui Ana chiede a Mihai delle indicazioni stradali.'
  ro.a1.unit09.lesson03.teach.apoi:
    title: Poi
    gloss: apoi (poi / dopo)
    note: 'Unisce due passaggi di un percorso in un''unica indicazione: è il modo naturale per dare più di un''istruzione alla volta.'
    example_gloss:
    - Vada dritto, poi a destra.
  ro.a1.unit09.lesson03.teach.line01:
    title: Salutare e chiedere come arrivare alla stazione
    gloss: Ana saluta Mihai e gli chiede come arrivare alla stazione.
    note: Unisce l'espressione *Cum pot să ajung* di questa unità al saluto dell'Unità 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Dare due indicazioni di seguito
    gloss: Mihai dice di andare dritto e poi a destra.
    note: Riprende *Mergeți înainte* e *la dreapta* di questa unità, uniti da *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Chiedere se è vicino
    gloss: Ana chiede se la stazione è vicina.
    note: Una breve domanda di seguito che riprende *este* e *aproape* dell'Unità 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Confermare e indicare il posto
    gloss: Mihai conferma che è vicino e indica che la stazione è là.
    note: Unisce *aproape* e *acolo* (distanza e posizione) in un'unica frase.
  ro.a1.unit09.lesson03.teach.line05:
    title: Ringraziare e congedarsi
    gloss: Ana ringrazia Mihai e lo saluta.
    note: Lo stesso ringraziamento finale dei dialoghi delle Unità 1 e 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Concludere l'incontro
    gloss: Mihai ricambia il saluto, usando il nome di Ana.
    note: Lo stesso cordiale modo di congedarsi con cui terminavano i dialoghi delle Unità 1, 5, 6, 7 e 8.
