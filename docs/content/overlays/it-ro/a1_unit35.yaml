    title: Le desinenze del verbo cambiano con la persona
    gloss: '*A căuta* (cercare) cambia secondo la persona: *eu caut*, *tu cauți*. Anche *a folosi* funziona così: *eu folosesc*, *tu folosești*.'
    note: La desinenza indica chi compie l'azione, perciò in rumeno spesso si omettono *eu* e *tu*, come in italiano.
