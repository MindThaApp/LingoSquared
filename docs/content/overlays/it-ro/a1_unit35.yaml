    gloss: 'Mihai: Sì, e sabato c''è il sole!'
  ro.a1.unit35.lesson06.teach.andrei_atunci_alerg:
    title: Il programma di Andrei
    gloss: 'Andrei: Allora corro. Dopo gioco anche a calcio.'
    note: '*După aceea* significa dopo; *joc* è la forma di *eu* di *a juca* (giocare).'
  ro.a1.unit35.lesson06.teach.elena_eu_prefer:
    title: Il programma di Elena
    gloss: 'Elena: Io preferisco nuotare, ma vengo anch''io al parco.'
    note: '*Prefer să înot* significa preferisco nuotare: *a prefera* + *să* + verbo.'
  ro.a1.unit35.lesson06.teach.ana_super_ne:
