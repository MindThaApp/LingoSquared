    gloss: 'Conosci già *La revedere!* Puoi anche nominare un giorno: *Ne vedem sâmbătă!*, *Ne vedem mâine!*'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  ro.a1.unit35.lesson05.teach.ana_il_suna:
    title: Chi usa cosa?
    gloss: Ana telefona a Mihai ogni giorno. Usa il telefono, non un'app. Mihai non ha un computer a casa, ma usa internet sul telefono. Andrei cerca ogni mattina le previsioni del tempo. Poi va a correre. Elena manda spesso un messaggio ad Ana. Anche tu usi il telefono ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
