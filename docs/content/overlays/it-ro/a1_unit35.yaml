    title: 'Nomi neutri: *mesaj*'
    gloss: '*Mesaj* è un nome neutro: *un mesaj* (uno), *două mesaje* (due). L''articolo determinativo si mette alla fine: *mesajul*.'
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
