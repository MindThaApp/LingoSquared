teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Chiedere il prezzo totale
    gloss: Quanto costa in totale?
    note: '*În total* (in totale) chiarisce che vuoi il prezzo complessivo, non quello di un singolo articolo; *Cât costă?* chiede «quanto costa?».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Dire il prezzo totale
    gloss: Costa cento lei in totale.
    note: '*Costă* è la forma di terza persona singolare di *a costa* (costare). Dopo un numero superiore a 19, il rumeno aggiunge *de* davanti al sostantivo: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Pagare con la carta o in contanti
    gloss: pagare con la carta, pagare in contanti
    note: '*A plăti cu cardul* significa pagare con la carta e *a plăti în numerar* significa pagare in contanti; *cu* significa «con» e *în* significa «in».'
    example_gloss:
    - Posso pagare con la carta qui?
    - Pago in contanti.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Chiedere se si può pagare con la carta
    gloss: Posso pagare con la carta qui?
    note: '*Pot plăti* (posso pagare) è *a putea* + un verbo; *aici* (qui) colloca la domanda nel luogo in cui ti trovi.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Chiedere come si preferisce pagare
    gloss: Preferisce pagare in contanti o con la carta?
    note: '*Doriți să plătiți ...?* è la forma di cortesia (*dumneavoastră*) usata da un cassiere sconosciuto; con un amico diresti *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: Il conto
    gloss: il conto
    note: 'Un sostantivo femminile: *o notă*, *nota* (l''articolo si attacca alla fine).'
    example_gloss: Dividiamo il conto?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Proporre di dividere il conto
    gloss: Dividiamo il conto?
    note: '*Hai să* + un verbo propone di fare qualcosa insieme.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Chiedere di pagare separatamente
    gloss: Posso pagare separatamente?
    note: '*Separat* (separatamente) va dopo *a plăti*; *Pot plăti separat?* è la richiesta abituale quando ognuno paga la propria parte.'
  ro.a1.unit29.lesson04.teach.restul:
    title: Il resto
    gloss: il resto
    note: '*Restul* significa letteralmente «il resto», ed è così che il rumeno chiama i soldi che ti restituiscono; l''articolo si attacca alla fine.'
    example_gloss: Ecco il suo resto.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Dare il resto
    gloss: Ecco il suo resto.
    note: '*Poftiți* è la forma di cortesia (*dumneavoastră*) che significa «ecco a lei», in linea con il registro formale alla cassa.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Rifiutare il resto
    gloss: Non mi serve il resto.
    note: '*A avea nevoie de* (aver bisogno di) richiede *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Trentacinque
    gloss: trentacinque
    note: 'Il rumeno forma i numeri da 21 a 99 con *și*: *treizeci și cinci* (letteralmente «trenta e cinque»), e aggiunge *de* davanti al sostantivo: *o sută treizeci și cinci de lei*.'
    example_gloss: Costa centotrentacinque lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Leggere un conto del ristorante
    gloss: 'Conto: due secondi piatti e due caffè. Totale: centotrentacinque lei. Pagato con la carta.'
    note: Individua che cosa è stato ordinato, il totale e come è stato pagato.
    glosses:
      Nota: conto
      două: due
      feluri: piatti principali
      cafele: caffè
      Total: totale
      '135': centotrentacinque
      lei: lei
      Plătit: pagato
      cardul: carta
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana chiede il conto
    gloss: 'Ana: Chiediamo il conto?'
    note: '*A cere* (chiedere) ha *nota* come complemento oggetto; *Hai să cerem nota?* propone di chiederlo insieme.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai chiede il totale
    gloss: 'Mihai: Sì, buona idea. Quanto costa in totale?'
    note: Riprende la domanda *Cât costă în total?* della lezione 1.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana dice il totale
    gloss: 'Ana: Sono centotrentacinque lei. Dividiamo?'
    note: '*Împărțim* è la forma di *noi* di *a împărți* (dividere); *nota* è sottintesa dal contesto.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai insiste per pagare
    gloss: 'Mihai: No, lascia che paghi io oggi. Mi hai aiutato tanto.'
    note: '*Lasă-mă să* ... (lascia che io ...) è il modo standard per offrirsi di fare qualcosa; *m-ai ajutat* («mi hai aiutato») è una forma del passato.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana è commossa
    gloss: 'Ana: Che gentile da parte tua! Grazie mille.'
    note: '*Ce drăguț din partea ta!* (che gentile da parte tua) è un complimento caloroso e comune per un gesto generoso.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai chiede se può pagare con la carta
    gloss: 'Mihai: Posso pagare con la carta qui?'
    note: Riprende la domanda *Pot plăti cu cardul aici?* della lezione 2, ora nel ristorante vero e proprio.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: la forma di lui/lei'
    gloss: Mihai paga il conto.
    note: '*Plătește* è la forma di lui/lei di *a plăti* (pagare).'
