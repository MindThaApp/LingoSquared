answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Rumeno A1
  description: 'Ordinare cibo e bevande in rumeno: caffè, tè, pane e altro, con la formula centrale «Aș dori ...» (Vorrei ...) e la coppia di cortesia vă rog/te rog. Ana e Mihai continuano la loro storia incontrandosi in un caffè.'
units:
  ro.a1.unit06.food:
    title: Cibo e bevande
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Bevande
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: Per favore, e il cibo
  ro.a1.unit06.lesson03.la_cafenea:
    title: Al bar
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Ripasso: un, o, și'
    gloss: un/o (un, una) · și (e)
    note: 'Tutte e tre sono già comparse nelle unità precedenti (*și* nell''Unità 1, *o* nell''Unità 2, *un* nell''Unità 4): qui tornano per parlare di cibo e bevande.'
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Vorrei ...
    gloss: Aș dori ... (Vorrei ...)
    note: 'Il modo educato di ordinare qualcosa in rumeno: è una forma di condizionale fissa e non cambia in base a ciò che segue.'
  ro.a1.unit06.lesson01.teach.apa:
    title: L'acqua
    gloss: apă (acqua)
    note: 'Nome femminile: senza articolo quando la quantità non è specificata, come in italiano «vorrei acqua».'
    example_gloss: Vorrei dell'acqua.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Caffè
    gloss: cafea (caffè)
    note: 'Femminile: si combina con *o* («una») come qualsiasi altro nome femminile.'
    example_gloss: Vorrei un caffè.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Tè
    gloss: ceai (tè)
    note: 'Si combina con *un* («un»), non con *o*: ceai è un nome maschile/neutro.'
    example_gloss: Vorrei un tè.
  ro.a1.unit06.lesson01.teach.suc:
    title: Succo
    gloss: suc (succo)
    note: Anche questo vuole *un*, come ceai.
    example_gloss: Vorrei un succo.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Latte
    gloss: lapte (latte)
    note: Come apă, di solito si dice senza articolo quando la quantità non è specificata.
    example_gloss: Vorrei del latte.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: ho sete
    gloss: Mi-e sete (ho sete)
    note: 'Un''espressione fissa: alla lettera è più vicina a «mi è sete» che a «sono assetato».'
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Vorrei un caffè
    gloss: Vorrei un caffè.
    note: Unisce la formula di ordinazione e un nome femminile di bevanda in una frase completa.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Ripasso: mulțumesc, bine, da, nu'
    gloss: mulțumesc (grazie) · bine (bene) · da (sì) · nu (no)
    note: '*Mulțumesc* e *bine* sono comparsi nei saluti dell''Unità 1, *da* e *nu* nell''Unità 3 e nell''Unità 5: qui tornano in contesti di cibo e cortesia.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: ho fame
    gloss: Mi-e foame (ho fame)
    note: Lo stesso schema fisso di *Mi-e sete*, con foame (fame) al posto di sete (sete).
  ro.a1.unit06.lesson02.teach.paine:
    title: Pane
    gloss: pâine (pane)
    note: Di solito si dice senza articolo, come in italiano «vorrei pane».
    example_gloss: Ho fame. Vorrei del pane.
  ro.a1.unit06.lesson02.teach.mancare:
    title: Il cibo
    gloss: mâncare (cibo)
    note: La parola generale per «cibo», non un piatto specifico.
    example_gloss: Vorrei del cibo.
  ro.a1.unit06.lesson02.teach.carne:
    title: Carne
    gloss: carne (carne)
    note: 'La parola generale per «carne»: i tipi specifici (carne de vită, carne de porc) aggiungono il tipo dopo.'
    example_gloss: Vorrei della carne.
  ro.a1.unit06.lesson02.teach.pui:
    title: Il pollo
    gloss: pui (pollo)
    note: La parola specifica per il pollo (come cibo), distinta dal generico carne.
    example_gloss: Vorrei del pollo.
  ro.a1.unit06.lesson02.teach.fructe:
    title: La frutta
    gloss: fructe (frutta)
    note: La forma plurale d'uso comune; in italiano si dice «frutta» al singolare come categoria generale, in rumeno si usa il plurale.
    example_gloss: Vorrei della frutta.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: Per favore (formale)
    gloss: vă rog (per favore, formale)
    note: 'Il modo cortese di dire «per favore»: si abbina al registro di cortesia dumneavoastră visto nelle Unità 1 e 2.'
    example_gloss: Un caffè, per favore.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: Per favore (informale)
    gloss: te rog (per favore, informale)
    note: 'La versione di tutti i giorni, usata con gli amici e con le persone a cui dai del *tu*: si abbina al registro tu dell''Unità 1.'
    example_gloss: Un tè, per favore.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Ripasso: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (buongiorno) · bine (bene) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: 'Tutto già visto nei dialoghi delle Unità 1 e 5: qui Ana e Mihai si incontrano di nuovo, questa volta in un caffè.'
  ro.a1.unit06.lesson03.teach.line01:
    title: Salutare e dire che hai fame
    gloss: Ana saluta Mihai e dice che ha fame.
    note: Usa *Mi-e foame*, l'espressione di questa unità, già nel saluto.
  ro.a1.unit06.lesson03.teach.line02:
    title: Ordinare del cibo
    gloss: Mihai dice che vorrebbe del pane e del pollo.
    note: Riprende il lessico pâine/pui di questa unità con la formula Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Ordinare una bevanda con cortesia
    gloss: Ana dice che vorrebbe un caffè, per favore.
    note: 'Unisce Aș dori, cafea e vă rog: tre elementi che questa unità ha già presentato separatamente.'
  ro.a1.unit06.lesson03.teach.line04:
    title: Ordinare anche una bevanda
    gloss: Mihai dice che vorrebbe un tè, per favore.
    note: Lo stesso schema della battuta di Ana, con ceai al posto di cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Ringraziare e congedarsi
    gloss: Ana ringrazia Mihai e lo saluta.
    note: Qui *Mulțumesc* è un semplice ringraziamento finale, la stessa parola di *Bine, mulțumesc.* dell'Unità 1.
  ro.a1.unit06.lesson03.teach.line06:
    title: Chiudere l'incontro
    gloss: Mihai ricambia il saluto, chiamando Ana per nome.
    note: Lo stesso cordiale congedo con cui finivano i dialoghi delle Unità 1 e 5.
