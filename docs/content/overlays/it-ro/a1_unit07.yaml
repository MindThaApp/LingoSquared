answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Rumeno A1
  description: Chiedere prezzi e quantità in rumeno -- la valuta leu/lei, scump/ieftin e la spesa al mercato, con prodotti come roșii (pomodori) e cartofi (patate) al chilo -- con Ana e Mihai che continuano a fare acquisti al mercato.
units:
  ro.a1.unit07.shopping:
    title: Fare la spesa
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: Quanto costa?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Pomodori e patate
  ro.a1.unit07.lesson03.la_piata:
    title: Al mercato
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Ripasso: un, doi, cinci, zece, douăzeci'
    gloss: un (uno) · doi (due) · cinci (cinque) · zece (dieci) · douăzeci (venti)
    note: Sono tutti già comparsi nelle unità precedenti (*un* nell'Unità 4, i numeri nell'Unità 2) -- qui tornano per parlare di prezzi.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: Quanto costa?
    gloss: Cât costă? (Quanto costa?)
    note: Il modo più comune di chiedere un prezzo in rumeno -- aggiungi il nome dell'articolo dopo, oppure usala da sola così quando l'articolo è già chiaro dal contesto.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (valuta)
    gloss: 'leu (l''unità monetaria rumena -- plurale: lei)'
    note: La valuta della Romania. Leu è singolare (un leu); il plurale lei è irregolare, non si forma con leu + una normale desinenza.
    example_gloss: Costa un leu.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Costa otto lei
    gloss: Costă opt lei. (Costa otto lei.)
    note: Da 2 a 19, lei resta semplice -- non serve nessuna parola in più davanti.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Costa trenta lei
    gloss: Costă treizeci de lei. (Costa trenta lei.)
    note: Da 20 in su, il rumeno inserisce *de* prima del nome contato -- la stessa regola che l'Unità 2 ha insegnato per *ani* (anni), ora applicata a *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Regola: leu → lei, e quando aggiungere de'
    gloss: 'leu → lei · numeri 2-19: senza *de* · numeri da 20: con *de*'
    note: Lo stesso schema della regola su *ani* dell'Unità 2 (câți ani ai / am treizeci de ani) -- una volta che lo conosci per un nome, funziona allo stesso modo per lei.
  ro.a1.unit07.lesson01.teach.scump:
    title: Caro
    gloss: scump (caro)
    note: Una reazione comune davanti a un prezzo che ti sembra troppo alto.
    example_gloss: Otto lei? Caro!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Economico
    gloss: ieftin (economico)
    note: Il contrario di scump -- un buon prezzo.
    example_gloss: Un leu? Economico!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Ripasso: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (un/una) · și (e) · aș dori (vorrei) · vă rog (per favore, formale) · te rog (per favore, informale)
    note: '*Aș dori*, *vă rog* e *te rog* sono comparsi per la prima volta nella scena al bar dell''Unità 6 -- qui tornano al mercato.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Mercato
    gloss: piață (mercato)
    note: Un nome femminile -- il mercato all'aperto o coperto dove si comprano prodotti freschi.
    example_gloss: Quanto costa al mercato?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Pomodori
    gloss: roșii (pomodori)
    note: Plurale di roșie (un pomodoro) -- si usa al plurale quando si parla in generale di comprarli.
    example_gloss: Vorrei dei pomodori.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Patate
    gloss: cartofi (patate)
    note: Plurale di cartof (una patata), con lo stesso schema di roșii.
    example_gloss: Vorrei delle patate.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (chilogrammo)
    note: 'L''unità standard per comprare i prodotti a peso. *De* lo collega a ciò che si compra: kilogram *de* roșii, «un chilo di pomodori».'
    example_gloss: Un chilo di pomodori.
  ro.a1.unit07.lesson02.teach.vreau:
    title: voglio
    gloss: vreau (voglio)
    note: Più semplice e diretto di *aș dori* («vorrei») -- al mercato vanno bene entrambi, vreau è solo meno formale.
    example_gloss: Voglio delle patate.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: Dove posso comprare ...?
    gloss: Unde pot să cumpăr roșii? (Dove posso comprare i pomodori?)
    note: Una domanda utile quando non sai ancora dove fare la spesa -- sostituisci roșii con qualsiasi altro prodotto cerchi.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: Quanto costa un chilo di pomodori?
    gloss: Cât costă un kilogram de roșii? (Quanto costa un chilo di pomodori?)
    note: Unisce Cât costă e la costruzione kilogram de ... in un'unica domanda completa.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Voglio un chilo di patate
    gloss: Vreau un kilogram de cartofi. (Voglio un chilo di patate.)
    note: Lo stesso schema kilogram de ..., questa volta in un'affermazione con vreau invece che in una domanda.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Ripasso: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (buongiorno) · mulțumesc (grazie) · bine (bene) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: Tutti già presenti nei dialoghi dell'Unità 1 e dell'Unità 6 -- qui Ana e Mihai si reincontrano, questa volta al mercato.
  ro.a1.unit07.lesson03.teach.line01:
    title: Salutare e chiedere un prezzo
    gloss: Ana saluta Mihai e chiede il prezzo di un chilo di pomodori.
    note: Unisce il Cât costă di questa unità con il saluto dell'Unità 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: Dire il prezzo
    gloss: Mihai dice che costa otto lei e commenta che è economico.
    note: Riprende costă/opt lei/ieftin di questa unità.
  ro.a1.unit07.lesson03.teach.line03:
    title: Ordinare con cortesia e aggiungere un prodotto
    gloss: Ana accetta, chiede gentilmente un chilo di pomodori e aggiunge che vuole anche delle patate.
    note: Unisce aș dori, vă rog e vreau -- entrambi i registri del vocabolario di questa unità in un'unica battuta.
  ro.a1.unit07.lesson03.teach.line04:
    title: Dire il secondo prezzo
    gloss: Mihai dice che un chilo di patate costa cinque lei.
    note: Riprende zece (dieci) dall'Unità 2, già ripassato nella lezione 1 di questa unità.
  ro.a1.unit07.lesson03.teach.line05:
    title: Ringraziare e congedarsi
    gloss: Ana ringrazia Mihai e lo saluta.
    note: Qui *Mulțumesc* è un semplice ringraziamento finale, la stessa parola di *Bine, mulțumesc.* dell'Unità 1.
  ro.a1.unit07.lesson03.teach.line06:
    title: Concludere l'incontro
    gloss: Mihai ricambia il saluto, usando il nome di Ana.
    note: Lo stesso cordiale modo di concludere con cui finivano i dialoghi delle Unità 1, 5 e 6.
