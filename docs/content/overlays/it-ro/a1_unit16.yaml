answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Rumeno A1
  description: 'Dire un semplice problema di salute in romeno: Doare (fare male), Bolnav (malato) e Doctor (medico), mentre Mihai non si sente bene e Ana lo controlla e gli dà qualche consiglio.'
units:
  ro.a1.unit16.health:
    title: Salute
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: Mi fa male la testa
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: Non mi sento bene
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: Mihai è malato
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Ripasso: mă, vă, ce, sau'
    gloss: mă (mi) · vă (La/Le, formale) · ce (cosa) · sau (o)
    note: 'Mă viene dall''Unità 1 e dall''Unità 10 (mă numesc, mă trezesc); vă dalle Unità 1, 6, 7 e 13 (vă rog); ce dalle Unità 1, 3, 4 e 15; sau dall''Unità 13. Questa unità li riusa tutti e quattro con un nuovo scopo: dire che cosa fa male.'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Fa male
    gloss: Doare (fa male)
    note: 'Verbo impersonale: in romeno si dice «mi fa male» (*mă doare*), non «io faccio male». *Mă doare* da solo significa «mi fa male»; aggiungi la parte del corpo per dire che cosa fa male: *Mă doare capul*.'
    example_gloss:
    - Fa male.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Testa
    gloss: Cap (testa)
    note: 'Neutro, termina in consonante: prende *-ul* per «la testa», la stessa desinenza di *tren*->*trenul* e *peron*->*peronul*.'
    example_gloss:
    - Mi fa male la testa.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: Cosa Le fa male?
    gloss: Ce vă doare? (Cosa Le fa male?)
    note: '*Ce* (cosa) + *vă* (Le, forma formale) + *doare*: tutte parole già viste o appena introdotte, combinate in una nuova domanda.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Stomaco
    gloss: Stomac (stomaco)
    note: 'Neutro, termina in consonante, quindi «lo stomaco» è *stomacul*: la stessa desinenza *-ul* di *cap*->*capul*.'
    example_gloss:
    - Mi fa male lo stomaco.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: Le fa male la testa o lo stomaco?
    gloss: Vă doare capul sau stomacul? (Le fa male la testa o lo stomaco?)
    note: '*Vă* (Le, forma formale) al posto di *mă* trasforma l''affermazione in una domanda sull''altra persona; *sau* (o, dall''Unità 13) unisce le due parti del corpo appena viste.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Ripasso: nu, bine, am, un, de'
    gloss: nu (non/no) · bine (bene) · am (ho) · un (un, maschile/neutro) · de (di/da)
    note: Nu e bine vengono dalle Unità 1, 6 e 11; am dalle Unità 2, 5 e 15; un e de dalle Unità 6, 7 e 15. Questa unità li riusa tutti e cinque per dire che non ti senti bene e hai bisogno di un medico.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: mi sento
    gloss: Mă simt (mi sento)
    note: 'Verbo riflessivo, alla lettera «mi sento»: lo stesso schema *mă* + verbo di *mă trezesc*/*mă culc* dell''Unità 10.'
    example_gloss:
    - Mi sento bene.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: Non mi sento bene
    gloss: Nu mă simt bine. (Non mi sento bene.)
    note: '*Nu* nega *mă simt bine*: è il modo naturale di dire che qualcosa non va senza ancora indicare un sintomo preciso.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Malato
    gloss: Bolnav (malato, maschile)
    note: Forma maschile dell'aggettivo, come la dice Mihai (*Sunt bolnav*). Una donna dice *Sunt bolnavă* (forma femminile).
    example_gloss:
    - Sono malato.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: Ho bisogno di un medico
    gloss: Am nevoie de un doctor. (Ho bisogno di un medico.)
    note: '*Am nevoie de* (ho bisogno di, alla lettera «ho necessità di») + *un doctor*: un''espressione fissa, utile per chiedere aiuto per qualsiasi cosa, non solo per un medico.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: Doctor (medico)
    note: Maschile, quindi «un medico» è *un doctor*.
    example_gloss:
    - Ho bisogno di un medico.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Ripasso: Ce mai faceți?, Aveți, Da'
    gloss: Ce mai faceți? (Come sta?) · Aveți (ha, formale) · Da (sì)
    note: Ce mai faceți viene dall'Unità 1; Aveți dall'Unità 5; Da dalle Unità 6 e 11. Tutti riusati nel dialogo di controllo di questa unità.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Ripasso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: 'Tutte già viste nelle unità precedenti: lo stesso schema cordiale di apertura e chiusura di ogni dialogo del corso.'
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Ripasso: Spitalul este vizavi de magazin'
    gloss: Spitalul este vizavi de magazin. (L'ospedale è di fronte al negozio.)
    note: 'Ripreso direttamente dall''Unità 8: la posizione dell''ospedale non è cambiata, e la nota di lettura di questa unità rimanda proprio a quella.'
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Riposo
    gloss: Odihnă (riposo)
    note: 'Nome femminile: ciò che un medico (o un amico) consiglia quando non stai bene.'
    example_gloss:
    - Hai bisogno di riposo.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Molta acqua
    gloss: Tanta acqua
    note: '*Multă* (tanto/molta, femminile) concorda con il femminile *apă* (acqua, dall''Unità 6): è un''espressione fissa, il tipo di consiglio che potrebbe dare un medico.'
    example_gloss:
    - Riposo e tanta acqua.
  ro.a1.unit16.lesson03.teach.line01:
    title: Salutare e chiedere come sta
    gloss: Ana saluta Mihai e gli chiede come sta.
    note: Riprende il saluto *Ce mai faceți?* dell'Unità 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: Dire che non ti senti bene
    gloss: Mihai dice che non si sente bene e che gli fa male la testa.
    note: Combina la frase della lezione 2 e quella della lezione 1 di questa unità.
  ro.a1.unit16.lesson03.teach.line03:
    title: Chiedere se ha bisogno di un medico
    gloss: Ana gli chiede se ha bisogno di un medico.
    note: Riprende in forma di domanda la frase della lezione 2 di questa unità, con *aveți* dell'Unità 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Confermare di essere malato e di aver bisogno di un medico
    gloss: 'Mihai risponde di sì: è malato e ha bisogno di un medico.'
    note: Combina *sunt bolnav* e *am nevoie de un doctor* di questa unità.
  ro.a1.unit16.lesson03.teach.line05:
    title: Dare un consiglio e salutare
    gloss: Ana gli dice di riposare e di bere tanta acqua, poi lo saluta.
    note: 'Usa *Odihnă și multă apă* di questa lezione: un consiglio sulla salute al posto del solito semplice saluto finale del corso.'
  ro.a1.unit16.lesson03.teach.line06:
    title: Ringraziarla e salutare
    gloss: Mihai ringrazia Ana e la saluta.
    note: Lo stesso modo di chiudere con cui sono finiti i dialoghi di tutte le unità precedenti.
