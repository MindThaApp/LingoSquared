      right: dumneavoastră
    - left: Salut
      right: tu (informale)
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Completa il saluto rivolto a un adulto che non conosci.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră è la scelta rispettosa e sicura con un adulto sconosciuto.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Scrivi la domanda informale che senti.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Completa il saluto di congedo neutro.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Usa un saluto formale, chiedi come sta la persona e chiudi lo scambio.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Ascolta e seleziona la domanda di cortesia sul nome.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Che cosa significa la risposta di Mihai?
    correct_option: Piacere!
    distractors:
    - Arrivederci!
    - Come sta?
    accepted_answers:
    - Piacere!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Costruisci la presentazione di Ana.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Abbina ogni domanda sul nome alla risposta corrispondente.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Dopo il saluto informale, chiedi il nome all’altra persona.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Completa la frase con cui si dice il nome di Mihai.
    accepted_answers:
