    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: Quale pronome corrisponde a questo saluto informale?
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut e tu formano una combinazione informale coerente.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Rimetti in ordine la domanda di cortesia sul benessere.
    correct_response:
