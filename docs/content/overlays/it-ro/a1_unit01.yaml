answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumeno A1
  description: 'Impara i saluti standard in rumeno e le presentazioni al primo incontro. Le indicazioni si concentrano sul contrasto più importante in questa fase: il tu informale rispetto al dumneavoastră di cortesia, e i due modi quotidiani in rumeno per dire il proprio nome (mă numesc.../mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: Saluti e primi incontri
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Saluti: tu e dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: Come ti chiami?
  ro.a1.unit01.lesson03.street_meeting:
    title: Un incontro per strada
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Saluto di tutti i giorni
    gloss: ciao; salve
    note: Bună è il saluto di tutti i giorni, leggermente informale, adatto con amici, coetanei e nella maggior parte degli incontri casuali durante il giorno.
    example_gloss: Ciao, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: Saluto informale
    gloss: ciao
    note: Salut è informale, usato tra amici e coetanei. Come l'italiano ciao, può servire sia per salutare sia per congedarsi, ma non è la scelta più sicura con un adulto sconosciuto.
    example_gloss: Ciao, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Saluto formale
    gloss: buongiorno; salve (formale)
    note: Bună ziua è il saluto cortese e sicuro per un adulto sconosciuto, un negoziante o chiunque tu tratti con dumneavoastră. Letteralmente significa «buon giorno», ma si usa come saluto cortese generale, non solo a mezzogiorno.
    example_gloss: Buongiorno, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Congedo neutro
    gloss: arrivederci; addio
    note: La revedere va bene sia in situazioni formali sia informali, proprio come arrivederci in italiano.
    example_gloss: Buongiorno! Arrivederci!
  ro.a1.unit01.lesson01.teach.tu:
    title: «Tu» informale al singolare
    gloss: tu (singolare, informale)
    note: 'Come in italiano, la scelta del pronome mostra la distanza sociale: il rumeno tu si rivolge a un amico, a un bambino o a una persona con cui il rapporto è esplicitamente informale, e ha le sue forme verbali (faci, non faceți).'
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: «Voi» o «Lei» di cortesia
    gloss: Lei (di cortesia); voi (plurale)
    note: Dumneavoastră è la scelta sicura per un adulto sconosciuto e vale anche per un gruppo a cui ci si rivolge con cortesia. Ha un ruolo simile al Lei italiano, ma deriva da domnia voastră («Vostra Signoria») e vuole il verbo alla seconda persona plurale (faceți, numiți), anche quando ci si rivolge a una sola persona.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Domanda di cortesia sul benessere
    gloss: Come sta?
    note: Faceți è la forma di dumneavoastră del verbo a face (fare). È una domanda di cortesia convenzionale, non una richiesta letterale su ciò che qualcuno sta facendo.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Domanda informale sul benessere
    gloss: Come sta?
    note: 'Faci è la forma di tu del verbo a face. Tra la versione di cortesia e quella informale di questa domanda cambia solo la desinenza del verbo: ce mai resta uguale.'
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Risposta positiva standard
    gloss: Bene, grazie.
    note: 'Bine, mulțumesc risponde a ce mai faci/faceți in qualsiasi registro: la risposta non cambia.'
    example_gloss: Come stai? Bene, grazie.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Abbina saluto e rapporto
    gloss: Bună ziua con dumneavoastră; Salut con tu
    note: Sono indicazioni di base, non leggi assolute. Bună ziua può anche aprire uno scambio formale che poi continua con dumneavoastră; abbinare Salut a dumneavoastră di solito manda segnali sociali contrastanti.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Dire il proprio nome (standard)
    gloss: Mi chiamo Ana.
    note: 'Mă numesc significa letteralmente «mi nomino»: è il modo neutro, adatto a ogni situazione, per dire il proprio nome, simile per registro all''italiano «mi chiamo».'
    example_gloss: Ciao! Mi chiamo Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Chiedere il nome con cortesia
    gloss: Come si chiama?
    note: Numiți è la forma di dumneavoastră del verbo a se numi (chiamarsi). Vă è il pronome riflessivo che corrisponde a dumneavoastră e qui è obbligatorio.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Dire il proprio nome (colloquiale)
    gloss: Mi chiamo Mihai.
    note: Mă cheamă è il modo più colloquiale di dire il proprio nome, letteralmente «mi chiama». Mă numesc e mă cheamă sono entrambi corretti e diffusi; mă cheamă è un po' più informale.
    example_gloss: Ciao! Mi chiamo Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Chiedere il nome in modo informale
    gloss: Come ti chiami?
    note: Te è il pronome riflessivo che corrisponde a tu. È il modo di tutti i giorni in cui amici e coetanei si chiedono il nome.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Conoscere qualcuno
    gloss: Piacere!
    note: 'Îmi pare bine significa letteralmente «mi sembra bene»: è un''espressione fissa idiomatica, non una traduzione parola per parola di «piacere». Come l''italiano «piacere», non cambia forma secondo il genere di chi parla.'
    example_gloss: Mi chiamo Mihai. Piacere!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Ricambiare il sentimento
    gloss: Piacere anche a me!
    note: Și mie aggiunge «anche» davanti alla stessa espressione fissa usata per aprire lo scambio.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: Restituire la domanda con cortesia
    gloss: E Lei?
    note: Usa dumneavoastră per mantenere il registro di cortesia o per rivolgerti a un gruppo.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: Restituire la domanda in modo informale
    gloss: E Lei?
    note: Usa tu dopo și quando parli in modo informale a un amico o a un coetaneo.
  ro.a1.unit01.lesson03.teach.line01:
    title: Aprire l'incontro
    gloss: Ana saluta Mihai in modo formale e dice il suo nome.
    note: Ana inizia con il cortese bună ziua, adatto quando si incontra qualcuno che non si conosce.
  ro.a1.unit01.lesson03.teach.line02:
    title: Aprire l'incontro, risposta
    gloss: Mihai ricambia, dice il suo nome e le chiede come sta.
    note: 'Mihai mantiene lo stesso registro di cortesia con cui ha iniziato Ana: chiede ce mai faceți, non ce mai faci.'
  ro.a1.unit01.lesson03.teach.line03:
    title: Rispondere e restituire la domanda
    gloss: Ana dice che sta bene e rivolge a Mihai la stessa domanda, in modo cortese.
    note: Și dumneavoastră mantiene lo scambio formale, come all'inizio.
  ro.a1.unit01.lesson03.teach.line04:
    title: Rispondere e congedarsi
    gloss: Anche Mihai dice che sta bene e saluta.
    note: La revedere è il saluto di congedo neutro, adatto sia a uno scambio formale sia a uno informale.
  ro.a1.unit01.lesson03.teach.line05:
    title: Chiudere l'incontro
    gloss: Ana ripete lo stesso saluto.
    note: Ripetere la revedere è il modo naturale di confermare una chiusura cordiale.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
