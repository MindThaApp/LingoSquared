  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: Rimanda la domanda restando nel registro formale.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'Sei Ana. Scrivi: saluta con Bună, di'' il tuo nome con mă numesc, poi di'' «Piacere!».'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: Nel dialogo, chi dice il proprio nome con questa espressione?
    correct_option: Ana
    distractors:
    - Mihai
    - Nessuno dei due
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Quale pronome usano Ana e Mihai tra loro?
    correct_option: dumneavoastră
    distractors:
    - tu (informale)
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: Chi usa mă numesc e chi usa mă cheamă?
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - Entrambi usano mă numesc.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: Costruisci la risposta finale e il saluto di congedo.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Nel ruolo di Ana, rispondi con cortesia e restituisci la domanda.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Nel ruolo di Ana, saluta Mihai in modo formale, di' il tuo nome, rispondi al suo saluto e chiudi l'incontro.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: Scrivi ciò che senti.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
