teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Felice, triste e arrabbiato
    gloss: contento, triste, arrabbiato
    note: 'Tre parole di base per i sentimenti, usate con *a fi* (essere). Ognuna ha una forma femminile in *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Sono contento.
    - Sono triste.
    - Sono arrabbiato.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Dire che si è contenti
    gloss: Sono contento.
    note: '*Sunt* (da *a fi*, essere) + un aggettivo che indica un sentimento è la struttura di base, come in italiano «Sono ...». Una donna dice *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Contrapporre le emozioni
    gloss: Non sono arrabbiato, sono triste.
    note: '*Nu* davanti al verbo lo rende negativo: *Nu sunt supărat*. La seconda frase dice poi il sentimento reale.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Chiedere perché
    gloss: Perché sei felice?
    note: '*De ce* (perché) è la domanda standard per chiedere un motivo.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Dare un motivo
    gloss: Sono contento perché ho un nuovo appartamento.
    note: '*Pentru că* (perché) introduce la frase che spiega il motivo; l''ordine delle parole resta normale: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Un motivo negativo
    gloss: Sono triste perché piove.
    note: '*Plouă* (piove), come in italiano, non ha soggetto, quindi da solo basta come frase che spiega il motivo.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Nervoso
    gloss: nervoso
    note: La parola standard per indicare il nervosismo.
    example_gloss: Sono nervoso per il mio primo turno.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Dire per che cosa si è agitati
    gloss: Sono nervoso per il mio primo turno.
    note: '*Pentru* (letteralmente «per») introduce la cosa che causa l''agitazione, proprio come in italiano «agitato per ...».'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Rassicurare qualcuno
    gloss: Non ti preoccupare.
    note: '*Nu-ți face griji* (letteralmente «non farti preoccupazioni») è la formula fissa per rassicurare. Con una persona che non conosci o con il Lei: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Chiedere come si sente qualcuno
    gloss: Come si sente Mihai?
    note: '*A se simți* (sentirsi) è riflessivo: *mă simt* (io), *te simți* (tu), *se simte* (lui/lei). È il modo standard per chiedere o descrivere come ci si sente.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Descrivere come si sente qualcuno
    gloss: Si sente nervoso.
    note: '*Se* è il pronome riflessivo per lui/lei e va prima del verbo: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Chiedere perché qualcuno si sente in un certo modo
    gloss: Perché si sente nervoso?
    note: Unisce *de ce* con la struttura *se simte* di *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Leggi un messaggio sulle emozioni
    gloss: Ciao Ana, sono un po' agitato per il mio primo turno da solo. Ma sono anche felice, perché ho un nuovo lavoro e un nuovo appartamento. Credo che andrà tutto bene.
    note: Cerca di capire per che cosa è agitato chi scrive, che cosa lo rende contento e come vede la situazione nel complesso.
    glosses:
      puțin: un po'
      emoționat: nervoso
      prima: primo
      tură: turno
      singur: da solo
      fericit: contento
      fiindcă: perché
      nou: nuovo
      serviciu: lavoro
      apartament: appartamento
      cred: pensare
      rezolvă: 'andare (qui: andrà bene)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana chiede a Mihai come si sente
    gloss: 'Ana: Ciao Mihai, come ti senti prima del tuo primo turno?'
    note: '*Cum te simți* usa il riflessivo *te* («ti»); in *prima ta tură* il possessivo *ta* concorda con il femminile *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai ammette di essere agitato
    gloss: 'Mihai: Sono un po'' agitato, a dire il vero.'
    note: '*Sincer să fiu* (a dire il vero) attenua l''ammissione.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana lo rassicura
    gloss: 'Ana: Non preoccuparti, te la caverai bene!'
    note: '*O să te descurci bine* (letteralmente «ti caverai bene») è un''espressione fissa di incoraggiamento; *o să* + verbo forma il futuro.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai la ringrazia
    gloss: 'Mihai: Grazie, mi aiuta davvero.'
    note: '*Ajută* è la forma di lui/lei di *a ajuta* (aiutare); qui significa «aiuta».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana prevede come andrà a finire
    gloss: 'Ana: E dopo sarai sicuramente molto felice e orgoglioso.'
    note: '*Sigur* (sicuramente) esprime una previsione fiduciosa; *mândru* (orgoglioso) è un aggettivo nuovo e utile (*mândră* per una donna).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai è d'accordo
    gloss: 'Mihai: Sì, lo penso anch''io.'
    note: '*Și eu cred asta* (letteralmente «anch''io credo questo») è il modo naturale per essere d''accordo con l''opinione di qualcuno.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: Riepilogo con este, lui e îl
    gloss: Mihai è agitato per il suo primo turno. Ana lo aiuta.
    note: '*Este* è la forma di lui/lei di *a fi* (essere); *lui* dopo il nome significa «suo»; *îl* significa «lo» e va prima del verbo: *îl ajută*. Tre paroline semplici ma essenziali per parlare di un''altra persona.'
