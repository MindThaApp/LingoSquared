answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Rumeno A1
  description: 'Confrontare cose familiari in rumeno: Mare (grande), Mic/Mică (piccolo) e la costruzione comparativa Mai ... decât (più ... di/che), mentre Ana e Mihai confrontano la grandezza del loro caffè, del tè e del pane.'
units:
  ro.a1.unit14.comparisons:
    title: I confronti
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Grande, piccolo
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Più grande, più piccolo
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: Qual è più grande?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Ripasso: mare'
    gloss: mare (grande)
    note: 'Già incontrato nell''Unità 3 ("literă mare", lettera maiuscola) e nell''Unità 5 ("o familie mare", una famiglia grande): qui trova un vero termine di confronto, *mic/mică*.'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Ripasso: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (il caffè) · ceaiul (il tè) · pâinea (il pane) · cafea (caffè) · ceai (tè)
    note: 'Tutte dalle Unità 6 e 13: in questa unità le forme determinate sono le cose da confrontare per grandezza, e le forme indeterminate tornano nell''esercizio di abbinamento di questa lezione.'
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Piccolo
    gloss: Mic (piccolo, masch./neutro) · Mică (piccola, femm.)
    note: 'Gli aggettivi rumeni concordano con il nome a cui si riferiscono: *ceai* (tè) vuole la forma maschile/neutra *mic*, mentre *cafea* (caffè) e *pâine* (pane) sono femminili e vogliono *mică*. *Mare* (grande) ha la stessa forma per il maschile e il femminile singolare, per questo non ha mai richiesto questa distinzione.'
    example_gloss:
    - Il tè è piccolo.
    - Il caffè è piccolo.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: Il tè è piccolo
    gloss: Ceaiul e mic. (Il tè è piccolo.)
    note: '*Ceaiul* è neutro, quindi prende la forma maschile/neutra *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: Il caffè è piccolo
    gloss: Cafeaua e mică. (Il caffè è piccolo.)
    note: '*Cafeaua* è femminile, quindi prende la forma femminile *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: Il pane è piccolo
    gloss: Pâinea e mică. (Il pane è piccolo.)
    note: Anche *pâinea* è femminile, quindi prende *mică* come *cafeaua*.
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Ripasso: Mare, Mic, Mică'
    gloss: Mare (grande) · Mic (piccolo, masch./neutro) · Mică (piccola, femm.)
    note: 'Tutte dalla prima lezione di questa unità: qui ricevono una forma comparativa.'
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Ripasso: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (il caffè) · ceaiul (il tè) · pâinea (il pane)
    note: Tutte dall'Unità 13, qui riutilizzate come le cose da confrontare.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Più
    gloss: Mai (più, comparativo)
    note: 'Non è il mese *mai* (maggio, Unità 3). È la stessa piccola parola di ''Ce mai faceți?'' (Unità 1), ma qui ha un''altra funzione, quella di particella del comparativo: mettendo *mai* davanti a un aggettivo si dice ''più ___'', ed è il modo normale in cui il rumeno forma il comparativo.'
    example_gloss:
    - Il caffè è più grande.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: Il caffè è più grande
    gloss: Cafeaua e mai mare. (Il caffè è più grande.)
    note: '*Mai* + l''aggettivo: non serve altro cambiamento.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Di / che (nel confronto)
    gloss: Decât (di, che)
    note: 'Completa il confronto: *mai* + aggettivo + *decât* + il secondo termine di paragone.'
    example_gloss:
    - Il caffè è più grande del tè.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: Il caffè è più grande del tè
    gloss: Cafeaua e mai mare decât ceaiul. (Il caffè è più grande del tè.)
    note: 'Lo schema completo del comparativo: [cosa] + e + mai + [aggettivo] + decât + [secondo termine].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: Il pane è più piccolo del caffè
    gloss: Pâinea e mai mică decât cafeaua. (Il pane è più piccolo del caffè.)
    note: Lo stesso schema con *mică*, la forma femminile di 'piccolo' vista nella prima lezione di questa unità.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Ripasso: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (più) · Decât (di, che) · Mare (grande) · Mic (piccolo, masch./neutro) · Mică (piccola, femm.)
    note: 'Tutte dalle prime due lezioni di questa unità: qui Ana e Mihai le usano insieme.'
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Ripasso: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (il caffè) · ceaiul (il tè) · pâinea (il pane)
    note: 'Tutte dall''Unità 13: le tre cose che Ana e Mihai confrontano.'
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Ripasso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: 'Tutte già viste nelle unità precedenti: la stessa cordiale formula di apertura e chiusura di ogni dialogo di questo corso.'
  ro.a1.unit14.lesson03.teach.line01:
    title: Salutare e chiedere la grandezza
    gloss: Mihai saluta Ana e le chiede se il caffè è grande o piccolo.
    note: Usa *mare sau mică* (grande o piccola) per aprire una domanda sulla grandezza, con lo stesso schema «X sau Y?» per proporre una scelta che *cafea sau ceai?* aveva già introdotto nell'Unità 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: Descrivere la grandezza delle due bevande
    gloss: Ana dice che il caffè è grande e il tè è piccolo.
    note: 'Enuncia un semplice dato sulla grandezza, non una preferenza: in questo dialogo non si dice chi preferisce o ordina quale bevanda, ma solo quanto è grande ciascuna.'
  ro.a1.unit14.lesson03.teach.line03:
    title: Chiedere conferma del confronto
    gloss: Mihai chiede se il caffè è più grande del tè.
    note: Trasforma i due dati separati di Ana in un confronto diretto con *mai mare decât*, la costruzione centrale di questa unità.
  ro.a1.unit14.lesson03.teach.line04:
    title: Confermare e aggiungere il pane
    gloss: Ana conferma, poi dice che il pane è più piccolo del caffè.
    note: Riutilizza *mai ... decât* con il terzo elemento, *pâinea*, questa volta con la forma comparativa di 'piccolo', *mai mică*.
  ro.a1.unit14.lesson03.teach.line05:
    title: Confermare, ringraziare e salutare
    gloss: Mihai conferma che il pane è piccolo, ringrazia Ana e la saluta.
    note: La stessa formula di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
  ro.a1.unit14.lesson03.teach.line06:
    title: Chiudere la conversazione
    gloss: Ana ricambia il saluto, usando il nome di Mihai.
    note: La stessa cordiale formula di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
