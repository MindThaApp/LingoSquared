teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Ripasso: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (la mattina) · seara (la sera) · noaptea (di notte) · cafea (caffè) · pâine (pane)
    note: 'Tutte parole già viste (dimineața/seara/noaptea dall''Unità 4, cafea/pâine dall''Unità 6): qui si combinano nelle frasi sulla routine quotidiana di questa unità.'
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Mi sveglio
    gloss: Mă trezesc (mi sveglio)
    note: '*Mă* è il pronome riflessivo già visto in *mă numesc* / *mă cheamă*: come in italiano, per «svegliarsi» il romeno usa un verbo riflessivo, letteralmente «mi sveglio».'
    example_gloss:
    - Mi sveglio la mattina.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Mi sveglio la mattina
    gloss: Mă trezesc dimineața. (Mi sveglio la mattina.)
    note: 'Una frase breve e completa: la più semplice frase sulla routine.'
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Mangio
    gloss: Mănânc (mangio)
    note: 'Non serve il pronome «io»: in romeno la desinenza del verbo indica già chi parla, come in italiano e come già visto con *vreau*, *cumpăr* e *aș dori*.'
    example_gloss:
    - Mangio pane la mattina.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: Bevo
    gloss: Beau (bevo)
    note: Si abbina in modo naturale a bevande già note come *cafea* e *ceai*.
    example_gloss:
    - La mattina bevo il caffè.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Mangio pane e bevo caffè la mattina
    gloss: Mănânc pâine și beau cafea dimineața. (Mangio pane e bevo caffè la mattina.)
    note: Unisce due azioni con *și* (e), già visto in *ora unu și jumătate* dell'Unità 4.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: lavoro
    gloss: Lucrez (lavoro)
    note: È la prima persona di *lucrează*, già visto nell'Unità 4 per il lavoro serale di Mihai.
    example_gloss:
    - Lavoro la sera.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Lavoro la sera
    gloss: Lucrez seara. (Lavoro la sera.)
    note: Una frase breve e completa su quando lavori.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: Vado
    gloss: Merg (vado)
    note: 'È la prima persona di *mergeți*, la forma di comando vista prima: stesso verbo, persona diversa.'
    example_gloss:
    - Vado a casa.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: La casa
    gloss: Acasă (a casa)
    note: 'Si usa senza preposizione: *merg acasă*, non *merg la acasă*. Anche in italiano si dice «vado a casa» senza articolo, ma in romeno acasă è un avverbio e non vuole nessuna preposizione.'
    example_gloss:
    - Vado a casa di notte.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Torno a casa di notte
    gloss: Merg acasă noaptea. (Torno a casa di notte.)
    note: 'Un''affermazione breve e completa: la fine naturale di una giornata di lavoro.'
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Lavoro la sera e torno a casa di notte
    gloss: Lucrez seara și merg acasă noaptea. (Lavoro la sera e torno a casa di notte.)
    note: Unisce in un'unica frase le due affermazioni di questa lezione con *și*.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Ripasso: cursul, începe, la ora nouă, apoi'
    gloss: cursul (il corso) · începe (comincia) · la ora nouă (alle nove) · apoi (poi)
    note: Cursul/începe/la ora nouă sono già stati introdotti nell'Unità 4 (il corso di Mihai comincia alle nove di mattina); apoi nell'Unità 9. Qui si combinano nel racconto della routine di Mihai.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Ripasso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · da (sì) · Ana, Mihai (nomi)
    note: 'Tutto già visto nelle unità precedenti: qui Ana chiede a Mihai com''è la sua giornata.'
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: vado a letto
    gloss: Mă culc (vado a letto)
    note: 'Un altro verbo riflessivo, con lo stesso schema di *mă trezesc*: letteralmente «mi metto giù».'
    example_gloss:
    - Vado a letto di notte.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: Vado a letto di notte
    gloss: Mă culc noaptea. (Vado a letto di notte.)
    note: La fine naturale della giornata, che chiude la routine iniziata con *mă trezesc dimineața*.
  ro.a1.unit10.lesson03.teach.line01:
    title: Salutare e chiedere quando inizia il corso
    gloss: Ana saluta Mihai e gli chiede quando inizia il suo corso.
    note: Riprende la domanda dell'Unità 4 sul corso di Mihai.
  ro.a1.unit10.lesson03.teach.line02:
    title: Rispondere indicando l'ora del corso
    gloss: Mihai dice che il suo corso inizia alle nove di mattina.
    note: È la stessa risposta data da Mihai nell'Unità 4, ripresa qui nella sua routine quotidiana più completa.
  ro.a1.unit10.lesson03.teach.line03:
    title: Chiedere della sera
    gloss: 'Ana fa una breve domanda di approfondimento: «E la sera?»'
    note: Un modo naturale e minimo per chiedere altro sulla routine, senza una nuova parola interrogativa.
  ro.a1.unit10.lesson03.teach.line04:
    title: Descrivere il resto della giornata
    gloss: Mihai dice che lavora la sera, poi va a letto di notte.
    note: 'Unisce *lucrez* e *mă culc* di questa unità con *apoi*, e coincide con quanto già stabilito nell''Unità 4: Mihai lavora la sera.'
  ro.a1.unit10.lesson03.teach.line05:
    title: Ringraziare e concludere
    gloss: Ana dice «Bene!», ringrazia Mihai e lo saluta.
    note: Lo stesso ringraziamento finale dei dialoghi delle Unità 1, 8 e 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Chiudere l'incontro
    gloss: Mihai ricambia il saluto, usando il nome di Ana.
    note: Lo stesso modo cordiale con cui si sono chiusi i dialoghi di tutte le unità precedenti.
