answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumeno A1
  description: I giorni della settimana, i mesi dell'anno e il modo in cui il rumeno indica la data (un numero cardinale semplice più il mese, tranne il primo del mese, che usa la parola speciale întâi). Continuiamo con Ana e Mihai mentre fissano il loro prossimo incontro.
units:
  ro.a1.unit03.dates:
    title: Giorni e date
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: I giorni della settimana
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: I mesi dell'anno e come si dice la data
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: Quando ci vediamo di nuovo?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Ripasso: este'
    gloss: è
    note: '*Este* è già comparso nell''Unità 2 (*Care este numărul...?*). È invariabile: la stessa parola per un giorno, una data o qualsiasi altro soggetto, e non cambia tra tu e dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Oggi, domani
    gloss: astăzi (oggi) / mâine (domani)
    note: Sono entrambe parole di tempo invariabili, che stanno all'inizio di una frase che indica il giorno o la data.
    example_gloss:
    - Oggi è lunedì.
    - Domani è martedì.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Lunedì, martedì
    gloss: luni (lunedì) / marți (martedì)
    note: Per dire il giorno (Astăzi este luni) si usa la forma semplice qui indicata. I nomi dei giorni hanno anche forme con l'articolo, lunea e marțea, che significano "il lunedì", "il martedì" (come abitudine); le vedrai più avanti.
    example_gloss:
    - Oggi è lunedì.
    - Domani è martedì.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Mercoledì, giovedì
    gloss: miercuri (mercoledì) / joi (giovedì)
    note: Come luni e marți, anche miercuri e joi hanno la stessa forma al singolare e al plurale.
    example_gloss:
    - Oggi è mercoledì.
    - Domani è giovedì.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Venerdì, sabato
    gloss: vineri (venerdì) / sâmbătă (sabato)
    note: Nell'ortografia moderna sâmbătă conserva la â al centro della parola, a differenza della vecchia grafia sîmbătă.
    example_gloss:
    - Oggi è venerdì.
    - Domani è sabato.
  ro.a1.unit03.lesson01.teach.duminica:
    title: domenica
    gloss: domenica
    note: Duminică completa la settimana. Per dire che giorno è si usa questa forma semplice; la forma con l'articolo duminica significa "la domenica" (come abitudine).
    example_gloss: Oggi è domenica.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Chiedere che giorno è
    gloss: Che giorno è oggi?
    note: 'Il modo abituale per chiedere che giorno della settimana è: zi (giorno) è la parola nuova, accanto a ce, este e astăzi che già conosci.'
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Settimana, ieri, settimana scorsa/prossima
    gloss: săptămână (settimana) / ieri (ieri) / săptămâna trecută (la settimana scorsa) / săptămâna viitoare (la settimana prossima)
    note: 'Un gruppo di vocaboli in più, tratto dallo stesso materiale dei nomi dei giorni: utile per parlare di date in modo relativo, ma negli esercizi di questa unità non viene allenato quanto i giorni della settimana.'
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: I giorni si scrivono in minuscolo
    gloss: 'I giorni non si scrivono con la maiuscola: luni, vineri.'
    note: 'Come in italiano, i nomi dei giorni della settimana non si scrivono con la maiuscola in mezzo a una frase: *luni*, non *Luni*, a meno che la parola non apra la frase.'
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Gennaio, febbraio, marzo
    gloss: gennaio / febbraio / marzo
    note: A differenza dei nomi dei giorni della settimana, diversi nomi dei mesi sono facilmente riconoscibili perché molto simili ai loro equivalenti italiani, dato che derivano entrambi dal latino.
    example_gloss:
    - È gennaio.
    - È febbraio.
    - È marzo.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: Aprile, maggio, giugno
    gloss: aprile / maggio / giugno
    note: 'Mai (maggio) è corto, ma diverso da mai, l''avverbio (più) usato altrove in questo corso (ce mai faci): il contesto chiarisce sempre il significato.'
    example_gloss:
    - È aprile.
    - È maggio.
    - È giugno.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Luglio, agosto, settembre
    gloss: luglio / agosto / settembre
    note: 'August è molto simile all''italiano «agosto»: è uno dei cognati più trasparenti di questo gruppo.'
    example_gloss:
    - È luglio.
    - È agosto.
    - È settembre.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Ottobre, novembre, dicembre
    gloss: ottobre / novembre / dicembre
    note: Gli ultimi tre mesi completano la serie dei dodici; sono tutti nomi invariabili.
    example_gloss:
    - È ottobre.
    - È novembre.
    - È dicembre.
  ro.a1.unit03.lesson02.teach.intai:
    title: Il primo (del mese)
    gloss: il primo
    note: 'Una vera regola specifica del rumeno: nell''uso standard il primo giorno del mese non si dice *unu* (il semplice «uno»), ma con una parola speciale, *întâi*. (Nel parlato informale potresti sentire *unu*, ma la forma da imparare è *întâi*.) Tutte le altre date, dal due in poi, usano il normale numero cardinale.'
    example_gloss: Oggi è il primo agosto.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Come si dice la data in rumeno
    gloss: 'Il 1°: întâi · dal 2 in poi: il numero normale (doi, trei, patru...)'
    note: 'Dopo il primo del mese, le date in rumeno sono semplicemente il numero cardinale (già visto) seguito dal mese: non servono né forma ordinale né altre parole, ad es. *trei aprilie* (il tre aprile, letteralmente «tre aprile»).'
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Chiedere la data
    gloss: Che data è oggi?
    note: Dată (data) è una parola nuova; il resto della domanda riprende ce, este e astăzi, esattamente come nella domanda sul giorno della lezione 1.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Dire una data
    gloss: Oggi è il tre aprile.
    note: Trei (tre) è un numero cardinale già visto nell'Unità 2; prima di aprilie non si aggiunge né una desinenza ordinale né un'altra parola.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Fai gli auguri in un giorno speciale
    gloss: Buon compleanno! / Buon anno!
    note: 'Letteralmente «(per) molti anni»: è l''augurio rumeno più comune per un compleanno, un onomastico o Capodanno, e riprende *ani* (anni) dai contenuti sull''età dell''Unità 2.'
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Anche i mesi si scrivono in minuscolo
    gloss: 'I mesi non si scrivono con la lettera maiuscola: ianuarie, mai.'
    note: 'È la stessa regola dei giorni della settimana della lezione 1: in rumeno i nomi dei mesi restano in minuscolo anche a metà frase.'
  ro.a1.unit03.lesson03.teach.cand:
    title: Quando?
    gloss: quando?
    note: Când apre una domanda sul tempo, proprio come «quando» in italiano.
    example_gloss: Quando è la riunione?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: La riunione
    gloss: l'incontro
    note: 'Întâlnirea è la forma determinata (la riunione): il nome senza articolo è întâlnire.'
    example_gloss: La riunione è lunedì.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Chiedi quando è qualcosa
    gloss: Quando è la riunione?
    note: Unisce când al già noto este e alla nuova parola di questa lezione, întâlnirea.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: Di' la data di un evento
    gloss: La riunione è venerdì, primo agosto.
    note: Si possono indicare insieme giorno della settimana e data, separati da una virgola, proprio come in italiano.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Per giorni e date non serve «de»
    gloss: 'Giorni e date non vogliono «de»: venerdì, primo agosto.'
    note: 'Un utile contrasto con la regola dell''Unità 2: i numeri da 20 in su vogliono *de* prima di un nome comune (*treizeci de ani*), mentre un giorno della settimana o una data si uniscono direttamente, senza alcun *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Chiedi quando è la riunione
    gloss: Ana chiede a Mihai quando è la loro riunione.
    note: 'Una domanda semplice e neutra: este non cambia tra tu e dumneavoastră.'
  ro.a1.unit03.lesson03.teach.line02:
    title: Dire la data
    gloss: Mihai dice che la riunione è venerdì, primo agosto.
    note: 'Mihai riprende lo schema della data della lezione 2: giorno della settimana, poi întâi + mese, senza de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Conferma e chiudi
    gloss: Ana lo ringrazia e lo saluta.
    note: La revedere, già vista nell'Unità 1, chiude lo scambio come sempre.
  ro.a1.unit03.lesson03.teach.line04:
    title: Chiudi l'incontro
    gloss: Mihai la saluta a sua volta, usando il nome di Ana.
    note: Ripetere la revedere aggiungendo il nome dell'altra persona è un modo naturale e cordiale di chiudere.
