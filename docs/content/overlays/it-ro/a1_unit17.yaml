teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Ripasso: este, la, Mihai'
    gloss: este (è) · la (a, in) · Mihai (nome)
    note: Este viene dalle Unità 3, 4 e 8; la dall'Unità 4, *la ora nouă* (alle nove); Mihai è il nome del personaggio, presente dall'Unità 1. Questa unità riutilizza tutte e tre le parole per parlare del suo lavoro.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Ripasso: lucrez, lucrează'
    gloss: lucrez (lavoro) · lucrează (lavora)
    note: 'Entrambe vengono dalla routine quotidiana dell''Unità 10 (*Lucrez seara.*): qui si riutilizzano per parlare della professione invece che del momento della giornata.'
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Ingegnere
    gloss: ingegnere
    note: 'Maschile: in questa unità lo usa solo Mihai (*Sunt inginer*), quindi per ora non serve la forma femminile.'
    example_gloss:
    - Mihai è un ingegnere.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Ufficio
    gloss: ufficio
    note: Il luogo in cui lavora Mihai, con la preposizione *la* (a, in) già vista nell'Unità 4.
    example_gloss:
    - Lavora in ufficio.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai è un ingegnere. Lavora in ufficio.
    gloss: Mihai è un ingegnere. Lavora in ufficio.
    note: Ogni parola qui era già stata insegnata o è appena stata introdotta, e le parole sono combinate in due nuove frasi sul lavoro di Mihai.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Ripasso: sunt, unde, Ana'
    gloss: sunt (sono) · unde (dove) · Ana (nome)
    note: Sunt viene dall'Unità 16 (*Sunt bolnav*); unde dalle Unità 7 e 8 (*Unde pot să cumpăr...?*, *Unde este...?*); Ana è il nome del personaggio, presente dall'Unità 1. Questa unità riutilizza tutte e tre le parole per parlare del lavoro di Ana.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Insegnante
    gloss: insegnante (femminile)
    note: 'Femminile: in questa unità lo usa solo Ana (*Sunt profesoară*), quindi per ora non serve la forma maschile.'
    example_gloss:
    - Sono un'insegnante.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: Scuola
    gloss: Scuola
    note: Il luogo di lavoro di Ana; *la* si usa come in *la birou*.
    example_gloss:
    - Lavoro a scuola.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Sono un'insegnante. Lavoro a scuola.
    gloss: Sono un'insegnante. Lavoro a scuola.
    note: Ana parla del suo lavoro unendo le due parole nuove di questa lezione a *sunt*, già visto nell'Unità 16.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: Dove lavora?
    gloss: Dove lavora? (forma di cortesia)
    note: '*Lucrați* è la forma di cortesia di «lavora/lavorate», con la stessa desinenza -ați/-eți già vista in *aveți* e *faceți*: serve per chiedere a chiunque che lavoro fa.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Ripasso: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (ciao) · Ce mai faceți? (come sta?, forma di cortesia) · Bine, mulțumesc (bene, grazie)
    note: Tutte espressioni del saluto iniziale dell'Unità 1, riprese qui per aprire il dialogo di questa unità.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Ripasso: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (e Lei?) · La revedere (arrivederci)
    note: Entrambe dall'Unità 1, riprese qui come domanda di rimando e come saluto finale.
  ro.a1.unit17.lesson03.teach.line01:
    title: Salutare e chiedere come sta
    gloss: Ana saluta Mihai e gli chiede come sta.
    note: Riprende il saluto *Ce mai faceți?* dell'Unità 1.
  ro.a1.unit17.lesson03.teach.line02:
    title: Rispondere e chiedere dove lavora lei
    gloss: Mihai risponde, poi chiede ad Ana dove lavora.
    note: Unisce *Bine, mulțumesc* dell'Unità 1 e *Unde lucrați?* di questa unità.
  ro.a1.unit17.lesson03.teach.line03:
    title: Dire il proprio lavoro e dove si lavora, poi chiedere all'altro
    gloss: Ana dice che lavora in una scuola come insegnante, poi fa la stessa domanda a Mihai.
    note: Unisce la frase della lezione 2 di questa unità e *Și dumneavoastră?* dell'Unità 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Dire il proprio lavoro e dove si lavora
    gloss: Mihai dice che lavora in un ufficio come ingegnere.
    note: Riprende quasi identica la frase della lezione 1 di questa unità.
  ro.a1.unit17.lesson03.teach.line05:
    title: Chiudere la conversazione
    gloss: Ana saluta.
    note: Lo stesso schema di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
  ro.a1.unit17.lesson03.teach.line06:
    title: Salutare
    gloss: Mihai saluta.
    note: Lo stesso schema di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
