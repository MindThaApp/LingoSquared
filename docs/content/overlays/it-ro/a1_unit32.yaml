    title: L'uccellino di Nina
teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Animal* è la parola generica; *animal de companie* («animale da compagnia») indica specificamente un animale domestico. Il plurale è *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Ana ha un cane.
    - Andrei ha un gatto.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: 'Lo stesso schema di domanda *Ai ...?* che già conosci: *a avea* (avere) + un nome.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: Dopo *nu am*, *niciun* («nemmeno uno») nega il nome; vedi la nota di grammatica.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: senza articolo'
    gloss: 'Dopo nu am non si usa un né o: Nu am timp, nu am niciun animal de companie.'
    note: 'Riprende lo schema già visto in *Nu am timp*: non è grammatica nuova, solo un nuovo nome a cui applicarla.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: '*A scoate la plimbare* è un''espressione fissa; vedi la nota di grammatica.'
    example_gloss: Porto a spasso il cane ogni giorno.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: Il verbo cambia con la persona
    gloss: 'Il verbo cambia con la persona: eu scot, tu scoți, el scoate (porto, porti, porta) il cane a spasso.'
    note: 'I verbi rumeni cambiano desinenza a seconda della persona, quindi *a scoate la plimbare* si coniuga come un unico verbo: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Giocare con
    gloss: giocare con
    example_gloss: Andrei gioca con il suo gatto.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: Unisce *a scoate la plimbare* a *în fiecare zi* (ogni giorno), già visto in un'unità precedente.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: 'Unisce *a da de mâncare* a *în fiecare zi*; l''animale va al dativo: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Plurale: câine → câini, animal → animale, pisică → pisici.'
    note: Lo schema regolare del plurale rumeno, presentato qui per la prima volta con nomi di animali come esempi.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Mihai ama i cani.
    - Elena ama i gatti.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*A iubi* («amare») introduce il complemento senza preposizione: *Iubesc animalele*; l''articolo *-le* indica che si parla degli animali in generale.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena ama i gatti, ma non ha animali domestici
    gloss: Elena ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai chiede di un animale domestico
    gloss: 'Mihai: Hai un animale domestico, Ana?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana ha un cane
    gloss: 'Ana: Sì, ho un cane.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai chiede com'è
    gloss: 'Mihai: Com''è?'
    note: Riprende la domanda *Cum arată ...?* dell'unità sull'aspetto, ora rivolta a un animale.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana descrive il suo cane
    gloss: 'Ana: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El ed ea per gli animali
    gloss: 'Per un animale si usa el o ea, a seconda del genere: câinele è el, pisica è ea.'
    note: Finora in questo corso *el* ed *ea* si riferivano a persone; qui si estendono agli animali, seguendo il genere del nome.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai chiede delle passeggiate
    gloss: 'Mihai: Lo porti a spasso ogni giorno?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana descrive la sua routine
    gloss: 'Ana: Sì, lo porto a spasso ogni giorno e gli do da mangiare.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena e Andrei parlano di animali
    gloss: 'Mihai ed Elena amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Mihai ama i cani ed Elena ama i gatti. Andrei, invece, ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. E tu, hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      iubesc: adorare / piacere molto
      amândoi: entrambi
      animalele: animali
      doi: entrambi
      companie: animale domestico
      câinii: cani
      pisicile: gatti
      pisică: gatto
      joacă: gioca
      dă: dà
      fiecare: ogni / tutti
      mâncare: cibo
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei gioca spesso con il suo gatto
    gloss: Andrei gioca spesso con il suo gatto.
    note: '*Des* («spesso») riprende la parola di frequenza dell''unità sugli hobby; *a se juca cu* («giocare con») è un verbo riflessivo.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana chiede a Nina
    gloss: 'Ana: Nina, hai anche tu un animale domestico?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*O cheamă* («si chiama») riprende il verbo *a chema* usato per dire il nome; un uccello è femminile in rumeno, quindi il pronome è *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai reagisce
    gloss: 'Mihai: Che bello! Che cosa fai con lei ogni giorno?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Anche Mihai ama gli uccelli
    gloss: 'Mihai: Anch''io amo gli uccelli.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana chiude la conversazione
    gloss: 'Ana: Che bello che tutti e tre amiamo gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
