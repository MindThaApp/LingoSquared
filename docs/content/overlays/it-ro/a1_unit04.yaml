answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumeno A1
  description: 'Come chiedere e dire l''ora in rumeno: ore piene, e mezza, e un quarto, meno un quarto, momenti della giornata e come chiedere quando inizia qualcosa. Continuiamo con Ana e Mihai, che stabiliscono quando comincia il loro corso di rumeno.'
units:
  ro.a1.unit04.time:
    title: Dire l'ora
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: Ore piene e mezza
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Un quarto e come si chiede l'ora
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: Quando inizia il corso?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Ripasso: este'
    gloss: è / sono (con le ore)
    note: '*Este* è già comparso nell''Unità 2 e nell''Unità 3. Resta sempre la stessa parola, sia che tu dica un numero, un giorno, una data o, ora, l''ora.'
  ro.a1.unit04.lesson01.teach.ora:
    title: L'ora
    gloss: l'ora
    note: 'Sostantivo femminile: *ora* si mette subito davanti al numero per dire l''ora, per esempio *ora unu* (l''una).'
    example_gloss: È l'una.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: L'una
    gloss: l'una
    note: 'Alla lettera «l''ora uno»: prima viene ora, poi il numero.'
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Le due in punto
    gloss: le due
    note: 'Qui il numero prende la forma femminile, *două*, per concordare con il femminile *ora*: lo schema completo è nella scheda successiva.'
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Una vera irregolarità: unu resta unu'
    gloss: ora unu (non «ora una») / ora două (non «ora doi»)
    note: 'I numeri che hanno una forma femminile di solito la usano con un sostantivo femminile (*doi* → *două* con un nome femminile come *ora*), ma *unu* è l''unica eccezione quando si dice l''ora: si dice sempre *ora unu*, mai *ora una*, anche se *ora* è femminile.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Le tre in punto
    gloss: le tre
    note: 'Trei non cambia forma ttra maschile e femminile, a differenza di unu/una o doi/două: una cosa in meno da ricordare.'
  ro.a1.unit04.lesson01.teach.jumatate:
    title: Mezza
    gloss: mezza, metà
    note: 'Si usa con și (e) per dire «e mezza»: X și jumătate.'
    example_gloss: L'una e mezza.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: L'una e mezza
    gloss: È l'una e mezza.
    note: 'Alla lettera «È l''una e mezza»: è lineare e corrisponde all''italiano.'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Chiedere l'ora
    gloss: Che ore sono?
    note: 'Il modo più comune per chiedere l''ora: cât (quanto, parente di câți dell''Unità 2) + este + ora (l''ora).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: Un quarto
    gloss: un quarto
    note: Un quarto d'ora, cioè 15 minuti. Si combina con și (e) o fără (senza) per dire «e un quarto» o «meno un quarto».
    example_gloss: È l'una e un quarto.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și e fără con un quarto o la metà
    gloss: și un sfert = +15 minuti · fără un sfert = −15 minuti
    note: '*Și* (e) aggiunge minuti all''ora appena passata; *fără* (senza) conta i minuti all''indietro a partire dall''ora che sta per arrivare: è la stessa logica dell''italiano «e un quarto» e «meno un quarto».'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Le due e un quarto
    gloss: Sono le due e un quarto.
    note: Ora două (le 2:00) più și un sfert (+15 minuti) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Senza / meno
    gloss: senza, meno
    note: Conta i minuti all'indietro a partire dall'ora SUCCESSIVA, con la stessa funzione di «meno» in «le tre meno un quarto».
    example_gloss: Sono le tre meno un quarto.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Le tre meno un quarto
    gloss: Sono le tre meno un quarto.
    note: 'Ora trei (3:00) meno fără un sfert (−15 minuti) = 2:45: il rumeno nomina l''ora verso cui si sta contando, non quella appena passata.'
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Chiedere a che ora
    gloss: A che ora?
    note: 'La (a) + ce (che) + oră (un''ora, forma indeterminata qui, non ora): il modo più comune per chiedere quando succede qualcosa.'
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Dire quando succede qualcosa
    gloss: Alle nove.
    note: 'La (a) + ora (l''ora, forma determinata qui) + il numero: lo schema per rispondere a «La ce oră?».'
  ro.a1.unit04.lesson02.teach.tarziu:
    title: In ritardo
    gloss: tardi
    note: Una parola di reazione comune e utile quando si controlla l'ora.
    example_gloss: È tardi!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Ripasso: când'
    gloss: quando?
    note: Când è già comparso nell'Unità 3 per chiedere quando si svolge un evento; qui ritorna per chiedere quando inizia qualcosa.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Le parti della giornata
    gloss: la mattina / il pomeriggio / la sera / la notte
    note: 'Ognuna di queste parole è la forma determinata del nome usata come avverbio: il rumeno dice «la mattina» in modo semplice, senza preposizione.'
    example_gloss:
    - Il corso è la mattina.
    - Il corso è il pomeriggio.
    - Mihai lavora la sera.
    - Ana dorme la notte.
  ro.a1.unit04.lesson03.teach.cursul:
    title: La lezione
    gloss: il corso
    note: 'La forma determinata di curs (un corso, una lezione): qui è il corso di rumeno di Ana e Mihai.'
    example_gloss: La lezione inizia alle nove.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Inizia
    gloss: inizia, comincia
    note: 'È la forma del presente per lui, lei o esso: qualsiasi soggetto singolare che non sia io o tu, come cursul (il corso).'
    example_gloss: Il corso inizia la mattina.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Chiedere quando inizia il corso
    gloss: Quando inizia il corso?
    note: Unisce când con începe e cursul, le novità di questa lezione.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Dire quando inizia il corso
    gloss: Il corso inizia alle nove, la mattina.
    note: Un avverbio di momento (dimineața) aggiunto in fondo, separato da una virgola, come nell'Unità 3 si aggiungeva la data dopo il giorno della settimana.
  ro.a1.unit04.lesson03.teach.line01:
    title: Chiedere quando inizia il corso
    gloss: Ana chiede a Mihai quando inizia il corso.
    note: 'Una domanda semplice e neutra: este e începe non cambiano con tu o dumneavoastră.'
  ro.a1.unit04.lesson03.teach.line02:
    title: Dire l'ora
    gloss: Mihai dice che il corso inizia alle nove, la mattina.
    note: 'Mihai riprende lo schema di questa lezione: ora e momento della giornata.'
  ro.a1.unit04.lesson03.teach.line03:
    title: Ringraziare e chiudere
    gloss: Ana lo ringrazia e lo saluta.
    note: La revedere, introdotto nell'Unità 1, chiude lo scambio come sempre.
  ro.a1.unit04.lesson03.teach.line04:
    title: Chiudere l'incontro
    gloss: Mihai ricambia il saluto, usando il nome di Ana.
    note: Riprendere la revedere con il nome dell'altra persona è un modo naturale e cordiale di chiudere.
