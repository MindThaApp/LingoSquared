answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Rumeno A1
  description: I numeri da zero a cento, compresi i modelli di formazione dei numeri da undici a diciannove (-sprezece) e delle decine (-zeci), l'opposizione di genere doi/două, e l'uso dei numeri per chiedere e dire l'età e il numero di telefono, in continuità con Ana e Mihai dell'unità 1.
units:
  ro.a1.unit02.numbers:
    title: I numeri
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: I numeri da zero a dieci
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: I numeri da undici a cento
  ro.a1.unit02.lesson03.age_and_phone:
    title: Età e numero di telefono
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: '*Zero* è invariabile e si usa anche per leggere una cifra all''interno di un numero più lungo o di un numero di telefono.'
    example_gloss: Zero, uno, due.
  ro.a1.unit02.lesson01.teach.unu:
    title: Uno
    gloss: uno
    note: '*Unu* è la forma usata quando si conta da soli. Davanti a un nome maschile o neutro diventa *un* (*un câine*, un cane); davanti a un nome femminile diventa *o* (*o sută*, cento).'
    example_gloss: Uno, due, tre.
  ro.a1.unit02.lesson01.teach.doi:
    title: Due (maschile)
    gloss: due
    note: '*Doi* si usa con i nomi maschili (*doi bărbați*, due uomini). I nomi femminili, e i neutri, che al plurale si comportano come femminili, hanno un''altra forma: vedi la scheda successiva.'
    example_gloss: Due, tre, quattro.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: Due cambia secondo il genere
    gloss: doi (maschile) / două (femminile e neutro)
    note: A differenza dell'italiano «due», che è invariabile, il rumeno *doi* ha una forma femminile distinta, *două*, obbligatoria con i nomi femminili (*două femei*, due donne) e anche con i neutri, che al plurale sono femminili (*două numere*, due numeri). Oltre a uno (*un*/*o*) e due, i numeri da *trei* a *zece* restano uguali per ogni genere.
  ro.a1.unit02.lesson01.teach.trei:
    title: Tre
    gloss: tre
    note: '*Trei* è invariabile per ogni genere.'
    example_gloss: Tre, quattro, cinque.
  ro.a1.unit02.lesson01.teach.patru:
    title: Quattro
    gloss: quattro
    note: '*Patru* è invariabile. Attenzione alla sua forma contratta irregolare tra i numeri da 11 a 19: *paisprezece* (14), non *patrusprezece*.'
    example_gloss: Quattro, cinque, sei.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Cinque
    gloss: cinque
    note: '*Cinci* è invariabile.'
    example_gloss: Cinque, sei, sette.
  ro.a1.unit02.lesson01.teach.sase:
    title: Sei
    gloss: sei
    note: '*Șase* è invariabile.'
    example_gloss: Sei, sette, otto.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Sette
    gloss: sette
    note: '*Șapte* è invariabile.'
    example_gloss: Sette, otto, nove.
  ro.a1.unit02.lesson01.teach.opt:
    title: Otto
    gloss: otto
    note: '*Opt* è invariabile.'
    example_gloss: Otto, nove, dieci.
  ro.a1.unit02.lesson01.teach.noua:
    title: Nove
    gloss: nove
    note: '*Nouă* è invariabile. Scritto senza il segno diacritico sarebbe identico a *noua* ("la nuova", femminile): scrivi quindi la *ă*, perché le risposte digitate vengono controllate con i segni diacritici.'
    example_gloss: Nove, dieci... fatto!
  ro.a1.unit02.lesson01.teach.zece:
    title: Dieci
    gloss: dieci
    note: '*Zece* è invariabile e costituisce la base di tutti i numeri da undici in poi (*zece* + *-sprezece*).'
    example_gloss: Dieci! Bravo!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Undici
    gloss: undici
    note: '*Unsprezece* si costruisce letteralmente con *unu* + *spre* + *zece* ("uno su dieci"), lo schema che seguono tutti i numeri da qui in poi fino a diciannove.'
    example_gloss: Dieci, undici, dodici.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: Da dodici a diciannove
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'Ogni numero da 12 a 19 unisce *-sprezece* alla forma normale della cifra: *doi* → *doisprezece*, *trei* → *treisprezece* e così via fino a *nouă* → *nouăsprezece*. Due numeri sono irregolari: quattordici, dove *patru* si abbrevia in *pai-* (*paisprezece*, non *patrusprezece*), e sedici, dove *șase* diventa *șai-* (*șaisprezece*, non *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Venti
    gloss: venti
    note: '*Douăzeci* ("due decine") è una parola a sé, la base su cui si costruiscono i numeri da 21 a 29.'
    example_gloss: Diciannove, venti...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Ventuno
    gloss: ventuno
    note: 'Da ventuno in poi il rumeno unisce la decina e l''unità con *și* ("e"): *douăzeci și unu*, *douăzeci și doi* e così via. I numeri da 12 a 19, invece, si fondono in una sola parola.'
    example_gloss: Venti, ventuno, ventidue.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: Da trenta a novanta
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Ogni decina da trenta in su è formata dalla cifra più *-zeci* ("decine"): *trei* → *treizeci*, *patru* → *patruzeci* e così via. L''unica variazione ortografica è sessanta: *șase* diventa *șai-*, e si ha *șaizeci* (lo stesso *șai-* di *șaisprezece*). Come in italiano, 70, 80 e 90 hanno parole regolari, senza contare per venti come in francese.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Cento
    gloss: cento
    note: '*O sută* usa *o* (la forma femminile di "uno/un") e non *un*, perché *sută* è un sostantivo femminile.'
    example_gloss: Novanta, cento!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Chiedere l'età (informale)
    gloss: Quanti anni hai?
    note: 'Alla lettera «quanti anni hai», con *avea* (avere): lo stesso schema di *avoir* in francese, e come in italiano si usa avere per l''età invece di essere. *Câți* (quanti, maschile) concorda con *ani* (anni, maschile).'
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Dire la propria età (sotto i venti)
    gloss: Ho diciannove anni.
    note: '*Am* è la forma di *avea* per *eu*. Per i numeri sotto il venti non serve *de* prima di *ani*.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Chiedere l'età (formale)
    gloss: Quanti anni hai?
    note: '*Aveți* è la forma di *avea* per *dumneavoastră*, coerente con il registro di cortesia introdotto nell''Unità 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Dire la propria età (da venti in su)
    gloss: Ho trent'anni.
    note: 'Qui compare *de* perché *treizeci* è venti o più: la regola completa è nella scheda successiva.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Quando aggiungere de davanti a un sostantivo
    gloss: '2-19: senza de (doi ani) / da 20: con de (treizeci de ani)'
    note: 'Una regola tipica del rumeno, senza corrispondenza in italiano: i numeri da 2 a 19 si legano direttamente al sostantivo (*doi ani*, due anni; *nouăsprezece ani*, diciannove anni), ma da 20 in su serve *de* tra numero e sostantivo (*treizeci de ani*, trent''anni; *o sută de ani*, cento anni). Il numero uno è un caso a parte (*un an*, un anno: singolare, senza *de* in ogni caso).'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Chiedere il numero di telefono in modo informale
    gloss: Qual è il tuo numero di telefono?
    note: '*Care* (quale) è il modo naturale per chiedere un numero preciso che esiste già, non *ce*. *Număr* è un sostantivo neutro: al singolare concorda come un maschile, quindi *tuo* si dice *tău*, non *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Chiedere il numero di telefono in modo formale
    gloss: Qual è il tuo numero di telefono?
    note: '*Este* è la forma piena di *e*, più comune nel parlato curato o formale. *Dumneavoastră* mantiene lo scambio cortese, la stessa parola vista nell''Unità 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Dire un numero di telefono cifra per cifra
    gloss: 'È: zero, sette, due, uno, quattro, cinque, sei, sette, otto, nove.'
    note: In questa unità si leggono semplicemente le cifre una per una, una semplificazione analoga a quella adottata per i registri nell'Unità 1. Chi telefona può anche raggruppare le cifre a coppie, ma le cifre singole si capiscono sempre.
