teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Chiamare
    gloss: chiamare
    note: L'infinito del verbo per fare una telefonata.
    example_gloss: Devo chiamarti.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Dire che chiamerai
    gloss: Ti chiamo io.
    note: '*Sun* è la forma di *eu* di *a suna* (chiamare); *te* ("ti") va davanti al verbo, e il rumeno usa il presente dove l''italiano può usare il futuro ("ti chiamo" / "ti chiamerò").'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Rispondere al telefono
    gloss: Pronto, sono Ana.
    note: '*Alo* si usa per rispondere al telefono; *sunt* + nome dice chi sei, come "sono" in italiano.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai risponde allo stesso modo
    gloss: Pronto, sono Mihai.
    note: Lo stesso schema *Alo, sunt* + nome di *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Chiedere chi sta chiamando
    gloss: Con chi parlo?
    note: '*Cu cine vorbesc?* (letteralmente "con chi parlo?") è il modo normale per chiedere chi è una persona sconosciuta che chiama.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Presentarsi in modo formale
    gloss: Sta parlando con Ana.
    note: '*Vorbiți cu* + nome è la risposta formale: *vorbiți* è la forma di *dumneavoastră* (Lei) di *a vorbi* (parlare).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: '*Poți să* ... (Puoi ...?) + *repeți* (ripeti) + *asta* (questo).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Chiedere a qualcuno di rallentare
    gloss: Non parlare così in fretta, per favore.
    note: '*Nu vorbi* ("non parlare") è *nu* + la forma di *tu*; *atât de repede* significa "così in fretta".'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Dire che non senti bene
    gloss: Non ti sento bene.
    note: '*Nu te aud bine*: *aud* è "sento", *te* ("ti") va davanti al verbo e *bine* significa "bene".'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: Messaggio
    gloss: il messaggio
    note: '*Mesaj* è maschile al singolare e femminile al plurale (*un mesaj*, *două mesaje*); l''articolo determinativo si attacca alla fine: *mesajul*.'
    example_gloss: Il messaggio è di Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Dire che manderai un messaggio
    gloss: Ti mando un messaggio.
    note: '*Îți* ("a te") è un pronome dativo posto davanti al verbo: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Dire che richiamerai
    gloss: Ti chiamo più tardi.
    note: '*Înapoi* ("indietro") segue il verbo: *te sun înapoi* è "ti richiamo", e *mai târziu* significa "più tardi".'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Leggi uno scambio di messaggi
    gloss: 'Mihai: Ciao Ana, puoi chiamarmi? Devo dirti una cosa. Ana: Sì, certo, ti richiamo tra cinque minuti.'
    note: Individua che cosa chiede Mihai, perché lo chiede e quando Ana dice che richiamerà.
    glosses:
      Salut: ciao
      poți: puoi
      suna: chiamare
      Trebuie: devo
      ceva: qualcosa
      spun: raccontare
      sigur: certo
      sun: chiamare
      cinci: cinque
      minute: minuti
      înapoi: restituire
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai risponde alla chiamata
    gloss: 'Mihai: Pronto, sono Mihai.'
    note: 'Lo stesso schema *Alo, sunt* + nome della prima lezione, ora in una vera chiamata: chi risponde parla per primo e dice il proprio nome.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana si presenta
    gloss: 'Ana: Ciao Mihai, sono Ana. Mihai: Che bello che chiami!'
    note: '*Ce bine că* ... ("che bene che ...") esprime una reazione positiva a un fatto; *suni* è la forma di *tu* di *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana chiede del turno
    gloss: 'Ana: Com''è andato il tuo primo turno?'
    note: '*A fost* significa "è stato" (passato di *a fi*). È un perfect compus, formato come *am mâncat*; vedi la nota dopo la prossima battuta.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai dà una buona notizia
    gloss: 'Mihai: È andato molto bene, meglio di quanto pensassi.'
    note: '*A mers* è il passato di *a merge* (andare, qui "andare a finire"); *credeam* significa "pensavo" (una forma di passato di *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Forme del passato: a fost, a mers, credeam'
    gloss: è stato → essere, è andato → andare, pensavo → pensare
    note: '*A fost* e *a mers* sono forme di perfect compus (*a* + participio) e *credeam* è un imperfect. Per ora memorizzale come espressioni fisse nei contesti in cui compaiono in questa lezione; le regole complete del passato arriveranno a un livello successivo.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana è orgogliosa
    gloss: 'Ana: Che bello sentirlo! Sono fiera di te.'
    note: '*Mândră de* ("fiera di") è una combinazione fissa; *de* è obbligatorio. Un uomo dice *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai è commosso
    gloss: 'Mihai: Grazie, significa molto per me.'
    note: '*Înseamnă* è la forma di lui/lei/esso di *a însemna* (significare); *pentru mine* ("per me") dice per chi è importante.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Il suo
    gloss: Il suo primo turno è andato molto bene.
    note: '*Lui* dopo il nome significa "suo" (di lui): *prima lui tură*. (Per "di lei" si usa *ei*.)'
