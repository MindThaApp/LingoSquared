teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Ripasso: unde, este'
    gloss: unde (dove) · este (è)
    note: 'Entrambe già viste: *unde* in *Unde pot să cumpăr ...?* dell''Unità 7, *este* dall''Unità 3 e 4. Qui si uniscono nella domanda chiave di questa unità sulla posizione.'
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: Dov'è...?
    gloss: Unde este...? (Dov'è...?)
    note: 'Il modo di tutti i giorni per chiedere dove si trova qualcosa: aggiungi il nome del luogo dopo *este*, oppure usala da sola così quando il luogo è già chiaro dal contesto.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Stazione, negozio, banca
    gloss: gară (stazione) · magazin (negozio) · bancă (banca)
    note: 'Tre luoghi comuni: quando si parla di uno preciso e noto, prendono l''articolo determinativo: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - Dov'è la stazione?
    - Il negozio è vicino.
    - La banca è lontana.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Vicino, lontano
    gloss: aproape (vicino) · departe (lontano)
    note: Un modo semplice per dire quanto un luogo è vicino o lontano, senza dare indicazioni precise.
    example_gloss:
    - Il negozio è vicino.
    - La banca è lontana.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: Il negozio è vicino
    gloss: Magazinul este aproape. (Il negozio è vicino.)
    note: 'Un''affermazione breve e completa: dopo *aproape* non serve il nome del luogo quando è già chiaro quale intendi.'
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: La banca è lontana
    gloss: Banca este departe. (La banca è lontana.)
    note: Il contrario di *aproape*, con lo stesso schema semplice.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: Dov'è la stazione?
    gloss: Unde este gara? (Dov'è la stazione?)
    note: Unisce *Unde este...?* e *gara* in un'unica domanda completa.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Ospedale, ufficio postale, biblioteca, fermata dell'autobus
    gloss: spital (ospedale) · poștă (ufficio postale) · bibliotecă (biblioteca) · stație de autobuz (fermata dell'autobus)
    note: 'Altri quattro luoghi comuni: come gară/magazin/bancă, per indicarne uno preciso prendono l''articolo determinativo: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - L'ospedale è di fronte al negozio.
    - L'ufficio postale è tra il negozio e l'ospedale.
    - La biblioteca è vicino alla stazione.
    - La fermata dell'autobus è accanto alla biblioteca.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: Accanto, di fronte, tra
    gloss: lângă (accanto a) · vizavi de (di fronte a) · între (tra)
    note: Tre modi per collocare un luogo rispetto a un altro. *Vizavi de* e *între* hanno bisogno di *de*/*și* per collegarsi al secondo luogo; *lângă* si collega direttamente.
    example_gloss:
    - Il negozio è accanto alla stazione.
    - L'ospedale è di fronte al negozio.
    - L'ufficio postale è tra il negozio e l'ospedale.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: Il negozio è accanto alla stazione
    gloss: Magazinul este lângă gară. (Il negozio è accanto alla stazione.)
    note: '*Lângă* si collega direttamente al nome del luogo, senza bisogno di altre parole.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: L'ospedale è di fronte al negozio
    gloss: Spitalul este vizavi de magazin. (L'ospedale è di fronte al negozio.)
    note: '*Vizavi de* richiede *de* prima del secondo luogo.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: L'ufficio postale è tra il negozio e l'ospedale
    gloss: Poșta este între magazin și spital. (L'ufficio postale è tra il negozio e l'ospedale.)
    note: '*Între* indica due luoghi uniti da *și* (e).'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: La fermata dell'autobus è accanto alla biblioteca
    gloss: Stația de autobuz este lângă bibliotecă. (La fermata dell'autobus è accanto alla biblioteca.)
    note: Lo stesso schema con *lângă* usato per il negozio e la stazione, ora con la fermata dell'autobus e la biblioteca.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Ripasso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · da (sì) · Ana, Mihai (nomi)
    note: 'Tutto già visto nelle unità precedenti: qui Ana e Mihai si incontrano di nuovo, questa volta nel quartiere.'
  ro.a1.unit08.lesson03.teach.line01:
    title: Salutare e chiedere dov'è l'ufficio postale
    gloss: Ana saluta Mihai e chiede dov'è l'ufficio postale.
    note: Unisce *Unde este* di questa unità al saluto dell'Unità 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: Indicare il luogo
    gloss: Mihai dice che l'ufficio postale è tra il negozio e l'ospedale.
    note: Riprende la costruzione *poșta*/*între ... și* di questa unità.
  ro.a1.unit08.lesson03.teach.line03:
    title: Chiedi della biblioteca
    gloss: Ana chiede se la biblioteca è vicina.
    note: Una breve domanda di seguito che riutilizza *este* e *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Conferma e aggiungi altro
    gloss: Mihai conferma che la biblioteca è vicina alla stazione e aggiunge che la fermata dell'autobus è accanto alla biblioteca.
    note: Unisce in una sola frase *aproape de* e *lângă*, due preposizioni di questa unità.
  ro.a1.unit08.lesson03.teach.line05:
    title: Ringrazia e concludi
    gloss: Ana ringrazia Mihai e lo saluta.
    note: Qui *Mulțumesc* è un semplice ringraziamento di chiusura, la stessa parola di *Bine, mulțumesc.* dell'Unità 1.
  ro.a1.unit08.lesson03.teach.line06:
    title: Concludi l'incontro
    gloss: Mihai ricambia il saluto, usando il nome di Ana.
    note: La stessa formula di chiusura cordiale con cui finivano i dialoghi delle Unità 1, 5, 6 e 7.
