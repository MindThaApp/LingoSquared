answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: Rumeno A1
  description: Descrivere il tempo in romeno -- Vreme (tempo atmosferico), Soare (sole/soleggiato), Cald (caldo), Plouă (piove), Vânt (vento) e Frig (freddo) -- mentre Ana e Mihai controllano le previsioni di domani e decidono quando andare al parco.
units:
  ro.a1.unit19.weather:
    title: Il tempo
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: Il tempo di oggi
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: Il tempo di domani
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: Il programma di sabato
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Ripasso: Ana, Este, Și'
    gloss: Ana (nome) · Este (è) · Și (e)
    note: Ana è il nome del personaggio, presente fin dall'Unità 1; *este* viene dai contenuti sui luoghi dell'Unità 8; *și* dall'Unità 5. In questa unità si riutilizzano tutti e tre per descrivere il tempo di oggi.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Ripasso: Astăzi'
    gloss: Astăzi (oggi)
    note: Dal lessico delle date dell'Unità 3, qui riutilizzato per parlare del tempo di oggi.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: Il tempo
    gloss: Vreme (tempo atmosferico)
    note: '*Vremea* è la forma determinata di *vreme*, «il tempo»: un sostantivo femminile in -e aggiunge -a, come *baie* → *baia* (il bagno) nell''Unità 18.'
    example_gloss:
    - Che tempo fa?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: Che tempo fa?
    gloss: Cum este vremea? (Che tempo fa?)
    note: 'Il modo più comune per chiedere che tempo fa: *cum* viene dalle Unità 1, 9 e 12.'
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Sole / soleggiato
    gloss: Soare (sole / soleggiato)
    note: 'Si usa con *este* per descrivere il tempo soleggiato: *Este soare* significa letteralmente «è sole», cioè «c''è il sole».'
    example_gloss:
    - Oggi c'è il sole.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Caldo
    gloss: Cald (caldo)
    note: 'Una parola del tempo invariabile: *Este cald* usa sempre questa stessa forma, senza concordanza.'
    example_gloss:
    - Oggi fa caldo.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Oggi c'è il sole. Fa caldo.
    gloss: Astăzi este soare. Este cald.
    note: Tutte le parole di queste frasi sono già state insegnate o appena introdotte, combinate in due nuove frasi che descrivono il tempo di oggi.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Ripasso: Mihai, Mâine'
    gloss: Mihai (nome) · Mâine (domani)
    note: Mihai è il nome del personaggio, presente fin dall'Unità 1; *mâine* viene dalle Unità 3 e 12. In questa unità si riutilizzano entrambi per descrivere le previsioni di domani.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Ripasso: Nu, Mergem, La parc'
    gloss: Nu (no / non) · Mergem (andiamo) · La parc (al parco)
    note: Tutto dal lessico dell'Unità 11 per mettersi d'accordo sui programmi, qui riutilizzato per decidere se il tempo permette di andare al parco.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Piove
    gloss: Plouă (piove)
    note: 'Una forma verbale impersonale: non serve il soggetto, come per *Este cald*.'
    example_gloss:
    - Domani piove.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Vento
    gloss: Vânt (vento)
    note: 'Si usa con *este* come *soare*: *Este vânt*, «c''è vento».'
    example_gloss:
    - Domani c'è vento.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Freddo
    gloss: Frig (freddo)
    note: 'Si usa con *este*: *Este frig*, «fa freddo».'
    example_gloss:
    - Domani fa freddo.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Domani piove. C'è vento e fa freddo.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Tutte le parole di queste frasi sono già state insegnate o appena introdotte, combinate in una previsione completa per domani.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Domani non andiamo al parco.
    gloss: Nu mergem la parc mâine. (Domani non andiamo al parco.)
    note: 'Il programma legato al tempo a cui punta questa lezione: riprende *mergem* e *la parc* dell''Unità 11, con *nu* davanti.'
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Ripasso: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (ciao) · Ce mai faceți? (come sta?) · Bine, mulțumesc (bene, grazie)
    note: Tutto dai saluti iniziali dell'Unità 1, qui riutilizzati per aprire il dialogo di questa unità.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Ripasso: Sâmbătă, La revedere'
    gloss: Sâmbătă (sabato) · La revedere (arrivederci)
    note: '*Sâmbătă* viene dalle Unità 3, 11 e 12; *la revedere* dall''Unità 1. Entrambi sono riutilizzati nel dialogo sul programma del fine settimana.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Saluta Mihai e chiedigli come sta
    gloss: Ana saluta Mihai e gli chiede come sta.
    note: Riprende il saluto *Ce mai faceți?* dell'Unità 1.
  ro.a1.unit19.lesson03.teach.line02:
    title: Rispondi e chiedi che tempo farà domani
    gloss: Mihai risponde, poi chiede ad Ana che tempo farà domani.
    note: Unisce *Bine, mulțumesc* dell'Unità 1 con la frase della prima lezione di questa unità, *Cum este vremea?*, aggiungendo *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Descrivi le previsioni di domani
    gloss: Ana gli dice che pioverà e che ci sarà vento e freddo.
    note: Riprende esattamente la frase della seconda lezione di questa unità.
  ro.a1.unit19.lesson03.teach.line04:
    title: Proponi di non andare al parco e di andare invece sabato
    gloss: Mihai dice che domani non andranno al parco e propone invece sabato.
    note: Unisce la frase della seconda lezione di questa unità con *mergem* dell'Unità 11 e con *sâmbătă* di questa unità.
  ro.a1.unit19.lesson03.teach.line05:
    title: Accetta, notando che sabato ci sarà il sole
    gloss: Ana dice che sabato ci sarà il sole e accetta il programma.
    note: Unisce *soare* con la formula di accordo *Da, bine!* dell'Unità 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Salutare
    gloss: Mihai saluta.
    note: La stessa formula di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
  ro.a1.unit19.lesson03.teach.line07:
    title: Salutare
    gloss: Ana saluta.
    note: La stessa formula di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
