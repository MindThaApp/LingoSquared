answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new grammar is entirely 1st-person (am fost/am mâncat/ am băut, invariant for singular and plural) plus one fixed 3rd- person formulaic pair (Cum a fost...?/A fost bine!) taught only as an unanalyzed set phrase. No new second-person forms are introduced. Ana and Mihai's dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/ unit10/unit11.
course:
  title: Rumeno A1
  description: 'Descrivere in romeno un fatto recente concluso: am fost (sono stato / sono andato), am mâncat (ho mangiato), am băut (ho bevuto) e lo scambio Cum a fost...? / A fost bine! per dire com''è andata. Continuano Ana e Mihai, che ripercorrono la loro domenica al parco.'
