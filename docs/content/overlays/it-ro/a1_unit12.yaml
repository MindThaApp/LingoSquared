teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Ripasso: parc, cinema'
    gloss: parc (il parco) · cinema (il cinema)
    note: Entrambe le parole sono già state introdotte nell'Unità 11; qui si combinano con la nuova grammatica del passato di questa unità.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Ripasso: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (oggi) · mâine (domani) · duminică (domenica) · sâmbătă (sabato)
    note: Tutte già introdotte nelle Unità 3 e 11; qui preparano il contrasto con *ieri* (ieri), nuovo in questa lezione.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: sono stato / sono andato
    gloss: Am fost (sono stato / sono andato)
    note: 'Il perfect compus (passato) di *a fi* (essere): *am* è lo stesso ausiliare invariabile per «io» e «noi», mentre *fost* è la forma fissa del passato. Con un luogo, *am fost la...* è il modo quotidiano e naturale per dire «sono andato a...», più comune nel parlato di un verbo di movimento letterale.'
    example_gloss:
    - Sono stato al parco.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Sono stato al parco
    gloss: Am fost la parc. (Sono stato/a al parco.)
    note: 'Lo schema completo: am fost + la + luogo.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Sono andato/a al cinema
    gloss: Am fost la cinema. (Sono stato/a al cinema.)
    note: Lo stesso schema di *Am fost la parc*, con un altro luogo.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Ieri
    gloss: Ieri (ieri)
    note: 'Già incontrata nell''Unità 3 accanto a *astăzi* (oggi) e *mâine* (domani): ora la usi con il passato, all''inizio della frase, per dire quando è successo qualcosa.'
    example_gloss:
    - Ieri sono andato/a al parco.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Ieri sono andato/a al parco
    gloss: Ieri am fost la parc. (Ieri sono stato/a al parco.)
    note: Mettendo *ieri* davanti a *Am fost la parc* si precisa il momento.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Ripasso: mănânc, beau'
    gloss: mănânc (mangio) · beau (bevo)
    note: 'Entrambi già visti nella routine quotidiana dell''Unità 10: in questa lezione ne vedrai il passato.'
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Ripasso: pâine, cafea, ceai, și'
    gloss: pâine (pane) · cafea (caffè) · ceai (tè) · și (e)
    note: 'Tutte già viste nelle Unità 6 e 10: qui le riutilizzi nelle frasi al passato di questa lezione.'
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: ho mangiato
    gloss: Am mâncat (ho mangiato)
    note: 'Il perfect compus di *a mânca* (mangiare), già visto come *mănânc* (mangio, Unità 10): è lo stesso verbo, al passato. Am + mâncat, lo stesso schema di *am fost*.'
    example_gloss:
    - Ho mangiato del pane.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: Ho mangiato del pane
    gloss: Am mâncat pâine. (Ho mangiato del pane.)
    note: 'Lo schema completo: am mâncat + il cibo.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: ho bevuto
    gloss: Am băut (ho bevuto)
    note: 'Il perfect compus di *a bea* (bere), già visto come *beau* (bevo, Unità 10): è lo stesso verbo, al passato.'
    example_gloss:
    - Ho bevuto del tè.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: Ho bevuto del tè
    gloss: Am băut ceai. (Ho bevuto del tè.)
    note: 'Lo schema completo: am băut + la bevanda.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: Ho mangiato del pane e bevuto del tè
    gloss: Am mâncat pâine și am băut ceai. (Ho mangiato del pane e bevuto del tè.)
    note: Due azioni al passato unite con *și*, lo stesso connettore che l'Unità 10 ha già usato per le azioni abituali al presente.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Ripasso: am fost, ieri, parc, cinema'
    gloss: am fost (sono stato/a / sono andato/a) · ieri (ieri) · parc (il parco) · cinema (il cinema)
    note: 'Tutte dalla prima lezione di questa unità: qui preparano il racconto della domenica.'
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Ripasso: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (ho mangiato) · am băut (ho bevuto) · pâine (pane) · cafea (caffè) · ceai (tè)
    note: 'Tutte dalla seconda lezione di questa unità: qui Ana e Mihai dicono cosa hanno preso.'
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Ripasso: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (come, Unità 1 e 9) · duminică (domenica, Unità 3) · bine (bene, Unità 1) · mulțumesc (grazie) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: 'Tutte già viste nelle unità precedenti: *cum* è comparso per chiedere il nome di qualcuno (Unità 1) e le indicazioni stradali (Unità 9); qui apre un altro tipo di domanda: com''è andata una cosa.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: È stato
    gloss: A fost (è stato)
    note: 'Un''altra persona dello stesso verbo di *am fost*: *a* è l''ausiliare di «lui/lei/esso», non quello di «io/noi». Per ora impara *Cum a fost...?* e *A fost bine!* come espressioni fisse, non come uno schema da combinare liberamente.'
    example_gloss:
    - È andata bene!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: È andata bene!
    gloss: A fost bine! (È andata bene!)
    note: 'Un modo breve e naturale per dire che qualcosa è andato bene: la risposta a *Cum a fost...?*'
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: Com'è andata domenica?
    gloss: Cum a fost duminică? (Com'è stata la domenica?)
    note: 'Un modo naturale per iniziare a parlare di un giorno appena passato, anche con chi c''era: lo inviti a raccontare come è andata o cosa l''ha colpito.'
  ro.a1.unit12.lesson03.teach.line01:
    title: Saluta e chiedi com'è stata la domenica
    gloss: Mihai saluta Ana e le chiede com'è stata la domenica.
    note: Unisce *Cum a fost duminică?* di questa unità al già noto *Bună*.
  ro.a1.unit12.lesson03.teach.line02:
    title: Rispondi e di' dove
    gloss: Ana dice che è andata bene e che è stata al parco.
    note: Unisce *A fost bine!* a *Am fost la parc* della prima lezione.
  ro.a1.unit12.lesson03.teach.line03:
    title: Di' cosa ha mangiato e bevuto
    gloss: Mihai dice che ha mangiato del pane e bevuto del tè.
    note: Riprende *Am mâncat pâine și am băut ceai* della seconda lezione, secondo l'ordine già stabilito per Mihai nell'Unità 6 (pâine e ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: Di' cosa ha bevuto
    gloss: Ana dice che ha bevuto del caffè.
    note: Corrisponde a quanto già stabilito per Ana nell'Unità 6 (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: Ringrazia e saluta
    gloss: Mihai ringrazia Ana e la saluta.
    note: Lo stesso modo di chiudere con cui terminano i dialoghi di tutte le unità precedenti.
  ro.a1.unit12.lesson03.teach.line06:
    title: Chiudi la conversazione
    gloss: Ana ricambia il saluto, usando il nome di Mihai.
    note: Lo stesso cordiale modo di chiudere con cui terminano i dialoghi di tutte le unità precedenti.
