  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana e Mihai parlano degli hobby
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai e Ana confrontano i loro hobby
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Programmare un fine settimana insieme
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *a citi* (leggere), *a face sport* (fare sport) e *a găti* (cucinare). Le forme del dizionario rumeno iniziano con *a*.'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Tempo libero
    gloss: tempo libero
    note: '*Timpul liber* (tempo libero) è formato dal sostantivo maschile *timp* con l''articolo attaccato alla fine. È l''espressione chiave per parlare di hobby.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Citesc* è la forma di *eu* di *a citi* (leggere); dopo *îmi place să* il verbo resta nella stessa forma.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altre tre espressioni per gli hobby: *a asculta muzică* (ascoltare musica), *a desena* (disegnare) e *a juca jocuri video* (giocare ai videogiochi).'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: '*Îmi place să ascult muzică*: *îmi place* («mi piace») + *să* + verbo è il modo usuale per dire che ti piace fare qualcosa.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*Cu prietenii* significa «con gli amici»: *cu* («con») è la preposizione e *prietenii* è il plurale determinato.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: 'I quattro avverbi di frequenza fondamentali: *mereu*, *des*, *uneori* e *niciodată*. Di solito seguono il verbo: *Citesc des*.'
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*În fiecare săptămână* e *în fiecare weekend* significano entrambe «ogni»; *fiecare* non cambia mai, vedi la scheda successiva.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare non cambia mai
    gloss: 'La parola fiecare non cambia: în fiecare săptămână (ogni settimana), în fiecare weekend (ogni weekend).'
    note: '*Fiecare* resta uguale davanti a *săptămână* e *weekend*, qualunque sia il sostantivo: non c''è nulla da scegliere.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana introduce il tema degli hobby
    gloss: 'Ana: Facciamo spesso passeggiate insieme. Ma tu, Mihai, che altro fai nel tempo libero?'
    note: '*Ne plimbăm* («facciamo una passeggiata») è la forma di *noi* del verbo riflessivo *a se plimba*; si riferisce alle passeggiate che piacciono a entrambi.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Gli hobby di Mihai
    gloss: 'Mihai: Mi piace cucinare, anche a casa. E faccio spesso sport.'
    note: '*Și acasă* (anche a casa) chiarisce che Mihai cucina per piacere, non solo per il suo lavoro al ristorante.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana è sorpresa
    gloss: 'Ana: Cucini anche a casa? Cucini già tutto il giorno al lavoro!'
    note: '*Toată ziua* (tutto il giorno) sottolinea quanto Mihai già cucini al lavoro; *deja* significa «già».'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai spiega
    gloss: 'Mihai: Sì, ma cucinare mi sembra rilassante. E tu, che cosa ti piace fare?'
    note: '*Gătitul mi se pare relaxant* significa letteralmente «cucinare mi sembra rilassante»: *mi se pare* è un modo comune per esprimere un''opinione.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Gli hobby di Ana
    gloss: 'Ana: Mi piace leggere e ascolto spesso musica.'
    note: Unisce con *și* (e), in un'unica frase, due verbi per gli hobby già visti nelle lezioni precedenti.
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai chiede dei videogiochi
    gloss: 'Mihai: Giochi anche tu ai videogiochi?'
    note: Una breve domanda sì/no con *jocuri video*, già vista in una lezione precedente; *joci* è la forma di *tu* di *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: La risposta di Ana
    gloss: 'Ana: No, non gioco mai ai videogiochi. Ma ogni tanto disegno!'
    note: '*Niciodată* (mai) e *uneori* (ogni tanto), già visti, messi a confronto in un''unica risposta; *nu ... niciodată* è una doppia negazione, come «non ... mai».'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Confronto tra hobby
    gloss: Io e Mihai facciamo spesso passeggiate insieme. Ma abbiamo anche altre passioni. A Mihai piace cucinare, anche a casa, e fa spesso sport. A me piace leggere e ascolto spesso musica. Ogni tanto disegno, ma non gioco mai ai videogiochi. E a te, che cosa piace fare nel tempo libero?
    note: Il messaggio di Ana riassume quanto detto prima e si chiude con la domanda chiave dell'unità, rivolta a chi legge.
    glosses:
      plimbăm: passeggiamo
      des: spesso
      împreună: insieme
      alte: altri
      gătească: cucina
      place: piace
      acasă: a casa
      sport: fa sport
      citesc: leggere
      ascult: ascolto
      muzică: musica
      desenez: disegno
      uneori: a volte
      joc: gioco ai videogiochi
      niciodată: mai
      liber: libero
      timpul: tempo
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai chiede del weekend
    gloss: 'Mihai: Che fai questo weekend?'
    note: '*În acest weekend* (questo weekend) usa *acest* per «questo».'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana è indecisa
    gloss: 'Ana: Non lo so ancora. Mi piace leggere, ma voglio anche uscire.'
    note: '*Să ies afară* (uscire fuori) è un modo comune per dire che vuoi uscire di casa; *vreau să* + verbo significa «voglio ...».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai propone un programma
    gloss: 'Mihai: Facciamo una passeggiata insieme? Dopo cucino io per noi.'
    note: '*După aceea* (dopo) serve a ordinare le azioni nel tempo; *Hai să* + verbo propone di fare qualcosa insieme.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana accetta
    gloss: 'Ana: Bella idea! Mi piace sia passeggiare sia cucinare.'
    note: '*Și ..., și ...* («sia ... sia ...») mostra che ad Ana piacciono due cose allo stesso modo, non una più dell''altra.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai conferma
    gloss: 'Mihai: Perfetto. Allora ci vediamo sabato!'
    note: Una battuta finale cordiale che conferma il programma per *sâmbătă* (sabato); *ne vedem* significa «ci vediamo».
