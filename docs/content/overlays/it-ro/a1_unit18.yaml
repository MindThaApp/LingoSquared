teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Ripasso: Ana, mare'
    gloss: Ana (nome) · mare (grande)
    note: Ana è il nome del personaggio, noto dall'Unità 1; *mare* viene dall'Unità 5 e dall'Unità 14. Questa unità li riprende entrambi per descrivere la sua casa.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Ripasso: un, o, și, trei'
    gloss: un/o (un, una) · și (e) · trei (tre)
    note: '*Un*, *o* e *și* vengono dall''Unità 5; *trei* dal conteggio dell''Unità 2. Questa unità riprende tutte e quattro per contare e descrivere le stanze.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: Ha
    gloss: Are (lui/lei ha)
    note: 'Una nuova forma di *a avea* (avere): conosci già *am* (io ho, dall''Unità 2 e dall''Unità 5) e *aveți* (ha/avete, forma di cortesia); *are* è la terza persona dello stesso verbo e serve per dire che cosa ha qualcuno o qualcosa.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Casa
    gloss: Casa
    note: Il luogo in cui si abita.
    example_gloss:
    - Ana ha una casa grande.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Stanza
    gloss: Stanza
    note: Parola generica per indicare una stanza di una casa.
    example_gloss:
    - Ana ha una stanza grande.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (stanza) · camere (stanze)
    note: 'Il plurale di *cameră* è *camere*: si usa quando si contano più stanze.'
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Camera da letto
    gloss: Camera da letto
    note: La stanza in cui si dorme.
    example_gloss:
    - Ana ha una camera da letto.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Cucina
    gloss: Cucina
    note: La stanza in cui si cucina.
    example_gloss:
    - Ana ha una cucina.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Bagno
    gloss: Bagno
    note: La stanza con la vasca o la doccia e il water.
    example_gloss:
    - Ana ha un bagno.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana ha una casa grande. La casa ha tre stanze: una camera da letto, una cucina e un bagno.'
    gloss: 'Ana ha una casa grande. La casa ha tre stanze: una camera da letto, una cucina e un bagno.'
    note: 'Tutte le parole di questa frase sono già state presentate o lo sono appena state, combinate in due frasi nuove sulla casa di Ana. *Casa* è la forma determinata di *casă* ("la casa"): un sostantivo femminile in -ă perde la -ă e prende la -a, come *banca* (la banca) nell''Unità 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Ripasso: Mihai, mic'
    gloss: Mihai (nome) · piccolo
    note: Mihai è il nome del personaggio, presente fin dall'Unità 1; *mic* viene dall'Unità 14. In questa unità li riusi entrambi per descrivere il suo appartamento.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Ripasso: unde, este, două'
    gloss: dove · è · due (femminile)
    note: '*Unde* ed *este* vengono dall''Unità 8 e dall''Unità 9; *două* è la forma femminile di «due» dell''Unità 2. In questa unità le riusi tutte e tre per chiedere e contare le stanze.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Appartamento
    gloss: Appartamento
    note: 'La casa di Mihai: un''alternativa più piccola rispetto a quella di Ana.'
    example_gloss:
    - Mihai ha un appartamento piccolo.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Finestra
    gloss: Finestra
    note: '*Apartamentul* è la forma determinata di *apartament* ("l''appartamento"): un sostantivo neutro che termina in consonante aggiunge -ul, come *magazinul* (il negozio) nell''Unità 8 (il femminile *casă*, invece, diventa *casa*).'
    example_gloss:
    - L'appartamento ha una finestra grande.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai ha un appartamento piccolo. L''appartamento ha due stanze: una camera da letto e una cucina.'
    gloss: 'Mihai ha un appartamento piccolo. L''appartamento ha due stanze: una camera da letto e una cucina.'
    note: Tutte le parole di questa frase sono già state presentate o lo sono appena state, combinate in due frasi nuove sull'appartamento di Mihai.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: Dov'è il bagno?
    gloss: Dov'è il bagno?
    note: '*Baia* è la forma determinata di *baie* ("il bagno"). Una domanda molto utile quando si va a casa di qualcuno.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Ripasso: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Ciao · Come sta? · Bene, grazie
    note: Tutte dal saluto iniziale dell'Unità 1, riusate qui per aprire il dialogo di questa unità.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Ripasso: La revedere, Mea, Aproape, Am'
    gloss: Arrivederci · mia (femminile) · vicino · ho
    note: '*La revedere* viene dall''Unità 1; *mea* dalla frase *Mama mea* dell''Unità 5; *aproape* dalle risposte a *Unde este...?* delle Unità 8 e 9; *am* dalle Unità 2 e 5. Le riusi tutte nel dialogo della visita a casa.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Saluta Ana e chiedile come sta
    gloss: Mihai saluta Ana e le chiede come sta.
    note: Riprende il saluto *Ce mai faceți?* dell'Unità 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: Rispondi e descrivi la tua casa
    gloss: Ana risponde, poi dice a Mihai che la sua casa è grande e ha tre stanze.
    note: Unisce *Bine, mulțumesc* dell'Unità 1 con la frase della prima lezione di questa unità.
  ro.a1.unit18.lesson03.teach.line03:
    title: Chiedi dov'è il bagno
    gloss: Mihai chiede ad Ana dov'è il bagno.
    note: Riprende quasi identica la frase della seconda lezione di questa unità.
  ro.a1.unit18.lesson03.teach.line04:
    title: Rispondi su dove si trova il bagno
    gloss: Ana gli dice che è vicino.
    note: Unisce *baia* e *aproape*, lo stesso schema di risposta a «dov'è...?» già visto nelle Unità 8 e 9.
  ro.a1.unit18.lesson03.teach.line05:
    title: Descrivi il tuo appartamento e saluta
    gloss: Mihai dice che ha un appartamento piccolo con due stanze, poi saluta.
    note: Unisce la frase della seconda lezione di questa unità con la formula di chiusura dell'Unità 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Saluta
    gloss: Ana saluta.
    note: La stessa formula con cui si sono chiusi i dialoghi di tutte le unità precedenti.
