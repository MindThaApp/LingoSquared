answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumeno A1
  description: 'Parlare della famiglia in rumeno: genitori, fratelli, figli e stato civile, con la coppia di possessivi meu/mea e la stessa opposizione tu/dumneavoastră delle domande sull''età dell''unità 2. Ana e Mihai continuano a conoscere le rispettive famiglie.'
units:
  ro.a1.unit05.family:
    title: La famiglia
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: La mia famiglia
  ro.a1.unit05.lesson02.frati_si_copii:
    title: Fratelli, sorelle e figli
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: Una conversazione sulla famiglia
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Ripasso: am, un, o, și, mare'
    gloss: am (ho) · un/o (un/una) · și (e) · mare (grande)
    note: 'Tutte e cinque sono già comparse nelle unità precedenti (*și* nell''Unità 1, *am* e *o* nell''Unità 2, *mare* nella nota sulla lettera maiuscola dell''Unità 3, *un* nell''Unità 4): qui tornano per parlare di famiglia.'
  ro.a1.unit05.lesson01.teach.familie:
    title: La famiglia
    gloss: famiglia
    note: 'Sostantivo femminile: si combina con *o* e un aggettivo come *mare* per dire «una famiglia numerosa».'
    example_gloss: Ho una famiglia numerosa.
  ro.a1.unit05.lesson01.teach.mama:
    title: Madre
    gloss: madre
    note: 'La parola base del dizionario per «madre»: più avanti trovi come dire «mia madre».'
    example_gloss: Mihai ha una madre e un padre.
  ro.a1.unit05.lesson01.teach.tata:
    title: Padre
    gloss: padre
    note: La parola base del dizionario per «padre».
    example_gloss: Mio padre è insegnante.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Genitori
    gloss: genitori
    note: Indica entrambi i genitori insieme, come in italiano «genitori».
    example_gloss: I miei genitori vivono in Romania.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Mio: meu o mea'
    gloss: meu (mio, masch.) / mea (mia, femm.)
    note: 'In rumeno «mio» concorda con il genere della cosa posseduta, non di chi possiede: *meu* con un nome maschile come *tată*, *mea* con un nome femminile come *mamă*.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Mia madre
    gloss: mia madre
    note: 'Mamă diventa mama (prende l''articolo determinativo) prima di mea: questa è la forma reale per dire «mia madre», non una traduzione parola per parola.'
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Mio padre
    gloss: mio padre
    note: Tată diventa tatăl (prende l'articolo, in modo irregolare con -l, anche se tată finisce già in -ă) prima di meu.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Mia madre e mio padre
    gloss: Mia madre e mio padre.
    note: Riunisce in una frase le due forme possessive, ciascuna con il genere giusto.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Ripasso: câți, ai, aveți, doi, nu'
    gloss: câți (quanti) · ai/aveți (hai/ha, informale/formale) · doi (due) · nu (no/non)
    note: '*Câți*, *ai* e *aveți* sono apparsi nell''Unità 2 per chiedere l''età («Câți ani ai?»); qui servono a chiedere di fratelli e figli. *Doi* viene dai numeri dell''Unità 2, *nu* dall''Unità 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Sì
    gloss: sì
    note: La parola di tutti i giorni per «sì»; fa coppia con *nu* («no») dell'Unità 3.
    example_gloss: Sì, ho un fratello.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Fratello, sorella
    gloss: fratello / sorella
    note: 'Nomi maschile e femminile per i fratelli: si combinano con un/o come qualsiasi altro nome.'
    example_gloss:
    - Ho un fratello.
    - Ho una sorella.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Fratelli, sorelle
    gloss: fratelli / sorelle
    note: 'Sono le forme plurali, usate per chiedere dei fratelli in generale: in rumeno si chiede spesso «Ai frați?» («Hai fratelli?») intendendo «hai fratelli o sorelle», e poi spesso «Surori?» per controllare le sorelle, come nella doppia domanda del testo originale.'
    example_gloss: Hai fratelli o sorelle?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: Hai fratelli o sorelle? (informale)
    gloss: Hai fratelli?
    note: Il modo informale e quotidiano di chiedere; si abbina al registro del *tu* dell'Unità 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: Ha fratelli o sorelle? (formale)
    gloss: Hai fratelli?
    note: La versione di cortesia, con lo stesso *aveți* della domanda sull'età dell'Unità 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Figlio/bambino, figli/bambini
    gloss: copil (bambino, figlio) / copii (bambini, figli)
    note: 'Copil ha uno dei plurali più particolari del rumeno: copii, senza la normale terminazione in -i o -e. Conviene memorizzarlo come forma a sé.'
    example_gloss: Ho due figli.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Figlio, figlia
    gloss: fiu (figlio) / fiică (figlia)
    note: Le parole specifiche per figlio e figlia, diverse da copil/copii in generale.
    example_gloss:
    - Ho un figlio.
    - Ho una figlia.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: Quanti figli hai?
    gloss: Quanti figli hai?
    note: 'Câți (quanti) + copii (figli) + ai (hai): tutte e tre le parole ti sono già note.'
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Sposato
    gloss: sposato
    note: Una domanda personale comune nelle conversazioni di tutti i giorni, come chiedere l'età.
    example_gloss: Sei sposato?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Ripasso: bine, la revedere, Ana, Mihai'
    gloss: bine (bene) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: Riepiloga il lessico già visto nelle unità precedenti e riusato nel dialogo di questa lezione.
  ro.a1.unit05.lesson03.teach.line01:
    title: Chiedere dei fratelli
    gloss: Ana chiede a Mihai se ha fratelli o sorelle.
    note: Usa il *aveți* di cortesia, in linea con il registro già stabilito tra i due.
  ro.a1.unit05.lesson03.teach.line02:
    title: Risposta e domanda di rimando
    gloss: Mihai dice di avere un fratello e una sorella e chiede ad Ana se ha figli.
    note: 'Riutilizza in uno scambio il lessico di questa unità: frate/soră e copii.'
  ro.a1.unit05.lesson03.teach.line03:
    title: Risposta e domanda di ritorno
    gloss: Ana dice di avere una figlia e rivolge a Mihai la stessa domanda.
    note: '*Și dumneavoastră?* («E Lei?») è lo stesso schema di domanda di ritorno delle presentazioni dell''Unità 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Risposta
    gloss: Mihai dice di avere un figlio.
    note: Una risposta breve e diretta con il fiu di questa unità.
  ro.a1.unit05.lesson03.teach.line05:
    title: Reazione e chiusura
    gloss: Ana reagisce in modo positivo e saluta.
    note: '*Bine!* qui è una breve reazione positiva, la stessa parola di *Bine, mulțumesc.* dell''Unità 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: Chiusura dell'incontro
    gloss: Mihai ricambia il saluto usando il nome di Ana.
    note: La stessa cordiale chiusura con cui terminavano i dialoghi delle Unità 1 e 4.
