  ro.a1.unit15.lesson01.trenul_pleaca:
    title: Il treno parte
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Un biglietto, per favore
  ro.a1.unit15.lesson03.la_gara:
    title: In stazione
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Ripasso: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (stazione) · este (è) · la (a) · ce (che / quale) · oră (ora) · ora (l'ora) · nouă (nove)
    note: 'Gară viene dall''Unità 8/Unità 9; este/la/ce/oră/ora/nouă dall''Unità 4 (l''ora): questa unità riprende lo schema «la ce oră»/«la ora nouă» dell''Unità 4 con un nuovo scopo, chiedere di un treno invece che di una lezione.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Treno
    gloss: treno
    note: 'Neutro, termina in consonante (al singolare i nomi neutri si comportano come quelli maschili: *un tren*): per «il treno» prende *-ul*, come *magazin*->*magazinul*; i nomi in *-ă* come *gară* prendono invece *-a* (*gara*).'
    example_gloss:
    - Il treno è in stazione.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Parte / va via
    gloss: parte / va via (lui/lei, il treno)
    note: 'Il verbo per un treno, un autobus o un aereo che parte. *Trenul pleacă*: non serve *este*, perché *pleacă* è già un verbo completo.'
    example_gloss:
    - Il treno parte.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: Il treno parte alle nove
    gloss: Trenul pleacă la ora nouă. (Il treno parte alle nove.)
    note: 'Unisce *trenul* + *pleacă* con il *la ora nouă* dell''Unità 4: non serve nessun nuovo lessico per l''ora.'
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: A che ora parte il treno?
    gloss: La ce oră pleacă trenul? (A che ora parte il treno?)
    note: Lo schema di domanda *La ce oră...?* dell'Unità 4, ora riferito a *trenul* invece che a una lezione.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Binario
    gloss: binario
    note: 'Il binario della stazione. Neutro, termina in consonante, quindi «il binario» è *peronul*: la stessa desinenza *-ul* di *tren*->*trenul*.'
    example_gloss:
    - Il treno è al binario tre.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: Da quale binario parte il treno?
    gloss: De la ce peron pleacă trenul? (Da quale binario parte il treno?)
    note: '*De la* (da) + *ce peron* (quale binario): tutte le parole erano già state insegnate, qui sono solo combinate in una nuova domanda.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Ripasso: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (vorrei) · vă rog (per favore, formale) · cât costă (quanto costa) · costă (costa) · lei (lei, valuta)
    note: 'Tutto dall''Unità 6 (cibo) e dall''Unità 7 (acquisti): questa unità riprende le stesse formule di richiesta cortese e di prezzo per comprare un biglietto del treno invece che del cibo.'
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Biglietto
    gloss: biglietto
    note: Un biglietto del treno. Neutro (al singolare prende *un*, come un nome maschile), quindi «un biglietto» è *un bilet*.
    example_gloss:
    - Ho un biglietto.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Bucarest
    gloss: București (Bucarest)
    note: 'La capitale della Romania: la destinazione d''esempio naturale in questo corso.'
    example_gloss:
    - Il treno parte per Bucarest.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Vorrei un biglietto per Bucarest, per favore
    gloss: Aș dori un bilet la București, vă rog. (Vorrei un biglietto per Bucarest, per favore.)
    note: La formula di cortesia *Aș dori... vă rog* delle Unità 6/7, ora per richiedere un biglietto invece che del cibo.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: Quanto costa un biglietto per Bucarest?
    gloss: Cât costă un bilet la București? (Quanto costa un biglietto per Bucarest?)
    note: La domanda sul prezzo *Cât costă...?* dell'Unità 7, ora riferita a un biglietto invece che a un chilo di patate.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Costa quaranta lei
    gloss: Costă patruzeci de lei. (Costa quaranta lei.)
    note: 'Da 2 a 19 non serve *de* prima di *lei*, mentre da 20 in su sì, come in patruzeci de lei: è la regola già vista nell''Unità 7.'
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Ripasso: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (treno) · pleacă (parte) · peron (binario) · bilet (biglietto) · București (Bucarest) · trei (tre, dall'Unità 2) · am (ho, dall'Unità 2)
    note: Tren/pleacă/peron/bilet/București vengono dalle lezioni di questa unità; trei e am sono ripresi dall'Unità 2 (i numeri), perché ora Ana e Mihai usano insieme «peronul trei» e «am un bilet» in stazione.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Ripasso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (ciao) · mulțumesc (grazie) · la revedere (arrivederci) · Ana, Mihai (nomi)
    note: 'Tutto già visto nelle unità precedenti: lo stesso schema cordiale di apertura e chiusura di ogni dialogo di questo corso.'
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Buon viaggio
    gloss: Drum bun (Buon viaggio)
    note: 'Un saluto fisso che si dice a chi sta per partire: alla lettera «buona strada», ma usato come l''italiano «buon viaggio».'
    example_gloss:
    - Buon viaggio, Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: Saluta e chiedi del treno
    gloss: Ana saluta Mihai e gli chiede a che ora parte il treno.
    note: Riprende la domanda della prima lezione di questa unità, ora rivolta direttamente a Mihai.
  ro.a1.unit15.lesson03.teach.line02:
    title: Indica l'ora di partenza
    gloss: Mihai dice che il treno parte alle nove.
    note: Riprende esattamente la frase della prima lezione di questa unità.
  ro.a1.unit15.lesson03.teach.line03:
    title: Chiedi del binario
    gloss: Ana chiede da quale binario.
    note: 'Una breve domanda di rimando: *de la ce peron* è già stata posta per esteso nella lezione 1; qui Ana la formula in modo abbreviato, aspettando che Mihai completi il resto.'
  ro.a1.unit15.lesson03.teach.line04:
    title: Indica il binario e il biglietto
    gloss: Mihai dice che il treno parte dal binario tre e che ha un biglietto per Bucarest.
    note: 'Riunisce in un''unica risposta il lessico di questa unità: peron, bilet e București.'
  ro.a1.unit15.lesson03.teach.line05:
    title: Augura buon viaggio e saluta
    gloss: Ana augura buon viaggio a Mihai e lo saluta.
    note: Usa *Drum bun* di questa lezione, un saluto specifico per chi parte, al posto del semplice *la revedere* usato di solito nel corso.
  ro.a1.unit15.lesson03.teach.line06:
    title: Ringraziala e salutala
    gloss: Mihai ringrazia Ana e la saluta.
    note: Lo stesso schema di chiusura con cui terminano i dialoghi di tutte le unità precedenti.
