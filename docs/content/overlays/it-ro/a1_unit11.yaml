teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Ripasso: da, bine, nu, mulțumesc'
    gloss: da (sì) · bine (bene / va bene) · nu (no) · mulțumesc (grazie)
    note: 'Tutto già visto dall''Unità 6: qui si combinano nel modo di accettare un programma di questa unità e nell''esercizio di abbinamento per ripassare il lessico.'
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: Andiamo / noi andiamo
    gloss: Mergem (andiamo / noi andiamo)
    note: 'La prima persona plurale di *a merge*, già vista come *merg* (io vado, Unità 10) e *mergeți* (l''imperativo di cortesia, Unità 9): è lo stesso verbo, ma a un''altra persona e numero. Da solo, con intonazione ascendente, è un modo naturale di proporre di fare qualcosa insieme.'
    example_gloss:
    - Andiamo al cinema?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: Il cinema
    gloss: Cinema (il cinema)
    note: 'Una parola molto simile all''italiano «cinema»: facile da riconoscere.'
    example_gloss:
    - Andiamo al cinema?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: Andiamo al cinema?
    gloss: Mergem la cinema? (Andiamo al cinema?)
    note: 'Un invito completo: non serve altro come «vuoi», il punto interrogativo trasforma «andiamo» in una proposta.'
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: Il parco
    gloss: Parc (il parco)
    note: Un altro termine molto simile all'italiano, come *cinema*.
    example_gloss:
    - Andiamo al parco?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: Andiamo al parco?
    gloss: Mergem la parc? (Andiamo al parco?)
    note: Lo stesso schema d'invito di *Mergem la cinema?*, con un luogo diverso.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: Sì, va bene!
    gloss: Da, bine! (Sì, va bene!)
    note: 'Un modo breve e naturale di accettare un programma: parole già note in una nuova combinazione.'
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Ripasso: nu, pot'
    gloss: nu (no / non) · pot (posso)
    note: '*Nu* è già stato introdotto nell''Unità 6; pot è già stato introdotto nell''Unità 9 con *cum pot să ajung* (come posso arrivare). Davanti a un verbo, nu significa «non»: *nu pot* vuol dire «non posso», ed è il modo di questa unità per rifiutare un programma.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Ripasso: sâmbătă, duminică'
    gloss: sâmbătă (sabato) · duminică (domenica)
    note: Entrambe sono già state introdotte nei giorni della settimana dell'Unità 3.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: Andiamo al parco sabato?
    gloss: Andiamo al parco sabato?
    note: 'L''invito della lezione 1, ora con un giorno aggiunto: unisce *Mergem la parc?* a un nome di giorno.'
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: Sabato non posso
    gloss: Sabato non posso.
    note: 'Un semplice rifiuto: *nu pot* più il giorno che si rifiuta.'
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Allora / in tal caso
    gloss: allora / in tal caso
    note: 'Diverso da *apoi* (l''«poi» dell''Unità 9, che ordina due azioni in sequenza): *atunci* propone un''alternativa o trae una conseguenza, ed è la parola naturale per dire «allora, che ne dici di...?» quando si cambia programma.'
    example_gloss:
    - Allora, domenica?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: Allora, domenica?
    gloss: Allora, domenica?
    note: 'Una breve controproposta dopo un rifiuto: basta nominare un nuovo giorno, senza ripetere tutto l''invito.'
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: Sì, bene! Domenica.
    gloss: Sì, bene! Domenica.
    note: Si accetta il nuovo giorno con lo stesso schema breve di *Da, bine!* della lezione 1.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Ripasso: la ce oră, la ora, patru'
    gloss: a che ora · alle (ore) · quattro
    note: La ce oră e la ora sono già stati introdotti nell'Unità 4 (chiedere e dire l'ora); patru nell'Unità 2 sui numeri. Qui si combinano per fissare l'orario dell'appuntamento di questa unità.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Ripasso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: ciao / buongiorno · grazie · arrivederci · sì · Ana, Mihai (nomi)
    note: 'Tutto già introdotto nelle unità precedenti: qui Ana e Mihai si accordano sull''orario del loro programma.'
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Certo
    gloss: certo
    note: Un modo comune e autonomo per confermare un programma, simile all'italiano «Certo!» o «Sicuro!».
    example_gloss:
    - Certo! Alle quattro.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: Certo! Alle quattro.
    gloss: Certo! Alle quattro.
    note: Conferma sia il programma sia l'ora esatta in una sola breve risposta.
  ro.a1.unit11.lesson03.teach.line01:
    title: Salutare e proporre il parco
    gloss: Ana saluta Mihai e gli chiede se domenica vanno al parco.
    note: Unisce l'invito *Mergem la parc?* di questa unità a *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Accettare e chiedere l'ora
    gloss: Mihai accetta e chiede a che ora.
    note: Riprende la domanda *La ce oră?* dell'Unità 4.
  ro.a1.unit11.lesson03.teach.line03:
    title: Proporre un orario
    gloss: Ana propone le quattro.
    note: Una domanda breve che riprende lo schema *la ora* dell'Unità 4 con *patru* di questa unità.
  ro.a1.unit11.lesson03.teach.line04:
    title: Confermare e ringraziare
    gloss: Mihai conferma con «Certo!» e ringrazia Ana.
    note: Unisce *sigur* di questa unità con *mulțumesc*, già noto.
  ro.a1.unit11.lesson03.teach.line05:
    title: Salutare
    gloss: Ana saluta.
    note: Lo stesso modo di chiudere con cui terminano i dialoghi di tutte le unità precedenti.
  ro.a1.unit11.lesson03.teach.line06:
    title: Chiudere l'incontro
    gloss: Mihai ricambia il saluto, usando il nome di Ana.
    note: Lo stesso cordiale modo di chiudere con cui terminano i dialoghi di tutte le unità precedenti.
