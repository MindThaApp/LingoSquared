course:
  title: الإسبانية A1
  description: أيام الأسبوع وشهور السنة، والسؤال عن التواريخ وأعياد الميلاد وذكرها، مع مواصلة قصة ورشة الطبخ لإيلينا وماتيو من الوحدات 01-03. وتركّز الإرشادات على طريقة كتابة التاريخ بالأعداد الأصلية في الإسبانية.
