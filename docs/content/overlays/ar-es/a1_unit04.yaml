teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: من الاثنين إلى الجمعة
    gloss: الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة
    note: تُكتب أسماء أيام الأسبوع في الإسبانية بأحرف صغيرة، ولا تبدأ بحرف كبير إلا في أول الجملة.
    example_gloss:
    - ورشة الطبخ تكون أيام الثلاثاء.
    - أدرس الإسبانية أيام الخميس.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: السبت، الأحد
    gloss: السبت، الأحد
    note: '*Sábado* و*domingo* هما يوما الأسبوع الوحيدان اللذان يأخذان -s في الجمع (*los sábados*، *los domingos*)، أما بقية أسماء الأيام فتبقى على حالها في المفرد والجمع.'
    example_gloss:
    - أيام السبت أذهب إلى السوق.
    - أيام الأحد أرتاح.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: اليوم هو الجمعة
    gloss: اليوم هو الجمعة.
    note: '*Hoy* (اليوم) + *es* (هو) + اسم اليوم تعبّر مباشرة عن يوم اليوم، دون حاجة إلى أداة تعريف.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: الورشة أيام الثلاثاء
    gloss: ورشة الطبخ تكون أيام الثلاثاء.
    note: '*Los martes* (مع أداة التعريف الجمع *los*) تعني «أيام الثلاثاء» أي موعدًا متكررًا، وليس ثلاثاء واحدًا محددًا.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: يناير – يونيو
    gloss: يناير، فبراير، مارس، أبريل، مايو، يونيو
    note: مثل أسماء أيام الأسبوع، تُكتب أسماء الأشهر في الإسبانية بأحرف صغيرة إلا إذا جاءت في بداية الجملة.
    example_gloss:
    - عيد ميلادي في مارس.
    - في يونيو يكون الطقس حارًا.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: يوليو – ديسمبر
    gloss: يوليو، أغسطس، سبتمبر، أكتوبر، نوفمبر، ديسمبر
    note: أسماء الأشهر في الإسبانية قريبة في لفظها من الأسماء الشائعة في العربية (سبتمبر، أكتوبر، نوفمبر، ديسمبر)، فـ *septiembre* تشبه «سبتمبر» في الجذر.
    example_gloss:
    - تبدأ ورشة الطبخ في يوليو.
    - في ديسمبر أزور عائلتي.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: عيد ميلادي في مارس
    gloss: عيد ميلادي في مارس.
    note: تُستعمل *en* (في) مع اسم الشهر وحده، دون تحديد يوم بعينه.
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: السؤال عن تاريخ اليوم
    gloss: ما تاريخ اليوم؟
    note: '*Qué fecha* (أي تاريخ) هي الطريقة المعتادة للسؤال عن تاريخ في التقويم، وتختلف عن *qué hora* (كم الساعة) التي سنراها في وحدة لاحقة.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: ذكر التاريخ
    gloss: اليوم هو الثاني والعشرون من يوليو.
    note: تُقرأ *El veintidós de julio* حرفيًا «الاثنان والعشرون من يوليو»، فالإسبانية تستعمل العدد الأصلي العادي في التاريخ، لا العدد الترتيبي.
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: صيغة التاريخ في الإسبانية
    gloss: كيف تذكر الإسبانية التواريخ.
    note: العدد الأصلي + de + الشهر. وللتعبير عن أول الشهر شاع استعمال *el primero* (خاصة في أمريكا اللاتينية)، كما تُستعمل *el uno* خاصة في إسبانيا.
    target_text: 'تذكر الإسبانية التاريخ بالعدد الأصلي + de + الشهر: el veintidós de julio تُقرأ حرفيًا «الاثنان والعشرون من يوليو». وهذا قريب من العربية التي تستعمل الأعداد في التاريخ أيضًا. أما لليوم الأول من الشهر، فيقول كثيرون (خصوصًا في أمريكا اللاتينية) *el primero*؛ ويشيع أيضًا *el uno*، خصوصًا في إسبانيا.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: السؤال عن موعد الورشة
    gloss: متى تكون الورشة؟
    note: تسأل *Cuándo* (متى) عن الوقت بوجه عام، أما *qué fecha* (السؤال الآخر في هذا الدرس) فتسأل تحديدًا عن تاريخ في التقويم، وكلاهما مناسب هنا.
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: ذكر تاريخ الورشة
    gloss: الورشة في الثاني والعشرين من يوليو.
    note: هي نفسها صيغة التاريخ في *hoy es el veintidós de julio*، مع مبتدأ مختلف (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: السؤال عن عيد ميلاد شخص ما
    gloss: متى عيد ميلادك؟
    note: '*Tu cumpleaños* (عيد ميلادك) تستعمل صيغة *tú* غير الرسمية مع الأصدقاء.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: ذكر عيد ميلادك
    gloss: عيد ميلادي في العاشر من مارس.
    note: بخلاف *en marzo* (في مارس، الشهر فقط)، يُذكر تاريخ عيد الميلاد الكامل بـ *el* + رقم اليوم، على نمط *el veintidós de julio* نفسه.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: ذكر عيد ميلاد شخص ثالث
    gloss: عيد ميلاد ماتيو في الثاني والعشرين من أغسطس.
    note: '*El cumpleaños de Mateo* (عيد ميلاد ماتيو) تستعمل *de* للدلالة على الملكية، وهو التركيب نفسه في *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: تهانينا!
    gloss: تهانينا! / عيد ميلاد سعيد!
    note: '*¡Felicidades!* كلمة تهنئة عامة تصلح لكل المناسبات، وتُقال في أعياد الميلاد وفي الأخبار السارة الأخرى.'
    example_gloss: تهانينا يا إيلينا! اليوم عيد ميلادك.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: قراءة جدول الورشة
    gloss: ورشة الطبخ تكون أيام الثلاثاء. الحصة القادمة في الثاني والعشرين من يوليو. بعد ذلك، توجد حصة في التاسع والعشرين من يوليو. وتنتهي الورشة في الثاني عشر من أغسطس.
    note: يستعمل هذا الجدول القصير أسماء أيام الأسبوع ونمط التاريخ اللذين تعلمتهما في نص واحد متصل.
    glosses:
      taller: ورشة
      cocina: الطبخ
      martes: أيام الثلاثاء
      próxima: القادمة
      clase: حصة
      veintidós: اثنان وعشرون
      julio: يوليو
      Después: بعد ذلك
      hay: يوجد (من haber)
      veintinueve: تسعة وعشرون
      termina: تنتهي (من terminar)
      doce: اثنا عشر
      agosto: أغسطس
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: الحصة القادمة
    gloss: الحصة القادمة
    note: تتطابق *Próxima* (القادمة) مع الاسم المؤنث *clase*؛ أما صيغة المذكر فهي *próximo*.
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (بعد)
    gloss: كيف تربط *después* بين الأحداث بالتسلسل.
    note: '*Después* = بعد، بعد ذلك.'
    target_text: 'تربط *Después* (بعد، لاحقًا) بين حدثين متتابعين: أولًا شيء ثم الذي يليه.'
  es.a1.unit04.lesson06.teach.line01:
    title: السؤال عن الحصة القادمة
    gloss: يسأل ماتيو إيلينا متى تكون الحصة القادمة من الورشة.
    note: '*La próxima clase del taller* = الحصة القادمة من الورشة.'
  es.a1.unit04.lesson06.teach.line02:
    title: ذكر التاريخ
    gloss: تؤكد إيلينا أنه الثاني والعشرون من يوليو، يوم ثلاثاء.
    note: تضيف إيلينا *un martes* (يوم ثلاثاء) بعد التاريخ، لتؤكد أن الحصة في يوم الورشة المعتاد، وهو الثلاثاء.
  es.a1.unit04.lesson06.teach.line03:
    title: السؤال عن موعد انتهاء الورشة
    gloss: يسأل ماتيو متى تنتهي الورشة.
    note: '*Perfecto* (ممتاز) ردّ قصير طبيعي قبل طرح سؤال متابعة.'
  es.a1.unit04.lesson06.teach.line04:
    title: ذكر تاريخ الانتهاء
    gloss: تقول إيلينا إنها تنتهي في الثاني عشر من أغسطس.
    note: هو تاريخ الانتهاء نفسه المكتوب في الجدول المطبوع.
  es.a1.unit04.lesson06.teach.line05:
    title: السؤال عن عيد الميلاد في منتصف الحديث
    gloss: يقول ماتيو «بالمناسبة» ويسأل متى عيد ميلاد إيلينا.
    note: تُستعمل *Por cierto* (بالمناسبة) بطبيعية للانتقال إلى موضوع آخر أثناء الحديث.
  es.a1.unit04.lesson06.teach.line06:
    title: ذكر التاريخ وإعادة السؤال
    gloss: تقول إيلينا العاشر من مارس، ثم تسأل «وعيد ميلادك أنت؟»
    note: '*¿Y el tuyo?* (وماذا عن عيدك؟) تستعمل ضمير الملكية *tuyo*، وهو صيغة قصيرة جديدة لإعادة السؤال عن شيء سبق ذكره (*cumpleaños* مذكر، لذلك *tuyo* وليس *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: ذكر عيد ميلاد ماتيو
    gloss: يقول ماتيو الثاني والعشرين من أغسطس.
    note: جواب قصير وكامل يعيد نمط التاريخ دون تكرار «mi cumpleaños es»، وهو طبيعي في الحوار السريع.
  es.a1.unit04.lesson06.teach.line08:
    title: التعليق وملاحظة التوقيت
    gloss: تُبدي إيلينا سعادتها، وتلاحظ أن عيد ميلاده يقع بعد انتهاء الورشة.
    note: '*Es después del taller* (إنه بعد الورشة): الثاني والعشرون من أغسطس يأتي بعد انتهاء الورشة في الثاني عشر منه.'
