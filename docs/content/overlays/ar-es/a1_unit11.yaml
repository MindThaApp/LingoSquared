  es.a1.unit11.lesson01.teach.los_zapatos:
    title: الحذاء
    gloss: الحذاء (بصيغة الجمع)
    note: كلمة *Zapatos* جمع، وهي تدل على زوج الحذاء أو أكثر.
    example_gloss: هذه الأحذية مريحة.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: المئزر
    gloss: المئزر
    note: كلمة *Delantal* مذكرة، وهو القطعة التي تحتاجها إيلينا وماتيو للورشة.
    example_gloss: نحتاج إلى مئزر للورشة.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: السؤال عن المقاس
    gloss: ما مقاسك؟
    note: '*¿Qué talla usas?* هي الطريقة المعتادة للسؤال عن مقاس ملابس شخص ما.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: ذكر مقاسك
    gloss: أرتدي مقاس متوسط.
    note: '*Uso* (أستخدم/أرتدي) + *la talla* (المقاس) + كلمة المقاس نفسها.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: قل إنه مناسب
    gloss: إنه مناسب لي.
    note: تستخدم *Me queda bien* الفعل *quedar* (يناسب/يلائم)؛ انظر بطاقة القواعد التالية.
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: قل إنه غير مناسب
    gloss: إنه غير مناسب لي.
    note: عكس *me queda bien*، بتبديل *bien* بـ *mal*.
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: كيف يصف الفعل quedar المقاس لا الجودة.
    note: انظر نص البطاقة نفسها.
    target_text: 'تستخدم *Me queda bien* (إنه مناسب لي) الفعل *quedar* (يناسب/يلائم)، وهو فعل مختلف عن *ser* و*estar*، وحرفيًا: «يبقى جيدًا عليّ». وكلمتا *bien* و*mal* هنا تصفان المقاس لا الجودة.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: السؤال عن سعر المئزر
    gloss: كم سعر هذا المئزر؟
    note: يستخدم نمط *¿Cuánto cuesta?* مع تسمية قطعة محددة بـ *este* (هذا).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: ذكر السعر
    gloss: سعره اثنا عشر.
    note: '*Cuesta* + رقم لذكر السعر.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este وesta
    gloss: كيف يتفق اسم الإشارة مع جنس الاسم.
    note: انظر نص البطاقة نفسها.
    target_text: '*Este* (هذا، للمذكر) يتفق مع *el delantal*، أما *esta* (هذه، للمؤنث) فتأتي مع *esta camisa*؛ فاسم الإشارة يتغير بحسب جنس الاسم، كما في الصفات.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: قل إنه يعجبك
    gloss: يعجبني هذا.
    note: تعمل *Este* هنا وحدها كضمير بمعنى «هذا»، وتشير إلى العنصر الذي ذُكر للتو.
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: قل إنك ستشتريه
    gloss: سأشتريه.
    note: '*Voy a* + المصدر هي صيغة المستقبل القريب؛ وفي *comprarlo* يتصل ضمير المفعول *lo* (أي «هو/ه») بالمصدر *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: قل إنكما ستشتريان اثنين
    gloss: سنشتري اثنين.
    note: '*Compramos* (نشتري / نحن نشتري) هي صيغة *nosotros*، وتُستعمل حين يقرر إيلينا وماتيو معًا.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: قراءة قائمة أسعار
    gloss: 'في هذا المتجر، يكلّف القميص خمسة عشر، والبنطال عشرين، والجاكيت ثلاثين، والحذاءان خمسة وعشرين. المئزر هو الأرخص: يكلّف اثني عشر فقط.'
    note: 'قائمة أسعار في متجر: تُستعمل *cuesta* (يكلّف) مع عنصر واحد، و*cuestan* (يكلّفون) مع الجمع مثل *los zapatos*.'
    glosses:
      tienda: متجر
      camisa: قميص
      cuesta: يكلّف (من costar)
      quince: خمسة عشر
      pantalón: بنطال
      veinte: عشرون
      chaqueta: جاكيت
      treinta: ثلاثون
      zapatos: أحذية
      cuestan: يكلّفون (من costar)
      veinticinco: خمسة وعشرون
      delantal: مئزر
      barato: رخيص
      solo: فقط
      doce: اثنا عشر
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (الأرخص)
    gloss: كيف تتكوّن صيغة التفضيل من el/la + más + صفة.
    note: 'El más barato (الأرخص) صيغة تفضيل: el/la + más + صفة، ويُذكر بعدها de/en لتسمية المجموعة المقارَن بها. لا تشرح هذه الوحدة نمط المقارنة كاملًا بعد، بل هذه العبارة الشائعة في التسوق فقط.'
    target_text: '*El más barato* (الأرخص) صيغة تفضيل: *el/la* + *más* + صفة، ويُذكر بعدها بـ *de/en* المجموعة المقارَن بها. لا تشرح هذه الوحدة نمط المقارنة كاملًا بعد، بل هذه العبارة الشائعة في التسوق فقط.'
  es.a1.unit11.lesson06.teach.line01:
    title: اذكر الحاجة
    gloss: تقول إيلينا إنهما يحتاجان إلى مآزر للورشة.
    note: '*Delantales* هي جمع *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: وافق واقترح متجرًا
    gloss: يوافق ماتيو ويقترح الذهاب إلى ذلك المتجر.
    note: '*Tienes razón* تعني «أنت محق»؛ و*esa tienda* تعني «ذلك المتجر».'
  es.a1.unit11.lesson06.teach.line03:
    title: البائع يحييهما
    gloss: يحييهما البائع ويعرض مساعدتهما.
    note: '*¿Los ayudo?* (هل أساعدكما؟) عبارة ترحيب معتادة من البائع، وهو يخاطب إيلينا وماتيو معًا.'
  es.a1.unit11.lesson06.teach.line04:
    title: اذكر ما يبحثان عنه
    gloss: تقول إيلينا نعم، إنهما يبحثان عن مآزر.
    note: '*Buscamos* (نبحث عن) هي صيغة *nosotros* من الفعل *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: البائع يعرض الخيارات ويسأل عن المقاس
    gloss: يعرض البائع بعض المآزر ويسألهما عن مقاسهما.
    note: في *¿Qué talla usan?* صيغة الجمع *usan* (تلبسان)، لأنه يخاطبهما معًا، بخلاف المفرد *usas*.
  es.a1.unit11.lesson06.teach.line06:
    title: اذكر مقاسًا
    gloss: يقول ماتيو إنه يلبس المقاس المتوسط.
    note: '*Uso la talla mediana* جواب عن *¿Qué talla usan?* من ماتيو عن نفسه.'
  es.a1.unit11.lesson06.teach.line06b:
    title: إيلينا توافق
    gloss: تقول إيلينا إن مقاسها هو نفسه.
    note: '*Yo también* تعني «وأنا أيضًا».'
  es.a1.unit11.lesson06.teach.line07:
    title: اسأل عن السعر
    gloss: يسأل ماتيو عن سعر المئزر.
    note: '*Este* (هذا) يشير إلى المئزر الذي أمامه.'
  es.a1.unit11.lesson06.teach.line07b:
    title: اذكر السعر
    gloss: يقول البائع إنه يكلّف اثني عشر.
    note: '*Cuesta* + عدد تعطي السعر.'
  es.a1.unit11.lesson06.teach.line08:
    title: أكّد أنه مناسب وقرّر الشراء
    gloss: تقول إيلينا إنه مناسب لها، وإنه يعجبها، وإنها ستشتريه.
    note: يجمع بالترتيب بين *me queda bien* و*me gusta este* و*voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: وافق واشترِ اثنين
    gloss: يوافق ماتيو على أنه مناسب له أيضًا، ويشتريان اثنين.
    note: '*A mí también* (وأنا أيضًا، للتوكيد) تعيد نمط الموافقة بـ*también* مع ضمير توكيدي؛ و*compramos dos* تختم المشهد.'
