teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: الاتصال
    gloss: يتصل
    note: صيغة المصدر للفعل الذي يُستخدم لإجراء مكالمة هاتفية.
    example_gloss: عليّ أن أتصل بك.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: قول إنك ستتصل
    gloss: سأتصل بك.
    note: '*Llamo* هي صيغة *yo* من الفعل *llamar*؛ ومع *te* تعني حرفياً «أتصل بك». تستخدم الإسبانية المضارع هنا للتعبير عن المستقبل القريب.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: الرد على الهاتف
    gloss: مرحباً، أنا إيلينا.
    note: تعرّف الإسبانية بالمتحدث على الهاتف بقول *soy* + الاسم (حرفياً «أنا + الاسم»).
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: ماتيو يرد بالطريقة نفسها
    gloss: مرحباً، أنا ماتيو.
    note: النمط نفسه *soy* + الاسم كما في *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: السؤال عن هوية المتصل
    gloss: مع من أتحدث؟
    note: '*¿Con quién hablo?* هي العبارة المعتادة حين لا تعرف من يتصل بك.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: التعريف بنفسك بصيغة رسمية
    gloss: تتحدث مع إيلينا.
    note: '*Habla con* + الاسم تستخدم صيغة *usted* الرسمية من الفعل *hablar*: وهي المقابل المهذب لـ *soy* + الاسم.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: طلب الإعادة
    gloss: هل يمكنك إعادة ذلك؟
    note: '*¿Puedes...?* (هل يمكنك...؟) + *repetir* (يعيد) + *eso* (ذلك).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: طلب التحدث ببطء
    gloss: لا تتكلم بهذه السرعة، من فضلك.
    note: '*No hables* هي صيغة النهي غير الرسمية من الفعل *hablar*؛ و*tan rápido* (بهذه السرعة) تبيّن الدرجة.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: قول إنك لا تسمع جيداً
    gloss: لا أسمعك جيداً.
    note: يدلّ الفعل *Oír* (يسمع) مع *no ... bien* (ليس جيداً) على مشكلة في السمع، وهو يختلف عن *entender* (يفهم)؛ و*te oigo* تعني «أسمعك».
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: رسالة نصية
    gloss: الرسالة النصية
    note: 'اسم مذكّر: *el mensaje*. ويقول الإسبان أيضاً *el SMS* أو *el texto*، لكن *mensaje* هو الخيار المحايد.'
    example_gloss: الرسالة النصية من إيلينا.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: قول إنك سترسل رسالة
    gloss: سأرسل لك رسالة.
    note: 'يأتي الفعل *Enviar* (يرسل) بعد الضمير *te* (لك): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: قول إنك ستعاود الاتصال
    gloss: سأتصل بك لاحقاً.
    note: 'تأتي *Más tarde* (لاحقاً) في آخر الجملة: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: قراءة محادثة نصية
    gloss: 'ماتيو: مرحباً إيلينا، هل يمكنك الاتصال بي؟ أريد أن أخبرك بشيء. إيلينا: نعم بالطبع، سأعاود الاتصال بك بعد خمس دقائق.'
    note: تتبّع ما يطلبه ماتيو، ولماذا يطلبه، ومتى تقول إيلينا إنها ستعاود الاتصال.
    glosses:
      Hola: مرحباً
      puedes: تستطيع
      llamarme: الاتصال
      Tengo: يجب أن / عليّ
      algo: شيئاً
      contarte: أخبر
      claro: بالطبع
      llamada: الاتصال
      cinco: خمس
      minutos: دقائق
      devuelvo: أعيد
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: ماتيو يردّ على المكالمة
    gloss: 'ماتيو: مرحباً، أنا ماتيو.'
    note: 'النمط نفسه *soy* + الاسم من الدرس الأول، يُستخدم الآن في مكالمة هاتفية فعلية: الشخص الذي يردّ يتكلم أولاً ويذكر اسمه.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: إيلينا تعرّف بنفسها
    gloss: 'إيلينا: مرحباً ماتيو، أنا إيلينا. ماتيو: شكراً على اتصالك!'
    note: '*Gracias por llamar* (شكراً على الاتصال) تتكوّن من *gracias por* + المصدر.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: إيلينا تسأل عن المناوبة
    gloss: 'إيلينا: كيف كانت مناوبتك الأولى؟'
    note: '*Ha ido* هو الماضي القريب من الفعل *ir* (وهو هنا بمعنى «سار الأمر»): *ha* + اسم المفعول *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: ماتيو يخبر بأخبار جيدة
    gloss: 'ماتيو: سارت الأمور بشكل جيد جداً، أفضل مما توقعت.'
    note: تكرّر *Ha ido muy bien* الصيغة نفسها الواردة في السؤال؛ أما *mejor de lo esperado* (أفضل مما كان متوقعاً) فتقارن باستخدام *de lo*.
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido وes وesperado مع مصادرها
    gloss: ha ido → ir (يذهب)، es → ser (يكون)، esperado → esperar (يتوقّع)
    note: 'تظهر *Ha ido* و*es* و*esperado* مع مصادرها: *ir* و*ser* و*esperar*. تعامل الآن مع *ha ido muy bien* كعبارة ثابتة؛ وسيأتي التدرّب على الماضي القريب بشكل وافٍ لاحقاً.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: إيلينا فخورة
    gloss: 'إيلينا: ما أجمل سماع ذلك! أنا فخورة بك.'
    note: '*Orgulloso/a de* (فخور بـ) تركيب ثابت مع *de*؛ وتتفق الصفة مع المتكلم (*orgullosa* لإيلينا).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: ماتيو متأثر
    gloss: 'ماتيو: شكراً جزيلاً، هذا يعني لي الكثير.'
    note: '*Significa* هي صيغة الغائب المفرد من الفعل *significar* (يعني)؛ و*para mí* (بالنسبة إليّ) تحدّد لمن يهمّ الأمر.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: 'الملكية: su'
    gloss: سارت مناوبته الأولى بشكل جيد جداً.
    note: '*Su* هنا صفة ملكية بمعنى «له» (وتعني أيضاً «لها» أو «لك» مع *usted*)؛ ويحدّد السياق صاحب الشيء.'
