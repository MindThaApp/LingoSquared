course:
  title: الإسبانية A1
  description: أماكن شائعة في الحي وحروف الجر الدالة على المكان، مع متابعة قصة إيلينا وماتيو، حيث يسأل ماتيو، وهو جديد في المنطقة، عن الحي. تُقدَّم عبارات المكان الخمس بوصفها علاقات مكانية مختلفة لا يحل بعضها محل بعض.
