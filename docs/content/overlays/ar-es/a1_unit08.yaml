    - نأكل في المطعم.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: مكتبة
    gloss: مكتبة
    note: كلمة *Biblioteca* مؤنثة.
    example_gloss: أدرس في المكتبة.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: قريب
    gloss: المطعم قريب من السوق.
    note: تأتي *Cerca de* (قريب من) دائمًا مع *de* قبل المكان المرجعي.
  es.a1.unit08.lesson02.teach.lejos_de:
    title: بعيد عن
    gloss: الحديقة بعيدة عن السوق.
    note: '*Lejos de* (بعيد عن) عكس *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: بجانب
    gloss: المصرف بجانب السوق.
    note: '*Al lado de* (بجانب) عبارة ثابتة (*al* = *a* + *el lado*). وقبل اسم مذكر مثل *mercado* تُدمج *de* + *el* في *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: مقابل
    gloss: الصيدلية مقابل السوق.
    note: تصف *Enfrente de* (مقابل) مكانين على جانبين متقابلين من شيء ما، مثل الشارع.
  es.a1.unit08.lesson02.teach.entre:
    title: بين
    gloss: المكتبة بين المصرف والحديقة.
    note: تحتاج *Entre* (بين) إلى نقطتين مرجعيتين، وتُربطان هنا بالحرف *y* (و).
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: اسأل عن مكان المصرف
    gloss: أين المصرف؟
    note: '*Dónde está* (أين يوجد) هي صيغة السؤال المعتادة لمعرفة مكان شيء ما.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: الإجابة بتحديد المكان
    gloss: إنه بجانب السوق.
    note: '*Del* هي اندماج *de* + *el*، وهي واجبة قبل الاسم المذكر *mercado*.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: اسأل عن مكان الصيدلية
    gloss: أين الصيدلية؟
    note: صيغة السؤال نفسها مع اسم مؤنث، فالسؤال لا يتغير بحسب الجنس.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'الإجابة: مقابل'
    gloss: إنها مقابل السوق.
    note: 'تصبح *Enfrente de* + *el mercado* هكذا: *enfrente del mercado*، وهو الاندماج نفسه *del* كما في *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: اسأل هل هو بعيد
    gloss: هل هو بعيد؟
    note: سؤال متابعة قصير يُحذف فيه الفاعل لأنه واضح من السياق.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'الإجابة: لا، إنه قريب'
    gloss: لا، إنه قريب.
    note: تصلح *Cerca* وحدها (دون *de*) إجابةً قصيرة، بخلاف العبارة الكاملة *cerca de* التي تُستخدم مع مكان مذكور بالاسم.
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'الإجابة: نعم، بعيد نوعًا ما'
    gloss: نعم، إنه بعيد نوعًا ما.
    note: تقوّي *Bastante* (نوعًا ما، إلى حد كبير) معنى *lejos* دون أن تبلغ قوة *muy* (جدًا).
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: قراءة عن الحي
    gloss: في هذا الحي أماكن كثيرة مفيدة. المصرف بجانب السوق. الصيدلية مقابل السوق. الحديقة بعيدة، لكن المكتبة بين المصرف والحديقة. المطعم قريب جدًا من السوق.
    note: يجمع هذا النص القصير عبارات المكان التي وردت في هذه الوحدة ضمن وصف واحد للحي.
    glosses:
      barrio: حي
      hay: يوجد (من haber)
      muchos: كثير
      lugares: أماكن
      útiles: مفيد
      banco: مصرف
      está: يقع (من estar)
      lado: جانب
      mercado: سوق
      farmacia: صيدلية
      enfrente: مقابل
      parque: حديقة
      lejos: بعيد
      biblioteca: مكتبة
      entre: بين
      restaurante: مطعم
      cerca: قريب
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (يوجد)
    gloss: لماذا لا تتغير hay بين المفرد والجمع.
    note: انظر إلى نص البطاقة نفسها.
    target_text: 'لا تتغير كلمة *Hay* (يوجد) بين المفرد والجمع: تُستخدم الكلمة نفسها في *hay un banco* وفي *hay muchos lugares*.'
  es.a1.unit08.lesson06.teach.line01:
    title: اسأل عن مكان المصرف
    gloss: ماتيو يسأل إيلينا أين المصرف.
    note: هو سؤال *¿Dónde está...?* نفسه الذي مرّ في هذه الوحدة، ويبدأ باسم إيلينا للفت انتباهها.
  es.a1.unit08.lesson06.teach.line02:
    title: الجواب مع الإشارة إلى السوق
    gloss: تقول إيلينا إنه بجانب السوق، حيث اشتريا البيض.
    note: تشير *Donde compramos los huevos* (حيث اشترينا البيض) إلى رحلة تسوقهما في الوحدة 7.
  es.a1.unit08.lesson06.teach.line03:
    title: اسأل عن الصيدلية
    gloss: ماتيو يتذكر ثم يسأل عن الصيدلية.
    note: '*Ah, sí* (آه، نعم) عبارة قصيرة طبيعية للإقرار قبل السؤال التالي.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'الإجابة: مقابل'
    gloss: تقول إيلينا إنها قبالة السوق.
    note: 'إجابة قصيرة: حُذف الفاعل (*la farmacia*) لأنه واضح من السؤال.'
  es.a1.unit08.lesson06.teach.line05:
    title: السؤال عن الحديقة
    gloss: يسأل ماتيو عن الحديقة وعمّا إذا كانت قريبة.
    note: يجمع سؤالين في جملة واحدة، وهذا طبيعي في الحديث العادي.
  es.a1.unit08.lesson06.teach.line06:
    title: 'الجواب: بعيدة، ثم ذكر المكتبة'
    gloss: تقول إيلينا إن الحديقة بعيدة، لكن المكتبة بين البنك والحديقة.
    note: تُستعمل *Pero* (لكن) للمقابلة بين بُعد الحديقة وموقع المكتبة الأنسب.
  es.a1.unit08.lesson06.teach.line07:
    title: الشكر والسؤال عن المطعم
    gloss: يشكر ماتيو إيلينا ويسأل عن المطعم الذي تناولا فيه الطعام.
    note: تشير *El restaurante donde comimos* (المطعم الذي تناولنا فيه الطعام) إلى غدائهما في الوحدة 6.
  es.a1.unit08.lesson06.teach.line08:
    title: التأكيد أنه قريب جدًا
    gloss: تؤكد إيلينا أنه قريب جدًا من السوق.
    note: '*Muy cerca* (قريب جدًا): كلمة *muy* (جدًا) أقوى من *bastante* (إلى حد كبير) كما في *bastante lejos* (بعيد إلى حد كبير).'
