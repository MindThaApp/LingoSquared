      saludo: تحياتي
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: رسالة تأكيد
    gloss: مرحبًا إيلينا، نعم، فكرة جميلة! يوم الجمعة في الساعة 2:30 يناسبني. إلى اللقاء يوم الجمعة! ماتيو.
