  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: دعوة إيلينا
    gloss: مرحبًا ماتيو، هل ترغب في شرب القهوة في مقهى اللغات يوم السبت 18 أبريل في الساعة 2:30؟ مع التحية، إيلينا.
