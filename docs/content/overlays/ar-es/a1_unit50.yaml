    note: '*¡Buena idea!* تقبل الاقتراح بالثناء عليه.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: هذه خطة جيدة
    gloss: هذه خطة جيدة.
    note: هذا ردّ إيجابي أكثر اكتمالًا بقليل.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: الرفض مع ذكر السبب
    gloss: آسف، لا أستطيع لأنني أعمل.
    note: تلطّف *Lo siento* الرفض، وتقدّم *porque* السبب القصير.
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: ليس لدي وقت
    gloss: ليس لدي وقت.
    note: '*No tengo tiempo* سبب مباشر لكنه عادي للرفض؛ وتأتي *no* قبل الفعل.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: رفض لطيف
    gloss: Lo siento + no puedo + سبب قصير يجعل الرفض لطيفًا.
    note: ذكر السبب اختياري في المحادثة، لكنه يجعل الردّ مفيدًا ومهذبًا.
  es.a1.unit50.lesson03.teach.quedar:
    title: الاتفاق على لقاء
    gloss: الاتفاق على لقاء
    note: 'تعني *Quedar* الاتفاق على لقاء: *¿Quedamos el viernes?* ويقول كثير من المتحدثين في أمريكا اللاتينية *¿Nos vemos el viernes?* بدلًا منها.'
    example_gloss: هل نلتقي يوم الجمعة في الساعة 2:30؟
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: اللقاء يوم الجمعة في الثانية والنصف
    gloss: هل نلتقي يوم الجمعة في الساعة 2:30؟
    note: تجمع هذه الجملة بين يوم الأسبوع *el viernes* و*a las* مع الوقت.
  es.a1.unit50.lesson03.teach.las_dos_y:
