    gloss: las dos y media = 2:30؛ و a las dos y media تحدد وقت الموعد.
    note: 'العدّ في الإسبانية يبدأ من الساعة التي مضت، كما في العربية: *las dos y media* تعني 2:30، حرفيًا "الثانية والنصف".'
  es.a1.unit50.lesson03.teach.el_viernes_17:
