    gloss: شرب القهوة
    note: تقول الإسبانية *tomar un café* (حرفيًا "أخذ قهوة")، وهي العبارة المعتادة لشرب القهوة.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: الذهاب إلى السينما
    gloss: الذهاب إلى السينما
    note: '*Ir al cine* ("الذهاب إلى السينما") هي الطريقة المعتادة للقول إنك تذهب لمشاهدة فيلم؛ و*al* هي *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: هل نشرب القهوة؟
    gloss: هل نشرب القهوة؟
    note: تستخدم *¿Tomamos ...?* المضارع بصيغة *nosotros* لاقتراح فعل شيء معًا.
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: استخدام ¿Tomamos ...؟
    gloss: ¿Tomamos + شيء؟ هي الطريقة المعتادة لاقتراح فعل شيء معًا.
    note: 'صيغة *nosotros* (*tomamos*) تؤدي معنى الاقتراح بصيغة "هل نفعل؟": *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: هل ترغب في الذهاب إلى السينما؟
    gloss: هل ترغب في الذهاب إلى السينما؟
    note: تسأل *¿Tienes ganas de ...?* بشكل غير رسمي إن كان الشخص يرغب في فعل شيء؛ ويأتي المصدر بعد *de*.
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: نعم، رائع!
    gloss: نعم، رائع!
    note: '*¡Sí, qué bien!* قبول قصير ومتحمس.'
