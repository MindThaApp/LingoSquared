course:
  title: الإسبانية A1
  description: 'إسبانية للمبتدئين لوصف أنشطة وقت الفراغ: مفردات الهوايات، وعبارات التكرار، والسؤال عمّا يفعله شخص ما في وقت فراغه والإجابة عنه، ومقارنة هوايات شخصين.'
