teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *leer* (يقرأ)، و*hacer deporte* (يمارس الرياضة)، و*cocinar* (يطبخ).'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*El tiempo libre* عبارة اسمية مذكرة، وهي العبارة الأساسية للحديث عن الهوايات.'
    example_gloss: في وقت فراغي، أحب القراءة.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: تستخدم *Me gusta leer* (أحب القراءة) الفعل *gustar* + المصدر؛ وتبقى *me gusta* كما هي مع أي نشاط.
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاثة أفعال أخرى للهوايات: *escuchar música* (يستمع إلى الموسيقى)، و*dibujar* (يرسم)، و*jugar videojuegos* (يلعب ألعاب الفيديو).'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: 'في الإسبانية يأتي مفعول *escuchar* مباشرة دون حرف جر: *escuchar música*، بينما نقول في العربية «استمع إلى» بحرف الجر.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: تعيد عبارة *Con amigos* (مع الأصدقاء) استخدام حرف الجر *con* من الدروس السابقة.
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: 'أربعة ظروف أساسية للتكرار: *siempre* (دائمًا)، *a menudo* (غالبًا)، *a veces* (أحيانًا)، *nunca* (أبدًا). تأتي عادةً قبل الفعل أو في بداية الجملة.'
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: تعني *cada semana* و*cada fin de semana* «كل أسبوع» و«كل عطلة أسبوع»؛ وكلمة *cada* لا يتغير شكلها أبدًا.
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada لا تتغير أبدًا
    gloss: 'تبقى Cada كما هي: cada semana، cada fin de semana.'
    note: 'كلمة *Cada* لا تتغير: تبقى نفسها قبل الاسم المؤنث (*semana*) والاسم المذكر (*fin de semana*).'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena تتحدث عن الهوايات
    gloss: 'Elena: غالبًا ما نتنزه معًا. لكن ماذا تفعل أيضًا في وقت فراغك يا Mateo؟'
    note: '*A menudo paseamos juntos* (غالبًا ما نتنزه معًا): الفعل *paseamos* هو صيغة *nosotros* من *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: هوايات Mateo
    gloss: 'Mateo: أحب الطبخ، في البيت أيضًا. وأمارس الرياضة كثيرًا.'
    note: تدل عبارة *También en casa* (في البيت أيضًا) على أن Mateo يطبخ للمتعة وليس فقط في عمله في المطعم.
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena مندهشة
    gloss: 'Elena: هل تطبخ في البيت أيضًا؟ أنت تطبخ طوال اليوم في العمل!'
    note: تؤكد عبارة *Todo el día* (طوال اليوم) كم يطبخ Mateo أصلًا في عمله.
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo يشرح
    gloss: 'Mateo: نعم، لكن الطبخ يبدو لي مريحًا. وأنتِ، ماذا تحبين أن تفعلي؟'
    note: 'معنى *Cocinar me parece relajante* حرفيًا «الطبخ يبدو لي مريحًا»: تعد *me parece* + صفة طريقة طبيعية لإبداء الرأي.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: هوايات Elena
    gloss: 'Elena: أحب القراءة وأستمع إلى الموسيقى كثيرًا.'
    note: تجمع هذه الجملة فعلين للهوايات من دروس سابقة بالحرف *y* (و).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo يسأل عن ألعاب الفيديو
    gloss: 'Mateo: هل تلعبين ألعاب الفيديو أيضًا؟'
    note: سؤال قصير جوابه نعم أو لا يستخدم *jugar videojuegos* من الدرس الثاني؛ وتستخدم *tú también* (أنتِ أيضًا) الضمير غير الرسمي *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena تجيب
    gloss: 'Elena: لا، لا ألعب ألعاب الفيديو أبدًا. لكنني أرسم أحيانًا!'
    note: '*Nunca* (أبدًا) و*a veces* (أحيانًا) من الدرس الثالث، في جواب واحد يجمع بينهما.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: مقارنة الهوايات
    gloss: أتنزه أنا وMateo معًا كثيرًا. لكن لدينا هوايات أخرى أيضًا. يحب Mateo الطبخ، في البيت أيضًا، ويمارس الرياضة كثيرًا. أما أنا فأحب القراءة وأستمع إلى الموسيقى كثيرًا. أرسم أحيانًا، لكنني لا ألعب ألعاب الفيديو أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخص رسالة Elena معلومات من الدرس الرابع وتنتهي بطرح سؤال الوحدة الأساسي على القارئ.
    glosses:
      paseamos: يتنزه
      menudo: غالبًا
      juntos: معًا
      otras: أخرى
      cocinar: يطبخ
      gusta: يحب
      casa: في البيت
      deporte: يمارس الرياضة
      leer: القراءة
      escucho: أستمع
      música: موسيقى
      dibujo: أرسم
      veces: أحيانًا
      videojuegos: ألعب ألعاب الفيديو
      nunca: أبدًا
      libre: فراغ
      tiempo: وقت
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo يسأل عن عطلة نهاية الأسبوع
    gloss: 'Mateo: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: تستخدم عبارة *Este fin de semana* (عطلة نهاية الأسبوع هذه) الكلمة *este* مع الاسم المذكر *fin de semana*.
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena لم تقرر بعد
    gloss: 'Elena: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج.'
    note: عبارة *Quiero salir* (أريد أن أخرج) طريقة شائعة للقول إنك تريد مغادرة البيت.
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo يقترح خطة
    gloss: 'Mateo: هل نتنزه معًا؟ بعد ذلك أطبخ لنا.'
    note: 'كلمة *Después* (بعد ذلك) من كلمات الترتيب: *primero*، *luego*، *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena توافق
    gloss: 'Elena: فكرة رائعة! يعجبني الأمران: التنزه والطبخ.'
    note: تدل عبارة *Las dos cosas* (الأمران معًا) على أن Elena تحب الشيئين بالقدر نفسه.
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo يؤكد
    gloss: 'Mateo: رائع! إذن أراكِ يوم السبت!'
    note: عبارة ودية لتأكيد الخطة ليوم السبت (*el sábado*)؛ تضع الإسبانية *el* قبل اليوم المحدد.
