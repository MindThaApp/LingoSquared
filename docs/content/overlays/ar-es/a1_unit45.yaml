teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: السؤال عن السعر الإجمالي
    gloss: كم يكلّف في المجموع؟
    note: تُوضّح عبارة *En total* أنك تريد السعر الكلي المجموع، لا سعر قطعة واحدة.
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: ذكر السعر الإجمالي
    gloss: يكلّف خمسة وعشرين يورو في المجموع.
    note: '*Cuesta* هو فعل *costar* (يكلّف) للمفرد الغائب؛ وتتحول حركة الجذر من *o* إلى *ue* عندما تكون مشدّدة.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: الدفع بالبطاقة أو نقدًا
    gloss: يدفع بالبطاقة، يدفع نقدًا
    note: 'تستخدم *Pagar con tarjeta* (الدفع بالبطاقة) و*pagar en efectivo* (الدفع نقدًا) حرفَي جرّ مختلفين: *con* للأداة، و*en* لشكل المال.'
    example_gloss:
    - هل يمكنني الدفع بالبطاقة هنا؟
    - أنا أدفع نقدًا.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: السؤال عن إمكانية الدفع بالبطاقة
    gloss: هل يمكنني الدفع بالبطاقة هنا؟
    note: '*Puedo* (أستطيع) هو صيغة *yo* من الفعل *poder*؛ و*aquí* (هنا) تحدّد أن السؤال عن المكان الحالي.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: السؤال عن طريقة الدفع المفضّلة
    gloss: هل تريد الدفع نقدًا أم بالبطاقة؟
    note: '*Quiere* هي صيغة *usted* الرسمية من الفعل *querer*، يستخدمها هنا أمين صندوق لا يعرفك؛ ومع صديق تقول *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: الفاتورة
    gloss: الفاتورة
    note: 'اسم مؤنث: *la cuenta*. في المطعم تعني الفاتورة، وفي المصرف تعني الحساب.'
    example_gloss: هل نقسّم الفاتورة؟
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: اقتراح تقسيم الفاتورة
    gloss: هل نقسّم الفاتورة؟
    note: تستخدم *¿Dividimos...?* صيغة *nosotros* (نحن) لتقديم اقتراح، وهو ما تؤدّيه العربية بعبارة «هل نفعل...؟».
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: طلب الدفع على حدة
    gloss: هل يمكنني الدفع على حدة؟
    note: '*Por separado* (على حدة) تبيّن كيف تدفع؛ و*pagar* (يدفع) هو الفعل اليومي المستخدم لذلك.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: الباقي
    gloss: الباقي
    note: 'اسم مذكر: *el cambio*. ويعني أيضًا التغيير في أي شيء، كما في *un cambio de planes*.'
    example_gloss: تفضّل، هذا هو الباقي.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: تسليم الباقي
    gloss: تفضّل، هذا هو الباقي.
    note: '*Su* هو صفة الملكية المناسبة لصيغة *usted* الرسمية (الخاص بك)؛ و*Aquí tiene* هي الطريقة المهذّبة المعتادة لتسليم شيء ما.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: رفض أخذ الباقي
    gloss: لا أحتاج إلى الباقي.
    note: 'يأتي مفعول *Necesitar* (يحتاج) مباشرة دون حرف جر: *necesito cambio*؛ أما *no* فتنفي الفعل.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: خمسة وثلاثون
    gloss: خمسة وثلاثون
    note: '*Treinta y cinco* (خمسة وثلاثون): من 31 إلى 99 تربط الإسبانية العشرات بالآحاد بـ *y* (و)، وتُكتب ككلمات منفصلة.'
    example_gloss: يكلّف خمسة وثلاثين يورو.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: اقرأ فاتورة مطعم
    gloss: 'الفاتورة: طبقان رئيسيان وقهوتان. المجموع: خمسة وثلاثون يورو. مدفوعة بالبطاقة.'
    note: تتبّع ما طُلب، والمجموع، وطريقة الدفع.
    glosses:
      Cuenta: فاتورة
      dos: اثنان
      platos: أطباق رئيسية
      cafés: قهوتان
      Total: المجموع
      treinta: خمسة وثلاثون
      euros: يورو
      Pagado: مدفوعة
      tarjeta: بطاقة
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: إيلينا تطلب الفاتورة
    gloss: 'إيلينا: هل نطلب الفاتورة؟'
    note: 'يأخذ الفعل *Pedir* (يطلب) العبارة *la cuenta* مفعولًا به مباشرًا: *pedimos la cuenta* (نطلب الفاتورة).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: ماتيو يسأل عن المجموع
    gloss: 'ماتيو: نعم، فكرة جيدة. كم يكلّف في المجموع؟'
    note: يعيد استخدام السؤال *¿cuánto cuesta en total?* من الدرس الأول.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: إيلينا تذكر المجموع
    gloss: 'إيلينا: المجموع خمسة وثلاثون يورو. هل نقسّمه؟'
    note: 'يُستخدم *Son* مع المبالغ المالية: *son treinta y cinco euros* بفعل الجمع لأن المبلغ جمع.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: ماتيو يصرّ على الدفع
    gloss: 'ماتيو: لا، دعيني أدفع اليوم. لقد ساعدتِني كثيرًا.'
    note: تستخدم *Deja que pague yo* (دعني أدفع) صيغة المضارع الالتزامي *pague* بعد *que*؛ احفظها الآن كعرض جاهز. و*Me has ayudado* هو الماضي التام (لقد ساعدتني).
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: إيلينا متأثرة
    gloss: 'إيلينا: ما ألطفك! شكرًا جزيلًا.'
    note: تستخدم *¡Qué amable eres!* (ما ألطفك!) الصيغة *qué* + صفة للتعبير بدفء عن التأثر بتصرف كريم، وتعني *muchas gracias* شكرًا أقوى من *شكرًا* وحدها.
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: ماتيو يسأل عن الدفع بالبطاقة
    gloss: 'ماتيو: هل يمكنني الدفع بالبطاقة هنا؟'
    note: يعيد استخدام السؤال *¿puedo pagar con tarjeta aquí?* من الدرس الثاني، وهذه المرة في المطعم فعلًا.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: صيغة الغائب'
    gloss: ماتيو يدفع الفاتورة.
    note: '*Paga* هو فعل *pagar* (يدفع) للمفرد الغائب: *Mateo paga la cuenta*.'
