  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: ارتداء الملابس
    gloss: ارتداء الملابس → أرتدي ملابسي
    note: 'الفعل *Vestirse* انعكاسي أيضًا: *Me visto*. هنا يعني *me* "نفسي".'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: تناول الفطور
    gloss: تناول الفطور → أتناول الفطور
    note: 'الفعل *Desayunar* ليس انعكاسيًا: *Desayuno*، من دون *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: العمل
    gloss: العمل → أعمل
    note: 'الفعل *Trabajar* فعل منتظم ينتهي بـ -ar: تنتهي صيغته مع *yo* بـ -o، *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: الأكل
    gloss: الأكل → آكل
    note: 'الفعل *Comer* فعل منتظم ينتهي بـ -er: تنتهي صيغته مع *yo* بـ -o، *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: غسل الأطباق
    gloss: غسل الأطباق → أغسل الأطباق
    note: '*Lavar los platos* ليس انعكاسيًا: *Lavo los platos*. يبقى المفعول به *los platos* بعد الفعل.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: النوم
    gloss: النوم → أنام
    note: 'يتغير حرف العلة في جذر الفعل *Dormir* في صيغة *yo*: *duermo* (تتحول o إلى ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: نمط الأفعال الانعكاسية
    gloss: 'مع levantarse وvestirse يأتي الضمير قبل الفعل: levantarse → Me levanto.'
    note: 'مع الأفعال الانعكاسية ضع *me* قبل الفعل المصرّف: قل *Me levanto* وليس *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse في جملة
    gloss: 'الاستيقاظ: أستيقظ في السابعة.'
    note: 'تأتي عبارة الوقت بعد الفعل: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse في جملة
    gloss: 'ارتداء الملابس: أرتدي ملابسي.'
    note: 'النمط هو *me* + *visto*: يبقى الضمير أمام الفعل مباشرة.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos في جملة
    gloss: 'غسل الأطباق: أغسل الأطباق بعد الأكل.'
    note: تتكون عبارة *Después de comer* ("بعد الأكل") من *de* والمصدر، ويمكن أن تأتي في آخر الجملة.
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: أفعال بلا me
    gloss: 'من دون ضمير: أتناول الفطور. أعمل. أنام. هذه الأفعال ليست انعكاسية.'
    note: '*Desayuno* و*trabajo* و*duermo* بلا *me*: هذه الأفعال ليست انعكاسية.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: الاستيقاظ في السابعة والنصف
    gloss: أستيقظ في السابعة والنصف.
    note: 'تعبّر الإسبانية عن "والنصف" بـ *y media*: *las siete y media* هي 07:30. استخدم *a las* قبل الوقت.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: ارتداء الملابس في الثامنة إلا ربعًا
    gloss: أرتدي ملابسي في الثامنة إلا ربعًا.
    note: '*Las ocho menos cuarto* تُحسب تنازليًا من الساعة التالية: 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: تناول الفطور في الثامنة
    gloss: أتناول الفطور في الساعة الثامنة.
    note: 'استخدم *a las* قبل الوقت: *a las ocho*. أما الساعة الواحدة فتقول *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: العمل من التاسعة إلى الخامسة
    gloss: أعمل من الساعة التاسعة إلى الساعة الخامسة.
    note: 'تحدد *De ... a ...* وقت البداية ووقت النهاية: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: الأكل في السادسة والنصف
    gloss: آكل في السادسة والنصف مساءً.
    note: تحدد *De la tarde* أن الوقت مساءً، لذا فإن *las seis y media* هي هنا 18:30.
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: النوم في الحادية عشرة
    gloss: أنام في الساعة الحادية عشرة.
    note: 'استخدم *a las* قبل الوقت: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: أولًا، ثم، بعد ذلك
    gloss: أولًا، ثم، بعد ذلك
    note: تدل *Primero* على النشاط الأول، و*luego* على النشاط التالي، و*después* على ما يأتي بعده.
    example_gloss:
    - أولًا أستيقظ.
    - ثم أرتدي ملابسي.
    - بعد ذلك أتناول الفطور.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: صباح من ثلاث خطوات
    gloss: أولًا أستيقظ. ثم أرتدي ملابسي. بعد ذلك أتناول الفطور.
    note: 'تحتفظ الأفعال الانعكاسية بالضمير *me* أمام الفعل: *me levanto*، *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: كلمات الترتيب
    gloss: 'Primero وluego y después ترتّب أفعالك؛ ولا يتغير الفعل: Después desayuno.'
    note: 'تأتي كلمات الترتيب في بداية الجملة ولا تتغير صيغة الفعل: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: يومي
    gloss: يومي — أستيقظ في السابعة والنصف. بعد ذلك أرتدي ملابسي، وفي الثامنة أتناول الفطور. أعمل من التاسعة إلى الخامسة. في السادسة والنصف مساءً آكل. بعد ذلك أغسل الأطباق. في الحادية عشرة أنام.
    note: اقرأ مع الانتباه إلى ترتيب الأنشطة وأوقاتها. لاحظ *me levanto* و*me visto* مع *me*.
    glosses:
      Mi: خاصتي
      día: يوم
      levanto: أستيقظ (me levanto)
      media: والنصف (y media = والنصف)
      ocho: ثمانية
      Después: بعد ذلك
      visto: يرتدي ملابسه (me visto)
      las: 'الساعة (قبل الوقت: las ocho)'
      desayuno: يتناول الفطور
      Trabajo: يعمل
      nueve: تسع
      cinco: خمس
      siete: سبع
      tarde: في المساء
      como: يأكل
      lavo: يغسل الأطباق (lavo los platos)
      once: إحدى عشرة
      duermo: ينام
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: السؤال عن اليوم
    gloss: 'إيلينا: كيف يكون يومك يا ماتيو؟'
    note: '*¿Cómo es tu día?* طريقة غير رسمية لسؤال شخص عن وصف يومه؛ و*tu* تعني «خاصتك» في الصيغة غير الرسمية، أي «يومك».'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: صباح ماتيو
    gloss: 'ماتيو: أستيقظ في السابعة والنصف. بعد ذلك أرتدي ملابسي، وفي الثامنة أتناول الفطور.'
    note: يربط ماتيو بين ثلاثة أنشطة صباحية باستخدام *después* و*y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: يوم عمل ماتيو
    gloss: 'إيلينا: متى تعمل؟ ماتيو: أعمل من التاسعة إلى الخامسة.'
    note: 'تستخدم إيلينا وماتيو صيغة المخاطب غير الرسمية *tú* فيما بينهما: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: مساء ماتيو
    gloss: 'ماتيو: في السادسة والنصف مساءً آكل. بعد ذلك أغسل الأطباق. وفي الحادية عشرة أنام.'
    note: 'تأتي *Después* في بداية الجملة، لكن صيغة الفعل تبقى كما هي: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: صباح إيلينا
    gloss: 'إيلينا: أستيقظ في السادسة، لكنني لا أتناول الفطور قبل السادسة والنصف.'
    note: تعني *No ... hasta* «ليس قبل ... / لا ... إلا في». تقارن إيلينا بين وقت استيقاظها ووقت فطورها.
