teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: طويل وقصير
    gloss: طويل / قصير
    note: 'تصف *alto* الشخص الطويل وتصف *bajo* الشخص القصير؛ وكلتاهما تتفقان مع الشخص: *alta*، *baja*.'
    example_gloss:
    - لوسيا طويلة.
    - دييغو قصير.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: تعطي *mayor* و*joven* انطباعًا عامًا عن العمر، لا عددًا محددًا من السنوات.
    example_gloss:
    - الجد كبير في السن.
    - ماتيو شاب.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: انطباع وليس رقمًا'
    gloss: للتعبير عن العمر بدقة نستعمل tener años، مثل ¿Cuántos años tienes؟ أما mayor فتعطي انطباعًا عامًا دون رقم، مثل El abuelo es mayor.
    note: 'للتعبير عن العمر بدقة نقول *tener años*: *¿Cuántos años tienes?* أما *Mayor* فتعطي انطباعًا عامًا فقط، دون رقم.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: لوسيا طويلة ودييغو قصير
    gloss: لوسيا طويلة ودييغو قصير.
    note: جملة بسيطة مركبة بالحرف *y* ("و")، تمهّد للمقارنة المباشرة في درس لاحق.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: الشعر
    gloss: الشعر
    note: '*El pelo* مذكر ويبقى مفردًا عندما نتحدث عن شعر الشخص كله.'
    example_gloss: ماتيو شعره أسود قصير.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: 'ثلاثة ألوان للشعر: *rubio* (أشقر) و*castaño* (بني) و*gris* (رمادي). تتفق *Rubio* مع الاسم: *pelo rubio*، *melena rubia*.'
    example_gloss:
    - شعر إيلينا أشقر.
    - شعر دييغو بني.
    - شعر الجد رمادي.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: 'سبق أن تعلمنا *Largo* (طويل) في درس الطول، وهنا نستعملها لطول الشعر؛ أما *corto* (قصير) فجديدة: *el pelo largo*، *el pelo corto*.'
    example_gloss:
    - شعر لوسيا طويل.
    - شعر دييغو قصير.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: الصفة تأتي بعد الاسم
    gloss: 'تأتي الصفة بعد الاسم: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'في الإسبانية، كما في العربية، تأتي الصفة بعد الاسم وتتفق معه: *el pelo corto*، *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo وcabello
    gloss: 'تعنيان Pelo وcabello الشيء نفسه. في هذه الدورة نستعمل pelo: el pelo largo.'
    note: تعني *Pelo* و*cabello* كلتاهما "الشعر" في الإسبانية اليومية؛ وتستعمل هذه الدورة *pelo*.
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: ماتيو شعره أسود قصير
    gloss: ماتيو شعره أسود قصير.
    note: نعيد استعمال *negro* (أسود) من وحدة الملابس.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: إيلينا شعرها أشقر طويل
    gloss: إيلينا شعرها أشقر طويل.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: العيون
    gloss: العيون
    note: '*Los ojos* هي جمع *el ojo*؛ وكلتاهما مذكر.'
    example_gloss: عينا ماتيو بنيتان.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: لـ*Azul* (أزرق) و*verde* (أخضر) صيغة واحدة للمذكر والمؤنث؛ و*marrón* (بني) هي الكلمة المعتادة للون العينين، أما الشعر فنقول *castaño*.
    example_gloss:
    - عينا إيلينا زرقاوان.
    - عينا دييغو بنيتان.
    - عينا لوسيا خضراوان.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: صفة ojos تكون بالجمع
    gloss: 'مع ojos (الجمع) تكون الصفة بالجمع أيضًا: ojos azules, ojos marrones, ojos verdes.'
    note: 'تتفق الصفات في العدد: *ojos* جمع، لذلك نقول *azules* و*marrones* و*verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: كيف تبدو إيلينا؟
    gloss: كيف تبدو إيلينا؟
    note: '*¿Cómo es ...?* هو السؤال الأساسي في هذه الوحدة؛ استعمله للسؤال عن مظهر أي شخص.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: إيلينا شعرها أشقر طويل وعيناها زرقاوان
    gloss: إيلينا شعرها أشقر طويل وعيناها زرقاوان.
    note: إجابة نموذجية تجمع الشعر والعينين في جملة واحدة بالحرف *y*.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: إيلينا تقدّم نينا
    gloss: 'إيلينا: ستأتي فتاة جديدة إلى مقهى اللغات. اسمها نينا.'
    note: تقدّم *Viene* ("تأتي") شخصًا جديدًا؛ و*se llama* تعني "اسمها".
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: ماتيو يسأل عن مظهرها
    gloss: 'ماتيو: رائع! كيف تبدو؟'
    note: 'نعيد استعمال سؤال الوحدة الأساسي دون ذكر اسم: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: إيلينا تصف طول نينا وشعرها
    gloss: 'إيلينا: هي قصيرة وشعرها أشقر قصير.'
    note: تجمع بين *baja* من الدرس الأول ومفردات الشعر؛ و*baja* مؤنثة لأن نينا فتاة.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: ماتيو يسأل عن عينيها
    gloss: 'ماتيو: وعيناها؟'
    note: تستعمل *¿Y los ojos?* أداة التعريف للعودة إلى الموضوع، فلا تحتاج الإسبانية هنا إلى صفة ملكية مثل *sus*، بينما تضيف العربية ضمير الملكية ("عيناها").
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: إيلينا تصف عيني نينا
    gloss: 'إيلينا: عيناها خضراوان.'
    note: نعيد استعمال *los ojos verdes* من درس العيون.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: ماتيو سيتعرف عليها
    gloss: 'ماتيو: شكرًا! إذن سأتعرف عليها.'
    note: '*La reconoceré* ("سأتعرف عليها") صيغة المستقبل؛ و*la* تعني "ها" وتأتي قبل الفعل.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: مقارنة بين دييغو ولوسيا
    gloss: دييغو ولوسيا أخ وأخت، لكنهما مختلفان في المظهر. دييغو قصير وشعره بني قصير وعيناه بنيتان. لوسيا أطول من دييغو وشعرها بني طويل وعيناها خضراوان. وأنت، كيف تبدو؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      hermano: أخ
      hermana: أخت
      eres: مظهر
      diferentes: مختلف
      bajo: قصير
      corto: قصير
      castaño: بني
      pelo: الشعر
      marrones: بني
      ojos: العيون
      alta: أطول
      largo: طويل
      verdes: أخضر
      cómo: (جزء من سؤال «كيف يبدو...؟»)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: إعادة استخدام نمط المقارنة
    gloss: 'أنت تعرف نمط المقارنة: más + صفة + que. نستخدمه هنا مع الأشخاص: Lucía أطول من Diego.'
    note: نمط *más + adjective + que* الذي مرّ بك في وحدة المقارنات، يُطبَّق الآن على الأشخاص بدلًا من الأشياء.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: شعر Lucía أطول من شعر Diego
    gloss: شعر Lucía أطول من شعر Diego.
    note: 'تقارن *Más largo que* بين شيئين: *el pelo más largo que Diego*؛ وتبقى *largo* مذكرة لأن *pelo* مذكر.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: جملة نموذجية بضمير المتكلم مع *tengo*، جاهزة لتستخدمها عند وصف نفسك.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo يلمح Nina
    gloss: 'Mateo: انظري، هل هذه Nina؟ لديها شعر قصير أشقر وعينان خضراوان.'
    note: '*Mira* («انظر») هي صيغة الأمر غير الرسمية من الفعل *mirar*، وتُستخدم هنا للإشارة إلى شيء ما.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena تؤكد
    gloss: 'Elena: نعم، هذه هي Nina!'
    note: تأكيد قصير وطبيعي.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina تحيّي Mateo
    gloss: 'Nina: مرحبًا، هل أنت Mateo؟'
    note: 'سؤال تحية بسيط وغير رسمي: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo يردّ التحية على Nina
    gloss: 'Mateo: نعم! تشرفت بمعرفتك يا Nina.'
    note: '*Encantado de conocerte* عبارة معتادة عند اللقاء الأول؛ وتقول المرأة *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: تُختتم بها المحادثة؛ فقد تعرّف Mateo على Nina من وصف Elena السابق.
