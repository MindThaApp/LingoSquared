course:
  title: الإسبانية A1
  description: السؤال عن الأسعار والكميات في السوق، مع متابعة قصة إيلينا وماتيو وهما يتسوقان للحصة القادمة من الورشة. تُبرز الوحدة كلمات الكمية docena وkilo وmedio kilo وقواعدها الخاصة.
