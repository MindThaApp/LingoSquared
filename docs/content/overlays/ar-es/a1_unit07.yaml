teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: السوق
    gloss: السوق
    note: كلمة *mercado* مذكّرة.
    example_gloss: لنذهب إلى السوق.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: فاكهة، خضار
    gloss: فاكهة، خضار
    note: تعني *Verdura* الخضار عمومًا (وغالبًا الخضراء منها)؛ وهي اسم مؤنث مفرد يُستعمل أيضًا للدلالة على الجمع، كما تُستعمل كلمة «خضار» في العربية.
    example_gloss:
    - أريد شراء فاكهة.
    - الخضار طازجة.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: بيض، خبز
    gloss: بيض، خبز
    note: '*Huevos* جمع بالفعل (والمفرد *huevo*)؛ أما *pan* (خبز) فاسم لا يُعَدّ، ولا جمع طبيعيًا له في الاستعمال اليومي.'
    example_gloss:
    - أحتاج إلى بيض.
    - الخبز من هذا الصباح.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: اسأل عن السعر
    gloss: كم يكلّف؟
    note: '*Cuesta* هي صيغة الغائب المفرد من الفعل *costar* (كلّف)، وهو فعل جديد في هذه الوحدة.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: اسأل عن السعر بصيغة أخرى
    gloss: كم سعره؟
    note: انظر بطاقة القواعد التالية التي تقارنها بـ *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: اذكر السعر
    gloss: يكلّف اثنين.
    note: جواب قصير وكامل عن السعر؛ فالعملة تُفهم من السياق، وكثيرًا ما يكتفي الناس بذكر الرقم عند التسوق.
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta مقابل Cuánto es
    gloss: طريقتان طبيعيتان بالقدر نفسه للسؤال عن السعر.
    note: انظر نص البطاقة نفسها.
    target_text: '*¿Cuánto cuesta?* (كم يكلّف؟) و*¿Cuánto es?* (كم الحساب؟) كلتاهما طريقة طبيعية للسؤال عن السعر، ويمكن استعمال إحداهما مكان الأخرى في التسوق اليومي.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: اطلب دزينة بيض
    gloss: دزينة بيض، من فضلك.
    note: '*Docena* (دزينة) اسم في الإسبانية يليه دائمًا *de* ثم الشيء المعدود، مثل «دزينة من البيض» في العربية.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: اطلب كيلو طماطم
    gloss: كيلو طماطم، من فضلك.
    note: 'تتبع *Kilo* النمط نفسه الذي تتبعه *docena*: *de* ثم الشيء.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: نصف كيلو
    gloss: نصف كيلو
    note: تأتي *Medio* (نصف) قبل الاسم وتطابقه في الجنس (*medio kilo* مذكر، و*media docena* مؤنث).
    example_gloss: نصف كيلو من الخبز، من فضلك.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: قليل من
    gloss: قليل من
    note: تُستعمل *Un poco de* للدلالة على كمية صغيرة غير محددة، حين لا نحتاج إلى مقدار دقيق.
    example_gloss: أريد قليلًا من الفاكهة.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: اسأل إن كان يلزم شيء آخر
    gloss: هل تحتاج إلى شيء آخر؟
    note: '*Necesita* هي صيغة *usted* من الفعل *necesitar*، وهي الصيغة المهذبة التي يستعملها البائع عادةً مع الزبون.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: قل إنّ لديك كل شيء
    gloss: لا، أظن أنه لدينا كل شيء.
    note: '*Creo que* (أظن أنّ) طريقة شائعة لتلطيف الكلام، وهنا تؤكد أن قائمة التسوق اكتملت.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: اشكر البائع
    gloss: ممتاز، شكرًا.
    note: عبارة ختامية قصيرة وطبيعية عند إتمام الشراء.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: قراءة ملصقات الأسعار
    gloss: 'بسطة روزا: طماطم، اثنان للكيلو. بيض، أربعة للدزينة. خبز، ستة. فاكهة طازجة كل يوم.'
    note: 'ملصق أسعار نموذجي في بسطة سوق: الصنف ثم السعر ثم الوحدة التي ينطبق عليها السعر (*el kilo* و*la docena*). *Puesto* هي بسطة في السوق، وروزا هي صاحبة هذه البسطة.'
    glosses:
      Puesto: بسطة
      tomates: طماطم
      kilo: كيلو
      Huevos: بيض
      docena: دزينة
      Pan: خبز
      Fruta: فاكهة
      fresca: طازج
      todos: كل
      días: أيام
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo بمعنى «للكيلو»
    gloss: كيف تعني كلمة الوحدة بعد السعر «لكل» وحدة.
    note: انظر نص البطاقة نفسها.
    target_text: تعني *El kilo* بعد السعر ("tomates, dos el kilo") «للكيلو الواحد»، أي أن السعر ينطبق على كل كيلو تشتريه.
  es.a1.unit07.lesson06.teach.line01:
    title: اقتراح الذهاب إلى السوق
    gloss: تقترح إيلينا الذهاب إلى السوق لشراء مكونات للحصة القادمة.
    note: تعني *Para la próxima clase* «للحصة القادمة»، أي الجلسة التالية من ورشة الطبخ.
  es.a1.unit07.lesson06.teach.line02:
    title: الموافقة والسؤال عمّا يلزم
    gloss: يوافق ماتيو ويسأل عمّا يحتاجانه.
    note: تستخدم *¿Qué necesitamos?* صيغة *nosotros* من الفعل *necesitar*، وتعني «ماذا نحتاج؟» بصيغة المتكلمين الجمع.
  es.a1.unit07.lesson06.teach.line03:
    title: لفت النظر إلى الطماطم الطازجة
    gloss: تقول إيلينا إنهما سيبدآن بالخضار، وتشير إلى مدى نضارة الطماطم.
    note: '*¡Qué tomates tan frescos!* (ما أطزج هذه الطماطم!) جملة تعجب بـ *qué*، مثل *¡Qué bonito!* من الوحدة 3، لكنها هنا مبنية مع اسم: *qué* + اسم + *tan* + صفة.'
  es.a1.unit07.lesson06.teach.line04:
    title: البائع يسأل عن الكمية
    gloss: يسأل البائع إيلينا عن الكمية التي تريدها.
    note: '*Señorita* طريقة مهذبة لمخاطبة الشابة، وتناسب مخاطبة البائع للزبونة بصيغة *usted* (ويراها بعض المتكلمين اليوم قديمة قليلًا).'
  es.a1.unit07.lesson06.teach.line05:
    title: طلب كيلو والسؤال عن السعر
    gloss: تطلب إيلينا كيلو وتسأل عن السعر.
    note: يجمع بين *un kilo* و*¿Cuánto cuesta?* من هذه الوحدة في حوار واحد طبيعي.
  es.a1.unit07.lesson06.teach.line06:
    title: ذكر السعر
    gloss: يقول البائع إن سعره اثنان.
    note: '*Cuesta dos* -- جواب قصير عن السعر، والعملة مفهومة من السياق.'
  es.a1.unit07.lesson06.teach.line07:
    title: ماتيو يطلب البيض والخبز
    gloss: يقول ماتيو إنه يحتاج إلى دزينة بيض وخبز.
    note: يجمع بين *huevos* و*pan* و*una docena de* من هذه الوحدة؛ وذكر *yo* اختياري ويضيف قليلًا من التوكيد («أنا أحتاج...»).
  es.a1.unit07.lesson06.teach.line08:
    title: البائع يذكر السعرين
    gloss: يقول البائع إن البيض سعره أربعة، والخبز ستة.
    note: '*Cuestan* (للجمع، أي «تكلّف») تتفق مع الفاعل الجمع *los huevos*، بخلاف المفرد *cuesta* المستعمل مع الطماطم.'
  es.a1.unit07.lesson06.teach.line09:
    title: شكر البائع
    gloss: 'يقول ماتيو: ممتاز، شكرًا.'
    note: هي نفسها عبارة الختام القصيرة التي مرّت في هذه الوحدة.
  es.a1.unit07.lesson06.teach.line10:
    title: سؤال صديق إن كان يحتاج إلى شيء آخر
    gloss: تسأل إيلينا ماتيو إن كان يحتاج إلى شيء آخر.
    note: '*¿Necesitas...?* صيغة *tú* وتُستعمل مع الصديق، أما *¿Necesita...?* عند البائع فهي صيغة *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: القول إن لديكما كل شيء
    gloss: 'يقول ماتيو: لا، أظن أن لديهما كل شيء بالفعل.'
    note: '*Creo que* («أظن أن») تخفف حدة الجواب؛ و*ya* تعني «بالفعل».'
