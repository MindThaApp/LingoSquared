teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: أكثر...من
    gloss: أكثر...من
    note: تقارن *Más...que* بين شيئين أو كميتين مختلفتين، انظر بطاقة القواعد أدناه.
    example_gloss: الشقة الجديدة أكبر من القديمة.
  es.a1.unit15.lesson01.teach.menos_que:
    title: أقل...من
    gloss: أقل...من
    note: '*Menos...que* عكس *más...que*.'
    example_gloss: الشقة القديمة أقل حجمًا من الجديدة.
  es.a1.unit15.lesson01.teach.tan_como:
    title: مثل...تمامًا
    gloss: مثل...تمامًا
    note: تقارن *Tan...como* بين شيئين متساويين، وهي بنية مختلفة فعلًا عن *más/menos* وليست طريقة أخرى لقول الشيء نفسه.
    example_gloss: ماتيو يطبخ جيدًا مثل إيلينا.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: عدم التساوي مقابل التساوي
    gloss: الفرق بين más/menos...que وtan...como.
    note: انظر إلى نص البطاقة نفسها.
    target_text: تقارن *Más...que* (أكثر...من) و*menos...que* (أقل...من) بين شيئين أو كميتين مختلفتين. أما *tan...como* (مثل...تمامًا) فتقارن بين شيئين متساويين، وهي بنية مختلفة وليست مجرد مرادف لـ *más/menos*.
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: قارن الشقة الجديدة
    gloss: الشقة الجديدة أكبر من القديمة.
    note: تضع *Más grande que* (أكبر من) كلمة *grande* (كبير) داخل بنية *más...que*.
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: قارن الشقة القديمة
    gloss: الشقة القديمة أصغر من الجديدة.
    note: تستخدم *Más pequeño que* (أصغر من) كلمة *pequeño* (صغير)، فتعبّر عن المقارنة من الاتجاه المعاكس.
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: اسأل أيهما أكبر
    gloss: أي شقة هي الأكبر؟
    note: '*¿Cuál...?* (أيّ...؟) مع صفة التفضيل هي الطريقة المعتادة للسؤال عن مقارنة.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: أجب عن أيهما أكبر
    gloss: الجديدة أكبر من القديمة.
    note: المقارنة نفسها، لكن كإجابة مباشرة عن سؤال *¿cuál...?*؛ وتحذف *el nuevo* (الجديد) الاسم المكرر.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: قارن مهارة الطبخ بالتساوي
    gloss: ماتيو يطبخ جيدًا مثل إيلينا.
    note: تعني *Tan bien como* «بالجودة نفسها التي»، وتتكوّن من *tan* + ظرف + *como*، أي نمط المساواة نفسه لكنه يصف طريقة فعل الفعل لا حجم الاسم.
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: قل إنكما فريق جيد
    gloss: نحن فريق جيد.
    note: '*Somos* (نحن) + *un buen equipo* (فريق جيد) جملة ختامية طبيعية بعد مقارنة المساواة.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: مقارنة بين الشقتين
    gloss: في شقة Mateo القديمة مطبخ صغير. الشقة الجديدة أكبر، والمطبخ فيها أكبر أيضًا. الشقة القديمة أصغر من الجديدة، ولهذا يريد Mateo الانتقال. في الجديدة مساحة أكبر للطهي.
    note: ملخص واقعي يقارن بين الشقتين.
    glosses:
      viejo: قديم
      tiene: لديه (من tener)
      pequeña: صغير
      nuevo: جديد
      grande: كبير
      también: أيضًا
      pequeño: صغير
      eso: أنّ / الذي
      quiere: يريد (من querer)
      mudarse: ينتقل إلى مسكن آخر
      espacio: مساحة
      cocinar: يطهو
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (لهذا السبب)
    gloss: كيف تربط por eso السبب بالنتيجة.
    note: انظر إلى نص البطاقة نفسها.
    target_text: 'تربط *Por eso* (لهذا السبب) السبب بنتيجته: المطبخ الصغير هو سبب رغبة ماتيو في الانتقال، وهو منطق السبب والنتيجة نفسه الذي رأيته مع *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: اسأله هل رآها
    gloss: تسأل Elena هل رأى Mateo الشقة الجديدة بالفعل.
    note: '*¿Ya viste...?* (هل رأيتَ ... بالفعل؟) صيغة سؤال جديدة في الماضي.'
  es.a1.unit15.lesson06.teach.line02:
    title: أكّد أنها أكبر
    gloss: يؤكد Mateo أنها أكبر من القديمة، والمطبخ أيضًا.
    note: مقارنة بنمط *más...que*، موسَّعة بعبارة *la cocina también* (المطبخ أيضًا).
  es.a1.unit15.lesson06.teach.line03:
    title: اسأل أي الشقتين أصغر
    gloss: 'تسأل Elena: إذن، أي الشقتين أصغر؟'
    note: '*Entonces* (إذن) أداة ربط منطقية سبق أن رأيتها؛ والسؤال بنمط *¿Cuál...?* لكن مع *pequeño* بدل *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: أجب واشرح
    gloss: يقول Mateo إن القديمة أصغر، ولهذا يريد الانتقال.
    note: '*El viejo es más pequeño que el nuevo* ثم *por eso quiero mudarme* (لهذا أريد الانتقال).'
  es.a1.unit15.lesson06.teach.line05:
    title: وافق على أن الأمر منطقي
    gloss: تقول Elena إن الأمر منطقي، فالجديدة فيها مساحة أكبر للطهي.
    note: '*Tiene mucho sentido* (هذا منطقي جدًا) عبارة موافقة جديدة؛ و*más espacio para cocinar* تعني مساحة أكبر للطهي.'
  es.a1.unit15.lesson06.teach.line06:
    title: أكمل الفكرة
    gloss: يوافق Mateo ويضيف أن Elena تطهو بجودته نفسها، لذلك يحتاجان إلى مساحة لاثنين.
    note: '*Tan bien como* (بالجودة نفسها) مستعملة هنا في الحديث مع *tú cocinas* (أنتِ تطهين).'
  es.a1.unit15.lesson06.teach.line07:
    title: ردّ المجاملة
    gloss: توافق Elena بحماس وتقول إنه يطهو بجودتها نفسها.
    note: '*¡Es verdad!* (هذا صحيح!) + *tú cocinas tan bien como yo* (أنت تطهو بجودتي نفسها) -- مقارنة *tan bien como* نفسها، لكن موجّهة إلى Mateo.'
  es.a1.unit15.lesson06.teach.line08:
    title: اختم بروح الفريق
    gloss: يختم Mateo بأنهما فريق جيد.
    note: '*Somos un buen equipo* (نحن فريق جيد) تختم الحوار.'
