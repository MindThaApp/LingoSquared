teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: الشعور بالتوعك
    gloss: لا أشعر أنني بخير.
    note: الفعل *sentirse* انعكاسي (*me siento*، *te sientes*)؛ و*no me siento bien* طريقة عامة وخفيفة للقول إن هناك شيئًا غير طبيعي.
  es.a1.unit46.lesson01.teach.enfermo:
    title: مريض
    gloss: مريض
    note: 'صفة أساسية تُستعمل مع *estar* (للحالات): *estoy enfermo*.'
    example_gloss: أنا مريض.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: أن تكون مريضًا
    gloss: أنا مريض.
    note: تدل *Enfermo* على حالة أعم وأقوى من *no me siento bien*؛ وتتغير بحسب جنس المتكلم (*enferma*).
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: صداع
    gloss: صداع
    note: 'تستعمل الإسبانية *dolor de cabeza* مع *tener* ودون أداة تعريف أو تنكير: *tengo dolor de cabeza*.'
    example_gloss: أعاني من صداع.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: الإصابة بصداع
    gloss: أعاني من صداع.
    note: 'تأتي الأعراض مع *tener* (يملك): *tengo dolor de cabeza*، أي «أعاني من صداع».'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: وجع المعدة
    gloss: وجع في المعدة
    note: 'النمط نفسه دون أداة مثل *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: أعاني من وجع في المعدة.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: الإصابة بوجع في المعدة
    gloss: أعاني من وجع في المعدة.
    note: يتبع نمط *tener* نفسه مثل *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: سؤال عام
    gloss: ما الأمر؟
    note: طريقة عامة تصلح لسؤال الشخص إن كان هناك مشكلة.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: تعبير شائع
    gloss: ما بك؟
    note: '*¿Qué te pasa?* هي الطريقة الطبيعية للسؤال عمّا يعانيه الشخص (حرفيًا «ماذا يحدث لك؟»)؛ فلا تترجمها كلمة بكلمة.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: التهاب الحلق
    gloss: التهاب في الحلق
    note: 'النمط نفسه مثل *dolor de cabeza* و*dolor de estómago*: *dolor de garganta*.'
    example_gloss: أعاني من التهاب في الحلق.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: الإصابة بالتهاب الحلق
    gloss: أعاني من التهاب في الحلق.
    note: يتبع نمط *tener* نفسه مثل الأعراض الأخرى.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: الاطمئنان على شخص
    gloss: هل أنت بخير؟ لا، لا أشعر أنني بخير.
    note: '*¿Estás bien?* سؤال شائع وغير رسمي بين الأصدقاء؛ ومع من تخاطبه بـ *usted* تصبح *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: الحمّى
    gloss: حمّى
    note: 'تُستعمل دون أداة بعد *tener* مثل الأعراض الأخرى: *tengo fiebre*.'
    example_gloss: عندي حمّى.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: الإصابة بالحمّى
    gloss: عندي حمّى.
    note: يتبع نمط *tener*.
  es.a1.unit46.lesson03.teach.resfriado:
    title: الإصابة بنزلة برد
    gloss: مصاب بنزلة برد
    note: '*Resfriado* صفة تُستخدم مع *estar*؛ ويمكنك أيضًا أن تقول *tengo un resfriado* باستخدام الاسم *resfriado*.'
    example_gloss: أنا مصاب بنزلة برد.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: قول إنك مصاب بنزلة برد
    gloss: أنا مصاب بنزلة برد.
    note: تقول الإسبانية *estoy resfriado* بالصفة، أي «أنا مصاب بنزلة برد»؛ وتتغير الصفة بحسب جنس المتكلم (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: الاختيار بين estar وtener يعتمد على نوع الكلمة
    gloss: 'Enfermo وresfriado صفتان وتُستعملان مع estar: أنا مريض، أنا مصاب بنزلة برد. Fiebre وdolor de cabeza اسمان وتُستعملان مع tener: عندي حمّى، أعاني من صداع.'
    note: 'الاختيار بين *estar* و*tener* يتبع نوع الكلمة: الصفات (*enfermo*، *resfriado*) مع *estar*، وأسماء الأعراض (*fiebre*، *dolor de cabeza*) مع *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: الصيدلية
    gloss: الصيدلية
    note: 'اسم مؤنث: *la farmacia*.'
    example_gloss: أنا ذاهب إلى الصيدلية.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: تحية الصيدلاني
    gloss: كيف أستطيع مساعدتك؟
    note: '*¿En qué puedo ayudarle?* سؤال خدمة رسمي معتاد؛ وفي *ayudarle* الضمير *le* هو ضمير المفعول للمخاطب المحترم *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: طلب شيء لعَرَض معين
    gloss: هل لديك شيء لعلاج الصداع؟
    note: '*Algo para* + العَرَض هي الطريقة الطبيعية لطلب علاج: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: قرص
    gloss: قرص دواء
    note: 'اسم مؤنث: *la pastilla*؛ و*una pastilla* تعني قرص دواء.'
    example_gloss: أتناول قرصًا.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: تعليمات الجرعة
    gloss: تناول قرصًا مرتين في اليوم.
    note: '*Toma* هي صيغة الأمر غير الرسمية من *tomar* (يتناول)، وتُستعمل في التعليمات.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: أسلوب الكلام في الصيدلية
    gloss: في الصيدلية نستخدم صيغة الاحترام usted.
    note: 'الصيدلاني شخص بالغ لا تعرفه ويؤدي خدمة، لذا تستخدم *usted*: *¿Tiene algo...?* بدلًا من *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: اقرأ نصيحة في صيدلية
    gloss: 'نصيحة: تناول حبة مرتين في اليوم مع الماء. ارتح جيدًا واشرب كثيرًا من الماء. هل ما زلت لا تشعر بتحسن بعد ثلاثة أيام؟ إذن اذهب إلى الطبيب.'
    note: انتبه إلى الجرعة، والنصيحتين الأخريين غير الدواء، ومتى تذهب إلى الطبيب.
    glosses:
      Consejo: نصيحة
      toma: تناول
      veces: مرات
      día: يوم
      pastilla: حبة دواء
      Descansa: ارتح
      bebe: اشرب
      sentirte: تشعر
      sigues: ما زال
      bien: جيدًا
      médico: طبيب
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: إيلينا تطمئن على ماتيو
    gloss: 'إيلينا: مرحبًا ماتيو، كيف حالك؟ هل تشعر بتحسن الآن؟'
    note: تدل *Ya* (بالفعل، الآن) على أن إيلينا تسأل هل تحسّن ماتيو منذ آخر مرة تحدثا فيها؛ و*te sientes* صيغة المخاطب غير الرسمية *tú* من الفعل *sentirse*.
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: ماتيو ما زال متعبًا
    gloss: 'ماتيو: لست بخير بعد. ما زال عندي صداع وأنا متعب.'
    note: تدل *Sigo con* (ما زال عندي) على أن الصداع لم يزُل؛ و*cansado* (متعب) صفة جديدة ومفيدة تتغير بحسب الجنس (*cansada*).
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: إيلينا تسأل عن الدواء
    gloss: 'إيلينا: هل تناولت حبة دواء؟'
    note: '*Has tomado* هو الماضي القريب: *has* + اسم المفعول *tomado*، على النمط نفسه في *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: ماتيو يؤكد
    gloss: 'ماتيو: نعم، تناولت حبة دواء. سأرتاح الآن.'
    note: تستخدم *Voy a descansar* (سأرتاح) نمط المستقبل القريب *ir a* + المصدر.
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: إيلينا تتمنى له الشفاء
    gloss: 'إيلينا: فكرة جيدة. ارتح جيدًا. شفاك الله!'
    note: '*¡Que te mejores!* عبارة ثابتة معتادة للدعاء لشخص بالشفاء العاجل؛ وتستخدم صيغة المضارع الإلزامي *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: ماتيو يودّع
    gloss: 'ماتيو: شكرًا، إلى اللقاء غدًا!'
    note: تتبع *Hasta mañana* نمط *hasta* + الزمن في عبارات الوداع مثل *hasta luego*.
