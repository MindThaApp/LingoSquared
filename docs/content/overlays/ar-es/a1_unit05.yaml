teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: السؤال عن الوقت
    gloss: كم الساعة؟
    note: يسأل *Qué hora* (أي ساعة) عن وقت الساعة، ويختلف عن *qué fecha* (أي تاريخ).
  es.a1.unit05.lesson01.teach.es_la_una:
    title: الساعة الواحدة
    gloss: الساعة الواحدة.
    note: انظر ملاحظة القواعد التالية لمعرفة سبب استعمال *es* (لا *son*) مع الساعة الواحدة وحدها.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es أم son مع الوقت
    gloss: لماذا تختلف الساعة الواحدة عن بقية الساعات.
    note: نقول *Es la una* بالمفرد، لكن *son las dos, son las tres...* بالجمع.
    target_text: تستعمل الساعة الواحدة الفعل المفرد *es* (Es la una)، أما بقية الساعات فتستعمل الفعل الجمع *son* (Son las dos, Son las tres...) لأن *la una* مفرد («الساعة الواحدة») بينما *las dos* و*las tres* وغيرها جمع.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: الساعة الثانية والرابعة والخامسة والسابعة
    gloss: الساعة الثانية، الساعة الرابعة، الساعة الخامسة، الساعة السابعة.
    note: تُستعمل *Son las...* بصيغة الجمع لكل الساعات ما عدا الواحدة، وفق ملاحظة القواعد السابقة.
    example_gloss:
    - الساعة الثانية.
    - الساعة الرابعة.
    - الساعة الخامسة.
    - الساعة السابعة.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: والربع
    gloss: الساعة الرابعة والربع.
    note: تضيف *Y cuarto* (والربع) خمس عشرة دقيقة إلى الساعة المذكورة.
  es.a1.unit05.lesson02.teach.y_media:
    title: والنصف
    gloss: الساعة السابعة والنصف.
    note: تضيف *Y media* (والنصف) ثلاثين دقيقة إلى الساعة المذكورة.
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: إلا ربعًا
    gloss: الساعة الخامسة إلا ربعًا (4:45).
    note: انظر ملاحظة القواعد التالية لمعرفة كيف تعدّ *menos* الدقائق تنازليًا نحو الساعة التالية.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (قبل الساعة)
    gloss: كيف تعدّ الإسبانية الدقائق السابقة للساعة التالية، وهو شبيه بقولنا «إلا ربعًا» في العربية.
    note: '*Las cinco menos cuarto* = الخامسة إلا ربعًا (4:45).'
    target_text: 'تعني *Menos* («إلا») أن العدّ يكون نحو الساعة التالية: *las cinco menos cuarto* هي 4:45، وتُقرأ «الخامسة إلا ربعًا»، وهو المنطق نفسه في العربية.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: الصباح والظهيرة والليل
    gloss: صباحًا، بعد الظهر، مساءً/ليلًا
    note: تُوضّح *De la mañana/tarde/noche* هل الوقت صباحًا أم مساءً، كما نضيف «صباحًا» أو «مساءً» بعد الساعة في العربية.
    example_gloss:
    - الساعة الثامنة صباحًا.
    - تبدأ الورشة في الساعة الرابعة بعد الظهر.
    - الساعة العاشرة ليلًا.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: الورشة تبدأ في الرابعة
    gloss: تبدأ الورشة في الساعة الرابعة بعد الظهر.
    note: '*Empieza* (تبدأ) هي صيغة الغائب للفعل *empezar*، وهو فعل جديد في هذه الوحدة.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: السؤال عن وقت البدء
    gloss: في أي ساعة تبدأ الورشة؟
    note: '*A qué hora* (في أي ساعة) هي الطريقة المعتادة للسؤال عن موعد حدث معيّن، وتختلف عن السؤال العام *qué hora es* (كم الساعة الآن).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: السؤال عن موعد اللقاء
    gloss: في أي ساعة نلتقي؟
    note: '*Nos vemos* (نلتقي) تعبير يُستعمل للاتفاق على موعد لقاء شخص ما.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: اقتراح موعد للقاء
    gloss: هل نلتقي في الثالثة والنصف؟
    note: يجمع بين *y media* و*nos vemos* لاقتراح موعد محدد.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: قبل الورشة
    gloss: هذا قبل الورشة.
    note: '*Antes de* (قبل) عكس *después* (بعد).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: اتفقنا / حسنًا
    gloss: اتفقنا / حسنًا
    note: '*De acuerdo* طريقة طبيعية ومختصرة لتأكيد خطة ما، وتشبه في وظيفتها *Muy bien*.'
    example_gloss: اتفقنا، نلتقي في الثالثة والنصف.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: قراءة جدول اليوم
    gloss: تبدأ الورشة في الساعة الرابعة بعد الظهر. وقبل ذلك يلتقي إيلينا وماتيو في الثالثة والنصف. تنتهي الورشة في السادسة. وفي اليوم التالي يلتقيان في الواحدة لتناول الغداء.
    note: 'جدول قصير لليوم: لقاء، ثم ورشة، ثم غداء في اليوم التالي.'
    glosses:
      taller: ورشة
      empieza: تبدأ (من empezar)
      cuatro: أربعة
      tarde: بعد الظهر
      Antes: قبل
      ven: يلتقيان (من verse)
      tres: ثلاثة
      media: نصف
      termina: تنتهي (من terminar)
      seis: ستة
      día: يوم
      siguiente: التالي
      almorzar: تناول الغداء
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: في اليوم التالي
    gloss: في اليوم التالي
    note: '*Al día siguiente* (في اليوم التالي) طريقة شائعة للانتقال بالقصة إلى يوم جديد، وتختلف عن *la próxima clase* (الحصة القادمة، أي حدث محدد لا يوم في التقويم).'
  es.a1.unit05.lesson06.teach.line01:
    title: السؤال عن الأكل بعد الورشة
    gloss: يقول ماتيو إن الورشة تنتهي في السادسة ويسأل إيلينا إن كانت جائعة بعدها.
    note: '*Tienes hambre* (هل أنت جائع) تعبير جديد، وحرفيًا «عندك جوع»، وهو التركيب نفسه مع tener في *tener ... años* و*tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: الموافقة واقتراح اليوم التالي
    gloss: تقول إيلينا نعم، قليلًا، وتقترح أن يأكلا في اليوم التالي بدلًا من ذلك.
    note: '*¿Comemos mañana?* تقترح الغد بدل ما بعد الورشة مباشرة، تمهيدًا للحوار التالي عن موعد محدد.'
  es.a1.unit05.lesson06.teach.line03:
    title: الموافقة والسؤال عن الساعة
    gloss: يوافق ماتيو على أن الفكرة جيدة ويسأل عن الساعة.
    note: '*Buena idea* (فكرة جيدة) طريقة طبيعية ومختصرة للموافقة على اقتراح.'
  es.a1.unit05.lesson06.teach.line04:
    title: اقتراح الساعة الواحدة
    gloss: تقترح إيلينا أن يلتقيا في الساعة الواحدة.
    note: تستعمل *A la una* (في الواحدة) المفرد *la una* كما في *Es la una*.
  es.a1.unit05.lesson06.teach.line05:
    title: التأكيد وذكر مطعم
    gloss: يؤكد ماتيو أن الساعة الواحدة مناسبة ويذكر مطعمًا قريبًا.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (قرب)، كما في *cerca de tus padres*، وهنا تُستعمل مع مكان.'
  es.a1.unit05.lesson06.teach.line06:
    title: ختام ودّي
    gloss: تعبّر إيلينا عن سعادتها وتقول إلى اللقاء غدًا.
    note: '*¡Genial!* (رائع!) تختم الحوار بنبرة متحمسة، وتشبه في وظيفتها *¡Qué bien!*.'
