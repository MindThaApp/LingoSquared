course:
  title: الإسبانية A1
  description: قول الوقت والسؤال عنه، وأجزاء اليوم، وتحديد موعد لقاء، مع متابعة قصة ورشة الطبخ لإيلينا وماتيو من الوحدات 01-04. يبرز الشرح الفرق بين es وson (المفرد والجمع) في قول الساعة، وكلمات الكسور cuarto وmedia وmenos.
