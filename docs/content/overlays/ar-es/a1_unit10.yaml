teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: الطقس
    gloss: الطقس
    note: تعني *Tiempo* أيضًا «الوقت»؛ ويحدد السياق أي المعنيين المقصود.
    example_gloss: كيف حال الطقس اليوم؟
  es.a1.unit10.lesson01.teach.el_sol:
    title: الشمس
    gloss: الشمس
    note: كلمة *Sol* مذكرة.
    example_gloss: الشمس ساطعة جدًا اليوم.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: المطر
    gloss: المطر
    note: كلمة *Lluvia* مؤنثة.
    example_gloss: لا أحب المطر.
  es.a1.unit10.lesson01.teach.el_viento:
    title: الرياح
    gloss: الريح
    note: كلمة *Viento* مذكرة.
    example_gloss: الرياح قوية جدًا اليوم.
  es.a1.unit10.lesson01.teach.la_nube:
    title: السحابة
    gloss: السحابة
    note: كلمة *Nube* مؤنثة.
    example_gloss: لا توجد سحابة واحدة.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: الجو حار
    gloss: الجو حار.
    note: '*Hace calor* (حرفيًا «يصنع حرارة») هو التعبير المعتاد لوصف الطقس الحار.'
    example_gloss: الجو حار جدًا في يوليو.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: الجو بارد
    gloss: الجو بارد.
    note: يتبع *Hace frío* نمط *hace* + اسم نفسه الذي في *hace calor*.
    example_gloss: في ديسمبر يكون الجو باردًا.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: الجو مشمس
    gloss: الطقس مشمس.
    note: تستخدم *Hace sol* كلمة *el sol* (الشمس) ضمن النمط التعبيري نفسه.
  es.a1.unit10.lesson02.teach.llueve:
    title: المطر يهطل
    gloss: تمطر.
    note: '*Llueve* صيغة فعلية مستقلة (من الفعل *llover* أي يمطر) وليست من نمط *hace* — انظر الملاحظة النحوية التالية.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: الجو غائم
    gloss: الجو غائم.
    note: تستخدم *Está nublado* الفعل *estar* + صفة، وهذا نمط ثالث مختلف للتعبير عن الطقس.
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace وllueve وestá: ثلاثة أنماط'
    gloss: ثلاثة أنماط نحوية مختلفة لوصف الطقس.
    note: انظر نص البطاقة نفسها.
    target_text: 'تستخدم تعابير الطقس مع *hace* (hace calor وhace frío وhace sol) صيغة ثابتة، حرفيًا «يصنع حرارة/برودة/شمسًا». أما *Llueve* (تمطر) فهي صيغة فعل قائمة بذاتها، و*está nublado* (الجو غائم) تستخدم *estar* + صفة؛ فهذه ثلاثة أنماط مختلفة للفكرة نفسها: وصف الطقس.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: اسأل عن الطقس
    gloss: كيف الطقس اليوم؟
    note: '*¿Qué tiempo hace hoy?* هي الطريقة المعتادة للسؤال عن الطقس الحالي، وتستخدم *el tiempo* (الطقس).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: صف طقسًا حارًا ومشمسًا
    gloss: الجو حار جدًا ومشمس.
    note: تجمع بين تعبيرين بـ *hace* بواسطة *y* (و).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: صف طقسًا حارًا وعاصفًا
    gloss: الجو حار، لكن هناك رياح.
    note: تربط *Pero* (لكن) بين حقيقتين عن الطقس — الحر والرياح — باستخدام *hay* + اسم كما في *hay mucho viento*.
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: تحدث عن الشتاء في مدريد
    gloss: في الشتاء يكون الجو باردًا جدًا في مدريد.
    note: تقدّم *En invierno* (في الشتاء) كلمة تدل على فصل، وتقابلها *en julio* أدناه.
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: تحدث عن حر يوليو
    gloss: في يوليو يكون الجو شديد الحرارة أكثر من اللازم.
    note: تقوي *Demasiado* (أكثر من اللازم) معنى *calor* أكثر من *mucho* (كثير) العادية.
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: اشرح لماذا تحتاج إلى الماء
    gloss: نحتاج إلى الماء لأن الجو حار.
    note: تربط *Porque* (لأن) الحاجة بسببها المتعلق بالطقس، وهي جملة عملية مفيدة لورشة الطبخ.
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: قراءة نشرة الطقس
    gloss: اليوم، الثاني والعشرون من يوليو، الجو حار جدًا ومشمس. لا توجد سحابة واحدة. وهناك أيضًا قليل من الرياح. إنه يوم جيد للذهاب إلى ورشة الطبخ، لكن من المهم أن تحمل الماء.
    note: نشرة قصيرة ليوم 22 يوليو، يوم درس الطبخ.
    glosses:
      Hoy: اليوم
      veintidós: الثاني والعشرون
      julio: يوليو
      hace: الجو (من الفعل hacer)
      calor: حر
      sol: مشمس / شمس
      hay: يوجد (من الفعل haber)
      nube: سحابة
      También: أيضًا
      poco: قليل
      viento: رياح
      buen: جيد
      día: يوم
      ir: يذهب
      taller: ورشة
      cocina: طبخ
      importante: مهم
      llevar: يحمل
      agua: ماء
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (قليل من)
    gloss: كيف تصف un poco de كمية صغيرة.
    note: انظر نص البطاقة نفسها.
    target_text: تُستخدم *Un poco de* (قليل من) مع كميات الطعام، وهنا تصف كمية صغيرة من الرياح؛ إنه النمط نفسه مع اسم جديد.
  es.a1.unit10.lesson06.teach.line01:
    title: علّق على الحر
    gloss: تعلّق إيلينا على شدة الحر اليوم.
    note: '*¡Qué calor hace hoy!* (ما أشد الحر اليوم!) استخدام تعجبي للتعبير *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: وافق وأضف تفصيلًا
    gloss: يوافق ماتيو ويذكر أنه لا توجد سحابة واحدة.
    note: تجمع بين *hace mucho calor y hace sol* و*no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: اقترح حمل الماء
    gloss: تقول إيلينا إنهما يحتاجان إلى الماء للطريق.
    note: تشير *El camino* (الطريق) إلى مشوارهما إلى الورشة.
  es.a1.unit10.lesson06.teach.line04:
    title: وافق ونبّه إلى وجود متجر
    gloss: يوافق ماتيو ويذكر وجود متجر قريب.
    note: تستخدم *Cerca de aquí* (قريبًا من هنا) عبارة المكان *cerca de* (قرب).
  es.a1.unit10.lesson06.teach.line05:
    title: قارن بين الشتاء والصيف
    gloss: تقارن إيلينا بين شتاء مدريد البارد وحر يوليو الشديد اليوم.
    note: تجمع بين الجملتين الموسميتين *en invierno hace mucho frío* و*en julio hace demasiado calor*.
  es.a1.unit10.lesson06.teach.line06:
    title: شارك تفضيلك
    gloss: يقول ماتيو إنه يفضّل الحر — ففي لندن تمطر تقريبًا كل يوم.
    note: '*Prefiero* (أفضّل) صيغة جديدة لضمير المتكلم؛ و*casi todos los días* (تقريبًا كل يوم) عبارة مفيدة للتكرار.'
  es.a1.unit10.lesson06.teach.line07:
    title: وافق وحثّ على الإسراع
    gloss: توافق إيلينا وتقول إن عليهما الذهاب وإلا تأخرا عن الدرس.
    note: '*Es verdad* تعني «هذا صحيح»؛ و*o* (أو) تدل هنا على النتيجة («وإلا»).'
  es.a1.unit10.lesson06.teach.line08:
    title: وافق وانطلق
    gloss: يوافق ماتيو على أنها محقة وينطلقان.
    note: '*Tienes razón* (أنت محق) عبارة شائعة للموافقة.'
