course:
  title: الإسبانية A1
  description: 'إسبانية للمبتدئين للحديث عن الحيوانات الأليفة والحيوانات الشائعة: تسميتها، والعناية الأساسية بها (التنزه والإطعام واللعب)، والتعبير عن الحيوانات التي تحبها حتى لو لم تملك واحدًا، وجمع الأسماء المنتظم في الإسبانية.'
