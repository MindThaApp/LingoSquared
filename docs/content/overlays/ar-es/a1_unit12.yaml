  es.a1.unit12.lesson01.teach.nervioso:
    title: متوتر
    gloss: متوتر
    note: '*Nervioso* (مذكر) / *nerviosa* (مؤنث): زوج عادي من الصفات المنتهية بـ -o/-a.'
    example_gloss:
    - Mateo متوتر.
    - Elena متوترة.
  es.a1.unit12.lesson01.teach.contento:
    title: سعيد
    gloss: سعيد / راضٍ
    note: '*Contento/contenta* تصف الشعور بالسعادة أو الرضا، وليست سمة دائمة.'
    example_gloss:
    - Mateo سعيد.
    - Elena سعيدة.
  es.a1.unit12.lesson01.teach.cansado:
    title: متعب
    gloss: متعب
    note: '*Cansado/cansada* من الفعل *cansar* (أتعب).'
    example_gloss:
    - بعد الورشة، أنا متعب. (مذكر)
    - بعد الورشة، أنا متعبة. (مؤنث)
  es.a1.unit12.lesson01.teach.preocupado:
    title: قلق
    gloss: قلق
    note: '*Preocupado/preocupada* من الفعل *preocupar* (أقلق).'
    example_gloss:
    - Mateo قلق.
    - Elena قلقة.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: فخور
    gloss: فخور
    note: '*Orgulloso/orgullosa*: في *estoy orgulloso/a de...* (أنا فخور بـ...) تأتي *de* قبل ما تفتخر به.'
    example_gloss:
    - أنا فخور بك. (مذكر)
    - أنا فخورة بك. (مؤنث)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: أنا متوتر (مذكر)
    gloss: أنا متوتر.
    note: '*Estoy* (أنا، من *estar*) + صيغة الصفة المذكرة.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: أنا متوترة (مؤنث)
    gloss: أنا متوترة.
    note: التركيب نفسه مع صيغة الصفة المؤنثة.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: أنا سعيد (مذكر)
    gloss: أنا سعيد.
    note: '*Estoy contento*: النمط نفسه *estar* + صفة.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar مقابل ser مع المشاعر
    gloss: لماذا تُستخدم estar عادةً مع المشاعر لا ser.
    note: انظر نص البطاقة نفسها.
    target_text: 'تصف *Estar* + الصفة حالة مؤقتة أو شعورًا (estoy nervioso: أنا متوتر [الآن])، بخلاف *ser* + الصفة التي تصف سمة دائمة. وتُستخدم *estar* عادةً مع المشاعر.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: اسأل كيف يشعر شخص ما
    gloss: كيف تشعر؟
    note: '*¿Cómo te sientes?* تستخدم *sentirse* (يشعر)، وهو فعل انعكاسي، ويختلف عن *estar* + صفة.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: صِف شعورًا مختلطًا
    gloss: أشعر بقليل من التوتر، لكنني سعيد.
    note: '*Me siento* (أشعر) + صفة، مع *pero* (لكن) للمقابلة بين شعورين في آن واحد، وهي الإجابة الطبيعية عن *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: شيء يحترق
    gloss: هناك شيء يحترق!
    note: '*Se quema* هي الصيغة الانعكاسية من *quemar* (أحرق)، أي «يحترق من تلقاء نفسه»، وهي الطريقة الطبيعية لقول إن شيئًا يحترق دون ذكر الفاعل.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: أنا قلق (مذكر)
    gloss: أنا قلق.
    note: '*Preocupado* في نمط *estoy* + صفة.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: لا تقلق
    gloss: لا تقلق.
    note: انظر ملاحظة القواعد التالية.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: اقترح البدء من جديد
    gloss: يمكننا أن نبدأ من جديد.
    note: '*Podemos* (نستطيع) + المصدر؛ و*de nuevo* (من جديد) عبارة شائعة لإعادة فعل شيء ما.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: نمط الأمر المنفي وراء عبارة «لا تقلق».
    note: انظر نص البطاقة نفسها.
    target_text: '*No te preocupes* (لا تقلق) أمر منفي غير رسمي، يتكوّن من *no* + الضمير الانعكاسي (*te*) + الفعل.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: تأمّل في الدرس
    gloss: قبل الدرس، كان Elena وMateo متوترين قليلًا. وأثناء الدرس احترق شيء ما وكان كلاهما قلقًا. لكنهما بدآ من جديد، وفي النهاية خرجت الكعكة مثالية. والآن كلاهما فخور وسعيد جدًا.
    note: '*Estaban* (كانوا) تصف شعورهم في ذلك الوقت، و*están* (هم) تصف شعورهم الآن.'
    glosses:
      Antes: قبل
      clase: الدرس
      estaban: كانوا (من estar)
      poco: قليلًا
      nerviosos: متوتر
      Durante: أثناء
      algo: شيء ما
      quemó: احترق
      dos: كلاهما / اثنان
      preocupados: قلق
      Pero: لكن
      empezaron: بدؤوا
      nuevo: مرة أخرى / من جديد
      final: النهاية
      pastel: كعكة
      salió: خرج (بنتيجة)
      perfecto: مثالي
      Ahora: الآن
      están: يكونون
      orgullosos: فخور
      contentos: سعيد
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: مطابقة الصفات في الجمع
    gloss: لماذا تأخذ المجموعة المختلطة صفات بصيغة المذكر الجمع.
    note: راجع نص البطاقة نفسها.
    target_text: عند وصف Elena وMateo معًا، تأتي الصفات بصيغة الجمع المذكر (nerviosos, preocupados, orgullosos, contentos)، وهذه هي القاعدة المعتادة في الإسبانية حين تضم المجموعة فردًا مذكرًا واحدًا على الأقل.
  es.a1.unit12.lesson06.teach.line01:
    title: اسأل كيف يشعر ماتيو
    gloss: تسأل إيلينا ماتيو كيف يشعر قبل الدرس.
    note: تُستخدم *¿Cómo te sientes?* للسؤال عن شعور شخص ما.
  es.a1.unit12.lesson06.teach.line02:
    title: أجب بشعور مختلط
    gloss: يقول ماتيو إنه يشعر ببعض التوتر لكنه سعيد.
    note: يستخدم ماتيو صيغتي المذكر *nervioso* و*contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: ردّ على الموقف
    gloss: توافقه إيلينا، ثم تلاحظ أن شيئًا ما يحترق.
    note: '*¡Ay, no!* (يا إلهي، لا!) تعبير شائع عن الانزعاج أو الفزع.'
  es.a1.unit12.lesson06.teach.line04:
    title: عبّر عن القلق
    gloss: يقول ماتيو إنه قلق ويسأل ماذا يفعلان.
    note: '*¿Qué hacemos?* (ماذا نفعل؟) سؤال عملي.'
  es.a1.unit12.lesson06.teach.line05:
    title: طمئن واقترح حلًّا
    gloss: تطلب منه إيلينا ألّا يقلق، فبإمكانهما أن يبدآ من جديد.
    note: تجمع بين *no te preocupes* و*podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: وافق وحاولا مرة أخرى
    gloss: يوافق ماتيو ويقترح المحاولة مرة أخرى.
    note: '*Vamos a intentarlo otra vez* (لنحاول مرة أخرى) تعيد استخدام بنية *vamos a* + المصدر من الوحدات السابقة، وهنا مع ضمير المفعول *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: أعلن النجاح
    gloss: تعلن إيلينا أن الكعكة أصبحت الآن مثالية.
    note: '*¡Mira!* (انظر!) أداة للفت الانتباه، و*el pastel* (الكعكة) هو الطبق الذي تدور حوله المشكلة.'
  es.a1.unit12.lesson06.teach.line08:
    title: احتفل وعبّر عن الفخر
    gloss: يحتفل ماتيو ويقول إنه فخور بهما معًا.
    note: '*¡Qué bien!* (ما أروع هذا!) تستخدم نمط التعجب *¡Qué...!* مثل *¡Qué calor!*؛ و*de nosotros* (بنا) توسّع *estoy orgulloso de ti* لتشمل مجموعة.'
  es.a1.unit12.lesson06.teach.line09:
    title: شاركه الفخر
    gloss: توافق إيلينا أنها فخورة أيضًا، فقد أنجزا ذلك معًا.
    note: '*Lo logramos juntos* (أنجزناه معًا) جملة ختامية طبيعية، وفيها يظهر الفعل *lograr* (أنجز/نجح في) لأول مرة.'
