  description: 'الحديث عن مهنتك، في متابعة لقصة إلينا وماتيو خلال استراحة في حصة ورشة 22 يوليو، حيث يتحدثان عن عملهما اليومي: ماتيو المحاسب وإلينا المعلمة، ويتفقان على أنهما يفضّلان الطبخ معًا.'
