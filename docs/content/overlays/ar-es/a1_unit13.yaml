  es.a1.unit13.lesson02.teach.soy_contador:
    title: قل إنك محاسب
    gloss: أنا محاسب.
    note: تُستخدم أسماء المهن مع *ser* + المهنة دون أداة -- راجع ملاحظة القواعد أدناه.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: قولي إنك معلمة (مؤنث)
    gloss: أنا معلمة.
    note: كلمة *Profesora* هي صيغة المؤنث من *profesor*.
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: قل أين تُدرّس
    gloss: أُدرّس في مدرسة.
    note: '*Enseño* (أُدرّس) هي صيغة المتكلم من *enseñar*، مع *escuela* (مدرسة).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: أسماء المهن مع ser
    gloss: كيف تذكر الإسبانية المهنة دون أداة.
    note: انظر إلى نص البطاقة نفسها.
    target_text: 'تُستخدم أسماء المهن مع *ser* + المهنة دون أداة تعريف أو تنكير: *soy contador* (أنا محاسب)، وليس *soy un contador*. وللكلمة *contador* صيغة مؤنثة مقابلة هي *contadora*؛ وكذلك *profesor/profesora* زوج مذكر/مؤنث بمعنى «معلم/معلمة» (تُضاف *-a* للمرأة).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: اسأل عن عمل شخص ما
    gloss: ماذا تعمل؟
    note: '*¿En qué trabajas?* (حرفيًا «في ماذا تعمل؟») هي الطريقة المعتادة للسؤال عن مهنة شخص ما.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: أجب بمهنتك
    gloss: أعمل في مكتب. أنا محاسب.
    note: تجمع بين *oficina* و*soy contador* في جواب طبيعي من جملتين.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: قل إنك تحب عملك
    gloss: أحب عملي.
    note: تعيد استخدام تركيب *gustar* مع *mi trabajo* (عملي).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: عبّر عن تفضيل
    gloss: لكنني أفضّل الطبخ.
    note: '*Prefiero* (أفضّل) صيغة سبق أن رأيتها؛ و*cocinar* (يطبخ) هو المصدر الذي يمثّل النشاط المحوري في هذه القصة.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: قل إنكما تفضّلان هذا
    gloss: كلانا يفضّل هذا.
    note: '*Preferimos* هي صيغة *nosotros* من *preferir*، وتُستخدم حين يتفق إلينا وماتيو معًا.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: قراءة عن عملهما
    gloss: يعمل ماتيو في مكتب في لندن. هو محاسب. تُدرّس إلينا في مدرسة. هي معلمة ولديها عشرون طالبًا. يحب كلاهما عمله، لكنهما يفضّلان الطبخ معًا أيام الثلاثاء.
    note: ملخص قصير عن عمل ماتيو وإلينا اليومي.
    glosses:
      trabaja: يعمل (من trabajar)
      oficina: مكتب
      contador: محاسب
      enseña: تُدرّس (من enseñar)
      escuela: مدرسة
      profesora: معلمة
      tiene: لديها (من tener)
      veinte: عشرون
      estudiantes: طلاب
      gusta: يُعجب (من gustar)
      trabajo: عمل
      prefieren: يفضّلان (من preferir)
      cocinar: يطبخ
      juntos: معًا
      martes: أيام الثلاثاء
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: كيف يمتد gustar إلى مفعول غير مباشر بصيغة الجمع.
    note: انظر إلى نص البطاقة نفسها.
    target_text: 'تُوسّع *A los dos les gusta* (يعجبهما كليهما) تركيب *gustar* (الذي تعرفه بالفعل) ليشمل مفعولًا غير مباشر بصيغة الجمع: *les* (لهم) بدل *me/te* (لي/لك).'
  es.a1.unit13.lesson06.teach.line01:
    title: اسأل عن عمل ماتيو
    gloss: تسأل إلينا ماتيو عن عمله.
    note: السؤال الذي تعلمته سابقًا، موجّه الآن إلى ماتيو بالاسم.
  es.a1.unit13.lesson06.teach.line02:
    title: أجب بمهنته
    gloss: يقول ماتيو إنه يعمل في مكتب محاسبًا.
    note: 'الجواب الكامل الذي تعلمته سابقًا: أين يعمل، ثم مهنته.'
  es.a1.unit13.lesson06.teach.line03:
    title: تتفاعل وتذكر مهنتها
    gloss: ترى إيلينا أن الأمر مثير للاهتمام، وتخبره بأنها معلمة.
    note: '*Interesante* (مثير للاهتمام) كلمة جديدة مشابهة للعربية في معناها وقريبة من الإنجليزية في شكلها؛ أما البقية فهي *soy profesora* و*enseño en una escuela* اللتان تعرفهما سابقًا.'
  es.a1.unit13.lesson06.teach.line04:
    title: اسألها إن كانت تحب التدريس
    gloss: يسأل ماتيو إيلينا إن كانت تحب التدريس.
    note: '*¿Te gusta enseñar?* تجمع بين نمط السؤال المعتاد بالفعل *gustar* والفعل في صيغة المصدر *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: أكّد ثم أضف تفضيلًا
    gloss: تقول إيلينا إنها تحبه كثيرًا، لكنها تفضل الطبخ معه أيام الثلاثاء.
    note: '*Contigo* (معك) صيغة جديدة تندمج فيها حرف الجر مع الضمير؛ أما *los martes* (أيام الثلاثاء) فتستعمل أداة التعريف بصيغة الجمع لليوم الأسبوعي المتكرر.'
  es.a1.unit13.lesson06.teach.line06:
    title: وافقها على التفضيل نفسه
    gloss: يقول ماتيو إنه هو أيضًا يحب عمله، لكنه يفضل الطبخ.
    note: '*A mí también* (وأنا أيضًا) نمط للموافقة مع التوكيد في *gustar*؛ إذ تُبرز *a mí* مَن يحب الشيء.'
  es.a1.unit13.lesson06.teach.line07:
    title: استخلص النتيجة
    gloss: تستنتج إيلينا أن كليهما يفضّل هذا (الطبخ معًا).
    note: '*Entonces* (إذن) أداة ربط منطقية جديدة؛ أما البقية فهي *los dos preferimos esto* (كلانا يفضّل هذا).'
  es.a1.unit13.lesson06.teach.line08:
    title: أكّد بحماس
    gloss: 'يوافق ماتيو: بالتأكيد.'
    note: '*Definitivamente* (بالتأكيد) ظرف جديد قريب من العربية في المعنى وشبيه بالإنجليزية في الشكل، ويُختتم به المشهد.'
