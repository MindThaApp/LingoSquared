  description: تعلّم تحيات إسبانية عامة محايدة مناسبة لكل البلدان الناطقة بالإسبانية، وطرق التعارف، وأحاديث قصيرة عملية للقاء الأول. وتوضّح الإرشادات مستوى الرسمية في الإسبانية، والمطابقة، وحذف الفاعل، وصيغ الأفعال.
