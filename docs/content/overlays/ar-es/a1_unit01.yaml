teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: ضمير المخاطب المحترم
    gloss: أنتَ/أنتِ (للمخاطب بصيغة رسمية محترمة)
    note: تميّز الإسبانية غالبًا بين المخاطب الرسمي وغير الرسمي، كما تميّز العربية بين صيغ الخطاب في بعض المقامات. يفيد usted مع شخص بالغ لا تعرفه أو حين يناسب أسلوب الاحترام. ومع أنه يعني «أنتَ/أنتِ»، فإنه يأخذ صيغة الفعل نفسها التي يأخذها él أو ella.
  es.a1.unit01.lesson01.teach.tu:
    title: ضمير المخاطب غير الرسمي
    gloss: أنتَ/أنتِ (للمفرد في المقام غير الرسمي)
    note: يُستخدم tú مع صديق واحد أو زميل أو طفل أو أي شخص آخر حين تكون العلاقة غير رسمية. وتفرّق علامة النبر المكتوبة بين الضمير tú وصفة الملكية tu التي تعني «خاصتك».
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: سؤال رسمي عن الحال
    gloss: كيف حالك؟
    note: Está هي صيغة usted من الفعل estar. تستخدم الإسبانية estar هنا للحديث عن حالة الشخص الراهنة. وتحمل Cómo علامة الaccent لأنها أداة استفهام.
  es.a1.unit01.lesson01.teach.como_estas:
    title: سؤال غير رسمي عن الحال
    gloss: كيف حالك؟
    note: 'Estás هي صيغة tú من الفعل estar. وكما تتغير في العربية صيغة المخاطب بحسب المخاطَب، تتغير está إلى estás بحسب نوع المخاطبة: رسمية أو غير رسمية.'
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: ردّ موجز
    gloss: بخير، شكرًا.
    note: يمكن في الإسبانية الردّ بكلمة bien وحدها دون تكرار الفاعل أو الفعل.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: ردّ إيجابي
    gloss: بخير جدًا، شكرًا.
    note: تقوّي Muy كلمة bien ولا تتغير صيغتها.
  es.a1.unit01.lesson01.teach.and_usted:
    title: إعادة السؤال بصيغة رسمية
    gloss: وأنت؟
    note: أبقِ على usted عند إعادة سؤال بصيغة محترمة.
  es.a1.unit01.lesson01.teach.and_tu:
    title: إعادة السؤال بصيغة غير رسمية
    gloss: وأنت؟
    note: استخدم tú حين يكون الحديث غير رسمي. وعلامة النبر المكتوبة مهمة لأن tu بلا علامة تعني «خاصتك».
  es.a1.unit01.lesson02.teach.hola:
    title: تحية لكل الأوقات
    gloss: مرحبًا؛ أهلًا
    note: تصلح Hola في أي وقت من اليوم، وفي اللقاءات الرسمية وغير الرسمية.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: تحية الصباح
    gloss: صباح الخير
    note: للأسماء في الإسبانية جنس نحوي، ومثلها في العربية المذكر والمؤنث. Días جمع مذكر، ولذلك تأتي الصفة buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: تحية ما بعد الظهر
    gloss: طاب يومك (تحية بعد الظهر)
    note: Tardes جمع مؤنث، ولذلك تطابقها buenas. والتغيّر من buenos إلى buenas مطابقة نحوية وليس تغيّرًا في درجة اللباقة.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: تحية المساء أو الليل
    gloss: مساء الخير؛ تصبح على خير
    note: Noches جمع مؤنث ولذلك تأخذ buenas. يمكن استخدام العبارة لتحية شخص ليلًا أو لإنهاء اللقاء قبل النوم.
  es.a1.unit01.lesson02.teach.adios:
    title: وداع مباشر
    gloss: مع السلامة
    note: Adiós محايدة، لكنها قد تبدو أكثر نهائية من عبارات «أراك لاحقًا».
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: أراك لاحقًا
    gloss: أراك لاحقًا
    note: Hasta luego عبارة وداع متعارف عليها، ولا تحتاج إلى قراءة حرفية كلمة بكلمة.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: وداع ودّي
    gloss: إلى اللقاء
    note: معنى nos vemos الحرفي أقرب إلى «يرى بعضنا بعضًا».
  es.a1.unit01.lesson02.teach.good_day:
    title: أمنية ختامية مهذبة
    gloss: أتمنى لك يومًا سعيدًا.
    note: Tenga هي صيغة usted المستخدمة في هذه الأمنية المهذبة. وBuen هي الصيغة المختصرة للمذكر المفرد من bueno قبل día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: السؤال عن الاسم بصيغة رسمية
    gloss: ما اسمك؟
    note: تعبّر الإسبانية عن ذلك تقريبًا بمعنى «كيف تسمّي نفسك؟». ويرتبط Se بصيغة usted الرسمية llama. وفي العربية لا يظهر هذا التمييز في الفعل نفسه.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: قل اسمك
    gloss: اسمي لوسيا.
    note: معنى Me llamo الحرفي «أسمّي نفسي». ولأن نهاية الفعل تدلّ على المتكلم، تحذف الإسبانية عادةً yo هنا، كما يُستغنى في العربية عن الضمير «أنا» في «أسمّي نفسي».
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: السؤال عن الاسم بصيغة غير رسمية
    gloss: ما اسمك؟
    note: يرتبط Te بالضمير غير الرسمي tú، وتحمل llamas نهاية tú وهي -as. قارن بين se llama الرسمية وte llamas غير الرسمية.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: عرّف بنفسك بالفعل ser
    gloss: أنا دييغو.
    note: Soy هي صيغة المتكلم المفرد من ser. تستخدم الإسبانية ser للهوية، وتوزّع بينه وبين estar الاستخدامات التي تتعلق بالحالات المؤقتة. وفي العربية تُحذف عادةً رابطة «يكون» في الجملة الاسمية.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: التعبير عن السرور بلقاء شخص
    gloss: تشرفنا.
    note: Mucho gusto عبارة ثابتة مفهومة على نطاق واسع. وعلى خلاف صفات مثل encantado أو encantada فهي لا تتغير بحسب جنس المتكلم.
  es.a1.unit01.lesson03.teach.igualmente:
    title: ردّ المجاملة
    gloss: وأنا كذلك.
    note: Igualmente ردّ موجز على Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: تقديم رجل
    gloss: هذا كارلوس.
    note: تفرّق الإسبانية بين المذكر والمؤنث في اسم الإشارة، كما تفرّق العربية بين «هذا» و«هذه». يُستخدم este حين يكون الشخص أو الاسم المشار إليه مذكرًا نحويًا.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: تقديم امرأة
    gloss: هذه آنا.
    note: استخدم esta للمشار إليه المؤنث. لا تحمل Esta هنا accent؛ أما está مع accent فصيغة من estar وتعني «يكون» أو «يقع».
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: السؤال عن الأصل بصيغة رسمية
    gloss: من أين أنت؟
    note: Es هي صيغة usted من ser. تستخدم الإسبانية ser وليس estar للدلالة على الأصل. وتحمل Dónde accent في السؤال المباشر.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: قل من أين أنت
    gloss: أنا من المكسيك.
    note: Soy هي صيغة yo من ser. لا حاجة إلى الفاعل yo لأن soy تدلّ على المتكلم.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: السؤال عن الأصل بصيغة غير رسمية
    gloss: من أين أنت؟
    note: Eres هي صيغة tú من ser. قارن بين es مع usted الرسمية وeres غير الرسمية. وفي العربية قد يتشابه سؤال «من أين أنت؟» في الصيغتين.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: جملة أخرى عن الأصل
    gloss: أنا من كولومبيا.
    note: استخدم soy de متبوعة بمكان للتعبير عن الأصل.
  es.a1.unit01.lesson04.teach.live_london:
    title: قل أين تسكن
    gloss: أسكن في لندن.
    note: Vivo هي صيغة yo من vivir. لا تحتاج الإسبانية إلى yo لأن النهاية -o تدلّ على المتكلم، كما تدلّ على ذلك بنية الفعل المضارع في العربية.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: السؤال عن الإسبانية بصيغة رسمية
    gloss: هل تتحدث الإسبانية؟
    note: تكوّن الإسبانية سؤال نعم/لا دون أداة استفهام مثل «هل». Habla هي صيغة usted؛ وتدلّ النغمة وعلامتا الاستفهام على السؤال.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: قدرة محدودة
    gloss: نعم، قليلًا.
    note: Sí مع accent تعني «نعم». أما si بلا accent فتعني «إذا»، مع أن الكتابة بلا accent مقبولة هنا تسامحًا في الكتابة عند مستوى A1.
  es.a1.unit01.lesson04.teach.still_learning:
    title: وصف حالة مستمرة
    gloss: ما زلت أتعلّم.
    note: Estoy هي صيغة yo من estar. تدعم estar هنا نشاطًا جاريًا، بينما تعبّر soy في Soy de Colombia عن الأصل أو الهوية.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: السؤال بصيغة رسمية عن الزيارة الأولى
    gloss: هل هذه أول مرة لك هنا؟
    note: تعني Su «لك/ك» عند مخاطبة شخص بصيغة usted. وتحافظ الإسبانية بين su وtu على الاختيار بين الرسمي وغير الرسمي، بينما لا يظهر ذلك في ضمير «ـك» العربي.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: السؤال بصيغة غير رسمية عن الزيارة الأولى
    gloss: هل هذه أول مرة لك هنا؟
    note: Tu بلا علامة نبر هي صفة الملكية غير الرسمية «خاصتك». قارنها بالضمير tú الذي يحمل علامة النبر.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: تأكيد أنها الزيارة الأولى
    gloss: نعم، إنها أول مرة لي.
    note: Primera مؤنثة لأنها تطابق vez. وكما في العربية، تطابق الصفة في الإسبانية جنس الاسم الذي تصفه.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: اذكر وجهتك
    gloss: جئت من أجل ورشة الطبخ.
    note: Vengo هي صيغة yo من venir، وتعني «آتي» أو «أنا قادم». وAl هي الصيغة المدمجة الواجبة من a وel.
  es.a1.unit01.lesson05.teach.me_too:
    title: مشاركة الوضع نفسه
    gloss: وأنا أيضًا.
    note: تفيد Yo también حين ينطبق كلام الشخص الآخر عليك أنت أيضًا.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: السؤال عن اهتمام
    gloss: هل تحب الطبخ؟
    note: في الإسبانية يدل الضمير te على الشخص الذي يشعر بالإعجاب، أما cocinar فهو الشيء المحبَّب. يبقى الفعل gusta بصيغة المفرد لأن النشاط يُعامل معاملة المفرد.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: التعبير عن اهتمام كبير
    gloss: نعم، كثيرًا.
    note: تجيب كلمة Mucho عن السؤال عن الدرجة، ولا تتغير صيغتها هنا.
  es.a1.unit01.lesson05.teach.thats_good:
    title: ردّ فعل إيجابي
    gloss: هذا رائع!
    note: تحمل كلمة Qué علامة الحدّة في هذا التعجب. فهي تمهّد لردّ فعل إيجابي ولا تطرح سؤالًا.
  es.a1.unit01.lesson06.teach.line01:
    title: بداية اللقاء
    gloss: تحيّي إيلينا ماتيو وتسأله هل هذه هي المرة الأولى له هنا.
    note: يستخدم المتحدثان صيغة tú غير الرسمية لأنهما يلتقيان كنظيرين في النشاط نفسه.
  es.a1.unit01.lesson06.teach.line02:
    title: بداية اللقاء، الردّ
    gloss: يقول ماتيو نعم، إنها المرة الأولى له، ويوضح أنه جاء إلى ورشة الطبخ.
    note: تذكر عبارة Vengo al taller سبب وجوده هنا، وتستخدم المضارع لموقف مستمر.
  es.a1.unit01.lesson06.teach.line03:
    title: تبادل الأسماء
    gloss: توافق إيلينا على أنها المرة الأولى لها أيضًا، وتذكر اسمها، وتسأل ماتيو عن اسمه.
    note: Me llamo طريقة طبيعية لذكر الاسم، وتحذف الإسبانية عادةً الضمير yo لأن صيغة الفعل تدل على المتكلم.
  es.a1.unit01.lesson06.teach.line04:
    title: تبادل الأسماء، الردّ
    gloss: يذكر ماتيو اسمه ويقول إنه سعيد بلقائها.
    note: Soy طريقة طبيعية أخرى لذكر الاسم، وتستخدم الفعل ser بدلًا من الفعل الانعكاسي llamarse.
  es.a1.unit01.lesson06.teach.line05:
    title: السؤال عن الأصل
    gloss: تردّ إيلينا المجاملة (وأنا كذلك) وتسأل ماتيو من أين هو.
    note: يسأل De dónde eres عن الأصل بصيغة tú غير الرسمية.
  es.a1.unit01.lesson06.teach.line06:
    title: السؤال عن الأصل، الردّ
    gloss: ماتيو من كولومبيا لكنه يعيش في لندن، ثم يطرح السؤال نفسه على إيلينا.
    note: تعبّر Soy de عن الأصل، بينما تعبّر vivo en عن مكان الإقامة الحالي. وتربط Pero بين هاتين المعلومتين المتقابلتين.
  es.a1.unit01.lesson06.teach.line07:
    title: الحديث عن اهتمام
    gloss: تقول إيلينا إنها من إسبانيا وتسأل ماتيو هل يحب الطبخ.
    note: تصف Soy الأصل، وهو النمط نفسه الذي استخدمه ماتيو للتو.
  es.a1.unit01.lesson06.teach.line08:
    title: الحديث عن اهتمام، الردّ
    gloss: يقول ماتيو إنه يحب الطبخ كثيرًا لكنه ما زال يتعلم.
    note: تصف Estoy aprendiendo نشاطًا جاريًا في هذه اللحظة، وتتكوّن من الفعل estar مع صيغة المصدر الجاري المنتهية بـ -ando أو -iendo.
  es.a1.unit01.lesson06.teach.line09:
    title: إنهاء الحديث
    gloss: توافق إيلينا على أنها تتعلم أيضًا وتقول إنهما سيلتقيان في الداخل.
    note: تشير Nos vemos إلى لقاء متوقع لاحقًا، وتحدد dentro المكان.
  es.a1.unit01.lesson06.teach.line10:
    title: إنهاء الحديث، الردّ
    gloss: يوافق ماتيو ويؤكد أنهما سيلتقيان.
    note: تؤكد Sí اقتراح إيلينا ببساطة قبل أن يكرر nos vemos.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: أيّ صيغة لضمير المخاطب تُستخدم للاحترام أو في المواقف الرسمية؟
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted هي صيغة المفرد المحترمة، وتأخذ أفعالًا بصيغة الغائب.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: أيّ صيغة تُستخدم لمخاطبة صديق واحد أو نظير بشكل غير رسمي؟
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: يُكتب الضمير tú بعلامة الحدّة؛ أما tu بدونها فتعني «ـك» للملكية.
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: استمع واختر الجملة التي تسمعها.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: اكتب السؤال غير الرسمي الذي تسمعه.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: رتّب السؤال الرسمي.
    correct_response:
