    title: التعبير عن هدف السكن
    gloss: أريد أن أستأجر شقة ذات مطبخ كبير.
    note: '*Quiero* (أريد) + المصدر *alquilar*، وتُدخل *con* (مع / ذات) الميزة المطلوبة.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: شرح الفائدة
    gloss: بهذه الطريقة يمكنك الطبخ في البيت أيضًا.
    note: '*Así* (بهذه الطريقة) + *puedes* (يمكنك) + المصدر تربط هدف السكن بموضوع الطبخ في القصة كلها.'
