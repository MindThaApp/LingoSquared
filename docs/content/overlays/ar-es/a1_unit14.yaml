  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: غرفة أم طبخ'
    gloss: الفرق بين la cocina (المطبخ) وcocinar (يطبخ).
    note: انظر نص البطاقة نفسها.
    target_text: '*La cocina* تعني هنا «المطبخ» (غرفة)، وهو معنى مختلف عن *cocina*/*cocinar* (الطبخ / يطبخ) اللتين وردتا في هذه القصة كلها بمعنى ورشة الطبخ. يحدد السياق المعنى: في *taller de cocina* تعني الطبخ؛ و*la cocina* في البيت أو الشقة هي الغرفة؛ و*cocinar* فعل «يطبخ».'
