    gloss: شقة شاغرة في مبنى قريب من الحديقة. فيها غرفتا نوم وحمّام وغرفة جلوس ومطبخ كبير. مناسبة تمامًا لمن يريد الطبخ في البيت.
    note: إعلان مبوّب واقعي الأسلوب.
    glosses:
      desocupado: شاغر / متاح
      edificio: مبنى
      cerca: قريب
      parque: حديقة
      Tiene: فيه / لديه (من tener)
      dormitorios: غرف نوم
      baño: حمّام
      sala: غرفة جلوس
      grande: كبير
      perfecto: مثالي
      quiere: يريد (من querer)
      cocinar: يطبخ
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: كيف تصف جملة الصلة المستأجر المثالي.
    note: انظر نص البطاقة نفسها.
    target_text: '*Para alguien que quiere* (لشخص يريد) تستعمل *alguien* (شخص ما) + *que* (الذي) لإدخال جملة وصفية، وهو نمط شائع في إعلانات الإيجار التي تصف المستأجر المثالي.'
  es.a1.unit14.lesson06.teach.line01:
    title: عرض المشكلة والهدف
    gloss: يقول ماتيو إن مطبخه صغير جدًا وإنه يريد استئجار شقة ذات مطبخ كبير.
    note: تجمع بين *mi cocina es muy pequeña* (مطبخي صغير جدًا) وعبارة الهدف *quiero alquilar un apartamento con una cocina grande* (أريد أن أستأجر شقة ذات مطبخ كبير).
  es.a1.unit14.lesson06.teach.line02:
    title: اقتراح تصفح الإعلانات
    gloss: تقترح إيلينا النظر في الجريدة، ففيها إعلانات كثيرة.
    note: '*El periódico* (الجريدة) و*anuncios* (إعلانات) مفردات جديدة من الإعلانات المبوّبة في الحياة الواقعية.'
  es.a1.unit14.lesson06.teach.line03:
    title: العثور على إعلان
    gloss: يجد ماتيو مبنى فيه شقة شاغرة.
    note: '*Este edificio* (هذا المبنى) و*desocupado* (شاغر، متاح).'
  es.a1.unit14.lesson06.teach.line04:
    title: السؤال عن غرف النوم
    gloss: تسأل إيلينا كم غرفة نوم فيها.
    note: السؤال المعتاد عن مواصفات مكان ما.
  es.a1.unit14.lesson06.teach.line05:
    title: الإجابة بالتفاصيل
    gloss: يقول ماتيو إن فيها غرفتي نوم ومطبخًا كبيرًا.
    note: '*Tiene* (فيه / لديه) + العدد + الاسم.'
  es.a1.unit14.lesson06.teach.line06:
    title: تأكيد مزايا أخرى
    gloss: تفرح إيلينا وتلاحظ أن فيها أيضًا حمّامًا وغرفة جلوس.
    note: '*Baño* (حمّام) و*sala* (غرفة جلوس) تكملان قائمة الغرف، وتأتي *también* (أيضًا) في آخر الجملة.'
  es.a1.unit14.lesson06.teach.line07:
    title: قرار الاتصال
    gloss: يقرر ماتيو الاتصال بالوكالة اليوم.
    note: '*Voy a llamar* (سأتصل) + *hoy mismo* (اليوم نفسه)؛ و*la agencia* هي وكالة التأجير.'
  es.a1.unit14.lesson06.teach.line08:
    title: الموافقة وختام المشهد
    gloss: توافق إيلينا وتشير إلى أنه يستطيع الطبخ في البيت أيضًا.
    note: '*Así puedes cocinar en casa también* (بهذه الطريقة يمكنك الطبخ في البيت أيضًا) تختم المشهد.'
