teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: ساندويتش، سلطة
    gloss: ساندويتش، سلطة
    note: 'الاسمان مقترضان أو مكيّفان: *sándwich* كلمة مأخوذة مباشرة من لغة أخرى، وتُكتب بعلامة النبر لتحديد المقطع المنبور.'
    example_gloss:
    - أريد ساندويتش.
    - في السلطة طماطم.
  es.a1.unit06.lesson01.teach.sopa:
    title: حساء
    gloss: حساء
    note: '*Sopa* مؤنثة، شأن معظم الأسماء الإسبانية المنتهية بـ -a.'
    example_gloss: الحساء لذيذ جدًا.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: ماء، قهوة
    gloss: ماء، قهوة
    note: '*Agua* مؤنثة نحويًا لكنها تأخذ أداة التعريف المذكرة *el* (لا *la*) في المفرد لأنها تبدأ بصوت *a* منبور؛ وهذا شذوذ حقيقي في الإسبانية وليس خطأً مطبعيًا.'
    example_gloss:
    - أريد ماءً من فضلك.
    - لي قهوة.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: أريد ساندويتش
    gloss: أريد ساندويتش.
    note: '*Quiero* (أريد) هي صيغة المتكلم المفرد من الفعل *querer*، وهو فعل جديد في هذه الوحدة.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: لي قهوة
    gloss: لي قهوة.
    note: '*Para mí* (لي) عبارة بديلة شائعة للطلب، تذكر الصنف دون تكرار الفعل؛ انظر ملاحظة القواعد التالية.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: السؤال عمّا يريد الشخص أن يأكله
    gloss: ماذا تريد أن تأكل؟
    note: '*Quieres* هي صيغة المخاطب *tú* من الفعل *querer*، وتُستعمل بين الأصدقاء في الحديث غير الرسمي.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero أم Para mí
    gloss: طريقتان طبيعيتان بالقدر نفسه للطلب.
    note: كلٌّ من *Quiero un café* و*Para mí, un café* صحيح عند الطلب.
    target_text: كلٌّ من *Quiero* («أريد») و*Para mí* («لي»، تُقال قبل ذكر الصنف») طريقة طبيعية ومهذبة بالقدر نفسه للطلب في موقف غير رسمي، وليست إحداهما أصحّ من الأخرى.
  es.a1.unit06.lesson03.teach.el_menu:
    title: قائمة الطعام
    gloss: قائمة الطعام
    note: تُكتب *Menú* بعلامة نبر لأن النبر يقع على المقطع الأخير.
    example_gloss: هل يمكننا الاطلاع على قائمة الطعام؟
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: طلب الاطلاع على قائمة الطعام
    gloss: هل يمكننا الاطلاع على قائمة الطعام؟
    note: '*Podemos* (نستطيع) هي صيغة المتكلمين الجمع من الفعل *poder*، وهو فعل جديد في هذه الوحدة.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: تفضّل
    gloss: تفضّل.
    note: '*Aquí tiene* عبارة معتادة يقولها النادل عند تسليم شيء للزبون، وتستعمل صيغة الفعل المهذبة *usted* حتى في حديث غير رسمي؛ فهي عبارة مجاملة ثابتة وليست تغييرًا في مستوى الكلام.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: بالهناء والشفاء
    gloss: بالهناء والشفاء
    note: '*Buen provecho* عبارة معتادة تُقال قبل أن يبدأ أحد بالأكل، وتشبه في وظيفتها قول «بالهناء والشفاء» أو «صحة وهناء».'
    example_gloss: تفضّل. بالهناء والعافية.
  es.a1.unit06.lesson04.teach.el_postre:
    title: الحلوى
    gloss: الحلوى
    note: '*Postre* اسم مذكّر.'
    example_gloss: للتحلية، أريد كعكة.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: اطلب الحلوى
    gloss: للتحلية، أريد كعكة.
    note: تُستخدم *De postre* (للتحلية) لتقديم ما يطلبه الشخص كطبق أخير، وهي النمط نفسه الذي تُستخدم فيه *para mí* لتقديم الطلب الرئيسي.
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: اطلب الفاتورة
    gloss: الفاتورة، من فضلك.
    note: '*La cuenta* (الفاتورة) هي العبارة المعتادة لطلب الدفع في نهاية الوجبة.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: قراءة قائمة الطعام
    gloss: 'القائمة: ساندويتش، خمسة. سلطة، ثمانية. شوربة، ثلاثة. قهوة أو ماء، مشمول. الحلوى: كعكة.'
    note: نموذج واقعي لقائمة طعام مطبوعة، يعيد استخدام مفردات الطعام في هذه الوحدة مع إضافة الأسعار.
    glosses:
      Menú: قائمة الطعام
      sándwich: ساندويتش
      Ensalada: سلطة
      Sopa: شوربة
      Café: قهوة
      agua: ماء
      incluido: مشمول
      Postre: حلوى
      pastel: كعكة
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (مشمول)
    gloss: معنى أن يُكتب بجانب المشروب «مشمول».
    note: '*Incluido* = مشمول، دون رسوم إضافية.'
    target_text: '*Incluido* (مشمول) تعني أن المشروب يأتي مع الوجبة دون رسوم إضافية.'
  es.a1.unit06.lesson06.teach.line01:
    title: التحية وسؤال الطلب
    gloss: يحيّي النادل إيلينا وماتيو ويسألهما عمّا يريدان أن يأكلا.
    note: تُستخدم *Buenas tardes* (مساء الخير) منذ الظهر، لذا تناسب وقت الغداء.
  es.a1.unit06.lesson06.teach.line02:
    title: إيلينا تطلب
    gloss: تطلب إيلينا سلطة وماءً، من فضلك.
    note: '*Una ensalada y agua* = سلطة وماء.'
  es.a1.unit06.lesson06.teach.line03:
    title: ماتيو يطلب
    gloss: يطلب ماتيو ساندويتش وقهوة لنفسه.
    note: يستخدم *Para mí* بدل تكرار *Quiero*.
  es.a1.unit06.lesson06.teach.line04:
    title: السؤال عن الحلوى
    gloss: يوافق النادل ويسأل إن كانا يريدان حلوى.
    note: '*¿Algo de postre?* (هل تريدان شيئًا للتحلية؟) طريقة طبيعية ومختصرة لعرض الحلوى.'
  es.a1.unit06.lesson06.teach.line05:
    title: طلب حلوى للمشاركة
    gloss: تقول إيلينا نعم، كعكة واحدة لكليهما.
    note: '*Para los dos* (لكلينا) تعني مشاركة حلوى واحدة بينهما، وهو خيار طبيعي في الحياة الواقعية.'
  es.a1.unit06.lesson06.teach.line06:
    title: الموافقة وطلب الفاتورة
    gloss: يوافق ماتيو ويطلب الفاتورة.
    note: '*La cuenta, por favor* = الفاتورة، من فضلك.'
  es.a1.unit06.lesson06.teach.line07:
    title: تسليم الفاتورة
    gloss: يسلّمهما النادل الفاتورة.
    note: تُقال *Aquí tiene* عند تسليم شيء لشخص ما.
  es.a1.unit06.lesson06.teach.line08:
    title: خاتمة ودّية
    gloss: تشكر إيلينا النادل وتقول كم كانت الوجبة لذيذة.
    note: تستخدم *¡Qué buena comida!* نمط التعجب *¡Qué ...!* نفسه الموجود في *¡Qué bien!* و*¡Qué bonito!*.
