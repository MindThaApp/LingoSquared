course:
  title: الإسبانية A1
  description: طلب الطعام والشراب في مطعم، وقراءة قائمة طعام بسيطة، وطلب الحساب، مع متابعة قصة إيلينا وماتيو في الغداء الذي خططا له في الوحدة الخامسة. ويبرز الدرس أن Quiero وPara mí عبارتان طبيعيتان بالقدر نفسه للطلب.
