teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: التذكرة
    gloss: التذكرة
    note: '*El billete* مذكر، لذلك نقول *un billete* وليس *una*.'
    example_gloss: أودّ تذكرة إلى طليطلة.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: طلب تذكرة
    gloss: أودّ تذكرة إلى طليطلة.
    note: تخفف *Quisiera* ("أودّ") الطلب وهي أكثر تهذيبًا من *quiero*.
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: الموظف يسأل عن النوع
    gloss: هل تريد تذكرة ذهاب فقط أم ذهاب وعودة؟
    note: '*Quiere* هي صيغة الاحترام *usted* من الفعل *querer*، وتُستعمل هنا مع موظف محطة لا تعرفه.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: الإجابة بلباقة
    gloss: ذهاب وعودة، من فضلك.
    note: '*Por favor* تعني "من فضلك"؛ فيبقى الطلب مهذبًا وقصيرًا.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: مستوى الكلام عند الشباك
    gloss: عند الشباك، تُستعمل عادةً صيغة الاحترام usted.
    note: يُخاطَب الغرباء الذين يؤدون خدمة بـ *usted* وليس *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: الرصيف
    gloss: الرصيف
    note: 'كلمة *andén* مذكّرة: *un andén*، *el andén*.'
    example_gloss: من أي رصيف يغادر القطار المتجه إلى طليطلة؟
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: السؤال عن الرصيف
    gloss: من أي رصيف يغادر القطار المتجه إلى طليطلة؟
    note: يسأل التعبير *¿De qué andén ...?* عن الرصيف تحديدًا، لا عن مكان عام.
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: ذكر تفاصيل المغادرة
    gloss: يغادر القطار في العاشرة إلا ربعًا من الرصيف الخامس.
    note: يستعيد التعبير *Las diez menos cuarto* نمط «إلا ربع» الذي تعلّمناه في درس الوقت.
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: السؤال عن وقت الوصول
    gloss: في أي ساعة يصل القطار؟
    note: يُستعمل *¿A qué hora llega ...?* للسؤال عن وقت الوصول؛ والفعل *llegar* منتظم ويأتي بعده *a las* قبل الساعة.
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: ذكر وقت الوصول
    gloss: يصل القطار في الساعة الحادية عشرة.
    note: في *Llega a las once* نستعمل الفعل *llegar* (وصل) مع *a las* قبل الساعة.
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: في الوقت المحدد / التأخير
    gloss: في الوقت المحدد؛ التأخير
    note: '*A tiempo* تعبير ثابت لما يحدث في موعده. وكلمة *el retraso* (التأخير) مذكّرة.'
    example_gloss:
    - لا يغادر القطار في الوقت المحدد.
    - 'انتباه: القطار المتجه إلى طليطلة متأخر.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: إعلان
    gloss: 'انتباه: القطار المتجه إلى طليطلة متأخر.'
    note: تُستعمل كلمة *Atención* في بداية إعلانات المحطة، كما نقول في العربية «انتباه، أيها الركاب».
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: نفي الالتزام بالوقت
    gloss: لا يغادر القطار في الوقت المحدد.
    note: 'تأتي *No* مباشرة قبل الفعل وتنفي الجملة كلها: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: تغيير الرصيف
    gloss: يغادر القطار من الرصيف الثالث بدلًا من الرصيف الخامس.
    note: معنى *En lugar de* هو «بدلًا من».
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: ذكر مدة التأخير
    gloss: القطار متأخر عشر دقائق.
    note: '*Lleva retraso* (حرفيًا «يحمل تأخيرًا») هي الطريقة الطبيعية للقول إن شيئًا ما متأخر.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: المدخل والمخرج وقاعة الانتظار
    gloss: المدخل؛ المخرج؛ قاعة الانتظار
    note: '*La entrada* و*la salida* و*la sala de espera* كلها أسماء مؤنثة.'
    example_gloss:
    - أين المدخل؟
    - أين المخرج؟
    - أين قاعة الانتظار؟
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: السؤال عن مكان الرصيف
    gloss: أين الرصيف السابع؟
    note: يعيد هذا استعمال نمط *¿Dónde está ...?* من دروس الاتجاهات.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: إعطاء الاتجاهات
    gloss: استمر مباشرة ثم انعطف يمينًا.
    note: '*Todo recto* و*a la derecha* عبارتا اتجاه من دروس الاتجاهات، نعيد استعمالهما هنا في المحطة.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: السؤال عن قاعة الانتظار
    gloss: أين قاعة الانتظار؟
    note: نمط السؤال نفسه مطبّق على مكان جديد.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: قراءة تذكرة مطبوعة
    gloss: 'تذكرة: من مدريد أتوتشا إلى طليطلة. المغادرة: العاشرة وعشر دقائق، الرصيف السابع. الوصول: الحادية عشرة إلا عشر دقائق. ذهاب وإياب. السعر: اثنا عشر يورو وأربعون سنتًا.'
    note: انتبه إلى وقت المغادرة والرصيف، ووقت الوصول، ونوع التذكرة، والسعر.
    glosses:
      Billete: تذكرة
      Salida: مغادرة
      diez: عشرة
      andén: رصيف
      siete: سبعة
      Llegada: وصول
      once: أحد عشر
      vuelta: تذكرة ذهاب وإياب
      Precio: سعر
      doce: اثنا عشر
      euros: يورو
      cuarenta: أربعون
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: ماتيو يذكر الخطة
    gloss: 'ماتيو: يجب أن نذهب إلى الرصيف السابع. يغادر القطار في العاشرة وعشر دقائق.'
    note: يعبّر *Tenemos que* + المصدر ("يجب علينا") عن ضرورة عملية.
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: إيلينا تقرأ اللوحة
    gloss: 'إيلينا: انظر، هذه هي اللوحة: تأخير، عشر دقائق.'
    note: يشير *Ahí está* («ها هي هناك») إلى اللوحة؛ و*el panel* هو لوحة المعلومات.
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: ماتيو يحافظ على هدوئه
    gloss: 'ماتيو: لا مشكلة، ما زال لدينا وقت لقهوة.'
    note: '*No hay problema* عبارة شائعة وعفوية للطمأنة.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: يصل القطار
    gloss: 'إيلينا: فكرة جيدة. آه، ها هو القطار قد وصل! الرصيف السابع تمامًا!'
    note: تدل *Ya* («بالفعل / قد») على أن القطار وصل أبكر مما كان متوقعًا بعد التأخير المعلن.
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: يصعدون إلى القطار
    gloss: 'ماتيو: هيا، الجميع يصعدون! طليطلة، ها نحن قادمون!'
    note: '*Suben* («يصعدون») من الفعل *subir* أي صعد إلى وسيلة النقل؛ و*¡Allá vamos!* طريقة طبيعية للقول «ها نحن ذاهبون».'
