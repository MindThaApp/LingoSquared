course:
  title: الإسبانية A1
  description: طلب الاتجاهات الأساسية واتباعها، مع متابعة قصة إيلينا وماتيو حيث ترشد إيلينا ماتيو إلى المكتبة من الوحدة 8. وتوضح الوحدة أن doblar وgirar صيغتان إقليميتان متبادلتان وليستا مختلفتين في المعنى.
