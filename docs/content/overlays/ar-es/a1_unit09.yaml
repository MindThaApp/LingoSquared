    example_gloss: البنك على الزاوية.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: اذهب مباشرة
    gloss: اذهب مباشرة.
    note: '*Sigue* هي صيغة الأمر للمفرد المخاطب (tú) من الفعل *seguir* (تابع/واصل)، وتتكرر في إرشادات هذه الوحدة.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: انعطف يسارًا
    gloss: انعطف يسارًا.
    note: '*Dobla* هي صيغة الأمر للمفرد المخاطب (tú) من الفعل *doblar* (انعطف). انظر ملاحظة القواعد التالية حول *doblar* و*girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: انعطف يمينًا
    gloss: انعطف يمينًا.
    note: '*Gira* هي صيغة الأمر للمفرد المخاطب (tú) من الفعل *girar* (انعطف/استدر)، ويمكن استخدامها بدل *doblar* دون أي فرق.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: اعبر الشارع
    gloss: اعبر الشارع.
    note: '*Cruza* هي صيغة الأمر للمفرد المخاطب (tú) من الفعل *cruzar* (عبر).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar مقابل girar
    gloss: كلمتان طبيعيتان بالقدر نفسه بمعنى «انعطف».
    note: انظر نص البطاقة نفسها.
    target_text: '*Doblar* و*girar* تعنيان «يدور/ينعطف» وتتبادلان الاستعمال هنا تمامًا؛ فالفرق إقليمي في التفضيل، لا في المستوى اللغوي ولا في المعنى. وتُستعملان معًا في هذه الوحدة.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: اسأل عن طريق الوصول إلى مكان
    gloss: كيف أصل إلى المكتبة؟
    note: '*Cómo llego a* (كيف أصل إلى) هي الطريقة المعتادة للسؤال عن الطريق إلى مكان محدد.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: قل إن الأمر سهل
    gloss: الأمر سهل.
    note: عبارة شائعة تبعث على الطمأنينة، تُقال قبل شرح الطريق.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: اذهب مباشرة في هذا الشارع
    gloss: اذهب مباشرة في هذا الشارع.
    note: '*Por esta calle* (في هذا الشارع) تحدد الشارع الذي تسير فيه.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: انعطف يسارًا عند الزاوية
    gloss: انعطف يسارًا عند الزاوية.
    note: '*En la esquina* (عند الزاوية) تحدد مكان الانعطاف.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: اطلب التأكيد
    gloss: هل هذا صحيح؟
    note: '*¿Está bien así?* (هل هذا صحيح هكذا؟) سؤال للتأكد من الفهم بعد إعادة الإرشادات، وهو الخطوة الطبيعية التالية بعد معرفة الطريق.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: أكّد
    gloss: نعم، هذا صحيح.
    note: '*Así es* (هكذا هو الأمر) عبارة تأكيد قصيرة وطبيعية.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: لا تضل الطريق
    gloss: لا تضل الطريق!
    note: '*No te pierdas* هي صيغة النهي للمفرد المخاطب (tú) من الفعل *perderse* (ضلّ الطريق)، وهي وداع دافئ وعفوي.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: قراءة إرشادات مكتوبة
    gloss: 'للوصول إلى المكتبة من السوق: اذهب مباشرة في هذا الشارع. انعطف يسارًا عند الزاوية. بعد ذلك، اعبر الشارع. المكتبة على اليمين.'
    note: 'تعرض الإرشادات المكتوبة الخطوات بالترتيب: *Para llegar a...* (للوصول إلى...) تذكر الوجهة، ثم تأتي كل خطوة بصيغة الأمر للمفرد المخاطب *tú* (*sigue* و*dobla* و*cruza*)، وتربط *después* (بعد ذلك) بين الخطوات.'
    glosses:
      llegar: يصل
      biblioteca: مكتبة
      desde: من
      mercado: سوق
      sigue: تابع / اذهب (من seguir)
      derecho: مباشرة
      calle: شارع
      Dobla: انعطف (من doblar)
      izquierda: يسار
      esquina: زاوية
      Después: بعد ذلك
      cruza: اعبر (من cruzar)
      está: يقع (من estar)
      derecha: يمين
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (من)
    gloss: كيف تحدد desde نقطة بداية الطريق.
    note: انظر نص البطاقة نفسها.
    target_text: 'تحدد *Desde* (من) نقطة بداية الطريق، وتقترن بـ *a* (إلى) للوجهة: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: اسأل عن الطريق
    gloss: ماتيو يسأل إيلينا كيف يصل إلى المكتبة من السوق.
    note: 'هو السؤال نفسه *¿Cómo llego a...?* الذي مرّ سابقًا في هذه الوحدة، لكن مع نقطة بداية: *desde el mercado* (من السوق).'
  es.a1.unit09.lesson06.teach.line02:
    title: اذكر الخطوة الأولى
    gloss: إيلينا تقول إن الأمر سهل وتذكر الإرشاد الأول.
    note: '*Es fácil* (الأمر سهل) تبعث الطمأنينة قبل ذكر الخطوة الأولى.'
  es.a1.unit09.lesson06.teach.line03:
    title: أعد الكلام واطلب المزيد
    gloss: ماتيو يكرر الإرشاد ويسأل عمّا يأتي بعده.
    note: '*Sigo derecho* (أسير مباشرة) هي صيغة المتكلم (yo) من *seguir*، ويؤكد بها ماتيو أنه يتابع الشرح.'
  es.a1.unit09.lesson06.teach.line04:
    title: اذكر الخطوة الثانية
    gloss: إيلينا تطلب منه الانعطاف يسارًا عند الزاوية.
    note: '*Dobla* (انعطف) — وكانت *gira* ستؤدي المعنى نفسه هنا.'
  es.a1.unit09.lesson06.teach.line05:
    title: أعد الكلام وتأكد
    gloss: ماتيو يكرر الانعطاف ويسأل إن كان صحيحًا.
    note: '*Doblo* (أنعطف) تماثل *Sigo derecho* السابقة، فماتيو يعيد كل خطوة بصيغة المتكلم *yo* ليتأكد منها.'
  es.a1.unit09.lesson06.teach.line06:
    title: أكّد واذكر الخطوات الأخيرة
    gloss: إيلينا تؤكد، ثم تطلب منه عبور الشارع، وستكون المكتبة على اليمين.
    note: '*Sí, así es* (نعم، هذا صحيح) تؤكد، ثم تقدّم *después* (بعد ذلك) الخطوات الأخيرة من الطريق.'
  es.a1.unit09.lesson06.teach.line07:
    title: اشكر إيلينا
    gloss: ماتيو يشكر إيلينا بحرارة.
    note: '*Muchas gracias* (شكرًا جزيلًا) صيغة أدفأ من *gracias* وحدها.'
  es.a1.unit09.lesson06.teach.line08:
    title: ردّ وودّع
    gloss: إيلينا تقول له «عفوًا» وتطلب منه ألا يضل الطريق.
    note: '*De nada* (عفوًا) هي الردّ المعتاد على *gracias*.'
