course:
  title: الإسبانية A1
  description: مفردات العائلة القريبة والممتدة، وصفات الملكية، ووصف الأسرة، مع متابعة قصة ورشة الطبخ لإيلينا وماتيو من الوحدتين 01-02. ويركّز المقرر على صيغ الملكية (mi/tu/su) وأسماء العائلة التي تتغير بحسب الجنس.
