teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: الأم
    gloss: أم
    note: '*Madre* مؤنثة. أما *mamá* فهي الكلمة الأكثر شيوعًا في الاستعمال اليومي داخل العائلة، بينما *madre* كلمة محايدة تُستخدم في قوائم مفردات هذه الدورة.'
  es.a1.unit03.lesson01.teach.padre:
    title: الأب
    gloss: أب
    note: '*Padre* مذكر. و*papá* هي الكلمة اليومية المقابلة، على غرار *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: الأخ
    gloss: أخ
    note: '*Hermano* مذكر مفرد.'
  es.a1.unit03.lesson01.teach.hermana:
    title: الأخت
    gloss: أخت
    note: '*Hermana* مؤنث مفرد.'
  es.a1.unit03.lesson01.teach.hijo:
    title: الابن
    gloss: ابن
    note: '*Hijo* مذكر مفرد.'
  es.a1.unit03.lesson01.teach.hija:
    title: الابنة
    gloss: ابنة
    note: '*Hija* مؤنث مفرد.'
  es.a1.unit03.lesson01.teach.padres:
    title: الوالدان
    gloss: الوالدان
    note: يدل *Padres* (جمع مذكر) على الأب والأم معًا، وهي القاعدة نفسها التي تتبعها الإسبانية كلما ضمّت المجموعة فردًا مذكرًا واحدًا على الأقل.
  es.a1.unit03.lesson01.teach.hermanos:
    title: الإخوة
    gloss: الإخوة؛ الأشقاء الذكور
    note: قد تعني *Hermanos* «الإخوة الذكور» فقط أو «الإخوة والأخوات» معًا في مجموعة مختلطة، وفق قاعدة الجمع المذكر الشامل للمجموعات المختلطة نفسها كما في *padres*.
  es.a1.unit03.lesson02.teach.mi_familia:
    title: عائلتي
    gloss: عائلتي
    note: '*Mi* (دون علامة) هي صفة الملكية «ـي»؛ ولا تتغير بحسب الجنس، بل بحسب العدد فقط (*mis* مع الأسماء الجمع).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: عائلتك (غير رسمي)
    gloss: عائلتك
    note: '*Tu* (دون علامة، بخلاف الضمير *tú*) هي صفة الملكية غير الرسمية، وتناسب مستوى الخطاب *tú* الذي تعلمناه في الوحدة 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: عائلتك أو عائلته أو عائلتها (رسمي أو غائب)
    gloss: عائلته / عائلتها / عائلتك
    note: تشمل *Su* معنى «ـه» و«ـها» و«ـك» في الخطاب الرسمي (*usted*)؛ فالإسبانية لا تميّز بينها بصفة الملكية وحدها، والسياق يوضح المعنى.
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: السؤال عن الإخوة
    gloss: هل لديك إخوة؟
    note: '*Tienes* هي صيغة *tú* من الفعل *tener*، وهو الفعل نفسه المستخدم للتعبير عن العمر في الوحدة 2.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: ذكر عدد الإخوة
    gloss: لديّ أختان.
    note: '*Tengo* (لديّ) مع عدد واسم من أسماء العائلة هي الطريقة المعتادة للحديث عن الإخوة.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: السؤال عن كِبَر العائلة
    gloss: هل عائلتك كبيرة؟
    note: '*Grande* (كبير) لا تتغير بحسب الجنس، بل بحسب العدد فقط (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: وصف عائلة صغيرة
    gloss: عائلتي صغيرة.
    note: تتوافق *Pequeña* مع الاسم المؤنث *familia*؛ أما الصيغة المذكرة *pequeño* فتأتي مع اسم مذكر.
  es.a1.unit03.lesson03.teach.abuelo:
    title: الجد
    gloss: جد
    note: '*Abuelo* مذكر مفرد.'
  es.a1.unit03.lesson03.teach.abuela:
    title: الجدة
    gloss: جدة
    note: الكلمة *Abuela* مؤنثة مفردة.
  es.a1.unit03.lesson03.teach.abuelos:
    title: الأجداد
    gloss: الأجداد (الجدّ والجدّة)
    note: تشمل الكلمة *Abuelos* (مذكر جمع) الجدّ والجدّة معًا، وهو النمط نفسه في *padres* و*hermanos*.
  es.a1.unit03.lesson03.teach.tio:
    title: العم / الخال
    gloss: عم / خال
    note: تحمل الكلمة *Tío* علامة الإملاء (الأكسنت) لأن النبر يقع على الحرف *í*، فلا يُقرأ الحرفان معًا كحرفَي علة متتاليين في مقطع واحد.
  es.a1.unit03.lesson03.teach.tia:
    title: العمة / الخالة
    gloss: عمة / خالة
    note: تحمل الكلمة *Tía* علامة الإملاء نفسها التي في *tío* ولسبب النبر نفسه.
  es.a1.unit03.lesson03.teach.primo:
    title: ابن العم / ابن الخال
    gloss: ابن عم / ابن خال
    note: الكلمة *Primo* مذكر مفرد. وفي الإسبانية يُحدَّد جنس قريبك من الدرجة الثالثة بالكلمة نفسها، كما في العربية حيث نفرّق بين «ابن العم» و«بنت العم».
  es.a1.unit03.lesson03.teach.prima:
    title: بنت العم / بنت الخال
    gloss: بنت عم / بنت خال
    note: الكلمة *Prima* مؤنثة مفردة.
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: أجدادي
    gloss: أجدادي
    note: الكلمة *Mis* هي صيغة الجمع من *mi*، وتُستعمل كلما كان الاسم الذي تصفه جمعًا، بغضّ النظر عن جنسه.
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: السؤال عن عدد الإخوة
    gloss: كم أخًا وأختًا لديك؟
    note: الكلمة *Cuántos* (مذكر جمع، لأن *hermanos* تشمل الإخوة والأخوات معًا) تتفق مع الاسم الذي يُسأل عنه.
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: ذكر عدد أفراد الأسرة
    gloss: نحن خمسة في البيت.
    note: الكلمة *Somos* (نحن) هي الطريقة الطبيعية في الإسبانية لذكر عدد أفراد الأسرة، فهي تعني حرفيًا «نحن». ولا تُترجم هنا كلمة بكلمة.
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: وصف أسرة كبيرة
    gloss: أسرتي كبيرة.
    note: تصف كلمة *grande* هنا الاسم *familia* (مؤنث)، وتبقى بالصيغة نفسها *grande* التي تأتي مع الأسماء المذكرة، لأن الصفات المنتهية بـ e- مثل *grande* لا تتغير بحسب الجنس.
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: ذكر أن لديك أبناء عم كثيرين
    gloss: لدي أبناء عم كثيرون.
    note: تُستعمل *Muchos* (مذكر جمع) لأن *primos*، مثل *hermanos* و*padres*، قد تشمل الذكور والإناث معًا.
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: السؤال عن السكن قرب الوالدين
    gloss: هل تسكن قرب والديك؟
    note: الكلمة *Tus* هي صيغة الجمع من *tu*، وتلزم لأن *padres* جمع.
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: ذكر من تعيش معه
    gloss: أعيش مع أجدادي.
    note: تقدّم *Con* (مع) الأشخاص الذين يعيش معهم المرء؛ و*vivo* هي صيغة *yo* من *vivir*، وقد مرّت في *vivo en Londres* في الوحدة 1.
  es.a1.unit03.lesson05.teach.profile_reading:
    title: التعريف بأسرة إيلينا
    gloss: 'اسمي إيلينا. عمري واحد وثلاثون عامًا وأعيش مع أجدادي في إسبانيا. أمي وأبي يعيشان في برشلونة. لدي أخت وأخ: نحن خمسة في البيت. اسم أختي الصغرى صوفيا وعمرها عشرون عامًا.'
    note: يعيد هذا التعريف استعمال مفردات وتراكيب من الدروس 1–4 في نص قصير متصل بدل جمل منفصلة، وهي مهارة قراءة «من هو من» نفسها التي يركّز عليها تقييم القراءة في هذه الوحدة.
    glosses:
      llamo: اسمي (من llamarse)
      Tengo: عمري / لدي (من tener)
      treinta: ثلاثون
      años: عامًا (من العمر)
      vivo: يعيشون (من vivir)
      abuelos: الأجداد
      madre: أم
      padre: أب
      viven: يعيشون (من vivir)
      hermana: أخت
      hermano: أخ
      somos: نحن (من ser)
      cinco: خمسة
      casa: بيت
      menor: أصغر
      tiene: عمرها / لديها (من tener)
      veinte: عشرون
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: الأخت الصغرى
    gloss: أختي الصغرى
    note: تأتي *Menor* (أصغر) بعد الاسم الذي تصفه، ولا تتغير صيغتها بتغير الجنس.
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: يعيش (الغائب)
    gloss: يعيش
    note: الكلمة *Vive* هي صيغة الغائب المفرد من *vivir*، وتُستعمل للحديث عن شخص آخر (*Elena vive*...) لا عن النفس (*vivo*، التي مرّت في الدرس 4 من الوحدة 1 وفي الدرس 4 من هذه الوحدة).
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: له / لها / لهم (مع اسم جمع)
    gloss: له / لها / لهم
    note: '*Sus* هي صيغة الجمع من *su*، وكما يدل *su* على «له» أو «لها» أو «لك» (في صيغة الاحترام) مع اسم مفرد، فإن *sus abuelos* تعني «أجدادها» عند الحديث عن إيلينا بصيغة الغائب.'
  es.a1.unit03.lesson06.teach.line01:
    title: عرض صور العائلة
    gloss: تُري إيلينا ماتيو صورة وتقدّم له والديها وأختها الصغرى.
    note: تقدّم *Estos son* (هؤلاء، مذكر/مختلط جمع) الوالدين؛ وتقدّم *esta es* (هذه، مؤنث مفرد) الأخت.
  es.a1.unit03.lesson06.teach.line02:
    title: التعليق على الصورة والسؤال عن الإخوة
    gloss: يبدي ماتيو إعجابه ويسأل إن كان لديها إخوة آخرون.
    note: العبارة *Qué bonito* ردّ فعل لطيف وطبيعي عند رؤية صورة، وتؤدي وظيفة قريبة من *Qué bien* في الوحدة 1.
  es.a1.unit03.lesson06.teach.line03:
    title: ذكر عدد أفراد الأسرة وردّ السؤال
    gloss: تقول إيلينا إن لديها أختًا وأخًا، وإنهم خمسة في البيت، ثم تسأل عن أسرة ماتيو.
    note: تذكر *Somos cinco en casa* العدد الكلي لأفراد الأسرة، تتمةً لنمط الدرس 4.
  es.a1.unit03.lesson06.teach.line04:
    title: وصف أسرة أصغر
    gloss: 'يقول ماتيو إن أسرته أصغر، فهم ثلاثة فقط: والداه وهو، لكن لديه أبناء عم كثيرين.'
    note: تشير *Pero* (لكن) إلى التباين بين أسرة صغيرة وأقارب كثيرين.
  es.a1.unit03.lesson06.teach.line05:
    title: السؤال عن القرب من الوالدين
    gloss: تسأل إيلينا ماتيو إن كان يسكن قرب والديه.
    note: العبارة *Cerca de* (قرب) طريقة شائعة لوصف القرب المكاني.
  es.a1.unit03.lesson06.teach.line06:
    title: شرح البعد والبقاء على تواصل
    gloss: يقول ماتيو لا، إنهما يعيشان في كولومبيا، ويتحدثون بالهاتف كل أسبوع.
    note: تتابع هذه الجملة ما ورد في الوحدة 1 من أن ماتيو من كولومبيا لكنه يعيش في لندن، وأن والديه ما زالا في كولومبيا.
  es.a1.unit03.lesson06.teach.line07:
    title: إبداء التفهّم وذكر وضعك
    gloss: تقول إيلينا إنها تتفهّم، وإنها تعيش مع أجدادها هنا في إسبانيا.
    note: الكلمة *Entiendo* (أفهم) طريقة موجزة وطبيعية للتجاوب مع ما قاله الآخر قبل إضافة تفصيل من حياتك.
  es.a1.unit03.lesson06.teach.line08:
    title: الختام بعبارة دافئة
    gloss: يقول ماتيو إنه من الجميل أن تكون العائلة قريبة.
    note: تختم *Qué bien tener a la familia cerca* الحوار بنبرة دافئة متأملة، وتردّد نمط *qué bien* / *qué bonito* المستعمل في هذا الحوار.
