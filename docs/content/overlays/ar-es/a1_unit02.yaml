    title: الأعداد من صفر إلى عشرة
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: من أحد عشر إلى مئة
  es.a1.unit02.lesson03.asking_age:
    title: السؤال عن عمر شخص
  es.a1.unit02.lesson04.phone_numbers:
    title: أرقام الهواتف
  es.a1.unit02.lesson05.recipe_quantities:
    title: مقادير الوصفات
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: عدّ المكوّنات مع إيلينا وماتيو
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: صفر
    gloss: صفر
    note: تُستخدم *Cero* عددًا وكذلك رقمًا عند قراءة سلسلة أرقام بصوت عالٍ.
  es.a1.unit02.lesson01.teach.uno:
    title: واحد
    gloss: واحد
    note: تتحول *Uno* إلى *un* قبل اسم مذكر مفرد (*un huevo*، بيضة واحدة) وإلى *una* قبل اسم مؤنث (*una taza*، كوب واحد). وعند العدّ وحدها تبقى *uno*.
  es.a1.unit02.lesson01.teach.dos:
    title: اثنان
    gloss: اثنان
    note: لا تتغير *Dos* مهما كان جنس الاسم.
  es.a1.unit02.lesson01.teach.tres:
    title: ثلاثة
    gloss: ثلاثة
    note: '*Tres* مثل *dos* لا تتغير.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: أربعة
    gloss: أربعة
    note: لا تتغير *Cuatro*.
  es.a1.unit02.lesson01.teach.cinco:
    title: خمسة
    gloss: خمسة
    note: لا تتغير *Cinco*.
  es.a1.unit02.lesson01.teach.seis:
    title: ستة
    gloss: ستة
    note: لا تتغير *Seis*.
  es.a1.unit02.lesson01.teach.siete:
    title: سبعة
    gloss: سبعة
    note: لا تتغير *Siete*.
  es.a1.unit02.lesson01.teach.ocho:
    title: ثمانية
    gloss: ثمانية
    note: لا تتغير *Ocho*.
  es.a1.unit02.lesson01.teach.nueve:
    title: تسعة
    gloss: تسعة
    note: لا تتغير *Nueve*.
  es.a1.unit02.lesson01.teach.diez:
    title: عشرة
    gloss: عشرة
    note: لا تتغير *Diez*.
  es.a1.unit02.lesson02.teach.once:
    title: أحد عشر
    gloss: أحد عشر
    note: الأعداد من *Once* إلى *quince* (11-15) كلمات مفردة تُحفظ مجموعةً واحدة؛ ومن ستة عشر إلى تسعة عشر تُبنى الأعداد انطلاقًا من *diez* (*dieciséis*، *diecisiete*...).
  es.a1.unit02.lesson02.teach.doce:
    title: اثنا عشر
    gloss: اثنا عشر
    note: '*Doce* كلمة واحدة؛ تشبه *dos* لكن لها صيغتها الإملائية الخاصة.'
  es.a1.unit02.lesson02.teach.trece:
    title: ثلاثة عشر
    gloss: ثلاثة عشر
    note: '*Trece* كلمة واحدة؛ تشبه *tres* لكن لها صيغتها الإملائية الخاصة.'
  es.a1.unit02.lesson02.teach.catorce:
    title: أربعة عشر
    gloss: أربعة عشر
    note: '*Catorce* كلمة واحدة؛ تشبه *cuatro* لكن لها صيغتها الإملائية الخاصة.'
  es.a1.unit02.lesson02.teach.quince:
    title: خمسة عشر
    gloss: خمسة عشر
    note: '*Quince* آخر الأعداد المندمجة قبل أن يتغير النمط عند ستة عشر.'
  es.a1.unit02.lesson02.teach.veinte:
    title: عشرون
    gloss: عشرون
    note: '*Veinte* كلمة قائمة بذاتها. ومن *veintiuno* (21) فصاعدًا تندمج العشرات والآحاد في كلمة واحدة مكتوبة حتى التاسع والعشرين، وهو نمط يظهر مجددًا مع *veintiocho* في الدرس 3.'
  es.a1.unit02.lesson02.teach.treinta:
    title: ثلاثون
    gloss: ثلاثون
    note: ابتداءً من الثلاثين تُربط العشرات بالآحاد بـ *y* (و) في ثلاث كلمات منفصلة بدلًا من الاندماج، بخلاف العشرينات.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: أربعة وثلاثون
    gloss: أربعة وثلاثون
    note: 'تُكتب *Treinta y cuatro* في ثلاث كلمات منفصلة: العشرة، ثم *y*، ثم الآحاد.'
  es.a1.unit02.lesson02.teach.cien:
    title: مئة
    gloss: مئة
    note: '*Cien* هي الصيغة المستخدمة للعدد 100 تمامًا حين يأتي وحده؛ أما *ciento* فتظهر عندما يستمر العدد بعده (*ciento uno*، 101)، وهذا لم تتناوله هذه الوحدة بعد.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: السؤال عن العمر بصيغة غير رسمية
    gloss: كم عمرك؟
    note: تسأل الإسبانية عن العمر بصيغة «كم سنة لديك؟» باستخدام الفعل *tener* (يملك)، لا بصيغة من الفعلين *ser* أو *estar*.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: ذكر عمرك
    gloss: عمري ثمانٍ وعشرون سنة.
    note: '*Tengo* هي صيغة المتكلم yo من *tener*. تتضمن الإجابة الكاملة عادةً *años* (سنوات)؛ وإذا كان العمر هو موضوع الحديث أصلًا جاز حذفها، كما في *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: السؤال عن العمر بصيغة رسمية
    gloss: كم عمرك؟
    note: '*Tiene* هي صيغة *usted* من *tener*، بما يوافق المستوى الرسمي الذي ظهر في الوحدة 1.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: ذكر عمر مركّب
    gloss: عمري واحد وثلاثون عامًا.
    note: تبقى *uno* (وليس *un*) في *Treinta y uno* لأنه لا يأتي اسم مباشرة بعدها في هذا الجواب.
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: إعادة سؤال العمر
    gloss: وأنت، كم عمرك؟
    note: قول *Tienes* دون تكرار *años* اختصار طبيعي وشائع بعد أن يتضح الموضوع.
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: طلب رقم هاتف
    gloss: ما رقم هاتفك؟
    note: يُستعمل *Cuál* وليس *qué* عند طلب عنصر محدد من بين عدة احتمالات، مثل رقم الهاتف.
  es.a1.unit02.lesson04.teach.numero_elena:
    title: رقم يُقرأ رقمًا رقمًا
    gloss: ستة، واحد، خمسة، صفر، اثنان، تسعة، سبعة، ثلاثة
    note: يمكن قراءة رقم الهاتف رقمًا رقمًا كما هنا، كما في العربية. وكثير من متحدثي الإسبانية يجمعون الأرقام في أزواج أيضًا، فانتبه إلى الأسلوبين.
  es.a1.unit02.lesson04.teach.es_el:
    title: تقديم الرقم
    gloss: إنه...
    note: يُستعمل *El* (أداة التعريف المذكرة) لأن *número* اسم مذكر.
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: طلب التكرار
    gloss: هل يمكنك أن تكرر ذلك، من فضلك؟
    note: '*Puedes* هي صيغة *tú* من الفعل *poder* (استطاع)، وهي مفيدة كلما مرّ رقم منطوق بسرعة فلم تلتقطه.'
  es.a1.unit02.lesson04.teach.claro:
    title: الموافقة بسرعة
    gloss: بالطبع؛ طبعًا
    note: '*Claro* طريقة ودية وشائعة للموافقة على طلب.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: ذكر كمية مطلوبة
    gloss: أحتاج إلى ثلاث بيضات.
    note: '*Necesito* هي صيغة المتكلم yo من الفعل *necesitar* (احتاج). وتبقى *huevos* (بيض) بصيغة الجمع بعد أي عدد أكبر من واحد.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: السؤال عن عدد المطلوب
    gloss: كم بيضة تحتاج؟
    note: تتفق *Cuántos* في الجنس والعدد مع الاسم المسؤول عنه؛ و*huevos* مذكر جمع، لذلك تُستعمل *cuántos* وليس *cuántas*.
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: ذكر كمية مقيسة
    gloss: كوبان من الدقيق
    note: 'تربط *De* وحدة القياس (*tazas*، أكواب) بما يُقاس (*harina*، دقيق)، وهي تشبه الإضافة في العربية: «كوبان من الدقيق».'
  es.a1.unit02.lesson05.teach.media_taza:
    title: ذكر نصف كمية
    gloss: نصف كوب من السكر
    note: تتفق *Media* مع الاسم المؤنث *taza*؛ أما الصيغة المذكرة *medio* فتأتي مع الأسماء المذكرة.
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: ذكر ما هو متوفر
    gloss: لدي أربع بيضات على الطاولة.
    note: '*Tengo* (لدي) تخبر بما هو متوفر فعلًا، بخلاف *necesito* (أحتاج) التي تخبر بما ما زال ناقصًا.'
  es.a1.unit02.lesson06.teach.line01:
    title: السؤال عن عدد البيض
    gloss: تسأل إيلينا ماتيو كم بيضة يحتاج للوصفة.
    note: يستمر استعمال صيغة *tú* بين الصديقين كما في الوحدة 1.
  es.a1.unit02.lesson06.teach.line02:
    title: ذكر المكونات
    gloss: يقول ماتيو إنه يحتاج إلى ثلاث بيضات وكوبين من الدقيق.
    note: تذكر *Necesito* ما لا يزال مطلوبًا للوصفة.
  es.a1.unit02.lesson06.teach.line03:
    title: عرض ما هو متوفر
    gloss: تقول إيلينا إن لديها أربع بيضات على الطاولة وتسأل هل يحتاج إلى سكر أيضًا.
    note: تخبر *Tengo* بما لدى إيلينا فعلًا، وهو منفصل عمّا قاله ماتيو إنه يحتاج إليه.
  es.a1.unit02.lesson06.teach.line04:
    title: تأكيد كمية صغيرة
    gloss: يقول ماتيو نعم، قليلًا -- نحو نصف كوب.
    note: تعني *Como* هنا «نحو» أو «تقريبًا»، وليس معناها الأكثر شيوعًا «مثل» أو «كما».
  es.a1.unit02.lesson06.teach.line05:
    title: طلب رقم هاتف
    gloss: تقول إيلينا إن هذا ممتاز، ثم تسأل ماتيو عن رقم هاتفه لتراسله بشأن الحصة القادمة.
    note: توضح *Así te escribo* («كي أراسلك») سبب السؤال، وهي عادة طبيعية في الحديث قبل طلب معلومات الاتصال.
  es.a1.unit02.lesson06.teach.line06:
    title: ذكر رقم الهاتف
    gloss: يقرأ ماتيو رقمه رقمًا رقمًا.
    note: تقدّم *Es el* الرقم، وتتفق مع الاسم المذكر *número*.
  es.a1.unit02.lesson06.teach.line07:
    title: شكره وسؤاله عن عمره
    gloss: 'تشكره إيلينا ثم تسأل سؤالًا آخر: كم عمره.'
    note: تشير *Una pregunta más* («سؤال آخر») إلى انتقال طبيعي في الموضوع داخل المحادثة نفسها.
  es.a1.unit02.lesson06.teach.line08:
    title: ذكر عمره
    gloss: يقول ماتيو إن عمره ثمانية وعشرون عامًا ويسأل إيلينا السؤال نفسه.
    note: تستعمل *Tengo veintiocho años* صيغة العشرينات المدمجة في كلمة واحدة، كما في نمط الدرس الثاني.
  es.a1.unit02.lesson06.teach.line09:
    title: ذكر عمرها
    gloss: تقول إيلينا إن عمرها واحد وثلاثون عامًا.
    note: تحذف *Tengo treinta y uno* كلمة *años* هنا لأن الموضوع (العمر) واضح من السياق -- وهو اختصار طبيعي بعد أن يتضح الموضوع، كما في نمط الدرس الثالث عند إعادة السؤال دون تكرار *años*.
