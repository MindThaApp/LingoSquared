course:
  title: الإسبانية A1
  description: الأعداد من 0 إلى 100، والأعمار، وأرقام الهواتف، ومقادير الوصفات، مع متابعة إيلينا وماتيو في ورشة الطبخ من الوحدة الأولى. وتركّز الإرشادات على التعبير عن العمر بالفعل tener وعلى تطابق الجنس في عبارات المقادير.
units:
