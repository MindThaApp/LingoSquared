    gloss: تتصل إيلينا بماتيو كل يوم. تستخدم هاتفها، لا تطبيقًا. ليس لدى ماتيو حاسوب في البيت، لكنه يستخدم الإنترنت على هاتفه. يبحث دييغو عن النشرة الجوية كل صباح. ثم يخرج للجري. ترسل لوسيا إلى إيلينا رسالة كثيرًا. هل تستخدم أنت أيضًا هاتفك كل يوم؟
