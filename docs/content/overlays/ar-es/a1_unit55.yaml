    gloss: تسافر إيلينا بالقطار إلى العمل كل يوم. ماتيو عادةً يذهب بالدراجة، لكنه عندما تمطر يستقل القطار أيضًا. يفضّل دييغو قيادة السيارة. تسكن لوسيا قريبًا وتمشي إلى العمل. وأنت، كيف تسافر إلى عملك؟
