answer_policy:
  decline_pattern: This unit's decline pattern ("माफ़ करना, मैं व्यस्त हूँ। मुझे काम है।") deliberately avoids a new modal "can" construction, reusing already-established copula (हूँ) and dative-possession (मुझे...है) grammar instead. Accept the reason sentence with or without "मुझे काम है" attached -- both a bare "माफ़ करना, मैं व्यस्त हूँ।" and the fuller form with the reason are equally natural, complete declines.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized forms used anywhere in this unit are हूँ and हैं, both reused unchanged from their already-settled 1단원/unit10 spellings. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to propose, accept, decline, or schedule their own plan, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 힌디어 A1
units:
  hi.a1.unit11.plans:
    title: 계획 세우기
lessons:
  hi.a1.unit11.lesson01.prastaav_aur_sweekriti:
    title: 영화 보기, 차 마시기
  hi.a1.unit11.lesson02.hum_kab_milte_hain:
    title: 우리 언제 만나요?
  hi.a1.unit11.lesson03.priya_arjun_yojana:
    title: '프리야와 아르준: 약속 잡기'
teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: '복습: 차, 커피'
    gloss: 차, 커피
    note: 6단원에서 배운 음료 단어를 간단히 복습해요. 이번 단원에서는 이 단어들로 함께 할 일을 제안해요.
    example_gloss:
    - 차를 마시고 싶어요.
    - 커피를 마시고 싶어요.
  hi.a1.unit11.lesson01.teach.filma:
    title: 영화
    gloss: 영화
    note: 이번 단원의 주제인 약속 잡기에 쓰는 새 명사예요.
    example_gloss: 이 영화는 좋아요.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: (우리는) 봐요 / 보자
    gloss: (우리는) 봐요 / 보자
    note: '''dekhna''(보다)의 습관·복수형으로, 여기서는 함께 할 일을 제안할 때 써요.'
    example_gloss: 우리는 영화를 봐요.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: 영화 보자!
    gloss: 영화 보자!
    note: '''Chalo'' + 습관·복수형 동사는 함께 무언가를 하자고 제안하는 일상적인 표현이에요. 1, 6, 7단원에서 이미 자연스럽게 나왔고(''chalo shuru karte hain'', ''chalo, kuch khaate hain'', ''chalo, kuch khareedte hain''), 이번 단원에서 이 패턴을 정리하고 넓혀요.'
  hi.a1.unit11.lesson01.teach.saath:
    title: 함께
    gloss: 함께
    note: 어떤 활동을 함께 하자고 제안할 때 써요.
    example_gloss: 같이 영화 보자!
  hi.a1.unit11.lesson01.teach.peena:
    title: (우리는) 마셔요 / 마시자
    gloss: (우리는) 마셔요 / 마시자
    note: '''peena''(마시다)의 습관·복수형으로, ''dekhte hain''과 같은 패턴이에요.'
    example_gloss: 우리는 차를 마셔요.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: 같이 차 마시자!
    gloss: 같이 차 마시자!
    note: 이번 과의 'saath'와 'peete hain'을 합쳐, 영화 제안과 같은 'chalo' 패턴으로 두 번째 제안을 만들어요.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + 동사-te + hain = ~하자
    gloss: '함께 무언가를 하자고 제안할 때는 ''chalo'' + 동사-te + hain이라고 해요: 영화 보자! 같이 차 마시자!'
    note: 앞선 단원들에서 세 번 자연스럽게 나온 패턴 전체를 분명하게 정리해요.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: 좋은 생각이에요!
    gloss: 좋은 생각이에요!
    note: 제안을 반갑게 받아들일 때 바로 쓸 수 있는 표현이에요.
  hi.a1.unit11.lesson02.teach.vyast:
    title: 바쁜
    gloss: 바쁜
    note: 새 형용사로, 이미 배운 계사(hoon/ho/hai)와 함께 시간이 안 된다는 뜻을 나타내요.
    example_gloss: 저는 오늘 바빠요.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: 미안해요 / 실례합니다
    gloss: 미안해요 / 실례합니다
    note: 거절을 부드럽게 만들 때 쓰는 정해진 공손한 표현이에요.
    example_gloss: 미안해요, 저는 바빠요.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: 미안해요, 저는 바빠요.
    gloss: 미안해요, 저는 바빠요.
    note: 이번 과의 두 가지 새 표현을 합친 기본 거절 문장이에요.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: 저는 할 일이 있어요.
    gloss: 저는 할 일이 있어요.
    note: 앞에서 배운 'mujhe...chahiye'(~이 필요해요/원해요)처럼 'mujhe...hai'(저에게 ~이 있어요) 패턴을 써서, 여기서는 거절하는 이유를 말해요.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: 공손하게 거절하는 방법
    gloss: '약속을 공손하게 거절할 때는 ''maaf karna''(미안해요) 뒤에 자신의 상황(예: ''저는 바빠요'')이나 이유(예: ''저는 할 일이 있어요'')를 말해요.'
    note: '''할 수 있다''를 나타내는 새 구문을 도입하지 않고, 이미 배운 문법(계사와 여격 소유 패턴)을 일부러 다시 써요.'
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: 우리
    gloss: 우리
    note: '이 과정에서 처음으로 정식으로 배우는 1인칭 복수 대명사예요. 습관 현재 동사 형태(-te + hain)는 ve(그들)에서 이미 배운 것과 같아서, 새 활용 없이 대명사만 새로 배우는 거예요. (Tum도 -te를 쓰지만 ''ho''와 함께 써요: tum milte ho.)'
    example_gloss: 우리는 매일 만나요.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: 우리 언제 만나요?
    gloss: 우리 언제 만나요?
    note: '''hum''에 ''kab''(10단원)와 ''milte hain''(1단원의 작별 인사에서부터 써 왔고, 주어는 대개 생략됐어요)을 합친 문장이에요.'
  hi.a1.unit11.lesson02.teach.din_review:
    title: '복습: 토요일, 일요일'
    gloss: 토요일, 일요일
    note: 3단원에서 배운 요일 이름 두 개를 간단히 복습해요. 약속을 잡을 때 필요해요.
    example_gloss:
    - 오늘은 토요일이에요.
    - 내일은 일요일이에요.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: '복습: 4시, 몇 시'
    gloss: 4시, 몇 시
    note: 4단원에서 배운 시간 표현을 간단히 복습해요. 약속을 잡을 때 필요해요.
    example_gloss:
    - 지금 4시예요.
    - 지금 몇 시예요?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: 일요일 괜찮아요?
    gloss: 일요일 괜찮아요?
    note: '''kya''를 예/아니요 질문을 만드는 표지로 다시 사용해요. 1단원부터 이미 나왔던 쓰임이에요(''kya yeh tumhari pahli baar hai?'', ''kya tum yoga karti ho?''). ''무슨 요일''을 묻는 새로운 의문사가 아니에요.'
  hi.a1.unit11.lesson03.teach.sandesh:
    title: 메시지
    gloss: 메시지
    note: 새로 나오는 명사예요. 이 과의 서면 초대 부분에 쓰여요.
    example_gloss: 이건 아르준의 메시지예요.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: 아르준이 토요일에 영화를 보자고 제안해요
    gloss: 프리야, 토요일에 영화 볼래?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: 프리야가 이유를 대며 거절해요
    gloss: 미안, 나 토요일에 바빠. 일이 있어.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: 아르준이 언제 만날 수 있는지 물어요
    gloss: 알겠어. 우리 언제 만날까?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: 프리야가 대신 일요일을 제안해요
    gloss: 일요일은 괜찮아? 같이 차 마시자!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: 아르준이 수락하고 시간을 물어요
    gloss: 좋은 생각이야! 일요일 몇 시에?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: 프리야가 시간을 제안해요
    gloss: 4시 괜찮아?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: 아르준이 확정해요
    gloss: 응, 4시 좋아. 그때 보자!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: 프리야가 마무리해요
    gloss: 좋아, 일요일에 보자!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: 프리야의 메시지
    gloss: 안녕 아르준, 일요일 4시에 만나서 차 마시자. 괜찮아? - 프리야
    note: 짧은 서면 초대장이에요. 방금 대화에서 확정한 계획을 다시 정리해요.
    glosses:
      चलो: ~하자
      रविवार: 일요일
      मिलते: 만나다 (मिलना에서)
      चाय: 차
      पीते: 마시다 (पीना에서)
      ठीक: 좋아요 / 괜찮아요
