teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: '복습: 장소'
    gloss: 은행, 학교, 병원, 공원, 역, 우체국
    note: 이전 단원에서 배운 장소 단어를 간단히 복습해요. 이번 단원에서도 자주 쓰여요.
    example_gloss:
    - 은행은 여기에 있어요.
    - 우체국은 은행 근처에 있어요.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: '복습: ~이다/있다, 어디, 여기, 저기, ~에서, ~의, 좋아요'
    gloss: ~이다/있다, 어디, 여기, 저기, ~에서, ~의, 좋아요
    note: 이번 단원의 연습에서 다시 쓰이는, 앞 단원의 작은 기능어들을 간단히 복습해요.
    example_gloss:
    - 은행이 어디에 있어요?
    - 공원은 저기에 있어요.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: 직진, 왼쪽, 오른쪽
    gloss: 직진, 왼쪽, 오른쪽
    note: 이번 단원의 핵심 방향 단어 세 가지예요.
    example_gloss:
    - 곧장 가세요.
    - 왼쪽으로 도세요.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: 가세요!, 도세요!
    gloss: 가!/가세요!, 돌아!/도세요! (편한 사이의 명령형)
    note: तुम 형태의 명령형이에요. 친구끼리 길을 알려 줄 때 자연스러운 말투예요.
    example_gloss:
    - 곧장 가세요.
    - 오른쪽으로 도세요.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: 여기서 직진하세요
    gloss: 여기서부터 쭉 직진하세요.
    note: 이번 수업의 새 단어에 'yahaan se'(여기서부터)를 합친 표현이에요.
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: 왼쪽으로 돌아요
    gloss: 왼쪽으로 도세요.
    note: 그 자체로 바로 쓸 수 있는 명령 표현이에요.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: 오른쪽으로 돌아요
    gloss: 오른쪽으로 도세요.
    note: '''baaen muro''와 짝을 이루는 반대 방향 명령이에요.'
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: 명령형 어미 -o
    gloss: '''Jaao''와 ''muro''는 तुम 형태의 명령형이에요. ''bataao'', ''gino''처럼 모두 ''-o''로 끝나요.'
    note: 앞 단원에서 이미 배운 단어(7단원의 bataao, 2단원의 gino)와 같은, 편한 사이의 명령형 규칙을 짚어 줘요.
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: 은행에 어떻게 가요?
    gloss: 은행에 어떻게 가요?
    note: 길을 물을 때 쓰는 핵심 질문으로, 1인칭 '제가 갈까요' 형태를 써요.
  hi.a1.unit09.lesson02.teach.tak:
    title: ~까지
    gloss: ~까지
    note: 2단원에서 숫자를 셀 때('zero se das tak') 이미 나왔어요. 여기서는 똑같이 실제로 쓰이는 공간적 의미로 다시 쓰여요.
    example_gloss: 은행까지 직진하세요.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: 은행까지 직진하세요
    gloss: 은행까지 직진하세요.
    note: '''tak''을 공간의 뜻으로 쓴 예문이에요.'
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: 먼저, 그다음에
    gloss: 먼저, 그다음에
    note: 길 안내의 두 단계를 순서대로 이어 주는 한 쌍의 단어예요.
    example_gloss:
    - 먼저 직진하세요.
    - 그다음에 왼쪽으로 도세요.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: 먼저 직진, 그다음 왼쪽
    gloss: 먼저 직진하고, 그다음에 왼쪽으로 도세요.
    note: '''pahle''와 ''phir''를 합쳐 두 단계로 된 안내를 만든 문장이에요.'
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle와 phir
    gloss: '''Pahle''와 ''phir''는 두 단계를 이어 줘요. 첫 번째 동작에는 ''pahle'', 두 번째 동작에는 ''phir''를 써요. 예: ''pahle seedhe jaao, phir baaen muro.'''
    note: 여러 단계의 길 안내를 순서대로 말하는 방법에 관한 실용적인 문법 포인트예요.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: 길모퉁이
    gloss: 길모퉁이
    note: 이번 수업의 마지막 대화에 나오는 새 장소 단어로, 'par'(~에)와 함께 써요.
    example_gloss:
    - 은행은 모퉁이에 있어요.
    - 공원은 학교 뒤에 있어요.
  hi.a1.unit09.lesson03.teach.bas:
    title: 그냥 / 단지
    gloss: 바로, 딱
    note: '''버스''(탈것)를 뜻하는 외래어로도 흔히 쓰이지만, 이 과정에서는 그 뜻을 가르치지 않으므로 헷갈릴 일은 없어요.'
    example_gloss: 조금만 더 가요.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: 알겠어요 / 이해했어요
    gloss: 알겠어요 / 이해했어요
    note: 흔히 쓰는 두 단어 표현이에요. 'samajh'('samajhna', 즉 이해하다의 어간)에 'gaya'(갔다)를 붙여 동작이 끝났음을 나타내요. 이것은 남성형이고, 프리야라면 'samajh gayi'라고 말해요.
    example_gloss: 알겠어요. / 이해했어요.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: 알겠어요! 정말 고마워요!
    gloss: 알겠어요! 정말 고마워요!
    note: 앞 단원에서 나온 'accha', 'bahut', 'shukriya'를 다시 사용했어요.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: 괜찮아요! 또 만나요.
    gloss: 괜찮아요! 또 만나요.
    note: 이 과정에서 마무리 인사로 쓰는 표현이에요. 8단원에서 나온 그대로 다시 나왔어요.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: 아르준이 우체국에 가는 길을 물어요
    gloss: 아르준이 프리야에게 우체국에 어떻게 가는지 물어요.
    note: 2과에서 나온 길 묻는 질문 패턴을 다시 사용했어요.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: 프리야가 길 안내를 시작해요
    gloss: 프리야가 말해요. 여기서 먼저 직진하세요.
    note: 이 단원 앞부분에서 나온 'yahaan se'와 'pahle'를 다시 사용했어요.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: 아르준이 그다음을 물어요
    gloss: 아르준이 알겠다고 하면서 그다음엔 어떻게 하는지 물어요.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: 프리야가 이어서 설명해요
    gloss: 프리야가 말해요. 그다음엔 은행 모퉁이에서 왼쪽으로 도세요.
    note: '''nukkad''(길모퉁이)를 문맥 속에서 처음 소개해요.'
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: 아르준이 확인하고 다시 물어요
    gloss: 아르준이 '왼쪽'이라고 따라 말하고, 알겠다고 한 뒤 그다음엔 어떻게 하는지 물어요.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: 프리야가 첫 번째 길 안내를 마무리해요
    gloss: 프리야가 말해요. 조금만 더 가세요. 우체국이 저기 은행 근처에 있어요.
    note: '''bas''(그냥/단지)를 처음 소개해요. 우체국이 은행 근처에 있다는 8단원의 설정과도 일치해요.'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: 아르준이 알아듣고 공원에 가는 길을 물어요
    gloss: 아르준이 알겠다고 하면서 공원에 어떻게 가는지 물어요.
    note: '''samajh gaya'' 표현을 처음 소개해요.'
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: 프리야가 두 번째 길을 알려 줘요
    gloss: 프리야가 말해요. 공원요? 먼저 직진하다가 오른쪽으로 도세요. 공원은 학교 뒤에 있어요.
    note: 공원이 학교 뒤에 있다는 8단원의 설정과 일치해요.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: 아르준이 프리야에게 고마워해요
    gloss: 아르준이 알겠다고 하면서 프리야에게 정말 고맙다고 해요.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: 프리야가 인사를 마무리해요
    gloss: 프리야가 괜찮다며 또 만나자고 해요.
    note: 8단원 대화의 마무리 인사와 똑같은 표현이에요.
