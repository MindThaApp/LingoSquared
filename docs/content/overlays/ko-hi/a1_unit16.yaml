teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: '복습: 너, 괜찮은, ~이다'
    gloss: 너(편한 사이), 괜찮은, ~이다
    note: 친구에게 몸 상태를 물을 때 필요한 단어를 간단히 복습해요.
    example_gloss: 잘 지내요?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: '복습: 나에게, ~이다'
    gloss: 나에게, ~이다
    note: 이번 레슨의 증상 표현을 만드는 데 필요한 연결 동사예요.
    example_gloss: 저는 일이 있어요.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: 괜찮아요?
    gloss: 괜찮아요?
    note: 이 단원의 첫 질문으로, 친구의 상태를 살필 때 써요.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: '복습: 나, ~이다, 아니다'
    gloss: 나, ~이다, 아니다
    note: '''괜찮아요?''에 ''아니요''라고 대답할 때 필요해요.'
    example_gloss: 저는 괜찮아요.
  hi.a1.unit16.lesson01.teach.sir:
    title: 머리
    gloss: 머리
    note: 이 단원의 첫 번째 증상을 말하는 데 필요한 새 명사예요.
    example_gloss: 제 머리는 커요.
  hi.a1.unit16.lesson01.teach.dard:
    title: 통증 / 아픔
    gloss: 통증 / 아픔
    note: 새 명사예요. 신체 부위와 합쳐 특정한 통증을 나타내요. 이 단원의 문법 노트를 보세요.
    example_gloss: 아파요.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: 머리가 아파요.
    gloss: 머리가 아파요.
    note: 이 단원의 첫 번째 증상 문장이에요.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + 증상 + hai
    gloss: '''Mujhe + 명사 + hai''는 11단원에서 이미 배웠어요(''mujhe kaam hai'' = 일이 있어요). 이제 증상을 말할 때도 써요. ''mujhe sir dard hai''는 ''머리가 아파요''(두통이 있어요)라는 뜻이에요. ''sir dard''(sir = 머리, dard = 통증)가 합쳐져 ''두통''이 돼요. 새로운 문법이 아니라 이전과 같은 패턴이에요.'
    note: 앞서 배운 '나에게 + 명사 + hai' 패턴의 두 번째 쓰임을, 이전 단원을 짚으면서 증상에 적용해요.
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = I have work)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''I have a headache'' -- ''सिर दर्द'' (सिर = head, दर्द = pain) एक साथ मिलकर ''headache'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: 열
    gloss: 열
    note: 이 단원의 두 번째 증상을 나타내는 새 명사예요.
    example_gloss: 열이 있어요?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: 열이 나요.
    gloss: 열이 나요.
    note: 같은 '나에게 + 명사 + hai' 패턴을 이번 레슨의 두 번째 증상에 적용했어요.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: '복습: 너에게, 가다'
    gloss: 너에게, 가다
    note: 둘 다 이미 배운 단어예요(6단원, 15단원). 병원에 가는 이야기를 하려고 다시 써요.
    example_gloss:
    - 무엇을 드릴까요?
    - 저는 역에 가야 해요.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: '복습: ~ 근처에 / ~에'
    gloss: ~ 근처에 / ~ 곁에 (장소)
    note: 8단원에서 처음 배웠어요. 여기서 다시 쓰고, 이번 레슨의 문법 노트에서 세 번째 의미도 배워요.
    example_gloss: 은행은 학교 근처에 있어요.
  hi.a1.unit16.lesson02.teach.doctor:
    title: 의사
    gloss: 의사
    note: 이번 레슨의 중심 주제인 새 명사예요.
    example_gloss: 그 의사 선생님은 좋은 분이에요.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: 병원에 가야 해요.
    gloss: 병원에 가야 해요.
    note: '*ke paas*를 15단원의 *mujhe...jana hai* 의무 표현과 합쳤어요.'
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: 세 번째 의미'
    gloss: '''Ke paas''의 앞선 두 가지 의미는 이미 배웠어요. 근처(8단원: ''bank school ke paas hai'')와 소유(2단원: ''mere paas ek kitab hai'')예요. 이제 세 번째 쓰임이에요. 어떤 사람 곁으로 간다는 것, 즉 그 사람을 만나러 간다는 뜻이에요. ''doctor ke paas jana hai''는 ''의사에게 가야 해요''라는 뜻이에요. 15단원의 ''mujhe...jana hai'' 틀도 다시 쓰였어요.'
    note: 세 번째 의미를 배우기 전에 앞선 두 의미를 단원 번호와 함께 짚고, 의무 표현이 다시 쓰였음도 알려 줘요.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: 휴식
    gloss: 휴식
    note: 이 단원의 첫 번째 조언에 쓰는 새 명사예요.
    example_gloss: 저는 휴식이 필요해요.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: '복습: 원하다 / 필요하다'
    gloss: 원하다 / 필요하다
    note: 6단원에서 처음 배웠어요. 필요한 것을 말할 때 다시 써요.
    example_gloss: 차를 마시고 싶어요.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: 너는 휴식이 필요해요.
    gloss: 너는 휴식이 필요해요.
    note: 이미 익힌 *tumhein...chahiye* 패턴을 이번 레슨의 새 명사에 적용했어요.
  hi.a1.unit16.lesson02.teach.dawa:
    title: 약
    gloss: 약
    note: 이 단원의 두 번째 조언에 쓰는 새 명사예요.
    example_gloss: 저는 약이 필요해요.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: 너는 약이 필요해요.
    gloss: 너는 약이 필요해요.
    note: 같은 *chahiye* 패턴을 약에 적용했어요.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: '복습: 가!, 그리고'
    gloss: 가!, 그리고
    note: 둘 다 이미 배운 단어예요(9단원, 1·2단원). 두 가지 조언을 잇는 데 다시 써요.
    example_gloss:
    - 똑바로 가세요.
    - 차와 커피를 마시고 싶어요.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: -o 명령형 규칙 다시 쓰기'
    gloss: '''Karo''는 앞서 배운 tum 명령형 규칙을 그대로 따라요(''jao'', ''muro'', ''batao'', ''gino'' -- 모두 ''-o''로 끝나요). 여기서는 ''karna''(11단원의 ''maaf karna'')의 어간 ''kar''에 ''-o''를 붙여 ''karo''가 되고, ''해!''라는 뜻이에요. ''Aaraam karo''는 ''쉬어!''라는 뜻이에요.'
    note: 이미 배운 명령형 규칙을 직접 확장해, 원형으로 알고 있던 동사에 적용해요.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: 쉬세요!
    gloss: 쉬세요!
    note: 새 명령형을 이 단원의 첫 번째 조언에 적용했어요.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: 쉬고 병원에 가세요.
    gloss: 쉬고 병원에 가세요.
    note: 이번 레슨의 두 가지 조언을 자연스러운 하나의 지시로 합쳤어요. 3과의 읽기 카드를 미리 보여 줘요.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: 프리야가 아르준에게 괜찮은지 물어요
    gloss: 아르준, 괜찮아요?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: 아르준이 머리가 아프고 열이 난다고 말해요
    gloss: 아니요, 머리가 아프고 열이 나요.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: 프리야가 쉬어야 한다고 말해요
    gloss: 괜찮지 않네요. 쉬어야 해요.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: 아르준은 약도 필요하다고 말해요
    gloss: 네, 그런데 약도 필요해요.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: 프리야가 병원에 가야 한다고 말해요
    gloss: 알겠어요. 병원에 가야 해요.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: 아르준이 프리야에게 고마워해요
    gloss: 네, 고마워요.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: 프리야가 쉬라고 말해요
    gloss: 쉬세요!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: 아르준이 동의해요
    gloss: 알겠어요.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: 세 가지 핵심 규칙
    gloss: '이 단원의 세 가지 핵심 규칙이에요. (1) ''mujhe/tumhein + 증상 + hai''는 몸이 아픈 상태를 말해요 (예: ''mujhe bukhar hai''). (2) ''tumhein/mujhe + 물건 + chahiye''는 필요한 것을 말해요 (예: ''tumhein aaraam chahiye''). (3) ''X ke paas jana hai''는 누구에게 꼭 가야 하는지를 말해요 (예: ''doctor ke paas jana hai'').'
    note: 이 단원의 문법을 하나로 묶어 정리한 마무리 요약이에요.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: 조언 읽기
    gloss: 쉬어. 병원에 가 봐.
    note: 대화에서 이미 나온 내용을 실제 말하듯 짧고 직접적인 지시문으로 다시 정리했어요.
    glosses:
      आराम: 휴식
      करो: 해 (하다의 명령형)
      डॉक्टर: 의사
      जाओ: 가 (가다의 명령형)
