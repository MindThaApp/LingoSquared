teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: 전화하다
    gloss: 전화하다
    note: 전화를 거는 동사의 원형이에요.
    example_gloss: 너에게 전화해야 해요.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: 전화하겠다고 말하기
    gloss: 제가 전화할게요.
    note: '*करूँगा*는 *करना*의 미래형이고, 힌디어에서는 한국어의 "~할게요"처럼 약속할 때 이 형태를 써요. 전화를 받는 사람에게는 *तुम्हें*("너에게")를 써요.'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: 전화 받기
    gloss: 여보세요, 저 프리야예요.
    note: 전화에서는 *मैं ... बोल रही हूँ*("저는 말하고 있어요")이라고 해요. 프리야가 여성이라서 *रही*가 여성형이에요.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: 아르준도 같은 방식으로 받아요
    gloss: 여보세요, 저 아르준이에요.
    note: '같은 패턴에 남성형 *रहा*를 써요: *मैं अर्जुन बोल रहा हूँ*. 아르준이 남성이기 때문이에요.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: 누가 전화했는지 묻기
    gloss: 누구세요?
    note: '*किससे*("누구와")는 *कौन*("누구")에 *से*가 붙은 것이고, *से*는 이야기하는 상대를 나타내요.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: 격식 있게 자신을 밝히기
    gloss: 프리야와 통화하고 계세요.
    note: '*आप*는 낯선 사람에게 쓰는 높임말 "당신"이에요. *प्रिया से बात कर रहे हैं*처럼 이름 뒤에 *से*가 오고, *आप*에는 *हैं*이 함께 써요.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: 다시 말해 달라고 부탁하기
    gloss: 다시 말해 줄 수 있어요?
    note: '*सकते हो*는 "~할 수 있다"라는 뜻이고 주동사 뒤에 와요: *कह सकते हो*. 문장 앞의 *क्या*가 의문문을 만들어요.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: 천천히 말해 달라고 부탁하기
    gloss: 너무 빨리 말하지 말아 주세요.
    note: '*मत बोलो*는 *तुम*에게 쓰는 친근한 "말하지 마"이고, *इतना तेज़*는 "그렇게 빨리"라는 뜻이에요.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: 잘 안 들린다고 말하기
    gloss: 잘 안 들려요.
    note: '힌디어는 "네 목소리가 오지 않고 있다"라고 말해요: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. 듣는 사람에게 *मुझे*를 쓰고, 목소리가 주어예요.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: 문자 메시지
    gloss: 문자 메시지
    note: '*मैसेज*는 흔히 쓰는 외래어이고 남성명사예요: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: 이 문자 메시지는 프리야가 보낸 거예요.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: 문자 보내겠다고 말하기
    gloss: 문자 보낼게요.
    note: '순서는 사람, 물건, 동사예요: *तुम्हें एक मैसेज भेजूँगा*. *भेजना*는 "보내다"라는 뜻이에요.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게요.
    note: '*वापस फ़ोन करना*는 "다시 전화하다"라는 뜻으로 *वापस*가 *फ़ोन करना* 앞에 와요. *बाद में*은 "나중에"라는 뜻이에요.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: 문자 대화 읽기
    gloss: '아르준: 안녕 프리야, 나한테 전화해 줄 수 있어? 너한테 할 중요한 말이 있어. 프리야: 응, 물론이지. 5분 뒤에 다시 전화할게.'
    note: 아르준이 무엇을 부탁하는지, 이유는 무엇인지, 프리야가 언제 다시 전화한다고 하는지 따라가 보세요.
    glosses:
      हाय: 안녕
      सकती: ~할 수 있다
      फ़ोन: 전화하다
      ज़रूरी: '중요한 (예: 전할 중요한 말)'
      कुछ: 무언가
      बतानी: 말해 주다
      ज़रूर: 물론
      करूँगी: 전화할 것이다
      पाँच: 다섯
      मिनट: 분
      वापस: 다시 (전화) 걸다
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: 아르준이 전화를 받아요
    gloss: '아르준: 여보세요, 저 아르준이에요.'
    note: 전화를 받는 사람은 먼저 *मैं ... बोल रहा हूँ*으로 이름을 말해요. 여기서는 남성형 *रहा*를 써요.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: 프리야가 자신을 밝혀요
    gloss: '프리야: 안녕 아르준, 나 프리야야. 아르준: 전화해 줘서 정말 반가워!'
    note: '*अच्छा हुआ तुमने फ़ोन किया*는 "전화해 줘서 다행이야"라는 뜻이고, *तुमने ... किया*는 *ने*를 쓰는 과거형이에요.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: 프리야가 근무에 대해 물어요
    gloss: '프리야: 첫 근무는 어땠어?'
    note: '*कैसी रही*는 "어땠어요?"라는 뜻이고, *शिफ़्ट*가 여성명사라서 *कैसी*도 여성형이에요.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: 아르준이 좋은 소식을 전해요
    gloss: '아르준: 아주 좋았어, 생각했던 것보다 더 좋았어.'
    note: '*अच्छी रही*("잘 지나갔다")는 여성명사 *शिफ़्ट*에 맞춘 형태이고, *जितना मैंने सोचा था उससे भी बेहतर*는 "내가 생각한 것보다 훨씬 더 좋다"라는 뜻이에요.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था와 थी: ~였다'
    gloss: 그는 긴장했고, 그녀는 기뻤어요.
    note: '*था*는 남성 주어의 "~였다"이고 *थी*는 여성 주어의 "~였다"예요. 어미는 설명하는 대상에 맞춰 달라져요.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: 프리야가 자랑스러워해요
    gloss: '프리야: 그 얘기 들으니 정말 좋다! 네가 자랑스러워.'
    note: '*तुम पर गर्व है*("자부심이 너 위에 있다")는 *पर*를 쓰고, 자랑스러워하는 사람에게는 *मुझे*를 써요.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: 아르준이 감동해요
    gloss: '아르준: 정말 고마워, 나한테 큰 의미가 있어.'
    note: '*मेरे लिए*는 "나에게"라는 뜻이고, *इसका बहुत मतलब है*는 "그것은 큰 의미가 있다"라는 뜻이에요.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: 그의
    gloss: 그의 첫 근무는 아주 잘 됐어요.
    note: '*उसकी*는 "그의" 또는 "그녀의"를 뜻하고(둘 다 같은 단어) 여성명사 *शिफ़्ट*에 맞춰요.'
