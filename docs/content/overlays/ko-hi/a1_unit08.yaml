    example_gloss:
    - 여기는 공원이에요.
    - 이곳은 역이에요.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: 여기, 저기
    gloss: 여기, 저기
    note: 무언가가 어디에 있는지 가리킬 때 쓰는 기본 짝이에요.
    example_gloss:
    - 학교는 여기에 있어요.
    - 은행은 저기에 있어요.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: 학교는 어디에 있어요?
    gloss: 학교는 어디에 있어요?
    note: 단원 1에서 배운 *kahaan*(어디)을 다시 쓰는데, 이번에는 사람의 출신이 아니라 장소를 물어요.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: 학교는 여기에 있어요
    gloss: 학교는 여기에 있어요.
    note: '*yahaan*을 쓴 대답 예문이에요.'
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: 은행은 어디에 있어요?
    gloss: 은행은 어디에 있어요?
    note: 장소만 바꾼 같은 질문 문형이에요.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: 은행은 저기에 있어요
    gloss: 은행은 저기에 있어요.
    note: '*wahaan*을 쓴 대답 예문이에요.'
  hi.a1.unit08.lesson02.teach.paas:
    title: 가까이
    gloss: 가까이
    note: 여기서 처음으로 정식으로 소개해요. 단원 2의 예문(*mere paas*, '나는 가지고 있다', 직역하면 '내 가까이')에만 나왔고, 하나의 단어로 배운 적은 지금까지 없었어요.
    example_gloss: 은행은 가까워요.
  hi.a1.unit08.lesson02.teach.door:
    title: 멀리
    gloss: 먼 / 멀리
    note: '*paas*의 반대말이에요.'
    example_gloss: 역은 멀어요.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas''는 어떤 장소의 근처를 뜻해요. 예: ''school bank ke paas hai''(학교는 은행 근처에 있어요). 앞에서 ''mere paas''(나는 가지고 있다)에 나온 ''paas''와 같은 말이지만, 거기서는 ''내 소유로''라는 뜻이었고 여기서는 ''근처''라는 뜻이에요 -- 한 단어, 두 가지 쓰임이에요.'
    note: 이미 본 단어를 바탕으로 한 새 후치사예요. 두 쓰임이 헷갈리지 않도록 앞서 나온 뜻을 분명히 짚어 줬어요.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (나는 가지고 있다), और यहाँ इसका मतलब है ''नज़दीक'' (가까이) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: 학교는 은행 근처에 있어요
    gloss: 학교는 은행 근처에 있어요.
    note: '*ke paas*를 쓴 예문이에요.'
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: 앞에, 뒤에
    gloss: 앞에, 뒤에
    note: 위치를 나타내는 두 번째 단어 쌍이고, 이것도 *ke*와 함께 써요.
    example_gloss:
    - 병원은 역 앞에 있어요.
    - 공원은 학교 뒤에 있어요.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne와 peeche
    gloss: '''Samne''와 ''peeche''도 ''paas''처럼 ''ke''와 함께 와요. 그리고 둘은 서로 반대예요. ''paark school ke peeche hai''와 ''school paark ke samne hai''는 실제로 같은 위치 관계를 말하는데, 바라보는 쪽만 달라요.'
    note: 같은 사실을 두 가지 방식으로 말해 보는 거예요. 두 단어가 어떤 관계인지 알려 주는 유용한 문법 포인트예요.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: 학교는 공원 앞에 있어요
    gloss: 학교는 공원 앞에 있어요.
    note: 위의 *paark school ke peeche hai*와 같은 사실을 반대쪽에서 말한 문장이에요.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: 우체국
    gloss: 우체국
    note: 이 단원의 마지막 대화에 나오는 새로운 흔한 장소예요.
    example_gloss: 우체국은 은행 근처에 있어요.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: 우체국은 어디에 있어요?
    gloss: 우체국은 어디에 있어요?
    note: 이 단원의 마지막 대화를 여는 문장이에요.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: 아르준이 우체국에 대해 물어요
    gloss: 아르준이 프리야에게 우체국이 어디에 있는지 물어요.
    note: 이 레슨의 첫 표현을 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: 프리야가 대답해요
    gloss: 프리야가 은행 근처라고 말해요.
    note: 레슨 2의 *ke paas*를 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: 아르준이 병원에 대해 물어요
    gloss: 아르준이 알겠다고 하고, 병원이 어디에 있는지 물어요.
    note: 앞 단원들에서 나온 *achchha*(알겠어요/그렇군요)를 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: 프리야가 대답해요
    gloss: 프리야가 병원은 역 앞에 있다고 말해요.
    note: 레슨 2의 *ke samne*를 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: 아르준이 먼지 물어요
    gloss: '아르준이 묻어요: 역은 멀어요?'
    note: 레슨 2의 *door*를 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: 프리야가 확인해 주고 대비해서 말해요
    gloss: 프리야가 네, 조금 멀다고 말해요. 은행은 가까워요.
    note: '*thoda*(조금)를 처음 소개해요. 역은 멀고 은행은 가깝다는 앞의 내용과도 계속 맞아요.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: 아르준이 공원에 대해 물어요
    gloss: 아르준이 알겠다고 하고, 공원이 어디에 있는지 물어요.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: 프리야가 대답해요
    gloss: 프리야가 공원은 학교 뒤에 있다고 말해요.
    note: 레슨 2의 *ke peeche*를 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: 아르준이 알아차려요
    gloss: '아르준이 말해요: 그럼 학교는 공원 앞에 있네요!'
    note: '*to*(그럼/그러면)를 처음 소개하고, 레슨 2의 *samne*/*peeche* 문법 노트와 연결해요.'
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: 프리야가 확인해 줘요
    gloss: 프리야가 네, 맞다고 말해요!
    note: '*sahi*(맞는/옳은)를 처음 소개해요.'
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: 아르준이 프리야에게 고마워해요
    gloss: '아르준이 말해요: 정말 고마워요, 프리야!'
    note: 앞 단원들에서 나온 *bahut*(매우/많이)와 *shukriya*를 다시 써요.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: 프리야가 마무리해요
    gloss: 프리야가 괜찮다고, 또 만나자고 말해요.
    note: 앞 단원들에서 나온 이 코스의 표준 마무리 표현을 다시 써요.
