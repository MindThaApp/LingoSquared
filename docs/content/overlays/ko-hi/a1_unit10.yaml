units:
  hi.a1.unit10.routines:
    title: 하루 일과
lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: 일어나기, 아침 식사, 출근하기
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: 언제 일어나요?
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: '프리야와 아르준: 하루 일과'
teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: '복습: ~시, 아침, 낮, 저녁, 밤, ~에'
    gloss: ~시, 아침, 낮, 저녁, 밤, ~에 (일반적인 시간)
    note: 4단원에서 배운 시간 표현을 간단히 복습해요. 이번 단원에서 자주 다시 나와요.
    example_gloss:
    - 지금 아침 8시예요.
    - 밤에는 수업이 없어요.
  hi.a1.unit10.lesson01.teach.uthna:
    title: 일어나요
    gloss: 일어나요 (남성 / 여성 화자)
    note: 이번 단원의 첫 번째 습관적 현재 동사예요. 5단원에서 본 -ta/-tee 형태(rahta hai/rahtee hai)를 1인칭으로 넓혀 hoon과 함께 써요.
    example_gloss:
    - 저는 아침 7시에 일어나요.
    - 저는 아침 6시에 일어나요.
  hi.a1.unit10.lesson01.teach.roz:
    title: 매일
    gloss: 매일
    note: 일과를 말할 때 쓰는 새로운 부사예요.
    example_gloss: 저는 매일 아침 일어나요.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: 저는 아침을 먹어요
    gloss: 아침을 먹어요 (남성 / 여성 화자)
    note: '''nashta''(아침 식사)는 ''karta/kartee hoon''(해요)과 함께 쓰여요.'
    example_gloss:
    - 아침에 저는 아침을 먹어요.
    - 아침에 저는 아침을 먹어요.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: 일하러 가요
    gloss: 출근해요 (남성 / 여성 화자)
    note: '''Kaam par jaana''(출근하다)에는 ''par''(~에)가 꼭 필요해요. 이 단원 뒤에 나오는 ''school jaana''는 추가 단어가 필요 없다는 점이 달라요.'
    example_gloss:
    - 그다음에 일하러 가요.
    - 그다음에 일하러 가요.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: 습관적 현재 형태
    gloss: 매일의 습관을 말할 때는 동사에 -ta/-tee/-te를 붙이고, 주어에 따라 hoon/ho/hai/hain을 덧붙여요. 저는 일어나요(남성/여성) 'hoon', 너는 일어나요 'ho', 그/그녀는 일어나요 'hai', 그들은 일어나요 'hain'.
    note: 전체 형태를 먼저 보여 줘요. 1단원 대화에서 이미 슬쩍 나왔고 5단원에서 3인칭을 정리했어요. 그래서 이번 연습에서 배우지 않은 형태를 짐작할 필요가 없어요.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: 나의 아침, 차례대로
    gloss: 저는 매일 아침 7시에 일어나서, 아침을 먹고, 출근해요.
    note: 이번 과의 세 가지 일과 동사를 순서대로 이어 자연스러운 한 문장으로 만들었어요.
  hi.a1.unit10.lesson02.teach.sona:
    title: 저는 자요
    gloss: 자요 (남성 / 여성 화자)
    note: 같은 -ta/-tee + hoon 형태를 새로운 동사에 적용해요.
    example_gloss:
    - 저는 밤 11시에 자요.
    - 저는 밤 10시에 자요.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: 학교에 가요
    gloss: 학교에 가요 (남성 / 여성 화자)
    note: '''kaam par jaana''와 달리 ''school jaana''는 ''jaana'' 앞에 다른 단어가 필요 없어요.'
    example_gloss:
    - 저는 매일 아침 8시에 학교에 가요.
    - 저는 매일 아침 8시에 학교에 가요.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'tum 형태: -te/-tee + ho'
    gloss: '''tum''(너, 친근한 사이)과 함께 쓰면 동사에 -te/-tee와 ''ho''가 붙어요. 일어나요(남성에게) / 일어나요(여성에게), 자요(남성에게) / 자요(여성에게).'
    note: 1과에서 소개한 같은 활용표 가운데 2인칭 부분이에요.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: tum 형태는 누구의 성별에 맞출까요?
    gloss: tum 형태의 동사는 말하는 사람이 아니라 질문을 받는 사람의 성별에 맞춰요. 프리야에게 '언제 일어나요?'라고 물으면 여성형, 아르준에게 물으면 남성형을 써요.
    note: 놓치기 쉬운 부분이에요. 3과 대화의 모든 tum 형태 문장에서 확인한 내용이에요.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: 언제 일어나요?
    gloss: 언제 일어나요? (남성에게)
    note: 이번 과에서 배운 tum 형태로 바로 쓸 수 있는 질문이에요.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: 먼저 일어나고, 그다음에 아침을 먹어요
    gloss: 먼저 일어나고, 그다음에 아침을 먹어요.
    note: 9단원 길 안내의 순서 표현 'pahle'/'phir'(먼저/그다음)를 일과의 순서에도 다시 써요.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par와 school
    gloss: '''Kaam par jaana''(출근하다)에는 ''par''가 필요하지만, ''school jaana''(학교에 가다)에는 추가 단어가 필요 없어요. 둘 다 맞고 흔히 쓰여요.'
    note: 하나의 규칙에 예외가 있는 게 아니라, 실제 관용적인 차이예요.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: 되돌려
    gloss: 되돌려
    note: '''aana''(오다)와 함께 쓰여 ''돌아오다''라는 뜻이 돼요.'
    example_gloss: 저는 돌아가요.
  hi.a1.unit10.lesson03.teach.aana:
    title: 와요
    gloss: 와요 (남성 / 여성 화자)
    note: 이미 익힌 습관적 현재 형태를 따르는 새로운 동사예요.
    example_gloss:
    - 저는 저녁에 돌아와요.
    - 저는 저녁에 돌아와요.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: 밥을 먹어요
    gloss: 밥을 먹어요 (남성 / 여성 화자)
    note: 명사 'khana'(음식, 6단원)와 동사 'khana'(먹다)가 겹쳐 나와요. 힌디어에서 자연스러운 표현이고 오타가 아니에요.
    example_gloss:
    - 저는 밤에 밥을 먹어요.
    - 저는 밤에 밥을 먹어요.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: 저녁 식사
    gloss: '저녁 식사 (직역: ''밤의 음식'')'
    note: 이미 배운 'raat'(밤), 'ka'(~의), 'khana'(음식)를 다시 써요.
    example_gloss: 저녁 식사는 아주 맛있어요.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: 아르준이 프리야에게 언제 일어나는지 물어요
    gloss: 아르준이 프리야에게 매일 몇 시에 일어나는지 물어요.
    note: 프리야에게 맞게 여성형 tum 형태를 써요.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: 프리야가 대답해요
    gloss: '프리야: 저는 매일 아침 6시에 일어나요. 그다음에 아침을 먹어요.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: 아르준이 자기 일과를 말해요
    gloss: '아르준: 그렇군요! 저는 7시에 일어나요. 저도 아침을 먹고, 그다음에 출근해요.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: 프리야가 아르준에게 언제 돌아오는지 물어요
    gloss: 프리야가 아르준에게 언제 돌아오는지 물어요.
    note: 아르준에게 맞게 남성형 tum 형태를 써요. 'vaapas aana'를 문맥 속에서 처음 소개해요.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: 아르준이 자기 저녁 시간을 말해요
    gloss: '아르준: 저는 저녁 6시에 돌아와요. 그다음에 저녁을 먹고, 그다음에 자요.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: 프리야가 자기 저녁 시간을 말해요
    gloss: '프리야: 저도 저녁에 돌아와서, 그다음에 밥을 먹어요.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: 아르준이 프리야에게 언제 자는지 물어요
    gloss: 아르준이 프리야에게 몇 시에 자는지 물어요.
    note: 프리야에게 맞게 다시 여성형 tum 형태를 써요.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: 프리야가 대답하고 마무리해요
    gloss: '프리야: 저는 밤 11시에 자요. 좋아요, 내일 만나요!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: 아르준이 마무리해요
    gloss: '아르준: 좋아요, 또 만나요!'
