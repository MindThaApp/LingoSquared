  hi.a1.unit06.lesson01.exercise06.order_yah_khana_bahut_swadisht_hai:
    instruction: '문장을 순서대로 배열하세요: 이 음식은 아주 맛있어요.'
    correct_response:
    - यह
    - खाना
    - बहुत
    - स्वादिष्ट
    - है
  hi.a1.unit06.lesson01.exercise07.fill_mujhe_pani:
    instruction: '문장을 완성하세요: 저는 물을 원해요.'
    accepted_answers:
    - पानी
    feedback: Mujhe paani chahiye -- chahiye는 무엇을 원하든 형태가 변하지 않아요.
  hi.a1.unit06.lesson01.exercise08.fill_tumhein_kya:
    instruction: '질문을 완성하세요: 뭘 원해?'
    accepted_answers:
    - चाहिए
    feedback: Tumhein kya chahiye? -- 상대에게 무엇을 원하는지 편하게 묻는 표현이에요.
  hi.a1.unit06.lesson01.exercise09.fix_chahiye_hai:
    instruction: 문장을 고치세요. chahiye만으로 이미 완전한 문장이라 hai가 필요 없어요.
    accepted_answers:
    - मुझे चाय चाहिए।
    - मुझे चाय चाहिए
    feedback: Mujhe chai chahiye -- chahiye 뒤에는 다른 대부분의 문장과 달리 hai/hain이 오지 않아요.
  hi.a1.unit06.lesson01.exercise10.reply_aapko_kya_chahiye:
    instruction: 커피를 원한다고 대답하세요.
    accepted_answers:
