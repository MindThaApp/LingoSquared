answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's own new vocabulary needs no new nasalization-mark decisions -- it only reuses already-settled spellings (हाँ's chandrabindu, तुम्हें/मिलेंगे/हैं/नहीं's anusvara). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: 힌디어 A1
units:
  hi.a1.unit06.food:
    title: 음식과 음료
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: ~을(를) 주세요
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: 음식과 양
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: 프리야와 아르준의 식사
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: 음식
    gloss: 음식, 식사
    note: 음식을 뜻하는 일반적인 말이에요. 이 단원 내내 쓰여요.
    example_gloss: 제 음식이 이제 준비됐어요.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: 차, 커피
    gloss: 차, 커피
    note: 흔한 음료 두 가지예요. 이 단원에서 *mujhe ... chahiye* 문형을 연습할 때 계속 쓰여요.
    example_gloss:
    - 차를 마시고 싶어요.
    - 커피를 마시고 싶어요.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: 물, 주스
    gloss: 물, 주스
    note: 흔한 음료 두 가지가 더 있어요. *chahiye*는 형태가 변하지 않아서 성에 맞출 필요가 없어요.
    example_gloss:
    - 물 주세요.
    - 주스를 마시고 싶어요.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye*는 ''~을(를) 원해요/주세요''라는 뜻이에요. 말하는 사람의 성에 따라 변하지 않고(*chahta/chahti*와 달라요), 뒤에 *hai*가 오지 않아요.'
    note: 이 단원의 핵심 문법이에요. 지금까지 배운 거의 모든 문장이 *hai*로 끝나기 때문에, *chahiye* 뒤에 hai를 붙이는 것은 학습자가 아주 흔히 하는 실수예요. *Chahiye*는 그 자체로 완전한 서술어예요.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: 무엇을 드릴까요? (격식)
    gloss: 무엇을 드릴까요?
    note: 격식을 갖춘 *aap* 말투의 질문이에요. 종업원이나 초대한 사람이 상대에게 공손하게 물을 때 써요.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: 뭐가 필요해? (친근한 말투)
    gloss: 무엇을 드릴까요?
    note: 친근한 *tum* 말투의 여격 대명사예요. *mujhe* 및 5단원의 *tumhara/tumhari*와 짝을 이뤄요.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: 차 주세요, 감사합니다
    gloss: 차 주세요, 감사합니다.
    note: 자연스럽고 공손한 주문 표현이에요. 앞에서 배운 *shukriya*를 다시 써요.
  hi.a1.unit06.lesson01.teach.bahut:
    title: 아주
    gloss: 매우, 아주
    note: 흔히 쓰는 강조 표현이에요. 이 단원에서 음식과 음료를 묘사할 때 계속 나와요.
    example_gloss: 이 차는 아주 맛있어요.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: 맛있는
    gloss: 맛있는
    note: 음식에 대한 반응을 말할 때 유용한 단어예요. 성에 따라 변하지 않는 이유는 3과의 문법 설명을 참고하세요.
    example_gloss: 이 음식은 아주 맛있어요.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: 로티, 밥
    gloss: 납작한 빵(로티), 밥
    note: 인도의 일상 식사에서 기본이 되는 음식 두 가지예요.
    example_gloss:
    - 빵을 먹고 싶어요.
    - 밥을 주세요.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: 채소 요리, 렌틸콩
    gloss: 채소 요리, 렌틸콩(달)
    note: 기본이 되는 요리 두 가지가 더 있어요. 보통 로티, 밥과 함께 먹어요.
    example_gloss:
    - 채소 요리를 주세요.
    - 렌틸콩을 주세요.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: 컵, 유리잔, 접시
    gloss: 컵, 유리잔, 접시
    note: 주문할 때 *ek*('하나')와 함께 양을 나타내는 흔한 그릇 이름이에요.
    example_gloss:
    - 차 한 잔 주세요.
    - 물 한 잔 주세요.
    - 밥 한 접시 주세요.
  hi.a1.unit06.lesson02.teach.kripya:
    title: 부탁드려요
    gloss: 부탁드려요
    note: 요청할 때 쓰는 간단한 공손 표현이에요. 주로 문장 맨 앞(*kripya mujhe ...*)에 오지만, 끝에 붙이는 것도 자주 들을 수 있어요.
    example_gloss: 차 한 잔 주세요.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: 더 필요하신 건 없으세요?
    gloss: 더 필요하신 것 있으세요? / 다른 것 더 드릴까요?
    note: 종업원이 주문을 일부 받은 뒤 자연스럽게 이어서 묻는 질문이에요.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: 아니요, 됐어요, 감사합니다
    gloss: 아니요, 그게 전부예요. 감사합니다.
    note: 주문을 마무리할 때 쓰는 자연스럽고 공손한 표현이에요. 앞에서 배운 *nahin*과 *shukriya*를 다시 써요.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: 이 채소 요리는 아주 맛있어요
    gloss: 이 채소 요리는 아주 맛있어요.
    note: 이 단원의 *bahut*와 *swadisht*를 새로운 음식 명사와 함께 다시 써요. *swadisht*가 성에 따라 변하지 않는다는 3과의 문법 설명을 준비하는 문장이에요.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: 우리 뭐 좀 먹자!
    gloss: 우리 뭐 좀 먹자!
    note: 함께 먹자고 권하는 친근한 관용 표현이에요. 이 단원의 마지막 대화를 여는 말이에요.
  hi.a1.unit06.lesson03.teach.ya:
    title: 또는
    gloss: 또는
    note: 두 가지 중 하나를 고르게 할 때 쓰는 간단한 연결어예요.
    example_gloss: 차 마실래, 커피 마실래?
  hi.a1.unit06.lesson03.teach.haan:
    title: 네
    gloss: 네
    note: 간단한 긍정의 대답이에요. 이 단원의 마지막 대화에서 계속 쓰여요.
    example_gloss: 네, 차를 마시고 싶어요.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht는 변하지 않아요
    gloss: '*Swadisht*는 남성 단어와 여성 단어 모두에 같은 형태로 쓰여요. *achha/achhi*처럼 변하지 않아요.'
    note: 중요한 예외예요. 앞에서 배운 성에 따라 변하는 형용사(achha/achhi, bada/badi, mera/meri)와 달리, *swadisht*처럼 자음으로 끝나는 형용사는 성에 따라 변하지 않아요.
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: 좋아요, 또 만나요
    gloss: 좋아요! 또 만나요.
    note: 앞 단원들의 작별 인사에서 다시 쓰는 친근한 마무리 표현이에요.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: 알겠어요, 곧 또 만나요
    gloss: 알겠어요, 곧 또 만나요!
    note: 위의 작별 인사에 대한 친근한 말투의 답이에요. 앞 단원들의 마무리 대화와 짝을 이뤄요.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: 아르준이 먹자고 제안해요
    gloss: 아르준이 뭐 좀 먹자고 말해요.
    note: 이 단원의 첫 표현을 다시 써요.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: 프리야가 뭘 원하는지 물어요
    gloss: 프리야가 좋다고 하고 아르준에게 뭘 먹고 싶은지 물어요.
    note: 1과에서 배운 친근한 말투의 질문 *tumhein kya chahiye*를 다시 써요.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: 아르준이 음식을 주문해요
    gloss: 아르준이 로티와 채소 요리 한 접시를 달라고 말해요.
    note: 이 단원의 음식 명사, *ek plate* 같은 그릇 문형, 그리고 *chahiye*를 함께 써요.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: 프리야가 음료를 고르게 해요
    gloss: 프리야가 좋다고 하고, 아르준에게 차와 커피 중 뭘 마실지 물어요.
    note: 이 단원의 *ya*를 써서 두 음료 중 하나를 고르게 해요.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: 아르준이 커피를 골라요
    gloss: 아르준이 커피를 주세요라고 말해요.
    note: 2과의 *kripya*를 다시 사용해요.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: 프리야가 음식에 대해 말해요
    gloss: 프리야가 좋다고, 그리고 이 음식이 아주 맛있다고 말해요.
    note: 1과의 *bahut swadisht*를 다시 사용해요.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: 아르jun이 동의해요
    gloss: 아르jun이 네, 정말 고맙다고 말해요.
    note: '*haan*과 *shukriya*를 다시 사용해요.'
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: 프리야가 대화를 마무리해요
    gloss: 프리야가 좋다고, 또 보자고 말해요.
    note: 이번 과의 마무리 표현을 다시 사용해요.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: 아르jun이 대답해요
    gloss: 아르jun이 좋다고, 곧 또 보자고 말해요.
    note: 이번 과의 응답 표현을 다시 사용해요.
