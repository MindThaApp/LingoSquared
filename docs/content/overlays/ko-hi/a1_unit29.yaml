teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: 전체 가격 묻기
    gloss: 합쳐서 얼마예요?
    note: '*कुल*은 ''총, 합계''라는 뜻이고, *कितना हुआ?*(''얼마가 됐어요?'')는 총액을 묻는 일상적인 표현이에요.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: 전체 가격 말하기
    gloss: 전부 합해서 250루피예요.
    note: '*हुए*는 복수형 *रुपये*에 맞춘 형태예요. *कुल दो सौ पचास रुपये हुए*를 직역하면 ''합쳐서 250루피가 됐다''예요.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: 카드나 현금으로 계산하기
    gloss: 카드로 계산하다, 현금으로 계산하다
    note: 힌디어에서는 *कार्ड से पेमेंट करना*('카드로 결제하다')와 *नकद पेमेंट करना*('현금으로 결제하다')라고 해요. *से*는 결제 수단을 나타내요.
    example_gloss:
    - 여기서 카드로 계산할 수 있나요?
    - 현금으로 계산할게요.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: 카드 결제가 되는지 묻기
    gloss: 여기서 카드로 계산할 수 있나요?
    note: '*यहाँ*(''여기'')은 장소를 나타내고, *सकता हूँ*(''할 수 있다'')은 주된 표현 뒤에 와요. 여성은 *सकती हूँ*라고 해요.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: 결제 방법 묻기
    gloss: 현금으로 계산하시겠어요, 카드로 계산하시겠어요?
    note: '*आप ... करेंगे*는 계산원이 쓰는 공손한 미래형 질문이에요. *आप*에는 복수 동사 *करेंगे*를 써요.'
  hi.a1.unit29.lesson03.teach.bil:
    title: 계산서
    gloss: 계산서
    note: '*बिल*은 남성 명사예요: *एक बिल*, *बिल का*.'
    example_gloss: 계산을 나눠서 낼까요?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: 계산 나누자고 제안하기
    gloss: 계산을 나눠서 낼까요?
    note: '*बाँट लें?*(''나눌까요?'')는 *हम*을 말하지 않아도 함께 하자는 제안이 돼요. *लें*은 *लेना*의 ''~하자'' 형태예요.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: 따로 계산해도 되는지 묻기
    gloss: 따로 계산해도 될까요?
    note: '*अलग से*는 ''따로''라는 뜻이며 *पेमेंट कर सकता हूँ* 앞에 와요.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: 거스름돈
    gloss: 거스름돈
    note: '*बाकी पैसे*(''남은 돈'')는 복수형이며 돌려받는 거스름돈을 뜻해요.'
    example_gloss: 거스름돈 여기 있습니다.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: 거스름돈 건네기
    gloss: 거스름돈 여기 있습니다.
    note: '*आपके*는 공손한 ''당신의''(*आप* + *के*)이며, 복수형 *पैसे*에 맞춘 형태예요.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: 거스름돈 사양하기
    gloss: 거스름돈은 필요 없어요.
    note: '*मुझे ... नहीं चाहिए*(''나에게 ... 필요하지 않다'')는 힌디어에서 ''필요 없어요''라고 말하는 방식이에요. *नहीं*은 *चाहिए* 앞에 와요.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: '350'
    gloss: '350'
    note: '*तीन सौ पचास*는 350이에요. 백의 자리를 먼저 말하고 그다음 십의 자리를 말해요.'
    example_gloss: 가격은 350루피예요.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: 식당 계산서 읽기
    gloss: '계산서: 탈리 두 개와 차 두 잔. 합계: 350루피. 결제: 카드.'
    note: 무엇을 주문했는지, 총액이 얼마인지, 어떻게 결제했는지 확인하세요.
    glosses:
      बिल: 계산서
      दो: 둘
      थाली: 탈리
      चाय: 차
      कुल: 총액
      तीन: 셋
      सौ: 백
      पचास: 오십
      रुपये: 루피
      पेमेंट: 결제
      कार्ड: 카드
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: 프리야가 계산서를 요청해요
    gloss: '프리야: 계산서 달라고 할까요?'
    note: '*माँग लें?*(''달라고 할까요?'')에도 *लेना*의 ''~하자'' 형태가 다시 쓰였고, *माँगना*는 ''요청하다''라는 뜻이에요.'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: 아르준이 총액을 물어요
    gloss: '아르준: 네, 좋아요. 전부 얼마예요?'
    note: '*कुल कितना हुआ?*는 앞에서 배운 총액 질문이며, 여기서는 식탁에서 쓰였어요.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: 프리야가 총액을 말해요
    gloss: '프리야: 350루피예요. 나눠 낼까요?'
    note: '*तीन सौ पचास रुपये हुए*는 총액을 말하는 문장이고, *बाँट लें?*는 ''나눌까요?''라고 묻는 말이에요.'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: 아르준이 자기가 내겠다고 해요
    gloss: '아르준: 아니요, 오늘은 제가 낼게요. 저를 정말 많이 도와줬잖아요.'
    note: '*मुझे पेमेंट करने दो*는 ''제가 계산하게 해 주세요''라는 뜻이에요. *तुमने मेरी बहुत मदद की है*에서는 동사가 과거형이라 *ने*를 써요.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: 프리야가 감동해요
    gloss: '프리야: 정말 다정하네요! 정말 고마워요.'
    note: '*तुम कितने अच्छे हो!*(''당신은 정말 착하네요'')는 따뜻한 칭찬이고, *शुक्रिया*는 ''고마워요''라는 뜻이에요.'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: 아르준이 카드 결제가 되는지 물어요
    gloss: '아르준: 여기서 카드로 결제할 수 있나요?'
    note: '*क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?*라는 질문이 다시 나왔고, 이번에는 실제 식당 상황이에요.'
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: 그가 계산해요'
    gloss: 아르준이 계산을 해요.
    note: '*देता है*는 *देना*(''주다'')의 *वह* 형태예요. 힌디어에서는 ''계산하다''를 ''계산서를 주다''라고 표현해요.'
