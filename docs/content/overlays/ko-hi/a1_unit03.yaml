teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: 오늘
    gloss: 오늘
    note: 이번 수업에서 거의 모든 문장에 다시 쓰게 될 단어예요.
    example_gloss: 오늘은 날씨가 좋아요.
  hi.a1.unit03.lesson01.teach.somvar:
    title: 월요일
    gloss: 월요일
    note: सोम(달)에서 따온 이름이에요. 한국어 '월요일'(月曜日)도 달에서 온 이름이에요.
    example_gloss: 요가 수업은 월요일이에요.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: 화요일
    gloss: 화요일
    note: मंगल(화성)에서 따온 이름이에요. 힌디어 요일 이름은 대부분 이런 식이에요.
    example_gloss: 오늘은 화요일이에요.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: 수요일
    gloss: 수요일
    note: बुध(수성)에서 따온 이름이에요.
    example_gloss: 오늘은 수요일이에요.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: 목요일
    gloss: 목요일
    note: गुरु(목성)에서 따온 이름이에요.
    example_gloss: 오늘은 목요일이에요.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: 금요일
    gloss: 금요일
    note: शुक्र(금성)에서 따온 이름이에요.
    example_gloss: 금요일에는 요가 수업이 없어요.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: 토요일
    gloss: 토요일
    note: शनि(토성)에서 따온 이름이에요.
    example_gloss: 오늘은 토요일이에요.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: 일요일
    gloss: 일요일
    note: 태양을 뜻하는 산스크리트어 이름 रवि에서 따온 이름이에요. 한국어 '일요일'(日曜日)도 해에서 온 이름이에요.
    example_gloss: 오늘은 일요일이에요.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: 무슨 요일인지 묻기
    gloss: 오늘은 무슨 요일이에요?
    note: '*Kaun sa*(''어느'')는 남성 명사 *din*(''날, 요일'')과 성이 일치해요. 여성 명사에는 여성형 *kaun si*를 쓰는데, 뒤에서 만나게 돼요.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: 어떤 요일에 일정이 있다고 말하기
    gloss: 요가 수업은 월요일이에요.
    note: 요일 이름 뒤의 *Ko*는 '~에'라는 뜻이에요. *somvar ko*는 '월요일에'이고, 모든 요일에 같은 방식으로 써요.
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: 어떤 요일에 일정이 없다고 말하기
    gloss: 금요일에는 요가 수업이 없어요.
    note: Nahin은 문장을 부정해요. ko는 여전히 요일을 나타내고, 여기서는 강조하려고 맨 앞에 왔어요.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: 1월, 2월, 3월
    gloss: 1월, 2월, 3월
    note: 힌디어 달 이름은 대부분 외래어라서 규칙만 알면 바로 알아볼 수 있어요. 새로운 문법 없이 어휘만 배워요.
    example_gloss:
    - 제 생일은 1월이에요.
    - 다음 휴일은 2월이에요.
    - 제 생일은 3월이에요.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: 4월, 5월, 6월
    gloss: 4월, 5월, 6월
    note: 처음 세 달과 같은 방식으로 쉽게 알아볼 수 있어요.
    example_gloss:
    - 다음 휴일은 4월이에요.
    - 제 생일은 5월이에요.
    - 다음 휴일은 6월이에요.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: 7월, 8월, 9월
    gloss: 7월, 8월, 9월
    note: Sitambar는 여기서 아누스와라를 써서 सितंबर로 적었어요. 반쪽 m을 쓴 सितम्बर도 흔히 쓰이고 똑같이 맞아요.
    example_gloss:
    - 제 생일은 7월이에요.
    - 다음 휴일은 8월이에요.
    - 제 생일은 9월이에요.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: 10월, 11월, 12월
    gloss: 10월, 11월, 12월
    note: Navambar와 disambar도 sitambar처럼 아누스와라로 적어요. 반쪽 m을 쓴 नवम्बर와 दिसम्बर도 흔히 쓰이고 똑같이 맞아요.
    example_gloss:
    - 다음 휴일은 10월이에요.
    - 제 생일은 11월이에요.
    - 다음 휴일은 12월이에요.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: 날짜
    gloss: 날짜
    note: '*Tareekh*는 여성 명사예요. 그래서 의문사도 여성형이 되어 *kitni tareekh*라고 하고, *kitna tareekh*라고는 하지 않아요. 2단원에서 *keemat*, *umra*로 배운 일치와 같은 방식이에요.'
    example_gloss: 오늘은 3일이에요.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: ~에 (달 이름과 함께)
    gloss: ~에 -- 달 이름과 함께 써요
    note: '*Mein*은 *ko*가 요일을 나타내듯 달을 나타내요. *janvari mein*은 ''1월에''이고, *janvari ko*라고는 하지 않아요.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: 날짜 묻기
    gloss: 오늘은 며칠이에요?
    note: 직역하면 '오늘 날짜가 몇이에요'예요. kitni는 여성 명사 tareekh와 성이 일치해요.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: 숫자만으로 날짜 말하기
    gloss: 오늘은 3일이에요.
    note: 힌디어는 날짜를 서수가 아니라 기본 수(*teen*, '3')로 말해요. 따로 '날짜 단어'를 배울 필요 없이 이미 아는 숫자를 쓰면 돼요.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: 달까지 넣어 날짜 말하기
    gloss: 오늘은 1월 3일이에요.
    note: 같은 기본 수 방식에 숫자 뒤에 달 이름을 붙여요.
  hi.a1.unit03.lesson03.teach.kab:
    title: 언제
    gloss: 언제
    note: 아주 자주 쓰는 간단한 의문사예요.
    example_gloss: 다음 수업은 언제예요?
  hi.a1.unit03.lesson03.teach.agli:
    title: 다음
    gloss: 다음
    note: '*Agli*는 여성형이에요. 일상 힌디어에서 *class*(क्लास)는 여성 명사로 쓰여서 남성형 *agla*가 아니라 *agli*를 써요.'
    example_gloss: 다음 수업은 화요일이에요.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: 십
    gloss: 십
    note: 2단원에서 나온 단어예요. 여기서는 실제 날짜를 말할 때 필요해요.
    example_gloss: 다음 수업은 10일이에요.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: 생일
    gloss: 생일
    note: 남성 명사예요. mera janmadin이라고 하고, meri janmadin이라고는 하지 않아요.
    example_gloss: 제 생일은 12월이에요.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: 친한 사람에게 생일 묻기
    gloss: 생일이 언제야? (반말)
    note: Tumhara는 남성 명사 janmadin과 성이 일치해요.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: 내 생일 말하기
    gloss: 제 생일은 1월이에요.
    note: Tumhara janmadin kab hai?에 대한 자연스러운 완전한 문장 대답이에요.
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: 다음 수업이 언제인지 묻기
    gloss: 다음 수업은 언제예요?
    note: class와 성이 일치하는 agli(여성형)와 kab을 함께 썼어요.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: 요일과 날짜를 함께 말하기
    gloss: 다음 수업은 3월 10일 화요일이에요.
    note: 요일과 날짜를 함께 말할 때 힌디어는 요일, 날짜 숫자, 달 순서로 말해요. 한국어는 달, 날짜, 요일 순서라서 반대예요.
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: 아르준이 다음 수업에 대해 묻기
    gloss: 아르준이 다음 요가 수업이 언제인지 물어요.
    note: 이번 수업의 질문을 그대로 쓰고, 분명하게 하려고 yog를 더했어요.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: 프리야가 요일과 날짜를 알려 주기
    gloss: 프리야가 다음 수업은 3월 10일 화요일이라고 말해요.
    note: 이번 수업의 요일·날짜 문장을 그대로 썼어요.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: 아르준이 고마워하기
    gloss: 아르준이 알겠다고, 고맙다고 말해요.
    note: Theek hai와 shukriya는 모두 1단원에서 배운 어휘예요.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: 프리야가 대답하기
    gloss: 프리야가 별거 아니라고 말해요.
    note: Koi baat nahin은 '천만에요', '괜찮아요'라는 뜻으로 아주 흔히 쓰는 자연스러운 표현이에요.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: 아르준이 프리야의 생일 묻기
    gloss: 아르준이 프리야의 생일이 언제인지 물어요.
    note: 이번 수업의 친한 사이 생일 질문을 그대로 썼어요.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: 프리야가 대답하기
    gloss: 프리야가 자기 생일은 1월이라고 말해요.
    note: 이번 수업의 대답 문장을 그대로 썼어요.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: 아르준이 반응하고 자기 생일도 말하기
    gloss: 아르준이 반가워하며 자기 생일은 12월이라고 말해요.
    note: Accha는 1단원 어휘예요. 12월은 이번 단원 2과에서 이미 배웠어요.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: 프리야가 대화를 마무리하기
    gloss: 프리야가 알겠다고 하며 편하게 다음에 보자고 인사해요.
    note: Theek hai와 phir milte hain은 모두 1단원의 작별 인사 어휘예요.
