teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: 기쁜, 슬픈, 화난
    gloss: 기쁜, 슬픈, 화난
    note: '*खुश*, *उदास*, *नाराज़*는 *हूँ*이나 *है*(''이다'')와 함께 쓰는 기본 감정 단어예요. 성별에 따라 형태가 바뀌지 않아요.'
    example_gloss:
    - 저는 기뻐요.
    - 저는 슬퍼요.
    - 저는 화가 나요.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: 기쁘다고 말하기
    gloss: 저는 기뻐요.
    note: '*मैं खुश हूँ*은 *मैं* + 감정 + *हूँ* 순서예요. 한국어의 ''저는 ~해요''와 같은 구조예요.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: 대조되는 감정 말하기
    gloss: 저는 화난 게 아니라 슬퍼요.
    note: '*नहीं*는 *हूँ* 바로 앞에 와요: *नाराज़ नहीं हूँ*. 뒷부분에서 진짜 감정을 말해요.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: 이유 묻기
    gloss: 왜 기뻐요?
    note: '*क्यों*(''왜'')는 핵심 단어 앞에 와요: *तुम खुश क्यों हो?* *तुम*은 친근하게 쓰는 ''너''예요.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: 이유 말하기
    gloss: 새 아파트가 생겨서 기뻐요.
    note: '*क्योंकि*는 이유를 이끌어요. *मेरे पास ... है*는 ''저는 ~이 있어요''라는 뜻이고, 동사 *है*는 맨 끝에 와요.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: 부정적인 이유
    gloss: 저는 비가 와서 슬퍼요.
    note: '*बारिश हो रही है*는 ''비가 와요''라는 뜻이에요(직역하면 ''비가 되고 있다'').'
  hi.a1.unit27.lesson03.teach.narvas:
    title: 긴장한
    gloss: 긴장한
    note: 긴장한 상태를 나타내는 기본 단어예요.
    example_gloss: 첫 근무를 앞두고 긴장돼요.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: 무엇 때문에 긴장하는지 말하기
    gloss: 첫 근무를 앞두고 긴장돼요.
    note: '*को लेकर*는 ''~에 대해, ~ 때문에''라는 뜻이고 명사 뒤에 와요: *शिफ़्ट को लेकर*. *अपनी*(''나 자신의'')는 여성 명사 *शिफ़्ट*에 맞춘 형태예요.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: 안심시키기
    gloss: 걱정하지 마세요.
    note: '*चिंता मत करो*는 친근하게 ''걱정하지 마세요''라고 하는 말이에요. *मत* + *करो*는 *तुम*에게 하는 부정 명령이에요.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: 다른 사람의 기분 묻기
    gloss: 아르준은 기분이 어때요?
    note: '*कैसा महसूस कर रहा है*는 ''기분이 어떠해요?''라는 뜻이에요. *कैसा*는 사람의 성별에 맞춰 달라져서, 여성에게는 *कैसी*를 써요.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: 다른 사람의 기분 설명하기
    gloss: 그는 긴장하고 있어요.
    note: 여기서는 '스스로'에 해당하는 별도의 단어를 쓰지 않아요. *वह नर्वस महसूस कर रहा है*는 *वह*와 *रहा है*만 써요.
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: 왜 그런 기분인지 묻기
    gloss: 그는 왜 긴장해요?
    note: '*क्यों*는 동사구 바로 앞에 와요: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: 감정에 관한 메시지 읽기
    gloss: 안녕, 프리야. 나 혼자 하는 첫 근무가 조금 긴장돼. 그래도 기쁘기도 해, 새 직장과 새 아파트가 생겼거든. 다 잘될 것 같아.
    note: 글쓴이가 무엇 때문에 긴장하는지, 무엇 때문에 기쁜지, 전반적으로 어떻게 전망하는지 살펴보세요.
    glosses:
      थोड़ा: 조금
      नर्वस: 긴장한
      पहली: 첫 번째의
      शिफ़्ट: 근무
      अकेले: 혼자
      खुश: 기쁜
      क्योंकि: 왜냐하면
      नई: 새로운
      नौकरी: 일
      नया: 새로운
      फ़्लैट: 아파트
      लगता: 생각하다
      होगा: 잘 되다 (여기서는 괜찮을 것이다)
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: 프리야가 아르준의 기분을 물어봐요
    gloss: '프리야: 안녕, 아르준. 첫 근무를 앞두고 기분이 어때?'
    note: '*को लेकर*가 또 나와요: *अपनी पहली शिफ़्ट को लेकर*(''너의 첫 근무에 대해''). *तुम*은 친근한 표현이에요.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: 아르준이 긴장된다고 털어놓아요
    gloss: '아르준: 솔직히 말하면 좀 긴장돼.'
    note: '*सच कहूँ तो*(''솔직히 말하면'')는 고백을 부드럽게 해 주는 표현이에요.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: 프리야가 그를 안심시켜요
    gloss: '프리야: 걱정하지 마, 넌 잘할 수 있어!'
    note: '*तुम यह अच्छे से कर सकते हो*는 ''너는 이걸 잘할 수 있어''라는 뜻이고, *अच्छे से*는 ''잘''이라는 뜻이에요.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: 아르준이 고마워해요
    gloss: '아르준: 고마워, 정말 도움이 돼.'
    note: '*इससे मदद मिलती है*는 직역하면 ''이것으로부터 도움이 얻어진다''예요. 도움을 주는 대상에 *से*를 붙여요.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: 프리야가 결과를 예측해요
    gloss: '프리야: 그리고 나중에는 분명 아주 기쁘고 뿌듯할 거야.'
    note: '*ज़रूर*(''분명'')는 예측에 확신을 더해 주고, *तुम्हें गर्व होगा*는 ''너는 자랑스러울 거야''라는 뜻이에요.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: 아르준이 동의해요
    gloss: '아르준: 응, 나도 그렇게 생각해.'
    note: '*मुझे भी ऐसा ही लगता है*(''나에게도 그렇게 느껴진다'')는 동의할 때 자연스럽게 쓰는 말이고, *मुझे*는 느끼는 사람을 나타내요.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: '대명사: उसकी'
    gloss: 아르준은 긴장했어요. 프리야가 그를 도와줘요.
    note: '*उसकी*는 ''그의'' 또는 ''그녀의''라는 뜻이고 여성 명사 *मदद*에 맞춘 형태예요. 그래서 *उसकी मदद करना*는 ''그를 돕다''예요. *है*와 *करती है*는 3인칭 동사예요.'
