teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: 가게, 시장
    gloss: 가게, 시장
    note: 물건을 사는 흔한 장소 두 곳으로, 이번 단원 내내 나와요.
    example_gloss:
    - 여기는 가게예요.
    - 여기는 시장이에요.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: 가게 주인
    gloss: 가게 주인
    note: 이번 단원의 새 등장인물로, 가게를 운영하는 사람이에요. 낯선 사람이므로 aap으로 부르며 높여 말해요.
    example_gloss: 이 사람은 가게 주인이에요.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: 셔츠, 가방, 모자
    gloss: 셔츠, 가방, 모자
    note: 음식 단원에서 배운 *mujhe ... chahiye* 패턴을 연습하기 위해 이번 단원 내내 쓰는 흔한 쇼핑 품목 세 가지예요.
    example_gloss:
    - 저는 셔츠를 원해요.
    - 저는 가방을 원해요.
    - 저는 모자를 원해요.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: 이거 주세요
    gloss: 이거 주세요.
    note: 물건을 원할 때 두루 쓰는 표현으로, 음식 단원의 *mujhe ... chahiye*에 *yah*(이것)를 넣은 거예요.
  hi.a1.unit07.lesson01.teach.ji:
    title: 지 (존칭)
    gloss: '''~님''처럼 존경을 나타내는 말'
    note: 이름이나 호칭 뒤에 붙여 더 공손하게 말하는 표현으로, 가게 주인 같은 낯선 사람에게 흔히 써요.
    example_gloss: 안녕하세요, 사장님.
  hi.a1.unit07.lesson01.teach.sirf:
    title: 오직
    gloss: 오직, 단지
    note: 여러 개가 아니라 한 가지만 원한다고 말할 때 써요.
    example_gloss: 저는 셔츠 한 벌만 원해요.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: 더 필요하신 건 없으세요? (높임)
    gloss: 더 필요하신 건 없으세요?
    note: 가게 주인이 주문 일부를 받은 뒤 묻는 자연스러운 높임 표현으로, *aapko*와 *chahiye*를 다시 사용해요.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: 아니요, 이것만요
    gloss: 아니요, 이것만요.
    note: 더 이상 필요 없다고 정중하고 자연스럽게 거절하는 표현이에요. 이번 과에서 배운 *ji*와 *sirf*를 다시 쓰고 있어요.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: 원하는 것을 말해 보세요
    gloss: 뭐가 필요한지 말해 보세요.
    note: 말로 대답하도록 요청할 때 이 코스에서 쓰는 친근한 연습 지시 표현이에요. 음식 단원의 표현과 같은 형태예요.
  hi.a1.unit07.lesson02.teach.keemat:
    title: 가격
    gloss: 가격
    note: 2단원의 숫자·가격 내용에서 이미 나왔던 단어예요. 이번 단원의 쇼핑 상황에 맞게 다시 배워요.
    example_gloss: 이거 가격이 얼마예요?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: 루피
    gloss: 루피
    note: 2단원에서 나온 화폐 단위 단어예요. 이번에는 서로 다른 두 가격으로 연습해요.
    example_gloss:
    - 이거 가격은 200루피예요.
    - 이거 가격은 500루피예요.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: 이거 가격이 얼마예요?
    gloss: 이거 가격이 얼마예요?
    note: 가격을 물을 때 쓰는 기본 표현이에요. 2단원에서 그대로 가져왔어요.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: 이거 가격은 200루피예요
    gloss: 이거 가격은 200루피예요.
    note: 위의 가격 질문에 대한 대답 예시예요.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: '''Yah kitne ka hai?''는 남성 사물에, ''Yah kitne ki hai?''는 여성 사물에 써요. *kitne* 자체는 절대 변하지 않고 *ka/ki*만 바뀌어요. 이미 배운 *mera/meri*, *tumhara/tumhari*의 -a/-i 교체와 똑같아요.'
    note: 가격을 묻는 또 하나의 아주 흔한 방법이에요. 소유 표현에서 배운 성 일치 방식과 같아서, kitne는 그대로이고 ka/ki만 바뀌어요.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: 이거 얼마예요? (남성)
    gloss: 이거 얼마예요?
    note: 가방 같은 남성 사물에 써요.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: 이거 얼마예요? (여성)
    gloss: 이거 얼마예요?
    note: 모자 같은 여성 사물에 써요.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: 싼, 비싼
    gloss: 싼, 비싼
    note: 가격에 대한 반응을 말할 때 자주 쓰는 형용사 한 쌍이에요. 여기서는 남성형을 보여 줘요.
    example_gloss:
    - 이 가방은 싸요.
    - 이 가방은 비싸요.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti와 mehengi
    gloss: '''Sasta''와 ''mehenga''도 ''mera/meri''처럼 남성과 여성에 따라 바뀌어요. 여성 단어에는 ''sasti''와 ''mehengi''를 써요. 예: ''yah topi sasti hai''(이 모자는 싸요), ''yah kameez mehengi hai''(이 셔츠는 비싸요).'
    note: 이 코스에서 계속 짚어 주는 성 일치 규칙이 실제로 쓰인 두 번째 예예요.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: 사다
    gloss: 사다
    note: 1단원에서 요가를 배우고 싶다고 말할 때 배운 '동사 + na chahta/chahti hun'(~하고 싶어요) 구문을 이번에는 사는 일에 적용해요.
    example_gloss:
    - 이 셔츠를 사고 싶어요.
    - 이 모자를 사고 싶어요.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: 뭐 좀 사요!
    gloss: 뭐 좀 사요!
    note: 함께 쇼핑하자고 권하는 친근한 고정 표현이에요. 이번 단원의 마지막 대화를 여는 말로, 음식 단원의 'chalo, kuch khate hain!'과 같은 형태예요.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: 아르준이 쇼핑을 제안해요
    gloss: 아르준이 뭐 좀 사자고 말해요.
    note: 이번 단원의 첫 표현을 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: 프리야가 좋다고 해요
    gloss: 프리야가 좋다고 하면서 셔츠로 할지 모자로 할지 고민해요.
    note: 두 물건 중 하나를 고르게 할 때 쓰는 *ya*(또는)가 처음 나와요.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: 가게 주인이 인사해요
    gloss: 가게 주인이 인사하며 무엇이 필요한지 물어요.
    note: 높임말(aap)을 쓰는 격식 있는 인사예요. 1과의 *aapko kya chahiye*를 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: 프리야가 셔츠에 대해 물어요
    gloss: 프리야가 가게 주인에게 공손하게 인사하고 셔츠를 달라고 한 다음 가격을 물어요.
    note: '*ji*, *mujhe ... chahiye*, *iski keemat kya hai*를 한데 합쳤어요.'
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: 가게 주인이 가격을 말해요
    gloss: 가게 주인이 가격은 300루피라고 말해요.
    note: '*iski keemat ... rupaye hai* 구문을 새로운 숫자와 함께 다시 써요.'
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: 프리야가 반응하고 결정해요
    gloss: 프리야가 300루피면 싸다며 이 셔츠를 달라고 해요.
    note: 2과 문법 노트에서 배운 *sasti*를 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: 아르준이 모자에 대해 물어요
    gloss: 아르준이 모자를 달라고 하면서 얼마인지 물어요.
    note: 2과에서 배운 여성형 *kitne ki hai*를 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: 가게 주인이 대답해요
    gloss: 가게 주인이 이 모자는 500루피라고 말해요.
    note: 2과에서 배운 *paanch sau*(500)를 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: 아르준이 반응하지만 그래도 사기로 해요
    gloss: 아르준이 500루피면 비싸다면서도, 좋다고 하며 이 모자를 달라고 해요.
    note: 2과 문법 노트의 *mehengi*를 다시 쓰고, 그래도 사기로 결정해요.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: 가게 주인이 더 필요한 게 없는지 물어요
    gloss: 가게 주인이 알겠다며 더 필요한 건 없는지 물어요.
    note: 1과의 *aapko aur kuch chahiye*를 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: 프리야가 주문을 마무리해요
    gloss: 프리야가 아니요, 이것만 주세요, 감사합니다라고 말해요.
    note: 1과의 *ji nahin, sirf yah*에 *shukriya*를 더해 다시 써요.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: 가게 주인이 작별 인사를 해요
    gloss: 가게 주인이 감사하다며 또 만나자고 말해요.
    note: 이 코스에서 쓰는 기본 마무리 인사를 다시 써요.
