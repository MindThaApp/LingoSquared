answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," unit 15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 힌디어 A1
units:
  hi.a1.unit19.weather:
    title: 날씨
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: 날씨, 해, 비, 바람
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: 더위, 추위, 구름
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: '프리야와 아르준: 내일 날씨는 어떨까요?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: '복습: 오늘'
    gloss: 오늘
    note: 3단원에서 처음 배웠어요. 이 단원에서 계속 나오는 시간 표현이고, 3과에서 *kal*(내일)과 함께 쓰여요.
    example_gloss: 오늘은 3일이에요.
  hi.a1.unit19.lesson01.teach.mausam:
    title: 날씨
    gloss: 날씨
    note: 새로 나온 명사로, 이 단원의 주제어예요. 남성 명사예요. 이 단원의 성 일치 문법 설명을 참고하세요.
    example_gloss: 오늘 날씨가 어때요?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: '복습: 어떤 / 어때요'
    gloss: 어떤 / 어때요
    note: 12단원에서 처음 배웠어요. 여기서는 날씨를 물을 때 다시 쓰여요.
    example_gloss: 너희 집은 어때요?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: '복습: ~이다/있다 (단수, 복수)'
    gloss: ~이다/있다 (단수), ~이다/있다 (복수)
    note: 이 단원의 날씨 존재문 전체가 바탕으로 하는 단수/복수 동사 한 쌍이에요.
    example_gloss:
    - 오늘은 날씨가 좋아요.
    - 집에 방이 세 개 있어요.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: 해 / 햇빛
    gloss: 해 / 햇빛
    note: '새로 나온 명사예요. 단순한 존재문으로 말해요: *aaj dhoop hai* = "오늘은 맑아요" (직역하면 "오늘 햇빛이 있어요").'
    example_gloss: 오늘은 화창해요.
  hi.a1.unit19.lesson01.teach.baarish:
    title: 비
    gloss: 비
    note: '새로 나온 명사예요. 단순한 존재문으로 말해요: *aaj baarish hai* = "오늘은 비가 와요".'
    example_gloss: 오늘은 비가 와요.
  hi.a1.unit19.lesson01.teach.hawa:
    title: 바람
    gloss: 바람
    note: '새로 나온 명사예요. 단순한 존재문으로 말해요: *aaj hawa hai* = "오늘은 바람이 불어요".'
    example_gloss: 오늘은 바람이 불어요.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: 날씨 존재문 패턴
    gloss: '날씨를 말할 때는 ''aaj/kal + [날씨 단어] + hai''라고 해요. 예: ''aaj dhoop hai'', ''aaj baarish hai'', ''aaj hawa hai''. 18단원에서 집의 방을 말할 때 배운 hai/hain 구조와 같지만, 여기서는 수 표현 없이 날씨 단어가 바로 주어가 돼요.'
    note: 이 단원의 첫 문법 설명으로, 새 어휘를 이미 배운 문장 패턴과 연결해 줘요.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: '복습: 날씨'
    gloss: 날씨
    note: 이 단원 1과에서 나온 단어를 다시 써요.
    example_gloss: 오늘 날씨가 어때요?
  hi.a1.unit19.lesson02.teach.garam:
    title: 더운
    gloss: 더운
    note: 새로 나온 형용사예요. 성에 따라 형태가 바뀌지 않아요. 이 과의 문법 설명을 참고하세요.
    example_gloss: 오늘은 날씨가 더워요.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: 추운 (남성 / 여성)
    gloss: 추운 (남성형), 추운 (여성형)
    note: 새로 나온 형용사예요. *garm*과 달리 성에 따라 형태가 바뀌어요. 남성 명사 *mausam*에는 *thanda*를, 여성 명사(18단원의 *rasoi* 등)에는 *thandi*를 써요. 이 과의 문법 설명을 참고하세요.
    example_gloss:
    - 오늘은 날씨가 추워요.
    - 오늘 부엌이 추워요.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: 형태가 변하지 않는 형용사와 성에 맞춰 변하는 형용사
    gloss: '''Garm''은 자음으로 끝나는 형용사라서 성에 따라 바뀌지 않아요. ''mausam garm hai''에서는 항상 ''garm''을 써요. 하지만 ''thanda''/''thandi''는 ''-a''로 끝나는 형용사라서 성에 따라 바뀌어요. 14단원의 ''bada''/''badi''와 똑같아요. 남성 명사 ''mausam''에는 ''thanda''를, 여성 명사에는 ''thandi''를 써요.'
    note: 이 단원의 핵심 문법 대비로, 새 형용사 쌍을 14단원에서 배운 규칙과 연결해 줘요.
  hi.a1.unit19.lesson02.teach.baadal:
    title: 구름
    gloss: 구름
    note: '새로 나온 명사예요. 이 단원에서는 복수 존재문으로만 써요: *aaj baadal hain* = "오늘은 구름이 있어요" / "오늘은 흐려요".'
    example_gloss: 오늘은 구름이 끼었어요.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: '복습: 좋은'
    gloss: 좋은
    note: 9단원에서 처음 배웠어요. 여기서는 날씨를 묘사할 때 다시 쓰여요.
    example_gloss: 오늘은 날씨가 좋아요.
  hi.a1.unit19.lesson02.teach.bura:
    title: 나쁜
    gloss: 나쁜
    note: 새로 나온 형용사로, 이미 배운 *accha*(좋은)와 짝을 이루는 반대말이에요. 이 단원에서는 *mausam*에 맞춰 남성형만 써요.
    example_gloss: 오늘은 날씨가 나빠요.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: '복습: 아주, 매우'
    gloss: 아주
    note: 6단원에서 처음 배웠어요. 여기서는 날씨 묘사를 강조할 때 다시 쓰여요.
    example_gloss: 오늘은 날씨가 아주 추워요.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: '복습: 내일 (어제도 뜻함)'
    gloss: 내일 (문맥에 따라 "어제"도 뜻함)
    note: 4단원에서 처음 배웠고, 12단원에서 "어제"의 뜻으로 다시 나왔어요. 실제 힌디어에서도 실제로 중의적이라서 문맥으로만 구별해요. 이 단원의 문장은 모두 미래나 계획에 관한 것이라서 여기서 'kal'은 "내일"이에요.
    example_gloss: 내일은 비가 와요.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: '복습: 집'
    gloss: 집
    note: 8단원에서 처음 배웠어요. 여기서는 결과로 나온 계획(집에 있기)에 다시 쓰여요.
    example_gloss: 이것은 집이에요.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: '복습: ~에 / ~안에'
    gloss: ~에서 / ~에
    note: 1단원에서 처음 배웠어요. 여기서는 "ghar mein"(집에)에 다시 쓰여요.
    example_gloss: 집에 방이 세 개 있어요.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: '복습: 우리'
    gloss: 우리
    note: 11단원에서 처음 배웠어요. 여기서는 이번 과에서 계획을 세우는 주어로 다시 쓰여요.
    example_gloss: 우리는 영화를 봐요.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: '복습: [그들/우리가] 머물다 / 살다'
    gloss: '[그들/우리가] 머물다 / 살다'
    note: 5단원에서 처음 배웠어요(남성 복수 존대 일치로 단수인 할아버지에게 쓰였어요). 이번 단원에서는 처음으로 진짜 복수 주어 'hum'(우리)과 함께 쓰는데, 같은 동사 형태를 더 단순하게 적용한 거예요.
    example_gloss: 저희 할아버지는 델리에 사세요.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: '복습: ~하자 / 자, 가자'
    gloss: ~하자 / 자, 가자
    note: 1단원에서 처음 배웠고, 6·7·11단원에서 습관 복수 동사와 함께 "~하자"라는 뜻으로 쓰였어요. 여기서도 같은 방식으로 쓰여요.
    example_gloss: 뭐 좀 먹자!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: '복습: 가다'
    gloss: 가다
    note: 15단원에서 기본형으로 처음 배웠어요. 이번 과에서는 습관 복수형 'jaate hain'(우리는 가요)으로 확장해요. 11단원에서 'dekhte hain'/'peete hain'을 만든 방식과 같아요.
    example_gloss: 저는 역에 가야 해요.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: '복습: 그리고 / 와'
    gloss: 그리고
    note: 1단원에서 처음 배웠어요. 여기서는 내일의 날씨와 기온을 이어 주는 데 다시 쓰여요.
    example_gloss: 내일은 비가 오고 날씨가 추울 거예요.
  hi.a1.unit19.lesson03.teach.bahar:
    title: 밖
    gloss: 밖
    note: 새로 나오는 단어로, 이번 과에서 결과로 나온 계획에 쓰는 어휘예요.
    example_gloss: 밖에 나가자!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: 밖에 나가자!
    gloss: 밖에 나가자!
    note: '''Chalo''에 습관 복수형 ''jaate hain''(''jaana'', 가다에서 나온 형태)을 붙인 거예요. 1·6·7·11단원에서 익힌 "~하자" 패턴과 같아요.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: 아르준이 프리야에게 오늘 날씨를 물어요
    gloss: 프리야, 오늘 날씨가 어때요?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: 프리야가 오늘 날씨를 말해 줘요
    gloss: 오늘은 햇볕이 나고 날씨가 더워요.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: 아르준이 밖에 나가자고 제안해요
    gloss: 좋아요! 밖에 나가요.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: 프리야가 내일 날씨를 물어요
    gloss: 좋아요! 그럼 내일 날씨는 어때요?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: 아르준이 내일 날씨를 말해 줘요
    gloss: 내일은 비가 오고 날씨가 추울 거예요.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: 프리야가 집에 있자고 제안해요
    gloss: 그럼 내일은 우리 집에 있을까요?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: 아르준이 동의해요
    gloss: 네, 내일은 집에 있어요.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: 프리야가 동의해요
    gloss: 좋아요!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: 세 가지 핵심 규칙
    gloss: '이번 단원의 세 가지 핵심 규칙: (1) ''aaj/kal + [날씨 단어] + hai/hain''으로 날씨를 말해요. (2) ''garm''은 성에 따라 변하지 않지만 ''thanda''/''thandi''는 변해요. ''bada''/''badi''와 같아요. (3) ''chalo'' + 습관 복수 동사(''jaate hain'' 등)로 제안을 해요 -- ''chalo, bahar jaate hain!''.'
    note: 단원 전체의 문법을 하나로 묶는 마무리 요약이에요. 15~18단원의 문법 정리 노트와 같은 방식이에요.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: 오늘과 내일에 대한 글 읽기
    gloss: 오늘은 날씨가 덥고 햇볕이 나요. 밖에 나가요! 내일은 비가 오고 날씨가 추울 거예요. 내일은 우리 집에 있어요.
    note: 새로운 이야기 설정 없이, 대화에서 이미 나온 내용만 그대로 짧게 정리한 글이에요. 새로운 내용은 없고, '짧은 일기예보 읽기'라는 목표에 바로 맞는 글이에요.
    glosses:
      आज: 오늘
      मौसम: 날씨
      गर्म: 더운
      धूप: 햇볕
      चलो: ~하자
      बाहर: 밖에
      जाते: 가요 (जाना에서)
      कल: 내일
      बारिश: 비
      ठंडा: 추운
      रहते: 머물다 / 살다 (रहना에서)
exercises:
  hi.a1.unit19.lesson01.exercise01.select_mausam_meaning:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 날씨
    distractors:
    - 해
    - 비
    accepted_answers:
    - 날씨
  hi.a1.unit19.lesson01.exercise02.select_dhoop_meaning:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 해 / 햇볕
    distractors:
    - 비
    - 바람
    accepted_answers:
    - 해 / 햇볕
  hi.a1.unit19.lesson01.exercise03.select_aaj_mausam_kaisa_hai_meaning:
    instruction: 이 문장은 무슨 뜻인가요?
    correct_option: 오늘 날씨가 어때요?
    distractors:
    - 내일 날씨가 어때요?
    - 오늘 기분이 어때요?
    accepted_answers:
    - 오늘 날씨가 어때요?
  hi.a1.unit19.lesson01.exercise04.listen_aaj_baarish_hai:
    instruction: 듣고 들은 내용을 고르세요.
    correct_option: 오늘은 비가 와요.
    distractors:
    - 오늘은 햇볕이 나요.
    - 오늘은 바람이 불어요.
    accepted_answers:
    - 오늘은 비가 와요.
  hi.a1.unit19.lesson01.exercise05.select_hawa_meaning:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 바람
    distractors:
    - 비
    - 해 / 햇볕
    accepted_answers:
    - 바람
  hi.a1.unit19.lesson01.exercise06.match_lesson01_words:
    instruction: 각 힌디어 단어를 한국어 뜻과 연결하세요.
