answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule 7단원 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 힌디어 A1
units:
  hi.a1.unit15.travel:
    title: 여행
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: 저는 역에 가야 해요
  hi.a1.unit15.lesson02.platform_samay:
    title: 플랫폼 번호와 시간
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: '프리야와 아르준: 역에서'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: '복습: 역, 나에게, ~이다'
    gloss: 역, 나에게 / 나한테, ~이다
    note: 이번 단원의 의무 표현을 만드는 데 필요한 장소 명사와 계사(~이다)를 간단히 복습해요.
    example_gloss:
    - 역은 여기에 있어요.
    - 저는 할 일이 있어요.
  hi.a1.unit15.lesson01.teach.jaana:
    title: 가다
    gloss: 가다 (동사 원형)
    note: 9단원에서 배운 तुम 명령형 *jao*의 바탕이 되는 동사의 원형이에요. 이번 단원에서는 이 기본 원형 자체를 처음 배워요.
    example_gloss: 저는 가야 해요.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + 동사 + hai = ~해야 해요
    gloss: '''Mujhe''는 앞서 ''chahiye''(6단원, 명사와 함께)와 ''hai''(11단원, ''mujhe kaam hai'' 같은 표현으로 ''저는 할 일이 있어요'')와 함께 배웠어요. 이제 동사와도 함께 쓰여요. ''mujhe jana hai''는 ''저는 가야 해요''라는 뜻이에요. ''jana''와 함께 쓰는 ''hai''는 그대로이고 ''hain''으로 바뀌지 않아요. 말하는 사람에 따라 일치시키지 않아요.'
    note: 이미 배운 대명사+계사 패턴의 세 번째 쓰임이에요. 새 동사를 배우기 전에 앞서 배운 두 가지 쓰임을 단원 번호와 함께 짚어 줘요.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: 저는 역에 가야 해요.
    gloss: 저는 역에 가야 해요.
    note: 이 단원에서 의무 표현이 처음으로 완전한 문장으로 나오는 예문이에요.
  hi.a1.unit15.lesson01.teach.tiket:
    title: 표
    gloss: 표, 승차권
    note: 이번 여행 단원 내내 필요한 새 명사예요.
    example_gloss: 제 표는 어디에 있어요?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: '복습: 원하다 / 필요하다'
    gloss: 원하다 / 필요하다
    note: 6단원에서 음료와 함께 처음 배웠고, 여기서는 표와 함께 다시 써요.
    example_gloss: 저는 차를 마시고 싶어요.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: 저는 표가 필요해요.
    gloss: 저는 표가 필요해요.
    note: 이미 배운 *mujhe...chahiye* 패턴을 이번 단원의 새 명사에 적용했어요.
  hi.a1.unit15.lesson01.teach.train:
    title: 기차
    gloss: 기차
    note: 새 명사예요.
    example_gloss: 기차는 커요.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: '복습: 델리, ~의'
    gloss: 델리, ~의 (소유 표지)
    note: 델리는 5단원에서 처음 배웠고, 소유 표지 *ka*는 5~14단원 등 코스 내내 써 왔어요. 여기서는 표의 목적지를 말하는 데 다시 써요.
    example_gloss:
    - 제 형은 델리에 살아요.
    - 이건 아르준의 가방이에요.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: 저는 델리행 표가 필요해요.
    gloss: 저는 델리행 표가 필요해요.
    note: 이번 단원의 명사에 소유 표지 패턴을 결합해 구체적인 목적지를 나타내요.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: '복습: 어디, 너에게'
    gloss: 어디, 너에게 / 너한테
    note: 둘 다 이미 배웠어요(8단원과 6단원). 여기서는 상대가 어디에 가야 하는지 물을 때 다시 써요.
    example_gloss:
    - 은행은 어디에 있어요?
    - 무엇을 원하세요?
  hi.a1.unit15.lesson02.teach.number_review:
    title: '복습: 번호'
    gloss: 번호
    note: 2단원에서 전화번호를 말할 때 처음 배웠고, 여기서는 플랫폼 번호에 다시 써요.
    example_gloss: 전화번호가 어떻게 되세요?
  hi.a1.unit15.lesson02.teach.platform:
    title: 승강장
    gloss: 승강장
    note: 새 명사로, 기차역의 플랫폼을 뜻하는 표준 힌디어 단어예요. 널리 쓰이는 외래어이고, 2단원의 *phone*과 같은 경우예요.
    example_gloss: 플랫폼은 커요.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: 플랫폼 번호가 몇 번이에요?
    gloss: 플랫폼 번호가 몇 번이에요?
    note: 전화번호, 가격, 나이 등에 이미 써 온 *kya hai* 질문 패턴을 새로운 주제에 다시 써요.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: 플랫폼 번호는 3번이에요.
    gloss: 플랫폼 번호는 3번이에요.
    note: 위 질문에 대한 자연스러운 완전한 문장 대답이에요.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (여성형 일치)
    gloss: '''Jaati hai''는 10단원의 -ta/-ti/-te + hai/hain 규칙을 새 동사 ''jana''에 적용한 거예요. ''기차''는 문법상 여성이라서 ''jaata hai''가 아니라 ''jaati hai''가 돼요.'
    note: 이미 배운 습관적 현재형의 일치 패턴을 새 동사와, 문법상 여성인 새 명사에 그대로 확장한 거예요.
  hi.a1.unit15.lesson02.teach.se_review:
    title: '복습: ~에서, ~부터'
    gloss: ~에서
    note: 9단원에서 길 안내와 함께 처음 배웠고, 여기서는 기차가 출발하는 플랫폼을 말할 때 다시 써요.
    example_gloss: 여기서부터 쭉 가세요.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: 기차는 3번 플랫폼에서 출발해요.
    gloss: 기차는 3번 플랫폼에서 출발해요.
    note: 이번 단원의 습관적 현재형 동사와 이미 배운 '~에서'를 뜻하는 후치사를 결합했어요.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: '복습: 몇 시'
    gloss: 몇 시
    note: 4단원에서 시각을 말할 때 처음 배웠어요. 여기서는 출발 시각을 묻는 데 다시 쓰여요.
    example_gloss: 몇 시예요?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: 기차는 몇 시에 출발해요?
    gloss: 기차는 몇 시에 출발해요?
    note: '''몇 시에''라는 질문을 현재 시각이 아니라 정해진 출발 시각에 쓴 거예요.'
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: 기차는 6시에 출발해요.
    gloss: 기차는 6시에 출발해요.
    note: 자연스러운 완전한 문장 대답이에요. 4단원의 복수형 *baje*를 다시 썼어요. 6시는 *baja*라는 예외가 아니에요. 이 예외는 1시에만 쓰여요.
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: 표는 얼마예요?
    gloss: 표는 얼마예요?
    note: 7단원의 *kitne ka/ki* 가격 질문을 다시 쓴 거예요. *Tikat*은 보통 남성(*ka*)으로 보지만, 여성(*kitne ki*)으로 쓰는 사람도 많고 그것도 맞아요.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: '복습: 루피, 50'
    gloss: 루피, 50
    note: 둘 다 2단원에서 가격과 수량을 말할 때 처음 배웠어요. 여기서는 표 값을 말할 때 다시 쓰여요.
    example_gloss: 저는 50루피가 있어요.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: 표는 50루피예요.
    gloss: 표는 50루피예요.
    note: 위의 가격 질문에 대한 자연스러운 완전한 문장 대답이에요.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: 우리는, 우리에게
    gloss: 우리, 우리에게
    note: '''Hum''(우리)은 11단원에서 이 과정의 첫 1인칭 복수 대명사로 이미 나왔어요. ''hamein''은 그 여격형이고, 함께 이동하는 대화에 필요해요.'
    example_gloss:
    - 우리는 잘 지내요.
    - 우리는 역에 가야 해요.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: 네 번째 여격 대명사'
    gloss: '''Hamein''은 ''hum''(11단원)의 여격형으로, ''mujhe''(main)나 ''tumhein''(tum)과 같은 방식이에요. 여기서도 ''jana''와 함께 쓰는 ''hai''는 그대로이고 ''hain''이 되지 않아요. ''hum''/''hamein''에 맞춰 바뀌지 않아요.'
    note: 앞서 나온 세 여격 대명사를 단원 번호와 함께 짚은 뒤 네 번째를 더했어요. 'hai'가 주어가 아니라 동사에 맞춰진다는 1과 문법 노트의 요점도 다시 짚어요.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: 우리는 역에 가야 해요.
    gloss: 우리는 역에 가야 해요.
    note: 새로 나온 복수 여격 대명사를 쓴 의무 표현이에요.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: '복습: ~의 (여성형)'
    gloss: ~의 (소유 표지, 여성형)
    note: 7단원에서 *ka*/*kitne*와 함께 처음 배웠어요. 여기서는 '기차'가 문법상 여성이라서 소유 표지가 'ka'가 아니라 'ki'가 되기 때문에 다시 나와요.
    example_gloss: 이것은 델리행 기차예요.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: 아르준이 가야 한다고 말해요
    gloss: 프리야, 우리 역에 가야 해요.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: 프리야는 델리행 표가 필요해요
    gloss: 알겠어요. 저는 델리행 표가 필요해요.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: 아르준이 가격을 물어요
    gloss: 저도요. 표는 얼마예요?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: 프리야가 가격을 알려 줘요
    gloss: 표는 50루피예요.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: 아르준이 출발 시각을 물어요
    gloss: 좋아요. 기차는 몇 시에 출발해요?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: 프리야가 시각과 플랫폼을 알려 줘요
    gloss: 기차는 6시에 3번 플랫폼에서 출발해요.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: 아르준이 이해하고 가자고 말해요
    gloss: 알겠어요. 가요!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: 프리야가 동의해요
    gloss: 가요!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: 세 가지 핵심 규칙
    gloss: '이 단원의 세 가지 핵심 규칙: (1) ''mujhe/tumhein/hamein + 동사 + hai''는 ''~해야 해요''라는 뜻이에요. (2) ''X kitne ka/ki hai?''는 가격을 묻는 말이에요. (3) ''X [시각] baje [장소] se jaati hai''는 이동의 시각과 장소를 말해 줘요.'
    note: 단원 전체의 문법을 하나로 묶은 마무리 요약이에요. 14단원의 문법 노트가 활용을 묶어 정리한 것과 같은 방식이에요.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: 표 읽기
    gloss: '표: 델리. 3번 플랫폼. 6시.'
    note: 실제 표처럼 완전한 문장 없이 짧은 단편으로 된 글이에요. 대화에서 이미 나온 정보만 다시 보여 주고 새로운 내용은 없어요.
    glosses:
      टिकट: 표, 승차권
      प्लेटफ़ॉर्म: 승강장
      नंबर: 번호
      बजे: 시
exercises:
  hi.a1.unit15.lesson01.exercise01.select_tiket_meaning:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 표, 승차권
    distractors:
    - 기차
    - 역
    accepted_answers:
    - 표, 승차권
  hi.a1.unit15.lesson01.exercise02.select_train_meaning:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 기차
    distractors:
    - 표, 승차권
    - 승강장
    accepted_answers:
    - 기차
  hi.a1.unit15.lesson01.exercise03.select_mujhe_station_jana_hai_meaning:
    instruction: 이 문장은 무슨 뜻인가요?
    correct_option: 저는 역에 가야 해요.
    distractors:
    - 저는 역에 있어요.
    - 표가 있어요.
    accepted_answers:
    - 저는 역에 가야 해요.
  hi.a1.unit15.lesson01.exercise04.listen_mujhe_station_jana_hai:
    instruction: 듣고 들은 내용을 고르세요.
    correct_option: 저는 역에 가야 해요.
    distractors:
    - 저는 은행에 가야 해요.
    - 저는 표가 필요해요.
    accepted_answers:
    - 저는 역에 가야 해요.
  hi.a1.unit15.lesson01.exercise05.select_mujhe_tiket_chahiye_meaning:
    instruction: 이 문장은 무슨 뜻인가요?
    correct_option: 저는 표가 필요해요.
    distractors:
    - 표가 있어요.
    - 저는 표를 샀어요.
    accepted_answers:
    - 저는 표가 필요해요.
  hi.a1.unit15.lesson01.exercise06.match_lesson01_words:
    instruction: 각 힌디어 단어를 한국어 뜻과 연결하세요.
    correct_response:
      टिकट: 표, 승차권
      ट्रेन: 기차
