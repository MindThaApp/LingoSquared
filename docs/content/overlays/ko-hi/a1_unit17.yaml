teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: '복습: 너, 너의, 무엇'
    gloss: 너(친근한 사이), 너의(친근한 사이), 무엇
    note: 친구에게 직업을 물어볼 때 필요한 단어들을 간단히 복습해요.
    example_gloss: 네 이름이 뭐예요?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: '복습: 아르준, 프리야'
    gloss: 아르준, 프리야
    note: 이번 과에서 성별에 따라 달라지는 질문의 기준으로 쓰이는 두 인물의 이름을 다시 떠올려 봐요.
    example_gloss:
    - 제 이름은 아르준이에요.
    - 제 이름은 프리야예요.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: '복습: 나, 이다(am), 이다(is), 이다(are)'
    gloss: 나, ~이에요(나), ~이에요(그/그녀/그것), ~이에요(친근한 사이의 너)
    note: 이번 단원의 신분·직업 문장에 필요한 작은 be동사 세트를 모두 모았어요.
    example_gloss:
    - 괜찮아요?
    - 저는 괜찮아요.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: '복습: 일'
    gloss: 일
    note: 10~11단원에서 처음 배운 단어예요. 이번 단원 전체의 주제어로 다시 쓰여요.
    example_gloss: 저는 할 일이 있어요.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: 하다 (너, 남성 / 너, 여성 / 나, 남성)
    gloss: 해요(친근한 사이의 남성 너), 해요(친근한 사이의 여성 너), 해요(남성인 나)
    note: 10단원에서 이미 배운 -ता/-ती/-ते 일치 규칙(1단원의 *kya tum yog karti ho?*에서도 나왔어요)을 동사 *karna*(하다)에도 적용해요.
    example_gloss:
    - 무슨 일을 하세요?
    - 저는 아침을 먹어요.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: 무슨 일을 해요? (남성에게)
    gloss: 무슨 일을 해요?
    note: 이번 과의 첫 질문으로, 남자 친구에게 하는 말이에요.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: 무슨 일을 해요? (여성에게)
    gloss: 무슨 일을 해요?
    note: 같은 질문을 여자 친구에게 하는 거예요. 동사 어미만 바뀌어요.
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: 교사 (남성 / 여성)
    gloss: 교사(남성), 교사(여성)
    note: 새로 배우는 직업 명사 쌍이에요. 지금까지 배운 대부분의 명사와 달리 말하는 사람 자신의 성별에 따라 형태가 바뀌어요. 이번 과의 문법 설명을 참고하세요.
    example_gloss:
    - 저는 교사예요. (남성)
    - 저는 교사예요. (여성)
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + 직업 + hoon
    gloss: '''Mein + 직업 + hoon''은 직업을 말하는 표현으로, 1단원의 ''mein...hoon'' 틀과 같아요. 일부 직업은 말하는 사람 자신의 성별에 따라 달라져요. ''shikshak''(남성), ''shikshika''(여성)처럼요. 10단원에서 동사 어미 -ta/-ti가 바뀌던 것과 같은 원리예요. ''Doctor''와 ''engineer''는 바뀌지 않아요. 남녀 모두 같은 단어를 써요.'
    note: 성별에 따라 바뀌는 명사와 바뀌지 않는 외래어 명사로 나뉜다는 점을 연습 문제에서 쓰기 전에 미리 분명히 알려 줘요.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: '복습: 의사'
    gloss: 의사
    note: 16단원에서 처음 배운 단어예요. 여기서는 성별에 따라 바뀌지 않는 직업으로 다시 쓰여요.
    example_gloss: 그는/그녀는 의사예요.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: 저는 의사예요.
    gloss: 저는 의사예요.
    note: 복습 단어에 신분을 말하는 문형을 적용했어요.
  hi.a1.unit17.lesson01.teach.engineer:
    title: 엔지니어
    gloss: 엔지니어
    note: 새로 배우는 직업 명사예요. *doctor*처럼 성별에 따라 바뀌지 않아요.
    example_gloss: 그는/그녀는 엔지니어예요.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: 저는 엔지니어예요.
    gloss: 저는 엔지니어예요.
    note: 이번 과에서 새로 배우는 두 번째 직업에 신분을 말하는 문형을 적용했어요.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: '복습: 어디'
    gloss: 어디
    note: 1단원에서 처음 배운 단어예요. 여기서는 일하는 곳을 물을 때 다시 쓰여요.
    example_gloss: 병원이 어디예요?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: '복습: ~에서 / ~에'
    gloss: ~에서 / ~에
    note: 1단원에서 처음 배운 단어예요. 여기서는 일하는 곳을 말할 때 다시 쓰여요.
    example_gloss: 저는 런던에 살아요.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: 어디에서 일해요? (남성에게)
    gloss: 어디에서 일해요?
    note: 이번 과의 첫 질문으로, 남자 친구에게 하는 말이에요.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: 어디에서 일해요? (여성에게)
    gloss: 어디에서 일해요?
    note: 같은 질문을 여자 친구에게 하는 거예요.
  hi.a1.unit17.lesson02.teach.school_review:
    title: '복습: 학교'
    gloss: 학교
    note: 8단원에서 처음 배운 단어예요. 이번 과의 첫 번째 일터예요.
    example_gloss: 저는 학교에서 일해요. (여성 화자)
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: 저는 학교에서 일해요.
    gloss: 저는 학교에서 일해요.
    note: 일터 문형을 학교에 적용한 여성형 문장이에요.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: '복습: 병원'
    gloss: 병원
    note: 8단원에서 처음 배운 단어예요. 이번 과의 두 번째 일터로, 의사라는 직업과 짝을 이뤄요.
    example_gloss: 의사는 병원에서 일해요.
  hi.a1.unit17.lesson02.teach.daftar:
    title: 사무실
    gloss: 사무실
    note: 새로 배우는 명사예요. 이번 과의 세 번째 일터로, 엔지니어라는 직업과 짝을 이뤄요.
    example_gloss: 저는 사무실에서 일해요. (남성 화자)
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: 저는 사무실에서 일해요.
    gloss: 저는 사무실에서 일해요.
    note: 일터 문형을 사무실에 적용한 남성형 문장이에요.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: 장소 + mein + kaam karta/karti hoon
    gloss: '''[장소] + mein + kaam karta/karti hoon''은 이미 아는 세 가지를 하나로 합친 표현이에요. ''mein''(1단원, ''London mein rehta hoon''), ''kaam''(10/11단원), 그리고 ''karna''의 -ta/-ti/-te 형태(10단원의 ''nashta karta hoon'', 1단원의 ''kya tum yog karti ho?'')예요. 새로운 문법이 아니라, 세 가지를 처음으로 한 문장에 합친 것뿐이에요.'
    note: 이미 배운 각 요소가 몇 단원에서 나왔는지 짚어 준 다음 합쳐요. 앞선 문법 설명들과 같은 방식이에요.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: '복습: 매일'
    gloss: 매일
    note: 10단원에서 처음 배운 단어예요. 여기서는 매일의 근무 일과를 말할 때 다시 쓰여요.
    example_gloss: 저는 매일 일해요.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: '복습: 가다 (너, 여성 / 너, 남성 / 나, 남성)'
    gloss: 가요(친근한 사이의 여성 너), 가요(친근한 사이의 남성 너), 가요(남성인 나)
    note: 10단원에서 처음 나온 *jana*(가다)의 -ta/-ti/-te 형태예요. 여기서는 매일의 출근길을 말할 때 다시 쓰여요.
    example_gloss:
    - 저는 매일 학교에 가요. (여성 화자)
    - 매일 사무실에 가요? (남성에게)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: '복습: ~도, 네'
    gloss: ~도, 네
    note: 둘 다 이미 배운 단어예요(1단원, 그리고 1/6/13단원). 이번 과의 대화에서 다시 쓰여요.
    example_gloss: 네, 저도 좋았어요.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: 아르준이 프리야에게 직업을 물어요
    gloss: 프리야, 무슨 일을 해요?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: 프리야가 학교 교사라고 말해요
    gloss: 저는 교사예요. 학교에서 일해요.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: 아르준이 매일 학교에 가는지 물어요
    gloss: 그렇군요! 매일 학교에 가요?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: 프리야가 그렇다고 답하고 아르준에게 같은 질문을 해요
    gloss: 네, 저는 매일 학교에 가요. 당신은 무슨 일을 해요?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: 아르준이 사무실에서 일하는 엔지니어라고 말해요
    gloss: 저는 엔지니어예요. 사무실에서 일해요.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: 프리야가 그도 매일 사무실에 가는지 물어요
    gloss: 정말 좋네요! 당신도 매일 사무실에 가요?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: 아르준이 그렇다고 답해요
    gloss: 네, 저는 매일 사무실에 가요.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: 프리야가 고마움을 표현해요
    gloss: 알겠어요, 고마워요.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: 세 가지 핵심 규칙
    gloss: '이번 단원의 세 가지 핵심 규칙이에요. (1) ''mein + 직업 + hoon''으로 직업을 말해요(예: ''mein shikshika hoon''). 일부 직업은 말하는 사람 자신의 성별에 따라 달라져요. (2) ''[장소] + mein + kaam karta/karti hoon''으로 일터를 말해요(예: ''mein daftar mein kaam karta hoon''). (3) ''roz [장소] jata/jati hoon''으로 매일의 습관을 말해요. 10단원과 같은 -ta/-ti 규칙이에요.'
    note: 이번 단원의 문법을 하나로 묶는 마무리 요약이에요. 15/16단원의 문법 설명처럼 활용형을 한데 정리해 줘요.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: 짧은 소개글 읽기
    gloss: 프리야는 교사예요. 학교에서 일해요. 아르준은 엔지니어예요. 사무실에서 일해요.
    note: 대화에서 이미 나온 사실만 그대로 담은 짧고 간단한 소개글이에요. 새로운 내용은 없고, 직장 소개글 읽기라는 이번 목표에 꼭 맞아요.
    glosses:
      शिक्षिका: 교사(여성)
      स्कूल: 학교
      काम: 일, 직장
      करती: 해요 / 일해요 (여성형, karna 동사)
      इंजीनियर: 엔지니어
      दफ़्तर: 사무실
      करता: 해요 / 일해요 (남성형, karna 동사)
