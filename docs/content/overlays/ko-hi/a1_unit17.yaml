  hi.a1.unit17.lesson01.exercise06.match_lesson01_words:
    instruction: 각 힌디어 단어를 한국어 뜻과 연결하세요.
    correct_response:
      शिक्षक: 교사(남성)
      शिक्षिका: 교사(여성)
      इंजीनियर: 엔지니어
      डॉक्टर: 의사
      काम: 일하다
      करते: 하다(너, 남성)
      करती: 하다(너, 여성)
      तुम: 너 (친근한 말)
      क्या: 무엇
      हूँ: (나는) ~이다
    pairs:
    - left: शिक्षक
      right: 교사(남성)
