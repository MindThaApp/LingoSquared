    distractors:
    - 저는 의사예요.
    - 저는 엔지니어예요.
    accepted_answers:
    - 저는 교사예요. (여성)
  hi.a1.unit17.lesson01.exercise05.select_engineer_meaning:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 엔지니어
    distractors:
    - 교사
    - 의사
    accepted_answers:
