teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '힌디어는 취미를 *-ना*로 끝나는 동사로 나타내요: *पढ़ना*, *कसरत करना*, *खाना बनाना*(''읽기'', ''운동하기'', ''요리하기'').'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: 여가 시간
    gloss: 여가 시간
    note: '*खाली समय*(''빈 시간'')은 취미를 말할 때 쓰는 핵심 표현이고, *में*가 ''~에''를 나타내서 *खाली समय में*가 돼요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*मुझे ... पढ़ना पसंद है*(''저에게는 읽는 것이 좋다'')는 힌디어로 ''저는 읽는 것을 좋아해요''라고 말하는 방식이고, *मुझे*가 좋아하는 사람을 나타내요.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 세 가지를 더 배워요: *संगीत सुनना*, *चित्र बनाना*, *गेम खेलना*. *गेम*은 영어에서 온 외래어예요.'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*संगीत सुनना*(''음악 듣기'')는 따로 조사가 필요 없어요. 목적어가 바로 동사 앞에 와요.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*दोस्तों के साथ*(''친구들과'')에서는 *के साथ* 앞에 오기 때문에 *दोस्त*가 사선 복수형(*दोस्तों*)이 돼요.'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '*हमेशा*, *अक्सर*, *कभी-कभी*, *कभी नहीं* 같은 빈도 부사는 보통 동사 앞에 오고, *कभी नहीं*는 ''전혀 ~ 않다''라는 뜻이에요.'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*हर*(''모든'', ''~마다'')는 절대 변하지 않고, 뒤에 오는 시간 명사도 기본형 그대로예요: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर는 변하지 않아요
    gloss: 매주, 주말마다.
    note: '*हर*는 뒤에 어떤 명사가 와도 그대로라서 고를 형태가 없어요: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: 프리야가 취미 이야기를 꺼내요
    gloss: '프리야: 우리는 자주 같이 산책해요. 그런데 아르준, 너는 여가 시간에 또 뭐 해?'
    note: 주어가 *हम*('우리')이기 때문에 *टहलते हैं*는 복수형이고, *अक्सर*는 동사 앞에 와요.
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: 아르준의 취미
    gloss: '아르준: 나는 요리하는 걸 좋아해, 집에서도. 그리고 운동도 자주 해.'
    note: '*घर पर भी*(''집에서도'')는 아르준이 일터에서만이 아니라 즐기려고 요리한다는 것을 보여 줘요.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: 프리야가 놀라요
    gloss: '프리야: 집에서도 요리를 해? 너는 일터에서 하루 종일 요리하잖아!'
    note: '*पूरा दिन*(''하루 종일'')은 이미 일터에서 요리를 많이 한다는 점을 강조하고, *तो*는 강조를 더해요.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: 아르준이 설명해요
    gloss: '아르준: 응, 근데 나는 요리하면 마음이 편해져. 너는 뭘 좋아해?'
    note: '*खाना बनाने से सुकून मिलता है*는 ''요리하면 마음이 편해져요''라는 뜻이에요(직역하면 ''요리로부터 평온을 얻는다''). *से* 앞에서는 *बनाना*가 *बनाने*로 바뀌어요.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: 프리야의 취미
    gloss: '프리야: 나는 책 읽는 걸 좋아하고 음악도 자주 들어.'
    note: '*और*(''그리고'')가 두 취미를 이어 주고, 프리야가 말하고 있으므로 *सुनती हूँ*는 여성형이에요.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: 아르준이 게임에 대해 물어요
    gloss: '아르준: 너는 게임도 해?'
    note: 짧은 예/아니요 질문이에요. *क्या*로 시작하고, 아르준이 프리야에게 묻고 있으므로 *खेलती हो*는 여성형이에요.
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: 프리야가 대답해요
    gloss: '프리야: 아니, 나는 게임은 전혀 안 해. 하지만 가끔 그림은 그려!'
    note: '*कभी ... नहीं*(''전혀 ~ 않다'')와 *कभी-कभी*(''가끔'')가 한 대답 안에서 대비돼요.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: 취미 비교하기
    gloss: 아르준과 나는 자주 같이 산책해요. 하지만 다른 취미도 있어요. 아르준은 요리하는 걸 좋아하는데, 집에서도 해요. 그리고 운동도 자주 해요. 저는 책 읽는 걸 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만, 게임은 전혀 하지 않아요. 여러분은 여가 시간에 뭘 하는 걸 좋아하나요?
    note: 프리야의 메시지는 앞에서 배운 내용을 정리하고, 읽는 사람에게 이번 단원의 핵심 질문을 던지며 끝나요.
    glosses:
      टहलते: 산책하다
      अक्सर: 자주
      साथ: 함께
      और: 다른
      बनाना: 만들기(요리)
      पसंद: 즐겨
      घर: 집에서
      कसरत: 운동하다
      पढ़ना: 읽다
      सुनती: 듣다
      संगीत: 음악
      चित्र: 그림(그리기)
      कभी-कभी: 가끔
      गेम: 게임하다
      कभी: 전혀 (부정문과 함께)
      खाली: 자유로운
      समय: 시간
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: 아르준이 주말 계획을 물어요
    gloss: '아르준: 너 이번 주말에 뭐 해?'
    note: '*इस वीकेंड*(''이번 주말'')는 명사 앞에 *इस*를 두고, *कर रही हो*는 ''하고 있다/할 예정이다''를 나타내는 진행형이며 프리야에게 묻는 말이라 여성형이에요.'
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: 프리야는 아직 정하지 못했어요
    gloss: '프리야: 아직 모르겠어. 책 읽는 걸 좋아하는데, 밖에도 나가고 싶어.'
    note: '*बाहर जाना चाहती हूँ*는 ''밖에 나가고 싶어요''라는 뜻이고, *चाहती*는 여성형이며 *जाना* 뒤에 와요.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: 아르준이 계획을 제안해요
    gloss: '아르준: 같이 산책할까? 그다음에 내가 우리 먹을 요리를 할게.'
    note: '*उसके बाद*(''그 후에'')는 두 계획의 순서를 정해 주고, *चलो ... टहलें*는 첫 번째 계획을 제안해요.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: 프리야가 동의해요
    gloss: '프리야: 좋은 생각이야! 나는 산책도 요리도 둘 다 좋아해.'
    note: '*दोनों पसंद हैं*는 프리야가 둘 다 똑같이 좋아한다는 것을 보여 주고, 동사는 복수형 *हैं*이에요.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: 아르준이 약속을 확정해요
    gloss: '아르준: 좋아. 그럼 토요일에 보자!'
    note: '*शनिवार को मिलते हैं*(''토요일에 만나요'')는 정해진 계획에 현재 시제를 쓰고, *को*가 요일을 나타내요.'
