teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: '복습: 아르준, 프리야, ~이다'
    gloss: 아르준, 프리야, ~이다
    note: 두 인물의 이름과, 이 단원에서 비교 문장을 만드는 데 필요한 '이다'에 해당하는 'hai'를 간단히 복습해요.
    example_gloss:
    - 아르준은 잘 지내요.
    - 프리야는 잘 지내요.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: '복습: 큰 / 나이가 많은'
    gloss: 큰 / 나이가 많은 (남성 / 여성)
    note: 5단원에서 형제자매의 나이를 말할 때 처음 배웠어요. 이 단원에서는 두 사람이나 두 사물을 직접 비교할 때로 넓혀요.
    example_gloss:
    - 우리 형(오빠)은 델리에 살아요.
    - 우리 누나(언니)는 델리에 살아요.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: '복습: 작은 / 어린'
    gloss: 작은 / 어린 (남성 / 여성)
    note: 5단원에서 형제자매의 나이를 말할 때 처음 배웠어요. 여기서도 bada/badi와 같은 방식으로 써요.
    example_gloss:
    - 제 남동생은 이제 학생이에요.
    - 제 여동생은 이제 학생이에요.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = ~보다
    gloss: '''Se''는 이미 ''~에서''(9단원, ''yahan se seedhe jao'')와 ''~와 함께''(12단원, ''Priya se mila'')의 뜻으로 배웠어요. 이제 비교의 뜻도 있어요: ''X, Y se ADJ hai''는 ''X가 Y보다 더 ADJ하다''라는 뜻이에요 -- ''Priya Arjun se badi hai''처럼요.'
    note: 이미 배운 단어의 세 번째 뜻을 소개해요. 새 뜻을 배우기 전에 앞서 배운 두 가지 뜻을 단원 번호와 함께 짚어 줘요.
    target_text: '''से''는 앞에서 ''यहाँ से सीधे जाओ''(यूनिट 9, matlab ''~에서'')와 ''प्रिया से मिला''(यूनिट 12, matlab ''~와 함께'')로 배웠어요. 이제 비교에도 쓰여요: ''X, Y से ADJ है''는 ''X가 Y보다 더 ADJ하다''라는 뜻이에요 -- 예를 들어 ''प्रिया अर्जुन से बड़ी है''처럼요.'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: 프리야는 아르준보다 나이가 많아요.
    gloss: 프리야는 아르준보다 나이가 많아요.
    note: se를 쓰는 비교 구문의 이 단원 첫 번째 완전한 예문이에요.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: 키가 큰 / 긴
    gloss: 키가 큰 / 긴 (남성 / 여성)
    note: 새로운 형용사 쌍이에요. 이미 배운 -a/-i 남성/여성 일치 규칙(bada/badi, chota/choti)을 그대로 따라요.
    example_gloss:
    - 우리 형(오빠)은 키가 커요.
    - 우리 누나(언니)는 키가 커요.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: 형용사는 주어에 맞춰요
    gloss: 비교 문장에서 형용사(bada/badi, chota/choti 등)는 항상 'se' 뒤의 단어가 아니라 주어의 성에 맞춰요. 예를 들어 'Arjun Priya se chota hai'에서 'chota'는 Priya가 아니라 주어인 Arjun(남성)에 맞춘 형태예요.
    note: 이미 배운 -a/-i 형용사 일치 규칙을 비교 문장에 직접 적용해 보는 설명이에요.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: 아르준은 프리야보다 어려요.
    gloss: 아르준은 프리야보다 어려요.
    note: 같은 사실을 반대 방향에서 다시 말한 문장이에요. 남성 주어에 형용사가 일치하는 모습을 보여 줘요.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: '복습: 누구, 또는'
    gloss: 누구, 또는
    note: 둘 다 이미 배운 단어예요(5단원, 6/13단원). 여기서는 비교하는 질문을 만드는 데 다시 써요.
    example_gloss: 아르준과 프리야 중 누가 더 나이가 많아요?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: '복습: 모자, 가방'
    gloss: 모자, 가방
    note: 둘 다 7단원 쇼핑 단원에서 처음 배운 명사예요. 여기서는 비교하는 두 대상으로 다시 써요.
    example_gloss:
    - 이 모자는 예뻐요.
    - 이 가방은 예뻐요.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: '복습: 싼, 비싼'
    gloss: 싼, 비싼
    note: 7단원에서 처음 배웠어요. 여기서는 사물을 비교할 때 다시 써요.
    example_gloss:
    - 가방이 싸요.
    - 가방은 비싸요.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: '여성형: sasti, mehngi'
    gloss: '''Sasta''와 ''mehnga''는 여성 명사와 함께 쓰면 ''sasti''와 ''mehngi''가 돼요 -- ''topi sasti hai''(모자가 싸요)처럼요.'
    note: 7단원에서 배운 성 일치 규칙을 짧게 되짚어 줘요. 'topi'(모자)가 여성 명사라서 필요해요.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: 모자가 가방보다 더 싸요.
    gloss: 모자가 가방보다 더 싸요.
    note: se를 쓰는 비교 구문을 두 사람이 아니라 두 사물에 적용한 예문이에요.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: '복습: 더'
    gloss: 더
    note: 13단원에서는 'pasand hai'(선호를 나타낼 때)와만 함께 배웠어요. 이 수업에서는 쓰임을 더 넓혀요.
    example_gloss: 저는 차를 더 좋아해요.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: 어떤 비교에도 쓰는 Zyada
    gloss: '''Zyada''는 앞에서 ''pasand hai''와 함께서만 배웠어요(13단원). 이제는 비교 문장의 어떤 형용사 앞에도 올 수 있어요 -- ''bag topi se zyada mehnga hai''는 ''bag topi se mehnga hai''와 똑같이 ''가방이 모자보다 더 비싸요''라는 뜻이에요. ''Zyada''는 꼭 필요하지는 않고, ''더''를 분명하게 말해 줄 뿐이에요.'
    note: 이미 배운 단어의 위치 규칙을 일반화해서 보여 주는 것일 뿐, 새로운 문법 사항은 아닙니다.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: 가방이 모자보다 더 비싸요.
    gloss: 가방이 모자보다 더 비싸요.
    note: '''se''를 쓰는 같은 비교 구문에 ''더''를 뜻하는 zyada를 덧붙여 말한 형태예요. zyada는 생략해도 돼요.'
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: 새것, 새로운
    gloss: 새로운 (남성형 / 여성형)
    note: 새로운 형용사 쌍이에요. 이 단원의 다른 형용사들과 같은 -a/-i 일치 규칙을 따라요.
    example_gloss:
    - 가방이 새것이에요.
    - 모자가 새것이에요.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: 모자가 가방보다 더 새것이에요.
    gloss: 모자가 가방보다 더 새것이에요.
    note: 앞서 배운 가격 비교와 같은 방식으로, 같은 두 물건의 또 다른 비교(새것인 정도)를 말하는 문장이에요.
  hi.a1.unit14.lesson03.teach.review_words:
    title: '복습: 큰, 작은, 키가 큰, 새로운'
    gloss: 큰/나이가 많은, 작은/어린, 키가 큰/긴, 새로운
    note: 이 단원의 핵심 형용사를 간단히 복습해요. 대화와 읽기 글에 필요해요.
    example_gloss:
    - 프리야가 나이가 더 많아요.
    - 아르준이 더 어려요.
    - 아르준은 키가 커요.
    - 가방이 새것이에요.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: '복습: 나, ~이다'
    gloss: 나, ~이에요
    note: 1단원에서 처음 배운 표현('main theek hun')이에요. 대화에서 아르준이 자기 자신에 대해 말하는 데 필요해요.
    example_gloss: 저는 괜찮아요.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: '복습: 그리고, ~도'
    gloss: 그리고, ~도
    note: 두 단어 모두 앞선 대화문에 나왔지만, 평가 대상 어휘로는 여기서 처음 정식으로 소개해요.
    example_gloss:
    - 저는 차와 커피를 좋아해요.
    - 저도 그게 좋아요.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: '복습: ~의 (소유)'
    gloss: ~의 (소유를 나타내는 표지)
    note: 5~11단원 등에서 이미 계속 써 온 소유 표지예요. 여기서는 누구의 가방을 비교하는지 말할 때 다시 써요.
    example_gloss: 아르준의 가방은 새것이에요.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: 아르준이 새 가방을 보여 줘요
    gloss: 프리야, 이건 제 새 가방이에요.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: 프리야가 모자가 더 싸다고 말해요
    gloss: 가방 좋네요! 그런데 모자가 가방보다 더 싸요.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: 아르준이 자기 가방이 비싸다고 인정해요
    gloss: 네. 제 가방은 비싸요. 모자보다 더 비싸요.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: 프리야가 누가 더 나이가 많은지 물어요
    gloss: 알았어요, 알았어요! 아르준, 누가 더 나이가 많아요, 너예요 나예요?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: 아르준이 대답해요
    gloss: 너가 나이가 더 많아요. 하지만 저는 키가 커요!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: 프리야가 모자가 더 새것이기도 하다고 말해요
    gloss: 알았어요, 알았어요! 그런데 모자가 가방보다 더 새것이기도 해요.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: 아르준이 동의하고 인사를 마무리해요
    gloss: 네, 맞아요. 내일 또 만날까요?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: 프리야가 인사를 마무리해요
    gloss: 좋아요! 내일 만나요.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: 세 가지 핵심 규칙
    gloss: '이 단원의 세 가지 핵심 규칙: (1) ''X, Y se ADJ hai''는 ''X는 Y보다 더 ADJ하다''라는 뜻이에요. (2) ADJ는 항상 Y가 아니라 주어(X)의 성에 일치해요. (3) ADJ 앞에 ''zyada''를 덧붙여 ''X, Y se zyada ADJ hai''라고 할 수도 있어요. 뜻은 그대로 ''Y보다 더 ADJ하다''예요.'
    note: 이 단원의 문법 전체를 하나로 묶어 정리해요. 13단원의 문법 노트가 변화형을 정리한 것과 같은 역할이에요.
    target_text: '이 단원의 세 가지 핵심 규칙: (1) ''X, Y से ADJ है''는 ''X가 Y보다 더 ADJ하다''라는 뜻이에요. (2) ADJ는 항상 주어(X)의 성에 맞추고, Y에는 맞추지 않아요. (3) ADJ 앞에 ''ज़्यादा''를 더할 수도 있어요. 예: ''X, Y से ज़्यादा ADJ है'' -- 뜻은 그대로예요(''Y보다 더 ADJ하다'').'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: 프리야의 쪽지
    gloss: 저는 아르준보다 나이가 많지만, 아르준은 키가 커요. 그리고 제 모자는 좋아요. 모자는 가방보다 싸고, 가방보다 더 새것이기도 해요. - 프리야
    note: 대화에서 이미 나온 내용을 그대로 다시 적은 짧은 글이에요. 새로운 내용은 없어요.
    glosses:
      बड़ी: 나이가 더 많은 (여성형)
      लंबा: 키가 큰
      टोपी: 모자
      अच्छी: 좋은 (여성형)
      बैग: 가방
      सस्ती: 더 싼 / 싼 (여성형)
      नई: 더 새로운 / 새로운 (여성형)
