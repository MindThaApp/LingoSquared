    correct_option: 큰 / 나이가 많은
    distractors:
    - 작은 / 어린
    - 새로운
    accepted_answers:
    - 큰 / 나이가 많은
  hi.a1.unit14.lesson01.exercise03.select_arjun_bada_meaning:
