teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*लंबा*와 *छोटा*는 키를 나타내며 보통 *कद*(''키'')와 함께 써요: *नेहा का कद लंबा है*. 남성 명사에는 *-ा*, 여성 명사에는 *-ी*로 끝나요.'
    example_gloss:
    - 네하는 키가 커요.
    - 비크람은 키가 작아요.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: '*बूढ़ा*와 *जवान*은 숫자 없이 어떤 사람이 나이 들어 보이는지 젊어 보이는지를 나타내요.'
    example_gloss:
    - 할아버지는 나이가 많으세요.
    - 아르준은 젊어요.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र와 बूढ़ा
    gloss: 나이가 어떻게 되세요? 할아버지는 나이가 많으세요.
    note: 정확한 나이를 물을 때 힌디어는 *उम्र*('나이')를 쓰고, *बूढ़ा*는 숫자 없이 나이 든 사람을 나타내요.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: 네하는 키가 크고 비크람은 키가 작아요
    gloss: 네하는 키가 크고 비크람은 키가 작아요.
    note: '*और*(''그리고'')가 두 묘사를 이어 주고, 각각의 *का कद*는 남성 명사 *कद*에 맞춘 형태예요.'
  hi.a1.unit31.lesson02.teach.bal:
    title: 머리카락
    gloss: 머리카락
    note: '*बाल*(''머리카락'')은 힌디어에서 남성 복수 명사라서, 이를 꾸미는 말은 *-े*로 끝나요: *लंबे बाल*.'
    example_gloss: 아르준은 짧은 검은 머리예요.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: 금발, 갈색, 흰색
    gloss: 금발 / 갈색 / 흰색
    note: '머리카락 색 세 가지: *सुनहरे*, *भूरे*, *सफ़ेद*. *बाल* 앞에서는 *-े*로 끝나요.'
    example_gloss:
    - 프리야는 금발이에요.
    - 비크람은 갈색 머리예요.
    - 할아버지는 머리가 하얘요.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*लंबे*(''긴'')와 *छोटे*(''짧은'')는 머리카락을 묘사하며, *बाल*이 복수라서 *-े*로 끝나요.'
    example_gloss:
    - 네하는 머리가 길어요.
    - 비크람은 머리가 짧아요.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: बाल 앞의 형용사
    gloss: 긴 머리, 짧은 머리, 금발 머리, 갈색 머리, 흰 머리, 검은 머리.
    note: '*बाल*은 남성 복수라서 그 앞의 형용사는 *-े*로 끝나요: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: 그의 또는 그녀의'
    gloss: 그의 머리 또는 그녀의 머리가 길어요.
    note: '*उसके*는 ''그의''와 ''그녀의''를 모두 뜻하므로 누구를 가리키는지는 문맥으로만 알 수 있어요. 여기서는 복수형 *बाल*에 맞춘 형태예요.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: 아르준은 짧은 검은 머리예요
    gloss: 아르준은 짧은 검은 머리예요.
    note: '*काले*가 이번에는 머리카락에 쓰였고, *बाल*이 복수라서 *-े*로 끝나요.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: 프리야는 긴 금발이에요
    gloss: 프리야는 긴 금발이에요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: 눈
    gloss: 눈
    note: '*आँखें*(''눈'')은 여성 복수 명사이고, 단수형은 *आँख*예요.'
    example_gloss: 아르준은 눈이 갈색이에요.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '눈 색깔 세 가지: *नीला*, *भूरा*, *हरा*. 여성 명사 *आँखें* 앞에서는 *नीली*, *भूरी*, *हरी*가 돼요.'
    example_gloss:
    - 프리야는 눈이 파란색이에요.
    - 비크람은 눈이 갈색이에요.
    - 네하는 눈이 초록색이에요.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: आँखें 앞의 형용사
    gloss: 파란 눈, 갈색 눈, 초록 눈.
    note: '*आँखें*는 여성이라서 그 앞의 형용사는 *-ी*로 끝나요: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: 프리야는 어떻게 생겼어요?
    gloss: 프리야는 어떻게 생겼어요?
    note: '*कैसी दिखती है?*(''그녀는 어떻게 생겼어요?'')는 핵심 질문이에요. 여자에게는 여성형 *कैसी*와 *दिखती*를, 남자에게는 남성형 *कैसा*와 *दिखता*를 써요.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: 프리야는 긴 금발에 파란 눈이에요
    gloss: 프리야는 긴 금발에 파란 눈이에요.
    note: 모범 답안이에요. 머리카락과 눈을 *और*로 이었어요. 소유자에는 복수 *बाल*에 맞춰 *के*를, 여성 *आँखें*에 맞춰 *की*를 써요.
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: 프리야가 니나를 소개해요
    gloss: '프리야: 어학 카페에 새로운 여자애가 오고 있어. 이름은 니나야.'
    note: '*आ रही है*(''오고 있어요'')는 새로운 사람을 소개할 때 쓰고, *उसका नाम ... है*는 이름을 말해 줘요.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: 아르준이 어떻게 생겼는지 물어요
    gloss: '아르준: 오케이! 어떻게 생겼어?'
    note: '*वह देखने में कैसी है?*는 ''겉모습이 어떤가요?''라고 묻는 말이에요. *वह*는 ''그''와 ''그녀''를 모두 뜻해요.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: 프리야가 니나의 키와 머리카락을 설명해요
    gloss: '프리야: 키가 작고 짧은 금발이야.'
    note: '키와 머리카락을 이어서 말해요: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: 아르준이 눈에 대해 물어요
    gloss: '아르준: 그럼 눈은?'
    note: '*उसकी आँखें*는 ''그녀의 눈''이에요. *आँखें*에 맞춰 *उसकी*도 여성형이에요.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: 프리야가 니나의 눈을 설명해요
    gloss: '프리야: 눈은 초록색이야.'
    note: '*आँखें*가 여성이라서 *हरी*는 *-ी*로 끝나요.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: 아르준이 그녀를 알아볼 거예요
    gloss: '아르준: 고마워! 그럼 알아볼 수 있겠다.'
    note: '*पहचान लूँगा*(''알아볼 거예요'')는 *पहचानना*의 미래형이고, *उसे*는 ''그녀를''이라는 뜻이에요.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: 비크람과 네하 비교하기
    gloss: 비크람과 네하는 오누이지만 서로 다르게 생겼어요. 비크람은 키가 작고 짧은 갈색 머리에 갈색 눈이에요. 네하는 비크람보다 키가 크고 긴 갈색 머리에 초록색 눈이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      भाई: 남자 형제
      बहन: 여자 형제
      दिखते: ~해 보이다
      अलग: 다른
      छोटा: 키가 작은
      छोटे: 키가 작은
      भूरे: 갈색의
      बाल: 머리카락
      भूरी: 갈색의
      आँखें: 눈
      लंबी: 키가 더 큰
      लंबे: 긴
      हरी: 초록색
      कैसे: 어떻게('어떻게 생겼어요'에서처럼)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: से로 비교하기
    gloss: 비크람은 네하보다 키가 작아요.
    note: '여기서 *से*는 ''~보다''라는 뜻이며 비교 대상 뒤에 와요: *नेहा से छोटा*. 형용사는 동사 바로 앞에 와요.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: 네하는 비크람보다 머리가 길어요
    gloss: 네하는 비크람보다 머리카락이 길어요.
    note: '*लंबे*는 복수형 *बाल*에 맞춰 형태가 바뀌고, *विक्रम से*가 비교를 나타내요.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*मेरे बाल छोटे और भूरे हैं*(''제 머리는 짧고 갈색이에요'')는 자신을 묘사할 때 쓰는 대표 문장이에요. *मेरे*는 복수형 *बाल*에 맞춘 형태예요.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: 아르준이 니나를 알아봐요
    gloss: '아르준: 봐요, 저 사람 니나예요? 머리카락은 짧은 금발이고 눈은 초록색이에요.'
    note: '*देखो*(''봐'')는 친구에게 하는 편한 명령형이에요.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: 프리야가 확인해요
    gloss: '프리야: 네, 바로 니나예요!'
    note: 짧고 자연스러운 확인 표현이에요.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: 니나가 아르준에게 인사해요
    gloss: '니나: 안녕, 너 아르준이야?'
    note: '*क्या तुम अर्जुन हो?*는 또래에게 하는 간단하고 편한 질문이에요.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: 아르준도 니나에게 인사해요
    gloss: '아르준: 응! 만나서 반가워, 니나.'
    note: '*तुमसे मिलकर अच्छा लगा*는 처음 만난 사람에게 하는 표준 표현이에요. 그 느낌이 ''나에게'' 생기는 것이라서 ''나''를 뜻하는 말이 필요 없어요.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화를 마무리해요. 아르준은 앞서 프리야가 설명한 대로 니나를 알아봤어요.
