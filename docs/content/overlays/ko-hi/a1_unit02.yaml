    correct_option: दो
    distractors:
    - एक
    - तीन
    accepted_answers:
    - दो
  hi.a1.unit02.lesson01.exercise02.select_saat:
    instruction: 숫자 7을 뜻하는 단어는 무엇일까요?
    correct_option: सात
    distractors:
    - छह
    - आठ
    accepted_answers:
    - सात
  hi.a1.unit02.lesson01.exercise03.select_das:
    instruction: 숫자 10을 뜻하는 단어는 무엇일까요?
    correct_option: दस
    distractors:
