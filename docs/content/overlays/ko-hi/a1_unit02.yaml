answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: 힌디어 A1
units:
  hi.a1.unit02.numbers:
    title: 숫자
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0부터 10까지
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: 11부터 100까지의 숫자와 가격
  hi.a1.unit02.lesson03.phone_and_age:
    title: 전화번호와 나이
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: 영
    gloss: 영
    note: 이 단원의 모든 숫자의 출발점이에요.
    example_gloss: 오늘 기온은 영도예요.
  hi.a1.unit02.lesson01.teach.ek:
    title: 일
    gloss: 일
    note: 힌디어의 11~99는 각각 따로 외워야 하는 단어예요. 한국어의 '십일', '이십'처럼 '십 + 일' 방식으로 만들어지지 않아요. 2과에서 बीस(20)와 तीस(30)가 एक(1)나 दो(2)와 겹치는 부분이 전혀 없다는 걸 보게 될 거예요.
    example_gloss: 저는 책이 한 권 있어요.
  hi.a1.unit02.lesson01.teach.do:
    title: 이
    gloss: 이
    note: 단순하고 자주 쓰는 숫자예요. 또 '주다'의 반말 명령형이기도 하지만, 문맥으로 늘 뜻이 분명해요.
    example_gloss: 형제가 두 명 있어요.
  hi.a1.unit02.lesson01.teach.teen:
    title: 삼
    gloss: 삼
    note: '*Chahiye*(''필요하다'')는 흔히 쓰는 비인칭 구문이에요. *mujhe teen seb chahiye*는 직역하면 ''나에게 사과 세 개가 필요하다''로, ''저는 ~이 필요해요''를 말하는 아주 자연스러운 방법이에요.'
    example_gloss: 사과 세 개가 필요해요.
  hi.a1.unit02.lesson01.teach.chaar:
    title: 사
    gloss: 사
    note: 불규칙한 점은 없어요. chaar는 다른 작은 숫자들과 똑같이 쓰여요.
    example_gloss: 저는 친구가 네 명 있어요.
  hi.a1.unit02.lesson01.teach.paanch:
    title: 오
    gloss: 오
    note: पाँच는 아누스와라(점)가 아니라 찬드라빈두로 써요. 모음 기호 ा는 글자 위로 올라가는 부분이 없어서 점 대신 찬드라빈두를 쓰는데, 1단원의 हाँ/कहाँ과 같은 규칙이에요.
    example_gloss: 저는 5루피가 있어요.
  hi.a1.unit02.lesson01.teach.chhah:
    title: 육
    gloss: 육
    note: 옛 글에서는 छः로 쓰기도 해요. 현대 표준 철자는 छह예요.
    example_gloss: 저는 책이 여섯 권 있어요.
  hi.a1.unit02.lesson01.teach.saat:
    title: 칠
    gloss: 칠
    note: 요일을 말할 때 유용한 숫자예요.
    example_gloss: 일주일은 7일이에요.
  hi.a1.unit02.lesson01.teach.aath:
    title: 팔
    gloss: 팔
    note: 불규칙한 점은 없어요. aath는 다른 작은 숫자들과 똑같이 쓰여요.
    example_gloss: 이 방에는 의자가 여덟 개 있어요.
  hi.a1.unit02.lesson01.teach.nau:
    title: 구
    gloss: 구
    note: 주변의 다른 숫자들과 달리 여기에는 비음 표시가 필요 없어요.
    example_gloss: 요가 수업은 아침 아홉 시에 시작해요.
  hi.a1.unit02.lesson01.teach.das:
    title: 십
    gloss: 십
    note: 첫 번째 숫자 묶음의 마지막 숫자예요. 2과에서는 십 단위로 이어지는데, 여기부터는 규칙을 짐작하기 어려워요.
    example_gloss: 제 손에는 손가락이 열 개 있어요.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: 십일
    gloss: 십일
    note: 여기서부터 힌디어 숫자는 각각 불규칙한 별개의 단어예요. gyaarah에는 das(10)나 ek(1)가 눈에 띄게 들어 있지 않아요. 한국어 '십일'은 '십'과 '일'로 이루어져 있지만 힌디어는 그렇지 않아요. 지름길은 없고 하나하나 외워야 해요.
    example_gloss: 이 반에는 학생이 열한 명 있어요.
  hi.a1.unit02.lesson02.teach.baarah:
    title: 십이
    gloss: 십이
    note: 이것도 그냥 외워야 해요. do(2)와 이어지는 규칙은 없어요.
    example_gloss: 1년은 12개월이에요.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: 십오
    gloss: 십오
    note: 15분 휴식처럼 짧은 시간을 말할 때 자주 써요.
    example_gloss: 15분이 필요해요.
  hi.a1.unit02.lesson02.teach.bees:
    title: 이십
    gloss: 이십
    note: das(10)와 do(2)를 합친 말이 아닌 완전히 새로운 단어예요. 이 패턴은 이후의 모든 십 단위에서 계속돼요.
    example_gloss: 제 여동생은 스무 살이에요.
  hi.a1.unit02.lesson02.teach.tees:
    title: 삼십
    gloss: 삼십
    note: 이것도 독립된 단어예요. teen(3)과 조금 비슷해 보이지만 teen과 das를 합쳐 만든 말은 아니니 별도의 단어로 외우세요.
    example_gloss: 티켓 가격은 30루피예요.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: 오십
    gloss: 오십
    note: 특히 가격을 말할 때 아주 많이 쓰는 딱 떨어지는 숫자예요.
    example_gloss: 저는 50루피가 있어요.
  hi.a1.unit02.lesson02.teach.sau:
    title: 백
    gloss: 백; 100
    note: 딱 떨어지는 숫자로, 일상의 가격에서 매우 자주 써요.
    example_gloss: 이 책은 100루피예요.
  hi.a1.unit02.lesson02.teach.keemat:
    title: 가격
    gloss: 가격; 값
    note: '*Keemat*는 여성 명사예요. 그래서 소유 표현은 값을 매기는 물건이 무엇이든 항상 여성형을 써요(*iski keemat*, ''이것의 가격'').'
    example_gloss: 이 티켓은 얼마예요?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: 루피
    gloss: 루피
    note: '*Rupaya*는 단수형으로 정확히 1루피일 때 써요. 그보다 큰 금액에는 *rupaye*를 써요.'
    example_gloss: 이것은 50루피예요.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: 가격 묻기
    gloss: 이것의 가격은 얼마예요?
    note: '*Iski*(''이것의'')는 실제로 값을 매기는 물건이 아니라 여성 명사 *keemat*(''가격'')에 맞춰져요. 1단원의 *mera naam*에서 배운 소유 표현의 일치 방식과 같아요.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: 가격 말하기
    gloss: 이것의 가격은 50루피예요.
    note: Iski keemat kya hai?에 대한 자연스러운 완전한 문장 대답이에요.
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: 격식 있게 전화번호 묻기
    gloss: 전화번호가 어떻게 되세요? (격식)
    note: '*Number*(नंबर)는 영어에서 온 외래어로, 일상 힌디어에서 아주 자주 써요. *Aapka*는 남성 명사 *number*에 맞춘 형태예요.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: 편한 사이에서 전화번호 묻기
    gloss: 전화번호가 뭐야? (반말)
    note: 친구나 또래와 이야기할 때는 aapka 대신 tumhara를 써요. 1단원과 같은 패턴이에요.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 번호 알려 주기, 시작하는 말
    gloss: 제 번호는...
    note: 숫자를 하나씩 읽어 주기 전에 꺼내는 자연스러운 말이에요.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: 전화번호 예시
    gloss: 육, 이, 팔, 삼, 오.
    note: 힌디어 전화번호도 한국어처럼 숫자를 하나씩 읽어요. 여기 나온 숫자는 모두 1과에서 이미 배웠어요.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: 공손하게 나이 묻기
    gloss: 연세가 어떻게 되세요? (격식)
    note: '*Umra*(''나이'')는 여성 명사라서 *aapki*도 여성형을 써요. *iski keemat*와 같은 일치 방식인데, 이번에는 가격이 아니라 사람의 나이에 쓰였어요.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: 편한 사이에서 나이 묻기
    gloss: 너 몇 살이야? (반말)
    note: 친구나 또래와 이야기할 때는 aapki 대신 tumhari를 써요.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: 나이 말하기
    gloss: 제 나이는 서른 살이에요.
    note: '*Meri*는 말하는 사람의 성별이 아니라 여성 명사 *umra*에 맞춰져요. 1단원에서 배운 동사형 *chahta/chahti*와 달리, 이 소유 표현은 누가 말하든 바뀌지 않아요.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: 아르준이 프리야의 번호를 물어요
    gloss: 아르준이 프리야에게 전화번호를 반말로 물어요.
    note: 이번 과에서 배운 반말 전화번호 질문을 그대로 써요.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: 프리야가 번호를 알려주고 되물어요
    gloss: 프리야가 전화번호를 숫자 하나씩 읽어 주고, 아르준의 번호를 물어요.
    note: 여기 나온 숫자는 모두 이 단원 1과에서 이미 배웠어요.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: 아르준이 자기 번호를 알려줘요
    gloss: 아르준이 자기 전화번호를 읽어 줘요.
    note: 이번에도 모든 숫자가 1과의 어휘예요.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: 프리야가 아르준의 나이를 물어요
    gloss: 프리야가 고맙다고 하고 나이를 반말로 물어요.
    note: Shukriya('고마워요')는 1단원의 shukriya 카드처럼 말투에 따라 달라지지 않아요.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: 아르준이 나이를 말하고 되물어요
    gloss: 아르준이 스무 살이라고 말하고 프리야의 나이를 되물어요.
    note: Tumhari?만 말해도 질문을 되돌리는 짧고 자연스러운 표현이에요.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: 프리야가 나이를 말해요
    gloss: 프리야가 서른 살이라고 말해요.
    note: Meri umra tees saal hai는 이번 과에서 앞서 배운 문장 패턴을 그대로 써요.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: 아르준이 대화를 마무리해요
    gloss: 아르준이 반가워하며 또 만나자고 말해요.
    note: Accha와 phir milenge는 모두 1단원의 작별 인사 어휘를 다시 써요.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: 프리야가 대화를 마무리해요
    gloss: 프리야가 동의하며 가볍게 또 보자고 말해요.
    note: Theek hai와 phir milte hain은 모두 1단원의 작별 인사 어휘를 다시 써요.
