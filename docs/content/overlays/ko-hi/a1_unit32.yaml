    - 비크람에게는 고양이가 있어요.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: 물고기와 새
    gloss: 물고기 / 새
    example_gloss:
    - 할아버지에게는 물고기가 있어요.
    - Nina에게는 새가 있어요.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: 반려동물이 있어요?
    gloss: 반려동물이 있어요?
    note: '*तुम्हारे पास ... है?*(''너에게 ... 있니?'')는 ''~이 있어요?''라고 묻는 표현이고, *कोई*(''어떤'')를 쓰면 특정하지 않고 열어 두고 묻는 말이 돼요.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: 네, 개가 있어요
    gloss: 네, 저는 개가 있어요.
    note: 이 단원의 새 어휘를 사용한 간단한 긍정 대답이에요.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: '*कोई ... नहीं है*(''~이 없다'')는 아무것도 없다는 뜻이에요.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: 저는 반려동물이 없어요.
    note: '*कोई*(''어떤'')와 *नहीं है*를 함께 쓰면 무언가를 갖고 있지 않다는 부정문이 돼요: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: (동물을) 산책시키다
    gloss: (동물을) 산책시키다
    note: '*घुमाने ले जाना*(''산책시키러 데려가다'')는 힌디어에서 동물을 산책시킨다고 말하는 방식이고, *घुमाने* 뒤에 *ले जाना*가 와요.'
    example_gloss: 저는 매일 개를 산책시켜요.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: 그녀는 강아지를 산책시켜요.
    note: 동물에는 *को*가 붙고(*कुत्ते को*), *घुमाने ले जाती है*가 맨 끝에 와요. *ले जाना*('데리고 가다')는 두 단어가 붙어 다녀요.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: 먹이를 주다
    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: 비크람은 자기 고양이와 놀아요.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
    note: '*रोज़*(''매일'')는 목적어 앞에 와요: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: 저는 매일 고양이에게 먹이를 줘요
    gloss: 저는 매일 고양이에게 먹이를 줘요.
    note: '*खाना देना*(''먹이를 주다'')는 먹이를 받는 대상을 *को*로 나타내요: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: 복수형
    gloss: 개 한 마리, 개 두 마리; 고양이 한 마리, 고양이 두 마리. *-आ*로 끝나는 남성 명사는 복수에서 *-ए*로 바뀌고(*कुत्ता* → *कुत्ते*), *-ई*로 끝나는 여성 명사는 *-याँ*이 붙어요(*बिल्ली* → *बिल्लियाँ*).
    note: 동물 명사를 예로 들어 처음 소개하는 힌디어의 규칙적인 복수형 방식이에요.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: 개와 고양이
    gloss: 개들 / 고양이들
    example_gloss:
    - 아르준은 개를 아주 좋아해요.
    - 네하는 고양이를 아주 좋아해요.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: 물고기와 새 (복수)
    gloss: 물고기들 / 새들
    example_gloss:
    - 저는 물고기를 아주 좋아해요.
    - 할아버지는 새를 아주 좋아하세요.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: 저는 동물을 아주 좋아해요
    gloss: 저는 동물을 아주 좋아해요.
    note: '*मुझे जानवर बहुत पसंद हैं*(''저에게 동물들이 아주 마음에 들어요'')은 ''저는 동물을 아주 좋아해요''라는 뜻이에요. *जानवर*가 복수이기 때문에 *हैं*도 복수예요.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: 네하는 고양이를 아주 좋아하지만 반려동물은 없어요
    gloss: 네하는 고양이를 아주 좋아하지만 반려동물은 없어요.
    note: 이 단원의 읽기 글에 나오는 대비를 미리 보여 주는 문장이에요.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: 아르준이 반려동물에 대해 묻다
    gloss: '아르준: 프리야, 너 반려동물 있어?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: 프리야에게 강아지가 있다
    gloss: '프리야: 응, 나는 강아지가 한 마리 있어.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: 아르준이 어떻게 생겼는지 묻다
    gloss: '아르준: 어떻게 생겼어?'
    note: '*वह कैसा दिखता है?*는 동물에게도 쓸 수 있고, 강아지가 수컷이라서 *कैसा*도 남성형이에요.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: 프리야가 자기 강아지를 묘사하다
    gloss: '프리야: 털이 갈색이고 몸집이 작아.'
    note: 외모 단원에서 배운 머리 색과 크기 표현을 이번에는 사람의 머리카락이 아니라 동물의 털을 설명하는 데 써요.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: 동물에게 쓰는 वह
    gloss: 저건 내 강아지예요. 나는 그 아이를 정말 좋아해요.
    note: '*वह*와 *उसे*는 사람뿐 아니라 동물에게도 써요. 힌디어에는 여기에 쓰는 별도의 ''그것''이라는 말이 없어요.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: 아르준이 산책에 대해 묻다
    gloss: '아르준: 너 매일 그 아이를 산책시켜?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: 프리야가 자신의 일과를 말하다
    gloss: '프리야: 응, 매일 산책시키고 먹이도 줘.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: 동물에 대해 이야기하는 아르준, 네하, 비크람
    gloss: 아르준과 네하는 둘 다 동물을 아주 좋아하지만, 둘 중 누구에게도 반려동물은 없어요. 아르준은 개를 아주 좋아하고 네하는 고양이를 아주 좋아해요. 비크람에게는 반려동물이 있어요. 바로 고양이예요. 그는 자주 고양이와 놀아 주고 매일 먹이를 줘요. 당신은 반려동물이 있나요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      पसंद: 사랑해요
      दोनों: 둘 다
      जानवर: 동물들
      किसी: 그들 중 누구라도
      पालतू: 반려동물
      कुत्ते: 개들
      बिल्लियाँ: 고양이들
      बिल्ली: 고양이
      खेलता: 놀아요
      देता: 줘요
      रोज़: 매
      खाना: 먹이
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: 비크람은 자주 자기 고양이와 놀아요
    gloss: 비크람은 자주 자기 고양이와 놀아요.
    note: '*अक्सर*(''자주'')는 동사 앞에 오고, *अपनी*는 여성 명사 *बिल्ली*에 맞춰 쓰였어요.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: 저는 개를 좋아해요. 반려동물은 없어요.
    gloss: 저는 개를 좋아해요. 반려동물은 없어요.
    note: 이 단원의 쓰기 과제에 그대로 쓸 수 있는 두 문장짜리 모범 답안이에요.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: 프리야가 니나에게 묻다
    gloss: '프리야: 니나, 너도 반려동물 있어?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: 니나에게는 피코라는 새가 있어요
    gloss: '니나: 응, 새를 키워. 이름은 피코야.'
    note: '*उसका नाम पीको है*(''그 아이의 이름은 피코예요'')에서는 *नाम*이 남성 명사라서 *का*를 써요.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: 아르준이 반응하다
    gloss: '아르준: 와, 정말 좋겠다! 매일 그 아이랑 뭘 해?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: 니나가 매일 먹이를 줘요
    gloss: '니나: 매일 먹이를 줘.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: 아르준도 새를 아주 좋아하다
    gloss: '아르준: 나도 새를 아주 좋아해.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: 프리야가 대화를 마무리하다
    gloss: '프리야: 우리 셋 다 동물을 아주 좋아하다니 정말 좋다!'
    note: 이 단원에 나온 세 사람의 동물 이야기를 하나로 마무리해요.
