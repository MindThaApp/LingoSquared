teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: 동물, 반려동물
    gloss: 동물 / 반려동물
    note: '*जानवर*는 동물 전체를 가리키는 일반적인 말이고, *पालतू जानवर*(''길들인 동물'')는 반려동물을 뜻해요.'
    example_gloss:
