teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: '복습: 집'
    gloss: 집
    note: 8과에서 처음 배웠어요. 이 단원 전체의 주제 단어예요.
    example_gloss: 이건 집이에요.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: '복습: ~에, ~에서'
    gloss: ~에서 / ~에
    note: 1과에서 처음 배웠어요. 이 단원에서 방과 물건의 위치를 말할 때 계속 써요.
    example_gloss: 저는 사무실에서 일해요.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: '복습: ~이다·있다 (단수·복수)'
    gloss: ~이다·있다 (단수), ~이다·있다 (복수)
    note: 이 단원의 수량 표현 전체가 바탕으로 삼는 단수/복수 서술어 한 쌍이에요.
