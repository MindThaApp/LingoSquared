    - 할아버지는 델리에 사세요.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: '복습: 몇, 하나, 둘, 셋'
    gloss: 몇, 하나, 둘, 셋
    note: 2과와 7과에서 처음 배웠어요. 여기서는 방의 수를 셀 때 다시 써요.
    example_gloss:
    - 저는 형제가 셋 있어요.
    - 집에 방이 몇 개 있어요?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: 방 (단수 / 복수)
    gloss: 방, 방들
    note: 새 명사예요. 복수형에 주목하세요. *kamra*(하나)가 *kamre*(둘 이상)로 바뀌어요. 이 과의 문법 설명을 참고하세요.
    example_gloss:
    - 집에 방이 하나 있어요.
    - 집에 방이 세 개 있어요.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 남성 명사 -a → -e 복수형
    gloss: '-a로 끝나는 남성 명사는 복수에서 -e로 바뀌어요. ''kamra''(하나)가 ''kamre''(둘 이상)가 돼요. 동사도 수에 따라 달라져요. 하나일 때는 ''hai'', 둘 이상일 때는 ''hain''을 써요. 예: ''ghar mein ek kamra hai'', ''ghar mein teen kamre hain''.'
    note: 이 과정에서 처음으로 정식으로 배우는 명사 복수 규칙이에요. 어떤 연습 문제보다 먼저 알려 드려요.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: 부엌
    gloss: 부엌
    note: 새 명사예요. 이 단원에서 처음 나오는 방 이름이에요.
    example_gloss: 집에 부엌이 하나 있어요.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: 화장실
    gloss: 욕실
    note: 일상 회화에서 흔히 쓰는 외래어예요. *doctor*/*engineer*(16·17과)와 같은 유형이에요.
    example_gloss: 집에 욕실이 하나 있어요.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: 침실
    gloss: 침실
    note: 이것도 흔히 쓰는 외래어로, *bathroom*처럼 형태가 변하지 않아요. 자체 복수 어미가 붙지 않고 숫자 + *hain* 형태만 써요.
    example_gloss: 집에 침실이 두 개 있어요.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: 집에 방이 몇 개 있어요?
    gloss: 집에 방이 몇 개 있어요?
    note: 이 과의 첫 질문이에요.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: 집에 방이 세 개 있어요.
    gloss: 집에 방이 세 개 있어요.
    note: 이 과의 첫 질문에 대한 모범 답변이에요.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: '복습: 그리고 / 와'
    gloss: 그리고
    note: 1과에서 배웠어요. 여기서는 가구를 함께 나열할 때 다시 써요.
    example_gloss: 저도 좋았어요. 당신은요?
  hi.a1.unit18.lesson02.teach.mez:
    title: 탁자
    gloss: 탁자
    note: 새로운 명사예요. 이 단원의 연습에서는 단수로만 나와요. 이 단어의 복수 규칙은 아직 배우지 않아요.
    example_gloss: 부엌에 탁자가 하나 있어요.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: 의자 (단수 / 복수)
    gloss: 의자, 의자들
    note: 새로운 명사예요. 복수형을 주의하세요. *kursi*(하나)가 *kursiyan*(둘 이상)이 돼요. *kamra*/*kamre*와는 다른 규칙이에요. 이 과의 문법 설명을 참고하세요.
    example_gloss:
    - 부엌에 의자가 하나 있어요.
    - 부엌에 의자가 네 개 있어요.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: '복습: 넷'
    gloss: 사
    note: 2과에서 배웠어요. 여기서는 의자 수를 셀 때 다시 써요.
    example_gloss: 부엌에 의자가 네 개 있어요.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 여성 명사 -i → -iyan 복수형
    gloss: '''-i''로 끝나는 여성 명사는 복수에서 ''-iyan''으로 바뀌어요. ''kursi''(하나)가 ''kursiyan''(둘 이상)이 돼요. 이 단원 앞에서 남성 규칙에 따라 ''kamra''가 ''kamre''가 된 것과 같은 방식이지만, 이 단어는 여성이고 ''-i''로 끝나기 때문에 규칙이 달라요.'
    note: 이 단원의 두 번째 복수 규칙이에요. 차이를 쉽게 볼 수 있도록 첫 번째 규칙 바로 뒤에 배워요.
  hi.a1.unit18.lesson02.teach.bistar:
    title: 침대
    gloss: 침대
    note: 새로운 명사예요. 이 단원의 연습에서는 단수로만 나와요.
    example_gloss: 침실에 침대가 하나 있어요.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: 창문 (단수 / 복수)
    gloss: 창문, 창문들
    note: '*kursi*/*kursiyan*과 같은 ''-i'' → ''-iyan'' 여성 복수 규칙을 따라요.'
    example_gloss:
    - 침실에 창문이 하나 있어요.
    - 침실에 창문이 두 개 있어요.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: 부엌에 탁자가 하나 있어요.
    gloss: 부엌에 탁자가 하나 있어요.
    note: 장소 + 물건 표현을 부엌에 적용해 봐요.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: 침실에 침대가 하나 있어요.
    gloss: 침실에 침대가 하나 있어요.
    note: 장소 + 물건 표현을 침실에 적용해 봐요.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: '복습: 어떤 / 어때요'
    gloss: 어떤 / 어때요
    note: 12과에서 배웠어요. 여기서는 집에 대해 물을 때 다시 써요.
    example_gloss: 당신의 집은 어때요?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: '복습: 큰, 작은'
    gloss: 큰 (남성), 큰 (여성), 작은 (남성), 작은 (여성)
    note: 14과에서 배웠어요. 여기서는 집을 묘사할 때 다시 써요. 명사의 성에 맞춰 달라져요. 남성 명사 *ghar*에는 *bada*/*chota*를, 여성 명사 *rasoi*에는 *badi*를 써요.
    example_gloss:
    - 우리 집은 작아요.
    - 이곳은 큰 부엌이에요.
  hi.a1.unit18.lesson03.teach.ya_review:
    title: '복습: 또는'
    gloss: 또는
    note: 14과에서 배웠어요. 여기서는 선택 의문문을 만들 때 다시 써요.
    example_gloss: 당신의 집은 커요, 작아요?
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: '복습: 아르준, 프리야'
    gloss: 아르준, 프리야
    note: 이 과의 어순 배열/문법 확인 연습에서 누구의 집인지 말할 때 쓰이므로, 두 등장인물의 이름을 미리 다시 보여 줘요.
    example_gloss:
    - 제 이름은 아르준이에요.
    - 제 이름은 프리야예요.
  hi.a1.unit18.lesson03.teach.ka_review:
    title: '복습: ~의 (소유)'
    gloss: ~의 (소유격, 남성 명사 앞)
    note: 7/10/12/14/15과에서 배웠어요. 여기서는 누구의 집인지 말할 때 다시 써요. 이 단원에서는 줄곧 기본형으로만 나와요.
    example_gloss: 프리야의 집은 작아요.
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: 아르준이 프리야에게 집에 대해 물어봐요
    gloss: 프리야, 당신의 집은 커요, 작아요?
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: 프리야가 자기 집이 작다고 말해요
    gloss: 우리 집은 작아요. 집에 방이 두 개 있어요, 부엌 하나와 욕실 하나요.
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: 프리야가 아르준에게 같은 질문을 해요
    gloss: 그럼 당신의 집은요, 아르준?
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: 아르준이 자기 집이 크다고 말해요
    gloss: 우리 집은 커요. 집에 침실이 세 개 있고 큰 부엌이 하나 있어요.
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: 프리야가 침실에 무엇이 있는지 물어봐요
    gloss: 우와! 침실에는 뭐가 있어요?
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: 아르준이 침실을 설명해요
    gloss: 침실에 침대 하나와 창문 두 개가 있어요.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: 프리야가 반응해요
    gloss: 정말 좋네요!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: 아르준이 고마움을 전해요
    gloss: 고마워요!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: 세 가지 핵심 규칙
    gloss: 이 단원의 세 가지 핵심 규칙이에요. (1) '[장소] + mein + [숫자] + [명사] + hai/hain'으로 집에 무엇이 몇 개 있는지 말해요. (2) '-a'로 끝나는 남성 명사는 복수에서 '-e'가 돼요 (kamra -> kamre). (3) '-i'로 끝나는 여성 명사는 복수에서 '-iyan'이 돼요 (kursi -> kursiyan, khidki -> khidkiyan).
    note: 15~17과의 문법 설명처럼, 이 단원의 문법 전체를 하나로 묶어 정리해요.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: 두 집에 대한 읽기
    gloss: 프리야의 집은 작아요. 집에 방이 두 개 있어요, 부엌 하나와 욕실 하나요. 아르준의 집은 커요. 집에 침실이 세 개 있고 큰 부엌이 하나 있어요.
    note: 대화에서 이미 나온 내용만 그대로 담은 짧고 간단한 소개글이에요. 새로운 내용은 없어요. '집에 대한 짧은 설명 읽기' 목표에 맞춘 글이에요.
    glosses:
      घर: 집
      छोटा: 작은
      कमरे: 방들
      रसोई: 부엌
      बाथरूम: 욕실
      बड़ा: 큰
      बेडरूम: 침실들
      बड़ी: 큰 (여성)
