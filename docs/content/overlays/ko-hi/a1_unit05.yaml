teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: 가족
    gloss: 가족
    note: 가족을 뜻하는 일반적인 단어로, 이번 단원 내내 쓰입니다.
    example_gloss: 우리 가족은 인도에 있어요.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: 아버지, 어머니
    gloss: 아버지, 어머니
    note: 두 단어 모두 소개할 때 *hai* 대신 존중의 복수형 *hain*을 쓰며, *pita*에는 *mera* 대신 *mere*를 씁니다 -- 이 레슨 뒷부분의 존칭 설명을 참고하세요.
    example_gloss:
    - 이분은 제 아버지예요.
    - 이분은 제 어머니예요.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: 남자 형제, 여자 형제
    gloss: 남자 형제, 여자 형제
    note: 'mera/meri 일치를 대조하는 이번 단원의 핵심 짝입니다: *mera bhai*, *meri behan*.'
    example_gloss:
    - 저는 남자 형제가 한 명 있어요.
    - 저는 여자 형제가 한 명 있어요.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: '''a/an''을 뜻하는 Ek'
    gloss: '*Ek*은 숫자 셀 때의 ''하나''이면서 ''한 ~''의 뜻으로도 쓰입니다: *mera ek bhai hai*.'
    note: 숫자 1로 이미 배운 단어와 같습니다 -- 힌디어에는 따로 부정관사가 없습니다.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: 부모님
    gloss: 부모님
    note: '*mata*(어머니, 격식체)와 *pita*(아버지)가 합쳐진 복합어로, ''부모님''을 뜻하는 표준 단어입니다.'
    example_gloss: 우리 부모님은 델리에 사세요.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera와 meri의 차이
    gloss: '*Mera*는 남성 단어와, *meri*는 여성 단어와 함께 씁니다: *mera bhai*, *meri behan*.'
    note: 이번 단원의 핵심 문법입니다 -- 소유 표현은 말하는 사람이 아니라 소유되는 사람이나 사물에 맞춰 변합니다.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: 존경하는 어른에게 쓰는 mere
    gloss: '어른에 대한 존중으로 *mera*는 *mere*로, *hai*는 *hain*으로 바뀌며, 한 사람이어도 마찬가지입니다: *yeh mere pita hain* (이분은 제 아버지세요).'
    note: 오류가 아니라 실제로 쓰이는 규칙입니다 -- 존경받는 단수 가족 어른(아버지, 할아버지)에게는 이렇게 복수처럼 보이는 형태를 씁니다. 어머니와 할머니는 *meri*를 그대로 쓰지만, 같은 이유로 동사는 복수(*hain*)가 됩니다.
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: 이쪽은 제 남자 형제예요
    gloss: 이 사람은 제 남자 형제예요.
    note: 가장 기본적인 남성형입니다 -- 형제에게는 존칭이 필요 없습니다.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: 제 여동생/누나예요
    gloss: 이쪽은 제 여동생/누나예요.
    note: '*behan*에 맞춘 가장 기본적인 여성형입니다.'
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: 이 사람은 누구예요?
    gloss: 이 사람은 누구예요?
    note: 가족을 소개할 때 쓰기 좋은 간단하고 유용한 질문이에요.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: 친할아버지, 친할머니
    gloss: 친할아버지, 친할머니
    note: 아버지의 부모님만을 가리키는 말이에요. 이 단원 뒤에 나오는, 어머니의 부모님과 비교하는 설명을 참고하세요.
    example_gloss:
    - 우리 할아버지는 델리에 사세요.
    - 우리 할머니는 델리에 사세요.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: 외할아버지, 외할머니
    gloss: 외할아버지, 외할머니
    note: 어머니의 부모님을 가리켜요. 힌디어는 아버지의 부모님과는 완전히 다른 단어 쌍을 써요.
    example_gloss:
    - 우리 외할아버지는 뭄바이에 사세요.
    - 우리 외할머니는 뭄바이에 사세요.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: 델리, 뭄바이
    gloss: 델리, 뭄바이
    note: 인도의 대표적인 두 도시예요. 이 단원에서 가족이 사는 곳을 말하는 예문에 쓰여요.
    example_gloss:
    - 우리 가족은 델리에 살아요.
    - 우리 형(오빠)은 뭄바이에 살아요.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: 두 쌍의 조부모님
    gloss: '아버지의 부모님: *dada-dadi*. 어머니의 부모님: *nana-nani*.'
    note: 한국어에서 '친할아버지/외할아버지'를 구분하듯이, 힌디어도 어느 쪽 집안인지에 따라 완전히 다른 단어를 써요.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: 살다 (rehna)
    gloss: 살아요 (남성 / 여성 / 존칭·복수)
    note: '''살다''를 뜻하는 동사예요. 남자에게는 *rehta hai*, 여자에게는 *rehti hai*, 두 명 이상이거나 존경하는 어른에게는 *rehte hain*을 써요.'
    example_gloss:
    - 우리 형(오빠)은 델리에 살아요.
    - 우리 누나(언니)는 뭄바이에 살아요.
    - 우리 조부모님은 델리에 사세요.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: 너의 (친근한 말투)
    gloss: 너의 (친근한 말투, 남성 / 여성)
    note: 친근한 *tum* 말투의 소유 표현이에요. *mera/meri*처럼 소유되는 명사에 맞춰 형태가 바뀌어요.
    example_gloss:
    - 당신의 형제는 어디에 살아요?
    - 네 여동생은 어디에 살아?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera와 tumhara를 함께
    gloss: '*Mera*와 *tumhara*는 둘 다 남성 명사와 함께 쓰고, *meri*와 *tumhari*는 둘 다 여성 명사와 함께 써요: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: 1과에서 배운 일치 규칙이 *tumhara*에도 똑같이 적용된다는 것을 보여 줘요.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: 손위 / 큰
    gloss: 손위의, 큰 (남성 / 여성)
    note: 한국어는 '형, 오빠, 누나, 언니'처럼 별도의 단어로 손위 형제를 구분하지만, 힌디어는 성에 따라 형태가 바뀌는 이 형용사를 붙여서 손위 형제를 나타내요.
    example_gloss:
    - 우리 형(오빠)은 델리에 살아요.
    - 우리 누나(언니)는 뭄바이에 살아요.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: 손아래 / 작은
    gloss: 손아래의, 작은 (남성 / 여성)
    note: '*bada/badi*의 짝이 되는 말로, 손아래 형제를 나타낼 때 써요.'
    example_gloss:
    - 제 남동생은 지금 학생이에요.
    - 제 여동생은 지금 학생이에요.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Bada/chota의 일치
    gloss: '*Bada*와 *chota*는 남성 명사와, *badi*와 *choti*는 여성 명사와 함께 써요: *bada bhai*, *badi behan*.'
    note: '*mera/meri*에서 이미 본 남성/여성 형용사 일치가 나이를 나타내는 말에도 똑같이 적용돼요.'
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: 그리고, 하지만, ~도
    gloss: 그리고, 하지만, ~도
    note: 기본적인 연결어 세 가지예요. 이 단원의 마지막 대화에서 계속 쓰여요.
    example_gloss:
    - 우리 형(오빠)과 누나(언니)는 델리에 살아요.
    - 우리 형(오빠)은 델리에 살지만, 누나(언니)는 뭄바이에 살아요.
    - 저도 여동생이 있어요.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: 알겠어요, 또 만나요
    gloss: 알겠어요! 또 만나요.
    note: 2단원의 작별 인사 어휘에서 이미 쓴, 다정한 마무리 표현이에요.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: 좋아요, 곧 만나요
    gloss: 좋아요, 곧 만나요!
    note: 위의 마무리 인사에 대한 친근한 말투의 대답이에요. 앞선 단원들의 마무리 대화와 같아요.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: 아르준이 프리야의 가족에 대해 물어요
    gloss: 아르준이 프리야의 가족이 어디에 사는지 물어요.
    note: 이 단원의 *parivar kahan rehta hai* 표현을 다시 써요.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: 프리야가 부모님과 오빠에 대해 말해요
    gloss: 프리야는 부모님이 델리에 사시고, 자신에게 오빠도 한 명 있다고 말해요.
    note: '*mata-pita*, *rehte hain*, *bada bhai bhi hai*를 합친 문장이에요.'
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: 아르준이 조부모님에 대해 물어요
    gloss: 아르준은 "아, 그렇구나!" 하고 말하며 "그럼 조부모님은요?"라고 물어요.
    note: '*Tumhare*는 어른을 높일 때 쓰는 *tumhara*의 형태예요. 1과의 존칭 설명에서 *mera*가 *mere*가 되는 것과 똑같아요.'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: 프리야가 양쪽 조부모님에 대해 말해요
    gloss: 프리야는 친조부모님은 델리에 사시지만, 외조부모님은 뭄바이에 사신다고 말해요.
    note: '*lekin*을 써서 두 조부모님 쌍이 사는 도시를 대조해요. 2과에서 배운 dada-dadi/nana-nani의 구분을 다시 확인해 줘요.'
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: 아르준이 자기 여동생에 대해 말해요
    gloss: 아르준은 자기도 여동생이 있다고 말해요.
    note: '*bhi*와 *choti behan*을 다시 써요.'
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: 프리야가 대화를 마무리해요
    gloss: 프리야는 "그렇군요, 또 만나요"라고 말해요.
    note: 이 단원의 마무리 표현을 다시 써요.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: 아르준이 대답해요
    gloss: 아르준은 "좋아요, 곧 만나요"라고 대답해요.
    note: 이 단원의 대답 표현을 다시 써요.
exercises:
  hi.a1.unit05.lesson01.exercise01.select_bhai:
    instruction: '''형제(남자 형제)''를 뜻하는 단어는 무엇일까요?'
    correct_option: भाई
    distractors:
    - बहन
    - पिता
    accepted_answers:
    - भाई
  hi.a1.unit05.lesson01.exercise02.select_behan:
    instruction: '"언니/여동생(여자 형제)"을 뜻하는 단어는 무엇일까요?'
    correct_option: बहन
    distractors:
    - भाई
    - माँ
    accepted_answers:
    - बहन
  hi.a1.unit05.lesson01.exercise03.select_mere_pita_meaning:
    instruction: 이 문장은 무슨 뜻인가요?
    correct_option: 이분은 제 아버지예요.
    distractors:
    - 이 사람은 제 남자 형제예요.
    - 이분은 제 어머니예요.
    accepted_answers:
    - 이분은 제 아버지예요.
  hi.a1.unit05.lesson01.exercise04.match_immediate_family:
    instruction: 각 힌디어 가족 단어에 맞는 한국어 뜻을 짝지으세요.
    correct_response:
      परिवार: 가족
      पिता: 아버지
      माँ: 어머니
      भाई: 남자 형제
      बहन: 여자 형제
      माता-पिता: 부모님
    pairs:
    - left: परिवार
      right: 가족
    - left: पिता
      right: 아버지
    - left: माँ
      right: 어머니
