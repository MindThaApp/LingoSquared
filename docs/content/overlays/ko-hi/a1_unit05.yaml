      right: 남자 형제
    - left: बहन
      right: 여자 형제
    - left: माता-पिता
      right: 부모님
  hi.a1.unit05.lesson01.exercise05.order_yah_mera_bhai_hai:
    instruction: '문장을 순서대로 배열하세요: 이 사람은 제 남자 형제예요.'
    correct_response:
    - यह
    - मेरा
    - भाई
    - है
  hi.a1.unit05.lesson01.exercise06.order_yah_meri_behan_hai:
    instruction: '문장을 순서대로 배열하세요: 이 사람은 제 여자 형제예요.'
    correct_response:
    - यह
    - मेरी
    - बहन
    - है
  hi.a1.unit05.lesson01.exercise07.fill_mera_bhai:
    instruction: '문장을 완성하세요: 이 사람은 제 남자 형제예요.'
    accepted_answers:
    - मेरा
    feedback: Yeh mera bhai hai -- mera는 남성 명사 bhai에 맞춘 형태예요.
  hi.a1.unit05.lesson01.exercise08.fill_meri_behan:
    instruction: '문장을 완성하세요: 이 사람은 제 여자 형제예요.'
    accepted_answers:
    - मेरी
    feedback: Yeh meri behan hai -- meri는 여성 명사 behan에 맞춘 형태예요.
  hi.a1.unit05.lesson01.exercise09.fix_behan_agreement:
    instruction: 문장을 고치세요. behan은 여성 명사이므로 '나의'도 여성형이 필요해요.
    accepted_answers:
    - यह मेरी बहन है।
    - यह मेरी बहन है
    feedback: Yeh meri behan hai -- mera는 남성형이라 여성 명사 behan과 맞지 않아요.
  hi.a1.unit05.lesson01.exercise10.reply_who_is_this:
    instruction: 이 사람이 제 남자 형제라고 대답하세요.
    accepted_answers:
    - यह मेरा भाई है।
    - यह मेरा भाई है
    - मेरा भाई है।
  hi.a1.unit05.lesson01.exercise11.speak_about_sibling:
    instruction: 남자 형제(또는 여자 형제)가 있다고 말해 보세요.
    accepted_answers:
    - मेरा एक भाई है।
    - मेरा एक भाई है
    - मेरी एक बहन है।
    - मेरी एक बहन है
