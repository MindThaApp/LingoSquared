    title: 시간
lessons:
  hi.a1.unit04.lesson01.kitne_baje_hain:
    title: 몇 시예요?
  hi.a1.unit04.lesson02.din_ka_samay:
    title: 하루의 시간대
  hi.a1.unit04.lesson03.agli_class_ka_samay:
    title: 다음 수업 시간
teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: ~시
    gloss: ~시 (2시 이상)
    note: 1시를 제외한 모든 시각에 써요 -- *1시*의 특별한 형태는 이 레슨 뒤에서 나와요.
    example_gloss: 지금 5시예요.
  hi.a1.unit04.lesson01.teach.abhi:
    title: 지금
    gloss: 지금
    note: 현재 시각을 말할 때 계속 쓰게 될 간단한 시간 표현이에요.
    example_gloss: 지금 10시예요.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: 하나, 둘, 셋
    gloss: 하나, 둘, 셋
    note: 2단원에서 나온 말이고 시각을 말할 때 필요해요. *ek*에는 특별한 *baja*가 오고, *do*와 *teen*에는 일반 *baje*가 와요.
    example_gloss:
    - 지금 1시예요.
    - 지금 2시예요.
    - 지금 3시예요.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: 넷, 다섯, 여섯
    gloss: 넷, 다섯, 여섯
    note: 2단원에서 나온 말이에요 -- 셋 모두 일반 *baje*와 함께 써요.
    example_gloss:
    - 지금 4시예요.
    - 지금 5시예요.
    - 지금 6시예요.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: 일곱, 여덟, 아홉
    gloss: 일곱, 여덟, 아홉
    note: 2단원에서 나온 말이에요.
    example_gloss:
    - 지금 7시예요.
    - 지금 8시예요.
    - 지금 9시예요.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: 열, 열하나, 열둘
    gloss: 열, 열하나, 열둘
    note: 2단원에서 나온 말이에요 -- 시각에 필요한 숫자 중 마지막이에요.
    example_gloss:
    - 지금 10시예요.
    - 지금 11시예요.
    - 지금 12시예요.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja와 baje
    gloss: '*Baja*는 *하나*에, *baje*는 나머지 모든 숫자에 써요: *ek baja hai*, *do baje hain*.'
    note: 단순화한 설명이 아니라 꼭 지켜야 하는 일치 예외예요 -- *ek baja hai*는 단수형을 쓰는 유일한 시각이에요.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: 시간 묻기
    gloss: 몇 시예요?
    note: 직역하면 '몇 시가 있나요'로, 시각을 묻는 표준 표현이에요.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: 시간 말하기
    gloss: 지금 5시예요.
    note: '*Kitne baje hain?*에 대한 자연스러운 완전한 문장 대답이에요.'
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: 요가 수업
    gloss: 요가 수업
    note: 1단원에서 나온 말이에요 -- 이 레슨에서 일정을 말할 때 계속 쓰는 예시예요.
    example_gloss: 요가 수업은 오늘이에요.
  hi.a1.unit04.lesson02.teach.subah:
    title: 아침
    gloss: 아침
    note: 이 레슨에서 배우는 시간대 단어 네 개 중 하나예요.
    example_gloss: 요가 수업은 아침에 있어요.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: 오후 / 정오
    gloss: 오후, 정오
    note: 정오와 이른 오후를 모두 가리켜요.
    example_gloss: 오후에는 수업이 없어요.
  hi.a1.unit04.lesson02.teach.shaam:
    title: 저녁
    gloss: 저녁
    note: '*dopahar* 다음, *raat* 전의 시간대예요.'
    example_gloss: 다음 수업은 저녁 5시예요.
  hi.a1.unit04.lesson02.teach.raat:
    title: 밤
    gloss: 밤
    note: 시간대 단어 네 개 중 마지막이에요.
    example_gloss: 밤에는 수업이 없어요.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: 일반적인 시간대와 함께 쓰는 Ko
    gloss: '구체적인 시각이 없을 때는 시간대 단어에 *ko*를 붙여요: *dopahar ko*, *raat ko*.'
    note: 3단원에서 요일에 쓰던 그 *ko*가 이번에는 일반적인 시간대를 나타내요 -- 자연스러운 표현이며, 구체적인 시각을 말하는 형태(다음 설명 참고)와는 별개예요.
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: 시간대 단어는 baje 바로 앞에
    gloss: '구체적인 시각에는 시간대 단어를 *baje* 바로 앞에 두고, 그 사이에 아무것도 넣지 않아요: *subah saat baje*, *shaam paanch baje*.'
    note: 여기에는 *ko*를 쓰지 않아요 -- 앞의 설명처럼 ko는 구체적인 시각이 없는 일반 시간대에만 써요.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: 수업 시간 묻기
    gloss: 수업이 몇 시예요?
    note: 1과의 *kitne baje* 패턴과 같지만, 지금 시각이 아니라 일정을 묻는 데 써요.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: 일정의 시간 말하기
    gloss: 수업은 아침 7시예요.
    note: 위 문법 설명대로 *subah*와 *saat baje*를 바로 붙여요.
  hi.a1.unit04.lesson03.teach.kal:
    title: 내일 / 어제
    gloss: 내일, 어제
    note: 힌디어는 두 뜻에 한 단어를 쓰고, 문맥(과 동사 시제)으로 구분해요. 이 레슨에서는 늘 '내일'이라는 뜻이에요.
    example_gloss: 수업은 내일 저녁 5시예요.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: 다음
    gloss: 다음
    note: 3단원에서 나온 말이에요 -- 여성형이며 여성 명사 *class*와 어울려요.
    example_gloss: 다음 수업은 내일이에요.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: 알겠어요, 고마워요
    gloss: 좋아요, 고마워요!
    note: 두 단어 모두 1단원의 작별 인사 어휘에서 다시 쓴 것입니다.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: 우리 만나요 / 또 봐요
    gloss: 우리 만나요 / 또 봐요
    note: 3단원 마지막 작별 인사에서 다시 쓴 표현으로, 여기서는 *kal*과 함께 "내일 봐요"라는 뜻이 됩니다.
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: 다음 수업이 언제인지 묻기
    gloss: 다음 수업은 몇 시예요?
    note: '*agli*(수업에 맞춰 여성형)와 이번 단원의 *kitne baje* 패턴을 합친 문장입니다.'
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: 다음 수업 시간 말하기
    gloss: 다음 수업은 저녁 다섯 시예요.
    note: 위 질문에 대한 자연스러운 완전한 문장 대답입니다.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: 내일 만나자는 약속으로 마무리하기
    gloss: 좋아요, 내일 봐요!
    note: 시간이 정해진 뒤 대화를 마무리할 때 쓰는 자연스러운 표현입니다.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: 아르준이 다음 수업에 대해 묻습니다
    gloss: 아르준이 다음 수업이 몇 시인지 묻습니다.
    note: 이번 레슨의 질문을 그대로 다시 씁니다.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: 프리야가 시간을 알려 줍니다
    gloss: 프리야가 다음 수업은 저녁 다섯 시라고 말합니다.
    note: 이번 레슨의 대답 문장을 그대로 다시 씁니다.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: 아르준이 고마워합니다
    gloss: 아르준이 알겠다며 고맙다고 말합니다.
    note: 1단원 어휘에서 다시 쓴 표현입니다.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: 프리야가 대화를 마무리합니다
    gloss: 프리야가 알겠다며 내일 보자고 말합니다.
    note: 이번 레슨의 마무리 문장을 그대로 다시 씁니다.
