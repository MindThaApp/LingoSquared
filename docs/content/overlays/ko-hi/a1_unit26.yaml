teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: 코트, 스웨터
    gloss: 코트, 스웨터
    note: '*जैकेट*은 여성 명사이고 *स्वेटर*는 남성 명사예요. 함께 쓰는 단어에서 알 수 있어요: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - 저는 코트를 찾고 있어요.
    - 저는 스웨터가 있어요.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: 바지, 신발
    gloss: 바지, 신발
    note: '*पैंट*은 바지 한 벌을 가리키는 한 단어이고(*मेरी पैंट*), *जूते*는 *जूता*의 복수형이에요. *-आ*로 끝나는 남성 명사는 복수에서 *-ए*로 바뀌어요.'
    example_gloss:
    - 저는 바지를 찾고 있어요.
    - 저는 신발을 찾고 있어요.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: 찾는 물건 말하기
    gloss: 저는 코트를 찾고 있어요.
    note: '동사는 맨 끝에 와요: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ*은 ''찾고 있다''(지금 진행 중)라는 뜻이고, *रहा*는 남성형이에요(여성은 *रही*라고 해요).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: 사이즈
    gloss: 사이즈
    note: '*साइज़*는 남성 명사라서 함께 쓰는 단어도 남성형이에요: *मेरा साइज़*.'
    example_gloss: 어떤 사이즈를 입으세요?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: 사이즈 묻기
    gloss: 어떤 사이즈를 입으세요?
    note: '*कौन सा*(''어느'')는 여러 가지 중 하나를 물을 때 쓰고, *सा*는 명사에 맞춰 달라져요: *कौन सा साइज़*, 하지만 *कौन सी जैकेट*. *आप*는 점원에게 쓰는 높임 ''당신''이에요.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: 내 사이즈 말하기
    gloss: 저는 M 사이즈예요.
    note: 힌디어는 여기서 '가지고 있다'에 해당하는 동사를 쓰지 않아요. *मेरा साइज़ एम है*는 직역하면 '내 사이즈는 M이에요'이고, *मेरा*는 남성 명사 *साइज़*에 맞춰요.
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: 검은색, 파란색
    gloss: 검은색, 파란색
    note: 이번 수업에 나오는 기본 색깔 형용사 두 개예요.
    example_gloss:
    - 검은색 코트로 할게요.
    - 이것도 파란색이 있나요?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: 색상 요청하기
    gloss: 검은색 코트로 할게요.
    note: '*मुझे ... चाहिए*는 힌디어로 ''원해요''를 말하는 방식이에요. 바람이 ''나에게''(*मुझे*) 생기는 것이고, 원하는 것은 *चाहिए* 바로 앞에 와요.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: 다른 색상 묻기
    gloss: 이것도 파란색이 있나요?
    note: '*आपके पास ... है?*(''당신 곁에 ... 있나요?'')는 ''~ 있나요?''를 정중하게 묻는 표현이고, *भी*(''~도'')는 덧붙이는 단어 뒤에 와요.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: 잘 맞는지 묻기
    gloss: 이 코트 잘 맞아요?
    note: '힌디어는 옷이 ''맞게 온다''고 말해요: *ठीक आती है*. 동사는 대상에 맞춰 달라져서 여성 명사 *जैकेट*에는 *आती*, 남성 명사 *स्वेटर*에는 *आता*를 써요.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: 잘 맞는다고 확인하기
    gloss: 잘 맞아요.
    note: '*एकदम*(''완전히'')이 붙어 ''딱 맞아요''가 돼요. *आती है*는 여성 명사 *जैकेट*에 맞춘 형태예요.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: 너무 작아요
    gloss: 너무 작아요.
    note: '*बहुत*는 형용사 앞에 오며 여기서는 ''너무''라는 뜻이에요: *बहुत छोटी*. 형용사는 여성 명사 *जैकेट*에 맞춰요.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: 너무 커요
    gloss: 너무 커요.
    note: '*बड़ी*도 같은 방식이에요. *बड़ा*는 여성 명사 앞에서 *बड़ी*로 바뀌어서 *बहुत बड़ी*가 돼요.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: 구백
    gloss: 구백
    note: '*नौ सौ*는 숫자 900이고, 재킷 가격을 말할 때 쓰였어요.'
    example_gloss: 코트는 900루피예요.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: 가격 말하기
    gloss: 코트는 900루피예요.
    note: '힌디어는 ''재킷의 가격은 ...이에요''라고 말해요: *जैकेट की कीमत नौ सौ रुपये है*. *की*는 *जैकेट*이 아니라 여성 명사 *कीमत*에 맞춘 거예요.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: 매장 영수증 읽기
    gloss: '겨울 코트: 사이즈 M, 색상 검정. 가격: 900루피. 이 코트는 잘 맞고 따뜻해요.'
    note: 사이즈, 색상, 가격, 그리고 코트에 대해 언급된 두 가지 장점을 찾아보세요.
    glosses:
      सर्दी: 겨울(용 재킷)
      साइज़: 사이즈
      रंग: 색
      काला: 검은색
      कीमत: 가격
      नौ: 아홉
      सौ: 백
      रुपये: 루피
      जैकेट: 코트
      आती: 맞아요
      गर्म: 따뜻한
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: 프리야가 코트를 눈여겨봐요
    gloss: '프리야: 이 코트 멋지다! 너 사이즈가 뭐야?'
    note: '*अच्छी*는 여성 명사 *जैकेट*에 맞춘 형태예요. *तुम्हारा*는 친구 사이에 쓰는 편한 ''너의''예요.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: 아르준이 입어 봐도 되는지 물어봐요
    gloss: '아르준: 내 사이즈는 M이야. 입어 봐도 돼?'
    note: '*पहनकर देखना*(''입어 보다'')는 힌디어로 ''입어 보다''를 말하는 방식이에요. *सकता हूँ*은 ''할 수 있다'' 또는 ''해도 된다''라는 뜻이고, 여성은 *सकती हूँ*라고 해요.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: 프리야가 착용감을 물어봐요
    gloss: '프리야: 물론이지. 잘 맞아?'
    note: '*यह*는 ''그것'' 또는 ''이것''이라는 뜻이고, *आती*는 여성 명사 *जैकेट*에 맞춘 형태예요.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: 아르준이 확인해요
    gloss: '아르준: 응, 딱 맞고 따뜻해.'
    note: 앞서 읽은 영수증의 내용과 똑같아요. 같은 코트예요.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: 프리야가 색을 물어봐요
    gloss: '프리야: 좋다! 검은색으로 할래, 파란색으로 할래?'
    note: '*या*(''또는'')는 선택지를 줄 때 써요. 두 번째 *रंग*은 생략할 수 있어요: *काले रंग में ... या नीले में*. *तुम*은 편한 말투예요.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: 아르준이 결정해요
    gloss: '아르준: 검은색으로 살게.'
    note: '*लूँगा*는 *लेना*(''가지다, 사다'')의 미래형으로, 가게에서 무엇을 사기로 정할 때 흔히 쓰는 동사예요. 여성은 *लूँगी*라고 해요.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ와 लेता है
    gloss: 나는 사요, 그는 사요.
    note: '*-ता*는 습관을 나타내는 어미로 주어에 맞춰 달라지고, *हूँ*은 *मैं*와, *है*는 *वह*와 함께 써요.'
