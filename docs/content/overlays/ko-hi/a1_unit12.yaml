    instruction: '문장을 순서대로 배열하세요: 영화가 좋았어요.'
    correct_response:
    - फ़िल्म
    - अच्छी
    - थी
  hi.a1.unit12.lesson01.exercise10.fill_arjun_vyast_tha:
    instruction: '문장을 완성하세요: Arjun은 어제 바빴어요.'
    accepted_answers:
    - था
    feedback: Arjun kal vyast tha -- tha는 주어 Arjun(남성)에 맞춘 형태예요. 한국어와 달리 힌디어는 be동사 과거형이 주어의 성에 따라 달라져요.
  hi.a1.unit12.lesson01.exercise11.fill_priya_vyast_thi:
    instruction: '문장을 완성하세요: Priya는 어제 바빴어요.'
    accepted_answers:
    - थी
    feedback: Priya kal vyast thi -- thi는 주어 Priya(여성)에 맞춘 형태예요. 한국어와 달리 힌디어는 be동사 과거형이 주어의 성에 따라 달라져요.
  hi.a1.unit12.lesson01.exercise12.reply_kal_kaisa_tha:
    instruction: '대답하세요: 그날은 좋았어요.'
    accepted_answers:
    - दिन अच्छा था।
    - दिन अच्छा था
    - कल का दिन अच्छा था।
  hi.a1.unit12.lesson01.exercise14.dictation_kal_kaisa_tha:
    instruction: 들리는 대로 입력하세요.
    correct_option: कल कैसा था
    accepted_answers:
    - value: कल कैसा था
      status: correct
