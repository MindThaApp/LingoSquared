answer_policy:
  gender_agreement: This unit's central grammar point is subject-gender agreement on past- tense verbs (था/थी, गया/गई, मिला/मिली). Typed answers that use the wrong-gender form for a NAMED subject whose gender is already established (Arjun = masculine, Priya = feminine) should be marked incorrect -- this is the exact point being tested. For open-ended "describe your own day" prompts (writing_prompt/speak_response) where the learner's own gender isn't known, accept either gender's form as equally correct.
  intransitive_only: This unit deliberately teaches only intransitive past-tense verbs (जाना -> गया/गई, मिलना -> मिला/मिली) plus the copula (था/थी) -- no ने-marked transitive past tense (e.g. "मैंने खाना खाया") appears anywhere in this unit's accepted answers, by design.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized forms used anywhere in this unit are हूँ/हैं and वहाँ, all reused unchanged from their already-settled spellings. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to describe their own recent day, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 힌디어 A1
units:
  hi.a1.unit12.past_events:
    title: 어제
lessons:
  hi.a1.unit12.lesson01.tha_thi:
    title: 어제는 어땠어요?
  hi.a1.unit12.lesson02.gaya_gai_mila_mili:
    title: 시장에 갔어요
  hi.a1.unit12.lesson03.arjun_priya_kal:
    title: '아르준과 프리야: 어제'
teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: '복습: 바쁜'
    gloss: 바쁜
    note: 11과에서 배운 형용사를 잠깐 복습해요. 이 단원에서는 새로 배우는 과거형 '이다'를 연습하려고 이 단어를 다시 써요.
    example_gloss: 아르준은 바빠요.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: ~였다 (남성형 / 여성형)
    gloss: ~였다
    note: '''이다''의 과거형으로, hai/hoon/hain에 바로 대응하는 과거 형태예요. ''Tha''는 남성 주어와, ''thi''는 여성 주어와 함께 써요.'
    example_gloss:
    - 아르준은 어제 바빴어요.
    - 프리야는 어제 바빴어요.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha와 thi
    gloss: '''Tha''는 남성 주어와, ''thi''는 여성 주어와 함께 써요. ''hai''가 오는 자리에 오지만, ''hai''와 달리 성에 따라 모양이 바뀌어요. 아르준은 바빠요, 아르준은 바빴어요, 프리야는 바빴어요.'
    note: 이미 익숙한 '이다' 변화표를 과거형으로 넓혀서, 성 일치 규칙을 분명하게 보여 줘요.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: '복습: 어제'
    gloss: 어제
    note: 4과에서 'kal'이 '내일'과 '어제'를 모두 뜻하고 동사의 시제로만 구별된다고 배웠어요. 이 단원은 그중 과거 뜻인 '어제'를 처음으로 실제로 쓰는 단원이에요.
    example_gloss: 어제는 토요일이었어요.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: 어떤 (남성형)
    gloss: 어떤
    note: 이미 3분의 2를 배운 변화형을 완성해요. 1과 '어떻게 지내세요'에서 'kaise'와 'kaisi'를 배웠고, 이번에 빠져 있던 남성 단수형을 배워요. 'din'(날) 같은 주어와 함께 써요.
    example_gloss: 하루는 어땠어요?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: 어제는 어땠어요?
    gloss: 어제는 어땠어요?
    note: 이 단원에서 계속 나오는 핵심 질문이에요. 지금까지 이 과에서 배운 단어가 모두 들어 있어요.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: 하루가 좋았어요.
    gloss: 하루가 좋았어요.
    note: '''어제는 어땠어요?''에 바로 쓸 수 있는 대답이에요. ''din''이 남성이라 남성형을 써요.'
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: 영화가 좋았어요.
    gloss: 영화가 좋았어요.
    note: 같은 문형에 여성 주어를 쓴 문장이에요. 'film'은 여성이에요. 11과에서 배운 어휘를 다시 써요.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: '''Kaisa''는 남성 단수 주어(하루는 어땠어요?)와, ''kaisi''는 여성 주어(차는 어땠어요?)와 함께 써요. ''kaise''는 aap/tum과 함께 남자에게 물을 때 써요(어떻게 지내세요?). 여자에게는 ''aap kaisi hain?''이라고 해요. 세 가지 모두 같은 단어의 변화형이에요.'
    note: 처음으로 변화형 전체를 하나로 묶어 봐요. kaise/kaisi는 1과에서 이미 배웠고, kaisa가 이번 과에서 더해져요.
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: '복습: 나, 아르준, 프리야'
    gloss: 나, 아르준, 프리야
    note: 이 과의 1인칭 과거형 예문에 앞서 잠깐 복습해요.
    example_gloss:
    - 저는 아르준이에요.
    - 저는 프리야예요.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: 갔다 (남성형 / 여성형)
    gloss: 갔다
    note: '''jaana''(가다)의 과거형이에요. 9과에서 명령형 ''jao''(가!)로 배운 것과 같은 어근이에요. ''tha''/''thi''처럼 주어의 성에 따라 모양이 바뀌어요.'
    example_gloss:
    - 아르준은 시장에 갔어요.
    - 프리야는 집에 갔어요.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = jaana의 과거형
    gloss: '''Gaya''/''gai''는 ''jaana''(가다, 9과의 jao)의 과거형이에요. ''tha''/''thi''처럼 주어의 성에 따라 모양이 바뀌어요.'
    note: 새로 배우는 과거형을 이미 아는 명령형 어근과 분명하게 연결해 줘요.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: '복습: 시장, 집'
    gloss: 시장, 집
    note: 7~8과에서 배운 장소 단어 두 개를 잠깐 복습해요. 어디에 갔는지 말할 때 필요해요.
    example_gloss:
    - 여기는 시장이에요.
    - 여기는 집이에요.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: 만났다 (남성형 / 여성형)
    gloss: 만났다
    note: '''milna''(만나다)의 과거형이에요. 1·4·10·11과의 맺음말에 나온 습관형 ''milte hain''과 같은 어근이에요. 주어의 성에 따라 모양이 바뀌어요.'
    example_gloss:
    - 아르준은 프리야를 만났어요.
    - 프리야는 아르준을 만났어요.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: 여기서 Se는 '~에서'가 아니라 '~와'
    gloss: 여기서 'se'는 '~에서'라는 뜻이 아니에요. 'X se milna'는 'X와 만나다'라는 뜻이에요. 'main Bharat se hoon'에서는 같은 'se'가 '~에서(출신)'를 뜻했어요.
    note: 이미 배운 단어가 두 가지로 쓰이는 경우를 분명히 짚어 줘요.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: '복습: 거기'
    gloss: 거기에
    note: 8~9과에서 배운 단어를 복습해요. 여기서는 만난 장소를 말할 때 써요.
    example_gloss: 학교는 거기 있어요.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: 어제 시장에 갔어요.
    gloss: 어제 시장에 갔어요.
    note: 이 과에서 배운 과거형과 1과의 'kal'을 함께 써요.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: 거기서 프리야를 만났어요.
    gloss: 거기서 프리야를 만났어요.
    note: 이 과의 'mila'에 'se'('~와')와 'wahan'(거기)을 함께 써요.
  hi.a1.unit12.lesson02.teach.saath_review:
    title: '복습: 함께'
    gloss: 함께
    note: 11과에서 배운 단어를 잠깐 복습해요.
    example_gloss: 우리는 함께 차를 마셔요.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: '복습: 차, 가게, 음식'
    gloss: 차, 가게, 음식
    note: 6~7과에서 배운 명사 세 개를 잠깐 복습해요. 이 과의 대화와 읽기 노트에 필요해요.
    example_gloss:
    - 차가 좋아요.
    - 가게가 좋아요.
    - 음식이 좋아요.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: '복습: ''~의''(ka), 어떤(여성형)'
    gloss: ~의 (ka), 어떤 (여성형, kaisi)
    note: '''Ka''(앞서 배운 ''kitne ka''와 10과의 ''raat ka khana'')와 ''kaisi''(앞서 배움)를 여기서 다시 써요. 새 문법은 아니에요.'
    example_gloss:
    - 어제 하루는 좋았어요.
    - 찻집은 어땠어요?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: 아르준이 어제가 어땠는지 물어요
    gloss: 프리야, 어제는 어땠어요?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: 프리야가 좋았다고 말해요
    gloss: 아주 좋았어요! 우리 만났어요.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: 아르준이 시장 이야기를 해요
    gloss: 네! 저는 먼저 시장에도 갔어요.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: 프리야가 시장에 대해 물어요
    gloss: 그렇군요! 시장에는 뭐가 있었어요?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: 아르준이 대답해요
    gloss: 음식이 좋았어요.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: 프리야가 찻집에 대해 물어요
    gloss: 그렇군요! 그럼 찻집은 어땠어요?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: 아르준이 대답해요
    gloss: 찻집이 아주 좋았어요.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: 프리야가 마무리해요
    gloss: 좋아요! 그럼 내일 또 만날까요?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve는 복수형 모양의 과거형을 써요
    gloss: '''Tum'', ''hum'', ''ve''는 과거형에서도 현재형의 ''-te''와 같은 모양을 써요. ''tha'' 대신 ''the'', ''gaya'' 대신 ''gaye'', ''mila'' 대신 ''mile''이에요. ''hum milte hain''이 ''hum mile''가 되는 식이에요.'
    note: 전체 변화형을 이해할 수 있도록 설명해 줘요. 다만 이 단원 연습 문제에서 직접 연습하는 것은 'mile'뿐이고, 'the'/'gaye'는 이 노트의 설명에만 나오는 인식용이에요.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Priya의 쪽지
    gloss: Arjun, 어제는 정말 좋은 하루였어요. 음식도 좋았고 찻집도 좋았어요. - Priya
    note: 방금 대화에서 나온 내용을 다시 정리한 짧은 글이에요. 새 어휘는 없어요.
    glosses:
      कल: 어제
      दिन: 날, 하루
      अच्छा: 좋은 (남성형)
      था: ~였다 (남성형)
      खाना: 음식
      दुकान: 가게
      अच्छी: 좋은 (여성형)
      थी: ~였다 (여성형)
