      right: ~였다 (여성형)
    - left: कल
      right: 어제
    - left: कैसा
      right: 어떤 (남성형)
    - left: दिन
      right: 날, 하루
    - left: अच्छा
      right: 좋은 (남성형)
    - left: अच्छी
      right: 좋은 (여성형)
    - left: व्यस्त
      right: 바쁜
    - left: फ़िल्म
