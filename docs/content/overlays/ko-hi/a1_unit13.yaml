answer_policy:
  number_agreement: This unit's central grammar point is that 'है'/'हैं' after *पसंद* agrees with the NUMBER of the liked thing (not the speaker's or the liked thing's gender) -- e.g. *चाय पसंद है* (tea, singular) vs. *किताबें पसंद हैं* (books, plural). A typed answer using the wrong number's copula for a thing whose number is already fixed by the sentence (e.g. *किताबें* is always plural) should be marked incorrect -- this is the exact point being tested. For open-ended "what do you like" prompts (writing_prompt/speak_response) where the learner picks their own liked thing, accept either singular or plural framing as long as है/हैं internally agrees with whichever noun the learner chose.
  chahiye_vs_pasand: This unit deliberately distinguishes *चाहिए* (unit 6, "want/need", takes no है after it, invariant) from *पसंद है/हैं* (this unit, "like", always requires a है/हैं copula that agrees in number with the liked thing) -- a typed answer that drops the है/हैं after पसंद, or that adds है after चाहिए, should be marked incorrect as a real structural error, not tolerated as a minor typo.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's new nasalized words (पसंद, संगीत, and किताबें's plural ending) all use anusvara, verified against a direct codepoint check -- consistent with the already-established हैं/मुझे/तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own likes/dislikes/preferences, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 힌디어 A1
units:
  hi.a1.unit13.preferences:
    title: 선호 표현
lessons:
  hi.a1.unit13.lesson01.pasand_hai:
    title: 좋아해요
  hi.a1.unit13.lesson02.tumhein_kya_pasand:
    title: 무엇을 좋아해요?
  hi.a1.unit13.lesson03.arjun_priya_pasand:
    title: 'Arjun과 Priya: 취향'
teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: '복습: 차, 커피'
    gloss: 차, 커피
    note: 이번 유닛에서 좋아하는 것과 싫어하는 것을 말하는 데 필요한 6단원 어휘를 간단히 복습해요.
    example_gloss:
    - 차를 마시고 싶어요.
    - 커피를 마시고 싶어요.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: '복습: 나에게'
    gloss: 나에게
    note: 앞서 배운 여격 대명사로, 6·7·11단원에서 계속 사용했습니다. 이 단원에서는 이 대명사와 짝을 이루는 새로운 서술어를 배웁니다.
    example_gloss: 차를 마시고 싶어요.
  hi.a1.unit13.lesson01.teach.pasand:
    title: 좋아함 / 마음에 듦
    gloss: 좋아함 / 마음에 듦
    note: '''좋아함''을 뜻하는 명사입니다(''가장 좋아하는 것''이 아닙니다). 여격 주어(mujhe/tumhein), 그리고 hai/hain과 함께 쓰여 ''나는 ~을(를) 좋아해요''라는 표현을 만듭니다.'
    example_gloss: 저는 차를 좋아해요.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = 좋아해요
    gloss: '''Pasand hai''는 ''X가 나에게 마음에 들어요'', 즉 ''X를 좋아해요''라는 뜻입니다. ''mujhe...chahiye''(6단원)처럼 mujhe/tumhein으로 시작하지만, ''chahiye'' 뒤에는 ''hai''가 오지 않는 반면 ''pasand'' 뒤에는 항상 ''hai'' 또는 ''hain''이 옵니다.'
    note: chahiye(원하다/필요하다)와 pasand hai(좋아하다)의 구조 차이를 분명히 밝혀서 두 구문을 혼동하지 않도록 합니다.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: 음악
    gloss: 음악
    note: pasand hai 구문을 연습하기 위한 새 명사로, 셀 수 없는 단수 주어로 쓰입니다.
    example_gloss: 저는 음악을 좋아해요.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: '복습: 네, ~이/가 아니다'
    gloss: 네, 아니요
    note: 앞에서 배운 두 단어를 간단히 복습합니다. 이 단원에서 좋아하는지 묻는 질문에 대답하거나 부정할 때 필요합니다.
    example_gloss:
    - 네, 저는 음악을 좋아해요.
    - 아니요, 저는 커피를 좋아하지 않아요.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: 저는 커피를 좋아하지 않아요.
    gloss: 나는 커피를 좋아하지 않아요.
    note: '부정문은 앞에서 배운 다른 hai 문장(예: 3단원의 ''yoga class nahin hai'')과 똑같이 만듭니다. nahin이 hai 바로 앞에 옵니다.'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: 책 / 책들
    gloss: 책 / 책들
    note: 단수와 복수로 이루어진 새 명사 쌍입니다. pasand 뒤의 'hai'/'hain'이 좋아하는 대상의 수에 따라 달라짐을 보여 줍니다.
    example_gloss:
    - 저는 그 책이 마음에 들어요.
    - 저는 책을 좋아해요.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: pasand 뒤의 hai와 hain
    gloss: '''pasand'' 뒤의 ''hai''나 ''hain''은 좋아하는 대상의 수에 따라 달라집니다. ''mere paas...hai/hain''(2단원)과 똑같습니다. 차/음악은 pasand hai(단수), 책들은 pasand hain(복수)입니다.'
    note: 2단원에서 이미 배운 hai/hain의 수 일치 규칙을 새로운 상황으로 확장합니다. 새로운 문법 개념을 도입하는 것이 아닙니다.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: '복습: 너에게 (친근한 말)'
    gloss: 너에게 (친근한 말)
    note: 6단원에서 chahiye와 함께 처음 배웠습니다('tumhein...chahiye?'). 이 단원에서는 같은 여격 대명사를 pasand hai와 함께 씁니다.
    example_gloss: 음악을 좋아해요?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: 질문 맨 앞의 'Kya'는 예/아니요 질문 표지입니다(1단원). 'tumhein'은 'tumhein...chahiye?'(6단원)에서 쓴 것과 같은 여격 주어 틀을 반복합니다. 여기서는 'chahiye' 자리에 'pasand hai'가 옵니다.
    note: 새로운 문법이 아니라 이미 아는 질문 틀을 다시 적용한 것임을 확인합니다.
  hi.a1.unit13.lesson02.teach.khel:
    title: 스포츠 / 경기
    gloss: 스포츠 / 경기
    note: 새 명사입니다. 'khel'은 단수와 복수의 형태가 같으므로, 예문에서는 'yah'(이)와 함께 써서 수 일치가 헷갈리지 않게 합니다.
    example_gloss: 저는 이 운동을 좋아해요.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: '복습: 이'
    gloss: 이것
    note: 7단원에서 처음 배웠습니다('mujhe yah chahiye'). 여기서는 'khel'이 단수임을 분명히 하기 위해 다시 씁니다.
    example_gloss: 이 책은 좋아요.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: '복습: 또는'
    gloss: 또는
    note: 6·7단원에서 음식과 물건을 주문할 때 처음 배웠습니다. 여기서는 좋아하는 것을 고르는 질문을 할 때 다시 씁니다.
    example_gloss: 차예요, 커피예요?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: 차를 좋아해요, 커피를 좋아해요?
    gloss: 차를 좋아해요, 커피를 좋아해요?
    note: 이번 과의 tumhein 질문 틀에 이미 배운 ya(또는)를 합쳐서 하나를 고르게 묻는 문장입니다.
  hi.a1.unit13.lesson02.teach.zyada:
    title: 더
    gloss: 더
    note: 이미 언급한 두 가지 중 하나를 더 좋아한다고 말할 때 'pasand hai' 바로 앞에 놓는 새 단어입니다.
    example_gloss: 저는 차를 더 좋아해요.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = 더 좋아해요
    gloss: '''X zyada pasand hai''는 두 가지 중 하나를 더 좋아한다는 뜻입니다. ''mujhe chai zyada pasand hai''는 ''저는 차를 더 좋아해요''라는 뜻입니다.'
    note: 새로운 문법이 아니라 어휘 확장입니다. 'zyada'는 이미 배운 'pasand hai'를 꾸며 줄 뿐입니다.
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (선호하다) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''मैं दूसरी चीज़ों से ज़्यादा चाय पसंद करता हूँ'' (차를 더 좋아해요 / 차를 더 선호해요)।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: '복습: 음악, 스포츠, 책'
    gloss: 음악, 스포츠/경기, 책들
    note: 대화문과 읽기 글에 필요한 이 단원의 핵심 명사를 간단히 복습합니다.
    example_gloss:
    - 저는 음악을 좋아해요.
    - 저는 이 운동을 좋아하지 않아요.
    - 저는 책을 좋아해요.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: 아르준이 음악에 대해 물어봐요
    gloss: 프리야, 음악 좋아해요?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: 프리야가 아주 좋아한다고 말해요
    gloss: 네, 저는 음악을 아주 좋아해요. 당신은요?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: 아르준이 공감하며 운동 이야기를 덧붙여요
    gloss: 저도요! 그리고 저는 운동도 좋아해요.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: 프리야는 이 경기보다 책을 더 좋아해요
    gloss: 그렇군요! 저는 이 경기는 좋아하지 않아요. 책을 좋아해요.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 아르준이 차와 커피 중 무엇을 좋아하는지 물어봐요
    gloss: 좋아요. 차를 좋아해요, 커피를 좋아해요?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: 프리야는 차를 더 좋아해요
    gloss: 저는 차를 더 좋아해요.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: 아르준이 공감해요
    gloss: 아주 좋아요! 저도 차를 좋아해요.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: 프리야가 마무리해요
    gloss: 좋아요! 내일 또 만날까요?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: 서로 관련된 세 가지 패턴
    gloss: 이 단원의 세 가지 패턴입니다. 'chahiye'(원하다/필요하다, 6단원) 뒤에는 'hai'가 오지 않고, 'pasand hai/hain'(이 단원)은 대상의 수에 따라 달라지며, 'zyada pasand hai'는 두 가지 중 하나를 더 좋아한다는 뜻입니다.
    note: 단원 전체의 문법을 하나로 묶는 마무리 요약입니다. 12단원의 활용 정리 문법 노트와 같은 방식입니다.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (선호하다)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: 프리야의 쪽지
    gloss: 아르준, 저는 음악을 아주 좋아해요. 책도 좋아해요. 이 경기는 좋아하지 않아요. 차를 더 좋아해요. - 프리야
    note: 대화에서 이미 나온 내용을 그대로 다시 적은 짧은 쪽지이며, 새로운 내용은 없습니다.
    glosses:
      संगीत: 음악
      बहुत: 매우
      पसंद: 좋아함 / 마음에 듦
      किताबें: 책들
      खेल: 경기
      नहीं: ~이/가 아니다
      चाय: 차
      ज़्यादा: 더 / 오히려
