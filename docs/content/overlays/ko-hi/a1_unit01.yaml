answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: 힌디어 A1
  description: 힌디어로 인사하고, 안부를 묻고, 자기소개를 하고, 기본적인 개인 정보를 주고받는 법을 배웁니다. 한국어의 존댓말과 반말처럼 격식을 가르는 aap/tum 체계와, 성에 따라 형태가 달라지는 힌디어의 형용사와 동사를 짚어 줍니다.
units:
  hi.a1.unit01.greetings:
    title: Namaste와 첫 만남
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap과 tum: 안부 묻기'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: 인사와 작별 인사
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: 이름, 출신, 그리고 요가 수업에서의 첫 만남
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: 격식 있는 '당신'
    gloss: 당신 (격식, 존중)
    note: 한국어에서 상대에 따라 존댓말과 반말을 고르듯, 힌디어도 상대에 따라 말을 고릅니다. *aap*는 연장자, 낯선 사람, 직장 등에서 존중해야 하는 사이에 씁니다. 문법적으로는 한 사람에게 써도 복수로 취급되어, *aap*와 호응하는 동사는 '그들'에 쓰는 것과 같은 -en/hain 계열 어미를 취합니다.
  hi.a1.unit01.lesson01.teach.tum:
    title: 격식 없는 '너'
    gloss: 너 (친근함, 격의 없음)
    note: '*Tum*은 친구, 또래, 손아랫사람, 가족에게 씁니다. 격의 없는 사이이지만 여전히 예의는 갖춘 표현입니다. 더 가까운 사이에 쓰는 *tu*와는 다르며, 이 과정에서는 *tu*를 가르치지 않습니다. *Tum*은 *aap*나 tu와 다른 고유의 동사 어미를 씁니다.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: 남성에게 하는 격식 있는 안부 질문
    gloss: 어떻게 지내세요? (격식, 남성에게)
    note: '*Kaise*는 말하는 사람이 아니라 질문을 받는 사람의 성별에 맞춰 달라집니다. 남성에게 말할 때 쓰는 형태입니다. 한국어의 ''어떻게 지내세요?''는 상대의 성별에 따라 바뀌지 않지만, 힌디어는 바뀝니다.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: 여성에게 하는 격식 있는 안부 질문
    gloss: 어떻게 지내세요? (격식, 여성에게)
    note: 같은 질문, 같은 *aap* 격식입니다. 여성에게 말할 때만 *kaise*가 *kaisi*로 바뀝니다. 동사 *hain*은 변하지 않고, 형용사 형태만 바뀝니다.
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: 격식 없는 안부 질문
    gloss: 잘 지내? (친한 사이)
    note: '*tum*과 함께 쓰는 동사는 *hain*이 아니라 *ho*입니다. 격식 있는 *Aap kaise/kaisi hain?*과 친근한 *Tum kaise ho?*를 비교해 보세요. aap과 tum의 차이를 동사에서 직접 들을 수 있는 가장 좋은 짝입니다.'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: 기본적인 대답
    gloss: 저는 잘 지내요, 고맙습니다.
    note: '*Theek*(''괜찮은'')은 성별이나 격식에 따라 바뀌지 않습니다. *kaise/kaisi*와 달리, 말하는 사람이 누구든 듣는 사람이 누구든 그대로입니다.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: 격식 있는 질문 되묻기
    gloss: 그쪽은요?
    note: 존중하는 aap 격식으로 질문을 되돌려 묻는 짧은 표현입니다.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: 격식 없는 질문 되묻기
    gloss: 너는?
    note: 친구나 또래에게 질문을 되돌려 물을 때는 tum을 씁니다.
  hi.a1.unit01.lesson02.teach.namaste:
    title: 두루 쓰는 인사
    gloss: 안녕하세요; 안녕 (작별 인사로도 씀)
    note: '*Namaste*는 하루 중 언제든, 격식 있는 자리와 편한 자리 모두에서, 만날 때와 헤어질 때 모두 쓸 수 있는 만능 인사입니다. 만날 때와 헤어질 때 인사말이 보통 다른 한국어와 대조됩니다.'
    example_gloss: 안녕하세요! 어떻게 지내세요?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: 존중을 담은 인사
    gloss: 안녕하세요 (namaste보다 더 격식 있고 공손함)
    note: '*Namaskar*는 *namaste*와 뜻이 거의 같지만 더 격식 있고 공손한 느낌입니다. 어른, 많은 청중, 직장 같은 자리에 알맞습니다.'
    example_gloss: Namaskar! 당신은요?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: 또 만나요 (미래)
    gloss: 또 만나요; 나중에 봐요
    note: 직역하면 '[우리는] 다시 만날 것이다'입니다. 그 사람을 또 만날 것으로 예상할 때 쓰는 표준적이고 무난한 작별 인사입니다.
  hi.a1.unit01.lesson02.teach.alvida:
    title: 격식 있는 작별 인사
    gloss: 안녕히 가세요; 작별
    note: '*Alvida*는 ''작별''을 뜻하는 올바른 힌디어 단어지만, 일상에서는 *namaste*나 *phir milenge*보다 더 마지막 같고 격식 있고 다소 극적인 느낌을 줍니다. 가볍게 ''잘 가''라고 하는 인사보다는 ''작별''에 가깝습니다.'
    example_gloss: 안녕히 가세요! 또 만나요.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: 또 봐요 (가벼운 표현/습관적 표현)
    gloss: 또 봐요; 다음에 봐요
    note: 직역하면 '[우리는] 다시 만난다'로, 미래형 대신 진행/습관을 나타내는 동사 형태를 씁니다. *phir milenge*보다 조금 더 가볍고 일상적인 표현입니다.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: 안녕히 주무세요
    gloss: 잘 자요
    note: 밤에 떠나거나 자러 갈 때 하는 말입니다. 한국어 '안녕히 주무세요'처럼 작별 인사이며, *namaste*와 달리 첫인사로는 쓰지 않습니다.
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: 공손한 마무리 인사
    gloss: 좋은 하루 보내세요.
    note: 직역하면 '당신의 하루가 계속 좋기를'입니다. 격식 있는 사이든 편한 사이든, 공손하게 헤어질 때 건네는 정중한 덕담입니다.
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: 격식 있게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: '*Aapka*(''당신의'')는 남성 명사 *naam*(''이름'')에 맞춰 형태가 바뀝니다. 힌디어의 소유 표현은 소유하는 사람이 아니라 소유되는 대상에 일치합니다. 한국어의 ''당신의''는 뒤에 오는 명사에 따라 바뀌지 않습니다.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: 이름 묻기 (친근한 표현)
    gloss: 이름이 뭐야?
    note: '*aapka* 대신 *tumhara*(''너의'', 친근한 표현)를 쓰는 같은 패턴입니다. 격식 있는 *Aapka naam kya hai?*와 친근한 *Tumhara naam kya hai?*를 비교해 보세요.'
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: 이름 말하기
    gloss: 제 이름은 프리야예요.
    note: '*Mera*(''나의'')도 *naam*이 남성 명사이기 때문에 그에 맞춰 바뀝니다. 위의 *aapka*/*tumhara*와 같은 남성형 어미인 것을 확인해 보세요. 세 단어 모두 같은 명사를 꾸미기 때문입니다.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: 만나서 반갑다고 격식 있게 말하기
    gloss: 만나서 반갑습니다. (격식)
    note: 직역하면 '당신을 만나서 기쁨이 일어났다'입니다. 처음 만나는 자리에서 공손하게 쓰는, 널리 쓰이는 정형 표현입니다.
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: 같은 마음으로 답하기
    gloss: 저도요.
    note: Aapse milkar khushi hui나 Tumse milkar accha laga에 대한 짧고 자연스러운 대답입니다.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: 출신 묻기 (격식)
    gloss: 어디에서 오셨어요?
    note: Kahan은 '어디', se는 '~에서'라는 뜻입니다.
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: 출신 말하기
    gloss: 저는 인도 출신이에요.
    note: Bharat는 인도를 가리키는 힌디어 이름으로, 일상 대화에서 아주 자주 쓰입니다.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: 친근하게 출신 묻기
    gloss: 어디에서 왔어?
    note: '*aap*과 *hain* 대신 *tum*과 *ho*를 쓰는 같은 질문입니다. 이 단원 내내 나온 격식/비격식 동사 어미 패턴과 같습니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: 만남의 시작
    gloss: 프리야가 아르준에게 인사하며 여기에 처음 왔는지 묻습니다.
    note: 두 사람 모두 처음부터 친근한 *tum* 격식을 씁니다. 동네 수업에서 가볍게 만난 또래 사이에 자연스럽습니다. *Tumhari*('너의')는 두 화자의 성별이 아니라 여성 명사 *baar*('번, 횟수')에 맞춰 바뀝니다.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: 만남의 시작, 대답
    gloss: 아르준은 그렇다고, 처음이며 요가를 배우고 싶다고 말합니다.
    note: '*Chahta hoon*(''원한다'')이 여기서 남성형인 이유는 말하는 사람인 아르준이 남성이기 때문입니다. 이 동사는 말하는 사람의 성별에 일치합니다. 앞서 나온 *kaisi*/*kaise*가 질문받는 사람의 성별에 일치한 것과 다릅니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: 이름 주고받기
    gloss: 프리야는 "저도요!"라고 하며 자기 이름을 말하고 아르준의 이름을 묻습니다.
    note: '*Main bhi!*(''저도요!'')는 아르준의 *main ... chahta hoon*에 대한 대답입니다. 상대 문장의 주어가 *main*일 때 ''저도요''는 *main bhi*입니다. *Mujhe bhi*는 *Tumse milkar accha laga*처럼 *mujhe* 유형의 문장에 대한 대답입니다. *Mera naam...hai*는 이름을 말하는 자연스럽고 간단한 방법입니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: 이름 주고받기, 대답
    gloss: 아르준은 자기 이름을 말하고 만나서 반갑다고 친근하게 말합니다.
    note: '*Tumse milkar accha laga*는 이번 과의 격식 있는 *Aapse milkar khushi hui*에 대응하는 친근한 표현입니다. 둘 다 대략 ''만나서 반가워요''라는 뜻이며, 격식에 맞춰 골라 씁니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: 출신 묻기
    gloss: 프리야도 같은 마음이라고 답하고, 아르준의 출신을 묻습니다.
    note: Tum kahan se ho는 이미 배운 친근한 격식으로 출신을 묻는 말입니다.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: 출신 묻기, 대답
    gloss: 아르준은 인도 출신이지만 지금은 런던에 산다고 말하고, 같은 질문을 되묻습니다.
    note: '*Rahta hoon*(''산다'')은 말하는 사람인 아르준에 일치하는 남성형으로, 2번째 대사의 *chahta hoon*과 같은 주어 일치 패턴입니다. *Lekin*(''하지만'')은 출신지와 현재 거주지의 대조를 이어 줍니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: 출신과 관심사 이야기하기
    gloss: 프리야는 미국 출신이며 자신도 요가를 배우고 싶다고 말합니다.
    note: '*Chahti hoon*은 아르준이 2번째 대사에서 쓴 동사(*chahta hoon*)의 여성형입니다. 두 사람 모두 자기 성별에 맞춰 바뀌므로, 직접 비교해 볼 수 있는 좋은 짝입니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: 함께하는 활동에 대해 묻기
    gloss: 아르준은 반가워하며 프리야에게 요가를 하는지 묻습니다.
    note: '*Karti ho*(''하니?'')는 질문받는 사람인 프리야에 일치하는 여성형입니다. 앞의 *kaisi*처럼 이 동사 형태도 말하는 사람이 아니라 듣는 사람의 성별을 따릅니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: 함께하는 활동에 대해 묻기, 대답
    gloss: 프리야는 아니라고, 처음이며 지금 배우는 중이라고 말합니다.
    note: '*Seekh rahi hoon*(''배우는 중이다'')은 말하는 사람인 프리야에 일치하는 여성 진행형입니다. *chahti hoon*의 현재진행 짝입니다.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: 대화 마무리
    gloss: 아르준은 시작하자고 동의하고, 나중에 보자고 인사합니다.
    note: '*Chalo shuru karte hain*(''시작하자'')은 무언가를 함께 시작하자고 제안하는 자연스러운 정형 표현입니다. *Phir milte hain*은 2과에서 배운 가벼운 작별 인사로 대화를 마무리합니다.'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: '''당신''을 격식 있고 공손하게 말할 때 쓰는 단어는 무엇일까요?'
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: Aap은 연장자, 낯선 사람, 존중해야 하는 사이에 씁니다.
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: 친구나 또래 한 사람을 친근하게 부르는 말은 어느 것일까요?
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: Tum은 친구, 또래 등 격의 없지만 예의를 갖춘 사이에 씁니다.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: 이 질문은 무엇을 묻는 것이며, 누구에게 하는 말일까요?
    correct_option: 어떻게 지내세요? (격식, 여성에게)
