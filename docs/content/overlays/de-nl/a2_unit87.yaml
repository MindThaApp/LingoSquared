course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um über Regeln und Erlaubnis zu sprechen.
  learning_goal: Sie fragen, ob etwas erlaubt ist, und sagen mit mogen, moeten und hoeven niet te, was man tun muss oder nicht tun muss.
units:
  nl.a2.unit87.wat_mag_en_moet:
    title: Was erlaubt ist und was Pflicht ist
    description: Um Erlaubnis bitten und Hausregeln nennen mit mogen, moeten und hoeven niet te.
lessons:
  nl.a2.unit87.lesson01.mag_dat:
    title: Ist das erlaubt?
  nl.a2.unit87.lesson02.dat_moet:
    title: Das ist Pflicht
  nl.a2.unit87.lesson03.hoeven_niet_te:
    title: Das ist nicht nötig
  nl.a2.unit87.lesson04.zwembad_en_sportschool:
    title: Schwimmbad und Fitnessstudio
  nl.a2.unit87.lesson05.huisregels_bibliotheek:
    title: Hausordnung in der Bibliothek
  nl.a2.unit87.lesson06.lotte_en_omar:
    title: Lotte und Omar im Fitnessstudio
teaching:
  nl.a2.unit87.lesson01.teach.plekken:
    title: Orte mit Regeln
    gloss: die Bibliothek / das Schwimmbad / das Fitnessstudio
    note: Das sind drei Orte, an denen Regeln wichtig sind.
    example_gloss:
    - Ich lese in der Bibliothek ein Buch.
    - Noor schwimmt im Schwimmbad.
    - Omar ist im Fitnessstudio.
  nl.a2.unit87.lesson01.teach.handelingen:
    title: Was man tun oder nicht tun darf
    gloss: schwimmen / essen / telefonieren / rauchen / ausleihen
    note: Niederländische Verben enden im Infinitiv auf -en, wie im Deutschen. Den Infinitiv setzen Sie ans Satzende.
    example_gloss:
    - Ich möchte im Schwimmbad schwimmen.
    - Lotte möchte ein Brötchen essen.
    - Noor ruft Omar an.
    - Omar raucht nicht.
    - Ich leihe ein Buch aus.
  nl.a2.unit87.lesson01.teach.plaatsen:
    title: Hier, drinnen, draußen
    gloss: hier / drinnen / draußen
    note: Regeln hängen oft vom Ort ab.
    example_gloss:
    - Ich bin hier.
    - Drinnen ist es warm.
    - Draußen regnet es.
  nl.a2.unit87.lesson01.teach.gn_mogen:
    title: 'Mogen: dürfen'
    gloss: ich darf / du darfst / er darf / wir dürfen / ihr dürft / sie dürfen
    note: '*Mogen* bedeutet „dürfen“. Alle Formen im Singular lauten *mag*: *ik mag, jij mag, je mag, hij mag*. Der Plural lautet *mogen*.'
  nl.a2.unit87.lesson01.teach.gn_tweede_plaats:
    title: Modalverb an zweiter Stelle, Infinitiv am Ende
    gloss: Ich darf hier schwimmen. Darf ich hier schwimmen?
    note: 'Im Aussagesatz steht das Modalverb an zweiter Stelle und der Infinitiv ganz am Ende: *Ik mag hier zwemmen.* In der Ja/Nein-Frage steht das Modalverb an erster Stelle, der Infinitiv aber weiterhin am Ende: *Mag ik hier zwemmen?*'
  nl.a2.unit87.lesson01.teach.antwoorden:
    title: Kurze Antworten
    gloss: Ja, das ist erlaubt. Nein, das ist nicht erlaubt.
  nl.a2.unit87.lesson01.teach.vragen:
    title: Um Erlaubnis bitten
    gloss: Darf ich hier essen? Darf ich hier telefonieren? Darf ich hier rauchen?
  nl.a2.unit87.lesson02.teach.regels:
    title: Regeln und Karten
    gloss: die Regel / die Hausordnung / die Karte
    note: '*Huisregels* steht im Plural: Das Wort bezeichnet alle Regeln eines Gebäudes.'
    example_gloss:
    - Das ist eine Regel.
    - Lies die Hausordnung.
    - Ich habe meine Karte.
  nl.a2.unit87.lesson02.teach.handeling2:
    title: Was man tun muss
    gloss: bezahlen / zeigen / duschen
    note: '*Laten zien* besteht aus zwei Wörtern. Zusammen bedeuten sie „zeigen“.'
    example_gloss:
    - Omar bezahlt mit seiner Karte.
    - Ich werde meine Karte zeigen.
    - Lotte möchte zuerst duschen.
  nl.a2.unit87.lesson02.teach.afval:
    title: Mülltrennung
    gloss: der Müll / trennen (sortieren)
    note: In den Niederlanden trennt man den Müll in Glas, Papier und Plastik.
    example_gloss:
    - Wir trennen den Müll.
    - Du musst Glas, Papier und Plastik trennen.
  nl.a2.unit87.lesson02.teach.materialen:
    title: Materialien
    gloss: das Papier / das Glas / das Plastik
    note: Müll wird nach Material getrennt.
    example_gloss:
    - Das ist Papier.
    - Das ist Glas.
    - Das ist Plastik.
  nl.a2.unit87.lesson02.teach.gn_moeten:
    title: 'Moeten: müssen'
    gloss: ich muss / du musst / er muss / wir müssen / ihr müsst / sie müssen
    note: '*Moeten* bedeutet „müssen“. Alle Formen im Singular lauten *moet*: *ik moet, jij moet, je moet, hij moet*. Der Plural lautet *moeten*.'
  nl.a2.unit87.lesson02.teach.gn_moeten_zin:
    title: Moeten funktioniert wie mogen
    gloss: Du musst deine Karte zeigen. Muss ich bezahlen?
    note: '*Moeten* verhält sich wie *mogen*: Im Aussagesatz steht es an zweiter Stelle (nach dem ersten Satzglied), es eröffnet die Ja/Nein-Frage, und der Infinitiv steht am Ende. Bei *laten zien* bleiben beide Wörter am Ende zusammen.'
  nl.a2.unit87.lesson02.teach.zinnen:
    title: Zwei Regeln
    gloss: Ich muss meine Karte zeigen. Wir müssen den Müll trennen.
  nl.a2.unit87.lesson03.teach.tijd:
    title: Heute, jetzt, immer
    gloss: heute / jetzt / immer
    note: Diese Wörter kommen oft in Regeln vor.
    example_gloss:
    - Das Schwimmbad ist heute geöffnet.
    - Ich bin jetzt im Fitnessstudio.
    - Omar ist immer pünktlich.
  nl.a2.unit87.lesson03.teach.gn_hoeven:
    title: 'Hoeven: nicht müssen / nicht brauchen'
    gloss: ich muss nicht / du musst nicht / er muss nicht / wir müssen nicht / ihr müsst nicht / sie müssen nicht
    note: '*Hoeven* wird normalerweise mit *niet* oder *geen* und *te* + Infinitiv verwendet. Es bedeutet, dass etwas nicht notwendig ist. Die Formen lauten *ik hoef, jij hoeft, hij hoeft, wij hoeven*. Bei *jij* in einer Frage fällt das -t weg: *hoef jij*.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_niet_te:
    title: Hoeven niet te + Infinitiv
    gloss: Sie müssen nicht bezahlen. Muss ich heute nicht bezahlen?
    note: 'Setzen Sie *niet te* direkt vor den Infinitiv: *Je hoeft niet te betalen.* Das Modalverb *hoeft* steht an zweiter Stelle; *te* + Infinitiv steht am Ende.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_geen:
    title: Niet oder geen
    gloss: Du musst deine Karte nicht zeigen. Du musst keine Karte zeigen.
    note: 'Nach einem bestimmten Objekt wie *je kaart* steht *niet* hinter dem Objekt: *Je hoeft je kaart niet te laten zien.* Bei einem unbestimmten Nomen verwendet man *geen*: *Je hoeft geen kaart te laten zien.* *Te* steht vor *laten zien*.'
  nl.a2.unit87.lesson03.teach.gn_contrast:
    title: Pflicht, freie Wahl, Verbot
    gloss: Das ist Pflicht. Das ist nicht nötig. Das ist nicht erlaubt. Das ist erlaubt.
    note: '*Dat moet* = Pflicht. *Dat hoeft niet* = nicht nötig, Sie haben die Wahl. *Dat mag niet* = verboten. Für ein Verbot verwendet man *mag niet*, nicht *hoeft niet*.'
  nl.a2.unit87.lesson04.teach.kleedkamer:
    title: Wörter für Schwimmbad und Fitnessstudio
    gloss: das Handtuch / die Umkleidekabine / zuerst
    note: '*Eerst* bedeutet „zuerst“ und steht oft bei einer Regel.'
    example_gloss:
    - Mein Handtuch ist in der Umkleidekabine.
    - Erst duschen, dann schwimmen.
    - Lotte kommt zuerst ins Fitnessstudio.
  nl.a2.unit87.lesson04.teach.gn_voorop:
    title: Noch ein Wort am Satzanfang
    gloss: Hier darfst du nicht essen. Im Schwimmbad musst du zuerst duschen.
    note: 'Der Satz kann mit einer Ortsangabe beginnen. Das Modalverb bleibt an zweiter Stelle, das Subjekt folgt danach: *Hier mag je niet eten.* Der Infinitiv steht weiterhin am Ende.'
  nl.a2.unit87.lesson04.teach.gn_vraagwoord:
    title: Fragewörter
    gloss: Was muss ich tun? Wo darf ich essen?
    note: 'Das Fragewort steht am Anfang. Dann folgt das Modalverb, dann das Subjekt, und der Infinitiv steht am Ende: *Wat moet ik doen?* *Waar mag ik eten?*'
  nl.a2.unit87.lesson04.teach.scenario:
    title: Im Schwimmbad
    gloss: Darf ich hier schwimmen? Ja, du musst zuerst duschen.
  nl.a2.unit87.lesson05.teach.nieuw:
    title: Neu, drei, kommen
    gloss: neu / drei / kommen
    note: 'Nach *de* oder *het* erhält das Adjektiv ein -e: *nieuw* wird zu *nieuwe* in *de nieuwe bibliotheek*. *Boeken* ist der Plural von *boek*.'
    example_gloss:
    - Die neue Bibliothek ist schön.
    - Ich leihe drei Bücher aus.
    - Kommst du auch?
  nl.a2.unit87.lesson05.teach.reading:
    title: Eine Nachricht für Lotte
    gloss: Hallo Lotte, ich bin in der neuen Bibliothek. Du musst deine Karte zeigen. Du darfst drei Bücher ausleihen. Hier darf man nicht essen, und du darfst nicht telefonieren. Du musst nicht bezahlen. Kommst du auch?
    note: Achten Sie darauf, was Pflicht ist, was erlaubt ist, was verboten ist und was nicht nötig ist.
    glosses:
      nieuwe: neu
      drie: drei
      boeken: Bücher
      lenen: ausleihen
      betalen: bezahlen
  nl.a2.unit87.lesson06.teach.lotte_vraag:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, ich bin neu im Fitnessstudio. Was muss ich tun?'
  nl.a2.unit87.lesson06.teach.omar_kaart:
    title: Omar nennt die erste Regel
    gloss: 'Omar: Du musst zuerst deine Karte zeigen.'
  nl.a2.unit87.lesson06.teach.lotte_bellen:
    title: Lotte fragt nach der Erlaubnis
    gloss: 'Lotte: Darf ich hier telefonieren?'
  nl.a2.unit87.lesson06.teach.omar_buiten:
    title: Omar sagt nein
    gloss: 'Omar: Nein, das ist nicht erlaubt. Du musst draußen telefonieren.'
  nl.a2.unit87.lesson06.teach.lotte_betalen:
    title: Lotte fragt nach dem Bezahlen
    gloss: 'Lotte: Muss ich heute bezahlen?'
  nl.a2.unit87.lesson06.teach.omar_hoeft:
    title: Omar antwortet
    gloss: 'Omar: Nein, du musst heute nicht bezahlen.'
