teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: Zusammen
    gloss: zusammen
    note: '*Samen* macht deutlich, dass mehrere Personen die Aktivität gemeinsam machen.'
    example_gloss: Trinken wir zusammen einen Kaffee?
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: Kaffee trinken gehen
    gloss: einen Kaffee trinken
    note: Im Niederländischen sagt man wörtlich *koffie drinken*, also „Kaffee trinken“.
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: Ins Kino gehen
    gloss: ins Kino gehen
    note: '*Naar de film gaan* ist eine gängige Art zu sagen, dass man ins Kino geht, ohne ein neues Ortswort einzuführen.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: Trinken wir einen Kaffee?
    gloss: Trinken wir einen Kaffee?
    note: '*Zullen we ...?* ist das niederländische Standardmuster, um eine gemeinsame Aktivität vorzuschlagen – ähnlich wie „Sollen wir ...?“ im Deutschen.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Zullen we verwenden
    gloss: Zullen we + Aktivität? ist die übliche Art, etwas gemeinsam vorzuschlagen.
    note: 'Setzen Sie die Aktivität nach *we* und das Verb ans Ende: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: Hast du Lust, ins Kino zu gehen?
    gloss: Hast du Lust, ins Kino zu gehen?
    note: Mit *Heb je zin om ...?* fragt man informell, ob die andere Person Lust auf eine Aktivität hat. Verwenden Sie hier *te* vor *gaan*.
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: Ja, super!
    gloss: Ja, super!
    note: '*Ja, leuk!* ist eine kurze, begeisterte Zusage.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: Gute Idee
    gloss: Gute Idee!
    note: Mit *Goed idee!* sagt man zu, indem man den Vorschlag positiv bewertet.
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: Das ist ein guter Plan
    gloss: Das ist ein guter Plan.
    note: Das ist eine etwas ausführlichere positive Antwort.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: Mit Grund absagen
    gloss: Tut mir leid, ich kann nicht, weil ich arbeite.
    note: '*Sorry* mildert die Absage ab, und *want* leitet die kurze Begründung ein.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: Ich habe keine Zeit
    gloss: Ich habe keine Zeit.
    note: '*Ik heb geen tijd* ist ein direkter, aber ganz normaler Grund für eine Absage.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: Freundlich absagen
    gloss: Sorry + ich kann nicht + ein kurzer Grund macht eine Absage freundlich.
    note: Im Gespräch ist ein Grund nicht nötig, aber mit ihm ist das Muster nützlicher und höflicher.
  nl.a1.unit11.lesson03.teach.afspreken:
    title: Sich verabreden
    gloss: sich verabreden
    note: '*Afspreken* wird nach *Zullen we* zusammengeschrieben. In *We spreken vrijdag af* wird es in *spreken* und *af* getrennt.'
    example_gloss: Treffen wir uns am Freitag um 14:30 Uhr?
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: Freitag um halb drei treffen
    gloss: Treffen wir uns Freitag um 14:30 Uhr?
    note: Hier werden der Wochentag aus Lektion 3 und *om* mit der Uhrzeit aus Lektion 4 kombiniert.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: Half drie bedeutet 2:30 Uhr
    gloss: half drie = 2:30 Uhr; om half drie nennt die Uhrzeit der Verabredung.
    note: 'Das Niederländische zählt wie das Deutsche auf die nächste volle Stunde zu: *half drie* ist halb auf drei zu, also 2:30 (14:30).'
  nl.a1.unit11.lesson03.teach.date_time:
    title: Datum und Uhrzeit
    gloss: am Freitag, dem 17. April, um 15:15 Uhr
    note: Wochentage und Monate werden kleingeschrieben. Verwenden Sie *op* beim Datum und *om* bei der Uhrzeit.
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: Die Uhrzeit bestätigen
    gloss: Ja, Freitag um 14:30 Uhr passt mir gut.
    note: '*Is goed* bestätigt, dass der vorgeschlagene Termin passt.'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: Nachricht, Einladung, Sprachcafé
    gloss: die Nachricht, die Einladung, das Sprachcafé
    note: Ein *bericht* ist eine kurze schriftliche oder digitale Nachricht, eine *uitnodiging* bittet jemanden, an einer Aktivität oder Veranstaltung teilzunehmen, und *taalcafé* (ein zusammengesetztes Wort mit Akzent) ist der Treffpunkt der Gruppe.
    example_gloss:
    - Ich habe eine Nachricht von Lotte.
    - Das ist eine Einladung ins Sprachcafé.
    - Wir trinken einen Kaffee im Sprachcafé.
  nl.a1.unit11.lesson04.teach.invitation:
    title: Lottes Einladung
    gloss: Hallo Omar, hast du Lust, am Samstag, den 18. April, um 14:30 Uhr im Sprachcafé Kaffee zu trinken? Viele Grüße, Lotte.
    note: 'Achten Sie beim Lesen auf vier Angaben: Aktivität, Datum, Uhrzeit und Ort.'
    glosses:
      Hoi: hallo
      zin: Lust (heb je zin = hast du Lust)
      zaterdag: Samstag
      april: April
      half: halb, d. h. eine halbe Stunde vor der nächsten vollen Stunde (half acht = 7:30)
      drie: drei
      koffie: Kaffee
      drinken: trinken / nehmen
      taalcafé: Sprachcafé
      Groet: Grüße
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: Eine Nachricht mit Vorschlag
    gloss: Hallo Omar, sollen wir am Freitag um 14:30 Uhr Kaffee trinken? Viele Grüße, Lotte.
    note: Die Nachricht enthält eine Begrüßung, eine Aktivität, einen Tag, eine Uhrzeit und eine Schlussformel.
    glosses:
      Hoi: hallo
      zullen: wir gehen
      vrijdag: Freitag
      half: halb, d. h. eine halbe Stunde vor der nächsten vollen Stunde (half acht = 7:30)
      drie: drei
      koffie: Kaffee
      drinken: trinken / nehmen
      Groet: Grüße
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: Eine Bestätigung
    gloss: Hallo Lotte, ja, gern! Freitag um 14:30 Uhr passt. Bis Freitag! Omar.
    note: Die Antwort sagt zu und wiederholt zur Bestätigung den Zeitplan.
    glosses:
      Hoi: hallo
      leuk: schön / super
      Vrijdag: Freitag
      half: halb, d. h. eine halbe Stunde vor der nächsten vollen Stunde (half acht = 7:30)
      drie: drei
      goed: gut / passt
      Tot: bis / bis dann
      vrijdag: Freitag
  nl.a1.unit11.lesson05.teach.message_shape:
    title: Was eine Nachricht enthält
    gloss: Eine kurze Nachricht nennt die Aktivität, den Tag oder das Datum und die Uhrzeit.
    note: Gruß und Verabschiedung sind nützlich, aber wichtig sind vor allem die Aktivität und der Zeitpunkt.
  nl.a1.unit11.lesson06.teach.proposal:
    title: Lotte schlägt Kaffee vor
    gloss: 'Lotte: Sollen wir am Freitag Kaffee trinken? Omar: Ja, gern! Um wie viel Uhr?'
    note: Omar sagt erst zu und fragt dann nach der Uhrzeit.
  nl.a1.unit11.lesson06.teach.first_time:
    title: Lottes erste Uhrzeit
    gloss: 'Lotte: Um 14:30 Uhr.'
    note: '*Half drie* bedeutet 2:30 (14:30), wie in Lektion 4.'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Omar schlägt eine andere Uhrzeit vor
    gloss: 'Omar: Tut mir leid, um 14:30 Uhr kann ich nicht. Geht es auch um 15:15 Uhr?'
    note: '*Kan het om ...?* ist eine knappe Art zu fragen, ob eine andere Uhrzeit passt.'
  nl.a1.unit11.lesson06.teach.confirm:
    title: Sie bestätigen den endgültigen Plan
    gloss: 'Lotte: Ja, 15:15 Uhr passt. Omar: Gut. Dann treffen wir uns am Freitag um 15:15 Uhr.'
    note: 'Hier wird *afspreken* getrennt: *spreken* steht weit vorn, *af* am Ende.'
