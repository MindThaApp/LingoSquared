teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobbyverben: *lezen* (lesen), *sporten* (Sport treiben) und *koken* (kochen).'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: Freizeit
    gloss: Freizeit
    note: '*De vrije tijd* ist ein de-Wort: *de vrije tijd*. Es ist der Schlüsselausdruck, um über Hobbys zu sprechen.'
    example_gloss: In meiner Freizeit lese ich gern.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*Lees* ist die Form der 1. Person Singular von *lezen* (lesen).'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbyverben: *muziek luisteren* (Musik hören), *tekenen* (zeichnen) und *gamen* (zocken, spielen), ein im Niederländischen gebräuchliches englisches Lehnwort.'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Luisteren naar* (zuhören, hören) steht immer mit *naar* vor dem Objekt.'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*Met vrienden* (mit Freunden) greift *vrienden* aus Lektion 1 wieder auf.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: Die vier wichtigsten Häufigkeitsadverbien. *Vaak* kam schon in Einheit 5 vor (*Zie je hem vaak?*); die anderen drei sind hier neu.
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*Elke week* und *elk weekend* bedeuten beide „jede/jedes“, aber die Form richtet sich nach dem Geschlecht des Nomens – siehe die nächste Karte.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke oder elk
    gloss: Bei de-Wörtern wie week verwendet man elke. Bei het-Wörtern wie weekend verwendet man elk.
    note: '*Week* ist ein de-Wort (*de week*) und steht daher mit *elke*; *weekend* ist ein het-Wort (*het weekend*) und steht mit *elk* – dasselbe de/het-Muster wie bei *de rekening* und *het wisselgeld* in Einheit 23.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte spricht über Hobbys
    gloss: 'Lotte: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Omar?'
    note: '*We wandelen vaak samen* verweist auf Einheit 13, in der Lotte und Omar beide sagten, dass sie gern *wandelen*.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Omars Hobbys
    gloss: 'Omar: Ich koche gern, auch zu Hause. Und ich treibe oft Sport.'
    note: '*Ook thuis* (auch zu Hause) macht klar, dass Omar nicht nur in seinem Job im Restaurant, sondern auch zum Vergnügen kocht.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte ist überrascht
    gloss: 'Lotte: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Al de hele dag* (schon den ganzen Tag) betont, wie viel Omar bei der Arbeit ohnehin schon kocht.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar erklärt
    gloss: 'Omar: Ja, aber ich finde Kochen entspannend. Und du, was machst du gern?'
    note: '*Koken vind ik ontspannend* stellt das Objekt *koken* zur Betonung voran – wörtlich „Kochen finde ich entspannend“.'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Lottes Hobbys
    gloss: 'Lotte: Ich lese gern und höre oft Musik.'
    note: Verbindet zwei Hobbyverben aus den Lektionen 1–2 in einem Satz mit *en* (und).
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar fragt nach dem Gamen
    gloss: 'Omar: Zockst du auch?'
    note: Eine kurze Ja/Nein-Frage mit *gamen* aus Lektion 2.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotte antwortet
    gloss: 'Lotte: Nein, ich zocke nie. Aber ich zeichne manchmal!'
    note: '*Nooit* (nie) und *soms* (manchmal) aus Lektion 3, in einer Antwort gegenübergestellt.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: Hobbys im Vergleich
    gloss: Omar und ich gehen oft zusammen spazieren. Aber wir haben auch andere Hobbys. Omar kocht gern, auch zu Hause, und er treibt oft Sport. Ich lese gern und höre oft Musik. Ich zeichne manchmal, aber ich zocke nie. Was machst du gern in deiner Freizeit?
    note: Lottes Nachricht fasst Fakten aus einer früheren Lektion zusammen und endet mit der Kernfrage der Einheit an die Leserin oder den Leser.
    glosses:
      wandelen: spazieren gehen
      vaak: oft
      samen: zusammen
      andere: andere
      kookt: kocht
      graag: mag
      thuis: zu Hause
      sport: macht Sport
      lees: lesen
      luister: hören
      muziek: Musik
      teken: zeichne
      soms: manchmal
      game: Videospiele spielen
      nooit: nie
      vrije: frei
      tijd: Zeit
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar fragt nach dem Wochenende
    gloss: 'Omar: Was machst du dieses Wochenende?'
    note: '*Dit weekend* (dieses Wochenende) greift den Zeitausdruck aus Unit 19 wieder auf.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte ist unentschlossen
    gloss: 'Lotte: Das weiß ich noch nicht. Ich lese gern, aber ich möchte auch nach draußen.'
    note: '*Naar buiten* (nach draußen, wörtlich „nach draußen“) ist eine gängige Art zu sagen, dass man aus dem Haus gehen möchte.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar macht einen Vorschlag
    gloss: 'Omar: Sollen wir zusammen spazieren gehen? Danach koche ich für uns.'
    note: '*Daarna* (danach) greift das Wort für die Reihenfolge aus *eerst, dan, daarna* in Unit 10 wieder auf.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte stimmt zu
    gloss: 'Lotte: Gute Idee! Ich mag Spazierengehen und Kochen beides gern.'
    note: '*Allebei* (beides) zeigt, dass Lotte zwei Dinge gleich gern mag, nicht eines lieber als das andere.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar bestätigt
    gloss: 'Omar: Perfekt. Dann sehe ich dich am Samstag!'
    note: Ein freundlicher Schlusssatz, der den Plan für *zaterdag* (Samstag) bestätigt.
