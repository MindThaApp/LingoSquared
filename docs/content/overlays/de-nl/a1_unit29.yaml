course:
  title: Niederländisch A1
  description: 'Niederländisch für Anfänger: Freizeitaktivitäten beschreiben – Hobbywortschatz, Häufigkeitsangaben, fragen und antworten, was jemand in der Freizeit macht, und die Hobbys zweier Personen vergleichen.'
