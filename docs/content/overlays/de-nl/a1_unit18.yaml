    gloss: die Küche, das Badezimmer
    note: '*De keuken* und *de badkamer* sind beide de-Wörter.'
    example_gloss:
    - Ich habe eine Küche.
    - Ich habe ein Badezimmer.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: Sagen, dass man eine Wohnung hat
    gloss: Ich habe eine Wohnung.
    note: '*Hebben* (haben) ist das natürliche Verb, um zu sagen, was für eine Wohnung man hat – genau wie im Deutschen. Das ist ein allgemeines Beispiel; Omars eigene Wohnung (in Utrecht) wird später in dieser Einheit vorgestellt.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: Alle Zimmer aufzählen
    gloss: Ich habe ein Wohnzimmer, ein Schlafzimmer, eine Küche und ein Badezimmer.
    note: Alle vier Zimmer aus dem Wortschatz dieser Lektion in einem Satz, durch Kommas getrennt und mit einem abschließenden *en* verbunden.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: Nach der Zimmeranzahl fragen
    gloss: Wie viele Zimmer haben Sie?
    note: '*Hoeveel* (wie viele/wie viel) greift das Muster der Mengenfragen aus den früheren Zahlenlektionen wieder auf.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: Die Zahl der Zimmer nennen
    gloss: Ich habe zwei Schlafzimmer.
