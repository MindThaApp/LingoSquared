teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: Wohnung, Wohnzimmer, Schlafzimmer
    gloss: die Wohnung, das Wohnzimmer, das Schlafzimmer
    note: '*Het appartement* ist ein Neutrum (het-Wort); *de woonkamer* und *de slaapkamer* sind de-Wörter.'
    example_gloss:
    - Ich habe eine Wohnung.
    - Ich habe ein Wohnzimmer.
    - Ich habe ein Schlafzimmer.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
