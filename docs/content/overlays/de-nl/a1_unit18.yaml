  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: Die Gesamtzahl der Zimmer nennen
    gloss: Die Wohnung hat drei Zimmer.
    note: '*Kamers* ist ein allgemeines Wort für Zimmer und nicht auf Schlafzimmer beschränkt.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: Balkon, Garten
    gloss: der Balkon, der Garten
    note: '*Het balkon* ist ein het-Wort; *de tuin* ist ein de-Wort.'
    example_gloss:
    - Es gibt einen Balkon.
    - Es gibt keinen Garten.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: Sagen, dass es etwas gibt
    gloss: Es gibt einen Balkon.
    note: '*Er is* ist die übliche niederländische Konstruktion für „es gibt“ bzw. „da ist“.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: Sagen, dass es etwas nicht gibt
    gloss: Es gibt keinen Garten.
