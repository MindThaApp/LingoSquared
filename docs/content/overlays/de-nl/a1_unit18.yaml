  nl.a1.unit18.lesson04.teach.gezellig:
    title: Gemütlich
    gloss: gemütlich
    note: Ein sehr häufiges, typisch niederländisches Adjektiv für eine warme, angenehme Atmosphäre. Es lässt sich nicht mit einem einzigen deutschen Wort wiedergeben; „gemütlich“ kommt dem am nächsten.
