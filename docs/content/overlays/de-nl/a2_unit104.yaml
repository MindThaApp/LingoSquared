    pairs:
    - left: Ik zie hem.
      right: Ich sehe ihn.
    - left: Ik zie haar.
      right: Ich sehe sie.
    - left: Hij ziet ons.
      right: Er sieht uns.
    - left: Hij ziet jullie.
      right: Er sieht euch.
    - left: Hij ziet me.
