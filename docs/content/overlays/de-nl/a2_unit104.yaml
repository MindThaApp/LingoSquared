    feedback: 'Sachen: *het boek* ergibt *het*, *de pen* ergibt *hem*, der Plural *de bloemen* ergibt *ze*. Personen: *Noor* ergibt *haar*, *Lotte en ik* ergibt *ons*, *Omar en jij* ergibt *jullie*.'
    pairs:
    - left: het boek
      right: het
    - left: de pen
      right: hem
    - left: de bloemen
      right: ze
    - left: Noor
      right: haar
    - left: Lotte en ik
      right: ons
    - left: Omar en jij
      right: jullie
  nl.a2.unit104.lesson02.exercise04.volgorde_winkel:
