course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um auf Personen und Dinge zurückzuverweisen.
  learning_goal: Mit Objektpronomen und er auf Personen und Dinge zurückverweisen, statt sie zu wiederholen.
units:
  nl.a2.unit104.hem_haar_ze_er:
    title: Hem, haar, ze und er
    description: Verwenden Sie Objektpronomen und er (mit Zahlen und Präpositionen), um über Geschenke, Ausleihen und Zurückgeben zu sprechen, ohne sich zu wiederholen.
lessons:
  nl.a2.unit104.lesson01.cadeaus_en_boeken:
    title: Geschenke und Bücher
  nl.a2.unit104.lesson02.hem_haar_het_ze:
    title: Hem, haar, het und ze
  nl.a2.unit104.lesson03.mij_of_me:
    title: Mij oder me? Jou oder je?
  nl.a2.unit104.lesson04.hoeveel_er:
    title: Wie viele? Ik heb er drie
  nl.a2.unit104.lesson05.erover_ermee:
    title: Erover, ervan, ermee, ernaar
  nl.a2.unit104.lesson06.boeken_terugbrengen:
    title: Bücher zurückbringen
teaching:
  nl.a2.unit104.lesson01.teach.plaatsen:
    title: Orte und Feste
    gloss: das Geschäft / die Bibliothek / der Geburtstag / die Feier
    note: Diese Wörter kennen Sie vielleicht schon aus A1; hier bilden sie den Rahmen für Geschenke und Ausleihen.
    example_gloss:
    - Ich gehe in die Bibliothek.
    - Noor gibt eine Feier.
    - Im Geschäft kaufe ich ein Geschenk.
  nl.a2.unit104.lesson01.teach.cadeaus:
    title: Geschenke und Dinge zum Ausleihen
    gloss: das Geschenk / das Buch / die Blumen / der Stift / der Regenschirm
    note: '*Het cadeau* und *het boek* sind het-Wörter; *de pen* und *de paraplu* sind de-Wörter. *De bloemen* steht im Plural.'
    example_gloss:
    - Ich habe ein Geschenk für Noor.
    - Darf ich deinen Stift ausleihen?
    - Ich kaufe Blumen.
  nl.a2.unit104.lesson01.teach.werkwoorden:
    title: Kaufen, geben, leihen, zurückbringen
    gloss: kaufen / geben / leihen / zurückbringen / zurückgeben
    note: '*Lenen* bedeutet hier „sich etwas leihen“. *Terugbrengen* und *teruggeven* sind trennbar: *ik breng het terug*, *ik geef het terug*.'
    example_gloss:
    - Ich kaufe Blumen.
    - Darf ich den Stift ausleihen?
    - Ich bringe das Buch zurück.
    - Ich gebe es zurück.
  nl.a2.unit104.lesson01.teach.vrienden:
    title: Die drei Freunde
    gloss: Lotte, Omar und Noor sind Freunde.
  nl.a2.unit104.lesson01.teach.gn_objectvormen:
    title: Objektpronomen
    gloss: ich → mich/mir; du → dich/dir; er → ihn/ihm; sie → sie/ihr; es → es/ihm; wir → uns; ihr → euch; sie (Plural) → sie/ihnen
    note: 'Nach einem Verb steht die Objektform: *Ik zie hem*. *Me/je/ze* sind die normalen gesprochenen Formen; *mij/jou* sind die betonten Formen. Für mehrere Personen oder Dinge sagt man *ze*. *Hen* und *hun* gibt es auch, vor allem in der Schriftsprache: In der gesprochenen Sprache können Sie sie vermeiden.'
  nl.a2.unit104.lesson01.teach.gn_nadruk:
    title: Betont oder unbetont
    gloss: Ich sehe dich. Ich sehe dich, nicht ihn. Er sieht mich. Er sieht mich, nicht sie.
    note: Verwenden Sie normalerweise *me* und *je*. Verwenden Sie *mij* und *jou*, wenn Sie die Person betonen oder einen Gegensatz ausdrücken wollen.
  nl.a2.unit104.lesson01.teach.zinnen:
    title: Pronomen in Sätzen
    gloss: Er schenkt mir ein Geschenk. Ich schenke ihr Blumen. Lotte sieht uns.
  nl.a2.unit104.lesson02.teach.spullen:
    title: Weitere Dinge und ein Fragewort
    gloss: das Fahrrad / die Tasche / die Torte / die Karte / wo
    note: '*Taart* und *kaart* sind nützlich für Geburtstage und Feiern.'
    example_gloss:
    - Wo ist die Tasche?
    - Die Torte ist für die Feier.
    - Ich habe eine Karte für Lotte.
  nl.a2.unit104.lesson02.teach.bezit:
    title: Mein und dein
    gloss: mein / dein / von
    note: '*Je* kann „dich“ oder „dein“ bedeuten: *Ik zie je* (dich) und *je boek* (dein Buch).'
    example_gloss:
    - Ich habe meinen Stift.
    - Ich habe dein Buch.
    - Noors Buch.
  nl.a2.unit104.lesson02.teach.gn_het_hem:
    title: Het für het-Wörter, hem für de-Wörter
    gloss: Das Buch? Ich habe es. Der Stift? Ich habe ihn. Die Tasche? Ich sehe sie.
    note: 'Bei Dingen richtet sich das Niederländische nach dem Artikel: Ein het-Wort wird zu *het*, ein de-Wort im Singular wird zu *hem*. Im Deutschen richtet sich das Pronomen nach dem Genus (er/sie/es), im Niederländischen gibt es nur zwei Gruppen. Verwenden Sie *het* nicht für ein de-Wort.'
  nl.a2.unit104.lesson02.teach.gn_ze:
    title: Ze für den Plural
    gloss: Die Blumen? Ich kaufe sie. Lotte und Omar? Ich sehe sie.
    note: '*Ze* bezieht sich in der gesprochenen Sprache auf mehr als ein Ding oder eine Person. *Hen* gibt es für Personen auch, aber vor allem in der Schriftsprache.'
  nl.a2.unit104.lesson02.teach.zinnen:
    title: Vier Objektpronomen
    gloss: Ich sehe ihn. Ich sehe sie. Ich sehe es. Ich sehe sie.
  nl.a2.unit104.lesson03.teach.werkwoorden:
    title: Verben und Präpositionen bei Personen
    gloss: anrufen / helfen / kennen / für / mit
    note: '*Kennen* verwendet man für das Kennen einer Person.'
    example_gloss:
    - Ich rufe dich an.
    - Kannst du mir helfen?
    - Ich kenne ihn nicht.
    - Das Geschenk ist für sie.
    - Ich gehe mit euch.
  nl.a2.unit104.lesson03.teach.gn_contrast:
    title: Me/je oder mij/jou?
    gloss: Ich helfe dir. Ich helfe dir, nicht ihm.
    note: 'Normalerweise verwendet man *me* und *je*. Wenn Sie die Person betonen oder einen Gegensatz ausdrücken, verwenden Sie *mij* und *jou*: *Ik help jou, niet hem.*'
  nl.a2.unit104.lesson03.teach.gn_voorzetsel:
    title: Nach einer Präposition
    gloss: Das Geschenk ist für mich. Das Geschenk ist für dich. Ich gehe mit ihr.
    note: Nach einer Präposition (*voor, met, naar, van*) sind *mij* und *jou* die Standardformen. In unbetonter gesprochener Sprache sind auch *me* und *je* sehr üblich (*voor me*, *met je*).
  nl.a2.unit104.lesson03.teach.gn_jullie:
    title: du, ihr, sie
    gloss: Ich rufe dich an. Ich rufe euch an. Ich rufe sie an.
    note: '*Je* ist eine einzelne Person. *Jullie* sind mehrere Personen, mit denen Sie sprechen. *Ze* sind mehrere Personen, über die Sie sprechen.'
  nl.a2.unit104.lesson04.teach.getallen:
    title: Zahlen und Mengen
    gloss: eins / zwei / drei / vier / fünf / kein / wie viele
    note: '*Geen* bedeutet „kein“ oder „keine“.'
    example_gloss:
    - Ich habe zwei Bücher.
    - Ich habe keinen Stift.
    - Wie viele Bücher hast du?
    - Ich habe drei Stifte.
  nl.a2.unit104.lesson04.teach.gn_er_getal:
    title: Er + Zahl
    gloss: Wie viele Bücher hast du? Ich habe drei (davon).
    note: 'Wenn Sie das Ding weglassen und nur eine Zahl nennen, setzen Sie *er* vor die Zahl: *Ik heb er drie.* Ohne *er* ist der Satz unvollständig.'
  nl.a2.unit104.lesson04.teach.gn_er_geen:
    title: Er + één / geen
    gloss: Hast du einen Stift? Ja, ich habe einen. Hast du Taschen? Nein, ich habe keine.
    note: 'Mit *er* wird *een* zu *één*, und auch *geen* steht nach *er*: *Ik heb er geen.*'
  nl.a2.unit104.lesson04.teach.gn_er_ze:
    title: Ze oder er?
    gloss: Die Bücher? Ich habe sie. Bücher? Ich habe drei.
    note: Verwenden Sie *ze* für bestimmte Dinge, die beide kennen. Verwenden Sie *er*, wenn Sie angeben, wie viele davon es sind.
  nl.a2.unit104.lesson04.teach.gn_er_kopen:
    title: Er mit anderen Verben
    gloss: Ich möchte zwei (davon) kaufen. Ich leihe mir fünf (davon).
    note: '*Er* bleibt in der Nähe des Verbs. Mit *willen* steht es vor der Zahl und vor dem Infinitiv: *Ik wil er twee kopen.*'
  nl.a2.unit104.lesson05.teach.werkwoorden:
    title: Verben mit Präposition
    gloss: sprechen / schauen / schreiben / lieben, halten / froh / über / nach, zu
    note: '*Praten over* = sprechen über, *kijken naar* = ansehen, *schrijven met* = schreiben mit, *houden van* = lieben, mögen, *blij zijn met* = sich freuen über, zufrieden sein mit.'
    example_gloss:
    - Ich spreche über das Geschenk.
    - Ich schaue das Buch an.
    - Ich schreibe mit dem Stift.
    - Ich liebe Blumen.
    - Ich freue mich über das Geschenk.
  nl.a2.unit104.lesson05.teach.gn_er_voorzetsel:
    title: Er + Präposition bei Dingen
    gloss: Das Geschenk? Ich spreche darüber. Das Buch? Ich schaue es an. Der Stift? Ich schreibe damit. Blumen? Ich liebe sie.
    note: 'Bei Dingen sagt man nicht *over het* oder *met hem*. Verbinden Sie *er* und die Präposition: *erover, ernaar, ermee, ervan*. Das ist ähnlich wie im Deutschen „darüber, damit“.'
  nl.a2.unit104.lesson05.teach.gn_gesplitst:
    title: Er und die Präposition können getrennt stehen
    gloss: Ich freue mich darüber. Sprechen wir morgen darüber?
    note: 'In vielen Sätzen steht *er* früh und die Präposition am Ende: *Ik ben er blij mee.* *Ik ben ermee blij* ist auch möglich, aber *Ik ben er blij mee* ist die hier gelehrte neutrale Form.'
  nl.a2.unit104.lesson05.teach.gn_personen:
    title: Bei Personen bleibt die Präposition
    gloss: Ich spreche über Noor. Ich spreche über sie. Ich schaue Omar an. Ich schaue ihn an.
    note: Bei Personen verwendet man nicht *er*, sondern die Präposition plus *hem, haar, ze*. *Erover* und ähnliche Formen beziehen sich auf Dinge und Gedanken.
  nl.a2.unit104.lesson05.teach.lezen:
    title: Noors Nachricht
    gloss: Hallo Omar, danke für die Blumen! Ich liebe sie. Lottes Buch ist schön, ich freue mich darüber. Ich habe deinen Stift noch. Ich bringe ihn morgen zurück. Lotte hat deinen Regenschirm und bringt ihn am Freitag zurück.
    note: Finden Sie heraus, auf welches Ding sich jedes Pronomen bezieht.
    glosses:
      bedankt: danke
      vrijdag: Freitag
      mooi: schön
      nog: immer noch
  nl.a2.unit104.lesson06.teach.lotte_bibliotheek:
    title: Lotte sagt, wohin sie geht
    gloss: 'Lotte: Hallo Omar, ich gehe morgen in die Bibliothek.'
  nl.a2.unit104.lesson06.teach.omar_boeken:
    title: Omar bittet um einen Gefallen
    gloss: 'Omar: Kannst du meine Bücher zurückbringen? Ich habe drei.'
  nl.a2.unit104.lesson06.teach.lotte_ja:
    title: Lotte sagt zu und fragt nach einem Geschenk
    gloss: 'Lotte: Klar, ich bringe sie morgen zurück. Hast du auch ein Geschenk für Noor?'
  nl.a2.unit104.lesson06.teach.omar_bloemen:
    title: Omar nennt das Geschenk
    gloss: 'Omar: Ja, ich kaufe Blumen für sie. Sie liebt sie.'
  nl.a2.unit104.lesson06.teach.lotte_later:
    title: Lotte schlägt vor, später zu reden
    gloss: 'Lotte: Schön! Sprechen wir später darüber?'
  nl.a2.unit104.lesson06.teach.omar_bel:
    title: Omar verspricht einen Anruf
    gloss: 'Omar: Gut, ich rufe dich heute Abend an.'
exercises:
  nl.a2.unit104.lesson01.exercise01.kies_geeft:
    instruction: 'Wählen Sie den Satz, der bedeutet: Er schenkt mir ein Geschenk.'
    correct_option: Hij geeft me een cadeau.
    distractors:
    - Hij geeft ik een cadeau.
    - Hij geeft jij een cadeau.
    - Hij geeft hij een cadeau.
    accepted_answers:
    - value: Hij geeft me een cadeau.
      status: correct
    feedback: '*Hij geeft me een cadeau* = Er schenkt mir ein Geschenk. Nach dem Verb braucht man die Objektform *me*.'
    prompt_blocks:
