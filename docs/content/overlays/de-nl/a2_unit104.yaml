  nl.a2.unit104.lesson02.exercise01.kies_pen:
    instruction: 'Wählen Sie den Satz, der bedeutet: Der Stift? Ich habe ihn.'
    correct_option: De pen? Ik heb hem.
    distractors:
    - De pen? Ik heb het.
