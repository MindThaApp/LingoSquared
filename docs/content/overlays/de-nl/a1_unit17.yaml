teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: Nach dem Beruf fragen
    gloss: Was machst du beruflich?
    note: Eine übliche, lockere Art, nach jemandes Beruf zu fragen.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: Beruf / Koch
    gloss: der Beruf; Koch
    note: '*Het beroep* (der Beruf) ist sächlich. *Kok* (Koch) ist ein de-Wort und gilt für jedes Geschlecht: *een kok*, *de kok*.'
    example_gloss:
    - Was machen Sie beruflich?
    - Ich arbeite als Koch.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: Sagen, dass man Koch ist
    gloss: Ich arbeite als Koch.
    note: '*Werken als* + Beruf ist das übliche Muster, um einen Beruf zu nennen; vor dem Berufssubstantiv steht kein Artikel.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: Krankenschwester
    gloss: Krankenschwester
    note: Die moderne, geschlechtsneutrale Bezeichnung für diesen Beruf, die für alle Geschlechter verwendet wird.
    example_gloss: Ich arbeite als Krankenschwester.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: Sagen, dass man Krankenpfleger ist
    gloss: Ich arbeite als Krankenschwester.
    note: Es folgt demselben Muster *werken als* wie bei *kok*.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: Nach dem Arbeitsort fragen
    gloss: Wo arbeitest du?
    note: Eine direkte Anschlussfrage an *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: In einem Restaurant arbeiten
    gloss: Ich arbeite in einem Restaurant.
    note: '*Een restaurant* steht hier mit unbestimmtem Artikel, da es eines von vielen Restaurants ist.'
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: Das Krankenhaus
    gloss: das Krankenhaus
    note: 'Ein sächliches Substantiv: *het ziekenhuis*.'
    example_gloss: Ich arbeite im Krankenhaus.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: Im Krankenhaus arbeiten
    gloss: Ich arbeite im Krankenhaus.
    note: '*Het ziekenhuis* steht mit bestimmtem Artikel: Das Niederländische behandelt es als bestimmte, bekannte Einrichtung, wie auch im Deutschen „im Krankenhaus“ gesagt wird.'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: In einem Büro arbeiten
    gloss: Manche Leute arbeiten in einem Büro.
    note: '*Op kantoor* (im Büro) ist ein fester Ausdruck ohne Artikel, anders als *in een restaurant*/*in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: Arbeitsbeginn
    gloss: Ich fange um neun Uhr an.
    note: '*Begin* ist die ik-Form von *beginnen* (anfangen) und greift das Muster für Uhrzeiten aus Lektion 4 auf.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: Arbeitstage
    gloss: Ich arbeite von Montag bis Freitag.
    note: '*Van... tot...* greift das Muster für Zeiträume bei Wochentagen aus Lektion 3 auf.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: Die Pause
    gloss: die Pause
    note: 'Ein de-Wort: *de pauze*.'
    example_gloss: Ich habe um zwölf Uhr Pause.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: Pause haben
    gloss: Ich habe um zwölf Uhr Pause.
    note: '*Pauze hebben* (Pause haben) ist das natürliche feste Muster.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: Arbeitsende
    gloss: Ich höre um fünf Uhr auf.
    note: '*Stop* ist die ik-Form von *stoppen* (aufhören, Feierabend machen).'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: Ein ganzer Arbeitstag
    gloss: Ich fange um neun Uhr an und höre um fünf Uhr auf.
    note: Verbindet *begin* und *stop* mit *en* zu einem Satz, der einen ganzen Arbeitstag beschreibt.
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: Verbendungen in der dritten Person
    gloss: 'Bei er oder sie bekommt das Verb meist ein zusätzliches -t: er arbeitet, sie arbeitet.'
    note: Aus *werk* wird bei *hij*/*zij* *werkt*; das ist das regelmäßige niederländische Präsensmuster der dritten Person, wie im Deutschen „ich arbeite“ – „er arbeitet“.
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: Lottes Beruf
    gloss: Lotte arbeitet als Krankenschwester.
    note: '*Werkt* (nicht *werk*), weil das Subjekt ein Name in der dritten Person ist und nicht *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: Omars Beruf
    gloss: Omar arbeitet als Koch.
    note: Dieselbe -t-Endung der dritten Person wie in *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: Pronomen verwenden
    gloss: Sie arbeitet im Krankenhaus. Er arbeitet in einem Restaurant.
    note: '*Zij*/*hij* ersetzen die Namen Lotte/Omar, aber die Verbform der dritten Person mit -t bleibt gleich.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: Zwei Berufsprofile lesen
    gloss: Lotte arbeitet als Krankenschwester im Krankenhaus. Sie fängt um sieben Uhr an und arbeitet von Montag bis Freitag. Omar arbeitet als Koch in einem Restaurant. Er fängt um elf Uhr an und hat um vier Uhr Pause.
    note: Achten Sie bei jeder Person getrennt auf Beruf, Arbeitsort und Arbeitszeiten.
    glosses:
      werkt: arbeitet
      verpleegkundige: Krankenschwester
      ziekenhuis: Krankenhaus
      begint: beginnt
      zeven: sieben
      maandag: Montag
      vrijdag: Freitag
      kok: Koch / Küchenchef
      restaurant: Restaurant
      elf: elf
      pauze: Pause
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte fragt nach der Arbeit
    gloss: 'Lotte: Hallo Omar! Ich bin neugierig: Was machst du eigentlich beruflich?'
    note: '*Eigenlijk* (eigentlich) macht die Frage zu freundlicher Neugier statt zu einem Verhör.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar antwortet
    gloss: 'Omar: Ich arbeite als Koch in einem Restaurant. Und du?'
    note: '*En jij?* ist die übliche Art, die Frage an das Gegenüber zurückzugeben.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte antwortet
    gloss: 'Lotte: Ich arbeite als Krankenschwester im Krankenhaus.'
    note: Entspricht dem Beruf und Arbeitsort, die schon zuvor in dieser Einheit vorkamen.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar fragt nach den Arbeitszeiten
    gloss: 'Omar: Was hast du für Arbeitszeiten?'
    note: '*Uren maken* (wörtlich „Stunden machen“) ist eine feste Wendung, um die eigenen Arbeitszeiten zu beschreiben.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte nennt ihre Arbeitszeiten
    gloss: 'Lotte: Ich fange um sieben Uhr an und arbeite von Montag bis Freitag.'
    note: Entspricht dem Zeitplan, der schon im Leseprofil dieser Einheit vorkam.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Omar reagiert
    gloss: 'Omar: Das ist früh! Ich fange später an, um elf Uhr.'
    note: Entspricht Omars Arbeitsbeginn, der schon in lesson05 genannt wurde.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte schließt das Thema ab
    gloss: 'Lotte: Jeder Job hat seinen eigenen Rhythmus, denke ich.'
    note: Ein natürlicher, nachdenklicher Schlusssatz – Sie müssen ihn nur verstehen, nicht genau wiedergeben können.
