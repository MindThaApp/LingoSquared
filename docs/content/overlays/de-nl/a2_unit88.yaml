course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um über Fähigkeit und Möglichkeit zu sprechen.
  learning_goal: Sagen Sie, was Sie können oder nicht können und was passieren könnte – mit kunnen, Modalverbketten und misschien.
units:
  nl.a2.unit88.wat_kan_ik:
    title: Was kann ich?
    description: Sagen Sie, was Sie können und nicht können, kombinieren Sie Modalverben und sprechen Sie darüber, was passieren könnte.
lessons:
  nl.a2.unit88.lesson01.dit_kan_ik:
    title: Das kann ich
  nl.a2.unit88.lesson02.kun_je_dat:
    title: Kannst du das?
  nl.a2.unit88.lesson03.kunnen_willen_moeten:
    title: Können, wollen, müssen
  nl.a2.unit88.lesson04.twee_werkwoorden:
    title: Zwei Verben hintereinander
  nl.a2.unit88.lesson05.misschien_kan_het:
    title: Vielleicht ist es möglich
  nl.a2.unit88.lesson06.lotte_en_omar:
    title: Lotte und Omar machen einen Plan
teaching:
  nl.a2.unit88.lesson01.teach.vaardigheden:
    title: Fähigkeiten
    gloss: kochen / schwimmen / Rad fahren / zeichnen / singen / Gitarre spielen
    note: Diese Infinitive benennen Dinge, die man können kann. Jeder endet auf -en.
    example_gloss:
    - Omar kann gut kochen.
    - Lotte kann Rad fahren.
    - Noor kann singen.
  nl.a2.unit88.lesson01.teach.kleine_woorden:
    title: Kleine Wörter
    gloss: ich / du / du / er / sie / wir / ihr / auch / nicht / gut / sehr / ein bisschen
    note: Diese kleinen Wörter kommen in jeder Lektion vor. *Jij* und *je* bedeuten beide „du“; *je* ist die unbetonte Form.
    example_gloss:
    - Ich kann nicht singen.
    - Du kannst sehr gut Rad fahren.
    - Wir können auch kochen.
    - Er kann ein bisschen zeichnen.
  nl.a2.unit88.lesson01.teach.vrienden:
    title: Drei Freunde
    gloss: Lotte / Omar / Noor
    note: Die Freunde aus diesem Kurs tauchen in der ganzen Einheit auf.
    example_gloss:
    - Lotte, Omar und Noor sind Freunde.
  nl.a2.unit88.lesson01.teach.gn_kunnen:
    title: 'Kunnen: Präsens'
    gloss: ich kann, du kannst, er kann, sie kann, wir können, ihr könnt, sie können
    note: '*Kunnen* (können) ist unregelmäßig. Im Singular heißt es *ik kan*, *jij kunt*, *hij/zij kan*; im Plural immer *kunnen*. In der Alltagssprache ist auch *jij kan* üblich. In einer Frage mit Inversion fällt das -t weg: *kun je?*'
  nl.a2.unit88.lesson01.teach.gn_infinitief:
    title: Das zweite Verb steht als Infinitiv am Satzende
    gloss: Ich kann kochen. Ich kann gut kochen. Ich kann nicht schwimmen.
    note: Nach *kunnen* steht das zweite Verb im Infinitiv am Satzende. Wörter wie *goed* und *niet* stehen davor.
  nl.a2.unit88.lesson01.teach.zinnen:
    title: Drei Sätze
    gloss: Omar kann gut kochen. Ich kann ein bisschen Gitarre spielen. Wir können nicht singen.
  nl.a2.unit88.lesson02.teach.meer_vaardigheden:
    title: Sprachen und Technik
    gloss: Englisch sprechen / tippen / einen Computer reparieren
    note: Weitere Dinge, die man können oder nicht können kann. *Snel* bedeutet „schnell“.
    example_gloss:
    - Kannst du Englisch sprechen?
    - Kannst du schnell tippen?
    - Ich kann einen Computer reparieren.
  nl.a2.unit88.lesson02.teach.scheidbaar:
    title: Nützliche trennbare Verben
    gloss: abholen / zurückrufen / mitbringen
    note: Diese Verben haben eine trennbare Vorsilbe (*op-, terug-, mee-*). *Me* heißt „mich“, und *je* kann als Objekt auch „dich“ bedeuten.
    example_gloss:
    - Ich kann dich abholen.
    - Kannst du mich zurückrufen?
    - Lotte kann die Gitarre mitbringen.
  nl.a2.unit88.lesson02.teach.antwoorden:
    title: Kurze Antworten
    gloss: Ja, das geht. Nein, das kann ich nicht. Ja, das kann ich.
    note: '*Wel* betont, dass etwas möglich ist: *Dat kan ik wel.*'
  nl.a2.unit88.lesson02.teach.gn_vraag:
    title: Fragen mit kunnen
    gloss: Kannst du kochen? Kannst du kochen? Könnt ihr kochen?
    note: 'In einer Ja/Nein-Frage steht das Verb an erster Stelle. Bei *je/jij* lautet die Verbform *kun* (ohne -t): *Kun je koken?* In der Umgangssprache ist auch *Kan je koken?* üblich.'
  nl.a2.unit88.lesson02.teach.gn_scheidbaar:
    title: Modalverb plus trennbares Verb
    gloss: Ich kann dich abholen. Kannst du mich zurückrufen?
    note: 'Mit einem Modalverb wird das trennbare Verb nicht getrennt: Es bleibt ganz und steht als Infinitiv am Satzende. Ohne Modalverb wird die Vorsilbe abgetrennt (*Ik haal je op*); mit Modalverb bleibt das Verb ganz: *Ik kan je ophalen*.'
  nl.a2.unit88.lesson03.teach.beschikbaar:
    title: Verfügbarkeit
    gloss: Samstag / Sonntag / morgen / heute Abend / Zeit / kommen / arbeiten
    note: Mit diesen Wörtern sagen Sie, wann Sie frei oder beschäftigt sind. *Geen tijd* bedeutet „keine Zeit“.
    example_gloss:
    - Am Samstag habe ich keine Zeit.
    - Kannst du morgen kommen?
    - Ich muss heute Abend arbeiten.
  nl.a2.unit88.lesson03.teach.verbinders:
    title: Einen Grund nennen
    gloss: weil, denn / weil / also
    note: '*Want* und *omdat* nennen beide einen Grund; *dus* nennt die Folge. Nach *want* und *dus* gilt die normale Wortstellung (erst Subjekt, dann Verb); nach *omdat* rücken die Verben ans Ende des Nebensatzes.'
    example_gloss:
    - Ich kann nicht kommen, denn ich muss arbeiten.
    - Ich kann nicht kommen, denn ich muss arbeiten.
    - Ich habe keine Zeit, also kann ich nicht kommen.
  nl.a2.unit88.lesson03.teach.gn_drie_modalen:
    title: Drei Modalverben
    gloss: ich kann, ich will, ich muss; wir können, wir wollen, wir müssen
    note: '*Kunnen, willen* und *moeten* funktionieren gleich: ein konjugiertes Modalverb an zweiter Stelle und ein Infinitiv am Ende. Jedes verändert die Bedeutung: Fähigkeit oder Möglichkeit, Wunsch, Pflicht.'
  nl.a2.unit88.lesson03.teach.gn_zonder_infinitief:
    title: Kunnen ohne Infinitiv
    gloss: Am Samstag kann ich nicht. Kannst du am Sonntag? Ja, am Sonntag kann ich.
    note: 'Wenn aus dem Zusammenhang klar ist, welches Verb gemeint ist (hier *komen*), lässt man im Niederländischen den Infinitiv oft weg: *Ik kan zaterdag niet.* Das ist im Deutschen ganz ähnlich: „Am Samstag kann ich nicht.“'
  nl.a2.unit88.lesson03.teach.zin_contrast:
    title: Wollen und müssen
    gloss: Ich möchte kommen, aber ich muss arbeiten.
    note: '*Maar* bedeutet „aber“.'
  nl.a2.unit88.lesson04.teach.plannen:
    title: Besser werden
    gloss: lernen / üben / besser / mehr / nächste Woche / später / gern
    note: '*Graag* fügt zu *willen* „gern“ hinzu: *Ik wil graag ...* = Ich möchte gern ...'
    example_gloss:
    - Ich möchte gern mehr üben.
    - Nächste Woche kann ich kommen.
    - Später möchte ich besser kochen können.
  nl.a2.unit88.lesson04.teach.gn_wil_kunnen:
    title: Wil kunnen
    gloss: Ich möchte schwimmen können. Ich möchte besser kochen können.
    note: 'Man kann Modalverben aneinanderreihen. Nur das erste wird konjugiert und steht an zweiter Stelle (*wil*). Die anderen stehen als Infinitive am Ende, in dieser Reihenfolge: zuerst das zweite Modalverb, zuletzt das Hauptverb: *kunnen zwemmen*.'
  nl.a2.unit88.lesson04.teach.gn_zou_moeten:
    title: Zou moeten
    gloss: Du solltest mehr üben. Wir sollten mehr üben.
    note: '*Zou moeten* drückt einen Rat aus: „sollte“. *Zou* ist das konjugierte Verb (Singular *zou*, Plural *zouden*); *moeten* und das Hauptverb stehen am Ende.'
  nl.a2.unit88.lesson04.teach.gn_zal_kunnen:
    title: Zal kunnen
    gloss: Am Samstag werde ich kommen können. Ich werde dich abholen können. Nächste Woche werde ich arbeiten müssen.
    note: '*Ik/hij/zij zal*; *jij zult* (auch *jij zal*); *wij/jullie/zij zullen*. Dieses Verb verweist auf die Zukunft. Danach folgen am Ende zwei Infinitive. Ein trennbares Verb wie *ophalen* bleibt ungetrennt. *Jou* ist die betonte Form von *je*: *Ik zal jou kunnen ophalen.*'
  nl.a2.unit88.lesson04.teach.zin_terugbellen:
    title: Verbkette mit trennbarem Verb
    gloss: Ich werde dich morgen zurückrufen können.
  nl.a2.unit88.lesson05.teach.woorden:
    title: Wörter für Möglichkeit
    gloss: vielleicht / wissen / zusammen / wir / Stunde, Uhr / zwei / um
    note: '*We* ist die unbetonte Form von *wij*. *Om twee uur* bedeutet „um zwei Uhr“.'
    example_gloss:
    - Ich weiß es nicht.
    - Wir können zusammen kochen.
    - Kannst du um zwei Uhr kommen?
  nl.a2.unit88.lesson05.teach.gn_misschien:
    title: Misschien
    gloss: Vielleicht kann ich kommen. Ich kann vielleicht kommen.
    note: '*Misschien* sagt, dass etwas möglich, aber nicht sicher ist. Am Satzanfang löst es eine Inversion aus (Verb vor Subjekt), wie im Deutschen; steht es nach dem Verb, bleibt die Wortstellung normal.'
  nl.a2.unit88.lesson05.teach.gn_het_kan_zijn:
    title: Het kan zijn dat
    gloss: Es kann sein, dass ich arbeiten muss. Es kann morgen regnen.
    note: '*Het kan zijn dat ...* leitet eine Möglichkeit ein. Nach *dat* rückt die Verbgruppe ans Ende: *dat ik moet werken*; hier steht das finite *moet* vor dem Infinitiv *werken*. Auch *kunnen* allein kann eine Möglichkeit ausdrücken: *Het kan regenen.*'
  nl.a2.unit88.lesson05.teach.reading:
    title: Noor schreibt an Lotte
    gloss: Hallo Lotte, am Samstag kann ich vielleicht nicht kommen. Es kann sein, dass ich arbeiten muss. Am Sonntag weiß ich es. Vielleicht können wir am Sonntag zusammen Rad fahren. Um zwei Uhr kann ich. Liebe Grüße, Noor
    note: Beachten Sie, wie Noor Sicherheit (*ik kan om twee uur*) und Möglichkeit (*misschien*, *het kan zijn dat*) mischt.
    glosses:
      misschien: vielleicht
      weet: wissen
      samen: zusammen
      uur: Stunde, Uhr
  nl.a2.unit88.lesson06.teach.vraag:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, kannst du am Samstag kommen?'
  nl.a2.unit88.lesson06.teach.antw:
    title: Omar ist unsicher
    gloss: 'Omar: Ich weiß es noch nicht. Es kann sein, dass ich arbeiten muss.'
  nl.a2.unit88.lesson06.teach.terugbellen:
    title: Lotte bittet um einen Rückruf
    gloss: 'Lotte: Kannst du mich dann zurückrufen?'
  nl.a2.unit88.lesson06.teach.ja_dat_kan:
    title: Omar stimmt zu
    gloss: 'Omar: Ja, das geht. Ich kann dich morgen zurückrufen.'
  nl.a2.unit88.lesson06.teach.ophalen:
    title: Lotte fragt nach Sonntag
    gloss: 'Lotte: Prima! Und kannst du mich am Sonntag abholen?'
  nl.a2.unit88.lesson06.teach.zondag:
    title: Omar schlägt eine Uhrzeit vor
    gloss: 'Omar: Am Sonntag kann ich. Ich kann dich um zwei Uhr abholen.'
