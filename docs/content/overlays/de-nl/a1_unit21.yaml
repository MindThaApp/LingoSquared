teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: Froh, traurig und wütend
    gloss: froh, traurig, wütend
    note: Drei grundlegende, häufige Gefühlswörter, die mit zijn (sein) verwendet werden, um zu sagen, wie man sich fühlt.
    example_gloss:
    - Ich bin glücklich.
    - Ich bin traurig.
    - Ich bin wütend.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: Sagen, dass man froh ist
    gloss: Ich bin glücklich.
    note: '*Zijn* (sein) + Adjektiv für ein Gefühl ist das Grundmuster, genau wie im Deutschen: „Ich bin …“.'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: Gefühle gegenüberstellen
    gloss: Ich bin nicht wütend, ich bin traurig.
    note: '*Niet* verneint direkt *boos*; der zweite Satzteil nennt dann das tatsächliche Gefühl.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: Nach dem Grund fragen
    gloss: Warum sind Sie froh?
    note: '*Waarom* (warum) ist das übliche Fragewort für einen Grund.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: Einen Grund nennen
    gloss: Ich bin froh, weil ich eine neue Wohnung habe.
    note: '*Omdat* (weil) leitet den Begründungssatz ein; das Verb rückt ans Ende des Nebensatzes (*heb* steht nach *appartement*), wie im Deutschen.'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: Ein negativer Grund
    gloss: Ich bin traurig, weil es regnet.
    note: '*Regent* (es regnet) kommt aus der Wetter-Einheit und steht hier im Begründungssatz.'
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: Nervös
    gloss: nervös
    note: Das gebräuchliche Wort für Nervosität.
    example_gloss: Ich bin nervös wegen meiner ersten Schicht.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: Sagen, wovor man nervös ist
    gloss: Ich bin nervös wegen meiner ersten Schicht.
    note: '*Voor* (wörtlich „für“) nennt, worauf sich die Nervosität bezieht; im Deutschen sagt man dafür „wegen“ oder „vor“.'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: Jemanden beruhigen
    gloss: Mach dir keine Sorgen.
    note: '*Maak je geen zorgen* (wörtlich „mach dir keine Sorgen“) ist die feste, übliche Beruhigungsformel.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: Fragen, wie sich jemand fühlt
    gloss: Wie fühlt sich Omar?
    note: '*Voelen zich* (sich fühlen, reflexiv) ist die übliche Form, um nach einem Gefühlszustand zu fragen oder ihn zu beschreiben. Es unterscheidet sich vom körperlichen *voelen* aus den Gesundheitslektionen in Unit 16.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: Beschreiben, wie sich jemand fühlt
    gloss: Er ist nervös.
    note: '*Zich* (sich) ist das Reflexivpronomen der 3. Person und steht zusammen mit *voelt*.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: Fragen, warum sich jemand so fühlt
    gloss: Warum fühlt er sich nervös?
    note: Verbindet *waarom* mit dem Muster *voelt zich* aus *Hij voelt zich zenuwachtig*.
  nl.a1.unit21.lesson05.teach.bericht:
    title: Eine Nachricht über Gefühle lesen
    gloss: Hallo Lotte, ich bin ein bisschen nervös wegen meiner ersten Schicht allein. Aber ich freue mich auch, denn ich habe einen neuen Job und eine neue Wohnung. Ich denke, es wird gut gehen.
    note: Achten Sie darauf, wovor der Schreiber nervös ist, was ihn froh macht und wie er insgesamt die Lage sieht.
    glosses:
      beetje: ein bisschen
      zenuwachtig: nervös
      eerste: erste
      dienst: Schicht
      alleen: allein
      blij: glücklich
      want: denn, weil
      nieuwe: neu
      baan: Arbeit
      nieuw: neu
      appartement: Wohnung
      denk: denken, glauben
      komt: 'klappt (hier: wird gut gehen)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte fragt Omar, wie er sich fühlt
    gloss: 'Lotte: Hallo Omar, wie fühlst du dich vor deiner ersten Schicht?'
    note: '*Voor je eerste dienst* (wegen deiner ersten Schicht) greift das Muster *voor* + Nomen aus Lektion 3 wieder auf.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar gibt zu, dass er nervös ist
    gloss: 'Omar: Ich bin ehrlich gesagt ein bisschen nervös.'
    note: '*Eerlijk gezegd* (ehrlich gesagt) mildert das Eingeständnis ab.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte beruhigt ihn
    gloss: 'Lotte: Mach dir keine Sorgen, du schaffst das gut!'
    note: '*Je kunt het goed* (wörtlich „du kannst es gut“) ist eine ermutigende feste Wendung.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar bedankt sich
    gloss: 'Omar: Danke, das hilft wirklich.'
    note: '*Helpt* ist die Form der 3. Person Singular von *helpen* (helfen).'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte sagt den Ausgang voraus
    gloss: 'Lotte: Und danach bist du bestimmt sehr froh und stolz.'
    note: '*Vast* (bestimmt, sicher) drückt eine zuversichtliche Vorhersage aus; *trots* (stolz) ist ein neues, nützliches Adjektiv.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar stimmt zu
    gloss: 'Omar: Ja, das denke ich auch.'
    note: '*Dat denk ik ook* (wörtlich „das denke ich auch“) ist die natürliche Art, jemandes Meinung zuzustimmen.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: Zusammenfassen mit is, zijn und hem
    gloss: Omar ist nervös wegen seiner ersten Schicht. Lotte hilft ihm.
    note: '*Is* ist die Form der 3. Person von *zijn* (sein); *zijn* bedeutet hier „sein“ (Possessivum); *hem* bedeutet „ihn/ihm“ (Objektpronomen) – drei kleine, aber wichtige Wörter, um über eine andere Person zu sprechen.'
