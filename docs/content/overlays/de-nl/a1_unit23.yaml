teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: Nach dem Gesamtpreis fragen
    gloss: Wie viel kostet es insgesamt?
    note: '*In totaal* (insgesamt) verdeutlicht, dass Sie den gesamten Preis wissen wollen, nicht den eines einzelnen Artikels.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: Den Gesamtpreis nennen
    gloss: Es kostet insgesamt fünfundzwanzig Euro.
    note: '*Kost* ist die Form der 3. Person Singular von *kosten* (kosten).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: Mit Karte oder bar bezahlen
    gloss: mit Karte bezahlen, bar bezahlen
    note: '*Pinnen* ist ein typisch niederländisches Verb für das Zahlen mit Karte, abgeleitet vom PIN-Code; *contant betalen* (wörtlich „bar zahlen“) ist das Gegenstück für Barzahlung, wobei *contant* als Adverb vor *betalen* steht.'
    example_gloss:
    - Kann ich hier mit Karte zahlen?
    - Ich zahle bar.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: Fragen, ob Kartenzahlung möglich ist
    gloss: Kann ich hier mit Karte zahlen?
    note: '*Hier* (hier) bezieht die Frage auf den aktuellen Ort.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: Nach der Zahlungsart fragen
    gloss: Möchten Sie bar oder mit Karte zahlen?
    note: '*Wilt u* ...? ist die förmliche Version von *wil je* ...? und wird hier von einem fremden Kassierer benutzt.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: Die Rechnung
    gloss: die Rechnung
    note: 'Ein de-Wort: *de rekening*.'
    example_gloss: Teilen wir die Rechnung?
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: Vorschlagen, die Rechnung zu teilen
    gloss: Teilen wir die Rechnung?
    note: '*Zullen we* ...? greift das Muster für Vorschläge aus den Einheiten 11 und 19 wieder auf.'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: Bitten, getrennt zu zahlen
    gloss: Darf ich getrennt bezahlen?
    note: '*Apart* (getrennt) bezieht sich auf *afrekenen* (abrechnen), ein Beinahe-Synonym von *betalen*, das speziell für das Begleichen der Rechnung verwendet wird.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: Das Wechselgeld
    gloss: das Wechselgeld
    note: 'Ein het-Wort: *het wisselgeld*, zusammengesetzt aus *wisselen* (wechseln) und *geld* (Geld).'
    example_gloss: Hier ist Ihr Wechselgeld.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: Wechselgeld zurückgeben
    gloss: Hier ist Ihr Wechselgeld.
    note: '*Uw* ist das förmliche Possessivum „Ihr“, passend zum formellen Ton an der Kasse oder am Tresen.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: Wechselgeld ablehnen
    gloss: Ich brauche kein Wechselgeld.
    note: '*Nodig hebben* (brauchen) greift das Muster *rugzak nodig hebben* aus Einheit 14 wieder auf.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: Fünfunddreißig
    gloss: fünfunddreißig
    note: '*Vijfendertig* (wörtlich „fünfunddreißig“) folgt wie im Deutschen dem Muster Einer vor Zehner bei zusammengesetzten Zahlen.'
    example_gloss: Es kostet fünfunddreißig Euro.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: Eine Restaurantrechnung lesen
    gloss: 'Rechnung: zwei Hauptgerichte und zwei Kaffee. Gesamtbetrag: fünfunddreißig Euro. Mit Karte bezahlt.'
    note: Achten Sie darauf, was bestellt wurde, wie hoch der Gesamtbetrag ist und wie bezahlt wurde.
    glosses:
      Rekening: Rechnung
      twee: zwei
      hoofdgerechten: Hauptgerichte
      koffies: Kaffee
      Totaal: Gesamtbetrag
      vijfendertig: fünfunddreißig
      euro: Euro
      Betaald: bezahlt
      pin: Karte
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Lotte bittet um die Rechnung
    gloss: 'Lotte: Sollen wir die Rechnung verlangen?'
    note: '*Vragen* (verlangen, bitten um) hat *de rekening* als direktes Objekt.'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Omar fragt nach dem Gesamtpreis
    gloss: 'Omar: Ja, gute Idee. Was kostet es insgesamt?'
    note: Greift die Frage *hoeveel kost het in totaal?* aus Lektion 1 wieder auf.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Lotte nennt den Gesamtbetrag
    gloss: 'Lotte: Es sind fünfunddreißig Euro. Sollen wir teilen?'
    note: '*Delen* (teilen) bezieht sich hier aus dem Zusammenhang auf *de rekening*.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Omar besteht darauf zu zahlen
    gloss: 'Omar: Nein, lass mich heute bezahlen. Du hast mir so geholfen.'
    note: '*Laat mij* ... (lass mich ...) ist die übliche Art, anzubieten, etwas zu tun; *geholpen* ist das Partizip von *helpen* (helfen).'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Lotte ist gerührt
    gloss: 'Lotte: Das ist lieb von dir! Danke schön.'
    note: '*Lief van je* (lieb von dir) ist ein herzliches, häufiges Kompliment für eine großzügige Geste.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Omar fragt nach Kartenzahlung
    gloss: 'Omar: Kann ich hier mit Karte bezahlen?'
    note: Greift die Frage *kan ik hier pinnen?* aus Lektion 2 wieder auf, nun im echten Restaurant.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: die er/sie-Form'
    gloss: Omar bezahlt die Rechnung.
    note: '*Betaalt* ist die Form der 3. Person von *betalen* (bezahlen).'
