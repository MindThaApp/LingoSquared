teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: Stunde
    gloss: die Stunde; die Uhr (bei Uhrzeiten)
    note: '*Uur* steht nach der Zahl, wenn es um eine volle Stunde geht: *twee uur* ist zwei Uhr.'
    example_gloss: Es ist zwei Uhr.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: Zwei Uhr
    gloss: 2:00 – zwei Uhr
    note: Für eine volle Stunde sagt man die Zahl, gefolgt von *uur*.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: Drei Uhr
    gloss: 3:00 – drei Uhr
    note: '*Drie uur* ist genau 3:00 Uhr.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: Halbwegs auf drei zu
    gloss: 2:30 – halb drei
    note: 'Wichtiger Unterschied: Wie im Deutschen nennt auch das niederländische *half drie* die kommende Stunde. Es ist 2:30 Uhr, nicht 3:30 Uhr.'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: „Half“ verweist auf die nächste Stunde
    gloss: halb drei = halbwegs auf drei Uhr zu = 2:30
    note: Verstehen Sie *half* + Stunde als „halb auf diese Stunde zu“. Deshalb ist *half vier* 3:30 Uhr.
  nl.a1.unit04.lesson01.teach.half_four:
    title: Halbwegs auf vier zu
    gloss: 3:30 – halb vier
    note: '*Half vier* ist halb auf vier zu und bedeutet daher 3:30 Uhr.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: Eine halbe Stunde nennen
    gloss: Es ist halb drei.
    note: '*Het is ...* ist die normale Formel, um die aktuelle Uhrzeit zu nennen.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: Viertelstunde
    gloss: die Viertelstunde
    note: '*Kwart* steht in den festen Uhrzeitausdrücken *kwart over* und *kwart voor*.'
    example_gloss: Eine Viertelstunde sind fünfzehn Minuten.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: Viertel nach zwei
    gloss: 2:15 – Viertel nach zwei
    note: '*Kwart over twee* ist fünfzehn Minuten nach zwei.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over bedeutet „nach“
    gloss: nach = nach der vollen Stunde
    note: In Uhrzeitangaben zählt *over* von der gerade vergangenen Stunde aus vorwärts.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: Viertel vor drei
    gloss: 2:45 – Viertel vor drei
    note: '*Kwart voor drie* ist fünfzehn Minuten vor drei, also 2:45 Uhr.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor bedeutet „vor“
    gloss: vor = vor der nächsten vollen Stunde
    note: In Uhrzeitangaben weist *voor* auf die nächste volle Stunde hin.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: Viertel nach drei
    gloss: 3:15 – Viertel nach drei
    note: '*Over* behält die Stunde, die gerade vergangen ist: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: Viertel vor vier
    gloss: 3:45 – Viertel vor vier
    note: '*Voor* nennt die bevorstehende Stunde: *kwart voor vier* ist 3:45 Uhr.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: '*Hoe laat is het?* ist die übliche Alltagsfrage nach der aktuellen Uhrzeit.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: Die Uhrzeit sagen
    gloss: Es ist halb drei.
    note: 'Denken Sie daran: Das niederländische Stundenwort *drie* macht daraus 2:30 Uhr.'
  nl.a1.unit04.lesson03.teach.ask_start:
    title: Fragen, wann etwas beginnt
    gloss: Um wie viel Uhr beginnt das Sprachcafé?
    note: '*Hoe laat* leitet eine Frage nach der Uhrzeit ein.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: Um Viertel nach zwei
    gloss: Um Viertel nach zwei.
    note: Verwenden Sie *om* vor der Uhrzeit, wenn Sie sagen, wann etwas stattfindet.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: Om für den Zeitpunkt eines Ereignisses
    gloss: 'um + Uhrzeit: um zwei Uhr, um halb drei'
    note: Verwenden Sie *om* nicht, wenn Sie mit *Het is* nur die aktuelle Uhrzeit nennen.
  nl.a1.unit04.lesson03.teach.late:
    title: Fragen, ob man zu spät ist
    gloss: Bin ich zu spät?
    note: '*Laat* bedeutet hier „spät“; die Wendung passt natürlich in ein Gespräch über Zeiten.'
  nl.a1.unit04.lesson03.teach.on_time:
    title: Sagen, dass jemand pünktlich ist
    gloss: Nein, du bist pünktlich.
    note: '*Op tijd* bedeutet „pünktlich“. *Je* hält das Gespräch informell (Anrede mit „du“).'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: Vierzehn Uhr
    gloss: 14:00 – vierzehn Uhr
    note: Fahrpläne und Durchsagen verwenden häufig die 24-Stunden-Uhr. *Veertien uur* ist eine eindeutige gesprochene Form für 14:00 Uhr.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: Achtzehn Uhr
    gloss: 18:00 – achtzehn Uhr
    note: '*Achttien uur* ist die 24-Stunden-Form für 18 Uhr.'
  nl.a1.unit04.lesson04.teach.morning:
    title: Sieben Uhr morgens
    gloss: 7:00 – sieben Uhr morgens
    note: '*''s Ochtends* bedeutet „morgens“. Das *''s* am Anfang gehört fest zum Ausdruck.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: Zwei Uhr nachmittags
    gloss: 14:00 – zwei Uhr nachmittags
    note: '*''s Middags* umfasst den Nachmittag ab etwa Mittag; es unterscheidet 14:00 Uhr von 2:00 Uhr in der 12-Stunden-Sprechweise.'
  nl.a1.unit04.lesson04.teach.evening:
    title: Acht Uhr abends
    gloss: 20:00 – acht Uhr abends
    note: '*''s Avonds* steht für die Abendzeit, grob ab dem späten Nachmittag bis etwa Mitternacht.'
  nl.a1.unit04.lesson04.teach.night:
    title: Zwei Uhr nachts
    gloss: 2:00 – zwei Uhr nachts
    note: '*''s Nachts* steht für die Nachtstunden; 2:00 Uhr ist ganz natürlich *twee uur ''s nachts*.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: Tageszeiten
    gloss: der Morgen · der Nachmittag · der Abend · die Nacht
    note: 'Die Grenzen sind im Niederländischen ungefähr: *ochtend* reicht bis etwa Mittag, *middag* von Mittag durch den Nachmittag, *avond* durch den Abend, und *nacht* umfasst die Nachtstunden.'
    example_gloss:
    - Ich trinke morgens Kaffee.
    - Das Sprachcafé ist am Nachmittag.
    - Ich lese abends.
    - Ich schlafe nachts.
  nl.a1.unit04.lesson05.teach.schedule:
    title: Zeitplan
    gloss: der Zeitplan
    note: Ein *rooster* listet Aktivitäten und ihre Zeiten auf.
    example_gloss: Ich lese den Zeitplan.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: Öffnungszeiten des Sprachcafés
    gloss: 'Sprachcafé geöffnet: 14:00–16:00 Uhr'
    note: Niederländische Zeitpläne verwenden oft einen Punkt zwischen Stunden und Minuten; 14.00 ist dieselbe Zeit wie 14:00.
  nl.a1.unit04.lesson05.teach.welcome:
    title: Uhrzeit der Begrüßung
    gloss: 14:15 Begrüßung
    note: 14.15 kann man in der alltäglichen 12-Stunden-Sprechweise *kwart over twee* sagen.
  nl.a1.unit04.lesson05.teach.workshop:
    title: Uhrzeit des Workshops
    gloss: 14:45 Workshop
    note: '14.45 ist *kwart voor drie*: die Viertelstunde vor drei.'
  nl.a1.unit04.lesson05.teach.break:
    title: Uhrzeit der Pause
    gloss: 15:30 Pause
    note: 15.30 ist *half vier*, also halb auf vier zu, nicht halb nach vier.
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: Nach einer Uhrzeit im Zeitplan fragen
    gloss: Um wie viel Uhr beginnt der Workshop?
    note: '*Begint* fragt, wann die Aktivität anfängt.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: Die Uhrzeit des Workshops nennen
    gloss: Um Viertel vor drei.
    note: Die 14.45 im Zeitplan entspricht *kwart voor drie*.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: Die Uhrzeit des Sprachcafés bestätigen
    gloss: 'Lotte: Um wie viel Uhr beginnt das Sprachcafé am Freitag? Omar: Um Viertel nach zwei, also um 14:15 Uhr.'
    note: 'Omar nennt beide Formen ausdrücklich: *kwart over twee* und 14.15 meinen dieselbe Zeit, passend zur Willkommenszeit im Zeitplan der Lektion 5.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: Nach dem Workshop fragen
    gloss: 'Lotte: Und um wie viel Uhr beginnt der Workshop? Omar: Um Viertel vor drei.'
    note: '*Kwart voor drie* ist 14:45 Uhr, passend zum Zeitplan in Lektion 5.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: Eine Ankunftszeit nennen
    gloss: 'Lotte: Gut. Dann bin ich um zwei Uhr da.'
    note: Lotte plant, um 14:00 Uhr anzukommen, fünfzehn Minuten vor dem Beginn um 14:15 Uhr.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: Den Plan abschließen
    gloss: 'Omar: Prima, bis Freitagnachmittag!'
    note: '*Vrijdagmiddag* ist ein natürliches Kompositum und bedeutet „Freitagnachmittag“.'
