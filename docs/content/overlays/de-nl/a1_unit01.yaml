    title: Begrüßungen und erste Begegnungen
lessons:
  nl.a1.unit01.lesson01.jij_je_en_u:
    title: Informelles jij/je und formelles u
  nl.a1.unit01.lesson02.groeten_en_welzijn:
    title: Begrüßen und fragen, wie es jemandem geht
  nl.a1.unit01.lesson03.namen:
    title: Namen austauschen
  nl.a1.unit01.lesson04.herkomst_en_taal:
