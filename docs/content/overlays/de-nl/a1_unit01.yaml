teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: Hallo und Hi
    gloss: hallo / hi
    note: '*Hallo* ist neutral und passt sowohl in informellen als auch in formellen Situationen. *Hoi* ist verbreitet und informell.'
    example_gloss:
    - Hallo, bist du neu hier?
    - Hi, ich bin Noor.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: 'Du und Sie: informelle und formelle Formen'
    gloss: du (betont) / du (unbetont) / Sie (förmlich)
    note: '*Jij* ist die informelle Singularform und wird verwendet, wenn das Wort betont oder gegenübergestellt wird. *Je* ist die übliche unbetonte informelle Form im Alltag. *U* drückt respektvolle Distanz aus. In den Niederlanden passt es natürlich zu manchen älteren Fremden und in ausdrücklich formellen Beziehungen, aber jij/je ist unter Erwachsenen auch in vielen Geschäften und an vielen Arbeitsplätzen üblich.'
    example_gloss:
    - Bist du neu hier? (informell, betont)
    - Du bist neu hier. (informell, unbetont)
    - Sind Sie neu hier? (förmlich)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: Einen Gleichaltrigen fragen, ob er neu ist
    gloss: Bist du neu hier?
    note: 'In einer Frage wird aus *jij bent* die Form *ben jij*: Das -t entfällt, wenn *jij* hinter dem Verb steht.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: Förmlich fragen, ob jemand neu ist
    gloss: Bist du neu hier?
    note: Bei *u* heißt es *bent u*. Das -t bleibt.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: Die richtige Anredeform wählen
    gloss: 'jij/je: informell · u: förmlich oder höflich'
    note: Verwenden Sie *jij/je* bei Freunden, Gleichaltrigen, Kindern und in vielen lockeren, modernen Situationen. Verwenden Sie *u*, wenn die Beziehung Respekt oder Distanz verlangt; die Vorlieben sind unterschiedlich, richten Sie sich also nach Ihrem Gegenüber.
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: Begrüßungen am Morgen, Nachmittag und Abend
    gloss: guten Morgen / guten Tag (nachmittags) / guten Abend
    note: '*Goedemorgen* sagt man am Morgen, meist bis etwa zwölf Uhr mittags. *Goedemiddag* sagt man ab etwa zwölf Uhr den Nachmittag über. *Goedenavond* ist ein Gruß am Abend.'
    example_gloss:
    - Guten Morgen! Wie geht es dir?
    - Guten Tag, wie geht es Ihnen? (förmlich)
    - Guten Abend! Bist du neu hier?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: Wie geht's?
    gloss: Wie geht es Ihnen?
    note: '*Hoe gaat het?* ist eine gängige, neutrale Art zu fragen, wie es jemandem geht.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: Wie geht es dir? Informell
    gloss: Wie geht es Ihnen?
    note: '*Met je* macht deutlich, wer angesprochen wird, und ist informell.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: Wie geht es Ihnen? Förmlich
    gloss: Wie geht es Ihnen?
    note: Verwenden Sie *met u*, wenn die Situation die förmliche Anrede verlangt.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'Gut, danke: informell'
    gloss: Gut, danke.
    note: '*Dank je* passt zur informellen Anrede.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'Gut, danke: förmlich'
    gloss: Gut, danke.
    note: '*Dank u* passt zur formellen Anrede.'
  nl.a1.unit01.lesson02.teach.prima:
    title: Prima
    gloss: prima / gut
    note: '*Prima* ist eine kurze, positive Antwort.'
    example_gloss: Prima, danke.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: Nicht schlecht
    gloss: nicht schlecht
    note: '*Niet slecht* ist meist eine leicht positive Antwort.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: Und dir? Informell
    gloss: Und Sie?
    note: '*Jou* ist die betonte informelle Form nach *met*.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: Und Ihnen? Förmlich
    gloss: Und Sie?
    note: Mit *U* bleibt auch die Rückfrage formell.
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: Vertraut nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: '*Hoe heet je?* ist die normale informelle Frage nach dem Namen.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: Förmlich nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: '*Hoe heet u?* ist höflich; *Wat is uw naam?* ist eine weitere, eher amtlich klingende formelle Variante, die hier nicht geübt wird.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: Den eigenen Namen nennen
    gloss: Ich heiße Noor.
    note: '*Ik heet ...* ist eine direkte, gängige Art, seinen Namen zu nennen.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: Sich natürlich vorstellen
    gloss: Ich bin Noor.
    note: '*Ik ben ...* ist besonders in gesprochenen Vorstellungen üblich.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: Mein Name ist
    gloss: Ich heiße Noor.
    note: '*Mijn naam is ...* ist korrekt, aber etwas ausdrücklicher als *Ik ben ...* oder *Ik heet ...*.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: Schön, dich kennenzulernen
    gloss: Freut mich, Sie kennenzulernen.
    note: Das ist freundlich und bei einem ersten Treffen ganz natürlich.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: Angenehm
    gloss: angenehm
    note: '*Aangenaam* ist konventionell und förmlicher als *Leuk je te ontmoeten*.'
    example_gloss: Angenehm! Ich bin Noor.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: Fragen, woher jemand kommt
    gloss: Woher kommen Sie?
    note: '*Kom je* ist die informelle Frageform.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: Förmlich fragen, woher jemand kommt
    gloss: Woher kommen Sie?
    note: 'Mit *u* lautet das Verb *komt*: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: Aus den Niederlanden
    gloss: Ich komme aus den Niederlanden.
    note: Vor dem Herkunftsland steht *uit*.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: Aus Belgien
    gloss: Ich komme aus Belgien.
    note: '*België* hat ein Trema über dem zweiten e.'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: Aus Deutschland
    gloss: Ich komme aus Deutschland.
    note: '*Duitsland* ist das Land; *Duits* ist die Sprache.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: Niederländische Staatsangehörigkeit
    gloss: Ich bin Niederländer(in).
    note: '*Nederlands* kann sowohl die Staatsangehörigkeit als auch die niederländische Sprache bezeichnen.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: Belgische Staatsangehörigkeit
    gloss: Ich bin Belgier(in).
    note: '*Belgisch* bezeichnet hier die belgische Staatsangehörigkeit.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: Niederländisch sprechen
    gloss: Ich spreche Niederländisch.
    note: Sprachnamen werden im Niederländischen großgeschrieben.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: Englisch sprechen
    gloss: Ich spreche Englisch.
    note: '*Engels* ist das niederländische Wort für Englisch.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: Deutsch sprechen
    gloss: Ich spreche Deutsch.
    note: '*Duits* ist das niederländische Wort für Deutsch.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: Sprachcafé und Bibliothek
    gloss: das Sprachcafé / die Bibliothek
    note: Ein *taalcafé* ist ein ungezwungenes Treffen, bei dem man Niederländisch mit anderen übt. Niederländische öffentliche Bibliotheken bieten oft Veranstaltungen vor Ort an, darunter Sprachcafés.
    example_gloss:
    - Ich bin wegen des Sprachcafés hier.
    - Ich lerne Niederländisch in der Bibliothek.
  nl.a1.unit01.lesson05.teach.location:
    title: Der Treffpunkt
    gloss: Das Sprachcafé ist in der Bibliothek.
    note: Damit wird der Schauplatz der Szene festgelegt.
  nl.a1.unit01.lesson05.teach.here_for:
    title: Die gemeinsame Aktivität ansprechen
    gloss: Bist du wegen des Sprachcafés hier?
    note: Das ist ein natürlicher, informeller Einstieg, wenn zwei Personen für dieselbe Aktivität kommen.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: Die Aktivität bestätigen
    gloss: Ja, ich bin wegen des Sprachcafés hier.
    note: Die Antwort wiederholt die Aktivität deutlich.
  nl.a1.unit01.lesson05.teach.learning:
    title: Sagen, was man lernt
    gloss: Ich lerne Niederländisch.
    note: '*Leer* ist die Form der ersten Person Singular von *leren*, „lernen“.'
  nl.a1.unit01.lesson05.teach.me_too:
    title: Ich auch
    gloss: Ich auch.
    note: '*Ik ook* ist eine kurze, natürliche Art, eine Gemeinsamkeit auszudrücken.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: Fragen, ob jemand zum ersten Mal da ist
    gloss: Bist du zum ersten Mal hier?
    note: Das ist freundlicher Smalltalk bei einer Aktivität, die regelmäßig stattfindet.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: Sagen, dass man zum ersten Mal da ist
    gloss: Ja, ich bin zum ersten Mal hier.
    note: '*Mijn* bedeutet „mein“.'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Lotte beginnt das Gespräch
    gloss: 'Lotte: Hallo, ich bin Lotte. Wie heißt du?'
    note: Lotte verwendet in dieser lockeren Gruppe das informelle *je*.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Omar nennt seinen Namen
    gloss: 'Omar: Ich heiße Omar. Freut mich, dich kennenzulernen.'
    note: Er beantwortet die Frage nach dem Namen und geht auf die Begegnung ein.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Lotte fragt nach der Herkunft
    gloss: 'Lotte: Mich auch! Woher kommst du?'
    note: '*Jou ook!* ist eine natürliche kurze Antwort auf *Leuk je te ontmoeten*.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Omar nennt seine Herkunft
    gloss: 'Omar: Ich komme aus Ägypten. Und du?'
    note: '*En jij?* gibt dieselbe Frage informell zurück.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Lotte setzt den Smalltalk fort
    gloss: 'Lotte: Ich komme aus den Niederlanden. Bist du zum ersten Mal im Sprachcafé?'
    note: '*Bij het taalcafé* bedeutet „im Sprachcafé“ im Sinne der Veranstaltung.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Omar antwortet und sagt, was er lernt
    gloss: 'Omar: Ja, das ist mein erstes Mal. Ich lerne Niederländisch.'
    note: Er beantwortet zuerst Lottes Frage und fügt dann eine einfache Angabe zu sich selbst hinzu.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: Verabschiedung
    gloss: Auf Wiedersehen!
    note: '*Tot ziens* ist ein neutraler Abschiedsgruß.'
  nl.a1.unit01.lesson06.teach.closing:
    title: Ein natürlicher Abschluss
    gloss: 'Lotte: Schön! Bis nächste Woche. Omar: Bis nächste Woche!'
    note: Dass beide *Tot volgende week* sagen, ist natürlich, wenn beide damit rechnen, wiederzukommen.
