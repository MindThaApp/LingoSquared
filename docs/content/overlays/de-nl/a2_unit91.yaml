course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch auf A2-Niveau, um über das Anfangen, Aufhören und Ausprobieren von Gewohnheiten zu sprechen.
  learning_goal: Sie sagen, was Sie angefangen, aufgehört, versucht oder vergessen haben – mit te + Infinitiv, stoppen met und staan/zitten/liggen te.
units:
  nl.a2.unit91.beginnen_stoppen_proberen:
    title: Anfangen, aufhören, versuchen
    description: Sagen Sie, was Sie angefangen, aufgehört, versucht oder vergessen haben und was jemand gerade tut.
lessons:
  nl.a2.unit91.lesson01.ik_begin_te_sporten:
    title: Ich fange an, Sport zu treiben
  nl.a2.unit91.lesson02.stoppen_met:
    title: Aufhören
  nl.a2.unit91.lesson03.proberen_en_vergeten:
    title: Versuchen und vergessen
  nl.a2.unit91.lesson04.hij_zit_te_lezen:
    title: Er sitzt und liest
  nl.a2.unit91.lesson05.noors_plan:
    title: Noors Plan
  nl.a2.unit91.lesson06.lotte_en_omar_sporten:
    title: Lotte und Omar treiben Sport
teaching:
  nl.a2.unit91.lesson01.teach.gewoontes:
    title: Gewohnheiten
    gloss: Sport treiben / schlafen / essen / gesund / früher
    note: Diese Wörter benennen die Gewohnheiten, über die Sie in dieser Lektion sprechen werden.
    example_gloss:
    - Ich möchte Sport treiben.
    - Ich möchte mich gesund ernähren.
    - Ich möchte früher schlafen.
  nl.a2.unit91.lesson01.teach.sportschool:
    title: Im Fitnessstudio
    gloss: das Fitnessstudio / jeden Tag / oft
    note: '*Vaak* bedeutet „oft“; *elke dag* bedeutet „jeden Tag“.'
    example_gloss:
    - Ich gehe jeden Tag ins Fitnessstudio.
    - Noor geht oft ins Fitnessstudio.
    - Ich treibe oft Sport.
  nl.a2.unit91.lesson01.teach.gn_beginnen_te:
    title: Beginnen + te + Infinitiv
    gloss: Ich fange an, Sport zu treiben. Ich fange an, mich gesund zu ernähren. Noor fängt an, früher zu schlafen.
    note: Nach *beginnen* steht *te* direkt vor dem Infinitiv, ähnlich wie „zu“ im Deutschen. Der Infinitiv (*sporten, eten, slapen*) steht ganz am Ende. Es heißt *ik begin*, aber *Noor begint*.
  nl.a2.unit91.lesson01.teach.gn_te_achteraan:
    title: Andere Wörter stehen vor te
    gloss: Ich fange an, jeden Tag ins Fitnessstudio zu gehen. Sie fängt oft an, Sport zu treiben.
    note: Andere Wörter (*elke dag, naar de sportschool, vaak*) stehen zwischen *beginnen* und *te*. Das Paar *te* + Infinitiv bleibt am Satzende zusammen.
  nl.a2.unit91.lesson01.teach.zin:
    title: Zwei Handlungen
    gloss: Ich fange an, Sport zu treiben und mich gesund zu ernähren.
    note: Bei zwei Handlungen wiederholt man im Niederländischen meist *te* vor jedem Infinitiv.
  nl.a2.unit91.lesson02.teach.schermtijd:
    title: Gewohnheiten, die man aufgibt
    gloss: rauchen / naschen / zocken / das Handy / die Bildschirmzeit
    note: '*Snoepen* bedeutet, Süßigkeiten oder Snacks zu essen.'
    example_gloss:
    - Rauchen ist nicht gesund.
    - Ich esse jeden Tag Süßigkeiten.
    - Ich zocke oft auf dem Handy.
    - Meine Bildschirmzeit ist hoch.
  nl.a2.unit91.lesson02.teach.minder:
    title: Nicht mehr, weniger
    gloss: aufhören / anfangen / nicht mehr / weniger
    note: '*Niet meer* bedeutet „nicht mehr“.'
    example_gloss:
    - Ich rauche nicht mehr.
    - Ich zocke weniger.
    - Ich esse weniger Süßigkeiten.
  nl.a2.unit91.lesson02.teach.gn_stoppen_met:
    title: Stoppen met
    gloss: Ich höre auf zu rauchen. Noor hört auf zu zocken. Sie hört auf zu naschen.
    note: 'Nach *stoppen* steht *met* plus Nomen oder Infinitiv. Hier steht kein *te*: nicht *stoppen te roken*. Es heißt *ik stop*, aber *Noor stopt*.'
  nl.a2.unit91.lesson02.teach.gn_beginnen_met:
    title: Beginnen met
    gloss: Ich fange mit dem Sport an. Noor fängt an, sich gesund zu ernähren.
    note: '*Beginnen* kann auch mit *met* + Infinitiv oder Nomen verwendet werden, ohne *te*. *Ik begin te sporten* und *Ik begin met sporten* bedeuten dasselbe.'
  nl.a2.unit91.lesson02.teach.zin:
    title: Weniger und nicht mehr
    gloss: Ich esse weniger Süßigkeiten und zocke nicht mehr.
    note: '*Minder* und *niet meer* zeigen, wie weit Sie eine Gewohnheit verändert haben.'
  nl.a2.unit91.lesson03.teach.proberen:
    title: Versuchen und vergessen
    gloss: versuchen / vergessen / anrufen / lesen
    note: '*Bellen* bedeutet, jemanden anzurufen.'
    example_gloss:
    - Ich probiere es.
    - Ich vergesse es oft.
    - Ich rufe Lotte an.
    - Noor liest jeden Tag.
  nl.a2.unit91.lesson03.teach.gn_proberen_te:
    title: Proberen + te
    gloss: Ich versuche, früher zu schlafen. Ich versuche, weniger zu zocken. Noor versucht, Sport zu treiben.
    note: Nach *proberen* steht *te* + Infinitiv, und der Infinitiv steht am Ende. Es heißt *ik probeer*, aber *Noor probeert*.
  nl.a2.unit91.lesson03.teach.gn_vergeten_te:
    title: Vergeten + te
    gloss: Ich vergesse oft anzurufen. Ich habe vergessen anzurufen. Ich habe vergessen, Lotte anzurufen.
    note: 'Auch *vergeten* steht mit *te* + Infinitiv. Ein kurzes Objekt (*Lotte*) steht vor *te*: *Lotte te bellen*.'
  nl.a2.unit91.lesson03.teach.gn_om_te:
    title: 'Optional: om ... te'
    gloss: Ich versuche, früher zu schlafen. Ich habe vergessen anzurufen.
    note: 'Nach *proberen* und *vergeten* können Sie *om* ergänzen: *om ... te*. Die Bedeutung bleibt gleich. In dieser Lektion wird meist die kürzere Form ohne *om* verwendet.'
  nl.a2.unit91.lesson03.teach.gn_perfectum:
    title: Perfekt
    gloss: Ich habe angefangen, Sport zu treiben. Ich habe aufgehört zu rauchen. Ich habe versucht, früher zu schlafen. Ich habe vergessen anzurufen.
    note: Im Perfekt stehen *beginnen, stoppen* und *vergeten* mit *zijn*, *proberen* dagegen mit *hebben*. Mit *ik* heißt es *ben* und *heb*. *Te* + Infinitiv (oder *met* + Tätigkeit) bleibt am Ende.
  nl.a2.unit91.lesson03.teach.gn_modaal:
    title: Te oder kein te
    gloss: Ich will Sport treiben. Ich versuche, Sport zu treiben. Ich muss schlafen. Ich versuche zu schlafen.
    note: Nach *willen* und *moeten* steht der Infinitiv allein, ohne *te*. Nach *beginnen, proberen* und *vergeten* brauchen Sie *te*.
  nl.a2.unit91.lesson04.teach.posities:
    title: Stehen, sitzen, liegen
    gloss: stehen / sitzen / liegen / das Sofa / das Bett / die Tür
    note: Im Niederländischen sagt man oft, ob jemand steht, sitzt oder liegt.
    example_gloss:
    - Er sitzt auf dem Sofa.
    - Sie liegt im Bett.
    - Er steht an der Tür.
  nl.a2.unit91.lesson04.teach.tv:
    title: Bildschirme und Bücher
    gloss: schauen / der Fernseher / das Buch
    note: '*Kijken naar* bedeutet ansehen oder anschauen.'
    example_gloss:
    - Er sieht fern.
    - Sie liest ein Buch.
  nl.a2.unit91.lesson04.teach.uren:
    title: Schon seit Stunden
    gloss: schon / Stunden
    note: '*Al uren* bedeutet schon seit Stunden.'
    example_gloss:
    - Er sitzt schon seit Stunden auf dem Sofa.
    - Ich zocke schon seit Stunden.
  nl.a2.unit91.lesson04.teach.gn_staan_te:
    title: Staan, zitten, liggen + te
    gloss: Er liest (im Sitzen). Sie schläft (im Liegen). Er telefoniert (im Stehen). Sie zockt (im Sitzen).
    note: '*Staan, zitten* oder *liggen* + *te* + Infinitiv drückt aus, was jemand gerade tut. Das erste Verb zeigt die Körperhaltung: *zit, ligt, staat*.'
  nl.a2.unit91.lesson04.teach.gn_plaats:
    title: Ort vor te
    gloss: Er liest auf dem Sofa. Sie schläft im Bett. Er telefoniert an der Tür.
    note: 'Eine Ortsangabe steht meist vor *te* + Infinitiv. In der gesprochenen Sprache hört man sie auch danach: *Hij zit te lezen op de bank*.'
  nl.a2.unit91.lesson04.teach.zin:
    title: Was macht er?
    gloss: Was macht er? Er sitzt schon seit Stunden da und zockt.
    note: '*Al uren* steht vor *te gamen* und zeigt, wie lange es schon andauert.'
  nl.a2.unit91.lesson05.teach.reading:
    title: Noors Plan
    gloss: Hallo Lotte, ich habe einen Plan. Jeden Abend sitze ich stundenlang da und zocke, und das ist nicht gesund. Jetzt höre ich mit dem Zocken auf. Ich versuche, früher zu schlafen. Am Montag fange ich an, Sport zu treiben. Gestern habe ich vergessen, dich anzurufen, tut mir leid! Morgen rufe ich dich an.
    note: Finden Sie heraus, womit Noor aufhört, was sie versucht, womit sie anfängt und was sie vergisst.
    glosses:
      plan: Plan
      avond: Abend
      uren: Öffnungszeiten
      dat: dass
      Nu: jetzt
      Maandag: Montag
      Gisteren: gestern
      je: dich
      sorry: Entschuldigung
      Morgen: morgen
      heb: habe
  nl.a2.unit91.lesson06.teach.lotte_vraag:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, hast du schon angefangen, Sport zu treiben?'
  nl.a2.unit91.lesson06.teach.omar_gym:
    title: Omar antwortet
    gloss: 'Omar: Ja, ich habe angefangen! Ich versuche, dreimal pro Woche ins Fitnessstudio zu gehen.'
  nl.a2.unit91.lesson06.teach.lotte_snoepen:
    title: Lotte fragt nach dem Naschen
    gloss: 'Lotte: Super! Und hast du aufgehört zu naschen?'
  nl.a2.unit91.lesson06.teach.omar_nee:
    title: Omar gibt es zu
    gloss: 'Omar: Nein, das klappt noch nicht. Ich sitze jeden Abend auf dem Sofa und nasche.'
  nl.a2.unit91.lesson06.teach.lotte_vergeten:
    title: Lotte erzählt
    gloss: 'Lotte: Schade! Ich habe heute auch vergessen, Sport zu treiben.'
  nl.a2.unit91.lesson06.teach.omar_samen:
    title: Omar schlägt vor
    gloss: 'Omar: Dann versuchen wir es morgen zusammen!'
