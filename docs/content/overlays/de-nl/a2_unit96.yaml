course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um höflich nach Informationen zu fragen.
  learning_goal: Stellen Sie höfliche indirekte Fragen mit waar, wanneer, hoe laat, wie, wat und of, wobei das Verb am Ende des eingebetteten Nebensatzes steht.
units:
  nl.a2.unit96.weet_u_waar:
    title: Wissen Sie, wo ...?
    description: Fragen Sie an Bahnhöfen, in Büros und Museen mit eingebetteten Fragen höflich nach Informationen.
lessons:
  nl.a2.unit96.lesson01.weet_u_waar:
    title: Wissen Sie, wo der Bahnhof ist?
  nl.a2.unit96.lesson02.wanneer_en_hoe_laat:
    title: Wann und um wie viel Uhr
  nl.a2.unit96.lesson03.weet_u_of:
    title: Wissen Sie, ob geöffnet ist?
  nl.a2.unit96.lesson04.kunt_u_mij_zeggen:
    title: Könnten Sie mir sagen ...?
  nl.a2.unit96.lesson05.omars_bericht:
    title: Omars Nachricht
  nl.a2.unit96.lesson06.lotte_en_omar:
    title: Lotte und Omar im Museum
teaching:
  nl.a2.unit96.lesson01.teach.plaatsen:
    title: Orte
    gloss: der Bahnhof / das Büro / das Museum / die Bibliothek / der Schalter / der Ausgang
    note: Nach diesen Orten fragt man oft.
    example_gloss:
    - Wo ist der Bahnhof?
    - Wo ist der Ausgang?
  nl.a2.unit96.lesson01.teach.weten:
    title: Wissen und wo
    gloss: wissen / wo / Sie / du / du (betont)
    note: '*Weet* ist die Form nach u, je und jij.'
    example_gloss:
    - Wissen Sie?
    - Weißt du?
    - Weißt du?
  nl.a2.unit96.lesson01.teach.open:
    title: Geöffnet und geschlossen
    gloss: geöffnet / geschlossen
    example_gloss:
    - Das Museum ist geöffnet.
    - Das Büro ist geschlossen.
  nl.a2.unit96.lesson01.teach.gn_indirect:
    title: Von der direkten zur indirekten Frage
    gloss: Eine direkte Frage und dieselbe Frage indirekt gestellt.
    note: 'In der direkten Frage steht das Verb an zweiter Stelle: *Waar IS het station?* Nach *Weet u ...* wird die Frage zum Nebensatz, und das Verb rückt ans Ende dieses Satzes: *Weet u waar het station IS?* Das kennen Sie auch aus dem Deutschen: „Wo ist der Bahnhof?“ – „Wissen Sie, wo der Bahnhof ist?“'
  nl.a2.unit96.lesson01.teach.gn_u_je:
    title: U oder je
    gloss: Förmliche und informelle Art, dasselbe zu fragen.
    note: Verwenden Sie *u* bei Fremden und in Büros, *je* oder *jij* bei Freunden. Die Verbform *weet* bleibt gleich. Lotte und Omar benutzen *je*.
  nl.a2.unit96.lesson01.teach.zinnen:
    title: Zwei Fragen
    gloss: Wissen Sie, wo das Museum ist? Weißt du, wo die Bibliothek ist?
  nl.a2.unit96.lesson02.teach.vraagwoorden:
    title: Fragewörter
    gloss: wann / um wie viel Uhr / wer / was
    note: Diese Fragewörter funktionieren in der eingebetteten Frage wie *waar*.
    example_gloss:
    - Wann ist das Museum geöffnet?
    - Wie spät ist es?
    - Wer ist das? Das ist Lotte.
    - Was ist das? Das ist ein Museum.
  nl.a2.unit96.lesson02.teach.werkwoorden:
    title: Nützliche Verben
    gloss: öffnen / schließen / abfahren / kosten
    example_gloss:
    - Das Museum öffnet um zehn Uhr.
    - Das Büro schließt um fünf Uhr.
    - Der Zug fährt um neun Uhr ab.
    - Die Fahrkarte kostet zehn Euro.
  nl.a2.unit96.lesson02.teach.tijd:
    title: Zug und Uhrzeit
    gloss: der Zug / die Fahrkarte / die Stunde / morgen / heute / zehn / fünf / neun
    example_gloss:
    - Was kostet die Fahrkarte? Sie kostet zehn Euro.
    - Wann fährt der Zug ab? Morgen.
    - Das ist Noor.
    - Das Büro ist in der Nähe des Bahnhofs.
  nl.a2.unit96.lesson02.teach.gn_wanneer:
    title: Wanneer und hoe laat
    gloss: Eingebettete Fragen mit wanneer und hoe laat.
    note: 'Das Fragewort bleibt vorn, das Verb steht am Ende: *wanneer het museum opent*, *hoe laat de trein vertrekt*. Verwenden Sie *wanneer* für einen Tag oder Zeitpunkt, *hoe laat* für die Uhrzeit.'
  nl.a2.unit96.lesson02.teach.gn_wie_wat:
    title: Wie und wat
    gloss: Eingebettete Fragen mit wie und wat.
    note: '*Wie* und *wat* folgen demselben Muster. Das Verb steht am Ende: *wie dat is*, *wat het kaartje kost*.'
  nl.a2.unit96.lesson02.teach.zinnen:
    title: Zwei Fragen
    gloss: Weißt du, um wie viel Uhr das Büro schließt? Wissen Sie, wann das Museum öffnet?
  nl.a2.unit96.lesson03.teach.of:
    title: Of, ja, nee
    gloss: ob / ja / nein / nicht
    example_gloss:
    - Ist das Museum geöffnet? Ja.
    - Ist das Büro geöffnet? Nein.
  nl.a2.unit96.lesson03.teach.gn_of:
    title: 'Ja-/Nein-Fragen: of'
    gloss: Eine Ja-/Nein-Frage indirekt mit of gestellt.
    note: 'Eine Ja-/Nein-Frage hat kein Fragewort, deshalb beginnt die eingebettete Frage mit *of* („ob“). Das Verb rückt ans Ende: *of de bibliotheek open IS*. Das ist wie im Deutschen.'
  nl.a2.unit96.lesson03.teach.gn_contrast:
    title: Waar oder of?
    gloss: Vergleichen Sie eine W-Frage und eine Ja-/Nein-Frage.
    note: Behalten Sie das Fragewort (*waar, wanneer, hoe laat, wie, wat*), wenn es eines gibt. Lässt sich die Frage mit *ja* oder *nee* beantworten, verwenden Sie *of*. Nie beides zusammen.
  nl.a2.unit96.lesson03.teach.gn_weet_niet:
    title: Ik weet niet ...
    gloss: Sagen, dass man etwas nicht weiß.
    note: Nach *Ik weet niet* folgt derselbe eingebettete Satz mit dem Verb am Ende. Als kurze Antwort sagen Sie *Ik weet het niet.*
  nl.a2.unit96.lesson03.teach.zinnen:
    title: Zwei Antworten
    gloss: Ich weiß es nicht. Ich weiß nicht, ob das Büro geöffnet ist.
  nl.a2.unit96.lesson04.teach.richting:
    title: Wegbeschreibungen
    gloss: geradeaus / links / rechts / wie / komme / bei, zu
    note: '*Hoe kom ik bij ...?* fragt nach dem Weg.'
    example_gloss:
    - Der Bahnhof ist geradeaus.
    - Der Ausgang ist links.
    - Das Büro ist rechts.
    - Wie komme ich zum Bahnhof?
  nl.a2.unit96.lesson04.teach.beleefd:
    title: Höfliche Wörter
    gloss: Entschuldigung / können Sie / kannst du / mir / mir (unbetont) / sagen / will, möchte / gern / wissen
    note: '*Mij* und *me* bedeuten beide „mir“. *Kunt u* gehört zu u, *kun je* gehört zu je.'
    example_gloss:
    - Entschuldigung, wo ist der Schalter?
    - Ich möchte gern wissen, wo der Schalter ist.
  nl.a2.unit96.lesson04.teach.uitje:
    title: Ein Ausflug
    gloss: wir / gehen / nach, zu
    example_gloss:
    - Morgen gehen wir ins Museum.
    - Weißt du, wann wir ins Museum gehen?
  nl.a2.unit96.lesson04.teach.gn_kunt_u:
    title: Kunt u mij zeggen ...?
    gloss: Eine höfliche Art, um Auskunft zu bitten.
    note: 'In dieser Frage steht das Verb an erster Stelle: *Kunt u* / *Kun je*. Dann folgen *mij zeggen* und die eingebettete Frage mit dem Verb am Ende. Bei je lautet die übliche Form *kun je*.'
  nl.a2.unit96.lesson04.teach.gn_wil_weten:
    title: Ik wil graag weten ...
    gloss: Eine höfliche Aussage statt einer Frage.
    note: '*Ik wil graag weten* ist eine höfliche Aussage, mit der man um Auskunft bittet. Danach folgt die eingebettete Frage mit dem Verb am Ende.'
  nl.a2.unit96.lesson04.teach.gn_hoe_kom:
    title: Hoe ik ... kom
    gloss: Indirekt nach dem Weg fragen.
    note: 'Aus *Hoe kom ik bij het station?* wird *hoe ik bij het station kom*: Das Verb *kom* rückt hinter *bij het station* ans Ende.'
  nl.a2.unit96.lesson04.teach.zinnen:
    title: Am Bahnhof
    gloss: Entschuldigung, könnten Sie mir sagen, wo der Schalter ist? Ich möchte gern wissen, um wie viel Uhr der Zug abfährt.
  nl.a2.unit96.lesson05.teach.reading:
    title: Omars Nachricht an Lotte
    gloss: Hallo Lotte, morgen gehen wir ins Museum. Ich weiß nicht, wo das Museum ist. Weißt du, wie ich zum Bahnhof komme? Ich möchte gern wissen, um wie viel Uhr der Zug abfährt. Weißt du auch, ob das Museum geöffnet ist? Viele Grüße, Omar
    note: Beachten Sie, wie Omar seine Fragen mit drei verschiedenen Einleitungen beginnt.
    glosses:
      Hoi: hallo
      Groeten: Grüße
      ook: auch
  nl.a2.unit96.lesson06.teach.omar_vraagt_waar:
    title: Omar spricht
    gloss: Hallo Lotte, weißt du, wo das Museum ist?
  nl.a2.unit96.lesson06.teach.lotte_wijst:
    title: Lotte spricht
    gloss: Ja, geh geradeaus und dann links.
  nl.a2.unit96.lesson06.teach.omar_vraagt_tijd:
    title: Omar spricht
    gloss: Weißt du auch, um wie viel Uhr es öffnet?
  nl.a2.unit96.lesson06.teach.lotte_tijd:
    title: Lotte spricht
    gloss: Es öffnet um zehn Uhr.
  nl.a2.unit96.lesson06.teach.omar_vraagt_open:
    title: Omar spricht
    gloss: Weißt du auch, ob das Museum heute geöffnet ist?
  nl.a2.unit96.lesson06.teach.lotte_weet_niet:
    title: Lotte spricht
    gloss: Ich weiß nicht, ob es heute geöffnet ist.
