course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um Gründe und Folgen zu nennen.
  learning_goal: Nennen Sie in einer Nachricht einen Grund und eine Folge mit omdat, want und dus.
units:
  nl.a2.unit92.omdat_want_dus:
    title: Weil, denn, also
    description: Erklären Sie eine Ausrede oder eine Planänderung, indem Sie einen Grund und eine Folge nennen.
lessons:
  nl.a2.unit92.lesson01.reden_en_gevolg:
    title: Grund und Folge
  nl.a2.unit92.lesson02.omdat_werkwoord_achteraan:
    title: 'Omdat: das Verb am Ende'
  nl.a2.unit92.lesson03.omdat_want_of_dus:
    title: Omdat, want oder dus?
  nl.a2.unit92.lesson04.afspraak_verzetten:
    title: Den Termin verschieben
  nl.a2.unit92.lesson05.noors_bericht:
    title: Noors Nachricht
  nl.a2.unit92.lesson06.lotte_en_omar:
    title: Lotte und Omar
teaching:
  nl.a2.unit92.lesson01.teach.klachten:
    title: Gründe fürs Wegbleiben
    gloss: krank / müde / beschäftigt / Kopfschmerzen
    note: Diese Wörter nennen oft einen Grund.
    example_gloss:
    - Ich bin krank.
    - Omar ist müde.
    - Lotte ist beschäftigt.
    - Ich habe Kopfschmerzen.
  nl.a2.unit92.lesson01.teach.plannen:
    title: Termine, Arbeit und Wetter
    gloss: der Termin / die Arbeit / das Wetter / der Zug
    note: Termine, Arbeit und Wetter sind häufige Gründe, einen Plan zu ändern.
    example_gloss:
    - Ich habe einen Termin mit Noor.
    - Ich habe viel Arbeit.
    - Das Wetter ist schlecht.
    - Es regnet.
    - Der Zug hat Verspätung.
  nl.a2.unit92.lesson01.teach.gevolgen:
    title: Was daraus folgt
    gloss: bleiben / kommen / zu Hause / später / nicht
    note: Diese Wörter beschreiben, was Sie aufgrund eines Grundes tun.
    example_gloss:
    - Ich bleibe zu Hause.
    - Omar bleibt zu Hause.
    - Ich komme später.
    - Ich komme nicht.
  nl.a2.unit92.lesson01.teach.gn_reden_gevolg:
    title: Grund und Folge
    gloss: 'Die Folge: Ich bleibe zu Hause. Der Grund: Es regnet. Eine Nachricht nennt den Grund und die Folge.'
    note: Der Grund sagt, warum. Die Folge sagt, was deshalb geschieht. In dieser Lektion setzen Sie beides in eine Nachricht.
  nl.a2.unit92.lesson01.teach.gn_want:
    title: Want nennt einen Grund
    gloss: 'Mit want nennen Sie den Grund. Die Wortstellung ändert sich nicht: Ich bleibe zu Hause, denn es regnet.'
    note: '*Want* verbindet zwei normale Hauptsätze. Jeder Satz behält seine übliche Stellung: In *het regent* steht das Verb an zweiter Stelle.'
  nl.a2.unit92.lesson01.teach.gn_dus:
    title: Dus nennt die Folge
    gloss: 'Mit dus nennen Sie die Folge: Es regnet, also bleibe ich zu Hause.'
    note: '*Dus* verbindet zwei Hauptsätze: *het regent, dus ik blijf thuis*. In dieser Lektion üben Sie das Muster *dus ik ...*.'
  nl.a2.unit92.lesson01.teach.zinnen:
    title: Zwei vollständige Nachrichten
    gloss: Ich bin müde, also bleibe ich zu Hause. Ich komme nicht, denn ich habe Kopfschmerzen.
  nl.a2.unit92.lesson02.teach.waarom:
    title: Warum und weil
    gloss: warum / weil
    note: '*Waarom* fragt nach einem Grund; *omdat* leitet die Antwort ein.'
    example_gloss:
    - Warum kommst du nicht?
    - Weil ich krank bin.
    - Warum bleibst du zu Hause?
    - Weil es regnet.
  nl.a2.unit92.lesson02.teach.modaal:
    title: Müssen, können und heute Abend
    gloss: müssen / können / arbeiten / heute Abend
    note: Diese Verben kommen häufig in Ausreden vor.
    example_gloss:
    - Ich muss arbeiten.
    - Ich kann heute Abend nicht kommen.
    - Omar muss arbeiten.
  nl.a2.unit92.lesson02.teach.gn_omdat:
    title: Omdat schickt das Verb ans Ende
    gloss: 'Nach omdat steht das konjugierte Verb am Ende: weil es regnet; weil ich krank bin; weil ich einen Termin habe.'
    note: '*Omdat* leitet einen Nebensatz ein. Das konjugierte (finite) Verb steht am Ende des Satzes: *omdat ik ziek ben*, nicht *omdat ik ben ziek*.'
  nl.a2.unit92.lesson02.teach.gn_omdat_modaal:
    title: Zwei Verben am Ende
    gloss: 'Mit moeten oder kunnen stehen zwei Verben am Ende: weil ich arbeiten muss; weil ich nicht kommen kann.'
    note: 'Im Nebensatz stehen beide Verben am Ende, zuerst das Modalverb: *moet werken*, *kan komen*.'
  nl.a2.unit92.lesson02.teach.zinnen:
    title: Zwei Sätze mit omdat
    gloss: Ich bleibe zu Hause, weil ich krank bin. Ich komme nicht, weil ich arbeiten muss.
  nl.a2.unit92.lesson03.teach.woorden:
    title: Zeit und Bedauern
    gloss: heute / morgen / leider / schade
    note: '*Helaas* und *jammer* leiten oft eine Ausrede ein.'
    example_gloss:
    - Heute bleibe ich zu Hause.
    - Morgen komme ich später.
    - Leider habe ich Kopfschmerzen.
    - Schade, ich kann nicht kommen.
  nl.a2.unit92.lesson03.teach.gn_contrast:
    title: Omdat im Vergleich zu want und dus
    gloss: 'Omdat: Das Verb steht am Ende. Want: Die Wortstellung ändert sich nicht. Dus: nennt die Folge.'
    note: '*Omdat* und *want* haben dieselbe Bedeutung, aber eine andere Wortstellung: *omdat ik ziek ben*, aber *want ik ben ziek*. Auch im Deutschen unterscheiden sich weil-Sätze (Verb am Ende) und denn-Sätze (normale Wortstellung).'
  nl.a2.unit92.lesson03.teach.gn_voorop:
    title: Ein vorangestellter omdat-Satz
    gloss: 'Steht der omdat-Satz am Anfang, beginnt der Hauptsatz mit dem Verb und dann folgt das Subjekt: Weil es regnet, bleibe ich zu Hause.'
    note: 'Nach einem vorangestellten *omdat*-Satz steht im Hauptsatz das Verb vor dem Subjekt (Inversion): *blijf ik thuis*. *Want* tut das nicht: *want ik blijf thuis*, nicht *want blijf ik thuis*.'
  nl.a2.unit92.lesson03.teach.zinnen:
    title: Omdat-Satz zuerst
    gloss: Weil es regnet, bleibe ich zu Hause. Weil der Zug Verspätung hat, komme ich später.
  nl.a2.unit92.lesson04.teach.verzetten:
    title: Einen Plan ändern
    gloss: Entschuldigung / der Kollege / verschieben / die Zeit
    note: Mit diesen Wörtern sagen Sie höflich ab und schlagen einen neuen Termin vor.
    example_gloss:
    - Entschuldigung, ich kann nicht kommen.
    - Mein Kollege ist krank.
    - Können wir den Termin verschieben?
    - Hast du morgen Zeit?
  nl.a2.unit92.lesson04.teach.gn_bericht:
    title: Eine Nachricht mit Grund und Folge
    gloss: 'Eine gute Nachricht enthält eine Entschuldigung, eine Folge, einen Grund und eine Frage: Entschuldigung, ich kann nicht kommen, weil ich arbeiten muss. Können wir den Termin verschieben?'
    note: Nennen Sie zuerst die Folge (*ik kan niet komen*), fügen Sie den Grund mit *omdat* oder *want* an und stellen Sie dann eine Frage.
  nl.a2.unit92.lesson04.teach.collega:
    title: Erst der Grund, dann die Folge
    gloss: Mein Kollege ist krank, deshalb muss ich arbeiten.
  nl.a2.unit92.lesson05.teach.woorden:
    title: Wörter für die Nachricht
    gloss: auch / stark, heftig / übermorgen / liebe Grüße (informeller Gruß am Ende)
    note: Diese Wörter kommen in Noors Nachricht vor.
    example_gloss:
    - Es regnet auch.
    - Es regnet stark.
    - Hast du übermorgen Zeit?
    - Liebe Grüße, Omar.
  nl.a2.unit92.lesson05.teach.reading:
    title: Noor ändert den Plan
    gloss: Hallo Lotte, tut mir leid, ich kann heute Abend nicht kommen, weil ich Kopfschmerzen habe. Es regnet auch stark, deshalb bleibe ich zu Hause. Morgen kann ich nicht, weil ich arbeiten muss. Hast du übermorgen Zeit? Können wir den Termin verschieben? Liebe Grüße, Noor
    note: Finden Sie in jedem Satz den Grund und die Folge.
    glosses:
      Hoi: hallo
      vanavond: heute Abend
      hoofdpijn: Kopfschmerzen
      ook: auch
      hard: stark, heftig
      overmorgen: übermorgen
      groetjes: liebe Grüße
      verzetten: verschieben
  nl.a2.unit92.lesson06.teach.lotte_vraagt:
    title: Lotte fragt
    gloss: Hallo Omar, kommst du heute Abend?
  nl.a2.unit92.lesson06.teach.omar_nee:
    title: Omar sagt ab
    gloss: Nein, tut mir leid, ich kann nicht kommen.
  nl.a2.unit92.lesson06.teach.lotte_waarom:
    title: Lotte fragt nach dem Grund
    gloss: Warum kommst du nicht?
  nl.a2.unit92.lesson06.teach.omar_reden:
    title: Omar nennt Grund und Folge
    gloss: Weil mein Kollege krank ist. Er kann nicht arbeiten, also arbeite ich heute Abend.
  nl.a2.unit92.lesson06.teach.lotte_verzetten:
    title: Lotte schlägt eine Änderung vor
    gloss: Schade! Können wir den Termin verschieben?
  nl.a2.unit92.lesson06.teach.omar_graag:
    title: Omar stimmt zu und fragt nach
    gloss: Ja, gern. Hast du morgen Zeit?
  nl.a2.unit92.lesson06.teach.lotte_morgen:
    title: Lotte sagt für einen Tag zu
    gloss: Ja, morgen habe ich Zeit.
