course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch auf Niveau A2 zum Weitergeben von Nachrichten.
  learning_goal: Wiedergeben, was jemand gesagt oder gefragt hat, mit zegt dat, vraagt of und laat weten.
units:
  nl.a2.unit97.doorgeven_wat_iemand_zegt:
    title: Wiedergeben, was jemand sagt
    description: Eine Nachricht mit zegt dat, vraagt of und laat weten im Präsens weitergeben.
lessons:
  nl.a2.unit97.lesson01.wat_zegt_hij:
    title: Was sagt er?
  nl.a2.unit97.lesson02.ze_vraagt_of:
    title: Sie fragt, ob ...
  nl.a2.unit97.lesson03.van_ik_naar_hij:
    title: Von „ich“ zu „er“
  nl.a2.unit97.lesson04.een_bericht_doorgeven:
    title: Eine Nachricht weitergeben
  nl.a2.unit97.lesson05.een_briefje_lezen:
    title: Einen Zettel lesen
  nl.a2.unit97.lesson06.de_collega_belt:
    title: Der Kollege ruft an
teaching:
  nl.a2.unit97.lesson01.teach.berichten:
    title: Nachrichten und Zettel
    gloss: die Nachricht / der Zettel / das Telefon / anrufen
    note: Het bericht ist das allgemeine Wort für eine Nachricht; het briefje ist ein kurzer schriftlicher Zettel.
    example_gloss:
    - Noor ruft Omar an.
    - Ich habe eine Nachricht.
    - Der Zettel ist zu Hause.
  nl.a2.unit97.lesson01.teach.tijd:
    title: Wann und wo
    gloss: später / heute / morgen / heute Abend / zu Hause
    note: Diese kleinen Wörter kommen in fast jeder Nachricht vor.
    example_gloss:
    - Ich komme später.
    - Lotte arbeitet heute.
    - Morgen bin ich zu Hause.
    - Heute Abend habe ich Zeit.
  nl.a2.unit97.lesson01.teach.voornaamwoorden:
    title: Wer spricht?
    gloss: er / sie / sie / ich / du / du
    note: Ze und zij bedeuten hier beide „sie“. Je und jij bedeuten unter Freunden beide „du“; jij ist die betonte Form, je die alltägliche.
    example_gloss:
    - Er arbeitet heute.
    - Sie kommt später.
    - Ich bin zu Hause.
  nl.a2.unit97.lesson01.teach.werkwoorden:
    title: Verben für Nachrichten
    gloss: kommen / arbeiten / sagen / fragen / auch / nicht
    note: Zeggen und vragen sind die beiden wichtigsten Verben, um eine Nachricht weiterzugeben.
    example_gloss:
    - Ich arbeite nicht.
    - Er kommt auch.
  nl.a2.unit97.lesson01.teach.gn_dat:
    title: Zeggen mit dat
    gloss: 'Omar sagt: „Ich komme später.“ Omar sagt, dass er später kommt.'
    note: Um eine Aussage weiterzugeben, verwenden Sie zegt dat. Die Worte des Sprechers werden zu einem Nebensatz nach dat, und das Verb (das, das zum Subjekt passt) rückt ans Ende dieses Nebensatzes. Das ik des Sprechers wird zu hij oder ze.
  nl.a2.unit97.lesson01.teach.zinnen:
    title: Zwei wiedergegebene Aussagen
    gloss: Omar sagt, dass er später kommt. Noor sagt, dass sie heute arbeitet.
  nl.a2.unit97.lesson02.teach.werk:
    title: Wörter rund um die Arbeit
    gloss: der Termin / die Besprechung / der Kollege / die Arbeit / Zeit
    note: 'Tijd ohne Artikel bedeutet allgemein „Zeit“: Ik heb tijd.'
    example_gloss:
    - Die Besprechung ist heute.
    - Mein Kollege arbeitet morgen.
    - Ich habe Zeit.
  nl.a2.unit97.lesson02.teach.vraagwoorden:
    title: Fragewörter
    gloss: wo / wann / wer / ob / ist / hat / wartet
    note: Of wird bei der wiedergegebenen Ja/Nein-Frage verwendet.
    example_gloss:
    - Wer ist der Kollege?
    - Wo ist Omar?
    - Wann kommt Lotte?
    - Hat Noor Zeit?
    - Arbeitet Omar morgen?
    - Wo wartet Noor?
  nl.a2.unit97.lesson02.teach.gn_of:
    title: Vragen mit of
    gloss: 'Er fragt: „Hat Noor Zeit?“ Er fragt, ob Noor Zeit hat.'
    note: Eine Ja/Nein-Frage wird zu of plus Nebensatz, in dem das Verb am Ende steht. Die Fragewortstellung (Verb an erster Stelle) entfällt.
  nl.a2.unit97.lesson02.teach.gn_vraagwoord:
    title: Vragen mit waar und wanneer
    gloss: 'Sie fragt: „Wo ist die Besprechung?“ Sie fragt, wo die Besprechung ist.'
    note: Eine Frage mit Fragewort behält dieses Wort (waar, wanneer), und das Verb rückt ans Ende. Ein zusätzliches Wort wie dat oder of kommt nicht dazu.
  nl.a2.unit97.lesson02.teach.zinnen:
    title: Zwei wiedergegebene Fragen
    gloss: Sie fragt, ob Omar Zeit hat. Er fragt, wo die Besprechung ist.
  nl.a2.unit97.lesson03.teach.modaal:
    title: Kleine Wörter, die sich ändern
    gloss: kann / will / muss / mein / sein / ihr
    note: Zijn kann auch das Verb „sein“ bedeuten; vor einem Nomen wie in zijn telefoon bedeutet es aber „sein/seine“.
    example_gloss:
    - Ich kann kommen.
    - Ich will arbeiten.
    - Ich muss arbeiten.
    - Ihr Handy ist zu Hause.
    - Mein Termin ist heute.
  nl.a2.unit97.lesson03.teach.gn_voornaamwoord:
    title: Die Pronomen ändern
    gloss: 'Omar sagt: „Ich habe mein Handy.“ Omar sagt, dass er sein Handy hat.'
    note: 'Wenn Sie eine Nachricht weitergeben, wird ik zu hij oder ze, und mijn wird zu zijn (bei einem Mann) oder haar (bei einer Frau). Auch das Verb ändert sich: ik heb wird zu hij heeft.'
  nl.a2.unit97.lesson03.teach.gn_contrast:
    title: Direkte Rede und Weitergabe
    gloss: 'Omar sagt: „Ich komme später.“ Omar sagt, dass er später kommt.'
    note: 'Direkte Rede: ein Doppelpunkt, die eigenen Worte des Sprechers, das Verb an zweiter Stelle (ik kom). Weitergabe: dat, hij statt ik, und das Verb am Ende (hij later komt).'
  nl.a2.unit97.lesson03.teach.gn_modaal:
    title: Zwei Verben am Ende
    gloss: 'Omar sagt: „Ich kann nicht kommen.“ Omar sagt, dass er nicht kommen kann.'
    note: 'Bei kan, wil oder moet gibt es zwei Verben. Im dat-Satz stehen beide am Ende, wobei das Modalverb (das finite) vor dem Infinitiv steht: dat hij niet kan komen.'
  nl.a2.unit97.lesson03.teach.zinnen:
    title: Zwei weitere wiedergegebene Aussagen
    gloss: Noor sagt, dass ihr Handy zu Hause ist. Omar sagt, dass er nicht kommen kann.
  nl.a2.unit97.lesson04.teach.doorgeven:
    title: Weitergeben
    gloss: weitergeben / Bescheid geben / von / da
    note: 'Laten weten bedeutet „Bescheid geben“. Im Satz: Lotte laat weten dat ...'
    example_gloss:
    - Ich möchte die Nachricht weitergeben.
    - Es gibt eine Nachricht von Noor.
    - Lotte gibt uns Bescheid, dass sie kommt.
  nl.a2.unit97.lesson04.teach.gn_opening:
    title: So fangen Sie an
    gloss: Es gibt eine Nachricht von Noor. Sie sagt, dass sie heute Abend zu Hause ist.
    note: Beginnen Sie mit Er is een bericht van ... und geben Sie den Inhalt dann mit zegt dat oder vraagt of weiter. Nach dem ersten Satz können Sie hij oder ze verwenden.
  nl.a2.unit97.lesson04.teach.gn_laat_weten:
    title: Laten weten
    gloss: Noor gibt uns Bescheid, dass sie morgen kommt. Omar gibt uns Bescheid, ob er Zeit hat.
    note: 'Laat weten dat ist eine gute Möglichkeit, in einer Nachricht Neuigkeiten weiterzugeben. Es funktioniert wie zegt dat: Das Verb rückt ans Ende. Laat weten of gibt weiter, ob etwas der Fall ist, wie in Omar laat weten of hij tijd heeft.'
  nl.a2.unit97.lesson04.teach.zinnen:
    title: Eine kurze Weitergabe
    gloss: Es gibt eine Nachricht von Omar. Er gibt Bescheid, dass er morgen arbeitet.
  nl.a2.unit97.lesson05.teach.reading:
    title: Eine Notiz von Omar
    gloss: Hallo Lotte, es gibt eine Nachricht von Noor. Sie sagt, dass sie heute Abend nicht kommen kann, weil sie arbeiten muss. Sie fragt, ob du morgen Zeit hast. Ein Kollege gibt Bescheid, dass die Besprechung um neun Uhr ist.
    note: 'Omar gibt in dieser Notiz zwei Nachrichten weiter: die von Noor und die eines Kollegen.'
  nl.a2.unit97.lesson06.teach.d01:
    title: Omar erzählt Lotte vom Anruf
    gloss: 'Omar: Hallo Lotte, der Kollege ruft an.'
  nl.a2.unit97.lesson06.teach.d02:
    title: Lotte fragt, was er sagt
    gloss: 'Lotte: Ach ja? Was sagt er?'
  nl.a2.unit97.lesson06.teach.d03:
    title: Omar gibt die Nachricht weiter
    gloss: 'Omar: Er sagt, dass die Besprechung morgen um neun Uhr ist.'
  nl.a2.unit97.lesson06.teach.d04:
    title: Lotte fragt nach einer Frage
    gloss: 'Lotte: Fragt er auch, ob ich Zeit habe?'
  nl.a2.unit97.lesson06.teach.d05:
    title: Omar bestätigt
    gloss: 'Omar: Ja, er fragt, ob du morgen Zeit hast.'
  nl.a2.unit97.lesson06.teach.d06:
    title: Lotte antwortet
    gloss: 'Lotte: Gut, ich habe Zeit. Ich gebe dem Kollegen Bescheid, dass ich komme.'
