teaching:
  nl.a2.unit79.lesson01.teach.vakantie:
    title: Urlaub
    gloss: der Urlaub / der Sommerurlaub
    note: Beide Wörter sind de-Wörter. *Vakantie* ist das allgemeine Wort; *de zomervakantie* sind die langen Sommerferien.
    example_gloss:
    - Im August habe ich Urlaub.
    - Der Sommerurlaub beginnt im Juli.
  nl.a2.unit79.lesson01.teach.volgende_week:
    title: Wann etwas passiert
    gloss: nächste Woche / nächstes Jahr / bald
    note: '*Week* ist ein de-Wort, daher heißt es *volgende week*. *Jaar* ist ein het-Wort, daher heißt es *volgend jaar* (ohne -e am Ende).'
    example_gloss:
    - Nächste Woche habe ich einen Termin.
    - Nächstes Jahr möchte ich nach Belgien fahren.
    - Bald habe ich Urlaub.
  nl.a2.unit79.lesson01.teach.reizen_boeken:
    title: Drei Reiseverben
    gloss: reisen / buchen / bleiben
    note: Das sind die Infinitive. *Boeken* bedeutet als Nomen auch „Bücher“, hier ist aber das Verb „buchen“ gemeint.
    example_gloss:
    - Ich reise gern mit dem Zug.
    - Ich möchte ein Zimmer buchen.
    - Ich bleibe eine Woche.
  nl.a2.unit79.lesson01.teach.hotel_camping:
    title: Wo man übernachtet
    gloss: das Hotel / der Campingplatz
    note: '*Het hotel* ist ein het-Wort; *de camping* ist ein de-Wort. Man übernachtet *op de camping*, aber *in een hotel*.'
    example_gloss:
    - Das Hotel ist nah am Strand.
    - Wir schlafen auf dem Campingplatz.
  nl.a2.unit79.lesson01.teach.vraag:
    title: Nach den Urlaubsplänen fragen
    gloss: Was machst du im Sommerurlaub?
    note: 'Hier ist *gaan* ein Hilfsverb: *ga* steht an zweiter Stelle und der Infinitiv *doen* ganz am Ende.'
  nl.a2.unit79.lesson01.teach.gn_gaan:
    title: 'Nahe Pläne: gaan + Infinitiv'
    gloss: Im August reise ich nach Deutschland. Ich buche ein Hotel.
    note: 'Um zu sagen, was Sie vorhaben, verwenden Sie eine Form von *gaan* an zweiter Stelle und setzen den Infinitiv ganz ans Satzende: *Ik ga een hotel boeken*. Alles andere (Zeit, Ort, Objekt) steht dazwischen. Steht eine Zeitangabe am Anfang, bleibt *ga* trotzdem an zweiter Stelle: *Volgende week ga ik een hotel boeken*.'
  nl.a2.unit79.lesson01.teach.hotel_boeken:
    title: Ein Hotel buchen
    gloss: Ich werde ein Hotel buchen.
  nl.a2.unit79.lesson02.teach.cursus_verhuizen:
    title: Drei Pläne für später
    gloss: einen Kurs machen / umziehen / Geld sparen
    note: '*Een cursus volgen* ist die feste Wendung für „einen Kurs besuchen“. *Verhuizen* bedeutet „in eine neue Wohnung umziehen“.'
    example_gloss:
    - Ich möchte einen Kurs machen.
    - Mein Onkel möchte umziehen.
    - Ich möchte auf ein neues Fahrrad sparen.
  nl.a2.unit79.lesson02.teach.later_over:
    title: Weiter in der Zukunft
    gloss: später / in einem Monat
    note: '*Over een maand* bedeutet „in einem Monat“. Das funktioniert auch mit anderen Zeiträumen: *over een week*.'
    example_gloss:
    - Später möchte ich ein Haus kaufen.
    - In einem Monat beginnt mein Kurs.
  nl.a2.unit79.lesson02.teach.cursus_begint:
    title: Ein Kurs, der beginnt
    gloss: In einem Monat beginnt mein Kurs.
  nl.a2.unit79.lesson02.teach.gn_van_plan:
    title: 'Absichten: van plan zijn om ... te'
    gloss: Ich plane, einen Kurs zu machen.
    note: 'Um zu sagen, was Sie vorhaben, verwenden Sie *ik ben van plan om* und danach den Rest des Satzes. Der Infinitiv steht am Ende, mit *te* direkt davor: *een cursus te volgen*. Das gilt für Dinge, die Sie gern tun möchten, nicht für feste Verabredungen.'
  nl.a2.unit79.lesson02.teach.verhuizen:
    title: Einen Umzug planen
    gloss: Ich plane umzuziehen.
  nl.a2.unit79.lesson02.teach.sparen:
    title: Sparen planen
    gloss: Ich plane, Geld zu sparen.
  nl.a2.unit79.lesson02.teach.gn_contrast:
    title: Gaan oder van plan zijn?
    gloss: Morgen gehe ich auf den Markt. Später plane ich umzuziehen.
    note: 'Verwenden Sie *gaan* für die nahe, feststehende Zukunft: *Morgen ga ik naar de markt*. Verwenden Sie *van plan zijn* für eine Absicht, die weiter entfernt oder unsicherer ist: *Later ben ik van plan om te verhuizen*.'
  nl.a2.unit79.lesson03.teach.misschien:
    title: Vielleicht und sicher
    gloss: vielleicht / sicher
    note: '*Misschien* drückt Zweifel aus. *Zeker* bedeutet „sicher“ oder „bestimmt“.'
    example_gloss:
    - Vielleicht regnet es morgen.
    - Das macht sicher Spaß.
  nl.a2.unit79.lesson03.teach.dit_jaar:
    title: Dieses Jahr, diesen Sommer
    gloss: dieses Jahr / diesen Sommer
    note: '*Jaar* ist ein het-Wort, daher *dit jaar*. *Zomer* ist ein de-Wort, daher *deze zomer*.'
    example_gloss:
    - Dieses Jahr mache ich keinen Urlaub.
    - Diesen Sommer bleibe ich zu Hause.
  nl.a2.unit79.lesson03.teach.blijf_thuis:
    title: Zu Hause bleiben
    gloss: Diesen Sommer bleibe ich zu Hause.
  nl.a2.unit79.lesson03.teach.gn_misschien:
    title: Misschien und die Wortstellung
    gloss: Morgen arbeite ich. Vielleicht gehe ich später ins Kino.
    note: '*Misschien* am Satzanfang zählt als erstes Satzglied, deshalb folgt das Verb direkt danach: *Misschien ga ik later naar de bioscoop*, nicht *Misschien ik ga*. Das ist wie im Deutschen auch nach jeder Zeitangabe so: *Morgen ga ik werken*.'
  nl.a2.unit79.lesson03.teach.gn_niet:
    title: Sagen, dass man etwas nicht vorhat
    gloss: Ich fahre nicht in den Urlaub. Ich plane nicht umzuziehen.
    note: 'Setzen Sie *niet* hinter *ga* oder *ben*, vor den Rest des Plans: *Ik ga niet op vakantie*. Bei *van plan zijn* steht *niet* vor *van plan*: *Ik ben niet van plan om te verhuizen*.'
  nl.a2.unit79.lesson04.teach.met_wie:
    title: Zwei Fragewendungen
    gloss: mit wem / wie lange
    note: '*Met wie* fragt nach einer Person, mit der man etwas tut. *Hoe lang* fragt nach einem Zeitraum.'
    example_gloss:
    - Mit wem gehst du an den Strand?
    - Wie lange bleibst du?
  nl.a2.unit79.lesson04.teach.waar_naartoe:
    title: Wohin fährst du?
    gloss: Wohin fährst du?
    note: '*Naartoe* steht am Ende der Frage und zeigt eine Richtung an.'
  nl.a2.unit79.lesson04.teach.met_wie_vakantie:
    title: Mit wem?
    gloss: Mit wem fährst du in den Urlaub?
  nl.a2.unit79.lesson04.teach.hoe_lang_daar:
    title: Wie lange?
    gloss: Wie lange bleibst du dort?
  nl.a2.unit79.lesson04.teach.met_mijn_zus:
    title: Antworten
    gloss: Ich fahre mit meiner Schwester.
  nl.a2.unit79.lesson04.teach.wij_blijven:
    title: Wir
    gloss: Wir bleiben zwei Wochen dort.
  nl.a2.unit79.lesson04.teach.weken:
    title: Wochen
    gloss: eine Woche / zwei Wochen
    note: Der Plural von *week* ist *weken*.
    example_gloss:
    - Ich bleibe eine Woche.
    - Wir bleiben zwei Wochen dort.
  nl.a2.unit79.lesson04.teach.gn_vragen:
    title: Fragen mit gaan
    gloss: Wohin fährst du? Mit wem fährst du? Wie lange bleibst du dort?
    note: 'Setzen Sie zuerst das Fragewort, dann *ga* an zweiter Stelle, dann *je*. Der Infinitiv, falls es einen gibt, steht am Ende: *Hoe lang ga je blijven?*'
  nl.a2.unit79.lesson05.teach.noor_bericht:
    title: Eine Nachricht von Noor
    gloss: Hallo Lotte! Bald habe ich Urlaub. Im August fahre ich mit meiner Schwester nach Belgien. Wir bleiben eine Woche in einem Hotel. Danach fahre ich für zwei Tage zu meinen Eltern. Nächstes Jahr habe ich vor, einen Kurs zu belegen. Vielleicht ziehe ich dann auch um. Was hast du vor?
    note: 'Noor beschreibt nahe Pläne mit *gaan* und eine längerfristige Absicht mit *van plan zijn*. Beachten Sie, dass jeder Infinitiv am Ende seines Satzes steht: *blijven*, *te volgen*, *verhuizen*.'
    glosses:
      binnenkort: bald
      vakantie: Urlaub
      augustus: August
      zus: Schwester
      naar: zu
      belgië: Belgien
      hotel: Hotel
      blijven: bleiben
      daarna: danach
      ouders: Eltern
      dagen: Tage
      volgend: nächste
      jaar: Jahr
      plan: Plan (van plan zijn = vorhaben)
      cursus: Kurs
      volgen: folgen
      misschien: vielleicht
      verhuizen: umziehen
      dan: dann
      ook: auch
  nl.a2.unit79.lesson06.teach.lotte_vraag:
    title: Lotte fragt Omar nach seinen Plänen
    gloss: 'Lotte: Hallo Omar! Hast du schon Pläne für die Sommerferien?'
  nl.a2.unit79.lesson06.teach.omar_duitsland:
