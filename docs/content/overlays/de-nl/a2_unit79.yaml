    gloss: 'Omar: Ja! Im August fahre ich nach Deutschland. Ich werde ein Hotel buchen.'
  nl.a2.unit79.lesson06.teach.lotte_met_wie:
    title: Lotte fragt, mit wem er fährt
    gloss: 'Lotte: Schön! Mit wem fährst du?'
  nl.a2.unit79.lesson06.teach.omar_oom:
    title: Omar sagt, mit wem und wie lange
    gloss: 'Omar: Mit meinem Onkel. Wir bleiben eine Woche.'
  nl.a2.unit79.lesson06.teach.lotte_later:
    title: Lotte fragt nach später
    gloss: 'Lotte: Und später? Was hast du vor?'
  nl.a2.unit79.lesson06.teach.omar_cursus:
    title: Omar nennt eine Absicht und fragt zurück
    gloss: 'Omar: Nächstes Jahr habe ich vor, einen Kurs zu belegen. Und du?'
  nl.a2.unit79.lesson06.teach.lotte_antwoord:
    title: Lotte antwortet
    gloss: 'Lotte: Im Juli werde ich arbeiten. Vielleicht fahre ich danach zu meinen Eltern.'
