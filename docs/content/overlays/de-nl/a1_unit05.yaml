teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: Vater und Mutter
    gloss: Vater / Mutter
    note: '*Vader* ist das übliche, neutrale Wort für „Vater“. *Moeder* ist das übliche, neutrale Wort für „Mutter“.'
    example_gloss:
    - Das ist mein Vater.
    - Das ist meine Mutter.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: Eltern, Bruder und Schwester
    gloss: Eltern / Bruder / Schwester
    note: '*Ouders* steht in dieser Bedeutung immer im Plural; *de broer* und *de zus* haben beide den Artikel *de*.'
    example_gloss:
    - Meine Eltern wohnen in Utrecht.
    - Ich habe einen Bruder.
    - Ich habe eine Schwester.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: Kind und Kinder
    gloss: das Kind / die Kinder
    note: '*Kind* ist ein het-Wort: *het kind*. Der Plural *kinderen* hat *de*, obwohl der Singular *kind* *het* hat.'
    example_gloss:
    - Meine Schwester hat ein Kind.
    - Mein Onkel und meine Tante haben zwei Kinder.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: Ich habe einen Bruder und eine Schwester
    gloss: Ich habe einen Bruder und eine Schwester.
    note: '*Ik heb ...* ist die übliche Art zu sagen, welche Familienmitglieder man hat.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: Opa, Oma, Onkel und Tante
    gloss: Opa / Oma / Onkel / Tante
    note: '*Opa* ist das alltägliche Wort für Großvater; *grootvader* ist förmlicher bzw. schriftsprachlich. *Oma* ist das alltägliche Wort für Großmutter; *grootmoeder* ist förmlicher bzw. schriftsprachlich. *De oom*. *De tante*.'
    example_gloss:
    - Mein Opa und meine Oma wohnen in Rotterdam.
    - Meine Oma ist neunundneunzig Jahre alt.
    - Mein Onkel wohnt in Amsterdam.
    - Mein Onkel und meine Tante haben zwei Kinder.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef und nicht sind mehrdeutig
    gloss: neef = Cousin oder Neffe; nicht = Cousine oder Nichte
    note: Im Niederländischen gibt es für Cousin und Neffe kein unterschiedliches Wort; der Kontext zeigt, was gemeint ist. In diesem Kapitel nicht Teil der Übungen – hier nur erwähnt, damit Sie die Wörter später wiedererkennen.
    target_text: neef = Cousin ODER Neffe; nicht = Cousine ODER Nichte
  nl.a1.unit05.lesson02.teach.gezin:
    title: Familie (Haushalt)
    gloss: Familie (Haushalt)
    note: '*Gezin* bezeichnet den Haushalt, in dem man lebt (meist Eltern und Kinder); *familie* ist das weitere Wort für die erweiterte Familie bzw. Verwandtschaft im Allgemeinen.'
    example_gloss: Meine Familie wohnt in Utrecht.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: Meine Großeltern wohnen in Rotterdam
    gloss: Mein Opa und meine Oma wohnen in Rotterdam.
    note: '*Wonen in* + Städtename gibt an, wo jemand wohnt.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: Mein Onkel und meine Tante haben zwei Kinder
    gloss: Mein Onkel und meine Tante haben zwei Kinder.
    note: Man verwendet *hebben*, weil *oom en tante* sich auf zwei Personen bezieht.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: Mein und dein (unbetont und betont)
    gloss: mein / dein (unbetont) / dein (betont)
    note: '*Mijn* behält vor de- und het-Wörtern immer dieselbe Form, egal ob Singular oder Plural. *Je* ist die übliche informelle Form, wenn man nicht betont, wessen etwas ist; auch sie behält vor jedem Nomen dieselbe Form. *Jouw* ist stärker betont als *je* und nötig, wenn man das Familienmitglied einer Person mit dem einer anderen kontrastiert; auch es behält vor jedem Nomen dieselbe Form.'
    example_gloss:
    - Das ist mein Bruder.
    - Ist das deine Schwester?
    - Ist das deine Schwester?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je oder jouw
    gloss: je und jouw bedeuten beide „dein“ (informell)
    note: Verwenden Sie *je*, wenn nichts besonders betont wird. Verwenden Sie *jouw*, wenn Sie betonen, wessen etwas ist, vor allem im Kontrast. Die volle Form *jouw* ist auch ohne Kontrast möglich, aber *je* ist dort üblicher.
    target_text: je und jouw bedeuten beide „dein/deine“ (informell). Je ist ohne besondere Betonung üblich; jouw ist stärker betont und wird für einen Kontrast gebraucht. Beide behalten vor jedem Nomen dieselbe Form.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: Das ist mein Bruder
    gloss: Das ist mein Bruder.
    note: '*Dit is ...* stellt jemanden vor, der in der Nähe ist.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: Ist das deine Schwester?
    gloss: Ist das deine Schwester?
    note: '*Dat is ...* bezieht sich auf jemanden, der weiter weg ist oder schon erwähnt wurde.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: Sein und ihr
    gloss: sein / ihr
    note: '*Zijn* behält immer dieselbe Form, wie *mijn*, *je* und *jouw*. Auch *haar* behält immer dieselbe Form.'
    example_gloss:
    - Das ist sein Vater.
    - Das ist ihre Mutter.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn oder haar
    gloss: zijn = sein, haar = ihr
    note: 'Bei den Personen in diesen Beispielen wählen Sie *zijn* für einen männlichen Besitzer und *haar* für eine weibliche Besitzerin. Das folgende Familienwort beeinflusst die Wahl nicht: *zijn vader* und *zijn moeder*; *haar vader* und *haar moeder*.'
    target_text: zijn = sein/seine, haar = ihr/ihre; beide bleiben unabhängig vom folgenden Nomen gleich.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: Das ist sein Vater
    gloss: Das ist sein Vater.
    note: '*Zijn vader* – sein Vater.'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: Das ist ihre Mutter
    gloss: Das ist ihre Mutter.
    note: '*Haar moeder* – ihre Mutter.'
  nl.a1.unit05.lesson05.teach.heet:
    title: Heißt
    gloss: heißt
    note: '*Ik heet...* / *Hij heet...* – die übliche Art, jemandes Namen zu nennen, schon aus Lektion 1 bekannt.'
    example_gloss: Ich heiße Lotte.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'Namen von Familienmitgliedern: Sander, Fenna, Jan und Marieke'
    gloss: Sander (ein niederländischer Männername) / Fenna (ein niederländischer Frauenname) / Jan (ein niederländischer Männername) / Marieke (ein niederländischer Frauenname)
    note: Alle vier sind häufige niederländische Vornamen – Sander und Jan sind Männernamen, Fenna und Marieke sind Frauennamen.
    example_gloss:
    - Mein Bruder heißt Sander.
    - Meine Schwester heißt Fenna.
    - Mein Vater heißt Jan.
    - Meine Mutter heißt Marieke.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: Rotterdam
    note: Eine große niederländische Stadt.
    example_gloss: Lottes Opa und Oma wohnen in Rotterdam.
  nl.a1.unit05.lesson05.teach.profile:
    title: Lottes Familienprofil
    gloss: Ich heiße Lotte. Ich habe einen Bruder und eine Schwester. Mein Bruder heißt Sander und meine Schwester heißt Fenna. Mein Vater heißt Jan und meine Mutter heißt Marieke. Mein Opa und meine Oma wohnen in Rotterdam.
    note: Eine kurze gesprochene Vorstellung von Lottes Familie mit Wortschatz aus den früheren Lektionen dieser Einheit.
  nl.a1.unit05.lesson06.teach.egypte:
    title: Ägypten
    gloss: Ägypten
    note: Omars Heimatland, wie in den früheren Einheiten.
    example_gloss: Meine Eltern wohnen in Ägypten.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: Jeden Monat
    gloss: jeden Monat
    note: '*Elke* + Nomen im Singular drückt „jede/jeden/jedes ...“ aus.'
    example_gloss: Ja, jeden Monat.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: Haben Sie Geschwister?
    gloss: 'Lotte: Hast du Brüder oder Schwestern, Omar? Omar: Ja, ich habe zwei Schwestern. Keine Brüder. Und du? Lotte: Ich habe einen Bruder und eine Schwester.'
    note: '*Broers of zussen* – Brüder oder Schwestern, mit den Pluralformen.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: Wohnen deine Eltern auch in den Niederlanden?
    gloss: 'Omar: Wohnen deine Eltern auch in den Niederlanden? Lotte: Ja, meine Eltern wohnen in Utrecht. Und deine Familie? Omar: Meine Eltern wohnen in Ägypten, aber mein Onkel wohnt hier in Amsterdam.'
    note: '*Wonen ook in* – „wohnen auch in“; so fragt man, ob dasselbe auch für jemand anderen gilt.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: Siehst du ihn oft?
    gloss: 'Lotte: Schön! Siehst du ihn oft? Omar: Ja, jeden Monat.'
    note: '*Zie je hem vaak?* – eine natürliche, gängige Art, nach der Häufigkeit von Besuchen zu fragen.'
