course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch auf A2-Niveau zum Einladen, Zusagen und Absagen.
  learning_goal: Jemanden einladen sowie mit Grund und Alternative zusagen oder absagen – mit Modalverben, omdat/want und gaan/zullen.
units:
  nl.a2.unit107.uitnodigen_en_afslaan:
    title: Einladen und absagen
    description: Laden Sie eine Freundin oder einen Freund ein, sagen Sie begeistert zu oder lehnen Sie höflich ab – mit Grund und einem Alternativvorschlag.
lessons:
  nl.a2.unit107.lesson01.een_uitnodiging:
    title: Eine Einladung
  nl.a2.unit107.lesson02.ja_graag:
    title: Ja, gern!
  nl.a2.unit107.lesson03.helaas_ik_kan_niet:
    title: Leider kann ich nicht
  nl.a2.unit107.lesson04.zullen_we_zondag:
    title: Wollen wir es am Sonntag machen?
  nl.a2.unit107.lesson05.noors_uitnodiging:
    title: Noors Einladung
  nl.a2.unit107.lesson06.lotte_en_omar_plannen:
    title: Lotte und Omar machen Pläne
teaching:
  nl.a2.unit107.lesson01.teach.plekken:
    title: Orte und Anlässe
    gloss: die Party / der Geburtstag / das Kino / das Konzert / das Theater
    note: Das sind die Anlässe und Orte, zu denen man andere einlädt.
    example_gloss:
    - Lotte gibt am Samstag eine Party.
    - Noor hat am Sonntag Geburtstag.
    - Wir gehen heute Abend ins Kino.
    - Am Samstag gibt es ein Konzert.
    - Das Theater ist in der Stadt.
  nl.a2.unit107.lesson01.teach.film:
    title: Film, Vorstellung, Eintrittskarte
    gloss: der Film / die Vorstellung / die Eintrittskarte / heute Abend / Samstag / Sonntag
    note: '*Voorstelling* ist eine Aufführung, zum Beispiel im Theater.'
    example_gloss:
    - Der Film beginnt um acht Uhr.
    - Die Vorstellung ist am Samstag.
    - Ich habe zwei Fahrkarten.
    - Heute Abend läuft ein Film.
  nl.a2.unit107.lesson01.teach.gn_zin:
    title: Heb je zin om ... te ...?
    gloss: Hast du Lust, am Samstag ins Kino zu gehen?
    note: Mit *Heb je zin om ... te + Infinitiv?* laden Sie jemanden ein. Der Infinitiv (*gaan*) steht ganz am Ende, nach *te*.
    example_gloss:
    - Hast du Lust, ins Konzert zu gehen?
    - Hast du Lust, heute Abend ins Theater zu gehen?
  nl.a2.unit107.lesson01.teach.gn_kom_je:
    title: Kom je ook naar ...?
    gloss: Kommst du auch zur Party? Kommst du auch ins Kino?
    note: '*Kom je ook naar ...?* ist eine kurze, freundliche Einladung. *Jij* ist die betonte Form von *je*; hier sind beide möglich.'
    example_gloss:
    - Kommst du auch zu Noors Party?
  nl.a2.unit107.lesson01.teach.gn_wil_je_mee:
    title: Wil je mee naar ...?
    gloss: Willst du mit ins Konzert kommen? Willst du mit ins Theater kommen?
    note: '*Mee* bedeutet „mit“. *Wil je mee naar ...?* braucht keinen Infinitiv: Die Bewegung steckt schon in *mee naar*.'
    example_gloss:
    - Willst du mit ins Kino kommen?
  nl.a2.unit107.lesson01.teach.zinnen:
    title: Drei Einladungen
    gloss: Hast du Lust, heute Abend ins Kino zu gehen? Kommst du auch zur Party? Willst du mit ins Konzert kommen?
  nl.a2.unit107.lesson02.teach.leuk:
    title: Zusagen
    gloss: schön / gemütlich und nett / gern / gute Idee
    note: '*Gezellig* beschreibt eine angenehme, gesellige Atmosphäre. *Graag* bedeutet „gern“.'
    example_gloss:
    - Wie schön!
    - Das klingt für mich schön.
    - Ja, gern!
    - Gute Idee!
  nl.a2.unit107.lesson02.teach.gn_ja:
    title: Eine Einladung annehmen
    gloss: Schön! Ja, gern! Ich komme mit. Ich komme gern.
    note: 'Sagen Sie mit einer kurzen Reaktion zu (*Leuk!*, *Ja, graag!*) und bestätigen Sie dann: *Ik ga mee* oder *Ik kom graag*.'
    example_gloss:
    - Ich komme gern zur Party.
    - Ja, ich komme mit ins Kino.
  nl.a2.unit107.lesson02.teach.gn_lijkt:
    title: Dat lijkt me ...
    gloss: Das klingt nach Spaß. Das klingt gemütlich.
    note: '*Dat lijkt me ...* ist eine gängige Art zu sagen, dass Ihnen ein Plan gefällt. Das Verb *lijkt* bleibt an zweiter Stelle.'
    example_gloss:
    - Das scheint mir eine gute Idee zu sein.
  nl.a2.unit107.lesson02.teach.tijd:
    title: Nach der Uhrzeit fragen
    gloss: Um wie viel Uhr beginnt es? Es beginnt um acht Uhr.
    note: Nach der Zusage fragen Sie mit *Hoe laat begint het?* nach der Uhrzeit und antworten mit *om ... uur*.
    example_gloss:
    - Der Film beginnt um neun Uhr.
    - Die Vorstellung beginnt um acht Uhr.
  nl.a2.unit107.lesson03.teach.helaas:
    title: Absagen und Gründe
    gloss: leider / nicht / aber / arbeiten / müde / krank / der Termin / keine Zeit
    note: '*Helaas* macht eine Absage weicher. *Geen tijd* bedeutet „keine Zeit“.'
    example_gloss:
    - Leider kann ich nicht.
    - Ich würde gern, aber ich habe keine Zeit.
    - Ich muss arbeiten.
    - Ich bin müde.
    - Ich bin krank.
    - Ich habe einen Termin.
  nl.a2.unit107.lesson03.teach.gn_modals:
    title: Kunnen, moeten, willen
    gloss: Ich kann nicht kommen. Ich muss arbeiten. Ich würde gern, aber ich habe keine Zeit.
    note: '*Kunnen*, *moeten* und *willen* stehen meist mit einem zweiten Verb im Infinitiv am Satzende, ähnlich wie im Deutschen: *Ik kan niet komen*; *Ik moet werken*.'
    example_gloss:
    - Ich kann nicht zur Party kommen.
    - Am Samstag muss ich arbeiten.
  nl.a2.unit107.lesson03.teach.gn_want:
    title: Want nennt einen Grund
    gloss: Leider kann ich nicht kommen, weil ich arbeiten muss.
    note: '*Want* verbindet zwei Hauptsätze, deshalb bleibt die Wortstellung normal: erst das Subjekt, dann das Verb (*want ik moet werken*). Das entspricht deutschem „denn“.'
    example_gloss:
    - Ich kann nicht kommen, denn ich bin krank.
  nl.a2.unit107.lesson03.teach.gn_omdat:
    title: Omdat schiebt das Verb ans Ende
    gloss: Ich komme nicht, weil ich einen Termin habe.
    note: 'Nach *omdat* steht das Verb am Ende des Nebensatzes: *omdat ik een afspraak heb*. Mit einem Modalverb bleiben beide Verben am Ende zusammen, das finite Verb zuerst: *omdat ik moet werken*.'
    example_gloss:
    - Leider kann ich nicht kommen, weil ich arbeiten muss.
  nl.a2.unit107.lesson03.teach.gn_contrast:
    title: Want und omdat im Vergleich
    gloss: Ich komme nicht, denn/weil ich einen Termin habe. (beide Sätze)
    note: Beide nennen einen Grund. Bei *want ik heb* bleibt das Verb an zweiter Stelle; bei *omdat ik ... heb* steht es am Ende.
  nl.a2.unit107.lesson03.teach.zin:
    title: Eine höfliche Absage
    gloss: Leider kann ich nicht, denn ich muss arbeiten.
  nl.a2.unit107.lesson04.teach.alt:
    title: Etwas anderes vorschlagen
    gloss: stattdessen / dann / nächste Woche / morgen / prima / (Abtönungswort)
    note: '*In plaats daarvan* bedeutet „stattdessen“. *Wel* betont hier, dass diese Möglichkeit passt.'
    example_gloss:
    - Wollen wir stattdessen am Sonntag gehen?
    - Dann habe ich Zeit.
    - Nächste Woche passt mir.
    - Morgen gehe ich arbeiten.
    - Das ist in Ordnung.
  nl.a2.unit107.lesson04.teach.gn_zullen:
    title: Zullen we ...?
    gloss: Wollen wir am Sonntag ins Kino gehen? Wollen wir stattdessen am Sonntag ins Kino gehen?
    note: '*Zullen we ...?* schlägt einen gemeinsamen Plan vor. Das Verb des Plans (*gaan*) steht am Ende.'
    example_gloss:
    - Wollen wir morgen ins Konzert gehen?
  nl.a2.unit107.lesson04.teach.gn_gaan:
    title: Gaan für die Zukunft
    gloss: Ich werde am Samstag arbeiten. Wir gehen am Sonntag ins Kino.
    note: '*Gaan* + Infinitiv spricht über Pläne: *Ik ga zaterdag werken*. Der Infinitiv bleibt am Ende. Steht eine Zeitangabe vorn, bleibt das Verb an zweiter Stelle: *Zondag gaan wij ...*.'
    example_gloss:
    - Morgen gehe ich ins Theater.
    - Am Sonntag gehen wir ins Konzert.
  nl.a2.unit107.lesson04.teach.gn_zal:
    title: Zullen für ein Versprechen
    gloss: Ich rufe dich morgen an.
    note: '*Zullen* kann auch einen Plan oder ein Versprechen ausdrücken: *Ik zal je morgen bellen*. *Zal ik ...?* bietet etwas an; *Zullen we ...?* schlägt etwas vor.'
    example_gloss:
    - Ich komme am Sonntag.
  nl.a2.unit107.lesson04.teach.zinnen:
    title: Absage mit Alternative
    gloss: Leider kann ich nicht, denn ich muss arbeiten. Wollen wir am Sonntag gehen?
  nl.a2.unit107.lesson05.teach.woorden:
    title: Wörter in einer Nachricht
    gloss: die Einladung / danke / liebe Grüße / schon / sich verabreden
    note: '*Groetjes* beendet eine freundliche Nachricht.'
    example_gloss:
    - Danke für die Einladung!
    - Liebe Grüße, Lotte
    - Ich habe schon einen Termin.
  nl.a2.unit107.lesson05.teach.gn_voltooid:
    title: Heb + Partizip (nur zum Lesen)
    gloss: Ich habe mich mit meinen Eltern verabredet. Ich habe gearbeitet.
    note: Bei den meisten Verben zeigt *heb + Partizip Perfekt* (*afgesproken*, *gewerkt*), was schon passiert ist, ähnlich wie „habe + Partizip“ im Deutschen. Erkennen Sie es vorerst nur beim Lesen; Sie müssen es noch nicht schreiben.
  nl.a2.unit107.lesson05.teach.reading:
    title: Noor und Lotte schreiben
    gloss: Hallo Lotte, hast du Lust, am Samstag mit ins Theater zu kommen? Die Vorstellung beginnt um acht Uhr. Kommst du auch? Liebe Grüße, Noor. Hallo Noor, danke für die Einladung! Leider kann ich nicht, denn ich habe mich schon mit meinen Eltern verabredet. Wollen wir am Sonntag ins Kino gehen? Dann habe ich Zeit. Liebe Grüße, Lotte
    note: Finden Sie die Einladung, die Antwort, den Grund und die Alternative.
    glosses:
      afgesproken: verabredet
      ouders: Eltern
      uitnodiging: Einladung
      groetjes: liebe Grüße
  nl.a2.unit107.lesson06.teach.beurt1:
    title: Lotte lädt Omar ein
    gloss: 'Lotte: Hallo Omar, hast du Lust, am Samstag mit ins Konzert zu kommen?'
  nl.a2.unit107.lesson06.teach.beurt2:
    title: Omar sagt mit Grund ab
    gloss: 'Omar: Leider kann ich nicht, denn ich muss arbeiten.'
  nl.a2.unit107.lesson06.teach.beurt3:
    title: Lotte schlägt eine Alternative vor
    gloss: 'Lotte: Schade! Wollen wir am Sonntag ins Kino gehen?'
  nl.a2.unit107.lesson06.teach.beurt4:
    title: Omar sagt zu und fragt nach der Uhrzeit
    gloss: 'Omar: Am Sonntag kann ich. Um wie viel Uhr fängt der Film an?'
  nl.a2.unit107.lesson06.teach.beurt5:
    title: Lotte nennt die Uhrzeit
    gloss: 'Lotte: Um acht Uhr.'
  nl.a2.unit107.lesson06.teach.beurt6:
    title: Omar sagt zu
    gloss: 'Omar: Schön, gern! Ich komme mit.'
