course:
  title: Niederländisch A1
  description: 'Niederländisch für Anfänger, um das äußere Erscheinungsbild einer Person zu beschreiben: Größe und Alterseindruck, Haar- und Augenfarbe, die zentrale Frage Hoe ziet ... eruit? und den Vergleich des Aussehens zweier Personen.'
