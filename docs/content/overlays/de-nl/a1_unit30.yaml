teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: Groß und klein
    gloss: groß / klein
    note: '*Lang* beschreibt eine große Person; *klein* beschreibt eine kleine Person (dasselbe Wort wird in diesem Kurs auch für einen kleinen Gegenstand verwendet).'
    example_gloss:
    - Fenna ist groß.
    - Sander ist klein.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: Alt und jung
    gloss: alt / jung
    note: '*Oud* und *jong* beschreiben hier einen allgemeinen Eindruck vom Aussehen, nicht eine genaue Anzahl von Jahren.'
    example_gloss:
    - Opa ist alt.
    - Omar ist jung.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: eine Zahl oder ein Eindruck'
    gloss: Oud kann eine genaue Anzahl von Jahren bedeuten, wie in Hoe oud ben je?, oder einen allgemeinen Eindruck ohne Zahl, wie in Opa is oud.
    note: Sie kennen *oud* bereits aus der Frage nach dem genauen Alter (*Hoe oud ben je?*). Hier beschreibt es, wie alt jemand AUSSIEHT, ganz ohne Zahl.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna ist groß und Sander ist klein
    gloss: Fenna ist groß und Sander ist klein.
    note: Ein einfacher zusammengesetzter Satz mit *en* (und), der den direkten Vergleich in Lektion 5 vorbereitet.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: Haare
    gloss: die Haare
    note: '*Haar* ist ein het-Wort: *het haar*.'
    example_gloss: Omar hat kurze schwarze Haare.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: Drei Haarfarben. *Zwart* (schwarz) kam früher bei der Kleidung vor und wird hier für Haare wiederverwendet.
    example_gloss:
    - Lotte hat blonde Haare.
    - Sander hat braune Haare.
    - Opa hat graue Haare.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Lang* (lang) greift das Wort für die Körpergröße aus Lektion 1 auf, beschreibt hier aber die Haarlänge. *Kort* (kurz) ist hier neu.'
    example_gloss:
    - Fenna hat lange Haare.
    - Sander hat kurze Haare.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar mit unflektiertem Adjektiv
    gloss: 'Haar ist ein het-Wort ohne Artikel, daher bleibt das Adjektiv ohne Endung: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: Vor *haar* steht in dieser unbestimmten Form ohne Artikel keine Endung -e. Vergleichen Sie das mit *ogen* in Lektion 3, wo das -e steht.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: zwei Bedeutungen'
    gloss: 'Haar hat zwei Bedeutungen: „Haar“ bzw. „Haare“ (das neue Nomen dieser Lektion) und „ihr“ (das Possessivpronomen aus Unit 5, z. B. haar moeder). Der Kontext zeigt, was gemeint ist.'
    note: 'Ein echtes niederländisches Homonym: *haar* als Substantiv (Haar) und *haar* als Possessivpronomen (ihr) werden gleich geschrieben. Der Rest des Satzes macht immer klar, was gemeint ist.'
    target_text: 'Haar hat zwei Bedeutungen: „Haar“ (das neue Substantiv dieser Lektion) und „ihr“ (das Possessivpronomen, z. B. haar moeder). Der Kontext zeigt, was gemeint ist.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar hat kurze schwarze Haare
    gloss: Omar hat kurze schwarze Haare.
    note: Greift *zwart* (schwarz) aus der Kleidungs-Unit 20 wieder auf.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte hat lange blonde Haare
    gloss: Lotte hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: Augen
    gloss: die Augen
    note: '*Ogen* ist der Plural von *het oog*; im Plural steht immer *de*.'
    example_gloss: Omar hat braune Augen.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: '*Blauw* (blau) kam früher bei der Kleidung vor; *bruin* (braun) wurde gerade in Lektion 2 für Haare gelernt; *groen* (grün) ist hier neu.'
    example_gloss:
    - Lotte hat blaue Augen.
    - Sander hat braune Augen.
    - Fenna hat grüne Augen.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen mit -e
    gloss: 'Bei ogen (Plural) bekommt das Adjektiv ein zusätzliches -e: blauwe ogen, bruine ogen, groene ogen.'
    note: Vergleichen Sie das mit *haar* aus Lektion 2, bei dem das Adjektiv ohne Endung bleibt. Im Plural bekommt das Adjektiv immer ein -e, egal ob de-Wort oder het-Wort.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Wie sieht Lotte aus?
    gloss: Wie sieht Lotte aus?
    note: '*Hoe ziet ... eruit?* ist die zentrale Frage dieser Unit. Damit können Sie nach dem Aussehen jeder beliebigen Person fragen.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte hat lange blonde Haare und blaue Augen
    gloss: Lotte hat lange blonde Haare und blaue Augen.
    note: Eine Musterantwort, die Haare und Augen mit *en* in einem Satz verbindet.
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte stellt Nina vor
    gloss: 'Lotte: Ein neues Mädchen kommt ins Sprachcafé. Sie heißt Nina.'
    note: '*Er komt* (es kommt / es kommt jemand) führt eine neue Person in die Szene ein.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar fragt, wie sie aussieht
    gloss: 'Omar: Okay! Wie sieht sie aus?'
    note: Greift die zentrale Frage dieser Unit wieder auf, hier mit *ze* (sie) statt eines Namens.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte beschreibt Ninas Größe und Haare
    gloss: 'Lotte: Sie ist klein und hat kurze blonde Haare.'
    note: Verbindet *klein* aus Lektion 1 mit dem Haar-Wortschatz aus Lektion 2.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar fragt nach ihren Augen
    gloss: 'Omar: Und ihre Augen?'
    note: '*Haar* bedeutet hier „ihr“ (das Possessivpronomen aus Unit 5), nicht „Haar“. Siehe den Homonym-Hinweis in Lektion 2.'
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte beschreibt Ninas Augen
    gloss: 'Lotte: Sie hat grüne Augen.'
    note: Greift *groene ogen* aus Lektion 3 wieder auf.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar wird sie erkennen
    gloss: 'Omar: Danke! Dann erkenne ich sie bestimmt.'
    note: '*Herken ik haar wel* heißt „ich werde sie schon erkennen“. *Haar* bedeutet hier wieder „sie/ihr“ (Pronomen), nicht „Haar“.'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Sander und Fenna im Vergleich
    gloss: Sander und Fenna sind Bruder und Schwester, aber sie sehen unterschiedlich aus. Sander ist klein und hat kurze braune Haare und braune Augen. Fenna ist größer als Sander und hat lange braune Haare und grüne Augen. Wie sehen Sie aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      broer: Bruder
      zus: Schwester
      zien: ist ... (vom Aussehen her)
      anders: verschieden
      klein: klein
      kort: klein
      bruin: braun
      haar: Haare
      bruine: braun
      ogen: Augen
      langer: größer
      lang: lang
      groene: grün
      eruit: (Teil von 'eruit zien' = aussehen)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: Das Vergleichsmuster noch einmal anwenden
    gloss: 'Dieses Muster kennen Sie schon von Vergleichen: Adjektiv + er + dan (als). Hier verwenden Sie es für Personen: Fenna ist größer als Sander.'
    note: Genau das Muster *Adjektiv + -er + dan* aus der Rucksack-Unit 14, hier auf die Beschreibung von Personen statt von Gegenständen angewendet.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna hat längere Haare als Sander
    gloss: Fenna hat längere Haare als Sander.
    note: '*Langer* bleibt vor *haar* (einem het-Wort) ohne Endung, genau wie die Regel in Lektion 2, auch im Komparativ.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: Ein Mustersatz in der ersten Person mit *Ik heb ...*, den Sie wiederverwenden können, wenn Sie Ihr eigenes Aussehen beschreiben.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar entdeckt Nina
    gloss: 'Omar: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Kijk* (schau) wurde bereits im Dialog von Unit 14 genauso verwendet.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte bestätigt
    gloss: 'Lotte: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina begrüßt Omar
    gloss: 'Nina: Hallo, bist du Omar?'
    note: 'Eine einfache, informelle Begrüßungsfrage: *ben jij ...?*'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar begrüßt Nina zurück
    gloss: 'Omar: Ja! Schön, dich kennenzulernen, Nina.'
    note: '*Leuk je te ontmoeten* ist die übliche Wendung für ein echtes erstes Kennenlernen (siehe Unit 1), nicht *leuk je te zien*, das man für jemanden sagt, den man schon kennt.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: Schließt den Dialog ab – Omar hat Nina anhand von Lottes Beschreibung erkannt.
