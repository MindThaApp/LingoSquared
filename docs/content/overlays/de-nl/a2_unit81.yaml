  title: Niederländisch A2
  description: Niederländisch für Fortgeschrittene mit grammatikorientierten Übungen zur Beschreibung vergangener Ereignisse.
units:
  nl.a2.unit81.een_drukke_ochtend:
    title: Ein hektischer Morgen
    description: Beschreiben Sie einen Morgen oder den Arbeitsweg Schritt für Schritt mit trennbaren Verben im Perfectum.
lessons:
  nl.a2.unit81.lesson01.ge_in_het_midden:
    title: Ge- in der Mitte
  nl.a2.unit81.lesson02.stappen_op_volgorde:
    title: Schritte in der richtigen Reihenfolge
  nl.a2.unit81.lesson03.wel_of_geen_ge:
    title: Mit oder ohne ge-?
  nl.a2.unit81.lesson04.de_ochtend_ging_mis:
    title: Der Morgen lief schief
  nl.a2.unit81.lesson05.noors_bericht:
    title: Noors Nachricht
  nl.a2.unit81.lesson06.lotte_en_noor:
    title: Lotte und Noor sprechen nach der Arbeit
teaching:
  nl.a2.unit81.lesson01.teach.ochtend_reis:
    title: Morgen und Arbeitsweg
    gloss: der Morgen, der Wecker, der Bus, das Fahrrad, die Tasche
    note: Grundwörter für das Fertigmachen und den Arbeitsweg.
    example_gloss:
    - Der Morgen beginnt früh.
    - Mein Wecker klingelt um sieben.
    - Der Bus steht an der Haltestelle.
    - Mein Fahrrad steht draußen.
    - Meine Tasche ist fertig.
  nl.a2.unit81.lesson01.teach.verbindingswoorden:
    title: Schritte ordnen
    gloss: zuerst, danach, anschließend, schließlich
    note: Diese Wörter gliedern einen Bericht Schritt für Schritt. Steht eines davon am Anfang eines Hauptsatzes, folgt das finite Verb vor dem Subjekt – genau wie im Deutschen.
    example_gloss:
    - Zuerst frühstücke ich.
    - Danach packe ich meine Tasche.
    - Anschließend gehe ich nach draußen.
    - Schließlich steige ich in den Bus.
  nl.a2.unit81.lesson01.teach.gn_midden:
    title: Das Partizip umschließt ge-
    gloss: aufstehen → aufgestanden; ankommen → angekommen; aussteigen → ausgestiegen; einsteigen → eingestiegen
    note: 'Bei einem trennbaren Verb steht *ge-* zwischen Präfix und Verb: *op-ge-staan*, *aan-ge-komen*, *uit-ge-stapt*, *in-ge-stapt*. Das kennen Sie auch aus dem Deutschen: auf-ge-standen.'
  nl.a2.unit81.lesson01.teach.gn_zinnen:
    title: Abgeschlossene Schritte am Morgen
    gloss: Ich bin früh aufgestanden. Der Bus ist zu spät angekommen. Ich bin am Bahnhof ausgestiegen.
    note: Diese Verben der Bewegung und Zustandsänderung bilden das Perfectum mit *zijn*.
  nl.a2.unit81.lesson01.teach.gn_hulpwerkwoord:
    title: Diese Verben verwenden zijn
    gloss: Ich bin aufgestanden; der Bus ist angekommen; ich bin ein- und ausgestiegen.
    note: Bei diesen abgeschlossenen Vorgängen der Bewegung oder Zustandsänderung verwendet man *ben/is* plus Partizip.
  nl.a2.unit81.lesson02.teach.klaarmaken:
    title: Sich fertig machen
    gloss: sich anziehen, aufräumen, abwaschen, mitnehmen
    note: Alle vier sind trennbare Verben.
    example_gloss:
    - Das Anziehen geht heute schnell.
    - Ich räume nach dem Frühstück auf.
    - Ich wasche nach dem Essen ab.
    - Mitnehmen oder zu Hause lassen?
  nl.a2.unit81.lesson02.teach.gn_participles:
    title: Weitere trennbare Partizipien
    gloss: angezogen; aufgeräumt; abgewaschen; mitgenommen
    note: 'Das Präfix bleibt vorn und *ge-* steht in der Mitte: *aan-ge-kleed*, *op-ge-ruimd*, *af-ge-wassen*, *mee-ge-nomen*.'
  nl.a2.unit81.lesson02.teach.stappen:
    title: Ein Ablauf in vier Schritten
    gloss: Zuerst bin ich aufgestanden. Danach habe ich mich angezogen. Anschließend habe ich meine Tasse abgewaschen. Schließlich habe ich meine Tasche mitgenommen.
    note: Jedes Verbindungswort markiert den nächsten abgeschlossenen Schritt.
  nl.a2.unit81.lesson03.teach.contrastwerkwoorden:
    title: Drei Verben ohne zusätzliches ge-
    gloss: vergessen, abfahren, frühstücken
    note: Diese Verben beginnen mit untrennbaren Präfixen und bilden ihr Partizip ohne zusätzliches *ge-*.
    example_gloss:
    - Irren ist menschlich.
    - Wir wollen um acht Uhr aufbrechen.
    - Ich frühstücke zu Hause.
  nl.a2.unit81.lesson03.teach.gn_contrast:
    title: Trennbar und untrennbar
    gloss: 'Trennbar: aufstehen → aufgestanden. Untrennbar: vergessen → vergessen, aufbrechen/abfahren → abgefahren, frühstücken → gefrühstückt.'
    note: Verwenden Sie *opgestaan*, aber *vergeten*, *vertrokken* und *ontbeten* ohne weiteres *ge-*.
  nl.a2.unit81.lesson03.teach.contrastzinnen:
    title: Die Formen im Vergleich
    gloss: Ich bin aufgestanden und habe gefrühstückt. Danach bin ich abgefahren. Ich habe meine Tasche vergessen.
    note: Nur das trennbare Verb *opstaan* setzt *ge-* hinter das Präfix.
  nl.a2.unit81.lesson03.teach.gn_modal:
    title: Ein trennbares Verb nach einem Modalverb
    gloss: Ich will früh aufstehen. Ich muss die Küche aufräumen. Ich kann am Bahnhof aussteigen.
    note: 'Nach *wil, moet* oder *kan* im Präsens bleibt der Infinitiv zusammengeschrieben und steht am Satzende: *opstaan, opruimen, uitstappen*.'
  nl.a2.unit81.lesson04.teach.op_tijd_snel:
    title: Wie der Morgen verlief
    gloss: pünktlich, schnell, trotzdem / doch
    note: Mit diesen Wörtern erklären Sie den Zeitpunkt und ein unerwartet gutes Ergebnis.
    example_gloss:
    - Ich möchte pünktlich ankommen.
    - Der Bus fährt schnell.
    - Es regnet, aber ich gehe trotzdem.
  nl.a2.unit81.lesson04.teach.gn_negatie:
    title: Verneinte Schritte
    gloss: Ich habe meine Tasche nicht mitgenommen. Ich bin nicht rechtzeitig aufgestanden.
    note: '*niet* steht vor dem verneinten Element: dem trennbaren Partizip oder der Wendung *op tijd*.'
  nl.a2.unit81.lesson04.teach.gn_dat:
    title: Das Perfectum im dat-Satz
    gloss: Ich sagte, dass ich früh aufgestanden bin. Ich hörte, dass der Bus zu spät angekommen ist.
    note: 'Nach *dat* rücken beide Verbteile ans Ende: *ben opgestaan*, *is aangekomen*.'
  nl.a2.unit81.lesson04.teach.scenario:
    title: Ein Morgen, der schiefging
    gloss: Zuerst bin ich nicht rechtzeitig aufgestanden. Danach habe ich mich schnell angezogen. Anschließend habe ich meine Tasche nicht mitgenommen. Schließlich bin ich in den Bus eingestiegen.
    note: Die Verbindungswörter bringen die misslungenen und die abgeschlossenen Schritte in eine klare Reihenfolge.
  nl.a2.unit81.lesson05.teach.noor_bericht:
    title: Noors hektischer Morgen
    gloss: Hallo Lotte! Mein Morgen war sehr hektisch. Zuerst bin ich zu spät aufgestanden. Danach habe ich mich schnell angezogen und gefrühstückt. Anschließend habe ich die Küche aufgeräumt, aber mein Mittagessen habe ich nicht mitgenommen. Ich bin mit dem Fahrrad zur Bushaltestelle gefahren und in den Bus eingestiegen. Schließlich bin ich doch noch pünktlich bei der Arbeit angekommen.
    note: Achten Sie auf die Reihenfolge der Ereignisse und auf das eine Ding, das Noor nicht mitgenommen hat.
    glosses:
      erg: sehr
      druk: hektisch, stressig
      bushalte: Bushaltestelle
      lunch: das Mittagessen
      toch: trotzdem / doch noch
  nl.a2.unit81.lesson06.teach.lotte_vraag:
    title: Lotte fragt nach dem Morgen
    gloss: 'Lotte: Hallo Noor, wie ist dein Morgen gelaufen?'
  nl.a2.unit81.lesson06.teach.noor_eerst:
    title: Noor nennt das erste Problem
    gloss: 'Noor: Nicht so gut. Zuerst bin ich zu spät aufgestanden.'
  nl.a2.unit81.lesson06.teach.lotte_daarna:
    title: Lotte fragt, was danach geschah
    gloss: 'Lotte: Oh nein! Und danach?'
  nl.a2.unit81.lesson06.teach.noor_tas:
    title: Noor nennt die nächsten Schritte
    gloss: 'Noor: Danach habe ich mich schnell angezogen, aber meine Tasche habe ich nicht mitgenommen.'
  nl.a2.unit81.lesson06.teach.lotte_reis:
    title: Lotte fragt nach dem Verkehrsmittel
    gloss: 'Lotte: Wie bist du zur Arbeit gekommen?'
  nl.a2.unit81.lesson06.teach.noor_aankomst:
    title: Noor beendet ihren Bericht
    gloss: 'Noor: Ich bin in den Bus eingestiegen. Schließlich bin ich doch noch pünktlich angekommen.'
  nl.a2.unit81.lesson06.teach.vraag:
    title: Eine Frage
    gloss: die Frage
    note: '*Een vraag stellen* bedeutet, eine Frage zu stellen.'
    example_gloss: Lotte stellt eine Frage zum Morgen.
