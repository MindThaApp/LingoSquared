teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: Anrufen
    gloss: anrufen
    note: Der Infinitiv des Verbs für „telefonisch anrufen“.
    example_gloss: Ich muss dich anrufen.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: Sagen, dass man anruft
    gloss: Ich rufe dich an.
    note: '*Bel* ist die ik-Form von *bellen*; das Niederländische verwendet hier wie das Deutsche das Präsens („Ich rufe dich an“) statt einer Zukunftsform.'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: Ans Telefon gehen
    gloss: Hallo, hier ist Lotte.
    note: '*Met* + Name (wörtlich „mit Name“) ist die übliche niederländische Art, sich am Telefon zu melden; im Deutschen sagt man dafür „Hier ist …“ oder einfach den Namen.'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: Omar meldet sich genauso
    gloss: Hallo, hier ist Omar.
    note: Dasselbe Muster *met* + Name wie in *Hallo, met Lotte*.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: Fragen, wer anruft
    gloss: Mit wem spreche ich?
    note: '*Met wie spreek ik?* ist die übliche höfliche Frage an einen unbekannten Anrufer.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: Sich förmlich melden
    gloss: Sie sprechen mit Lotte.
    note: '*U spreekt met* + Name ist das formelle Gegenstück zum informellen *met* + Name.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: '*Kun je* ...? (Kannst du ...?) plus *herhalen* (wiederholen) plus *dat* (das).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: Jemanden bitten, langsamer zu sprechen
    gloss: Sprich nicht so schnell, bitte.
    note: '*Niet zo* + Adjektiv verneint den Grad, nicht das Verb: nicht so schnell, nicht „sprich nicht“.'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: Sagen, dass man schlecht hört
    gloss: Ich kann dich nicht gut hören.
    note: '*Horen* (hören) mit *niet goed* (nicht gut) nennt ein Hörproblem und ist nicht dasselbe wie *verstaan* (verstehen).'
  nl.a1.unit22.lesson04.teach.sms:
    title: Textnachricht
    gloss: die Textnachricht
    note: 'Ein de-Wort: *de sms*, direkt aus der internationalen Abkürzung übernommen (wie „SMS“ im Deutschen).'
    example_gloss: Die SMS ist von Lotte.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: Sagen, dass man eine Nachricht schickt
    gloss: Ich schicke dir eine Nachricht.
    note: '*Sturen* (schicken) hat das indirekte Objekt (*je*) vor dem direkten Objekt (*een sms*).'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: Sagen, dass man zurückruft
    gloss: Ich rufe dich später zurück.
    note: '*Terug* (zurück) steht als trennbarer Verbzusatz am Ende; *bellen* + *terug* entspricht dem deutschen „zurückrufen“.'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: Einen Nachrichtenaustausch lesen
    gloss: 'Omar: Hallo Lotte, kannst du mich anrufen? Ich muss dir etwas erzählen. Lotte: Ja, natürlich, ich rufe dich in fünf Minuten zurück.'
    note: Achten Sie darauf, worum Omar bittet, warum und wann Lotte zurückruft.
    glosses:
      Hoi: hallo
      kun: kannst
      bellen: anrufen
      moet: müssen
      iets: etwas
      vertellen: erzählen
      natuurlijk: natürlich
      bel: anrufen
      vijf: fünf
      minuten: Minuten
      terug: zurück
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: Omar nimmt den Anruf an
    gloss: 'Omar: Hallo, hier ist Omar.'
    note: 'Dasselbe Muster *met* + Name aus Lektion 1, nun im echten Telefonat: Wer abhebt, spricht zuerst und nennt seinen Namen.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: Lotte nennt ihren Namen
    gloss: 'Lotte: Hallo Omar, hier ist Lotte. Omar: Schön, dass du anrufst!'
    note: '*Fijn dat* ... (schön/froh, dass ...) drückt eine positive Reaktion auf ein Ereignis aus.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: Lotte fragt nach der Schicht
    gloss: 'Lotte: Wie war deine erste Schicht?'
    note: '*Was* ist das Präteritum von *zijn* – eine andere Konstruktion als das Perfekt (hebben/zijn + Partizip, z. B. *Ik heb gewerkt*) aus Einheit 12; siehe die Notiz direkt nach der nächsten Zeile.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: Omar berichtet Gutes
    gloss: 'Omar: Es lief sehr gut, besser als ich dachte.'
    note: '*Ging* ist das Präteritum von *gaan* (gehen, hier „verlaufen“); *dacht* ist das Präteritum von *denken* (denken).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht sind Präteritumformen
    gloss: was → sein, ging → gehen, dacht → denken
    note: '*Was*, *ging* und *dacht* sind unregelmäßige Formen der einfachen Vergangenheit (verleden tijd). Das ist ein anderes, noch nicht systematisch behandeltes Muster als das Perfekt aus Unit 12 (hebben/zijn + Partizip). Merken Sie sich was, ging und dacht vorerst als feste Wendungen in den Zusammenhängen dieser Lektion. Die vollständigen Regeln zur Konjugation der einfachen Vergangenheit folgen auf einem späteren Niveau.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: Lotte ist stolz
    gloss: 'Lotte: Wie schön, das zu hören! Ich bin stolz auf dich.'
    note: '*Trots op* (stolz auf) ist eine feste Verbindung; *op* ist nötig, nicht *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: Omar ist gerührt
    gloss: 'Omar: Danke, das bedeutet mir viel.'
    note: '*Betekent* ist die Form der 3. Person von *betekenen* (bedeuten); *voor me* (für mich) drückt aus, wem es wichtig ist.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: Sein
    gloss: Seine erste Schicht ist sehr gut gelaufen.
    note: '*Zijn* ist hier das Possessivum „sein“, nicht das Verb „sein“ – der Zusammenhang unterscheidet die beiden gleich aussehenden Wörter.'
