course:
  title: Niederländisch A2
  description: 'Niederländisch auf gehobenem Grundstufenniveau für einen formellen Termin zur Anmeldung bei den örtlichen Behörden: Termin buchen, die erforderlichen Unterlagen verstehen und ein echtes Gespräch auf der gemeente führen.'
