teaching:
  nl.a2.unit24.lesson01.teach.inschrijven:
    title: Sich anmelden
    gloss: sich anmelden
    note: 'Ein reflexives trennbares Verb: zich inschrijven. Das Reflexivpronomen ändert sich mit dem Subjekt (me, je, zich, ...).'
    example_gloss: Ich möchte mich bei der Gemeinde anmelden.
  nl.a2.unit24.lesson01.teach.afspraak_maken:
    title: Um einen Termin bitten
    gloss: Ich möchte gern einen Termin vereinbaren, um mich anzumelden.
    note: 'Om ... te + Infinitiv drückt den Zweck aus (wie „um ... zu“ im Deutschen); bei me in te schrijven steht das Reflexivpronomen vor dem getrennten Verbteil: in te schrijven.'
  nl.a2.unit24.lesson01.teach.wanneer_tijd:
    title: Nach der Verfügbarkeit fragen
    gloss: Wann haben Sie Zeit?
    note: Eine direkte, praktische Art, nach Terminen zu fragen, mit der förmlichen Anrede u.
  nl.a2.unit24.lesson01.teach.zou_schikken:
    title: Der höfliche Konditional
    gloss: Würde Ihnen Mittwoch um zehn Uhr passen?
    note: Zou + Infinitiv ist der höfliche Konditional, weicher als eine direkte Aussage – ein Kennzeichen des formellen Registers auf A2.
  nl.a2.unit24.lesson01.teach.komt_goed_uit:
    title: Bestätigen, dass eine Uhrzeit passt
    gloss: Ja, das passt gut.
    note: Komt goed uit (wörtlich „kommt gut aus“) ist die natürliche Art zu bestätigen, dass ein vorgeschlagener Termin oder Plan passt.
  nl.a2.unit24.lesson02.teach.paspoort:
    title: Reisepass
    gloss: der Reisepass
    note: 'Ein Neutrum: het paspoort.'
    example_gloss: Haben Sie Ihren Reisepass dabei?
  nl.a2.unit24.lesson02.teach.huurcontract:
    title: Mietvertrag
    gloss: der Mietvertrag
    note: 'Ein Neutrum: het huurcontract, zusammengesetzt aus huren (mieten) und contract.'
    example_gloss: Haben Sie einen Mietvertrag?
  nl.a2.unit24.lesson02.teach.geboorteakte:
    title: Geburtsurkunde
    gloss: die Geburtsurkunde
    note: 'Ein Substantiv mit de-Artikel: de geboorteakte.'
    example_gloss: Muss ich auch meine Geburtsurkunde mitbringen?
  nl.a2.unit24.lesson02.teach.wat_heb_ik_nodig:
    title: Fragen, was erforderlich ist
    gloss: Was brauche ich, um mich anzumelden?
    note: Om ... te + Infinitiv drückt wieder den Zweck aus und greift das Muster aus Lektion 1 auf.
  nl.a2.unit24.lesson02.teach.paspoort_huurcontract:
    title: Anforderungen förmlich nennen
    gloss: Sie benötigen einen gültigen Reisepass und Ihren Mietvertrag.
    note: U heeft ... nodig (wörtlich „Sie haben ... nötig“) ist die übliche förmliche Art, eine Anforderung zu nennen.
  nl.a2.unit24.lesson02.teach.moet_ik_meenemen:
    title: Nach einem weiteren Dokument fragen
    gloss: Muss ich auch meine Geburtsurkunde mitbringen?
    note: Meenemen (mitbringen) ist ein trennbares Verb; hier steht es als Infinitiv nach moet am Ende der Frage.
  nl.a2.unit24.lesson03.teach.mag_ik_zien:
    title: Darum bitten, Dokumente zu sehen
    gloss: Darf ich Ihren Reisepass und Mietvertrag sehen?
    note: Mag ik ... zien? ist die übliche höfliche Art, wie Beamte darum bitten, Dokumente einzusehen.
  nl.a2.unit24.lesson03.teach.sinds_wanneer:
    title: Fragen, seit wann
    gloss: Seit wann wohnen Sie an dieser Adresse?
    note: Sinds wanneer (seit wann) ist eine förmliche, präzise Art, nach der Dauer zu fragen, häufig bei amtlichen Gesprächen.
  nl.a2.unit24.lesson03.teach.sinds_vorige_maand:
    title: Einen Anfangszeitpunkt nennen
    gloss: Ich wohne seit letztem Monat hier.
    note: Sinds + Zeitangabe nennt den Beginn eines noch andauernden Zustands, wie im Deutschen mit dem Präsens woon (nicht mit einer Vergangenheitsform), da das Wohnen noch andauert.
  nl.a2.unit24.lesson04.teach.bsn:
    title: BSN-Nummer
    gloss: die BSN-Nummer (Bürgerservicenummer)
    note: 'Ein Neutrum: het BSN-nummer, die niederländische persönliche Identifikationsnummer.'
    example_gloss: Was ist eine BSN-Nummer?
  nl.a2.unit24.lesson04.teach.wat_is_bsn:
    title: Fragen, was das BSN ist
    gloss: Was ist eine BSN-Nummer?
    note: Eine einfache Frage nach einer Definition, nützlich bei jedem unbekannten amtlichen Begriff.
  nl.a2.unit24.lesson04.teach.bsn_uitleg:
    title: Das BSN erklären
    gloss: Die BSN-Nummer ist Ihre persönliche Nummer bei den Behörden.
    note: Bij de overheid (bei den Behörden) gibt an, zu welcher Institution die Nummer gehört.
  nl.a2.unit24.lesson04.teach.nodig_voor:
    title: Die Verwendungszwecke aufzählen
    gloss: Sie brauchen sie für die Arbeit, die Bank und den Hausarzt.
    note: Nodig hebben voor (brauchen für) greift das Muster nodig hebben auf; voor leitet jeweils einen Verwendungszweck ein.
  nl.a2.unit24.lesson04.teach.digid:
    title: DigiD vorstellen
    gloss: Mit DigiD können Sie Angelegenheiten online erledigen.
    note: DigiD ist das niederländische digitale Identitätssystem für Behördendienste; zaken regelen („Angelegenheiten regeln“) ist eine gängige allgemeine Wendung für das Erledigen amtlicher Dinge.
  nl.a2.unit24.lesson05.teach.brief:
    title: Ein amtliches Schreiben zur Anmeldung lesen
    gloss: 'Um sich bei der Gemeinde anzumelden, benötigen Sie die folgenden Dokumente: einen gültigen Reisepass, Ihren Mietvertrag und, falls zutreffend, Ihre Geburtsurkunde. Vereinbaren Sie vorab einen Termin. Nach der Anmeldung erhalten Sie Ihre BSN-Nummer innerhalb weniger Tage per Post.'
    note: Achten Sie darauf, welche Dokumente erforderlich sind, was vorab zu tun ist und was danach geschieht.
    glosses:
      Om: Um ... zu (Om ... te drückt den Zweck aus)
      schrijven: anmelden (hier Teil des trennbaren Verbs „inschrijven“, getrennt als „in te schrijven“)
      gemeente: Gemeinde
      volgende: folgend / nächst
      documenten: Dokumente / Unterlagen
      nodig: nötig (heeft ... nodig = „braucht“)
      geldig: gültig
      paspoort: Reisepass
      huurcontract: Mietvertrag
      indien: falls (förmlich)
      toepassing: Anwendung / Zutreffen (indien van toepassing = „falls zutreffend“)
      geboorteakte: Geburtsurkunde
      Maak: machen / vereinbaren (Imperativ von „maken“)
      vooraf: vorab / im Voraus
      afspraak: Termin
      Na: nach
      inschrijving: Anmeldung
      ontvangt: erhalten (von „ontvangen“)
      binnen: innerhalb
      enkele: einige / mehrere
      BSN-nummer: BSN-Nummer (Bürgerservicenummer)
      post: Post
  nl.a2.unit24.lesson06.teach.ambtenaar_greet:
    title: Der Beamte begrüßt Omar
    gloss: 'Beamter: Guten Tag, wie kann ich Ihnen helfen?'
    note: Waarmee kan ik u helpen? ist die übliche förmliche Begrüßung im Service und setzt das u-Register aus früheren Lektionen mit Dienstleistungsgesprächen fort.
  nl.a2.unit24.lesson06.teach.omar_state_reason:
    title: Omar nennt seinen Grund
    gloss: 'Omar: Guten Tag, ich habe einen Termin, um mich an meiner neuen Adresse anzumelden.'
    note: Op mijn nieuwe adres (an meiner neuen Adresse) gibt an, um welche Anmeldung es geht.
  nl.a2.unit24.lesson06.teach.ambtenaar_ask_documents:
    title: Der Beamte bittet um die Dokumente
    gloss: 'Beamter: Darf ich bitte Ihren Reisepass und Ihren Mietvertrag sehen?'
    note: Greift das Muster mag ik ... zien? aus Lektion 3 auf, mit alstublieft für zusätzliche Höflichkeit.
  nl.a2.unit24.lesson06.teach.omar_hand_over:
    title: Omar reicht sie hin
    gloss: 'Omar: Bitte sehr. Ich wohne seit letztem Monat in Utrecht.'
    note: Entspricht der Angabe sinds vorige maand aus dem Lehrbeispiel in Lektion 3.
  nl.a2.unit24.lesson06.teach.ambtenaar_confirm:
    title: Der Beamte bestätigt
    gloss: 'Beamter: Danke Ihnen. Alles ist in Ordnung. Sie erhalten Ihre BSN-Nummer innerhalb weniger Tage per Post.'
    note: Alles is in orde (alles ist in Ordnung) ist eine übliche Bestätigung nach der Prüfung der Dokumente.
  nl.a2.unit24.lesson06.teach.omar_thanks:
    title: Omar bedankt sich beim Beamten
    gloss: 'Omar: Wunderbar, vielen Dank für Ihre Hilfe!'
    note: Voor uw hulp (für Ihre Hilfe) beschließt das förmliche Gespräch höflich.
  nl.a2.unit24.lesson06.teach.summary_grammar:
    title: Den Besuch zusammenfassen
    gloss: Omar hat sich bei der gemeente angemeldet. Er erhält seine BSN-Nummer per Post.
    note: Heeft ... ingeschreven ist das Perfekt von zich inschrijven (ingeschreven ist das Partizip Perfekt); zijn bedeutet hier „sein“ als Possessivpronomen, nicht das Verb „sein“.
