  nl.a2.unit105.lesson06.lotte_en_omar_bellen:
    title: Lotte und Omar am Telefon
teaching:
  nl.a2.unit105.lesson01.teach.huishouden:
    title: Hausarbeit
    gloss: kochen / abwaschen / putzen / die Wäsche / machen
    note: '*De was doen* bedeutet „die Wäsche machen“; *doen* ist das Verb in *wat ben je aan het doen?*'
    example_gloss:
    - Omar kann gut kochen.
    - Ich werde abwaschen.
    - Noor wird putzen.
  nl.a2.unit105.lesson01.teach.telefoon:
    title: Telefon und Freizeit
    gloss: anrufen / lesen / schlafen / das Telefon / mit / mein / Mutter / Schwester
    note: '*Bellen* bedeutet, jemanden anzurufen; mit *met* sagen Sie, mit wem man spricht.'
    example_gloss:
    - Lotte telefoniert mit ihrer Mutter.
    - Ich habe ein Buch gelesen.
    - Meine Schwester schläft.
  nl.a2.unit105.lesson01.teach.wie:
    title: Personen, jetzt und zu Hause
    gloss: ich / du (betont) / du / er / sie / was / jetzt / zu Hause / Lotte / Omar / Noor
    note: '*Jij* ist die betonte Form von *je*; beide bedeuten „du“ gegenüber einem Freund.'
    example_gloss:
    - Ich bin zu Hause.
    - Er ist jetzt zu Hause.
    - Was macht Noor?
  nl.a2.unit105.lesson01.teach.aanhet:
    title: Aan het + Infinitiv
    gloss: Ich bin gerade am Kochen. Ich telefoniere gerade. Ich bin gerade am Lesen.
    note: Mit *zijn* + *aan het* + Infinitiv drücken Sie aus, dass Sie gerade mitten in etwas sind. Der Infinitiv steht am Ende.
  nl.a2.unit105.lesson01.teach.vraag:
    title: Fragen, was jemand gerade macht
    gloss: Was machst du gerade? Ich koche gerade.
    note: 'In der Frage steht das Verb vor dem Subjekt: *ben je*. Im Aussagesatz lautet die Reihenfolge *je bent*.'
  nl.a2.unit105.lesson02.teach.zijn:
    title: Das Verb zijn
    gloss: Ich bin am Kochen. Du bist am Lesen. Er telefoniert gerade. Wir sind am Abwaschen. Kochst du gerade? Ja, ich koche gerade.
    note: '*Zijn* verändert sich mit dem Subjekt: *ben, bent, is, zijn*. In einer Frage mit *je* fällt das t weg: *ben je*.'
  nl.a2.unit105.lesson02.teach.eten:
    title: Essen und Küche
    gloss: das Essen / die Suppe / die Küche / das schmutzige Geschirr / machen
    note: '*De afwas doen* ist die übliche Wendung für „das Geschirr spülen“.'
    example_gloss:
    - Das Essen ist fertig.
    - Die Suppe ist heiß.
    - Ich mache Tee.
  nl.a2.unit105.lesson02.teach.object:
    title: Objekt vor aan het
    gloss: Ich mache gerade die Wäsche. Omar macht gerade Suppe. Noor putzt gerade die Küche.
    note: 'Das Objekt steht zwischen der Form von *zijn* und *aan het*: *ik ben de was aan het doen*. *Aan het* + Infinitiv bleiben am Ende zusammen.'
  nl.a2.unit105.lesson02.teach.moeder:
    title: Jemanden anrufen
    gloss: Lotte ruft gerade ihre Mutter an. Wir kochen gerade das Essen. Du spülst gerade das Geschirr.
    note: 'Bei *bellen* ist die angerufene Person das Objekt: *haar moeder aan het bellen*.'
  nl.a2.unit105.lesson03.teach.tijd:
    title: Wann?
    gloss: jeden Tag / oft / im Moment / jeden Samstag / jetzt
    note: '*Elke dag, vaak* und *elke zaterdag* weisen auf eine Gewohnheit hin. *Nu* und *op dit moment* weisen auf den gegenwärtigen Augenblick hin.'
    example_gloss:
    - Jeder Tag ist anders.
    - Es ist oft viel los.
    - Im Moment ist es ruhig.
  nl.a2.unit105.lesson03.teach.presens:
    title: Das einfache Präsens
    gloss: Ich koche jeden Tag. Er kocht jeden Tag. Ich rufe oft an. Er ruft oft an. Ich mache die Wäsche. Er macht die Wäsche.
    note: Das einfache Präsens (*ik kook, hij kookt*) steht für Gewohnheiten und Tatsachen. Bei *hij/ze/het* kommt die Endung -t hinzu, ebenso bei *jij/je*, wenn es vor dem Verb steht (*jij kookt*).
  nl.a2.unit105.lesson03.teach.contrast:
    title: Gewohnheit oder gerade jetzt?
    gloss: Ich koche jeden Tag. Jetzt bin ich am Kochen. Lotte ruft oft ihre Mutter an. Jetzt ruft sie gerade ihre Mutter an.
    note: 'Einfaches Präsens: was regelmäßig geschieht. *Zijn* + *aan het* + Infinitiv: was gerade in diesem Moment geschieht.'
  nl.a2.unit105.lesson03.teach.nu_voorop:
    title: Nu am Satzanfang
    gloss: Jetzt mache ich gerade die Wäsche. Im Moment kocht Omar gerade.
    note: 'Steht *nu* oder *op dit moment* am Satzanfang, bleibt das Verb an zweiter Stelle: *nu ben ik*. Beide Stellungen sind möglich: *ik ben nu de was aan het doen*.'
  nl.a2.unit105.lesson04.teach.plekken:
    title: Orte und Dinge
    gloss: das Sofa / die Zeitung / das Bett / im Bett / der Garten
    note: '*Op de bank* = auf dem Sofa; *in bed* = im Bett.'
    example_gloss:
    - Das Sofa ist groß.
    - Er liest die Zeitung.
    - Der Garten ist schön.
  nl.a2.unit105.lesson04.teach.houdingen:
    title: Verben der Körperhaltung
    gloss: sitzen / stehen / liegen / laufen / warten
    note: 'Diese Verben zeigen, wie jemand etwas tut: sitzend, stehend, liegend oder gehend.'
    example_gloss:
    - Ich möchte sitzen.
    - Sie möchte stehen.
    - Er muss warten.
  nl.a2.unit105.lesson04.teach.te:
    title: Zitten, staan, liggen, lopen + te
    gloss: Er sitzt und telefoniert. Sie steht und kocht. Er liegt und schläft. Sie läuft herum und telefoniert.
    note: Mit *zit / staat / ligt / loopt* + *te* + Infinitiv sagen Sie, was jemand im Sitzen, Stehen, Liegen oder Gehen tut. Im gesprochenen Niederländisch ist das sehr häufig. Im Deutschen drückt man das meist mit zwei Verben aus (z. B. „er sitzt und telefoniert“).
  nl.a2.unit105.lesson04.teach.object_te:
    title: Objekt und Ort vor te
    gloss: Er sitzt und liest die Zeitung. Omar steht in der Küche und macht Suppe. Lotte sitzt auf dem Sofa und liest.
    note: 'Objekte und Ortsangaben stehen vor *te*; der Infinitiv steht ganz am Ende. Das konjugierte Verb bleibt an zweiter Stelle: *Hij zit ... te lezen.*'
  nl.a2.unit105.lesson04.teach.vergelijk:
    title: Aan het oder zitten te
    gloss: Er liest gerade. Er sitzt und liest. Sie kocht gerade. Sie steht und kocht.
    note: Beide Formen sagen, dass etwas gerade im Gang ist. *Zit/staat/ligt/loopt te* zeigt zusätzlich die Körperhaltung; wählen Sie also das Verb, das zu dem passt, was die Person wirklich tut.
  nl.a2.unit105.lesson05.teach.reading:
    title: Omars Nachricht an Lotte
    gloss: Hallo Lotte! Ich bin zu Hause. Ich mache gerade Suppe. Meine Schwester sitzt auf dem Sofa und telefoniert mit meiner Mutter. Noor spült gerade das Geschirr. Und du? Was machst du gerade?
    note: Finden Sie heraus, wer gerade was macht.
    glosses:
      zus: Schwester
      moeder: Mutter
      afwas: schmutziges Geschirr
      soep: Suppe
      bank: Sofa
  nl.a2.unit105.lesson06.teach.beurt1:
    title: Lotte fragt Omar
    gloss: 'Lotte: Hallo Omar, was machst du gerade?'
  nl.a2.unit105.lesson06.teach.beurt2:
    title: Omar antwortet und fragt zurück
    gloss: 'Omar: Ich mache gerade Suppe. Und du?'
  nl.a2.unit105.lesson06.teach.beurt3:
    title: Lotte antwortet
    gloss: 'Lotte: Ich mache gerade die Wäsche.'
  nl.a2.unit105.lesson06.teach.beurt4:
    title: Omar fragt nach Noor
    gloss: 'Omar: Und was macht Noor gerade?'
  nl.a2.unit105.lesson06.teach.beurt5:
    title: Lotte beschreibt Noor
    gloss: 'Lotte: Noor sitzt auf dem Sofa und telefoniert.'
