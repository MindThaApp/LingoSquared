course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um zu beschreiben, was gerade passiert.
  learning_goal: Sagen Sie, was Sie oder jemand anderes gerade tut, mit aan het + Infinitiv und zitten/staan/liggen/lopen te.
units:
  nl.a2.unit105.ik_ben_aan_het_koken:
    title: Ich koche gerade
    description: 'Sagen Sie, was gerade passiert: aan het + Infinitiv sowie sitzen, stehen, liegen oder gehen und dabei etwas tun.'
lessons:
  nl.a2.unit105.lesson01.wat_ben_je_aan_het_doen:
