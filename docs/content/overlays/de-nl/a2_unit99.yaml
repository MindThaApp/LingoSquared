course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch auf A2-Niveau zum Vergleichen und Auswählen zwischen Optionen.
  learning_goal: Mehrere Optionen vergleichen und die beste auswählen mit -er, -st, meer, het meest, even ... als und niet zo ... als.
units:
  nl.a2.unit99.de_beste_en_meest:
    title: Der Beste, der Billigste, der Meiste
    description: Wohnungen, Handys und Urlaube vergleichen und sagen, welches das beste ist.
lessons:
  nl.a2.unit99.lesson01.groter_dan:
    title: Größer als
  nl.a2.unit99.lesson02.het_grootste:
    title: Der Größte
  nl.a2.unit99.lesson03.even_en_niet_zo:
    title: Genauso ... wie und nicht so ... wie
  nl.a2.unit99.lesson04.meer_en_meest:
    title: Mehr und am meisten
  nl.a2.unit99.lesson05.noor_kiest_een_hotel:
    title: Noor wählt ein Hotel
  nl.a2.unit99.lesson06.een_telefoon_kiezen:
    title: Ein Handy auswählen
teaching:
  nl.a2.unit99.lesson01.teach.eigenschappen:
    title: Eigenschaftswörter
    gloss: groß / klein / schön / teuer / billig / lang
    note: Diese sechs Adjektive sind die Grundlage für jeden Vergleich in dieser Einheit.
    example_gloss:
    - Das Haus ist groß und schön.
    - Das Handy ist teuer, aber das Hotel ist billig.
    - Die Reise ist lang und das Zimmer ist klein.
  nl.a2.unit99.lesson01.teach.wonen:
    title: Wohnen
    gloss: das Haus / die Wohnung / das Zimmer / die Küche / der Garten
    note: Wörter zum Wohnen kennen Sie schon aus dem ersten Kurs; hier sind sie die Dinge, die wir vergleichen.
    example_gloss:
    - Das Haus hat einen Garten.
    - Die Küche ist in der Wohnung.
    - Das Zimmer ist klein.
  nl.a2.unit99.lesson01.teach.telefoon:
    title: Telefone
    gloss: das Telefon / der Akku / die Kamera
    note: Wörter rund ums Telefon, um Modelle zu vergleichen. *Goed* heißt „gut“.
    example_gloss:
    - Mein Telefon hat eine Kamera.
    - Der Akku ist gut.
    - Ich habe ein Handy.
  nl.a2.unit99.lesson01.teach.vakantie:
    title: Urlaub
    gloss: der Urlaub / das Hotel / der Strand / die Stadt / die Reise
    note: Reisewörter aus dem ersten Kurs, hier zum Vergleichen von Urlaubsmöglichkeiten verwendet.
    example_gloss:
    - Das Hotel ist in der Nähe des Strandes.
    - Der Urlaub ist lang.
    - Die Stadt ist groß.
  nl.a2.unit99.lesson01.teach.gn_groter:
    title: 'Der Komparativ: -er anhängen'
    gloss: groß, größer; klein, kleiner; schön, schöner; teuer, teurer; billig, billiger; lang, länger
    note: 'Man hängt -er an das Adjektiv an. Achten Sie auf die Schreibung: *groot* verliert ein o (*groter*), *goedkoop* verliert ein o (*goedkoper*), und bei *duur* kommt vor dem -er ein d dazu (*duurder*). *Mooi* wird einfach zu *mooier*.'
  nl.a2.unit99.lesson01.teach.gn_dan:
    title: Vergleichen mit dan
    gloss: Das Haus ist größer als die Wohnung. Mein Zimmer ist kleiner als dein Zimmer.
    note: Nach einem Komparativ (der Form auf -er) folgt das, womit man vergleicht, nach *dan* („als“).
  nl.a2.unit99.lesson01.teach.zin_duurder:
    title: Ein Telefonvergleich
    gloss: Mein Handy ist teurer als dein Handy.
    note: '*Mijn* heißt „mein“, *jouw* heißt „dein“. In der Alltagssprache wird *jouw* oft zum unbetonten *je*: *je telefoon*.'
  nl.a2.unit99.lesson02.teach.kiezen:
    title: Wörter zum Auswählen
    gloss: welche / diese (de-Wort) / dieses (het-Wort) / jene / von allen
    note: '*Deze* steht bei de-Wörtern im Singular (deze telefoon) und im Plural, *dit* bei het-Wörtern im Singular (dit hotel). *Die* bedeutet „jene/dieser dort“ (die telefoon).'
    example_gloss:
    - Welches Telefon ist teuer?
    - Dieses Telefon ist teuer, und jenes Telefon ist billig.
    - Dieses Hotel ist schön, und jenes Telefon ist teuer.
  nl.a2.unit99.lesson02.teach.gn_superlatief:
    title: 'Der Superlativ: het + Adjektiv + -st'
    gloss: groß, am größten; klein, am kleinsten; schön, am schönsten; teuer, am teuersten; billig, am billigsten; lang, am längsten
    note: 'Nach *is* steht *het*, und man hängt -st an. Die Schreibänderungen der -er-Form entfallen: Der doppelte Vokal bleibt (*het grootst*, *het goedkoopst*).'
  nl.a2.unit99.lesson02.teach.gn_superlatief_e:
    title: 'Der Superlativ vor einem Nomen: -ste'
    gloss: Das ist das teuerste Telefon. Das ist das kleinste Haus. Das ist das billigste Zimmer. Das ist der schönste Garten.
    note: 'Vor einem Nomen hängt man -ste an: *de duurste telefoon*, *het kleinste huis*. Nach *is* ohne Nomen sind sowohl *het goedkoopst* als auch *het goedkoopste* möglich.'
  nl.a2.unit99.lesson02.teach.gn_onregelmatig:
    title: 'Unregelmäßig: goed und veel'
    gloss: gut, besser, am besten; viel, mehr, am meisten. Mein Telefon ist besser als dein Telefon. Das ist die beste Kamera. Dieses Hotel hat die meisten Zimmer.
    note: '*Goed* und *veel* folgen nicht der Regel: *goed - beter - best* und *veel - meer - meest*. Vor einem Nomen endet die Form auf -e: *de beste camera*, *de meeste kamers* (bei einem het-Wort: *het beste huis*).'
  nl.a2.unit99.lesson02.teach.zin_goedkoopst:
    title: Von allen Hotels
    gloss: Von allen Hotels ist dieses Hotel das billigste.
    note: '*Van alle* nennt die Gruppe, aus der man auswählt.'
  nl.a2.unit99.lesson03.teach.gelijk:
    title: Gleich und nicht gleich
    gloss: genauso / nicht so / wie
    note: '*Even ... als* sagt, dass zwei Dinge gleich sind; *niet zo ... als* sagt, dass das erste weniger ist.'
    example_gloss:
    - Mein Haus ist genauso groß wie dein Haus.
    - Das Hotel ist nicht so teuer wie die Wohnung.
    - Die Küche ist genauso schön wie der Garten.
  nl.a2.unit99.lesson03.teach.gn_even:
    title: 'Gleichheit: even ... als'
    gloss: Mein Telefon ist genauso teuer wie dein Telefon.
    note: 'Zwischen *even* und *als* steht die Grundform des Adjektivs (ohne -er): *even duur als*.'
  nl.a2.unit99.lesson03.teach.gn_niet_zo:
    title: 'Weniger: niet zo ... als'
    gloss: Das Hotel ist nicht so groß wie die Wohnung.
    note: 'Wieder steht die Grundform: *niet zo groot als*. Das zweite ist größer.'
  nl.a2.unit99.lesson03.teach.gn_dan_als:
    title: Dan oder als?
    gloss: Das Hotel ist billiger als die Wohnung. Das Hotel ist genauso billig wie die Wohnung.
    note: 'Der Komparativ (auf -er) steht mit *dan*. *Even* und *niet zo* stehen mit der Grundform und *als*. Mischen Sie die beiden nie: nicht *even goedkoper als*.'
  nl.a2.unit99.lesson04.teach.lange_woorden:
    title: Längere Adjektive
    gloss: interessant / praktisch / modern / bequem
    note: Diese längeren Adjektive bilden ihre Steigerung meist mit *meer* und *het meest*.
    example_gloss:
    - Die Reise in die Stadt ist interessant.
    - Das Telefon ist praktisch.
    - Die Wohnung ist modern und bequem.
  nl.a2.unit99.lesson04.teach.gn_meer:
    title: 'Lange Adjektive: meer und het meest'
    gloss: interessant, interessanter, am interessantesten; modern, moderner, am modernsten
    note: Bei längeren Adjektiven setzt man *meer* („mehr“) oder *het meest* („am meisten“) vor das unveränderte Adjektiv. Das ist das Muster, das hier gelernt wird; Formen wie *interessanter* kommen im alltäglichen Niederländisch aber auch vor.
  nl.a2.unit99.lesson04.teach.gn_kort_lang:
    title: Kurz oder lang?
    gloss: 'Kurz: teuer, teurer, am teuersten. Lang: bequem, bequemer, am bequemsten.'
    note: Kurze Adjektive bilden die Steigerung mit -er und -st. Längere Adjektive, besonders solche auf -ant, -isch, -eel oder -abel, bilden sie meist mit *meer* und *het meest*. Beide Muster verwenden nach dem Komparativ weiterhin *dan*.
  nl.a2.unit99.lesson04.teach.zin_comfortabel:
    title: Ein Hotel auswählen
    gloss: Welches Hotel ist am bequemsten? Dieses Hotel ist am bequemsten, aber es ist auch am teuersten.
    note: '*Welk* steht bei het-Wörtern im Singular (welk hotel); *welke* steht bei de-Wörtern und bei allen Pluralen.'
  nl.a2.unit99.lesson05.teach.reading:
    title: Noors Hotelsuche
    gloss: Noor sucht ein Hotel für ihren Urlaub. Hotel Strand ist am teuersten, aber auch am schönsten. Hotel Stad ist billiger als Hotel Strand, aber nicht so bequem wie Hotel Strand. Hotel Tuin ist genauso billig wie Hotel Stad. Noor wählt Hotel Tuin, weil die Zimmer größer sind.
    note: Achten Sie darauf, wie die drei Hotels miteinander verglichen werden.
    glosses:
      zoekt: sucht
      voor: für
      haar: ihr
      kiest: wählt
      want: denn, weil
      kamers: Zimmer
      zijn: sind
  nl.a2.unit99.lesson06.teach.beurt01:
    title: Lotte fragt nach einer Meinung
    gloss: 'Lotte: Hallo Omar, welches Telefon findest du am besten?'
  nl.a2.unit99.lesson06.teach.beurt02:
    title: Omar nennt einen Vorteil und einen Nachteil
    gloss: 'Omar: Dieses Telefon hat die beste Kamera, aber es ist auch das teuerste.'
  nl.a2.unit99.lesson06.teach.beurt03:
    title: Lotte schlägt ein billigeres Telefon vor
    gloss: 'Lotte: Jenes Telefon ist billiger als dieses, und der Akku ist genauso gut.'
  nl.a2.unit99.lesson06.teach.beurt04:
    title: Omar fragt nach dem Aussehen
    gloss: 'Omar: Ist jenes Telefon auch so schön wie dieses?'
  nl.a2.unit99.lesson06.teach.beurt05:
    title: Lotte antwortet
    gloss: 'Lotte: Nein, es ist nicht so schön wie dieses, aber es ist viel billiger.'
  nl.a2.unit99.lesson06.teach.beurt06:
    title: Omar entscheidet sich
    gloss: 'Omar: Gut, ich nehme jenes Telefon.'
