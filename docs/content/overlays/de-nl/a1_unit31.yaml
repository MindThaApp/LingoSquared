teaching:
  nl.a1.unit31.lesson01.teach.dier_huisdier:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Dier* ist das allgemeine Wort für Tier; *huisdier* (wörtlich „Haus-Tier“) bedeutet speziell Haustier.'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  nl.a1.unit31.lesson01.teach.hond_kat:
    title: Hund und Katze
