    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: Dasselbe Fragemuster *Heb je ...?*, das Sie aus früheren Units schon kennen.
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: '*Geen* verneint das unbestimmte Substantiv *een huisdier*. Siehe die Grammatikkarte.'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: 'Geen: ein unbestimmtes Nomen verneinen'
    gloss: Geen verneint ein unbestimmtes Nomen, wie in Ik heb geen tijd (das kennen Sie schon) und hier Ik heb geen huisdier.
    note: Greift genau das *geen*-Muster auf, das schon bei *Ik heb geen tijd* gelernt wurde. Es ist keine neue Grammatik, sondern nur ein neues Substantiv dazu.
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: Ein trennbares Verb – siehe Grammatikhinweis.
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  nl.a1.unit31.lesson02.teach.separable_note:
    title: Uitlaten ist trennbar
    gloss: 'Uitlaten ist trennbar, genau wie opstaan und aankleden aus einer früheren Lektion: ik laat de hond uit.'
    note: Es gilt dasselbe Muster für trennbare Verben (Stamm + ... + Vorsilbe am Ende) wie bei den Verben des Tagesablaufs. Das kennen Sie auch aus dem Deutschen.
  nl.a1.unit31.lesson02.teach.eten_geven:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  nl.a1.unit31.lesson02.teach.spelen_met:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Sander spielt mit seiner Katze.
  nl.a1.unit31.lesson02.teach.uitlaten_phrase:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: Verbindet *uitlaten* mit *elke dag* (jeden Tag), das aus einer früheren Unit schon bekannt ist.
  nl.a1.unit31.lesson02.teach.eten_phrase:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: Verbindet *eten geven* mit *elke dag*.
  nl.a1.unit31.lesson03.teach.meervoud_note:
    title: 'Plural: hond -> honden'
    gloss: 'Plural auf -en: hond -> honden, dier -> dieren. Nach kurzem Vokal wird der Konsonant verdoppelt: kat -> katten.'
    note: Das regelmäßige niederländische Pluralmuster, das hier zum ersten Mal mit Tiernamen als Beispielen vorgestellt wird.
  nl.a1.unit31.lesson03.teach.honden_katten:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
