    gloss: 'Lotte: Ja, ich habe einen Hund.'
  nl.a1.unit31.lesson04.teach.omar_hoe_ziet_eruit:
    title: Omar fragt, wie er aussieht
    gloss: 'Omar: Wie sieht er aus?'
    note: Greift die Frage *Hoe ziet ... eruit?* aus einer früheren Unit zum Aussehen auf, hier über ein Tier gestellt.
  nl.a1.unit31.lesson04.teach.lotte_beschrijft:
    title: Lotte beschreibt ihren Hund
    gloss: 'Lotte: Er hat braunes Fell und er ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  nl.a1.unit31.lesson04.teach.pronoun_note:
    title: Hij/hem für Tiere
    gloss: Hij (er) und hem (ihn) kann man auch für ein Tier verwenden, nicht nur für eine Person.
    note: In diesem Kurs bezogen sich hij/hem bisher immer auf Personen – hier wird ausdrücklich gezeigt, dass man sie auch für Tiere verwendet.
  nl.a1.unit31.lesson04.teach.omar_laat_je_uit:
    title: Omar fragt nach dem Gassigehen
    gloss: 'Omar: Gehst du jeden Tag mit ihm Gassi?'
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg:
    title: Lotte beschreibt ihre Routine
    gloss: 'Lotte: Ja, ich gehe jeden Tag mit ihm Gassi und ich füttere ihn.'
  nl.a1.unit31.lesson05.teach.tekst:
    title: Omar, Fenna und Sander über Tiere
    gloss: 'Omar und Fenna lieben beide Tiere, aber keiner von beiden hat ein Haustier. Omar liebt Hunde und Fenna liebt Katzen. Sander hat dagegen ein Haustier: eine Katze. Er spielt oft mit seiner Katze und füttert sie jeden Tag. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      houden: lieben
      allebei: beide
      dieren: Tiere
      beiden: beide
      huisdier: Haustier
      honden: Hunde
      katten: Katzen
      kat: Katze
      speelt: spielt
      geeft: gibt
      elke: jeder
      eten: Futter
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: Sander spielt oft mit seiner Katze
    gloss: Sander spielt oft mit seiner Katze.
    note: Greift *vaak* (oft) auf, das schon für Omars Alltagsroutinen in einer früheren Unit eingeführt wurde.
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
    title: Lotte fragt Nina
    gloss: 'Lotte: Nina, hast du auch ein Haustier?'
  nl.a1.unit31.lesson06.teach.nina_ja_vogel:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*Heet* (heißt) greift das Verb zum Vorstellen aus der allerersten Unit auf.'
  nl.a1.unit31.lesson06.teach.omar_wat_leuk:
    title: Omar reagiert
    gloss: 'Omar: Wie schön! Was machst du jeden Tag mit ihm?'
  nl.a1.unit31.lesson06.teach.nina_geeft_eten:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  nl.a1.unit31.lesson06.teach.omar_houd_ook:
