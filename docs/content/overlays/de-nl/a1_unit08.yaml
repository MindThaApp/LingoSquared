  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: Bahnhof, Supermarkt, Bibliothek, Krankenhaus
    gloss: der Bahnhof, der Supermarkt, die Bibliothek, das Krankenhaus
    note: 'Verwenden Sie *het* mit *station*: *het station*. Niederländisch schreibt *supermarkt* in einem Wort: *de supermarkt*. Verwenden Sie *de* mit *bibliotheek*: *de bibliotheek*. Niederländisch schreibt *ziekenhuis* in einem Wort: *het ziekenhuis*.'
    example_gloss:
    - Wo ist der Bahnhof?
    - Der Supermarkt ist neben dem Bahnhof.
    - Die Bibliothek ist gegenüber dem Bahnhof.
    - Das Krankenhaus ist hinter der Bibliothek.
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: Bank, Postamt, Bushaltestelle
    gloss: die Bank, das Postamt, die Bushaltestelle
    note: 'Für die Bank als Geldinstitut verwendet man *de bank*. *Postkantoor* wird in einem Wort geschrieben – mit *het*: *het postkantoor*. *Bushalte* wird in einem Wort geschrieben – mit *de*: *de bushalte*.'
    example_gloss:
    - Die Bank ist neben dem Supermarkt.
    - Das Postamt liegt zwischen der Bibliothek und dem Krankenhaus.
    - Die Bushaltestelle ist vor dem Bahnhof.
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: Neben, gegenüber
    gloss: neben, gegenüber
    note: '*Naast* setzt eine Sache direkt neben eine andere. *Tegenover* besagt, dass zwei Orte einander gegenüberliegen, oft auf beiden Seiten einer Straße oder eines freien Platzes.'
    example_gloss:
    - Die Bank ist neben dem Supermarkt.
    - Die Bibliothek ist gegenüber dem Bahnhof.
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: Der Supermarkt ist neben dem Bahnhof
    gloss: Der Supermarkt ist neben dem Bahnhof.
    note: '*Naast* bedeutet direkt neben: *De supermarkt is naast het station*.'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: Die Bibliothek ist gegenüber dem Bahnhof
    gloss: Die Bibliothek ist gegenüber dem Bahnhof.
    note: 'Behalten Sie *het* bei *station*: *tegenover het station*.'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: Hinter, vor
    gloss: hinter, vor
    note: '*Achter* gibt an, dass ein Ort hinter einem anderen liegt. Hier bedeutet *voor* „vor“ – in anderen Sätzen kann es etwas anderes bedeuten.'
    example_gloss:
