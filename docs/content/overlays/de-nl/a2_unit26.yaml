  nl.a2.unit26.lesson01.teach.bankrekening:
    title: Bankkonto
    gloss: das Bankkonto
    note: 'Ein Substantiv mit de-Artikel: de bankrekening, zusammengesetzt aus bank (Bank) und rekening (Konto).'
    example_gloss: Ich möchte gern ein Bankkonto eröffnen.
  nl.a2.unit26.lesson01.teach.rekening_openen:
    title: Die Eröffnung eines Kontos beantragen
    gloss: Ich möchte gern ein Bankkonto eröffnen.
    note: Wil graag macht die Bitte höflicher; dieses Muster begegnet Ihnen in diesem Kurs immer wieder.
  nl.a2.unit26.lesson01.teach.welke_rekening:
    title: Der Mitarbeiter fragt nach der Art
    gloss: Was für ein Konto möchten Sie eröffnen?
    note: Wat voor + Substantiv fragt „was für ein“; der Infinitiv openen steht nach dem Modalverb wilt am Satzende.
  nl.a2.unit26.lesson02.teach.betaalrekening:
    title: Girokonto
    gloss: das Girokonto
    note: 'Ein Substantiv mit de-Artikel: de betaalrekening, das übliche Girokonto für den Alltag in den Niederlanden.'
    example_gloss: Ich möchte gern ein Girokonto für mein Gehalt.
  nl.a2.unit26.lesson02.teach.salaris:
    title: Gehalt
    gloss: das Gehalt
    note: 'Ein Substantiv mit het-Artikel: het salaris.'
    example_gloss: Ihr Arbeitgeber überweist Ihr Gehalt auf dieses Konto.
  nl.a2.unit26.lesson02.teach.betaalrekening_salaris:
    title: Den Zweck des Kontos nennen
    gloss: Ich möchte gern ein Girokonto für mein Gehalt.
    note: Voor mijn salaris gibt den Zweck des Kontos an.
  nl.a2.unit26.lesson02.teach.werkgever_stort:
    title: Wie das Gehalt ankommt
    gloss: Ihr Arbeitgeber überweist Ihr Gehalt auf dieses Konto.
    note: Storten (einzahlen, überweisen) ist das übliche Verb für die Überweisung von Geld; op deze rekening nennt das Zielkonto.
  nl.a2.unit26.lesson02.teach.storten_infinitive:
    title: Die Infinitivform
    gloss: Storten ist der Infinitiv von stort.
    note: Die Grundform (Infinitiv), anders als die konjugierte Form der 3. Person im Satz oben.
  nl.a2.unit26.lesson03.teach.identiteitsbewijs:
    title: Ausweis
    gloss: der Ausweis
    note: 'Ein Substantiv mit het-Artikel: het identiteitsbewijs, der allgemeine niederländische Begriff für Reisepass oder Personalausweis.'
    example_gloss: Haben Sie Ihre BSN-Nummer und einen gültigen Ausweis dabei?
  nl.a2.unit26.lesson03.teach.bsn_nodig:
    title: Der Mitarbeiter fragt nach den Unterlagen
    gloss: Haben Sie Ihre BSN-Nummer und einen gültigen Ausweis dabei?
    note: Bij zich hebben (etwas dabeihaben) greift das formelle Muster vom Gemeindebesuch in Lektion 24 wieder auf.
  nl.a2.unit26.lesson03.teach.hier_is:
    title: Unterlagen übergeben
    gloss: Ja, hier sind mein Reisepass und meine BSN-Nummer.
    note: Hier is (hier ist) ist die natürliche Art, im Niederländischen etwas zu überreichen.
  nl.a2.unit26.lesson04.teach.bankpas:
    title: Bankkarte
    gloss: die Bankkarte
    note: 'Ein Substantiv mit de-Artikel: de bankpas, die niederländische Debitkarte.'
    example_gloss: Sie erhalten Ihre Bankkarte innerhalb einer Woche per Post.
  nl.a2.unit26.lesson04.teach.bankpas_uitleg:
    title: Die Zustellung der Karte erklären
    gloss: Sie erhalten Ihre Bankkarte innerhalb einer Woche per Post.
    note: Binnen een week (innerhalb einer Woche) nennt den Zeitrahmen; das Muster ontvangt ... per post kennen Sie aus der BSN-Nummer in Lektion 24.
  nl.a2.unit26.lesson04.teach.mobiel_bankieren:
    title: Mobile Banking vorstellen
    gloss: Mit der App können Sie auch mobil Bankgeschäfte erledigen.
    note: Mobiel bankieren (Mobile Banking) ist der übliche niederländische Begriff für Bankgeschäfte über eine Smartphone-App.
  nl.a2.unit26.lesson05.teach.folder:
    title: Eine Broschüre zum Bankkonto lesen
    gloss: Um ein Girokonto zu eröffnen, brauchen Sie einen gültigen Ausweis und Ihre BSN-Nummer. Ihr Arbeitgeber nutzt dieses Konto, um Ihr Gehalt zu überweisen. Nach der Eröffnung erhalten Sie innerhalb einer Woche eine Bankkarte per Post.
    note: Achten Sie auf die erforderlichen Unterlagen, den Zweck des Kontos und darauf, wann die Karte ankommt.
    glosses:
      betaalrekening: Girokonto
      openen: eröffnen
      heeft: 'haben (formell: „heeft u ... nodig“ = Sie brauchen)'
      geldig: gültig
      identiteitsbewijs: Ausweis
      BSN-nummer: Bürgerservicenummer (niederländische Sozial-/Steuernummer)
      nodig: nötig („nodig hebben“ = brauchen)
      werkgever: Arbeitgeber
      gebruikt: benutzt (3. Person von gebruiken)
      rekening: Konto
      salaris: Gehalt
      storten: einzahlen (Geld überweisen)
      opening: Eröffnung (des Kontos)
      ontvangt: 'erhalten (formell: „u ontvangt“ = Sie erhalten)'
      binnen: innerhalb
      week: Woche
      bankpas: Bankkarte / Debitkarte
      post: Post („per post“ = per Post)
  nl.a2.unit26.lesson05.teach.ik_heb_nodig:
    title: Sagen, was Sie persönlich brauchen
    gloss: Ich brauche einen gültigen Ausweis und meine BSN-Nummer.
    note: Heb ist die ich-Form von hebben. Sie steht hier anstelle des formellen heeft u ... nodig aus dem Infoblatt, um dieselbe Anforderung aus Ihrer eigenen Sicht auszudrücken.
  nl.a2.unit26.lesson06.teach.medewerker_greet:
    title: Der Mitarbeiter begrüßt Omar
    gloss: 'Mitarbeiter: Guten Morgen, wie kann ich Ihnen helfen?'
    note: Waarmee kan ik u helpen? greift die formelle Standardbegrüßung im Service aus dem Gemeindebesuch in Unit 24 wieder auf.
  nl.a2.unit26.lesson06.teach.omar_state_purpose:
    title: Omar nennt sein Anliegen
    gloss: 'Omar: Guten Morgen, ich möchte gern ein Girokonto für mein Gehalt eröffnen.'
    note: Verbindet die Anliegen aus Lektion 1 und Lektion 2 zu einem natürlichen Einstiegssatz.
  nl.a2.unit26.lesson06.teach.medewerker_ask_documents:
    title: Der Mitarbeiter fragt nach den Unterlagen
    gloss: 'Mitarbeiter: Natürlich. Haben Sie Ihre BSN-Nummer und einen gültigen Ausweis dabei?'
    note: Entspricht genau der Lernphrase aus Lektion 3.
  nl.a2.unit26.lesson06.teach.omar_hand_over:
    title: Omar übergibt die Unterlagen
    gloss: 'Omar: Ja, hier sind mein Reisepass und meine BSN-Nummer.'
    note: Entspricht der BSN-Nummer, die Omar in Unit 24 erhalten hat.
  nl.a2.unit26.lesson06.teach.medewerker_confirm:
    title: Der Mitarbeiter bestätigt
    gloss: 'Mitarbeiter: Vielen Dank. Sie erhalten Ihre Bankkarte innerhalb einer Woche per Post, und mit der App können Sie auch mobil Bankgeschäfte erledigen.'
    note: Verbindet die Informationen zum Kartenversand und zum mobilen Banking aus Lektion 4.
  nl.a2.unit26.lesson06.teach.omar_thanks:
    title: Omar bedankt sich beim Mitarbeiter
    gloss: 'Omar: Perfekt, vielen Dank für Ihre Hilfe!'
    note: Greift den Abschluss dank u wel voor uw hulp aus dem Gemeindebesuch in Unit 24 wieder auf.
  nl.a2.unit26.lesson06.teach.summary_grammar:
    title: Den Besuch zusammenfassen
    gloss: Omar hat ein Bankkonto eröffnet. Er erhält seine Bankkarte per Post.
    note: Heeft ... geopend ist das Perfekt von openen (geopend ist das Partizip Perfekt, wie im Deutschen „eröffnet“). Zijn bedeutet hier „sein“ (besitzanzeigend).
