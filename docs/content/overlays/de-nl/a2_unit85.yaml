teaching:
  nl.a2.unit85.lesson01.teach.reiswoorden:
    title: Zugreisen
    gloss: der Zug / der Bahnhof / ankommen / abfahren
    note: Das trennbare Verb aankomen heißt im Hauptsatz ik kom aan.
    example_gloss:
    - Der Zug kommt am Bahnhof an.
    - Der Zug fährt um acht Uhr ab.
  nl.a2.unit85.lesson01.teach.tijdwoorden:
    title: Vergangene Ereignisse ordnen
    gloss: als / schon / früher / zu spät
    note: Al zeigt an, dass etwas vor dem späteren Bezugspunkt schon geschehen war.
    example_gloss: Ich bin zu spät angekommen.
  nl.a2.unit85.lesson01.teach.vormen:
    title: Drei nützliche Vergangenheitsformen
    gloss: ich kam an / der Zug fuhr ab / der Zug war abgefahren
    example_gloss: Ich kam an, aber der Zug war abgefahren.
  nl.a2.unit85.lesson01.teach.gn_vvt:
    title: Ein Ereignis vor einem anderen
    gloss: Als ich ankam, war der Zug schon abgefahren.
    note: Die Ankunft ist der spätere Bezugspunkt in der Vergangenheit. Was vertrokken legt die Abfahrt des Zuges davor.
  nl.a2.unit85.lesson01.teach.gn_bouw:
    title: Das Plusquamperfekt bilden
    gloss: 'Plusquamperfekt: had oder was plus Partizip Perfekt.'
    note: Das Niederländische nennt dies voltooid verleden tijd. Wie im Deutschen steht es mit dem Präteritum von „haben“ oder „sein“ plus Partizip; Partizip und Hilfsverb sind dieselben wie im Perfekt (hebben bzw. zijn).
  nl.a2.unit85.lesson02.teach.bagage:
    title: Verlorenes Gepäck
    gloss: der Koffer / die Tasche / verlieren / vergessen / finden
    example_gloss:
    - Ich suche meinen Koffer.
    - Wo ist meine Tasche?
  nl.a2.unit85.lesson02.teach.vormen:
    title: Nützliche Partizipien
    gloss: verloren / vergessen / gefunden / gegangen / gekommen
    example_gloss: Ich hatte den Koffer gefunden.
  nl.a2.unit85.lesson02.teach.zinnen:
    title: Had und was
    gloss: Ich hatte meinen Koffer verloren. Sie war nach Hause gegangen.
  nl.a2.unit85.lesson02.teach.gn_aux:
    title: Das Hilfsverb bleibt gleich
    gloss: 'Perfekt: Ich habe die Tasche gefunden, ich bin gekommen. Plusquamperfekt: Ich hatte die Tasche gefunden, ich war gekommen.'
    note: Ein Verb, das im Perfekt hebben verwendet, verwendet im Plusquamperfekt had. Ein Verb mit zijn verwendet was.
  nl.a2.unit85.lesson03.teach.nog_niet:
    title: Noch nicht
    gloss: noch nicht / geöffnet / geschlossen / der Schalter
    example_gloss: Der Schalter ist geschlossen.
  nl.a2.unit85.lesson03.teach.afspraak:
    title: Termine und Warten
    gloss: der Termin / verpassen / warten
    example_gloss:
    - Ich habe morgen einen Termin.
    - Ich will den Zug nicht verpassen.
    - Ich warte am Schalter.
  nl.a2.unit85.lesson03.teach.vormen:
    title: Am Schalter
    gloss: Der Schalter war noch nicht geöffnet. Ich habe meinen Termin verpasst.
  nl.a2.unit85.lesson03.teach.gn_contrast:
    title: Perfekt oder Plusquamperfekt
    gloss: Ich habe meine Tasche verloren. Ich hatte meine Tasche schon verloren, als ich zum Schalter kam.
    note: Das Perfekt berichtet von einem abgeschlossenen Ereignis. Das Plusquamperfekt legt es ausdrücklich vor einen anderen Zeitpunkt in der Vergangenheit.
  nl.a2.unit85.lesson03.teach.gn_al_nog:
    title: Schon und noch nicht
    gloss: Der Zug war schon abgefahren. Der Schalter war noch nicht geöffnet.
    note: Verwenden Sie al für ein Ereignis, das früher abgeschlossen war, und nog niet für etwas, das zu diesem Zeitpunkt in der Vergangenheit noch nicht abgeschlossen war.
  nl.a2.unit85.lesson04.teach.scenario:
    title: Eine Abfolge vor der Abfahrt
    gloss: essen / abfahren / anrufen / zum Bahnhof gehen
    example_gloss: Ich gehe zum Bahnhof.
  nl.a2.unit85.lesson04.teach.vormen:
    title: Formen in der Abfolge
    gloss: gegessen / abgefahren / angerufen / ging
    example_gloss: Ich hatte Omar angerufen.
  nl.a2.unit85.lesson04.teach.zin:
    title: Nach dem Essen
    gloss: Nachdem ich gegessen hatte, ging ich zum Bahnhof.
  nl.a2.unit85.lesson04.teach.gn_nadat:
    title: Nadat mit had am Ende
    gloss: Nachdem ich gegessen hatte, ging ich zum Bahnhof.
    note: 'Im Nebensatz mit nadat steht das Partizip vor dem Hilfsverb am Satzende: gegeten had. Der folgende Hauptsatz beginnt mit dem Verb: ging ik.'
  nl.a2.unit85.lesson04.teach.gn_zijn:
    title: Nadat mit was am Ende
    gloss: Nachdem der Zug abgefahren war, rief ich Omar an.
    note: 'Vertrekken bildet die Zeiten mit zijn, deshalb endet der Nebensatz mit vertrokken was. Der vorangestellte Nebensatz löst die Inversion aus: belde ik.'
  nl.a2.unit85.lesson05.teach.reading:
    title: Noors verlorener Regenschirm
    gloss: Noor kam zu spät am Bahnhof an. Ihr Zug war schon abgefahren. Sie hatte ihren Regenschirm im vorherigen Zug vergessen. Am Fundbüro hörte sie, dass jemand den Regenschirm gefunden hatte.
    note: 'Achten Sie auf die zwei früheren Ereignisse: Der Zug fuhr ab und Noor vergaß den Regenschirm, bevor sie den Schalter erreichte.'
    glosses:
      laat: zu spät
      vertrokken: links
      paraplu: Regenschirm
      vergeten: vergessen
      voorwerpen: 'Gegenstände; hier: Fundsachen'
      gevonden: gefunden
  nl.a2.unit85.lesson05.teach.gn_reading:
    title: Das frühere Ereignis verorten
    gloss: Das Plusquamperfekt verwendet had oder was plus Partizip Perfekt, um ein Ereignis vor einen späteren Zeitpunkt in der Vergangenheit zu legen.
    note: In Noors Geschichte markieren *was vertrokken* und *had vergeten* Ereignisse, die zu den späteren Bezugspunkten bereits abgeschlossen waren.
  nl.a2.unit85.lesson06.teach.lotte_vraag:
    title: Lotte fragt nach der Verspätung
    gloss: 'Lotte: Warum bist du zu spät zu unserem Termin gekommen?'
  nl.a2.unit85.lesson06.teach.omar_trein:
    title: Omar erklärt den verpassten Zug
    gloss: 'Omar: Als ich am Bahnhof ankam, war der Zug schon abgefahren.'
  nl.a2.unit85.lesson06.teach.lotte_tas:
    title: Lotte fragt nach der Tasche
    gloss: 'Lotte: Und deine Tasche?'
  nl.a2.unit85.lesson06.teach.omar_tas:
    title: Omar erklärt die verlorene Tasche
    gloss: 'Omar: Die hatte ich im vorherigen Zug vergessen, aber das Fundbüro war noch nicht geöffnet.'
  nl.a2.unit85.lesson06.teach.gn_recap:
    title: Zwei kurze Erklärungen
    gloss: Als ich ankam, war der Zug schon abgefahren. Ich hatte meine Tasche vergessen.
    note: Was vertrokken verwendet zijn; had vergeten verwendet hebben.
