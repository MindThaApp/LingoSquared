teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: Mantel, Pullover
    gloss: der Mantel, der Pullover
    note: '*De jas* und *de trui* sind beide de-Wörter.'
    example_gloss:
    - Ich suche einen Mantel.
    - Ich habe einen Pullover.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: Hose, Schuhe
    gloss: die Hose, die Schuhe
    note: '*Broek* ist wie die deutsche „Hose“ grammatisch Singular: *een broek*, nicht *broeken*, für ein Paar. *Schoenen* ist der Plural von *schoen*; Schuhe nennt man fast immer im Plural, wie im Deutschen.'
    example_gloss:
    - Ich suche eine Hose.
    - Ich suche Schuhe.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: Sagen, was man sucht
    gloss: Ich suche einen Mantel.
    note: '*Zoeken* (suchen) wird hier wie im Deutschen ohne Präposition mit einem direkten Objekt verwendet. (*Zoeken naar* gibt es auch, aber das einfache Objekt ist das einfachste Muster.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: Größe
    gloss: die Größe
    note: 'Ein de-Wort: *de maat*.'
    example_gloss: Welche Größe hast du?
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: Nach der Größe fragen
    gloss: Welche Größe hast du?
    note: '*Welke* (welche) steht, weil es bei *maat* nur wenige erwartbare Antworten gibt (S, M, L oder eine Zahl).'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: Die eigene Größe nennen
    gloss: Ich habe Größe M.
    note: 'Hier steht *hebben* (haben): Man sagt wörtlich „Ich habe Größe M“, ähnlich wie im Deutschen.'
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: Schwarz, Blau
    gloss: schwarz, blau
    note: Die beiden Grundfarben-Adjektive in dieser Lektion.
    example_gloss:
    - Ich möchte den Mantel in Schwarz.
    - Haben Sie diesen auch in Blau?
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: Eine Farbe wünschen
    gloss: Ich möchte den Mantel in Schwarz.
    note: '*In het* + Farbe ist die übliche Art, die Farbe eines Kleidungsstücks anzugeben, wenn man es bestellt oder verlangt.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: Nach einer anderen Farbe fragen
    gloss: Haben Sie diesen auch in Blau?
    note: '*Ook* (auch) fragt, ob es eine andere Farbe gibt; die Frage steht in der höflichen Form mit *u*.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: Nach der Passform fragen
    gloss: Passt dieser Mantel?
    note: '*Passen* ist das natürliche Verb für die Passform von Kleidung; es ist zu unterscheiden von *passen* im Sinne von „anprobieren“.'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: Gute Passform bestätigen
    gloss: Er passt gut.
    note: '*Goed* (gut) beschreibt, wie das Kleidungsstück sitzt.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: Zu klein
    gloss: Er ist zu klein.
    note: '*Te* (zu) steht vor dem Adjektiv, um ein Übermaß auszudrücken.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: Zu groß
    gloss: Er ist zu groß.
    note: Dasselbe Muster *te* + Adjektiv wie bei *te klein* auf der vorigen Karte.
  nl.a1.unit20.lesson05.teach.negentig:
    title: Neunzig
    gloss: neunzig
    note: '*Negentig* ist die Zahl 90, hier im Preis der Jacke verwendet.'
    example_gloss: Der Mantel kostet neunzig Euro.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: Einen Preis nennen
    gloss: Der Mantel kostet neunzig Euro.
    note: '*Kost* ist die Form der dritten Person Singular von *kosten*.'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: Einen Kassenbon lesen
    gloss: 'Wintermantel: Größe M, Farbe Schwarz. Preis: neunzig Euro. Dieser Mantel passt gut und ist warm.'
    note: Achten Sie auf Größe, Farbe, Preis und die zwei Eigenschaften, die zum Mantel genannt werden.
    glosses:
      Winterjas: Wintermantel
      maat: Größe
      kleur: Farbe
      zwart: schwarz
      Prijs: der Preis
      negentig: neunzig
      euro: Euro
      jas: Mantel
      past: passt
      warm: warm
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotte bemerkt den Mantel
    gloss: 'Lotte: Dieser Mantel ist schön! Welche Größe hast du?'
    note: '*Mooi* (schön, hübsch) ist eine allgemeine positive Reaktion, die schon aus früheren Einheiten bekannt ist.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omar bittet darum, ihn anzuprobieren
    gloss: 'Omar: Ich habe Größe M. Darf ich ihn anprobieren?'
    note: '*Mag ik ...?* (Darf ich ...?) ist die übliche höfliche Art, um Erlaubnis zu fragen; *passen* bedeutet hier „anprobieren“, nicht „passen“.'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotte fragt nach der Passform
    gloss: 'Lotte: Natürlich. Passt er gut?'
    note: '*Hij* (er/es) bezieht sich auf *de jas*, ein de-Wort.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omar bestätigt
    gloss: 'Omar: Ja, er passt gut und ist warm.'
    note: Entspricht genau dem Kassenbon aus Lektion 5 – es ist derselbe Mantel.
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotte fragt nach der Farbe
    gloss: 'Lotte: Prima! Willst du ihn in Schwarz oder in Blau?'
    note: '*Wil je... of...?* greift das Muster zum Anbieten einer Auswahl aus den Vorlieben-Lektionen in Einheit 13 auf.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omar entscheidet sich
    gloss: 'Omar: Ich nehme ihn in Schwarz.'
    note: '*Nemen* (nehmen) ist das natürliche Verb, um eine Kaufentscheidung abzuschließen.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem vs. neemt
    gloss: Neem ist die ich-Form von nemen (nehmen); neemt ist die er-/sie-Form.
    note: 'Regelmäßiges Muster im Präsens: *ik neem, jij/hij/zij neemt*.'
