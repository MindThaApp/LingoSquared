    instruction: Wählen Sie die richtige niederländische Wendung.
    correct_option: De man die in de winkel werkt.
    distractors:
    - De man dat in de winkel werkt.
    - De man die in de winkel werken.
    - Het man die in de winkel werkt.
    accepted_answers:
    - value: De man die in de winkel werkt.
      status: correct
    feedback: '*De man die in de winkel werkt*: *die* nach einem de-Wort, und das Verb *werkt* steht am Ende.'
    prompt_blocks:
    - Der Mann, der im Geschäft arbeitet.
