course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch auf A2-Niveau, um Personen und Dinge mit Relativsätzen zu bezeichnen.
  learning_goal: Eine Person oder Sache mit die oder dat und einem Relativsatz mit dem Verb am Ende bezeichnen.
units:
  nl.a2.unit98.degene_die_en_dat:
    title: Der Mann, der – das Buch, das
    description: Erkennen Sie Personen bei der Arbeit sowie verlorene oder gekaufte Dinge mit Relativsätzen mit die und dat.
lessons:
  nl.a2.unit98.lesson01.mensen_en_spullen:
    title: Personen und Dinge
  nl.a2.unit98.lesson02.die_of_dat:
    title: Die oder dat?
  nl.a2.unit98.lesson03.wie_doet_wat:
    title: Wer macht was?
  nl.a2.unit98.lesson04.in_de_winkel:
    title: Suchen im Geschäft
  nl.a2.unit98.lesson05.noors_bericht:
    title: Noors Nachricht
  nl.a2.unit98.lesson06.lotte_en_omar:
    title: Lotte und Omar im Geschäft
teaching:
  nl.a2.unit98.lesson01.teach.mensen:
    title: Menschen bei der Arbeit
    gloss: der Mann / die Frau / der Kollege, die Kollegin / der Kunde, die Kundin / der Chef, die Chefin / der Koch, die Köchin
    note: Alle diese Wörter sind de-Wörter.
    example_gloss:
    - Der Kunde ist ein Mann.
    - Die Kollegin ist eine Frau.
    - Der Koch und der Chef arbeiten hier.
  nl.a2.unit98.lesson01.teach.winkel_werk:
    title: Verben für Geschäft und Arbeit
    gloss: das Geschäft / arbeiten / helfen / suchen / kaufen
    note: '*Kocht* ist das Imperfectum von *kopen*.'
    example_gloss:
    - Ich arbeite im Geschäft.
    - Der Kollege hilft dem Kunden.
    - Ich suche eine Tasche.
    - Ich habe ein Buch gekauft.
  nl.a2.unit98.lesson01.teach.spullen:
    title: Dinge im Geschäft, Dinge, die man verliert
    gloss: der Schlüssel / die Tasche / die Geldbörse / das Telefon / die Jacke / die Brille / die Armbanduhr / das Buch / die Schuhe / der Pullover / das Geschenk
    note: 'Achten Sie darauf, welche Wörter *de* und welche *het* haben: *het horloge, het boek, het cadeau*. *De schoenen* ist ein Plural.'
    example_gloss:
    - Der Schlüssel ist in der Tasche.
    - Die Armbanduhr ist neu.
    - Das Geschenk ist ein Buch.
  nl.a2.unit98.lesson01.teach.kwijt:
    title: Verloren und gefunden
    gloss: verloren / verlieren / finden
    note: '*Verloor* und *vond* sind das Imperfectum von *verliezen* und *vinden*.'
    example_gloss:
    - Ich habe meinen Schlüssel verloren.
    - Ich habe meine Brille verloren.
    - Der Kunde hat mein Telefon gefunden.
  nl.a2.unit98.lesson01.teach.zinnen:
    title: Kurze Sätze
    gloss: Ich habe meine Tasche verloren. Der Kollege hilft mir. Der Kunde hat mein Telefon gefunden.
  nl.a2.unit98.lesson01.teach.dit_is:
    title: Das hier ist, das dort ist
    gloss: Das ist das Buch. Das ist der Mann.
  nl.a2.unit98.lesson01.teach.gn_patroon:
    title: Die und dat verweisen auf ein Nomen zurück
    gloss: der Mann, der im Geschäft arbeitet / das Buch, das ich gekauft habe
    note: '*Die* und *dat* verbinden einen kurzen Zusatzsatz mit dem Nomen davor. Das Verb steht in diesem Nebensatz normalerweise ganz am Ende: *die in de winkel werkt*, *dat ik kocht*.'
  nl.a2.unit98.lesson02.teach.meer_spullen:
    title: Mehr Dinge und einige Plurale
    gloss: das Fahrrad / der Regenschirm / die Karte, das Ticket; die Schlüssel / die Taschen / die Bücher / die Armbanduhren / die Pullover
    note: 'Alle Plurale haben *de*, auch der Plural eines het-Wortes: aus *het boek* wird *de boeken*.'
    example_gloss:
    - Der Regenschirm ist blau.
    - Das Ticket ist klein.
  nl.a2.unit98.lesson02.teach.adjectieven:
    title: Adjektive
    gloss: neu / schön / alt / blau / schwarz
    note: 'Nach *de* oder *het* bekommt das Adjektiv ein *-e*: *de nieuwe tas*, *het mooie boek*.'
    example_gloss:
    - Die neue Tasche ist schwarz.
    - Das schöne Buch ist alt.
  nl.a2.unit98.lesson02.teach.gn_de_het:
    title: Die bei de-Wörtern und Pluralen, dat bei het-Wörtern
    gloss: die Tasche, die / die Schuhe, die / die Armbanduhr, die / das Geschenk, das
    note: 'Verwenden Sie *die* nach einem de-Wort und nach jedem Plural. Verwenden Sie *dat* nur nach einem het-Wort im Singular: *het horloge dat*, aber *de horloges die*.'
  nl.a2.unit98.lesson02.teach.zinnen2:
    title: Zwei Sätze
    gloss: Ich suche die Schlüssel, die ich verloren habe. Das Ticket, das ich gefunden habe, ist alt.
    note: Ein Relativsatz kann auch direkt auf das Subjekt folgen. Die ganze Gruppe ist das Subjekt, daher kommt danach das Hauptverb. Ein Komma nach dem Relativsatz ist üblich, aber nicht verpflichtend.
  nl.a2.unit98.lesson03.teach.werkwoorden:
    title: Mehr Verben
    gloss: anrufen / sehen / kennen
    note: '*Belde* und *zag* sind das Imperfectum von *bellen* und *zien*.'
    example_gloss:
    - Ich rufe den Chef an.
    - Ich sehe die Kollegin.
    - Ich kenne den Kunden.
  nl.a2.unit98.lesson03.teach.gn_onderwerp_voorwerp:
    title: Wer führt die Handlung aus?
    gloss: die Frau, die mich sieht / die Frau, die ich sehe
    note: In *de vrouw die mij ziet* ist die Frau diejenige, die sieht. In *de vrouw die ik zie* bin ich es, der sieht. Nach *die* oder *dat* steht entweder sofort ein Verb (*die werkt*) oder ein neues Subjekt (*die ik zie*).
  nl.a2.unit98.lesson03.teach.gn_werkwoord_achteraan:
    title: Das Verb steht am Ende
    gloss: Der Mann arbeitet im Geschäft. / der Mann, der im Geschäft arbeitet
    note: In einem normalen Hauptsatz steht das Verb an zweiter Stelle. Im Relativsatz steht das Verb normalerweise am Ende, nach seinem Objekt und nach kurzen Angaben wie *in de winkel*.
  nl.a2.unit98.lesson03.teach.zinnen3:
    title: Zwei gegensätzliche Wendungen
    gloss: der Kunde, der mich angerufen hat / der Kunde, den ich angerufen habe
  nl.a2.unit98.lesson04.teach.zoeken:
    title: Fundsachen
    gloss: Ich habe meine Geldbörse verloren. Ich suche die Tasche, die ich verloren habe. Das sind die Schlüssel, die ich verloren habe.
  nl.a2.unit98.lesson04.teach.hier:
    title: Hilfe im Geschäft
    gloss: Der Mann, der hier arbeitet, hat mir geholfen. Das ist der Kunde, der mein Telefon gefunden hat.
  nl.a2.unit98.lesson04.teach.gn_modaal:
    title: Zwei Verben am Ende
    gloss: die Jacke, die ich kaufen möchte / die Tasche, die ich haben möchte
    note: 'Bei einem Modalverb mit Infinitiv stehen beide am Ende. Zuerst kommt das Modalverb, dann der Infinitiv: *die ik wil kopen*.'
  nl.a2.unit98.lesson04.teach.gn_degene:
    title: 'Degene die: die Person, die'
    gloss: Ich suche die Person, die meine Tasche gefunden hat.
    note: '*Degene die* bedeutet „die Person, die“. Verwenden Sie es, wenn Sie nicht genau wissen, wer die Person ist. In dieser Einheit folgt darauf *die*.'
  nl.a2.unit98.lesson05.teach.woorden:
    title: Nützliche kleine Wörter
    gloss: gestern / dort / wieder / zurück / jetzt / auch
    example_gloss:
    - Ich habe die Tasche gestern gekauft.
    - Jetzt habe ich den Schlüssel wieder.
  nl.a2.unit98.lesson05.teach.reading:
    title: Noor schreibt an Lotte
    gloss: Hallo Lotte, ich habe meine Tasche verloren. Es ist die Tasche, die ich gestern gekauft habe. Ich habe im Geschäft gesucht. Die Frau, die dort arbeitet, hat mir geholfen. Ein Kunde, der die Tasche gesehen hatte, hat den Chef angerufen. Jetzt habe ich die Tasche wieder. Das Buch, das in der Tasche war, ist auch wieder da. Liebe Grüße, Noor
    note: Achten Sie auf jeden Relativsatz und das Nomen, zu dem er gehört.
    glosses:
      zocht: suchte
      hielp: half
      zat: war (in)
      zag: sah
      Groetjes: liebe Grüße
  nl.a2.unit98.lesson05.teach.gn_zin_in_zin:
    title: Ein Relativsatz innerhalb eines Satzes
    gloss: Die Frau, die dort arbeitet, hat mir geholfen.
    note: Wenn der Relativsatz nach dem Subjekt steht, folgt danach das Hauptverb. Ein Komma nach dem Relativsatz ist üblich, aber nicht verpflichtend. Der Relativsatz ist Teil des Subjekts.
  nl.a2.unit98.lesson06.teach.lotte_kwijt:
    title: Lotte sagt (Zeile 1)
    gloss: 'Lotte: Hallo Omar, ich habe meine Jacke verloren.'
  nl.a2.unit98.lesson06.teach.omar_gisteren:
    title: Omar sagt (Zeile 2)
    gloss: 'Omar: Oh nein! Ist es die Jacke, die du gestern gekauft hast?'
  nl.a2.unit98.lesson06.teach.lotte_blauw:
    title: Lotte sagt (Zeile 3)
    gloss: 'Lotte: Nein, es ist die blaue Jacke, die ich letzte Woche gekauft habe.'
  nl.a2.unit98.lesson06.teach.omar_man:
    title: Omar sagt (Zeile 4)
    gloss: 'Omar: Ein Mann, der im Geschäft arbeitet, hat eine blaue Jacke gefunden.'
  nl.a2.unit98.lesson06.teach.lotte_dank:
    title: Lotte sagt (Zeile 5)
    gloss: 'Lotte: Echt? Danke, Omar! Dann gehe ich zum Geschäft.'
  nl.a2.unit98.lesson06.teach.omar_succes:
    title: Omar sagt (Zeile 6)
    gloss: 'Omar: Viel Erfolg! Frag nach dem Mann, der die Jacke gefunden hat.'
exercises:
