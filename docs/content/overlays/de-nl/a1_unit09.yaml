    title: Die Bibliothek liegt gegenüber der Bank
    gloss: Die Bibliothek liegt gegenüber der Bank.
    note: Hier wird *tegenover* wieder verwendet, um das Ziel nach einem Wegabschnitt zu bestätigen.
  nl.a1.unit09.lesson05.teach.buurtkaart_route:
    title: Stadtteilkarte und Route
    gloss: die Stadtteilkarte, die Route
    note: Erinnern Sie sich an *buurtkaart* aus Lektion 8 (zusammengeschrieben); *de route* ist der Weg vom Start zum Ziel.
    example_gloss:
    - Hier ist die Stadtteilkarte.
    - Das ist die Route zum Supermarkt.
  nl.a1.unit09.lesson05.teach.start_doel:
    title: Start und Ziel
    gloss: START, ZIEL
    note: '*START* zeigt, wo die Route beginnt, und *DOEL*, wo sie endet.'
    example_gloss:
    - 'START: Bibliothek.'
    - 'ZIEL: Supermarkt.'
  nl.a1.unit09.lesson05.teach.marked_route:
    title: Eine eingezeichnete Route
    gloss: 'START: Bibliothek. Geh geradeaus bis zum Bahnhof, biege dann rechts ab. ZIEL: Supermarkt. Der Supermarkt liegt neben dem Bahnhof; die Bank liegt neben dem Supermarkt.'
    note: Die eingezeichnete Route enthält nur zwei Wegabschnitte.
    glosses:
      BUURTKAART: STADTTEILKARTE
      START: START
      bibliotheek: Bibliothek
      Route: Route
      ga: gehen
      rechtdoor: geradeaus
      station: Bahnhof
      sla: biege ab (Imperativ)
      rechtsaf: nach rechts
      DOEL: ZIEL
      supermarkt: Supermarkt
      naast: neben
      bank: Bank
  nl.a1.unit09.lesson06.teach.taalcafe_review:
    title: Sprachcafé
    gloss: das Sprachcafé
    note: Erinnern Sie sich an *taalcafé* aus früheren Lektionen. Es wird zusammengeschrieben und hat einen Akzent.
    example_gloss: Ich bin wegen des Sprachcafés hier.
  nl.a1.unit09.lesson06.teach.question:
    title: Omar fragt nach dem Weg
    gloss: 'Omar: Lotte, wie komme ich zum Supermarkt?'
    note: Omar verwendet mit Lotte die informelle Frage nach dem Weg.
  nl.a1.unit09.lesson06.teach.directions:
    title: Lotte nennt zwei Schritte
    gloss: 'Lotte: Geh geradeaus bis zum Bahnhof. Biege rechts ab.'
    note: Die Antwort besteht aus nur zwei kurzen Wegabschnitten.
  nl.a1.unit09.lesson06.teach.location:
    title: Lotte bestätigt den Ort
