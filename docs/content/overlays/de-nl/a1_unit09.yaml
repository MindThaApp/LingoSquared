    note: Die Ortsangabe aus Lektion 8 bestätigt, wo die Route endet.
  nl.a1.unit09.lesson06.teach.closing:
    title: Danke an Lotte
    gloss: 'Omar: Prima, danke dir! Lotte: Gern geschehen!'
    note: Das Gespräch endet auf informelle Weise.
