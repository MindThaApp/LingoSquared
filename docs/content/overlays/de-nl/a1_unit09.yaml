teaching:
  nl.a1.unit09.lesson01.teach.links_rechts:
    title: Links und rechts
    gloss: links, rechts
    note: '*Links* bedeutet links und *rechts* bedeutet rechts.'
    example_gloss:
    - Die Bank ist links.
    - Der Bahnhof ist rechts.
  nl.a1.unit09.lesson01.teach.linksaf_rechtsaf_rechtdoor:
    title: Links abbiegen, rechts abbiegen, geradeaus
    gloss: nach links / links abbiegen, nach rechts / rechts abbiegen, geradeaus
    note: '*Linksaf*, *rechtsaf* und *rechtdoor* werden jeweils in einem Wort geschrieben; in Wegbeschreibungen folgen sie meist auf *sla*: *sla linksaf*, *sla rechtsaf*.'
    example_gloss:
    - Biegen Sie links ab.
    - Biegen Sie rechts ab.
    - Gehen Sie geradeaus.
  nl.a1.unit09.lesson02.teach.ga_sla_loop_tot:
    title: Gehen, abbiegen, laufen, bis
    gloss: geh, biege ab, lauf, bis / bis zu
    note: '*Ga* fordert eine Person zum Gehen auf, *sla* zum Abbiegen und *loop* zum Laufen; *tot* markiert den Ort, an dem ein Wegschritt endet.'
    example_gloss:
    - Gehen Sie geradeaus.
    - Biegen Sie links ab.
    - Lauf bis zur Bank.
    - Geh geradeaus bis zum Bahnhof.
  nl.a1.unit09.lesson02.teach.ga_rechtdoor:
    title: Geh geradeaus
    gloss: Gehen Sie geradeaus.
    note: Auf *Ga* folgt direkt *rechtdoor*.
  nl.a1.unit09.lesson02.teach.sla_linksaf:
    title: Links abbiegen
    gloss: Biegen Sie links ab.
    note: '*Sla linksaf* ist die übliche kurze gesprochene Wegangabe.'
  nl.a1.unit09.lesson02.teach.sla_rechtsaf:
    title: Rechts abbiegen
    gloss: Biegen Sie rechts ab.
    note: '*Sla rechtsaf* ist die übliche kurze gesprochene Wegangabe.'
  nl.a1.unit09.lesson02.teach.loop_tot:
    title: Laufen bis
    gloss: Lauf bis ...
    note: 'Setzen Sie nach *tot* einen Ort: *Loop tot de bank*.'
  nl.a1.unit09.lesson02.teach.imperative_note:
    title: Kurze Befehlsformen
    gloss: 'Im Niederländischen lässt man bei einem informellen Befehl jij oder je normalerweise weg: ga, sla, loop. (Im Deutschen steht „du“ im Imperativ ebenfalls meist nicht: „Geh!“, „Bieg ab!“)'
    note: Diese Aufforderungen passen dazu, wie Lotte und Omar miteinander sprechen. Setzen Sie nicht *jij* oder *je* dazu.
  nl.a1.unit09.lesson03.teach.supermarkt_station_review:
    title: Supermarkt und Bahnhof
    gloss: der Supermarkt, der Bahnhof
    note: Erinnern Sie sich an *de supermarkt* und *het station* aus Lektion 8. *Supermarkt* wird zusammengeschrieben.
    example_gloss:
    - Wie komme ich zum Supermarkt?
    - Wie komme ich von hier zum Bahnhof?
  nl.a1.unit09.lesson03.teach.hoe_kom_ik_bij:
    title: Wie komme ich zu ...?
    gloss: Wie komme ich zu ...?
    note: Mit *Hoe kom ik bij ...?* fragen Sie nach dem Weg zu einem Ort.
  nl.a1.unit09.lesson03.teach.ask_supermarket:
    title: Wie komme ich zum Supermarkt?
    gloss: Wie komme ich zum Supermarkt?
    note: 'Vor dem Ziel steht *bij*: *bij de supermarkt*.'
