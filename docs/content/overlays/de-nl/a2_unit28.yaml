    gloss: 'Bestätigung: Ihre Meldung zur Heizung ist eingegangen. Morgen früh zwischen neun und elf Uhr kommt ein Techniker vorbei. Sind Sie nicht zu Hause? Dann rufen Sie die Wohnungsbaugesellschaft an.'
