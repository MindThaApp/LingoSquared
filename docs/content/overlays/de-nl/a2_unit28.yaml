      morgenochtend: morgen früh
      tussen: zwischen
      negen: neun
      elf: elf
      uur: 'Uhr (wörtlich: Stunde)'
      langs: vorbei (trennbarer Teil von langskomen, vorbeikommen)
      Bent: sind (von zijn; Bent u = Sind Sie)
      thuis: zu Hause
      Bel: rufen Sie an (Imperativ von bellen, anrufen)
      woningcorporatie: Wohnungsbaugesellschaft
