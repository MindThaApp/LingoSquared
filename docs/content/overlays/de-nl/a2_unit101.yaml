course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2 zum Hinweisen auf Dinge und zum genauen Bezeichnen.
  learning_goal: Beim Einkaufen oder Auswählen mit dit, dat, deze und die auf Dinge zeigen und sie genauer bezeichnen sowie Verkleinerungsformen verwenden.
units:
  nl.a2.unit101.deze_die_dit_dat:
    title: Dieses hier, jenes dort
    description: Auf dem Markt, beim Bäcker, im Blumenladen und in der Buchhandlung mit dit, dat, deze, die und Verkleinerungsformen auf Dinge zeigen und auswählen.
lessons:
  nl.a2.unit101.lesson01.dit_en_deze:
    title: 'Dieses (nah): dit und deze'
  nl.a2.unit101.lesson02.die_en_dat:
    title: 'Jenes (fern) und Plural: die und dat'
  nl.a2.unit101.lesson03.verkleinwoorden:
    title: 'Kleine Dinge: Verkleinerungsformen mit -je'
  nl.a2.unit101.lesson04.winkelen:
    title: 'Einkaufen: nach Preisen fragen und auswählen'
  nl.a2.unit101.lesson05.bericht_van_noor:
    title: 'Lesen: eine Nachricht von Noor'
  nl.a2.unit101.lesson06.lotte_en_omar:
    title: 'Dialog: Lotte und Omar auf dem Markt'
teaching:
  nl.a2.unit101.lesson01.teach.markt:
    title: Auf dem Markt
    gloss: der Markt / der Stand / der Apfel / die Tomate / der Käse
    note: 'Lernen Sie jedes Nomen mit seinem Artikel: de oder het. Alle Nomen auf dieser Karte sind de-Wörter.'
    example_gloss:
    - Ich bin auf dem Markt.
    - Ich sehe einen Marktstand.
    - Ich nehme einen Apfel.
  nl.a2.unit101.lesson01.teach.bakker:
    title: Beim Bäcker
    gloss: der Bäcker / das Brot / die Torte / der Keks
    note: '*Brood* ist ein het-Wort; die anderen sind de-Wörter.'
    example_gloss:
    - Ich bin beim Bäcker.
    - Das Brot ist frisch.
    - Die Torte ist lecker.
  nl.a2.unit101.lesson01.teach.bloemist:
    title: Beim Blumenhändler
    gloss: der Blumenhändler / die Rose / der Blumenstrauß
    note: '*Boeket* ist ein het-Wort; *roos* ist ein de-Wort.'
    example_gloss:
    - Beim Blumenhändler sehe ich eine Rose.
    - Der Strauß ist schön.
    - Ich nehme einen Blumenstrauß.
  nl.a2.unit101.lesson01.teach.boekwinkel:
    title: In der Buchhandlung
    gloss: die Buchhandlung / das Buch / der Roman / die Zeitung
    note: '*Boek* ist ein het-Wort; die anderen sind de-Wörter.'
    example_gloss:
    - In der Buchhandlung suche ich ein Buch.
    - Ich suche einen Roman.
    - Die Zeitung ist teuer.
  nl.a2.unit101.lesson01.teach.bijvoeglijk:
    title: Dinge beschreiben
    gloss: frisch / lecker / schön / billig / teuer / groß / klein
    note: Diese Wörter stehen nach *is* und verändern sich nicht.
    example_gloss:
    - Die Tomate ist klein.
    - Das Buch ist billig.
    - Der Stand ist groß.
  nl.a2.unit101.lesson01.teach.gn_dit_deze:
    title: 'Dieses: dit oder deze'
    gloss: het brood → dieses Brot; de taart → diese Torte; de roos → diese Rose; het boek → dieses Buch.
    note: 'Um auf etwas in Ihrer Nähe zu zeigen, verwenden Sie *dit* bei einem het-Wort und *deze* bei einem de-Wort. Sie müssen also den Artikel kennen: *dit brood* (het brood), *deze taart* (de taart).'
  nl.a2.unit101.lesson01.teach.zinnen:
    title: Zwei Sätze
    gloss: Dieses Brot ist frisch. Diese Torte ist lecker.
  nl.a2.unit101.lesson02.teach.meervoud:
    title: Plural
    gloss: die Äpfel / die Tomaten / die Rosen / die Bücher / die Zeitungen
    note: 'Der Plural endet auf -s oder -en. Aus *het boek* wird *de boeken*: Im Plural steht bei jedem Nomen *de*.'
    example_gloss:
    - Die Äpfel sind billig.
    - Die Tomaten sind lecker.
    - Die Rosen sind schön.
  nl.a2.unit101.lesson02.teach.gn_die_dat:
    title: 'Jenes: dat oder die'
    gloss: het brood → jenes Brot; de taart → jene Torte; het boek → jenes Buch; de roos → jene Rose.
    note: 'Um auf etwas weiter Entferntes zu zeigen, verwenden Sie *dat* bei einem het-Wort und *die* bei einem de-Wort. Es ist dasselbe Muster wie bei *dit* und *deze*: *dit/dat* für het-Wörter, *deze/die* für de-Wörter.'
  nl.a2.unit101.lesson02.teach.gn_meervoud:
    title: 'Plural: immer deze oder die'
    gloss: diese Äpfel, diese Bücher; jene Rosen, jene Bücher.
    note: 'Bei einem Nomen im Plural verwenden Sie immer *deze* (nah) oder *die* (fern), auch wenn der Singular ein het-Wort ist: *dit boek*, aber *deze boeken*. Vor einem Nomen stehen *dit* und *dat* nur bei het-Wörtern im Singular (allein, wie in *Wat is dat?*, können sie auf alles zeigen).'
  nl.a2.unit101.lesson02.teach.zinnen:
    title: Drei Sätze
    gloss: Jene Torte ist groß. Jenes Brot ist klein. Jene Äpfel sind billig.
  nl.a2.unit101.lesson03.teach.verkleinwoorden:
    title: Kleine Dinge
    gloss: das Brötchen / das Büchlein / das Kekschen / das Röschen / das Äpfelchen / das Sträußchen
    note: Eine Verkleinerungsform bezeichnet etwas Kleines oder Niedliches. Bäcker, Blumenhändler und Buchhandlungen verwenden sie ständig.
    example_gloss:
    - Dieses Brötchen ist lecker.
    - Das kleine Sträußchen ist schön.
    - Das Büchlein ist billig.
  nl.a2.unit101.lesson03.teach.gn_je:
    title: 'Verkleinerungsform: -je'
    gloss: Brot → Brötchen; Buch → Büchlein; Keks → kleiner Keks; Rose → Röschen; Tomate → kleine Tomate.
    note: 'Die meisten Wörter erhalten einfach -je: Aus *brood* wird *broodje*, aus *boek* wird *boekje*.'
  nl.a2.unit101.lesson03.teach.bijzonder:
    title: Zwei weitere Nomen
    gloss: der Baum / der Tisch
    example_gloss:
    - Ich sehe einen Baum.
    - Der Tisch ist groß.
  nl.a2.unit101.lesson03.teach.gn_tje_pje:
    title: 'Verkleinerungsform: -tje und -pje'
    gloss: Apfel → Äpfelchen; Tisch → Tischchen; Baum → Bäumchen; Marktstand → kleiner Marktstand; Blume → kleiner Blumenstrauß.
    note: Nach -el steht -tje (*appeltje*). Nach -m mit langem Vokal steht -pje (*boompje*, *kraampje*). Einige Wörter verändern sich stärker, etwa *bloem*, das zu *bloemetje* wird. Lernen Sie diese Formen nach und nach.
  nl.a2.unit101.lesson03.teach.gn_het:
    title: Eine Verkleinerungsform ist immer ein het-Wort
    gloss: 'der Apfel → das Äpfelchen: dieses Äpfelchen, jenes Äpfelchen. die Rose → das Röschen: dieses Röschen, jenes Röschen.'
    note: 'Jede Verkleinerungsform ist ein het-Wort, auch wenn das Grundwort ein de-Wort ist. Aus *de appel* wird also *het appeltje*, und man sagt *dit appeltje* und *dat appeltje*, niemals *deze appeltje*. (Auch im Deutschen sind Verkleinerungen auf -chen und -lein sächlich: das Äpfelchen.)'
  nl.a2.unit101.lesson03.teach.gn_meervoud_je:
    title: Plural der Verkleinerungsform
    gloss: 'das Brötchen → die Brötchen: diese Brötchen. das Büchlein → die Büchlein: jene Büchlein. der kleine Blumenstrauß → die kleinen Blumensträuße. das Röschen → die Röschen.'
    note: 'Der Plural einer Verkleinerungsform endet auf -jes: *broodjes*, *boekjes*, *appeltjes*, *roosjes*. Im Plural stehen *deze* und *die*, wie bei jedem Plural.'
  nl.a2.unit101.lesson04.teach.prijzen:
    title: Preise
    gloss: was kostet es / was kosten sie / Euro / zwei / drei / vier / fünf
    note: Verwenden Sie *kost* bei einer Sache und *kosten* bei mehreren.
    example_gloss:
    - Dieses Brötchen kostet zwei Euro.
    - Diese Rosen kosten fünf Euro.
    - Das Buch da kostet drei Euro.
  nl.a2.unit101.lesson04.teach.gn_kost:
    title: Kost oder kosten
    gloss: Was kostet dieses Brötchen? Was kosten diese Brötchen?
    note: 'Das Verb richtet sich nach dem Nomen, auf das gezeigt wird: Bei einer Sache steht *kost*, bei mehreren Sachen *kosten*.'
  nl.a2.unit101.lesson04.teach.kiezen:
    title: Auswählen und fragen
    gloss: Ich nehme das Büchlein da. Ich suche einen Roman. Dieser kleine Blumenstrauß kostet zwei Euro.
  nl.a2.unit101.lesson04.teach.gn_alleen:
    title: Dit und dat allein
    gloss: Was ist das? Das ist eine Rose.
    note: 'Wenn Sie ohne Nomen auf etwas zeigen und fragen, was es ist, verwenden Sie *dit* oder *dat*, auch wenn das Ding ein de-Wort ist: *Wat is dat? Dat is een roos.*'
  nl.a2.unit101.lesson05.teach.reading:
    title: Noors Nachricht
    gloss: Hallo Lotte! Ich bin auf dem Markt. Diese Äpfel sind billig, und die Tomaten da sind lecker. Beim Bäcker ist dieses Brötchen klein, aber das Brot da ist groß. Ich nehme dieses Brötchen. Die Rosen da sind schön, aber dieser kleine Blumenstrauß ist billig. Diesen kleinen Blumenstrauß nehme ich für dich mit!
    note: 'Achten Sie darauf, welches Wort Noor bei jedem Nomen verwendet: dit/dat bei het-Wörtern, deze/die bei de-Wörtern und im Plural.'
    glosses:
      hoi: hallo
      maar: aber
      voor: für
      jou: dich
      bij: bei
  nl.a2.unit101.lesson06.teach.lotte_brood:
    title: Lotte zeigt auf das Brot
    gloss: 'Lotte: Omar, schau! Dieses Brot ist frisch.'
  nl.a2.unit101.lesson06.teach.omar_broodje:
    title: Omar zeigt auf ein weiter entferntes Brötchen
    gloss: 'Omar: Ja, und das Brötchen da ist billig.'
  nl.a2.unit101.lesson06.teach.lotte_neemt:
    title: Lotte wählt
    gloss: 'Lotte: Dann nehme ich das Brötchen da. Und du?'
  nl.a2.unit101.lesson06.teach.omar_taart:
    title: Omar wählt
    gloss: 'Omar: Ich nehme diese Torte und diesen Keks.'
  nl.a2.unit101.lesson06.teach.lotte_bloemetje:
    title: Lotte sieht die Blumen
    gloss: 'Lotte: Schau, dieser kleine Blumenstrauß ist schön!'
  nl.a2.unit101.lesson06.teach.omar_rozen:
    title: Omar zeigt auf die Rosen
    gloss: 'Omar: Ja, und die Rosen da sind auch schön.'
