teaching:
  nl.a2.unit77.lesson01.teach.koptelefoon:
    title: Die Kopfhörer
    gloss: der Kopfhörer
    note: '*De koptelefoon* ist ein de-Wort und steht im Niederländischen im Singular, während „Kopfhörer“ im Deutschen meist im Plural verwendet wird.'
    example_gloss: Ich habe mir neue Kopfhörer gekauft.
  nl.a2.unit77.lesson01.teach.koptelefoon_kapot:
    title: Melden, dass die Kopfhörer kaputt sind
    gloss: Dieser Kopfhörer ist kaputt.
    note: '*Kapot* (kaputt) beschreibt jeden Gegenstand, der nicht mehr funktioniert, von Elektrogeräten bis zu Möbeln.'
  nl.a2.unit77.lesson01.teach.linkerkant_doet_het_niet:
    title: Beschreiben, welche Seite nicht funktioniert
    gloss: Die linke Seite funktioniert nicht.
    note: '*Doet het niet* (wörtlich „tut es nicht“) ist die übliche Wendung dafür, dass ein Gerät oder Teil nicht funktioniert.'
  nl.a2.unit77.lesson02.teach.geld_terug:
    title: Das Geld zurück
    gloss: das Geld zurück / die Erstattung
    note: '*Het geld terug* ist eine feste Wendung für die Rückerstattung des Kaufpreises.'
    example_gloss: Ich möchte gern mein Geld zurück.
  nl.a2.unit77.lesson02.teach.graag_geld_terug:
    title: Eine Rückerstattung verlangen
    gloss: Ich möchte gern mein Geld zurück.
    note: '*Graag* (gern/bitte) macht die Bitte höflicher; das ist im Niederländischen die übliche höfliche Formulierung, ähnlich wie „gern“ oder „bitte“ im Deutschen.'
  nl.a2.unit77.lesson02.teach.ruilen_of_geld:
    title: Nach Umtausch oder Erstattung fragen
    gloss: Kann ich es umtauschen oder mein Geld zurückbekommen?
    note: '*Ruilen* (umtauschen) und *het geld terugkrijgen* (das Geld zurückbekommen) sind die beiden üblichen Lösungen bei einer Reklamation.'
  nl.a2.unit77.lesson03.teach.bonnetje:
    title: Der Kassenbon
    gloss: der Kassenbon
    note: '*Het bonnetje* (Verkleinerungsform von *de bon*) ist das alltägliche Wort für den Kassenbon.'
    example_gloss: Ich habe den Kassenbon noch, hier ist er.
  nl.a2.unit77.lesson03.teach.heeft_u_bonnetje:
    title: Fragen, ob die Kundin oder der Kunde den Kassenbon noch hat
    gloss: Haben Sie den Kassenbon noch?
    note: '*Nog* (noch) fragt danach, ob man den Kassenbon noch besitzt.'
  nl.a2.unit77.lesson03.teach.acht_dagen_geleden:
    title: Sagen, wann man etwas gekauft hat
    gloss: Ich habe sie vor acht Tagen gekauft.
    note: '*Geleden* (vor) steht nach der Zeitangabe; so sagt man im Niederländischen, wie lange etwas her ist.'
  nl.a2.unit77.lesson04.teach.retourbeleid:
    title: Die Rückgaberegelung
    gloss: die Rückgaberegelung
    note: '*Het retourbeleid* ist ein gängiges Kompositum aus *retour* (Rückgabe) und *beleid* (Regelung, Politik).'
    example_gloss: Wie lautet die Rückgaberegelung dieses Geschäfts?
  nl.a2.unit77.lesson04.teach.dertig_dagen:
    title: Die Rückgabefrist nennen
    gloss: Sie können einen Artikel innerhalb von dreißig Tagen zurückbringen.
    note: '*Binnen* (innerhalb) + Zeitraum ist die übliche Konstruktion für eine Frist.'
  nl.a2.unit77.lesson04.teach.dat_regel_ik:
    title: Anbieten, etwas zu erledigen
    gloss: Das erledige ich für Sie.
    note: '*Dat regel ik* (das erledige ich) ist eine gängige, beruhigende Wendung von Mitarbeitenden, die Kunden helfen.'
  nl.a2.unit77.lesson05.teach.beleid:
    title: Einen Hinweis zur Rückgaberegelung lesen
    gloss: 'Rückgaberegelung: Sie können einen Artikel innerhalb von dreißig Tagen nach dem Kauf zurückbringen. Bringen Sie den Kassenbon mit. Bei einem defekten Artikel erhalten Sie Ihr Geld zurück oder können ihn gegen ein neues Exemplar umtauschen.'
    note: '*Bij een defect artikel* (bei einem defekten Artikel) leitet den besonderen Fall ein, den dieser Teil der Regelung abdeckt.'
    glosses:
      Retourbeleid: Rückgaberegelung
      kunt: können (2. Person von kunnen)
      artikel: Artikel
      binnen: innerhalb
      dertig: dreißig
      dagen: Tage
      na: nach
      aankoop: Kauf
      terugbrengen: zurückbringen
      Neem: nehmen Sie (Imperativ von nemen)
      bonnetje: Kassenbon
      mee: mit (Teil von neem ... mee = mitbringen)
      Bij: bei / im Fall von
      defect: defekt
      krijgt: bekommen (von krijgen)
      uw: Ihr (formell)
      geld: Geld
      terug: zurück
      of: oder
      ruilen: umtauschen
      voor: gegen / als Ersatz für
      nieuw: neu
      exemplaar: Exemplar (eines Produkts)
  nl.a2.unit77.lesson06.teach.verkoper_open:
    title: Der Mitarbeiter eröffnet das Gespräch
    gloss: 'Mitarbeiter: Guten Tag, wie kann ich Ihnen helfen?'
  nl.a2.unit77.lesson06.teach.omar_kapot:
    title: Omar schildert das Problem
    gloss: 'Omar: Guten Tag, diese Kopfhörer sind kaputt. Die linke Seite funktioniert nicht.'
  nl.a2.unit77.lesson06.teach.verkoper_bonnetje:
    title: Der Mitarbeiter fragt nach dem Kassenbon
    gloss: 'Mitarbeiter: Das ist ärgerlich. Haben Sie den Kassenbon noch?'
  nl.a2.unit77.lesson06.teach.omar_acht_dagen:
    title: Omar bestätigt und nennt das Kaufdatum
    gloss: 'Omar: Ja, hier ist er. Ich habe sie vor acht Tagen gekauft.'
  nl.a2.unit77.lesson06.teach.verkoper_binnen_dertig:
    title: Der Mitarbeiter bestätigt, dass die Frist eingehalten ist
    gloss: 'Mitarbeiter: Das ist kein Problem, das liegt innerhalb der dreißig Tage. Möchten Sie umtauschen oder Ihr Geld zurück?'
  nl.a2.unit77.lesson06.teach.omar_geld_terug:
    title: Omar entscheidet sich für die Erstattung
    gloss: 'Omar: Ich möchte gern mein Geld zurück.'
  nl.a2.unit77.lesson06.teach.verkoper_regel_het:
    title: Der Mitarbeiter bestätigt, dass er es erledigt
    gloss: 'Mitarbeiter: Gut, das erledige ich für Sie.'
  nl.a2.unit77.lesson06.teach.grammar_gekocht:
    title: 'Dritte Person: hij/zij mit heeft'
    gloss: Er hat die Kopfhörer gekauft. Sie hat ihr Geld zurückbekommen.
    note: '*Heeft* ist die 3. Person Singular von *hebben* (haben) und wird mit dem Partizip Perfekt zur Bildung des Perfekts verwendet; *hij* (er), *zij* (sie) und *haar* (ihr) sind die passenden Pronomen, um zusammenzufassen, was passiert ist.'
