  nl.a1.unit42.lesson03.teach.ik_wil_grammar:
    title: Die Konstruktion Ik wil graag
    gloss: '*Ik wil graag* + Farbe drückt aus, welche Farbe Sie wählen: Ich hätte gern Rosa.'
    note: Greift die bereits bekannte Bestellformel *Ik wil graag ...* auf (Ik wil graag appels, Ik wil graag een koffie) – keine neue Grammatik, nur eine neue Verwendung. Farben stehen hier immer so (als Objekt von *wil* oder als Prädikat nach *zijn*), nie direkt vor einem Nomen. Vor einem Nomen würde sich die Endung des Farbworts ändern (*rood* wird zu *rode*), ähnlich wie im Deutschen bei „rot“ und „rote Tulpen“; diese Regel wird in diesem Kurs aber noch nicht behandelt.
