teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: Sich unwohl fühlen
    gloss: Ich fühle mich nicht gut.
    note: '*Voelen* ist hier reflexiv (*je*/*me voelen*), wie im Deutschen „sich fühlen“; *niet lekker* ist die allgemeine, milde Art zu sagen, dass etwas nicht stimmt.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: Krank
    gloss: krank
    note: Das Grundadjektiv, das mit *zijn* (sein) verwendet wird.
    example_gloss: Ich bin krank.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: Krank sein
    gloss: Ich bin krank.
    note: '*Ziek* beschreibt einen allgemeineren, stärkeren Zustand als *niet lekker*.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: Kopfschmerzen
    gloss: Kopfschmerzen
    note: 'Es steht ohne Artikel nach *hebben*: *Ik heb hoofdpijn*, nicht *Ik heb een hoofdpijn*.'
    example_gloss: Ich habe Kopfschmerzen.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: Kopfschmerzen haben
    gloss: Ich habe Kopfschmerzen.
    note: 'Symptome stehen im Niederländischen typischerweise mit *hebben* (haben), genau wie im Deutschen: „Ich habe Kopfschmerzen.“'
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: Bauchschmerzen
    gloss: Bauchschmerzen
    note: Dasselbe Muster ohne Artikel wie bei *hoofdpijn*.
    example_gloss: Ich habe Bauchschmerzen.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: Bauchschmerzen haben
    gloss: Ich habe Bauchschmerzen.
    note: Es folgt demselben *hebben*-Muster wie *hoofdpijn*.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: Allgemein nachfragen
    gloss: Was ist los?
    note: Eine allgemeine Frage für alle Fälle, um zu fragen, ob etwas nicht stimmt.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: Eine feste Wendung
    gloss: Was hast du?
    note: '*Scheelt eraan* ist eine feste Redewendung (wörtlich etwa „was fehlt daran“); übersetzen Sie sie nicht Wort für Wort.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: Halsschmerzen
    gloss: Halsschmerzen
    note: Dasselbe Muster ohne Artikel wie bei *hoofdpijn*/*buikpijn*.
    example_gloss: Ich habe Halsschmerzen.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: Halsschmerzen haben
    gloss: Ich habe Halsschmerzen.
    note: Es folgt demselben *hebben*-Muster wie die anderen Symptome.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: Bei jemandem nachfragen
    gloss: Geht es dir gut? Nein, ich fühle mich nicht gut.
    note: '*Gaat het?* ist eine sehr gebräuchliche, lockere Nachfrage unter Freunden.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: Fieber
    gloss: Fieber
    note: Es steht wie die anderen Symptome ohne Artikel nach *hebben*.
    example_gloss: Ich habe Fieber.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: Fieber haben
    gloss: Ich habe Fieber.
    note: Es folgt dem *hebben*-Muster.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: Erkältet sein
    gloss: erkältet / erkältet sein
    note: Ein Adjektiv, das mit *zijn* verwendet wird, kein Substantiv mit *hebben*. Das ist eine häufige Fehlerquelle, denn im Deutschen sagt man „erkältet sein“, aber auch „eine Erkältung haben“.
    example_gloss: Ich bin erkältet.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: Sagen, dass man erkältet ist
    gloss: Ich bin erkältet.
    note: Wie im Deutschen („Ich bin erkältet“) steht im Niederländischen *zijn* + *verkouden*; sagen Sie nicht *Ik heb een verkouden*.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn oder hebben hängt von der Wortart ab, nicht von der Dauer
    gloss: 'Ziek und verkouden sind Adjektive und stehen mit zijn: Ich bin krank, ich bin erkältet. Koorts und hoofdpijn sind Nomen und stehen mit hebben.'
    note: 'Die Wahl zwischen *zijn* und *hebben* richtet sich nach der Wortart (Adjektiv oder Substantiv-Symptom), nicht danach, wie vorübergehend der Zustand ist: *koorts* (ein Substantiv) ist genauso vorübergehend wie *verkouden* (ein Adjektiv), steht aber mit *hebben*, nicht mit *zijn*.'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: Die Apotheke
    gloss: die Apotheke
    note: 'Ein de-Wort: *de apotheek*.'
    example_gloss: Ich gehe in die Apotheke.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: Die Begrüßung in der Apotheke
    gloss: Wie kann ich Ihnen helfen?
    note: '*Waarmee kan ik u helpen?* ist eine übliche höfliche Begrüßung im Service und setzt das *u*-Register aus den Lektionen 1 und 15 fort.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: Nach etwas gegen ein Symptom fragen
    gloss: Haben Sie etwas gegen Kopfschmerzen?
    note: '*Iets tegen* + Symptom ist die natürliche Art, nach einem Mittel zu fragen.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: Eine Tablette
    gloss: eine Tablette
    note: 'Ein sächliches Substantiv: *het tablet*, hier aber unbestimmt als *een tablet* verwendet.'
    example_gloss: Ich nehme eine Tablette.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: Einnahmehinweis
    gloss: Nimm zweimal täglich eine Tablette.
    note: '*Neem* ist der Imperativ von *nemen* (nehmen) und wird für Anweisungen verwendet.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: Sprachebene in der Apotheke
    gloss: In der Apotheke verwendet man die Höflichkeitsform u.
    note: Der Apotheker ist eine fremde Person in einer Dienstleistungsrolle; es gilt dieselbe Anrederegel wie am Fahrkartenschalter in Unit 15.
  nl.a1.unit16.lesson05.teach.advies:
    title: Einen Apothekenratschlag lesen
    gloss: 'Rat: Nimm zweimal täglich eine Tablette mit Wasser. Ruh dich gut aus und trink viel Wasser. Fühlst du dich nach drei Tagen immer noch nicht gut? Dann geh zum Arzt.'
    note: Achten Sie auf die Dosierung, die zwei Empfehlungen ohne Medikament und darauf, wann man zum Arzt gehen soll.
    glosses:
      Advies: Rat
      neem: nimm
      keer: Mal
      dag: Tag
      tablet: Tablette
      Rust: ruh dich aus
      drink: trink
      Voel: fühlen
      steeds: immer noch
      lekker: gut
      huisarts: Arzt / Hausarzt
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte fragt nach
    gloss: 'Lotte: Hallo Omar, wie geht es dir? Fühlst du dich schon besser?'
    note: '*Al* (schon) zeigt an, dass Lotte nachfragt, ob es Omar seit dem letzten Gespräch besser geht.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar geht es noch nicht gut
    gloss: 'Omar: Noch nicht so gut. Ich habe immer noch Kopfschmerzen und bin müde.'
    note: '*Nog steeds* (immer noch) zeigt, dass die Kopfschmerzen von vorhin nicht weg sind; *moe* (müde) ist ein neues, nützliches Adjektiv.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte fragt nach der Medizin
    gloss: 'Lotte: Hast du eine Tablette genommen?'
    note: '*Genomen* ist das Partizip Perfekt von *nemen* und folgt demselben Muster *heb* + Partizip wie in Lektion 12.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar bestätigt
    gloss: 'Omar: Ja, ich habe eine Tablette genommen. Ich werde mich jetzt ausruhen.'
    note: '*Ga nu rusten* („ich gehe jetzt ruhen“) verwendet das Muster der nahen Zukunft: *gaan* + Infinitiv.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte wünscht gute Besserung
    gloss: 'Lotte: Gute Idee. Ruh dich gut aus. Gute Besserung!'
    note: '*Beterschap!* ist die feste Wendung, um jemandem gute Besserung zu wünschen.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar verabschiedet sich
    gloss: 'Omar: Danke, bis morgen!'
    note: '*Tot morgen!* greift das Muster *tot* + Zeitangabe aus den Verabschiedungen früherer Lektionen auf.'
