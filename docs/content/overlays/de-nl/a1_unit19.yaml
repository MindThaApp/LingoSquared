teaching:
  nl.a1.unit19.lesson01.teach.weer:
    title: Wetter
    gloss: das Wetter
    note: 'Ein het-Wort: *het weer*.'
    example_gloss: Wie ist das Wetter?
  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: Nach dem Wetter fragen
    gloss: Wie ist das Wetter?
    note: '*Wat voor* + Nomen fragt nach der Art, „was für ein“; eine sehr häufige allgemeine Frage.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: Sonnig
    gloss: Es ist sonnig.
    note: '*Het is* + Wetteradjektiv ist das übliche Muster, mit dem unpersönlichen *het* (es).'
  nl.a1.unit19.lesson01.teach.regent:
    title: Regen
    gloss: Es regnet.
    note: '*Regenen* wird unpersönlich verwendet: *het regent*, ganz ohne zusätzliches Adjektiv.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: Bewölkt
    gloss: Es ist bewölkt.
    note: Es folgt demselben Muster *het is* + Adjektiv wie *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: Kalt
    gloss: Heute ist es kalt.
    note: '*Vandaag* (heute) ordnet die Wetterbeschreibung zeitlich ein.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: Heute ist es warm.
    note: '*Warm* deckt im alltäglichen niederländischen Wettergespräch sowohl „warm“ als auch „heiß“ ab.'
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: Temperaturen gegenüberstellen
    gloss: Es ist nicht kalt, es ist warm.
    note: '*Niet* verneint *koud* direkt vor dem Adjektiv.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: Der Wetterbericht
    gloss: die Wettervorhersage
    note: 'Ein het-Wort: *het weerbericht*, zusammengesetzt aus *weer* (Wetter) und *bericht* (Bericht).'
    example_gloss: Wie ist der Wetterbericht?
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: Das Wetter von morgen
    gloss: Morgen ist es sonnig.
    note: '*Morgen* steht am Satzanfang, deshalb wird danach *is het* umgestellt (Inversion).'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: Eine Vorhersage für zwei Tage
    gloss: Am Samstag ist es sonnig und warm, aber am Sonntag regnet es den ganzen Tag.
    note: '*De hele dag* (den ganzen Tag) betont, wie lange der Regen anhält.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: Der Spaziergang
    gloss: der Spaziergang
    note: 'Ein de-Wort: *de wandeling*.'
    example_gloss: Machen wir einen Spaziergang?
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: Einen Spaziergang vorschlagen
    gloss: Machen wir einen Spaziergang?
    note: '*Zullen we...?* greift das Muster für Vorschläge aus Einheit 11 wieder auf; *een wandeling maken* (wörtlich „einen Spaziergang machen“) ist die feste Wendung für „spazieren gehen“.'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: Ein Plan mit Bedingung
    gloss: Wenn es regnet, bleiben wir drinnen.
    note: '*Als* (wenn) leitet die Bedingung ein; im Hauptsatz *blijven we binnen* stehen Subjekt und Verb umgestellt, weil der Als-Satz zuerst kommt.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: Zustimmen und vorschlagen
    gloss: Gute Idee! Lass uns spazieren gehen.
    note: '*Laten we...* (lass uns .../lasst uns ...) ist eine weitere gängige Art, eine Aktivität vorzuschlagen, neben *Zullen we...?* aus Einheit 11.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: Eine Zwei-Tage-Vorhersage lesen
    gloss: 'Wetterbericht: Am Samstag ist es sonnig und warm. Am Sonntag regnet es den ganzen Tag.'
    note: Achten Sie darauf, welcher Tag welches Wetter hat.
    glosses:
      Weerbericht: Wettervorhersage
      zaterdag: Samstag
      zonnig: sonnig
      warm: warm
      Zondag: Sonntag
      regent: regnet
      hele: ganz
      dag: Tag
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte fragt nach dem Wochenende
    gloss: 'Lotte: Wie ist das Wetter dieses Wochenende?'
    note: '*Dit weekend* (dieses Wochenende) bezieht die Frage auf die nahe Zukunft.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar nennt die Vorhersage
    gloss: 'Omar: Am Samstag ist es sonnig und warm, aber am Sonntag regnet es den ganzen Tag.'
    note: Entspricht genau der Vorhersage aus der Leseübung.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte macht einen Vorschlag
    gloss: 'Lotte: Sollen wir dann am Samstag einen Spaziergang machen?'
    note: '*Dan* (dann) verbindet den Vorschlag direkt mit dem guten Wetter, das Omar gerade beschrieben hat.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar stimmt zu und plant den Sonntag
    gloss: 'Omar: Gute Idee. Und am Sonntag bleiben wir schön drinnen.'
    note: '*Lekker* ist hier ein Füllwort, etwa im Sinne von „schön gemütlich“; es steht oft vor einem Adjektiv oder Verb und lässt die Sache angenehmer klingen.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte legt den Plan fest
    gloss: 'Lotte: Perfekt, dann schauen wir einen Film.'
    note: '*Kijken* (schauen, ansehen) passt natürlich zu *een film* (ein Film).'
