    title: Ein Gespräch über die Jahreszeiten
    gloss: 'Jetzt ist Frühling. Die Tulpen sind schön. Nina fragt: Welche Jahreszeit findest du schön? Omar sagt: Ich mag den Sommer. Im Sommer schwimmen wir. Lotte sagt: Ich mag den Winter. Im Winter laufen wir Schlittschuh.'
    note: Fasst das Taalcafé-Gespräch der vierten Lektion in wörtlicher Rede zusammen, ähnlich wie die Vergleichstexte der Einheiten zu Haushalt, Nachbarschaft, Post, Kochen, Persönlichkeit und Farben.
