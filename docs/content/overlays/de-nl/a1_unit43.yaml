  nl.a1.unit43.lesson03.teach.ik_vind_grammar:
    title: Die Konstruktion mit Ik vind
    gloss: '*Ik vind* + Jahreszeit + Eigenschaft drückt aus, was Sie von einer Jahreszeit halten: Ich finde den Sommer schön.'
    note: Greift die bereits bekannte Meinungsstruktur *Ik vind X Y* auf (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig) – keine neue Grammatik, nur eine neue Verwendung. *vind* hat hier kein -t, weil das Subjekt *Ik* ist (1. Person). Auch in der Frage *Welk seizoen vind jij mooi?* steht kein -t, weil *jij* nach dem Verb steht (Inversion). Die Form der 3. Person *vindt* (wie in *Omar vindt ...*) ist ein eigener, späterer Grammatikpunkt, der noch nicht behandelt wird.
