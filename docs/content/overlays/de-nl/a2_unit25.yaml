teaching:
  nl.a2.unit25.lesson01.teach.fietspad:
    title: Radweg
    gloss: der Radweg
    note: 'Ein Neutrum: het fietspad, zusammengesetzt aus fiets (Fahrrad) und pad (Weg).'
    example_gloss: Der Radweg ist neu.
  nl.a2.unit25.lesson01.teach.wat_vind_je:
    title: Nach der Meinung fragen
    gloss: Was hältst du vom neuen Radweg?
    note: Vinden van (wörtlich „finden von“) ist die übliche Wendung, um nach der Meinung zu etwas Bestimmtem zu fragen oder sie zu äußern.
  nl.a2.unit25.lesson01.teach.wat_is_mening:
    title: Direkt nach der Meinung fragen
    gloss: Was ist deine Meinung?
    note: Mening (Meinung) ist die direkte Nomenform, wenn vinden van zu indirekt wirkt.
  nl.a2.unit25.lesson02.teach.volgens_mij_goed:
    title: Eine Meinung äußern
    gloss: Meiner Meinung nach ist der Radweg eine gute Idee.
    note: Volgens mij (wörtlich „laut mir“, also „meiner Meinung nach“) ist im Niederländischen die gängigste Art, eine persönliche Meinung einzuleiten.
  nl.a2.unit25.lesson02.teach.gevaarlijk:
    title: Gefährlich
    gloss: gefährlich
    note: Ein gebräuchliches Adjektiv, um ein Risiko zu beschreiben.
    example_gloss: Manche Leute finden den Radweg gefährlich.
  nl.a2.unit25.lesson02.teach.volgens_mij_gevaarlijk:
    title: Meinung plus Begründung
    gloss: Meiner Meinung nach ist der Radweg gefährlich, weil er zu schmal ist.
    note: Omdat (weil) leitet den Begründungssatz ein; das Verb rückt ans Satzende (is steht nach te smal), wie im deutschen Nebensatz.
  nl.a2.unit25.lesson03.teach.ben_het_eens:
    title: Zustimmen
    gloss: Ich stimme dir zu.
    note: Het eens zijn met (wörtlich „es einig sein mit“) ist die feste Wendung für „zustimmen“.
  nl.a2.unit25.lesson03.teach.niet_eens:
    title: Widersprechen
    gloss: Ich bin anderer Meinung als du.
    note: 'Niet verneint die feste Wendung: het niet met je eens zijn.'
  nl.a2.unit25.lesson03.teach.gedeeltelijk_eens:
    title: Teilweise zustimmen
    gloss: Ich stimme dir teilweise zu.
    note: Gedeeltelijk (teilweise) wird in dieselbe feste Wendung het met je eens zijn eingefügt – nützlich für eine differenzierte Antwort.
  nl.a2.unit25.lesson04.teach.veiliger_kinderen:
    title: Einen Gegenpunkt anführen
    gloss: Andererseits ist der Radweg für Kinder tatsächlich sicherer.
    note: Aan de andere kant (andererseits) leitet einen Gegenpunkt ein; wel betont hier den Gegensatz und bedeutet nicht einfach „ja“.
  nl.a2.unit25.lesson04.teach.duur_bespaart:
    title: Kosten und Nutzen abwägen
    gloss: Es ist teuer, aber andererseits spart es Zeit.
    note: Maar (aber) und aan de andere kant zusammen bilden einen klassischen Vor- und Nachteil-Gegensatz.
  nl.a2.unit25.lesson05.teach.voetgangers:
    title: Fußgänger
    gloss: die Fußgänger
    note: 'Ein gebräuchliches Nomen im Plural mit de: de voetgangers, von voet (Fuß) und gangers (Gänger).'
    example_gloss: Der Radweg ist für Fußgänger schmal.
  nl.a2.unit25.lesson05.teach.forumbericht:
    title: Einen Forenbeitrag lesen
    gloss: Ich finde den neuen Radweg eine schlechte Idee. Er ist zu schmal, und es gibt zu wenig Platz für Fußgänger. Andererseits verstehe ich, dass die Gemeinde mehr Radfahrer möchte. Meiner Meinung nach sollten sie den Weg breiter machen.
    note: Achten Sie auf die Meinung des Verfassers, seine Begründung, den Gegenpunkt, den er anerkennt, und seinen Vorschlag.
    glosses:
      vind: finden / halten (von) – äußert eine Meinung
      nieuwe: neu
      fietspad: Radweg
      slecht: schlecht
      idee: Idee
      te: zu
      smal: schmal
      weinig: wenig
      ruimte: Platz
      voetgangers: Fußgänger
      andere: andere
      kant: Seite (aan de andere kant = andererseits)
      snap: verstehen (von snappen, umgangssprachlich)
      gemeente: Gemeinde / Stadtverwaltung
      meer: mehr
      fietsers: Radfahrer
      wil: will (von willen)
      Volgens: laut, nach (Volgens mij = meiner Meinung nach)
      moeten: müssen / sollen
      pad: Weg
      breder: breiter (Komparativ von breed)
      maken: machen
  nl.a2.unit25.lesson06.teach.lotte_ask:
    title: Lotte fragt Omar nach seiner Meinung
    gloss: 'Lotte: Was hältst du vom neuen Radweg, Omar?'
    note: Greift das Muster wat vind je van ...? aus Lektion 1 wieder auf, jetzt direkt an Omar gerichtet.
  nl.a2.unit25.lesson06.teach.omar_opinion:
    title: Omar äußert seine Meinung
    gloss: 'Omar: Meiner Meinung nach ist es eine gute Idee, weil es für Radfahrer sicherer ist.'
    note: Verbindet volgens mij mit einer omdat-Begründung und greift das Muster aus Lektion 2 wieder auf.
  nl.a2.unit25.lesson06.teach.lotte_disagree:
    title: Lotte widerspricht teilweise
    gloss: 'Lotte: Da bin ich nicht ganz einverstanden. Für Fußgänger ist er ziemlich schmal.'
    note: Daar (dort/damit) verweist auf Omars Meinung zurück; helemaal (ganz) schwächt den Widerspruch zu „nicht ganz“ ab, es ist keine glatte Ablehnung.
  nl.a2.unit25.lesson06.teach.omar_concede:
    title: Omar zeigt Verständnis und hält dagegen
    gloss: 'Omar: Das verstehe ich, aber andererseits sind jetzt weniger Autos auf der Straße.'
    note: Dat snap ik (Das verstehe ich) erkennt Lottes Punkt an, bevor mit aan de andere kant ein Gegenpunkt folgt.
  nl.a2.unit25.lesson06.teach.lotte_agree_maybe:
    title: Lotte schwächt ihre Position ab
    gloss: 'Lotte: Das stimmt. Vielleicht wird es besser, wenn sie ihn breiter machen.'
    note: Als (wenn) leitet einen Bedingungssatz ein; wordt ist die Präsensform von worden (werden).
  nl.a2.unit25.lesson06.teach.omar_final_agree:
    title: Omar stimmt zu
    gloss: 'Omar: Ja, das denke ich auch.'
    note: Greift dat denk ik ook aus dem Telefongespräch in Unit 22 wieder auf.
  nl.a2.unit25.lesson06.teach.vindt_form:
    title: 'Vindt: die er/sie/es-Form'
    gloss: Omar findet den Radweg eine gute Idee.
    note: Vindt ist die Form der 3. Person Singular von vinden (finden, meinen). Man verwendet sie, wenn man die Meinung einer anderen Person wiedergibt.
