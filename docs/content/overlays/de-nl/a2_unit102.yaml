course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um Missverständnisse mit niet und geen zu klären.
  learning_goal: 'Sagen Sie „noch nicht“, „nicht mehr“ und „keine“: Setzen Sie niet richtig, wählen Sie zwischen niet und geen und verwenden Sie nog niet, niet meer und geen ... meer.'
units:
  nl.a2.unit102.nog_niet_geen_meer:
    title: Noch nicht, keine, nicht mehr
    description: Missverständnisse bei Buchungen, Bestellungen und Terminen mit niet, geen, nog niet, niet meer und geen ... meer richtigstellen.
lessons:
  nl.a2.unit102.lesson01.niet_en_geen:
    title: Niet und geen
  nl.a2.unit102.lesson02.plaats_van_niet:
    title: Wo steht niet?
  nl.a2.unit102.lesson03.niet_of_geen:
    title: niet oder geen wählen
  nl.a2.unit102.lesson04.nog_niet_nog_geen:
    title: Noch nicht
  nl.a2.unit102.lesson05.niet_meer_geen_meer:
    title: Nicht mehr, kein ... mehr
  nl.a2.unit102.lesson06.lotte_en_omar_kamer:
    title: Lotte, Omar und das Zimmer
teaching:
  nl.a2.unit102.lesson01.teach.restaurant:
    title: Im Restaurant
    gloss: das Restaurant / der Tisch / die Reservierung / die Bestellung
    note: Diese vier Nomen begegnen Ihnen in der ganzen Lektion wieder.
    example_gloss:
    - Ich habe einen Tisch im Restaurant.
    - Omar hat eine Reservierung.
    - Noor hat eine Bestellung.
  nl.a2.unit102.lesson01.teach.hotel:
    title: Im Hotel
    gloss: das Hotel / das Zimmer / die Buchung
    note: '*Hotel* ist ein het-Wort; *kamer* und *boeking* sind de-Wörter.'
    example_gloss:
    - Das Hotel ist in Utrecht.
    - Lotte hat ein Zimmer.
    - Ich kenne die Buchung.
  nl.a2.unit102.lesson01.teach.afspraak:
    title: Termine und Nachrichten
    gloss: der Termin / der Arzt / die Zeit / die Nachricht
    note: '*Tijd* hat in dieser Verwendung keinen Plural: Das Wort bezeichnet die Zeit im Allgemeinen.'
    example_gloss:
    - Ich habe einen Termin beim Arzt.
    - Omar hat Zeit.
    - Noor hat eine Nachricht.
  nl.a2.unit102.lesson01.teach.gn_niet_einde:
    title: Niet am Ende
    gloss: Ich arbeite nicht. Ich kenne das Restaurant nicht.
    note: In einem kurzen Satz steht *niet* am Ende. Ein bestimmtes Objekt (*het restaurant*, *de dokter*) steht vor *niet*.
  nl.a2.unit102.lesson01.teach.gn_geen:
    title: Geen statt een
    gloss: Ich habe einen Tisch. Ich habe keinen Tisch.
    note: '*Geen* ersetzt *een* und verneint das Nomen. Man sagt normalerweise nicht *niet een*.'
  nl.a2.unit102.lesson01.teach.zinnen:
    title: Drei verneinte Sätze
    gloss: Ich habe keine Reservierung. Ich kenne das Hotel nicht. Ich habe keine Zeit.
  nl.a2.unit102.lesson02.teach.eigenschappen:
    title: Beschreibende Wörter
    gloss: geöffnet / fertig / teuer / groß / frei
    note: Diese Wörter beschreiben ein Nomen nach *is*.
    example_gloss:
    - Das Restaurant ist geöffnet.
    - Das Zimmer ist groß.
    - Der Tisch ist frei.
  nl.a2.unit102.lesson02.teach.werkwoorden:
    title: Verben rund um Buchungen
    gloss: anrufen / buchen / kommen / können / gehen; angerufen / gebucht
    note: 'Viele Verben bilden das Perfekt mit *heb* + Partizip: *Ik heb gebeld*. Auf *kan* folgt ein zweites Verb im Infinitiv: *Ik kan komen*.'
    example_gloss:
    - Lotte hat angerufen.
    - Ich habe das Zimmer gebucht.
    - Ich kann kommen.
    - Ich gehe zum Restaurant.
  nl.a2.unit102.lesson02.teach.tijd:
    title: Zeitangaben
    gloss: heute / morgen / oft
    note: Zeitangaben stehen meistens vor *niet*.
    example_gloss:
    - Ich komme heute.
    - Omar ruft morgen an.
    - Noor ruft oft an.
  nl.a2.unit102.lesson02.teach.gn_niet_voor:
    title: Niet vor ...
    gloss: Das Zimmer ist nicht groß. Ich gehe nicht ins Restaurant. Ich kann nicht kommen. Ich habe nicht angerufen.
    note: '*Niet* steht vor einem Adjektiv (*niet groot*), vor einer Präpositionalgruppe (*niet naar het restaurant*) und vor dem zweiten Verb (*niet komen*, *niet gebeld*).'
  nl.a2.unit102.lesson02.teach.gn_niet_na:
    title: Niet nach ...
    gloss: Ich habe das Zimmer nicht gebucht. Ich komme morgen nicht.
    note: Ein bestimmtes Objekt (*de kamer*) und eine Zeitangabe (*morgen*, *vandaag*) stehen vor *niet*. Folgt ein Partizip oder ein zweites Verb, steht *niet* davor; in einem einfachen Satz wie *Ik kom morgen niet* steht *niet* am Ende.
  nl.a2.unit102.lesson03.teach.meervoud:
    title: Plural und nicht zählbare Nomen
    gloss: die Zimmer / die Tische / der Platz / das Geld / der Kaffee
    note: '*Kamers* und *tafels* sind Pluralformen. *Geld* und *koffie* haben in dieser Verwendung weder *een* noch einen Plural.'
    example_gloss:
    - Es gibt Zimmer.
    - Es gibt Kaffee.
    - Wir haben Tische.
    - Ich habe Geld.
  nl.a2.unit102.lesson03.teach.gn_geen_regels:
    title: Wann man geen verwendet
    gloss: Ich habe keinen Termin. Es gibt keine Zimmer. Ich habe keine Zeit.
    note: 'Verwenden Sie *geen*, wenn das Nomen *een* hat, keinen Artikel hat oder im Plural steht: *een afspraak*, *tijd*, *kamers*.'
  nl.a2.unit102.lesson03.teach.gn_niet_regels:
    title: Niet oder geen?
    gloss: Ich kenne den Arzt nicht. Der Kaffee ist nicht teuer. Es ist kein Restaurant.
    note: Verwenden Sie *niet* bei einem bestimmten Nomen (*de dokter*), bei einem Adjektiv (*duur*) und bei Verben. Aus *Het is een restaurant* wird *Het is geen restaurant*.
  nl.a2.unit102.lesson04.teach.betalen:
    title: Bezahlen und bestätigen
    gloss: die Rechnung / die Bestätigung / bezahlt / bestellt / da
    note: '*Betaald* und *besteld* sind Partizipien, wie *gebeld* und *geboekt*.'
    example_gloss:
    - Ich habe die Rechnung bezahlt.
    - Die Bestätigung ist da.
    - Noor hat Kaffee bestellt.
  nl.a2.unit102.lesson04.teach.gn_nog_niet:
    title: Nog niet = noch nicht
    gloss: Ich habe das Zimmer noch nicht gebucht. Das Zimmer ist noch nicht fertig.
    note: '*Nog niet* bedeutet „noch nicht“: Es kommt erst noch. Es steht an derselben Stelle wie *niet*, mit *nog* davor.'
  nl.a2.unit102.lesson04.teach.gn_nog_geen:
    title: Nog geen = noch kein ...
    gloss: Ich habe noch kein Zimmer gebucht. Wir haben noch keine Nachricht.
    note: '*Nog geen* + Nomen bedeutet „noch kein ...“. *Nog* steht vor *geen*.'
  nl.a2.unit102.lesson04.teach.antwoord:
    title: Kurze Antworten
    gloss: Ist das Zimmer fertig? Noch nicht. Hast du einen Tisch? Noch nicht.
  nl.a2.unit102.lesson05.teach.woorden:
    title: Nützliche Wörter
    gloss: mehr / leider / voll / will / also
    note: '*Meer* ist das Schlüsselwort dieser Lektion.'
    example_gloss:
    - Das Hotel ist leider voll.
    - Omar will ein Zimmer.
    - Ich habe keine Zeit mehr.
  nl.a2.unit102.lesson05.teach.gn_niet_meer:
    title: Niet meer = nicht mehr
    gloss: Das Restaurant ist nicht mehr geöffnet. Ich arbeite nicht mehr.
    note: '*Niet meer* bedeutet: Früher war es so, jetzt aber nicht mehr. Es steht an der Stelle von *niet*.'
  nl.a2.unit102.lesson05.teach.gn_geen_meer:
    title: Geen ... meer = kein ... mehr
    gloss: Es gibt keine Zimmer mehr. Ich habe keine Zeit mehr.
    note: '*Geen ... meer* bedeutet: Es ist nichts mehr übrig. *Meer* steht nach dem Nomen.'
  nl.a2.unit102.lesson05.teach.gn_contrast:
    title: Nog niet oder niet meer?
    gloss: Das Zimmer ist noch nicht frei. Das Zimmer ist nicht mehr frei.
    note: '*Nog niet*: Es kommt noch. *Niet meer*: Es ist vorbei. Die beiden bedeuten das Gegenteil.'
  nl.a2.unit102.lesson05.teach.reading:
    title: Lotte braucht ein Zimmer
    gloss: Lotte möchte morgen ein Zimmer buchen. Sie ruft im Hotel an, aber das Hotel ist leider voll. Es gibt keine Zimmer mehr. Lotte hat noch kein anderes Zimmer. Deshalb ruft sie in einem anderen Hotel an, aber dieses Hotel ist nicht mehr geöffnet. Lotte hat also noch kein Zimmer.
  nl.a2.unit102.lesson06.teach.ask_kamer:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, hast du das Zimmer gebucht?'
  nl.a2.unit102.lesson06.teach.nog_niet:
    title: Omar antwortet
    gloss: 'Omar: Noch nicht. Ich habe heute keine Zeit.'
  nl.a2.unit102.lesson06.teach.tafel:
    title: Lotte fragt nach
    gloss: 'Lotte: Du hast einen Tisch im Restaurant, oder?'
  nl.a2.unit102.lesson06.teach.klopt_niet:
    title: Omar korrigiert sie
    gloss: 'Omar: Nein, das stimmt nicht. Ich habe keinen Tisch. Das Restaurant ist voll.'
  nl.a2.unit102.lesson06.teach.geen_meer:
    title: Lotte fragt noch einmal
    gloss: 'Lotte: Gibt es keine Tische mehr?'
  nl.a2.unit102.lesson06.teach.helaas:
    title: Omar beendet das Gespräch
    gloss: 'Omar: Nein, leider nicht. Ich rufe morgen an.'
