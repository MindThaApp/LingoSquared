course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um eine kurze Geschichte zu lesen, zu hören und nachzuerzählen.
  learning_goal: Eine kurze Geschichte im Imperfectum lesen oder hören und sie mit Wörtern der Reihenfolge und dem voltooid tegenwoordige tijd in der richtigen Abfolge nacherzählen.
units:
  nl.a2.unit108.een_kort_verhaal:
    title: Eine kurze Geschichte
    description: Lesen oder hören Sie eine kurze Geschichte über einen Ausflug und erzählen Sie sie in der richtigen Reihenfolge nach.
lessons:
  nl.a2.unit108.lesson01.eerst_daarna_toen:
    title: Zuerst, dann, danach
  nl.a2.unit108.lesson02.verhaal_in_het_imperfectum:
    title: Eine Geschichte erzählen
  nl.a2.unit108.lesson03.opschrijven_of_vertellen:
    title: Schreiben oder erzählen
  nl.a2.unit108.lesson04.een_boottocht:
    title: Eine Bootsfahrt
  nl.a2.unit108.lesson05.een_dag_in_het_pretpark:
    title: Ein Tag im Freizeitpark
  nl.a2.unit108.lesson06.vertel_eens:
    title: Erzähl mal!
teaching:
  nl.a2.unit108.lesson01.teach.uitjes:
    title: Ausflüge
    gloss: der Zoo / die Bootsfahrt / der Freizeitpark / die Achterbahn
    note: Das sind die Ausflüge in dieser Einheit.
    example_gloss:
    - Wir gehen in den Zoo.
    - Die Bootsfahrt macht Spaß.
    - Lotte mag die Achterbahn.
  nl.a2.unit108.lesson01.teach.dieren:
    title: Tiere im Zoo
    gloss: der Affe / der Elefant / der Löwe / der Pinguin
    note: 'Plural: *apen, olifanten, leeuwen, pinguïns*.'
    example_gloss:
    - Die Affen sind lustig.
    - Die Elefanten sind groß.
    - Die Löwen schlafen.
  nl.a2.unit108.lesson01.teach.dingen:
    title: Dinge auf einem Ausflug
    gloss: das Foto / das Eis / das Boot / die Gracht
    note: Kleine Dinge, die in den Geschichten wiederkehren.
    example_gloss:
    - Noor macht ein Foto.
    - Omar isst ein Eis.
    - Das Boot fährt durch die Gracht.
  nl.a2.unit108.lesson01.teach.volgorde_woorden:
    title: Wörter für die Reihenfolge der Ereignisse
    gloss: zuerst / danach / dann / anschließend / später / schließlich
    note: Sie bringen die Ereignisse einer Geschichte in eine Reihenfolge. In einer Geschichte bedeutet *toen* „dann“. Das ist nicht dasselbe wie *toen* mit der Bedeutung „als“.
    example_gloss:
    - Zuerst kaufen wir Eintrittskarten.
    - Danach essen wir ein Eis.
    - Schließlich gehen wir nach Hause.
  nl.a2.unit108.lesson01.teach.gn_volgorde:
    title: Zuerst das Wort der Reihenfolge, dann das Verb
    gloss: Zuerst gingen wir in den Zoo. Danach sahen wir die Affen.
    note: 'Steht ein Wort der Reihenfolge am Satzanfang, folgt direkt das Verb und danach das Subjekt: *Eerst gingen we*, *Daarna zagen we*. Das Wort der Reihenfolge kann auch weiter hinten stehen: *We gingen eerst naar de dierentuin*.'
  nl.a2.unit108.lesson01.teach.verhaal:
    title: Eine kurze Geschichte in der richtigen Reihenfolge
    gloss: Zuerst gingen Lotte, Omar und Noor in den Zoo. Danach sahen sie die Affen. Dann aßen sie ein Eis. Schließlich nahmen sie den Bus nach Hause.
  nl.a2.unit108.lesson02.teach.dingen2:
    title: Am Eingang
    gloss: die Eintrittskarte / der Kaffee / die Schlange
    note: 'Plural: *kaartjes*.'
    example_gloss:
    - Ich habe eine Fahrkarte.
    - Omar trinkt Kaffee.
    - Die Schlange ist lang.
  nl.a2.unit108.lesson02.teach.werkwoorden:
    title: Verben für einen Ausflug
    gloss: gehen / sehen / essen / nehmen / laufen / trinken / kaufen / machen / warten / lachen
    note: Die nächsten zwei Karten zeigen die Formen im Imperfectum.
    example_gloss:
    - Wir gehen in den Zoo.
    - Ich sehe die Löwen.
    - Noor wartet auf das Boot.
  nl.a2.unit108.lesson02.teach.gn_onregelmatig:
    title: 'Erzählen: unregelmäßiges Imperfectum'
    gloss: gehen → ging; sehen → sah; essen → aß; nehmen → nahm; laufen → lief; trinken → trank; sein → war/waren
    note: Geschichten werden im Imperfectum erzählt. Die Singularform gehört zu *ik*, *jij/je*, *hij*, *zij* (sie) und einem einzelnen Namen wie *Noor*; die Pluralform zu *we*, *jullie* und *ze* (sie, Plural). Lernen Sie diese Formen als Gruppe.
  nl.a2.unit108.lesson02.teach.gn_regelmatig:
    title: 'Erzählen: regelmäßiges Imperfectum'
    gloss: machen → machte; warten → wartete; lachen → lachte; kaufen → kaufte
    note: 'Viele regelmäßige Verben hängen *-te* (Singular) oder *-ten* (Plural) an den Stamm; hier enden die Stämme auf einen Laut, der *-te(n)* verlangt. Andere regelmäßige Verben haben *-de(n)*, das folgt später. *Kopen* ist ein Sonderfall: *kocht, kochten*.'
  nl.a2.unit108.lesson02.teach.zinnen:
    title: Kleine Ereignisse im Imperfectum
    gloss: Lotte kaufte die Eintrittskarten. Omar trank Kaffee. Noor lachte. Sie warteten lange in der Schlange.
  nl.a2.unit108.lesson03.teach.woorden:
    title: Über gestern sprechen
    gloss: gestern / zusammen / schön, lustig / viel, viele / die Tiere
    note: Nützlich, wenn Sie einem Freund erzählen, was Sie gemacht haben.
    example_gloss:
    - Gestern waren wir im Zoo.
    - Wir waren zusammen im Zoo.
    - Es war schön.
    - Ich habe viele Tiere gesehen.
    - Die Tiere waren groß.
  nl.a2.unit108.lesson03.teach.gn_perfectum:
    title: 'Einem Freund erzählen: voltooid tegenwoordige tijd'
    gloss: Zuerst gingen wir in den Zoo. Danach sahen wir die Affen.
    note: 'Im Gespräch erzählt man meist mit *hebben* oder *zijn* plus Partizip, was man getan hat. Das Hilfsverb steht an zweiter Stelle, das Partizip am Ende: *Eerst zijn we … gegaan*, *Daarna hebben we … gezien*.'
  nl.a2.unit108.lesson03.teach.gn_deelwoorden:
    title: Partizipien mit hebben
    gloss: gesehen / gegessen / genommen / getrunken / gekauft / gemacht / gewartet / gelacht
    note: 'Die meisten Partizipien beginnen mit *ge-*. Regelmäßige Verben enden auf *-t* (*gemaakt, gewacht*); unregelmäßige auf *-en* (*gezien, gegeten, genomen, gedronken*). *Gekocht* endet auf *-t*, obwohl *kopen* im Imperfectum unregelmäßig ist, und *lachen* ist eine Ausnahme: *gelachen*.'
  nl.a2.unit108.lesson03.teach.gn_hulpwerkwoord:
    title: Hebben oder zijn?
    gloss: Ich habe die Affen gesehen. Noor hat Kaffee getrunken. Wir haben gelacht. Ich bin in den Freizeitpark gegangen. Omar war im Zoo. Wir sind gekommen.
    note: 'Die meisten Verben bilden das Perfekt mit *hebben*. Verben des Gehens und Kommens (Bewegung zu einem Ort) und *zijn* selbst haben *zijn*: *gegaan, gekomen, geweest*. Formen: *ik heb / ben, Noor heeft / is, wij hebben / zijn*.'
  nl.a2.unit108.lesson03.teach.gn_contrast:
    title: Geschichte oder Gespräch?
    gloss: Zuerst gingen sie in den Zoo. Zuerst sind wir in den Zoo gegangen.
    note: Eine geschriebene Geschichte steht im Imperfectum (*gingen*). Wenn Sie einem Freund erzählen, was Sie getan haben, verwenden Sie meist die voltooid tegenwoordige tijd (*zijn … gegaan*). Die Reihenfolge der Ereignisse zeigen in beiden Fällen dieselben Wörter.
  nl.a2.unit108.lesson03.teach.zinnen:
    title: Von gestern erzählen
    gloss: Gestern sind wir zusammen in den Zoo gegangen. Wir haben viele Tiere gesehen. Es war schön.
  nl.a2.unit108.lesson04.teach.plaatsen:
    title: Auf der Bootsfahrt
    gloss: die Stadt / die Brücke
    note: Beides sehen Sie vom Boot aus.
    example_gloss:
    - Die Stadt ist schön.
    - Die Brücke ist alt.
    - Wir sehen die Brücke.
  nl.a2.unit108.lesson04.teach.gn_stappen:
    title: Noch ein Partizip mit zijn
    gloss: Noor ist ins Boot gestiegen. Omar hat ein Foto von der Brücke gemacht.
    note: '*Stappen* (treten, einsteigen) ist regelmäßig: *gestapt*. Weil es eine Bewegung in etwas hinein beschreibt, steht es mit *zijn*. *Een foto maken* steht mit *hebben*: *gemaakt*.'
  nl.a2.unit108.lesson04.teach.verhaal:
    title: Die Bootsfahrt in der richtigen Reihenfolge
    gloss: Gestern haben Omar und Noor eine Bootsfahrt gemacht. Zuerst haben sie Eintrittskarten gekauft. Danach sind sie ins Boot gestiegen. Dann haben sie ein Foto von der Brücke gemacht. Anschließend haben sie die Stadt gesehen. Später haben sie Kaffee getrunken. Schließlich sind sie nach Hause gegangen.
  nl.a2.unit108.lesson05.teach.lees:
    title: Ein Tag im Freizeitpark
    gloss: Am Samstag gingen Lotte, Omar und Noor in den Freizeitpark. Zuerst kauften sie Eintrittskarten. Danach fuhren sie Achterbahn. Noor hatte Angst, aber Omar lachte. Dann aßen sie ein Eis. Später warteten sie lange in der Schlange. Nachdem sie gewartet hatten, fuhren sie noch einmal Achterbahn. Schließlich nahmen sie den Bus nach Hause.
    note: Eine Geschichte wird im Imperfectum geschrieben. Achten Sie auf die Wörter der Reihenfolge, um dem Ablauf zu folgen. Ein Satz enthält *hadden gewacht* (nur zum Lesen).
    glosses:
      Zaterdag: Samstag
      bang: ängstlich
      maar: aber
      Nadat: nach
      hadden: hatten
      gewacht: gewartet (Partizip)
      nog: noch einmal
      keer: Zeit
  nl.a2.unit108.lesson05.teach.gn_voltooid_verleden:
    title: 'Erkennen: etwas, das schon geschehen war (nur zum Lesen)'
    gloss: Nachdem sie gewartet hatten, fuhren sie noch einmal Achterbahn.
    note: '*Hadden gewacht* (hatten + Partizip) ist die voltooid verleden tijd (Plusquamperfekt). Sie zeigt, dass etwas vor einem anderen vergangenen Zeitpunkt schon abgeschlossen war. Nach *nadat* stehen die Verben am Ende des Nebensatzes, und der folgende Hauptsatz beginnt mit seinem Verb: *gingen ze*. Sie müssen diese Form nur beim Lesen oder Hören erkennen; wenn Sie selbst erzählen, verwenden Sie das Imperfectum oder die voltooid tegenwoordige tijd.'
  nl.a2.unit108.lesson06.teach.beurt1:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, was hast du gestern gemacht?'
  nl.a2.unit108.lesson06.teach.beurt2:
    title: Omar antwortet
    gloss: 'Omar: Noor und ich haben eine Bootsfahrt gemacht.'
  nl.a2.unit108.lesson06.teach.beurt3:
    title: Lotte fragt, was zuerst kam
    gloss: 'Lotte: Schön! Und was habt ihr zuerst gemacht?'
  nl.a2.unit108.lesson06.teach.beurt4:
    title: Omar erzählt die ersten Ereignisse
    gloss: 'Omar: Zuerst haben wir Eintrittskarten gekauft. Danach sind wir ins Boot gestiegen.'
  nl.a2.unit108.lesson06.teach.beurt5:
    title: Lotte fragt, was danach kam
    gloss: 'Lotte: Und dann?'
  nl.a2.unit108.lesson06.teach.beurt6:
    title: Omar erzählt die Geschichte zu Ende
    gloss: 'Omar: Dann haben wir die Stadt gesehen. Schließlich haben wir Kaffee getrunken.'
