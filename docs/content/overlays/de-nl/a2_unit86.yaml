course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2 für Vorhersagen und Versprechen.
  learning_goal: Sie sagen mit zullen voraus, was geschehen wird, und machen ein Versprechen, grenzen es von gaan ab und drücken mit misschien Zweifel aus.
units:
  nl.a2.unit86.voorspellingen_en_beloftes:
    title: Vorhersagen und Versprechen
    description: Eine Vorhersage machen, ein Versprechen geben und sagen, was geschehen könnte.
lessons:
  nl.a2.unit86.lesson01.het_weer_van_morgen:
    title: Das Wetter von morgen
  nl.a2.unit86.lesson02.ik_zal_het_doen:
    title: Ich werde es tun
  nl.a2.unit86.lesson03.zullen_of_gaan:
    title: Zullen oder gaan?
  nl.a2.unit86.lesson04.misschien:
    title: Vielleicht
  nl.a2.unit86.lesson05.bericht_en_mededeling:
    title: Eine Nachricht und ein Aushang
  nl.a2.unit86.lesson06.lotte_en_omar_beloven:
    title: Lotte und Omar geben Versprechen
teaching:
  nl.a2.unit86.lesson01.teach.weer:
    title: Das Wetter
    gloss: das Wetter / die Sonne / morgen / heute / kalt / warm
    note: Diese Wörter beschreiben das Wetter und den Tag.
    example_gloss:
    - Das Wetter ist heute warm.
    - Die Sonne scheint.
    - Morgen ist es kalt.
  nl.a2.unit86.lesson01.teach.werkwoorden:
    title: Wetterverben
    gloss: regnen / scheinen / sein
    note: '*Regent* und *schijnt* sind Präsensformen für heute. Diese Einheit ergänzt die Zukunft.'
    example_gloss:
    - Heute regnet es.
    - Heute scheint die Sonne.
    - Es ist warm.
  nl.a2.unit86.lesson01.teach.verwachting:
    title: Die Wettervorhersage
    gloss: die Wettervorhersage / laut
    note: '*Volgens* leitet die Quelle einer Vorhersage ein.'
    example_gloss:
    - Die Vorhersage ist gut.
    - Laut Wettervorhersage ist es morgen warm.
  nl.a2.unit86.lesson01.teach.gn_zullen_vormen:
    title: 'Zullen: die Formen'
    gloss: ich werde / du wirst / er, sie, es wird / wir, sie werden
    note: '*Zullen* ist das Verb für Vorhersage und Versprechen. Der Singular lautet *zal* (bei *jij/je* auch *zult*), der Plural *zullen*. In der gesprochenen Kurzform: *we, ze, je*.'
  nl.a2.unit86.lesson01.teach.gn_zullen_zin:
    title: Zullen + Infinitiv
    gloss: Morgen wird es regnen. Morgen wird es regnen.
    note: '*Zal* ist das finite Verb und steht an zweiter Stelle; der Infinitiv steht am Ende des Satzes. Steht zuerst eine Zeitangabe, folgt das Subjekt auf *zal*: *Morgen zal het regenen*. Verwenden Sie *zullen* für eine Vorhersage.'
  nl.a2.unit86.lesson01.teach.zinnen:
    title: Vorhersagesätze
    gloss: Laut Wettervorhersage wird morgen die Sonne scheinen. Es wird kalt sein.
  nl.a2.unit86.lesson02.teach.beloftes:
    title: Wörter für Versprechen
    gloss: versprechen / das Versprechen / tun / helfen / anrufen
    note: Diese Verben sind in Versprechen häufig.
    example_gloss:
    - Ich verspreche es.
    - Das ist ein Versprechen.
    - Ich kann dir helfen.
    - Würdest du mich anrufen?
  nl.a2.unit86.lesson02.teach.afspraken:
    title: Zusagen
    gloss: pünktlich / bestimmt / vergessen / kommen / nicht
    note: '*Op tijd* bedeutet pünktlich, nicht zu spät.'
    example_gloss:
    - Er kommt pünktlich.
    - Ich habe es nicht vergessen.
    - Das werde ich bestimmt tun.
  nl.a2.unit86.lesson02.teach.gn_belofte:
    title: Zullen für ein Versprechen
    gloss: Ich werde es tun. Ich werde dir helfen. Ich rufe dich an.
    note: Mit *ik* kann *zal* ein Versprechen oder eine feste Zusage ausdrücken. Der Infinitiv (*doen, helpen, bellen*) steht am Ende.
  nl.a2.unit86.lesson02.teach.gn_niet:
    title: Niet und op tijd
    gloss: Ich werde es nicht vergessen. Ich werde pünktlich kommen.
    note: '*Niet* steht meist nach *het* und vor dem Infinitiv am Ende: *het niet vergeten*. Auch eine Wendung wie *op tijd* steht vor dem Infinitiv am Ende.'
  nl.a2.unit86.lesson02.teach.zinnen:
    title: Sätze mit Versprechen
    gloss: Wir werden pünktlich kommen. Ich werde es bestimmt tun.
  nl.a2.unit86.lesson03.teach.signalen:
    title: Zeichen und Pläne
    gloss: schau / die Wolke / dunkel / heute Abend / arbeiten / kochen
    note: '*Kijk* lenkt die Aufmerksamkeit auf etwas, das man sehen kann.'
    example_gloss:
    - Schau, die Wolken sind dunkel.
    - Omar arbeitet heute.
    - Ich möchte heute Abend kochen.
  nl.a2.unit86.lesson03.teach.gn_gaan_plan:
    title: Gaan für einen Plan
    gloss: Ich werde morgen arbeiten. Omar wird heute Abend kochen.
    note: '*Gaan* + Infinitiv sagt, was jemand zu tun geplant hat. Der Infinitiv steht am Ende.'
  nl.a2.unit86.lesson03.teach.gn_gaan_zicht:
    title: Gaan für das, was man sieht
    gloss: Schau, die Wolken sind dunkel. Es wird gleich regnen.
    note: 'Verwenden Sie *gaan*, wenn Sie das Anzeichen gerade sehen: dunkle Wolken, also *Het gaat regenen*.'
  nl.a2.unit86.lesson03.teach.gn_contrast:
    title: Zullen und gaan im Vergleich
    gloss: Morgen wird es regnen (Vorhersage). Schau, es wird gleich regnen (ich sehe es). Ich werde morgen arbeiten (Plan). Ich werde es tun (Versprechen).
    note: 'In dieser Einheit: *zullen* für eine Vorhersage oder ein Versprechen, *gaan* für einen Plan oder für etwas, das sich bereits abzeichnet. In der Alltagssprache ist *gaan* auch bei Vorhersagen und sogar Versprechen üblich (*Ik ga het doen*); *zullen* ist typischer für Vorhersagen, Aushänge und förmliche Versprechen.'
  nl.a2.unit86.lesson03.teach.zinnen:
    title: Sätze mit gaan
    gloss: Schau, es wird gleich regnen. Ich werde morgen arbeiten.
  nl.a2.unit86.lesson04.teach.misschien_woorden:
    title: Vielleicht und spät
    gloss: vielleicht / später / spät / zu spät
    note: '*Misschien* zeigt, dass Sie sich nicht sicher sind.'
    example_gloss:
    - Vielleicht komme ich später.
    - Es ist spät.
    - Der Bus hat Verspätung.
  nl.a2.unit86.lesson04.teach.week:
    title: Arbeit und Termine
    gloss: der Termin / die Arbeit / der Kollege, die Kollegin / Montag / Freitag / Samstag
    note: Im Niederländischen werden die Wochentage kleingeschrieben, im Deutschen dagegen großgeschrieben.
    example_gloss:
    - Lotte hat am Freitag einen Termin.
    - Omar hat am Montag Arbeit.
    - Noor arbeitet am Samstag.
  nl.a2.unit86.lesson04.teach.gn_misschien_voorop:
    title: Misschien am Satzanfang
    gloss: Vielleicht kommt Noor morgen. Vielleicht regnet es.
    note: 'Steht *misschien* am Satzanfang, folgt das Verb direkt darauf und danach das Subjekt: *komt Noor*, *regent het*. Setzen Sie das Subjekt nicht vor das Verb.'
  nl.a2.unit86.lesson04.teach.gn_misschien_midden:
    title: Misschien nach dem Verb
    gloss: Noor kommt vielleicht morgen. Es regnet vielleicht.
    note: '*Misschien* kann auch nach dem Verb stehen. Das Verb bleibt an zweiter Stelle, und die Bedeutung ist dieselbe.'
  nl.a2.unit86.lesson04.teach.gn_zeker:
    title: Zeker oder misschien
    gloss: Es wird bestimmt regnen. Vielleicht wird es regnen.
    note: '*Zeker* zeigt, dass Sie sicher sind, *misschien*, dass Sie es nicht sind. Beide lassen sich mit *zal* kombinieren.'
  nl.a2.unit86.lesson04.teach.zinnen:
    title: Sätze mit vielleicht
    gloss: Vielleicht komme ich zu spät. Vielleicht hat Omar Zeit. Vielleicht ist es kalt.
  nl.a2.unit86.lesson05.teach.bericht_woorden:
    title: Wörter für eine Nachricht
    gloss: bleiben / kaufen / Kaffee / Kekse / auch / dann / bis / zu Hause
    note: '*Tot zaterdag* bedeutet „Bis Samstag“.'
    example_gloss:
    - Ich bleibe zu Hause.
    - Ich möchte Kaffee kaufen.
    - Bis morgen!
  nl.a2.unit86.lesson05.teach.mededeling_woorden:
    title: Wörter für Mitteilungen
    gloss: die Mitteilung / die Besprechung / um neun Uhr / alle / da
    note: '*Om negen uur* gibt die Uhrzeit an. *Er zal koffie zijn* bedeutet „Es wird Kaffee geben.“'
    example_gloss:
    - Das ist eine Mitteilung.
    - Die Besprechung ist heute.
    - Alle sind da.
  nl.a2.unit86.lesson05.teach.gn_weerbericht:
    title: Vorhersage-Stil
    gloss: Am Morgen wird die Sonne scheinen. Am Nachmittag wird es regnen.
    note: Vorhersagen und Mitteilungen verwenden oft *zullen*. Eine Zeitangabe steht am Satzanfang, danach folgt *zal* und dann das Subjekt.
  nl.a2.unit86.lesson05.teach.lezen_bericht:
    title: Noors Nachricht
    gloss: Hallo Lotte und Omar, laut Wettervorhersage wird es am Samstag regnen. Vielleicht bleiben wir dann zu Hause. Ich kaufe Kaffee und Kekse. Ich komme auch pünktlich. Bis Samstag! Noor
    note: Finden Sie die Vorhersage, den unsicheren Plan und die Versprechen.
    glosses:
      volgens: laut
      weersverwachting: die Vorhersage
      blijven: bleiben
      koffie: Kaffee
      koekjes: Kekse
      kopen: kaufen
      tot: bis / bis dann
  nl.a2.unit86.lesson05.teach.lezen_mededeling:
    title: Eine Mitteilung
    gloss: Mitteilung. Morgen beginnt die Besprechung um neun Uhr. Alle werden pünktlich kommen. Es wird Kaffee geben.
    note: Eine Mitteilung sagt, was geschehen wird.
    glosses:
      vergadering: die Besprechung
      negen: neun
      uur: Uhr
      iedereen: alle
      koffie: Kaffee
  nl.a2.unit86.lesson06.teach.lotte1:
    title: Lotte fragt nach Samstag
    gloss: 'Lotte: Hallo Omar, gehst du am Samstag arbeiten?'
  nl.a2.unit86.lesson06.teach.omar1:
    title: Omar ist nicht sicher
    gloss: 'Omar: Vielleicht arbeite ich am Samstag. Ich rufe dich an.'
  nl.a2.unit86.lesson06.teach.lotte2:
    title: Lotte nennt die Vorhersage
    gloss: 'Lotte: Laut Wettervorhersage wird es am Samstag regnen.'
  nl.a2.unit86.lesson06.teach.omar2:
    title: Omar macht einen Plan
    gloss: 'Omar: Dann bleibe ich vielleicht zu Hause. Ich werde kochen.'
  nl.a2.unit86.lesson06.teach.lotte3:
    title: Lotte bietet an, Kekse zu kaufen
    gloss: 'Lotte: Schön! Ich kaufe Kekse.'
  nl.a2.unit86.lesson06.teach.omar3:
    title: Omar bittet um ein Versprechen
    gloss: 'Omar: Versprichst du es?'
  nl.a2.unit86.lesson06.teach.lotte4:
    title: Lotte verspricht es
    gloss: 'Lotte: Ich verspreche es.'
