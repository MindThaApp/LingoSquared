teaching:
  nl.a2.unit84.lesson01.teach.reiswoorden:
    title: Länder, Essen und Reisen
    gloss: Belgien / Deutschland / Ägypten / Sushi / ägyptisch / reisen / essen / eine Bootsfahrt machen
    note: Das sind die Wörter zu Reisen und Essen, die in dieser Lektion vorkommen.
    example_gloss:
    - Ich reise gern.
    - Ich esse gern Sushi.
    - Ich habe eine Bootsfahrt gemacht.
  nl.a2.unit84.lesson01.teach.ervaringswoorden:
    title: Wörter für Erfahrungen
    gloss: je / noch nie / gewesen / gegessen / gereist
    note: Verwenden Sie *ooit* in Fragen und *nog nooit*, wenn etwas bis jetzt noch nie geschehen ist.
    example_gloss:
    - Warst du schon einmal in Belgien?
    - Ich habe noch nie Sushi gegessen.
  nl.a2.unit84.lesson01.teach.gn_vragen:
    title: Erfahrungsfragen im Perfekt
    gloss: Hast du schon einmal Sushi gegessen? Warst du schon einmal in Belgien?
    note: 'Nach einer Tätigkeit fragen Sie mit *hebben*: *Heb je ooit ... gegeten?* Nach einem Aufenthalt an einem Ort fragen Sie mit *zijn*: *Ben je ooit ... geweest?* Das Partizip steht am Ende.'
  nl.a2.unit84.lesson01.teach.gn_antwoorden:
    title: Kurze Antworten
    gloss: Ja, das habe ich schon einmal gemacht. Nein, noch nie.
    note: '*Al eens* sagt, dass es schon einmal passiert ist. *Nog nooit* sagt, dass es bis jetzt noch nie passiert ist.'
  nl.a2.unit84.lesson02.teach.activiteiten:
    title: Reiseaktivitäten
    gloss: eine Bootsfahrt machen / ein Museum besuchen / in einem Hotel schlafen / zweimal arbeiten
    note: Diese Infinitivwendungen werden auf der nächsten Karte zu Erfahrungen im Perfekt.
    example_gloss:
    - Ich mache eine Bootsfahrt.
    - Ich besuche ein Museum.
  nl.a2.unit84.lesson02.teach.voltooide_ervaringen:
    title: Partizipien für Erfahrungen
    gloss: gemacht / besucht / geschlafen / gearbeitet
    note: 'Verwenden Sie diese mit *hebben*: *heb gemaakt, heeft bezocht, heb geslapen, heb gewerkt*.'
    example_gloss:
    - Ich habe eine Bootsfahrt gemacht.
    - Ich habe in einem Hotel geschlafen.
  nl.a2.unit84.lesson02.teach.gn_al_nog_niet:
    title: Schon versus noch nicht
    gloss: Das habe ich schon gemacht. Das habe ich noch nicht gemacht.
    note: '*Al* kennzeichnet eine bereits gemachte Erfahrung. *Nog niet* sagt, dass es bis jetzt nicht passiert ist, aber noch passieren kann. Beide stehen vor dem Partizip.'
  nl.a2.unit84.lesson02.teach.gn_positie:
    title: Wo das Erfahrungswort steht
    gloss: Ich habe schon zweimal gearbeitet. Ich war noch nie in Deutschland.
    note: 'Bei *hebben* steht *al/twee keer* vor dem Partizip. Bei *zijn ... geweest* steht *nog nooit* vor der Ortsangabe: *nog nooit in Duitsland geweest*.'
  nl.a2.unit84.lesson03.teach.tijdwoorden:
    title: Wörter für einen bestimmten Zeitpunkt in der Vergangenheit
    gloss: gestern / letztes Jahr / damals / oft
    note: '*Gisteren, vorig jaar* und *toen* verweisen auf einen bestimmten Zeitpunkt in der Vergangenheit; beim Erzählen steht dann oft das Imperfekt.'
    example_gloss:
    - Gestern habe ich gearbeitet.
    - Letztes Jahr bin ich oft gereist.
  nl.a2.unit84.lesson03.teach.verhaalvormen:
    title: Formen des Imperfekts
    gloss: aß / war / besuchte / reiste
    note: Diese Formen berichten von einem bestimmten Zeitpunkt in der Vergangenheit. Das regelmäßige Imperfekt wurde in Lektion 82 behandelt, die unregelmäßigen Formen in Lektion 83.
    example_gloss:
    - Gestern habe ich Sushi gegessen.
    - Letztes Jahr war ich in Deutschland.
  nl.a2.unit84.lesson03.teach.gn_contrast:
    title: Erfahrung versus datiertes Ereignis
    gloss: Hast du schon einmal Sushi gegessen? Gestern habe ich Sushi gegessen.
    note: Verwenden Sie das Perfekt, um zu fragen, ob man etwas schon einmal erlebt hat. Verwenden Sie das Imperfekt, um eine Geschichte zu erzählen, die an einen bestimmten Zeitpunkt in der Vergangenheit gebunden ist.
  nl.a2.unit84.lesson03.teach.gn_rule:
    title: Faustregel
    gloss: 'Erfahrung: Ich habe Sushi gegessen. Bestimmte Geschichte: Gestern habe ich Sushi gegessen.'
    note: 'Fragen Sie sich: „Ist es im Leben eines Menschen schon einmal passiert?“ Dann wählen Sie das Perfekt. Wenn Sie erzählen, was zu einem genannten Zeitpunkt in der Vergangenheit geschah, wählen Sie das Imperfekt.'
  nl.a2.unit84.lesson04.teach.vragenlijst:
    title: Der Fragebogen
    gloss: der Fragebogen / ägyptisches Essen / eine Bootsfahrt machen / ein Museum besuchen
    note: Freunde vergleichen anhand dieser Themen ihre Erfahrungen.
    example_gloss:
    - Wir füllen den Fragebogen aus.
    - Ich möchte ägyptisch essen.
  nl.a2.unit84.lesson04.teach.gn_kort_antwoord:
    title: Eine Frage mit hebben beantworten
    gloss: Hast du schon einmal ägyptisch gegessen? Ja, das habe ich schon einmal gemacht. Nein, noch nie.
    note: Die kurze vollständige Antwort verwendet *dat heb ik ... gedaan*, um auf die Tätigkeit zurückzuverweisen.
  nl.a2.unit84.lesson04.teach.gn_zijn_antwoord:
    title: Eine Frage mit zijn beantworten
    gloss: Warst du schon einmal in Ägypten? Nein, ich war noch nie in Ägypten.
    note: 'Behalten Sie *zijn* bei *geweest*. Eine neutrale Reihenfolge ist *nog nooit + place + geweest* (der Ort kann auch an den Anfang rücken: *in Egypte nog nooit*).'
  nl.a2.unit84.lesson05.teach.noor_profiel:
    title: Noors Reiseprofil
    gloss: Noor reist und isst gern. Sie war schon zweimal in Deutschland und hat dort einmal in einem kleinen Hotel geschlafen. Sie hat oft deutsches Brot gegessen. Sie war noch nie in Ägypten und hat noch nie eine Bootsfahrt gemacht. Ein Museum in Belgien hat sie schon besucht.
    note: Das Profil stellt bereits gemachte Erfahrungen (*al, al eens, twee keer, vaak*) Erfahrungen gegenüber, die noch nie stattgefunden haben (*nog nooit*).
    glosses:
      houdt: liebt
      reizen: das Reisen
      twee: zwei
      keer: Mal
      klein: klein
      Duits: deutsch
      brood: Brot
      boottocht: Bootsfahrt
      museum: Museum
      bezocht: besucht
