teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: Die alltägliche Vergangenheit im Niederländischen
    gloss: Im Gespräch steht für ein abgeschlossenes Ereignis meist hebben oder zijn plus Partizip Perfekt.
    note: Das Niederländische verwendet im Gespräch für Vergangenes meist diese Perfektform, ähnlich wie das gesprochene Deutsche. *Ik heb koffie gedronken* heißt „Ich habe Kaffee getrunken“.
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: Ich habe Kaffee getrunken
    gloss: trinken → Ich habe Kaffee getrunken.
    note: '*Heb* ist das Hilfsverb und *gedronken* ist das Partizip Perfekt von *drinken*.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: Ich bin zum Supermarkt gegangen
    gloss: gehen → Ich bin zum Supermarkt gegangen.
    note: '*Gaan* bildet das Perfekt mit *zijn*: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: Das Partizip steht am Ende
    gloss: 'Das Partizip Perfekt steht am Ende: Ik heb koffie gedronken. Denken Sie an die Endstellung von op in Ik sta op.'
    note: In Lektion 10 haben Sie schon geübt, auf ein wichtiges Element am Satzende zu achten. Hier ist das letzte Element das Partizip Perfekt.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: Die meisten Verben bilden das Perfekt mit hebben
    gloss: Die meisten Verben verwenden hebben.
    note: In dieser Einheit verwenden Sie *hebben* mit *drinken*, *eten*, *werken* und *kopen*.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken mit hebben
    gloss: trinken → Ich habe Kaffee getrunken.
    note: Das vollständige Muster lautet *ik + heb + Objekt + gedronken*.
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten mit hebben
    gloss: essen → Ich habe Brot gegessen.
    note: Das Partizip Perfekt von *eten* ist *gegeten*.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken mit hebben
    gloss: arbeiten → Ich habe gearbeitet.
    note: Das Partizip Perfekt von *werken* ist *gewerkt*.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen mit hebben
    gloss: kaufen → Ich habe Äpfel gekauft.
    note: Das Partizip Perfekt von *kopen* ist *gekocht*.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan und komen verwenden zijn
    gloss: Bei gaan und komen verwenden Sie zijn.
    note: Diese beiden häufigen Bewegungsverben bilden das hier gelernte Perfekt mit *zijn*, nicht mit *hebben*.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan mit zijn
    gloss: gehen → Ich bin zum Supermarkt gegangen.
    note: Verwenden Sie *ben* mit *ik* und setzen Sie *gegaan* ans Ende.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen mit zijn
    gloss: kommen → Ich bin ins Sprachcafé gekommen.
    note: Verwenden Sie *ben* mit *ik* und setzen Sie *gekomen* ans Ende.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: Die Hilfsverben im Vergleich
    gloss: Ich habe gearbeitet, aber ich bin zum Supermarkt gegangen.
    note: '*Werken* steht mit *hebben*; *gaan* steht mit *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: Gestern, heute Morgen
    gloss: gestern, heute Morgen
    note: '*Gisteren* bezeichnet den Tag vor heute; *vanmorgen* bezieht sich auf den heutigen Morgen.'
    example_gloss:
    - Gestern habe ich gearbeitet.
    - Heute Morgen um acht habe ich Kaffee getrunken.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: Ich habe gestern gearbeitet
    gloss: Gestern habe ich gearbeitet.
    note: Steht *gisteren* am Satzanfang, kommt *heb* vor *ik*.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: Kaffee heute Morgen
    gloss: Heute Morgen um acht habe ich Kaffee getrunken.
    note: Hier wird *om acht uur* aus dem Uhrzeit-System von Einheit 4 wieder verwendet.
  nl.a1.unit12.lesson04.teach.time_order:
    title: Steht die Zeitangabe vorn, ändert sich die Wortstellung
    gloss: 'Nach Gisteren oder Vanmorgen steht das Verb vor ik: Gisteren heb ik ...'
    note: Das ist dieselbe Wortstellung mit dem Verb vor *ik*, die Sie in Einheit 10 schon nach *daarna* gesehen haben.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: Ein Bericht über Kürzliches
    gloss: Heute Morgen bin ich zum Supermarkt gegangen. Ich habe Äpfel gekauft. Danach bin ich ins Sprachcafé gegangen. Dort habe ich Kaffee getrunken.
    note: Achten Sie beim Lesen auf die Zeitangabe, die Orte und jede abgeschlossene Handlung.
    glosses:
      Vanmorgen: heute Morgen
      supermarkt: Supermarkt
      gegaan: gegangen
      appels: Äpfel
      gekocht: gekauft
      Daarna: danach
      taalcafé: Sprachcafé
      Daar: dort
      koffie: Kaffee
      gedronken: getrunken
  nl.a1.unit12.lesson06.teach.question:
    title: Was hast du gestern gemacht?
    gloss: 'Lotte: Was hast du gestern gemacht, Omar?'
    note: '*Wat heb je ... gedaan?* ist die übliche informelle Frage, um zu erfahren, was jemand gemacht hat.'
  nl.a1.unit12.lesson06.teach.answer:
    title: Omars drei Handlungen
    gloss: 'Omar: Ich habe gearbeitet. Danach bin ich zum Supermarkt gegangen. Ich habe Äpfel gekauft.'
    note: Die Antwort nennt drei einfache abgeschlossene Handlungen in getrennten Sätzen.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: Und heute Morgen?
    gloss: 'Lotte: Und was hast du heute Morgen gemacht?'
    note: Ersetzen Sie *gisteren* durch *vanmorgen*, um nach einer anderen Zeit zu fragen.
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Omar ist ins Sprachcafé gekommen
    gloss: 'Omar: Heute Morgen bin ich um acht Uhr ins Sprachcafé gekommen.'
    note: '*Komen* steht mit *zijn*: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Lotte hat Kaffee getrunken
    gloss: 'Lotte: Schön. Ich habe heute Morgen Kaffee getrunken.'
    note: '*Drinken* steht mit *hebben*: *heb ... gedronken*.'
