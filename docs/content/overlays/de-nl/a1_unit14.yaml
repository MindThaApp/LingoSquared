teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: Den Komparativ bilden
    gloss: Bei Vergleichen hängt man oft -er an das Adjektiv und verwendet dan.
    note: '*Dan* entspricht dem deutschen „als“ im Vergleich. Es steht immer nach dem Komparativ des Adjektivs.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: Groß, klein
    gloss: groß, klein
    note: '*Groot* und *klein* sind die Grundformen der Adjektive, bevor -er angefügt wird.'
    example_gloss:
    - Der Rucksack ist groß.
    - Die Tasche ist klein.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: Der Rucksack ist größer
    gloss: Der Rucksack ist größer als die Tasche.
    note: '*Groter* ist *groot* + *er*; *dan* leitet das zweite Element des Vergleichs ein.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: Die Tasche ist kleiner
    gloss: Die Tasche ist kleiner als der Rucksack.
    note: '*Kleiner* ist *klein* + *er* und folgt demselben Muster.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: Der Preis des Rucksacks
    gloss: Der Rucksack kostet fünfundvierzig Euro.
    note: '*Kost* ist die dritte Person Singular von *kosten*.'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: Der Preis der Tasche
    gloss: Die Tasche kostet zwanzig Euro.
    note: Ein niedrigerer Preis als beim Rucksack – die Grundlage für den folgenden Vergleich.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: Teuer, billig
    gloss: teuer, billig
    note: '*Duur* und *goedkoop* sind die Grundformen der Adjektive, bevor *-der* bzw. *-er* angefügt wird.'
    example_gloss:
    - Der Rucksack ist teuer.
    - Die Tasche ist billig.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: Der Rucksack ist teurer
    gloss: Der Rucksack ist teurer als die Tasche.
    note: '*Duurder* ist *duur* + *der*. Nach einem Wort, das schon auf r endet, hängt das Niederländische *-der* statt *-er* an.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: Die Tasche ist billiger
    gloss: Die Tasche ist billiger als der Rucksack.
    note: '*Goedkoper* ist *goedkoop* + *er*, das Spiegelbild des vorherigen Satzes.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: Gleichheit ausdrücken
    gloss: Verwenden Sie net zo plus Adjektiv plus als, um zwei Dinge als gleich zu vergleichen.
    note: Das entspricht dem deutschen Muster „genauso ... wie“.
  nl.a1.unit14.lesson03.teach.mooi:
    title: Genauso schön
    gloss: Dieser Rucksack ist genauso schön wie jene Tasche.
    note: '*Mooi* (schön, hübsch) steht unverändert zwischen *net zo* und *als* – in diesem Muster gibt es keine Endung -er.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: Genauso praktisch
    gloss: Der Rucksack ist genauso alltagstauglich wie die Tasche.
    note: Jedes einfache Adjektiv kann in dieselbe Lücke von *net zo ... als* eingesetzt werden.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: Den Superlativ bilden
    gloss: Beim Superlativ verwendet man oft het plus Adjektiv plus -st.
    note: Diese prädikative Form (nach *is*) steht mit *het*, unabhängig vom Geschlecht des Nomens.
  nl.a1.unit14.lesson04.teach.duurst:
    title: Der teuerste von beiden
    gloss: Von diesen beiden ist der Rucksack der teuerste.
    note: '*Duurst* ist *duur* + *st*. Das Niederländische kann den Superlativ auch bei nur zwei Möglichkeiten verwenden, ähnlich wie man im Deutschen manchmal „der Beste von beiden“ sagt.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'Unregelmäßig: goed, beter, best'
    gloss: 'Goed, beter, best sind unregelmäßig: Dies ist die beste Wahl. Veel, meer, meest funktioniert genauso.'
    note: Wie im Deutschen bei gut/besser/am besten und viel/mehr/am meisten folgt keine der beiden Reihen (*goed/beter/best*, *veel/meer/meest*) dem regelmäßigen Muster -er/-st.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: Die beste Wahl für die Reise
    gloss: Dieser Rucksack ist die beste Wahl für eine lange Zugreise.
    note: '*Beste* ist die attributive Form (vor einem Nomen) mit der Endung -e, die niederländische Adjektive vor einem Nomen meist bekommen.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: Mehr Platz
    gloss: Der Rucksack hat mehr Platz als die Tasche.
    note: '*Meer* ist der unregelmäßige Komparativ von *veel* (viel), so wie im Deutschen „mehr“ statt „vielder“.'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: Eine Anzeige aus dem Geschäft lesen
    gloss: 'Rucksack Bergsport: fünfundvierzig Euro. Dieser Rucksack ist groß und stark. Schultertasche Stad: zwanzig Euro. Diese Tasche ist kleiner und leichter als der Rucksack, aber weniger stabil. Für eine lange Reise ist der Rucksack die beste Wahl, denn er ist stärker und hat mehr Platz.'
    note: Achten Sie auf die Preise und Größen der beiden Produkte und darauf, welches die Anzeige empfiehlt und warum.
    glosses:
      Rugzak: Rucksack
      vijfenveertig: fünfundvierzig
      euro: Euro
      groot: groß
      sterk: stark
      Schoudertas: Schultertasche
      twintig: zwanzig
      tas: die Tasche
      kleiner: kleiner
      lichter: leichter
      minder: weniger
      lange: lang
      reis: Reise
      beste: beste
      keuze: Wahl
      sterker: stärker
      ruimte: Platz
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte weist auf die Größe hin
    gloss: 'Lotte: Schau, dieser Rucksack ist größer als die Tasche da.'
    note: '*Kijk* (schau) ist eine gängige Art, die Aufmerksamkeit von jemandem auf etwas zu lenken.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar erklärt, warum er ihn braucht
    gloss: 'Omar: Ja, und er hat mehr Platz. Ich brauche eine große Tasche für die Zugreise.'
    note: '*Nodig hebben* (brauchen) ist eine feste Verbindung; das Benötigte steht zwischen *hebben* und *nodig*.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte bestätigt die Wahl
    gloss: 'Lotte: Dann ist der Rucksack die beste Wahl für dich.'
    note: '*Dan* bedeutet hier „dann, in dem Fall“ und nicht das *dan* des Vergleichs aus der früheren Lektion – dieselbe Schreibweise gilt für beide Verwendungen.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar fragt Lotte nach ihrer Meinung
    gloss: 'Omar: Genau. Welche Tasche findest du am schönsten?'
    note: '*Vind jij het mooist* verwendet das Muster zum Ausdrücken einer Meinung aus den *vinden*-Lektionen von Einheit 13 wieder.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte wählt die Umhängetasche
    gloss: 'Lotte: Ich finde diese Umhängetasche am schönsten. Und sie ist leicht.'
    note: '*Licht* (leicht im Gewicht) ist ein neues, nützliches Adjektiv, um Taschen und Gepäck zu beschreiben.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: Sie treffen die Entscheidung
    gloss: 'Omar: Gut, dann kaufe ich den Rucksack und du die Umhängetasche.'
    note: Im zweiten Teilsatz entfällt das wiederholte Verb *koop* – im gesprochenen Niederländisch ist das natürlich, wenn es aus dem Zusammenhang klar ist.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop vs. koopt
    gloss: Koop ist die ich-Form von kopen (kaufen); koopt ist die er- bzw. sie-Form.
    note: 'Regelmäßiges Muster im Präsens: *ik koop*, *jij/hij/zij koopt*.'
