course:
  title: Niederländisch A2
  description: 'Niederländisch A2 mit Schwerpunkt Grammatik: höfliche Bitten, Angebote und Antworten.'
  learning_goal: Sie bitten höflich mit zou je/u ... kunnen, bieten Hilfe mit zal ik an, mildern Aufforderungen mit even und eens ab und nehmen Angebote an oder lehnen sie ab.
units:
  nl.a2.unit89.beleefd_vragen:
    title: Höfliche Bitten
    description: Um Hilfe bitten, Hilfe anbieten und höflich annehmen oder ablehnen – mit Freunden, Nachbarn und Verkaufspersonal.
lessons:
  nl.a2.unit89.lesson01.zou_je_kunnen:
    title: Könntest du mir helfen?
  nl.a2.unit89.lesson02.je_of_u:
    title: Je oder u?
  nl.a2.unit89.lesson03.zal_ik:
    title: Soll ich das machen?
  nl.a2.unit89.lesson04.even_en_eens:
    title: Even und eens
  nl.a2.unit89.lesson05.graag_of_nee_hoor:
    title: Ja, bitte oder nein, danke
  nl.a2.unit89.lesson06.koffie_bij_lotte:
    title: Kaffee bei Lotte
teaching:
  nl.a2.unit89.lesson01.teach.buren:
    title: Nachbarn und Geschäfte
    gloss: der Nachbar / die Nachbarin / das Geschäft / der Supermarkt
    note: Diese Wörter bezeichnen die Personen und Orte in dieser Lektion.
    example_gloss:
    - Mein Nachbar ist nett.
    - Der Nachbar geht zum Geschäft.
    - Der Supermarkt ist geöffnet.
  nl.a2.unit89.lesson01.teach.spullen:
    title: Dinge, nach denen man fragt
    gloss: die Tasche / der Schlüssel / das Paket / die Einkäufe
    note: '*Boodschappen* steht immer im Plural: Es bedeutet „die Einkäufe“.'
    example_gloss:
    - Die Tasche ist schwer.
    - Wo ist der Schlüssel?
    - Das Paket ist groß.
    - Ich habe viele Einkäufe.
  nl.a2.unit89.lesson01.teach.werkwoorden:
    title: Verben für Bitten
    gloss: helfen / bringen / holen / kaufen
    note: '*Halen* bedeutet, etwas holen zu gehen.'
    example_gloss:
    - Ich helfe dem Nachbarn.
    - Ich bringe das Paket.
    - Ich hole Brot.
    - Ich kaufe Kaffee.
  nl.a2.unit89.lesson01.teach.gn_zou_je:
    title: Eine höfliche Bitte mit zou je ... kunnen
    gloss: Könntest du mir helfen?
    note: Zou je + das, was du möchtest + kunnen + das Verb. Das Hauptverb steht ganz am Ende.
  nl.a2.unit89.lesson01.teach.zinnen:
    title: Drei höfliche Bitten
    gloss: Könntest du den Schlüssel holen? Könntest du das Paket bringen? Könntest du die Einkäufe kaufen?
  nl.a2.unit89.lesson01.teach.natuurlijk:
    title: Einer Bitte zustimmen
    gloss: Ja, natürlich.
  nl.a2.unit89.lesson02.teach.diensten:
    title: Personen und Dienstleistungen
    gloss: mein Herr / meine Dame / der Bäcker / die Post
    note: Verwenden Sie *meneer* und *mevrouw* für Personen, die Sie nicht gut kennen.
    example_gloss:
    - Guten Morgen, mein Herr.
    - Guten Tag, meine Dame.
    - Der Bäcker hat Brot.
    - Das Postamt ist in der Nähe.
  nl.a2.unit89.lesson02.teach.brood:
    title: Beim Bäcker und auf der Post
    gloss: das Brot / dies / wiegen / schneiden / einpacken
    note: '*Dit* zeigt auf etwas, das nah bei Ihnen ist.'
    example_gloss:
    - Das Brot ist frisch.
    - Dieses Paket ist schwer.
  nl.a2.unit89.lesson02.teach.gn_u:
    title: Je oder u
    gloss: Könntest du mir helfen? (zu einem Freund) Könnten Sie mir helfen? (zu einer fremden Person)
    note: Verwenden Sie *je* bei Freunden und Familie (wie das deutsche „du“). Verwenden Sie *u* bei Fremden, älteren Menschen und in vielen Geschäften und Ämtern (wie das deutsche „Sie“). Nur das Pronomen ändert sich; der Rest des Satzes bleibt gleich.
  nl.a2.unit89.lesson02.teach.gn_alstublieft:
    title: 'Bitte: alsjeblieft oder alstublieft'
    gloss: Könntest du das bitte wiegen? (Freund) Könnten Sie das bitte wiegen? (formell)
    note: '*Alsjeblieft* gehört zu *je*, *alstublieft* zu *u*.'
  nl.a2.unit89.lesson02.teach.zinnen:
    title: Formelle Bitten
    gloss: Könnten Sie das Brot schneiden? Könnten Sie dieses Paket wiegen? Könnten Sie das einpacken?
  nl.a2.unit89.lesson03.teach.werkwoorden:
    title: Verben für Angebote
    gloss: tragen / aufsetzen (Kaffee) / bezahlen / der Kaffee / für
    note: '*Koffie zetten* bedeutet, Kaffee zu kochen.'
    example_gloss:
    - Ich trage die Tasche.
    - Ich koche Kaffee für den Nachbarn.
    - Ich bezahle den Kaffee.
  nl.a2.unit89.lesson03.teach.gn_zal:
    title: Hilfe anbieten mit zal ik
    gloss: Soll ich die Tasche tragen?
    note: '*Zal ik ...?* bietet an, selbst etwas zu tun. Das Hauptverb steht am Ende.'
  nl.a2.unit89.lesson03.teach.gn_voor:
    title: Voor je oder voor u
    gloss: Soll ich Kaffee für dich kochen? (Freund) Soll ich Kaffee für Sie kochen? (formell)
    note: Ergänzen Sie *voor je* bei einem Freund oder *voor u* bei einer fremden Person, um zu sagen, für wen die Hilfe gedacht ist.
  nl.a2.unit89.lesson03.teach.gn_contrast:
    title: Bitten oder anbieten
    gloss: Könntest du die Tasche tragen? Soll ich die Tasche tragen?
    note: '*Zou je ... kunnen?* bittet die andere Person, etwas zu tun. *Zal ik ...?* bietet an, selbst etwas zu tun.'
  nl.a2.unit89.lesson03.teach.zinnen:
    title: Drei Angebote
    gloss: Soll ich Kaffee machen? Soll ich die Einkäufe holen? Soll ich bezahlen?
  nl.a2.unit89.lesson04.teach.werkwoorden:
    title: Kleine Handlungen an der Tür
    gloss: drinnen / sitzen / warten / schauen / geben
    note: '*Binnen* gehört zu *komen* (hereinkommen).'
    example_gloss:
    - Der Nachbar kommt herein.
    - Ich sitze auf dem Stuhl.
    - Ich warte auf den Nachbarn.
    - Ich schaue das Paket an.
    - Ich gebe den Schlüssel.
  nl.a2.unit89.lesson04.teach.gn_imperatief:
    title: Der Imperativ
    gloss: Komm herein. Setz dich. Warte. Schau. Gib den Schlüssel.
    note: 'Der Imperativ ist der Verbstamm, ohne *je*: *komen* wird zu *kom*, *gaan* wird zu *ga*, *geven* wird zu *geef*.'
  nl.a2.unit89.lesson04.teach.gn_even_eens:
    title: Even und eens machen den Befehl weicher
    gloss: Komm doch herein. Setz dich doch. Warte mal kurz. Schau mal.
    note: '*Even* und *eens* machen eine Aufforderung freundlicher. *Even* mildert oft nur die Bitte, kann aber auch etwas Kurzes andeuten.'
  nl.a2.unit89.lesson04.teach.gn_u_imperatief:
    title: Höfliche Einladungen mit u
    gloss: Kommen Sie bitte herein. Nehmen Sie bitte Platz.
    note: 'Um zu jemandem, den man mit *u* anspricht, höflich zu sein, steht das finite Verb vor *u*: *komt u, gaat u*.'
  nl.a2.unit89.lesson04.teach.zinnen:
    title: Even in Bitten
    gloss: Gib mir mal kurz den Schlüssel. Könntest du kurz warten?
    note: '*Me* ist die Kurzform von *mij*.'
  nl.a2.unit89.lesson05.teach.woorden:
    title: An der Tür
    gloss: die Tür / öffnen / schwer / viel
    note: '*Opendoen* ist ein Verb: *Zal ik de deur opendoen?*'
    example_gloss:
    - Die Tasche ist schwer.
    - Ich habe viele Einkäufe.
    - Soll ich die Tür öffnen?
  nl.a2.unit89.lesson05.teach.gn_accept:
    title: Ein Angebot annehmen
    gloss: Gern, danke. (Freund) Gern, danke. (formell)
    note: '*Graag* bedeutet „gern, ja bitte“. Unter Freunden ergänzen Sie *dank je*, in formellen Situationen *dank u*.'
  nl.a2.unit89.lesson05.teach.gn_decline:
    title: Ein Angebot höflich ablehnen
    gloss: Nein, danke, das geht schon.
    note: '*Het lukt wel* bedeutet „Ich schaffe das schon“. *Hoor* macht das *nee* freundlicher.'
  nl.a2.unit89.lesson05.teach.gn_verzoek:
    title: Auf eine Bitte antworten
    gloss: Natürlich. Tut mir leid, das geht nicht.
    note: Zu einer Bitte sagen Sie mit *Natuurlijk* ja. Mit *Sorry, dat lukt niet.* sagen Sie nein.
  nl.a2.unit89.lesson05.teach.reading:
    title: Noor und ihre Nachbarn
    gloss: 'Noor kommt aus dem Supermarkt. Sie hat viele Einkäufe und eine schwere Tasche. Der Nachbar sieht sie und fragt: Soll ich die Tasche tragen? Noor sagt: Gern, danke. Dann fragt die Nachbarin: Soll ich die Tür öffnen? Noor sagt: Nein, danke, das geht schon.'
    note: Achten Sie darauf, welches Angebot Noor annimmt und welches sie ablehnt.
    glosses:
      uit: aus
      zware: schwer
      ziet: sieht
      vraagt: fragt
      zegt: sagt
      dan: dann
  nl.a2.unit89.lesson06.teach.welkom:
    title: Lotte begrüßt Omar
    gloss: 'Lotte: Hallo Omar, komm kurz herein.'
  nl.a2.unit89.lesson06.teach.boodschappen:
    title: Omar hat viele Einkäufe
    gloss: 'Omar: Danke. Ich habe viele Einkäufe.'
  nl.a2.unit89.lesson06.teach.tas:
    title: Lotte bietet Hilfe an
    gloss: 'Lotte: Soll ich die Tasche tragen?'
  nl.a2.unit89.lesson06.teach.koffie:
    title: Omar lehnt ab und bittet
    gloss: 'Omar: Nein, danke, das geht schon. Könntest du Kaffee machen?'
  nl.a2.unit89.lesson06.teach.brood:
    title: Lotte sagt zu und bietet mehr an
    gloss: 'Lotte: Natürlich. Setz dich kurz. Soll ich auch das Brot schneiden?'
  nl.a2.unit89.lesson06.teach.graag:
    title: Omar nimmt an
    gloss: 'Omar: Gern, danke.'
