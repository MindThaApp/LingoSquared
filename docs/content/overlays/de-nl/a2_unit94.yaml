course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um zu sagen, wozu Sie etwas tun.
  learning_goal: Mit om ... te sagen, wozu Sie etwas tun, auch mit trennbaren Verben, und zodat erkennen.
units:
  nl.a2.unit94.om_te_en_zodat:
    title: Um zu
    description: 'Sagen Sie, wofür Sie etwas tun: Besorgungen, Lernen und Geld sparen.'
lessons:
  nl.a2.unit94.lesson01.sparen_om_te:
    title: Sparen, um zu kaufen
  nl.a2.unit94.lesson02.scheidbare_werkwoorden:
    title: 'Aufräumen: trennbare Verben'
  nl.a2.unit94.lesson03.omdat_en_zodat:
    title: Omdat oder zodat
  nl.a2.unit94.lesson04.een_lijstje:
    title: Eine Liste für heute
  nl.a2.unit94.lesson05.noors_dag:
    title: Noors voller Tag
  nl.a2.unit94.lesson06.lotte_en_omar:
    title: Lotte und Omar erledigen Besorgungen
teaching:
  nl.a2.unit94.lesson01.teach.sparen:
    title: Sparen und kaufen
    gloss: sparen / das Geld / kaufen / das Fahrrad
    note: Das sind die ersten Wörter, die Sie brauchen, um über ein Ziel zu sprechen.
    example_gloss:
    - Ich spare Geld.
    - Ich kaufe ein Fahrrad.
  nl.a2.unit94.lesson01.teach.boodschappen:
    title: Besorgungen
    gloss: die Bank / die Post / der Supermarkt / das Brot / der Brief / das Paket
    note: Orte und Dinge für alltägliche Besorgungen.
    example_gloss:
    - Ich gehe zur Bank.
    - Ich gehe zur Post.
    - Ich kaufe Brot im Supermarkt.
  nl.a2.unit94.lesson01.teach.leren:
    title: Lernen
    gloss: lernen / Niederländisch / sprechen / einen Kurs besuchen
    note: '*Een cursus volgen* bedeutet, einen Kurs zu besuchen.'
    example_gloss:
    - Ich lerne Niederländisch.
    - Ich besuche einen Kurs.
    - Ich spreche mit Lotte.
  nl.a2.unit94.lesson01.teach.gn_om_te:
    title: 'Om ... te: wozu man etwas tut'
    gloss: Ich spare, um ein Fahrrad zu kaufen.
    note: 'Mit *om ... te* + Infinitiv nennen Sie den Zweck einer Handlung. Der Infinitiv (*kopen*) steht am Ende der Wortgruppe, *te* direkt davor: *om een fiets te kopen*. Das Subjekt ist dasselbe wie im ersten Teil (hier: *ik*).'
  nl.a2.unit94.lesson01.teach.zinnen:
    title: Drei Zwecke
    gloss: Ich gehe zum Supermarkt, um Brot zu kaufen. Ich gehe zur Post, um einen Brief zu schicken. Ich lerne Niederländisch, um mit Lotte zu sprechen.
    note: '*Sturen* bedeutet schicken.'
  nl.a2.unit94.lesson02.teach.scheidbaar:
    title: Verben mit Partikel
    gloss: Geld abheben / ein Paket abholen / sich verabreden / aufräumen / anrufen
    note: 'Im Hauptsatz steht das kleine Wort (*op*, *af*) am Ende des Satzes: *Ik neem geld op.* (*Bellen* hat kein kleines Wort.)'
    example_gloss:
    - Ich hebe Geld ab.
    - Ich hole ein Paket ab.
    - Ich verabrede mich mit Lotte.
    - Ich räume auf.
    - Ich rufe Lotte an.
  nl.a2.unit94.lesson02.teach.gn_scheidbaar:
    title: Te steht zwischen Partikel und Verb
    gloss: abzuheben; abzuholen; sich zu verabreden; aufzuräumen
    note: 'Bei einem trennbaren Verb steht *te* zwischen der Partikel und dem Verb: *op te nemen*, *af te spreken*. Verben ohne Partikel erhalten *te* einfach davor: *te kopen*, *te sturen*.'
  nl.a2.unit94.lesson02.teach.zinnen:
    title: Vier Besorgungen
    gloss: Ich gehe zur Bank, um Geld abzuheben. Ich gehe zur Post, um ein Paket abzuholen. Ich rufe Lotte an, um mich zu verabreden. Ich gehe nach Hause, um aufzuräumen.
  nl.a2.unit94.lesson03.teach.vragen:
    title: Warum und wofür
    gloss: warum / wofür / weil / damit / nötig
    note: '*Waarom* fragt nach einem Grund; *waarvoor* fragt nach einem Zweck.'
    example_gloss:
    - Warum sparst du?
    - Wofür sparst du?
    - Ich brauche Geld.
  nl.a2.unit94.lesson03.teach.gn_omdat:
    title: Omdat nennt einen Grund
    gloss: Warum sparst du? Weil ich ein Fahrrad brauche.
    note: '*Omdat* nennt einen Grund, keinen Zweck. Das konjugierte Verb steht am Ende des *omdat*-Satzes: *omdat ik een fiets nodig heb*. Der Satz hat ein eigenes Subjekt und Verb.'
  nl.a2.unit94.lesson03.teach.gn_doel:
    title: Om ... te nennt einen Zweck
    gloss: Wofür sparst du? Um ein Fahrrad zu kaufen.
    note: '*Om ... te* beantwortet die Frage *waarvoor?* und nennt das Ziel. Es hat kein eigenes Subjekt: Die handelnde Person ist dieselbe wie im Hauptteil.'
  nl.a2.unit94.lesson03.teach.gn_zodat:
    title: 'Zodat: eine andere Person'
    gloss: Ich helfe Omar, damit er rechtzeitig fertig ist. Ich schreibe es auf, damit du es nicht vergisst.
    note: '*Zodat* nennt ebenfalls einen Zweck, meist mit einem neuen Subjekt (*hij*, *jij*), und das konjugierte Verb steht am Ende des Satzes. Erkennen Sie es vorerst nur wieder; meist verwenden Sie *om ... te*, wenn Sie selbst handeln.'
  nl.a2.unit94.lesson04.teach.lijstje:
    title: Meine Liste
    gloss: die Liste / heute / zuerst / danach / der Bäcker / das Fahrradgeschäft
    note: Mit *eerst* und *daarna* bringen Sie Ihre Besorgungen in eine Reihenfolge.
    example_gloss:
    - Meine Liste für heute.
    - Ich kaufe Brot beim Bäcker.
    - Ich kaufe ein neues Fahrrad im Fahrradgeschäft.
  nl.a2.unit94.lesson04.teach.gn_voorop:
    title: Zuerst die om-Wortgruppe
    gloss: Um Geld abzuheben, gehe ich zur Bank. Um Brot zu kaufen, gehe ich zum Bäcker.
    note: 'Sie können mit der *om ... te*-Wortgruppe beginnen. Dann folgt direkt das Verb, noch vor dem Subjekt: *Om brood te kopen ga ik ...*, nicht *Om brood te kopen ik ga ...*.'
  nl.a2.unit94.lesson04.teach.zinnen:
    title: Besorgungen der Reihe nach
    gloss: Zuerst gehe ich zur Bank, um Geld abzuheben. Danach gehe ich zum Bäcker, um Brot zu kaufen.
    note: 'Nach *eerst* oder *daarna* am Satzanfang bleibt das Verb an zweiter Stelle: *ga ik*.'
  nl.a2.unit94.lesson05.teach.reading:
    title: Noors Liste
    gloss: Noor hat viel zu tun. Zuerst geht sie zur Bank, um Geld abzuheben. Danach geht sie zur Post, um ein Paket zu schicken. Jeden Monat spart sie Geld, um ein neues Fahrrad zu kaufen. Lotte hilft ihr, damit sie rechtzeitig fertig ist.
  nl.a2.unit94.lesson06.teach.beurt1:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, gehst du zur Post?'
  nl.a2.unit94.lesson06.teach.beurt2:
    title: Omar erklärt
    gloss: 'Omar: Ja, ich gehe zur Post, um ein Paket abzuholen.'
  nl.a2.unit94.lesson06.teach.beurt3:
    title: Lotte nennt ihre Besorgung
    gloss: 'Lotte: Ich gehe zur Bank, um Geld abzuheben.'
  nl.a2.unit94.lesson06.teach.beurt4:
    title: Omar fragt nach dem Wofür
    gloss: 'Omar: Wofür brauchst du Geld?'
  nl.a2.unit94.lesson06.teach.beurt5:
    title: Lotte nennt ihr Ziel
    gloss: 'Lotte: Ich spare, um ein neues Fahrrad zu kaufen.'
  nl.a2.unit94.lesson06.teach.beurt6:
    title: Omar bietet an zu warten
    gloss: 'Omar: Schön! Ich warte auf dich, damit wir zusammen gehen.'
