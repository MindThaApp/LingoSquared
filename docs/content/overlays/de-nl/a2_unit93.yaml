course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2 zum zeitlichen Ordnen von Ereignissen mit voordat, nadat, wanneer und als.
  learning_goal: Ereignisse mit Nebensätzen mit „bevor“, „nachdem“ und „wenn“ zeitlich ordnen – mit Verbendstellung im Nebensatz und Inversion im Hauptsatz.
units:
  nl.a2.unit93.voordat_nadat_wanneer:
    title: Bevor, nachdem, wenn
    description: Alltags- und Reiseereignisse mit voordat, nadat, wanneer und als zeitlich ordnen.
lessons:
  nl.a2.unit93.lesson01.voordat_ik_ga:
    title: Bevor ich gehe
  nl.a2.unit93.lesson02.nadat_ik_gegeten_heb:
    title: Nachdem ich gegessen habe
  nl.a2.unit93.lesson03.voordat_of_nadat:
    title: Voordat oder nadat?
  nl.a2.unit93.lesson04.wanneer_en_als:
    title: Wanneer und als
  nl.a2.unit93.lesson05.een_reisdag:
    title: Ein Reisetag
  nl.a2.unit93.lesson06.lotte_en_omar:
    title: Lotte und Omar planen eine Reise
teaching:
  nl.a2.unit93.lesson01.teach.dagelijks:
    title: Alltägliche Tätigkeiten
    gloss: duschen / frühstücken / essen / kochen / aufräumen / anrufen
    note: '*Opruimen* ist trennbar: *ik ruim op*.'
    example_gloss:
    - Ich dusche und frühstücke.
    - Ich esse ein Brötchen und trinke Tee.
    - Ich koche und räume die Küche auf.
    - Ich rufe Lotte an.
  nl.a2.unit93.lesson01.teach.plaatsen:
    title: Orte und Zeiten
    gloss: Arbeit / nach Hause / zu Hause / der Laden / ins Bett
    note: '*Naar huis* zeigt die Richtung; *thuis* zeigt, wo man ist.'
    example_gloss:
    - Ich gehe zur Arbeit.
    - Ich gehe nach Hause.
    - Um sechs Uhr bin ich zu Hause.
    - Ich gehe in den Laden.
    - Ich gehe um elf Uhr schlafen.
  nl.a2.unit93.lesson01.teach.voordat:
    title: Voordat
    gloss: vor
    note: '*Voordat* leitet das Ereignis ein, das als zweites geschieht.'
    example_gloss:
    - Bevor ich esse, rufe ich Lotte an.
    - Bevor ich koche, gehe ich in den Laden.
    - Bevor ich ins Bett gehe, trinke ich Tee.
  nl.a2.unit93.lesson01.teach.gn_voordat:
    title: Voordat mit dem Verb am Ende
    gloss: Bevor ich zur Arbeit gehe, frühstücke ich.
    note: 'Nach *voordat* steht das finite Verb am Ende des Nebensatzes: *ik naar mijn werk ga*.'
  nl.a2.unit93.lesson01.teach.gn_inversie:
    title: Inversion nach dem vorangestellten Nebensatz
    gloss: Nach voordat steht das Verb am Ende. Steht der Nebensatz am Satzanfang, beginnt der Hauptsatz mit dem finiten Verb und dann folgt das Subjekt.
    note: 'Das Komma schließt den Nebensatz ab. Danach beginnt der Hauptsatz mit dem Verb: *ontbijt ik*, nicht *ik ontbijt*.'
  nl.a2.unit93.lesson01.teach.zinnen:
    title: Zwei Sätze mit voordat
    gloss: Bevor ich frühstücke, dusche ich. Bevor ich nach Hause gehe, rufe ich Lotte an.
  nl.a2.unit93.lesson02.teach.deelwoorden:
    title: Partizipien Perfekt
    gloss: essen – gegessen; kochen – gekocht; duschen – geduscht; anrufen – angerufen; arbeiten – gearbeitet; aufräumen – aufgeräumt
    note: 'Regelmäßige Verben bilden das Partizip mit *ge-* und *-t* oder *-d*; *eten* ist unregelmäßig (*gegeten*); bei *opruimen* steht *ge* in der Mitte: *opgeruimd*.'
    example_gloss:
    - Ich habe gegessen.
    - Ich habe gekocht.
    - Ich habe Lotte angerufen.
    - Ich habe gearbeitet und geduscht.
    - Ich habe die Küche aufgeräumt.
  nl.a2.unit93.lesson02.teach.aankomen:
    title: Ankommen
    gloss: ankommen – angekommen
    note: '*Aankomen* ist trennbar: *ik kom aan*.'
    example_gloss:
    - Ich komme um sechs Uhr an.
    - Ich kam um sechs Uhr an.
  nl.a2.unit93.lesson02.teach.nadat:
    title: Nadat
    gloss: nach
    note: '*Nadat* leitet das Ereignis ein, das zuerst stattgefunden hat.'
    example_gloss:
    - Nachdem ich gegessen habe, räume ich auf.
    - Nachdem ich gearbeitet habe, dusche ich.
    - Nachdem ich gekocht habe, esse ich.
  nl.a2.unit93.lesson02.teach.gn_nadat:
    title: Nadat mit dem Perfekt
    gloss: Nachdem ich gegessen habe, räume ich auf.
    note: 'Nach *nadat* steht das Perfekt, und beide Verben stehen am Ende: *gegeten heb*.'
  nl.a2.unit93.lesson02.teach.gn_nadat_regel:
    title: Die Regel für nadat
    gloss: Nach nadat verwendet man das Perfekt (in der Gegenwart). Das Partizip und heb stehen am Ende. Der Hauptsatz beginnt dann mit dem finiten Verb.
    note: 'Die Inversion funktioniert wie nach *voordat*: *Nadat ik gegeten heb, ruim ik op* (nicht *ik ruim op*).'
  nl.a2.unit93.lesson02.teach.gn_volgorde:
    title: Zwei mögliche Verbstellungen
    gloss: 'Ebenfalls richtig: Nachdem ich gegessen habe, räume ich auf.'
    note: In einem Nebensatz sind sowohl *gegeten heb* als auch *heb gegeten* richtig. In dieser Einheit sehen Sie meist *gegeten heb*.
  nl.a2.unit93.lesson02.teach.gn_aankomen:
    title: Ben bei aankomen
    gloss: Nachdem ich angekommen bin, rufe ich Lotte an.
    note: '*Aankomen* bildet das Perfekt mit *zijn*, nicht mit *hebben*: *aangekomen ben*.'
  nl.a2.unit93.lesson03.teach.reis_woorden:
    title: Wörter zum Reisen
    gloss: der Zug / der Bahnhof / die Fahrkarte / der Koffer
    note: '*Het kaartje* ist hier eine Fahrkarte für den Zug.'
    example_gloss:
    - Der Zug steht am Bahnhof.
    - Ich kaufe eine Fahrkarte.
    - Mein Koffer ist fertig.
  nl.a2.unit93.lesson03.teach.reis_werkwoorden:
    title: Verben zum Reisen
    gloss: abfahren – abgefahren; einpacken – eingepackt; kaufen – gekauft
    note: '*Vertrekken* bildet das Perfekt mit *zijn* (*vertrokken ben*); *inpakken* und *kopen* mit *hebben*. *Inpakken* ist trennbar: *ik pak in*.'
    example_gloss:
    - Der Zug fährt um neun Uhr ab.
    - Ich fahre um neun Uhr ab.
    - Ich packe meinen Koffer ein.
    - Ich habe eine Fahrkarte gekauft.
  nl.a2.unit93.lesson03.teach.gn_voordat_reis:
    title: 'Voordat: das zweite Ereignis'
    gloss: Bevor ich abfahre, packe ich meinen Koffer ein.
    note: 'Der *voordat*-Satz nennt das Ereignis, das später geschieht: erst das Packen, dann die Abfahrt.'
  nl.a2.unit93.lesson03.teach.gn_nadat_reis:
    title: 'Nadat: das erste Ereignis'
    gloss: Nachdem ich meinen Koffer eingepackt habe, fahre ich ab.
    note: 'Der *nadat*-Satz nennt das Ereignis, das zuerst geschehen ist: erst das Packen, dann die Abfahrt. Die Reihenfolge der Ereignisse ist dieselbe wie vorher, nur die Konjunktion ist eine andere.'
  nl.a2.unit93.lesson03.teach.gn_vergelijk:
    title: Voordat oder nadat
    gloss: Voordat nennt das Ereignis, das später kommt. Nadat nennt das Ereignis, das früher kommt.
    note: Fragen Sie sich, welches Ereignis zeitlich zuerst kommt. In der Gegenwart folgt in dieser Einheit auf *nadat* das Perfekt und auf *voordat* das Präsens.
  nl.a2.unit93.lesson03.teach.gn_hoofdzin_eerst:
    title: Hauptsatz zuerst
    gloss: Ich packe meinen Koffer ein, bevor ich abfahre.
    note: 'Steht der Hauptsatz zuerst, gibt es keine Inversion: *Ik pak ...*; danach folgt der Nebensatz mit dem Verb am Ende.'
  nl.a2.unit93.lesson03.teach.gn_had:
    title: Nadat in einer Geschichte in der Vergangenheit
    gloss: Nachdem ich gegessen hatte, rief ich Lotte an.
    note: 'In einer Geschichte in der Vergangenheit ersetzt *had* das *heb* (und *was* das *ben*): *gegeten had*. Auch der Hauptsatz steht in der Vergangenheit (*belde*).'
  nl.a2.unit93.lesson04.teach.toestand:
    title: Müde, früh, spät, Hunger
    gloss: müde / früh / spät / Hunger
    note: '*Honger hebben* bedeutet, Hunger zu haben.'
    example_gloss:
    - Ich bin müde.
    - Ich gehe früh ins Bett.
    - Ich bin spät zu Hause.
    - Ich habe Hunger.
  nl.a2.unit93.lesson04.teach.gewoonte:
    title: Gewohnheiten
    gloss: nach Hause kommen / das Fahrrad / nehmen / regnen
    note: '*Thuiskomen* ist trennbar: *ik kom thuis*; im Nebensatz wird es zusammengeschrieben: *als ik thuiskom*.'
    example_gloss:
    - Ich komme um sechs Uhr nach Hause.
    - Ich nehme das Fahrrad.
    - Ich nehme den Bus.
    - Es regnet.
  nl.a2.unit93.lesson04.teach.wanneer_als:
    title: Wanneer und als
    gloss: immer wenn / wenn
    note: 'In dieser Verwendung bedeuten *wanneer* und *als* dasselbe: immer wenn etwas wieder und wieder geschieht.'
    example_gloss:
    - Wenn ich müde bin, gehe ich früh ins Bett.
    - Wenn ich Hunger habe, esse ich ein Brötchen.
    - Immer wenn es regnet, nehme ich den Bus.
  nl.a2.unit93.lesson04.teach.gn_als:
    title: Als mit dem Präsens
    gloss: Wenn ich müde bin, gehe ich früh ins Bett.
    note: 'Eine Gewohnheit steht im Präsens. Das Verb rückt ans Ende: *ik moe ben*.'
  nl.a2.unit93.lesson04.teach.gn_wanneer_regel:
    title: Die Regel für wanneer und als
    gloss: Mit wanneer oder als sagt man, was immer wieder geschieht oder was später geschieht. Das Verb steht am Ende, und der Hauptsatz beginnt mit dem finiten Verb.
    note: 'Achtung: *als* kann auch *falls* bedeuten. *Wanneer* bedeutet nur *wann*.'
  nl.a2.unit93.lesson04.teach.gn_toen:
    title: Toen im Gegensatz zu als
    gloss: Als ich nach Hause kam, rief Lotte an. Wenn ich nach Hause komme, rufe ich Lotte an.
    note: '*Toen* bezieht sich auf einen einzelnen Moment in der Vergangenheit und steht mit dem Imperfekt. *Wanneer* und *als* gehören zu Gewohnheiten und zur Gegenwart.'
  nl.a2.unit93.lesson04.teach.gn_toen_regel:
    title: toen oder wanneer wählen
    gloss: Toen verwendet man für einen einzelnen Moment in der Vergangenheit. Wanneer oder als verwendet man für eine Gewohnheit oder für die Gegenwart.
    note: Toen wurde in einer früheren Einheit behandelt; dies ist nur eine kurze Erinnerung.
  nl.a2.unit93.lesson05.teach.lezen:
    title: Noors Reisetag
    gloss: Noor fährt morgen mit dem Zug. Bevor sie abfährt, packt sie ihren Koffer. Nachdem sie ihren Koffer eingepackt hat, frühstückt sie. Sie geht zum Bahnhof und kauft eine Fahrkarte. Bevor der Zug abfährt, trinkt sie Kaffee. Wenn sie ankommt, ruft sie Lotte an.
    note: 'Achten Sie auf die Reihenfolge der Ereignisse: Welcher Satz sagt Ihnen, was zuerst kommt?'
    glosses:
      morgen: morgen
      met: mit
      pakt: packt ein
      heeft: hat
      koopt: kauft
      drinkt: trinkt
      koffie: Kaffee
      aankomt: kommt an
      belt: ruft an
      haar: ihren
  nl.a2.unit93.lesson06.teach.lotte_vertrek:
    title: Lotte fragt nach morgen
    gloss: 'Lotte: Hallo Omar, wann fährst du morgen ab?'
  nl.a2.unit93.lesson06.teach.omar_koffer:
    title: Omar nennt seinen Plan
    gloss: 'Omar: Um neun Uhr. Bevor ich abfahre, packe ich meinen Koffer ein.'
  nl.a2.unit93.lesson06.teach.lotte_bel:
    title: Lotte bittet um einen Anruf
    gloss: 'Lotte: Rufst du mich an, nachdem du angekommen bist?'
  nl.a2.unit93.lesson06.teach.omar_ja:
    title: Omar stimmt zu
    gloss: 'Omar: Ja, nachdem ich angekommen bin, rufe ich dich an.'
  nl.a2.unit93.lesson06.teach.lotte_te_laat:
    title: Lotte fragt nach einer Verspätung
    gloss: 'Lotte: Was machst du, wenn der Zug Verspätung hat?'
  nl.a2.unit93.lesson06.teach.omar_koffie:
    title: Omar antwortet
    gloss: 'Omar: Wenn der Zug Verspätung hat, trinke ich Kaffee.'
exercises:
  nl.a2.unit93.lesson01.exercise01.kies_werk:
    instruction: Wählen Sie die niederländische Übersetzung von „Bevor ich zur Arbeit gehe, frühstücke ich.“
    correct_option: Voordat ik naar mijn werk ga, ontbijt ik.
    distractors:
    - Voordat ik naar mijn werk ga, ik ontbijt.
    - Voordat ik ga naar mijn werk, ontbijt ik.
    - Voordat ik ontbijt, ga ik naar mijn werk.
    accepted_answers:
    - value: Voordat ik naar mijn werk ga, ontbijt ik.
      status: correct
    feedback: 'Nach dem einleitenden *voordat*-Satz beginnt der Hauptsatz mit dem Verb: *ontbijt ik*. Die letzte Option stellt die Ereignisse in umgekehrter Reihenfolge dar.'
    prompt_blocks:
    - Bevor ich zur Arbeit gehe, frühstücke ich.
