      status: correct
    feedback: '*Voordat ik ontbijt, douche ik* = Bevor ich frühstücke, dusche ich. Die letzte Option kehrt die Reihenfolge der Ereignisse um.'
    prompt_blocks:
    - Bevor ich frühstücke, dusche ich.
