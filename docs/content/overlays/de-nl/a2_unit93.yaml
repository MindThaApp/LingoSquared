  nl.a2.unit93.lesson02.exercise01.kies_ruim_op:
    instruction: Wählen Sie die richtige niederländische Übersetzung von „Nachdem ich gegessen habe, räume ich auf.“
    correct_option: Nadat ik gegeten heb, ruim ik op.
    distractors:
