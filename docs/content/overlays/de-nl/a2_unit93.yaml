      status: correct
    feedback: Beide Verben stehen am Ende des nadat-Satzes, und der Hauptsatz beginnt mit *ruim ik op*. Die letzte Option dreht die Reihenfolge der Ereignisse um.
    prompt_blocks:
    - Nachdem ich gegessen habe, räume ich auf.
  nl.a2.unit93.lesson02.exercise02.kies_aangekomen:
