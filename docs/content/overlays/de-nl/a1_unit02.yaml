teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: Null bis vier
    gloss: 0 — null, 1 — eins, 2 — zwei, 3 — drei, 4 — vier
    note: Niederländisch nul ist null, auch als erste Ziffer einer Telefonnummer. Die Akzente in één unterscheiden in der Schrift die Zahl vom Artikel een; in gewöhnlichen niederländischen Texten fehlen sie manchmal, wenn die Bedeutung klar ist.
    example_gloss:
    - Ich habe null Euro.
    - Ich habe ein Buch.
    - Ich habe zwei Stühle.
    - Ich habe drei Bücher.
    - Es sind vier Personen da.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: Fünf bis acht
    gloss: 5 — fünf, 6 — sechs, 7 — sieben, 8 — acht
    note: Vijf, zes, zeven und acht folgen demselben einfachen Muster wie die Zahlen von null bis vier.
    example_gloss:
    - Ich habe fünf Euro.
    - Ich habe sechs Bücher.
    - Ich habe sieben Stühle.
    - Es sind acht Personen da.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: Neun bis zwölf
    gloss: 9 — neun, 10 — zehn, 11 — elf, 12 — zwölf
    note: Negen, tien, elf und twaalf vervollständigen die Zahlen bis zwölf.
    example_gloss:
    - Ich habe neun Euro.
    - Ich habe zehn Stühle.
    - Ich habe elf Bücher.
    - Es sind zwölf Personen da.
  nl.a1.unit02.lesson01.teach.how_many:
    title: Nach der Anzahl fragen
    gloss: Wie viele?
    note: Hoeveel fragt nach einer Zahl oder Menge.
  nl.a1.unit02.lesson02.teach.teens:
    title: Die Zahlen von 13 bis 19
    gloss: '13–19: dreizehn, vierzehn, fünfzehn, sechzehn, siebzehn, achtzehn, neunzehn'
    note: Die niederländischen Formen von dreizehn bis neunzehn enden auf -tien.
    example_gloss:
    - Ich bin dreizehn Jahre alt.
    - Ich habe vierzehn Euro.
    - Ich bin fünfzehn Jahre alt.
    - Ich habe sechzehn Bücher.
    - Es sind siebzehn Personen da.
    - Ich bin achtzehn Jahre alt.
    - Ich habe neunzehn Stühle.
  nl.a1.unit02.lesson02.teach.tens:
    title: Die Zehnerzahlen
    gloss: '20–90: zwanzig, dreißig, vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig'
    note: Lernen Sie diese Zehnerzahlen als Bausteine für größere zweistellige Zahlen.
    example_gloss:
    - Ich bin zwanzig Jahre alt.
    - Das kostet dreißig Euro.
    - Ich habe vierzig Euro.
    - Es sind fünfzig Leute da.
    - Ich bin sechzig Jahre alt.
    - Das kostet siebzig Euro.
    - Es sind achtzig Leute da.
    - Ich habe neunzig Euro.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: Erst die Einer, dann die Zehner
    gloss: '21–99, außer 30, 40 und den anderen glatten Zehnern: Einer + en + Zehner'
    note: 'Wie im Deutschen nennt das Niederländische normalerweise zuerst die Einer: 42 heißt wörtlich „zwei-und-vierzig“. Glatte Zehner bestehen nur aus dem Zehnerwort.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: Einundzwanzig
    gloss: 21 – einundzwanzig
    note: Eenentwintig setzt sich aus een + en + twintig zusammen und wird in einem Wort geschrieben.
    example_gloss: Das Sprachcafé ist in Raum einundzwanzig.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: Zweiundzwanzig
    gloss: 22 – zweiundzwanzig
    note: Die zwei Punkte auf dem ë in tweeëntwintig zeigen, dass die benachbarten Vokale getrennt gesprochen werden und eine neue Silbe beginnen.
    example_gloss: Ich bin zweiundzwanzig Jahre alt.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: Zweiunddreißig
    gloss: 32 – zweiunddreißig
    note: Tweeëndertig wird in einem Wort geschrieben, mit zwei Punkten auf dem verbindenden ë.
    example_gloss: Omar ist zweiunddreißig Jahre alt.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: Zweiundvierzig
    gloss: 42 ist zweiundvierzig.
    note: 'Sagen Sie erst die Einer, dann den Zehner: twee-en-veertig, zusammengeschrieben tweeënveertig.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: Achtundvierzig
    gloss: 48 – achtundvierzig
    note: Achtenveertig ist acht + en + veertig, in einem Wort geschrieben.
    example_gloss: Ich wohne in der Nummer achtundvierzig.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: Fünfundsiebzig
    gloss: 75 – fünfundsiebzig
    note: Bei vijfenzeventig steht vijf vor zeventig.
    example_gloss: Das kostet fünfundsiebzig Cent.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: Neunundneunzig
    gloss: 99 – neunundneunzig
    note: Negenennegentig ist ein zusammengesetztes Wort.
    example_gloss: Ich bin neunundneunzig Jahre alt.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: Nach einer Telefonnummer fragen
    gloss: Wie ist deine Telefonnummer?
    note: Je bleibt hier informell – das passt zum Sprachcafé, in dem Lotte und Omar sich treffen.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: Eine niederländische Handynummer angeben
    gloss: Meine Telefonnummer ist 06 21 43 65 87.
    note: Niederländische Handynummern beginnen mit 06 und werden üblicherweise als 06 gefolgt von acht Ziffern angezeigt.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: Die Telefonnummer in Gruppen sagen
    gloss: null sechs, einundzwanzig, dreiundvierzig, fünfundsechzig, siebenundachtzig
    note: Telefonnummern werden unterschiedlich gruppiert. In diesem Kurs folgt auf 06 jeweils eine zweistellige Gruppe; Ziffer für Ziffer zu sprechen ist ebenfalls üblich, wenn es auf Deutlichkeit ankommt.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: Nach der Hausnummer fragen
    gloss: Wie ist deine Hausnummer?
    note: Huisnummer ist die Nummer, die zu einer Adresse gehört.
  nl.a1.unit02.lesson03.teach.house_number:
    title: Die Hausnummer nennen
    gloss: Meine Hausnummer ist 48.
    note: In einer schriftlichen Adresse oder einem Formular sind Ziffern üblich.
  nl.a1.unit02.lesson03.teach.live_number:
    title: Sagen, wo man wohnt (mit Nummer)
    gloss: Ich wohne in der Nummer achtundvierzig.
    note: Op nummer ... ist eine natürliche Art, die Hausnummer zu nennen, wenn die Straße schon bekannt ist.
  nl.a1.unit02.lesson03.teach.repeat:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: Nützlich, wenn eine gesprochene Telefonnummer zu schnell war.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: Informell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: Hier steht das informelle je; Fragen nach dem Alter sind nur passend, wenn der Zusammenhang sie nahelegt.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: Das Alter nennen
    gloss: Ich bin achtundzwanzig Jahre alt.
    note: Im Niederländischen sagt man Ik ben ... jaar, wörtlich „Ich bin ... Jahr“, ohne „alt“.
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Omars Alter nennen
    gloss: Omar ist zweiunddreißig Jahre alt.
    note: Bei der Altersangabe bekommt jaar nach einer Zahl keine Pluralendung.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: Nach der Anzahl von Personen fragen
    gloss: Wie viele Leute sind da?
    note: Hoeveel steht direkt vor dem Nomen mensen.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: Die Anzahl von Personen nennen
    gloss: Es sind zwölf Personen da.
    note: Er zijn ist die übliche Pluralkonstruktion für „es sind“.
  nl.a1.unit02.lesson04.teach.three_books:
    title: Bücher zählen
    gloss: Ich habe drei Bücher.
    note: 'Nach Zahlen über eins steht boek im Plural: boeken.'
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: Stühle zählen
    gloss: sieben Stühle
    note: Stoelen ist der Plural von stoel.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: der Euro
    note: 'Euro bleibt nach einer genannten Menge normalerweise im Singular: twee euro, nicht twee euro''s.'
    example_gloss: Das kostet zwei Euro.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: der Cent
    note: Auch cent bleibt in Preisangaben nach einer Zahl meist im Singular.
    example_gloss: Das macht fünfzig Cent.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: Nach dem Preis fragen
    gloss: Wie viel kostet das?
    note: Hoeveel fragt nach der Menge, kost bedeutet „kostet“.
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: Zwei Euro fünfzig
    gloss: 2,50 € – zwei Euro fünfzig
    note: Auch im Niederländischen steht ein Dezimalkomma. Im Alltag sagt man €2,50 meist twee euro vijftig, ohne en.
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: Fünfundsiebzig Cent
    gloss: 0,75 € – fünfundsiebzig Cent
    note: Liegt der Betrag unter einem Euro, nennt man natürlich nur die Cent.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: Zwölf Euro
    gloss: 12 € – zwölf Euro
    note: Bei einem glatten Eurobetrag braucht man keine Centangabe.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: Vier Euro fünfzig
    gloss: 4,50 € – vier Euro fünfzig
    note: Dasselbe gesprochene Muster gilt für andere Preise mit Euro und Cent.
  nl.a1.unit02.lesson05.teach.costs:
    title: Einen Preis nennen
    gloss: Das kostet zwei Euro fünfzig.
    note: Dat kost ... ist die direkte Antwort auf Hoeveel kost dit?
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar meldet sich an
    gloss: 'Mitarbeiterin: Guten Tag. Kommst du zum Sprachcafé? Omar: Ja, ich möchte mich anmelden.'
    note: Die Szene setzt Omars Besuche im Sprachcafé der Bibliothek aus Lektion 1 fort.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: Die Telefonnummer nennen
    gloss: 'Mitarbeiterin: Prima. Wie ist deine Telefonnummer? Omar: 06 21 43 65 87.'
    note: Omar nennt die Nummer in den zweistelligen Gruppen, die Sie zuvor geübt haben.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: Die Hausnummer nennen
    gloss: 'Mitarbeiterin: Und wie ist deine Hausnummer? Omar: Achtundvierzig.'
    note: Eine kurze Antwort nur mit der Zahl ist natürlich, wenn die Frage den Zusammenhang liefert.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: Den Beitrag verstehen
    gloss: 'Mitarbeiterin: Der Beitrag beträgt zwei Euro fünfzig. Omar: Gut.'
    note: Der gesprochene Preis folgt dem alltäglichen Muster aus Euro und Cent.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: Nach der Gruppengröße fragen
    gloss: 'Omar: Wie viele Leute sind in der Gruppe? Mitarbeiterin: Zwölf.'
    note: Diese Szene greift das Fragemuster Hoeveel mensen ... aus dieser Lektion wieder auf.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: Die Raumnummer herausfinden
    gloss: 'Mitarbeiterin: Das Sprachcafé ist in Raum einundzwanzig.'
    note: Zaal ist ein Raum oder Saal für eine Veranstaltung.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: Lottes Tisch finden
    gloss: 'Lotte: Hallo Omar! Wir sitzen an Tisch sieben.'
    note: Der Dialog endet damit, dass Omar im gleichen informellen Rahmen wieder auf Lotte trifft.
