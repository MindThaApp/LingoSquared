teaching:
  nl.a2.unit74.lesson01.teach.vertraging:
    title: Die Verspätung
    gloss: die Verspätung
    note: '*De vertraging* ist ein Substantiv mit dem Artikel de.'
    example_gloss: Es gibt zehn Minuten Verspätung.
  nl.a2.unit74.lesson01.teach.trein_vertraging:
    title: Melden, dass Ihr Zug Verspätung hat
    gloss: Mein Zug hat Verspätung.
    note: '*Vertraging hebben* (wörtlich „Verspätung haben“) ist die übliche Wendung, um zu sagen, dass ein Zug oder Bus verspätet ist.'
  nl.a2.unit74.lesson01.teach.reden_vertraging:
    title: Nach dem Grund einer Verspätung fragen
    gloss: Was ist der Grund für die Verspätung?
    note: '*De reden* (der Grund) ist ein Substantiv mit dem Artikel de.'
  nl.a2.unit74.lesson02.teach.seinstoring:
    title: Die Signalstörung
    gloss: die Signalstörung
    note: '*De seinstoring* ist der übliche Begriff der NS für eine technische Störung der Signalanlage im Bahnnetz.'
    example_gloss: Mein Zug fällt wegen einer Signalstörung aus.
  nl.a2.unit74.lesson02.teach.trein_valt_uit:
    title: Melden, dass Ihr Zug ausfällt
    gloss: Mein Zug fällt wegen einer Signalstörung aus.
    note: '*Uitvallen* (ausfallen) ist ein trennbares Verb; *uit* steht am Ende des Satzes, ähnlich wie im Deutschen („Der Zug fällt aus“).'
  nl.a2.unit74.lesson02.teach.volgende_trein:
    title: Fragen, wann der nächste Zug fährt
    gloss: Wann fährt der nächste Zug?
    note: '*Rijden* (fahren fällt hier mit „verkehren“ zusammen) wird für Züge und Busse im Fahrplan verwendet, nicht nur für das Autofahren.'
  nl.a2.unit74.lesson03.teach.aansluiting:
    title: Der Anschluss
    gloss: der Anschluss
    note: '*De aansluiting* ist ein de-Wort und bezeichnet einen Anschlusszug oder -bus.'
    example_gloss: Ich verpasse meinen Anschluss in Utrecht.
  nl.a2.unit74.lesson03.teach.aansluiting_missen:
    title: Einen verpassten Anschluss melden
    gloss: Ich verpasse wegen der Verspätung meinen Anschluss.
    note: '*Missen* (verpassen) steht im Niederländischen wie im Deutschen mit direktem Objekt, ohne Präposition: Ik mis mijn aansluiting.'
  nl.a2.unit74.lesson03.teach.andere_trein:
    title: Nach einem anderen Zug fragen
    gloss: Kann ich einen anderen Zug nehmen?
    note: '*Een andere trein* (ein anderer Zug) verwendet *andere*, die Standardform des Adjektivs vor einem *de*-Wort.'
  nl.a2.unit74.lesson04.teach.servicebalie:
    title: Der Serviceschalter
    gloss: der Servicepunkt
    note: '*De servicebalie* ist ein de-Wort und das übliche Wort für den Hilfe- und Servicestand im Bahnhof.'
    example_gloss: Ich gehe zum Serviceschalter, um Hilfe zu bekommen.
  nl.a2.unit74.lesson04.teach.help_alternatief:
    title: Um Hilfe bei einer Alternative bitten
    gloss: Können Sie mir bei einer alternativen Verbindung helfen?
    note: '*Kunt u* ist die formelle, höfliche Form von *kunnen* (können) und wird mit *u* (Sie) verwendet.'
  nl.a2.unit74.lesson04.teach.via_amsterdam:
    title: Eine alternative Route genannt bekommen
    gloss: Sie können mit dem Intercity über Amersfoort fahren.
    note: '*Via* (über) leitet den Zwischenhalt einer alternativen Route ein.'
  nl.a2.unit74.lesson05.teach.mededeling:
    title: Eine Störungsmeldung lesen
    gloss: 'Wichtige Mitteilung: Wegen einer Signalstörung fahren zwischen Utrecht und Arnhem keine Züge. Reisende können über Amersfoort umreisen. Die Verspätung dauert voraussichtlich bis etwa 15 Uhr. Wir empfehlen den Reisenden, den Reiseplaner zu konsultieren.'
    note: '*Vijftien uur* entspricht 15 Uhr. Wie im Deutschen wird auf niederländischen Aushängen und Durchsagen häufig die 24-Stunden-Zählung verwendet.'
    glosses:
      Belangrijke: wichtige (flektierte Form von „wichtig“)
      mededeling: Mitteilung, Durchsage
      door: wegen, aufgrund
      seinstoring: Signalstörung
      rijden: fahren (von Zügen)
      tussen: zwischen
      geen: kein, keine
      treinen: Züge
      Reizigers: Reisende, Fahrgäste
      kunnen: können, in der Lage sein
      omreizen: auf anderer Route reisen, umfahren
      via: über
      vertraging: Verspätung
      duurt: dauert
      tot: bis
      ongeveer: ungefähr, etwa
      vijftien: fünfzehn
      uur: Uhr
      Wij: wir
      adviseren: raten, empfehlen
      reizigers: Reisende, Fahrgäste
      reisplanner: Reiseplaner
      raadplegen: konsultieren, nachsehen
  nl.a2.unit74.lesson06.teach.medewerker_open:
    title: Der Mitarbeiter eröffnet das Gespräch
    gloss: 'Mitarbeiter: NS, guten Tag. Wie kann ich Ihnen helfen?'
  nl.a2.unit74.lesson06.teach.lotte_uitgevallen:
    title: Lotte meldet den Ausfall
    gloss: 'Lotte: Guten Tag, mein Zug nach Arnhem ist ausgefallen. Ich möchte gern wissen, wie ich jetzt dorthin komme.'
  nl.a2.unit74.lesson06.teach.medewerker_seinstoring:
    title: Der Mitarbeiter erklärt die Ursache
    gloss: 'Mitarbeiter: Es gibt tatsächlich eine Signalstörung. Sie können über Amersfoort umreisen.'
  nl.a2.unit74.lesson06.teach.lotte_ask_time:
    title: Lotte fragt nach der Abfahrtszeit
    gloss: 'Lotte: Wann fährt dieser Zug ab?'
  nl.a2.unit74.lesson06.teach.medewerker_platform:
    title: Der Mitarbeiter nennt Gleis und Zeit
    gloss: 'Mitarbeiter: In zehn Minuten, von Gleis vier.'
  nl.a2.unit74.lesson06.teach.lotte_bericht_sturen:
    title: Lotte beschließt, eine Nachricht zu schicken
    gloss: 'Lotte: Vielen Dank. Ich schicke kurz eine Nachricht, dass ich später komme.'
  nl.a2.unit74.lesson06.teach.grammar_uitgevallen:
    title: Perfekt von uitvallen sowie haar/zij
    gloss: Ihr Zug ist ausgefallen. Sie kann auf anderer Route reisen.
    note: '*Is uitgevallen* ist das Perfekt von *uitvallen* (ausfallen) und wird mit *zijn* gebildet, weil es eine Zustandsänderung beschreibt, ähnlich wie im Deutschen („ist ausgefallen“). *Haar* (ihr) und *zij* (sie) sind die weiblichen Formen der 3. Person, die man verwendet, um zusammenzufassen, was Lotte passiert ist.'
