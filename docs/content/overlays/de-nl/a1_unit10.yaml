teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: Aufstehen
    gloss: aufstehen → ich stehe auf
    note: '*Opstaan* wird im Hauptsatz getrennt: *Ik sta op*. Das Präfix *op* rückt ans Ende.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: Sich anziehen
    gloss: sich anziehen → ich ziehe mich an
    note: '*Zich aankleden* ist reflexiv und trennbar. Mit *ik* verwendet man *me* und setzt *aan* ans Ende: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: Frühstücken
    gloss: frühstücken → ich frühstücke
    note: '*Ontbijten* wird nicht getrennt: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: Arbeit
    gloss: arbeiten → ich arbeite
    note: '*Werken* wird nicht getrennt: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: Essen
    gloss: essen → ich esse
    note: 'Die *ik*-Form von *eten* ist *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: Abwaschen
    gloss: abwaschen → ich wasche ab
    note: '*Afwassen* wird getrennt: *Ik was af*. Das Präfix *af* rückt ans Ende.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: Schlafen
    gloss: schlafen → ich schlafe
    note: '*Slapen* wird nicht getrennt. Die *ik*-Form hat einen langen Vokal: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: Das Trennungsmuster
    gloss: 'In einem normalen Hauptsatz rückt der erste Teil ans Ende: opstaan → Ik sta op.'
    note: Sagen Sie nicht *Ik opsta*. Konjugieren Sie das Verb und setzen Sie das kurze Präfix ans Ende des Hauptsatzes.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan im Satz
    gloss: 'aufstehen: Ich stehe um sieben Uhr auf.'
    note: Die Zeitangabe steht zwischen *sta* und dem Präfix *op* am Ende.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden im Satz
    gloss: 'sich anziehen: Ich ziehe mich an.'
    note: Das Muster lautet *Ik* + *kleed* + *me* + *aan*. *Aan* bleibt am Ende.
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen im Satz
    gloss: 'abwaschen: Ich wasche nach dem Essen ab.'
    note: '*Na het eten* steht zwischen *was* und dem Präfix *af* am Ende.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: Verben, die sich nicht trennen
    gloss: 'Nicht trennbar: Ich frühstücke. Ich arbeite. Ich schlafe. Kein Teil steht am Ende.'
    note: '*Ontbijten*, *werken* und *slapen* bleiben in diesen Hauptsätzen eine einzige Verbform.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: Um halb acht aufstehen
    gloss: Ich stehe um 7:30 Uhr auf.
    note: 'Erinnern Sie sich an die niederländische Uhrzeitregel: *half acht* bedeutet „halb auf acht zu“, also 07:30 – wie im Deutschen „halb acht“. *Op* bleibt am Ende.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: Sich um Viertel vor acht anziehen
    gloss: Ich ziehe mich um 7:45 Uhr an.
    note: Die Uhrzeit steht vor dem trennbaren Präfix *aan* am Ende.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: Um acht frühstücken
    gloss: Ich frühstücke um acht Uhr.
    note: Verwenden Sie *om* vor der Uhrzeit. *Ontbijt* wird nicht getrennt.
  nl.a1.unit10.lesson03.teach.work_time:
    title: Von neun bis fünf arbeiten
    gloss: Ich arbeite von neun bis fünf Uhr.
    note: '*Van ... tot ...* nennt Anfangs- und Endzeit.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: Um halb sieben essen
    gloss: Ich esse um 18:30 Uhr.
    note: '*''s Avonds* macht den Abend deutlich, daher ist *half zeven* hier 18:30.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: Um elf schlafen
    gloss: Ich schlafe um elf Uhr.
    note: 'Verwenden Sie *om* vor der Uhrzeit: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: Zuerst, dann, danach
    gloss: zuerst, dann, danach
    note: '*Eerst* nennt die erste Tätigkeit, *dan* leitet zur nächsten über, und *daarna* knüpft an das Vorherige an.'
    example_gloss:
    - Zuerst stehe ich auf.
    - Dann ziehe ich mich an.
    - Danach frühstücke ich.
  nl.a1.unit10.lesson04.teach.sequence:
    title: Ein Morgen in drei Schritten
    gloss: Zuerst stehe ich auf. Dann ziehe ich mich an. Danach frühstücke ich.
    note: 'Die trennbaren Präfixe stehen weiterhin am Satzende: *sta ik op*; *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: Verb vor ik
    gloss: 'Nach eerst, dan und daarna steht das Verb vor ik: Daarna ontbijt ik.'
    note: Beginnt der Satz mit einem Reihenfolgewort, wird aus *Ik ontbijt* der Satz *Daarna ontbijt ik*.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: Mein Tag
    gloss: Mein Tag – Ich stehe um 7:30 Uhr auf. Danach ziehe ich mich an, und um acht frühstücke ich. Ich arbeite von neun bis fünf. Um 18:30 Uhr esse ich. Danach wasche ich ab. Um elf schlafe ich.
    note: Achten Sie beim Lesen auf die Reihenfolge der Tätigkeiten und auf die Uhrzeiten. Beachten Sie *op*, *aan* und *af* am Ende der Sätze mit trennbaren Verben.
    glosses:
      Mijn: mein
      dag: Tag
      sta: aufstehen (mit op)
      half: halb, d. h. eine halbe Stunde vor der nächsten vollen Stunde (half acht = 7:30)
      acht: acht
      Daarna: danach
      kleed: sich anziehen (mit me ... aan)
      uur: Uhr
      ontbijt: frühstücken
      werk: arbeiten
      negen: neun
      vijf: fünf
      zeven: sieben
      avonds: am Abend
      eet: essen
      was: abwaschen (mit af)
      elf: elf
      slaap: schlafen
  nl.a1.unit10.lesson06.teach.question:
    title: Nach dem Tag fragen
    gloss: 'Lotte: Wie sieht dein Tag aus, Omar?'
    note: '*Hoe ziet jouw dag eruit?* ist eine informelle Art, jemanden zu bitten, seinen Tag zu beschreiben. *Eruitzien* ist trennbar: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: Omars Morgen
    gloss: 'Omar: Ich stehe um halb acht auf. Danach ziehe ich mich an, und um acht Uhr frühstücke ich.'
    note: Omar verbindet drei Tätigkeiten am Morgen und setzt *op* und *aan* ans Ende ihrer Sätze.
  nl.a1.unit10.lesson06.teach.work:
    title: Omars Arbeitstag
    gloss: 'Lotte: Wann arbeitest du? Omar: Ich arbeite von neun bis fünf Uhr.'
    note: Lotte und Omar duzen sich und verwenden dabei *je*.
  nl.a1.unit10.lesson06.teach.evening:
    title: Omars Abend
    gloss: 'Omar: Um 18:30 Uhr esse ich. Danach spüle ich ab. Um elf Uhr schlafe ich.'
    note: 'Beginnt der Satz mit einer Uhrzeit oder mit *daarna*, steht das Verb vor *ik*: *eet ik*, *was ik*, *slaap ik*. *Af* bleibt am Ende.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: Lottes Morgen
    gloss: 'Lotte: Ich stehe um sechs Uhr auf, aber ich frühstücke erst um halb sieben.'
    note: '*Pas* bedeutet hier „erst“. Lotte stellt ihre Aufstehzeit ihrer Frühstückszeit gegenüber.'
