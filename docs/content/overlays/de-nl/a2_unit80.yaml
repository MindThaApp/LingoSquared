teaching:
  nl.a2.unit80.lesson01.teach.verzetten:
    title: Einen Termin ändern
    gloss: (einen Termin) verschieben / absagen
    note: '*Een afspraak verzetten* bedeutet, ihn auf einen anderen Zeitpunkt zu verlegen. *Annuleren* bedeutet, ihn ganz abzusagen.'
    example_gloss:
    - Ich möchte meinen Termin verschieben.
    - Ich muss meinen Termin absagen.
  nl.a2.unit80.lesson01.teach.helaas_sorry:
    title: Sich entschuldigen
    gloss: leider / Entschuldigung
    note: '*Helaas* ist eine höfliche Art, schlechte Nachrichten zu überbringen („leider“). *Sorry* ist die alltägliche Entschuldigung.'
    example_gloss:
    - Leider kann ich nicht kommen.
    - Entschuldigung, ich bin zu spät.
  nl.a2.unit80.lesson01.teach.kapsalon:
    title: Beim Friseur
    gloss: der Friseursalon
    note: '*Het kapsalon* ist der Ort (der Friseursalon); *de kapper* ist die Person. Man sagt oft *naar de kapper* für beides.'
    example_gloss: Der Friseursalon ist von neun bis sechs Uhr geöffnet.
  nl.a2.unit80.lesson01.teach.kan_verzetten:
    title: Um Terminverschiebung bitten
    gloss: Kann ich meinen Termin verschieben?
    note: 'Eine Ja-/Nein-Frage beginnt mit dem Verb: *Kan ik ...?* Der Infinitiv *verzetten* steht am Ende.'
  nl.a2.unit80.lesson01.teach.helaas_niet_komen:
    title: Sagen, dass man nicht kommen kann
    gloss: Leider kann ich nicht kommen.
  nl.a2.unit80.lesson01.teach.gn_kan:
    title: Kan + Infinitiv
    gloss: Am Donnerstag kann ich nicht kommen. Kann ich den Termin verschieben?
    note: 'Nach *kan* steht das zweite Verb als Infinitiv am Ende des Satzes. Im Aussagesatz steht *niet* vor diesem Infinitiv: *Ik kan donderdag niet komen*. Eine Zeitangabe wie *donderdag* steht vor *niet*. In der Frage steht *kan* an erster Stelle: *Kan ik de afspraak verzetten?*'
  nl.a2.unit80.lesson02.teach.andere_dag:
    title: Ein anderer Tag
    gloss: ein anderer Tag
    note: '*Andere* endet hier nach *een* auf -e, weil *dag* ein de-Wort ist.'
    example_gloss: Geht es auch an einem anderen Tag?
  nl.a2.unit80.lesson02.teach.kan_ook_maandag:
    title: Einen Tag vorschlagen
    gloss: Geht es auch am Montag?
    note: 'Im Niederländischen steht vor einem Wochentag hier keine Präposition: *maandag*, nicht *op maandag*. Im Deutschen ist das anders: Dort sagt man „am Montag“.'
  nl.a2.unit80.lesson02.teach.kan_ook_dinsdag:
    title: Ein anderer Tag
    gloss: Geht auch Dienstag?
  nl.a2.unit80.lesson02.teach.komt_uit:
    title: Passt es Ihnen?
    gloss: Passt Ihnen der Freitag? (formell)
    note: '*Uitkomen* bedeutet „passen“ (im Sinne von „gelegen kommen“). Es ist ein trennbares Verb, daher steht *uit* am Ende: *Komt vrijdag u uit?* Das höfliche *u* verwendet man bei jemandem, den man nicht gut kennt.'
  nl.a2.unit80.lesson02.teach.komt_goed_uit:
    title: Zusagen
    gloss: Ja, das passt mir sehr gut.
  nl.a2.unit80.lesson02.teach.helaas_niet:
    title: Höflich absagen
    gloss: Leider nicht.
  nl.a2.unit80.lesson02.teach.gn_uitkomen:
    title: Passt es Ihnen?
    gloss: Passt Ihnen der Freitag? Ja, das passt mir sehr gut. Nein, leider nicht.
    note: '*Uitkomen* ist ein trennbares Verb: Im Präsens rückt *uit* ans Satzende. Die Frage beginnt mit dem Verb: *Komt vrijdag u uit?* Die Antwort *Ja, dat komt goed uit* bestätigt. Eine höfliche Absage ist *Nee, helaas niet*.'
  nl.a2.unit80.lesson03.teach.want:
    title: Weil und es tut mir leid
    gloss: weil / es tut mir leid
    note: '*Want* verbindet zwei vollständige Sätze und nennt den Grund. *Het spijt me* ist eine förmlichere Entschuldigung als *sorry*.'
    example_gloss:
    - Ich kann nicht kommen, weil ich krank bin.
    - Es tut mir leid.
  nl.a2.unit80.lesson03.teach.ongemak:
    title: Unannehmlichkeit
    gloss: die Unannehmlichkeit
    note: '*Sorry voor het ongemak* ist eine höfliche Wendung, wenn man jemandem zusätzliche Umstände bereitet hat.'
    example_gloss: Entschuldigen Sie die Unannehmlichkeiten.
  nl.a2.unit80.lesson03.teach.werken:
    title: 'Grund: Arbeit'
    gloss: Ich kann nicht kommen, weil ich arbeiten muss.
  nl.a2.unit80.lesson03.teach.andere_afspraak:
    title: 'Grund: ein anderer Termin'
    gloss: Ich kann nicht kommen, weil ich einen anderen Termin habe.
  nl.a2.unit80.lesson03.teach.gn_want:
    title: 'Weil: einen Grund angeben'
    gloss: Ich kann nicht kommen, weil ich krank bin.
    note: 'Nach *want* gilt die normale Wortstellung: erst das Subjekt, dann das Verb. Vor *want* steht ein Komma: *Ik kan niet komen, want ik ben ziek.* Vergleichen Sie *omdat*: Dort rückt das Verb ans Ende; hier verwendet man dagegen *want*. Das ist wie im Deutschen bei „denn“ und „weil“.'
  nl.a2.unit80.lesson04.teach.afspreken:
    title: Vereinbaren und im Voraus
    gloss: etwas vereinbaren / im Voraus
    note: '*Afspreken* bedeutet, gemeinsam eine Zeit oder einen Ort zu vereinbaren. *Van tevoren* bedeutet „vorher“, „im Voraus“.'
    example_gloss:
    - Sollen wir etwas vereinbaren?
    - Rufen Sie einen Tag vorher an.
  nl.a2.unit80.lesson04.teach.maandag_tien:
    title: Eine Zeit annehmen
    gloss: Montag um zehn Uhr passt.
  nl.a2.unit80.lesson04.teach.kunt_u:
    title: Fragen, ob eine Zeit passt
    gloss: Können Sie am Montag um zehn Uhr kommen? (formell)
    note: '*Kunt u* ist die höfliche Form von *kun je*. Der Infinitiv *komen* steht am Ende.'
  nl.a2.unit80.lesson04.teach.zie_u_maandag:
    title: Die Vereinbarung abschließen
    gloss: Dann erwarten wir Sie am Montag.
  nl.a2.unit80.lesson04.teach.nieuwe_afspraak:
    title: Einen neuen Termin machen
    gloss: Dann mache ich einen neuen Termin.
  nl.a2.unit80.lesson04.teach.gn_tijd:
    title: Erst der Tag, dann die Uhrzeit
    gloss: Montag um zehn Uhr passt. Können Sie am Montag um zehn Uhr kommen?
    note: 'Wenn Sie Tag und Uhrzeit nennen, steht zuerst der Tag, dann *om* + die Uhrzeit: *maandag om tien uur*. In einer höflichen Frage verwendet man *Kunt u ...?* und setzt den Infinitiv ans Ende.'
  nl.a2.unit80.lesson05.teach.kapsalon_bericht:
    title: Eine Nachricht vom Friseursalon
    gloss: Lieber Omar, Ihr Termin wurde verschoben. Ihr neuer Termin ist Montag um zehn Uhr. Passt Ihnen das nicht? Dann rufen Sie uns einen Tag vorher an. Dann vereinbaren wir einen neuen Termin. Bis Montag! Kapsalon Jansen
    note: Dies ist eine typische kurze Nachricht eines Unternehmens, daher werden das höfliche *u* und *uw* verwendet. *Is verzet* bedeutet „wurde verschoben“.
    glosses:
      beste: sehr geehrter
      omar: Omar
      uw: Ihr (formell)
      afspraak: Termin
      verzet: verschoben
      nieuwe: neu
      maandag: Montag
      tien: zehn
      uur: Uhr
      komt: passt (komt ... uit)
      dit: das
      niet: nicht
      uit: (Teil von komt ... uit)
      bel: anrufen
      ons: uns
      dan: dann
      tevoren: im Voraus
      maken: machen
      we: wir
      tot: bis
      kapsalon: Friseursalon
      jansen: Jansen
  nl.a2.unit80.lesson06.teach.kapper_opening:
    title: Der Salon meldet sich
    gloss: 'Friseurin: Friseursalon Jansen, guten Tag.'
  nl.a2.unit80.lesson06.teach.omar_vraagt:
    title: Omar erklärt und fragt
    gloss: 'Omar: Guten Tag, hier spricht Omar. Ich habe am Donnerstag einen Termin, kann aber leider nicht kommen. Kann ich den Termin verschieben?'
  nl.a2.unit80.lesson06.teach.kapper_vrijdag:
    title: Die Friseurin schlägt Freitag vor
    gloss: 'Friseurin: Natürlich. Passt Ihnen Freitag?'
  nl.a2.unit80.lesson06.teach.omar_maandag:
    title: Omar schlägt Montag vor
    gloss: 'Omar: Leider nicht, denn ich muss arbeiten. Geht es auch am Montag?'
  nl.a2.unit80.lesson06.teach.kapper_tien:
    title: Die Friseurin sagt zu
    gloss: 'Friseurin: Montag um zehn Uhr passt.'
  nl.a2.unit80.lesson06.teach.omar_dank:
    title: Omar sagt zu und entschuldigt sich
    gloss: 'Omar: Das passt mir gut. Vielen Dank und entschuldigen Sie die Umstände.'
  nl.a2.unit80.lesson06.teach.kapper_einde:
    title: Die Friseurin verabschiedet sich
    gloss: 'Friseurin: Kein Problem. Bis Montag!'
