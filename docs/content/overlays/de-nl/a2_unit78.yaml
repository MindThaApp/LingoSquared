teaching:
  nl.a2.unit78.lesson01.teach.weekend:
    title: Das Wochenende / letztes Wochenende
    gloss: das Wochenende / letztes Wochenende (das gerade vergangene)
    note: '*Het weekend* ist ein Neutrum (het). *Afgelopen weekend* bedeutet das Wochenende, das gerade vergangen ist; es ist also die natürliche Wendung für „letztes Wochenende“, wenn man davon erzählt.'
    example_gloss:
    - Das Wochenende beginnt am Samstag.
    - Letztes Wochenende habe ich gearbeitet.
  nl.a2.unit78.lesson01.teach.zaterdag_zondag:
    title: Samstag und Sonntag
    gloss: Samstag / Sonntag
    note: Wochentage werden im Niederländischen kleingeschrieben, außer am Satzanfang. (Im Deutschen schreibt man sie dagegen immer groß.)
    example_gloss:
    - Am Samstag habe ich frei.
    - Sonntags schlafe ich aus.
  nl.a2.unit78.lesson01.teach.boodschappen:
    title: Besorgungen machen
    gloss: einkaufen gehen / Besorgungen machen
    note: '*Boodschappen doen* ist die feste Wendung für Einkaufen (Lebensmittel) und kleine Besorgungen. *Boodschappen* steht im Plural und ohne Artikel.'
    example_gloss: Jeden Samstag gehe ich einkaufen.
  nl.a2.unit78.lesson01.teach.op_bezoek:
    title: Jemanden besuchen
    gloss: (jemanden) besuchen gehen
    note: '*Op bezoek gaan* bedeutet, Leute bei ihnen zu Hause zu besuchen; man ergänzt *bij* + die Person: *op bezoek bij mijn oom*.'
    example_gloss: Ich besuche oft meinen Onkel.
  nl.a2.unit78.lesson01.teach.uitjes:
    title: Ziele am Wochenende
    gloss: der Markt / der Park / das Kino
    note: '*De markt* und *de bioscoop* sind de-Wörter; *het park* ist ein het-Wort.'
    example_gloss:
    - Ich kaufe Gemüse auf dem Markt.
    - Ich gehe gern im Park spazieren.
    - Am Samstag gehe ich ins Kino.
  nl.a2.unit78.lesson01.teach.werken_koken:
    title: Vier Verben für den Alltag
    gloss: arbeiten / kochen / essen / trinken
    note: Das sind die Infinitive. Später in dieser Lektion bilden Sie daraus die Vergangenheitsformen.
    example_gloss:
    - Ich muss heute arbeiten.
    - Ich kann gut kochen.
    - Ich möchte essen.
    - Möchten Sie Kaffee trinken?
  nl.a2.unit78.lesson01.teach.vraag:
    title: Fragen, was jemand letztes Wochenende gemacht hat
    gloss: Was hast du letztes Wochenende gemacht?
    note: Das ist die Standardfrage. *Gedaan* ist das Partizip von *doen* und steht ganz am Ende.
  nl.a2.unit78.lesson01.teach.gn_frame:
    title: 'Das Perfekt: heb/ben + Partizip'
    gloss: Am Samstag habe ich Einkäufe gemacht. Am Sonntag war ich bei meinem Onkel.
    note: 'Das *perfectum* ist die alltägliche Form, um zu erzählen, was man getan hat. Es besteht aus zwei Teilen: einer Form von *hebben* oder *zijn* an zweiter Stelle und dem *Partizip* (*gedaan*, *gegaan*) ganz am Ende des Satzes. Alles andere (ein Tag, ein Objekt, ein Ort) steht davor oder dazwischen, aber *heb/ben* bleibt (im Aussagesatz) immer an zweiter Stelle: *Zaterdag heb ik boodschappen gedaan.* Die meisten Verben bilden das Perfekt mit *hebben*; *gaan* verwendet *zijn*. Lektion 3 erklärt, wann.'
  nl.a2.unit78.lesson02.teach.weekend_verbs:
    title: Vier Aktivitäten am Wochenende
    gloss: spazieren gehen / Rad fahren / spielen / Sport treiben
    note: '*Spelen* verwendet man für Spiele und Ballsportarten sowie für Instrumente: *voetbal spelen*. *Sporten* bedeutet allgemein Sport treiben.'
    example_gloss:
    - Wollen wir spazieren gehen?
    - Morgen fahre ich Rad.
    - Die Kinder wollen draußen spielen.
    - Ich möchte öfter Sport treiben.
  nl.a2.unit78.lesson02.teach.gn_regular:
    title: 'Regelmäßige Partizipien: ge- + Stamm + -t oder -d'
    gloss: arbeiten → gearbeitet, kochen → gekocht, spazieren gehen → spazieren gegangen, spielen → gespielt, Rad fahren → Rad gefahren
    note: 'Regelmäßige Verben bilden das Partizip aus *ge-* + Stamm + *-t* oder *-d*. Der Stamm ist die *ik*-Form: *werk*, *kook*, *wandel*, *speel*, *fiets*. Welche Endung? Wenden Sie die *''t kofschip*-Regel auf den letzten Buchstaben des Stamms an (ein Vorgriff; die ganze Regel folgt später): Ist es einer der Buchstaben *t, k, f, s, ch, p*, wird *-t* angehängt (*werk → gewerkt*, *kook → gekookt*, *fiets → gefietst*). Bei jedem anderen Buchstaben wird *-d* angehängt (*wandel → gewandeld*, *speel → gespeeld*). Entscheidend ist der Stamm (die *ik*-Form). Eine Ausnahme für später: Hat der Infinitiv ein *v* oder *z* (*leven, reizen*), steht *-d*: *geleefd, gereisd*.'
  nl.a2.unit78.lesson02.teach.gn_stem_t:
    title: Wenn der Stamm schon auf -t endet
    gloss: Ich treibe Sport. Ich habe Sport getrieben.
    note: 'Endet der Stamm schon auf *-t* (oder *-d*), hängen Sie nichts mehr an: *sport → gesport*, nicht *gesportt*. Das *ge-* steht trotzdem davor.'
  nl.a2.unit78.lesson02.teach.park_gewandeld:
    title: Im Park spazieren gehen
    gloss: Ich bin im Park spazieren gegangen.
    note: '*Wandelen* steht hier mit *hebben*, weil es kein Ziel gibt; man geht einfach spazieren.'
  nl.a2.unit78.lesson02.teach.voetbal_gespeeld:
    title: Fußball spielen
    gloss: Ich habe Fußball gespielt.
    note: 'Bei Sportarten heißt es *gespeeld*: *voetbal spelen → ik heb voetbal gespeeld*.'
  nl.a2.unit78.lesson03.teach.hebben_zijn:
    title: Die beiden Hilfsverben
    gloss: haben / sein
    note: 'Im perfectum sind *hebben* und *zijn* die Hilfsverben. Ihre Formen: *ik heb, ik ben*; *het heeft, het is*.'
    example_gloss:
    - Ich hätte auch gern ein Fahrrad.
    - Das kann Spaß machen.
  nl.a2.unit78.lesson03.teach.gn_irregular:
    title: 'Unregelmäßige Partizipien: als ganze Wörter lernen'
    gloss: sehen → gesehen, lesen → gelesen, schlafen → geschlafen, essen → gegessen, trinken → getrunken, kaufen → gekauft, tun → getan
    note: 'Unregelmäßige Verben folgen nicht der *-t/-d*-Regel. Die meisten beginnen trotzdem mit *ge-*, und viele enden auf *-en*: *gezien, gelezen, geslapen, gegeten, gedronken, gedaan*. Einige, wie *kopen → gekocht*, enden auf *-t*, verändern aber den Vokal im Inneren. Kurzer Test: Endet ein Partizip nicht auf ein regelmäßig an den Stamm angehängtes *-t* oder *-d*, ist es unregelmäßig, und Sie müssen es als ganzes Wort lernen.'
  nl.a2.unit78.lesson03.teach.film_gezien:
    title: Einen Film ansehen
    gloss: Ich habe einen Film gesehen.
    note: Im Niederländischen sagt man *een film zien* („einen Film sehen“), egal ob im Kino oder zu Hause.
  nl.a2.unit78.lesson03.teach.lang_geslapen:
    title: Zwei Partizipien in einem Satz
    gloss: Ich habe lange geschlafen und ein Buch gelesen.
    note: 'Bei zwei Handlungen mit demselben *heb* können Sie das zweite *heb* weglassen: *Ik heb lang geslapen en een boek gelezen.*'
  nl.a2.unit78.lesson03.teach.bezocht:
    title: Ein Partizip ohne ge-
    gloss: Ich habe meinen Onkel besucht.
    note: 'Verben mit einer unbetonten Vorsilbe wie *be-*, *ver-* oder *ont-* bekommen kein *ge-*: *bezoeken → bezocht* (besuchen). Dieses Verb ist außerdem unregelmäßig. *Ik heb mijn oom bezocht* und *Ik ben op bezoek geweest bij mijn oom* bedeuten fast dasselbe.'
  nl.a2.unit78.lesson03.teach.gn_aux:
    title: Hebben oder zijn?
    gloss: Ich habe einen Film gesehen. Ich war bei meinem Onkel. Ich bin zu Hause geblieben. Ich war bei meinem Onkel. Es wurde spät.
    note: '*Hebben* ist das Standardhilfsverb: *Ik heb gewerkt, ik heb een film gezien*. *Zijn* verwenden Sie für zwei Gruppen: (1) Fortbewegung an einen neuen Ort, etwa *gaan* und *komen*, und (2) Sein oder Veränderung, etwa *zijn, blijven, worden*. Schnelltest: Geht es im Verb selbst darum, irgendwohin zu gehen oder zu kommen, zu bleiben (*blijven*), zu sein (*zijn*) oder zu werden (*worden*)? Dann *zijn*. Beachten Sie, dass *het* mit *is* steht: *Het is laat geworden* (Es ist spät geworden). Bewegung ohne Ziel steht mit *hebben*: *Ik heb in het park gewandeld*, mit Ziel dagegen mit *zijn*.'
  nl.a2.unit78.lesson03.teach.zijn_verbs:
    title: Verben der Bewegung und Veränderung (mit zijn)
    gloss: gehen → gegangen, kommen → gekommen, bleiben → geblieben, werden → geworden, sein → gewesen
    note: 'Diese fünf Verben bilden das Perfekt (perfectum) mit *zijn*: *ik ben gegaan, ik ben gekomen, ik ben gebleven, het is geworden, ik ben geweest*. Alle fünf haben unregelmäßige Partizipien.'
  nl.a2.unit78.lesson04.teach.eerst_daarna:
    title: Zuerst und dann
    gloss: zuerst / danach
    note: '*Eerst* und *daarna* bringen Handlungen in eine Reihenfolge. Mit diesen Verbindungswörtern können Sie eine Wochenendgeschichte der Reihe nach erzählen.'
    example_gloss:
    - Zuerst arbeite ich, dann gehe ich zum Sport.
    - Zuerst esse ich, dann trinke ich Kaffee.
  nl.a2.unit78.lesson04.teach.gn_order:
    title: 'In der Reihenfolge erzählen: eerst, daarna'
    gloss: Zuerst bin ich auf den Markt gegangen, dann habe ich gekocht.
    note: 'Nach *eerst* oder *daarna* steht das Hilfsverb direkt dahinter, vor *ik*: *Daarna heb ik gekookt*, nicht *Daarna ik heb gekookt*. Das Partizip bleibt am Ende jedes Satzteils.'
  nl.a2.unit78.lesson04.teach.gn_niet:
    title: 'Sagen, was Sie nicht getan haben: niet'
    gloss: Ich habe nicht gearbeitet. Ich habe das Buch nicht gelesen. Ich bin nicht zu meinem Onkel gefahren.
    note: 'Im Perfekt (perfectum) steht *niet* vor dem Partizip: *Ik heb niet gewerkt*. Hat der Satz ein bestimmtes Objekt (*het boek*), steht das Objekt zuerst und *niet* folgt: *Ik heb het boek niet gelezen*. Vor einer Orts- oder Richtungsangabe steht *niet* davor: *Ik ben niet naar mijn oom gegaan*. Ein Zeitwort wie *zaterdag* steht vor *niet*: *Ik heb zaterdag niet gewerkt*. Setzen Sie *niet* nie hinter das Partizip.'
  nl.a2.unit78.lesson04.teach.gn_geen:
    title: 'Sagen, dass man keins hatte: geen'
    gloss: Ich habe keinen Kaffee getrunken. Ich hatte keine Zeit.
    note: 'Verwenden Sie *geen* anstelle von *een* oder anstelle eines fehlenden Artikels vor einem Nomen: *een film → geen film*, *koffie → geen koffie*, *tijd → geen tijd*. *Niet* verwenden Sie bei Verben, bei bestimmten Dingen (*het boek*) und bei Ortsangaben. *Gehad* ist das Partizip von *hebben*.'
  nl.a2.unit78.lesson04.teach.lotte_gesport:
    title: Lotte fragt nach dem Sport
    gloss: 'Lotte: Hast du Sport gemacht?'
    note: 'In einer Ja/Nein-Frage steht das Hilfsverb an erster Stelle: *Heb je gesport?*'
  nl.a2.unit78.lesson04.teach.omar_niet_gesport:
    title: Omar sagt nein
    gloss: 'Omar: Nein, ich habe keinen Sport gemacht.'
  nl.a2.unit78.lesson05.teach.noor_bericht:
    title: Eine Nachricht von Noor
    gloss: Hallo Lotte! Es war ein ruhiges Wochenende. Am Samstagmorgen bin ich zum Markt gegangen und habe Brot gekauft. Nachmittags bin ich im Park spazieren gegangen. Abends habe ich gekocht. Ich habe keinen Sport gemacht und keinen Film gesehen. Am Sonntag bin ich zu Hause geblieben. Ich habe lange geschlafen und ein Buch gelesen.
    note: 'Noor erzählt Lotte der Reihe nach von ihrem Wochenende: Samstagmorgen, -nachmittag und -abend, dann Sonntag. Achten Sie darauf, wo das Partizip steht: in jedem Satz am Ende. *''s Middags* und *''s Avonds* bedeuten „nachmittags“ und „abends“.'
    glosses:
      hoi: hallo
      rustig: ruhig
      weekend: Wochenende
      geweest: gewesen (Partizip von zijn)
      zaterdagochtend: Samstagmorgen
      markt: Markt
      brood: Brot
      gekocht: gekauft (Partizip von kopen)
      middags: nachmittags ('s middags)
      park: Park
      gewandeld: spazieren gegangen (Partizip von wandelen)
      avonds: abends ('s avonds)
      gekookt: gekocht (Partizip von koken)
      niet: nicht
      gesport: Sport gemacht (Partizip von sporten)
      geen: nein, kein
      film: Film
      gezien: gesehen (Partizip von zien)
      zondag: Sonntag
      thuisgebleven: zu Hause geblieben (Partizip von thuisblijven)
      lang: lange
      geslapen: geschlafen (Partizip von slapen)
      boek: Buch
      gelezen: gelesen (Partizip von lezen)
  nl.a2.unit78.lesson06.teach.lotte_vraag:
    title: Lotte fragt Omar nach seinem Wochenende
    gloss: 'Lotte: Hallo Omar! Was hast du letztes Wochenende gemacht?'
  nl.a2.unit78.lesson06.teach.omar_zaterdag:
    title: Omar beschreibt den Samstag
    gloss: 'Omar: Am Samstag bin ich zu meinem Onkel nach Amsterdam gefahren. Ich habe bei meinem Onkel gegessen.'
    note: '*Bij mijn oom* bedeutet „bei meinem Onkel“. *Naar mijn oom* gibt die Richtung an, *bij mijn oom* den Ort.'
  nl.a2.unit78.lesson06.teach.lotte_zondag:
    title: Lotte fragt nach dem Sonntag
    gloss: 'Lotte: Schön! Und Sonntag?'
  nl.a2.unit78.lesson06.teach.omar_zondag:
    title: Omar beschreibt den Sonntag und fragt zurück
    gloss: 'Omar: Am Sonntag bin ich zu Hause geblieben. Ich habe lange geschlafen und keinen Sport gemacht. Und du?'
  nl.a2.unit78.lesson06.teach.lotte_antwoord:
    title: Lotte beschreibt ihr Wochenende
    gloss: 'Lotte: Ich bin zu meinen Eltern gefahren. Ich habe keine Einkäufe gemacht, aber ich habe gekocht.'
