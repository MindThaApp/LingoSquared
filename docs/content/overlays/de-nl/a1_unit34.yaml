    title: Wer nutzt was?
    gloss: Lotte ruft Omar jeden Tag an. Sie benutzt ihr Telefon, keine App. Omar hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Handy. Sander sucht jeden Morgen den Wetterbericht heraus. Dann geht er joggen. Fenna schickt Lotte oft eine Nachricht. Benutzt du auch jeden Tag dein Handy?
