teaching:
  nl.a2.unit100.lesson01.teach.kleding:
    title: Kleidung
    gloss: die Jacke / der Pullover / die Hose / der Schal / das Kleid / der Schuh
    note: Die Kleidungswörter aus A1 kommen hier wieder vor. Alle sind *de*-Wörter. Der Plural von *schoen* ist *schoenen*.
    example_gloss:
    - Ich habe eine Jacke.
    - Der Pullover ist blau.
    - Die Hose ist lang.
    - Die Schuhe sind schwarz.
  nl.a2.unit100.lesson01.teach.kleuren:
    title: Farben
    gloss: rot / blau / grün / gelb / schwarz / weiß
    note: Farbwörter sind Adjektive. In dieser Lektion lernen Sie, wann sie eine Endung bekommen.
    example_gloss:
    - Die Jacke ist rot.
    - Die Tasche ist schwarz.
    - Das Papier ist weiß.
  nl.a2.unit100.lesson01.teach.grootte:
    title: Größe
    gloss: groß / klein / lang / kurz
    example_gloss:
    - Das Haus ist groß.
    - Der Schlüssel ist klein.
    - Der Schal ist lang.
    - Das Kleid ist kurz.
  nl.a2.unit100.lesson01.teach.huis:
    title: Zu Hause
    gloss: der Tisch / der Stuhl / die Lampe / das Bett / das Haus / das Buch / das Papier
    note: 'Lernen Sie jedes Nomen mit *de* oder *het*. Ab jetzt ist das für Adjektive wichtig: *bed, huis, boek* und *papier* sind *het*-Wörter.'
    example_gloss:
    - Der Tisch ist groß.
    - Das Bett ist klein.
    - Das Buch ist blau.
    - Die Lampe ist gelb.
  nl.a2.unit100.lesson01.teach.kwijt:
    title: Fundsachen
    gloss: die Tasche / der Schlüssel / der Regenschirm / das Portemonnaie / verloren
    note: '*Kwijt zijn* bedeutet, etwas verloren zu haben und nicht zu wissen, wo es ist.'
    example_gloss:
    - Ich habe meine Tasche verloren.
    - Der Schlüssel ist klein.
    - Der Regenschirm ist grün.
    - Das Portemonnaie ist rot.
  nl.a2.unit100.lesson01.teach.gn_na_zijn:
    title: Keine Endung nach zijn
    gloss: Die Jacke ist rot. Das Haus ist groß. Die Jacken sind rot.
    note: 'Nach *zijn* bleibt das Adjektiv unverändert, ohne *-e*: *de jas is rood, het huis is groot, de jassen zijn rood*. Das *-e* erscheint nur, wenn das Adjektiv vor dem Nomen steht.'
  nl.a2.unit100.lesson02.teach.eigenschappen:
    title: Weitere Adjektive
    gloss: schön / alt / neu / warm / weich
    example_gloss:
    - Die Lampe ist schön.
    - Das Haus ist alt.
    - Der Pullover ist neu.
    - Der Schal ist warm.
    - Das Bett ist weich.
  nl.a2.unit100.lesson02.teach.gn_bepaald:
    title: 'Mit de oder het: immer -e'
    gloss: die rote Jacke, die große Tasche, der blaue Pullover; das rote Haus, das große Bett, das weiße Papier
    note: 'Nach *de* oder *het* endet das Adjektiv vor dem Nomen immer auf *-e*, bei *de*-Wörtern wie bei *het*-Wörtern: *de rode jas* und *het rode huis*.'
  nl.a2.unit100.lesson02.teach.gn_spelling:
    title: Schreibweise ändert sich
    gloss: 'rot, groß, weiß, gelb: wie sie vor einem Nomen geschrieben werden'
    note: 'Durch das Anfügen von *-e* kann sich die Schreibung ändern. Ein langer Vokal, der doppelt geschrieben wird, verliert einen Buchstaben: *rood → rode, groot → grote, geel → gele*. Ein kurzer Vokal vor einem einzelnen Endkonsonanten verdoppelt diesen Konsonanten: *wit → witte*.'
  nl.a2.unit100.lesson02.teach.gn_regelmatig:
    title: Die meisten Adjektive bekommen einfach ein -e
    gloss: blau, schwarz, grün, neu, alt, schön, klein, lang, kurz, warm, weich
    note: Die meisten Adjektive bekommen einfach ein *-e*, ohne Änderung der Schreibung.
  nl.a2.unit100.lesson02.teach.zinnen:
    title: Drei Sätze
    gloss: Die rote Jacke ist schön. Das weiße Papier ist neu. Der grüne Stuhl ist alt.
    note: 'Das Adjektiv vor dem Nomen bekommt *-e*; nach *is* bleibt es unverändert: *de jas is mooi*.'
  nl.a2.unit100.lesson03.teach.hebben:
    title: Dinge besitzen
    gloss: Ich habe ein großes Bett. Sie hat eine große Tasche. Sie hat rote Schuhe. Er hat ein blaues Buch.
    note: '*Zij* und *ze* bedeuten beide „sie“. Achten Sie auf die Endungen: *groot bed*, aber *grote tas*.'
  nl.a2.unit100.lesson03.teach.gn_een:
    title: Mit een
    gloss: eine rote Jacke, eine große Tasche; ein rotes Haus, ein großes Bett
    note: Nach *een* behält ein *de*-Wort das *-e* (*een rode jas*), ein *het*-Wort bekommt dagegen keine Endung (*een rood huis*). Also *het rode huis*, aber *een rood huis*.
  nl.a2.unit100.lesson03.teach.gn_zonder:
    title: Ohne Artikel
    gloss: weißes Papier, rotes Papier; rote Jacken, rote Häuser, große Taschen
    note: Ein *het*-Wort im Singular ohne Artikel hat keine Endung (*wit papier*). Ein Plural hat immer *-e* (*rode jassen, rode huizen*), unabhängig vom Nomen.
  nl.a2.unit100.lesson03.teach.gn_contrast:
    title: Het-Wort oder de-Wort?
    gloss: das rote Haus → ein rotes Haus; die rote Jacke → eine rote Jacke
    note: 'Vor einem Nomen hat nur ein Fall kein *-e*: ein *het*-Wort im Singular mit *een* oder ohne Artikel. Alles andere endet auf *-e*.'
  nl.a2.unit100.lesson04.teach.materiaal:
    title: Material
    gloss: aus Holz / aus Wolle / aus Baumwolle / aus Leder
    note: Um zu sagen, woraus etwas gemacht ist, verwenden Sie *van* plus Material.
    example_gloss:
    - Der Tisch ist aus Holz.
    - Der Pullover ist aus Wolle.
    - Die Tasche ist aus Leder.
    - Die Hose ist aus Baumwolle.
  nl.a2.unit100.lesson04.teach.bezit:
    title: Besitzer
    gloss: mein / dein / sein / ihr
    note: '*Je* und *jouw* bedeuten beide „dein“, wenn man eine einzelne Person duzt.'
    example_gloss:
    - Mein alter Tisch ist aus Holz.
    - Deine neue Jacke ist aus Wolle.
    - Sein kleines Buch ist neu.
    - Ihre große Tasche ist schwarz.
  nl.a2.unit100.lesson04.teach.gn_bezit:
    title: Besitzwörter verhalten sich wie de oder het
    gloss: mein rotes Haus, ihre große Tasche, sein altes Buch, deine neue Jacke
    note: 'Nach *mijn, jouw, je, zijn* und *haar* endet das Adjektiv auf *-e*, auch bei *het*-Wörtern: *mijn rode huis*, *zijn oude boek*.'
  nl.a2.unit100.lesson04.teach.gn_volgorde:
    title: Größe, Farbe, Material
    gloss: eine große rote Ledertasche; das kleine weiße Haus
    note: 'Mehrere Adjektive bekommen jeweils dieselbe Endung. Die Größe steht vor der Farbe: *een grote rode tas*. Das Material folgt dem Nomen mit *van*: *een tas van leer*.'
  nl.a2.unit100.lesson04.teach.zinnen:
    title: Zwei Sätze
    gloss: Omar hat eine große schwarze Ledertasche. Sein Pullover ist aus Wolle.
  nl.a2.unit100.lesson05.teach.bericht:
    title: Noor hat ihre Tasche verloren
    gloss: Hallo Lotte, ich habe meine Tasche verloren! Es ist eine kleine schwarze Ledertasche. In der Tasche sind ein rotes Portemonnaie und ein Schlüssel. Der Schlüssel gehört zu meinem Haus. Auch mein langer gelber Wollschal ist weg. Mein Regenschirm ist grün und neu. Kannst du mir helfen? Liebe Grüße, Noor
    note: 'Achten Sie auf die Endungen: *kleine zwarte tas*, aber *paraplu is groen*.'
    glosses:
      weg: weg
      helpen: helfen
      mij: mir
      Groetjes: Grüße
      zit: befindet sich
      Ook: auch
  nl.a2.unit100.lesson06.teach.vraag:
    title: Omar fragt, was los ist
    gloss: 'Omar: Lotte, was ist los?'
  nl.a2.unit100.lesson06.teach.jas_kwijt:
    title: Lotte sagt, dass sie ihre Jacke verloren hat
    gloss: 'Lotte: Ich habe meine Jacke verloren.'
  nl.a2.unit100.lesson06.teach.wat_voor:
    title: Omar fragt, was für eine Jacke es ist
    gloss: 'Omar: Was für eine Jacke ist es?'
  nl.a2.unit100.lesson06.teach.beschrijving:
    title: Lotte beschreibt die Jacke
    gloss: 'Lotte: Eine lange grüne Jacke aus Wolle.'
  nl.a2.unit100.lesson06.teach.oud_of_nieuw:
    title: Omar fragt, ob sie alt oder neu ist
    gloss: 'Omar: Ist es deine alte Jacke oder deine neue Jacke?'
  nl.a2.unit100.lesson06.teach.nieuwe_jas:
    title: Lotte sagt, dass es die neue ist
    gloss: 'Lotte: Meine neue Jacke. Sie ist grün und sehr schön.'
