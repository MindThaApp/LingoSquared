course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2 zum Beschreiben von Dingen.
  learning_goal: Einen Gegenstand mit Größe, Farbe, Material und Besitzer genau beschreiben und dabei die richtige Adjektivendung verwenden.
