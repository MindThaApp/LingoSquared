teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden bei Essen und Trinken
    gloss: Bei Essen und Trinken verwendet das Niederländische oft lekker vinden.
    note: 'Deutsches „mögen“ entspricht nicht nur einem niederländischen Ausdruck. Bei Geschmack sagt man *Ik vind ... lekker*, wörtlich: „Ich finde ... lecker“.'
  nl.a1.unit13.lesson01.teach.koffie:
    title: Kaffee mögen
    gloss: Ich mag Kaffee.
    note: Das Essen oder Getränk steht zwischen *vind* und *lekker*.
  nl.a1.unit13.lesson01.teach.thee:
    title: Tee nicht mögen
    gloss: Ich mag keinen Tee.
    note: Setzen Sie *niet* vor *lekker*, um den Geschmack abzulehnen.
  nl.a1.unit13.lesson01.teach.question:
    title: Nach dem Geschmack fragen
    gloss: Magst du Tomatensuppe?
    note: In der informellen Frage steht *vind* vor *je*. Das setzt das *jij/je*-Register des Kurses fort.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden bei Tätigkeiten
    gloss: 'Bei Tätigkeiten verwendet das Niederländische oft leuk vinden: Ich fahre gern Rad.'
    note: Verwenden Sie *leuk*, nicht *lekker*, für eine Tätigkeit wie Radfahren.
  nl.a1.unit13.lesson02.teach.walking:
    title: Gern spazieren gehen
    gloss: Ich gehe gern spazieren.
    note: Die Tätigkeit *wandelen* steht zwischen *vind* und *leuk*.
  nl.a1.unit13.lesson02.teach.dislike:
    title: Einkaufen nicht mögen
    gloss: Ich gehe nicht gern einkaufen.
    note: '*Niet* steht vor *leuk*.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: Nach Tätigkeiten fragen
    gloss: Was machen Sie gern?
    note: '*Wat vind je leuk om te doen?* ist eine natürliche allgemeine Frage nach den Lieblingsbeschäftigungen einer Person.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: Eine stärkere oder allgemeine Zuneigung
    gloss: Houden van drückt eine starke oder allgemeine Vorliebe aus.
    note: Verwenden Sie es gezielt. Normale Reaktionen auf ein bestimmtes Essen oder eine bestimmte Tätigkeit drückt man natürlicher mit *lekker vinden* oder *leuk vinden* aus.
  nl.a1.unit13.lesson03.teach.music:
    title: Musik sehr mögen
    gloss: Ich liebe Musik. / Ich mag Musik sehr.
    note: '*Houd* ist die *ik*-Form von *houden*; danach folgt *van*.'
  nl.a1.unit13.lesson03.teach.films:
    title: Filme nicht mögen
    gloss: Ich mag keine Filme.
    note: In der Verneinung steht *niet* zwischen *houd* und *van*.
  nl.a1.unit13.lesson03.teach.contrast:
    title: Den natürlichen Ausdruck wählen
    gloss: 'Bei einem gewöhnlichen Geschmack sagt man auch: Ich mag Kaffee. Bei einer Tätigkeit: Ich gehe gern spazieren.'
    note: Übersetzen Sie nicht jedes deutsche „mögen“ automatisch mit *houden van*.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: Zwei Möglichkeiten anbieten
    gloss: Möchtest du Kaffee oder Tee?
    note: '*Wil je ... of ...?* bittet die andere Person, sich zu entscheiden.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: Sagen, was man lieber möchte
    gloss: Ich möchte lieber Tee.
    note: '*Liever* folgt in diesem üblichen Muster der Wahl auf *wil*.'
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: Eine Sache vorziehen
    gloss: Ich nehme lieber den blauen Pullover.
    note: '*Ik heb liever ...* passt ebenfalls, wenn man einen Gegenstand einem anderen vorzieht.'
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever markiert die bevorzugte Option
    gloss: Liever zeigt, dass Sie eine Option einer anderen vorziehen.
    note: Der Vergleich kann unausgesprochen bleiben, wenn beide Möglichkeiten aus dem Gespräch klar sind.
  nl.a1.unit13.lesson05.teach.message:
    title: Mehrere Vorlieben lesen
    gloss: Hallo Lotte, ich finde den Film gut, aber Omar mag keine Filme. Er möchte lieber in den Park. Ich gehe auch gern spazieren.
    note: Achten Sie darauf, wer den Film mag, wer Filme ablehnt und welche Alternative Omar wählt.
    glosses:
      Hoi: hallo
      vind: mögen / finden
      film: Film
      leuk: schön / unterhaltsam
      maar: aber
      houdt: mag
      films: Filme
      wil: möchte
      liever: lieber / bevorzugt
      park: Park
      wandelen: Spazierengehen
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotte bietet zwei Speisen an
    gloss: 'Lotte: Was möchtest du essen, Omar? Möchtest du Brot oder Tomatensuppe?'
    note: Die zweite Frage nennt die beiden Möglichkeiten.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omar wählt die Suppe
    gloss: 'Omar: Ich möchte lieber Tomatensuppe. Ich mag Tomatensuppe. Und du?'
    note: Omar trifft zuerst mit *liever* eine Wahl und begründet sie dann mit *lekker* als Geschmack.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotte wählt Brot
    gloss: 'Lotte: Ich nehme lieber Brot. Tomatensuppe schmeckt mir nicht so gut.'
    note: '*Niet zo lekker* schwächt die Verneinung ab und klingt in einem freundlichen Gespräch natürlich.'
  nl.a1.unit13.lesson06.teach.activity:
    title: Entscheiden, was als Nächstes passiert
    gloss: 'Omar: Was möchtest du nach dem Essen machen? Lotte: Ich gehe gern spazieren.'
    note: '*Leuk* beschreibt die Tätigkeit *wandelen*.'
  nl.a1.unit13.lesson06.teach.plan:
    title: Sie teilen eine Vorliebe
    gloss: 'Omar: Ich auch. Ich gehe sehr gern spazieren. Wollen wir in den Park gehen? Lotte: Gute Idee.'
    note: Das knüpft an die informelle Sprache zum Verabreden aus Einheit 11 an.
