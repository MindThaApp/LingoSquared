teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: Die Fahrkarte
    gloss: die Fahrkarte
    note: '*Het kaartje* ist sächlich; verwenden Sie *het*, nicht *de*.'
    example_gloss: Ich hätte gern eine Fahrkarte nach Utrecht.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: Eine Fahrkarte verlangen
    gloss: Ich hätte gern eine Fahrkarte nach Utrecht.
    note: '*Wil graag* macht eine Bitte höflicher; es ist dasselbe Muster wie beim Bestellen von Essen in Lektion 6.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: Der Schalterbeamte fragt nach der Art
    gloss: Möchten Sie eine einfache Fahrkarte oder eine Hin- und Rückfahrkarte?
    note: '*Wilt u* ist die höfliche Anredeform von *willen*; sie wird hier für eine fremde Bahnmitarbeiterin bzw. einen fremden Bahnmitarbeiter verwendet.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: Höflich antworten
    gloss: Hin und zurück, bitte.
    note: '*Alstublieft* ist das höfliche „bitte“ und passt zum *u*-Register dieses Gesprächs.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: Die Anredeform am Schalter
    gloss: Am Schalter benutzt man meist die Höflichkeitsform u.
    note: 'Das knüpft an den Unterschied zwischen *jij*/*je* und *u* aus Lektion 1 an: Fremde in einer Dienstleistungsrolle werden in der Regel mit *u* angesprochen.'
  nl.a1.unit15.lesson02.teach.perron:
    title: Der Bahnsteig
    gloss: der Bahnsteig
    note: '*Het perron* ist sächlich; verwenden Sie *het*, nicht *de*.'
    example_gloss: Von welchem Gleis fährt der Zug nach Utrecht ab?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: Nach dem Bahnsteig fragen
    gloss: Von welchem Gleis fährt der Zug nach Utrecht ab?
    note: '*Van welk perron* fragt gezielt nach dem Gleis, nicht allgemein nach einem Ort.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: Abfahrtsdetails nennen
    gloss: Der Zug fährt um Viertel vor zehn von Bahnsteig fünf ab.
    note: '*Kwart voor tien* greift das Muster für Uhrzeiten aus Lektion 4 wieder auf.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: Nach der Ankunftszeit fragen
    gloss: Um wie viel Uhr kommt der Zug an?
    note: '*Komt ... aan* gehört zum trennbaren Verb *aankomen*; *aan* rückt ans Ende der Frage.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: Die Ankunftszeit nennen
    gloss: Der Zug kommt um elf Uhr an.
    note: Auch hier ist *komt aan* ein trennbares Verb, dessen zwei Teile im Satz auseinanderstehen.
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: Pünktlich / die Verspätung
    gloss: pünktlich; die Verspätung
    note: '*Op tijd* ist ein fester Ausdruck dafür, dass etwas planmäßig geschieht. *De vertraging* (die Verspätung) ist ein de-Wort.'
    example_gloss:
    - Der Zug fährt nicht pünktlich ab.
    - 'Achtung: Der Zug nach Utrecht hat Verspätung.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: Eine Durchsage
    gloss: 'Achtung: Der Zug nach Utrecht hat Verspätung.'
    note: '*Let op* (wörtlich „pass auf“) eröffnet eine Bahnhofsansage, ähnlich wie das deutsche „Achtung, liebe Fahrgäste“.'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: 'Verneinung: pünktlich'
    gloss: Der Zug fährt nicht pünktlich ab.
    note: '*Niet* steht direkt vor *op tijd* und verneint den ganzen Ausdruck.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: Eine Gleisänderung
    gloss: Der Zug fährt von Gleis drei statt von Gleis fünf ab.
    note: '*In plaats van* bedeutet „anstatt“.'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: Die Dauer der Verspätung nennen
    gloss: Der Zug hat zehn Minuten Verspätung.
    note: '*Heeft vertraging* (wörtlich „hat Verspätung“) ist die natürliche Art zu sagen, dass etwas verspätet ist; daneben gibt es das Adjektiv *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: Eingang, Ausgang, Wartesaal
    gloss: der Eingang; der Ausgang; der Wartesaal
    note: '*De ingang*, *de uitgang* und *de wachtruimte* sind alle de-Wörter.'
    example_gloss:
    - Wo ist der Eingang?
    - Wo ist der Ausgang?
    - Wo ist der Wartesaal?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: Fragen, wo ein Gleis ist
    gloss: Wo ist Bahnsteig sieben?
    note: Das greift das Muster *Waar is...?* aus den Wegbeschreibungs-Lektionen von Lektion 9 wieder auf.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: Den Weg beschreiben
    gloss: Geradeaus und dann rechts.
    note: '*Rechtdoor* und *rechts* sind dieselben Richtungswörter wie in Lektion 9, hier in einem Bahnhofskontext.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: Nach dem Wartesaal fragen
    gloss: Wo ist der Wartesaal?
    note: Dasselbe Fragemuster, auf einen neuen Ort angewendet.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: Eine Fahrkarte lesen
    gloss: 'Fahrkarte: Amsterdam Centraal nach Utrecht Centraal. Abfahrt: zehn nach zehn, Gleis sieben. Ankunft: zehn vor elf. Hin- und Rückfahrt. Preis: zwölf Euro vierzig.'
    note: Achten Sie auf Abfahrtszeit und Gleis, Ankunftszeit, Art der Fahrkarte und Preis.
    glosses:
      Kaartje: die Fahrkarte
      Vertrek: die Abfahrt
      tien: zehn
      perron: das Gleis
      zeven: sieben
      Aankomst: die Ankunft
      elf: elf
      Retour: Hin- und Rückfahrkarte
      Prijs: der Preis
      twaalf: zwölf
      euro: Euro
      veertig: vierzig
  nl.a1.unit15.lesson06.teach.omar_open:
    title: Omar nennt den Plan
    gloss: 'Omar: Wir müssen zu Gleis sieben. Der Zug fährt um zehn nach zehn ab.'
    note: '*Moeten* (müssen) drückt hier eine praktische Notwendigkeit aus, keine strenge Verpflichtung.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: Lotte liest die Anzeige
    gloss: 'Lotte: Schau, da steht die Anzeige: Verspätung, zehn Minuten.'
    note: '*Daar staat* (wörtlich „dort steht“) ist die natürliche Art zu sagen, dass auf einer Tafel etwas angezeigt wird.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: Omar bleibt gelassen
    gloss: 'Omar: Kein Problem, wir haben noch Zeit für einen Kaffee.'
    note: '*Geen probleem* ist eine übliche, lockere Beruhigung.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: Der Zug kommt an
    gloss: 'Lotte: Gute Idee. Oh, da ist der Zug schon. Gleis sieben, genau!'
    note: '*Al* (schon) zeigt an, dass der Zug trotz der gerade angesagten Verspätung früher da ist als erwartet.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: Sie steigen in den Zug
    gloss: 'Omar: Komm, wir steigen ein. Utrecht, wir kommen!'
    note: '*Stappen in* (einsteigen) ist ein trennbares Verb; *in* rückt ans Ende des Satzes. *We komen eraan* (wörtlich etwa „wir kommen daran“) ist die natürliche niederländische Art, „wir kommen!“ zu sagen; eine Wort-für-Wort-Übersetzung würde fremd klingen.'
