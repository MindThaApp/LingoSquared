course:
  title: Niederländisch A1
  description: 'Niederländisch für Anfänger: eine einfache Zugreise bewältigen, also eine Fahrkarte kaufen, Abfahrts- und Verspätungsansagen verstehen und am Bahnhof nach dem Weg fragen.'
