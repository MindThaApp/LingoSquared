course:
  title: Niederländisch A2
  description: 'Niederländisch für Fortgeschrittene Anfänger: Die Geschichte von Lotte und Omar geht weiter, jetzt mit einem grammatikorientierten Block über das Sprechen in der Vergangenheit.'
unit:
  content_key: nl.a2.unit82.hoe_het_vroeger_was
  title: How things used to be
  description: Describe repeated past habits with the regular Dutch imperfectum and contrast earlier life with the present.
teaching:
  nl.a2.unit82.lesson01.teach.tijdwoorden:
    title: Früher und jetzt
    gloss: früher, damals, jetzt, heutzutage
    note: Verwenden Sie *vroeger* für einen längeren früheren Zeitraum und *toen* für einen bestimmten Zeitpunkt.
    example_gloss:
    - Ich habe früher in Utrecht gewohnt.
    - Damals war ich jung.
    - Jetzt wohne ich in einer Wohnung.
    - Heutzutage fahre ich mit dem Fahrrad zur Arbeit.
  nl.a2.unit82.lesson01.teach.huisvesting:
    title: Wohnen und Größe
    gloss: das Haus, die Wohnung, klein, groß
    note: '*Flat* bedeutet Wohnung, besonders eine in einem Mehrfamilienhaus.'
    example_gloss:
    - Das Haus ist klein.
    - Die Wohnung ist groß.
  nl.a2.unit82.lesson01.teach.gn_vorm:
    title: Das regelmäßige Imperfektum
    gloss: wonen → woonde; werken → werkte
    note: Die regelmäßigen Singularformen der Vergangenheit bestehen aus dem Stamm plus *-te* oder *-de*.
  nl.a2.unit82.lesson01.teach.contrast:
    title: Ein Gegensatz von früher und jetzt
    gloss: Früher habe ich in einem kleinen Haus gewohnt; jetzt wohne ich in einer Wohnung.
    note: Der Teil in der Vergangenheit hat *woonde*, der Teil in der Gegenwart *woon*.
  nl.a2.unit82.lesson02.teach.werkwoorden:
    title: Verben des Alltags
    gloss: Rad fahren, machen, spielen, lernen, wohnen, arbeiten
    note: Mit diesen regelmäßigen Verben können Sie beide Imperfektum-Endungen üben.
    example_gloss:
    - Ich fahre mit dem Fahrrad zur Schule.
    - Ich mache Hausaufgaben.
    - Die Kinder spielen draußen.
    - Wir lernen Niederländisch.
    - Wir wohnen in Utrecht.
    - Ich arbeite im Krankenhaus.
  nl.a2.unit82.lesson02.teach.schoolwoorden:
    title: Orte für Schule und Arbeit
    gloss: Schule, Hausaufgaben, draußen, das Krankenhaus
    note: Nützliche Wörter, um einen früheren Alltag zu beschreiben.
    example_gloss:
    - Ich fahre mit dem Fahrrad zur Schule.
    - Nach der Schule mache ich Hausaufgaben.
    - Wir spielen draußen.
    - Lotte arbeitet im Krankenhaus.
  nl.a2.unit82.lesson02.teach.gn_kofschip:
    title: Die 't-kofschip-Regel
    gloss: Stamm endet auf t, k, f, s, ch oder p → -te; sonst → -de
    note: 'Achten Sie auf den letzten Laut des Stamms: *werk-te*, *fiets-te*, aber *woon-de* und *leer-de*.'
  nl.a2.unit82.lesson02.teach.vormen:
    title: Sechs Singularformen
    gloss: Ich arbeitete, fuhr Rad, machte, spielte, lernte, wohnte.
    note: Dieselbe Singularform wird mit *ik*, *jij* und *hij/zij* verwendet.
  nl.a2.unit82.lesson02.teach.elke_dag:
    title: Jeden Tag
    gloss: Jeden Tag fuhr ich mit dem Fahrrad zur Schule.
    note: '*Elke* steht bei de-Wörtern: *elke dag*.'
  nl.a2.unit82.lesson03.teach.gewoonte:
    title: Zeitangaben für Gewohnheiten
    gloss: immer, jeden Tag, jeden Sommer, oft
    note: Diese Ausdrücke machen eine wiederholte Gewohnheit in der Vergangenheit deutlich.
    example_gloss:
    - Ich fuhr immer mit dem Fahrrad zur Schule.
    - Jeden Tag machte ich Hausaufgaben.
    - Jeden Sommer übernachteten wir bei Opa und Oma.
    - Wir spielten oft draußen.
  nl.a2.unit82.lesson03.teach.familie:
    title: Familie und Nachbarschaft
    gloss: Opa und Oma; die Nachbarschaft
    note: '*Bij opa en oma* bedeutet bei Opa und Oma.'
    example_gloss:
    - Opa und Oma wohnten in Utrecht.
    - Die Gegend war ruhig.
  nl.a2.unit82.lesson03.teach.logeren:
    title: Als Gast übernachten
    gloss: übernachten / zu Besuch bleiben
    note: '*Logeren bij* verwendet man, wenn man bei jemandem zu Hause übernachtet.'
    example_gloss: Wir übernachten bei Opa und Oma.
  nl.a2.unit82.lesson03.teach.gn_number:
    title: Singular und Plural
    gloss: ich wohnte; wir wohnten
    note: 'Die regelmäßigen Pluralformen erhalten ein *-n* an die Singularform des Imperfekts: *werkte → werkten*, *woonde → woonden*.'
  nl.a2.unit82.lesson03.teach.chunks:
    title: Vier nützliche unregelmäßige Formen
    gloss: ich war; ich hatte; ich ging; ich kam
    note: Betrachten Sie *was*, *had*, *ging* und *kwam* hier als feste Vokabeln, ebenso *stond* und *deed*, die im Lesetext und im Dialog vorkommen. Das System dahinter folgt später.
  nl.a2.unit82.lesson03.teach.plural:
    title: Eine Gewohnheit im Plural in der Vergangenheit
    gloss: Wir wohnten in einer ruhigen Gegend und spielten oft draußen.
    note: 'Beide Verben im Plural enden auf *-en*: *woonden*, *speelden*.'
  nl.a2.unit82.lesson04.teach.plaats:
    title: Orte und Entfernung
    gloss: nahe bei, weit weg von, das Geschäft, der Spielplatz
    note: Verwenden Sie *dicht bij* und *ver van* vor einem Ort.
    example_gloss:
    - Die Schule ist nahe bei meinem Haus.
    - Das Krankenhaus ist weit weg von meinem Haus.
    - Das Geschäft ist in der Nachbarschaft.
    - Die Kinder spielen auf dem Spielplatz.
  nl.a2.unit82.lesson04.teach.gn_habit:
    title: Warum hier das Imperfektum?
    gloss: Früher fuhr ich jeden Tag mit dem Fahrrad zur Schule.
    note: In dieser Einheit wird das Imperfektum für wiederholte Gewohnheiten und Zustände in der Vergangenheit verwendet; es wird nicht mit dem Perfekt verglichen.
  nl.a2.unit82.lesson04.teach.buurtzin:
    title: Die alte Nachbarschaft
    gloss: Früher wohnte ich nahe bei der Schule und spielte immer auf dem Spielplatz.
    note: 'Nach *en* steht das gemeinsame Subjekt hinter dem zweiten Verb in der Vergangenheit: *en speelde ik*.'
  nl.a2.unit82.lesson04.teach.nuzin:
    title: Die Situation jetzt
    gloss: Jetzt wohne ich weit weg von der Schule und arbeite im Krankenhaus.
    note: Beide Verben stehen im Präsens, weil *nu* den aktuellen Zeitrahmen festlegt.
  nl.a2.unit82.lesson05.teach.jeugd:
    title: Kindheit
    gloss: Kindheit; nach der Schule
    note: '*Jeugd* ist die Zeit, in der man jung ist.'
    example_gloss:
    - Meine Kindheit war schön.
    - Nach der Schule machte ich Hausaufgaben.
  nl.a2.unit82.lesson05.teach.reading:
    title: 'Lesetext: Lottes Kindheit'
    gloss: Als Lotte klein war, wohnte sie mit ihren Eltern in Utrecht. Ihr Haus war klein und stand nahe bei ihrer Schule. Jeden Tag fuhr sie mit dem Fahrrad zur Schule. Nach der Schule spielte sie draußen und machte Hausaufgaben. Jeden Sommer übernachteten Lotte und ihre Eltern bei Opa und Oma. Heutzutage wohnt Lotte in einer Wohnung und arbeitet als Krankenschwester im Krankenhaus.
    note: Finden Sie die wiederholten Gewohnheiten, die durch *elke dag* und *elke zomer* markiert sind, und dann den Gegensatz zur Gegenwart, der durch *tegenwoordig* markiert ist.
  nl.a2.unit82.lesson06.teach.omar01:
    title: Omar fragt nach Utrecht
    gloss: 'Omar: Hast du früher auch in Utrecht gewohnt?'
  nl.a2.unit82.lesson06.teach.lotte01:
    title: Lotte beschreibt ihr altes Zuhause
    gloss: 'Lotte: Ja, ich habe mit meinen Eltern in einem kleinen Haus gewohnt.'
  nl.a2.unit82.lesson06.teach.omar02:
    title: Omar fragt nach dem Alltag
    gloss: 'Omar: Was hast du nach der Schule gemacht?'
  nl.a2.unit82.lesson06.teach.lotte02:
    title: Lotte nennt drei Gewohnheiten
    gloss: 'Lotte: Ich bin mit dem Fahrrad nach Hause gefahren, habe draußen gespielt und danach Hausaufgaben gemacht.'
  nl.a2.unit82.lesson06.teach.lotte03:
    title: Lotte stellt die Gegenwart gegenüber
    gloss: 'Lotte: Jetzt wohne ich in einer Wohnung und arbeite im Krankenhaus.'
  nl.a2.unit82.lesson06.teach.gn_recap:
    title: Früher und jetzt
    gloss: vroeger + Imperfectum; nu + Präsens
    note: Verwenden Sie das Imperfectum für die wiederholte frühere Situation und das Präsens für den Gegensatz in der Gegenwart.
