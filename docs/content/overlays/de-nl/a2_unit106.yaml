course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2 zum Schreiben an Freunde.
  learning_goal: 'Eine kurze, lockere Nachricht an einen Freund schreiben: was passiert ist, was als Nächstes ansteht und warum.'
units:
  nl.a2.unit106.een_bericht_aan_een_vriend:
    title: Eine Nachricht an einen Freund
    description: Lockere Nachrichten lesen und schreiben, mit Anrede, Ereignissen, Plänen, Gründen und Briefschluss.
lessons:
  nl.a2.unit106.lesson01.hoi_lotte_groetjes:
    title: Hallo Lotte, viele Grüße
  nl.a2.unit106.lesson02.wat_is_er_gebeurd:
    title: Was ist passiert?
  nl.a2.unit106.lesson03.wat_gaan_we_doen:
    title: Was haben wir vor?
  nl.a2.unit106.lesson04.omdat_want_dus:
    title: Weil, denn, also
  nl.a2.unit106.lesson05.berichten_lezen:
    title: Nachrichten lesen
  nl.a2.unit106.lesson06.een_bericht_schrijven:
    title: Eine Nachricht schreiben
teaching:
  nl.a2.unit106.lesson01.teach.groeten:
    title: Eine Nachricht beginnen
    gloss: Hallo Lotte / Hey Omar / Hallo Noor
    note: Beginnen Sie eine Nachricht an einen Freund mit Hoi oder Hé, gefolgt vom Namen und einem Komma.
    example_gloss:
    - Hallo Lotte, wie geht es dir?
    - Hey Omar, danke für deine Nachricht!
  nl.a2.unit106.lesson01.teach.afsluiten:
    title: Eine Nachricht beenden
    gloss: Viele Grüße (locker) / Alles Liebe / Bis bald
    note: Beenden Sie die Nachricht mit einer dieser Formeln, dann folgen ein Komma und Ihr Name. Liefs ist herzlich und wird für enge Freunde verwendet.
    example_gloss:
    - Viele Grüße, Omar
    - Alles Liebe, Lotte
    - Bis bald, Noor
  nl.a2.unit106.lesson01.teach.bericht:
    title: An einen Freund schreiben
    gloss: die Nachricht / der Freund / die Freundin / schreiben
    note: Vriend ist ein männlicher Freund, vriendin eine weibliche Freundin.
    example_gloss:
    - Ich schreibe meiner Freundin eine Nachricht.
    - Lotte ist eine Freundin von Omar.
    - Omar ist ein Freund von Noor.
  nl.a2.unit106.lesson01.teach.gebeurtenissen:
    title: Worüber man schreiben kann
    gloss: das Wochenende / die Party / der Film / das Kino / der Zoo / der Park / der Abend
    note: Das sind typische Themen für eine Nachricht über Ihr Wochenende.
    example_gloss:
    - Das Wochenende war schön.
    - Die Party war lustig.
    - Ich sehe mir im Kino einen Film an.
  nl.a2.unit106.lesson01.teach.bijvoeglijk:
    title: Wie war's? Wie geht's?
    gloss: schön, nett / gemütlich, lustig / müde / krank / beschäftigt
    note: Gezellig beschreibt eine schöne, freundliche Atmosphäre, zum Beispiel auf einer Feier.
    example_gloss:
    - Der Film war schön.
    - Ich bin müde.
    - Omar ist krank.
    - Lotte hat viel zu tun.
  nl.a2.unit106.lesson01.teach.tijd:
    title: Wann?
    gloss: gestern / letzte Woche / morgen / nächste Woche / vielleicht / Samstag
    note: Zeitwörter sagen Ihrer Freundin oder Ihrem Freund, wann etwas geschehen ist oder geschehen wird. Misschien bedeutet „vielleicht“.
    example_gloss:
    - Gestern war die Feier.
    - Morgen ist Wochenende.
    - Vielleicht ist der Film schön.
  nl.a2.unit106.lesson01.teach.gn_opbouw:
    title: Aufbau einer Nachricht an einen Freund
    gloss: Hallo Lotte, wie geht es dir? Ich schreibe dir eine Nachricht. Viele Grüße, Omar
    note: 'Eine freundschaftliche Nachricht hat vier Teile: eine Anrede (Hoi oder Hé plus Name), was passiert ist, was als Nächstes kommt, und einen Gruß am Schluss (Groetjes, Liefs oder Tot snel plus Ihr Name). Einen Grund können Sie bei Bedarf mit omdat oder want ergänzen.'
  nl.a2.unit106.lesson01.teach.gn_je:
    title: Je für einen Freund
    gloss: Wie geht es dir? Danke für deine Nachricht!
    note: 'An einen Freund schreiben Sie je (oder jij), nie u. Je ist auch das Wort für „dein/deine“: je bericht.'
  nl.a2.unit106.lesson01.teach.zin:
    title: Eine kurze Nachricht
    gloss: Hallo Lotte, danke für deine Nachricht! Bis bald, Omar
  nl.a2.unit106.lesson02.teach.voltooid_ww:
    title: Verben und ihre Partizipien
    gloss: sehen – gesehen / kaufen – gekauft / anrufen – angerufen / wandern – gewandert / tanzen – getanzt / essen – gegessen / gehen – gegangen / sein – gewesen
    note: Die zweite Form jedes Paares ist das Partizip, das im Perfekt verwendet wird.
    example_gloss:
    - Ich habe einen Film gesehen.
    - Wir haben getanzt.
    - Ich war im Park.
  nl.a2.unit106.lesson02.teach.gn_hebben:
    title: Perfekt mit hebben
    gloss: Ich habe gestern einen Film gesehen. Wir haben auf der Feier getanzt. Ich habe Noor angerufen.
    note: Um zu sagen, was passiert ist, verwenden Sie heb oder hebben plus Partizip. In einem einfachen Hauptsatz steht das Partizip ganz am Ende. Das ist im Deutschen ähnlich, doch das Niederländische benutzt diese Form im Gespräch meist auch dort, wo das Deutsche gern das Präteritum verwendet, etwa bei „ich sah“ oder „ich rief an“.
  nl.a2.unit106.lesson02.teach.gn_zijn:
    title: Perfekt mit zijn
    gloss: Ich bin in den Park gegangen. Ich war auf der Feier. Wir sind ins Kino gegangen.
    note: 'Die Verben gaan und zijn bilden das Perfekt mit zijn, nicht mit hebben: ik ben gegaan, ik ben geweest. Komen funktioniert genauso (ik ben gekomen). Die meisten anderen Verben verwenden hebben. Lernen Sie das Hilfsverb gemeinsam mit dem Partizip.'
  nl.a2.unit106.lesson02.teach.gn_was_had:
    title: Beschreiben mit was und had
    gloss: Die Feier war gemütlich. Der Film war schön. Ich hatte einen schönen Abend.
    note: 'Um zu sagen, wie etwas war, verwenden Sie das Imperfekt bekannter Verben: was und had. Nutzen Sie das Perfekt für die Ereignisse selbst und was oder had für die Beschreibung. Zwei oder drei solche Details machen Ihre Nachricht lebendig.'
  nl.a2.unit106.lesson02.teach.zinnen:
    title: Was passiert ist
    gloss: Gestern habe ich einen Film gesehen. Er war schön. Ich bin zur Feier gegangen.
  nl.a2.unit106.lesson03.teach.plan_ww:
    title: Wörter für Pläne
    gloss: besuchen / kochen / schauen / der Onkel / der Plan
    note: Oom ist ein Onkel. Plan ist ein Plan; van plan zijn bedeutet „vorhaben“.
    example_gloss:
    - Ich besuche meinen Onkel in Amsterdam.
    - Omar kocht für Lotte.
    - Wir schauen einen Film.
  nl.a2.unit106.lesson03.teach.gn_gaan:
    title: Pläne mit gaan
    gloss: Ich werde meinen Onkel besuchen. Omar wird morgen kochen. Wir werden einen Film schauen.
    note: Verwenden Sie gaan plus Infinitiv für einen Plan oder für das, was Sie tun werden. Der Infinitiv steht am Ende des Satzes.
  nl.a2.unit106.lesson03.teach.gn_voorop:
    title: Zeitwort am Satzanfang
    gloss: Morgen werde ich kochen. Nächste Woche werden wir meinen Onkel besuchen. Vielleicht gehe ich ins Kino.
    note: 'Steht ein Zeitwort wie morgen oder volgende week oder misschien am Satzanfang, folgt als Nächstes das Verb und danach das Subjekt: Morgen ga ik koken. Der Infinitiv bleibt am Ende. Das ist wie im Deutschen.'
  nl.a2.unit106.lesson03.teach.gn_plan:
    title: Van plan zijn om ... te
    gloss: Ich habe vor, in den Zoo zu gehen. Ich habe vor, meinen Onkel zu besuchen.
    note: 'Ik ben van plan om ... te + Infinitiv sagt, was Sie vorhaben. Der Infinitiv mit te steht am Ende: om mijn oom te bezoeken. Das klingt etwas überlegter als gaan.'
  nl.a2.unit106.lesson03.teach.gn_zullen:
    title: Zullen für ein Versprechen
    gloss: Ich rufe dich morgen an. Wir rufen dich an.
    note: 'Ik zal und wij zullen plus Infinitiv drücken ein Versprechen oder ein Angebot aus: Ik zal je bellen. Verwenden Sie gaan für einen Plan und zullen, wenn Sie Ihrem Freund etwas versprechen.'
  nl.a2.unit106.lesson03.teach.zinnen:
    title: Was als Nächstes kommt
    gloss: Nächste Woche werde ich meinen Onkel in Amsterdam besuchen. Ich rufe dich an.
  nl.a2.unit106.lesson04.teach.redenwoorden:
    title: Wörter für Gründe
    gloss: weil / denn / also / die Zeit / kein / nicht / kommen / bleiben
    note: Omdat und want bedeuten beide „weil“ bzw. „denn“, dus bedeutet „also“. Sie unterscheiden sich in der Wortstellung, siehe die nächsten Hinweise.
    example_gloss:
    - Ich habe keine Zeit.
    - Ich bleibe zu Hause.
    - Ich komme nicht.
  nl.a2.unit106.lesson04.teach.gn_omdat:
    title: 'Omdat: Das Verb steht am Ende'
    gloss: Ich bleibe zu Hause, weil ich krank bin. Weil ich müde bin, gehe ich nach Hause.
    note: 'Nach omdat steht das Verb am Ende des Nebensatzes: omdat ik ziek ben. Das ist wie im Deutschen. Steht der omdat-Satz am Anfang, beginnt der folgende Hauptsatz direkt nach dem Komma mit dem Verb: Omdat ik moe ben, ga ik naar huis.'
  nl.a2.unit106.lesson04.teach.gn_want:
    title: 'Want: normale Wortstellung'
    gloss: Ich bleibe zu Hause, denn ich bin krank. Ich komme nicht, denn ich habe keine Zeit.
    note: 'Nach want bleibt die Wortstellung normal: want ik ben ziek. Want verbindet nur zwei Hauptsätze und steht deshalb nie am Satzanfang.'
  nl.a2.unit106.lesson04.teach.gn_dus:
    title: 'Dus: das Ergebnis'
    gloss: Ich bin krank, also bleibe ich zu Hause. Es ist voll, also komme ich nicht.
    note: 'Dus leitet das Ergebnis ein. Es ist eine Konjunktion und ändert daher die Wortstellung des Satzes, den es anschließt, nicht: Ik ben ziek, dus ik blijf thuis. Auch die Inversion ist sehr häufig und korrekt: Ik ben ziek, dus blijf ik thuis. Omdat nennt den Grund; dus nennt das Ergebnis.'
  nl.a2.unit106.lesson04.teach.gn_verleden:
    title: Gründe in der Vergangenheit
    gloss: Ich war krank, also bin ich nicht zur Feier gegangen. Ich bin nicht gekommen, weil ich müde war.
    note: Gründe für vergangene Ereignisse nennen Sie auf dieselbe Weise. Den Grund beschreiben Sie mit was oder had (Ik was ziek) und das Ereignis mit dem Perfekt (ik ben niet gekomen).
  nl.a2.unit106.lesson05.teach.leeswoorden:
    title: Wörter zum Lesen
    gloss: die Eintrittskarte / schon / sehr / viel / auch / aber / das / er / wohnen
    note: Diese Wörter kommen in den beiden Nachrichten unten vor.
    example_gloss:
    - Ich habe viel getanzt.
    - Die Feier war sehr gemütlich.
    - Mein Onkel wohnt in Amsterdam.
    - Er ist auch im Park.
    - Ich komme, aber das ist kein Problem.
  nl.a2.unit106.lesson05.teach.gn_voltooid_verleden:
    title: Had plus Partizip (zum Lesen)
    gloss: Ich hatte schon eine Karte gekauft. Lotte hatte Omar schon angerufen.
    note: Had oder hadden plus Partizip verweist auf etwas, das vor einem anderen vergangenen Zeitpunkt geschehen ist (Plusquamperfekt). Sie müssen es nur beim Lesen erkennen. In Ihren eigenen Nachrichten genügt das Perfekt.
  nl.a2.unit106.lesson05.teach.lees_noor:
    title: Noors Nachricht an Lotte
    gloss: Hallo Lotte, danke für deine Nachricht! Gestern bin ich zur Feier gegangen. Es war sehr gemütlich und ich habe viel getanzt. Morgen gehe ich in den Zoo, denn ich habe Zeit. Vielleicht gehe ich nächste Woche ins Kino. Bis bald, Noor
  nl.a2.unit106.lesson05.teach.lees_omar:
    title: Omars Nachricht an Lotte
    gloss: Hey Lotte, wie geht es dir? Ich war gestern krank, also bin ich nicht ins Kino gegangen. Ich hatte schon eine Karte gekauft, aber das war nicht schlimm. Nächste Woche werde ich meinen Onkel besuchen. Er wohnt in Amsterdam. Ich rufe dich morgen an. Viele Grüße, Omar
  nl.a2.unit106.lesson06.teach.lotte_vraag:
    title: Lotte spricht
    gloss: 'Lotte: Hallo Omar, wie war dein Wochenende?'
  nl.a2.unit106.lesson06.teach.omar_feestje:
    title: Omar spricht
    gloss: 'Omar: Schön! Am Samstag bin ich zur Feier gegangen und habe viel getanzt.'
  nl.a2.unit106.lesson06.teach.lotte_plan:
    title: Lotte spricht
    gloss: 'Lotte: Wie schön! Und was wirst du nächste Woche machen?'
  nl.a2.unit106.lesson06.teach.omar_oom:
    title: Omar spricht
    gloss: 'Omar: Ich werde meinen Onkel in Amsterdam besuchen, weil ich Zeit habe.'
  nl.a2.unit106.lesson06.teach.lotte_bellen:
    title: Lotte spricht
    gloss: 'Lotte: Gemütlich! Ich rufe dich an. Bis bald!'
