teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: Markt, Geschäft, Marktstand
    gloss: der Markt, das Geschäft, der Marktstand
    note: '*De markt* kann ein Markt allgemein oder ein regelmäßiger Wochenmarkt im Freien sein. *De winkel* ist ein Geschäft oder Laden. Eine *kraam* ist ein Stand auf einem Markt im Freien.'
    example_gloss:
    - Ich gehe auf den Markt.
    - Ich gehe ins Geschäft.
    - Der Stand verkauft Äpfel.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: Äpfel, Birnen, Tomaten, Paprika
    gloss: Äpfel, Birnen, Tomaten, Paprika
    note: Der Singular ist *appel*; der Plural ist *appels*. Der Singular ist *peer*; der Plural ist *peren*. Der Singular ist *tomaat*; der Plural ist *tomaten*. *Paprika* bedeutet auf Niederländisch eine Gemüsepaprika; der geschriebene Plural ist *paprika's*.
    example_gloss:
    - Ich hätte gern Äpfel.
    - Ich hätte gern Birnen.
    - Ich hätte gern Tomaten.
    - Ich hätte gern Paprika.
  nl.a1.unit07.lesson02.teach.kilo:
    title: Ein Kilo
    gloss: ein Kilo
    note: '*Een kilo* ist ein Kilogramm.'
    example_gloss: Ich möchte ein Kilo Äpfel.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: pro Kilo
    note: Auf Märkten wird der Preis oft pro Kilo angegeben.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: Wie viel kostet ein Kilo Äpfel?
    gloss: Was kostet ein Kilo Äpfel?
    note: '*Hoeveel kost ...?* fragt nach dem Preis. Hier ist das, was etwas kostet, *een kilo*, also steht *kost* im Singular.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: Ein Kilo Äpfel kostet €2,50
    gloss: Ein Kilo Äpfel kostet €2,50.
    note: 'Niederländische Preise werden mit Dezimalkomma geschrieben, wie im Deutschen: €2,50.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: Zwei Euro fünfzig
    gloss: 2,50 € – zwei Euro fünfzig
    note: €2,50 sagt man üblicherweise *twee euro vijftig*, ohne *en* und ohne *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: Gramm, ein Pfund, ein Stück, zwei Stück
    gloss: hundert Gramm, ein Pfund = 500 Gramm, ein Stück, zwei Stück
    note: Nach einer Zahl verwendet man hier *gram*, nicht *grammen*. Im niederländischen Alltag bedeutet *een pond* 500 Gramm – ein älterer, umgangssprachlicher Begriff, keine offizielle metrische Einheit (wie im Deutschen das Pfund). *Per stuk* bedeutet, dass jedes Stück seinen eigenen Preis hat; bei Zahlen über eins verwendet man *stuks*, wenn man allein eine Anzahl nennt, wie in *twee stuks*.
    example_gloss:
    - Ich möchte 100 Gramm Käse.
    - Ein Pfund Äpfel, bitte.
    - Kann ich bitte eins haben?
    - Ich hätte gern zwei, bitte.
  nl.a1.unit07.lesson03.teach.how_much:
    title: Wie viel möchten Sie?
    gloss: Wie viel möchten Sie?
    note: Der Verkäufer verwendet das höfliche *u*. *Hoeveel* kann sich auf ein Gewicht oder auf eine Anzahl beziehen.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: Ein Pfund Tomaten, bitte
    gloss: Ein Pfund (500 g) Tomaten, bitte.
    note: Das ist eine vollständige, natürliche kurze Antwort, wenn ein Verkäufer *Hoeveel wilt u?* fragt.
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: Preisschild
    gloss: das Preisschild
    note: '*Prijskaartje* wird in einem Wort geschrieben. Lernen Sie hier das ganze Wort.'
    example_gloss: Auf dem Preisschild steht €2,50.
  nl.a1.unit07.lesson04.teach.market_labels:
    title: Preisschilder auf dem Markt
    gloss: 'Äpfel: €2,50 pro Kilo. Birnen: €3,00 pro Kilo. Tomaten: €2,00 pro Kilo. Paprika: €1,00 pro Stück.'
    note: Lesen Sie *per kilo* als „pro Kilo“ und *per stuk* als „pro Stück“. Niederländische Preisschilder verwenden im Preis ein Komma.
    glosses:
      Appels: Äpfel
      kilo: das Kilogramm
      Peren: Birnen
      Tomaten: Tomaten
      stuk: Stück
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: Was darf es sein?
    gloss: Was möchten Sie?
    note: '*Wat mag het zijn?* ist eine gängige, freundliche Frage eines Marktverkäufers oder Ladenmitarbeiters.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: Dann nehme ich ein Kilo Birnen
    gloss: Dann nehme ich ein Kilo Birnen, bitte.
    note: '*Dan neem ik ...* ist eine natürliche Art, sich nach Nennung des Preises für einen Kauf zu entscheiden.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: Sonst noch etwas?
    gloss: Sonst noch etwas?
    note: Eine übliche kurze Anschlussfrage von Verkäufern.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: Nein, danke
    gloss: Nein, danke.
    note: '*Dank u* passt zur höflichen *u*-Anrede gegenüber dem Verkäufer.'
  nl.a1.unit07.lesson05.teach.total:
    title: Das macht €3,00
    gloss: Das macht dann €3,00 – drei Euro.
    note: '*Dat is dan ...* ist eine gängige Art des Verkäufers, die Gesamtsumme zu nennen. Der geschriebene Preis €3,00 wird als *drie euro* gesprochen.'
  nl.a1.unit07.lesson05.teach.pin:
    title: Kann ich mit Karte bezahlen?
    gloss: Kann ich mit Karte bezahlen?
    note: '*Pinnen* ist das alltägliche niederländische Verb für das Bezahlen mit Debit- oder Kreditkarte am Terminal.'
  nl.a1.unit07.lesson06.teach.opening:
    title: Begrüßung und Frage nach dem Preis
    gloss: 'Verkäufer: Guten Tag. Was darf es sein? Lotte: Guten Tag. Was kostet ein Kilo Äpfel?'
    note: Das ist ein freundliches, höfliches Gespräch zwischen einer Kundin und einem Verkäufer.
  nl.a1.unit07.lesson06.teach.purchase:
    title: Die Menge wählen
    gloss: 'Verkäufer: Zwei Euro fünfzig pro Kilo. Lotte: Dann nehme ich ein Kilo, bitte.'
    note: Nachdem im vorigen Redebeitrag klar ist, dass es um Äpfel geht, kann Lotte ganz natürlich einfach *een kilo* sagen.
  nl.a1.unit07.lesson06.teach.payment:
    title: Mit Karte bezahlen
    gloss: 'Verkäufer: Das macht dann zwei Euro fünfzig. Lotte: Kann ich mit Karte zahlen? Verkäufer: Ja, natürlich.'
    note: '*Kan ik pinnen?* ist die normale praktische Frage beim Bezahlen.'
  nl.a1.unit07.lesson06.teach.closing:
    title: Das Gespräch beenden
    gloss: 'Lotte: Danke. Auf Wiedersehen! Verkäufer: Auf Wiedersehen!'
    note: '*Tot ziens* eignet sich als Abschluss dieses höflichen Verkaufsgesprächs.'
