teaching:
  nl.a2.unit27.lesson01.teach.huisarts:
    title: Hausarzt
    gloss: der Hausarzt / die Hausärztin
    note: 'Ein Substantiv mit de-Geschlecht: de huisarts, bereits aus den Gesundheitslektionen von Einheit 16 bekannt.'
    example_gloss: Ich möchte gern einen Termin beim Hausarzt vereinbaren.
  nl.a2.unit27.lesson01.teach.afspraak_huisarts:
    title: Einen Termin erbitten
    gloss: Ich möchte gern einen Termin beim Hausarzt vereinbaren.
    note: Greift das Muster afspraak maken aus dem Gemeindebesuch in Einheit 24 wieder auf, hier mit bij de huisarts.
  nl.a2.unit27.lesson01.teach.reden_bezoek:
    title: Die Sprechstundenhilfe fragt nach dem Grund
    gloss: Was ist der Grund Ihres Besuchs?
    note: Eine übliche höfliche Frage bei der Terminvereinbarung in der Arztpraxis.
  nl.a2.unit27.lesson01.teach.paar_dagen_niet_lekker:
    title: Sagen, wie lange man sich schon unwohl fühlt
    gloss: Ich fühle mich schon seit ein paar Tagen nicht wohl.
    note: Al een paar dagen (schon seit ein paar Tagen) erweitert das voel me niet lekker aus Einheit 16 um eine Zeitangabe.
  nl.a2.unit27.lesson02.teach.klachten:
    title: Beschwerden
    gloss: die Beschwerden
    note: 'Ein Plural-Substantiv mit de: de klachten, der übliche medizinische Begriff für Beschwerden.'
    example_gloss: Welche Beschwerden haben Sie?
  nl.a2.unit27.lesson02.teach.wat_zijn_klachten:
    title: Der Arzt fragt nach den Beschwerden
    gloss: Welche Beschwerden haben Sie?
    note: Die höfliche Eröffnungsfrage einer Sprechstunde.
  nl.a2.unit27.lesson02.teach.drie_dagen_klachten:
    title: Beschwerden mit Dauer beschreiben
    gloss: Ich habe seit drei Tagen Kopfschmerzen und Fieber.
    note: Al drie dagen (seit drei Tagen) steht mit dem Präsens heb, um anhaltende Beschwerden zu beschreiben – dieselbe Konstruktion wie sinds vorige maand in Einheit 24. Das Deutsche verwendet hier ebenfalls das Präsens.
  nl.a2.unit27.lesson02.teach.hoe_erg_pijn:
    title: Nach der Stärke fragen
    gloss: Wie stark ist der Schmerz?
    note: Hoe erg (wie schlimm) fragt nach der Stärke – eine natürliche Anschlussfrage.
  nl.a2.unit27.lesson03.teach.griepje:
    title: Leichte Grippe
    gloss: eine leichte Grippe / ein grippaler Infekt
    note: 'Ein Substantiv mit het: het griepje, die Verkleinerungsform von griep (Grippe). Die Verkleinerung macht daraus etwas Harmloses, keine schwere Krankheit.'
    example_gloss: Sie haben wahrscheinlich eine leichte Grippe.
  nl.a2.unit27.lesson03.teach.waarschijnlijk_griepje:
    title: Eine vermutete Diagnose stellen
    gloss: Sie haben wahrscheinlich eine leichte Grippe.
    note: Waarschijnlijk (wahrscheinlich) schwächt die Diagnose passend ab, wenn der Arzt noch vor weiteren Untersuchungen spricht.
  nl.a2.unit27.lesson03.teach.niet_ernstig:
    title: Über den Schweregrad beruhigen
    gloss: Es ist nicht ernst.
    note: Ernstig (ernst, schwerwiegend) ist das wichtigste Adjektiv, um den Schweregrad einer Erkrankung zu beschreiben.
  nl.a2.unit27.lesson03.teach.geen_zorgen_formeel:
    title: Höfliche Beruhigung
    gloss: Mach dir keine Sorgen.
    note: Das förmliche Gegenstück zum informellen maak je geen zorgen aus Einheit 21, mit u/zich statt je.
  nl.a2.unit27.lesson04.teach.recept:
    title: Rezept
    gloss: das Rezept
    note: 'Ein Substantiv mit het: het recept.'
    example_gloss: Ich verschreibe Ihnen etwas.
  nl.a2.unit27.lesson04.teach.schrijf_voor:
    title: Der Arzt verschreibt etwas
    gloss: Ich verschreibe Ihnen etwas.
    note: Voorschrijven (verschreiben) ist ein trennbares Verb; voor rückt ans Ende des Satzes. Das kennen Sie aus dem Deutschen, etwa bei „vorschreiben“ oder „einnehmen“.
  nl.a2.unit27.lesson04.teach.pillen_innemen:
    title: Medikamente einnehmen
    gloss: Nehmen Sie die Tabletten zweimal täglich ein und ruhen Sie sich gut aus.
    note: Innemen (Medizin einnehmen) ist ein trennbares Verb und etwas anderes als nemen allein; in rückt ans Ende des Satzes.
  nl.a2.unit27.lesson04.teach.terugkomen_als:
    title: Eine Anweisung mit Bedingung für die Nachkontrolle
    gloss: Kommen Sie in einer Woche wieder, wenn es nicht besser wird.
    note: Als (wenn) leitet die Bedingung ein; terugkomen (zurückkommen) ist trennbar, mit terug am Ende.
  nl.a2.unit27.lesson04.teach.infinitives_note:
    title: Die Infinitivformen
    gloss: Die Tabletten einnehmen und zurückkommen sind die Infinitive dieser beiden trennbaren Verben.
    note: Innemen und terugkomen sind die Grundformen (Infinitive), anders als die konjugierten Imperativformen (neem ... in, kom ... terug), die sonst in dieser Lektion vorkommen.
  nl.a2.unit27.lesson05.teach.samenvatting:
    title: Eine Besuchszusammenfassung lesen
    gloss: 'Diagnose: leichte Grippe. Rat: Ruhen Sie sich gut aus und trinken Sie viel Wasser. Nehmen Sie die verschriebenen Tabletten zweimal täglich ein. Fühlen Sie sich nach einer Woche immer noch nicht besser? Dann vereinbaren Sie einen neuen Termin.'
    note: Achten Sie auf die Diagnose, die zwei Lebensstil-Ratschläge, die Anweisung zur Medikamenteneinnahme und die Bedingung für den Kontrolltermin.
    glosses:
      Diagnose: Diagnose
      griepje: eine leichte Grippe (Verkleinerungsform von griep, die sie zu etwas Harmlosem abschwächt)
      Advies: Rat
      rust: ruhen (Imperativ; mit 'uit' = sich ausruhen)
      uit: aus (Partikel von 'rust uit' = sich ausruhen)
      drink: trinken (Imperativ von drinken)
      veel: viel, jede Menge
      Neem: nehmen (Imperativ von nemen)
      voorgeschreven: verschrieben (Partizip Perfekt von voorschrijven)
      pillen: Tabletten
      keer: Mal ('twee keer' = zweimal)
      dag: Tag ('per dag' = pro Tag)
      in: ein (trennbarer Verbzusatz von 'innemen' = Medikamente einnehmen)
      Voelt: fühlen ('Voelt u zich' = Fühlen Sie sich)
      zich: sich (Reflexivpronomen)
      na: nach
      nog: immer noch (in 'nog steeds' = immer noch)
      steeds: immer noch (in 'nog steeds' = immer noch)
      beter: besser
      Maak: machen (Imperativ von maken)
      dan: dann
      nieuwe: neu
      afspraak: Termin
  nl.a2.unit27.lesson06.teach.huisarts_ask_symptoms:
    title: Der Arzt eröffnet das Gespräch
    gloss: 'Hausarzt: Guten Morgen, welche Beschwerden haben Sie?'
    note: Greift die Frage wat zijn uw klachten? aus lesson02 wieder auf.
  nl.a2.unit27.lesson06.teach.omar_symptoms:
    title: Omar beschreibt seine Symptome
    gloss: 'Omar: Ich habe seit drei Tagen Kopfschmerzen und Fieber.'
    note: Entspricht genau dem Lehrbeispiel aus lesson02 – das ist Omars eigener Arztbesuch.
  nl.a2.unit27.lesson06.teach.huisarts_react_diagnose:
    title: Der Arzt reagiert und stellt die Diagnose
    gloss: 'Hausarzt: Das klingt unangenehm. Sie haben wahrscheinlich eine leichte Grippe.'
    note: Klinkt (klingt) übernimmt das Muster aus Unit 18, dat klinkt fijn, hier aber mit vervelend (unangenehm) statt fijn.
  nl.a2.unit27.lesson06.teach.omar_ask_serious:
    title: Omar fragt, ob es ernst ist
    gloss: 'Omar: Ist es ernst?'
    note: Eine kurze, direkte Anschlussfrage mit ernstig aus lesson03.
  nl.a2.unit27.lesson06.teach.huisarts_reassure_prescribe:
    title: Der Arzt beruhigt und verschreibt ein Medikament
    gloss: 'Hausarzt: Nein, es ist nicht ernst. Ich schreibe Ihnen ein Rezept aus.'
    note: Verbindet die Beruhigung aus lesson03 mit dem Muster für das Verschreiben aus lesson04.
  nl.a2.unit27.lesson06.teach.omar_thanks_doctor:
    title: Omar bedankt sich beim Arzt
    gloss: 'Omar: Vielen Dank, Doktor.'
    note: Dokter ist eine gebräuchliche, leicht informelle Anrede für den Arzt im direkten Gespräch und unterscheidet sich von huisarts (der Berufsbezeichnung).
  nl.a2.unit27.lesson06.teach.huisarts_final_instructions:
    title: Der Arzt gibt die letzten Anweisungen
    gloss: 'Hausarzt: Nehmen Sie die Tabletten zweimal täglich ein und ruhen Sie sich gut aus. Kommen Sie in einer Woche wieder, wenn es Ihnen nicht besser geht. Machen Sie sich keine Sorgen.'
    note: Verbindet die Anweisung zur Medikamenteneinnahme aus lesson04 mit der höflichen Beruhigung aus lesson03.
  nl.a2.unit27.lesson06.teach.summary_grammar:
    title: Der Besuch in Kurzform
    gloss: Omar hat eine leichte Grippe. Er muss die Tabletten zweimal täglich einnehmen.
    note: Moet + Infinitiv (moet ... innemen) drückt eine Notwendigkeit aus; dabei bleibt das trennbare in am Satzende an innemen gebunden.
