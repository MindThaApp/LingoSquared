course:
  title: Niederländisch A2
  description: 'Niederländisch für Fortgeschrittene auf Anfängerniveau für einen einfachen Arzttermin: Termin vereinbaren, Beschwerden genauer beschreiben und eine Diagnose sowie Behandlungsanweisungen verstehen.'
