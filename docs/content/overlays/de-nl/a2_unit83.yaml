course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um über vergangene Zwischenfälle zu sprechen.
  learning_goal: Verbinden Sie eine Hintergrundsituation und ein Ereignis mit unregelmäßigen Imperfektformen, toen und terwijl.
units:
  nl.a2.unit83.wat_gebeurde_er:
    title: Was ist passiert?
    description: Beschreiben Sie im Imperfekt einen kleinen Zwischenfall, einen Wetterumschwung oder ein Verkehrsproblem.
lessons:
  nl.a2.unit83.lesson01.onregelmatige_vormen:
    title: Was ist passiert?
  nl.a2.unit83.lesson02.vormen_combineren:
    title: Formen kombinieren
  nl.a2.unit83.lesson03.toen_en_terwijl:
    title: Toen und terwijl
  nl.a2.unit83.lesson04.een_klein_incident:
    title: Ein kleiner Zwischenfall
  nl.a2.unit83.lesson05.noors_bericht:
    title: Noors Nachricht
  nl.a2.unit83.lesson06.lotte_en_omar:
    title: Lotte und Omar unterwegs
teaching:
  nl.a2.unit83.lesson01.teach.incidenten:
    title: Kleine Zwischenfälle
    gloss: der Platten / der Regenschauer / die Verspätung
    note: Diese Nomen benennen die Probleme in dieser Lektion.
    example_gloss:
    - Mein Fahrrad hat einen Platten.
    - Plötzlich kam ein Regenschauer.
    - Der Bus hatte Verspätung.
  nl.a2.unit83.lesson01.teach.verkeer:
    title: Unterwegs
    gloss: das Fahrrad / der Bus / die Bushaltestelle / unterwegs
    note: '*Onderweg* beschreibt, dass man sich mitten auf einer Reise oder Strecke befindet.'
    example_gloss:
    - Mein Fahrrad stand an der Bushaltestelle.
    - Der Bus ist zu spät gekommen.
    - Unterwegs begann es zu regnen.
  nl.a2.unit83.lesson01.teach.weer:
    title: Wetter und Zeit
    gloss: regnen / stark / plötzlich / zu spät
    note: '*Hard regenen* bedeutet, stark zu regnen.'
    example_gloss:
    - Es begann stark zu regnen.
    - Plötzlich kam der Bus.
    - Der Bus ist zu spät gekommen.
  nl.a2.unit83.lesson01.teach.gn_irregular_basis:
    title: Sechs unregelmäßige Imperfektverben
    gloss: sein → war/waren; haben → hatte/hatten; gehen → ging/gingen; kommen → kam/kamen; sehen → sah/sahen; sagen → sagte/sagten
    note: 'Lernen Sie diese Imperfektformen als Gruppe. Singular und Plural unterscheiden sich oft: *was/waren, ging/gingen, kwam/kwamen*.'
  nl.a2.unit83.lesson01.teach.gn_irregular_set:
    title: Sechs weitere unregelmäßige Formen
    gloss: nehmen → nahm; geben → gab; stehen → stand; sitzen → saß; gehen/laufen → ging/lief; fahren → fuhr
    note: Die Singularformen lauten *nam, gaf, stond, zat, liep,* und *reed*.
  nl.a2.unit83.lesson01.teach.vraag:
    title: Frag, was passiert ist
    gloss: Was passierte unterwegs?
    note: '*Gebeurde* ist das Imperfekt von *gebeuren*.'
  nl.a2.unit83.lesson01.teach.zinnen:
    title: Unregelmäßige Formen im Kontext
    gloss: Ich war unterwegs. Der Bus hatte Verspätung. Ich sah einen Regenschauer und nahm den Bus.
  nl.a2.unit83.lesson02.teach.handeling:
    title: Verben für Zwischenfälle
    gloss: warten / anrufen / Rad fahren / beginnen / bekommen
    note: Mit diesen Verben bauen Sie Hintergrund und Ereignis auf.
    example_gloss:
    - Ich muss auf den Bus warten.
    - Lotte will mich anrufen.
    - Ich will mit dem Fahrrad nach Hause fahren.
    - Es kann zu regnen beginnen.
    - Ich kann einen Platten bekommen.
  nl.a2.unit83.lesson02.teach.regular_review:
    title: Regelmäßiges und unregelmäßiges Imperfekt
    gloss: wartete / rief an / fuhr Rad / geschah / begann / bekam
    note: Die regelmäßigen Formen *wachtte, belde,* und *fietste* folgen der Regel aus Einheit 82. *Begon* und *kreeg* sind unregelmäßig.
  nl.a2.unit83.lesson02.teach.phrases:
    title: Vier Sätze über einen Zwischenfall
    gloss: Ich fuhr mit dem Fahrrad nach Hause. Lotte rief an. Es begann zu regnen. Ich bekam einen Platten.
  nl.a2.unit83.lesson03.teach.connectors:
    title: Zeitliche Verbindungen
    gloss: als / während / neben
    note: Verwenden Sie *toen* für einen Moment in der Vergangenheit und *terwijl* für Situationen, die sich überschneiden.
    example_gloss:
    - Als ich nach Hause kam, rief Lotte an.
    - Während ich wartete, regnete es.
    - Ich stand neben meinem Fahrrad.
  nl.a2.unit83.lesson03.teach.gn_toen:
    title: Toen mit Verbendstellung
    gloss: Als ich mit dem Fahrrad nach Hause fuhr, begann es zu regnen.
    note: 'Nach *toen* rückt das Verb im Nebensatz ans Ende: *ik naar huis fietste*.'
  nl.a2.unit83.lesson03.teach.gn_terwijl:
    title: Terwijl für eine Hintergrundsituation
    gloss: Während ich auf den Bus wartete, rief Lotte an.
    note: 'Nach *terwijl* steht das Verb am Ende: *ik op de bus wachtte*.'
  nl.a2.unit83.lesson03.teach.gn_inversion:
    title: Inversion nach dem einleitenden Nebensatz
    gloss: 'Nach einem vorangestellten toen- oder terwijl-Satz steht das finite Verb vor dem Subjekt: begann es; rief Lotte an.'
    note: Das Komma schließt den Nebensatz ab; der Hauptsatz beginnt mit *begon het* oder *belde Lotte*.
  nl.a2.unit83.lesson03.teach.gn_contrast:
    title: Toen oder terwijl
    gloss: Toen nennt den Moment, in dem etwas geschah. Terwijl verbindet zwei Situationen, die gleichzeitig im Gange waren.
    note: In dieser Lektion stehen alle erzählten Handlungen im Imperfekt.
  nl.a2.unit83.lesson04.teach.halte:
    title: An der Haltestelle
    gloss: die Haltestelle / nach Hause / neben dem Fahrrad
    note: '*Halte* kann eine Bus- oder Straßenbahnhaltestelle bedeuten.'
    example_gloss:
    - Ich habe an der Haltestelle gewartet.
    - Ich bin spät nach Hause gekommen.
    - Ich stand neben dem Fahrrad.
  nl.a2.unit83.lesson04.teach.regende:
    title: Wetter im Hintergrund
    gloss: Während ich neben meinem Fahrrad stand, regnete es heftig.
  nl.a2.unit83.lesson04.teach.reeks:
    title: Ein kleiner Zwischenfall
    gloss: Als ich nach Hause fuhr, bekam ich einen Platten. Ich ging zur Haltestelle und nahm den Bus.
  nl.a2.unit83.lesson05.teach.reading:
    title: Noors Heimweg
    gloss: Gestern fuhr Noor nach der Arbeit mit dem Fahrrad nach Hause. Als sie über den Radweg fuhr, bekam sie einen Platten. Während sie an der Haltestelle stand, hatte der Bus Verspätung. Sie saß zwanzig Minuten im Bus. Als sie zu Hause ankam, rief sie Lotte an.
    note: Achten Sie auf die Hintergrundsituationen und die Ereignisse, die währenddessen eintraten.
    glosses:
      Gisteren: gestern
      reed: fuhr
      fietspad: Radweg
      lekke: platt
      band: Reifen
      halte: Haltestelle
      twintig: zwanzig
      minuten: Minuten
  nl.a2.unit83.lesson06.teach.lotte_vraag:
    title: Lotte fragt
    gloss: 'Lotte: Hallo Omar, was ist unterwegs passiert?'
  nl.a2.unit83.lesson06.teach.omar_band:
    title: Omar nennt den Zwischenfall
    gloss: 'Omar: Als ich mit dem Fahrrad nach Hause fuhr, bekam ich einen Platten.'
  nl.a2.unit83.lesson06.teach.lotte_toen:
    title: Lotte fragt, was danach geschah
    gloss: 'Lotte: Oh nein! Und dann?'
  nl.a2.unit83.lesson06.teach.omar_regen:
    title: Omar ergänzt einen Wetterumschwung
    gloss: 'Omar: Während ich neben meinem Fahrrad stand, fing es an, heftig zu regnen.'
  nl.a2.unit83.lesson06.teach.lotte_thuis:
    title: Lotte fragt, wie er nach Hause kam
    gloss: 'Lotte: Wie bist du nach Hause gekommen?'
  nl.a2.unit83.lesson06.teach.omar_bus:
    title: Omar beendet seinen Bericht
    gloss: 'Omar: Ich bin zur Bushaltestelle gelaufen und habe den Bus genommen.'
exercises:
  nl.a2.unit83.lesson01.exercise01.choose_had:
    instruction: Wählen Sie den niederländischen Satz im Imperfectum.
    correct_option: De bus had vertraging.
    distractors:
    - De bus heeft vertraging.
    - De bus waren vertraging.
    - De bus hadden vertraging.
    accepted_answers:
    - value: De bus had vertraging.
      status: correct
    feedback: '*Had* ist das Imperfekt (Singular) von *hebben*.'
    prompt_blocks:
    - Der Bus hatte Verspätung.
  nl.a2.unit83.lesson01.exercise02.choose_saw:
