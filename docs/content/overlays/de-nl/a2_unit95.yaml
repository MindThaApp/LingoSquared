course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um über reale Bedingungen zu sprechen.
  learning_goal: Sagen, was passiert oder passieren wird, wenn eine Bedingung erfüllt ist – mit als + Präsens, Verb am Ende im als-Satz und Inversion im Hauptsatz.
units:
  nl.a2.unit95.als_dan:
    title: Wenn ... dann
    description: 'Über Wetterpläne und Ladenregeln mit realen Bedingungen sprechen: als + Präsens, mit oder ohne dan.'
lessons:
  nl.a2.unit95.lesson01.als_het_regent:
    title: Wenn es regnet
  nl.a2.unit95.lesson02.werkwoord_achteraan:
    title: Das Verb am Ende
  nl.a2.unit95.lesson03.voorop_of_achteraan:
    title: Am Anfang oder am Ende
  nl.a2.unit95.lesson04.regels_in_de_winkel:
    title: Regeln im Geschäft
  nl.a2.unit95.lesson05.noors_bericht:
    title: Noors Nachricht
  nl.a2.unit95.lesson06.lotte_en_omar:
    title: Lotte und Omar machen Pläne
teaching:
  nl.a2.unit95.lesson01.teach.weer:
    title: Wetter
    gloss: das Wetter / die Sonne / scheinen / regnen / schön / kalt / warm
    note: 'Wettersätze verwenden *het*: *Het regent*, *Het is koud*. Die Sonne ist das Subjekt von *schijnen*: *De zon schijnt*.'
    example_gloss:
    - Das Wetter ist schön.
    - Die Sonne scheint.
    - Es regnet.
    - Es ist kalt.
    - Es ist warm.
  nl.a2.unit95.lesson01.teach.plannen:
    title: Pläne
    gloss: zu Hause bleiben / spazieren gehen / in den Park gehen / an den Strand gehen
    note: 'Bei *ik* fällt die Endung des Infinitivs weg: aus *blijven* wird *ik blijf*, aus *gaan* wird *ik ga*. Bei *we* ist die Verbform gleich dem Infinitiv: *we blijven, we gaan*.'
    example_gloss:
    - Ich bleibe zu Hause.
    - Ich gehe in den Park.
    - Wir gehen an den Strand.
    - Wir bleiben zu Hause.
    - Wir gehen im Park spazieren.
  nl.a2.unit95.lesson01.teach.vraag:
    title: Nach Plänen fragen
    gloss: Was machst du, wenn es regnet?
    note: '*Als* bedeutet „wenn“. In dieser Frage steht der *als*-Satz am Ende.'
  nl.a2.unit95.lesson01.teach.gn_als_basis:
    title: Als für reale Bedingungen
    gloss: Wenn es regnet, bleibe ich zu Hause. Wenn die Sonne scheint, gehe ich in den Park.
    note: Verwenden Sie *als* + Präsens für etwas, das wirklich eintreten kann. Der *als*-Satz nennt die Bedingung, der andere Satz sagt, was passiert oder was man tut. Diese Lektion behandelt nur reale Bedingungen, keine unwirklichen.
  nl.a2.unit95.lesson01.teach.zinnen:
    title: Zwei Pläne
    gloss: Wenn es kalt ist, bleibe ich zu Hause. Wenn es warm ist, gehen wir zum Strand.
  nl.a2.unit95.lesson02.teach.tijd:
    title: Zeit und Anrufen
    gloss: Zeit haben / anrufen / mitkommen
    note: '*Hebben* und *komen* verändern sich je nach Subjekt: *ik heb, je hebt, hij heeft*; *ik kom, je komt, hij komt*. Steht *je* hinter dem Verb (in einer Frage oder im Hauptsatz nach einem *als*-Satz), fällt das *-t* weg: *heb je, kom je*.'
    example_gloss:
    - Ich habe Zeit.
    - Hast du Zeit?
    - Omar hat Zeit.
    - Ich rufe Lotte an.
    - Omar ruft Lotte an.
    - Kommst du mit?
    - Er kommt mit.
  nl.a2.unit95.lesson02.teach.drinken:
    title: Getränke
    gloss: trinken / Tee / Wasser / Kaffee
    example_gloss:
    - Ich trinke Tee.
    - Wir trinken Kaffee.
    - Ich trinke Wasser.
  nl.a2.unit95.lesson02.teach.gn_werkwoord_achteraan:
    title: Das Verb steht im als-Satz am Ende
    gloss: Wenn ich Zeit habe, rufe ich Lotte an.
    note: In einem *als*-Satz steht das konjugierte Verb am Ende des Satzes (in den einfachen Sätzen dieser Lektion ist es das letzte Wort). Man sagt *als ik tijd heb*, nicht *als ik heb tijd*. Dasselbe gilt für *als het koud is* und *als de zon schijnt*.
  nl.a2.unit95.lesson02.teach.gn_personen:
    title: Andere Subjekte
    gloss: Wenn du Zeit hast, kommst du mit. Wenn Omar Zeit hat, kommt er mit.
    note: 'Im *als*-Satz steht das Verb am Ende und richtet sich nach seinem Subjekt: *je hebt*, *Omar heeft*. Im Hauptsatz, der auf den *als*-Satz folgt, steht das Verb an erster Stelle und das Subjekt danach: *kom je*, *komt hij*.'
  nl.a2.unit95.lesson02.teach.zinnen:
    title: Getränke und Wetter
    gloss: Wenn es warm ist, trinke ich Wasser. Wenn es kalt ist, trinke ich Tee.
  nl.a2.unit95.lesson03.teach.plaatsen:
    title: Tage und Orte
    gloss: morgen / Samstag / das Museum / der Markt
    example_gloss:
    - Morgen gehe ich zum Markt.
    - Am Samstag gehen wir ins Museum.
    - Das Museum ist schön.
  nl.a2.unit95.lesson03.teach.gn_inversie:
    title: 'als-Satz zuerst: Verb vor dem Subjekt'
    gloss: Wenn es regnet, gehe ich ins Museum.
    note: 'Steht der *als*-Satz am Anfang, zählt er als erste Position im Satz. Der Hauptsatz beginnt dann mit dem Verb, danach folgt das Subjekt: *ga ik*, nicht *ik ga*. Nach dem *als*-Satz steht ein Komma.'
  nl.a2.unit95.lesson03.teach.gn_dan:
    title: Optionales dan
    gloss: Wenn es regnet, dann gehe ich ins Museum.
    note: 'Nach dem Komma können Sie *dan* („dann“) einfügen. Es ist optional. Das Verb steht trotzdem direkt nach *dan* und vor dem Subjekt: *dan ga ik*.'
  nl.a2.unit95.lesson03.teach.gn_achteraan:
    title: Hauptsatz zuerst
    gloss: Ich gehe ins Museum, wenn es regnet.
    note: Sie können auch mit dem Hauptsatz beginnen. Dann ist die Wortstellung normal (*ik ga*), es gibt keine Inversion, und in der Regel setzt man kein Komma. Die Bedeutung ist dieselbe wie bei *Als het regent, ga ik naar het museum.*
  nl.a2.unit95.lesson03.teach.zinnen:
    title: Beide Reihenfolgen
    gloss: Wenn die Sonne scheint, dann gehen wir zum Strand. Wir gehen zum Markt, wenn das Wetter schön ist.
  nl.a2.unit95.lesson04.teach.winkel:
    title: Im Geschäft
    gloss: das Geschäft / der Kassenbon / das Geld / der Rabatt / gratis
    note: '*De bon* ist der Kassenbon, den man im Geschäft bekommt. *Geen* bedeutet „kein“ vor einem Nomen: *geen geld*.'
    example_gloss:
    - Ich bin im Geschäft.
    - Ich habe den Kassenbon.
    - Ich habe kein Geld.
    - Der Rabatt ist gut.
  nl.a2.unit95.lesson04.teach.werkwoorden:
    title: Verben im Geschäft
    gloss: kaufen / bezahlen / bekommen / zurück
    note: '*Je krijgt je geld terug* = Sie bekommen Ihr Geld zurück. Bei *ik* hat das Verb keine Endung; bei *je* endet es auf *-t*, außer wenn *je* hinter dem Verb steht: *krijg je*.'
    example_gloss:
    - Ich kaufe zwei.
    - Du bezahlst fünfzig Euro.
    - Du bekommst Rabatt.
    - Du bekommst dein Geld zurück.
  nl.a2.unit95.lesson04.teach.bedragen:
    title: Zahlen und Lieferung
    gloss: zwei / fünfzig / Euro / mehr als / Lieferung / nicht
    example_gloss:
    - Die Lieferung ist kostenlos.
    - Ich bezahle mehr als fünfzig Euro.
    - Ich habe den Kassenbon nicht.
  nl.a2.unit95.lesson04.teach.gn_regels:
    title: 'Regeln im Geschäft: als + Präsens'
    gloss: Wenn Sie den Kassenbon haben, bekommen Sie Ihr Geld zurück.
    note: 'Geschäfte formulieren ihre Regeln als echte Bedingungen: *als* + Präsens, im *als*-Satz steht das Verb am Ende, und im Hauptsatz danach steht das Verb vor dem Subjekt. Viele Geschäfte verwenden *u* statt *je*, aber der Aufbau ist derselbe.'
  nl.a2.unit95.lesson04.teach.zinnen:
    title: Zwei Regeln im Geschäft
    gloss: Wenn du zwei kaufst, bekommst du Rabatt. Wenn du den Kassenbon nicht hast, bekommst du dein Geld nicht zurück.
  nl.a2.unit95.lesson04.teach.gn_wanneer:
    title: Als oder wanneer?
    gloss: Wann gehen wir zum Geschäft?
    note: 'Im alltäglichen Niederländisch ist *als* das normale Wort für „wenn“ in einer Bedingung. *Wanneer* fragt vor allem „wann?“ in einer Frage. Verwenden Sie *wanneer* nicht für die Bedingungen in dieser Lektion. (Im Deutschen ist das ähnlich: „wann“ fragt nach der Zeit, „wenn“ leitet eine Bedingung ein.)'
  nl.a2.unit95.lesson05.teach.reading:
    title: Noors Pläne
    gloss: Hallo Lotte und Omar! Am Samstag gehen wir zum Strand, wenn die Sonne scheint. Wenn es regnet, gehen wir ins Museum. Wenn es kalt ist, trinken wir Tee. Wenn ihr Zeit habt, kommt ihr dann mit? Liebe Grüße, Noor
    note: Verfolgen Sie, welcher Plan zu welcher Bedingung gehört. Achten Sie auf das Verb am Ende jedes *als*-Satzes.
    glosses:
      Hoi: hallo
      jullie: ihr
      Groetjes: liebe Grüße
  nl.a2.unit95.lesson06.teach.lotte_vraag:
    title: Lotte fragt nach Samstag
    gloss: 'Lotte: Hallo Omar, was machst du am Samstag?'
  nl.a2.unit95.lesson06.teach.omar_strand:
    title: Omar nennt eine Bedingung
    gloss: 'Omar: Wenn das Wetter schön ist, gehe ich zum Strand.'
  nl.a2.unit95.lesson06.teach.lotte_regen:
    title: Lotte fragt nach Regen
    gloss: 'Lotte: Und wenn es regnet?'
  nl.a2.unit95.lesson06.teach.omar_museum:
    title: Omar macht einen Vorschlag und eine Einladung
    gloss: 'Omar: Dann gehe ich ins Museum. Wenn du Zeit hast, kommst du dann mit?'
  nl.a2.unit95.lesson06.teach.lotte_mee:
    title: Lotte sagt unter einer Bedingung zu
    gloss: 'Lotte: Ja, ich habe am Samstag frei. Wenn die Sonne scheint, komme ich mit.'
  nl.a2.unit95.lesson06.teach.omar_tot:
    title: Omar beendet das Gespräch
    gloss: 'Omar: Schön! Bis Samstag!'
exercises:
  nl.a2.unit95.lesson01.exercise01.choose_regent_thuis:
    instruction: Wählen Sie den niederländischen Satz, der zum deutschen Satz passt.
    correct_option: Als het regent, blijf ik thuis.
    distractors:
    - Als de zon schijnt, blijf ik thuis.
    - Als het regent, ga ik naar het park.
    - Wenn es kalt ist, gehe ich zum Strand.
    accepted_answers:
    - value: Als het regent, blijf ik thuis.
      status: correct
    feedback: '*Als het regent* = wenn es regnet; *blijf ik thuis* = ich bleibe zu Hause.'
    prompt_blocks:
    - Wenn es regnet, bleibe ich zu Hause.
  nl.a2.unit95.lesson01.exercise02.choose_zon_park:
    instruction: Wählen Sie den niederländischen Satz, der zum deutschen Satz passt.
    correct_option: Als de zon schijnt, gaan we naar het park.
    distractors:
    - Als het regent, gaan we naar het park.
    - Als de zon schijnt, blijven we thuis.
    - Wenn es kalt ist, gehen wir in den Park.
    accepted_answers:
    - value: Als de zon schijnt, gaan we naar het park.
      status: correct
    feedback: '*Als de zon schijnt* = wenn die Sonne scheint; *gaan we* = wir gehen.'
    prompt_blocks:
    - Wenn die Sonne scheint, gehen wir in den Park.
  nl.a2.unit95.lesson01.exercise03.match_condities:
    instruction: Ordnen Sie jeder niederländischen Wendung ihre deutsche Bedeutung zu.
    accepted_answers:
    - value:
      - left: het regent
        right: es regnet
      - left: de zon schijnt
        right: die Sonne scheint
      - left: es ist kalt
        right: es ist kalt
      - left: es ist warm
        right: es ist warm
      - left: es ist schönes Wetter
        right: das Wetter ist schön
      - left: we blijven thuis
        right: wir bleiben zu Hause
      status: correct
    feedback: Diese Wendungen sind die Bausteine der Sätze in dieser Lektion.
    pairs:
    - left: het regent
      right: es regnet
    - left: de zon schijnt
      right: die Sonne scheint
    - left: es ist kalt
      right: es ist kalt
    - left: es ist warm
      right: es ist warm
    - left: es ist schönes Wetter
      right: das Wetter ist schön
    - left: we blijven thuis
      right: wir bleiben zu Hause
    localize_pair_lefts: 'yes'
  nl.a2.unit95.lesson01.exercise04.order_regent:
    instruction: 'Bringen Sie die Wörter in die richtige Reihenfolge: „Wenn es regnet, bleibe ich zu Hause.“'
    correct_option: Als het regent blijf ik thuis
    accepted_answers:
    - value: Als het regent blijf ik thuis
      status: correct
    - value: Ik blijf thuis als het regent
      status: correct
    feedback: '*Als het regent, blijf ik thuis.* Sie können den *als*-Satz auch ans Ende stellen: *Ik blijf thuis als het regent.*'
  nl.a2.unit95.lesson01.exercise05.complete_regent:
    instruction: 'Vervollständigen Sie den Satz: „Wenn es regnet, bleibe ich zu Hause.“'
    correct_option: regent
    accepted_answers:
    - value: regent
      status: correct
    feedback: '*Het regent* = es regnet.'
  nl.a2.unit95.lesson01.exercise06.translate_zon_park:
    instruction: Übersetzen Sie ins Niederländische.
    accepted_answers:
    - value: Als de zon schijnt, ga ik naar het park.
      status: correct
    - value: Als de zon schijnt ga ik naar het park.
      status: correct
    - value: Ik ga naar het park als de zon schijnt.
      status: correct
    - value: Ik ga naar het park, als de zon schijnt.
      status: correct
    feedback: '*Als de zon schijnt, ga ik naar het park.*'
    prompt_blocks:
    - Wenn die Sonne scheint, gehe ich in den Park.
  nl.a2.unit95.lesson01.exercise07.write_koud:
    instruction: Schreiben Sie den verlangten niederländischen Satz.
    correct_option: Als het koud is, blijf ik thuis.
    accepted_answers:
    - value: Als het koud is, blijf ik thuis.
      status: correct
    - value: Als het koud is blijf ik thuis.
      status: correct
    - value: Ik blijf thuis als het koud is.
      status: correct
    - value: Ik blijf thuis, als het koud is.
      status: correct
    feedback: '*Als het koud is, blijf ik thuis.* bedeutet: „Wenn es kalt ist, bleibe ich zu Hause.“'
    prompt_blocks:
    - 'Schreiben Sie auf Niederländisch: Wenn es kalt ist, bleibe ich zu Hause.'
  nl.a2.unit95.lesson02.exercise01.choose_tijd_bel:
    instruction: Wählen Sie den Satz, in dem das Verb an der richtigen Stelle steht.
    correct_option: Als ik tijd heb, bel ik Lotte.
    distractors:
    - Als ik heb tijd, bel ik Lotte.
    - Als ik tijd heb, ik bel Lotte.
    - Als ik tijd heb, ik Lotte bel.
    accepted_answers:
    - value: Als ik tijd heb, bel ik Lotte.
      status: correct
    feedback: 'Im *als*-Satz steht das Verb am Ende: *als ik tijd heb*. Danach beginnt der Hauptsatz mit dem Verb: *bel ik*.'
    prompt_blocks:
    - Wenn ich Zeit habe, rufe ich Lotte an.
  nl.a2.unit95.lesson02.exercise02.choose_omar:
    instruction: Wählen Sie den Satz, in dem die Verben an der richtigen Stelle stehen.
    correct_option: Als Omar tijd heeft, komt hij mee.
    distractors:
    - Als Omar heeft tijd, komt hij mee.
    - Als Omar tijd heeft, hij komt mee.
    - Als Omar tijd heeft, komt mee hij.
    accepted_answers:
    - value: Als Omar tijd heeft, komt hij mee.
      status: correct
    feedback: '*Heeft* steht am Ende des *als*-Satzes; *komt hij mee* beginnt mit dem Verb.'
    prompt_blocks:
    - Wenn Omar Zeit hat, kommt er mit.
  nl.a2.unit95.lesson02.exercise03.match_clauses:
