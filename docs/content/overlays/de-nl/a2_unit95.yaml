    - value: Ik drink water, als het warm is.
      status: correct
    feedback: '*Als het warm is, drink ik water.* bedeutet: „Wenn es warm ist, trinke ich Wasser.“'
    prompt_blocks:
    - 'Schreiben Sie auf Niederländisch: Wenn es warm ist, trinke ich Wasser.'
  nl.a2.unit95.lesson03.exercise01.choose_inversie:
    instruction: Wählen Sie den Satz mit der richtigen Wortstellung nach dem als-Satz.
    correct_option: Als het regent, ga ik naar het museum.
    distractors:
    - Als het regent, ik ga naar het museum.
    - Als het regent, ga naar het museum ik.
    - Als het regent ik naar het museum ga.
    accepted_answers:
    - value: Als het regent, ga ik naar het museum.
      status: correct
    feedback: 'Nach einem vorangestellten *als*-Satz steht das Verb an erster Stelle: *ga ik*.'
    prompt_blocks:
