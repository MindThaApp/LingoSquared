    distractors:
    - Als het regent, dan gaan we naar het museum.
    - Als de zon schijnt, gaan we naar de markt.
    - Als de zon schijnt, dan blijven we thuis.
    accepted_answers:
    - value: Als de zon schijnt, dan gaan we naar het strand.
      status: correct
    feedback: Sie haben *Als de zon schijnt, dan gaan we naar het strand.* gehört.
  nl.a2.unit95.lesson03.exercise04.match_volgorde:
    instruction: Ordnen Sie jedem Satz, der mit als beginnt, denselben Satz mit dem Hauptsatz zuerst zu.
    accepted_answers:
    - value:
      - left: Als het regent, ga ik naar het museum.
        right: Ik ga naar het museum als het regent.
      - left: Als de zon schijnt, ga ik naar het strand.
        right: Ik ga naar het strand als de zon schijnt.
      - left: Wenn es kalt ist, bleibe ich zu Hause.
        right: Ich bleibe zu Hause, wenn es kalt ist.
      - left: Als ik tijd heb, ga ik naar de markt.
        right: Ik ga naar de markt als ik tijd heb.
      - left: Wenn es warm ist, trinke ich Wasser.
        right: Ich trinke Wasser, wenn es warm ist.
      - left: Als je tijd hebt, bel ik Lotte.
        right: Ik bel Lotte als je tijd hebt.
      status: correct
    feedback: 'Die Bedeutung bleibt gleich. Nur die Reihenfolge ändert sich: *ga ik* (nach dem als-Satz) wird zu *ik ga* (Hauptsatz zuerst).'
    pairs:
    - left: Als het regent, ga ik naar het museum.
      right: Ik ga naar het museum als het regent.
    - left: Als de zon schijnt, ga ik naar het strand.
      right: Ik ga naar het strand als de zon schijnt.
    - left: Wenn es kalt ist, bleibe ich zu Hause.
