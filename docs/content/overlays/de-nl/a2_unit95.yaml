    feedback: 'Jeder Satz endet mit seinem Verb: *heb, hebt, heeft, is, schijnt*.'
    pairs:
    - left: Als ik tijd heb
      right: Wenn ich Zeit habe
    - left: Als je tijd hebt
      right: Wenn du Zeit hast
    - left: Als Omar tijd heeft
      right: Wenn Omar Zeit hat
    - left: Wenn es warm ist
      right: Wenn es warm ist
    - left: Wenn es kalt ist
      right: Wenn es kalt ist
    - left: Als de zon schijnt
      right: Wenn die Sonne scheint
