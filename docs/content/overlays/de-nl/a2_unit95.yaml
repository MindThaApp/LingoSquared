  nl.a2.unit95.lesson02.exercise04.order_kom_mee:
    instruction: 'Bringen Sie die Wörter in die richtige Reihenfolge: „Wenn du Zeit hast, kommst du mit.“'
    correct_option: Als je tijd hebt kom je mee
    accepted_answers:
    - value: Als je tijd hebt kom je mee
      status: correct
    feedback: '*Als je tijd hebt, kom je mee.* *Hebt* steht am Ende des *als*-Satzes, und *kom* folgt direkt danach.'
  nl.a2.unit95.lesson02.exercise05.complete_heb:
    instruction: 'Ergänzen Sie das Präsens von hebben: „Wenn ich Zeit habe, rufe ich Lotte an.“'
    correct_option: heb
    accepted_answers:
    - value: heb
      status: correct
    feedback: '*Ik heb* ist das Präsens von *hebben* für *ik* und steht am Ende des *als*-Satzes.'
  nl.a2.unit95.lesson02.exercise06.translate_je_tijd:
    instruction: Übersetzen Sie ins Niederländische.
    accepted_answers:
