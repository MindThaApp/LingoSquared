teaching:
  nl.a2.unit75.lesson01.teach.scherm:
    title: Der Bildschirm
    gloss: der Bildschirm
    note: '*Het scherm* ist ein Neutrum (het); im Deutschen ist „Bildschirm“ dagegen maskulin.'
    example_gloss: Ich schaue oft auf meinen Bildschirm.
  nl.a2.unit75.lesson01.teach.telefoon_vaak:
    title: Sagen, dass man sein Handy oft benutzt
    gloss: Ich benutze mein Handy oft.
    note: '*Vaak* (oft) steht in einem einfachen Aussagesatz wie diesem normalerweise nach dem Objekt.'
  nl.a2.unit75.lesson01.teach.hoe_vaak:
    title: Fragen, wie oft jemand soziale Medien benutzt
    gloss: Wie oft benutzt du soziale Medien?
    note: '*Sociale media* ist ein Plural, ein übernommener und angepasster Begriff, der ähnlich wie im Deutschen („soziale Medien“) verwendet wird.'
  nl.a2.unit75.lesson02.teach.app:
    title: Die App
    gloss: die App
    note: '*De app* ist ein de-Wort; es ist eine direkte Entlehnung, die im niederländischen Alltag unverändert verwendet wird (ähnlich wie „die App“ im Deutschen).'
    example_gloss: Ich benutze eine App zum Chatten.
  nl.a2.unit75.lesson02.teach.chatten_vrienden:
    title: Sagen, dass man mit Freunden chattet
    gloss: Ich chatte oft mit Freunden auf meinem Handy.
    note: '*Chatten* (chatten) ist ein entlehntes Verb, das wie ein ursprünglich niederländisches Verb regelmäßig konjugiert wird, ähnlich wie „chatten“ im Deutschen.'
  nl.a2.unit75.lesson02.teach.welke_apps:
    title: Fragen, welche Apps jemand am meisten benutzt
    gloss: Welche Apps benutzt du am meisten?
    note: '*Het meest* (am meisten) ist die Superlativform, mit der hier nach der häufigsten Wahl gefragt wird.'
  nl.a2.unit75.lesson03.teach.schermtijd:
    title: Bildschirmzeit
    gloss: die Bildschirmzeit
    note: '*De schermtijd* ist ein de-Wort, eine Zusammensetzung aus *scherm* (Bildschirm) und *tijd* (Zeit).'
    example_gloss: Ich habe diese Woche zu viel Bildschirmzeit.
  nl.a2.unit75.lesson03.teach.mening_schermtijd:
    title: Eine Meinung zur eigenen Bildschirmzeit äußern
    gloss: Ich finde, dass ich zu viel Bildschirmzeit habe.
    note: '*Ik vind dat ...* (Ich finde, dass ...) ist die übliche Art, eine Meinung mit einem folgenden Nebensatz einzuleiten.'
  nl.a2.unit75.lesson03.teach.slecht_voor_ogen:
    title: Sagen, dass etwas nicht gut für die Augen ist
    gloss: Es ist nicht gut für deine Augen.
    note: '*Je ogen* (deine Augen) verwendet das informelle Possessivpronomen *je*, passend zum informellen Register dieser Einheit.'
  nl.a2.unit75.lesson04.teach.gewoonte:
    title: Die Gewohnheit
    gloss: die Gewohnheit
    note: '*De gewoonte* ist ein de-Wort.'
    example_gloss: Es ist eine schlechte Angewohnheit, ständig aufs Handy zu schauen.
  nl.a2.unit75.lesson04.teach.mening_minder:
    title: Eine Meinung mit volgens mij äußern
    gloss: Meiner Meinung nach solltest du weniger Zeit am Handy verbringen.
    note: '*Volgens mij* (meiner Meinung nach, wörtlich „laut mir“) ist eine weitere übliche Möglichkeit, eine persönliche Meinung einzuleiten, neben *ik vind dat*.'
  nl.a2.unit75.lesson04.teach.mee_eens:
    title: Der Meinung eines anderen zustimmen
    gloss: Da stimme ich zu.
    note: '*Het ergens mee eens zijn* (mit etwas einverstanden sein) ist die feste Wendung; *daar* bezieht sich auf das eben Gesagte.'
  nl.a2.unit75.lesson05.teach.blog:
    title: Einen Blogbeitrag über Bildschirmzeit lesen
    gloss: Viele Menschen benutzen ihr Handy mehr als vier Stunden pro Tag. Soziale Medien machen Spaß, aber zu viel Bildschirmzeit ist nicht gesund. Versuchen Sie, jeden Abend eine Stunde ohne Handy zu verbringen. Das ist gut für Ihre Augen und Ihren Schlaf.
    note: '*Probeer ... door te brengen* (versuche ... zu verbringen) verwendet *proberen* + *te* + Infinitiv, eine gängige Konstruktion für Vorschläge, ähnlich wie „versuchen zu“ im Deutschen.'
    glosses:
      Veel: viele / eine Menge
      mensen: Menschen (Plural von mens)
      gebruiken: benutzen (sie benutzen; von gebruiken)
      hun: ihr / ihre
      telefoon: Handy
      meer: mehr
      dan: als (meer dan = mehr als)
      vier: vier
      uur: Stunde(n)
      dag: Tag
      Sociale: sozial
      media: Medien
      zijn: sind
      leuk: schön / nett
      maar: aber
      veel: viel
      schermtijd: die Bildschirmzeit
      niet: nicht
      gezond: gesund
      Probeer: versuch
      elke: jeder / jede
      avond: Abend
      zonder: ohne
      brengen: verbringen
      Dat: dass
      goed: gut
      ogen: Augen
      slaap: schlafen
  nl.a2.unit75.lesson06.teach.omar_vraag:
    title: Omar fragt, wie oft
    gloss: 'Omar: Wie oft nutzt du soziale Medien, Lotte?'
  nl.a2.unit75.lesson06.teach.lotte_drie_uur:
    title: Lotte antwortet mit einer Zahl
    gloss: 'Lotte: Eigentlich ziemlich oft. Ich schaue schon etwa drei Stunden am Tag auf meinen Bildschirm.'
  nl.a2.unit75.lesson06.teach.omar_niet_te_veel:
    title: Omar hinterfragt die Menge
    gloss: 'Omar: Das ist ziemlich viel. Findest du nicht, dass das zu viel ist?'
  nl.a2.unit75.lesson06.teach.lotte_te_veel:
    title: Lotte stimmt zu, dass es zu viel ist
    gloss: 'Lotte: Doch, ich finde es eigentlich zu viel. Ich möchte weniger Zeit an meinem Handy verbringen.'
  nl.a2.unit75.lesson06.teach.omar_wegleggen:
    title: Omar schlägt vor, das Handy wegzulegen
    gloss: 'Omar: Vielleicht kannst du abends dein Handy weglegen.'
  nl.a2.unit75.lesson06.teach.lotte_goed_idee:
    title: Lotte will es ausprobieren
    gloss: 'Lotte: Gute Idee. Das probiere ich ab heute aus.'
  nl.a2.unit75.lesson06.teach.grammar_vinden_dat:
    title: 'Dritte Person: vindt/heeft/zij/haar'
    gloss: Lotte findet, dass sie zu viel Bildschirmzeit hat. Sie möchte weniger Zeit an ihrem Handy verbringen.
    note: '*Vindt* und *heeft* sind die Formen der 3. Person Singular von *vinden* (finden/meinen) und *hebben* (haben); *zij* (sie) und *haar* (ihr/ihre) sind die passenden Pronomen der 3. Person Femininum. Sie fassen hier Lottes eigene Worte in der dritten Person zusammen.'
