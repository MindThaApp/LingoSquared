course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch A2, um über Gefühle und Körperpflege zu sprechen.
  learning_goal: Sie verwenden reflexive Verben mit dem vollständigen Paradigma me, je, zich, ons, je, zich, um zu sagen, wie Sie sich fühlen und was Sie für Ihre Pflege tun.
units:
  nl.a2.unit103.zorg_voor_jezelf:
    title: Sich um sich selbst kümmern
    description: Beschreiben Sie mit reflexiven Verben, wie Sie sich fühlen und was Sie für Ihre Pflege tun.
lessons:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je:
    title: Wie fühlst du dich?
  nl.a2.unit103.zorg_voor_jezelf.lesson02.het_hele_rijtje:
    title: Das ganze Paradigma
  nl.a2.unit103.zorg_voor_jezelf.lesson03.wassen_of_zich_wassen:
    title: Wassen oder zich wassen?
  nl.a2.unit103.zorg_voor_jezelf.lesson04.bij_de_kapper_en_thuis:
    title: Beim Friseur und zu Hause
  nl.a2.unit103.zorg_voor_jezelf.lesson05.noors_bericht:
    title: Noors Nachricht
  nl.a2.unit103.zorg_voor_jezelf.lesson06.lotte_en_omar:
    title: Lotte und Omar
teaching:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gezondheid:
    title: Gesundheit
    gloss: krank / gesund / müde / der Schmerz / der Kopf / der Bauch / der Arzt
    note: Diese Wörter beschreiben, wie sich Ihr Körper anfühlt.
    example_gloss:
    - Noor ist krank.
    - Lotte ist gesund.
    - Omar ist müde.
    - Ich habe Schmerzen im Kopf.
    - Ich habe Bauchschmerzen.
    - Noor geht zum Arzt.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gevoelens:
    title: Gefühle
    gloss: glücklich / wütend / ängstlich / traurig / ruhig / nervös
    note: Diese Adjektive benennen Gefühle. Sie stehen nach einer Form von zijn oder nach voelen + Reflexivpronomen.
    example_gloss:
    - Omar ist glücklich.
    - Noor ist wütend.
    - Lotte ist nervös.
    - Ich habe Angst.
    - Er ist traurig.
    - Wir sind ruhig.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.verzorging:
    title: Körperpflege
    gloss: der Friseur / das Haar / der Bart / die Hand
    note: Wörter rund um die Pflege des Aussehens.
    example_gloss:
    - Omar geht zum Friseur.
    - Lotte hat lange Haare.
    - Der Mann hat einen Bart.
    - Ich habe eine Hand.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gn_voelen:
    title: 'Zich voelen: das vollständige Paradigma'
    gloss: ich fühle mich / du fühlst dich / er fühlt sich / sie fühlt sich / wir fühlen uns / ihr fühlt euch / sie fühlen sich
    note: 'Zich voelen ist ein reflexives Verb: Das Reflexivpronomen richtet sich immer nach dem Subjekt. Ik: me. Jij: je. Hij, zij: zich. Wij: ons. Jullie: je. Zij (sie, Plural): zich.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.vraag:
    title: Fragen, wie es jemandem geht
    gloss: Wie fühlst du dich? Ich fühle mich gut.
    note: 'Beide je sind nötig: Das erste ist das Subjekt, das zweite das Reflexivpronomen.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.zinnen:
    title: Gefühle im Kontext
    gloss: Ich fühle mich müde. Er fühlt sich krank. Wir fühlen uns glücklich. Lotte ist krank. Sie fühlt sich nicht wohl.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.werkwoorden:
    title: Drei reflexive Verben
    gloss: sich waschen / sich beeilen / sich rasieren
    note: Im Wörterbuch stehen diese Verben mit zich. Im Satz ändert sich zich je nach Subjekt.
    example_gloss:
    - Ich wasche mich jeden Morgen.
    - Noor beeilt sich auf dem Weg zur Arbeit.
    - Omar rasiert sich heute.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.tijd:
    title: Zeit und Tempo
    gloss: jeden Morgen / heute / heute Abend / immer / schnell / die Arbeit
    note: Zeitangaben stehen oft am Satzanfang.
    example_gloss:
    - Jeden Morgen beeile ich mich.
    - Heute fühle ich mich gut.
    - Heute Abend bin ich zu Hause.
    - Du beeilst dich immer.
    - Wir waschen uns schnell.
    - Lotte geht zur Arbeit.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_rijtje:
    title: 'Die Reflexivpronomen: me, je, zich, ons'
    gloss: ich beeile mich / du beeilst dich / er beeilt sich / sie beeilt sich / wir beeilen uns / ihr beeilt euch / sie beeilen sich
    note: 'Das Pronomen folgt auf das Subjekt: ik: me; jij: je; hij, zij, het: zich; wij: ons; jullie: je; zij (sie, Plural): zich. Beachten Sie auch die Verbendungen: ik haast, jij haast, wij haasten.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_zich:
    title: Zich steht auch für Namen und Nomen im Plural
    gloss: Lotte wäscht sich. Die Kinder waschen sich. Du rasierst dich. Wir waschen uns.
    note: 'Ein Name oder ein Nomen (Lotte, de kinderen) steht mit zich, genau wie hij, zij oder het. Nur ik, jij, wij und jullie haben eigene Formen: me, je, ons, je.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.zinnen:
    title: Vier kurze Sätze
    gloss: Ich wasche mich. Du wäschst dich. Er rasiert sich. Wir beeilen uns.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.lichaam:
    title: Dinge, die man waschen kann
    gloss: das Gesicht / die Hände / die Zähne / das Auto / das Baby / die Kinder
    note: Wenn Sie einen Körperteil nennen, verwenden Sie mijn, je oder zijn (der eigene Körperteil ist kein Reflexivobjekt).
    example_gloss:
    - Ich wasche mir die Hände.
    - Du wäschst dir das Gesicht.
    - Er hat schöne Zähne.
    - Lotte wäscht das Auto.
    - Omar wäscht das Baby.
    - Die Kinder sind zu Hause.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_lichaam:
    title: Körperteil oder ganze Person
    gloss: Ich wasche mir die Hände. Ich wasche mich. Du wäschst dir das Gesicht. Du wäschst dich.
    note: 'Wenn Sie den Körperteil nennen, verwenden Sie ein Possessivpronomen (mijn, je, zijn) und kein Reflexivpronomen. Nennen Sie ihn nicht, steht das Reflexivpronomen. Achtung: je kann „dein“ (je gezicht) oder „dich“ (wast je) bedeuten.'
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_ander:
    title: Jemand anderes oder man selbst
    gloss: Lotte wäscht das Auto. Lotte wäscht sich. Er rasiert seinen Bart. Er rasiert sich.
    note: Zich steht nur, wenn Subjekt und Objekt dieselbe Person sind. Ein anderes Objekt (de auto, zijn baard) steht ohne zich.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.altijd_zich:
    title: Immer reflexiv
    gloss: sich irren / sich langweilen
    note: In diesen Bedeutungen stehen die beiden Verben immer mit zich (vervelen kann auch „jemanden nerven“ bedeuten, aber nicht in dieser Lektion). Das Pronomen gehört zum Verb.
    example_gloss:
    - Entschuldigung, ich irre mich.
    - Er langweilt sich heute.
    - Ich langweile mich.
    - Du irrst dich nicht.
    - Wir langweilen uns nie.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_voelen_pijn:
    title: Voelen mit und ohne me
    gloss: Ich fühle mich krank. Ich spüre den Schmerz.
    note: Voelen ist reflexiv, wenn es beschreibt, wie es Ihnen geht (ik voel me ziek). Es ist nicht reflexiv, wenn man etwas spürt, zum Beispiel de pijn.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_zelf:
    title: Betonung mit -zelf
    gloss: Ich wasche mich selbst. Du wäschst dich selbst. Er wäscht sich selbst.
    note: Hängen Sie -zelf nur zur Betonung an, zum Beispiel wenn das sonst jemand anderes macht. In normalen Sätzen genügen me, je und zich.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.ontspannen:
    title: Entspannen und der Friseur
    gloss: sich entspannen / schneiden / das Bad / warm
    note: Zich ontspannen ist reflexiv wie die anderen Verben in dieser Lektion.
    example_gloss:
    - Ich entspanne mich in einem warmen Bad.
    - Der Friseur schneidet mir die Haare.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.volgorde_woorden:
    title: Reihenfolge und Zeit
    gloss: zuerst / dann / danach / Samstag / das Wochenende / warum / nie
    note: Mit eerst, dan und daarna erzählen Sie eine kurze Routine der Reihe nach.
    example_gloss:
    - Zuerst rasiere ich mich.
    - Dann gehe ich zum Friseur.
    - Danach bin ich zu Hause.
    - Am Samstag gehe ich zum Friseur.
    - Am Wochenende entspanne ich mich.
    - Warum beeilt er sich?
    - Mir ist nie langweilig.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_vraag:
    title: Fragen mit reflexivem Verb
    gloss: Fühlst du dich gut? Beeilt er sich? Langweilst du dich? Warum beeilt er sich?
    note: 'In einer Ja/Nein-Frage steht zuerst das Verb, dann das Subjekt, dann das Reflexivpronomen: voel jij je. Bei einem Fragewort (waarom) steht zuerst das Fragewort, dann das Verb. Steht jij hinter dem Verb, entfällt die Endung -t (jij voelt, aber voel jij).'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_voorop:
    title: Eine Zeitangabe am Satzanfang
    gloss: Danach entspanne ich mich. Zuerst rasiere ich mich. Heute fühle ich mich müde.
    note: 'Steht eine Zeitangabe am Satzanfang, bleibt das Verb an zweiter Stelle und das Subjekt folgt danach. Das Reflexivpronomen folgt weiterhin auf das Subjekt: ontspan ik me.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_bijzin:
    title: Reflexivpronomen nach dat
    gloss: Ich denke, dass er sich beeilt. Ich denke, dass du dich irrst.
    note: 'Nach dat folgt auf das Subjekt das Reflexivpronomen, und das konjugierte Verb steht am Ende: dat hij zich haast.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.bevel:
    title: Jemandem sagen, was er tun soll
    gloss: Beeil dich! Entspann dich!
    note: Im Imperativ mit jij hat das Verb kein -t, und das Reflexivpronomen je folgt darauf.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.scenario:
    title: Eine Samstagsroutine
    gloss: Am Samstag gehe ich zum Friseur. Der Friseur schneidet mir die Haare. Danach entspanne ich mich zu Hause.
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.reading:
    title: Noors Nachricht
    gloss: Hallo Lotte und Omar, diese Woche fühle ich mich nicht gut. Ich bin müde und habe Kopfschmerzen. Jeden Morgen beeile ich mich auf dem Weg zur Arbeit. Heute Abend entspanne ich mich in einem warmen Bad. Fühlt ihr euch auch müde? Liebe Grüße, Noor
    note: Suchen Sie jedes reflexive Verb und das dazugehörige Pronomen.
    glosses:
      deze: das
      week: Woche
      ook: auch
      groetjes: liebe Grüße
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.extra:
    title: Wörter aus der Nachricht
    gloss: diese Woche / auch / liebe Grüße
    note: Groetjes ist ein freundlicher Abschluss für eine Nachricht an Freunde.
    example_gloss:
    - Diese Woche bin ich müde.
    - Fühlst du dich auch müde?
    - Liebe Grüße, Lotte
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt1:
    title: Lotte fragt Omar, wie er sich fühlt
    gloss: 'Lotte: Hallo Omar, wie fühlst du dich heute?'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt2:
    title: Omar sagt, dass er müde ist
    gloss: 'Omar: Ich fühle mich müde. Jeden Morgen beeile ich mich auf dem Weg zur Arbeit.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt3:
    title: Lotte gibt einen Rat
    gloss: 'Lotte: Entspann dich dann am Wochenende!'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt4:
    title: Omar macht einen Plan
    gloss: 'Omar: Ja, am Samstag gehe ich zum Friseur. Danach entspanne ich mich zu Hause.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt5:
    title: Lotte fragt nach Langeweile
    gloss: 'Lotte: Langweilst du dich dann nicht?'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt6:
    title: Omar antwortet
    gloss: 'Omar: Nein, ich langweile mich nie.'
exercises:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise01.kies_moe:
    instruction: Wählen Sie den richtigen niederländischen Satz.
    correct_option: Ik voel me moe.
    distractors:
    - Ik voel moe.
    - Ik ben me moe.
    - Ik voel je moe.
    accepted_answers:
    - value: Ik voel me moe.
      status: correct
    feedback: 'Voelen braucht das Reflexivpronomen *me*, wenn es den eigenen Zustand beschreibt: *Ik voel me moe*.'
    prompt_blocks:
    - Ich fühle mich müde.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise02.kies_blij:
    instruction: Wählen Sie den richtigen niederländischen Satz.
    correct_option: Omar voelt zich blij.
    distractors:
    - Omar voelt me blij.
    - Omar voelt ons blij.
    - Omar voelt je blij.
    accepted_answers:
    - value: Omar voelt zich blij.
      status: correct
    feedback: Bei hij, zij oder einem Namen lautet das Reflexivpronomen *zich*.
    prompt_blocks:
    - Omar fühlt sich glücklich.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise03.match_gevoelens:
    instruction: Ordnen Sie jedem niederländischen Wort seine deutsche Bedeutung zu.
    accepted_answers:
    - value:
      - left: ziek
        right: krank
      - left: moe
        right: müde
      - left: blij
        right: glücklich
      - left: boos
        right: wütend
      - left: bang
        right: ängstlich
      - left: rustig
        right: ruhig
      status: correct
    feedback: Das sind die Wörter für Gesundheit und Gefühle, die Sie nach *voelen* verwenden.
    pairs:
    - left: ziek
      right: krank
    - left: moe
      right: müde
    - left: blij
      right: glücklich
    - left: boos
      right: wütend
    - left: bang
      right: ängstlich
    - left: rustig
      right: ruhig
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise04.volgorde_hoe:
    instruction: 'Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen: „Wie fühlst du dich?“'
    correct_option: Hoe voel je je
    accepted_answers:
    - value: Hoe voel je je
      status: correct
    feedback: '*Hoe voel je je?* = Wie fühlst du dich?'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise05.vul_ons:
    instruction: Ergänzen Sie das Reflexivpronomen für wij.
    correct_option: ons
    accepted_answers:
    - value: ons
      status: correct
    feedback: Das Reflexivpronomen für *wij* ist *ons*.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise06.vertaal_hoe:
    instruction: Übersetzen Sie ins Niederländische.
    accepted_answers:
    - value: Hoe voel je je?
      status: correct
    - value: Hoe voel je je
      status: correct
    - value: Hoe voel jij je?
      status: correct
    - value: Hoe voel jij je
      status: correct
    feedback: '*Hoe voel je je?* oder, mit zusätzlicher Betonung, *Hoe voel jij je?*'
    prompt_blocks:
    - Wie fühlst du dich?
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise07.schrijf_ziek:
    instruction: Schreiben Sie den verlangten niederländischen Satz (mit zich voelen).
    correct_option: Hij voelt zich ziek.
    accepted_answers:
    - value: Hij voelt zich ziek.
      status: correct
    - value: Hij voelt zich ziek
      status: correct
    feedback: '*Hij voelt zich ziek.*'
    prompt_blocks:
    - 'Schreiben Sie auf Niederländisch: Er fühlt sich krank.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise01.kies_haasten:
    instruction: Wählen Sie den richtigen niederländischen Satz.
    correct_option: Wij haasten ons.
    distractors:
    - Wij haasten me.
    - Wij haasten je.
    - Wij haasten zich.
    accepted_answers:
    - value: Wij haasten ons.
      status: correct
    feedback: Das Reflexivpronomen für *wij* ist *ons*, und das Verb hat die Endung *-en*.
    prompt_blocks:
    - Wir beeilen uns.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise02.kies_wast:
    instruction: Wählen Sie den richtigen niederländischen Satz.
    correct_option: Noor wast zich.
    distractors:
    - Noor was zich.
    - Noor wassen zich.
    - Noor wast zij.
    accepted_answers:
    - value: Noor wast zich.
      status: correct
    feedback: 'Ein Name ist 3. Person Singular: *wast* + *zich*.'
    prompt_blocks:
    - Noor wäscht sich.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise03.match_rijtje:
    instruction: Ordnen Sie jedem niederländischen Satz seine deutsche Bedeutung zu.
    accepted_answers:
    - value:
      - left: Ik haast me
        right: ich beeile mich
      - left: Jij haast je
        right: du beeilst dich (eine Person)
      - left: Hij haast zich
        right: er beeilt sich
      - left: Wij haasten ons
        right: wir beeilen uns
      - left: Jullie haasten je
        right: ihr beeilt euch (mehrere Personen)
      - left: Zij haasten zich
        right: sie beeilen sich
      status: correct
    feedback: Jedes Subjekt hat sein eigenes Reflexivpronomen; jij und jullie verwenden beide *je*.
    pairs:
    - left: Ik haast me
      right: ich beeile mich
    - left: Jij haast je
      right: du beeilst dich (eine Person)
    - left: Hij haast zich
      right: er beeilt sich
    - left: Wij haasten ons
      right: wir beeilen uns
    - left: Jullie haasten je
      right: ihr beeilt euch (mehrere Personen)
    - left: Zij haasten zich
      right: sie beeilen sich
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise04.volgorde_ochtend:
    instruction: 'Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen: „Wir beeilen uns jeden Morgen.“'
    correct_option: Wij haasten ons elke ochtend
    accepted_answers:
    - value: Wij haasten ons elke ochtend
      status: correct
    - value: Elke ochtend haasten wij ons
      status: correct
    feedback: 'Beide Reihenfolgen sind möglich: Die Zeitangabe darf vorn stehen, dann steht das Verb vor dem Subjekt.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise05.vul_je:
    instruction: Ergänzen Sie das Reflexivpronomen für jij.
    correct_option: je
    accepted_answers:
    - value: je
      status: correct
    feedback: Das Reflexivpronomen für *jij* ist *je*.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise06.vertaal_wassen:
    instruction: 'Übersetzen Sie ins Niederländische (mit reflexivem Verb: sich waschen).'
    accepted_answers:
    - value: Ik was me elke ochtend.
      status: correct
    - value: Ik was me elke ochtend
      status: correct
    - value: Elke ochtend was ik me.
      status: correct
    - value: Elke ochtend was ik me
      status: correct
    feedback: Das Niederländische braucht hier *me*, ähnlich wie das Deutsche „mich“ in „Ich wasche mich“.
    prompt_blocks:
    - Ich wasche mich jeden Morgen.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise07.schrijf_scheren:
    instruction: Schreiben Sie den verlangten niederländischen Satz (mit zich scheren).
    correct_option: Hij scheert zich elke ochtend.
    accepted_answers:
    - value: Hij scheert zich elke ochtend.
      status: correct
    - value: Hij scheert zich elke ochtend
      status: correct
    - value: Elke ochtend scheert hij zich.
      status: correct
    - value: Elke ochtend scheert hij zich
      status: correct
    feedback: '*Hij scheert zich elke ochtend.*'
    prompt_blocks:
    - 'Schreiben Sie auf Niederländisch: Er rasiert sich jeden Morgen.'
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise01.kies_handen:
    instruction: Wählen Sie den richtigen niederländischen Satz.
    correct_option: Ik was mijn handen.
    distractors:
    - Ik was me mijn handen.
    - Ik was zich handen.
    - Ik was handen mijn.
    accepted_answers:
    - value: Ik was mijn handen.
      status: correct
    feedback: Wenn Sie den Körperteil nennen, verwenden Sie *mijn* und kein Reflexivpronomen.
    prompt_blocks:
    - Ich wasche mir die Hände.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise02.kies_auto:
    instruction: Wählen Sie den richtigen niederländischen Satz.
    correct_option: Lotte wast de auto.
    distractors:
    - Lotte wast zich de auto.
    - Lotte wast zich auto.
    - Lotte wast me de auto.
    accepted_answers:
    - value: Lotte wast de auto.
      status: correct
    feedback: Das Objekt ist das Auto, nicht Lotte selbst, also steht kein *zich*.
    prompt_blocks:
    - Lotte wäscht das Auto.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise03.match_contrast:
    instruction: Ordnen Sie jedem niederländischen Satz seine deutsche Bedeutung zu.
    accepted_answers:
    - value:
      - left: Ik was mijn handen
        right: Ich wasche mir die Hände
      - left: Ik was me
