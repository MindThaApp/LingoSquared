teaching:
  nl.a2.unit73.lesson01.teach.vacature:
    title: Stellenangebot
    gloss: die Stelle / das Stellenangebot
    note: 'Ein Substantiv mit dem Artikel de: de vacature.'
    example_gloss: Nina sieht online eine Stellenanzeige.
  nl.a2.unit73.lesson01.teach.solliciteren_voor:
    title: Sich auf eine Stelle bewerben
    gloss: Ich möchte mich auf diese Stelle bewerben.
    note: Wil graag macht die Bitte höflicher; solliciteren voor ist die feste Verbindung aus Verb und Präposition für „sich auf etwas bewerben“.
  nl.a2.unit73.lesson01.teach.kantoor_bloem_zoekt:
    title: Die Firma nennt ihren Bedarf
    gloss: Kantoor Bloem sucht einen Büromitarbeiter.
    note: Zoekt (von zoeken, „suchen“) ist das übliche Verb, mit dem eine Stellenanzeige eine freie Stelle nennt.
  nl.a2.unit73.lesson02.teach.sollicitatiegesprek:
    title: Vorstellungsgespräch
    gloss: das Vorstellungsgespräch
    note: 'Ein Substantiv mit dem Artikel het: het sollicitatiegesprek, wörtlich „Bewerbungsgespräch“.'
    example_gloss: Das Vorstellungsgespräch ist nächste Woche.
  nl.a2.unit73.lesson02.teach.afspraak_maken:
    title: Um einen Termin bitten
    gloss: Kann ich einen Termin für ein Vorstellungsgespräch vereinbaren?
    note: Een afspraak maken voor folgt demselben Muster zum Vereinbaren eines Termins wie in Einheit 46.
  nl.a2.unit73.lesson02.teach.natuurlijk_dinsdag:
    title: Eine Zeit vereinbaren
    gloss: Natürlich, können Sie am Dienstag um zehn Uhr vorbeikommen?
    note: Langskomen („vorbeikommen“) ist das trennbare Verb aus dem Telefonat mit der Wohnungsbaugesellschaft in Einheit 28.
  nl.a2.unit73.lesson03.teach.ervaring:
    title: Erfahrung
    gloss: die Erfahrung
    note: 'Ein Substantiv mit dem Artikel de: de ervaring.'
    example_gloss: Ich habe Erfahrung als ehrenamtlicher Helfer.
  nl.a2.unit73.lesson03.teach.vaardigheid:
    title: Fähigkeit
    gloss: die Fähigkeit
    note: 'Ein Substantiv mit dem Artikel de: de vaardigheid.'
    example_gloss: Tippen ist eine wichtige Fähigkeit.
  nl.a2.unit73.lesson03.teach.ervaring_bibliotheek:
    title: Konkrete Erfahrung nennen
    gloss: Ich habe Erfahrung als ehrenamtliche Helferin in der Bibliothek.
    note: Als vrijwilliger („als ehrenamtlicher Helfer“) nennt die Rolle; in de bibliotheek greift die Bibliothek aus Einheit 47 wieder auf.
  nl.a2.unit73.lesson03.teach.goede_vaardigheden:
    title: Allgemeine Fähigkeiten nennen
    gloss: Ich habe gute Fähigkeiten.
    note: Vaardigheden ist der Plural von vaardigheid.
  nl.a2.unit73.lesson04.teach.beschikbaar:
    title: Verfügbar
    gloss: verfügbar
    note: Ein Adjektiv, das sich vor und nach zijn nicht verändert.
    example_gloss: Nina ist ab Montag verfügbar.
  nl.a2.unit73.lesson04.teach.werktijden:
    title: Arbeitszeiten
    gloss: die Arbeitszeiten
    note: 'Ein Nomen im Plural: de werktijden wird immer im Plural verwendet.'
    example_gloss: Wie sind die Arbeitszeiten?
  nl.a2.unit73.lesson04.teach.beschikbaar_dagen:
    title: Konkrete Verfügbarkeit angeben
    gloss: Ich bin montags, mittwochs und freitags verfügbar.
    note: Op + eine Aufzählung von Tagen gibt an, an welchen Tagen Sie Zeit haben.
  nl.a2.unit73.lesson04.teach.werktijden_precies:
    title: Eine klärende Nachfrage stellen
    gloss: Wie sind die Arbeitszeiten genau?
    note: Precies (genau) macht die Frage konkreter – eine natürliche Nachfrage im Vorstellungsgespräch.
  nl.a2.unit73.lesson05.teach.vacature_tekst:
    title: Eine Stellenanzeige lesen
    gloss: 'Kantoor Bloem sucht einen Verwaltungsmitarbeiterin. Erfahrung im Kundenkontakt ist von Vorteil. Arbeitszeiten: Montag, Mittwoch und Freitag, von neun bis fünf Uhr. Rufen Sie für ein Vorstellungsgespräch an.'
    note: Achten Sie auf die Berufsbezeichnung, die gewünschte Erfahrung sowie die Tage und Uhrzeiten.
    glosses:
      zoekt: sucht (von zoeken)
      administratief: administrativ, Verwaltungs-
      medewerker: Assistent / Mitarbeiter
      Ervaring: Erfahrung
      klantcontact: der Kundenkontakt
      pre: ein Plus / ein Vorteil (niederländische Stellenanzeigen-Wendung)
      Werktijden: Arbeitszeiten
      maandag: Montag
      woensdag: Mittwoch
      vrijdag: Freitag
      negen: neun
      tot: bis
      vijf: fünf
      uur: Stunde / Uhr
      Bel: rufen Sie an (Imperativ von bellen)
      sollicitatiegesprek: Vorstellungsgespräch
  nl.a2.unit73.lesson05.teach.ervaring_klantcontact:
    title: Passende Erfahrung nennen
    gloss: Ich habe Erfahrung im Kundenkontakt.
    note: Klantcontact (Kundenkontakt) greift genau das Wort aus der Stellenanzeige auf.
  nl.a2.unit73.lesson06.teach.jansen_greet:
    title: Frau Jansen begrüßt Nina
    gloss: 'Frau Jansen: Guten Morgen, willkommen bei Kantoor Bloem. Erzählen Sie doch mal von Ihrer Erfahrung.'
    note: Vertelt u eens over... ist eine übliche förmliche Art, eine Frage im Vorstellungsgespräch einzuleiten.
  nl.a2.unit73.lesson06.teach.nina_ervaring:
    title: Nina beschreibt ihre Erfahrung
    gloss: 'Nina: Guten Morgen. Ich habe Erfahrung als Freiwillige in der Bibliothek. Dort hatte ich viel Kundenkontakt.'
    note: Had ist das Präteritum von hebben und beschreibt hier einen abgeschlossenen Zeitraum der ehrenamtlichen Arbeit.
  nl.a2.unit73.lesson06.teach.jansen_beschikbaar:
    title: Frau Jansen fragt nach der Verfügbarkeit
    gloss: 'Frau Jansen: Schön. Sind Sie montags, mittwochs und freitags verfügbar?'
    note: Entspricht fast genau dem Satz aus einer früheren Lektion, jetzt als Frage.
  nl.a2.unit73.lesson06.teach.nina_dat_kan:
    title: Nina bestätigt und fragt nach
    gloss: 'Nina: Ja, das geht. Wie sind die Arbeitszeiten genau?'
    note: Dat kan (das geht / das ist möglich) ist eine natürliche Art, die Verfügbarkeit zu bestätigen, bevor man nachfragt.
  nl.a2.unit73.lesson06.teach.jansen_uren_contact:
    title: Frau Jansen antwortet und beendet das Gespräch
    gloss: 'Frau Jansen: Von neun bis fünf Uhr. Wir melden uns noch diese Woche bei Ihnen.'
    note: Contact met u op nemen verwendet wieder das trennbare Verb, wie im Telefonat mit der Wohnungsbaugesellschaft in Unit 28.
  nl.a2.unit73.lesson06.teach.nina_dank_gesprek:
    title: Nina bedankt sich bei Frau Jansen
    gloss: 'Nina: Vielen Dank für das Gespräch.'
    note: Dank u wel ist der förmliche Dank, der im gesamten A2-Kurs verwendet wird.
  nl.a2.unit73.lesson06.teach.summary_grammar:
    title: Das Gespräch zusammenfassen
    gloss: Nina hat sich bei Kantoor Bloem beworben. Sie hat Erfahrung als Freiwillige in der Bibliothek.
    note: Heeft ... gesolliciteerd ist das Perfekt von solliciteren (gesolliciteerd ist das Partizip Perfekt); zij ist das Personalpronomen „sie“.
