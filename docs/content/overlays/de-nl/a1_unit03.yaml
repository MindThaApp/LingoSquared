teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag:
    title: Montag bis Mittwoch
    gloss: Montag, Dienstag, Mittwoch
    note: Niederländische Wochentage beginnen normalerweise mit einem Kleinbuchstaben, anders als im Deutschen.
    example_gloss:
    - Heute ist Montag.
    - Heute ist Dienstag.
    - Heute ist Mittwoch.
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag:
    title: Donnerstag, Freitag
    gloss: Donnerstag, Freitag
    note: Donderdag und vrijdag setzen die Reihe der Wochentage fort, ebenfalls kleingeschrieben.
    example_gloss:
    - Heute ist Donnerstag.
    - Das Sprachcafé ist am Freitag.
  nl.a1.unit03.lesson01.teach.zaterdag_zondag:
    title: Samstag, Sonntag
    gloss: Samstag, Sonntag
    note: Zaterdag und zondag sind die Wochenendtage.
    example_gloss:
    - Heute ist Samstag.
    - Heute ist Sonntag.
  nl.a1.unit03.lesson01.teach.ask_day:
    title: Nach dem Wochentag fragen
    gloss: Welcher Tag ist heute?
    note: Welke dag ... fragt nach dem Wochentag, nicht nach dem Kalenderdatum.
  nl.a1.unit03.lesson01.teach.today_wednesday:
    title: Den heutigen Wochentag nennen
    gloss: Heute ist Mittwoch.
    note: Der Wochentag bleibt auch im Satz kleingeschrieben.
  nl.a1.unit03.lesson01.teach.lowercase_days:
    title: Wochentage kleinschreiben
    gloss: 'Tage werden normalerweise nicht großgeschrieben: Montag, Freitag.'
    note: Anders als im Deutschen schreibt man niederländische Wochentage nur am Satzanfang groß.
  nl.a1.unit03.lesson02.teach.jan_mar:
    title: Januar bis März
    gloss: Januar, Februar, März
    note: Niederländische Monatsnamen beginnen normalerweise mit Kleinbuchstaben, anders als im Deutschen.
    example_gloss:
    - Ich habe im Januar Geburtstag.
    - Ich lerne im Februar Niederländisch.
    - Mein Geburtstag ist im März.
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: April bis Juni
    gloss: April, Mai, Juni
    note: Das niederländische mei ist Mai; juni ist Juni.
    example_gloss:
    - Ich lerne im April Niederländisch.
    - Ich habe im Mai Geburtstag.
    - Ich lerne im Juni Niederländisch.
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: Juli bis September
    gloss: Juli, August, September
    note: 'Die niederländischen Wörter juli und juni unterscheiden sich nur in einem Buchstaben: l oder n.'
    example_gloss:
    - Ich habe im Juli Geburtstag.
    - Ich lerne im August Niederländisch.
    - Ich habe im September Geburtstag.
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: Oktober bis Dezember
    gloss: Oktober, November, Dezember
    note: Das niederländische oktober wird mit k geschrieben.
    example_gloss:
    - Ich lerne im Oktober Niederländisch.
    - Ich habe im November Geburtstag.
    - Ich lerne im Dezember Niederländisch.
  nl.a1.unit03.lesson02.teach.year:
    title: Jahr
    gloss: das Jahr
    note: Jaar ist das Wort für ein Kalenderjahr.
    example_gloss: Ich lerne dieses Jahr Niederländisch.
  nl.a1.unit03.lesson02.teach.lowercase_months:
    title: Monatsnamen kleinschreiben
    gloss: 'Monate werden normalerweise nicht großgeschrieben: April, September.'
    note: Anders als im Deutschen schreibt man niederländische Monatsnamen nur am Satzanfang groß.
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: Erster bis vierter
    gloss: '1–4: der erste, der zweite, der dritte, der vierte'
    note: Eerste, tweede und derde lernt man als feste Formen; vierde wird aus vier gebildet.
    example_gloss:
    - Es ist der erste April.
    - Es ist der zweite April.
    - Es ist der dritte April.
    - Es ist der vierte April.
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: Fünfter bis achter
    gloss: '5–8: der fünfte, der sechste, der siebte, der achte'
    note: Diese Datumsformen heißen vijfde, zesde, zevende und achtste.
    example_gloss:
    - Es ist der fünfte April.
    - Es ist der sechste April.
    - Es ist der siebte April.
    - Es ist der 8. April 2026.
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: Neunter bis zwölfter
    gloss: '9–12: der neunte, der zehnte, der elfte, der zwölfte'
    note: Diese Formen decken die Daten am Monatsanfang ab, die später in der Einheit vorkommen.
    example_gloss:
    - Es ist der neunte April.
    - Es ist der zehnte April.
    - Es ist der elfte April.
    - Es ist der zwölfte April.
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: Dreizehnter bis neunzehnter
    gloss: '13–19: der dreizehnte, der vierzehnte, der fünfzehnte, der sechzehnte, der siebzehnte, der achtzehnte, der neunzehnte'
    note: Diese ausgeschriebenen Ordnungszahlen für Tage enden auf -de.
    example_gloss:
    - Es ist der dreizehnte April.
    - Es ist der vierzehnte April.
    - Es ist der fünfzehnte April.
    - Es ist der sechzehnte April.
    - Es ist der siebzehnte April.
    - Es ist der achtzehnte April.
    - Es ist der neunzehnte April.
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: Zwanzigster bis vierundzwanzigster
    gloss: '20–24: der zwanzigste, der einundzwanzigste, der zweiundzwanzigste, der dreiundzwanzigste, der vierundzwanzigste'
    note: Ab twintig aufwärts enden diese Ordnungszahlen auf -ste und werden zusammengeschrieben.
    example_gloss:
    - Es ist der zwanzigste April.
    - Das Buch muss am einundzwanzigsten April zurück.
    - Es ist der zweiundzwanzigste April.
    - Es ist der dreiundzwanzigste April.
    - Es ist der vierundzwanzigste April.
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth:
    title: Fünfundzwanzigster bis Neunundzwanzigster
    gloss: '25–29: der fünfundzwanzigste, der sechsundzwanzigste, der siebenundzwanzigste, der achtundzwanzigste, der neunundzwanzigste'
    note: Diese zusammengesetzten Ordnungszahlen enden auf -ste und werden zusammengeschrieben.
    example_gloss:
    - Es ist der fünfundzwanzigste April.
    - Es ist der sechsundzwanzigste April.
    - Es ist der siebenundzwanzigste April.
    - Es ist der achtundzwanzigste April.
    - Es ist der neunundzwanzigste April.
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: Dreißigster und einunddreißigster
    gloss: '30–31: der dreißigste, der einunddreißigste'
    note: Das sind die beiden letzten möglichen Tageszahlen eines Monats.
    example_gloss:
    - Es ist der dreißigste April.
    - Es ist der einunddreißigste Dezember.
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: Ein Datum mit Ordnungszahl sagen
    gloss: 3. April — der dritte April
    note: Diese Einheit führt eine Ordnungszahl ein, wenn die Tageszahl ausgesprochen wird; im Niederländischen steht der Tag vor dem Monat.
  nl.a1.unit03.lesson03.teach.on_date:
    title: An einem Datum
    gloss: am 3. April — am dritten April
    note: Bei einer geschriebenen Ziffer sagt man op 3 april; ist die Ordnungszahl ausgeschrieben, sagt man op de derde april.
  nl.a1.unit03.lesson04.teach.ask_date:
    title: Nach dem Kalenderdatum fragen
    gloss: Welches Datum ist heute?
    note: Welke datum ... fragt ausdrücklich nach dem Kalenderdatum.
  nl.a1.unit03.lesson04.teach.ask_which_date:
    title: Nach dem Tag im Monat fragen
    gloss: Den Wievielten haben wir heute?
    note: De hoeveelste ... ist eine gängige, umgangssprachliche Art, nach der Tageszahl zu fragen.
  nl.a1.unit03.lesson04.teach.date_answer:
    title: Ein vollständiges Datum nennen
    gloss: Es ist der 3. April 2026.
    note: Im Niederländischen steht das Datum wie im Deutschen in der Reihenfolge Tag–Monat–Jahr, aber april wird kleingeschrieben.
  nl.a1.unit03.lesson04.teach.date_words:
    title: Den Tag als Ordnungszahl nennen
    gloss: Es ist der dritte April.
    note: 'Die ausgeschriebene Ordnungszahl steht mit de: de derde april.'
  nl.a1.unit03.lesson04.teach.written_order:
    title: Reihenfolge Tag–Monat–Jahr
    gloss: 'Tag–Monat–Jahr: 3. April 2026 oder 3-4-2026'
    note: 'Auch die Zahlenform steht in der Reihenfolge Tag–Monat–Jahr: 3-4-2026 bedeutet 3. April 2026.'
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: Wochentag und Datum verbinden
    gloss: Heute ist Freitag, der 10. April.
    note: Mitten im Satz werden vrijdag und april kleingeschrieben (im Deutschen schreibt man beide groß). Der 10. April 2026 ist tatsächlich ein Freitag.
  nl.a1.unit03.lesson05.teach.when:
    title: Wann
    gloss: wann
    note: Wanneer fragt danach, zu welcher Uhrzeit oder an welchem Datum etwas stattfindet.
    example_gloss: Wann ist das Sprachcafé?
  nl.a1.unit03.lesson05.teach.book:
    title: Buch
    gloss: das Buch
    note: Boek meint hier ein Bibliotheksbuch.
    example_gloss: Ich habe das Buch.
  nl.a1.unit03.lesson05.teach.due_date:
    title: Rückgabedatum
    gloss: das Rückgabedatum
    note: Eine inleverdatum ist das Datum, bis zu dem etwas zurückgegeben werden muss.
    example_gloss: Was ist das Rückgabedatum des Buches?
  nl.a1.unit03.lesson05.teach.ask_due:
    title: Fragen, wann ein Buch fällig ist
    gloss: Wann muss das Buch zurück?
    note: Moet ... terug ist eine natürliche, einfache Art zu fragen, wann ein geliehener Gegenstand zurückgegeben werden muss.
  nl.a1.unit03.lesson05.teach.due_answer:
    title: Das Rückgabedatum nennen
    gloss: Am 21. April.
    note: Die Kurzantwort besteht aus op, der Tageszahl und dem kleingeschriebenen Monat.
  nl.a1.unit03.lesson05.teach.due_words:
    title: Das Rückgabedatum in Worten nennen
    gloss: Das Buch muss am einundzwanzigsten April zurück.
    note: Bei der ausgeschriebenen Ordnungszahl steht de nach op.
  nl.a1.unit03.lesson05.teach.label:
    title: Ein Rückgabe-Etikett lesen
    gloss: 'Rückgabedatum: 21-4-2026'
    note: Dieses Etikett mit Zahlen folgt der Reihenfolge Tag–Monat–Jahr.
  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: Lotte fragt nach dem Wochentag
    gloss: 'Lotte: Welcher Tag ist heute? Omar: Es ist Mittwoch.'
    note: Die Antwort nennt einen Wochentag.
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: Lotte fragt nach dem Datum
    gloss: 'Lotte: Und welches Datum ist es? Omar: Es ist der 8. April 2026.'
    note: Die gesprochene niederländische Antwort verwendet die Ordnungszahl de achtste; der 8. April 2026 ist tatsächlich ein Mittwoch, passend zur vorigen Äußerung.
  nl.a1.unit03.lesson06.teach.next:
    title: Nächste
    gloss: nächste
    note: Volgende bezeichnet das nächste Mal.
    example_gloss: Wann ist das nächste Sprachcafé?
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: Nach dem nächsten Treffen fragen
    gloss: 'Lotte: Wann ist das nächste Sprachcafé? Omar: Am Freitag, dem 10. April.'
    note: Die Antwort kombiniert op, einen kleingeschriebenen Wochentag, die Tageszahl und einen kleingeschriebenen Monat. Der 10. April 2026 ist tatsächlich ein Freitag, zwei Tage nach dem 8.
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: Das Gespräch beenden
    gloss: 'Lotte: Gut, bis Freitag! Omar: Bis dann!'
    note: Tot vrijdag nennt den Tag des nächsten Treffens.
