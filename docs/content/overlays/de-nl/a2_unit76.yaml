teaching:
  nl.a2.unit76.lesson01.teach.rooster:
    title: Das Kinoprogramm
    gloss: der Stundenplan/Dienstplan
    note: '*Het rooster* ist ein Neutrum (het) und bezeichnet einen Dienst- oder Stundenplan.'
    example_gloss: Ich schaue jede Woche auf meinen Dienstplan.
  nl.a2.unit76.lesson01.teach.maandag_woensdag:
    title: Aktivitäten an zwei verschiedenen Tagen nennen
    gloss: Montags arbeite ich, und mittwochs habe ich einen Kurs.
    note: '*Op* + Wochentag ist im Niederländischen die übliche Art, einen bestimmten Tag auszudrücken; im Deutschen steht dafür oft „am“ oder die Endung „-s“ (am Montag, montags).'
  nl.a2.unit76.lesson01.teach.wat_doe_je:
    title: Fragen, was jemand normalerweise unter der Woche macht
    gloss: Was machst du normalerweise unter der Woche?
    note: '*Door de week* (unter der Woche, wörtlich „durch die Woche“) bezeichnet die Wochentage insgesamt, im Gegensatz zu *het weekend*.'
  nl.a2.unit76.lesson02.teach.volgorde:
    title: Die Reihenfolge
    gloss: die Reihenfolge
    note: '*De volgorde* ist ein de-Wort und bezeichnet die Reihenfolge, in der Dinge geschehen.'
    example_gloss: Die Reihenfolge meines Tages ist immer gleich.
  nl.a2.unit76.lesson02.teach.eerst_daarna:
    title: Abläufe mit eerst und daarna ausdrücken
    gloss: Zuerst arbeite ich, danach gehe ich Sport machen.
    note: '*Eerst* (zuerst) und *daarna* (danach) sind die beiden häufigsten Wörter, um eine Reihenfolge auszudrücken.'
  nl.a2.unit76.lesson02.teach.ten_slotte:
    title: Abläufe mit ten slotte ausdrücken
    gloss: Zum Schluss koche ich etwas zum Abendessen.
    note: '*Ten slotte* (zum Schluss) beendet eine Abfolge, die mit *eerst* beginnt und mit *daarna* weitergeführt wird.'
  nl.a2.unit76.lesson03.teach.doordeweekse_dag:
    title: Der Wochentag
    gloss: der Wochentag
    note: '*De doordeweekse dag* ist eine Wortgruppe mit de-Wort und steht im Gegensatz zu *het weekend*.'
    example_gloss: An einem Wochentag stehe ich früh auf.
  nl.a2.unit76.lesson03.teach.vroeg_op_uitslapen:
    title: Wochentage und Wochenende gegenüberstellen
    gloss: Unter der Woche stehe ich früh auf, aber am Wochenende schlafe ich aus.
    note: '*Uitslapen* (ausschlafen) ist ein trennbares Verb; *uit* rückt ans Ende des Satzes, ähnlich wie bei „schlafen … aus“ im Deutschen.'
  nl.a2.unit76.lesson03.teach.wat_is_verschil:
    title: Nach dem Unterschied fragen
    gloss: Was ist der Unterschied zwischen deinen Wochentagen und dem Wochenende?
    note: '*Het verschil tussen ... en ...* (der Unterschied zwischen ... und ...) ist das übliche Muster für einen Vergleich.'
  nl.a2.unit76.lesson04.teach.agenda:
    title: Der Terminkalender
    gloss: der Terminkalender
    note: '*De agenda* ist ein de-Wort und bezeichnet den persönlichen Terminkalender.'
    example_gloss: Mein Terminkalender ist diese Woche völlig voll.
  nl.a2.unit76.lesson04.teach.agenda_vol:
    title: Sagen, dass der Terminkalender völlig voll ist
    gloss: Mein Terminkalender ist diese Woche völlig voll.
    note: '*Zit vol* (wörtlich „sitzt voll“) ist die idiomatische Wendung für einen komplett ausgebuchten Terminkalender.'
  nl.a2.unit76.lesson04.teach.geen_vrije_avond:
    title: Sagen, dass man keinen freien Abend hat
    gloss: Ich habe diese Woche keinen freien Abend.
    note: '*Vrije avond* (freier Abend) verwendet *vrije*, die gebeugte Form von *vrij* vor einem *de*-Wort.'
  nl.a2.unit76.lesson04.teach.volgende_week_meer_tijd:
    title: Auf die nächste Woche vorausblicken
    gloss: Nächste Woche habe ich mehr Zeit.
    note: '*Volgende week* (nächste Woche) steht im Gegensatz zu *deze week* (diese Woche), das schon früher in dieser Lektion vorkam.'
  nl.a2.unit76.lesson05.teach.ninas_week:
    title: Lesen über Ninas volle Woche
    gloss: Ninas Woche sieht voll aus. Montags und dienstags arbeitet sie in der Bibliothek. Am Mittwochabend hat sie einen Sprachkurs. Donnerstags macht sie Sport mit Freunden, und freitags kocht sie für ihre Familie. Am Wochenende ruht sie sich aus und liest ein Buch.
    note: '*Ziet er druk uit* (sieht voll aus) gehört zu *eruitzien* (aussehen), einem trennbaren Verb; *er ... uit* umrahmt die Beschreibung.'
    glosses:
      ziet: sieht ... aus (3. Person Singular von zien; Teil von ziet ... uit)
      druk: voll, beschäftigt
      uit: hier trennbare Vorsilbe (ziet...uit = sieht ... aus; rust...uit = ruht ... aus)
      maandag: Montag
      dinsdag: Dienstag
      werkt: arbeitet (3. Person Singular von werken)
      bibliotheek: Bibliothek
      woensdagavond: Mittwochabend
      heeft: hat (3. Person Singular von hebben)
      taalcursus: Sprachkurs
      donderdag: Donnerstag
      sport: macht Sport (3. Person Singular von sporten)
      vrienden: Freunde
      vrijdag: Freitag
      kookt: kocht (3. Person Singular von koken)
      haar: ihre
      familie: Familie
      weekend: Wochenende
      rust: ruht sich aus (3. Person Singular von rusten)
      leest: liest (3. Person Singular von lezen)
      boek: Buch
