course:
  title: Niederländisch A2
  description: Grammatikorientiertes Niederländisch auf A2-Niveau, um einfache Ratschläge zu geben und darauf zu antworten.
  learning_goal: Ratschläge mit je moet, je zou ... moeten, het is beter om ... te und waarom ... niet geben und auf Ratschläge reagieren.
units:
  nl.a2.unit90.goede_raad:
    title: Guter Rat
    description: Einfache Ratschläge zu Gesundheits-, Lern- und Geldproblemen geben und darauf reagieren.
lessons:
  nl.a2.unit90.lesson01.je_moet_rusten:
    title: Du musst dich ausruhen
  nl.a2.unit90.lesson02.je_zou_moeten:
    title: Du solltest
  nl.a2.unit90.lesson03.moet_zou_of_beter:
    title: Müssen, sollten oder besser
  nl.a2.unit90.lesson04.waarom_niet:
    title: Warum nicht?
  nl.a2.unit90.lesson05.bericht_van_lotte:
    title: Eine Nachricht von Lotte
  nl.a2.unit90.lesson06.lotte_en_omar:
    title: Lotte und Omar
teaching:
  nl.a2.unit90.lesson01.teach.gezondheid:
    title: Wörter zur Gesundheit
    gloss: Kopfschmerzen / Arzt / Apotheke / krank / müde
    note: Diese Wörter beschreiben ein kleines Gesundheitsproblem.
    example_gloss:
    - Ich habe Kopfschmerzen.
    - Ich bin krank.
    - Ich bin müde.
  nl.a2.unit90.lesson01.teach.werkwoorden:
    title: Verben für Ratschläge
    gloss: sich ausruhen / schlafen / trinken / gehen / das Wasser
    note: Nach *moet* bleibt das Verb der Handlung im Infinitiv und steht normalerweise am Satzende.
    example_gloss:
    - Ich trinke Wasser.
    - Ich gehe zur Apotheke.
    - Ich schlafe viel.
  nl.a2.unit90.lesson01.teach.gn_je_moet:
    title: Starke Ratschläge mit je moet geben
    gloss: Du musst dich ausruhen. Du musst Wasser trinken. Du musst zum Arzt gehen.
    note: 'Starker, direkter Rat: *je moet* + der Rest des Satzes + der Infinitiv ganz am Ende. *Moeten* ist der Infinitiv; mit *je* wird daraus *moet*.'
  nl.a2.unit90.lesson01.teach.jij:
    title: Je oder jij
    gloss: Du musst dich ausruhen. Du musst dich auch ausruhen.
    note: '*Je* und *jij* bedeuten beide „du“; *jij* ist etwas stärker betont.'
  nl.a2.unit90.lesson01.teach.vraag:
    title: Um Rat fragen
    gloss: Was soll ich tun? (um Rat fragen)
    note: '*Doen* ist der Infinitiv am Satzende.'
  nl.a2.unit90.lesson02.teach.studie:
    title: Wörter zum Lernen
    gloss: Prüfung / Hausaufgaben / lernen / üben / jeden Tag / morgen
    note: '*Leren* kann „lernen“ bedeuten, auch im Sinne von „für eine Prüfung lernen“.'
    example_gloss:
    - Ich habe morgen eine Prüfung.
    - Ich mache meine Hausaufgaben.
  nl.a2.unit90.lesson02.teach.geld:
    title: Wörter rund ums Geld
    gloss: Geld / sparen / ausgeben / weniger / mehr / wenig
    note: Mit diesen Wörtern können Sie über Geldprobleme sprechen.
    example_gloss:
    - Ich habe wenig Geld.
    - Ich möchte mehr sparen.
  nl.a2.unit90.lesson02.teach.gn_zou_moeten:
    title: 'Sanftere Ratschläge geben: je zou ... moeten'
    gloss: Du solltest dich ausruhen. Du solltest Wasser trinken. Du solltest weniger Geld ausgeben.
    note: 'Sanfterer Rat: *je zou* + Rest des Satzes + *moeten* + Infinitiv. *Moeten* und der Infinitiv stehen zusammen am Ende: *moeten drinken*, *moeten uitgeven*.'
  nl.a2.unit90.lesson02.teach.problemen:
    title: Zwei Probleme
    gloss: Ich habe wenig Geld. Ich habe morgen eine Prüfung.
  nl.a2.unit90.lesson03.teach.tijd:
    title: Zeitwörter
    gloss: früh / spät / die Woche / heute / das Bett
    note: Für „ins Bett gehen“ verwendet man *naar bed gaan*.
    example_gloss:
    - Ich gehe heute früh ins Bett.
    - Ich spare jede Woche.
  nl.a2.unit90.lesson03.teach.gn_beter_om:
    title: Het is beter om ... te (Ratschlag)
    gloss: Es ist besser, früh ins Bett zu gehen. Es ist besser, jede Woche zu sparen.
    note: 'Ruhiger, neutraler Rat: *Het is beter om* + Rest des Satzes + *te* + Infinitiv am Ende. Das Wort *te* steht direkt vor dem Infinitiv.'
  nl.a2.unit90.lesson03.teach.gn_contrast:
    title: Drei Arten, einen Rat zu geben
    gloss: Du musst dich ausruhen. Du solltest dich ausruhen. Es ist besser, sich auszuruhen.
    note: 'Drei Stufen des Rats: *je moet* ist stark, *je zou ... moeten* ist weicher, *het is beter om ... te* ist ruhig und neutral. Verwenden Sie die weicheren Formen bei Freunden, wenn Sie sich nicht sicher sind.'
  nl.a2.unit90.lesson03.teach.voorbeelden:
    title: Weitere Beispiele
    gloss: Es ist besser, Wasser zu trinken. Es ist besser, jeden Tag zu üben.
  nl.a2.unit90.lesson04.teach.woorden:
    title: Problem, Rat, Tipp
    gloss: Problem / Rat / Tipp
    note: '*Advies* ist das allgemeine Wort für „Rat“; für einen kleinen Ratschlag sagt man meist *een tip*.'
    example_gloss:
    - Ich habe ein Problem.
    - Das ist ein guter Tipp.
  nl.a2.unit90.lesson04.teach.gn_waarom_niet:
    title: Waarom ... niet? als Rat
    gloss: Warum gehst du nicht zum Arzt? Warum sparst du nicht ein bisschen mehr? Warum übst du nicht jeden Tag?
    note: 'Eine freundliche Art, etwas vorzuschlagen: *Waarom* + Verb + *je* + *niet* + Rest. Das Verb steht direkt nach *waarom*, vor *je*.'
  nl.a2.unit90.lesson04.teach.gn_reageren:
    title: Auf einen Rat reagieren
    gloss: Gute Idee. Das mache ich. Danke für den Tipp.
    note: 'Kurze Antworten auf einen Rat: *Goed idee* (er gefällt Ihnen), *Dat doe ik* (Sie werden es tun), *Bedankt voor de tip* (Sie bedanken sich bei der Person).'
  nl.a2.unit90.lesson04.teach.zin:
    title: Um Hilfe bitten
    gloss: Ich habe ein Problem. Was soll ich tun?
  nl.a2.unit90.lesson05.teach.lezen:
    title: Lottes Rat
    gloss: Hallo Omar, danke für deine Nachricht. Du hast Kopfschmerzen und bist müde. Du musst dich heute ausruhen und viel Wasser trinken. Du solltest auch weniger Kaffee trinken. Es ist besser, früh ins Bett zu gehen. Warum gehst du morgen nicht zum Arzt? Liebe Grüße, Lotte
    note: Lotte antwortet Omar mit allen drei Arten von Rat und einem Vorschlag mit *waarom ... niet?*.
  nl.a2.unit90.lesson06.teach.omar_probleem:
    title: Omar nennt sein Problem
    gloss: 'Omar: Hallo Lotte, ich habe ein Problem. Ich habe Kopfschmerzen.'
  nl.a2.unit90.lesson06.teach.lotte_rusten:
    title: Lotte gibt einen starken Rat
    gloss: 'Lotte: Wie unangenehm! Du musst dich ausruhen und Wasser trinken.'
  nl.a2.unit90.lesson06.teach.omar_idee:
    title: Omar nimmt den Rat an und nennt ein zweites Problem
    gloss: 'Omar: Gute Idee. Ich habe auch wenig Geld.'
  nl.a2.unit90.lesson06.teach.lotte_geld:
    title: Lotte gibt einen weicheren und einen neutralen Rat
    gloss: 'Lotte: Du solltest weniger Geld ausgeben. Es ist besser, jede Woche zu sparen.'
  nl.a2.unit90.lesson06.teach.omar_bedankt:
    title: Omar verspricht es und bedankt sich
    gloss: 'Omar: Das mache ich. Danke für die Tipps!'
  nl.a2.unit90.lesson06.teach.lotte_bed:
    title: Lotte schließt mit einem Vorschlag
    gloss: 'Lotte: Gern geschehen! Warum gehst du nicht früh ins Bett?'
exercises:
