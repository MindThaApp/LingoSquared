    note: 쉼표는 이 관계절이 누구인지 가려내는 정보가 아니라 덧붙이는 정보라는 것을 보여 줘요.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: 제한적 관계절과 비제한적 관계절
    gloss: '쉼표 없는 한정 관계절은 어느 사람이나 사물인지 정확히 말할 때 써요: The colleague who sits next to Mia is organized. 쉼표가 있는 비한정 관계절은 이미 알고 있는 대상에 정보를 덧붙일 때 써요: Daniel, who joined in March, already leads two projects. 참고로 한국어에서는 수식하는 말이 명사 앞에 오지만, 영어의 관계절은 명사 뒤에 오고, 덧붙이는 정보일 때만 쉼표로 묶어요.'
    note: '형태: 한정 = 쉼표 없음, 누구/무엇인지 알려 줘요. 비한정 = 쉼표 있음, 정보를 덧붙여요.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: 마감 기한
    note: '*deadline*은 무언가를 끝내야 하는 날짜나 시간을 뜻해요.'
    example_gloss: 미아 옆에 앉는 동료는 항상 마감 기한을 지켜요.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: 승인하다
    note: '*approve*는 무언가를 공식적으로 받아들이는 것을 뜻해요.'
    example_gloss: 고객은 첫 번째 디자인을 이미 승인했어요.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: '읽기: 새 사무실'
    gloss: 미아는 일을 더 수월하게 해 주는 여러 사람과 함께 일해요. 3월에 팀에 들어온 대니얼은 벌써 프로젝트 두 개를 이끌고 있어요. 미아 옆에 앉는 동료는 아주 꼼꼼해서 항상 마감 기한을 지켜요. 5층에 있는 그들의 사무실에는 모두가 함께 점심을 먹는 작은 주방이 있어요. 그들이 지금 마무리하고 있는 프로젝트의 고객은 이미 첫 번째 디자인을 승인했어요.
    note: 한정 관계절과 비한정 관계절이 나오는 짧은 읽기 글이에요.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: 미아가 새 동료를 소개한다
    gloss: '미아가 말해요: 레일라, 우리 팀에 막 들어온 분 만나 봤어요?'
    note: 여기서 *who*는 *the woman*을 가리켜요.
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: 레일라가 새 동료의 자리를 묻는다
    gloss: '레일라가 말해요: 아직요. 창가 쪽에 자리가 있는 분인가요?'
    note: '*whose*는 소유를 나타내요: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: 미아가 새 동료를 설명한다
    gloss: '미아가 말해요: 네, 그분이에요. 로고 프로젝트를 끝낸 디자이너예요.'
    note: '*who*는 *the designer*를 가리켜요.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: 레일라가 프로젝트를 떠올린다
    gloss: '레일라가 말해요: 아, 기억나요. 지난달에 상을 받은 그 프로젝트예요?'
    note: '*which*는 *the project*를 가리켜요.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: 미아가 이전 사무실에 대해 이야기한다
    gloss: '미아가 말해요: 맞아요. 그분이 예전에 일하던 사무실은 우리 사무실보다 훨씬 작았어요.'
    note: '*where*는 장소를 가리켜요: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: 레일라가 자신이 왜 부엌을 좋아하는지 깨닫는다
    gloss: '레일라가 말해요: 그래서 모두가 함께 점심을 먹는 주방을 그렇게 좋아하는군요.'
    note: '*where*는 *the kitchen*을 가리켜요.'
