  en.b1.unit13.lesson02.teach.colleague_organized:
    title: 제한적 관계절의 who
    gloss: 미아 옆에 앉는 동료는 아주 꼼꼼해요.
    note: 여기서 *who*는 누구를 말하는지 알아야 할 때 꼭 필요한 정보를 이끌어요.
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: 비제한적 관계절의 who
