teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: ~하는 동안
    note: '*while*은 어떤 일이 다른 일과 동시에 일어난다는 뜻이에요.'
    example_gloss: 운전하는 동안 비가 오기 시작했어요.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: 타이어 펑크
    note: '*flat tire*는 바람이 빠져서 쓸 수 없게 된 타이어를 뜻해요.'
    example_gloss: 고속도로에서 타이어가 펑크 났어요.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: 길가에 차를 대다
    note: '*pull over*는 차를 길가에 세운다는 뜻이에요.'
    example_gloss: 저는 바로 길가에 차를 대야 했어요.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: 모르는 사람
    note: '*stranger*는 알지 못하는 사람을 뜻해요.'
    example_gloss: 모르는 사람이 멈춰 서서 저를 도와줬어요.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: 정비사
    note: '*mechanic*은 자동차를 수리하는 사람을 뜻해요.'
    example_gloss: 정비사가 제 타이어를 금방 고쳐 줬어요.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: ~라고 말했다
    note: '*said that*은 다른 사람이 한 말을 전달할 때 써요.'
    example_gloss: 그는 도와줄 수 있다고 말했어요.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: '''while''로 나타내는 배경 상황'
    gloss: 출근하려고 운전하는 동안 타이어가 펑크 났어요.
    note: '*while* + *was/were* + -ing 형태의 과거 시제는 다른 일에 끊기는 배경 상황을 나타내요.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: '''when''으로 이어지는 일 말하기'
    gloss: 제가 길가에 차를 대자 모르는 사람이 도와주려고 멈춰 섰어요.
    note: '*when*은 이야기에서 다음에 일어난 일을 이끌어요.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: 이야기에서 쓰는 'while'과 'when'
    gloss: 운전하는 동안 타이어가 펑크 났어요. 길가에 차를 대자 모르는 사람이 저를 도와줬어요.
    note: '*while*은 배경(진행 중인 행동)을 나타내고, *when*은 그 안에서 일어난 다음의 더 짧은 사건을 나타내요.'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: 이미 전화했었다
    note: '*had already* + 과거분사는 과거의 어느 시점보다 먼저 이미 일어난 일을 나타내요.'
    example_gloss: 그가 도착했을 때 저는 이미 대니얼에게 전화해 놓았어요.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: 약속을 지켰다
    note: '*kept his word*는 약속한 대로 했다는 뜻이에요.'
    example_gloss: 그는 약속을 지켜서 10분 만에 고쳤어요.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: '읽기: 타이어 펑크 이야기'
    gloss: 어제 아침, 레일라가 출근하려고 운전하는 동안 갑자기 타이어가 펑크 났어요. 레일라는 조용한 길가에 차를 댔어요. 모르는 사람이 차를 세우고 도와주겠다고 했어요. 정비사가 도착했을 때 레일라는 이미 대니얼에게 전화해서 늦을 거라고 말해 둔 상태였어요. 정비사는 타이어를 10분 만에 고칠 수 있다고 말했어요. 그는 약속을 지켰고, 레일라는 20분만 늦게 회사에 도착했어요.
    note: 배경 상황(*while*), 일의 순서(*when*), 그보다 먼저 일어난 일(*had already*)이 모두 나오는 과거 이야기예요.
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: 대니얼이 레일라가 늦었다고 말한다
    gloss: '대니얼: 늦었네! 무슨 일이야?'
    note: 걱정하며 직접 묻는 질문으로, 이야기의 시작이에요.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: 레일라가 이야기를 시작한다
    gloss: '레일라: 출근하려고 운전하는 동안 갑자기 타이어가 펑크 났어.'
    note: '*while*은 다른 일이 일어난 배경 상황을 나타내요.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: 대니얼이 되묻는다
    gloss: '대니얼: 어떡해! 어떻게 했어?'
    note: 이야기를 더 듣기 위해 하는 짧은 질문이에요.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: 레일라가 이야기를 이어간다
    gloss: '레일라: 길가에 차를 댔더니, 모르는 사람이 멈춰 서서 도와줬어.'
    note: 배경 상황 다음에 일어난 이야기 속 사건이에요.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: 대니얼이 반응하며 계속 묻는다
    gloss: '대니얼: 친절한 분이네. 정비사한테는 전화했어?'
    note: '*that was kind of him*은 누군가의 친절에 대한 자연스러운 반응이에요.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: 레일라가 이야기를 끝낸다
    gloss: '레일라: 응, 그분이 오기 전에 이미 한 명에게 전화해 놨어. 정비사가 10분 만에 고칠 수 있다고 했는데, 정말 그렇게 해 줬어!'
    note: '*had already called*는 그 사람이 도착하기 전에 이미 일어난 일을 보여 줘요.'
