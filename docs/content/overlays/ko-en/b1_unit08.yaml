teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: ~하기 전에, ~전
    note: '*before*는 다른 일보다 먼저라는 뜻이에요.'
    example_gloss: 요리하기 전에 손을 씻어.
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: ~한 후에, ~후
    note: '*after*는 다른 일보다 나중이라는 뜻이에요.'
    example_gloss: 일이 끝나면 나한테 전화해.
  en.b1.unit08.lesson01.teach.as_soon_as:
    title: as soon as
    gloss: ~하자마자
    note: '*as soon as*는 어떤 일이 일어나면 곧바로라는 뜻이에요.'
    example_gloss: 도착하자마자 문자할게.
  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: ~할 때쯤에는, 늦어도 ~할 때까지
    note: '*by the time*은 어떤 일이 일어나는 시점까지는 이미 끝나 있다는 뜻이에요.'
    example_gloss: 미아가 도착할 때쯤이면 저녁이 준비되어 있을 거예요.
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: 도착했다고 연락하다
    note: '*check in*은 도착했거나 안전하다는 것을 다른 사람에게 짧게 알리는 것을 뜻해요.'
    example_gloss: 호텔에 도착하면 연락 줘.
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: 문단속하다, 잠그다
    note: '*lock up*은 방이나 건물을 닫고 잠그는 것을 뜻해요.'
    example_gloss: 저는 사무실을 나서기 전에 문단속을 해요.
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: 바로 이어서 하기
    gloss: 집에 도착하자마자 전화할게.
    note: '*as soon as*는 두 번째 행동이 첫 번째 행동 직후에 곧바로 일어난다는 것을 보여 줘요.'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: 먼저 무언가 하기
    gloss: 위층으로 올라가기 전에 우편물을 확인해 주세요.
    note: '*before*는 어느 행동을 먼저 해야 하는지 보여 줘요.'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: 시간 부사절의 현재 시제
    gloss: 집에 오면 전화할게. 위층으로 올라가기 전에 우편물을 확인해 주세요.
    note: 영어의 시간 부사절에서는 앞으로 일어날 일도 현재형으로 써요. *when I get home*이라고 하고 *when I will get home*이라고 하지 않아요.
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: 현관문
    note: '*front door*는 집이나 건물 앞쪽에 있는 주된 문을 뜻해요.'
    example_gloss: 대니얼은 우편물을 확인한 후에 현관문을 잠가요.
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: 준비된
    note: '*ready*는 준비가 끝났거나 바로 쓸 수 있는 상태를 뜻해요.'
    example_gloss: 미아가 도착할 때쯤이면 저녁이 준비되어 있을 거예요.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: '읽기: 저녁 계획'
    gloss: 대니얼은 꼼꼼한 저녁 일과가 있어요. 집에 오면 먼저 우편물을 확인해요. 우편물을 확인한 후에는 현관문을 잠가요. 저녁을 준비하기 전에 손을 씻고 식탁을 치워요. 미아가 도착할 때쯤에는 주방이 정돈되어 있고 음식도 따뜻해요.
    note: '*when*, *after*, *before*, *by the time*이 나오는 짧은 읽기 글이에요.'
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: 레일라가 전화를 부탁한다
    gloss: '레일라가 말해요: 대니얼, 집에 오면 나한테 전화해 줄 수 있어요?'
    note: 행동이 일어나는 때를 말하려고 *when*을 쓴 질문이에요.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: 대니얼이 바로 전화하겠다고 약속한다
    gloss: '대니얼이 말해요: 물론이죠. 집에 도착하자마자 전화할게요.'
    note: '*as soon as*는 곧바로 전화한다는 것을 분명히 해 줘요.'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: 레일라가 첫 과제를 준다
    gloss: '레일라가 말해요: 위층으로 올라가기 전에 우편물을 확인해 주세요.'
    note: '*before*는 우편물을 먼저 확인한다는 것을 보여 줘요.'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: 대니얼이 다음 단계를 말한다
    gloss: '대니얼이 말해요: 그럴게요. 우편물을 확인한 후에 현관문을 잠글게요.'
    note: '*after*는 두 행동의 순서를 보여 줘요.'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: 레일라가 시점을 말한다
    gloss: '레일라가 말해요: 좋아요. 미아가 도착할 때쯤이면 모든 게 준비되어 있어야 해요.'
    note: '*by the time*은 그 시점까지는, 또는 그 전에 모든 것이 준비되어 있어야 한다는 뜻이에요.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: 대니얼이 계획을 마무리한다
    gloss: '대니얼이 말해요: 그럼 미아가 도착하면 저녁을 시작하면 되겠네요.'
    note: '*when she arrives*는 저녁을 시작할 수 있는 때를 말해요.'
