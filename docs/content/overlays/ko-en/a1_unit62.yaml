teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: 전화, 휴대폰
    note: '*phone*은 ''전화''예요. 일상에서는 보통 휴대폰을 가리켜요.'
    example_gloss: 제 휴대폰은 여기 있어요.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: 전화하다 / 전화
    note: '*call*은 ''전화(통화)''라는 명사도 되고 ''전화하다''라는 동사도 돼요. *a call*(명사), *to call*(동사)이에요.'
    example_gloss: 제가 전화할 수 있어요.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: 메시지
    note: '*message*는 ''메시지''예요.'
    example_gloss: 메시지를 남겨 주세요.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: 음성 메시지, 음성사서함
    note: '*voicemail*은 전화로 남기는 녹음된 메시지(음성사서함)예요.'
    example_gloss: 음성 메시지가 짧아요.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: 되풀이하다, 다시 말하다
    note: '*repeat*는 ''다시 말하다''라는 뜻이에요.'
    example_gloss: 그것을 다시 말해 주세요.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: 천천히
    note: '*slowly*는 ''천천히''예요. *-ly*로 끝나는 부사예요. 한국어의 ''천천히''처럼 동사를 꾸미는 말이에요.'
    example_gloss: 천천히 말해 주세요.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: 여보세요, 레일라예요.
    note: 영어에서는 전화를 걸 때 *this is...*로 누구인지 말해요. 전화에서 *My name is...*라고 하면 어색하게 들려요.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: 미아와 통화할 수 있을까요?
    note: '*speak to*는 ''~와 이야기하다''라는 뜻이에요. 한국어의 ''~와''에 해당하는 말은 *with*가 아니라 *to*를 써요.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: 다시 말해 주세요.
    note: '*Please repeat that*은 공손하게 다시 말해 달라고 부탁하는 말이에요.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: 천천히 말해 주세요.
    note: 여기서 *slowly*는 동사 *speak* 뒤에 와요.
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: 메시지를 남겨 주세요.
    note: '*leave a message*는 ''메시지를 남기다''라는 뜻의 굳어진 표현이에요.'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: 나중에 다시 전화할게요.
    note: '*call back*은 ''다시 전화하다''라는 뜻이에요. *back*은 동사 뒤에 와요.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: 미아가 전화를 받아요
    gloss: 미아가 말해요. 여보세요, 미아예요.
    note: '*this is Mia*는 전화에서 자연스럽게 들려요.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: 레일라가 누구인지 밝혀요
    gloss: 레일라가 말해요. 안녕, 미아. 나 레일라야.
    note: 전화에서 자기 자신을 밝힐 때는 *this is*를 써요.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: 레일라가 잘 못 들어요
    gloss: 레일라가 말해요. 잘 안 들려요.
    note: '*can''t hear you well*은 ''잘 안 들린다''라는 뜻이에요.'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: 레일라가 천천히 말해 달라고 해요
    gloss: 레일라가 말해요. 천천히 말해 줘요.
    note: '*Please speak slowly*는 공손한 부탁이에요.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: 미아가 시간을 말해요
    gloss: 미아가 말해요. 네. 회의는 4시예요.
    note: '*at four*에서 *at*은 시각 앞에 써요.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: 레일라가 다시 말해 달라고 해요
    gloss: 레일라가 말해요. 다시 말해 줘요.
    note: '*repeat that*은 방금 한 말을 가리켜요.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: 미아가 4시를 되풀이해요
    gloss: 미아가 말해요. 4시요.
    note: '*Four o''clock*은 정각 시각이에요.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: 레일라가 나중에 다시 전화해요
    gloss: 레일라가 말해요. 고마워요. 나중에 다시 전화할게요.
    note: '*I''ll*은 *I will*의 줄임말이에요.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: 전화 메시지
    gloss: '전화 메시지: 미아가 3시에 전화했어요. 회의는 5호실이에요. 다시 전화해 주세요.'
    note: 이 메시지에는 누가 전화했는지, 시각, 방, 그리고 해야 할 일이 들어 있어요.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: '글: 짧은 전화 통화'
    gloss: '짧은 전화 통화: 미아가 오후에 레일라에게 전화했어요. 소리가 또렷하지 않아서 레일라는 미아에게 천천히 말해 달라고 했어요. 미아는 회의가 5호실에서 4시에 있다고 말했어요. 레일라는 미아에게 시간을 다시 말해 달라고 했어요. 나중에 레일라는 전화 메시지를 썼어요. 메시지에는 미아가 3시에 전화했고 다시 전화해 달라고 했다고 적혀 있었어요.'
    note: '*called*는 *call*의 과거형이에요.'
