  en.a1.unit35.lesson04.how_they_use_their_phones:
    title: '읽기: 휴대폰을 쓰는 방법'
teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: 휴대폰
    note: '*phone*은 ''휴대폰, 전화기''라는 뜻이에요.'
    example_gloss: 저는 휴대폰으로 어머니께 전화해요.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: 노트북
    note: '*laptop*은 ''노트북''이라는 뜻이에요.'
    example_gloss: 그녀는 일할 때 노트북을 사용해요.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: 태블릿
    note: '*tablet*은 ''태블릿''이라는 뜻이에요.'
    example_gloss: 그는 태블릿으로 책을 읽어요.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: 컴퓨터
    note: '*computer*는 ''컴퓨터''라는 뜻이에요.'
    example_gloss: 우리 집에는 컴퓨터가 있어요.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: 앱
    note: '*app*은 ''앱''이라는 뜻이에요.'
    example_gloss: 저는 휴대폰에 새 앱이 있어요.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: 카메라
    note: '*camera*는 ''카메라''라는 뜻이에요.'
    example_gloss: 이 카메라는 사진이 정말 잘 나와요.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: 전화하다
    note: '*make a call*은 동사 + 명사로 이루어진 고정 표현이라 통째로 외워야 해요. 한국어에서는 ''전화하다''처럼 동사 하나로 말하지만, 영어에서는 *call*을 명사로 써서 *make a call*이라고 해요.'
    example_gloss: 저는 일요일마다 형에게 전화해요.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: 문자를 보내다
    note: '*send a text*도 *make a call*처럼 동사 + 명사로 이루어진 고정 표현이에요. 한국어에서는 ''문자하다'', ''카톡하다''처럼 한 단어로 말하기도 하지만, 영어에서는 보통 *send a text*라고 해요.'
    example_gloss: 그녀는 아침마다 친구에게 문자를 보내요.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: 앱을 내려받다
    note: '*download an app*에서 *download*는 한국어의 ''내려받다''처럼 그냥 하나의 동사예요. 세 가지 고정 표현 중 가장 쉬워요.'
    example_gloss: 그는 매주 새 앱을 내려받아요.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: 와이파이
    note: '*wifi*는 ''와이파이''라는 뜻이에요.'
    example_gloss: 우리 집 와이파이는 빨라요.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: 배터리
    note: '*battery*는 ''배터리''라는 뜻이에요.'
    example_gloss: 제 휴대폰 배터리가 거의 다 됐어요.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: 휴대폰을 어떻게 사용해요?
    note: '*Do you use ...?*는 다른 영어 의문문처럼 조동사 *do*를 써요.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: 미아의 불평
    gloss: 미아가 말해요. 제 휴대폰이 너무 오래됐어요. 정말 느려요.
    note: '*so* + 형용사(*so old*)는 한국어의 ''너무'', ''정말''처럼 뜻을 강조해요.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: 레일라의 조언
    gloss: 레일라가 말해요. 새로 사야겠네요. 주로 뭐에 가장 많이 써요?
    note: '*What do you use it for most?*는 전치사 *for*로 끝나요. 영어에서는 *what*으로 시작하고 *for*가 문장 끝에 남아요. 한국어에서는 ''뭐에 가장 많이 써요?''처럼 말해요.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "미아의 대답"
    gloss: 미아가 말해요. 주로 언니한테 문자하고 사진을 찍어요.
    note: '*text*는 동사로도 쓸 수 있어요(*I text my sister*). *send a text*보다 더 흔하고, 둘 다 올바른 영어예요.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: 레일라의 사용법
    gloss: 레일라가 말해요. 저는 주말마다 휴대폰으로 부모님께 전화해요. 앱도 많이 써요.
    note: 동사 *call*(*I call my parents*)은 일상적이고 편한 표현이에요. *Make a call*은 앞에서 배운 고정 표현이에요.
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: 미아의 질문
    gloss: 미아가 물어요. 어떤 앱을 써요?
    note: '*Which apps do you use?*에서 *which*는 정해진 범위(앱들) 중에서 고르는 질문이에요. 한국어의 ''어떤''과 비슷해요.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 레일라가 말해요. 요리 앱과 지도 앱을 써요. 내려받아 볼래요?
    note: '*Do you want to ...?*에서는 *want*가 일반 동사여도 조동사 *do*를 써요.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "미아의 대답"
    gloss: 미아가 말해요. 네, 좋아요. 이름 좀 보내 주세요!
    note: '*please*는 여기서 동사 앞에 와서(*please send ...*) 요청을 더 공손하게 만들어요.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: 다니엘, 레일라, 미아에 관한 글
    gloss: 다니엘, 레일라, 미아는 모두 휴대폰을 다르게 사용해요. 다니엘은 문자를 좋아하지 않아서 대신 전화하는 것을 더 좋아해요. 레일라는 길 찾기에 휴대폰을 써요. 새 요리법을 시도할 때는 요리 앱도 사용해요. 미아는 사진을 많이 찍어서 가족에게 보내요. 세 사람 모두 일할 때 노트북을 쓰고, 주말에는 친구들과 영상통화를 해요.
    note: '*He prefers to call people instead*에서 문장 끝의 *instead*는 ''대신에''라는 뜻이에요(문자 보내기 대신).'
