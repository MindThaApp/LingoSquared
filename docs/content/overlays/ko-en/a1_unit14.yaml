  en.a1.unit14.lesson01.teach.are_you_free:
    title: Are you free tonight?
    gloss: 오늘 저녁에 시간 있어요?
    note: 여기서 *free*는 "공짜"가 아니라 "시간이 비어 있는"이라는 뜻이에요.
  en.a1.unit14.lesson02.teach.can_you_repeat:
    title: Sorry, can you repeat that?
    gloss: 죄송하지만, 다시 말씀해 주시겠어요?
    note: '*Sorry*는 다시 말해 달라는 부탁을 공손하게 시작해 줘요.'
  en.a1.unit14.lesson02.teach.speak_slowly:
    title: Can you speak more slowly, please?
    gloss: 좀 더 천천히 말씀해 주시겠어요?
    note: '*more slowly*는 "더 천천히"라는 뜻으로, *slowly*의 비교 표현이에요.'
  en.a1.unit14.lesson02.teach.i_cant_hear:
    title: I can't hear you well.
    gloss: 잘 안 들려요.
    note: '*can''t hear*는 "들을 수 없다"라는 뜻이에요. 연결 상태가 나쁠 때 자주 써요.'
  en.a1.unit14.lesson03.teach.are_you_free_at:
    title: Are you free at 6pm?
    gloss: 저녁 6시에 시간 있어요?
    note: '*at 6pm*은 정확한 시각을 말해요.'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: 문자 메시지
    gloss: 안녕 레일라, 저녁 6시에 시간 있어? 카페에서 만나자.
    note: 짧은 문자 메시지에는 시간을 묻는 질문과 구체적인 제안이 함께 들어갈 수 있어요.
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: 이 메시지는 만날 시간과 장소를 제안하려는 거예요.
    note: '*to suggest*는 "제안하다"라는 뜻이에요. 메시지의 목적을 말해요.'
  en.a1.unit14.lesson04.teach.how_about:
    title: How about 6pm at the cafe?
    gloss: 저녁 6시에 카페에서 어때요?
    note: '*How about...?*은 시간이나 장소를 부드럽게 제안할 때 써요.'
  en.a1.unit14.lesson04.teach.a_hello:
    title: 레일라의 인사
    gloss: '레일라: 여보세요, 저는 레일라예요.'
    note: 레일라가 전화를 받으며 자기 이름을 말해요.
  en.a1.unit14.lesson04.teach.q_free_tonight:
    title: 대니얼의 질문
    gloss: '대니얼: 안녕 레일라, 대니얼이야. 오늘 저녁에 시간 있어?'
    note: 대니얼이 자기를 소개하고 바로 시간이 있는지 물어요.
  en.a1.unit14.lesson04.teach.a_repeat_request:
    title: 레일라의 부탁
    gloss: '레일라: 미안, 다시 말해 줄래?'
    note: 레일라가 질문을 알아듣지 못해서 다시 말해 달라고 부탁해요.
  en.a1.unit14.lesson04.teach.repeat_question:
    title: 대니얼의 반복 질문
    gloss: '대니얼: 오늘 저녁에 시간 있어?'
    note: 대니얼이 똑같은 질문을 다시 해요.
  en.a1.unit14.lesson04.teach.a_yes_what_time:
    title: 레일라의 대답
    gloss: '레일라: 아, 응! 몇 시에?'
    note: 레일라가 좋다고 하며 정확한 시간을 물어요.
  en.a1.unit14.lesson04.teach.suggest_time_place:
    title: 대니얼의 제안
