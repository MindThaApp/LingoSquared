teaching:
  en.a1.unit14.lesson01.teach.hello_this_is:
    title: Hello, this is Daniel.
    gloss: 여보세요, 저는 대니얼이에요.
    note: '*this is [Name]*은 전화에서 자기를 소개하는 표현이에요. 직접 만나서 소개할 때 쓰는 *I''m*과 달라요.'
