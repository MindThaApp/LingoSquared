      status: correct
    - value: The coordinator had moved the equipment inside before Simon arrived
      status: correct
    - value: Before Simon arrived, the coordinator had moved the equipment inside.
      status: correct
    - value: The coordinator had already moved the equipment inside before Simon arrived.
      status: correct
    feedback: '*had moved*는 다른 과거 시점보다 먼저 일어난 일에 써요.'
  en.b2.unit04.lesson03.exercise05.write_interruption:
    instruction: '''While''로 시작해서, 사이먼이 음향 시스템을 점검하고 있는 동안 전기가 나갔다는 문장을 쓰세요.'
