  en.b2.unit04.lesson03.exercise04.write_earliest_event:
    instruction: 과거완료와 'before'를 써서, 담당자가 사이먼이 도착하기 전에 장비를 안으로 옮겨 놓았었다는 문장을 쓰세요.
    accepted_answers:
