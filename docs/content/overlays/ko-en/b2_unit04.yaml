      - left: background
        right: 배경
      - left: foreground
        right: 주요 사건
      - left: prior
        right: 앞서 일어난, 이전의
      - left: interrupt
        right: 중단시키다
      - left: ongoing
        right: 진행 중인
      - left: chronology
        right: 실제 시간 순서
      status: correct
    feedback: 각각의 역할을 구분해 보세요. 배경, 주요 사건, 먼저 일어난 사건, 중단, 진행 중인 동작, 실제 순서예요.
  en.b2.unit04.lesson01.exercise04.write_chronology:
    instruction: 사건이 실제로 일어난 순서를 뜻하는 영어 단어를 쓰세요.
    accepted_answers:
    - value: chronology
      status: correct
    - value: Chronology
      status: correct
    feedback: '*chronology*는 실제 시간 순서라는 뜻이에요.'
  en.b2.unit04.lesson01.exercise05.write_foreground:
    instruction: 이야기가 향해 가는 중심 사건을 뜻하는 영어 단어를 쓰세요.
    accepted_answers:
    - value: foreground
      status: correct
    - value: Foreground
      status: correct
    feedback: '*foreground*는 이야기의 중심 층이에요.'
  en.b2.unit04.lesson02.exercise01.choose_past_perfect:
    instruction: 도착하기 전에 이미 일어난 일임을 나타내는 표현은 어느 것일까요?
    correct_option: the coordinator had already moved the equipment inside
    distractors:
    - the volunteers were setting up the chairs
    - the power went out
    - I was checking the sound system
    accepted_answers:
    - value: the coordinator had already moved the equipment inside
      status: correct
    feedback: '*had already moved*는 과거완료예요. *I arrived*보다 더 앞선 일이에요.'
  en.b2.unit04.lesson02.exercise02.choose_interruption:
    instruction: 진행 중인 동작이 주요 사건 때문에 중단되는 모습을 보여 주는 문장은 어느 것일까요?
    correct_option: While I was checking the sound system, the power went out.
    distractors:
    - By the time I arrived, the coordinator had already moved the equipment inside.
    - When I arrived, the volunteers were setting up the chairs.
    - The coordinator had already moved the equipment inside.
    accepted_answers:
    - value: While I was checking the sound system, the power went out.
      status: correct
    feedback: '*was checking*은 진행 중이던 일이고, *went out*은 끼어든 사건이에요.'
  en.b2.unit04.lesson02.exercise03.order_by_the_time:
    instruction: '''제가 도착했을 즈음에는 담당자가 이미 장비를 안으로 옮겨 놓았다''라는 뜻이 되도록 단어들을 올바른 순서로 배열하세요.'
    accepted_answers:
    - value:
      - By
      - the
      - time
      - I
      - arrived
      - the
      - coordinator
      - had
      - already
      - moved
      - the
      - equipment
      - inside
      status: correct
    feedback: 올바른 순서는 *By the time I arrived, the coordinator had already moved the equipment inside*예요.
  en.b2.unit04.lesson02.exercise04.reply_while_checking:
    instruction: 누군가 무슨 일이 있었는지 물어요. 사이먼이 되어 음향 시스템을 점검하고 있는 동안 전기가 나갔다고 말하세요. 'While'로 시작하세요.
    accepted_answers:
    - value: While I was checking the sound system, the power went out.
      status: correct
    - value: While I was checking the sound system the power went out.
      status: correct
    feedback: '''점검하고 있었다''에는 *was checking*을, 사건에는 단순과거 *went out*을 쓰세요.'
  en.b2.unit04.lesson02.exercise05.write_prior_event:
    instruction: 과거완료와 'already'를 써서, 담당자가 이미 장비를 안으로 옮겨 놓았었다는 문장을 쓰세요.
    accepted_answers:
    - value: The coordinator had already moved the equipment inside.
      status: correct
    - value: The coordinator had already moved the equipment inside
      status: correct
    feedback: '*had already moved*가 맞아요. 한국어의 ''-했다''를 그대로 *has moved*로 옮기지 마세요.'
  en.b2.unit04.lesson03.exercise01.choose_earliest_event:
    instruction: 읽기 지문에서 가장 먼저 일어난 사건은 어느 것일까요?
    correct_option: the coordinator had moved the equipment inside
    distractors:
    - the volunteers were setting up chairs
    - the power went out
    - the team delayed the start
    accepted_answers:
    - value: the coordinator had moved the equipment inside
      status: correct
    feedback: 이 일은 사이먼이 도착하기 전에 이미 일어났어요.
  en.b2.unit04.lesson03.exercise02.choose_interrupted_action:
    instruction: 전기가 나갔을 때 진행 중이던 동작은 어느 것일까요?
    correct_option: he was checking the sound system
    distractors:
