    title: Walk me through what happened
teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: 배경
    note: '*background*는 이미 진행 중이던 일이나 상황의 맥락을 말해요. 영어 이야기에서는 배경을 흔히 과거진행형으로 나타내요.'
    example_gloss: 배경 정보는 이미 무슨 일이 벌어지고 있었는지를 알려 줘요.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: 주요 사건
    note: '*foreground*는 이야기가 향해 가는 중심 사건이에요. 영어에서는 주요 사건에 단순과거를 쓰는 경우가 많아요.'
    example_gloss: 주요 사건은 이야기에서 가장 중요한 사건이에요.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: 앞서 일어난, 이전의
    note: '*prior*는 과거의 다른 시점보다 더 먼저라는 뜻이에요. 보통 과거완료로 나타내요: *had moved*.'
    example_gloss: 앞서 일어난 사건은 과거의 다른 사건보다 먼저 일어났어요.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: 중단시키다
    note: '*interrupt*는 짧은 사건이 진행 중이던 일에 끼어들 때 써요.'
    example_gloss: 갑작스러운 문제가 하던 동작을 중단시킬 수 있어요.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: 진행 중인
    note: '*ongoing*은 한국어 ''~하고 있었다''와 잘 맞아요. 영어에서는 흔히 *was/were + -ing*로 나타내요.'
    example_gloss: 진행 중인 동작은 얼마 동안 계속돼요.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: 실제 시간 순서
    note: '*chronology*는 이야기가 다른 순서로 전해지더라도 사건이 실제로 일어난 순서를 말해요.'
    example_gloss: 실제 시간 순서는 사건들이 실제로 일어난 순서예요.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: 이미 전에 일어난 일
    gloss: 제가 도착했을 즈음에는 담당자가 이미 장비를 안으로 옮겨 놓았어요.
    note: '*had already moved*는 이 일이 *I arrived* 이전에 일어났음을 나타내요. 한국어 ''~했었다''에 해당하는 과거완료예요. 그래서 *has moved*가 아니라 *had moved*를 쓰세요.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: 진행 중인 일과 끼어든 사건
    gloss: 음향 시스템을 점검하고 있는 동안에 전기가 나갔어요.
    note: '*was checking*은 ''점검하고 있었다''에 해당해요. 끼어든 사건 자체는 단순과거 *went out*이에요.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: 배경 동작 중에 도착하기
    gloss: 제가 도착했을 때 자원봉사자들은 의자를 설치하고 있었어요.
    note: 주요 사건이 일어났을 때 진행 중이던 일에는 *were setting up*을 쓰세요.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: 이야기 속의 시간 층
    gloss: 배경 동작에는 과거진행형을, 주요 사건에는 단순과거를, 다른 과거 시점보다 먼저 일어난 일에는 과거완료를 쓰세요.
    note: 한국어에서는 과거의 일을 대부분 같은 '-었-'으로 말해서 시간 층이 잘 드러나지 않아요. 영어 이야기에서는 층을 구분해서 쓰세요. 주요 사건은 *the power went out*이지 *has gone out*이 아니에요.
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: 행사장, 행사 장소
    note: '*venue*는 행사가 열리는 장소예요.'
    example_gloss: 행사장은 행사가 열리는 장소예요.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: 지연된, 늦춰진
    note: '*delayed*는 계획보다 늦게 시작되거나 일어난다는 뜻이에요.'
    example_gloss: 행사는 20분 늦게 시작됐어요.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: '읽기 지문: 행사장 문제'
    gloss: 사이먼은 이야기를 엄격한 시간 순서대로 하지 않았어요. 그가 행사장에 도착하기 전에, 비가 올 것으로 예상되어서 담당자가 장비를 안으로 옮겨 놓았어요. 사이먼이 도착했을 때 자원봉사자들은 의자를 설치하고 있었어요. 그가 음향 시스템을 점검하는 동안 전기가 나갔어요. 그가 건물 관리인에게 전화하자, 관리인은 그날 아침 일찍 수리 팀이 근처에서 작업했다고 설명했어요. 팀은 시작을 20분 늦췄지만, 손님들이 들어올 즈음에는 불이 다시 들어와 있었어요.
    note: 영어의 시간 층에 주목하세요. 먼저 일어난 일은 *had moved*, 배경은 *were setting up*, 주요 사건은 *went out*이에요.
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: 하퍼가 이야기를 청해요
    gloss: '하퍼: 행사장에서 무슨 일이 있었는지 차근차근 말해 줄 수 있어요?'
    note: '*walk me through*는 어떤 일을 단계별로 차근차근 설명해 준다는 뜻이에요.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: 사이먼이 시간 층을 섞어요
    gloss: '사이먼: 물론이죠. 제가 도착했을 때 자원봉사자들은 의자를 설치하고 있었는데, 담당자가 비가 올 것으로 예상해서 이미 장비를 안으로 옮겨 놓았더라고요.'
    note: 좋은 이야기는 배경 동작과 그보다 먼저 일어난 사건을 함께 엮어요.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: 하퍼가 순서를 확인해요
    gloss: '하퍼: 그러니까 당신이 거기 도착하기 전에 장비는 안전했던 거네요?'
    note: 이 질문은 순서에 관한 거예요. 장비는 사이먼이 도착하기 전에 이미 안전했어요.
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: 사이먼이 끼어든 사건을 말해요
    gloss: '사이먼: 맞아요. 그러다가 음향 시스템을 점검하고 있는데 전기가 나갔어요.'
    note: '*while I was checking*은 진행 중인 동작이고, *the power went out*은 끼어든 사건이에요.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: 하퍼가 다음 단계를 물어요
    gloss: '하퍼: 그다음엔 어떻게 했어요?'
    note: '*What did you do...?*는 끝난 단계에 대해 묻는 질문이어서 *did*와 단순과거를 써요.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: 사이먼이 이전의 배경을 알려요
    gloss: '사이먼: 건물 관리인에게 전화했더니, 그날 아침 일찍부터 수리 팀이 근처에서 작업하고 있었다고 알려 줬어요.'
    note: '*had been working*은 이 작업이 그날 아침 일찍부터 이미 진행되고 있었음을 보여 줘요.'
  en.b2.unit04.lesson04.teach.q_event:
    title: 하퍼가 행사에 대해 물어요
    gloss: '하퍼: 그럼 행사는요?'
    note: 짧은 질문으로 행사에 어떤 결과가 생겼는지 물어요.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: 사이먼이 마무리해요
    gloss: '사이먼: 시작을 20분 미뤘는데, 손님들이 들어올 즈음에는 불이 다시 들어와 있었어요.'
    note: '*had come back on*은 손님들이 들어오기 전에 일어난 일이에요.'
exercises:
  en.b2.unit04.lesson01.exercise01.choose_background:
    instruction: 주요 사건 주변에서 이미 벌어지고 있던 일에 대한 정보를 뜻하는 단어는 무엇일까요?
    correct_option: background
    distractors:
    - foreground
    - prior
    - interrupt
    accepted_answers:
    - value: background
      status: correct
    feedback: '*background*는 주요 사건을 둘러싼 맥락이나 진행 중인 상황이에요.'
  en.b2.unit04.lesson01.exercise02.choose_prior:
    instruction: 과거의 다른 사건보다 더 이전이라는 뜻의 단어는 무엇일까요?
    correct_option: prior
    distractors:
    - ongoing
    - foreground
    - chronology
    accepted_answers:
