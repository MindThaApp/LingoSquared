  en.a1.unit33.lesson04.two_commuters:
    title: '읽기: 서로 다른 두 사람의 출퇴근'
teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: 버스
    note: '*bus*는 ''버스''라는 뜻이에요. 함께 쓰는 동사는 *take*예요: *take the bus*. 한국어에서는 ''버스를 타다'', ''기차를 타다''처럼 같은 동사 ''타다''를 쓰는 경우가 많지만, 영어에서는 탈것마다 동사가 달라요(*take*, *drive*, *ride*). 이것은 따로 익혀야 해요.'
    example_gloss: 저는 버스를 타요.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: 기차
    note: '*train*은 ''기차''라는 뜻이에요. *bus*와 마찬가지로 여기서도 *take*를 써요: *take the train*.'
    example_gloss: 그녀는 기차를 타요.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: 자동차
    note: '*car*는 ''자동차''라는 뜻이에요. 자동차에는 *take*가 아니라 *drive*를 써요: *drive my car*. 버스나 기차와는 다른 동사예요.'
    example_gloss: 저는 제 차를 운전해서 출근해요.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: 자전거
    note: '*bike*는 ''자전거''라는 뜻이에요. 여기서는 또 다른 동사를 써요: *ride a bike* (*take*도 *drive*도 아니에요).'
    example_gloss: 저는 매일 자전거를 타고 출근해요.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: 걷다
    note: '*walk*는 ''걷다''라는 뜻이에요. 여기서는 *take*, *drive*, *ride* 같은 별도의 동사가 필요 없어요. *walk*가 그 자체로 동사이기 때문이에요: *walk to work* (*take a walk to work*가 아니에요).'
    example_gloss: 저는 걸어서 출근해요.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: 직장에 어떻게 가요?
    note: 이 질문은 조동사 *do*로 시작해요. 실제 동사가 *get*이기 때문이에요. 한국어에는 이런 조동사가 필요 없어요.
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: 보통
    note: '*usually*는 ''보통''이라는 뜻이에요. 영어에서 이런 부사는 대개 주어와 본동사 사이에 와요: *I usually take the bus*.'
    example_gloss: 저는 보통 버스를 타요.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: 분
    note: '*minutes*는 ''분''이라는 뜻이에요. *It takes twenty minutes*에서 *it*은 특별한 뜻이 없는 주어로, 주어 자리만 채워요. 한국어에서는 ''20분 걸려요''처럼 주어를 말하지 않지만, 영어에서는 *it*을 꼭 넣어야 해요.'
    example_gloss: 20분 걸려요.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: 늦은
    note: '*late*는 ''늦은''이라는 뜻이에요(예상보다 늦게 도착하는 것): *The bus is often late.*'
    example_gloss: 버스가 자주 늦어요.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: 더 빠른
    note: '*faster*는 ''더 빠른''이라는 뜻이에요. *fast*에 *-er*을 붙인 비교급이에요. 비교할 때는 *than*을 써요: *faster than the bus*.'
    example_gloss: 기차가 버스보다 더 빨라요.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: 레일라의 질문
    gloss: 레일라가 물어요. 다니엘, 직장에 어떻게 가요?
    note: '*How do you get to work?*로 대화가 시작돼요.'
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 보통 버스를 타요. 20분쯤 걸려요.
    note: 두 가지가 한꺼번에 나와요. 버스에 쓰는 동사 *take*와, *It takes about twenty minutes*의 의미 없는 주어 *it*이에요.
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: 레일라의 질문
    gloss: 레일라가 물어요. 마음에 들어요?
    note: '*Do*로 묻는 예/아니요 질문이에요.'
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 괜찮아요, 그런데 버스가 자주 늦어요. 레일라는요?
    note: '*How about you?*는 ''당신은요?''라는 뜻이에요. 같은 질문을 상대에게 돌려주는 짧은 표현이에요.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 저는 운전해요. 더 빠르지만 주차가 어려워요.
    note: 자동차에는 *take*가 아니라 동사 *drive*를 써요.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: 레일라와 다니엘에 관한 글
    gloss: 레일라는 매일 차를 운전해서 출근해요. 운전은 약 15분 걸리지만 사무실 근처 주차가 어려워요. 다니엘은 차가 없어서 버스를 타요. 버스로는 20분이 걸리고 가끔 늦지만, 주차 걱정은 할 필요가 없어요.
    note: 버스와 기차에는 *take*를, 자동차에는 *drive*를 쓴다는 점에 주의하세요.
