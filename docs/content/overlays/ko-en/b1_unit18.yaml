teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: 약속, 정해진 일정
    note: '*arrangement*는 다른 사람과 이미 정해 둔 계획으로, 예를 들어 합의한 시간이 있는 일정을 뜻해요.'
