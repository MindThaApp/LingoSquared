  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: 의도, 계획
    note: '*intention*은 하기로 마음먹었지만 다른 사람과 아직 시간을 정하지는 않은 일을 뜻해요.'
    example_gloss: 대니얼의 계획은 프로젝트를 일찍 끝내는 거예요.
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: 예측, 전망
    note: '*prediction*은 여러 징후를 바탕으로 앞으로 일어날 일을 짐작하는 것을 뜻해요.'
    example_gloss: 제 예측으로는 프로젝트가 제때 끝날 거예요.
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: 반드시, 분명히
    note: '*definitely*는 어떤 일이 일어날 것이라고 완전히 확신한다는 뜻을 나타내요.'
    example_gloss: 대니얼은 오늘 보고서를 반드시 끝낼 거예요.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: 아마도
    note: '*probably*는 꽤 확신하지만 완전히 확신하지는 않는다는 뜻을 나타내요.'
    example_gloss: 프로젝트는 아마도 두 달쯤 걸릴 거예요.
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: ~일지도 모른다
    note: '*might*는 어떤 일이 일어날 가능성이 약하다는 뜻을 나타내요.'
    example_gloss: 대니얼은 레일라에게 팀에 합류해 달라고 부탁할지도 몰라요.
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (feste Vereinbarung)
    gloss: 금요일에 레일라와 점심을 먹기로 했어요.
    note: '*I am meeting Leila for lunch on Friday*는 다른 사람과 이미 시간을 정해 둔 확정된 약속을 현재진행형으로 나타내요.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (Absicht)
    gloss: 디자인 팀과 새 프로젝트를 시작할 거예요.
    note: '*I am going to start a new project*는 아직 정해진 시간이 없더라도 이미 마음먹은 결정을 *going to*로 나타내요.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Feste Vereinbarungen und Absichten
    gloss: 확정된 약속, 즉 다른 사람과 이미 시간을 정해 둔 일에는 현재진행형(I am meeting Leila on Friday)을 써요. 아직 정해진 시간이 없더라도 이미 마음먹은 의도나 결정에는 going to(I am going to start a new project)를 써요. 한국어에서는 '만날 거예요'처럼 하나의 표현으로 둘 다 말할 수 있지만, 영어에서는 둘 중 하나를 골라야 해요.
    note: '형태: 확정된 약속에는 현재진행형, 의도에는 going to를 골라 써요.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: 제때, 정시에
    note: '*on time*은 정해진 시각이나 날짜에 딱 맞춘다는 뜻이에요.'
    example_gloss: 대니얼은 프로젝트가 제때 끝날 거라고 생각해요.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: 자신 있는
    note: '*confident*는 일이 잘될 거라고 확신하는 느낌을 뜻해요.'
    example_gloss: 대니얼은 새 프로젝트에 대해 자신이 있어요.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Pläne für nächsten Monat'
    gloss: 대니얼은 다음 달에 디자인 팀과 새 프로젝트를 시작할 거예요. 첫 단계를 계획하려고 금요일 아침에 그들을 만나요. 대니얼은 프로젝트에 자신이 있지만, 제때 끝날지는 완전히 확신하지 못해요. 그는 프로젝트가 아마도 두 달쯤 걸릴 거라고 예측해요. 레일라가 쓸모 있는 디자인 경험을 갖고 있어서 팀에 합류해 달라고 부탁할지도 몰라요. 레일라가 수락하면 프로젝트는 분명히 더 빨리 진행될 거예요.
    note: 계획과 예측에 대한 짧은 읽기 글이에요.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia fragt nach Daniels Plänen
    gloss: '미아가 말해요: 대니얼, 다음 달에 어떤 계획이 있어요?'
    note: 대화를 시작하는 열린 질문이에요.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel nennt sein Vorhaben
    gloss: '대니얼이 말해요: 디자인 팀과 새 프로젝트를 시작할 거예요.'
    note: '*going to*는 이미 마음먹은 결정을 나타내요.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia fragt weiter
    gloss: '미아가 말해요: 흥미롭네요. 이번 주에 그들을 만나요?'
    note: 확정된 약속에 대해 되묻는 질문이에요.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel bestätigt die feste Vereinbarung
    gloss: '대니얼이 말해요: 네, 금요일 아침에 만나요.'
    note: '*I am meeting... on Friday morning*은 확정된 약속을 나타내는 현재진행형이에요.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia fragt nach dem Termin
    gloss: '미아가 말해요: 프로젝트가 제때 끝날 것 같아요?'
    note: 예측에 대해 묻는 질문이에요.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel gibt eine Vorhersage ab
    gloss: '대니얼이 말해요: 잘 모르겠지만, 아마도 두 달쯤 걸릴 거예요.'
    note: '*probably*는 꽤 확신하지만 완전히 확신하지는 않는다는 뜻을 나타내요.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia ist optimistisch
    gloss: '미아가 말해요: 그래도 잘될 거라고 확신해요.'
    note: 용기를 북돋우는 말이에요.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel nennt eine schwache Möglichkeit
    gloss: '대니얼이 말해요: 고마워요. 레일라에게도 팀에 합류해 달라고 부탁할지도 몰라요.'
    note: '*might*는 가능성이 약하다는 뜻을 나타내요.'
