teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: 동네
    note: '*neighborhood*는 ''동네''라는 뜻이에요. 집 주변의 가까운 거리와 건물이 있는 지역을 말해요.'
    example_gloss: 저는 제 동네가 좋아요.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: 이웃 / 이웃집 사람
    note: '*neighbor*는 ''이웃''이라는 뜻이에요. 내 옆이나 가까운 곳에 사는 사람이에요.'
    example_gloss: 제 이웃은 정말 잘 도와줘요.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: 가까이에 / 근처에
    note: '*nearby*는 ''근처에'', ''가까이에''라는 뜻이에요.'
    example_gloss: 근처에 공원이 있어요.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: 조용한
    note: '*quiet*는 ''조용한''이라는 뜻이에요. 소리가 많이 나지 않는다는 말이에요.'
    example_gloss: 우리 동네 길은 밤에 정말 조용해요.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: 시끄러운
    note: '*noisy*는 ''시끄러운''이라는 뜻이에요. 큰 소리가 많이 난다는 말이에요.'
    example_gloss: 우리 집 옆 길은 시끄러워요.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: 친절한
    note: '*friendly*는 ''친절한'', ''상냥한''이라는 뜻이에요.'
    example_gloss: 제 이웃들은 정말 친절해요.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: 동네에 살다
    note: '*live in a neighborhood*는 ''어떤 동네에 살다''라는 뜻이에요.'
    example_gloss: 저는 조용한 동네에 살아요.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: 이웃과 잘 지내다
    note: '*get along with your neighbors*는 가까이 사는 사람들과 좋고 친근한 관계를 유지한다는 뜻이에요.'
    example_gloss: 저는 이웃들과 잘 지내요.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: ~에서 가까운
    note: '*close to*는 어떤 장소에서 ''가깝다''는 뜻이에요.'
    example_gloss: 제 아파트는 슈퍼마켓에서 가까워요.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: 걸어서 5분
    note: '*a five-minute walk*는 영어에서 정해진 표현이에요. 숫자와 명사를 하이픈으로 잇고, walk 앞의 명사는 단수로 써요. 한국어의 ''걸어서 5분''과 뜻은 같지만 만드는 방식이 달라요.'
    example_gloss: 공원은 우리 집에서 걸어서 5분 거리예요.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: ~에게 인사하다
    note: '*say hello to*는 누군가에게 인사한다는 뜻이에요.'
    example_gloss: 저는 아침마다 이웃에게 꼭 인사해요.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: 당신의 동네는 어때요?
    note: '*What''s ... like?*는 취향이 아니라 어떤 모습인지 설명해 달라고 묻는 말이에요.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: 레일라의 질문
    gloss: '레일라: 저 곧 이사할지도 몰라요. 미아, 당신 동네는 어때요?'
    note: '*might* + 동사는 가능성을 나타내요. 그럴 수도 있고 아닐 수도 있다는 뜻이에요.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "미아의 대답"
    gloss: '미아: 정말 마음에 들어요. 조용하고, 근처에 공원도 있어요.'
    note: '*there''s a park nearby*는 ''근처에 공원이 있어요''라는 뜻이에요.'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: 레일라의 질문
    gloss: '레일라: 좋네요. 슈퍼마켓에서 가까워요?'
    note: '*That sounds nice*는 좋은 소식에 대한 자연스러운 반응이에요.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "미아의 대답"
    gloss: '미아: 네, 우리 건물에서 걸어서 딱 5분 거리에 하나 있어요.'
    note: 여기서 *just*는 '딱', '겨우'라는 뜻으로, 거리가 얼마나 짧은지 강조해요.
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: 레일라의 질문
    gloss: '레일라: 이웃들은 어때요? 친절해요?'
    note: '*What about ...?*는 새로운 화제를 꺼낼 때 쓰는 자연스러운 표현이에요.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "미아의 대답"
    gloss: '미아: 아주 친절해요! 이웃인 로페즈 씨가 제가 집을 비울 때 화분에 물을 줘요.'
    note: '*waters my plants*는 ''제 식물에 물을 줘요''라는 뜻이에요. 영어에서는 여기서 *water*가 동사예요.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: 레일라의 반응
    gloss: '레일라: 정말 다정하네요. 저도 당신 근처에 살고 싶어요!'
    note: '*I''d like to* + 동사는 ''~하고 싶어요''라는 뜻이에요.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: 세 동네에 관한 글
    gloss: 대니얼, 레일라, 미아는 모두 서로 다른 동네에 살아요. 대니얼의 동네는 번화하고, 아파트 건물 가까이에 식당과 가게가 있어요. 그는 이웃 몇 명을 알고, 복도에서 자주 인사해요. 레일라는 조용한 동네에 살고, 수영하러 다니는 수영장이 가까워요. 길 건너 이웃에게는 자주 짖는 큰 개가 있어요. 미아의 동네도 조용하고, 건물에서 걸어서 딱 5분 거리에 슈퍼마켓이 있어요. 이웃인 로페즈 씨는 아주 친절해서 미아가 집을 비울 때 화분에 물을 줘요. 미아와 이야기한 뒤, 레일라는 미아 근처에서 아파트를 찾아보기로 했어요.
    note: '*decided she wants to look for*는 ''아파트를 찾아보기로 했다''는 뜻이에요.'
