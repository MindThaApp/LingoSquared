teaching:
  en.a1.unit64.lesson01.teach.nice:
    title: nice
    gloss: 좋은 / 멋진 / 친절한
    note: '*nice*는 상황에 따라 좋다, 멋지다, 친절하다는 뜻이에요.'
    example_gloss: 그거 좋네요.
  en.a1.unit64.lesson01.teach.great:
    title: great
    gloss: 대단한 / 훌륭한
    note: '*great*는 *nice*보다 강한 표현으로, 대단하다, 훌륭하다는 뜻이에요.'
    example_gloss: 오늘 정말 멋져 보여요.
  en.a1.unit64.lesson01.teach.lovely:
    title: lovely
    gloss: 사랑스러운 / 아주 아름다운
    note: '*lovely*는 따뜻하고 다정하게 들리는 말이에요.'
    example_gloss: 웃는 모습이 정말 사랑스러워요.
  en.a1.unit64.lesson01.teach.kind:
    title: kind
    gloss: 친절한
    note: '*kind*는 다정하고 남에게 잘해 준다는 뜻이에요.'
    example_gloss: 정말 친절하시네요.
  en.a1.unit64.lesson01.teach.smile:
    title: smile
    gloss: 미소
    note: '*smile*은 미소, 웃음이라는 뜻이에요.'
    example_gloss: 웃는 모습이 정말 사랑스러워요.
  en.a1.unit64.lesson01.teach.jacket:
    title: jacket
    gloss: 재킷
    note: '*jacket*은 재킷이나 점퍼라는 뜻이에요.'
    example_gloss: 재킷이 마음에 들어요.
  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: 그거 좋네요.
    note: '*That is nice*는 짧게 긍정적으로 반응하는 말이에요.'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: 오늘 정말 멋져 보여요.
    note: '*look*은 여기서 ~해 보이다라는 뜻이에요. 쳐다본다는 뜻이 아니에요.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: 재킷이 마음에 들어요.
    note: '*I like your...*는 상대방의 물건에 대해 칭찬할 때 쓰는 기본 표현이에요.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: 웃는 모습이 정말 사랑스러워요.
    note: '*What a...*는 감탄하며 칭찬할 때 써요.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: 정말 친절하시네요.
    note: '*very*는 *kind*의 뜻을 더 강하게 해 줘요.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: 정말 감사합니다.
    note: '*Thank you very much*는 정중하고 따뜻하게 감사를 표하는 말이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "미아가 칭찬해요"
    gloss: '미아가 말해요: 안녕, 레일라. 오늘 정말 멋져 보여요.'
    note: '*You look great*는 직접적인 칭찬이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: 레일라가 미아에게 고마워해요
    gloss: '레일라가 말해요: 고마워요, 미아.'
    note: '*Thank you*는 고맙다는 뜻이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: 미아가 초록색 재킷을 말해요
    gloss: '미아가 말해요: 초록색 재킷이 마음에 들어요.'
    note: '*I like your green jacket*은 옷에 대한 칭찬이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: 레일라가 다정하게 답해요
    gloss: '레일라가 말해요: 정말 친절하시네요.'
    note: '*That is very kind*는 누군가의 다정한 말에 답하는 표현이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: 미아가 미소를 말해요
    gloss: '미아가 말해요: 웃는 모습도 정말 사랑스러워요! 보세요, 이게 제 사진이에요.'
    note: '*too*는 여기서 또한이라는 뜻이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: 레일라가 사진을 칭찬해요
    gloss: '레일라가 말해요: 정말 감사해요. 사진이 멋져요.'
    note: '*Your photo is nice*는 칭찬에 칭찬으로 답하는 말이에요.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: 미아가 사진을 설명해요
    gloss: '미아가 말해요: 고마워요. 대니얼에게 줄 거예요.'
    note: '*Thanks*는 *thank you*보다 짧은 표현이에요.'
  en.a1.unit64.lesson04.teach.message:
    title: 다정한 메시지
    gloss: '다정한 메시지: 초록색 재킷이 정말 사랑스러워요. 사진이 멋져요. 친절하게 대해 주셔서 감사해요.'
    note: 메시지에는 칭찬 두 가지와 감사 인사가 들어 있어요.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: '본문: 친구를 위한 칭찬'
    gloss: '친구를 위한 칭찬: 미아는 초록색 재킷을 입은 레일라를 봤어요. 미아는 레일라가 멋져 보인다고 말했어요. 또 레일라의 웃는 모습이 사랑스럽다고도 말했어요. 레일라는 미아에게 고맙다고 했어요. 그다음 레일라는 미아의 사진을 보고 멋지다고 말했어요. 사진이 대니얼에게 줄 것이어서 미아는 기뻤어요. 나중에 레일라는 짧은 메시지를 썼어요. 초록색 재킷이 정말 사랑스러워요.'
    note: '*looked great*는 *look great*의 과거형이에요.'
