    gloss: 비밀번호를 입력하세요.
    note: '*enter*는 여기서 입력하다라는 뜻이에요. *PIN*은 비밀번호 자체예요.'
  en.a1.unit59.lesson02.teach.atm_outside:
    title: The ATM is outside.
    gloss: ATM은 밖에 있어요.
    note: '*outside*는 문장 끝에 와요. *is outside*처럼요.'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: 미아가 ATM이 어디 있는지 물어요
    gloss: '미아가 말해요: 안녕하세요! ATM이 어디에 있어요?'
    note: '*Where is...?*는 장소를 물어요.'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: ATM의 위치
    gloss: '직원이 말해요: ATM은 밖에 있어요.'
    note: '*outside*는 밖이라는 뜻이에요.'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: 레일라가 카드에 대해 물어요
    gloss: '레일라가 말해요: 이 카드를 쓸 수 있어요?'
    note: '*this card*는 레일라가 가지고 있는 카드를 가리켜요.'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: 카드가 돼요
    gloss: '직원이 말해요: 네, 그 카드를 쓰실 수 있어요.'
    note: '*Yes*는 네라는 뜻이고, *that card*는 레일라의 카드를 가리켜요.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: 미아는 잔액을 확인하고 싶어요
    gloss: '미아가 말해요: 잔액을 확인하고 싶어요.'
    note: '*want to check*에서는 두 번째 동사 앞에 *to*를 써요.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: 비밀번호
    gloss: '직원이 말해요: 비밀번호를 입력하세요.'
    note: '*Please*를 붙이면 지시가 정중해져요.'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: 레일라도 현금이 필요해요
    gloss: '레일라가 말해요: 저도 현금이 필요해요.'
    note: '*too*는 또한이라는 뜻이고, 여기서는 문장 끝에 와요.'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: 20달러 인출하기
    gloss: '직원이 말해요: 20달러를 인출하실 수 있어요.'
    note: '*take out*은 여기서 돈을 인출하다라는 뜻이에요.'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: 미아가 직원에게 고마워해요
    gloss: '미아가 말해요: 감사합니다! 도움이 많이 됐어요.'
    note: '*helpful*은 도움이 된다는 뜻이에요.'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: 은행 안내문
    gloss: '은행 안내문: 영업시간 9:00~4:00. ATM은 밖에 있습니다. 오늘 현금 한도: $100. 카드 사용 가능.'
    note: 안내문에는 영업시간, ATM 위치, 한도가 나와 있어요.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: '본문: 은행에 잠깐 들르기'
    gloss: '은행에 잠깐 들르기: 어느 날 아침, 미아와 레일라는 함께 은행에 갔어요. 미아는 잔액을 확인하고 싶었고, 레일라는 현금이 필요했어요. 직원은 ATM이 밖에 있다고 말했어요. 레일라는 카드를 사용해서 20달러를 인출했어요. 미아는 비밀번호를 입력하고 잔액을 확인했어요. 나가기 전에 두 사람은 안내문을 읽었어요. 은행은 9시부터 4시까지 문을 열었고, 현금 한도는 $100였어요. 미아는 방문이 쉬웠다고 말했어요.'
    note: '*took out*은 돈을 인출하다라는 뜻의 *take out*의 과거형이에요.'
