  en.a1.unit59.lesson01.teach.cash:
    title: cash
    gloss: 현금
    note: '*cash*는 현금이라는 뜻이에요.'
    example_gloss: 저는 현금이 필요해요.
  en.a1.unit59.lesson01.teach.atm:
    title: ATM
    gloss: 현금자동입출금기 (ATM)
    note: '*ATM*은 현금자동입출금기라는 뜻이에요. 한국어에서도 "ATM"이라고 해요. 미국 영어에서는 *cash machine*보다 *ATM*을 더 자주 들어요.'
