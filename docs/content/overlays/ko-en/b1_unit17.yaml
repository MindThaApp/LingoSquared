teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: 후회
    note: '*regret*은 자신이 한 일이나 하지 않은 일 때문에 느끼는 슬픔을 뜻해요.'
    example_gloss: 대니얼은 마감을 놓친 것을 후회했어요.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: 소원, 바람
    note: '*wish*는 일이 실제와 다르게 흘러갔으면 좋았겠다고 바란다는 뜻이에요.'
    example_gloss: 대니얼에게는 지난주에 대해 하나의 바람이 있었어요.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: 실수
    note: '*mistake*는 잘못된 판단 때문에 잘못 한 일을 뜻해요.'
    example_gloss: 도움을 요청하는 데 그렇게 오래 망설인 것은 실수였어요.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: 지나고 나서 보니
    note: '*hindsight*는 일이 지나간 뒤에야 알게 되는 깨달음을 뜻해요.'
    example_gloss: 지나고 보니 대니얼은 더 일찍 말했어야 했어요.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: 미루다
    note: '*procrastinate*는 해야 할 일을 계속 미룬다는 뜻이에요.'
    example_gloss: 대니얼은 일이 어렵게 느껴지면 자주 미루는 편이에요.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: 지연
    note: '*delay*는 계획보다 늦어진 시간을 뜻해요.'
    example_gloss: 지연 때문에 대니얼은 첫 번째 마감을 놓쳤어요.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + 과거분사
    gloss: 더 일찍 도움을 요청했더라면 좋았을 텐데.
    note: '*I wish I had asked*는 과거에 일어나지 않은 일에 대한 아쉬움을 나타내요.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + 과거분사
    gloss: 팀장님과 더 일찍 이야기했어야 했어.
    note: '*I should have talked*는 지나고 보니 그렇게 했어야 했다는 뜻을 나타내요.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + 과거분사, I would have + 과거분사
    gloss: 첫 주에 미아에게 도움을 요청했더라면 제때 끝냈을 거야.
    note: '*if I had asked..., I would have finished...*는 과거에 실제로 일어나지 않은 일의 결과를 가정해요.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: 과거에 대한 후회를 나타내는 형태
    gloss: 과거에 대한 후회를 나타낼 때는 wish + 과거완료(I wish I had asked...), should have + 과거분사(I should have talked...), 또는 if + 과거완료와 would have + 과거분사(If I had asked..., I would have finished...)를 써요. 세 가지 모두 실제로는 일어나지 않은 일을 말해요.
    note: '형태: wish + had, should have, if + had ... would have 중에서 골라 써요.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: 돌이켜 보면
    note: '*looking back*은 지난 일을 돌아보는 말을 시작할 때 써요.'
    example_gloss: 돌이켜 보면 대니얼은 더 일찍 도움을 요청했더라면 좋았을 거라고 생각해요.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: 놓친 마감
    note: '*missed deadline*은 지키지 못한 기한을 뜻해요.'
    example_gloss: 대니얼은 도움을 요청하기 전에 마감을 하나 놓쳤어요.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: '읽기: 힘들었던 한 달을 돌아보며'
    gloss: 안녕, 레일라. 돌이켜 보니 더 일찍 도움을 요청했더라면 좋았을 텐데 싶어. 업무량에 대해 팀장님과 더 일찍 이야기했어야 했어. 내가 이야기했을 때는 이미 마감을 하나 놓친 뒤였거든. 첫 주에 미아에게 도움을 요청했더라면 두 프로젝트 모두 제때 끝냈을 거야. 그렇게 오래 기다린 건 실수였어. 대니얼
    note: 짧고 곰곰이 되돌아보는 메시지예요.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: 대니얼이 되돌아보며 시작한다
    gloss: '대니얼이 말해요: 돌이켜 보면 더 일찍 도움을 요청했더라면 좋았을 텐데 싶어요.'
    note: '*looking back*은 지난 일을 돌아보는 대화를 시작할 때 써요.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: 레일라가 되묻는다
    gloss: '레일라가 말해요: 무슨 일이 있었어?'
    note: 더 알고 싶을 때 쓰는 짧은 열린 질문이에요.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: 대니얼이 자신이 했어야 할 일을 설명한다
    gloss: '대니얼이 말해요: 업무량에 대해 팀장님과 더 일찍 이야기했어야 했어요. 이야기했을 때는 이미 마감을 하나 놓친 뒤였어요.'
    note: '*should have talked*와 *had already missed*는 후회와 구체적인 결과를 이어 줘요.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: 레일라가 대니얼을 안심시킨다
    gloss: '레일라가 말해요: 걱정하지 마. 결국 해결했잖아.'
    note: '*Don''t worry*는 죄책감을 느끼는 사람을 안심시킬 때 써요.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: 대니얼이 달라질 수 있었던 점을 설명한다
    gloss: '대니얼이 말해요: 맞아요. 첫 주에 미아에게 도움을 요청했더라면 두 프로젝트 모두 제때 끝냈을 거예요.'
    note: '*if I had asked..., I would have finished...*는 과거에 실제로 일어나지 않은 일의 결과를 가정해요.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: 레일라가 격려하며 마무리한다
    gloss: '레일라가 말해요: 그래, 이제 다음에는 알겠네.'
    note: 짧고 긍정적으로 대화를 마무리하는 말이에요.
