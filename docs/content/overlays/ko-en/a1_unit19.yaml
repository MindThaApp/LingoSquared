teaching:
  en.a1.unit19.lesson01.teach.like:
    title: like
    gloss: 좋아하다
    note: '*like*는 ''좋아하다''라는 뜻이에요.'
    example_gloss: 저는 커피를 좋아해요.
  en.a1.unit19.lesson01.teach.dont_like:
    title: don't like
    gloss: 좋아하지 않다
    note: '*don''t like*는 *like*의 부정형이에요.'
    example_gloss: 저는 차를 좋아하지 않아요.
  en.a1.unit19.lesson01.teach.prefer:
    title: prefer
    gloss: 더 좋아하다, 선호하다
    note: '*prefer*는 선택할 수 있을 때 더 좋아하는 것이나 더 하고 싶은 것을 말할 때 써요.'
    example_gloss: 저는 커피가 더 좋아요.
  en.a1.unit19.lesson01.teach.love:
    title: love
    gloss: 사랑하다, 아주 좋아하다
    note: '*love*는 ''아주 많이 좋아하다''라는 뜻이에요.'
    example_gloss: 저는 가족을 정말 사랑해요.
  en.a1.unit19.lesson01.teach.hate:
    title: hate
    gloss: 몹시 싫어하다
    note: '*hate*는 *love*의 반대말이에요.'
    example_gloss: 저는 늦는 게 정말 싫어요.
  en.a1.unit19.lesson02.teach.do_you_like_or:
    title: Do you like coffee or tea?
    gloss: 커피를 좋아해요, 차를 좋아해요?
    note: 두 가지 중에서 고르게 할 때 쓰는 질문이에요.
  en.a1.unit19.lesson02.teach.i_prefer_tea:
    title: I prefer tea.
    gloss: 저는 차가 더 좋아요.
    note: '*I prefer...*라고 하면 더 좋아하는 것을 말할 수 있어요.'
  en.a1.unit19.lesson02.teach.because_reason:
    title: I like tea because it's milder.
    gloss: 저는 차를 좋아해요. 더 순하거든요.
    note: '*because*는 좋아하는 이유를 말할 때 써요.'
  en.a1.unit19.lesson03.teach.very_much:
    title: very much
    gloss: 아주 많이
    note: '*very much*는 ''아주 많이''라는 뜻이에요.'
    example_gloss: 저는 커피를 아주 좋아해요.
  en.a1.unit19.lesson03.teach.preference_text:
    title: 취향에 대한 글
    gloss: 저는 차를 좋아하지만 커피는 좋아하지 않아요. 차가 더 순해서 차가 더 좋아요.
    note: 이 짧은 글에서 어떤 사람이 무엇을 좋아하는지, 그리고 그 이유를 말해요.
  en.a1.unit19.lesson04.teach.too_strong:
    title: It's too strong.
    gloss: 너무 진해요.
    note: '*too strong*은 ''너무 진하다''라는 뜻이에요.'
  en.a1.unit19.lesson04.teach.q_coffee_or_tea:
    title: 커피냐 차냐 묻기
    gloss: 레일라가 물어요. 커피를 좋아해요, 차를 좋아해요?
    note: 두 번째 수업에 나온 것과 같은 질문이에요.
  en.a1.unit19.lesson04.teach.a_prefer_tea_not_much:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 저는 차가 더 좋아요. 커피는 별로 안 좋아해요.
    note: 다니엘은 자신의 취향을 말하고, 이어서 설명을 덧붙여요.
  en.a1.unit19.lesson04.teach.q_why_not:
    title: Why not?
    gloss: 왜 안 좋아해요?
    note: '*Why not?*은 누가 무언가를 좋아하지 않을 때 그 이유를 묻는 말이에요.'
  en.a1.unit19.lesson04.teach.a_too_strong_calmer:
    title: 다니엘의 전체 대답
    gloss: 다니엘이 말해요. 저는 너무 진하다고 생각해요. 차는 더 순해서 좋아해요.
    note: 다니엘은 커피를 왜 좋아하지 않는지, 그리고 차를 왜 더 좋아하는지 말해요.
  en.a1.unit19.lesson04.teach.he_prefers_thinks:
    title: He prefers tea. He thinks it's too strong.
    gloss: 그는 차가 더 좋대요. 너무 진하다고 생각해요.
    note: '*prefers*와 *thinks*는 3인칭 단수(*he*/*she*)에 쓰는 형태로, 끝에 *-s*가 붙어요.'
