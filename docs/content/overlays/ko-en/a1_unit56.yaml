  en.a1.unit56.lesson01.teach.table:
    title: table
    gloss: 테이블
    note: '*table*은 "테이블"이라는 뜻이에요.'
    example_gloss: 우리 테이블은 창가에 있어요.
  en.a1.unit56.lesson01.teach.menu:
    title: menu
    gloss: 메뉴판
    note: '*menu*는 "메뉴판"이라는 뜻이에요.'
    example_gloss: 메뉴판 좀 볼 수 있을까요?
  en.a1.unit56.lesson01.teach.order:
    title: order
    gloss: 주문하다
    note: '*order*는 "주문하다"라는 뜻이에요.'
    example_gloss: 치킨을 주문하고 싶어요.
  en.a1.unit56.lesson01.teach.bill:
    title: bill
    gloss: 계산서
    note: '*bill*은 "계산서"라는 뜻이에요.'
    example_gloss: 계산서는 10달러였어요.
  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: 이 테이블 비어 있어요?
    note: 여기서 *free*는 "비어 있는"이라는 뜻이에요. "자유로운"이나 "무료"가 아니에요.
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: 지금 주문해도 돼요?
    note: '*Can I...?*는 직접 묻는 방식이에요. *could*보다 덜 격식 있어요.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: 샐러드로 주세요.
    note: '*I''d like*는 *I would like*를 줄인 말로, 주문할 때 쓰는 정중한 표현이에요.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: 샐러드는 얼마예요?
    note: '*How much is...?*는 가격을 묻는 표현이에요.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: 계산서 좀 주시겠어요?
    note: '*Could we have...?*는 정중하게 부탁하는 표현이에요. 한국어의 "~ 주시겠어요?"와 비슷해서, 영어에서는 *could*가 자연스럽고 공손한 말이에요.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: 맛있게 드세요!
    note: '*Enjoy your meal!*은 종업원이 식사 전에 하는 정해진 인사말이에요. 직역하면 "식사를 즐기세요"지만, 한국어의 "맛있게 드세요"와 짜임새가 달라요. 단어 하나하나가 아니라 한 덩어리로 외우세요.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: 레일라가 테이블에 대해 물어요
    gloss: 레일라가 말해요. "안녕하세요! 이 테이블 비어 있어요?"
    note: '*Is this table free?*에서 *free*는 "비어 있는"이라는 뜻이에요.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: 종업원이 테이블을 안내해요
    gloss: 종업원이 말해요. "네, 여기 앉으세요."
    note: '*please sit here*는 짧고 정중한 권유예요.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: 미아가 메뉴판을 부탁해요
    gloss: 미아가 말해요. "메뉴판 좀 볼 수 있을까요?"
    note: '*Could I see...?*에서도 정중한 *could*를 써요. *could we have the bill*과 같아요.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: 종업원이 메뉴판을 줘요
    gloss: 종업원이 말해요. "물론이죠, 여기 있습니다."
    note: '*Of course, here you are*는 무언가를 건넬 때 쓰는 정해진 표현이에요.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: 레일라의 주문
    gloss: 레일라가 말해요. "치킨으로 주세요."
    note: 하나의 정보예요. 레일라가 주문한 것은 치킨이에요.
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: 미아의 주문
    gloss: 미아가 말해요. "샐러드로 주세요."
    note: 하나의 정보예요. 미아가 주문한 것은 샐러드예요.
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: 종업원이 맛있게 먹으라고 말해요
    gloss: 종업원이 말해요. "좋은 선택이에요! 맛있게 드세요!"
    note: '*Enjoy your meal!*은 손님이 식사를 시작하기 전에 하는 정해진 마무리 인사예요.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: 레일라가 치킨 가격을 물어요
    gloss: 레일라가 말해요. "치킨은 얼마예요?"
    note: '*How much is...?*는 가격을 묻는 표현이에요.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: 치킨 가격
    gloss: 종업원이 말해요. "치킨은 12달러예요."
    note: 하나의 정보예요. 치킨의 가격이고, 샐러드나 전체 계산서와는 달라요.
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: 미아가 샐러드 가격을 물어요
    gloss: 미아가 말해요. "샐러드는 얼마예요?"
    note: '*How much is...?*는 치킨을 물을 때와 같은 질문 형태예요.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: 샐러드 가격
    gloss: 종업원이 말해요. "샐러드는 7달러예요."
    note: 두 번째 정보예요. 샐러드의 가격이에요.
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "레일라가 계산서를 요청해요"
    gloss: 레일라가 말해요. "계산서 좀 주시겠어요?"
    note: '*Could we have...?*에서도 정중한 *could*를 써요.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: 전체 계산서
    gloss: 종업원이 말해요. "19달러입니다."
    note: 세 번째 정보예요. 전체 계산서이고, 치킨과 샐러드 각각의 가격과는 달라요.
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: 메뉴판
    gloss: '식당 메뉴판: 치킨 - $12. 샐러드 - $7. 피자 - $10. 주스 - $3.'
    note: 메뉴판에는 네 가지 음식과 가격이 나와 있어요.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: '글: 식당에서 한 식사'
    gloss: 어느 날 저녁, 레일라와 미아는 시내의 새 식당에 가 보기로 했어요. 종업원이 두 사람을 창가 테이블로 안내했어요. 종업원은 치킨, 샐러드, 피자, 주스가 있는 메뉴판을 가져다주었어요. 레일라는 치킨을, 미아는 샐러드를 주문했어요. 치킨은 12달러였고 샐러드는 7달러였어요. 식사하는 동안 두 사람은 미아의 사진 수업에 대해 이야기했어요. 식사를 마치자 종업원이 계산서를 가져왔어요. 두 사람 합쳐 19달러였어요. 레일라는 식당이 훌륭했다고 말했고, 미아는 다음에는 대니얼을 데려오고 싶다고 말했어요.
    note: '*ordered*는 *order*(주문하다)의 과거형이에요.'
