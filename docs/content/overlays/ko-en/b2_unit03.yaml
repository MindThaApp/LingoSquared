teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: 단정을 피해 완곡하게 말하다
    note: '*hedge*는 말을 덜 단정적으로 만든다는 뜻이에요. 한국어 ''조금'', ''약간''을 무조건 *a little*로 옮기지 마세요.'
    example_gloss: 레일라는 seems를 써서 정책에 대한 자기 주장을 완곡하게 말해요.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: 단서를 달아 제한하다
    note: '*qualify*는 조건이나 예외를 달아서 어떤 말의 범위를 제한한다는 뜻이에요.'
    example_gloss: '''provided we agree''라는 표현이 레일라의 지지에 단서를 달아요.'
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: 강조하다
    note: '*emphasize*는 전하려는 말의 일부를 더 강하게 만든다는 뜻이에요.'
    example_gloss: 다니엘은 업무량 문제를 강조해요.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: 어느 정도는
    note: '*to some extent*는 ''조금''을 전부 *a little*로 옮기는 것보다 더 자연스럽게 들릴 때가 많아요.'
    example_gloss: 어느 정도는 그 정책이 팀의 우려에 답하고 있어요.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: 대체로, 큰 틀에서
    note: '*broadly*는 예외의 여지를 남기면서 전반적인 지지나 일반적인 사실을 나타내요.'
    example_gloss: 그 제안은 완벽하지는 않지만 대체로 유용해요.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: ~라는 조건으로, ~한다면
    note: '*provided*는 조건을 끌어와요. 한국어 ''~라는 조건으로''와 비슷하지만, 영어에서는 격식 있고 전문적인 느낌이 나는 경우가 많아요.'
    example_gloss: 우리가 합의한다면 그 정책을 지지할 수 있어요.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: 신중함과 강조를 함께 쓰기
    gloss: 그 정책은 합리적인 것 같지만, 팀에 추가 업무가 생기는 것은 사실이에요.
    note: '*seems*는 긍정적인 말을 덜 단정적으로 만들고, *does create*는 추가 업무가 실제로 생긴다는 점을 강조해요. 한국어에서도 ''추가 업무가 생기긴 한다''처럼 ''~긴 하다''로 비슷한 강조를 해요.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: 하나의 우려에 초점 맞추기
    gloss: 제가 걱정하는 것은 팀의 추가 업무예요.
    note: '*What worries me is...*는 한 가지 요점을 앞에 내세워 거기에 초점을 맞춰요. 그 뒤에도 영어 어순을 지키세요: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: 조건을 단 전반적 지지
    gloss: 일정이 조정된다면 대체로 유용해요.
    note: '*broadly useful, provided...*는 분명한 조건을 단 지지를 나타내요.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: 단서와 강조
    gloss: 주장을 완곡하게 하거나 제한하려면 seems, broadly, to some extent를 쓰세요. 어떤 일이 사실임을 강조하려면 주동사 앞에 do나 does를 쓰세요. 한 가지 요점에 주의를 모으려면 What matters is... 나 What worries me is...를 쓰세요.
    note: '*does create*에서 *does*는 ''하다''라는 뜻의 동사가 아니라 *create*를 강조하는 조동사예요. 한국어의 ''만들긴 한다''에서 ''~긴''이 하는 역할과 비슷해요.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: 전체적으로 보면
    note: '*overall*은 세부 사항이나 예외가 있더라도 전체를 보고 판단한다는 뜻이에요.'
    example_gloss: 전체적으로 보면 레일라는 그 정책을 지지해요.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: 조건
    note: '*condition*은 어떤 것이 성립하기 전에 충족되어야 하는 요건이에요.'
    example_gloss: 그녀의 조건은 일정이 조정되어야 한다는 거예요.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: '읽기 지문: 조건부 지지'
    gloss: 레일라의 피드백은 긍정적이지만 신중하게 단서가 붙어 있어요. 그녀는 리뷰 정책이 전체적으로 합리적인 것 같다고 말하는데, 이는 주장을 완곡하게 해서 단정적으로 들리지 않게 해요. 또 일정이 조정된다면 대체로 유용하다고 말해요. 그 조건이 지지를 제한해요. 그녀는 정책을 쓰인 그대로 받아들이는 것이 아니에요. 다니엘은 초점을 맞추는 구문으로 다른 점을 강조해요. 그가 걱정하는 것은 팀의 추가 업무라는 거예요. 두 사람 모두 원칙적으로는 그 정책을 지지하지만, 쓰는 표현에서 확신의 정도가 서로 다르게 드러나요.
    note: 이 글은 같은 기본 내용을 어떻게 더 부드럽게, 더 강하게, 더 조건부로 말할 수 있는지 보여 줘요.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: 레일라가 완곡하게 말해요
    gloss: '레일라: 새 리뷰 정책은 전체적으로 합리적인 것 같아요.'
    note: '*seems reasonable overall*은 비판보다는 긍정적이지만, 단정적이지는 않아요.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: 다니엘이 신중함을 알아차려요
    gloss: '다니엘: 조금 신중하게 들리네요. 아직 완전히 준비되지 않았다는 뜻인가요?'
    note: 다니엘은 레일라가 단순히 *it is ready*라고 말하지 않는다는 걸 눈치채요.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: 레일라가 더 단서를 달아요
    gloss: '레일라: 맞아요. 쓸 만할 수는 있지만, 더 분명한 마감일이 필요해요.'
    note: '*may be workable*은 의심의 여지를 남기고, *but*은 한계를 말해요.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: 다니엘이 초점을 맞춰요
    gloss: '다니엘: 동의해요. 제가 걱정하는 것은 팀의 추가 업무예요.'
    note: '*What worries me is...*는 우려에 초점을 맞춰요.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: 레일라가 does로 강조해요
    gloss: '레일라: 맞는 말이에요. 그 정책은 품질 검사를 실제로 개선하긴 하지만, 승인 단계도 하나 더 추가해요.'
    note: '*does create*는 뒤에 오는 한계에도 불구하고 이 장점이 실제로 존재한다는 점을 강조해요.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: 다니엘이 조건을 정리해요
    gloss: '다니엘: 그러니까 조건을 달고 지지해야 한다는 거죠?'
    note: 그는 레일라의 단서가 붙은 지지를 요약해요.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: 레일라가 조건부 지지를 표명해요
    gloss: '레일라: 네. 일정이 조정된다면 대체로 유용하다고 말하고 싶어요.'
    note: '*provided*는 여기서 ''~라는 조건으로''라는 뜻이에요. 조건이 충족될 때만 지지가 유효해요.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: 같은 내용, 세 가지 강도
    gloss: 그 정책은 추가 업무를 만들어요. 그 정책은 추가 업무를 만드는 것 같아요. 그 정책은 추가 업무를 만들긴 해요.
    note: 세 문장으로 중립적인 표현, *seems to*로 더 완곡한 표현, *does*로 더 강조하는 표현을 연습해요.
