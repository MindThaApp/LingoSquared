      status: correct
    - value: Provided
      status: correct
    feedback: '*provided*는 여기서 ''~라는 조건으로'', ''~한다면''이라는 뜻이에요.'
  en.b2.unit03.lesson02.exercise01.choose_hedged_claim:
    instruction: 주장을 단정적이지 않고 더 조심스럽게 만드는 표현은 어느 것일까요?
