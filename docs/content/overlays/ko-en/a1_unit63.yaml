    title: '읽기: 친절한 이웃'
teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: 돕다 / 도움
    note: '*help*는 동사 ''돕다''도 되고 명사 ''도움''도 돼요. 한국어에서는 ''저를 도와주세요''처럼 ''~를''을 쓰는데, 영어에서도 *help me*처럼 *to* 없이 바로 써요.'
    example_gloss: 저 좀 도와줄래요?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: 나르다, 들다
    note: '*carry*는 무언가를 들고 한 곳에서 다른 곳으로 옮기는 것을 뜻해요.'
    example_gloss: 제가 들 수 있어요.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: 무거운
    note: '*heavy*는 무게가 ''무거운''이라는 뜻이에요.'
    example_gloss: 이거 무거워요.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: 가방
    note: '*bag*은 ''가방''이에요. 봉지나 자루를 가리킬 때도 써요.'
    example_gloss: 이 가방은 무거워요.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: 문
    note: '*door*는 ''문''이에요.'
    example_gloss: 문을 열어 주세요.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: 선반
    note: '*shelf*는 벽이나 장에 달린 ''선반''이에요. 복수형은 *shelves*예요.'
    example_gloss: 선반에 올려 놓으세요.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: 저 좀 도와줄래요?
    note: '*Can you...?*는 도움을 청하는 직접적이고 일반적인 표현이에요.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: 이 가방은 무거워요.
    note: 가까이 있는 가방을 가리킬 때는 *this bag*을 써요.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: 문 좀 열어 주실래요?
    note: '*Could you...?*는 *Can you...?*보다 더 공손하게 들려요. 한국어의 ''~해 주실래요?''와 비슷한 느낌이에요.'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: 제가 도와줄 수 있어요.
    note: 이 문장은 도움을 주겠다고 제안하는 말이에요.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: 도와줘서 고마워요.
    note: '*Thank you for...*에서 *for*는 고마운 이유를 나타내요. 한국어의 ''~해서 고마워요''와 같아요.'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: 선반에 올려 놓으세요.
    note: '*put it on...*은 무언가를 어디에 ''놓다, 올려 두다''라는 뜻이에요. 영어는 놓는 방식에 따라 동사를 바꾸지 않고, 올려 놓든 세워 놓든 모두 *put*을 써요.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: 레일라가 도움을 청해요
    gloss: 레일라가 말해요. 안녕, 다니엘. 저 좀 도와줄래요?
    note: '*Can you help me?*는 도움을 청하는 기본 문장이에요.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: 다니엘이 무엇이 필요한지 물어요
    gloss: 다니엘이 말해요. 물론이죠. 뭐가 필요해요?
    note: '*Of course*는 ''물론이죠''라는 뜻이에요.'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: 가방이 무거워요
    gloss: 레일라가 말해요. 이 가방이 무거워요.
    note: '*heavy*는 왜 도움이 필요한지 설명해 줘요.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: 다니엘이 가방을 들어 줘요
    gloss: 다니엘이 말해요. 제가 들 수 있어요.
    note: '*carry it*에서 *it*은 가방을 가리켜요. 영어는 사물을 *it*으로 가리켜요. 한국어에서는 ''그것''이나 ''가방을''처럼 생략하는 경우가 많지만, 영어에서는 *it*을 꼭 써야 해요.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: 레일라가 문도 열어 달라고 해요
    gloss: 레일라가 말해요. 문도 열어 주실래요?
    note: '*Could you...?*는 부탁을 공손하게 만들어요.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: 다니엘이 선반에 대해 물어요
    gloss: 다니엘이 말해요. 네. 가방을 선반에 올려 놔도 될까요?
    note: 다니엘은 *Can I ...?*로 가방을 선반에 올려 놓겠다고 제안해요.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: 레일라가 다니엘에게 고마워해요
    gloss: 레일라가 말해요. 네, 부탁해요. 도와줘서 고마워요.
    note: '*Thank you for your help*는 고마움을 전하는 굳어진 표현이에요.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: 다니엘이 대답해요
    gloss: 다니엘이 말해요. 별거 아니에요.
    note: '*No problem*은 짧고 친근한 대답이에요.'
  en.a1.unit63.lesson04.teach.help_note:
    title: 도움 쪽지
    gloss: '도움 쪽지: 파란 가방이 무거워요. 문 옆 선반에 올려 놔 주세요.'
    note: 이 쪽지는 어떤 가방인지, 그리고 어디에 놓아야 하는지 알려 줘요.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: '글: 친절한 이웃'
    gloss: '친절한 이웃: 레일라에게 무거운 파란 가방이 있었어요. 레일라는 문 근처에 있는 다니엘을 보고 도와 달라고 했어요. 다니엘은 가방을 안으로 들어 줬어요. 레일라는 문도 열어 달라고 부탁했어요. 그다음에 다니엘은 가방을 문 옆 선반에 올려 놨어요. 레일라는 도와줘서 고맙다고 다니엘에게 말했어요. 다니엘은 별거 아니라고 말했어요. 나중에 레일라는 짧은 쪽지를 썼어요. 파란 가방은 선반 위에 있어요.'
    note: '*carried*는 *carry*의 과거형이에요.'
