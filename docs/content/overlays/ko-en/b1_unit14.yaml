    title: Could we possibly keep this short?
teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: ~하는 것이 가능할까요
    note: '*would it be possible to*는 어떤 일이 가능한지 공손하게 물을 때 써요.'
    example_gloss: 회의를 목요일로 옮기는 것이 가능할까요?
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: ~해 주실 수 있을지 궁금했어요
    note: '*I was wondering if*를 쓰면 부탁이 더 간접적이고 조심스럽게 들려요.'
    example_gloss: 제 보고서를 오늘 검토해 주실 수 있을지 궁금했어요.
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: 혹시 ~해도 될까요
    note: '*could we possibly*는 함께 할 일을 공손하게 제안하거나 부탁할 때 써요.'
    example_gloss: 회의를 혹시 5분 늦게 시작해도 될까요?
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: ~해 주시면 감사하겠어요
    note: '*I would appreciate it if*는 상대가 어떤 일을 해 주면 고맙겠다고 말하는 표현이에요.'
    example_gloss: 회의록을 곧 보내 주시면 감사하겠어요.
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: 회의 안건
    note: '*agenda*는 회의에서 다룰 주제의 목록을 뜻해요.'
    example_gloss: 대니얼은 안건에 항목을 하나 더 추가했어요.
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: 후속 조치를 하다, 다시 연락하다
    note: '*follow up*은 회의나 업무가 끝난 뒤에 다시 연락하거나 후속 조치를 한다는 뜻이에요.'
    example_gloss: 미아는 회의 후에 이메일로 다시 연락할 거예요.
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: 회의를 목요일로 옮기는 것이 가능할까요?
    note: '*would it be possible to* + 동사원형은 변경을 공손하게 부탁할 때 써요.'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: 제 보고서를 오늘 검토해 주실 수 있을지 궁금했어요.
    note: '*I was wondering if you could*는 간접적이고 공손하게 부탁하는 표현이에요.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Abgeschwächte Bitten bei der Arbeit
    gloss: 직장에서 격식 있게 부탁할 때는 직접적인 명령 대신 *Would it be possible to...*나 *I was wondering if...*처럼 부드러운 가정형 표현을 써요. 이런 표현은 *Move the meeting*이나 *Review my report*보다 훨씬 공손하게 들려요.
    note: '형태: 직접적인 명령 대신 부드러운 가정형 표현을 써요.'
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: 예산 업데이트
    note: '*budget update*는 돈이 어떻게 쓰이고 있는지에 대한 보고를 뜻해요.'
    example_gloss: 대니얼은 회의에 쓸 예산 업데이트를 준비했어요.
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: 그 후에, 나중에
    note: '*afterward*는 다른 일이 끝난 뒤의 시간을 뜻해요.'
    example_gloss: 회의록은 그 후에 검토하면 돼요.
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Nachricht vor dem Meeting'
    gloss: 안녕하세요, 대니얼. 잘 지내시길 바라요. 내일 회의 안건에 예산 업데이트를 추가해 주실 수 있을까요? 최신 수치를 가져와 주시면 감사하겠어요. 끝나고 질문할 시간이 있도록 혹시 10분 일찍 시작해도 될까요? 감사합니다, 미아
    note: 공손한 부탁이 담긴 짧고 전문적인 메시지예요.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: Die Teamleitung eröffnet das Meeting höflich
    gloss: '팀장이 말해요: 좋은 아침이에요, 미아. 오늘은 예산 업데이트부터 시작해도 될까요?'
    note: '*would it be possible to*는 회의 순서를 공손하게 물을 때 써요.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia macht eine zusätzliche Bitte
    gloss: '미아가 말해요: 물론이죠. 새 고객도 안건에 추가하면 어떨까 하고 생각했어요.'
    note: '*I was wondering if we could*는 무언가를 간접적이고 공손하게 제안하는 표현이에요.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: Die Teamleitung bittet um ein kurzes Meeting
    gloss: '팀장이 말해요: 좋은 생각이에요. 이번 회의를 혹시 30분 안에 끝낼 수 있을까요?'
    note: '*could we possibly*는 둘이 함께 할 일을 공손하게 부탁하는 표현이에요.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia bittet um etwas für das nächste Mal
    gloss: '미아가 말해요: 최선을 다할게요. 다음에는 모두가 미리 질문을 보내 주면 감사하겠어요.'
    note: '*I would appreciate it if*는 고맙겠다는 뜻을 담은 표현이에요.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: Die Teamleitung stimmt zu und verspricht nachzufassen
    gloss: '팀장이 말해요: 타당한 요청이네요. 다음 회의 전에 제가 다시 알림을 보낼게요.'
    note: 여기서 *follow up*은 나중에 다시 그 일을 챙긴다는 뜻이에요.
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia schließt mit einer Bestätigung
    gloss: '미아가 말해요: 감사합니다. 업데이트된 안건은 오늘 오후에 보낼게요.'
    note: 짧고 공손하게 대화를 마무리하는 말이에요.
