teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: 약국
    note: '*pharmacy*는 약을 받을 수 있는 가게예요.'
    example_gloss: 병원 옆에 약국이 있어요.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: 약사
    note: '*pharmacist*는 약을 내주는 사람이에요.'
    example_gloss: 약사가 약을 어떻게 먹는지 설명해 줬어요.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: 알약
    note: '*tablet*은 삼켜서 먹는 단단한 알 하나를 뜻해요.'
    example_gloss: 아침에 한 알, 저녁에 한 알 먹어요.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: 복용량
    note: '*dose*는 한 번에 먹는 약의 양이에요.'
    example_gloss: 복용량은 하루에 두 번, 한 알씩이에요.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: 리필 / 약 추가분
    note: '*refill*은 다시 병원에 가지 않고도 받는 같은 약의 새 한 통이에요.'
    example_gloss: 알약이 거의 다 떨어져서 리필이 필요해요.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: 부작용
    note: '*side effects*는 약이 몸에 일으킬 수 있는 추가적인 반응이에요.'
    example_gloss: 약사가 이 약의 부작용을 설명해 줬어요.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: 얼마나 자주 복용하는지 말하기
    gloss: 하루에 한 번, 하루에 두 번, 하루에 세 번, 여덟 시간마다
    note: '*once a day* = 하루에 한 번, *twice a day* = 하루에 두 번, *three times a day* = 하루에 세 번, *every eight hours* = 여덟 시간마다.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: 왜 카운터에 서 있는지 말하기
    gloss: 처방전을 찾으러 왔어요.
    note: '*I''d like to...*는 원하는 것을 말하는 공손한 기본 표현이에요.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: 들을 수 있는 복용량 표현
    gloss: 하루에 두 번, 식사와 함께 한 알씩 드세요.
    note: '*with food*는 ''음식과 함께''라는 뜻이라서 빈속에 먹지 않아요.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: 얼마 동안 복용해야 하는지 묻기
    gloss: 며칠 동안 먹어야 하나요?
    note: '*How many...?*는 날짜처럼 셀 수 있는 것에 써요.'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: 부작용 묻기
    gloss: 부작용이 있나요?
    note: '*Are there any...?*는 무언가가 있는지 물을 때 쓰는 일반적인 표현이에요.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: 지시에 쓰는 should와 shouldn't
    gloss: 식사와 함께 드시는 게 좋아요. 중간에 끊으시면 안 돼요.
    note: '*should*는 조언이나 지시를 나타내고, *shouldn''t*는 그 부정형이에요.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: 자기 전에
    note: '*before bed*는 잠자리에 들기 전이라는 뜻이에요.'
    example_gloss: 어떤 약은 자기 전에 먹으면 더 잘 들어요.
  en.a2.unit35.lesson03.teach.label_text:
    title: 약국 라벨
    gloss: '감기약. 하루 두 번, 식사와 함께 한 알씩 5일 동안 복용하세요. 알약을 일찍 중단하지 마세요. 가능한 부작용: 피곤함을 느낄 수 있습니다. 리필: 1회.'
    note: 약 라벨은 짧고 간단해요. 문장이 짧고 공손한 표현을 쓰지 않아요.
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: 라벨의 주의 문구
    gloss: 알약 복용을 일찍 중단하지 마세요.
    note: '*Do not...*은 라벨이나 표지판에서 볼 수 있는 금지 명령문이에요.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: 대니얼이 카운터에서 접수한다
    gloss: '다니엘이 말해요: 안녕하세요, 처방전을 찾으러 왔어요.'
    note: '*Hi*는 *Hello*보다 가벼운 인사지만 카운터에서도 흔히 써요.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: 약사가 이름을 묻는다
    gloss: '약사가 말해요: 네, 그럼요. 성함이 어떻게 되세요?'
    note: 여기서 *Of course*는 '네, 그럼요'라는 뜻이에요.
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: 대니얼이 약을 먹는 이유를 말한다
    gloss: '다니엘이 말해요: 다니엘이에요. 의사가 심한 감기약을 처방해 줬어요.'
    note: 28단원에서 병원에 간 이야기와 이어져요. 같은 감기예요.
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: 약사가 복용량을 말한다
    gloss: '약사가 말해요: 여기 있어요. 하루에 두 번, 식사와 함께 한 알씩 드세요.'
    note: '*Here it is*는 무언가를 건넬 때 하는 말이에요.'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: 대니얼이 기간을 묻는다
    gloss: '다니엘이 물어요: 며칠 동안 먹어야 하나요?'
    note: 2과의 질문과 같아요.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: 약사의 대답
    gloss: '약사가 말해요: 5일 동안요. 알약을 일찍 중단하지 마세요.'
    note: 3과 라벨에 있던 지시와 같아요.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: 대니얼이 부작용을 묻는다
    gloss: '다니엘이 물어요: 부작용이 있나요?'
    note: 2과의 질문과 같아요.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: 약사가 부작용을 말한다
    gloss: '약사가 말해요: 피곤할 수 있지만 그게 다예요.'
    note: 여기서 *but that's all*은 '그게 전부예요'라는 뜻이에요.
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: 대니얼이 약사에게 고마워한다
    gloss: '다니엘이 말해요: 정말 감사합니다.'
    note: '*very much*는 감사를 더 강조해 줘요.'
