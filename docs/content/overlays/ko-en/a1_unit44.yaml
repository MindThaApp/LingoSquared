  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: 미아의 질문
    gloss: '미아: 레일라, 가장 좋아하는 계절이 뭐예요?'
    note: '*What''s your favorite ...?*는 무엇을 가장 좋아하는지 묻는 말이에요.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "레일라의 대답"
    gloss: '레일라: 가을이요. 나뭇잎 색이 변하고, 밖에서 그림 그리기에 딱 좋은 날씨예요.'
    note: '*great weather for painting outside*는 ''밖에서 그림 그리기에 딱 좋은 날씨''라는 뜻이에요.'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: 미아의 반응
    gloss: '미아: 좋네요. 저는 봄을 가장 좋아해요.'
    note: '*My favorite season is spring*은 ''제가 가장 좋아하는 계절은 봄이에요''라는 뜻이에요.'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: 레일라의 질문
    gloss: '레일라: 왜 봄이에요?'
    note: '*Why spring?*은 이유를 묻는 짧은 표현이에요.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "미아의 대답"
    gloss: '미아: 꽃이 피고, 사진 수업 때문에 꽃 사진을 찍는 걸 정말 좋아해요.'
    note: '*I love taking photos*는 ''사진 찍는 것을 정말 좋아해요''라는 뜻이에요.'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: 레일라의 질문
    gloss: '레일라: 그럴 만하네요! 당신이 사는 곳은 봄이 따뜻해요, 추워요?'
    note: '*That makes sense!*는 좋은 설명을 들었을 때 하는 자연스러운 반응이에요.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "미아의 대답"
    gloss: '미아: 보통 따뜻하고 비가 조금 와요. 밖에서 걸어 다니기에 딱 좋아요.'
    note: '*with a little rain*은 ''비가 조금 오는''이라는 뜻이에요.'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: 세 가지 좋아하는 계절에 관한 글
    gloss: 대니얼, 레일라, 미아는 모두 좋아하는 계절이 달라요. 대니얼이 가장 좋아하는 계절은 여름이에요. 날씨가 따뜻하고 화창할 때 축구를 하거나 달리기하는 것을 좋아해요. 레일라가 가장 좋아하는 계절은 가을이에요. 색이 변하는 나뭇잎을 그리는 것을 좋아하기 때문이에요. 미아가 가장 좋아하는 계절은 봄이에요. 사진 수업 때문에 꽃 사진을 찍어요. 좋아하는 계절은 서로 달라도, 이들은 언제나 시간을 내서 함께 야외를 즐겨요.
    note: '*even though*는 ''~이지만'', ''비록 ~일지라도''라는 뜻이에요.'
