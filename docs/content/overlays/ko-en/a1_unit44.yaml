    gloss: 여름에
    note: '*in the summer*는 ''여름에''라는 뜻이에요. 한국어에는 관사가 없지만 영어에는 있어요. 계절 앞의 관사는 흔히 생략할 수 있어서 *in summer*와 *in the summer* 둘 다 맞아요. *in spring*, *in fall*, *in winter*도 마찬가지예요.'
