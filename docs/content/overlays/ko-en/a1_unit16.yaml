    gloss: 저는 아침에 옷을 입어요.
    note: '*in the morning*은 정확한 시각이 아니라 하루 중 한 시간대를 말해요. 한국어의 ''아침에''는 영어로 *in the morning*이라고 해요.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: 저는 보통 11시에 자요.
    note: '*usually*는 ''보통, 대개''라는 뜻으로, 항상 똑같지는 않은 습관을 나타내요. 어순에 주의하세요. 영어에서 *usually*는 일반 동사 앞에 와요(*I usually go*). 한국어에서는 ''저는 보통 11시에 자요''처럼 부사가 비교적 자유롭게 움직이지만, 영어에서는 *I go usually to bed*라고 하면 틀려요.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: 그다음에, 그러고 나서
    note: '*then*은 ''그다음에, 그러고 나서''라는 뜻으로, 일이 일어나는 순서를 보여 줘요.'
    example_gloss: 저는 아침을 먹고 그다음에 출근해요.
  en.a1.unit16.lesson03.teach.routine_text:
    title: 하루 일과에 대한 글
    gloss: 매일 저는 7시에 일어나요. 그다음에 옷을 입고 아침을 먹어요.
    note: 아침 일과를 짧게 설명한 글이에요.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: 그다음에는 뭐 해요?
    note: '*What do you do after that?*은 하루 일과에서 다음에 무엇을 하는지 묻는 말이에요.'
  en.a1.unit16.lesson04.teach.q_wake_time:
