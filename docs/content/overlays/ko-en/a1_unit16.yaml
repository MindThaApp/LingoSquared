    gloss: 레일라가 물어요. 몇 시에 일어나요?
    note: 앞에서와 같은 질문이에요.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: 일어나는 시간에 대한 대답
    gloss: 다니엘이 말해요. 저는 매일 7시에 일어나요.
    note: 완전한 대답에는 시각과 매일 반복된다는 말이 모두 들어 있어요.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: 그다음 일과 물어보기
    gloss: 레일라가 물어요. 그다음에는 뭐 해요?
    note: 이 질문은 하루 일과에 관한 대화를 자연스럽게 이어 줘요.
  en.a1.unit16.lesson04.teach.a_full_routine:
