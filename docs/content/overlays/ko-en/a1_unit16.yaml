teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: 일어나다, 잠에서 깨다
    note: '*wake up*은 ''잠에서 깨다''라는 뜻이에요. 동사와 부사가 따로 쓰이는 두 단어 표현이에요.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: 옷을 입다
    note: '*get dressed*는 ''옷을 입다''라는 뜻이에요. 한국어에서는 ''옷을 입다''라고 하지만 영어에서는 *get yourself dressed*라고 하지 않고, 보통 *get dressed*라고만 해요.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: 출근하다, 일하러 가다
    note: '*go to work*는 ''출근하다, 일하러 가다''라는 뜻이에요. 이 굳어진 표현에서는 *work* 앞에 관사를 쓰지 않아요.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: 저녁을 먹다
    note: '*have dinner*는 ''저녁을 먹다''라는 뜻이에요. 식사 이름에는 관사를 쓰지 않아요. *have breakfast*, *have lunch*, *have dinner*처럼 말해요.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: 자러 가다, 잠자리에 들다
    note: '*go to bed*는 자려고 잠자리에 든다는 뜻이에요. 여기서도 *bed* 앞에 관사를 쓰지 않아요.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: 몇 시에 일어나요?
    note: '*What time do you wake up?*은 일어나는 시간을 묻는 말이에요. *do*를 쓰는 질문에는 조동사가 필요해요. *What time wake you up*이라고 하면 안 돼요.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: 저는 매일 7시에 일어나요.
    note: '*every day*는 매일 하는 습관을 말할 때 써요. 문장 끝이나 문장 맨 앞에 와요.'
  en.a1.unit16.lesson02.teach.in_the_morning:
