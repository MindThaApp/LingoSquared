teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: 계약 조항, 합의의 세부 항목
    note: '*term*은 합의의 한 항목이에요. 여기서는 학교의 학기라는 뜻이 아니에요.'
    example_gloss: 조항은 계약의 한 부분이에요.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: 제안
    note: '*proposal*은 가능한 조건을 내놓는 제안이에요.'
    example_gloss: 제안은 가능한 조건을 내놓아요.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: 거절, 거부
    note: '*refusal*은 어떤 조건을 받아들일 수 없다고 말하는 거예요. 영어에서는 분명한 거절도 이유를 덧붙이면 대개 더 좋게 들려요.'
    example_gloss: 거절은 어떤 조건을 받아들일 수 없다고 말하는 거예요.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: 양보
    note: '*concession*은 합의가 가능하도록 자기 입장의 일부를 포기한다는 뜻이에요.'
    example_gloss: 양보는 입장의 일부를 내려놓는 거예요.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: 작업 범위
    note: '*scope*는 포함되는 작업의 양이에요. 협상에서는 마감일과 범위를 서로 맞바꿔 조정할 수 있어요.'
    example_gloss: 범위는 포함되는 작업의 양이에요.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: 전제 조건
    note: '*condition*은 합의가 효력을 가지려면 먼저 충족되어야 하는 것이에요.'
    example_gloss: 조건은 합의가 효력을 가지기 전에 충족되어야 해요.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: 조건부 양보
    gloss: 범위가 줄어든다는 조건으로 더 이른 마감일에 동의할 수 있어요.
    note: '*I can agree... on condition that...*은 분명하면서도 전문적인 표현이에요. 말을 흐려서 부드럽게 만들지 않아요.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: 분명하게 거절하기
    gloss: 전체 범위를 그대로 두고 화요일로 하는 것에는 동의할 수 없어요.
    note: '*I cannot agree to...*는 *No, that is impossible*처럼 잘라 말하는 것보다 훨씬 업무에 맞게 들려요.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: if로 받아들이기
    gloss: 다음 주에 전체 부록이 이어진다면 그것을 받아들일 수 있어요.
    note: '*I can accept that if...*는 조건을 분명히 드러내요.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: 거절하면서도 협상 이어가기
    gloss: 분명하게 선을 그을 때는 I cannot agree를 쓰세요. 조건부 양보를 제안할 때는 I can agree on condition that을 쓰세요.
    note: 너무 직설적인 말은 영어에서 거칠게 들릴 수 있어요. 한계선, 이유, 조건을 함께 제시하세요.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: 경영진용 요약, 핵심 요약본
    note: '*executive summary*는 보고서의 핵심 내용을 담은 짧은 요약이에요.'
    example_gloss: 경영진용 요약은 보고서의 핵심을 담고 있어요.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: 도표, 차트
    note: '*charts*는 정보를 눈으로 보여 줘요.'
    example_gloss: 차트는 정보를 시각적으로 보여 줘요.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: '읽기 지문: 수정된 조건'
    gloss: 프리야는 처음에 전체 보고서의 마감일로 목요일을 제안했어요. 고객에게 더 일찍 필요했기 때문에 마커스가 반대했어요. 프리야는 전체 범위로 화요일까지 하는 것은 품질을 위태롭게 하기 때문에 거절했어요. 그러고 나서 조건부 양보를 제안했어요. 범위를 경영진용 요약과 차트로 줄인다면 화요일이 가능하다는 거였어요. 마커스는 그 조건을 받아들이되 한 가지 조항을 덧붙였어요. 전체 부록은 다음 주에 이어서 내야 한다는 거였어요. 합의된 결과는 요약과 차트는 화요일, 부록은 다음 주였어요.
    note: 협상은 단호하지만 전문적이에요. 거절, 이유, 조건, 합의가 차례로 나와요.
  en.b2.unit07.lesson04.teach.q_thursday:
    title: 프리야가 제안해요
    gloss: 프리야가 말해요. 범위가 계획대로 유지된다면 보고서를 목요일까지 드릴 수 있어요.
    note: 프리야는 마감일을 곧바로 범위와 연결해요.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: 마커스가 반대해요
    gloss: 마커스가 말해요. 목요일은 고객에게 너무 늦어요. 화요일까지 줄 수 있어요?
    note: 그는 범위를 바로 바꾸지 않으면서 더 이른 마감일을 요구해요.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: 프리야가 이유를 대며 거절해요
    gloss: 프리야가 말해요. 전체 범위로 화요일까지 하는 것에는 동의할 수 없어요. 그러면 품질이 위태로워져요.
    note: 이유를 대면 거절이 전문적이고 덜 퉁명스럽게 들려요.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: 마커스가 조건을 물어봐요
    gloss: 마커스가 말해요. 무엇이 있으면 화요일이 가능할까요?
    note: 이 질문은 조건부 양보로 이어지는 문을 열어 줘요.
  en.b2.unit07.lesson04.teach.q_condition:
    title: 프리야가 조건을 내걸어요
    gloss: 프리야가 말해요. 범위가 경영진용 요약과 차트로 줄어든다는 조건으로 더 이른 마감일에 동의할 수 있어요.
    note: '*on condition that*은 분명하고 전문적인 표현이에요.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: 마커스가 추가 조건을 달아 받아들여요
    gloss: 마커스가 말해요. 다음 주에 전체 부록이 이어진다면 그걸 받아들일 수 있어요.
    note: 그는 받아들이되, 나머지가 언제 나오는지를 못 박아 둬요.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: 프리야가 합의를 마무리해요
    gloss: 프리야가 말해요. 좋아요. 요약과 차트는 화요일, 부록은 다음 주예요.
    note: '*Agreed*는 협상을 짧고 분명하게 마무리해요.'
