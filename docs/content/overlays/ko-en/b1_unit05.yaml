    note: '*on schedule*은 지연이 없다는 뜻이에요.'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: 상황 보고하기
    gloss: 일정이 조금 밀렸지만 금요일까지 끝낼게요.
    note: '*I''m a little behind schedule, but I''ll finish by...*는 지연을 솔직하게 알리면서 구체적인 기한을 말하는 표현이에요.'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: 상황 보고하기
    gloss: 저는 보고서를 담당하고 있어요. 프로젝트가 일정대로 진행되고 있어요. 저는 일정이 늦어졌어요.
    note: 이 세 문장은 직장에서 담당 업무와 진행 상황을 말할 때 흔히 쓰는 표현이에요.
