    example_gloss: 그는 기술적인 문제 때문에 일정이 밀렸어요.
  en.b1.unit05.lesson03.teach.reading_passage:
    title: '읽기: 대니얼의 주간 보고'
    gloss: 대니얼은 월간 영업 보고서를 담당하고 있어요. 매주 팀에 짧게 진행 상황을 알려 줘요. 이번 주에는 기술적인 문제 때문에 일정이 조금 밀렸지만, 금요일까지는 끝낼 수 있을 거라고 예상해요. 그는 지연에 대해 항상 팀에 사실대로 말해요.
    note: 대니얼이 지연에 대해 솔직하게 말하는 모습을 담은 짧은 읽기 글이에요.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: 대니얼이 미아에게 도움을 청한다
    gloss: '대니얼: 미아, 이 보고서 보내기 전에 검토하는 것 좀 도와줄 수 있어?'
    note: '*could you help me...*는 동료에게 정중하게 도움을 청하는 표현이에요.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: 미아가 승낙한다
    gloss: '미아: 물론이지. 어떤 도움이 필요해?'
    note: '*of course*는 친근하고 직접적으로 승낙하는 표현이에요.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: 대니얼이 필요한 것을 설명한다
    gloss: '대니얼: 숫자가 맞는지 확실히 하고 싶어서.'
    note: '*make sure*는 어떤 것이 맞는지 확인한다는 뜻이에요.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: 미아가 검토해 보겠다고 약속한다
    gloss: '미아: 문제없어. 오늘 오후에 확인하고 의견 보내 줄게.'
    note: '*I''ll check it this afternoon*은 시간을 정해서 하는 구체적인 약속이에요.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: 대니얼이 미아에게 고마워한다
    gloss: '대니얼: 고마워, 정말 감사해.'
    note: '*I really appreciate it*은 진심으로 고마움을 전하는 표현이에요.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: 미아가 추가 도움을 제안한다
    gloss: '미아: 별말씀을. 더 필요한 게 있으면 알려 줘.'
    note: '*let me know if...*는 더 도울 수 있다고 열어 두는 표현이에요.'
