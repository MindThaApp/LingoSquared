  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: 최신 정보, 업데이트
    note: '*update*는 일이 어떻게 진행되고 있는지에 대한 새로운 정보를 뜻해요.'
    example_gloss: 저는 매주 팀에 진행 상황을 알려 줘요.
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: 마감 기한
    note: '*deadline*은 어떤 일을 끝내야 하는 기한을 뜻해요.'
    example_gloss: 보고서 마감은 금요일이에요.
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: 보고서
    note: '*report*는 업무나 결과에 대해 쓴 문서를 뜻해요.'
    example_gloss: 저는 매달 영업 보고서를 써요.
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: 일정대로
