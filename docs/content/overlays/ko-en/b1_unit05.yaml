    example_gloss: 프로젝트가 일정대로 진행되고 있어요.
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: 일정보다 늦은, 지연된
    note: '*behind schedule*은 계획보다 느리게 진행되고 있다는 뜻이에요.'
    example_gloss: 우리는 이번 주에 일정이 조금 밀렸어요.
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: 담당 업무 말하기
    gloss: 저는 월간 보고서를 담당하고 있어요.
    note: '*I''m responsible for...*는 직장에서 자기 업무를 직접적으로 설명하는 표현이에요.'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: 일정대로 진행 중이라고 말하기
