    note: '*Here''s*는 *here is*의 줄임말이에요.'
  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: 미아가 프런트에 가요
    gloss: 미아가 말해요. 안녕하세요, 2박 예약을 했어요.
    note: '*we have a reservation*은 "예약을 했어요"라는 뜻이에요.'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: 직원이 맞이해요
    gloss: 직원이 말해요. 어서 오세요! 예약하신 성함이 어떻게 되세요?
    note: '*What''s the name on the reservation?*은 "예약하신 성함이 어떻게 되세요?"라는 뜻이에요.'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 제 이름, 레일라로 되어 있어요.
    note: 영어에서는 *it's under my name*처럼 *be* 동사와 *under*를 써서 "제 이름으로 되어 있어요"라고 말해요. 한국어의 "제 이름으로"를 그대로 옮긴 표현이 아니에요.
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: 직원이 열쇠를 줘요
    gloss: 직원이 말해요. 좋아요. 여기 열쇠 있어요. 두 분 방에는 침대가 두 개 있어요.
    note: '*Your room has two beds.*는 "방에 침대가 두 개 있어요"라는 뜻이에요.'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: 미아의 와이파이 질문
    gloss: 미아가 물어요. 방에 와이파이가 있나요?
    note: 앞에서 배운 질문을 다시 썼어요.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: 직원이 아침 식사를 안내해요
    gloss: 직원이 말해요. 네, 그리고 아침 식사는 아래층에서 7시부터 10시까지예요.
    note: '*from seven to ten*은 "7시부터 10시까지"라는 뜻이에요.'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: 레일라의 체크아웃 질문
    gloss: 레일라가 말해요. 감사합니다! 체크아웃은 몇 시예요?
    note: 앞에서 배운 질문 *What time is check-out?*을 다시 썼어요.
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: 직원이 체크아웃을 안내해요
    gloss: 직원이 말해요. 체크아웃은 11시예요.
    note: '*Check-out is at eleven o''clock.*는 "체크아웃은 11시예요"라는 뜻이에요.'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: 게스트하우스에서의 주말에 관한 글
    gloss: '게스트하우스에서의 주말: 미아와 레일라는 주말에 산으로 짧은 여행을 갔어요. 미아는 사진 찍는 것을 좋아하고 레일라는 그림 그리는 것을 좋아해서, 쉬기에 완벽한 곳이었어요. 게스트하우스에 도착해서 두 사람은 직원에게 11월 14일부터 16일까지 2박 예약을 했다고 말했어요. 직원이 예약하신 성함을 물었고, 레일라는 자기 이름으로 되어 있다고 답했어요. 방에는 침대가 두 개 있고 와이파이도 되었으며, 아침 식사는 매일 아침 7시부터 10시까지 포함되어 있었어요. 체크아웃은 11시였어요. 미아는 산 사진을 많이 찍었고, 레일라는 창밖 풍경을 작은 그림으로 그렸어요. 대니얼은 그 주말에 집에 남아서, 도서관에서 빌린 요리책의 요리법으로 혼자 저녁을 만들어 먹었어요. 미아와 레일라가 돌아오자 두 사람은 대니얼에게 사진과 그림을 보여 주었고, 대니얼은 정말 마음에 들어 했어요.'
    note: '*Their room had two beds and wifi*는 "두 사람의 방에는 침대가 두 개 있고 와이파이도 되었다"라는 뜻이에요.'
