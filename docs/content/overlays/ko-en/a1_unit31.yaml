teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: 키가 큰
    note: '*tall*은 사람의 키가 ''큰''이라는 뜻이에요.'
    example_gloss: 제 오빠는 키가 커요.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: 키가 작은
    note: '*short*는 여기서 사람의 키가 ''작은''이라는 뜻이에요. 머리카락이 ''짧은''이라고 할 때도 *short*를 써요.'
    example_gloss: 제 여동생은 키가 작아요.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: 머리카락
    note: '*hair*는 ''머리카락''이에요. 영어에서는 셀 수 없는 명사라서 *her hair is long*이라고 하고, *her hairs are long*이라고는 하지 않아요.'
    example_gloss: 그녀는 머리가 길어요.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: 금발의
    note: '*blond*는 ''금발의''라는 뜻이에요.'
    example_gloss: 그의 머리카락은 금발이에요.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: 곱슬곱슬한
    note: '*curly*는 ''곱슬곱슬한''이라는 뜻이에요.'
    example_gloss: 레일라는 곱슬머리예요.
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: 눈
    note: '*eyes*는 ''눈''이에요. 복수형이에요.'
    example_gloss: 저는 갈색 눈이에요.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: 파란색의
    note: '*blue*는 ''파란색의''라는 뜻이에요.'
    example_gloss: 그녀의 눈은 파란색이에요.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: 갈색의
    note: '*brown*은 ''갈색의''라는 뜻이에요.'
    example_gloss: 제 눈은 갈색이에요.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: 초록색의
    note: '*green*은 ''초록색의''라는 뜻이에요.'
    example_gloss: 그는 초록색 눈이에요.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: 안경
    note: '*glasses*는 ''안경''이에요. 항상 복수형으로 써요. *wears glasses*는 ''안경을 쓰고 있다''라는 뜻이에요.'
    example_gloss: 아버지는 안경을 쓰세요.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: 그녀는 어떻게 생겼어요?
    note: 문장 구조에 주의하세요. 한국어에서는 '그녀는 어떻게 생겼어요?'처럼 조동사 없이 물어요. 하지만 영어에서는 일반 동사(*look*)가 있는 질문에 항상 *does*나 *do*가 필요해요. *What does she look like?*라고 해야 하고, *What looks she like?*라고 하면 안 돼요. 이 *does*(do를 쓰는 의문문)를 빠뜨리는 실수가 가장 흔해요.
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: 레일라의 첫마디
    gloss: 레일라가 말해요. 오늘부터 새 동료가 일해요. 이름은 미아예요.
    note: '*starting today*는 ''오늘부터''라는 뜻이에요.'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: 다니엘의 질문
    gloss: 다니엘이 물어요. 어떻게 생겼어요?
    note: 한 번 더 do를 쓰는 의문문이에요. *does*를 빼먹지 마세요. 한국어처럼 조동사 없이 묻지 않아요.
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: 레일라의 설명
    gloss: 레일라가 말해요. 키가 크고, 곱슬곱슬한 금발이에요.
    note: '*She''s*는 *she is*의 줄임말이에요.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: 다니엘의 추가 질문
    gloss: 다니엘이 물어요. 안경을 써요?
    note: 여기서도 do를 쓰는 의문문이 필요해요. *Does she wear glasses?*라고 해야 하고, *Wears she glasses?*라고 하면 안 돼요.
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: 레일라의 대답
    gloss: 레일라가 말해요. 네, 써요. 눈도 초록색이에요.
    note: '*Yes, she does*는 조동사 *does*를 되풀이하는 짧은 긍정 대답이에요.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: 다니엘의 마지막 말
    gloss: 다니엘이 말해요. 알겠어요. 지금 문 앞에 있는 사람이 그녀 같아요.
    note: '*at the door*는 ''문 앞에''라는 뜻이에요.'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: 다니엘과 레일라에 대한 글
    gloss: 다니엘과 레일라는 좋은 친구지만 생김새는 서로 달라요. 다니엘은 키가 크고 검은 짧은 머리예요. 안경을 써요. 레일라는 키가 작고 갈색의 긴 곱슬머리예요. 레일라는 눈이 파란색이고, 다니엘은 눈이 갈색이에요. 둘 다 잘 웃어요.
    note: '*don''t look the same*은 ''서로 달라 보여요, 생김새가 달라요''라는 뜻이에요. 부정문에서도 do를 쓰는 형태(*don''t* = *do not*)가 필요해요.'
