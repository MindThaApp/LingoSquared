teaching:
  en.a1.unit03.lesson01.teach.zero:
    title: zero
    gloss: 영(0)
    note: '*zero*는 영어로 숫자 0이에요.'
    example_gloss: 저는 사과가 하나도 없어요.
  en.a1.unit03.lesson01.teach.one:
    title: one
    gloss: 하나(1)
    note: '*one*는 영어로 숫자 1이에요.'
    example_gloss: 저는 사과가 한 개 있어요.
  en.a1.unit03.lesson01.teach.two:
    title: two
    gloss: 둘(2)
    note: '*two*는 영어로 숫자 2이에요.'
    example_gloss: 저는 사과가 두 개 있어요.
  en.a1.unit03.lesson01.teach.three:
    title: three
    gloss: 셋(3)
    note: '*three*는 영어로 숫자 3이에요.'
    example_gloss: 저는 사과가 세 개 있어요.
  en.a1.unit03.lesson01.teach.four:
    title: four
    gloss: 넷(4)
    note: '*four*는 영어로 숫자 4이에요.'
    example_gloss: 저는 사과가 네 개 있어요.
  en.a1.unit03.lesson01.teach.five:
    title: five
    gloss: 다섯(5)
    note: '*five*는 영어로 숫자 5이에요.'
    example_gloss: 저는 사과가 다섯 개 있어요.
  en.a1.unit03.lesson01.teach.six:
    title: six
    gloss: 여섯(6)
    note: '*six*는 영어로 숫자 6이에요.'
    example_gloss: 저는 사과가 여섯 개 있어요.
  en.a1.unit03.lesson01.teach.seven:
    title: seven
    gloss: 일곱(7)
    note: '*seven*는 영어로 숫자 7이에요.'
    example_gloss: 저는 사과가 일곱 개 있어요.
  en.a1.unit03.lesson01.teach.eight:
    title: eight
    gloss: 여덟(8)
    note: '*eight*는 영어로 숫자 8이에요.'
    example_gloss: 저는 사과가 여덟 개 있어요.
  en.a1.unit03.lesson01.teach.nine:
    title: nine
    gloss: 아홉(9)
    note: '*nine*는 영어로 숫자 9이에요.'
    example_gloss: 저는 사과가 아홉 개 있어요.
  en.a1.unit03.lesson01.teach.ten:
    title: ten
    gloss: 열(10)
    note: '*ten*는 영어로 숫자 10이에요.'
    example_gloss: 저는 사과가 열 개 있어요.
  en.a1.unit03.lesson02.teach.eleven:
    title: eleven
    gloss: 열하나(11)
    note: '*eleven*은 규칙을 따르지 않는 불규칙한 숫자라서 따로 외워야 해요.'
    example_gloss: 우리 집 번지수는 11이에요.
  en.a1.unit03.lesson02.teach.twelve:
    title: twelve
    gloss: 열둘(12)
    note: '*twelve*도 불규칙한 숫자라서 따로 외워야 해요.'
    example_gloss: 우리 집 번지수는 12예요.
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: 열셋(13)
    note: 13부터 19까지는 기본 숫자 뒤에 *-teen*을 붙여요. 다만 *thirteen*은 *three*가 아니라 *thir-*로 바뀌어요.
    example_gloss: 우리 집 번지수는 13이에요.
  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: 열다섯(15)
    note: '*fiveteen*이 아니라 *fifteen*이에요. 영어의 작은 불규칙이에요.'
    example_gloss: 우리 집 번지수는 15예요.
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: 스물(20)
    note: '*twenty*는 영어로 숫자 20이에요.'
    example_gloss: 우리 집 번지수는 20이에요.
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: 스물하나(21)
    note: 영어에서는 *twenty-one*처럼 십의 자리를 먼저 말하고 일의 자리를 하이픈으로 이어 붙여요. 한국어 "이십일"처럼 큰 자리부터 말하는 순서예요.
  en.a1.unit03.lesson02.teach.thirty:
    title: thirty
    gloss: 서른(30)
    note: '*thirty*는 영어로 숫자 30이에요.'
    example_gloss: 그건 30달러예요.
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: 마흔(40)
    note: 주의하세요. *fourty*가 아니라 *forty*예요. *four*의 *u*가 빠져요.
    example_gloss: 그건 40달러예요.
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: 쉰(50)
    note: '*fifty*는 영어로 숫자 50이에요.'
    example_gloss: 그건 50달러예요.
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: 백(100)
    note: 영어에서는 *hundred* 앞에 항상 *one*이나 *a*를 붙여요(*one hundred*, *a hundred*). 한국어 "백"처럼 숫자 하나만 쓰지 않아요.
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: 나이가 어떻게 되세요? / 몇 살이에요?
    note: '*How old are you?*는 어떤 상황에서도 쓸 수 있어요. 영어에는 존댓말과 반말의 구분이 따로 없어요.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: 저는 스물다섯 살이에요.
    note: 영어에서는 숫자 뒤에 *years old*를 붙여요. 한국어에서 숫자 뒤에 "살"을 붙이는 것과 비슷해요.
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: 이거 얼마예요?
    note: 물건의 가격을 묻는 말이에요.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: 10달러예요.
    note: 가격 질문에 하는 기본적인 대답이에요.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: 전화번호가 어떻게 되세요?
    note: 전화번호를 묻는 말이에요.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: 555의 1234예요.
    note: 영어에서는 전화번호를 숫자 하나하나 읽고, 묶음 사이에서 잠깐 쉬어요.
  en.a1.unit03.lesson04.teach.market:
    title: market
    gloss: 시장
    note: 식료품과 여러 물건을 사는 곳이에요.
    example_gloss: 우리는 시장에 있어요.
  en.a1.unit03.lesson04.teach.apples:
    title: apples
    gloss: 사과
    note: '*apple*의 복수형이에요. 영어에서는 하나보다 많으면 명사 끝에 -s를 붙여요.'
    example_gloss: 그 사과들은 신선해요.
  en.a1.unit03.lesson04.teach.opening:
    title: 대니얼이 대화를 시작한다
    gloss: '대니얼: 이거 얼마예요?'
    note: 간단한 가격 질문이에요.
  en.a1.unit03.lesson04.teach.price_five:
    title: 레일라가 대답한다
    gloss: '레일라: 5달러예요.'
    note: 대니얼의 가격 질문에 대한 대답이에요.
  en.a1.unit03.lesson04.teach.ask_apples:
    title: 대니얼이 사과에 대해 묻는다
    gloss: '대니얼: 그럼 사과는 얼마예요?'
    note: '*And*는 이 질문을 앞의 질문과 이어 줘요.'
  en.a1.unit03.lesson04.teach.price_two:
    title: 레일라가 대답한다
    gloss: '레일라: 2달러예요.'
    note: '*apples*가 복수이기 때문에 *They''re*를 써요.'
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: 대니얼이 가게가 얼마나 오래됐는지 묻는다
    gloss: '대니얼: 네, 이 가게는 얼마나 오래됐어요?'
    note: '*How old*는 사람뿐 아니라 사물에도 쓸 수 있어요.'
  en.a1.unit03.lesson04.teach.shop_age:
    title: 레일라가 대답한다
    gloss: '레일라: 20년 됐어요!'
    note: 사람일 때와 같은 구조예요. *years old*는 사물에도 쓸 수 있어요.
