  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: 이번 주말에 영화 볼래요?
    note: '*Do you want to...?*로 활동을 제안해요. *to* 뒤에는 동사 원형이 오고, 어미는 붙이지 않아요.'
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: 산책할래요? 산책하고 싶으세요?
    note: '*Would you like to...?*는 *Do you want to...?*보다 조금 더 공손한 표현이에요. 한국어의 ''~하실래요?''와 비슷해요.'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: 좋아요, 정말 가고 싶어요!
    note: '*I''d love to*로 기쁘게 수락해요. *I''d*는 *I would*의 줄임말이고, *to* 뒤의 동사는 질문에 이미 나왔기 때문에 생략해요.'
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: 미안해요, 못 가요. 토요일에는 바빠요.
    note: 이 문장은 이유를 들어 거절하는 말이에요. *can't*는 *cannot*의 줄임말이에요.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: 다음 기회에 하면 어때요?
    note: 다른 때에는 기꺼이 함께하고 싶다는 마음을 전하는 말이에요.
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: 점심을 먹다
    note: '*have lunch*는 ''점심을 먹다''라는 뜻이에요. 다른 식사 이름처럼 관사를 쓰지 않아요.'
