    gloss: 안녕하세요! 금요일에 점심 같이 먹을래요? 오후 1시에 카페에서 만나는 건 어때요?
    note: 점심 식사 초대 글이에요.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: 일요일이 좋아요.
    note: '*works for me*는 시간이나 일정이 나한테 잘 맞는다는 뜻이에요.'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
    title: 영화 제안하기
    gloss: 다니엘이 이번 주말에 영화를 볼지 물어요
