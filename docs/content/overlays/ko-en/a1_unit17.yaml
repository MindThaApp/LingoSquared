    gloss: 레일라가 말해요. 좋아요, 정말 가고 싶어요! 무슨 요일이에요?
    note: 레일라는 먼저 수락하고, 그다음에 요일을 물어요.
  en.a1.unit17.lesson04.teach.q_saturday:
    title: 토요일 제안하기
    gloss: 다니엘이 말해요. 토요일은 어때요?
    note: '*How about...?*으로 구체적인 때를 제안해요.'
  en.a1.unit17.lesson04.teach.a_busy_sunday:
    title: 거절하고 일요일 제안하기
    gloss: 레일라가 말해요. 미안해요, 못 가요. 토요일에는 바빠요. 일요일은 어때요?
    note: 레일라는 토요일을 거절하고 일요일을 제안해요.
  en.a1.unit17.lesson04.teach.a_sunday_works:
    title: 일요일에 동의하기
    gloss: 다니엘이 말해요. 일요일이 좋아요.
    note: 다니엘이 일요일에 동의했으니 약속이 정해졌어요.
