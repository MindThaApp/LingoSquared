teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: 채용 제안
    note: '*offer*는 여기서 일자리 제안이에요. 동사 *to offer*는 ''제안하다''라는 뜻이에요.'
    example_gloss: Bright Path Marketing에서 채용 제안을 받았어요.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: 근로 계약, 계약
    note: '*contract*는 나와 회사 사이의 서면 약속이에요.'
    example_gloss: 계약 기간은 1년이에요.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: 급여, 연봉
    note: '*salary*는 한 달 또는 한 해에 받는 돈의 액수예요.'
    example_gloss: 급여는 다음 주에 이야기할 수 있어요.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: 수락하다
    note: '*accept*는 제안받은 것에 ''네''라고 답한다는 뜻이에요.'
    example_gloss: 그 일자리를 기쁘게 수락하고 싶어요.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: 입사일, 시작일
    note: '*start date*는 새 직장에서 일하는 첫날이에요.'
    example_gloss: 입사일은 그달의 첫 번째 월요일이에요.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: 답장, 회신
    note: '*reply*는 메시지에 대한 답이라는 명사도 되고 ''답하다''라는 동사도 돼요.'
    example_gloss: 같은 날 답장을 보냈어요.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: 정중한 바람을 나타내는 would like to
    gloss: 제안을 수락하고 싶습니다. 월요일부터 시작하고 싶습니다.
    note: '*I would like to ...*는 *I want to ...*보다 공손해서 업무 연락에 어울려요.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: 메시지 시작하기
    gloss: 어제 면접 봐 주셔서 감사합니다.
    note: '*Thank you for ...*는 짧은 업무용 감사 메시지를 시작하는 일반적인 표현이에요.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: 계속 관심이 있다고 말하기
    gloss: 저는 여전히 그 직무에 매우 관심이 있습니다.
    note: '*still*은 ''여전히'', ''아직도''라는 뜻이고 형용사 앞에 와요.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: 정중하게 시작일 묻기
    gloss: 입사일을 알려 주실 수 있을까요?
    note: '*Could you tell me ...?*는 간접 의문문이라서 *When is the start date?*보다 공손해요.'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: 제안 수락하기
    gloss: 제안을 수락하고 싶습니다.
    note: 일자리 제안을 수락할 때 쓰는 기본 문장이에요.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Could you tell me로 하는 간접 의문문
    gloss: 입사일을 알려 주실 수 있을까요? 근무 시간에 대해 알려 주실 수 있을까요?
    note: '*Could you tell me* 뒤에는 의문문 어순을 쓰지 않아요. *what is the start date*가 아니라 *the start date*라고 말해요.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: 정규직(풀타임)
    note: '*full time*은 한 주를 꽉 채워 일한다는 뜻이고, 반대는 *part time*(''시간제'')이에요.'
    example_gloss: 이 일자리는 주 이틀만 일하는 게 아니라 풀타임이에요.
  en.a2.unit39.lesson03.teach.offer_message:
    title: 제안이 담긴 메시지
    gloss: 미아 님께, 화요일에 방문해 주셔서 감사합니다. 마케팅 코디네이터 직무를 제안드리고 싶습니다. 계약은 풀타임이고 입사일은 월요일입니다. 금요일까지 회신해 주세요. Bright Path Marketing.
    note: 채용 제안 메시지에는 보통 네 가지가 담겨 있어요. 직무, 계약 형태, 입사일, 회신 기한이에요.
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: 답변 기한
    gloss: 금요일까지 회신해 주세요.
    note: '*by Friday*는 ''늦어도 금요일까지''라는 뜻이라서 금요일 당일도 괜찮아요.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: 면접관이 미아에게 전화한다
    gloss: '면접관이 말해요: 안녕하세요, 미아 님. 화요일 면접 때문에 전화드렸어요.'
    note: '*I am calling about ...*은 업무 전화를 시작할 때 쓰는 일반적인 표현이에요.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: 미아가 여전히 관심이 있다고 말한다
    gloss: '미아가 말해요: 전화 주셔서 감사합니다. 저는 여전히 그 직무에 매우 관심이 있어요.'
    note: 2과의 문장과 같아요.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: 면접관이 일자리를 제안한다
    gloss: '면접관이 말해요: 잘됐네요, 저희가 그 일자리를 제안드리고 싶거든요.'
    note: 여기서 *because*는 미아의 대답과 뒤따르는 좋은 소식을 이어 줘요.
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: 미아가 반응하며 시작일을 묻는다
    gloss: '미아가 말해요: 정말 좋은 소식이에요. 입사일을 알려 주실 수 있을까요?'
    note: 먼저 소식에 짧게 반응한 다음에 질문을 해요.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: 면접관이 일정과 계약을 말한다
    gloss: '면접관이 말해요: 입사일은 월요일이고, 계약은 풀타임이에요.'
    note: 3과 메시지에 있던 두 가지 사실과 같아요.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: 미아가 근무 시간을 묻는다
    gloss: '미아가 물어요: 근무 시간에 대해 알려 주실 수 있을까요?'
    note: 입사일을 물을 때와 같은 간접 의문문이에요.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: 면접관이 근무 시간을 말한다
    gloss: '면접관이 말해요: 9시부터 5시까지이고, 점심시간은 한 시간이에요.'
    note: '*from nine to five*는 근무일을 말할 때 쓰는 정해진 표현이에요.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: 미아가 제안을 수락한다
    gloss: '미아가 말해요: 감사합니다. 제안을 수락하고 싶어요.'
    note: 2과의 문장과 같아요.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: 면접관이 대화를 마무리한다
    gloss: '면접관이 말해요: 좋아요. 오늘 계약서를 보내 드릴게요.'
    note: '*Wonderful*은 따뜻하고 긍정적인 반응으로, 업무 영어에서도 흔히 써요.'
