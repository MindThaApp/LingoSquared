    title: 반품 메모
    gloss: '반품 메모: 파란색 셔츠. 작은 사이즈. 더 큰 사이즈로 교환. 영수증 필수.'
    note: 메모에는 물건, 사이즈, 처리 방법, 영수증이 나와 있어요.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: '본문: 가게에서 교환하기'
    gloss: '가게에서 교환하기: 대니얼은 파란색 셔츠를 샀지만 사이즈가 너무 작았어요. 그는 영수증을 가지고 가게에 다시 갔어요. 직원은 영수증을 요청했고 더 큰 사이즈를 제안했어요. 대니얼은 셔츠를 교환했어요. 더 큰 파란색 셔츠가 잘 맞아서 환불은 필요하지 않았어요.'
    note: '*exchanged*는 *exchange*의 과거형이에요.'
