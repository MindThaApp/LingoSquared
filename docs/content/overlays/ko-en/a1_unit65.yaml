    gloss: '대니얼이 말해요: 네, 여기 있어요. 사이즈가 너무 작아요.'
    note: '*Here it is*는 여기 있다는 뜻이에요.'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: 직원이 교환을 제안해요
    gloss: '직원이 말해요: 더 큰 사이즈로 교환해 드릴 수 있어요.'
    note: '*for a larger size*는 무엇으로 바꾸는지를 나타내요.'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "대니얼이 승낙해요"
    gloss: '대니얼이 말해요: 네, 부탁해요.'
    note: '*Yes, please*는 정중하게 승낙하는 말이에요.'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: 더 큰 사이즈가 있어요
    gloss: '직원이 말해요: 더 큰 사이즈가 파란색으로 있어요.'
    note: '*We have...*는 무엇이 있는지 알려 줘요.'
