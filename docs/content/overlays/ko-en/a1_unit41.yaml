    gloss: 소금을 조금 넣다
    note: '*add some salt*는 ''소금을 조금 넣다''라는 뜻이에요.'
    example_gloss: 수프에 소금을 조금 넣어 주세요.
  en.a1.unit41.lesson02.teach.what_are_you_cooking_question:
    title: What are you cooking?
    gloss: 뭘 요리하고 있어요?
    note: '*What are you ...ing?*은 지금 하고 있는 일이 무엇인지 묻는 말이에요.'
  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: 미아의 초대
    gloss: '미아: 오늘 저녁에 파스타를 만들 거예요. 같이 요리할래요?'
    note: '*Do you want to help me* + 동사*?*는 누군가에게 같이 하자고 권하는 자연스러운 표현이에요.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: 대니얼의 대답
    gloss: '대니얼: 좋아요! 그런데 저는 요리를 잘하지는 못해요.'
    note: 문장 끝의 *though*는 가벼운 대조를 나타내요. 한국어의 '그런데', '다만'과 비슷해요.
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: 미아의 격려
    gloss: '미아: 괜찮아요, 제가 보여 줄게요. 이 양파를 썰어 줄래요?'
    note: '*I''ll show you*는 ''제가 보여 줄게요''라는 뜻이에요.'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: 대니얼의 질문
    gloss: '대니얼: 좋아요. 얼마나 잘게 썰어야 해요?'
    note: '*should*는 조언을 구할 때 써요.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: 미아의 설명
    gloss: '미아: 이렇게 작은 조각으로요. 이제 파스타를 삶아요.'
    note: '*like this*는 ''이렇게'', ''이런 식으로''라는 뜻이에요.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: 대니얼의 대답
    gloss: '대니얼: 소스 맛 좀 봐도 돼요? 맛있어요!'
    note: '*Can I* + 동사*?*는 허락을 구하는 말이에요.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: 미아의 마무리
    gloss: '미아: 좋아요! 저녁이 거의 다 됐어요.'
    note: '*almost ready*는 ''거의 다 됐어요''라는 뜻이에요.'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: 함께 요리하기에 관한 글
    gloss: 대니얼, 레일라, 미아는 요리 실력이 모두 달라요. 레일라가 미아 근처의 새 아파트로 이사한 뒤로, 세 친구는 자주 함께 저녁을 만들어요. 레일라는 요리를 잘해요. 어머니의 오래된 레시피로 파스타를 자주 만들어요. 미아도 요리를 아주 좋아해서, 대니얼에게 손가락을 베지 않고 양파를 써는 법을 가르쳐 주었어요. 대니얼은 아직 요리를 잘하지는 못하지만 빠르게 배우고 있어요. 어젯밤에 미아는 대니얼에게 파스타 만드는 것을 도와 달라고 했어요. 미아가 파스타를 삶고 소스를 만드는 동안 대니얼은 양파를 썰었어요. 대니얼은 소스를 맛보고 맛있다고 말했어요. 저녁이 막 다 되었을 때 레일라가 도착했고, 세 사람은 미아의 부엌에서 함께 먹었어요.
    note: '*arrived just as dinner was ready*는 ''저녁이 막 다 되었을 때 도착했다''는 뜻이에요.'
