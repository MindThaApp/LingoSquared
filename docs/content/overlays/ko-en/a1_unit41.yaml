  en.a1.unit41.lesson01.teach.recipe:
    title: recipe
    gloss: 레시피 / 조리법
    note: '*recipe*는 ''레시피'', ''조리법''이라는 뜻이에요.'
    example_gloss: 이건 우리 할머니의 레시피예요.
  en.a1.unit41.lesson01.teach.ingredient:
    title: ingredient
    gloss: 재료
    note: '*ingredient*는 요리에 들어가는 ''재료''라는 뜻이에요.'
    example_gloss: 양파는 이 레시피의 첫 번째 재료예요.
  en.a1.unit41.lesson01.teach.chop:
    title: chop
    gloss: 잘게 썰다 / 다지다
    note: '*chop*은 ''잘게 썰다''라는 뜻이에요. 일반적인 ''자르다''보다 더 구체적이에요.'
    example_gloss: 저 대신 양파를 좀 썰어 줄 수 있어요?
  en.a1.unit41.lesson01.teach.boil:
    title: boil
    gloss: 끓이다
    note: '*boil*은 액체를 ''끓이다''라는 뜻이에요.'
    example_gloss: 파스타를 삶으려고 물을 끓여야 해요.
  en.a1.unit41.lesson01.teach.taste:
    title: taste
    gloss: 맛보다
    note: '*taste*는 ''맛보다''라는 뜻이에요.'
    example_gloss: 소스를 맛보고 소금이 필요한지 말해 줄 수 있어요?
  en.a1.unit41.lesson02.teach.make_dinner:
    title: make dinner
    gloss: 저녁을 만들다
    note: '*make dinner*는 ''저녁을 만들다''라는 뜻이에요.'
    example_gloss: 오늘 저녁은 제가 만들 거예요.
  en.a1.unit41.lesson02.teach.follow_a_recipe:
    title: follow a recipe
    gloss: 레시피를 따라 하다
    note: '*follow a recipe*는 ''레시피를 따라 하다''라는 뜻이에요.'
    example_gloss: 저는 빵을 구울 때 항상 레시피를 따라 해요.
  en.a1.unit41.lesson02.teach.chop_the_onions:
    title: chop the onions
    gloss: 양파를 잘게 썰다
    note: '*chop the onions*는 ''양파를 잘게 썰다''라는 뜻이에요.'
    example_gloss: 소스에 넣을 양파를 잘게 썰어 줄 수 있어요?
  en.a1.unit41.lesson02.teach.boil_the_pasta:
