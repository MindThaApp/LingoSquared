    title: emergency
    gloss: 응급 상황
    note: '*emergency*는 응급 상황이라는 뜻이에요.'
    example_gloss: 응급 상황이에요!
  en.a1.unit45.lesson01.teach.help:
    title: help
    gloss: 도움
    note: '*help*는 도움이라는 뜻이에요.'
    example_gloss: 도움이 필요해요!
  en.a1.unit45.lesson01.teach.police:
    title: police
    gloss: 경찰
    note: '*police*는 경찰이라는 뜻이에요.'
    example_gloss: 경찰을 불러 주세요!
  en.a1.unit45.lesson01.teach.ambulance:
    title: ambulance
    gloss: 구급차
    note: '*ambulance*는 구급차라는 뜻이에요.'
    example_gloss: 구급차가 필요해요!
  en.a1.unit45.lesson01.teach.fire_department:
    title: fire department
    gloss: 소방서
    note: '*fire department*는 소방서, 즉 불을 끄는 소방대를 뜻해요.'
    example_gloss: 소방대가 왔어요.
  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: 911에 전화하세요!
    note: 미국에서는 응급 상황에 *911*에 전화해요. 다른 나라의 긴급 전화번호와 다르니 꼭 기억해 두세요.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: 도움이 필요해요!
    note: '*I need help!*는 "도움이 필요해요!"라는 뜻이에요.'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: 경찰을 보내 주세요.
    note: '*Send the police, please.*는 "경찰을 보내 주세요."라는 뜻이에요.'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: 구급차를 보내 주세요.
    note: '*Send an ambulance, please.*는 "구급차를 보내 주세요."라는 뜻이에요.'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: 불이 났어요!
    note: '*There''s a fire!*는 "불이 났어요!"라는 뜻이에요.'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: 어떤 응급 상황인가요?
    note: 미국의 응급 신고 센터에서 911로 전화하면 가장 먼저 묻는 표준 질문이에요.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: 레일라가 연기 냄새를 맡아요
    gloss: 레일라가 물어요. 다니엘, 뭐 타고 있어요? 연기 냄새가 나요!
    note: '*smell* 뒤에 명사가 바로 오면 "냄새를 맡다"라는 뜻이에요. *I smell smoke*는 "연기 냄새가 나요"예요. *I smell of smoke*는 뜻이 달라서 "내게서 연기 냄새가 나요"라는 뜻이에요.'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: 다니엘의 설명
    gloss: 다니엘이 말해요. 아, 이런, 팬에 불이 붙었어요! 저녁을 만들고 있었어요.
    note: '*caught fire*는 갑자기 불이 붙었다는 뜻으로 쓰는 표현이에요.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: 레일라의 지시
    gloss: 레일라가 말해요. 침착하세요. 가스레인지를 끄세요! 제가 도움을 요청할게요.
    note: '*call for help*는 "도움을 요청하다"라는 뜻이에요. 여기서 *for*를 빼먹지 마세요.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: 다니엘의 경고
    gloss: 다니엘이 말해요. 서둘러요, 불이 점점 커지고 있어요!
    note: '*getting bigger*는 "점점 커지다"라는 뜻이에요. *get* 뒤에 형용사를 붙이면 변화를 나타내요.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: 레일라가 신고 전화를 해요
    gloss: 레일라가 말해요. 여보세요, 응급 상황이에요. 친구 집 부엌에 불이 났어요. 소방대를 보내 주세요.
    note: 미국에서 응급 신고 센터와 통화하는 모습이에요. 미국에서는 911에 전화해요.
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: 다니엘의 안도
    gloss: 다니엘이 말해요. 정말 다행이에요. 이제 불은 꺼진 것 같지만, 만약을 위해 밖에서 기다려요.
    note: '*just in case*는 "만약을 위해"라는 뜻이에요.'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: 레일라의 조언
    gloss: 레일라가 말해요. 좋은 생각이에요. 소방대가 올 때까지 밖에서 기다리는 게 더 안전해요.
    note: '*safer*는 *safe*의 비교급이에요. 형용사 뒤에 *-er*을 붙여서 "더 ~한"이라는 뜻을 만들어요. 한국어에서는 "더 안전한"처럼 "더"를 앞에 붙여요.'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: 응급 상황 안내문
    gloss: '화재가 났을 때: 첫째, 침착하세요. 둘째, 바로 건물 밖으로 나가세요. 엘리베이터는 쓰지 말고 계단을 이용하세요. 셋째, 밖으로 나오면 911에 전화해서 주소를 말하세요. 마지막으로, 소방대가 올 때까지 밖에서 기다리세요. 다니엘의 부엌에 불이 난 뒤, 다니엘과 레일라는 안내문에 쓰인 대로 밖에서 기다렸어요. 소방대는 빨리 도착해서 모든 것이 안전한지 확인했어요. 나중에 미아가 두 사람을 살펴보러 왔고, 아무도 다치지 않았다는 사실에 안도했어요.'
    note: '*elevator*는 미국 영어에서 쓰는 엘리베이터라는 단어예요. 영국 영어에서는 *lift*라고 해요.'
