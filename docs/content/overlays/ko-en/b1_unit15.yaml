  description: 의무, 가능성, 가정 상황, 일상 이야기를 위한 B1 수준 영어를 배워요. 자세한 한국어 설명이 함께 있어요.
units:
  en.b1.unit15.complaints:
    title: I'm writing to complain about...
lessons:
  en.b1.unit15.lesson01.complaints_vocabulary:
    title: 항의할 때 쓰는 표현
  en.b1.unit15.lesson02.complaint_sentences:
    title: I'm writing to complain about a damaged product
  en.b1.unit15.lesson03.reading_a_complaint_email:
    title: '읽기: 사무용 의자에 대한 항의 글'
  en.b1.unit15.lesson04.the_complaint_call_dialogue:
    title: Would you like a refund or a replacement?
teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: 항의하다, 불만을 제기하다
    note: '*complain*은 무언가가 잘못되었거나 만족스럽지 않다고 정식으로 말한다는 뜻이에요.'
    example_gloss: 미아는 파손된 의자에 대해 항의하기로 했어요.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: 파손된, 손상된
    note: '*damaged*는 제품이 망가졌거나 손상된 상태를 나타내요.'
    example_gloss: 의자가 파손된 채로 도착했어요.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: 환불
    note: '*refund*는 반품했거나 결함이 있는 제품에 대해 돌려받는 돈을 뜻해요.'
    example_gloss: 미아는 환불을 요청했어요.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: 교환품, 대체품
    note: '*replacement*는 결함이 있는 물건 대신 받는 새 물건을 뜻해요.'
    example_gloss: 회사는 대신 교환품을 제안했어요.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: 해결하다
    note: '*resolve*는 문제를 완전히 해결한다는 뜻이에요.'
    example_gloss: 담당자는 문제를 빨리 해결하겠다고 약속했어요.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: 문제, 사안
    note: '*issue*는 처리해야 할 문제를 뜻해요.'
    example_gloss: 미아는 문제를 분명하고 명확하게 설명했어요.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + 명사
    gloss: 파손된 제품에 대해 항의하려고 이렇게 글을 씁니다.
    note: '*I''m writing to complain about*는 공손한 항의 글을 시작할 때 써요.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + 명사
    gloss: 이 제품을 환불받고 싶습니다.
    note: '*I would like a refund for*는 돈을 돌려 달라고 공손하게 요청하는 표현이에요.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: 정중한 항의문의 구성
    gloss: 공손한 항의 글은 보통 세 부분으로 이루어져요. 문제를 밝히고(I'm writing to complain about...), 이미 일어난 일을 말하고(it arrived damaged / it stopped working), 구체적인 해결 방법을 요청해요(I would like a refund / I would like a replacement).
    note: '형태: 문제를 밝히고, 일어난 일을 말하고, 구체적인 해결 방법을 요청해요.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: 사무용 의자
    note: '*desk chair*는 책상에 앉을 때 쓰는 의자를 뜻해요.'
    example_gloss: 미아는 재택근무 공간에서 쓸 새 사무용 의자를 주문했어요.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: 가능한 한 빨리
    note: '*as soon as possible*는 불필요하게 미루지 않고 곧바로라는 뜻이에요.'
    example_gloss: 미아는 가능한 한 빨리 교환품을 받고 싶다고 요청했어요.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: '읽기: 사무실 의자에 대한 항의'
    gloss: GreenDesk 팀 귀중. 파손된 제품에 대해 항의하려고 글을 씁니다. 지난주에 재택근무 공간에서 쓸 사무용 의자를 주문했는데, 바퀴가 부러진 채로 도착했어요. 가능한 한 빨리 교환품을 받고 싶습니다. 어떻게 진행하면 되는지 알려 주세요. 감사합니다. 미아
    note: 짧고 공손한 항의 편지예요.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: 미아가 사무실 의자에 대해 항의하려고 전화한다
    gloss: '미아가 말해요: 안녕하세요, 제가 주문한 사무용 의자에 대해 항의하려고 전화드렸어요.'
    note: '*I''m calling to complain about*는 공손하게 전화로 항의를 시작할 때 써요.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: 직원이 문제가 무엇인지 묻는다
    gloss: '담당자가 말해요: 그런 일이 있었다니 죄송합니다. 의자에 어떤 문제가 있나요?'
    note: '*I''m sorry to hear that*은 공손하고 공감하는 반응이에요.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: 미아가 문제를 설명한다
    gloss: '미아가 말해요: 바퀴가 부러진 채로 도착해서 쓸 수가 없어요.'
    note: '*it arrived with a broken wheel*은 이미 일어난 일을 설명해요.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: 직원이 해결책을 제안한다
    gloss: '담당자가 말해요: 알겠습니다. 환불과 교환 중 어느 쪽을 원하시나요?'
    note: '*would you like... or...*는 고객에게 선택권을 줘요.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: 미아가 교환품을 선택한다
    gloss: '미아가 말해요: 가능하다면 교환이 더 좋겠어요.'
    note: '*I would prefer a replacement, if that''s possible*는 선호하는 것을 공손하게 말하는 표현이에요.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: 직원이 해결을 확인한다
    gloss: '담당자가 말해요: 물론이죠. 문제를 해결하고 금요일까지 새 의자를 보내 드릴게요.'
    note: '*we''ll resolve this and send... by Friday*는 날짜가 정해진 구체적인 약속이에요.'
