teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: 빨래방
    note: '*laundromat*은 "빨래방"이라는 뜻이에요. 돈을 내고 세탁기를 쓰는 곳이에요.'
    example_gloss: 오늘 빨래방에 갈 거예요.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: 세탁기
    note: '*washing machine*은 "세탁기"라는 뜻이에요.'
    example_gloss: 세탁기가 고장 났어요.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: 건조기
    note: '*dryer*는 "건조기"라는 뜻이에요.'
    example_gloss: 옷을 건조기에 넣으세요.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: 25센트 동전
    note: '*quarters*는 미국의 25센트 동전이에요. 빨래방의 세탁기에 자주 필요해요. 한국에는 똑같은 동전이 없어서, 보통 영어 그대로 *quarters*라고 기억해요.'
    example_gloss: 이 기계는 25센트 동전을 받아요.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: 세제
    note: '*detergent*는 "세제"라는 뜻이에요.'
    example_gloss: 옷을 빨려면 세제가 필요해요.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: 한 번에 빠는 빨래
    note: 여기서 *load*는 한 번에 세탁기에 넣어 빠는 빨래의 양을 뜻해요.
    example_gloss: 빨래가 한가득 있어요.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: 몇 가지를 빨고 싶어요.
    note: '*I''d like to*는 *I would like to*를 줄인 말로, 정중하게 부탁하는 표현이에요.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: 기계에 쓸 잔돈 있어요?
    note: 여기서 *change*는 "변화"가 아니라 "잔돈"(동전)이라는 뜻이에요.
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: 세탁은 얼마나 걸려요?
    note: 여기서 *take*는 "(시간이) 걸리다"라는 뜻이에요. *the machines take quarters*에서 *take*가 "받다"를 뜻하는 것과는 쓰임이 아주 달라요. 한국어에서는 보통 "걸리다"로 말해요.
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: 한 번 빠는 데 3달러예요.
    note: '*for one load*는 "한 번 빠는 데"라는 뜻이에요.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: 몇 시에 문을 닫아요?
    note: '*do you close*에서는 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: 9시까지 빨래를 찾아가 주세요.
    note: '*pick up*은 "찾아가다"라는 뜻이고, *by nine o''clock*은 "9시까지"라는 뜻이에요.'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: 직원이 인사해요
    gloss: 직원이 말해요. "안녕하세요! 세탁기가 필요하세요?"
    note: '*Do you need...?*에서는 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: 레일라의 이유
    gloss: 레일라가 말해요. "네, 필요해요. 집 세탁기가 고장 났어요."
    note: '*at home*은 "집에서"라는 뜻이에요.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: 대니얼의 요청
    gloss: 대니얼이 말해요. "저도 빨래가 조금 있어요. 저도 기계를 써도 될까요?"
    note: 여기서 *too*는 "~도"라는 뜻으로 문장 끝에 와요. *as well*도 같은 뜻이고, 두 번째 문장에 있어요.
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: 직원이 동전에 대해 말해요
    gloss: 직원이 말해요. "물론이죠! 기계는 25센트 동전을 받아요."
    note: 여기서 *take*는 "(돈을) 받다"라는 뜻이에요. 뒤에 나오는 *The wash cycle takes thirty minutes*의 *take*는 "걸리다"라는 뜻이니 구분하세요.
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: 레일라에게 동전이 있어요
    gloss: 레일라가 말해요. "네, 25센트 동전이 있어요."
    note: 짧게 확인하는 말이에요. 새로운 정보는 아니에요.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: 세탁 시간
    gloss: 직원이 말해요. "세탁은 30분 걸려요."
    note: 여기서 *take*는 "걸리다"라는 뜻이에요. 앞에 나온 *take quarters*의 *take*와 뜻이 달라요.
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: 대니얼이 가격을 물어요
    gloss: 대니얼이 말해요. "그리고 얼마예요?"
    note: '*How much does it cost?*에서도 의문문을 만들려고 도우미 동사 *does*를 써요.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: 가격
    gloss: 직원이 말해요. "한 번 빠는 데 3달러예요."
    note: 동전 개수나 시간과는 별개의 정보예요.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: 문 닫는 시간
    gloss: 직원이 말해요. "빨래방은 9시에 문을 닫으니, 그 전에 빨래를 찾아가 주세요."
    note: 여기서 *so*는 "그러니까"라는 뜻이에요. 문 닫는 시간과 시간에 맞춰 와 달라는 요청을 이어 줘요.
  en.a1.unit54.lesson04.teach.reading_passage:
    title: '글: 빨래방 방문'
    gloss: 어느 날 오후, 레일라의 집 세탁기가 고장 났어요. 레일라는 길 아래쪽에 있는 빨래방에 가기로 했어요. 대니얼도 빨래가 조금 있어서 함께 갔어요. 빨래방에서 직원은 기계가 25센트 동전을 받고 세탁은 30분 걸린다고 설명했어요. 한 번 빠는 데 3달러였어요. 옷이 빨리는 동안 대니얼과 레일라는 옆 카페에서 이야기를 나누며 커피를 마셨어요. 빨래방은 9시에 문을 닫아서, 두 사람은 그 전에 빨래를 꼭 찾아가기로 했어요. 레일라는 대니얼이 함께 있어 줘서 고마워했고, 집 세탁기는 아마 주말쯤 고쳐질 거라고 말했어요.
    note: '*would be fixed*는 "고쳐질 것이다"라는 뜻이에요. 레일라는 기계가 고쳐지기를 기대하지만, 아직 확실하지는 않아요.'
