teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: 약
    note: '*medicine*은 약, 약물을 뜻해요.'
    example_gloss: 의사 선생님이 두통약을 주셨어요.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: 처방전
    note: '*prescription*은 의사가 써 주는 처방전을 뜻해요.'
    example_gloss: 의사 선생님이 그 약의 처방전을 써 주셨어요.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: 재진 예약
    note: '*follow-up appointment*는 의사가 경과를 확인하려고 다시 잡는 진료 예약을 뜻해요.'
    example_gloss: 나아지지 않으면 재진 예약이 필요해요.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: 점점 나빠지는
    note: '*getting worse*는 증상이 점점 심해지는 것을 뜻해요.'
    example_gloss: 두통이 나아지지 않고 점점 심해져요.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: 보험 카드
    note: '*insurance card*는 건강보험 카드를 뜻해요. 한국의 건강보험증과 비슷하지만, 미국에서는 보험 회사마다 카드가 달라요.'
    example_gloss: 진료 때 보험 카드를 가져오세요.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: 이전 증상
    gloss: 두통, 인후통, 열
    note: 이 단어들은 22과에서 이미 배웠어요. 여기서 다시 복습해요.
    example_gloss:
    - 머리가 아파요.
    - 목이 아파요.
    - 열이 있어요.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: 예약 부탁하기
    gloss: 의사 선생님께 진료 예약을 하고 싶어요.
    note: '*I''d like to...*는 공손하게 예약을 부탁할 때 써요.'
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: 증상이 얼마나 오래됐는지 말하기
    gloss: 사흘째 머리와 목이 아프고, 점점 심해지고 있어요.
    note: 계속되고 있는 일을 말할 때 영어는 *Present Perfect*(현재완료, *I've had ... for three days*)를 써요. 한국어는 "사흘째 아파요"처럼 현재형으로 말하는 경우가 많아요.
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: 10분 일찍 도착하다
    note: '*arrive ten minutes early*는 예약 시간보다 10분 일찍 도착하는 것을 뜻해요.'
    example_gloss: 예약 시간보다 10분 일찍 오세요.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: 확인 안내문
    gloss: 예약이 오늘 오후 3시로 확정되었습니다. 보험 카드를 가져오시고 10분 일찍 도착해 주세요. 확인 번호는 7724예요.
    note: 시간, 해야 할 일, 번호가 들어 있는 공식 확인 안내문이에요.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: 알겠어요.
    note: '*I see*는 이해했다는 것을 보여 줄 때 써요.'
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: 무슨 일인지 묻기
    gloss: 의사가 물어요. 어디가 안 좋으세요?
    note: 22과에서 레일라가 했던 질문과 같아요. 이번에는 의사가 물어요.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: 증상에 대한 대니얼의 대답
    gloss: 대니얼이 말해요. 사흘째 머리와 목이 아프고, 점점 심해지고 있어요.
    note: 2과의 문장과 같아요.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: 의사의 진단
    gloss: 의사가 말해요. 알겠어요. 심한 감기에 걸리셨네요.
    note: 흔히 걸리는 가벼운 진단이에요. 심각한 병이 아니에요.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: 약에 대해 묻기
    gloss: 대니얼이 물어요. 약을 먹어야 하나요?
    note: 대니얼은 진단을 듣고 나서 치료에 대해 물어요.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: 약 복용 안내
    gloss: 의사가 말해요. 네, 이 약을 하루에 두 번, 5일 동안 드시고 물을 많이 마시세요.
    note: 정확한 지시예요. 하루 두 번, 5일 동안이에요.
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: 후속 예약 묻기
    gloss: 대니얼이 물어요. 나아지지 않으면 다시 와야 하나요?
    note: 대니얼은 22과에서 레일라가 썼던 것과 같은 조건(*if it doesn't get better*)을 써요.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: 후속 진료 예약에 대한 의사의 대답
    gloss: 의사가 말해요. 네, 일주일 안에 나아지지 않으면 재진 예약을 하고 다시 오세요.
    note: 의사가 대니얼이 언제 다시 와야 하는지 정확히 알려 줘요. 일주일 안에 나아지지 않을 때예요.
