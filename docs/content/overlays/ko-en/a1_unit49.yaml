    gloss: 초록색 통은 유리용이에요.
    note: '*is for ...*는 "...용이에요"라는 뜻으로, 무엇을 위한 것인지 말할 때 써요.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: 쓰레기 좀 내다 버려 줄래요?
    note: '*take out*은 목적어를 가운데에 넣어도 되는 영어 동사예요. *take out the trash*와 *take the trash out*은 둘 다 맞아요.'
