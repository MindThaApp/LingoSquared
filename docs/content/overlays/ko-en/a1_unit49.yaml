    note: '*What about ...?*는 "...는요?"라는 뜻으로, 다른 것에 대해 물을 때 써요.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: 미아의 경고
    gloss: 미아가 말해요. 잠깐만요, 그 유리병은 쓰레기통에 넣으면 안 돼요!
    note: '*doesn''t go in the trash*는 "쓰레기통에 넣으면 안 된다"라는 뜻이에요.'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: 대니얼의 사과
    gloss: 대니얼이 말해요. 아, 미안해요! 어느 통에 넣어야 해요?
    note: '*Which bin does it go in?*은 방금 배운 질문을 다시 쓴 거예요.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: 미아의 설명
    gloss: 미아가 말해요. 초록색 통에 넣어요. 여기서는 유리를 재활용해요.
    note: '*We recycle glass here.*는 "여기서는 유리를 재활용해요"라는 뜻이에요.'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: 대니얼의 질문
    gloss: 대니얼이 물어요. 종이와 음식물 쓰레기는요?
    note: 앞에서 배운 질문 *What about ...?*을 다시 썼어요.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: 미아의 설명
    gloss: 미아가 말해요. 종이는 파란색 통에 넣고, 음식물 쓰레기는 갈색 통에 넣어요.
    note: '*goes in ..., and ... goes in ...*은 서로 다른 두 종류의 쓰레기에 같은 구조를 반복해서 쓴 문장이에요.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: 대니얼의 수거일 질문
    gloss: 대니얼이 말해요. 알겠어요. 수거일은 언제예요?
    note: '*Got it.*은 "알겠어요"라는 뜻의 편한 표현이에요.'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "미아의 대답"
    gloss: 미아가 말해요. 재활용 통은 화요일마다 내놓고, 일반 쓰레기는 금요일마다 내놓아요.
    note: 미아가 서로 다른 종류의 쓰레기에 대해 서로 다른 두 요일을 말하고 있어요. 재활용은 화요일, 일반 쓰레기는 금요일이에요.
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: 대니얼의 약속
    gloss: 대니얼이 말해요. 고마워요! 다음부터는 모두 제대로 분류할게요.
    note: '*I''ll sort everything correctly next time.*은 "다음부터는 모두 제대로 분류할게요"라는 뜻이에요.'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: 분리배출 방법에 관한 글
    gloss: '쓰레기 분리배출 방법: 많은 아파트 건물에는 쓰레기 종류별로 서로 다른 통이 있어요. 유리는 보통 초록색 통에, 종이는 파란색 통에 넣어요. 음식물 쓰레기는 갈색 통에 넣고, 그 밖의 것은 모두 일반 쓰레기용 검은색 통에 넣어요. 통은 일주일에 한 번만 수거해 가므로 수거일을 알아 두면 좋아요. 대니얼은 도서관에서 빌린 요리책으로 요리를 연습하고 있고, 미아의 아파트에서 미아와 함께 요리할 때가 많아요. 어젯밤 대니얼은 요리책에 나온 요리를 만들었고, 그 뒤에 하마터면 유리병을 일반 쓰레기통에 넣을 뻔했어요. 미아가 말리면서 미아네 건물에서는 쓰레기를 어떻게 분류하는지 보여 주었어요. 재활용 통은 화요일마다, 일반 쓰레기는 금요일마다 내놓는다고 설명했어요. 대니얼은 고마워하며 앞으로는 모두 제대로 분류하겠다고 말했어요.'
    note: '*almost put a glass jar in the regular trash*는 "하마터면 유리병을 일반 쓰레기통에 넣을 뻔했다"라는 뜻이에요.'
