teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: 축구
    note: '*soccer*는 ''축구''라는 뜻이에요. 함께 쓰는 동사는 *play*예요: *play soccer*. 한국어에서는 ''축구하다'', ''테니스를 치다''처럼 운동마다 말이 달라지는데, 영어에서도 운동 이름 앞에 *play*, *go*, *do* 중 알맞은 동사를 따로 기억해야 해요.'
    example_gloss: 우리는 토요일에 축구를 해요.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: 테니스
    note: '*tennis*는 ''테니스''라는 뜻이에요. *soccer*처럼 여기서도 *play*를 써요: *play tennis*. 한국어에서는 ''테니스를 치다''라고 하지만 영어에서는 항상 *play tennis*라고 해요.'
    example_gloss: 그녀는 주말마다 테니스를 쳐요.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: 농구
    note: '*basketball*은 ''농구''라는 뜻이에요. 여기서도 *play*를 써요: *play basketball*. *soccer*, *tennis*와 같아요. 영어에서는 구기 종목에 항상 *play* + 운동 이름을 써요.'
    example_gloss: 그들은 공원에서 농구를 해요.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: 수영
    note: '*swimming*은 ''수영''이라는 뜻이에요. 여기서는 동사가 달라져요: *go swimming* (*play swimming*이 아니에요). 영어에서는 수영, 달리기 같은 활동에 *go* + *-ing* 형태를 써요. 한국어의 ''수영하러 가다''와 비슷해요.'
    example_gloss: 저는 일주일에 두 번 수영하러 가요.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: 요가
    note: '*yoga*는 ''요가''라는 뜻이에요. 동사는 *do*예요: *do yoga*. 영어에서는 요가처럼 혼자 하는 활동에 *do*를 쓰고, *play*나 *go*는 쓰지 않아요. 한국어의 ''요가를 하다''와 비슷하지만, 영어에는 *play*, *go*, *do* 세 동사가 있어서 운동 종류별로 기억해야 해요.'
    example_gloss: 그는 아침에 요가를 해요.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: 운동하다 / 운동
    note: '*exercise*는 ''운동하다'' 또는 ''운동''이라는 뜻이에요. 신체 활동을 가리키는 일반적인 단어예요. *soccer*, *swimming*, *yoga*와 달리 *exercise*는 *play*, *go*, *do* 없이 그 자체로 동사로 쓸 수 있어요: *Do you exercise every day?*'
    example_gloss: 매일 운동해요?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: 일주일에 두 번
    note: '*twice a week*는 ''일주일에 두 번''이라는 뜻이에요. 여기서 *a*는 ''하나''가 아니라 ''~마다, ~당''이라는 뜻이에요. 횟수 + *a* + 기간으로 그 기간에 얼마나 자주 일어나는지를 나타내요. 한국어의 ''일주일에 두 번''의 ''에''와 비슷해요.'
    example_gloss: 그는 일주일에 두 번 테니스를 쳐요.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: 일주일에 세 번
    note: '*three times a week*는 ''일주일에 세 번''이라는 뜻이에요. *twice a week*처럼 여기서도 *a*는 ''하나''가 아니라 ''~마다''예요. *times*(번)와 *a week*(일주일에)가 합쳐져 일주일에 몇 번인지를 나타내요.'
    example_gloss: 그녀는 일주일에 세 번 수영해요.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: 주말에
    note: '*on weekends*는 ''주말에''라는 뜻이에요. 영어에서는 요일과 주말 앞에 전치사 *on*을 써요.'
    example_gloss: 우리는 주말에 농구를 해요.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: 헬스장
    note: '*gym*은 ''헬스장''이라는 뜻이에요. 운동 기구와 수업이 있는 곳이에요.'
    example_gloss: 그는 헬스장에서 요가를 해요.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: 수영장
    note: '*pool*은 ''수영장''이라는 뜻이에요. 수영하는 물이 가득한 곳이에요.'
    example_gloss: 저는 수영장에서 수영해요.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: 얼마나 자주 운동해요?
    note: 이 질문은 *how often*('얼마나 자주')으로 시작해요. 그다음에 조동사 *do*가 오는 것은 본동사가 *exercise*이기 때문이에요. 다른 영어 의문문과 같은 방식이에요.
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: 다니엘의 질문
    gloss: 다니엘이 물어요. 토요일에 우리랑 같이 축구할래요?
    note: 축구를 하자는 초대로 대화가 시작돼요. *soccer*에는 *play*를 써요.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 저는 축구를 별로 안 좋아해요. 수영을 더 좋아해요.
    note: '*don''t really like*는 ''별로 안 좋아해요''라는 뜻이에요. 거절을 더 부드럽게 하는 표현이에요.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 괜찮아요! 수영은 얼마나 자주 가요?
    note: '*go swimming*: 수영에는 *play*나 *do*가 아니라 *go*를 써요.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 일주일에 두 번이요. 보통 우리 집 근처 수영장에서 해요.
    note: '*Twice a week*: 여기서도 *a*는 ''~마다''라는 뜻이에요.'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 좋네요! 저도 가끔 요가를 하지만, 달리기가 여전히 제일 좋아요.
    note: '*do yoga*: 요가에는 *play*나 *go*가 아니라 *do*를 써요.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: 다니엘, 레일라, 미아에 관한 글
    gloss: 다니엘, 레일라, 미아는 각자 자기 방식대로 활동적으로 지내요. 다니엘은 매일 아침 출근 전에 달리기를 하러 가요. 레일라는 수영을 더 좋아해서 일주일에 두 번 수영장에 가요. 미아는 팀에 새로 왔지만 벌써 매주 일요일 이웃과 테니스를 쳐요. 토요일에는 가끔 공원에서 함께 축구를 하지만, 축구는 아무도 가장 좋아하는 운동이 아니에요.
    note: '이 글에는 세 동사가 모두 나와요: *goes running*(*go*), *plays tennis*와 *play soccer*(*play*). 운동마다 자기 동사가 있어요.'
