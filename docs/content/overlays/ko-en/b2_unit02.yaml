    title: It must have gone down overnight
lessons:
  en.b2.unit02.lesson01.certainty_and_deduction:
    title: May, might, must, cannot
  en.b2.unit02.lesson02.present_and_past_speculation:
    title: It must have been a system problem
  en.b2.unit02.lesson03.reading_an_incident_note:
    title: '읽기: 아마 무슨 일이 있었을까?'
  en.b2.unit02.lesson04.the_speculation_dialogue:
    title: A deduction, not just a guess
teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: ~일 수 있다
    note: '*may*는 가능성을 나타내요. 여기서는 *May I...?*처럼 허락을 구하는 뜻이 아니에요.'
    example_gloss: 이것은 사실일 수 있어요.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: ~일지도 모른다
    note: '*might*는 조심스러운 가능성을 나타내요. 보통 *may*보다 확신이 조금 더 약해요.'
    example_gloss: 이것은 사실일지도 몰라요.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: ~임이 틀림없다
    note: '*must*는 여기서 의무가 아니라 증거에 바탕을 둔 강한 결론을 나타내요.'
    example_gloss: 이것은 사실임이 틀림없어요.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: ~일 리가 없다
    note: '*cannot*은 증거가 어떤 가능성을 배제할 때 써요. 과거에 대해서는 *cannot have been*이 돼요.'
    example_gloss: 이것은 사실일 리가 없어요.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: 증거에 바탕을 둔 추론
    note: '*deduction*은 단서에서 논리적으로 결론을 이끌어 내는 것이지, 그냥 찍는 것이 아니에요.'
    example_gloss: 미아의 추론은 증거에 바탕을 두고 있어요.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: 어림짐작
    note: '*guesswork*는 증거가 거의 없거나 전혀 없는 짐작이에요.'
    example_gloss: 증거가 없으면 그 설명은 어림짐작에 불과할 거예요.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May와 might는 자주 겹쳐요. 둘 다 가능한 설명을 나타내고, might가 보통 조금 더 조심스럽게 들려요.
    note: 한국어 '혹시', '아마'를 매번 *maybe*로 옮기지 마세요. 신중하게 쓴 문장에서는 *may*와 *might*가 대개 더 깔끔해요.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: 과거에 대한 강한 결론
    gloss: 보고서가 하나도 생성되지 않은 걸 보면, 서버가 밤사이에 다운되었음이 틀림없어요.
    note: '한국어의 ''~했음이 틀림없다''는 영어에서 *must have* + 과거분사가 돼요: *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: 과거의 가능한 원인
    gloss: 보고서들이 밤사이에 실패했을 수도 있어요.
    note: '*may have failed*는 가능한 원인이지 확실한 결론이 아니에요.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: 조심스러운 가능성
    gloss: 대신 권한 문제였을지도 몰라요.
    note: '*might have been*은 원인을 열어 두고, *must have been*보다 더 조심스럽게 들려요.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: 가능성 배제하기
    gloss: 보고서 문제 하나만은 아니었을 리가 없어요.
    note: 한국어의 '~였을 리가 없다'는 여기서 *cannot have been*, 구어에서는 *can't have been*이 돼요.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: 추측을 나타내는 조동사
    gloss: 현재에 대한 강한 결론에는 must be를, 과거에 대한 강한 결론에는 must have been을 쓰세요. 현재의 가능성에는 may나 might를, 과거의 가능성에는 may have나 might have를 쓰세요. 증거가 어떤 설명을 배제할 때는 cannot이나 cannot have been을 쓰세요.
    note: 주의하세요. 여기서 *must*는 '~해야 한다'는 의무가 아니라 '~임이 틀림없다'는 결론이에요.
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: 장애, 가동 중단
    note: '*outage*는 시스템이나 서비스가 작동하지 않는 장애를 말해요.'
    example_gloss: 시스템 장애 때문에 보고서가 실행되지 않았어요.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: 결과, 영향
    note: '*consequence*는 어떤 원인이나 문제에서 생기는 결과예요.'
    example_gloss: 한 가지 결과는 대시보드에 오래된 데이터가 표시될 수 있다는 거예요.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: '읽기 지문: 아마 무슨 일이 있었을까?'
    gloss: 밤사이 보고서가 실행되지 않았고, 모니터링 페이지도 비어 있어요. 미아는 서버가 밤사이에 다운되었음이 틀림없다고 말해요. 다니엘은 권한 문제였을지도 모른다고 하지만, 그것으로는 모니터링 페이지가 비어 있는 이유를 설명할 수 없어요. 재무팀은 아침 수치를 못 받고 있을 수 있고, 보고서가 다시 만들어질 때까지 고객용 대시보드에 오래된 데이터가 표시될지도 몰라요. 미아가 완전히 확신하는 것은 아니지만, 그녀의 설명은 확보된 증거에서 이끌어 낸 추론이지 순전한 어림짐작이 아니에요.
    note: 이 글은 사실, 가능한 원인, 강한 결론, 배제된 설명, 가능한 결과를 구분해서 보여 줘요.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: 다니엘이 사실을 말해요
    gloss: '다니엘: 밤사이 보고서가 하나도 생성되지 않았어요.'
    note: 이것은 이미 알려진 사실이고, 아직 추측이 아니에요.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: 미아가 강한 결론을 내려요
    gloss: '미아: 서버가 밤사이에 다운되었음이 틀림없어요.'
    note: '*must have gone down*은 과거에 대한 강한 결론이에요.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: 다니엘이 가능한 원인을 말해요
    gloss: '다니엘: 대신 권한 문제였을지도 몰라요.'
    note: '*might have been*은 선택지를 열어 두지만 확실하다고 하지는 않아요.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: 미아가 제한적인 설명을 배제해요
    gloss: '미아: 그럴 수도 있지만, 모니터링 페이지도 비어 있으니 보고서 문제 하나만은 아니었을 리가 없어요.'
    note: '*cannot have been only...*는 증거가 더 넓기 때문에 그 설명을 배제해요.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: 다니엘이 결과를 물어요
    gloss: '다니엘: 어떤 결과를 예상해야 할까요?'
    note: 원인 다음에는 가능한 결과에 대한 질문이 와요.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: 미아가 가능한 결과를 말해요
    gloss: '미아: 재무팀은 아침 수치를 못 받고 있을 수 있고, 고객용 대시보드에는 오래된 데이터가 표시될지도 몰라요.'
    note: '*may be missing*과 *might show*는 확실한 사실이 아니라 가능한 결과를 나타내요.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: 다니엘이 확신의 정도를 확인해요
    gloss: '다니엘: 그러니까 그건 그냥 찍은 게 아니라 추론이라는 거죠?'
    note: 다니엘은 미아의 논리가 증거에 바탕을 두는지 물어요.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: 미아가 결론을 조심스럽게 다듬어요
    gloss: '미아: 네. 증거가 제한적이긴 하지만, 시스템 장애를 가리키고 있어요.'
    note: 강한 결론도 증거의 한계를 인정할 수 있어요.
exercises:
