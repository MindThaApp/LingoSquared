    accepted_answers:
    - value: deduction
      status: correct
    - value: Deduction
      status: correct
    feedback: '*deduction*은 증거에 바탕을 둔 추론이라는 뜻이에요.'
  en.b2.unit02.lesson01.exercise05.write_guesswork:
    instruction: 증거가 거의 없거나 전혀 없는 짐작을 뜻하는 영어 단어를 쓰세요.
    accepted_answers:
    - value: guesswork
      status: correct
    - value: Guesswork
      status: correct
    feedback: '*guesswork*는 어림짐작이라는 뜻이에요.'
  en.b2.unit02.lesson02.exercise01.choose_past_deduction:
    instruction: 증거에서 과거에 대한 강한 결론을 이끌어 내는 문장은 어느 것일까요?
    correct_option: The server must have gone down overnight because no reports were generated.
    distractors:
    - The reports may have failed during the night.
    - It might have been a permission issue instead.
    - It cannot have been only a report problem.
    accepted_answers:
    - value: The server must have gone down overnight because no reports were generated.
      status: correct
    feedback: '*must have gone down*은 과거에 대한 강한 결론이에요.'
  en.b2.unit02.lesson02.exercise02.choose_weak_past_possibility:
    instruction: 강한 확신 없이 과거의 가능한 원인을 제시하는 문장은 어느 것일까요?
    correct_option: It might have been a permission issue instead.
    distractors:
    - The server must have gone down overnight because no reports were generated.
    - It cannot have been only a report problem.
    - This must be true.
    accepted_answers:
