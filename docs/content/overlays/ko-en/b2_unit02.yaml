    - value: The server must've gone down overnight.
      status: correct
    - value: The server must've gone down last night
      status: correct
    - value: The server must've gone down last night.
      status: correct
    feedback: '*must have gone down*은 여기서 ''다운되었음이 틀림없다''는 뜻이에요.'
  en.b2.unit02.lesson02.exercise05.write_cannot_have:
    instruction: '''cannot have been''을 써서, 단지 보고서 문제 하나만은 아니었을 리가 없다는 문장을 쓰세요.'
    accepted_answers:
    - value: It cannot have been only a report problem.
      status: correct
    - value: It cannot have been only a report problem
      status: correct
    - value: It can't have been only a report problem.
      status: correct
    - value: It can't have been only a report problem
      status: correct
    - value: It cannot have just been a report problem.
      status: correct
    - value: It cannot have just been a report problem
      status: correct
    - value: It can't have just been a report problem.
      status: correct
    - value: It can't have just been a report problem
      status: correct
    - value: It cannot have only been a report problem.
      status: correct
    - value: It cannot have only been a report problem
      status: correct
    - value: It can't have only been a report problem.
      status: correct
    - value: It can't have only been a report problem
      status: correct
    feedback: '*cannot have been*이나 *can''t have been*은 과거에 대한 설명을 배제해요.'
  en.b2.unit02.lesson03.exercise01.choose_asserted_fact:
    instruction: 추측이 아니라 사실로 제시된 진술은 어느 것일까요?
    correct_option: The overnight reports did not run
    distractors:
