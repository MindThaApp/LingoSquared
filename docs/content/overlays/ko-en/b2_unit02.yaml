      - left: strong past deduction
        right: 서버가 다운되었음이 틀림없다
      - left: weaker possible cause
        right: 권한 문제였을지도 모른다
      - left: explanation rejected by evidence
        right: 이것으로는 모니터링 페이지가 비어 있는 이유가 설명되지 않는다
      - left: possible result
        right: 대시보드가 오래된 데이터를 보여 줄지도 모른다
      status: correct
    feedback: 사실, 강한 결론, 가능성, 배제된 설명, 가능한 결과의 차이를 구분해 보세요.
