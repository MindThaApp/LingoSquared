    instruction: 무작위로 찍은 것이 아니라 증거에 바탕을 둔 결론을 뜻하는 단어는 무엇일까요?
    correct_option: deduction
    distractors:
    - guesswork
    - may
    - cannot
    accepted_answers:
    - value: deduction
      status: correct
    feedback: '*deduction*은 증거에서 논리적으로 이끌어 낸 결론이라는 뜻이에요.'
  en.b2.unit02.lesson01.exercise02.choose_cannot:
    instruction: 화자가 어떤 일이 불가능하거나 거의 불가능하다고 믿는다는 것을 나타내는 조동사는 무엇일까요?
    correct_option: cannot
