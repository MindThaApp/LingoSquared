teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: 박물관
    note: '*museum*은 박물관이라는 뜻이에요. 한국어 "박물관"처럼 건물 이름으로 써요.'
    example_gloss: 이 박물관은 아주 오래됐어요.
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: 표
    note: '*ticket*은 입장할 수 있게 해 주는 표라는 뜻이에요.'
    example_gloss: 표 한 장 주세요.
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: 전시회
    note: '*exhibition*은 감상할 수 있게 모아 놓은 미술품이나 물건들을 뜻해요.'
    example_gloss: 새 전시회가 있어요.
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: 그림
    note: '*painting*은 물감으로 그린 미술 작품이라는 뜻이에요.'
    example_gloss: 저는 이 그림이 정말 마음에 들어요.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: 조각상
    note: '*sculpture*는 돌, 나무, 금속으로 만든 미술 작품을 뜻해요. "조각상"이나 "조각품"과 비슷해요.'
    example_gloss: 이 조각상도 아주 오래됐어요.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: 안내원
    note: '*guide*는 방문객을 안내하고 설명해 주는 사람이라는 뜻이에요.'
    example_gloss: 오늘 안내원이 있어요?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: 박물관이 몇 시에 열어요?
    note: 이 질문은 *what time*으로 시작하고, 주동사가 *open*이므로 도우미 동사 *does*가 뒤따라요.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: 박물관이 몇 시에 닫아요?
    note: '*What time does the museum open?*와 같은 질문 구조이고, *open* 대신 *close*를 써요.'
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: 표 두 장 주세요.
    note: 끝에 *please*를 붙이면 음식을 주문할 때처럼 정중한 부탁이 돼요.
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: 전시회 안내원이 있어요?
    note: '*Is there...?*는 무언가가 있는지 물을 때 써요. 여기서는 안내원이 있는지 묻고 있어요.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: 박물관은 매일 열어요.
    note: '*every day*는 매일이라는 뜻이고, 문장 끝에 와요.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: 그림들이 정말 좋았어요!
    note: '*enjoyed*는 *enjoy*(즐기다)의 과거형으로, 즐거웠던 일을 돌아볼 때 써요.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: 대니얼의 질문
    gloss: '대니얼이 말해요: 안녕하세요! 박물관이 몇 시에 닫아요?'
    note: '*Hi!*는 편하게 하는 인사예요.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: 직원이 대답해요
    gloss: '직원이 말해요: 5시에 닫아요.'
    note: '*at* 뒤에 시각을 쓰면 일이 일어나는 때를 나타내요. *at five o''clock*처럼요.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: 미아의 부탁
    gloss: '미아가 말해요: 좋아요. 표 두 장 주시겠어요?'
    note: '*Can we have...?*는 정중하게 주문하거나 부탁하는 표현이에요.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: 가격
    gloss: '직원이 말해요: 물론이죠. 12달러예요.'
    note: '*That''s* 뒤에 금액을 쓰면 가격을 말하는 표현이 돼요.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: 안내원에 대한 대니얼의 질문
    gloss: '대니얼이 묻습니다: 전시회 안내원이 있어요?'
    note: 2과에서 배운 *Is there...?* 구조와 같아요.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: 직원이 안내원에 대해 말해요
    gloss: '직원이 말해요: 네, 입구 근처에 안내원이 있어요.'
    note: '*there''s*는 *there is*의 줄임말이에요.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: 미아가 이름을 물어요
    gloss: '미아가 묻습니다: 전시회 이름이 뭐예요?'
    note: '*What is ... called?*는 무언가의 이름을 물을 때 흔히 쓰는 표현이에요.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: 전시회 이름
    gloss: '직원이 말해요: Colors of the City라고 해요.'
    note: '*It''s called...*는 *What is ... called?*라는 질문에 대한 대답이에요.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: 대니얼의 마무리 인사
    gloss: '대니얼이 말해요: 감사합니다! 그림들을 빨리 보고 싶어요.'
    note: '*can''t wait to...*는 무언가를 하고 싶어서 몹시 기대된다는 뜻이에요.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: 박물관 안내판
    gloss: '시립 박물관: 매일 개관, 9:00~5:00. 성인 표: $6. 현재 전시회: Colors of the City, 2번 전시실.'
    note: 안내판에는 개관 시간, 가격, 전시회 이름이 나와 있어요.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: '본문: 대니얼과 미아'
    gloss: '박물관 방문: 어느 토요일 오후, 대니얼과 미아는 함께 시립 박물관에 가기로 했어요. 입구에서 직원은 박물관이 5시에 닫는다고 알려 주었어요. 두 사람은 표 두 장을 12달러에 샀어요. 대니얼이 안내원이 있는지 묻자, 직원은 입구 근처에 안내원이 있다고 말했어요. 두 사람은 Colors of the City 전시회를 보러 갔고, 2번 전시실에서 아름다운 그림을 많이 봤어요. 대니얼은 옛 도시 광장을 그린 그림이 마음에 들었고, 미아는 해 질 녘 강을 그린 그림이 마음에 들었어요. 나갈 때 미아는 다음에는 조각 전시회를 보러 오고 싶다고 말했어요.'
    note: '*decided to visit*에서는 *decided* 뒤에 *to* + 동사원형을 써서 무엇을 하기로 했는지 나타내요.'
