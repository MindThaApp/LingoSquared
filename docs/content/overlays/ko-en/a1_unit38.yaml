teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: 집안일
    note: '*chore*는 집을 깨끗하고 단정하게 유지하려고 정기적으로 하는 ''집안일''이라는 뜻이에요.'
    example_gloss: 설거지는 제가 가장 싫어하는 집안일이에요.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: 설거지거리
    note: '*dishes*는 ''설거지거리''라는 뜻이에요. 씻어야 하는 접시, 컵, 수저를 말해요.'
    example_gloss: 저는 저녁 식사 후에 설거지를 해요.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: 빨래
    note: '*laundry*는 ''빨래''라는 뜻이에요. 빨고, 말리고, 개는 옷을 말해요.'
    example_gloss: 그녀는 일요일에 빨래를 해요.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: 청소기를 돌리다
    note: '*vacuum*은 ''청소기를 돌리다''라는 뜻이에요.'
    example_gloss: 그는 토요일마다 거실에 청소기를 돌려요.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: 쓰레기
    note: '*trash*는 ''쓰레기''라는 뜻이에요.'
    example_gloss: 쓰레기 좀 내놓아 줄래요?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: 청소하다
    note: '*clean*은 ''청소하다''라는 뜻이에요.'
    example_gloss: 우리는 함께 아파트를 청소해요.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: 설거지하다
    note: '*wash the dishes*는 그릇을 씻는다는 뜻이에요. *Do the dishes*도 똑같이 흔하게 쓰고 같은 뜻이에요(''설거지하다'').'
    example_gloss: 저는 매일 저녁 설거지를 해요.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: 빨래하다
    note: '*do the laundry*는 ''빨래하다''라는 뜻이에요.'
    example_gloss: 그녀는 일요일에 빨래를 해요.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: 쓰레기를 내놓다
    note: '*take out the trash*에는 *take out*을 써요, *do*가 아니에요. *do the laundry*나 *do the dishes*와 달리 여기서는 *do*를 쓸 수 없어요.'
    example_gloss: 쓰레기 좀 내놓아 줄래요?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: 화장실을 청소하다
    note: '*clean the bathroom*은 ''화장실을 청소하다''라는 뜻이에요.'
    example_gloss: 그는 주말에 화장실을 청소해요.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: ~해야 하다
    note: '*need to*는 무언가를 해야 한다는 뜻이에요.'
    example_gloss: 저는 이번 주말에 거실에 청소기를 돌려야 해요.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: 설거지 좀 도와줄래요?
    note: 집안일에 대해 도움을 청하는 공손한 표현이에요.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 미아가 말해요. 우리 집이 엉망이에요. 이번 주말에 손님이 오거든요.
    note: '*a mess*는 ''엉망, 난장판''이라는 뜻이에요.'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: 다니엘의 제안
    gloss: 다니엘이 물어요. 청소하는 거 도와줄까요?
    note: '*Do you want some help ...ing?*은 도움을 제안하는 자연스러운 표현이에요.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "미아의 대답"
    gloss: 미아가 말해요. 네, 좋아요! 거실에 청소기를 돌리고 설거지를 해야 해요.
    note: '*I need to* + 동사는 ''~해야 해요''라는 뜻이에요.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: 다니엘의 제안
    gloss: 다니엘이 말해요. 청소기는 제가 돌릴 수 있어요. 설거지는 미아가 하면 돼요.
    note: '*for you*는 여기서 ''당신 대신''이라는 뜻이에요.'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: 미아의 덧붙임
    gloss: 미아가 말해요. 고마워요! 빨래도 해야 해요.
    note: '*still need to*는 ''아직 ~해야 해요''라는 뜻이에요.'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: 다니엘의 제안
    gloss: 다니엘이 말해요. 오늘은 그럴 시간이 없지만, 나가기 전에 쓰레기는 내놓을 수 있어요.
    note: '*before I leave*는 ''나가기 전에''라는 뜻이에요.'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: 미아의 감사
    gloss: 미아가 말해요. 정말 큰 도움이 될 거예요. 정말 고마워요!
    note: '*That would help a lot*은 ''정말 큰 도움이 될 거예요''라는 뜻이에요. 여기서 *Would*는 표현을 더 공손하게 만들어요.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: 집에서의 집안일에 관한 글
    gloss: 다니엘, 레일라, 미아는 각자 집안일 습관이 있어요. 다니엘은 매일 저녁 식사 후에 설거지를 하고 토요일에는 아파트에 청소기를 돌려요. 레일라는 빨래하는 건 괜찮지만 화장실 청소는 정말 싫어해요. 미아의 고양이 루나의 털이 여기저기 있어서, 미아는 거의 매일 아파트에 청소기를 돌려요. 지난 주말에 미아에게 손님이 와서 다니엘이 도와주겠다고 했어요. 그는 거실에 청소기를 돌리고 미아 대신 쓰레기를 내놓았어요. 미아는 도와준 다니엘에게 매우 고마워했어요.
    note: '*doesn''t mind*는 ''개의치 않아요, 괜찮아해요''라는 뜻이에요.'
