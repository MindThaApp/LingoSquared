    note: '*birthday*는 ''생일''이라는 뜻이에요.'
    example_gloss: 제 생일은 10월이에요.
  en.a1.unit37.lesson01.teach.party:
    title: party
    gloss: 파티
    note: '*party*는 ''파티''라는 뜻이에요.'
    example_gloss: 우리는 토요일에 파티를 열어요.
  en.a1.unit37.lesson01.teach.gift:
    title: gift
    gloss: 선물
    note: '*gift*는 ''선물''이라는 뜻이에요.'
    example_gloss: 저는 그녀에게 줄 멋진 선물을 샀어요.
  en.a1.unit37.lesson01.teach.invite:
    title: invite
    gloss: 초대하다
    note: '*invite*는 ''초대하다''라는 뜻이에요.'
    example_gloss: 저는 친구들을 초대하고 싶어요.
  en.a1.unit37.lesson01.teach.celebrate:
    title: celebrate
    gloss: 기념하다
    note: '*celebrate*는 ''기념하다, 축하하며 즐기다''라는 뜻이에요.'
    example_gloss: 우리 함께 축하해요!
  en.a1.unit37.lesson01.teach.congratulations:
    title: congratulations
    gloss: 축하해요
    note: '*congratulations*는 ''축하해요''라는 뜻이에요. 누군가에게 어떤 일을 축하할 때 써요.'
    example_gloss: 새 직장 축하해요!
  en.a1.unit37.lesson02.teach.invite_someone_to:
    title: invite someone to
    gloss: 누군가를 ~에 초대하다
    note: '*invite someone to*는 누군가를 어떤 자리에 초대한다는 뜻이에요.'
    example_gloss: 저는 동료들을 제 생일 파티에 초대해요.
  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: 누군가의 ~을 축하하다
    note: '*congratulate someone* 뒤에는 항상 전치사 *on*을 써요(*with*나 *for*가 아니에요). 한국어의 ''~을 축하하다''에는 이런 전치사가 없으니 *on*을 따로 외워 두세요.'
    example_gloss: 우리는 그의 승진을 축하해요.
  en.a1.unit37.lesson02.teach.wish_someone_happy_birthday:
    title: wish someone a happy birthday
    gloss: 누군가에게 생일 축하 인사를 하다
    note: '*wish someone a happy birthday*는 누군가에게 생일 축하 인사를 한다는 뜻이에요.'
    example_gloss: 생일 축하해요.
  en.a1.unit37.lesson02.teach.surprise_party:
    title: surprise party
    gloss: 깜짝 파티
    note: '*surprise party*는 ''깜짝 파티''라는 뜻이에요.'
    example_gloss: 그들은 그녀를 위해 깜짝 파티를 준비하고 있어요.
  en.a1.unit37.lesson02.teach.have_a_party:
    title: have a party
    gloss: 파티를 열다
    note: '*have a party*는 ''파티를 열다''라는 뜻이에요.'
    example_gloss: 우리는 해마다 10월에 파티를 열어요.
  en.a1.unit37.lesson02.teach.come_to_my_party_question:
    title: Do you want to come to my party?
    gloss: 제 파티에 올래요?
    note: 누군가를 초대할 때 쓰는 친근하고 편한 표현이에요.
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: 레일라의 질문
    gloss: 레일라가 물어요. 다니엘 생일이 10월 12일인 거 알았어요?
    note: '*Did you know ...?*는 새로운 정보로 대화를 시작하는 자연스러운 표현이에요.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: 미아의 반응
    gloss: 미아가 말해요. 아니요, 몰랐어요! 이번 주 금요일이네요.
    note: '*No, I didn''t!*는 *Did you know ...?* 질문에 대한 짧은 부정 대답이에요. ''아니요, 몰랐어요.''라는 뜻이에요.'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: 레일라의 제안
    gloss: 레일라가 말해요. 사무실에서 그를 위해 깜짝 파티를 열어요.
    note: '*Let''s* + 동사는 제안할 때 써요. 한국어의 ''~하자'', ''~해요''와 같아요.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: 미아의 반응
    gloss: 미아가 말해요. 좋은 생각이에요! 팀 나머지 사람들을 초대할 수 있어요.
    note: '*the rest of the team*은 ''팀의 나머지 사람들''이라는 뜻이에요.'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: 레일라의 계획
    gloss: 레일라가 말해요. 좋아요. 저는 선물을 사 줄게요. 새 러닝화가 좋겠어요. 그는 달리기를 아주 좋아하니까요.
    note: '*since*는 여기서 ''~니까''(이유)라는 뜻이에요. ''~이후로''(시간)가 아니에요.'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: 미아의 제안
    gloss: 미아가 말해요. 좋은 생각이에요. 케이크도 살까요?
    note: '*Should we ...?*는 함께 무언가를 정할 때 써요.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 네, 좋아요! 다 같이 그에게 생일 축하 인사를 할 거예요.
    note: '*We''ll all wish him a happy birthday*는 ''우리 모두 그에게 생일 축하 인사를 할 거예요''라는 뜻이에요.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: 깜짝 파티에 관한 글
    gloss: 다니엘은 레일라와 미아가 자신을 위한 깜짝 파티를 준비하는 줄 몰랐어요. 생일인 10월 12일, 그는 직장에 도착해서 휴게실에서 풍선과 케이크를 발견했어요. 모두가 그에게 생일 축하 인사를 했어요. 레일라는 새 러닝화 한 켤레를 주었어요. 미아는 세 동료가 함께 있는 사진을 직접 찍어 액자에 넣어서 선물했어요. 다니엘은 매우 기뻐하며 멋진 깜짝 선물에 모두에게 고마워했어요.
    note: '*he arrived at work and found*는 *arrive*와 *find*의 과거형이에요(직장에 도착해서 ...를 발견했어요).'
