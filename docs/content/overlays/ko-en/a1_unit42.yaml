teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: 친절한
    note: '*friendly*는 ''친절한''이라는 뜻이에요. 상냥하고 말을 걸기 편한 사람을 말해요.'
    example_gloss: 제 이웃은 정말 친절해요.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: 웃긴 / 재미있는
    note: '*funny*는 ''웃긴'', ''재미있는''이라는 뜻이에요. 다른 사람을 웃게 만드는 사람을 말해요.'
    example_gloss: 제 형은 정말 웃겨요.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: 부지런한 / 성실한
    note: '*hardworking*은 ''부지런한'', ''성실한''이라는 뜻이에요. 쉽게 포기하지 않고 열심히 일하는 사람을 말해요.'
    example_gloss: 그녀는 성실한 직원이에요.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: 수줍음이 많은
    note: '*shy*는 ''수줍음이 많은''이라는 뜻이에요. 새로운 사람 앞에서 부끄러워하거나 긴장하는 사람을 말해요.'
    example_gloss: 그는 처음에는 조금 수줍어해요.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: 차분한
    note: '*calm*은 ''차분한''이라는 뜻이에요. 쉽게 당황하거나 긴장하지 않는 사람을 말해요.'
    example_gloss: 우리 어머니는 아주 차분해요.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: 말이 많은 / 수다스러운
    note: '*talkative*는 ''말이 많은'', ''수다스러운''이라는 뜻이에요. 이야기를 많이 하는 사람을 말해요.'
    example_gloss: 제 여동생은 정말 수다스러워요.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: 조금 수줍음이 많은
    note: 여기서 *a little*은 크기가 작다는 뜻이 아니라 정도가 '조금'이라는 뜻이에요. '작은 수줍음'처럼 글자 그대로 옮기지 않도록 주의하세요.
    example_gloss: 그는 처음에는 조금 수줍어하지만 금방 마음을 열어요.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: 아주 성실한
    note: '*very hardworking*은 ''아주 성실한''이라는 뜻이에요.'
    example_gloss: 제 동료는 아주 성실해요.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: 유머 감각이 뛰어나다
    note: '*have a great sense of humor*는 ''유머 감각이 뛰어나다''라는 뜻이에요.'
    example_gloss: 대니얼은 유머 감각이 뛰어나요.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: 모든 사람과 잘 지내다
    note: '*get along with everyone*은 ''모든 사람과 잘 지내다''라는 뜻이에요.'
    example_gloss: 미아는 직장에서 모든 사람과 잘 지내요.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: 금방 마음을 열다 / 금세 편해지다
    note: '*warm up quickly*는 새로운 사람에게 ''금방 마음을 열다''라는 뜻이에요.'
    example_gloss: 그는 수줍음이 많지만, 알고 나면 금방 마음을 열어요.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: 그는 어떤 사람이에요?
    note: '*What''s he like?*는 겉모습이 아니라 사람의 성격을 묻는 말이에요.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: 미아의 질문
    gloss: '미아: 저 다음 주에 대니얼과 새 프로젝트를 시작해요. 그는 어떤 사람이에요?'
    note: '*What''s he like?*는 사람의 성격을 묻는 말이에요.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "레일라의 대답"
    gloss: '레일라: 아주 친절하고, 정말 재미있기도 해요.'
    note: '*and he''s really funny too*는 ''그리고 정말 재미있기도 해요''라는 뜻이에요.'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: 미아의 질문
    gloss: '미아: 다행이네요! 같이 일하기 편한 사람이에요?'
    note: '*Is he easy to work with?*는 함께 일하기 편한 사람인지 묻는 말이에요.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "레일라의 대답"
    gloss: '레일라: 네, 아주 성실하기도 해요. 맡은 일을 항상 제시간에 끝내요.'
    note: '*finishes his tasks on time*은 ''맡은 일을 제시간에 끝낸다''는 뜻이에요.'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: 미아의 질문
    gloss: '미아: 회의에서 수줍어할 때도 있어요?'
    note: 여기서 *ever*는 '혹시 ~할 때가 있다'라는 뜻이에요.
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "레일라의 대답"
    gloss: '레일라: 조금요, 하지만 알고 나면 더 편해져요.'
    note: '*once he knows you*는 ''당신을 알고 나면''이라는 뜻이에요.'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: 미아의 감사
    gloss: '미아: 고마워요, 레일라. 이제 프로젝트가 한결 마음이 편해졌어요.'
    note: '*I feel more relaxed*는 ''마음이 더 편해졌어요''라는 뜻이에요.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: 세 가지 성격에 관한 글
    gloss: 대니얼, 레일라, 미아는 친한 친구이지만 성격이 아주 달라요. 대니얼은 친절하고 재미있어서 친구들을 늘 웃게 만들어요. 새로운 사람을 만나면 조금 수줍어하지만 금방 마음을 열어요. 레일라는 차분하고 창의적이에요. 그림을 그리면 마음이 편안해져서 그림 그리기를 좋아하고, 어떤 일에도 좀처럼 화내지 않아요. 미아는 활달하고 꼼꼼해요. 모임을 위한 계획 세우기를 좋아하고, 친구들에게 새로운 것을 가르칠 때 아주 인내심이 있어요. 대니얼에게 요리를 가르쳐 준 것도 미아예요. 모두 서로 다르지만, 잘 지내고 함께 시간을 보내는 것을 즐겨요.
    note: '*even though*는 ''~이지만'', ''비록 ~일지라도''라는 뜻이에요.'
