teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: 지금 몇 시예요?
    note: '*What time is it?*는 현재 시각을 일반적으로 묻는 말이에요.'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: 3시 정각이에요.
    note: '*It''s three o''clock.*는 정각을 말해요.'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: 3시 반이에요.
    note: '*half past three*는 3시에서 30분이 지났다는 뜻으로 3:30이에요. 한국어의 "3시 반"과 같은 방식이에요. 직역하면 "3시 지나서 반"이라는 뜻이지만, 4시 쪽으로 세는 것이 아니에요.'
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: 5시 정각이에요.
    note: '*It''s five o''clock.*는 정각 5:00을 말해요.'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: 3시 15분이에요.
    note: '*It''s a quarter past three.*는 3:15라는 뜻이에요.'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: 4시 15분 전이에요.
    note: '*It''s a quarter to four.*는 3:45라는 뜻이에요.'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: 4시 10분이에요.
    note: '*It''s ten past four.*는 4:10이라는 뜻이에요.'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: 5시 10분 전이에요.
    note: '*It''s ten to five.*는 4:50이라는 뜻이에요.'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: 아침
    note: '*morning*은 아침이나 오전을 뜻하고, 대략 6시부터 12시까지예요.'
    example_gloss: 좋은 아침이에요, 대니얼!
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: 오후
    note: '*afternoon*은 오후를 뜻하고, 대략 12시부터 17시까지예요.'
    example_gloss: 저는 오후에 일해요.
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: 저녁
    note: '*evening*은 저녁을 뜻하고, 대략 17시부터 21시까지예요. 경계는 분명하지 않아요.'
    example_gloss: 좋은 저녁이에요, 레일라!
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: 밤
    note: '*night*은 밤을 뜻하고, 대략 21시부터 6시까지예요.'
    example_gloss: 안녕히 주무세요, 대니얼!
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: 가게는 아침 9시에 문을 열어요.
    note: 영어에서는 시각 앞에 *at*을 써요(*at nine*). 한국어에서는 "9시에"처럼 조사 "에"가 시각 뒤에 붙어요.
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: 가게는 저녁 6시에 문을 닫아요.
    note: 영어에서는 일상적으로 *six in the evening*처럼 12시간제에 시간대를 붙여 말해요. 한국어에서도 "저녁 6시"나 "오후 6시"라고 하고, 공식 시간표에서는 18시라고도 해요.
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: ~시에 열다
    note: '*opens at* + 시각은 "~시에 문을 연다"라는 뜻이에요.'
    example_gloss: 도서관은 9시에 문을 열어요.
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: ~시에 닫다
    note: '*closes at* + 시각은 "~시에 문을 닫는다"라는 뜻이에요.'
    example_gloss: 도서관은 6시에 문을 닫아요.
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel fragt nach der Öffnungszeit
    gloss: '대니얼: 도서관은 몇 시에 문을 열어요?'
    note: '*What time does ...?*는 정확한 시각을 묻는 말이에요. 질문에 *does*가 있어서 *open*에는 -s를 붙이지 않아요.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Antwort zur Öffnungszeit
    gloss: '레일라: 아침 9시에 열어요.'
    note: 완전한 대답에는 정확한 시각과 시간대가 들어 있어요.
  en.a1.unit05.lesson04.teach.q_close:
    title: Nach der Schließzeit fragen
    gloss: '대니얼: 그럼 몇 시에 닫아요?'
    note: '*And*는 같은 대화에서 두 번째 질문을 이어 줘요.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Antwort zur Schließzeit
    gloss: '레일라: 저녁 6시에 닫아요.'
    note: 여기서도 완전한 대답은 정확한 시각을 말해요.
  en.a1.unit05.lesson04.teach.closing:
    title: Das Gespräch beenden
    gloss: '대니얼: 좋아요, 9시에 봐요!'
    note: '*See you at nine!*은 9시에 다시 만나자는 뜻이에요.'
