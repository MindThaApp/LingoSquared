teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: 안녕하세요
    note: '*Hello*는 중립적이고 보편적인 인사예요. 거의 모든 상황에서 쓸 수 있어요.'
    example_gloss: 안녕하세요, 대니얼!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: 안녕 (편한 인사)
    note: '*Hi*는 *Hello*보다 편한 인사예요. 한국어에서 친구끼리 "안녕" 하고 인사하는 것과 비슷해요.'
    example_gloss: 안녕, 레일라!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: 좋은 아침이에요 / 안녕하세요 (아침 인사)
    note: '*Good morning*은 아침에 쓰는 인사예요. 한국어의 "좋은 아침이에요"에 해당해요.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: 안녕하세요 (오후 인사)
    note: '*Good afternoon*은 오후에 쓰는 인사예요. 영어에는 하루 종일 쓸 수 있는 "안녕하세요" 같은 인사가 따로 없어서 시간대에 맞게 골라 써요.'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: 안녕하세요 (저녁 인사)
    note: '*Good evening*은 저녁에 쓰는 인사예요.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: 안녕히 가세요 / 안녕히 계세요
    note: '*Goodbye*는 중립적이고 보편적인 작별 인사예요.'
    example_gloss: 안녕히 가세요, 내일 봐요!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: 잘 가 / 안녕 (편한 작별 인사)
    note: '*Bye*는 *Goodbye*보다 편한 작별 인사예요. 한국어의 "잘 가"나 "안녕"과 비슷해요.'
    example_gloss: 안녕, 곧 봐요!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: 어떻게 지내세요? / 잘 지내요?
    note: '*How are you?*는 영어에서 격식 있는 자리에서도 편한 자리에서도 쓸 수 있어요. 한국어와 달리 존댓말과 반말의 구분이 따로 없어요.'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: 저는 잘 지내요, 고마워요.
    note: 간단하고 중립적인 대답이에요.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: 저는 잘 지내요, 고마워요.
    note: '*I''m fine, thanks*와 뜻이 같아요. 일상에서 둘 다 똑같이 자주 써요.'
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: 나쁘지 않아요, 고마워요.
    note: 편하고 조금 소탈한 대답이에요. 아주 좋지도 나쁘지도 않다는 느낌이에요.
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: 당신은요? / 너는?
    note: 같은 질문을 되돌려 묻는 표현이에요. 어떤 상황에서도 그대로 쓸 수 있어요.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: 괜찮아요?
    note: '*Are you okay?*는 *How are you?* 같은 일반적인 인사말이 아니라, 상대에게 지금 무슨 문제가 있는지 묻는 느낌이에요.'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: 만나서 반갑습니다.
    note: 처음 만난 사람에게 하는 말이에요.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: 저도 만나서 반가워요.
    note: '*Nice to meet you*에 대한 알맞은 대답이에요.'
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: 이따 봐요.
    note: 같은 날 그 사람을 다시 만날 때 써요. 한국어의 "이따 봐요"와 쓰임이 같아요.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: 좋은 하루 보내세요.
    note: 상대가 남은 하루를 잘 보내길 바라는 다정한 작별 인사예요.
