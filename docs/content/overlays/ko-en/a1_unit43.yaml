teaching:
  en.a1.unit43.lesson01.teach.red:
    title: red
    gloss: 빨간색
    note: '*red*는 ''빨간색''이라는 뜻이에요.'
    example_gloss: 제 차는 빨간색이에요.
  en.a1.unit43.lesson01.teach.blue:
    title: blue
    gloss: 파란색
    note: '*blue*는 ''파란색''이라는 뜻이에요.'
    example_gloss: 하늘은 파란색이에요.
  en.a1.unit43.lesson01.teach.green:
    title: green
    gloss: 초록색
    note: '*green*은 ''초록색''이라는 뜻이에요.'
    example_gloss: 풀은 초록색이에요.
  en.a1.unit43.lesson01.teach.yellow:
    title: yellow
    gloss: 노란색
    note: '*yellow*는 ''노란색''이라는 뜻이에요.'
    example_gloss: 해는 노란색이에요.
  en.a1.unit43.lesson01.teach.black:
    title: black
    gloss: 검은색
    note: '*black*은 ''검은색''이라는 뜻이에요.'
    example_gloss: 그의 신발은 검은색이에요.
  en.a1.unit43.lesson01.teach.white:
    title: white
    gloss: 흰색
    note: '*white*는 ''흰색''이라는 뜻이에요.'
    example_gloss: 그녀의 셔츠는 흰색이에요.
  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: 짙은 파란색 / 남색
    note: '*dark blue*는 영어에서 두 단어로 띄어 써요. 한국어의 ''짙은 파란색''처럼 수식어 *dark*가 색 이름 앞에 와요.'
    example_gloss: 그는 짙은 파란색 셔츠를 입고 있어요.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: 연한 초록색
    note: '*light green*도 *dark blue*처럼 두 단어로 띄어 써요.'
    example_gloss: 그녀는 자기 침실을 연한 초록색으로 칠했어요.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: ~와 잘 어울리다
    note: '*goes well with*는 두 가지 색이나 옷이 서로 잘 어울린다는 뜻이에요.'
    example_gloss: 이 파란색 셔츠는 검은색 바지와 잘 어울려요.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: 너무 밝은
    note: '*too bright*는 색이 ''너무 밝고 튄다''는 뜻이에요.'
    example_gloss: 노란색은 재미있는 색이지만, 직장에 입기에는 너무 밝아요.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: 가장 좋아하는 색이 뭐예요?
    note: '*What''s your favorite ...?*는 무엇을 가장 좋아하는지 묻는 말이에요.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: 제가 가장 좋아하는 색은 파란색이에요.
    note: '*My favorite ... is ...*는 좋아하는 것을 말할 때 쓰는 기본 표현이에요.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: 대니얼의 질문
    gloss: '대니얼: 다음 주 발표에 입을 새 셔츠가 필요해요. 색을 고르는 걸 도와줄래요?'
    note: '*Can you help me* + 동사*?*는 도움을 청하는 말이에요.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: 미아의 질문
    gloss: '미아: 물론이죠! 어떤 색을 좋아해요?'
    note: '*What colors do you like?*는 어떤 색을 좋아하는지 묻는 말이에요.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "대니얼의 대답"
    gloss: '대니얼: 파란색이랑 초록색이 좋은데, 뭐가 전문적으로 보일지 잘 모르겠어요.'
    note: '*I''m not sure what looks professional*은 ''뭐가 전문적으로 보일지 잘 모르겠다''는 뜻이에요.'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: 미아의 조언
    gloss: '미아: 짙은 파란색이 아주 좋아요. 전문적으로 보이고, 검은색 바지와도 잘 어울려요.'
    note: '*It looks professional*은 ''전문적으로 보여요''라는 뜻이에요.'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: 대니얼의 질문
    gloss: '대니얼: 이 노란색은 어때요?'
    note: '*What about ...?*는 다른 선택지를 제안할 때 써요.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: 미아의 조언
    gloss: '미아: 노란색은 재미있는 색이지만 발표에는 너무 밝아요. 저라면 짙은 파란색 셔츠를 고르겠어요.'
    note: '*I''d choose*는 ''저라면 고르겠어요''라는 뜻이에요.'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: 대니얼의 결정
    gloss: '대니얼: 고마워요, 미아. 그럼 짙은 파란색으로 할게요!'
    note: '*Dark blue it is!*는 결정을 확정할 때 쓰는 편한 표현이에요.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: 세 가지 좋아하는 색에 관한 글
    gloss: 대니얼, 레일라, 미아는 모두 좋아하는 색이 달라요. 대니얼이 가장 좋아하는 색은 파란색이에요. 그는 파란색이 차분한 색이고, 직장에 입고 가는 거의 모든 옷과 잘 어울린다고 말해요. 레일라가 가장 좋아하는 색은 초록색이에요. 그림으로 즐겨 그리는 식물과 정원의 색이기 때문이에요. 레일라는 연한 초록색이 특히 아름답다고 생각해요. 미아가 가장 좋아하는 색은 노란색이에요. 노란색을 보면 해가 떠오르고 늘 기분이 좋아지기 때문이에요. 셋은 좋아하는 색이 다르지만, 색깔이 하루하루를 더 즐겁게 해 준다는 데에는 모두 동의해요.
    note: '*reminds her of the sun*은 ''해를 떠올리게 한다''는 뜻이에요.'
