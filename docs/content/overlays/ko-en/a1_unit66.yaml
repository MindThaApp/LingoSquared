    title: '읽기: 약국 메모'
teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: 증상
    note: '*symptom*은 몸에서 느껴지는 ''증상''이에요. 철자에 *y*가 들어가는 것에 주의하세요.'
    example_gloss: 이건 증상이에요.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: 기침
    note: '*cough*는 ''기침''이에요. ''코프''처럼 발음하고, *gh*는 여기서 *f* 소리가 나요.'
    example_gloss: 저는 기침이 나요.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: 열
    note: '*fever*는 ''열''이에요. ''피버''처럼 발음하고, 철자에 주의하세요.'
    example_gloss: 열이 있어요?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: 목, 목구멍
    note: '*throat*는 ''목구멍, 목 안쪽''이에요. 한국어 ''목''은 안쪽과 바깥쪽을 모두 가리키지만, 영어에서 바깥쪽 목은 *neck*이라고 해요.'
    example_gloss: 목이 아파요.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: 두통
    note: '*headache*는 ''두통''이에요(영어에서는 단수형으로 써요).'
    example_gloss: 머리가 아파요.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: 약
    note: '*medicine*은 ''약''이에요. 셀 수 없는 명사라서 *some medicine*이라고 해요.'
    example_gloss: 이 약을 드세요.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: 기침이 나요.
    note: 영어에서는 *have a cough*처럼 *a*를 붙여요. 한국어에는 관사가 없어서 '기침이 나요'라고만 하니까 *a*를 빠뜨리기 쉬워요.
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: 목이 아파요.
    note: '*hurts*는 ''아프다''라는 뜻이에요. 영어에서는 *my throat hurts*처럼 아픈 부위가 주어가 돼요. 한국어의 ''목이 아파요''와 비슷한 구조예요.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: 머리가 아파요.
    note: 영어에서는 *have a headache*처럼 *a*를 붙여요. 한국어에는 관사가 없으니 *a*를 빠뜨리지 않도록 주의하세요.
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: 약 있어요?
    note: '*Do you have...?*는 무언가가 있는지 물어요.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: 이걸 물과 함께 드세요.
    note: '*with water*는 문장 끝에 와요.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: 의사 선생님께 물어보세요.
    note: '*Please*를 붙이면 문장이 공손해져요.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: 레일라가 증상을 말해요
    gloss: 레일라가 말해요. 안녕하세요. 기침이 나요.
    note: '*I have a cough*는 증상을 말하는 문장이에요.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: 약사가 열이 있는지 물어요
    gloss: 약사가 말해요. 열이 있으세요?
    note: '*Do you have a fever?*는 ''네/아니요''로 답하는 질문이에요.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: 레일라는 열이 없어요
    gloss: 레일라가 말해요. 아니요, 열은 없어요. 목이 아파요.
    note: '*No, I do not have...*로 증상이 없다고 말해요. 영어에서는 *do not*으로 부정하고, 한국어의 ''없어요''처럼 따로 ''없다''는 동사를 쓰지 않아요.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: 약사가 두통이 있는지 물어요
    gloss: 약사가 말해요. 머리가 아프세요?
    note: '*headache*는 ''두통''이라는 뜻이에요.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: 레일라는 머리가 아파요
    gloss: 레일라가 말해요. 네, 머리가 아파요.
    note: '*Yes*는 ''네''라는 뜻이에요.'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: 약사의 조언
    gloss: 약사가 말해요. 이 약을 물과 함께 드세요. 더 나빠지면 의사 선생님께 물어보세요.
    note: '*if you feel worse*는 ''더 나빠지면''이라는 뜻이에요.'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: 레일라가 고맙다고 해요
    gloss: 레일라가 말해요. 고맙습니다.
    note: '*Thank you*는 짧은 감사 인사예요.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: 약국 메모
    gloss: '약국 메모: 기침과 목 통증. 열은 없음. 약은 물과 함께 복용. 더 나빠지면 의사에게 문의.'
    note: 이 메모에는 증상과 간단한 조언이 적혀 있어요.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: '글: 약국 방문'
    gloss: '약국 방문: 레일라는 기침이 나고 목이 아파서 약국에 갔어요. 약사는 열이 있는지 물었어요. 레일라는 열은 없지만 머리가 아프다고 말했어요. 약사는 약을 주면서 물과 함께 먹으라고 했어요. 메모에는 더 나빠지면 의사에게 물어보라고 적혀 있었어요.'
    note: '*felt worse*는 *feel worse*의 과거형이에요.'
