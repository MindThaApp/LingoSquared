teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: 조언, 충고
    note: '*advice*는 상대가 무엇을 하면 좋을지에 대한 의견을 뜻해요.'
    example_gloss: 레일라는 대니얼에게 유용한 조언을 해 주었어요.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: 제안하다
    note: '*suggest*는 생각해 볼 만한 아이디어를 내놓는다는 뜻이에요.'
    example_gloss: 레일라는 업무량을 관리할 방법을 제안했어요.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: 감당하기 벅찬, 압도된
    note: '*overwhelmed*는 해낼 수 있는 것보다 할 일이 더 많다고 느끼는 상태를 뜻해요.'
    example_gloss: 대니얼은 두 프로젝트 때문에 감당하기 벅찼어요.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: 우선순위를 정하다
    note: '*prioritize*는 가장 중요한 일을 먼저 처리한다는 뜻이에요.'
    example_gloss: 대니얼은 마감이 더 가까운 프로젝트를 우선하기로 했어요.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: 업무량
    note: '*workload*는 한 사람이 해야 하는 일의 전체 양을 뜻해요.'
    example_gloss: 대니얼의 업무량은 3월에 팀에 합류한 뒤 늘어났어요.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: 거절하다, 사양하다
    note: '*decline*은 제안이나 권유를 공손하게 거절한다는 뜻이에요.'
    example_gloss: 대니얼은 조언을 받아들일 수도, 공손하게 거절할 수도 있었어요.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + 동사원형
    gloss: 내가 너라면 팀장님과 이야기해 볼 거야.
    note: '*if I were you, I would*는 현실과 다른 가정을 해서 조언할 때 쓰는 형태예요.'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + 동사원형
    gloss: 마감이 더 가까운 프로젝트를 먼저 처리하는 게 좋겠어.
    note: '*you should*는 직접적으로 권하는 표현이에요.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: 동료에게 도와 달라고 부탁해 보면 어때?
    note: '*how about + -ing*는 더 부드럽게 제안하는 표현이에요.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: 조언하는 형태
    gloss: 조언과 제안에는 여러 가지 표현을 써요. If I were you, I would...(현실과 다른 가정), You should...(직접적인 권유), How about + -ing...?(더 부드러운 제안)이 있어요. 얼마나 확신 있게 말하고 싶은지에 따라 더 강한 표현이나 더 부드러운 표현을 골라 쓰세요.
    note: '형태: 현실과 다른 가정, 직접적인 권유, 부드러운 제안 중에서 골라 써요.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: 마감, 기한
    note: '*deadline*은 무언가를 끝내야 하는 날짜를 뜻해요.'
    example_gloss: 대니얼의 더 가까운 마감은 다음 주 금요일이에요.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: 일리가 있네. 해 볼게.
    note: '*that makes sense*는 조언을 이해하고 받아들인다는 뜻을 나타내요.'
    example_gloss: 일리가 있네. 이번 주에 해 볼게.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: '읽기: 일이 너무 많을 때의 조언'
    gloss: 안녕, 레일라. 이번 주에 너무 벅차네. 프로젝트 두 개를 이끄는 데다 저녁 수업까지 있거든. 조언 좀 해 줄래? 안녕, 대니얼. 내가 너라면 팀장님과 업무량에 대해 이야기해 볼 거야. 마감이 더 가까운 프로젝트를 먼저 처리하는 것도 좋겠어. 다른 프로젝트는 미아에게 도와 달라고 부탁해 보면 어때? 고마워, 일리가 있네. 해 보고 어땠는지 알려 줄게.
    note: 동료끼리 주고받는 짧고 다정한 조언이에요.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: 대니얼이 자신의 문제를 설명한다
    gloss: '대니얼이 말해요: 좀 벅차요. 프로젝트 두 개를 이끌고 있는데, 일주일에 세 번 저녁 수업도 있거든요.'
    note: '*a little overwhelmed*는 할 일이 조금 너무 많다고 느끼는 상태를 나타내요.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: 레일라가 첫 조언을 한다
    gloss: '레일라가 말해요: 내가 너라면 팀장님과 업무량에 대해 이야기해 볼 거야.'
    note: '*if I were you, I would*는 현실과 다른 가정을 나타내는 형태예요.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: 대니얼이 망설인다
    gloss: '대니얼이 말해요: 좋은 생각이에요. 그런데 제가 감당하지 못하는 사람처럼 보이고 싶지는 않아요.'
    note: '*I don''t want to seem like*는 남에게 어떻게 보일지에 대한 걱정을 나타내요.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: 레일라가 구체적인 제안 두 가지를 한다
    gloss: '레일라가 말해요: 마감이 더 가까운 프로젝트를 먼저 처리하는 게 좋겠어. 다른 프로젝트는 동료에게 도와 달라고 부탁해 보면 어때?'
    note: '*you should*와 *how about*은 각각 직접적인 제안과 부드러운 제안을 나타내요.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: 대니얼이 조언을 받아들인다
    gloss: '대니얼이 말해요: 그게 좋겠네요. 미아에게 이번 주에 시간이 되는지 물어볼게요.'
    note: '*I like that*은 조언을 받아들인다는 뜻을 나타내요.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: 레일라가 계획을 확인한다
    gloss: '레일라가 말해요: 탄탄한 계획 같네.'
    note: 대화를 짧고 힘을 북돋우며 마무리하는 말이에요.
