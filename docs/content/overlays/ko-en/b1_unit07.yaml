teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: 만약 ~라면
    note: '*if*는 일어날 수 있는 조건을 이끌어요.'
    example_gloss: 버스가 늦게 오면 내가 전화할게.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: ~하지 않는 한, ~가 아니라면
    note: '*unless*는 대략 *if not*이라는 뜻이에요. 조건이 충족되는 경우만 빼고 일이 일어난다는 뜻이에요.'
    example_gloss: 계획이 바뀌지 않는 한 우리는 열 시에 만나요.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: 조건
    note: '*condition*은 먼저 갖춰져야 하는 상황을 뜻해요.'
    example_gloss: 조건은 분명해요. 모두 오면 시작해요.
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: 결과
    note: '*result*는 어떤 조건 때문에 일어나는 일을 뜻해요.'
    example_gloss: 결과는 우리가 온라인으로 만난다는 거예요.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: 지연
    note: '*delay*는 계획보다 늦게 일어나는 것을 뜻해요.'
    example_gloss: 지연 때문에 모두가 늦을 수 있어요.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: 일정을 다시 잡다
    note: '*reschedule*은 약속이나 회의의 새로운 시간을 정하는 것을 뜻해요.'
    example_gloss: 의사 선생님이 바쁘면 진료 일정을 다시 잡을 거예요.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: 실제 조건과 결과
    gloss: 회의가 늦게 시작하면 제가 모두에게 메시지를 보낼게요.
    note: 앞으로 실제로 일어날 수 있는 조건에서는 *if* 뒤에 현재형을 써요. *If the meeting starts late*처럼 쓰고 *will start*라고 하지 않아요.
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: 부정 조건
    gloss: 보고서가 준비되지 않으면 검토 일정을 다시 잡을 거예요.
    note: '*if ... not*은 조건을 부정으로 만들어요.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: 미래의 실제 조건
    gloss: 늦게 시작하면 메시지를 보낼게요. 보고서가 준비되지 않으면 검토 일정을 다시 잡을 거예요.
    note: '*if* 뒤에는 현재형을 쓰고, 결과를 말하는 부분에는 흔히 *will*을 써요.'
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: 대체 계획, 플랜 B
    note: '*backup plan*은 첫 번째 계획이 안 될 때를 대비한 추가 계획을 뜻해요.'
    example_gloss: 방이 다 찼을 때를 대비한 대체 계획이 필요해요.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: 업데이트를 미루다
    note: '*move the update*는 업데이트 보고를 다른 때로 옮기는 것을 뜻해요.'
    example_gloss: 레일라가 늦으면 레일라의 업데이트는 내일로 미룰게요.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: '읽기: 대체 계획'
    gloss: 대니얼이 팀 회의의 대체 계획을 적어요. 회의실이 비어 있으면 팀은 열 시에 거기서 만나요. 회의실이 사용 중이면 온라인으로 만나요. 레일라가 열 시까지 들어오지 않으면 대니얼이 레일라의 업데이트를 내일로 미뤄요. 보고서가 준비되지 않으면 미아가 대신 더 짧은 업데이트를 보내요.
    note: 실제 조건, 결과, *unless*가 나오는 짧은 읽기 글이에요.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: 미아가 계획에 대해 묻는다
    gloss: '미아가 말해요: 대니얼, 회의가 늦게 시작하면 어떻게 할까요?'
    note: 일어날 수 있는 조건의 결과를 묻는 질문이에요.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: 대니얼이 결과를 말한다
    gloss: '대니얼이 말해요: 늦게 시작하면 제가 모두에게 메시지를 보낼게요.'
    note: '*If it starts late, I will...*는 실제로 일어날 수 있는 일과 구체적인 행동을 연결해요.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: 미아가 레일라에 대해 묻는다
    gloss: '미아가 말해요: 그럼 레일라가 참석하지 못하면요?'
    note: 같은 조건 구조를 쓴 짧은 되묻기예요.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: 대니얼이 'unless'를 쓴다
    gloss: '대니얼이 말해요: 레일라가 열 시까지 들어오지 않으면 그녀의 업데이트는 내일로 미룰게요.'
    note: '*unless she joins by ten*은 ''열 시까지 들어오지 않으면''이라는 뜻이에요.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: 미아가 방에 대해 묻는다
    gloss: '미아가 말해요: 합리적이네요. 그래도 회의실이 계속 사용 중이면 온라인으로 만날까요?'
    note: 미아가 회의실이 사용 중일 때의 대체 계획을 확인해요.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: 대니얼이 온라인 계획을 확인한다
    gloss: '대니얼이 말해요: 네, 회의실이 사용 중이면 대신 온라인으로 만나요.'
    note: '*instead*는 이 계획이 다른 계획을 대신한다는 뜻이에요.'
