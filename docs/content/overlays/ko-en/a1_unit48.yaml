teaching:
  en.a1.unit48.lesson01.teach.library:
    title: library
    gloss: 도서관
    note: '*library*는 도서관이라는 뜻이에요.'
    example_gloss: 저는 매주 도서관에 가요.
  en.a1.unit48.lesson01.teach.borrow:
    title: borrow
    gloss: 빌리다
    note: '*borrow*는 "빌리다"라는 뜻이에요. 돌려주기로 하고 다른 사람이나 기관에서 받아 쓴다는 의미예요.'
    example_gloss: 이 책을 빌리고 싶어요.
  en.a1.unit48.lesson01.teach.return:
    title: return
    gloss: 반납하다
    note: '*return*은 여기서 "반납하다", "돌려주다"라는 뜻이에요.'
    example_gloss: 이 책을 반납할 수 있을까요?
  en.a1.unit48.lesson01.teach.due:
    title: due
    gloss: 반납 기한이 된, 반납일
    note: '*due*는 "반납 기한이 된"이라는 뜻이에요. 한국어에서는 "반납일은 ~이에요"처럼 풀어서 말하지만, 영어는 *due* 한 단어로 표현해요.'
    example_gloss: 언제까지 반납해야 해요?
  en.a1.unit48.lesson01.teach.card:
    title: library card
    gloss: 도서관 카드
    note: '*library card*는 도서관 카드, 즉 도서관 회원증이라는 뜻이에요.'
    example_gloss: 이게 제 도서관 카드예요.
  en.a1.unit48.lesson02.teach.do_you_have_a_library_card:
    title: Do you have a library card?
    gloss: 도서관 카드 있으세요?
    note: '*Do you have a library card?*는 "도서관 카드 있으세요?"라는 뜻이에요.'
  en.a1.unit48.lesson02.teach.yes_heres_my_library_card:
    title: Yes, here's my library card.
    gloss: 네, 여기 제 도서관 카드예요.
    note: '*here''s*는 *here is*의 줄임말이에요.'
  en.a1.unit48.lesson02.teach.id_like_to_borrow_this_book:
    title: I'd like to borrow this book.
    gloss: 이 책을 빌리고 싶어요.
    note: '*I''d like to...*는 "...하고 싶어요"라는 공손한 표현이에요. 47과에서 배운 것과 같아요.'
  en.a1.unit48.lesson02.teach.when_is_this_book_due:
    title: When is this book due?
    gloss: 이 책은 언제까지 반납해야 해요?
    note: 여기서도 *due*가 나와요. 한국어로는 "반납 기한"처럼 풀어서 말해요.
  en.a1.unit48.lesson02.teach.can_i_return_this_book:
    title: Can I return this book?
    gloss: 이 책을 반납할 수 있을까요?
    note: '*Can I return this book?*는 "이 책을 반납할 수 있을까요?"라는 뜻이에요.'
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday:
    title: Your book is due on Friday.
    gloss: 책은 금요일까지 반납해야 해요.
    note: '*due on Friday*처럼 특정한 요일 앞에는 *on*을 써요.'
  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: 레일라의 제안
    gloss: 레일라가 말해요. 이 책을 도서관에 반납해야 해요. 같이 갈래요?
    note: '*Do you want to come with me?*는 "같이 갈래요?"라는 뜻이에요.'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: 대니얼의 대답
    gloss: 대니얼이 말해요. 좋아요! 저는 도서관에서 책을 빌려 본 적이 한 번도 없는 것 같아요.
    note: '*I don''t think I''ve ever ...*는 "...한 적이 한 번도 없는 것 같아요"라는 뜻이에요. 경험을 말할 때 쓰는 현재완료 *have ever*가 쓰였어요.'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: 레일라가 접수대에 가요
    gloss: 레일라가 말해요. 안녕하세요, 이 책을 반납하고 새 책도 빌리고 싶어요.
    note: '*and I''d like to ... too*는 "그리고 ...도 하고 싶어요"라는 뜻이에요.'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: 사서가 물어요
    gloss: 사서가 말해요. 좋아요, 감사합니다. 도서관 카드 가지고 계세요?
    note: '*Do you have your library card?*는 "도서관 카드 가지고 계세요?"라는 뜻이에요.'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 네, 여기 있어요.
    note: '*here it is*는 "여기 있어요"라는 뜻이에요.'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: 사서가 설명해요
    gloss: 사서가 말해요. 좋아요. 이 새 책은 3주 뒤까지 반납하셔야 해요.
    note: '*due back in three weeks*는 "3주 뒤까지 반납해야 한다"라는 뜻이에요.'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: 대니얼도 빌리고 싶어요
    gloss: 대니얼이 말해요. 저도 도서관 카드를 만들 수 있나요? 요리책을 빌리고 싶어요.
    note: '*Can I get ... too?*는 "저도 ...를 받을 수 있나요?"라는 뜻이에요.'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: 사서가 대니얼을 도와줘요
    gloss: 사서가 말해요. 물론이죠! 이 서류만 작성해 주세요.
    note: '*fill out this form*은 "이 서류를 작성하다"라는 뜻이에요. 영어에서는 *fill out*처럼 동사와 *out*이 함께 쓰여요.'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: 도서관 이용 방법에 관한 글
    gloss: '도서관 방문하기: 대부분의 도서관에서는 책을, 때로는 다른 물건도 몇 주 동안 빌릴 수 있어요. 무언가를 빌리려면 보통 도서관 카드가 필요해요. 책을 빌리면 사서가 반납 기한, 즉 책을 돌려줘야 하는 날짜를 알려 줘요. 그때까지 다 읽지 못했다면 사서에게 기간을 더 달라고 부탁할 수 있는 경우가 많아요. 레일라는 새 아파트로 이사한 뒤로 예전만큼 책이 많지 않아서, 대신 도서관에서 책을 빌리기 시작했어요. 지난주에 레일라는 책을 반납하고 새 책을 빌렸고, 친구 대니얼이 함께 갔어요. 대니얼은 도서관 책을 빌려 본 적이 없어서 자기 도서관 카드를 만들고, 미아가 가르쳐 주는 요리법을 연습하는 데 도움이 되도록 요리책을 빌렸어요. 사서는 두 사람에게 반납 기한 전에 책을 가져오라고 알려 주었어요. 미아는 도서관에 자주 가지는 않지만, 한번은 수업 때문에 사진 책을 빌린 적이 있어요.'
    note: '*checked out a cookbook*은 "요리책을 빌렸다"라는 뜻이에요. *check out*은 도서관에서 책을 빌릴 때 쓰는 고정 표현이에요.'
