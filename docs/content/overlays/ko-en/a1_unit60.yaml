    gloss: '레일라가 말해요: 음료를 하나 가져와 주세요.'
    note: '*Please bring...*는 정중한 부탁이에요.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: 대니얼이 시간을 물어요
    gloss: '대니얼이 말해요: 그럼요. 몇 시예요?'
    note: '*What time?*은 짧고 자연스러운 질문이에요.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: 레일라가 6시라고 말해요
    gloss: '레일라가 말해요: 6시에 봬요.'
    note: '*at six*처럼 시각 앞에는 *at*을 써요.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: 대니얼이 레일라에게 고마워해요
    gloss: '대니얼이 말해요: 좋아요. 초대해 주셔서 감사해요.'
    note: '*Thank you for...*에서는 *for*가 고마워하는 이유를 나타내요.'
