    note: '*Are you free...?*는 상대가 시간이 되는지 물어요.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: 대니얼은 시간이 있어요
    gloss: '대니얼이 말해요: 네, 시간 있어요.'
    note: '*I am free*는 시간이 된다는 뜻이에요.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: 레일라가 대니얼을 초대해요
    gloss: '레일라가 말해요: 저녁 먹으러 오시겠어요?'
    note: '*Would you like to come...?*는 정중하고 친절한 표현이에요.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: 대니얼이 수락해요
    gloss: '대니얼이 말해요: 네, 너무 좋아요.'
