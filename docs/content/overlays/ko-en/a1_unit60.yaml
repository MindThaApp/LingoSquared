    note: 초대장에는 요일, 시간, 대니얼이 가져올 것, 주소가 나와 있어요.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: '본문: 레일라의 집에서 저녁 식사'
    gloss: '레일라의 집에서 저녁 식사: 레일라는 대니얼을 토요일 저녁 식사에 초대했어요. 레일라는 대니얼에게 음료를 하나 가져오라고 부탁했어요. 대니얼은 갈 수 있다고 말했어요. 초대장에는 저녁 식사가 6시에 Park Street 18번지에서 있다고 적혀 있었어요. 대니얼은 주소를 휴대폰에 적어 두었어요. 그는 제시간에 도착하고 싶었어요. 레일라는 친구가 올 수 있어서 기뻤어요.'
    note: '*invited Daniel to dinner*는 레일라가 대니얼을 저녁 식사에 초대했다는 뜻이에요.'
