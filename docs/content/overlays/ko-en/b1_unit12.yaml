teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: 비록 ~이지만
    note: '*although*는 같은 문장 안에서 완전한 절로 대조를 이끌어요.'
    example_gloss: 사무실이 조용하긴 하지만 미아는 집에서 일하는 편이 더 좋아요.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: ~인데도
    note: '*even though*는 *although*보다 대조를 더 강조해요.'
    example_gloss: 레일라는 집이 좁은데도 집중을 잘해요.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: ~에도 불구하고
    note: '*despite* 뒤에는 명사나 -ing 형태가 오고, 완전한 절은 오지 않아요.'
    example_gloss: 방해 요소가 있어도 대니얼은 보고서를 제때 끝내요.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: 하지만, 그러나
    note: '*however*는 마침표나 세미콜론 뒤에서 새 문장을 시작해요.'
    example_gloss: 사무실은 조용해요. 하지만 미아는 집에서 일하는 편이 더 좋아요.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: 타당한 지적, 좋은 논점
    note: '*valid point*는 합리적이고 설득력 있는 의견을 뜻해요.'
    example_gloss: 집중에 관해서는 맞는 말이에요.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: 설득하다
    note: '*convince*는 누군가가 어떤 것을 믿거나 받아들이게 만드는 것을 뜻해요.'
    example_gloss: 레일라는 미아가 사무실로 돌아오도록 설득하려고 했어요.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + vollständiger Nebensatz
    gloss: 사무실이 조용하긴 하지만 미아는 집에서 일하는 편이 더 좋아요.
    note: '*although* + 주어 + 동사는 대조를 나타내는 완전한 절이 돼요.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + Nomen
    gloss: 방해 요소가 있어도 대니얼은 보고서를 제때 끝내요.
    note: '*despite* 뒤에는 명사가 오고, 완전한 절은 오지 않아요.'
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite und however
    gloss: 'Although와 even though는 완전한 절을 이끌어요: Although the office is quiet, Mia prefers home. Despite 뒤에는 절이 아니라 명사나 -ing 형태가 와요: Despite the distractions, Daniel finishes his report. However는 마침표나 세미콜론 뒤에서 새 문장을 시작해요: The office is quiet. However, Mia prefers home.'
    note: '형태: *although/even though* + 절, *despite* + 명사/-ing 형태, *however*는 마침표 뒤에서 문장 부사로 써요.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: 유연성
    note: '*flexibility*는 계획이나 일하는 방식을 쉽게 바꿀 수 있는 능력을 뜻해요.'
    example_gloss: 미아와 레일라는 둘 다 유연성이 중요하다는 데 동의해요.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: 팀워크
    note: '*teamwork*는 팀으로 함께 일하는 것을 뜻해요.'
    example_gloss: 레일라는 사무실에서 더 나은 팀워크가 만들어진다고 생각해요.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lesetext: wo man arbeitet'
    gloss: 미아와 레일라는 어디서 일할지에 대해 의견이 달라요. 미아는 편해서 집에서 일해요. 동료들을 보고 싶긴 하지만, 집에서 일이 더 잘돼요. 레일라는 사무실이 더 좋아요. 소음이 있어도 쉬는 시간에 동료들과 이야기하는 걸 좋아해요. 미아가 집중에 관해 타당한 지적을 하긴 해도, 레일라는 사무실이 더 나은 팀워크를 만든다고 여전히 생각해요. 그래도 둘 다 유연성이 중요하다는 데는 동의해요.
    note: 대조를 나타내는 표현이 나오는 짧은 읽기 글이에요.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia führt den Gegensatz ein
    gloss: '미아가 말해요: 레일라, 사무실이 좋긴 하지만 저는 집에서 일이 더 잘돼요.'
    note: '*although* + 완전한 절을 문장 맨 앞에 썼어요.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila nennt ihre Sicht
    gloss: '레일라가 말해요: 이해해요, 하지만 소음이 있어도 저는 쉬는 시간에 사람들과 이야기하는 게 정말 좋아요.'
    note: '*despite* + 명사(*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung
    gloss: '미아가 말해요: 맞는 말이에요. 하지만 그래도 저는 혼자 있을 때 더 집중이 잘된다고 생각해요.'
    note: 여기서 *however*는 마침표 뒤에서 새 문장을 시작해요.
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila zieht Mia auf
    gloss: '레일라가 말해요: 저는 사무실이 더 좋지만, 마음을 바꾸라고 설득할 수는 없겠죠?'
    note: '*even though*는 대조를 강조해요.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia findet einen Kompromiss
    gloss: '미아가 말해요: 아마도요! 하지만 유연성이 가장 중요하다는 데는 우리 둘 다 동의할 수 있어요.'
    note: '*however*는 서로 반대되는 두 생각을 새 문장으로 이어 줘요.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila beendet das Gespräch positiv
    gloss: '레일라가 말해요: 우리 선호가 달라도 모든 걸 제때 끝내잖아요.'
    note: '*despite* + 명사(*our different preferences*).'
