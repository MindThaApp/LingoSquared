teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: ~할 수 있다
    note: '*be able to*는 어떤 일을 할 능력이나 기회가 있다는 뜻이에요.'
    example_gloss: 저는 운전면허증을 온라인으로 갱신할 수 있어요.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: (어렵게나마) 해내다
    note: '*manage to*는 어떤 일이 잘 이루어졌다는 뜻이에요. 약간 애를 쓴 끝에 해냈을 때 자주 써요.'
    example_gloss: 저는 10분 만에 양식을 작성해 냈어요.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: 갱신하다, 연장하다
    note: '*renew*는 만료되기 전에 서류의 유효 기간을 연장한다는 뜻이에요.'
    example_gloss: 저는 운전면허증을 갱신해야 해요.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: 면허증
    note: 여기서 *license*는 운전할 수 있게 해 주는 공식 서류(*driver's license*의 줄임말)를 뜻해요. 영국 영어에서는 명사를 *licence*라고 써요.
    example_gloss: 제 운전면허증은 이번 달에 만료돼요.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: 온라인으로, 인터넷으로
    note: '*online*은 어떤 장소에 직접 가지 않고 인터넷으로 한다는 뜻이에요.'
    example_gloss: 이제 온라인으로 갱신할 수 있어요.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: 직접, 현장에서
    note: '*in person*은 온라인이 아니라 직접 그곳에 간다는 뜻이에요.'
    example_gloss: 작년에는 직접 가야 했어요.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: 현재의 가능성 나타내기
    gloss: 저는 이제 운전면허증을 온라인으로 갱신할 수 있어요.
    note: '*I am able to*는 현재에 가능하다는 뜻을 나타내요.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: 과거의 가능성 부정하기
    gloss: 작년에는 온라인으로 할 수 없었어요.
    note: '*was not able to*는 과거에 할 수 없는 상황이었다는 뜻을 나타내요.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: 성공했다고 말하기
    gloss: 저는 10분 만에 양식을 작성해 냈어요.
    note: '*managed to*는 대개 애를 쓴 끝에 어떤 일을 해냈다는 점을 강조해요.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: '''be able to''의 현재와 과거'
    gloss: 저는 그것을 갱신할 수 있어요. 저는 그것을 갱신할 수 있었어요. 제가 도와드릴 수 있을 거예요.
    note: '*am able to*(현재), *was able to*(과거), *would be able to*(가정이나 제안)는 같은 구조의 형태들이에요.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: 친구
    note: '*friend*는 가깝게 지내는 사람을 뜻해요.'
    example_gloss: 제 친구는 지난주에 면허증을 갱신했어요.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: 시스템, 체계
    note: '*system*은 어떤 일을 하기 위해 짜 놓은 방식이나 체계를 뜻해요.'
    example_gloss: 새 시스템이 훨씬 빨라요.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: '읽기: 새 시스템'
    gloss: 작년에는 사람들이 운전면허증을 온라인으로 갱신할 수 없었어요. 모두가 직접 사무실에 가야 했어요. 올해는 시스템이 바뀌었어요. 이제 사람들은 집에서 모든 것을 갱신할 수 있어요. 제 친구 미아는 10분 만에 끝낼 수 있었어요.
    note: 새 시스템 덕분에 갱신이 더 쉬워졌다는 내용의 짧은 읽기 글이에요.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: 레일라가 운전면허증에 대해 묻는다
    gloss: '레일라: 운전면허증 온라인으로 갱신할 수 있었어?'
    note: '*were you able to*는 과거에 가능했는지를 물어요.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: '대니얼의 대답: 온라인으로는 안 됐다'
    gloss: '대니얼: 아니, 못 했어. 직접 사무실에 가야 했어.'
    note: '*wasn''t able to*는 *was not able to*를 말할 때 줄여서 쓰는 형태예요.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: 레일라가 자신의 경험을 이야기한다
    gloss: '레일라: 정말? 나는 온라인으로 10분 만에 해냈는데.'
    note: '*managed to*는 레일라가 빠르고 문제없이 해냈다는 점을 강조해요.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: 대니얼이 다음번을 생각한다
    gloss: '대니얼: 다음에는 나도 온라인으로 하면 시간을 아낄 수 있을 텐데.'
    note: 여기서 *would be able to*는 미래에 대한 가정적인 가능성을 나타내요.
  en.b1.unit02.lesson04.teach.q_would_help:
    title: 레일라가 도움을 제안한다
    gloss: '레일라: 원하면 다음에 내가 도와줄 수 있어.'
    note: 여기서 *would be able to*는 공손한 제안을 나타내요.
  en.b1.unit02.lesson04.teach.a_thanks:
    title: 대니얼이 감사를 표한다
    gloss: '대니얼: 고마워, 그러면 좋겠어.'
    note: '*I''d like that*은 제안을 고맙게 받아들일 때 쓰는 자연스러운 표현이에요.'
