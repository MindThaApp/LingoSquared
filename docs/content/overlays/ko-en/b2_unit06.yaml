teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: 가치
    note: 여기서 *value*는 사람들이 중요하게 여기는 원칙을 뜻해요. 금전적 가치만을 가리키는 것이 아니에요.
    example_gloss: 공정함은 하나의 가치예요.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: 공정함, 합리적인 대우
    note: '*fairness*는 사람들을 합리적으로 대우하는 것과 관련돼요. 그냥 *nice*라고 하는 것보다 더 강하고 더 추상적이에요.'
    example_gloss: 공정함이란 사람들을 합리적으로 대한다는 뜻이에요.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: 편의, 실용적인 편리함
    note: '*convenience*는 편의, 편리함이에요. 이 B2 맥락에서는 ''쉬움''을 *easiness*로 직역하지 마세요.'
    example_gloss: 편의는 일상생활을 더 쉽게 만들어요.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: 유연성
    note: '*flexibility*는 상황이 바뀔 때 거기에 맞춰 움직일 수 있는 능력이에요.'
    example_gloss: 유연성이 있으면 상황이 바뀔 때 변화를 받아들일 수 있어요.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: 단서를 달다, 제한을 두다
    note: 여기서 *qualify*는 자기 의견에 제한을 두거나 단서를 단다는 뜻이에요. 자격증이나 학위를 딴다는 뜻이 아니에요.
    example_gloss: 의견에 제한을 두어서 단서를 달 수 있어요.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: 우선시하다, 우선순위를 두다
    note: '*prioritize fairness*는 공정함을 다른 가치보다 더 중요하게 여긴다는 뜻이에요.'
    example_gloss: 공정함을 우선시한다는 것은 그것을 다른 무엇보다 더 중요하게 본다는 뜻이에요.
  en.b2.unit06.lesson02.teach.in_principle:
    title: 가치를 저울질하기
    gloss: 원칙적으로는 편의도 중요하지만, 공정함이 더 무게를 가져야 해요.
    note: '*In principle*은 원칙적으로라는 뜻이에요. *eventually*와 혼동하지 마세요. *eventually*는 결국이라는 뜻이에요.'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: 자기 입장에 제한 두기
    gloss: 저는 어디서나 고요함을 주장하는 것은 아니에요.
    note: '*I am not arguing for...*는 자기 주장의 범위를 한정해요. 막연하게 *a little*을 쓰는 것보다 나아요.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: 상대편 의견에 바로 응답하기
    gloss: 맞는 말씀이에요, 그리고 기업에 유연성이 필요하다는 데는 저도 동의해요.
    note: '*That is fair*는 자기 가치를 포기하지 않으면서 상대방의 지적을 인정하는 표현이에요.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: 추상적인 의견 쌓아 올리기
    gloss: 설득력 있는 추상적 의견은 하나의 가치를 밝히고, 주장에 단서를 달고, 상대방의 견해에 곧바로 응답해요.
    note: '*in principle*, *fairness*, *carry more weight* 같은 정확한 B2 표현을 쓰세요. 뉘앙스를 주려고 매번 *a bit*만 쓰지 마세요.'
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: 투명한, 이해하기 쉬운
    note: '*transparent rules*는 이해하기 쉽고 확인하기도 쉬운 규칙이에요.'
    example_gloss: 투명한 규칙은 이해하기 쉬워요.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: 상업적인, 영리와 관련된
    note: '*commercial activity*는 기업과 이윤에 관련된 활동이에요.'
    example_gloss: 상업 활동은 기업과 관련이 있어요.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: '읽기 지문: 조용한 공공장소'
    gloss: 아마라는 조용한 공공장소를 보호해야 한다고 주장해요. 그것이 일부 상업 활동을 제한하더라도 마찬가지예요. 하지만 그녀의 견해가 절대적인 것은 아니에요. 어디서나 고요함을 주장하는 것은 아니며, 기업에 어느 정도 유연성이 필요하다는 점도 받아들여요. 이에 맞선 레오의 견해는 규칙이 기업의 생존을 더 어렵게 만들 수 있다는 거예요. 아마라는 그 점에 곧바로 답해요. 편의도 중요하지만 어떤 공간이 모두의 것일 때는 공정함이 더 무게를 가져야 한다고요. 그녀는 제한이 없는 규제가 아니라 제한적이고 투명한 규칙을 지지하기 때문에, 그녀의 입장에는 단서가 붙어 있어요.
    note: 이것이 추상적인 영어예요. 가치를 분명히 말하고, 주장의 범위를 정확하게 한정하세요.
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: 아마라가 자기 입장을 말해요
    gloss: 아마라가 말해요. 저는 도시가 조용한 공공장소를 보호해야 한다고 생각해요. 그것이 일부 상업 활동을 제한하더라도요.
    note: '*even if*는 불리한 점을 인정한다는 것을 분명히 보여 줘요.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: 레오가 다른 가치를 말해요
    gloss: 레오가 말해요. 저도 고요함을 소중히 여기지만, 기업이 살아남으려면 유연성이 필요해요.
    note: 레오는 아마라가 강조하는 공공장소에 맞서 유연성을 내세워요.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: 아마라가 단서를 달아요
    gloss: 아마라가 말해요. 맞는 말씀이에요, 그리고 저는 어디서나 고요함을 주장하는 것은 아니에요. 제 요지는 공유 공간이 오로지 이윤만으로 만들어져서는 안 된다는 거예요.
    note: '*not arguing for silence everywhere*는 그녀의 입장이 절대적으로 들리지 않게 막아 줘요.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: 레오가 그 가치를 짚어요
    gloss: 레오가 말해요. 그러니까 아마라 씨가 우선시하는 가치는 단순한 편안함이 아니라 공정함이라는 거죠?
    note: 여기서 *prioritizing*은 저울질할 때 더 중요하게 만든다는 뜻이에요.
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: 아마라가 가치를 저울질해요
    gloss: 아마라가 말해요. 맞아요. 원칙적으로는 편의도 중요하지만, 어떤 공간이 모두의 것일 때는 공정함이 더 무게를 가져야 해요.
    note: '*carry more weight*는 더 무게가 나간다는 뜻의 자연스러운 영어 표현이에요.'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: 레오가 조건부로 받아들여요
    gloss: 레오가 말해요. 규칙이 제한적이고 투명하다면 저도 받아들일 수 있어요.
    note: 받아들이는 것은 규칙이 얼마나 한정적이고 분명한지에 달려 있어요.
