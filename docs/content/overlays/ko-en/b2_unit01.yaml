course:
  title: 영어 B2
  description: 미묘한 뉘앙스의 대화, 논증, 추측, 전문적인 토론을 위한 B2 수준 영어를 편한 한국어 설명과 함께 배워요.
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: 주장, 근거, 반박
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: '읽기: 하이브리드 근무제 옹호하기'
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: 주장
    note: '*claim*은 자신이 옹호하는 주장이에요. 여기서는 불만이나 보험금 청구 같은 뜻이 아니에요.'
    example_gloss: 그녀의 주장은 그 계획을 계속 진행해야 한다는 거예요.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: 근거, 증거
    note: '*evidence*는 자기 주장을 뒷받침하는 사실, 수치, 사례예요.'
    example_gloss: 이 사례는 미아에게 자기 주장의 근거가 돼요.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: 반론
    note: '*counterargument*는 내 주장에 맞서는 논점이에요. 영어에서는 한 단어로 붙여 써요.'
    example_gloss: 다니엘이 반론을 제기해요.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: 반박하다
    note: '*rebut*은 자기 주장을 포기하지 않으면서 반론에 답한다는 뜻이에요.'
    example_gloss: 미아는 근거를 들어 그 우려에 반박해요.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: 인정하다, 양보하다
    note: '*concede*는 상대방 의견의 일부가 합리적임을 인정한다는 뜻이에요. 자기 주장 전체를 포기한다는 뜻은 아니에요.'
    example_gloss: 핵심 주장을 포기하지 않고도 우려를 인정할 수 있어요.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: ~보다 비중이 더 크다
    note: '*outweigh*는 어떤 장점, 위험, 이유가 다른 것보다 더 중요할 때 써요.'
    example_gloss: 강력한 근거는 우려보다 비중이 더 클 수 있어요.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: 위험을 인정하면서 주장을 유지하기
    gloss: 그 계획에 위험이 있다는 데는 동의하지만, 근거를 보면 여전히 계속 추진하는 쪽이 맞아요.
    note: '*I agree..., but...*은 먼저 상대의 지적을 인정해요. 그다음 *but the evidence still supports...*로 내 주장이 유지된다는 점을 보여 줘요.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: 가장 강력한 이유 말하기
    gloss: 가장 강력한 이유는 설문 조사 결과가 일관적이었다는 거예요.
    note: '*The strongest reason is that...*은 가장 중요한 근거를 소개해요. *that* 뒤에서는 영어 어순, 즉 주어 다음에 동사가 오는 순서를 지키세요.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: 타당한 우려 인정하기
    gloss: 그건 타당한 우려예요. 하지만 데이터는 반대 방향을 가리켜요.
    note: '*That is a fair concern; however,...*는 전문적으로 들려요. 우려를 인정하되 데이터로 반박하는 표현이에요.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: 주장 옹호하기
    gloss: 주장을 말하고, 근거를 대고, 가장 강한 반대 의견을 인정한 다음 반박하세요. That is a fair concern이나 However 같은 표현을 쓰면 주장을 포기하지 않으면서도 합리적으로 들려요.
    note: '한국어에서는 동사가 절의 맨 끝에 오지만, 영어에서는 종속절에서도 동사가 주어 바로 뒤에 와요: *the data points in the other direction*이지 *the data in the other direction points*가 아니에요.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: 직원 유지(이직 방지)
    note: '*retention*은 여기서 직원들이 떠나지 않고 계속 남는다는 뜻이에요.'
    example_gloss: 직원 유지율이 높아지면 팀을 떠나는 직원이 줄어든다는 뜻이에요.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: 협업, 협력
    note: '*collaboration*은 하나의 과제나 프로젝트를 함께 해 나가는 협력이에요. 한국어 ''협업''과 거의 같은 뜻이에요.'
    example_gloss: 좋은 협업은 팀이 일을 끝내는 데 도움이 돼요.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: '읽기 지문: 하이브리드 근무제 옹호하기'
    gloss: 미아는 회사가 다음 분기에도 하이브리드 근무제를 유지해야 한다고 주장해요. 그녀의 핵심 주장은 하이브리드 근무가 성과를 떨어뜨리지 않으면서 직원 유지율을 높인다는 거예요. 가장 강력한 근거는 직원 설문 조사예요. 하이브리드 팀 직원들은 다른 직장을 찾고 있다고 말하는 경우가 더 적었어요. 가장 강력한 반론은 사람들이 매일 사무실에 나오지 않으면 협업이 약해질 수 있다는 거예요. 미아는 그 우려를 인정하지만 프로젝트 데이터로 반박해요. 하이브리드 팀은 기한을 지켰고 평가 점수도 약간 더 높았어요. 그래서 그녀는 장점이 위험보다 더 크다고 결론지어요.
    note: 이 글은 주장, 근거, 반론, 반박, 결론으로 이루어진 완전한 논증을 보여 줘요.
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: 미아가 자기 주장을 말해요
    gloss: '미아: 다음 분기에도 하이브리드 근무제를 유지해야 한다고 생각해요.'
    note: 미아는 분명하게 옹호할 수 있는 주장으로 시작해요.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: 다니엘이 이유를 물어요
    gloss: '다니엘: 가장 강력한 이유가 뭐예요?'
    note: 다니엘은 일반적인 의견이 아니라 가장 중요한 근거를 물어요.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: 미아가 근거를 제시해요
    gloss: '미아: 가장 강력한 이유는 직원 유지율이에요. 직원 설문 조사에서 하이브리드로 일한 사람들은 다른 직장을 찾고 있다고 말하는 경우가 더 적었어요.'
    note: 미아는 느낌만이 아니라 설문 조사 결과를 근거로 써요.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: 다니엘이 반론을 제기해요
    gloss: '다니엘: 일부 매니저들은 사람들이 매일 사무실에 나오지 않으면 협업이 약해진다고 말해요.'
    note: 이것이 미아가 곧 답해야 할 반론이에요.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: 미아가 데이터로 반박해요
    gloss: '미아: 타당한 우려예요. 하지만 프로젝트 데이터는 그 말을 뒷받침하지 않아요. 하이브리드 팀은 기한 내에 일을 끝냈고 평가 점수도 약간 더 높았어요.'
    note: 부정문에서는 영어가 조동사 *do*를 필요로 하기 때문에 *does not support it*처럼 *does*를 써요.
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: 다니엘이 입장을 정리해요
    gloss: '다니엘: 그러니까 미아 씨 입장은 장점이 위험보다 더 크다는 거군요?'
    note: '*outweigh*는 장점과 위험을 저울질한 결과를 나타내요.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: 미아가 해결책으로 마무리해요
    gloss: '미아: 맞아요. 근무제를 없앨 게 아니라 회의 방식을 개선해야 해요.'
    note: 미아는 계획을 옹호하면서도 현실적인 개선안을 함께 내놓아요.
