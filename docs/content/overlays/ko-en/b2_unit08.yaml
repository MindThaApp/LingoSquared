    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: 일치, 모순, 근거
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: '읽기: 설문 조사와 운영사 보고서'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: 출처, 자료
    note: '*source*는 정보를 제공하는 출처예요. 어디에나 *according to*만 쓰지 마세요. 출처들 사이의 일치나 모순을 말해야 할 때도 있어요.'
    example_gloss: 출처는 정보를 제공해요.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: 종합하다
    note: '*synthesize*는 여러 출처의 정보를 하나로 합쳐 일관된 답을 만든다는 뜻이에요.'
    example_gloss: 종합한다는 것은 출처들의 정보를 하나로 합치는 거예요.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: 평가하다
    note: '*evaluate*는 무엇이 얼마나 탄탄한지 판단한다는 뜻이에요.'
    example_gloss: 평가한다는 것은 무엇이 얼마나 탄탄한지 판단하는 거예요.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: 일치
    note: '*agreement*는 어떤 점에 대해 출처들이 같은 말을 한다는 뜻이에요.'
    example_gloss: 일치란 출처들이 같은 말을 한다는 뜻이에요.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: 모순, 충돌
    note: '*conflict*는 어떤 점에 대해 출처들이 서로 반대되거나 다른 말을 한다는 뜻이에요.'
    example_gloss: 충돌이란 출처들의 의견이 다르다는 뜻이에요.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: 판단, 신중하게 따져 본 평가
    note: '*judgment*는 어느 출처가 더 탄탄한지에 대한 근거 있는 판단이에요. 미국 영어에서는 *judgment*로 쓰고, 영국 영어에서는 *judgement*도 볼 수 있어요.'
    example_gloss: 판단은 어느 출처가 더 탄탄한지 설명해 줘요.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: 일치와 충돌을 함께 말하기
    gloss: 두 출처 모두 수요가 늘었다는 데는 동의하지만, 원인에 대해서는 의견이 달라요.
    note: '*Both sources agree... but they disagree...*가 매번 *according to*를 쓴 따로 떨어진 두 문장보다 나아요.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: 그에 반해, 이와 대조적으로
    note: '*By contrast*는 두 출처나 두 요점을 실제로 대조할 때 쓰세요. ''반면에'' 같은 말을 대신하는 만능 연결어로 쓰지 마세요.'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: 원인에 관해서는 더 탄탄한 근거가 있는
    note: '*better supported on the cause*는 원인에 대한 증거가 더 강하다는 뜻이에요.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: 종합 구성하기
    gloss: 종합은 출처들이 어디서 일치하는지, 어디서 충돌하는지, 어느 쪽 설명이 더 탄탄한 근거를 갖췄는지를 밝혀야 해요.
    note: 출처들 사이의 관계를 정확히 나타내려면 *agree*, *conflict*, *better supported*를 쓰세요.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: 설문 조사
    note: '*survey*는 여러 사람에게서 답변이나 의견을 모아요.'
    example_gloss: 설문 조사는 많은 의견을 모을 수 있어요.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: 설명, 보고 내용
    note: '*account*는 일어난 일에 대한 설명이나 이야기예요.'
    example_gloss: 설명은 무슨 일이 있었는지 알려 줘요.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: '자료 A: 승객 설문 조사에 따르면 새 병원이 문을 연 뒤로 버스 지연이 더 잦아졌어요. 많은 승객이 지금은 특히 아침에 노선이 붐빈다고 말해요. 설문 조사는 주된 원인이 수요 증가라고 주장해요.'
    note: 자료 A에는 승객들의 의견이 많지만, 그렇다고 원인에 대한 가장 강력한 증거인 것은 아니에요.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: '자료 B: 운영사 보고서도 병원이 문을 연 뒤 수요가 늘었다는 데는 동의하지만, 운행 지연의 주된 원인으로는 운전기사 부족을 꼽아요. 이 보고서에는 같은 기간의 인력 기록이 들어 있어요.'
    note: '*staffing records*는 승객들의 경험담보다 원인에 대해 더 강력한 증거가 돼요.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: 테사가 자료 A를 말해요
    gloss: 테사가 말해요. 버스 지연에 관한 설명 두 가지를 읽었어요. 승객 설문 조사에 따르면 새 병원이 문을 연 뒤에 수요가 늘었대요.
    note: 자료 하나를 소개하면서 수요 증가라는 요점을 짚어요.
  en.b2.unit08.lesson04.teach.a_operator:
    title: 로언이 자료 B를 말해요
    gloss: 로언이 말해요. 운영사 보고서도 수요가 늘었다는 데는 동의하지만, 주된 문제는 운전기사 부족이었다고 해요.
    note: 자료 B는 한 가지 점은 확인해 주지만 원인에 대해서는 다르게 말해요.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: 테사가 종합해요
    gloss: 테사가 말해요. 그러니까 두 자료는 수요가 늘었다는 데는 일치하지만, 원인에 대해서는 충돌하네요.
    note: '*agree on*과 *conflict about*는 자료들 사이의 관계를 요약해 줘요.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: 로언이 증거를 물어봐요
    gloss: 로언이 물어요. 어느 설명이 더 근거가 탄탄해요?
    note: 그는 단순한 요약이 아니라 판단을 요구해요.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: 테사가 증거를 비교해요
    gloss: 테사가 말해요. 설문 조사에는 승객 의견이 많지만, 운영사 보고서에는 인력 기록이 들어 있어요.
    note: 이것은 증거에 관한 문제예요. 의견과 기록을 비교해요.
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: 로언이 판단을 물어봐요
    gloss: 로언이 물어요. 그럼 테사 씨의 판단은요?
    note: '*judgment*는 근거를 갖춘 결론을 요구해요.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: 테사가 판단을 말해요
    gloss: 테사가 말해요. 원인에 관해서는 운영사 보고서가 더 근거가 탄탄해요. 다만 설문 조사도 승객들의 경험을 보여 주는 데는 유용해요.
    note: '*although*는 두 자료를 모두 고려하면서도 판단을 내릴 수 있게 해 줘요.'
