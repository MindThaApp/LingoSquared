      status: correct
    feedback: 두 출처 모두 병원이 문을 연 뒤 수요가 늘었다고 말해요.
  en.b2.unit08.lesson03.exercise02_choose_conflict:
    instruction: 두 출처 사이에서 충돌하는 점은 무엇일까요?
