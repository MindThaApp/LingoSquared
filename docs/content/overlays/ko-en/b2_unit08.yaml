  en.b2.unit08.lesson03.exercise01_choose_agreement:
    instruction: 두 출처는 무엇에 대해 의견이 일치할까요?
    correct_option: demand increased after the hospital opened
    distractors:
    - driver shortages caused every delay
    - the survey includes staffing records
    - the route became quieter
    accepted_answers:
