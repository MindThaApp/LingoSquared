    - value: They conflict about whether higher demand or driver shortages caused the late service
      status: correct
    - value: They disagree about whether higher demand or driver shortages caused the late service.
      status: correct
    - value: They conflict about whether higher demand or driver shortages caused the late bus service.
      status: correct
    feedback: '*whether... or...*는 충돌하는 점을 정확하게 짚어 줘요.'
  en.b2.unit08.lesson04.exercise01_choose_agreement:
    instruction: 대화를 들으세요. 두 설명이 일치하는 점은 무엇일까요?
    correct_option: demand increased
    distractors:
