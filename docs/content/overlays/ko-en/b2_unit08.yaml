    - the timetable disappeared
    - all drivers resigned
    accepted_answers:
    - value: demand increased
      status: correct
    feedback: 두 설명 모두 수요가 늘었다고 말해요.
  en.b2.unit08.lesson04.exercise02_listen_judgement:
