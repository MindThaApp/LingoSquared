teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: 증명서
    note: '*certificate*는 관공서가 발급해 주는 공식 문서예요. *registration certificate*는 전입·거주지 등록 증명서예요.'
    example_gloss: 거주지 등록 증명서가 예약일로부터 2주 뒤에 도착했어요.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: 오류, 실수
    note: '*mistake*는 잘못 쓰였거나 잘못된 것을 뜻해요.'
    example_gloss: 이 서류에 적힌 제 주소에 오류가 있어요.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: 철자가 ~로 쓰인
    note: '*spelled*는 단어가 어떤 글자로 어떤 순서로 쓰였는지를 말해요.'
    example_gloss: 제 이름은 L이 두 개가 아니라 한 개로 쓰여요.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: 정정하다, 바로잡다
    note: '*correct*는 여기서 동사예요. 틀린 것을 바르게 고친다는 뜻이에요.'
    example_gloss: 담당자가 오늘 제 성을 정정해 줄 수 있어요.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: 사본, 복사본
    note: '*copy*는 문서와 똑같이 만든 두 번째 본이에요.'
    example_gloss: 관공서는 모든 문서의 사본을 보관해요.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: 여권
    note: '*passport*는 내 사진이 붙은 여행용 신분 문서예요.'
    example_gloss: 관공서 예약이 있을 때는 항상 여권을 가져가요.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is와 there are
    gloss: 제 증명서에 오류가 하나 있어요. 제 증명서에 오류가 두 개 있어요.
    note: '*there is*는 하나일 때, *there are*는 둘 이상일 때 써요. 한국어는 수와 상관없이 ''있어요''라고 하지만, 영어는 수에 따라 동사가 달라져요.'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: 오류가 있다고 말하기
    gloss: 제 거주지 등록 증명서에 오류가 있어요.
    note: '*There is a mistake on...*은 오류를 사무적이고 격식 있게 알리는 표현이에요.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: 정확히 무엇이 잘못됐는지 말하기
    gloss: 제 성의 철자가 잘못되어 있어요.
    note: '*last name*은 ''성'', *first name*은 ''이름''이에요.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: 정정할 수 있는지 묻기
    gloss: 이거 정정해 주실 수 있을까요?
    note: '*Could you...?*는 *Can you...?*보다 공손해서 관공서 창구에 어울려요.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: 얼마나 걸리는지 묻기
    gloss: 정정하는 데 얼마나 걸리나요?
    note: '*How long...?*은 길이가 아니라 시간이 얼마나 걸리는지 물어요.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: 정중한 부탁 두 가지
    gloss: 이거 정정해 주실 수 있을까요? 새 증명서를 받을 수 있을까요?
    note: '*Could you...?*는 무언가를 해 달라고 부탁하는 표현이고, *Would it be possible to...?*는 가능한지 더 조심스럽게 묻는 표현이에요.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: 영업일 / 평일
    note: '*working days*는 주말을 뺀 월요일부터 금요일까지의 날이에요.'
    example_gloss: 관공서는 모든 편지에 영업일 기준 5일 안에 답해요.
  en.a2.unit36.lesson03.teach.notice_text:
    title: 정정 요청 서신
    gloss: 정정 요청이 접수되었습니다. 거주지 등록 증명서는 영업일 기준 5일 이내에 정정됩니다. 여권과 이 안내문을 가지고 사무소에 방문해 주세요. 참조 번호 3092.
    note: 관공서 안내문은 짧고 사무적이에요. 무슨 일이 있었는지, 무엇이 이루어질지, 내가 무엇을 해야 하는지가 담겨 있어요.
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: 무엇을 가져와야 하는지
    gloss: 여권과 이 안내문을 가지고 사무소에 방문해 주세요.
    note: '*bring ... to ...*는 무언가를 어떤 장소에 가지고 간다는 뜻이에요.'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: 레일라가 오류를 알린다
    gloss: '레일라가 말해요: 안녕하세요, 제 거주지 등록 증명서에 오류가 있어요.'
    note: '*Hello*는 *Hi*보다 격식 있어서 관공서 창구에 더 잘 어울려요.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: 담당 직원이 되묻는다
    gloss: '담당자가 말해요: 알겠습니다. 뭐가 잘못되었나요?'
    note: 여기서 *I see*는 '알겠어요, 듣고 있어요'라는 뜻이에요.
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: 레일라가 실수를 설명하고 정정을 요청한다
    gloss: '레일라가 말해요: 제 성의 철자가 잘못되어 있어요. 정정해 주실 수 있을까요?'
    note: 2과의 두 문장과 같고, 이번에는 이어서 말해요.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: 담당 직원이 여권을 요청한다
    gloss: '담당자가 말해요: 그럼요. 여권 가지고 오셨나요?'
    note: '*Do you have ... with you?*는 ''지금 가지고 있나요?''라는 뜻이에요.'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: 레일라가 여권을 건넨다
    gloss: '레일라가 말해요: 네, 여기 있어요.'
    note: '*Here it is*는 무언가를 건네면서 하는 말이에요.'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: 담당 직원이 자신이 하는 일을 설명한다
    gloss: '담당자가 말해요: 감사합니다. 사본을 만들고 오늘 정정 처리를 보내 드릴게요.'
    note: '*make a copy*는 ''복사본을 만들다''라는 정해진 표현이에요.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: 레일라가 얼마나 걸리는지 묻는다
    gloss: '레일라가 물어요: 정정하는 데 얼마나 걸리나요?'
    note: 2과의 질문과 같아요.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: 담당 직원의 대답
    gloss: '담당자가 말해요: 영업일 기준 5일 이내예요.'
    note: '*within*은 기한 안에라는 뜻이라서 길어도 영업일 5일이 걸린다는 말이에요.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: 레일라가 담당 직원에게 고마워한다
    gloss: '레일라가 말해요: 정말 감사합니다.'
    note: '*very much*는 감사를 더 강조해 줘요.'
