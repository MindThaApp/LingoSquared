teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: 만약 ~하면
    note: '*if*는 조건을 나타내요. 한국어 ''-(으)면''은 ''~할 때''라는 뜻으로도 쓰이지만, *if*는 조건에만 써요. 시간을 나타내는 ''~할 때''는 *when*이에요.'
    example_gloss: 비가 오면 우리는 집에 있을 거예요.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: 비 / 비가 오다
    note: '*rain*은 하늘에서 떨어지는 물, 즉 ''비''나 ''비가 오다''를 뜻해요.'
    example_gloss: 이번 주말에 비가 올지도 몰라요.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: 집에 있다
    note: '*stay home*은 밖에 나가지 않고 집에 머문다는 뜻이에요.'
    example_gloss: 비가 오면 우리는 집에 있을 거예요.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: 주말
    note: '*weekend*는 토요일과 일요일을 뜻해요.'
    example_gloss: 주말에 뭐 할 계획이에요?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: 여가 시간
    note: '*free time*은 일하지 않고 바쁘지도 않은 시간을 뜻해요.'
    example_gloss: 저는 요즘 여가 시간이 많지 않아요.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: 그림을 그리다
    note: '*paint*는 물감으로 그림을 그린다는 뜻이에요.'
    example_gloss: 레일라는 주말에 그림 그리는 것을 아주 좋아해요.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: 내일 비가 오면 우리는 집에 있을 거예요.
    note: '*if* + 현재형, *will* + 동사원형은 미래에 실제로 일어날 수 있는 조건을 나타내요.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: 이번 주말에 여가 시간이 있으면 그림을 그릴 거예요.
    note: '같은 구조예요: *if* + 현재형, *will* + 동사원형.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: 비가 오면 우리는 집에 있을 거예요. 시간이 있으면 그림을 그릴 거예요.
    note: 영어는 미래의 일이라도 *if* 뒤에는 현재형을 써요. *will rain*이라고 하지 않아요.
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: ~할 텐데 / ~할 거예요 (가정)
    note: '*would* + 동사원형은 현재의 비현실적이거나 가정적인 상황을 나타내요.'
    example_gloss: 시간이 더 있다면 매일 그림을 그릴 텐데.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: 수업, 강좌
    note: '*class*는 선생님이 가르치는 체계적인 수업이나 강좌를 뜻해요.'
    example_gloss: 그녀의 집 근처에 그림 수업이 있었어요.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: 레일라는 그림 그리는 것을 아주 좋아하지만 여가 시간이 많지 않아요. 여가 시간이 더 있다면 매일 그림을 그릴 거예요. 지난달에 그녀의 집 근처에 그림 수업이 있었어요. 그 수업을 더 일찍 알았더라면 등록했을 거예요. 지금은 매주 새 수업이 없는지 찾아봐요.
    note: 현재의 비현실적인 상황과 과거의 비현실적인 상황이 함께 나오는 짧은 읽기 글이에요.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: '대니얼: 주말에 뭐 할 계획이야?'
    note: 대화를 시작할 때 쓰는 간단한 열린 질문이에요.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: '레일라: 비가 안 오면 산책하러 갈 거야. 비가 오면 집에서 그림 그릴 거고.'
    note: 날씨에 따라 달라지는 실제 조건 두 가지를 이어서 말해요.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: '대니얼: 좋겠다. 지난달에 그 그림 수업 들었어?'
    note: 과거에 있었던 일에 대해 이어서 하는 질문이에요.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: '레일라: 아니. 더 일찍 알았더라면 등록했을 거야.'
    note: '*if* + 과거완료, *would have* + 과거분사는 과거에 일어나지 않은 일이나 후회를 나타내요.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: '대니얼: 아쉽다. 또 있으면 들어 봐.'
    note: 대니얼은 *should*를 써서 레일라에게 다음 기회를 잡으라고 권해요.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: '레일라: 맞아. 하나 보이면 바로 등록할 거야.'
    note: 이제는 가정이 아니라 미래에 대한 새로운 실제 조건이에요.
