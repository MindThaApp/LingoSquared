    title: 레일라가 우산을 부탁해요
    gloss: '레일라가 말해요: 안녕하세요, 미아. 우산 좀 빌려도 될까요?'
    note: '*Can I borrow your umbrella?*가 부탁하는 말이에요.'
  en.a1.unit68.lesson03.teach.dialogue_line2:
    title: 미아가 우산을 빌려줘요
    gloss: '미아가 말해요: 네, 빌려드릴 수 있어요.'
    note: '*lend it to you*는 미아가 빌려준다는 뜻이에요.'
  en.a1.unit68.lesson03.teach.dialogue_line3:
    title: 레일라가 미아에게 고마워해요
    gloss: '레일라가 말해요: 고마워요. 오늘 비가 와요.'
    note: '*It is raining today*는 우산이 필요한 이유를 설명해요.'
  en.a1.unit68.lesson03.teach.dialogue_line4:
    title: 미아가 돌려 달라고 해요
    gloss: '미아가 말해요: 내일 돌려주세요.'
    note: '*tomorrow*는 우산을 언제 돌려줘야 하는지 알려 줘요.'
  en.a1.unit68.lesson03.teach.dialogue_line5:
    title: 레일라가 충전기에 대해 물어요
    gloss: '레일라가 말해요: 물론이죠. 충전기가 필요해요?'
    note: '*Of course*는 물론이라는 뜻이에요.'
  en.a1.unit68.lesson03.teach.dialogue_line6:
    title: 미아가 충전기를 빌리고 싶어 해요
    gloss: '미아가 말해요: 네, 충전기 좀 빌려주실 수 있어요?'
    note: '*Can you lend me...?*는 무언가를 빌려 달라고 부탁해요.'
  en.a1.unit68.lesson03.teach.dialogue_line7:
    title: 레일라가 충전기를 빌려줘요
    gloss: '레일라가 말해요: 그럼요. 하나 빌려드릴 수 있어요.'
    note: '*one*은 충전기 하나를 가리켜요.'
  en.a1.unit68.lesson04.teach.borrowing_note:
    title: 빌린 물건 메모
    gloss: '빌린 물건 메모: 오늘 레일라가 미아의 우산을 갖고 있어요. 내일 돌려주세요. 미아가 레일라의 충전기를 갖고 있어요.'
    note: 메모에는 누가 어떤 물건을 갖고 있는지, 우산을 언제 돌려줘야 하는지 나와 있어요.
  en.a1.unit68.lesson04.teach.reading_passage:
    title: '본문: 물건을 나누는 친구들'
    gloss: '물건을 나누는 친구들: 비가 와서 레일라는 미아에게 우산을 빌려 달라고 했어요. 미아는 레일라에게 빌려줄 수 있다고 말했어요. 미아는 레일라에게 내일 돌려 달라고 부탁했어요. 그 뒤에 미아가 충전기가 필요해졌어요. 레일라는 미아에게 충전기를 빌려주었어요. 두 친구는 무엇을 돌려줘야 하는지 기억하려고 짧은 메모를 썼어요.'
    note: '*lent*는 *lend*의 과거형이에요.'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
    title: I borrowed your umbrella.
    gloss: 제가 우산을 빌렸어요.
    note: '*borrowed*는 *borrow*의 과거형이에요.'
  en.a1.unit68.lesson04.teach.will_return_tomorrow:
    title: I will return it tomorrow.
    gloss: 내일 돌려드릴게요.
    note: '*will* + 동사원형은 앞으로 할 일을 나타내요.'
