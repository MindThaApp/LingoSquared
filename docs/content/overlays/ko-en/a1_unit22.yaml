    instruction: 다니엘이 되어 대답하세요. 레일라가 말해요. 안 좋아 보여요. 무슨 일이에요? 머리가 아프고 목도 아프다고 말하세요. 레일라가 물어요. 열이 있어요? 잘 모르겠지만 더운 것 같다고 말하세요. 그다음에 레일라가 쉬면서 물을 마시고, 나아지지 않으면 병원에 가 보라고 해요. 고맙다고 말하고 오늘은 쉬겠다고 말하세요.
