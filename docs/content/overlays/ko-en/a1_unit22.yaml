teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: 두통
    note: '*headache*는 ''두통''이에요. 한국어는 ''머리가 아파요''라고 하지만, 영어에서는 *I have a headache*처럼 관사 *a*를 붙여서 ''두통 하나를 가지고 있다''고 말해요.'
    example_gloss: 머리가 아파요.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: 복통, 배앓이
    note: '*stomachache*는 ''복통''이에요. 여기서도 관사를 붙여 *a stomachache*라고 해요.'
    example_gloss: 배가 아파요.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: 열
    note: '*fever*는 ''열''이에요. *have a fever*라고 하고, *have fever*라고는 하지 않아요.'
    example_gloss: 열이 있는 것 같아요.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: 기침
    note: '*cough*는 ''기침''이에요. 명사와 동사로 모두 쓰여요. *a cough*(기침), *to cough*(기침하다)예요.'
    example_gloss: 다니엘은 기침이 심해요.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: 목 통증, 인후통
    note: '*sore throat*는 ''목이 아픈 것''이에요. *sore*는 ''아픈, 쓰라린''이라는 뜻이고, 여기서도 관사가 붙어요. *a sore throat*예요.'
    example_gloss: 목이 아파요.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: 무슨 일이에요?
    note: '*What''s wrong?*으로 문제가 무엇인지 물어요. *What''s*는 *What is*의 줄임말이에요.'
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: 머리가 아파요.
    note: '*I have a...*로 증상을 말해요. 문자 그대로는 ''저는 ~을 가지고 있어요''라는 뜻이에요. 한국어에서는 ''머리가 아파요''처럼 아픈 부분이 주어가 되지만, 영어에서는 항상 *I*가 주어예요.'
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: 더워요.
    note: '*I feel...*로 몸이 어떻게 느껴지는지 말해요. *I feel hot*은 ''더워요''라는 뜻이에요. 한국어에서는 주어를 생략하지만, 영어에서는 주어 *I*가 꼭 필요해요.'
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: 쉬다
    note: '*rest*는 ''쉬다''라는 뜻이에요.'
    example_gloss: 저는 좀 쉬어야 해요.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: 증상에 대한 글
    gloss: 머리가 아프고 목도 아파요. 열도 있는 것 같아요. 쉬어야 해요.
    note: 이 짧은 글에서 한 사람이 여러 증상을 한꺼번에 설명해요.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: 병원에 가 보세요.
    note: '*You should...*로 간단한 조언을 해요. ''~하는 게 좋아요''라는 뜻이에요. *should* 뒤에는 *to* 없이 동사가 와요.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: 괜찮은지 물어보기
    gloss: 레일라가 말해요. 안 좋아 보여요. 무슨 일이에요?
    note: '*You don''t look well*은 ''안 좋아 보여요''라는 뜻이에요.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: 다니엘의 대답
    gloss: 다니엘이 말해요. 머리가 아프고 목도 아파요.
    note: 다니엘은 두 가지 증상을 함께 말해요.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: 열이 있는지 물어보기
    gloss: 레일라가 물어요. 열이 있어요?
    note: '*Do you have a fever?*로 특정 증상이 있는지 물어요.'
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: 다니엘의 대답
    gloss: 다니엘이 말해요. 잘 모르겠지만 더운 것 같아요.
    note: 다니엘은 잘 모르지만 몸이 어떻게 느껴지는지 말해요.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: 레일라의 조언
    gloss: 레일라가 말해요. 쉬면서 물을 마시는 게 좋아요. 나아지지 않으면 병원에 가 보세요.
    note: 레일라는 먼저 간단한 조언을 하고, 그다음에 언제 병원에 가야 하는지 말해요.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: 다니엘의 마지막 대답
    gloss: 다니엘이 말해요. 네, 고마워요. 오늘은 쉴게요.
    note: 다니엘은 조언을 받아들이고 오늘 무엇을 할지 말해요.
