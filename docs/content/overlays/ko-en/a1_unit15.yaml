teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: 현금
    note: '*cash*는 지폐와 동전으로 된 현금이에요. 셀 수 없는 명사라서 *some cash*라고 하고, *a cash*라고는 하지 않아요.'
    example_gloss: 저는 현금이 좀 있어요.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: 카드
    note: '*card*는 플라스틱으로 된 모든 결제 카드를 가리키는 일반적인 말이에요.'
    example_gloss: 제 카드는 파란색이에요.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: 신용카드
    note: '*credit card*는 돈을 빌려 쓰고 나중에 갚는 카드예요. 한국어의 ''신용카드''와 같은 개념이에요.'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: 체크카드
    note: '*debit card*는 결제하면 바로 계좌에서 돈이 빠져나가는 카드예요. 한국의 체크카드가 바로 *debit card*예요.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: 총액
    note: '*total*은 내야 하는 전체 금액이에요.'
    example_gloss: 총액이 얼마예요?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: 신용카드 받으세요?
    note: '*Do you take credit cards?*는 결제하기 전에 흔히 하는 질문이에요. 여기서 *take*는 ''받다, 받아 주다''라는 뜻이에요.'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: 죄송해요, 현금만 받아요.
    note: '*Sorry, cash only.*는 카드를 받지 않는 가게에서 흔히 하는 대답이에요.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: 네, 카드로 결제할게요.
    note: '*Yes, I''ll pay by card.*는 결제 수단을 최종적으로 정하는 말이에요. *by* 뒤에는 *card*를 관사 없이 써요.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: 세금
    note: '*tax*는 세금이에요. 미국 대부분의 가게에서는 가격표에 세금이 빠져 있고, 계산대에서 따로 더해져요. 세금이 가격에 포함된 한국과는 달라요.'
    example_gloss: 세금은 1달러예요.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: 영수증 내용
    gloss: '커피: 3달러. 샌드위치: 6달러. 세금: 1달러. 합계: 10달러.'
    note: 실제 영수증이에요.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: 총액은 10달러예요.
    note: 이 문장은 영수증의 총액을 완전한 문장으로 요약해요.
  en.a1.unit15.lesson04.teach.q_total:
    title: 총액 물어보기
    gloss: 레일라가 총액이 얼마인지 물어요
    note: '*How much is the total?*는 최종 금액을 물을 때 흔히 쓰는 질문이에요. *the total*은 하나의 합계이기 때문에 *is*를 써요.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: 총액에 대한 대답
    gloss: 점원이 말해요. 15달러예요.
    note: '*It''s fifteen dollars.*는 총액을 물어본 질문에 대한 완전한 대답이에요.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: 카드 결제 가능한지 물어보기
    gloss: 레일라가 신용카드를 받는지 물어요
    note: 앞에서와 같은 질문이에요.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: 카드 결제에 대한 대답
    gloss: 점원이 말해요. 네, 받아요.
    note: '*Yes, we do.*는 완전한 짧은 대답이에요. 영어에서는 그냥 ''네''라고만 하지 않고 조동사 *do*를 되풀이해서 말해요.'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: 결제 수단 정하기
    gloss: 레일라가 말해요. 좋아요, 카드로 결제할게요.
    note: 이 문장으로 결제 수단을 정하고 대화를 마무리해요.
