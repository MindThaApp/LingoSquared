teaching:
  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: 예약, 약속
    note: '*appointment*는 병원이나 업체 등에 미리 잡는 예약이나 약속을 뜻해요.'
    example_gloss: 목요일에 예약이 있어요.
  en.a1.unit47.lesson01.teach.available:
    title: available
    gloss: 시간이 되는, 가능한
    note: '*available*은 "시간이 되는", "가능한"이라는 뜻이에요.'
    example_gloss: 목요일에 시간 되세요?
  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: 예약하다
    note: '*book*은 여기서 동사로 "예약하다"라는 뜻이에요. 명사 "책"이 아니에요.'
    example_gloss: 예약을 하고 싶어요.
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: 확인하다, 확정하다
    note: '*confirm*은 "확인하다", "확정하다"라는 뜻이에요.'
    example_gloss: 시간을 확인해 주시겠어요?
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: 일정을 변경하다
    note: '*reschedule*은 이미 잡힌 약속을 다른 시간으로 바꾼다는 뜻이에요.'
    example_gloss: 금요일로 바꿀 수 있을까요?
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: 예약을 하고 싶어요.
    note: '*I''d*는 *I would*의 줄임말이에요. *I''d like to ...*는 "...하고 싶어요"라는 공손한 표현이에요.'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: 금요일에 시간 되세요?
    note: 요일 앞에는 항상 전치사 *on*을 써요. *on Friday*는 "금요일에"라는 뜻이에요.
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: 몇 시가 편하세요?
    note: '*works for you*는 여기서 "편하세요", "괜찮으세요"라는 뜻의 고정 표현이에요. "일하다"라는 뜻이 아니에요.'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: 그 시간이 괜찮아요.
    note: '*That time works for me.*는 "그 시간이 괜찮아요"라는 뜻이에요.'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: 월요일로 바꿀 수 있을까요?
    note: '*reschedule for ...*에서는 새 날짜 앞에 *to*가 아니라 *for*를 써요.'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: 예약이 확정되었습니다.
    note: '*Your appointment is confirmed.*는 "예약이 확정되었습니다"라는 뜻이에요.'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: 미아의 질문
    gloss: 미아가 물어요. 레일라, 맥스는 괜찮아요? 요즘 좀 피곤해 보여요.
    note: '*He seems a little tired lately.*는 "요즘 좀 피곤해 보여요"라는 뜻이에요.'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: 레일라의 설명
    gloss: 레일라가 말해요. 괜찮아요, 걱정 마세요. 연례 건강검진 받을 때가 됐을 뿐이에요. 동물병원에 전화해야겠어요.
    note: '*due for*는 "~할 때가 된"이라는 뜻으로, 정해진 때에 해야 하는 일에 써요.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: 레일라가 동물병원에 전화해요
    gloss: 레일라가 말해요. 안녕하세요, 우리 강아지 건강검진 예약을 하고 싶어요.
    note: '*I''d like to*는 *I want to*보다 공손한 표현이에요. 한국어로는 "...하고 싶어요"에 가까워요.'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: 미아의 질문
    gloss: 미아가 물어요. 뭐라고 했어요?
    note: '*did they say*에서는 과거 의문문을 만드는 조동사 *did*를 써요.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "레일라의 대답"
    gloss: 레일라가 말해요. 목요일 오후 3시에 가능하대요.
    note: '*at 3pm*처럼 구체적인 시각 앞에는 *at*을 써요.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: 미아의 확인 질문
    gloss: 미아가 물어요. 그 시간 괜찮아요?
    note: '*Does that time work for you?*는 *that time works for you*의 의문문이에요. 앞에서 배운 의문문처럼 *do*를 써서 만들어요.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: 레일라의 확정
    gloss: 레일라가 말해요. 네, 괜찮아요. 목요일 오후 3시요. 감사합니다! 맥스의 예약이 확정되었어요.
    note: '*Max''s appointment*처럼 *''s*를 붙이면 "맥스의 예약"처럼 누구의 것인지 나타내요.'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: 예약하는 방법에 관한 글
    gloss: '예약하는 방법: 의사, 치과의사, 또는 다른 서비스를 이용해야 한다면 보통 먼저 예약을 해야 해요. 전화해서 예약을 하고 싶다고 말하세요. 접수 담당자가 가능한 요일과 시간을 알려 줄 거예요. 편한 시간을 고르면 예약을 확정해 줘요. 일정이 바뀌면 다시 전화해서 일정을 변경할 수 있는지 물어보세요. 지난주에 레일라는 동물병원에 전화해서 강아지 맥스의 연례 건강검진을 예약했어요. 병원은 목요일 오후 3시에 가능했고, 레일라는 시간을 확정했어요. 대니얼도 예약이 있어요. 월요일 아침에 치과에 검진을 받으러 가요. 대니얼은 긴장되지는 않고, 이번 주에 조금 바쁠 뿐이라고 했어요.'
    note: '*a little busy this week*는 "이번 주에 조금 바쁜"이라는 뜻이에요.'
