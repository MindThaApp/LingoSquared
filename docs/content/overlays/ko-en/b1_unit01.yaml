teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: ~해야 한다 (스스로 느끼는 강한 의무)
    note: '*must*는 스스로 매우 중요하다고 느끼는 강한 개인적 의무를 나타내요.'
    example_gloss: 저는 오늘 이 일을 끝내야 해요.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: ~해야 한다 (밖에서 오는 의무)
    note: '*have to*는 규칙이나 마감처럼 밖에서 주어지는 의무를 나타내요.'
    example_gloss: 저는 금요일까지 월세를 내야 해요.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: ~하는 게 좋다
    note: '*should*는 권유나 조언이에요. 꼭 해야 하는 엄격한 의무는 아니에요.'
    example_gloss: 곧 치과에 전화하는 게 좋아요.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: 할 일, 과제
    note: '*task*는 끝내야 하는 일이나 작업을 뜻해요.'
    example_gloss: 저는 끝내야 할 일이 하나 더 있어요.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: 월세
    note: '*rent*는 사는 곳에 대해 내는 돈을 뜻해요.'
    example_gloss: 월세는 금요일까지예요.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: 예약, 약속
    note: '*appointment*는 병원처럼 누군가와 미리 정해 둔 약속이나 예약을 뜻해요.'
    example_gloss: 저는 이번 주에 치과 예약이 있어요.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: eine starke Pflicht ausdrücken
    gloss: 저는 오늘 이 일을 끝내야 해요.
    note: '*I must*는 스스로 느끼는 강한 개인적 의무를 나타내요.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: eine Pflicht von außen ausdrücken
    gloss: 저는 금요일까지 월세를 내야 해요.
    note: '*I have to*는 납부 기한처럼 밖에서 주어지는 의무를 나타내요.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Form bei 'she'
    gloss: 그녀는 예약을 해야 해요.
    note: 주어가 *he/she/it*이면 *have to*가 *has to*가 돼요.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: eine Empfehlung geben
    gloss: 전화해서 예약을 확인하는 게 좋아요.
    note: '*should*는 조언이에요. *must*나 *have to*처럼 꼭 해야 하는 의무는 아니에요.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formen von 'have to'
    gloss: 저는 가야 해요. 그녀는 가야 해요. 우리는 가야 해요. 그들은 가야 해요.
    note: '*he/she/it*일 때만 *have*가 *has*로 바뀌어요. 다른 주어에서는 *have to* 그대로예요.'
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Reue über die Vergangenheit ausdrücken
    gloss: 더 일찍 전화했어야 했어요.
    note: '*should have* + 과거분사는 하지 못한 일에 대한 후회를 나타내요.'
    example_gloss: 더 일찍 전화했어야 했어요.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: ~하면 안 된다
    note: '*must not*은 절대 허용되지 않는 금지를 나타내요. 주의하세요. *must not*은 ''~할 필요 없다''가 아니라 ''~하면 안 된다''예요. ''~할 필요 없다''는 *don''t have to*예요.'
    example_gloss: 또 잊으면 안 돼요.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: ~할 필요 없다
    note: '*don''t have to*는 의무가 아니라는 뜻이에요. 금지를 뜻하는 *must not*과는 달라요.'
    example_gloss: 바쁘면 오지 않아도 돼요.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Reue, Verbot und keine Pflicht
    gloss: 전화했어야 했어요. 잊어버렸어요. 또 잊으면 안 돼요. 오지 않아도 돼요.
    note: '*should have* + 과거분사는 과거에 대한 후회를 나타내요. *must not*은 금지이고, *don''t have to*는 의무가 아니라서 해도 되고 안 해도 된다는 뜻이에요.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Lesetext: das Fitnessstudio'
    gloss: 어제 대니얼은 헬스장 회원권 연장하는 것을 잊어버렸어요. 휴대폰에 알림을 설정해 뒀어야 했어요. 이제 연체료를 내야 해요. 다음 달에는 또 잊으면 안 돼요.
    note: 대니얼의 실수와 그 결과에 대한 짧은 읽기 글이에요.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila fragt nach der Mitgliedschaft
    gloss: '레일라: 대니얼, 헬스장 회원권 연장했어?'
    note: 어떤 일을 이미 했는지 확인하는 직접적인 질문이에요.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Daniels Antwort: vergessen'
    gloss: '대니얼: 아, 맞다, 깜빡했어! 지난주에 했어야 했는데.'
    note: '*I should have done that*은 하지 않은 일에 대한 후회를 나타내요.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila warnt Daniel
    gloss: '레일라: 오늘 꼭 전화해. 안 그러면 연체료를 내게 될 거야.'
    note: 여기서 *must*는 급하게 하는 개인적인 경고를 나타내요.
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel nennt weitere Pflichten
    gloss: '대니얼: 네 말이 맞아. 나는 금요일까지 월세도 내야 하고, 치과에도 전화하는 게 좋겠어.'
    note: 대니얼은 한 번의 대답에서 *have to*(의무)와 *should*(조언)를 함께 써요.
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila beruhigt Daniel
    gloss: '레일라: 오늘 다 할 필요는 없어. 하지만 헬스장은 또 잊으면 안 돼.'
    note: 레일라는 *don't have to*(의무 아님)와 *must not*(금지)을 대비해서 말해요.
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel fasst einen Vorsatz
    gloss: '대니얼: 알아. 이번 달에는 더 체계적으로 지내야겠어.'
    note: 여기서 *I must be*는 스스로 하는 다짐을 나타내요.
