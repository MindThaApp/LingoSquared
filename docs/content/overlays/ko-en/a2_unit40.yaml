teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: 주문
    note: '*order*는 주문 그 자체예요. 동사 *to order*는 ''주문하다''라는 뜻이에요.'
    example_gloss: 제 주문이 이틀 늦게 도착했어요.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: 배송
    note: '*delivery*는 주문한 물건을 집까지 가져다주는 일이에요.'
    example_gloss: 배송은 화요일 오전에 왔어요.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: 택배, 소포
    note: '*parcel*은 포장되어 문 앞에 놓이는 상자예요.'
    example_gloss: 택배가 문 밖에 놓여 있었어요.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: 파손된
    note: '*damaged*는 오는 도중에 손상되었지만 아직 작동할 수도 있다는 뜻이에요. 주로 포장에 쓰는 말이에요.'
    example_gloss: 상자가 도착했을 때 파손되어 있었어요.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: 망가진
    note: '*broken*은 *damaged*보다 강한 표현이에요. 물건이 더 이상 작동하지 않는다는 뜻이에요.'
    example_gloss: 택배 안의 램프가 망가져 있었어요.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: 교환품, 대체품
    note: '*replacement*는 망가진 물건 대신 받는 새 물건이에요. *refund*는 돈을 돌려받는 ''환불''이에요.'
    example_gloss: 환불 말고 교환품을 요청했어요.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived und has not arrived yet
    gloss: 제 주문이 어제 도착했어요. 제 주문이 아직 도착하지 않았어요.
    note: '*arrived*는 과거의 한 시점에 도착한 것을 말할 때 써요. *has not arrived yet*은 지금도 계속 기다리고 있다는 뜻이에요.'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Sagen, wofür Sie anrufen
    gloss: 제 주문에 문제가 있어서 알려 드리고 싶어요.
    note: '*I''d like to report a problem with ...*는 29단원의 누수 때와 같은 공손한 표현이에요.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Sagen, was nicht stimmt
    gloss: 램프가 망가진 채로 도착했어요.
    note: '*arrived broken*은 도착했을 때 이미 망가져 있었다는 뜻이에요.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Zwischen Ersatz und Rückerstattung wählen
    gloss: 환불 대신 교환품을 받을 수 있을까요?
    note: '*instead of*는 두 가지를 맞세워요. 첫 번째를 고르고 두 번째는 고르지 않는다는 뜻이에요.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Ihre Bestellnummer nennen
    gloss: 제 주문 번호는 8154예요.
    note: 주문 번호를 물으면 바로 말해 주세요. 직원이 그 번호로 주문을 찾아요.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of zum Auswählen
    gloss: 환불 대신 교환품을 받을 수 있을까요? 교환 말고 환불을 받고 싶어요.
    note: '*instead of* 뒤에는 명사나 -ing 형태가 와요(*instead of a refund*, *instead of getting a refund*). 동사 원형은 오지 않아요. *instead of get a refund*는 틀려요.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: 상자
    note: '*box*는 주문한 물건이 들어 있는 상자예요. *parcel*은 배달되는 전체 택배예요.'
    example_gloss: 램프가 큰 상자에 들어 있었어요.
  en.a2.unit40.lesson03.teach.return_message:
    title: Die Antwort des Shops
    gloss: 메시지 감사합니다. 램프가 망가진 채 도착해서 죄송합니다. 램프를 상자에 다시 넣어 우체국에 가져가 주세요. 영업일 기준 3일 안에 새 램프를 보내 드립니다. 주문 번호 8154.
    note: 고객 서비스의 답변에는 보통 문제, 내가 할 일, 쇼핑몰이 할 일이 담겨 있어요.
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Was Sie mit der kaputten Lampe tun sollen
    gloss: 램프를 상자에 다시 넣어 우체국에 가져가 주세요.
    note: '*put ... back in ...*은 무언가를 원래 있던 곳에 다시 넣는다는 뜻이에요.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila ruft den Online-Shop an
    gloss: '레일라가 말해요: 안녕하세요, 제 주문에 문제가 있어서 알려 드리고 싶어요.'
    note: 전화에서는 바로 전화한 용건을 말해요.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: Der Mitarbeiter fragt nach
    gloss: '직원이 말해요: 안타깝네요. 어떤 문제인가요?'
    note: '*I''m sorry to hear that*은 나쁜 소식에 직원이 공손하게 건네는 정해진 반응이에요.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila erklärt das Problem
    gloss: '레일라가 말해요: 램프가 망가진 채로 도착했어요. 상자도 파손되어 있었어요.'
    note: 차이에 주의하세요. 상자는 *damaged*이고, 램프는 *broken*이에요.
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: Der Mitarbeiter fragt nach der Bestellnummer
    gloss: '직원이 말해요: 알겠습니다. 주문 번호를 알려 주실 수 있을까요?'
    note: 39단원에서 본 것과 같은 간접 의문문 *Could you tell me ...?*예요.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila nennt ihre Bestellnummer
    gloss: '레일라가 말해요: 제 주문 번호는 8154예요.'
    note: 2과의 문장과 같아요.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet zwei Möglichkeiten an
    gloss: '직원이 말해요: 감사합니다. 환불해 드릴까요, 교환품을 보내 드릴까요?'
    note: 여기서 *or*는 두 선택지를 나란히 놓아요. 둘 중 하나를 고르면 돼요.
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila wählt den Ersatz
    gloss: '레일라가 말해요: 환불 대신 교환품을 받을 수 있을까요?'
    note: 2과의 질문과 같아요.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: Der Mitarbeiter regelt es
    gloss: '직원이 말해요: 그럼요. 영업일 기준 3일 안에 새 램프를 보내 드립니다.'
    note: 3과 메시지에 있던 약속과 같아요.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Mitarbeiter
    gloss: '레일라가 말해요: 정말 감사합니다.'
    note: '*very much*는 감사를 더 강조해 줘요.'
