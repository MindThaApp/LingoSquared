  en.a1.unit55.lesson01.teach.swim_cap:
    title: swim cap
    gloss: 수영모
    note: '*swim cap*은 "수영모"라는 뜻이에요.'
    example_gloss: 수영장에서는 수영모를 써 주세요.
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: 규칙
    note: '*rules*는 "규칙"이라는 뜻이에요.'
    example_gloss: 수영하기 전에 수영장 규칙을 읽으세요.
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: 안전요원
    note: '*lifeguard*는 "안전요원"이라는 뜻이에요. 수영하는 사람들을 지켜보는 사람이에요.'
    example_gloss: 안전요원은 매일 수영장을 지켜봐요.
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: 표를 한 장 사고 싶어요.
    note: '*I''d like to*는 *I would like to*를 줄인 말로, 정중하게 부탁하는 표현이에요.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: 사물함은 어디에 있어요?
    note: '*Where are...?*에서는 동사가 주어 앞에 와요. 영어 의문문에서 흔한 어순이에요.'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: 몇 시에 문을 열어요?
    note: '*do you open*에서는 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: 표 한 장에 5달러예요.
    note: '*for one ticket*은 "표 한 장에"라는 뜻이에요.'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: 수영모가 필요해요?
    note: '*Do I need...?*에서는 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: 저희는 8시에 문을 닫아요.
    note: '*at eight o''clock*처럼 정확한 시각 앞에는 *at*을 써요. 한국어의 "8시에"에서 "에"와 비슷해요.'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: 안전요원이 인사해요
    gloss: 안전요원이 말해요. "안녕하세요! 오늘 수영하러 오셨어요?"
    note: '*Are you here to swim today?*에서 *to swim*은 목적을 나타내요. 한국어의 "수영하러"와 비슷해요.'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: 대니얼의 표
    gloss: 대니얼이 말해요. "네, 표 두 장 주세요."
    note: 표 두 장을 달라는 짧고 직접적인 요청이에요.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: 가격
    gloss: 안전요원이 말해요. "물론이죠! 표 한 장에 5달러예요."
    note: 하나의 정보예요. 표 한 장의 가격이에요.
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: 미아가 수영모에 대해 물어요
    gloss: 미아가 말해요. "수영모가 필요해요?"
    note: '*Do we need...?*에서도 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: 수영모 규칙
    gloss: 안전요원이 말해요. "네, 수영장에서는 수영모를 꼭 써야 해요."
    note: '*swim caps are required*는 수동형으로, 규칙을 알릴 때 쓰는 격식 있는 표현이에요. 수영장 안내판이나 직원이 자주 써요. 한국어의 "수영모 착용 필수"나 "수영모를 써야 해요"와 비슷해요.'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: 대니얼이 사물함에 대해 물어요
    gloss: 대니얼이 말해요. "사물함은 어디에 있어요?"
    note: 짧은 질문이에요. 가격이나 시간에 대한 새로운 정보는 없어요.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: 사물함의 위치
    gloss: 안전요원이 말해요. "사물함은 입구 근처에 있어요."
    note: 하나의 정보예요. 사물함의 위치이고, 사물함에 필요한 것과는 달라요.
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: 사물함에 필요한 것
    gloss: 안전요원이 말해요. "1달러 동전이 필요해요."
    note: '*a dollar coin*은 영어 단어 두 개(*dollar*와 *coin*)를 띄어 쓴 표현이에요. 한국어에서는 "1달러 동전"처럼 말해요.'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: 미아가 문 닫는 시간을 물어요
    gloss: 미아가 말해요. "몇 시에 문을 닫아요?"
    note: '*What time do you close?*에서는 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: 문 닫는 시간
    gloss: 안전요원이 말해요. "저희는 8시에 문을 닫아요."
    note: 네 번째 정보예요. 문 닫는 시간이에요.
  en.a1.unit55.lesson04.teach.reading_passage:
    title: '글: 수영장에서 보낸 하루'
    gloss: 7월의 어느 더운 오후, 대니얼과 미아는 동네 수영장에서 더위를 식히기로 했어요. 입구 근처 안내판에는 수영장 규칙이 적혀 있었어요. 뛰지 말 것, 그리고 수영장에서는 수영모를 꼭 쓸 것이었어요. 두 사람은 안전요원에게 표 두 장을 달라고 했어요. 표 한 장에 5달러였어요. 안전요원은 사물함이 입구 근처에 있고 1달러 동전이 필요하다고 설명했어요. 대니얼과 미아는 가방을 사물함에 넣고 거의 두 시간 동안 수영했어요. 떠나기 전에 두 사람은 안내판을 다시 확인했어요. 수영장은 8시에 문을 닫아요. 미아는 다음 주말에 다시 와서 다이빙대를 타 보고 싶다고 말했어요.
    note: '*required*는 "필수인"이라는 뜻이고, 수동형이에요. *swim caps are required*는 "수영모를 꼭 써야 해요"라는 뜻이에요.'
