teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: 침실
    note: '*bedroom*은 ''침실''이에요. *bed*(침대)와 *room*(방)이 합쳐진 말이지만, 영어에서는 두 단어를 띄어서 발음하고 강세도 따로 줘요.'
    example_gloss: 제 침실은 욕실 옆에 있어요.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: 부엌, 주방
    note: '*kitchen*은 ''부엌''이에요. ''키친''처럼 발음하고, *t*는 따로 소리 나지 않아요.'
    example_gloss: 부엌은 거실 옆에 있어요.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: 욕실, 화장실
    note: '*bathroom*은 ''욕실''이에요. 미국에서는 화장실을 가리키는 말로도 자주 써요.'
    example_gloss: 욕실에는 샤워기가 있어요.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: 거실
    note: '*living room*은 ''거실''이에요. 한국어 ''거실''은 한 단어지만 영어는 두 단어로 써요.'
    example_gloss: 우리는 거실에서 텔레비전을 봐요.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: 정원, 마당
    note: '*garden*은 ''정원''이에요. 미국에서는 집 뒤쪽 마당을 *yard*라고도 해요.'
    example_gloss: 정원은 없지만 발코니는 있어요.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: 여기는 부엌이에요.
    note: '*This is ...*로 무언가를 가리켜 소개해요. *the*는 특정한 것을 가리켜요. 여기서는 이 집의 부엌이에요.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: 방이 몇 개 있어요?
    note: '*How many...are there?*로 개수를 물어요. *many*는 셀 수 있는 복수 명사와 함께 쓰고, *rooms*가 복수라서 *are*를 써요. 한국어와 달리 영어는 복수형을 꼭 표시해요.'
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: 작은 부엌이 있어요.
    note: '*There''s...*(*there is*)는 어딘가에 무언가가 있다고 말할 때 써요. 한국어의 ''~이 있어요''와 비슷해요. 여러 개일 때는 *there are*라고 해요.'
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: ~ 옆에
    note: '*next to*는 ''~ 옆에''라는 뜻이에요. 두 단어이고 항상 붙어서 써요.'
    example_gloss: 의자는 탁자 옆에 있어요.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: 아파트
    note: '*apartment*는 ''아파트''예요(미국식. 영국에서는 *flat*이라고 해요). 한국의 ''아파트''는 큰 단지를 떠올리지만, 영어의 *apartment*는 건물 안의 한 가구를 가리켜요.'
    example_gloss: 다니엘의 아파트에는 침실이 두 개 있어요.
  en.a1.unit24.lesson03.teach.home_text:
    title: 아파트에 대한 글
    gloss: 우리 집에는 침실이 두 개, 욕실이 한 개 있어요. 거실 옆에 작은 부엌이 있어요.
    note: 이 짧은 글에서 한 사람이 자기 집을 설명하고 방의 개수를 말해요.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: 제일 좋아하는 방은 어디예요?
    note: '*favorite*은 ''가장 좋아하는''이라는 뜻이에요.'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: 집에 대해 물어보기
    gloss: 레일라가 말해요. 당신 집에 대해 말해 주세요.
    note: '*Tell me about...*으로 누군가에게 무언가를 설명해 달라고 부탁해요.'
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: 다니엘의 대답
    gloss: 다니엘이 말해요. 침실이 두 개, 욕실이 한 개 있어요. 거실 옆에 작은 부엌이 있어요.
    note: 다니엘은 방의 개수와 부엌의 위치를 말해요.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: 정원이 있는지 물어보기
    gloss: 레일라가 물어요. 정원이 있어요?
    note: '*Is there...?*로 무언가가 있는지 물어요.'
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: 다니엘의 대답
    gloss: 다니엘이 말해요. 아니요, 없어요. 하지만 작은 발코니는 있어요.
    note: 다니엘은 먼저 '아니요'라고 하고, 그다음에 다른 것을 말해요.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: 다니엘의 마지막 대답
    gloss: 다니엘이 말해요. 제가 제일 좋아하는 방은 거실이에요. 부엌과 가까워서 거기서 저녁을 먹기 편해요.
    note: 다니엘은 가장 좋아하는 방과 그 이유를 말해요.
