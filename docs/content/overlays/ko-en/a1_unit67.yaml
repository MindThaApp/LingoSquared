  en.a1.unit67.lesson04.teach.reading_passage:
    title: '본문: 기쁜 가족 소식'
    gloss: '기쁜 가족 소식: 미아는 대니얼에게 가족에 대해 물었어요. 대니얼은 가족이 잘 지낸다고 말했어요. 그러고는 좋은 소식을 전했어요. 누나가 아기를 낳았다는 거예요. 미아는 정말 멋진 소식이라고 말했어요. 대니얼은 가족과 함께 곧 찾아갈 거라고 말했어요. 그는 누나가 자랑스러웠어요. 나중에 미아는 짧은 메시지를 보냈어요. 당신 가족을 생각하니 기뻐요.'
    note: '*shared good news*는 좋은 소식을 전했다는 뜻이에요.'
