  en.a2.unit37.lesson04.exercise05.reply_opinion_as_leila:
    instruction: 다니엘이 어떻게 생각하는지 물어요. 레일라가 되어 2과의 의견 문장으로 대답해 보세요. 유용하다고 생각하지만 사람들을 직접 만나는 게 더 좋다고 말하세요.
