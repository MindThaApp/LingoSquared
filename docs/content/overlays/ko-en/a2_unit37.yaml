course:
  title: 영어 A2
  description: 조금 더 격식 있는 일상 상황을 위한 A2 수준 영어를 배워요. 자세한 한국어 설명이 함께 있어요.
units:
  en.a2.unit37.video_calls:
    title: 화상 통화에 대해 이야기하기
lessons:
  en.a2.unit37.lesson01.video_call_vocabulary:
    title: 카메라, 마이크, 연결 상태
  en.a2.unit37.lesson02.describing_your_video_calls:
    title: 내 화상 통화와 선호하는 방식 말하기
  en.a2.unit37.lesson03.reading_about_video_calls:
    title: 다른 사람이 화상 통화를 쓰는 방식 읽기
  en.a2.unit37.lesson04.video_calls_dialogue:
    title: 친구와 화상 통화에 대해 이야기하기
teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: 화상 통화
    note: '*video call*은 서로 얼굴을 보면서 하는 통화예요. 한국어로는 ''화상 통화''나 ''영상 통화''라고 해요.'
    example_gloss: 매주 월요일에 팀과 화상 통화를 해요.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: 카메라
    note: '*camera*는 내 모습을 전달하는 장치예요.'
    example_gloss: 회의가 시작되기 전에 카메라를 켜 주세요.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: 마이크
    note: '*microphone*은 내 목소리를 전달하는 장치예요.'
    example_gloss: 마이크가 꺼져 있어서 다른 사람들이 내 말을 못 들었어요.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: 연결 상태
    note: '*connection*은 내 컴퓨터와 인터넷 사이의 연결이에요.'
    example_gloss: 연결이 나빠서 화면이 멈췄어요.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: 음소거하다
    note: '*mute*는 내 소리를 꺼서 다른 사람이 듣지 못하게 한다는 뜻이에요.'
    example_gloss: 말하지 않을 때는 마이크를 음소거해요.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: 직접 만나서 / 얼굴을 맞대고
    note: '*face to face*는 화면을 통하지 않고 같은 공간에서 만난다는 뜻이에요.'
    example_gloss: 어떤 회의는 온라인보다 직접 만나서 하는 게 더 좋아요.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: faster than과 less ... than으로 비교하기
    gloss: 화상 통화는 방문하는 것보다 빨라요. 화상 통화는 직접 만나는 것보다 덜 개인적이에요.
    note: 짧은 형용사에는 *-er*을 붙이고 뒤에 *than*을 써요(*faster than*). 긴 형용사에는 *less ... than*이나 *more ... than*을 써요.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: 화상 통화를 얼마나 자주 하는지 말하기
    gloss: 매주 월요일에 팀과 화상 통화를 해요.
    note: '*every Monday*는 ''매주 월요일''이라는 뜻으로 정해진 습관을 나타내요.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: 카메라를 켜 달라고 부탁하기
    gloss: 카메라 좀 켜 줄 수 있어요?
    note: '*turn on*은 ''켜다''라는 뜻이고, 반대는 *turn off*(''끄다'')예요.'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: 누군가 음소거 상태였다고 말하기
    gloss: 죄송해요, 음소거 상태였어요.
    note: '*you were on mute*는 마이크가 음소거되어서 소리가 안 들렸을 때 쓰는 정해진 표현이에요.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: 선호를 들어 자기 의견 말하기
    gloss: 화상 통화가 유용하다고 생각하지만, 저는 사람들을 직접 만나는 게 더 좋아요.
    note: '*I think ... but I prefer ...*로 먼저 의견을 말하고 그다음에 더 좋아하는 것을 말해요.'
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: 저는 전화보다 화상 통화를 더 좋아해요. 저는 화상 통화보다 직접 만나는 모임을 더 좋아해요.
    note: '주의하세요. 한국어로는 ''~보다''라고 하지만, 영어에서는 *prefer* 뒤에 *than*이 아니라 *to*를 써요: *I prefer video calls to phone calls*.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: 헤드폰
    note: '*headphones*는 한 쌍만 써도 영어에서는 항상 복수형으로 말해요.'
    example_gloss: 가족이 회의 소리를 못 듣게 헤드폰을 써요.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: 레일라의 메시지
    gloss: 제 온라인 수업은 이제 모두 화상 통화예요. 카메라는 켜지만, 선생님이 질문하실 때까지 마이크는 음소거해 둬요. 헤드폰을 쓰면 연결이 더 좋아서 헤드폰을 써요. 화상 통화가 시간을 많이 아껴 준다고 생각하지만, 그래도 반 친구들은 직접 만나는 게 더 좋아요.
    note: 레일라가 자신의 온라인 수업에 대해 보낸 가벼운 메시지예요.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: 언제 마이크를 음소거하는지 말하기
    gloss: 선생님이 질문하실 때까지 마이크를 음소거해 둬요.
    note: '*until*은 ''~까지''라는 뜻이에요. 어떤 일이 특정 시점이 올 때까지 계속된다는 의미예요.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: 레일라가 대니얼의 일에 대해 묻는다
    gloss: '레일라가 물어요: 직장에서 화상 통화를 많이 해요?'
    note: '*a lot of*는 ''많은''이라는 뜻이고, 셀 수 있는 명사와 셀 수 없는 명사에 모두 쓸 수 있어요.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: 대니얼이 확정된 일정을 이야기한다
    gloss: '다니엘이 말해요: 네, 매주 월요일에 팀과 화상 통화를 해요.'
    note: 2과의 문장과 같아요.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: 레일라가 카메라에 대해 묻는다
    gloss: '레일라가 물어요: 카메라는 켜요?'
    note: 더 알고 싶을 때 하는 짧은 되묻기예요.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: 화상 통화에서 대니얼의 습관
    gloss: '다니엘이 말해요: 항상 켜요. 하지만 말하지 않을 때는 마이크를 음소거해요.'
    note: 여기서 *when I am not speaking*은 '내가 말하지 않는 동안에'라는 뜻이에요.
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: 레일라가 자신의 수업에 대해 이야기한다
    gloss: '레일라가 말해요: 제 온라인 수업은 이제 모두 화상 통화예요.'
    note: 33단원에서 나온 월요일과 수요일 수업과 이어져요.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: 대니얼이 상대의 의견을 묻는다
    gloss: '다니엘이 물어요: 그것들에 대해 어떻게 생각해요?'
    note: '*What do you think about them?*은 방금 말한 것에 대한 의견을 묻는 질문이에요.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: 레일라가 자기 의견을 말한다
    gloss: '레일라가 말해요: 화상 통화가 유용하다고 생각하지만, 저는 사람들을 직접 만나는 게 더 좋아요.'
    note: 2과의 의견과 같아요.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: 대니얼이 레일라의 말에 동의한다
    gloss: '다니엘이 말해요: 저도 그렇게 생각해요. 화상 통화는 방문하는 것보다 빠르지만 덜 개인적이에요.'
    note: '*I agree*로 동의를 나타내요. 그 뒤에는 보통 자기 이유를 덧붙여요.'
  en.a2.unit37.lesson04.teach.q_exactly:
    title: 레일라가 확인한다
    gloss: '레일라가 말해요: 맞아요.'
    note: '*Exactly*는 완전히 동의한다는 뜻을 짧게 나타내는 표현이에요.'
