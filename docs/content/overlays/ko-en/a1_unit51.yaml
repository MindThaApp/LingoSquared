    title: sore throat
    gloss: 목 아픔
    note: '*sore throat*는 "목이 아픈 증상"을 뜻해요.'
    example_gloss: 목도 아파요.
  en.a1.unit51.lesson02.teach.can_i_help_you:
    title: Can I help you?
    gloss: 도와드릴까요?
    note: '*Can I help you?*는 "도와드릴까요?"라는 뜻이에요.'
  en.a1.unit51.lesson02.teach.i_have_a_bad_cough_and_a_runny_nose:
    title: I have a bad cough and a runny nose.
    gloss: 기침이 심하고 콧물이 나요.
    note: '*a bad cough*는 "심한 기침"이라는 뜻이에요.'
  en.a1.unit51.lesson02.teach.do_you_have_something_for_a_sore_throat:
    title: Do you have something for a sore throat?
    gloss: 목 아픈 데 먹을 약 있어요?
    note: '*something for ...*는 "~에 쓰는 것"이라는 뜻이고, 어떤 증상에 맞는 약을 찾을 때 써요.'
  en.a1.unit51.lesson02.teach.take_one_tablet_every_four_hours:
    title: Take one tablet every four hours.
    gloss: 알약을 네 시간마다 한 알씩 드세요.
    note: 영어에서는 *every four hours*처럼 "every + 간격"으로 말해요. 한국어의 "네 시간마다"와 비슷한 표현이에요.
  en.a1.unit51.lesson02.teach.how_much_is_that:
    title: How much is that?
    gloss: 얼마예요?
    note: '*How much is that?*는 "얼마예요?"라는 뜻이에요.'
  en.a1.unit51.lesson02.teach.thats_nine_dollars:
    title: That's nine dollars.
    gloss: 9달러예요.
    note: '*That''s nine dollars.*는 "9달러예요."라는 뜻이에요.'
  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: 약사가 인사해요
    gloss: 약사가 말해요. "안녕하세요, 도와드릴까요?"
    note: '*Hi, can I help you?*는 "안녕하세요, 도와드릴까요?"라는 뜻이에요.'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: 레일라의 증상
    gloss: 레일라가 말해요. "네, 기침이 심하고 콧물이 나요."
    note: 앞에서 배운 문장이에요.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: 약사가 시럽을 추천해요
    gloss: 약사가 말해요. "도움이 될 기침 시럽이 있어요. 자기 전에 드세요."
    note: '*before bed*는 "자기 전에"라는 뜻이에요. 이 말은 알약이 아니라 기침 시럽에 해당해요.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: 대니얼의 질문
    gloss: 대니얼이 물어요. "목 아픈 데 먹을 약도 있어요?"
    note: 문장 끝의 *too*는 "~도"라는 뜻이에요.
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: 약사가 알약을 추천해요
    gloss: 약사가 말해요. "네, 이 알약은 목 아픈 데 좋아요. 네 시간마다 한 알씩 드세요."
    note: 알약을 먹는 방법에 대한 말이에요. 네 시간마다 먹어요. 시럽은 다른 때, 즉 자기 전에 먹어요.
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: 레일라의 결정
    gloss: 레일라가 말해요. "좋아요, 둘 다 살게요. 얼마예요?"
    note: '*I''ll take both.*는 "둘 다 살게요."라는 뜻이에요.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: 가격
    gloss: 약사가 말해요. "9달러예요."
    note: 앞에서 배운 문장이에요.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: 레일라가 계산해요
    gloss: 레일라가 말해요. "여기 있어요. 감사합니다!"
    note: '*Here you go.*는 "여기 있어요."라는 뜻이고, 무언가를 건네줄 때 써요.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: 약국 방문에 대한 글
    gloss: '약국 방문: 레일라는 미아와 산에 다녀온 지 며칠 뒤에 감기에 걸렸어요. 기침이 심하고 콧물이 났고, 목도 아팠어요. 대니얼이 레일라와 함께 집 근처 약국에 걸어갔어요. 약사는 레일라의 증상을 듣고 기침 시럽과 알약을 추천했어요. 약사는 기침 시럽은 자기 전에 먹고, 알약은 네 시간마다 한 알씩 먹으라고 했어요. 레일라는 둘 다 해서 9달러를 냈어요. 집에 오는 길에 대니얼은 레일라를 위해 휴지도 한 상자 샀어요. 레일라는 그날 밤 약을 먹었고, 주말쯤에는 기침이 훨씬 나아졌어요.'
    note: '*by the weekend*는 "주말쯤에는"이라는 뜻이에요.'
