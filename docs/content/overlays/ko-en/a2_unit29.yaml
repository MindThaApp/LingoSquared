teaching:
  en.a2.unit29.lesson01.teach.leaking:
    title: leaking
    gloss: 새는
    note: '*leaking*은 물이 새어서는 안 되는 곳에서 새는 것을 뜻해요. 한국어로는 "물이 새요"라고 해요.'
    example_gloss: 주방 싱크대가 새요.
  en.a2.unit29.lesson01.teach.sink:
    title: sink
    gloss: 싱크대
    note: '*sink*는 설거지를 하는 대야 모양의 개수대를 뜻해요.'
    example_gloss: 싱크대에서 물이 똑똑 떨어져요.
  en.a2.unit29.lesson01.teach.building_manager:
    title: building manager
    gloss: 건물 관리인
    note: '*building manager*는 건물을 관리하는 사람을 뜻해요.'
    example_gloss: 누수 때문에 건물 관리인에게 전화해야 해요.
  en.a2.unit29.lesson01.teach.plumber:
    title: plumber
    gloss: 배관공
    note: '*plumber*는 수도관 문제를 고치는 사람을 뜻해요.'
    example_gloss: 건물 관리인이 고치도록 배관공을 보내 줬어요.
  en.a2.unit29.lesson01.teach.repair:
    title: repair
    gloss: 수리
    note: '*repair*는 고장 난 것을 다시 쓸 수 있게 고치는 것을 뜻해요.'
    example_gloss: 수리는 내일 오후에 있을 거예요.
  en.a2.unit29.lesson01.teach.reused_home_words:
    title: 집과 관련된 단어
    gloss: 주방, 아파트, 욕실
    note: 이 단어들은 24과에서 이미 배웠어요. 여기서 다시 복습해요.
    example_gloss:
    - 누수는 주방에 있어요.
    - 우리 집은 침실이 두 개예요.
    - 욕실은 주방 바로 옆에 있어요.
  en.a2.unit29.lesson02.teach.report_problem:
    title: 문제 알리기
    gloss: 주방 싱크대에 문제가 있어서 신고하고 싶어요.
    note: '*I''d like to report...*는 공손하게 문제를 신고할 때 써요.'
  en.a2.unit29.lesson02.teach.leaking_since_morning:
    title: 문제가 얼마나 오래됐는지 설명하기
    gloss: 오늘 아침부터 새고 있어요.
    note: 어떤 일이 계속되고 있을 때 영어는 *It's been leaking since...*처럼 써요. 28과의 *I've had ... for*와 같아요. 한국어는 "아침부터 새고 있어요"처럼 현재 진행형으로 말해요.
  en.a2.unit29.lesson02.teach.ask_repair_timing:
    title: 언제 수리하는지 묻기
    gloss: 누가 와서 고쳐 줄 수 있는 건 언제인가요?
    note: '*When can someone come to fix it?*으로 수리가 언제 가능한지 공손하게 물어요.'
  en.a2.unit29.lesson03.teach.between_2_4:
    title: between 2pm and 4pm
    gloss: 오후 2시에서 4시 사이
    note: '*between 2pm and 4pm*은 오후 2시와 4시 사이를 뜻해요. 영어에서는 24시간제 대신 *pm*을 붙여서 시간을 써요.'
    example_gloss: 배관공이 오후 2시에서 4시 사이에 올 거예요.
  en.a2.unit29.lesson03.teach.confirmation_text:
    title: 수리 안내문
    gloss: 주방 싱크대 누수 신고가 접수되었습니다. 내일 오후 2시에서 4시 사이에 배관공이 방문합니다. 수리 번호는 6180입니다.
    note: 공식 확인 안내문이에요. 신고가 접수되었다는 내용과 함께 시간과 번호가 들어 있어요.
  en.a2.unit29.lesson04.teach.q_report_problem:
    title: 관리인에게 문제 알리기
    gloss: 대니얼이 말해요. 주방 싱크대에 문제가 있어서 신고하고 싶어요.
    note: 2과의 문장과 같아요.
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink:
    title: 싱크대 문제 묻기
    gloss: 건물 관리인이 물어요. 싱크대가 어떻게 됐나요?
    note: 28과에서 의사가 썼던 질문(*What's wrong?*)과 같은 형태예요. 이번에는 건강이 아니라 싱크대에 대해 물어요.
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing:
    title: 소요 기간에 대한 대니얼의 대답과 수리 일정 질문
    gloss: 대니얼이 말해요. 오늘 아침부터 새고 있어요. 누가 와서 고쳐 줄 수 있는 건 언제인가요?
    note: 2과의 두 문장이 이번에는 이어서 나와요.
  en.a2.unit29.lesson04.teach.a_send_plumber:
    title: 관리인이 배관공에 대해 답한다
    gloss: 건물 관리인이 말해요. 알겠어요. 내일 오후 2시에서 4시 사이에 배관공을 보낼게요.
    note: 건물 관리인이 문제를 듣고 나서 수리 시간을 알려 줘요.
  en.a2.unit29.lesson04.teach.q_need_to_be_home:
    title: 집에 있어야 하는지 묻기
    gloss: 대니얼이 물어요. 제가 집에 있어야 하나요?
    note: 대니얼은 수리 시간을 듣고 나서 이렇게 물어요.
  en.a2.unit29.lesson04.teach.a_confirm_window_number:
    title: 관리인의 마지막 확인
    gloss: 건물 관리인이 말해요. 네, 오후 2시에서 4시 사이에 집에 계세요. 수리 번호는 6180이에요.
    note: 건물 관리인이 정확한 시간과 수리 번호를 알려 줘요.
  en.a2.unit29.lesson04.teach.a_thank_you:
    title: 마무리 감사 인사
    gloss: 대니얼이 말해요. 정말 감사합니다.
    note: '*Thank you very much*는 공손하고 격식 있게 감사를 표하는 말이에요. 25과 대화 끝에서도 나왔어요.'
