teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: ~라고 말했다
    note: '*said that*은 다른 사람이 한 말을 전할 때 써요.'
    example_gloss: 그녀는 바쁘다고 말했어요.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: 나에게 ~라고 말했다
    note: '*told me that*은 누군가가 나에게 직접 정보를 알려 줬을 때 써요.'
    example_gloss: 그는 회의가 취소되었다고 나에게 말했어요.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: ~인지 물었다
    note: '*asked whether*는 예/아니요 질문을 전하는 표현이고, *asked if*보다 조금 격식 있게 들려요.'
    example_gloss: 미아는 우리에게 도움이 필요한지 물었어요.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: ~인지 물었다
    note: '*asked if*는 예/아니요 질문을 일상적인 말투로 전하는 표현이에요.'
    example_gloss: 미아는 우리에게 도움이 필요한지 물었어요.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: 메시지
    note: '*message*는 짧게 쓰거나 말로 전하는 소식을 뜻해요.'
    example_gloss: 레일라는 점심 후에 메시지를 보냈어요.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: 확인해 주다, 확정하다
    note: '*confirm*은 어떤 것이 확실하거나 맞다고 말하는 것을 뜻해요.'
    example_gloss: 출발하기 전에 시간을 확인해 주세요.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: 시간이 되는, 가능한
    note: '*available*은 한가해서 만날 수 있는 상태를 뜻해요.'
    example_gloss: 미아는 점심 후에 시간이 돼요.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Eine Aussage wiedergeben
    gloss: 미아는 점심 후에 시간이 된다고 말했어요.
    note: 전달하는 말에서는 *is*가 *was*로 바뀌는 경우가 많아요. *Mia said that she was available*처럼요. 한국어는 '시간이 된다고 했어요'처럼 전달해도 현재형을 그대로 쓰지만, 영어는 보통 과거형으로 바꿔요.
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Informationen an Sie wiedergeben
    gloss: 레일라는 사무실이 바빴다고 나에게 말했어요.
    note: '*told me that*은 누군가가 나에게 직접 정보를 알려 줬을 때 써요.'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Direkte und indirekte Rede
    gloss: 미아가 말해요. "저 시간이 돼요." 미아는 자기가 시간이 된다고 말했어요.
    note: '직접 말하기: *I am available*. 전해 말하기: *Mia said that she was available*. 전하는 말에서는 원래 말의 시제가 한 단계 과거로 바뀌는 경우가 많아요.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: 간단한 요약
    note: '*short summary*는 중요한 내용만 담은 짧은 정리를 뜻해요.'
    example_gloss: 오늘 회의에는 간단한 요약이면 충분해요.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: 전체 보고서
    note: '*full report*는 요약본이 아니라 보고서 전체를 뜻해요.'
    example_gloss: 미아는 우리가 전체 보고서가 필요한지 물었어요.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Lesetext: der Nachrichtenverlauf'
    gloss: 레일라는 미아의 메시지를 읽고 대니얼에게 전화했어요. 레일라는 미아가 점심 후에 시간이 된다고 말했어요. 또 미아가 숫자를 다 정리했다고도 말했어요. 미아는 팀이 오늘 전체 보고서가 필요한지 물었어요. 대니얼은 회의가 15분밖에 안 되니까 간단한 요약이면 충분하다고 레일라에게 말했어요.
    note: 다른 사람의 말과 질문을 전하는 짧은 읽기 글이에요.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel fragt nach Mias Antwort
    gloss: '대니얼이 말해요: 미아가 검토 건에 대해 답장했어요?'
    note: 앞서 온 메시지에 대한 예/아니요 질문이에요.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila gibt Mias Aussage wieder
    gloss: '레일라가 말해요: 네, 점심 후에 시간이 된다고 했어요.'
    note: '*she said that she was available*은 미아의 말을 전해요.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel fragt weiter
    gloss: '대니얼이 말해요: 좋아요. 다른 것도 물어봤어요?'
    note: 메시지에 다른 질문이 더 있었는지 확인하는 되묻기예요.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila gibt Mias Frage wieder
    gloss: '레일라가 말해요: 오늘 전체 보고서가 필요한지 물어봤어요.'
    note: '*asked if*는 직접 한 예/아니요 질문을 전하는 말로 바꿔 줘요.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel fragt nach Leilas Antwort
    gloss: '대니얼이 말해요: 그녀에게 뭐라고 했어요?'
    note: 레일라가 전달한 내용을 묻는 질문이에요.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila gibt ihre Antwort wieder
    gloss: '레일라가 말해요: 간단한 요약이면 충분하다고 말했어요.'
    note: '*I told her that...*은 내가 다른 사람에게 알려 준 내용을 전할 때 써요.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel beendet den Nachrichtenverlauf
    gloss: '대니얼이 말해요: 좋아요. 팀에게는 두 시에 만날 수 있다고 전할게요.'
    note: 대니얼도 정보를 전달하려고 *tell ... that*을 다시 써요.
