  en.a1.unit04.lesson04.teach.q_library:
    title: 재개장 묻기
    gloss: '대니얼: 도서관은 언제 다시 열어요?'
    note: '*When''s the library open again?*는 도서관이 언제 다시 문을 여는지 묻는 말이에요.'
