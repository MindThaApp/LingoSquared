    title: You can also write it as 7/7.
    gloss: 7/7로 쓸 수도 있어요.
    note: 주의하세요. 미국식 숫자 표기는 월/일 순서예요(*7/7* = 7월 7일). 한국어의 "7월 7일"과 같은 순서지만, 나라에 따라 일/월 순서로 쓰기도 해서 헷갈릴 수 있어요. *7/9*는 7월 9일이에요.
