teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: 일정을 변경하다
    note: '*reschedule*은 약속이나 일정을 다른 시간으로 옮긴다는 뜻이에요.'
    example_gloss: 그때는 직장에 있어서 수리 일정을 변경해야 해요.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: 이웃
    note: '*neighbor*는 옆집에 사는 사람이에요. 한국어 ''이웃''처럼 남자인지 여자인지 구분하지 않아요.'
    example_gloss: 이웃이 배관공에게 문을 열어 줄 수 있어요.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: 열쇠
    note: '*key*는 문을 여는 작은 금속 물건이에요.'
    example_gloss: 열쇠는 이웃에게 맡겨 둘게요.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: 누수
    note: '*leak*는 여기서 명사예요. 물이 새어 나오는 곳 그 자체를 말해요. 동사 *to leak*는 ''새다''라는 뜻이에요.'
    example_gloss: 주방 싱크대 밑의 누수가 점점 심해지고 있어요.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: 수리된
    note: '*fixed*는 *to fix*(''고치다'')의 과거분사로, 더 이상 고장 나 있지 않다는 뜻이에요.'
    example_gloss: 싱크대가 이제 수리돼서 물이 더는 새지 않아요.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: 오후
    note: '*afternoon*은 정오 이후의 시간대예요. 오전은 *morning*이에요.'
    example_gloss: 배관공은 오전이 아니라 오후에 왔어요.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: 안 될 때 쓰는 can't와 won't
    gloss: 저는 오후 2시에서 4시 사이에는 집에 있을 수 없어요. 오후에는 집에 없을 거예요.
    note: '*can''t*는 불가능하다는 뜻이고, *won''t*는 앞으로 그렇게 되지 않을 거라는 뜻이에요.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: 예약을 미루고 싶다고 말하기
    gloss: 수리 일정을 변경해야 해요.
    note: '*I need to ...*는 사무적이고 중립적인 표현이에요. 필요하다는 뜻이지만 무례하게 들리지 않아요.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: 다른 시간을 부탁하기
    gloss: 대신 오전에 오실 수 있을까요?
    note: '*Would it be possible to ...?*는 부탁할 때 가장 조심스러운 표현이에요. *instead*는 ''대신에''라는 뜻이에요.'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: 열쇠가 어디 있는지 말하기
    gloss: 열쇠는 이웃에게 맡겨 둘게요.
    note: '*leave something with someone*은 무언가를 누군가에게 맡겨 둔다는 뜻이에요.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: 문제가 해결됐는지 묻기
    gloss: 누수는 이제 수리됐나요?
    note: '*Is ... fixed?*는 작업 자체가 아니라 그 결과를 물어요.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: because로 이유 말하기
    gloss: 저는 직장에 있어서 오후 2시에서 4시 사이에는 집에 있을 수 없어요.
    note: '*because*는 문제와 이유를 이어 줘요. 영어에서는 *because* 뒤에도 평소 어순 그대로 ''주어 + 동사''를 써요.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: 메시지
    note: '*message*는 짧은 글 메시지 전반을 뜻해요. 문자, 채팅 메시지, 짧은 이메일 등이 있어요.'
    example_gloss: 새 수리 시간에 관한 메시지를 받았어요.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: 새 일정에 대한 메시지
    gloss: 수리 6180번 일정이 변경되었습니다. 배관공이 내일 오전 9시에서 11시 사이에 방문합니다. 이웃분이 문을 열어 주실 예정입니다. 오늘 중으로 메시지로 새 시간을 확인해 주세요.
    note: 관리사무소의 메시지는 짧고 사무적이에요. 무엇이 바뀌었는지, 언제인지, 내가 무엇을 해야 하는지가 담겨 있어요.
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: 확인하라는 요청 받기
    gloss: 오늘 중으로 메시지로 새 시간을 확인해 주세요.
    note: '*confirm*은 ''확인하다'', *by message*는 ''메시지로''라는 뜻이에요.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: 대니얼이 관리사무소에 전화한다
    gloss: '다니엘이 말해요: 안녕하세요, 수리 일정을 변경해야 해요.'
    note: 전화에서는 *Hello*로 시작하고 바로 전화한 이유를 말해요.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: 관리사무소가 어떤 수리인지 묻는다
    gloss: '관리사무소가 말해요: 문제없어요. 어떤 수리인가요?'
    note: '*Which repair is it?*는 이미 알고 있는 여러 건 중에서 하나를 물어요.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: 대니얼이 수리 번호를 말한다
    gloss: '다니엘이 말해요: 수리 6180번, 주방 싱크대 밑 누수예요.'
    note: 29단원의 수리 번호와 같아요. 같은 싱크대 누수예요.
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: 관리사무소가 이유를 묻는다
    gloss: '관리사무소가 말해요: 알겠어요. 왜 집에 계실 수 없나요?'
    note: '*Why can''t you ...?*는 왜 안 되는지 이유를 물어요.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: 대니얼이 이유를 말하고 오전 시간을 부탁한다
    gloss: '다니엘이 말해요: 저는 직장에 있어서 오후 2시에서 4시 사이에는 집에 있을 수 없어요. 대신 오전에 오실 수 있을까요?'
    note: 먼저 이유를 말하고 그다음에 부탁하면 처음부터 요구하는 것보다 공손하게 들려요.
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: 관리사무소가 새 기간을 제안한다
    gloss: '관리사무소가 말해요: 네, 배관공이 오전 9시에서 11시 사이에 갈 수 있어요.'
    note: '*between 9am and 11am*이 새 시간대예요.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: 대니얼이 열쇠 문제를 정리한다
    gloss: '다니엘이 말해요: 감사합니다. 열쇠는 이웃에게 맡겨 둘게요.'
    note: 2과의 문장과 같아요.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: 관리사무소가 확인을 요청한다
    gloss: '관리사무소가 말해요: 좋아요. 오늘 중으로 메시지로 새 시간을 확인해 주세요.'
    note: 3과 메시지에 있던 요청과 같아요.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: 대니얼이 확인해 줄 시점을 말한다
    gloss: '다니엘이 말해요: 오늘 오후에 확인할게요.'
    note: '*this afternoon*은 ''오늘 오후'', 즉 오늘 낮 12시 이후라는 뜻이에요.'
