teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: 영화관
    note: '*cinema*는 영화관이라는 뜻이에요.'
    example_gloss: 이 영화관은 아주 인기가 많아요.
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: 표
    note: '*ticket*은 표라는 뜻이에요.'
    example_gloss: 저는 표를 사야 해요.
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: 상영 시간 (영화)
    note: '*showtime*은 상영 시간, 즉 영화가 시작되는 시각을 뜻해요.'
    example_gloss: 영화 상영 시간이 언제예요?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: 좌석 / 자리
    note: '*seat*은 좌석이나 자리라는 뜻이에요.'
    example_gloss: 이 자리 비어 있어요?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: 스크린
    note: '*screen*은 스크린, 화면이라는 뜻이에요.'
    example_gloss: 스크린이 아주 커요.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: 팝콘
    note: '*popcorn*은 팝콘이라는 뜻이에요.'
    example_gloss: 우리는 영화관에서 항상 팝콘을 사요.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: 영화가 몇 시에 시작해요?
    note: '*does the film start*에서는 주동사가 *start*이므로 의문문을 만들 때 도우미 동사 *does*를 써요.'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: 7시 상영으로 표 두 장 주세요.
    note: '*for the seven o''clock show*는 표를 특정 상영 회차와 연결해 줘요.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: 팝콘 좀 주시겠어요?
    note: '*Can I have...?*는 무언가를 주문할 때 흔히 쓰는 직접적인 표현이에요.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: 전부 얼마예요?
    note: '*in total*은 전부, 합계라는 뜻으로, 최종 금액을 물을 때 써요.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: 20달러예요.
    note: '*That''s* 뒤에 금액을 붙이면 가격을 말하는 일정한 표현이 돼요.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: 정말 좋았어요!
    note: 영어에서는 동사 *like*와 목적어 *it*을 써서 말해요. 한국어의 "좋았어요"처럼 형용사로 말하는 구조와 달라요. 단어 하나하나가 아니라 문장 전체를 한 덩어리로 익히세요.
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: 대니얼이 상영 시간을 물어요
    gloss: '대니얼이 말해요: 안녕하세요! 영화가 몇 시에 시작해요?'
    note: '*does the film start*에서는 의문문을 만들기 위해 도우미 동사를 써요.'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: 상영 시간
    gloss: '매표소 직원이 말해요: 다음 상영은 7시예요.'
    note: '*at seven o''clock*처럼 시각 앞에는 전치사 *at*을 써요. 한국어의 "7시에"에서 "에"와 비슷한 역할이에요.'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: 대니얼이 표를 주문해요
    gloss: '대니얼이 말해요: 좋아요. 표 두 장 주시겠어요?'
    note: '따로 확인할 사실 하나: 표의 수(두 장)예요.'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: 표 가격
    gloss: '매표소 직원이 말해요: 물론이죠. 16달러예요.'
    note: '따로 확인할 사실 하나: 표 두 장을 합한 가격이에요.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: 레일라가 팝콘을 주문해요
    gloss: '레일라가 말해요: 팝콘 좀 주시겠어요?'
    note: 새로운 가격 정보가 아니라 부탁하는 말이에요.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: 팝콘 가격
    gloss: '매표소 직원이 말해요: 그럼요. 팝콘은 4달러예요.'
    note: '따로 확인할 두 번째 사실: 표와는 별개인 팝콘의 가격이에요.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: 대니얼이 합계를 물어요
    gloss: '대니얼이 말해요: 전부 얼마예요?'
    note: '*in total*은 모든 가격을 합한 금액을 물어요.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: 합계 금액
    gloss: '매표소 직원이 말해요: 20달러예요.'
    note: '따로 확인할 세 번째 사실: 표와 팝콘의 개별 가격과는 다른 합계 금액이에요.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: 레일라는 빨리 보고 싶어요
    gloss: '레일라가 말해요: 감사합니다! 빨리 보고 싶어요.'
    note: '*I can''t wait to...*는 기대감을 나타내는 정해진 표현이에요.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: 영화관 상영 일정
    gloss: '영화관 상영 일정: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: 일정표에는 영화 세 편의 상영 시간과 가격이 나와 있어요.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: '본문: 영화관에서 보낸 저녁'
    gloss: 어느 날 저녁, 대니얼과 레일라는 영화관에서 영화를 보기로 했어요. 두 사람은 영화가 몇 시에 시작하는지 물었고, 매표소 직원은 다음 상영작인 Star Journey가 7시라고 말했어요. 두 사람은 표 두 장을 16달러에, 팝콘 한 봉지를 4달러에 샀어요. 합계는 20달러였어요. 두 사람은 함께 영화를 봤는데, 우주 비행사들에 관한 영화였어요. 아주 웃겼어요. 영화가 끝나자 레일라는 정말 좋았다고 말했고, 대니얼은 다음 영화도 보고 싶다고 말했어요.
    note: '*watched*는 *watch*(보다)의 과거형이에요.'
