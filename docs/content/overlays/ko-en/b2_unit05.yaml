course:
  title: 영어 B2
  description: 미묘한 뉘앙스의 대화, 논증, 추측, 전문적인 토론을 위한 B2 수준 영어를 편한 한국어 설명과 함께 배워요.
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: 친구에게, 동료에게, 기관에 쓰는 말투
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: '읽기: 세 가지 독자'
  en.b2.unit05.lesson04.the_register_dialogue:
    title: To a friend, yes. To the clinic, no.
teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: 말투의 격식 수준, 문체 수준
    note: '*register*는 말이나 글이 얼마나 격식 있게 또는 편하게 들리는지를 뜻해요. 한국어에는 존댓말과 반말처럼 말끝으로 구분하는 체계가 있지만, 영어에는 그런 어미 체계가 없어요. 어조는 주로 문장을 어떻게 표현하느냐에 달려 있어요.'
    example_gloss: 독자가 달라지면 말투도 달라져요.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: 격식 없는, 편한
    note: '*casual*은 친구나 아는 사람에게 어울려요. 더 직접적이지만, 그렇다고 저절로 무례해지는 것은 아니에요.'
    example_gloss: 격식 없는 메시지는 친구에게 어울려요.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: 전문적인, 업무에 맞게 공손한
    note: '*professional*은 동료에게 어울려요. 공손하고 분명하지만 지나치게 격식을 차리지는 않아요.'
    example_gloss: 전문적인 메시지는 동료에게 어울려요.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: 격식 있는, 공식적인
    note: '*formal*은 기관에 어울려요. 영어에서는 보통 더 길고 더 간접적인 요청으로 격식을 나타내요.'
    example_gloss: 격식 있는 메시지는 기관에 어울려요.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: 독자, 청중, 받는 사람
    note: '*audience*는 내가 글을 쓰거나 말을 건네는 상대 사람 또는 집단이에요.'
    example_gloss: 독자가 누구냐에 따라 단어 선택이 달라져요.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: 기관, 단체
    note: '*institution*은 병원, 은행, 대학교처럼 조직으로 운영되는 곳이에요.'
    example_gloss: 병원은 하나의 기관이에요.
  en.b2.unit05.lesson02.teach.formal_request:
    title: 격식 있는 요청
    gloss: 제 예약을 금요일로 옮길 수 있는지 확인해 주시면 감사하겠습니다.
    note: '*I would be grateful if you could...*는 격식 있는 표현이에요. 영어에서는 격식을 위해 *you* 대신 다른 단어를 쓰지 않고, 공손함이 문장 구조 전체에 담겨 있어요.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: 격식 없는 요청
    gloss: 금요일로 옮겨 줄 수 있어?
    note: '*Can you...?*는 친구에게는 괜찮지만, 기관에는 너무 직설적으로 들리기 쉬워요.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: 전문적인 요청
    gloss: 금요일도 괜찮으시면 약속을 금요일로 옮겨도 될까요?
    note: '*Could we...?*는 동료에게 협력적이고 공손하게 들려요.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: 일정 관리팀 담당자님께,
    note: '*Dear...*는 격식 있는 글에서 쓰는 평범한 첫인사예요. 한국어 편지의 정중한 첫인사말보다 훨씬 덜 딱딱해요.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: 말투 바꾸기
    gloss: 말투를 바꿀 때도 내용은 그대로 유지하세요. 격식 없는 영어는 직접적인 질문을 쓸 수 있어요. 전문적인 영어는 흔히 could를 써요. 격식 있는 영어는 흔히 I would be grateful if you could를 써요.
    note: 존댓말과 반말만 떠올리지 마세요. 영어에서는 말투가 바뀌면 문장 전체가 달라져요.
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: 딱딱한, 지나치게 격식을 차린
    note: '*stiff*는 메시지가 상황에 비해 쓸데없이 격식을 차린 것처럼 들린다는 뜻이에요.'
    example_gloss: 딱딱한 메시지는 상황에 비해 너무 격식을 차린 것처럼 들려요.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: 알맞은, 적절한
    note: '*appropriate*는 표현이 독자와 상황에 잘 어울린다는 뜻이에요.'
    example_gloss: 알맞은 메시지는 독자에게 어울려요.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: '읽기 지문: 같은 메시지, 세 가지 독자'
    gloss: 니나는 약속을 금요일로 옮겨야 해요. 친구에게는 이렇게 써요. Can you move it to Friday? 이 메시지는 직접적이고 격식이 없어요. 동료에게는 이렇게 써요. Could we move the appointment to Friday if that still works for you? 이 메시지는 전문적이고 공손해요. 병원에는 이렇게 써요. I would be grateful if you could confirm whether my appointment can be moved to Friday. 세 글의 내용은 같지만, 독자에 따라 말투가 달라져요.
    note: 영어에서는 존댓말을 나타내는 별도의 어미 없이 표현 방식으로 말투가 달라져요.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: 니나가 표현을 물어봐요
    gloss: 니나가 말해요. 제 예약을 옮길 수 있는지 물어봐야 해요. 그냥 이렇게 써도 될까요? 'Can you move it?'
    note: '*just write*는 직접적인 표현이 어울리는지 니나가 망설이고 있음을 보여 줘요.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: 오스카가 말투 차이를 짚어 줘요
    gloss: 오스카가 말해요. 친구에게는 괜찮아요. 병원에는 그건 너무 격식 없게 들려요.
    note: 여기서도 영어에서는 그냥 *you*를 쓰지만, 문장 자체가 병원에 쓰기에는 너무 직접적이에요.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: 니나가 동료에게 쓰는 말투를 물어봐요
    gloss: 니나가 물어요. 동료에게는 뭐라고 쓸 거예요?
    note: 동료에게는 최대한 격식을 차린 말투가 아니라 전문적인 말투가 어울려요.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: 오스카가 동료용 문장을 알려 줘요
    gloss: 오스카가 말해요. 저라면 이렇게 쓸 거예요. 'Could we move the appointment to Friday if that still works for you?'
    note: '*Could we*와 *if that still works for you*가 요청을 더 부드럽게 만들어요.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: 니나가 병원에 보내는 글을 물어봐요
    gloss: 니나가 물어요. 그럼 병원에는요?
    note: 기관에는 더 격식 있는 요청 구조가 필요해요.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: 오스카가 격식 있는 문장을 알려 줘요
    gloss: 오스카가 말해요. 저라면 이렇게 쓸 거예요. 'I would be grateful if you could confirm whether my appointment can be moved to Friday.'
    note: 이 문장은 무언가를 해 달라고 퉁명스럽게 요구하지 않고, 확인을 부탁해요.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: 니나가 정리해요
    gloss: 니나가 말해요. 같은 메시지, 다른 말투네요.
    note: 내용은 그대로예요. 약속을 금요일로 옮기는 것이죠.
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: 오스카가 맞장구쳐요
    gloss: 오스카가 말해요. 맞아요. 내용은 그대로이고, 격식의 정도만 달라져요.
    note: 이것이 B2 수준에서 말투를 조절한다는 것의 핵심이에요.
