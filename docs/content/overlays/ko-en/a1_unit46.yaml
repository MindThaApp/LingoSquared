teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: 잃어버린
    note: '*lost*는 여기서 "잃어버린"이라는 뜻이에요. 영어에서는 "잃어버렸어요"를 과거형 *I lost ...*로 말해요.'
    example_gloss: 지갑을 잃어버렸어요.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: 찾은
    note: '*found*는 *find*의 과거형이자 과거분사예요. *I found your keys*는 "당신 열쇠를 찾았어요"라는 뜻이에요.'
    example_gloss: 당신 열쇠를 찾았어요!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: 열쇠
    note: '*keys*는 열쇠라는 뜻이에요.'
    example_gloss: 이건 제 열쇠예요.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: 지갑
    note: '*wallet*은 지갑이라는 뜻이에요.'
    example_gloss: 이거 당신 지갑이에요?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: 배낭
    note: '*backpack*은 배낭이라는 뜻이에요.'
    example_gloss: 제 배낭은 검은색이에요.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: 지갑을 잃어버렸어요.
    note: '*I lost my wallet.*은 말 그대로 "저는 제 지갑을 잃어버렸어요"라는 뜻이에요. 한국어의 "잃어버렸어요"처럼 과거형으로 말해요.'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: 제 열쇠 보셨어요?
    note: '*Have you seen ...?*는 "...를 보셨어요?"라는 뜻이에요. *have*로 시작하는 의문문이에요.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: 배낭을 찾은 사람 있나요?
    note: '*Has anyone found ...?*는 "...를 찾은 사람 있나요?"라는 뜻이에요.'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: 검은색이고 빨간 끈이 달려 있어요.
    note: '*It''s black with a red strap.*은 "검은색이고 빨간 끈이 달려 있어요"라는 뜻이에요.'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: 분실물 보관소가 어디예요?
    note: '*the lost and found*는 분실물 보관소를 뜻하는 영어의 고정 표현이에요. 말 그대로는 "잃어버린 것과 찾은 것"이에요.'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: 네, 찾았어요!
    note: '*Yes, we found it!*은 "네, 찾았어요!"라는 뜻이에요.'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: 다니엘의 질문
    gloss: 다니엘이 물어요. 미아, 배낭 어디 있어요? 분수대 옆에 있었잖아요.
    note: '*had*는 *have*의 과거형으로, 여기서는 "가지고 있었다"라는 뜻이에요.'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: 미아가 깜짝 놀라요
    gloss: 미아가 말해요. 아, 이런, 맞아요! 배낭이 없어요. 안에 카메라가 있는데!
    note: '*My camera is inside!*는 "안에 제 카메라가 있어요!"라는 뜻이에요.'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: 다니엘의 제안
    gloss: 다니엘이 말해요. 걱정 마세요, 공원 사무실에 전화해서 물어봐요.
    note: '*Don''t worry*는 "걱정 마세요"라는 뜻이에요.'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel belt
    gloss: 다니엘이 말해요. 안녕하세요, 분수대 근처에서 검은색 배낭을 잃어버렸어요. 혹시 찾은 사람 있나요?
    note: '*we lost a black backpack*은 "검은색 배낭을 잃어버렸어요"라는 뜻이에요. 영어에서는 이럴 때 과거형 *lost*를 써요.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: 미아의 질문
    gloss: 미아가 물어요. 뭐라고 했어요?
    note: '*did they say*에서는 과거 의문문을 만드는 조동사 *did*를 써요.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: 다니엘의 좋은 소식
    gloss: 다니엘이 말해요. 찾았대요! 검은색이고 노란 끈이 달려 있죠? 안내 데스크에서 보관하고 있대요.
    note: 문장 끝의 *right?*는 "맞죠?"처럼 확인하는 짧은 질문이에요.
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: 미아의 안도
    gloss: 미아가 말해요. 네, 맞아요! 지금 바로 가서 찾아와요. 정말 다행이에요.
    note: '*Let''s go get it*은 "가서 가져와요"라는 뜻이에요. 동사 두 개를 *to* 없이 이어서 말해요.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: 분실물 보관소에 관한 글
    gloss: '분실물 보관소: 공원에서 물건을 잃어버리면 먼저 그 물건을 마지막으로 가지고 있던 곳을 떠올려 보세요. 그다음 정문 근처 공원 사무실에 가서 물건을 설명하세요. 색깔과 특별한 특징을 말하면 돼요. 나중에 물건을 찾으면 직원이 연락할 수 있도록 이름과 전화번호를 알려 주세요. 미아가 분수대 근처에서 배낭을 잃어버린 뒤, 미아와 다니엘은 바로 공원 사무실에 전화했어요. 직원들은 이미 배낭을 찾아서 안내 데스크에 보관하고 있었어요. 미아는 카메라를 무사히 되찾아서 정말 안심했어요. 나중에 미아는 레일라에게 이야기를 전부 들려주었고, 레일라는 다음에는 미아가 물건을 더 잘 챙기도록 도와주겠다고 했어요.'
    note: '*keep better track of your things*는 "물건을 더 잘 챙기다"라는 뜻이에요.'
