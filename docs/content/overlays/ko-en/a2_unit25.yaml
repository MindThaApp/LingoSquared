    example_gloss: 전기요금 고지서는 거주지 증명의 흔한 예예요.
  en.a2.unit25.lesson03.teach.notice_text:
    title: 안내문
    gloss: 주소를 변경하려면 사진이 있는 신분증과 거주지 증명 서류를 하나 가져오세요. 예를 들면 공과금 고지서가 있어요. 공과금 고지서가 없으면 임대차 계약서를 가져와도 돼요.
    note: 격식 있는 안내문이에요. 무엇을 가져와야 하는지, 대신 무엇을 가져와도 되는지 알려 줘요.
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: 사진이 있는 신분증을 가져갈게요.
    note: '*will*은 앞으로 할 일(미래)을 말할 때 써요.'
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: 무엇을 가져와야 하는지 알려 주시겠어요?
    note: '*Could you tell me...?*는 공손하게 돌려 묻는 질문이에요. *what* 뒤에는 평소 어순이 와요. *what I need to bring*처럼요.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: 얼마나 걸리는지 묻기
    gloss: 담당 직원이 물어요. 새 주소에서 얼마나 오래 사셨어요?
    note: '*How long have you lived...?*는 어떤 상태가 얼마나 계속되었는지 물어요. 한국어에서는 "얼마나 오래 살았어요?"처럼 과거형으로도 묻고 "살고 있어요?"처럼 현재형으로도 묻지만, 영어에서는 현재완료(*have lived*)를 써요. 대답은 *since*로 시작할 수 있어요. *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: 대니얼의 대답
    gloss: 대니얼이 말해요. 지난달부터요.
    note: '*Since last month*는 ''지난달부터''라는 뜻이에요. 여기서는 짧게 답해도 충분해요.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: 예약 묻기
    gloss: 대니얼이 물어요. 이번 주 금요일에 가도 될까요?
    note: 두 번째 레슨에 나온 질문과 같아요.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: 담당 직원의 대답
    gloss: 담당 직원이 말해요. 네, 금요일 10시 괜찮아요. 확인 번호는 4471이에요.
    note: 직원이 시간을 확인하고 확인 번호를 알려 줘요.
