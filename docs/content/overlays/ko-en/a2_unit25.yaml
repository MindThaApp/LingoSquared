    gloss: 서류
    note: '*document*는 공식 서류나 문서를 뜻해요.'
    example_gloss: 거주지 증명 서류를 한 가지 가져오세요.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: 거주지 증명
    note: '*proof of residency*는 어디에 사는지 보여 주는 서류를 뜻해요.'
    example_gloss: 전기요금 고지서를 거주지 증명으로 쓸 수 있어요.
  en.a2.unit25.lesson01.teach.form:
