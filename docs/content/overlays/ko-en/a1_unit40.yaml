teaching:
  en.a1.unit40.lesson01.teach.post_office:
    title: post office
    gloss: 우체국
    note: '*post office*는 ''우체국''이라는 뜻이에요.'
    example_gloss: 저는 편지를 보내러 우체국에 가요.
  en.a1.unit40.lesson01.teach.letter:
    title: letter
    gloss: 편지
    note: '*letter*는 ''편지''라는 뜻이에요.'
    example_gloss: 저는 친구에게 편지를 써요.
  en.a1.unit40.lesson01.teach.package:
    title: package
    gloss: 소포 / 택배
    note: '*package*는 ''소포''라는 뜻이에요.'
    example_gloss: 저는 여동생에게 소포를 보내요.
  en.a1.unit40.lesson01.teach.stamp:
    title: stamp
    gloss: 우표
    note: '*stamp*는 ''우표''라는 뜻이에요.'
    example_gloss: 이 편지에 붙일 우표가 필요해요.
  en.a1.unit40.lesson01.teach.envelope:
    title: envelope
    gloss: 편지 봉투
    note: '*envelope*는 ''편지 봉투''라는 뜻이에요.'
    example_gloss: 저는 편지를 봉투에 넣어요.
  en.a1.unit40.lesson01.teach.mailbox:
    title: mailbox
    gloss: 우체통
    note: '*mailbox*는 ''우체통''이라는 뜻이에요.'
    example_gloss: 우체통은 우체국 옆에 있어요.
  en.a1.unit40.lesson02.teach.send_a_letter:
    title: send a letter
    gloss: 편지를 보내다
    note: '*send a letter*는 ''편지를 보내다''라는 뜻이에요.'
    example_gloss: 저는 부모님께 편지를 보내고 싶어요.
  en.a1.unit40.lesson02.teach.buy_a_stamp:
    title: buy a stamp
    gloss: 우표를 사다
    note: '*buy a stamp*는 ''우표를 사다''라는 뜻이에요.'
    example_gloss: 이 엽서에 붙일 우표를 사야 해요.
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: 주소를 쓰다
    note: '*write the address*는 ''주소를 쓰다''라는 뜻이에요.'
    example_gloss: 소포에 주소를 써 주세요.
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: 얼마나 걸려요?
    note: '*how long will it take*는 ''얼마나 걸려요?''라는 뜻이에요.'
    example_gloss: 도착하는 데 얼마나 걸려요?
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: 빠른우편 / 특급 배송
    note: '*express mail*은 ''빠른우편''이라는 뜻이에요. 더 빠르지만 더 비싼 배송이에요.'
    example_gloss: 빠른우편은 일반우편보다 빨라요.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: 이것을 보내는 데 얼마예요?
    note: '*How much does it cost to ...?*는 어떤 일을 하는 데 드는 비용을 물을 때 써요.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: 대니얼의 요청
    gloss: '대니얼: 안녕하세요, 이 소포를 보내고 싶어요.'
    note: '*I''d like to* + 동사는 무언가를 정중하게 부탁하는 표현이에요. 창구에서 *I want*라고 하면 다소 퉁명스럽게 들리므로 훨씬 더 공손해요.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: 직원의 질문
    gloss: '직원: 그럼요! 어디로 가는 건가요?'
    note: '*Where is it going?*은 목적지를 묻는 말이에요.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "다니엘의 대답"
    gloss: '대니얼: 시카고로요. 여동생에게 줄 생일 선물이에요.'
    note: '*It''s a birthday gift for my sister*는 ''여동생에게 줄 생일 선물이에요''라는 뜻이에요.'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: 직원의 질문
    gloss: '직원: 일반우편으로 하시겠어요, 빠른우편으로 하시겠어요? 빠른우편은 이틀 정도 걸려요.'
    note: '*regular or express mail*은 ''일반우편이나 빠른우편''이라는 뜻이에요.'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: 대니얼의 선택
    gloss: '대니얼: 빠른우편으로 할게요. 얼마예요?'
    note: '*I''ll take ...*는 서비스를 이용할 때 선택을 말하는 자연스러운 표현이에요.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: 직원의 대답
    gloss: '직원: 12달러예요. 영수증 여기 있어요.'
    note: '*Here''s your receipt*는 ''영수증 여기 있어요''라는 뜻이에요.'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: 대니얼의 인사
    gloss: '대니얼: 감사합니다! 좋은 하루 보내세요.'
    note: '*Have a good day*는 헤어질 때 쓰는 공손한 인사예요.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: 우체국에 간 세 번에 관한 글
    gloss: 대니얼, 레일라, 미아는 모두 우체국 이용에 익숙해요. 지난주에 대니얼은 시카고에 사는 여동생에게 생일 소포를 보냈어요. 빨리 도착하기를 바라서 빠른우편을 이용했고, 이틀밖에 걸리지 않았어요. 레일라는 미아 가까이로 이사할 준비를 하고 있어서, 부모님께 오래된 책 몇 권을 보내려고 우체국에 갔어요. 직원은 소포 무게를 재고 우표를 붙여 주었어요. 레일라가 소포가 얼마나 걸리는지 묻자, 일반우편을 선택했기 때문에 직원은 일주일쯤 걸린다고 말했어요. 미아는 소포를 자주 보내지는 않지만, 할머니께 쓰는 편지에는 늘 우표를 사서 붙여요. 미아는 우표를 붙인 편지가 문자 메시지보다 더 정성스럽게 느껴진다고 말해요.
    note: '*getting ready to move*는 ''이사할 준비를 하다''라는 뜻이에요.'
