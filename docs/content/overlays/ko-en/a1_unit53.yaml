teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: 빌리다
    note: '*rent*는 "빌리다"라는 뜻이에요. 주의할 점은 *rent*가 빌리는 쪽과 빌려주는 쪽 모두에 쓰인다는 거예요. 한국어에는 "빌리다"와 "빌려주다"가 따로 있으니, 문맥을 보고 어느 쪽인지 판단하세요.'
    example_gloss: 자전거를 빌리고 싶어요.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: 보증금
    note: '*deposit*은 "보증금"이라는 뜻이에요. 미리 내는 돈이고, 자전거를 망가뜨리지 않고 돌려주면 돌려받아요.'
    example_gloss: 보증금은 20달러예요.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: 돌려주다
    note: 여기서 *return*은 "돌려주다"라는 뜻이에요. "돌아오다"가 아니에요.
    example_gloss: 오늘 자전거를 돌려주세요.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: 시간
    note: '*hour*는 "한 시간"이라는 뜻이에요.'
    example_gloss: 한 시간에 10달러예요.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: 사이즈
    note: '*size*는 "사이즈", 즉 크기라는 뜻이에요.'
    example_gloss: 어떤 사이즈가 필요하세요?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: 헬멧
    note: '*helmet*은 "헬멧"이라는 뜻이에요.'
    example_gloss: 헬멧 있어요?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: 자전거를 빌리고 싶어요.
    note: '*I''d like to*는 *I would like to*를 줄인 말이에요. 정중하게 부탁하는 표현이라서, 곧바로 말하는 *I want*보다 부드러워요.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: 한 시간에 얼마예요?
    note: '*does it cost*에서는 도우미 동사 *does*를 써요. 주요 동사가 *cost*이기 때문이고, 다른 영어 의문문에서 *do*를 쓰는 것과 같은 구조예요.'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: 작은 자전거가 필요해요.
    note: '*need a small bike*에서는 동사 *need* 뒤에 명사를 바로 붙여요. 한국어의 "~이 필요해요"와 비슷하지만, 영어는 *need* 뒤에 목적어를 그냥 써요.'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: 헬멧 하나 주시겠어요?
    note: '*Can I have ...?*는 가게에서 정중하게 부탁할 때 쓰는 흔한 표현이에요. 직역하면 "제가 가져도 돼요?"지만, 영어에서는 "~ 주시겠어요?"처럼 공손하게 들려요.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: 언제 돌려줘야 해요?
    note: '*do I need to*에서도 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: 한 시간에 10달러예요.
    note: 여기서 *an hour*는 "한 시간당"이라는 뜻이에요. *an*이 "~당"의 뜻으로 쓰였고, 다른 시간 단위에서도 *a*가 같은 뜻으로 쓰여요.
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: 대여점 직원이 인사해요
    gloss: 직원이 말해요. "안녕하세요! 오늘은 무엇을 도와드릴까요?"
    note: '*How can I help you today?*는 가게나 서비스 업소에서 인사로 자주 쓰는 정중한 말이에요.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: 미아의 요청
    gloss: 미아가 말해요. "자전거 두 대를 빌리고 싶어요. 강변을 따라 타고 싶어요."
    note: '*We''d like to rent*에서도 *rent*는 가게에서 "빌린다"는 뜻이에요. "빌려준다"는 뜻이 아니에요.'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: 직원이 사이즈를 물어요
    gloss: 직원이 말해요. "네. 어떤 사이즈가 필요하세요?"
    note: '*What size do you need?*에서도 의문문을 만들려고 도우미 동사 *do*를 써요.'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: 레일라의 사이즈
    gloss: 레일라가 말해요. "작은 걸로 필요해요."
    note: 여기서 *one*은 *bike*를 대신해서, 같은 말을 반복하지 않게 해 줘요. 한국어의 "작은 걸로"에서 "걸"과 비슷한 역할이에요.
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: 미아의 사이즈
    gloss: 미아가 말해요. "저는 중간 걸로 필요해요."
    note: 여기서도 *bike* 대신 *one*을 써요. 앞의 레일라 문장과 같아요.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: 가격과 보증금
    gloss: 직원이 말해요. "좋아요, 자전거 여기 있어요. 한 시간에 10달러고, 보증금은 20달러예요."
    note: 이 문장에는 서로 다른 두 가지 정보(시간당 요금과 보증금)가 있어요. 헷갈리지 않게 주의하세요.
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: 미아가 반납에 대해 물어요
    gloss: 미아가 말해요. "언제까지 돌려줘야 해요?"
    note: 여기서 *them*은 앞에 나온 자전거(복수)를 가리켜요.
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: 반납 시간
    gloss: 직원이 말해요. "5시까지 돌려주세요."
    note: '*by five o''clock*는 "5시까지"라는 뜻이에요. 5시가 지나면 안 돼요.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: 레일라가 직원에게 감사 인사를 해요
    gloss: 레일라가 말해요. "좋아요, 감사합니다!"
    note: '*Great, thank you!*는 대화를 정중하게 마무리할 때 쓰는 짧고 흔한 표현이에요.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: 강변 자전거 타기에 대한 글
    gloss: 어느 따뜻한 오후에 미아는 레일라를 집 근처 강변 자전거 타기에 초대했어요. 두 사람 다 자전거가 없어서 함께 자전거 대여점에 갔어요. 직원이 어떤 사이즈가 필요한지 물었고, 레일라는 작은 자전거를, 미아는 중간 크기 자전거를 골랐어요. 대여료는 한 시간에 10달러였고, 보증금은 두 대에 20달러였어요. 자전거는 5시까지 돌려줘야 했어요. 강변 자전거 타기는 정말 아름다웠고, 두 사람은 강아지와 산책하는 사람들과 화창한 날씨를 즐기는 사람들을 봤어요. 두 사람은 자전거를 정확한 시간에 돌려주고 보증금을 돌려받았어요. 그 뒤에 대니얼에게 자전거 탄 이야기를 했고, 대니얼은 다음에는 같이 가고 싶다고 말했어요.
    note: '*owned*는 *own*(가지고 있다)의 과거형이에요. *Neither of them owned a bike*는 "두 사람 다 자전거가 없었다"라는 뜻이에요.'
