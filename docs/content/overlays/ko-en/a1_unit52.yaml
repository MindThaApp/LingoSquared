  en.a1.unit52.lesson02.teach.can_you_make_it_a_little_shorter:
    title: Can you make it a little shorter?
    gloss: 조금만 더 짧게 해 주실 수 있어요?
    note: '*make it* 뒤에 형용사를 붙이면 "~하게 만들다"라는 뜻이에요. 한국어의 "더 짧게 해 주세요"와 비슷한 구조예요.'
  en.a1.unit52.lesson02.teach.the_same_style:
