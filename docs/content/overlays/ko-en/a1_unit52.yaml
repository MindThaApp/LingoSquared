  en.a1.unit52.lesson02.teach.id_like_a_haircut:
    title: I'd like a haircut, please.
    gloss: 머리를 자르고 싶어요.
    note: 영어에서는 *a haircut*이라는 명사를 써서 "머리 자르기를 원한다"고 말해요. 한국어의 "머리를 자르고 싶어요"처럼 동사로 말하는 것과 표현 방식이 조금 달라요.
