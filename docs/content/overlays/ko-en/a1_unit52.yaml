    title: It's twenty dollars.
    gloss: 20달러예요.
    note: '*It''s twenty dollars.*는 "20달러예요."라는 뜻이에요.'
  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: 미용사가 인사해요
    gloss: 미용사가 말해요. "안녕하세요, 오늘은 어떻게 해 드릴까요?"
    note: '*How can I help you today?*는 "오늘은 어떻게 해 드릴까요?"라는 뜻이에요.'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: 대니얼의 요청
    gloss: 대니얼이 말해요. "머리를 자르고 싶어요. 다음 주에 여동생이 놀러 와요."
    note: 영어에서는 *I'd like a haircut*처럼 *haircut*이라는 명사를 써요. 한국어에서는 "머리를 자르고 싶어요"처럼 동사로 말해요.
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "미용사의 질문"
    gloss: 미용사가 물어요. "네, 어떤 스타일로 할까요?"
    note: '*what style do you want*는 "어떤 스타일을 원하세요"라는 뜻이에요.'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: 대니얼이 원하는 스타일
    gloss: 대니얼이 말해요. "같은 스타일로, 조금만 더 짧게 해 주세요."
    note: '*just a little shorter*는 "조금만 더 짧게"라는 뜻이에요.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: 미아의 부탁
    gloss: 미아가 물어요. "먼저 머리를 감겨 주실 수 있어요?"
    note: '*Can you wash his hair first?*는 "먼저 머리를 감겨 주실 수 있어요?"라는 뜻이에요.'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: 미용사가 확인해 줘요
    gloss: 미용사가 말해요. "물론이죠. 머리 감기는 커트 가격에 포함돼 있어요."
    note: '*included with*는 "~에 포함된"이라는 뜻이에요.'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: 대니얼이 가격을 물어요
    gloss: 대니얼이 물어요. "좋아요. 얼마예요?"
    note: 여기서 *Great.*는 "좋아요"라는 뜻으로, 짧게 대답할 때 써요.
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: 가격
    gloss: 미용사가 말해요. "20달러예요."
    note: 앞에서 배운 문장이에요.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: 미용실 방문에 대한 글
    gloss: '미용실 방문: 다음 주에 대니얼의 여동생이 시카고에서 놀러 오기로 해서, 대니얼은 머리를 자르기로 했어요. 미아는 집 근처 작은 미용실에 있는, 자기가 제일 좋아하는 미용사를 추천했고 함께 갔어요. 미용사는 어떤 스타일을 원하는지 물었고, 대니얼은 같은 스타일로 조금만 더 짧게 해 달라고 했어요. 미용사는 먼저 머리를 감겨 줬는데, 머리 감기는 커트 가격에 포함돼 있었어요. 커트는 20달러였어요. 끝나자 미아는 머리가 정말 멋지다고 말했어요. 집에 가는 길에 두 사람은 레일라를 만나 커피를 마셨어요. 레일라는 감기가 나아서 훨씬 좋아 보였고, 대니얼의 새 머리도 아주 마음에 들어 했어요.'
    note: '*looked great*는 "아주 멋져 보였다"라는 뜻이에요.'
