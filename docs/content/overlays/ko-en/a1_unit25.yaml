  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: 레일라의 질문
    gloss: 레일라가 물어요. 다니엘, 여가 시간에 뭐 해요?
    note: 레일라가 다니엘에게 직접 질문하며 대화를 시작해요.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 저는 자주 달리기하러 가요. 가끔은 요리도 해요. 당신은요?
    note: 다니엘은 취미 두 가지를 빈도와 함께 말하고, *What about you?*로 질문을 되돌려요.
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: 레일라가 말하는 그림 그리기
    gloss: 레일라가 말해요. 저는 그림 그리기를 정말 좋아해요. 거의 매 주말에 그림을 그려요.
    note: '*almost every weekend*는 ''거의 매 주말''이라는 뜻이에요.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: 다니엘의 이어지는 질문
    gloss: 다니엘이 말해요. 멋지네요! 혹시 비디오 게임도 해요?
    note: '*Do you ever...?*는 상대가 어떤 일을 가끔이라도 하는지 물을 때 써요.'
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: 레일라의 마지막 대답
    gloss: 레일라가 말해요. 거의 안 해요. 저는 책 읽는 걸 더 좋아해요.
    note: '*I prefer...*는 ''~하는 쪽이 더 좋아요''라는 뜻이에요.'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: 취미에 대한 글
    gloss: 다니엘과 레일라는 취미가 서로 달라요. 다니엘은 토요일 아침마다 항상 달리기하러 가고, 가끔 친구들에게 저녁을 요리해 줘요. 레일라는 달리기하러 가는 일이 절대 없지만, 주말에 자주 그림을 그려요. 둘 다 비디오 게임을 좋아하지만, 함께 하는 일은 거의 없어요.
    note: 이 글은 다니엘과 레일라의 취미와 빈도를 직접 비교해요.
