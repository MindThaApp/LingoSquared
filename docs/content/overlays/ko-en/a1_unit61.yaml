    note: 영어에서는 *make a mistake*라고 말해요. *do a mistake*라고 하지 않으니 한 덩어리로 익히세요.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "다니엘이 사과해요"
    gloss: '대니얼이 말해요: 안녕하세요, 미아. 늦어서 죄송해요.'
    note: '*I''m sorry I''m late*는 사과와 그 내용을 함께 말하는 표현이에요.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: 미아가 받아 줘요
    gloss: '미아가 말해요: 괜찮아요.'
    note: '*That''s okay*는 친절하고 간단한 표현이에요.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: 버스가 늦었어요
    gloss: '대니얼이 말해요: 버스가 늦었어요.'
    note: 이 문장은 늦은 이유를 말해요.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: 미아가 기다려도 된다고 말해요
    gloss: '미아가 말해요: 괜찮아요. 우리 기다릴 수 있어요.'
    note: '*We can wait*는 기다릴 수 있다는 뜻이에요.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: 대니얼이 시간을 착각했어요
    gloss: '대니얼이 말해요: 제가 시간을 착각했어요.'
    note: '*with the time*은 시간과 관련해서라는 뜻이에요.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: 수업은 3시에 시작해요
    gloss: '미아가 말해요: 괜찮아요. 수업은 3시에 시작해요.'
    note: '*at three*처럼 시각 앞에는 *at*을 써요.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: 대니얼이 미아에게 고마워해요
    gloss: '대니얼이 말해요: 기다려 주셔서 감사해요.'
    note: '*Thank you for waiting*에서는 *for* 뒤에 -ing 형태가 와요.'
  en.a1.unit61.lesson04.teach.class_note:
    title: 수업 안내문
    gloss: '수업 안내: 수업은 3:00에 시작합니다. 제시간에 오세요. 늦으면 메시지를 보내세요.'
    note: 안내문에는 늦을 때 무엇을 해야 하는지 나와 있어요.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: '본문: 수업 전의 사과'
    gloss: '수업 전의 사과: 대니얼은 버스가 늦어서 수업에 늦었어요. 그는 교실 밖에서 미아를 만났어요. 대니얼은 미안하다고 말했어요. 그는 시간을 착각했다고도 말했어요. 미아는 괜찮다고 말했어요. 수업은 3시였어요. 대니얼은 선생님께 짧은 메시지를 보냈어요. 메시지에는 이렇게 적혀 있었어요. "늦어서 죄송해요. 버스가 늦었어요."'
    note: '*because*는 이유를 나타내요. 버스가 늦었기 때문이라는 뜻이에요.'
