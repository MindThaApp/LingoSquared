teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: 수업
    note: '*class*는 ''수업''이라는 뜻이에요(무언가를 배우는 모임).'
    example_gloss: 저는 화요일 저녁마다 수업이 있어요.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: 강좌
    note: '*course*는 ''강좌''라는 뜻이에요(한 주제에 대한 일련의 수업).'
    example_gloss: 그는 올해 컴퓨터 강좌를 들어요.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: 학생 / 수강생
    note: '*student*는 ''학생'' 또는 ''수강생''이라는 뜻이에요. 학교나 수업에서 배우는 사람이에요.'
    example_gloss: 그녀는 커뮤니티 칼리지 학생이에요.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: 숙제
    note: '*homework*는 ''숙제''라는 뜻이에요.'
    example_gloss: 저는 저녁 식사 후에 숙제를 해요.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: 과목
    note: '*subject*는 ''과목''이라는 뜻이에요(공부하는 주제).'
    example_gloss: 수학은 제가 제일 좋아하는 과목이에요.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: 시험
    note: '*test*는 ''시험''이라는 뜻이에요.'
    example_gloss: 우리는 금요일에 시험이 있어요.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: 수업을 듣다
    note: '*take a class*는 수업을 듣는다는 뜻의 고정 표현이에요. 한국어의 ''듣다''를 *listen*이나 *hear*로 옮기지 마세요. 항상 *take*를 써요.'
    example_gloss: 저는 화요일 저녁마다 수업을 들어요.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: 숙제를 하다
    note: '*do homework*: 동사는 *do*예요. 한국어의 ''숙제를 하다''처럼 ''하다''에 해당하는 *do*를 쓰고, *make*는 쓰지 않아요.'
    example_gloss: 그는 저녁 식사 후에 숙제를 해요.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: 시험 공부를 하다
    note: '*study for a test*는 ''시험 공부를 하다''라는 뜻이에요. 여기서 *for*는 목적(무엇을 위해 공부하는지)을 나타내요.'
    example_gloss: 저는 금요일마다 시험 공부를 해요.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: 커뮤니티 칼리지(성인을 위한 지역 대학)
    note: '*community college*는 주로 성인이 일하면서 강좌를 듣는 미국의 학교예요. 한국어에는 딱 맞는 말이 없어서 ''커뮤니티 칼리지''라고 그대로 써요.'
    example_gloss: 그녀는 커뮤니티 칼리지에서 공부해요.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: 저녁에
    note: '*in the evening*은 ''저녁에''라는 뜻이에요.'
    example_gloss: 제 수업은 저녁에 있어요.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: 무엇을 공부해요?
    note: 이 질문은 현재진행형(*are you studying*)을 써요. 요즘 하고 있는 공부를 물을 때 쓰고, 일반 현재형은 쓰지 않아요.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: 다니엘의 질문
    gloss: 다니엘이 물어요. 오늘 퇴근 후에 뭐 할 거예요?
    note: '*anything*은 여기서 ''무언가''라는 뜻이고 의문문에 와요.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "미아의 대답"
    gloss: 미아가 말해요. 네, 오늘 밤에 사진 수업이 있어요.
    note: '*tonight*은 ''오늘 밤''이라는 뜻이에요.'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: 다니엘의 반응
    gloss: 다니엘이 말해요. 와, 좋네요! 어디서 들어요?
    note: '*Where do you take it?*: 여기서도 수업이나 강좌를 듣는 데는 *take a class*처럼 *take*를 써요.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "미아의 대답"
    gloss: 미아가 말해요. 시내에 있는 커뮤니티 칼리지에서요. 일주일에 두 번이에요.
    note: '*twice a week*: 여기서도 *a*는 ''~마다''라는 뜻이에요.'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: 다니엘의 질문
    gloss: 다니엘이 말해요. 지금까지 어때요?
    note: '*so far*는 ''지금까지''라는 뜻이에요.'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "미아의 대답"
    gloss: 미아가 말해요. 정말 재미있어요. 카메라를 더 잘 쓰는 법을 배우고 있어요.
    note: '*I''m learning how to ...*: 지금 키워 가고 있는 기술에 쓰는 현재진행형이에요.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: 다니엘의 마지막 말
    gloss: 다니엘이 말해요. 멋지네요! 언제 저한테도 가르쳐 줘요.
    note: '*sometime*은 ''언젠가, 언제 한번''이라는 뜻이에요. 미래의 막연한 시점을 나타내요.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: 다니엘, 레일라, 미아에 관한 글
    gloss: 다니엘, 레일라, 미아는 모두 일 외에 새로운 것을 배우고 있어요. 다니엘은 일에 필요한 새 기술을 배우려고 월요일 저녁에 컴퓨터 강좌를 들어요. 레일라는 언젠가 멕시코에 여행 가고 싶어서 스페인어를 배워요. 미아는 커뮤니티 칼리지에서 일주일에 두 번 사진 수업을 들으며 벌써 훨씬 나은 사진을 찍어요. 가끔 점심시간에 함께 수업 이야기를 해요.
    note: '*takes a computer course*: *follow*가 아니라 *take*를 써요. *take a class*와 같은 함정이에요.'
