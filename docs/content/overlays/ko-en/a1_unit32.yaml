teaching:
  en.a1.unit32.lesson01.teach.dog:
    title: dog
    gloss: 개
    note: '*dog*은 ''개''라는 뜻이에요.'
    example_gloss: 저는 개가 있어요.
  en.a1.unit32.lesson01.teach.cat:
    title: cat
    gloss: 고양이
    note: '*cat*은 ''고양이''라는 뜻이에요.'
    example_gloss: 제 여동생의 고양이는 검은색이에요.
  en.a1.unit32.lesson01.teach.fish:
    title: fish
    gloss: 물고기
    note: '*fish*는 ''물고기''라는 뜻이에요.'
    example_gloss: 그에게는 물고기가 한 마리 있어요.
  en.a1.unit32.lesson01.teach.bird:
    title: bird
    gloss: 새
    note: '*bird*는 ''새''라는 뜻이에요.'
    example_gloss: 우리는 새를 키워요.
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: 반려동물
    note: '*pet*은 ''반려동물''이라는 뜻이고, *pets*는 복수형이에요. *Do you have any pets?*의 *any*에 주의하세요. 영어에서는 복수형이나 셀 수 없는 명사가 오는 의문문과 부정문에 *any*를 써요. 한국어에는 *any*에 딱 맞는 말이 없어서 ''반려동물 있어요?''라고만 해요. 영어에서는 *any*를 넣는 것이 자연스러워요.'
    example_gloss: 반려동물이 있어요?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: 이름은 루나예요.
    note: 영어에서는 동물의 성별을 알면 *her*/*his*(그리고 *she*/*he*)를 써요. 한국어는 보통 성별을 따로 나타내지 않고 '그 아이'처럼 말해요. *Her name is Luna*는 암컷 동물을 가리켜요.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: 놀다
    note: '*play*는 ''놀다''라는 뜻이에요.'
    example_gloss: 제 개는 노는 것을 좋아해요.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: 산책시키다
    note: '*walk*는 여기서 반려동물을 산책시킨다는 뜻이에요.'
    example_gloss: 저는 매일 개를 산책시켜요.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: 친근한
    note: '*friendly*는 ''친근한, 상냥한''이라는 뜻이에요.'
    example_gloss: 그녀의 고양이는 아주 친근해요.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: 작은
    note: '*small*은 ''작은''이라는 뜻이에요.'
    example_gloss: 물고기는 작아요.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: 다니엘의 질문
    gloss: 다니엘이 물어요. 미아, 반려동물 있어요?
    note: 질문 속 *any*에 해당하는 한국어 단어는 따로 없지만, 영어에서는 넣는 것이 자연스러워요.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "미아의 대답"
    gloss: 미아가 말해요. 네, 고양이가 있어요. 이름은 루나예요.
    note: 고양이의 성별(암컷)을 알기 때문에 *She*와 *her*를 써요. 한국어에서는 보통 성별을 따로 나타내지 않아요.
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: 다니엘의 이어지는 질문
    gloss: 다니엘이 말해요. 좋네요! 노는 걸 좋아해요?
    note: '*Does*는 여기서 *she*와 함께 쓰는 조동사예요(do-support). 의문문을 만들 때 쓰는 *do*의 3인칭 단수형이에요.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "미아의 대답"
    gloss: 미아가 말해요. 네, 공 가지고 노는 걸 정말 좋아해요. 당신은요?
    note: '*What about you?*는 같은 질문을 상대에게 되돌리는 짧고 자연스러운 표현이에요.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "다니엘의 대답"
    gloss: 다니엘이 말해요. 저는 작은 물고기가 있지만, 개를 키우고 싶어요.
    note: '*but*은 여기서 서로 반대되는 두 생각을 이어 줘요. 이미 반려동물이 있지만 다른 동물을 원해요.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: 레일라와 다니엘에 대한 글
    gloss: 레일라에게는 맥스라는 개가 있어요. 맥스는 크고 아주 친근해요. 레일라는 매일 아침 맥스를 산책시켜요. 다니엘에게는 개가 없지만 작은 물고기가 있어요. 물고기는 산책이 필요 없지만, 다니엘은 그래도 물고기가 헤엄치는 모습을 보는 걸 좋아해요.
    note: 맥스는 수컷이어서 *He*를 써요. 여기서도 *she*나 *he*는 동물의 실제 성별에 따라 골라요. 한국어에서는 보통 성별을 따로 나타내지 않아요.
