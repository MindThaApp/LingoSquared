  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Lesetext: einen kurzen Artikel zusammenfassen'
    gloss: 레일라는 디자인 수업을 위해 직장 내 소통에 대한 긴 기사를 읽었어요. 원본 기사에는 예시와 배경 정보가 많았지만, 레일라에게 필요한 것은 요점뿐이었어요. 그래서 자기 말로 짧게 요약했어요. 직장 내 소통은 메시지가 명확하고 짧을 때, 그리고 사람들이 짐작하지 않고 질문할 때 가장 잘 이루어진다는 내용이었어요. 예시는 요점이 아니라 세부 사항이어서 대부분 뺐어요. 선생님은 요약이 중요한 생각을 올바른 순서로 담고 있다고 말했어요.
    note: 짧은 읽기 글이에요.
