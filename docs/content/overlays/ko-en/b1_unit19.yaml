    title: Daniel bittet um eine Erklärung
    gloss: '대니얼이 말해요: 회의에 못 갔어요. 무슨 일이 있었는지 말해 줄래요?'
    note: 요약을 부탁할 때 쓰는 열린 질문이에요.
