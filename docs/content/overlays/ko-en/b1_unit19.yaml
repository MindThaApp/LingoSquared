teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: 요점, 핵심
    note: '*main point*는 글이나 대화에서 가장 중요한 생각을 뜻해요.'
    example_gloss: 회의의 요점은 예산이었어요.
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: 세부 사항
    note: '*detail*은 요점을 뒷받침하는 작은 추가 정보를 뜻해요.'
    example_gloss: 미아는 일정에 대한 작은 세부 사항을 하나 덧붙였어요.
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: 요약하면
    note: '*in summary*는 긴 설명의 끝에서 줄여서 정리할 때 써요.'
    example_gloss: 요약하면, 프로젝트는 다음 달에 끝나요.
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: 한마디로
    note: '*in short*는 대화에서 바로 요점을 말할 때 쓰는 빠르고 편한 표현이에요.'
    example_gloss: 한마디로, 팀은 계획에 합의했어요.
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: 자기 말로
    note: '*in your own words*는 원문을 그대로 옮기지 말고 자기 표현으로 설명해 달라고 할 때 써요.'
    example_gloss: 그 계획을 네 말로 설명해 줘.
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ... (eine Zusammenfassung geben)
    gloss: 요약하면, 회의에서는 예산과 새 고객을 다뤘어요.
    note: '*In summary, the meeting covered...*는 논의한 내용을 짧게 줄여 요약할 때 써요.'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ... (den Hauptpunkt nennen)
    gloss: 요점은 이번 달에 예산 범위 안에 있다는 거였어요.
    note: '*The main point was that...*은 작은 세부 사항과 구분해서 가장 중요한 생각을 말할 때 써요.'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: Der Aufbau einer Zusammenfassung
    gloss: 요약은 In summary나 In short 같은 표현으로 시작하고, 그다음에 요점만 순서대로 짧은 문장으로 말해요. 가장 중요한 생각 하나를 작은 세부 사항과 구분해서 강조하려면 The main point was that...을 써요.
    note: '형태: In summary/In short로 시작하고, 요점에는 The main point was that...을 써요.'
  en.b1.unit19.lesson03.teach.condensed:
