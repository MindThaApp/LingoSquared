answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: 0부터 100까지의 숫자, 나이, 전화번호, 요리 재료의 양을 배워요. 1단원에 이어 엘레나와 마테오가 요리 워크숍에서 계속 등장해요. 나이를 말할 때 쓰는 tener 표현과 수량 표현에서의 성 일치를 눈여겨보세요.
units:
  es.a1.unit02.numbers:
    title: 주방 속 숫자
lessons:
  es.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0부터 10까지
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 11부터 100까지
  es.a1.unit02.lesson03.asking_age:
    title: 나이 묻기
  es.a1.unit02.lesson04.phone_numbers:
    title: 전화번호
  es.a1.unit02.lesson05.recipe_quantities:
    title: 요리 재료의 양
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: 엘레나, 마테오와 함께 재료 세기
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: 영
    gloss: 영
    note: '*Cero*는 숫자 자체로도 쓰고, 숫자를 한 자리씩 읽을 때의 숫자로도 써요.'
  es.a1.unit02.lesson01.teach.uno:
    title: 일
    gloss: 일
    note: '*Uno*는 남성 단수 명사 앞에서는 *un*으로 줄고(*un huevo*, 달걀 한 개), 여성 명사 앞에서는 *una*가 돼요(*una taza*, 컵 한 개). 숫자를 셀 때처럼 혼자 쓰일 때는 *uno* 그대로예요.'
  es.a1.unit02.lesson01.teach.dos:
    title: 이
    gloss: 이
    note: '*Dos*는 명사의 성에 상관없이 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.tres:
    title: 삼
    gloss: 삼
    note: '*Tres*도 *dos*처럼 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: 사
    gloss: 사
    note: '*Cuatro*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.cinco:
    title: 오
    gloss: 오
    note: '*Cinco*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.seis:
    title: 육
    gloss: 육
    note: '*Seis*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.siete:
    title: 칠
    gloss: 칠
    note: '*Siete*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.ocho:
    title: 팔
    gloss: 팔
    note: '*Ocho*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.nueve:
    title: 구
    gloss: 구
    note: '*Nueve*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson01.teach.diez:
    title: 십
    gloss: 십
    note: '*Diez*는 형태가 변하지 않아요.'
  es.a1.unit02.lesson02.teach.once:
    title: 십일
    gloss: 십일
    note: '*Once*부터 *quince*(11~15)까지는 각각 한 단어라서 묶어서 외워 두세요. 16부터 19까지는 *diez*를 바탕으로 만들어요(*dieciséis*, *diecisiete*...).'
  es.a1.unit02.lesson02.teach.doce:
    title: 십이
    gloss: 십이
    note: '*Doce*는 한 단어예요. *dos*와 비슷해 보이지만 따로 쓰는 고유한 형태예요.'
  es.a1.unit02.lesson02.teach.trece:
    title: 십삼
    gloss: 십삼
    note: '*Trece*는 한 단어예요. *tres*와 비슷해 보이지만 따로 쓰는 고유한 형태예요.'
  es.a1.unit02.lesson02.teach.catorce:
    title: 십사
    gloss: 십사
    note: '*Catorce*는 한 단어예요. *cuatro*와 비슷해 보이지만 따로 쓰는 고유한 형태예요.'
  es.a1.unit02.lesson02.teach.quince:
    title: 십오
    gloss: 십오
    note: '*Quince*는 16부터 규칙이 바뀌기 전, 한 단어로 된 십대 숫자의 마지막이에요.'
  es.a1.unit02.lesson02.teach.veinte:
    title: 이십
    gloss: 이십
    note: '*Veinte*는 독립된 단어예요. *veintiuno*(21)부터 29까지는 십의 자리와 일의 자리가 한 단어로 붙어 쓰이며, 이 패턴은 lesson03의 *veintiocho*에서 다시 나와요.'
  es.a1.unit02.lesson02.teach.treinta:
    title: 삼십
    gloss: 삼십
    note: 30부터는 20대처럼 붙이지 않고, 십의 자리와 일의 자리를 *y*('그리고')로 이어 세 단어로 띄어 써요.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: 삼십사
    gloss: 삼십사
    note: '*Treinta y cuatro*는 십의 자리, *y*, 일의 자리, 이렇게 세 단어로 띄어 써요.'
  es.a1.unit02.lesson02.teach.cien:
    title: 백
    gloss: 백
    note: '*Cien*은 딱 100일 때 단독으로 쓰는 형태예요. 100을 넘어 숫자가 이어질 때는 *ciento*를 써요(*ciento uno*, 101). 이 단원에서는 아직 배우지 않아요.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: 친근하게 나이 묻기
    gloss: 몇 살이에요?
    note: 스페인어는 글자 그대로 '몇 해를 가지고 있나요?'라고 물어요. *ser*나 *estar*가 아니라 *tener*(가지다)를 써요.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: 나이 말하기
    gloss: 스물여덟 살이에요.
    note: '*Tengo*는 *tener*의 1인칭 단수형이에요. 완전한 대답에는 보통 *años*(해, 살)가 들어가지만, 나이가 이미 화제일 때는 *Tengo treinta y uno*처럼 생략할 수 있어요.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: 격식 있게 나이 묻기
    gloss: 몇 살이에요?
    note: '*Tiene*는 *tener*의 *usted* 형태로, 1단원에서 나온 격식 있는 말투와 맞아요.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: 두 단어로 된 나이 말하기
    gloss: 서른한 살이에요.
    note: 이 대답에서는 뒤에 명사가 바로 오지 않으므로 *treinta y uno*에서 *un*이 아니라 *uno*를 그대로 써요.
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: 나이 질문 되묻기
    gloss: 그럼 당신은 몇 살이에요?
    note: 화제가 이미 정해졌다면 *años*를 반복하지 않고 *Tienes*만 쓰는 것이 자연스럽고 흔한 줄임 표현이에요.
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: 전화번호 묻기
    gloss: 전화번호가 뭐예요?
    note: 전화번호처럼 여러 가능성 중에서 특정한 하나를 고르거나 말해 달라고 할 때는 *qué*보다 *cuál*이 자연스러워요.
  es.a1.unit02.lesson04.teach.numero_elena:
    title: 한 자리씩 읽는 숫자
    gloss: 육, 일, 오, 공, 이, 구, 칠, 삼
    note: 전화번호는 여기처럼 한 자리씩 읽을 수 있어요. 숫자를 두 개씩 묶어 읽는 스페인어 화자도 많으니 두 가지 방식을 모두 들어 보세요.
  es.a1.unit02.lesson04.teach.es_el:
    title: 번호를 말하기 시작할 때
    gloss: …예요.
    note: '*número*가 남성 명사라서 남성 정관사 *El*을 써요.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: 다시 말해 달라고 부탁할 때
    gloss: 다시 말해 줄 수 있어요?
    note: '*Puedes*는 *poder*(~할 수 있다)의 *tú* 형태예요. 상대가 말한 숫자를 놓쳤을 때 유용해요.'
  es.a1.unit02.lesson04.teach.claro:
    title: 흔쾌히 승낙할 때
    gloss: 물론이죠; 그럼요
    note: '*Claro*는 부탁에 흔쾌히 응할 때 흔히 쓰는 친근한 표현이에요.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: 필요한 수량 말하기
    gloss: 달걀 세 개가 필요해요.
    note: '*Necesito*는 *necesitar*(필요하다)의 yo 형태예요. *Huevos*(달걀)는 2 이상의 수 뒤에서도 항상 복수형이에요.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: 몇 개가 필요한지 묻기
    gloss: 달걀이 몇 개 필요해요?
    note: '*Cuántos*는 묻는 명사의 성과 수에 맞춰요. *huevos*는 남성 복수이므로 *cuántas*가 아니라 *cuántos*를 써요.'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: 계량한 양 말하기
    gloss: 밀가루 두 컵
    note: '*De*는 계량 단위(*tazas*, 컵)와 재는 대상(*harina*, 밀가루)을 이어 줘요.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: 절반의 양 말하기
    gloss: 설탕 반 컵
    note: '*Media*는 여성 명사 *taza*에 맞춘 형태예요. 남성 명사에는 남성형 *medio*를 써요.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: 가지고 있는 것 말하기
    gloss: 탁자 위에 달걀 네 개가 있어요.
    note: '*Tengo*(나는 가지고 있다)는 이미 있는 것을 말하고, *necesito*(나는 필요하다)는 아직 부족한 것을 말해요.'
  es.a1.unit02.lesson06.teach.line01:
    title: 달걀이 몇 개인지 묻기
    gloss: 엘레나가 마테오에게 레시피에 달걀이 몇 개 필요한지 물어요.
    note: 앞 단원에 이어 두 친구 사이에서 *tú* 말투를 써요.
  es.a1.unit02.lesson06.teach.line02:
    title: 재료 말하기
    gloss: 마테오가 달걀 세 개와 밀가루 두 컵이 필요하다고 말해요.
    note: '*Necesito*는 레시피에 아직 필요한 것을 말해요.'
  es.a1.unit02.lesson06.teach.line03:
    title: 가진 것을 알려 주기
    gloss: 엘레나가 탁자 위에 달걀 네 개가 있다고 말하고, 설탕도 필요한지 물어요.
    note: '*Tengo*는 엘레나가 이미 가지고 있는 것을 말해요. 마테오가 필요하다고 한 것과는 별개예요.'
  es.a1.unit02.lesson06.teach.line04:
    title: 적은 양 확인하기
    gloss: 마테오가 조금 필요하다고 말해요. 반 컵 정도요.
    note: 여기서 *Como*는 "~처럼"이나 "~로서"라는 흔한 뜻이 아니라 "대략", "약"이라는 뜻이에요.
  es.a1.unit02.lesson06.teach.line05:
    title: 전화번호 묻기
    gloss: 엘레나가 좋다고 말한 뒤, 다음 수업 때문에 문자를 보내려고 마테오의 전화번호를 물어요.
    note: '*Así te escribo*("그래야 너에게 문자를 보낼 수 있어")는 질문하는 이유를 설명해요. 연락처를 물어보기 전에 이유를 덧붙이는 자연스러운 말버릇이에요.'
  es.a1.unit02.lesson06.teach.line06:
    title: 전화번호 말해 주기
    gloss: 마테오가 자기 번호를 한 자리씩 읽어 줘요.
    note: '*Es el*로 번호를 말하기 시작해요. 남성 명사 *número*에 맞춘 형태예요.'
  es.a1.unit02.lesson06.teach.line07:
    title: 고마움을 전하고 나이 묻기
    gloss: 엘레나가 고맙다고 말한 뒤, 질문을 하나 더 해요. 몇 살이냐고요.
    note: '*Una pregunta más*("질문 하나 더")는 같은 대화 안에서 화제를 자연스럽게 바꿀 때 써요.'
  es.a1.unit02.lesson06.teach.line08:
    title: 자기 나이 말하기
    gloss: 마테오가 스물여덟 살이라고 답하고, 엘레나에게 같은 질문을 해요.
    note: '*Tengo veintiocho años*에서는 20대 숫자를 한 단어로 붙여 써요.'
  es.a1.unit02.lesson06.teach.line09:
    title: 상대의 나이 말하기
    gloss: 엘레나가 서른한 살이라고 말해요.
    note: '*Tengo treinta y uno*에서는 나이 이야기라는 것이 이미 분명해서 *años*를 생략해요. 같은 질문을 되돌려 줄 때도 *años*를 반복하지 않아요.'
