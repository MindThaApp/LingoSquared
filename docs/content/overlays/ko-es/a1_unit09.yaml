  es.a1.unit09.lesson05.leer_las_direcciones:
    title: 글로 된 길 안내 읽기
  es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue:
    title: Elena가 Mateo에게 길을 설명해요
teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: 거리
    gloss: 거리
    note: '*Calle*는 여성명사예요.'
    example_gloss: 저는 이 거리에 살아요.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: 모퉁이
    gloss: 모퉁이
    note: '*Esquina*는 여성명사예요.'
    example_gloss: 은행은 모퉁이에 있어요.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: 곧장 가요
    gloss: 곧장 가세요.
    note: '*Sigue*는 *seguir*(따라가다, 계속하다)의 반말 명령형이에요. 이 단원의 길 안내에서 계속 쓰여요.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: 왼쪽으로 돌아요
    gloss: 왼쪽으로 도세요.
    note: '*Dobla*는 *doblar*(돌다, 접다)의 반말 명령형이에요. *doblar*와 *girar*의 차이는 다음 문법 설명을 보세요.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: 오른쪽으로 돌아요
    gloss: 오른쪽으로 도세요.
    note: '*Gira*는 *girar*(돌다, 회전하다)의 반말 명령형이고, *doblar*와 완전히 바꿔 쓸 수 있어요.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: 길을 건너요
    gloss: 길을 건너.
    note: '*Cruza*는 *cruzar*(건너다)의 반말 명령형이에요.'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar와 girar의 차이
    gloss: '"돌다"를 뜻하는, 똑같이 자연스러운 두 단어예요.'
    note: 카드의 본문을 보세요.
    target_text: '*Doblar*와 *girar*는 둘 다 "돌다"라는 뜻이고, 여기서는 완전히 바꿔 쓸 수 있어요. 지역에 따른 선호일 뿐, 격식이나 의미의 차이는 아니에요. 이 단원에서는 둘 다 쓰여요.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: 어딘가 가는 방법 묻기
    gloss: 도서관에 어떻게 가요?
    note: '*Cómo llego a*(~에 어떻게 가요)는 특정 장소로 가는 길을 물을 때 쓰는 기본 표현이에요.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: 쉽다고 말하기
    gloss: 쉬워요.
    note: 길을 알려 주기 전에 안심시키려고 흔히 하는 말이에요.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: 이 길을 따라 곧장 가요
    gloss: 이 길을 따라 곧장 가세요.
    note: '*Por esta calle*(이 길을 따라)는 어느 길을 따라가야 하는지 알려 줘요.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: 모퉁이에서 왼쪽으로 돌아요
    gloss: 모퉁이에서 왼쪽으로 도세요.
    note: '*En la esquina*(모퉁이에서)는 어디에서 도는지 말해 줘요.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: 확인 요청하기
    gloss: 이렇게 맞아요?
    note: '*¿Está bien así?*(이렇게 괜찮아요?)는 들은 길 안내를 다시 말한 뒤 제대로 이해했는지 확인하는 표현으로, 길을 들은 다음 자연스럽게 이어지는 말이에요.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: 확인해 주기
    gloss: 네, 맞아요.
    note: '*Así es*(그렇게 돼요, 맞아요)는 짧고 자연스러운 확인의 말이에요.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: 길 잃지 마요
    gloss: 길 잃지 마세요!
    note: '*No te pierdas*는 *perderse*(길을 잃다)의 반말 부정 명령형으로, 다정하고 편하게 배웅할 때 하는 말이에요.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: 글로 된 길 안내 읽기
    gloss: '시장에서 도서관까지 가려면: 이 길을 따라 곧장 가세요. 모퉁이에서 왼쪽으로 도세요. 그다음 길을 건너세요. 도서관은 오른쪽에 있어요.'
    note: 글로 된 길 안내는 단계를 순서대로 나열해요. *Para llegar a...*(~에 가려면...)가 목적지를 알려 주고, 각 단계는 *tú* 명령형(*sigue*, *dobla*, *cruza*)으로 쓰며, *después*(그다음)가 단계들을 이어 줘요.
    glosses:
      llegar: 도착하다
      biblioteca: 도서관
      desde: ~에서
      mercado: 시장
      sigue: 계속 가세요
      derecho: 곧장
      calle: 거리
      Dobla: 도세요
      izquierda: 왼쪽
      esquina: 모퉁이
      Después: 그다음에
      cruza: 건너세요
      está: ~에 있다 (위치)
      derecha: 오른쪽
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (~에서)
    gloss: desde가 길의 출발점을 나타내는 방식이에요.
    note: 카드의 본문을 보세요.
    target_text: '*Desde*(~에서)는 길의 출발점을 나타내고, 도착지를 나타내는 *a*(~로)와 짝을 이뤄요 -- *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: 길 물어보기
    gloss: Mateo가 Elena에게 시장에서 도서관까지 어떻게 가는지 물어봐요.
    note: '이 단원 앞에서 나온 *¿Cómo llego a...?* 질문인데, 이번에는 출발점이 있어요: *desde el mercado*(시장에서).'
  es.a1.unit09.lesson06.teach.line02:
    title: 첫 번째 안내하기
    gloss: Elena가 쉽다고 말하고 첫 번째 안내를 해 줘요.
    note: '*Es fácil*(쉬워요)은 첫 번째 단계를 알려 주기 전에 안심시켜 주는 말이에요.'
  es.a1.unit09.lesson06.teach.line03:
    title: 다시 말하고 더 물어보기
    gloss: Mateo가 안내를 다시 말한 뒤 그다음은 무엇인지 물어봐요.
    note: '*Sigo derecho*(저는 곧장 가요)는 *seguir*의 1인칭 활용형으로, Mateo가 따라가면서 적극적으로 확인하고 있음을 보여 줘요.'
  es.a1.unit09.lesson06.teach.line04:
    title: 두 번째 안내하기
    gloss: Elena가 모퉁이에서 왼쪽으로 돌라고 말해요.
    note: '*Dobla*(돌아요) -- 여기서는 *gira*도 같은 뜻이에요.'
  es.a1.unit09.lesson06.teach.line05:
    title: 다시 말하고 확인하기
    gloss: Mateo가 방향을 다시 말하고 맞는지 물어봐요.
    note: '*Doblo*(저는 돌아요)는 앞의 *Sigo derecho*와 마찬가지로, Mateo가 각 단계를 *yo* 형태로 다시 말하며 확인하는 거예요.'
  es.a1.unit09.lesson06.teach.line06:
    title: 확인해 주고 마지막 안내하기
    gloss: Elena가 맞다고 확인한 뒤, 길을 건너면 도서관이 오른쪽에 있다고 알려 줘요.
    note: '*Sí, así es* (네, 맞아요)는 확인해 주는 말이고, *después* (그다음에)는 길의 마지막 단계를 이끌어요.'
  es.a1.unit09.lesson06.teach.line07:
    title: 엘레나에게 감사하기
    gloss: 마테오가 엘레나에게 진심으로 감사해요.
    note: '*Muchas gracias* (정말 고마워요)는 간단한 *gracias*보다 더 따뜻한 표현이에요.'
  es.a1.unit09.lesson06.teach.line08:
    title: 대답하고 배웅하기
    gloss: 엘레나가 천만에요라고 말하고 길을 잃지 말라고 해요.
    note: '*De nada* (천만에요)는 *gracias*에 대한 기본적인 대답이에요.'
