teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: 입장권
    gloss: 입장권
    note: '*El billete*는 남성명사라서 *una*가 아니라 *un billete*라고 해요.'
    example_gloss: 톨레도행 표 한 장 주세요.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: 표 요청하기
    gloss: 톨레도행 표 한 장 주세요.
    note: '*Quisiera*("~하고 싶습니다")는 요청을 부드럽게 만들어 주며 *quiero*보다 더 공손해요.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: 직원이 표 종류를 물어봐요
    gloss: 편도로 드릴까요, 왕복으로 드릴까요?
    note: '*Quiere*는 *querer*의 격식 있는 *usted* 형태로, 낯선 역 직원에게 쓰는 말이에요.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: 공손하게 대답하기
    gloss: 왕복으로 주세요.
    note: '*Por favor*는 "부탁합니다"라는 뜻으로, 요청을 짧고 공손하게 만들어 줘요.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: 창구에서 쓰는 말투
    gloss: 창구에서는 보통 공손한 표현인 usted를 써요.
    note: 서비스 업무를 하는 낯선 사람에게는 *tú*가 아니라 *usted*를 써요.
  es.a1.unit51.lesson02.teach.el_anden:
    title: 승강장
    gloss: 승강장
    note: '*El andén*은 남성명사예요: *un andén*, *el andén*.'
    example_gloss: 톨레도행 기차는 몇 번 승강장에서 출발해요?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: 승강장 묻기
    gloss: 톨레도행 기차는 몇 번 승강장에서 출발해요?
    note: '*¿De qué andén ...?*은 일반적인 장소가 아니라 승강장을 콕 집어 묻는 표현이에요.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: 출발 정보 말하기
    gloss: 기차는 10시 15분 전에 5번 승강장에서 출발해요.
    note: '*Las diez menos cuarto*는 시간 수업에서 배운 "~분 전" 표현 방식을 다시 쓴 거예요.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: 도착 시각 묻기
    gloss: 기차는 몇 시에 도착해요?
    note: '*¿A qué hora llega ...?*는 도착 시각을 묻는 표현이에요. *llegar*는 규칙 동사이고 시각 앞에 *a las*를 써요.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: 도착 시각 말하기
    gloss: 기차는 11시에 도착해요.
    note: '*Llega a las once*는 *llegar*(도착하다)와 시각 앞의 *a las*를 써요.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: 제시간에 / 연착
    gloss: 제시간에; 연착
    note: '*A tiempo*는 예정대로 일어나는 일을 말하는 고정 표현이에요. *El retraso*(연착)는 남성명사예요.'
    example_gloss:
    - 기차가 제시간에 출발하지 않아요.
    - 안내 말씀드립니다. 톨레도행 기차가 연착되고 있습니다.
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: 안내 방송
    gloss: 안내 말씀드립니다. 톨레도행 기차가 연착되고 있습니다.
    note: '*Atención*은 "승객 여러분께 알려드립니다"처럼 역 안내 방송을 시작하는 말이에요.'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: '"제시간에" 부정하기'
    gloss: 기차가 제시간에 출발하지 않아요.
    note: '*No*는 동사 바로 앞에 놓여 문장 전체를 부정해요: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: 승강장 변경
    gloss: 기차는 5번 승강장이 아니라 3번 승강장에서 출발해요.
    note: '*En lugar de*는 "~ 대신에"라는 뜻이에요.'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: 연착 시간 말하기
    gloss: 기차가 10분 연착되고 있어요.
    note: '*Lleva retraso*(직역하면 "연착을 지니고 있다")는 연착됐다고 말하는 자연스러운 표현이에요.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: 입구, 출구, 대합실
    gloss: 입구; 출구; 대합실
    note: '*La entrada*, *la salida*, *la sala de espera*는 모두 여성명사예요.'
    example_gloss:
    - 입구가 어디예요?
    - 출구가 어디예요?
    - 대합실이 어디예요?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: 승강장 위치 묻기
    gloss: 7번 승강장이 어디예요?
    note: 길 찾기 수업에서 배운 *¿Dónde está ...?* 표현을 다시 쓴 거예요.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: 길 알려 주기
    gloss: 쭉 직진하신 다음 오른쪽으로 가세요.
    note: '*Todo recto*와 *a la derecha*는 길 찾기 수업에서 배운 방향 표현이고, 여기서는 역에서 다시 쓰였어요.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: 대합실 묻기
    gloss: 대합실이 어디예요?
    note: 같은 질문 표현을 새로운 장소에 적용한 거예요.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: 인쇄된 표 읽기
    gloss: '승차권: 마드리드 아토차에서 톨레도까지. 출발: 10시 10분, 7번 승강장. 도착: 11시 10분 전. 왕복. 가격: 12유로 40센트.'
    note: 출발 시각과 승강장, 도착 시각, 표의 종류, 가격을 확인해 보세요.
    glosses:
      Billete: 입장권
      Salida: 출발
      diez: 열
      andén: 승강장
      siete: 일곱
      Llegada: 도착
      once: '11'
      vuelta: 왕복 표
      Precio: 가격
      doce: '12'
      euros: 유로
      cuarenta: 마흔
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: 마테오가 계획을 말해요
    gloss: '마테오: 우리 7번 승강장으로 가야 해요. 기차는 10시 10분에 출발해요.'
    note: '*Tenemos que* + 동사원형("~해야 한다")은 현실적으로 꼭 해야 하는 일을 나타내요.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: 엘레나가 안내판을 읽어요
    gloss: '엘레나: 봐요, 저기 안내판이 있어요. 연착, 10분이래요.'
    note: '*Ahí está*("저기 있다")는 안내판을 가리키는 말이고, *el panel*은 안내 전광판이에요.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: 마테오는 침착해요
    gloss: '마테오: 괜찮아요, 커피 마실 시간은 아직 있어요.'
    note: '*No hay problema*는 가볍게 안심시킬 때 흔히 쓰는 말이에요.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: 기차가 도착해요
    gloss: '엘레나: 좋은 생각이에요. 아, 벌써 기차가 왔어요! 7번 승강장, 딱 맞네요!'
    note: '*Ya*("벌써")는 방금 연착 안내가 나온 것에 비해 기차가 예상보다 일찍 도착했다는 느낌을 줘요.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: 기차에 올라타요
    gloss: '마테오: 가요, 다들 타고 있어요! 톨레도, 출발!'
    note: '*Suben*("그들이 탄다")은 "타다"라는 뜻의 *subir*에서 왔어요. *¡Allá vamos!*는 "자, 출발!"에 해당하는 자연스러운 표현이에요.'
