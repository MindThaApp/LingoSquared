  es.a1.unit10.lesson01.teach.el_tiempo:
    title: 날씨
    gloss: 날씨
    note: '*Tiempo*는 "시간"이라는 뜻도 있어요. 두 뜻은 문맥으로 구분해요.'
    example_gloss: 오늘 날씨가 어때요?
