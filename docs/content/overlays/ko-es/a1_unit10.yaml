  es.a1.unit10.lesson01.teach.la_lluvia:
    title: 비
    gloss: 비
    note: '*Lluvia*는 여성 명사예요.'
    example_gloss: 저는 비를 좋아하지 않아요.
  es.a1.unit10.lesson01.teach.el_viento:
    title: 바람
    gloss: 바람
    note: '*Viento*는 남성 명사예요.'
    example_gloss: 오늘은 바람이 아주 많이 불어요.
  es.a1.unit10.lesson01.teach.la_nube:
    title: 구름
    gloss: 구름
    note: '*Nube*는 여성 명사예요.'
    example_gloss: 구름이 한 점도 없어요.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: 더워요
    gloss: 더워요.
    note: '*Hace calor*(직역하면 "더위를 만든다")는 더운 날씨를 말할 때 쓰는 대표적인 관용 표현이에요.'
    example_gloss: 7월에는 아주 더워요.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: 추워요
    gloss: 추워요.
    note: '*Hace frío*도 *hace calor*처럼 *hace* + 명사 형태예요.'
    example_gloss: 12월에는 추워요.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: 해가 나요
    gloss: 화창해요.
    note: '*Hace sol*은 같은 관용 표현 형태에 *el sol*(해)을 넣은 표현이에요.'
  es.a1.unit10.lesson02.teach.llueve:
    title: 비가 와요
    gloss: 비가 와요.
    note: '*Llueve*는 *llover*(비가 오다) 동사의 활용형으로, *hace* 형태와는 달라요. 뒤의 문법 설명을 참고하세요.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: 흐려요
    gloss: 흐려요.
    note: '*Está nublado*는 *estar* + 형용사 형태로, 날씨를 말하는 세 번째 표현 방식이에요.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: 세 가지 형태'
    gloss: 날씨를 말하는 세 가지 문법 형태예요.
    note: 카드의 본문을 참고하세요.
    target_text: '*hace*를 쓰는 날씨 표현(hace calor, hace frío, hace sol)은 고정된 관용 표현이에요. 글자 그대로는 "더위/추위/해를 만든다"라는 뜻이에요. *Llueve* (비가 와요)는 그 자체가 하나의 동사 형태이고, *está nublado* (흐려요)는 *estar* + 형용사를 써요. 즉 날씨를 말한다는 같은 목적에 세 가지 다른 방식이 있어요.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: 날씨 물어보기
    gloss: 오늘 날씨가 어때요?
    note: '*¿Qué tiempo hace hoy?*는 *el tiempo*(날씨)를 사용해 현재 날씨를 묻는 기본 표현이에요.'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: 덥고 맑은 날씨 말하기
    gloss: 아주 덥고 화창해요.
    note: '*hace* 표현 두 개를 *y*(그리고)로 연결한 문장이에요.'
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: 덥고 바람 부는 날씨 말하기
    gloss: 덥지만 바람이 불어요.
    note: '*Pero*(하지만)로 두 가지 날씨를 대비해요. 더위와 바람이고, *hay mucho viento*처럼 *hay* + 명사를 써요.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: 마드리드의 겨울 이야기하기
    gloss: 겨울에 마드리드는 아주 추워요.
    note: '*En invierno*(겨울에)는 계절을 나타내는 표현으로, 아래의 *en julio*와 대비돼요.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: 7월의 더위 이야기하기
    gloss: 7월에는 너무 더워요.
    note: '*Demasiado*(너무)는 단순한 *mucho*(많이)보다 *calor*를 더 강조해요.'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: 물이 필요한 이유 설명하기
    gloss: 더워서 우리는 물이 필요해요.
    note: '*Porque*(왜냐하면)로 필요와 날씨라는 이유를 연결한, 워크숍에서 실제로 쓸 만한 문장이에요.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: 일기 예보 읽기
    gloss: 오늘 7월 22일은 아주 덥고 해가 나요. 구름 한 점 없어요. 바람도 조금 불어요. 요리 워크숍에 가기 좋은 날이지만, 물을 가져가는 것이 중요해요.
    note: 요리 수업이 있는 날, 7월 22일의 짧은 일기 예보예요.
    glosses:
      Hoy: 오늘
      veintidós: 스물두 번째
      julio: 7월
      hace: ~예요 / 날씨가 ~해요 (hacer의 활용형)
      calor: 더운 날씨 / 더위
      sol: 해가 난 / 해
      hay: ~이 있어요 (haber의 활용형)
      nube: 구름
      También: 또한
      poco: 조금
      viento: 바람
      buen: 좋은
      día: 날
      ir: 가다
      taller: 워크숍
      cocina: 요리
      importante: 중요한
      llevar: 가져가다 / 들고 가다
      agua: 물
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (조금의)
    gloss: un poco de가 적은 양을 나타내는 방법이에요.
    note: 카드의 본문을 참고하세요.
    target_text: '*Un poco de* (약간의)는 음식의 양을 말할 때 쓰는데, 여기서는 약하게 부는 바람의 양을 나타내요. 같은 패턴에 새로운 명사만 쓴 거예요.'
  es.a1.unit10.lesson06.teach.line01:
    title: 더위에 대해 말하기
    gloss: 엘레나가 오늘 얼마나 더운지 말해요.
    note: '*¡Qué calor hace hoy!*(오늘 정말 덥네요!)는 *hace calor* 관용 표현을 감탄문으로 쓴 거예요.'
  es.a1.unit10.lesson06.teach.line02:
    title: 동의하고 덧붙이기
    gloss: 마테오가 맞장구치며 구름 한 점 없다고 말해요.
    note: '*hace mucho calor y hace sol*과 *no hay ni una nube*를 합친 문장이에요.'
  es.a1.unit10.lesson06.teach.line03:
    title: 물을 챙기자고 제안하기
    gloss: 엘레나가 가는 길에 마실 물이 필요하다고 말해요.
    note: '*El camino*(길)는 워크숍까지 걸어가는 길을 가리켜요.'
  es.a1.unit10.lesson06.teach.line04:
    title: 동의하고 가게 알려 주기
    gloss: 마테오가 동의하며 근처에 가게가 있다고 말해요.
    note: '*Cerca de aquí*(이 근처에)는 위치 표현 *cerca de*(~ 근처에)를 사용해요.'
  es.a1.unit10.lesson06.teach.line05:
    title: 겨울과 여름 비교하기
    gloss: 엘레나가 마드리드의 추운 겨울과 오늘 7월의 지나친 더위를 비교해요.
    note: 계절 문장 *en invierno hace mucho frío*와 *en julio hace demasiado calor*를 합친 문장이에요.
  es.a1.unit10.lesson06.teach.line06:
    title: 선호 말하기
    gloss: 마테오는 더위가 더 좋다고 해요. 런던은 거의 매일 비가 오거든요.
    note: '*Prefiero*(저는 더 좋아해요)는 새로 나온 1인칭 동사 형태이고, *casi todos los días*(거의 매일)는 빈도를 나타내는 유용한 표현이에요.'
  es.a1.unit10.lesson06.teach.line07:
    title: 동의하고 서두르기
    gloss: 엘레나가 동의하며 서둘러 가지 않으면 수업에 늦는다고 말해요.
    note: '*Es verdad*는 "맞아요"라는 뜻이에요. 여기서 *o*(또는)는 "그러지 않으면"이라는 결과를 나타내요.'
  es.a1.unit10.lesson06.teach.line08:
    title: 동의하고 출발하기
    gloss: 마테오가 엘레나의 말이 맞다고 하고 두 사람은 출발해요.
    note: '*Tienes razón*(네 말이 맞아)은 동의할 때 흔히 쓰는 표현이에요.'
