answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: 중립적인 범스페인어권 인사, 소개, 첫 만남에서 쓰는 실용적인 잡담을 배웁니다. 말투의 격식, 성·수 일치, 주어 생략, 동사 형태를 짚어 줍니다.
units:
  es.a1.unit01.greetings:
    title: 인사와 첫 만남
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: tú와 usted 고르기
  es.a1.unit01.lesson02.greetings_by_time:
    title: 하루 중 인사와 작별 인사
  es.a1.unit01.lesson03.names_and_introductions:
    title: 이름과 소개
  es.a1.unit01.lesson04.origin_and_language:
    title: 출신, 거주지, 언어
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: 함께하는 활동에서 나누는 잡담
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: 요리 워크숍에서의 첫 만남
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: 존중을 담은 '당신'
    gloss: 당신(격식, 존칭)
    note: 스페인어는 상대와의 관계에 따라 '너'나 '당신'에 해당하는 말을 달리 고릅니다. Usted는 낯선 어른을 대하거나 공손한 말투가 어울릴 때 쓰기 좋습니다. '당신'이라는 뜻이지만 동사는 él, ella와 같은 형태를 씁니다.
  es.a1.unit01.lesson01.teach.tu:
    title: 격식 없는 '너'
    gloss: 너(친근한 단수)
    note: Tú는 친구, 또래, 아이처럼 격식 없는 사이의 한 사람에게 쓰입니다. 악센트가 있는 tú는 대명사이고, 악센트가 없는 tu는 '너의'를 뜻하는 소유형입니다.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: 격식 있는 안부 질문
    gloss: 안녕하세요?
    note: Está는 estar의 usted 형태입니다. 여기서는 상대의 현재 상태를 말하므로 estar를 씁니다. Cómo는 의문사라서 악센트가 붙습니다.
  es.a1.unit01.lesson01.teach.como_estas:
    title: 격식 없는 안부 질문
    gloss: 잘 지내?
    note: Estás는 estar의 tú 형태입니다. 스페인어는 듣는 사람을 어떻게 부르느냐에 따라 está와 estás로 동사 형태가 달라집니다. 한국어에서 말투에 따라 '지내세요'와 '지내'로 달라지는 것과 비슷합니다.
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: 간단한 대답
    gloss: 잘 지내요, 고마워요.
    note: 스페인어는 주어나 동사를 반복하지 않고 bien만으로 대답할 수 있습니다.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: 긍정적인 대답
    gloss: 아주 잘 지내요, 고마워요.
    note: Muy는 bien을 강조하며 형태가 변하지 않습니다.
  es.a1.unit01.lesson01.teach.and_usted:
    title: 격식 있는 질문 되묻기
    gloss: 당신은요?
    note: 존중하는 말투로 물었다면 되물을 때도 usted를 그대로 씁니다.
  es.a1.unit01.lesson01.teach.and_tu:
    title: 격식 없는 질문 되묻기
    gloss: 너는?
    note: 격식 없는 대화에서는 tú를 씁니다. 악센트가 없는 tu는 '너의'라는 뜻이므로 악센트 표기가 중요합니다.
  es.a1.unit01.lesson02.teach.hola:
    title: 두루 쓰는 인사
    gloss: 안녕하세요; 안녕
    note: Hola는 하루 중 어느 때나, 격식 있는 만남과 격식 없는 만남 모두에서 쓸 수 있습니다.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: 아침 인사
    gloss: 좋은 아침이에요
    note: 스페인어 명사에는 문법적 성이 있습니다. Días는 남성 복수이므로 형용사도 buenos가 됩니다.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: 오후 인사
    gloss: 안녕하세요(오후 인사)
    note: Tardes는 여성 복수이므로 buenas가 일치해서 쓰입니다. buenos에서 buenas로 바뀌는 것은 문법적 일치 때문이지 공손함의 차이가 아닙니다.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: 저녁 또는 밤 인사
    gloss: 안녕하세요(저녁 인사); 안녕히 주무세요
    note: Noches는 여성 복수이므로 buenas를 씁니다. 밤에 만나 인사할 때도, 잠자리에 들기 전 헤어질 때도 쓸 수 있습니다.
  es.a1.unit01.lesson02.teach.adios:
    title: 직접적인 작별 인사
    gloss: 안녕히 가세요
    note: Adiós는 중립적인 표현이지만, '나중에 봐요'에 해당하는 표현보다 더 마지막 인사처럼 들릴 수 있습니다.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: 나중에 봐요
    gloss: 나중에 봐요
    note: Hasta luego는 관용적인 작별 인사이므로 단어 그대로 풀어서 이해할 필요는 없습니다.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: 친근한 작별 인사
    gloss: 또 봐요
    note: 직역하면 nos vemos는 '우리는 서로 본다'에 가깝습니다.
  es.a1.unit01.lesson02.teach.good_day:
    title: 공손한 마무리 인사
    gloss: 좋은 하루 보내세요.
    note: 이 공손한 인사에 쓰인 tenga는 usted 형태입니다. Buen은 día 앞에서 bueno의 남성 단수형이 짧아진 형태입니다.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: 격식 있게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: 스페인어는 이 말을 대략 '당신은 자신을 무엇이라고 부릅니까'라고 표현합니다. Se는 격식 있는 usted 형태 llama와 짝을 이룹니다. 한국어의 '성함이 어떻게 되세요?'와 '이름이 뭐야?'처럼, 스페인어도 말투에 따라 동사 형태가 달라집니다.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: 이름 말하기
    gloss: 제 이름은 Lucía예요.
    note: Me llamo는 직역하면 '나는 나를 ~라고 부른다'입니다. 동사 어미만으로 말하는 사람이 드러나므로 스페인어에서는 보통 yo를 생략합니다. 한국어에서 주어를 자주 생략하는 것과 비슷합니다.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: 격식 없이 이름 묻기
    gloss: 이름이 뭐야?
    note: Te는 격식 없는 tú와 함께 쓰이고, llamas에는 tú 어미 -as가 붙습니다. 격식 있는 se llama와 격식 없는 te llamas를 비교해 보세요.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: ser로 자기소개하기
    gloss: 저는 Diego예요.
    note: Soy는 ser의 1인칭 단수형입니다. 스페인어는 정체를 말할 때 ser를 씁니다. 일시적인 상태는 주로 estar로 나타내므로 ser와 estar는 쓰임이 나뉩니다.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: 만나서 반갑다는 인사
    gloss: 만나서 반갑습니다.
    note: Mucho gusto는 널리 통하는 고정 표현입니다. encantado, encantada 같은 형용사와 달리 말하는 사람의 성별에 따라 변하지 않습니다.
  es.a1.unit01.lesson03.teach.igualmente:
    title: 같은 마음으로 답하기
    gloss: 저도요.
    note: Igualmente는 Mucho gusto에 대한 간결한 대답입니다.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: 남자 소개하기
    gloss: 이쪽은 Carlos예요.
    note: 스페인어의 '이 사람'은 가리키는 사람이나 명사의 문법적 성에 따라 달라집니다. 남성이면 este를 씁니다.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: 여자 소개하기
    gloss: 이쪽은 Ana예요.
    note: 여성을 가리킬 때는 esta를 씁니다. 여기서 esta에는 악센트가 없습니다. 악센트가 있는 está는 estar의 한 형태로 '~이다, ~에 있다'를 뜻합니다.
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: 격식 있게 출신 묻기
    gloss: 어디에서 오셨어요?
    note: Es는 ser의 usted 형태입니다. 출신을 말할 때는 estar가 아니라 ser를 씁니다. Dónde는 직접 의문문에서 악센트가 붙습니다.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: 출신 말하기
    gloss: 저는 멕시코 출신이에요.
    note: Soy는 ser의 yo 형태입니다. soy만으로 말하는 사람이 드러나므로 주어 yo는 필요하지 않습니다.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: 격식 없이 출신 묻기
    gloss: 어디에서 왔어?
    note: Eres는 ser의 tú 형태입니다. 격식 있는 usted의 es와 격식 없는 eres를 비교해 보세요.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: 또 다른 출신 표현
    gloss: 저는 콜롬비아 출신이에요.
    note: 출신을 말할 때는 soy de 뒤에 장소를 붙입니다.
  es.a1.unit01.lesson04.teach.live_london:
    title: 사는 곳 말하기
    gloss: 저는 런던에 살아요.
    note: Vivo는 vivir의 yo 형태입니다. 어미 -o로 말하는 사람이 드러나므로 스페인어에서는 yo가 필요하지 않습니다.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: 격식 있게 스페인어 구사 여부 묻기
    gloss: 스페인어를 하세요?
    note: 스페인어는 이런 예/아니요 질문을 만들 때 별도의 조동사를 쓰지 않습니다. Habla는 usted 형태이고, 억양과 물음표로 질문임을 나타냅니다.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: 제한적인 실력
    gloss: 네, 조금요.
    note: 악센트가 있는 Sí는 '네'라는 뜻이고, 악센트가 없는 Si는 '만약'이라는 뜻입니다. 다만 여기서는 A1 단계의 입력 허용 범위로 악센트 없는 표기도 인정합니다.
  es.a1.unit01.lesson04.teach.still_learning:
    title: 진행 중인 상황 설명하기
    gloss: 저는 아직 배우는 중이에요.
    note: Estoy는 estar의 yo 형태입니다. 여기서는 estar가 진행 중인 활동을 나타내고, Soy de Colombia의 soy는 출신이나 정체를 나타냅니다. 스페인어는 이 둘을 서로 다른 동사로 구분합니다.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: 격식 있게 첫 방문인지 묻기
    gloss: 여기는 처음이세요?
    note: Su는 usted로 부르는 상대에게 쓰는 '당신의'입니다. 스페인어는 su와 tu의 선택으로 격식 있는 관계인지 격식 없는 관계인지를 나타냅니다. 한국어에서 높임 표현으로 관계를 드러내는 것과 비슷합니다.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: 격식 없이 첫 방문인지 묻기
    gloss: 여기는 처음이야?
    note: 악센트가 없는 tu는 격식 없는 소유형 '너의'입니다. 악센트가 있는 대명사 tú와 비교해 보세요.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: 첫 방문임을 확인하기
    gloss: 네, 처음이에요.
    note: Primera는 vez에 일치하므로 여성형입니다. 스페인어 형용사는 명사의 성에 따라 형태가 달라집니다.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: 가는 곳 말하기
    gloss: 요리 워크숍 때문에 왔어요.
    note: Vengo는 venir의 yo 형태로 '온다, 오는 중이다'라는 뜻입니다. Al은 a와 el이 반드시 줄어든 형태입니다.
  es.a1.unit01.lesson05.teach.me_too:
    title: 같은 상황 공유하기
    gloss: 저도요.
    note: Yo también은 상대방이 한 말이 나에게도 해당될 때 유용합니다.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: 관심사 묻기
    gloss: 요리하는 것을 좋아해요?
    note: Gustar는 우리말 어순과 다르게 쓰입니다. Te는 좋아하는 감정을 느끼는 사람을 나타내고, cocinar는 마음에 드는 대상입니다. 활동은 단수로 취급되므로 동사는 gusta로 유지됩니다.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: 강한 관심 표현하기
    gloss: 네, 아주 많이요.
    note: Mucho는 정도를 묻는 질문에 대한 대답이며, 여기서는 형태가 바뀌지 않아요.
  es.a1.unit01.lesson05.teach.thats_good:
    title: 긍정적인 반응
    gloss: 정말 잘됐네요.
    note: Qué는 이 감탄문에서 악센트가 있어요. 질문을 하는 것이 아니라 긍정적인 반응을 이끌어요.
  es.a1.unit01.lesson06.teach.line01:
    title: 만남의 시작
    gloss: 엘레나가 마테오에게 인사하며 여기 처음 왔는지 물어요.
    note: 두 사람은 같은 활동에 참여하는 동등한 사이라서 둘 다 친근한 tú 형태를 써요.
  es.a1.unit01.lesson06.teach.line02:
    title: 만남의 시작, 대답
    gloss: 마테오는 네, 처음이라고 말하고 요리 워크숍에 왔다고 설명해요.
    note: Vengo al taller는 여기 온 이유를 말하며, 지금 이어지는 상황에 현재 시제를 써요.
  es.a1.unit01.lesson06.teach.line03:
    title: 이름 주고받기
    gloss: 엘레나도 처음이라고 동의하며 자기 이름을 말하고 마테오의 이름을 물어요.
    note: Me llamo는 이름을 말하는 자연스러운 표현이에요. 스페인어는 동사 형태만으로 말하는 사람을 알 수 있어서 보통 yo를 생략해요. 한국어에서 '저는'을 자주 생략하는 것과 비슷해요.
  es.a1.unit01.lesson06.teach.line04:
    title: 이름 주고받기, 대답
    gloss: 마테오는 자기 이름을 말하고 만나서 반갑다고 해요.
    note: Soy는 이름을 말하는 또 다른 자연스러운 방법으로, 재귀동사 llamarse 대신 ser를 써요.
  es.a1.unit01.lesson06.teach.line05:
    title: 출신 묻기
    gloss: 엘레나는 인사에 같은 말로 답하고(저도요) 마테오가 어디 출신인지 물어요.
    note: De dónde eres는 친근한 tú 형태로 출신을 물어요.
  es.a1.unit01.lesson06.teach.line06:
    title: 출신 묻기, 대답
    gloss: 마테오는 콜롬비아 출신이지만 런던에 산다고 말하고, 엘레나에게 같은 질문을 해요.
    note: Soy de는 출신을, vivo en은 현재 사는 곳을 나타내요. Pero는 이 두 사실의 대조를 이어 줘요.
  es.a1.unit01.lesson06.teach.line07:
    title: 관심사 이야기하기
    gloss: 엘레나는 스페인 출신이라고 말하고 마테오에게 요리를 좋아하는지 물어요.
    note: Soy는 마테오가 방금 쓴 것과 같은 패턴으로 출신을 말해요.
  es.a1.unit01.lesson06.teach.line08:
