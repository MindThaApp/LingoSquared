teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: 전화하다
    gloss: 전화하다
    note: 전화를 거는 동사의 원형이에요.
    example_gloss: 너에게 전화해야 해요.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: 전화하겠다고 말하기
    gloss: 제가 전화할게요.
    note: '*Llamo*는 *llamar*의 *yo* 형태예요. *te*와 함께 쓰면 직역하면 "너에게 전화한다"는 뜻이에요. 스페인어는 가까운 미래의 일도 이렇게 현재형으로 말할 수 있어요.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: 전화 받기
    gloss: 여보세요, 엘레나예요.
    note: 스페인어는 전화에서 *soy* + 이름(직역하면 "저는 ~이에요")으로 자신이 누구인지 밝혀요.
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: 마테오도 같은 방식으로 받아요
    gloss: 여보세요, 마테오예요.
    note: '*Hola, soy Elena*와 같은 *soy* + 이름 패턴이에요.'
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: 누가 전화했는지 묻기
    gloss: 누구세요?
    note: '*¿Con quién hablo?*는 누가 전화했는지 모를 때 쓰는 표준 표현이에요.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: 격식 있게 자신을 밝히기
    gloss: 엘레나입니다.
    note: '*Habla con* + 이름은 *hablar*의 존칭 *usted* 형태를 써요. *soy* + 이름의 공손한 표현이에요.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: 다시 말해 달라고 부탁하기
    gloss: 다시 말해 줄 수 있어요?
    note: '*¿Puedes...?*(~해 줄 수 있어요?) + *repetir*(반복하다) + *eso*(그것)예요.'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: 천천히 말해 달라고 부탁하기
    gloss: 너무 빨리 말하지 말아 주세요.
    note: '*No hables*는 *hablar*의 친근한 부정 명령형이에요. *tan rápido*(그렇게 빨리)는 정도를 나타내요.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: 잘 안 들린다고 말하기
    gloss: 잘 안 들려요.
    note: '*Oír*(듣다)에 *no ... bien*(잘 ~않다)을 쓰면 소리가 잘 안 들린다는 뜻이에요. *entender*(이해하다)와는 달라요. *te oigo*는 "네 말이 들려요"라는 뜻이에요.'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: 문자 메시지
    gloss: 문자 메시지
    note: 남성 명사로 *el mensaje*라고 해요. *el SMS*나 *el texto*라고도 하지만 *mensaje*가 가장 무난해요.
    example_gloss: 문자 메시지는 엘레나가 보낸 거예요.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: 문자 보내겠다고 말하기
    gloss: 문자 보낼게요.
    note: '*Enviar*(보내다)는 "너에게"를 뜻하는 대명사 *te* 뒤에 와요: *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게요.
    note: '*Más tarde*(나중에)는 문장 끝에 와요: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: 문자 대화 읽기
    gloss: '마테오: 안녕 엘레나, 전화해 줄 수 있어? 할 말이 있어. 엘레나: 응, 물론이지. 5분 뒤에 다시 전화할게.'
    note: 마테오가 무엇을 부탁하는지, 왜 그런지, 엘레나가 언제 다시 전화한다고 하는지 살펴보세요.
    glosses:
      Hola: 안녕
      puedes: ~할 수 있다
      llamarme: 전화하다
      Tengo: ~해야 하다
      algo: 무언가
      contarte: 말해 주다
      claro: 물론
      llamada: 전화하다
      cinco: 다섯
      minutos: 분
      devuelvo: 다시 (전화) 걸다
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: 마테오가 전화를 받아요
    gloss: '마테오: 여보세요, 마테오예요.'
    note: 첫 수업에서 배운 *soy* + 이름 표현을 이번에는 실제 전화 통화에서 써요. 전화를 받는 사람이 먼저 말하고 자기 이름을 밝혀요.
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: 엘레나가 자기를 소개해요
    gloss: '엘레나: 안녕, 마테오. 나 엘레나야. 마테오: 전화해 줘서 고마워요!'
    note: '*Gracias por llamar*(전화해 주셔서 감사해요)는 *gracias por* + 동사원형 구조예요.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: 엘레나가 근무에 대해 물어요
    gloss: '엘레나: 첫 근무는 어땠어?'
    note: '*Ha ido*는 *ir*의 현재완료형이에요(여기서는 "~하게 되다, 진행되다"라는 뜻). *ha* + 과거분사 *ido*로 이루어져요.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: 마테오가 좋은 소식을 전해요
    gloss: '마테오: 아주 잘 됐어요. 기대한 것보다 더 좋았어요.'
    note: '*Ha ido muy bien*은 질문에 나온 현재완료를 그대로 다시 써요. *mejor de lo esperado*(기대보다 더 좋게)는 *de lo*로 비교해요.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado를 동사원형과 함께 살펴봐요
    gloss: ha ido → ir(가다), es → ser(~이다), esperado → esperar(기대하다)
    note: '*Ha ido*, *es*, *esperado*의 동사원형은 각각 *ir*, *ser*, *esperar*예요. 지금은 *ha ido muy bien*을 하나의 굳어진 표현으로 알아 두세요. 현재완료는 나중에 제대로 연습해요.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: 엘레나가 자랑스러워해요
    gloss: '엘레나: 그런 말을 들으니 정말 기뻐! 네가 자랑스러워.'
    note: '*Orgulloso/a de*(~이 자랑스러운)는 *de*와 함께 쓰는 굳어진 표현이에요. 형용사는 말하는 사람에 맞춰 바뀌어요(엘레나는 여성이라 *orgullosa*).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: 마테오가 감동해요
    gloss: '마테오: 정말 고마워요. 저한테 큰 의미가 있어요.'
    note: '*Significa*는 *significar*(의미하다)의 3인칭 형태예요. *para mí*(나에게)는 누구에게 중요한지를 나타내요.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: 그의
    gloss: 그의 첫 근무는 아주 잘 됐어요.
    note: 여기서 *Su*는 "그의"라는 소유 표현이에요(*usted*와 쓰면 "당신의", 여성이면 "그녀의"도 돼요). 누구의 것인지는 문맥으로 알 수 있어요.
