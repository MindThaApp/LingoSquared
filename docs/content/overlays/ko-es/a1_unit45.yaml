teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: 전체 가격 묻기
    gloss: 합쳐서 얼마예요?
    note: '*En total*은 물건 하나의 가격이 아니라 전부 합친 가격을 알고 싶다는 뜻을 분명히 해 줘요.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: 전체 가격 말하기
    gloss: 합쳐서 25유로예요.
    note: '*Cuesta*는 *costar*(값이 나가다)의 3인칭 단수형이에요. 강세가 올 때 어간의 모음이 *o*에서 *ue*로 바뀌어요.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: 카드나 현금으로 계산하기
    gloss: 카드로 계산하다, 현금으로 계산하다
    note: '*Pagar con tarjeta*(카드로 계산하다)와 *pagar en efectivo*(현금으로 계산하다)는 전치사가 달라요. 도구에는 *con*, 돈의 형태에는 *en*을 써요.'
    example_gloss:
    - 여기서 카드로 계산할 수 있나요?
    - 현금으로 계산할게요.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: 카드 결제가 되는지 묻기
    gloss: 여기서 카드로 계산할 수 있나요?
    note: '*Puedo*(할 수 있다)는 *poder*의 *yo* 형태이고, *aquí*(여기)는 지금 있는 장소에 대해 묻는다는 것을 나타내요.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: 결제 방법 묻기
    gloss: 현금으로 계산하시겠어요, 카드로 계산하시겠어요?
    note: '*Quiere*는 *querer*의 높임말 *usted* 형태로, 낯선 계산원이 쓰는 말이에요. 친구에게는 *¿quieres pagar...?*라고 말해요.'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: 계산서
    gloss: 계산서
    note: '여성 명사예요: *la cuenta*. 식당에서는 계산서, 은행에서는 계좌를 뜻해요.'
    example_gloss: 계산을 나눠서 낼까요?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: 계산 나누자고 제안하기
    gloss: 계산을 나눠서 낼까요?
    note: '*¿Dividimos...?*는 *nosotros* 형태를 써서 제안하는 표현으로, 한국어의 ''~할까요?''와 비슷해요.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: 따로 계산해도 되는지 묻기
    gloss: 따로 계산해도 될까요?
    note: '*Por separado*(따로)는 계산하는 방식을 나타내고, *pagar*(계산하다, 지불하다)는 이를 나타내는 일상적인 동사예요.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: 거스름돈
    gloss: 거스름돈
    note: '남성 명사예요: *el cambio*. *un cambio de planes*처럼 무엇이든 바뀌는 것(변경)을 뜻하기도 해요.'
    example_gloss: 거스름돈 여기 있습니다.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: 거스름돈 건네기
    gloss: 거스름돈 여기 있습니다.
    note: '*Su*는 높임말 *usted*에 맞는 소유 표현(''당신의'')이고, *Aquí tiene*는 무언가를 건넬 때 쓰는 일반적인 공손한 표현이에요.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: 거스름돈 사양하기
    gloss: 거스름돈은 필요 없어요.
    note: '*Necesitar*(필요하다)는 전치사 없이 목적어를 바로 받아요: *necesito cambio*. *no*는 동사를 부정해요.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: '35'
    gloss: 서른다섯
    note: '*Treinta y cinco*(서른다섯): 스페인어는 31부터 99까지 십의 자리와 일의 자리를 *y*로 이어 각각 띄어 써요.'
    example_gloss: 35유로예요.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: 식당 계산서 읽기
    gloss: '계산서: 메인 요리 두 개와 커피 두 잔. 총액: 35유로. 카드로 결제함.'
    note: 무엇을 주문했는지, 총액이 얼마인지, 어떻게 결제했는지 확인하세요.
    glosses:
      Cuenta: 계산서
      dos: 둘
      platos: 메인 요리
      cafés: 커피
      Total: 총액
      treinta: 서른다섯
      euros: 유로
      Pagado: 결제된
      tarjeta: 카드
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: 엘레나가 계산서를 부탁해요
    gloss: '엘레나: 계산서 달라고 할까요?'
    note: '*Pedir*(요청하다, 주문하다)는 *la cuenta*를 직접 목적어로 받아요: *pedimos la cuenta*(계산서를 부탁해요).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: 마테오가 총액을 물어요
    gloss: '마테오: 네, 좋아요. 합쳐서 얼마예요?'
    note: 앞 레슨의 질문 *¿cuánto cuesta en total?*을 다시 사용해요.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: 엘레나가 총액을 말해요
    gloss: '엘레나: 35유로예요. 나눠서 낼까요?'
    note: 금액을 말할 때는 *son*을 써요. *son treinta y cinco euros*처럼 금액이 복수이므로 복수 동사를 써요.
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: 마테오가 자기가 내겠다고 해요
    gloss: '마테오: 아니에요, 오늘은 제가 낼게요. 저를 많이 도와주셨잖아요.'
    note: '*Deja que pague yo*(제가 낼게요)는 *que* 뒤에 접속법 *pague*를 써요. 지금은 하나의 정해진 제안 표현으로 익혀 두세요. *Me has ayudado*는 현재완료로 ''나를 도와주었다''는 뜻이에요.'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: 엘레나가 감동해요
    gloss: '엘레나: 정말 친절하네요! 정말 고마워요.'
    note: '*¡Qué amable eres!*(정말 친절하네요!)는 *qué* + 형용사로 상대의 너그러운 행동에 따뜻하게 반응하는 표현이에요. *muchas gracias*는 *고맙습니다*보다 더 강한 감사 표현이에요.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: 마테오가 카드 결제를 물어요
    gloss: '마테오: 여기서 카드로 계산할 수 있나요?'
    note: 앞 레슨의 질문 *¿puedo pagar con tarjeta aquí?*를 이번에는 실제 식당에서 다시 사용해요.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: 3인칭 단수형'
    gloss: 마테오가 계산서를 계산해요.
    note: '*Paga*는 *pagar*(계산하다, 지불하다)의 3인칭 단수형이에요: *Mateo paga la cuenta*.'
