teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: 몸이 안 좋을 때
    gloss: 몸이 안 좋아요.
    note: '*Sentirse*는 재귀동사예요(*me siento*, *te sientes*). *no me siento bien*은 어딘가 평소와 다르다고 가볍게 말하는 일반적인 표현이에요.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: 아픈
    gloss: 아픈
    note: '기본 형용사로, 상태를 나타내는 *estar*와 함께 써요: *estoy enfermo*.'
    example_gloss: 저는 아파요.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: 아플 때
    gloss: 저는 아파요.
    note: '*Enfermo*는 *no me siento bien*보다 더 일반적이고 강한 상태를 나타내요. 말하는 사람의 성에 따라 형태가 바뀌어요(*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: 두통
    gloss: 두통, 머리 아픔
    note: '스페인어에서는 *dolor de cabeza*를 *tener*와 함께 관사 없이 써요: *tengo dolor de cabeza*.'
    example_gloss: 머리가 아파요.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: 머리가 아플 때
    gloss: 머리가 아파요.
    note: '증상은 *tener*(가지다)와 함께 써요: *tengo dolor de cabeza*.'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: 복통
    gloss: 복통, 배 아픔
    note: '*dolor de cabeza*처럼 관사 없이 쓰는 같은 형태예요: *dolor de estómago*.'
    example_gloss: 배가 아파요.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: 배가 아플 때
    gloss: 배가 아파요.
    note: '*dolor de cabeza*와 같은 *tener* 형태를 따라요.'
  es.a1.unit46.lesson02.teach.que_pasa:
    title: 일반적으로 묻기
    gloss: 무슨 일이에요?
    note: 무슨 문제가 있는지 두루 물어볼 때 쓰는 일반적인 표현이에요.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: 자주 쓰는 관용 표현
    gloss: 무슨 일이야?
    note: '*¿Qué te pasa?*는 무슨 문제가 있는지 묻는 자연스러운 표현이에요(직역하면 ''너에게 무슨 일이 일어나?''). 단어 하나하나 옮기지 마세요.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: 인후통
    gloss: 인후통, 목 아픔
    note: '*dolor de cabeza*, *dolor de estómago*와 같은 형태예요: *dolor de garganta*.'
    example_gloss: 목이 아파요.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: 목이 아플 때
    gloss: 목이 아파요.
    note: 다른 증상들과 같은 *tener* 형태를 따라요.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: 상대의 상태 살피기
    gloss: 괜찮아요? 아니요, 몸이 안 좋아요.
    note: '*¿Estás bien?*은 친구 사이에서 흔히 쓰는 편한 안부 질문이에요. *usted*로 부르는 상대에게는 *¿Está bien?*이 돼요.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: 열
    gloss: 열
    note: '다른 증상처럼 *tener* 뒤에 관사 없이 써요: *tengo fiebre*.'
    example_gloss: 열이 있어요.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: 열이 날 때
    gloss: 열이 있어요.
    note: '*tener* 형태를 따라요.'
  es.a1.unit46.lesson03.teach.resfriado:
    title: 감기에 걸렸을 때
    gloss: 감기에 걸린 / 감기에 걸리다
    note: '*Resfriado*는 *estar*와 함께 쓰는 형용사예요. 명사 *resfriado*를 써서 *tengo un resfriado*라고 말할 수도 있어요.'
    example_gloss: 감기에 걸렸어요.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: 감기에 걸렸다고 말하기
    gloss: 감기에 걸렸어요.
    note: 스페인어에서는 '감기에 걸렸다'를 형용사를 써서 *estoy resfriado*라고 말할 수 있어요. 이 형용사는 말하는 사람의 성에 따라 바뀌어요(*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: estar와 tener는 단어의 종류에 따라 달라요
    gloss: 'Enfermo와 resfriado는 형용사라서 estar와 함께 써요: 아파요, 감기에 걸렸어요. Fiebre와 dolor de cabeza는 명사라서 tener와 함께 써요: 열이 나요, 머리가 아파요.'
    note: '*estar*와 *tener* 중 무엇을 쓸지는 단어의 종류에 따라 정해져요. 형용사(*enfermo*, *resfriado*)는 *estar*, 증상을 나타내는 명사(*fiebre*, *dolor de cabeza*)는 *tener*와 함께 써요.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: 약국
    gloss: 약국
    note: '여성 명사예요: *la farmacia*.'
    example_gloss: 약국에 가요.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: 약사의 인사
    gloss: 무엇을 도와드릴까요?
    note: '*¿En qué puedo ayudarle?*는 격식 있는 서비스 상황에서 쓰는 표준 질문이에요. *ayudarle*에는 존칭 *usted*의 목적격 대명사 *le*가 쓰였어요.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: 증상에 맞는 약 요청하기
    gloss: 두통에 듣는 약 있어요?
    note: '*Algo para* + 증상은 약을 부탁할 때 쓰는 자연스러운 표현이에요: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: 알약 한 알
    gloss: 알약
    note: '여성 명사예요: *la pastilla*. *una pastilla*는 알약 한 알이에요.'
    example_gloss: 저는 알약 한 알을 먹어요.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: 복용 방법 안내
    gloss: 알약 한 알을 하루에 두 번 드세요.
    note: '*Toma*는 *tomar*(먹다, 복용하다)의 친근한 명령형으로, 안내할 때 써요.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: 약국에서 쓰는 말투
    gloss: 약국에서는 존칭 형태인 usted를 써요.
    note: 약사는 서비스를 제공하는, 잘 모르는 어른이므로 *usted*를 써요. *¿Tienes algo...?*가 아니라 *¿Tiene algo...?*라고 해요.
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: 약국 조언 메모 읽기
    gloss: '조언: 알약 한 알을 물과 함께 하루에 두 번 드세요. 푹 쉬고 물을 많이 마시세요. 3일이 지나도 여전히 몸이 안 좋나요? 그러면 병원에 가세요.'
    note: 복용량, 약 외의 두 가지 권고, 그리고 언제 의사를 만나야 하는지에 주목하세요.
    glosses:
      Consejo: 조언
      toma: 먹다, 복용하다
      veces: 번
      día: 날
      pastilla: 알약
      Descansa: 휴식하다
      bebe: 마시다
      sentirte: 느끼다
      sigues: 아직
      bien: 잘
      médico: 의사 / 주치의
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: 엘레나가 안부를 묻다
    gloss: '엘레나: 안녕, 마테오. 어떻게 지내? 벌써 좀 나아졌어?'
    note: '*Ya*(이미, 벌써)는 엘레나가 지난번 대화 이후 마테오가 나아졌는지 묻고 있음을 보여 줍니다. *te sientes*는 *sentirse*의 친근한 *tú* 형태입니다.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: 마테오는 아직 몸이 안 좋다
    gloss: '마테오: 아직 그리 좋지 않아. 여전히 머리가 아프고 피곤해.'
    note: '*Sigo con*(여전히 ~이 있다)은 두통이 아직 낫지 않았음을 보여 줍니다. *cansado*(피곤한)는 성에 따라 *cansada*처럼 바뀌는 새롭고 유용한 형용사입니다.'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: 엘레나가 약에 대해 묻다
    gloss: '엘레나: 약 먹었어?'
    note: '*Has tomado*는 현재완료입니다. *has* + 과거분사 *tomado*로 이루어지며, *me has ayudado*와 같은 구조입니다.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: 마테오가 대답하다
    gloss: '마테오: 응, 약 먹었어. 이제 좀 쉴 거야.'
    note: '*Voy a descansar*(나는 쉴 것이다)는 근접 미래 표현 *ir a* + 동사원형을 사용합니다.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: 엘레나가 쾌유를 빌다
    gloss: '엘레나: 좋은 생각이야. 푹 쉬어. 빨리 낫길 바랄게!'
    note: '*¡Que te mejores!*는 빠른 회복을 비는 대표적인 관용 표현이며, 접속법 *mejores*를 사용합니다.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: 마테오가 인사를 마치다
    gloss: '마테오: 고마워, 내일 봐!'
    note: '*Hasta mañana*는 *hasta luego*처럼 *hasta* + 시간 형태의 작별 인사 구조를 따릅니다.'
