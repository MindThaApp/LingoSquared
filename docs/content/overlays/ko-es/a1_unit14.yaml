  es.a1.unit14.lesson01.teach.la_sala:
    title: 거실
    gloss: 거실
    note: '*Sala*는 여성 명사예요.'
    example_gloss: 우리는 거실에서 텔레비전을 봐요.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: 부엌과 요리'
    gloss: la cocina(부엌)와 cocinar(요리하다)의 차이예요.
    note: 카드의 본문을 보세요.
    target_text: 여기서 *la cocina*는 방인 '부엌'이라는 뜻이에요. 이 이야기에서 계속 써 온 워크숍의 *cocina*/*cocinar*(요리/요리하다)와는 뜻이 달라요. 문맥으로 구분해요. *taller de cocina*에서는 요리라는 뜻이고, 집이나 아파트의 *la cocina*는 방이에요. *cocinar*는 '요리하다'라는 동사예요.
  es.a1.unit14.lesson02.teach.alquilar:
    title: 임대하다
    gloss: 임대하다
    note: '*quiero alquilar*(임대하고 싶어요)에 쓰인 동사 원형이에요.'
  es.a1.unit14.lesson02.teach.el_edificio:
    title: 건물
    gloss: 건물
    note: '*Edificio*는 남성 명사예요.'
    example_gloss: 건물은 공원 근처에 있어요.
  es.a1.unit14.lesson02.teach.desocupado:
    title: 비어 있는 / 입주 가능한
    gloss: 비어 있는 / 입주 가능한
    note: '*Desocupado*는 지금 비어 있어서 들어갈 수 있는 임대 집을 나타내요.'
  es.a1.unit14.lesson02.teach.grande:
    title: 큰
    gloss: 큰
    note: '*Grande*는 -o/-a로 끝나는 형용사와 달리 성에 따라 형태가 바뀌지 않아요.'
  es.a1.unit14.lesson02.teach.pequeno:
    title: 작은
    gloss: 작은
    note: '*Pequeño/pequeña*는 *grande*의 반대말이에요.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: 침실이 몇 개인지 묻기
    gloss: 침실이 몇 개 있어요?
    note: '*¿Cuántos...tiene?*(몇 개...있어요?)는 어떤 장소의 특징을 물을 때 쓰는 기본 표현이에요.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: 침실과 부엌 설명하기
    gloss: 침실이 두 개 있고 큰 부엌이 있어요.
    note: '*Tiene*(있어요) + 개수 + 명사 순서예요. 여기서는 *dormitorio*, *cocina*, *grande*가 쓰였어요.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: 집에 대한 목표 말하기
    gloss: 큰 부엌이 있는 아파트를 임대하고 싶어요.
    note: '*Quiero*(원해요) + 동사 원형 *alquilar*이고, *con*(~이 있는)이 원하는 특징을 이끌어요.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: 좋은 점 설명하기
    gloss: 그러면 집에서도 요리할 수 있어요.
    note: '*Así*(그러면) + *puedes*(할 수 있어요) + 동사 원형은 집 구하기라는 목표를 이야기 전체의 요리 주제와 이어 줘요.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: 아파트 광고 읽기
    gloss: 공원 근처 건물의 빈 아파트예요. 침실 두 개, 욕실, 거실, 큰 부엌이 있어요. 집에서 요리하고 싶은 분께 딱 맞아요.
    note: 실제 분류 광고와 비슷한 형식의 집 광고예요.
    glosses:
      desocupado: 비어 있는 / 입주 가능한
      edificio: 건물
      cerca: 가까운 / 근처의
      parque: 공원
      Tiene: 있다 (tener의 변화형)
      dormitorios: 침실들
      baño: 욕실
      sala: 거실
      grande: 큰
      perfecto: 완벽한
      quiere: 원하다 (querer의 변화형)
      cocinar: 요리하다
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: 관계절로 이상적인 세입자를 설명하는 방법이에요.
    note: 카드의 본문을 보세요.
    target_text: '*Para alguien que quiere*(~하고 싶어 하는 사람을 위해)는 *alguien*(누군가)에 *que*(~하는)를 붙여 관계절을 이끌어요. 이상적인 세입자를 설명하는 광고에서 흔히 쓰는 형태예요.'
  es.a1.unit14.lesson06.teach.line01:
    title: 문제와 목표 말하기
    gloss: 마테오는 자기 부엌이 아주 작아서 큰 부엌이 있는 아파트를 임대하고 싶다고 말해요.
    note: '*mi cocina es muy pequeña*(제 부엌은 아주 작아요)와 목표를 말하는 *quiero alquilar un apartamento con una cocina grande*가 합쳐진 표현이에요.'
  es.a1.unit14.lesson06.teach.line02:
    title: 광고 찾아보자고 제안하기
    gloss: 엘레나는 신문을 보자고 제안해요. 광고가 많이 있어요.
    note: '*El periódico*(신문)와 *anuncios*(광고)는 실생활 분류 광고에 나오는 새 어휘예요.'
  es.a1.unit14.lesson06.teach.line03:
    title: 광고 찾기
    gloss: 마테오는 빈 아파트가 있는 건물을 찾아요.
    note: '*Este edificio*(이 건물)와 *desocupado*(비어 있는, 입주 가능한)예요.'
  es.a1.unit14.lesson06.teach.line04:
    title: 침실에 대해 묻기
    gloss: 엘레나는 침실이 몇 개 있는지 물어요.
    note: 어떤 장소의 특징을 물을 때 쓰는 기본 질문이에요.
  es.a1.unit14.lesson06.teach.line05:
    title: 자세히 대답하기
    gloss: 마테오는 침실이 두 개 있고 큰 부엌이 있다고 말해요.
    note: '*Tiene*(있어요) + 개수 + 명사 순서예요.'
  es.a1.unit14.lesson06.teach.line06:
    title: 다른 특징 확인하기
    gloss: 엘레나는 기뻐하며 욕실과 거실도 있다고 말해요.
    note: '*Baño*(욕실)와 *sala*(거실)로 방 목록이 완성돼요. *también*(~도)은 문장 끝에 와요.'
  es.a1.unit14.lesson06.teach.line07:
    title: 전화하기로 결정하기
    gloss: 마테오는 오늘 바로 부동산에 전화하기로 해요.
    note: '*Voy a llamar*(전화할 거예요) + *hoy mismo*(바로 오늘)이에요. *La agencia*는 임대 중개 업체예요.'
  es.a1.unit14.lesson06.teach.line08:
    title: 찬성하며 마무리하기
    gloss: 엘레나는 좋은 생각이라고 하며 집에서도 요리할 수 있다고 말해요.
    note: '*Así puedes cocinar en casa también*(그러면 집에서도 요리할 수 있어요)으로 장면이 마무리돼요.'
