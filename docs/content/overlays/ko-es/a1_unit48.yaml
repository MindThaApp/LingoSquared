teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '흔한 취미 동사 세 가지: *leer*(읽다), *hacer deporte*(운동하다), *cocinar*(요리하다).'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: 여가 시간
    gloss: 시간
    note: '*El tiempo libre*는 남성 명사구이고, 취미를 이야기할 때 쓰는 핵심 표현이에요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Me gusta leer*(나는 읽는 것을 좋아해요)는 *gustar* + 동사원형 구조예요. 활동이 무엇이든 *me gusta*는 그대로예요.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 동사 세 가지 더: *escuchar música*(음악을 듣다), *dibujar*(그림을 그리다), *jugar videojuegos*(비디오 게임을 하다).'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Escuchar*는 전치사 없이 목적어를 바로 받아요: *escuchar música*. 한국어의 ''음악을 듣다''처럼 목적어를 바로 쓰는 구조예요.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Con amigos*(친구들과)는 앞 수업에서 배운 전치사 *con*을 다시 쓴 거예요.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '기본 빈도 부사 네 가지: *siempre*(항상), *a menudo*(자주), *a veces*(가끔), *nunca*(절대 ~않다). 보통 동사 앞이나 문장 맨 앞에 와요.'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Cada semana*와 *cada fin de semana*는 모두 ''매~''라는 뜻이에요. *cada*는 형태가 절대 변하지 않아요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada는 형태가 변하지 않아요
    gloss: 'Cada는 그대로예요: cada semana, cada fin de semana.'
    note: '*Cada*는 형태가 변하지 않아요. 여성 명사(*semana*) 앞에서나 남성 명사(*fin de semana*) 앞에서나 똑같아요.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena가 취미 이야기를 꺼내요
    gloss: 'Elena: 우리는 자주 함께 산책해요. 그런데 Mateo, 자유 시간에 또 뭐 해요?'
    note: '*A menudo paseamos juntos*(우리는 자주 함께 산책해요)에서 *paseamos*는 *pasear*의 *nosotros* 형태예요.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Mateo의 취미
    gloss: 'Mateo: 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*También en casa*(집에서도)는 Mateo가 식당 일뿐 아니라 즐기려고도 요리한다는 걸 보여 줘요.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena가 놀라요
    gloss: 'Elena: 집에서도 요리해요? 직장에서 하루 종일 요리하잖아요!'
    note: '*Todo el día*(하루 종일)는 Mateo가 직장에서 이미 요리를 많이 한다는 점을 강조해요.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo가 설명해요
    gloss: 'Mateo: 네, 그래도 요리는 편안하게 느껴져요. 그럼 당신은 뭘 하는 걸 좋아해요?'
    note: '*Cocinar me parece relajante*는 직역하면 ''요리하는 것이 나에게 편안해 보인다''예요. *me parece* + 형용사는 의견을 말하는 자연스러운 방법이에요.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Elena의 취미
    gloss: 'Elena: 읽는 걸 좋아하고 음악도 자주 들어요.'
    note: 앞 수업의 취미 동사 두 개를 *y*(그리고)로 한 문장에 이어 줘요.
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo가 게임에 대해 물어요
    gloss: 'Mateo: 당신도 게임해요?'
    note: 2과의 *jugar videojuegos*를 쓴 짧은 예/아니요 질문이에요. *tú también*(너도)은 비격식 *tú*를 써요.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena가 대답해요
    gloss: 'Elena: 아니요, 게임은 절대 안 해요. 하지만 가끔 그림은 그려요!'
    note: 3과의 *nunca*(절대 ~않다)와 *a veces*(가끔)를 한 대답 안에서 대비해 썼어요.
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: 취미 비교하기
    gloss: Mateo와 나는 자주 함께 산책해요. 하지만 다른 취미도 있어요. Mateo는 요리를 좋아해서 집에서도 하고, 운동도 자주 해요. 나는 읽는 걸 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만 게임은 절대 안 해요. 당신은 자유 시간에 뭘 하는 걸 좋아해요?
    note: Elena의 메시지는 앞 수업의 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      paseamos: 산책하다
      menudo: 자주
      juntos: 함께
      otras: 다른
      cocinar: 요리하다
      gusta: 즐겨
      casa: 집에서
      deporte: 운동하다
      leer: 읽다
      escucho: 듣다
      música: 음악
      dibujo: 그리다
      veces: 가끔
      videojuegos: 게임하다
      nunca: 전혀 하지 않다
      libre: 자유로운
      tiempo: 시간
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo가 주말에 대해 물어요
    gloss: 'Mateo: 이번 주말에 뭐 해요?'
    note: '*Este fin de semana*(이번 주말)는 남성 명사 *fin de semana*와 함께 *este*를 써요.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena는 아직 정하지 못했어요
    gloss: 'Elena: 아직 몰라요. 읽는 것도 좋아하지만 나가고도 싶어요.'
    note: '*Quiero salir*(나가고 싶어요)는 집 밖으로 나가고 싶다고 할 때 흔히 쓰는 말이에요.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo가 계획을 제안해요
    gloss: 'Mateo: 같이 산책할까요? 그 후에 내가 우리를 위해 요리할게요.'
    note: '*Después*(그 후에)는 순서를 나타내는 말이에요: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena가 동의해요
    gloss: 'Elena: 좋은 생각이에요! 산책도 요리도 둘 다 좋아해요.'
    note: '*Las dos cosas*(두 가지 모두)는 Elena가 어느 한쪽이 아니라 두 가지를 똑같이 좋아한다는 걸 보여 줘요.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo가 확정해요
    gloss: 'Mateo: 완벽해요! 그럼 토요일에 봐요!'
    note: '*el sábado*(토요일)에 만나기로 한 계획을 확인하는 다정한 마무리 말이에요. 스페인어는 특정한 요일 앞에 *el*을 써요.'
