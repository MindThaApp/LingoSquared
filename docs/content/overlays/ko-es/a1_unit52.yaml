answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: '사람의 기본적인 외모를 묘사하는 스페인어 입문 과정: 키와 나이에 대한 인상, 머리카락과 눈 색깔, 핵심 질문 ¿Cómo es ...?, 두 사람의 외모 비교.'
units:
  es.a1.unit52.appearance:
    title: 외모 묘사하기
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: 키가 큰, 키가 작은, 나이 든, 젊은
  es.a1.unit52.lesson02.describir_el_pelo:
    title: 머리카락 묘사하기
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: 눈, 그리고 어떻게 생겼는지 묻기
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena가 Nina를 묘사해요
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Diego와 Lucía 비교하기
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo가 Nina를 알아봐요
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Alto*는 키가 큰 사람, *bajo*는 키가 작은 사람을 나타내요. 둘 다 사람에 맞춰 형태가 바뀌어요: *alta*, *baja*.'
    example_gloss:
    - Lucía는 키가 커요.
    - Diego는 키가 작아요.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: '*Mayor*와 *joven*은 정확한 나이가 아니라 나이에 대한 전반적인 인상을 나타내요.'
    example_gloss:
    - 할아버지는 연세가 많으세요.
    - Mateo는 젊어요.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: 숫자가 아닌 전반적인 인상'
    gloss: '정확한 나이는 tener años로 말해요. 예: ¿Cuántos años tienes? mayor는 숫자 없이 전반적인 인상을 나타내요. 예: El abuelo es mayor.'
    note: '정확한 나이는 *tener años*로 말해요: *¿Cuántos años tienes?* *Mayor*는 숫자 없이 전반적인 인상만 나타내요.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía는 키가 크고 Diego는 키가 작아요
    gloss: Lucía는 키가 크고 Diego는 키가 작아요.
    note: '*y*("그리고")로 이은 간단한 문장으로, 이후 레슨에서 배울 직접 비교를 준비해요.'
  es.a1.unit52.lesson02.teach.el_pelo:
    title: 머리카락
    gloss: 머리카락
    note: '*El pelo*는 남성 명사이고, 머리카락 전체를 말할 때는 단수로 써요.'
    example_gloss: Mateo는 짧은 검은 머리예요.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: '머리카락 색 세 가지: *rubio*(금발), *castaño*(갈색), *gris*(회색). *Rubio*는 명사에 맞춰 형태가 바뀌어요: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena는 금발이에요.
    - Diego는 갈색 머리예요.
    - 할아버지는 백발이에요.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Largo*(긴)는 키 레슨에서 이미 나왔고, 여기서는 머리 길이에 쓰여요. *corto*(짧은)는 새 단어예요: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía는 머리가 길어요.
    - Diego는 머리가 짧아요.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: 형용사는 명사 뒤에 와요
    gloss: '형용사는 명사 뒤에 와요: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: '스페인어에서 형용사는 명사 뒤에 오고 명사에 맞춰 형태가 바뀌어요: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo와 cabello
    gloss: 'Pelo와 cabello는 같은 뜻이에요. 이 과정에서는 pelo를 써요: el pelo largo.'
    note: '*Pelo*와 *cabello*는 일상 스페인어에서 둘 다 ''머리카락''을 뜻해요. 이 과정에서는 *pelo*를 써요.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo는 짧은 검은 머리예요
    gloss: Mateo는 짧은 검은 머리예요.
    note: 옷 단원에서 배운 *negro*(검은색)를 다시 써요.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena는 긴 금발 머리예요
    gloss: Elena는 긴 금발 머리예요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: 눈
    gloss: 눈
    note: '*Los ojos*는 *el ojo*의 복수형이고, 둘 다 남성 명사예요.'
    example_gloss: Mateo는 눈이 갈색이에요.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '*Azul*(파란색)과 *verde*(초록색)는 남성형과 여성형이 같아요. *marrón*(갈색)은 눈 색깔에 흔히 쓰는 말이고, 머리카락은 *castaño*라고 해요.'
    example_gloss:
    - Elena는 눈이 파란색이에요.
    - Diego는 눈이 갈색이에요.
    - Lucía는 눈이 초록색이에요.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos에는 복수 형용사를 써요
    gloss: 'ojos(복수)와 함께 쓸 때는 형용사도 복수예요: ojos azules, ojos marrones, ojos verdes.'
    note: '형용사는 수에 맞춰 형태가 바뀌어요: *ojos*가 복수이므로 *azules*, *marrones*, *verdes*예요.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Elena는 어떻게 생겼어요?
    gloss: Elena는 어떻게 생겼어요?
    note: '*¿Cómo es ...?*는 이 단원의 핵심 질문이에요. 누구의 외모든 물을 때 다시 쓸 수 있어요.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena는 긴 금발 머리에 파란 눈이에요
    gloss: Elena는 긴 금발 머리에 파란 눈이에요.
    note: '*y*로 머리카락과 눈을 한 문장에 묶은 모범 답안이에요.'
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena가 Nina를 소개해요
    gloss: 'Elena: 언어 카페에 새로운 여자애가 와요. 이름은 Nina예요.'
    note: '*Viene*("오고 있다")는 새로운 사람을 소개할 때 쓰고, *se llama*는 "이름이 ~이다"라는 뜻이에요.'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo가 어떻게 생겼는지 물어봐요
    gloss: 'Mateo: 좋아요! 어떻게 생겼어요?'
    note: '이름 없이 이 단원의 핵심 질문을 다시 써요: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena가 Nina의 키와 머리카락을 묘사해요
    gloss: 'Elena: 키가 작고 짧은 금발 머리예요.'
    note: 첫 레슨의 *baja*와 머리카락 어휘를 합쳤어요. Nina가 여자이기 때문에 *baja*는 여성형이에요.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo가 눈에 대해 물어봐요
    gloss: 'Mateo: 눈은요?'
    note: '*¿Y los ojos?*는 정관사로 화제를 이어 가요. 스페인어는 여기서 소유 표현 *sus*를 쓰지 않아요.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena가 Nina의 눈을 묘사해요
    gloss: 'Elena: 눈은 초록색이에요.'
    note: 눈 레슨에서 배운 *los ojos verdes*를 다시 써요.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo가 Nina를 알아볼 거예요
    gloss: 'Mateo: 고마워요! 그럼 알아볼 수 있겠네요.'
    note: '*La reconoceré*("그녀를 알아볼 거예요")는 미래형이고, *la*는 "그녀를"이라는 뜻으로 동사 앞에 와요.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Diego와 Lucía 비교하기
    gloss: Diego와 Lucía는 남매이지만 서로 달라요. Diego는 키가 작고 짧은 갈색 머리에 갈색 눈이에요. Lucía는 Diego보다 키가 크고 긴 갈색 머리에 초록색 눈이에요. 너는 어떻게 생겼어?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      hermano: 남자 형제
      hermana: 여자 형제
      eres: ~해 보이다
      diferentes: 다른
      bajo: 짧은
      corto: 짧은
      castaño: 갈색
      pelo: 머리카락
      marrones: 갈색
      ojos: 눈
      alta: 키가 더 큰
      largo: 긴
      verdes: 초록색
      cómo: ('cómo es'의 일부 = ~은 어떻게 생겼는지)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: 비교 패턴 다시 쓰기
    gloss: '비교 패턴 más + 형용사 + que는 이미 알고 있죠. 여기서는 사람에게 써요: Lucía는 Diego보다 키가 커요.'
    note: 비교를 다룬 단원에서 배운 *más + adjective + que* 패턴을 이제 사물이 아니라 사람에게 적용해 봐요.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía는 Diego보다 머리가 길어요
    gloss: Lucía는 Diego보다 머리가 길어요.
    note: '*Más largo que*는 두 대상을 비교해요: *el pelo más largo que Diego*. *pelo*가 남성이므로 *largo*도 남성형 그대로예요.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*tengo*를 쓴 1인칭 모범 문장으로, 자신을 묘사할 때 그대로 쓸 수 있어요.'
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo가 Nina를 발견해요
    gloss: 'Mateo: 저기 봐요, 저 사람이 Nina예요? 짧은 금발 머리에 초록색 눈이에요.'
    note: '*Mira*("봐요")는 *mirar*의 친근한 명령형으로, 여기서는 무언가를 가리킬 때 써요.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena가 확인해 줘요
    gloss: 'Elena: 네, 저 사람이 Nina예요!'
    note: 짧고 자연스러운 확인 표현이에요.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina가 Mateo에게 인사해요
    gloss: 'Nina: 안녕하세요, Mateo예요?'
    note: '친근한 인사 질문이에요: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo도 Nina에게 인사해요
    gloss: 'Mateo: 네! 만나서 반가워요, Nina.'
    note: '*Encantado de conocerte*는 첫 만남에 쓰는 표준 표현이고, 여자는 *Encantada*라고 해요.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화를 마무리해요. Mateo는 앞서 Elena가 한 설명 덕분에 Nina를 잘 알아봤어요.
