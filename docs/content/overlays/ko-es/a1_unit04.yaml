answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: 요일, 달, 날짜와 생일을 묻고 말하는 법을 배워요. 1~3단원에 이어 엘레나와 마테오의 요리 워크숍 이야기가 계속돼요. 날짜를 서수가 아니라 기수로 말하는 스페인어 방식을 짚어 줘요.
units:
  es.a1.unit04.dates:
    title: 엘레나와 마테오의 워크숍 일정
lessons:
  es.a1.unit04.lesson01.dias_de_la_semana:
    title: 요일
  es.a1.unit04.lesson02.los_meses_del_ano:
    title: 1년의 달
  es.a1.unit04.lesson03.preguntar_y_decir_la_fecha:
    title: 날짜 묻고 말하기
  es.a1.unit04.lesson04.el_cumpleanos:
    title: 엘레나와 마테오의 생일
  es.a1.unit04.lesson05.leer_el_horario_del_taller:
    title: 워크숍 일정표 읽기
  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: 엘레나와 마테오가 다음 수업을 계획해요
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: 월요일~금요일
    gloss: 월요일, 화요일, 수요일, 목요일, 금요일
    note: 스페인어 요일 이름은 문장 맨 앞에 오는 경우가 아니면 대문자로 쓰지 않고 소문자로 써요.
    example_gloss:
    - 요리 워크숍은 화요일마다 있어요.
    - 목요일마다 저는 스페인어를 공부해요.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: 토요일, 일요일
    gloss: 토요일, 일요일
    note: '*Sábado*와 *domingo*만 복수형에서 -s가 붙어요(*los sábados*, *los domingos*). 나머지 요일 이름은 단수와 복수의 형태가 같아요.'
    example_gloss:
    - 토요일마다 저는 시장에 가요.
    - 일요일마다 저는 쉬어요.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: 오늘은 금요일이에요
    gloss: 오늘은 금요일이에요.
    note: '*Hoy*(오늘) + *es*(~이다) + 요일 이름으로 오늘이 무슨 요일인지 바로 말해요. 관사는 필요 없어요.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: 워크숍은 화요일마다 있어요
    gloss: 요리 워크숍은 화요일마다 있어요.
    note: 복수 관사 *los*가 붙은 *Los martes*는 특정한 어느 화요일 하루가 아니라 '화요일마다'라는 반복되는 일정을 뜻해요.
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: 1월~6월
    gloss: 1월, 2월, 3월, 4월, 5월, 6월
    note: 요일 이름처럼 스페인어 달 이름도 문장 맨 앞에 오는 경우가 아니면 소문자로 써요.
    example_gloss:
    - 제 생일은 3월이에요.
    - 6월에는 더워요.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: 7월~12월
    gloss: 7월, 8월, 9월, 10월, 11월, 12월
    note: 한국어는 '9월'처럼 숫자로 달을 말하지만, 스페인어는 *septiembre*처럼 달마다 고유한 이름이 있어요.
    example_gloss:
    - 요리 워크숍은 7월에 시작해요.
    - 12월에는 가족을 만나러 가요.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: 제 생일은 3월이에요
    gloss: 제 생일은 3월이에요.
    note: '*En*(~에)은 구체적인 날짜 없이 달 이름만 말할 때 써요.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: 오늘 날짜 묻기
    gloss: 오늘은 며칠이에요?
    note: '*Qué fecha*(무슨 날짜)는 달력의 날짜를 묻는 표준 표현이에요. 나중 단원에서 배울 *qué hora*(몇 시)와는 구별돼요.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: 날짜 말하기
    gloss: 오늘은 7월 22일이에요.
    note: '*El veintidós de julio*는 말 그대로 ''7월의 22''처럼 읽어요. 스페인어는 서수가 아니라 평범한 기수를 쓰고, 일이 월보다 먼저 와요.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: 스페인어의 날짜 표기
    gloss: 스페인어로 달력의 날짜를 말하는 방법이에요.
    note: 기수 + de + 월 순서로 말해요. 1일은 *el primero*가 흔하고(특히 중남미), *el uno*도 쓰이며 특히 스페인에서 많이 써요.
    target_text: '스페인어는 날짜를 ''기수 + de + 월'' 순서로 말해요: el veintidós de julio는 말 그대로 ''7월의 22''처럼 일이 먼저, 월이 나중에 와요. 한 달의 첫째 날은 많은 사람들(특히 중남미)이 *el primero*(첫째)라고 하고, *el uno*도 흔히 쓰는데 특히 스페인에서 그래요.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: 워크숍이 언제인지 묻기
    gloss: 워크숍이 언제예요?
    note: '*Cuándo*(언제)는 시기를 전반적으로 묻고, 이 과의 다른 질문 *qué fecha*는 달력상의 날짜를 구체적으로 물어요. 여기서는 둘 다 자연스러워요.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: 워크숍 날짜 말하기
    gloss: 워크숍은 7월 22일이에요.
    note: '*hoy es el veintidós de julio*와 같은 날짜 표현인데, 주어만 다르게(*el taller*) 쓴 거예요.'
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: 상대방의 생일 묻기
    gloss: 생일이 언제예요?
    note: '*Tu cumpleaños*(네 생일)는 친구에게 쓰는 *tú* 말투예요.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: 내 생일 말하기
    gloss: 제 생일은 3월 10일이에요.
    note: 월만 말하는 *en marzo*(3월에)와 달리, 생일 날짜 전체를 말할 때는 *el veintidós de julio*처럼 *el* + 일(날짜 숫자)을 써요.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: 제3자의 생일 말하기
    gloss: 마테오의 생일은 8월 22일이에요.
    note: '*El cumpleaños de Mateo*(마테오의 생일)는 소유를 나타내는 *de*를 쓰며, *la familia de Elena*와 같은 구조예요.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: 축하해요!
    gloss: 축하해요! / 생일 축하해요!
    note: '*¡Felicidades!*는 두루 쓰는 축하 인사로, 생일은 물론 다른 좋은 일에도 흔히 써요.'
    example_gloss: 축하해, 엘레나! 오늘 네 생일이잖아.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: 워크숍 일정 읽기
    gloss: 요리 워크숍은 화요일마다 있어요. 다음 수업은 7월 22일이에요. 그다음에는 7월 29일에 수업이 있어요. 워크숍은 8월 12일에 끝나요.
    note: 이 짧은 일정표에는 지금까지 배운 요일 이름과 날짜 표현이 하나의 글로 이어져 있어요.
    glosses:
      taller: 워크숍
      cocina: 요리
      martes: 화요일마다
      próxima: 다음의
      clase: 수업
      veintidós: '22'
      julio: 7월
      Después: 그다음에
      hay: 있다 (haber의 활용형)
      veintinueve: '29'
      termina: 끝난다 (terminar의 활용형)
      doce: '12'
      agosto: 8월
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: 다음 수업
    gloss: 다음 수업
    note: '*Próxima*(다음의)는 여성 명사 *clase*에 맞춘 형태이고, 남성형은 *próximo*예요.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (그다음에)
    gloss: '*después*가 사건을 순서대로 잇는 방법'
    note: '*Después* = 후에, 그다음에.'
    target_text: '*Después*(~ 후에, 그다음에)는 두 사건을 순서대로 이어 줘요: 먼저 한 가지, 그다음에 또 한 가지.'
  es.a1.unit04.lesson06.teach.line01:
    title: 다음 수업 묻기
    gloss: 마테오가 엘레나에게 워크숍 다음 수업이 언제인지 물어요.
    note: '*La próxima clase del taller* = 워크숍의 다음 수업.'
  es.a1.unit04.lesson06.teach.line02:
    title: 날짜 말하기
    gloss: 엘레나가 7월 22일 화요일이라고 확인해 줘요.
    note: 엘레나는 날짜 뒤에 *un martes*(화요일)를 덧붙여, 수업이 워크숍의 평소 요일인 화요일에 있다는 것을 확인해 줘요.
  es.a1.unit04.lesson06.teach.line03:
    title: 워크숍이 언제 끝나는지 묻기
    gloss: 마테오가 워크숍이 언제 끝나는지 물어요.
    note: '*Perfecto*(완벽해요)는 후속 질문을 하기 전에 가볍게 반응하는 자연스러운 말이에요.'
  es.a1.unit04.lesson06.teach.line04:
    title: 종료 날짜 말하기
    gloss: 엘레나가 8월 12일에 끝난다고 말해요.
    note: 인쇄된 일정표에 있는 종료 날짜와 같아요.
  es.a1.unit04.lesson06.teach.line05:
    title: 대화 중에 생일 묻기
    gloss: 마테오가 "그런데"라고 말하며 엘레나의 생일이 언제인지 물어요.
    note: '*Por cierto*(그런데, 참)는 대화 도중에 화제를 자연스럽게 바꿀 때 써요.'
  es.a1.unit04.lesson06.teach.line06:
    title: 날짜를 말하고 되묻기
    gloss: 엘레나가 3월 10일이라고 말한 뒤 "너는?" 하고 되물어요.
    note: '*¿Y el tuyo?*(너는요?)는 소유대명사 *tuyo*를 쓴 표현으로, 이미 언급된 것(*cumpleaños*, 남성 명사이므로 *tuya*가 아니라 *tuyo*)에 대해 되물을 때 쓰는 짧은 형태예요.'
  es.a1.unit04.lesson06.teach.line07:
    title: 마테오의 생일 말하기
    gloss: 마테오가 8월 22일이라고 말해요.
    note: '"mi cumpleaños es"를 반복하지 않고 날짜 표현만 쓴 짧고 완전한 대답이에요. 빠르게 주고받는 대화에서 자연스러워요.'
  es.a1.unit04.lesson06.teach.line08:
    title: 반응하며 시기 짚기
    gloss: 엘레나가 반갑게 반응하며 그의 생일이 워크숍이 끝난 뒤라고 말해요.
    note: '*Es después del taller*(워크숍 후예요): 8월 22일은 8월 12일에 워크숍이 끝난 뒤예요.'
