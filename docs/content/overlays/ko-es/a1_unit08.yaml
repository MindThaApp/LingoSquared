teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: 은행, 약국
    gloss: 은행, 약국
    note: '*Banco*는 남성이고, *farmacia*는 여성이에요.'
    example_gloss:
    - 저는 은행에 가요.
    - 약국은 아홉 시에 문을 열어요.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: 공원, 식당
    gloss: 공원, 식당
    note: 두 명사 모두 남성이에요.
    example_gloss:
    - 공원이 아주 예뻐요.
    - 우리는 식당에서 먹어요.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: 도서관
    gloss: 도서관
    note: '*Biblioteca*는 여성이에요.'
    example_gloss: 저는 도서관에서 공부해요.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: 가까이
    gloss: 식당은 시장 가까이에 있어요.
    note: '*Cerca de*(~ 가까이)는 기준이 되는 장소 앞에 항상 *de*를 써요.'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: ~에서 멀리
    gloss: 공원은 시장에서 멀어요.
    note: '*Lejos de*(~에서 멀리)는 *cerca de*와 반대되는 말이에요.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: ~ 옆에
    gloss: 은행은 시장 옆에 있어요.
    note: '*Al lado de*(~ 옆에)는 굳어진 표현이에요(*al* = *a* + *el lado*). *mercado*처럼 남성 명사 앞에서는 *de* + *el*이 *del*로 줄어들어요: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: ~ 맞은편에
    gloss: 약국은 시장 맞은편에 있어요.
    note: '*Enfrente de*(~ 맞은편에)는 길처럼 무언가를 사이에 두고 반대편에 있는 두 장소를 나타내요.'
  es.a1.unit08.lesson02.teach.entre:
    title: ~ 사이에
    gloss: 도서관은 은행과 공원 사이에 있어요.
    note: '*Entre*(~ 사이에)는 기준이 두 곳 필요하며, 여기서는 *y*(그리고)로 연결해요.'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: 은행이 어디 있는지 묻기
    gloss: 은행은 어디에 있어요?
    note: '*Dónde está*(어디에 있어요?)는 장소의 위치를 물을 때 쓰는 기본 질문 형태예요.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: 위치로 대답하기
    gloss: 시장 옆에 있어요.
    note: '*Del*은 *de* + *el*이 줄어든 형태로, 남성 명사 *mercado* 앞에서 꼭 써야 해요.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: 약국이 어디 있는지 묻기
    gloss: 약국은 어디에 있어요?
    note: 같은 질문 형태를 여성 관사가 붙는 명사에 적용한 문장이에요. 질문 자체는 성에 따라 달라지지 않아요.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: '대답: ~의 맞은편에'
    gloss: 시장 맞은편에 있어요.
    note: '*Enfrente de* + *el mercado*는 *enfrente del mercado*가 돼요. *al lado del mercado*에서와 같은 *del* 축약이에요.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: 멀리 있는지 묻기
    gloss: 멀어요?
    note: 짧게 이어서 묻는 질문이에요. 문맥상 이미 분명하면 주어를 생략해요.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: '대답: 아니요, 가까워요'
    gloss: 아니요, 가까워요.
    note: '*Cerca*만 단독으로(*de* 없이) 짧은 대답으로 쓸 수 있어요. 장소 이름을 말할 때 쓰는 완전한 표현 *cerca de*와는 달라요.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: '대답: 네, 꽤 멀어요'
    gloss: 네, 꽤 멀어요.
    note: '*Bastante*(꽤, 상당히)는 *lejos*를 강조하지만 *muy*(아주)보다는 약해요.'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: 동네에 대한 글 읽기
    gloss: 이 동네에는 유용한 장소가 많아요. 은행은 시장 옆에 있어요. 약국은 시장 맞은편에 있어요. 공원은 멀지만, 도서관은 은행과 공원 사이에 있어요. 식당은 시장에서 아주 가까워요.
    note: 이 짧은 글은 이 단원의 위치 표현을 동네 설명 하나에 모아 보여 줘요.
    glosses:
      barrio: 동네
      hay: ~이 있다 (haber의 활용형)
      muchos: 많은
      lugares: 장소들
      útiles: 유용한
      banco: 은행
      está: ~에 있다 (estar의 활용형)
      lado: 옆
      mercado: 시장
      farmacia: 약국
      enfrente: 맞은편
      parque: 공원
      lejos: 먼
      biblioteca: 도서관
      entre: ~ 사이에
      restaurante: 식당
      cerca: 가까이
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (~이 있다)
    gloss: hay가 단수든 복수든 변하지 않는 이유예요.
    note: 카드 본문을 참고하세요.
    target_text: '*Hay*(있다)는 단수든 복수든 형태가 바뀌지 않아요. *hay un banco*와 *hay muchos lugares* 모두 같은 단어를 써요.'
  es.a1.unit08.lesson06.teach.line01:
    title: 은행이 어디 있는지 묻기
    gloss: 마테오가 엘레나에게 은행이 어디 있는지 물어요.
    note: 이 단원 앞에서 나온 *¿Dónde está...?* 질문이에요. 엘레나의 주의를 끌려고 이름을 먼저 불렀어요.
  es.a1.unit08.lesson06.teach.line02:
    title: 대답하며 시장 언급하기
    gloss: 엘레나가 은행은 달걀을 샀던 시장 옆에 있다고 말해요.
    note: '*Donde compramos los huevos*(우리가 달걀을 샀던 곳)는 7단원의 장보기를 가리켜요.'
  es.a1.unit08.lesson06.teach.line03:
    title: 약국에 대해 묻기
    gloss: 마테오가 알겠다고 하고 약국에 대해 물어요.
    note: '*Ah, sí*(아, 네)는 다음 질문 전에 짧게 반응하는 자연스러운 표현이에요.'
  es.a1.unit08.lesson06.teach.line04:
    title: '대답: ~의 맞은편에'
    gloss: 엘레나가 시장 맞은편에 있다고 말해요.
    note: 짧은 대답이에요. 질문에서 이미 분명하니 주어(*la farmacia*)를 생략했어요.
  es.a1.unit08.lesson06.teach.line05:
    title: 공원에 대해 묻기
    gloss: 마테오가 공원에 대해, 그리고 가까운지 물어요.
    note: 한 번에 질문 두 개를 이어서 해요. 편한 대화에서 자연스러워요.
  es.a1.unit08.lesson06.teach.line06:
    title: '대답: 멀다, 그리고 도서관 언급하기'
    gloss: 엘레나가 공원은 멀지만 도서관은 은행과 공원 사이에 있다고 말해요.
    note: '*Pero*(하지만)는 공원이 먼 것과 도서관 위치가 더 편리하다는 점을 대조해요.'
  es.a1.unit08.lesson06.teach.line07:
    title: 감사 인사하고 식당에 대해 묻기
    gloss: 마테오가 엘레나에게 고맙다고 하고 같이 먹었던 식당에 대해 물어요.
    note: '*El restaurante donde comimos*(우리가 먹었던 식당)는 6단원의 점심을 가리켜요.'
  es.a1.unit08.lesson06.teach.line08:
    title: 아주 가깝다고 확인하기
    gloss: 엘레나가 시장에서 아주 가깝다고 확인해 줘요.
    note: '*Muy cerca*(아주 가까이): *muy*(아주)는 *bastante lejos*(꽤 멀리)의 *bastante*(꽤)보다 더 강해요.'
