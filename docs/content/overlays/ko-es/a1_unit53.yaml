course:
  title: 스페인어 A1
  description: 반려동물과 흔한 동물에 대해 이야기하는 스페인어 초급 과정이에요. 동물 이름, 기본적인 돌봄(산책시키기, 먹이 주기, 놀아 주기), 반려동물이 없어도 좋아하는 동물 말하기, 그리고 규칙 복수형을 배워요.
