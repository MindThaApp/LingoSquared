    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: Diego는 자기 고양이와 놀아요.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
    note: '*Sacar a pasear*는 앞선 단원에서 배운 *todos los días*(매일)와 함께 쓸 수 있어요. *a* + *el*은 *al*이 돼요.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: 저는 매일 고양이에게 먹이를 줘요
    gloss: 저는 매일 고양이에게 먹이를 줘요.
    note: '*Dar de comer*("먹으라고 주다")는 먹이를 준다는 뜻이에요. *le*는 그 동물을 가리켜요: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: '복수형은 -s로 끝나요: perro → perros, gato → gatos. 자음으로 끝나면 -es를 붙여요: animal → animales.'
    note: 스페인어의 규칙적인 복수형 패턴으로, 여기서 동물 명사를 예로 처음 소개해요.
  es.a1.unit53.lesson03.teach.perros_gatos:
