  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: '*No tengo mascota*는 동사 앞에 *no*를 붙이기만 하면 돼요. 문법 노트를 보세요.'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: 무언가가 없다고 말하기'
    gloss: '무언가가 없다고 말하려면 tengo 앞에 no를 붙여요: No tengo tiempo, no tengo mascota.'
    note: '*No tengo tiempo*에서 이미 배운 *no tengo* 패턴을 다시 써요. 명사만 새로워요.'
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: (동물을) 산책시키다
    gloss: (동물을) 산책시키다
    note: '*Sacar a pasear*는 고정된 표현이에요. *sacar*("꺼내다") + *a pasear*("산책하러")로 이루어져 있어요.'
    example_gloss: 저는 매일 개를 산책시켜요.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear와 사람·동물 앞의 a
    gloss: '목적어가 동물이나 사람일 때는 그 앞에 a를 써요: saco al perro a pasear.'
    note: 이전 카드의 *saco al perro*를 다시 써요. 이 *a*는 아끼는 동물이나 사람 앞에 와요.
  es.a1.unit53.lesson02.teach.dar_de_comer:
