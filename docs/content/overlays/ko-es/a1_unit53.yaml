    gloss: Mateo와 Lucía는 둘 다 동물을 아주 좋아하지만, 둘 중 누구도 반려동물이 없어요. Mateo는 개를 좋아하고 Lucía는 고양이를 좋아해요. Diego에게는 반려동물이 있어요. 바로 고양이예요. 그는 자주 고양이와 놀고 매일 먹이를 줘요. 여러분은 반려동물이 있나요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      encantan: 사랑해요
      dos: 둘 다
      animales: 동물들
      ninguno: 둘 다
      mascota: 반려동물
      perros: 개들
      gatos: 고양이들
      gato: 고양이
      juega: 놀아요
      da: 줘요
      todos: 매
      comer: 먹이
