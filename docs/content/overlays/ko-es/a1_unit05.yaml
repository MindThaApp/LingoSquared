teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: 시간 묻기
    gloss: 몇 시예요?
    note: '*Qué hora*(몇 시)는 시각을 묻는 표현이고, 날짜를 묻는 *qué fecha*(며칠)와는 달라요.'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: 1시예요
    gloss: 1시예요.
    note: 1시에만 *son*이 아니라 *es*를 쓰는 이유는 다음 문법 설명을 보세요.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: 시각의 es와 son
    gloss: 1시가 다른 시각과 다른 이유
    note: '*Es la una*(단수), 하지만 *son las dos, son las tres...*(복수).'
    target_text: 1시에는 단수 동사 *es*를 쓰고(Es la una), 다른 모든 시각에는 복수 *son*을 써요(Son las dos, Son las tres...). *la una*는 단수('1시')이고 *las dos*, *las tres* 등은 복수이기 때문이에요.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: 2시, 4시, 5시, 7시
    gloss: 2시예요, 4시예요, 5시예요, 7시예요.
    note: '*Son las...*(복수)는 1시를 뺀 모든 시각에 써요. 앞의 문법 설명과 같아요.'
    example_gloss:
    - 2시예요.
    - 4시예요.
    - 5시예요.
    - 7시예요.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: ~시 15분
    gloss: 4시 15분이에요.
    note: '*Y cuarto*(그리고 4분의 1)는 말한 시각에 15분을 더해요.'
  es.a1.unit05.lesson02.teach.y_media:
    title: ~시 반
    gloss: 7시 반이에요.
    note: '*Y media*(그리고 반)는 말한 시각에 30분을 더해요.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: ~시 15분 전
    gloss: 5시 15분 전이에요(4시 45분).
    note: '*menos*가 다음 시각을 향해 거꾸로 세는 방식은 다음 문법 설명을 보세요.'
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (다음 시각 전)
    gloss: 스페인어에서 다음 시각 전의 분을 세는 방법
    note: '*Las cinco menos cuarto* = 5시 15분 전(4시 45분).'
    target_text: '*Menos*(빼기, ~전)는 다음 시각을 향해 거꾸로 센다는 뜻이에요. *las cinco menos cuarto*는 4시 45분이고, ''5시 15분 전''으로 읽어요.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: 아침, 오후, 밤
    gloss: 아침에, 오후에, 저녁에/밤에
    note: '*De la mañana/tarde/noche*는 시각 뒤에 붙어 오전인지 오후인지 분명히 해 줘요. 한국어에서 시각 앞에 ''아침'', ''오후'', ''밤''을 붙이는 것과 비슷해요.'
    example_gloss:
    - 아침 8시예요.
    - 워크숍은 오후 4시에 시작해요.
    - 밤 10시예요.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: 워크숍은 4시에 시작해요
    gloss: 워크숍은 오후 4시에 시작해요.
    note: '*Empieza*(시작하다)는 *empezar*의 3인칭 형태로, 이 단원에서 배우는 새 동사예요.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: 무언가 몇 시에 시작하는지 묻기
    gloss: 워크숍은 몇 시에 시작해요?
    note: '*A qué hora*(몇 시에)는 특정 행사가 언제인지 물을 때 쓰는 기본 표현이에요. 지금 몇 시인지 묻는 *qué hora es*와는 달라요.'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: 만날 시간 묻기
    gloss: 몇 시에 만날까요?
    note: '*Nos vemos*(우리는 서로 본다 / 만난다)는 누군가와 만날 약속을 잡을 때 쓰는 재귀 구문이에요.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: 만날 시간 제안하기
    gloss: 3시 30분에 만날까요?
    note: '*y media*와 *nos vemos*를 합쳐 구체적인 시간을 제안해요.'
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: 워크숍 전
    gloss: 그건 워크숍 전이에요.
    note: '*Antes de*(~ 전에)는 *después*(~ 후에)의 반대말이에요.'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: 좋아요 / 알겠어요
    gloss: 좋아요 / 알겠어요
    note: '*De acuerdo*는 계획을 확인할 때 쓰는 자연스럽고 짧은 표현으로, 기능상 *Muy bien*과 비슷해요.'
    example_gloss: 좋아요, 3시 30분에 만나요.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: 하루 일정 읽기
    gloss: 워크숍은 오후 4시에 시작해요. 그 전에 엘레나와 마테오는 3시 30분에 만나요. 워크숍은 6시에 끝나요. 다음 날에는 1시에 만나서 점심을 먹어요.
    note: '하루 일정을 짧게 정리한 글이에요: 만남, 워크숍, 그리고 다음 날 점심.'
    glosses:
      taller: 워크숍
      empieza: 시작해요
      cuatro: 넷, 4
      tarde: 오후
      Antes: 전, 앞서
      ven: 서로 만나요
      tres: 셋
      media: 반, 30분
      termina: 끝나요
      seis: 여섯
      día: 날
      siguiente: 다음의
      almorzar: 점심을 먹다
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: 다음 날
    gloss: 다음 날
    note: '*Al día siguiente*(다음 날에)는 이야기를 새로운 날로 넘길 때 흔히 쓰는 표현이에요. *la próxima clase*(다음 수업)는 달력상의 날이 아니라 특정한 일정을 가리키므로 달라요.'
  es.a1.unit05.lesson06.teach.line01:
    title: 워크숍 후 식사 묻기
    gloss: 마테오는 워크숍이 6시에 끝난다고 말하고, 그 후에 배고픈지 엘레나에게 물어요.
    note: '*Tienes hambre*(배고파요?)는 새로 나온 관용 표현이에요. 글자 그대로는 ''배고픔을 가지고 있다''로, *tener ... años*, *tener hermanos*와 같은 tener 구문이에요.'
  es.a1.unit05.lesson06.teach.line02:
    title: 동의하고 다음 날 제안하기
    gloss: 엘레나는 조금 배고프다고 대답하며, 대신 다음 날 먹자고 제안해요.
    note: '*¿Comemos mañana?*는 워크숍 직후가 아니라 내일을 제안하는 말로, 구체적인 시간을 정하는 다음 대화로 이어져요.'
  es.a1.unit05.lesson06.teach.line03:
    title: 동의하고 시간 묻기
    gloss: 마테오는 좋은 생각이라고 하며 몇 시인지 물어요.
    note: '*Buena idea*(좋은 생각이에요)는 제안에 동의할 때 쓰는 자연스럽고 짧은 표현이에요.'
  es.a1.unit05.lesson06.teach.line04:
    title: 1시 제안하기
    gloss: 엘레나는 1시에 만나자고 제안해요.
    note: '*A la una*(1시에)는 *Es la una*처럼 단수 형태 *la una*를 써요.'
  es.a1.unit05.lesson06.teach.line05:
    title: 확인하고 식당 언급하기
    gloss: 마테오는 1시가 좋다고 확인하고, 근처에 있는 식당을 이야기해요.
    note: '*Hay un restaurante cerca de aquí*: *cerca de*(~ 가까이에)는 *cerca de tus padres*처럼 쓰이는데, 여기서는 장소에 쓰였어요.'
  es.a1.unit05.lesson06.teach.line06:
    title: 따뜻하게 마무리하기
    gloss: 엘레나는 기뻐하며 내일 보자고 말해요.
    note: '*¡Genial!*(멋져요!)은 신나는 느낌으로 대화를 마무리하며, 기능상 *¡Qué bien!*과 비슷해요.'
