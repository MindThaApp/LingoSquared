  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: 식당에서 음식과 음료를 주문하고, 간단한 메뉴를 읽고, 계산서를 요청하는 법을 배워요. 앞 단원에서 계획한 점심으로 이어지는 엘레나와 마테오의 이야기예요. Quiero와 Para mí가 똑같이 자연스러운 주문 표현이라는 점도 짚어 줘요.
