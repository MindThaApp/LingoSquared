teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: 샌드위치, 샐러드
    gloss: 샌드위치, 샐러드
    note: '*Sándwich*는 외래어에서 온 말이에요. 강세가 오는 음절을 나타내려고 악센트를 붙여 써요.'
    example_gloss:
    - 샌드위치를 원해요.
    - 샐러드에는 토마토가 들어 있어요.
  es.a1.unit06.lesson01.teach.sopa:
    title: 수프
    gloss: 수프
    note: '*Sopa*는 여성 명사예요. -a로 끝나는 대부분의 스페인어 명사와 같아요.'
    example_gloss: 수프가 아주 맛있어요.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: 물, 커피
    gloss: 물, 커피
    note: '*Agua*는 문법상 여성 명사지만, 강세가 있는 *a* 소리로 시작하기 때문에 단수일 때 관사 *la*가 아니라 남성 관사 *el*을 써요. 오타가 아니라 스페인어의 실제 불규칙이에요.'
    example_gloss:
    - 물 주세요.
    - 저는 커피로 할게요.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: 샌드위치를 먹고 싶어요
    gloss: 샌드위치를 원해요.
    note: '*Quiero*(원해요)는 동사 *querer*의 1인칭 형태로, 이 단원에서 처음 나오는 동사예요.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: 저는 커피로
    gloss: 저는 커피로 할게요.
    note: '*Para mí*(저는)는 동사를 반복하지 않고 음식 이름만 말하는, 자주 쓰는 또 다른 주문 표현이에요. 다음 문법 설명을 참고하세요.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: 무엇을 먹고 싶은지 묻기
    gloss: 뭘 먹고 싶어요?
    note: '*Quieres*는 *querer*의 *tú* 형태로, 친구에게 쓰는 편한 말투예요.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero와 Para mí
    gloss: 똑같이 자연스러운 두 가지 주문 방법이에요.
    note: 주문할 때 *Quiero un café*와 *Para mí, un café*는 둘 다 괜찮아요.
    target_text: '*Quiero*("원해요")와 *Para mí*("저는", 주문할 음식을 말하기 전에 쓰는 표현)는 편한 자리에서 주문할 때 둘 다 자연스럽고 똑같이 공손한 표현이에요. 어느 쪽이 더 맞는 것은 아니에요.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: 메뉴판
    gloss: 메뉴
    note: '*Menú*는 마지막 음절에 강세가 와서 악센트를 붙여 써요.'
    example_gloss: 메뉴를 볼 수 있을까요?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: 메뉴 보여 달라고 하기
    gloss: 메뉴를 볼 수 있을까요?
    note: '*Podemos*(우리는 ~할 수 있어요)는 동사 *poder*의 1인칭 복수 형태로, 이 단원에서 처음 나오는 동사예요.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: 여기 있어요
    gloss: 여기 있어요.
    note: '*Aquí tiene*는 종업원이 손님에게 무언가를 건넬 때 쓰는 기본 표현이에요. 전반적으로 편한 대화에서도 존대 동사 형태인 *usted*를 쓰는데, 정해진 공손한 표현일 뿐 말투가 바뀐 것은 아니에요.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: 맛있게 드세요
    gloss: 맛있게 드세요
    note: '*Buen provecho*는 상대가 식사를 시작하기 전에 건네는 기본 인사말로, 한국어의 "맛있게 드세요"와 쓰임이 비슷해요.'
    example_gloss: 여기 있어요. 맛있게 드세요.
  es.a1.unit06.lesson04.teach.el_postre:
    title: 디저트
    gloss: 디저트
    note: '*Postre*는 남성 명사예요.'
    example_gloss: 디저트로 케이크를 먹고 싶어요.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: 디저트 주문하기
    gloss: 디저트로 케이크를 먹고 싶어요.
    note: '*De postre*(디저트로)는 마지막 코스로 주문할 음식을 말할 때 써요. 메인 요리를 주문할 때 *para mí*를 쓰는 것과 같은 방식이에요.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: 계산서 부탁하기
    gloss: 계산서 부탁해요.
    note: '*La cuenta*(계산서)는 식사를 마치고 계산하고 싶을 때 쓰는 기본 표현이에요.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: 메뉴 읽기
    gloss: '메뉴: 샌드위치 5. 샐러드 8. 수프 3. 커피 또는 물 포함. 디저트: 케이크.'
    note: 가격이 붙은 실제 인쇄 메뉴 형식이에요. 이 단원의 음식 어휘를 그대로 다시 써요.
    glosses:
      Menú: 메뉴
      sándwich: 샌드위치
      Ensalada: 샐러드
      Sopa: 수프
      Café: 커피
      agua: 물
      incluido: 포함된
      Postre: 디저트
      pastel: 케이크
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido(포함됨)
    gloss: 음료에 포함이라고 적혀 있을 때의 뜻이에요.
    note: '*Incluido* = 포함됨, 추가 요금 없음.'
    target_text: '*Incluido*(포함됨)는 식사에 음료가 추가 요금 없이 함께 나온다는 뜻이에요.'
  es.a1.unit06.lesson06.teach.line01:
    title: 인사하고 주문 묻기
    gloss: 종업원이 엘레나와 마테오에게 인사하고 무엇을 먹고 싶은지 물어요.
    note: '*Buenas tardes*(안녕하세요, 오후 인사)는 정오 이후에 쓰는 인사라서 점심시간에 어울려요.'
  es.a1.unit06.lesson06.teach.line02:
    title: 엘레나의 주문
    gloss: 엘레나는 샐러드와 물을 주문해요.
    note: '*Una ensalada y agua* = 샐러드 하나와 물.'
  es.a1.unit06.lesson06.teach.line03:
    title: 마테오의 주문
    gloss: 마테오는 자기 몫으로 샌드위치와 커피를 주문해요.
    note: '*Quiero*를 반복하지 않고 *Para mí*를 써요.'
  es.a1.unit06.lesson06.teach.line04:
    title: 디저트 물어보기
    gloss: 종업원이 좋다고 하며 디저트를 드시겠냐고 물어요.
    note: '*¿Algo de postre?*(디저트는 필요하세요?)는 디저트를 권할 때 쓰는 자연스럽고 짧은 표현이에요.'
  es.a1.unit06.lesson06.teach.line05:
    title: 디저트 나눠 먹기 주문
    gloss: 엘레나는 좋다고 하며 둘이 먹을 케이크 하나를 주문해요.
    note: '*Para los dos*(두 사람이 먹을)는 디저트 하나를 나눠 먹는다는 뜻으로, 실생활에서 자연스러운 선택이에요.'
  es.a1.unit06.lesson06.teach.line06:
    title: 동의하고 계산서 부탁하기
    gloss: 마테오가 동의하며 계산서를 부탁해요.
    note: '*La cuenta, por favor* = 계산서 부탁해요.'
  es.a1.unit06.lesson06.teach.line07:
    title: 계산서 건네기
    gloss: 종업원이 계산서를 건네요.
    note: '*Aquí tiene*는 무언가를 건넬 때 하는 말이에요.'
  es.a1.unit06.lesson06.teach.line08:
    title: 따뜻하게 마무리하기
    gloss: 엘레나는 웨이터에게 고맙다고 하면서 음식이 정말 맛있었다고 말해요.
    note: '*¡Qué buena comida!*는 *¡Qué bien!*, *¡Qué bonito!*와 같은 *¡Qué ...!* 감탄문 형태예요.'
