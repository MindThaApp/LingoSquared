teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: 일 / 직장
    gloss: 일 / 직장
    note: '*Trabajo*는 남성명사이고, "저는 일해요"라는 동사 형태이기도 해요.'
    example_gloss: 저는 제 일이 좋아요.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: 사무실
    gloss: 사무실
    note: '*Oficina*는 여성명사예요.'
    example_gloss: 저는 사무실에서 일해요.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: 창구
    gloss: 그 데스크
    note: '*Escritorio*는 남성명사예요.'
    example_gloss: 이것은 제 책상이에요.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: 학교
    gloss: 학교
    note: '*Escuela*는 여성명사예요.'
    example_gloss: 저는 학교에서 가르쳐요.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: 학생들
    gloss: 학생들
    note: '*Estudiante*는 남자든 여자든 형태가 같고, 복수형 *los estudiantes*는 남녀가 섞인 그룹도 가리켜요.'
    example_gloss: 저는 학생이 스무 명 있어요.
  es.a1.unit13.lesson02.teach.trabajar:
    title: 일하다
    gloss: 일하다
    note: 동사의 원형으로, *me gusta trabajar*(저는 일하는 것을 좋아해요) 같은 구문에 쓰여요.
  es.a1.unit13.lesson02.teach.soy_contador:
    title: 회계사라고 말하기
    gloss: 저는 회계사예요.
    note: 직업은 관사 없이 *ser* + 직업으로 말해요 -- 아래 문법 카드를 보세요.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: 선생님이라고 말하기 (여성)
    gloss: 저는 선생님이에요.
    note: '*Profesora*는 *profesor*의 여성형이에요.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: 어디서 가르치는지 말하기
    gloss: 저는 학교에서 가르쳐요.
    note: '*Enseño*(저는 가르쳐요)는 *enseñar*의 1인칭 형태이고, *escuela*(학교)와 함께 쓰였어요.'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: ser로 말하는 직업
    gloss: 스페인어에서 관사 없이 직업을 말하는 방법
    note: 카드 본문을 보세요.
    target_text: '직업은 *ser* + 직업으로 말하고 관사는 붙이지 않아요: *soy contador*(저는 회계사예요)이고, *soy un contador*는 틀려요. *Contador*에는 짝이 되는 여성형 *contadora*가 있고, *profesor/profesora*도 ''선생님''을 뜻하는 같은 종류의 남성/여성 짝이에요(여자일 때는 *-a*를 붙여요).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: 상대의 직업 묻기
    gloss: 무슨 일을 하세요?
    note: '*¿En qué trabajas?*(직역하면 "무엇에서 일해요?")는 상대의 직업을 묻는 가장 일반적인 표현이에요.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: 내 직업으로 대답하기
    gloss: 저는 사무실에서 일해요. 저는 회계사예요.
    note: '*oficina*와 *soy contador*를 합쳐 자연스러운 두 문장짜리 대답이 돼요.'
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: 내 일이 좋다고 말하기
    gloss: 저는 제 일이 좋아요.
    note: '*gustar* 구문을 *mi trabajo*(제 일)와 함께 다시 써요.'
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: 선호 말하기
    gloss: 하지만 저는 요리하는 것을 더 좋아해요.
    note: '*Prefiero*(저는 더 좋아해요)는 이미 본 형태이고, *cocinar*(요리하다)는 이 이야기 전체의 중심 활동을 나타내는 원형이에요.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: 둘 다 이것을 더 좋아한다고 말하기
    gloss: 우리 둘 다 이것을 더 좋아해요.
    note: '*Preferimos*는 *preferir*의 *nosotros* 형태로, 엘레나와 마테오가 함께 같은 의견일 때 써요.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: 두 사람의 직업 읽기
    gloss: 마테오는 런던의 사무실에서 일해요. 그는 회계사예요. 엘레나는 학교에서 가르쳐요. 그녀는 선생님이고 학생이 스무 명 있어요. 두 사람 모두 자기 일이 좋지만, 화요일에는 함께 요리하는 것을 더 좋아해요.
    note: 마테오와 엘레나의 직업을 짧게 정리한 글이에요.
    glosses:
      trabaja: 일해요 (trabajar에서)
      oficina: 사무실
      contador: 회계사
      enseña: 가르쳐요 (enseñar에서)
      escuela: 학교
      profesora: 선생님
      tiene: 가지고 있어요 (tener에서)
      veinte: 20, 스물
      estudiantes: 학생들
      gusta: 마음에 들어요 / 좋아해요 (gustar에서)
      trabajo: 일
      prefieren: 선호하다 (preferir의 활용형)
      cocinar: 요리하다
      juntos: 함께
      martes: 화요일마다
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: gustar가 복수 간접목적어와 함께 쓰이는 방법이에요.
    note: 카드 본문을 보세요.
    target_text: '*A los dos les gusta*(두 사람 모두 좋아해요)는 이미 알고 있는 *gustar* 구문을 복수 간접목적어로 넓힌 거예요 -- *me/te*(나에게/너에게) 대신 *les*(그들에게)를 써요.'
  es.a1.unit13.lesson06.teach.line01:
    title: 마테오의 직업 묻기
    gloss: 엘레나가 마테오에게 무슨 일을 하는지 물어봐요.
    note: 앞에서 배운 질문을 이번에는 마테오의 이름을 넣어서 물어봐요.
  es.a1.unit13.lesson06.teach.line02:
    title: 직업으로 대답하기
    gloss: 마테오는 사무실에서 회계사로 일한다고 말해요.
    note: 앞에서 배운 완전한 대답이에요. 어디에서 일하는지 말한 다음 직업을 말해요.
  es.a1.unit13.lesson06.teach.line03:
    title: 반응하고 자기 직업 말하기
    gloss: 엘레나는 흥미롭다고 말하고 자기는 교사라고 말해요.
    note: '*Interesante*(흥미로운)는 새로 나온, 모양이 비슷해서 알기 쉬운 단어예요. 나머지는 이미 배운 *soy profesora*와 *enseño en una escuela*예요.'
  es.a1.unit13.lesson06.teach.line04:
    title: 가르치는 걸 좋아하는지 묻기
    gloss: 마테오가 가르치는 걸 좋아하는지 물어봐요.
    note: '*¿Te gusta enseñar?*는 앞에서 배운 *gustar* 질문 형태에 동사원형 *enseñar*를 붙인 문장이에요.'
  es.a1.unit13.lesson06.teach.line05:
    title: 긍정하고 선호 덧붙이기
    gloss: 엘레나는 아주 좋아하지만 화요일마다 마테오와 함께 요리하는 게 더 좋다고 말해요.
    note: '*Contigo*(너와 함께)는 전치사와 대명사가 합쳐진 새로운 형태예요. *los martes*(화요일마다)는 매주 반복되는 요일에 복수 관사를 써요.'
  es.a1.unit13.lesson06.teach.line06:
    title: 같은 선호에 공감하기
    gloss: 마테오도 자기 일을 좋아하지만 요리하는 게 더 좋다고 말해요.
    note: '*A mí también*(저도요)은 *gustar*로 공감을 강조하는 표현이에요. *a mí*가 누가 좋아하는지를 강조해요.'
  es.a1.unit13.lesson06.teach.line07:
    title: 결론 내리기
    gloss: 엘레나는 둘 다 이것(함께 요리하기)을 더 좋아한다고 결론을 내려요.
    note: '*Entonces*(그러면, 그럼)는 새로 나온 논리 연결어예요. 나머지는 *los dos preferimos esto*(우리 둘 다 이걸 더 좋아해요)예요.'
  es.a1.unit13.lesson06.teach.line08:
    title: 신나게 확인하기
    gloss: 마테오가 확실히 그렇다고 동의해요.
    note: '*Definitivamente*(확실히)는 장면을 마무리하는, 모양이 비슷해서 알기 쉬운 새 부사예요.'
