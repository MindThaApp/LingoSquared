  es.a1.unit12.lesson06.el_pastel_se_quema_dialogue:
    title: 케이크가 탈 뻔해요
teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: 긴장한
    gloss: 긴장한
    note: '*Nervioso*(남성) / *nerviosa*(여성) -- 일반적인 -o/-a 형용사 쌍이에요.'
    example_gloss:
    - Mateo는 긴장했어요.
    - Elena는 긴장했어요.
  es.a1.unit12.lesson01.teach.contento:
    title: 기쁜
    gloss: 기쁜 / 만족한
    note: '*Contento/contenta*는 기쁘거나 만족스러운 기분을 나타내며, 변하지 않는 특징을 말하는 것이 아니에요.'
    example_gloss:
    - Mateo는 기뻐요.
    - Elena는 기뻐요.
  es.a1.unit12.lesson01.teach.cansado:
    title: 피곤한
    gloss: 피곤한
    note: '*Cansado/cansada*는 ''피곤하게 하다''라는 뜻의 *cansar*에서 온 말이에요.'
    example_gloss:
    - 워크숍이 끝나서 피곤해요. (남성)
    - 워크숍이 끝나서 피곤해요. (여성)
  es.a1.unit12.lesson01.teach.preocupado:
    title: 걱정되는
    gloss: 걱정되는
    note: '*Preocupado/preocupada*는 ''걱정시키다''라는 뜻의 *preocupar*에서 온 말이에요.'
    example_gloss:
    - Mateo는 걱정돼요.
    - Elena는 걱정돼요.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: 자랑스러운
    gloss: 자랑스러운
    note: '*Orgulloso/orgullosa* -- *estoy orgulloso/a de...*(~이 자랑스러워요)처럼 자랑스러운 대상 앞에 *de*를 써요.'
    example_gloss:
    - 네가 자랑스러워요. (남성)
    - 네가 자랑스러워요. (여성)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: 긴장돼요 (남성)
    gloss: 긴장돼요.
    note: '*Estoy*(*estar*의 ''나는 ~이다'') + 남성형 형용사예요.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: 긴장돼요 (여성)
    gloss: 긴장돼요.
    note: 같은 구조에 여성형 형용사를 써요.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: 기뻐요 (남성)
    gloss: 기뻐요.
    note: '*Estoy contento* -- 같은 *estar* + 형용사 구조예요.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: 감정을 말할 때의 estar와 ser
    gloss: 감정에는 보통 ser가 아니라 estar를 쓰는 이유
    note: 카드 본문을 참고하세요.
    target_text: '*Estar* + 형용사는 일시적인 상태나 감정을 나타내요(estoy nervioso -- 지금 긴장돼요). 반면 *ser* + 형용사는 변하지 않는 특징을 나타내요. 감정은 보통 *estar*를 써요.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: 상대의 기분 묻기
    gloss: 기분이 어때요?
    note: '*¿Cómo te sientes?*는 재귀동사 *sentirse*(느끼다)를 써요. *estar* + 형용사와는 다른 표현이에요.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: 복합적인 감정 말하기
    gloss: 조금 긴장되지만 기뻐요.
    note: '*Me siento*(느껴요) + 형용사에 *pero*(하지만)를 써서 두 가지 감정을 대조해요 -- *¿Cómo te sientes?*에 대한 자연스러운 대답이에요.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: 뭔가 타고 있어요
    gloss: 뭔가 타고 있어요!
    note: '*Se quema*는 *quemar*(태우다)의 재귀형이에요. "저절로 타다"라는 뜻으로, 누가 그랬는지 밝히지 않고 무언가가 타고 있다고 말할 때 쓰는 자연스러운 표현이에요.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: 걱정돼요 (남성)
    gloss: 걱정돼요.
    note: '*estoy* + 형용사 구조에 쓰인 *preocupado*예요.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: 걱정하지 마세요
    gloss: 걱정하지 마세요.
    note: 다음 문법 설명을 참고하세요.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: 다시 시작하자고 제안하기
    gloss: 다시 시작할 수 있어요.
    note: '*Podemos*(우리는 ~할 수 있다) + 동사원형이에요. *de nuevo*(다시)는 무언가를 다시 할 때 자주 쓰는 표현이에요.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: '"걱정하지 마"에 쓰인 부정 명령형의 형태예요.'
    note: 카드 본문을 참고하세요.
    target_text: '*No te preocupes*(걱정하지 마)는 친근한 부정 명령형이에요. *no* + 재귀대명사(*te*) + 동사 순서로 만들어요.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: 수업을 돌아보며
    gloss: 수업 전에 엘레나와 마테오는 조금 긴장했어요. 수업 중에 뭔가가 타서 둘 다 걱정했어요. 하지만 다시 시작했고, 결국 케이크는 완벽하게 나왔어요. 이제 둘 다 아주 자랑스럽고 기뻐해요.
    note: '*Estaban*(그들은 ~했다)은 그때의 기분을, *están*(그들은 ~하다)은 지금의 기분을 나타내요.'
    glosses:
      Antes: ~ 전에
      clase: 수업
      estaban: ~였다 (estar의 과거형)
      poco: 조금
      nerviosos: 긴장한
      Durante: ~ 동안
      algo: 무언가
      quemó: 탔다 (quemarse의 과거형)
      dos: 둘 다
      preocupados: 걱정되는
      Pero: 하지만
      empezaron: 시작했다 (empezar의 과거형)
      nuevo: 다시
      final: 끝
      pastel: 케이크
      salió: 나왔다 (salir의 과거형)
      perfecto: 완벽한
      Ahora: 지금
      están: ~이다 (estar의 현재형)
      orgullosos: 자랑스러운
      contentos: 기쁜
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: 형용사의 복수형 일치
    gloss: 남녀가 섞인 무리에 왜 남성 복수 형용사를 쓰는지 설명해요.
    note: 카드 본문을 참고하세요.
    target_text: Elena와 Mateo처럼 여러 사람을 함께 묘사할 때는 형용사가 남성 복수형(nerviosos, preocupados, orgullosos, contentos)이 돼요. 무리에 남성이 한 명이라도 있으면 남성 복수형을 쓰는 것이 스페인어의 기본 규칙이에요.
  es.a1.unit12.lesson06.teach.line01:
    title: 마테오의 기분 묻기
    gloss: 엘레나가 마테오에게 수업 전에 기분이 어떤지 물어봐요.
    note: '*¿Cómo te sientes?*는 상대방의 기분이 어떤지 묻는 표현이에요.'
  es.a1.unit12.lesson06.teach.line02:
    title: 복합적인 기분으로 대답하기
    gloss: 마테오가 조금 긴장되지만 기쁘다고 말해요.
    note: 마테오는 남성형인 *nervioso*와 *contento*를 써요.
  es.a1.unit12.lesson06.teach.line03:
    title: 사고에 반응하기
    gloss: 엘레나가 맞장구를 치다가 뭔가 타고 있는 걸 알아채요.
    note: '*¡Ay, no!*(아, 이런!)는 놀랐을 때 흔히 쓰는 감탄 표현이에요.'
  es.a1.unit12.lesson06.teach.line04:
    title: 걱정 표현하기
    gloss: 마테오가 걱정된다며 어떻게 해야 할지 물어봐요.
    note: '*¿Qué hacemos?*(우리 뭐 하지?)는 실용적인 질문이에요.'
  es.a1.unit12.lesson06.teach.line05:
    title: 안심시키고 해결책 제안하기
    gloss: 엘레나가 걱정하지 말라고, 다시 시작하면 된다고 말해요.
    note: '*no te preocupes*와 *podemos empezar de nuevo*를 합친 표현이에요.'
  es.a1.unit12.lesson06.teach.line06:
    title: 동의하고 다시 시도하기
    gloss: 마테오가 동의하며 다시 해 보자고 제안해요.
    note: '*Vamos a intentarlo otra vez*(그것을 다시 해 보자)는 앞 단원의 *vamos a* + 동사원형 구조에 목적격 대명사 *lo*가 더해진 표현이에요.'
  es.a1.unit12.lesson06.teach.line07:
    title: 성공 알리기
    gloss: 엘레나가 이제 케이크가 완벽하다고 알려요.
    note: '*¡Mira!*(봐!)는 주의를 끄는 감탄사예요. *el pastel*(케이크)은 이 소동의 중심에 있는 음식이에요.'
  es.a1.unit12.lesson06.teach.line08:
    title: 기뻐하며 자랑스러움 표현하기
    gloss: 마테오가 기뻐하며 둘 다 자랑스럽다고 말해요.
    note: '*¡Qué bien!*(정말 잘됐다!)은 *¡Qué calor!*처럼 *¡Qué...!* 감탄 구조를 써요. *de nosotros*(우리가)는 *estoy orgulloso de ti*를 여럿으로 확장한 표현이에요.'
  es.a1.unit12.lesson06.teach.line09:
    title: 자랑스러움 함께 나누기
    gloss: 엘레나도 자랑스럽다며 함께 해냈다고 말해요.
    note: '*Lo logramos juntos*(우리가 함께 해냈어요)는 마무리에 어울리는 자연스러운 말이에요. *lograr*(해내다)는 여기서 처음 나와요.'
