teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: ~보다 더
    gloss: ~보다 더
    note: '*Más...que*는 서로 다른 두 양이나 대상을 비교해요. 아래 문법 설명을 보세요.'
    example_gloss: 새 아파트는 오래된 아파트보다 더 커요.
  es.a1.unit15.lesson01.teach.menos_que:
    title: ~보다 덜
    gloss: ~보다 덜
    note: '*Menos...que*는 *más...que*의 반대예요.'
    example_gloss: 오래된 아파트는 새 아파트보다 덜 커요.
  es.a1.unit15.lesson01.teach.tan_como:
    title: ~만큼
    gloss: ~만큼
    note: '*Tan...como*는 같은 두 대상을 비교해요. *más/menos*와는 확실히 다른 구문이고, 같은 뜻을 다르게 말한 표현이 아니에요.'
    example_gloss: Mateo는 Elena만큼 요리를 잘해요.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: 차이 비교와 동등 비교
    gloss: más/menos...que와 tan...como의 차이
    note: 카드 본문을 참고하세요.
    target_text: '*Más...que*(~보다 더)와 *menos...que*(~보다 덜)는 서로 다른 두 대상이나 양을 비교해요. *Tan...como*(~만큼)는 같은 두 대상을 비교하는 별개의 구문이에요. *más/menos*의 동의어가 아니에요.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: 새 아파트 비교하기
    gloss: 새 아파트는 오래된 아파트보다 더 커요.
    note: '*Más grande que*(~보다 더 큰)는 *grande*(큰)를 *más...que* 구문 안에 넣은 표현이에요.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: 오래된 아파트 비교하기
    gloss: 오래된 아파트는 새 아파트보다 더 작아요.
    note: '*Más pequeño que*(~보다 더 작은)는 *pequeño*(작은)를 써서 반대 방향에서 비교를 말해요.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: 어느 쪽이 더 큰지 묻기
    gloss: 어느 아파트가 더 큰가요?
    note: '*¿Cuál...?*(어느 ~?)에 비교급 형용사를 붙이면 둘을 비교해서 물을 때 쓰는 기본 표현이에요.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: 어느 쪽이 더 큰지 대답하기
    gloss: 새 아파트가 옛 아파트보다 더 커요.
    note: 같은 비교 표현을 이번에는 *¿cuál...?* 질문에 대한 직접적인 대답으로 썼어요. *el nuevo*(새것)는 반복되는 명사를 생략한 말이에요.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: 요리 실력을 동등하게 비교하기
    gloss: Mateo는 Elena만큼 요리를 잘해요.
    note: '*Tan bien como*(~만큼 잘)는 *tan* + 부사 + *como* 형태로, 크기가 아니라 동작의 방식에 쓰인 동등 비교 표현이에요.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: 우리는 좋은 팀이라고 말하기
    gloss: 우리는 좋은 팀이에요.
    note: '*Somos*(우리는 ~이다) + *un buen equipo*(좋은 팀)는 동등 비교 뒤에 마무리로 하기 좋은 자연스러운 말이에요.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: 두 아파트 비교하기
    gloss: 마테오의 옛 아파트는 주방이 작아요. 새 아파트는 더 크고, 주방도 더 커요. 옛 아파트는 새 아파트보다 더 작아서, 마테오는 이사하고 싶어 해요. 새 아파트는 요리할 공간이 더 많아요.
    note: 두 아파트를 비교한 실제적인 요약이에요.
    glosses:
      viejo: 오래된
      tiene: 가지고 있다 (tener의 활용형)
      pequeña: 작은
      nuevo: 새로운
      grande: 큰
      también: ~도 / 또한
      pequeño: 작은
      eso: ~보다 / ~라는 것
      quiere: 원하다 (querer의 활용형)
      mudarse: 이사하다
      espacio: 공간
      cocinar: 요리하다
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (그래서)
    gloss: por eso가 이유와 결과를 잇는 방법이에요.
    note: 카드 본문을 참고하세요.
    target_text: '*Por eso*(그래서)는 이유와 결과를 이어 줘요. 주방이 작아서 Mateo가 이사하고 싶어 하는 거예요. 이미 배운 *porque*와 같은 원인과 결과의 논리예요.'
  es.a1.unit15.lesson06.teach.line01:
    title: 본 적 있는지 묻기
    gloss: 엘레나가 마테오에게 새 아파트를 벌써 봤는지 물어요.
    note: '*¿Ya viste...?*(벌써 ~를 봤어요?)는 새로 배우는 과거 시제 질문 형태예요.'
  es.a1.unit15.lesson06.teach.line02:
    title: 더 크다고 확인해 주기
    gloss: 마테오가 새 아파트가 옛 아파트보다 크고 주방도 크다고 확인해 줘요.
    note: '*más...que* 비교에 *la cocina también*(주방도)을 덧붙인 문장이에요.'
  es.a1.unit15.lesson06.teach.line03:
    title: 어느 쪽이 더 작은지 묻기
    gloss: 엘레나가 그럼 어느 아파트가 더 작은지 물어요.
    note: '*Entonces*(그럼, 그래서)는 전에 본 논리 연결어예요. 질문은 *grande* 대신 *pequeño*를 쓴 *¿Cuál...?* 형태예요.'
  es.a1.unit15.lesson06.teach.line04:
    title: 대답하고 이유 설명하기
    gloss: 마테오가 옛 아파트가 더 작고, 그래서 이사하고 싶다고 말해요.
    note: '*El viejo es más pequeño que el nuevo*에 *por eso quiero mudarme*(그래서 이사하고 싶어요)를 이어 말했어요.'
  es.a1.unit15.lesson06.teach.line05:
    title: 일리 있다고 동의하기
    gloss: 엘레나가 일리 있다고, 새 아파트에 요리할 공간이 더 많다고 말해요.
    note: '*Tiene mucho sentido*(아주 일리 있어요)는 새로 배우는 동의 표현이에요. *más espacio para cocinar*는 요리할 공간이 더 많다는 뜻이에요.'
  es.a1.unit15.lesson06.teach.line06:
    title: 추론 이어가기
    gloss: 마테오가 동의하며, 엘레나도 자기만큼 요리를 잘하니 둘이 쓸 공간이 필요하다고 덧붙여요.
    note: '*Tan bien como*(~만큼 잘)를 *tú cocinas*(너는 요리해)와 함께 대화에서 쓴 예예요.'
  es.a1.unit15.lesson06.teach.line07:
    title: 칭찬 돌려주기
    gloss: 엘레나가 신나게 맞장구치며 마테오도 자기만큼 요리를 잘한다고 말해요.
    note: '*¡Es verdad!*(맞아요!) + *tú cocinas tan bien como yo*(너도 나만큼 요리를 잘해) -- 같은 *tan bien como* 비교를 마테오에게 돌려준 말이에요.'
  es.a1.unit15.lesson06.teach.line08:
    title: 팀워크로 마무리하기
    gloss: 마테오가 둘은 좋은 팀이라고 마무리해요.
    note: '*Somos un buen equipo*(우리는 좋은 팀이에요)로 대화를 마무리해요.'
