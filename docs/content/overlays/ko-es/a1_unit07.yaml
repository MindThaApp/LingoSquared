    title: 시장
  es.a1.unit07.lesson02.preguntar_el_precio:
    title: 가격 묻기
  es.a1.unit07.lesson03.cantidades:
    title: '수량: 열두 개, 킬로, 약간'
  es.a1.unit07.lesson04.una_compra_sencilla:
    title: 간단한 구매
  es.a1.unit07.lesson05.leer_las_etiquetas_de_precio:
    title: 가격표 읽기
  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: 엘레나와 마테오가 시장에 가요
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: 시장
    gloss: 시장
    note: '*Mercado*는 남성 명사예요.'
    example_gloss: 시장에 가요.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: 과일, 채소
    gloss: 과일, 채소
    note: '*Verdura*는 채소 전반(주로 푸른 채소)을 뜻해요. 여성 단수 명사이면서 채소를 통틀어 가리키는 집합적인 뜻으로도 써요.'
    example_gloss:
    - 과일을 사고 싶어요.
    - 채소가 신선해요.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: 달걀, 빵
    gloss: 달걀, 빵
    note: '*Huevos*는 이미 복수형이에요(단수형은 *huevo*). *pan*(빵)은 셀 수 없는 물질명사라서 일상적인 뜻으로는 자연스러운 복수형이 없어요.'
    example_gloss:
    - 저는 달걀이 필요해요.
    - 이 빵은 오늘 아침에 만든 거예요.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: 가격 묻기
    gloss: 얼마예요?
    note: '*Cuesta*는 *costar*(값이 나가다)의 3인칭 형태로, 이 단元에서 처음 나오는 동사예요.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: 가격 묻기, 다른 표현
    gloss: 얼마예요?
    note: '*¿Cuánto cuesta?*와의 비교는 다음 문법 설명을 보세요.'
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: 가격 말하기
    gloss: 2예요.
    note: 짧지만 완전한 가격 대답이에요. 통화 단위는 상황에서 알 수 있기 때문에, 한국어에서도 물건을 살 때 숫자만 말하는 경우가 많아요.
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta와 Cuánto es
    gloss: 가격을 묻는 똑같이 자연스러운 두 가지 표현이에요.
    note: 카드 본문을 보세요.
    target_text: '*¿Cuánto cuesta?*(얼마예요?)와 *¿Cuánto es?*(얼마예요?)는 둘 다 가격을 묻는 자연스러운 표현이에요. 일상적인 쇼핑 상황에서는 서로 바꿔 쓸 수 있어요.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: 달걀 한 판 주문하기
    gloss: 달걀 한 다스 주세요.
    note: 스페인어에서 *docena*(다스)는 명사라서 항상 *de*와 품목이 뒤따라요. 한국어의 '달걀 한 다스'처럼 쓰는 것과 어순이 달라요.
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: 토마토 1킬로 주문하기
    gloss: 토마토 1킬로 주세요.
    note: '*Kilo*도 *docena*와 같이 *de* + 품목의 형태로 써요.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: 반 킬로
    gloss: 반 킬로
    note: '*Medio*(반)는 꾸미는 명사 앞에 오고 성에 맞춰 바뀌어요(*medio kilo*는 남성, *media docena*는 여성).'
    example_gloss: 빵 반 킬로 주세요.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: 조금의
    gloss: 조금의
    note: '*Un poco de*는 정확한 양이 필요하지 않을 때 적은 양을 대략 나타내는 표현이에요.'
    example_gloss: 저는 과일을 조금 원해요.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: 더 필요한지 묻기
    gloss: 더 필요하세요?
    note: '*Necesita*는 *necesitar*의 *usted* 형태로, 상인이 손님에게 흔히 쓰는 공손한 표현이에요.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: 다 있다고 말하기
    gloss: 아니요, 이미 다 있는 것 같아요.
    note: '*Creo que*(~라고 생각해요)는 말을 부드럽게 만드는 흔한 표현으로, 여기서는 장보기 목록이 다 갖춰졌다는 뜻이에요.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: 상인에게 감사 인사하기
    gloss: 좋아요, 감사합니다.
    note: 물건을 사고 나서 하는 짧고 자연스러운 마무리 인사예요.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: 가격표 읽기
    gloss: '로사의 가판대: 토마토 1킬로에 2. 달걀 한 다스에 4. 빵 6. 신선한 과일 매일.'
    note: 전형적인 시장 가판대 가격표예요. 품목, 가격, 그리고 그 가격이 적용되는 단위(*el kilo*, *la docena*) 순서예요. *Puesto*는 시장 가판대이고, 이곳은 로사가 운영해요.
    glosses:
      Puesto: 가판대
      tomates: 토마토
      kilo: 킬로
      Huevos: 달걀
      docena: 다스
      Pan: 빵
      Fruta: 과일
      fresca: 신선한
      todos: 매
      días: 날, 일
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: 'El kilo: ''킬로당''의 뜻'
    gloss: 가격 뒤의 단위 단어가 '~당'을 뜻하는 방식이에요.
    note: 카드 본문을 보세요.
    target_text: 가격 뒤의 *el kilo*("tomates, dos el kilo")는 "킬로당"이라는 뜻이에요. 산 킬로 하나하나에 그 가격이 적용돼요.
  es.a1.unit07.lesson06.teach.line01:
    title: 시장에 가자고 제안하기
    gloss: 엘레나가 다음 수업 재료를 사러 시장에 가자고 제안해요.
    note: '*Para la próxima clase*는 ''다음 수업을 위해''라는 뜻으로, 요리 워크숍의 다음 시간을 가리켜요.'
  es.a1.unit07.lesson06.teach.line02:
    title: 동의하고 무엇이 필요한지 묻기
    gloss: 마테오가 동의하며 무엇이 필요한지 물어요.
    note: '*¿Qué necesitamos?*는 *necesitar*의 *nosotros* 형태로, 함께 ''우리가 필요한 것''을 묻는 말이에요.'
  es.a1.unit07.lesson06.teach.line03:
    title: 신선한 토마토 가리키기
    gloss: 엘레나가 먼저 신선한 채소라고 말하고, 토마토가 얼마나 신선한지 짚어 줘요.
    note: '*¡Qué tomates tan frescos!*(토마토가 정말 신선하네요!)는 *qué*를 쓴 감탄문이에요. 3과의 *¡Qué bonito!*와 비슷하지만 명사가 들어가서 *qué* + 명사 + *tan* + 형용사 구조예요.'
  es.a1.unit07.lesson06.teach.line04:
    title: 상인이 수량을 묻기
    gloss: 상인이 엘레나에게 얼마나 원하는지 물어요.
    note: '*Señorita*는 젊은 여성을 부르는 공손한 호칭으로, 상인이 손님에게 쓰는 *usted* 어투와 어울려요(요즘에는 조금 예스럽다고 느끼는 사람도 있어요).'
  es.a1.unit07.lesson06.teach.line05:
    title: 1킬로 주문하고 가격 묻기
    gloss: 엘레나가 1킬로를 달라고 하고 가격을 물어요.
    note: 이 단원 앞부분의 *un kilo*와 *¿Cuánto cuesta?*를 한 번의 자연스러운 대화로 합친 표현이에요.
  es.a1.unit07.lesson06.teach.line06:
    title: 가격 말하기
    gloss: 상인이 2라고 말해요.
    note: '*Cuesta dos*는 짧은 가격 대답이며, 통화 단위는 상황에서 알 수 있어요.'
  es.a1.unit07.lesson06.teach.line07:
    title: 마테오가 달걀과 빵 주문하기
    gloss: 마테오가 달걀 한 다스와 빵이 필요하다고 말해요.
    note: 이 단원 앞부분의 *huevos*/*pan*과 *una docena de*를 합친 문장이에요. *yo*는 생략해도 되고, 쓰면 '저는'처럼 조금 강조하는 느낌이 나요.
  es.a1.unit07.lesson06.teach.line08:
    title: 상인이 두 가격을 말하기
    gloss: 상인이 달걀은 4, 빵은 6이라고 말해요.
    note: '*Cuestan*(복수형)은 복수 주어 *los huevos*에 맞춘 형태예요. 토마토에 쓴 단수형 *cuesta*와 구별해야 해요.'
  es.a1.unit07.lesson06.teach.line09:
    title: 상인에게 감사 인사하기
    gloss: 마테오가 좋다고 하며 감사 인사를 해요.
    note: 이 단원 앞부분과 같은 짧은 마무리 인사예요.
  es.a1.unit07.lesson06.teach.line10:
    title: 친구에게 더 필요한지 묻기
    gloss: 엘레나가 마테오에게 더 필요한 게 있는지 물어요.
    note: '*¿Necesitas...?*는 친구에게 쓰는 *tú* 형태이고, 상인이 쓰는 *¿Necesita...?*는 *usted* 형태예요.'
  es.a1.unit07.lesson06.teach.line11:
    title: 다 있다고 말하기
    gloss: 마테오가 아니요, 이미 다 있는 것 같다고 말해요.
    note: '*Creo que*(~라고 생각해요)는 대답을 부드럽게 해 주고, *ya*는 ''이미''라는 뜻이에요.'
