teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: 일어나기
    gloss: 일어나다 → 저는 일어나요
    note: '*Levantarse*는 재귀동사예요. 대명사 *me*가 동사 앞에 와서 *Me levanto*가 돼요.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: 옷 입기
    gloss: 옷을 입다 → 저는 옷을 입어요
    note: '*Vestirse*도 재귀동사예요: *Me visto*. 여기서 *me*는 ''나 자신을''이라는 뜻이에요.'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: 아침 먹기
    gloss: 아침을 먹다 → 저는 아침을 먹어요
    note: '*Desayunar*는 재귀동사가 아니에요. *me* 없이 *Desayuno*라고 해요.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: 직업
    gloss: 일하다 → 저는 일해요
    note: '*Trabajar*는 규칙 -ar 동사예요. *yo* 형은 -o로 끝나요: *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: 먹다
    gloss: 먹다 → 저는 먹어요
    note: '*Comer*는 규칙 -er 동사예요. *yo* 형은 -o로 끝나요: *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: 설거지하다
    gloss: 설거지하다 → 저는 설거지를 해요
    note: '*Lavar los platos*는 재귀 동사가 아니에요: *Lavo los platos*. 목적어 *los platos*는 동사 뒤에 그대로 와요.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: 자다
    gloss: 자다 → 저는 자요
    note: '*Dormir*는 *yo* 형에서 어간 모음이 바뀌어요: *duermo* (o가 ue로 바뀜).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: 재귀 동사의 형태
    gloss: 'levantarse와 vestirse는 대명사가 동사 앞에 와요: levantarse → Me levanto.'
    note: '재귀 동사에서는 활용한 동사 앞에 *me*를 놓아요: *Levanto me*가 아니라 *Me levanto*라고 해요.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: 문장 속의 Levantarse
    gloss: '일어나다: 저는 7시에 일어나요.'
    note: '시간 표현은 동사 뒤에 와요: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: 문장 속의 Vestirse
    gloss: '옷을 입다: 저는 옷을 입어요.'
    note: 형태는 *me* + *visto*예요. 대명사가 동사 바로 앞에 있어요.
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: 문장 속의 Lavar los platos
    gloss: '설거지하다: 저는 식사 후에 설거지를 해요.'
    note: '*Después de comer*(''먹은 후에'')는 *de* 뒤에 동사원형을 쓰고, 문장 끝에 올 수 있어요.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: me가 없는 동사
    gloss: '대명사 없이: 저는 아침을 먹어요. 저는 일해요. 저는 자요. 이 동사들은 재귀 동사가 아니에요.'
    note: '*Desayuno*, *trabajo*, *duermo*에는 *me*가 없어요. 이 동사들은 재귀 동사가 아니에요.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: 7시 반에 일어나요
    gloss: 저는 7시 30분에 일어나요.
    note: '스페인어에서는 ''반(30분)''을 *y media*로 말해요: *las siete y media*는 7시 30분이에요. 시각 앞에는 *a las*를 써요.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: 8시 15분 전에 옷을 입어요
    gloss: 저는 7시 45분에 옷을 입어요.
    note: '*Las ocho menos cuarto*는 다음 정각에서 거꾸로 세요: 7시 45분이에요.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: 8시에 아침을 먹어요
    gloss: 저는 8시에 아침을 먹어요.
    note: '시각 앞에는 *a las*를 써요: *a las ocho*. 1시일 때는 *a la una*예요.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: 9시부터 5시까지 일해요
    gloss: 저는 9시부터 5시까지 일해요.
    note: '*De ... a ...*는 시작 시각과 끝 시각을 나타내요: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: 6시 반에 먹어요
    gloss: 저는 오후 6시 30분에 먹어요.
    note: '*De la tarde*는 저녁 시간임을 분명히 해요. 그래서 여기서 *las seis y media*는 18:30이에요.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: 11시에 자요
    gloss: 저는 11시에 자요.
    note: '시각 앞에는 *a las*를 써요: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: 먼저, 그다음, 그 후에
    gloss: 먼저, 그다음, 그 후에
    note: '*Primero*는 첫 번째 활동, *luego*는 그다음 활동, *después*는 그 뒤에 오는 활동을 나타내요.'
    example_gloss:
    - 먼저 저는 일어나요.
    - 그다음에 저는 옷을 입어요.
    - 그 후에 저는 아침을 먹어요.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: 세 단계로 된 아침
    gloss: 먼저 저는 일어나요. 그다음에 옷을 입어요. 그 후에 아침을 먹어요.
    note: '재귀 동사는 동사 앞에 *me*를 그대로 둬요: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: 순서를 나타내는 말
    gloss: 'Primero, luego, después는 하는 일의 순서를 나타내요. 동사는 변하지 않아요: Después desayuno.'
    note: '순서를 나타내는 말은 문장 맨 앞에 오고, 동사 형태는 변하지 않아요: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: 나의 하루
    gloss: 나의 하루 — 저는 7시 30분에 일어나요. 그 후에 옷을 입고, 8시에 아침을 먹어요. 9시부터 5시까지 일해요. 오후 6시 30분에 밥을 먹어요. 그 후에 설거지를 해요. 11시에 자요.
    note: 활동의 순서와 시각을 모두 살펴보며 읽어 보세요. *me levanto*와 *me visto*에 *me*가 있다는 점도 눈여겨보세요.
    glosses:
      Mi: 나의
      día: 날
      levanto: 일어나다 (me levanto)
      media: 반, 30분 (y media = 반)
      ocho: 여덟
      Después: 그 후에
      visto: 옷을 입다 (me visto)
      las: '정관사 (시각 앞: las ocho)'
      desayuno: 아침을 먹다
      Trabajo: 일하다
      nueve: 아홉
      cinco: 다섯
      siete: 일곱, 7
      tarde: 저녁에, 오후에
      como: 먹다
      lavo: 설거지하다 (lavo los platos)
      once: '11'
      duermo: 자다
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: 하루에 대해 묻기
    gloss: '엘레나: 마테오, 네 하루는 어때?'
    note: '*¿Cómo es tu día?*는 상대에게 하루가 어떤지 편하게 묻는 말이에요. *tu*는 친근한 ''너의''예요.'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: 마테오의 아침
    gloss: '마테오: 나는 7시 30분에 일어나. 그 후에 옷을 입고, 8시에 아침을 먹어.'
    note: 마테오는 *después*와 *y*로 아침 활동 세 가지를 이어서 말해요.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: 마테오의 근무 시간
    gloss: '엘레나: 너는 언제 일해? 마테오: 나는 9시부터 5시까지 일해.'
    note: '엘레나와 마테오는 서로 친근한 *tú* 형태를 써요: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: 마테오의 저녁
    gloss: '마테오: 오후 6시 30분에 밥을 먹어. 그 후에 설거지를 해. 11시에 자.'
    note: '*Después*가 문장 맨 앞에 와도 동사 형태는 그대로예요: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: 엘레나의 아침
    gloss: '엘레나: 나는 6시에 일어나지만, 6시 30분이 되어서야 아침을 먹어.'
    note: '*No ... hasta*는 ''~까지는 ...하지 않다'', 즉 ''~에야 ...하다''라는 뜻이에요. 엘레나는 일어나는 시각과 아침 먹는 시각을 대비해서 말해요.'
