answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: 계획을 제안하고, 수락하고, 거절하고, 일정을 정하고, 간단한 계획을 읽고 쓰는 초급 스페인어예요.
units:
  es.a1.unit50.plans:
    title: 간단한 약속 잡기
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: 활동 제안하기
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: 약속 수락하거나 거절하기
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: 날짜와 시간 정하기
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: 초대 메시지 읽기
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: 약속 쓰고 확인하기
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: 엘레나와 마테오가 약속을 잡아요
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: 함께
    gloss: 함께
    note: '*Juntos*는 사람들이 그 활동을 함께 한다는 것을 분명히 해 줘요. 함께하는 사람들에 맞춰 형태가 바뀌어요. 모두 여자이면 *juntas*라고 해요.'
    example_gloss: 우리 같이 커피 마실까요?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: 커피 마시기
    gloss: 커피를 마시다
    note: 스페인어는 '커피를 마시다'를 *tomar un café*("커피 한 잔을 취하다")라고 말하고, 동사 "beber"를 쓰지 않는 것이 일반적이에요.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: 영화 보러 가기
    gloss: 영화 보러 가다
    note: '*Ir al cine*("영화관에 가다")는 영화를 보러 간다고 할 때 흔히 쓰는 말이에요. *al*은 *a* + *el*이에요.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: 커피 마실까요?
    gloss: 커피 마실까요?
    note: '*¿Tomamos ...?*는 *nosotros* 현재형으로, 무언가를 함께 하자고 제안할 때 써요.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: ¿Tomamos ...? 사용하기
    gloss: ¿Tomamos + 무엇?은 무언가를 함께 하자고 제안할 때 흔히 쓰는 표현이에요.
    note: '*nosotros* 형태(*tomamos*)는 한국어의 ''~할까요?''처럼 함께 하자는 제안으로 쓰여요. *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: 영화 보러 가고 싶어요?
    gloss: 영화 보러 가고 싶어요?
    note: '*¿Tienes ganas de ...?*는 상대방이 무언가를 하고 싶은지 편하게 묻는 표현이에요. *de* 뒤에는 동사원형이 와요.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: 네, 좋아요!
    gloss: 네, 좋아요!
    note: '*¡Sí, qué bien!*은 기쁜 마음으로 짧게 제안을 받아들이는 표현이에요.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: 좋은 생각이에요
    gloss: 좋은 생각이에요!
    note: '*¡Buena idea!*는 제안을 칭찬하면서 받아들이는 표현이에요.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: 좋은 계획이에요
    gloss: 좋은 계획이네요.
    note: 조금 더 완전한 문장으로 긍정적으로 답하는 표현이에요.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: 이유를 들어 거절하기
    gloss: 미안해요, 일해야 해서 못 가요.
    note: '*Lo siento*는 거절을 부드럽게 만들고, *porque*는 짧은 이유를 이끌어요.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: 시간이 없어요
    gloss: 시간이 없어요.
    note: '*No tengo tiempo*는 직접적이지만 평범한 거절 이유예요. *no*는 동사 앞에 와요.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: 친절한 거절
    gloss: Lo siento + no puedo + 짧은 이유를 말하면 거절이 친절해져요.
    note: 대화에서 이유는 꼭 필요하지는 않지만, 말하면 더 공손하고 자연스러워요.
  es.a1.unit50.lesson03.teach.quedar:
    title: 만나기로 약속하다
    gloss: 만나기로 약속하다
    note: '*Quedar*는 만날 약속을 정한다는 뜻이에요: *¿Quedamos el viernes?* 많은 라틴아메리카 사람들은 대신 *¿Nos vemos el viernes?*라고 말해요.'
    example_gloss: 금요일 2시 반에 만날까요?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: 금요일 2시 반에 만나요
    gloss: 금요일 2시 반에 만날까요?
    note: 요일 *el viernes*에 *a las*와 시각을 더한 표현이에요.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media는 30분이에요
    gloss: las dos y media = 2시 반; a las dos y media는 약속 시간을 나타내요.
    note: 스페인어는 방금 지난 정각을 기준으로 말해요. *las dos y media*는 2시 30분이고, 직역하면 "2시와 반"이에요.
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: 날짜와 시간
    gloss: 4월 17일 금요일 3시 15분에
    note: '스페인어에서 요일과 달 이름은 소문자로 쓰고, 날짜에는 *de*를 써요: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: 시간 확인하기
    gloss: 네, 금요일 2시 반 좋아요.
    note: '*Me viene bien*("저한테 맞아요")은 제안된 시간이 괜찮다는 뜻이에요.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: 메시지, 초대, 언어 카페
    gloss: 메시지, 초대, 언어 카페
    note: '*Un mensaje*는 짧은 문자나 디지털 메시지, *una invitación*은 활동에 함께하자는 초대, *el café de idiomas*는 모임 장소예요.'
    example_gloss:
    - 엘레나한테서 메시지가 왔어요.
    - 언어 카페 초대장이에요.
    - 우리는 언어 카페에서 커피를 마셔요.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: 엘레나의 초대
    gloss: 안녕 마테오, 4월 18일 토요일 2시 반에 언어 카페에서 커피 마실래? 그럼 안녕, 엘레나.
    note: 활동, 날짜, 시간, 장소의 네 가지 정보를 찾으며 읽어 보세요.
    glosses:
      Hola: 안녕
      ganas: 욕구 (tener ganas de = ~하고 싶다)
      sábado: 토요일
      abril: 4월
      media: 반, 30분 (y media = 반)
      dos: 둘
      café: 커피
      tomar: 마시다 / 먹다
      idiomas: 언어 카페
      saludo: 안부 인사
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: 제안 메시지
    gloss: 안녕 마테오, 금요일 2시 반에 커피 마실까? 그럼 안녕, 엘레나.
    note: 이 메시지에는 인사, 활동, 요일, 시간, 맺음말이 들어 있어요.
    glosses:
      Hola: 안녕
      vamos: ~할까요
      viernes: 금요일
      media: 반, 30분 (y media = 반)
      dos: 둘
      café: 커피
      tomar: 마시다 / 먹다
      saludo: 안부 인사
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: 확인 메시지
    gloss: 안녕 엘레나, 응, 좋아! 금요일 2시 반 괜찮아. 금요일에 보자! 마테오.
    note: 답장에서는 활동을 받아들이고, 일정을 다시 말해 확인해요.
    glosses:
      Hola: 안녕
      bien: 좋다 / 좋아요
      viernes: 금요일
      media: 반, 30분 (y media = 반)
      dos: 둘
      viene: 좋게 / 잘 맞다
      Hasta: ~까지 / 또 만나요
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: 메시지에 들어가는 내용
    gloss: 짧은 메시지에는 활동, 요일이나 날짜, 시간을 써요.
    note: 인사와 맺음말도 쓸모 있지만, 가장 중요한 정보는 활동과 그것이 열리는 때예요.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: 엘레나가 커피를 제안해요
    gloss: '엘레나: 금요일에 커피 마실까요? 마테오: 네, 좋아요! 몇 시에요?'
    note: 마테오는 시간을 묻기 전에 먼저 활동을 받아들여요.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: 엘레나가 말한 첫 번째 시간
    gloss: '엘레나: 2시 반에요.'
    note: '*Las dos y media*는 시간 말하기 수업에서 배운 대로 2시 30분이에요.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: 마테오가 다른 시간을 제안해요
    gloss: '마테오: 미안해요, 2시 반에는 안 돼요. 3시 15분은 어때요?'
    note: '*¿Puede ser a ...?*는 다른 시간이 가능한지 간단히 묻는 표현이에요.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: 최종 계획을 확인해요
    gloss: '엘레나: 네, 3시 15분 좋아요. 마테오: 좋은 계획이에요. 그럼 금요일 3시 15분에 만나요.'
    note: 여기서 *quedamos*는 다시 *nosotros* 형태이고, 이번에는 계획을 확정해요.
exercises:
