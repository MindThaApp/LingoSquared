  es.a1.unit50.lesson02.exercise01.choose_accept:
    instruction: 제안을 받아들이는 답을 고르세요.
    correct_option: ¡Sí, qué bien!
    distractors:
    - Lo siento, no puedo.
    - No tengo tiempo.
    - No, trabajo.
    accepted_answers:
    - value: ¡Sí, qué bien!
      status: correct
    feedback: ¡Sí, qué bien!은 친근하게 받아들이는 표현이에요.
  es.a1.unit50.lesson02.exercise02.listen_accept:
    instruction: 듣고 화자가 수락하는지 거절하는지 고르세요.
