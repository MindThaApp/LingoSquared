    pairs:
    - left: ¿Tomamos ...?
      right: ~할까요?
    - left: ¿Tienes ganas de ...?
      right: ~하고 싶어요?
  es.a1.unit50.lesson01.exercise05.order_coffee:
    instruction: 단어를 순서대로 놓아 커피를 마시자고 제안해 보세요.
    correct_option: Tomamos un café
    accepted_answers:
    - value: Tomamos un café
      status: correct
    feedback: '*¿Tomamos un café?*는 동사로 시작하고, 그다음에 목적어가 와요.'
  es.a1.unit50.lesson01.exercise06.listen_order_film:
    instruction: 들리는 순서대로 단어를 배열하세요.
    correct_option: Tienes ganas de ir al cine
    accepted_answers:
    - value: Tienes ganas de ir al cine
      status: correct
    feedback: 완전한 질문은 *¿Tienes ganas de ir al cine?*예요.
  es.a1.unit50.lesson01.exercise07.speak_proposal:
    instruction: 스페인어로 함께 커피를 마시자고 제안해 보세요. 소리 내어 말한 다음 입력하세요.
    accepted_answers:
    - value: ¿Tomamos un café?
      status: correct
    - value: Tomamos un café
      status: correct
    feedback: ¿Tomamos un café?
    prompt_blocks:
    - 함께 커피를 마시자고 제안해 보세요.
  es.a1.unit50.lesson01.exercise08.dictation_zullen_we_koffie_drinken:
    instruction: 들리는 대로 입력하세요.
