  es.a1.unit03.lesson01.exercise02.select_hermana:
    instruction: '"언니/여동생(여자 형제)"을 뜻하는 단어는 무엇일까요?'
    correct_option: hermana
    distractors:
    - hermano
    - hija
    accepted_answers:
    - hermana
  es.a1.unit03.lesson01.exercise03.match_family_words:
    instruction: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요.
    correct_response:
      madre: 어머니
      padre: 아버지
      hermano: 남자 형제
      hermana: 여자 형제
      hijo: 아들
      hija: 딸
    pairs:
    - left: madre
      right: 어머니
    - left: padre
      right: 아버지
    - left: hermano
      right: 남자 형제
    - left: hermana
      right: 여자 형제
    - left: hijo
      right: 아들
    - left: hija
      right: 딸
  es.a1.unit03.lesson01.exercise04.listen_madre:
    instruction: 잘 듣고 들리는 표현을 고르세요.
    correct_option: Mi madre
    distractors:
    - Mi padre
    - Mi hermana
