  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 스페인어 A1
  description: 엘레나와 마테오의 요리 워크숍 이야기를 1~2과에 이어서, 직계 가족과 확대 가족 어휘, 소유 형용사, 가정 소개를 배워요. 소유 형용사(mi/tu/su)의 쓰임과 성별이 드러나는 가족 명사를 특히 짚어 줘요.
units:
  es.a1.unit03.family:
    title: 엘레나와 마테오의 가족
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: 가까운 가족
  es.a1.unit03.lesson02.possessives_and_asking:
    title: '소유 형용사: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: 친척
  es.a1.unit03.lesson04.describing_family_size:
    title: 집에 몇 명이 있나요
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: 가족 소개글 읽기
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: 엘레나, 마테오와 함께 보는 가족사진
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: 어머니
    gloss: 어머니
    note: '*Madre*는 여성 명사예요. 가족끼리는 *mamá*를 더 흔히 쓰고, *madre*는 중립적인 말이라 이 과정의 어휘 목록에서 사용해요.'
  es.a1.unit03.lesson01.teach.padre:
    title: 아버지
    gloss: 아버지
    note: '*Padre*는 남성 명사예요. *Papá*는 일상에서 쓰는 말로, *madre*/*mamá*와 같은 관계예요.'
  es.a1.unit03.lesson01.teach.hermano:
    title: 형, 오빠, 남동생
    gloss: 남자 형제
    note: '*Hermano*는 남성 단수예요.'
  es.a1.unit03.lesson01.teach.hermana:
    title: 누나, 언니, 여동생
    gloss: 여자 형제
    note: '*Hermana*는 여성 단수예요.'
  es.a1.unit03.lesson01.teach.hijo:
    title: 아들
    gloss: 아들
    note: '*Hijo*는 남성 단수예요.'
  es.a1.unit03.lesson01.teach.hija:
    title: 딸
    gloss: 딸
    note: '*Hija*는 여성 단수예요.'
  es.a1.unit03.lesson01.teach.padres:
    title: 부모님
    gloss: 부모님
    note: '*Padres*(남성 복수)는 어머니와 아버지를 함께 가리킬 수 있어요. 스페인어에서는 남성이 한 명이라도 포함된 무리를 남성 복수형으로 말해요.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: 형제자매
    gloss: 형제자매; 형제
    note: '*Hermanos*는 ''형제''(모두 남자)나 ''형제자매''(남녀 섞인 무리)를 뜻할 수 있어요. *padres*와 같이 남성 복수형이 섞인 무리를 함께 가리키는 규칙을 따라요.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: 나의 가족
    gloss: 나의 가족
    note: '*Mi*(악센트 없음)는 ''나의''를 뜻하는 소유 형용사예요. 성에 따라 변하지 않고 수에 따라서만 변해요(복수 명사 앞에서는 *mis*).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: 너의 가족 (친근한 표현)
    gloss: 너의 가족
    note: '*Tu*(악센트 없음, 대명사 *tú*와 달라요)는 친근한 표현의 소유 형용사로, 1과에서 배운 *tú*와 짝을 이뤄요.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: 당신의/그의/그녀의 가족 (격식 있는 표현 또는 3인칭)
    gloss: 그의/그녀의/당신의 가족
    note: '*Su*는 ''그의'', ''그녀의'', 그리고 격식 있는 ''당신의''(*usted*)를 모두 뜻해요. 소유 형용사만으로는 이들을 구분하지 않고, 문맥으로 뜻을 알 수 있어요.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: 형제자매에 대해 묻기
    gloss: 형제자매가 있어요?
    note: '*Tienes*는 *tener*의 *tú* 형태로, 2과에서 나이를 말할 때 쓴 동사와 같아요.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: 형제자매 수 말하기
    gloss: 저는 자매가 두 명 있어요.
    note: '*Tengo*(저는 있어요)에 숫자와 가족 명사를 붙이면 형제자매를 소개하는 기본 표현이 돼요.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: 대가족인지 묻기
    gloss: 너희 가족은 대가족이에요?
    note: '*Grande*(큰)는 성에 따라 변하지 않고 수에 따라서만 변해요(*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: 작은 가족 소개하기
    gloss: 우리 가족은 식구가 적어요.
    note: '*Pequeña*는 여성 명사 *familia*에 맞춘 형태예요. 남성 명사와 함께 쓸 때는 남성형 *pequeño*를 써요.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: 할아버지
    gloss: 할아버지
    note: '*Abuelo*는 남성 단수예요.'
  es.a1.unit03.lesson03.teach.abuela:
    title: 할머니
    gloss: 할머니
    note: '*Abuela*는 여성 단수예요.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: 조부모님
    gloss: 조부모님
    note: '*Abuelos*(남성 복수)는 할아버지와 할머니를 함께 가리킬 수 있어요. *padres*, *hermanos*와 같은 방식이에요.'
  es.a1.unit03.lesson03.teach.tio:
    title: 삼촌
    gloss: 삼촌
    note: '*Tío*에는 강세가 *í*에 있어서 악센트 기호를 써요. 이 기호가 없으면 이중모음이 될 수 있어요.'
  es.a1.unit03.lesson03.teach.tia:
    title: 이모, 고모
    gloss: 이모, 고모
    note: '*Tía*도 같은 이유로 *tío*와 같은 방식으로 악센트 기호를 써요.'
  es.a1.unit03.lesson03.teach.primo:
    title: 사촌 (남자)
    gloss: 사촌 (남자)
    note: '*Primo*는 남성 단수예요. 스페인어는 사촌의 성별을 단어 형태로 구분해요.'
  es.a1.unit03.lesson03.teach.prima:
    title: 사촌 (여자)
    gloss: 사촌 (여자)
    note: '*Prima*는 여성 단수예요.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: 우리 조부모님
    gloss: 우리 조부모님
    note: '*Mis*는 *mi*의 복수형이에요. 꾸미는 명사가 복수이면 명사의 성과 상관없이 써야 해요.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: 형제자매가 몇 명인지 묻기
    gloss: 형제자매가 몇 명이에요?
    note: '*Cuántos*(남성 복수. *hermanos*가 남녀 섞인 무리도 가리키기 때문이에요)는 묻는 대상 명사에 맞춘 형태예요.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: 가족 수 말하기
    gloss: 우리 집은 다섯 명이에요.
    note: 스페인어에서는 가족 전체 인원을 말할 때 "~이 있다"를 직역하지 않고 *Somos*(우리는 ~명이다)라고 하는 것이 자연스러워요.
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: 대가족 설명하기
    gloss: 우리 가족은 대가족이에요.
    note: 여기서 *Grande*는 여성 명사 *familia*를 꾸며 주는데, 남성 명사와 쓸 때와 형태가 똑같아요. *grande*처럼 -e로 끝나는 형용사는 성에 따라 바뀌지 않거든요. 그래서 *grande*는 남성, 여성 모두 같아요.
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: 사촌이 많다고 말하기
    gloss: 저는 사촌이 많아요.
    note: '*primos*도 *hermanos*, *padres*처럼 남녀가 섞인 무리를 가리킬 수 있어서 남성 복수형 *muchos*를 써요.'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: 부모님 가까이에 사는지 묻기
    gloss: 부모님 가까이에 살아요?
    note: '*Tus*는 *tu*의 복수형이에요. *padres*가 복수이기 때문에 tus를 써야 해요.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: 누구와 사는지 말하기
    gloss: 저는 조부모님과 함께 살아요.
    note: '*Con*(~와 함께)은 함께 사는 사람을 나타낼 때 써요. *vivo*는 *vivir*의 *yo* 형태로, 1단원의 *vivo en Londres*에서 이미 나왔어요.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: 엘레나의 가족 소개
    gloss: 제 이름은 엘레나예요. 저는 서른한 살이고 스페인에서 조부모님과 함께 살아요. 어머니와 아버지는 바르셀로나에 살아요. 저는 여동생 한 명과 남자 형제 한 명이 있어요. 집에는 모두 다섯 명이 있어요. 제 여동생의 이름은 소피아이고 스무 살이에요.
    note: 이 소개글은 1~4과의 어휘와 표현을 따로 떨어진 문장이 아니라 하나의 짧은 글로 이어서 다시 써요. 이 단원의 읽기 평가에서 다루는, 누가 누구인지 파악하는 읽기 능력과 같아요.
    glosses:
      llamo: ~라고 불리다 (llamarse의 활용형)
      Tengo: 나는 ~살이다 / 나는 ~이(가) 있다 (tener의 활용형)
      treinta: 삼십
      años: ~살
      vivo: 살다 (vivir의 활용형)
      abuelos: 조부모님
      madre: 어머니
      padre: 아버지
      viven: 살다 (vivir의 활용형)
      hermana: 여자 형제
      hermano: 남자 형제
      somos: 우리는 ~이다 (ser의 활용형)
      cinco: 다섯
      casa: 집
      menor: 손아래의
      tiene: ~이다 / ~이(가) 있다 (tener의 활용형)
      veinte: 20, 스물
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: 여동생
    gloss: 여동생
    note: '*Menor*(손아래의)는 꾸미는 명사 뒤에 오고, 성에 따라 모양이 바뀌지 않아요.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: 산다 (3인칭)
    gloss: 산다
    note: '*Vive*는 *vivir*의 3인칭 단수형이에요. 자기 자신(*vivo*, 1단원 4과와 이 단원 4과에서 나왔어요)이 아니라 다른 사람에 대해 말할 때(*Elena vive*...) 써요.'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: 그녀의/그의/그들의 (복수 명사)
    gloss: 그녀의/그의/그들의
    note: '*Sus*는 *su*의 복수형이에요. *su*가 단수 명사 앞에서 "그의/그녀의/당신의"를 두루 나타내듯이 sus도 같게 쓰여요. 엘레나를 3인칭으로 말할 때 *sus abuelos*는 "그녀의 조부모님"이라는 뜻이에요.'
  es.a1.unit03.lesson06.teach.line01:
    title: 가족사진 보여 주기
    gloss: 엘레나가 마테오에게 사진을 보여 주며 부모님과 여동생을 소개해요.
    note: '*Estos son*(이분들은 ~이에요, 남성/혼성 복수)은 부모님을 소개하고, *esta es*(이 사람은 ~이에요, 여성 단수)는 여동생을 소개해요.'
  es.a1.unit03.lesson06.teach.line02:
    title: 반응하고 형제자매 묻기
    gloss: 마테오가 따뜻하게 반응하며 다른 형제자매가 더 있는지 물어요.
    note: '*Qué bonito*는 사진을 보고 하는 따뜻하고 자연스러운 반응이에요. 1단원의 *Qué bien*과 쓰임이 비슷해요.'
  es.a1.unit03.lesson06.teach.line03:
    title: 가족 인원을 말하고 되묻기
    gloss: 엘레나가 여동생 한 명과 남자 형제 한 명이 있고 집에는 다섯 명이 있다고 말한 뒤, 마테오의 가족에 대해 물어요.
    note: '*Somos cinco en casa*는 4과의 표현처럼 한 집에 사는 전체 인원을 말해요.'
  es.a1.unit03.lesson06.teach.line04:
    title: 더 작은 가족 설명하기
    gloss: 마테오는 자기 가족이 더 작아서 부모님과 자신, 세 명뿐이지만 사촌은 많다고 말해요.
    note: '*Pero*(하지만)는 작은 핵가족과 많은 친척 사이의 대비를 나타내요.'
  es.a1.unit03.lesson06.teach.line05:
    title: 부모님과 얼마나 가까이 사는지 묻기
    gloss: 엘레나가 마테오에게 부모님 가까이에 사는지 물어요.
    note: '*Cerca de*(~ 근처에)는 물리적으로 가깝다고 말할 때 흔히 쓰는 표현이에요.'
  es.a1.unit03.lesson06.teach.line06:
    title: 거리와 연락하는 방법 설명하기
    gloss: 마테오는 아니라고, 부모님은 콜롬비아에 살고 매주 전화로 이야기한다고 말해요.
    note: 1단원에서 나온 대로 마테오는 콜롬비아 출신이지만 런던에 살아요. 그의 부모님은 콜롬비아에 계세요.
  es.a1.unit03.lesson06.teach.line07:
    title: 공감하고 내 상황 이야기하기
    gloss: 엘레나는 이해한다고 말하며, 자신은 여기 스페인에서 조부모님과 함께 산다고 해요.
    note: '*Entiendo*(이해해요)는 상대가 한 말에 짧게 공감하고 나서 내 이야기를 덧붙일 때 쓰는 자연스러운 표현이에요.'
  es.a1.unit03.lesson06.teach.line08:
    title: 따뜻한 말로 마무리하기
    gloss: 마테오는 가족이 가까이 있어서 좋겠다고 말해요.
    note: '*Qué bien tener a la familia cerca*는 따뜻하고 여운이 있는 말로 대화를 마무리해요. 이 대화 내내 나온 *qué bien*/*qué bonito* 표현과 같은 흐름이에요.'
exercises:
