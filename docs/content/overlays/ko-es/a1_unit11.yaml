teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: 셔츠
    gloss: 셔츠
    note: '*Camisa*는 여성 명사예요.'
    example_gloss: 이 셔츠가 마음에 들어요.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: 바지
    gloss: 바지
    note: '*Pantalón*은 스페인어에서 문법적으로 단수 명사예요. 바지 한 벌을 가리킬 때 단수로 써요.'
    example_gloss: 바지는 20이에요.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: 재킷
    gloss: 재킷
    note: '*Chaqueta*는 여성 명사예요.'
    example_gloss: 겨울에 입을 재킷이 필요해요.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: 신발
    gloss: 신발
    note: '*Zapatos*는 복수형이에요. 스페인어에서는 신발이 한 켤레여도 보통 복수형으로 말해요.'
    example_gloss: 이 신발은 편해요.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: 앞치마
    gloss: 앞치마
    note: '*Delantal*은 남성 명사예요. 엘레나와 마테오가 워크숍에 필요한 바로 그 물건이에요.'
    example_gloss: 우리는 워크숍에 쓸 앞치마가 필요해요.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: 사이즈 물어보기
    gloss: 사이즈가 어떻게 되세요?
    note: '*¿Qué talla usas?*는 옷 사이즈를 물을 때 쓰는 기본 표현이에요.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: 내 사이즈 말하기
    gloss: 저는 미디엄 입어요.
    note: '*Uso*(입다/쓰다) + *la talla*(사이즈) + 사이즈를 나타내는 말 순서예요.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: 잘 맞는다고 말하기
    gloss: 저한테 잘 맞아요.
    note: '*Me queda bien*은 *quedar*(맞다/어울리다)를 써요. 다음 문법 설명을 보세요.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: 안 맞는다고 말하기
    gloss: 저한테 잘 안 맞아요.
    note: '*me queda bien*의 반대로, *bien* 대신 *mal*을 써요.'
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: quedar가 품질이 아니라 옷이 맞는 정도를 나타내는 방식이에요.
    note: 카드의 본문을 보세요.
    target_text: '*Me queda bien*(저한테 잘 맞아요)은 *quedar*(맞다, 어울리다) 동사를 써요. *ser*나 *estar*와는 다른 동사로, 직역하면 "나에게 잘 머물러 있다"예요. 여기서 *Bien*과 *mal*은 품질이 아니라 맞는 정도를 나타내요.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: 앞치마 가격 물어보기
    gloss: 이 앞치마는 얼마예요?
    note: '*¿Cuánto cuesta?* 표현에 *este*(이)를 써서 특정한 물건을 가리켜요.'
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: 가격 말하기
    gloss: 12예요.
    note: '*Cuesta* + 숫자로 가격을 말해요.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este와 esta
    gloss: 지시어가 명사의 성에 따라 달라지는 방식이에요.
    note: 카드의 본문을 보세요.
    target_text: '*Este*(이, 남성형)는 *el delantal*과 어울리고, *esta*(이, 여성형)는 *esta camisa*와 함께 써요. 지시어는 다른 형용사와 마찬가지로 명사의 성에 따라 바뀌어요.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: 이게 마음에 든다고 말하기
    gloss: 이게 마음에 들어요.
    note: 여기서 *Este*는 대명사로 혼자 쓰여서 방금 언급한 물건을 가리켜요("이것").
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: 사겠다고 말하기
    gloss: 그것을 살 거예요.
    note: '*Voy a* + 동사원형은 가까운 미래를 나타내요. *comprarlo*는 동사원형 *comprar*에 목적격 대명사 *lo*(그것)가 붙은 형태예요.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: 두 개를 산다고 말하기
    gloss: 우리는 두 개를 사요.
    note: '*Compramos*(우리는 사요)는 *nosotros* 형태로, 엘레나와 마테오가 함께 결정할 때 써요.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: 가격표 읽기
    gloss: 이 가게에서 셔츠는 15, 바지는 20, 재킷은 30, 신발은 25예요. 앞치마가 가장 싸요. 12밖에 안 해요.
    note: 가게 가격표예요. 물건이 하나면 *cuesta*(값이 나가다), *los zapatos*처럼 복수면 *cuestan*을 써요.
    glosses:
      tienda: 가게
      camisa: 셔츠
      cuesta: 값이 나가다(costar의 활용형)
      quince: '15'
      pantalón: 바지
      veinte: 20, 스물
      chaqueta: 재킷
      treinta: 삼십
      zapatos: 신발
      cuestan: 값이 나가다(costar의 활용형)
      veinticinco: '25'
      delantal: 앞치마
      barato: 싼
      solo: ~만
      doce: '12'
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato(가장 싼 것)
    gloss: el/la + más + 형용사로 최상급을 만드는 방법이에요.
    note: 카드의 본문을 보세요.
    target_text: '*El más barato*(가장 싼 것)는 최상급이에요. *el/la* + *más* + 형용사 형태이고, 비교하는 집단은 *de/en*으로 나타내요. 이 단원에서는 비교 표현 전체를 배우지 않고, 쇼핑에서 자주 쓰는 이 표현 하나만 배워요.'
  es.a1.unit11.lesson06.teach.line01:
    title: 필요한 것 말하기
    gloss: 엘레나가 워크숍에 쓸 앞치마가 필요하다고 말해요.
    note: '*Delantales*는 *el delantal*의 복수형이에요.'
  es.a1.unit11.lesson06.teach.line02:
    title: 동의하고 가게 제안하기
    gloss: 마테오가 동의하며 그 가게에 가자고 제안해요.
    note: '*Tienes razón*은 "네 말이 맞아"라는 뜻이고, *esa tienda*는 "그 가게"라는 뜻이에요.'
  es.a1.unit11.lesson06.teach.line03:
    title: 점원의 인사
    gloss: 점원이 인사하며 도와드릴지 물어요.
    note: '*¿Los ayudo?*(도와드릴까요?)는 점원이 엘레나와 마테오 두 사람에게 함께 건네는 흔한 인사말이에요.'
  es.a1.unit11.lesson06.teach.line04:
    title: 찾는 물건 말하기
    gloss: 엘레나가 네, 앞치마를 찾고 있다고 말해요.
    note: '*Buscamos*(우리는 찾고 있어요)는 *buscar*의 *nosotros* 형태예요.'
  es.a1.unit11.lesson06.teach.line05:
    title: 점원이 제품을 보여 주며 사이즈를 물어요
    gloss: 점원이 앞치마 몇 개를 보여 주며 사이즈를 물어요.
    note: '*¿Qué talla usan?*에서는 두 사람에게 묻기 때문에 단수 *usas*와 달리 복수형 *usan*(여러분이 입다)을 써요.'
  es.a1.unit11.lesson06.teach.line06:
    title: 사이즈 말하기
    gloss: 마테오가 미디엄을 입는다고 말해요.
    note: '*Uso la talla mediana*는 *¿Qué talla usan?*에 대해 자기 사이즈를 답한 말이에요.'
  es.a1.unit11.lesson06.teach.line06b:
    title: 엘레나도 같다고 말해요
    gloss: 엘레나도 같은 사이즈라고 말해요.
    note: '*Yo también*은 "저도요"라는 뜻이에요.'
  es.a1.unit11.lesson06.teach.line07:
    title: 가격 물어보기
    gloss: 마테오가 앞치마가 얼마인지 물어요.
    note: '*Este*(이)는 눈앞에 있는 앞치마를 가리켜요.'
  es.a1.unit11.lesson06.teach.line07b:
    title: 가격 말하기
    gloss: 점원이 12라고 말해요.
    note: '*Cuesta* + 숫자로 가격을 말해요.'
  es.a1.unit11.lesson06.teach.line08:
    title: 잘 맞는지 확인하고 사기로 결정하기
    gloss: 엘레나가 잘 맞고 마음에 들어서 사겠다고 말해요.
    note: '*me queda bien*, *me gusta este*, *voy a comprarlo*를 차례로 이어서 말해요.'
  es.a1.unit11.lesson06.teach.line09:
    title: 동의하고 두 개 사기
    gloss: 마테오도 잘 맞는다고 말하고, 두 사람은 두 개를 사요.
    note: '*A mí también*(저도요, 강조)은 *también*으로 동의하는 표현에 강조의 대명사를 더한 거예요. *Compramos dos*로 장면이 마무리돼요.'
