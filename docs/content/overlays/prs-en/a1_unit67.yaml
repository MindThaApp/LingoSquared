course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit67.family_news: {title: "خبرهای خانواده"}

lessons:
  en.a1.unit67.lesson01.family_news_words: {title: "کلمات خبرهای خانواده"}
  en.a1.unit67.lesson02.family_news_phrases: {title: "عبارات برای خبرهای خانواده"}
  en.a1.unit67.lesson03.dialogue_sharing_family_news: {title: "گفتگو: شریک ساختن خبر خانواده"}
  en.a1.unit67.lesson04.family_message: {title: "متن: پیام خانواده"}

teaching:
  en.a1.unit67.lesson01.teach.news: {title: "news", gloss: "خبر", note: "news یعنی خبر یا معلومات تازه.", example_gloss: "یک خبر خوب دارم."}
  en.a1.unit67.lesson01.teach.family: {title: "family", gloss: "خانواده", note: "family یعنی خانواده؛ پدر، مادر، خواهر، برادر و اولادها.", example_gloss: "خانواده‌تان چطور استه؟"}
  en.a1.unit67.lesson01.teach.baby: {title: "baby", gloss: "طفل نوزاد", note: "baby یعنی طفل بسیار خورد.", example_gloss: "خواهرم یک طفل نوزاد دارد."}
  en.a1.unit67.lesson01.teach.visit: {title: "visit", gloss: "دیدن / دیدار کردن", note: "visit یعنی رفتن برای دیدن کسی.", example_gloss: "ما به زودی دیدن می‌کنیم."}
  en.a1.unit67.lesson01.teach.proud: {title: "proud", gloss: "افتخارکننده / خوشحال از کسی", note: "proud یعنی از کار خوب کسی خوش و سربلند بودن.", example_gloss: "به او افتخار می‌کنم."}
  en.a1.unit67.lesson01.teach.soon: {title: "soon", gloss: "به زودی", note: "soon یعنی در وقت نزدیک، نه بسیار دیر.", example_gloss: "ما به زودی دیدن می‌کنیم."}

  en.a1.unit67.lesson02.teach.how_family: {title: "How is your family?", gloss: "خانواده‌تان چطور استه؟", note: "این سوال برای احوال‌پرسی دربارهٔ خانواده کار می‌ره."}
  en.a1.unit67.lesson02.teach.good_news: {title: "I have good news.", gloss: "یک خبر خوب دارم.", note: "I have good news. برای شروع شریک ساختن خبر خوش کار می‌ره."}
  en.a1.unit67.lesson02.teach.sister_baby: {title: "My sister has a baby.", gloss: "خواهرم یک طفل نوزاد دارد.", note: "این جمله یک خبر سادهٔ خانوادگی را می‌گه."}
  en.a1.unit67.lesson02.teach.visit_soon: {title: "We will visit soon.", gloss: "ما به زودی دیدن می‌کنیم.", note: "will در این جمله دربارهٔ آیندهٔ نزدیک گپ می‌زنه."}
  en.a1.unit67.lesson02.teach.proud_of_her: {title: "I am proud of her.", gloss: "به او افتخار می‌کنم.", note: "proud of her یعنی از او خوش و سربلند استم."}
  en.a1.unit67.lesson02.teach.wonderful: {title: "That is wonderful.", gloss: "این بسیار عالی استه.", note: "That is wonderful. جواب گرم به خبر خوب استه."}

  en.a1.unit67.lesson03.teach.dialogue_line1: {title: "سوال میا", gloss: "سلام دانیال. خانواده‌ات چطور استه؟", note: "Mia دربارهٔ خانوادهٔ دانیال احوال می‌پرسه."}
  en.a1.unit67.lesson03.teach.dialogue_line2: {title: "جواب دانیال", gloss: "آن‌ها خوب استن. یک خبر خوب دارم.", note: "Daniel اول جواب می‌ته و بعد خبر خوب را شروع می‌کنه."}
  en.a1.unit67.lesson03.teach.dialogue_line3: {title: "سوال میا دربارهٔ خبر", gloss: "خبر چیست؟", note: "What is the news? یعنی خبر چیست؟"}
  en.a1.unit67.lesson03.teach.dialogue_line4: {title: "خبر دانیال", gloss: "خواهرم یک طفل نوزاد دارد.", note: "این خبر اصلی دانیال استه."}
  en.a1.unit67.lesson03.teach.dialogue_line5: {title: "جواب گرم میا", gloss: "این بسیار عالی استه.", note: "That is wonderful جواب گرم به خبر خوش استه."}
  en.a1.unit67.lesson03.teach.dialogue_line6: {title: "برنامهٔ دانیال", gloss: "تشکر. ما به زودی دیدن می‌کنیم.", note: "soon یعنی به زودی."}
  en.a1.unit67.lesson03.teach.dialogue_line7: {title: "گپ میا", gloss: "حتماً افتخار می‌کنی.", note: "You must be proud یعنی احتمالاً بسیار سربلند و خوش استی."}
  en.a1.unit67.lesson03.teach.dialogue_line8: {title: "احساس دانیال", gloss: "به او افتخار می‌کنم.", note: "her در اینجا به خواهر دانیال اشاره می‌کنه."}

  en.a1.unit67.lesson04.teach.family_note: {title: "یادداشت خانواده", gloss: "یادداشت خانواده: خبر خوب. خواهرم یک طفل نوزاد داره. ما به زودی دیدن می‌کنیم.", note: "این یادداشت خبر خوب و برنامهٔ دیدن را کوتاه می‌گه."}
  en.a1.unit67.lesson04.teach.reading_passage: {title: "متن: خبر خوب خانواده", gloss: "خبر خوب خانواده: میا از دانیال دربارهٔ خانواده‌اش پرسید. دانیال گفت آن‌ها خوب بودن. بعد او یک خبر خوب شریک ساخت: خواهرش یک طفل نوزاد داشت. میا گفت خبر بسیار عالی بود. دانیال گفت او و خانواده‌اش به زودی دیدن می‌کنن. او به خواهرش افتخار می‌کرد. بعدتر، میا یک پیام کوتاه فرستاد: برای خانواده‌ات خوش استم.", note: "این متن احوال‌پرسی خانواده، شریک ساختن خبر خوب، و جواب گرم را تمرین می‌کنه."}

exercises:
  en.a1.unit67.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "family"
    distractors: ["friend", "office", "market", "school"]
    accepted_answers: [{value: "family", status: "correct"}]
    feedback: "family یعنی خانواده."
  en.a1.unit67.lesson01.exercise02.choose_news_meaning:
    instruction: "کدام کلمه یعنی معلومات تازه؟"
    correct_option: "news"
    distractors: ["visit", "baby", "photo"]
    accepted_answers: [{value: "news", status: "correct"}]
    feedback: "news یعنی خبر."
  en.a1.unit67.lesson01.exercise03.match_family_news_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "news", "right": "new information"}, {"left": "family", "right": "parents, children, sisters, and brothers"}, {"left": "baby", "right": "a very young child"}, {"left": "visit", "right": "go to see someone"}, {"left": "proud", "right": "happy about someone or something good"}, {"left": "soon", "right": "in a short time"}], "status": "correct"}]
    feedback: "news=خبر، family=خانواده، baby=طفل نوزاد، visit=دیدن، proud=افتخارکننده، soon=به زودی."
  en.a1.unit67.lesson01.exercise04.order_news_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "good", "news."], status: "correct"}]
    feedback: "ترتیب درست: I have good news."
  en.a1.unit67.lesson01.exercise05.write_baby:
    instruction: "کلمه‌ای را بنویسین که یعنی طفل بسیار خورد."
    accepted_answers: [{value: "baby", status: "correct"}]
    feedback: "baby یعنی طفل نوزاد."

  en.a1.unit67.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "How is your family?"
    distractors: ["How is your phone?", "Where is your family?", "Who is your teacher?"]
    accepted_answers: [{value: "How is your family?", status: "correct"}]
    feedback: "How is your family? یعنی خانواده‌تان چطور استه؟"
  en.a1.unit67.lesson02.exercise02.choose_family_question:
    instruction: "کدام عبارت دربارهٔ خانوادهٔ کسی می‌پرسه؟"
    correct_option: "How is your family?"
    distractors: ["Where is the ATM?", "Do you have medicine?", "Can I exchange it?"]
    accepted_answers: [{value: "How is your family?", status: "correct"}]
    feedback: "How is your family? یک سوال دربارهٔ خانواده استه."
  en.a1.unit67.lesson02.exercise03.choose_good_response:
    instruction: "کدام عبارت جواب گرم به خبر خوب استه؟"
    correct_option: "That is wonderful."
    distractors: ["That is too small.", "That is my receipt.", "That is near the door."]
    accepted_answers: [{value: "That is wonderful.", status: "correct"}]
    feedback: "That is wonderful. یعنی این بسیار عالی استه."
  en.a1.unit67.lesson02.exercise04.order_family_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "sister", "has", "a", "baby."], status: "correct"}]
    feedback: "ترتیب درست: My sister has a baby."
  en.a1.unit67.lesson02.exercise05.translate_proud:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «به او افتخار می‌کنم.»"
    accepted_answers:
      - {value: "I am proud of her.", status: "correct"}
      - {value: "I am proud of her", status: "correct"}
    feedback: "I am proud of her. یعنی به او افتخار می‌کنم."

  en.a1.unit67.lesson03.exercise01.comprehension_news:
    instruction: "مطابق گفتگو، خبر دانیال چیست؟"
    correct_option: "My sister has a baby"
    distractors: ["My brother has a job", "My mother will visit", "My family moved today"]
    accepted_answers: [{value: "My sister has a baby", status: "correct"}]
    feedback: "خبر دانیال این استه که خواهرش یک طفل نوزاد داره."
  en.a1.unit67.lesson03.exercise02.comprehension_visit:
    instruction: "مطابق گفتگو، دانیال چه وقت دیدن می‌کنه؟"
    correct_option: "soon"
    distractors: ["today", "next year", "after school"]
    accepted_answers: [{value: "soon", status: "correct"}]
    feedback: "دانیال به زودی دیدن می‌کنه."
  en.a1.unit67.lesson03.exercise03.listen_dialogue_family_question:
    instruction: "میا کدام سوال خانوادگی را می‌پرسه؟"
    correct_option: "How is your family?"
    distractors: ["Where is your family?", "How old is your sister?", "When will your brother visit?"]
    accepted_answers: [{value: "How is your family?", status: "correct"}]
    feedback: "میا می‌پرسه: How is your family?"
  en.a1.unit67.lesson03.exercise04.respond_own_family_news:
    instruction: "دربارهٔ خانواده بپرسین، خبر خوب شریک بسازین، یا جواب گرم بتین."
    accepted_answers: ["I have good news", "I have good news.", "How is your family", "How is your family?", "That is wonderful", "That is wonderful.", "I am proud of her", "I am proud of her."]
    feedback: "می‌تانین بگین I have good news. یا That is wonderful."

  en.a1.unit67.lesson04.exercise01.note_news:
    instruction: "مطابق یادداشت، خبر خوب چیست؟"
    correct_option: "My sister has a baby"
    distractors: ["My cousin has a car", "My brother has a ticket", "My aunt will call"]
    accepted_answers: [{value: "My sister has a baby", status: "correct"}]
    feedback: "یادداشت می‌گه خواهرم یک طفل نوزاد داره."
  en.a1.unit67.lesson04.exercise02.note_visit:
    instruction: "مطابق یادداشت، دانیال چه وقت دیدن می‌کنه؟"
    correct_option: "soon"
    distractors: ["tonight", "next month", "after lunch"]
    accepted_answers: [{value: "soon", status: "correct"}]
    feedback: "یادداشت می‌گه به زودی."
  en.a1.unit67.lesson04.exercise03.reading_who_asked:
    instruction: "مطابق متن، کی دربارهٔ خانوادهٔ دانیال پرسید؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the sister"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "میا دربارهٔ خانوادهٔ دانیال پرسید."
  en.a1.unit67.lesson04.exercise04.reading_feeling:
    instruction: "مطابق متن، دانیال دربارهٔ خواهرش چه احساس داشت؟"
    correct_option: "proud"
    distractors: ["tired", "late", "worried"]
    accepted_answers: [{value: "proud", status: "correct"}]
    feedback: "دانیال به خواهرش افتخار می‌کرد."
  en.a1.unit67.lesson04.exercise05.write_own_family_news:
    instruction: "یک پیام کوتاه بنویسین: بگین خبر خوب دارین، و بگین خواهرتان یک طفل نوزاد داره."
    accepted_answers:
      - {value: "I have good news. My sister has a baby.", status: "correct"}
      - {value: "I have good news, and my sister has a baby.", status: "correct"}
      - {value: "I have good news and my sister has a baby.", status: "correct"}
    feedback: "می‌تانین بگین: I have good news. My sister has a baby."
