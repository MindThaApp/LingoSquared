course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit38.repair_visit: {title: "تنظیم و تأیید وقت ترمیم"}

lessons:
  en.a2.unit38.lesson01.repair_visit_vocabulary: {title: "تبدیل وقت، کلید، و همسایه"}
  en.a2.unit38.lesson02.moving_the_appointment: {title: "تبدیل کردن وقت به یک وقت دیگه"}
  en.a2.unit38.lesson03.reading_a_rescheduling_message: {title: "خواندن پیام وقت جدید"}
  en.a2.unit38.lesson04.repair_visit_dialogue: {title: "زنگ زدن برای تبدیل وقت ترمیم"}

teaching:
  en.a2.unit38.lesson01.teach.reschedule: {title: "reschedule", gloss: "تبدیل کردن وقت", note: "*reschedule* یعنی یک وقت ملاقات را به یک وخت دیگه بردن.", example_gloss: "باید وقت ترمیم را تبدیل کنم، چون سر کار می‌باشم."}
  en.a2.unit38.lesson01.teach.neighbor: {title: "neighbor", gloss: "همسایه", note: "*neighbor* یعنی کسی که پهلوی‌تان زندگی می‌کنه.", example_gloss: "همسایه‌ام می‌تانه دروازه را برای پایپ‌کار باز کنه."}
  en.a2.unit38.lesson01.teach.key: {title: "key", gloss: "کلید", note: "*key* یعنی همو چیز خُردی که همرایش دروازه‌تان را باز می‌کنین.", example_gloss: "کلید را پیش همسایه‌ام می‌مانم."}
  en.a2.unit38.lesson01.teach.leak: {title: "leak", gloss: "چکک آب", note: "*leak* اینجه اسم استه: خود همو جای چکیدن. فعلش *to leak* یعنی چکیدن.", example_gloss: "چکک آب زیر نل آشپزخانه‌ام خرابتر می‌شه."}
  en.a2.unit38.lesson01.teach.fixed: {title: "fixed", gloss: "جور شده", note: "*fixed* شکل سوم فعل *to fix* استه: دیگه خراب نیست.", example_gloss: "نل حالی جور شده و آب بند شده."}
  en.a2.unit38.lesson01.teach.afternoon: {title: "afternoon", gloss: "پس از چاشت", note: "*afternoon* یعنی بخش پس از ساعت دوازده روز؛ *morning* یعنی صبح.", example_gloss: "پایپ‌کار پس از چاشت آمد، نی در صبح."}
  en.a2.unit38.lesson01.teach.grammar_cant_wont: {title: "can't و won't برای گفتن اینکه نمی‌شه", gloss: "بین ساعت ۲ تا ۴ بعد از ظهر خانه بوده نمی‌تانم. پس از چاشت خانه نمی‌باشم.", note: "*can't* می‌گه که یک کار ممکن نیست؛ *won't* می‌گه که آن کار واقع نمی‌شه."}

  en.a2.unit38.lesson02.teach.need_to_reschedule: {title: "گفتن اینکه می‌خواین وقت را تبدیل کنین", gloss: "باید وقت ترمیم را تبدیل کنم.", note: "*I need to...* بی‌طرف و کاری استه: لازم استه، اما بی‌ادبانه معلوم نمی‌شه."}
  en.a2.unit38.lesson02.teach.possible_in_the_morning: {title: "خواستن یک وخت دیگه", gloss: "ممکن استه به جایش در صبح بیایه؟", note: "*Would it be possible to...?* محتاطانه‌ترین شکل خواهش استه؛ *instead* یعنی به جایش."}
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor: {title: "گفتن اینکه کلید کجاست", gloss: "کلید را پیش همسایه‌ام می‌مانم.", note: "*leave something with someone* یعنی یک چیز را پیش کسی ماندن."}
  en.a2.unit38.lesson02.teach.is_the_leak_fixed: {title: "پرسیدن اینکه مشکل حل شده یا نی", gloss: "چکک آب حالی جور شده؟", note: "*Is ... fixed?* دربارهٔ نتیجه می‌پرسه، نی دربارهٔ خود کار."}
  en.a2.unit38.lesson02.teach.grammar_because_reason: {title: "دادن دلیل همرای because", gloss: "بین ساعت ۲ تا ۴ بعد از ظهر خانه بوده نمی‌تانم، چون سر کار می‌باشم.", note: "*because* مشکل را به دلیل وصل می‌کنه؛ در انگلیسی ترتیب کلمات بعد از آن تغییر نمی‌کنه."}

  en.a2.unit38.lesson03.teach.message: {title: "message", gloss: "پیام", note: "*message* یعنی هر پیام کوتاه نوشتنی: اس‌ام‌اس، پیام واتساپ، یا ایمیل کوتاه.", example_gloss: "یک پیام دربارهٔ وقت جدید ترمیم گرفتم."}
  en.a2.unit38.lesson03.teach.rescheduling_text: {title: "متن پیام وقت جدید", gloss: "ترمیم ۶۱۸۰ تبدیل شد. پایپ‌کار فردا بین ساعت ۹ تا ۱۱ صبح می‌آیه. همسایهٔ شما دروازه را باز می‌کنه. لطفاً همی وقت جدید را امروز از طریق پیام تأیید کنین.", note: "یک پیام مدیر بلاک کوتاه و کاری استه: چی تبدیل شده، کِی، و شما چی باید بکنین."}
  en.a2.unit38.lesson03.teach.confirm_by_message: {title: "خواسته شدن برای تأیید", gloss: "لطفاً همی وقت جدید را امروز از طریق پیام تأیید کنین.", note: "*confirm* یعنی تأیید کردن؛ *by message* یعنی از طریق پیام."}

  en.a2.unit38.lesson04.teach.q_need_to_reschedule: {title: "دانیل به مدیر زنگ می‌زنه", gloss: "دانیل می‌گه: سلام، باید وقت ترمیم را تبدیل کنم.", note: "در تیلفون اول سلام می‌گین و بعد فوراً دلیل زنگ زدن‌تان را."}
  en.a2.unit38.lesson04.teach.a_which_repair: {title: "مدیر می‌پرسه کدام ترمیم", gloss: "مدیر می‌گه: مشکلی نیست. کدام ترمیم استه؟", note: "*Which repair is it?* از بین چند چیز معلوم، یکی را می‌پرسه."}
  en.a2.unit38.lesson04.teach.q_repair_6180: {title: "دانیل نمبر ترمیم را می‌گه", gloss: "دانیل می‌گه: ترمیم ۶۱۸۰، چکک آب زیر نل آشپزخانه‌ام.", note: "همو نمبر ترمیمی که در واحد ۲۹ گرفته بود -- عین همو نل چکنده."}
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home: {title: "مدیر دلیل را می‌پرسه", gloss: "مدیر می‌گه: فهمیدم. چرا خانه بوده نمی‌تانین؟", note: "*Why can't you...?* دلیل نشدن یک کار را می‌پرسه."}
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning: {title: "دانیل دلیل می‌ته و صبح را می‌خواهه", gloss: "دانیل می‌گه: بین ساعت ۲ تا ۴ بعد از ظهر خانه بوده نمی‌تانم، چون سر کار می‌باشم. ممکن استه به جایش در صبح بیایه؟", note: "اول دلیل، بعد خواهش -- همی مؤدبانه‌تر از فوراً خواستن استه."}
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning: {title: "مدیر یک وقت جدید پیشنهاد می‌کنه", gloss: "مدیر می‌گه: بلی، پایپ‌کار می‌تانه بین ساعت ۹ تا ۱۱ صبح بیایه.", note: "*between 9am and 11am* وقت جدید استه."}
  en.a2.unit38.lesson04.teach.q_leave_key: {title: "دانیل کلید را تنظیم می‌کنه", gloss: "دانیل می‌گه: تشکر. کلید را پیش همسایه‌ام می‌مانم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit38.lesson04.teach.a_please_confirm: {title: "مدیر تأیید می‌خواهه", gloss: "مدیر می‌گه: خوب. لطفاً همی وقت جدید را امروز از طریق پیام تأیید کنین.", note: "همو هدایتی که در پیام درس سوم بود."}
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon: {title: "دانیل می‌گه کِی تأیید می‌کنه", gloss: "دانیل می‌گه: امروز پس از چاشت تأییدش می‌کنم.", note: "*this afternoon* یعنی امروز پس از چاشت."}

exercises:
  en.a2.unit38.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "neighbor"
    distractors: ["key", "leak", "afternoon"]
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "*neighbor* یعنی همسایه."
  en.a2.unit38.lesson01.exercise02.choose_reschedule_word:
    instruction: "کدام کلمه یعنی یک وقت ملاقات را به یک وخت دیگه بردن؟"
    correct_option: "reschedule"
    distractors: ["repair", "confirm", "leave"]
    accepted_answers: [{value: "reschedule", status: "correct"}]
    feedback: "*reschedule* یعنی تبدیل کردن وقت."
  en.a2.unit38.lesson01.exercise03.choose_neighbor_word:
    instruction: "کدام کلمه یعنی کسی که پهلوی‌تان زندگی می‌کنه؟"
    correct_option: "neighbor"
    distractors: ["plumber", "manager", "key"]
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "*neighbor* یعنی همسایه."
  en.a2.unit38.lesson01.exercise04.match_repair_visit_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "to move an appointment to another time", right: "reschedule"}
          - {left: "the person who lives next to you", right: "neighbor"}
          - {left: "the small metal thing that opens your door", right: "key"}
          - {left: "water coming out of a pipe where it shouldn't", right: "leak"}
          - {left: "not broken any more", right: "fixed"}
          - {left: "the part of the day after 12 o'clock", right: "afternoon"}
          - {left: "the person who fixes water problems", right: "plumber"}
          - {left: "the work of making something broken work again", right: "repair"}
        status: "correct"
    feedback: "*reschedule*=تبدیل کردن وقت، *neighbor*=همسایه، *key*=کلید، *leak*=چکک آب، *fixed*=جور شده، *afternoon*=پس از چاشت، *plumber*=پایپ‌کار، *repair*=ترمیم."
  en.a2.unit38.lesson01.exercise05.write_neighbor:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که پهلوی‌تان زندگی می‌کنه."
    accepted_answers:
      - {value: "neighbor", status: "correct"}
      - {value: "Neighbor", status: "correct"}
    feedback: "*neighbor* یعنی همسایه."

  en.a2.unit38.lesson02.exercise01.listen_reschedule_request:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "I need to reschedule the repair"
    distractors: ["I will leave the key with my neighbor.", "Is the leak fixed now?", "Would it be possible to come in the morning instead?"]
