exercises:
  en.a1.unit12.lesson01.exercise01.listen_item:
    instruction: "گوش کنین و واژهٔ گفته‌شده را انتخاب کنین."
    correct_option: "جاکت"
    distractors: ["شرت/پیراهن", "پطلون", "بوت"]
    accepted_answers: [{value: "جاکت", status: "correct"}]
    feedback: "jacket یعنی جاکت."
  en.a1.unit12.lesson01.exercise02.choose_shoes:
    instruction: "واژهٔ درست برای چیزی که پا می‌پوشین را انتخاب کنین."
    correct_option: "shoes"
    distractors: ["shirt", "pants", "jacket"]
    accepted_answers: [{value: "shoes", status: "correct"}]
    feedback: "shoes یعنی بوت."
  en.a1.unit12.lesson01.exercise03.choose_dress:
    instruction: "واژهٔ درست برای لباس یک‌تکهٔ زنانه را انتخاب کنین."
    correct_option: "dress"
    distractors: ["shirt", "pants", "shoes"]
    accepted_answers: [{value: "dress", status: "correct"}]
    feedback: "dress یعنی لباس زنانهٔ یک‌تکه."
  en.a1.unit12.lesson01.exercise04.match_clothing_words:
    instruction: "هر توضیح را به واژهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "worn on the upper body", right: "shirt"}, {left: "worn on the legs", right: "pants"}, {left: "worn on the feet", right: "shoes"}, {left: "worn over other clothes, often for warmth", right: "jacket"}], status: "correct"}]
    feedback: "shirt=شرت، pants=پطلون، shoes=بوت، jacket=جاکت."
  en.a1.unit12.lesson01.exercise05.write_dress:
    instruction: "واژهٔ انگلیسی برای لباس یک‌تکه را بنویسین."
    accepted_answers:
      - {value: "dress", status: "correct"}
      - {value: "Dress", status: "correct"}
    feedback: "dress یعنی لباس زنانهٔ یک‌تکه."

  en.a1.unit12.lesson02.exercise01.listen_size_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "سایز منجم"
    distractors: ["رنگ آبی", "قیمت", "سایز خورد"]
    accepted_answers: [{value: "سایز منجم", status: "correct"}]
    feedback: "Do you have this in a medium؟ دربارهٔ سایز منجم می‌پرسه."
  en.a1.unit12.lesson02.exercise02.listen_color_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "رنگ آبی"
    distractors: ["سایز منجم", "قیمت", "رنگ سیاه"]
    accepted_answers: [{value: "رنگ آبی", status: "correct"}]
    feedback: "Do you have it in blue؟ دربارهٔ رنگ آبی می‌پرسه."
  en.a1.unit12.lesson02.exercise03.choose_large:
    instruction: "کدام سایز از منجم کلان‌تر است؟"
    correct_option: "large"
    distractors: ["small", "medium", "blue"]
    accepted_answers: [{value: "large", status: "correct"}]
    feedback: "large یعنی سایز کلان."
  en.a1.unit12.lesson02.exercise04.order_color_question:
    instruction: "واژه‌ها را برای پرسیدن رنگ آبی ترتیب کنین."
    accepted_answers: [{value: ["Do", "you", "have", "it", "in", "blue"], status: "correct"}]
    feedback: "ترتیب درست Do you have it in blue? است."
  en.a1.unit12.lesson02.exercise05.write_size_request:
    instruction: "بنویسین چطور می‌پرسین سایز منجم موجود است."
    accepted_answers:
      - {value: "Do you have this in a medium?", status: "correct"}
      - {value: "Do you have this in a medium", status: "correct"}
    feedback: "Do you have this in a medium؟ یعنی «همی را سایز منجم دارین؟»."

  en.a1.unit12.lesson03.exercise01.read_size:
    instruction: "لیبل را بخوانین و سایز شرت را بگین."
    correct_option: "منجم"
    distractors: ["خورد", "کلان", "آبی"]
    accepted_answers: [{value: "منجم", status: "correct"}]
    feedback: "روی لیبل Size: Medium نوشته شده."
  en.a1.unit12.lesson03.exercise02.read_color:
    instruction: "لیبل را بخوانین و رنگ شرت را بگین."
    correct_option: "آبی"
    distractors: ["سیاه", "منجم", "بیست دالر"]
    accepted_answers: [{value: "آبی", status: "correct"}]
    feedback: "روی لیبل Color: Blue نوشته شده."
  en.a1.unit12.lesson03.exercise03.choose_price:
    instruction: "شرت چند قیمت دارد؟"
    correct_option: "$20"
    distractors: ["$10", "$30", "$15"]
    accepted_answers: [{value: "$20", status: "correct"}]
    feedback: "روی لیبل Price: $20 نوشته شده."
  en.a1.unit12.lesson03.exercise04.match_label_fields:
    instruction: "هر بخش لیبل را به مقدار درستش وصل کنین."
    accepted_answers: [{value: [{left: "Size", right: "Medium"}, {left: "Color", right: "Blue"}, {left: "Price", right: "$20"}], status: "correct"}]
    feedback: "مقادیر دقیقاً مطابق متن لیبل اند."
  en.a1.unit12.lesson03.exercise05.write_label_summary:
    instruction: "سایز و رنگ شرت را بنویسین."
    accepted_answers:
      - {value: "The shirt is a medium and it's blue.", status: "correct"}
      - {value: "The shirt is a medium, and it's blue.", status: "correct"}
    feedback: "جواب کامل هم سایز و هم رنگ را بیان می‌کنه."

  en.a1.unit12.lesson04.exercise01.listen_size_available:
    instruction: "گفتگو را گوش کنین و معلوم کنین آیا سایز منجم موجود است."
    correct_option: "بلی، موجود است"
    distractors: ["نخیر، موجود نیست", "فقط سایز کلان موجود است", "باید فرمایش بدن"]
    accepted_answers: [{value: "بلی، موجود است", status: "correct"}]
    feedback: "دنیل می‌گه Yes, here you go."
  en.a1.unit12.lesson04.exercise02.listen_color_available:
    instruction: "گوش کنین و معلوم کنین آیا رنگ آبی موجود است."
    correct_option: "بلی، موجود است"
    distractors: ["نخیر، موجود نیست", "فقط سیاه موجود است", "باید فرمایش بدن"]
    accepted_answers: [{value: "بلی، موجود است", status: "correct"}]
    feedback: "دنیل می‌گه Yes, we do."
  en.a1.unit12.lesson04.exercise03.choose_final_response:
    instruction: "لیلا تصمیم می‌گیره شرت را بخره. او چه می‌گه؟"
    correct_option: "I'll take it, thanks."
    distractors: ["Do you have it in blue?", "Here you go.", "Yes, we do."]
    accepted_answers: [{value: "I'll take it, thanks.", status: "correct"}]
    feedback: "I'll take it, thanks یعنی «همی را می‌گیرم، تشکر»."
  en.a1.unit12.lesson04.exercise04.order_q_medium:
    instruction: "واژه‌ها را برای پرسیدن سایز منجم شرت ترتیب کنین."
    accepted_answers: [{value: ["do", "you", "have", "this", "shirt", "in", "a", "medium"], status: "correct"}]
    feedback: "ترتیب درست do you have this shirt in a medium است."
  en.a1.unit12.lesson04.exercise05.reply_as_leila:
    instruction: "به نقش لیلا، سایز منجم را بخواین، رنگ آبی را بپرسین، و خرید را نهایی کنین."
    accepted_answers:
      - {value: "Excuse me, do you have this shirt in a medium? Great, do you have it in blue? I'll take it, thanks.", status: "correct"}
    feedback: "جواب کامل هر سه مرحلهٔ خرید را پوشش می‌ده."
  en.a1.unit12.lesson04.exercise06.speak_shopping:
    instruction: "به نقش لیلا، آواز‌دار خرید کامل را بگین."
    accepted_answers:
      - {value: "Excuse me, do you have this shirt in a medium? Great, do you have it in blue? I'll take it, thanks.", status: "correct"}
    feedback: "جواب کامل درخواست سایز، پرسش رنگ، و تصمیم نهایی خرید را پوشش می‌ده."
