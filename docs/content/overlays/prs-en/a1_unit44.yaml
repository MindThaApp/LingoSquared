review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit44 (seasons), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the in-the-summer card: English requires the preposition in before a season used adverbially (in the summer, never bare summer), while Dari can use the bare season noun adverbially with no preposition at all (تابستان می‌ریم ساحل, literally \"summer we-go beach\") -- the در (in) form also exists in Dari but is optional, unlike English's obligatory in. Dari-specific vocabulary used for authenticity: خزان for fall/autumn (the term this course's dialect prefers over the more Iranian-leaning پاییز). Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit44.seasons: {title: "گپ‌زدن دربارهٔ فصل‌ها"}

