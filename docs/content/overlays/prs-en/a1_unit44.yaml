  en.a1.unit44.lesson02.talking_about_seasons: {title: "گپ‌زدن دربارهٔ فصل‌ها"}
  en.a1.unit44.lesson03.dialogue_favorite_seasons: {title: "گپ: فصل‌های موردعلاقه"}
