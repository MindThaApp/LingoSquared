teaching:
  en.a1.unit44.lesson01.teach.spring: {title: "spring", gloss: "بهار", note: "spring یعنی بهار.", example_gloss: "گل‌ها در بهار گل می‌کنن."}
  en.a1.unit44.lesson01.teach.summer: {title: "summer", gloss: "تابستان", note: "summer یعنی تابستان.", example_gloss: "من تابستان به ساحل می‌رم."}
  en.a1.unit44.lesson01.teach.fall: {title: "fall", gloss: "خزان", note: "fall یعنی خزان -- کلمهٔ رایج دری برای این فصل، نی پاییز که بیشتر در فارسی ایرانی می‌شنوین.", example_gloss: "رنگ برگ‌ها در خزان تغییر می‌کنه."}
  en.a1.unit44.lesson01.teach.winter: {title: "winter", gloss: "زمستان", note: "winter یعنی زمستان.", example_gloss: "زمستان برف می‌باره."}
  en.a1.unit44.lesson01.teach.season: {title: "season", gloss: "فصل", note: "season یعنی فصل -- دورهٔ سال با هوای مخصوص خودش.", example_gloss: "فصل موردعلاقه‌ات چیست؟"}

  en.a1.unit44.lesson02.teach.in_the_summer: {title: "in the summer", gloss: "در تابستان", note: "in the summer یعنی در تابستان. نکتهٔ گرامری: انگلیسی پیش از نام فصل‌ها حرف اضافهٔ in را لازم داره (in the summer)، درحالیکه دری می‌تانه فصل را مستقیم و بدون هیچ حرف اضافه به کار ببره (تابستان می‌ریم ساحل) یا با در (در تابستان) -- هردو شکل درست استند، خو در دری حرف اضافه ضروری نیست.", example_gloss: "ما تابستان به ساحل می‌ریم."}
  en.a1.unit44.lesson02.teach.leaves_change_color: {title: "the leaves change color", gloss: "رنگ برگ‌ها تغییر می‌کنه", note: "the leaves change color یعنی رنگ برگ‌ها در خزان تغییر می‌کنه.", example_gloss: "در خزان، رنگ برگ‌ها تغییر می‌کنه."}
  en.a1.unit44.lesson02.teach.it_snows_a_lot: {title: "it snows a lot", gloss: "برف زیاد می‌باره", note: "it snows a lot یعنی برف زیاد می‌باره.", example_gloss: "زمستان برف زیاد می‌باره."}
  en.a1.unit44.lesson02.teach.flowers_bloom: {title: "flowers bloom", gloss: "گل‌ها گل می‌کنن", note: "flowers bloom یعنی گل‌ها گل می‌کنن.", example_gloss: "گل‌ها در بهار گل می‌کنن."}
  en.a1.unit44.lesson02.teach.whats_your_favorite_season: {title: "What's your favorite season?", gloss: "فصل موردعلاقه‌ات چیست؟", note: "این سوال با What's (What is) شروع می‌شه."}
  en.a1.unit44.lesson02.teach.my_favorite_season_is: {title: "My favorite season is fall.", gloss: "فصل موردعلاقه‌ام خزان استه.", note: "الگوی My favorite season is + فصل برای جواب‌دادن کار می‌ره."}

  en.a1.unit44.lesson03.teach.dialogue_line1: {title: "میا می‌پرسه", gloss: "لیلا، فصل موردعلاقه‌ات چیست؟", note: "شروع گپ با یک سوال دوستانه."}
  en.a1.unit44.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "خزان. رنگ برگ‌ها تغییر می‌کنه، و هوایش برای نقاشی‌کردن در بیرون خیلی خوبس.", note: "great weather for + فعل+ing برای گفتن هوای مناسب یک فعالیت کار می‌ره."}
  en.a1.unit44.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "چه قشنگ. فصل موردعلاقه‌ام بهار استه.", note: "That sounds nice -- طریقهٔ رایج برای نشان‌دادن علاقه به گپ کسی."}
  en.a1.unit44.lesson03.teach.dialogue_line4: {title: "لیلا می‌پرسه", gloss: "چرا بهار؟", note: "Why + کلمه، یک سوال کوتاه."}
  en.a1.unit44.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "گل‌ها گل می‌کنن، و من عاشق عکس‌گرفتن ازشان برای صنف عکاسی‌ام استم.", note: "love + فعل+ing نشان‌دهندهٔ علاقهٔ قوی استه."}
  en.a1.unit44.lesson03.teach.dialogue_line6: {title: "لیلا می‌پرسه", gloss: "معنا داره! جایی که عکس می‌گیری بهار گرم استه یا سرد؟", note: "warm or cold؟ سوال دوگزینه‌یی."}
  en.a1.unit44.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "معمولاً گرم استه، با کمی باران. برای گشت‌زدن در بیرون عالیس.", note: "perfect for + اسم/فعل+ing برای گفتن یک چیز خیلی مناسب استه."}

  en.a1.unit44.lesson04.teach.reading_passage: {title: "متن: سه رفیق، سه فصل موردعلاقه", gloss: "دنیل، لیلا و میا هرکدام فصل موردعلاقهٔ متفاوتی دارند. فصل موردعلاقهٔ دنیل تابستان استه. او وقتی هوا گرم و آفتابیس عاشق فوتبال‌بازی‌کردن و دویدن استه. فصل موردعلاقهٔ لیلا خزان استه، چون او عاشق نقاشی‌کردن برگ‌هاییس که رنگ‌شان تغییر می‌کنه. فصل موردعلاقهٔ میا بهار استه. او برای صنف عکاسی‌اش از گل‌ها عکس می‌گیره. با آنکه هرسه‌شان فصل‌های مختلف دوست دارند، همیشه وخت پیدا می‌کنن تا باهم از فضای بیرون لذت ببرن.", note: "این متن چند فصل و عبارت مربوط به فصل‌ها را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit44.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و فصلی که گفته شد را انتخاب کنین."
    correct_option: "fall"
    distractors: ["spring", "summer", "winter"]
    accepted_answers: [{value: "fall", status: "correct"}]
    feedback: "fall یعنی خزان."
  en.a1.unit44.lesson01.exercise02.choose_winter_meaning:
    instruction: "کدام فصل از همه سردتر استه، با برف؟"
    correct_option: "winter"
    distractors: ["spring", "summer", "fall"]
    accepted_answers: [{value: "winter", status: "correct"}]
    feedback: "winter یعنی زمستان."
  en.a1.unit44.lesson01.exercise03.match_season_words:
    instruction: "هر توضیح را به فصل درست وصل کنین."
    accepted_answers: [{value: [{left: "گل‌ها گل می‌کنن", right: "spring"}, {left: "هوا گرم استه، و مردم به ساحل می‌رن", right: "summer"}, {left: "رنگ برگ‌ها تغییر می‌کنه", right: "fall"}, {left: "معمولاً برف می‌باره", right: "winter"}, {left: "دورهٔ سال با هوای مخصوص خودش", right: "season"}], status: "correct"}]
    feedback: "spring=بهار، summer=تابستان، fall=خزان، winter=زمستان، season=فصل."
  en.a1.unit44.lesson01.exercise04.order_winter_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["It", "snows", "in", "winter."], status: "correct"}]
    feedback: "ترتیب درست: It snows in winter."
  en.a1.unit44.lesson01.exercise05.write_spring_word:
    instruction: "فصلی که در آن گل‌ها گل می‌کنن را بنویسین."
    accepted_answers: [{value: "spring", status: "correct"}]
    feedback: "spring یعنی بهار."

  en.a1.unit44.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "the leaves change color"
    distractors: ["in the summer", "it snows a lot", "flowers bloom"]
    accepted_answers: [{value: "the leaves change color", status: "correct"}]
    feedback: "the leaves change color یعنی رنگ برگ‌ها تغییر می‌کنه."
  en.a1.unit44.lesson02.exercise02.choose_flowers_bloom_meaning:
    instruction: "کدام عبارت اتفاقی که در بهار برای نباتات می‌افته را توضیف می‌ده؟"
    correct_option: "flowers bloom"
    distractors: ["in the summer", "it snows a lot", "the leaves change color"]
    accepted_answers: [{value: "flowers bloom", status: "correct"}]
    feedback: "flowers bloom یعنی گل‌ها گل می‌کنن."
  en.a1.unit44.lesson02.exercise03.choose_it_snows_a_lot_meaning:
    instruction: "کدام عبارت هوای معمول زمستان را توضیف می‌ده؟"
    correct_option: "it snows a lot"
    distractors: ["in the summer", "flowers bloom", "the leaves change color"]
    accepted_answers: [{value: "it snows a lot", status: "correct"}]
    feedback: "it snows a lot یعنی برف زیاد می‌باره."
  en.a1.unit44.lesson02.exercise04.order_spring_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Flowers", "bloom", "in", "the", "spring."], status: "correct"}]
    feedback: "ترتیب درست: Flowers bloom in the spring."
  en.a1.unit44.lesson02.exercise05.translate_favorite_season_question:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «فصل موردعلاقه‌ات چیست؟»"
    accepted_answers:
      - {value: "What's your favorite season?", status: "correct"}
      - {value: "What's your favorite season", status: "correct"}
    feedback: "What's your favorite season?"

  en.a1.unit44.lesson03.exercise01.comprehension_leila_favorite_season:
    instruction: "مطابق گپ، فصل موردعلاقهٔ لیلا کدام استه؟"
    correct_option: "fall"
    distractors: ["spring", "summer", "winter"]
    accepted_answers: [{value: "fall", status: "correct"}]
    feedback: "لیلا می‌گه Fall."
  en.a1.unit44.lesson03.exercise02.comprehension_mia_spring_reason:
    instruction: "مطابق گپ، میا چرا بهار را دوست داره؟"
    correct_option: "flowers bloom"
    distractors: ["the weather is cold", "she can go skiing", "school starts"]
    accepted_answers: [{value: "flowers bloom", status: "correct"}]
    feedback: "میا می‌گه The flowers bloom."
  en.a1.unit44.lesson03.exercise03.listen_dialogue_mia_spring_activity:
    instruction: "مطابق گپ، میا با گل‌های بهار چی کار می‌کنه؟"
    correct_option: "taking photos"
    distractors: ["planting a garden", "going for a run", "having a picnic"]
    accepted_answers: [{value: "taking photos", status: "correct"}]
    feedback: "میا می‌گه I love taking photos of them."
  en.a1.unit44.lesson03.exercise04.respond_own_favorite_season:
    instruction: "فصل موردعلاقهٔ خودتان را بگین، یا بپرسین فصل موردعلاقهٔ کسی چیست."
    accepted_answers: ["My favorite season is fall", "My favorite season is fall.", "My favorite season is spring", "My favorite season is spring.", "My favorite season is summer", "My favorite season is summer.", "My favorite season is winter", "My favorite season is winter.", "What's your favorite season?"]
    feedback: "می‌تانین بگین My favorite season is... یا بپرسین What's your favorite season؟"

  en.a1.unit44.lesson04.exercise01.reading_daniel_favorite_season:
    instruction: "مطابق متن، فصل موردعلاقهٔ دنیل چیست؟"
    correct_option: "summer"
    distractors: ["spring", "fall", "winter"]
    accepted_answers: [{value: "summer", status: "correct"}]
    feedback: "متن می‌گه Daniel's favorite season is summer."
  en.a1.unit44.lesson04.exercise02.reading_leila_fall_reason:
    instruction: "مطابق متن، خزان چرا فصل موردعلاقهٔ لیلاس؟"
    correct_option: "painting the leaves"
    distractors: ["swimming in the pool", "her birthday is in fall", "cooler weather for running"]
    accepted_answers: [{value: "painting the leaves", status: "correct"}]
    feedback: "متن می‌گه she loves painting the leaves as they change color."
  en.a1.unit44.lesson04.exercise03.reading_mia_spring_activity:
    instruction: "مطابق متن، میا با گل‌های بهار چی کار می‌کنه؟"
    correct_option: "takes photos"
    distractors: ["plants a garden", "paints pictures", "goes swimming"]
    accepted_answers: [{value: "takes photos", status: "correct"}]
    feedback: "متن می‌گه She takes photos of the flowers."
  en.a1.unit44.lesson04.exercise04.write_own_favorite_season_sentence:
    instruction: "یک جمله در بارهٔ فصل موردعلاقهٔ خودتان بنویسین، با «My favorite season is...»."
    accepted_answers: ["My favorite season is spring", "My favorite season is spring.", "My favorite season is summer", "My favorite season is summer.", "My favorite season is fall", "My favorite season is fall.", "My favorite season is winter", "My favorite season is winter."]
    feedback: "می‌تانین از الگوی My favorite season is... کار بگیرین."
