review: {status: "unreviewed", required_next_reviewer: "codex", notes: "Draft only -- authored against a still-unreviewed shared English realization (en.a1.unit33.transportation), per the standing outage contingency. Two real Dari-speaker English interference points, chosen to be distinct grammar points (not just relabeled fa-en points -- both dialects would have similar underlying grammar here but the Dari text itself is authored fresh, independently, per the sibling-isolation rule): (1) English's dummy/expletive subject it with duration verbs (It takes twenty minutes) has no equivalent in Dari, where the time period itself is the grammatical subject of وخت گرفتن (بیست دقیقه وخت می‌گیره -- literally twenty minutes takes-time, no it); (2) English lexicalizes a different verb per transport mode (take the bus/train, drive a car, ride a bike, walk with no object), while Dari generalizes with به/با + noun + رفتن (go to/by X) for any vehicle, so a Dari speaker must memorize the English verb-mode pairing instead of reusing one pattern. Needs the mandatory fresh-context review before import, same as every other Claude-authored unit this project."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit33.transportation: {title: "رفت و آمد در شهر"}

lessons:
  en.a1.unit33.lesson01.transport_vocabulary: {title: "طریقه‌های رفتن"}
  en.a1.unit33.lesson02.describing_commutes: {title: "چطور می‌رین"}
  en.a1.unit33.lesson03.dialogue_commute_talk: {title: "گپ در بارهٔ رفت و آمد"}
  en.a1.unit33.lesson04.two_commuters: {title: "متن: دو نفر که هر روز می‌رن سر کار"}

teaching:
  en.a1.unit33.lesson01.teach.bus: {title: "bus", gloss: "بس", note: "bus یعنی بس. فعلی که همرایش می‌آیه take استه: take the bus. توجه: در دری برای هر نوع وسیله یک ساختار یکسان استفاده می‌شه (به بس رفتن)، خو انگلیسی برای هر وسیله یک فعل جداگانه داره (take، drive، ride) که باید جدا جدا یاد گرفته شه.", example_gloss: "من به بس می‌رم."}
  en.a1.unit33.lesson01.teach.train: {title: "train", gloss: "ریل", note: "train یعنی ریل (قطار). مثل bus، فعلش هم take استه: take the train.", example_gloss: "او به ریل می‌ره."}
  en.a1.unit33.lesson01.teach.car: {title: "car", gloss: "موتر", note: "car یعنی موتر. برای موتر فعل take استعمال نمی‌شه، فعل drive می‌آیه: drive my car -- یک فعل کاملاً جدا از take.", example_gloss: "من با موترم به کار می‌رم."}
  en.a1.unit33.lesson01.teach.bike: {title: "bike", gloss: "بایسکل", note: "bike یعنی بایسکل. فعلش هم فرق داره: ride a bike (نی take و نی drive).", example_gloss: "او هر روز با بایسکلش می‌ره."}
  en.a1.unit33.lesson01.teach.walk: {title: "walk", gloss: "پیاده رفتن", note: "walk یعنی پیاده رفتن. اینجه هیچ فعل کمکی مثل take/drive/ride ضرور نیست، چون walk خودش فعل استه: walk to work، نی take a walk to work.", example_gloss: "من پیاده به کار می‌رم."}

  en.a1.unit33.lesson02.teach.how_get_to: {title: "How do you get to work?", gloss: "شما چطور به کار می‌رین؟", note: "این سوال با فعل کمکی do شروع می‌شه چون فعل اصلی get استه. دری برای این سوال ضرورت به فعل کمکی نداره."}
  en.a1.unit33.lesson02.teach.usually: {title: "usually", gloss: "معمولاً", note: "usually یعنی معمولاً. در انگلیسی این قید معمولاً بین فاعل و فعل اصلی می‌آیه: I usually take the bus.", example_gloss: "من معمولاً به بس می‌رم."}
  en.a1.unit33.lesson02.teach.minutes: {title: "minutes", gloss: "دقیقه", note: "minutes یعنی دقیقه. جملهٔ It takes twenty minutes یک ساختار خاص داره: it اینجه فاعل مجازی استه و معنای مستقل نداره، صرف جای فاعل را پُر می‌کنه. دری همچو فاعل مجازی نداره -- می‌گیم «بیست دقیقه وخت می‌گیره»، یعنی خودِ «بیست دقیقه» فاعل جمله استه، نی یک کلمهٔ اضافی مثل it.", example_gloss: "بیست دقیقه وخت می‌گیره."}
  en.a1.unit33.lesson02.teach.late: {title: "late", gloss: "دیر", note: "late یعنی دیر (رسیدن بعد از وخت معلوم). The bus is often late.", example_gloss: "بس اکثراً دیر می‌رسه."}
  en.a1.unit33.lesson02.teach.faster: {title: "faster", gloss: "زیادتر تیز", note: "faster یعنی زیادتر تیز، صفت تفضیلی fast با پسوند -er. با than برای مقایسه می‌آیه: faster than the bus.", example_gloss: "ریل از بس زیادتر تیز استه."}

  en.a1.unit33.lesson03.teach.dialogue_line1: {title: "سوال لیلا", gloss: "لیلا می‌پرسه دنیل چطور به کار می‌ره.", note: "شروع گپ با سوال How do you get to work؟"}
  en.a1.unit33.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه معمولاً به بس می‌ره. تقریباً بیست دقیقه وخت می‌گیره.", note: "دو نکته یکجا: فعل take برای بس، و فاعل مجازی it در It takes about twenty minutes."}
  en.a1.unit33.lesson03.teach.dialogue_line3: {title: "سوال لیلا", gloss: "لیلا می‌پرسه خوشش می‌آیه؟", note: "سوال بلی/نی با Do."}
  en.a1.unit33.lesson03.teach.dialogue_line4: {title: "جواب دنیل", gloss: "دنیل می‌گه بد نیست، خو اکثراً دیر می‌رسه. از لیلا هم می‌پرسه.", note: "How about you؟ یعنی «شما چطور؟» -- یک سوال کوتاه برای برگرداندن سوال."}
  en.a1.unit33.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه با موتر می‌ره. زیادتر تیز استه، خو پارک‌کردن مشکل استه.", note: "اینجه فعل drive برای موتر استعمال شده، نی take."}

  en.a1.unit33.lesson04.teach.reading_passage: {title: "متن: لیلا و دنیل", gloss: "لیلا هر روز با موتر به کار می‌ره. تقریباً پانزده دقیقه وخت می‌گیره، خو پارک‌کردن نزدیک دفترش مشکل استه. دنیل موتر نداره، پس به بس می‌ره. بس‌اش بیست دقیقه وخت می‌گیره و بعضی وخت‌ها دیر می‌رسه، خو ضرورت نداره در بارهٔ پارک فکر کنه.", note: "این متن تمام کلمات این درس را در جمله‌های واقعی استعمال می‌کنه -- توجه کنین که فعل take صرف برای بس و ریل استعمال می‌شه، drive صرف برای موتر."}

exercises:
  en.a1.unit33.lesson01.exercise01.listen_mode:
    instruction: "گوش کنین و وسیلهٔ گفته‌شده را انتخاب کنین."
    correct_option: "train"
    distractors: ["bus", "car", "bike", "walk"]
    accepted_answers: [{value: "train", status: "correct"}]
    feedback: "train یعنی ریل."
  en.a1.unit33.lesson01.exercise02.choose_fastest:
    instruction: "معمولاً برای مسافت طولانی در شهر کدام وسیله زیادتر تیز استه؟"
    correct_option: "car"
    distractors: ["bike", "walk", "bus"]
    accepted_answers: [{value: "car", status: "correct"}]
    feedback: "car (موتر) معمولاً برای مسافت طولانی در شهر زیادتر تیز استه."
  en.a1.unit33.lesson01.exercise03.match_modes:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{value: [{left: "یک وسیلهٔ عمومی بزرگ با چوکی‌های زیاد", right: "bus"}, {left: "روی ریل حرکت می‌کنه", right: "train"}, {left: "خودتان راننده‌گیش می‌کنین", right: "car"}, {left: "با پا رکاب می‌زنین", right: "bike"}, {left: "صرف با پاهای‌تان، بدون هیچ وسیله", right: "walk"}], status: "correct"}]
    feedback: "bus=بس، train=ریل، car=موتر، bike=بایسکل، walk=پیاده رفتن."
  en.a1.unit33.lesson01.exercise04.order_car_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "drive", "my", "car", "to", "work."], status: "correct"}]
    feedback: "ترتیب درست: I drive my car to work. برای موتر فعل drive استعمال می‌شه، نی take."
  en.a1.unit33.lesson01.exercise05.write_transport_word:
    instruction: "کلمه‌ای را بنویسین که یعنی وسیله‌ای که با پا رکاب می‌زنین."
    accepted_answers: [{value: "bike", status: "correct"}]
    feedback: "bike یعنی بایسکل."

  en.a1.unit33.lesson02.exercise01.listen_question:
    instruction: "گوش کنین و جمله‌ای که شنیدین را انتخاب کنین."
    correct_option: "How do you get to work?"
    distractors: ["What do you do at work?", "Where do you work?", "When do you go to work?"]
    accepted_answers: [{value: "How do you get to work?", status: "correct"}]
    feedback: "How do you get to work? یعنی شما چطور به کار می‌رین؟"
  en.a1.unit33.lesson02.exercise02.choose_late_meaning:
    instruction: "کدام کلمه یعنی رسیدن بعد از وخت معلوم؟"
    correct_option: "late"
    distractors: ["faster", "usually", "minutes"]
    accepted_answers: [{value: "late", status: "correct"}]
    feedback: "late یعنی دیر."
  en.a1.unit33.lesson02.exercise03.choose_faster_meaning:
    instruction: "کدام کلمه یعنی «کمتر وخت می‌گیره» موقع مقایسهٔ دو چیز؟"
    correct_option: "faster"
    distractors: ["late", "usually", "minutes"]
    accepted_answers: [{value: "faster", status: "correct"}]
    feedback: "faster یعنی زیادتر تیز."
  en.a1.unit33.lesson02.exercise04.order_takes_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["It", "takes", "twenty", "minutes."], status: "correct"}]
    feedback: "ترتیب درست: It takes twenty minutes. -- it اینجه فاعل مجازی استه، معنای مستقل نداره."
  en.a1.unit33.lesson02.exercise05.translate_usually_bus:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «من معمولاً به بس می‌رم.»"
    accepted_answers:
      - {value: "I usually take the bus.", status: "correct"}
      - {value: "I usually take the bus", status: "correct"}
    feedback: "I usually take the bus. -- فعل take برای بس، و usually بین فاعل و فعل می‌آیه."

  en.a1.unit33.lesson03.exercise01.comprehension_daniel_mode:
    instruction: "مطابق گپ، دنیل معمولاً چطور به کار می‌ره؟"
    correct_option: "the bus"
    distractors: ["the train", "his car", "his bike"]
    accepted_answers: [{value: "the bus", status: "correct"}]
    feedback: "دنیل می‌گه معمولاً به بس می‌ره."
  en.a1.unit33.lesson03.exercise02.comprehension_leila_problem:
    instruction: "مطابق گپ، لیلا در بارهٔ راننده‌گی چه مشکلی را مطرح می‌کنه؟"
    correct_option: "parking is difficult"
    distractors: ["it's too slow", "it's too expensive", "the traffic is bad"]
    accepted_answers: [{value: "parking is difficult", status: "correct"}]
    feedback: "لیلا می‌گه پارک‌کردن مشکل استه."
  en.a1.unit33.lesson03.exercise03.listen_dialogue_time:
    instruction: "مطابق گپ، بس دنیل تقریباً چقدر وخت می‌گیره؟"
    correct_option: "twenty minutes"
    distractors: ["ten minutes", "fifteen minutes", "thirty minutes"]
    accepted_answers: [{value: "twenty minutes", status: "correct"}]
    feedback: "دنیل می‌گه تقریباً بیست دقیقه وخت می‌گیره."
  en.a1.unit33.lesson03.exercise04.respond_own_commute:
    instruction: "بگین معمولاً چطور به کار یا مکتب می‌رین."
    accepted_answers: ["I take the bus", "I take the bus.", "I take the train", "I take the train.", "I drive", "I drive.", "I ride my bike", "I ride my bike.", "I walk", "I walk."]
    feedback: "می‌تانین از الگوی I take/drive/ride/walk استفاده کنین -- هر فعل با وسیلهٔ خودش می‌آیه."

  en.a1.unit33.lesson04.exercise01.reading_leila_problem:
    instruction: "مطابق متن، برای لیلا چی مشکل استه؟"
    correct_option: "parking near her office is difficult"
    distractors: ["driving her car is difficult", "the bus is often late", "walking to work is difficult"]
    accepted_answers: [{value: "parking near her office is difficult", status: "correct"}]
    feedback: "متن می‌گه پارک‌کردن نزدیک دفترش مشکل استه."
  en.a1.unit33.lesson04.exercise02.reading_daniel_mode:
    instruction: "مطابق متن، دنیل چطور به کار می‌ره؟"
    correct_option: "the bus"
    distractors: ["the train", "his car", "his bike"]
    accepted_answers: [{value: "the bus", status: "correct"}]
    feedback: "متن می‌گه دنیل موتر نداره، پس به بس می‌ره."
  en.a1.unit33.lesson04.exercise03.reading_who_faster:
    instruction: "مطابق متن، رفت و آمد کدام‌شان کمتر وخت می‌گیره؟"
    correct_option: "Leila"
    distractors: ["Daniel", "both take the same time", "neither"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "متن می‌گه راننده‌گی لیلا تقریباً پانزده دقیقه وخت می‌گیره، خو بس دنیل بیست دقیقه -- پس لیلا کمتر وخت می‌گیره."
  en.a1.unit33.lesson04.exercise04.write_own_commute_sentence:
    instruction: "یک جمله در بارهٔ اینکه چطور به کار یا مکتب می‌رین بنویسین."
    accepted_answers: ["I take the bus", "I take the bus.", "I take the train", "I take the train.", "I drive", "I drive.", "I ride my bike", "I ride my bike.", "I walk", "I walk."]
    feedback: "می‌تانین از الگوی I take/drive/ride/walk استفاده کنین."
