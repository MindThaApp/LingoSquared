    instruction: "شنبه مصروف استین و نمی‌تانین بیایین. چی می‌گین؟"
    correct_option: "Sorry, I can't. I'm busy on Saturday."
    distractors: ["Sure, I'd love to!", "Sunday works for me.", "Do you want to see a movie?"]
    accepted_answers: [{value: "Sorry, I can't. I'm busy on Saturday.", status: "correct"}]
    feedback: "Sorry, I can't. I'm busy on Saturday یعنی ببخشین، نمی‌تانم. شنبه مصروف استم."
  en.a1.unit17.lesson02.exercise03.order_accept:
    instruction: "کلمات را برای گفتن «البته، خیلی خوش می‌شم» ترتیب کنین."
    accepted_answers: [{value: ["Sure", "I'd", "love", "to"], status: "correct"}]
    feedback: "ترتیب درست: Sure, I'd love to!"
  en.a1.unit17.lesson02.exercise04.reply_decline_suggest:
    instruction: "دنیل می‌پرسه: می‌خواین شنبه فلم ببینیم؟"
