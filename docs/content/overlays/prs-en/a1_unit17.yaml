    instruction: "دنیل می‌گه: می‌خواین همی آخر هفته فلم ببینیم؟ نظر تان در بارهٔ شنبه چیست؟"
    accepted_answers:
      - {value: "Sure, I'd love to! What day? Sorry, I can't. I'm busy on Saturday. What about Sunday?", status: "correct"}
    feedback: "لیلا اول قبول می‌کنه، بعد شنبه را رد می‌کنه و یکشنبه را پیشنهاد می‌ده -- سه لحظهٔ جدا از گفتگو."
  en.a1.unit17.lesson04.exercise06.speak_negotiate_plan:
