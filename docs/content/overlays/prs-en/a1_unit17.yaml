    instruction: "گوش کنین و عبارت گفته‌شده را انتخاب کنین."
    correct_option: "I'd love to"
    distractors: ["I'm busy", "another time", "works for me"]
    accepted_answers: [{value: "I'd love to", status: "correct"}]
    feedback: "I'd love to یعنی خیلی خوش می‌شم."
