    correct_option: "seeing a movie this weekend"
    distractors: ["going for a walk", "having lunch", "going to work"]
    accepted_answers: [{value: "seeing a movie this weekend", status: "correct"}]
    feedback: "دنیل می‌گه Do you want to see a movie this weekend؟"
  en.a1.unit17.lesson04.exercise02.listen_final_day:
