exercises:
  en.a1.unit17.lesson01.exercise01.listen_invitation:
    instruction: "گوش کنین و جملهٔ گفته‌شده را انتخاب کنین."
    correct_option: "Do you want to see a movie this weekend?"
    distractors: ["Would you like to go for a walk?", "Sure, I'd love to!", "Sorry, I can't."]
    accepted_answers: [{value: "Do you want to see a movie this weekend?", status: "correct"}]
    feedback: "Do you want to see a movie this weekend؟ یعنی می‌خواین همی آخر هفته فلم ببینیم؟"
  en.a1.unit17.lesson01.exercise02.choose_invitation:
    instruction: "می‌خواین یک نفر را برای دیدن فلم دعوت کنین. چی می‌گین؟"
    correct_option: "Do you want to see a movie this weekend?"
    distractors: ["I'm busy on Saturday.", "Sunday works for me.", "Maybe another time?"]
    accepted_answers: [{value: "Do you want to see a movie this weekend?", status: "correct"}]
    feedback: "Do you want to...؟ برای پیشنهاد یک فعالیت استعمال می‌شه."
  en.a1.unit17.lesson01.exercise03.order_walk_invitation:
    instruction: "کلمات را برای گفتن «میل دارین قدم بزنیم؟» ترتیب کنین."
    accepted_answers: [{value: ["Would", "you", "like", "to", "go", "for", "a", "walk"], status: "correct"}]
    feedback: "ترتیب درست: Would you like to go for a walk؟"
  en.a1.unit17.lesson01.exercise04.reply_confirm_invitation:
    instruction: "از یک همرای بپرسین که آیا می‌خواد همی آخر هفته فلم ببینین."
    accepted_answers:
      - {value: "Do you want to see a movie this weekend?", status: "correct"}
    feedback: "Do you want to see a movie this weekend؟ درست‌ترین طریقه برای همی پیشنهاد استه."
  en.a1.unit17.lesson01.exercise05.write_invitation:
    instruction: "بنویسین چطور یک نفر را برای قدم‌زدن دعوت می‌کنین."
    accepted_answers:
      - {value: "Would you like to go for a walk?", status: "correct"}
      - {value: "Would you like to go for a walk", status: "correct"}
    feedback: "Would you like to go for a walk؟ یعنی میل دارین قدم بزنیم؟"

