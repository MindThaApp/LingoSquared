exercises:
  en.a1.unit24.lesson01.exercise01.listen_room:
    instruction: "گوش کنین و اتاقی که گفته شد را انتخاب کنین."
    correct_option: "living room"
    distractors: ["bedroom", "kitchen", "garden"]
    accepted_answers: [{value: "living room", status: "correct"}]
    feedback: "living room یعنی اتاق نشیمن."
  en.a1.unit24.lesson01.exercise02.choose_room_for_sleeping:
    instruction: "کدام اتاق برای خوابیدنه؟"
    correct_option: "bedroom"
    distractors: ["kitchen", "bathroom", "garden"]
    accepted_answers: [{value: "bedroom", status: "correct"}]
    feedback: "bedroom یعنی اتاق خواب."
  en.a1.unit24.lesson01.exercise03.choose_room_for_cooking:
    instruction: "کدام اتاق برای پخت‌وپزه؟"
    correct_option: "kitchen"
    distractors: ["bedroom", "bathroom", "living room"]
    accepted_answers: [{value: "kitchen", status: "correct"}]
    feedback: "kitchen یعنی آشپزخانه."
  en.a1.unit24.lesson01.exercise04.match_rooms:
    instruction: "هر توضیح را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "bedroom", right: "the room for sleeping"}, {left: "kitchen", right: "the room for cooking"}, {left: "bathroom", right: "the room with a shower or bath"}, {left: "garden", right: "the outdoor area for plants"}, {left: "living room", right: "the room for relaxing together, often with a TV"}], status: "correct"}]
    feedback: "bedroom=اتاق خواب، kitchen=آشپزخانه، bathroom=تشناب، garden=باغچه."
  en.a1.unit24.lesson01.exercise05.write_bathroom:
    instruction: "کلمه‌ای را بنویسین که یعنی اتاق با دوش یا وان."
    accepted_answers:
      - {value: "bathroom", status: "correct"}
      - {value: "Bathroom", status: "correct"}
    feedback: "bathroom یعنی تشناب."

  en.a1.unit24.lesson02.exercise01.listen_question:
    instruction: "گوش کنین و سوالی که پرسیده شد را انتخاب کنین."
    correct_option: "چند اتاق استه"
    distractors: ["ساعت چند استه", "چند کتاب دارین", "چند سال دارین"]
    accepted_answers: [{value: "چند اتاق استه", status: "correct"}]
    feedback: "How many rooms are there؟ می‌پرسه چند اتاق استه."
  en.a1.unit24.lesson02.exercise02.choose_there_is_sentence:
    instruction: "چطور می‌گین «یک آشپزخانهٔ خوردک استه»؟"
    correct_option: "There's a small kitchen."
    distractors: ["How many rooms are there?", "Is there a garden?", "It has two bedrooms."]
    accepted_answers: [{value: "There's a small kitchen.", status: "correct"}]
    feedback: "There's a small kitchen یعنی یک آشپزخانهٔ خوردک استه."
  en.a1.unit24.lesson02.exercise03.order_next_to_kitchen:
    instruction: "کلمات را برای گفتن «اتاق نشیمن کنار آشپزخانه استه» ترتیب کنین."
    accepted_answers: [{value: ["The", "living", "room", "is", "next", "to", "the", "kitchen"], status: "correct"}]
    feedback: "ترتیب درست: The living room is next to the kitchen."
  en.a1.unit24.lesson02.exercise04.reply_how_many_rooms:
    instruction: "در خانه چی استه؟ (یک آشپزخانهٔ خوردک استه)"
    accepted_answers:
      - {value: "There's a small kitchen.", status: "correct"}
      - {value: "There is a small kitchen.", status: "correct"}
    feedback: "There's a small kitchen یعنی یک آشپزخانهٔ خوردک استه."
  en.a1.unit24.lesson02.exercise05.write_next_to:
    instruction: "بنویسین که آشپزخانه کنار اتاق نشیمن استه."
    accepted_answers:
      - {value: "The kitchen is next to the living room.", status: "correct"}
      - {value: "The kitchen is next to the living room", status: "correct"}
    feedback: "The kitchen is next to the living room یعنی آشپزخانه کنار اتاق نشیمن استه."

  en.a1.unit24.lesson03.exercise01.read_bedroom_count:
    instruction: "آپارتمان چند اتاق خواب داره؟"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: "correct"}]
    feedback: "متن می‌گه My apartment has two bedrooms."
  en.a1.unit24.lesson03.exercise02.read_bathroom_count:
    instruction: "آپارتمان چند تشناب داره؟"
    correct_option: "one"
    distractors: ["two", "three", "none"]
    accepted_answers: [{value: "one", status: "correct"}]
    feedback: "متن می‌گه one bathroom."
  en.a1.unit24.lesson03.exercise03.choose_kitchen_location:
    instruction: "آشپزخانه کجاست؟"
    correct_option: "next to the living room"
    distractors: ["next to the bedroom", "next to the bathroom", "upstairs"]
    accepted_answers: [{value: "next to the living room", status: "correct"}]
    feedback: "متن می‌گه There's a small kitchen next to the living room."
  en.a1.unit24.lesson03.exercise04.order_two_bedrooms:
    instruction: "کلمات را برای گفتن «آپارتمان من دو اتاق خواب و یک تشناب داره» ترتیب کنین."
    accepted_answers: [{value: ["My", "apartment", "has", "two", "bedrooms", "and", "one", "bathroom"], status: "correct"}]
    feedback: "ترتیب درست: My apartment has two bedrooms and one bathroom."
  en.a1.unit24.lesson03.exercise05.write_own_home:
    instruction: "بنویسین که آپارتمان‌تان دو اتاق خواب و یک تشناب داره."
    accepted_answers:
      - {value: "My apartment has two bedrooms and one bathroom.", status: "correct"}
      - {value: "My apartment has two bedrooms and one bathroom", status: "correct"}
    feedback: "My apartment has two bedrooms and one bathroom یعنی آپارتمانم دو اتاق خواب و یک تشناب داره."

  en.a1.unit24.lesson04.exercise01.listen_bedroom_bathroom_count:
    instruction: "گفتگو را گوش کنین و تعداد اتاق‌خواب و تشناب را انتخاب کنین."
    correct_option: "two bedrooms and one bathroom"
    distractors: ["one bedroom and one bathroom", "three bedrooms and two bathrooms", "two bedrooms and two bathrooms"]
    accepted_answers: [{value: "two bedrooms and one bathroom", status: "correct"}]
    feedback: "دنیل می‌گه It has two bedrooms and one bathroom."
  en.a1.unit24.lesson04.exercise02.listen_favorite_room:
    instruction: "گوش کنین و اتاق پسندیدهٔ دنیل را انتخاب کنین."
    correct_option: "the living room"
    distractors: ["the bedroom", "the kitchen", "the bathroom"]
    accepted_answers: [{value: "the living room", status: "correct"}]
    feedback: "دنیل می‌گه My favorite room is the living room."
  en.a1.unit24.lesson04.exercise03.choose_garden_answer:
    instruction: "آپارتمان دنیل باغچه داره؟"
    correct_option: "No, there isn't a garden, but there's a balcony."
    distractors: ["Yes, there is a large garden.", "There are two gardens.", "There's no garden or balcony."]
    accepted_answers: [{value: "No, there isn't a garden, but there's a balcony.", status: "correct"}]
    feedback: "دنیل می‌گه No, there isn't, but there's a small balcony upstairs."
  en.a1.unit24.lesson04.exercise04.order_is_there_garden:
    instruction: "کلمات را برای گفتن «باغچه داره؟» ترتیب کنین."
    accepted_answers: [{value: ["Is", "there", "a", "garden"], status: "correct"}]
    feedback: "ترتیب درست: Is there a garden؟"
