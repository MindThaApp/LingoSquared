    instruction: "لیلا می‌گه: در بارهٔ آپارتمانت برایم بگو. باغچه داره؟ اتاق پسندیده‌ات کدامه؟"
    accepted_answers:
      - {value: "It has two bedrooms and one bathroom. There's a small kitchen next to the living room. No, there isn't, but there's a small balcony upstairs. My favorite room is the living room. It's near the kitchen, so it's easy to eat dinner there.", status: "correct"}
      - {value: "It has two bedrooms and one bathroom, and there's a small kitchen next to the living room. No, there isn't, but there's a small balcony upstairs. My favorite room is the living room, and it's near the kitchen, so it's easy to eat dinner there.", status: "correct"}
    feedback: "جواب کامل توصیف آپارتمان، معلومات در بارهٔ باغچه، و اتاق پسندیده با دلیلش را با هم بیان می‌کنه -- سه لحظهٔ جدا از گفتگو."
  en.a1.unit24.lesson04.exercise06.speak_home_dialogue:
    instruction: "به جای دنیل، جواب او را برای لیلا بلند بگین."
    accepted_answers:
      - {value: "It has two bedrooms and one bathroom. There's a small kitchen next to the living room. No, there isn't, but there's a small balcony upstairs. My favorite room is the living room. It's near the kitchen, so it's easy to eat dinner there.", status: "correct"}
      - {value: "It has two bedrooms and one bathroom, and there's a small kitchen next to the living room. No, there isn't, but there's a small balcony upstairs. My favorite room is the living room, and it's near the kitchen, so it's easy to eat dinner there.", status: "correct"}
    feedback: "جواب کامل هر سه بخش گفتگو را در بر می‌گیره: توصیف آپارتمان، باغچه، و اتاق پسندیده."
