  en.a2.unit29.lesson03.teach.confirmation_text: {title: "متن اطلاعیهٔ ترمیم", gloss: "گزارش شما دربارهٔ چکیدن سینک آشپزخانه دریافت شده. یک پایپ‌کار فردا بین ساعت ۲ تا ۴ بعد از ظهر می‌آیه. نمبر ترمیم ۶۱۸۰ استه.", note: "همی یک اطلاعیهٔ رسمی استه که حالت، وقت و نمبر را می‌گه."}

  en.a2.unit29.lesson04.teach.q_report_problem: {title: "خبر دادن مشکل به مدیر", gloss: "دنیل می‌گه: می‌خواستم یک مشکل با سینک آشپزخانه‌ام را خبر بتم.", note: "همو جمله‌ای که در درس دوم یاد گرفتیم."}
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink: {title: "پرسیدن دربارهٔ مشکل سینک", gloss: "مدیر می‌پرسه: سینک چی مشکل داره؟", note: "همو شکل سوالی که داکتر در واحد ۲۸ پرسیده بود (*What's wrong?*)، حالی دربارهٔ سینک، نه صحت."}
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing: {title: "جواب دنیل دربارهٔ مدت و پرسیدن دربارهٔ ترمیم", gloss: "دنیل می‌گه: از صبح امروز داره می‌چکه. کِی کسی می‌آیه ترمیمش کنه؟", note: "همو دو جمله‌ای که در درس دوم یاد گرفتیم، حالی با هم."}
  en.a2.unit29.lesson04.teach.a_send_plumber: {title: "جواب مدیر دربارهٔ پایپ‌کار", gloss: "مدیر می‌گه: فهمیدم. فردا بین ساعت ۲ تا ۴ بعد از ظهر یک پایپ‌کار می‌فرستم.", note: "مدیر بعد از شنیدن مشکل، وقت ترمیم را مشخص می‌کنه."}
  en.a2.unit29.lesson04.teach.q_need_to_be_home: {title: "پرسیدن دربارهٔ حضور در خانه", gloss: "دنیل می‌پرسه: باید خانه باشم؟", note: "دنیل بعد از شنیدن وقت ترمیم، دربارهٔ حضورش می‌پرسه."}
  en.a2.unit29.lesson04.teach.a_confirm_window_number: {title: "تأیید آخری مدیر", gloss: "مدیر می‌گه: بلی، لطفاً بین ساعت ۲ تا ۴ بعد از ظهر خانه باشین. نمبر ترمیم‌تان همینه: ۶۱۸۰.", note: "مدیر هم وقت دقیق و هم نمبر ترمیم را با هم می‌گه."}
  en.a2.unit29.lesson04.teach.a_thank_you: {title: "تشکر آخری", gloss: "دنیل می‌گه: خیلی تشکر.", note: "*Thank you very much* یک شکل رسمی و مؤدبانهٔ تشکر استه، همرنگ ختم گفتگوی واحد ۲۵."}

