  en.a2.unit29.lesson02.teach.report_problem: {title: "خبر دادن یک مشکل", gloss: "می‌خواستم یک مشکل با سینک آشپزخانه‌ام را خبر بتم.", note: "همی یک خواهش مؤدبانه و رسمی برای خبر دادن یک مشکل استه."}
