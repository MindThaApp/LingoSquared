  en.a2.unit32.lesson01.teach.screen_time: {title: "screen time", gloss: "وقت صفحه", note: "*screen time* یعنی وقتی که به موبایل یا کمپیوتر نگاه می‌کنین.", example_gloss: "وقت صفحهٔ زیاد می‌تانه خسته‌کننده باشه."}
  en.a2.unit32.lesson01.teach.messaging_app: {title: "messaging app", gloss: "اپلیکیشن پیام‌رسان", note: "*messaging app* یعنی یک اپلیکیشن که برای فرستادن پیام استعمال می‌شه.", example_gloss: "از یک اپلیکیشن پیام‌رسان برای گپ زدن همرای فامیلم استفاده می‌کنم."}
  en.a2.unit32.lesson01.teach.notification: {title: "notification", gloss: "اطلاعیهٔ اپ", note: "*notification* یعنی یک هشدار کوچک از یک اپلیکیشن در موبایل‌تان.", example_gloss: "اطلاعیه‌هایم را چندین مرتبه در روز چک می‌کنم."}
  en.a2.unit32.lesson01.teach.download: {title: "download", gloss: "دانلود کدن", note: "*download* یعنی یک اپلیکیشن یا فایل را به موبایل‌تان اضافه کدن.", example_gloss: "می‌تانین همو اپلیکیشن آشپزی را برایم دانلود کنین؟"}

