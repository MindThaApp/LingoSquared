  en.a2.unit32.lesson02.teach.messaging_family_cooking_app: {title: "I mostly use messaging apps to talk to my family, and I use a cooking app almost every day.", gloss: "بیشتر از اپلیکیشن پیام‌رسان برای گپ زدن همرای فامیلم استفاده می‌کنم، و تقریباً هر روز از یک اپلیکیشن آشپزی استفاده می‌کنم.", note: "*mostly* یعنی بیشتر وقت‌ها."}
  en.a2.unit32.lesson02.teach.useful_but_waste_time: {title: "In my opinion, it's useful for staying in touch, but it can waste a lot of time.", gloss: "به نظر من، برای در تماس ماندن مفیده، ولی می‌تانه خیلی وقت را ضایع کنه.", note: "*in my opinion* برای بیان نظر شخصی‌تان استعمال می‌شه، همرنگ واحد ۲۶."}

  en.a2.unit32.lesson03.teach.too_much: {title: "I know it's too much screen time.", gloss: "می‌دانم که وقت صفحه‌ام زیاده.", note: "*I know it's...* برای قبول کدن یک نکتهٔ واقعی، حتی اگه خوش‌آیند نباشه، استعمال می‌شه."}
  en.a2.unit32.lesson03.teach.mias_message: {title: "متن پیام میا", gloss: "سلام! هر روز خیلی از موبایلم استفاده می‌کنم. تقریباً هر شام عکس‌ها را در رسانه‌های اجتماعی پُست می‌کنم، و اطلاعیه‌هایم را چندین مرتبه در روز چک می‌کنم. می‌دانم که وقت صفحه‌ام زیاده، ولی از شریک کدن عکس‌ها همرای دوستانم لذت می‌برم.", note: "همی یک پیام واقعی دربارهٔ عادات آنلاین یک شخص استه -- سویهٔ A2."}
  en.a2.unit32.lesson03.teach.i_enjoy_sharing_photos: {title: "I enjoy sharing photos with my friends.", gloss: "از شریک کدن عکس‌ها همرای دوستانم لذت می‌برم.", note: "*I enjoy...* برای گفتن چیزی که از آن خوش می‌آین استعمال می‌شه."}

  en.a2.unit32.lesson04.teach.q_how_much_time_phone: {title: "سوال دنیل دربارهٔ وقت موبایل", gloss: "دنیل می‌پرسه: هر روز چقدر وقت روی موبایل‌تان می‌گذرانین؟", note: "*How much time do you spend on...?* یک سوال معمول دربارهٔ عادت استه."}
  en.a2.unit32.lesson04.teach.a_twice_a_day: {title: "جواب لیلا دربارهٔ چک کدن", gloss: "لیلا می‌گه: دو مرتبه در روز، صبح و شام، رسانه‌های اجتماعی را چک می‌کنم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit32.lesson04.teach.q_what_use_it_for: {title: "سوال دنیل دربارهٔ استفاده", gloss: "دنیل می‌پرسه: بیشتر برای چی از آن استفاده می‌کنین؟", note: "*What do you use it for?* دربارهٔ هدف استفاده می‌پرسه."}
  en.a2.unit32.lesson04.teach.a_messaging_and_cooking_app: {title: "جواب لیلا دربارهٔ استفاده", gloss: "لیلا می‌گه: بیشتر از اپلیکیشن پیام‌رسان برای گپ زدن همرای فامیلم استفاده می‌کنم، و تقریباً هر روز از یک اپلیکیشن آشپزی استفاده می‌کنم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit32.lesson04.teach.q_good_thing: {title: "سوال دنیل دربارهٔ نظر", gloss: "دنیل می‌پرسه: فکر می‌کنین رسانه‌های اجتماعی چیز خوبیه؟", note: "*Do you think...is a good thing?* دربارهٔ نظر شخصی می‌پرسه."}
  en.a2.unit32.lesson04.teach.a_useful_but_waste_time: {title: "جواب لیلا دربارهٔ نظر", gloss: "لیلا می‌گه: به نظر من، برای در تماس ماندن مفیده، ولی می‌تانه خیلی وقت را ضایع کنه.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}

