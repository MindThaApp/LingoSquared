course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit02.abilities: {title: "کارهایی که می‌تانم بکنم"}

lessons:
  en.b1.unit02.lesson01.ability_vocabulary: {title: "Be able to و manage to"}
  en.b1.unit02.lesson02.present_and_past_ability: {title: "می‌تانم بکنم، تانستم بکنم"}
  en.b1.unit02.lesson03.reading_the_new_system: {title: "متن خوانی: سیستم نو"}
  en.b1.unit02.lesson04.the_license_dialogue: {title: "تانستی تمدیدش کنی؟"}

teaching:
  en.b1.unit02.lesson01.teach.be_able_to: {title: "be able to", gloss: "تانستن، امکان داشتن", note: "*be able to* یعنی توانایی یا فرصت داشتن برای انجام یک کار.", example_gloss: "می‌تانم جوازم را آنلاین تمدید کنم."}
  en.b1.unit02.lesson01.teach.manage_to: {title: "manage to", gloss: "موفق شدن به انجام کاری", note: "*manage to* یعنی با یک مقدار زحمت موفق شدن به انجام یک کار.", example_gloss: "تانستم فورمه را در ده دقیقه تمام کنم."}
  en.b1.unit02.lesson01.teach.renew: {title: "renew", gloss: "تمدید کدن", note: "*renew* یعنی یک سند را قبل از ختم شدنش تمدید کنین.", example_gloss: "ضرورت دارم جواز رانندگی‌ام را تمدید کنم."}
  en.b1.unit02.lesson01.teach.license: {title: "license", gloss: "جواز", note: "*license* یعنی یک سند رسمی که اجازهٔ کاری، مثل رانندگی، را می‌ته.", example_gloss: "جواز رانندگی‌ام همی ماه ختم می‌شه."}
  en.b1.unit02.lesson01.teach.online: {title: "online", gloss: "آنلاین، از طریق انترنت", note: "*online* یعنی از طریق انترنت، نی حضوری.", example_gloss: "حالا می‌تانین آنلاین تمدیدش کنین."}
  en.b1.unit02.lesson01.teach.in_person: {title: "in person", gloss: "حضوری، شخصاً", note: "*in person* یعنی به‌جای آنلاین، خودتان به‌جایی برین.", example_gloss: "سال گذشته، باید حضوری می‌رفتم."}

  en.b1.unit02.lesson02.teach.am_able_to_renew_online: {title: "I am able to renew my license online now.", gloss: "حالا می‌تانم جوازم را آنلاین تمدید کنم.", note: "*am able to* یعنی توانایی داشتن در زمان حال."}
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year: {title: "Last year, I was not able to do it online.", gloss: "سال گذشته، نتانستم آنلاین همی کار را بکنم.", note: "*was not able to* یعنی توانایی نداشتن در زمان گذشته."}
  en.b1.unit02.lesson02.teach.managed_to_finish: {title: "I managed to finish the form in ten minutes.", gloss: "تانستم فورمه را در ده دقیقه تمام کنم.", note: "*managed to* یعنی با موفقیت انجام دادن یک کار."}
  en.b1.unit02.lesson02.teach.grammar_present_past: {title: "I am able to renew it. I was able to renew it. I would be able to help you.", gloss: "می‌تانم تمدیدش کنم. تانستم تمدیدش کنم. می‌تانستم کمک‌تان کنم.", note: "همی سه شکل *be able to* را در زمان حال، گذشته، و شرطی نشان می‌ته."}
  en.b1.unit02.lesson03.teach.friend: {title: "friend", gloss: "دوست", note: "*friend* یعنی یک کس که با او روابط نزدیک دارین.", example_gloss: "دوستم هفتهٔ پیش جوازش را تمدید کد."}
  en.b1.unit02.lesson03.teach.system: {title: "system", gloss: "سیستم", note: "*system* یعنی یک روش سازمان‌یافته برای انجام یک کار.", example_gloss: "سیستم نو خیلی سریع‌تر استه."}
  en.b1.unit02.lesson03.teach.reading_passage: {title: "متن دربارهٔ سیستم نو", gloss: "سال گذشته، مردم نمی‌تانستن جوازهای‌شان را آنلاین تمدید کنن. همه باید حضوری به دفتر می‌رفتن. همی سال، سیستم تغییر کد. حالا مردم می‌تانن همه‌چیز را از خانه تمدید کنن. دوستم میا تانست فورمه‌اش را در ده دقیقه تمام کنه.", note: "همی یک متن واقعی استه که مقایسهٔ سیستم قدیم و نو را نشان می‌ته -- سویهٔ B1."}
  en.b1.unit02.lesson04.teach.q_were_you_able: {title: "سوال لیلا دربارهٔ جواز", gloss: "لیلا می‌گه: تانستی جوازت را آنلاین تمدید کنی؟", note: "*were you able to...?* یک سوال دربارهٔ توانایی در گذشته استه."}
  en.b1.unit02.lesson04.teach.a_wasnt_able_office: {title: "جواب دانیال", gloss: "دانیال می‌گه: نی، نتانستم. باید حضوری به دفتر می‌رفتم.", note: "*wasn't able to* یعنی توانایی نداشتن."}
  en.b1.unit02.lesson04.teach.q_really_managed: {title: "جواب لیلا", gloss: "لیلا می‌گه: راستی؟ من تانستم آنلاین در ده دقیقه تمامش کنم.", note: "*managed to* یعنی با موفقیت انجام دادن."}
  en.b1.unit02.lesson04.teach.a_next_time_save: {title: "جواب دانیال", gloss: "دانیال می‌گه: دفعهٔ بعد، می‌تانستم وقت را نجات بتم اگه آنلاین می‌کدمش.", note: "*would be able to* یک توانایی فرضی برای آینده استه."}
  en.b1.unit02.lesson04.teach.q_would_help: {title: "پیشنهاد لیلا", gloss: "لیلا می‌گه: می‌تانستم دفعهٔ بعد کمکت کنم، اگه بخواهی.", note: "*would be able to help* یک پیشنهاد مؤدبانه استه."}
  en.b1.unit02.lesson04.teach.a_thanks: {title: "جواب دانیال", gloss: "دانیال می‌گه: تشکر، خوش می‌شم.", note: "*I'd like that* یک قبول مؤدبانهٔ پیشنهاد استه."}

exercises:
  en.b1.unit02.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "license"
    distractors: ["be able to", "manage to", "online"]
    accepted_answers: [{value: "license", status: "correct"}]
    feedback: "*license* یعنی جواز."
  en.b1.unit02.lesson01.exercise02.choose_get_new_document_word:
    instruction: "کدام کلمه یعنی تمدید کدن یک سند قبل از ختم شدنش؟"
    correct_option: "renew"
    distractors: ["online", "in person", "manage to"]
    accepted_answers: [{value: "renew", status: "correct"}]
    feedback: "*renew* یعنی تمدید کدن."
  en.b1.unit02.lesson01.exercise03.choose_by_going_yourself_phrase:
    instruction: "کدام عبارت یعنی به‌جایی خودتان برین، نی آنلاین؟"
    correct_option: "in person"
    distractors: ["online", "renew", "be able to"]
    accepted_answers: [{value: "in person", status: "correct"}]
    feedback: "*in person* یعنی حضوری."
  en.b1.unit02.lesson01.exercise04.match_ability_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "be able to", right: "تانستن، امکان داشتن"}
      - {left: "manage to", right: "موفق شدن به انجام کاری"}
      - {left: "renew", right: "تمدید کدن"}
      - {left: "license", right: "جواز"}
      - {left: "online", right: "آنلاین، از طریق انترنت"}
      - {left: "in person", right: "حضوری، شخصاً"}
    accepted_answers:
      - value:
          - {left: "be able to", right: "تانستن، امکان داشتن"}
          - {left: "manage to", right: "موفق شدن به انجام کاری"}
          - {left: "renew", right: "تمدید کدن"}
          - {left: "license", right: "جواز"}
          - {left: "online", right: "آنلاین، از طریق انترنت"}
          - {left: "in person", right: "حضوری، شخصاً"}
        status: "correct"
    feedback: "*be able to*=تانستن، *manage to*=موفق شدن، *renew*=تمدید کدن، *license*=جواز، *online*=آنلاین، *in person*=حضوری."
  en.b1.unit02.lesson01.exercise05.write_renew:
    instruction: "کلمه‌ای را که یعنی تمدید کدن یک سند قبل از ختم شدنش استه بنویسین."
    accepted_answers:
      - {value: "renew", status: "correct"}
      - {value: "Renew", status: "correct"}
    feedback: "*renew* یعنی تمدید کدن."

  en.b1.unit02.lesson02.exercise01.choose_present_ability:
    instruction: "کدام جمله می‌گه که حالا می‌تانین جوازتان را آنلاین تمدید کنین؟"
    correct_option: "I am able to renew my license online now."
    distractors: ["Last year, I was not able to do it online.", "I managed to finish the form in ten minutes.", "I would be able to help you."]
    accepted_answers: [{value: "I am able to renew my license online now.", status: "correct"}]
    feedback: "*I am able to renew my license online now* یعنی حالا می‌تانم جوازم را آنلاین تمدید کنم."
  en.b1.unit02.lesson02.exercise02.choose_past_ability:
    instruction: "کدام جمله دربارهٔ سال گذشته صحبت می‌کنه؟"
    correct_option: "Last year, I was not able to do it online."
    distractors: ["I am able to renew my license online now.", "I managed to finish the form in ten minutes.", "I would be able to help you."]
    accepted_answers: [{value: "Last year, I was not able to do it online.", status: "correct"}]
    feedback: "*Last year, I was not able to do it online* یعنی سال گذشته، نتانستم آنلاین همی کار را بکنم."
  en.b1.unit02.lesson02.exercise03.order_managed_to_finish:
    instruction: "کلمات را برای گفتن «تانستم فورمه را در ده دقیقه تمام کنم» ترتیب کنین."
    accepted_answers: [{value: ["I", "managed", "to", "finish", "the", "form", "in", "ten", "minutes"], status: "correct"}]
    feedback: "ترتیب درست: *I managed to finish the form in ten minutes*"
  en.b1.unit02.lesson02.exercise04.reply_were_you_able_to_renew:
    instruction: "حالا می‌تانین جوازتان را آنلاین تمدید کنین؟"
    accepted_answers:
      - {value: "I am able to renew my license online now.", status: "correct"}
      - {value: "I am able to renew my license online now", status: "correct"}
      - {value: "I'm able to renew my license online now.", status: "correct"}
      - {value: "I'm able to renew my license online now", status: "correct"}
    feedback: "*I am able to renew my license online now* یعنی حالا می‌تانم جوازم را آنلاین تمدید کنم."
  en.b1.unit02.lesson02.exercise05.write_managed_to_finish:
    instruction: "بنویسین که توانستین فورمه را در ده دقیقه تمام کنین."
    accepted_answers:
      - {value: "I managed to finish the form in ten minutes.", status: "correct"}
      - {value: "I managed to finish the form in ten minutes", status: "correct"}
    feedback: "*I managed to finish the form in ten minutes* یعنی تانستم فورمه را در ده دقیقه تمام کنم."

  en.b1.unit02.lesson03.exercise01.comprehend_last_year:
    instruction: "سال گذشته، همه برای تمدید جوازشان چی باید می‌کدن؟"
    correct_option: "go to the office in person"
    distractors: ["call the office", "wait one month", "ask a friend to do it"]
    accepted_answers: [{value: "go to the office in person", status: "correct"}]
    feedback: "متن می‌گه *everyone had to go to the office in person*."
  en.b1.unit02.lesson03.exercise02.comprehend_mia_time:
    instruction: "میا در چند دقیقه فورمه‌اش را تمام کد؟"
    correct_option: "ten minutes"
    distractors: ["five minutes", "thirty minutes", "one hour"]
    accepted_answers: [{value: "ten minutes", status: "correct"}]
    feedback: "متن می‌گه *Mia was able to finish hers in ten minutes*."
  en.b1.unit02.lesson03.exercise03.recognize_system:
    instruction: "کدام کلمه یعنی یک روش سازمان‌یافته برای انجام یک کار؟"
    correct_option: "system"
    distractors: ["friend", "license", "online"]
    accepted_answers: [{value: "system", status: "correct"}]
    feedback: "*system* یعنی سیستم."
  en.b1.unit02.lesson03.exercise04.order_mia_was_able_to_finish:
    instruction: "کلمات را برای گفتن «میا تانست فورمه‌اش را در ده دقیقه تمام کنه» ترتیب کنین."
    accepted_answers: [{value: ["Mia", "was", "able", "to", "finish", "hers", "in", "ten", "minutes"], status: "correct"}]
    feedback: "ترتیب درست: *Mia was able to finish hers in ten minutes*"
  en.b1.unit02.lesson03.exercise05.write_friend_renewed:
    instruction: "بنویسین که دوست‌تان تانست آنلاین تمامش کنه."
    accepted_answers:
      - {value: "My friend was able to finish it online.", status: "correct"}
      - {value: "My friend was able to finish it online", status: "correct"}
    feedback: "*My friend was able to finish it online* یعنی دوستم تانست آنلاین تمامش کنه."

  en.b1.unit02.lesson04.exercise01.listen_daniel_couldnt_online:
    instruction: "گفتگو را گوش کنین و معلوم کنین دانیال چی کد چون نتوانست آنلاین تمدید کنه."
    correct_option: "go to the office in person"
    distractors: ["call the office", "ask Leila for help", "wait until next month"]
    accepted_answers: [{value: "go to the office in person", status: "correct"}]
    feedback: "دانیال می‌گه *I had to go to the office in person*."
  en.b1.unit02.lesson04.exercise02.listen_leilas_time:
    instruction: "گوش کنین و معلوم کنین لیلا در چند دقیقه تمامش کد."
    correct_option: "ten minutes"
    distractors: ["five minutes", "twenty minutes", "one hour"]
    accepted_answers: [{value: "ten minutes", status: "correct"}]
    feedback: "لیلا می‌گه *I managed to do it online in ten minutes*."
  en.b1.unit02.lesson04.exercise03.choose_leilas_offer:
    instruction: "لیلا چی پیشنهاد می‌کنه که دفعهٔ بعد بکنه؟"
    correct_option: "I would be able to help you next time, if you want."
    distractors: ["I would be able to renew it for you.", "I would be able to go with you in person.", "I would be able to pay for it."]
    accepted_answers: [{value: "I would be able to help you next time, if you want.", status: "correct"}]
    feedback: "لیلا می‌گه *I would be able to help you next time, if you want*."
  en.b1.unit02.lesson04.exercise04.order_i_wasnt_able_to:
    instruction: "کلمات را برای گفتن «نتانستم آنلاین انجامش بتم» ترتیب کنین."
    accepted_answers: [{value: ["I", "wasn't", "able", "to", "do", "it", "online"], status: "correct"}]
    feedback: "ترتیب درست: *I wasn't able to do it online*"
  en.b1.unit02.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌پرسه: تانستی جوازت را آنلاین تمدید کنی؟"
    accepted_answers:
      - {value: "No, I wasn't able to. I had to go to the office in person.", status: "correct"}
      - {value: "No, I was not able to. I had to go to the office in person.", status: "correct"}
    feedback: "*No, I wasn't able to. I had to go to the office in person* یعنی نی، نتانستم. باید حضوری به دفتر می‌رفتم."
  en.b1.unit02.lesson04.exercise06.speak_ability_dialogue:
    instruction: "به نقش دانیال، آوازی جواب بته."
    accepted_answers:
      - {value: "Next time, I would be able to save time if I did it online too.", status: "correct"}
    feedback: "*Next time, I would be able to save time if I did it online too* یعنی دفعهٔ بعد، می‌تانستم وقت را نجات بتم اگه آنلاین می‌کدمش."
