course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit34.shopping_complaint: {title: "شکایت دربارهٔ یک خرید"}

lessons:
  en.a2.unit34.lesson01.complaint_vocabulary: {title: "پس‌دادن پول، تبدیل، و رسید"}
  en.a2.unit34.lesson02.making_a_complaint: {title: "شرح مشکل و خواهش پس‌دادن پول"}
  en.a2.unit34.lesson03.reading_a_return_policy: {title: "خواندن یک قانون پس‌دادن اجناس"}
  en.a2.unit34.lesson04.store_dialogue: {title: "پس دادن بلندر"}

teaching:
  en.a2.unit34.lesson01.teach.refund: {title: "refund", gloss: "پس‌دادن پول", note: "*refund* یعنی پول‌تان دوباره پس داده شه.", example_gloss: "می‌خواستم پول همی بلندر را پس بگیرم."}
  en.a2.unit34.lesson01.teach.exchange: {title: "exchange", gloss: "تبدیل", note: "*exchange* یعنی یک جنس را با یک جنس دیگه تبدیل کدن.", example_gloss: "پول‌تان را پس می‌خواین یا تبدیل؟"}
  en.a2.unit34.lesson01.teach.receipt: {title: "receipt", gloss: "رسید", note: "*receipt* یعنی کاغذی که ثابت می‌کنه چیزی را خریدین.", example_gloss: "رسیدتان را دارین؟"}
  en.a2.unit34.lesson01.teach.return_policy: {title: "return policy", gloss: "قانون پس‌دادن اجناس", note: "*return policy* یعنی قانون‌های یک دکان دربارهٔ پس‌دادن اجناس.", example_gloss: "قانون پس‌دادن اجناس دکان ۳۰ روز اجازه می‌ته."}
  en.a2.unit34.lesson01.teach.defective: {title: "defective", gloss: "خراب", note: "*defective* یعنی چیزی که درست کار نمی‌کنه.", example_gloss: "بلندر خراب بود، پس پسش دادم."}

  en.a2.unit34.lesson02.teach.return_blender_stopped_working: {title: "I'd like to return this blender. It stopped working after one use.", gloss: "می‌خواستم همی بلندر را پس بتم. بعد از یک بار استعمال، از کار افتاد.", note: "*I'd like to return...* یک شکل مؤدبانه برای خواهش پس‌دادن جنس استه."}
  en.a2.unit34.lesson02.teach.refund_or_exchange_question: {title: "Would you like a refund or an exchange?", gloss: "پول‌تان را پس می‌خواین یا تبدیل؟", note: "*Would you like...or...?* یک سوال مؤدبانه دربارهٔ انتخاب استه."}
  en.a2.unit34.lesson02.teach.id_like_a_refund: {title: "I'd like a refund, please.", gloss: "لطفاً پولم را پس بتین.", note: "*I'd like...please* یک خواهش مؤدبانه استه."}

  en.a2.unit34.lesson03.teach.within_30_days: {title: "Items can be returned within 30 days with a receipt.", gloss: "اجناس را می‌تانین در عرض ۳۰ روز، با داشتن رسید، پس بتین.", note: "*within* یعنی در عرض یک مدت زمان."}
  en.a2.unit34.lesson03.teach.policy_text: {title: "متن قانون پس‌دادن اجناس", gloss: "قانون پس‌دادن اجناس: اجناس را می‌تانین در عرض ۳۰ روز، با داشتن رسید، پس بتین. اجناس خراب را در هر وقت می‌تانین تبدیل یا پول‌شان را پس بگیرین.", note: "همی یک قانون رسمی واقعی با شرط و استثنا استه -- سویهٔ A2."}
  en.a2.unit34.lesson03.teach.i_have_my_receipt: {title: "I have my receipt from last week.", gloss: "رسیدم را از هفتهٔ پیش دارم.", note: "*from last week* یعنی از هفتهٔ گذشته."}

  en.a2.unit34.lesson04.teach.q_return_blender: {title: "خواهش لیلا برای پس‌دادن", gloss: "لیلا می‌گه: سلام، می‌خواستم همی بلندر را پس بتم. بعد از یک بار استعمال، از کار افتاد.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt: {title: "جواب فروشنده و پرسیدن رسید", gloss: "فروشنده می‌گه: متأسفم. رسیدتان را دارین؟", note: "*I'm sorry to hear that* یک شکل مؤدبانهٔ همدردی استه."}
  en.a2.unit34.lesson04.teach.q_yes_bought_last_week: {title: "جواب لیلا دربارهٔ رسید", gloss: "لیلا می‌گه: بلی، ایگه استه. هفتهٔ پیش خریدمش.", note: "*here it is* یعنی ایگه استه -- برای نشان دادن یک چیز کار می‌ره."}
  en.a2.unit34.lesson04.teach.a_refund_or_exchange: {title: "سوال فروشنده دربارهٔ انتخاب", gloss: "فروشنده می‌گه: تشکر. پول‌تان را پس می‌خواین یا تبدیل؟", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit34.lesson04.teach.q_id_like_a_refund: {title: "جواب لیلا دربارهٔ انتخاب", gloss: "لیلا می‌گه: لطفاً پولم را پس بتین.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit34.lesson04.teach.a_refund_thirty_five: {title: "پس‌دادن پول فروشنده", gloss: "فروشنده می‌گه: مشکلی نیست. ایگه پس‌دادن پول‌تان: سی‌وپنج دالر.", note: "فروشنده مبلغ دقیق پس‌دادن پول را می‌گه."}

exercises:
  en.a2.unit34.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "defective"
    distractors: ["refund", "exchange", "receipt"]
    accepted_answers: [{value: "defective", status: "correct"}]
    feedback: "*defective* یعنی خراب."
  en.a2.unit34.lesson01.exercise02.choose_money_back_word:
    instruction: "کدام کلمه یعنی پول‌تان دوباره پس داده شه؟"
    correct_option: "refund"
    distractors: ["exchange", "receipt", "return policy"]
    accepted_answers: [{value: "refund", status: "correct"}]
    feedback: "*refund* یعنی پس‌دادن پول."
  en.a2.unit34.lesson01.exercise03.choose_proof_of_purchase_word:
    instruction: "کدام کلمه یعنی کاغذی که ثابت می‌کنه چیزی را خریدین؟"
    correct_option: "receipt"
    distractors: ["refund", "exchange", "defective"]
    accepted_answers: [{value: "receipt", status: "correct"}]
    feedback: "*receipt* یعنی رسید."
  en.a2.unit34.lesson01.exercise04.match_complaint_words:
    instruction: "هر معنی را به کلمه یا عبارت درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "getting your money back", right: "refund"}
          - {left: "trading an item for a different one", right: "exchange"}
          - {left: "the paper that proves you bought something", right: "receipt"}
          - {left: "a store's rules about returning items", right: "return policy"}
          - {left: "broken or not working correctly", right: "defective"}
          - {left: "what's wrong with an item", right: "problem"}
          - {left: "words used to apologize to a customer", right: "I'm sorry to hear that"}
        status: "correct"
    feedback: "*refund*=پس‌دادن پول، *exchange*=تبدیل، *receipt*=رسید، *return policy*=قانون پس‌دادن اجناس، *defective*=خراب."
  en.a2.unit34.lesson01.exercise05.write_exchange:
    instruction: "کلمه‌ای را که یعنی تبدیل یک جنس با جنس دیگه بنویسین."
    accepted_answers:
      - {value: "exchange", status: "correct"}
      - {value: "Exchange", status: "correct"}
    feedback: "*exchange* یعنی تبدیل."

  en.a2.unit34.lesson02.exercise01.listen_return_request:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "I'd like to return this blender"
    distractors: ["I'd like a refund, please.", "Would you like an exchange?", "I have my receipt from last week."]
    accepted_answers: [{value: "I'd like to return this blender", status: "correct"}]
    feedback: "همی یعنی می‌خواستم همی بلندر را پس بتم."
  en.a2.unit34.lesson02.exercise02.choose_polite_return_request:
    instruction: "می‌خواین یک جنس خراب را به یک دکان پس بتین. چی می‌گین؟"
    correct_option: "I'd like to return this blender. It stopped working after one use."
    distractors: ["Would you like a refund or an exchange?", "Items can be returned within 30 days.", "Here's your refund of thirty-five dollars."]
    accepted_answers: [{value: "I'd like to return this blender. It stopped working after one use.", status: "correct"}]
    feedback: "*I'd like to return...* یک شکل مؤدبانه برای خواهش پس‌دادن جنس استه."
  en.a2.unit34.lesson02.exercise03.order_refund_or_exchange_question:
    instruction: "کلمات را طوری تنظیم کنین که «پول‌تان را پس می‌خواین یا تبدیل؟» شود."
    accepted_answers: [{value: ["Would", "you", "like", "a", "refund", "or", "an", "exchange"], status: "correct"}]
    feedback: "ترتیب درست: *Would you like a refund or an exchange*"
  en.a2.unit34.lesson02.exercise04.reply_refund_or_exchange:
    instruction: "فروشنده می‌پرسه: پول‌تان را پس می‌خواین یا تبدیل؟"
    accepted_answers:
      - {value: "I'd like a refund, please.", status: "correct"}
      - {value: "I'd like a refund, please", status: "correct"}
    feedback: "*I'd like a refund, please* یعنی لطفاً پولم را پس بتین."
  en.a2.unit34.lesson02.exercise05.write_complaint_message:
    instruction: "بنویسین که می‌خواین یک بلندر را پس بتین چون بعد از یک بار استعمال از کار افتاد."
    accepted_answers:
      - {value: "I'd like to return this blender. It stopped working after one use.", status: "correct"}
      - {value: "I'd like to return this blender because it stopped working after one use.", status: "correct"}
    feedback: "*I'd like to return this blender. It stopped working after one use* یعنی می‌خواستم همی بلندر را پس بتم چون بعد از یک بار استعمال از کار افتاد."

  en.a2.unit34.lesson03.exercise01.read_return_window:
    instruction: "مطابق اطلاعیه، تا چند روز می‌تانین جنس را پس بتین؟"
    correct_option: "within 30 days"
    distractors: ["within 7 days", "within 60 days", "within 90 days"]
    accepted_answers: [{value: "within 30 days", status: "correct"}]
    feedback: "متن می‌گه *items can be returned within 30 days*."
  en.a2.unit34.lesson03.exercise02.read_return_requirement:
    instruction: "برای پس‌دادن یک جنس به چی ضرورت دارین؟"
    correct_option: "a receipt"
    distractors: ["a confirmation number", "a photo ID", "an appointment"]
    accepted_answers: [{value: "a receipt", status: "correct"}]
    feedback: "متن می‌گه *with a receipt*."
  en.a2.unit34.lesson03.exercise03.choose_defective_item_rule:
    instruction: "مطابق اطلاعیه، همرای یک جنس خراب چی می‌شه؟"
    correct_option: "exchanged or refunded at any time"
    distractors: ["never returned", "returned within 7 days only", "exchanged only once a year"]
    accepted_answers: [{value: "exchanged or refunded at any time", status: "correct"}]
    feedback: "متن می‌گه *defective items can be exchanged or refunded at any time*."
  en.a2.unit34.lesson03.exercise04.order_items_returned_sentence:
    instruction: "کلمات را طوری تنظیم کنین که «اجناس را می‌تانین در عرض ۳۰ روز پس بتین» شود."
    accepted_answers: [{value: ["Items", "can", "be", "returned", "within", "30", "days"], status: "correct"}]
    feedback: "ترتیب درست: *Items can be returned within 30 days*"
  en.a2.unit34.lesson03.exercise05.write_have_receipt:
    instruction: "بنویسین که رسیدتان را از هفتهٔ پیش دارین."
    accepted_answers:
      - {value: "I have my receipt from last week.", status: "correct"}
      - {value: "I have my receipt from last week", status: "correct"}
    feedback: "*I have my receipt from last week* یعنی رسیدم را از هفتهٔ پیش دارم."

  en.a2.unit34.lesson04.exercise01.listen_whats_wrong:
    instruction: "گفتگو را گوش کنین و مشکل بلندر را انتخاب کنین."
    correct_option: "It stopped working after one use"
    distractors: ["It arrived broken.", "It's the wrong color.", "It's too expensive."]
    accepted_answers: [{value: "It stopped working after one use", status: "correct"}]
    feedback: "لیلا می‌گه *it stopped working after one use*."
  en.a2.unit34.lesson04.exercise02.listen_refund_amount:
    instruction: "گوش کنین و مبلغ پس‌دادن پول را انتخاب کنین."
    correct_option: "thirty-five dollars"
    distractors: ["twenty-five dollars", "fifty dollars", "fifteen dollars"]
    accepted_answers: [{value: "thirty-five dollars", status: "correct"}]
    feedback: "فروشنده می‌گه *here's your refund of thirty-five dollars*."
  en.a2.unit34.lesson04.exercise03.choose_clerk_offer:
    instruction: "فروشنده به لیلا چی پیشنهاد می‌کنه؟"
    correct_option: "a refund or an exchange"
    distractors: ["a discount on her next visit", "a free repair", "store credit only"]
    accepted_answers: [{value: "a refund or an exchange", status: "correct"}]
    feedback: "فروشنده می‌گه *would you like a refund or an exchange*."
  en.a2.unit34.lesson04.exercise04.order_do_you_have_receipt_question:
    instruction: "کلمات را طوری تنظیم کنین که «رسیدتان را دارین؟» شود."
    accepted_answers: [{value: ["Do", "you", "have", "your", "receipt"], status: "correct"}]
    feedback: "ترتیب درست: *Do you have your receipt*"
  en.a2.unit34.lesson04.exercise05.reply_as_leila:
    instruction: "فروشنده می‌گه: می‌تانم کمک‌تان کنم؟"
    accepted_answers:
      - {value: "Hi, I'd like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I'd like a refund, please.", status: "correct"}
      - {value: "Hi, I would like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I would like a refund, please.", status: "correct"}
    feedback: "همی جواب کامل خواهش پس‌دادن، نشان‌دادن رسید، و انتخاب پس‌دادن پول را با هم می‌ته -- سه لحظهٔ جدا از گفتگو."
  en.a2.unit34.lesson04.exercise06.speak_complaint_dialogue:
    instruction: "به نقش لیلا، آوازی به فروشنده جواب بتین."
    accepted_answers:
      - {value: "Hi, I'd like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I'd like a refund, please.", status: "correct"}
      - {value: "Hi, I would like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I would like a refund, please.", status: "correct"}
    feedback: "همی جواب کامل هر سه بخش گفتگو را پوشش می‌ته: خواهش پس‌دادن، نشان‌دادن رسید، و انتخاب پس‌دادن پول."
