course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit33.weekly_schedule: {title: "گفتن دربارهٔ برنامهٔ هفته‌وار"}

lessons:
  en.a2.unit33.lesson01.weekly_schedule_vocabulary: {title: "روزهای کاری، آخر هفته، و برنامه"}
  en.a2.unit33.lesson02.describing_your_week: {title: "گفتن دربارهٔ هفته‌تان همرای کلمات ربط"}
  en.a2.unit33.lesson03.reading_a_weekly_schedule: {title: "خواندن یک پیام برنامهٔ هفته‌وار"}
  en.a2.unit33.lesson04.weekly_schedule_dialogue: {title: "گپ زدن دربارهٔ هفته‌تان"}

teaching:
  en.a2.unit33.lesson01.teach.weekday: {title: "weekday", gloss: "روز کاری", note: "*weekday* یعنی دوشنبه تا جمعه.", example_gloss: "روزهای کاری، در شرکتم کار می‌کنم."}
  en.a2.unit33.lesson01.teach.weekend: {title: "weekend", gloss: "آخر هفته", note: "*weekend* یعنی شنبه و یک‌شنبه.", example_gloss: "آخر هفته استراحت می‌کنم و دوستانم را می‌بینم."}
  en.a2.unit33.lesson01.teach.schedule: {title: "schedule", gloss: "برنامه", note: "*schedule* یعنی یک پلان فعالیت‌ها و وقت‌هایشان.", example_gloss: "برنامه‌ام روزهای کاری مصروف است."}
  en.a2.unit33.lesson01.teach.after_that: {title: "after that", gloss: "بعد از آن", note: "*after that* برای گفتن چیزی که بعداً می‌شه استعمال می‌شه.", example_gloss: "ایمیلم را چک می‌کنم. بعد از آن، به جلسه‌ها می‌روم."}
  en.a2.unit33.lesson01.teach.finally: {title: "finally", gloss: "بالاخره", note: "*finally* برای گفتن چیزی که آخر می‌شه استعمال می‌شه.", example_gloss: "بالاخره، به خانه می‌روم و استراحت می‌کنم."}

  en.a2.unit33.lesson02.teach.weekdays_work_company: {title: "On weekdays, I work at my company.", gloss: "روزهای کاری، در شرکتم کار می‌کنم.", note: "*on weekdays* یعنی دوشنبه تا جمعه."}
  en.a2.unit33.lesson02.teach.first_then_email_meetings: {title: "First, I check my email, then I go to meetings.", gloss: "اول ایمیلم را چک می‌کنم، بعد به جلسه‌ها می‌روم.", note: "*first ... then ...* برای ترتیب دادن فعالیت‌ها استعمال می‌شه."}
  en.a2.unit33.lesson02.teach.weekend_relax_friends: {title: "On the weekend, I relax and see my friends.", gloss: "آخر هفته استراحت می‌کنم و دوستانم را می‌بینم.", note: "*on the weekend* یعنی شنبه و یک‌شنبه."}

  en.a2.unit33.lesson03.teach.online_class: {title: "online class", gloss: "صنف آنلاین", note: "*online class* یعنی یک صنف که از طریق انترنت می‌گیرین.", example_gloss: "دوشنبه صبح‌ها یک صنف آنلاین دارم."}
  en.a2.unit33.lesson03.teach.leilas_schedule: {title: "متن پیام برنامهٔ لیلا", gloss: "هفتهٔ من: دوشنبه‌ها و چهارشنبه‌ها، صبح صنف آنلاین دارم. بعد از آن، در کتابخانه درس می‌خوانم. جمعه‌ها همرای دوستانم قهوه می‌خورم. آخر هفته، والدینم را می‌بینم.", note: "همی یک پیام واقعی دربارهٔ برنامهٔ هفته‌وار یک شخص است -- سویهٔ A2."}
  en.a2.unit33.lesson03.teach.i_visit_my_parents: {title: "On the weekend, I visit my parents.", gloss: "آخر هفته، والدینم را می‌بینم.", note: "*visit* یعنی دیدن کسی، مثلاً والدین."}

  en.a2.unit33.lesson04.teach.q_week_look_like: {title: "پرسش لیلا دربارهٔ هفته", gloss: "لیلا می‌پرسه: معمولاً هفتهٔ شما چطور می‌گذره؟", note: "*What does your week usually look like?* یک سوال معمول دربارهٔ برنامه است."}
  en.a2.unit33.lesson04.teach.a_weekdays_email_meetings: {title: "جواب دنیل دربارهٔ روزهای کاری", gloss: "دنیل می‌گه: روزهای کاری، در شرکتم کار می‌کنم. اول ایمیلم را چک می‌کنم، بعد به جلسه‌ها می‌روم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit33.lesson04.teach.q_what_about_mornings: {title: "پرسش لیلا دربارهٔ صبح‌ها", gloss: "لیلا می‌پرسه: صبح‌ها چطوره؟", note: "*What about...?* برای پرسیدن دربارهٔ یک بخش دیگهٔ موضوع استعمال می‌شه."}
  en.a2.unit33.lesson04.teach.a_tuesday_thursday_running: {title: "جواب دنیل دربارهٔ دویدن", gloss: "دنیل می‌گه: سه‌شنبه و پنج‌شنبه صبح‌ها، قبل از کار می‌دوم.", note: "همی یک فعالیت جدید دربارهٔ عادت ورزشی دنیل است."}
  en.a2.unit33.lesson04.teach.q_what_about_weekend: {title: "پرسش لیلا دربارهٔ آخر هفته", gloss: "لیلا می‌پرسه: و آخر هفته چطوره؟", note: "همو ساختار *What about...?* دربارهٔ آخر هفته."}
  en.a2.unit33.lesson04.teach.a_saturday_soccer_sunday_relax: {title: "جواب دنیل دربارهٔ آخر هفته", gloss: "دنیل می‌گه: شنبه‌ها، همرای هم‌کارهایم فوتبال بازی می‌کنم. یک‌شنبه‌ها، استراحت می‌کنم و دوستانم را می‌بینم.", note: "دنیل هر دو روز آخر هفته را با هم شرح می‌ته."}

exercises:
  en.a2.unit33.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "after that"
    distractors: ["weekday", "weekend", "schedule"]
    accepted_answers: [{value: "after that", status: "correct"}]
    feedback: "*after that* یعنی بعد از آن."
  en.a2.unit33.lesson01.exercise02.choose_monday_to_friday_word:
    instruction: "کدام کلمه یعنی دوشنبه تا جمعه؟"
    correct_option: "weekday"
    distractors: ["weekend", "schedule", "finally"]
    accepted_answers: [{value: "weekday", status: "correct"}]
    feedback: "*weekday* یعنی روز کاری."
  en.a2.unit33.lesson01.exercise03.choose_saturday_sunday_word:
    instruction: "کدام کلمه یعنی شنبه و یک‌شنبه؟"
    correct_option: "weekend"
    distractors: ["weekday", "after that", "finally"]
    accepted_answers: [{value: "weekend", status: "correct"}]
    feedback: "*weekend* یعنی آخر هفته."
  en.a2.unit33.lesson01.exercise04.match_schedule_words:
    instruction: "هر معنی را به کلمه یا عبارت درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "Monday through Friday", right: "weekday"}
          - {left: "Saturday and Sunday", right: "weekend"}
          - {left: "a plan of activities and their times", right: "schedule"}
          - {left: "used to say what happens next", right: "after that"}
          - {left: "used to say what happens last", right: "finally"}
          - {left: "used to say what happens first", right: "first"}
          - {left: "used to say what happens right after that", right: "then"}
          - {left: "putting activities in order", right: "sequencing"}
        status: "correct"
    feedback: "*weekday*=روز کاری، *weekend*=آخر هفته، *schedule*=برنامه، *after that*=بعد از آن، *finally*=بالاخره."
  en.a2.unit33.lesson01.exercise05.write_weekend:
    instruction: "کلمه‌ای را که یعنی شنبه و یک‌شنبه است بنویسین."
    accepted_answers:
      - {value: "weekend", status: "correct"}
      - {value: "Weekend", status: "correct"}
    feedback: "*weekend* یعنی آخر هفته."

  en.a2.unit33.lesson02.exercise01.listen_weekday_routine:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "First, I check my email, then I go to meetings"
    distractors: ["On the weekend, I relax and see my friends.", "On weekdays, I work at my company.", "I visit my parents on Sundays."]
    accepted_answers: [{value: "First, I check my email, then I go to meetings", status: "correct"}]
    feedback: "همی یعنی اول ایمیلم را چک می‌کنم، بعد به جلسه‌ها می‌روم."
  en.a2.unit33.lesson02.exercise02.choose_weekday_answer:
    instruction: "کسی می‌پرسه روزهای کاری چی می‌کنین. چی می‌گین؟"
    correct_option: "On weekdays, I work at my company."
    distractors: ["On the weekend, I relax and see my friends.", "Finally, I go home.", "After that, I go to meetings."]
    accepted_answers: [{value: "On weekdays, I work at my company.", status: "correct"}]
    feedback: "*On weekdays, I work at my company* یعنی روزهای کاری، در شرکتم کار می‌کنم."
  en.a2.unit33.lesson02.exercise03.order_first_then_sentence:
    instruction: "کلمات را طوری تنظیم کنین که «اول ایمیلم را چک می‌کنم، بعد به جلسه‌ها می‌روم» شود."
    accepted_answers: [{value: ["First", "I", "check", "my", "email", "then", "I", "go", "to", "meetings"], status: "correct"}]
    feedback: "ترتیب درست *First I check my email then I go to meetings* است."
  en.a2.unit33.lesson02.exercise04.reply_weekend_activity:
    instruction: "کسی می‌پرسه: آخر هفته چی می‌کنین؟"
    accepted_answers:
      - {value: "On the weekend, I relax and see my friends.", status: "correct"}
      - {value: "On the weekend, I relax and see my friends", status: "correct"}
    feedback: "*On the weekend, I relax and see my friends* یعنی آخر هفته استراحت می‌کنم و دوستانم را می‌بینم."
  en.a2.unit33.lesson02.exercise05.write_weekly_schedule_message:
    instruction: "بنویسین دربارهٔ روزهای کاری و آخر هفته‌تان، با استعمال حداقل سه فعالیت."
    accepted_answers:
      - {value: "On weekdays, I work at my company, and on the weekend, I relax and see my friends.", status: "correct"}
      - {value: "On weekdays, I work at my company. On the weekend, I relax and see my friends.", status: "correct"}
    feedback: "*On weekdays, I work at my company, and on the weekend, I relax and see my friends* یعنی روزهای کاری در شرکتم کار می‌کنم، و آخر هفته استراحت می‌کنم و دوستانم را می‌بینم."

  en.a2.unit33.lesson03.exercise01.read_monday_wednesday_activity:
    instruction: "لیلا دوشنبه‌ها و چهارشنبه‌ها چی می‌کنه؟"
    correct_option: "online classes in the morning"
    distractors: ["work at a company", "visit her parents", "play soccer"]
    accepted_answers: [{value: "online classes in the morning", status: "correct"}]
    feedback: "متن می‌گه *I have online classes in the morning*."
  en.a2.unit33.lesson03.exercise02.read_after_class_activity:
    instruction: "لیلا بعد از صنف‌های آنلاینش چی می‌کنه؟"
    correct_option: "study at the library"
    distractors: ["go to work", "play soccer", "visit her parents"]
    accepted_answers: [{value: "study at the library", status: "correct"}]
    feedback: "متن می‌گه *after that, I study at the library*."
  en.a2.unit33.lesson03.exercise03.choose_friday_activity:
    instruction: "طبق پیام لیلا، جمعه‌ها چی می‌کنه؟"
    correct_option: "meet friends for coffee"
    distractors: ["go to online classes", "visit her parents", "go running"]
    accepted_answers: [{value: "meet friends for coffee", status: "correct"}]
    feedback: "متن می‌گه *on Fridays, I meet friends for coffee*."
  en.a2.unit33.lesson03.exercise04.order_visit_parents_sentence:
    instruction: "کلمات را طوری تنظیم کنین که «آخر هفته، والدینم را می‌بینم» شود."
    accepted_answers: [{value: ["On", "the", "weekend", "I", "visit", "my", "parents"], status: "correct"}]
    feedback: "ترتیب درست *On the weekend I visit my parents* است."
  en.a2.unit33.lesson03.exercise05.write_own_schedule_reply:
    instruction: "برنامهٔ هفته‌وار خودتان را با حداقل سه فعالیت بنویسین، همرنگ پیام لیلا."
    accepted_answers:
      - {value: "On Mondays and Wednesdays, I have online classes, and on the weekend, I visit my parents.", status: "correct"}
      - {value: "On Mondays and Wednesdays, I have online classes. On the weekend, I visit my parents.", status: "correct"}
    feedback: "*On Mondays and Wednesdays, I have online classes, and on the weekend, I visit my parents* یک برنامهٔ هفته‌وار نمونه‌ای است."

  en.a2.unit33.lesson04.exercise01.listen_running_days:
    instruction: "گفتگو را گوش کنین و روزهای دویدن دنیل را انتخاب کنین."
    correct_option: "Tuesday and Thursday mornings"
    distractors: ["Monday and Friday mornings", "Saturday and Sunday mornings", "every morning"]
    accepted_answers: [{value: "Tuesday and Thursday mornings", status: "correct"}]
    feedback: "دنیل می‌گه *on Tuesday and Thursday mornings, I go running*."
  en.a2.unit33.lesson04.exercise02.listen_saturday_activity:
    instruction: "گوش کنین و فعالیت دنیل در شنبه را انتخاب کنین."
    correct_option: "soccer with my coworkers"
    distractors: ["running with my coworkers", "visiting my parents", "studying at the library"]
    accepted_answers: [{value: "soccer with my coworkers", status: "correct"}]
    feedback: "دنیل می‌گه *on Saturdays, I play soccer with my coworkers*."
  en.a2.unit33.lesson04.exercise03.choose_sunday_activity:
    instruction: "دنیل یک‌شنبه‌ها چی می‌کنه؟"
    correct_option: "relax and see my friends"
    distractors: ["go to meetings", "play soccer", "have online classes"]
    accepted_answers: [{value: "relax and see my friends", status: "correct"}]
    feedback: "دنیل می‌گه *on Sundays, I relax and see my friends*."
  en.a2.unit33.lesson04.exercise04.order_week_look_like_question:
    instruction: "کلمات را طوری تنظیم کنین که «معمولاً هفتهٔ شما چطور می‌گذره؟» شود."
    accepted_answers: [{value: ["What", "does", "your", "week", "usually", "look", "like"], status: "correct"}]
    feedback: "ترتیب درست *What does your week usually look like* است."
  en.a2.unit33.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌پرسه: معمولاً هفتهٔ شما چطور می‌گذره؟"
    accepted_answers:
      - {value: "On weekdays, I work at my company. On Tuesday and Thursday mornings, I go running before work. On Saturdays, I play soccer with my coworkers. On Sundays, I relax and see my friends.", status: "correct"}
    feedback: "همی جواب کامل روزهای کاری، دویدن، فوتبال، و استراحت را با هم می‌ته -- چهار لحظهٔ جدا از گفتگو."
  en.a2.unit33.lesson04.exercise06.speak_weekly_schedule_dialogue:
    instruction: "به نقش دنیل، آوازی به لیلا جواب بتین."
    accepted_answers:
      - {value: "On weekdays, I work at my company. On Tuesday and Thursday mornings, I go running before work. On Saturdays, I play soccer with my coworkers. On Sundays, I relax and see my friends.", status: "correct"}
    feedback: "همی جواب کامل هر چهار بخش گفتگو را پوشش می‌ته: روزهای کاری، دویدن، فوتبال، و استراحت."
