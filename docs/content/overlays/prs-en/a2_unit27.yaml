  en.a2.unit27.lesson04.teach.a_no_fee_condition: {title: "جواب کارمند دربارهٔ فیس ماهانه", gloss: "کارمند می‌گه اگه حداقل مانده ۵۰۰ دالری داشته باشین، فیس ماهانه نمی‌گیریم.", note: "کارمند شرط دقیق برای معافیت از فیس ماهانه را می‌ته، مطابق با متن درس سوم."}
  en.a2.unit27.lesson04.teach.q_when_card: {title: "پرسیدن دربارهٔ وقت رسیدن کارت", gloss: "دنیل می‌گه خیلی خوب استه. کارت بانکیم کِی می‌رسه؟", note: "دنیل رضایتش را نشان می‌ته و بعد سوال بعدی را می‌پرسه."}
  en.a2.unit27.lesson04.teach.a_five_to_seven_days: {title: "جواب کارمند دربارهٔ کارت", gloss: "کارمند می‌گه طی پنج تا هفت روز کاری می‌رسه.", note: "همی جواب مطابق با متن درس سوم استه -- پنج تا هفت روز کاری."}

