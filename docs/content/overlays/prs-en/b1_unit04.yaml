          - {left: "disagree", right: "مخالف بودن"}
          - {left: "opinion", right: "نظر"}
          - {left: "believe", right: "باور داشتن"}
          - {left: "reason", right: "دلیل"}
          - {left: "save time", right: "صرفه‌جویی در وقت"}
