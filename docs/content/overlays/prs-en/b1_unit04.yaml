course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit04.debate: {title: "موافقم، مخالفم، چون"}

lessons:
  en.b1.unit04.lesson01.debate_vocabulary: {title: "Agree، disagree، و opinion"}
  en.b1.unit04.lesson02.agreeing_and_disagreeing: {title: "موافقم که، مخالفم که"}
  en.b1.unit04.lesson03.reading_two_opinions: {title: "متن خوانی: دو نظر مختلف"}
  en.b1.unit04.lesson04.the_remote_work_dialogue: {title: "هر کس نظر مختلف داره"}

teaching:
  en.b1.unit04.lesson01.teach.agree: {title: "agree", gloss: "موافق بودن", note: "*agree* یعنی فکر کدن که یک کس دیگه راست می‌گه.", example_gloss: "همرای‌تان موافقم."}
  en.b1.unit04.lesson01.teach.disagree: {title: "disagree", gloss: "مخالف بودن", note: "*disagree* یعنی فکر کدن که یک کس دیگه غلط می‌گه.", example_gloss: "همرای همو نظر مخالفم."}
  en.b1.unit04.lesson01.teach.opinion: {title: "opinion", gloss: "نظر", note: "*opinion* یعنی یک نظر شخصی دربارهٔ یک چیز.", example_gloss: "هر کس نظر مختلف داره."}
  en.b1.unit04.lesson01.teach.believe: {title: "believe", gloss: "باور داشتن", note: "*believe* یعنی فکر کدن که یک چیز راست استه.", example_gloss: "باور دارم که همی یک فکر خوب استه."}
  en.b1.unit04.lesson01.teach.reason: {title: "reason", gloss: "دلیل", note: "*reason* یعنی توضیح پشت یک نظر.", example_gloss: "دلیل‌تان برای همی فکر چیست؟"}
  en.b1.unit04.lesson01.teach.save_time: {title: "save time", gloss: "صرفه‌جویی در وقت", note: "*save time* یعنی وقت را ضایع نکدن.", example_gloss: "کار از خانه به من کمک می‌کنه در وقت صرفه‌جویی کنم."}

  en.b1.unit04.lesson02.teach.agree_that_saves_time: {title: "I agree that working from home is better because you save time.", gloss: "موافقم که کار از خانه بهتر استه چون در وقت صرفه‌جویی می‌کنین.", note: "*agree that + clause + because + reason* یک نظر را با یک دلیل تایید می‌کنه."}
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers: {title: "I disagree that it's better because you miss your coworkers.", gloss: "مخالفم که بهتر استه چون دل‌تان برای همکاران‌تان تنگ می‌شه.", note: "همو ساختار، اما برای مخالفت با یک نظر و دلیل آوردن."}
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that: {title: "I agree that it's better. I disagree that it's better.", gloss: "موافقم که بهتر استه. مخالفم که بهتر استه.", note: "بعد از *agree that* یا *disagree that* یک جملهٔ کامل می‌یه که نظر کس دیگه را بیان می‌کنه."}

  en.b1.unit04.lesson03.teach.focus: {title: "focus", gloss: "تمرکز کدن", note: "*focus* یعنی توجه کامل‌تان را به یک کار بتین.", example_gloss: "او می‌تانه در خانه راحت‌تر تمرکز کنه."}
  en.b1.unit04.lesson03.teach.respect: {title: "respect", gloss: "احترام گذاشتن", note: "*respect* یعنی به یک کس یا نظرش ارزش قایل بودن، حتی اگه با او مخالف باشین.", example_gloss: "به نظر همدیگه احترام می‌گذارن."}
  en.b1.unit04.lesson03.teach.reading_passage: {title: "متن دربارهٔ دو نظر مختلف", gloss: "میا فکر می‌کنه کار از خانه بهتر استه چون می‌تانه راحت‌تر تمرکز کنه. لیلا مخالف استه. او باور داره که رفتن به دفتر بهتر استه چون هر روز از دیدن همکارانش خوش می‌شه. آن‌ها موافق نیستن، اما به نظر همدیگه احترام می‌گذارن.", note: "همی متن دو نظر معتبر و متضاد را نشان می‌ته -- سویهٔ B1."}

  en.b1.unit04.lesson04.teach.q_working_from_home: {title: "سوال دانیال دربارهٔ کار از خانه", gloss: "دانیال می‌گه: به‌نظرت کار از خانه از دفتر بهتر استه؟", note: "*Do you think...?* یک سوال معمولی برای پرسیدن نظر استه."}
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers: {title: "جواب لیلا", gloss: "لیلا می‌گه: مخالفم که بهتر استه. فکر می‌کنم مکالمه‌های مهم را با همکاران‌تان از دست می‌دین.", note: "*I disagree that...* یک شکل ساده برای مخالفت استه."}
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time: {title: "جواب دانیال", gloss: "دانیال می‌گه: حرف بجا استه، اما موافقم که خیلی در وقت صرفه‌جویی می‌شه.", note: "*That's a fair point, but...* یک شکل مؤدبانه برای قبول جزئی نظر دیگری استه."}
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office: {title: "جواب لیلا", gloss: "لیلا می‌گه: موافقم که در وقت صرفه‌جویی می‌شه، اما بازهم دفتر را ترجیح می‌دم.", note: "*I agree that..., but...* یعنی با یک بخش حرف موافق استین، اما نظر خودتان فرق داره."}
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion: {title: "جواب دانیال", gloss: "دانیال می‌گه: منطقی استه. هر کس نظر مختلف داره.", note: "*Everyone has a different opinion* یک جمع‌بندی معمولی برای پایان یک بحث دوستانه استه."}

exercises:
  en.b1.unit04.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "opinion"
    distractors: ["agree", "disagree", "believe"]
    accepted_answers: [{value: "opinion", status: "correct"}]
    feedback: "*opinion* یعنی نظر."
  en.b1.unit04.lesson01.exercise02.choose_disagree_word:
    instruction: "کدام کلمه یعنی فکر می‌کنین یک کس دیگه غلط می‌گه؟"
    correct_option: "disagree"
    distractors: ["agree", "believe", "reason"]
    accepted_answers: [{value: "disagree", status: "correct"}]
    feedback: "*disagree* یعنی مخالف بودن."
