course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit04.debate: {title: "موافقم، مخالفم، چون"}

lessons:
  en.b1.unit04.lesson01.debate_vocabulary: {title: "Agree، disagree، و opinion"}
  en.b1.unit04.lesson02.agreeing_and_disagreeing: {title: "موافقم که، مخالفم که"}
  en.b1.unit04.lesson03.reading_two_opinions: {title: "متن خوانی: دو نظر مختلف"}
  en.b1.unit04.lesson04.the_remote_work_dialogue: {title: "هر کس نظر مختلف داره"}

teaching:
  en.b1.unit04.lesson01.teach.agree: {title: "agree", gloss: "موافق بودن", note: "*agree* یعنی فکر کدن که یک کس دیگه راست می‌گه.", example_gloss: "همرای‌تان موافقم."}
  en.b1.unit04.lesson01.teach.disagree: {title: "disagree", gloss: "مخالف بودن", note: "*disagree* یعنی فکر کدن که یک کس دیگه غلط می‌گه.", example_gloss: "همرای همو نظر مخالفم."}
  en.b1.unit04.lesson01.teach.opinion: {title: "opinion", gloss: "نظر", note: "*opinion* یعنی یک نظر شخصی دربارهٔ یک چیز.", example_gloss: "هر کس نظر مختلف داره."}
  en.b1.unit04.lesson01.teach.believe: {title: "believe", gloss: "باور داشتن", note: "*believe* یعنی فکر کدن که یک چیز راست استه.", example_gloss: "باور دارم که همی یک فکر خوب استه."}
  en.b1.unit04.lesson01.teach.reason: {title: "reason", gloss: "دلیل", note: "*reason* یعنی توضیح پشت یک نظر.", example_gloss: "دلیل‌تان برای همی فکر چیست؟"}
  en.b1.unit04.lesson01.teach.save_time: {title: "save time", gloss: "وقت نجات دادن", note: "*save time* یعنی وقت را ضایع نکدن.", example_gloss: "کار از خانه به من کمک می‌کنه وقت نجات بتم."}

  en.b1.unit04.lesson02.teach.agree_that_saves_time: {title: "I agree that working from home is better because you save time.", gloss: "موافقم که کار از خانه بهتر استه چون وقت نجات می‌دین.", note: "*agree that + clause + because + reason* یک نظر را با یک دلیل تایید می‌کنه."}
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers: {title: "I disagree that it's better because you miss your coworkers.", gloss: "مخالفم که بهتر استه چون همکاران‌تان را دلتنگ می‌شین.", note: "همو ساختار، اما برای مخالفت با یک نظر و دلیل آوردن."}
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that: {title: "I agree that it's better. I disagree that it's better.", gloss: "موافقم که بهتر استه. مخالفم که بهتر استه.", note: "*agree/disagree that* یک نظر دیگری را با یک جمله بند می‌ته."}

  en.b1.unit04.lesson03.teach.focus: {title: "focus", gloss: "تمرکز کدن", note: "*focus* یعنی توجه کامل‌تان را به یک کار بتین.", example_gloss: "او می‌تانه در خانه راحت‌تر تمرکز کنه."}
  en.b1.unit04.lesson03.teach.respect: {title: "respect", gloss: "احترام گذاشتن", note: "*respect* یعنی نظر یک کس دیگه را قبول کدن، حتی اگه مخالف باشین.", example_gloss: "به نظر همدیگه احترام می‌گذارن."}
  en.b1.unit04.lesson03.teach.reading_passage: {title: "متن دربارهٔ دو نظر مختلف", gloss: "میا فکر می‌کنه کار از خانه بهتر استه چون می‌تانه راحت‌تر تمرکز کنه. لیلا مخالف استه. او باور داره که رفتن به دفتر بهتر استه چون هر روز از دیدن همکارانش خوش می‌شه. آن‌ها موافق نیستن، اما به نظر همدیگه احترام می‌گذارن.", note: "همی متن دو نظر معتبر و متضاد را نشان می‌ته -- سویهٔ B1."}

  en.b1.unit04.lesson04.teach.q_working_from_home: {title: "سوال دانیال دربارهٔ کار از خانه", gloss: "دانیال می‌گه: به‌نظرت کار از خانه از دفتر بهتر استه؟", note: "*Do you think...?* یک سوال معمولی برای پرسیدن نظر استه."}
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers: {title: "جواب لیلا", gloss: "لیلا می‌گه: مخالفم که بهتر استه. فکر می‌کنم مکالمه‌های مهم را با همکاران‌تان از دست می‌دین.", note: "*I disagree that...* یک شکل ساده برای مخالفت استه."}
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time: {title: "جواب دانیال", gloss: "دانیال می‌گه: نکتهٔ خوبیه، اما موافقم که خیلی وقت نجات می‌ته.", note: "*That's a fair point, but...* یک شکل مؤدبانه برای قبول جزئی نظر دیگری استه."}
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office: {title: "جواب لیلا", gloss: "لیلا می‌گه: موافقم که وقت نجات می‌ته، اما بازهم دفتر را ترجیح می‌دم.", note: "*I agree that..., but...* موافقت جزئی با یک نظر شخصی جدا استه."}
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion: {title: "جواب دانیال", gloss: "دانیال می‌گه: منطقی استه. هر کس نظر مختلف داره.", note: "*Everyone has a different opinion* یک جمع‌بندی معمولی برای پایان یک بحث دوستانه استه."}

exercises:
  en.b1.unit04.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "opinion"
    distractors: ["agree", "disagree", "believe"]
    accepted_answers: [{value: "opinion", status: "correct"}]
    feedback: "*opinion* یعنی نظر."
  en.b1.unit04.lesson01.exercise02.choose_disagree_word:
    instruction: "کدام کلمه یعنی فکر می‌کنین یک کس دیگه غلط می‌گه؟"
    correct_option: "disagree"
    distractors: ["agree", "believe", "reason"]
    accepted_answers: [{value: "disagree", status: "correct"}]
    feedback: "*disagree* یعنی مخالف بودن."
  en.b1.unit04.lesson01.exercise03.choose_reason_word:
    instruction: "کدام کلمه یعنی توضیح پشت یک نظر؟"
    correct_option: "reason"
    distractors: ["opinion", "agree", "save time"]
    accepted_answers: [{value: "reason", status: "correct"}]
    feedback: "*reason* یعنی دلیل."
  en.b1.unit04.lesson01.exercise04.match_debate_words:
    instruction: "هر معنی را به کلمه یا عبارت درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "to think someone else is right", right: "agree"}
          - {left: "to think someone else is wrong", right: "disagree"}
          - {left: "a personal view about something", right: "opinion"}
          - {left: "to think something is true", right: "believe"}
          - {left: "the explanation behind an opinion", right: "reason"}
          - {left: "to not waste time", right: "save time"}
        status: "correct"
    feedback: "*agree*=موافق بودن، *disagree*=مخالف بودن، *opinion*=نظر، *believe*=باور داشتن، *reason*=دلیل، *save time*=وقت نجات دادن."
  en.b1.unit04.lesson01.exercise05.write_opinion:
    instruction: "کلمه‌ای را که یعنی یک نظر شخصی دربارهٔ یک چیز استه بنویسین."
    accepted_answers:
      - {value: "opinion", status: "correct"}
      - {value: "Opinion", status: "correct"}
    feedback: "*opinion* یعنی نظر."

  en.b1.unit04.lesson02.exercise01.choose_agree_sentence:
    instruction: "کدام جمله موافقت با یک نظر را با یک دلیل نشان می‌ته؟"
    correct_option: "I agree that working from home is better because you save time."
    distractors: ["I disagree that it's better because you miss your coworkers.", "Everyone has a different opinion.", "What is your opinion?"]
    accepted_answers: [{value: "I agree that working from home is better because you save time.", status: "correct"}]
    feedback: "*I agree that working from home is better because you save time* یعنی موافقم که کار از خانه بهتر استه چون وقت نجات می‌دین."
  en.b1.unit04.lesson02.exercise02.choose_disagree_sentence:
    instruction: "کدام جمله مخالفت با یک نظر را با یک دلیل نشان می‌ته؟"
    correct_option: "I disagree that it's better because you miss your coworkers."
    distractors: ["I agree that working from home is better because you save time.", "Everyone has a different opinion.", "What is your opinion?"]
    accepted_answers: [{value: "I disagree that it's better because you miss your coworkers.", status: "correct"}]
    feedback: "*I disagree that it's better because you miss your coworkers* یعنی مخالفم که بهتر استه چون همکاران‌تان را دلتنگ می‌شین."
  en.b1.unit04.lesson02.exercise03.order_agree_that_saves_time:
    instruction: "کلمات را برای گفتن «موافقم که کار از خانه بهتر استه» ترتیب کنین."
    accepted_answers: [{value: ["I", "agree", "that", "working", "from", "home", "is", "better"], status: "correct"}]
    feedback: "ترتیب درست: *I agree that working from home is better*"
  en.b1.unit04.lesson02.exercise04.reply_do_you_agree:
    instruction: "موافقین که کار از خانه بهتر استه؟"
    accepted_answers:
      - {value: "I agree that working from home is better because you save time.", status: "correct"}
      - {value: "I agree that working from home is better because you save time", status: "correct"}
    feedback: "*I agree that working from home is better because you save time* یعنی موافقم که کار از خانه بهتر استه چون وقت نجات می‌دین."
  en.b1.unit04.lesson02.exercise05.write_disagree_coworkers:
    instruction: "بنویسین که مخالفین چون همکاران‌تان را دلتنگ می‌شین."
    accepted_answers:
      - {value: "I disagree that it's better because you miss your coworkers.", status: "correct"}
      - {value: "I disagree that it's better because you miss your coworkers", status: "correct"}
    feedback: "*I disagree that it's better because you miss your coworkers* یعنی مخالفم که بهتر استه چون همکاران‌تان را دلتنگ می‌شین."

  en.b1.unit04.lesson03.exercise01.comprehend_mias_opinion:
    instruction: "میا فکر می‌کنه چی بهتر استه؟"
    correct_option: "working from home is better"
    distractors: ["going to the office is better", "both are the same", "neither is good"]
    accepted_answers: [{value: "working from home is better", status: "correct"}]
    feedback: "متن می‌گه *Mia thinks that working from home is better*."
  en.b1.unit04.lesson03.exercise02.comprehend_leilas_reason:
    instruction: "دلیل لیلا برای ترجیح دادن دفتر چیست؟"
    correct_option: "she likes seeing her coworkers every day"
    distractors: ["she doesn't like working alone", "the office is closer to her house", "she gets more free time"]
    accepted_answers: [{value: "she likes seeing her coworkers every day", status: "correct"}]
    feedback: "متن می‌گه *she likes seeing her coworkers every day*."
  en.b1.unit04.lesson03.exercise03.recognize_focus:
    instruction: "کدام کلمه یعنی توجه کامل‌تان را به کاری بتین؟"
    correct_option: "focus"
    distractors: ["respect", "opinion", "reason"]
    accepted_answers: [{value: "focus", status: "correct"}]
    feedback: "*focus* یعنی تمرکز کدن."
  en.b1.unit04.lesson03.exercise04.order_they_respect_each_others:
    instruction: "کلمات را برای گفتن «آن‌ها به نظر همدیگه احترام می‌گذارن» ترتیب کنین."
    accepted_answers: [{value: ["They", "respect", "each", "other's", "opinion"], status: "correct"}]
    feedback: "ترتیب درست: *They respect each other's opinion*"
  en.b1.unit04.lesson03.exercise05.write_leila_disagrees:
    instruction: "بنویسین که لیلا مخالف استه."
    accepted_answers:
      - {value: "Leila disagrees.", status: "correct"}
      - {value: "Leila disagrees", status: "correct"}
    feedback: "*Leila disagrees* یعنی لیلا مخالف استه."

  en.b1.unit04.lesson04.exercise01.listen_what_leila_disagrees_with:
    instruction: "گفتگو را گوش کنین و معلوم کنین لیلا با چی مخالف استه."
    correct_option: "working from home is better than the office"
    distractors: ["going to the office is unnecessary", "everyone should work from home", "coworkers are not important"]
    accepted_answers: [{value: "working from home is better than the office", status: "correct"}]
    feedback: "دانیال می‌پرسه *do you think working from home is better than the office*."
  en.b1.unit04.lesson04.exercise02.listen_leilas_reason:
    instruction: "گوش کنین و معلوم کنین دلیل لیلا چیست."
    correct_option: "you miss important conversations with coworkers"
    distractors: ["you have less free time", "you spend more money", "you work fewer hours"]
    accepted_answers: [{value: "you miss important conversations with coworkers", status: "correct"}]
    feedback: "لیلا می‌گه *you miss important conversations with coworkers*."
  en.b1.unit04.lesson04.exercise03.choose_what_daniel_agrees_with:
    instruction: "دانیال دربارهٔ کار از خانه با چی موافق استه؟"
    correct_option: "it saves a lot of time"
    distractors: ["it's more comfortable", "it's cheaper", "coworkers are not important"]
    accepted_answers: [{value: "it saves a lot of time", status: "correct"}]
    feedback: "دانیال می‌گه *I agree that it saves a lot of time*."
  en.b1.unit04.lesson04.exercise04.order_everyone_has_different_opinion:
    instruction: "کلمات را برای گفتن «هر کس نظر مختلف داره» ترتیب کنین."
    accepted_answers: [{value: ["Everyone", "has", "a", "different", "opinion"], status: "correct"}]
    feedback: "ترتیب درست: *Everyone has a different opinion*"
  en.b1.unit04.lesson04.exercise05.reply_as_leila:
    instruction: "دانیال می‌پرسه: به‌نظرت کار از خانه از دفتر بهتر استه؟"
    accepted_answers:
      - {value: "I disagree that it's better. I think you miss important conversations with coworkers.", status: "correct"}
    feedback: "*I disagree that it's better. I think you miss important conversations with coworkers* یعنی مخالفم که بهتر استه. فکر می‌کنم مکالمه‌های مهم را با همکاران‌تان از دست می‌دین."
  en.b1.unit04.lesson04.exercise06.speak_debate_dialogue:
    instruction: "به نقش لیلا، آوازی جواب بته."
    accepted_answers:
      - {value: "I agree that it saves time, but I still prefer the office.", status: "correct"}
    feedback: "*I agree that it saves time, but I still prefer the office* یعنی موافقم که وقت نجات می‌ته، اما بازهم دفتر را ترجیح می‌دم."
