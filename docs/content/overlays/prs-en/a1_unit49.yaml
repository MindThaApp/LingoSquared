generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific waste-sorting phrase source material (DLI Dari Basic Course) -- no dedicated household-waste-sorting lesson surfaced in the sections checked (unsurprising, since municipal recycling programs of this kind are a modern topic outside a 1970s-era course's household-vocabulary scope). No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 14 fixes — 'شیشهٔ ظرف' -> 'مرتبان شیشه‌ای' (glass jar); 'بیرون کنی' -> 'بیرون ببری' (take out); 'رسپی' -> 'دستور پخت'; ZWNJ (زباله‌مان); 'وای نی'; 'لسن'; 'وعده' (appointment) -> 'قول' in I'll note; recycle matching gloss; added accepted answers for speak/write. NATIVE FLAGS: کثافات vs زباله; مرتبان. Prior note: New overlay against the shared English realization unit49 (waste disposal), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all five lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit49.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit49.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices: bin -> سطل (the ordinary Dari/Afghan household term for a container, used the same way in both dialects, so no forced distinction was needed here); the rest of the vocabulary (دسته‌بندی کردن/sort, بازیافت کردن/recycle, زباله/trash, روز جمع‌آوری زباله/collection day) is shared and used as-is. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌ره for می‌شود/می‌رود, صبر کو as the informal imperative for 'wait', فهمیدم for the informal 'got it'). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's elliptical fragment question 'What about ...?' (asking for parallel information about a new topic with no full verb) has no equally compact one-word-frame equivalent in Dari, which needs the fuller در بارهٔ ... چطور؟ ('regarding ..., how [is it]?') to ask the same thing -- a Dari speaker must learn 'What about' as a fixed compact chunk rather than build it word-by-word; (2) English's 'll (will) for a spontaneous promise/intention (I'll sort everything correctly next time) has no dedicated Dari auxiliary counterpart -- Dari expresses the same promissory sense with the ordinary present-future (دسته‌بندی می‌کنم), so English's distinct future/promise marker doesn't map onto one specific Dari form to memorize. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, and the realization's own explicit flag was followed exactly: lesson03.exercise03's listen_select tests when the recycling bins go out (correct_option 'Tuesdays', from Mia's own line 7) against invented, never-said distractors ('Mondays', 'Sundays', 'Wednesdays') -- deliberately did NOT use 'Fridays' as a distractor, since Mia's own same line also states the regular trash goes out on Fridays (a real fact, not an invented one, that would create a genuinely ambiguous or misleading option). The same conservative standard was applied to every other lesson03/lesson04 multiple_choice exercise per the realization's explicit instruction: comprehension_glass_bin, comprehension_daniel_plan, reading_food_waste_bin, and reading_recycling_day all use invented, never-mentioned-in-this-unit distractor values (invented bin colors like 'the yellow bin'/'the red bin' rather than the real 'blue bin'/'black bin' facts stated elsewhere in this same unit). Multi-clause accepted_answers (lesson04's write_own_sorting_message) mirrors the realization's own five variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit. Shared-en r2 review 2026-10-22: accepted answers widened to match the realization (lesson01.exercise05, lesson02.exercise05, lesson03.exercise04, lesson04.exercise04)."}
course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit49.waste_disposal: {title: "دسته‌بندی کردن زباله"}

lessons:
  en.a1.unit49.lesson01.waste_disposal_vocabulary: {title: "کلمات دسته‌بندی زباله"}
  en.a1.unit49.lesson02.sorting_your_waste: {title: "دسته‌بندی کردن زباله‌ات"}
  en.a1.unit49.lesson03.dialogue_sorting_the_recycling: {title: "گفتگو: دسته‌بندی کردن بازیافت"}
  en.a1.unit49.lesson04.how_waste_sorting_works: {title: "متن: دسته‌بندی زباله چطور کار می‌کنه"}

teaching:
  en.a1.unit49.lesson01.teach.sort: {title: "sort", gloss: "دسته‌بندی کردن", note: "sort یعنی چیزها را به گروه‌های مختلف تقسیم کردن.", example_gloss: "زباله‌مان را هر هفته دسته‌بندی می‌کنیم."}
  en.a1.unit49.lesson01.teach.bin: {title: "bin", gloss: "سطل", note: "bin یعنی سطل -- یک ظرف برای زباله یا بازیافت.", example_gloss: "این به کدام سطل می‌ره؟"}
  en.a1.unit49.lesson01.teach.recycle: {title: "recycle", gloss: "بازیافت کردن", note: "recycle یعنی موادی را طوری دسته‌بندی کردن که دوباره کار گرفته بشن.", example_gloss: "ما شیشه و کاغذ را بازیافت می‌کنیم."}
  en.a1.unit49.lesson01.teach.trash: {title: "trash", gloss: "زباله", note: "trash یعنی زباله‌ای که دور می‌اندازین.", example_gloss: "می‌تانی زباله را بیرون ببری؟"}
  en.a1.unit49.lesson01.teach.collection_day: {title: "collection day", gloss: "روز جمع‌آوری زباله", note: "collection day یعنی روزی که سطل‌های‌تان جمع‌آوری می‌شن.", example_gloss: "روز جمع‌آوری زباله سه‌شنبه استه."}

  en.a1.unit49.lesson02.teach.which_bin_does_this_go_in: {title: "Which bin does this go in?", gloss: "این به کدام سطل می‌ره؟", note: "goes in یعنی می‌ره داخل -- برای گفتن اینکه یک چیز کجا باید انداخته شه کار می‌ره."}
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin: {title: "This goes in the recycling bin.", gloss: "این به سطل بازیافت می‌ره.", note: "the recycling bin یعنی سطل بازیافت."}
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass: {title: "The green bin is for glass.", gloss: "سطل سبز برای شیشه استه.", note: "is for ___ یعنی «برای ___ استه» -- برای گفتن هدف یک چیز کار می‌ره."}
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash: {title: "Can you take out the trash?", gloss: "می‌تانی زباله را بیرون ببری؟", note: "take out یک فعل مرکب (phrasal verb) به معنی بیرون بردن استه."}
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday: {title: "Collection day is on Tuesday.", gloss: "روز جمع‌آوری زباله سه‌شنبه استه.", note: "is on + روز هفته یعنی «در روز ___ استه»."}
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste: {title: "What about paper and food waste?", gloss: "در بارهٔ کاغذ و زبالهٔ خوراکی چطور؟", note: "What about ...? یک سوال کوتاه استه برای پرسیدن همو معلومات در بارهٔ یک موضوع جدید -- دری اینجه به یک عبارت کامل‌تر (در بارهٔ ... چطور؟) ضرورت داره."}

  en.a1.unit49.lesson03.teach.dialogue_line1: {title: "گپ میا", gloss: "صبر کو، آن مرتبان شیشه‌ای به سطل زباله نمی‌ره!", note: "doesn't go in یعنی نمی‌ره داخل -- شکل منفی go in."}
  en.a1.unit49.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "وای نه، ببخش! به کدام سطل می‌ره؟", note: "it یعنی آن -- به همو مرتبان شیشه‌ای اشاره می‌کنه."}
  en.a1.unit49.lesson03.teach.dialogue_line3: {title: "گفتهٔ میا", gloss: "به سطل سبز می‌ره. اینجه شیشه را بازیافت می‌کنیم.", note: "here یعنی اینجه -- به همو خانه/آپارتمان اشاره می‌کنه."}
  en.a1.unit49.lesson03.teach.dialogue_line4: {title: "سوال دنیل", gloss: "در بارهٔ کاغذ و زبالهٔ خوراکی چطور؟", note: "همو عبارت What about که در درس ۲ یاد گرفتین."}
  en.a1.unit49.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "کاغذ به سطل آبی می‌ره، و زبالهٔ خوراکی به سطل قهوه‌ای می‌ره.", note: "این جمله دو چیز را با and وصل می‌کنه."}
  en.a1.unit49.lesson03.teach.dialogue_line6: {title: "گپ دنیل", gloss: "فهمیدم. روز جمع‌آوری زباله کی استه؟", note: "Got it یک عبارت محاوره‌ای برای «فهمیدم» استه."}
  en.a1.unit49.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "سطل‌های بازیافت سه‌شنبه‌ها بیرون گذاشته می‌شن، و زباله جمعه‌ها بیرون گذاشته می‌شه.", note: "go out یعنی بیرون گذاشته می‌شه -- برای بیرون کردن سطل‌ها در روز جمع‌آوری کار می‌ره."}
  en.a1.unit49.lesson03.teach.dialogue_line8: {title: "جواب دنیل", gloss: "تشکر! دفعهٔ بعد همه چیز را درست دسته‌بندی می‌کنم.", note: "I'll sort یعنی دسته‌بندی می‌کنم -- I'll (I will) اینجه برای یک قول یا تصمیم کار می‌ره. دری همو معنا را با فعل حال-آینده می‌رسانه، بدون یک فعل کمکی جداگانه."}

  en.a1.unit49.lesson04.teach.reading_passage: {title: "متن: دسته‌بندی زباله چطور کار می‌کنه", gloss: "چطور زباله‌تان را دسته‌بندی کنین: اکثر ساختمان‌های آپارتمانی سطل‌های جداگانه برای انواع مختلف زباله دارن. شیشه معمولاً به سطل سبز می‌ره، و کاغذ به سطل آبی می‌ره. زبالهٔ خوراکی به سطل قهوه‌ای می‌ره، و باقی همه چیز به سطل سیاه برای زبالهٔ معمولی می‌ره. دانستن روز جمع‌آوری زباله‌تان کمک می‌کنه، چون سطل‌ها فقط یک بار در هفته جمع‌آوری می‌شن. دنیل دستورهای پخت کتاب آشپزی را که از کتابخانه امانت گرفته تمرین می‌کنه، و اغلب همرای میا در آپارتمانش آشپزی می‌کنه. شب گذشته، او یک دستور پخت از کتاب آشپزی را ساخت، و بعداً نزدیک بود یک مرتبان شیشه‌ای را به سطل زبالهٔ معمولی بیندازه. میا جلوش را گرفت و به او نشان داد که ساختمانش چطور زباله را دسته‌بندی می‌کنه. او توضیح داد که سطل‌های بازیافت سه‌شنبه‌ها بیرون گذاشته می‌شن، و زبالهٔ معمولی جمعه‌ها بیرون گذاشته می‌شه. دنیل سپاسگزار بود و گفت که از حالی به بعد همه چیز را درست دسته‌بندی می‌کنه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- made, stopped, showed, explained, said."}

