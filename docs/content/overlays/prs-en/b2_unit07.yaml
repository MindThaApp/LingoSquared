course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای مذاکره، رد شرط نامناسب، و پیشنهاد امتیاز مشروط، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit07.negotiation: {title: "به شرط این‌که scope کم شه"}

lessons:
  en.b2.unit07.lesson01_terms_and_concessions: {title: "شرط‌ها، رد کدن، و امتیاز دادن"}
  en.b2.unit07.lesson02_conditional_terms: {title: "I can agree on condition that..."}
  en.b2.unit07.lesson03.reading_revised_terms: {title: "متن خوانی: روی چی توافق شد؟"}
  en.b2.unit07.lesson04.the_negotiation_dialogue: {title: "توافق، با شرط"}

teaching:
  en.b2.unit07.lesson01.teach.term: {title: "term", gloss: "یک بند یا بخش توافق", note: "*term* در مذاکره یعنی یک قسمت مشخص از توافق، مثل deadline یا scope.", example_gloss: "یک term یک بخش از توافق استه."}
  en.b2.unit07.lesson01.teach.proposal: {title: "proposal", gloss: "پیشنهاد شرط‌های ممکن", note: "*proposal* یعنی پیشنهادی که هنوز قبول نشده؛ طرف مقابل می‌تانه رد یا اصلاحش کنه.", example_gloss: "یک proposal شرط‌های ممکن را پیشنهاد می‌کنه."}
  en.b2.unit07.lesson01.teach.refusal: {title: "refusal", gloss: "رد کدن یک شرط", note: "*refusal* یعنی واضح بگین یک شرط قابل قبول نیست. در انگلیسی کاری بهتر استه دلیل هم بتین.", example_gloss: "refusal می‌گه یک شرط قابل قبول نیست."}
  en.b2.unit07.lesson01.teach.concession: {title: "concession", gloss: "امتیاز دادن، کوتاه آمدن از یک بخش موقف", note: "*concession* یعنی یک بخش از خواستهٔ خود را می‌پذیرین یا تغییر می‌تین، معمولاً برای رسیدن به توافق.", example_gloss: "concession یعنی از بخشی از موقف خود کوتاه بیاین."}
  en.b2.unit07.lesson01.teach.scope: {title: "scope", gloss: "حجم یا محدودهٔ کار شامل‌شده", note: "*scope* یعنی چی کارهایی داخل پروژه یا گزارش حساب می‌شن. برای دری‌زبان‌ها وسوسه استه فقط «کار» بگن، اما در انگلیسی کاری *scope* دقیق‌تر استه.", example_gloss: "scope مقدار کاری استه که شامل می‌شه."}
  en.b2.unit07.lesson01.teach.condition: {title: "condition", gloss: "شرطی که باید برآورده شه", note: "*condition* یعنی چیزی که اگه انجام نشه، توافق کار نمی‌کنه.", example_gloss: "یک condition باید برآورده شه تا توافق عملی باشه."}

  en.b2.unit07.lesson02.teach.condition_deadline: {title: "I can agree to the earlier deadline on condition that the محدودهٔ کار is reduced.", gloss: "می‌تانم با مهلت زودتر موافقت کنم، به شرط این‌که محدودهٔ کار کم شه.", note: "*on condition that* امتیاز را مشروط می‌سازه: deadline زودتر قبول استه، اما فقط اگه scope کم شه.", media_asset_key: "en.b2.audio.negotiation.sentence.01"}
  en.b2.unit07.lesson02.teach.cannot_agree: {title: "I cannot agree to Tuesday with the full محدودهٔ کار.", gloss: "نمی‌تانم سه‌شنبه را با محدودهٔ کامل کار قبول کنم.", note: "*I cannot agree to...* رد واضح و کاری استه. از ترجمهٔ تند مثل *I don't accept* وقتی لحن کاری لازم استه، پرهیز کنین."}
  en.b2.unit07.lesson02.teach.accept_if: {title: "I can accept that if the full ضمیمه follows next week.", gloss: "این را قبول کده می‌تانم اگه ضمیمهٔ کامل هفتهٔ آینده بیایه.", note: "*if* شرط پذیرش را می‌سازه. قبول کامل نیست؛ شرط داره."}
  en.b2.unit07.lesson02.teach.grammar_concession: {title: "رد واضح، امتیاز مشروط", gloss: "برای push back کاری از *I cannot agree to...* استفاده کنین. برای امتیاز دادن، اما نه بی‌قید، از *I can agree... on condition that...* استفاده کنین. در دری می‌تانین با «به شرط این‌که» همین رابطه را حس کنین.", note: "اول نام شرط نامناسب، بعد دلیل، بعد پیشنهاد قابل قبول."}

  en.b2.unit07.lesson03.teach.executive_summary: {title: "executive summary", gloss: "خلاصهٔ مدیریتی، نکته‌های اصلی گزارش", note: "*executive summary* خلاصهٔ بلند برای مدیرها نیست؛ بخش کوتاهی استه که نکته‌های اصلی را می‌ته.", example_gloss: "executive summary نکته‌های اصلی گزارش را می‌ته."}
  en.b2.unit07.lesson03.teach.charts: {title: "charts", gloss: "چارت‌ها، نمایش تصویری معلومات", note: "*charts* معلومات را با شکل، خط، ستون، یا نمودار نشان می‌تن.", example_gloss: "چارت‌ها معلومات را به شکل دیدنی نشان می‌تن."}
  en.b2.unit07.lesson03.teach.reading_passage: {title: "متن دربارهٔ شرط‌های اصلاح‌شده", gloss: "پریا اول پنج‌شنبه را برای گزارش کامل پیشنهاد کد. مارکوس مخالفت کد چون مشتری چیزی زودتر لازم داشت. پریا سه‌شنبه با محدودهٔ کامل کار را رد کد، چون کیفیت را به خطر می‌انداخت. بعد یک امتیاز مشروط پیشنهاد کد: سه‌شنبه ممکن بود اگه محدودهٔ کار به خلاصهٔ مدیریتی و چارت‌ها کم می‌شد. مارکوس آن شرط را قبول کرد، اما یک شرط اضافه کد: ضمیمهٔ کامل هفتهٔ آینده بیایه. نتیجهٔ توافق‌شده این بود: سه‌شنبه برای خلاصه و چارت‌ها، و هفتهٔ آینده برای ضمیمه.", note: "هر حرکت مذاکره را جدا ببینین: proposal، refusal، concession، condition، agreement."}

  en.b2.unit07.lesson04.teach.q_thursday: {title: "پیشنهاد اول پریا", gloss: "پریا می‌گه: می‌تانیم گزارش را تا پنج‌شنبه تحویل بتیم اگه محدودهٔ کار همان‌طور که پلان شده بمانه.", note: "این proposal یک شرط پنهان داره: scope کامل بمانه، deadline پنج‌شنبه استه.", media_asset_key: "en.b2.audio.dialogue.negotiation.01"}
  en.b2.unit07.lesson04.teach.a_tuesday: {title: "فشار مارکوس", gloss: "مارکوس می‌گه: پنج‌شنبه برای مشتری خیلی دیر استه. می‌تانین تا سه‌شنبه تحویل بتین؟", note: "او deadline را تغییر می‌ته، پس باید scope هم بحث شه."}
  en.b2.unit07.lesson04.teach.q_cannot_tuesday: {title: "رد واضح پریا", gloss: "پریا می‌گه: نمی‌تانم سه‌شنبه را با محدودهٔ کامل کار قبول کنم. این کیفیت را به خطر می‌اندازه.", note: "رد، دلیل داره؛ فقط «نه» نیست."}
  en.b2.unit07.lesson04.teach.a_what_possible: {title: "راه باز کدن مارکوس", gloss: "مارکوس می‌پرسه: چی چیز سه‌شنبه را ممکن می‌سازه؟", note: "این سوال برای پیدا کدن concession استه."}
  en.b2.unit07.lesson04.teach.q_condition: {title: "امتیاز مشروط پریا", gloss: "پریا می‌گه: می‌تانم با مهلت زودتر موافقت کنم، به شرط این‌که محدودهٔ کار به خلاصهٔ مدیریتی و چارت‌ها کم شه.", note: "*on condition that* شرط اصلی توافق را نشان می‌ته."}
  en.b2.unit07.lesson04.teach.a_accept_ضمیمه: {title: "شرط اضافهٔ مارکوس", gloss: "مارکوس می‌گه: این را قبول کده می‌تانم اگه ضمیمهٔ کامل هفتهٔ آینده بیایه.", note: "او شرط پریا را قبول می‌کنه، اما term دیگر اضافه می‌کنه."}
  en.b2.unit07.lesson04.teach.q_agreed: {title: "توافق نهایی", gloss: "پریا می‌گه: قبول. سه‌شنبه برای خلاصه و چارت‌ها، و هفتهٔ آینده برای ضمیمه.", note: "نتیجهٔ نهایی هر دو بخش را نام می‌بره."}

exercises:
  en.b2.unit07.lesson01.exercise01_choose_concession:
    instruction: "کدام کلمه یعنی در مذاکره از بخشی از موقف خود کوتاه آمدن؟"
    correct_option: "concession"
    distractors: ["refusal", "proposal", "scope"]
    accepted_answers: [{value: "concession", status: "correct"}]
    feedback: "*concession* امتیاز دادن یا کوتاه آمدن از یک بخش موقف استه."
  en.b2.unit07.lesson01.exercise02_choose_scope:
    instruction: "کدام کلمه یعنی مقدار کاری که شامل می‌شه؟"
    correct_option: "scope"
    distractors: ["term", "condition", "proposal"]
    accepted_answers: [{value: "scope", status: "correct"}]
    feedback: "*scope* محدوده یا حجم کار استه."
  en.b2.unit07.lesson01.exercise03_match_terms:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "term", right: "یک بند یا بخش توافق"}
      - {left: "proposal", right: "پیشنهاد شرط‌های ممکن"}
      - {left: "refusal", right: "رد کدن یک شرط"}
      - {left: "concession", right: "امتیاز دادن، کوتاه آمدن از یک بخش موقف"}
      - {left: "scope", right: "حجم یا محدودهٔ کار شامل‌شده"}
      - {left: "condition", right: "شرطی که باید برآورده شه"}
    accepted_answers:
      - value:
          - {left: "term", right: "یک بند یا بخش توافق"}
          - {left: "proposal", right: "پیشنهاد شرط‌های ممکن"}
          - {left: "refusal", right: "رد کدن یک شرط"}
          - {left: "concession", right: "امتیاز دادن، کوتاه آمدن از یک بخش موقف"}
          - {left: "scope", right: "حجم یا محدودهٔ کار شامل‌شده"}
          - {left: "condition", right: "شرطی که باید برآورده شه"}
        status: "correct"
    feedback: "این‌ها حرکت‌های متفاوت مذاکره استن؛ مخصوصاً refusal و concession را قاطی نکنین."
  en.b2.unit07.lesson01.exercise04_write_refusal:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی گفتن این‌که یک شرط قابل قبول نیست."
    accepted_answers:
      - {value: "refusal", status: "correct"}
      - {value: "Refusal", status: "correct"}
    feedback: "*refusal* یعنی رد کدن."
  en.b2.unit07.lesson01.exercise05_write_proposal:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی شرط‌های پیشنهادی."
    accepted_answers:
      - {value: "proposal", status: "correct"}
      - {value: "Proposal", status: "correct"}
    feedback: "*proposal* پیشنهاد شرط‌ها استه."

  en.b2.unit07.lesson02.exercise01_choose_refusal:
    instruction: "کدام جمله یک شرط نامناسب را واضح رد می‌کنه؟"
    correct_option: "I cannot agree to Tuesday with the full scope."
    distractors: ["I can agree to the earlier deadline on condition that the scope is reduced.", "I can accept that if the full appendix follows next week.", "Tuesday is possible if the scope is reduced."]
    accepted_answers: [{value: "I cannot agree to Tuesday with the full scope.", status: "correct"}]
    feedback: "*I cannot agree to...* رد واضح و کاری استه."
  en.b2.unit07.lesson02.exercise02_choose_condition:
    instruction: "کدام جمله با *on condition that* امتیاز مشروط دربارهٔ deadline زودتر پیشنهاد می‌کنه؟"
    correct_option: "I can agree to the earlier deadline on condition that the scope is reduced."
    distractors: ["I cannot agree to Tuesday with the full scope.", "I can accept that if the full appendix follows next week.", "That would risk the quality."]
    accepted_answers: [{value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}]
    feedback: "*on condition that* نشان می‌ته قبول کدن شرط داره."
  en.b2.unit07.lesson02.exercise03_order_condition:
    instruction: "کلمات را برای ساختن یک concession مشروط ترتیب کنین: «می‌تانم با مهلت زودتر موافقت کنم، به شرط این‌که محدودهٔ کار کم شه.»"
    accepted_answers: [{value: ["I", "can", "agree", "to", "the", "earlier", "deadline", "on", "condition", "that", "the", "scope", "is", "reduced"], status: "correct"}]
    feedback: "ترتیب درست: *I can agree to the earlier deadline on condition that the scope is reduced*"
  en.b2.unit07.lesson02.exercise04_reply_refusal:
    instruction: "رد کنین: بگین که با سه‌شنبه و محدودهٔ کامل کار موافقت کرده نمی‌تانین."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope.", status: "correct"}
      - {value: "I cannot agree to Tuesday with the full scope", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope", status: "correct"}
    feedback: "نسخهٔ *can't* هم قابل قبول استه، اما در لحن رسمی‌تر *cannot* قوی و واضح استه."
  en.b2.unit07.lesson02.exercise05_write_conditional:
    instruction: "امتیاز شرط‌دار بتین: می‌تانین با مهلت زودتر موافقت کنین، به شرطی که محدودهٔ کار کم ساخته شه."
    accepted_answers:
      - {value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline on condition that the scope is reduced", status: "correct"}
      - {value: "I can agree to the earlier deadline provided that the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline as long as the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline if the scope is reduced.", status: "correct"}
    feedback: "جواب باید هم concession و هم condition را داشته باشه."

  en.b2.unit07.lesson03.exercise01_choose_refused_term:
    instruction: "پریا کدام شرط را رد کد؟"
    correct_option: "Tuesday with the full scope"
    distractors: ["Thursday for the full report", "Tuesday for the summary and charts", "next week for the appendix"]
    accepted_answers: [{value: "Tuesday with the full scope", status: "correct"}]
    feedback: "او سه‌شنبه را فقط با scope کامل رد کرد."
  en.b2.unit07.lesson03.exercise02_choose_agreed_outcome:
    instruction: "کدام نتیجه توافق شد؟"
    correct_option: "Tuesday for the summary and charts, and next week for the appendix"
    distractors: ["Tuesday for the full report", "Thursday for the summary only", "next week for the entire report"]
    accepted_answers: [{value: "Tuesday for the summary and charts, and next week for the appendix", status: "correct"}]
    feedback: "توافق نهایی scope را تقسیم کد: summary و charts زودتر، appendix بعدتر."
  en.b2.unit07.lesson03.exercise03_match_negotiation_roles:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "Priya's first proposal", right: "پنج‌شنبه برای گزارش کامل"}
      - {left: "Marcus's requested deadline", right: "سه‌شنبه"}
      - {left: "Priya's refusal", right: "نه سه‌شنبه با همهٔ کارها"}
      - {left: "Priya's condition", right: "کار به خلاصه و نمودارها کم شوه"}
      - {left: "Marcus's added term", right: "ضمیمه هفتهٔ آینده میایه"}
      - {left: "final agreement", right: "سه‌شنبه برای خلاصه و نمودارها"}
    accepted_answers:
      - value:
          - {left: "Priya's first proposal", right: "پنج‌شنبه برای گزارش کامل"}
          - {left: "Marcus's requested deadline", right: "سه‌شنبه"}
          - {left: "Priya's refusal", right: "نه سه‌شنبه با همهٔ کارها"}
          - {left: "Priya's condition", right: "کار به خلاصه و نمودارها کم شوه"}
          - {left: "Marcus's added term", right: "ضمیمه هفتهٔ آینده میایه"}
          - {left: "final agreement", right: "سه‌شنبه برای خلاصه و نمودارها"}
        status: "correct"
    feedback: "هر خط مذاکره یک کار داره: پیشنهاد، فشار، رد، شرط، term اضافه، توافق."
  en.b2.unit07.lesson03.exercise04_write_agreed_outcome:
    instruction: "نتیجه را خلاصه کنین: نتیجهٔ توافق، سه‌شنبه برای خلاصه و نمودارها و هفتهٔ بعد برای ضمیمه بود."
    accepted_answers:
      - {value: "The agreed outcome was Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
      - {value: "The agreed outcome was Tuesday for the summary and charts and next week for the appendix.", status: "correct"}
    feedback: "جمله باید هر دو بخش توافق را نام ببره."
  en.b2.unit07.lesson03.exercise05_write_open_condition:
    instruction: "بنویسین که سه‌شنبه به کدام شرط ممکن استه: اگه محدودهٔ کار به خلاصهٔ مدیریتی و نمودارها کم ساخته شه."
    accepted_answers:
      - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts.", status: "correct"}
      - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts", status: "correct"}
      - {value: "Tuesday is possible on condition that the scope is reduced to the executive summary and the charts.", status: "correct"}
    feedback: "*if the scope is reduced...* شرط امکان سه‌شنبه را می‌سازه."

  en.b2.unit07.lesson04.exercise01_choose_refusal:
    instruction: "در گفتگو، کدام جمله refusal پریا استه؟"
    correct_option: "I cannot agree to Tuesday with the full scope."
    distractors: ["I can agree to the earlier deadline on condition that the scope is reduced.", "We can deliver the report by Thursday if the scope stays as planned.", "Agreed. Tuesday for the summary and charts."]
    accepted_answers: [{value: "I cannot agree to Tuesday with the full scope.", status: "correct"}]
    feedback: "این جمله شرط نامناسب را رد می‌کنه."
  en.b2.unit07.lesson04.exercise02_listen_condition:
    instruction: "گوش کنین و شرط پریا را انتخاب کنین."
    correct_option: "the scope is reduced to the executive summary and the charts"
    distractors: ["the full report is delivered by Tuesday", "the client waits until Thursday", "the appendix is removed completely"]
    accepted_answers: [{value: "the scope is reduced to the executive summary and the charts", status: "correct"}]
    feedback: "شرط او کاهش scope به summary و chartها استه."
  en.b2.unit07.lesson04.exercise03_order_agreed:
