course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit19.preferences: {title: "بیان علاقه‌مندی و ترجیح"}

lessons:
  en.a1.unit19.lesson01.like_and_dislike_verbs: {title: "خوش داشتن، دوست داشتن، نفرت داشتن و ترجیح دادن"}
  en.a1.unit19.lesson02.asking_about_preferences: {title: "پرسیدن در بارهٔ علاقهٔ کسی"}
  en.a1.unit19.lesson03.reading_a_preference_message: {title: "خواندن در بارهٔ ترجیحات یک نفر"}
  en.a1.unit19.lesson04.preference_dialogue: {title: "گپ‌زدن در بارهٔ ترجیحات"}

teaching:
  en.a1.unit19.lesson01.teach.like: {title: "like", gloss: "خوش داشتن", note: "like یعنی خوش داشتن.", example_gloss: "من قهوه خوش دارم."}
  en.a1.unit19.lesson01.teach.dont_like: {title: "don't like", gloss: "خوش نداشتن", note: "don't like شکل منفی like استه.", example_gloss: "من چای خوش ندارم."}
  en.a1.unit19.lesson01.teach.prefer: {title: "prefer", gloss: "ترجیح دادن", note: "prefer برای بیان یک انتخاب قوی‌تر بین دو چیز استعمال می‌شه.", example_gloss: "من قهوه را ترجیح می‌تم."}
  en.a1.unit19.lesson01.teach.love: {title: "love", gloss: "خیلی خوش داشتن", note: "love یعنی خیلی زیاد خوش داشتن.", example_gloss: "من فامیلم را خیلی خوش دارم."}
  en.a1.unit19.lesson01.teach.hate: {title: "hate", gloss: "نفرت داشتن", note: "hate خلاف love استه.", example_gloss: "از دیر رسیدن نفرت دارم."}

  en.a1.unit19.lesson02.teach.do_you_like_or: {title: "Do you like coffee or tea?", gloss: "قهوه خوش دارین یا چای؟", note: "همی جمله برای پرسیدن در بارهٔ انتخاب بین دو چیز استعمال می‌شه."}
  en.a1.unit19.lesson02.teach.i_prefer_tea: {title: "I prefer tea.", gloss: "من چای را ترجیح می‌تم.", note: "I prefer... برای بیان یک انتخاب قوی‌تر استعمال می‌شه."}
  en.a1.unit19.lesson02.teach.because_reason: {title: "I like tea because it's calmer.", gloss: "چای را خوش دارم چون آرام‌ترَه.", note: "because برای بیان دلیل یک ترجیح استعمال می‌شه."}

  en.a1.unit19.lesson03.teach.very_much: {title: "very much", gloss: "خیلی زیاد", note: "very much یعنی خیلی زیاد.", example_gloss: "من قهوه را خیلی زیاد خوش دارم."}
  en.a1.unit19.lesson03.teach.preference_text: {title: "متن ترجیحات", gloss: "چای را خوش دارم، مگم قهوه را خوش ندارم. چای را ترجیح می‌تم چون آرام‌ترَه.", note: "همی یک بیان واقعی از ترجیحات با دلیل استه."}

  en.a1.unit19.lesson04.teach.too_strong: {title: "It's too strong.", gloss: "خیلی تُند استه.", note: "too strong یعنی بیش از حد قوی."}
  en.a1.unit19.lesson04.teach.q_coffee_or_tea: {title: "پرسیدن قهوه یا چای", gloss: "لیلا می‌پرسه قهوه خوش دارین یا چای؟", note: "همو سوال آموزش‌دیده در درس دوم."}
  en.a1.unit19.lesson04.teach.a_prefer_tea_not_much: {title: "جواب دنیل", gloss: "دنیل می‌گه چای را ترجیح می‌تم. قهوه را زیاد خوش ندارم.", note: "دنیل ترجیحش را بیان می‌کنه و بعد یک تفصیل اضافه می‌کنه."}
  en.a1.unit19.lesson04.teach.q_why_not: {title: "Why not?", gloss: "چرا نی؟", note: "Why not؟ برای پرسیدن دلیل یک ترجیح منفی استعمال می‌شه."}
  en.a1.unit19.lesson04.teach.a_too_strong_calmer: {title: "جواب کامل دنیل", gloss: "دنیل می‌گه فکر می‌کنم خیلی تُند استه. چای را خوش دارم چون آرام‌ترَه.", note: "دنیل هم دلیل رد قهوه و هم دلیل ترجیح چای را بیان می‌کنه."}
  en.a1.unit19.lesson04.teach.he_prefers_thinks: {title: "He prefers tea. He thinks it's too strong.", gloss: "او چای را ترجیح می‌ته. او فکر می‌کنه خیلی تُند استه.", note: "prefers و thinks شکل سوم‌شخص مفرد (he/she) استند -- با s در آخر."}

exercises:
  en.a1.unit19.lesson01.exercise01.listen_verb:
    instruction: "گوش کنین و فعلی که گفته شده را انتخاب کنین."
    correct_option: "prefer"
    distractors: ["like", "love", "hate"]
    accepted_answers: [{value: "prefer", status: "correct"}]
    feedback: "prefer یعنی ترجیح دادن."
  en.a1.unit19.lesson01.exercise02.choose_opposite_of_love:
    instruction: "خلاف love چیست؟"
    correct_option: "hate"
    distractors: ["like", "prefer", "don't like"]
    accepted_answers: [{value: "hate", status: "correct"}]
    feedback: "hate خلاف love استه."
  en.a1.unit19.lesson01.exercise03.choose_negative_form:
    instruction: "چطور می‌گین که چیزی را خوش ندارین؟"
    correct_option: "don't like"
    distractors: ["like", "love", "prefer"]
    accepted_answers: [{value: "don't like", status: "correct"}]
    feedback: "don't like شکل منفی like استه."
  en.a1.unit19.lesson01.exercise04.match_preference_words:
    instruction: "هر توضیح را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "like", right: "coffee makes you happy"}
          - {left: "love", right: "coffee is number one for you"}
          - {left: "hate", right: "the opposite of love"}
          - {left: "prefer", right: "a stronger preference between two choices"}
          - {left: "don't like", right: "coffee makes you sad"}
          - {left: "think", right: "to have an opinion about something"}
          - {left: "calmer", right: "more relaxing, less intense"}
        status: "correct"
    feedback: "هر تعریف با یک واژه یا عبارت انگلیسی جور است."
  en.a1.unit19.lesson01.exercise05.write_prefer:
    instruction: "کلمه‌ای که برای یک انتخاب قوی‌تر بین دو چیز استعمال می‌شه را بنویسین."
    accepted_answers:
      - {value: "prefer", status: "correct"}
      - {value: "Prefer", status: "correct"}
    feedback: "prefer یعنی ترجیح دادن."

  en.a1.unit19.lesson02.exercise01.listen_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "قهوه یا چای خوش دارین"
    distractors: ["ساعت چند استه", "کجا زندگی می‌کنین", "امروز چه کار می‌کنین"]
    accepted_answers: [{value: "قهوه یا چای خوش دارین", status: "correct"}]
    feedback: "Do you like coffee or tea؟ می‌پرسه قهوه خوش دارین یا چای."
  en.a1.unit19.lesson02.exercise02.choose_prefer_answer:
    instruction: "کسی می‌پرسه قهوه خوش دارین یا چای، و چای را بیشتر خوش دارین. چی می‌گین؟"
    correct_option: "I prefer tea."
    distractors: ["I like tea because it's calmer.", "It's too strong.", "Why not?"]
    accepted_answers: [{value: "I prefer tea.", status: "correct"}]
    feedback: "I prefer tea یعنی چای را ترجیح می‌تم."
  en.a1.unit19.lesson02.exercise03.order_because_calmer:
    instruction: "کلمات را برای گفتن «چای را خوش دارم چون آرام‌ترَه» ترتیب کنین."
    accepted_answers: [{value: ["I", "like", "tea", "because", "it's", "calmer"], status: "correct"}]
    feedback: "ترتیب درست: I like tea because it's calmer."
  en.a1.unit19.lesson02.exercise04.reply_coffee_or_tea:
    instruction: "قهوه خوش دارین یا چای؟ (چای را ترجیح می‌تین)"
    accepted_answers:
      - {value: "I prefer tea.", status: "correct"}
    feedback: "I prefer tea یعنی چای را ترجیح می‌تم."
  en.a1.unit19.lesson02.exercise05.write_preference_reason:
    instruction: "بنویسین که چای را خوش دارین چون آرام‌ترَه."
    accepted_answers:
      - {value: "I like tea because it's calmer.", status: "correct"}
      - {value: "I like tea because it's calmer", status: "correct"}
    feedback: "I like tea because it's calmer یعنی چای را خوش دارم چون آرام‌ترَه."

  en.a1.unit19.lesson03.exercise01.read_liked_drink:
    instruction: "نویسنده کدام نوشیدنی را خوش داره؟"
    correct_option: "tea"
    distractors: ["coffee", "juice", "milk"]
    accepted_answers: [{value: "tea", status: "correct"}]
    feedback: "متن می‌گه I like tea."
  en.a1.unit19.lesson03.exercise02.read_disliked_drink:
    instruction: "نویسنده کدام نوشیدنی را خوش نداره؟"
    correct_option: "coffee"
    distractors: ["tea", "juice", "milk"]
    accepted_answers: [{value: "coffee", status: "correct"}]
    feedback: "متن می‌گه I don't like coffee."
  en.a1.unit19.lesson03.exercise03.choose_reason:
    instruction: "چرا نویسنده چای را ترجیح می‌ته؟"
    correct_option: "it's calmer"
    distractors: ["it's cheaper", "it's sweeter", "it's warmer"]
    accepted_answers: [{value: "it's calmer", status: "correct"}]
    feedback: "متن می‌گه I prefer tea because it's calmer."
  en.a1.unit19.lesson03.exercise04.order_dont_like_coffee:
    instruction: "کلمات را برای گفتن «قهوه را زیاد خوش ندارم» ترتیب کنین."
    accepted_answers: [{value: ["I", "don't", "like", "coffee", "very", "much"], status: "correct"}]
    feedback: "ترتیب درست: I don't like coffee very much."
  en.a1.unit19.lesson03.exercise05.write_own_preference:
    instruction: "بنویسین که چای را ترجیح می‌تین چون آرام‌ترَه."
    accepted_answers:
      - {value: "I prefer tea because it's calmer.", status: "correct"}
      - {value: "I prefer tea because it's calmer", status: "correct"}
    feedback: "I prefer tea because it's calmer یعنی چای را ترجیح می‌تم چون آرام‌ترَه."

  en.a1.unit19.lesson04.exercise01.listen_daniels_preference:
    instruction: "گفتگو را گوش کنین و معلوم کنین دنیل کدام نوشیدنی را ترجیح می‌ته."
    correct_option: "prefers tea"
    distractors: ["prefers coffee", "likes both equally", "doesn't like either"]
    accepted_answers: [{value: "prefers tea", status: "correct"}]
    feedback: "دنیل می‌گه I prefer tea."
  en.a1.unit19.lesson04.exercise02.listen_reason:
    instruction: "گوش کنین و دلیل دنیل برای رد قهوه را انتخاب کنین."
    correct_option: "It's too strong."
    distractors: ["It's too expensive.", "It's too cold.", "It's too sweet."]
    accepted_answers: [{value: "It's too strong.", status: "correct"}]
    feedback: "دنیل می‌گه I think it's too strong."
  en.a1.unit19.lesson04.exercise03.choose_why_not_coffee:
    instruction: "چرا دنیل قهوه را زیاد خوش نداره؟"
    correct_option: "He thinks it's too strong."
    distractors: ["He thinks it's too expensive.", "He thinks it's too cold.", "He thinks it's too sweet."]
    accepted_answers: [{value: "He thinks it's too strong.", status: "correct"}]
    feedback: "دنیل می‌گه I think it's too strong."
  en.a1.unit19.lesson04.exercise04.order_why_not:
    instruction: "کلمات را برای گفتن «چرا نی؟» ترتیب کنین."
    accepted_answers: [{value: ["Why", "not"], status: "correct"}]
    feedback: "ترتیب درست: Why not؟"
  en.a1.unit19.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌پرسه: قهوه خوش دارین یا چای؟ چرا نی؟"
    accepted_answers:
      - {value: "I prefer tea. I don't like coffee very much. I think it's too strong. I like tea because it's calmer.", status: "correct"}
      - {value: "I prefer tea, and I don't like coffee very much because I think it's too strong. I like tea because it's calmer.", status: "correct"}
    feedback: "جواب کامل ترجیح، دلیل رد قهوه، و دلیل ترجیح چای را با هم بیان می‌کنه -- چند لحظهٔ جدا از گفتگو."
  en.a1.unit19.lesson04.exercise06.speak_preference_dialogue:
    instruction: "به نقش دنیل، آواز‌دار به لیلا جواب بدین."
    accepted_answers:
      - {value: "I prefer tea. I don't like coffee very much. I think it's too strong. I like tea because it's calmer.", status: "correct"}
      - {value: "I prefer tea, and I don't like coffee very much because I think it's too strong. I like tea because it's calmer.", status: "correct"}
    feedback: "جواب کامل هر دو بخش گفتگو را پوشش می‌ده: کدام را ترجیح می‌تین و چرا."
