review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit53 (bike rental), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit53.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit53.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices: bike/bicycle -> بایسکل (the standard Dari/Afghan borrowing, used throughout); size -> اندازه (the native Dari word, noted as interchangeable in casual speech with the borrowed سایز, which both dialects also use -- اندازه chosen as the more neutral teaching form); deposit -> پول ضمانت ('guarantee money,' the common Dari phrase for a rental deposit); the rest of the vocabulary (کرایه گرفتن/rent, پس دادن/return, ساعت/hour, کلاه ایمنی/helmet) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌خواهیم for می‌شود/می‌خواهیم, ایگه as the informal presentative particle, بجه as the informal o'clock marker). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's distributive/rate 'a/an' in 'ten dollars an hour' (meaning per hour) is the same underlying grammar phenomenon already flagged in the unit34 overlay's own review notes, described fresh here since it's directly relevant to this unit's real content: Dari expresses the identical rate meaning with the preposition در (در ساعت, 'per hour') rather than reusing its indefinite article, which carries no rate function at all; (2) English's placeholder pronoun 'one' standing in for an already-mentioned noun (I need a small one, meaning 'a small bike') is a specific grammatical device avoiding repetition while still marking countability -- Dari has no direct one-word equivalent, instead either repeating the noun or dropping it entirely and relying on context, so a Dari speaker must learn English's 'one' as a dedicated placeholder to reach for. Three-speaker dialogue (Rental Clerk, Mia, Leila) handled the same way as unit48/unit50/unit51/unit52's precedent -- Leila's and Mia's size requests kept as two separate single-fact turns, matching the realization's own deliberate split to avoid a same-speaker-two-candidates trap. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: the Rental Clerk states two distinct numeric facts in one line (ten dollars an hour, twenty-dollar deposit) -- lesson03.exercise03/lesson04's deposit question never uses 'ten dollars' as a distractor and no hourly-rate question in this overlay ever uses 'twenty dollars' as a distractor; a size question targeting Leila never offers 'medium' (Mia's own size, never said by Leila) and vice versa. Twenty dollars was also cross-checked against unit08/unit40/unit51/unit52's prices for accidental collision, none found, matching the realization's own note. Multi-clause accepted_answers (lesson04's write_own_bike_ride_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit53.bike_rental: {title: "کرایه گرفتن یک بایسکل"}

lessons:
  en.a1.unit53.lesson01.bike_rental_vocabulary: {title: "کلمات کرایهٔ بایسکل"}
  en.a1.unit53.lesson02.phrases_for_renting_a_bike: {title: "عبارات کرایه گرفتن بایسکل"}
  en.a1.unit53.lesson03.dialogue_at_the_rental_shop: {title: "گفتگو: توی دکان کرایهٔ بایسکل"}
  en.a1.unit53.lesson04.a_bike_ride_along_the_river: {title: "متن: بایسکل‌رانی در کنار دریا"}

teaching:
  en.a1.unit53.lesson01.teach.rent: {title: "rent", gloss: "کرایه گرفتن", note: "rent یعنی کرایه گرفتن -- پول دادن برای یک مدت کار گرفتن یک چیز، بعد پسش دادن.", example_gloss: "می‌خواهم یک بایسکل کرایه کنم."}
  en.a1.unit53.lesson01.teach.deposit: {title: "deposit", gloss: "پول ضمانت", note: "deposit یعنی پول ضمانت -- پولی که اول می‌تین و اگه چیز را سالم پس بتین دوباره پس می‌گیرین.", example_gloss: "پول ضمانت بیست دالر استه."}
  en.a1.unit53.lesson01.teach.return: {title: "return", gloss: "پس دادن", note: "return یعنی یک چیز را پس دادن.", example_gloss: "لطفاً بایسکل را امروز پس بتین."}
  en.a1.unit53.lesson01.teach.hour: {title: "hour", gloss: "ساعت", note: "hour یعنی ساعت -- یک واحد زمان، شصت دقیقه.", example_gloss: "هر ساعت ده دالر می‌شه."}
  en.a1.unit53.lesson01.teach.size: {title: "size", gloss: "اندازه", note: "size یعنی اندازه -- بزرگی یا کوچکی یک چیز.", example_gloss: "کدام اندازه ضرورت دارین؟"}
  en.a1.unit53.lesson01.teach.helmet: {title: "helmet", gloss: "کلاه ایمنی", note: "helmet یعنی کلاه ایمنی -- یک کلاه سخت که سر تان را وخت بایسکل‌رانی حفظ می‌کنه.", example_gloss: "کلاه ایمنی دارین؟"}

  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike: {title: "I'd like to rent a bike, please.", gloss: "می‌خواهم یک بایسکل کرایه کنم، لطفاً.", note: "I'd like to ... طریقهٔ مؤدبانهٔ I want to استه."}
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour: {title: "How much does it cost per hour?", gloss: "هر ساعت چند دالر می‌شه؟", note: "per hour یعنی «هر ساعت» -- دری این معنای نرخ را با «هر» می‌رساند، انگلیسی با per یا a/an."}
  en.a1.unit53.lesson02.teach.i_need_a_small_bike: {title: "I need a small bike.", gloss: "به یک بایسکل کوچک ضرورت دارم.", note: "همو ساختار need که در واحدهای پیش یاد گرفتین."}
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet: {title: "Can I have a helmet, please?", gloss: "می‌تانم یک کلاه ایمنی بگیرم، لطفاً؟", note: "Can I have ...? یک طریقهٔ مؤدبانه برای خواستن یک چیز استه."}
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it: {title: "When do I need to return it?", gloss: "کی باید پسش بتم؟", note: "When do I need to ...? یک ساختار سوالی برای پرسیدن وخت یک وظیفه استه."}
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour: {title: "It's ten dollars an hour.", gloss: "هر ساعت ده دالر می‌شه.", note: "an hour اینجه یعنی «هر ساعت» -- an اینجه معنای «هر» می‌ته، نی معنای معمولی «یک». دری این معنای نرخ را با حرف اضافهٔ «در» (در ساعت) می‌رساند، نی با حرف نکره."}

  en.a1.unit53.lesson03.teach.dialogue_line1: {title: "سلام کارمند کرایه", gloss: "سلام! امروز چطور می‌تانم کمک تان کنم؟", note: "همو عبارت How can I help you؟ که در واحدهای پیش دیدین."}
  en.a1.unit53.lesson03.teach.dialogue_line2: {title: "خواهش میا", gloss: "می‌خواهیم دو بایسکل کرایه کنیم. می‌خواهیم در کنار دریا بایسکل‌رانی کنیم.", note: "along the river یعنی در کنار دریا."}
  en.a1.unit53.lesson03.teach.dialogue_line3: {title: "سوال کارمند کرایه", gloss: "بلی. کدام اندازه ضرورت دارین؟", note: "همو سوال What size که در لسن ۱ یاد گرفتین."}
  en.a1.unit53.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "به یک کوچکش ضرورت دارم.", note: "one اینجه به‌جای «بایسکل» می‌آیه -- انگلیسی از یک ضمیر جانشین (one) کار می‌گیره تا از تکرار کلمهٔ bike جلوگیری کنه. دری معمولاً یا کلمه را دوباره می‌گه یا کاملاً حذفش می‌کنه."}
  en.a1.unit53.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "و من به یک متوسطش ضرورت دارم.", note: "همو ساختار one که در خط پیش یاد گرفتین."}
  en.a1.unit53.lesson03.teach.dialogue_line6: {title: "گفتهٔ کارمند کرایه", gloss: "خوب استه، ایگه بایسکل‌های تان. هر ساعت ده دالر می‌شه، و پول ضمانت بیست دالر استه.", note: "این جمله دو حقیقت جداگانه داره -- نرخ ساعتی و پول ضمانت."}
  en.a1.unit53.lesson03.teach.dialogue_line7: {title: "سوال میا", gloss: "کی باید پس شان بتیم؟", note: "them یعنی «شان» -- به بایسکل‌ها اشاره می‌کنه."}
  en.a1.unit53.lesson03.teach.dialogue_line8: {title: "خواهش کارمند کرایه", gloss: "لطفاً تا ساعت پنج بجه پس شان بتین.", note: "by + ساعت یعنی «تا ساعت ___»."}
  en.a1.unit53.lesson03.teach.dialogue_line9: {title: "جواب لیلا", gloss: "خوب استه، تشکر!", note: "یک جواب کوتاه و مؤدبانه استه."}

  en.a1.unit53.lesson04.teach.reading_passage: {title: "متن: بایسکل‌رانی در کنار دریا", gloss: "بایسکل‌رانی در کنار دریا: یک بعد از ظهر گرم، میا لیلا را دعوت کرد که همرایش نزدیک آپارتمانش در کنار دریا بایسکل‌رانی کنن. هیچ‌کدام شان یک بایسکل نداشتن، پس با هم به یک دکان کرایه رفتن. کارمند پرسید کدام اندازه ضرورت دارن، و لیلا یک بایسکل کوچک گرفت درحالیکه میا یکی متوسط گرفت. کرایه هر ساعت ده دالر بود، و پول ضمانت برای هردو بایسکل بیست دالر بود. آن‌ها باید تا ساعت پنج بجه بایسکل‌ها را پس می‌دادن. بایسکل‌رانی در کنار دریا خیلی قشنگ بود، و آن‌ها مردمی را دیدن که سگ‌های شان را می‌گرداندن و از هوای آفتابی لذت می‌بردن. آن‌ها بایسکل‌ها را درست به وخت پس دادن و پول ضمانت شان را پس گرفتن. بعداً، به دانیال در بارهٔ بایسکل‌رانی گفتن، و او گفت که دفعهٔ بعد می‌خواد همرای شان بیایه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- invited, owned, went, asked, took, was, had, returned, got, told, said, wanted."}

exercises:
  en.a1.unit53.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "deposit"
    distractors: ["rent", "return", "hour", "size"]
    accepted_answers: [{value: "deposit", status: "correct"}]
    feedback: "deposit یعنی پول ضمانت."
  en.a1.unit53.lesson01.exercise02.choose_return_meaning:
    instruction: "کدام کلمه یعنی یک چیز را پس دادن؟"
    correct_option: "return"
    distractors: ["rent", "deposit", "size"]
    accepted_answers: [{value: "return", status: "correct"}]
    feedback: "return یعنی پس دادن."
  en.a1.unit53.lesson01.exercise03.match_bike_rental_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "bike", "right": "a vehicle you pedal, often rented for a short time"}, {"left": "rent", "right": "to pay to use something for a while, then give it back"}, {"left": "deposit", "right": "money you pay first and get back when you return something undamaged"}, {"left": "return", "right": "to bring something back"}, {"left": "hour", "right": "a unit of time, sixty minutes"}, {"left": "size", "right": "how big or small something is"}, {"left": "helmet", "right": "a hard hat that protects your head while riding"}], "status": "correct"}]
    feedback: "bike=بایسکل، rent=کرایه گرفتن، deposit=پول ضمانت، return=پس دادن، hour=ساعت، size=اندازه، helmet=کلاه ایمنی."
  en.a1.unit53.lesson01.exercise04.order_rent_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "want", "to", "rent", "a", "bike."], status: "correct"}]
    feedback: "ترتیب درست: I want to rent a bike."
  en.a1.unit53.lesson01.exercise05.write_deposit:
    instruction: "کلمه‌ای را بنویسین که یعنی پولی که پیش از کرایه می‌تین و بعداً پس می‌گیرین."
    accepted_answers: [{value: "deposit", status: "correct"}]
    feedback: "deposit یعنی پول ضمانت."

  en.a1.unit53.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "How much does it cost per hour?"
    distractors: ["I'd like to rent a bike, please.", "I need a small bike.", "Can I have a helmet, please?"]
    accepted_answers: [{value: "How much does it cost per hour?", status: "correct"}]
    feedback: "How much does it cost per hour? یعنی هر ساعت چند دالر می‌شه؟"
  en.a1.unit53.lesson02.exercise02.choose_request_meaning:
    instruction: "کدام عبارت را یک مشتری برای خواستن کرایهٔ یک بایسکل می‌گه؟"
    correct_option: "I'd like to rent a bike, please."
    distractors: ["When do I need to return it?", "It's ten dollars an hour.", "Can I have a helmet, please?"]
    accepted_answers: [{value: "I'd like to rent a bike, please.", status: "correct"}]
    feedback: "I'd like to rent a bike, please. یعنی می‌خواهم یک بایسکل کرایه کنم، لطفاً."
  en.a1.unit53.lesson02.exercise03.choose_return_question_meaning:
    instruction: "کدام عبارت می‌پرسه که بایسکل کی باید پس داده شه؟"
    correct_option: "When do I need to return it?"
    distractors: ["I'd like to rent a bike, please.", "I need a small bike.", "It's ten dollars an hour."]
    accepted_answers: [{value: "When do I need to return it?", status: "correct"}]
    feedback: "When do I need to return it? یعنی کی باید پسش بتم؟"
  en.a1.unit53.lesson02.exercise04.order_price_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["It's", "ten", "dollars", "an", "hour."], status: "correct"}]
    feedback: "ترتیب درست: It's ten dollars an hour."
  en.a1.unit53.lesson02.exercise05.translate_helmet_request:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «می‌تانم یک کلاه ایمنی بگیرم، لطفاً؟»"
    accepted_answers:
      - {value: "Can I have a helmet, please?", status: "correct"}
      - {value: "Can I have a helmet, please", status: "correct"}
    feedback: "Can I have a helmet, please? یعنی می‌تانم یک کلاه ایمنی بگیرم، لطفاً؟"

  en.a1.unit53.lesson03.exercise01.comprehension_reason:
    instruction: "مطابق گفتگو، میا و لیلا چرا می‌خواهن بایسکل کرایه کنن؟"
    correct_option: "to ride along the river"
    distractors: ["to go to work", "to visit Daniel", "to go shopping"]
    accepted_answers: [{value: "to ride along the river", status: "correct"}]
    feedback: "می‌خواهن در کنار دریا بایسکل‌رانی کنن (to ride along the river)."
  en.a1.unit53.lesson03.exercise02.comprehension_leila_size:
    instruction: "مطابق گفتگو، لیلا کدام اندازهٔ بایسکل ضرورت داره؟"
    correct_option: "small"
    distractors: ["large", "extra small", "extra large"]
    accepted_answers: [{value: "small", status: "correct"}]
    feedback: "لیلا یک بایسکل کوچک (small) ضرورت داره."
  en.a1.unit53.lesson03.exercise03.listen_dialogue_deposit:
    instruction: "مطابق گفتگو، پول ضمانت چند دالر استه؟"
    correct_option: "twenty dollars"
    distractors: ["five dollars", "fifteen dollars", "thirty dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "پول ضمانت بیست دالر (twenty dollars) استه."
  en.a1.unit53.lesson03.exercise04.respond_own_bike_statement:
    instruction: "بگین لیلا یا میا کدام اندازه ضرورت داره، یا بگین پول ضمانت چند دالر استه."
    accepted_answers: ["I need a small one", "I need a small one.", "I need a medium one", "I need a medium one.", "It's ten dollars an hour", "It's ten dollars an hour.", "The deposit is twenty dollars", "The deposit is twenty dollars.", "Please return them by five o'clock", "Please return them by five o'clock."]
    feedback: "می‌تانین بگین I need a small one یا The deposit is twenty dollars."

  en.a1.unit53.lesson04.exercise01.reading_rental_reason:
    instruction: "مطابق متن، میا و لیلا چرا به دکان کرایه رفتن؟"
    correct_option: "neither of them owned a bike"
    distractors: ["their bikes were broken", "they wanted to buy new bikes", "the weather was too hot to walk"]
    accepted_answers: [{value: "neither of them owned a bike", status: "correct"}]
    feedback: "هیچ‌کدام شان یک بایسکل نداشتن (neither of them owned a bike)."
  en.a1.unit53.lesson04.exercise02.reading_return_time:
    instruction: "مطابق متن، باید بایسکل‌ها را ساعت چند پس می‌دادن؟"
    correct_option: "five o'clock"
    distractors: ["four o'clock", "six o'clock", "seven o'clock"]
    accepted_answers: [{value: "five o'clock", status: "correct"}]
    feedback: "باید بایسکل‌ها را ساعت پنج بجه (five o'clock) پس می‌دادن."
  en.a1.unit53.lesson04.exercise03.reading_told_daniel:
    instruction: "مطابق متن، آن‌ها در بارهٔ بایسکل‌رانی به کی گفتن؟"
    correct_option: "Daniel"
    distractors: ["the rental clerk", "Mia's neighbor", "Leila's mother"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "آن‌ها به دانیال (Daniel) گفتن."
  en.a1.unit53.lesson04.exercise04.write_own_bike_ride_message:
    instruction: "یک پیام کوتاه بنویسین: بگین لیلا کدام اندازهٔ بایسکل را گرفت، و بگین بایسکل‌ها را ساعت چند پس دادن."
    accepted_answers:
      - {value: "Leila took a small bike, and they returned the bikes by five o'clock.", status: "correct"}
      - {value: "Leila took a small bike. They returned the bikes by five o'clock.", status: "correct"}
      - {value: "Leila took a small bike and they returned the bikes by five o'clock.", status: "correct"}
    feedback: "می‌تانین بگین: Leila took a small bike, and they returned the bikes by five o'clock."
