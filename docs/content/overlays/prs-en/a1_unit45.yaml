generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific emergency-phrase source material (DLI Dari Basic Course, per CLAUDE.md's confirmed-good source) -- the DLI course's early semester-1 lessons (greetings/numbers/family) are already exhausted by units 01-24, and its later lessons at the point this unit would map to didn't surface a dedicated emergency/police/fire vocabulary lesson in the sections checked. No usable verbatim source material found for this specific topic; authored from established Dari-speaker conventions instead (same honest-disclosure standard as every other unit), consistent with AUTHORING_GUIDE.md #10's instruction to try real sources first but not invent usage in their absence."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit45 (emergencies), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all five lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: this overlay was authored without opening docs/content/overlays/nl-en/a1_unit45.yaml (reference-structure-only per the dispatch instruction, not consulted at all) or docs/content/overlays/fa-en/a1_unit45.yaml (a concurrent, distinct dispatch's lane -- not opened, per the strong sibling-isolation rule). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: police -> پولیس (the standard Dari/Afghan term, as opposed to Iranian Persian's پلیس); hospital-related vocabulary implied by ambulance's gloss uses شفاخانه (Dari for hospital) rather than Iranian Persian's بیمارستان; fire department -> اطفائیه (the standard Afghan term for the fire brigade/department, as opposed to Iranian Persian's آتش‌نشانی); stove -> باب گاز (a common Dari term for a gas stove); pan -> تاوه; dinner -> نان شب (literally 'evening bread,' the ordinary Dari colloquial term for the evening meal, distinct from Iranian Persian's شام). Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌خواد for می‌شود/می‌خواهد, وخت/وختی for وقت/وقتی, کو as the informal imperative of کردن, بگین/بفرستین as the polite-plural imperative forms), same register as the unit34/unit58 precedent files. Two genuine Dari-speaker English interference points in the unit-level contrastive note (not baked into every individual card, but reflected in the relevant dialogue-line notes): (1) English's phrasal verb 'turn off' (verb + particle forming an idiomatic meaning neither word carries alone) has no equivalent two-word system in Dari, which instead uses a single indivisible compound verb (خاموش کول/کردن, built from the adjective خاموش 'extinguished' plus the light verb کول/کردن) -- a Dari speaker must memorize 'turn off' as one chunk rather than analyze it word-by-word; (2) English's contracted 'I'll' for an on-the-spot, spontaneous decision (a distinct use of will/'ll from a pre-planned future) has no dedicated grammatical marker in Dari, which uses the ordinary present-future (زنگ می‌زنم) for both planned and spontaneous future actions alike -- so English's will/'ll here is a nuance to learn case-by-case, not a form with one fixed Dari equivalent. Same-speaker-distractor check performed per the standing CLAUDE.md footgun: lesson03.exercise03's listen_select tests what Leila asks the operator to send (correct_option 'the fire department', Leila's own line 5) against invented, never-said-by-Leila-in-this-audio distractors ('the police', 'an ambulance', 'a taxi') -- Leila never mentions any of those three elsewhere in the dialogue, so no same-speaker trap. Multi-clause accepted_answers (lesson04's write_own_emergency_message) mirrors the realization's own six period-joined/comma-joined English variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit45.emergencies: {title: "مواجهه با حالت اضطراری"}

lessons:
  en.a1.unit45.lesson01.emergency_vocabulary: {title: "کلمات حالت اضطراری"}
  en.a1.unit45.lesson02.asking_for_help: {title: "خواستن کمک"}
  en.a1.unit45.lesson03.dialogue_kitchen_fire: {title: "گفتگو: آتش‌سوزی در آشپزخانه"}
  en.a1.unit45.lesson04.emergency_notice: {title: "متن: در صورت آتش‌سوزی چه باید کرد"}

teaching:
  en.a1.unit45.lesson01.teach.emergency: {title: "emergency", gloss: "حالت اضطراری", note: "emergency یعنی حالت اضطراری -- یک وضعیت ناگهانی و خطرناک که ضرورت به عمل فوری داره.", example_gloss: "این یک حالت اضطراری استه!"}
  en.a1.unit45.lesson01.teach.help: {title: "help", gloss: "کمک", note: "help یعنی کمک -- چیزی که وقتی مشکل یا خطری پیش بیایه از کسی می‌خواین.", example_gloss: "به کمک ضرورت دارم!"}
  en.a1.unit45.lesson01.teach.police: {title: "police", gloss: "پولیس", note: "police یعنی پولیس -- در دری کلمهٔ «پولیس» کار می‌ره، نی «پلیس» که در فارسی ایران رایج استه.", example_gloss: "پولیس را زنگ بزنین!"}
  en.a1.unit45.lesson01.teach.ambulance: {title: "ambulance", gloss: "امبولانس", note: "ambulance یعنی امبولانس -- موتری که مریض یا زخمی را به شفاخانه می‌بره.", example_gloss: "به یک امبولانس ضرورت داریم!"}
  en.a1.unit45.lesson01.teach.fire_department: {title: "fire department", gloss: "اطفائیه", note: "fire department یعنی اطفائیه -- ادارهٔ که برای خاموش کردن آتش می‌آیه.", example_gloss: "اطفائیه اینجه استه."}

  en.a1.unit45.lesson02.teach.call_911: {title: "Call 911!", gloss: "به ۹۱۱ زنگ بزنین!", note: "۹۱۱ شمارهٔ خط اضطراری در امریکا استه -- call یعنی زنگ زدن."}
  en.a1.unit45.lesson02.teach.i_need_help: {title: "I need help!", gloss: "به کمک ضرورت دارم!", note: "need یعنی ضرورت داشتن."}
  en.a1.unit45.lesson02.teach.send_the_police: {title: "Send the police, please.", gloss: "پولیس را بفرستین، لطفاً.", note: "send یعنی فرستادن -- please در آخر جمله برای مؤدبانه گفتن یک خواهش کار می‌ره."}
  en.a1.unit45.lesson02.teach.send_an_ambulance: {title: "Send an ambulance, please.", gloss: "امبولانس بفرستین، لطفاً.", note: "همو ساختار send + please، خو اینجه با an چون ambulance با حرف صدادار شروع می‌شه."}
  en.a1.unit45.lesson02.teach.theres_a_fire: {title: "There's a fire!", gloss: "آتش گرفته!", note: "there's یعنی «there is» کوتاه شده -- برای گفتن اینکه یک چیز موجود استه کار می‌ره."}
  en.a1.unit45.lesson02.teach.whats_your_emergency: {title: "What's your emergency?", gloss: "مشکل اضطراری تان چیست؟", note: "این سوالی استه که آپریتر خط اضطراری معمولاً اول می‌پرسه."}

  en.a1.unit45.lesson03.teach.dialogue_line1: {title: "گپ لیلا", gloss: "دانیال، چیزی می‌سوزه؟ بوی دود می‌شنوم!", note: "is something burning? سوالی با فعل کمکی is استه -- burning شکل ing فعل burn (سوختن) استه."}
  en.a1.unit45.lesson03.teach.dialogue_line2: {title: "جواب دانیال", gloss: "وای نی، تاوه آتش گرفت! داشتم نان شب می‌پختم.", note: "caught fire یعنی آتش گرفت -- شکل ماضی فعل catch fire."}
  en.a1.unit45.lesson03.teach.dialogue_line3: {title: "گفتهٔ لیلا", gloss: "آرام باش. باب گاز را خاموش کو! من زنگ می‌زنم کمک بیایه.", note: "Turn off یک فعل مرکب (phrasal verb) به معنی خاموش کردن استه -- در دری این معنا با یک فعل مرکب واحد (خاموش کول) بیان می‌شه، نی دو کلمهٔ جدا. I'll یعنی I will کوتاه شده -- اینجه برای یک تصمیم آنی، همو لحظه گرفته شده کار می‌ره."}
  en.a1.unit45.lesson03.teach.dialogue_line4: {title: "گپ دانیال", gloss: "زود باش، آتش داره بزرگ‌تر می‌شه!", note: "is getting bigger یعنی داره بزرگ‌تر می‌شه -- زمان حال استمراری برای نشان دادن یک تغییر تدریجی کار می‌ره."}
  en.a1.unit45.lesson03.teach.dialogue_line5: {title: "زنگ لیلا به خط اضطراری", gloss: "الو، این یک حالت اضطراری استه. توی آشپزخانهٔ دوستم آتش گرفته. لطفاً اطفائیه را بفرستین.", note: "این جمله سه بخش داره: معرفی حالت اضطراری، گفتن جای مشکل، و خواستن کمک مشخص (fire department)."}
  en.a1.unit45.lesson03.teach.dialogue_line6: {title: "جواب دانیال", gloss: "خدا را شکر. فکر می‌کنم حالی خاموش شده، خو بیا بیرون منتظر باشیم که مطمئن شیم.", note: "Thank goodness یک عبارت محاوره‌ای برای نشان دادن آرامش استه -- just in case یعنی محض احتیاط."}
  en.a1.unit45.lesson03.teach.dialogue_line7: {title: "گفتهٔ لیلا", gloss: "فکر خوبیه. بیرون ماندن تا وختی که برسن مصئون‌تر استه.", note: "until they arrive یعنی تا وختی که برسن -- until حرف ربطی برای زمان استه."}

  en.a1.unit45.lesson04.teach.reading_passage: {title: "متن: در صورت آتش‌سوزی چه باید کرد", gloss: "در صورت آتش‌سوزی: اول، آرام باشین. دوم، فوراً ساختمان را ترک کنین. از لفت استفاده نکنین؛ از زینه استفاده کنین. سوم، وقتی بیرون شدین، به ۹۱۱ زنگ بزنین و آدرس تان را بگین. آخرین، بیرون منتظر باشین تا وختی که اطفائیه برسه. بعد از آتش‌سوزی آشپزخانهٔ دانیال، او و لیلا درست مطابق اعلانیه بیرون منتظر ماندن. اطفائیه زود رسید و مطمئن شد که همه چیز مصئون استه. بعداً، میا آمد تا از حال شان خبر بگیره و خوش شد که کسی زخمی نشده.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- waited, arrived, made, came, was."}

exercises:
  en.a1.unit45.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "police"
    distractors: ["emergency", "help", "ambulance", "fire department"]
    accepted_answers: [{value: "police", status: "correct"}]
    feedback: "police یعنی پولیس."
  en.a1.unit45.lesson01.exercise02.choose_ambulance_meaning:
    instruction: "کدام کلمه یعنی موتری که مریض یا زخمی را به شفاخانه می‌بره؟"
    correct_option: "ambulance"
    distractors: ["police", "fire department", "help"]
    accepted_answers: [{value: "ambulance", status: "correct"}]
    feedback: "ambulance یعنی امبولانس."
  en.a1.unit45.lesson01.exercise03.match_emergency_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "emergency", right: "وضعیت ناگهانی و خطرناک که اقدام فوری می‌خواد"}
      - {left: "help", right: "چیزی که وقت ضرورت از دیگران می‌خواین"}
      - {left: "police", right: "اداره‌ای که برای گزارش جرم زنگ می‌زنین"}
      - {left: "ambulance", right: "موتر ویژه‌ای که زخمی‌ها را به شفاخانه می‌بره"}
      - {left: "fire department", right: "اداره‌ای که برای خاموش‌کردن آتش زنگ می‌زنین"}
    accepted_answers:
      - value:
          - {left: "emergency", right: "وضعیت ناگهانی و خطرناک که اقدام فوری می‌خواد"}
          - {left: "help", right: "چیزی که وقت ضرورت از دیگران می‌خواین"}
          - {left: "police", right: "اداره‌ای که برای گزارش جرم زنگ می‌زنین"}
          - {left: "ambulance", right: "موتر ویژه‌ای که زخمی‌ها را به شفاخانه می‌بره"}
          - {left: "fire department", right: "اداره‌ای که برای خاموش‌کردن آتش زنگ می‌زنین"}
        status: "correct"
    feedback: "emergency=حالت اضطراری، help=کمک، police=پولیس، ambulance=امبولانس، fire department=اطفائیه."
  en.a1.unit45.lesson01.exercise04.order_ambulance_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "need", "an", "ambulance."], status: "correct"}]
    feedback: "ترتیب درست: We need an ambulance."
  en.a1.unit45.lesson01.exercise05.write_help_word:
    instruction: "کلمه‌ای را بنویسین که وقتی بشتاب به کسی ضرورت دارین فریاد می‌زنین."
    accepted_answers: [{value: "help", status: "correct"}]
    feedback: "help یعنی کمک."

  en.a1.unit45.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "There's a fire!"
    distractors: ["Call 911!", "I need help!", "What's your emergency?"]
    accepted_answers: [{value: "There's a fire!", status: "correct"}]
    feedback: "There's a fire! یعنی آتش گرفته!"
  en.a1.unit45.lesson02.exercise02.choose_send_ambulance_meaning:
    instruction: "کدام عبارت امبولانس را می‌خواد؟"
    correct_option: "Send an ambulance, please."
    distractors: ["Send the police, please.", "Call 911!", "There's a fire!"]
    accepted_answers: [{value: "Send an ambulance, please.", status: "correct"}]
    feedback: "Send an ambulance, please. یعنی امبولانس بفرستین، لطفاً."
  en.a1.unit45.lesson02.exercise03.choose_whats_your_emergency_meaning:
    instruction: "کدام عبارت را آپریتر خط اضطراری معمولاً اول می‌پرسه؟"
    correct_option: "What's your emergency?"
    distractors: ["I need help!", "Send the police, please.", "There's a fire!"]
    accepted_answers: [{value: "What's your emergency?", status: "correct"}]
    feedback: "What's your emergency? یعنی مشکل اضطراری تان چیست؟"
  en.a1.unit45.lesson02.exercise04.order_send_police_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Send", "the", "police,", "please."], status: "correct"}]
    feedback: "ترتیب درست: Send the police, please."
  en.a1.unit45.lesson02.exercise05.translate_i_need_help:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «به کمک ضرورت دارم!»"
    accepted_answers:
      - {value: "I need help!", status: "correct"}
      - {value: "I need help", status: "correct"}
    feedback: "I need help! یعنی به کمک ضرورت دارم!"

  en.a1.unit45.lesson03.exercise01.comprehension_leila_smells:
    instruction: "مطابق گفتگو، لیلا بوی چه چیزی را می‌شنوه؟"
    correct_option: "smoke"
    distractors: ["fire", "gas", "food"]
    accepted_answers: [{value: "smoke", status: "correct"}]
    feedback: "لیلا بوی دود (smoke) را می‌شنوه."
  en.a1.unit45.lesson03.exercise02.comprehension_daniel_why_fire:
    instruction: "مطابق گفتگو، دانیال وخت آتش گرفتن تاوه چه کار می‌کرد؟"
    correct_option: "cooking dinner"
    distractors: ["cleaning the kitchen", "calling Mia", "washing dishes"]
    accepted_answers: [{value: "cooking dinner", status: "correct"}]
    feedback: "دانیال داشت نان شب می‌پخت (cooking dinner)."
  en.a1.unit45.lesson03.exercise03.listen_dialogue_leila_request:
    instruction: "مطابق گفتگو، لیلا از آپریتر خط اضطراری چه چیزی را می‌خواد که بفرسته؟"
    correct_option: "the fire department"
    distractors: ["the police", "an ambulance", "a taxi"]
    accepted_answers: [{value: "the fire department", status: "correct"}]
    feedback: "لیلا اطفائیه (the fire department) را می‌خواد."
  en.a1.unit45.lesson03.exercise04.respond_own_emergency_request:
    instruction: "بگین که به کمک ضرورت دارین، یا بگین کدام سرویس باید فرستاده شه."
    accepted_answers: ["I need help", "I need help.", "Call the police", "Call the police.", "Call an ambulance", "Call an ambulance.", "There's a fire", "There's a fire.", "Send the fire department", "Send the fire department.", "Send the police", "Send the police.", "Send an ambulance", "Send an ambulance.", "Send the police, please.", "Send an ambulance, please.", "Send the fire department, please.", "Please send the fire department.", "Please send the police.", "Please send an ambulance.", "There is a fire.", "Call 911!"]
    feedback: "می‌تانین بگین I need help یا Call the police."

  en.a1.unit45.lesson04.exercise01.reading_first_step:
    instruction: "مطابق اعلانیه، اول باید چه کار کنین اگه آتش‌سوزی شه؟"
    correct_option: "stay calm"
    distractors: ["call 911", "use the stairs", "leave the building"]
    accepted_answers: [{value: "stay calm", status: "correct"}]
    feedback: "اعلانیه می‌گه اول باید آرام باشین (stay calm)."
  en.a1.unit45.lesson04.exercise02.reading_use_instead_of_elevator:
    instruction: "مطابق اعلانیه، به‌عوض لفت باید از چه چیزی استفاده کنین؟"
    correct_option: "the stairs"
    distractors: ["the window", "the ambulance", "the phone"]
    accepted_answers: [{value: "the stairs", status: "correct"}]
    feedback: "اعلانیه می‌گه باید از زینه (the stairs) استفاده کنین."
  en.a1.unit45.lesson04.exercise03.reading_who_checked_on_them:
    instruction: "مطابق متن، کی بعداً آمد تا از حال دانیال و لیلا خبر بگیره؟"
    correct_option: "Mia"
    distractors: ["Leila's mother", "a neighbor", "a police officer"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "میا (Mia) آمد تا از حال شان خبر بگیره."
  en.a1.unit45.lesson04.exercise04.write_own_emergency_message:
    instruction: "یک پیام کوتاه بنویسین: بگین که یک حالت اضطراری استه و به کدام کمک ضرورت دارین."
    accepted_answers:
