review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 11 fixes — false grammar note (loves to play is an infinitive, not love + -ing) corrected, informal 2sg (داری، تو چطور) -> polite دارین/شما, Iranian forms (می‌خواهم/می‌خواهین/می‌خواهد, بخواند for sing) -> Afghan می‌خوام/می‌خواین/می‌خواد/بخانه, بزرگ -> کلان for a big dog, typo توضیف, untaught distractor Max replaced, extra valid answers for the open pet exercises, spacing. NATIVE FLAGS: 1) بخانه / آواز خواندن (Kabuli خان- stem) used for sing; 2) گشت دادن for walk the dog. Prior note: New overlay against the shared English realization unit32 (animals/pets), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Attempted firecrawl search/scrape against the DLI Dari Basic Course first, per standing instruction -- the firecrawl CLI returned HTTP 402 (no credits available in this environment), so this file was authored from established Dari (Kabuli, colloquial-written register) vocabulary and grammar knowledge instead, consistent with the dialect conventions already fixed in this course's own prior units (استه for است, می‌ره/می‌گه informal 3rd-person endings, او not هغه for he/she, -ین 2nd-person-plural imperative endings, وخت not وقت). Genuine prs<->en contrastive-grammar point: the pet vocabulary card's Do you have any pets? example triggers do-support (a dummy auxiliary before the subject) and a semantically bleached any that only marks the question as being about existence rather than quantity -- Dari has neither device, forming the equivalent question by intonation alone (حیوان خانگی دارین؟) with no auxiliary verb and no equivalent of any. Dari-specific lexical items used for authenticity: پشک (cat, not the Iranian گربه) and خورد (small, not the more Iran-leaning کوچک). Sibling-isolation rule followed -- neither the en-prs nor the nl-en/fa-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit32.animals: {title: "گپ زدن دربارهٔ حیوانات خانگی"}

lessons:
  en.a1.unit32.lesson01.pet_vocabulary: {title: "حیوانات خانگی"}
  en.a1.unit32.lesson02.describing_pets: {title: "توصیف حیوان خانگی‌تان"}
  en.a1.unit32.lesson03.dialogue_mias_cat: {title: "گپ دربارهٔ پشک میا"}
  en.a1.unit32.lesson04.two_pet_owners: {title: "متن: دو صاحب حیوان خانگی"}

teaching:
  en.a1.unit32.lesson01.teach.dog: {title: "dog", gloss: "سگ", note: "dog یعنی سگ.", example_gloss: "من یک سگ دارم."}
  en.a1.unit32.lesson01.teach.cat: {title: "cat", gloss: "پشک", note: "cat یعنی پشک. توجه: در دری پشک استعمال می‌شه، نی گربه که بیشتر در فارسی ایرانی رایج استه.", example_gloss: "پشک خواهرم خاکستری‌رنگ استه."}
  en.a1.unit32.lesson01.teach.fish: {title: "fish", gloss: "ماهی", note: "fish یعنی ماهی.", example_gloss: "او یک ماهی داره."}
  en.a1.unit32.lesson01.teach.bird: {title: "bird", gloss: "پرنده", note: "bird یعنی پرنده.", example_gloss: "ما یک پرنده داریم."}
  en.a1.unit32.lesson01.teach.pet: {title: "pet", gloss: "حیوان خانگی", note: "pet یعنی حیوان خانگی -- کلمهٔ عمومی برای هر حیوانی که در خانه نگه می‌دارین. نکتهٔ گرامری: در سوال Do you have any pets؟ فعل کمکی do پیش از فاعل می‌آیه (ساختار سوالی مخصوص انگلیسی که دری معادل مستقیم نداره)، و کلمهٔ any هم اینجا معنای «مقدار» نداره -- فقط نشان می‌ده سوال دربارهٔ وجود یا عدم وجود چیزیس. در دری کافیس بگین «حیوان خانگی دارین؟» با یک لحن سوالی، بدون هیچ فعل کمکی یا معادلی برای any.", example_gloss: "حیوان خانگی دارین؟"}

  en.a1.unit32.lesson02.teach.name_is: {title: "Her name is Luna.", gloss: "نامش لونا استه.", note: "الگوی Her/His name is + نام برای گفتن اسم یک حیوان یا کس دیگه کار می‌ره."}
  en.a1.unit32.lesson02.teach.play: {title: "play", gloss: "بازی کردن", note: "play یعنی بازی کردن.", example_gloss: "سگم دوست داره بازی کنه."}
  en.a1.unit32.lesson02.teach.walk: {title: "walk", gloss: "گشت دادن", note: "walk به شکل فعل یعنی گشت دادن یا پیاده بردن یک حیوان -- مثلاً سگ را گشت دادن.", example_gloss: "من هر روز سگم را گشت می‌دم."}
  en.a1.unit32.lesson02.teach.friendly: {title: "friendly", gloss: "مهربان / خون‌گرم", note: "friendly یعنی مهربان، حیوان یا کسی که با مردم خوش‌رفتار استه.", example_gloss: "پشکش خیلی مهربان استه."}
  en.a1.unit32.lesson02.teach.small: {title: "small", gloss: "خورد", note: "small یعنی خورد -- کلمهٔ رایج دری برای «کوچک».", example_gloss: "ماهی خورد استه."}

  en.a1.unit32.lesson03.teach.dialogue_line1: {title: "دنیل می‌پرسه", gloss: "میا، حیوان خانگی دارین؟", note: "شروع گپ با یک سوال دوستانه، بدون فعل کمکی -- فقط لحن سوالی."}
  en.a1.unit32.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "بلی، یک پشک دارم. نامش لونا استه.", note: "Her name is برای معرفی نام حیوان کار می‌ره."}
  en.a1.unit32.lesson03.teach.dialogue_line3: {title: "دنیل می‌گه", gloss: "چه خوب! او دوست داره بازی کنه؟", note: "Does she...؟ سوال با فعل کمکی does، چون فاعل مفرد (she) استه."}
  en.a1.unit32.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "بلی، خیلی دوست داره همرای یک توپ بازی کنه. شما چطور؟", note: "loves to + فعل (اینجا loves to play) نشان‌دهندهٔ علاقهٔ زیاد استه؛ بعد از love هم to + فعل و هم فعل+ing می‌آیه."}
  en.a1.unit32.lesson03.teach.dialogue_line5: {title: "جواب دنیل", gloss: "من یک ماهی خورد دارم، خو یک سگ می‌خوام.", note: "want یعنی خواستن."}

  en.a1.unit32.lesson04.teach.reading_passage: {title: "متن: دو صاحب حیوان خانگی", gloss: "لیلا یک سگ داره به نام مکس. مکس قد کلان و خیلی مهربان استه. لیلا هر سحر مکس را گشت می‌ده. دنیل سگ نداره، خو یک ماهی خورد داره. ماهی به گشت ضرورت نداره، خو دنیل بازهم دوست داره تماشایش کنه که شنا می‌کنه.", note: "این متن چند صفت و فعل مربوط به حیوانات را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit32.lesson01.exercise01.listen_animal:
    instruction: "گوش کنین و حیوانی که گفته شد را انتخاب کنین."
    correct_option: "cat"
    distractors: ["dog", "fish", "bird"]
    accepted_answers: [{value: "cat", status: "correct"}]
    feedback: "cat یعنی پشک."
  en.a1.unit32.lesson01.exercise02.choose_swims_meaning:
    instruction: "کدام حیوان معمولاً توی آب زندگی می‌کنه؟"
    correct_option: "fish"
    distractors: ["dog", "cat", "bird"]
    accepted_answers: [{value: "fish", status: "correct"}]
    feedback: "fish یعنی ماهی، حیوانی که توی آب زندگی می‌کنه."
  en.a1.unit32.lesson01.exercise03.match_animals:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "dog", right: "حیوان خانگی که برای قدم زدن بیرون می‌برین"}
      - {left: "cat", right: "حیوانی که میو می‌کنه"}
      - {left: "fish", right: "حیوانی که در آب زندگی می‌کنه"}
      - {left: "bird", right: "حیوانی که می‌تانه پرواز کنه و آواز بخانه"}
      - {left: "pet", right: "حیوانی که در خانه نگه می‌دارین"}
    accepted_answers:
      - value:
          - {left: "dog", right: "حیوان خانگی که برای قدم زدن بیرون می‌برین"}
          - {left: "cat", right: "حیوانی که میو می‌کنه"}
          - {left: "fish", right: "حیوانی که در آب زندگی می‌کنه"}
          - {left: "bird", right: "حیوانی که می‌تانه پرواز کنه و آواز بخانه"}
          - {left: "pet", right: "حیوانی که در خانه نگه می‌دارین"}
        status: "correct"
    feedback: "dog=سگ، cat=پشک، fish=ماهی، bird=پرنده، pet=حیوان خانگی."
  en.a1.unit32.lesson01.exercise04.order_dog_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "a", "dog."], status: "correct"}]
    feedback: "ترتیب درست: I have a dog."
  en.a1.unit32.lesson01.exercise05.write_pet_word:
    instruction: "کلمه‌ای را بنویسین که یعنی حیوانی که می‌تانه پرواز کنه و بخانه."
    accepted_answers: [{value: "bird", status: "correct"}]
    feedback: "bird یعنی پرنده."

  en.a1.unit32.lesson02.exercise01.listen_question:
    instruction: "گوش کنین و جمله‌ای که گفته شد را انتخاب کنین."
    correct_option: "Do you have any pets?"
    distractors: ["What's your favorite pet?", "I have a small fish.", "She has a friendly dog."]
    accepted_answers: [{value: "Do you have any pets?", status: "correct"}]
    feedback: "Do you have any pets؟ یعنی حیوان خانگی دارین؟"
  en.a1.unit32.lesson02.exercise02.choose_friendly_meaning:
    instruction: "کدام کلمه یعنی حیوانی که با مردم خوش‌رفتار استه؟"
    correct_option: "friendly"
    distractors: ["small", "walk", "play"]
    accepted_answers: [{value: "friendly", status: "correct"}]
    feedback: "friendly یعنی مهربان."
  en.a1.unit32.lesson02.exercise03.choose_walk_meaning:
    instruction: "کدام کلمه یعنی بردن سگ به بیرون برای گشت زدن؟"
    correct_option: "walk"
    distractors: ["play", "friendly", "small"]
    accepted_answers: [{value: "walk", status: "correct"}]
    feedback: "walk به شکل فعل یعنی گشت دادن."
  en.a1.unit32.lesson02.exercise04.order_play_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "dog", "likes", "to", "play."], status: "correct"}]
    feedback: "ترتیب درست: My dog likes to play."
  en.a1.unit32.lesson02.exercise05.translate_walk_dog:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «من هر روز سگم را گشت می‌دم.»"
    accepted_answers:
      - {value: "I walk my dog every day.", status: "correct"}
      - {value: "I walk my dog every day", status: "correct"}
    feedback: "I walk my dog every day."

  en.a1.unit32.lesson03.exercise01.comprehension_cat_name:
    instruction: "مطابق گپ، نام پشک میا چیست؟"
    correct_option: "Luna"
    distractors: ["Leila", "Daniel", "Mia"]
    accepted_answers: [{value: "Luna", status: "correct"}]
    feedback: "میا می‌گه Her name is Luna."
  en.a1.unit32.lesson03.exercise02.comprehension_daniel_wants:
    instruction: "مطابق گپ، دنیل چی می‌خواد؟"
    correct_option: "a dog"
    distractors: ["a cat", "a fish", "a bird"]
    accepted_answers: [{value: "a dog", status: "correct"}]
    feedback: "دنیل می‌گه I want a dog."
  en.a1.unit32.lesson03.exercise03.listen_dialogue_toy:
    instruction: "مطابق گپ، لونا دوست داره همرای چی بازی کنه؟"
    correct_option: "ball"
    distractors: ["fish", "dog", "bird"]
    accepted_answers: [{value: "ball", status: "correct"}]
    feedback: "میا می‌گه she loves to play with a ball."
  en.a1.unit32.lesson03.exercise04.respond_own_pet:
    instruction: "بگین که حیوان خانگی دارین یا نی، و کدام نوع."
    accepted_answers: ["I have a dog", "I have a dog.", "I have a cat", "I have a cat.", "I have a fish", "I have a fish.", "I have a bird", "I have a bird.", "I don't have any pets", "I don't have any pets.", "I do not have any pets", "I do not have any pets.", "Yes, I have a dog", "Yes, I have a cat", "Yes, I have a fish", "Yes, I have a bird", "No, I don't", "No, I don't have any pets", "I don't have a pet", "I have a small fish"]
    feedback: "می‌تانین بگین I have a... یا I don't have any pets."

  en.a1.unit32.lesson04.exercise01.reading_max_size:
    instruction: "مطابق متن، مکس چطور استه؟"
    correct_option: "big and very friendly"
    distractors: ["small and shy", "old and quiet", "black and white"]
    accepted_answers: [{value: "big and very friendly", status: "correct"}]
    feedback: "متن می‌گه Max is big and very friendly."
  en.a1.unit32.lesson04.exercise02.reading_who_walks_dog:
    instruction: "مطابق متن، کی هر سحر سگش را گشت می‌ده؟"
    correct_option: "Leila"
    distractors: ["Daniel", "Mia", "both of them"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "متن می‌گه Leila walks him every morning."
  en.a1.unit32.lesson04.exercise03.reading_daniels_pet:
    instruction: "مطابق متن، دنیل کدام حیوان خانگی داره؟"
    correct_option: "a fish"
    distractors: ["a dog", "a cat", "a bird"]
    accepted_answers: [{value: "a fish", status: "correct"}]
    feedback: "متن می‌گه Daniel has a small fish."
  en.a1.unit32.lesson04.exercise04.write_own_pet_sentence:
    instruction: "یک جمله دربارهٔ حیوانی که دارین یا می‌خواین بنویسین، با «I have» یا «I want»."
    accepted_answers: ["I have a dog", "I have a dog.", "I have a cat", "I have a cat.", "I have a fish", "I have a fish.", "I have a bird", "I have a bird.", "I want a dog", "I want a dog.", "I want a cat", "I want a cat.", "I want a fish", "I want a fish.", "I want a bird", "I want a bird.", "I have a small fish", "I have a small dog", "I want a small dog", "I want a pet", "I have a pet"]
    feedback: "می‌تانین از الگوی I have یا I want کار بگیرین."
