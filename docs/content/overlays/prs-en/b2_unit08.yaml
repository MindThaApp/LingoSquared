course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای ترکیب و ارزیابی چند منبع، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit08.synthesis: {title: "منبع‌ها کجا موافق و مخالف استن"}

lessons:
  en.b2.unit08.lesson01_source_relationships: {title: "توافق، تضاد، و پشتوانه"}
  en.b2.unit08.lesson02_linking_sources: {title: "Both sources agree, but..."}
  en.b2.unit08.lesson03.reading_two_sources: {title: "متن خوانی: سروی و گزارش operator"}
  en.b2.unit08.lesson04.the_synthesis_dialogue: {title: "کدام account پشتوانهٔ قوی‌تر داره؟"}

teaching:
  en.b2.unit08.lesson01.teach.source: {title: "source", gloss: "منبع معلومات", note: "*source* چیزی استه که معلومات می‌ته: سروی، گزارش، مقاله، یا مصاحبه.", example_gloss: "یک منبع معلومات فراهم می‌کنه."}
  en.b2.unit08.lesson01.teach.synthesize: {title: "synthesize", gloss: "معلومات چند منبع را یکجا ساختن", note: "*synthesize* فقط خلاصه کدن نیست؛ باید نشان بتین منبع‌ها کجا موافق، کجا مخالف، و کدام قوی‌تر استه.", example_gloss: "synthesize یعنی معلومات منبع‌ها را ترکیب کنین."}
  en.b2.unit08.lesson01.teach.evaluate: {title: "evaluate", gloss: "ارزیابی کدن، قوت چیزی را سنجیدن", note: "*evaluate* یعنی قضاوت کنین کدام دلیل یا منبع قوی‌تر استه و چرا.", example_gloss: "evaluate یعنی قوت یک چیز را بسنجین."}
  en.b2.unit08.lesson01.teach.agreement: {title: "agreement", gloss: "جایی که منبع‌ها یک گپ می‌گن", note: "*agreement* یعنی منبع‌ها روی یک نکته هم‌نظر استن.", example_gloss: "agreement یعنی منبع‌ها همان گپ را می‌گن."}
  en.b2.unit08.lesson01.teach.conflict: {title: "conflict", gloss: "تضاد یا اختلاف بین منبع‌ها", note: "*conflict* یعنی منبع‌ها دربارهٔ یک نکته مخالف استن. در synthesis باید این تضاد را واضح نام ببرین.", example_gloss: "conflict یعنی منبع‌ها موافق نیستن."}
  en.b2.unit08.lesson01.teach.judgement: {title: "judgment", gloss: "قضاوت دلیل‌دار دربارهٔ پشتوانه", note: "*judgment* شکل امریکایی استه؛ شکل بریتانیایی *judgement* هم دیده می‌شه، اما در این درس همین spelling امریکایی را بنویسین.", example_gloss: "judgment توضیح می‌ته کدام منبع قوی‌تر استه."}

  en.b2.unit08.lesson02.teach_agree_conflict: {title: "Both sources agree that demand increased, but they disagree about the cause.", gloss: "هر دو منبع موافق استن که تقاضا زیاد شد، اما دربارهٔ علت اختلاف دارن.", note: "*Both sources agree... but they disagree...* یک جملهٔ synthesis استه: اول agreement، بعد conflict.", media_asset_key: "en.b2.audio.synthesis.sentence.01"}
  en.b2.unit08.lesson02.teach_by_contrast: {title: "By contrast, the operator report includes staffing records.", gloss: "در مقابل، گزارش شرکت بس‌رانی ریکاردهای کارمندان را شامل می‌کنه.", note: "*By contrast* وقتی می‌آیه که دو منبع را مقایسه می‌کنین و تفاوت پشتوانه را نشان می‌تین.", media_asset_key: "en.b2.audio.synthesis.phrase.by_contrast.01"}
  en.b2.unit08.lesson02.teach_better_supported: {title: "The operator report is better supported on the cause.", gloss: "گزارش شرکت بس‌رانی دربارهٔ علت پشتوانهٔ قوی‌تر داره.", note: "*better supported* یعنی دلیل یا مدرک بیشتری پشتش استه، نه این‌که فقط خوش‌خوان‌تر استه."}
  en.b2.unit08.lesson02.teach_grammar_synthesis: {title: "سه بخش synthesis", gloss: "یک synthesis قوی می‌گه منبع‌ها کجا موافق استن، کجا تضاد دارن، و کدام account پشتوانهٔ قوی‌تر داره. در دری ممکن استه فقط خلاصه کنیم؛ در انگلیسی B2 باید رابطهٔ بین منبع‌ها را هم نام ببرین.", note: "از عبارت‌های *both sources agree*، *by contrast*، و *better supported* برای ساختن رابطه استفاده کنین."}

  en.b2.unit08.lesson03.teach_survey: {title: "survey", gloss: "سروی، جمع کدن نظر یا جواب مردم", note: "*survey* می‌تانه نظرهای زیاد جمع کنه، اما همیشه علت را ثابت نمی‌کنه.", example_gloss: "یک سروی می‌تانه نظرهای زیاد جمع کنه."}
  en.b2.unit08.lesson03.teach_account: {title: "account", gloss: "روایت یا توضیح یک رویداد", note: "*account* اینجا یعنی توضیح یک منبع از چی واقع شده، نه حساب بانکی.", example_gloss: "یک account توضیح می‌ته چی واقع شد."}
  en.b2.unit08.lesson03.teach.source_a: {title: "Source A", gloss: "منبع A می‌گه ناوقت شدن بس‌ها بعد از باز شدن شفاخانهٔ جدید بیشتر شد. بسیاری مسافرها می‌گن مسیر حالا شلوغ استه، مخصوصاً صبح. سروی استدلال می‌کنه که علت اصلی تقاضای بیشتر استه.", note: "Source A تجربهٔ مسافرها و demand را برجسته می‌سازه."}
  en.b2.unit08.lesson03.teach.source_b: {title: "Source B", gloss: "منبع B می‌گه گزارش شرکت بس‌رانی قبول داره که تقاضا بعد از باز شدن شفاخانه زیاد شد، اما کمبود راننده‌ها را علت اصلی خدمات ناوقت معرفی می‌کنه. گزارش برای همان دوره ریکاردهای کارمندان را شامل می‌کنه.", note: "Source B روی علت، مدرک اداری یعنی staffing records می‌آره."}

  en.b2.unit08.lesson04.teach.q_survey: {title: "منبع اول تسا", gloss: "تسا می‌گه: دو روایت دربارهٔ خدمات بس ناوقت خواندم. سروی مسافرها می‌گه تقاضا بعد از باز شدن شفاخانهٔ جدید زیاد شد.", note: "او Source A را معرفی می‌کنه.", media_asset_key: "en.b2.audio.dialogue.synthesis.01"}
  en.b2.unit08.lesson04.teach.a_operator: {title: "منبع دوم روان", gloss: "روان می‌گه: گزارش شرکت بس‌رانی موافق استه که تقاضا زیاد شد، اما می‌گه مشکل اصلی کمبود راننده بود.", note: "اینجا هم agreement استه و هم conflict دربارهٔ cause."}
  en.b2.unit08.lesson04.teach.q_agree_conflict: {title: "خلاصهٔ رابطهٔ منبع‌ها", gloss: "تسا می‌گه: پس منبع‌ها روی تقاضای بیشتر موافق استن، اما دربارهٔ علت تضاد دارن.", note: "این جمله دقیقاً کار synthesis را انجام می‌ته."}
  en.b2.unit08.lesson04.teach.a_better_supported: {title: "سوال دربارهٔ پشتوانه", gloss: "روان می‌پرسه: کدام روایت پشتوانهٔ قوی‌تر داره؟", note: "او فقط خلاصه نمی‌خواد؛ ارزیابی می‌خواد."}
  en.b2.unit08.lesson04.teach.q_evidence_compare: {title: "مقایسهٔ evidence", gloss: "تسا می‌گه: سروی نظرهای زیاد مسافرها را داره، اما گزارش شرکت بس‌رانی ریکاردهای کارمندان را شامل می‌کنه.", note: "*but* اینجا کیفیت evidence را مقایسه می‌کنه."}
  en.b2.unit08.lesson04.teach.a_judgement_question: {title: "درخواست judgment", gloss: "روان می‌پرسه: پس قضاوتت؟", note: "یعنی کدام توضیح قوی‌تر استه و چرا؟"}
  en.b2.unit08.lesson04.teach.q_final_judgement: {title: "قضاوت نهایی تسا", gloss: "تسا می‌گه: گزارش شرکت بس‌رانی دربارهٔ علت پشتوانهٔ قوی‌تر داره، اگرچه سروی برای نشان دادن تجربهٔ مسافرها مفید استه.", note: "*although* ارزش منبع ضعیف‌تر را کاملاً رد نمی‌کنه؛ فقط نقش آن را محدود می‌سازه."}

