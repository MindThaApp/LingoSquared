    accepted_answers: [{value: "add the new client to the agenda", status: "correct"}]
    feedback: "میا می‌گه *add the new client to the agenda*."
  en.b1.unit14.lesson04.exercise03.choose_meeting_length_request:
    instruction: "مدیر دربارهٔ طول ملاقات چی می‌پرسه؟"
    correct_option: "keep this meeting under thirty minutes"
    distractors: ["extend this meeting to two hours", "cancel this meeting entirely", "move this meeting to next week"]
    accepted_answers: [{value: "keep this meeting under thirty minutes", status: "correct"}]
    feedback: "مدیر می‌گه *keep this meeting under thirty minutes*."
  en.b1.unit14.lesson04.exercise04.order_keep_thirty_minutes:
    instruction: "کلمات را برای گفتن «آیا می‌تانیم همی ملاقات را زیر سی دقیقه نگه داریم؟» ترتیب کنین."
    accepted_answers: [{value: ["Could", "we", "possibly", "keep", "this", "meeting", "under", "thirty", "minutes"], status: "correct"}]
    feedback: "ترتیب درست: *Could we possibly keep this meeting under thirty minutes*."
  en.b1.unit14.lesson04.exercise05.reply_as_mia:
    instruction: "مدیر می‌گه: فکر خوبیه. آیا می‌تانیم همی ملاقات را زیر سی دقیقه نگه داریم؟ به نقش میا با *I would appreciate it if* جواب بتین: ممنون می‌شین اگه دفعهٔ بعد همه سوال‌ها را از پیش بفرستن."
