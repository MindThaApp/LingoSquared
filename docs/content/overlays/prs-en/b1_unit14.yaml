    instruction: "کدام جمله به شکل مؤدبانه از یک همکار می‌خواد ریپورت را بررسی کنه؟"
    correct_option: "I was wondering if you could review my report today."
    distractors: ["Would it be possible to move the meeting to Thursday?", "Could we possibly start the meeting five minutes later?", "I would appreciate it if you could send the notes soon."]
    accepted_answers: [{value: "I was wondering if you could review my report today.", status: "correct"}]
    feedback: "*I was wondering if you could review my report today* یعنی می‌خواستم بپرسم که آیا می‌تانین ریپورتم را امروز بررسی کنین."
  en.b1.unit14.lesson02.exercise03.order_move_meeting:
    instruction: "کلمات را برای گفتن «آیا امکان داره که ملاقات را به پنج‌شنبه انتقال بتیم؟» ترتیب کنین."
    accepted_answers: [{value: ["Would", "it", "be", "possible", "to", "move", "the", "meeting", "to", "Thursday"], status: "correct"}]
    feedback: "ترتیب درست: *Would it be possible to move the meeting to Thursday*."
  en.b1.unit14.lesson02.exercise04.reply_ask_report_review:
    instruction: "به شکل مؤدبانه از یک همکار بخواین که ریپورت‌تان را امروز بررسی کنه، با 'I was wondering if' شروع کنین."
    accepted_answers:
      - {value: "I was wondering if you could review my report today.", status: "correct"}
      - {value: "I was wondering if you could review my report today", status: "correct"}
    feedback: "*I was wondering if you could review my report today* یعنی می‌خواستم بپرسم که آیا می‌تانین ریپورتم را امروز بررسی کنین."
  en.b1.unit14.lesson02.exercise05.write_move_meeting:
    instruction: "یک درخواست مؤدبانه بنویسین که ملاقات را به پنج‌شنبه انتقال بتین، با 'Would it be possible to' شروع کنین."
    accepted_answers:
      - {value: "Would it be possible to move the meeting to Thursday?", status: "correct"}
      - {value: "Would it be possible to move the meeting to Thursday", status: "correct"}
    feedback: "*Would it be possible to move the meeting to Thursday* یعنی آیا امکان داره که ملاقات را به پنج‌شنبه انتقال بتیم؟"

  en.b1.unit14.lesson03.exercise01.comprehend_add_budget_update:
    instruction: "میا از دانیال می‌خواد با اپدیت بودجه چی کار کنه؟"
