  en.b1.unit14.lesson04.exercise06.speak_professional_dialogue:
    instruction: "مدیر می‌گه: همی یک درخواست معقول استه. قبل از ملاقات بعدی با یک یادآوری پیگیری می‌کنم. به نقش میا آوازی جواب بتین: بگین که اجندای اپدیت‌شده را همی بعد از چاشت می‌فرستین."
    accepted_answers:
      - {value: "I'll send the updated agenda this afternoon.", status: "correct"}
      - {value: "I'll send the updated agenda this afternoon", status: "correct"}
      - {value: "Thank you. I'll send the updated agenda this afternoon.", status: "correct"}
      - {value: "I will send the updated agenda this afternoon.", status: "correct"}
    feedback: "*I'll send the updated agenda this afternoon* یعنی اجندای اپدیت‌شده را همی بعد از چاشت می‌فرستم."
