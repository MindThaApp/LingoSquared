      - {value: "I would appreciate it if everyone sent questions in advance next time", status: "correct"}
      - {value: "I'll do my best. I would appreciate it if everyone sent questions in advance next time.", status: "correct"}
      - {value: "I'd appreciate it if everyone sent questions in advance next time.", status: "correct"}
