    accepted_answers: [{value: ["Could", "we", "possibly", "start", "ten", "minutes", "early"], status: "correct"}]
    feedback: "ترتیب درست: *Could we possibly start ten minutes early*."
  en.b1.unit14.lesson03.exercise05.write_add_budget_update:
    instruction: "یک درخواست مؤدبانه بنویسین که اپدیت بودجه را به اجندا اضافه کنین، با 'Would it be possible to' شروع کنین."
    accepted_answers:
      - {value: "Would it be possible to add the budget update to the agenda?", status: "correct"}
      - {value: "Would it be possible to add the budget update to the agenda", status: "correct"}
    feedback: "*Would it be possible to add the budget update to the agenda* یعنی آیا امکان داره که اپدیت بودجه را به اجندا اضافه کنیم؟"

  en.b1.unit14.lesson04.exercise01.listen_start_budget_update:
    instruction: "گفتگو را گوش کنین و بگین مدیر می‌خواد امروز با چی شروع کنه."
    correct_option: "start with the budget update today"
    distractors: ["start with the new client introduction", "start thirty minutes late", "cancel today's meeting"]
    accepted_answers: [{value: "start with the budget update today", status: "correct"}]
    feedback: "مدیر می‌گه *start with the budget update today*."
  en.b1.unit14.lesson04.exercise02.listen_add_new_client:
