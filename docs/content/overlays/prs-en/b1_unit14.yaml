course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit14.professional_communication: {title: "آیا امکان داره که..."}

lessons:
  en.b1.unit14.lesson01.professional_communication_vocabulary: {title: "درخواست‌های مؤدبانه برای محل کار"}
  en.b1.unit14.lesson02.softened_requests: {title: "آیا امکان داره که ملاقات را انتقال بتیم؟"}
  en.b1.unit14.lesson03.reading_a_message_before_the_meeting: {title: "متن خوانی: پیام قبل از ملاقات"}
  en.b1.unit14.lesson04.the_meeting_dialogue: {title: "آیا می‌تانیم همی ملاقات را کوتاه نگه داریم؟"}

teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to: {title: "would it be possible to", gloss: "آیا امکان داره که...", note: "*would it be possible to* یک درخواست مؤدبانه استه که می‌پرسه آیا یک کار به‌کلی ممکن استه.", example_gloss: "آیا امکان داره که ملاقات را به پنج‌شنبه انتقال بتیم؟"}
  en.b1.unit14.lesson01.teach.i_was_wondering_if: {title: "I was wondering if", gloss: "می‌خواستم بپرسم که...", note: "*I was wondering if* یک درخواست را غیرمستقیم، مثل یک فکری که داشتین، معرفی می‌کنه.", example_gloss: "می‌خواستم بپرسم که آیا می‌تانین ریپورتم را امروز بررسی کنین."}
  en.b1.unit14.lesson01.teach.could_we_possibly: {title: "could we possibly", gloss: "آیا می‌تانیم...", note: "*could we possibly* یک درخواست مؤدبانه برای یک کاری استه که شما و شخص دیگر باهم انجام می‌تین.", example_gloss: "آیا می‌تانیم ملاقات را پنج دقیقه دیرتر شروع کنیم؟"}
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if: {title: "I would appreciate it if", gloss: "ممنون می‌شم اگه...", note: "*I would appreciate it if* می‌گه که اگه کسی یک کاری را انجام بته، ممنون می‌شین.", example_gloss: "ممنون می‌شم اگه یادداشت‌ها را زودتر بفرستین."}
  en.b1.unit14.lesson01.teach.agenda: {title: "agenda", gloss: "اجندا", note: "*agenda* یعنی یک لیست از موضوعات برای بحث در یک ملاقات.", example_gloss: "دانیال یک موضوع دیگه به اجندا اضافه کد."}
  en.b1.unit14.lesson01.teach.follow_up: {title: "follow up", gloss: "پیگیری کدن", note: "*follow up* یعنی بعد از یک ملاقات یا کار دوباره تماس گرفتن.", example_gloss: "میا بعد از ملاقات از طریق ایمیل پیگیری می‌کنه."}

  en.b1.unit14.lesson02.teach.move_meeting_thursday: {title: "Would it be possible to move the meeting to Thursday?", gloss: "آیا امکان داره که ملاقات را به پنج‌شنبه انتقال بتیم؟", note: "*would it be possible to* یک درخواست مؤدبانهٔ رسمی استه."}
  en.b1.unit14.lesson02.teach.review_report_today: {title: "I was wondering if you could review my report today.", gloss: "می‌خواستم بپرسم که آیا می‌تانین ریپورتم را امروز بررسی کنین.", note: "*I was wondering if* یک درخواست را غیرمستقیم معرفی می‌کنه."}
  en.b1.unit14.lesson02.teach.grammar_softened_requests: {title: "قاعدهٔ درخواست‌های نرم‌شده", gloss: "در درخواست‌های رسمی محل کار، یک شکل نرم‌شدهٔ شرطی مثل Would it be possible to... یا I was wondering if... را به‌جای یک فرمان مستقیم استفاده کنین. همی شکل‌ها نسبت به Move the meeting یا Review my report مؤدبانه‌تر آواز می‌ته.", note: "شکل شرطی، درخواست را نرم‌تر می‌سازه، حتی اگه معنایش نزدیک به یک فرمان مستقیم باشه."}

  en.b1.unit14.lesson03.teach.budget_update: {title: "budget update", gloss: "اپدیت بودجه", note: "*budget update* یعنی گزارشی دربارهٔ اینکه پول چطور مصرف می‌شه.", example_gloss: "دانیال اپدیت بودجه را برای ملاقات آماده کد."}
  en.b1.unit14.lesson03.teach.afterward: {title: "afterward", gloss: "بعداً", note: "*afterward* یعنی بعد از یک وقت یا رویداد.", example_gloss: "می‌تانیم یادداشت‌ها را بعداً بررسی کنیم."}
  en.b1.unit14.lesson03.teach.reading_passage: {title: "متن دربارهٔ پیام قبل از ملاقات", gloss: "سلام دانیال، امیدوارم حال‌تان خوب باشه. آیا امکان داره که اپدیت بودجه را به اجندای ملاقات فردا اضافه کنیم؟ ممنون می‌شم اگه آخرین ارقام را باخود بیارین. آیا می‌تانیم ده دقیقه زودتر شروع کنیم تا برای سوال‌ها بعداً وقت داشته باشیم؟ تشکر، میا", note: "همی پیام سه شکل نرم‌شدهٔ درخواست را باهم استفاده می‌کنه."}

  en.b1.unit14.lesson04.teach.q_start_budget_update: {title: "سوال مدیر", gloss: "مدیر می‌گه: صبح بخیر، میا. آیا امکان داره که امروز با اپدیت بودجه شروع کنیم؟", note: "*would it be possible to* اینجه یک درخواست رسمی استه."}
  en.b1.unit14.lesson04.teach.a_add_new_client: {title: "جواب میا", gloss: "میا می‌گه: البته. می‌خواستم بپرسم که آیا می‌تانیم مشتری نو را هم به اجندا اضافه کنیم.", note: "*I was wondering if* یک درخواست غیرمستقیم استه."}
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes: {title: "جواب مدیر", gloss: "مدیر می‌گه: فکر خوبیه. آیا می‌تانیم همی ملاقات را زیر سی دقیقه نگه داریم؟", note: "*could we possibly* یک درخواست مؤدبانهٔ مشترک استه."}
  en.b1.unit14.lesson04.teach.a_questions_in_advance: {title: "جواب میا", gloss: "میا می‌گه: کوشش می‌کنم. ممنون می‌شم اگه دفعهٔ بعد همه سوال‌ها را از پیش بفرستن.", note: "*I would appreciate it if* یک درخواست مؤدبانه استه."}
  en.b1.unit14.lesson04.teach.q_fair_request_followup: {title: "جواب مدیر", gloss: "مدیر می‌گه: همی یک درخواست معقول استه. قبل از ملاقات بعدی با یک یادآوری پیگیری می‌کنم.", note: "*follow up* اینجه یعنی دوباره تماس گرفتن."}
  en.b1.unit14.lesson04.teach.a_send_updated_agenda: {title: "جواب میا", gloss: "میا می‌گه: تشکر. اجندای اپدیت‌شده را همی بعد از چاشت می‌فرستم.", note: "*agenda* اینجه به لیست اپدیت‌شدهٔ موضوعات اشاره می‌کنه."}

exercises:
