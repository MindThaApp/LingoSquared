  en.b1.unit14.lesson03.exercise02.comprehend_bring_numbers:
    instruction: "میا می‌گه ممنون می‌شه اگه چی کار شه؟"
    correct_option: "bring the latest numbers with you"
    distractors: ["arrive early to the meeting", "send the notes afterward", "cancel the meeting"]
    accepted_answers: [{value: "bring the latest numbers with you", status: "correct"}]
    feedback: "متن می‌گه *bring the latest numbers with you*."
  en.b1.unit14.lesson03.exercise03.recognize_budget_update:
    instruction: "کدام عبارت یعنی گزارشی دربارهٔ اینکه پول چطور مصرف می‌شه؟"
    correct_option: "budget update"
    distractors: ["agenda", "follow up", "afterward"]
    accepted_answers: [{value: "budget update", status: "correct"}]
    feedback: "*budget update* یعنی اپدیت بودجه."
  en.b1.unit14.lesson03.exercise04.order_start_ten_minutes_early:
