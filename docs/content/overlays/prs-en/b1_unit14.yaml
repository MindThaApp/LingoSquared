    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "agenda"
    distractors: ["follow up", "would it be possible to", "could we possibly"]
    accepted_answers: [{value: "agenda", status: "correct"}]
    feedback: "*agenda* یعنی اجندا."
  en.b1.unit14.lesson01.exercise02.choose_follow_up:
    instruction: "کدام عبارت یعنی بعد از یک ملاقات یا کار دوباره تماس گرفتن؟"
    correct_option: "follow up"
    distractors: ["agenda", "I was wondering if", "I would appreciate it if"]
    accepted_answers: [{value: "follow up", status: "correct"}]
    feedback: "*follow up* یعنی پیگیری کدن."
  en.b1.unit14.lesson01.exercise03.choose_agenda:
    instruction: "کدام کلمه یعنی یک لیست از موضوعات برای بحث در یک ملاقات؟"
    correct_option: "agenda"
    distractors: ["follow up", "could we possibly", "would it be possible to"]
    accepted_answers: [{value: "agenda", status: "correct"}]
    feedback: "*agenda* یعنی اجندا."
  en.b1.unit14.lesson01.exercise04.match_professional_phrases:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "would it be possible to", right: "آیا امکان داره که..."}
      - {left: "I was wondering if", right: "می‌خواستم بپرسم که..."}
      - {left: "could we possibly", right: "آیا می‌تانیم..."}
      - {left: "I would appreciate it if", right: "ممنون می‌شم اگه..."}
      - {left: "agenda", right: "اجندا"}
      - {left: "follow up", right: "پیگیری کدن"}
    accepted_answers:
      - value:
          - {left: "would it be possible to", right: "آیا امکان داره که..."}
          - {left: "I was wondering if", right: "می‌خواستم بپرسم که..."}
          - {left: "could we possibly", right: "آیا می‌تانیم..."}
          - {left: "I would appreciate it if", right: "ممنون می‌شم اگه..."}
          - {left: "agenda", right: "اجندا"}
          - {left: "follow up", right: "پیگیری کدن"}
        status: "correct"
    feedback: "*would it be possible to*=آیا امکان داره، *I was wondering if*=می‌خواستم بپرسم، *could we possibly*=آیا می‌تانیم، *I would appreciate it if*=ممنون می‌شم اگه، *agenda*=اجندا، *follow up*=پیگیری کدن."
  en.b1.unit14.lesson01.exercise05.write_agenda:
    instruction: "کلمه‌ای را که یعنی یک لیست از موضوعات برای بحث در یک ملاقات بنویسین."
    accepted_answers:
      - {value: "agenda", status: "correct"}
      - {value: "Agenda", status: "correct"}
    feedback: "*agenda* یعنی اجندا."

  en.b1.unit14.lesson02.exercise01.choose_move_meeting:
    instruction: "کدام جمله به شکل مؤدبانه می‌پرسه که روز ملاقات تغییر کنه؟"
    correct_option: "Would it be possible to move the meeting to Thursday?"
    distractors: ["I was wondering if you could review my report today.", "Could we possibly keep this meeting under thirty minutes?", "I would appreciate it if you could send the notes soon."]
    accepted_answers: [{value: "Would it be possible to move the meeting to Thursday?", status: "correct"}]
    feedback: "*Would it be possible to move the meeting to Thursday* یعنی آیا امکان داره که ملاقات را به پنج‌شنبه انتقال بتیم؟"
