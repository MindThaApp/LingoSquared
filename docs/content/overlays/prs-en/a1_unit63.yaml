  en.a1.unit63.lesson01.help_words: {title: "کلمات کمک"}
  en.a1.unit63.lesson02.help_phrases: {title: "عبارات برای کمک خواستن"}
  en.a1.unit63.lesson03.dialogue_helping_with_a_bag: {title: "گفتگو: کمک با یک بکس"}
  en.a1.unit63.lesson04.a_helpful_neighbor: {title: "متن: همسایهٔ کمک‌کننده"}

teaching:
  en.a1.unit63.lesson01.teach.help: {title: "help", gloss: "کمک", note: "help یعنی کمک کردن یا کمک.", example_gloss: "می‌تانین به من کمک کنین؟"}
  en.a1.unit63.lesson01.teach.carry: {title: "carry", gloss: "بردن / حمل کردن", note: "carry یعنی چیزی را گرفته و از یک جا به جای دیگر بردن.", example_gloss: "می‌تانم آن را ببرم."}
  en.a1.unit63.lesson01.teach.heavy: {title: "heavy", gloss: "سنگین", note: "heavy یعنی چیزی که بلند کردنش سخت استه.", example_gloss: "این سنگین استه."}
  en.a1.unit63.lesson01.teach.bag: {title: "bag", gloss: "بکس", note: "bag یعنی بکس یا خریطه برای گذاشتن چیزها.", example_gloss: "این بکس سنگین استه."}
  en.a1.unit63.lesson01.teach.door: {title: "door", gloss: "دروازه", note: "door یعنی دروازهٔ اتاق یا خانه.", example_gloss: "دروازه را باز کنین."}
  en.a1.unit63.lesson01.teach.shelf: {title: "shelf", gloss: "رف", note: "shelf یعنی جای صاف روی دیوار یا در الماری که چیزها روی آن گذاشته می‌شه.", example_gloss: "آن را روی رف بگذارین."}

  en.a1.unit63.lesson02.teach.can_you_help: {title: "Can you help me?", gloss: "می‌تانین به من کمک کنین؟", note: "Can you ...? یک خواهش مؤدبانه استه."}
  en.a1.unit63.lesson02.teach.bag_heavy: {title: "This bag is heavy.", gloss: "این بکس سنگین استه.", note: "با این جمله مشکل را توضیح می‌تین."}
  en.a1.unit63.lesson02.teach.open_door: {title: "Could you open the door?", gloss: "می‌شه دروازه را باز کنین؟", note: "Could you ...? از Can you ... کمی نرم‌تر و مؤدبانه‌تر استه."}
  en.a1.unit63.lesson02.teach.i_can_help: {title: "I can help.", gloss: "می‌تانم کمک کنم.", note: "این جمله برای پیشنهاد کمک کار می‌ره."}
  en.a1.unit63.lesson02.teach.thank_you_help: {title: "Thank you for your help.", gloss: "تشکر بابت کمک‌تان.", note: "Thank you for ... برای تشکر از یک کار یا کمک کار می‌ره."}
  en.a1.unit63.lesson02.teach.put_on_shelf: {title: "Put it on the shelf.", gloss: "آن را روی رف بگذارین.", note: "put it on ... یعنی آن را روی چیزی گذاشتن."}

  en.a1.unit63.lesson03.teach.dialogue_line1: {title: "خواهش لیلا", gloss: "سلام دانیال. می‌تانین به من کمک کنین؟", note: "Leila مستقیم و مؤدبانه کمک می‌خواد."}
  en.a1.unit63.lesson03.teach.dialogue_line2: {title: "جواب دانیال", gloss: "البته. به چی ضرورت دارین؟", note: "What do you need? یعنی چه لازم دارین؟"}
  en.a1.unit63.lesson03.teach.dialogue_line3: {title: "توضیح لیلا", gloss: "این بکس سنگین استه.", note: "این جمله علت کمک خواستن را می‌گه."}
  en.a1.unit63.lesson03.teach.dialogue_line4: {title: "پیشنهاد دانیال", gloss: "می‌تانم آن را ببرم.", note: "I can carry it یعنی می‌تانم آن را حمل کنم."}
  en.a1.unit63.lesson03.teach.dialogue_line5: {title: "خواهش دوم لیلا", gloss: "می‌شه دروازه را هم باز کنین؟", note: "too یعنی هم -- لیلا یک کمک دیگر هم می‌خواد."}
  en.a1.unit63.lesson03.teach.dialogue_line6: {title: "سوال دانیال", gloss: "بلی. بکس را روی رف بگذارم؟", note: "Put the bag on the shelf? اینجا به شکل سوالی برای تایید گفته شده."}
  en.a1.unit63.lesson03.teach.dialogue_line7: {title: "تشکر لیلا", gloss: "بلی، لطفاً. تشکر بابت کمک‌تان.", note: "Thank you for your help جملهٔ کامل تشکر استه."}
  en.a1.unit63.lesson03.teach.dialogue_line8: {title: "جواب دانیال", gloss: "مشکلی نیست.", note: "No problem جواب طبیعی به تشکر یا معذرت استه."}

  en.a1.unit63.lesson04.teach.help_note: {title: "یادداشت کمک", gloss: "یادداشت کمک: بکس آبی سنگین استه. لطفاً آن را روی رف نزدیک دروازه بگذارین.", note: "این یادداشت می‌گه کدام بکس استه و کجا باید گذاشته شه."}
  en.a1.unit63.lesson04.teach.reading_passage: {title: "متن: همسایهٔ کمک‌کننده", gloss: "همسایهٔ کمک‌کننده: لیلا یک بکس آبی سنگین داشت. او دانیال را نزدیک دروازه دید و کمک خواست. دانیال بکس را به داخل برد. لیلا از او خواست دروازه را هم باز کنه. بعد دانیال بکس را روی رف نزدیک دروازه گذاشت. لیلا از دانیال بابت کمکش تشکر کرد. دانیال گفت: مشکلی نیست. بعداً، لیلا یک یادداشت کوتاه نوشت: بکس آبی روی رف استه.", note: "این متن کمک خواستن، حمل کردن یک بکس، و گذاشتن آن روی رف را تمرین می‌کنه."}

exercises:
  en.a1.unit63.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "heavy"
    distractors: ["small", "empty", "ready", "open"]
    accepted_answers: [{value: "heavy", status: "correct"}]
    feedback: "heavy یعنی سنگین."
  en.a1.unit63.lesson01.exercise02.choose_shelf_meaning:
    instruction: "کدام کلمه یعنی جای صاف روی دیوار یا در الماری که چیزها روی آن می‌مانه؟"
    correct_option: "shelf"
    distractors: ["door", "bag", "floor"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "shelf یعنی رف."
  en.a1.unit63.lesson01.exercise03.match_help_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "help", right: "انجام‌دادن کار مفید برای کسی"}
      - {left: "carry", right: "گرفتن و جابه‌جاکردن چیزی"}
      - {left: "heavy", right: "چیزی که بلندکردنش دشوار استه"}
      - {left: "bag", right: "چیزی که وسایل را در آن نگه می‌دارین"}
      - {left: "door", right: "بخشی از اتاق که برای داخل‌شدن باز می‌کنین"}
      - {left: "shelf", right: "جای همواری که چیزها روی آن می‌مانن"}
    accepted_answers:
      - value:
          - {left: "help", right: "انجام‌دادن کار مفید برای کسی"}
          - {left: "carry", right: "گرفتن و جابه‌جاکردن چیزی"}
          - {left: "heavy", right: "چیزی که بلندکردنش دشوار استه"}
          - {left: "bag", right: "چیزی که وسایل را در آن نگه می‌دارین"}
          - {left: "door", right: "بخشی از اتاق که برای داخل‌شدن باز می‌کنین"}
          - {left: "shelf", right: "جای همواری که چیزها روی آن می‌مانن"}
        status: "correct"
    feedback: "help=کمک، carry=بردن، heavy=سنگین، bag=بکس، door=دروازه، shelf=رف."
  en.a1.unit63.lesson01.exercise04.order_heavy_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "bag", "is", "heavy."], status: "correct"}]
    feedback: "ترتیب درست: This bag is heavy."
  en.a1.unit63.lesson01.exercise05.write_carry:
    instruction: "کلمه‌ای را بنویسین که یعنی چیزی را گرفته و حرکت دادن."
    accepted_answers: [{value: "carry", status: "correct"}]
    feedback: "carry یعنی بردن یا حمل کردن."

