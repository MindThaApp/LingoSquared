  en.a1.unit63.lesson04.exercise01.note_bag_color:
    instruction: "مطابق یادداشت، بکس چه رنگ استه؟"
    correct_option: "blue"
    distractors: ["red", "green", "black"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "بکس آبی استه."
  en.a1.unit63.lesson04.exercise02.note_bag_place:
    instruction: "مطابق یادداشت، بکس باید کجا گذاشته شه؟"
    correct_option: "shelf"
    distractors: ["door", "floor", "table"]
    accepted_answers: [{value: "shelf", status: "correct"}]
