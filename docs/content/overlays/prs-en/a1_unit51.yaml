generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific pharmacy-purchase phrase source material (DLI Dari Basic Course) -- the course's health-related lessons (already used for unit22) cover symptom description in general terms but no dedicated over-the-counter-pharmacy-purchase scene surfaced in the sections checked. No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit51 (pharmacy), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit51.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit51.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: medicine -> دوا (the standard Dari/Afghan term, as opposed to Iranian Persian's دارو); pharmacist -> دواساز (built on the same دوا root, as opposed to Iranian Persian's داروساز); the rest of the vocabulary (شربت سرفه/cough syrup, قرص/tablet, گلو درد/sore throat) is shared between the two dialects and used as-is; runny nose -> آبریزش بینی, a transparent descriptive phrase used the same way in both dialects. Colloquial Dari verb endings/register used throughout (استه for است, می‌تانم for می‌توانم, بخورین as the informal plural imperative for 'take [medicine]', بیا بگیر as the informal 'here you go' handing-over phrase). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's modal 'should' used for a soft recommendation (cough syrup that should help) carries a gentler, less-certain suggestion nuance than Dari's باید, whose core meaning leans toward stronger obligation ('must') -- a Dari speaker must calibrate that English 'should' here is advisory, not a command, something a literal باید translation would overstate; (2) English's fixed time-phrase 'before bed' uses 'bed' (the physical object) metonymically for bedtime/sleep, while Dari expresses the identical meaning with پیش از خواب ('before sleep'), built on the verb/noun for the act of sleeping rather than the furniture -- a Dari speaker must remember English substitutes the object for the act here. Three-speaker dialogue (Pharmacist, Leila, Daniel) handled the same way as unit48/unit50's precedent. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: lesson03.exercise02's dosage question (correct_option 'every four hours', from the Pharmacist's tablet-dosage line) uses invented distractors ('twice a day', 'once a week') rather than 'before bed' (a real fact stated elsewhere in the same dialogue by the same speaker, for the cough syrup's different dosage) -- exactly the trap the realization flagged. The price question (lesson03.exercise03/lesson04.exercise01, correct_option 'nine dollars') has no competing price value anywhere in this dialogue, so ordinary invented distractors were used with no special same-speaker risk. Multi-clause accepted_answers (lesson04's write_own_pharmacy_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit51.pharmacy: {title: "خریدن دوا از دواخانه"}

lessons:
  en.a1.unit51.lesson01.pharmacy_vocabulary: {title: "کلمات دواخانه"}
  en.a1.unit51.lesson02.phrases_at_the_pharmacy: {title: "عبارات در دواخانه"}
  en.a1.unit51.lesson03.dialogue_at_the_pharmacy: {title: "گفتگو: توی دواخانه"}
  en.a1.unit51.lesson04.a_trip_to_the_pharmacy: {title: "متن: یک سفر به دواخانه"}

teaching:
  en.a1.unit51.lesson01.teach.pharmacist: {title: "pharmacist", gloss: "دواساز", note: "pharmacist یعنی دواساز -- کسی که به تان کمک می‌کنه دوای درست را در یک دواخانه پیدا کنین.", example_gloss: "دواساز خیلی کمک‌کننده استه."}
  en.a1.unit51.lesson01.teach.medicine: {title: "medicine", gloss: "دوا", note: "medicine یعنی دوا -- در دری کلمهٔ «دوا» کار می‌ره، نی «دارو» که در فارسی ایران رایج استه.", example_gloss: "به دوا برای سرفه‌ام ضرورت دارم."}
  en.a1.unit51.lesson01.teach.cough_syrup: {title: "cough syrup", gloss: "شربت سرفه", note: "cough syrup یعنی شربت سرفه -- یک دوای مایع که برای سرفه می‌خورین.", example_gloss: "این شربت سرفه خوب کار می‌کنه."}
  en.a1.unit51.lesson01.teach.tablet: {title: "tablet", gloss: "قرص", note: "tablet یعنی قرص.", example_gloss: "یک قرص را با آب بخور."}
  en.a1.unit51.lesson01.teach.runny_nose: {title: "runny nose", gloss: "آبریزش بینی", note: "runny nose یعنی آبریزش بینی -- وختی که آب از بینی تان می‌آیه.", example_gloss: "امروز آبریزش بینی دارم."}
  en.a1.unit51.lesson01.teach.sore_throat: {title: "sore throat", gloss: "گلو درد", note: "sore throat یعنی گلو درد -- دردی در گلو، اکثر وخت‌ها وختی که مریض استین.", example_gloss: "گلو درد هم دارم."}

  en.a1.unit51.lesson02.teach.can_i_help_you: {title: "Can I help you?", gloss: "می‌تانم کمک تان کنم؟", note: "Can I ...? یک طریقهٔ معمول برای پیشنهاد کمک استه."}
  en.a1.unit51.lesson02.teach.i_have_a_bad_cough_and_a_runny_nose: {title: "I have a bad cough and a runny nose.", gloss: "یک سرفهٔ بد و آبریزش بینی دارم.", note: "bad اینجه یعنی شدید -- برای تشدید یک علامت کار می‌ره."}
  en.a1.unit51.lesson02.teach.do_you_have_something_for_a_sore_throat: {title: "Do you have something for a sore throat?", gloss: "چیزی برای گلو درد دارین؟", note: "something for ___ یعنی «چیزی برای ___» -- برای خواستن یک دوا برای یک علامت مشخص کار می‌ره."}
  en.a1.unit51.lesson02.teach.take_one_tablet_every_four_hours: {title: "Take one tablet every four hours.", gloss: "هر چهار ساعت یک قرص بخورین.", note: "every + مدت زمان یعنی «هر ___» -- برای گفتن دفعات کار می‌ره."}
  en.a1.unit51.lesson02.teach.how_much_is_that: {title: "How much is that?", gloss: "این چند استه؟", note: "How much is ...? یک سوال معمول برای پرسیدن قیمت استه."}
  en.a1.unit51.lesson02.teach.thats_nine_dollars: {title: "That's nine dollars.", gloss: "این نو دالر استه.", note: "That's یعنی That is کوتاه شده."}

  en.a1.unit51.lesson03.teach.dialogue_line1: {title: "سلام دواساز", gloss: "سلام، می‌تانم کمک تان کنم؟", note: "همو سوال Can I help you؟ که در لسن ۲ یاد گرفتین."}
  en.a1.unit51.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "بلی، یک سرفهٔ بد و آبریزش بینی دارم.", note: "I have a bad cough and a runny nose یعنی دو علامت را با and وصل می‌کنه."}
  en.a1.unit51.lesson03.teach.dialogue_line3: {title: "پیشنهاد دواساز", gloss: "یک شربت سرفه دارم که باید کمک کنه. پیش از خواب بخورینش.", note: "should اینجه یک پیشنهاد ملایم استه، نی یک امر قطعی -- دری باید معمولاً معنای الزام قوی‌تر داره، پس should نرم‌تر استه. before bed یعنی پیش از خواب -- انگلیسی از کلمهٔ bed (بستر) کار می‌گیره، دری از خودِ فعل خوابیدن."}
  en.a1.unit51.lesson03.teach.dialogue_line4: {title: "سوال دانیال", gloss: "چیزی برای گلو درد هم دارین؟", note: "too در آخر جمله یعنی «هم»."}
  en.a1.unit51.lesson03.teach.dialogue_line5: {title: "جواب دواساز", gloss: "بلی، این قرص‌ها برای گلو درد خوب استن. هر چهار ساعت یکی بخورین.", note: "are good for ___ یعنی «برای ___ خوب استن»."}
  en.a1.unit51.lesson03.teach.dialogue_line6: {title: "گپ لیلا", gloss: "خوب استه، هردو را می‌گیرم. این چند استه؟", note: "I'll take both یعنی هردو را می‌گیرم."}
  en.a1.unit51.lesson03.teach.dialogue_line7: {title: "جواب دواساز", gloss: "این نو دالر استه.", note: "همو جملهٔ That's nine dollars که در لسن ۲ یاد گرفتین."}
  en.a1.unit51.lesson03.teach.dialogue_line8: {title: "جواب دانیال", gloss: "بیا بگیر. تشکر!", note: "Here you go یک عبارت محاوره‌ای وخت دادن پول یا یک چیز به کسی استه."}

  en.a1.unit51.lesson04.teach.reading_passage: {title: "متن: یک سفر به دواخانه", gloss: "یک سفر به دواخانه: چند روز بعد از سفر شان به کوهستان، لیلا سرما خورد. یک سرفهٔ بد و آبریزش بینی داشت، و گلویش هم درد می‌کرد. دانیال همرایش تا دواخانهٔ نزدیک آپارتمانش پیاده رفت. دواساز به علامت‌های لیلا گوش داد و شربت سرفه و قرص پیشنهاد کرد. او گفت که شربت سرفه را پیش از خواب و یک قرص را هر چهار ساعت بخوره. لیلا نو دالر برای هردو پرداخت کرد. در راه خانه، دانیال یک بکس دستمال کاغذی هم برایش خرید. لیلا آن شب دوا را خورد، و تا آخر هفته، سرفه‌اش خیلی بهتر شد.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- caught, had, felt, walked, listened, recommended, said, paid, bought, took, was."}

exercises:
  en.a1.unit51.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "tablet"
    distractors: ["pharmacist", "medicine", "cough syrup", "runny nose"]
    accepted_answers: [{value: "tablet", status: "correct"}]
    feedback: "tablet یعنی قرص."
  en.a1.unit51.lesson01.exercise02.choose_pharmacist_meaning:
    instruction: "کدام کلمه یعنی کسی که به تان کمک می‌کنه دوای درست را در یک دواخانه پیدا کنین؟"
    correct_option: "pharmacist"
    distractors: ["medicine", "tablet", "cough syrup"]
    accepted_answers: [{value: "pharmacist", status: "correct"}]
    feedback: "pharmacist یعنی دواساز."
  en.a1.unit51.lesson01.exercise03.match_pharmacy_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{value: [{left: "کسی که به تان کمک می‌کنه دوای درست را در یک دواخانه پیدا کنین", right: "pharmacist"}, {left: "چیزی که می‌خورین تا وختی مریض استین بهتر شین", right: "medicine"}, {left: "یک دوای مایع که برای سرفه می‌خورین", right: "cough syrup"}, {left: "یک پارچهٔ کوچک و جامد دوا که می‌خورین", right: "tablet"}, {left: "وختی که آب از بینی تان می‌آیه", right: "runny nose"}, {left: "درد در گلو، اکثر وخت‌ها وختی که مریض استین", right: "sore throat"}], status: "correct"}]
    feedback: "pharmacist=دواساز، medicine=دوا، cough syrup=شربت سرفه، tablet=قرص، runny nose=آبریزش بینی، sore throat=گلو درد."
  en.a1.unit51.lesson01.exercise04.order_medicine_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "medicine", "for", "my", "cough."], status: "correct"}]
    feedback: "ترتیب درست: I need medicine for my cough."
  en.a1.unit51.lesson01.exercise05.write_pharmacist:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که به تان کمک می‌کنه دوای درست را پیدا کنین."
    accepted_answers: [{value: "pharmacist", status: "correct"}]
    feedback: "pharmacist یعنی دواساز."

  en.a1.unit51.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Do you have something for a sore throat?"
    distractors: ["Can I help you?", "How much is that?", "That's nine dollars."]
    accepted_answers: [{value: "Do you have something for a sore throat?", status: "correct"}]
    feedback: "Do you have something for a sore throat? یعنی چیزی برای گلو درد دارین؟"
  en.a1.unit51.lesson02.exercise02.choose_greeting_meaning:
    instruction: "کدام عبارت را دواساز برای احوال‌پرسی از یک مشتری می‌گه؟"
    correct_option: "Can I help you?"
    distractors: ["How much is that?", "That's nine dollars.", "Take one tablet every four hours."]
    accepted_answers: [{value: "Can I help you?", status: "correct"}]
    feedback: "Can I help you? یعنی می‌تانم کمک تان کنم؟"
  en.a1.unit51.lesson02.exercise03.choose_dosage_meaning:
    instruction: "کدام عبارت به تان می‌گه که قرص‌ها را چند بار بخورین؟"
    correct_option: "Take one tablet every four hours."
    distractors: ["Can I help you?", "How much is that?", "Do you have something for a sore throat?"]
    accepted_answers: [{value: "Take one tablet every four hours.", status: "correct"}]
    feedback: "Take one tablet every four hours. یعنی هر چهار ساعت یک قرص بخورین."
  en.a1.unit51.lesson02.exercise04.order_how_much_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["How", "much", "is", "that?"], status: "correct"}]
    feedback: "ترتیب درست: How much is that?"
  en.a1.unit51.lesson02.exercise05.translate_price:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «این نو دالر استه.»"
    accepted_answers:
      - {value: "That's nine dollars.", status: "correct"}
      - {value: "That's nine dollars", status: "correct"}
    feedback: "That's nine dollars. یعنی این نو دالر استه."

  en.a1.unit51.lesson03.exercise01.comprehension_leila_symptoms:
    instruction: "مطابق گفتگو، لیلا چه علامت‌هایی داره؟"
    correct_option: "a cough and a runny nose"
    distractors: ["a headache and a fever", "a stomachache", "a sore throat and a fever"]
    accepted_answers: [{value: "a cough and a runny nose", status: "correct"}]
    feedback: "لیلا سرفه و آبریزش بینی (a cough and a runny nose) داره."
  en.a1.unit51.lesson03.exercise02.comprehension_tablet_dosage:
    instruction: "مطابق گفتگو، لیلا باید قرص‌ها را چند بار بخوره؟"
    correct_option: "every four hours"
    distractors: ["twice a day", "once a week", "every morning"]
    accepted_answers: [{value: "every four hours", status: "correct"}]
    feedback: "لیلا باید هر چهار ساعت (every four hours) یک قرص بخوره."
  en.a1.unit51.lesson03.exercise03.listen_dialogue_price:
    instruction: "مطابق گفتگو، دوا چند دالر استه؟"
    correct_option: "nine dollars"
    distractors: ["five dollars", "twelve dollars", "six dollars"]
    accepted_answers: [{value: "nine dollars", status: "correct"}]
    feedback: "دوا نو دالر (nine dollars) استه."
  en.a1.unit51.lesson03.exercise04.respond_own_pharmacy_statement:
    instruction: "بگین لیلا چه علامت‌هایی داره، یا بگین دوا چند دالر استه."
    accepted_answers: ["I have a bad cough and a runny nose", "I have a bad cough and a runny nose.", "Take one every four hours", "Take one every four hours.", "That's nine dollars", "That's nine dollars.", "Do you have something for a sore throat", "Do you have something for a sore throat?"]
    feedback: "می‌تانین بگین I have a bad cough and a runny nose یا That's nine dollars."

  en.a1.unit51.lesson04.exercise01.reading_price:
    instruction: "مطابق متن، لیلا برای دوا چند دالر پرداخت کرد؟"
    correct_option: "nine dollars"
    distractors: ["five dollars", "twelve dollars", "six dollars"]
    accepted_answers: [{value: "nine dollars", status: "correct"}]
    feedback: "لیلا نو دالر (nine dollars) پرداخت کرد."
  en.a1.unit51.lesson04.exercise02.reading_syrup_dosage:
    instruction: "مطابق متن، لیلا کی باید شربت سرفه را بخوره؟"
    correct_option: "before bed"
    distractors: ["every morning", "with breakfast", "every four hours"]
    accepted_answers: [{value: "before bed", status: "correct"}]
    feedback: "لیلا باید شربت سرفه را پیش از خواب (before bed) بخوره."
  en.a1.unit51.lesson04.exercise03.reading_what_daniel_bought:
    instruction: "مطابق متن، دانیال در راه خانه چه چیزی برای لیلا خرید؟"
    correct_option: "tissues"
    distractors: ["cough syrup", "water", "a book"]
    accepted_answers: [{value: "tissues", status: "correct"}]
    feedback: "دانیال یک بکس دستمال کاغذی (tissues) خرید."
  en.a1.unit51.lesson04.exercise04.write_own_pharmacy_message:
    instruction: "یک پیام کوتاه بنویسین: بگین لیلا چه علامت‌هایی داشت، و بگین چند دالر پرداخت کرد."
    accepted_answers:
      - {value: "She had a cough and a runny nose. She paid nine dollars.", status: "correct"}
      - {value: "She had a cough and a runny nose, and she paid nine dollars.", status: "correct"}
      - {value: "She had a cough and a runny nose, she paid nine dollars.", status: "correct"}
    feedback: "می‌تانین بگین: She had a cough and a runny nose. She paid nine dollars."
