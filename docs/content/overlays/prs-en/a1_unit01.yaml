  en.a1.unit01.lesson03.wellbeing: {title: "پرسیدن و گفتن حال"}
  en.a1.unit01.lesson05.noun_phrases_and_closings: {title: "پایان دوستانهٔ گفت‌وگو"}

teaching:
  en.a1.unit01.lesson01.teach.hello: {title: "سلام", gloss: "سلام", note: "Hello برای آغاز گفت‌وگو در موقعیت‌های رسمی و غیررسمی مناسب استه.", example_gloss: "سلام، دنیل!"}
  en.a1.unit01.lesson01.teach.hi: {title: "سلام خودمانی", gloss: "سلام", note: "Hi بیشتر در دیدارهای دوستانه و عادی شنیده می‌شه.", example_gloss: "سلام، لیلا!"}
  en.a1.unit01.lesson01.teach.good_morning: {title: "صبح بخیر", gloss: "صبح بخیر", note: "Good morning سلامی وابسته به وخت استه و در وخت صبح گفته می‌شه."}
  en.a1.unit01.lesson01.teach.good_afternoon: {title: "بعد از چاشت بخیر", gloss: "بعد از چاشت بخیر", note: "Good afternoon را از چاشت تا اواخر بعد از چاشت برای سلام‌کردن استفاده می‌کنن."}
  en.a1.unit01.lesson01.teach.good_evening: {title: "شام بخیر", gloss: "شام بخیر", note: "وخت دیدار در شام می‌تانین Good evening بگویین. Good night معمولاً وخت رفتن یا پیش از خواب گفته می‌شه."}
  en.a1.unit01.lesson01.teach.goodbye: {title: "خداحافظ", gloss: "خداحافظ", note: "Goodbye پایان گفت‌وگو را روشن می‌سازه و در بیشتر موقعیت‌ها مناسب استه.", example_gloss: "خداحافظ، فردا می‌بینمتان!"}
  en.a1.unit01.lesson01.teach.bye: {title: "خداحافظی کوتاه", gloss: "خداحافظ", note: "Bye راه کوتاه و دوستانه‌ای برای پایان‌دادن به گفت‌وگو استه.", example_gloss: "خداحافظ، به‌زودی می‌بینمتان!"}

  en.a1.unit01.lesson03.teach.how_are_you: {title: "شما چطور استین؟", gloss: "شما چطور استین؟", note: "How are you? سوالی رایج برای پرسیدن حال طرف مقابل استه."}
  en.a1.unit01.lesson03.teach.im_fine: {title: "خوب استم، تشکر", gloss: "خوب استم، تشکر", note: "I'm fine, thanks جوابی مؤدبانه و عادی استه."}
  en.a1.unit01.lesson03.teach.im_good: {title: "خوب استم، تشکر", gloss: "خوب استم، تشکر", note: "I'm good در گفتار روزمرهٔ انگلیسی امریکایی بسیار معمول استه."}
  en.a1.unit01.lesson03.teach.not_bad: {title: "بد نیستم، تشکر", gloss: "بد نیستم، تشکر", note: "Not bad جواب کوتاهی استه که معمولاً معنای مثبت داره."}
  en.a1.unit01.lesson03.teach.and_you: {title: "و شما؟", gloss: "و شما؟", note: "And you? همو سوال را کوتاه به طرف مقابل برمی‌گردانه."}
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: "خوب استین؟"
    gloss: "خوب استین؟"
    note: "شکل معمول سوال بلی/نخیر Are you okay? استه. You are okay? هم ممکن استه در گفتار به‌صورت سوالِ تأییدی یا واکنشِ متعجبانه شنیده شه."

  en.a1.unit01.lesson05.teach.nice_to_meet_you: {title: "از آشنایی با شما خوش شدم", gloss: "از آشنایی با شما خوش شدم", note: "Nice to meet you وخت اولین آشنایی گفته می‌شه."}
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too: {title: "من هم از آشنایی با شما خوش شدم", gloss: "من هم همین‌طور", note: "با علاوه کردن too می‌گین که شما هم از آشنایی خوش شدین."}
  en.a1.unit01.lesson05.teach.see_you_later: {title: "بعداً می‌بینمتان", gloss: "بعداً می‌بینمتان", note: "See you later خداحافظی دوستانه استه و حتماً وخت دیدار بعدی را مشخص نمی‌کنه."}
  en.a1.unit01.lesson05.teach.have_a_good_day: {title: "روز خوبی داشته باشین", gloss: "روز خوبی داشته باشین", note: "Have a good day آرزویی رایج برای پایان دوستانهٔ گفت‌وگو استه."}

exercises:
  en.a1.unit01.lesson01.exercise01.listen_hello:
    instruction: "صدا را بشنوین و گزینه‌ای را انتخاب کنین که معنای عبارت را می‌رسانه."
    correct_option: "سلام"
    distractors: ["خداحافظ", "تشکر", "صبح بخیر"]
    accepted_answers: [{value: "سلام", status: "correct"}]
    feedback: "Hello برای سلام‌کردن استه."
  en.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: "سلام کوتاه و دوستانه را انتخاب کنین."
    correct_option: "Hi"
    distractors: ["Goodbye", "Good evening", "Bye"]
    accepted_answers: [{value: "Hi", status: "correct"}]
    feedback: "Hi یک سلام کوتاه و خودمانی استه."
  en.a1.unit01.lesson01.exercise04.order_afternoon:
    instruction: "دو کلمه را طوری بچینین که سلام بعد از چاشت ساخته شه."
    accepted_answers: [{value: ["Good", "afternoon"], status: "correct"}]
    feedback: "ترتیب درست Good afternoon استه."
  en.a1.unit01.lesson01.exercise06.goodbye_meaning:
    instruction: "معنای Goodbye را از میان گزینه‌ها انتخاب کنین."
    correct_option: "خداحافظ"
    distractors: ["سلام", "خوش آمدین", "شما چطور استین؟"]
    accepted_answers: [{value: "خداحافظ", status: "correct"}]
    feedback: "Goodbye وخت خداحافظی گفته می‌شه."
  en.a1.unit01.lesson01.exercise07.listen_order:
    instruction: "کلمه‌های عبارت شنیده‌شده را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Good", "afternoon"], status: "correct"}]
    feedback: "ترتیب شنیده‌شده Good و بعد afternoon استه."
  en.a1.unit01.lesson01.exercise03.listen_morning:
    instruction: "صدا را بشنوین و همو سلام انگلیسی را بنویسین."
    accepted_answers:
      - {value: "Good morning", status: "correct"}
      - {value: "good morning", status: "correct"}
      - {value: "Good morning.", status: "correct"}
    feedback: "گوینده Good morning می‌گه."
  en.a1.unit01.lesson01.exercise08.speak_bye:
    instruction: "فرض کنین می‌خواهین به‌گونهٔ دوستانه خداحافظی کنین؛ یک عبارت کوتاه بگویین."
    accepted_answers:
      - {value: "Bye", status: "correct"}
      - {value: "Goodbye", status: "correct"}
    feedback: "Bye و Goodbye هر دو خداحافظی درست استند."

  en.a1.unit01.lesson03.exercise01.listen_question:
    instruction: "سوال را بشنوین و معلوم کنین گوینده چه چیزی را می‌خواهد بدانه."
    correct_option: "حال طرف مقابل"
    distractors: ["نام طرف مقابل", "محل زندگی طرف مقابل", "وظیفهٔ طرف مقابل"]
    accepted_answers: [{value: "حال طرف مقابل", status: "correct"}]
    feedback: "How are you? دربارهٔ حال طرف مقابل می‌پرسه."
  en.a1.unit01.lesson03.exercise05.return_question:
    instruction: "جای خالی را با عبارتی پُر کنین که همو سوال را از طرف مقابل بپرسه."
    correct_option: "And you?"
    distractors: ["You and?", "Are you?", "And are?"]
    accepted_answers: [{value: "And you?", status: "correct"}]
    feedback: "And you? همو سوال را کوتاه به طرف مقابل برمی‌گردانه."
  en.a1.unit01.lesson03.exercise02.order_question:
    instruction: "سه کلمه را به ترتیب یک سوال درست انگلیسی بچینین."
    accepted_answers: [{value: ["How", "are", "you"], status: "correct"}]
    feedback: "ترتیب معمول How are you? استه."
  en.a1.unit01.lesson03.exercise06.be_question_order:
    instruction: "از میان گزینه‌ها شکل معمول و معیار سوال بلی/نخیر را انتخاب کنین."
    correct_option: "Are you okay?"
    distractors: ["You are okay?", "Do you are okay?", "Are okay?"]
    accepted_answers: [{value: "Are you okay?", status: "correct"}]
    feedback: "در شکل معمول سوال بلی/نخیر با be، are پیش از you می‌آیه: Are you okay?"
  en.a1.unit01.lesson03.exercise03.reply_fine:
    instruction: "به How are you? یک جواب طبیعی و مؤدبانه بدین."
    accepted_answers:
      - {value: "I'm fine, thanks.", status: "correct"}
      - {value: "I'm good, thanks.", status: "correct"}
      - {value: "Not bad, thanks.", status: "correct"}
    feedback: "جواب باید حال شما را بیان کنه."
  en.a1.unit01.lesson03.exercise08.speak_exchange:
    instruction: "حال خود را بگویین و بعد حال طرف مقابل را بپرسین."
    accepted_answers:
      - {value: "I'm fine, thanks. And you?", status: "correct"}
      - {value: "I'm fine, thanks, and you?", status: "correct"}
      - {value: "I'm good, thanks. And you?", status: "correct"}
      - {value: "I'm good, thanks, and you?", status: "correct"}
      - {value: "Not bad, thanks. And you?", status: "correct"}
      - {value: "Not bad, thanks, and you?", status: "correct"}
    feedback: "And you? نوبت را به طرف مقابل می‌ده."

  en.a1.unit01.lesson05.exercise06.choose_later:
    instruction: "معنای See you later را انتخاب کنین."
    correct_option: "بعداً می‌بینمتان"
    distractors: ["صبح بخیر", "از آشنایی با شما خوش شدم", "خوب استین؟"]
    accepted_answers: [{value: "بعداً می‌بینمتان", status: "correct"}]
    feedback: "See you later وخت خداحافظی گفته می‌شه."
  en.a1.unit01.lesson05.exercise07.order_good_day:
    instruction: "چهار کلمه را طوری مرتب کنین که برای کسی روز خوبی آرزو شه."
    accepted_answers: [{value: ["Have", "a", "good", "day"], status: "correct"}]
    feedback: "ترتیب درست Have a good day استه."
  en.a1.unit01.lesson05.exercise04.listen_nice:
    instruction: "جمله را بشنوین و به انگلیسی بنویسین."
    accepted_answers:
      - {value: "Nice to meet you.", status: "correct"}
      - {value: "Nice to meet you", status: "correct"}
    feedback: "جملهٔ شنیده‌شده Nice to meet you استه."
  en.a1.unit01.lesson05.exercise05.reply_nice:
    instruction: "به Nice to meet you جوابی طبیعی بدین."
    accepted_answers:
      - {value: "Nice to meet you too.", status: "correct"}
      - {value: "Nice to meet you too", status: "correct"}
      - {value: "You too.", status: "acceptable_with_note", note: "جوابی طبیعی و کوتاه استه."}
    feedback: "Nice to meet you too جواب کامل و رایج استه."
  en.a1.unit01.lesson05.exercise08.speak_closing:
    instruction: "برای پایان گفت‌وگو، برای طرف مقابل روز خوبی آرزو کنین."
    accepted_answers:
      - {value: "Have a good day.", status: "correct"}
      - {value: "Have a good day", status: "correct"}
    feedback: "Have a good day آرزوی مناسبی در پایان گفت‌وگو استه."
