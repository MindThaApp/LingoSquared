teaching:
  en.a1.unit68.lesson01.teach.borrow: {title: "borrow", gloss: "امانت گرفتن", note: "borrow یعنی چیزی را برای وقت کوتاه گرفتن و بعد پس دادن.", example_gloss: "می‌تانم چتری‌ات را امانت بگیرم؟"}
  en.a1.unit68.lesson01.teach.lend: {title: "lend", gloss: "امانت دادن", note: "lend یعنی چیزی را به کسی دادن که برای وقت کوتاه استفاده کند.", example_gloss: "می‌تانی یک چارجر به من امانت بتی؟"}
  en.a1.unit68.lesson01.teach.umbrella: {title: "umbrella", gloss: "چتری", note: "umbrella یعنی چتری، چیزی که در باران بالای سر می‌گیرین.", example_gloss: "می‌تانم چتری‌ات را امانت بگیرم؟"}
  en.a1.unit68.lesson01.teach.charger: {title: "charger", gloss: "چارجر", note: "charger یعنی چارجر تیلفون یا وسیلهٔ برقی.", example_gloss: "می‌تانی یک چارجر به من امانت بتی؟"}
  en.a1.unit68.lesson01.teach.return: {title: "return", gloss: "پس دادن", note: "return یعنی چیزی را دوباره به صاحبش دادن.", example_gloss: "لطفاً فردا آن را پس بتین."}
  en.a1.unit68.lesson01.teach.tomorrow: {title: "tomorrow", gloss: "فردا", note: "tomorrow یعنی روز بعد از امروز.", example_gloss: "لطفاً فردا آن را پس بتین."}

  en.a1.unit68.lesson02.teach.borrow_umbrella: {title: "Can I borrow your umbrella?", gloss: "می‌تانم چتری‌ات را امانت بگیرم؟", note: "Can I borrow ...? برای خواهش مؤدبانه برای گرفتن یک چیز کار می‌ره."}
  en.a1.unit68.lesson02.teach.lend_charger: {title: "Can you lend me a charger?", gloss: "می‌تانی یک چارجر به من امانت بتی؟", note: "Can you lend me ...? یعنی می‌تانی چیزی را برای وقت کوتاه به من بتی؟"}
  en.a1.unit68.lesson02.teach.lend_to_you: {title: "I can lend it to you.", gloss: "می‌تانم آن را به تو امانت بتم.", note: "این جمله برای قبول کردن و امانت دادن کار می‌ره."}
  en.a1.unit68.lesson02.teach.return_tomorrow: {title: "Please return it tomorrow.", gloss: "لطفاً فردا آن را پس بتین.", note: "return it tomorrow یعنی فردا آن را پس دادن."}
  en.a1.unit68.lesson02.teach.thanks_lending: {title: "Thank you for lending it.", gloss: "تشکر که آن را امانت دادین.", note: "Thank you for ... برای تشکر از یک کار مشخص کار می‌ره."}
  en.a1.unit68.lesson02.teach.need_today: {title: "I need it today.", gloss: "امروز به آن ضرورت دارم.", note: "today یعنی امروز؛ جمله می‌گه همین امروز لازم استه."}

  en.a1.unit68.lesson03.teach.dialogue_line1: {title: "خواهش لیلا", gloss: "سلام میا. می‌تانم چتری‌ات را امانت بگیرم؟", note: "Leila چتری میا را برای باران می‌خواهد."}
  en.a1.unit68.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "بلی، می‌تانم آن را به تو امانت بتم.", note: "Mia قبول می‌کنه که چتری را امانت بدهد."}
  en.a1.unit68.lesson03.teach.dialogue_line3: {title: "تشکر لیلا", gloss: "تشکر. امروز باران می‌باره.", note: "It is raining today یعنی امروز باران می‌باره."}
  en.a1.unit68.lesson03.teach.dialogue_line4: {title: "شرط میا", gloss: "لطفاً فردا آن را پس بده.", note: "Mia وقت پس دادن چتری را می‌گه."}
  en.a1.unit68.lesson03.teach.dialogue_line5: {title: "پیشنهاد لیلا", gloss: "البته. به چارجر ضرورت داری؟", note: "Leila در بدل، دربارهٔ چارجر می‌پرسه."}
  en.a1.unit68.lesson03.teach.dialogue_line6: {title: "درخواست میا", gloss: "بلی، می‌تانی یک چارجر به من امانت بتی؟", note: "Mia حالا چارجر می‌خواهد."}
  en.a1.unit68.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "حتماً. می‌تانم یکی به تو امانت بتم.", note: "Sure جواب دوستانه و مثبت استه."}

  en.a1.unit68.lesson04.teach.borrowing_note: {title: "یادداشت امانت", gloss: "یادداشت امانت: لیلا امروز چتری میا را دارد. فردا پس بدهد. میا چارجر لیلا را دارد.", note: "این یادداشت می‌گه کی چی را دارد و چه وقت باید پس بدهد."}
  en.a1.unit68.lesson04.teach.reading_passage: {title: "متن: دوستانی که چیزها را شریک می‌سازن", gloss: "دوستانی که چیزها را شریک می‌سازن: باران می‌بارید، پس لیلا از میا چتری خواست. میا گفت می‌تواند آن را به لیلا امانت بدهد. میا از لیلا خواست آن را فردا پس بدهد. بعد میا به چارجر ضرورت داشت. لیلا یک چارجر به میا امانت داد. هر دو دوست یک یادداشت کوتاه نوشتن تا به یاد داشته باشن چی را باید پس بدهند.", note: "این متن امانت گرفتن، امانت دادن، و یادداشت پس دادن را تمرین می‌کنه."}

exercises:
  en.a1.unit68.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "umbrella"
    distractors: ["raincoat", "notebook", "wallet", "shoe"]
    accepted_answers: [{value: "umbrella", status: "correct"}]
    feedback: "umbrella یعنی چتری."
  en.a1.unit68.lesson01.exercise02.choose_borrow_meaning:
    instruction: "کدام کلمه یعنی چیزی را استفاده کردن و بعد پس دادن؟"
    correct_option: "borrow"
    distractors: ["buy", "sell", "open"]
    accepted_answers: [{value: "borrow", status: "correct"}]
    feedback: "borrow یعنی امانت گرفتن."
  en.a1.unit68.lesson01.exercise03.match_borrowing_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "use something and give it back later", "right": "borrow"}, {"left": "give something for someone to use for a short time", "right": "lend"}, {"left": "something you use in rain", "right": "umbrella"}, {"left": "a cable or plug for a phone battery", "right": "charger"}, {"left": "give something back", "right": "return"}, {"left": "the day after today", "right": "tomorrow"}], "status": "correct"}]
    feedback: "borrow=امانت گرفتن، lend=امانت دادن، umbrella=چتری، charger=چارجر، return=پس دادن، tomorrow=فردا."
  en.a1.unit68.lesson01.exercise04.order_borrow_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "I", "borrow", "your", "umbrella?"], status: "correct"}]
    feedback: "ترتیب درست: Can I borrow your umbrella?"
  en.a1.unit68.lesson01.exercise05.write_charger:
    instruction: "کلمه‌ای را بنویسین که یعنی کیبل یا پلگ برای بطری تیلفون."
    accepted_answers: [{value: "charger", status: "correct"}]
    feedback: "charger یعنی چارجر."

  en.a1.unit68.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Can I borrow your umbrella?"
    distractors: ["Can I use your phone?", "Can I carry your bag?", "Can I open the door?"]
    accepted_answers: [{value: "Can I borrow your umbrella?", status: "correct"}]
    feedback: "Can I borrow your umbrella? یعنی می‌تانم چتری‌ات را امانت بگیرم؟"
  en.a1.unit68.lesson02.exercise02.choose_borrow_request:
    instruction: "کدام عبارت می‌پرسه که چتری کسی را استفاده کنین؟"
    correct_option: "Can I borrow your umbrella?"
    distractors: ["Can I exchange this shirt?", "Can I check my balance?", "Can I speak to Mia?"]
    accepted_answers: [{value: "Can I borrow your umbrella?", status: "correct"}]
    feedback: "Can I borrow your umbrella? درخواست امانت گرفتن چتری استه."
  en.a1.unit68.lesson02.exercise03.choose_return_request:
    instruction: "کدام عبارت از کسی می‌خواهد فردا چیزی را پس بدهد؟"
    correct_option: "Please return it tomorrow."
    distractors: ["Please enter your PIN.", "Please ask a doctor.", "Please speak slowly."]
    accepted_answers: [{value: "Please return it tomorrow.", status: "correct"}]
    feedback: "Please return it tomorrow. یعنی لطفاً فردا آن را پس بتین."
  en.a1.unit68.lesson02.exercise04.order_lend_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "you", "lend", "me", "a", "charger?"], status: "correct"}]
    feedback: "ترتیب درست: Can you lend me a charger?"
  en.a1.unit68.lesson02.exercise05.translate_today:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «امروز به آن ضرورت دارم.»"
    accepted_answers:
      - {value: "I need it today.", status: "correct"}
      - {value: "I need it today", status: "correct"}
    feedback: "I need it today. یعنی امروز به آن ضرورت دارم."

  en.a1.unit68.lesson03.exercise01.comprehension_item:
    instruction: "مطابق گفتگو، لیلا چی را امانت می‌گیرد؟"
    correct_option: "umbrella"
    distractors: ["charger", "jacket", "bag"]
    accepted_answers: [{value: "umbrella", status: "correct"}]
    feedback: "لیلا چتری را امانت می‌گیرد."
  en.a1.unit68.lesson03.exercise02.comprehension_return_time:
    instruction: "مطابق گفتگو، لیلا چتری را چه وقت باید پس بدهد؟"
    correct_option: "tomorrow"
    distractors: ["today", "next week", "after lunch"]
    accepted_answers: [{value: "tomorrow", status: "correct"}]
    feedback: "لیلا باید چتری را فردا پس بدهد."
  en.a1.unit68.lesson03.exercise03.listen_dialogue_borrow:
    instruction: "لیلا کدام درخواست را می‌گه؟"
    correct_option: "Can I borrow your umbrella?"
    distractors: ["Can I borrow your jacket?", "Can I use your room?", "Can I take your receipt?"]
    accepted_answers: [{value: "Can I borrow your umbrella?", status: "correct"}]
    feedback: "لیلا می‌گه: Can I borrow your umbrella?"
  en.a1.unit68.lesson03.exercise04.respond_own_borrow_request:
    instruction: "چیزی را امانت بخواهین، چیزی را امانت بتین، یا پس دادنش را بخواهین."
    accepted_answers: ["Can I borrow your umbrella", "Can I borrow your umbrella?", "Can you lend me a charger", "Can you lend me a charger?", "Please return it tomorrow", "Please return it tomorrow.", "Thank you for lending it", "Thank you for lending it."]
    feedback: "می‌تانین بگین Can I borrow your umbrella? یا Please return it tomorrow."

  en.a1.unit68.lesson04.exercise01.note_umbrella:
    instruction: "مطابق یادداشت، کی چتری میا را دارد؟"
    correct_option: "Leila"
    distractors: ["Mia", "Daniel", "the clerk"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "لیلا چتری میا را دارد."
  en.a1.unit68.lesson04.exercise02.note_return_time:
    instruction: "مطابق یادداشت، لیلا چتری را چه وقت باید پس بدهد؟"
    correct_option: "tomorrow"
    distractors: ["today", "tonight", "next month"]
    accepted_answers: [{value: "tomorrow", status: "correct"}]
    feedback: "لیلا باید چتری را فردا پس بدهد."
  en.a1.unit68.lesson04.exercise03.reading_charger:
    instruction: "مطابق متن، کی به چارجر ضرورت داشت؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the pharmacist"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "میا به چارجر ضرورت داشت."
  en.a1.unit68.lesson04.exercise04.reading_why_note:
    instruction: "مطابق متن، چرا دوستان یادداشت نوشتن؟"
    correct_option: "to remember what to return"
    distractors: ["to buy a new umbrella", "to call the pharmacy", "to choose a larger size"]
    accepted_answers: [{value: "to remember what to return", status: "correct"}]
    feedback: "یادداشت نوشتن تا یادشان بمانه چی را باید پس بدهند."
  en.a1.unit68.lesson04.exercise05.write_own_borrowing_note:
    instruction: "یک یادداشت کوتاه بنویسین: بگین چتری را امانت گرفتین، و بگین چه وقت پس می‌تین."
    accepted_answers:
      - {value: "I borrowed your umbrella. I will return it tomorrow.", status: "correct"}
      - {value: "I borrowed your umbrella, and I will return it tomorrow.", status: "correct"}
      - {value: "I borrowed your umbrella and I will return it tomorrow.", status: "correct"}
    feedback: "می‌تانین بگین: I borrowed your umbrella. I will return it tomorrow."
