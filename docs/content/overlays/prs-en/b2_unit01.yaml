    instruction: "پاراگراف کامل میا را همان‌طور که تمرین کدین بنویسین، در چهار بخش: ادعا (کار ترکیبی نگهداشت را بهتر می‌کنه بدون این‌که کارکرد پایین بیایه)، شواهد سروی کارمندان، نگرانی بعضی مدیران (همکاری ضعیف‌تر می‌شه) همرای عبارت *That is a fair concern* با این‌که داده‌های پروژه نگرانی را تایید نمی‌کنه، و نتیجه (تیم‌ها به وقت تحویل دادن، پس باید روال جلسه‌ها را بهتر کنیم، نی این‌که برنامه را کنار بگذاریم)."
