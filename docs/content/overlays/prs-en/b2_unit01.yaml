course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای بحث، دلیل آوردن، و جواب دادن به مخالفت با توضیحاتی که به دری آشناست."

units:
  en.b2.unit01.argumentation: {title: "شواهد هنوز از آن پشتیبانی می‌کنه"}

lessons:
  en.b2.unit01.lesson01.argument_structure: {title: "ادعا، شواهد، و جواب به مخالفت"}
  en.b2.unit01.lesson02.building_an_argument: {title: "قبول دارم خطر داره، اما..."}
  en.b2.unit01.lesson03.reading_an_argument: {title: "متن خوانی: دفاع از برنامهٔ ترکیبی"}
  en.b2.unit01.lesson04.the_argument_dialogue: {title: "فایده‌هایش از خطرهایش بیشتر استه"}

teaching:
  en.b2.unit01.lesson01.teach.claim: {title: "claim", gloss: "ادعا، موقفی که دفاع می‌کنین", note: "*claim* در بحث یعنی حرف اصلی شما که می‌خواهین ثابت کنین. در انگلیسی معمولاً با یک جملهٔ واضح گفته می‌شه، نی فقط با اشاره.", example_gloss: "ادعای او این استه که برنامه باید ادامه پیدا کنه."}
  en.b2.unit01.lesson01.teach.evidence: {title: "evidence", gloss: "شواهد، دلیل قابل دید", note: "*evidence* یعنی رقم، مثال، یا واقعیتی که از ادعا پشتیبانی می‌کنه. فقط «به نظر من» شواهد نیست.", example_gloss: "همی مثال به میا برای ادعایش شواهد می‌ته."}
  en.b2.unit01.lesson01.teach.counterargument: {title: "counterargument", gloss: "دلیل مخالف", note: "*counterargument* یعنی قوی‌ترین گپ مخالف که ادعای شما را به چالش می‌کشه.", example_gloss: "دنیل یک دلیل مخالف مطرح می‌کنه."}
  en.b2.unit01.lesson01.teach.rebut: {title: "rebut", gloss: "جواب دادن به دلیل مخالف", note: "*rebut* یعنی به مخالفت جواب بتین و نشان بتین که ادعای اصلی هنوز می‌ایسته. این با فقط تکرار ادعا فرق داره.", example_gloss: "میا با شواهد به نگرانی جواب می‌ته.", media_asset_key: "en.b2.audio.argumentation.phrase.rebut.01"}
  en.b2.unit01.lesson01.teach.concede: {title: "concede", gloss: "قبول کدن یک بخش از گپ مخالف", note: "*concede* یعنی قبول کنین که یک نگرانی معقول استه، اما کل ادعای خود را واگذار نکنین.", example_gloss: "می‌تانین یک نگرانی را قبول کنین بدون این‌که ادعای اصلی تان را واگذار کنین."}
  en.b2.unit01.lesson01.teach.outweigh: {title: "outweigh", gloss: "سنگین‌تر بودن، مهم‌تر بودن", note: "*outweigh* برای مقایسهٔ دلیل‌ها استه: یک طرف از طرف دیگر مهم‌تر حساب می‌شه.", example_gloss: "شواهد قوی می‌تانه از یک نگرانی مهم‌تر باشه."}

  en.b2.unit01.lesson02.teach.position_with_evidence: {title: "I agree the plan has risks, but the evidence still supports moving forward.", gloss: "قبول دارم پلان خطرهایی داره، اما شواهد هنوز ادامه دادن پلان را تایید می‌کنه.", note: "در انگلیسی *I agree... but...* اول گپ مقابل را منصفانه قبول می‌کنه، بعد با *but* موقف اصلی را نگه می‌داره.", media_asset_key: "en.b2.audio.argumentation.sentence.01"}
  en.b2.unit01.lesson02.teach.strongest_reason: {title: "The strongest reason is that the survey results were consistent.", gloss: "قوی‌ترین دلیل این استه که نتیجه‌های سروی یکسان بودن.", note: "*The strongest reason is that...* برای معرفی دلیل اصلی و واضح استه؛ بعد از *that* جملهٔ کامل می‌آیه."}
  en.b2.unit01.lesson02.teach.fair_concern: {title: "That is a fair concern; however, the data points in the other direction.", gloss: "این یک نگرانی منصفانه استه؛ اما معلومات خلاف آن را نشان می‌ته.", note: "*however* در نوشته رسمی‌تر از *but* استه و بعدش معمولاً کامه می‌آیه."}
  en.b2.unit01.lesson02.teach.grammar_argument_shape: {title: "شکل یک دفاع قوی", gloss: "یک موقف دفاع‌شده معمولاً چهار حرکت داره: ادعا را بگین، شواهد بتین، قوی‌ترین گپ مخالف را قبول کنین، و به آن جواب بتین. عبارت‌هایی مثل *That is a fair concern* و *However* کمک می‌کنه منصف معلوم شین بدون این‌که ادعا را واگذار کنین.", note: "برای دری‌زبان‌ها وسوسه استه همه چیز را با «اما» وصل کنن؛ در انگلیسی B2 بهتر استه حرکت‌ها را واضح نشان بتین. در دری article نداریم، اما در این جمله *The evidence* لازم استه؛ و در انگلیسی فعل *supports* پیش از عبارت *moving forward* می‌آیه."}

  en.b2.unit01.lesson03.teach.retention: {title: "retention", gloss: "ماندن کارمندان، نگهداشت", note: "*retention* در کار و اداره یعنی چند نفر در تیم می‌مانن و ترک نمی‌کنن.", example_gloss: "نگهداشت بهتر یعنی کارمندان کمتر تیم را ترک می‌کنن."}
  en.b2.unit01.lesson03.teach.collaboration: {title: "collaboration", gloss: "همکاری", note: "*collaboration* یعنی چند نفر با هم کار را پیش می‌برن، نه فقط کنار هم بودن.", example_gloss: "همکاری خوب به تیم کمک می‌کنه کار را تمام کنه."}
  en.b2.unit01.lesson03.teach.reading_passage: {title: "متن دربارهٔ برنامهٔ ترکیبی", gloss: "میا استدلال می‌کنه که شرکت باید برنامهٔ ترکیبی را برای سه ماهِ آینده نگه کنه. ادعای اصلی او این استه که کار ترکیبی نگهداشت کارمندان را بهتر می‌کنه بدون این‌که کارکرد را پایین بیاره. قوی‌ترین شواهد سروی کارمندان استه: کارمندانی که در تیم‌های ترکیبی بودن کمتر احتمال داشت بگن دنبال کار دیگر استن. قوی‌ترین دلیل مخالف این استه که وقتی مردم هر روز در دفتر نیستن، همکاری شاید آسیب ببینه. میا همی نگرانی را قبول می‌کنه، اما با معلومات پروژه به آن جواب می‌ته: تیم‌های ترکیبی کارشان را به وقت تحویل دادن، و نمره‌های بررسی شان کمی بلندتر بود. به همی دلیل، او نتیجه می‌گیره که فایده‌ها از خطرها بیشتر استه.", note: "در متن، ادعا، شواهد، مخالفت، و جواب به مخالفت را جدا ببینین."}

  en.b2.unit01.lesson04.teach.q_keep_hybrid: {title: "گپ میا دربارهٔ برنامهٔ ترکیبی", gloss: "میا می‌گه: فکر می‌کنم باید برنامهٔ ترکیبی را برای سه ماهِ آینده نگه کنیم.", note: "*I think we should...* یک موقف نرم اما واضح می‌سازه.", media_asset_key: "en.b2.audio.dialogue.argumentation.01"}
  en.b2.unit01.lesson04.teach.a_strongest_reason: {title: "سوال دنیل", gloss: "دنیل می‌پرسه: قوی‌ترین دلیل‌تان چی استه؟", note: "*strongest reason* یعنی فقط یک دلیل معمولی نه، بلکه دلیل اصلی."}
  en.b2.unit01.lesson04.teach.q_retention_survey: {title: "جواب میا با شواهد", gloss: "میا می‌گه: قوی‌ترین دلیل نگهداشت استه. در سروی کارمندان، کسانی که ترکیبی کار می‌کدن کمتر می‌گفتن که دنبال کار دیگر استن.", note: "میا اول دلیل را نام می‌بره، بعد شواهد سروی را می‌ته."}
  en.b2.unit01.lesson04.teach.a_collaboration_weaker: {title: "دلیل مخالف دنیل", gloss: "دنیل می‌گه: بعضی مدیرها می‌گن وقتی مردم هر روز در دفتر نیستن، همکاری ضعیف‌تر می‌شه.", note: "همی جمله نقش *counterargument* داره: گپ مخالفی که باید جواب داده شه."}
  en.b2.unit01.lesson04.teach.q_data_rebuttal: {title: "جواب میا به نگرانی", gloss: "میا می‌گه: این یک نگرانی منصفانه استه. اما معلومات پروژه از آن پشتیبانی نمی‌کنه. تیم‌های ترکیبی کارشان را به وقت تحویل دادن، و نمره‌های بررسی شان کمی بلندتر بود.", note: "اول قبول نرم، بعد *However* و شواهد. همی ترتیب در انگلیسی خیلی طبیعی استه."}
  en.b2.unit01.lesson04.teach.a_benefits_outweigh: {title: "خلاصهٔ دنیل", gloss: "دنیل می‌پرسه: پس موقف تان این استه که فایده‌ها از خطرها بیشتر استه؟", note: "*outweigh* یعنی در وزن‌کشی دلیل‌ها، یک طرف غالب استه."}
  en.b2.unit01.lesson04.teach.q_improve_routines: {title: "نتیجهٔ میا", gloss: "میا می‌گه: دقیقاً. باید روش‌های جلسه را بهتر بسازیم، نه این‌که برنامه را رها کنیم.", note: "*not abandon the schedule* نتیجهٔ عملی بحث را واضح می‌کنه."}

exercises:
  en.b2.unit01.lesson01.exercise01.choose_claim:
    instruction: "کدام کلمه یعنی موقفی که یک نفر از آن دفاع می‌کنه؟"
    correct_option: "claim"
    distractors: ["evidence", "counterargument", "concede"]
    accepted_answers: [{value: "claim", status: "correct"}]
    feedback: "*claim* یعنی ادعای اصلی یا موقفی که دفاع می‌کنین."
  en.b2.unit01.lesson01.exercise02.choose_rebut:
    instruction: "کدام کلمه یعنی به گپ مخالف جواب بتین و نشان بتین که ادعای تان هنوز درست می‌ایسته؟"
    correct_option: "rebut"
    distractors: ["repeat", "concede", "outweigh"]
    accepted_answers: [{value: "rebut", status: "correct"}]
    feedback: "*rebut* فقط مخالفت کدن نیست؛ جواب دادن با دلیل استه."
  en.b2.unit01.lesson01.exercise03.match_argument_terms:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "claim", right: "ادعا، موقفی که دفاع می‌کنین"}
      - {left: "evidence", right: "شواهد، دلیل قابل دید"}
      - {left: "counterargument", right: "دلیل مخالف"}
      - {left: "rebut", right: "جواب دادن به دلیل مخالف"}
      - {left: "concede", right: "قبول کدن یک بخش از گپ مخالف"}
      - {left: "outweigh", right: "سنگین‌تر بودن، مهم‌تر بودن"}
    accepted_answers:
      - value:
          - {left: "claim", right: "ادعا، موقفی که دفاع می‌کنین"}
          - {left: "evidence", right: "شواهد، دلیل قابل دید"}
          - {left: "counterargument", right: "دلیل مخالف"}
          - {left: "rebut", right: "جواب دادن به دلیل مخالف"}
          - {left: "concede", right: "قبول کدن یک بخش از گپ مخالف"}
          - {left: "outweigh", right: "سنگین‌تر بودن، مهم‌تر بودن"}
        status: "correct"
    feedback: "ترتیب معنی‌ها را جدا نگه کنین: ادعا، شواهد، مخالفت، جواب، قبولِ بخش مخالف، و وزن‌کشی دلیل‌ها."
  en.b2.unit01.lesson01.exercise04.write_counterargument:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی یک گپ مخالف که ادعا را به چالش می‌کشه."
    accepted_answers:
      - {value: "counterargument", status: "correct"}
      - {value: "Counterargument", status: "correct"}
      - {value: "counter-argument", status: "correct"}
      - {value: "Counter-argument", status: "correct"}
    feedback: "*counterargument* یعنی دلیل مخالف."
  en.b2.unit01.lesson01.exercise05.write_outweigh:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی از یک عامل دیگر مهم‌تر یا سنگین‌تر بودن."
    accepted_answers:
      - {value: "outweigh", status: "correct"}
      - {value: "Outweigh", status: "correct"}
    feedback: "*outweigh* یعنی فایده‌ها یا دلیل‌ها از طرف دیگر مهم‌تر می‌شن."

  en.b2.unit01.lesson02.exercise01.choose_concede_rebut:
    instruction: "کدام جمله اول گپ مخالف را منصفانه قبول می‌کنه و بعد به آن جواب می‌ته؟"
    correct_option: "That is a fair concern; however, the data points in the other direction."
    distractors: ["The strongest reason is that the survey results were consistent.", "The data points in the other direction because I said so.", "That is a fair concern, so we should abandon the schedule."]
    accepted_answers: [{value: "That is a fair concern; however, the data points in the other direction.", status: "correct"}]
    feedback: "*That is a fair concern; however,...* هم قبول نرم داره و هم جواب به مخالفت."
  en.b2.unit01.lesson02.exercise02.choose_strongest_reason:
    instruction: "کدام جمله به شکل واضح شواهد پشتیبان یک موقف را معرفی می‌کنه؟"
    correct_option: "The strongest reason is that the survey results were consistent."
    distractors: ["That is a fair concern; however, the data points in the other direction.", "I agree the plan has risks.", "The plan might be okay, maybe."]
    accepted_answers: [{value: "The strongest reason is that the survey results were consistent.", status: "correct"}]
    feedback: "*The strongest reason is that...* دلیل اصلی را واضح معرفی می‌کنه."
  en.b2.unit01.lesson02.exercise03.order_evidence_supports:
    instruction: "کلمات را طوری بچینین که معنی‌اش این شه: «شواهد هنوز ادامه دادن پلان را تایید می‌کنه»."
    accepted_answers: [{value: ["The", "evidence", "still", "supports", "moving", "forward"], status: "correct"}]
    feedback: "ترتیب درست: *The evidence still supports moving forward*"
  en.b2.unit01.lesson02.exercise04.reply_risks_but_evidence:
    instruction: "یک همکار فکر می‌کنه پلان خطر زیاد داره. قبول کنین که پلان خطرهایی داره، اما بگین که شواهد هنوز ادامه دادن را تایید می‌کنه."
    accepted_answers:
      - {value: "I agree the plan has risks, but the evidence still supports moving forward", status: "correct"}
      - {value: "I agree the plan has risks, but the evidence still supports moving forward.", status: "correct"}
      - {value: "I agree that the plan has risks, but the evidence still supports moving forward", status: "correct"}
      - {value: "I agree that the plan has risks, but the evidence still supports moving forward.", status: "correct"}
      - {value: "I agree there are risks, but the evidence still supports moving forward", status: "correct"}
      - {value: "I agree there are risks, but the evidence still supports moving forward.", status: "correct"}
    feedback: "در انگلیسی *I agree... but...* برای قبول نرم و نگه داشتن موقف بسیار مفید استه."
  en.b2.unit01.lesson02.exercise05.write_fair_concern:
    instruction: "در یک جمله به مخالفت جواب بتین: اول قبول کنین که نگرانی منصفانه استه، بعد بگین که داده‌ها به طرف دیگه اشاره می‌کنه."
    accepted_answers:
      - {value: "That is a fair concern; however, the data points in the other direction.", status: "correct"}
      - {value: "That is a fair concern; however the data points in the other direction.", status: "acceptable_with_note", note: "قابل فهم استه، اما در نوشتهٔ پخته بعد از *however* کامه می‌آیه."}
      - {value: "That is a fair concern. However, the data points in the other direction.", status: "correct"}
      - {value: "That is a fair concern, but the data points in the other direction.", status: "correct"}
      - {value: "That's a fair concern; however, the data points in the other direction.", status: "correct"}
    feedback: "*however* بعد از قبول نگرانی، مسیر جواب را باز می‌کنه."

  en.b2.unit01.lesson03.exercise01.choose_main_claim:
    instruction: "در متن، ادعای اصلی میا کدام استه؟"
    correct_option: "hybrid work improves retention without lowering performance"
    distractors: ["collaboration may suffer when people are not in the office every day", "the project data does not support hybrid work", "managers should abandon the schedule immediately"]
    accepted_answers: [{value: "hybrid work improves retention without lowering performance", status: "correct"}]
    feedback: "ادعای میا این استه که کار ترکیبی نگهداشت را بهتر می‌کنه بدون پایین آوردن کارکرد."
  en.b2.unit01.lesson03.exercise02.choose_counterargument:
    instruction: "کدام جمله دلیل مخالفی استه که میا به آن جواب می‌ته؟"
    correct_option: "collaboration may suffer when people are not in the office every day"
    distractors: ["hybrid work improves retention without lowering performance", "hybrid teams delivered on time and scored higher", "the benefits outweigh the risks"]
    accepted_answers: [{value: "collaboration may suffer when people are not in the office every day", status: "correct"}]
    feedback: "نگرانی دربارهٔ همکاری نقش دلیل مخالف را داره."
  en.b2.unit01.lesson03.exercise03.match_argument_parts:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "Mia's defended position", right: "کار ترکیبی نگهداشت کارمندان را بهتر می‌کنه، بدون این‌که کارکرد پایین بیایه"}
      - {left: "survey support for her position", right: "کارمندان ترکیبی کمتر دنبال کار دیگر می‌گشتند"}
      - {left: "the strongest opposing point", right: "شاید همکاری آسیب ببینه"}
      - {left: "her answer to the opposing point", right: "تیم‌های ترکیبی به وقت تحویل دادن و نمرهٔ بلندتر گرفتند"}
      - {left: "her final weighing of the issue", right: "فایده‌ها از خطرها بیشتر استه"}
    accepted_answers:
      - value:
          - {left: "Mia's defended position", right: "کار ترکیبی نگهداشت کارمندان را بهتر می‌کنه، بدون این‌که کارکرد پایین بیایه"}
