review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit57 (cinema), itself still unreviewed -- this overlay inherits that dependency, and is the LAST of the 45-57 realization-gap batch this dispatch was assigned. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit57.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit57.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: film -> فلم (the standard Dari/Afghan spelling and pronunciation, as opposed to Iranian Persian's فیلم); seat -> چوکی (the standard Dari word for a seat/chair, as opposed to Iranian Persian's صندلی); ticket -> تکت (same standard Dari word already established across unit48/unit55/unit58, per CLAUDE.md precedent); the rest of the vocabulary (سینما/cinema, پرده/screen, پاپ‌کورن/popcorn) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌تانیم for می‌شود/می‌توانیم, بجه as the informal o'clock marker). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's fixed phrase 'in total' tacked onto a price question (How much is that in total?) modifies the question with a trailing prepositional phrase, while Dari expresses the same summary concept by making مجموع ('total') the grammatical subject itself (مجموعش چند می‌شه؟, literally 'its total, how much does it become?') -- a Dari speaker must learn English's different structural placement for the same idea; (2) English's idiom 'can't wait to ___' (I can't wait to watch it) uses a negated ability verb to express eager anticipation, a genuinely counterintuitive surface meaning (negation expressing enthusiasm, not reluctance) -- Dari expresses the identical eager-anticipation meaning positively and directly with بی‌صبرانه منتظر ... استم ('I am impatiently waiting for...'), with no negation involved at all, so a Dari speaker must specifically learn that English's negative-sounding idiom here carries a positive meaning. Three-speaker dialogue (Daniel, Cashier, Leila) handled the same way as unit48/unit50-unit56's precedent -- every numeric fact kept in its own single-fact turn, matching the realization's own deliberate zero-combined-fact discipline. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: the Cashier states four distinct facts across four separate turns (seven-o'clock showtime, sixteen-dollar two-ticket price, four-dollar popcorn, twenty-dollar total) -- confirmed each answers a genuinely different question type, so cross-using them as distractors is safe per the realization's own analysis, though invented values were used as the default anyway; also cross-checked sixteen/four/twenty/seven against unit08/unit52-unit56's prices for accidental collision -- 'twenty dollars' repeats unit52's haircut total and 'seven' echoes unit56's salad price, but both are independent, unrelated scenes per the existing accepted precedent, matching the realization's own note. This unit's own cinema-schedule card (Star Journey $8/7:00, The Great Race $10/5:00, Funny Family $6/9:00) has its 'starts at seven' and 'cheapest film' comprehension exercises cross-checked against all three listed showtimes/prices per AUTHORING_GUIDE.md #11 -- Star Journey is uniquely the 7:00 film and Funny Family at $6 is uniquely the cheapest, no ambiguity in either. Multi-clause accepted_answers (lesson04's write_own_cinema_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit -- and, since this is the batch's final unit, a corpus-wide fresh-context review pass across all of units 45-57 together (not just unit-by-unit) is recommended before any of them ship, to catch any cross-unit inconsistency this per-unit authoring process wouldn't surface on its own."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit57.cinema: {title: "رفتن به سینما"}

lessons:
  en.a1.unit57.lesson01.cinema_vocabulary: {title: "کلمات سینما"}
  en.a1.unit57.lesson02.phrases_for_the_cinema: {title: "عبارات سینما"}
  en.a1.unit57.lesson03.dialogue_at_the_cinema: {title: "گفتگو: توی سینما"}
  en.a1.unit57.lesson04.an_evening_at_the_cinema: {title: "متن: یک شب در سینما"}

teaching:
  en.a1.unit57.lesson01.teach.cinema: {title: "cinema", gloss: "سینما", note: "cinema یعنی سینما -- جایی که می‌رین تا فلم ببینین.", example_gloss: "این سینما خیلی مشهور استه."}
  en.a1.unit57.lesson01.teach.ticket: {title: "ticket", gloss: "تکت", note: "ticket یعنی تکت -- در دری برای تکت سینما هم از کلمهٔ «تکت» کار گرفته می‌شه.", example_gloss: "باید یک تکت بخرم."}
  en.a1.unit57.lesson01.teach.showtime: {title: "showtime", gloss: "وخت نمایش", note: "showtime یعنی وخت نمایش -- وختی که یک فلم شروع می‌شه.", example_gloss: "وخت نمایش فلم چند استه؟"}
  en.a1.unit57.lesson01.teach.seat: {title: "seat", gloss: "چوکی", note: "seat یعنی چوکی -- در دری برای چوکی سینما هم «چوکی» کار می‌ره، نی «صندلی» که در فارسی ایران رایج استه.", example_gloss: "این چوکی خالی استه؟"}
  en.a1.unit57.lesson01.teach.screen: {title: "screen", gloss: "پرده", note: "screen یعنی پرده -- سطح بزرگ و مسطحی که فلم را روی آن می‌بینین.", example_gloss: "پرده خیلی بزرگ استه."}
  en.a1.unit57.lesson01.teach.popcorn: {title: "popcorn", gloss: "پاپ‌کورن", note: "popcorn یعنی پاپ‌کورن -- یک خوراکی که خیلی‌ها وخت دیدن فلم می‌خورن.", example_gloss: "ما همیشه در سینما پاپ‌کورن می‌خریم."}

  en.a1.unit57.lesson02.teach.what_time_does_the_film_start: {title: "What time does the film start?", gloss: "فلم ساعت چند شروع می‌شه؟", note: "همو ساختار What time does که در واحدهای پیش دیدین."}
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show: {title: "Two tickets for the seven o'clock show, please.", gloss: "دو تکت برای نمایش ساعت هفت، لطفاً.", note: "for the ___ show یعنی «برای نمایش ___» -- برای مشخص کردن کدام نمایش کار می‌ره."}
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn: {title: "Can I have some popcorn, please?", gloss: "می‌تانم یک‌کمی پاپ‌کورن بگیرم، لطفاً؟", note: "some اینجه یعنی «یک‌کمی» -- برای مقدار نامشخص یک چیز کار می‌ره."}
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total: {title: "How much is that in total?", gloss: "مجموعش چند دالر می‌شه؟", note: "in total یعنی «مجموعاً» -- انگلیسی این را به آخر سوال قیمت اضافه می‌کنه، دری معمولاً «مجموع» را خودِ فاعل جمله می‌سازه."}
  en.a1.unit57.lesson02.teach.thats_twenty_dollars: {title: "That's twenty dollars, please.", gloss: "بیست دالر می‌شه، لطفاً.", note: "همو ساختار That's که در واحدهای پیش دیدین."}
  en.a1.unit57.lesson02.teach.i_really_liked_it: {title: "I really liked it!", gloss: "واقعاً خوشم آمد!", note: "really اینجه برای تشدید یک احساس کار می‌ره -- liked شکل ماضی فعل like استه."}

  en.a1.unit57.lesson03.teach.dialogue_line1: {title: "سوال دانیال", gloss: "سلام! فلم ساعت چند شروع می‌شه؟", note: "همو سوال What time does the film start؟ که در لسن ۲ یاد گرفتین."}
  en.a1.unit57.lesson03.teach.dialogue_line2: {title: "جواب صندوقدار", gloss: "نمایش بعدی ساعت هفت بجه استه.", note: "the next show یعنی نمایش بعدی."}
  en.a1.unit57.lesson03.teach.dialogue_line3: {title: "خواهش دانیال", gloss: "خوب استه. می‌تانیم دو تکت بگیریم، لطفاً؟", note: "Can we have ...? همو طریقهٔ مؤدبانهٔ خواستن استه که در واحدهای پیش دیدین."}
  en.a1.unit57.lesson03.teach.dialogue_line4: {title: "جواب صندوقدار", gloss: "البته. شانزده دالر می‌شه.", note: "یک حقیقت جداگانه -- قیمت دو تکت."}
  en.a1.unit57.lesson03.teach.dialogue_line5: {title: "خواهش لیلا", gloss: "می‌تانیم یک‌کمی پاپ‌کورن بگیریم، لطفاً؟", note: "همو ساختار Can we have که در خط پیش یاد گرفتین."}
  en.a1.unit57.lesson03.teach.dialogue_line6: {title: "جواب صندوقدار", gloss: "بلی. پاپ‌کورن چهار دالر استه.", note: "یک حقیقت جداگانه -- قیمت پاپ‌کورن، جدا از قیمت تکت‌ها."}
  en.a1.unit57.lesson03.teach.dialogue_line7: {title: "سوال دانیال", gloss: "مجموعش چند دالر می‌شه؟", note: "همو ساختار How much is that in total؟ که در لسن ۲ یاد گرفتین."}
  en.a1.unit57.lesson03.teach.dialogue_line8: {title: "جواب صندوقدار", gloss: "بیست دالر می‌شه، لطفاً.", note: "این یک حقیقت جداگانه استه -- مجموع کل، جدا از قیمت تکت‌ها و پاپ‌کورن."}
  en.a1.unit57.lesson03.teach.dialogue_line9: {title: "جواب لیلا", gloss: "تشکر! بی‌صبرانه منتظر دیدنش استم.", note: "I can't wait to ...! یک عبارت انگلیسی استه که با نفی (can't) هیجان نشان می‌ته، نی بی‌میلی -- دری همو معنا را مستقیم و مثبت می‌رساند (بی‌صبرانه منتظر ... استم)."}

  en.a1.unit57.lesson04.teach.cinema_schedule: {title: "پروگرام سینما", gloss: "پروگرام سینما: سفر ستاره - ساعت ۷:۰۰، ۸ دالر. مسابقهٔ بزرگ - ساعت ۵:۰۰، ۱۰ دالر. خانوادهٔ بامزه - ساعت ۹:۰۰، ۶ دالر.", note: "این یک پروگرام سینما استه -- وخت نمایش و قیمت هر فلم را کنار نامش نشان می‌ته."}
  en.a1.unit57.lesson04.teach.reading_passage: {title: "متن: یک شب در سینما", gloss: "یک سفر به سینما: یک شام، دانیال و لیلا تصمیم گرفتن که یک فلم در سینما ببینن. آن‌ها پرسیدن کی شروع می‌شه، و صندوقدار گفت که نمایش بعدی، سفر ستاره، ساعت هفت بجه استه. آن‌ها دو تکت به قیمت شانزده دالر و یک بکس پاپ‌کورن به قیمت چهار دالر خریدن. مجموعاً بیست دالر شد. آن‌ها همرای هم فلم را دیدن، و آن در بارهٔ کاشفان فضایی بود. خیلی بامزه بود. وقتی تمام شد، لیلا گفت که واقعاً خوشش آمد، و دانیال گفت که می‌خواد فلم بعدی را هم ببینه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- decided, asked, said, bought, watched, finished."}

exercises:
  en.a1.unit57.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "ticket"
    distractors: ["cinema", "showtime", "seat", "screen"]
    accepted_answers: [{value: "ticket", status: "correct"}]
    feedback: "ticket یعنی تکت."
  en.a1.unit57.lesson01.exercise02.choose_screen_meaning:
    instruction: "کدام کلمه یعنی سطح بزرگ و مسطحی که فلم را روی آن می‌بینین؟"
    correct_option: "screen"
    distractors: ["seat", "ticket", "popcorn"]
    accepted_answers: [{value: "screen", status: "correct"}]
    feedback: "screen یعنی پرده."
  en.a1.unit57.lesson01.exercise03.match_cinema_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{value: [{left: "جایی که می‌رین تا فلم ببینین", right: "cinema"}, {left: "کارت یا کاغذی که برای داخل شدن می‌خرین", right: "ticket"}, {left: "وختی که یک فلم شروع می‌شه", right: "showtime"}, {left: "جایی که برای دیدن فلم می‌نشینین", right: "seat"}, {left: "سطح بزرگ و مسطحی که فلم را روی آن می‌بینین", right: "screen"}, {left: "خوراکی‌ای که خیلی‌ها وخت دیدن فلم می‌خورن", right: "popcorn"}], status: "correct"}]
    feedback: "cinema=سینما، ticket=تکت، showtime=وخت نمایش، seat=چوکی، screen=پرده، popcorn=پاپ‌کورن."
  en.a1.unit57.lesson01.exercise04.order_screen_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "screen", "is", "very", "big."], status: "correct"}]
    feedback: "ترتیب درست: The screen is very big."
  en.a1.unit57.lesson01.exercise05.write_popcorn:
    instruction: "کلمه‌ای را بنویسین که یعنی خوراکی‌ای که خیلی‌ها وخت دیدن فلم می‌خورن."
    accepted_answers: [{value: "popcorn", status: "correct"}]
    feedback: "popcorn یعنی پاپ‌کورن."

  en.a1.unit57.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "What time does the film start?"
    distractors: ["Can I have some popcorn, please?", "How much is that in total?", "I really liked it!"]
    accepted_answers: [{value: "What time does the film start?", status: "correct"}]
    feedback: "What time does the film start? یعنی فلم ساعت چند شروع می‌شه؟"
  en.a1.unit57.lesson02.exercise02.choose_start_time_question:
    instruction: "کدام عبارت را یک مشتری برای پرسیدن وخت شروع یک فلم می‌گه؟"
    correct_option: "What time does the film start?"
    distractors: ["Can I have some popcorn, please?", "How much is that in total?", "I really liked it!"]
    accepted_answers: [{value: "What time does the film start?", status: "correct"}]
    feedback: "What time does the film start? یعنی فلم ساعت چند شروع می‌شه؟"
  en.a1.unit57.lesson02.exercise03.choose_liked_it_meaning:
    instruction: "کدام عبارت را کسی بعد از دیدن یک فلم که خوشش آمده می‌گه؟"
    correct_option: "I really liked it!"
    distractors: ["What time does the film start?", "How much is that in total?", "Can I have some popcorn, please?"]
    accepted_answers: [{value: "I really liked it!", status: "correct"}]
    feedback: "I really liked it! یعنی واقعاً خوشم آمد!"
  en.a1.unit57.lesson02.exercise04.order_total_question:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["How", "much", "is", "that", "in", "total?"], status: "correct"}]
    feedback: "ترتیب درست: How much is that in total?"
  en.a1.unit57.lesson02.exercise05.translate_popcorn_request:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «می‌تانم یک‌کمی پاپ‌کورن بگیرم، لطفاً؟»"
    accepted_answers:
      - {value: "Can I have some popcorn, please?", status: "correct"}
      - {value: "Can I have some popcorn, please", status: "correct"}
    feedback: "Can I have some popcorn, please? یعنی می‌تانم یک‌کمی پاپ‌کورن بگیرم، لطفاً؟"

  en.a1.unit57.lesson03.exercise01.comprehension_ticket_count:
    instruction: "مطابق گفتگو، دانیال و لیلا چند تکت خریدن؟"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: "correct"}]
    feedback: "دانیال و لیلا دو تکت (two) خریدن."
  en.a1.unit57.lesson03.exercise02.comprehension_showtime:
    instruction: "مطابق گفتگو، نمایش بعدی ساعت چند استه؟"
    correct_option: "seven o'clock"
    distractors: ["five o'clock", "nine o'clock", "eight o'clock"]
    accepted_answers: [{value: "seven o'clock", status: "correct"}]
    feedback: "نمایش بعدی ساعت هفت بجه (seven o'clock) استه."
  en.a1.unit57.lesson03.exercise03.listen_dialogue_popcorn_price:
    instruction: "مطابق گفتگو، پاپ‌کورن چند دالر استه؟"
    correct_option: "four dollars"
    distractors: ["six dollars", "sixteen dollars", "twenty dollars"]
    accepted_answers: [{value: "four dollars", status: "correct"}]
    feedback: "پاپ‌کورن چهار دالر (four dollars) استه."
  en.a1.unit57.lesson03.exercise04.respond_own_cinema_statement:
    instruction: "بگین نمایش بعدی ساعت چند استه، تکت‌ها چند دالر استن، یا مجموع چند دالر استه."
    accepted_answers: ["The next show is at seven o'clock", "The next show is at seven o'clock.", "That's sixteen dollars", "That's sixteen dollars.", "The popcorn is four dollars", "The popcorn is four dollars.", "That's twenty dollars", "That's twenty dollars.", "That's twenty dollars, please", "That's twenty dollars, please."]
    feedback: "می‌تانین بگین The next show is at seven o'clock یا That's twenty dollars."

  en.a1.unit57.lesson04.exercise01.schedule_seven_oclock_film:
    instruction: "مطابق پروگرام، کدام فلم ساعت هفت شروع می‌شه؟"
    correct_option: "Star Journey"
    distractors: ["The Great Race", "Funny Family", "none of them"]
    accepted_answers: [{value: "Star Journey", status: "correct"}]
    feedback: "سفر ستاره (Star Journey) ساعت هفت شروع می‌شه."
  en.a1.unit57.lesson04.exercise02.schedule_cheapest_film:
    instruction: "مطابق پروگرام، کدام فلم ارزان‌ترین استه؟"
    correct_option: "Funny Family"
    distractors: ["Star Journey", "The Great Race", "none of them"]
    accepted_answers: [{value: "Funny Family", status: "correct"}]
    feedback: "خانوادهٔ بامزه (Funny Family) با شش دالر ارزان‌ترین استه."
  en.a1.unit57.lesson04.exercise03.reading_ticket_count:
    instruction: "مطابق متن، آن‌ها چند تکت خریدن؟"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: "correct"}]
    feedback: "آن‌ها دو تکت (two) خریدن."
  en.a1.unit57.lesson04.exercise04.reading_total_bill:
    instruction: "مطابق متن، مجموع چند دالر شد؟"
    correct_option: "twenty dollars"
    distractors: ["sixteen dollars", "four dollars", "ten dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "مجموع بیست دالر (twenty dollars) شد."
  en.a1.unit57.lesson04.exercise05.write_own_cinema_message:
    instruction: "یک پیام کوتاه بنویسین: بگین کدام فلم را دیدن، و بگین مجموع چند دالر بود."
    accepted_answers:
      - {value: "They watched Star Journey, and the total was twenty dollars.", status: "correct"}
      - {value: "They watched Star Journey. The total was twenty dollars.", status: "correct"}
      - {value: "They watched Star Journey and the total was twenty dollars.", status: "correct"}
    feedback: "می‌تانین بگین: They watched Star Journey, and the total was twenty dollars."
