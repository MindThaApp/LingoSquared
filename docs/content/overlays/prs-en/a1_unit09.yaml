  en.a1.unit09.lesson02.teach.in_front_of: {title: "پیشروی شفاخانه", gloss: "پارک پیشروی شفاخانه استه", note: "in front of یعنی «پیشروی»."}

  en.a1.unit09.lesson03.teach.where_is_the_bank: {title: "بانک کجاست؟", gloss: "بانک کجاست؟", note: "Where is the bank؟ سوال معیاری برای پرسیدن موقعیت استه."}
