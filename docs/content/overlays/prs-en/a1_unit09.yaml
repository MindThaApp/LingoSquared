  en.a1.unit09.lesson01.teach.pharmacy: {title: "دواخانه", gloss: "دواخانه", note: "pharmacy یعنی دواخانه.", example_gloss: "دواخانه امروز باز استه."}
  en.a1.unit09.lesson01.teach.park: {title: "پارک", gloss: "پارک", note: "park یعنی پارک.", example_gloss: "ما دوست داریم در پارک قدم بزنیم."}
  en.a1.unit09.lesson01.teach.restaurant: {title: "رستورانت", gloss: "رستورانت", note: "restaurant یعنی رستورانت.", example_gloss: "این رستورانت غذای خوب داره."}

  en.a1.unit09.lesson02.teach.next_to: {title: "پهلوی پارک", gloss: "بانک پهلوی پارک استه", note: "next to یعنی «پهلوی»؛ برای نزدیکی مستقیم دو مکان استعمال می‌شه."}
  en.a1.unit09.lesson02.teach.across_from: {title: "مقابل شفاخانه", gloss: "دواخانه مقابل شفاخانه استه", note: "across from یعنی «مقابل»، معمولاً وقتی دو مکان دو طرف یک سرک اند."}
