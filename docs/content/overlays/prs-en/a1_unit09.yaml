  en.a1.unit09.lesson04.teach.a_not_far_between: {title: "جواب کامل موقعیت", gloss: "لیلا می‌گه نخیر، دور نیست، بین بانک و پارک استه", note: "همی جواب هم دوری/نزدیکی و هم موقعیت دقیق را باهم بیان می‌کنه."}

exercises:
  en.a1.unit09.lesson01.exercise01.listen_place:
    instruction: "گوش کنین و کلمهٔ گفته‌شده را انتخاب کنین."
    correct_option: "دواخانه"
    distractors: ["بانک", "شفاخانه", "پارک"]
    accepted_answers: [{value: "دواخانه", status: "correct"}]
    feedback: "pharmacy یعنی دواخانه."
  en.a1.unit09.lesson01.exercise02.choose_hospital:
    instruction: "جایی را انتخاب کنین که وقتی سخت ناجور استین می‌رین."
    correct_option: "hospital"
    distractors: ["bank", "park", "restaurant"]
    accepted_answers: [{value: "hospital", status: "correct"}]
    feedback: "hospital یعنی شفاخانه."
  en.a1.unit09.lesson01.exercise03.choose_bank:
    instruction: "جایی را انتخاب کنین که برای گرفتن پول می‌رین."
    correct_option: "bank"
    distractors: ["hospital", "pharmacy", "park"]
    accepted_answers: [{value: "bank", status: "correct"}]
    feedback: "bank یعنی بانک."
  en.a1.unit09.lesson01.exercise04.match_places:
    instruction: "هر کار را به مکان درستش وصل کنین."
    accepted_answers: [{value: [{left: "get money", right: "bank"}, {left: "see a doctor", right: "hospital"}, {left: "buy medicine", right: "pharmacy"}, {left: "walk outside", right: "park"}, {left: "eat a meal someone else cooked", right: "restaurant"}, {left: "right beside something", right: "next to"}, {left: "on the opposite side of the street from something", right: "across from"}, {left: "in the middle, with one thing on each side", right: "between"}, {left: "at the back of something, away from the street", right: "behind"}, {left: "directly ahead of something, facing the street", right: "in front of"}], status: "correct"}]
    feedback: "bank=بانک، hospital=شفاخانه، pharmacy=دواخانه، park=پارک، restaurant=رستورانت، next to=پهلوی، across from=مقابل، between=بین، behind=عقب، in front of=پیشروی."
  en.a1.unit09.lesson01.exercise05.write_restaurant:
    instruction: "کلمهٔ انگلیسی جایی که خوراکهٔ نپخته‌شدهٔ خودتان را می‌خورین را بنویسین."
    accepted_answers:
      - {value: "restaurant", status: "correct"}
      - {value: "Restaurant", status: "correct"}
    feedback: "restaurant یعنی رستورانت."

  en.a1.unit09.lesson02.exercise01.choose_next_to:
    instruction: "بانک و پارک درست پهلوی همدیگه اند. کدام جمله درست استه؟"
    correct_option: "The bank is next to the park."
    distractors: ["The bank is across from the park.", "The bank is between the park and the hospital.", "The bank is behind the park."]
    accepted_answers: [{value: "The bank is next to the park.", status: "correct"}]
    feedback: "next to برای نزدیکی مستقیم دو مکان استعمال می‌شه."
  en.a1.unit09.lesson02.exercise02.choose_across_from:
    instruction: "دواخانه آن طرف سرک، مقابل شفاخانه استه. کدام جمله درست استه؟"
    correct_option: "The pharmacy is across from the hospital."
    distractors: ["The pharmacy is next to the hospital.", "The pharmacy is behind the hospital.", "The pharmacy is in front of the hospital."]
    accepted_answers: [{value: "The pharmacy is across from the hospital.", status: "correct"}]
    feedback: "across from برای دو طرف سرک بودن استعمال می‌شه، نی next to."
  en.a1.unit09.lesson02.exercise03.order_between:
    instruction: "کلمات را برای گفتن موقعیت دواخانه بین بانک و پارک ترتیب کنین."
    accepted_answers: [{value: ["The", "pharmacy", "is", "between", "the", "bank", "and", "the", "park"], status: "correct"}]
    feedback: "ترتیب درست: The pharmacy is between the bank and the park."
  en.a1.unit09.lesson02.exercise04.choose_behind:
    instruction: "رستورانت عقب بانک استه، در سمت دیگر سرک. کدام جمله درست استه؟"
    correct_option: "The restaurant is behind the bank."
    distractors: ["The restaurant is next to the bank.", "The restaurant is in front of the bank.", "The restaurant is across from the bank."]
    accepted_answers: [{value: "The restaurant is behind the bank.", status: "correct"}]
    feedback: "behind یعنی «عقب»."
  en.a1.unit09.lesson02.exercise05.write_in_front_of:
    instruction: "بنویسین پارک درست پیشروی شفاخانه استه."
    accepted_answers:
      - {value: "The park is in front of the hospital.", status: "correct"}
      - {value: "The park is in front of the hospital", status: "correct"}
    feedback: "in front of یعنی «پیشروی»."

  en.a1.unit09.lesson03.exercise01.listen_where_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "موقعیت بانک"
    distractors: ["قیمت بانک", "ساعت کاری بانک", "موقعیت پارک"]
    accepted_answers: [{value: "موقعیت بانک", status: "correct"}]
    feedback: "Where is the bank؟ موقعیت بانک را می‌پرسه."
  en.a1.unit09.lesson03.exercise02.listen_location_answer:
    instruction: "گوش کنین و معلوم کنین بانک کجاست."
    correct_option: "پهلوی پارک"
    distractors: ["مقابل شفاخانه", "عقب رستورانت", "بین شفاخانه و پارک"]
    accepted_answers: [{value: "پهلوی پارک", status: "correct"}]
    feedback: "It's next to the park یعنی «پهلوی پارک استه»."
  en.a1.unit09.lesson03.exercise03.order_where_question:
    instruction: "کلمات را برای پرسیدن «بانک کجاست؟» ترتیب کنین."
    accepted_answers: [{value: ["Where", "is", "the", "bank"], status: "correct"}]
    feedback: "ترتیب درست: Where is the bank?"
  en.a1.unit09.lesson03.exercise04.reply_location:
    instruction: "به سوال «بانک کجاست؟» جواب بدین که پهلوی پارک استه."
    accepted_answers:
      - {value: "It's next to the park.", status: "correct"}
    feedback: "It's next to the park یعنی «پهلوی پارک استه»."
  en.a1.unit09.lesson03.exercise05.write_not_far:
    instruction: "بنویسین همو مکان دور نیست."
    accepted_answers:
      - {value: "No, it's not far.", status: "correct"}
      - {value: "It's not far.", status: "acceptable_with_note", note: "درست استه، اما جواب کامل با No شروع می‌شه."}
    feedback: "No, it's not far یعنی «نخیر، دور نیست»."

  en.a1.unit09.lesson04.exercise01.listen_pharmacy_location:
    instruction: "گفتگو را گوش کنین و معلوم کنین دواخانه کجاست."
    correct_option: "مقابل شفاخانه"
    distractors: ["پهلوی پارک", "عقب بانک", "بین پارک و رستورانت"]
    accepted_answers: [{value: "مقابل شفاخانه", status: "correct"}]
    feedback: "لیلا می‌گه It's across from the hospital."
  en.a1.unit09.lesson04.exercise02.listen_between:
    instruction: "گوش کنین و معلوم کنین دواخانه دقیقاً کجاست."
    correct_option: "بین بانک و پارک"
    distractors: ["بین شفاخانه و رستورانت", "مقابل پارک", "عقب شفاخانه"]
    accepted_answers: [{value: "بین بانک و پارک", status: "correct"}]
    feedback: "لیلا می‌گه It's between the bank and the park."
  en.a1.unit09.lesson04.exercise03.choose_far_answer:
    instruction: "آیا دواخانه از جایی که دنیل ایستاده دور استه؟"
    correct_option: "No, it's not far."
    distractors: ["Yes, it's very far.", "It's next to the hospital.", "It's across from the park."]
    accepted_answers: [{value: "No, it's not far.", status: "correct"}]
    feedback: "لیلا می‌گه دواخانه دور نیست."
  en.a1.unit09.lesson04.exercise04.order_excuse_me:
    instruction: "کلمات را برای پرسیدن مؤدبانهٔ آدرس دواخانه از یک ناشناس ترتیب کنین."
    accepted_answers: [{value: ["Excuse", "me", "where", "is", "the", "pharmacy"], status: "correct"}]
    feedback: "ترتیب درست: Excuse me, where is the pharmacy?"
  en.a1.unit09.lesson04.exercise05.reply_as_leila:
    instruction: "به نقش لیلا، موقعیت دواخانه و دوری/نزدیکی آن را توضیح بدین."
    accepted_answers:
      - {value: "It's across from the hospital. No, it's not far. It's between the bank and the park.", status: "correct"}
    feedback: "همی جواب سه سوال جداگانه (موقعیت، دوری، موقعیت دقیق) را جواب می‌ده، نی یک واقعیت ترکیبی."
  en.a1.unit09.lesson04.exercise06.speak_directions:
    instruction: "به نقش لیلا، به دنیل با صدای بلند جواب بدین."
    accepted_answers:
      - {value: "It's across from the hospital. No, it's not far. It's between the bank and the park.", status: "correct"}
    feedback: "جواب کامل موقعیت، دوری/نزدیکی، و موقعیت دقیق دواخانه را پوشش می‌ده."
