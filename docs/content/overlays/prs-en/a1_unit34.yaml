review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit34 (sports/exercise), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Two real Dari-speaker English interference points, chosen to be the same underlying grammar phenomena as the fa-en overlay for this unit (both dialects share this core grammar, same precedent as unit33's dummy-it-subject/verb-per-mode points) but with the actual Dari text authored fresh, independently, per the sibling-isolation rule -- the fa-en overlay for this unit was not opened while authoring this file: (1) English's three-way sport/exercise verb collocation (play + ball-and-team sports, go + gerund for swimming/running, do + individual/generic exercise) has no parallel three-way split in Dari, which generalizes almost everything with a light-verb-plus-noun pattern built on کردن (فوتبال بازی کردن، شنا کردن، یوگا کردن، ورزش کردن all use کردن rather than three lexically distinct main verbs), so a Dari speaker must memorize which of the three English verbs pairs with which activity category; (2) English's distributive/rate a in frequency phrases (twice a week, three times a week) uses the indefinite article to mean per/each, a genuinely different function from its ordinary one/a(n) meaning, while Dari expresses the same rate meaning with the preposition در (در هفته) or the suffix ی (هفته‌ای), never with anything resembling an article. Dari-specific register used throughout (colloquial verb endings and vocabulary distinct from the Iranian Farsi overlay, per AUTHORING_GUIDE §3 -- استه for است). CORRECTION added by same-session-family review pass (not the mandatory fresh-context review): this file originally used هغه/هغوی for he/she/they, which are Pashto pronouns, not Dari -- Dari uses او (he/she)/آن‌ها (they). Every instance of هغه/هغوی in this file has been replaced with او/آن‌ها; می‌ته was left as-is (uncertain whether it is a genuine regional Dari colloquialism or the same class of error -- flag for the fresh-context reviewer to verify against a real Dari source, don't assume either way). Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit34.sports: {title: "ورزش و تمرین بدنی"}

lessons:
  en.a1.unit34.lesson01.sports_vocabulary: {title: "ورزش و تمرین"}
  en.a1.unit34.lesson02.frequency_and_places: {title: "چند وقت یک‌بار و کجا"}
  en.a1.unit34.lesson03.dialogue_weekend_plans: {title: "گپ در بارهٔ پلان‌های آخر هفته"}
  en.a1.unit34.lesson04.staying_active_together: {title: "متن: فعال ماندن همرای هم"}

teaching:
  en.a1.unit34.lesson01.teach.soccer: {title: "soccer", gloss: "فوتبال", note: "soccer یعنی فوتبال. فعلی که همرایش می‌آیه play استه: play soccer -- انگلیسی برای ورزش‌های تیمی توپی از فعل play کار می‌گیره. در دری هم برای همو جور ورزش‌ها از فعل مرکب «بازی کردن» کار گرفته می‌شه (فوتبال بازی کردن)، خو نکته اینجه استه که انگلیسی برای دسته‌های دیگهٔ ورزش (go/do) فعل را عوض می‌کنه، درحالیکه دری معمولاً یک ساختار «اسم + کردن» را برای اکثر ورزش‌ها کار می‌گیره (شنا کردن، یوگا کردن، ورزش کردن) -- پس باید یاد بگیرین کدام فعل انگلیسی با کدام دستهٔ ورزش می‌آیه.", example_gloss: "ما شنبه‌ها فوتبال بازی می‌کنیم."}
  en.a1.unit34.lesson01.teach.tennis: {title: "tennis", gloss: "تنیس", note: "tennis یعنی تنیس. مثل soccer، فعلش هم play استه: play tennis -- چون تنیس هم با توپ و وسیله بازی می‌شه، همو دستهٔ ورزش‌های توپی.", example_gloss: "او هر آخر هفته تنیس بازی می‌کنه."}
  en.a1.unit34.lesson01.teach.basketball: {title: "basketball", gloss: "بسکتبال", note: "basketball یعنی بسکتبال. اینم با فعل play می‌آیه: play basketball -- همو دستهٔ ورزش‌های توپی مثل soccer و tennis.", example_gloss: "آن‌ها توی پارک بسکتبال بازی می‌کنن."}
  en.a1.unit34.lesson01.teach.swimming: {title: "swimming", gloss: "شنا", note: "swimming یعنی شنا. اینجه فعل عوض می‌شه: go swimming (نی play swimming) -- انگلیسی برای فعالیت‌هایی مثل شنا و دویدن از فعل go همرای شکل ing-دار فعل کار می‌گیره. دری برای شنا از «شنا کردن» کار می‌گیره (فعل کردن، نی رفتن)، پس go اینجه یک فعل کاملاً جدا استه که باید حفظش کنین.", example_gloss: "من هفته‌ای دو بار شنا می‌کنم."}
  en.a1.unit34.lesson01.teach.yoga: {title: "yoga", gloss: "یوگا", note: "yoga یعنی یوگا. فعلش do استه: do yoga -- انگلیسی برای فعالیت‌های انفرادی مثل یوگا از فعل do کار می‌گیره، نی play و نی go. دری هم می‌گه «یوگا کردن» (یوگا می‌کنم)، خو نکتهٔ مهم اینه که انگلیسی سه فعل جدا (play/go/do) داره که باید هرکدام را با دستهٔ درست ورزش جفت کنین، درحالیکه دری معمولاً یک ساختار عمومی‌تر «اسم + کردن» داره.", example_gloss: "او صبح‌ها یوگا می‌کنه."}
  en.a1.unit34.lesson01.teach.exercise: {title: "exercise", gloss: "ورزش کردن / تمرین بدنی", note: "exercise یعنی ورزش‌کردن یا تمرین بدنی -- یک کلمهٔ عمومی برای هر نوع فعالیت بدنی. برخلاف soccer/swimming/yoga، خودِ exercise هم می‌تانه مستقیم به عنوان فعل کار بره، بدون اینکه لازم باشه play/go/do پیشش بیایه.", example_gloss: "هر روز ورزش می‌کنی؟"}

  en.a1.unit34.lesson02.teach.twice_a_week: {title: "twice a week", gloss: "هفته‌ای دو بار", note: "twice a week یعنی هفته‌ای دو بار. اینجه حرف تعریف نامعین a معنای معمولیش (یک) را نداره -- به عوضش معنای «در هر» یا «به ازای هر» می‌ته: عدد + a + واحد وخت یعنی چند بار در آن بازه. دری برای این معنا از حرف اضافهٔ در (در هفته) یا پسوند ی (هفته‌ای) کار می‌گیره، نی از یک حرف تعریف مثل انگلیسی.", example_gloss: "او هفته‌ای دو بار تنیس بازی می‌کنه."}
  en.a1.unit34.lesson02.teach.three_times_a_week: {title: "three times a week", gloss: "هفته‌ای سه بار", note: "three times a week یعنی هفته‌ای سه بار. مثل twice a week، اینجه هم a معنای «در هر» می‌ته، نی «یک» -- times (بار) به‌علاوهٔ a week (در هفته) با هم می‌شن «چند بار در هفته».", example_gloss: "او هفته‌ای سه بار شنا می‌کنه."}
  en.a1.unit34.lesson02.teach.on_weekends: {title: "on weekends", gloss: "آخر هفته‌ها", note: "on weekends یعنی آخر هفته‌ها. حرف اضافهٔ on پیش از weekends می‌آیه چون انگلیسی برای روزها و بازه‌های وخت مشخص از on کار می‌گیره؛ دری برای این عبارت ضرورت به حرف اضافه نداره -- می‌گیم «آخر هفته‌ها» بدون هیچ حرف اضافه.", example_gloss: "ما آخر هفته‌ها بسکتبال بازی می‌کنیم."}
  en.a1.unit34.lesson02.teach.gym: {title: "gym", gloss: "سالون ورزشی", note: "gym یعنی سالون ورزشی، یک جای با آله‌جات و صنف‌های ورزشی.", example_gloss: "او توی سالون ورزشی یوگا می‌کنه."}
  en.a1.unit34.lesson02.teach.pool: {title: "pool", gloss: "حوض شنا", note: "pool یعنی حوض شنا، یک جای پر از آب برای شنا کردن.", example_gloss: "من توی حوض شنا می‌کنم."}
  en.a1.unit34.lesson02.teach.how_often_question: {title: "How often do you exercise?", gloss: "شما چند وقت یک‌بار ورزش می‌کنین؟", note: "این سوال با how often (چند وقت یک‌بار) شروع می‌شه و بعدش فعل کمکی do می‌آیه چون فعل اصلی exercise استه -- ساختار سوالی مثل بقیهٔ سوال‌های do-support."}

  en.a1.unit34.lesson03.teach.dialogue_line1: {title: "سوال دنیل", gloss: "دنیل از لیلا می‌پرسه چطو شنبه همرای دیگرا فوتبال بازی می‌کنه؟", note: "شروع گپ با یک دعوت به فوتبال -- فعل play برای فوتبال."}
  en.a1.unit34.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "لیلا می‌گه زیاد از فوتبال خوشش نمی‌آیه و شنا را ترجیح می‌ته.", note: "don't really like یعنی «زیاد خوشم نمی‌آیه» -- یک طریقهٔ نرم برای نی‌گفتن به یک پیشنهاد."}
  en.a1.unit34.lesson03.teach.dialogue_line3: {title: "جواب دنیل", gloss: "دنیل می‌گه اشکال نداره و می‌پرسه لیلا چند وقت یک‌بار شنا می‌کنه.", note: "go swimming -- فعل go برای شنا، نی play یا do."}
  en.a1.unit34.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "لیلا می‌گه هفته‌ای دو بار، معمولاً توی حوض شنای نزدیک خانه‌ش.", note: "Twice a week -- یادآوری همو نکتهٔ a به معنای «در هر»."}
  en.a1.unit34.lesson03.teach.dialogue_line5: {title: "جواب دنیل", gloss: "دنیل می‌گه بعضی وخت‌ها یوگا هم می‌کنه، خو دویدن هنوز چیزیس که زیاد خوشش می‌آیه.", note: "do yoga -- فعل do برای یوگا، جدا از play و go."}

  en.a1.unit34.lesson04.teach.reading_passage: {title: "متن: دنیل، لیلا و میا", gloss: "دنیل، لیلا و میا هرکدام به طریقهٔ خودشان فعال می‌مانن. دنیل هر روز صبح پیش از کار می‌دوه. لیلا شنا را ترجیح می‌ته؛ او هفته‌ای دو بار به حوض شنا می‌ره. میا تازه به این گروپ شامل شده، خو از پیش هر یکشنبه همرای همسایه‌ش تنیس بازی می‌کنه. شنبه‌ها بعضی وخت‌ها همرای هم توی پارک فوتبال بازی می‌کنن، با آنکه فوتبال ورزش موردعلاقهٔ هیچ‌کدام‌شان نیست.", note: "این متن هر سه فعل مربوط به ورزش را با هم کار می‌گیره: goes running (فعل go)، plays tennis (فعل play)، play soccer (فعل play) -- توجه کنین هر ورزش فعل مخصوص خودش را داره، نی یک فعل مشترک."}

exercises:
  en.a1.unit34.lesson01.exercise01.listen_sport:
    instruction: "گوش کنین و ورزشی که گفته شد را انتخاب کنین."
    correct_option: "tennis"
    distractors: ["soccer", "basketball", "swimming", "yoga"]
    accepted_answers: [{value: "tennis", status: "correct"}]
    feedback: "tennis یعنی تنیس."
  en.a1.unit34.lesson01.exercise02.choose_swimming_meaning:
    instruction: "کدام کلمه یعنی حرکت‌دادن بدن توی آب برای ورزش یا تفریح؟"
    correct_option: "swimming"
    distractors: ["soccer", "yoga", "exercise"]
    accepted_answers: [{value: "swimming", status: "correct"}]
    feedback: "swimming یعنی شنا."
  en.a1.unit34.lesson01.exercise03.match_sports:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers:
      - value:
          - {left: "tennis", right: "a sport played with rackets and a small ball over a net"}
          - {left: "basketball", right: "a sport played by throwing a ball through a hoop"}
          - {left: "swimming", right: "moving your body in water for exercise or fun"}
          - {left: "exercise", right: "a general word for physical activity you do to stay fit and healthy"}
        status: "correct"
    feedback: "هر تعریف با یک واژه یا عبارت انگلیسی جور است."
  en.a1.unit34.lesson01.exercise04.order_tennis_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["She", "plays", "tennis", "every", "weekend."], status: "correct"}]
    feedback: "ترتیب درست: She plays tennis every weekend. -- برای تنیس فعل play کار می‌ره."
  en.a1.unit34.lesson01.exercise05.write_general_word:
    instruction: "کلمه‌ای را بنویسین که یعنی واژهٔ عمومی برای فعالیت بدنی که برای سالم ماندن انجام می‌دین."
    accepted_answers: [{value: "exercise", status: "correct"}]
    feedback: "exercise یعنی ورزش کردن یا تمرین بدنی."

  en.a1.unit34.lesson02.exercise01.listen_frequency:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "three times a week"
    distractors: ["twice a week", "on weekends", "every day"]
    accepted_answers: [{value: "three times a week", status: "correct"}]
    feedback: "three times a week یعنی هفته‌ای سه بار."
  en.a1.unit34.lesson02.exercise02.choose_gym_meaning:
    instruction: "کدام کلمه یعنی جایی با آله‌جات و صنف‌های ورزشی؟"
    correct_option: "gym"
    distractors: ["pool", "twice a week", "on weekends"]
    accepted_answers: [{value: "gym", status: "correct"}]
    feedback: "gym یعنی سالون ورزشی."
  en.a1.unit34.lesson02.exercise03.choose_pool_meaning:
    instruction: "کدام کلمه یعنی جای پر از آب برای شنا کردن؟"
    correct_option: "pool"
    distractors: ["gym", "twice a week", "on weekends"]
    accepted_answers: [{value: "pool", status: "correct"}]
    feedback: "pool یعنی حوض شنا."
  en.a1.unit34.lesson02.exercise04.order_swims_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["She", "swims", "three", "times", "a", "week."], status: "correct"}]
    feedback: "ترتیب درست: She swims three times a week."
  en.a1.unit34.lesson02.exercise05.translate_how_often:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «شما چند وقت یک‌بار ورزش می‌کنین؟»"
    accepted_answers:
      - {value: "How often do you exercise?", status: "correct"}
      - {value: "How often do you exercise", status: "correct"}
    feedback: "How often do you exercise? -- سوال با how often شروع می‌شه و فعل کمکی do می‌آیه."

  en.a1.unit34.lesson03.exercise01.comprehension_leila_prefers:
    instruction: "مطابق گپ، لیلا کدام فعالیت را ترجیح می‌ته؟"
    correct_option: "swimming"
    distractors: ["soccer", "tennis", "basketball"]
    accepted_answers: [{value: "swimming", status: "correct"}]
    feedback: "لیلا می‌گه شنا را ترجیح می‌ته."
  en.a1.unit34.lesson03.exercise02.comprehension_leila_frequency:
    instruction: "مطابق گپ، لیلا چند وقت یک‌بار شنا می‌کنه؟"
    correct_option: "Twice a week"
    distractors: ["Three times a week", "Once a week", "Every day"]
    accepted_answers: [{value: "Twice a week", status: "correct"}]
    feedback: "لیلا می‌گه هفته‌ای دو بار."
  en.a1.unit34.lesson03.exercise03.listen_dialogue_favorite:
    instruction: "مطابق گپ، ورزش موردعلاقهٔ دنیل چیست؟"
    correct_option: "running"
    distractors: ["tennis", "basketball"]
    accepted_answers: [{value: "running", status: "correct"}]
    feedback: "دنیل می‌گه دویدن هنوز چیزیس که زیاد خوشش می‌آیه."
  en.a1.unit34.lesson03.exercise04.respond_own_sport:
    instruction: "بگین کدام ورزش یا تمرین را خوش دارین."
    accepted_answers: ["I like soccer", "I like soccer.", "I like tennis", "I like tennis.", "I like basketball", "I like basketball.", "I like swimming", "I like swimming.", "I like yoga", "I like yoga.", "I prefer swimming", "I prefer swimming.", "I prefer running", "I prefer running."]
    feedback: "می‌تانین از الگوی I like/I prefer + نام ورزش کار بگیرین."

  en.a1.unit34.lesson04.exercise01.reading_daniel_activity:
    instruction: "مطابق متن، دنیل هر روز صبح چیکار می‌کنه؟"
    correct_option: "running"
    distractors: ["swimming", "tennis", "yoga"]
    accepted_answers: [{value: "running", status: "correct"}]
    feedback: "متن می‌گه دنیل هر روز صبح می‌دوه."
  en.a1.unit34.lesson04.exercise02.reading_mia_sport:
    instruction: "مطابق متن، میا هر یکشنبه کدام ورزش را بازی می‌کنه؟"
    correct_option: "tennis"
    distractors: ["soccer", "swimming", "basketball"]
    accepted_answers: [{value: "tennis", status: "correct"}]
    feedback: "متن می‌گه میا هر یکشنبه تنیس بازی می‌کنه."
  en.a1.unit34.lesson04.exercise03.reading_shared_activity:
    instruction: "مطابق متن، هر سه همکار شنبه‌ها همرای هم کدام ورزش را بازی می‌کنن؟"
    correct_option: "soccer"
    distractors: ["tennis", "basketball", "swimming"]
    accepted_answers: [{value: "soccer", status: "correct"}]
    feedback: "متن می‌گه شنبه‌ها بعضی وخت‌ها همرای هم فوتبال بازی می‌کنن."
  en.a1.unit34.lesson04.exercise04.write_own_sport_sentence:
    instruction: "یک جمله در بارهٔ ورزش یا تمرینی که انجام می‌دین بنویسین، با «I play»، «I go»، یا «I do»."
    accepted_answers: ["I play soccer", "I play soccer.", "I play tennis", "I play tennis.", "I play basketball", "I play basketball.", "I go swimming", "I go swimming.", "I go running", "I go running.", "I do yoga", "I do yoga."]
    feedback: "می‌تانین از الگوی I play/I go/I do کار بگیرین."
