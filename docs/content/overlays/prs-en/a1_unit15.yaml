  en.a1.unit15.lesson01.payment_words: {title: "کلمات رایج پرداخت"}
  en.a1.unit15.lesson02.asking_about_payment: {title: "پرسیدن دربارهٔ طریقهٔ پرداخت"}
  en.a1.unit15.lesson03.reading_a_receipt: {title: "خواندن رسید"}
  en.a1.unit15.lesson04.paying_dialogue: {title: "پرداخت در صندوق"}

teaching:
  en.a1.unit15.lesson01.teach.cash: {title: "نقد", gloss: "پیسهٔ نقد", note: "cash یعنی پیسهٔ نقد (نوت و سکه).", example_gloss: "من مقداری پیسهٔ نقد دارم."}
  en.a1.unit15.lesson01.teach.card: {title: "کارت", gloss: "کارت", note: "card کلمهٔ عمومی برای هر نوع کارت پرداخت پلاستیکی استه.", example_gloss: "کارتم آبی استه."}
  en.a1.unit15.lesson01.teach.credit_card: {title: "کارت اعتباری", gloss: "کارت اعتباری", note: "credit card یعنی کارتی که با آن پیسه قرض می‌گیرین و بعداً پس می‌دین."}
  en.a1.unit15.lesson01.teach.debit_card: {title: "کارت بانکی", gloss: "کارت بانکی/کارت خرید مستقیم", note: "debit card یعنی کارتی که مستقیماً از حساب بانکی تان پیسه کم می‌کنه."}
  en.a1.unit15.lesson01.teach.total: {title: "جمع کل", gloss: "جمع کل", note: "total یعنی مبلغ کل چیزی که باید پرداخت کنین.", example_gloss: "جمع کل چند استه؟"}

  en.a1.unit15.lesson02.teach.do_you_take_cards: {title: "کارت اعتباری قبول دارین؟", gloss: "کارت اعتباری قبول دارین؟", note: "Do you take credit cards؟ سوال رایج پیش از پرداخت استه."}
  en.a1.unit15.lesson02.teach.cash_only: {title: "ببخشین، فقط نقد", gloss: "ببخشین، فقط نقد قبول می‌کنیم", note: "Sorry, cash only جواب رایج دوکان‌هایی استه که کارت قبول ندارن."}
  en.a1.unit15.lesson02.teach.ill_pay_by_card: {title: "بلی، با کارت پرداخت می‌کنم", gloss: "بلی، با کارت پرداخت می‌کنم", note: "Yes, I'll pay by card تصمیم نهایی طریقهٔ پرداخت را اعلام می‌کنه."}

  en.a1.unit15.lesson03.teach.tax: {title: "مالیه", gloss: "مالیه", note: "tax یعنی مالیه؛ در اکثر دوکان‌های امریکا به قیمت اصلی افزوده می‌شه.", example_gloss: "مالیه یک دالر استه."}
  en.a1.unit15.lesson03.teach.receipt_text: {title: "متن رسید", gloss: "قهوه: سه دالر. ساندویچ: شش دالر. مالیه: یک دالر. جمع کل: ده دالر.", note: "همی یک رسید واقعی خرید استه."}
  en.a1.unit15.lesson03.teach.total_summary_sentence: {title: "جمع کل ده دالر استه", gloss: "جمع کل ده دالر استه", note: "همی جمله جمع کل رسید را در یک جملهٔ کامل بیان می‌کنه."}

  en.a1.unit15.lesson04.teach.q_total: {title: "پرسیدن جمع کل", gloss: "لیلا می‌پرسه جمع کل چند استه", note: "How much is the total؟ سوال معمول برای پرسیدن مبلغ نهایی استه."}
  en.a1.unit15.lesson04.teach.a_fifteen: {title: "جواب جمع کل", gloss: "دنیل می‌گه پانزده دالر استه", note: "It's fifteen dollars جواب کامل به سوال جمع کل استه."}
  en.a1.unit15.lesson04.teach.q_cards: {title: "پرسیدن پذیرش کارت", gloss: "لیلا می‌پرسه کارت اعتباری قبول دارن", note: "همو سوال آموزش‌دیده در درس قبل استه."}
  en.a1.unit15.lesson04.teach.a_yes_we_do: {title: "جواب پذیرش کارت", gloss: "دنیل می‌گه بلی، قبول داریم", note: "Yes, we do جواب کامل به سوال پذیرش کارت استه."}
  en.a1.unit15.lesson04.teach.closing_pay_by_card: {title: "تصمیم نهایی پرداخت", gloss: "لیلا می‌گه عالی، با کارت پرداخت می‌کنم", note: "همی جمله گفتگو را با تصمیم نهایی پرداخت می‌بنده."}

exercises:
  en.a1.unit15.lesson01.exercise01.listen_payment_method:
    instruction: "گوش کنین و کلمهٔ گفته‌شده را انتخاب کنین."
    correct_option: "کارت اعتباری"
    distractors: ["پیسهٔ نقد", "کارت بانکی", "جمع کل"]
    accepted_answers: [{value: "کارت اعتباری", status: "correct"}]
    feedback: "credit card یعنی کارت اعتباری."
  en.a1.unit15.lesson01.exercise02.choose_cash:
    instruction: "کلمهٔ درست برای نوت و سکه را انتخاب کنین."
    correct_option: "cash"
    distractors: ["card", "credit", "debit"]
    accepted_answers: [{value: "cash", status: "correct"}]
    feedback: "cash یعنی پیسهٔ نقد."
  en.a1.unit15.lesson01.exercise03.choose_total:
    instruction: "کلمهٔ درست برای «مبلغ کامل بدهی» را انتخاب کنین."
    correct_option: "total"
    distractors: ["cash", "card", "tax"]
    accepted_answers: [{value: "total", status: "correct"}]
    feedback: "total یعنی جمع کل."
  en.a1.unit15.lesson01.exercise04.match_payment_words:
    instruction: "هر توضیح را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "paper money and coins", right: "cash"}, {left: "general word for a plastic payment method", right: "card"}, {left: "borrowed money you pay back later", right: "credit"}, {left: "money taken directly from your account", right: "debit"}, {left: "the full amount you owe", right: "total"}, {left: "extra money added to a price by the government", right: "tax"}, {left: "the money unit used in the US", right: "dollars"}, {left: "to give money in exchange for something", right: "pay"}], status: "correct"}]
    feedback: "cash=پیسهٔ نقد، card=کارت، credit=اعتباری، debit=بانکی مستقیم."
  en.a1.unit15.lesson01.exercise05.write_total:
    instruction: "کلمهٔ انگلیسی برای «مبلغ کامل بدهی» را بنویسین."
    accepted_answers:
      - {value: "total", status: "correct"}
      - {value: "Total", status: "correct"}
    feedback: "total یعنی جمع کل."

  en.a1.unit15.lesson02.exercise01.listen_payment_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "پذیرش کارت اعتباری"
    distractors: ["قیمت کالا", "ساعت کاری", "جمع کل"]
    accepted_answers: [{value: "پذیرش کارت اعتباری", status: "correct"}]
    feedback: "Do you take credit cards؟ دربارهٔ پذیرش کارت اعتباری می‌پرسه."
  en.a1.unit15.lesson02.exercise02.choose_cash_only_response:
    instruction: "دوکان کارت قبول نداره. دوکاندار چه می‌گه؟"
    correct_option: "Sorry, cash only."
    distractors: ["Do you take credit cards?", "I'll pay by card.", "It's fifteen dollars."]
    accepted_answers: [{value: "Sorry, cash only.", status: "correct"}]
    feedback: "Sorry, cash only یعنی «ببخشین، فقط نقد»."
  en.a1.unit15.lesson02.exercise03.order_payment_question:
    instruction: "کلمات را برای پرسیدن پذیرش کارت اعتباری ترتیب کنین."
    accepted_answers: [{value: ["Do", "you", "take", "credit", "cards"], status: "correct"}]
    feedback: "ترتیب درست: Do you take credit cards?"
  en.a1.unit15.lesson02.exercise04.reply_pay_by_card:
    instruction: "بپرسین آیا کارت اعتباری قبول دارن، بعد بگین با کارت پرداخت می‌کنین."
    accepted_answers:
      - {value: "Do you take credit cards? Yes, I'll pay by card.", status: "correct"}
      - {value: "Do you take credit cards? Yes, I will pay by card.", status: "correct"}
    feedback: "جواب کامل هم سوال و هم تصمیم پرداخت را بیان می‌کنه."
  en.a1.unit15.lesson02.exercise05.write_payment_question:
    instruction: "بنویسین چطور می‌پرسین دوکان کارت اعتباری قبول داره."
    accepted_answers:
      - {value: "Do you take credit cards?", status: "correct"}
      - {value: "Do you take credit cards", status: "correct"}
    feedback: "Do you take credit cards؟ یعنی «کارت اعتباری قبول دارین؟»."

  en.a1.unit15.lesson03.exercise01.read_tax_amount:
    instruction: "رسید را بخوانین و مبلغ مالیه را بگین."
    correct_option: "$1"
    distractors: ["$3", "$6", "$10"]
    accepted_answers: [{value: "$1", status: "correct"}]
    feedback: "روی رسید Tax: $1 نوشته شده."
  en.a1.unit15.lesson03.exercise02.read_total_amount:
    instruction: "رسید را بخوانین و مبلغ جمع کل را بگین."
    correct_option: "$10"
    distractors: ["$3", "$6", "$1"]
    accepted_answers: [{value: "$10", status: "correct"}]
    feedback: "روی رسید Total: $10 نوشته شده."
  en.a1.unit15.lesson03.exercise03.choose_most_expensive_item:
    instruction: "کدام کالای تکی روی رسید گران‌تر استه؟"
    correct_option: "Sandwich"
    distractors: ["Coffee", "Tax", "Total"]
    accepted_answers: [{value: "Sandwich", status: "correct"}]
    feedback: "Sandwich با قیمت شش دالر از Coffee (سه دالر) گران‌تر استه."
  en.a1.unit15.lesson03.exercise04.match_receipt_fields:
    instruction: "هر آیتم رسید را به قیمت درستش وصل کنین."
    accepted_answers: [{value: [{left: "Coffee", right: "$3"}, {left: "Sandwich", right: "$6"}, {left: "Tax", right: "$1"}, {left: "Total", right: "$10"}], status: "correct"}]
    feedback: "قیمت‌ها دقیقاً مطابق متن رسید اند (سه بعلاوهٔ شش بعلاوهٔ یک مساوی ده)."
  en.a1.unit15.lesson03.exercise05.write_total_amount:
    instruction: "بنویسین جمع کل رسید ده دالر استه."
    accepted_answers:
      - {value: "The total is $10.", status: "correct"}
      - {value: "The total is $10", status: "correct"}
    feedback: "The total is $10 یعنی «جمع کل ده دالر استه»."

  en.a1.unit15.lesson04.exercise01.listen_total_amount:
    instruction: "گفتگو را گوش کنین و معلوم کنین جمع کل چند استه."
    correct_option: "پانزده دالر"
    distractors: ["ده دالر", "بیست دالر", "پنج دالر"]
    accepted_answers: [{value: "پانزده دالر", status: "correct"}]
    feedback: "دنیل می‌گه It's fifteen dollars."
  en.a1.unit15.lesson04.exercise02.listen_cards_accepted:
    instruction: "گوش کنین و معلوم کنین آیا کارت اعتباری قبول می‌شه."
    correct_option: "بلی، قبول می‌شه"
    distractors: ["نخیر، قبول نمی‌شه", "فقط کارت بانکی قبول می‌شه", "باید بپرسه"]
    accepted_answers: [{value: "بلی، قبول می‌شه", status: "correct"}]
    feedback: "دنیل می‌گه Yes, we do."
  en.a1.unit15.lesson04.exercise03.choose_final_payment_choice:
    instruction: "لیلا تصمیم می‌گیره چطور پرداخت کنه. او چه می‌گه؟"
    correct_option: "Great, I'll pay by card."
    distractors: ["How much is the total?", "Do you take credit cards?", "Yes, we do."]
    accepted_answers: [{value: "Great, I'll pay by card.", status: "correct"}]
    feedback: "Great, I'll pay by card یعنی «عالی، با کارت پرداخت می‌کنم»."
  en.a1.unit15.lesson04.exercise04.order_q_total:
    instruction: "کلمات را برای پرسیدن «جمع کل چند استه؟» ترتیب کنین."
    accepted_answers: [{value: ["How", "much", "is", "the", "total"], status: "correct"}]
    feedback: "ترتیب درست: How much is the total?"
  en.a1.unit15.lesson04.exercise05.reply_as_leila:
    instruction: "به نقش لیلا، جمع کل را بپرسین، دربارهٔ کارت اعتباری بپرسین، و طریقهٔ پرداخت را انتخاب کنین."
    accepted_answers:
      - {value: "How much is the total? Do you take credit cards? Great, I'll pay by card.", status: "correct"}
      - {value: "How much is the total? Do you take credit cards? Great, I will pay by card.", status: "correct"}
    feedback: "جواب کامل هر سه مرحله (جمع کل، سوال کارت، تصمیم پرداخت) را پوشش می‌ده."
  en.a1.unit15.lesson04.exercise06.speak_paying:
    instruction: "به نقش لیلا، پرداخت کامل را با صدای بلند انجام بدین."
    accepted_answers:
      - {value: "How much is the total? Do you take credit cards? Great, I'll pay by card.", status: "correct"}
      - {value: "How much is the total? Do you take credit cards? Great, I will pay by card.", status: "correct"}
    feedback: "جواب کامل جمع کل، سوال کارت، و تصمیم نهایی پرداخت را پوشش می‌ده."
