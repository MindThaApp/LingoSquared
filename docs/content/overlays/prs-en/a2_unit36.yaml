course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit36.document_correction: {title: "اصلاح یک غلطی در یک سند رسمی"}

lessons:
  en.a2.unit36.lesson01.document_vocabulary: {title: "تصدیق، غلطی، و کاپی"}
  en.a2.unit36.lesson02.asking_for_a_correction: {title: "خواهش اصلاح کردن"}
  en.a2.unit36.lesson03.reading_a_correction_notice: {title: "خواندن اطلاعیهٔ اصلاح"}
  en.a2.unit36.lesson04.correction_dialogue: {title: "پیش کاونتر دفتر ثبت‌نام"}

teaching:
  en.a2.unit36.lesson01.teach.certificate: {title: "certificate", gloss: "تصدیق", note: "*certificate* یعنی کاغذ رسمی که یک دفتر برای‌تان می‌ته؛ *registration certificate* یعنی تصدیق ثبت‌نام.", example_gloss: "تصدیق ثبت‌نامم دو هفته بعد از وقت ملاقات رسید."}
  en.a2.unit36.lesson01.teach.mistake: {title: "mistake", gloss: "غلطی", note: "*mistake* یعنی چیزی که غلط نوشته شده.", example_gloss: "در آدرسم بالای همی فورم یک غلطی استه."}
  en.a2.unit36.lesson01.teach.spelled: {title: "spelled", gloss: "املا شده", note: "*spelled* می‌گه که یک کلمه با کدام حرف‌ها و به کدام ترتیب نوشته شده.", example_gloss: "نامم با یک «ل» نوشته می‌شه، نی با دو تا."}
  en.a2.unit36.lesson01.teach.correct: {title: "correct", gloss: "اصلاح کردن", note: "*correct* اینجه یک فعل استه: چیزی را که غلط استه درست ساختن.", example_gloss: "کارمند می‌تانه امروز تخلصم را اصلاح کنه."}
  en.a2.unit36.lesson01.teach.copy: {title: "copy", gloss: "کاپی", note: "*copy* یعنی یک نسخهٔ دوم و عین همو سند.", example_gloss: "دفتر از هر سند یک کاپی نگه می‌داره."}
  en.a2.unit36.lesson01.teach.passport: {title: "passport", gloss: "پاسپورت", note: "*passport* یعنی سند سفر که عکس‌تان در آن استه.", example_gloss: "همیشه پاسپورتم را به یک ملاقات رسمی می‌برم."}
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are: {title: "there is و there are", gloss: "بالای تصدیقم یک غلطی استه. بالای تصدیقم دو غلطی استه.", note: "*there is* را برای یک چیز و *there are* را برای بیشتر از یک چیز استعمال می‌کنین."}

  en.a2.unit36.lesson02.teach.there_is_a_mistake: {title: "گفتن اینکه یک غلطی وجود داره", gloss: "بالای تصدیق ثبت‌نامم یک غلطی استه.", note: "*There is a mistake on...* شکل بی‌طرف و رسمی خبر دادن یک غلطی استه."}
  en.a2.unit36.lesson02.teach.name_spelled_wrong: {title: "گفتن اینکه دقیقاً چی غلط استه", gloss: "تخلصم غلط املا شده.", note: "*last name* یعنی تخلص؛ *first name* یعنی نام."}
  en.a2.unit36.lesson02.teach.could_you_correct_it: {title: "خواهش اصلاح کردن", gloss: "لطفاً اصلاحش کرده می‌تانین؟", note: "*Could you...?* مؤدبانه‌تر از *Can you...?* استه و به کاونتر رسمی می‌خوره."}
  en.a2.unit36.lesson02.teach.how_long_correction: {title: "پرسیدن اینکه چقدر وقت می‌گیره", gloss: "اصلاح چقدر وقت می‌گیره؟", note: "*How long...?* دربارهٔ مدت زمان می‌پرسه، نی دربارهٔ درازی."}
  en.a2.unit36.lesson02.teach.grammar_polite_request: {title: "دو شکل خواهش مؤدبانه", gloss: "لطفاً اصلاحش کرده می‌تانین؟ ممکن استه یک تصدیق نو بگیرم؟", note: "*Could you...?* یک کار را می‌خواد؛ *Would it be possible to...?* محتاطانه‌تر استه و می‌پرسه که آیا اصلاً امکان داره."}

  en.a2.unit36.lesson03.teach.working_days: {title: "working days", gloss: "روزهای کاری", note: "*working days* یعنی دوشنبه تا جمعه، بدون آخر هفته.", example_gloss: "دفتر هر مکتوب را در عرض پنج روز کاری جواب می‌ته."}
  en.a2.unit36.lesson03.teach.notice_text: {title: "متن اطلاعیهٔ اصلاح", gloss: "خواهش اصلاح دریافت شد. تصدیق ثبت‌نام شما در عرض پنج روز کاری اصلاح می‌شه. لطفاً پاسپورت و همی اطلاعیه را به دفتر بیارین. نمبر مرجع ۳۰۹۲.", note: "یک اطلاعیهٔ رسمی کوتاه و کاری استه: چی شده، چی می‌شه، و شما چی باید بکنین."}
  en.a2.unit36.lesson03.teach.bring_passport_and_notice: {title: "چیزی که باید همرای‌تان بیارین", gloss: "لطفاً پاسپورت و همی اطلاعیه را به دفتر بیارین.", note: "*bring ... to ...* یعنی یک چیز را به یک جای دیگه بردن."}

  en.a2.unit36.lesson04.teach.q_there_is_a_mistake: {title: "لیلا غلطی را خبر می‌ته", gloss: "لیلا می‌گه: سلام، بالای تصدیق ثبت‌نامم یک غلطی استه.", note: "*Hello* رسمی‌تر از *Hi* استه و به یک کاونتر رسمی بهتر می‌خوره."}
  en.a2.unit36.lesson04.teach.a_what_is_wrong: {title: "کارمند دقیق‌تر می‌پرسه", gloss: "کارمند می‌گه: فهمیدم. چی مشکل داره؟", note: "*I see* اینجه یعنی فهمیدم، گوش می‌کنم."}
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong: {title: "لیلا غلطی را شرح می‌ته و خواهش می‌کنه", gloss: "لیلا می‌گه: تخلصم غلط املا شده. لطفاً اصلاحش کرده می‌تانین؟", note: "همو دو جمله‌ای که در درس دوم یاد گرفتین، حالی پشت سر هم."}
  en.a2.unit36.lesson04.teach.a_do_you_have_passport: {title: "کارمند پاسپورت را می‌خواد", gloss: "کارمند می‌گه: البته. پاسپورت‌تان همرای‌تان استه؟", note: "*Do you have ... with you?* یعنی همی حالی همرای‌تان استه؟"}
  en.a2.unit36.lesson04.teach.q_here_it_is: {title: "لیلا پاسپورتش را می‌ته", gloss: "لیلا می‌گه: بلی، ایگه استه.", note: "*Here it is* را وقتی می‌گین که یک چیز را به کسی می‌دین."}
  en.a2.unit36.lesson04.teach.a_copy_and_send: {title: "کارمند شرح می‌ته که چی می‌کنه", gloss: "کارمند می‌گه: تشکر. یک کاپی می‌گیرم و اصلاح را امروز روان می‌کنم.", note: "*make a copy* یک ترکیب ثابت استه: کاپی گرفتن."}
  en.a2.unit36.lesson04.teach.q_how_long: {title: "لیلا می‌پرسه چقدر وقت می‌گیره", gloss: "لیلا می‌پرسه: اصلاح چقدر وقت می‌گیره؟", note: "همو سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit36.lesson04.teach.a_within_five_working_days: {title: "جواب کارمند", gloss: "کارمند می‌گه: در عرض پنج روز کاری. لطفاً پاسپورت و همی اطلاعیه را به دفتر بیارین.", note: "*within* یعنی در عرض یک مدت معین، پس حداکثر بعد از پنج روز کاری."}
  en.a2.unit36.lesson04.teach.q_thank_you: {title: "لیلا تشکر می‌کنه", gloss: "لیلا می‌گه: بسیار تشکر.", note: "*very much* تشکر را کمی پُررنگ‌تر می‌سازه."}

