course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit40.online_order_problem: {title: "یک مشکل همرای فرمایش آنلاین"}

lessons:
  en.a2.unit40.lesson01.online_order_vocabulary: {title: "فرمایش، رساندن، و بستهٔ خساره‌دیده"}
  en.a2.unit40.lesson02.explaining_the_problem: {title: "شرح مشکل و خواهش یک عدد نو"}
  en.a2.unit40.lesson03.reading_a_return_message: {title: "خواندن جواب دکان"}
  en.a2.unit40.lesson04.online_order_dialogue: {title: "زنگ زدن دربارهٔ چراغ شکسته"}

teaching:
  en.a2.unit40.lesson01.teach.order: {title: "order", gloss: "فرمایش", note: "*order* یعنی خود فرمایش؛ به حیث فعل *to order* یعنی فرمایش دادن.", example_gloss: "فرمایشم دو روز ناوقت رسید."}
  en.a2.unit40.lesson01.teach.delivery: {title: "delivery", gloss: "رساندن", note: "*delivery* یعنی همو وختی که فرمایش‌تان به خانه‌تان رسانده می‌شه.", example_gloss: "رساندن سه‌شنبه صبح بود."}
  en.a2.unit40.lesson01.teach.parcel: {title: "parcel", gloss: "بسته", note: "*parcel* یعنی همو بستهٔ پیچانده‌شده که پیش دروازه‌تان می‌آرن.", example_gloss: "بسته بیرون پیش دروازه‌ام مانده شده بود."}
  en.a2.unit40.lesson01.teach.damaged: {title: "damaged", gloss: "خساره‌دیده", note: "*damaged* یعنی چیزی که در راه صدمه دیده، اما شاید هنوز کار کنه -- معمولاً دربارهٔ قطی گفته می‌شه.", example_gloss: "قطی وختی رسید خساره‌دیده بود."}
  en.a2.unit40.lesson01.teach.broken: {title: "broken", gloss: "شکسته", note: "*broken* از *damaged* سخت‌تر استه: خود چیز دیگه کار نمی‌کنه.", example_gloss: "چراغ داخل بسته شکسته بود."}
  en.a2.unit40.lesson01.teach.replacement: {title: "replacement", gloss: "یک عدد نو به عوض", note: "*replacement* یعنی یک عدد نو به عوض عدد خراب؛ *refund* یعنی پس‌دادن پول.", example_gloss: "به عوض پس گرفتن پول، یک عدد نو خواستم."}
  en.a2.unit40.lesson01.teach.grammar_arrived: {title: "arrived و has not arrived yet", gloss: "فرمایشم دیروز رسید. فرمایشم هنوز نرسیده.", note: "*arrived* را همرای یک وخت گذشته می‌گین؛ *has not arrived yet* می‌گه که هنوز هم منتظر استین."}

  en.a2.unit40.lesson02.teach.report_order_problem: {title: "گفتن اینکه برای چی زنگ زدین", gloss: "می‌خواستم یک مشکل همرای فرمایشم را خبر بتم.", note: "*I'd like to report a problem with...* عین همو شکل مؤدبانهٔ خبر دادن استه که در واحد ۲۹ برای چکیدن آب یاد گرفتین."}
  en.a2.unit40.lesson02.teach.lamp_arrived_broken: {title: "گفتن اینکه چی خراب استه", gloss: "چراغ شکسته رسید.", note: "*arrived broken* یعنی وختی رسید، از پیش شکسته بود."}
  en.a2.unit40.lesson02.teach.ask_for_replacement: {title: "انتخاب بین عدد نو و پس گرفتن پول", gloss: "به عوض پس گرفتن پول، یک عدد نو گرفته می‌تانم؟", note: "*instead of* دو امکان را مقابل هم می‌مانه: اولی را می‌خواین، نی دومی را."}
  en.a2.unit40.lesson02.teach.my_order_number: {title: "دادن نمبر فرمایش", gloss: "نمبر فرمایشم ۸۱۵۴ استه.", note: "نمبر فرمایش‌تان را فوراً می‌گین -- کارمند همرای آن فرمایش‌تان را پیدا می‌کنه."}
  en.a2.unit40.lesson02.teach.grammar_instead_of: {title: "instead of برای انتخاب کردن", gloss: "به عوض پس گرفتن پول، یک عدد نو گرفته می‌تانم؟ به عوض تبدیل، پس گرفتن پول را می‌خواهم.", note: "بعد از *instead of* همیشه یک اسم می‌آیه: *instead of a refund*، نی *instead of get a refund*."}

  en.a2.unit40.lesson03.teach.box: {title: "box", gloss: "قطی", note: "*box* یعنی همو قطی‌ای که فرمایش‌تان در آن استه؛ *parcel* یعنی تمام بسته آن‌طور که رسانده می‌شه.", example_gloss: "قطی را تا رسیدن چراغ نو نگه دارین."}
  en.a2.unit40.lesson03.teach.return_message: {title: "جواب دکان", gloss: "از پیام‌تان تشکر. متأسف استیم که چراغ‌تان شکسته رسید. لطفاً چراغ را دوباره در قطی بمانین و به پستخانه ببرین. یک چراغ نو در عرض سه روز کاری روان می‌شه. نمبر فرمایش ۸۱۵۴.", note: "یک جواب خدمات مشتری همیشه سه چیز را می‌گه: مشکل، کاری که شما باید بکنین، و کاری که آن‌ها می‌کنن."}
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box: {title: "کاری که همرای چراغ شکسته باید بکنین", gloss: "لطفاً چراغ را دوباره در قطی بمانین و به پستخانه ببرین.", note: "*put ... back in ...* یعنی یک چیز را دوباره به همو جای اولش ماندن."}

  en.a2.unit40.lesson04.teach.q_report_a_problem: {title: "لیلا به دکان آنلاین زنگ می‌زنه", gloss: "لیلا می‌گه: سلام، می‌خواستم یک مشکل همرای فرمایشم را خبر بتم.", note: "در تیلفون فوراً می‌گین برای چی زنگ زدین."}
  en.a2.unit40.lesson04.teach.a_what_is_the_problem: {title: "کارمند دقیق‌تر می‌پرسه", gloss: "کارمند می‌گه: متأسف استم که همی را می‌شنوم. مشکل چیست؟", note: "*I'm sorry to hear that* جواب ثابت و مؤدبانهٔ یک کارمند به خبر بد استه."}
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged: {title: "لیلا مشکل را شرح می‌ته", gloss: "لیلا می‌گه: چراغ شکسته رسید. قطی خساره‌دیده بود.", note: "به فرق دقت کنین: قطی *damaged* استه، چراغ *broken*."}
  en.a2.unit40.lesson04.teach.a_ask_order_number: {title: "کارمند نمبر فرمایش را می‌خواهه", gloss: "کارمند می‌گه: فهمیدم. نمبر فرمایش‌تان را برایم گفته می‌تانین؟", note: "همو شکل سوال غیرمستقیم *Could you tell me...?* که در واحد ۳۹ یاد گرفتین."}
  en.a2.unit40.lesson04.teach.q_order_number_8154: {title: "لیلا نمبر فرمایشش را می‌گه", gloss: "لیلا می‌گه: نمبر فرمایشم ۸۱۵۴ استه.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit40.lesson04.teach.a_refund_or_replacement: {title: "کارمند دو انتخاب پیشنهاد می‌کنه", gloss: "کارمند می‌گه: تشکر. پول‌تان را پس می‌خواین یا یک عدد نو؟", note: "*or* اینجه دو امکان را پهلوی هم می‌مانه؛ شما یکی را انتخاب می‌کنین."}
  en.a2.unit40.lesson04.teach.q_replacement_please: {title: "لیلا عدد نو را انتخاب می‌کنه", gloss: "لیلا می‌گه: به عوض پس گرفتن پول، یک عدد نو گرفته می‌تانم؟", note: "همو سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days: {title: "کارمند مشکل را حل می‌کنه", gloss: "کارمند می‌گه: البته. یک چراغ نو در عرض سه روز کاری روان می‌شه.", note: "همو وعده‌ای که در پیام درس سوم هم بود."}
  en.a2.unit40.lesson04.teach.q_thank_you: {title: "لیلا تشکر می‌کنه", gloss: "لیلا می‌گه: بسیار تشکر.", note: "*very much* تشکر را کمی پُررنگ‌تر می‌سازه."}

exercises:
  en.a2.unit40.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "delivery"
    distractors: ["parcel", "replacement", "box"]
    accepted_answers: [{value: "delivery", status: "correct"}]
    feedback: "*delivery* یعنی رساندن."
  en.a2.unit40.lesson01.exercise02.choose_damaged_word:
    instruction: "کدام کلمه یک قطی را شرح می‌ته که در راه صدمه دیده، اما هنوز قابل استعمال استه؟"
    correct_option: "damaged"
    distractors: ["broken", "delivery", "replacement"]
    accepted_answers: [{value: "damaged", status: "correct"}]
    feedback: "*damaged* یعنی خساره‌دیده -- قطی خساره‌دیده بود، اما چراغ داخلش *broken* بود."
  en.a2.unit40.lesson01.exercise03.choose_replacement_word:
    instruction: "کدام کلمه یعنی یک عدد نو که به عوض عدد شکسته برای‌تان روان می‌شه؟"
    correct_option: "replacement"
    distractors: ["refund", "delivery", "parcel"]
    accepted_answers: [{value: "replacement", status: "correct"}]
    feedback: "*replacement* یعنی یک عدد نو به عوض؛ *refund* یعنی پس‌دادن پول."
  en.a2.unit40.lesson01.exercise04.match_online_order_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "order", right: "the things you asked a shop to send you"}
          - {left: "delivery", right: "the moment your things are brought to your home"}
          - {left: "parcel", right: "the wrapped box that is brought to your door"}
          - {left: "damaged", right: "hurt on the way, but perhaps still usable"}
          - {left: "broken", right: "in pieces, and no longer working"}
          - {left: "replacement", right: "a new item sent in place of a bad one"}
          - {left: "refund", right: "your money given back to you"}
          - {left: "exchange", right: "the same item swapped for a different size or color"}
        status: "correct"
    feedback: "*order*=فرمایش، *delivery*=رساندن، *parcel*=بسته، *damaged*=خساره‌دیده، *broken*=شکسته، *replacement*=یک عدد نو، *refund*=پس‌دادن پول، *exchange*=تبدیل."
  en.a2.unit40.lesson01.exercise05.write_replacement:
    instruction: "کلمه‌ای را بنویسین که یعنی یک عدد نو که به عوض عدد شکسته برای‌تان روان می‌شه."
    accepted_answers:
      - {value: "replacement", status: "correct"}
      - {value: "Replacement", status: "correct"}
    feedback: "*replacement* یعنی یک عدد نو به عوض."

  en.a2.unit40.lesson02.exercise01.listen_the_problem:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "The lamp arrived broken"
    distractors: ["My order number is 8154.", "Could I have a replacement instead of a refund?", "I'd like to report a problem with my order."]
    accepted_answers: [{value: "The lamp arrived broken", status: "correct"}]
    feedback: "همی یعنی: چراغ شکسته رسید."
  en.a2.unit40.lesson02.exercise02.choose_opening_line:
    instruction: "به یک دکان آنلاین دربارهٔ یک رساندن خراب زنگ می‌زنین. اول چی می‌گین؟"
    correct_option: "I'd like to report a problem with my order."
    distractors: ["The lamp arrived broken.", "My order number is 8154.", "Could I have a replacement instead of a refund?"]
    accepted_answers: [{value: "I'd like to report a problem with my order.", status: "correct"}]
    feedback: "اول خبر می‌تین که یک مشکل وجود داره؛ جزئیاتش را بعد شرح می‌تین."
  en.a2.unit40.lesson02.exercise03.choose_ask_replacement:
    instruction: "یک چراغ نو می‌خواین، نی پول‌تان را. چطور مؤدبانه می‌پرسین؟"
    correct_option: "Could I have a replacement instead of a refund?"
    distractors: ["I'd like to report a problem with my order.", "The lamp arrived broken.", "My order number is 8154."]
    accepted_answers: [{value: "Could I have a replacement instead of a refund?", status: "correct"}]
    feedback: "*instead of a refund* روشن می‌سازه که پول‌تان را پس نمی‌خواین."
  en.a2.unit40.lesson02.exercise04.order_lamp_arrived_broken:
    instruction: "کلمات را طوری تنظیم کنین که «چراغ شکسته رسید» شود."
    accepted_answers: [{value: ["The", "lamp", "arrived", "broken"], status: "correct"}]
    feedback: "ترتیب درست *The lamp arrived broken* استه."
  en.a2.unit40.lesson02.exercise05.order_ask_replacement:
    instruction: "کلمات را طوری تنظیم کنین که «به عوض پس گرفتن پول، یک عدد نو گرفته می‌تانم؟» شود."
    accepted_answers: [{value: ["Could", "I", "have", "a", "replacement", "instead", "of", "a", "refund"], status: "correct"}]
    feedback: "ترتیب درست *Could I have a replacement instead of a refund* استه."
  en.a2.unit40.lesson02.exercise06.reply_ask_replacement:
    instruction: "کارمند می‌پرسه که پول‌تان را پس می‌خواین یا یک عدد نو. مؤدبانه یک عدد نو را به عوض پس گرفتن پول بخواین."
    accepted_answers:
      - {value: "Could I have a replacement instead of a refund?", status: "correct"}
      - {value: "Could I have a replacement instead of a refund", status: "correct"}
    feedback: "*Could I have a replacement instead of a refund?* همو سوال همی درس استه."
  en.a2.unit40.lesson02.exercise07.write_order_problem:
    instruction: "بنویسین که می‌خواین یک مشکل همرای فرمایش‌تان را خبر بتین."
    accepted_answers:
      - {value: "I'd like to report a problem with my order.", status: "correct"}
      - {value: "I'd like to report a problem with my order", status: "correct"}
    feedback: "*I'd like to report a problem with my order* یعنی می‌خواستم یک مشکل همرای فرمایشم را خبر بتم."

  en.a2.unit40.lesson03.exercise01.read_what_to_do:
    instruction: "دکان از لیلا می‌خواهه همرای چراغ شکسته چی بکنه؟"
    correct_option: "put the lamp back in the box"
    distractors: ["keep the lamp at home", "bring the lamp to the shop", "throw the lamp away"]
    accepted_answers: [{value: "put the lamp back in the box", status: "correct"}]
    feedback: "در پیام نوشته *put the lamp back in the box*."
  en.a2.unit40.lesson03.exercise02.read_where_to_bring_it:
    instruction: "لیلا بسته را به کجا ببره؟"
    correct_option: "to the post office"
    distractors: ["to the shop", "to her neighbor", "to the delivery van"]
    accepted_answers: [{value: "to the post office", status: "correct"}]
    feedback: "در پیام نوشته *bring it to the post office*."
  en.a2.unit40.lesson03.exercise03.read_when_new_lamp:
    instruction: "چراغ نو کِی روان می‌شه؟"
    correct_option: "within three working days"
    distractors: ["within one working day", "within five working days", "within one month"]
    accepted_answers: [{value: "within three working days", status: "correct"}]
    feedback: "در پیام نوشته *within three working days*."
  en.a2.unit40.lesson03.exercise04.choose_order_number:
    instruction: "نمبر فرمایش در پیام چند استه؟"
    correct_option: "8154"
    distractors: ["8145", "1854", "8514"]
    accepted_answers: [{value: "8154", status: "correct"}]
    feedback: "در پایان پیام نوشته *Order number 8154*."
  en.a2.unit40.lesson03.exercise05.order_new_lamp_sentence:
    instruction: "کلمات را طوری تنظیم کنین که «یک چراغ نو در عرض سه روز کاری روان می‌شه» شود."
    accepted_answers: [{value: ["A", "new", "lamp", "will", "be", "sent", "within", "three", "working", "days"], status: "correct"}]
    feedback: "ترتیب درست *A new lamp will be sent within three working days* استه."
  en.a2.unit40.lesson03.exercise06.write_put_it_back:
    instruction: "هدایت دکان را بنویسین، که با Please put شروع می‌شه."
    accepted_answers:
      - {value: "Please put the lamp back in the box and bring it to the post office.", status: "correct"}
      - {value: "Please put the lamp back in the box and bring it to the post office", status: "correct"}
    feedback: "*Please put the lamp back in the box and bring it to the post office* یعنی چراغ را دوباره در قطی بمانین و به پستخانه ببرین."

  en.a2.unit40.lesson04.exercise01.listen_the_problem:
    instruction: "گفتگو را گوش کنین و انتخاب کنین که فرمایش چی مشکل داره."
    correct_option: "The lamp arrived broken"
    distractors: ["The lamp arrived late", "The order has not arrived yet", "The shop sent the wrong lamp"]
    accepted_answers: [{value: "The lamp arrived broken", status: "correct"}]
    feedback: "لیلا می‌گه *The lamp arrived broken*."
  en.a2.unit40.lesson04.exercise02.listen_resolution:
    instruction: "گوش کنین و انتخاب کنین که چراغ نو کِی روان می‌شه."
    correct_option: "within three working days"
    distractors: ["within one working day", "within five working days", "within two weeks"]
    accepted_answers: [{value: "within three working days", status: "correct"}]
    feedback: "کارمند می‌گه *A new lamp will be sent within three working days*."
  en.a2.unit40.lesson04.exercise03.choose_what_leila_asks_for:
    instruction: "لیلا چی می‌خواهه؟"
    correct_option: "a replacement instead of a refund"
    distractors: ["a refund instead of a replacement", "an exchange for a bigger lamp", "a new delivery date"]
    accepted_answers: [{value: "a replacement instead of a refund", status: "correct"}]
    feedback: "لیلا می‌پرسه *Could I have a replacement instead of a refund?*"
  en.a2.unit40.lesson04.exercise04.order_order_number:
    instruction: "کلمات را طوری تنظیم کنین که «نمبر فرمایشم ۸۱۵۴ استه» شود."
    accepted_answers: [{value: ["My", "order", "number", "is", "8154"], status: "correct"}]
    feedback: "ترتیب درست *My order number is 8154* استه."
