      - {left: "table", right: "جایی که برای خوردن پشتش می‌شینین"}
      - {left: "menu", right: "فهرست غذاها و نوشیدنی‌هایی که می‌تانین فرمایش بتین"}
      - {left: "order", right: "خواستن غذا یا نوشیدنی دلخواه تان"}
      - {left: "bill", right: "کاغذی که نشان می‌ته چقدر باید پول بتین"}
    accepted_answers:
      - value:
          - {left: "restaurant", right: "جایی که برای خوردن غذای پخته‌شدهٔ دیگران می‌رین"}
          - {left: "waiter", right: "کسی که فرمایش تان را می‌گیره و غذا می‌آره"}
          - {left: "table", right: "جایی که برای خوردن پشتش می‌شینین"}
          - {left: "menu", right: "فهرست غذاها و نوشیدنی‌هایی که می‌تانین فرمایش بتین"}
          - {left: "order", right: "خواستن غذا یا نوشیدنی دلخواه تان"}
          - {left: "bill", right: "کاغذی که نشان می‌ته چقدر باید پول بتین"}
        status: "correct"
    feedback: "restaurant=رستورانت، waiter=گارسون، table=میز، menu=مینو، order=فرمایش دادن، bill=بل."
  en.a1.unit56.lesson01.exercise04.order_waiter_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "waiter", "is", "very", "friendly."], status: "correct"}]
    feedback: "ترتیب درست: The waiter is very friendly."
  en.a1.unit56.lesson01.exercise05.write_bill:
    instruction: "کلمه‌ای را بنویسین که یعنی کاغذی که نشان می‌ته چند باید پرداخت کنین."
    accepted_answers: [{value: "bill", status: "correct"}]
    feedback: "bill یعنی بل."

  en.a1.unit56.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Is this table free?"
    distractors: ["Can I order now?", "How much is the salad?", "Enjoy your meal!"]
