review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 5 fixes -- مرغه->مرغ (spurious suffix, 9 places); یک شام->یک شب; listen_select total-bill distractors twelve/seven (heard in same audio) replaced with ten/fifteen/twenty; accepted answers added (speak_response, writing_prompt). NATIVE FLAGS: سلاته vs سلاد spelling. Prior note: New overlay against the shared English realization unit56 (restaurant), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit56.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit56.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choice: restaurant -> رستورانت (the standard Dari/Afghan spelling with the extra ت, per CLAUDE.md's own §3 precedent list, as opposed to Iranian Persian's رستوران); order (the verb) -> فرمایش دادن (the common Dari phrase for ordering food at a restaurant); the rest of the vocabulary (گارسون/waiter, میز/table, مینو/menu, بل/bill) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه for است، می‌شه/می‌تانیم for می‌شود/می‌توانیم, ایگه as the informal presentative particle, بنشینین as the polite-plural imperative for 'sit'). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's fixed formulaic phrase 'Enjoy your meal!' (said by a waiter before eating begins) has no word-by-word compositional match in Dari, whose own fixed formula, نوش جان ('may it nourish your soul,' literally), is a single idiomatic expression with entirely different internal structure -- a Dari speaker must learn this as an idiom-for-idiom swap, not build it from 'enjoy' + 'your' + 'meal'; (2) English's polite request pattern 'Could we have ___, please?' (Could we have the bill, please?) repurposes 'have' to mean 'be given/receive,' a distinct sense from ordinary possession -- Dari expresses the identical polite request with a verb meaning 'get/take' from the requester's own viewpoint (می‌تانیم ... بگیریم), so a Dari speaker must learn this specific English reuse of 'have' as a request-marker verb. Three-speaker dialogue (Leila, Waiter, Mia) handled the same way as unit48/unit50-unit55's precedent -- every price fact kept in its own single-fact turn, matching the realization's own deliberate zero-combined-fact discipline. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: the Waiter states three distinct price/total facts across three separate turns (chicken $12, salad $7, total bill $19) -- confirmed each answers a genuinely different question type, so cross-using them as distractors is safe per the realization's own analysis, though invented values were used as the default anyway; also cross-checked twelve/seven/nineteen dollars against unit07/unit40/unit51-unit55's prices for accidental collision, none found, matching the realization's own note. This unit's own menu-reading card (Chicken $12/Salad $7/Pizza $10/Juice $3) has its 'cheapest item' comprehension exercise (menu_cheapest_item, answer juice) cross-checked against all four listed prices per AUTHORING_GUIDE.md #11 -- juice at $3 is uniquely the lowest, no ambiguity. Multi-clause accepted_answers (lesson04's write_own_restaurant_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit56.restaurant: {title: "غذا خوردن در رستورانت"}

lessons:
  en.a1.unit56.lesson01.restaurant_vocabulary: {title: "کلمات رستورانت"}
  en.a1.unit56.lesson02.phrases_for_the_restaurant: {title: "عبارات رستورانت"}
  en.a1.unit56.lesson03.dialogue_at_the_restaurant: {title: "گفتگو: توی رستورانت"}
  en.a1.unit56.lesson04.a_meal_at_the_restaurant: {title: "متن: یک غذا در رستورانت"}

teaching:
  en.a1.unit56.lesson01.teach.restaurant: {title: "restaurant", gloss: "رستورانت", note: "restaurant یعنی رستورانت -- جایی که می‌رین تا یک غذایی که کس دیگه پخته بخورین.", example_gloss: "این رستورانت هر شب باز استه."}
  en.a1.unit56.lesson01.teach.waiter: {title: "waiter", gloss: "گارسون", note: "waiter یعنی گارسون -- کسی که فرمایش تان را می‌گیره و غذا را می‌آره.", example_gloss: "گارسون خیلی مهربان استه."}
  en.a1.unit56.lesson01.teach.table: {title: "table", gloss: "میز", note: "table یعنی میز -- جایی که برای خوردن غذا می‌نشینین.", example_gloss: "میز ما نزدیک کلکین استه."}
  en.a1.unit56.lesson01.teach.menu: {title: "menu", gloss: "مینو", note: "menu یعنی مینو -- لیست غذا و نوشیدنی‌هایی که می‌تانین فرمایش بتین.", example_gloss: "می‌تانم مینو را ببینم، لطفاً؟"}
  en.a1.unit56.lesson01.teach.order: {title: "order", gloss: "فرمایش دادن", note: "order یعنی فرمایش دادن -- خواستن غذا یا نوشیدنی‌ای که می‌خواین.", example_gloss: "می‌خواهم مرغ فرمایش بتم."}
  en.a1.unit56.lesson01.teach.bill: {title: "bill", gloss: "بل", note: "bill یعنی بل -- کاغذی که نشان می‌ته چند باید پرداخت کنین.", example_gloss: "بل ده دالر بود."}

  en.a1.unit56.lesson02.teach.is_this_table_free: {title: "Is this table free?", gloss: "این میز خالی استه؟", note: "Is this ...? یک ساختار سوالی معمول استه -- free اینجه یعنی خالی."}
  en.a1.unit56.lesson02.teach.can_i_order_now: {title: "Can I order now?", gloss: "می‌تانم حالی فرمایش بتم؟", note: "now یعنی حالی."}
  en.a1.unit56.lesson02.teach.id_like_the_salad: {title: "I'd like the salad, please.", gloss: "سلاته می‌خواهم، لطفاً.", note: "همو ساختار I'd like که در واحدهای پیش دیدین."}
  en.a1.unit56.lesson02.teach.how_much_is_the_salad: {title: "How much is the salad?", gloss: "سلاته چند دالر استه؟", note: "همو ساختار How much که در واحدهای پیش دیدین."}
  en.a1.unit56.lesson02.teach.could_we_have_the_bill: {title: "Could we have the bill, please?", gloss: "می‌تانیم بل را بگیریم، لطفاً؟", note: "Could we have ...? یک طریقهٔ مؤدبانه برای خواستن یک چیز استه -- have اینجه معنای «گرفتن» می‌ته، نی «داشتن» معمولی."}
  en.a1.unit56.lesson02.teach.enjoy_your_meal: {title: "Enjoy your meal!", gloss: "نوش جان!", note: "Enjoy your meal! یک عبارت ثابت استه که یک گارسون پیش از خوردن غذا می‌گه. دری همو نقش را با یک عبارت کاملاً جدا (نوش جان) پُر می‌کنه، نی ترجمهٔ کلمه‌به‌کلمه."}

  en.a1.unit56.lesson03.teach.dialogue_line1: {title: "سوال لیلا", gloss: "سلام! این میز خالی استه؟", note: "همو سوال Is this table free؟ که در لسن ۲ یاد گرفتین."}
  en.a1.unit56.lesson03.teach.dialogue_line2: {title: "جواب گارسون", gloss: "بلی، لطفاً اینجه بنشینین.", note: "sit here یعنی اینجه بنشینین."}
  en.a1.unit56.lesson03.teach.dialogue_line3: {title: "خواهش میا", gloss: "می‌تانم مینو را ببینم، لطفاً؟", note: "Could I ...? یک طریقهٔ مؤدبانه برای خواستن اجازه استه."}
  en.a1.unit56.lesson03.teach.dialogue_line4: {title: "جواب گارسون", gloss: "البته، ایگه استه.", note: "here you are یک عبارت وخت دادن یک چیز به کسی استه."}
  en.a1.unit56.lesson03.teach.dialogue_line5: {title: "فرمایش لیلا", gloss: "مرغ می‌خواهم، لطفاً.", note: "I'd like the ___ یک ساختار معمول برای فرمایش دادن یک غذا استه."}
  en.a1.unit56.lesson03.teach.dialogue_line6: {title: "فرمایش میا", gloss: "سلاته می‌خواهم، لطفاً.", note: "همو ساختار I'd like the ___ که در خط پیش یاد گرفتین."}
  en.a1.unit56.lesson03.teach.dialogue_line7: {title: "گفتهٔ گارسون", gloss: "انتخاب خوبی استه! نوش جان!", note: "همو عبارت Enjoy your meal که در لسن ۲ یاد گرفتین."}
  en.a1.unit56.lesson03.teach.dialogue_line8: {title: "سوال لیلا", gloss: "مرغ چند دالر استه؟", note: "همو سوال How much is که در لسن ۲ یاد گرفتین."}
  en.a1.unit56.lesson03.teach.dialogue_line9: {title: "جواب گارسون", gloss: "مرغ دوازده دالر استه.", note: "یک حقیقت جداگانه -- قیمت مرغ."}
  en.a1.unit56.lesson03.teach.dialogue_line10: {title: "سوال میا", gloss: "سلاته چند دالر استه؟", note: "همو ساختار How much is که در خط پیش یاد گرفتین."}
  en.a1.unit56.lesson03.teach.dialogue_line11: {title: "جواب گارسون", gloss: "سلاته هفت دالر استه.", note: "یک حقیقت جداگانه -- قیمت سلاته، جدا از قیمت مرغ."}
  en.a1.unit56.lesson03.teach.dialogue_line12: {title: "خواهش لیلا", gloss: "می‌تانیم بل را بگیریم، لطفاً؟", note: "همو عبارت Could we have the bill که در لسن ۲ یاد گرفتین."}
  en.a1.unit56.lesson03.teach.dialogue_line13: {title: "جواب گارسون", gloss: "نزده دالر می‌شه، لطفاً.", note: "این یک حقیقت جداگانه استه -- مجموع بل، جدا از قیمت مرغ و سلاته."}

  en.a1.unit56.lesson04.teach.restaurant_menu: {title: "مینوی رستورانت", gloss: "مینوی رستورانت: مرغ - ۱۲ دالر. سلاته - ۷ دالر. پیتزا - ۱۰ دالر. آب‌میوه - ۳ دالر.", note: "این یک مینوی رستورانت استه -- قیمت هر غذا را کنار نامش نشان می‌ته."}
  en.a1.unit56.lesson04.teach.reading_passage: {title: "متن: یک غذا در رستورانت", gloss: "یک سفر به رستورانت: یک شب، لیلا و میا تصمیم گرفتن که یک رستورانت جدید در مرکز شهر امتحان کنن. یک گارسون آن‌ها را به یک میز نزدیک کلکین برد. او یک مینو با مرغ، سلاته، پیتزا، و آب‌میوه به شان آورد. لیلا مرغ فرمایش داد، و میا سلاته فرمایش داد. مرغ دوازده دالر بود، و سلاته هفت دالر بود. درحالیکه غذا می‌خوردن، در بارهٔ صنف عکاسی میا گپ زدن. وقتی تمام کردن، گارسون بل را آورد. برای هردوی شان نزده دالر بود. لیلا گفت که رستورانت عالی بود، و میا گفت که می‌خواد دفعهٔ بعد دانیال را هم بیاره.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- decided, showed, brought, ordered, was, talked, finished, said."}

exercises:
