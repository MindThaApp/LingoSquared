    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "menu"
    distractors: ["restaurant", "waiter", "table", "bill"]
    accepted_answers: [{value: "menu", status: "correct"}]
    feedback: "menu یعنی مینو."
  en.a1.unit56.lesson01.exercise02.choose_waiter_meaning:
    instruction: "کدام کلمه یعنی کسی که فرمایش تان را می‌گیره و غذا را می‌آره؟"
    correct_option: "waiter"
    distractors: ["menu", "table", "bill"]
    accepted_answers: [{value: "waiter", status: "correct"}]
    feedback: "waiter یعنی گارسون."
  en.a1.unit56.lesson01.exercise03.match_restaurant_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "restaurant", right: "جایی که برای خوردن غذای پخته‌شدهٔ دیگران می‌رین"}
