  en.a1.unit56.lesson03.exercise03.listen_dialogue_total_bill:
    instruction: "مطابق گفتگو، مجموع بل چند دالر استه؟"
    correct_option: "nineteen dollars"
    distractors: ["ten dollars", "fifteen dollars", "twenty dollars"]
    accepted_answers: [{value: "nineteen dollars", status: "correct"}]
    feedback: "مجموع بل نزده دالر (nineteen dollars) استه."
  en.a1.unit56.lesson03.exercise04.respond_own_restaurant_statement:
    instruction: "بگین مرغ چند دالر استه، سلاته چند دالر استه، یا مجموع بل چند دالر استه."
    accepted_answers: ["The chicken is twelve dollars", "The chicken is twelve dollars.", "The salad is seven dollars", "The salad is seven dollars.", "That's nineteen dollars", "That's nineteen dollars.", "That's nineteen dollars, please", "That's nineteen dollars, please.", "The chicken costs twelve dollars", "The chicken costs twelve dollars.", "The salad costs seven dollars", "The salad costs seven dollars.", "The total is nineteen dollars", "The total is nineteen dollars.", "The bill is nineteen dollars", "The bill is nineteen dollars.", "It's nineteen dollars", "It's nineteen dollars.", "That is nineteen dollars", "That is nineteen dollars.", "The chicken is $12", "The salad is $7", "That's $19"]
    feedback: "می‌تانین بگین The chicken is twelve dollars یا That's nineteen dollars."

  en.a1.unit56.lesson04.exercise01.menu_pizza_price:
    instruction: "مطابق مینو، کدام غذا ده دالر استه؟"
    correct_option: "pizza"
    distractors: ["chicken", "salad", "juice"]
    accepted_answers: [{value: "pizza", status: "correct"}]
    feedback: "پیتزا (pizza) ده دالر استه."
  en.a1.unit56.lesson04.exercise02.menu_cheapest_item:
    instruction: "مطابق مینو، کدام غذا ارزان‌ترین استه؟"
    correct_option: "juice"
    distractors: ["chicken", "salad", "pizza"]
    accepted_answers: [{value: "juice", status: "correct"}]
    feedback: "آب‌میوه (juice) با سه دالر ارزان‌ترین استه."
  en.a1.unit56.lesson04.exercise03.reading_chicken_price:
    instruction: "مطابق متن، مرغ چند دالر بود؟"
    correct_option: "twelve dollars"
    distractors: ["seven dollars", "ten dollars", "three dollars"]
    accepted_answers: [{value: "twelve dollars", status: "correct"}]
    feedback: "مرغ دوازده دالر (twelve dollars) بود."
  en.a1.unit56.lesson04.exercise04.reading_total_bill:
    instruction: "مطابق متن، مجموع بل چند دالر بود؟"
    correct_option: "nineteen dollars"
    distractors: ["twelve dollars", "seven dollars", "ten dollars"]
    accepted_answers: [{value: "nineteen dollars", status: "correct"}]
    feedback: "مجموع بل نزده دالر (nineteen dollars) بود."
