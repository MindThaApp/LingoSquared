  en.a1.unit03.lesson03.teach.im_25: {title: "من بیست و پنج سال دارم", gloss: "من بیست و پنج سال دارم", note: "در انگلیسی برای گفتن سن از فعل be استفاده می‌شه (I'm)، نی فعلی معادل «داشتن» مثل دری."}
  en.a1.unit03.lesson03.teach.how_much: {title: "قیمت این چند است؟", gloss: "قیمت این چند است؟", note: "How much is this؟ سوال معمول برای قیمت یک چیز است."}
  en.a1.unit03.lesson03.teach.its_ten_dollars: {title: "ده دالر است", gloss: "ده دالر است", note: "It's ten dollars جواب معمول به سوال قیمت است."}
  en.a1.unit03.lesson03.teach.phone_question: {title: "نمبر تلفون‌تان چند است؟", gloss: "نمبر تلفون‌تان چند است؟", note: "What's your phone number؟ برای پرسیدن نمبر تلفون استعمال می‌شه."}
  en.a1.unit03.lesson03.teach.phone_answer: {title: "گفتن نمبر تلفون", gloss: "نمبرم پنج پنج پنج، یک دو سه چار است", note: "در انگلیسی معمول است که نمبر تلفون رقم به رقم گفته شه، نی به شکل عدد کامل."}

