  en.a1.unit03.lesson04.teach.shop_age: {title: "بیست ساله", gloss: "لیلا می‌گه بیست سال قدامت داره", note: "It's twenty years old دربارهٔ اشیا یعنی «قدامتش بیست سال است»، نی سن یک شخص."}

exercises:
  en.a1.unit03.lesson01.exercise01.listen_low:
    instruction: "گوش کنین و شمیر گفته‌شده را انتخاب کنین."
    correct_option: "پنج"
    distractors: ["دو", "هفت", "نُه"]
    accepted_answers: [{value: "پنج", status: "correct"}]
    feedback: "five یعنی پنج."
  en.a1.unit03.lesson01.exercise02.choose_three:
    instruction: "واژهٔ درست انگلیسی را برای ۳ انتخاب کنین."
    correct_option: "three"
    distractors: ["two", "four", "seven"]
    accepted_answers: [{value: "three", status: "correct"}]
    feedback: "three یعنی سه."
  en.a1.unit03.lesson01.exercise03.choose_eight:
    instruction: "واژهٔ درست انگلیسی را برای ۸ انتخاب کنین."
    correct_option: "eight"
    distractors: ["six", "nine", "ten"]
    accepted_answers: [{value: "eight", status: "correct"}]
    feedback: "eight یعنی هشت."
  en.a1.unit03.lesson01.exercise04.match_digits:
    instruction: "هر رقم را به شمیر درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "1", right: "one"}, {left: "2", right: "two"}, {left: "3", right: "three"}, {left: "4", right: "four"}], status: "correct"}]
    feedback: "1=one، 2=two، 3=three، 4=four."
  en.a1.unit03.lesson01.exercise05.order_seven:
    instruction: "واژهٔ درست را برای نوشتن ۷ به انگلیسی انتخاب کنین."
    accepted_answers: [{value: ["seven"], status: "correct"}]
    feedback: "seven یعنی هفت."
  en.a1.unit03.lesson01.exercise06.write_ten:
    instruction: "شمیر ۱۰ را به انگلیسی بنویسین."
    accepted_answers:
      - {value: "ten", status: "correct"}
      - {value: "Ten", status: "correct"}
    feedback: "ten یعنی ده."

  en.a1.unit03.lesson02.exercise01.listen_tens:
    instruction: "گوش کنین و شمیر گفته‌شده را انتخاب کنین."
    correct_option: "چهل"
    distractors: ["چارده", "چارصد", "چارتا"]
    accepted_answers: [{value: "چهل", status: "correct"}]
    feedback: "forty یعنی چهل."
  en.a1.unit03.lesson02.exercise02.choose_thirteen:
    instruction: "واژهٔ درست را برای ۱۳ انتخاب کنین."
    correct_option: "thirteen"
    distractors: ["thirty", "thirty-one", "three"]
    accepted_answers: [{value: "thirteen", status: "correct"}]
    feedback: "thirteen یعنی سیزده؛ با thirty (سی) اشتباه نکنین."
  en.a1.unit03.lesson02.exercise03.choose_twenty_one:
    instruction: "واژهٔ درست را برای ۲۱ انتخاب کنین."
    correct_option: "twenty-one"
    distractors: ["twelve", "twenty", "one twenty"]
    accepted_answers: [{value: "twenty-one", status: "correct"}]
    feedback: "twenty-one یعنی بیست و یک؛ ده‌گان همیشه پیش از یک‌گان می‌آیه."
  en.a1.unit03.lesson02.exercise04.match_tens:
    instruction: "هر شمیر را به واژهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "20", right: "twenty"}, {left: "30", right: "thirty"}, {left: "40", right: "forty"}, {left: "50", right: "fifty"}], status: "correct"}]
    feedback: "20=twenty، 30=thirty، 40=forty، 50=fifty."
  en.a1.unit03.lesson02.exercise05.order_hundred:
    instruction: "واژه‌ها را برای نوشتن ۱۰۰ به انگلیسی ترتیب کنین."
    accepted_answers: [{value: ["one", "hundred"], status: "correct"}]
    feedback: "۱۰۰ به انگلیسی one hundred نوشته می‌شه."
  en.a1.unit03.lesson02.exercise06.write_fifteen:
    instruction: "شمیر ۱۵ را به انگلیسی بنویسین."
    accepted_answers:
      - {value: "fifteen", status: "correct"}
      - {value: "Fifteen", status: "correct"}
    feedback: "fifteen یعنی پانزده."

  en.a1.unit03.lesson03.exercise01.listen_age_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "سن مخاطب"
    distractors: ["نام مخاطب", "نمبر تلفون مخاطب", "قیمت یک سامان"]
    accepted_answers: [{value: "سن مخاطب", status: "correct"}]
    feedback: "How old are you؟ سن مخاطب را می‌پرسه."
  en.a1.unit03.lesson03.exercise02.choose_age_answer:
    instruction: "جوابی را انتخاب کنین که سن گوینده را بیان می‌کنه."
    correct_option: "I'm twenty-five years old."
    distractors: ["It's ten dollars.", "My name is Leila.", "It's twenty years old."]
    accepted_answers: [{value: "I'm twenty-five years old.", status: "correct"}]
    feedback: "I'm twenty-five years old یعنی «من بیست و پنج سال دارم»."
  en.a1.unit03.lesson03.exercise03.order_price:
    instruction: "برای جواب قیمت، واژه‌ها را ترتیب کنین."
    accepted_answers: [{value: ["It's", "ten", "dollars"], status: "correct"}]
    feedback: "ترتیب درست It's ten dollars است."
  en.a1.unit03.lesson03.exercise04.listen_phone_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "نمبر تلفون مخاطب"
    distractors: ["سن مخاطب", "نام مخاطب", "قیمت یک سامان"]
    accepted_answers: [{value: "نمبر تلفون مخاطب", status: "correct"}]
    feedback: "What's your phone number؟ دربارهٔ نمبر تلفون مخاطب می‌پرسه."
  en.a1.unit03.lesson03.exercise05.reply_phone:
    instruction: "به این سوال دربارهٔ نمبر تلفون، رقم به رقم جواب بدین."
    accepted_answers:
      - {value: "It's five-five-five, one-two-three-four.", status: "correct"}
      - {value: "It's five five five, one two three four.", status: "correct"}
    feedback: "نمبر تلفون در انگلیسی معمولاً رقم به رقم گفته می‌شه."
  en.a1.unit03.lesson03.exercise06.write_price:
    instruction: "قیمت ۱۰ دالر را به انگلیسی بنویسین."
    accepted_answers:
      - {value: "It's ten dollars.", status: "correct"}
      - {value: "It's ten dollars", status: "correct"}
      - {value: "Ten dollars.", status: "acceptable_with_note", note: "درست است، اما جملهٔ کامل با It's شروع می‌شه."}
      - {value: "Ten dollars", status: "acceptable_with_note", note: "درست است، اما جملهٔ کامل با It's شروع می‌شه."}
    feedback: "It's ten dollars یعنی «ده دالر است»."

  en.a1.unit03.lesson04.exercise01.listen_price_this:
    instruction: "گفتگو را گوش کنین و معلوم کنین قیمت اولین سامان چند است."
    correct_option: "پنج دالر"
    distractors: ["دو دالر", "ده دالر", "بیست دالر"]
    accepted_answers: [{value: "پنج دالر", status: "correct"}]
    feedback: "لیلا می‌گه It's five dollars."
  en.a1.unit03.lesson04.exercise02.listen_price_apples:
    instruction: "گوش کنین و معلوم کنین قیمت سیب‌ها چند است."
    correct_option: "دو دالر"
    distractors: ["پنج دالر", "ده دالر", "بیست دالر"]
    accepted_answers: [{value: "دو دالر", status: "correct"}]
    feedback: "لیلا می‌گه They're two dollars."
  en.a1.unit03.lesson04.exercise03.choose_shop_age:
    instruction: "جواب درست دربارهٔ قدامت دوکان را انتخاب کنین."
    correct_option: "It's twenty years old!"
    distractors: ["It's five dollars.", "I'm twenty-five years old.", "They're two dollars."]
    accepted_answers: [{value: "It's twenty years old!", status: "correct"}]
    feedback: "لیلا می‌گه دوکان بیست سال قدامت داره."
  en.a1.unit03.lesson04.exercise04.order_apples_question:
    instruction: "واژه‌ها را برای پرسیدن قیمت سیب‌ها ترتیب کنین."
    accepted_answers: [{value: ["how", "much", "are", "the", "apples"], status: "correct"}]
    feedback: "ترتیب درست how much are the apples است."
  en.a1.unit03.lesson04.exercise05.reply_as_leila:
    instruction: "به نقش لیلا، دربارهٔ قیمت هر دو سامان جواب بدین."
    accepted_answers:
      - {value: "It's five dollars. They're two dollars.", status: "correct"}
      - {value: "It's five dollars, they're two dollars.", status: "correct"}
      - {value: "It's five dollars and they're two dollars.", status: "correct"}
    feedback: "جواب کامل قیمت هر دو سامان را جدا بیان می‌کنه."
  en.a1.unit03.lesson04.exercise06.speak_prices:
    instruction: "به نقش لیلا، به هر سه سوال (قیمت، قیمت سیب‌ها، قدامت دوکان) جواب بدین."
    accepted_answers:
      - {value: "It's five dollars. They're two dollars. It's twenty years old.", status: "correct"}
      - {value: "It's five dollars, they're two dollars, and it's twenty years old.", status: "correct"}
      - {value: "It's five dollars. They're two dollars. It's twenty years old!", status: "correct"}
    feedback: "جواب کامل هر سه سوال قیمت و قدامت را پوشش می‌ده."
