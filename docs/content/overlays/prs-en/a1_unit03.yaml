  en.a1.unit03.lesson02.teach.fifteen: {title: "پانزده", gloss: "پانزده", note: "fifteen یعنی پانزده؛ از five به شکل نامنظم ساخته شده (fif- نی five-).", example_gloss: "من در کوچهٔ شمارهٔ پانزده زندگی می‌کنم."}
  en.a1.unit03.lesson02.teach.twenty: {title: "بیست", gloss: "بیست", note: "twenty یعنی بیست.", example_gloss: "من در کوچهٔ شمارهٔ بیست زندگی می‌کنم."}
  en.a1.unit03.lesson02.teach.twenty_one: {title: "بیست و یک", gloss: "بیست و یک", note: "در انگلیسی، برخلاف دری، ده‌گان و یک‌گان با خط تیره نوشته می‌شه: twenty-one، نی twenty and one."}
  en.a1.unit03.lesson02.teach.thirty: {title: "سی", gloss: "سی", note: "thirty یعنی سی؛ از three به شکل نامنظم ساخته شده (thir- نی three-).", example_gloss: "قیمت آن سی دالر استه."}
  en.a1.unit03.lesson02.teach.forty: {title: "چهل", gloss: "چهل", note: "forty یعنی چهل؛ املایش بدون u استه (نی fourty).", example_gloss: "قیمت آن چهل دالر استه."}
  en.a1.unit03.lesson02.teach.fifty: {title: "پنجاه", gloss: "پنجاه", note: "fifty یعنی پنجاه.", example_gloss: "قیمت آن پنجاه دالر استه."}
  en.a1.unit03.lesson02.teach.hundred: {title: "صد", gloss: "صد", note: "one hundred یعنی صد."}

  en.a1.unit03.lesson03.teach.how_old: {title: "سن‌تان چند استه؟", gloss: "سن‌تان چند استه؟", note: "How old are you؟ سوال معمول برای پرسیدن سن استه."}
  en.a1.unit03.lesson03.teach.im_25: {title: "من بیست و پنج سال دارم", gloss: "من بیست و پنج سال دارم", note: "در انگلیسی برای گفتن سن از فعل be استفاده می‌شه (I'm)، نی فعلی معادل «داشتن» مثل دری."}
  en.a1.unit03.lesson03.teach.how_much: {title: "قیمت این چند استه؟", gloss: "قیمت این چند استه؟", note: "How much is this؟ سوال معمول برای قیمت یک چیز استه."}
  en.a1.unit03.lesson03.teach.its_ten_dollars: {title: "ده دالر استه", gloss: "ده دالر استه", note: "It's ten dollars جواب معمول به سوال قیمت استه."}
  en.a1.unit03.lesson03.teach.phone_question: {title: "نمبر تلفون‌تان چند استه؟", gloss: "نمبر تلفون‌تان چند استه؟", note: "What's your phone number؟ برای پرسیدن نمبر تلفون استعمال می‌شه."}
  en.a1.unit03.lesson03.teach.phone_answer: {title: "گفتن نمبر تلفون", gloss: "نمبرم پنج پنج پنج، یک دو سه چار استه", note: "در انگلیسی معمول استه که نمبر تلفون رقم به رقم گفته شه، نی به شکل عدد کامل."}

  en.a1.unit03.lesson04.teach.market: {title: "بازار", gloss: "بازار", note: "market یعنی جایی که میوه و سبزی و سامان روزمره خرید و فروش می‌شه.", example_gloss: "ما در بازار استیم."}
  en.a1.unit03.lesson04.teach.apples: {title: "سیب‌ها", gloss: "سیب‌ها", note: "apples جمع apple (سیب) استه.", example_gloss: "سیب‌ها تازه استند."}
  en.a1.unit03.lesson04.teach.opening: {title: "پرسیدن قیمت", gloss: "دنیل قیمت یک سامان را می‌پرسه", note: "How much is this؟ دربارهٔ قیمت یک چیز مشخص می‌پرسه."}
  en.a1.unit03.lesson04.teach.price_five: {title: "پنج دالر", gloss: "لیلا می‌گه پنج دالر استه", note: "It's five dollars جواب قیمت یک چیز مفرد استه."}
  en.a1.unit03.lesson04.teach.ask_apples: {title: "پرسیدن قیمت سیب‌ها", gloss: "دنیل قیمت سیب‌ها را هم می‌پرسه", note: "چون apples جمع استه، به‌جای is از are استفاده می‌شه: how much are the apples؟"}
  en.a1.unit03.lesson04.teach.price_two: {title: "دو دالر", gloss: "لیلا می‌گه دو دالر استه", note: "چون سیب‌ها جمع اند، از They're استفاده می‌شه، نی It's."}
  en.a1.unit03.lesson04.teach.ask_shop_age: {title: "پرسیدن قدامت دوکان", gloss: "دنیل می‌پرسه این دوکان چند سال قدامت داره", note: "how old is this shop مثل انسان‌ها برای اشیا هم استعمال می‌شه، یعنی «چقدر قدامت داره»."}
  en.a1.unit03.lesson04.teach.shop_age: {title: "بیست ساله", gloss: "لیلا می‌گه بیست سال قدامت داره", note: "It's twenty years old دربارهٔ اشیا یعنی «قدامتش بیست سال استه»، نی سن یک شخص."}

exercises:
  en.a1.unit03.lesson01.exercise01.listen_low:
    instruction: "گوش کنین و شمیر گفته‌شده را انتخاب کنین."
    correct_option: "پنج"
    distractors: ["دو", "هفت", "نُه"]
    accepted_answers: [{value: "پنج", status: "correct"}]
    feedback: "five یعنی پنج."
  en.a1.unit03.lesson01.exercise02.choose_three:
    instruction: "کلمهٔ درست انگلیسی را برای ۳ انتخاب کنین."
    correct_option: "three"
    distractors: ["two", "four", "seven"]
    accepted_answers: [{value: "three", status: "correct"}]
    feedback: "three یعنی سه."
  en.a1.unit03.lesson01.exercise03.choose_eight:
    instruction: "کلمهٔ درست انگلیسی را برای ۸ انتخاب کنین."
    correct_option: "eight"
    distractors: ["six", "nine", "ten"]
    accepted_answers: [{value: "eight", status: "correct"}]
    feedback: "eight یعنی هشت."
  en.a1.unit03.lesson01.exercise04.match_digits:
    instruction: "هر رقم را به شمیر درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "1", right: "one"}, {left: "2", right: "two"}, {left: "3", right: "three"}, {left: "4", right: "four"}, {left: "0", right: "zero"}, {left: "5", right: "five"}, {left: "6", right: "six"}, {left: "7", right: "seven"}, {left: "8", right: "eight"}, {left: "9", right: "nine"}, {left: "10", right: "ten"}], status: "correct"}]
    feedback: "1=one، 2=two، 3=three، 4=four."
  en.a1.unit03.lesson01.exercise05.order_seven:
    instruction: "کلمهٔ درست را برای نوشتن ۷ به انگلیسی انتخاب کنین."
    accepted_answers: [{value: ["seven"], status: "correct"}]
    feedback: "seven یعنی هفت."
  en.a1.unit03.lesson01.exercise06.write_ten:
    instruction: "شمیر ۱۰ را به انگلیسی بنویسین."
    accepted_answers:
      - {value: "ten", status: "correct"}
      - {value: "Ten", status: "correct"}
    feedback: "ten یعنی ده."

  en.a1.unit03.lesson02.exercise01.listen_tens:
    instruction: "گوش کنین و شمیر گفته‌شده را انتخاب کنین."
    correct_option: "چهل"
    distractors: ["چارده", "چارصد", "چارتا"]
    accepted_answers: [{value: "چهل", status: "correct"}]
    feedback: "forty یعنی چهل."
  en.a1.unit03.lesson02.exercise02.choose_thirteen:
    instruction: "کلمهٔ درست را برای ۱۳ انتخاب کنین."
    correct_option: "thirteen"
    distractors: ["thirty", "thirty-one", "three"]
    accepted_answers: [{value: "thirteen", status: "correct"}]
    feedback: "thirteen یعنی سیزده؛ با thirty (سی) اشتباه نکنین."
  en.a1.unit03.lesson02.exercise03.choose_twenty_one:
    instruction: "کلمهٔ درست را برای ۲۱ انتخاب کنین."
    correct_option: "twenty-one"
    distractors: ["twelve", "twenty", "one twenty"]
    accepted_answers: [{value: "twenty-one", status: "correct"}]
    feedback: "twenty-one یعنی بیست و یک؛ ده‌گان همیشه پیش از یک‌گان می‌آیه."
  en.a1.unit03.lesson02.exercise04.match_tens:
    instruction: "هر شمیر را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "20", right: "twenty"}, {left: "30", right: "thirty"}, {left: "40", right: "forty"}, {left: "50", right: "fifty"}, {left: "11", right: "eleven"}, {left: "12", right: "twelve"}, {left: "13", right: "thirteen"}, {left: "15", right: "fifteen"}, {left: "21", right: "twenty-one"}, {left: "100", right: "one hundred"}], status: "correct"}]
    feedback: "20=twenty، 30=thirty، 40=forty، 50=fifty."
  en.a1.unit03.lesson02.exercise05.order_hundred:
    instruction: "کلمه‌ها را برای نوشتن ۱۰۰ به انگلیسی ترتیب کنین."
    accepted_answers: [{value: ["one", "hundred"], status: "correct"}]
    feedback: "۱۰۰ به انگلیسی one hundred نوشته می‌شه."
  en.a1.unit03.lesson02.exercise06.write_fifteen:
    instruction: "شمیر ۱۵ را به انگلیسی بنویسین."
    accepted_answers:
      - {value: "fifteen", status: "correct"}
      - {value: "Fifteen", status: "correct"}
    feedback: "fifteen یعنی پانزده."

  en.a1.unit03.lesson03.exercise01.listen_age_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "سن طرف مقابل"
    distractors: ["نام طرف مقابل", "نمبر تلفون طرف مقابل", "قیمت یک سامان"]
    accepted_answers: [{value: "سن طرف مقابل", status: "correct"}]
    feedback: "How old are you؟ سن طرف مقابل را می‌پرسه."
  en.a1.unit03.lesson03.exercise02.choose_age_answer:
    instruction: "جوابی را انتخاب کنین که سن گوینده را بیان می‌کنه."
    correct_option: "I'm twenty-five years old."
    distractors: ["It's ten dollars.", "My name is Leila.", "It's twenty years old."]
    accepted_answers: [{value: "I'm twenty-five years old.", status: "correct"}]
    feedback: "I'm twenty-five years old یعنی «من بیست و پنج سال دارم»."
  en.a1.unit03.lesson03.exercise03.order_price:
    instruction: "برای جواب قیمت، کلمه‌ها را ترتیب کنین."
    accepted_answers: [{value: ["It's", "ten", "dollars"], status: "correct"}]
    feedback: "ترتیب درست: It's ten dollars."
  en.a1.unit03.lesson03.exercise04.listen_phone_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "نمبر تلفون طرف مقابل"
    distractors: ["سن طرف مقابل", "نام طرف مقابل", "قیمت یک سامان"]
    accepted_answers: [{value: "نمبر تلفون طرف مقابل", status: "correct"}]
    feedback: "What's your phone number؟ دربارهٔ نمبر تلفون طرف مقابل می‌پرسه."
  en.a1.unit03.lesson03.exercise05.reply_phone:
    instruction: "به این سوال دربارهٔ نمبر تلفون، رقم به رقم جواب بدین."
    accepted_answers:
      - {value: "It's five-five-five, one-two-three-four.", status: "correct"}
      - {value: "It's five five five, one two three four.", status: "correct"}
    feedback: "نمبر تلفون در انگلیسی معمولاً رقم به رقم گفته می‌شه."
  en.a1.unit03.lesson03.exercise06.write_price:
    instruction: "قیمت ۱۰ دالر را به انگلیسی بنویسین."
    accepted_answers:
      - {value: "It's ten dollars.", status: "correct"}
      - {value: "It's ten dollars", status: "correct"}
      - {value: "Ten dollars.", status: "acceptable_with_note", note: "درست استه، اما جملهٔ کامل با It's شروع می‌شه."}
      - {value: "Ten dollars", status: "acceptable_with_note", note: "درست استه، اما جملهٔ کامل با It's شروع می‌شه."}
    feedback: "It's ten dollars یعنی «ده دالر استه»."

  en.a1.unit03.lesson04.exercise01.listen_price_this:
    instruction: "گفتگو را گوش کنین و معلوم کنین قیمت اولین سامان چند استه."
    correct_option: "پنج دالر"
    distractors: ["دو دالر", "ده دالر", "بیست دالر"]
    accepted_answers: [{value: "پنج دالر", status: "correct"}]
    feedback: "لیلا می‌گه It's five dollars."
  en.a1.unit03.lesson04.exercise02.listen_price_apples:
    instruction: "گوش کنین و معلوم کنین قیمت سیب‌ها چند استه."
    correct_option: "دو دالر"
    distractors: ["پنج دالر", "ده دالر", "بیست دالر"]
    accepted_answers: [{value: "دو دالر", status: "correct"}]
    feedback: "لیلا می‌گه They're two dollars."
  en.a1.unit03.lesson04.exercise03.choose_shop_age:
    instruction: "جواب درست دربارهٔ قدامت دوکان را انتخاب کنین."
    correct_option: "It's twenty years old!"
    distractors: ["It's five dollars.", "I'm twenty-five years old.", "They're two dollars."]
    accepted_answers: [{value: "It's twenty years old!", status: "correct"}]
    feedback: "لیلا می‌گه دوکان بیست سال قدامت داره."
  en.a1.unit03.lesson04.exercise04.order_apples_question:
    instruction: "کلمه‌ها را برای پرسیدن قیمت سیب‌ها ترتیب کنین."
    accepted_answers: [{value: ["how", "much", "are", "the", "apples"], status: "correct"}]
    feedback: "ترتیب درست: how much are the apples."
  en.a1.unit03.lesson04.exercise05.reply_as_leila:
    instruction: "به نقش لیلا، دربارهٔ قیمت هر دو سامان جواب بدین."
    accepted_answers:
      - {value: "It's five dollars. They're two dollars.", status: "correct"}
      - {value: "It's five dollars, they're two dollars.", status: "correct"}
      - {value: "It's five dollars and they're two dollars.", status: "correct"}
    feedback: "جواب کامل قیمت هر دو سامان را جدا بیان می‌کنه."
  en.a1.unit03.lesson04.exercise06.speak_prices:
    instruction: "به نقش لیلا، به هر سه سوال (قیمت، قیمت سیب‌ها، قدامت دوکان) جواب بدین."
    accepted_answers:
      - {value: "It's five dollars. They're two dollars. It's twenty years old.", status: "correct"}
      - {value: "It's five dollars, they're two dollars, and it's twenty years old.", status: "correct"}
      - {value: "It's five dollars. They're two dollars. It's twenty years old!", status: "correct"}
    feedback: "جواب کامل هر سه سوال قیمت و قدامت را پوشش می‌ده."
