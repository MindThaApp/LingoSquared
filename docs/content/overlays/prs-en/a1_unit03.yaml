  en.a1.unit03.lesson02.teach.twelve: {title: "دوازده", gloss: "دوازده", note: "twelve یعنی دوازده؛ این‌هم شکل نامنظم داره.", example_gloss: "من در کوچهٔ شمارهٔ دوازده زندگی می‌کنم."}
