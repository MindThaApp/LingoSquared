course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit20.comparisons: {title: "مقایسه‌های ساده"}

lessons:
  en.a1.unit20.lesson01.comparative_adjectives: {title: "صفت‌های مقایسوی"}
  en.a1.unit20.lesson02.comparing_with_than: {title: "مقایسهٔ دو چیز با than"}
  en.a1.unit20.lesson03.reading_a_comparison: {title: "خواندن مقایسهٔ سه موتر"}
  en.a1.unit20.lesson04.comparison_dialogue: {title: "مقایسهٔ دو بکس در یک گفتگو"}

teaching:
  en.a1.unit20.lesson01.teach.bigger: {title: "bigger", gloss: "کلان‌تر", note: "bigger شکل مقایسوی big استه.", example_gloss: "همی جاکت از آن یکی کلان‌تره."}
  en.a1.unit20.lesson01.teach.smaller: {title: "smaller", gloss: "خُرد‌تر", note: "smaller شکل مقایسوی small استه.", example_gloss: "همی شرت از آن یکی خُردتره."}
  en.a1.unit20.lesson01.teach.cheaper: {title: "cheaper", gloss: "ارزان‌تر", note: "cheaper شکل مقایسوی cheap استه.", example_gloss: "همی شرت از آن یکی ارزان‌تره."}
  en.a1.unit20.lesson01.teach.more_expensive: {title: "more expensive", gloss: "قیمتی‌تر", note: "صفت‌های درازتر مثل expensive از more استعمال می‌کنن و -er نمی‌گیرن.", example_gloss: "همی جاکت از آن یکی قیمتی‌تره."}
  en.a1.unit20.lesson01.teach.faster: {title: "faster", gloss: "تیزتر", note: "faster شکل مقایسوی fast استه.", example_gloss: "موتر من از موتر او تیزتره."}

  en.a1.unit20.lesson02.teach.which_is_cheaper: {title: "Which bag is cheaper, the small one or the big one?", gloss: "کدام بکس ارزان‌تره، خوردکه یا کلانه؟", note: "Which...is...؟ برای پرسیدن در بارهٔ مقایسه بین دو چیز استعمال می‌شه."}
  en.a1.unit20.lesson02.teach.small_cheaper_than_big: {title: "The small bag is cheaper than the big bag.", gloss: "بکس خوردک از بکس کلان ارزان‌تره.", note: "than برای مقایسهٔ مستقیم دو چیز استعمال می‌شه."}
  en.a1.unit20.lesson02.teach.big_bag_nicer: {title: "The big bag is nicer than the small bag.", gloss: "بکس کلان از بکس خوردک قشنگ‌تره.", note: "nicer شکل مقایسوی nice استه."}

  en.a1.unit20.lesson03.teach.cheapest: {title: "cheapest", gloss: "ارزان‌ترین", note: "cheapest شکل عالی cheap استه (برای سه چیز یا زیاتر).", example_gloss: "همی ارزان‌ترین شرت دوکانه."}
  en.a1.unit20.lesson03.teach.car_comparison_text: {title: "متن مقایسهٔ موترها", gloss: "موتر سرخ از موتر آبی تیزتره، مگم موتر آبی ارزان‌تره. موتر سفید ارزان‌ترین همی سه‌تاست.", note: "همی متن سه موتر را با هم مقایسه می‌کنه -- سرخ تیزتر، آبی ارزان‌تر از سرخ، و سفید ارزان‌ترین همه."}

  en.a1.unit20.lesson04.teach.how_much_cheaper: {title: "How much cheaper?", gloss: "چقدر ارزان‌تر؟", note: "How much...؟ برای پرسیدن در بارهٔ مقدار فرق استعمال می‌شه."}
  en.a1.unit20.lesson04.teach.by_five_dollars: {title: "cheaper by five dollars", gloss: "پنج دالر ارزان‌تر", note: "by five dollars مقدار دقیق فرق را نشان می‌ته."}
  en.a1.unit20.lesson04.teach.q_which_bag: {title: "پرسیدن در بارهٔ بکس", gloss: "لیلا می‌پرسه کدام بکس را خوش دارین، خوردکه یا کلانه؟", note: "همو سوال آموزش‌دیده در درس دوم."}
  en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper: {title: "جواب دنیل", gloss: "دنیل می‌گه کلانه قشنگ‌تره، مگم خوردکه ارزان‌تره.", note: "دنیل یک مقایسه با but نشان می‌ته که دو نتیجهٔ مختلف داره."}
  en.a1.unit20.lesson04.teach.q_how_much_cheaper: {title: "پرسیدن مقدار فرق", gloss: "لیلا می‌پرسه چقدر ارزان‌تر؟", note: "همو سوال آموزش‌دیده در بالا."}
  en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars: {title: "قیمت دقیق", gloss: "دنیل می‌گه خوردکه ده دالره، و کلانه پانزده دالره.", note: "دنیل قیمت دقیق هر دو بکس را می‌ته -- ده و پانزده دالر."}
  en.a1.unit20.lesson04.teach.a_cheaper_by_five: {title: "نتیجه‌گیری لیلا", gloss: "لیلا می‌گه خیر استه، خوردکه پنج دالر ارزان‌تره. همو خوردکه را می‌گیرم.", note: "پانزده منفی ده مساوی پنج -- لیلا فرق درست را حساب می‌کنه."}

exercises:
  en.a1.unit20.lesson01.exercise01.listen_adjective:
    instruction: "گوش کنین و صفتی که گفته شد را انتخاب کنین."
    correct_option: "cheaper"
    distractors: ["bigger", "smaller", "faster"]
    accepted_answers: [{value: "cheaper", status: "correct"}]
    feedback: "cheaper یعنی ارزان‌تر."
  en.a1.unit20.lesson01.exercise02.choose_opposite_of_bigger:
    instruction: "خلاف bigger چیست؟"
    correct_option: "smaller"
    distractors: ["cheaper", "faster", "more expensive"]
    accepted_answers: [{value: "smaller", status: "correct"}]
    feedback: "smaller خلاف bigger استه."
  en.a1.unit20.lesson01.exercise03.choose_comparative_of_expensive:
    instruction: "شکل مقایسوی expensive چیست؟"
    correct_option: "more expensive"
    distractors: ["expensiver", "cheaper", "biggest"]
    accepted_answers: [{value: "more expensive", status: "correct"}]
    feedback: "صفت‌های درازتر مثل expensive از more استعمال می‌کنن و -er نمی‌گیرن."
  en.a1.unit20.lesson01.exercise04.match_comparatives:
    instruction: "هر صفت را به شکل مقایسوی آن وصل کنین."
    accepted_answers: [{value: [{left: "big", right: "bigger"}, {left: "small", right: "smaller"}, {left: "cheap", right: "cheaper"}, {left: "fast", right: "faster"}, {left: "expensive", right: "more expensive"}, {left: "nice", right: "nicer"}], status: "correct"}]
    feedback: "big=bigger، small=smaller، cheap=cheaper، fast=faster."
  en.a1.unit20.lesson01.exercise05.write_faster:
    instruction: "شکل مقایسوی fast را بنویسین."
    accepted_answers:
      - {value: "faster", status: "correct"}
      - {value: "Faster", status: "correct"}
    feedback: "faster شکل مقایسوی fast استه."

  en.a1.unit20.lesson02.exercise01.listen_question:
    instruction: "گوش کنین و سوالی که پرسیده شد را انتخاب کنین."
    correct_option: "کدام بکس ارزان‌تره"
    distractors: ["کدام بکس کلان‌تره", "کدام بکس قشنگ‌تره", "کدام بکس سنگین‌تره"]
    accepted_answers: [{value: "کدام بکس ارزان‌تره", status: "correct"}]
    feedback: "Which bag is cheaper؟ می‌پرسه کدام بکس ارزان‌تره."
  en.a1.unit20.lesson02.exercise02.choose_correct_comparison:
    instruction: "بکس خوردک از بکس کلان قیمت کمتر داره. چطور می‌گین؟"
    correct_option: "The small bag is cheaper than the big bag."
    distractors: ["The big bag is cheaper than the small bag.", "The small bag is bigger than the big bag.", "The big bag is nicer than the small bag."]
    accepted_answers: [{value: "The small bag is cheaper than the big bag.", status: "correct"}]
    feedback: "The small bag is cheaper than the big bag یعنی بکس خوردک از بکس کلان ارزان‌تره."
  en.a1.unit20.lesson02.exercise03.order_nicer_than:
    instruction: "کلمات را برای گفتن «بکس کلان از بکس خوردک قشنگ‌تره» ترتیب کنین."
    accepted_answers: [{value: ["The", "big", "bag", "is", "nicer", "than", "the", "small", "bag"], status: "correct"}]
    feedback: "ترتیب درست: The big bag is nicer than the small bag."
  en.a1.unit20.lesson02.exercise04.reply_which_bag:
    instruction: "کدام بکس ارزان‌تره، خوردکه یا کلانه؟"
    accepted_answers:
      - {value: "The small bag is cheaper than the big bag.", status: "correct"}
    feedback: "The small bag is cheaper than the big bag یعنی بکس خوردک از بکس کلان ارزان‌تره."
  en.a1.unit20.lesson02.exercise05.write_comparison:
    instruction: "بنویسین که بکس کلان از بکس خوردک قشنگ‌تره."
    accepted_answers:
      - {value: "The big bag is nicer than the small bag.", status: "correct"}
      - {value: "The big bag is nicer than the small bag", status: "correct"}
    feedback: "The big bag is nicer than the small bag یعنی بکس کلان از بکس خوردک قشنگ‌تره."

  en.a1.unit20.lesson03.exercise01.read_fastest_car:
    instruction: "کدام موتر تیزتره، سرخ یا آبی؟"
    correct_option: "the red car"
    distractors: ["the blue car", "the white car", "both are equal"]
    accepted_answers: [{value: "the red car", status: "correct"}]
    feedback: "متن می‌گه The red car is faster than the blue car."
  en.a1.unit20.lesson03.exercise02.read_cheapest_car:
    instruction: "کدام موتر ارزان‌ترینه؟"
    correct_option: "the white car"
    distractors: ["the red car", "the blue car", "all are equal"]
    accepted_answers: [{value: "the white car", status: "correct"}]
    feedback: "متن می‌گه The white car is the cheapest of the three."
  en.a1.unit20.lesson03.exercise03.choose_true_statement:
    instruction: "کدام جمله درست استه؟"
    correct_option: "The blue car is cheaper than the red car."
    distractors: ["The blue car is faster than the red car.", "The red car is the cheapest.", "The white car is the fastest."]
    accepted_answers: [{value: "The blue car is cheaper than the red car.", status: "correct"}]
    feedback: "متن می‌گه موتر آبی ارزان‌تر از سرخه (چون سرخ فقط تیزتره، نی ارزان‌تر)."
  en.a1.unit20.lesson03.exercise04.order_cheapest_of_three:
    instruction: "کلمات را برای گفتن «موتر سفید ارزان‌ترین همی سه‌تاست» ترتیب کنین."
    accepted_answers: [{value: ["The", "white", "car", "is", "the", "cheapest", "of", "the", "three"], status: "correct"}]
    feedback: "ترتیب درست: The white car is the cheapest of the three."
  en.a1.unit20.lesson03.exercise05.write_fastest_statement:
    instruction: "بنویسین که موتر سرخ از موتر آبی تیزتره."
    accepted_answers:
      - {value: "The red car is faster than the blue car.", status: "correct"}
      - {value: "The red car is faster than the blue car", status: "correct"}
    feedback: "The red car is faster than the blue car یعنی موتر سرخ از موتر آبی تیزتره."

  en.a1.unit20.lesson04.exercise01.listen_which_is_nicer:
    instruction: "گفتگو را گوش کنین و معلوم کنین کدام بکس قشنگ‌تره."
    correct_option: "the big bag"
    distractors: ["the small bag", "both are equal", "neither"]
    accepted_answers: [{value: "the big bag", status: "correct"}]
    feedback: "دنیل می‌گه The big one is nicer."
  en.a1.unit20.lesson04.exercise02.listen_price_difference:
    instruction: "گوش کنین و مقدار فرق قیمت را انتخاب کنین."
    correct_option: "five dollars"
    distractors: ["ten dollars", "fifteen dollars", "twenty dollars"]
    accepted_answers: [{value: "five dollars", status: "correct"}]
    feedback: "لیلا می‌گه خوردکه پنج دالر ارزان‌تره (پانزده منفی ده)."
  en.a1.unit20.lesson04.exercise03.choose_which_bag_leila_buys:
    instruction: "لیلا کدام بکس را می‌گیره؟"
    correct_option: "the small bag"
    distractors: ["the big bag", "both bags", "neither bag"]
    accepted_answers: [{value: "the small bag", status: "correct"}]
    feedback: "لیلا می‌گه همو خوردکه را می‌گیرم."
  en.a1.unit20.lesson04.exercise04.order_how_much_cheaper:
    instruction: "کلمات را برای گفتن «چقدر ارزان‌تر؟» ترتیب کنین."
    accepted_answers: [{value: ["How", "much", "cheaper"], status: "correct"}]
    feedback: "ترتیب درست: How much cheaper؟"
  en.a1.unit20.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌پرسه: کدام بکس را خوش دارین، خوردکه یا کلانه؟ چقدر ارزان‌تر؟"
    accepted_answers:
      - {value: "The big one is nicer, but the small one is cheaper. The small one is ten dollars, and the big one is fifteen dollars.", status: "correct"}
    feedback: "جواب کامل هم مقایسهٔ کیفیت و هم قیمت دقیق هر دو بکس را بیان می‌کنه -- دو لحظهٔ جدا از گفتگو."
  en.a1.unit20.lesson04.exercise06.speak_comparison_dialogue:
    instruction: "به جای دنیل، جواب او را برای لیلا بلند بگین."
    accepted_answers:
      - {value: "The big one is nicer, but the small one is cheaper. The small one is ten dollars, and the big one is fifteen dollars.", status: "correct"}
    feedback: "جواب کامل هر دو بخش گفتگو را در بر می‌گیره: کدام قشنگ‌تره و قیمت دقیق هر دو."
