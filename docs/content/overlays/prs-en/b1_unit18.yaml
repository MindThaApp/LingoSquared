course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit18.future_plans: {title: "می‌خواهم یک پروژهٔ نو شروع کنم"}

lessons:
  en.b1.unit18.lesson01.future_plans_vocabulary: {title: "کلمات برای صحبت دربارهٔ آینده"}
  en.b1.unit18.lesson02.fixed_arrangements_and_intentions: {title: "جمعه با لیلا قرار دارم"}
  en.b1.unit18.lesson03.reading_daniels_plans: {title: "متن خوانی: پلانِ دنیل برای ماهِ آینده"}
  en.b1.unit18.lesson04.the_planning_dialogue: {title: "احتمالاً دو ماه وقت می‌گیره"}

teaching:
  en.b1.unit18.lesson01.teach.arrangement: {title: "arrangement", gloss: "قرارِ از پیش تعیین‌شده", note: "*arrangement* یعنی یک قرارِ از پیش تعیین‌شده با کسِ دیگه، مثلاً وقتِ یک ملاقات.", example_gloss: "میا یک قرار داره که جمعه لیلا را ببینه."}
  en.b1.unit18.lesson01.teach.intention: {title: "intention", gloss: "نیت", note: "*intention* یعنی چیزی که تصمیم گرفتین انجام بتین، اما هنوز وقتِ آن را با کسِ دیگه تعیین نکدین.", example_gloss: "نیتِ دنیل اینه که پروژه را زود تمام کنه."}
  en.b1.unit18.lesson01.teach.prediction: {title: "prediction", gloss: "پیش‌بینی", note: "*prediction* یعنی یک حدس دربارهٔ چیزی که واقع می‌شه، براساسِ شواهد.", example_gloss: "پیش‌بینیِ من اینه که پروژه به‌وقت تمام می‌شه."}
  en.b1.unit18.lesson01.teach.definitely: {title: "definitely", gloss: "قطعاً", note: "*definitely* یعنی کاملاً مطمئن استین که یک چیز واقع می‌شه.", example_gloss: "دنیل قطعاً ریپورت را امروز تمام می‌کنه."}
  en.b1.unit18.lesson01.teach.probably: {title: "probably", gloss: "احتمالاً", note: "*probably* یعنی نسبتاً مطمئن استین اما نه کاملاً.", example_gloss: "پروژه احتمالاً دو ماه وقت می‌گیره.", media_asset_key: "en.b1.audio.future_plans.phrase.probably.01"}
  en.b1.unit18.lesson01.teach.might: {title: "might", gloss: "شاید (امکانِ ضعیف)", note: "*might* یعنی یک امکانِ ضعیف برای آینده، نه چیزِ مطمئن.", example_gloss: "دنیل شاید از لیلا بخواد که شامل تیم شه."}

  en.b1.unit18.lesson02.teach.meeting_leila_friday: {title: "I am meeting Leila for lunch on Friday.", gloss: "جمعه با لیلا برای نان چاشت قرار دارم.", note: "*present continuous* اینجه برای یک قرارِ از پیش تعیین‌شده با وقتِ مشخص استفاده شده.", media_asset_key: "en.b1.audio.future_plans.sentence.01"}
  en.b1.unit18.lesson02.teach.going_to_start_project: {title: "I am going to start a new project with the design team.", gloss: "می‌خواهم یک پروژهٔ نو را با تیمِ دیزاین شروع کنم.", note: "*going to* اینجه برای یک نیت یا تصمیمِ از قبل گرفته‌شده استفاده شده، حتی بدون وقتِ مشخص."}
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions: {title: "قاعدهٔ قرار در برابر نیت", gloss: "از *present continuous* (I am meeting Leila on Friday) برای یک قرارِ از پیش تعیین‌شده استفاده کنین -- یک وقتِ مشخص که با کسِ دیگه توافق شده. از *going to* (I am going to start a new project) برای یک نیت یا تصمیمی که از قبل گرفتین استفاده کنین، حتی بدون وقتِ مشخص هنوز.", note: "همی دو شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit18.lesson03.teach.on_time: {title: "on time", gloss: "به‌وقت", note: "*on time* یعنی درست در وقتِ پلان‌شده، نه دیرتر.", example_gloss: "دنیل فکر می‌کنه پروژه به‌وقت تمام می‌شه."}
  en.b1.unit18.lesson03.teach.confident: {title: "confident", gloss: "مطمئن", note: "*confident* یعنی احساسِ اطمینان دربارهٔ چیزی.", example_gloss: "دنیل دربارهٔ پروژهٔ نو مطمئن استه."}
  en.b1.unit18.lesson03.teach.reading_passage: {title: "متن دربارهٔ پلانِ دنیل برای ماهِ آینده", gloss: "دنیل می‌خواد ماهِ آینده یک پروژهٔ نو را با تیمِ دیزاین شروع کنه. صبحِ جمعه تیم را می‌بینه تا اولین قدم‌ها را پلان کنن. دنیل دربارهٔ پروژه مطمئن استه، اما کاملاً مطمئن نیست که به‌وقت تمام می‌شه. پیش‌بینی می‌کنه که احتمالاً دو ماه وقت می‌گیره. شاید از لیلا بخواد که شامل تیم شه، چون او تجربهٔ مفیدِ دیزاین داره. اگه لیلا قبول کنه، پروژه قطعاً سریع‌تر پیش می‌ره.", note: "همی متن *going to*، *present continuous*، *probably*، و *might* را باهم استفاده می‌کنه."}

  en.b1.unit18.lesson04.teach.q_plans_next_month: {title: "سوال میا", gloss: "میا می‌گه: دنیل، پلانِ تو برای ماهِ آینده چی استه؟", note: "*what are your plans* یک سوالِ ساده دربارهٔ آینده استه.", media_asset_key: "en.b1.audio.dialogue.future_plans.01"}
  en.b1.unit18.lesson04.teach.a_going_to_start: {title: "جواب دنیل", gloss: "دنیل می‌گه: می‌خواهم یک پروژهٔ نو را با تیمِ دیزاین شروع کنم.", note: "*going to* یک تصمیمِ از قبل گرفته‌شده نشان می‌ته."}
  en.b1.unit18.lesson04.teach.q_meeting_this_week: {title: "سوال میا", gloss: "میا می‌گه: جالب معلوم می‌شه. این هفته تیم را می‌بینی؟", note: "*are you meeting* دربارهٔ یک قرارِ تعیین‌شده پرسان می‌کنه."}
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning: {title: "جواب دنیل", gloss: "دنیل می‌گه: بلی، صبحِ جمعه تیم را می‌بینم.", note: "*present continuous* برای یک قرارِ از پیش تعیین‌شده."}
  en.b1.unit18.lesson04.teach.q_finish_on_time: {title: "سوال میا", gloss: "میا می‌گه: فکر می‌کنی پروژه به‌وقت تمام می‌شه؟", note: "*will finish* یک سوال دربارهٔ پیش‌بینی استه."}
  en.b1.unit18.lesson04.teach.a_probably_two_months: {title: "جواب دنیل", gloss: "دنیل می‌گه: کاملاً مطمئن نیستم، اما احتمالاً دو ماه وقت می‌گیره.", note: "*probably* یک پیش‌بینیِ نسبتاً مطمئن نشان می‌ته."}
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well: {title: "جواب میا", gloss: "میا می‌گه: خب، مطمئنم که خوب پیش می‌ره.", note: "*I'm sure* یک اطمینانِ زیاد نشان می‌ته."}
  en.b1.unit18.lesson04.teach.a_might_ask_leila: {title: "جواب دنیل", gloss: "دنیل می‌گه: تشکر. شاید از لیلا بخواهم که شامل تیم شه.", note: "*might* یک امکانِ ضعیف نشان می‌ته."}

exercises:
