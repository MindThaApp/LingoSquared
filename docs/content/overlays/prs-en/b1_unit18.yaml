course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit18.future_plans: {title: "می‌خوام یک پروژهٔ نو شروع کنم"}

lessons:
  en.b1.unit18.lesson01.future_plans_vocabulary: {title: "کلمات برای صحبت دربارهٔ آینده"}
  en.b1.unit18.lesson02.fixed_arrangements_and_intentions: {title: "جمعه با لیلا می‌بینم"}
  en.b1.unit18.lesson03.reading_daniels_plans: {title: "متن خوانی: پلانِ دانیال برای ماهِ آینده"}
  en.b1.unit18.lesson04.the_planning_dialogue: {title: "احتمالاً دو ماه وقت می‌گیره"}

teaching:
  en.b1.unit18.lesson01.teach.arrangement: {title: "arrangement", gloss: "قرارِ از پیش تعیین‌شده", note: "*arrangement* یعنی یک قرارِ از پیش تعیین‌شده با کسِ دیگه، مثلاً وقتِ یک ملاقات.", example_gloss: "میا یک قرار داره که جمعه لیلا را ببینه."}
  en.b1.unit18.lesson01.teach.intention: {title: "intention", gloss: "نیت", note: "*intention* یعنی چیزی که تصمیم گرفتین انجام بتین، اما هنوز وقتِ آن را با کسِ دیگه تعیین نکدین.", example_gloss: "نیتِ دانیال اینه که پروژه را زود تمام کنه."}
  en.b1.unit18.lesson01.teach.prediction: {title: "prediction", gloss: "پیش‌بینی", note: "*prediction* یعنی یک حدس دربارهٔ چیزی که واقع می‌شه، براساسِ شواهد.", example_gloss: "پیش‌بینیِ من اینه که پروژه به‌وقت تمام می‌شه."}
  en.b1.unit18.lesson01.teach.definitely: {title: "definitely", gloss: "قطعاً", note: "*definitely* یعنی کاملاً مطمئن هستین که یک چیز واقع می‌شه.", example_gloss: "دانیال قطعاً گزارش را امروز تمام می‌کنه."}
  en.b1.unit18.lesson01.teach.probably: {title: "probably", gloss: "احتمالاً", note: "*probably* یعنی نسبتاً مطمئن هستین اما نه کاملاً.", example_gloss: "پروژه احتمالاً دو ماه وقت می‌گیره.", media_asset_key: "en.b1.audio.future_plans.phrase.probably.01"}
  en.b1.unit18.lesson01.teach.might: {title: "might", gloss: "شاید (امکانِ ضعیف)", note: "*might* یعنی یک امکانِ ضعیف برای آینده، نه چیزِ مطمئن.", example_gloss: "دانیال شاید از لیلا بخواد که به تیم بپیوندد."}

  en.b1.unit18.lesson02.teach.meeting_leila_friday: {title: "I am meeting Leila for lunch on Friday.", gloss: "جمعه با لیلا برای ناهار می‌بینم.", note: "*present continuous* اینجه برای یک قرارِ از پیش تعیین‌شده با وقتِ مشخص استفاده شده.", media_asset_key: "en.b1.audio.future_plans.sentence.01"}
  en.b1.unit18.lesson02.teach.going_to_start_project: {title: "I am going to start a new project with the design team.", gloss: "می‌خوام یک پروژهٔ نو را با تیمِ دیزاین شروع کنم.", note: "*going to* اینجه برای یک نیت یا تصمیمِ از قبل گرفته‌شده استفاده شده، حتی بدون وقتِ مشخص."}
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions: {title: "قاعدهٔ قرار در برابر نیت", gloss: "از *present continuous* (I am meeting Leila on Friday) برای یک قرارِ از پیش تعیین‌شده استفاده کنین -- یک وقتِ مشخص که با کسِ دیگه توافق شده. از *going to* (I am going to start a new project) برای یک نیت یا تصمیمی که از قبل گرفتین استفاده کنین، حتی بدون وقتِ مشخص هنوز.", note: "همی دو شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit18.lesson03.teach.on_time: {title: "on time", gloss: "به‌وقت", note: "*on time* یعنی درست در وقتِ پلان‌شده، نه دیرتر.", example_gloss: "دانیال فکر می‌کنه پروژه به‌وقت تمام می‌شه."}
  en.b1.unit18.lesson03.teach.confident: {title: "confident", gloss: "مطمئن", note: "*confident* یعنی احساسِ اطمینان دربارهٔ چیزی.", example_gloss: "دانیال دربارهٔ پروژهٔ نو مطمئن است."}
  en.b1.unit18.lesson03.teach.reading_passage: {title: "متن دربارهٔ پلانِ دانیال برای ماهِ آینده", gloss: "دانیال می‌خواد ماهِ آینده یک پروژهٔ نو را با تیمِ دیزاین شروع کنه. صبحِ جمعه تیم را می‌بینه تا اولین قدم‌ها را پلان کنن. دانیال دربارهٔ پروژه مطمئن است، اما کاملاً مطمئن نیست که به‌وقت تمام می‌شه. پیش‌بینی می‌کنه که احتمالاً دو ماه وقت می‌گیره. شاید از لیلا بخواد که به تیم بپیوندد، چون او تجربهٔ مفیدِ دیزاین داره. اگه لیلا قبول کنه، پروژه قطعاً سریع‌تر پیش می‌ره.", note: "همی متن *going to*، *present continuous*، *probably*، و *might* را باهم استفاده می‌ته."}

  en.b1.unit18.lesson04.teach.q_plans_next_month: {title: "پرسش میا", gloss: "میا می‌گه: دانیال، پلانِ تو برای ماهِ آینده چیه؟", note: "*what are your plans* یک پرسشِ ساده دربارهٔ آینده است.", media_asset_key: "en.b1.audio.dialogue.future_plans.01"}
  en.b1.unit18.lesson04.teach.a_going_to_start: {title: "جواب دانیال", gloss: "دانیال می‌گه: می‌خوام یک پروژهٔ نو را با تیمِ دیزاین شروع کنم.", note: "*going to* یک تصمیمِ از قبل گرفته‌شده نشان می‌ته."}
  en.b1.unit18.lesson04.teach.q_meeting_this_week: {title: "پرسش میا", gloss: "میا می‌گه: عالیه. این هفته تیم را می‌بینی؟", note: "*are you meeting* پرسش دربارهٔ یک قرارِ ممکنه است."}
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning: {title: "جواب دانیال", gloss: "دانیال می‌گه: بلی، صبحِ جمعه تیم را می‌بینم.", note: "*present continuous* برای یک قرارِ از پیش تعیین‌شده."}
  en.b1.unit18.lesson04.teach.q_finish_on_time: {title: "پرسش میا", gloss: "میا می‌گه: فکر می‌کنی پروژه به‌وقت تمام می‌شه؟", note: "*will finish* یک پرسش دربارهٔ پیش‌بینی است."}
  en.b1.unit18.lesson04.teach.a_probably_two_months: {title: "جواب دانیال", gloss: "دانیال می‌گه: کاملاً مطمئن نیستم، اما احتمالاً دو ماه وقت می‌گیره.", note: "*probably* یک پیش‌بینیِ نسبتاً مطمئن نشان می‌ته."}
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well: {title: "جواب میا", gloss: "میا می‌گه: خب، مطمئنم که خوب پیش می‌ره.", note: "*I'm sure* یک اطمینانِ بلند نشان می‌ته."}
  en.b1.unit18.lesson04.teach.a_might_ask_leila: {title: "جواب دانیال", gloss: "دانیال می‌گه: ممنون. شاید از لیلا بخوام که به تیم بپیوندد.", note: "*might* یک امکانِ ضعیف نشان می‌ته."}

exercises:
  en.b1.unit18.lesson01.exercise01.listen_probably:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "probably"
    distractors: ["definitely", "might", "intention"]
    accepted_answers: [{value: "probably", status: "correct"}]
    feedback: "*probably* یعنی احتمالاً."
  en.b1.unit18.lesson01.exercise02.choose_definitely:
    instruction: "کدام کلمه بلندترین سطحِ یقین را دربارهٔ یک رویدادِ آینده نشان می‌ته؟"
    correct_option: "definitely"
    distractors: ["probably", "might", "prediction"]
    accepted_answers: [{value: "definitely", status: "correct"}]
    feedback: "*definitely* یعنی قطعاً."
  en.b1.unit18.lesson01.exercise03.choose_might:
    instruction: "کدام کلمه یک امکانِ آیندهٔ اصلاً غیرمطمئن را نشان می‌ته؟"
    correct_option: "might"
    distractors: ["definitely", "probably", "arrangement"]
    accepted_answers: [{value: "might", status: "correct"}]
    feedback: "*might* یعنی شاید (امکانِ ضعیف)."
  en.b1.unit18.lesson01.exercise04.match_future_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "a plan already fixed with another person, such as a meeting time", right: "arrangement"}
          - {left: "something you have decided to do, but have not yet fixed a time for with anyone else", right: "intention"}
          - {left: "a guess about what will happen, based on evidence", right: "prediction"}
          - {left: "shows you are completely certain something will happen", right: "definitely"}
          - {left: "shows you are fairly confident but not completely certain", right: "probably"}
          - {left: "shows the event is only a weak possibility", right: "might"}
        status: "correct"
    feedback: "*arrangement*=قرارِ از پیش تعیین‌شده، *intention*=نیت، *prediction*=پیش‌بینی، *definitely*=قطعاً، *probably*=احتمالاً، *might*=شاید."
  en.b1.unit18.lesson01.exercise05.write_probably:
    instruction: "کلمه‌ای را که یعنی نسبتاً مطمئن هستین اما نه کاملاً، بنویسین."
    accepted_answers:
      - {value: "probably", status: "correct"}
      - {value: "Probably", status: "correct"}
    feedback: "*probably* یعنی احتمالاً."

  en.b1.unit18.lesson02.exercise01.choose_meeting_leila:
    instruction: "کدام جمله یک قرارِ از پیش تعیین‌شده با یک وقتِ مشخص را نشان می‌ته؟"
    correct_option: "I am meeting Leila for lunch on Friday."
    distractors: ["I am going to start a new project with the design team.", "I might ask Leila to join the team too.", "The project will probably take about two months."]
