course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit01.necessity: {title: "چیزهایی که باید، ضرورت دارم، و خوبه بکنم"}

lessons:
  en.b1.unit01.lesson01.necessity_vocabulary: {title: "Must، have to، و should"}
  en.b1.unit01.lesson02.saying_what_you_must_do: {title: "من باید، ضرورت دارم، او ضرورت داره"}
  en.b1.unit01.lesson03.past_regret_and_prohibition: {title: "باید می‌کدم، نباید، ضرورت ندارم"}
  en.b1.unit01.lesson04.the_gym_membership_dialogue: {title: "دیگه نباید فراموش کنی"}

teaching:
  en.b1.unit01.lesson01.teach.must: {title: "must", gloss: "باید (ضرورت شخصی و قوی)", note: "*must* یک ضرورت قوی و شخصی نشان می‌ته -- خودتان احساس می‌کنین که باید همی کار را بکنین.", example_gloss: "امروز باید همی کار را تمام کنم."}
  en.b1.unit01.lesson01.teach.have_to: {title: "have to", gloss: "ضرورت دارم (اکثراً از بیرون)", note: "*have to* یک ضرورت نشان می‌ته که اکثراً از یک قانون یا کس دیگه می‌یه، نی از دل خودتان.", example_gloss: "ضرورت دارم کرایه را تا جمعه بتم."}
  en.b1.unit01.lesson01.teach.should: {title: "should", gloss: "خوبه، بهتر استه", note: "*should* یک پیشنهاد یا مشوره استه، نی یک ضرورت قوی.", example_gloss: "خوبه زود به داکتر دندان زنگ بزنین."}
  en.b1.unit01.lesson01.teach.task: {title: "task", gloss: "کار، وظیفه", note: "*task* یعنی یک کار مشخص که باید تمام شه.", example_gloss: "یک کار دیگه هم دارم که باید تمامش کنم."}
  en.b1.unit01.lesson01.teach.rent: {title: "rent", gloss: "کرایه", note: "*rent* یعنی پولی که هر ماه برای خانه می‌تی.", example_gloss: "کرایه تا جمعه باید داده شه."}
  en.b1.unit01.lesson01.teach.appointment: {title: "appointment", gloss: "وعده (نزد داکتر یا کسی دیگه)", note: "*appointment* یعنی یک وقت مشخص که با کسی قرار می‌کنین.", example_gloss: "همی هفته یک وعدهٔ داکتر دندان دارم."}

  en.b1.unit01.lesson02.teach.must_finish_task: {title: "I must finish this task today.", gloss: "امروز باید همی کار را تمام کنم.", note: "*must* یعنی یک ضرورت قوی و شخصی."}
  en.b1.unit01.lesson02.teach.have_to_pay_rent: {title: "I have to pay the rent by Friday.", gloss: "ضرورت دارم کرایه را تا جمعه بتم.", note: "*have to* یعنی ضرورتی که از بیرون می‌یه، مثل یک میعاد."}
  en.b1.unit01.lesson02.teach.she_has_to_make: {title: "She has to make an appointment.", gloss: "او ضرورت داره یک وعده بگیره.", note: "برای *she/he* استعمال *has to* درست استه، نی *have to*."}
  en.b1.unit01.lesson02.teach.you_should_call: {title: "You should call and confirm the appointment.", gloss: "خوبه زنگ بزنین و وعده را تایید کنین.", note: "*should* یک پیشنهاد استه، نی یک امر قوی."}
  en.b1.unit01.lesson02.teach.grammar_agreement: {title: "I have to go. She has to go. We have to go. They have to go.", gloss: "من ضرورت دارم برم. او ضرورت داره بره. ما ضرورت داریم بریم. آن‌ها ضرورت دارن برن.", note: "*have to* فقط با *he/she/it* به *has to* تبدیل می‌شه؛ با بقیه یکسان می‌مانه."}

  en.b1.unit01.lesson03.teach.should_have_called: {title: "should have called", gloss: "باید زنگ می‌زدم (اما نزدم)", note: "*should have + past participle* یعنی یک پشیمانی از گذشته -- کاری که باید می‌کدین اما نکدین.", example_gloss: "باید زودتر زنگ می‌زدم."}
  en.b1.unit01.lesson03.teach.must_not: {title: "must not", gloss: "نباید (منع)", note: "*must not* یعنی یک منع قوی -- همی کار حتمی نباید بشه.", example_gloss: "دیگه نباید فراموش کنین."}
  en.b1.unit01.lesson03.teach.dont_have_to: {title: "don't have to", gloss: "ضرورت نداره", note: "*don't have to* با *must not* فرق داره -- منع نیس، بلکه یعنی ضرورت نیس اما اگه بخواهین می‌تانین بکنین.", example_gloss: "اگه مصروف استین ضرورت نداره بیایین."}
  en.b1.unit01.lesson03.teach.grammar_past_regret: {title: "I should have called. I forgot. You must not forget again. You don't have to come.", gloss: "باید زنگ می‌زدم. فراموش کدم. دیگه نباید فراموش کنی. ضرورت نداره بیایی.", note: "همی سه ساختار: پشیمانی گذشته، منع، و بی‌ضرورتی -- هر سه با هم مقایسه شدن."}
  en.b1.unit01.lesson03.teach.reading_passage: {title: "متن دربارهٔ دانیال و بشگاه ورزشی", gloss: "دیروز، دانیال فراموش کد عضویت بشگاه ورزشی‌اش را تمدید کنه. باید یک یادآوری در موبایلش تنظیم می‌کد. حالا باید یک جریمهٔ تاخیر بته. دیگه نباید ماه آینده فراموش کنه.", note: "همی یک متن واقعی با پشیمانی گذشته و منع آینده استه -- سویهٔ B1."}

  en.b1.unit01.lesson04.teach.q_renew_gym: {title: "سوال لیلا دربارهٔ عضویت بشگاه", gloss: "لیلا می‌گه: دانیال، عضویت بشگاه ورزشی‌ات را تمدید کدی؟", note: "*did you...?* یک سوال ساده دربارهٔ گذشته استه."}
  en.b1.unit01.lesson04.teach.a_forgot_should_have: {title: "جواب دانیال", gloss: "دانیال می‌گه: نی، فراموش کدم! باید هفتهٔ پیش همی کار را می‌کدم.", note: "*I should have done that* یعنی یک پشیمانی از گذشته."}
  en.b1.unit01.lesson04.teach.q_call_today: {title: "هشدار لیلا", gloss: "لیلا می‌گه: باید امروز زنگ بزنی، وگرنه یک جریمهٔ تاخیر می‌تی.", note: "*must* + *or* یعنی اگه همی کار نشه، یک نتیجهٔ بد می‌یه."}
  en.b1.unit01.lesson04.teach.a_also_pay_rent: {title: "جواب دانیال دربارهٔ کارهای دیگه", gloss: "دانیال می‌گه: راست می‌گی. همرایش ضرورت دارم کرایه را تا جمعه بتم، و باید به داکتر دندان هم زنگ بزنم.", note: "*also* یعنی یک کار اضافه دیگه هم داره."}
  en.b1.unit01.lesson04.teach.q_dont_have_to: {title: "جواب لیلا", gloss: "لیلا می‌گه: ضرورت نداره امروز همه کار را بکنی. اما نباید دیگه بشگاه را فراموش کنی.", note: "همی جمله *don't have to* و *must not* را با هم مقایسه می‌کنه."}
  en.b1.unit01.lesson04.teach.a_more_organized: {title: "جواب دانیال", gloss: "دانیال می‌گه: می‌دانم. باید همی ماه منظم‌تر باشم.", note: "*must be more organized* یک تعهد شخصی برای آینده استه."}

exercises:
  en.b1.unit01.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "appointment"
    distractors: ["must", "have to", "should"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "*appointment* یعنی وعده."
  en.b1.unit01.lesson01.exercise02.choose_must_do_word:
    instruction: "کدام کلمه یعنی یک کاری استه که باید بکنین؟"
    correct_option: "task"
    distractors: ["rent", "appointment", "should"]
    accepted_answers: [{value: "task", status: "correct"}]
    feedback: "*task* یعنی کار یا وظیفه."
  en.b1.unit01.lesson01.exercise03.choose_meeting_time_word:
    instruction: "کدام کلمه یعنی یک وقت مشخص استه که با کسی قرار می‌کنین، مثل داکتر؟"
    correct_option: "appointment"
    distractors: ["task", "rent", "must"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "*appointment* یعنی وعده."
  en.b1.unit01.lesson01.exercise04.match_necessity_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "a strong personal obligation", right: "must"}
          - {left: "an obligation, often from outside", right: "have to"}
          - {left: "a recommendation, not a strict obligation", right: "should"}
          - {left: "a job or thing you need to do", right: "task"}
          - {left: "money you pay to live somewhere", right: "rent"}
          - {left: "a fixed time to meet someone", right: "appointment"}
        status: "correct"
    feedback: "*must*=ضرورت قوی شخصی، *have to*=ضرورت از بیرون، *should*=مشوره، *task*=کار، *rent*=کرایه، *appointment*=وعده."
  en.b1.unit01.lesson01.exercise05.write_rent:
    instruction: "کلمه‌ای را که یعنی پولی استه که هر ماه برای خانه می‌تین بنویسین."
    accepted_answers:
      - {value: "rent", status: "correct"}
      - {value: "Rent", status: "correct"}
    feedback: "*rent* یعنی کرایه."

  en.b1.unit01.lesson02.exercise01.choose_daniels_task:
    instruction: "دانیال می‌گه امروز باید یک کاری را تمام کنه. چی می‌گه؟"
    correct_option: "I must finish this task today."
    distractors: ["I have to pay the rent by Friday.", "She has to make an appointment.", "You should call and confirm the appointment."]
    accepted_answers: [{value: "I must finish this task today.", status: "correct"}]
    feedback: "*I must finish this task today* یعنی امروز باید همی کار را تمام کنم."
  en.b1.unit01.lesson02.exercise02.choose_correct_agreement:
    instruction: "کدام جمله شکل درست فعل را برای *she* استعمال می‌کنه؟"
    correct_option: "She has to make an appointment."
    distractors: ["She have to make an appointment.", "I must finish this task today.", "You should call and confirm the appointment."]
    accepted_answers: [{value: "She has to make an appointment.", status: "correct"}]
    feedback: "با *he/she* باید *has to* استعمال شه، نی *have to*."
  en.b1.unit01.lesson02.exercise03.order_have_to_pay_rent:
    instruction: "کلمات را برای گفتن «ضرورت دارم کرایه را تا جمعه بتم» ترتیب کنین."
    accepted_answers: [{value: ["I", "have", "to", "pay", "the", "rent", "by", "Friday"], status: "correct"}]
    feedback: "ترتیب درست: *I have to pay the rent by Friday*"
  en.b1.unit01.lesson02.exercise04.reply_what_must_you_do:
    instruction: "همی هفته چی ضرورت دارین بکنین؟"
    accepted_answers:
      - {value: "I have to pay the rent by Friday.", status: "correct"}
      - {value: "I have to pay the rent by Friday", status: "correct"}
    feedback: "*I have to pay the rent by Friday* یعنی ضرورت دارم کرایه را تا جمعه بتم."
  en.b1.unit01.lesson02.exercise05.write_she_has_to:
    instruction: "بنویسین که او ضرورت داره یک وعده بگیره."
    accepted_answers:
      - {value: "She has to make an appointment.", status: "correct"}
      - {value: "She has to make an appointment", status: "correct"}
    feedback: "*She has to make an appointment* یعنی او ضرورت داره یک وعده بگیره."

  en.b1.unit01.lesson03.exercise01.comprehend_what_daniel_forgot:
    instruction: "دانیال چی را فراموش کد؟"
    correct_option: "renew his gym membership"
    distractors: ["pay the rent", "call the dentist", "buy a new phone"]
    accepted_answers: [{value: "renew his gym membership", status: "correct"}]
    feedback: "متن می‌گه دانیال فراموش کد عضویت بشگاه ورزشی‌اش را تمدید کنه."
  en.b1.unit01.lesson03.exercise02.comprehend_what_he_should_have_done:
    instruction: "دانیال چی باید می‌کد؟"
    correct_option: "set a reminder on his phone"
    distractors: ["call his friend", "pay the late fee earlier", "cancel his membership"]
    accepted_answers: [{value: "set a reminder on his phone", status: "correct"}]
    feedback: "متن می‌گه *he should have set a reminder on his phone*."
  en.b1.unit01.lesson03.exercise03.recognize_should_have:
    instruction: "کدام عبارت یک اشتباه یا پشیمانی از گذشته را نشان می‌ته؟"
    correct_option: "should have called"
    distractors: ["must not", "don't have to", "have to"]
    accepted_answers: [{value: "should have called", status: "correct"}]
    feedback: "*should have called* یعنی باید زنگ می‌زدی اما نزدی."
  en.b1.unit01.lesson03.exercise04.order_must_not_forget:
    instruction: "کلمات را برای گفتن «او نباید دوباره فراموش کنه» ترتیب کنین."
    accepted_answers: [{value: ["He", "must", "not", "forget", "again"], status: "correct"}]
    feedback: "ترتیب درست: *He must not forget again*"
  en.b1.unit01.lesson03.exercise05.write_should_have_called:
    instruction: "بنویسین که باید زودتر زنگ می‌زدین."
    accepted_answers:
      - {value: "I should have called earlier.", status: "correct"}
      - {value: "I should have called earlier", status: "correct"}
      - {value: "I should've called earlier.", status: "correct"}
      - {value: "I should've called earlier", status: "correct"}
    feedback: "*I should have called earlier* یعنی باید زودتر زنگ می‌زدم."

  en.b1.unit01.lesson04.exercise01.listen_what_daniel_forgot:
    instruction: "گفتگو را گوش کنین و معلوم کنین دانیال چی را فراموش کد."
    correct_option: "renew your gym membership"
    distractors: ["pay the rent", "call the dentist", "buy a gym membership"]
    accepted_answers: [{value: "renew your gym membership", status: "correct"}]
    feedback: "لیلا می‌پرسه *did you renew your gym membership*."
  en.b1.unit01.lesson04.exercise02.listen_when_daniel_should_have_done_it:
    instruction: "گوش کنین و معلوم کنین دانیال کِی باید همی کار را می‌کد."
    correct_option: "last week"
    distractors: ["yesterday", "this morning", "next month"]
    accepted_answers: [{value: "last week", status: "correct"}]
    feedback: "دانیال می‌گه *I should have done that last week*."
  en.b1.unit01.lesson04.exercise03.choose_leilas_warning:
    instruction: "مطابق گفتگو، لیلا به دانیال چی هشدار می‌ته که نباید بکنه؟"
    correct_option: "you must not forget the gym again"
    distractors: ["you must not pay the rent late", "you must not call the dentist", "you must not miss the appointment"]
    accepted_answers: [{value: "you must not forget the gym again", status: "correct"}]
    feedback: "لیلا می‌گه *you must not forget the gym again*."
  en.b1.unit01.lesson04.exercise04.order_must_be_more_organized:
    instruction: "کلمات را برای گفتن «باید همی ماه منظم‌تر باشم» ترتیب کنین."
    accepted_answers: [{value: ["I", "must", "be", "more", "organized", "this", "month"], status: "correct"}]
    feedback: "ترتیب درست: *I must be more organized this month*"
  en.b1.unit01.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌پرسه: دانیال، عضویت بشگاه ورزشی‌ات را تمدید کدی؟"
    accepted_answers:
      - {value: "Oh no, I forgot! I should have done that last week.", status: "correct"}
      - {value: "Oh no, I forgot! I should've done that last week.", status: "correct"}
    feedback: "*Oh no, I forgot! I should have done that last week* یعنی نی، فراموش کدم! باید هفتهٔ پیش همی کار را می‌کدم."
  en.b1.unit01.lesson04.exercise06.speak_necessity_dialogue:
    instruction: "به نقش دانیال، آوازی جواب بته."
    accepted_answers:
      - {value: "You're right. I also have to pay the rent by Friday, and I should call the dentist too.", status: "correct"}
      - {value: "You're right. I also have to pay the rent by Friday, and I should call the dentist too", status: "correct"}
      - {value: "You're right. I also have to pay the rent by Friday. And I should call the dentist too.", status: "correct"}
      - {value: "You're right. I also have to pay the rent by Friday. And I should call the dentist too", status: "correct"}
    feedback: "*You're right. I also have to pay the rent by Friday, and I should call the dentist too* یعنی راست می‌گی. همرایش ضرورت دارم کرایه را تا جمعه بتم، و باید به داکتر دندان هم زنگ بزنم."
