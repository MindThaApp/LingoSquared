course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit11.unreal_hypotheticals: {title: "اگه ارزان‌تر می‌بود، ثبت‌نام می‌کدم"}

lessons:
  en.b1.unit11.lesson01.unreal_hypothetical_vocabulary: {title: "Would، if I were، و regret"}
  en.b1.unit11.lesson02.unreal_present: {title: "اگه وقت بیشتر می‌داشتم، می‌کدم"}
  en.b1.unit11.lesson03.reading_a_missed_opportunity: {title: "متن خوانی: فرصت از دست‌رفته"}
  en.b1.unit11.lesson04.the_design_course_dialogue: {title: "کورس را می‌گرفتی؟"}

teaching:
  en.b1.unit11.lesson01.teach.would: {title: "would", gloss: "می‌کدم، می‌بود (نتیجهٔ فرضی)", note: "*would* نتیجهٔ یک حالت فرضی یا ترجیح مؤدبانه را نشان می‌ته.", example_gloss: "اگه وقت بیشتر می‌داشتم، شامل می‌شدم."}
  en.b1.unit11.lesson01.teach.would_rather: {title: "would rather", gloss: "ترجیح می‌تم", note: "*would rather* یعنی یک چیز را نسبت به چیز دیگر ترجیح می‌تین.", example_gloss: "ترجیح می‌تم صنف آخر هفته را بگیرم."}
  en.b1.unit11.lesson01.teach.if_i_were: {title: "if I were", gloss: "اگه من می‌بودم، اگه من می‌داشتم", note: "*if I were* یک حالت غیرواقعی یا فرضی دربارهٔ خودتان را معرفی می‌کنه.", example_gloss: "اگه امشب آزاد می‌بودم، می‌رفتم."}
  en.b1.unit11.lesson01.teach.opportunity: {title: "opportunity", gloss: "فرصت", note: "*opportunity* یعنی یک چانس خوب برای انجام دادن کاری.", example_gloss: "این کورس برای لیلا یک فرصت خوب استه."}
  en.b1.unit11.lesson01.teach.regret: {title: "regret", gloss: "پشیمانی", note: "*regret* یعنی ناراحتی دربارهٔ یک انتخاب گذشته.", example_gloss: "یک پشیمانی داره: زودتر پول پس‌انداز نکد."}
  en.b1.unit11.lesson01.teach.take_a_chance: {title: "take a chance", gloss: "چانس گرفتن، خطر را قبول کدن", note: "*take a chance* یعنی یک چیز را امتحان کنین حتی اگه موفقیتش قطعی نباشه.", example_gloss: "اگه کورس ارزان‌تر می‌بود، چانس می‌گرفت."}

  en.b1.unit11.lesson02.teach.more_time_course: {title: "If I had more time, I would take a design course.", gloss: "اگه وقت بیشتر می‌داشتم، یک کورس دیزاین می‌گرفتم.", note: "*if + past* اینجه دربارهٔ گذشته نیست؛ یک حالت غیرواقعی در حال حاضر را نشان می‌ته."}
  en.b1.unit11.lesson02.teach.cheaper_sign_up: {title: "If it were cheaper, I would sign up today.", gloss: "اگه ارزان‌تر می‌بود، امروز ثبت‌نام می‌کدم.", note: "*were* در *If it were cheaper* شکل فرضی استه، حتی وقتی دربارهٔ حال صحبت می‌کنین."}
  en.b1.unit11.lesson02.teach.grammar_unreal_present: {title: "Use past tense after if for an unreal present situation: If it were cheaper, I would sign up.", gloss: "برای حالت غیرواقعی زمان حال، بعد از if زمان گذشته می‌آیه: اگه ارزان‌تر می‌بود، ثبت‌نام می‌کدم.", note: "در انگلیسی، گذشته اینجه معنای «غیرواقعی» می‌ته، نه الزاماً زمان گذشته."}

  en.b1.unit11.lesson03.teach.sooner: {title: "sooner", gloss: "زودتر", note: "*sooner* یعنی قبل‌تر یا زودتر از وقتی که واقعاً شد.", example_gloss: "اگه زودتر خبر می‌داشت، پول بیشتر پس‌انداز می‌کد."}
  en.b1.unit11.lesson03.teach.confident: {title: "confident", gloss: "بااعتمادبه‌نفس، مطمئن", note: "*confident* یعنی احساس کنین می‌تانین یک کار را خوب انجام بتین.", example_gloss: "اگه دانیال هم شامل می‌شد، لیلا مطمئن‌تر احساس می‌کد."}
  en.b1.unit11.lesson03.teach.reading_passage: {title: "متن دربارهٔ فرصت از دست‌رفته", gloss: "لیلا یک کورس دیزاین پیدا کد که واقعاً می‌خواهد بگیره. مفید استه، اما گران استه. اگه ارزان‌تر می‌بود، امروز ثبت‌نام می‌کد. اگه دانیال هم شامل صنف می‌شد، او مطمئن‌تر احساس می‌کد. تنها پشیمانی‌اش وقت‌بندی استه: اگه زودتر از کورس خبر می‌داشت، پول بیشتر پس‌انداز می‌کد.", note: "همی متن شرط غیرواقعی حال و شرط غیرواقعی گذشته را با هم نشان می‌ته."}

  en.b1.unit11.lesson04.teach.q_take_if_cheaper: {title: "سوال میا", gloss: "میا می‌گه: لیلا، اگه کورس دیزاین ارزان‌تر می‌بود، آن را می‌گرفتی؟", note: "*would you take...?* یک سوال فرضی و نرم‌تر استه."}
  en.b1.unit11.lesson04.teach.a_sign_up_today: {title: "جواب لیلا", gloss: "لیلا می‌گه: حتماً. اگه ارزان‌تر می‌بود، امروز ثبت‌نام می‌کدم.", note: "*If it were cheaper, I would sign up today* یک شرط غیرواقعی زمان حال استه."}
  en.b1.unit11.lesson04.teach.q_daniel_joined: {title: "سوال میا دربارهٔ دانیال", gloss: "میا می‌گه: اگه دانیال هم شامل می‌شد چی؟", note: "*What if...?* یک راه کوتاه برای پرسیدن یک حالت فرضی نو استه."}
  en.b1.unit11.lesson04.teach.a_more_confident: {title: "جواب لیلا", gloss: "لیلا می‌گه: اگه دانیال شامل می‌شد، مطمئن‌تر احساس می‌کدم.", note: "*would feel more confident* نتیجهٔ فرضی را نشان می‌ته."}
  en.b1.unit11.lesson04.teach.q_would_rather_weekend: {title: "ترجیح میا", gloss: "میا می‌گه: من ترجیح می‌تم صنف آخر هفته را بگیرم، نی صنف شام را.", note: "*would rather ... than ...* برای گفتن ترجیح بین دو چیز استه."}
  en.b1.unit11.lesson04.teach.a_known_sooner: {title: "پشیمانی لیلا", gloss: "لیلا می‌گه: من هم. اگه زودتر از آن خبر می‌داشتم، پول بیشتر پس‌انداز می‌کدم.", note: "*If I had known..., I would have saved...* دربارهٔ یک گذشتهٔ غیرواقعی و پشیمانی استه."}

