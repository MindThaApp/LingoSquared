    instruction: "به نقش دنیل جواب بدین. لیلا می‌پرسه وظیفه‌تان چیست، هر روز چه کار می‌کنین، و کارتان را خوش دارین یا نی. شما بگین: انجینیر استین و در یک شرکت خوردک در مرکز شهر کار می‌کنین؛ راپور می‌نویسین و ایمیل‌ها را جواب می‌دین؛ بعضی وقت‌ها با مشتری‌ها ملاقات می‌کنین؛ کارتان را خوش دارین و جالبه."
