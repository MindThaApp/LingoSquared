course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit08.sequencing: {title: "قبل از، بعد از، و همین که"}

lessons:
  en.b1.unit08.lesson01.sequencing_vocabulary: {title: "Before، after، و by the time"}
  en.b1.unit08.lesson02.present_and_future_sequences: {title: "وقتی خانه برسم، زنگ می‌زنم"}
  en.b1.unit08.lesson03.reading_an_evening_routine: {title: "متن خوانی: پلان شام"}
  en.b1.unit08.lesson04.the_evening_plan_dialogue: {title: "همین که خانه برسم"}

teaching:
  en.b1.unit08.lesson01.teach.before: {title: "before", gloss: "قبل از، پیش از", note: "*before* یعنی یک کار زودتر از کار دیگر اتفاق می‌افته.", example_gloss: "قبل از آشپزی، دست‌هایت را بشوی."}
  en.b1.unit08.lesson01.teach.after: {title: "after", gloss: "بعد از", note: "*after* یعنی یک کار دیرتر از کار دیگر اتفاق می‌افته.", example_gloss: "بعد از ختم کار به من زنگ بزن."}
  en.b1.unit08.lesson01.teach.as_soon_as: {title: "as soon as", gloss: "همین که، به مجرد این‌که", note: "*as soon as* یعنی فوراً وقتی یک چیز اتفاق افتاد.", example_gloss: "همین که برسم، پیام می‌تم."}
  en.b1.unit08.lesson01.teach.by_the_time: {title: "by the time", gloss: "تا وقتی که، تا زمانِ", note: "*by the time* یعنی نه دیرتر از وقتی که یک اتفاق دیگر می‌افته.", example_gloss: "تا وقتی میا برسه، نان شب آماده می‌شه."}
  en.b1.unit08.lesson01.teach.check_in: {title: "check in", gloss: "خبر دادن که رسیدین یا امن استین", note: "*check in* یعنی به کسی خبر بتین که رسیدین یا حال‌تان خوب استه.", example_gloss: "وقتی به هوتل رسیدین، لطفاً خبر بتین."}
  en.b1.unit08.lesson01.teach.lock_up: {title: "lock up", gloss: "قفل و امن کدن", note: "*lock up* یعنی یک اتاق یا تعمیر را بسته و قفل کنین.", example_gloss: "قبل از این‌که از دفتر برایم، همه جا را قفل می‌کنم."}

  en.b1.unit08.lesson02.teach.as_soon_as_home: {title: "As soon as I get home, I will call you.", gloss: "همین که خانه برسم، برایت زنگ می‌زنم.", note: "*as soon as* نشان می‌ته عمل دوم فوراً بعد از عمل اول می‌شه."}
  en.b1.unit08.lesson02.teach.before_upstairs: {title: "Before you go upstairs, please check the mail.", gloss: "قبل از این‌که بالا بری، لطفاً نامه‌ها را چک کن.", note: "*before* می‌گه کدام کار اول انجام شه."}
  en.b1.unit08.lesson02.teach.grammar_future_time_clause: {title: "When I get home, I will call you. Before you go upstairs, please check the mail.", gloss: "وقتی خانه برسم، زنگ می‌زنم. قبل از این‌که بالا بری، لطفاً نامه‌ها را چک کن.", note: "در جمله‌وارهٔ زمانی آینده فعل حال استعمال می‌شه. در انگلیسی نمی‌گین *when I will get home*؛ بعد از *when/as soon as/before/after* فعل حال می‌آیه."}

  en.b1.unit08.lesson03.teach.front_door: {title: "front door", gloss: "دروازهٔ پیش‌رو، دروازهٔ اصلی", note: "*front door* یعنی دروازهٔ اصلی خانه یا تعمیر.", example_gloss: "دنیل بعد از چک کدن نامه‌ها، دروازهٔ اصلی را قفل می‌کنه."}
  en.b1.unit08.lesson03.teach.ready: {title: "ready", gloss: "آماده", note: "*ready* یعنی چیزی برای استفاده یا شروع آماده استه.", example_gloss: "تا وقتی میا برسه، نان شب آماده می‌شه."}
  en.b1.unit08.lesson03.teach.reading_passage: {title: "متن دربارهٔ برنامهٔ شبانهٔ دنیل", gloss: "دنیل یک برنامهٔ شبانهٔ منظم داره. وقتی خانه می‌رسه، اول نامه‌ها را چک می‌کنه. بعد از این‌که نامه‌ها را چک می‌کنه، دروازهٔ اصلی را قفل می‌کنه. قبل از این‌که نان شب را شروع کنه، دست‌هایش را می‌شویه و میز را پاک می‌کنه. تا وقتی میا می‌رسه، آشپزخانه آماده استه و غذا گرم استه.", note: "همی متن ترتیب چند کار روزمره را با *when*، *after*، *before*، و *by the time* نشان می‌ته."}

  en.b1.unit08.lesson04.teach.q_call_when_home: {title: "خواهش لیلا", gloss: "لیلا می‌گه: دنیل، وقتی خانه رسیدی می‌تانی به من زنگ بزنی؟", note: "*when you get home* زمان انجام دادن زنگ را نشان می‌ته."}
  en.b1.unit08.lesson04.teach.a_as_soon_as_home: {title: "جواب دنیل", gloss: "دنیل می‌گه: البته. همین که خانه برسم، برایت زنگ می‌زنم.", note: "*As soon as I get home* یعنی فوراً بعد از رسیدن به خانه."}
  en.b1.unit08.lesson04.teach.q_check_mail: {title: "خواهش دوم لیلا", gloss: "لیلا می‌گه: لطفاً قبل از این‌که بالا بری، نامه‌ها را چک کن.", note: "*before you go upstairs* یعنی اول نامه‌ها، بعد بالا رفتن."}
  en.b1.unit08.lesson04.teach.a_after_mail_lock: {title: "جواب دنیل", gloss: "دنیل می‌گه: می‌کنم. بعد از این‌که نامه‌ها را چک کنم، دروازهٔ اصلی را قفل می‌کنم.", note: "*After I check the mail* ترتیب دوم را نشان می‌ته."}
  en.b1.unit08.lesson04.teach.q_by_the_time_mia: {title: "نظر لیلا", gloss: "لیلا می‌گه: عالی. تا وقتی میا برسه، باید همه چیز آماده باشه.", note: "*By the time Mia arrives* یعنی تا لحظه‌ای که میا می‌رسه."}
  en.b1.unit08.lesson04.teach.a_start_dinner: {title: "جواب دنیل", gloss: "دنیل می‌گه: پس وقتی او برسه، می‌تانیم نان شب را شروع کنیم.", note: "*when she arrives* زمان شروع نان شب را نشان می‌ته."}

