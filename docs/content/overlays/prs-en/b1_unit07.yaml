course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit07.conditions: {title: "اگه این اتفاق بیفته، همو کار را می‌کنیم"}

lessons:
  en.b1.unit07.lesson01.condition_vocabulary: {title: "If، unless، condition، و result"}
  en.b1.unit07.lesson02.real_conditions: {title: "اگه جلسه دیر شروع شه، پیام می‌فرستم"}
  en.b1.unit07.lesson03.reading_a_meeting_plan: {title: "متن خوانی: پلان جایگزین"}
  en.b1.unit07.lesson04.the_meeting_plan_dialogue: {title: "اگه اتاق مصروف باشه، آنلاین جلسه می‌کنیم"}

teaching:
  en.b1.unit07.lesson01.teach.if: {title: "if", gloss: "اگه", note: "*if* یک حالت یا شرط ممکن را معرفی می‌کنه.", example_gloss: "اگه بس دیر باشه، زنگ می‌زنم."}
  en.b1.unit07.lesson01.teach.unless: {title: "unless", gloss: "مگر این‌که، اگه نه", note: "*unless* یعنی «اگه نه» یا «به‌جز وقتی که». در انگلیسی بعد از *unless* معمولاً دیگر *not* نمی‌آیه.", example_gloss: "مگر این‌که پلان تغییر کنه، ساعت ده می‌بینیم."}
  en.b1.unit07.lesson01.teach.condition: {title: "condition", gloss: "شرط، حالت لازم", note: "*condition* یعنی حالتی که اول باید اتفاق بیفته تا نتیجهٔ بعدی بیایه.", example_gloss: "شرط روشن استه: اگه همه برسن، شروع می‌کنیم."}
  en.b1.unit07.lesson01.teach.result: {title: "result", gloss: "نتیجه", note: "*result* یعنی چیزی که به‌خاطر یک شرط اتفاق می‌افته.", example_gloss: "نتیجه این استه که آنلاین جلسه می‌کنیم."}
  en.b1.unit07.lesson01.teach.delay: {title: "delay", gloss: "تاخیر", note: "*delay* یعنی یک چیز دیرتر از وقت پلان‌شده اتفاق بیفته.", example_gloss: "تاخیر می‌تانه همه را دیر بسازه."}
  en.b1.unit07.lesson01.teach.reschedule: {title: "reschedule", gloss: "وقت نو تعیین کدن", note: "*reschedule* یعنی برای یک جلسه یا وعده وقت نو بگیرین.", example_gloss: "اگه داکتر مصروف باشه، وعده را وقت نو می‌گیریم."}

  en.b1.unit07.lesson02.teach.if_meeting_late: {title: "If the meeting starts late, I will send everyone a message.", gloss: "اگه جلسه دیر شروع شه، به همه پیام می‌فرستم.", note: "*If + present* برای شرط واقعی آینده می‌آیه؛ نتیجه با *will* گفته می‌شه."}
  en.b1.unit07.lesson02.teach.if_not_ready: {title: "If the report is not ready, we will reschedule the review.", gloss: "اگه ریپورت آماده نباشه، بررسی را وقت نو می‌گیریم.", note: "*if ... not* یک شرط منفی استه: اگه همی چیز آماده نشه، نتیجه تغییر می‌کنه."}
  en.b1.unit07.lesson02.teach.grammar_real_condition: {title: "Use present tense after if for a real future condition: If it starts late, I will send a message.", gloss: "بعد از if برای شرط واقعی آینده زمان حال می‌آیه: اگه دیر شروع شه، پیام می‌فرستم.", note: "در انگلیسی نمی‌گین *if it will start*؛ در بخش شرط، فعل حال می‌آیه: *if it starts*."}

  en.b1.unit07.lesson03.teach.backup_plan: {title: "backup plan", gloss: "پلان جایگزین", note: "*backup plan* یعنی یک پلان دوم که اگه پلان اول کار نکد، از آن استفاده کنین.", example_gloss: "اگه اتاق مصروف باشه، به یک پلان جایگزین ضرورت داریم."}
  en.b1.unit07.lesson03.teach.move_update: {title: "move the update", gloss: "خبر/اپدیت را به وقت دیگر انتقال دادن", note: "*move the update* یعنی وقت دادن یک خبر کاری را به روز یا ساعت دیگر ببَرین.", example_gloss: "اگه لیلا دیر کنه، اپدیتش را به فردا انتقال می‌تیم."}
  en.b1.unit07.lesson03.teach.reading_passage: {title: "متن دربارهٔ پلان جلسه", gloss: "دانیال برای جلسهٔ تیم یک پلان جایگزین می‌نویسه. اگه اتاق کنفرانس آزاد باشه، تیم ساعت ده همانجا جلسه می‌کنه. اگه اتاق مصروف باشه، آن‌ها آنلاین جلسه می‌کنن. مگر این‌که لیلا تا ساعت ده وصل شه، دانیال اپدیتش را به فردا انتقال می‌ده. اگه ریپورت آماده نباشه، میا به‌جایش یک اپدیت کوتاه‌تر می‌فرسته.", note: "همی متن چند شرط واقعی آینده را با نتیجه‌های کاری نشان می‌ته -- سویهٔ B1."}

  en.b1.unit07.lesson04.teach.q_if_meeting_late: {title: "سوال میا دربارهٔ جلسه", gloss: "میا می‌گه: دانیال، اگه جلسه دیر شروع شه چی کار کنیم؟", note: "*what should we do if...?* برای پرسیدن پلان در یک حالت ممکن استعمال می‌شه."}
  en.b1.unit07.lesson04.teach.a_send_message: {title: "جواب دانیال", gloss: "دانیال می‌گه: اگه دیر شروع شه، به همه پیام می‌فرستم.", note: "دانیال شرط را با *if* و نتیجه را با *will* می‌گه."}
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join: {title: "سوال میا دربارهٔ لیلا", gloss: "میا می‌گه: و اگه لیلا نتانه وصل شه؟", note: "*cannot join* یعنی نمی‌تانه در جلسه وصل یا شامل شه."}
  en.b1.unit07.lesson04.teach.a_unless_she_joins: {title: "جواب دانیال", gloss: "دانیال می‌گه: مگر این‌که تا ده وصل شه، اپدیتش را به فردا انتقال می‌تیم.", note: "*Unless she joins by ten* یعنی اگه تا ده وصل نشه."}
  en.b1.unit07.lesson04.teach.q_room_busy: {title: "سوال میا دربارهٔ اتاق", gloss: "میا می‌گه: منصفانه استه. اگه اتاق هنوز مصروف باشه، آنلاین جلسه کنیم؟", note: "*still busy* یعنی هنوز آزاد نشده."}
  en.b1.unit07.lesson04.teach.a_meet_online: {title: "جواب دانیال", gloss: "دانیال می‌گه: بلی، اگه اتاق مصروف باشه، به‌جایش آنلاین جلسه می‌کنیم.", note: "*instead* یعنی به‌جای پلان اول."}

