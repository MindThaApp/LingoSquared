    accepted_answers:
      - {value: "The server must have gone down overnight.", status: "correct"}
      - {value: "The server must have gone down overnight", status: "correct"}
      - {value: "The server must have gone down overnight because no reports were generated.", status: "correct"}
      - {value: "The server must have gone down overnight because no reports were generated", status: "correct"}
    feedback: "جواب باید *must have* را برای نتیجه‌گیری گذشته استفاده کنه."
  en.b2.unit02.lesson04.exercise05.speak_speculate:
    instruction: "آوازی جواب بتین و بگین شواهد محدود است اما به قطعی سیستم اشاره می‌کنه."
    accepted_answers:
      - {value: "The evidence is limited, but it points to a system outage.", status: "correct"}
      - {value: "The evidence is limited but it points to a system outage.", status: "correct"}
