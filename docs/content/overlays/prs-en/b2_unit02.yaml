  en.b2.unit02.lesson03.exercise02.choose_speculated_cause:
    instruction: "کدام جمله نتیجه‌گیری قوی میا دربارهٔ علت است؟"
    correct_option: "the server must have gone down during the night"
    distractors: ["The overnight reports did not run", "it might have been a permission issue", "the dashboard might show old data"]
    accepted_answers: [{value: "the server must have gone down during the night", status: "correct"}]
    feedback: "*must have gone down* علت را با اطمینان قوی نشان می‌ته."
  en.b2.unit02.lesson03.exercise03.match_fact_speculation:
    instruction: "هر برچسب را به جملهٔ درست از یادداشت حادثه وصل کنین."
    accepted_answers:
      - value:
          - {left: "known event", right: "the reports did not run"}
          - {left: "strong past deduction", right: "the server must have gone down"}
          - {left: "weaker possible cause", right: "it might have been a permission issue"}
          - {left: "explanation rejected by evidence", right: "it cannot explain the blank monitoring page"}
          - {left: "possible result", right: "the dashboard might show old data"}
        status: "correct"
    feedback: "واقعیت، علت ممکن، نتیجه‌گیری قوی، رد توضیح، و پیامد ممکن را جدا بخوانین."
  en.b2.unit02.lesson03.exercise04.write_possible_consequence:
    instruction: "همی پیامد ممکن را با *might show* بنویسین: *The client dashboard might show old data.*"
    accepted_answers:
      - {value: "The client dashboard might show old data.", status: "correct"}
      - {value: "The client dashboard might show old data", status: "correct"}
      - {value: "The dashboard might show old data.", status: "correct"}
      - {value: "The dashboard might show old data", status: "correct"}
    feedback: "*might show* پیامد ممکن را نشان می‌ته، نه یقین."
  en.b2.unit02.lesson03.exercise05.write_deduction_not_guesswork:
    instruction: "دقیقاً بنویسین که توضیح او نتیجه‌گیری از شواهد است، نه حدس بی‌پایه."
    accepted_answers:
      - {value: "Her explanation is a deduction from the available evidence, not pure guesswork.", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence, not pure guesswork", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence and not pure guesswork.", status: "correct"}
      - {value: "Her explanation is a deduction from the available evidence and not pure guesswork", status: "correct"}
    feedback: "جمله باید فرق *deduction* و *guesswork* را واضح نگه کنه."

  en.b2.unit02.lesson04.exercise01.choose_mia_deduction:
    instruction: "در گفتگو، کدام جمله نتیجه‌گیری قوی میا دربارهٔ علت است؟"
