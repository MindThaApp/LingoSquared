      - {left: "cannot", right: "نمی‌تانه، ممکن نیست"}
      - {left: "deduction", right: "نتیجه‌گیری از شواهد"}
      - {left: "guesswork", right: "حدس بی‌پایه یا کم‌شواهد"}
    accepted_answers:
      - value:
          - {left: "may", right: "شاید، ممکن استه"}
          - {left: "might", right: "شاید، احتمالاً کمی نرم‌تر"}
          - {left: "must", right: "حتماً / لابد، نتیجه‌گیری از روی شواهد"}
          - {left: "cannot", right: "نمی‌تانه، ممکن نیست"}
          - {left: "deduction", right: "نتیجه‌گیری از شواهد"}
