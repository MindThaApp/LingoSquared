  en.b2.unit02.lesson01.exercise04.write_deduction:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی فکر کدن از روی شواهد."
    accepted_answers:
      - {value: "deduction", status: "correct"}
      - {value: "Deduction", status: "correct"}
    feedback: "*deduction* یعنی نتیجه‌گیری از شواهد."
  en.b2.unit02.lesson01.exercise05.write_guesswork:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی حدس با شواهد کم یا هیچ."
    accepted_answers:
      - {value: "guesswork", status: "correct"}
      - {value: "Guesswork", status: "correct"}
    feedback: "*guesswork* یعنی حدس بی‌پایه یا کم‌شواهد."

  en.b2.unit02.lesson02.exercise01.choose_past_deduction:
    instruction: "کدام جمله از شواهد یک نتیجه‌گیری قوی مثبت دربارهٔ علت گذشته می‌سازه؟"
    correct_option: "The server must have gone down overnight because no reports were generated."
    distractors: ["The reports may have failed during the night.", "It might have been a permission issue instead.", "It cannot have been only a report problem."]
