course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای حدس با درجه‌های اطمینان، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit02.speculation: {title: "حتماً شب سرور از کار افتاده بوده"}

lessons:
  en.b2.unit02.lesson01.certainty_and_deduction: {title: "May، might، must، و cannot"}
  en.b2.unit02.lesson02.present_and_past_speculation: {title: "حتماً یک مشکل سیستم بوده"}
  en.b2.unit02.lesson03.reading_an_incident_note: {title: "متن خوانی: احتمالاً چی واقع شد؟"}
  en.b2.unit02.lesson04.the_speculation_dialogue: {title: "یک نتیجه‌گیری از شواهد، نه فقط حدس"}

teaching:
  en.b2.unit02.lesson01.teach.may: {title: "may", gloss: "شاید، ممکن استه", note: "*may* یک امکان را نشان می‌ته. در انگلیسی بعد از آن فعل ساده می‌آیه: *may be*، نی *may is*.", example_gloss: "این شاید درست باشه."}
  en.b2.unit02.lesson01.teach.might: {title: "might", gloss: "شاید، احتمالاً کمی نرم‌تر", note: "*might* هم امکان را نشان می‌ته، اما اکثراً کمی محتاط‌تر از *may* شنیده می‌شه.", example_gloss: "این شاید درست باشه."}
  en.b2.unit02.lesson01.teach.must: {title: "must", gloss: "حتماً / لابد، نتیجه‌گیری از روی شواهد", note: "در حدس B2، *must* همیشه «باید وظیفه‌ای» نیست؛ می‌تانه یعنی از شواهد تقریباً مطمئن استین.", example_gloss: "این حتماً درست استه."}
  en.b2.unit02.lesson01.teach.cannot: {title: "cannot", gloss: "نمی‌تانه، ممکن نیست", note: "*cannot* وقتی می‌آیه که شواهد یک توضیح را رد می‌کنه. شکل کوتاه *can't* هم طبیعی استه.", example_gloss: "این نمی‌تانه درست باشه."}
  en.b2.unit02.lesson01.teach.deduction: {title: "deduction", gloss: "نتیجه‌گیری از شواهد", note: "*deduction* یعنی از شواهد به یک نتیجه می‌رسین، نه این‌که تصادفی حدس بزنین.", example_gloss: "نتیجه‌گیری میا بر اساس شواهد استه."}
  en.b2.unit02.lesson01.teach.guesswork: {title: "guesswork", gloss: "حدس بی‌پایه یا کم‌شواهد", note: "*guesswork* وقتی استه که شواهد کم یا هیچ نیست.", example_gloss: "بدون شواهد، توضیح فقط حدس بی‌پایه می‌بود."}
  en.b2.unit02.lesson01.teach.may_might_contrast: {title: "may در برابر might", gloss: "*May* و *might* زیاد با هم نزدیک استن. هر دو یک توضیح ممکن را نشان می‌تن؛ *might* اکثراً کمی محتاط‌تر معلوم می‌شه.", note: "در دری یک «شاید» برای هر دو می‌آیه، اما در انگلیسی می‌تانین با *might* لحن را نرم‌تر بسازین."}

  en.b2.unit02.lesson02.teach.must_have_gone_down: {title: "The server must have gone down overnight because no reports were generated.", gloss: "سرور حتماً شب از کار افتاده بوده، چون هیچ ریپورتی ساخته نشده.", note: "*must have + past participle* یعنی نتیجه‌گیری قوی دربارهٔ گذشته -- مثل «حتماً / باید از کار افتاده باشه» در دری. بعد از *must have* همیشه past participle (*gone*) می‌آیه، نی *went*.", media_asset_key: "en.b2.audio.speculation.sentence.01"}
  en.b2.unit02.lesson02.teach.may_have_failed: {title: "The reports may have failed during the night.", gloss: "ریپورت‌ها شاید در جریان شب اجرا نشده باشن.", note: "*may have failed* امکان گذشته را نشان می‌ته، نه یقین."}
  en.b2.unit02.lesson02.teach.might_have_permission: {title: "It might have been a permission issue instead.", gloss: "شاید به جایش یک مشکل اجازه دسترسی بوده باشه.", note: "*might have been* یک علت ممکن گذشته استه، با اطمینان کمتر."}
  en.b2.unit02.lesson02.teach.cannot_have_only_report: {title: "It cannot have been only a report problem.", gloss: "نمی‌تانه فقط یک مشکل ریپورت بوده باشه.", note: "*cannot have been* یعنی شواهد همی توضیح را رد می‌کنه."}
  en.b2.unit02.lesson02.teach.grammar_modal_deduction: {title: "حدس دربارهٔ حال و گذشته", gloss: "برای نتیجه‌گیری قوی حال از *must be* استفاده کنین، و برای گذشته از *must have been*. برای امکان حال *may* یا *might*، و برای امکان گذشته *may have* یا *might have* می‌آیه. وقتی شواهد یک توضیح را رد می‌کنه، *cannot* یا *cannot have been* استفاده می‌شه.", note: "بعد از *may/might/must/cannot* فعل ساده می‌آیه؛ برای گذشته *have + participle* لازم استه."}

  en.b2.unit02.lesson03.teach.outage: {title: "outage", gloss: "از کار افتادن سیستم، قطعی", note: "*outage* یعنی یک سیستم برای یک مدت کار نمی‌کنه.", example_gloss: "یک قطعی سیستم باعث شد ریپورت‌ها اجرا نشن."}
  en.b2.unit02.lesson03.teach.consequence: {title: "consequence", gloss: "نتیجه، پیامد", note: "*consequence* یعنی چیزی که بعد از یک مشکل یا عمل واقع می‌شه.", example_gloss: "یک پیامد این استه که داشبورد شاید معلومات کهنه نشان بته."}
  en.b2.unit02.lesson03.teach.reading_passage: {title: "یادداشت حادثه", gloss: "ریپورت‌های شبانه اجرا نشدن، و صفحهٔ نظارت خالی استه. میا می‌گه سرور حتماً در جریان شب از کار افتاده بوده. دانیال پیشنهاد می‌کنه که شاید مشکل اجازه دسترسی بوده باشه، اما این نمی‌تانه صفحهٔ خالی نظارت را توضیح بته. تیم مالی شاید رقم‌های صبح را نداشته باشه، و داشبورد مشتری شاید تا وقتی ریپورت‌ها دوباره ساخته می‌شن معلومات کهنه نشان بته. میا کاملاً مطمئن نیست، اما توضیحش نتیجه‌گیری از شواهد موجود استه، نه حدس کاملاً بی‌پایه.", note: "فرق بین واقعیت، حدس ممکن، نتیجه‌گیری قوی، و رد یک توضیح را دنبال کنین."}

  en.b2.unit02.lesson04.teach.q_no_reports: {title: "گپ دانیال دربارهٔ ریپورت‌ها", gloss: "دانیال می‌گه: هیچ‌کدام از ریپورت‌های شبانه ساخته نشده.", note: "این واقعیت استه، نه حدس.", media_asset_key: "en.b2.audio.dialogue.speculation.01"}
  en.b2.unit02.lesson04.teach.a_server_down: {title: "نتیجه‌گیری میا", gloss: "میا می‌گه: سرور حتماً شب از کار افتاده بوده.", note: "*must have gone down* یعنی از شواهد به گذشته نتیجه می‌گیره."}
  en.b2.unit02.lesson04.teach.q_permission_issue: {title: "احتمال دیگر دانیال", gloss: "دانیال می‌گه: شاید به جایش یک مشکل اجازه دسترسی بوده باشه.", note: "*might have been* یک احتمال استه، نه یقین."}
  en.b2.unit02.lesson04.teach.a_cannot_only_report: {title: "رد کدن یک توضیح", gloss: "میا می‌گه: شاید، اما صفحهٔ نظارت هم خالی استه، پس نمی‌تانه فقط یک مشکل ریپورت بوده باشه.", note: "*cannot have been only...* نشان می‌ته شواهد آن توضیح را کافی نمی‌دانه."}
  en.b2.unit02.lesson04.teach.q_consequences: {title: "سوال دربارهٔ پیامدها", gloss: "دانیال می‌پرسه: باید انتظار کدام پیامدها را داشته باشیم؟", note: "*consequences* یعنی نتیجه‌های احتمالی مشکل."}
  en.b2.unit02.lesson04.teach.a_possible_consequences: {title: "پیامدهای ممکن", gloss: "میا می‌گه: تیم مالی شاید رقم‌های صبح را نداشته باشه، و داشبورد مشتری شاید معلومات کهنه نشان بته.", note: "*may be missing* و *might show* هر دو پیامد ممکن را نشان می‌تن."}
  en.b2.unit02.lesson04.teach.q_deduction_guess: {title: "سوال دانیال دربارهٔ نوع فکر", gloss: "دانیال می‌پرسه: پس این یک نتیجه‌گیری از شواهد استه، نه فقط حدس؟", note: "او فرق بین *deduction* و *guess* را می‌پرسه."}
  en.b2.unit02.lesson04.teach.a_evidence_limited: {title: "جواب میا", gloss: "میا می‌گه: بلی. شواهد محدود استه، اما به یک قطعی سیستم اشاره می‌کنه.", note: "*limited evidence* یعنی هنوز صد فیصد یقین نیست، اما دلیل وجود داره."}

exercises:
  en.b2.unit02.lesson01.exercise01.choose_deduction:
    instruction: "کدام کلمه یعنی نتیجه‌ای که از شواهد می‌گیرین، نه یک حدس تصادفی؟"
    correct_option: "deduction"
    distractors: ["guesswork", "may", "cannot"]
    accepted_answers: [{value: "deduction", status: "correct"}]
    feedback: "*deduction* یعنی نتیجه‌گیری از شواهد."
  en.b2.unit02.lesson01.exercise02.choose_cannot:
    instruction: "کدام modal نشان می‌ته که گوینده فکر می‌کنه چیزی ناممکن یا تقریباً ناممکن استه؟"
    correct_option: "cannot"
    distractors: ["may", "might", "must"]
    accepted_answers: [{value: "cannot", status: "correct"}]
    feedback: "*cannot* یا *can't* یک توضیح را رد می‌کنه."
  en.b2.unit02.lesson01.exercise03.match_certainty:
