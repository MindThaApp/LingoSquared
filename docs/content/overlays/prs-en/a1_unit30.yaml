course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit30.hobbies: {title: "گپ‌زدن در بارهٔ سرگرمی‌ها"}

lessons:
  en.a1.unit30.lesson01.free_time_activities: {title: "کارهای وخت آزاد"}
  en.a1.unit30.lesson02.how_often: {title: "چند وخت؟ قیدهای تکرار"}
  en.a1.unit30.lesson03.dialogue_free_time: {title: "گپ در بارهٔ وخت آزاد"}
  en.a1.unit30.lesson04.comparing_hobbies: {title: "مقایسهٔ سرگرمی‌ها"}

teaching:
  en.a1.unit30.lesson01.teach.reading: {title: "reading", gloss: "کتاب‌خوانی / مطالعه", note: "reading یعنی کتاب‌خوانی."}
  en.a1.unit30.lesson01.teach.cooking: {title: "cooking", gloss: "پخت‌وپز", note: "cooking یعنی پخت‌وپز کردن."}
  en.a1.unit30.lesson01.teach.painting: {title: "painting", gloss: "نقاشی", note: "painting یعنی نقاشی‌کردن."}
  en.a1.unit30.lesson01.teach.running: {title: "running", gloss: "دویدن", note: "running یعنی دویدن. جملهٔ نمونه: He goes running every morning -- او هر سحر می‌ره دویدن. دقت کنین: در انگلیسی فعل کمکی goes پیش از running می‌آیه، خو در دری همی مفهوم اکثراً با یک فعل ساده بیان می‌شه (می‌ره دویدن)."}
  en.a1.unit30.lesson01.teach.video_games: {title: "video games", gloss: "بازی‌های ویدیویی", note: "video games یعنی بازی‌های ویدیویی."}

  en.a1.unit30.lesson02.teach.always: {title: "always", gloss: "همیشه", note: "always یعنی همیشه. در انگلیسی این قیدها معمولاً پیش از فعل اصلی می‌آیند: I always go running -- من همیشه می‌رم دویدن."}
  en.a1.unit30.lesson02.teach.often: {title: "often", gloss: "بیشتر اوقات / اکثراً", note: "often یعنی بیشتر اوقات. جملهٔ نمونه: She often cooks dinner for her family -- او اکثراً برای خانواده‌اش نان شب می‌پزه."}
  en.a1.unit30.lesson02.teach.sometimes: {title: "sometimes", gloss: "بعضی وقت‌ها", note: "sometimes یعنی بعضی وقت‌ها."}
  en.a1.unit30.lesson02.teach.rarely: {title: "rarely", gloss: "به ندرت", note: "rarely یعنی به ندرت، خیلی کم."}
  en.a1.unit30.lesson02.teach.never: {title: "never", gloss: "هیچ وقت", note: "never یعنی هیچ وقت."}
  en.a1.unit30.lesson02.teach.free_time_question: {title: "What do you do in your free time?", gloss: "در وخت آزادت چی کار می‌کنی؟", note: "طرز جوردادن سوال: What do you do...؟ -- توجه کنین که فعل کمکی do پیش از فاعل می‌آیه، ساختاری که معادل مستقیم در دری نداره چون دری از فعل کمکی سوالی جدا استفاده نمی‌کنه."}

  en.a1.unit30.lesson03.teach.i_like_pattern: {title: "I like reading.", gloss: "من کتاب‌خوانی را دوست دارم.", note: "I like + فعل+ing، برای بیان علاقه استعمال می‌شه."}
  en.a1.unit30.lesson03.teach.dialogue_line1: {title: "لیلا از دنیل می‌پرسه", gloss: "لیلا می‌پرسه: دنیل، در وخت آزادت چی کار می‌کنی؟", note: "شروع گفتگو با یک سوال دوستانه."}
  en.a1.unit30.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه: من اکثراً می‌رم دویدن. و بعضی وقت‌ها پخت‌وپز می‌کنم. تو چطور؟", note: "دنیل دو سرگرمی را با هم ذکر می‌کنه و بعد سوال را پس می‌ده."}
  en.a1.unit30.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "لیلا می‌گه: من نقاشی را خیلی دوست دارم. تقریباً هر آخر هفته نقاشی می‌کنم.", note: "love + فعل+ing نشان‌دهندهٔ علاقهٔ قوی‌تر از like استه."}
  en.a1.unit30.lesson03.teach.dialogue_line4: {title: "دنیل می‌پرسه", gloss: "دنیل می‌گه: عالیه! هیچ وقت بازی‌های ویدیویی می‌کنی؟", note: "Do you ever...؟ برای پرسیدن در بارهٔ تکرار یک کار استعمال می‌شه."}
  en.a1.unit30.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه: به ندرت. من کتاب‌خوانی را ترجیح می‌دم.", note: "prefer یعنی ترجیح دادن."}

  en.a1.unit30.lesson04.teach.reading_passage: {title: "متن مقایسهٔ سرگرمی‌ها", gloss: "دنیل و لیلا سرگرمی‌های مختلف دارند. دنیل همیشه صبح‌های شنبه می‌ره دویدن، و بعضی وقت‌ها برای دوستانش نان شب می‌پزه. لیلا هیچ وقت نمی‌ره دویدن، خو اکثراً آخر هفته نقاشی می‌کنه. هردوی‌شان بازی‌های ویدیویی را دوست دارند، خو فقط بعضی وقت‌ها با هم بازی می‌کنند.", note: "این متن قیدهای تکرار (always/sometimes/never/often) را در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit30.lesson01.exercise01.listen_hobby:
    instruction: "گوش کنین و سرگرمی‌ای که گفته شد را انتخاب کنین."
    correct_option: "painting"
    distractors: ["reading", "cooking", "running"]
    accepted_answers: [{value: "painting", status: "correct"}]
    feedback: "painting یعنی نقاشی."
  en.a1.unit30.lesson01.exercise02.choose_reading_meaning:
    instruction: "کدام سرگرمی یعنی دیدن یک کتاب و فهمیدن کلمات آن؟"
    correct_option: "reading"
    distractors: ["cooking", "painting", "running"]
    accepted_answers: [{value: "reading", status: "correct"}]
    feedback: "reading یعنی کتاب‌خوانی."
  en.a1.unit30.lesson01.exercise03.match_hobbies:
    instruction: "هر توضیح را به سرگرمی درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "دیدن یک کتاب و فهمیدن کلمات آن", right: "reading"}, {left: "آماده‌کردن خوراک برای خوردن", right: "cooking"}, {left: "کشیدن تصویر با رنگ و برس", right: "painting"}, {left: "تیز حرکت‌کردن با پا برای ورزش", right: "running"}, {left: "بازی‌کردن روی یک صفحه", right: "video games"}], status: "correct"}]
    feedback: "reading=کتاب‌خوانی، cooking=پخت‌وپز، painting=نقاشی، running=دویدن، video games=بازی‌های ویدیویی."
  en.a1.unit30.lesson01.exercise04.order_running_sentence:
    instruction: "کلمات را برای گفتن «او هر سحر می‌ره دویدن» ترتیب کنین."
    accepted_answers: [{value: ["He", "goes", "running", "every", "morning"], status: "correct"}]
    feedback: "ترتیب درست He goes running every morning است."
  en.a1.unit30.lesson01.exercise05.write_hobby:
    instruction: "سرگرمی‌ای که یعنی آماده‌کردن خوراک برای خوردن را بنویسین."
    accepted_answers:
      - {value: "cooking", status: "correct"}
      - {value: "Cooking", status: "correct"}
    feedback: "cooking یعنی پخت‌وپز."

  en.a1.unit30.lesson02.exercise01.listen_frequency:
    instruction: "گوش کنین و قید تکراری که گفته شد را انتخاب کنین."
    correct_option: "often"
    distractors: ["always", "sometimes", "never"]
    accepted_answers: [{value: "often", status: "correct"}]
    feedback: "often یعنی بیشتر اوقات."
  en.a1.unit30.lesson02.exercise02.choose_never_meaning:
    instruction: "کدام کلمه یعنی هیچ وخت، صفر مرتبه؟"
    correct_option: "never"
    distractors: ["always", "often", "sometimes"]
    accepted_answers: [{value: "never", status: "correct"}]
    feedback: "never یعنی هیچ وقت."
  en.a1.unit30.lesson02.exercise03.choose_most_frequent:
    instruction: "کدام کلمه یعنی هر مرتبه، صد فیصد؟"
    correct_option: "always"
    distractors: ["often", "sometimes", "rarely"]
    accepted_answers: [{value: "always", status: "correct"}]
    feedback: "always یعنی همیشه."
  en.a1.unit30.lesson02.exercise04.order_frequency_sentence:
    instruction: "کلمات را برای گفتن «او اکثراً برای خانواده‌اش نان شب می‌پزه» ترتیب کنین."
    accepted_answers: [{value: ["She", "often", "cooks", "dinner", "for", "her", "family"], status: "correct"}]
    feedback: "ترتیب درست She often cooks dinner for her family است."
  en.a1.unit30.lesson02.exercise05.translate_free_time_question:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «در وخت آزادت چی کار می‌کنی؟»"
    accepted_answers:
      - {value: "What do you do in your free time?", status: "correct"}
      - {value: "What do you do in your free time", status: "correct"}
    feedback: "What do you do in your free time؟ یعنی در وخت آزادت چی کار می‌کنی؟"

  en.a1.unit30.lesson03.exercise01.comprehension_daniel_hobby:
    instruction: "مطابق گفتگو، دنیل اکثراً چی کار می‌کنه؟"
    correct_option: "running"
    distractors: ["cooking", "painting", "video games"]
    accepted_answers: [{value: "running", status: "correct"}]
    feedback: "دنیل می‌گه I often go running."
  en.a1.unit30.lesson03.exercise02.comprehension_leila_frequency:
    instruction: "لیلا چند وخت بازی‌های ویدیویی می‌کنه؟"
    correct_option: "Rarely"
    distractors: ["Always", "Often", "Never"]
    accepted_answers: [{value: "Rarely", status: "correct"}]
    feedback: "لیلا می‌گه Rarely -- به ندرت."
  en.a1.unit30.lesson03.exercise03.listen_dialogue_leila_hobby:
    instruction: "لیلا چی را خیلی دوست داره؟"
    correct_option: "painting"
    distractors: ["reading", "cooking", "running"]
    accepted_answers: [{value: "painting", status: "correct"}]
    feedback: "لیلا می‌گه I love painting."
  en.a1.unit30.lesson03.exercise04.respond_to_question:
    instruction: "جواب بدین: در وخت آزادت چی کار می‌کنی؟"
    accepted_answers:
      - {value: "I like reading", status: "correct"}
      - {value: "I like reading.", status: "correct"}
      - {value: "I like cooking", status: "correct"}
      - {value: "I like cooking.", status: "correct"}
      - {value: "I like painting", status: "correct"}
      - {value: "I like painting.", status: "correct"}
      - {value: "I like running", status: "correct"}
      - {value: "I like running.", status: "correct"}
      - {value: "I like video games", status: "correct"}
      - {value: "I like video games.", status: "correct"}
    feedback: "می‌تانین با هر کدام از سرگرمی‌های یادشده جواب بدین، مثلاً I like reading."

  en.a1.unit30.lesson04.exercise01.reading_who_runs:
    instruction: "مطابق متن، کی می‌ره دویدن؟"
    correct_option: "Daniel"
    distractors: ["Leila", "both of them", "neither of them"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "متن می‌گه Daniel always goes running."
  en.a1.unit30.lesson04.exercise02.reading_leila_frequency:
    instruction: "لیلا چند وخت می‌ره دویدن؟"
    correct_option: "never"
    distractors: ["always", "often", "sometimes"]
    accepted_answers: [{value: "never", status: "correct"}]
    feedback: "متن می‌گه Leila never goes running."
  en.a1.unit30.lesson04.exercise03.reading_shared_hobby:
    instruction: "کدام سرگرمی را هردوی‌شان دوست دارند؟"
    correct_option: "video games"
    distractors: ["reading", "cooking", "painting"]
    accepted_answers: [{value: "video games", status: "correct"}]
    feedback: "متن می‌گه They both like video games."
  en.a1.unit30.lesson04.exercise04.write_own_hobby:
    instruction: "یک جمله در بارهٔ یک سرگرمی که دوست دارین بنویسین، با «I like» یا «I love»."
    accepted_answers:
      - {value: "I like reading", status: "correct"}
      - {value: "I like reading.", status: "correct"}
      - {value: "I like cooking", status: "correct"}
      - {value: "I like cooking.", status: "correct"}
      - {value: "I like painting", status: "correct"}
      - {value: "I like painting.", status: "correct"}
      - {value: "I like running", status: "correct"}
      - {value: "I like running.", status: "correct"}
      - {value: "I like video games", status: "correct"}
      - {value: "I like video games.", status: "correct"}
      - {value: "I love reading", status: "correct"}
      - {value: "I love reading.", status: "correct"}
      - {value: "I love cooking", status: "correct"}
      - {value: "I love cooking.", status: "correct"}
      - {value: "I love painting", status: "correct"}
      - {value: "I love painting.", status: "correct"}
      - {value: "I love running", status: "correct"}
      - {value: "I love running.", status: "correct"}
      - {value: "I love video games", status: "correct"}
      - {value: "I love video games.", status: "correct"}
    feedback: "می‌تانین با I like یا I love شروع کنین و یکی از سرگرمی‌ها را ذکر کنین."
