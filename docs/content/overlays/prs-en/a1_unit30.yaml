review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 17 fixes — false grammar note fixed (goes is the main verb of go, not an auxiliary), informal 2sg (آزادت، می‌کنی، تو) -> polite شما to match the course, وخت/وقت unified, دوست دارم -> خوش دارم (love/like consistent with unit19), formal plural -ند forms -> Afghan colloquial -ن, خوانده instead of دیدن for reading, missing verb بازی in 2 prompts, leila listen_select distractor reading removed (she says she prefers it), open question ex04 accepts love/frequency answers, extra word-order variant, spacing/ZWNJ, added example_gloss to 10 vocabulary cards (schema 1.1). NATIVE FLAGS: 1) می‌تم vs می‌دم for the 1sg of دادن (course uses می‌تم; ترجیح می‌تم) needs a native call; 2) colloquial فیصد/سحر/مکتب choices; 3) there is no clear Dari gloss for goes running beyond می‌ره دویدن. Prior note: Draft only -- authored against a still-unreviewed shared English realization (en.a1.unit30.hobbies), per the standing outage contingency. Needs the mandatory fresh-context review before import, same as every other Claude-authored unit this project. CORRECTION added by same-session-family review pass (not the mandatory fresh-context review): this file originally used هغه for he/she, which is a Pashto pronoun, not Dari -- Dari uses او. Every instance of هغه in this file has been replaced with او. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit30.hobbies: {title: "گپ زدن دربارهٔ سرگرمی‌ها"}

lessons:
  en.a1.unit30.lesson01.free_time_activities: {title: "کارهای وقت آزاد"}
  en.a1.unit30.lesson02.how_often: {title: "چند وقت؟ قیدهای تکرار"}
  en.a1.unit30.lesson03.dialogue_free_time: {title: "گپ دربارهٔ وقت آزاد"}
  en.a1.unit30.lesson04.comparing_hobbies: {title: "مقایسهٔ سرگرمی‌ها"}

teaching:
  en.a1.unit30.lesson01.teach.reading: {title: "reading", gloss: "کتاب‌خوانی / مطالعه", note: "reading یعنی کتاب‌خوانی.", example_gloss: "کتاب‌خوانی سرگرمی دلخواه من استه."}
  en.a1.unit30.lesson01.teach.cooking: {title: "cooking", gloss: "پخت‌وپز", note: "cooking یعنی پخت‌وپز کردن.", example_gloss: "خواهرم پخت‌وپز را خیلی خوش داره."}
  en.a1.unit30.lesson01.teach.painting: {title: "painting", gloss: "نقاشی", note: "painting یعنی نقاشی کردن.", example_gloss: "او آخر هفته را به نقاشی می‌گذرانه."}
  en.a1.unit30.lesson01.teach.running: {title: "running", gloss: "دویدن", note: "running یعنی دویدن. جملهٔ نمونه: He goes running every morning -- او هر سحر می‌ره دویدن. در همی جمله goes شکل سوم‌شخص مفرد فعل go استه (فعل اصلی)، و running بعد از آن می‌آیه؛ در دری همی مفهوم با «می‌ره دویدن» بیان می‌شه.", example_gloss: "او هر سحر می‌ره دویدن."}
  en.a1.unit30.lesson01.teach.video_games: {title: "video games", gloss: "بازی‌های ویدیویی", note: "video games یعنی بازی‌های ویدیویی.", example_gloss: "برادرم بعد از مکتب بازی‌های ویدیویی بازی می‌کنه."}

  en.a1.unit30.lesson02.teach.always: {title: "always", gloss: "همیشه", note: "always یعنی همیشه. در انگلیسی همی قیدها معمولاً پیش از فعل اصلی می‌آین: I always go running -- من همیشه می‌رم دویدن.", example_gloss: "من همیشه روزهای شنبه می‌رم دویدن."}
  en.a1.unit30.lesson02.teach.often: {title: "often", gloss: "بیشتر اوقات / اکثراً", note: "often یعنی بیشتر اوقات. جملهٔ نمونه: She often cooks dinner for her family -- او اکثراً برای خانواده‌اش نان شب می‌پزه.", example_gloss: "او اکثراً برای خانواده‌اش نان شب می‌پزه."}
  en.a1.unit30.lesson02.teach.sometimes: {title: "sometimes", gloss: "بعضی وقت‌ها", note: "sometimes یعنی بعضی وقت‌ها.", example_gloss: "ما بعضی وقت‌ها با هم بازی‌های ویدیویی بازی می‌کنیم."}
  en.a1.unit30.lesson02.teach.rarely: {title: "rarely", gloss: "به ندرت", note: "rarely یعنی به ندرت، خیلی کم.", example_gloss: "او در زمستان به ندرت نقاشی می‌کنه."}
  en.a1.unit30.lesson02.teach.never: {title: "never", gloss: "هیچ وقت", note: "never یعنی هیچ وقت.", example_gloss: "من شب‌ها هیچ وقت بازی‌های ویدیویی بازی نمی‌کنم."}
  en.a1.unit30.lesson02.teach.free_time_question: {title: "What do you do in your free time?", gloss: "در وقت آزادتان چی کار می‌کنین؟", note: "طرز جور کردن سوال: What do you do...؟ -- توجه کنین که فعل کمکی do پیش از فاعل می‌آیه، ساختاری که معادل مستقیم در دری نداره چون دری از فعل کمکی سوالی جدا استفاده نمی‌کنه."}

  en.a1.unit30.lesson03.teach.i_like_pattern: {title: "I like reading.", gloss: "من کتاب‌خوانی را خوش دارم.", note: "I like + فعل+ing، برای بیان علاقه استعمال می‌شه."}
  en.a1.unit30.lesson03.teach.dialogue_line1: {title: "لیلا از دنیل می‌پرسه", gloss: "لیلا می‌پرسه: دنیل، در وقت آزادتان چی کار می‌کنین؟", note: "شروع گفتگو با یک سوال دوستانه."}
  en.a1.unit30.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه: من اکثراً می‌رم دویدن. و بعضی وقت‌ها پخت‌وپز می‌کنم. شما چطور؟", note: "دنیل دو سرگرمی را با هم ذکر می‌کنه و بعد سوال را پس می‌ده."}
  en.a1.unit30.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "لیلا می‌گه: من نقاشی را خیلی خوش دارم. تقریباً هر آخر هفته نقاشی می‌کنم.", note: "love + فعل+ing نشان‌دهندهٔ علاقهٔ قوی‌تر از like استه."}
  en.a1.unit30.lesson03.teach.dialogue_line4: {title: "دنیل می‌پرسه", gloss: "دنیل می‌گه: عالیه! هیچ وقت بازی‌های ویدیویی بازی می‌کنین؟", note: "Do you ever...؟ برای پرسیدن دربارهٔ تکرار یک کار استعمال می‌شه."}
  en.a1.unit30.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه: به ندرت. من کتاب‌خوانی را ترجیح می‌تم.", note: "prefer یعنی ترجیح دادن."}

  en.a1.unit30.lesson04.teach.reading_passage: {title: "متن مقایسهٔ سرگرمی‌ها", gloss: "دنیل و لیلا سرگرمی‌های مختلف دارن. دنیل همیشه صبح‌های شنبه می‌ره دویدن، و بعضی وقت‌ها برای دوستانش نان شب می‌پزه. لیلا هیچ وقت نمی‌ره دویدن، خو اکثراً آخر هفته نقاشی می‌کنه. هردوشان بازی‌های ویدیویی را خوش دارن، خو فقط بعضی وقت‌ها با هم بازی می‌کنن.", note: "این متن قیدهای تکرار (always/sometimes/never/often) را در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit30.lesson01.exercise01.listen_hobby:
    instruction: "گوش کنین و سرگرمی‌ای که گفته شد را انتخاب کنین."
    correct_option: "painting"
    distractors: ["reading", "cooking", "running"]
    accepted_answers: [{value: "painting", status: "correct"}]
    feedback: "painting یعنی نقاشی."
  en.a1.unit30.lesson01.exercise02.choose_reading_meaning:
    instruction: "کدام سرگرمی یعنی خواندن یک کتاب و فهمیدن کلمات آن؟"
    correct_option: "reading"
    distractors: ["cooking", "painting", "running"]
    accepted_answers: [{value: "reading", status: "correct"}]
    feedback: "reading یعنی کتاب‌خوانی."
  en.a1.unit30.lesson01.exercise03.match_hobbies:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "reading", right: "خواندن نوشته‌های یک کتاب و فهمیدن آن‌ها"}
      - {left: "cooking", right: "آماده کردن غذا برای خوردن"}
      - {left: "painting", right: "ساختن تصویر با قلم‌مو و رنگ"}
      - {left: "running", right: "دویدن"}
      - {left: "video games", right: "بازی‌های ویدیویی"}
    accepted_answers:
      - value:
          - {left: "reading", right: "خواندن نوشته‌های یک کتاب و فهمیدن آن‌ها"}
          - {left: "cooking", right: "آماده کردن غذا برای خوردن"}
          - {left: "painting", right: "ساختن تصویر با قلم‌مو و رنگ"}
          - {left: "running", right: "دویدن"}
          - {left: "video games", right: "بازی‌های ویدیویی"}
        status: "correct"
    feedback: "reading=کتاب‌خوانی، cooking=پخت‌وپز، painting=نقاشی، running=دویدن، video games=بازی‌های ویدیویی."
  en.a1.unit30.lesson01.exercise04.order_running_sentence:
    instruction: "کلمات را برای گفتن «او هر سحر می‌ره دویدن» ترتیب کنین."
    accepted_answers:
      - {value: ["He", "goes", "running", "every", "morning"], status: "correct"}
      - {value: ["Every", "morning", "he", "goes", "running"], status: "correct"}
    feedback: "ترتیب درست He goes running every morning است."
  en.a1.unit30.lesson01.exercise05.write_hobby:
    instruction: "سرگرمی‌ای را بنویسین که یعنی آماده کردن غذا برای خوردن."
    accepted_answers:
      - {value: "cooking", status: "correct"}
      - {value: "Cooking", status: "correct"}
    feedback: "cooking یعنی پخت‌وپز."

  en.a1.unit30.lesson02.exercise01.listen_frequency:
    instruction: "گوش کنین و قید تکراری که گفته شد را انتخاب کنین."
    correct_option: "often"
    distractors: ["always", "sometimes", "never"]
    accepted_answers: [{value: "often", status: "correct"}]
    feedback: "often یعنی بیشتر اوقات."
  en.a1.unit30.lesson02.exercise02.choose_never_meaning:
    instruction: "کدام کلمه یعنی هیچ وقت، صفر مرتبه؟"
    correct_option: "never"
    distractors: ["always", "often", "sometimes"]
    accepted_answers: [{value: "never", status: "correct"}]
    feedback: "never یعنی هیچ وقت."
  en.a1.unit30.lesson02.exercise03.choose_most_frequent:
    instruction: "کدام کلمه یعنی هر مرتبه، صد فیصد؟"
    correct_option: "always"
    distractors: ["often", "sometimes", "rarely"]
    accepted_answers: [{value: "always", status: "correct"}]
    feedback: "always یعنی همیشه."
  en.a1.unit30.lesson02.exercise04.order_frequency_sentence:
    instruction: "کلمات را برای گفتن «او اکثراً برای خانواده‌اش نان شب می‌پزه» ترتیب کنین."
    accepted_answers: [{value: ["She", "often", "cooks", "dinner", "for", "her", "family"], status: "correct"}]
    feedback: "ترتیب درست She often cooks dinner for her family است."
  en.a1.unit30.lesson02.exercise05.translate_free_time_question:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «در وقت آزادتان چی کار می‌کنین؟»"
