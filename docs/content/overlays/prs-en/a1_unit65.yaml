course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit65.returns_exchanges: {title: "پس دادن و بدل کردن جنس"}

lessons:
  en.a1.unit65.lesson01.return_words: {title: "کلمات پس دادن جنس"}
  en.a1.unit65.lesson02.return_phrases: {title: "عبارات برای پس دادن جنس"}
  en.a1.unit65.lesson03.dialogue_at_the_returns_desk: {title: "گفتگو: در بخش پس دادن جنس"}
  en.a1.unit65.lesson04.a_return_receipt: {title: "متن: رسید پس دادن جنس"}

teaching:
  en.a1.unit65.lesson01.teach.return: {title: "return", gloss: "پس دادن", note: "return یعنی جنس را دوباره به دکان بردن.", example_gloss: "می‌خواهم این را پس بتم."}
  en.a1.unit65.lesson01.teach.exchange: {title: "exchange", gloss: "بدل کردن", note: "exchange یعنی یک جنس را با جنس دیگر بدل کردن.", example_gloss: "می‌تانم این را بدل کنم؟"}
  en.a1.unit65.lesson01.teach.receipt: {title: "receipt", gloss: "رسید", note: "receipt یعنی کاغذ یا پیام خرید که نشان می‌ته پول داده شده.", example_gloss: "رسید را دارین؟"}
  en.a1.unit65.lesson01.teach.size: {title: "size", gloss: "سایز / اندازه", note: "size یعنی اندازهٔ لباس، مثل کوچک، میانه یا کلان.", example_gloss: "به یک سایز کلان‌تر ضرورت دارم."}
  en.a1.unit65.lesson01.teach.refund: {title: "refund", gloss: "پس‌گرفتن پول", note: "refund یعنی پولی که دکان بعد از پس دادن جنس دوباره می‌ته.", example_gloss: "می‌تانین پول‌تان را پس بگیرین."}
  en.a1.unit65.lesson01.teach.small: {title: "small", gloss: "کوچک", note: "small یعنی کوچک؛ برای لباس یعنی سایزش کلان نیست.", example_gloss: "این سایز بسیار کوچک استه."}

  en.a1.unit65.lesson02.teach.want_return: {title: "I want to return this.", gloss: "می‌خواهم این را پس بتم.", note: "این جمله برای وقتی استه که جنس را به دکان پس می‌برین."}
  en.a1.unit65.lesson02.teach.can_exchange: {title: "Can I exchange it?", gloss: "می‌تانم این را بدل کنم؟", note: "Can I ...? برای پرسیدن اجازه یا امکان کار می‌ره."}
  en.a1.unit65.lesson02.teach.have_receipt: {title: "Do you have the receipt?", gloss: "رسید را دارین؟", note: "دکاندار با این سوال رسید خرید را می‌خواهد."}
  en.a1.unit65.lesson02.teach.too_small: {title: "This size is too small.", gloss: "این سایز بسیار کوچک استه.", note: "too small یعنی آن‌قدر کوچک که مناسب نیست."}
  en.a1.unit65.lesson02.teach.larger_size: {title: "I need a larger size.", gloss: "به یک سایز کلان‌تر ضرورت دارم.", note: "larger size یعنی سایز کلان‌تر."}
  en.a1.unit65.lesson02.teach.get_refund: {title: "You can get a refund.", gloss: "می‌تانین پول‌تان را پس بگیرین.", note: "get a refund یعنی پول خرید را دوباره گرفتن."}

  en.a1.unit65.lesson03.teach.dialogue_line1: {title: "درخواست دانیال", gloss: "سلام. می‌خواهم این پیراهن را پس بتم.", note: "Daniel می‌گه می‌خواهد پیراهن را پس بدهد."}
  en.a1.unit65.lesson03.teach.dialogue_line2: {title: "سوال کلرک", gloss: "رسید را دارین؟", note: "Clerk برای پس دادن جنس رسید می‌خواهد."}
  en.a1.unit65.lesson03.teach.dialogue_line3: {title: "توضیح دانیال", gloss: "بلی، اینه. سایزش بسیار کوچک استه.", note: "Daniel مشکل لباس را توضیح می‌ته."}
  en.a1.unit65.lesson03.teach.dialogue_line4: {title: "پیشنهاد کلرک", gloss: "می‌تانم آن را به یک سایز کلان‌تر بدل کنم؟", note: "exchange it for a larger size یعنی با سایز کلان‌تر بدل کردن."}
  en.a1.unit65.lesson03.teach.dialogue_line5: {title: "جواب دانیال", gloss: "بلی، لطفاً.", note: "Yes, please جواب کوتاه و مؤدبانه استه."}
  en.a1.unit65.lesson03.teach.dialogue_line6: {title: "معلومات کلرک", gloss: "ما یک سایز کلان‌تر در رنگ آبی داریم.", note: "in blue یعنی در رنگ آبی."}
  en.a1.unit65.lesson03.teach.dialogue_line7: {title: "تصمیم دانیال", gloss: "بسیار خوب. به پس‌گرفتن پول ضرورت ندارم.", note: "Daniel جنس را بدل می‌کند، پس refund نمی‌خواهد."}

  en.a1.unit65.lesson04.teach.return_note: {title: "یادداشت پس دادن", gloss: "یادداشت پس دادن: پیراهن آبی. سایز کوچک. بدل با سایز کلان‌تر. رسید لازم استه.", note: "این یادداشت می‌گه جنس چی استه، مشکل چیست، و چی لازم استه."}
  en.a1.unit65.lesson04.teach.reading_passage: {title: "متن: بدل کردن در دکان", gloss: "بدل کردن در دکان: دانیال یک پیراهن آبی خرید، اما سایزش بسیار کوچک بود. او با رسید دوباره به دکان رفت. کلرک رسید را خواست و یک سایز کلان‌تر پیشنهاد کرد. دانیال پیراهن را بدل کرد. او به پس‌گرفتن پول ضرورت نداشت، چون پیراهن آبی کلان‌تر خوب بود.", note: "این متن پس دادن، بدل کردن، رسید و سایز را تمرین می‌کنه."}

exercises:
  en.a1.unit65.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "receipt"
    distractors: ["ticket", "bag", "phone", "key"]
    accepted_answers: [{value: "receipt", status: "correct"}]
    feedback: "receipt یعنی رسید."
  en.a1.unit65.lesson01.exercise02.choose_refund_meaning:
    instruction: "کدام کلمه یعنی پولی که از دکان پس می‌گیرین؟"
    correct_option: "refund"
    distractors: ["size", "shirt", "color"]
    accepted_answers: [{value: "refund", status: "correct"}]
    feedback: "refund یعنی پس‌گرفتن پول."
  en.a1.unit65.lesson01.exercise03.match_return_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "return", right: "پس‌بردن یک جنس به دوکان"}
      - {left: "exchange", right: "بدل‌کردن یک جنس با جنس دیگر"}
      - {left: "receipt", right: "کاغذی که نشان می‌ته پول داده‌این"}
      - {left: "size", right: "اندازهٔ کلانی یا کوچکی لباس"}
      - {left: "refund", right: "پولی که دوباره پس می‌گیرین"}
      - {left: "small", right: "چیزی که کلان نیست"}
    accepted_answers:
      - value:
          - {left: "return", right: "پس‌بردن یک جنس به دوکان"}
          - {left: "exchange", right: "بدل‌کردن یک جنس با جنس دیگر"}
          - {left: "receipt", right: "کاغذی که نشان می‌ته پول داده‌این"}
          - {left: "size", right: "اندازهٔ کلانی یا کوچکی لباس"}
          - {left: "refund", right: "پولی که دوباره پس می‌گیرین"}
          - {left: "small", right: "چیزی که کلان نیست"}
        status: "correct"
    feedback: "return=پس دادن، exchange=بدل کردن، receipt=رسید، size=سایز، refund=پس‌گرفتن پول، small=کوچک."
  en.a1.unit65.lesson01.exercise04.order_return_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "want", "to", "return", "this."], status: "correct"}]
    feedback: "ترتیب درست: I want to return this."
  en.a1.unit65.lesson01.exercise05.write_receipt:
    instruction: "کلمه‌ای را بنویسین که یعنی کاغذی که نشان می‌ته شما پول داده‌این."
    accepted_answers: [{value: "receipt", status: "correct"}]
    feedback: "receipt یعنی رسید."

  en.a1.unit65.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Can I exchange it?"
    distractors: ["Can I open it?", "Can I call later?", "Can I sit here?"]
    accepted_answers: [{value: "Can I exchange it?", status: "correct"}]
    feedback: "Can I exchange it? یعنی می‌تانم این را بدل کنم؟"
  en.a1.unit65.lesson02.exercise02.choose_return_request:
    instruction: "کدام عبارت می‌گه که می‌خواهین یک جنس را پس ببرین؟"
    correct_option: "I want to return this."
    distractors: ["I want to drink water.", "I want to check my balance.", "I want to visit soon."]
    accepted_answers: [{value: "I want to return this.", status: "correct"}]
    feedback: "I want to return this. یعنی می‌خواهم این را پس بتم."
  en.a1.unit65.lesson02.exercise03.choose_receipt_question:
    instruction: "کدام عبارت رسید خرید را می‌پرسه؟"
    correct_option: "Do you have the receipt?"
    distractors: ["Do you have a fever?", "Do you need a charger?", "Do you like the jacket?"]
    accepted_answers: [{value: "Do you have the receipt?", status: "correct"}]
    feedback: "Do you have the receipt? یعنی رسید را دارین؟"
  en.a1.unit65.lesson02.exercise04.order_small_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "size", "is", "too", "small."], status: "correct"}]
    feedback: "ترتیب درست: This size is too small."
  en.a1.unit65.lesson02.exercise05.translate_refund:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «می‌تانین پول‌تان را پس بگیرین.»"
    accepted_answers:
      - {value: "You can get a refund.", status: "correct"}
      - {value: "You can get a refund", status: "correct"}
    feedback: "You can get a refund. یعنی می‌تانین پول‌تان را پس بگیرین."

  en.a1.unit65.lesson03.exercise01.comprehension_item:
    instruction: "مطابق گفتگو، دانیال چی را می‌خواهد پس بته؟"
    correct_option: "shirt"
    distractors: ["jacket", "umbrella", "charger"]
    accepted_answers: [{value: "shirt", status: "correct"}]
    feedback: "دانیال می‌خواهد پیراهن را پس بته."
  en.a1.unit65.lesson03.exercise02.comprehension_problem:
    instruction: "مطابق گفتگو، مشکل سایز چیست؟"
    correct_option: "too small"
    distractors: ["too large", "too old", "too expensive"]
    accepted_answers: [{value: "too small", status: "correct"}]
    feedback: "سایز بسیار کوچک استه."
  en.a1.unit65.lesson03.exercise03.listen_dialogue_receipt:
    instruction: "کلرک کدام سوال را می‌پرسه؟"
    correct_option: "Do you have the receipt?"
    distractors: ["Do you have the box?", "Do you need a bag?", "Do you want a red shirt?"]
    accepted_answers: [{value: "Do you have the receipt?", status: "correct"}]
    feedback: "کلرک می‌پرسه: Do you have the receipt?"
  en.a1.unit65.lesson03.exercise04.respond_own_return:
    instruction: "برای پس دادن یا بدل کردن چیزی بپرسین، یا مشکل سایز را توضیح بتین."
    accepted_answers: ["I want to return this", "I want to return this.", "Can I exchange it", "Can I exchange it?", "This size is too small", "This size is too small.", "I need a larger size", "I need a larger size."]
    feedback: "می‌تانین بگین I want to return this. یا This size is too small."

  en.a1.unit65.lesson04.exercise01.note_item:
    instruction: "مطابق یادداشت، جنس چی استه؟"
    correct_option: "Blue shirt"
    distractors: ["Green jacket", "Black bag", "White shoes"]
    accepted_answers: [{value: "Blue shirt", status: "correct"}]
    feedback: "یادداشت می‌گه جنس پیراهن آبی استه."
  en.a1.unit65.lesson04.exercise02.note_action:
    instruction: "مطابق یادداشت، چی باید شه؟"
    correct_option: "Exchange"
    distractors: ["Refund", "Repair", "Cancel"]
    accepted_answers: [{value: "Exchange", status: "correct"}]
    feedback: "یادداشت می‌گه جنس باید بدل شه."
  en.a1.unit65.lesson04.exercise03.reading_what_needed:
    instruction: "مطابق متن، دانیال چی را به دکان برد؟"
    correct_option: "the receipt"
    distractors: ["a photo", "a charger", "a note"]
    accepted_answers: [{value: "the receipt", status: "correct"}]
    feedback: "دانیال رسید را به دکان برد."
  en.a1.unit65.lesson04.exercise04.reading_refund:
    instruction: "مطابق متن، آیا دانیال به پس‌گرفتن پول ضرورت داشت؟"
    correct_option: "He did not need a refund"
    distractors: ["He needed a full refund", "He lost the receipt", "He bought two shirts"]
    accepted_answers: [{value: "He did not need a refund", status: "correct"}]
    feedback: "او به پس‌گرفتن پول ضرورت نداشت."
  en.a1.unit65.lesson04.exercise05.write_own_return_message:
    instruction: "یک پیام کوتاه بنویسین: بخواهین چیزی را بدل کنین، و مشکل سایز را توضیح بتین."
    accepted_answers:
      - {value: "I want to exchange this. The size is too small.", status: "correct"}
      - {value: "Can I exchange this? The size is too small.", status: "correct"}
      - {value: "I want to return this. The size is too small.", status: "correct"}
      - {value: "I want to exchange this, the size is too small.", status: "correct"}
      - {value: "I want to exchange this and the size is too small.", status: "correct"}
      - {value: "I want to exchange this because the size is too small.", status: "correct"}
      - {value: "I want to return this, the size is too small.", status: "correct"}
      - {value: "I want to return this and the size is too small.", status: "correct"}
      - {value: "I want to return this because the size is too small.", status: "correct"}
    feedback: "می‌تانین بگین: I want to exchange this. The size is too small."
