review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit39 (neighborhood), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the nearby card: English marks existence with the dummy-subject construction there is/there are (there's a park nearby), while Dari states existence with است/هست alone at the end of the clause and no dummy subject at all (یک پارک نزدیکس). A second contrastive point on the get-along-with-your-neighbors card: English builds this meaning as a phrasal verb (get along with, an idiomatic verb+preposition unit with no literal word-for-word translation), while Dari expresses the same relationship with an adjective+داشتن construction (رابطهٔ خوب داشتن). Dari-specific vocabulary used for authenticity, per the CLAUDE.md-documented dialect list: رستورانت (restaurant, not the Iranian رستوران) in the lesson04 reading passage. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit39.neighborhood: {title: "گپ‌زدن در بارهٔ محل زندگی‌تان"}

lessons:
  en.a1.unit39.lesson01.neighborhood_vocabulary: {title: "محل زندگی‌تان"}
  en.a1.unit39.lesson02.describing_your_area: {title: "توضیف ساحهٔ زندگی‌تان"}
  en.a1.unit39.lesson03.dialogue_asking_about_the_neighborhood: {title: "گپ در بارهٔ سوال‌کردن دربارهٔ محل"}
  en.a1.unit39.lesson04.three_neighborhoods: {title: "متن: سه محل مختلف"}

teaching:
  en.a1.unit39.lesson01.teach.neighborhood: {title: "neighborhood", gloss: "محل", note: "neighborhood یعنی محل -- ساحهٔ اطراف خانه‌تان، شامل کوچه‌ها و ساختمان‌های نزدیک.", example_gloss: "من محلم را خیلی دوست دارم."}
  en.a1.unit39.lesson01.teach.neighbor: {title: "neighbor", gloss: "همسایه", note: "neighbor یعنی همسایه -- کسی که کنار خانهٔ شما یا نزدیک به آن زندگی می‌کنه.", example_gloss: "همسایه‌ام خیلی کمک‌کننده استه."}
  en.a1.unit39.lesson01.teach.nearby: {title: "nearby", gloss: "نزدیک", note: "nearby یعنی نزدیک به یک جای، نی دور. نکتهٔ گرامری: انگلیسی برای گفتن وجود چیزی از ساختار there is/there are کار می‌گیره (there's a park nearby -- یک فاعل مجازی there که معنای واقعی نداره)، درحالیکه دری فقط با است/هست در آخر جمله وجود چیزی را نشان می‌ده، بدون فاعل مجازی (یک پارک نزدیکس).", example_gloss: "یک پارک نزدیکس."}
  en.a1.unit39.lesson01.teach.quiet: {title: "quiet", gloss: "آرام", note: "quiet یعنی آرام، بدون سروصدای زیاد.", example_gloss: "کوچه‌ام شب‌ها خیلی آرام استه."}
  en.a1.unit39.lesson01.teach.noisy: {title: "noisy", gloss: "پرسروصدا", note: "noisy یعنی پر از صداهای بلند.", example_gloss: "کوچهٔ کنار ما پرسروصدا استه."}
  en.a1.unit39.lesson01.teach.friendly: {title: "friendly", gloss: "مهربان", note: "friendly یعنی مهربان و خوش‌رفتار.", example_gloss: "همسایه‌هایم خیلی مهربان استند."}

  en.a1.unit39.lesson02.teach.live_in_a_neighborhood: {title: "live in a neighborhood", gloss: "در یک محل زندگی کردن", note: "live in a neighborhood یعنی در یک محل زندگی کردن.", example_gloss: "من در یک محل آرام زندگی می‌کنم."}
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors: {title: "get along with your neighbors", gloss: "با همسایه‌های‌تان رابطهٔ خوب داشتن", note: "get along with یک فعل مرکب انگلیسیس (فعل+حرف اضافه) با معنای اصطلاحی -- ترجمهٔ کلمه‌به‌کلمه نداره. دری همو معنا را با صفت+داشتن می‌ته: رابطهٔ خوب داشتن.", example_gloss: "من با همسایه‌هایم رابطهٔ خوب دارم."}
  en.a1.unit39.lesson02.teach.close_to: {title: "close to", gloss: "نزدیک به", note: "close to یعنی نزدیک به یک جای.", example_gloss: "اپارتمانم نزدیک به یک دکان بقالی استه."}
  en.a1.unit39.lesson02.teach.a_five_minute_walk: {title: "a five-minute walk", gloss: "پنج دقیقه پیاده", note: "a five-minute walk یعنی فاصله‌ای که پیاده‌رفتنش تقریباً پنج دقیقه وخت می‌گیره.", example_gloss: "پارک از خانه‌ام پنج دقیقه پیاده استه."}
  en.a1.unit39.lesson02.teach.say_hello_to: {title: "say hello to", gloss: "به کسی سلام دادن", note: "say hello to یعنی به کسی سلام دادن.", example_gloss: "من همیشه صبح‌ها به همسایه‌ام سلام می‌دم."}
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question: {title: "What's your neighborhood like?", gloss: "محل‌تان چطور استه؟", note: "این یک اصطلاح استه، نی ترجمهٔ کلمه‌به‌کلمه -- What ... like؟ برای پرسیدن دربارهٔ چگونگی یک جای یا کس کار می‌ره."}

  en.a1.unit39.lesson03.teach.dialogue_line1: {title: "لیلا می‌گه", gloss: "شاید به‌زودی کوچ کنم. میا، محل تو چطور استه؟", note: "might برای گفتن یک احتمال، نی یقین کار می‌ره."}
  en.a1.unit39.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "خیلی خوشم می‌آیه. آرام استه، و یک پارک هم نزدیکس.", note: "there's یک شکل کوتاه‌شدهٔ there is استه."}
  en.a1.unit39.lesson03.teach.dialogue_line3: {title: "لیلا می‌پرسه", gloss: "چه خوب. نزدیک به یک دکان بقالی هم استه؟", note: "close to یعنی نزدیک به."}
  en.a1.unit39.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "بلی، یکی فقط پنج دقیقه پیاده از ساختمانم استه.", note: "a five-minute walk from ... یعنی فاصلهٔ پیاده تا یک جای."}
  en.a1.unit39.lesson03.teach.dialogue_line5: {title: "لیلا می‌پرسه", gloss: "همسایه‌هایت چطورن؟ مهربان استند؟", note: "What about...؟ برای پرسیدن دربارهٔ یک موضوع نو کار می‌ره."}
  en.a1.unit39.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "خیلی مهربان! همسایه‌ام، آقای لوپیز، وقتی نیستم گلدان‌هایم را آب می‌ته.", note: "when I'm away یعنی وقتی نیستم/سفرم."}
  en.a1.unit39.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "چه قشنگ. فکر کنم می‌خواهم نزدیک تو زندگی کنم!", note: "I'd like to یعنی می‌خواهم."}

  en.a1.unit39.lesson04.teach.reading_passage: {title: "متن: سه محل مختلف", gloss: "دنیل، لیلا و میا هرکدام در محل‌های مختلف زندگی می‌کنن. محل دنیل شلوغ استه، با رستورانت‌ها و دکان‌های نزدیک به ساختمان اپارتمانش. او چند تا از همسایه‌هایش را می‌شناسه و اکثراً در راهرو به آن‌ها سلام می‌ده. لیلا در یک محل آرام زندگی می‌کنه، نزدیک به حوض شنایی که او در آن شنا می‌کنه. همسایهٔ آن‌طرف کوچه‌اش یک سگ بزرگ داره که زیاد پارس می‌کنه. محل میا هم آرام استه، با یک دکان بقالی که فقط پنج دقیقه پیاده از ساختمانش استه. همسایه‌اش، آقای لوپیز، خیلی مهربان استه و وقتی نیستش گلدان‌هایش را آب می‌ته. بعد از گپ‌زدن با میا، لیلا تصمیم گرفت که می‌خواهد یک اپارتمان نزدیک او پیدا کنه.", note: "این متن چند عبارت مربوط به محل زندگی را با هم در جمله‌های واقعی نشان می‌ده."}

