    accepted_answers: ["I live in a quiet neighborhood", "I live in a quiet neighborhood.", "My neighborhood is nice", "My neighborhood is nice.", "My neighbor is very friendly", "My neighbor is very friendly.", "There is a park nearby", "There is a park nearby.", "My neighborhood is noisy", "My neighborhood is noisy."]
    feedback: "می‌تانین بگین I live in a... یا My neighbor is..."

