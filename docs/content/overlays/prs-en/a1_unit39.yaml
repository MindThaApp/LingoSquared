      - {left: "neighbor", right: "کسی که نزدیک خانهٔ تان زندگی می‌کنه"}
      - {left: "nearby", right: "نزدیک یک جا و نه دور از آن"}
      - {left: "quiet", right: "جایی که سروصدا نداره"}
      - {left: "noisy", right: "جایی که صداهای بلند زیاد داره"}
      - {left: "friendly", right: "خوش‌رفتار با همسایه‌ها"}
    accepted_answers:
      - value:
          - {left: "neighborhood", right: "خانهٔ تان و سرک‌های نزدیک آن"}
          - {left: "neighbor", right: "کسی که نزدیک خانهٔ تان زندگی می‌کنه"}
          - {left: "nearby", right: "نزدیک یک جا و نه دور از آن"}
          - {left: "quiet", right: "جایی که سروصدا نداره"}
          - {left: "noisy", right: "جایی که صداهای بلند زیاد داره"}
          - {left: "friendly", right: "خوش‌رفتار با همسایه‌ها"}
        status: "correct"
    feedback: "neighborhood=محل، neighbor=همسایه، nearby=نزدیک، quiet=آرام، noisy=پرسروصدا، friendly=مهربان."
  en.a1.unit39.lesson01.exercise04.order_quiet_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "street", "is", "very", "quiet", "at", "night."], status: "correct"}]
    feedback: "ترتیب درست: My street is very quiet at night."
  en.a1.unit39.lesson01.exercise05.write_neighbor_word:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که کنار خانهٔ شما یا نزدیک به آن زندگی می‌کنه."
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "neighbor یعنی همسایه."

