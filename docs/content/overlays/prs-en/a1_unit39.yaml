  en.a1.unit39.lesson04.exercise04.write_own_neighborhood_sentence:
    instruction: "یک جمله در بارهٔ محل خودتان یا یک همسایه بنویسین، با «I live in a ... neighborhood»، «My neighbor is ...»، یا «There is a ... nearby»."
