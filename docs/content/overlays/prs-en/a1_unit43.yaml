review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit43 (colors), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the goes-well-with card: English builds this meaning as a three-part phrasal verb (goes + well + with), an idiomatic combination that can't be translated word-for-word, while Dari expresses the same match/complement relationship with a single simple verb plus preposition (به ... می‌خوره, literally \"fits to\") -- Dari has no equivalent multi-word phrasal-verb category at all. Dari-specific vocabulary used for authenticity: سرخ for red (not the Iranian قرمز), موتر for car (not the Iranian ماشین), and تنبان for pants/trousers (not the Iranian شلوار). Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit43.colors: {title: "توضیف رنگ‌ها"}

lessons:
  en.a1.unit43.lesson01.colors_vocabulary: {title: "کلمات رنگ‌ها"}
  en.a1.unit43.lesson02.talking_about_colors: {title: "گپ‌زدن دربارهٔ رنگ‌ها"}
  en.a1.unit43.lesson03.dialogue_choosing_a_shirt_color: {title: "گپ: انتخاب رنگ پیراهن"}
  en.a1.unit43.lesson04.three_friends_three_favorite_colors: {title: "متن: سه رفیق، سه رنگ موردعلاقه"}

teaching:
  en.a1.unit43.lesson01.teach.red: {title: "red", gloss: "سرخ", note: "red یعنی سرخ -- کلمهٔ رایج دری، نی قرمز که بیشتر در فارسی ایرانی می‌شنوین.", example_gloss: "موترم سرخ استه."}
  en.a1.unit43.lesson01.teach.blue: {title: "blue", gloss: "آبی", note: "blue یعنی آبی.", example_gloss: "آسمان آبی استه."}
  en.a1.unit43.lesson01.teach.green: {title: "green", gloss: "سبز", note: "green یعنی سبز.", example_gloss: "چمن سبز استه."}
  en.a1.unit43.lesson01.teach.yellow: {title: "yellow", gloss: "زرد", note: "yellow یعنی زرد.", example_gloss: "آفتاب زرد استه."}
  en.a1.unit43.lesson01.teach.black: {title: "black", gloss: "سیاه", note: "black یعنی سیاه.", example_gloss: "بوت‌هایش سیاه استند."}
  en.a1.unit43.lesson01.teach.white: {title: "white", gloss: "سفید", note: "white یعنی سفید.", example_gloss: "پیراهنش سفید استه."}

  en.a1.unit43.lesson02.teach.dark_blue: {title: "dark blue", gloss: "آبی تیره", note: "dark blue یعنی آبی تیره.", example_gloss: "او یک پیراهن آبی تیره پوشیده."}
  en.a1.unit43.lesson02.teach.light_green: {title: "light green", gloss: "سبز روشن", note: "light green یعنی سبز روشن.", example_gloss: "او اتاق خوابش را سبز روشن رنگ کرد."}
  en.a1.unit43.lesson02.teach.goes_well_with: {title: "goes well with", gloss: "به ... خوب می‌خوره", note: "goes well with یک فعل مرکب سه‌بخشیِ انگلیسیس (goes + well + with) که کلمه‌به‌کلمه ترجمه نمی‌شه. دری همو معنا (دو رنگ یا لباس که باهم خوب به نظر می‌رسن) را با یک فعل ساده و حرف اضافه می‌ته: به ... می‌خوره -- دری چنین دستهٔ فعل مرکب چندبخشی نداره.", example_gloss: "این پیراهن آبی به تنبان سیاه خوب می‌خوره."}
  en.a1.unit43.lesson02.teach.too_bright: {title: "too bright", gloss: "زیاد روشن", note: "too bright یعنی زیاد روشن -- برای یک وضعیت خاص مناسب نیست.", example_gloss: "زرد یک رنگ سرگرم‌کننده استه، خو برای کار زیاد روشن استه."}
  en.a1.unit43.lesson02.teach.whats_your_favorite_color: {title: "What's your favorite color?", gloss: "رنگ موردعلاقه‌ات چیست؟", note: "این سوال با What's (What is) شروع می‌شه."}
  en.a1.unit43.lesson02.teach.my_favorite_color_is: {title: "My favorite color is blue.", gloss: "رنگ موردعلاقه‌ام آبی استه.", note: "الگوی My favorite color is + رنگ برای جواب‌دادن کار می‌ره."}

  en.a1.unit43.lesson03.teach.dialogue_line1: {title: "دنیل می‌گه", gloss: "برای پریزنتیشن هفتهٔ آینده‌مان یک پیراهن نو ضرورت دارم. می‌تانی در انتخاب رنگ کمکم کنی؟", note: "شروع گپ با یک خواهش کمک."}
  en.a1.unit43.lesson03.teach.dialogue_line2: {title: "میا می‌گه", gloss: "البته! کدام رنگ‌ها را دوست داری؟", note: "Sure یعنی البته/حتماً."}
  en.a1.unit43.lesson03.teach.dialogue_line3: {title: "جواب دنیل", gloss: "آبی و سبز را دوست دارم، خو مطمئن نیستم کدام‌یک رسمی به نظر می‌رسه.", note: "not sure یعنی مطمئن نیستم."}
  en.a1.unit43.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "آبی تیره یک انتخاب عالیس. رسمی به نظر می‌رسه، و به تنبان سیاه هم خوب می‌خوره.", note: "goes well with -- همو فعل مرکبی که بالا یاد گرفتین."}
  en.a1.unit43.lesson03.teach.dialogue_line5: {title: "دنیل می‌پرسه", gloss: "این زرده چطوره؟", note: "What about...؟ برای پیشنهاددادن یک گزینهٔ دیگه."}
  en.a1.unit43.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "زرد رنگ سرگرم‌کننده‌ییس، خو برای پریزنتیشن زیاد روشن استه. من پیراهن آبی تیره را انتخاب می‌کردم.", note: "I'd choose یعنی من انتخاب می‌کردم -- نظر مؤدبانه."}
  en.a1.unit43.lesson03.teach.dialogue_line7: {title: "جواب دنیل", gloss: "تشکر میا. آبی تیره شد!", note: "Dark blue it is یک طریقهٔ رایج برای تایید نهایی یک انتخاب."}

  en.a1.unit43.lesson04.teach.reading_passage: {title: "متن: سه رفیق، سه رنگ موردعلاقه", gloss: "دنیل، لیلا و میا هرکدام رنگ موردعلاقهٔ متفاوتی دارند. رنگ موردعلاقهٔ دنیل آبی استه. او می‌گه رنگ آرامیس، و تقریباً به هرچیزی که به کار می‌پوشه خوب می‌خوره. رنگ موردعلاقهٔ لیلا سبز استه، رنگ نباتات و باغ‌هایی که او عاشق نقاشی‌کردنشان استه. او فکر می‌کنه سبز روشن خیلی قشنگ استه. رنگ موردعلاقهٔ میا زرد استه، چون آفتاب را به یادش می‌آره و همیشه احساس خوشحالی بهش می‌ته. با آنکه هرسه‌شان رنگ‌های مختلف دوست دارند، همه قبول دارند که رنگ‌ها گپ‌زدن‌های روزمره را سرگرم‌کننده‌تر می‌سازن.", note: "این متن چند رنگ و عبارت مربوط به رنگ را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit43.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و رنگی که گفته شد را انتخاب کنین."
    correct_option: "black"
    distractors: ["red", "blue", "green"]
    accepted_answers: [{value: "black", status: "correct"}]
    feedback: "black یعنی سیاه."
  en.a1.unit43.lesson01.exercise02.choose_yellow_meaning:
    instruction: "کدام رنگ رنگ آفتاب استه؟"
    correct_option: "yellow"
    distractors: ["red", "blue", "black"]
    accepted_answers: [{value: "yellow", status: "correct"}]
    feedback: "yellow یعنی زرد."
  en.a1.unit43.lesson01.exercise03.match_color_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "red", right: "رنگ توت‌زمینی"}
      - {left: "blue", right: "رنگ آسمان"}
      - {left: "green", right: "رنگ سبزه"}
      - {left: "yellow", right: "رنگ آفتاب"}
      - {left: "black", right: "رنگ زغال"}
      - {left: "white", right: "رنگ برف"}
    accepted_answers:
      - value:
          - {left: "red", right: "رنگ توت‌زمینی"}
          - {left: "blue", right: "رنگ آسمان"}
          - {left: "green", right: "رنگ سبزه"}
          - {left: "yellow", right: "رنگ آفتاب"}
          - {left: "black", right: "رنگ زغال"}
          - {left: "white", right: "رنگ برف"}
        status: "correct"
    feedback: "red=سرخ، blue=آبی، green=سبز، yellow=زرد، black=سیاه، white=سفید."
  en.a1.unit43.lesson01.exercise04.order_white_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Her", "shirt", "is", "white."], status: "correct"}]
    feedback: "ترتیب درست: Her shirt is white."
  en.a1.unit43.lesson01.exercise05.write_green_word:
    instruction: "رنگ چمن را بنویسین."
    accepted_answers: [{value: "green", status: "correct"}]
    feedback: "green یعنی سبز."

  en.a1.unit43.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "dark blue"
    distractors: ["light green", "goes well with", "too bright"]
    accepted_answers: [{value: "dark blue", status: "correct"}]
    feedback: "dark blue یعنی آبی تیره."
  en.a1.unit43.lesson02.exercise02.choose_dark_blue_meaning:
    instruction: "کدام عبارت یک رنگ آبی تیره‌تر را توضیف می‌کنه؟"
    correct_option: "dark blue"
    distractors: ["light green", "goes well with", "too bright"]
    accepted_answers: [{value: "dark blue", status: "correct"}]
    feedback: "dark blue یعنی آبی تیره."
  en.a1.unit43.lesson02.exercise03.choose_goes_well_with_meaning:
    instruction: "کدام عبارت یعنی دو رنگ یا لباس باهم خوب به نظر می‌رسن؟"
    correct_option: "goes well with"
    distractors: ["dark blue", "light green", "too bright"]
    accepted_answers: [{value: "goes well with", status: "correct"}]
    feedback: "goes well with یعنی به ... خوب می‌خوره."
  en.a1.unit43.lesson02.exercise04.order_pants_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "blue", "shirt", "goes", "well", "with", "black", "pants."], status: "correct"}]
    feedback: "ترتیب درست: This blue shirt goes well with black pants."
  en.a1.unit43.lesson02.exercise05.translate_favorite_color_question:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «رنگ موردعلاقه‌ات چیست؟»"
    accepted_answers:
      - {value: "What's your favorite color?", status: "correct"}
      - {value: "What's your favorite color", status: "correct"}
    feedback: "What's your favorite color?"

  en.a1.unit43.lesson03.exercise01.comprehension_daniel_colors_he_likes:
    instruction: "مطابق گپ، دنیل می‌گه کدام دو رنگ را دوست داره؟"
    correct_option: "blue and green"
    distractors: ["red and yellow", "black and white", "blue and yellow"]
    accepted_answers: [{value: "blue and green", status: "correct"}]
    feedback: "دنیل می‌گه I like blue and green."
  en.a1.unit43.lesson03.exercise02.comprehension_mia_recommendation:
    instruction: "مطابق گپ، میا کدام رنگ را برای پریزنتیشن پیشنهاد می‌کنه؟"
    correct_option: "dark blue"
    distractors: ["light green", "bright yellow", "black"]
    accepted_answers: [{value: "dark blue", status: "correct"}]
    feedback: "میا می‌گه Dark blue is a great choice."
  en.a1.unit43.lesson03.exercise03.listen_dialogue_yellow_reason:
    instruction: "مطابق گپ، میا چرا زرد را برای پریزنتیشن دوست نداره؟"
    correct_option: "too bright"
    distractors: ["not warm enough", "too plain", "hard to find in stores"]
    accepted_answers: [{value: "too bright", status: "correct"}]
    feedback: "میا می‌گه it's too bright for a presentation."
  en.a1.unit43.lesson03.exercise04.respond_own_favorite_color:
    instruction: "رنگ موردعلاقهٔ خودتان را بگین، یا بپرسین رنگ موردعلاقهٔ کسی چیست."
    accepted_answers: ["My favorite color is blue", "My favorite color is blue.", "My favorite color is red", "My favorite color is red.", "My favorite color is green", "My favorite color is green.", "My favorite color is yellow", "My favorite color is yellow.", "My favorite color is black", "My favorite color is black.", "My favorite color is white", "My favorite color is white.", "What's your favorite color?"]
    feedback: "می‌تانین بگین My favorite color is... یا بپرسین What's your favorite color؟"

  en.a1.unit43.lesson04.exercise01.reading_daniel_favorite_color:
    instruction: "مطابق متن، رنگ موردعلاقهٔ دنیل چیست؟"
    correct_option: "blue"
    distractors: ["green", "yellow", "red"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "متن می‌گه Daniel's favorite color is blue."
  en.a1.unit43.lesson04.exercise02.reading_mia_yellow_reason:
    instruction: "مطابق متن، میا چرا زرد را دوست داره؟"
    correct_option: "it reminds her of the sun"
    distractors: ["it's her work uniform color", "her cat is yellow", "it was her mother's favorite"]
    accepted_answers: [{value: "it reminds her of the sun", status: "correct"}]
    feedback: "متن می‌گه it reminds her of the sun."
  en.a1.unit43.lesson04.exercise03.reading_leila_shade:
    instruction: "مطابق متن، لیلا کدام سایهٔ سبز را خیلی دوست داره؟"
    correct_option: "light green"
    distractors: ["dark green", "bright green", "olive green"]
    accepted_answers: [{value: "light green", status: "correct"}]
    feedback: "متن می‌گه she thinks light green is especially beautiful."
  en.a1.unit43.lesson04.exercise04.write_own_favorite_color_sentence:
    instruction: "یک جمله در بارهٔ رنگ موردعلاقهٔ خودتان بنویسین، با «My favorite color is...»."
    accepted_answers: ["My favorite color is blue", "My favorite color is blue.", "My favorite color is red", "My favorite color is red.", "My favorite color is green", "My favorite color is green.", "My favorite color is yellow", "My favorite color is yellow.", "My favorite color is black", "My favorite color is black.", "My favorite color is white", "My favorite color is white."]
    feedback: "می‌تانین از الگوی My favorite color is... کار بگیرین."
