generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific lost-and-found phrase source material (DLI Dari Basic Course) -- no dedicated lost-item/lost-and-found lesson surfaced in the sections checked; the DLI course's everyday-transaction lessons cover shopping/travel registers already used by earlier units, not this specific scenario. No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit46 (lost items), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all five lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit46.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit46.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: keys -> چابی (the standard Dari/Afghan borrowing, as opposed to Iranian Persian's کلید); backpack -> بکس (the common informal Dari term for a bag/pack, as opposed to Iranian Persian's کوله‌پشتی); lost-and-found office -> دفتر اشیای گمشده (a transparent descriptive phrase understandable in either dialect, used as-is since no distinct Dari-specific idiom was found for this exact office name). Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌خواد for می‌شود/می‌خواهد, نزدم/نزدت for پیش من/پیش تو 'with/at me,' بیا for the informal let's-imperative). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's present-perfect 'Have you seen my keys?' (marking an event as recent and relevant-to-now) has no dedicated one-to-one Dari verb form -- Dari expresses the same idea with plain simple past (دیدین), so a Dari speaker must learn 'Have you seen...?' as a fixed English chunk rather than expect a literal grammatical match; (2) English's indefinite-subject question 'Has anyone found a backpack?' stacks do/has-support onto an indefinite pronoun (anyone), a two-layer construction Dari doesn't build the same way -- Dari's کسی (someone/anyone) attaches directly to an ordinary verb with no auxiliary system to learn alongside it. Same-speaker-distractor check performed per the standing CLAUDE.md footgun: lesson03.exercise03's listen_select tests the strap color (correct_option 'yellow', from Daniel's own line 6) against invented, never-said-by-Daniel-elsewhere distractors ('red', 'blue', 'green') -- deliberately avoided 'black' as a distractor since Daniel says it in that same line describing the backpack itself, matching the realization's own stated reasoning for the same avoidance. Multi-clause accepted_answers (lesson04's write_own_lost_item_message) mirrors the realization's own six variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit46.lost_items: {title: "گزارش دادن یک چیز گمشده"}

lessons:
  en.a1.unit46.lesson01.lost_items_vocabulary: {title: "کلمات چیزهای گمشده"}
  en.a1.unit46.lesson02.reporting_a_lost_item: {title: "گزارش دادن یک چیز گمشده"}
  en.a1.unit46.lesson03.dialogue_missing_backpack: {title: "گفتگو: بکس گمشده"}
  en.a1.unit46.lesson04.lost_and_found_notice: {title: "متن: دفتر اشیای گمشده"}

teaching:
  en.a1.unit46.lesson01.teach.lost: {title: "lost", gloss: "گم شده", note: "lost یعنی گم شده -- چیزی که دیگه نزدت نیستش و نمی‌دانی کجا استه.", example_gloss: "کیف پولم گم شد."}
  en.a1.unit46.lesson01.teach.found: {title: "found", gloss: "پیدا شده", note: "found یعنی پیدا شده -- کسی یک چیز گمشده را کشف کرده.", example_gloss: "چابی‌هایت را پیدا کردم!"}
  en.a1.unit46.lesson01.teach.keys: {title: "keys", gloss: "چابی‌ها", note: "keys یعنی چابی‌ها -- در دری کلمهٔ «چابی» کار می‌ره، نی «کلید» که در فارسی ایران رایج استه.", example_gloss: "این‌ها چابی‌های منه."}
  en.a1.unit46.lesson01.teach.wallet: {title: "wallet", gloss: "کیف پول", note: "wallet یعنی کیف پول -- یک کیف کوچک برای پول و کارت‌ها.", example_gloss: "این کیف پول توئه؟"}
  en.a1.unit46.lesson01.teach.backpack: {title: "backpack", gloss: "بکس", note: "backpack یعنی بکس -- یک بکسی که پشت شانه‌ات حمل می‌کنی. در دری «بکس» رایج استه، نی «کوله‌پشتی» که در فارسی ایران رایج استه.", example_gloss: "بکسم سیاه استه."}

  en.a1.unit46.lesson02.teach.i_lost_my_wallet: {title: "I lost my wallet.", gloss: "کیف پولم گم شد.", note: "lost شکل ماضی فعل lose (گم کردن) استه."}
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys: {title: "Have you seen my keys?", gloss: "چابی‌های میم را دیدین؟", note: "Have you seen ...? یک ساختار حال کامل (present perfect) استه -- برای پرسیدن در بارهٔ یک واقعهٔ اخیر کار می‌ره. دری همو معنا را با گذشتهٔ سادهٔ «دیدین» می‌رساند، بدون یک شکل فعلی جداگانه."}
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack: {title: "Has anyone found a backpack?", gloss: "کسی یک بکس پیدا کرده؟", note: "anyone یعنی کسی -- این سوال هم با has (حال کامل) می‌آیه."}
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap: {title: "It's black with a red strap.", gloss: "سیاه استه با یک بند سرخ.", note: "with a ___ strap یعنی «با یک بند ___» -- برای توضیح دادن یک جزئیات کار می‌ره."}
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found: {title: "Where's the lost and found?", gloss: "دفتر اشیای گمشده کجا استه؟", note: "the lost and found یعنی دفتر اشیای گمشده -- جایی که چیزهای پیدا شده نگه‌داری می‌شه."}
  en.a1.unit46.lesson02.teach.yes_we_found_it: {title: "Yes, we found it!", gloss: "بلی، ما پیدایش کردیم!", note: "found it یعنی پیدایش کردیم -- it به همو چیز گمشده اشاره می‌کنه."}

  en.a1.unit46.lesson03.teach.dialogue_line1: {title: "سوال دانیال", gloss: "میا، بکس‌ات کجا استه؟ نزدیک فواره داشتیش.", note: "Where's ...? یعنی کجا استه -- had it یعنی داشتیش، شکل ماضی فعل have."}
  en.a1.unit46.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "وای نی، راست می‌گی! نزدم نیستش. کمره‌ام داخلش استه!", note: "don't have it یعنی نزدم نیستش -- inside یعنی داخل."}
  en.a1.unit46.lesson03.teach.dialogue_line3: {title: "گپ دانیال", gloss: "غم نخور، بیا به دفتر پارک زنگ بزنیم و بپرسیم.", note: "let's ... یک طریقهٔ پیشنهاد دادن یک کار مشترک استه."}
  en.a1.unit46.lesson03.teach.dialogue_line4: {title: "زنگ دانیال به دفتر پارک", gloss: "الو، ما یک بکس سیاه نزدیک فواره گم کردیم. کسی پیدایش کرده؟", note: "we lost یعنی ما گم کردیم -- گذشتهٔ سادهٔ فعل lose."}
  en.a1.unit46.lesson03.teach.dialogue_line5: {title: "سوال میا", gloss: "چه گفتن؟", note: "did they say یک سوال گذشتهٔ سادهٔ استه با فعل کمکی did."}
  en.a1.unit46.lesson03.teach.dialogue_line6: {title: "خبر دانیال", gloss: "پیدایش کردن! سیاه استه با یک بند زرد، نی؟ نزد میز پذیرش نگه داشتنش.", note: "right? در آخر جمله برای تایید گرفتن از شنونده کار می‌ره."}
  en.a1.unit46.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "بلی، همینه! بیا هم اکنون بریم بگیریمش. خدا را شکر.", note: "Let's go get it یعنی بیا بریم بگیریمش -- یک عبارت محاوره‌ای برای پیشنهاد فوری."}

  en.a1.unit46.lesson04.teach.reading_passage: {title: "متن: دفتر اشیای گمشده", gloss: "دفتر اشیای گمشده: اگه یک چیزی را توی پارک گم کنین، اول فکر کنین که آخرین بار کجا داشتینش. بعد به دفتر پارک نزدیک دروازهٔ اصلی برین و آن چیز را توضیح بتین -- رنگش و جزئیات خاصش را بگین. نام و شمارهٔ تلفن تان را بتین تا کارمندان بتانن اگه پیدایش کردن زنگ بزنن. بعد از اینکه میا بکسش را نزدیک فواره گم کرد، او و دانیال فوراً به دفتر پارک زنگ زدن. کارمندان از قبل پیدایش کرده بودن و نزد میز پذیرش نگه داشته بودنش. میا خیلی خوش شد که کمره‌اش را مصئون پس گرفت. بعداً، او تمام قصه را به لیلا گفت، و لیلا گفت که دفعهٔ بعد کمکش می‌کنه که بهتر مواظب چیزهایش باشه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- lost, called, had, found, were, was, told, said."}

exercises:
  en.a1.unit46.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "keys"
    distractors: ["lost", "found", "wallet", "backpack"]
    accepted_answers: [{value: "keys", status: "correct"}]
    feedback: "keys یعنی چابی‌ها."
  en.a1.unit46.lesson01.exercise02.choose_wallet_meaning:
    instruction: "کدام کلمه یعنی کیف کوچکی که پول و کارت‌هایت را نگه می‌داری؟"
    correct_option: "wallet"
    distractors: ["keys", "backpack", "found"]
    accepted_answers: [{value: "wallet", status: "correct"}]
    feedback: "wallet یعنی کیف پول."
  en.a1.unit46.lesson01.exercise03.match_lost_items_words:
    instruction: "هر توضیح را به کلمه‌اش وصل کنین."
    accepted_answers: [{"value": [{"left": "not with you anymore; you don't know where it is", "right": "lost"}, {"left": "someone discovered it after it was missing", "right": "found"}, {"left": "what you use to open a door or start a car", "right": "keys"}, {"left": "a small case for money and cards", "right": "wallet"}, {"left": "a bag you carry on your back", "right": "backpack"}], "status": "correct"}]
    feedback: "lost=گم شده، found=پیدا شده، keys=چابی‌ها، wallet=کیف پول، backpack=بکس."
  en.a1.unit46.lesson01.exercise04.order_lost_wallet_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "lost", "my", "wallet."], status: "correct"}]
    feedback: "ترتیب درست: I lost my wallet."
  en.a1.unit46.lesson01.exercise05.write_keys_word:
    instruction: "کلمه‌ای را بنویسین که برای باز کردن دروازه یا روشن کردن موتر کار می‌ری."
    accepted_answers: [{value: "keys", status: "correct"}]
    feedback: "keys یعنی چابی‌ها."

  en.a1.unit46.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Where's the lost and found?"
    distractors: ["I lost my wallet.", "Yes, we found it!", "Has anyone found a backpack?"]
    accepted_answers: [{value: "Where's the lost and found?", status: "correct"}]
    feedback: "Where's the lost and found? یعنی دفتر اشیای گمشده کجا استه؟"
  en.a1.unit46.lesson02.exercise02.choose_has_anyone_found_meaning:
    instruction: "کدام عبارت می‌پرسه که کسی دیگه بکس تان را پیدا کرده یا نی؟"
    correct_option: "Has anyone found a backpack?"
    distractors: ["I lost my wallet.", "Where's the lost and found?", "It's black with a red strap."]
    accepted_answers: [{value: "Has anyone found a backpack?", status: "correct"}]
    feedback: "Has anyone found a backpack? یعنی کسی یک بکس پیدا کرده؟"
  en.a1.unit46.lesson02.exercise03.choose_its_black_meaning:
    instruction: "کدام عبارت شکل یک چیز گمشده را توضیح می‌ته؟"
    correct_option: "It's black with a red strap."
    distractors: ["Have you seen my keys?", "Yes, we found it!", "Where's the lost and found?"]
    accepted_answers: [{value: "It's black with a red strap.", status: "correct"}]
    feedback: "It's black with a red strap. یعنی سیاه استه با یک بند سرخ."
  en.a1.unit46.lesson02.exercise04.order_have_you_seen_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Have", "you", "seen", "my", "keys?"], status: "correct"}]
    feedback: "ترتیب درست: Have you seen my keys?"
  en.a1.unit46.lesson02.exercise05.translate_i_lost_my_wallet:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «کیف پولم گم شد.»"
    accepted_answers:
      - {value: "I lost my wallet.", status: "correct"}
      - {value: "I lost my wallet", status: "correct"}
    feedback: "I lost my wallet. یعنی کیف پولم گم شد."

  en.a1.unit46.lesson03.exercise01.comprehension_whats_inside:
    instruction: "مطابق گفتگو، داخل بکس میا چه چیزی استه؟"
    correct_option: "camera"
    distractors: ["wallet", "keys", "phone"]
    accepted_answers: [{value: "camera", status: "correct"}]
    feedback: "کمرهٔ میا داخل بکسش استه (camera)."
  en.a1.unit46.lesson03.exercise02.comprehension_where_they_were:
    instruction: "مطابق گفتگو، دانیال و میا وخت گم شدن بکس کجا بودن؟"
    correct_option: "near the fountain"
    distractors: ["at the park office", "at the front desk", "at home"]
    accepted_answers: [{value: "near the fountain", status: "correct"}]
    feedback: "آن‌ها نزدیک فواره بودن (near the fountain)."
  en.a1.unit46.lesson03.exercise03.listen_dialogue_strap_color:
    instruction: "مطابق گفتگو، بند بکس میا چه رنگ استه؟"
    correct_option: "yellow"
    distractors: ["red", "blue", "green"]
    accepted_answers: [{value: "yellow", status: "correct"}]
    feedback: "بند بکس زرد استه (yellow)."
  en.a1.unit46.lesson03.exercise04.respond_own_lost_item_report:
    instruction: "بگین که یک چیزی را گم کردین، یا بپرسین که کسی پیدایش کرده یا نی."
    accepted_answers: ["I lost my wallet", "I lost my wallet.", "I lost my keys", "I lost my keys.", "I lost my backpack", "I lost my backpack.", "Have you seen my keys?", "Has anyone found a backpack?", "Where's the lost and found?"]
    feedback: "می‌تانین بگین I lost my wallet یا بپرسین Have you seen my keys?"

  en.a1.unit46.lesson04.exercise01.reading_first_step:
    instruction: "مطابق اعلانیه، اگه یک چیزی را توی پارک گم کنین اول باید چه کار کنین؟"
    correct_option: "think about where you last had it"
    distractors: ["call 911", "go home", "buy a new one"]
    accepted_answers: [{value: "think about where you last had it", status: "correct"}]
    feedback: "اعلانیه می‌گه اول فکر کنین که آخرین بار کجا داشتینش."
  en.a1.unit46.lesson04.exercise02.reading_what_to_describe:
    instruction: "مطابق اعلانیه، در بارهٔ چیز گمشده چه چیزی را باید توضیح بتین؟"
    correct_option: "its color and special details"
    distractors: ["its price", "its brand", "who made it"]
    accepted_answers: [{value: "its color and special details", status: "correct"}]
    feedback: "اعلانیه می‌گه باید رنگ و جزئیات خاصش را بگین."
  en.a1.unit46.lesson04.exercise03.reading_who_mia_told:
    instruction: "مطابق متن، میا بعداً تمام قصه را به کی گفت؟"
    correct_option: "Leila"
    distractors: ["Daniel's sister", "the park staff", "her neighbor"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "میا تمام قصه را به لیلا (Leila) گفت."
  en.a1.unit46.lesson04.exercise04.write_own_lost_item_message:
    instruction: "یک پیام کوتاه بنویسین: بگین که یک چیزی را گم کردین و بپرسین که کسی پیدایش کرده یا نی."
    accepted_answers:
      - {value: "I lost my keys. Have you seen them?", status: "correct"}
      - {value: "I lost my keys. Have you seen them.", status: "correct"}
      - {value: "I lost my wallet. Has anyone found it?", status: "correct"}
      - {value: "I lost my wallet. Has anyone found it.", status: "correct"}
      - {value: "I lost my backpack. Have you seen it?", status: "correct"}
      - {value: "I lost my backpack. Have you seen it.", status: "correct"}
      - {value: "I lost my keys, have you seen them?", status: "correct"}
      - {value: "I lost my keys, and have you seen them?", status: "correct"}
      - {value: "I lost my wallet, has anyone found it?", status: "correct"}
      - {value: "I lost my wallet, and has anyone found it?", status: "correct"}
      - {value: "I lost my backpack, have you seen it?", status: "correct"}
      - {value: "I lost my backpack, and have you seen it?", status: "correct"}
    feedback: "می‌تانین بگین: I lost my wallet. Has anyone found it?"
