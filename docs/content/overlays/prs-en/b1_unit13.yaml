course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit13.relative_clauses: {title: "همکاری که نزدیک میا نشسته"}

lessons:
  en.b1.unit13.lesson01.relative_clause_vocabulary: {title: "Who، which، that، whose، و where"}
  en.b1.unit13.lesson02.defining_and_nondefining: {title: "جملهٔ وصفیِ تعریفی و غیرتعریفی"}
  en.b1.unit13.lesson03.reading_the_new_office: {title: "متن خوانی: دفتر نو"}
  en.b1.unit13.lesson04.the_new_coworker_dialogue: {title: "زنی که تازه شامل تیم شد"}

teaching:
  en.b1.unit13.lesson01.teach.who: {title: "who", gloss: "که (برای اشخاص)", note: "*who* به یک شخص در داخل جملهٔ وصفی اشاره می‌کنه.", example_gloss: "دنیل، که در مارچ شامل تیم شد، از همین حالا دو پروژه را رهبری می‌کنه."}
  en.b1.unit13.lesson01.teach.which: {title: "which", gloss: "که (برای چیزها)", note: "*which* به یک چیز در داخل جملهٔ وصفی اشاره می‌کنه.", example_gloss: "کورس دیزاین که لیلا انتخاب کد، در جون شروع می‌شه."}
  en.b1.unit13.lesson01.teach.that_relative: {title: "that", gloss: "که (برای شخص یا چیز، در جملهٔ وصفیِ تعریفی)", note: "*that* به یک شخص یا چیز در یک جملهٔ وصفیِ تعریفی اشاره می‌کنه.", example_gloss: "مشتری‌یی که صبح زنگ زد، یک ملاقات می‌خواد."}
  en.b1.unit13.lesson01.teach.whose: {title: "whose", gloss: "که مالِ او (نشان‌دهندهٔ مالکیت)", note: "*whose* مالکیت را در داخل جملهٔ وصفی نشان می‌ته.", example_gloss: "مشتری‌یی که پروژه‌اش را تمام می‌کنن، قبلاً دیزاین را تأیید کده."}
  en.b1.unit13.lesson01.teach.where: {title: "where", gloss: "که در آنجا، جایی که", note: "*where* به یک جای در داخل جملهٔ وصفی اشاره می‌کنه.", example_gloss: "دفتری که دنیل در آن کار می‌کنه، در مرکز شهر استه."}
  en.b1.unit13.lesson01.teach.coworker: {title: "coworker", gloss: "همکار", note: "*coworker* یعنی کسی که با شما کار می‌کنه.", example_gloss: "میا یک همکار داره که شام‌ها هسپانوی می‌خوانه."}

  en.b1.unit13.lesson02.teach.colleague_organized: {title: "The colleague who sits next to Mia is very organized.", gloss: "همکاری که نزدیک میا نشسته، خیلی منظم استه.", note: "همینه یک جملهٔ وصفیِ تعریفی بدون کاما."}
  en.b1.unit13.lesson02.teach.daniel_leads_projects: {title: "Daniel, who joined the team in March, already leads two projects.", gloss: "دنیل، که در مارچ شامل تیم شد، از همین حالا دو پروژه را رهبری می‌کنه.", note: "همینه یک جملهٔ وصفیِ غیرتعریفی با کاما."}
  en.b1.unit13.lesson02.teach.grammar_defining: {title: "قاعدهٔ جملهٔ وصفی", gloss: "یک جملهٔ وصفیِ تعریفی را بدون کاما استفاده کنین تا دقیقاً معلوم کنین کدام شخص یا چیز منظور شما استه: The colleague who sits next to Mia is organized. یک جملهٔ وصفیِ غیرتعریفی را با کاما استفاده کنین تا معلومات اضافی دربارهٔ کسی که قبلاً معرفی شده بتین: Daniel, who joined in March, already leads two projects.", note: "کاما فرق بین همو دو نوع جمله را نشان می‌ته."}

  en.b1.unit13.lesson03.teach.deadline: {title: "deadline", gloss: "ضرب‌الاجل، آخرین میعاد", note: "*deadline* یعنی تاریخ یا وقتی که یک کار باید تمام شه.", example_gloss: "همکاری که نزدیک میا نشسته، همیشه ضرب‌الاجل‌هایش را رعایت می‌کنه."}
  en.b1.unit13.lesson03.teach.approve: {title: "approve", gloss: "تأیید کدن", note: "*approve* یعنی موافقه رسمی دادن به یک چیز.", example_gloss: "مشتری اولین دیزاین را حالی تأیید کده."}
  en.b1.unit13.lesson03.teach.reading_passage: {title: "متن دربارهٔ دفتر نو", gloss: "میا با چند نفر کار می‌کنه که کارش را آسان‌تر می‌سازن. دنیل، که در مارچ شامل تیم شد، از همین حالا دو پروژه را رهبری می‌کنه. همکاری که نزدیک میا نشسته، خیلی منظم استه و همیشه ضرب‌الاجل‌ها را رعایت می‌کنه. دفترشان، که در طبقهٔ پنجم استه، یک آشپزخانهٔ کوچک داره که همه در آن باهم غذای چاشت می‌خورن. مشتری‌یی که پروژه‌اش را تمام می‌کنن، قبلاً اولین دیزاین را تأیید کده.", note: "همی متن who، whose، which، و where را باهم استفاده می‌کنه."}

  en.b1.unit13.lesson04.teach.q_met_the_woman: {title: "سوال میا", gloss: "میا می‌گه: لیلا، آیا آن زنی را که تازه شامل تیم ما شد، دیدی؟", note: "*who* اینجه به همو زن اشاره می‌کنه."}
  en.b1.unit13.lesson04.teach.a_whose_desk: {title: "جواب لیلا", gloss: "لیلا می‌گه: نی هنوز. آیا او همو کسی استه که میزش نزدیک کلکین استه؟", note: "*whose* مالکیت میز را نشان می‌ته."}
  en.b1.unit13.lesson04.teach.q_the_designer_who: {title: "جواب میا", gloss: "میا می‌گه: بلی، همو خودشه. او دیزاینری استه که پروژهٔ لوگو را تمام کد.", note: "*who* اینجه به دیزاینر اشاره می‌کنه."}
  en.b1.unit13.lesson04.teach.a_which_won_award: {title: "سوال لیلا", gloss: "لیلا می‌گه: اوه، یادم آمد. آیا همو پروژه‌ای استه که ماه پیش جایزه برد؟", note: "*which* اینجه به پروژه اشاره می‌کنه."}
  en.b1.unit13.lesson04.teach.q_office_smaller: {title: "جواب میا", gloss: "میا می‌گه: دقیقاً. دفتری که او پیش‌تر در آن کار می‌کد، خیلی کوچک‌تر از دفتر ما بود.", note: "*where* اینجه به دفتر اشاره می‌کنه."}
  en.b1.unit13.lesson04.teach.a_kitchen_where: {title: "جواب لیلا", gloss: "لیلا می‌گه: همی معلوم می‌سازه چرا او آشپزخانه‌ای را که همه در آن باهم غذای چاشت می‌خورن، خوش داره.", note: "*where* اینجه به آشپزخانه اشاره می‌کنه."}

exercises:
  en.b1.unit13.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "coworker"
    distractors: ["who", "which", "whose"]
    accepted_answers: [{value: "coworker", status: "correct"}]
    feedback: "*coworker* یعنی همکار."
  en.b1.unit13.lesson01.exercise02.choose_whose:
    instruction: "کدام کلمه مالکیت را در داخل جملهٔ وصفی نشان می‌ته؟"
    correct_option: "whose"
    distractors: ["who", "which", "where"]
    accepted_answers: [{value: "whose", status: "correct"}]
    feedback: "*whose* مالکیت را نشان می‌ته."
  en.b1.unit13.lesson01.exercise03.choose_where:
    instruction: "کدام کلمه به یک جای در داخل جملهٔ وصفی اشاره می‌کنه؟"
    correct_option: "where"
    distractors: ["who", "which", "that"]
    accepted_answers: [{value: "where", status: "correct"}]
    feedback: "*where* به یک جای اشاره می‌کنه."
  en.b1.unit13.lesson01.exercise04.match_relative_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "who", right: "کی، که (برای اشخاص)"}
      - {left: "which", right: "که (برای چیزها)"}
      - {left: "that", right: "که (برای شخص یا چیز، در جملهٔ وصفیِ تعریفی)"}
      - {left: "whose", right: "که مالِ او (نشان‌دهندهٔ مالکیت)"}
      - {left: "where", right: "که در آنجا، جایی که"}
      - {left: "coworker", right: "همکار"}
    accepted_answers:
      - value:
          - {left: "who", right: "کی، که (برای اشخاص)"}
          - {left: "which", right: "که (برای چیزها)"}
          - {left: "that", right: "که (برای شخص یا چیز، در جملهٔ وصفیِ تعریفی)"}
          - {left: "whose", right: "که مالِ او (نشان‌دهندهٔ مالکیت)"}
          - {left: "where", right: "که در آنجا، جایی که"}
          - {left: "coworker", right: "همکار"}
        status: "correct"
    feedback: "*who*=به یک شخص، *which*=به یک چیز، *that*=به شخص یا چیز تعریفی، *whose*=مالکیت، *where*=به یک جای، *coworker*=همکار."
  en.b1.unit13.lesson01.exercise05.write_coworker:
    instruction: "کلمه‌ای را که یعنی کسی که با شما کار می‌کنه بنویسین."
    accepted_answers:
      - {value: "coworker", status: "correct"}
      - {value: "Coworker", status: "correct"}
    feedback: "*coworker* یعنی همکار."

  en.b1.unit13.lesson02.exercise01.choose_defining_clause:
    instruction: "کدام جمله یک جملهٔ وصفیِ تعریفی را بدون کاما استفاده می‌کنه؟"
    correct_option: "The colleague who sits next to Mia is very organized."
    distractors: ["Daniel, who joined the team in March, already leads two projects.", "Their office, which is on the fifth floor, has a small kitchen.", "The client, whose project they are finishing, approved the design."]
    accepted_answers: [{value: "The colleague who sits next to Mia is very organized.", status: "correct"}]
    feedback: "*The colleague who sits next to Mia is very organized* یک جملهٔ وصفیِ تعریفی بدون کاما استه."
  en.b1.unit13.lesson02.exercise02.choose_nondefining_clause:
    instruction: "کدام جمله یک جملهٔ وصفیِ غیرتعریفی را با کاما، برای اضافه کدن معلومات، استفاده می‌کنه؟"
    correct_option: "Daniel, who joined the team in March, already leads two projects."
    distractors: ["The colleague who sits next to Mia is very organized.", "The client that called this morning wants a meeting.", "The office where Daniel works is downtown."]
    accepted_answers: [{value: "Daniel, who joined the team in March, already leads two projects.", status: "correct"}]
    feedback: "*Daniel, who joined the team in March, already leads two projects* یک جملهٔ وصفیِ غیرتعریفی با کاما استه."
  en.b1.unit13.lesson02.exercise03.order_colleague_organized:
    instruction: "کلمات را برای گفتن «همکاری که نزدیک میا نشسته، خیلی منظم استه» ترتیب کنین."
    accepted_answers: [{value: ["The", "colleague", "who", "sits", "next", "to", "Mia", "is", "very", "organized"], status: "correct"}]
    feedback: "ترتیب درست: *The colleague who sits next to Mia is very organized*."
  en.b1.unit13.lesson02.exercise04.reply_which_colleague:
    instruction: "کدام همکار خیلی منظم استه؟"
    accepted_answers:
      - {value: "The colleague who sits next to Mia is very organized.", status: "correct"}
      - {value: "The colleague who sits next to Mia is very organized", status: "correct"}
    feedback: "*The colleague who sits next to Mia is very organized* یعنی همکاری که نزدیک میا نشسته، خیلی منظم استه."
  en.b1.unit13.lesson02.exercise05.write_daniel_leads:
    instruction: "بنویسین که دنیل، که در مارچ شامل تیم شد، از همین حالا دو پروژه را رهبری می‌کنه."
    accepted_answers:
      - {value: "Daniel, who joined the team in March, already leads two projects.", status: "correct"}
      - {value: "Daniel, who joined the team in March, already leads two projects", status: "correct"}
    feedback: "*Daniel, who joined the team in March, already leads two projects* یعنی دنیل، که در مارچ شامل تیم شد، از همین حالا دو پروژه را رهبری می‌کنه."

  en.b1.unit13.lesson03.exercise01.comprehend_daniel_leads:
    instruction: "دنیل، که در مارچ شامل تیم شد، تا حالا چی کار کده؟"
    correct_option: "already leads two projects"
    distractors: ["already finished the design course", "already left the company", "already changed offices"]
    accepted_answers: [{value: "already leads two projects", status: "correct"}]
    feedback: "متن می‌گه *already leads two projects*."
  en.b1.unit13.lesson03.exercise02.comprehend_client_approved:
    instruction: "مشتری‌یی که پروژه‌اش را تمام می‌کنن، تا حالا چی کار کده؟"
    correct_option: "has already approved the first design"
    distractors: ["has already canceled the project", "has already hired a new designer", "has already moved to a new office"]
    accepted_answers: [{value: "has already approved the first design", status: "correct"}]
    feedback: "متن می‌گه *has already approved the first design*."
  en.b1.unit13.lesson03.exercise03.recognize_deadline:
    instruction: "کدام کلمه یعنی تاریخ یا وقتی که یک کار باید تمام شه؟"
    correct_option: "deadline"
    distractors: ["approve", "coworker", "opportunity"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "*deadline* یعنی ضرب‌الاجل."
  en.b1.unit13.lesson03.exercise04.order_office_kitchen:
    instruction: "کلمات را برای گفتن «دفترشان، که در طبقهٔ پنجم استه، یک آشپزخانهٔ کوچک داره» ترتیب کنین."
    accepted_answers: [{value: ["Their", "office", "which", "is", "on", "the", "fifth", "floor", "has", "a", "small", "kitchen"], status: "correct"}]
    feedback: "ترتیب درست: *Their office, which is on the fifth floor, has a small kitchen*."
  en.b1.unit13.lesson03.exercise05.write_colleague_organized:
    instruction: "بنویسین که همکاری که نزدیک میا نشسته، خیلی منظم استه."
    accepted_answers:
      - {value: "The colleague who sits next to Mia is very organized.", status: "correct"}
      - {value: "The colleague who sits next to Mia is very organized", status: "correct"}
    feedback: "*The colleague who sits next to Mia is very organized* یعنی همکاری که نزدیک میا نشسته، خیلی منظم استه."

  en.b1.unit13.lesson04.exercise01.listen_who_joined_team:
    instruction: "گفتگو را گوش کنین و بگین میا دربارهٔ کی می‌پرسه."
    correct_option: "the woman who just joined our team"
    distractors: ["the manager who left the company", "the client who called yesterday", "the designer who works from home"]
    accepted_answers: [{value: "the woman who just joined our team", status: "correct"}]
    feedback: "میا می‌گه *the woman who just joined our team*."
  en.b1.unit13.lesson04.exercise02.listen_desk_location:
    instruction: "گوش کنین و بگین لیلا همکار نو را با کدام توضیح می‌شناسه."
    correct_option: "whose desk is near the window"
    distractors: ["whose desk is near the door", "whose office is downtown", "whose project won an award last year"]
    accepted_answers: [{value: "whose desk is near the window", status: "correct"}]
    feedback: "لیلا می‌گه *whose desk is near the window*."
  en.b1.unit13.lesson04.exercise03.choose_who_the_new_coworker_is:
    instruction: "همکار نو، کی استه که میا معرفی می‌کنه؟"
    correct_option: "the designer who finished the logo project"
    distractors: ["the manager who leads the team", "the client whose project was canceled", "the coworker who studies Spanish in the evening"]
    accepted_answers: [{value: "the designer who finished the logo project", status: "correct"}]
    feedback: "میا می‌گه *the designer who finished the logo project*."
  en.b1.unit13.lesson04.exercise04.order_office_smaller:
    instruction: "کلمات را برای گفتن «دفتری که او پیش‌تر در آن کار می‌کد، خیلی کوچک‌تر از دفتر ما بود» ترتیب کنین."
    accepted_answers: [{value: ["The", "office", "where", "she", "used", "to", "work", "was", "much", "smaller", "than", "ours"], status: "correct"}]
    feedback: "ترتیب درست: *The office where she used to work was much smaller than ours*."
  en.b1.unit13.lesson04.exercise05.reply_as_mia:
    instruction: "لیلا می‌گه: نی هنوز. آیا او همو کسی استه که میزش نزدیک کلکین استه؟ به نقش میا با *who* جواب بتین: او دیزاینری استه که پروژهٔ لوگو را تمام کد."
    accepted_answers:
      - {value: "She is the designer who finished the logo project.", status: "correct"}
      - {value: "She is the designer who finished the logo project", status: "correct"}
      - {value: "Yes, that is her. She is the designer who finished the logo project.", status: "correct"}
      - {value: "Yes, she is the designer who finished the logo project.", status: "correct"}
      - {value: "She's the designer who finished the logo project.", status: "correct"}
    feedback: "*She is the designer who finished the logo project* یعنی او دیزاینری استه که پروژهٔ لوگو را تمام کد."
  en.b1.unit13.lesson04.exercise06.speak_relative_clause_dialogue:
    instruction: "میا می‌گه: دقیقاً. دفتری که او پیش‌تر در آن کار می‌کد، خیلی کوچک‌تر از دفتر ما بود. به نقش لیلا آوازی با *where* جواب بتین: همی معلوم می‌سازه چرا آشپزخانه‌ای را که همه در آن باهم چاشت می‌خورن، خوش داره."
    accepted_answers:
      - {value: "That explains why she loves the kitchen where everyone eats lunch together.", status: "correct"}
      - {value: "That explains why she loves the kitchen where everyone eats lunch together", status: "correct"}
    feedback: "*That explains why she loves the kitchen where everyone eats lunch together* یعنی همی معلوم می‌سازه چرا او آشپزخانه‌ای را که همه در آن باهم غذای چاشت می‌خورن، خوش داره."
