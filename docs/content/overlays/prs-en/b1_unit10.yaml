  en.b1.unit10.lesson01.teach.improve: {title: "improve", gloss: "بهتر ساختن، بهتر شدن", note: "*improve* یعنی یک چیز را بهتر بسازین یا بهتر شه.", example_gloss: "دنیل می‌خواهد نوشته‌های کاری‌اش را بهتر بسازه."}
  en.b1.unit10.lesson01.teach.save_money: {title: "save money", gloss: "پول پس‌انداز کدن", note: "*save money* یعنی پول را برای بعد نگه دارین، نی این‌که حالا مصرفش کنین.", example_gloss: "لیلا برای کورس بعدی‌اش پول پس‌انداز می‌کنه."}
