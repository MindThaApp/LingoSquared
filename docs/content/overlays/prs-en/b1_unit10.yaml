  en.b1.unit10.lesson02.teach.evening_class: {title: "I am taking an evening class in order to improve my English.", gloss: "به یک صنف شام می‌رم تا انگلیسی‌ام را بهتر بسازم.", note: "*in order to improve* هدف رفتن به صنف را نشان می‌ته."}
