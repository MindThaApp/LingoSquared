teaching:
  en.b1.unit10.lesson01.teach.in_order_to: {title: "in order to", gloss: "برای این‌که، تا", note: "*in order to* هدف یک کار را نشان می‌ته و بعدش فعل ساده می‌آیه.", example_gloss: "درس می‌خوانم تا انگلیسی‌ام بهتر شه."}
  en.b1.unit10.lesson01.teach.so_that: {title: "so that", gloss: "تا، طوری که", note: "*so that* هدف یا نتیجهٔ خواسته‌شده را نشان می‌ته و بعدش یک جملهٔ کامل می‌آیه.", example_gloss: "یادداشت می‌نویسم تا لغت‌های نو یادم بمانه."}
