course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit10.purpose: {title: "چرا این کار را می‌کنم"}

lessons:
  en.b1.unit10.lesson01.purpose_vocabulary: {title: "In order to، so that، و goal"}
  en.b1.unit10.lesson02.purpose_clauses: {title: "درس می‌خوانم تا بهتر شوم"}
  en.b1.unit10.lesson03.reading_clear_goals: {title: "متن خوانی: هدف‌های روشن"}
  en.b1.unit10.lesson04.the_goals_dialogue: {title: "تا لغت‌های بیشتر یادم بماند"}

teaching:
  en.b1.unit10.lesson01.teach.in_order_to: {title: "in order to", gloss: "برای این‌که، به‌خاطر این‌که", note: "*in order to* هدف یک کار را نشان می‌ته و بعدش فعل ساده می‌آیه.", example_gloss: "درس می‌خوانم تا انگلیسی‌ام بهتر شود."}
  en.b1.unit10.lesson01.teach.so_that: {title: "so that", gloss: "تا، طوری که", note: "*so that* هدف یا نتیجهٔ خواسته‌شده را نشان می‌ته و بعدش یک جملهٔ کامل می‌آیه.", example_gloss: "یادداشت می‌نویسم تا لغت‌های نو یادم بماند."}
  en.b1.unit10.lesson01.teach.goal: {title: "goal", gloss: "هدف", note: "*goal* یعنی چیزی که می‌خواهین به آن برسین.", example_gloss: "هدفش این است که یک کورس دیزاین بگیره."}
  en.b1.unit10.lesson01.teach.improve: {title: "improve", gloss: "بهتر ساختن، بهتر شدن", note: "*improve* یعنی یک چیز را بهتر بسازین یا بهتر شه.", example_gloss: "دانیال می‌خواهد نوشته‌های کاری‌اش را بهتر بسازه."}
  en.b1.unit10.lesson01.teach.save_money: {title: "save money", gloss: "پول پس‌انداز کدن", note: "*save money* یعنی پول را برای بعد نگه دارین، نی این‌که حالا مصرفش کنین.", example_gloss: "لیلا برای کورس بعدی‌اش پول پس‌انداز می‌کنه."}
  en.b1.unit10.lesson01.teach.prepare: {title: "prepare", gloss: "آماده شدن، آماده کدن", note: "*prepare* یعنی برای یک کار آماده شین.", example_gloss: "قبل از هر جلسه سوال‌ها را آماده می‌کنم."}

  en.b1.unit10.lesson02.teach.evening_class: {title: "I am taking an evening class in order to improve my English.", gloss: "یک صنف شام می‌گیرم تا انگلیسی‌ام را بهتر بسازم.", note: "*in order to improve* هدف گرفتن صنف را نشان می‌ته."}
  en.b1.unit10.lesson02.teach.study_so_that: {title: "I study every night so that I can remember more vocabulary.", gloss: "هر شب درس می‌خوانم تا لغت‌های بیشتر یادم بماند.", note: "*so that I can...* یک جملهٔ کامل بعد از *so that* می‌آره."}
  en.b1.unit10.lesson02.teach.grammar_purpose: {title: "Use in order to before a verb. Use so that before a full clause: I study so that I can remember more.", gloss: "قبل از فعل از in order to استفاده کنین. قبل از جملهٔ کامل از so that استفاده کنین: درس می‌خوانم تا بیشتر یادم بماند.", note: "*in order to improve* فقط فعل دارد؛ *so that I can remember* فاعل و فعل کامل دارد."}

  en.b1.unit10.lesson03.teach.design_course: {title: "design course", gloss: "کورس دیزاین", note: "*design course* یعنی صنف یا کورس دربارهٔ این‌که چیزها چطور دیده و کار کنند.", example_gloss: "لیلا برای یک کورس دیزاین پول پس‌انداز می‌کنه."}
  en.b1.unit10.lesson03.teach.clear_goal: {title: "clear goal", gloss: "هدف روشن", note: "*clear goal* یعنی هدفی که دقیق معلوم است.", example_gloss: "یک هدف روشن کمک می‌کنه قدم بعدی را انتخاب کنین."}
  en.b1.unit10.lesson03.teach.reading_passage: {title: "متن دربارهٔ هدف‌های روشن", gloss: "دانیال و لیلا هر دو هدف‌های روشن دارند. دانیال یک صنف شام می‌گیره تا انگلیسی‌اش برای کار بهتر شه. او نوشتن اپدیت‌های کوتاه را تمرین می‌کنه تا حرفه‌ای‌تر معلوم شه. لیلا پول پس‌انداز می‌کنه تا سال آینده یک کورس دیزاین بگیره. او توضیحات کورس‌ها را می‌خوانه تا پروگرام درست را انتخاب کنه.", note: "همی متن چند راه گفتن هدف را با *in order to* و *so that* نشان می‌ته."}

  en.b1.unit10.lesson04.teach.q_why_evening_class: {title: "پرسش لیلا", gloss: "لیلا می‌گه: دانیال، چرا یک صنف شام می‌گیری؟", note: "*why* دلیل یا هدف یک کار را می‌پرسه."}
  en.b1.unit10.lesson04.teach.a_improve_english: {title: "جواب دانیال", gloss: "دانیال می‌گه: آن را می‌گیرم تا انگلیسی‌ام برای کار بهتر شه.", note: "*in order to improve my English for work* هدف صنف را واضح می‌سازه."}
  en.b1.unit10.lesson04.teach.q_studying_every_night: {title: "پرسش لیلا دربارهٔ عادت درس", gloss: "لیلا می‌گه: منطقی است. هر شب درس می‌خوانی؟", note: "*Are you studying...?* دربارهٔ کاری می‌پرسه که در این دوره جریان داره."}
  en.b1.unit10.lesson04.teach.a_remember_vocabulary: {title: "جواب دانیال", gloss: "دانیال می‌گه: سی دقیقه درس می‌خوانم تا لغت‌های بیشتر یادم بماند.", note: "*so that I can remember more vocabulary* هدف درس خواندن را با جملهٔ کامل نشان می‌ته."}
  en.b1.unit10.lesson04.teach.q_saving_money: {title: "هدف لیلا", gloss: "لیلا می‌گه: پلان خوب است. پول پس‌انداز می‌کنم تا سال آینده یک کورس دیزاین بگیرم.", note: "لیلا هم هدف خودش را با *so that* می‌گه."}
  en.b1.unit10.lesson04.teach.a_clear_goals: {title: "جمع‌بندی دانیال", gloss: "دانیال می‌گه: پس هر دو هدف‌های روشن داریم.", note: "*clear goals* یعنی هدف‌هایی که مشخص و قابل پیگیری است."}

