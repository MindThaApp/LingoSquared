  en.b1.unit10.lesson02.teach.grammar_purpose: {title: "I study in order to improve my English. I study so that I can remember more.", gloss: "درس می‌خوانم تا انگلیسی‌ام بهتر شوه. درس می‌خوانم تا بیشتر یادم بمانه.", note: "قبل از فعل از *in order to* استفاده کنین؛ قبل از جملهٔ کامل از *so that*. *in order to improve* فقط فعل داره؛ *so that I can remember* فاعل و فعل کامل داره."}

