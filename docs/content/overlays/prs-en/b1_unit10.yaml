  en.b1.unit10.lesson03.teach.reading_passage: {title: "متن دربارهٔ هدف‌های روشن", gloss: "دنیل و لیلا هر دو هدف‌های روشن دارن. دنیل به یک صنف شام می‌ره تا انگلیسی‌اش برای کار بهتر شه. او نوشتن اپدیت‌های کوتاه را تمرین می‌کنه تا حرفه‌ای‌تر معلوم شه. لیلا پول پس‌انداز می‌کنه تا سال آینده یک کورس دیزاین بخوانه. او توضیحات کورس‌ها را می‌خوانه تا پروگرام درست را انتخاب کنه.", note: "همی متن چند راه گفتن هدف را با *in order to* و *so that* نشان می‌ته."}

  en.b1.unit10.lesson04.teach.q_why_evening_class: {title: "سوال لیلا", gloss: "لیلا می‌گه: دنیل، چرا به یک صنف شام می‌ری؟", note: "*why* دلیل یا هدف یک کار را می‌پرسه."}
  en.b1.unit10.lesson04.teach.a_improve_english: {title: "جواب دنیل", gloss: "دنیل می‌گه: به آن می‌رم تا انگلیسی‌ام برای کار بهتر شه.", note: "*in order to improve my English for work* هدف صنف را واضح می‌سازه."}
  en.b1.unit10.lesson04.teach.q_studying_every_night: {title: "سوال لیلا دربارهٔ عادت درس", gloss: "لیلا می‌گه: منطقی استه. هر شب درس می‌خوانی؟", note: "*Are you studying...?* دربارهٔ کاری می‌پرسه که در این دوره جریان داره."}
  en.b1.unit10.lesson04.teach.a_remember_vocabulary: {title: "جواب دنیل", gloss: "دنیل می‌گه: سی دقیقه درس می‌خوانم تا لغت‌های بیشتر یادم بمانه.", note: "*so that I can remember more vocabulary* هدف درس خواندن را با جملهٔ کامل نشان می‌ته."}
  en.b1.unit10.lesson04.teach.q_saving_money: {title: "هدف لیلا", gloss: "لیلا می‌گه: پلان خوب استه. پول پس‌انداز می‌کنم تا سال آینده یک کورس دیزاین بخوانم.", note: "لیلا هم هدف خودش را با *so that* می‌گه."}
  en.b1.unit10.lesson04.teach.a_clear_goals: {title: "جمع‌بندی دنیل", gloss: "دنیل می‌گه: پس هر دو هدف‌های روشن داریم.", note: "*clear goals* یعنی هدف‌هایی که مشخص و قابل پیگیری استه."}

