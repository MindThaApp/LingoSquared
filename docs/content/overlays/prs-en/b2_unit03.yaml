course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای نرم یا قوی ساختن یک گپ، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit03.hedging_emphasis: {title: "معقول معلوم می‌شه، اما..."}

lessons:
  en.b2.unit03.lesson01.stance_words: {title: "نرم ساختن، شرط گذاشتن، و تاکید کدن"}
  en.b2.unit03.lesson02.modulating_claims: {title: "معقول معلوم می‌شه، اما واقعاً کار اضافه می‌سازه"}
  en.b2.unit03.lesson03.reading_nuanced_feedback: {title: "متن خوانی: حمایت با شرط"}
  en.b2.unit03.lesson04.the_nuance_dialogue: {title: "در کل مفید استه، به شرط این‌که..."}

teaching:
  en.b2.unit03.lesson01.teach.hedge: {title: "hedge", gloss: "نرم ساختن ادعا", note: "*hedge* یعنی ادعا را محتاط‌تر بسازین تا صد فیصد و مطلق معلوم نشه. مثل *seems*.", example_gloss: "لیلا با *seems* ادعایش دربارهٔ پالیسی را نرم می‌سازه."}
  en.b2.unit03.lesson01.teach.qualify: {title: "qualify", gloss: "محدود یا شرط‌دار ساختن", note: "*qualify* یعنی بگین گپ تان درست استه، اما با یک شرط یا محدودیت.", example_gloss: "عبارت *provided we agree* حمایت لیلا را شرط‌دار می‌سازه."}
  en.b2.unit03.lesson01.teach.emphasize: {title: "emphasize", gloss: "تاکید کدن، برجسته ساختن", note: "*emphasize* یعنی یک بخش پیام را قوی‌تر و برجسته‌تر بسازین.", example_gloss: "دانیال روی مشکل حجم کار تاکید می‌کنه."}
  en.b2.unit03.lesson01.teach.to_some_extent: {title: "to some extent", gloss: "تا یک اندازه", note: "*to some extent* یعنی یک گپ تا حدی درست استه، اما کامل نه.", example_gloss: "تا یک اندازه، پالیسی به نگرانی‌های تیم جواب می‌ته.", media_asset_key: "en.b2.audio.hedging_emphasis.phrase.to_some_extent.01"}
  en.b2.unit03.lesson01.teach.broadly: {title: "broadly", gloss: "در کل، به طور عمومی", note: "*broadly* موافقت عمومی را نشان می‌ته و برای استثناها جا می‌گذاره.", example_gloss: "پیشنهاد در کل مفید استه، هرچند کامل نیست."}
  en.b2.unit03.lesson01.teach.provided: {title: "provided", gloss: "به شرط این‌که", note: "*provided* شرطی را معرفی می‌کنه که باید برآورده شه. در دری نزدیک به «به شرط این‌که» استه.", example_gloss: "می‌تانیم از پالیسی حمایت کنیم، به شرط این‌که توافق کنیم."}

  en.b2.unit03.lesson02.teach.seems_but_does: {title: "The policy seems reasonable, but it does create extra work for the team.", gloss: "پالیسی معقول معلوم می‌شه، اما واقعاً برای تیم کار اضافه می‌سازه.", note: "*seems* ادعا را نرم می‌سازه؛ *does create* تاکید می‌کنه که کار اضافه واقعاً وجود داره.", media_asset_key: "en.b2.audio.hedging_emphasis.sentence.01"}
  en.b2.unit03.lesson02.teach.what_worries_me: {title: "What worries me is the extra work for the team.", gloss: "چیزی که مرا نگران می‌سازه کار اضافه برای تیم استه.", note: "*What worries me is...* توجه را روی یک نگرانی خاص می‌آره. این شکل در انگلیسی برای تمرکز دادن طبیعی استه."}
  en.b2.unit03.lesson02.teach.broadly_provided: {title: "It is broadly useful, provided the timeline is adjusted.", gloss: "در کل مفید استه، به شرط این‌که زمان‌بندی تنظیم شه.", note: "*provided* شرط لازم را اضافه می‌کنه؛ بدون آن، حمایت کامل نیست."}
  en.b2.unit03.lesson02.teach.grammar_stance: {title: "نرم، شرط‌دار، و تاکیدی گفتن", gloss: "برای نرم یا شرط‌دار ساختن ادعا از *seems*، *broadly*، یا *to some extent* استفاده کنین. برای تاکید روی درست بودن یک گپ، پیش از فعل اصلی *do* یا *does* بیارین. برای تمرکز روی یک نکته از *What matters is...* یا *What worries me is...* استفاده کنین.", note: "در دری گاهی با لحن تاکید می‌کنیم؛ در انگلیسی نوشتاری باید کلمهٔ تاکید مثل *does* را واضح بیارین."}

  en.b2.unit03.lesson03.teach.overall: {title: "overall", gloss: "در کل", note: "*overall* یعنی وقتی تصویر عمومی را می‌بینیم، نه هر جزئیات را.", example_gloss: "در کل، لیلا از پالیسی حمایت می‌کنه."}
  en.b2.unit03.lesson03.teach.condition: {title: "condition", gloss: "شرط", note: "*condition* چیزی استه که باید برآورده شه تا حمایت یا توافق درست باشه.", example_gloss: "شرط او این استه که زمان‌بندی باید تنظیم شه."}
  en.b2.unit03.lesson03.teach.reading_passage: {title: "متن دربارهٔ نظر شرط‌دار", gloss: "نظر لیلا مثبت استه، اما با دقت شرط‌دار شده. او می‌گه پالیسی بررسی در کل معقول معلوم می‌شه، که ادعا را نرم می‌سازه و از مطلق معلوم شدن جلوگیری می‌کنه. همچنان می‌گه که در کل مفید استه، به شرط این‌که زمان‌بندی تنظیم شه. همی شرط حمایت او را محدود می‌کنه: او پالیسی را دقیقاً همان‌طور که نوشته شده قبول نمی‌کنه. دانیال با یک ساختار تمرکز روی نکتهٔ دیگر تاکید می‌کنه: چیزی که او را نگران می‌سازه کار اضافه برای تیم استه. هر دو گوینده در اصل از پالیسی حمایت می‌کنند، اما زبان شان درجه‌های متفاوت تعهد را نشان می‌ته.", note: "در همی متن، *seems* ادعا را نرم می‌سازه، *provided* شرط می‌گذاره، و *What worries him is...* تمرکز می‌ته."}

  en.b2.unit03.lesson04.teach.q_policy_seems: {title: "نظر اول لیلا", gloss: "لیلا می‌گه: پالیسی جدید بررسی در کل معقول معلوم می‌شه.", note: "*seems reasonable overall* مثبت استه، اما صد فیصد قطعی نیست.", media_asset_key: "en.b2.audio.dialogue.hedging_emphasis.01"}
  en.b2.unit03.lesson04.teach.a_not_fully_ready: {title: "برداشت دانیال", gloss: "دانیال می‌گه: این کمی محتاطانه شنیده می‌شه. می‌گی که کاملاً آماده نیست؟", note: "دانیال اثر *seems* را می‌شنوه: حمایت با احتیاط."}
  en.b2.unit03.lesson04.teach.q_workable_deadlines: {title: "توضیح لیلا", gloss: "لیلا می‌گه: دقیقاً. شاید قابل اجرا باشه، اما مهلت‌های واضح‌تر لازم داره.", note: "*may be workable* امکان مثبت را نرم بیان می‌کنه."}
  en.b2.unit03.lesson04.teach.a_what_worries: {title: "نگرانی دانیال", gloss: "دانیال می‌گه: موافقم. چیزی که مرا نگران می‌سازه کار اضافه برای تیم استه.", note: "*What worries me is...* نگرانی اصلی را برجسته می‌سازه."}
  en.b2.unit03.lesson04.teach.q_does_create_checks: {title: "تاکید لیلا", gloss: "لیلا می‌گه: دقیقاً. پالیسی واقعاً بررسی‌های بهتر برای کیفیت به‌وجود می‌آره، اما یک مرحلهٔ تاییدی دیگر هم اضافه می‌کنه.", note: "*does create* تاکید می‌کنه که بخش مثبت واقعاً وجود داره."}
  en.b2.unit03.lesson04.teach.a_support_conditions: {title: "خلاصهٔ دانیال", gloss: "دانیال می‌پرسه: پس باید با شرط‌ها از آن حمایت کنیم؟", note: "*with conditions* یعنی حمایت کامل و بی‌قید نیست."}
  en.b2.unit03.lesson04.teach.q_broadly_useful: {title: "نتیجهٔ لیلا", gloss: "لیلا می‌گه: بلی. من می‌گم در کل مفید استه، به شرط این‌که زمان‌بندی تنظیم شه.", note: "*broadly useful, provided...* یک حمایت پخته و شرط‌دار استه."}
  en.b2.unit03.lesson04.teach.same_content_triad: {title: "سه درجه برای یک فکر", gloss: "پالیسی کار اضافه می‌سازه. پالیسی ظاهراً کار اضافه می‌سازه. پالیسی واقعاً کار اضافه می‌سازه.", note: "همان محتوای اصلی با سه لحن می‌آیه: عادی، نرم با *seems to*، و تاکیدی با *does*."}

