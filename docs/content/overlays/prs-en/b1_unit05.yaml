course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit05.workplace: {title: "مسئولیت‌ها و خبرهای وضعیت کارم"}

lessons:
  en.b1.unit05.lesson01.workplace_vocabulary: {title: "Responsible for، update، و deadline"}
  en.b1.unit05.lesson02.giving_a_status_update: {title: "مسئول استم، از برنامه عقب استم"}
  en.b1.unit05.lesson03.reading_a_weekly_update: {title: "متن خوانی: خبر هفتگی دانیال"}
  en.b1.unit05.lesson04.asking_a_colleague_for_help: {title: "می‌تانین کمکم کنین همی را چک کنم؟"}

teaching:
  en.b1.unit05.lesson01.teach.responsible_for: {title: "responsible for", gloss: "مسئول", note: "*responsible for* یعنی وظیفهٔ‌تان استه که یک کاری را انجام بتین.", example_gloss: "مسئول ریپورت ماهانه استم."}
  en.b1.unit05.lesson01.teach.update: {title: "update", gloss: "خبر تازه، معلومات جدید", note: "*update* یعنی معلومات نو دربارهٔ پیشرفت یک کار.", example_gloss: "هر هفته یک خبر تازه به تیمم می‌تم."}
  en.b1.unit05.lesson01.teach.deadline: {title: "deadline", gloss: "میعاد", note: "*deadline* یعنی وقتی که یک کار باید تا آن وقت تمام شه.", example_gloss: "میعاد ریپورت روز جمعه استه."}
  en.b1.unit05.lesson01.teach.report: {title: "report", gloss: "ریپورت، گزارش", note: "*report* یعنی یک سند که کار یا نتیجه‌ها را شرح می‌ته.", example_gloss: "هر ماه یک ریپورت فروش می‌نویسم."}
  en.b1.unit05.lesson01.teach.on_schedule: {title: "on schedule", gloss: "مطابق برنامه", note: "*on schedule* یعنی مطابق پلان پیش می‌ره، تاخیر نداره.", example_gloss: "پروژه مطابق برنامه پیش می‌ره."}
  en.b1.unit05.lesson01.teach.behind_schedule: {title: "behind schedule", gloss: "عقب از برنامه", note: "*behind schedule* یعنی یک کار از برنامه‌اش کندتر پیش می‌ره.", example_gloss: "همی هفته کمی از برنامه عقب استیم."}

  en.b1.unit05.lesson02.teach.responsible_for_report: {title: "I'm responsible for the monthly report.", gloss: "مسئول ریپورت ماهانه استم.", note: "*I'm responsible for...* یک مسئولیت شغلی را معرفی می‌کنه."}
  en.b1.unit05.lesson02.teach.project_on_schedule: {title: "The project is on schedule.", gloss: "پروژه مطابق برنامه پیش می‌ره.", note: "*on schedule* یعنی هیچ تاخیری نیست."}
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday: {title: "I'm a little behind schedule, but I'll finish by Friday.", gloss: "کمی از برنامه عقب استم، اما تا جمعه تمامش می‌کنم.", note: "*I'm behind schedule, but...* یک خبر وضعیت مؤدبانه استه که هنوز میعاد را نگه می‌داره."}
  en.b1.unit05.lesson02.teach.grammar_status_update: {title: "I'm responsible for the report. The project is on schedule. I'm behind schedule.", gloss: "مسئول ریپورت استم. پروژه مطابق برنامه پیش می‌ره. از برنامه عقب استم.", note: "همی سه جمله سه شکل معمولی خبر وضعیت کاری را نشان می‌ته."}

  en.b1.unit05.lesson03.teach.team: {title: "team", gloss: "تیم", note: "*team* یعنی یک گروه کسانی که با هم کار می‌کنن.", example_gloss: "هر هفته یک خبر کوتاه به تیمش می‌ته."}
  en.b1.unit05.lesson03.teach.technical_problem: {title: "technical problem", gloss: "مشکل تخنیکی", note: "*technical problem* یعنی یک مشکل با کمپیوتر یا سیستم.", example_gloss: "به‌خاطر یک مشکل تخنیکی از برنامه عقب استه."}
  en.b1.unit05.lesson03.teach.reading_passage: {title: "متن دربارهٔ خبر هفتگی دانیال", gloss: "دانیال مسئول ریپورت ماهانهٔ فروش استه. هر هفته، یک خبر کوتاه به تیمش می‌ته. همی هفته، به‌خاطر یک مشکل تخنیکی کمی از برنامه عقب استه، اما امید داره تا جمعه تمامش کنه. او همیشه راست را دربارهٔ تاخیرها به تیمش می‌گه.", note: "همی متن یک خبر واقعی وضعیت کاری با یک عذر معتبر را نشان می‌ته -- سویهٔ B1."}

  en.b1.unit05.lesson04.teach.q_could_you_help_review: {title: "خواهش دانیال", gloss: "دانیال می‌گه: میا، می‌تانین کمکم کنین همی ریپورت را قبل از فرستادنش چک کنم؟", note: "*Could you help me...?* یک خواهش مؤدبانهٔ کمک از یک همکار استه."}
  en.b1.unit05.lesson04.teach.a_of_course_what_help: {title: "جواب میا", gloss: "میا می‌گه: البته. با کدام بخشش کمک لازم دارین؟", note: "*Of course* یک قبول مؤدبانهٔ خواهش کمک استه."}
  en.b1.unit05.lesson04.teach.q_make_sure_numbers: {title: "توضیح دانیال", gloss: "دانیال می‌گه: می‌خواهم مطمئن شم که رقم‌ها درست استه.", note: "*I want to make sure...* یعنی می‌خواین از درست بودن یک چیز مطمئن شین."}
  en.b1.unit05.lesson04.teach.a_check_this_afternoon: {title: "جواب میا", gloss: "میا می‌گه: مشکلی نیست. همی بعد از ظهر چکش می‌کنم و یادداشت‌هایم را می‌فرستم.", note: "*No problem* یک قبول ساده و دوستانهٔ خواهش کمک استه."}
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate: {title: "تشکر دانیال", gloss: "دانیال می‌گه: تشکر، واقعاً قدردانم.", note: "*I really appreciate it* یک تشکر رسمی‌تر از یک تشکر ساده استه."}
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know: {title: "جواب میا", gloss: "میا می‌گه: خواهش می‌کنم. اگه چیز دیگه لازم داشتین، بگین.", note: "*Let me know if you need anything else* یک پیشنهاد باز برای کمک بیشتر استه."}

exercises:
  en.b1.unit05.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "deadline"
    distractors: ["responsible for", "update", "report"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "*deadline* یعنی میعاد."
  en.b1.unit05.lesson01.exercise02.choose_in_charge_of_phrase:
    instruction: "کدام عبارت یعنی وظیفهٔ‌تان استه که یک کاری را مراقبت کنین؟"
    correct_option: "responsible for"
    distractors: ["on schedule", "behind schedule", "update"]
    accepted_answers: [{value: "responsible for", status: "correct"}]
    feedback: "*responsible for* یعنی مسئول."
  en.b1.unit05.lesson01.exercise03.choose_late_phrase:
    instruction: "کدام عبارت یعنی یک کار کندتر از برنامه‌اش پیش می‌ره؟"
    correct_option: "behind schedule"
    distractors: ["on schedule", "deadline", "responsible for"]
    accepted_answers: [{value: "behind schedule", status: "correct"}]
    feedback: "*behind schedule* یعنی عقب از برنامه."
  en.b1.unit05.lesson01.exercise04.match_workplace_words:
    instruction: "هر معنی را به کلمه یا عبارت درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "it is your job to take care of this", right: "responsible for"}
          - {left: "new information about how something is going", right: "update"}
          - {left: "the date something must be finished by", right: "deadline"}
          - {left: "a written document describing work or results", right: "report"}
          - {left: "going as planned, not late", right: "on schedule"}
          - {left: "going slower than planned", right: "behind schedule"}
        status: "correct"
    feedback: "*responsible for*=مسئول، *update*=خبر تازه، *deadline*=میعاد، *report*=ریپورت، *on schedule*=مطابق برنامه، *behind schedule*=عقب از برنامه."
  en.b1.unit05.lesson01.exercise05.write_deadline:
    instruction: "کلمه‌ای را که یعنی وقتی استه که یک کار باید تا آن وقت تمام شه بنویسین."
    accepted_answers:
      - {value: "deadline", status: "correct"}
      - {value: "Deadline", status: "correct"}
    feedback: "*deadline* یعنی میعاد."

  en.b1.unit05.lesson02.exercise01.choose_daniels_responsibility:
    instruction: "کدام جمله یک مسئولیت شغلی را شرح می‌ته؟"
    correct_option: "I'm responsible for the monthly report."
    distractors: ["The project is on schedule.", "I'm a little behind schedule, but I'll finish by Friday.", "I have a deadline on Friday."]
    accepted_answers: [{value: "I'm responsible for the monthly report.", status: "correct"}]
    feedback: "*I'm responsible for the monthly report* یعنی مسئول ریپورت ماهانه استم."
  en.b1.unit05.lesson02.exercise02.choose_status_update:
    instruction: "کدام جمله یک خبر وضعیت دربارهٔ کمی تاخیر داشتن می‌ته؟"
    correct_option: "I'm a little behind schedule, but I'll finish by Friday."
    distractors: ["I'm responsible for the monthly report.", "The project is on schedule.", "I have a deadline on Friday."]
    accepted_answers: [{value: "I'm a little behind schedule, but I'll finish by Friday.", status: "correct"}]
    feedback: "*I'm a little behind schedule, but I'll finish by Friday* یعنی کمی از برنامه عقب استم، اما تا جمعه تمامش می‌کنم."
  en.b1.unit05.lesson02.exercise03.order_project_on_schedule:
    instruction: "کلمات را برای گفتن «پروژه مطابق برنامه پیش می‌ره» ترتیب کنین."
    accepted_answers: [{value: ["The", "project", "is", "on", "schedule"], status: "correct"}]
    feedback: "ترتیب درست: *The project is on schedule*"
  en.b1.unit05.lesson02.exercise04.reply_what_are_you_responsible_for:
    instruction: "در کارتان مسئول چی استین؟"
    accepted_answers:
      - {value: "I'm responsible for the monthly report.", status: "correct"}
      - {value: "I'm responsible for the monthly report", status: "correct"}
    feedback: "*I'm responsible for the monthly report* یعنی مسئول ریپورت ماهانه استم."
  en.b1.unit05.lesson02.exercise05.write_behind_schedule:
    instruction: "بنویسین که کمی از برنامه عقب استین اما تا جمعه تمامش می‌کنین."
    accepted_answers:
      - {value: "I'm a little behind schedule, but I'll finish by Friday.", status: "correct"}
      - {value: "I'm a little behind schedule, but I will finish by Friday.", status: "correct"}
    feedback: "*I'm a little behind schedule, but I'll finish by Friday* یعنی کمی از برنامه عقب استم، اما تا جمعه تمامش می‌کنم."

  en.b1.unit05.lesson03.exercise01.comprehend_daniels_responsibility:
    instruction: "دانیال مسئول چیست؟"
    correct_option: "the monthly sales report"
    distractors: ["the weekly team meeting", "the office schedule", "the technical problems"]
    accepted_answers: [{value: "the monthly sales report", status: "correct"}]
    feedback: "متن می‌گه *Daniel is responsible for the monthly sales report*."
  en.b1.unit05.lesson03.exercise02.comprehend_why_hes_behind:
    instruction: "همی هفته دانیال چرا کمی از برنامه عقب استه؟"
    correct_option: "a technical problem"
    distractors: ["a family emergency", "a missed deadline last month", "a new team member"]
    accepted_answers: [{value: "a technical problem", status: "correct"}]
    feedback: "متن می‌گه *because of a technical problem*."
  en.b1.unit05.lesson03.exercise03.recognize_team:
    instruction: "کدام کلمه یعنی یک گروه کسانی که با هم کار می‌کنن؟"
    correct_option: "team"
    distractors: ["report", "deadline", "update"]
    accepted_answers: [{value: "team", status: "correct"}]
    feedback: "*team* یعنی تیم."
  en.b1.unit05.lesson03.exercise04.order_he_gives_his_team_update:
    instruction: "کلمات را برای گفتن «او یک خبر کوتاه به تیمش می‌ته» ترتیب کنین."
    accepted_answers: [{value: ["He", "gives", "his", "team", "a", "short", "update"], status: "correct"}]
    feedback: "ترتیب درست: *He gives his team a short update*"
  en.b1.unit05.lesson03.exercise05.write_daniel_always_tells_truth:
    instruction: "بنویسین که او همیشه راست را دربارهٔ تاخیرها به تیمش می‌گه."
    accepted_answers:
      - {value: "He always tells his team the truth about delays.", status: "correct"}
      - {value: "He always tells his team the truth about delays", status: "correct"}
    feedback: "*He always tells his team the truth about delays* یعنی همیشه راست را دربارهٔ تاخیرها به تیمش می‌گه."

  en.b1.unit05.lesson04.exercise01.listen_what_daniel_asks_for:
    instruction: "گفتگو را گوش کنین و معلوم کنین دانیال چی خواهش می‌کنه."
    correct_option: "help me review this report"
    distractors: ["help me write a new report", "help me schedule a meeting", "help me finish the deadline"]
    accepted_answers: [{value: "help me review this report", status: "correct"}]
    feedback: "دانیال می‌گه *could you help me review this report*."
  en.b1.unit05.lesson04.exercise02.listen_when_mia_will_check:
    instruction: "گوش کنین و معلوم کنین میا کِی چکش می‌کنه."
    correct_option: "this afternoon"
    distractors: ["tomorrow morning", "next week", "right now"]
    accepted_answers: [{value: "this afternoon", status: "correct"}]
    feedback: "میا می‌گه *I'll check it this afternoon*."
  en.b1.unit05.lesson04.exercise03.choose_what_daniel_wants_checked:
    instruction: "دانیال می‌خواد میا چی را چک کنه؟"
    correct_option: "the numbers are correct"
    distractors: ["the deadline is correct", "the report is too long", "the team agrees"]
    accepted_answers: [{value: "the numbers are correct", status: "correct"}]
    feedback: "دانیال می‌گه *I want to make sure the numbers are correct*."
  en.b1.unit05.lesson04.exercise04.order_could_you_help_me_review:
    instruction: "کلمات را برای گفتن «می‌تانین کمکم کنین همی ریپورت را چک کنم؟» ترتیب کنین."
    accepted_answers: [{value: ["Could", "you", "help", "me", "review", "this", "report"], status: "correct"}]
    feedback: "ترتیب درست: *Could you help me review this report*"
  en.b1.unit05.lesson04.exercise05.reply_as_mia:
    instruction: "دانیال می‌گه: میا، می‌تانین کمکم کنین همی ریپورت را قبل از فرستادنش چک کنم؟"
    accepted_answers:
      - {value: "Of course. What do you need help with?", status: "correct"}
    feedback: "*Of course. What do you need help with?* یعنی البته. با کدام بخشش کمک لازم دارین؟"
  en.b1.unit05.lesson04.exercise06.speak_workplace_dialogue:
    instruction: "به نقش میا، آوازی جواب بته."
    accepted_answers:
      - {value: "No problem. I'll check it this afternoon and send you my notes.", status: "correct"}
    feedback: "*No problem. I'll check it this afternoon and send you my notes* یعنی مشکلی نیست. همی بعد از ظهر چکش می‌کنم و یادداشت‌هایم را می‌فرستم."
