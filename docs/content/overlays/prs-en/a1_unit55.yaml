review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 6 fixes -- inconsistent/odd مصئون/مصون replaced with در امان; typo چسپانی; Iranian هدایت‌ها->دستورها; lifeguard verb می‌بینه->مراقب استه; dialogue line 8 referent (They=lockers) noted; accepted answers added (speak_response, writing_prompt). NATIVE FLAGS: none. Prior note: New overlay against the shared English realization unit55 (swimming pool), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit55.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit55.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: swimming pool -> حوض شنا (the standard Dari/Afghan term, as opposed to Iranian Persian's استخر); ticket -> تکت (same standard Dari word already established for unit58's museum tickets and unit48's bus/cinema tickets, per CLAUDE.md precedent, as opposed to Iranian Persian's بلیت); locker -> کمد (the ordinary Dari word for a lockable cabinet); the rest of the vocabulary (کلاه شنا/swim cap, قوانین/rules, نجات‌غریق/lifeguard) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه/استن for است/اند, می‌شه/می‌کنیم for می‌شود/می‌کنیم, لازمی استه for the obligation sense of 'required'). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's passive-participle adjective 'required' (swim caps are required, meaning obligatory) turns the verb 'require' directly into a descriptive adjective -- Dari expresses the same obligation with a copula+adjective phrase, لازمی استه ('is necessary'), rather than converting a verb into an adjective the same way, so a Dari speaker must learn this as a specific English grammatical move; (2) English's purpose-question frame 'Are you here to ___?' (Are you here to swim today?), combining 'here' with an infinitive of purpose to ask someone's reason for being present, has no matching fixed frame in Dari, which asks the same thing more directly with برای چه آمدین؟ ('why did you come') or a specific verb-based question -- a Dari speaker must learn 'here to + verb' as an idiomatic English question pattern rather than build it compositionally. Three-speaker dialogue (Lifeguard, Daniel, Mia) handled the same way as unit48/unit50-unit54's precedent. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: the Lifeguard states three distinct fact types across separate turns (five-dollar ticket price, dollar-coin locker payment, eight-o'clock closing time) -- confirmed each answers a genuinely different question, so cross-using them as distractors is safe per the realization's own analysis, though invented values ('three dollars', 'a quarter', 'six o'clock') were used as the default anyway. Five dollars was also cross-checked against unit08/unit40/unit51/unit52/unit53/unit54's prices for accidental collision, none found, matching the realization's own note. Multi-clause accepted_answers (lesson04's write_own_pool_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit. Shared-en r2 review 2026-10-22: accepted answers extended."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit55.swimming_pool: {title: "بازدید از حوض شنا"}

lessons:
  en.a1.unit55.lesson01.swimming_pool_vocabulary: {title: "کلمات حوض شنا"}
  en.a1.unit55.lesson02.phrases_for_the_swimming_pool: {title: "عبارات حوض شنا"}
  en.a1.unit55.lesson03.dialogue_at_the_swimming_pool: {title: "گفتگو: توی حوض شنا"}
  en.a1.unit55.lesson04.a_trip_to_the_swimming_pool: {title: "متن: یک سفر به حوض شنا"}

teaching:
  en.a1.unit55.lesson01.teach.swimming_pool: {title: "swimming pool", gloss: "حوض شنا", note: "swimming pool یعنی حوض شنا -- در دری «حوض شنا» رایج استه، نی «استخر» که در فارسی ایران رایج استه.", example_gloss: "حوض شنا هر صبح باز می‌شه."}
  en.a1.unit55.lesson01.teach.ticket: {title: "ticket", gloss: "تکت", note: "ticket یعنی تکت -- برای داخل شدن به حوض شنا ضرورت استه.", example_gloss: "برای داخل شدن به حوض به یک تکت ضرورت دارین."}
  en.a1.unit55.lesson01.teach.locker: {title: "locker", gloss: "کمد", note: "locker یعنی کمد -- یک جای کوچک و قفل‌دار که بکس و رخت تان را نگه می‌دارین.", example_gloss: "بکس تان را در یک کمد بتین."}
  en.a1.unit55.lesson01.teach.swim_cap: {title: "swim cap", gloss: "کلاه شنا", note: "swim cap یعنی کلاه شنا -- یک کلاه تنگ که وخت شنا کردن به سر تان می‌ذارین.", example_gloss: "لطفاً توی حوض یک کلاه شنا به سر کنین."}
  en.a1.unit55.lesson01.teach.rules: {title: "rules", gloss: "قوانین", note: "rules یعنی قوانین -- دستورهایی که همه توی حوض باید پیروی کنن.", example_gloss: "پیش از شنا کردن، قوانین حوض را بخوانین."}
  en.a1.unit55.lesson01.teach.lifeguard: {title: "lifeguard", gloss: "نجات‌غریق", note: "lifeguard یعنی نجات‌غریق -- کسی که مراقب شناگرها استه تا در امان بمانن.", example_gloss: "نجات‌غریق هر روز مراقب حوض استه."}

  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket: {title: "I'd like to buy a ticket, please.", gloss: "می‌خواهم یک تکت بخرم، لطفاً.", note: "I'd like to ... طریقهٔ مؤدبانهٔ I want to استه."}
  en.a1.unit55.lesson02.teach.where_are_the_lockers: {title: "Where are the lockers?", gloss: "کمدها کجا استن؟", note: "Where are ...؟ ساختار سوالی جمع استه -- lockers جمع می‌باشه."}
  en.a1.unit55.lesson02.teach.what_time_do_you_open: {title: "What time do you open?", gloss: "ساعت چند باز می‌کنین؟", note: "همو ساختار What time که در واحدهای پیش دیدین."}
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket: {title: "It's five dollars for one ticket.", gloss: "برای یک تکت پنج دالر می‌شه.", note: "for one ticket یعنی «برای یک تکت»."}
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap: {title: "Do I need a swim cap?", gloss: "به یک کلاه شنا ضرورت دارم؟", note: "همو ساختار Do I need که در واحدهای پیش دیدین."}
  en.a1.unit55.lesson02.teach.we_close_at_eight: {title: "We close at eight o'clock.", gloss: "ساعت هشت بسته می‌کنیم.", note: "at + ساعت یعنی «ساعت ___»."}

  en.a1.unit55.lesson03.teach.dialogue_line1: {title: "سوال نجات‌غریق", gloss: "سلام! امروز برای شنا آمدین؟", note: "Are you here to swim؟ یک ساختار ثابت انگلیسی استه -- here + to + فعل برای پرسیدن دلیل حضور کسی کار می‌ره. دری همو معنا را با «برای چه آمدین؟» می‌رساند."}
  en.a1.unit55.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "بلی، دو تکت، لطفاً.", note: "two tickets یعنی دو تکت -- شکل جمع کلمهٔ ticket."}
  en.a1.unit55.lesson03.teach.dialogue_line3: {title: "جواب نجات‌غریق", gloss: "بلی! برای یک تکت پنج دالر می‌شه.", note: "همو جملهٔ It's five dollars for one ticket که در لسن ۲ یاد گرفتین."}
  en.a1.unit55.lesson03.teach.dialogue_line4: {title: "سوال میا", gloss: "به کلاه شنا ضرورت داریم؟", note: "we اینجه یعنی «ما» -- دنیل و میا هردو را شامل می‌شه."}
  en.a1.unit55.lesson03.teach.dialogue_line5: {title: "جواب نجات‌غریق", gloss: "بلی، کلاه شنا توی حوض لازمی استه.", note: "are required یعنی لازمی استه -- انگلیسی از فعل require یک صفت مجهول می‌سازه، دری از یک عبارت جداگانه (لازمی استه) کار می‌گیره."}
  en.a1.unit55.lesson03.teach.dialogue_line6: {title: "سوال دنیل", gloss: "کمدها کجا استن؟", note: "همو سوال Where are که در لسن ۲ یاد گرفتین."}
  en.a1.unit55.lesson03.teach.dialogue_line7: {title: "جواب نجات‌غریق", gloss: "کمدها نزدیک دروازهٔ ورودی استن.", note: "near the entrance یعنی نزدیک دروازهٔ ورودی."}
  en.a1.unit55.lesson03.teach.dialogue_line8: {title: "خبر نجات‌غریق", gloss: "یک سکهٔ یک‌دالری لازم دارن.", note: "They اینجه یعنی «کمدها». a dollar coin یعنی یک سکهٔ یک‌دالری."}
  en.a1.unit55.lesson03.teach.dialogue_line9: {title: "سوال میا", gloss: "ساعت چند بسته می‌کنین؟", note: "همو سوال What time do you close؟ که در لسن ۲ یاد گرفتین."}
  en.a1.unit55.lesson03.teach.dialogue_line10: {title: "جواب نجات‌غریق", gloss: "ساعت هشت بسته می‌کنیم.", note: "همو جملهٔ We close at eight o'clock که در لسن ۲ یاد گرفتین."}

  en.a1.unit55.lesson04.teach.reading_passage: {title: "متن: یک سفر به حوض شنا", gloss: "یک سفر به حوض شنا: یک بعد از ظهر گرم در ماه جولای، دنیل و میا تصمیم گرفتن که در حوض شنای عمومی خنک شن. نزدیک دروازهٔ ورودی، یک تابلو قوانین حوض را نشان می‌داد: دویدن ممنوع، و کلاه شنا توی حوض لازمی استه. آن‌ها از نجات‌غریق دو تکت خواستن. برای یک تکت پنج دالر می‌شد. نجات‌غریق توضیح داد که کمدها نزدیک دروازهٔ ورودی استن و یک سکهٔ یک‌دالری لازم دارن. دنیل و میا بکس‌های شان را در یک کمد گذاشتن و تقریباً دو ساعت شنا کردن. پیش از رفتن، آن‌ها دوباره تابلو را چک کردن: حوض ساعت هشت بسته می‌شه. میا گفت که می‌خواد آخر هفتهٔ بعد دوباره بیایه و تختهٔ شیرجه را امتحان کنه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- decided, asked, explained, put, swam, checked, said."}

