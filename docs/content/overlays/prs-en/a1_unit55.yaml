    feedback: "swimming pool=حوض شنا، ticket=تکت، locker=کمد، swim cap=کلاه شنا، rules=قوانین، lifeguard=نجات‌غریق."
  en.a1.unit55.lesson01.exercise04.order_lifeguard_sentence:
