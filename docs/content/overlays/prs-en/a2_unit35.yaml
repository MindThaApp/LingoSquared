course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit35.prescription: {title: "گرفتن دوا از دواخانه"}

lessons:
  en.a2.unit35.lesson01.pharmacy_vocabulary: {title: "گولی، اندازهٔ دوا، و عوارض جانبی"}
  en.a2.unit35.lesson02.asking_at_the_counter: {title: "پرسیدن دربارهٔ اندازهٔ دوا و عوارض جانبی"}
  en.a2.unit35.lesson03.reading_a_pharmacy_label: {title: "خواندن لیبل دواخانه"}
  en.a2.unit35.lesson04.pharmacy_dialogue: {title: "پیش کاونتر دواخانه"}

teaching:
  en.a2.unit35.lesson01.teach.pharmacy: {title: "pharmacy", gloss: "دواخانه", note: "*pharmacy* یعنی دکانی که دوا می‌فروشه.", example_gloss: "پهلوی کلینیک داکتر یک دواخانه استه."}
  en.a2.unit35.lesson01.teach.pharmacist: {title: "pharmacist", gloss: "دواساز", note: "*pharmacist* یعنی کسی که در دواخانه دوای‌تان را می‌ته.", example_gloss: "دواساز شرح داد که دوا را چطور بخورم."}
  en.a2.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "گولی", note: "*tablet* یعنی یک دانه گولی که می‌بلعین.", example_gloss: "صبح یک گولی می‌خورم و شام یک گولی دیگه."}
  en.a2.unit35.lesson01.teach.dose: {title: "dose", gloss: "اندازهٔ دوا", note: "*dose* یعنی هر بار چقدر دوا می‌خورین.", example_gloss: "اندازهٔ دوا روزی دو بار، هر بار یک گولی استه."}
  en.a2.unit35.lesson01.teach.refill: {title: "refill", gloss: "گرفتن دوبارهٔ همو دوا", note: "*refill* یعنی همو دوا را دوباره از دواخانه بگیرین، بدون رفتن دوباره نزد داکتر.", example_gloss: "دوا را دوباره کار دارم، چون گولی‌هایم تقریباً خلاص شده."}
  en.a2.unit35.lesson01.teach.side_effects: {title: "side effects", gloss: "عوارض جانبی", note: "*side effects* یعنی تأثیرهای دیگهٔ یک دوا بالای بدن‌تان.", example_gloss: "دواساز دربارهٔ عوارض جانبی همی دوا برایم گفت."}
  en.a2.unit35.lesson01.teach.grammar_frequency: {title: "گفتن اینکه چند بار دوا می‌خورین", gloss: "روزی یک بار، روزی دو بار، روزی سه بار، هر هشت ساعت", note: "*once a day* یعنی روزی یک بار، *twice a day* یعنی روزی دو بار، *three times a day* یعنی روزی سه بار، *every eight hours* یعنی هر هشت ساعت."}

  en.a2.unit35.lesson02.teach.pick_up_prescription: {title: "گفتن اینکه برای چی آمدین", gloss: "می‌خواستم دوای نسخه‌ام را بگیرم.", note: "*I'd like to...* یک شکل مؤدبانه برای گفتن خواست‌تان استه، همرنگ واحد ۲۹."}
  en.a2.unit35.lesson02.teach.take_one_tablet: {title: "اندازهٔ دوا که برای‌تان می‌گن", gloss: "روزی دو بار، هر بار یک گولی، همرای غذا بخورین.", note: "*with food* یعنی همرای غذا، نی با شکم خالی."}
  en.a2.unit35.lesson02.teach.ask_how_many_days: {title: "پرسیدن اینکه چند روز", gloss: "چند روز باید بخورمش؟", note: "*How many...?* را برای چیزهایی که شمرده می‌شن، مثل روزها، استعمال می‌کنین."}
  en.a2.unit35.lesson02.teach.ask_side_effects: {title: "پرسیدن دربارهٔ عوارض جانبی", gloss: "عوارض جانبی داره؟", note: "*Are there any...?* شکل معمول پرسیدن اینکه چیزی وجود داره یا نی استه."}
  en.a2.unit35.lesson02.teach.grammar_should: {title: "should و shouldn't برای هدایت", gloss: "باید همرای غذا بخورینش. نباید پیش از وقت بس کنین.", note: "*should* یک هدایت یا مشوره می‌ته؛ *shouldn't* شکل منفی همو استه."}

  en.a2.unit35.lesson03.teach.before_bed: {title: "before bed", gloss: "پیش از خواب", note: "*before bed* یعنی پیش از اینکه بخوابین.", example_gloss: "بعضی دواها اگر پیش از خواب خورده شن بهتر کار می‌کنن."}
  en.a2.unit35.lesson03.teach.label_text: {title: "متن لیبل دواخانه", gloss: "دوای ریزش. روزی دو بار، هر بار یک گولی همرای غذا، برای پنج روز بخورین. پیش از وقت گولی‌ها را بس نکنین. عوارض جانبی احتمالی: ممکن مانده احساس کنین. گرفتن دوبارهٔ دوا: یک بار.", note: "یک لیبل واقعی دواخانه کوتاه و امری استه -- جمله‌های کوتاه، بدون شکل‌های مؤدبانه."}
  en.a2.unit35.lesson03.teach.do_not_stop_early: {title: "هشدار لیبل", gloss: "پیش از وقت گولی‌ها را بس نکنین.", note: "*Do not...* شکل امری منفی استه که بالای لیبل‌ها و لوحه‌ها می‌بینین."}

  en.a2.unit35.lesson04.teach.q_pick_up: {title: "دانیل خود را معرفی می‌کنه", gloss: "دانیل می‌گه: سلام، می‌خواستم دوای نسخه‌ام را بگیرم.", note: "*Hi* غیررسمی‌تر از *Hello* استه، اما پیش کاونتر خیلی معمول استه."}
  en.a2.unit35.lesson04.teach.a_what_is_your_name: {title: "دواساز نامش را می‌پرسه", gloss: "دواساز می‌گه: البته. نام‌تان چیست؟", note: "*Of course* اینجه یعنی البته، مشکلی نیست."}
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine: {title: "دانیل می‌گه دوا برای چیست", gloss: "دانیل می‌گه: دانیل. داکتر برای یک ریزش سخت دوا داده.", note: "همو ریزشی که در واحد ۲۸ داکتر تشخیص داده بود."}
  en.a2.unit35.lesson04.teach.a_here_it_is: {title: "دواساز اندازهٔ دوا را می‌ته", gloss: "دواساز می‌گه: ایگه استه. روزی دو بار، هر بار یک گولی، همرای غذا بخورین.", note: "*Here it is* را وخت دادن یک چیز به کسی می‌گین."}
  en.a2.unit35.lesson04.teach.q_how_many_days: {title: "دانیل می‌پرسه چند روز", gloss: "دانیل می‌پرسه: چند روز باید بخورمش؟", note: "همو سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping: {title: "جواب دواساز", gloss: "دواساز می‌گه: برای پنج روز. پیش از وقت گولی‌ها را بس نکنین.", note: "همو هدایتی که بالای لیبل در درس سوم بود."}
  en.a2.unit35.lesson04.teach.q_any_side_effects: {title: "دانیل دربارهٔ عوارض جانبی می‌پرسه", gloss: "دانیل می‌پرسه: عوارض جانبی داره؟", note: "همو سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired: {title: "دواساز عارضه را می‌گه", gloss: "دواساز می‌گه: ممکن مانده احساس کنین، اما همی‌قدر.", note: "*but that's all* اینجه یعنی و دیگه چیزی نی."}
  en.a2.unit35.lesson04.teach.q_thank_you: {title: "دانیل تشکر می‌کنه", gloss: "دانیل می‌گه: بسیار تشکر.", note: "*very much* تشکر را کمی پُررنگ‌تر می‌سازه."}

exercises:
  en.a2.unit35.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "pharmacist"
    distractors: ["dose", "tablet", "refill"]
    accepted_answers: [{value: "pharmacist", status: "correct"}]
    feedback: "*pharmacist* یعنی دواساز."
  en.a2.unit35.lesson01.exercise02.choose_dose_word:
    instruction: "کدام کلمه یعنی هر بار چقدر دوا می‌خورین؟"
    correct_option: "dose"
    distractors: ["refill", "tablet", "pharmacy"]
    accepted_answers: [{value: "dose", status: "correct"}]
    feedback: "*dose* یعنی اندازهٔ دوا."
  en.a2.unit35.lesson01.exercise03.choose_side_effects_phrase:
    instruction: "کدام عبارت یعنی تأثیرهای دیگهٔ یک دوا بالای بدن‌تان؟"
    correct_option: "side effects"
    distractors: ["dose", "refill", "prescription"]
    accepted_answers: [{value: "side effects", status: "correct"}]
    feedback: "*side effects* یعنی عوارض جانبی."
  en.a2.unit35.lesson01.exercise04.match_pharmacy_words:
    instruction: "هر معنی را به کلمه یا عبارت درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "the shop where you get medicine", right: "pharmacy"}
          - {left: "the person who gives you your medicine", right: "pharmacist"}
          - {left: "one small round piece of medicine", right: "tablet"}
          - {left: "how much medicine you take each time", right: "dose"}
          - {left: "a new supply of the same medicine", right: "refill"}
          - {left: "the extra things a medicine can do to you", right: "side effects"}
          - {left: "what a doctor tells you to take when you are ill", right: "medicine"}
          - {left: "the doctor's written order for your medicine", right: "prescription"}
        status: "correct"
    feedback: "*pharmacy*=دواخانه، *pharmacist*=دواساز، *tablet*=گولی، *dose*=اندازهٔ دوا، *refill*=گرفتن دوبارهٔ دوا، *side effects*=عوارض جانبی، *medicine*=دوا، *prescription*=نسخهٔ داکتر."
  en.a2.unit35.lesson01.exercise05.write_pharmacist:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که در دواخانه دوای‌تان را می‌ته."
    accepted_answers:
      - {value: "pharmacist", status: "correct"}
      - {value: "Pharmacist", status: "correct"}
    feedback: "*pharmacist* یعنی دواساز."

  en.a2.unit35.lesson02.exercise01.listen_request:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "I'd like to pick up a prescription"
    distractors: ["Are there any side effects?", "How many days should I take it?", "Take one tablet twice a day with food."]
    accepted_answers: [{value: "I'd like to pick up a prescription", status: "correct"}]
    feedback: "همی یعنی: می‌خواستم دوای نسخه‌ام را بگیرم."
  en.a2.unit35.lesson02.exercise02.choose_counter_request:
    instruction: "همرای نسخهٔ داکتر پیش کاونتر دواخانه استین. اول چی می‌گین؟"
    correct_option: "I'd like to pick up a prescription."
    distractors: ["Are there any side effects?", "How many days should I take it?", "Take one tablet twice a day with food."]
    accepted_answers: [{value: "I'd like to pick up a prescription.", status: "correct"}]
    feedback: "*I'd like to...* شکل مؤدبانهٔ گفتن اینکه برای چی آمدین استه."
  en.a2.unit35.lesson02.exercise03.choose_ask_side_effects:
    instruction: "می‌خواین بدانین دوا دیگه چی تأثیری بالای‌تان داره. چی می‌پرسین؟"
    correct_option: "Are there any side effects?"
    distractors: ["How many days should I take it?", "I'd like to pick up a prescription.", "Take one tablet twice a day with food."]
    accepted_answers: [{value: "Are there any side effects?", status: "correct"}]
    feedback: "*Are there any side effects?* یعنی عوارض جانبی داره؟"
  en.a2.unit35.lesson02.exercise04.order_take_one_tablet:
    instruction: "کلمات را طوری تنظیم کنین که «روزی دو بار، هر بار یک گولی، همرای غذا بخورین» شه."
    accepted_answers: [{value: ["Take", "one", "tablet", "twice", "a", "day", "with", "food"], status: "correct"}]
    feedback: "ترتیب درست *Take one tablet twice a day with food* استه."
  en.a2.unit35.lesson02.exercise05.order_how_many_days:
    instruction: "کلمات را طوری تنظیم کنین که «چند روز باید بخورمش؟» شه."
    accepted_answers: [{value: ["How", "many", "days", "should", "I", "take", "it"], status: "correct"}]
    feedback: "ترتیب درست *How many days should I take it* استه."
  en.a2.unit35.lesson02.exercise06.reply_ask_side_effects:
    instruction: "دواساز همین حالی اندازهٔ دوا را شرح داد. حالی بپرسین که عوارض جانبی داره یا نی."
    accepted_answers:
      - {value: "Are there any side effects?", status: "correct"}
      - {value: "Are there any side effects", status: "correct"}
    feedback: "*Are there any side effects?* همو سوالی استه که در همی درس یاد گرفتین."
  en.a2.unit35.lesson02.exercise07.write_counter_request:
    instruction: "بنویسین که می‌خواین دوای نسخه‌تان را بگیرین."
    accepted_answers:
      - {value: "I'd like to pick up a prescription.", status: "correct"}
      - {value: "I'd like to pick up a prescription", status: "correct"}
    feedback: "*I'd like to pick up a prescription* یعنی می‌خواستم دوای نسخه‌ام را بگیرم."

  en.a2.unit35.lesson03.exercise01.read_how_to_take:
    instruction: "مطابق لیبل، همی دوا را چطور باید بخورین؟"
    correct_option: "one tablet twice a day with food"
    distractors: ["one tablet before bed", "two tablets three times a day", "one tablet every eight hours"]
    accepted_answers: [{value: "one tablet twice a day with food", status: "correct"}]
    feedback: "بالای لیبل نوشته *one tablet twice a day with food*."
  en.a2.unit35.lesson03.exercise02.read_how_long:
    instruction: "چند وقت باید دوا را ادامه بتین؟"
    correct_option: "for five days"
    distractors: ["for three days", "for one week", "for ten days"]
    accepted_answers: [{value: "for five days", status: "correct"}]
    feedback: "بالای لیبل نوشته *for five days*."
  en.a2.unit35.lesson03.exercise03.read_side_effect:
    instruction: "لیبل کدام عارضهٔ جانبی را نام می‌گیره؟"
    correct_option: "you may feel tired"
    distractors: ["you may feel cold", "you may feel hungry", "you may need a refill"]
    accepted_answers: [{value: "you may feel tired", status: "correct"}]
    feedback: "بالای لیبل نوشته *you may feel tired*."
  en.a2.unit35.lesson03.exercise04.choose_refill_count:
    instruction: "مطابق لیبل، چند بار می‌تانین همی دوا را دوباره بگیرین؟"
    correct_option: "one refill"
    distractors: ["two refills", "three refills", "no refills"]
    accepted_answers: [{value: "one refill", status: "correct"}]
    feedback: "در پایان لیبل نوشته *Refills: one*، یعنی یک بار."
  en.a2.unit35.lesson03.exercise05.order_do_not_stop:
    instruction: "کلمات را طوری تنظیم کنین که «پیش از وقت گولی‌ها را بس نکنین» شه."
    accepted_answers: [{value: ["Do", "not", "stop", "taking", "the", "tablets", "early"], status: "correct"}]
    feedback: "ترتیب درست *Do not stop taking the tablets early* استه."
  en.a2.unit35.lesson03.exercise06.write_do_not_stop:
    instruction: "هشدار لیبل را بنویسین، که با Do not شروع می‌شه."
    accepted_answers:
      - {value: "Do not stop taking the tablets early.", status: "correct"}
      - {value: "Do not stop taking the tablets early", status: "correct"}
    feedback: "*Do not stop taking the tablets early* یعنی پیش از وقت گولی‌ها را بس نکنین."

  en.a2.unit35.lesson04.exercise01.listen_dose:
    instruction: "گفتگو را گوش کنین و اندازهٔ دوایی را که دواساز می‌ته انتخاب کنین."
    correct_option: "one tablet twice a day with food"
    distractors: ["one tablet before bed", "two tablets twice a day", "one tablet three times a day"]
    accepted_answers: [{value: "one tablet twice a day with food", status: "correct"}]
    feedback: "دواساز می‌گه *one tablet twice a day with food*."
  en.a2.unit35.lesson04.exercise02.listen_side_effect:
    instruction: "گوش کنین و انتخاب کنین که دواساز دربارهٔ عارضهٔ جانبی چی می‌گه."
    correct_option: "You may feel tired"
    distractors: ["You may feel cold", "You may need a refill", "You should come back tomorrow"]
    accepted_answers: [{value: "You may feel tired", status: "correct"}]
    feedback: "دواساز می‌گه *You may feel tired*."
  en.a2.unit35.lesson04.exercise03.choose_how_long:
    instruction: "دانیل چند روز باید دوا را بخوره؟"
    correct_option: "for five days"
    distractors: ["for three days", "for one week", "for ten days"]
    accepted_answers: [{value: "for five days", status: "correct"}]
    feedback: "دواساز می‌گه *For five days*."
  en.a2.unit35.lesson04.exercise04.order_any_side_effects:
    instruction: "کلمات را طوری تنظیم کنین که «عوارض جانبی داره؟» شه."
    accepted_answers: [{value: ["Are", "there", "any", "side", "effects"], status: "correct"}]
    feedback: "ترتیب درست *Are there any side effects* استه."
  en.a2.unit35.lesson04.exercise05.reply_how_many_days:
    instruction: "دواساز گولی‌ها و اندازهٔ دوا را برای‌تان می‌ته. حالی بپرسین که چند روز باید بخورینش."
    accepted_answers:
      - {value: "How many days should I take it?", status: "correct"}
      - {value: "How many days should I take it", status: "correct"}
    feedback: "*How many days should I take it?* همو سوالی استه که در درس دوم یاد گرفتین."
  en.a2.unit35.lesson04.exercise06.speak_pharmacy_dialogue:
    instruction: "به نقش دانیل پیش کاونتر گپ بزنین: بگین برای چی آمدین، بپرسین چند روز باید بخورینش، و دربارهٔ عوارض جانبی بپرسین."
    accepted_answers:
      - {value: "I'd like to pick up a prescription. How many days should I take it? Are there any side effects?", status: "correct"}
    feedback: "همی جواب هر سه بخش گفتگو را پوشش می‌ته: دلیل آمدن، مدت، و عوارض جانبی."
