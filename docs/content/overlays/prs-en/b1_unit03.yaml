teaching:
  en.b1.unit03.lesson01.teach.if: {title: "if", gloss: "اگه", note: "*if* یک شرط را معرفی می‌کنه.", example_gloss: "اگه باران بباره، خانه می‌مانیم."}
  en.b1.unit03.lesson01.teach.rain: {title: "rain", gloss: "باران", note: "*rain* یعنی آبی که از آسمان می‌باره.", example_gloss: "شاید همی آخر هفته باران بباره."}
  en.b1.unit03.lesson01.teach.stay_home: {title: "stay home", gloss: "خانه ماندن", note: "*stay home* یعنی از خانه بیرون نروی و همانجا بمانی.", example_gloss: "اگه باران ببارد، خانه می‌مانیم."}
  en.b1.unit03.lesson01.teach.weekend: {title: "weekend", gloss: "آخر هفته", note: "*weekend* یعنی روزهای شنبه و یک‌شنبه.", example_gloss: "برنامهٔ آخر هفته‌تان چیست؟"}
  en.b1.unit03.lesson01.teach.free_time: {title: "free time", gloss: "وقت آزاد", note: "*free time* یعنی وقتی که مصروف کار نیستین.", example_gloss: "همی روزها وقت آزاد زیاد ندارم."}
  en.b1.unit03.lesson01.teach.paint: {title: "paint", gloss: "رنگ‌آمیزی کدن، نقاشی کدن", note: "*paint* یعنی با رنگ یک تصویر ساختن.", example_gloss: "لیلا در آخر هفته‌ها نقاشی می‌کنه."}

  en.b1.unit03.lesson02.teach.if_rains_stay_home: {title: "If it rains tomorrow, we will stay home.", gloss: "اگه فردا باران ببارد، خانه می‌مانیم.", note: "*if + present, will + verb* یعنی یک شرط واقعی برای آینده."}
  en.b1.unit03.lesson02.teach.if_have_free_time_paint: {title: "If I have free time this weekend, I will paint.", gloss: "اگه همی آخر هفته وقت آزاد داشته باشم، نقاشی می‌کنم.", note: "همو ساختار شرط واقعی برای آینده."}
  en.b1.unit03.lesson02.teach.grammar_real_condition: {title: "If it rains, we will stay home. If I have time, I will paint.", gloss: "اگه باران ببارد، خانه می‌مانیم. اگه وقت داشته باشم، نقاشی می‌کنم.", note: "همی دو جمله ساختار شرط واقعی را نشان می‌ته -- چیزی که واقعاً امکان داره اتفاق بیفته."}

  en.b1.unit03.lesson03.teach.would: {title: "would", gloss: "می‌کدم (شرطی، غیرواقعی)", note: "*would* برای شرط‌های غیرواقعی یا فرضی زمان حال استعمال می‌شه.", example_gloss: "اگه وقت بیشتر می‌داشتم، هر روز نقاشی می‌کدم."}
  en.b1.unit03.lesson03.teach.class: {title: "class", gloss: "صنف، کلاس درسی", note: "*class* یعنی یک درس سازمان‌یافته با یک استاد.", example_gloss: "یک صنف نقاشی نزدیک خانه‌اش بود."}
  en.b1.unit03.lesson03.teach.reading_passage: {title: "متن دربارهٔ لیلا و صنف نقاشی", gloss: "لیلا نقاشی را دوست داره، اما وقت آزاد زیاد نداره. اگه وقت آزاد بیشتر می‌داشت، هر روز نقاشی می‌کد. ماه پیش، یک صنف نقاشی نزدیک خانه‌اش بود. اگه زودتر ازش خبر می‌داشت، ثبت‌نام می‌کد. حالا هر هفته صنف‌های نو را چک می‌کنه.", note: "همی یک متن واقعی است که پشیمانی غیرواقعی گذشته را نشان می‌ته -- سویهٔ B1."}

  en.b1.unit03.lesson04.teach.q_weekend_plans: {title: "پرسش دانیال دربارهٔ آخر هفته", gloss: "دانیال می‌گه: برنامهٔ آخر هفته‌ات چیست؟", note: "*What are your plans for...?* یک سوال معمولی دربارهٔ برنامه‌هاست."}
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home: {title: "جواب لیلا", gloss: "لیلا می‌گه: اگه باران نباره، برای پیاده‌روی می‌رم. اگه باران ببارد، خانه می‌مانم و نقاشی می‌کنم.", note: "همی جمله دو شرط واقعی مختلف را نشان می‌ته."}
  en.b1.unit03.lesson04.teach.q_take_class: {title: "پرسش دانیال", gloss: "دانیال می‌گه: خوب شد. ماه پیش همو صنف نقاشی را رفتی؟", note: "*Did you take...?* یک سوال دربارهٔ گذشته است."}
  en.b1.unit03.lesson04.teach.a_would_have_signed_up: {title: "جواب لیلا", gloss: "لیلا می‌گه: نی، نرفتم. اگه زودتر ازش خبر می‌داشتم، ثبت‌نام می‌کدم.", note: "*if + had known, would have signed up* یک پشیمانی غیرواقعی از گذشته است."}
  en.b1.unit03.lesson04.teach.q_should_join: {title: "پیشنهاد دانیال", gloss: "دانیال می‌گه: بدشانسی بود. اگه یکی دیگه باشه، خوبه ثبت‌نام کنی.", note: "*should join* یک پیشنهاد است."}
  en.b1.unit03.lesson04.teach.a_will_sign_up: {title: "جواب لیلا", gloss: "لیلا می‌گه: راست می‌گی. اگه یکی را ببینم، فوراً ثبت‌نام می‌کنم.", note: "همی جمله یک شرط واقعی برای آینده است."}

