course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای قصه کدن رویدادهای پیچیده با زمان‌های گذشته، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit04.narrative_time: {title: "تا وقتی مه رسیدم"}

lessons:
  en.b2.unit04.lesson01.timeline_roles: {title: "پس‌زمینه، رویداد اصلی، و اتفاق قبلی"}
  en.b2.unit04.lesson02.shifting_time: {title: "وقتی چک می‌کدم، برق رفت"}
  en.b2.unit04.lesson03.reading_an_incident_account: {title: "متن خوانی: مشکل محل برنامه"}
  en.b2.unit04.lesson04.the_narrative_dialogue: {title: "قدم به قدم بگو چی شد"}

teaching:
  en.b2.unit04.lesson01.teach.background: {title: "background", gloss: "پس‌زمینه، چیزی که از قبل جریان داشت", note: "*background* در قصه یعنی حالت یا کاری که دور رویداد اصلی جریان داشت. در انگلیسی این را زیاد با past continuous می‌سازیم.", example_gloss: "معلومات پس‌زمینه می‌گه از قبل چی جریان داشت."}
  en.b2.unit04.lesson01.teach.foreground: {title: "foreground", gloss: "رویداد اصلی که قصه به طرفش می‌ره", note: "*foreground* کار یا اتفاقی استه که قصه را پیش می‌بره. این معمولاً با simple past می‌آیه.", example_gloss: "رویداد اصلی همان اتفاق مهم در قصه استه."}
  en.b2.unit04.lesson01.teach.prior: {title: "prior", gloss: "قبلی، پیش از یک لحظهٔ گذشته", note: "*prior* یعنی یک اتفاق پیش از یک اتفاق گذشتهٔ دیگر رخ داده. در انگلیسی B2 این فرق را با past perfect واضح می‌کنین.", example_gloss: "یک رویداد قبلی پیش از یک رویداد گذشتهٔ دیگر رخ داده بود."}
  en.b2.unit04.lesson01.teach.interrupt: {title: "interrupt", gloss: "قطع کدن یک کار در جریان", note: "*interrupt* یعنی یک اتفاق کوتاه وسط یک کارِ در جریان رخ می‌ته و آن را قطع می‌کنه. مثل وقتی برق رفت در حالی که کسی سیستم صدا را چک می‌کد.", example_gloss: "یک مشکل ناگهانی می‌تانه یک کار در جریان را قطع کنه."}
  en.b2.unit04.lesson01.teach.ongoing: {title: "ongoing", gloss: "در جریان، ادامه‌دار", note: "*ongoing* یعنی کاری که برای یک مدت ادامه داشت، نه یک لحظهٔ کوتاه.", example_gloss: "یک کار در جریان برای مدتی ادامه می‌کنه."}
  en.b2.unit04.lesson01.teach.chronology: {title: "chronology", gloss: "ترتیب واقعی اتفاق‌ها", note: "*chronology* یعنی اتفاق‌ها واقعاً به کدام ترتیب رخ دادن. قصه شاید از اول تا آخر گفته نشه، اما ترتیب واقعی باید روشن باشه.", example_gloss: "ترتیب واقعی اتفاق‌ها chronology استه."}

  en.b2.unit04.lesson02.teach.by_the_time: {title: "By the time I arrived, the coordinator had already moved the equipment inside.", gloss: "تا وقتی مه رسیدم، هماهنگ‌کننده وسایل را از پیش داخل انتقال داده بود.", note: "*had already moved* نشان می‌ته انتقال وسایل پیش از رسیدن گوینده تمام شده بود. در دری شاید با «از پیش» کافی باشه، اما در انگلیسی فعل هم باید past perfect باشه.", media_asset_key: "en.b2.audio.narrative_time.sentence.01"}
  en.b2.unit04.lesson02.teach.while_checking: {title: "While I was checking the sound system, the power went out.", gloss: "وقتی مه سیستم صدا را چک می‌کدم، برق رفت.", note: "*was checking* کار در جریان استه؛ *went out* اتفاق کوتاه و قطع‌کننده استه."}
  en.b2.unit04.lesson02.teach.when_arrived_setting: {title: "When I arrived, the volunteers were setting up the chairs.", gloss: "وقتی مه رسیدم، داوطلب‌ها چوکی‌ها را چیده روان بودن.", note: "*were setting up* پس‌زمینه می‌سازه: کار از قبل جریان داشت."}
  en.b2.unit04.lesson02.teach.grammar_shifted_time: {title: "سه کار زمان گذشته", gloss: "در قصهٔ انگلیسی، past continuous برای کاری استه که جریان داشت، simple past برای اتفاق اصلی، و past perfect برای اتفاقی که پیش از یک لحظهٔ گذشته تمام شده بود. در دری یک جملهٔ طبیعی شاید همه را با گذشته بگه؛ در انگلیسی B2 باید فرق زمان‌ها را واضح بسازین.", note: "از روی معنی انتخاب کنین: در جریان بود؟ اتفاق افتاد؟ پیش از آن تمام شده بود؟"}

  en.b2.unit04.lesson03.teach.venue: {title: "venue", gloss: "محل برگزاری برنامه", note: "*venue* جای یک برنامه، جلسه، یا محفل استه.", example_gloss: "محل برگزاری همان جایی استه که برنامه رخ می‌ته."}
  en.b2.unit04.lesson03.teach.delayed: {title: "delayed", gloss: "به تاخیر افتاده", note: "*delayed* یعنی چیزی دیرتر از وقت پلان‌شده شروع یا انجام شد.", example_gloss: "برنامه بیست دقیقه به تاخیر افتاد."}
  en.b2.unit04.lesson03.teach.reading_passage: {title: "متن دربارهٔ مشکل محل برنامه", gloss: "سایمن قصه را دقیقاً به ترتیب زمانی نگفت. پیش از این‌که او به محل برنامه برسه، هماهنگ‌کننده وسایل را داخل انتقال داده بود، چون انتظار باران بود. وقتی سایمن رسید، داوطلب‌ها چوکی‌ها را چیده روان بودن. وقتی او سیستم صدا را چک می‌کد، برق رفت. او به مدیر ساختمان زنگ زد، و مدیر گفت یک تیم ترمیماتی همان صبح، پیش‌تر نزدیک آن‌جا مصروف کار بود. تیم شروع برنامه را بیست دقیقه به تاخیر انداخت، اما تا وقتی مهمان‌ها داخل شدن، چراغ‌ها دوباره روشن شده بودن.", note: "past perfect را برای چیزی ببینین که پیش از یک لحظهٔ گذشته تمام شده بود."}

  en.b2.unit04.lesson04.teach.q_walk_me_through: {title: "سوال هارپر", gloss: "هارپر می‌پرسه: می‌تانی قدم به قدم بگی در محل برنامه چی شد؟", note: "*walk me through* یعنی با ترتیب و جزئیات توضیح بته، نه این‌که واقعاً راه بروه.", media_asset_key: "en.b2.audio.dialogue.narrative_time.01"}
  en.b2.unit04.lesson04.teach.a_arrived_volunteers: {title: "شروع قصهٔ سایمن", gloss: "سایمن می‌گه: البته. وقتی رسیدم، داوطلب‌ها چوکی‌ها را چیده روان بودن، اما هماهنگ‌کننده وسایل را از پیش داخل انتقال داده بود، چون انتظار باران بود.", note: "یک جمله هم پس‌زمینه داره (*were setting up*) و هم اتفاق قبلی (*had already moved*)."}
  en.b2.unit04.lesson04.teach.q_equipment_safe: {title: "بررسی هارپر", gloss: "هارپر می‌پرسه: پس وسایل پیش از رسیدن تو امن بود؟", note: "او زمان قبلی را چک می‌کنه: وسایل پیش از رسیدن سایمن داخل بود."}
  en.b2.unit04.lesson04.teach.a_power_went_out: {title: "قطع شدن کار", gloss: "سایمن می‌گه: دقیقاً. بعد، وقتی مه سیستم صدا را چک می‌کدم، برق رفت.", note: "*while* کار در جریان را نشان می‌ته و *went out* رویداد قطع‌کننده را."}
  en.b2.unit04.lesson04.teach.q_after_that: {title: "سوال بعدی", gloss: "هارپر می‌پرسه: بعد از آن چی کدی؟", note: "سوال قصه را به قدم بعدی می‌بره."}
  en.b2.unit04.lesson04.teach.a_repair_crew: {title: "دلیل احتمالی", gloss: "سایمن می‌گه: به مدیر ساختمان زنگ زدم، و او گفت یک تیم ترمیماتی همان صبح، پیش‌تر نزدیک آن‌جا مصروف کار بود.", note: "*had been working* یک کار قبلی و ادامه‌دار را نشان می‌ته."}
  en.b2.unit04.lesson04.teach.q_event: {title: "سوال دربارهٔ برنامه", gloss: "هارپر می‌پرسه: و برنامه؟", note: "سوال کوتاه استه، اما معنی‌اش نتیجهٔ برنامه استه."}
  en.b2.unit04.lesson04.teach.a_delayed_start: {title: "پایان حل‌شده", gloss: "سایمن می‌گه: شروع را بیست دقیقه به تاخیر انداختیم، اما تا وقتی مهمان‌ها داخل شدن، چراغ‌ها دوباره روشن شده بودن.", note: "*had come back on* نشان می‌ته روشن شدن چراغ‌ها پیش از داخل شدن مهمان‌ها کامل شده بود."}

