course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای قصه کدن رویدادهای پیچیده با زمان‌های گذشته، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit04.narrative_time: {title: "تا وقتی مه رسیدم"}

lessons:
  en.b2.unit04.lesson01.timeline_roles: {title: "پس‌زمینه، رویداد اصلی، و اتفاق قبلی"}
  en.b2.unit04.lesson02.shifting_time: {title: "وقتی چک می‌کدم، برق رفت"}
  en.b2.unit04.lesson03.reading_an_incident_account: {title: "متن خوانی: مشکل محل برنامه"}
  en.b2.unit04.lesson04.the_narrative_dialogue: {title: "قدم به قدم بگو چی شد"}

teaching:
  en.b2.unit04.lesson01.teach.background: {title: "background", gloss: "پس‌زمینه، چیزی که از قبل جریان داشت", note: "*background* در قصه یعنی حالت یا کاری که دور رویداد اصلی جریان داشت. در انگلیسی این را زیاد با past continuous می‌سازیم.", example_gloss: "معلومات پس‌زمینه می‌گه از قبل چی جریان داشت."}
  en.b2.unit04.lesson01.teach.foreground: {title: "foreground", gloss: "رویداد اصلی که قصه به طرفش می‌ره", note: "*foreground* کار یا اتفاقی است که قصه را پیش می‌بره. این معمولاً با simple past می‌آیه.", example_gloss: "رویداد اصلی همان اتفاق مهم در قصه استه."}
  en.b2.unit04.lesson01.teach.prior: {title: "prior", gloss: "قبلی، پیش از یک لحظهٔ گذشته", note: "*prior* یعنی یک اتفاق پیش از یک اتفاق گذشتهٔ دیگر رخ داده. در انگلیسی B2 این فرق را با past perfect واضح می‌کنین.", example_gloss: "یک رویداد قبلی پیش از یک رویداد گذشتهٔ دیگر رخ داده بود."}
  en.b2.unit04.lesson01.teach.interrupt: {title: "interrupt", gloss: "قطع کدن یک کار در جریان", note: "*interrupt* یعنی یک اتفاق کوتاه وسط یک کارِ در جریان رخ می‌ته و آن را قطع می‌کنه. مثل وقتی برق رفت در حالی که کسی سیستم صدا را چک می‌کد.", example_gloss: "یک مشکل ناگهانی می‌تانه یک کار در جریان را قطع کنه."}
  en.b2.unit04.lesson01.teach.ongoing: {title: "ongoing", gloss: "در جریان، ادامه‌دار", note: "*ongoing* یعنی کاری که برای یک مدت ادامه داشت، نه یک لحظهٔ کوتاه.", example_gloss: "یک کار در جریان برای مدتی ادامه می‌کنه."}
  en.b2.unit04.lesson01.teach.chronology: {title: "chronology", gloss: "ترتیب واقعی اتفاق‌ها", note: "*chronology* یعنی اتفاق‌ها واقعاً به کدام ترتیب رخ دادند. قصه شاید از اول تا آخر گفته نشه، اما ترتیب واقعی باید روشن باشه.", example_gloss: "ترتیب واقعی اتفاق‌ها chronology است."}

  en.b2.unit04.lesson02.teach.by_the_time: {title: "By the time I arrived, the coordinator had already moved the equipment inside.", gloss: "تا وقتی مه رسیدم، هماهنگ‌کننده وسایل را از پیش داخل انتقال داده بود.", note: "*had already moved* نشان می‌ته انتقال وسایل پیش از رسیدن گوینده تمام شده بود. در دری شاید با «از پیش» کافی باشه، اما در انگلیسی فعل هم باید past perfect باشه.", media_asset_key: "en.b2.audio.narrative_time.sentence.01"}
  en.b2.unit04.lesson02.teach.while_checking: {title: "While I was checking the sound system, the power went out.", gloss: "وقتی مه سیستم صدا را چک می‌کدم، برق رفت.", note: "*was checking* کار در جریان است؛ *went out* اتفاق کوتاه و قطع‌کننده است."}
  en.b2.unit04.lesson02.teach.when_arrived_setting: {title: "When I arrived, the volunteers were setting up the chairs.", gloss: "وقتی مه رسیدم، داوطلب‌ها چوکی‌ها را چیده روان بودند.", note: "*were setting up* پس‌زمینه می‌سازه: کار از قبل جریان داشت."}
  en.b2.unit04.lesson02.teach.grammar_shifted_time: {title: "سه کار زمان گذشته", gloss: "در قصهٔ انگلیسی، past continuous برای کاری است که جریان داشت، simple past برای اتفاق اصلی، و past perfect برای اتفاقی که پیش از یک لحظهٔ گذشته تمام شده بود. در دری یک جملهٔ طبیعی شاید همه را با گذشته بگه؛ در انگلیسی B2 باید فرق زمان‌ها را واضح بسازین.", note: "از روی معنی انتخاب کنین: در جریان بود؟ اتفاق افتاد؟ پیش از آن تمام شده بود؟"}

  en.b2.unit04.lesson03.teach.venue: {title: "venue", gloss: "محل برگزاری برنامه", note: "*venue* جای یک برنامه، جلسه، یا محفل است.", example_gloss: "محل برگزاری همان جایی است که برنامه رخ می‌ته."}
  en.b2.unit04.lesson03.teach.delayed: {title: "delayed", gloss: "به تاخیر افتاده", note: "*delayed* یعنی چیزی دیرتر از وقت پلان‌شده شروع یا انجام شد.", example_gloss: "برنامه بیست دقیقه به تاخیر افتاد."}
  en.b2.unit04.lesson03.teach.reading_passage: {title: "متن دربارهٔ مشکل محل برنامه", gloss: "سایمن قصه را دقیقاً به ترتیب زمانی نگفت. پیش از این‌که او به محل برنامه برسد، هماهنگ‌کننده وسایل را داخل انتقال داده بود، چون انتظار باران بود. وقتی سایمن رسید، داوطلب‌ها چوکی‌ها را چیده روان بودند. وقتی او سیستم صدا را چک می‌کد، برق رفت. او به مدیر ساختمان زنگ زد، و مدیر گفت یک تیم ترمیماتی همان صبح نزدیک آن‌جا کار می‌کده بود. تیم شروع برنامه را بیست دقیقه به تاخیر انداخت، اما تا وقتی مهمان‌ها داخل شدند، چراغ‌ها دوباره روشن شده بودند.", note: "past perfect را برای چیزی ببینین که پیش از یک لحظهٔ گذشته تمام شده بود."}

  en.b2.unit04.lesson04.teach.q_walk_me_through: {title: "پرسش هارپر", gloss: "هارپر می‌پرسه: می‌تانی قدم به قدم بگی در محل برنامه چی شد؟", note: "*walk me through* یعنی با ترتیب و جزئیات توضیح بته، نه این‌که واقعاً راه بروه.", media_asset_key: "en.b2.audio.dialogue.narrative_time.01"}
  en.b2.unit04.lesson04.teach.a_arrived_volunteers: {title: "شروع قصهٔ سایمن", gloss: "سایمن می‌گه: البته. وقتی رسیدم، داوطلب‌ها چوکی‌ها را چیده روان بودند، اما هماهنگ‌کننده وسایل را از پیش داخل انتقال داده بود، چون انتظار باران بود.", note: "یک جمله هم پس‌زمینه دارد (*were setting up*) و هم اتفاق قبلی (*had already moved*)."}
  en.b2.unit04.lesson04.teach.q_equipment_safe: {title: "بررسی هارپر", gloss: "هارپر می‌پرسه: پس وسایل پیش از رسیدن تو امن بود؟", note: "او زمان قبلی را چک می‌کنه: وسایل پیش از رسیدن سایمن داخل بود."}
  en.b2.unit04.lesson04.teach.a_power_went_out: {title: "قطع شدن کار", gloss: "سایمن می‌گه: دقیقاً. بعد، وقتی مه سیستم صدا را چک می‌کدم، برق رفت.", note: "*while* کار در جریان را نشان می‌ته و *went out* رویداد قطع‌کننده را."}
  en.b2.unit04.lesson04.teach.q_after_that: {title: "پرسش بعدی", gloss: "هارپر می‌پرسه: بعد از آن چی کدی؟", note: "پرسش قصه را به قدم بعدی می‌بره."}
  en.b2.unit04.lesson04.teach.a_repair_crew: {title: "دلیل احتمالی", gloss: "سایمن می‌گه: به مدیر ساختمان زنگ زدم، و او گفت یک تیم ترمیماتی همان صبح نزدیک آن‌جا کار می‌کده بود.", note: "*had been working* یک کار قبلی و ادامه‌دار را نشان می‌ته."}
  en.b2.unit04.lesson04.teach.q_event: {title: "پرسش دربارهٔ برنامه", gloss: "هارپر می‌پرسه: و برنامه؟", note: "پرسش کوتاه است، اما معنی‌اش نتیجهٔ برنامه است."}
  en.b2.unit04.lesson04.teach.a_delayed_start: {title: "پایان حل‌شده", gloss: "سایمن می‌گه: شروع را بیست دقیقه به تاخیر انداختیم، اما تا وقتی مهمان‌ها داخل شدند، چراغ‌ها دوباره روشن شده بودند.", note: "*had come back on* نشان می‌ته روشن شدن چراغ‌ها پیش از داخل شدن مهمان‌ها کامل شده بود."}

exercises:
  en.b2.unit04.lesson01.exercise01.choose_background:
    instruction: "کدام کلمه یعنی معلومات دربارهٔ چیزی که دور رویداد اصلی از قبل جریان داشت؟"
    correct_option: "background"
    distractors: ["foreground", "prior", "chronology"]
    accepted_answers: [{value: "background", status: "correct"}]
    feedback: "*background* پس‌زمینهٔ قصه است، نه رویداد اصلی."
  en.b2.unit04.lesson01.exercise02.choose_prior:
    instruction: "کدام کلمه یعنی زودتر از یک رویداد گذشتهٔ دیگر؟"
    correct_option: "prior"
    distractors: ["ongoing", "foreground", "interrupt"]
    accepted_answers: [{value: "prior", status: "correct"}]
    feedback: "*prior* یعنی قبلی؛ در انگلیسی معمولاً با past perfect وصل می‌شه."
  en.b2.unit04.lesson01.exercise03.match_timeline_terms:
    instruction: "هر کلمهٔ زمان‌بندی را به نقش درستش در قصه وصل کنین."
    accepted_answers:
      - value:
          - {left: "what was already happening", right: "background"}
          - {left: "the main event the story moves toward", right: "foreground"}
          - {left: "earlier than another past event", right: "prior"}
          - {left: "stop or break into an ongoing action", right: "interrupt"}
          - {left: "continuing for some time", right: "ongoing"}
          - {left: "the real order of events", right: "chronology"}
        status: "correct"
    feedback: "این نقش‌ها را جدا نگه کنین؛ در انگلیسی شکل فعل هم از همین نقش‌ها اثر می‌گیره."
  en.b2.unit04.lesson01.exercise04.write_chronology:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی ترتیب واقعی اتفاق‌ها."
    accepted_answers:
      - {value: "chronology", status: "correct"}
      - {value: "Chronology", status: "correct"}
    feedback: "*chronology* ترتیب واقعی رویدادها است."
  en.b2.unit04.lesson01.exercise05.write_foreground:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی رویداد اصلی که قصه به طرفش می‌ره."
    accepted_answers:
      - {value: "foreground", status: "correct"}
      - {value: "Foreground", status: "correct"}
    feedback: "*foreground* اتفاق اصلی را برجسته می‌سازه."

  en.b2.unit04.lesson02.exercise01.choose_past_perfect:
    instruction: "کدام عبارت نشان می‌ته یک اتفاق پیش از رسیدن تمام شده بود؟"
    correct_option: "the coordinator had already moved the equipment inside"
    distractors: ["the volunteers were setting up the chairs", "the power went out", "I was checking the sound system"]
    accepted_answers: [{value: "the coordinator had already moved the equipment inside", status: "correct"}]
    feedback: "*had already moved* past perfect است و اتفاق قبلی را نشان می‌ته."
  en.b2.unit04.lesson02.exercise02.choose_interruption:
    instruction: "کدام جمله یک کار در جریان را نشان می‌ته که با یک اتفاق اصلی قطع می‌شه؟"
    correct_option: "While I was checking the sound system, the power went out."
    distractors: ["By the time I arrived, the coordinator had already moved the equipment inside.", "When I arrived, the volunteers were setting up the chairs.", "The coordinator had already moved the equipment inside."]
    accepted_answers: [{value: "While I was checking the sound system, the power went out.", status: "correct"}]
    feedback: "*While I was checking... the power went out* کار در جریان و قطع شدنش را یکجا نشان می‌ته."
  en.b2.unit04.lesson02.exercise03.order_by_the_time:
    instruction: "کلمات را طوری تنظیم کنین که جملهٔ prior event ساخته شه."
    accepted_answers: [{value: ["By", "the", "time", "I", "arrived", "the", "coordinator", "had", "already", "moved", "the", "equipment", "inside"], status: "correct"}]
    feedback: "ترتیب درست *By the time I arrived, the coordinator had already moved the equipment inside* است."
  en.b2.unit04.lesson02.exercise04.reply_while_checking:
    instruction: "دقیقاً همین جملهٔ interrupted action را بنویسین: *While I was checking the sound system, the power went out.*"
    accepted_answers:
      - {value: "While I was checking the sound system, the power went out.", status: "correct"}
      - {value: "While I was checking the sound system the power went out.", status: "correct"}
    feedback: "جواب باید *while I was checking* و *the power went out* را نگه کنه."
  en.b2.unit04.lesson02.exercise05.write_prior_event:
    instruction: "دقیقاً همین prior event را با past perfect بنویسین: *The coordinator had already moved the equipment inside.*"
    accepted_answers:
      - {value: "The coordinator had already moved the equipment inside.", status: "correct"}
      - {value: "The coordinator had already moved the equipment inside", status: "correct"}
    feedback: "*had already moved* فرق «از پیش انتقال داده بود» را در انگلیسی واضح می‌سازه."

  en.b2.unit04.lesson03.exercise01.choose_earliest_event:
    instruction: "در متن، کدام اتفاق از همه زودتر رخ داد؟"
    correct_option: "the coordinator had moved the equipment inside"
    distractors: ["the volunteers were setting up chairs", "the power went out", "the team delayed the start"]
    accepted_answers: [{value: "the coordinator had moved the equipment inside", status: "correct"}]
    feedback: "وسایل پیش از رسیدن سایمن داخل انتقال داده شده بود."
  en.b2.unit04.lesson03.exercise02.choose_interrupted_action:
    instruction: "وقتی برق رفت، کدام کار در جریان بود؟"
    correct_option: "he was checking the sound system"
    distractors: ["the coordinator had moved the equipment inside", "guests entered the venue", "the lights had come back on"]
    accepted_answers: [{value: "he was checking the sound system", status: "correct"}]
    feedback: "*was checking* نشان می‌ته کار در همان لحظه جریان داشت."
  en.b2.unit04.lesson03.exercise03.match_chronology:
    instruction: "هر اتفاق را به نقش زمانی‌اش وصل کنین."
    accepted_answers:
      - value:
          - {left: "earliest prior event", right: "the coordinator moved the equipment inside"}
          - {left: "background when Simon arrived", right: "volunteers were setting up chairs"}
          - {left: "ongoing action", right: "Simon was checking the sound system"}
          - {left: "foreground interruption", right: "the power went out"}
          - {left: "later consequence", right: "the team delayed the start"}
          - {left: "final resolved moment", right: "the lights had come back on"}
        status: "correct"
    feedback: "نقش زمانی هر بخش فرق دارد؛ همین فرق، شکل فعل انگلیسی را تعیین می‌کنه."
  en.b2.unit04.lesson03.exercise04.write_earliest_event:
    instruction: "دقیقاً بنویسین: *The coordinator had moved the equipment inside before Simon arrived.*"
    accepted_answers:
      - {value: "The coordinator had moved the equipment inside before Simon arrived.", status: "correct"}
      - {value: "The coordinator had moved the equipment inside before Simon arrived", status: "correct"}
    feedback: "*had moved ... before Simon arrived* زمان قبلی را روشن می‌کنه."
  en.b2.unit04.lesson03.exercise05.write_interruption:
    instruction: "دقیقاً بنویسین: *While Simon was checking the sound system, the power went out.*"
    accepted_answers:
      - {value: "While Simon was checking the sound system, the power went out.", status: "correct"}
      - {value: "While Simon was checking the sound system the power went out.", status: "correct"}
    feedback: "در انگلیسی *while* برای کاری که جریان داشت بسیار طبیعی است."

  en.b2.unit04.lesson04.exercise01.choose_prior_event:
    instruction: "در گفتگو، کدام اتفاق پیش از رسیدن سایمن رخ داده بود؟"
    correct_option: "the coordinator had already moved the equipment inside"
    distractors: ["the volunteers were setting up the chairs", "the power went out", "the start was delayed by twenty minutes"]
    accepted_answers: [{value: "the coordinator had already moved the equipment inside", status: "correct"}]
    feedback: "*had already moved* نشان می‌ته این کار پیش از رسیدن او تمام شده بود."
  en.b2.unit04.lesson04.exercise02.listen_interruption:
    instruction: "گوش کنین و اتفاق قطع‌کننده را انتخاب کنین."
    correct_option: "the power went out"
    distractors: ["the lights came back on", "the guests entered", "the start was delayed"]
    accepted_answers: [{value: "the power went out", status: "correct"}]
    feedback: "برق رفتن، کار چک کردن سیستم صدا را قطع کرد."
  en.b2.unit04.lesson04.exercise03.order_while_power:
    instruction: "کلمات را طوری تنظیم کنین که جملهٔ interrupted action ساخته شه."
    accepted_answers: [{value: ["while", "I", "was", "checking", "the", "sound", "system", "the", "power", "went", "out"], status: "correct"}]
    feedback: "ترتیب درست *while I was checking the sound system the power went out* است."
  en.b2.unit04.lesson04.exercise04.reply_as_simon:
    instruction: "به نقش سایمن، با یک background action و یک prior event جواب بتین."
    accepted_answers:
      - {value: "When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.", status: "correct"}
      - {value: "When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.", status: "correct"}
    feedback: "جواب باید هر دو را داشته باشه: *were setting up* و *had already moved*."
  en.b2.unit04.lesson04.exercise05.speak_recount:
    instruction: "آوازی با همین شکل جواب بتین: background، یک prior event، یک interrupted action، و پایان حل‌شده."
    accepted_answers:
      - {value: "When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.", status: "correct"}
    feedback: "در جواب آوازی، هر چهار نقش زمانی باید شنیده شه."
  en.b2.unit04.lesson04.exercise06.write_complex_recount:
    instruction: "همین recount کامل را بنویسین؛ جمله‌ها باید background، prior event، interrupted action، و resolved ending داشته باشند."
    accepted_answers:
