exercises:
  en.a1.unit13.lesson01.exercise01.listen_feeling:
    instruction: "گوش کنین و واژهٔ گفته‌شده را انتخاب کنین."
    correct_option: "خسته"
    distractors: ["خوش", "خفه", "شوق‌مند"]
    accepted_answers: [{value: "خسته", status: "correct"}]
    feedback: "tired یعنی خسته."
  en.a1.unit13.lesson01.exercise02.choose_sad:
    instruction: "خلاف خوش چیست؟"
    correct_option: "sad"
    distractors: ["tired", "excited", "worried"]
    accepted_answers: [{value: "sad", status: "correct"}]
    feedback: "sad (خفه/غمگین) خلاف happy (خوش) است."
  en.a1.unit13.lesson01.exercise03.choose_worried:
    instruction: "کدام واژه احساس پریشانی دربارهٔ چیزی که ممکن است اتفاق بیفته را توصیف می‌کنه؟"
    correct_option: "worried"
    distractors: ["happy", "tired", "excited"]
    accepted_answers: [{value: "worried", status: "correct"}]
    feedback: "worried یعنی خفه/پریشان."
  en.a1.unit13.lesson01.exercise04.match_feeling_words:
    instruction: "هر توضیح را به واژهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "feeling good", right: "happy"}, {left: "feeling bad", right: "sad"}, {left: "needing rest", right: "tired"}, {left: "looking forward to something", right: "excited"}], status: "correct"}]
    feedback: "happy=خوش، sad=خفه، tired=خسته، excited=شوق‌مند."
  en.a1.unit13.lesson01.exercise05.write_worried:
    instruction: "واژهٔ انگلیسی برای پریشانی دربارهٔ آینده را بنویسین."
    accepted_answers:
      - {value: "worried", status: "correct"}
      - {value: "Worried", status: "correct"}
    feedback: "worried یعنی خفه/پریشان."

  en.a1.unit13.lesson02.exercise01.listen_feeling_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "احساس امروز"
    distractors: ["تاریخ امروز", "هوا", "سایز لباس"]
    accepted_answers: [{value: "احساس امروز", status: "correct"}]
    feedback: "How are you feeling today؟ دربارهٔ احساس امروز می‌پرسه."
  en.a1.unit13.lesson02.exercise02.choose_feeling_answer:
    instruction: "جواب درست به سوال احساس امروز را انتخاب کنین."
    correct_option: "I'm a little worried because I have a big test tomorrow."
    distractors: ["It's sunny and warm.", "Do you have it in blue?", "I have two brothers."]
    accepted_answers: [{value: "I'm a little worried because I have a big test tomorrow.", status: "correct"}]
    feedback: "همی جمله یعنی «کمی خفه استم چون فردا یک امتحان مهم دارم»."
  en.a1.unit13.lesson02.exercise03.order_happy_because:
    instruction: "واژه‌ها را برای گفتن «خوش استم چون صنف تقریباً ختم شده» ترتیب کنین."
    accepted_answers: [{value: ["I'm", "happy", "because", "the", "class", "is", "almost", "over"], status: "correct"}]
    feedback: "ترتیب درست I'm happy because the class is almost over است."
  en.a1.unit13.lesson02.exercise04.reply_feeling_reason:
    instruction: "به همی سوال جواب بدین که کمی خفه استین چون فردا امتحان دارین."
    accepted_answers:
      - {value: "I'm a little worried because I have a big test tomorrow.", status: "correct"}
    feedback: "همی جواب هم احساس و هم دلیل آن را بیان می‌کنه."
  en.a1.unit13.lesson02.exercise05.write_feeling:
    instruction: "بنویسین که خوش استین چون صنف تقریباً ختم شده."
    accepted_answers:
      - {value: "I'm happy because the class is almost over.", status: "correct"}
      - {value: "I'm happy because the class is almost over", status: "correct"}
    feedback: "همی جمله یعنی «خوش استم چون صنف تقریباً ختم شده»."

  en.a1.unit13.lesson03.exercise01.read_worry_reason:
    instruction: "پیام را بخوانین. چرا نویسنده خفه است؟"
    correct_option: "امتحان مهم فردا"
    distractors: ["هوای بد", "سایز لباس", "قیمت یک چیز"]
    accepted_answers: [{value: "امتحان مهم فردا", status: "correct"}]
    feedback: "متن می‌گه I have a big test tomorrow."
  en.a1.unit13.lesson03.exercise02.read_excited_reason:
    instruction: "پیام را بخوانین. چرا نویسنده شوق‌مند هم است؟"
    correct_option: "امسال آخرین امتحان است"
    distractors: ["امتحان آسان است", "صنف جدید شروع می‌شه", "معلم جدید داره"]
    accepted_answers: [{value: "امسال آخرین امتحان است", status: "correct"}]
    feedback: "متن می‌گه it's the last one this year."
  en.a1.unit13.lesson03.exercise03.choose_both_feelings:
    instruction: "کدام دو احساس در پیام ذکر شده؟"
    correct_option: "worried and excited"
    distractors: ["happy and sad", "tired and worried", "excited and sad"]
    accepted_answers: [{value: "worried and excited", status: "correct"}]
    feedback: "نویسنده هم خفه است و هم شوق‌مند."
  en.a1.unit13.lesson03.exercise04.order_message_sentence:
    instruction: "واژه‌ها را برای گفتن «فردا یک امتحان مهم دارم» ترتیب کنین."
    accepted_answers: [{value: ["I", "have", "a", "big", "test", "tomorrow"], status: "correct"}]
    feedback: "ترتیب درست I have a big test tomorrow است."
  en.a1.unit13.lesson03.exercise05.write_message_summary:
    instruction: "دو احساس نویسنده را در یک جمله بنویسین."
    accepted_answers:
      - {value: "The writer is worried and excited.", status: "correct"}
      - {value: "The writer is worried and excited", status: "correct"}
    feedback: "جواب کامل هر دو احساس نویسنده را بیان می‌کنه."

  en.a1.unit13.lesson04.exercise01.listen_daniels_feeling:
    instruction: "گفتگو را گوش کنین و معلوم کنین دنیل چه احساسی داره."
    correct_option: "کمی خفه است"
    distractors: ["خیلی خوش است", "خسته است", "خفه/غمگین است"]
    accepted_answers: [{value: "کمی خفه است", status: "correct"}]
    feedback: "دنیل می‌گه I'm a little worried because I have a big test tomorrow."
  en.a1.unit13.lesson04.exercise02.listen_happy_reason:
    instruction: "گوش کنین و معلوم کنین چرا دنیل خوش است."
    correct_option: "صنف تقریباً ختم شده"
    distractors: ["امتحان آسان است", "صنف جدید شروع می‌شه", "معلم جدید داره"]
    accepted_answers: [{value: "صنف تقریباً ختم شده", status: "correct"}]
    feedback: "دنیل می‌گه the class is almost over."
  en.a1.unit13.lesson04.exercise03.choose_leila_response:
    instruction: "بعد شنیدن پریشانی دنیل، لیلا چه می‌گه؟"
    correct_option: "Oh, I understand. Are you excited too?"
    distractors: ["I'm happy the class is almost over.", "Do you have it in blue?", "It's sunny and warm."]
    accepted_answers: [{value: "Oh, I understand. Are you excited too?", status: "correct"}]
    feedback: "لیلا اول همدلی می‌کنه، بعد دربارهٔ شوق می‌پرسه."
  en.a1.unit13.lesson04.exercise04.order_q_feeling:
    instruction: "واژه‌ها را برای پرسیدن «امروز چطور استی؟» ترتیب کنین."
    accepted_answers: [{value: ["how", "are", "you", "feeling", "today"], status: "correct"}]
    feedback: "ترتیب درست how are you feeling today است."
  en.a1.unit13.lesson04.exercise05.reply_as_daniel:
    instruction: "به نقش دنیل، هم دربارهٔ پریشانی و هم دربارهٔ خوشی جواب بدین."
    accepted_answers:
      - {value: "I'm a little worried because I have a big test tomorrow. Yes, a little. I'm happy the class is almost over.", status: "correct"}
    feedback: "جواب کامل هر دو احساس (پریشانی و خوشی) را با دلایل‌شان بیان می‌کنه."
  en.a1.unit13.lesson04.exercise06.speak_feelings:
    instruction: "به نقش دنیل، با صدای بلند جواب بدین."
    accepted_answers:
      - {value: "I'm a little worried because I have a big test tomorrow. Yes, a little. I'm happy the class is almost over.", status: "correct"}
    feedback: "جواب کامل احساس پریشانی و خوشی را با دلیل هرکدام پوشش می‌ده."
