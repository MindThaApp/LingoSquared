exercises:
  en.a1.unit13.lesson01.exercise01.listen_feeling:
    instruction: "گوش کنین و کلمهٔ گفته‌شده را انتخاب کنین."
    correct_option: "خسته"
    distractors: ["خوش", "غمگین", "شوق‌مند"]
    accepted_answers: [{value: "خسته", status: "correct"}]
    feedback: "tired یعنی خسته."
  en.a1.unit13.lesson01.exercise02.choose_sad:
    instruction: "خلاف خوش چیست؟"
    correct_option: "sad"
    distractors: ["tired", "excited", "worried"]
    accepted_answers: [{value: "sad", status: "correct"}]
    feedback: "sad (غمگین) خلاف happy (خوش) استه."
