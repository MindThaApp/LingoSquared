          - {left: "today", right: "روزی که همین حالا در آن استین"}
          - {left: "tomorrow", right: "روزِ بعد از امروز"}
        status: "correct"
    feedback: "happy=خوش، sad=غمگین، tired=خسته، excited=شوق‌مند."
