generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific appointment-booking phrase source material (DLI Dari Basic Course) -- no dedicated appointment-booking lesson surfaced in the sections checked; the course's phone-register lessons (already used for unit14) don't extend to this specific booking scenario. No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit47 (appointments), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all five lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit47.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit47.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: appointment -> وعده (the common Dari/Afghan term for a scheduled meeting time, as opposed to Iranian Persian's وقت ملاقات as the default phrasing); vet -> داکتر حیوانات (a transparent descriptive phrase, since a single-word Dari term for veterinarian is uncommon in everyday speech in either dialect, so used as-is). Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌خواد for می‌شود/می‌خواهد, وخت for وقت, بجه for the informal o'clock marker, غم نخور as the informal 'don't worry' imperative). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's idiomatic use of 'work' to mean 'be suitable/convenient' (What time works for you?) is a metaphorical extension of the ordinary labor-related verb that has no equivalent verb-based idiom in Dari, which instead expresses the same idea with the adjective+copula construction مناسب استه ('is suitable') rather than reusing its own verb for 'to work' (کار کردن); (2) English's idiomatic 'due for' (He's due for his yearly checkup, meaning scheduled/expected) has no single-word Dari equivalent -- Dari expresses the same meaning with a full clause, وختش رسیده ('its time has arrived'), so a Dari speaker must learn 'due for' as a fixed English chunk rather than map it onto one Dari word. Same-speaker-distractor check performed per the standing CLAUDE.md footgun: lesson03.exercise03's listen_select tests the appointment time (correct_option '3pm', from Leila's own line 5) against invented, never-said-in-this-audio distractors ('10am', '5pm', 'noon') -- no other time value appears anywhere else in the dialogue by either speaker, matching the realization's own stated reasoning. Multi-clause accepted_answers (lesson04's write_own_appointment_message) mirrors the realization's own six variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit47.appointments: {title: "گرفتن یک وعده"}

lessons:
  en.a1.unit47.lesson01.appointments_vocabulary: {title: "کلمات وعده گرفتن"}
  en.a1.unit47.lesson02.making_an_appointment: {title: "گرفتن یک وعده"}
  en.a1.unit47.lesson03.dialogue_booking_a_vet_appointment: {title: "گفتگو: وعده گرفتن نزد داکتر حیوانات"}
  en.a1.unit47.lesson04.how_to_make_an_appointment: {title: "متن: چطور یک وعده بگیرین"}

teaching:
  en.a1.unit47.lesson01.teach.appointment: {title: "appointment", gloss: "وعده", note: "appointment یعنی وعده -- یک ملاقات یا دیدار که از پیش تعیین شده.", example_gloss: "پنجشنبه یک وعده دارم."}
  en.a1.unit47.lesson01.teach.available: {title: "available", gloss: "خالی/فارغ", note: "available یعنی وخت خالی داشتن -- آزاد بودن برای یک کار در یک وخت مشخص.", example_gloss: "پنجشنبه وخت خالی داری؟"}
  en.a1.unit47.lesson01.teach.book: {title: "book", gloss: "گرفتن (وعده)", note: "book یعنی رزرو کردن یا گرفتن یک وعده.", example_gloss: "می‌خواهم یک وعده بگیرم."}
  en.a1.unit47.lesson01.teach.confirm: {title: "confirm", gloss: "تایید کردن", note: "confirm یعنی تایید کردن -- گفتن اینکه یک چیز قطعی استه.", example_gloss: "می‌تانی وخت را تایید کنی؟"}
  en.a1.unit47.lesson01.teach.reschedule: {title: "reschedule", gloss: "دوباره تعیین کردن", note: "reschedule یعنی وخت یک وعده را عوض کردن.", example_gloss: "می‌تانیم برای جمعه دوباره تعیین کنیم؟"}

  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment: {title: "I'd like to make an appointment.", gloss: "می‌خواهم یک وعده بگیرم.", note: "I'd like to ... یک طریقهٔ مؤدبانه برای گفتن I want to استه."}
  en.a1.unit47.lesson02.teach.are_you_available_on_friday: {title: "Are you available on Friday?", gloss: "جمعه وخت خالی دارین؟", note: "on + روز هفته یعنی «در روز ___»."}
  en.a1.unit47.lesson02.teach.what_time_works_for_you: {title: "What time works for you?", gloss: "کدام ساعت برایتان مناسب استه؟", note: "works for you یعنی برایت مناسب استه -- work اینجه معنای «مناسب بودن» می‌ته، نی معنای معمولی «کار کردن»."}
  en.a1.unit47.lesson02.teach.that_time_works_for_me: {title: "That time works for me.", gloss: "آن ساعت برایم مناسب استه.", note: "همو ساختار works for، خو با me به‌عوض you."}
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday: {title: "Can we reschedule for Monday?", gloss: "می‌تانیم برای دوشنبه دوباره تعیین کنیم؟", note: "Can we ...? یک طریقهٔ مؤدبانه برای پیشنهاد یک کار مشترک استه."}
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed: {title: "Your appointment is confirmed.", gloss: "وعدهٔ تان تایید شد.", note: "is confirmed حالت مجهول (passive) استه -- confirmed شکل صفت از فعل confirm."}

  en.a1.unit47.lesson03.teach.dialogue_line1: {title: "سوال میا", gloss: "لیلا، مکس خوب استه؟ این اخیرها یک کمی خسته به نظر می‌رسه.", note: "seems tired یعنی خسته به نظر می‌رسه -- seems برای گفتن یک برداشت، نی یک حقیقت قطعی، کار می‌ره."}
  en.a1.unit47.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "او خوب استه، غم نخور. فقط وختش رسیده برای معاینهٔ سالانه‌اش. باید به داکتر حیوانات زنگ بزنم.", note: "due for یعنی وختش رسیده -- یک عبارت ثابت استه، هیچ کلمهٔ واحد دری معادلش نیستش."}
  en.a1.unit47.lesson03.teach.dialogue_line3: {title: "زنگ لیلا به داکتر حیوانات", gloss: "سلام، می‌خواهم یک وعده برای معاینهٔ سگم بگیرم.", note: "my dog's checkup یعنی معاینهٔ سگم -- 's برای نشان دادن مالکیت کار می‌ره."}
  en.a1.unit47.lesson03.teach.dialogue_line4: {title: "سوال میا", gloss: "چه گفتن؟", note: "did they say یک سوال گذشتهٔ سادهٔ استه با فعل کمکی did."}
  en.a1.unit47.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "پنجشنبه ساعت سه بجه وخت خالی دارن.", note: "at 3pm یعنی ساعت سه بجه -- at پیش از یک ساعت مشخص می‌آیه."}
  en.a1.unit47.lesson03.teach.dialogue_line6: {title: "سوال میا", gloss: "آن وخت برایت مناسب استه؟", note: "Does that time work for you? همو عبارت works for، خو اینجه به شکل سوالی با does."}
  en.a1.unit47.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "بلی، برایم مناسب استه. پنجشنبه ساعت سه بجه -- تشکر! وعدهٔ مکس تایید شد.", note: "is confirmed دوباره همو حالت مجهول استه که در لسن ۲ یاد گرفتین."}

  en.a1.unit47.lesson04.teach.reading_passage: {title: "متن: چطور یک وعده بگیرین", gloss: "چطور یک وعده بگیرین: اگه ضرورت دارین داکتر، دندان‌داکتر یا یک سرویس دیگه را ببینین، معمولاً باید اول یک وعده بگیرین. زنگ بزنین و بگین می‌خواهین یک وعده بگیرین. منشی به تان می‌گه کدام روزها و ساعت‌ها خالی استن. یک وخت که برایتان مناسب استه انتخاب کنین، و آن‌ها وعدهٔ تان را تایید می‌کنن. اگه چیزی عوض شد، دوباره زنگ بزنین و بخواین که دوباره تعیین شه. هفتهٔ پیش، لیلا به داکتر حیوانات زنگ زد تا برای معاینهٔ سالانهٔ سگش مکس یک وعده بگیره. پنجشنبه ساعت سه بجه وخت خالی داشتن، و لیلا آن وخت را تایید کرد. دانیال هم یک وعده داره -- دوشنبه صبح نزد دندان‌داکتر می‌ره برای یک معاینه. او گفت که هراسان نیستش، فقط این هفته یک کمی مصروف استه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- called, were, confirmed, said."}

exercises:
  en.a1.unit47.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "book"
    distractors: ["appointment", "available", "confirm", "reschedule"]
    accepted_answers: [{value: "book", status: "correct"}]
    feedback: "book یعنی گرفتن یک وعده."
  en.a1.unit47.lesson01.exercise02.choose_available_meaning:
    instruction: "کدام کلمه یعنی وخت خالی داشتن در یک ساعت مشخص؟"
    correct_option: "available"
    distractors: ["book", "confirm", "reschedule"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "available یعنی خالی/فارغ."
  en.a1.unit47.lesson01.exercise03.match_appointment_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "appointment", right: "ملاقات یا دیدار برنامه‌ریزی‌شده در وقت معین"}
      - {left: "available", right: "در یک وقت مشخص فارغ‌بودن"}
      - {left: "book", right: "از پیش گرفتن یا رزروکردن چیزی"}
      - {left: "confirm", right: "گفتن این‌که چیزی حتماً درست استه یا انجام می‌شه"}
      - {left: "reschedule", right: "تغییردادن وقت چیزی که قبلاً برنامه‌ریزی شده"}
    accepted_answers:
      - value:
          - {left: "appointment", right: "ملاقات یا دیدار برنامه‌ریزی‌شده در وقت معین"}
          - {left: "available", right: "در یک وقت مشخص فارغ‌بودن"}
          - {left: "book", right: "از پیش گرفتن یا رزروکردن چیزی"}
          - {left: "confirm", right: "گفتن این‌که چیزی حتماً درست استه یا انجام می‌شه"}
          - {left: "reschedule", right: "تغییردادن وقت چیزی که قبلاً برنامه‌ریزی شده"}
        status: "correct"
    feedback: "appointment=وعده، available=خالی، book=گرفتن، confirm=تایید کردن، reschedule=دوباره تعیین کردن."
  en.a1.unit47.lesson01.exercise04.order_appointment_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "an", "appointment", "on", "Thursday."], status: "correct"}]
    feedback: "ترتیب درست: I have an appointment on Thursday."
  en.a1.unit47.lesson01.exercise05.write_book_word:
    instruction: "کلمه‌ای را بنویسین که یعنی رزرو کردن یا گرفتن یک چیز."
    accepted_answers: [{value: "book", status: "correct"}]
    feedback: "book یعنی گرفتن یک وعده."

  en.a1.unit47.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Are you available on Friday?"
    distractors: ["I'd like to make an appointment.", "That time works for me.", "Your appointment is confirmed."]
    accepted_answers: [{value: "Are you available on Friday?", status: "correct"}]
    feedback: "Are you available on Friday? یعنی جمعه وخت خالی دارین؟"
  en.a1.unit47.lesson02.exercise02.choose_id_like_meaning:
    instruction: "کدام عبارت را برای شروع گرفتن یک وعده می‌گین؟"
    correct_option: "I'd like to make an appointment."
    distractors: ["Are you available on Friday?", "What time works for you?", "Can we reschedule for Monday?"]
    accepted_answers: [{value: "I'd like to make an appointment.", status: "correct"}]
    feedback: "I'd like to make an appointment. یعنی می‌خواهم یک وعده بگیرم."
  en.a1.unit47.lesson02.exercise03.choose_confirmed_meaning:
    instruction: "کدام عبارت به تان می‌گه که وعده قطعاً تنظیم شده؟"
    correct_option: "Your appointment is confirmed."
    distractors: ["I'd like to make an appointment.", "Are you available on Friday?", "Can we reschedule for Monday?"]
    accepted_answers: [{value: "Your appointment is confirmed.", status: "correct"}]
    feedback: "Your appointment is confirmed. یعنی وعدهٔ تان تایید شد."
  en.a1.unit47.lesson02.exercise04.order_what_time_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["What", "time", "works", "for", "you?"], status: "correct"}]
    feedback: "ترتیب درست: What time works for you?"
  en.a1.unit47.lesson02.exercise05.translate_reschedule_monday:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «می‌تانیم برای دوشنبه دوباره تعیین کنیم؟»"
    accepted_answers:
      - {value: "Can we reschedule for Monday?", status: "correct"}
      - {value: "Can we reschedule for Monday", status: "correct"}
      - {value: "Can we reschedule it for Monday?", status: "correct"}
      - {value: "Can we reschedule it for Monday", status: "correct"}
    feedback: "Can we reschedule for Monday? یعنی می‌تانیم برای دوشنبه دوباره تعیین کنیم؟"

  en.a1.unit47.lesson03.exercise01.comprehension_why_appointment:
    instruction: "مطابق گفتگو، مکس چرا ضرورت به وعده داره؟"
    correct_option: "for his yearly checkup"
    distractors: ["he is sick", "for a haircut", "for a walk"]
    accepted_answers: [{value: "for his yearly checkup", status: "correct"}]
    feedback: "وختش رسیده برای معاینهٔ سالانه‌اش (for his yearly checkup)."
  en.a1.unit47.lesson03.exercise02.comprehension_what_day:
    instruction: "مطابق گفتگو، وعدهٔ مکس کدام روز استه؟"
    correct_option: "Thursday"
    distractors: ["Monday", "Friday", "Saturday"]
    accepted_answers: [{value: "Thursday", status: "correct"}]
    feedback: "وعدهٔ مکس پنجشنبه (Thursday) استه."
  en.a1.unit47.lesson03.exercise03.listen_dialogue_time:
    instruction: "مطابق گفتگو، وعدهٔ مکس ساعت چند استه؟"
    correct_option: "3pm"
    distractors: ["10am", "5pm", "noon"]
    accepted_answers: [{value: "3pm", status: "correct"}]
    feedback: "وعدهٔ مکس ساعت سه بجه (3pm) استه."
  en.a1.unit47.lesson03.exercise04.respond_own_appointment_request:
    instruction: "بگین که می‌خواین یک وعده بگیرین، یا در بارهٔ یک روز یا ساعت بپرسین."
    accepted_answers: ["I'd like to make an appointment", "I'd like to make an appointment.", "I'd like to make an appointment for Thursday", "I'd like to make an appointment for Thursday.", "Are you available on Thursday?", "Can we reschedule for Monday?", "What time works for you?", "Are you available on Friday?", "Are you available on Monday?", "Is Friday available?", "Does that time work for you?", "Does Thursday work for you?", "I would like to make an appointment", "I would like to make an appointment.", "I'd like to make an appointment for Friday.", "I'd like to make an appointment for Monday."]
    feedback: "می‌تانین بگین I'd like to make an appointment یا بپرسین Are you available on Thursday؟"

  en.a1.unit47.lesson04.exercise01.reading_reschedule_action:
    instruction: "مطابق اعلانیه، اگه بخواین وعده تان را عوض کنین چه کار باید کنین؟"
    correct_option: "call again and ask to reschedule"
    distractors: ["don't go", "just show up late", "wait for a text message"]
    accepted_answers: [{value: "call again and ask to reschedule", status: "correct"}]
    feedback: "اعلانیه می‌گه باید دوباره زنگ بزنین و بخواین دوباره تعیین شه."
  en.a1.unit47.lesson04.exercise02.reading_why_leila_called:
    instruction: "مطابق متن، لیلا چرا به داکتر حیوانات زنگ زد؟"
    correct_option: "for Max's yearly checkup"
    distractors: ["Max was sick", "to buy dog food", "to reschedule an old appointment"]
    accepted_answers: [{value: "for Max's yearly checkup", status: "correct"}]
    feedback: "لیلا برای معاینهٔ سالانهٔ مکس زنگ زد."
  en.a1.unit47.lesson04.exercise03.reading_daniels_appointment:
    instruction: "مطابق متن، دانیال دوشنبه چه وعده‌ای داره؟"
    correct_option: "a dentist appointment"
    distractors: ["a doctor appointment", "a haircut appointment", "a vet appointment"]
    accepted_answers: [{value: "a dentist appointment", status: "correct"}]
    feedback: "دانیال دوشنبه یک وعدهٔ دندان‌داکتر داره."
  en.a1.unit47.lesson04.exercise04.write_own_appointment_message:
    instruction: "یک پیام کوتاه بنویسین: بگین می‌خواین یک وعده بگیرین و بپرسین که یک روز یا ساعت مناسب استه یا نی."
    accepted_answers:
      - {value: "I'd like to make an appointment. Are you available on Thursday?", status: "correct"}
      - {value: "I'd like to make an appointment. Are you available on Thursday.", status: "correct"}
      - {value: "I'd like to make an appointment, are you available on Thursday?", status: "correct"}
      - {value: "I'd like to make an appointment. Is Friday available?", status: "correct"}
      - {value: "I'd like to make an appointment. Is Friday available.", status: "correct"}
      - {value: "I'd like to make an appointment. Are you available on Friday?", status: "correct"}
      - {value: "I'd like to make an appointment. Are you available on Monday?", status: "correct"}
      - {value: "I'd like to make an appointment. Does Thursday work for you?", status: "correct"}
      - {value: "I'd like to make an appointment. Does Friday work for you?", status: "correct"}
      - {value: "I would like to make an appointment. Are you available on Thursday?", status: "correct"}
      - {value: "I would like to make an appointment. Are you available on Friday?", status: "correct"}
      - {value: "I would like to make an appointment. Is Friday available?", status: "correct"}
    feedback: "می‌تانین بگین: I'd like to make an appointment. Are you available on Thursday?"
