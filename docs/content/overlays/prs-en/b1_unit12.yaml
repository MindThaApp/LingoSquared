course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit12.concession: {title: "با اینکه دفتر خوب استه، خانه را ترجیح می‌تم"}

lessons:
  en.b1.unit12.lesson01.concession_vocabulary: {title: "Although، even though، despite، و however"}
  en.b1.unit12.lesson02.concession_clauses: {title: "Although، despite، و یک جملهٔ کامل"}
  en.b1.unit12.lesson03.reading_where_to_work: {title: "متن خوانی: کجا کار کنیم"}
  en.b1.unit12.lesson04.the_workplace_debate_dialogue: {title: "همو یک نکتهٔ معقول استه، اما..."}

teaching:
  en.b1.unit12.lesson01.teach.although: {title: "although", gloss: "گرچه، با اینکه (با یک جملهٔ کامل)", note: "*although* یک تضاد را با یک جملهٔ کامل در یک فقره معرفی می‌کنه.", example_gloss: "با اینکه دفتر آرام استه، میا ترجیح می‌ته که در خانه کار کنه."}
  en.b1.unit12.lesson01.teach.even_though: {title: "even though", gloss: "هرچند، با وجودی که", note: "*even though* یک تضاد قوی‌تر از although را نشان می‌ته.", example_gloss: "لیلا هرچند آپارتمانش کوچک استه، تمرکزش را حفظ می‌کنه."}
  en.b1.unit12.lesson01.teach.despite: {title: "despite", gloss: "باوجود (+ اسم یا شکل -ing)", note: "*despite* قبل از یک اسم یا شکل -ing می‌آیه، نی یک جملهٔ کامل.", example_gloss: "باوجود مزاحمت‌ها، دانیال ریپورتش را به وقت تمام می‌کنه."}
  en.b1.unit12.lesson01.teach.however: {title: "however", gloss: "اما، با آن هم (در آغاز یک جملهٔ جدا)", note: "*however* یک جملهٔ نو را بعد از یک نقطه شروع می‌کنه.", example_gloss: "دفتر آرام استه. اما، میا ترجیح می‌ته که در خانه کار کنه."}
  en.b1.unit12.lesson01.teach.valid_point: {title: "valid point", gloss: "نکتهٔ معقول", note: "*valid point* یعنی یک نکتهٔ منطقی که کسی می‌گه.", example_gloss: "همو یک نکتهٔ معقول دربارهٔ تمرکز استه."}
  en.b1.unit12.lesson01.teach.convince: {title: "convince", gloss: "قناعت دادن، راضی کدن", note: "*convince* یعنی کسی را راضی کدن که با شما موافقه کنه.", example_gloss: "لیلا کوشش کد میا را قناعت بته که به دفتر برگرده."}

  en.b1.unit12.lesson02.teach.office_quiet_home: {title: "Although the office is quiet, Mia prefers working from home.", gloss: "با اینکه دفتر آرام استه، میا ترجیح می‌ته که در خانه کار کنه.", note: "*although* یک تضاد را با یک جملهٔ کامل معرفی می‌کنه."}
  en.b1.unit12.lesson02.teach.distractions_report: {title: "Despite the distractions, Daniel finishes his report on time.", gloss: "باوجود مزاحمت‌ها، دانیال ریپورتش را به وقت تمام می‌کنه.", note: "*despite* قبل از یک اسم می‌آیه، نی یک جملهٔ کامل."}
  en.b1.unit12.lesson02.teach.grammar_concession: {title: "قاعدهٔ concession", gloss: "although و even though یک جملهٔ کامل را شروع می‌کنن: Although the office is quiet, Mia prefers home. despite قبل از یک اسم یا شکل -ing می‌آیه، نی یک جمله: Despite the distractions, Daniel finishes his report. however یک جملهٔ نو را بعد از یک نقطه یا نقطه‌ویرگول شروع می‌کنه: The office is quiet. However, Mia prefers home.", note: "همی سه شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit12.lesson03.teach.flexibility: {title: "flexibility", gloss: "انعطاف‌پذیری", note: "*flexibility* یعنی توانایی تغییر دادن پلان یا طرز کار به آسانی.", example_gloss: "میا و لیلا هردو موافق استن که انعطاف‌پذیری مهم استه."}
  en.b1.unit12.lesson03.teach.teamwork: {title: "teamwork", gloss: "کارِ تیمی", note: "*teamwork* یعنی کار کدن باهم به عنوان یک گروپ.", example_gloss: "لیلا فکر می‌کنه دفتر کارِ تیمی بهتر می‌سازه."}
  en.b1.unit12.lesson03.teach.reading_passage: {title: "متن دربارهٔ کار در خانه یا دفتر", gloss: "میا و لیلا دربارهٔ اینکه کجا کار کنن موافق نیستن. میا از خانه کار می‌کنه چون آرام و راحت استه. با اینکه دلتنگ دیدن همکارانش می‌شه، در خانه کارِ بیشتر تمام می‌کنه. لیلا دفتر را ترجیح می‌ته. باوجود سروصدا، از صحبت کدن با همکاران در وقفه‌ها خوشش می‌آیه. هرچند میا یک نکتهٔ معقول دربارهٔ تمرکز می‌گه، لیلا بازهم فکر می‌کنه دفتر کارِ تیمی بهتر می‌سازه. اما، هردو موافق استن که انعطاف‌پذیری مهم استه.", note: "همی متن although، despite، even though، و however را در یک متن واحد نشان می‌ته."}

  en.b1.unit12.lesson04.teach.q_although_nice_home: {title: "حرف میا", gloss: "میا می‌گه: لیلا، با اینکه دفتر خوب استه، در خانه کارِ بیشتر تمام می‌کنم.", note: "*although* اینجه یک تضاد را با یک جملهٔ کامل معرفی می‌کنه."}
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks: {title: "جواب لیلا", gloss: "لیلا می‌گه: می‌فامم، اما باوجود سروصدا، واقعاً از صحبت کدن با مردم در وقفه‌ها خوشم می‌آیه.", note: "*despite* قبل از یک اسم می‌آیه."}
  en.b1.unit12.lesson04.teach.q_valid_point_however: {title: "جواب میا", gloss: "میا می‌گه: همو یک نکتهٔ معقول استه. اما، بازهم فکر می‌کنم تنها بهتر تمرکز می‌کنم.", note: "*however* یک جملهٔ نو را شروع می‌کنه."}
  en.b1.unit12.lesson04.teach.a_even_though_convince: {title: "سوال لیلا", gloss: "لیلا می‌گه: هرچند دفتر را ترجیح می‌تم، نمی‌تانم تو را قناعت بتم که فکرت را تغییر بتی، نی؟", note: "*even though* یک تضاد قوی‌تر را نشان می‌ته."}
  en.b1.unit12.lesson04.teach.q_however_flexibility: {title: "جواب میا", gloss: "میا می‌گه: شاید نی! اما، می‌تانیم موافقه کنیم که انعطاف‌پذیری از همه مهم‌تر استه.", note: "*however* اینجه هم یک جملهٔ نو را شروع می‌کنه."}
  en.b1.unit12.lesson04.teach.a_despite_preferences_time: {title: "جواب لیلا", gloss: "لیلا می‌گه: باوجود ترجیحات متفاوت ما، همه‌چیز را به وقت تمام می‌کنیم.", note: "*despite* قبل از یک اسم می‌آیه."}

exercises:
  en.b1.unit12.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "convince"
    distractors: ["although", "despite", "valid point"]
    accepted_answers: [{value: "convince", status: "correct"}]
    feedback: "*convince* یعنی قناعت دادن."
  en.b1.unit12.lesson01.exercise02.choose_despite:
    instruction: "کدام کلمه یک تضاد را با یک اسم یا شکل -ing معرفی می‌کنه، نی یک جملهٔ کامل؟"
    correct_option: "despite"
    distractors: ["although", "even though", "however"]
    accepted_answers: [{value: "despite", status: "correct"}]
    feedback: "*despite* قبل از یک اسم یا شکل -ing می‌آیه."
  en.b1.unit12.lesson01.exercise03.choose_however:
    instruction: "کدام کلمه یک تضاد را به شکل یک جملهٔ جدا معرفی می‌کنه؟"
    correct_option: "however"
    distractors: ["although", "despite", "even though"]
    accepted_answers: [{value: "however", status: "correct"}]
    feedback: "*however* یک جملهٔ نو را شروع می‌کنه."
  en.b1.unit12.lesson01.exercise04.match_concession_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "although", right: "گرچه، با اینکه (با یک جملهٔ کامل)"}
      - {left: "even though", right: "هرچند، با وجودی که"}
      - {left: "despite", right: "باوجود یک اسم یا کار"}
      - {left: "however", right: "اما، بازهم (در آغاز یک جملهٔ جدا)"}
      - {left: "valid point", right: "نکتهٔ معقول"}
      - {left: "convince", right: "قناعت دادن، راضی کدن"}
    accepted_answers:
      - value:
          - {left: "although", right: "گرچه، با اینکه (با یک جملهٔ کامل)"}
          - {left: "even though", right: "هرچند، با وجودی که"}
          - {left: "despite", right: "باوجود یک اسم یا کار"}
          - {left: "however", right: "اما، بازهم (در آغاز یک جملهٔ جدا)"}
          - {left: "valid point", right: "نکتهٔ معقول"}
          - {left: "convince", right: "قناعت دادن، راضی کدن"}
        status: "correct"
    feedback: "*although*=با اینکه، *even though*=هرچند، *despite*=باوجود، *however*=اما، *valid point*=نکتهٔ معقول، *convince*=قناعت دادن."
  en.b1.unit12.lesson01.exercise05.write_convince:
    instruction: "کلمه‌ای را که یعنی راضی کدن کسی برای موافقه بنویسین."
    accepted_answers:
      - {value: "convince", status: "correct"}
      - {value: "Convince", status: "correct"}
    feedback: "*convince* یعنی قناعت دادن."

  en.b1.unit12.lesson02.exercise01.choose_although_clause:
    instruction: "کدام جمله although را برای معرفی یک جملهٔ کامل تضاد استفاده می‌کنه؟"
    correct_option: "Although the office is quiet, Mia prefers working from home."
    distractors: ["Despite the distractions, Daniel finishes his report on time.", "The office is quiet. However, Mia prefers working from home.", "Leila stays focused even though her apartment is small."]
    accepted_answers: [{value: "Although the office is quiet, Mia prefers working from home.", status: "correct"}]
    feedback: "*Although the office is quiet, Mia prefers working from home* یعنی با اینکه دفتر آرام استه، میا ترجیح می‌ته در خانه کار کنه."
  en.b1.unit12.lesson02.exercise02.choose_despite_noun:
    instruction: "کدام جمله despite را قبل از یک عبارت اسمی استفاده می‌کنه؟"
    correct_option: "Despite the distractions, Daniel finishes his report on time."
    distractors: ["Although the office is quiet, Mia prefers working from home.", "The office is quiet. However, Mia prefers working from home.", "Leila stays focused even though her apartment is small."]
    accepted_answers: [{value: "Despite the distractions, Daniel finishes his report on time.", status: "correct"}]
    feedback: "*Despite the distractions, Daniel finishes his report on time* یعنی باوجود مزاحمت‌ها، دانیال ریپورتش را به وقت تمام می‌کنه."
  en.b1.unit12.lesson02.exercise03.order_although_office:
    instruction: "کلمات را برای گفتن «با اینکه دفتر آرام استه، میا ترجیح می‌ته در خانه کار کنه» ترتیب کنین."
    accepted_answers: [{value: ["Although", "the", "office", "is", "quiet", "Mia", "prefers", "working", "from", "home"], status: "correct"}]
    feedback: "ترتیب درست: *Although the office is quiet, Mia prefers working from home*."
  en.b1.unit12.lesson02.exercise04.reply_why_finish_on_time:
    instruction: "دانیال باوجود مزاحمت‌ها چی کار می‌کنه؟ با یک جملهٔ کامل که با *Despite* شروع می‌شه جواب بتین."
    accepted_answers:
      - {value: "Despite the distractions, Daniel finishes his report on time.", status: "correct"}
      - {value: "Despite the distractions, Daniel finishes his report on time", status: "correct"}
      - {value: "Despite the distractions, he finishes his report on time.", status: "correct"}
      - {value: "Daniel finishes his report on time despite the distractions.", status: "correct"}
    feedback: "*Despite the distractions, Daniel finishes his report on time* یعنی باوجود مزاحمت‌ها، دانیال ریپورتش را به وقت تمام می‌کنه."
  en.b1.unit12.lesson02.exercise05.write_despite_report:
    instruction: "بنویسین که باوجود مزاحمت‌ها، دانیال ریپورتش را به وقت تمام می‌کنه."
    accepted_answers:
      - {value: "Despite the distractions, Daniel finishes his report on time.", status: "correct"}
      - {value: "Despite the distractions, Daniel finishes his report on time", status: "correct"}
    feedback: "*Despite the distractions, Daniel finishes his report on time* یعنی باوجود مزاحمت‌ها، دانیال ریپورتش را به وقت تمام می‌کنه."

  en.b1.unit12.lesson03.exercise01.comprehend_mia_home:
    instruction: "با اینکه میا دلتنگ دیدن همکارانش می‌شه، در خانه چی کار تمام می‌کنه؟"
    correct_option: "she gets more work done at home"
    distractors: ["she misses seeing her coworkers all day", "she stops working early", "she goes to the office instead"]
    accepted_answers: [{value: "she gets more work done at home", status: "correct"}]
    feedback: "متن می‌گه *she gets more work done at home*."
  en.b1.unit12.lesson03.exercise02.comprehend_leila_teamwork:
    instruction: "چرا لیلا بازهم دفتر را ترجیح می‌ته، هرچند میا یک نکتهٔ معقول دربارهٔ تمرکز می‌گه؟"
    correct_option: "the office builds better teamwork"
    distractors: ["the office is quieter than home", "she dislikes working alone", "the office has better internet"]
    accepted_answers: [{value: "the office builds better teamwork", status: "correct"}]
    feedback: "متن می‌گه *the office builds better teamwork*."
  en.b1.unit12.lesson03.exercise03.recognize_flexibility:
    instruction: "کدام کلمه یعنی توانایی تغییر دادن پلان یا طرز کار به آسانی؟"
    correct_option: "flexibility"
    distractors: ["teamwork", "noise", "comfortable"]
    accepted_answers: [{value: "flexibility", status: "correct"}]
    feedback: "*flexibility* یعنی انعطاف‌پذیری."
  en.b1.unit12.lesson03.exercise04.order_despite_noise:
    instruction: "کلمات را برای گفتن «باوجود سروصدا، او از صحبت کدن با همکاران در وقفه‌ها خوشش می‌آیه» ترتیب کنین."
    accepted_answers: [{value: ["Despite", "the", "noise", "she", "likes", "talking", "to", "colleagues", "during", "breaks"], status: "correct"}]
    feedback: "ترتیب درست: *Despite the noise, she likes talking to colleagues during breaks*."
  en.b1.unit12.lesson03.exercise05.write_flexibility_important:
    instruction: "بنویسین که هردو موافق استن که انعطاف‌پذیری مهم استه."
    accepted_answers:
      - {value: "Both agree that flexibility is important.", status: "correct"}
      - {value: "Both agree that flexibility is important", status: "correct"}
      - {value: "They both agree that flexibility is important.", status: "correct"}
      - {value: "Both of them agree that flexibility is important.", status: "correct"}
    feedback: "*Both agree that flexibility is important* یعنی هردو موافق استن که انعطاف‌پذیری مهم استه."

  en.b1.unit12.lesson04.exercise01.listen_mia_opinion:
    instruction: "گفتگو را گوش کنین و بگین میا در خانه چی کار می‌کنه."
    correct_option: "I get more work done at home"
    distractors: ["I miss my coworkers every day", "I prefer the office more than home", "I finish nothing when I work from home"]
    accepted_answers: [{value: "I get more work done at home", status: "correct"}]
    feedback: "میا می‌گه *I get more work done at home*."
  en.b1.unit12.lesson04.exercise02.listen_why_leila_likes_office:
    instruction: "گوش کنین و بگین لیلا باوجود سروصدا از چی خوشش می‌آیه."
    correct_option: "I really enjoy talking to people during breaks"
    distractors: ["I dislike working with people", "I prefer complete silence", "I never take breaks"]
    accepted_answers: [{value: "I really enjoy talking to people during breaks", status: "correct"}]
    feedback: "لیلا می‌گه *I really enjoy talking to people during breaks*."
  en.b1.unit12.lesson04.exercise03.choose_what_they_agree_on:
    instruction: "میا و لیلا در نهایت روی چی موافقه می‌کنن؟"
    correct_option: "flexibility matters most"
    distractors: ["working from home always", "working at the office always", "ignoring each other's opinions"]
    accepted_answers: [{value: "flexibility matters most", status: "correct"}]
    feedback: "میا می‌گه *flexibility matters most*."
  en.b1.unit12.lesson04.exercise04.order_despite_preferences:
    instruction: "کلمات را برای گفتن «باوجود ترجیحات متفاوت ما، همه‌چیز را به وقت تمام می‌کنیم» ترتیب کنین."
    accepted_answers: [{value: ["Despite", "our", "different", "preferences", "we", "finish", "everything", "on", "time"], status: "correct"}]
    feedback: "ترتیب درست: *Despite our different preferences, we finish everything on time*."
  en.b1.unit12.lesson04.exercise05.reply_as_mia:
    instruction: "لیلا می‌گه: می‌فامم، اما باوجود سروصدا، واقعاً از صحبت کدن با مردم در وقفه‌ها خوشم می‌آیه. به نقش میا جواب بتین: قبول کنین که نکتهٔ معقول استه، و بعد با *However* بگین که بازهم فکر می‌کنین تنها بهتر تمرکز می‌کنین."
    accepted_answers:
      - {value: "That is a valid point. However, I still think I focus better alone.", status: "correct"}
      - {value: "That is a valid point. However, I still think I focus better alone", status: "correct"}
    feedback: "*That is a valid point. However, I still think I focus better alone* یعنی همو یک نکتهٔ معقول استه. اما، بازهم فکر می‌کنم تنها بهتر تمرکز می‌کنم."
  en.b1.unit12.lesson04.exercise06.speak_concession_dialogue:
    instruction: "میا می‌گه: شاید نی! اما، می‌تانیم موافقه کنیم که انعطاف‌پذیری از همه مهم‌تر استه. به نقش لیلا آوازی با *Despite* جواب بتین: باوجود ترجیحات متفاوت، همه‌چیز را به وقت تمام می‌کنین."
    accepted_answers:
      - {value: "Despite our different preferences, we finish everything on time.", status: "correct"}
      - {value: "Despite our different preferences, we finish everything on time", status: "correct"}
    feedback: "*Despite our different preferences, we finish everything on time* یعنی باوجود ترجیحات متفاوت ما، همه‌چیز را به وقت تمام می‌کنیم."
