teaching:
  en.a2.unit30.lesson01.teach.experience: {title: "experience", gloss: "تجربه", note: "*experience* یعنی تجربه‌ای که در یک کار یا فعالیت داشتین.", example_gloss: "دو سال تجربه در مارکیتینگ دارم."}
  en.a2.unit30.lesson01.teach.position: {title: "position", gloss: "پُست", note: "*position* یعنی یک پُست یا وظیفه در یک شرکت.", example_gloss: "همی پُست برای یک هماهنگ‌کنندهٔ مارکیتینگ استه."}
  en.a2.unit30.lesson01.teach.availability: {title: "availability", gloss: "آمادگی وقت", note: "*availability* یعنی وقت‌هایی که آماده استین کار را شروع کنین.", example_gloss: "مصاحبه‌کننده دربارهٔ آمادگی وقتم پرسید."}
  en.a2.unit30.lesson01.teach.strength: {title: "strength", gloss: "نقطهٔ قوت", note: "*strength* یعنی چیزی که در آن مهارت دارین.", example_gloss: "یکی از نقطه‌های قوتم منظم بودنمه."}
  en.a2.unit30.lesson01.teach.requirement: {title: "requirement", gloss: "شرط", note: "*requirement* یعنی چیزی که کارفرما ازتان می‌خواد.", example_gloss: "دو سال تجربه یک شرط برای همی پُست استه."}

  en.a2.unit30.lesson02.teach.two_years_experience: {title: "I have two years of experience in social media marketing.", gloss: "دو سال تجربه در مارکیتینگ رسانه‌های اجتماعی دارم.", note: "همی جمله برای گفتن مدت و نوع تجربه‌تان استعمال می‌شه."}
  en.a2.unit30.lesson02.teach.one_strength_organized: {title: "One of my strengths is being organized.", gloss: "یکی از نقطه‌های قوتم منظم بودنمه.", note: "همی ساختار برای معرفی یک نقطهٔ قوت استعمال می‌شه."}
  en.a2.unit30.lesson02.teach.available_next_monday: {title: "I'm available to start next Monday.", gloss: "دوشنبهٔ آینده آماده استم کار را شروع کنم.", note: "*available to* یعنی آماده و آزاد بودن برای شروع کدام کار."}

  en.a2.unit30.lesson03.teach.resume: {title: "resume", gloss: "خلاصهٔ سوانح", note: "*resume* یعنی سندی که تجربه و تحصیلات‌تان را نشان می‌ته.", example_gloss: "لطفاً خلاصهٔ سوانح‌تان را به مصاحبه بیارین."}
  en.a2.unit30.lesson03.teach.deadline: {title: "deadline", gloss: "میعاد", note: "*deadline* یعنی وقتی که باید یک کار تمام شود.", example_gloss: "همیشه در کار به میعادهایم می‌رسم."}
  en.a2.unit30.lesson03.teach.posting_text: {title: "متن اعلان کاریابی", gloss: "شرکت برایت پاث مارکیتینگ به یک هماهنگ‌کنندهٔ مارکیتینگ ضرورت داره. شرایط: دو سال تجربه، مهارت نوشتاری قوی، و آمادگی برای شروع فوری. لطفاً خلاصهٔ سوانح‌تان را به مصاحبه بیارین.", note: "همی یک اعلان کاریابی واقعی با شرایط و خواهش استه -- سویهٔ A2."}
  en.a2.unit30.lesson03.teach.i_meet_deadlines: {title: "I meet deadlines, and I work well in a team.", gloss: "به میعادها می‌رسم، و در تیم خوب کار می‌کنم.", note: "*work well in a team* یعنی همرای هم‌کارها خوب کار کدن."}

  en.a2.unit30.lesson04.teach.q_tell_me_experience: {title: "سوال دربارهٔ تجربه", gloss: "مصاحبه‌کننده می‌گه: از آمدن‌تان امروز تشکر. می‌تانین دربارهٔ تجربه‌تان بگین؟", note: "*Can you tell me about...?* یک شکل مؤدبانه و رسمی برای پرسیدن در مصاحبه استه."}
  en.a2.unit30.lesson04.teach.a_two_years_managed_team: {title: "جواب میا دربارهٔ تجربه", gloss: "میا می‌گه: دو سال تجربه در مارکیتینگ رسانه‌های اجتماعی دارم. یک تیم کوچک را هم مدیریت کدم.", note: "*I also managed a small team* یک تجربهٔ اضافی دیگه را معرفی می‌کنه."}
  en.a2.unit30.lesson04.teach.q_what_strength: {title: "سوال دربارهٔ نقطهٔ قوت", gloss: "مصاحبه‌کننده می‌گه: خیلی خوبه. یکی از نقطه‌های قوت‌تان چیست؟", note: "همو کلمهٔ *strength* که در درس اول یاد گرفتین."}
  en.a2.unit30.lesson04.teach.a_organized_deadlines: {title: "جواب میا دربارهٔ نقطهٔ قوت", gloss: "میا می‌گه: خیلی منظم استم، و به میعادها می‌رسم.", note: "*I meet deadlines* یعنی همیشه به‌موقع کار را تمام می‌کنه."}
  en.a2.unit30.lesson04.teach.q_have_questions: {title: "سوال دربارهٔ سوال‌های شما", gloss: "مصاحبه‌کننده می‌گه: کدام سوالی دربارهٔ وظیفه دارین؟", note: "در پایان مصاحبه معمولاً از کاندید سوال پرسیده می‌شه."}
  en.a2.unit30.lesson04.teach.a_wondering_typical_week: {title: "سوال میا از مصاحبه‌کننده", gloss: "میا می‌گه: بلی، می‌خواستم بدانم یک هفتهٔ معمولی در همی پُست چطوره.", note: "*I was wondering what...* یک سوال غیرمستقیم و مؤدبانه استه."}

