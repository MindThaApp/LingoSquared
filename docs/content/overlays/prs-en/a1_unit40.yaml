      - {left: "letter", right: "پیام نوشته‌شده‌ای که برای کسی می‌فرستین"}
      - {left: "package", right: "بسته‌ای که از نامه کلان‌تر استه"}
      - {left: "stamp", right: "برچسب کوچکی که برای پرداخت هزینهٔ ارسال می‌چسپانین"}
      - {left: "envelope", right: "پاکتی که نامه را در آن می‌مانین"}
      - {left: "mailbox", right: "جایی که نامه‌ها را داخلش می‌اندازن"}
    accepted_answers:
      - value:
          - {left: "post office", right: "جایی که نامه می‌فرستین و تمبر می‌خرین"}
          - {left: "letter", right: "پیام نوشته‌شده‌ای که برای کسی می‌فرستین"}
          - {left: "package", right: "بسته‌ای که از نامه کلان‌تر استه"}
          - {left: "stamp", right: "برچسب کوچکی که برای پرداخت هزینهٔ ارسال می‌چسپانین"}
          - {left: "envelope", right: "پاکتی که نامه را در آن می‌مانین"}
          - {left: "mailbox", right: "جایی که نامه‌ها را داخلش می‌اندازن"}
        status: "correct"
    feedback: "post office=پوسته خانه، letter=مکتوب، package=پارسل، stamp=تمبر، envelope=پاکت، mailbox=صندوق پوسته."
  en.a1.unit40.lesson01.exercise04.order_stamp_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "a", "stamp", "for", "this", "letter."], status: "correct"}]
    feedback: "ترتیب درست: I need a stamp for this letter."
  en.a1.unit40.lesson01.exercise05.write_envelope_word:
    instruction: "کلمه‌ای را بنویسین که یعنی پاکت کاغذی که مکتوب را در آن می‌مانین."
    accepted_answers: [{value: "envelope", status: "correct"}]
    feedback: "envelope یعنی پاکت."

  en.a1.unit40.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "express mail"
    distractors: ["send a letter", "buy a stamp", "write the address"]
    accepted_answers: [{value: "express mail", status: "correct"}]
    feedback: "express mail یعنی پوستهٔ عاجل."
  en.a1.unit40.lesson02.exercise02.choose_how_long_meaning:
    instruction: "کدام عبارت دربارهٔ مقدار وختی که تا رسیدن یک چیز لازم استه می‌پرسه؟"
    correct_option: "how long will it take"
    distractors: ["send a letter", "buy a stamp", "express mail"]
    accepted_answers: [{value: "how long will it take", status: "correct"}]
    feedback: "how long will it take یعنی چند وخت می‌گیره."
  en.a1.unit40.lesson02.exercise03.choose_write_address_meaning:
    instruction: "کدام عبارت یعنی نوشتن آدرس مقصد روی یک مکتوب یا پارسل؟"
    correct_option: "write the address"
    distractors: ["send a letter", "buy a stamp", "express mail"]
    accepted_answers: [{value: "write the address", status: "correct"}]
    feedback: "write the address یعنی آدرس نوشتن."
  en.a1.unit40.lesson02.exercise04.order_how_long_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["How", "long", "will", "it", "take", "to", "arrive?"], status: "correct"}]
    feedback: "ترتیب درست: How long will it take to arrive?"
  en.a1.unit40.lesson02.exercise05.translate_how_much_does_it_cost:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «فرستادن این چند پیسه می‌شه؟»"
    accepted_answers:
      - {value: "How much does it cost to send this?", status: "correct"}
      - {value: "How much does it cost to send this", status: "correct"}
    feedback: "How much does it cost to send this?"

  en.a1.unit40.lesson03.exercise01.comprehension_package_recipient:
    instruction: "مطابق گپ، پارسل دنیل برای کیس؟"
    correct_option: "sister"
    distractors: ["brother", "mother", "friend"]
    accepted_answers: [{value: "sister", status: "correct"}]
    feedback: "دنیل می‌گه a birthday gift for my sister."
  en.a1.unit40.lesson03.exercise02.comprehension_shipping_cost:
    instruction: "مطابق گپ، دنیل چند پیسه برای فرستادن پارسل پرداخت می‌کنه؟"
    correct_option: "twelve dollars"
    distractors: ["ten dollars", "twenty dollars", "fifteen dollars"]
    accepted_answers: [{value: "twelve dollars", status: "correct"}]
    feedback: "کارمند می‌گه That's twelve dollars."
  en.a1.unit40.lesson03.exercise03.listen_dialogue_clerk_question:
    instruction: "مطابق گپ، کارمند اول از دنیل چی می‌پرسه؟"
    correct_option: "where is it going"
    distractors: ["how much do you want to pay", "do you have a stamp already", "what is inside the package"]
    accepted_answers: [{value: "where is it going", status: "correct"}]
    feedback: "کارمند می‌پرسه Where is it going؟"
  en.a1.unit40.lesson03.exercise04.respond_own_mail:
    instruction: "چیزی در بارهٔ فرستادن پوسته بگین، یا بپرسین چند پیسه می‌شه یا چند وخت می‌گیره."
    accepted_answers: ["I need to buy a stamp", "I need to buy a stamp.", "I want to send a letter", "I want to send a letter.", "I want to send a package", "I want to send a package.", "How long will it take?", "How much does it cost?"]
    feedback: "می‌تانین بگین I need to buy a stamp یا بپرسین How long will it take؟"

  en.a1.unit40.lesson04.exercise01.reading_daniel_shipping_choice:
    instruction: "مطابق متن، دنیل چی پرداخت کرد تا پارسلش زود برسه؟"
    correct_option: "express mail"
    distractors: ["regular mail", "a bigger box", "insurance"]
    accepted_answers: [{value: "express mail", status: "correct"}]
    feedback: "متن می‌گه He paid for express mail."
  en.a1.unit40.lesson04.exercise02.reading_leila_book_recipient:
    instruction: "مطابق متن، لیلا کتاب‌های کهنه را برای کی فرستاد؟"
    correct_option: "parents"
    distractors: ["her sister", "Mia", "Daniel"]
    accepted_answers: [{value: "parents", status: "correct"}]
    feedback: "متن می‌گه to send some old books to her parents."
  en.a1.unit40.lesson04.exercise03.reading_mia_stamp_habit:
    instruction: "مطابق متن، میا برای مکتوب‌هایی که به بی‌بی‌اش می‌نویسه همیشه چی می‌خره؟"
    correct_option: "stamp"
    distractors: ["envelope", "package", "postcard"]
    accepted_answers: [{value: "stamp", status: "correct"}]
    feedback: "متن می‌گه she always buys a stamp for the letters."
  en.a1.unit40.lesson04.exercise04.write_own_mail_sentence:
    instruction: "یک جمله در بارهٔ فرستادن یک مکتوب یا پارسل بنویسین، با «I send/sent a ...» یا «I need a stamp for ...»."
    accepted_answers: ["I send a package", "I send a package.", "I sent a package", "I sent a package.", "I need a stamp for this letter", "I need a stamp for this letter.", "I need a stamp for this postcard", "I need a stamp for this postcard."]
    feedback: "می‌تانین از الگوی I send a.../I need a stamp for... کار بگیرین."
