review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit40 (post office), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the how-long-will-it-take card: English marks future time with the dedicated auxiliary will (How long will it take?), while Dari uses the ordinary simple-present form for near-future meaning with no separate future auxiliary (چند وخت می‌گیره؟, literally present tense, understood as future from context). Dari-specific vocabulary used for authenticity: پوسته خانه for post office (not the Iranian پستخانه/اداره پست), ماندن for \"to put\" (Dari's normal verb for this, where Iranian Farsi uses گذاشتن), پیسه as the Dari colloquial word for money in general, and بی‌بی for grandmother (not the Iranian مادربزرگ) in the lesson04 reading passage. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit40.post: {title: "در پوسته خانه"}

lessons:
  en.a1.unit40.lesson01.post_office_vocabulary: {title: "در پوسته خانه"}
  en.a1.unit40.lesson02.sending_mail: {title: "فرستادن پوسته"}
  en.a1.unit40.lesson03.dialogue_at_the_post_office: {title: "گپ در پوسته خانه"}
  en.a1.unit40.lesson04.three_trips_to_the_post_office: {title: "متن: سه سفر به پوسته خانه"}

teaching:
  en.a1.unit40.lesson01.teach.post_office: {title: "post office", gloss: "پوسته خانه", note: "post office یعنی پوسته خانه -- جایی که در آن پوسته می‌فرستین و تمبر می‌خرین.", example_gloss: "من به پوسته خانه می‌رم تا مکتوب بفرستم."}
  en.a1.unit40.lesson01.teach.letter: {title: "letter", gloss: "مکتوب", note: "letter یعنی مکتوب -- پیام نوشته‌شده که برای کسی می‌فرستین.", example_gloss: "من برای دوستم یک مکتوب می‌نویسم."}
  en.a1.unit40.lesson01.teach.package: {title: "package", gloss: "پارسل", note: "package یعنی پارسل -- یک بکس که همرایش چیزهایی می‌فرستین.", example_gloss: "من برای خواهرم یک پارسل می‌فرستم."}
  en.a1.unit40.lesson01.teach.stamp: {title: "stamp", gloss: "تمبر", note: "stamp یعنی تمبر -- یک برچسپ خورد که برای پرداخت پول فرستادن پوسته روی آن می‌مانین.", example_gloss: "برای این مکتوب یک تمبر ضرورت دارم."}
  en.a1.unit40.lesson01.teach.envelope: {title: "envelope", gloss: "پاکت", note: "envelope یعنی پاکت -- پاکت کاغذی که مکتوب را در آن می‌مانین.", example_gloss: "مکتوب را در یک پاکت می‌مانم."}
  en.a1.unit40.lesson01.teach.mailbox: {title: "mailbox", gloss: "صندوق پوسته", note: "mailbox یعنی صندوق پوسته -- بکسی که پوستهٔ روان یا رسیده در آن می‌مانه.", example_gloss: "صندوق پوسته کنار پوسته خانه استه."}

  en.a1.unit40.lesson02.teach.send_a_letter: {title: "send a letter", gloss: "مکتوب فرستادن", note: "send a letter یعنی مکتوب فرستادن.", example_gloss: "می‌خواهم برای والدینم یک مکتوب بفرستم."}
  en.a1.unit40.lesson02.teach.buy_a_stamp: {title: "buy a stamp", gloss: "تمبر خریدن", note: "buy a stamp یعنی تمبر خریدن.", example_gloss: "برای این پوستکارد ضرورت دارم یک تمبر بخرم."}
  en.a1.unit40.lesson02.teach.write_the_address: {title: "write the address", gloss: "آدرس نوشتن", note: "write the address یعنی آدرس مقصد را روی یک مکتوب یا پارسل نوشتن.", example_gloss: "لطفاً آدرس را روی پارسل بنویسین."}
  en.a1.unit40.lesson02.teach.how_long_will_it_take: {title: "how long will it take", gloss: "چند وخت می‌گیره", note: "how long will it take یعنی چند وخت می‌گیره. نکتهٔ گرامری: انگلیسی وخت آینده را با فعل کمکی will نشان می‌ده (will it take؟)، درحالیکه دری برای همین معنای آیندهٔ نزدیک از فعل حال ساده کار می‌گیره، بدون فعل کمکی جدا برای آینده (چند وخت می‌گیره؟ -- فعل حال، خو معنایش آینده استه).", example_gloss: "رسیدنش چند وخت می‌گیره؟"}
  en.a1.unit40.lesson02.teach.express_mail: {title: "express mail", gloss: "پوستهٔ عاجل", note: "express mail یعنی پوستهٔ عاجل -- پوسته‌ای که تیزتر از پوستهٔ معمولی می‌رسه.", example_gloss: "پوستهٔ عاجل از پوستهٔ معمولی تیزتر استه."}
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question: {title: "How much does it cost to send this?", gloss: "فرستادن این چند پیسه می‌شه؟", note: "پیسه کلمهٔ رایج دری برای پول به طور عمومی استه."}

  en.a1.unit40.lesson03.teach.dialogue_line1: {title: "دنیل می‌گه", gloss: "سلام، می‌خواهم این پارسل را بفرستم، لطفاً.", note: "شروع گپ در پوسته خانه."}
  en.a1.unit40.lesson03.teach.dialogue_line2: {title: "کارمند می‌پرسه", gloss: "بلی! کجا می‌ره؟", note: "Where is it going؟ سوال دربارهٔ مقصد."}
  en.a1.unit40.lesson03.teach.dialogue_line3: {title: "جواب دنیل", gloss: "به شیکاگو. این یک تحفهٔ سالگره برای خواهرم استه.", note: "birthday gift یعنی تحفهٔ سالگره."}
  en.a1.unit40.lesson03.teach.dialogue_line4: {title: "کارمند می‌پرسه", gloss: "پوستهٔ معمولی می‌خواهی یا عاجل؟ عاجل تقریباً دو روز می‌گیره.", note: "regular or express -- دو گزینهٔ فرستادن پوسته."}
  en.a1.unit40.lesson03.teach.dialogue_line5: {title: "جواب دنیل", gloss: "عاجل را می‌گیرم، لطفاً. قیمتش چند استه؟", note: "I'll take یعنی می‌گیرم/انتخاب می‌کنم."}
  en.a1.unit40.lesson03.teach.dialogue_line6: {title: "جواب کارمند", gloss: "دوازده دالر می‌شه. اینه رسیدت.", note: "here's یک شکل کوتاه‌شدهٔ here is استه."}
  en.a1.unit40.lesson03.teach.dialogue_line7: {title: "جواب دنیل", gloss: "تشکر! روز خوبی داشته باشین.", note: "Have a good day -- یک طریقهٔ رایج برای خداحافظی مؤدبانه."}

  en.a1.unit40.lesson04.teach.reading_passage: {title: "متن: سه سفر به پوسته خانه", gloss: "دنیل، لیلا و میا هرسه راه پوسته خانه را خوب می‌شناسن. هفتهٔ پیش، دنیل یک پارسل سالگره برای خواهرش در شیکاگو فرستاد. او پول پوستهٔ عاجل را پرداخت چون می‌خواست زود برسه، و فقط دو روز وخت گرفت. لیلا دارد آمادهٔ کوچ‌کردن به نزدیک میا می‌شه، پس به پوسته خانه رفت تا چند کتاب کهنه برای والدینش بفرسته. کارمند پارسل را وزن کرد و یک تمبر برایش داد. لیلا پرسید که پارسل چند وخت می‌گیره، و کارمند گفت تقریباً یک هفته، چون او پوستهٔ معمولی را انتخاب کرده بود. میا زیاد پارسل نمی‌فرسته، خو همیشه برای مکتوب‌هایی که به بی‌بی‌اش می‌نویسه یک تمبر می‌خره. او می‌گه یک مکتوب با تمبر از یک پیام متنی شخصی‌تر احساس می‌شه.", note: "این متن چند عبارت مربوط به پوسته خانه را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit40.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "stamp"
    distractors: ["letter", "package", "envelope"]
    accepted_answers: [{value: "stamp", status: "correct"}]
    feedback: "stamp یعنی تمبر."
  en.a1.unit40.lesson01.exercise02.choose_envelope_meaning:
    instruction: "کدام کلمه یعنی پاکت کاغذی که مکتوب را در آن می‌مانین؟"
    correct_option: "envelope"
    distractors: ["letter", "package", "mailbox"]
    accepted_answers: [{value: "envelope", status: "correct"}]
    feedback: "envelope یعنی پاکت."
  en.a1.unit40.lesson01.exercise03.match_post_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح دری آن وصل کنین."
