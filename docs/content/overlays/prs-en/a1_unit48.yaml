generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific library-visit phrase source material (DLI Dari Basic Course) -- no dedicated library-borrowing lesson surfaced in the sections checked. No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit48 (library), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all five lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit48.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit48.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: borrow (in a library/loan sense) -> امانت گرفتن (a formal-but-common Dari phrase for taking something 'on trust/loan,' used specifically for library items in both dialects but favored here over the more generic قرض گرفتن to keep the library register distinct); the rest of the vocabulary (کتابخانه/library, پس دادن/return, کارت کتابخانه/library card) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌خواد for می‌شود/می‌خواهد, ایگه as the informal 'here it is' presentative, خانه‌پری کو as the informal imperative for 'fill out'). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's present-perfect-plus-'ever' construction for lifetime experience (I don't think I've ever borrowed a book...) has no equivalent verb tense in Dari, which expresses the same lifetime-experience meaning with plain simple past plus the adverb هیچ‌وخت ('never'), so a Dari speaker must learn the have-plus-past-participle pattern as a fixed English chunk rather than expect a matching Dari verb form; (2) English's stand-alone adjective 'due' (meaning scheduled/expected to be returned) has no single-word Dari equivalent -- Dari needs a full relative clause (وختی که باید پس داده شه, 'the time it must be given back') to express the same idea, so 'due' is a genuine one-word-vs-clause gap to memorize. Three-speaker dialogue (Leila, Daniel, and the Librarian NPC) handled the same way as the realization's own three-speaker structure -- each turn given its own teaching entry with a short Dari label distinguishing speaker identity in the title field, same pattern as the two-speaker units. Same-speaker-distractor check performed per the standing CLAUDE.md footgun: lesson03.exercise03's listen_select tests when Leila's new book is due (correct_option 'in three weeks', the Librarian's own line) -- no other duration/time value is spoken anywhere else in the dialogue by any speaker, matching the realization's own stated reasoning that the exercise is unambiguous by construction. Multi-clause accepted_answers (lesson04's write_own_library_message) mirrors the realization's own six variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit48.library: {title: "رفتن به کتابخانه"}

lessons:
  en.a1.unit48.lesson01.library_vocabulary: {title: "کلمات کتابخانه"}
  en.a1.unit48.lesson02.borrowing_a_book: {title: "امانت گرفتن یک کتاب"}
  en.a1.unit48.lesson03.dialogue_at_the_library: {title: "گفتگو: توی کتابخانه"}
  en.a1.unit48.lesson04.how_libraries_work: {title: "متن: کتابخانه‌ها چطور کار می‌کنن"}

teaching:
  en.a1.unit48.lesson01.teach.library: {title: "library", gloss: "کتابخانه", note: "library یعنی کتابخانه -- جایی که می‌تانین کتاب امانت بگیرین.", example_gloss: "هر هفته به کتابخانه می‌رم."}
  en.a1.unit48.lesson01.teach.borrow: {title: "borrow", gloss: "امانت گرفتن", note: "borrow یعنی یک چیز را گرفتن و بعداً پس دادنش.", example_gloss: "می‌خواهم این کتاب را امانت بگیرم."}
  en.a1.unit48.lesson01.teach.return: {title: "return", gloss: "پس دادن", note: "return یعنی یک چیز را پس دادن.", example_gloss: "می‌تانم این کتاب را پس بتم؟"}
  en.a1.unit48.lesson01.teach.due: {title: "due", gloss: "موعد پس‌دادن", note: "due یعنی روزی که باید یک چیز پس داده شه. در انگلیسی این یک صفت واحد استه، خو در دری معمولاً با یک جمله بیان می‌شه (وختی که باید پس داده شه).", example_gloss: "کی باید پس داده شه؟"}
  en.a1.unit48.lesson01.teach.card: {title: "library card", gloss: "کارت کتابخانه", note: "library card یعنی کارتی که به تان اجازه می‌ته چیزها را از کتابخانه امانت بگیرین.", example_gloss: "این کارت کتابخانه‌ام استه."}

  en.a1.unit48.lesson02.teach.do_you_have_a_library_card: {title: "Do you have a library card?", gloss: "کارت کتابخانه داری؟", note: "Do you have ...? ساختار سوالی معمول با فعل کمکی do استه."}
  en.a1.unit48.lesson02.teach.yes_heres_my_library_card: {title: "Yes, here's my library card.", gloss: "بلی، ایگه کارت کتابخانه‌ام.", note: "here's یعنی here is کوتاه شده -- وخت نشان دادن یک چیز کار می‌ره."}
  en.a1.unit48.lesson02.teach.id_like_to_borrow_this_book: {title: "I'd like to borrow this book.", gloss: "می‌خواهم این کتاب را امانت بگیرم.", note: "I'd like to ... طریقهٔ مؤدبانهٔ I want to استه."}
  en.a1.unit48.lesson02.teach.when_is_this_book_due: {title: "When is this book due?", gloss: "این کتاب کی باید پس داده شه؟", note: "همو کلمهٔ due که در لسن ۱ یاد گرفتین."}
  en.a1.unit48.lesson02.teach.can_i_return_this_book: {title: "Can I return this book?", gloss: "می‌تانم این کتاب را پس بتم؟", note: "Can I ...? طریقهٔ مؤدبانهٔ خواستن اجازه استه."}
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday: {title: "Your book is due on Friday.", gloss: "کتاب تان باید جمعه پس داده شه.", note: "is due on + روز هفته یعنی «باید در روز ___ پس داده شه»."}

  en.a1.unit48.lesson03.teach.dialogue_line1: {title: "گپ لیلا", gloss: "باید این کتاب را در کتابخانه پس بتم. می‌خواهی همرایم بیایی؟", note: "Do you want to ...? یک طریقهٔ معمول برای دعوت کردن کسی استه."}
  en.a1.unit48.lesson03.teach.dialogue_line2: {title: "جواب دانیال", gloss: "البته! فکر نمی‌کنم هیچ‌وخت از یک کتابخانه کتاب امانت گرفته باشم.", note: "I've ever borrowed یک ساختار حال کامل با ever استه -- برای گفتن اینکه در تمام زندگی‌ات یک کاری را نکردی کار می‌ره. دری همو معنا را با گذشتهٔ ساده + هیچ‌وخت می‌رساند."}
  en.a1.unit48.lesson03.teach.dialogue_line3: {title: "گفتهٔ لیلا", gloss: "سلام، می‌خواهم این کتاب را پس بتم، و می‌خواهم یک کتاب جدید هم امانت بگیرم.", note: "too در آخر جمله یعنی «هم»."}
  en.a1.unit48.lesson03.teach.dialogue_line4: {title: "گپ کتابدار", gloss: "خوب استه، تشکر. کارت کتابخانه‌ات همرایته؟", note: "Do you have your ...? همو ساختار سوالی که در لسن ۲ یاد گرفتین."}
  en.a1.unit48.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "بلی، ایگه استه.", note: "here it is یعنی ایگه استه -- برای نشان دادن یک چیز کار می‌ره."}
  en.a1.unit48.lesson03.teach.dialogue_line6: {title: "گفتهٔ کتابدار", gloss: "عالی. این کتاب جدید باید بعد از سه هفته پس داده شه.", note: "due back in three weeks یعنی باید بعد از سه هفته پس داده شه."}
  en.a1.unit48.lesson03.teach.dialogue_line7: {title: "سوال دانیال", gloss: "می‌تانم من هم یک کارت کتابخانه بگیرم؟ می‌خواهم یک کتاب آشپزی امانت بگیرم.", note: "cookbook یعنی کتاب آشپزی."}
  en.a1.unit48.lesson03.teach.dialogue_line8: {title: "جواب کتابدار", gloss: "البته! فقط این فورم را خانه‌پری کو.", note: "fill out یک فعل مرکب (phrasal verb) به معنی خانه‌پری کردن یک فورم استه."}

  en.a1.unit48.lesson04.teach.reading_passage: {title: "متن: کتابخانه‌ها چطور کار می‌کنن", gloss: "رفتن به کتابخانه: اکثر کتابخانه‌ها به تان اجازه می‌تن کتاب، و بعضی وخت‌ها چیزهای دیگه را هم، برای چند هفته امانت بگیرین. برای امانت گرفتن یک چیز، معمولاً به یک کارت کتابخانه ضرورت دارین. وقتی یک کتاب امانت می‌گیرین، کتابدار موعد پس‌دادن را به تان می‌گه -- روزی که باید پس بتینش. اگه تا آن وخت تمامش نکنین، معمولاً می‌تانین از کتابدار وخت بیشتر بخواین. از وقتی که لیلا به آپارتمان جدیدش کوچ کرد، به اندازهٔ پیش کتاب نداره، پس شروع کرد که به‌عوضش از کتابخانه امانت بگیره. هفتهٔ پیش، او یک کتاب را پس داد و یکی جدید گرفت، و دوستش دانیال هم همرایش رفت. او هیچ‌وخت پیش‌تر از کتابخانه کتاب امانت نگرفته بود، پس خودش هم یک کارت کتابخانه گرفت و یک کتاب آشپزی گرفت تا در تمرین رسپی‌هایی که میا به او یاد می‌ته کمکش کنه. کتابدار به هردوی شان یادآوری کرد که کتاب‌های شان را پیش از موعد پس بتن. میا زیاد به کتابخانه نمی‌ره، خو یک بار برای صنفش یک کتاب عکاسی امانت گرفته بود.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- moved, started, returned, picked, came, got, checked, reminded."}

exercises:
  en.a1.unit48.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "borrow"
    distractors: ["library", "return", "due", "card"]
    accepted_answers: [{value: "borrow", status: "correct"}]
    feedback: "borrow یعنی امانت گرفتن."
  en.a1.unit48.lesson01.exercise02.choose_return_meaning:
    instruction: "کدام کلمه یعنی یک چیز را پس دادن؟"
    correct_option: "return"
    distractors: ["borrow", "due", "card"]
    accepted_answers: [{value: "return", status: "correct"}]
    feedback: "return یعنی پس دادن."
  en.a1.unit48.lesson01.exercise03.match_library_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "a place where you can borrow books", "right": "library"}, {"left": "to take something and bring it back later", "right": "borrow"}, {"left": "to give something back", "right": "return"}, {"left": "the day something needs to be given back", "right": "due"}, {"left": "a card that lets you borrow library items", "right": "card"}], "status": "correct"}]
    feedback: "library=کتابخانه، borrow=امانت گرفتن، return=پس دادن، due=موعد پس‌دادن، card=کارت کتابخانه."
  en.a1.unit48.lesson01.exercise04.order_borrow_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I'd", "like", "to", "borrow", "this", "book."], status: "correct"}]
    feedback: "ترتیب درست: I'd like to borrow this book."
  en.a1.unit48.lesson01.exercise05.write_return_word:
    instruction: "کلمه‌ای را بنویسین که یعنی یک چیز را پس دادن."
    accepted_answers: [{value: "return", status: "correct"}]
    feedback: "return یعنی پس دادن."

  en.a1.unit48.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Do you have a library card?"
    distractors: ["I'd like to borrow this book.", "Can I return this book?", "Your book is due on Friday."]
    accepted_answers: [{value: "Do you have a library card?", status: "correct"}]
    feedback: "Do you have a library card? یعنی کارت کتابخانه داری؟"
  en.a1.unit48.lesson02.exercise02.choose_borrow_meaning:
    instruction: "کدام عبارت را برای خواستن یک کتاب به خانه می‌گین؟"
    correct_option: "I'd like to borrow this book."
    distractors: ["Do you have a library card?", "Can I return this book?", "When is this book due?"]
    accepted_answers: [{value: "I'd like to borrow this book.", status: "correct"}]
    feedback: "I'd like to borrow this book. یعنی می‌خواهم این کتاب را امانت بگیرم."
  en.a1.unit48.lesson02.exercise03.choose_due_friday_meaning:
    instruction: "کدام عبارت به تان می‌گه کی باید کتاب تان را پس بتین؟"
    correct_option: "Your book is due on Friday."
    distractors: ["I'd like to borrow this book.", "Do you have a library card?", "Can I return this book?"]
    accepted_answers: [{value: "Your book is due on Friday.", status: "correct"}]
    feedback: "Your book is due on Friday. یعنی کتاب تان باید جمعه پس داده شه."
  en.a1.unit48.lesson02.exercise04.order_return_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "I", "return", "this", "book?"], status: "correct"}]
    feedback: "ترتیب درست: Can I return this book?"
  en.a1.unit48.lesson02.exercise05.translate_when_due:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «این کتاب کی باید پس داده شه؟»"
    accepted_answers:
      - {value: "When is this book due?", status: "correct"}
      - {value: "When is this book due", status: "correct"}
    feedback: "When is this book due? یعنی این کتاب کی باید پس داده شه؟"

  en.a1.unit48.lesson03.exercise01.comprehension_why_leila_goes:
    instruction: "مطابق گفتگو، لیلا چرا به کتابخانه می‌ره؟"
    correct_option: "to return a book"
    distractors: ["to buy a book", "to meet the librarian", "to read a magazine"]
    accepted_answers: [{value: "to return a book", status: "correct"}]
    feedback: "لیلا برای پس دادن یک کتاب می‌ره (to return a book)."
  en.a1.unit48.lesson03.exercise02.comprehension_what_daniel_wants:
    instruction: "مطابق گفتگو، دانیال می‌خواد چه چیزی را امانت بگیره؟"
    correct_option: "a cookbook"
    distractors: ["a photography book", "a magazine", "a dictionary"]
    accepted_answers: [{value: "a cookbook", status: "correct"}]
    feedback: "دانیال می‌خواد یک کتاب آشپزی (a cookbook) امانت بگیره."
  en.a1.unit48.lesson03.exercise03.listen_dialogue_due_time:
    instruction: "مطابق گفتگو، کتاب جدید لیلا کی باید پس داده شه؟"
    correct_option: "in three weeks"
    distractors: ["in one week", "in one month", "tomorrow"]
    accepted_answers: [{value: "in three weeks", status: "correct"}]
    feedback: "کتاب جدید لیلا بعد از سه هفته باید پس داده شه (in three weeks)."
  en.a1.unit48.lesson03.exercise04.respond_own_library_request:
    instruction: "بگین که می‌خواین یک کتاب امانت بگیرین، یا بپرسین که کارت کتابخانه ضرورت استه یا نی."
    accepted_answers: ["I'd like to borrow this book", "I'd like to borrow this book.", "I'd like to borrow a book", "I'd like to borrow a book.", "Do you have a library card?", "Can I return this book?", "When is this book due?"]
    feedback: "می‌تانین بگین I'd like to borrow this book یا بپرسین Do you have a library card؟"

  en.a1.unit48.lesson04.exercise01.reading_why_leila_borrows:
    instruction: "مطابق متن، لیلا حالی چرا از کتابخانه کتاب امانت می‌گیره؟"
    correct_option: "she doesn't own as many books as she used to"
    distractors: ["books are too expensive now", "her books were lost", "she likes the librarian"]
    accepted_answers: [{value: "she doesn't own as many books as she used to", status: "correct"}]
    feedback: "متن می‌گه لیلا حالی به اندازهٔ پیش کتاب نداره."
  en.a1.unit48.lesson04.exercise02.reading_what_daniel_checked_out:
    instruction: "مطابق متن، دانیال چه کتابی گرفت؟"
    correct_option: "a cookbook"
    distractors: ["a photography book", "a magazine", "a novel"]
    accepted_answers: [{value: "a cookbook", status: "correct"}]
    feedback: "دانیال یک کتاب آشپزی (a cookbook) گرفت."
  en.a1.unit48.lesson04.exercise03.reading_what_to_do_if_late:
    instruction: "مطابق متن، اگه تا موعد کتاب را تمام نکنین چه کار باید کنین؟"
    correct_option: "ask the librarian for more time"
    distractors: ["pay a fine right away", "keep the book forever", "return it without asking"]
    accepted_answers: [{value: "ask the librarian for more time", status: "correct"}]
    feedback: "متن می‌گه می‌تانین از کتابدار وخت بیشتر بخواین."
  en.a1.unit48.lesson04.exercise04.write_own_library_message:
    instruction: "یک پیام کوتاه بنویسین: بگین می‌خواین یک کتاب امانت بگیرین و بپرسین که کارت کتابخانه ضرورت استه یا نی."
    accepted_answers:
      - {value: "I'd like to borrow this book. Do I need a library card?", status: "correct"}
      - {value: "I'd like to borrow this book. Do I need a library card.", status: "correct"}
      - {value: "I'd like to borrow this book, do I need a library card?", status: "correct"}
      - {value: "I'd like to borrow this book, and do I need a library card?", status: "correct"}
      - {value: "I'd like to borrow a book. Do I need a library card?", status: "correct"}
      - {value: "I'd like to borrow a book. Do I need a library card.", status: "correct"}
    feedback: "می‌تانین بگین: I'd like to borrow this book. Do I need a library card?"
