course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit61.apologies_excuses: {title: "معذرت‌خواهی و بهانه‌ها"}

lessons:
  en.a1.unit61.lesson01.apology_words: {title: "کلمات معذرت‌خواهی"}
  en.a1.unit61.lesson02.apology_phrases: {title: "عبارات معذرت‌خواهی"}
  en.a1.unit61.lesson03.dialogue_saying_sorry: {title: "گفتگو: معذرت گفتن"}
  en.a1.unit61.lesson04.late_for_class: {title: "متن: ناوقت به کورس رسیدن"}

teaching:
  en.a1.unit61.lesson01.teach.sorry: {title: "sorry", gloss: "معذرت", note: "sorry یعنی معذرت -- وقتی اشتباه می‌کنین یا کسی را ناراحت می‌کنین.", example_gloss: "معذرت می‌خواهم."}
  en.a1.unit61.lesson01.teach.late: {title: "late", gloss: "ناوقت", note: "late یعنی ناوقت -- به وقت نرسیدن.", example_gloss: "من ناوقت استم."}
  en.a1.unit61.lesson01.teach.excuse: {title: "excuse", gloss: "بهانه / دلیل", note: "excuse یعنی دلیلی که برای یک مشکل یا ناوقت رسیدن می‌گین.", example_gloss: "این بهانهٔ من استه."}
  en.a1.unit61.lesson01.teach.traffic: {title: "traffic", gloss: "ترافیک", note: "traffic یعنی موترهای زیاد در سرک که رفت‌وآمد را کند می‌کنه.", example_gloss: "ترافیک خراب استه."}
  en.a1.unit61.lesson01.teach.mistake: {title: "mistake", gloss: "اشتباه", note: "mistake یعنی کاری که غلط انجام شده.", example_gloss: "من یک اشتباه کردم."}
  en.a1.unit61.lesson01.teach.problem: {title: "problem", gloss: "مشکل", note: "problem یعنی چیزی که غلط، سخت یا مشکل‌ساز استه.", example_gloss: "کدام مشکل نیست."}

  en.a1.unit61.lesson02.teach.im_sorry: {title: "I'm sorry.", gloss: "معذرت می‌خواهم.", note: "I'm sorry ساده‌ترین معذرت‌خواهی در انگلیسی استه."}
  en.a1.unit61.lesson02.teach.im_late: {title: "I'm late.", gloss: "من ناوقت استم.", note: "late صفت استه؛ با am می‌آیه: I'm late."}
  en.a1.unit61.lesson02.teach.bus_is_late: {title: "The bus is late.", gloss: "بس ناوقت استه.", note: "این جمله دلیل ناوقت رسیدن را می‌ته."}
  en.a1.unit61.lesson02.teach.thats_okay: {title: "That's okay.", gloss: "خیر استه.", note: "That's okay برای قبول کردن معذرت یا آرام کردن طرف مقابل کار می‌ره."}
  en.a1.unit61.lesson02.teach.no_problem: {title: "No problem.", gloss: "کدام مشکل نیست.", note: "No problem یعنی مشکل نیست؛ در جواب معذرت هم زیاد گفته می‌شه."}
  en.a1.unit61.lesson02.teach.made_mistake: {title: "I made a mistake.", gloss: "من یک اشتباه کردم.", note: "در انگلیسی با mistake معمولاً فعل make کار می‌ره: make a mistake."}

  en.a1.unit61.lesson03.teach.dialogue_line1: {title: "معذرت دانیال", gloss: "سلام میا. معذرت، ناوقت رسیدم.", note: "I'm sorry I'm late یک معذرت کامل با دلیل کوتاه استه."}
  en.a1.unit61.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "خیر استه.", note: "That's okay معذرت را قبول می‌کنه."}
  en.a1.unit61.lesson03.teach.dialogue_line3: {title: "دلیل دانیال", gloss: "بس ناوقت استه.", note: "The bus is late دلیل بیرونی برای تاخیر استه."}
  en.a1.unit61.lesson03.teach.dialogue_line4: {title: "آرام کردن میا", gloss: "کدام مشکل نیست. می‌تانیم انتظار بکشیم.", note: "We can wait یعنی می‌تانیم صبر کنیم."}
  en.a1.unit61.lesson03.teach.dialogue_line5: {title: "توضیح دانیال", gloss: "من در وقت اشتباه کردم.", note: "with the time یعنی مربوط به وقت."}
  en.a1.unit61.lesson03.teach.dialogue_line6: {title: "اطمینان میا", gloss: "خیر استه. کورس ساعت سه شروع می‌شه.", note: "starts at three یعنی ساعت سه شروع می‌شه."}
  en.a1.unit61.lesson03.teach.dialogue_line7: {title: "تشکر دانیال", gloss: "تشکر که انتظار کشیدین.", note: "Thank you for waiting یعنی تشکر به خاطر صبر کردن."}

  en.a1.unit61.lesson04.teach.class_note: {title: "یادداشت کورس", gloss: "یادداشت کورس: کورس ساعت ۳:۰۰ شروع می‌شه. لطفاً به وقت بیایین. اگر ناوقت استین، یک پیام روان کنین.", note: "این یادداشت می‌گه کورس چه وقت شروع می‌شه و اگر ناوقت شدین چی کنین."}
  en.a1.unit61.lesson04.teach.reading_passage: {title: "متن: معذرت پیش از کورس", gloss: "معذرت پیش از کورس: دانیال به کورس ناوقت رسید چون بس ناوقت بود. او میا را بیرون صنف دید. دانیال گفت معذرت می‌خواهد. او همچنان گفت که در وقت اشتباه کرده. میا گفت خیر استه چون کورس ساعت ۳:۰۰ شروع می‌شه. دانیال یک پیام کوتاه به استاد روان کرد. پیام می‌گفت: معذرت، ناوقت رسیدم. بس ناوقت استه.", note: "این متن معذرت، دلیل و پیام کوتاه را با گذشتهٔ ساده تمرین می‌کنه."}

exercises:
  en.a1.unit61.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "sorry"
    distractors: ["happy", "ready", "busy", "early"]
    accepted_answers: [{value: "sorry", status: "correct"}]
    feedback: "sorry یعنی معذرت."
  en.a1.unit61.lesson01.exercise02.choose_late_meaning:
    instruction: "کدام کلمه یعنی به وقت نرسیدن؟"
    correct_option: "late"
    distractors: ["free", "open", "heavy"]
    accepted_answers: [{value: "late", status: "correct"}]
    feedback: "late یعنی ناوقت."
  en.a1.unit61.lesson01.exercise03.match_apology_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "sorry", right: "چیزی که پس از انجام کار غلط می‌گین"}
      - {left: "late", right: "به وقت نرسیدن"}
      - {left: "excuse", right: "دلیلی که برای یک مشکل می‌تین"}
      - {left: "traffic", right: "موترهای زیاد در سرک"}
      - {left: "mistake", right: "کاری که غلط انجام شده"}
      - {left: "problem", right: "چیزی که غلط یا دشوار استه"}
    accepted_answers:
      - value:
          - {left: "sorry", right: "چیزی که پس از انجام کار غلط می‌گین"}
          - {left: "late", right: "به وقت نرسیدن"}
          - {left: "excuse", right: "دلیلی که برای یک مشکل می‌تین"}
          - {left: "traffic", right: "موترهای زیاد در سرک"}
          - {left: "mistake", right: "کاری که غلط انجام شده"}
          - {left: "problem", right: "چیزی که غلط یا دشوار استه"}
        status: "correct"
    feedback: "sorry=معذرت، late=ناوقت، excuse=بهانه/دلیل، traffic=ترافیک، mistake=اشتباه، problem=مشکل."
  en.a1.unit61.lesson01.exercise04.order_sorry_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I'm", "sorry."], status: "correct"}]
    feedback: "ترتیب درست: I'm sorry."
  en.a1.unit61.lesson01.exercise05.write_mistake:
    instruction: "کلمه‌ای را بنویسین که یعنی کاری که غلط انجام شده."
    accepted_answers: [{value: "mistake", status: "correct"}]
    feedback: "mistake یعنی اشتباه."

  en.a1.unit61.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "The bus is late."
    distractors: ["The train is full.", "The class is open.", "The phone is here."]
    accepted_answers: [{value: "The bus is late.", status: "correct"}]
    feedback: "The bus is late. یعنی بس ناوقت استه."
  en.a1.unit61.lesson02.exercise02.choose_apology:
    instruction: "کدام عبارت یک معذرت ساده استه؟"
    correct_option: "I'm sorry."
    distractors: ["I'm late.", "That's okay.", "No problem."]
    accepted_answers: [{value: "I'm sorry.", status: "correct"}]
    feedback: "I'm sorry. یعنی معذرت می‌خواهم."
  en.a1.unit61.lesson02.exercise03.choose_acceptance:
    instruction: "کدام عبارت معذرت را قبول می‌کنه؟"
    correct_option: "That's okay."
    distractors: ["I'm sorry.", "I'm late.", "I made a mistake."]
    accepted_answers: [{value: "That's okay.", status: "correct"}]
    feedback: "That's okay. یعنی خیر استه."
  en.a1.unit61.lesson02.exercise04.order_bus_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "bus", "is", "late."], status: "correct"}]
    feedback: "ترتیب درست: The bus is late."
  en.a1.unit61.lesson02.exercise05.translate_no_problem:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «کدام مشکل نیست.»"
    accepted_answers:
      - {value: "No problem.", status: "correct"}
      - {value: "No problem", status: "correct"}
    feedback: "No problem. یعنی کدام مشکل نیست."

  en.a1.unit61.lesson03.exercise01.comprehension_reason:
    instruction: "مطابق گفتگو، چرا دانیال ناوقت استه؟"
    correct_option: "The bus is late."
    distractors: ["The class is full.", "The bank is closed.", "The phone is broken."]
    accepted_answers: [{value: "The bus is late.", status: "correct"}]
    feedback: "دانیال می‌گه بس ناوقت استه."
  en.a1.unit61.lesson03.exercise02.comprehension_class_time:
    instruction: "مطابق گفتگو، کورس ساعت چند شروع می‌شه؟"
    correct_option: "three"
    distractors: ["two", "four", "six"]
    accepted_answers: [{value: "three", status: "correct"}]
    feedback: "کورس ساعت سه شروع می‌شه."
  en.a1.unit61.lesson03.exercise03.listen_dialogue_apology:
    instruction: "دانیال کدام معذرت را می‌گه؟"
    correct_option: "I'm sorry I'm late."
    distractors: ["I'm happy today.", "I need a ticket.", "The class is here."]
    accepted_answers: [{value: "I'm sorry I'm late.", status: "correct"}]
    feedback: "دانیال می‌گه: I'm sorry I'm late."
  en.a1.unit61.lesson03.exercise04.respond_own_apology:
    instruction: "معذرت بگین، دلیل بتین، یا معذرت کسی را قبول کنین."
    accepted_answers: ["I'm sorry I'm late", "I'm sorry I'm late.", "The bus is late", "The bus is late.", "That's okay", "That's okay.", "No problem", "No problem."]
    feedback: "می‌تانین بگین I'm sorry I'm late یا No problem."

  en.a1.unit61.lesson04.exercise01.note_class_time:
    instruction: "مطابق یادداشت، کورس ساعت چند شروع می‌شه؟"
    correct_option: "3:00"
    distractors: ["2:00", "4:00", "6:00"]
    accepted_answers: [{value: "3:00", status: "correct"}]
    feedback: "یادداشت می‌گه کورس ساعت ۳:۰۰ شروع می‌شه."
  en.a1.unit61.lesson04.exercise02.note_late_action:
    instruction: "مطابق یادداشت، اگر ناوقت استین چی باید کنین؟"
    correct_option: "send a message"
    distractors: ["call back later", "open the door", "bring a drink"]
    accepted_answers: [{value: "send a message", status: "correct"}]
    feedback: "اگر ناوقت استین، باید یک پیام روان کنین."
  en.a1.unit61.lesson04.exercise03.reading_reason:
    instruction: "مطابق متن، چرا دانیال ناوقت بود؟"
    correct_option: "the bus was late"
    distractors: ["the class was full", "the bank was closed", "the phone was not clear"]
    accepted_answers: [{value: "the bus was late", status: "correct"}]
    feedback: "دانیال ناوقت بود چون بس ناوقت بود."
  en.a1.unit61.lesson04.exercise04.reading_who_waited:
    instruction: "مطابق متن، کی دانیال را بیرون صنف دید؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the teacher"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "میا دانیال را بیرون صنف دید."
  en.a1.unit61.lesson04.exercise05.write_own_apology_message:
    instruction: "یک پیام کوتاه بنویسین: برای ناوقت بودن معذرت بخواهین، و دلیل را بگین."
    accepted_answers:
      - {value: "I'm sorry I'm late. The bus is late.", status: "correct"}
      - {value: "I'm sorry I'm late, and the bus is late.", status: "correct"}
      - {value: "I'm sorry I'm late and the bus is late.", status: "correct"}
      - {value: "I'm sorry I'm late. I made a mistake.", status: "correct"}
      - {value: "I'm sorry I'm late, and I made a mistake.", status: "correct"}
      - {value: "I'm sorry I'm late and I made a mistake.", status: "correct"}
      - {value: "I'm sorry I'm late. I made a mistake with the time.", status: "correct"}
    feedback: "می‌تانین بگین: I'm sorry I'm late. The bus is late."
