review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit41 (cooking), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the add-some-salt card: the realization's own example (This soup needs you to add some salt) uses English's needs + object + to-infinitive pattern (a thing \"needing\" a person to do something), which Dari does not replicate structurally -- Dari instead says the dish itself needs the ingredient directly (این شوربا نمک ضرورت داره) or uses a passive-flavored subordinate clause (ضرورت داره که نمک انداخته شه), never a person as the object of an inanimate subject's \"need.\" Dari-specific vocabulary used for authenticity: چشیدن/مزه کردن for taste (a light-verb pairing consistent with this unit's own cook/chop/boil/taste-as-fixed-collocations theme), and بی‌بی for grandmother (not the Iranian مادربزرگ) reused from unit40 for cast consistency. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit41.cooking: {title: "پختن یک غذای ساده"}

lessons:
  en.a1.unit41.lesson01.cooking_vocabulary: {title: "کلمات پختن"}
  en.a1.unit41.lesson02.preparing_a_meal: {title: "تیارکردن یک غذا"}
  en.a1.unit41.lesson03.dialogue_cooking_together: {title: "گپ در بارهٔ باهم پختن"}
  en.a1.unit41.lesson04.cooking_together: {title: "متن: باهم پختن"}

teaching:
  en.a1.unit41.lesson01.teach.cook: {title: "cook", gloss: "پختن", note: "cook یعنی پختن -- غذا را با گرم‌کردن تیار کردن.", example_gloss: "من دوست دارم برای رفقایم نان شب بپزم."}
  en.a1.unit41.lesson01.teach.recipe: {title: "recipe", gloss: "طرز پخت", note: "recipe یعنی طرز پخت -- دستورالعمل نوشته‌شده برای پختن یک غذا.", example_gloss: "این طرز پخت بی‌بی‌ام استه."}
  en.a1.unit41.lesson01.teach.ingredient: {title: "ingredient", gloss: "ماده", note: "ingredient یعنی ماده -- یکی از موادی که برای تیارکردن یک غذا کار می‌ره.", example_gloss: "پیاز اولین مادهٔ این طرز پخت استه."}
  en.a1.unit41.lesson01.teach.chop: {title: "chop", gloss: "خرد کردن", note: "chop یعنی خرد کردن -- غذا را به پارچه‌های خورد بریدن.", example_gloss: "می‌تانی پیاز را برایم خرد کنی؟"}
  en.a1.unit41.lesson01.teach.boil: {title: "boil", gloss: "جوش دادن", note: "boil یعنی جوش دادن -- یک مایع را تا جوش‌آمدن و خیلی گرم‌شدن پختن.", example_gloss: "ضرورت دارم آب پاستا را جوش بدم."}
  en.a1.unit41.lesson01.teach.taste: {title: "taste", gloss: "مزه کردن", note: "taste (فعل) یعنی مزه کردن -- کمی از یک غذا خوردن تا مزه‌اش را چک کنین.", example_gloss: "می‌تانی سس را مزه کنی و بگی که نمک ضرورت داره یا نی؟"}

  en.a1.unit41.lesson02.teach.make_dinner: {title: "make dinner", gloss: "نان شب تیار کردن", note: "make dinner یعنی نان شب تیار کردن.", example_gloss: "امشب نان شب تیار می‌کنم."}
  en.a1.unit41.lesson02.teach.follow_a_recipe: {title: "follow a recipe", gloss: "از یک طرز پخت پیروی کردن", note: "follow a recipe یعنی مطابق یک طرز پخت پیش رفتن.", example_gloss: "من همیشه وقتی نان می‌پزم مطابق یک طرز پخت پیش می‌رم."}
  en.a1.unit41.lesson02.teach.chop_the_onions: {title: "chop the onions", gloss: "پیاز را خرد کردن", note: "chop the onions یعنی پیاز را خرد کردن.", example_gloss: "می‌تانی پیاز را برای سس خرد کنی؟"}
  en.a1.unit41.lesson02.teach.boil_the_pasta: {title: "boil the pasta", gloss: "پاستا را جوش دادن", note: "boil the pasta یعنی پاستا را در آب جوش‌شده پختن.", example_gloss: "فراموش نکو که پاستا را ده دقیقه جوش بتی."}
  en.a1.unit41.lesson02.teach.add_some_salt: {title: "add some salt", gloss: "کمی نمک انداختن", note: "add some salt یعنی کمی نمک انداختن. نکتهٔ گرامری: در جملهٔ نمونه (This soup needs you to add some salt) انگلیسی از ساختار needs + کسی + to-فعل کار می‌گیره -- یعنی یک چیز «به کسی نیاز داره که کاری کنه». دری این معنا را با همو ساختار نمی‌سازه؛ به‌جایش می‌گه «این شوربا نمک ضرورت داره» یا «ضرورت داره که کمی نمک انداخته شه».", example_gloss: "این شوربا ضرورت داره که کمی نمک بیندازین."}
  en.a1.unit41.lesson02.teach.what_are_you_cooking_question: {title: "What are you cooking?", gloss: "چی می‌پزی؟", note: "این سوال با فعل کمکی be + فعل استمراری استه، همو ساختاری که در واحدهای پیش هم دیدین."}

  en.a1.unit41.lesson03.teach.dialogue_line1: {title: "میا می‌گه", gloss: "امشب پاستا می‌پزم. می‌خواهی در پختن کمکم کنی؟", note: "شروع گپ با یک دعوت به کمک."}
  en.a1.unit41.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "البته! خو من زیاد آشپز خوبی نیستم.", note: "though اینجه در آخر جمله یعنی «خو»/«با این حال»."}
  en.a1.unit41.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "اشکال نداره، برایت نشان می‌دم. می‌تانی این پیازها را خرد کنی؟", note: "I'll show you یعنی برایت نشان می‌دم."}
  en.a1.unit41.lesson03.teach.dialogue_line4: {title: "جواب دنیل", gloss: "مشکلی نیست. چقدر خورد خردشان کنم؟", note: "How small should I...؟ سوال با should برای پرسیدن اندازهٔ درست."}
  en.a1.unit41.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "پارچه‌های خورد، مثل همی. حالی بیا پاستا را جوش بتیم.", note: "let's + فعل ساده برای پیشنهاد یک کار باهم."}
  en.a1.unit41.lesson03.teach.dialogue_line6: {title: "جواب دنیل", gloss: "می‌تانم سس را مزه کنم؟ خیلی خوشمزه استه!", note: "delicious یعنی خیلی خوشمزه."}
  en.a1.unit41.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "عالی! نان شب تقریباً حاضر استه.", note: "almost ready یعنی تقریباً حاضر."}

  en.a1.unit41.lesson04.teach.reading_passage: {title: "متن: باهم پختن", gloss: "دنیل، لیلا و میا هرکدام مهارت‌های آشپزی مختلف دارند. از وقتی که لیلا به یک اپارتمان نو نزدیک میا کوچ کرد، هرسه رفیق اکثراً باهم نان شب می‌پزن. لیلا آشپز خوبیس. او اکثراً با طرز پخت کهنهٔ مادرش پاستا می‌پزه. میا هم پختن را خیلی دوست داره، و به دنیل یاد داد که چطور پیاز را بدون بریدن انگشتانش خرد کنه. دنیل هنوز آشپز خیلی خوبی نیست، خو تیز یاد می‌گیره. شب پیش، میا از دنیل خواست که در پختن پاستا کمکش کنه. او پیاز را خرد کرد درحالیکه میا پاستا را جوش داد و سس را تیار کرد. دنیل سس را مزه کرد و گفت که خوشمزه استه. لیلا درست وقتی رسید که نان شب حاضر بود، و هرسه‌شان باهم در آشپزخانهٔ میا نان خوردن.", note: "این متن چند فعل و عبارت مربوط به پختن را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit41.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "chop"
    distractors: ["cook", "recipe", "boil"]
    accepted_answers: [{value: "chop", status: "correct"}]
    feedback: "chop یعنی خرد کردن."
  en.a1.unit41.lesson01.exercise02.choose_chop_meaning:
    instruction: "کدام کلمه یعنی غذا را به پارچه‌های خورد بریدن؟"
    correct_option: "chop"
    distractors: ["cook", "boil", "taste"]
    accepted_answers: [{value: "chop", status: "correct"}]
    feedback: "chop یعنی خرد کردن."
  en.a1.unit41.lesson01.exercise03.match_cooking_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers:
      - value:
          - {left: "cook", right: "to prepare food by heating it"}
          - {left: "recipe", right: "written instructions for making a dish"}
          - {left: "ingredient", right: "one of the foods used to make a dish"}
          - {left: "chop", right: "to make something smaller by cutting it"}
          - {left: "boil", right: "to cook a liquid until it bubbles and is very hot"}
          - {left: "taste", right: "to put a little in your mouth to see if it is good"}
        status: "correct"
    feedback: "cook=پختن، recipe=طرز پخت، ingredient=ماده، chop=خرد کردن، boil=جوش دادن، taste=مزه کردن."
  en.a1.unit41.lesson01.exercise04.order_boil_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "to", "boil", "the", "water", "for", "the", "pasta."], status: "correct"}]
    feedback: "ترتیب درست: I need to boil the water for the pasta."
  en.a1.unit41.lesson01.exercise05.write_chop_word:
    instruction: "کلمه‌ای را بنویسین که یعنی غذا را به پارچه‌های خورد بریدن."
    accepted_answers: [{value: "chop", status: "correct"}]
    feedback: "chop یعنی خرد کردن."

  en.a1.unit41.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "boil the pasta"
    distractors: ["make dinner", "follow a recipe", "chop the onions"]
    accepted_answers: [{value: "boil the pasta", status: "correct"}]
    feedback: "boil the pasta یعنی پاستا را جوش دادن."
  en.a1.unit41.lesson02.exercise02.choose_follow_a_recipe_meaning:
    instruction: "کدام عبارت یعنی از دستورالعمل نوشته‌شده برای پختن یک غذای خاص پیروی کردن؟"
    correct_option: "follow a recipe"
    distractors: ["make dinner", "chop the onions", "add some salt"]
    accepted_answers: [{value: "follow a recipe", status: "correct"}]
    feedback: "follow a recipe یعنی از یک طرز پخت پیروی کردن."
  en.a1.unit41.lesson02.exercise03.choose_add_some_salt_meaning:
    instruction: "کدام عبارت یعنی هنگام پختن کمی نمک انداختن؟"
    correct_option: "add some salt"
    distractors: ["make dinner", "follow a recipe", "chop the onions"]
    accepted_answers: [{value: "add some salt", status: "correct"}]
    feedback: "add some salt یعنی کمی نمک انداختن."
  en.a1.unit41.lesson02.exercise04.order_boil_pasta_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Don't", "forget", "to", "boil", "the", "pasta", "for", "ten", "minutes."], status: "correct"}]
    feedback: "ترتیب درست: Don't forget to boil the pasta for ten minutes."
  en.a1.unit41.lesson02.exercise05.translate_what_are_you_cooking:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «چی می‌پزی؟»"
    accepted_answers:
      - {value: "What are you cooking?", status: "correct"}
      - {value: "What are you cooking", status: "correct"}
    feedback: "What are you cooking?"

  en.a1.unit41.lesson03.exercise01.comprehension_daniel_task:
    instruction: "مطابق گپ، میا از دنیل چی می‌خواهد که انجام بده؟"
    correct_option: "chop the onions"
    distractors: ["boil the pasta", "make the sauce", "wash the dishes"]
    accepted_answers: [{value: "chop the onions", status: "correct"}]
    feedback: "میا می‌گه Can you chop these onions؟"
  en.a1.unit41.lesson03.exercise02.comprehension_next_step:
    instruction: "مطابق گپ، میا می‌گه بعد از خردکردن پیاز چی کار کنن؟"
    correct_option: "boil the pasta"
    distractors: ["taste the sauce", "add some salt", "clean the kitchen"]
    accepted_answers: [{value: "boil the pasta", status: "correct"}]
    feedback: "میا می‌گه Now let's boil the pasta."
  en.a1.unit41.lesson03.exercise03.listen_dialogue_sauce_opinion:
    instruction: "مطابق گپ، دنیل در بارهٔ سس چی می‌گه؟"
    correct_option: "it's delicious"
    distractors: ["it's too salty", "it's a little bland", "it needs more pepper"]
    accepted_answers: [{value: "it's delicious", status: "correct"}]
    feedback: "دنیل می‌گه It's delicious!"
  en.a1.unit41.lesson03.exercise04.respond_own_cooking:
    instruction: "چیزی در بارهٔ پختن بگین، یا بپرسین کسی چی می‌پزه."
    accepted_answers: ["I like to cook pasta", "I like to cook pasta.", "I'm not a very good cook", "I'm not a very good cook.", "I need to chop the onions", "I need to chop the onions.", "Can you help me cook?", "What are you cooking?"]
    feedback: "می‌تانین بگین I like to cook... یا بپرسین What are you cooking؟"

  en.a1.unit41.lesson04.exercise01.reading_mia_taught_daniel:
    instruction: "مطابق متن، میا به دنیل چی یاد داد که انجام بده؟"
    correct_option: "chop onions without cutting his fingers"
    distractors: ["boil pasta perfectly", "make a sauce from scratch", "bake bread"]
    accepted_answers: [{value: "chop onions without cutting his fingers", status: "correct"}]
    feedback: "متن می‌گه she taught Daniel how to chop onions without cutting his fingers."
  en.a1.unit41.lesson04.exercise02.reading_leila_recipe:
    instruction: "مطابق متن، لیلا اکثراً با کدام طرز پخت پاستا می‌پزه؟"
    correct_option: "her mother's old recipe"
    distractors: ["a recipe from the internet", "Mia's recipe", "a new recipe book"]
    accepted_answers: [{value: "her mother's old recipe", status: "correct"}]
    feedback: "متن می‌گه using her mother's old recipe."
  en.a1.unit41.lesson04.exercise03.reading_daniel_sauce_reaction:
    instruction: "مطابق متن، دنیل وقتی سس را مزه کرد چی گفت؟"
    correct_option: "he said it was delicious"
    distractors: ["he said it needed salt", "he said nothing", "he said it was too spicy"]
    accepted_answers: [{value: "he said it was delicious", status: "correct"}]
    feedback: "متن می‌گه Daniel tasted the sauce and said it was delicious."
  en.a1.unit41.lesson04.exercise04.write_own_cooking_sentence:
    instruction: "یک جمله در بارهٔ پختن بنویسین، با «I cook...»، «I like to cook...»، یا «I need to...»."
    accepted_answers: ["I cook pasta", "I cook pasta.", "I like to cook dinner", "I like to cook dinner.", "I need to chop the onions", "I need to chop the onions.", "I need to boil the water", "I need to boil the water."]
    feedback: "می‌تانین از الگوی I cook.../I like to cook.../I need to... کار بگیرین."
