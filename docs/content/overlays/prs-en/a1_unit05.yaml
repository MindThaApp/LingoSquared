teaching:
  en.a1.unit05.lesson01.teach.what_time: {title: "ساعت چند است؟", gloss: "ساعت چند است؟", note: "What time is it؟ سوال معمول برای وقت است."}
  en.a1.unit05.lesson01.teach.three_oclock: {title: "ساعت سه", gloss: "ساعت سه است", note: "o'clock فقط برای ساعت‌های کامل (بدون دقیقه) استعمال می‌شه."}
  en.a1.unit05.lesson01.teach.half_past: {title: "نیم بعد از سه", gloss: "ساعت سه و نیم است", note: "half past three یعنی ساعت سه و نیم (۳:۳۰)؛ در انگلیسی می‌گن «نیم، گذشته از سه»، برخلاف دری که می‌گیم «سه و نیم»."}
  en.a1.unit05.lesson01.teach.five_oclock: {title: "ساعت پنج", gloss: "ساعت پنج است", note: "five o'clock یعنی ساعت پنج کامل."}

  en.a1.unit05.lesson02.teach.quarter_past: {title: "ربع بعد از سه", gloss: "ساعت سه و ربع است", note: "a quarter past three یعنی ساعت سه و ربع (۳:۱۵)."}
  en.a1.unit05.lesson02.teach.quarter_to: {title: "ربع به چار", gloss: "یک ربع به چار است", note: "a quarter to four یعنی یک ربع مانده به چار (۳:۴۵)؛ توجه کنین to برخلاف past یعنی «مانده به»."}
  en.a1.unit05.lesson02.teach.ten_past: {title: "ده دقیقه بعد از چار", gloss: "ده دقیقه از چار گذشته است", note: "ten past four یعنی ۴:۱۰."}
  en.a1.unit05.lesson02.teach.ten_to: {title: "ده دقیقه به پنج", gloss: "ده دقیقه به پنج مانده است", note: "ten to five یعنی ۴:۵۰؛ الگوی past/to برای هر شمیر دقیقهٔ زیر سی استعمال می‌شه."}

  en.a1.unit05.lesson03.teach.morning: {title: "صبح", gloss: "صبح", note: "morning معمولاً از حدود ساعت ۶ الی ۱۲ ظهر است."}
  en.a1.unit05.lesson03.teach.afternoon: {title: "بعد از ظهر", gloss: "بعد از ظهر", note: "afternoon از ظهر الی حدود ساعت ۵ عصر است."}
  en.a1.unit05.lesson03.teach.evening: {title: "شام", gloss: "شام", note: "evening از حدود ساعت ۵ الی ۹ شب است؛ با night (شب دیرتر) فرق داره."}
  en.a1.unit05.lesson03.teach.night: {title: "شب", gloss: "شب", note: "night به ساعات دیرتر شب (بعد از حدود ۹ شب) اشاره می‌کنه."}
  en.a1.unit05.lesson03.teach.at_nine_am: {title: "باز شدن دوکان ساعت نه صبح", gloss: "دوکان ساعت نه صبح باز می‌شه", note: "at nine in the morning دقیق‌تر از just nine است، چون صبح/عصر بودن را هم معلوم می‌کنه."}
  en.a1.unit05.lesson03.teach.at_six_pm: {title: "بسته شدن دوکان ساعت شش شام", gloss: "دوکان ساعت شش شام بسته می‌شه", note: "at six in the evening یعنی ساعت شش شام، نی شش صبح."}

  en.a1.unit05.lesson04.teach.opens_at: {title: "باز شدن در ساعت", gloss: "در ساعت ... باز می‌شه", note: "opens at پیش از عدد ساعت می‌آیه."}
  en.a1.unit05.lesson04.teach.closes_at: {title: "بسته شدن در ساعت", gloss: "در ساعت ... بسته می‌شه", note: "closes at پیش از عدد ساعت می‌آیه."}
  en.a1.unit05.lesson04.teach.q_open: {title: "پرسیدن زمان بازشدن", gloss: "دنیل می‌پرسه کتابخانه کدام ساعت باز می‌شه", note: "What time does the library open؟ ساختار سوالی با does برای کارهای عادتی/برنامه است."}
  en.a1.unit05.lesson04.teach.a_open: {title: "جواب زمان بازشدن", gloss: "لیلا می‌گه ساعت نه صبح باز می‌شه", note: "It opens at nine in the morning."}
  en.a1.unit05.lesson04.teach.q_close: {title: "پرسیدن زمان بسته‌شدن", gloss: "دنیل می‌پرسه کدام ساعت بسته می‌شه", note: "And what time does it close؟ ادامهٔ طبیعی سوال قبلی است."}
  en.a1.unit05.lesson04.teach.a_close: {title: "جواب زمان بسته‌شدن", gloss: "لیلا می‌گه ساعت شش شام بسته می‌شه", note: "It closes at six in the evening."}
  en.a1.unit05.lesson04.teach.closing: {title: "ختم‌کردن گفتگو", gloss: "دنیل می‌گه عالی، ساعت نه می‌بینمت", note: "See you at nine برای تعیین وعده در ساعت مشخص استعمال می‌شه."}

exercises:
  en.a1.unit05.lesson01.exercise01.listen_time_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "ساعت حالا"
    distractors: ["تاریخ امروز", "روز هفته", "سن مخاطب"]
    accepted_answers: [{value: "ساعت حالا", status: "correct"}]
    feedback: "What time is it؟ دربارهٔ ساعت حالا می‌پرسه."
  en.a1.unit05.lesson01.exercise02.choose_three_oclock:
    instruction: "جملهٔ درست برای ساعت ۳:۰۰ را انتخاب کنین."
    correct_option: "It's three o'clock."
    distractors: ["It's half past three.", "It's a quarter to three.", "It's five o'clock."]
    accepted_answers: [{value: "It's three o'clock.", status: "correct"}]
    feedback: "It's three o'clock یعنی «ساعت سه است»."
  en.a1.unit05.lesson01.exercise03.choose_half_past:
    instruction: "جملهٔ درست برای ساعت ۳:۳۰ را انتخاب کنین."
    correct_option: "It's half past three."
    distractors: ["It's three o'clock.", "It's a quarter past three.", "It's four o'clock."]
    accepted_answers: [{value: "It's half past three.", status: "correct"}]
    feedback: "It's half past three یعنی «ساعت سه و نیم است»."
  en.a1.unit05.lesson01.exercise04.order_five:
    instruction: "واژه‌ها را برای گفتن ساعت پنج کامل ترتیب کنین."
    accepted_answers: [{value: ["It's", "five", "o'clock"], status: "correct"}]
    feedback: "ترتیب درست It's five o'clock است."
  en.a1.unit05.lesson01.exercise05.write_time:
    instruction: "ساعت ۳:۰۰ را به حروف انگلیسی بنویسین."
    accepted_answers:
      - {value: "It's three o'clock.", status: "correct"}
      - {value: "It's three o'clock", status: "correct"}
      - {value: "Three o'clock.", status: "acceptable_with_note", note: "درست است، اما جملهٔ کامل با It's شروع می‌شه."}
      - {value: "Three o'clock", status: "acceptable_with_note", note: "درست است، اما جملهٔ کامل با It's شروع می‌شه."}
    feedback: "۳:۰۰ به انگلیسی It's three o'clock نوشته می‌شه."

  en.a1.unit05.lesson02.exercise01.listen_quarter:
    instruction: "گوش کنین و ساعت گفته‌شده را انتخاب کنین."
    correct_option: "یک ربع به چار"
    distractors: ["سه و ربع", "چار و ربع", "ساعت چار"]
    accepted_answers: [{value: "یک ربع به چار", status: "correct"}]
    feedback: "It's a quarter to four یعنی «یک ربع به چار»."
  en.a1.unit05.lesson02.exercise02.choose_quarter_past:
    instruction: "جملهٔ درست برای ساعت ۳:۱۵ را انتخاب کنین."
    correct_option: "It's a quarter past three."
    distractors: ["It's a quarter to four.", "It's half past three.", "It's three o'clock."]
    accepted_answers: [{value: "It's a quarter past three.", status: "correct"}]
