      - {value: "Ten to five.", status: "acceptable_with_note", note: "درست است، اما جملهٔ کامل با It's شروع می‌شه."}
      - {value: "Ten to five", status: "acceptable_with_note", note: "درست است، اما جملهٔ کامل با It's شروع می‌شه."}
    feedback: "۴:۵۰ به انگلیسی It's ten to five نوشته می‌شه."

  en.a1.unit05.lesson03.exercise01.listen_day_part:
    instruction: "گوش کنین و بخش روز گفته‌شده را انتخاب کنین."
