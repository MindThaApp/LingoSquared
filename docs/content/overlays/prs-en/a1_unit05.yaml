    instruction: "هر بخش ساعت را به بخش درست روز وصل کنین."
    accepted_answers: [{value: [{left: "6 AM - 12 PM", right: "morning"}, {left: "12 PM - 5 PM", right: "afternoon"}, {left: "5 PM - 9 PM", right: "evening"}, {left: "9 PM - 6 AM", right: "night"}], status: "correct"}]
    feedback: "این ساعات تقریبی اند اما در گفتگوی روزمره رایج اند."
  en.a1.unit05.lesson03.exercise05.write_open_time:
    instruction: "بنویسین دوکان ساعت نه صبح باز می‌شه."
    accepted_answers:
      - {value: "The store opens at nine in the morning.", status: "correct"}
      - {value: "The store opens at nine in the morning", status: "correct"}
    feedback: "The store opens at nine in the morning یعنی «دوکان ساعت نه صبح باز می‌شه»."

  en.a1.unit05.lesson04.exercise01.listen_open_time:
    instruction: "گفتگو را گوش کنین و معلوم کنین کتابخانه کدام ساعت باز می‌شه."
    correct_option: "ساعت نه صبح"
    distractors: ["ساعت شش شام", "ساعت نه شب", "ساعت شش صبح"]
    accepted_answers: [{value: "ساعت نه صبح", status: "correct"}]
    feedback: "لیلا می‌گه It opens at nine in the morning."
  en.a1.unit05.lesson04.exercise02.listen_close_time:
    instruction: "گوش کنین و معلوم کنین کتابخانه کدام ساعت بسته می‌شه."
    correct_option: "ساعت شش شام"
    distractors: ["ساعت نه صبح", "ساعت شش صبح", "ساعت نه شام"]
    accepted_answers: [{value: "ساعت شش شام", status: "correct"}]
    feedback: "لیلا می‌گه It closes at six in the evening."
  en.a1.unit05.lesson04.exercise03.choose_open_question:
    instruction: "سوال درست برای زمان بازشدن کتابخانه را انتخاب کنین."
    correct_option: "What time does the library open?"
    distractors: ["What time does it close?", "What's today's date?", "How old is the library?"]
    accepted_answers: [{value: "What time does the library open?", status: "correct"}]
    feedback: "What time does the library open؟ زمان بازشدن را می‌پرسه."
  en.a1.unit05.lesson04.exercise04.order_close_question:
    instruction: "واژه‌ها را برای پرسیدن زمان بسته‌شدن ترتیب کنین."
    accepted_answers: [{value: ["what", "time", "does", "it", "close"], status: "correct"}]
    feedback: "ترتیب درست what time does it close است."
  en.a1.unit05.lesson04.exercise05.reply_as_leila:
    instruction: "به نقش لیلا، به هر دو سوال (بازشدن و بسته‌شدن) جواب بدین."
    accepted_answers:
      - {value: "It opens at nine in the morning. It closes at six in the evening.", status: "correct"}
      - {value: "It opens at nine in the morning, and it closes at six in the evening.", status: "correct"}
    feedback: "جواب کامل هر دو ساعت را جدا بیان می‌کنه."
