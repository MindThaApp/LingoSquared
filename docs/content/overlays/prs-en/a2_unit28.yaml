course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit28.doctor: {title: "رفتن به وقت داکتر"}

lessons:
  en.a2.unit28.lesson01.health_followup_vocabulary: {title: "دوا و وقت‌ها"}
  en.a2.unit28.lesson02.calling_to_make_an_appointment: {title: "زنگ زدن برای گرفتن وقت"}
  en.a2.unit28.lesson03.reading_an_appointment_confirmation: {title: "خواندن تأیید وقت داکتر"}
  en.a2.unit28.lesson04.doctor_appointment_dialogue: {title: "نزد داکتر"}

teaching:
  en.a2.unit28.lesson01.teach.medicine: {title: "medicine", gloss: "دوا", note: "*medicine* یعنی دوا."}
  en.a2.unit28.lesson01.teach.prescription: {title: "prescription", gloss: "نسخهٔ داکتر", note: "*prescription* یعنی نسخه‌ای که داکتر برای‌تان می‌نویسه."}
  en.a2.unit28.lesson01.teach.follow_up_appointment: {title: "follow-up appointment", gloss: "وقت بعدی", note: "*follow-up appointment* یعنی یک وقت دیگه نزد داکتر برای دیدن حالت‌تان."}
  en.a2.unit28.lesson01.teach.getting_worse: {title: "getting worse", gloss: "خرابتر شدن", note: "*getting worse* یعنی یک تکلیف داره خرابتر می‌شه."}
  en.a2.unit28.lesson01.teach.insurance_card: {title: "insurance card", gloss: "کارت بیمه", note: "*insurance card* یعنی کارتی که کمک می‌کنه پیسهٔ ویزیت داکتر پرداخته شه."}
  en.a2.unit28.lesson01.teach.reused_symptoms: {title: "تکلیف‌های قبلی", gloss: "سردردی، گلو درد، تب", note: "همی کلمات را در واحد ۲۲ یاد گرفته بودین -- حالی دوباره مرور می‌کنیم."}

  en.a2.unit28.lesson02.teach.appointment_request: {title: "خواستن وقت داکتر", gloss: "می‌خواستم یک وقت نزد داکتر بگیرم، لطفاً.", note: "همی یک خواهش مؤدبانه و رسمی برای گرفتن وقت استه."}
  en.a2.unit28.lesson02.teach.symptom_duration: {title: "گفتن مدت و شدت تکلیف", gloss: "سه روز می‌شه که سردردی و گلو درد دارم، و خرابتر می‌شه.", note: "همی جمله با *present perfect* (*I've had*) مدت زمان را نشان می‌ته، همرنگ واحد ۲۵."}

  en.a2.unit28.lesson03.teach.arrive_early: {title: "arrive ten minutes early", gloss: "ده دقیقه زودتر برسین", note: "*arrive ten minutes early* یعنی ده دقیقه پیش از وقت برسین."}
  en.a2.unit28.lesson03.teach.confirmation_text: {title: "متن تأیید وقت", gloss: "وقت‌تان برای ساعت سه امروز تأیید شده. لطفاً کارت بیمه‌تان را با خود بیارین و ده دقیقه زودتر برسین. نمبر تأیید ۷۷۲۴ استه.", note: "همی یک پیام تأیید رسمی واقعی با وقت، هدایت، و نمبر استه -- سویهٔ A2."}

  en.a2.unit28.lesson04.teach.i_see: {title: "I see.", gloss: "فهمیدم.", note: "*I see* یک عبارت رایج استه که نشان می‌ته چیزی را فهمیدین."}
  en.a2.unit28.lesson04.teach.q_whats_wrong: {title: "پرسیدن دربارهٔ تکلیف", gloss: "داکتر می‌پرسه چی تکلیف دارین؟", note: "همو سوالی که لیلا در واحد ۲۲ پرسیده بود، حالی از زبان داکتر."}
  en.a2.unit28.lesson04.teach.a_symptoms_duration: {title: "جواب دانیل دربارهٔ تکلیف", gloss: "دانیل می‌گه سه روز می‌شه که سردردی و گلو درد دارم، و خرابتر می‌شه.", note: "همو جمله‌ای که در درس دوم یاد گرفتیم."}
  en.a2.unit28.lesson04.teach.a_bad_cold: {title: "تشخیص داکتر", gloss: "داکتر می‌گه فهمیدم. شما یک سرماخوردگی بد دارین.", note: "همی یک تشخیص ساده و معمولی استه، نی یک مریضی جدی."}
  en.a2.unit28.lesson04.teach.q_medicine: {title: "پرسیدن دربارهٔ دوا", gloss: "دانیل می‌پرسه باید دوا بخورم؟", note: "دانیل بعد از شنیدن تشخیص، دربارهٔ درمان می‌پرسه."}
  en.a2.unit28.lesson04.teach.a_medicine_instructions: {title: "هدایت دوا خوردن", gloss: "داکتر می‌گه بلی، همی دوا را روزی دو مرتبه، پنج روز بخورین، و آب زیاد بنوشین.", note: "هدایت دقیق: دو مرتبه در روز، پنج روز."}
  en.a2.unit28.lesson04.teach.q_follow_up: {title: "پرسیدن دربارهٔ وقت بعدی", gloss: "دانیل می‌پرسه اگه خوب نشدم، باز بیایم؟", note: "دانیل از همو شرط (*if it doesn't get better*) که لیلا در واحد ۲۲ گفته بود استفاده می‌کنه."}
  en.a2.unit28.lesson04.teach.a_followup_appointment: {title: "جواب داکتر دربارهٔ وقت بعدی", gloss: "داکتر می‌گه بلی، اگه تا یک هفته خوب نشدین، برای یک وقت بعدی بیاین.", note: "همی جواب شرط دقیق برگشتن را روشن می‌کنه -- تا یک هفته."}

exercises:
  en.a2.unit28.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "prescription"
    distractors: ["medicine", "insurance card", "follow-up appointment"]
    accepted_answers: [{value: "prescription", status: "correct"}]
    feedback: "*prescription* یعنی نسخهٔ داکتر."
  en.a2.unit28.lesson01.exercise02.choose_medicine_word:
    instruction: "کدام کلمه یعنی چیزی که داکتر برای‌تان می‌ته تا حال‌تان خوب شه؟"
    correct_option: "medicine"
    distractors: ["prescription", "insurance card", "follow-up appointment"]
    accepted_answers: [{value: "medicine", status: "correct"}]
    feedback: "*medicine* یعنی دوا."
  en.a2.unit28.lesson01.exercise03.choose_insurance_card_phrase:
    instruction: "کدام عبارت یعنی کارتی که کمک می‌کنه پیسهٔ ویزیت داکتر پرداخته شه؟"
    correct_option: "insurance card"
    distractors: ["prescription", "medicine", "follow-up appointment"]
    accepted_answers: [{value: "insurance card", status: "correct"}]
    feedback: "*insurance card* یعنی کارت بیمه."
  en.a2.unit28.lesson01.exercise04.match_doctor_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنین."
    accepted_answers:
      - value:
          - {left: "medicine", right: "headache or fever"}
          - {left: "prescription", right: "document + medicine"}
          - {left: "getting worse", right: "a symptom that is becoming more serious"}
          - {left: "headache", right: "pain in your head"}
          - {left: "sore throat", right: "pain in your throat when you swallow"}
          - {left: "fever", right: "when your body is too hot"}
        status: "correct"
    feedback: "هر تعریف با یک واژه یا عبارت انگلیسی جور است."
  en.a2.unit28.lesson01.exercise05.write_prescription:
    instruction: "کلمه‌ای را که یعنی نسخهٔ نوشته‌شدهٔ داکتر برای دوا استه بنویسین."
    accepted_answers:
      - {value: "prescription", status: "correct"}
      - {value: "Prescription", status: "correct"}
    feedback: "*prescription* یعنی نسخهٔ داکتر."

  en.a2.unit28.lesson02.exercise01.listen_request:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "I'd like to make an appointment to see a doctor"
    distractors: ["I've had a headache for three days.", "Your appointment is confirmed for 3pm.", "You have a bad cold."]
    accepted_answers: [{value: "I'd like to make an appointment to see a doctor", status: "correct"}]
    feedback: "همی یعنی می‌خواستم یک وقت نزد داکتر بگیرم."
  en.a2.unit28.lesson02.exercise02.choose_polite_appointment_request:
    instruction: "می‌خواین رسمی به کلینیک داکتر زنگ بزنین و یک وقت بگیرین. چی می‌گین؟"
    correct_option: "I'd like to make an appointment to see a doctor, please."
    distractors: ["Should I take any medicine?", "The confirmation number is 7724.", "I see."]
    accepted_answers: [{value: "I'd like to make an appointment to see a doctor, please.", status: "correct"}]
    feedback: "*I'd like to...* یک شکل مؤدبانه و رسمی برای خواهش کردن استه."
  en.a2.unit28.lesson02.exercise03.order_symptom_duration:
    instruction: "کلمات را طوری تنظیم کنین که «سه روز می‌شه که سردردی و گلو درد دارم» شود."
    accepted_answers: [{value: ["I've", "had", "a", "headache", "and", "a", "sore", "throat", "for", "three", "days"], status: "correct"}]
    feedback: "ترتیب درست: *I've had a headache and a sore throat for three days*."
  en.a2.unit28.lesson02.exercise04.reply_symptom_duration:
    instruction: "منشی می‌پرسه که چند روز می‌شه همی تکلیف را دارین و آیا خرابتر می‌شه. چی جواب می‌تین؟"
    accepted_answers:
      - {value: "I've had a headache and a sore throat for three days, and it's getting worse.", status: "correct"}
      - {value: "I've had a headache and a sore throat for three days and it's getting worse.", status: "correct"}
      - {value: "I've had a headache and a sore throat for three days. It's getting worse.", status: "correct"}
    feedback: "همی جمله هم مدت (سه روز) و هم شدت (خرابتر می‌شه) را با هم می‌ته -- هر سه شکل نوشتاری درست استه."
  en.a2.unit28.lesson02.exercise05.write_appointment_request:
    instruction: "بنویسین که می‌خواین یک وقت نزد داکتر بگیرین."
    accepted_answers:
      - {value: "I'd like to make an appointment to see a doctor, please.", status: "correct"}
      - {value: "I'd like to make an appointment to see a doctor.", status: "correct"}
    feedback: "*I'd like to make an appointment to see a doctor* یعنی می‌خواستم یک وقت نزد داکتر بگیرم."

  en.a2.unit28.lesson03.exercise01.read_appointment_time:
    instruction: "وقت داکتر برای کدام ساعت تأیید شده؟"
    correct_option: "3pm today"
    distractors: ["10am tomorrow", "5pm next week", "9am today"]
    accepted_answers: [{value: "3pm today", status: "correct"}]
    feedback: "متن می‌گه *appointment is confirmed for 3pm today*."
  en.a2.unit28.lesson03.exercise02.read_arrival_time:
    instruction: "چند دقیقه زودتر باید برسین؟"
    correct_option: "ten minutes early"
    distractors: ["thirty minutes early", "five minutes early", "one hour early"]
    accepted_answers: [{value: "ten minutes early", status: "correct"}]
    feedback: "متن می‌گه *arrive ten minutes early*."
  en.a2.unit28.lesson03.exercise03.choose_true_statement:
    instruction: "کدام جمله مطابق متن درست استه؟"
    correct_option: "The confirmation number is 7724."
    distractors: ["The appointment is next week.", "You should bring cash.", "The doctor will call you back."]
    accepted_answers: [{value: "The confirmation number is 7724.", status: "correct"}]
    feedback: "متن می‌گه *the confirmation number is 7724*."
  en.a2.unit28.lesson03.exercise04.order_bring_insurance_card:
    instruction: "کلمات را طوری تنظیم کنین که «لطفاً کارت بیمه‌تان را بیارین و ده دقیقه زودتر برسین» شود."
    accepted_answers: [{value: ["Please", "bring", "your", "insurance", "card", "and", "arrive", "ten", "minutes", "early"], status: "correct"}]
    feedback: "ترتیب درست: *Please bring your insurance card and arrive ten minutes early*."
  en.a2.unit28.lesson03.exercise05.write_appointment_time:
    instruction: "بنویسین که وقت‌تان برای ساعت سه امروز تأیید شده."
    accepted_answers:
      - {value: "Your appointment is confirmed for 3pm today.", status: "correct"}
      - {value: "Your appointment is confirmed for 3pm today", status: "correct"}
    feedback: "همی جمله وقت دقیق را روشن می‌کنه."

  en.a2.unit28.lesson04.exercise01.listen_diagnosis:
    instruction: "گفتگو را گوش کنین و تشخیص داکتر را انتخاب کنین."
    correct_option: "a bad cold"
    distractors: ["a headache only", "a fever", "a sore throat only"]
    accepted_answers: [{value: "a bad cold", status: "correct"}]
    feedback: "داکتر می‌گه *you have a bad cold*."
  en.a2.unit28.lesson04.exercise02.listen_medicine_instructions:
    instruction: "گوش کنین و هدایت دوا خوردن را انتخاب کنین."
    correct_option: "take this medicine twice a day for five days"
    distractors: ["take this medicine once a week", "take this medicine every hour", "take this medicine for one day"]
    accepted_answers: [{value: "take this medicine twice a day for five days", status: "correct"}]
    feedback: "داکتر می‌گه *take this medicine twice a day for five days*."
  en.a2.unit28.lesson04.exercise03.choose_followup_condition:
    instruction: "اگه سرماخوردگی خوب نشه، داکتر می‌گه چی کار کنین؟"
    correct_option: "come back for a follow-up appointment if it doesn't get better within a week"
    distractors: ["call an ambulance immediately", "take double the medicine", "go to a different doctor"]
    accepted_answers: [{value: "come back for a follow-up appointment if it doesn't get better within a week", status: "correct"}]
    feedback: "داکتر می‌گه *come back for a follow-up appointment if it doesn't get better within a week*."
  en.a2.unit28.lesson04.exercise04.order_bad_cold:
    instruction: "کلمات را طوری تنظیم کنین که «شما یک سرماخوردگی بد دارین» شود."
    accepted_answers: [{value: ["You", "have", "a", "bad", "cold"], status: "correct"}]
    feedback: "ترتیب درست: *You have a bad cold*."
  en.a2.unit28.lesson04.exercise05.reply_as_daniel:
    instruction: "داکتر می‌گه: چی تکلیف دارین؟ فهمیدم. شما یک سرماخوردگی بد دارین. بلی، همی دوا را روزی دو مرتبه، پنج روز بخورین، و آب زیاد بنوشین."
    accepted_answers:
      - {value: "I've had a headache and a sore throat for three days, and it's getting worse. Should I take any medicine? Should I come back if it doesn't get better?", status: "correct"}
      - {value: "I've had a headache and a sore throat for three days and it's getting worse. Should I take any medicine? Should I come back if it doesn't get better?", status: "correct"}
      - {value: "I've had a headache and a sore throat for three days. It's getting worse. Should I take any medicine? Should I come back if it doesn't get better?", status: "correct"}
    feedback: "همی جواب کامل، گفتن تکلیف، پرسیدن دربارهٔ دوا، و پرسیدن دربارهٔ وقت بعدی را با هم می‌ته -- چند لحظهٔ جدا از گفتگو."
  en.a2.unit28.lesson04.exercise06.speak_doctor_dialogue:
    instruction: "به نقش دانیل، آوازی به داکتر جواب بتین."
    accepted_answers:
      - {value: "I've had a headache and a sore throat for three days, and it's getting worse. Should I take any medicine? Should I come back if it doesn't get better?", status: "correct"}
      - {value: "I've had a headache and a sore throat for three days and it's getting worse. Should I take any medicine? Should I come back if it doesn't get better?", status: "correct"}
      - {value: "I've had a headache and a sore throat for three days. It's getting worse. Should I take any medicine? Should I come back if it doesn't get better?", status: "correct"}
    feedback: "همی جواب کامل هر سه بخش گفتگو را پوشش می‌ته: تکلیف، دوا، و وقت بعدی."
