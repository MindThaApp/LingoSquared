course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit31.appearance: {title: "توصیف قیافه و شکل کسی"}

lessons:
  en.a1.unit31.lesson01.height_and_hair: {title: "قد و موی سر"}
  en.a1.unit31.lesson02.eyes_and_description: {title: "رنگ چشم و پرسیدن دربارهٔ قیافه"}
  en.a1.unit31.lesson03.dialogue_new_coworker: {title: "گپ دربارهٔ همکار نو"}
  en.a1.unit31.lesson04.comparing_appearances: {title: "متن: دو دوست"}

teaching:
  en.a1.unit31.lesson01.teach.tall: {title: "tall", gloss: "قد بلند", note: "tall یعنی قد بلند.", example_gloss: "برادرم قد بلند استه."}
  en.a1.unit31.lesson01.teach.short: {title: "short", gloss: "قد کوتاه", note: "short یعنی قد کوتاه. توجه: همی کلمه دربارهٔ وخت هم استعمال می‌شه (short time)، خو در اینجا معنایش قد استه.", example_gloss: "خواهرم قد کوتاه استه."}
  en.a1.unit31.lesson01.teach.hair: {title: "hair", gloss: "مو", note: "hair یعنی مو، موی سر.", example_gloss: "او موی دراز داره."}
  en.a1.unit31.lesson01.teach.blond: {title: "blond", gloss: "بور / موی طلایی", note: "blond یعنی موی رنگ طلایی روشن. کلمهٔ بور در دری هم رایج استه.", example_gloss: "موی او بور استه."}
  en.a1.unit31.lesson01.teach.curly: {title: "curly", gloss: "مجعد", note: "curly یعنی موی مجعد، مو که پیچ‌پیچ استه.", example_gloss: "لیلا موی مجعد داره."}

  en.a1.unit31.lesson02.teach.eyes: {title: "eyes", gloss: "چشمان", note: "eyes یعنی چشمان.", example_gloss: "من چشمان قهوه‌یی دارم."}
  en.a1.unit31.lesson02.teach.blue: {title: "blue", gloss: "آبی", note: "blue یعنی رنگ آبی.", example_gloss: "چشمانش آبی استه."}
  en.a1.unit31.lesson02.teach.brown: {title: "brown", gloss: "قهوه‌یی", note: "brown یعنی رنگ قهوه‌یی.", example_gloss: "چشمان من قهوه‌یی استه."}
  en.a1.unit31.lesson02.teach.green: {title: "green", gloss: "سبز", note: "green یعنی رنگ سبز.", example_gloss: "او چشمان سبز داره."}
  en.a1.unit31.lesson02.teach.glasses: {title: "glasses", gloss: "عینک", note: "glasses یعنی عینک. توجه: در دری می‌گیم «عینک می‌زنه»، خو در انگلیسی فعل wear (پوشیدن) استعمال می‌شه، همو فعلی که برای لباس هم به کار می‌ره: wears glasses، نی «hits/puts glasses».", example_gloss: "پدرم عینک می‌زنه."}
  en.a1.unit31.lesson02.teach.what_look_like: {title: "What does she look like?", gloss: "شکلش چطور استه؟", note: "این یک اصطلاح استه، نی ترجمهٔ کلمه‌به‌کلمه. توجه به ساختار سوال: فعل کمکی does پیش از فاعل می‌آیه (What does she look...؟)، ساختاری که دری از فعل کمکی سوالی جدا استفاده نمی‌کنه و معادل مستقیم نداره."}

  en.a1.unit31.lesson03.teach.dialogue_line1: {title: "لیلا می‌گه", gloss: "یک همکار نو امروز شروع می‌کنه. اسمش میا استه.", note: "شروع گفتگو، معرفی موضوع."}
  en.a1.unit31.lesson03.teach.dialogue_line2: {title: "دنیل می‌پرسه", gloss: "شکلش چطور استه؟", note: "سوال با اصطلاح look like."}
  en.a1.unit31.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "قد بلند استه، و موی مجعد و بور داره.", note: "دو صفت با and وصل شده."}
  en.a1.unit31.lesson03.teach.dialogue_line4: {title: "دنیل می‌پرسه", gloss: "عینک می‌زنه؟", note: "سوال بلی/نی با فعل کمکی Does."}
  en.a1.unit31.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "بلی، می‌زنه. چشمان سبز هم داره.", note: "Does she؟ Yes, she does. -- جواب کوتاه با تکرار فعل کمکی، ساختاری که در دری معادل مستقیم نداره (در دری معمولاً بلی/نی به تنهایی یا با تکرار فعل اصلی جواب داده می‌شه)."}
  en.a1.unit31.lesson03.teach.dialogue_line6: {title: "دنیل می‌گه", gloss: "باشه، فکر می‌کنم حالی او را نزدیک دروازه می‌بینم.", note: "پایان گفتگو."}

  en.a1.unit31.lesson04.teach.reading_passage: {title: "متن: دنیل و لیلا", gloss: "دنیل و لیلا دوستان خوب استند، خو شکل‌شان مثل هم نیست. دنیل قد بلند استه و موی کوتاه و سیاه داره. عینک می‌زنه. لیلا قد کوتاه استه و موی دراز، مجعد و قهوه‌یی داره. چشمانش آبی استه، و چشمان دنیل قهوه‌یی. هردوشان خندیدن را خیلی خوش دارن.", note: "این متن چند صفت قیافه را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit31.lesson01.exercise01.listen_trait:
    instruction: "گوش کنین و صفتی که گفته شد را انتخاب کنین."
    correct_option: "curly"
    distractors: ["tall", "short", "blond"]
    accepted_answers: [{value: "curly", status: "correct"}]
    feedback: "curly یعنی مجعد."
  en.a1.unit31.lesson01.exercise02.choose_short_meaning:
    instruction: "کدام کلمه یعنی کسی که قد بلند نیست؟"
    correct_option: "short"
    distractors: ["tall", "curly", "blond"]
    accepted_answers: [{value: "short", status: "correct"}]
    feedback: "short یعنی قد کوتاه."
