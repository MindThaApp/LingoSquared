    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "tall", right: "قد بلند داشتن"}
      - {left: "short", right: "قد کوتاه داشتن"}
      - {left: "hair", right: "چیزی که روی سر رشد می‌کنه"}
      - {left: "blond", right: "بور / موی طلایی"}
      - {left: "curly", right: "مویی که حلقه‌ها یا موج‌های زیاد داره"}
    accepted_answers:
      - value:
          - {left: "tall", right: "قد بلند داشتن"}
          - {left: "short", right: "قد کوتاه داشتن"}
          - {left: "hair", right: "چیزی که روی سر رشد می‌کنه"}
          - {left: "blond", right: "بور / موی طلایی"}
          - {left: "curly", right: "مویی که حلقه‌ها یا موج‌های زیاد داره"}
        status: "correct"
    feedback: "tall=قد بلند، short=قد کوتاه، hair=مو، blond=بور، curly=مجعد."
  en.a1.unit31.lesson01.exercise04.order_hair_sentence:
    instruction: "کلمات را برای گفتن «او موی دراز داره» ترتیب کنین."
    accepted_answers: [{value: ["She", "has", "long", "hair."], status: "correct"}]
    feedback: "ترتیب درست She has long hair. است. توجه: long hair یعنی موی دراز -- در انگلیسی برای طول از long استفاده می‌شه، نی از tall (که فقط برای قد استعمال می‌شه)."
  en.a1.unit31.lesson01.exercise05.write_trait:
    instruction: "کلمه‌ای که یعنی کسی قد بلند داره را بنویسین."
    accepted_answers:
      - {value: "tall", status: "correct"}
      - {value: "Tall", status: "correct"}
    feedback: "tall یعنی قد بلند."

  en.a1.unit31.lesson02.exercise01.listen_eyes:
    instruction: "گوش کنین و رنگ چشمی که گفته شد را انتخاب کنین."
    correct_option: "green"
