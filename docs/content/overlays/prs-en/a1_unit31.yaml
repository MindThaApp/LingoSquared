course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit31.appearance: {title: "توضیف قیافه و شکل کسی"}

lessons:
  en.a1.unit31.lesson01.height_and_hair: {title: "قد و موی سر"}
  en.a1.unit31.lesson02.eyes_and_description: {title: "رنگ چشم و پرسیدن در بارهٔ قیافه"}
  en.a1.unit31.lesson03.dialogue_new_coworker: {title: "گپ در بارهٔ همکار نو"}
  en.a1.unit31.lesson04.comparing_appearances: {title: "متن: دو دوست"}

teaching:
  en.a1.unit31.lesson01.teach.tall: {title: "tall", gloss: "قد بلند", note: "tall یعنی قد بلند."}
  en.a1.unit31.lesson01.teach.short: {title: "short", gloss: "قد کوتاه", note: "short یعنی قد کوتاه. توجه: همی کلمه در بارهٔ وخت هم استعمال می‌شه (short time)، خو دلته اینجه معنایش قد استه."}
  en.a1.unit31.lesson01.teach.hair: {title: "hair", gloss: "مو", note: "hair یعنی مو، موی سر."}
  en.a1.unit31.lesson01.teach.blond: {title: "blond", gloss: "بور / موی طلایی", note: "blond یعنی موی رنگ طلایی روشن. کلمهٔ بور در دری هم رایج است."}
  en.a1.unit31.lesson01.teach.curly: {title: "curly", gloss: "مجعد", note: "curly یعنی موی مجعد، مو که پیچ‌پیچ استه."}

  en.a1.unit31.lesson02.teach.eyes: {title: "eyes", gloss: "چشمان", note: "eyes یعنی چشمان."}
  en.a1.unit31.lesson02.teach.blue: {title: "blue", gloss: "آبی", note: "blue یعنی رنگ آبی."}
  en.a1.unit31.lesson02.teach.brown: {title: "brown", gloss: "قهوه‌یی", note: "brown یعنی رنگ قهوه‌یی."}
  en.a1.unit31.lesson02.teach.green: {title: "green", gloss: "سبز", note: "green یعنی رنگ سبز."}
  en.a1.unit31.lesson02.teach.glasses: {title: "glasses", gloss: "عینک", note: "glasses یعنی عینک. توجه: در دری می‌گیم «عینک می‌زنه»، خو در انگلیسی فعل wear (پوشیدن) استعمال می‌شه، همو فعلی که برای لباس هم به کار می‌ره: wears glasses، نی «hits/puts glasses»."}
  en.a1.unit31.lesson02.teach.what_look_like: {title: "What does she look like?", gloss: "شکلش چطور است؟", note: "این یک اصطلاح استه، نی ترجمهٔ کلمه‌به‌کلمه. توجه به ساختار سوال: فعل کمکی does پیش از فاعل می‌آیه (What does she look...؟)، ساختاری که دری از فعل کمکی سوالی جدا استفاده نمی‌کنه و معادل مستقیم نداره."}

  en.a1.unit31.lesson03.teach.dialogue_line1: {title: "لیلا می‌گه", gloss: "یک همکار نو امروز شروع می‌کنه. اسمش میا استه.", note: "شروع گفتگو، معرفی موضوع."}
  en.a1.unit31.lesson03.teach.dialogue_line2: {title: "دنیل می‌پرسه", gloss: "شکلش چطور است؟", note: "سوال با اصطلاح look like."}
  en.a1.unit31.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "قد بلند استه، و موی مجعد و بور داره.", note: "دو صفت با and وصل شده."}
  en.a1.unit31.lesson03.teach.dialogue_line4: {title: "دنیل می‌پرسه", gloss: "عینک می‌زنه؟", note: "سوال بلی/نی با فعل کمکی Does."}
  en.a1.unit31.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "بلی، می‌زنه. چشمان سبز هم داره.", note: "Does she؟ Yes, she does. -- جواب کوتاه با تکرار فعل کمکی، ساختاری که در دری معادل مستقیم نداره (در دری معمولاً بلی/نی به تنهایی یا با تکرار فعل اصلی جواب داده می‌شه)."}
  en.a1.unit31.lesson03.teach.dialogue_line6: {title: "دنیل می‌گه", gloss: "باشه، فکر می‌کنم حالی او را نزدیک دروازه می‌بینم.", note: "پایان گفتگو."}

  en.a1.unit31.lesson04.teach.reading_passage: {title: "متن: دنیل و لیلا", gloss: "دنیل و لیلا دوستان خوب استند، خو شکل‌شان مثل هم نیست. دنیل قد بلند استه و موی کوتاه و سیاه داره. عینک می‌زنه. لیلا قد کوتاه استه و موی دراز، مجعد و قهوه‌یی داره. چشمانش آبی استه، و چشمان دنیل قهوه‌یی. هردوی‌شان زیاد خنده می‌کنند.", note: "این متن چند صفت قیافه را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit31.lesson01.exercise01.listen_trait:
    instruction: "گوش کنین و صفتی که گفته شد را انتخاب کنین."
    correct_option: "curly"
    distractors: ["tall", "short", "blond"]
    accepted_answers: [{value: "curly", status: "correct"}]
    feedback: "curly یعنی مجعد."
  en.a1.unit31.lesson01.exercise02.choose_short_meaning:
    instruction: "کدام کلمه یعنی کسی که قد بلند نیست؟"
    correct_option: "short"
    distractors: ["tall", "curly", "blond"]
    accepted_answers: [{value: "short", status: "correct"}]
    feedback: "short یعنی قد کوتاه."
  en.a1.unit31.lesson01.exercise03.match_traits:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers:
      - value:
          - {left: "having a big height", right: "tall"}
          - {left: "having a small height", right: "short"}
          - {left: "grows on your head", right: "hair"}
          - {left: "hair with lots of small circles or waves", right: "curly"}
        status: "correct"
    feedback: "هر تعریف با یک واژه یا عبارت انگلیسی جور است."
  en.a1.unit31.lesson01.exercise04.order_hair_sentence:
    instruction: "کلمات را برای گفتن «او موی دراز داره» ترتیب کنین."
    accepted_answers: [{value: ["She", "has", "long", "hair."], status: "correct"}]
    feedback: "ترتیب درست She has long hair. است. توجه: long hair یعنی موی دراز -- در انگلیسی برای طول از long استفاده می‌شه، نی از tall (که تنها برای قد قامت استه)."
  en.a1.unit31.lesson01.exercise05.write_trait:
    instruction: "کلمه‌ای که یعنی کسی قد بلند داره را بنویسین."
    accepted_answers:
      - {value: "tall", status: "correct"}
      - {value: "Tall", status: "correct"}
    feedback: "tall یعنی قد بلند."

  en.a1.unit31.lesson02.exercise01.listen_eyes:
    instruction: "گوش کنین و رنگ چشمی که گفته شد را انتخاب کنین."
    correct_option: "green"
    distractors: ["blue", "brown", "black"]
    accepted_answers: [{value: "green", status: "correct"}]
    feedback: "green یعنی سبز."
  en.a1.unit31.lesson02.exercise02.choose_glasses_meaning:
    instruction: "کدام کلمه یعنی چیزی که برای بهتر دیدن به چشم می‌زنیم؟"
    correct_option: "glasses"
    distractors: ["eyes", "blue", "hair"]
    accepted_answers: [{value: "glasses", status: "correct"}]
    feedback: "glasses یعنی عینک."
  en.a1.unit31.lesson02.exercise03.choose_eye_color:
    instruction: "کدام یکی رنگ چشم استه؟"
    correct_option: "blue"
    distractors: ["tall", "curly", "hair"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "blue یعنی آبی، یک رنگ چشم."
  en.a1.unit31.lesson02.exercise04.order_eyes_sentence:
    instruction: "کلمات را برای گفتن «چشمانش آبی استه» ترتیب کنین."
    accepted_answers: [{value: ["Her", "eyes", "are", "blue."], status: "correct"}]
    feedback: "ترتیب درست Her eyes are blue. است."
  en.a1.unit31.lesson02.exercise05.translate_look_like:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «شکلش چطور است؟»"
    accepted_answers:
      - {value: "What does she look like?", status: "correct"}
      - {value: "What does she look like", status: "correct"}
    feedback: "What does she look like؟ یک اصطلاح استه برای پرسیدن در بارهٔ قیافهٔ کسی."

  en.a1.unit31.lesson03.exercise01.comprehension_mia_hair:
    instruction: "مطابق گفتگو، موی میا چطور استه؟"
    correct_option: "curly, blond hair"
    distractors: ["short, black hair", "long, brown hair", "straight, red hair"]
    accepted_answers: [{value: "curly, blond hair", status: "correct"}]
    feedback: "لیلا می‌گه she has curly, blond hair."
  en.a1.unit31.lesson03.exercise02.comprehension_mia_eyes:
    instruction: "رنگ چشمان میا چیست؟"
    correct_option: "green"
    distractors: ["blue", "brown", "black"]
    accepted_answers: [{value: "green", status: "correct"}]
    feedback: "لیلا می‌گه she has green eyes too."
  en.a1.unit31.lesson03.exercise03.listen_dialogue_height:
    instruction: "مطابق گفتگو، قد میا چطور استه؟"
    correct_option: "tall"
    distractors: ["short", "medium", "not mentioned"]
    accepted_answers: [{value: "tall", status: "correct"}]
    feedback: "لیلا می‌گه she's tall."
  en.a1.unit31.lesson03.exercise04.respond_describe_someone:
    instruction: "یک جمله بگین که یک دوست یا کدام عضو خانواده‌تان چطور استه."
    accepted_answers: ["She has brown hair", "She has brown hair.", "He has brown hair", "He has brown hair.", "She has blond hair", "She has blond hair.", "He has blond hair", "He has blond hair.", "She is tall", "She is tall.", "He is tall", "He is tall.", "She has blue eyes", "She has blue eyes.", "He has blue eyes", "He has blue eyes."]
    feedback: "می‌تانین با has یا is یک صفت قیافه را بگین، مثلاً She has brown hair."

  en.a1.unit31.lesson04.exercise01.reading_daniel_hair:
    instruction: "مطابق متن، موی دنیل چطور استه؟"
    correct_option: "short, black hair"
    distractors: ["long, blond hair", "curly, brown hair", "no hair"]
    accepted_answers: [{value: "short, black hair", status: "correct"}]
    feedback: "متن می‌گه Daniel has short, black hair."
  en.a1.unit31.lesson04.exercise02.reading_who_wears_glasses:
    instruction: "مطابق متن، کی عینک می‌زنه؟"
    correct_option: "Daniel"
    distractors: ["Leila", "both of them", "neither of them"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "متن می‌گه He (Daniel) wears glasses."
  en.a1.unit31.lesson04.exercise03.reading_leila_eyes:
    instruction: "رنگ چشمان لیلا چیست؟"
    correct_option: "blue"
    distractors: ["green", "brown", "black"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "متن می‌گه her eyes are blue."
  en.a1.unit31.lesson04.exercise04.write_own_description:
    instruction: "یک جمله در بارهٔ شکل خودتان بنویسین، با «I have» یا «I am»."
    accepted_answers: ["I have brown hair", "I have brown hair.", "I have black hair", "I have black hair.", "I have blond hair", "I have blond hair.", "I have blue eyes", "I have blue eyes.", "I have green eyes", "I have green eyes.", "I have brown eyes", "I have brown eyes.", "I am tall", "I am tall.", "I am short", "I am short."]
    feedback: "می‌تانین با I have یا I am شروع کنین، مثلاً I have brown hair یا I am tall."
