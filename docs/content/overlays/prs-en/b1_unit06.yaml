course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit06.narrative: {title: "قصهٔ تایر پنچر"}

lessons:
  en.b1.unit06.lesson01.narrative_vocabulary: {title: "While، flat tire، و stranger"}
  en.b1.unit06.lesson02.sequencing_with_while_and_when: {title: "در حالی که رانندگی می‌کدم، وقتی که ایستادم"}
  en.b1.unit06.lesson03.reading_the_flat_tire_story: {title: "متن خوانی: قصهٔ تایر پنچر"}
