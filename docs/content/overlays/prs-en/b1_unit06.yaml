    instruction: "دانیال می‌پرسه به میخانیک زنگ زدین یا نی. به نقش لیلا آوازی جواب بتین: بگین که بلی، قبل از رسیدن او قبلاً به یکی زنگ زده بودین، و میخانیک گفت که می‌تانه در ده دقیقه ترمیمش کنه -- و همینطور کد."
