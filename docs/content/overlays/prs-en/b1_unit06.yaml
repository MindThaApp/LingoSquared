teaching:
  en.b1.unit06.lesson01.teach.while: {title: "while", gloss: "در حالی که، همزمان با", note: "*while* یعنی همزمان با یک اتفاق دیگه.", example_gloss: "در حالی که رانندگی می‌کدم، باران شروع شد."}
  en.b1.unit06.lesson01.teach.flat_tire: {title: "flat tire", gloss: "تایر پنچر", note: "*flat tire* یعنی تایری که هوایش خالی شده و دیگه کار نمی‌کنه.", example_gloss: "تایرم در شاهراه پنچر شد."}
  en.b1.unit06.lesson01.teach.pull_over: {title: "pull over", gloss: "موتر را کنار سرک ایستاد کدن", note: "*pull over* یعنی موتر را کنار سرک متوقف کنین.", example_gloss: "مجبور شدم فوراً موتر را کنار سرک ایستاد کنم."}
  en.b1.unit06.lesson01.teach.stranger: {title: "stranger", gloss: "یک کس ناشناس", note: "*stranger* یعنی کسی که نمی‌شناسینش.", example_gloss: "یک کس ناشناس ایستاد تا کمکم کنه."}
  en.b1.unit06.lesson01.teach.mechanic: {title: "mechanic", gloss: "میخانیک", note: "*mechanic* یعنی کسی که موترها را ترمیم می‌کنه.", example_gloss: "میخانیک تایرم را زود ترمیم کد."}
  en.b1.unit06.lesson01.teach.said_that: {title: "said that", gloss: "گفت که (نقل قول غیرمستقیم)", note: "*said that* برای نقل قول غیرمستقیم حرف یک کس دیگه استعمال می‌شه.", example_gloss: "او گفت که می‌تانه کمک کنه."}

  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat: {title: "While I was driving to work, my tire went flat.", gloss: "در حالی که به سر کار می‌رفتم، تایرم پنچر شد.", note: "*while + past continuous* یک عمل پس‌زمینه را نشان می‌ته که یک اتفاق دیگه وسطش قطعش کد."}
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped: {title: "When I pulled over, a stranger stopped to help.", gloss: "وقتی که موتر را کنار سرک ایستاد کدم، یک کس ناشناس ایستاد تا کمک کنه.", note: "*when + simple past* اتفاق بعدی را در قصه معرفی می‌کنه."}
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing: {title: "While I was driving, my tire went flat. When I pulled over, a stranger helped me.", gloss: "در حالی که رانندگی می‌کدم، تایرم پنچر شد. وقتی که ایستاد کدم، یک کس ناشناس کمکم کد.", note: "*while* عمل پس‌زمینهٔ طولانی‌تر را نشان می‌ته، *when* اتفاق کوتاه بعدی را."}

  en.b1.unit06.lesson03.teach.had_already_called: {title: "had already called", gloss: "قبلاً زنگ زده بودم", note: "*had already + past participle* یعنی یک کار که قبل از یک اتفاق دیگه در گذشته انجام شده بود.", example_gloss: "تا وقتی او رسید، قبلاً به دانیال زنگ زده بودم."}
  en.b1.unit06.lesson03.teach.kept_his_word: {title: "kept his word", gloss: "به قولش وفا کد", note: "*kept his word* یعنی همو کاری را کد که وعده داده بود.", example_gloss: "او به قولش وفا کد و در ده دقیقه ترمیمش کد."}
  en.b1.unit06.lesson03.teach.reading_passage: {title: "متن دربارهٔ قصهٔ تایر پنچر", gloss: "صبح دیروز، در حالی که لیلا به سر کار می‌رفت، تایرش ناگهان پنچر شد. او در یک سرک آرام موتر را ایستاد کد. یک کس ناشناس موترش را ایستاد کد و پیشنهاد کمک داد. تا وقتی میخانیک رسید، لیلا قبلاً به دانیال زنگ زده بود تا بگه که ناوقت می‌رسه. میخانیک گفت که می‌تانه تایر را در ده دقیقه ترمیم کنه. او به قولش وفا کد، و لیلا فقط بیست دقیقه ناوقت به کار رسید.", note: "همی متن یک قصهٔ واقعی با ترتیب اتفاقات و نقل قول غیرمستقیم را نشان می‌ته -- سویهٔ B1."}

  en.b1.unit06.lesson04.teach.q_youre_late_what_happened: {title: "سوال دانیال", gloss: "دانیال می‌گه: ناوقت کدی! چی شد؟", note: "*You're late! What happened?* یک شکل معمولی برای پرسیدن دلیل ناوقت رسیدن یک دوست استه."}
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly: {title: "جواب لیلا", gloss: "لیلا می‌گه: در حالی که به سر کار می‌رفتم، تایرم ناگهان پنچر شد.", note: "*while + past continuous* پس‌زمینهٔ قصه را شروع می‌کنه."}
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do: {title: "سوال دانیال", gloss: "دانیال می‌گه: وای نی! چی کدی؟", note: "*What did you do?* برای پرسیدن اتفاق بعدی در یک قصه استعمال می‌شه."}
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped: {title: "جواب لیلا", gloss: "لیلا می‌گه: موتر را کنار سرک ایستاد کدم، و یک کس ناشناس ایستاد تا کمکم کنه.", note: "همی جمله اتفاق بعدی قصه را نشان می‌ته."}
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic: {title: "سوال دانیال", gloss: "دانیال می‌گه: خیلی مهربان بود. به میخانیک زنگ زدی؟", note: "*That was kind of him* یک تعریف کوتاه از رفتار یک کس ناشناس استه."}
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said: {title: "جواب لیلا", gloss: "لیلا می‌گه: بلی، تا وقتی رسید، قبلاً به یکی زنگ زده بودم. میخانیک گفت که می‌تانه در ده دقیقه ترمیمش کنه، و واقعاً همینطور شد!", note: "همی جمله *had already* و نقل قول غیرمستقیم را با هم نشان می‌ته."}

