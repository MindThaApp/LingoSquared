    feedback: "پیام می‌گه are you free at 6pm."
  en.a1.unit14.lesson03.exercise02.read_meeting_place:
    instruction: "پیام را بخوانین. کجا پیشنهاد شده همدیگه را ببینن؟"
    correct_option: "کافه"
    distractors: ["پارک", "کتابخانه", "رستورانت"]
    accepted_answers: [{value: "کافه", status: "correct"}]
    feedback: "پیام می‌گه let's meet at the cafe."
