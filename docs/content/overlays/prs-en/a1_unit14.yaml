  en.a1.unit14.lesson02.teach.can_you_repeat: {title: "ببخشین، می‌شه تکرار کنین؟", gloss: "ببخشین، می‌شه تکرار کنین؟", note: "Sorry, can you repeat that؟ وقتی چیزی را نشنیدین یا نفهمیدین گفته می‌شه."}
