    instruction: "هدف همی پیام چیست؟"
    correct_option: "to suggest a meeting time and place"
    distractors: ["to ask for money", "to say goodbye", "to ask about the weather"]
    accepted_answers: [{value: "to suggest a meeting time and place", status: "correct"}]
    feedback: "پیام یک وقت و جای مشخص برای دیدار پیشنهاد می‌ده."
  en.a1.unit14.lesson03.exercise04.order_lets_meet:
