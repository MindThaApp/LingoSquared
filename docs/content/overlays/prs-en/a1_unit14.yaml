  en.a1.unit14.lesson04.exercise04.order_a_yes_what_time:
    instruction: "کلمات را برای گفتن «آه، بلی! کدام ساعت؟» ترتیب کنین."
    accepted_answers: [{value: ["Oh", "yes", "What", "time"], status: "correct"}]
    feedback: "ترتیب درست: Oh, yes! What time?"
  en.a1.unit14.lesson04.exercise05.reply_as_daniel:
    instruction: "به نقش دنیل، به لیلا زنگ بزنین، بپرسین امشب وقت داره، سوال را دوباره بپرسین، و ساعت شش تو کافه را پیشنهاد کنین."
    accepted_answers:
