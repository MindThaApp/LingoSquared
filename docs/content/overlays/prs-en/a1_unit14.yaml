    instruction: "طرف مقابل خیلی تیز گپ می‌زنه. چه می‌گین؟"
    correct_option: "Can you speak more slowly, please?"
    distractors: ["Are you free tonight?", "Hello, this is Daniel.", "How about 6pm?"]
    accepted_answers: [{value: "Can you speak more slowly, please?", status: "correct"}]
    feedback: "Can you speak more slowly, please؟ یعنی «می‌شه آهسته‌تر گپ بزنین؟»."
  en.a1.unit14.lesson02.exercise03.order_cant_hear:
    instruction: "کلمات را برای گفتن «آواز تان را خوب نمی‌شنوم» ترتیب کنین."
    accepted_answers: [{value: ["I", "can't", "hear", "you", "well"], status: "correct"}]
    feedback: "ترتیب درست: I can't hear you well."
