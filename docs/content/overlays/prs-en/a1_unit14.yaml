exercises:
  en.a1.unit14.lesson01.exercise01.listen_greeting:
    instruction: "گوش کنین و معلوم کنین کی صحبت می‌کنه."
    correct_option: "دنیل"
    distractors: ["لیلا", "مینا", "سارا"]
    accepted_answers: [{value: "دنیل", status: "correct"}]
    feedback: "Hello, this is Daniel یعنی «الو، دنیل استم»."
  en.a1.unit14.lesson01.exercise02.choose_phone_greeting:
    instruction: "به تلفون جواب می‌دین. برای معرفی خود چه می‌گین؟"
    correct_option: "Hello, this is Daniel."
    distractors: ["Are you free tonight?", "Sorry, can you repeat that?", "How about 6pm?"]
    accepted_answers: [{value: "Hello, this is Daniel.", status: "correct"}]
    feedback: "Hello, this is Daniel جملهٔ معیاری برای معرفی خود در تلفون استه."
  en.a1.unit14.lesson01.exercise03.order_are_you_free:
    instruction: "کلمات را برای پرسیدن «امشب وقت داری؟» ترتیب کنین."
    accepted_answers: [{value: ["Are", "you", "free", "tonight"], status: "correct"}]
    feedback: "ترتیب درست: Are you free tonight?"
  en.a1.unit14.lesson01.exercise04.reply_as_leila_hi:
    instruction: "به تلفون جواب می‌دین. خود را به‌عنوان لیلا معرفی کنین."
    accepted_answers:
      - {value: "Hi, it's Leila.", status: "correct"}
      - {value: "Hi, it's Leila", status: "correct"}
    feedback: "Hi, it's Leila یعنی «سلام، لیلا استم»."
  en.a1.unit14.lesson01.exercise05.write_phone_intro:
    instruction: "بنویسین چطور به‌عنوان دنیل خود را در تلفون معرفی می‌کنین."
    accepted_answers:
      - {value: "Hello, this is Daniel.", status: "correct"}
      - {value: "Hello, this is Daniel", status: "correct"}
    feedback: "Hello, this is Daniel یعنی «الو، دنیل استم»."

  en.a1.unit14.lesson02.exercise01.listen_repeat_request:
    instruction: "گوش کنین و معلوم کنین چه خواهشی می‌شه."
