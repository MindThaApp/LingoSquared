    instruction: "یک پیام بنویسین که بپرسین کسی ساعت شش شام وقت داره یا نی."
    accepted_answers:
      - {value: "Are you free at 6pm?", status: "correct"}
      - {value: "Are you free at 6pm", status: "correct"}
    feedback: "Are you free at 6pm؟ یعنی «ساعت شش شام وقت داری؟»."

  en.a1.unit14.lesson04.exercise01.listen_who_calls:
    instruction: "گفتگو را گوش کنین و معلوم کنین کی زنگ می‌زنه."
    correct_option: "دنیل"
    distractors: ["لیلا", "مینا", "سارا"]
    accepted_answers: [{value: "دنیل", status: "correct"}]
    feedback: "دنیل می‌گه Hi Leila, it's Daniel."
  en.a1.unit14.lesson04.exercise02.listen_suggested_time:
    instruction: "گوش کنین و معلوم کنین چه وقت و جایی پیشنهاد می‌شه."
    correct_option: "ساعت شش شام تو کافه"
    distractors: ["ساعت هفت تو پارک", "ساعت پنج تو کتابخانه", "ساعت شش صبح تو کافه"]
    accepted_answers: [{value: "ساعت شش شام تو کافه", status: "correct"}]
    feedback: "دنیل می‌گه How about 6pm at the cafe?"
  en.a1.unit14.lesson04.exercise03.choose_leila_confusion:
    instruction: "لیلا سوال دنیل را واضح نشنیده. او چه می‌گه؟"
    correct_option: "Sorry, can you repeat that?"
    distractors: ["Oh, yes! What time?", "How about 6pm at the cafe?", "Hi Leila, it's Daniel."]
    accepted_answers: [{value: "Sorry, can you repeat that?", status: "correct"}]
