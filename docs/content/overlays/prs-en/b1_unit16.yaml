teaching:
  en.b1.unit16.lesson01.teach.advice: {title: "advice", gloss: "نصیحت، مشوره", note: "*advice* یعنی نظری که دربارهٔ اینکه کسی چی کار کنه، داده می‌شه.", example_gloss: "لیلا به دانیال یک نصیحتِ مفید داد."}
  en.b1.unit16.lesson01.teach.suggest: {title: "suggest", gloss: "پیشنهاد کدن", note: "*suggest* یعنی یک فکر را برای فکر کدنِ کسی دیگر پیشنهاد کدن.", example_gloss: "لیلا یک راه برای مدیریتِ کارِ زیادش پیشنهاد کد."}
  en.b1.unit16.lesson01.teach.overwhelmed: {title: "overwhelmed", gloss: "خسته و تحتِ فشار، ندانستنِ اینکه چی کار کنی", note: "*overwhelmed* یعنی احساسِ اینکه کارِ بیشتر از توانِ مدیریتت داری.", example_gloss: "دانیال از دو پروژه‌اش تحتِ فشار احساس می‌کد."}
  en.b1.unit16.lesson01.teach.prioritize: {title: "prioritize", gloss: "اولویت بتن", note: "*prioritize* یعنی مهم‌ترین کار را اول انجام دادن.", example_gloss: "دانیال تصمیم گرفت پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر بود، اولویت بته."}
  en.b1.unit16.lesson01.teach.workload: {title: "workload", gloss: "مقدارِ کار", note: "*workload* یعنی مجموعِ کاری که یک شخص باید انجام بته.", example_gloss: "کارِ دانیال بعد از اینکه در مارچ شامل تیم شد، زیاد شد."}
  en.b1.unit16.lesson01.teach.decline: {title: "decline", gloss: "به شکل مؤدبانه رد کدن", note: "*decline* یعنی یک پیشنهاد یا نصیحت را به شکل مؤدبانه رد کدن.", example_gloss: "دانیال می‌تانست نصیحت را قبول کنه یا به شکل مؤدبانه رد کنه."}

  en.b1.unit16.lesson02.teach.if_i_were_you: {title: "If I were you, I would talk to your manager.", gloss: "اگه جای تو می‌بودم، با مدیرت صحبت می‌کدم.", note: "*If I were you, I would...* یک نصیحت را با یک شکلِ فرضِ غیرواقعی می‌ته."}
  en.b1.unit16.lesson02.teach.you_should_prioritize: {title: "You should prioritize the project with the closer deadline.", gloss: "باید پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه، اولویت بتی.", note: "*You should...* یک توصیهٔ مستقیم استه."}
  en.b1.unit16.lesson02.teach.how_about: {title: "How about asking a colleague to help?", gloss: "چطوره از یک همکار بخواهی که کمک کنه؟", note: "*How about + -ing...?* یک پیشنهادِ نرم‌تر استه."}
  en.b1.unit16.lesson02.teach.grammar_advice_forms: {title: "قاعدهٔ شکل‌های نصیحت", gloss: "نصیحت و پیشنهاد چند شکل دارن: If I were you, I would... (یک فرضِ غیرواقعی)، You should... (یک توصیهٔ مستقیم)، و How about + -ing...؟ (یک پیشنهادِ نرم‌تر). بسته به اینکه چقدر قاطع می‌خواین آواز بتین، یک شکلِ قوی‌تر یا نرم‌تر انتخاب کنین.", note: "همی سه شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit16.lesson03.teach.deadline: {title: "deadline", gloss: "ضرب‌الاجل", note: "*deadline* یعنی تاریخ یا وقتی که یک کار باید تمام شه.", example_gloss: "ضرب‌الاجلِ نزدیک‌ترِ دانیال جمعهٔ آینده استه."}
  en.b1.unit16.lesson03.teach.that_makes_sense: {title: "That makes sense. I'll try it.", gloss: "همی منطقی استه. کوشش می‌کنم.", note: "*That makes sense* یعنی قبول کدنِ نصیحت به شکلِ مثبت.", example_gloss: "همی منطقی استه. همی هفته کوشش می‌کنم."}
  en.b1.unit16.lesson03.teach.reading_passage: {title: "متن دربارهٔ نصیحت میانِ دوستان", gloss: "سلام لیلا، همی هفته احساسِ تحتِ فشار می‌کنم. دو پروژه را رهبری می‌کنم، و صنفِ شامگاهی‌ام هم روی آن استه. کدام نصیحت داری؟ سلام دانیال، اگه جای تو می‌بودم، با مدیرت دربارهٔ کارِ زیادت صحبت می‌کدم. باید پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه هم اولویت بتی. چطوره از میا بخواهی که با آن یکی کمک کنه؟ تشکر، همی منطقی استه. کوشش می‌کنم و بتم می‌دانم چطور پیش می‌ره.", note: "همی متن if I were you، should، و how about را باهم استفاده می‌ته."}

  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects: {title: "سوال دانیال", gloss: "دانیال می‌گه: یک‌کمی تحتِ فشار استم. دو پروژه را رهبری می‌کنم، و هنوزم صنفِ شامگاهی‌ام سه بار در هفته استه.", note: "*I'm a little overwhelmed* یعنی احساسِ فشارِ زیاد."}
  en.b1.unit16.lesson04.teach.a_talk_to_manager: {title: "جواب لیلا", gloss: "لیلا می‌گه: اگه جای تو می‌بودم، دربارهٔ کارِ زیادت با مدیرت صحبت می‌کدم.", note: "*If I were you, I would...* یک نصیحتِ مؤدبانه استه."}
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem: {title: "جواب دانیال", gloss: "دانیال می‌گه: همی فکرِ خوبیه، اما نمی‌خواهم آواز بتم که نمی‌تانم از پسش برایم.", note: "*I don't want to seem like* نگرانی از قضاوتِ دیگران را نشان می‌ته."}
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about: {title: "سوال لیلا", gloss: "لیلا می‌گه: باید اول پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه اولویت بتی. چطوره از یک همکار بخواهی که با آن یکی کمک کنه؟", note: "همینه You should و How about را باهم استفاده می‌ته."}
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week: {title: "جواب دانیال", gloss: "دانیال می‌گه: همینه را خوش دارم. از میا می‌پرسم که آیا همی هفته وقت داره.", note: "*I like that* یعنی قبول کدنِ پیشنهاد."}
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan: {title: "جواب لیلا", gloss: "لیلا می‌گه: همی مثل یک پلانِ محکم آواز می‌ته.", note: "*That sounds like a solid plan* یک تأییدِ مثبت استه."}

exercises:
  en.b1.unit16.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "overwhelmed"
    distractors: ["advice", "suggest", "prioritize"]
    accepted_answers: [{value: "overwhelmed", status: "correct"}]
    feedback: "*overwhelmed* یعنی خسته و تحتِ فشار."
  en.b1.unit16.lesson01.exercise02.choose_prioritize:
    instruction: "کدام کلمه یعنی مهم‌ترین کار را اول انجام دادن؟"
    correct_option: "prioritize"
    distractors: ["advice", "workload", "decline"]
    accepted_answers: [{value: "prioritize", status: "correct"}]
    feedback: "*prioritize* یعنی اولویت بتن."
  en.b1.unit16.lesson01.exercise03.choose_decline:
    instruction: "کدام کلمه یعنی یک پیشنهاد را به شکل مؤدبانه رد کدن؟"
    correct_option: "decline"
    distractors: ["suggest", "advice", "prioritize"]
    accepted_answers: [{value: "decline", status: "correct"}]
    feedback: "*decline* یعنی به شکل مؤدبانه رد کدن."
  en.b1.unit16.lesson01.exercise04.match_advice_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "an opinion offered about what someone should do", right: "advice"}
          - {left: "to propose an idea for someone to consider", right: "suggest"}
          - {left: "feeling that you have more to deal with than you can manage", right: "overwhelmed"}
          - {left: "to deal with the most important task first", right: "prioritize"}
          - {left: "the total amount of work a person has to do", right: "workload"}
          - {left: "to politely refuse a suggestion or offer", right: "decline"}
        status: "correct"
    feedback: "*advice*=نصیحت، *suggest*=پیشنهاد کدن، *overwhelmed*=تحتِ فشار، *prioritize*=اولویت بتن، *workload*=مقدارِ کار، *decline*=به شکل مؤدبانه رد کدن."
  en.b1.unit16.lesson01.exercise05.write_workload:
    instruction: "کلمه‌ای را که یعنی مجموعِ کاری که یک شخص باید انجام بته بنویسین."
    accepted_answers:
      - {value: "workload", status: "correct"}
      - {value: "Workload", status: "correct"}
    feedback: "*workload* یعنی مقدارِ کار."

  en.b1.unit16.lesson02.exercise01.choose_if_i_were_you:
    instruction: "کدام جمله با شکلِ فرضِ غیرواقعیِ 'If I were you' نصیحت می‌ته؟"
    correct_option: "If I were you, I would talk to your manager."
    distractors: ["You should prioritize the project with the closer deadline.", "How about asking a colleague to help?", "That's a good idea, but I don't want to seem like I can't handle it."]
    accepted_answers: [{value: "If I were you, I would talk to your manager.", status: "correct"}]
    feedback: "*If I were you, I would talk to your manager* یعنی اگه جای تو می‌بودم، با مدیرت صحبت می‌کدم."
  en.b1.unit16.lesson02.exercise02.choose_how_about:
    instruction: "کدام جمله با 'How about' یک پیشنهادِ نرم می‌ته؟"
    correct_option: "How about asking a colleague to help?"
    distractors: ["If I were you, I would talk to your manager.", "You should prioritize the project with the closer deadline.", "I like that. I'll ask Mia if she has time this week."]
    accepted_answers: [{value: "How about asking a colleague to help?", status: "correct"}]
    feedback: "*How about asking a colleague to help* یعنی چطوره از یک همکار بخواهی که کمک کنه؟"
  en.b1.unit16.lesson02.exercise03.order_you_should_prioritize:
    instruction: "کلمات را طوری تنظیم کنین که «باید پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه، اولویت بتی» شود."
    accepted_answers: [{value: ["You", "should", "prioritize", "the", "project", "with", "the", "closer", "deadline"], status: "correct"}]
    feedback: "ترتیب درست: *You should prioritize the project with the closer deadline*."
  en.b1.unit16.lesson02.exercise04.reply_advise_daniel:
    instruction: "به دانیال دربارهٔ کارِ زیادش نصیحت کن، با 'If I were you' آغاز کن."
    accepted_answers:
      - {value: "If I were you, I would talk to your manager.", status: "correct"}
      - {value: "If I were you, I would talk to your manager", status: "correct"}
    feedback: "*If I were you, I would talk to your manager* یعنی اگه جای تو می‌بودم، با مدیرت صحبت می‌کدم."
  en.b1.unit16.lesson02.exercise05.write_how_about:
    instruction: "یک پیشنهادِ نرم بنویسین که بپرسه آیا یک همکار می‌تانه کمک کنه، با 'How about' آغاز کنین."
    accepted_answers:
      - {value: "How about asking a colleague to help?", status: "correct"}
      - {value: "How about asking a colleague to help", status: "correct"}
    feedback: "*How about asking a colleague to help* یعنی چطوره از یک همکار بخواهی که کمک کنه؟"

  en.b1.unit16.lesson03.exercise01.comprehend_problem:
    instruction: "دانیال چی مشکلی را به لیلا توضیح می‌ته؟"
    correct_option: "leading two projects, and my evening class is on top of that"
    distractors: ["missing every deadline so far", "having no work to do", "disagreeing with his manager"]
    accepted_answers: [{value: "leading two projects, and my evening class is on top of that", status: "correct"}]
