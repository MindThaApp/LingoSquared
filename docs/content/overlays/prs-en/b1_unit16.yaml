  en.b1.unit16.lesson03.exercise02.comprehend_daniels_response:
    instruction: "دانیال به نصیحتِ لیلا چطور جواب می‌ته؟"
    correct_option: "that makes sense. I'll try it"
    distractors: ["he ignores the advice completely", "he declines the advice politely", "he asks Leila to do the work for him"]
    accepted_answers: [{value: "that makes sense. I'll try it", status: "correct"}]
    feedback: "متن می‌گه *that makes sense. I'll try it*."
  en.b1.unit16.lesson03.exercise03.recognize_deadline:
    instruction: "کدام کلمه یعنی تاریخی که یک کار باید تا آن تمام شه؟"
    correct_option: "deadline"
    distractors: ["workload", "advice", "overwhelmed"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "*deadline* یعنی ضرب‌الاجل."
  en.b1.unit16.lesson03.exercise04.order_that_makes_sense:
    instruction: "کلمات را طوری تنظیم کنین که «همی منطقی استه. کوشش می‌کنم» شود."
    accepted_answers: [{value: ["That", "makes", "sense", "I'll", "try", "it"], status: "correct"}]
    feedback: "ترتیب درست: *That makes sense. I'll try it*."
  en.b1.unit16.lesson03.exercise05.write_ask_mia_help:
    instruction: "یک پیشنهادِ نرم بنویسین که بپرسه آیا میا می‌تانه با آن یکی کمک کنه، با 'How about' آغاز کنین."
    accepted_answers:
      - {value: "How about asking Mia to help with the other one?", status: "correct"}
      - {value: "How about asking Mia to help with the other one", status: "correct"}
    feedback: "*How about asking Mia to help with the other one* یعنی چطوره از میا بخواهی که با آن یکی کمک کنه؟"

  en.b1.unit16.lesson04.exercise01.listen_overwhelmed_two_projects:
    instruction: "گفتگو را گوش کنین و بگین دانیال چرا تحتِ فشار استه."
