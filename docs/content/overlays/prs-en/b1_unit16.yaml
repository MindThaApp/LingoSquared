    distractors: ["ask Mia to take over both projects entirely", "cancel the evening class instead", "extend the deadline by two weeks"]
    accepted_answers: [{value: "How about asking a colleague to help with the other one?", status: "correct"}]
    feedback: "لیلا می‌گه *How about asking a colleague to help with the other one?*"
  en.b1.unit16.lesson04.exercise04.order_ask_mia_this_week:
    instruction: "کلمات را طوری تنظیم کنین که «از میا می‌پرسم که آیا همی هفته وقت داره» شود."
    accepted_answers: [{value: ["I'll", "ask", "Mia", "if", "she", "has", "time", "this", "week"], status: "correct"}]
    feedback: "ترتیب درست: *I'll ask Mia if she has time this week*."
  en.b1.unit16.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌گه: باید اول پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه اولویت بتی. چطوره از یک همکار بخواهی که با آن یکی کمک کنه؟"
    accepted_answers:
      - {value: "I like that. I'll ask Mia if she has time this week.", status: "correct"}
      - {value: "I like that. I'll ask Mia if she has time this week", status: "correct"}
    feedback: "*I like that. I'll ask Mia if she has time this week* یعنی همینه را خوش دارم. از میا می‌پرسم که آیا همی هفته وقت داره."
  en.b1.unit16.lesson04.exercise06.speak_advice_dialogue:
    instruction: "دانیال می‌گه: یک‌کمی تحتِ فشار استم. دو پروژه را رهبری می‌کنم، و هنوزم صنفِ شامگاهی‌ام سه بار در هفته استه."
    accepted_answers:
      - {value: "If I were you, I would talk to your manager about the workload.", status: "correct"}
      - {value: "If I were you, I would talk to your manager about the workload", status: "correct"}
    feedback: "*If I were you, I would talk to your manager about the workload* یعنی اگه جای تو می‌بودم، دربارهٔ کارِ زیادت با مدیرت صحبت می‌کدم."
