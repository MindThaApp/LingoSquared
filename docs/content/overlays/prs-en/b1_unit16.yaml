    distractors: ["ask for a longer deadline from the client", "quit the evening class immediately", "ignore the workload for now"]
    accepted_answers: [{value: "talk to your manager about the workload", status: "correct"}]
    feedback: "لیلا می‌گه *talk to your manager about the workload*."
  en.b1.unit16.lesson04.exercise03.choose_leilas_second_suggestion:
    instruction: "لیلا بعد از گفتنِ اینکه دانیال ضرب‌الاجلِ نزدیک‌ترش را اولویت بته، چی پیشنهادِ دیگری می‌ته؟"
