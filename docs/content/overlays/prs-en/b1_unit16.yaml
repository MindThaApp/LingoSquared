course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit16.advice: {title: "اگه جای تو می‌بودم، من..."}

lessons:
  en.b1.unit16.lesson01.advice_vocabulary: {title: "کلمات برای نصیحت کدن"}
  en.b1.unit16.lesson02.advice_forms: {title: "اگه جای تو می‌بودم، با مدیرت صحبت می‌کدم"}
  en.b1.unit16.lesson03.reading_advice_between_friends: {title: "متن خوانی: نصیحت دربارهٔ یک کارِ زیاد"}
  en.b1.unit16.lesson04.the_advice_dialogue: {title: "باید ضرب‌الاجلِ نزدیک‌تر را اولویت بتی"}

teaching:
  en.b1.unit16.lesson01.teach.advice: {title: "advice", gloss: "نصیحت، مشوره", note: "*advice* یعنی نظری که دربارهٔ اینکه کسی چی کار کنه، داده می‌شه.", example_gloss: "لیلا به دنیل یک نصیحتِ مفید داد."}
  en.b1.unit16.lesson01.teach.suggest: {title: "suggest", gloss: "پیشنهاد کدن", note: "*suggest* یعنی یک فکر را برای فکر کدنِ کسی دیگر پیشنهاد کدن.", example_gloss: "لیلا یک راه برای مدیریتِ کارِ زیادش پیشنهاد کد."}
  en.b1.unit16.lesson01.teach.overwhelmed: {title: "overwhelmed", gloss: "خسته و تحتِ فشار، ندانستنِ اینکه چی کار کنی", note: "*overwhelmed* یعنی احساسِ اینکه کارِ بیشتر از توانِ مدیریتت داری.", example_gloss: "دنیل از دو پروژه‌اش تحتِ فشار احساس می‌کد."}
  en.b1.unit16.lesson01.teach.prioritize: {title: "prioritize", gloss: "اولویت بتن", note: "*prioritize* یعنی مهم‌ترین کار را اول انجام دادن.", example_gloss: "دنیل تصمیم گرفت پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر بود، اولویت بته."}
  en.b1.unit16.lesson01.teach.workload: {title: "workload", gloss: "مقدارِ کار", note: "*workload* یعنی مجموعِ کاری که یک شخص باید انجام بته.", example_gloss: "کارِ دنیل بعد از اینکه در مارچ شامل تیم شد، زیاد شد."}
  en.b1.unit16.lesson01.teach.decline: {title: "decline", gloss: "به شکل مؤدبانه رد کدن", note: "*decline* یعنی یک پیشنهاد یا نصیحت را به شکل مؤدبانه رد کدن.", example_gloss: "دنیل می‌تانست نصیحت را قبول کنه یا به شکل مؤدبانه رد کنه."}

  en.b1.unit16.lesson02.teach.if_i_were_you: {title: "If I were you, I would talk to your manager.", gloss: "اگه جای تو می‌بودم، با مدیرت صحبت می‌کدم.", note: "*If I were you, I would...* یک نصیحت را با یک شکلِ فرضِ غیرواقعی می‌ته."}
  en.b1.unit16.lesson02.teach.you_should_prioritize: {title: "You should prioritize the project with the closer deadline.", gloss: "باید پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه، اولویت بتی.", note: "*You should...* یک توصیهٔ مستقیم استه."}
  en.b1.unit16.lesson02.teach.how_about: {title: "How about asking a colleague to help?", gloss: "چطوره از یک همکار بخواهی که کمک کنه؟", note: "*How about + -ing...?* یک پیشنهادِ نرم‌تر استه."}
  en.b1.unit16.lesson02.teach.grammar_advice_forms: {title: "قاعدهٔ شکل‌های نصیحت", gloss: "نصیحت و پیشنهاد چند شکل دارن: If I were you, I would... (یک فرضِ غیرواقعی)، You should... (یک توصیهٔ مستقیم)، و How about + -ing...؟ (یک پیشنهادِ نرم‌تر). بسته به اینکه چقدر قاطع می‌خواین معلوم شین، یک شکلِ قوی‌تر یا نرم‌تر انتخاب کنین.", note: "همی سه شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit16.lesson03.teach.deadline: {title: "deadline", gloss: "ضرب‌الاجل", note: "*deadline* یعنی تاریخ یا وقتی که یک کار باید تمام شه.", example_gloss: "ضرب‌الاجلِ نزدیک‌ترِ دنیل جمعهٔ آینده استه."}
  en.b1.unit16.lesson03.teach.that_makes_sense: {title: "That makes sense. I'll try it.", gloss: "همی منطقی استه. کوشش می‌کنم.", note: "*That makes sense* یعنی قبول کدنِ نصیحت به شکلِ مثبت.", example_gloss: "همی منطقی استه. همی هفته کوشش می‌کنم."}
  en.b1.unit16.lesson03.teach.reading_passage: {title: "متن دربارهٔ نصیحت میانِ دوستان", gloss: "سلام لیلا، همی هفته احساسِ تحتِ فشار می‌کنم. دو پروژه را رهبری می‌کنم، و صنفِ شامم هم علاوه بر آن استه. کدام نصیحت داری؟ سلام دنیل، اگه جای تو می‌بودم، با مدیرت دربارهٔ کارِ زیادت صحبت می‌کدم. باید پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه هم اولویت بتی. چطوره از میا بخواهی که با آن یکی کمک کنه؟ تشکر، همی منطقی استه. کوشش می‌کنم و برایت خبر می‌تم که چطور پیش رفت.", note: "همی متن if I were you، should، و how about را باهم استفاده می‌کنه."}

  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects: {title: "سوال دنیل", gloss: "دنیل می‌گه: یک‌کمی تحتِ فشار استم. دو پروژه را رهبری می‌کنم، و هنوزم صنفِ شامم سه بار در هفته استه.", note: "*I'm a little overwhelmed* یعنی احساسِ فشارِ زیاد."}
  en.b1.unit16.lesson04.teach.a_talk_to_manager: {title: "جواب لیلا", gloss: "لیلا می‌گه: اگه جای تو می‌بودم، دربارهٔ کارِ زیادت با مدیرت صحبت می‌کدم.", note: "*If I were you, I would...* یک نصیحتِ مؤدبانه استه."}
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem: {title: "جواب دنیل", gloss: "دنیل می‌گه: همی فکرِ خوبیه، اما نمی‌خواهم طوری معلوم شه که از پسش برآمده نمی‌تانم.", note: "*I don't want to seem like* نگرانی از قضاوتِ دیگران را نشان می‌ته."}
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about: {title: "سوال لیلا", gloss: "لیلا می‌گه: باید اول پروژه‌ای را که ضرب‌الاجلش نزدیک‌تر استه اولویت بتی. چطوره از یک همکار بخواهی که با آن یکی کمک کنه؟", note: "همی جمله You should و How about را باهم استفاده می‌کنه."}
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week: {title: "جواب دنیل", gloss: "دنیل می‌گه: همی را خوش دارم. از میا می‌پرسم که آیا همی هفته وقت داره.", note: "*I like that* یعنی قبول کدنِ پیشنهاد."}
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan: {title: "جواب لیلا", gloss: "لیلا می‌گه: همی یک پلانِ خوب و محکم معلوم می‌شه.", note: "*That sounds like a solid plan* یک تأییدِ مثبت استه."}

