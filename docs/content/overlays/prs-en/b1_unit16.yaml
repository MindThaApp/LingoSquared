    distractors: ["missing his evening class entirely", "having no projects to work on", "disagreeing with Leila's plan"]
    accepted_answers: [{value: "leading two projects, and I still have my evening class three times a week", status: "correct"}]
    feedback: "دانیال می‌گه *leading two projects, and I still have my evening class three times a week*."
  en.b1.unit16.lesson04.exercise02.listen_talk_to_manager:
