course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit15.complaints: {title: "می‌خواهم دربارهٔ یک کالای خراب شکایت کنم"}

lessons:
  en.b1.unit15.lesson01.complaints_vocabulary: {title: "کلمات برای شکایت کدن"}
  en.b1.unit15.lesson02.complaint_sentences: {title: "می‌خواهم دربارهٔ یک کالای خراب شکایت کنم"}
  en.b1.unit15.lesson03.reading_a_complaint_email: {title: "متن خوانی: شکایت دربارهٔ یک چوکیِ دفتر"}
  en.b1.unit15.lesson04.the_complaint_call_dialogue: {title: "آیا پول برگشت می‌خواهین یا تعویض؟"}

teaching:
  en.b1.unit15.lesson01.teach.complain: {title: "complain", gloss: "شکایت کدن", note: "*complain* یعنی به شکل رسمی گفتن که یک چیز خراب یا غیرقابل قبول استه.", example_gloss: "میا تصمیم گرفت دربارهٔ چوکیِ خراب شکایت کنه."}
  en.b1.unit15.lesson01.teach.damaged: {title: "damaged", gloss: "خراب، آسیب‌دیده", note: "*damaged* حالتِ یک کالا را که خراب یا شکسته باشه، توصیف می‌کنه.", example_gloss: "چوکی خراب رسید."}
  en.b1.unit15.lesson01.teach.refund: {title: "refund", gloss: "پول برگشت (بازپرداخت)", note: "*refund* یعنی پولی که برای یک کالای خراب یا برگشتی دوباره داده می‌شه.", example_gloss: "میا پول برگشت را خواست."}
  en.b1.unit15.lesson01.teach.replacement: {title: "replacement", gloss: "تعویض (چیزِ نو به‌جای خراب)", note: "*replacement* یعنی یک چیزِ نو که به‌جای چیزِ خراب داده می‌شه.", example_gloss: "شرکت به‌جایش یک تعویض پیشنهاد کد."}
  en.b1.unit15.lesson01.teach.resolve: {title: "resolve", gloss: "حل کدن", note: "*resolve* یعنی یک مشکل را به‌کلی حل یا رفع کدن.", example_gloss: "مأمور وعده داد که مشکل را زود حل کنه."}
  en.b1.unit15.lesson01.teach.issue: {title: "issue", gloss: "مشکل", note: "*issue* یعنی یک مشکلی که باید حل شه.", example_gloss: "میا مشکل را واضح توضیح داد."}

  en.b1.unit15.lesson02.teach.writing_to_complain: {title: "I'm writing to complain about a damaged product.", gloss: "می‌خواهم دربارهٔ یک کالای خراب شکایت کنم.", note: "*I'm writing to complain about* یک شکایتِ نوشتاریِ مؤدبانه را شروع می‌کنه."}
  en.b1.unit15.lesson02.teach.would_like_refund: {title: "I would like a refund for this item.", gloss: "پول برگشتِ همی کالا را می‌خواهم.", note: "*I would like a refund for* یک درخواستِ مؤدبانه برای پول برگشت استه."}
  en.b1.unit15.lesson02.teach.grammar_complaint_structure: {title: "قاعدهٔ شکایتِ نوشتاری", gloss: "یک شکایتِ نوشتاریِ مؤدبانه معمولاً سه بخش داره: نام بردنِ مشکل (I'm writing to complain about...)، گفتنِ اینکه چی واقعاً واقع شد (it arrived damaged / it stopped working)، و خواستنِ یک حلِ مشخص (I would like a refund / I would like a replacement).", note: "همی سه بخش شکایت را واضح و مؤدبانه می‌سازن."}

  en.b1.unit15.lesson03.teach.desk_chair: {title: "desk chair", gloss: "چوکیِ دفتر", note: "*desk chair* یعنی چوکی‌یی که پشتِ میزِ کار استفاده می‌شه.", example_gloss: "میا یک چوکیِ دفترِ نو برای دفترِ خانگی‌اش سفارش داد."}
  en.b1.unit15.lesson03.teach.as_soon_as_possible: {title: "as soon as possible", gloss: "هرچه زودتر", note: "*as soon as possible* یعنی به زودترین وقتِ ممکن.", example_gloss: "میا یک تعویض را هرچه زودتر خواست."}
  en.b1.unit15.lesson03.teach.reading_passage: {title: "متن دربارهٔ شکایت از یک چوکیِ دفتر", gloss: "تیمِ گرین‌دسک عزیز، می‌خواهم دربارهٔ یک کالای خراب شکایت کنم. هفتهٔ پیش یک چوکیِ دفتر برای دفترِ خانگی‌ام سفارش دادم، اما با یک چرخِ شکسته رسید. یک تعویض را هرچه زودتر می‌خواهم. لطفاً بگین چطور پیش برم. تشکر، میا", note: "همی متن complain، damaged، replacement، و as soon as possible را باهم استفاده می‌ته."}

  en.b1.unit15.lesson04.teach.q_calling_to_complain: {title: "سوال میا", gloss: "میا می‌گه: سلام، زنگ می‌زنم که دربارهٔ یک چوکیِ دفتر که سفارش دادم شکایت کنم.", note: "*calling to complain about* یعنی زنگ زدن برای شکایت کدن."}
  en.b1.unit15.lesson04.teach.a_whats_the_issue: {title: "جواب مأمور", gloss: "مأمور می‌گه: متأسفم که همی را می‌شنوم. مشکل چیست؟", note: "*What's the issue with it* یعنی مشکل چیست."}
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use: {title: "جواب میا", gloss: "میا می‌گه: با یک چرخِ شکسته رسید، پس نمی‌تانم از آن استفاده کنم.", note: "*so I can't use it* نتیجهٔ مشکل را نشان می‌ته."}
  en.b1.unit15.lesson04.teach.a_refund_or_replacement: {title: "سوال مأمور", gloss: "مأمور می‌گه: می‌فامم. پول برگشت می‌خواین یا تعویض؟", note: "*Would you like a refund or a replacement* یک انتخاب را پیشنهاد می‌ته."}
  en.b1.unit15.lesson04.teach.q_prefer_replacement: {title: "جواب میا", gloss: "میا می‌گه: تعویض را ترجیح می‌تم، اگه ممکن باشه.", note: "*I would prefer* یک ترجیحِ مؤدبانه را نشان می‌ته."}
  en.b1.unit15.lesson04.teach.a_resolve_send_friday: {title: "جواب مأمور", gloss: "مأمور می‌گه: البته. همینه را حل می‌کنیم و یک چوکیِ نو تا جمعه می‌فرستیم.", note: "*resolve* اینجه یعنی مشکل را رفع کدن."}

exercises:
  en.b1.unit15.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "damaged"
    distractors: ["complain", "refund", "replacement"]
    accepted_answers: [{value: "damaged", status: "correct"}]
    feedback: "*damaged* یعنی خراب."
  en.b1.unit15.lesson01.exercise02.choose_complain:
    instruction: "کدام کلمه یعنی به شکل رسمی گفتن که یک چیز خراب یا غیرقابل قبول استه؟"
    correct_option: "complain"
    distractors: ["damaged", "refund", "replacement"]
    accepted_answers: [{value: "complain", status: "correct"}]
    feedback: "*complain* یعنی شکایت کدن."
  en.b1.unit15.lesson01.exercise03.choose_issue:
    instruction: "کدام کلمه یعنی یک مشکلی که باید حل شه؟"
    correct_option: "issue"
    distractors: ["complain", "damaged", "refund"]
    accepted_answers: [{value: "issue", status: "correct"}]
    feedback: "*issue* یعنی مشکل."
  en.b1.unit15.lesson01.exercise04.match_complaint_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "to say formally that something is wrong or unsatisfactory", right: "complain"}
          - {left: "broken or harmed, describing a product's condition", right: "damaged"}
          - {left: "money given back for a returned or faulty product", right: "refund"}
          - {left: "a new item given in place of a faulty one", right: "replacement"}
          - {left: "to fix or settle a problem completely", right: "resolve"}
          - {left: "a problem that needs to be dealt with", right: "issue"}
        status: "correct"
    feedback: "*complain*=شکایت کدن، *damaged*=خراب، *refund*=پول برگشت، *replacement*=تعویض، *resolve*=حل کدن، *issue*=مشکل."
  en.b1.unit15.lesson01.exercise05.write_issue:
    instruction: "کلمه‌ای را که یعنی یک مشکلی که باید حل شه بنویسین."
    accepted_answers:
      - {value: "issue", status: "correct"}
      - {value: "Issue", status: "correct"}
    feedback: "*issue* یعنی مشکل."

  en.b1.unit15.lesson02.exercise01.choose_writing_to_complain:
    instruction: "کدام جمله به شکل مؤدبانه یک شکایتِ نوشتاری دربارهٔ یک کالای خراب را شروع می‌کنه؟"
    correct_option: "I'm writing to complain about a damaged product."
    distractors: ["I would like a refund for this item.", "It arrived with a broken wheel, so I can't use it.", "Of course. We'll resolve this and send a new chair by Friday."]
    accepted_answers: [{value: "I'm writing to complain about a damaged product.", status: "correct"}]
    feedback: "*I'm writing to complain about a damaged product* یعنی می‌خواهم دربارهٔ یک کالای خراب شکایت کنم."
  en.b1.unit15.lesson02.exercise02.choose_would_like_refund:
    instruction: "کدام جمله به شکل مؤدبانه پول برگشتِ یک کالا را می‌خواد؟"
    correct_option: "I would like a refund for this item."
    distractors: ["I'm writing to complain about a damaged product.", "It arrived with a broken wheel, so I can't use it.", "We'll resolve this and send a new chair by Friday."]
    accepted_answers: [{value: "I would like a refund for this item.", status: "correct"}]
    feedback: "*I would like a refund for this item* یعنی پول برگشتِ همی کالا را می‌خواهم."
  en.b1.unit15.lesson02.exercise03.order_writing_to_complain:
    instruction: "کلمات را طوری تنظیم کنین که «می‌خواهم دربارهٔ یک کالای خراب شکایت کنم» شود."
    accepted_answers: [{value: ["I'm", "writing", "to", "complain", "about", "a", "damaged", "product"], status: "correct"}]
    feedback: "ترتیب درست: *I'm writing to complain about a damaged product*."
  en.b1.unit15.lesson02.exercise04.reply_complain_desk_chair:
    instruction: "به شکل مؤدبانه یک شکایتِ نوشتاری دربارهٔ یک کالای خراب را شروع کنین، با 'I'm writing to complain about' آغاز کنین."
    accepted_answers:
      - {value: "I'm writing to complain about a damaged product.", status: "correct"}
      - {value: "I'm writing to complain about a damaged product", status: "correct"}
    feedback: "*I'm writing to complain about a damaged product* یعنی می‌خواهم دربارهٔ یک کالای خراب شکایت کنم."
  en.b1.unit15.lesson02.exercise05.write_would_like_refund:
    instruction: "یک درخواست مؤدبانه بنویسین که پول برگشتِ همی کالا را بخواین، با 'I would like a refund for' آغاز کنین."
    accepted_answers:
      - {value: "I would like a refund for this item.", status: "correct"}
      - {value: "I would like a refund for this item", status: "correct"}
    feedback: "*I would like a refund for this item* یعنی پول برگشتِ همی کالا را می‌خواهم."

  en.b1.unit15.lesson03.exercise01.comprehend_broken_wheel:
    instruction: "چوکیِ دفتری که میا سفارش داد، چی مشکلی داره؟"
    correct_option: "it arrived with a broken wheel"
    distractors: ["it was the wrong color", "it never arrived at all", "it was too expensive"]
    accepted_answers: [{value: "it arrived with a broken wheel", status: "correct"}]
    feedback: "متن می‌گه *it arrived with a broken wheel*."
  en.b1.unit15.lesson03.exercise02.comprehend_wants_replacement:
    instruction: "میا چی حلی می‌خواد، و در چی مدت؟"
    correct_option: "a replacement as soon as possible"
    distractors: ["a refund within a month", "a replacement next year", "a full apology only"]
    accepted_answers: [{value: "a replacement as soon as possible", status: "correct"}]
    feedback: "متن می‌گه *a replacement as soon as possible*."
  en.b1.unit15.lesson03.exercise03.recognize_desk_chair:
    instruction: "کدام عبارت نامِ آن مبلی را که میا سفارش داد، می‌گه؟"
    correct_option: "desk chair"
    distractors: ["broken wheel", "home office", "replacement"]
    accepted_answers: [{value: "desk chair", status: "correct"}]
    feedback: "*desk chair* یعنی چوکیِ دفتر."
  en.b1.unit15.lesson03.exercise04.order_replacement_soon:
    instruction: "کلمات را طوری تنظیم کنین که «یک تعویض را هرچه زودتر می‌خواهم» شود."
    accepted_answers: [{value: ["I", "would", "like", "a", "replacement", "as", "soon", "as", "possible"], status: "correct"}]
    feedback: "ترتیب درست: *I would like a replacement as soon as possible*."
  en.b1.unit15.lesson03.exercise05.write_ordered_desk_chair:
    instruction: "یک جمله بنویسین که بگه یک چوکیِ دفتر برای دفترِ خانگی‌تان سفارش دادین، با 'I ordered' آغاز کنین."
    accepted_answers:
      - {value: "I ordered a desk chair for my home office.", status: "correct"}
      - {value: "I ordered a desk chair for my home office", status: "correct"}
    feedback: "*I ordered a desk chair for my home office* یعنی یک چوکیِ دفتر برای دفترِ خانگی‌ام سفارش دادم."

  en.b1.unit15.lesson04.exercise01.listen_calling_to_complain:
    instruction: "گفتگو را گوش کنین و بگین میا چرا زنگ می‌زنه."
    correct_option: "calling to complain about a desk chair I ordered"
    distractors: ["asking about a refund policy in general", "canceling her order completely", "requesting a full apology"]
    accepted_answers: [{value: "calling to complain about a desk chair I ordered", status: "correct"}]
    feedback: "میا می‌گه *calling to complain about a desk chair I ordered*."
  en.b1.unit15.lesson04.exercise02.listen_broken_wheel:
    instruction: "گوش کنین و بگین با چوکی چی مشکلی استه."
    correct_option: "It arrived with a broken wheel"
    distractors: ["It never arrived at the house", "It was the wrong color", "It cost too much money"]
    accepted_answers: [{value: "It arrived with a broken wheel", status: "correct"}]
    feedback: "میا می‌گه *It arrived with a broken wheel*."
  en.b1.unit15.lesson04.exercise03.choose_agent_offer:
    instruction: "مأمور به میا چی پیشنهاد می‌ته؟"
    correct_option: "Would you like a refund or a replacement?"
    distractors: ["a discount on a future order", "a free upgrade to a better chair", "nothing, since the item cannot be returned"]
    accepted_answers: [{value: "Would you like a refund or a replacement?", status: "correct"}]
    feedback: "مأمور می‌گه *Would you like a refund or a replacement?*"
  en.b1.unit15.lesson04.exercise04.order_prefer_replacement:
    instruction: "کلمات را طوری تنظیم کنین که «تعویض را ترجیح می‌تم، اگه ممکن باشه» شود."
    accepted_answers: [{value: ["I", "would", "prefer", "a", "replacement", "if", "that's", "possible"], status: "correct"}]
    feedback: "ترتیب درست: *I would prefer a replacement if that's possible*."
  en.b1.unit15.lesson04.exercise05.reply_as_mia:
    instruction: "مأمور می‌گه: می‌فامم. پول برگشت می‌خواین یا تعویض؟"
    accepted_answers:
      - {value: "I would prefer a replacement if that's possible.", status: "correct"}
      - {value: "I would prefer a replacement if that's possible", status: "correct"}
    feedback: "*I would prefer a replacement if that's possible* یعنی تعویض را ترجیح می‌تم، اگه ممکن باشه."
  en.b1.unit15.lesson04.exercise06.speak_complaint_dialogue:
    instruction: "مأمور می‌گه: متأسفم که همی را می‌شنوم. مشکل چیست؟"
    accepted_answers:
      - {value: "It arrived with a broken wheel, so I can't use it.", status: "correct"}
      - {value: "It arrived with a broken wheel, so I can't use it", status: "correct"}
    feedback: "*It arrived with a broken wheel, so I can't use it* یعنی با یک چرخِ شکسته رسید، پس نمی‌تانم از آن استفاده کنم."
