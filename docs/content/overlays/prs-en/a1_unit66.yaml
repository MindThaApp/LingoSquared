course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit66.pharmacy_symptoms: {title: "علایم در دواخانه"}

lessons:
  en.a1.unit66.lesson01.symptom_words: {title: "کلمات علایم مریضی"}
  en.a1.unit66.lesson02.symptom_phrases: {title: "عبارات برای گفتن علایم"}
  en.a1.unit66.lesson03.dialogue_at_the_pharmacy: {title: "گفتگو: در دواخانه"}
  en.a1.unit66.lesson04.pharmacy_note: {title: "متن: یادداشت دواخانه"}

teaching:
  en.a1.unit66.lesson01.teach.symptom: {title: "symptom", gloss: "علامت", note: "symptom یعنی علامت یک مشکل صحی، مثل سرفه یا درد سر.", example_gloss: "این یک علامت استه."}
  en.a1.unit66.lesson01.teach.cough: {title: "cough", gloss: "سرفه", note: "cough یعنی سرفه.", example_gloss: "سرفه دارم."}
  en.a1.unit66.lesson01.teach.fever: {title: "fever", gloss: "تب", note: "fever یعنی تب، وقتی بدن از مریضی بسیار گرم می‌شه.", example_gloss: "تب دارین؟"}
  en.a1.unit66.lesson01.teach.throat: {title: "throat", gloss: "گلو", note: "throat یعنی گلو، قسمت داخل گردن.", example_gloss: "گلویم درد می‌کنه."}
  en.a1.unit66.lesson01.teach.headache: {title: "headache", gloss: "درد سر", note: "headache یعنی درد سر.", example_gloss: "درد سر دارم."}
  en.a1.unit66.lesson01.teach.medicine: {title: "medicine", gloss: "دوا", note: "medicine یعنی دوا؛ چیزی که وقتی مریض استین می‌خورین یا استفاده می‌کنین.", example_gloss: "این دوا را بگیرین."}

  en.a1.unit66.lesson02.teach.have_cough: {title: "I have a cough.", gloss: "سرفه دارم.", note: "I have a ... برای گفتن علامت مریضی کار می‌ره."}
  en.a1.unit66.lesson02.teach.throat_hurts: {title: "My throat hurts.", gloss: "گلویم درد می‌کنه.", note: "hurts یعنی درد می‌کنه."}
  en.a1.unit66.lesson02.teach.have_headache: {title: "I have a headache.", gloss: "درد سر دارم.", note: "این جمله یک علامت ساده را می‌گه."}
  en.a1.unit66.lesson02.teach.have_medicine: {title: "Do you have medicine?", gloss: "دوا دارین؟", note: "این سوال در دواخانه برای خواستن دوا کار می‌ره."}
  en.a1.unit66.lesson02.teach.with_water: {title: "Take this with water.", gloss: "این را با آب بگیرین.", note: "with water یعنی همراه آب."}
  en.a1.unit66.lesson02.teach.ask_doctor: {title: "Please ask a doctor.", gloss: "لطفاً از داکتر بپرسین.", note: "این جمله می‌گه برای مشورهٔ صحی از داکتر بپرسین."}

  en.a1.unit66.lesson03.teach.dialogue_line1: {title: "گپ لیلا", gloss: "سلام. سرفه دارم.", note: "Leila اول علامت سرفه را می‌گه."}
  en.a1.unit66.lesson03.teach.dialogue_line2: {title: "سوال دواخانه‌دار", gloss: "تب دارین؟", note: "The pharmacist دربارهٔ تب می‌پرسه."}
  en.a1.unit66.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "نخیر، تب ندارم. گلویم درد می‌کنه.", note: "No, I do not have ... جواب منفی کامل استه."}
  en.a1.unit66.lesson03.teach.dialogue_line4: {title: "سوال دوم دواخانه‌دار", gloss: "درد سر دارین؟", note: "این سوال علامت دیگر را می‌پرسه."}
  en.a1.unit66.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "بلی، درد سر دارم.", note: "Yes, I have ... جواب مثبت برای علامت استه."}
  en.a1.unit66.lesson03.teach.dialogue_line6: {title: "راهنمایی دواخانه‌دار", gloss: "این دوا را با آب بگیرین. اگر بدتر شدین، لطفاً از داکتر بپرسین.", note: "if you feel worse یعنی اگر حالت‌تان بدتر شد."}
  en.a1.unit66.lesson03.teach.dialogue_line7: {title: "تشکر لیلا", gloss: "تشکر.", note: "Thank you جواب ساده و مؤدبانه استه."}

  en.a1.unit66.lesson04.teach.pharmacy_note: {title: "یادداشت دواخانه", gloss: "یادداشت دواخانه: سرفه و گلودرد. تب نیست. دوا را با آب بگیرین. اگر بدتر شد، از داکتر بپرسین.", note: "این یادداشت علایم و راهنمایی دوا را خلاصه می‌کنه."}
  en.a1.unit66.lesson04.teach.reading_passage: {title: "متن: رفتن به دواخانه", gloss: "رفتن به دواخانه: لیلا به دواخانه رفت چون سرفه داشت و گلوش درد می‌کرد. دواخانه‌دار پرسید آیا تب داره. لیلا گفت تب نداره، اما درد سر داره. دواخانه‌دار به او دوا داد و گفت آن را با آب بگیرد. یادداشت گفت اگر حالتش بدتر شد، از داکتر بپرسد.", note: "این متن گفتن علایم، سوال دربارهٔ تب، و گرفتن دوا را تمرین می‌کنه."}

exercises:
  en.a1.unit66.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "cough"
    distractors: ["cold", "pain", "doctor", "water"]
    accepted_answers: [{value: "cough", status: "correct"}]
    feedback: "cough یعنی سرفه."
  en.a1.unit66.lesson01.exercise02.choose_throat_meaning:
    instruction: "کدام کلمه یعنی قسمت داخل گردن؟"
    correct_option: "throat"
    distractors: ["hand", "foot", "eye"]
    accepted_answers: [{value: "throat", status: "correct"}]
    feedback: "throat یعنی گلو."
  en.a1.unit66.lesson01.exercise03.match_symptom_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "symptom", "right": "a health problem you feel"}, {"left": "cough", "right": "air comes out loudly from your chest"}, {"left": "fever", "right": "your body is too hot because you are sick"}, {"left": "throat", "right": "the part inside your neck"}, {"left": "headache", "right": "pain in your head"}, {"left": "medicine", "right": "something you take when you are sick"}], "status": "correct"}]
    feedback: "symptom=علامت، cough=سرفه، fever=تب، throat=گلو، headache=درد سر، medicine=دوا."
  en.a1.unit66.lesson01.exercise04.order_cough_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "a", "cough."], status: "correct"}]
    feedback: "ترتیب درست: I have a cough."
  en.a1.unit66.lesson01.exercise05.write_headache:
    instruction: "کلمه‌ای را بنویسین که یعنی درد سر."
    accepted_answers: [{value: "headache", status: "correct"}]
    feedback: "headache یعنی درد سر."

  en.a1.unit66.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "My throat hurts."
    distractors: ["My hand hurts.", "My phone is here.", "My room is ready."]
    accepted_answers: [{value: "My throat hurts.", status: "correct"}]
    feedback: "My throat hurts. یعنی گلویم درد می‌کنه."
  en.a1.unit66.lesson02.exercise02.choose_symptom_statement:
    instruction: "کدام عبارت می‌گه که سر تان درد می‌کنه؟"
    correct_option: "I have a headache."
    distractors: ["I have a ticket.", "I have a receipt.", "I have good news."]
    accepted_answers: [{value: "I have a headache.", status: "correct"}]
    feedback: "I have a headache. یعنی درد سر دارم."
  en.a1.unit66.lesson02.exercise03.choose_medicine_question:
    instruction: "کدام عبارت دوا می‌خواهد؟"
    correct_option: "Do you have medicine?"
    distractors: ["Do you have the receipt?", "Do you need a charger?", "Do you like this jacket?"]
    accepted_answers: [{value: "Do you have medicine?", status: "correct"}]
    feedback: "Do you have medicine? یعنی دوا دارین؟"
  en.a1.unit66.lesson02.exercise04.order_throat_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "throat", "hurts."], status: "correct"}]
    feedback: "ترتیب درست: My throat hurts."
  en.a1.unit66.lesson02.exercise05.translate_water:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «این را با آب بگیرین.»"
    accepted_answers:
      - {value: "Take this with water.", status: "correct"}
      - {value: "Take this with water", status: "correct"}
    feedback: "Take this with water. یعنی این را با آب بگیرین."

  en.a1.unit66.lesson03.exercise01.comprehension_first_symptom:
    instruction: "مطابق گفتگو، لیلا اول کدام علامت را می‌گه؟"
    correct_option: "cough"
    distractors: ["fever", "headache", "stomach pain"]
    accepted_answers: [{value: "cough", status: "correct"}]
    feedback: "لیلا اول می‌گه سرفه داره."
  en.a1.unit66.lesson03.exercise02.comprehension_fever:
    instruction: "مطابق گفتگو، آیا لیلا تب داره؟"
    correct_option: "No, I do not have a fever"
    distractors: ["Yes, I have a fever", "I need a doctor now", "The fever is worse"]
    accepted_answers: [{value: "No, I do not have a fever", status: "correct"}]
    feedback: "لیلا می‌گه تب نداره."
  en.a1.unit66.lesson03.exercise03.listen_dialogue_throat:
    instruction: "لیلا کدام علامت را می‌گه؟"
    correct_option: "My throat hurts."
    distractors: ["My ear hurts.", "My foot hurts.", "My back hurts."]
    accepted_answers: [{value: "My throat hurts.", status: "correct"}]
    feedback: "لیلا می‌گه: My throat hurts."
  en.a1.unit66.lesson03.exercise04.respond_own_symptom:
    instruction: "یک علامت را توضیح بتین، یا دوا بخواهین."
    accepted_answers: ["I have a cough", "I have a cough.", "My throat hurts", "My throat hurts.", "I have a headache", "I have a headache.", "Do you have medicine", "Do you have medicine?"]
    feedback: "می‌تانین بگین I have a cough. یا Do you have medicine?"

  en.a1.unit66.lesson04.exercise01.note_symptom:
    instruction: "مطابق یادداشت، کدام علامت نام گرفته شده؟"
    correct_option: "Cough"
    distractors: ["Back pain", "Ear pain", "Tooth pain"]
    accepted_answers: [{value: "Cough", status: "correct"}]
    feedback: "یادداشت سرفه را نام می‌گیره."
  en.a1.unit66.lesson04.exercise02.note_fever:
    instruction: "مطابق یادداشت، آیا لیلا تب داره؟"
    correct_option: "No fever"
    distractors: ["High fever", "Fever today", "Fever tomorrow"]
    accepted_answers: [{value: "No fever", status: "correct"}]
    feedback: "یادداشت می‌گه تب نیست."
  en.a1.unit66.lesson04.exercise03.reading_medicine:
    instruction: "مطابق متن، لیلا دوا را چطور باید بگیرد؟"
    correct_option: "with water"
    distractors: ["with tea", "before sleep", "after breakfast"]
    accepted_answers: [{value: "with water", status: "correct"}]
    feedback: "دوا را باید با آب بگیرد."
  en.a1.unit66.lesson04.exercise04.reading_who_helped:
    instruction: "مطابق متن، کی به لیلا کمک کرد؟"
    correct_option: "the pharmacist"
    distractors: ["the doctor", "Daniel", "Mia"]
    accepted_answers: [{value: "the pharmacist", status: "correct"}]
    feedback: "دواخانه‌دار به لیلا کمک کرد."
  en.a1.unit66.lesson04.exercise05.write_own_pharmacy_message:
    instruction: "یک پیام کوتاه بنویسین: بگین سرفه دارین، و بگین گلو تان درد می‌کنه."
    accepted_answers:
      - {value: "I have a cough. My throat hurts.", status: "correct"}
      - {value: "I have a cough, and my throat hurts.", status: "correct"}
      - {value: "I have a cough and my throat hurts.", status: "correct"}
    feedback: "می‌تانین بگین: I have a cough. My throat hurts."
