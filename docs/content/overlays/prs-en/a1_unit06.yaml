course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit06.family: {title: "اعضای فامیل و رشته‌های خویشاوندی"}

lessons:
  en.a1.unit06.lesson01.immediate_family: {title: "فامیل نزدیک"}
  en.a1.unit06.lesson02.extended_family_possessives: {title: "فامیل دور و ضمایر ملکی"}
  en.a1.unit06.lesson03.describing_family: {title: "معرفی فامیل"}
  en.a1.unit06.lesson04.family_photo_dialogue: {title: "دیدن عکس فامیلی"}

teaching:
  en.a1.unit06.lesson01.teach.mother: {title: "مادر", gloss: "مادر", note: "mother یعنی مادر.", example_gloss: "همی مادر من استه."}
  en.a1.unit06.lesson01.teach.father: {title: "پدر", gloss: "پدر", note: "father یعنی پدر.", example_gloss: "همی پدر من استه."}
  en.a1.unit06.lesson01.teach.brother: {title: "برادر", gloss: "برادر", note: "brother یعنی برادر.", example_gloss: "همی برادر من استه."}
  en.a1.unit06.lesson01.teach.sister: {title: "خواهر", gloss: "خواهر", note: "sister یعنی خواهر.", example_gloss: "همی خواهر من استه."}
  en.a1.unit06.lesson01.teach.parents: {title: "والدین", gloss: "والدین/پدر و مادر", note: "parents یعنی پدر و مادر باهم؛ همیشه جمع استه.", example_gloss: "این‌ها والدین من استند."}
  en.a1.unit06.lesson01.teach.siblings: {title: "خواهر و برادرها", gloss: "خواهر و برادرها", note: "siblings کلمهٔ خنثی از نظر جنس برای خواهر و برادر باهم استه؛ در دری کلمهٔ جداگانه نداره.", example_gloss: "این‌ها خواهر و برادرهای من استند."}

  en.a1.unit06.lesson02.teach.grandmother: {title: "بی‌بی", gloss: "بی‌بی/مادرکلان", note: "grandmother یعنی بی‌بی یا مادرکلان.", example_gloss: "همی بی‌بی من استه."}
  en.a1.unit06.lesson02.teach.grandfather: {title: "بابه", gloss: "بابه/پدرکلان", note: "grandfather یعنی بابه یا پدرکلان.", example_gloss: "همی بابه من استه."}
  en.a1.unit06.lesson02.teach.aunt: {title: "عمه/خاله", gloss: "عمه یا خاله", note: "در انگلیسی aunt هم برای عمه (خواهر پدر) و هم خاله (خواهر مادر) استعمال می‌شه؛ برخلاف دری، همی فرق در انگلیسی وجود نداره.", example_gloss: "همی عمه/خالهٔ من استه."}
  en.a1.unit06.lesson02.teach.uncle: {title: "کاکا/ماما", gloss: "کاکا یا ماما", note: "uncle هم برای کاکا (برادر پدر) و هم ماما (برادر مادر) استعمال می‌شه، همان‌طور که در aunt هم فرق دری حذف می‌شه.", example_gloss: "همی کاکا/ماما‌ی من استه."}
  en.a1.unit06.lesson02.teach.cousin: {title: "کاکازاده/مامازاده/عمه‌زاده/خاله‌زاده", gloss: "کاکازاده، عمه‌زاده، مامازاده، خاله‌زاده و مثل آن", note: "cousin کلمهٔ واحد و خنثی از نظر جنس برای همی روابط استه؛ انگلیسی همی فرق‌های دری را نداره.", example_gloss: "همی کاکازادهٔ من استه."}
  en.a1.unit06.lesson02.teach.my_mother: {title: "مادرم", gloss: "مادر من", note: "my پیش از کلمهٔ فامیلی، مالکیت را نشان می‌ده."}
  en.a1.unit06.lesson02.teach.your_father: {title: "پدرت", gloss: "پدر تان", note: "your هم برای مفرد و هم جمع استعمال می‌شه؛ در انگلیسی فرق رسمی/غیررسمی مثل دری وجود نداره."}
  en.a1.unit06.lesson02.teach.his_sister: {title: "خواهرش (مرد)", gloss: "خواهر او (مرد)", note: "his برای مالک مذکر استعمال می‌شه."}
  en.a1.unit06.lesson02.teach.her_brother: {title: "برادرش (زن)", gloss: "برادر او (زن)", note: "her برای مالک مؤنث استعمال می‌شه."}

  en.a1.unit06.lesson03.teach.this_is_my_sister: {title: "همی خواهرم استه", gloss: "همی خواهر من استه", note: "This is my sister برای معرفی یک نفر در عکس یا حضوری استعمال می‌شه."}
  en.a1.unit06.lesson03.teach.she_is_20: {title: "بیست ساله استه", gloss: "او بیست ساله استه", note: "برای گفتن سن دیگران هم مثل خود ما از فعل be استفاده می‌شه (She's)."}
  en.a1.unit06.lesson03.teach.i_have_two_brothers: {title: "دو تا برادر دارم", gloss: "دو تا برادر دارم", note: "I have برای گفتن شمیر خواهر و برادر استعمال می‌شه."}
  en.a1.unit06.lesson03.teach.do_you_have_siblings: {title: "خواهر یا برادر دارین؟", gloss: "خواهر یا برادر دارین؟", note: "Do you have any siblings؟ سوال عمومی دربارهٔ وجود خواهر/برادر استه."}
  en.a1.unit06.lesson03.teach.no_i_dont: {title: "نخیر، ندارم. یگانه فرزندم", gloss: "نخیر، ندارم. یگانه فرزندم", note: "an only child یعنی یگانه فرزند (کسی که خواهر یا برادر نداره)."}

  en.a1.unit06.lesson04.teach.photo: {title: "عکس", gloss: "عکس", note: "photo یعنی عکس.", example_gloss: "من یک عکس دارم."}
  en.a1.unit06.lesson04.teach.q_family: {title: "پرسیدن دربارهٔ فامیل", gloss: "لیلا می‌پرسه همی فامیل تان استه؟", note: "Is this your family؟ برای پرسیدن دربارهٔ افراد یک عکس فامیلی استعمال می‌شه."}
  en.a1.unit06.lesson04.teach.a_parents: {title: "معرفی والدین", gloss: "دنیل مادر و پدرش را معرفی می‌کنه", note: "This is my mother and this is my father؛ هر عضو فامیل جداگانه با This is معرفی می‌شه."}
  en.a1.unit06.lesson04.teach.q_who: {title: "پرسیدن هویت", gloss: "لیلا می‌پرسه همی کی اس؟", note: "Who is this؟ برای پرسیدن هویت نفر بعدی در عکس استعمال می‌شه."}
  en.a1.unit06.lesson04.teach.a_sister_teacher: {title: "معرفی خواهر", gloss: "دنیل می‌گه همی خواهرمه، معلم استه", note: "She's a teacher وظیفهٔ خواهر دنیل را بیان می‌کنه."}
  en.a1.unit06.lesson04.teach.q_brothers: {title: "پرسیدن دربارهٔ برادر", gloss: "لیلا می‌پرسه برادر هم دارین؟", note: "Do you have any brothers؟ مشخصاً دربارهٔ برادر می‌پرسه، نی خواهر و برادر باهم."}
  en.a1.unit06.lesson04.teach.a_no_one_sister: {title: "جواب منفی", gloss: "دنیل می‌گه نخیر، فقط یک خواهر دارم", note: "I just have one sister؛ just اینجا یعنی «فقط»، تأکید می‌کنه که فرزند دیگری نیست."}

exercises:
  en.a1.unit06.lesson01.exercise01.listen_mother:
    instruction: "گوش کنین و کلمهٔ گفته‌شده را انتخاب کنین."
    correct_option: "مادر"
    distractors: ["پدر", "برادر", "خواهر"]
    accepted_answers: [{value: "مادر", status: "correct"}]
    feedback: "mother یعنی مادر."
  en.a1.unit06.lesson01.exercise02.choose_brother:
    instruction: "کلمهٔ درست برای «برادر» را انتخاب کنین."
    correct_option: "brother"
    distractors: ["sister", "father", "cousin"]
    accepted_answers: [{value: "brother", status: "correct"}]
    feedback: "brother یعنی برادر."
  en.a1.unit06.lesson01.exercise03.choose_parents:
    instruction: "کلمهٔ درست برای «پدر و مادر باهم» را انتخاب کنین."
    correct_option: "parents"
    distractors: ["siblings", "cousins", "grandparents"]
    accepted_answers: [{value: "parents", status: "correct"}]
    feedback: "parents یعنی پدر و مادر باهم."
  en.a1.unit06.lesson01.exercise04.match_family_words:
    instruction: "هر تعریف را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers: [{value: [{left: "female parent", right: "mother"}, {left: "male parent", right: "father"}, {left: "male sibling", right: "brother"}, {left: "female sibling", right: "sister"}, {left: "mother and father together", right: "parents"}, {left: "brothers and sisters together", right: "siblings"}, {left: "your mother's sister", right: "aunt"}, {left: "your mother's or father's mother", right: "grandmother"}, {left: "your mother's or father's father", right: "grandfather"}, {left: "your father's brother", right: "uncle"}, {left: "your aunt or uncle's child", right: "cousin"}], status: "correct"}]
    feedback: "mother=مادر، father=پدر، brother=برادر، sister=خواهر."
  en.a1.unit06.lesson01.exercise05.write_siblings:
    instruction: "کلمهٔ انگلیسی «خواهر و برادرها باهم» را بنویسین."
    accepted_answers:
      - {value: "siblings", status: "correct"}
      - {value: "Siblings", status: "correct"}
    feedback: "siblings یعنی خواهر و برادرها باهم."

  en.a1.unit06.lesson02.exercise01.listen_extended:
    instruction: "گوش کنین و کلمهٔ گفته‌شده را انتخاب کنین."
    correct_option: "بی‌بی"
    distractors: ["بابه", "عمه/خاله", "کاکا/ماما"]
    accepted_answers: [{value: "بی‌بی", status: "correct"}]
    feedback: "grandmother یعنی بی‌بی."
  en.a1.unit06.lesson02.exercise02.choose_aunt:
    instruction: "کلمهٔ درست برای «خواهر مادر» را انتخاب کنین."
    correct_option: "aunt"
    distractors: ["uncle", "cousin", "grandmother"]
    accepted_answers: [{value: "aunt", status: "correct"}]
    feedback: "aunt هم برای خاله و هم عمه استعمال می‌شه؛ انگلیسی همی دو را از هم جدا نمی‌کنه."
  en.a1.unit06.lesson02.exercise03.choose_his:
    instruction: "دنیل یک مرد استه. برای پوره‌کردن «This is _ sister.» ضمیر درست را انتخاب کنین."
    correct_option: "his"
    distractors: ["her", "your", "my"]
    accepted_answers: [{value: "his", status: "correct"}]
    feedback: "چون گفته شده دنیل مرد استه، his جواب درست استه."
  en.a1.unit06.lesson02.exercise04.choose_her:
    instruction: "لیلا یک زن استه. برای پوره‌کردن «This is _ brother.» ضمیر درست را انتخاب کنین."
    correct_option: "her"
    distractors: ["his", "your", "my"]
    accepted_answers: [{value: "her", status: "correct"}]
    feedback: "چون گفته شده لیلا زن استه، her جواب درست استه."
  en.a1.unit06.lesson02.exercise05.order_your_father:
    instruction: "کلمه‌ها را برای گفتن «پدر تان» ترتیب کنین."
    accepted_answers: [{value: ["your", "father"], status: "correct"}]
    feedback: "ترتیب درست: your father."
  en.a1.unit06.lesson02.exercise06.write_cousin:
    instruction: "کلمهٔ انگلیسی برای «فرزند کاکا/ماما/عمه/خاله» را بنویسین."
    accepted_answers:
      - {value: "cousin", status: "correct"}
      - {value: "Cousin", status: "correct"}
    feedback: "cousin کلمهٔ واحدی برای همی روابط استه."

  en.a1.unit06.lesson03.exercise01.choose_this_is:
    instruction: "جملهٔ درست برای معرفی خواهرتان در عکس را انتخاب کنین."
    correct_option: "This is my sister."
    distractors: ["This is my brother.", "This is my mother.", "I have two brothers."]
    accepted_answers: [{value: "This is my sister.", status: "correct"}]
    feedback: "This is my sister یعنی «همی خواهرمه»."
  en.a1.unit06.lesson03.exercise02.order_have_siblings:
    instruction: "کلمه‌ها را برای پرسیدن «خواهر یا برادر دارین؟» ترتیب کنین."
    accepted_answers: [{value: ["Do", "you", "have", "any", "siblings"], status: "correct"}]
    feedback: "ترتیب درست: Do you have any siblings?"
  en.a1.unit06.lesson03.exercise03.reply_siblings:
    instruction: "جواب بدین که دو برادر دارین."
    accepted_answers:
      - {value: "I have two brothers.", status: "correct"}
      - {value: "Yes, I have two brothers.", status: "correct"}
    feedback: "I have two brothers یعنی «دو تا برادر دارم»."
  en.a1.unit06.lesson03.exercise04.reply_only_child:
    instruction: "جواب بدین که خواهر یا برادر ندارین و یگانه فرزند استین."
    accepted_answers:
      - {value: "No, I don't. I'm an only child.", status: "correct"}
    feedback: "I'm an only child یعنی «یگانه فرزندم»."
  en.a1.unit06.lesson03.exercise05.write_sister_age:
    instruction: "بنویسین خواهر تان بیست ساله استه."
    accepted_answers:
      - {value: "She's twenty years old.", status: "correct"}
      - {value: "She's twenty years old", status: "correct"}
      - {value: "She is twenty years old.", status: "correct"}
    feedback: "She's twenty years old یعنی «او بیست ساله استه»."

  en.a1.unit06.lesson04.exercise01.listen_parents:
    instruction: "گفتگو را گوش کنین و معلوم کنین دنیل کی‌ها را معرفی می‌کنه."
    correct_option: "مادر و پدرش"
    distractors: ["خواهر و برادرش", "عمه و کاکایش", "بی‌بی و بابه‌اش"]
    accepted_answers: [{value: "مادر و پدرش", status: "correct"}]
    feedback: "دنیل می‌گه This is my mother and this is my father."
  en.a1.unit06.lesson04.exercise02.listen_sister_job:
    instruction: "گوش کنین و معلوم کنین وظیفهٔ خواهر دنیل چیست."
    correct_option: "معلم"
    distractors: ["محصل", "انجنیر", "دستیار کتابخانه"]
    accepted_answers: [{value: "معلم", status: "correct"}]
    feedback: "دنیل می‌گه She's a teacher."
  en.a1.unit06.lesson04.exercise03.choose_brothers_answer:
    instruction: "جواب درست دنیل به سوال دربارهٔ برادر داشتن را انتخاب کنین."
    correct_option: "No, I don't. I just have one sister."
    distractors: ["Yes, I have two brothers.", "This is my father.", "She's a teacher."]
    accepted_answers: [{value: "No, I don't. I just have one sister.", status: "correct"}]
    feedback: "دنیل می‌گه فقط یک خواهر داره، برادر نداره."
  en.a1.unit06.lesson04.exercise04.order_who_question:
    instruction: "کلمه‌ها را برای پرسیدن «همی کی اس؟» ترتیب کنین."
    accepted_answers: [{value: ["Who", "is", "this"], status: "correct"}]
    feedback: "ترتیب درست: Who is this?"
  en.a1.unit06.lesson04.exercise05.reply_as_daniel:
    instruction: "به نقش دنیل، والدین و خواهرتان را معرفی کنین."
    accepted_answers:
      - {value: "This is my mother and this is my father. This is my sister. She's a teacher.", status: "correct"}
      - {value: "This is my mother, and this is my father. This is my sister. She's a teacher.", status: "correct"}
    feedback: "جواب کامل هر سه نفر فامیل را معرفی می‌کنه."
  en.a1.unit06.lesson04.exercise06.speak_family:
    instruction: "به نقش دنیل، دربارهٔ فامیل تان با صدای بلند معلومات بدین."
    accepted_answers:
      - {value: "This is my mother and this is my father. This is my sister. She's a teacher. No, I don't. I just have one sister.", status: "correct"}
      - {value: "This is my mother, and this is my father. This is my sister. She's a teacher. No, I don't. I just have one sister.", status: "correct"}
    feedback: "جواب کامل معرفی فامیل و جواب سوال برادر را پوشش می‌ده."
