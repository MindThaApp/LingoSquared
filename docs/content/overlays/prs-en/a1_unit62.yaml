course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit62.phone_calls: {title: "تیلفون کردن"}

lessons:
  en.a1.unit62.lesson01.phone_words: {title: "کلمات تیلفون"}
  en.a1.unit62.lesson02.phone_phrases: {title: "عبارات در تیلفون"}
  en.a1.unit62.lesson03.dialogue_on_the_phone: {title: "گفتگو: روی تیلفون"}
  en.a1.unit62.lesson04.phone_message: {title: "متن: پیام تیلفونی"}

teaching:
  en.a1.unit62.lesson01.teach.phone: {title: "phone", gloss: "تیلفون", note: "phone یعنی تیلفون.", example_gloss: "تیلفونم اینجه استه."}
  en.a1.unit62.lesson01.teach.call: {title: "call", gloss: "تیلفون / تماس", note: "call می‌تانه اسم باشد یعنی تماس تیلفونی، یا فعل باشد یعنی تیلفون کردن.", example_gloss: "می‌تانم به تو تیلفون کنم."}
  en.a1.unit62.lesson01.teach.message: {title: "message", gloss: "پیام", note: "message یعنی پیام کوتاه که می‌فرستین یا می‌گذارین.", example_gloss: "یک پیام بگذارین."}
  en.a1.unit62.lesson01.teach.voicemail: {title: "voicemail", gloss: "پیام صوتی", note: "voicemail یعنی پیام صوتی ثبت‌شده در تیلفون.", example_gloss: "پیام صوتی کوتاه استه."}
  en.a1.unit62.lesson01.teach.repeat: {title: "repeat", gloss: "تکرار کردن", note: "repeat یعنی دوباره گفتن.", example_gloss: "لطفاً آن را تکرار کنین."}
  en.a1.unit62.lesson01.teach.slowly: {title: "slowly", gloss: "آهسته", note: "slowly یعنی آهسته، نه به تیزی.", example_gloss: "لطفاً آهسته گپ بزنین."}

  en.a1.unit62.lesson02.teach.this_is_leila: {title: "Hello, this is Leila.", gloss: "سلام، لیلا استم.", note: "در تیلفون انگلیسی this is + name برای معرفی خود زیاد کار می‌ره؛ دری معمولاً مستقیم می‌گه «لیلا استم»."}
  en.a1.unit62.lesson02.teach.speak_to_mia: {title: "Can I speak to Mia?", gloss: "می‌تانم با میا گپ بزنم؟", note: "Can I speak to ...? یعنی می‌خواهم با آن شخص در تیلفون گپ بزنم."}
  en.a1.unit62.lesson02.teach.repeat_that: {title: "Please repeat that.", gloss: "لطفاً آن را تکرار کنین.", note: "برای وقتی که چیزی را واضح نشنیدین."}
  en.a1.unit62.lesson02.teach.speak_slowly: {title: "Please speak slowly.", gloss: "لطفاً آهسته گپ بزنین.", note: "speak slowly یعنی آهسته گپ زدن."}
  en.a1.unit62.lesson02.teach.leave_message: {title: "Leave a message.", gloss: "یک پیام بگذارین.", note: "leave a message یعنی پیام گذاشتن وقتی طرف جواب نمی‌ته."}
  en.a1.unit62.lesson02.teach.call_back_later: {title: "I'll call back later.", gloss: "بعداً دوباره تیلفون می‌کنم.", note: "call back یعنی دوباره تیلفون کردن."}

  en.a1.unit62.lesson03.teach.dialogue_line1: {title: "جواب میا", gloss: "سلام، میا استم.", note: "Hello, this is Mia یک شروع معمول تیلفونی استه."}
  en.a1.unit62.lesson03.teach.dialogue_line2: {title: "معرفی لیلا", gloss: "سلام میا، لیلا استم.", note: "this is Leila یعنی لیلا استم."}
  en.a1.unit62.lesson03.teach.dialogue_line3: {title: "مشکل لیلا", gloss: "صدایت را خوب شنیده نمی‌تانم.", note: "can't hear you well یعنی خوب شنیده نمی‌تانم."}
  en.a1.unit62.lesson03.teach.dialogue_line4: {title: "خواهش لیلا", gloss: "لطفاً آهسته گپ بزنین.", note: "این جمله از کسی می‌خواهد کندتر گپ بزند."}
  en.a1.unit62.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "باشه. جلسه ساعت چهار استه.", note: "The meeting is at four یعنی جلسه ساعت چهار استه."}
  en.a1.unit62.lesson03.teach.dialogue_line6: {title: "خواهش لیلا", gloss: "لطفاً آن را تکرار کنین.", note: "Please repeat that برای درخواست تکرار کار می‌ره."}
  en.a1.unit62.lesson03.teach.dialogue_line7: {title: "تکرار میا", gloss: "ساعت چهار.", note: "Four o'clock تکرار کوتاه وقت استه."}
  en.a1.unit62.lesson03.teach.dialogue_line8: {title: "ختم گپ لیلا", gloss: "تشکر. بعداً دوباره تیلفون می‌کنم.", note: "I'll call back later یعنی بعدتر دوباره تماس می‌گیرم."}

  en.a1.unit62.lesson04.teach.phone_note: {title: "پیام تیلفونی", gloss: "پیام تیلفونی: میا ساعت ۴:۰۰ تیلفون کرد. جلسه در اتاق ۵. لطفاً دوباره تیلفون کنین.", note: "این پیام می‌گه کی تیلفون کرده، جلسه کجاست، و چه کار باید کرد."}
  en.a1.unit62.lesson04.teach.reading_passage: {title: "متن: یک تماس تیلفونی کوتاه", gloss: "یک تماس تیلفونی کوتاه: لیلا در بعد از ظهر به میا تیلفون کرد. صدا واضح نبود، پس میا از لیلا خواست آهسته گپ بزنه. میا گفت جلسه ساعت چهار در اتاق ۵ استه. لیلا از میا خواست وقت را تکرار کنه. بعداً، لیلا یک پیام تیلفونی نوشت. پیام می‌گفت میا ساعت ۴:۰۰ تیلفون کرده و خواسته که دوباره تیلفون کنه.", note: "این متن پیام تیلفونی، وقت جلسه و درخواست تکرار را تمرین می‌کنه."}

exercises:
  en.a1.unit62.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "voicemail"
    distractors: ["message", "letter", "ticket", "address"]
    accepted_answers: [{value: "voicemail", status: "correct"}]
    feedback: "voicemail یعنی پیام صوتی."
  en.a1.unit62.lesson01.exercise02.choose_repeat_meaning:
    instruction: "کدام کلمه یعنی دوباره گفتن؟"
    correct_option: "repeat"
    distractors: ["call", "leave", "open"]
    accepted_answers: [{value: "repeat", status: "correct"}]
    feedback: "repeat یعنی تکرار کردن."
  en.a1.unit62.lesson01.exercise03.match_phone_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "phone", "right": "a device for talking to someone far away"}, {"left": "call", "right": "a phone conversation"}, {"left": "message", "right": "short information you send or leave"}, {"left": "voicemail", "right": "a recorded phone message"}, {"left": "repeat", "right": "say again"}, {"left": "slowly", "right": "not quickly"}], "status": "correct"}]
    feedback: "phone=تیلفون، call=تماس، message=پیام، voicemail=پیام صوتی، repeat=تکرار کردن، slowly=آهسته."
  en.a1.unit62.lesson01.exercise04.order_repeat_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Please", "repeat", "that."], status: "correct"}]
    feedback: "ترتیب درست: Please repeat that."
  en.a1.unit62.lesson01.exercise05.write_message:
    instruction: "کلمه‌ای را بنویسین که یعنی معلومات کوتاهی که می‌فرستین یا می‌گذارین."
    accepted_answers: [{value: "message", status: "correct"}]
    feedback: "message یعنی پیام."

  en.a1.unit62.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Please repeat that."
    distractors: ["Please write that.", "Please bring that.", "Please close that."]
    accepted_answers: [{value: "Please repeat that.", status: "correct"}]
    feedback: "Please repeat that. یعنی لطفاً آن را تکرار کنین."
  en.a1.unit62.lesson02.exercise02.choose_repeat_request:
    instruction: "کدام عبارت از کسی می‌خواهد چیزی را دوباره بگه؟"
    correct_option: "Please repeat that."
    distractors: ["Please speak slowly.", "Leave a message.", "I'll call back later."]
    accepted_answers: [{value: "Please repeat that.", status: "correct"}]
    feedback: "Please repeat that. درخواست تکرار استه."
  en.a1.unit62.lesson02.exercise03.choose_speak_to_mia:
    instruction: "کدام عبارت در تیلفون از میا می‌خواهد؟"
    correct_option: "Can I speak to Mia?"
    distractors: ["Hello, this is Leila.", "Please repeat that.", "Leave a message."]
    accepted_answers: [{value: "Can I speak to Mia?", status: "correct"}]
    feedback: "Can I speak to Mia? یعنی می‌تانم با میا گپ بزنم؟"
  en.a1.unit62.lesson02.exercise04.order_call_back_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I'll", "call", "back", "later."], status: "correct"}]
    feedback: "ترتیب درست: I'll call back later."
  en.a1.unit62.lesson02.exercise05.translate_speak_slowly:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «لطفاً آهسته گپ بزنین.»"
    accepted_answers:
      - {value: "Please speak slowly.", status: "correct"}
      - {value: "Please speak slowly", status: "correct"}
    feedback: "Please speak slowly. یعنی لطفاً آهسته گپ بزنین."

  en.a1.unit62.lesson03.exercise01.comprehension_caller:
    instruction: "مطابق گفتگو، کی به میا تیلفون می‌کنه؟"
    correct_option: "Leila"
    distractors: ["Daniel", "Mia", "the clerk"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "لیلا به میا تیلفون می‌کنه."
  en.a1.unit62.lesson03.exercise02.comprehension_meeting_time:
    instruction: "مطابق گفتگو، جلسه ساعت چند استه؟"
    correct_option: "four"
    distractors: ["three", "five", "six"]
    accepted_answers: [{value: "four", status: "correct"}]
    feedback: "جلسه ساعت چهار استه."
  en.a1.unit62.lesson03.exercise03.listen_dialogue_repeat:
    instruction: "کدام عبارت درخواست تکرار استه؟"
    correct_option: "Please repeat that."
    distractors: ["Please write that.", "The meeting is tomorrow.", "I can hear you."]
    accepted_answers: [{value: "Please repeat that.", status: "correct"}]
    feedback: "لیلا می‌گه: Please repeat that."
  en.a1.unit62.lesson03.exercise04.respond_own_phone_call:
    instruction: "به تیلفون جواب بتین، درخواست تکرار کنین، یا بگین بعداً دوباره تیلفون می‌کنین."
    accepted_answers: ["Please repeat that", "Please repeat that.", "Please speak slowly", "Please speak slowly.", "Hello, this is Leila", "Hello, this is Leila.", "I'll call back later", "I'll call back later."]
    feedback: "می‌تانین بگین Please repeat that یا I'll call back later."

  en.a1.unit62.lesson04.exercise01.message_time:
    instruction: "مطابق پیام، میا ساعت چند تیلفون کرد؟"
    correct_option: "4:00"
    distractors: ["3:00", "5:00", "6:00"]
    accepted_answers: [{value: "4:00", status: "correct"}]
    feedback: "پیام می‌گه میا ساعت ۴:۰۰ تیلفون کرد."
  en.a1.unit62.lesson04.exercise02.message_room:
    instruction: "مطابق پیام، جلسه کجاست؟"
    correct_option: "Room 5"
    distractors: ["Room 2", "Room 4", "Room 6"]
    accepted_answers: [{value: "Room 5", status: "correct"}]
    feedback: "جلسه در Room 5 استه."
  en.a1.unit62.lesson04.exercise03.reading_why_slowly:
    instruction: "مطابق متن، چرا میا از لیلا خواست آهسته گپ بزنه؟"
    correct_option: "The sound was not clear"
    distractors: ["The phone was new", "The meeting was late", "The room was full"]
    accepted_answers: [{value: "The sound was not clear", status: "correct"}]
    feedback: "صدا واضح نبود."
  en.a1.unit62.lesson04.exercise04.reading_repeat_detail:
    instruction: "مطابق متن، لیلا از میا خواست چی را تکرار کنه؟"
    correct_option: "the time"
    distractors: ["the room", "the address", "the name"]
    accepted_answers: [{value: "the time", status: "correct"}]
    feedback: "لیلا خواست وقت را تکرار کنه."
  en.a1.unit62.lesson04.exercise05.write_own_phone_message:
    instruction: "یک پیام تیلفونی کوتاه بنویسین: بگین کی تیلفون کرد و چی باید کرد."
    accepted_answers:
      - {value: "Mia called at 4:00. Please call back.", status: "correct"}
      - {value: "Mia called at 4:00, and please call back.", status: "correct"}
      - {value: "Mia called at 4:00 and please call back.", status: "correct"}
    feedback: "می‌تانین بگین: Mia called at 4:00. Please call back."
