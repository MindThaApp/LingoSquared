  en.b1.unit09.lesson04.exercise04.order_told_her_summary:
    instruction: "کلمات را برای گفتن «به او گفتم که یک خلاصهٔ کوتاه کافی بود» ترتیب کنین."
    accepted_answers: [{value: ["I", "told", "her", "that", "a", "short", "summary", "was", "enough"], status: "correct"}]
    feedback: "ترتیب درست: *I told her that a short summary was enough*"
  en.b1.unit09.lesson04.exercise05.reply_as_leila:
    instruction: "دانیال می‌پرسه: میا دربارهٔ بررسی جواب داد؟"
    accepted_answers:
      - {value: "Yes, she said that she was available after lunch.", status: "correct"}
      - {value: "Yes, she said that she was available after lunch", status: "correct"}
    feedback: "*Yes, she said that she was available after lunch* یعنی بلی، او گفت که بعد از چاشت وقت داشت."
  en.b1.unit09.lesson04.exercise06.speak_reported_speech_dialogue:
    instruction: "به نقش لیلا، آوازی جواب بته."
    accepted_answers:
      - {value: "She asked if we needed the full report today.", status: "correct"}
      - {value: "She asked if we needed the full report today", status: "correct"}
    feedback: "*She asked if we needed the full report today* یعنی او پرسید که آیا امروز ریپورت کامل لازم داریم."
