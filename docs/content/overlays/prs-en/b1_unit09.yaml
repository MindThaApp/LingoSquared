  en.b1.unit09.lesson03.exercise02.comprehend_mia_asked:
    instruction: "میا چی پرسید؟"
    correct_option: "whether the team needed the full report today"
    distractors: ["whether the room was free today", "whether Daniel had called Leila", "whether the meeting was canceled"]
    accepted_answers: [{value: "whether the team needed the full report today", status: "correct"}]
    feedback: "متن می‌گه میا پرسید که آیا تیم امروز ریپورت کامل لازم داره."
  en.b1.unit09.lesson03.exercise03.recognize_short_summary:
    instruction: "کدام عبارت یعنی نسخهٔ کوتاه با فقط نکته‌های اصلی؟"
    correct_option: "short summary"
    distractors: ["full report", "message", "confirm"]
    accepted_answers: [{value: "short summary", status: "correct"}]
    feedback: "*short summary* یعنی خلاصهٔ کوتاه."
  en.b1.unit09.lesson03.exercise04.order_mia_asked_whether:
    instruction: "کلمات را برای گفتن «میا پرسید آیا تیم امروز ریپورت کامل لازم داشت» ترتیب کنین."
    accepted_answers: [{value: ["Mia", "asked", "whether", "the", "team", "needed", "the", "full", "report", "today"], status: "correct"}]
    feedback: "ترتیب درست: *Mia asked whether the team needed the full report today*"
  en.b1.unit09.lesson03.exercise05.write_short_summary:
    instruction: "بنویسین که دانیال گفت یک خلاصهٔ کوتاه کافی بود."
    accepted_answers:
      - {value: "Daniel said that a short summary was enough.", status: "correct"}
      - {value: "Daniel said that a short summary was enough", status: "correct"}
    feedback: "*Daniel said that a short summary was enough* یعنی دانیال گفت که یک خلاصهٔ کوتاه کافی بود."

  en.b1.unit09.lesson04.exercise01.listen_what_mia_said:
    instruction: "گفتگو را گوش کنین و معلوم کنین میا چی گفته بود."
    correct_option: "she was available after lunch"
    distractors: ["she was busy until five", "she had canceled the review", "she would arrive tomorrow"]
    accepted_answers: [{value: "she was available after lunch", status: "correct"}]
    feedback: "لیلا می‌گه *she said that she was available after lunch*."
  en.b1.unit09.lesson04.exercise02.listen_what_mia_asked:
    instruction: "گوش کنین و معلوم کنین میا چی پرسیده بود."
    correct_option: "if we needed the full report today"
    distractors: ["if we needed a longer meeting", "if the room was open", "if lunch was ready"]
    accepted_answers: [{value: "if we needed the full report today", status: "correct"}]
