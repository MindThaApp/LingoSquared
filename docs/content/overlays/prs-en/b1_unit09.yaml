course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit09.reported_speech: {title: "او گفت که بعد از چاشت وقت داره"}

lessons:
  en.b1.unit09.lesson01.reported_speech_vocabulary: {title: "Said that، asked if، و message"}
  en.b1.unit09.lesson02.reporting_statements: {title: "میا گفت که وقت داشت"}
  en.b1.unit09.lesson03.reading_the_message_chain: {title: "متن خوانی: زنجیر پیام‌ها"}
  en.b1.unit09.lesson04.the_reported_message_dialogue: {title: "او پرسید که ریپورت کامل لازم استه یا نه"}

teaching:
  en.b1.unit09.lesson01.teach.said_that: {title: "said that", gloss: "گفت که", note: "*said that* برای گزارش دادن یک گفتهٔ کسی استعمال می‌شه.", example_gloss: "او گفت که مصروف بود."}
  en.b1.unit09.lesson01.teach.told_me_that: {title: "told me that", gloss: "به من گفت که", note: "*told me that* یعنی کسی معلوماتی را به شما گفت.", example_gloss: "او به من گفت که جلسه لغو شده بود."}
  en.b1.unit09.lesson01.teach.asked_whether: {title: "asked whether", gloss: "پرسید که آیا", note: "*asked whether* برای گزارش دادن یک سوال بلی/نخیر کمی رسمی‌تر استه.", example_gloss: "میا پرسید که آیا ما کمک لازم داریم."}
  en.b1.unit09.lesson01.teach.asked_if: {title: "asked if", gloss: "پرسید که آیا، پرسید اگه", note: "*asked if* هم برای گزارش دادن سوال بلی/نخیر در گفتار روزمره زیاد استعمال می‌شه.", example_gloss: "میا پرسید که آیا ما کمک لازم داریم."}
  en.b1.unit09.lesson01.teach.message: {title: "message", gloss: "پیام", note: "*message* یعنی یک یادداشت کوتاه نوشتاری یا آوازی.", example_gloss: "لیلا بعد از چاشت یک پیام فرستاد."}
  en.b1.unit09.lesson01.teach.confirm: {title: "confirm", gloss: "تایید کدن", note: "*confirm* یعنی بگین یک چیز قطعی یا درست استه.", example_gloss: "لطفاً قبل از رفتن وقت را تایید کنین."}
  en.b1.unit09.lesson01.teach.available: {title: "available", gloss: "وقت داشتن، آزاد بودن", note: "*available* یعنی برای دیدن، کمک کدن، یا جلسه وقت دارین.", example_gloss: "میا بعد از چاشت وقت داره."}

  en.b1.unit09.lesson02.teach.mia_available: {title: "Mia said that she was available after lunch.", gloss: "میا گفت که بعد از چاشت وقت داشت.", note: "در reported speech، *is available* اکثراً به *was available* تبدیل می‌شه."}
  en.b1.unit09.lesson02.teach.leila_told_me: {title: "Leila told me that the room was busy.", gloss: "لیلا به من گفت که اتاق مصروف بود.", note: "*told me that* وقتی می‌آیه که شخص معلومات را به «من» داده باشه."}
  en.b1.unit09.lesson02.teach.grammar_backshift: {title: "Direct speech: Mia is available. Reported speech: Mia said that she was available.", gloss: "گپ مستقیم: میا وقت داره. نقل قول غیرمستقیم: میا گفت که وقت داشت.", note: "در انگلیسی، وقتی حرف یک کس را بعداً گزارش می‌کنین، زمان فعل اکثراً یک قدم به گذشته می‌ره."}

  en.b1.unit09.lesson03.teach.short_summary: {title: "short summary", gloss: "خلاصهٔ کوتاه", note: "*short summary* یعنی نسخهٔ کوتاه با نکته‌های اصلی.", example_gloss: "برای جلسهٔ امروز یک خلاصهٔ کوتاه کافی استه."}
  en.b1.unit09.lesson03.teach.full_report: {title: "full report", gloss: "ریپورت کامل", note: "*full report* یعنی ریپورت مفصل، نه فقط خلاصه.", example_gloss: "میا پرسید که آیا ریپورت کامل لازم استه."}
  en.b1.unit09.lesson03.teach.reading_passage: {title: "متن دربارهٔ زنجیر پیام‌ها", gloss: "لیلا پیام میا را خواند و به دانیال زنگ زد. او گفت که میا بعد از چاشت وقت داشت. همچنان گفت که میا رقم‌ها را تمام کرده بود. میا پرسید که آیا تیم امروز ریپورت کامل لازم داره. دانیال به لیلا گفت که یک خلاصهٔ کوتاه کافی بود، چون جلسه فقط پانزده دقیقه طول داشت.", note: "همی متن گزارش دادن گفته‌ها و سوال‌های دیگران را با *said that*، *asked whether*، و *told* نشان می‌ته."}

  en.b1.unit09.lesson04.teach.q_mia_reply: {title: "سوال دانیال", gloss: "دانیال می‌گه: میا دربارهٔ بررسی جواب داد؟", note: "*Did Mia reply...?* یک سوال دربارهٔ جواب دادن به پیام استه."}
  en.b1.unit09.lesson04.teach.a_she_said_available: {title: "جواب لیلا", gloss: "لیلا می‌گه: بلی، او گفت که بعد از چاشت وقت داشت.", note: "*she said that she was available* یک گزارش از حرف میاست."}
  en.b1.unit09.lesson04.teach.q_anything_else: {title: "سوال دانیال", gloss: "دانیال می‌گه: عالی. چیز دیگری هم پرسید؟", note: "*anything else* یعنی کدام چیز اضافه."}
  en.b1.unit09.lesson04.teach.a_asked_if_report: {title: "جواب لیلا", gloss: "لیلا می‌گه: او پرسید که آیا امروز ریپورت کامل لازم داریم.", note: "*asked if* سوال بلی/نخیر را در نقل قول غیرمستقیم نشان می‌ته."}
  en.b1.unit09.lesson04.teach.q_what_tell_her: {title: "سوال دانیال", gloss: "دانیال می‌گه: به او چی گفتی؟", note: "*What did you tell her?* می‌پرسه چه معلوماتی به میا داده شد."}
  en.b1.unit09.lesson04.teach.a_short_summary_enough: {title: "جواب لیلا", gloss: "لیلا می‌گه: به او گفتم که یک خلاصهٔ کوتاه کافی بود.", note: "*I told her that...* یعنی من به او معلومات دادم."}
  en.b1.unit09.lesson04.teach.q_tell_team: {title: "جمع‌بندی دانیال", gloss: "دانیال می‌گه: کامل استه. به تیم می‌گم که می‌تانیم ساعت دو جلسه کنیم.", note: "*I will tell the team that...* برای رساندن خبر به یک گروه استعمال می‌شه."}

exercises:
  en.b1.unit09.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "available"
    distractors: ["message", "confirm", "asked if"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "*available* یعنی وقت داشتن یا آزاد بودن."
  en.b1.unit09.lesson01.exercise02.choose_said_that:
    instruction: "کدام عبارت گفتهٔ یک کس را گزارش می‌ده؟"
    correct_option: "said that"
    distractors: ["asked if", "confirm", "message"]
    accepted_answers: [{value: "said that", status: "correct"}]
    feedback: "*said that* یعنی گفت که."
  en.b1.unit09.lesson01.exercise03.choose_available:
    instruction: "کدام کلمه یعنی برای دیدن یا جلسه وقت داشتن؟"
    correct_option: "available"
    distractors: ["confirm", "message", "full report"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "*available* یعنی وقت‌دار یا آزاد."
  en.b1.unit09.lesson01.exercise04.match_reported_speech_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح درست دری وصل کنین."
    pairs:
      - {left: "said that", right: "گفت که"}
      - {left: "told me that", right: "به من گفت که"}
      - {left: "asked whether", right: "پرسید که آیا"}
      - {left: "asked if", right: "پرسید که آیا، پرسید اگه"}
      - {left: "message", right: "پیام"}
      - {left: "confirm", right: "تایید کدن"}
      - {left: "available", right: "وقت داشتن، آزاد بودن"}
    accepted_answers:
      - value:
          - {left: "said that", right: "گفت که"}
          - {left: "told me that", right: "به من گفت که"}
          - {left: "asked whether", right: "پرسید که آیا"}
          - {left: "asked if", right: "پرسید که آیا، پرسید اگه"}
          - {left: "message", right: "پیام"}
          - {left: "confirm", right: "تایید کدن"}
          - {left: "available", right: "وقت داشتن، آزاد بودن"}
        status: "correct"
    feedback: "*said that*=گفت که، *told me that*=به من گفت که، *asked whether/asked if*=پرسید که آیا، *message*=پیام، *confirm*=تایید کدن، *available*=وقت داشتن."
  en.b1.unit09.lesson01.exercise05.write_confirm:
    instruction: "کلمه‌ای را که یعنی گفتن این‌که یک چیز قطعی یا درست استه بنویسین."
    accepted_answers:
      - {value: "confirm", status: "correct"}
      - {value: "Confirm", status: "correct"}
    feedback: "*confirm* یعنی تایید کدن."

  en.b1.unit09.lesson02.exercise01.choose_mia_available:
    instruction: "کدام جمله حرف میا را گزارش می‌ده؟"
    correct_option: "Mia said that she was available after lunch."
    distractors: ["Mia is available right now.", "Mia asked if we needed help.", "Leila sent Mia a message."]
    accepted_answers: [{value: "Mia said that she was available after lunch.", status: "correct"}]
    feedback: "*Mia said that she was available after lunch* یعنی میا گفت که بعد از چاشت وقت داشت."
  en.b1.unit09.lesson02.exercise02.choose_room_busy:
    instruction: "کدام جمله معلوماتی را گزارش می‌ده که لیلا به گوینده داده بود؟"
    correct_option: "Leila told me that the room was busy."
    distractors: ["Mia said that she was available after lunch.", "The room is free now.", "Leila asked whether Mia was busy."]
    accepted_answers: [{value: "Leila told me that the room was busy.", status: "correct"}]
    feedback: "*Leila told me that the room was busy* یعنی لیلا به من گفت که اتاق مصروف بود."
  en.b1.unit09.lesson02.exercise03.order_mia_said_available:
    instruction: "کلمات را برای گفتن «میا گفت که بعد از چاشت وقت داشت» ترتیب کنین."
    accepted_answers: [{value: ["Mia", "said", "that", "she", "was", "available", "after", "lunch"], status: "correct"}]
    feedback: "ترتیب درست: *Mia said that she was available after lunch*"
  en.b1.unit09.lesson02.exercise04.reply_what_did_mia_say:
    instruction: "میا چی گفت؟"
    accepted_answers:
      - {value: "Mia said that she was available after lunch.", status: "correct"}
      - {value: "Mia said that she was available after lunch", status: "correct"}
    feedback: "*Mia said that she was available after lunch* یعنی میا گفت که بعد از چاشت وقت داشت."
  en.b1.unit09.lesson02.exercise05.write_leila_told_me:
    instruction: "بنویسین که لیلا به شما گفت اتاق مصروف بود."
    accepted_answers:
      - {value: "Leila told me that the room was busy.", status: "correct"}
      - {value: "Leila told me that the room was busy", status: "correct"}
    feedback: "*Leila told me that the room was busy* یعنی لیلا به من گفت که اتاق مصروف بود."

  en.b1.unit09.lesson03.exercise01.comprehend_mia_available:
    instruction: "لیلا دربارهٔ میا چی گفت؟"
    correct_option: "Mia was available after lunch"
    distractors: ["Mia was busy all day", "Mia canceled the review", "Mia needed the room"]
    accepted_answers: [{value: "Mia was available after lunch", status: "correct"}]
