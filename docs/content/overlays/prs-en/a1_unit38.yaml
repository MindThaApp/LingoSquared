review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit38 (household chores), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss: (two of them intentionally match the realization's own reuse of an identical example sentence between a vocabulary card and its phrase-card sibling -- laundry/do_the_laundry and trash/take_out_the_trash -- so the Dari glosses match too, same as the source). Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the can-you-help-me-with card: English never inserts to after a modal like can (Can you help, never Can you to help), while Dari's می‌تانم pairs with the main verb in the subjunctive present form (می‌تانم کمک کنم) rather than a bare infinitive -- the two languages both avoid a separate infinitive marker here, but for different structural reasons worth flagging explicitly. Dari-specific vocabulary used for authenticity: کالا for clothes/laundry (distinct from the more Iranian لباس), تشناب for bathroom (distinct from Iranian دستشویی), and کثافات for trash (distinct from Iranian آشغال/زباله). Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit38.household: {title: "گپ‌زدن در بارهٔ کارهای خانه"}

lessons:
  en.a1.unit38.lesson01.household_vocabulary: {title: "کارهای خانه"}
  en.a1.unit38.lesson02.doing_chores: {title: "انجام‌دادن کارهای خانه"}
  en.a1.unit38.lesson03.dialogue_cleaning_help: {title: "گپ در بارهٔ خواستن کمک برای پاک‌کاری"}
  en.a1.unit38.lesson04.chores_at_home: {title: "متن: کارهای خانه"}

teaching:
  en.a1.unit38.lesson01.teach.chore: {title: "chore", gloss: "کار خانه", note: "chore یعنی کار خانه -- کاری که به طور منظم برای پاک نگه‌داشتن خانه انجام می‌دین.", example_gloss: "شستن ظرف‌ها کار خانه‌ییس که از همه کمتر خوشم می‌آیه."}
  en.a1.unit38.lesson01.teach.dishes: {title: "dishes", gloss: "ظرف‌ها", note: "dishes یعنی ظرف‌ها -- بشقاب، پیاله، و قاشق‌ها که بعد از خوردن می‌شویین.", example_gloss: "من بعد از نان شب ظرف‌ها را می‌شویم."}
  en.a1.unit38.lesson01.teach.laundry: {title: "laundry", gloss: "کالای چرک", note: "laundry یعنی کالای چرک -- کالاهایی که می‌شویین، خشک می‌کنین، و تا می‌کنین. نکته: دری برای «لباس» معمولاً کالا می‌گه، نی لباس که بیشتر در فارسی ایرانی رایج استه.", example_gloss: "او یکشنبه‌ها کالا می‌شوید."}
  en.a1.unit38.lesson01.teach.vacuum: {title: "vacuum", gloss: "جاروبرقی زدن", note: "vacuum (فعل) یعنی جاروبرقی زدن -- پاک‌کردن فرش با یک ماشین که خاک را می‌مکه.", example_gloss: "او هر شنبه اتاق نشیمن را جاروبرقی می‌زنه."}
  en.a1.unit38.lesson01.teach.trash: {title: "trash", gloss: "کثافات", note: "trash یعنی کثافات -- چیزهایی که دور می‌ندازین.", example_gloss: "می‌تانی کثافات را بیرون کنی؟"}
  en.a1.unit38.lesson01.teach.clean: {title: "clean", gloss: "پاک کردن", note: "clean (فعل) یعنی پاک کردن -- چیزی را از خاک و کثافت پاک کردن.", example_gloss: "ما اپارتمان را باهم پاک می‌کنیم."}

  en.a1.unit38.lesson02.teach.wash_the_dishes: {title: "wash the dishes", gloss: "ظرف‌ها را شستن", note: "wash the dishes یعنی ظرف‌ها را شستن.", example_gloss: "من هر شب ظرف‌ها را می‌شویم."}
  en.a1.unit38.lesson02.teach.do_the_laundry: {title: "do the laundry", gloss: "کالا شستن", note: "do the laundry یعنی کالای چرک را شستن.", example_gloss: "او یکشنبه‌ها کالا می‌شوید."}
  en.a1.unit38.lesson02.teach.take_out_the_trash: {title: "take out the trash", gloss: "کثافات را بیرون کردن", note: "take out the trash یعنی کثافات را از خانه به بیرون بردن.", example_gloss: "می‌تانی کثافات را بیرون کنی؟"}
  en.a1.unit38.lesson02.teach.clean_the_bathroom: {title: "clean the bathroom", gloss: "تشناب را پاک کردن", note: "clean the bathroom یعنی تشناب را پاک کردن. توجه: تشناب کلمهٔ رایج دری برای بخش دستشویی/حمام استه.", example_gloss: "او آخر هفته‌ها تشناب را پاک می‌کنه."}
  en.a1.unit38.lesson02.teach.need_to: {title: "need to", gloss: "ضرورت داشتن که", note: "need to یعنی ضرورت داشتن که یک کار را انجام بدین.", example_gloss: "این آخر هفته ضرورت دارم اتاق نشیمن را جاروبرقی بزنم."}
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question: {title: "Can you help me with the dishes?", gloss: "می‌تانی در (کارِ) ظرف‌ها به من کمک کنی؟", note: "Can + فاعل + فعل ساده (بدون to) -- انگلیسی بعد از افعال کمکی مثل can هیچ‌وقت to نمی‌آره (Can you help، نی Can you to help)، درحالیکه دری فعل کمکی می‌تانم را با فعل اصلی به شکل التزامی می‌آره (می‌تانم کمک کنم) نی مصدر ساده."}

  en.a1.unit38.lesson03.teach.dialogue_line1: {title: "میا می‌گه", gloss: "اپارتمانم خیلی نامرتب استه. این آخر هفته مهمان دارم.", note: "شروع گپ با توضیح یک مشکل."}
  en.a1.unit38.lesson03.teach.dialogue_line2: {title: "دنیل می‌پرسه", gloss: "می‌خواهی در پاک‌کاری کمکت کنم؟", note: "Do you want...؟ سوال با فعل کمکی do."}
  en.a1.unit38.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "بلی، لطفاً! ضرورت دارم اتاق نشیمن را جاروبرقی بزنم و ظرف‌ها را بشویم.", note: "need to + فعل برای گفتن یک کار ضروری."}
  en.a1.unit38.lesson03.teach.dialogue_line4: {title: "دنیل می‌گه", gloss: "من می‌تانم برایت جاروبرقی بزنم. تو می‌تانی ظرف‌ها را بشویی.", note: "can برای پیشنهادکردن کمک کار می‌ره."}
  en.a1.unit38.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "تشکر! هنوزم ضرورت دارم کالا هم بشویم.", note: "still یعنی هنوز، هنوزم."}
  en.a1.unit38.lesson03.teach.dialogue_line6: {title: "دنیل می‌گه", gloss: "برای آن امروز وخت ندارم، خو می‌تانم پیش از رفتن کثافات را بیرون کنم.", note: "before + فعل+ing یعنی پیش از یک کار."}
  en.a1.unit38.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "این خیلی کمک می‌کنه. خیلی تشکر!", note: "that would help a lot -- یک طریقهٔ رایج برای قدردانی."}

  en.a1.unit38.lesson04.teach.reading_passage: {title: "متن: کارهای خانه", gloss: "دنیل، لیلا و میا هرکدام عادت‌های خودشان را برای کار خانه دارند. دنیل هر شب بعد از نان شب ظرف‌ها را می‌شوید و شنبه‌ها اپارتمانش را جاروبرقی می‌زنه. لیلا از شستن کالا خوشش می‌آیه، خو از پاک‌کردن تشناب بدش می‌آیه. پشک میا، لونا، همه‌جا مو می‌ریزه، پس میا تقریباً هر روز اپارتمانش را جاروبرقی می‌زنه. آخر هفتهٔ پیش، میا مهمان داشت، پس از دنیل کمک خواست. او اتاق نشیمن را جاروبرقی زد و کثافات را برایش بیرون کرد. میا خیلی از کمکش تشکر کرد.", note: "این متن چند عبارت مربوط به کار خانه را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit38.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "vacuum"
    distractors: ["chore", "dishes", "trash"]
    accepted_answers: [{value: "vacuum", status: "correct"}]
    feedback: "vacuum یعنی جاروبرقی زدن."
  en.a1.unit38.lesson01.exercise02.choose_chore_meaning:
    instruction: "کدام کلمه یعنی کاری که به طور منظم برای پاک نگه‌داشتن خانه انجام می‌دین؟"
    correct_option: "chore"
    distractors: ["dishes", "laundry", "clean"]
    accepted_answers: [{value: "chore", status: "correct"}]
    feedback: "chore یعنی کار خانه."
  en.a1.unit38.lesson01.exercise03.match_household_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "a job you do regularly to keep your home clean and tidy", "right": "chore"}, {"left": "plates, cups, and utensils you wash after eating", "right": "dishes"}, {"left": "clothes you wash, dry, and fold", "right": "laundry"}, {"left": "to clean a floor or carpet using a machine that sucks up dirt", "right": "vacuum"}, {"left": "garbage that you throw away", "right": "trash"}, {"left": "to make something free of dirt", "right": "clean"}], "status": "correct"}]
    feedback: "chore=کار خانه، dishes=ظرف‌ها، laundry=کالای چرک، vacuum=جاروبرقی زدن، trash=کثافات، clean=پاک کردن."
  en.a1.unit38.lesson01.exercise04.order_vacuum_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["He", "vacuums", "the", "living", "room", "every", "Saturday."], status: "correct"}]
    feedback: "ترتیب درست: He vacuums the living room every Saturday."
  en.a1.unit38.lesson01.exercise05.write_trash_word:
    instruction: "کلمه‌ای را بنویسین که یعنی کثافاتی که دور می‌ندازین."
    accepted_answers: [{value: "trash", status: "correct"}]
    feedback: "trash یعنی کثافات."

  en.a1.unit38.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "take out the trash"
    distractors: ["wash the dishes", "do the laundry", "clean the bathroom"]
    accepted_answers: [{value: "take out the trash", status: "correct"}]
    feedback: "take out the trash یعنی کثافات را بیرون کردن."
  en.a1.unit38.lesson02.exercise02.choose_take_out_the_trash_meaning:
    instruction: "کدام عبارت یعنی کثافات را به بیرون بردن تا جمع‌آوری بشه؟"
    correct_option: "take out the trash"
    distractors: ["wash the dishes", "do the laundry", "clean the bathroom"]
    accepted_answers: [{value: "take out the trash", status: "correct"}]
    feedback: "take out the trash یعنی کثافات را بیرون کردن."
  en.a1.unit38.lesson02.exercise03.choose_need_to_meaning:
    instruction: "کدام عبارت یعنی چیزی که باید انجام بدین؟"
    correct_option: "need to"
    distractors: ["wash the dishes", "do the laundry", "clean the bathroom"]
    accepted_answers: [{value: "need to", status: "correct"}]
    feedback: "need to یعنی ضرورت داشتن که."
  en.a1.unit38.lesson02.exercise04.order_clean_bathroom_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["He", "cleans", "the", "bathroom", "on", "weekends."], status: "correct"}]
    feedback: "ترتیب درست: He cleans the bathroom on weekends."
  en.a1.unit38.lesson02.exercise05.translate_can_you_help_me:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «می‌تانی در (کارِ) ظرف‌ها به من کمک کنی؟»"
    accepted_answers:
      - {value: "Can you help me with the dishes?", status: "correct"}
      - {value: "Can you help me with the dishes", status: "correct"}
    feedback: "Can you help me with the dishes?"

  en.a1.unit38.lesson03.exercise01.comprehension_mia_vacuum_where:
    instruction: "مطابق گپ، میا کدام اتاق را باید جاروبرقی بزنه؟"
    correct_option: "the living room"
    distractors: ["the bathroom", "her bedroom", "the kitchen"]
    accepted_answers: [{value: "the living room", status: "correct"}]
    feedback: "میا می‌گه I need to vacuum the living room."
  en.a1.unit38.lesson03.exercise02.comprehension_daniel_first_offer:
    instruction: "مطابق گپ، اولین کاری که دنیل پیشنهاد می‌کنه چیست؟"
    correct_option: "vacuum the living room"
    distractors: ["wash the dishes", "do the laundry", "take out the trash"]
    accepted_answers: [{value: "vacuum the living room", status: "correct"}]
    feedback: "دنیل می‌گه I can vacuum for you."
  en.a1.unit38.lesson03.exercise03.listen_dialogue_trash:
    instruction: "مطابق گپ، دنیل پیش از رفتن چی را بیرون می‌کنه؟"
    correct_option: "the trash"
    distractors: ["the recycling", "the old newspapers", "the mail"]
    accepted_answers: [{value: "the trash", status: "correct"}]
    feedback: "دنیل می‌گه I can take out the trash before I leave."
  en.a1.unit38.lesson03.exercise04.respond_own_chore:
    instruction: "کاری که باید انجام بدین بگین، یا از کسی برایش کمک بخواهین."
    accepted_answers: ["I need to wash the dishes", "I need to wash the dishes.", "I need to do the laundry", "I need to do the laundry.", "I need to vacuum the living room", "I need to vacuum the living room.", "I need to take out the trash", "I need to take out the trash.", "Can you help me with the dishes?", "Can you help me with the dishes.", "Can you help me clean?", "Can you help me clean."]
    feedback: "می‌تانین بگین I need to... یا Can you help me with...؟"

  en.a1.unit38.lesson04.exercise01.reading_daniel_chore:
    instruction: "مطابق متن، دنیل هر شب بعد از نان شب چی کار می‌کنه؟"
    correct_option: "washes the dishes"
    distractors: ["does the laundry", "vacuums the apartment", "cleans the bathroom"]
    accepted_answers: [{value: "washes the dishes", status: "correct"}]
    feedback: "متن می‌گه Daniel washes the dishes every night after dinner."
  en.a1.unit38.lesson04.exercise02.reading_mia_reason:
    instruction: "مطابق متن، میا چرا تقریباً هر روز اپارتمانش را جاروبرقی می‌زنه؟"
    correct_option: "her cat leaves fur everywhere"
    distractors: ["she has guests every day", "she doesn't like a messy home", "her apartment is very big"]
    accepted_answers: [{value: "her cat leaves fur everywhere", status: "correct"}]
    feedback: "متن می‌گه Mia's cat Luna leaves fur everywhere."
  en.a1.unit38.lesson04.exercise03.reading_daniel_help:
    instruction: "مطابق متن، دنیل آخر هفتهٔ پیش چطور به میا کمک کرد؟"
    correct_option: "vacuumed the living room"
    distractors: ["washed the dishes", "did the laundry", "cleaned the bathroom"]
    accepted_answers: [{value: "vacuumed the living room", status: "correct"}]
    feedback: "متن می‌گه He vacuumed the living room and took out the trash for her."
  en.a1.unit38.lesson04.exercise04.write_own_chore_sentence:
    instruction: "یک جمله در بارهٔ کاری که در خانه انجام می‌دین یا باید بدین بنویسین، با «I need to»، «I have to»، یا «Can you help me with»."
    accepted_answers: ["I need to wash the dishes", "I need to wash the dishes.", "I need to do the laundry", "I need to do the laundry.", "I have to vacuum the living room", "I have to vacuum the living room.", "I have to take out the trash", "I have to take out the trash.", "Can you help me with the dishes?", "Can you help me clean the kitchen?"]
    feedback: "می‌تانین از الگوی I need to.../I have to.../Can you help me with... کار بگیرین."
