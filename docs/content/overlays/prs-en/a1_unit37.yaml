review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 12 fixes — تجلیل to جشن گرفتن; match rights disambiguated (gift vs congratulations); heard-in-audio and untaught distractors replaced (cake, card, framed photo); هر سه ZWNJ; آن جمعه gloss; drop درحالیکه. NATIVE FLAGS: none. Prior note: New overlay against the shared English realization unit37 (celebrations), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the congratulate-someone-on card: English marks the reason for congratulating with the preposition on (congratulate him ON his promotion), while Dari expresses the same reason with به خاطر or برای (به خاطر ترفیعش تبریک گفتن) -- the two languages' prepositions for this function don't map one-to-one. Dari-specific vocabulary used for authenticity: تحفه for gift (distinct from the more Iranian هدیه) and مهمانی for party/gathering. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit. Shared-en r2 review 2026-10-22: answer lists and wording follow the realization change (US English: people wish someone a happy birthday, they do not congratulate them, so dialogue line 7 and the reading no longer congratulate a birthday). dialogue line 7 gloss wrongly said all three (including Daniel) congratulate him; fixed. NATIVE FLAG: confirm 'سالگره‌اش را برایش مبارک می‌گیم'."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit37.celebrations: {title: "گپ‌زدن در بارهٔ جشن‌ها"}

lessons:
  en.a1.unit37.lesson01.celebration_vocabulary: {title: "سالگره و جشن‌ها"}
  en.a1.unit37.lesson02.inviting_and_congratulating: {title: "دعوت‌کردن و تبریک‌گفتن"}
  en.a1.unit37.lesson03.dialogue_surprise_party: {title: "گپ در بارهٔ پلان یک مهمانی غافلگیرکننده"}
  en.a1.unit37.lesson04.the_surprise_party: {title: "متن: مهمانی غافلگیرکننده"}

teaching:
  en.a1.unit37.lesson01.teach.birthday: {title: "birthday", gloss: "سالگره", note: "birthday یعنی سالگره -- روزی از سال که در آن به دنیا آمدین.", example_gloss: "سالگره‌ام در اکتوبر استه."}
  en.a1.unit37.lesson01.teach.party: {title: "party", gloss: "مهمانی", note: "party یعنی مهمانی -- یک گردهمایی همرای رفقا یا فامیل برای جشن‌گرفتن یک چیز.", example_gloss: "ما شنبه یک مهمانی داریم."}
  en.a1.unit37.lesson01.teach.gift: {title: "gift", gloss: "تحفه", note: "gift یعنی تحفه -- چیزی که به کسی می‌دین تا یک مناسبت را جشن بگیرین.", example_gloss: "برایش یک تحفهٔ قشنگ خریدم."}
  en.a1.unit37.lesson01.teach.invite: {title: "invite", gloss: "دعوت کردن", note: "invite یعنی دعوت کردن -- کسی را برای آمدن به یک مراسم دعوت کردن.", example_gloss: "می‌خواهم رفقایم را دعوت کنم."}
  en.a1.unit37.lesson01.teach.celebrate: {title: "celebrate", gloss: "جشن گرفتن", note: "celebrate یعنی جشن گرفتن.", example_gloss: "بیایین باهم جشن بگیریم!"}
  en.a1.unit37.lesson01.teach.congratulations: {title: "congratulations", gloss: "تبریک", note: "congratulations یعنی تبریک -- کلماتی که برای تحسین کسی به خاطر یک اتفاق خوش یا موفقیت می‌گین.", example_gloss: "به خاطر کار نویت تبریک!"}

  en.a1.unit37.lesson02.teach.invite_someone_to: {title: "invite someone to", gloss: "کسی را به ... دعوت کردن", note: "invite someone to یعنی کسی را به یک مراسم دعوت کردن.", example_gloss: "همکارانم را به مهمانی سالگره‌ام دعوت می‌کنم."}
  en.a1.unit37.lesson02.teach.congratulate_someone_on: {title: "congratulate someone on", gloss: "به خاطر چیزی به کسی تبریک گفتن", note: "congratulate یعنی تبریک گفتن. congratulate someone ON something -- انگلیسی حرف اضافهٔ on را برای نشان‌دادن دلیل تبریک کار می‌گیره (on his promotion)، در حالی‌که دری از «به خاطر» یا «برای» کار می‌گیره (به خاطر ترفیعش تبریک گفتن) -- حرف‌های اضافهٔ دو زبان یک‌به‌یک مطابقت ندارن.", example_gloss: "ما به خاطر ترفیعش به او تبریک می‌گیم."}
  en.a1.unit37.lesson02.teach.wish_someone_happy_birthday: {title: "wish someone a happy birthday", gloss: "سالگرهٔ کسی را مبارک گفتن", note: "wish someone a happy birthday یعنی سالگرهٔ کسی را برایش مبارک گفتن.", example_gloss: "می‌خواهم سالگره‌ات را برایت مبارک بگم."}
  en.a1.unit37.lesson02.teach.surprise_party: {title: "surprise party", gloss: "مهمانی غافلگیرکننده", note: "surprise party یعنی مهمانی غافلگیرکننده -- مهمانی که برای کسی گرفته می‌شه و او از پیش خبر نداره.", example_gloss: "آن‌ها دارن برایش یک مهمانی غافلگیرکننده پلان می‌کنن."}
  en.a1.unit37.lesson02.teach.have_a_party: {title: "have a party", gloss: "مهمانی گرفتن", note: "have a party یعنی یک جشن را میزبانی کردن.", example_gloss: "ما هر سال در اکتوبر یک مهمانی می‌گیریم."}
  en.a1.unit37.lesson02.teach.come_to_my_party_question: {title: "Do you want to come to my party?", gloss: "می‌خواهی به مهمانی‌ام بیایی؟", note: "این سوال با فعل کمکی do شروع می‌شه، همو ساختار do-support که در واحدهای پیش هم دیدین."}

  en.a1.unit37.lesson03.teach.dialogue_line1: {title: "لیلا می‌پرسه", gloss: "می‌دانستی که سالگرهٔ دنیل دوازدهم اکتوبر استه؟", note: "شروع گپ با یک خبر تازه."}
  en.a1.unit37.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "نی، نمی‌دانستم! جمعهٔ آینده استه.", note: "didn't یعنی شکل منفی گذشته."}
  en.a1.unit37.lesson03.teach.dialogue_line3: {title: "لیلا می‌گه", gloss: "بیایین در دفتر برایش یک مهمانی غافلگیرکننده بگیریم.", note: "Let's + فعل ساده -- الگوی پیشنهاد کاری برای انجام باهم، مانند «بیایین» در دری."}
  en.a1.unit37.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "فکر عالی! می‌تانم بقیهٔ گروپ را دعوت کنم.", note: "can برای گفتن توانایی یا پیشنهاد کار می‌ره."}
  en.a1.unit37.lesson03.teach.dialogue_line5: {title: "لیلا می‌گه", gloss: "عالی. من برایش یک تحفه می‌خرم -- شاید یک بوت دویدن نو، چون او دویدن را خیلی دوست داره.", note: "since اینجه یعنی چون."}
  en.a1.unit37.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "فکر خوبیس. یک کیک هم بگیریم؟", note: "Should we...؟ برای پیشنهاددادن یک کار باهم کار می‌ره."}
  en.a1.unit37.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "بلی، حتماً! همه‌مان باهم سالگره‌اش را برایش مبارک می‌گیم.", note: "together یعنی باهم."}

  en.a1.unit37.lesson04.teach.reading_passage: {title: "متن: مهمانی غافلگیرکننده", gloss: "دنیل نمی‌دانست که لیلا و میا برایش یک مهمانی غافلگیرکننده پلان می‌کنن. در دوازدهم اکتوبر، روز سالگره‌اش، وقتی به دفتر رسید، بادکنک و یک کیک را در اتاق استراحت دید. همه برایش گفتن «سالگره‌ات مبارک!» لیلا یک بوت دویدن نو برایش داد. میا یک عکس قاب‌شدهٔ هر سه همکار را که خودش گرفته بود برایش داد. دنیل خیلی خوشحال شد و از همه به خاطر این غافلگیری قشنگ تشکر کرد.", note: "این متن چند فعل و عبارت مربوط به جشن‌گرفتن را با هم در جمله‌های واقعی نشان می‌ده."}

