review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit37 (celebrations), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the congratulate-someone-on card: English marks the reason for congratulating with the preposition on (congratulate him ON his promotion), while Dari expresses the same reason with به خاطر or برای (به خاطر ترفیعش تبریک گفتن) -- the two languages' prepositions for this function don't map one-to-one. Dari-specific vocabulary used for authenticity: تحفه for gift (distinct from the more Iranian هدیه) and مهمانی for party/gathering. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit37.celebrations: {title: "گپ‌زدن در بارهٔ جشن‌ها"}

lessons:
  en.a1.unit37.lesson01.celebration_vocabulary: {title: "سالگره و جشن‌ها"}
  en.a1.unit37.lesson02.inviting_and_congratulating: {title: "دعوت‌کردن و تبریک‌گفتن"}
  en.a1.unit37.lesson03.dialogue_surprise_party: {title: "گپ در بارهٔ پلان یک مهمانی غافلگیرکننده"}
  en.a1.unit37.lesson04.the_surprise_party: {title: "متن: مهمانی غافلگیرکننده"}

teaching:
  en.a1.unit37.lesson01.teach.birthday: {title: "birthday", gloss: "سالگره", note: "birthday یعنی سالگره -- روزی از سال که در آن به دنیا آمدین.", example_gloss: "سالگره‌ام در اکتوبر استه."}
  en.a1.unit37.lesson01.teach.party: {title: "party", gloss: "مهمانی", note: "party یعنی مهمانی -- یک گردهمایی همرای رفقا یا فامیل برای جشن‌گرفتن یک چیز.", example_gloss: "ما شنبه یک مهمانی داریم."}
  en.a1.unit37.lesson01.teach.gift: {title: "gift", gloss: "تحفه", note: "gift یعنی تحفه -- چیزی که به کسی می‌دین تا یک مناسبت را جشن بگیرین.", example_gloss: "برایش یک تحفهٔ قشنگ خریدم."}
  en.a1.unit37.lesson01.teach.invite: {title: "invite", gloss: "دعوت کردن", note: "invite یعنی دعوت کردن -- کسی را برای آمدن به یک مراسم دعوت کردن.", example_gloss: "می‌خواهم رفقایم را دعوت کنم."}
  en.a1.unit37.lesson01.teach.celebrate: {title: "celebrate", gloss: "جشن گرفتن", note: "celebrate یعنی جشن گرفتن.", example_gloss: "بیایین باهم جشن بگیریم!"}
  en.a1.unit37.lesson01.teach.congratulations: {title: "congratulations", gloss: "تبریک", note: "congratulations یعنی تبریک -- کلماتی که برای تحسین کسی به خاطر یک اتفاق خوش یا موفقیت می‌گین.", example_gloss: "به خاطر کار نویت تبریک!"}

  en.a1.unit37.lesson02.teach.invite_someone_to: {title: "invite someone to", gloss: "کسی را به ... دعوت کردن", note: "invite someone to یعنی کسی را به یک مراسم دعوت کردن.", example_gloss: "همکارانم را به مهمانی سالگره‌ام دعوت می‌کنم."}
  en.a1.unit37.lesson02.teach.congratulate_someone_on: {title: "congratulate someone on", gloss: "به خاطر چیزی به کسی تبریک گفتن", note: "congratulate یعنی تبریک گفتن. congratulate someone ON something -- انگلیسی حرف اضافهٔ on را برای نشان‌دادن دلیل تبریک کار می‌گیره (on his promotion)، درحالیکه دری از «به خاطر» یا «برای» کار می‌گیره (به خاطر ترفیعش تبریک گفتن) -- حرف‌های اضافهٔ دو زبان یک‌به‌یک مطابقت ندارن.", example_gloss: "ما به خاطر ترفیعش به او تبریک می‌گیم."}
  en.a1.unit37.lesson02.teach.wish_someone_happy_birthday: {title: "wish someone a happy birthday", gloss: "سالگرهٔ کسی را مبارک گفتن", note: "wish someone a happy birthday یعنی سالگرهٔ کسی را برایش مبارک گفتن.", example_gloss: "می‌خواهم سالگره‌ات را برایت مبارک بگم."}
  en.a1.unit37.lesson02.teach.surprise_party: {title: "surprise party", gloss: "مهمانی غافلگیرکننده", note: "surprise party یعنی مهمانی غافلگیرکننده -- مهمانی که شخص جشن‌گرفته‌شونده از پیش خبر نداره.", example_gloss: "آن‌ها دارن برایش یک مهمانی غافلگیرکننده پلان می‌کنن."}
  en.a1.unit37.lesson02.teach.have_a_party: {title: "have a party", gloss: "مهمانی گرفتن", note: "have a party یعنی یک جشن را میزبانی کردن.", example_gloss: "ما هر سال در اکتوبر یک مهمانی می‌گیریم."}
  en.a1.unit37.lesson02.teach.come_to_my_party_question: {title: "Do you want to come to my party?", gloss: "می‌خواهی به مهمانی‌ام بیایی؟", note: "این سوال با فعل کمکی do شروع می‌شه، همو ساختار do-support که در واحدهای پیش هم دیدین."}

  en.a1.unit37.lesson03.teach.dialogue_line1: {title: "لیلا می‌پرسه", gloss: "می‌دانستی که سالگرهٔ دنیل دوازدهم اکتوبر استه؟", note: "شروع گپ با یک خبر تازه."}
  en.a1.unit37.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "نی، نمی‌دانستم! آن جمعهٔ آینده استه.", note: "didn't یعنی شکل منفی گذشته."}
  en.a1.unit37.lesson03.teach.dialogue_line3: {title: "لیلا می‌گه", gloss: "بیایین در دفتر برایش یک مهمانی غافلگیرکننده بگیریم.", note: "Let's + فعل ساده -- الگوی پیشنهاد کاری برای انجام باهم، مانند «بیایین» در دری."}
  en.a1.unit37.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "فکر عالی! می‌تانم بقیهٔ گروپ را دعوت کنم.", note: "can برای گفتن توانایی یا پیشنهاد کار می‌ره."}
  en.a1.unit37.lesson03.teach.dialogue_line5: {title: "لیلا می‌گه", gloss: "عالی. من برایش یک تحفه می‌خرم -- شاید یک بوت دویدن نو، چون او دویدن را خیلی دوست داره.", note: "since اینجه یعنی چون."}
  en.a1.unit37.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "فکر خوبیس. یک کیک هم بگیریم؟", note: "Should we...؟ برای پیشنهاددادن یک کار باهم کار می‌ره."}
  en.a1.unit37.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "بلی، حتماً! هرسه‌مان باهم برایش تبریک می‌گیم.", note: "together یعنی باهم."}

  en.a1.unit37.lesson04.teach.reading_passage: {title: "متن: مهمانی غافلگیرکننده", gloss: "دنیل نمی‌دانست که لیلا و میا برایش یک مهمانی غافلگیرکننده پلان می‌کنن. در دوازدهم اکتوبر، روز سالگره‌اش، وقتی به دفتر رسید، بادکنک و یک کیک را در اتاق استراحت دید. همه گفتن «سالگره‌ات مبارک!» و برایش تبریک گفتن. لیلا یک بوت دویدن نو برایش داد. میا یک عکس قاب‌شدهٔ هرسه همکار را که خودش گرفته بود برایش داد. دنیل خیلی خوشحال شد و از همه به خاطر این غافلگیری قشنگ تشکر کرد.", note: "این متن چند فعل و عبارت مربوط به جشن‌گرفتن را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit37.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "party"
    distractors: ["birthday", "gift", "celebrate"]
    accepted_answers: [{value: "party", status: "correct"}]
    feedback: "party یعنی مهمانی."
  en.a1.unit37.lesson01.exercise02.choose_gift_meaning:
    instruction: "کدام کلمه یعنی چیزی که به کسی می‌دین تا یک مناسبت را جشن بگیرین؟"
    correct_option: "gift"
    distractors: ["invite", "celebrate", "congratulations"]
    accepted_answers: [{value: "gift", status: "correct"}]
    feedback: "gift یعنی تحفه."
  en.a1.unit37.lesson01.exercise03.match_celebration_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers:
      - value:
          - {left: "the day of the year you were born, celebrated every year", right: "birthday"}
          - {left: "a gathering with friends or family to celebrate something", right: "party"}
          - {left: "for a birthday", right: "gift"}
          - {left: "to do something enjoyable to mark a special occasion", right: "celebrate"}
          - {left: "for a birthday or new job", right: "congratulations"}
        status: "correct"
    feedback: "هر تعریف با یک واژه یا عبارت انگلیسی جور است."
  en.a1.unit37.lesson01.exercise04.order_party_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "are", "having", "a", "party", "on", "Saturday."], status: "correct"}]
    feedback: "ترتیب درست: We are having a party on Saturday."
  en.a1.unit37.lesson01.exercise05.write_gift_word:
    instruction: "کلمه‌ای را بنویسین که یعنی چیزی که به کسی می‌دین تا یک مناسبت را جشن بگیرین."
    accepted_answers: [{value: "gift", status: "correct"}]
    feedback: "gift یعنی تحفه."

  en.a1.unit37.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "congratulate someone on"
    distractors: ["invite someone to", "wish someone a happy birthday", "have a party"]
    accepted_answers: [{value: "congratulate someone on", status: "correct"}]
    feedback: "congratulate someone on یعنی به خاطر چیزی به کسی تبریک گفتن."
  en.a1.unit37.lesson02.exercise02.choose_surprise_party_meaning:
    instruction: "کدام عبارت یعنی یک مهمانی که شخص جشن‌گرفته‌شونده از پیش خبر نداره؟"
    correct_option: "surprise party"
    distractors: ["invite someone to", "congratulate someone on", "have a party"]
    accepted_answers: [{value: "surprise party", status: "correct"}]
    feedback: "surprise party یعنی مهمانی غافلگیرکننده."
  en.a1.unit37.lesson02.exercise03.choose_have_a_party_meaning:
    instruction: "کدام عبارت یعنی یک جشن را میزبانی کردن؟"
    correct_option: "have a party"
    distractors: ["invite someone to", "congratulate someone on", "surprise party"]
    accepted_answers: [{value: "have a party", status: "correct"}]
    feedback: "have a party یعنی مهمانی گرفتن."
  en.a1.unit37.lesson02.exercise04.order_have_a_party_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "have", "a", "party", "every", "year", "in", "October."], status: "correct"}]
    feedback: "ترتیب درست: We have a party every year in October."
  en.a1.unit37.lesson02.exercise05.translate_come_to_party:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «می‌خواهی به مهمانی‌ام بیایی؟»"
    accepted_answers:
      - {value: "Do you want to come to my party?", status: "correct"}
      - {value: "Do you want to come to my party", status: "correct"}
    feedback: "Do you want to come to my party?"

  en.a1.unit37.lesson03.exercise01.comprehension_daniel_birthday:
    instruction: "مطابق گپ، سالگرهٔ دنیل کی استه؟"
    correct_option: "October 12th"
    distractors: ["October 2nd", "November 12th", "September 12th"]
    accepted_answers: [{value: "October 12th", status: "correct"}]
    feedback: "لیلا می‌گه Daniel's birthday is October 12th."
  en.a1.unit37.lesson03.exercise02.comprehension_leila_gift:
    instruction: "مطابق گپ، لیلا پلان داره برای دنیل کدام تحفه بخره؟"
    correct_option: "running shoes"
    distractors: ["a cake", "a framed photo", "a book"]
    accepted_answers: [{value: "running shoes", status: "correct"}]
    feedback: "لیلا می‌گه maybe new running shoes."
  en.a1.unit37.lesson03.exercise03.listen_dialogue_plan:
    instruction: "مطابق گپ، لیلا و میا برای دنیل چی پلان می‌کنن؟"
    correct_option: "a surprise party"
    distractors: ["a birthday card", "a work trip", "a group photo"]
    accepted_answers: [{value: "a surprise party", status: "correct"}]
    feedback: "لیلا می‌گه Let's have a surprise party for him."
  en.a1.unit37.lesson03.exercise04.respond_own_wish:
    instruction: "چیزی بگین که می‌تانین برای دعوت‌کردن کسی به یک جشن یا تبریک‌گفتن به او بگین."
    accepted_answers: ["Congratulations!", "Congratulations", "Happy birthday!", "Happy birthday", "Do you want to come to my party?", "Do you want to come to my party.", "I want to invite you to my party", "I want to invite you to my party.", "Congratulations on your promotion", "Congratulations on your promotion."]
    feedback: "می‌تانین بگین Congratulations!، Happy birthday!، یا Do you want to come to my party؟"

  en.a1.unit37.lesson04.exercise01.reading_daniel_date:
    instruction: "مطابق متن، سالگرهٔ دنیل کدام تاریخ استه؟"
    correct_option: "October 12th"
    distractors: ["October 2nd", "November 12th", "December 12th"]
    accepted_answers: [{value: "October 12th", status: "correct"}]
    feedback: "متن می‌گه On October 12th, his birthday..."
  en.a1.unit37.lesson04.exercise02.reading_leila_gift:
    instruction: "مطابق متن، لیلا کدام تحفه به دنیل داد؟"
    correct_option: "running shoes"
    distractors: ["a cake", "a framed photo", "a book"]
    accepted_answers: [{value: "running shoes", status: "correct"}]
    feedback: "متن می‌گه Leila gave him a new pair of running shoes."
  en.a1.unit37.lesson04.exercise03.reading_mia_gift:
    instruction: "مطابق متن، میا کدام تحفه به دنیل داد؟"
    correct_option: "a framed photo"
    distractors: ["running shoes", "a cake", "a card"]
    accepted_answers: [{value: "a framed photo", status: "correct"}]
    feedback: "متن می‌گه Mia gave him a framed photo."
  en.a1.unit37.lesson04.exercise04.write_own_celebration_sentence:
    instruction: "یک جمله بنویسین که در آن کسی را به یک جشن دعوت می‌کنین یا به او تبریک می‌گین، با «Do you want to come to»، «Happy birthday»، یا «Congratulations on»."
    accepted_answers: ["Do you want to come to my party?", "Do you want to come to my party.", "Happy birthday!", "Happy birthday", "Congratulations on your new job", "Congratulations on your new job.", "Congratulations on your promotion", "Congratulations on your promotion."]
    feedback: "می‌تانین از الگوی Do you want to come to.../Happy birthday!/Congratulations on... کار بگیرین."
