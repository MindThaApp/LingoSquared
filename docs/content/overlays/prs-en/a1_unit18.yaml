          - {left: "went", right: "رفتن در گذشته"}
          - {left: "saw", right: "دیدن در گذشته"}
          - {left: "ate", right: "خوردن در گذشته"}
          - {left: "visited", right: "دیدارکردن در گذشته"}
          - {left: "worked", right: "کارکردن در گذشته"}
          - {left: "watched", right: "تماشاکردن در گذشته"}
