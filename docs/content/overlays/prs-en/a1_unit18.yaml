    feedback: "I worked in the morning یعنی صبح کار کدم."
  en.a1.unit18.lesson02.exercise05.write_last_week:
    instruction: "بنویسین که هفتهٔ گذشته یک فلم دیدین."
    accepted_answers:
      - {value: "I saw a movie last week.", status: "correct"}
      - {value: "I saw a movie last week", status: "correct"}
    feedback: "I saw a movie last week یعنی هفتهٔ گذشته یک فلم دیدم."

