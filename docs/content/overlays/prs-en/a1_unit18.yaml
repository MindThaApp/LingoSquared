    feedback: "جواب کامل هم فعالیت گذشته و هم جواب سوال خوش‌گذشتن را بیان می‌کنه -- دو لحظهٔ جدا از گفتگو."
  en.a1.unit18.lesson04.exercise06.speak_recent_event:
    instruction: "به نقش دنیل، آواز‌دار به لیلا جواب بدین."
    accepted_answers:
      - {value: "I visited my parents. Yes, we ate dinner together and watched a movie. It was great.", status: "correct"}
    feedback: "جواب کامل هر دو بخش گفتگو را پوشش می‌ده: چه کار کدین و آیا خوش گذشت."
