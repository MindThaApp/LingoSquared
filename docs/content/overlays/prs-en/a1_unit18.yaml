    feedback: "visited زمان گذشتهٔ visit استه."

  en.a1.unit18.lesson02.exercise01.listen_yesterday_question:
    instruction: "گوش کنین و معلوم کنین چه چیز پرسیده می‌شه."
    correct_option: "چه کاری دیروز انجام شد"
    distractors: ["ساعت چند استه", "کجا زندگی می‌کنین", "نام‌تان چیست"]
    accepted_answers: [{value: "چه کاری دیروز انجام شد", status: "correct"}]
    feedback: "What did you do yesterday؟ می‌پرسه دیروز چه کار کدین."
  en.a1.unit18.lesson02.exercise02.choose_worked_answer:
    instruction: "کسی می‌پرسه دیروز چه کار کدین و شما صبح کار کدین. چی می‌گین؟"
    correct_option: "I worked in the morning."
    distractors: ["I saw a movie last week.", "I visited my parents.", "It was great."]
    accepted_answers: [{value: "I worked in the morning.", status: "correct"}]
    feedback: "I worked in the morning یعنی صبح کار کدم."
  en.a1.unit18.lesson02.exercise03.order_saw_movie:
