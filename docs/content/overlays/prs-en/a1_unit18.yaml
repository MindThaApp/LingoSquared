  en.a1.unit18.lesson04.exercise03.choose_what_they_did:
    instruction: "دنیل و والدینش با هم چه کار کدند؟"
    correct_option: "ate dinner together and watched a movie"
    distractors: ["went for a walk", "played games", "went shopping"]
    accepted_answers: [{value: "ate dinner together and watched a movie", status: "correct"}]
    feedback: "دنیل می‌گه we ate dinner together and watched a movie."
  en.a1.unit18.lesson04.exercise04.order_did_you_have:
    instruction: "کلمات را برای گفتن «خوش گذشت؟» ترتیب کنین."
    accepted_answers: [{value: ["Did", "you", "have", "a", "good", "time"], status: "correct"}]
    feedback: "ترتیب درست: Did you have a good time؟"
