    instruction: "نویسنده به دیدن کی رفت؟"
    correct_option: "the writer's parents"
    distractors: ["the writer's friend", "the writer's teacher", "the writer's neighbor"]
    accepted_answers: [{value: "the writer's parents", status: "correct"}]
    feedback: "متن می‌گه I visited my parents."
  en.a1.unit18.lesson03.exercise02.read_when:
