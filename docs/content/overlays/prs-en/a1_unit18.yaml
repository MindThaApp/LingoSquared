    accepted_answers: [{value: "ate dinner and watched a movie", status: "correct"}]
    feedback: "متن می‌گه We ate dinner together and watched a movie."
  en.a1.unit18.lesson03.exercise04.order_ate_dinner:
    instruction: "کلمات را برای گفتن «با هم شام خوردیم و یک فلم دیدیم» ترتیب کنین."
    accepted_answers: [{value: ["We", "ate", "dinner", "together", "and", "watched", "a", "movie"], status: "correct"}]
    feedback: "ترتیب درست: We ate dinner together and watched a movie."
  en.a1.unit18.lesson03.exercise05.write_visited_parents:
    instruction: "بنویسین که دیروز به دیدن والدین‌تان رفتین."
    accepted_answers:
      - {value: "Yesterday, I visited my parents.", status: "correct"}
      - {value: "Yesterday, I visited my parents", status: "correct"}
    feedback: "Yesterday, I visited my parents یعنی دیروز به دیدن والدینم رفتم."

  en.a1.unit18.lesson04.exercise01.listen_what_happened:
    instruction: "گفتگو را گوش کنین و معلوم کنین دنیل چه کار کد."
    correct_option: "visited his parents"
    distractors: ["went to work", "saw a movie alone", "went shopping"]
    accepted_answers: [{value: "visited his parents", status: "correct"}]
    feedback: "دنیل می‌گه I visited my parents."
