exercises:
  en.a1.unit18.lesson01.exercise01.listen_verb:
    instruction: "گوش کنین و فعلی که گفته شده را انتخاب کنین."
    correct_option: "visited"
    distractors: ["went", "saw", "ate"]
    accepted_answers: [{value: "visited", status: "correct"}]
    feedback: "visited یعنی به دیدن رفت."
  en.a1.unit18.lesson01.exercise02.choose_past_of_eat:
    instruction: "زمان گذشتهٔ eat چیست؟"
    correct_option: "ate"
    distractors: ["went", "saw", "worked"]
    accepted_answers: [{value: "ate", status: "correct"}]
    feedback: "ate زمان گذشتهٔ eat استه."
