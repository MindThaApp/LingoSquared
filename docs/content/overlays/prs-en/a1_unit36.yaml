review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 9 fixes — می‌خانه (tavern) to می‌خونه; dialogue_line1 gloss; class match right; می‌دین; distractors untaught (Spanish/computer) replaced; What do you study accepted. NATIVE FLAGS: یاد بتی (2sg of دادن) in dialogue_line7 gloss. Prior note: New overlay against the shared English realization unit36 (education/studies), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the what-are-you-studying card: English marks the present-progressive with be + verb-ing attached directly to the verb (are studying), while Dari forms the same ongoing-action meaning periphrastically with دارم/داری/داره placed before an ordinary present-tense verb (دارم می‌خونم), never a suffix on the verb itself. Dari-specific education vocabulary used for authenticity over the Iranian register: صنف (class, not کلاس), شاگرد (student, not دانش‌آموز/دانشجو), مضمون (school subject), and کالج مردمی for community college; the lesson04 reading passage's \"they talk at lunch\" beat also uses چاشت (Dari for the midday meal, distinct from Iranian ناهار), consistent with the CLAUDE.md-documented dialect vocabulary this course already fixed. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit. Shared-en r2 review 2026-10-22: answer lists and wording follow the realization change (dialogue line 6 'much better' -> 'better' (unnatural with 'learning how to use'), media transcript and overlay glosses updated)."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit36.education: {title: "گپ‌زدن در بارهٔ درس و مطالعه"}

lessons:
  en.a1.unit36.lesson01.education_vocabulary: {title: "صنف و یادگیری"}
  en.a1.unit36.lesson02.taking_a_class: {title: "صنف گرفتن"}
  en.a1.unit36.lesson03.dialogue_photography_class: {title: "گپ در بارهٔ یک صنف عکاسی"}
  en.a1.unit36.lesson04.learning_something_new: {title: "متن: یادگرفتن یک چیز نو"}

teaching:
  en.a1.unit36.lesson01.teach.class: {title: "class", gloss: "صنف", note: "class یعنی صنف -- کلمهٔ رایج دری، نی کلاس که بیشتر در فارسی ایرانی می‌شنوین.", example_gloss: "من هر سه‌شنبه شام یک صنف دارم."}
  en.a1.unit36.lesson01.teach.course: {title: "course", gloss: "کورس", note: "course یعنی کورس -- یک سلسله صنف در بارهٔ یک موضوع.", example_gloss: "او امسال یک کورس کمپیوتر می‌خونه."}
  en.a1.unit36.lesson01.teach.student: {title: "student", gloss: "شاگرد", note: "student یعنی شاگرد -- کلمهٔ رایج دری برای کسی که در یک صنف یا مکتب چیزی یاد می‌گیره.", example_gloss: "او در کالج مردمی شاگرد استه."}
  en.a1.unit36.lesson01.teach.homework: {title: "homework", gloss: "کار خانگی", note: "homework یعنی کار خانگی -- کار مکتب که در خانه انجام می‌تین.", example_gloss: "من کار خانگی خود را بعد از نان شب می‌کنم."}
  en.a1.unit36.lesson01.teach.subject: {title: "subject", gloss: "مضمون", note: "subject یعنی مضمون -- موضوعی که می‌خونین، مثل ریاضی یا تاریخ.", example_gloss: "ریاضی مضمون موردعلاقهٔ من استه."}
  en.a1.unit36.lesson01.teach.test: {title: "test", gloss: "امتحان", note: "test یعنی امتحان -- یک امتحان کوتاه که چیزی را که یاد گرفتین چک می‌کنه.", example_gloss: "ما جمعه یک امتحان داریم."}

  en.a1.unit36.lesson02.teach.take_a_class: {title: "take a class", gloss: "صنف گرفتن", note: "take a class یعنی صنف گرفتن.", example_gloss: "من هر سه‌شنبه شام یک صنف می‌گیرم."}
  en.a1.unit36.lesson02.teach.do_homework: {title: "do homework", gloss: "کار خانگی کردن", note: "do homework یعنی کار خانگی خود را انجام دادن.", example_gloss: "او کار خانگی خود را بعد از نان شب می‌کنه."}
  en.a1.unit36.lesson02.teach.study_for_a_test: {title: "study for a test", gloss: "برای امتحان مطالعه کردن", note: "study for a test یعنی برای امتحان مطالعه کردن.", example_gloss: "من هر جمعه برای امتحان مطالعه می‌کنم."}
  en.a1.unit36.lesson02.teach.community_college: {title: "community college", gloss: "کالج مردمی", note: "community college یعنی کالج مردمی -- یک مکتبی که خیلی از بزرگسالان نیمه‌وخت در آن صنف می‌گیرن.", example_gloss: "او در یک کالج مردمی می‌خونه."}
  en.a1.unit36.lesson02.teach.in_the_evening: {title: "in the evening", gloss: "شام", note: "in the evening یعنی شام -- بخش آخر روز، نی صبح.", example_gloss: "صنفم شام استه."}
  en.a1.unit36.lesson02.teach.what_are_you_studying_question: {title: "What are you studying?", gloss: "چی می‌خونی؟", note: "این سوال با فعل استمراری (are studying) استه -- انگلیسی فعل استمراری را با be + فعل+ing می‌سازه، خو دری همو معنای در-حال-انجام را با دارم/داری/داره پیش از فعل عادی می‌ته (دارم می‌خونم)، نی با یک پسوند به خود فعل."}

  en.a1.unit36.lesson03.teach.dialogue_line1: {title: "دنیل می‌پرسه", gloss: "امروز بعد از کار کاری داری؟", note: "شروع گپ با یک سوال دوستانه."}
  en.a1.unit36.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "بلی، امشب یک صنف عکاسی دارم.", note: "tonight یعنی امشب."}
  en.a1.unit36.lesson03.teach.dialogue_line3: {title: "دنیل می‌گه", gloss: "اوه، چه خوب! کجا این صنف را می‌گیری؟", note: "Where do you take it؟ -- سوال با فعل کمکی do."}
  en.a1.unit36.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "در کالج مردمی مرکز شهر. هفته‌ای دو بار استه.", note: "downtown یعنی مرکز شهر."}
  en.a1.unit36.lesson03.teach.dialogue_line5: {title: "دنیل می‌پرسه", gloss: "تا حال چطور پیش می‌ره؟", note: "How's it going so far؟ -- یک اصطلاح رایج برای پرسیدن در بارهٔ پیشرفت."}
  en.a1.unit36.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "خیلی خوشم می‌آیه. دارم یاد می‌گیرم که کمره‌ام را بهتر استعمال کنم.", note: "I'm learning -- فعل استمراری، همو ساختار دارم یاد می‌گیرم."}
  en.a1.unit36.lesson03.teach.dialogue_line7: {title: "دنیل می‌گه", gloss: "چه عالی! شاید یک وخت به من هم یاد بتی.", note: "maybe یعنی شاید."}

  en.a1.unit36.lesson04.teach.reading_passage: {title: "متن: یادگرفتن یک چیز نو", gloss: "دنیل، لیلا و میا هرکدام بیرون از کار یک چیز نو یاد می‌گیرن. دنیل شب‌های دوشنبه یک کورس کمپیوتر می‌خونه تا برای کارش مهارت‌های نو یاد بگیره. لیلا زبان اسپانیایی می‌خونه چون می‌خواهد یک روز به مکسیکو سفر کنه. میا هفته‌ای دو بار در کالج مردمی صنف عکاسی داره، و حالی عکس‌های خیلی بهتر می‌گیره. بعضی وخت‌ها در وخت چاشت در بارهٔ صنف‌های‌شان گپ می‌زنن.", note: "چاشت یعنی وخت نان چاشت (نان ظهر) -- کلمهٔ رایج دری برای این وخت روز."}

