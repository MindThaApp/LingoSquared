generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific laundromat phrase source material (DLI Dari Basic Course) -- no dedicated self-service-laundry lesson surfaced in the sections checked (unsurprising, since coin-operated laundromats are a specifically American convention a 1970s-era Dari course wouldn't cover). No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit54 (laundry/laundromat), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit54.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit54.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices: laundromat -> رخت‌شویی (built on رخت, the Dari-preferred word for 'clothes/laundry,' as opposed to Iranian Persian's more common لباس, though both dialects understand either); washing machine -> مشین رخت‌شویی (مشین, the Dari transliteration convention for 'machine', paired with the same رخت root); load -> نوبت (a Dari word for a turn/batch, used here for a load of laundry); quarters explained descriptively (سکهٔ بیست‌وپنج‌سنتی) since US quarter-dollar coins have no native Dari equivalent concept to map onto -- flagged explicitly in the note as a foreign-currency concept, not translated as if it were a familiar denomination. Colloquial Dari verb endings/register used throughout (استه for است، می‌شه/می‌گیره for می‌شود/می‌گیرد, بگین/بشویم as informal imperative/subjunctive forms). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's phrasal verb 'pick up' (pick up your laundry, meaning to retrieve a finished item) has no equivalent verb+particle system in Dari, which expresses the same meaning with the single verb گرفتن ('to take/get') -- a Dari speaker must learn 'pick up' as one indivisible chunk, the same phenomenon already flagged for 'turn off'/'fill out' in earlier units but described fresh here against this unit's own real content; (2) English's deadline-sense 'by' (by nine o'clock, meaning 'no later than') is one of several unrelated senses the single word 'by' carries in English (location, agent, deadline), while Dari's تا ('until/by') is a single, unambiguous preposition dedicated to exactly this deadline meaning -- so a Dari speaker must learn to disambiguate English 'by' from context, where Dari's تا needs no such disambiguation. Three-speaker dialogue (Attendant, Leila, Daniel) handled the same way as unit48/unit50/unit51/unit52/unit53's precedent. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: the Attendant states four distinct numeric/time facts across four separate turns (quarters, thirty-minute cycle, three-dollar cost, nine-o'clock closing) -- confirmed each is a genuinely distinct fact type answering a different question, so cross-using them as distractors for each other's questions (e.g. 'thirty minutes' as a wrong answer to a cost question) is safe per the realization's own analysis, though invented values ('two dollars', 'twenty minutes', 'eight o'clock') were used as the default anyway. Three dollars was also cross-checked against unit08/unit40/unit51/unit52/unit53's prices for accidental collision, none found, matching the realization's own note. Multi-clause accepted_answers (lesson04's write_own_laundromat_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit54.laundry: {title: "رخت شستن در رخت‌شویی"}

lessons:
  en.a1.unit54.lesson01.laundromat_vocabulary: {title: "کلمات رخت‌شویی"}
  en.a1.unit54.lesson02.phrases_for_the_laundromat: {title: "عبارات رخت‌شویی"}
  en.a1.unit54.lesson03.dialogue_at_the_laundromat: {title: "گفتگو: توی رخت‌شویی"}
  en.a1.unit54.lesson04.a_trip_to_the_laundromat: {title: "متن: یک سفر به رخت‌شویی"}

teaching:
  en.a1.unit54.lesson01.teach.laundromat: {title: "laundromat", gloss: "رخت‌شویی", note: "laundromat یعنی رخت‌شویی -- جایی با مشین‌های شستن و خشک کردن که پول می‌تین کار شان گیرین.", example_gloss: "امروز به رخت‌شویی می‌رم."}
  en.a1.unit54.lesson01.teach.washing_machine: {title: "washing machine", gloss: "مشین رخت‌شویی", note: "washing machine یعنی مشین رخت‌شویی -- مشینی که رخت تان را می‌شویه.", example_gloss: "مشین رخت‌شویی خراب استه."}
  en.a1.unit54.lesson01.teach.dryer: {title: "dryer", gloss: "خشک‌کن", note: "dryer یعنی خشک‌کن -- مشینی که رخت تان را بعد از شستن خشک می‌کنه.", example_gloss: "رخت‌های تان را توی خشک‌کن بتین."}
  en.a1.unit54.lesson01.teach.quarters: {title: "quarters", gloss: "سکهٔ بیست‌وپنج‌سنتی", note: "quarters یعنی سکه‌های امریکایی به ارزش بیست‌وپنج سنت -- اکثر وخت‌ها برای مشین‌های رخت‌شویی ضرورت استه. این یک پول امریکایی استه، معادل مستقیم افغانی نداره.", example_gloss: "مشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن."}
  en.a1.unit54.lesson01.teach.detergent: {title: "detergent", gloss: "پودر رخت‌شویی", note: "detergent یعنی پودر یا صابونی که برای شستن رخت کار می‌ری.", example_gloss: "برای پاک کردن رخت‌های تان به پودر رخت‌شویی ضرورت دارین."}
  en.a1.unit54.lesson01.teach.load: {title: "load", gloss: "نوبت", note: "load یعنی نوبت -- مقدار رختی که یک بار می‌شویین.", example_gloss: "یک نوبت بزرگ رخت دارم."}

  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things: {title: "I'd like to wash a few things, please.", gloss: "می‌خواهم چند دانه رخت بشویم، لطفاً.", note: "a few things یعنی چند دانه چیز -- برای مقدار کمی از یک چیز کار می‌ره."}
  en.a1.unit54.lesson02.teach.do_you_have_change: {title: "Do you have change for the machines?", gloss: "پول خرد برای مشین‌ها دارین؟", note: "change یعنی پول خرد -- سکه‌های کوچک."}
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take: {title: "How long does the wash cycle take?", gloss: "یک دور شستن چقدر وخت می‌گیره؟", note: "How long does ... take؟ یک ساختار سوالی معمول برای پرسیدن مدت زمان استه."}
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load: {title: "It's three dollars for one load.", gloss: "برای یک نوبت سه دالر می‌شه.", note: "for one load یعنی «برای یک نوبت»."}
  en.a1.unit54.lesson02.teach.what_time_do_you_close: {title: "What time do you close?", gloss: "ساعت چند بسته می‌کنین؟", note: "همو ساختار What time که در واحدهای پیش دیدین."}
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine: {title: "Please pick up your laundry by nine o'clock.", gloss: "لطفاً رخت‌های تان را تا ساعت نه بجه بگیرین.", note: "pick up یک فعل مرکب (phrasal verb) به معنی گرفتن یک چیز آماده استه. by nine o'clock یعنی «تا ساعت نه» -- by اینجه معنای مهلت داره."}

  en.a1.unit54.lesson03.teach.dialogue_line1: {title: "سوال کارمند رخت‌شویی", gloss: "سلام! به یک مشین رخت‌شویی ضرورت دارین؟", note: "همو ساختار Do you need که در واحدهای پیش دیدین."}
  en.a1.unit54.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "بلی، لطفاً. مشین رخت‌شویی خانه‌ام خراب استه.", note: "at home یعنی «در خانه» -- محل مشین را مشخص می‌کنه."}
  en.a1.unit54.lesson03.teach.dialogue_line3: {title: "خواهش دانیال", gloss: "من هم یک نوبت کوچک دارم. می‌تانم یک مشین کار گیرم؟", note: "as well یعنی «هم» -- مثل too کار می‌ره."}
  en.a1.unit54.lesson03.teach.dialogue_line4: {title: "جواب کارمند رخت‌شویی", gloss: "بلی! مشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن.", note: "take اینجه یعنی «قبول کردن» -- برای گفتن نوع پولی که یک مشین قبول می‌کنه کار می‌ره."}
  en.a1.unit54.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "بلی، سکه دارم.", note: "یک جواب کوتاه و مثبت استه."}
  en.a1.unit54.lesson03.teach.dialogue_line6: {title: "گفتهٔ کارمند رخت‌شویی", gloss: "یک دور شستن سی دقیقه وخت می‌گیره.", note: "takes اینجه یعنی «وخت می‌گیره» -- برای گفتن مدت زمان کار می‌ره، معنایی جدا از take در خط پیش."}
  en.a1.unit54.lesson03.teach.dialogue_line7: {title: "سوال دانیال", gloss: "و چند قیمت داره؟", note: "How much does it cost؟ یک سوال معمول برای پرسیدن قیمت استه."}
  en.a1.unit54.lesson03.teach.dialogue_line8: {title: "جواب کارمند رخت‌شویی", gloss: "برای یک نوبت سه دالر می‌شه.", note: "همو جملهٔ It's three dollars for one load که در لسن ۲ یاد گرفتین."}
  en.a1.unit54.lesson03.teach.dialogue_line9: {title: "خبر کارمند رخت‌شویی", gloss: "رخت‌شویی ساعت نه بسته می‌شه، پس لطفاً رخت‌های تان را پیش از آن بگیرین.", note: "before then یعنی «پیش از آن» -- به همو ساعت نه اشاره می‌کنه."}

  en.a1.unit54.lesson04.teach.reading_passage: {title: "متن: یک سفر به رخت‌شویی", gloss: "یک سفر به رخت‌شویی: یک بعد از ظهر، مشین رخت‌شویی توی ساختمان آپارتمان لیلا خراب شد. او تصمیم گرفت که به رخت‌شویی پایین سرک بره. دانیال هم همرایش رفت چون یک نوبت کوچک رخت هم داشت. توی رخت‌شویی، کارمند توضیح داد که مشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن، و یک دور شستن سی دقیقه وخت می‌گیره. برای یک نوبت سه دالر می‌شد. درحالیکه رخت‌های شان شسته می‌شد، دانیال و لیلا گپ زدن و در یک کافهٔ نزدیک چای خوردن. رخت‌شویی ساعت نه بسته می‌شه، پس مطمئن شدن که رخت‌های شان را پیش از آن بگیرن. لیلا از اینکه دانیال همرایش بود سپاسگزار بود، و گفت که مشین خانه‌اش احتمالاً تا آخر هفته درست می‌شه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- broke, decided, went, came, explained, cost, talked, had, made."}

exercises:
  en.a1.unit54.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "detergent"
    distractors: ["laundromat", "washing machine", "dryer", "load"]
    accepted_answers: [{value: "detergent", status: "correct"}]
    feedback: "detergent یعنی پودر رخت‌شویی."
  en.a1.unit54.lesson01.exercise02.choose_dryer_meaning:
    instruction: "کدام کلمه یعنی مشینی که رخت تان را خشک می‌کنه؟"
    correct_option: "dryer"
    distractors: ["washing machine", "laundromat", "detergent"]
    accepted_answers: [{value: "dryer", status: "correct"}]
    feedback: "dryer یعنی خشک‌کن."
  en.a1.unit54.lesson01.exercise03.match_laundry_words:
    instruction: "هر کلمه یا عبارت انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "laundromat", right: "جایی با ماشین‌های شستن و خشک‌کردن لباس در بدل پول"}
      - {left: "washing machine", right: "ماشینی که لباس‌های تان را می‌شویه"}
      - {left: "dryer", right: "ماشینی که لباس‌ها را پس از شستن خشک می‌کنه"}
      - {left: "quarters", right: "سکه‌های بیست‌وپنج‌سنتی امریکایی برای ماشین‌های رخت‌شویی"}
      - {left: "detergent", right: "صابون یا پودری که برای شستن لباس استفاده می‌کنین"}
      - {left: "load", right: "مقدار لباسی که یک‌باره می‌شویین"}
      - {left: "clean", right: "پاک‌کردن چیزی از چرک"}
    accepted_answers:
      - value:
          - {left: "laundromat", right: "جایی با ماشین‌های شستن و خشک‌کردن لباس در بدل پول"}
          - {left: "washing machine", right: "ماشینی که لباس‌های تان را می‌شویه"}
          - {left: "dryer", right: "ماشینی که لباس‌ها را پس از شستن خشک می‌کنه"}
          - {left: "quarters", right: "سکه‌های بیست‌وپنج‌سنتی امریکایی برای ماشین‌های رخت‌شویی"}
          - {left: "detergent", right: "صابون یا پودری که برای شستن لباس استفاده می‌کنین"}
          - {left: "load", right: "مقدار لباسی که یک‌باره می‌شویین"}
          - {left: "clean", right: "پاک‌کردن چیزی از چرک"}
        status: "correct"
    feedback: "laundromat=رخت‌شویی، washing machine=مشین رخت‌شویی، dryer=خشک‌کن، quarters=سکهٔ بیست‌وپنج‌سنتی، detergent=پودر رخت‌شویی، load=نوبت، clean=پاک کردن."
  en.a1.unit54.lesson01.exercise04.order_load_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "a", "big", "load", "of", "laundry."], status: "correct"}]
    feedback: "ترتیب درست: I have a big load of laundry."
  en.a1.unit54.lesson01.exercise05.write_quarters:
    instruction: "کلمه‌ای را بنویسین که یعنی سکه‌های امریکایی که اکثر وخت‌ها برای مشین‌های رخت‌شویی ضرورت استه."
    accepted_answers: [{value: "quarters", status: "correct"}]
    feedback: "quarters یعنی سکهٔ بیست‌وپنج‌سنتی."

  en.a1.unit54.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "How long does the wash cycle take?"
    distractors: ["Do you have change for the machines?", "What time do you close?", "It's three dollars for one load."]
    accepted_answers: [{value: "How long does the wash cycle take?", status: "correct"}]
    feedback: "How long does the wash cycle take? یعنی یک دور شستن چقدر وخت می‌گیره؟"
  en.a1.unit54.lesson02.exercise02.choose_request_meaning:
    instruction: "کدام عبارت را یک مشتری برای خواستن شستن چند رخت می‌گه؟"
    correct_option: "I'd like to wash a few things, please."
    distractors: ["Do you have change for the machines?", "What time do you close?", "It's three dollars for one load."]
    accepted_answers: [{value: "I'd like to wash a few things, please.", status: "correct"}]
    feedback: "I'd like to wash a few things, please. یعنی می‌خواهم چند دانه رخت بشویم، لطفاً."
  en.a1.unit54.lesson02.exercise03.choose_close_question_meaning:
    instruction: "کدام عبارت می‌پرسه که رخت‌شویی ساعت چند بسته می‌شه؟"
    correct_option: "What time do you close?"
    distractors: ["How long does the wash cycle take?", "Do you have change for the machines?", "It's three dollars for one load."]
    accepted_answers: [{value: "What time do you close?", status: "correct"}]
    feedback: "What time do you close? یعنی ساعت چند بسته می‌کنین؟"
  en.a1.unit54.lesson02.exercise04.order_price_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["It's", "three", "dollars", "for", "one", "load."], status: "correct"}]
    feedback: "ترتیب درست: It's three dollars for one load."
  en.a1.unit54.lesson02.exercise05.translate_pickup_time:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «لطفاً رخت‌های تان را تا ساعت نه بجه بگیرین.»"
    accepted_answers:
      - {value: "Please pick up your laundry by nine o'clock.", status: "correct"}
      - {value: "Please pick up your laundry by nine o'clock", status: "correct"}
    feedback: "Please pick up your laundry by nine o'clock. یعنی لطفاً رخت‌های تان را تا ساعت نه بجه بگیرین."

  en.a1.unit54.lesson03.exercise01.comprehension_reason:
    instruction: "مطابق گفتگو، لیلا چرا باید از رخت‌شویی کار گیره؟"
    correct_option: "washing machine at home is broken"
    distractors: ["she has too much laundry", "she likes the laundromat", "her dryer is broken"]
    accepted_answers: [{value: "washing machine at home is broken", status: "correct"}]
    feedback: "مشین رخت‌شویی خانه‌اش خراب استه (washing machine at home is broken)."
  en.a1.unit54.lesson03.exercise02.comprehension_daniel_load_size:
    instruction: "مطابق گفتگو، دانیال چه اندازه نوبت رخت داره؟"
    correct_option: "small"
    distractors: ["large", "medium", "huge"]
    accepted_answers: [{value: "small", status: "correct"}]
    feedback: "دانیال یک نوبت کوچک (small) داره."
  en.a1.unit54.lesson03.exercise03.listen_dialogue_cost:
    instruction: "مطابق گفتگو، شستن چند دالر می‌شه؟"
    correct_option: "three dollars"
    distractors: ["two dollars", "five dollars", "seven dollars"]
    accepted_answers: [{value: "three dollars", status: "correct"}]
    feedback: "شستن سه دالر (three dollars) می‌شه."
  en.a1.unit54.lesson03.exercise04.respond_own_laundry_statement:
    instruction: "بگین رخت‌شویی ساعت چند بسته می‌شه، شستن چند دالر می‌شه، یا یک دور شستن چقدر وخت می‌گیره."
    accepted_answers: ["The laundromat closes at nine", "The laundromat closes at nine.", "The laundromat closes at nine o'clock", "The laundromat closes at nine o'clock.", "It's three dollars for one load", "It's three dollars for one load.", "The wash cycle takes thirty minutes", "The wash cycle takes thirty minutes."]
    feedback: "می‌تانین بگین The laundromat closes at nine یا It's three dollars for one load."

  en.a1.unit54.lesson04.exercise01.reading_break_reason:
    instruction: "مطابق متن، لیلا چرا به رخت‌شویی رفت؟"
    correct_option: "Leila's washing machine broke"
    distractors: ["she wanted new detergent", "her dryer broke", "she was visiting a friend"]
    accepted_answers: [{value: "Leila's washing machine broke", status: "correct"}]
    feedback: "مشین رخت‌شویی لیلا خراب شد (Leila's washing machine broke)."
  en.a1.unit54.lesson04.exercise02.reading_daniel_reason:
    instruction: "مطابق متن، دانیال چرا همرایش رفت؟"
    correct_option: "he had a small load of laundry too"
    distractors: ["he wanted coffee", "his machine was broken too", "he needed detergent"]
    accepted_answers: [{value: "he had a small load of laundry too", status: "correct"}]
    feedback: "او هم یک نوبت کوچک رخت داشت (he had a small load of laundry too)."
  en.a1.unit54.lesson04.exercise03.reading_closing_time:
    instruction: "مطابق متن، رخت‌شویی ساعت چند بسته می‌شه؟"
    correct_option: "nine o'clock"
    distractors: ["eight o'clock", "ten o'clock", "seven o'clock"]
    accepted_answers: [{value: "nine o'clock", status: "correct"}]
