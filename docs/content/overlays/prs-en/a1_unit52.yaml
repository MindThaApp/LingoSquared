review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit52 (personal care), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit52.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit52.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choice: haircut -> اصلاح (the common Afghan/Dari term used for a haircut or grooming visit at a barber, e.g. اصلاح کردن 'to get a haircut'); the rest of the vocabulary (آرایشگر/hairdresser, کوتاه کردن/trim, کوتاه‌تر/shorter, مدل/style, شستن/wash) is shared between the two dialects and used as-is -- no forced distinction was invented where none was confidently verifiable, per this unit's honest-disclosure standard. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌تانم for می‌شود/می‌توانم, بشوئین as the informal plural imperative for 'wash'). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's fixed collocation 'included with' (that's included with the haircut) turns the verb 'include' into a passive-participle adjective bundled with a price at no extra charge -- Dari expresses the same idea with a full clause (همرای ... شامل استه, 'is included together with'), since it has no equivalent single passive-adjective form to reach for; (2) English's hedging quantifier 'a little' placed directly before a comparative adjective (a little shorter) is a fixed grammatical pattern (a little + -er) that softens a request -- Dari's یک‌کمی serves a similar hedging function but doesn't attach to a comparative form the same rigid way, so a Dari speaker must learn 'a little + comparative' as a specific English pattern rather than build it freely. Three-speaker dialogue (Hairdresser, Daniel, Mia) handled the same way as unit48/unit50/unit51's precedent. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: the Hairdresser states exactly one price value (twenty dollars) and one non-numeric inclusion fact (the wash is included), each for a different question, so lesson03.exercise03/lesson04.exercise02's price distractors ('fifteen dollars', 'thirty dollars', 'twenty-five dollars') are ordinary invented values with no same-speaker-restated-fact risk -- also cross-checked twenty dollars against every other unit's stated price (unit08 shopping, unit40's twelve-dollar postage, unit51's nine-dollar pharmacy total) for accidental collision, none found. Multi-clause accepted_answers (lesson04's write_own_haircut_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit52.personal_care: {title: "اصلاح کردن مو"}

lessons:
  en.a1.unit52.lesson01.personal_care_vocabulary: {title: "کلمات نزد آرایشگر"}
  en.a1.unit52.lesson02.phrases_at_the_hairdresser: {title: "عبارات نزد آرایشگر"}
  en.a1.unit52.lesson03.dialogue_at_the_hairdresser: {title: "گفتگو: نزد آرایشگر"}
  en.a1.unit52.lesson04.a_trip_to_the_hairdresser: {title: "متن: یک سفر نزد آرایشگر"}

teaching:
  en.a1.unit52.lesson01.teach.haircut: {title: "haircut", gloss: "اصلاح", note: "haircut یعنی اصلاح -- کوتاه کردن مو.", example_gloss: "به یک اصلاح ضرورت دارم."}
  en.a1.unit52.lesson01.teach.hairdresser: {title: "hairdresser", gloss: "آرایشگر", note: "hairdresser یعنی آرایشگر -- کسی که مو را کوتاه و مدل می‌ته.", example_gloss: "آرایشگر خیلی مهربان استه."}
  en.a1.unit52.lesson01.teach.trim: {title: "trim", gloss: "کمی کوتاه کردن", note: "trim یعنی فقط یک مقدار کم از نوک موها را کوتاه کردن.", example_gloss: "فقط یک کمی کوتاه کردن می‌خواهم."}
  en.a1.unit52.lesson01.teach.shorter: {title: "shorter", gloss: "کوتاه‌تر", note: "shorter یعنی کوتاه‌تر -- شکل مقایسه‌ای صفت short.", example_gloss: "می‌تانین کوتاه‌ترش کنین؟"}
  en.a1.unit52.lesson01.teach.style: {title: "style", gloss: "مدل", note: "style یعنی مدل -- طریقهٔ کوتاه یا شکل دادن مو.", example_gloss: "این مدل را خوش دارم."}
  en.a1.unit52.lesson01.teach.wash: {title: "wash", gloss: "شستن", note: "wash یعنی شستن.", example_gloss: "اول، او موهای تان را می‌شویه."}

  en.a1.unit52.lesson02.teach.id_like_a_haircut: {title: "I'd like a haircut, please.", gloss: "می‌خواهم اصلاح کنم، لطفاً.", note: "I'd like to ... طریقهٔ مؤدبانهٔ I want to استه."}
  en.a1.unit52.lesson02.teach.just_a_trim: {title: "Just a trim, please.", gloss: "فقط یک‌کمی کوتاه کنین، لطفاً.", note: "Just a ___ یعنی «فقط یک ___» -- برای محدود کردن یک خواهش کار می‌ره."}
  en.a1.unit52.lesson02.teach.can_you_make_it_a_little_shorter: {title: "Can you make it a little shorter?", gloss: "می‌تانین یک‌کمی کوتاه‌ترش کنین؟", note: "a little + صفت مقایسه‌ای یک ساختار ثابت انگلیسی استه -- برای نرم کردن یک خواهش کار می‌ره."}
  en.a1.unit52.lesson02.teach.the_same_style: {title: "The same style, please.", gloss: "همو مدل، لطفاً.", note: "the same ___ یعنی «همو ___» -- برای گفتن اینکه چیزی نباید عوض شه کار می‌ره."}
  en.a1.unit52.lesson02.teach.how_much_does_a_haircut_cost: {title: "How much does a haircut cost?", gloss: "اصلاح چند دالر می‌شه؟", note: "How much does ___ cost؟ یک سوال معمول برای پرسیدن قیمت استه."}
  en.a1.unit52.lesson02.teach.its_twenty_dollars: {title: "It's twenty dollars.", gloss: "بیست دالر می‌شه.", note: "It's یعنی It is کوتاه شده."}

  en.a1.unit52.lesson03.teach.dialogue_line1: {title: "سلام آرایشگر", gloss: "سلام، امروز چطور می‌تانم کمک تان کنم؟", note: "How can I help you today؟ یک طریقهٔ معمول برای احوال‌پرسی از یک مشتری استه."}
  en.a1.unit52.lesson03.teach.dialogue_line2: {title: "خواهش دانیال", gloss: "می‌خواهم اصلاح کنم، لطفاً. خواهرم هفتهٔ بعد به دیدنم می‌آیه.", note: "My sister is visiting یعنی خواهرم به دیدنم می‌آیه -- زمان حال استمراری برای یک برنامهٔ آینده کار می‌ره."}
  en.a1.unit52.lesson03.teach.dialogue_line3: {title: "سوال آرایشگر", gloss: "بلی، کدام مدل را می‌خواین؟", note: "what style do you want؟ همو سوالی استه که در بارهٔ ترجیح مو می‌پرسه."}
  en.a1.unit52.lesson03.teach.dialogue_line4: {title: "جواب دانیال", gloss: "همو مدل، فقط یک‌کمی کوتاه‌تر.", note: "همو ساختار the same + a little shorter که در لسن ۲ یاد گرفتین."}
  en.a1.unit52.lesson03.teach.dialogue_line5: {title: "سوال میا", gloss: "می‌تانین اول موهایش را بشوئین؟", note: "his hair یعنی موهای او -- his ضمیر ملکی برای مذکر استه."}
  en.a1.unit52.lesson03.teach.dialogue_line6: {title: "جواب آرایشگر", gloss: "البته، و آن همرای اصلاح شامل استه.", note: "included with ___ یعنی «همرای ___ شامل استه» -- انگلیسی این را با یک صفت واحد (included) می‌گه، دری با یک جملهٔ کامل."}
  en.a1.unit52.lesson03.teach.dialogue_line7: {title: "سوال دانیال", gloss: "خوب استه. چند می‌شه؟", note: "How much is it؟ کوتاه‌تر از How much does it cost؟ استه."}
  en.a1.unit52.lesson03.teach.dialogue_line8: {title: "جواب آرایشگر", gloss: "بیست دالر می‌شه.", note: "همو جملهٔ It's twenty dollars که در لسن ۲ یاد گرفتین."}

  en.a1.unit52.lesson04.teach.reading_passage: {title: "متن: یک سفر نزد آرایشگر", gloss: "یک سفر نزد آرایشگر: خواهر دانیال هفتهٔ بعد از شیکاگو به دیدنش می‌آمد، پس او تصمیم گرفت که اصلاح کنه. میا آرایشگر مورد علاقه‌اش را پیشنهاد کرد، یک سالون کوچک نزدیک آپارتمانش، و همرایش رفت. آرایشگر پرسید کدام مدل را می‌خواد، و او گفت همو مدل، فقط یک‌کمی کوتاه‌تر. او اول موهایش را شست، و شستن همرای اصلاح شامل بود. اصلاح بیست دالر شد. وقتی تمام شد، میا گفت که موهایش خیلی خوب به نظر می‌رسه. در راه خانه، آن‌ها لیلا را برای یک قهوه دیدن کردن. او بعد از سرماخوردگی‌اش خیلی بهتر شده بود، و او هم اصلاح جدید دانیال را خوش کرد.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- decided, recommended, went, asked, said, washed, finished, met, loved."}

exercises:
  en.a1.unit52.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "trim"
    distractors: ["haircut", "hairdresser", "shorter", "style"]
    accepted_answers: [{value: "trim", status: "correct"}]
    feedback: "trim یعنی کمی کوتاه کردن."
  en.a1.unit52.lesson01.exercise02.choose_trim_meaning:
    instruction: "کدام کلمه یعنی فقط یک مقدار کم از نوک موها را کوتاه کردن؟"
    correct_option: "trim"
    distractors: ["haircut", "style", "wash"]
    accepted_answers: [{value: "trim", status: "correct"}]
    feedback: "trim یعنی کمی کوتاه کردن."
  en.a1.unit52.lesson01.exercise03.match_personal_care_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "haircut", right: "کوتاه‌کردن موی تان"}
      - {left: "hairdresser", right: "کسی که مو را کوتاه و مدل می‌کنه"}
      - {left: "trim", right: "بریدن مقدار بسیار کم از سر مو"}
      - {left: "shorter", right: "درازی کمتر از پیش داشتن"}
      - {left: "style", right: "شکلی که مو بریده یا جور شده"}
      - {left: "wash", right: "پاک‌کردن با آب، مثل مو پیش از اصلاح"}
    accepted_answers:
      - value:
          - {left: "haircut", right: "کوتاه‌کردن موی تان"}
          - {left: "hairdresser", right: "کسی که مو را کوتاه و مدل می‌کنه"}
          - {left: "trim", right: "بریدن مقدار بسیار کم از سر مو"}
          - {left: "shorter", right: "درازی کمتر از پیش داشتن"}
          - {left: "style", right: "شکلی که مو بریده یا جور شده"}
          - {left: "wash", right: "پاک‌کردن با آب، مثل مو پیش از اصلاح"}
        status: "correct"
    feedback: "haircut=اصلاح، hairdresser=آرایشگر، trim=کمی کوتاه کردن، shorter=کوتاه‌تر، style=مدل، wash=شستن."
  en.a1.unit52.lesson01.exercise04.order_haircut_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "a", "haircut."], status: "correct"}]
    feedback: "ترتیب درست: I need a haircut."
  en.a1.unit52.lesson01.exercise05.write_haircut:
    instruction: "کلمه‌ای را بنویسین که یعنی کوتاه کردن مو."
    accepted_answers: [{value: "haircut", status: "correct"}]
    feedback: "haircut یعنی اصلاح."

  en.a1.unit52.lesson02.exercise01.listen_phrase:
