generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false, notes: "Tried firecrawl search/scrape first for Dari-specific hotel/lodging-check-in phrase source material (DLI Dari Basic Course) -- the course's travel-lesson sections cover transportation and directions (already used by earlier units) but no dedicated hotel check-in scene surfaced in the sections checked. No usable verbatim source material found; authored from established Dari-speaker conventions instead, same honest-disclosure standard as every other unit."}
review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit50 (accommodation), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start -- every kind: vocabulary teaching card (all six lesson01 entries) got a matching example_gloss:. Sibling-isolation confirmed: authored without opening docs/content/overlays/nl-en/a1_unit50.yaml (reference-structure-only per dispatch instruction) or docs/content/overlays/fa-en/a1_unit50.yaml (a concurrent, distinct dispatch's lane, not opened). Dari-specific dialect choices: breakfast -> ناشتا (the common colloquial Dari/Afghan term, used alongside the more formal صبحانه that both dialects share -- chosen here to match this unit's spoken-register register_policy); the rest of the vocabulary (هوتل/hotel, اتاق/room, رزرو/reservation, وایفای/wifi) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/داره for می‌شود/دارد, ایگه as the informal presentative particle for handing something over, بجه as the informal o'clock marker). Two genuine Dari-speaker English interference points in the unit-level contrastive note: (1) English's idiom 'under my name' (a reservation associated with a person) uses the spatial preposition 'under' metaphorically, with no equivalent spatial logic in Dari, which expresses the same idea with به نام ('to/in the name') -- a Dari speaker must learn 'under' here as a fixed idiomatic chunk, not a literal spatial translation; (2) English's contraction 'Here's' (Here is), built compositionally from a location word plus the copula, corresponds to Dari's ایگه, a single fixed presentative particle with no internal copula+location structure of its own -- so the two languages arrive at the same handing-something-over function through entirely different grammatical machinery. Three-speaker dialogue (Mia, Leila, and the Receptionist NPC) handled the same way as unit48's precedent -- each turn given its own teaching entry with a short Dari label distinguishing speaker identity. Same-speaker-distractor check performed per the standing CLAUDE.md footgun, following the realization's own explicit flag: lesson03.exercise03's listen_select tests the check-out time (correct_option 'eleven o'clock', the Receptionist's own final line) against invented, never-spoken distractors ('nine o'clock', 'noon') -- deliberately did NOT use 'seven o'clock'/'ten o'clock' as distractors, since the Receptionist's other line states those as the real breakfast hours, matching the realization's own stated reasoning for the same avoidance. The same conservative standard was applied to every other lesson03/lesson04 multiple_choice exercise per the realization's explicit instruction (comprehension_nights_stayed, comprehension_room_features, reading_checkout_time, reading_who_painted all use invented or genuinely-distinct-fact distractors). Multi-clause accepted_answers (lesson04's write_own_checkin_message) mirrors the realization's own three variants exactly, per AUTHORING_GUIDE.md #12. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit50.accommodation: {title: "داخل شدن به هوتل"}

lessons:
  en.a1.unit50.lesson01.accommodation_vocabulary: {title: "کلمات داخل شدن به هوتل"}
  en.a1.unit50.lesson02.checking_in_at_the_front_desk: {title: "داخل شدن نزد میز پذیرش"}
  en.a1.unit50.lesson03.dialogue_checking_in_for_the_weekend: {title: "گفتگو: داخل شدن برای آخر هفته"}
  en.a1.unit50.lesson04.a_weekend_at_the_guesthouse: {title: "متن: یک آخر هفته در مهمان‌خانه"}

teaching:
  en.a1.unit50.lesson01.teach.hotel: {title: "hotel", gloss: "هوتل", note: "hotel یعنی هوتل -- جایی که مسافران پول می‌تن تا شب‌ها آنجه بخوابن.", example_gloss: "ما در یک هوتل کوچک استادیم."}
  en.a1.unit50.lesson01.teach.room: {title: "room", gloss: "اتاق", note: "room یعنی اتاق -- جایی با یک بستر که مهمان آنجه می‌خوابه.", example_gloss: "اتاق ما دو بستر داره."}
  en.a1.unit50.lesson01.teach.reservation: {title: "reservation", gloss: "رزرو", note: "reservation یعنی رزرو -- یک تنظیم از پیش برای داشتن یک اتاق.", example_gloss: "ما برای دو شب رزرو داریم."}
  en.a1.unit50.lesson01.teach.wifi: {title: "wifi", gloss: "وایفای", note: "wifi یعنی وایفای -- یک اتصال انترنت بی‌سیم.", example_gloss: "اتاق وایفای داره؟"}
  en.a1.unit50.lesson01.teach.breakfast: {title: "breakfast", gloss: "ناشتا", note: "breakfast یعنی ناشتا -- خوراک صبح.", example_gloss: "ناشتا شامل استه؟"}
  en.a1.unit50.lesson01.teach.check_out: {title: "check-out", gloss: "خروج (تخلیهٔ اتاق)", note: "check-out یعنی وختی که باید اتاق را ترک کنین و حساب تان را بتین.", example_gloss: "خروج ساعت یازده بجه استه."}

  en.a1.unit50.lesson02.teach.do_you_have_a_reservation: {title: "Do you have a reservation?", gloss: "رزرو دارین؟", note: "Do you have ...? ساختار سوالی معمول با فعل کمکی do استه."}
  en.a1.unit50.lesson02.teach.i_have_a_reservation_for_two_nights: {title: "I have a reservation for two nights.", gloss: "برای دو شب رزرو دارم.", note: "for + مدت زمان یعنی «برای ___»."}
  en.a1.unit50.lesson02.teach.does_the_room_have_wifi: {title: "Does the room have wifi?", gloss: "اتاق وایفای داره؟", note: "Does ...? ساختار سوالی با فعل کمکی does استه چون room سوم شخص مفرد استه."}
  en.a1.unit50.lesson02.teach.what_time_is_check_out: {title: "What time is check-out?", gloss: "وخت خروج ساعت چند استه؟", note: "What time is ...? یک ساختار سوالی معمول برای پرسیدن ساعت استه."}
  en.a1.unit50.lesson02.teach.breakfast_is_included: {title: "Breakfast is included.", gloss: "ناشتا شامل استه.", note: "is included حالت مجهول (passive) استه -- included شکل صفت از فعل include."}
  en.a1.unit50.lesson02.teach.heres_your_key: {title: "Here's your key.", gloss: "ایگه چابی تان.", note: "Here's یعنی Here is کوتاه شده. دری همین معنا را با یک کلمهٔ واحد (ایگه) می‌رساند، بدون ترکیب یک کلمهٔ مکان و فعل کمک."}

  en.a1.unit50.lesson03.teach.dialogue_line1: {title: "گپ میا", gloss: "سلام، ما برای دو شب رزرو داریم.", note: "we have a reservation یعنی ما رزرو داریم."}
  en.a1.unit50.lesson03.teach.dialogue_line2: {title: "سوال پذیرشگر", gloss: "خوش آمدین! رزرو به کدام نام استه؟", note: "What's the name on ...? یعنی «به کدام نام استه؟» -- on اینجه یعنی «متعلق به»."}
  en.a1.unit50.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "به نام منه، لیلا.", note: "under my name یعنی به نام من -- under اینجه معنای مجازی داره، نی معنای معمولی «زیر». دری همین معنا را با «به نام» می‌رساند."}
  en.a1.unit50.lesson03.teach.dialogue_line4: {title: "گفتهٔ پذیرشگر", gloss: "عالی. ایگه چابی تان. اتاق تان دو بستر داره.", note: "Perfect یک عبارت کوتاه برای نشان دادن رضایت استه."}
  en.a1.unit50.lesson03.teach.dialogue_line5: {title: "سوال میا", gloss: "اتاق وایفای داره؟", note: "همو سوال Does که در لسن ۲ یاد گرفتین."}
  en.a1.unit50.lesson03.teach.dialogue_line6: {title: "جواب پذیرشگر", gloss: "بلی، و ناشتا پایین طبقه از ساعت هفت الی ده استه.", note: "from ___ to ___ یعنی «از ___ الی ___» -- برای گفتن یک بازهٔ زمانی کار می‌ره."}
  en.a1.unit50.lesson03.teach.dialogue_line7: {title: "سوال لیلا", gloss: "تشکر! وخت خروج ساعت چند استه؟", note: "همو سوال What time is که در لسن ۲ یاد گرفتین."}
  en.a1.unit50.lesson03.teach.dialogue_line8: {title: "جواب پذیرشگر", gloss: "خروج ساعت یازده بجه استه.", note: "is at + ساعت یعنی «ساعت ___ استه»."}

  en.a1.unit50.lesson04.teach.reading_passage: {title: "متن: یک آخر هفته در مهمان‌خانه", gloss: "یک آخر هفته در مهمان‌خانه: میا و لیلا برای آخر هفته یک سفر کوتاه به کوهستان کردن. میا عکاسی را خوش داره، و لیلا نقاشی را خوش داره، پس آنجه یک جای عالی برای آرام گرفتن بود. وقتی به مهمان‌خانه رسیدن، به پذیرشگر گفتن که برای دو شب رزرو دارن، از ۱۴ نوامبر الی ۱۶ نوامبر. پذیرشگر نام رزرو را پرسید، و لیلا گفت که به نام خودشه. اتاق شان دو بستر و وایفای داشت، و ناشتا هر صبح از هفت الی ده شامل بود. خروج ساعت یازده بجه بود. میا عکس‌های زیادی از کوهستان گرفت، و لیلا یک نقاشی کوچک از منظرهٔ بیرون کلکین شان کشید. دانیال آن آخر هفته در خانه ماند و برای خودش نان شب پخت، با یک رسپی از کتاب آشپزی که از کتابخانه امانت گرفته بود. وقتی میا و لیلا برگشتن، عکس‌ها و نقاشی را به او نشان دادن، و او آن‌ها را خیلی خوش کرد.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- took, arrived, told, asked, said, painted, stayed, cooked, came, showed, loved."}

exercises:
  en.a1.unit50.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "wifi"
    distractors: ["hotel", "room", "reservation", "breakfast"]
    accepted_answers: [{value: "wifi", status: "correct"}]
    feedback: "wifi یعنی وایفای."
  en.a1.unit50.lesson01.exercise02.choose_reservation_meaning:
    instruction: "کدام کلمه یعنی یک تنظیم از پیش برای داشتن یک اتاق؟"
    correct_option: "reservation"
    distractors: ["wifi", "breakfast", "check-out"]
    accepted_answers: [{value: "reservation", status: "correct"}]
    feedback: "reservation یعنی رزرو."
  en.a1.unit50.lesson01.exercise03.match_accommodation_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "a place where travelers pay to sleep for one or more nights", "right": "hotel"}, {"left": "a space with a bed where a guest sleeps", "right": "room"}, {"left": "an arrangement made in advance to have a room", "right": "reservation"}, {"left": "a wireless internet connection", "right": "wifi"}, {"left": "the morning meal", "right": "breakfast"}, {"left": "the time you must leave your room and pay", "right": "check-out"}], "status": "correct"}]
    feedback: "hotel=هوتل، room=اتاق، reservation=رزرو، wifi=وایفای، breakfast=ناشتا، check-out=خروج."
  en.a1.unit50.lesson01.exercise04.order_reservation_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "have", "a", "reservation", "for", "two", "nights."], status: "correct"}]
    feedback: "ترتیب درست: We have a reservation for two nights."
  en.a1.unit50.lesson01.exercise05.write_check_out:
    instruction: "کلمه‌ای را بنویسین که یعنی وختی که باید اتاق تان را ترک کنین."
    accepted_answers: [{value: "check-out", status: "correct"}]
    feedback: "check-out یعنی خروج."

  en.a1.unit50.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Does the room have wifi?"
    distractors: ["Do you have a reservation?", "Breakfast is included.", "Here's your key."]
    accepted_answers: [{value: "Does the room have wifi?", status: "correct"}]
    feedback: "Does the room have wifi? یعنی اتاق وایفای داره؟"
  en.a1.unit50.lesson02.exercise02.choose_reservation_question_meaning:
    instruction: "کدام عبارت را پذیرشگر برای تایید کردن رزرو تان می‌گه؟"
    correct_option: "Do you have a reservation?"
    distractors: ["Does the room have wifi?", "What time is check-out?", "Here's your key."]
    accepted_answers: [{value: "Do you have a reservation?", status: "correct"}]
    feedback: "Do you have a reservation? یعنی رزرو دارین؟"
  en.a1.unit50.lesson02.exercise03.choose_checkout_time_meaning:
    instruction: "کدام عبارت می‌پرسه که وخت خروج ساعت چند استه؟"
    correct_option: "What time is check-out?"
    distractors: ["Do you have a reservation?", "Breakfast is included.", "Does the room have wifi?"]
    accepted_answers: [{value: "What time is check-out?", status: "correct"}]
    feedback: "What time is check-out? یعنی وخت خروج ساعت چند استه؟"
  en.a1.unit50.lesson02.exercise04.order_key_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Here's", "your", "key."], status: "correct"}]
    feedback: "ترتیب درست: Here's your key."
  en.a1.unit50.lesson02.exercise05.translate_breakfast_included:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «ناشتا شامل استه.»"
    accepted_answers:
      - {value: "Breakfast is included.", status: "correct"}
      - {value: "Breakfast is included", status: "correct"}
    feedback: "Breakfast is included. یعنی ناشتا شامل استه."

  en.a1.unit50.lesson03.exercise01.comprehension_nights_stayed:
    instruction: "مطابق گفتگو، میا و لیلا چند شب می‌مانن؟"
    correct_option: "two nights"
    distractors: ["one night", "three nights", "four nights"]
    accepted_answers: [{value: "two nights", status: "correct"}]
    feedback: "میا و لیلا دو شب (two nights) می‌مانن."
  en.a1.unit50.lesson03.exercise02.comprehension_room_features:
    instruction: "مطابق گفتگو، پذیرشگر می‌گه اتاق چه چیزی داره؟"
    correct_option: "two beds"
    distractors: ["a kitchen", "one bed", "a balcony"]
    accepted_answers: [{value: "two beds", status: "correct"}]
    feedback: "پذیرشگر می‌گه اتاق دو بستر (two beds) داره."
  en.a1.unit50.lesson03.exercise03.listen_dialogue_checkout_time:
    instruction: "مطابق گفتگو، وخت خروج ساعت چند استه؟"
    correct_option: "eleven o'clock"
    distractors: ["nine o'clock", "noon", "eight o'clock"]
    accepted_answers: [{value: "eleven o'clock", status: "correct"}]
    feedback: "وخت خروج ساعت یازده بجه (eleven o'clock) استه."
  en.a1.unit50.lesson03.exercise04.respond_own_checkin_statement:
    instruction: "بگین وخت خروج ساعت چند استه، یا بگین اتاق چه چیزی داره."
    accepted_answers: ["Check-out is at eleven o'clock", "Check-out is at eleven o'clock.", "The room has two beds", "The room has two beds.", "Does the room have wifi", "Does the room have wifi?", "Breakfast is downstairs from seven to ten", "Breakfast is downstairs from seven to ten."]
    feedback: "می‌تانین بگین Check-out is at eleven o'clock یا The room has two beds."

  en.a1.unit50.lesson04.exercise01.reading_nights_stayed:
    instruction: "مطابق متن، میا و لیلا چند شب در مهمان‌خانه ماندن؟"
    correct_option: "two nights"
    distractors: ["one night", "three nights", "four nights"]
    accepted_answers: [{value: "two nights", status: "correct"}]
    feedback: "میا و لیلا دو شب (two nights) ماندن."
  en.a1.unit50.lesson04.exercise02.reading_checkout_time:
    instruction: "مطابق متن، وخت خروج ساعت چند بود؟"
    correct_option: "eleven o'clock"
    distractors: ["nine o'clock", "noon", "eight o'clock"]
    accepted_answers: [{value: "eleven o'clock", status: "correct"}]
    feedback: "وخت خروج ساعت یازده بجه (eleven o'clock) بود."
  en.a1.unit50.lesson04.exercise03.reading_who_painted:
    instruction: "مطابق متن، کی یک نقاشی از منظره کشید؟"
    correct_option: "Leila"
    distractors: ["Mia", "Daniel", "the receptionist"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "لیلا (Leila) یک نقاشی از منظره کشید."
  en.a1.unit50.lesson04.exercise04.write_own_checkin_message:
    instruction: "یک پیام کوتاه بنویسین: بگین چند شب ماندن، و بگین وخت خروج ساعت چند بود."
    accepted_answers:
      - {value: "They stayed two nights. Check-out was at eleven o'clock.", status: "correct"}
      - {value: "They stayed two nights, and check-out was at eleven o'clock.", status: "correct"}
      - {value: "They stayed two nights, check-out was at eleven o'clock.", status: "correct"}
    feedback: "می‌تانین بگین: They stayed two nights. Check-out was at eleven o'clock."
