course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای تغییر دادن لحن پیام به دوست، همکار، و اداره، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit05.register: {title: "یک پیام، سه لحن"}

lessons:
  en.b2.unit05.lesson01.audience_and_formality: {title: "خودمانی، کاری، و رسمی"}
  en.b2.unit05.lesson02_same_request_three_ways: {title: "Can you، could we، I would be grateful"}
  en.b2.unit05.lesson03.reading_same_message: {title: "متن خوانی: سه طرف مقابل"}
  en.b2.unit05.lesson04.the_register_dialogue: {title: "برای دوست بلی؛ برای کلینیک نخیر"}

teaching:
  en.b2.unit05.lesson01.teach.register: {title: "register", gloss: "درجهٔ رسمی یا خودمانی بودن گپ", note: "*register* فقط معنی کلمه‌ها نیست؛ یعنی گپ تان برای کی مناسب استه. دری هم با «می‌کنی/می‌کنین» فرق می‌سازه، اما انگلیسی بیشتر با phrasing فرق می‌سازه.", example_gloss: "وقتی طرف مقابل تغییر می‌کنه، درجهٔ رسمی بودن پیام هم تغییر می‌کنه."}
  en.b2.unit05.lesson01.teach.casual: {title: "casual", gloss: "خودمانی، مناسب دوست نزدیک", note: "*casual* برای دوست و فضای راحت استه. برای کلینیک یا اداره زیاد مستقیم معلوم می‌شه.", example_gloss: "پیام خودمانی برای دوست مناسب استه."}
  en.b2.unit05.lesson01.teach.professional: {title: "professional", gloss: "کاری و مؤدب، مناسب همکار", note: "*professional* بین خودمانی و رسمی استه: واضح، مؤدب، اما خیلی خشک نیست.", example_gloss: "پیام کاری برای همکار مناسب استه."}
  en.b2.unit05.lesson01.teach.formal: {title: "formal", gloss: "رسمی، مناسب اداره یا نهاد", note: "*formal* برای نهادهایی مثل کلینیک، بانک، یا پوهنتون استه. در انگلیسی B2 با عبارت‌هایی مثل *I would be grateful if...* ساخته می‌شه.", example_gloss: "پیام رسمی برای یک نهاد مناسب استه."}
  en.b2.unit05.lesson01.teach.audience: {title: "audience", gloss: "طرف مقابل، کسی که پیام را می‌گیره", note: "*audience* تعیین می‌کنه چقدر مستقیم یا رسمی بنویسین.", example_gloss: "طرف مقابل شما روی انتخاب کلمه‌ها اثر می‌کنه."}
  en.b2.unit05.lesson01.teach.institution: {title: "institution", gloss: "نهاد یا اداره مثل کلینیک، بانک، پوهنتون", note: "*institution* یک سازمان رسمی استه، نه یک دوست شخصی.", example_gloss: "کلینیک یک نهاد استه."}

  en.b2.unit05.lesson02.teach.formal_request: {title: "I would be grateful if you could confirm whether my appointment can be moved.", gloss: "سپاسگزار می‌شم اگر تایید کنین که آیا وقت ملاقاتم قابل تغییر استه یا نه.", note: "این جمله رسمی استه. در دری شاید احترام را با فعل جمع نشان بتین؛ در انگلیسی احترام با عبارت کامل و غیرمستقیم می‌آیه.", media_asset_key: "en.b2.audio.register.sentence.01"}
  en.b2.unit05.lesson02.teach.casual_request: {title: "Can you move it to Friday?", gloss: "می‌تانی آن را به جمعه تغییر بتی؟", note: "برای دوست طبیعی استه، اما برای نهاد زیاد مستقیم و خودمانی شنیده می‌شه."}
  en.b2.unit05.lesson02.teach.professional_request: {title: "Could we move the appointment to Friday if that still works for you?", gloss: "می‌تانیم وقت ملاقات را به جمعه تغییر بتیم، اگر هنوز برایت مناسب استه؟", note: "*Could we... if that still works for you?* کاری و مؤدب استه، اما مثل نامهٔ رسمی خشک نیست."}
  en.b2.unit05.lesson02.teach.to_whom: {title: "Dear scheduling team,", gloss: "تیم محترم تنظیم وقت،", note: "*Dear...* شروع رسمی یا نیمه‌رسمی ایمیل استه. اینجا برای تیم کلینیک مناسب استه.", media_asset_key: "en.b2.audio.register.phrase.to_whom_it_may_concern.01"}
  en.b2.unit05.lesson02.teach.grammar_register_shift: {title: "یک محتوا، phrasing متفاوت", gloss: "وقتی register را تغییر می‌تین، اصل پیام را همان نگه کنین: تغییر وقت ملاقات. برای دوست سوال مستقیم کافی استه. برای همکار *could* نرم‌تر استه. برای نهاد عبارت *I would be grateful if you could...* رسمی‌تر استه.", note: "دری‌زبان‌ها گاهی فقط احترام فعلی را تغییر می‌تن؛ در انگلیسی باید تمام جمله را مناسب طرف مقابل بسازین."}

  en.b2.unit05.lesson03.teach.stiff: {title: "stiff", gloss: "خشک و بیش از حد رسمی", note: "*stiff* یعنی پیام از موقعیت رسمی‌تر و سنگین‌تر معلوم می‌شه.", example_gloss: "پیام خشک برای دوست نزدیک زیادی رسمی معلوم می‌شه."}
  en.b2.unit05.lesson03.teach.appropriate: {title: "appropriate", gloss: "مناسب برای موقعیت", note: "*appropriate* یعنی لحن و کلمه‌ها با طرف مقابل جور استه.", example_gloss: "پیام مناسب با طرف مقابل جور می‌آیه."}
  en.b2.unit05.lesson03.teach.reading_passage: {title: "متن دربارهٔ سه طرف مقابل", gloss: "نینا باید وقت ملاقاتش را به جمعه تغییر بته. برای دوست می‌نویسه: *Can you move it to Friday?* پیام مستقیم و خودمانی استه. برای همکار می‌نویسه: *Could we move the appointment to Friday if that still works for you?* پیام کاری و مؤدب استه. برای کلینیک می‌نویسه: *I would be grateful if you could confirm whether my appointment can be moved to Friday.* محتوا در هر سه متن همان استه، اما register با طرف مقابل تغییر می‌کنه.", note: "فرق را فقط در معنی نبینین؛ فرق اصلی در شکل درخواست و فاصلهٔ اجتماعی استه."}

  en.b2.unit05.lesson04.teach.q_need_ask: {title: "سوال نینا", gloss: "نینا می‌گه: باید دربارهٔ تغییر وقت ملاقاتم بپرسم. می‌تانم فقط بنویسم: «Can you move it?»", note: "او می‌پرسه آیا جملهٔ خودمانی برای هر طرف مقابل مناسب استه یا نه.", media_asset_key: "en.b2.audio.dialogue.register.01"}
  en.b2.unit05.lesson04.teach.a_too_casual: {title: "جواب آسکر", gloss: "آسکر می‌گه: برای دوست، بلی. برای کلینیک، این زیاد خودمانی شنیده می‌شه.", note: "همان جمله برای یک طرف مقابل درست و برای طرف مقابل دیگر نامناسب استه."}
  en.b2.unit05.lesson04.teach.q_colleague: {title: "سوال دربارهٔ همکار", gloss: "نینا می‌پرسه: برای یک همکار چی می‌نویسی؟", note: "همکار معمولاً لحن کاری می‌خواهد، نه خیلی خودمانی و نه خیلی رسمی."}
  en.b2.unit05.lesson04.teach.a_colleague_request: {title: "نسخهٔ کاری", gloss: "آسکر می‌گه: می‌نویسم: *Could we move the appointment to Friday if that still works for you?*", note: "*Could we* و *if that still works for you* درخواست را نرم و کاری می‌سازن."}
  en.b2.unit05.lesson04.teach.q_clinic: {title: "سوال دربارهٔ کلینیک", gloss: "نینا می‌پرسه: و برای کلینیک؟", note: "کلینیک نهاد استه، پس جمله باید رسمی‌تر باشه."}
  en.b2.unit05.lesson04.teach.a_clinic_request: {title: "نسخهٔ رسمی", gloss: "آسکر می‌گه: می‌نویسم: *I would be grateful if you could confirm whether my appointment can be moved to Friday.*", note: "این جمله غیرمستقیم و رسمی استه، مناسب نهاد."}
  en.b2.unit05.lesson04.teach.q_same_message: {title: "خلاصهٔ نینا", gloss: "نینا می‌گه: همان پیام، register متفاوت.", note: "اصل درخواست تغییر نمی‌کنه؛ شکل گفتنش تغییر می‌کنه."}
  en.b2.unit05.lesson04.teach.a_content_stays: {title: "تایید آسکر", gloss: "آسکر می‌گه: دقیقاً. محتوا همان می‌مانه، اما درجهٔ رسمی بودن تغییر می‌کنه.", note: "این نکتهٔ اصلی درس استه."}

exercises:
  en.b2.unit05.lesson01.exercise01.choose_register:
    instruction: "کدام کلمه یعنی درجهٔ رسمی بودن که برای یک طرف مقابل انتخاب می‌کنین؟"
    correct_option: "register"
    distractors: ["audience", "institution", "casual"]
    accepted_answers: [{value: "register", status: "correct"}]
    feedback: "*register* سطح رسمی یا خودمانی بودن پیام استه."
  en.b2.unit05.lesson01.exercise02.choose_institution:
    instruction: "کدام کلمه برای سازمانی مثل کلینیک، بانک، یا پوهنتون استفاده می‌شه؟"
    correct_option: "institution"
    distractors: ["audience", "casual", "professional"]
    accepted_answers: [{value: "institution", status: "correct"}]
    feedback: "*institution* نهاد یا سازمان رسمی استه."
  en.b2.unit05.lesson01.exercise03.match_register_terms:
    instruction: "هر کلمهٔ register را به معنی درستش وصل کنین."
    accepted_answers:
      - value:
          - {left: "register", right: "casual, professional, or formal"}
          - {left: "casual", right: "appropriate for a close friend"}
          - {left: "professional", right: "appropriate for a colleague"}
          - {left: "formal", right: "appropriate for an institution"}
          - {left: "audience", right: "the person or group receiving the message"}
          - {left: "institution", right: "an organization such as a clinic or university"}
        status: "correct"
    feedback: "در انگلیسی register بیشتر با phrasing ساخته می‌شه، نه فقط با یک کلمهٔ احترام."
  en.b2.unit05.lesson01.exercise04.write_formal:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی مناسب برای نهاد یا اداره."
    accepted_answers:
      - {value: "formal", status: "correct"}
      - {value: "Formal", status: "correct"}
    feedback: "*formal* یعنی رسمی."
  en.b2.unit05.lesson01.exercise05.write_casual:
    instruction: "کلمهٔ انگلیسی را بنویسین که یعنی مناسب دوست نزدیک."
    accepted_answers:
      - {value: "casual", status: "correct"}
      - {value: "Casual", status: "correct"}
    feedback: "*casual* یعنی خودمانی."

  en.b2.unit05.lesson02.exercise01_choose_formal:
    instruction: "کدام جمله نسخهٔ رسمی برای یک نهاد استه؟"
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved."
    distractors: ["Can you move it to Friday?", "Could we move the appointment to Friday if that still works for you?", "Move my appointment Friday."]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved.", status: "correct"}]
    feedback: "*I would be grateful if you could...* برای نهاد رسمی و مؤدب استه."
  en.b2.unit05.lesson02.exercise02_choose_casual:
    instruction: "کدام جمله نسخهٔ خودمانی برای دوست استه؟"
    correct_option: "Can you move it to Friday?"
    distractors: ["I would be grateful if you could confirm whether my appointment can be moved.", "Dear scheduling team,", "Could we move the appointment to Friday if that still works for you?"]
    accepted_answers: [{value: "Can you move it to Friday?", status: "correct"}]
    feedback: "*Can you move it...?* مستقیم و مناسب دوست استه."
  en.b2.unit05.lesson02.exercise03_order_formal_request:
    instruction: "کلمات را طوری تنظیم کنین که درخواست رسمی ساخته شه."
    accepted_answers: [{value: ["I", "would", "be", "grateful", "if", "you", "could", "confirm", "whether", "my", "appointment", "can", "be", "moved"], status: "correct"}]
    feedback: "ترتیب درست: *I would be grateful if you could confirm whether my appointment can be moved*"
  en.b2.unit05.lesson02.exercise04_reply_professional:
    instruction: "نسخهٔ کاری برای همکار را دقیقاً بنویسین: *Could we move the appointment to Friday if that still works for you?*"
    accepted_answers:
      - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
      - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
    feedback: "*Could we... if that still works for you?* همکارانه و نرم استه."
  en.b2.unit05.lesson02.exercise05_write_formal_request:
    instruction: "نسخهٔ رسمی برای نهاد را دقیقاً بنویسین: *I would be grateful if you could confirm whether my appointment can be moved to Friday.*"
    accepted_answers:
      - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday", status: "correct"}
    feedback: "جمله باید غیرمستقیم و رسمی بمانه؛ *Can you move it?* اینجا کافی نیست."

  en.b2.unit05.lesson03.exercise01_choose_friend_text:
    instruction: "کدام متن برای دوست نوشته شده؟"
    correct_option: "Can you move it to Friday?"
    distractors: ["Could we move the appointment to Friday if that still works for you?", "I would be grateful if you could confirm whether my appointment can be moved to Friday.", "Dear scheduling team,"]
    accepted_answers: [{value: "Can you move it to Friday?", status: "correct"}]
    feedback: "نسخهٔ دوست مستقیم و خودمانی استه."
  en.b2.unit05.lesson03.exercise02_choose_clinic_text:
    instruction: "کدام متن برای کلینیک نوشته شده؟"
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
    distractors: ["Can you move it to Friday?", "Could we move the appointment to Friday if that still works for you?", "Can you move it?"]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}]
    feedback: "کلینیک نهاد استه؛ نسخهٔ رسمی مناسب‌تر استه."
  en.b2.unit05.lesson03.exercise03_match_audience:
    instruction: "هر ویژگی متن را به طرف مقابل یا قضاوت درست وصل کنین."
    accepted_answers:
      - value:
          - {left: "friend version", right: "Can you move it to Friday?"}
          - {left: "colleague version", right: "Could we move the appointment to Friday if that still works for you?"}
          - {left: "clinic version", right: "I would be grateful if you could confirm whether my appointment can be moved to Friday."}
          - {left: "too formal for a close friend", right: "stiff"}
          - {left: "fits the audience", right: "appropriate"}
          - {left: "changes across the three texts", right: "register"}
        status: "correct"
    feedback: "هر سه درخواست یک محتوا دارند، اما register شان فرق می‌کنه."
  en.b2.unit05.lesson03.exercise04_write_same_content:
    instruction: "دقیقاً بنویسین: *The content is the same, but the register changes.*"
    accepted_answers:
      - {value: "The content is the same, but the register changes.", status: "correct"}
      - {value: "The content is the same but the register changes.", status: "correct"}
    feedback: "محتوا ثابت استه؛ phrasing و formal level تغییر می‌کنه."
  en.b2.unit05.lesson03.exercise05_write_colleague_version:
    instruction: "نسخهٔ همکار از متن را دقیقاً بنویسین: *Could we move the appointment to Friday if that still works for you?*"
    accepted_answers:
      - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
      - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
    feedback: "این نسخه professional استه، نه casual و نه formal."

  en.b2.unit05.lesson04.exercise01_choose_too_casual:
    instruction: "در گفتگو، کدام wording برای کلینیک زیاد خودمانی استه؟"
    correct_option: "Can you move it?"
    distractors: ["Could you confirm whether my appointment can be moved?", "Could we move the appointment to Friday?", "I need to ask about moving my appointment."]
    accepted_answers: [{value: "Can you move it?", status: "correct"}]
    feedback: "برای دوست بلی، اما برای کلینیک زیاد مستقیم و خودمانی استه."
  en.b2.unit05.lesson04.exercise02_listen_clinic:
    instruction: "گوش کنین و نسخهٔ رسمی کلینیک را انتخاب کنین."
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
    distractors: ["I would be grateful if you could cancel my appointment.", "Please confirm whether the clinic is open on Friday.", "Could you tell me where the scheduling team is?"]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}]
    feedback: "این جمله رسمی استه و برای نهاد مناسب استه."
  en.b2.unit05.lesson04.exercise03_order_colleague:
    instruction: "کلمات را طوری تنظیم کنین که نسخهٔ کاری همکار ساخته شه."
    accepted_answers: [{value: ["could", "we", "move", "the", "appointment", "to", "Friday", "if", "that", "still", "works", "for", "you"], status: "correct"}]
    feedback: "ترتیب درست: *could we move the appointment to Friday if that still works for you*"
  en.b2.unit05.lesson04.exercise04_reply_as_oscar:
    instruction: "به نقش آسکر، دقیقاً به سوال نینا دربارهٔ *Can you move it?* جواب بتین."
    accepted_answers:
      - {value: "To a friend, yes. To the clinic, that sounds too casual.", status: "correct"}
      - {value: "To a friend, yes; to the clinic, that sounds too casual.", status: "correct"}
    feedback: "در انگلیسی کلمه‌های *Yes* و *No* کوتاه استند، اما اینجا باید توضیح طرف مقابل هم بیایه."
  en.b2.unit05.lesson04.exercise05_speak_shift_register:
    instruction: "آوازی همان درخواست را سه شکل بگین: برای دوست، برای همکار، و برای نهاد."
    accepted_answers:
      - {value: "Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
    feedback: "هر سه جمله باید همان محتوا را با register متفاوت بسازن."
  en.b2.unit05.lesson04.exercise06_write_three_registers:
    instruction: "همان درخواست را در سه register دقیقاً بنویسین: friend، colleague، institution."
    accepted_answers:
      - {value: "Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "Can you move it to Friday? Could we move the appointment to Friday, if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
    feedback: "جواب باید سه سطح را به ترتیب نام‌برده بسازه."
