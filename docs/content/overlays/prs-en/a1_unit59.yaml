course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit59.banking_basics: {title: "کارهای سادهٔ بانکی"}

lessons:
  en.a1.unit59.lesson01.banking_words: {title: "کلمات بانکی"}
  en.a1.unit59.lesson02.banking_phrases: {title: "عبارات در بانک"}
  en.a1.unit59.lesson03.dialogue_at_the_bank: {title: "گفت‌وگو: در بانک"}
  en.a1.unit59.lesson04.bank_notice: {title: "متن: اعلانیهٔ بانک"}

teaching:
  en.a1.unit59.lesson01.teach.bank: {title: "bank", gloss: "بانک", note: "bank یعنی بانک؛ جایی که مردم پول نگه می‌دارن یا کار حساب بانکی انجام می‌تن.", example_gloss: "بانک همین نزدیک استه."}
  en.a1.unit59.lesson01.teach.account: {title: "account", gloss: "حساب", note: "account یعنی حساب بانکی؛ جای ثبت پول شما در بانک.", example_gloss: "من یک حساب بانکی دارم."}
  en.a1.unit59.lesson01.teach.card: {title: "card", gloss: "کارت", note: "card یعنی کارت بانکی یا کارت پرداخت.", example_gloss: "این کارت اینجه کار می‌کنه."}
  en.a1.unit59.lesson01.teach.cash: {title: "cash", gloss: "پول نقد", note: "cash یعنی پول نقد؛ پولی که با خود دارین، مثل نوت و سکه.", example_gloss: "به پول نقد ضرورت دارم."}
  en.a1.unit59.lesson01.teach.atm: {title: "ATM", gloss: "ای‌تی‌ام", note: "ATM یعنی ماشین بانکی که از آن پول نقد می‌گیرین یا بیلانس را چک می‌کنین.", example_gloss: "ای‌تی‌ام بیرون استه."}
  en.a1.unit59.lesson01.teach.balance: {title: "balance", gloss: "بیلانس حساب", note: "balance یعنی مقدار پولی که در حساب شما مانده.", example_gloss: "می‌خواهم بیلانس حسابم را چک کنم."}

  en.a1.unit59.lesson02.teach.i_need_cash: {title: "I need cash.", gloss: "به پول نقد ضرورت دارم.", note: "need یعنی ضرورت داشتن. در انگلیسی I need cash یک جملهٔ کوتاه و مستقیم استه."}
  en.a1.unit59.lesson02.teach.where_is_the_atm: {title: "Where is the ATM?", gloss: "ای‌تی‌ام کجاست؟", note: "Where is ...? برای پرسیدن جای یک چیز کار می‌ره."}
  en.a1.unit59.lesson02.teach.check_my_balance: {title: "I want to check my balance.", gloss: "می‌خواهم بیلانس حسابم را چک کنم.", note: "check my balance یعنی دیدن مقدار پولی که در حساب مانده."}
  en.a1.unit59.lesson02.teach.can_i_use_this_card: {title: "Can I use this card?", gloss: "می‌تانم از این کارت کار بگیرم؟", note: "Can I ...? یک ساختار مؤدبانه برای پرسیدن اجازه یا امکان استه."}
  en.a1.unit59.lesson02.teach.enter_your_pin: {title: "Please enter your PIN.", gloss: "لطفاً پین خود را وارد کنین.", note: "PIN همان نمبر مخفی کارت استه. enter در اینجا یعنی وارد کردن نمبر."}
  en.a1.unit59.lesson02.teach.atm_outside: {title: "The ATM is outside.", gloss: "ای‌تی‌ام بیرون استه.", note: "outside یعنی بیرون، مقابل inside یعنی داخل."}

  en.a1.unit59.lesson03.teach.dialogue_line1: {title: "سوال میا", gloss: "سلام! ای‌تی‌ام کجاست؟", note: "میا با Where is the ATM? جای ماشین بانکی را می‌پرسه."}
  en.a1.unit59.lesson03.teach.dialogue_line2: {title: "جواب کلرک", gloss: "ای‌تی‌ام بیرون استه.", note: "The ATM is outside جواب کوتاه جای ای‌تی‌ام استه."}
  en.a1.unit59.lesson03.teach.dialogue_line3: {title: "سوال لیلا", gloss: "می‌تانم از این کارت کار بگیرم؟", note: "this card یعنی همین کارتی که در دست یا پیش گوینده استه."}
  en.a1.unit59.lesson03.teach.dialogue_line4: {title: "جواب کلرک", gloss: "بلی، می‌تانین از همان کارت کار بگیرین.", note: "that card به همان کارتی اشاره می‌کنه که لیلا نشان داده."}
  en.a1.unit59.lesson03.teach.dialogue_line5: {title: "خواستهٔ میا", gloss: "می‌خواهم بیلانس حسابم را چک کنم.", note: "I want to ... برای گفتن خواستهٔ ساده کار می‌ره."}
  en.a1.unit59.lesson03.teach.dialogue_line6: {title: "راهنمایی کلرک", gloss: "لطفاً پین خود را وارد کنین.", note: "Please جمله را مؤدبانه می‌سازه."}
  en.a1.unit59.lesson03.teach.dialogue_line7: {title: "گپ لیلا", gloss: "من هم به پول نقد ضرورت دارم.", note: "too یعنی هم/نیز؛ لیلا می‌گه او هم پول نقد می‌خواهد."}
  en.a1.unit59.lesson03.teach.dialogue_line8: {title: "جواب کلرک", gloss: "می‌تانین بیست دالر بگیرین.", note: "take out در کار بانکی یعنی پول را از حساب گرفتن."}
  en.a1.unit59.lesson03.teach.dialogue_line9: {title: "تشکر میا", gloss: "تشکر! این مفید استه.", note: "helpful یعنی مفید یا کمک‌کننده."}

  en.a1.unit59.lesson04.teach.bank_notice: {title: "اعلانیهٔ بانک", gloss: "اعلانیهٔ بانک: از ۹:۰۰ تا ۴:۰۰ باز. ای‌تی‌ام بیرون. حد پول نقد امروز: ۱۰۰ دالر. کارت‌ها قبول می‌شن.", note: "این یک اعلانیهٔ کوتاه بانکی استه؛ ساعت کار، جای ای‌تی‌ام، حد پول نقد و قبول شدن کارت‌ها را نشان می‌ته."}
  en.a1.unit59.lesson04.teach.reading_passage: {title: "متن: یک توقف کوتاه در بانک", gloss: "یک توقف کوتاه در بانک: یک صبح، میا و لیلا با هم به بانک رفتن. میا می‌خواست بیلانس حسابش را چک کند، و لیلا به پول نقد ضرورت داشت. کلرک گفت ای‌تی‌ام بیرون استه. لیلا از کارتش کار گرفت و بیست دالر گرفت. میا پین خود را وارد کرد و بیلانس حسابش را چک کرد. پیش از رفتن، آن‌ها اعلانیه را خواندن. بانک از ۹:۰۰ تا ۴:۰۰ باز بود، و حد پول نقد ۱۰۰ دالر بود. میا گفت که این رفت‌وآمد آسان بود.", note: "این متن گذشتهٔ سادهٔ افعال را در یک کار واقعی بانکی نشان می‌ته: went, wanted, needed, said, used, took, entered, checked, read."}

exercises:
  en.a1.unit59.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "cash"
    distractors: ["bank", "card", "balance"]
    accepted_answers: [{value: "cash", status: "correct"}]
    feedback: "cash یعنی پول نقد."
  en.a1.unit59.lesson01.exercise02.choose_atm_meaning:
    instruction: "کدام کلمه یعنی ماشین بانکی که از آن پول نقد گرفته می‌شه؟"
    correct_option: "ATM"
    distractors: ["bank", "account", "card"]
    accepted_answers: [{value: "ATM", status: "correct"}]
    feedback: "ATM یعنی ای‌تی‌ام."
  en.a1.unit59.lesson01.exercise03.match_banking_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "bank", right: "جایی که پول را نگه می‌داره"}
      - {left: "account", right: "حسابی در یک نهاد مالی که پول تان در آن ثبت می‌شه"}
      - {left: "card", right: "وسیلهٔ پلاستیکی کوچک برای پرداخت"}
      - {left: "cash", right: "پول کاغذی و سکه‌ها"}
      - {left: "ATM", right: "ماشینی که از آن پول نقد می‌گیرین"}
      - {left: "balance", right: "مقدار پولی که در حساب تان استه"}
    accepted_answers:
      - value:
          - {left: "bank", right: "جایی که پول را نگه می‌داره"}
          - {left: "account", right: "حسابی در یک نهاد مالی که پول تان در آن ثبت می‌شه"}
          - {left: "card", right: "وسیلهٔ پلاستیکی کوچک برای پرداخت"}
          - {left: "cash", right: "پول کاغذی و سکه‌ها"}
          - {left: "ATM", right: "ماشینی که از آن پول نقد می‌گیرین"}
          - {left: "balance", right: "مقدار پولی که در حساب تان استه"}
        status: "correct"
    feedback: "bank=بانک، account=حساب، card=کارت، cash=پول نقد، ATM=ای‌تی‌ام، balance=بیلانس حساب."
  en.a1.unit59.lesson01.exercise04.order_cash_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "cash."], status: "correct"}]
    feedback: "ترتیب درست: I need cash."
  en.a1.unit59.lesson01.exercise05.write_balance:
    instruction: "کلمه‌ای را بنویسین که یعنی پولی که در حساب شما مانده."
    accepted_answers: [{value: "balance", status: "correct"}]
    feedback: "balance یعنی بیلانس حساب."

  en.a1.unit59.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "I want to check my balance."
    distractors: ["I need cash.", "Where is the ATM?", "Please enter your PIN."]
    accepted_answers: [{value: "I want to check my balance.", status: "correct"}]
    feedback: "I want to check my balance. یعنی می‌خواهم بیلانس حسابم را چک کنم."
  en.a1.unit59.lesson02.exercise02.choose_atm_question:
    instruction: "کدام عبارت جای ای‌تی‌ام را می‌پرسه؟"
    correct_option: "Where is the ATM?"
    distractors: ["I need cash.", "Please enter your PIN.", "The ATM is outside."]
    accepted_answers: [{value: "Where is the ATM?", status: "correct"}]
    feedback: "Where is the ATM? یعنی ای‌تی‌ام کجاست؟"
  en.a1.unit59.lesson02.exercise03.choose_card_question:
    instruction: "کدام عبارت می‌پرسه که آیا این کارت اینجه کار می‌کنه؟"
    correct_option: "Can I use this card?"
    distractors: ["I need cash.", "Where is the ATM?", "Please enter your PIN."]
    accepted_answers: [{value: "Can I use this card?", status: "correct"}]
    feedback: "Can I use this card? یعنی می‌تانم از این کارت کار بگیرم؟"
  en.a1.unit59.lesson02.exercise04.order_atm_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "ATM", "is", "outside."], status: "correct"}]
    feedback: "ترتیب درست: The ATM is outside."
  en.a1.unit59.lesson02.exercise05.translate_need_cash:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «به پول نقد ضرورت دارم.»"
    accepted_answers:
      - {value: "I need cash.", status: "correct"}
      - {value: "I need cash", status: "correct"}
      - {value: "I need some cash.", status: "correct"}
    feedback: "I need cash. یعنی به پول نقد ضرورت دارم."

  en.a1.unit59.lesson03.exercise01.comprehension_atm_place:
    instruction: "مطابق گفتگو، ای‌تی‌ام کجاست؟"
    correct_option: "outside"
    distractors: ["inside", "near the door", "at home"]
    accepted_answers: [{value: "outside", status: "correct"}]
    feedback: "کلرک می‌گه ای‌تی‌ام بیرون استه."
  en.a1.unit59.lesson03.exercise02.comprehension_cash_amount:
    instruction: "مطابق گفتگو، لیلا چقدر پول نقد گرفته می‌تانه؟"
    correct_option: "twenty dollars"
    distractors: ["ten dollars", "twelve dollars", "four dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "لیلا می‌تانه بیست دالر بگیره."
  en.a1.unit59.lesson03.exercise03.listen_dialogue_pin:
    instruction: "مطابق گفتگو، کلرک کدام جمله را به میا می‌گه؟"
    correct_option: "Please enter your PIN."
    distractors: ["Where is the ATM?", "Can I use this card?", "I need cash too."]
    accepted_answers: [{value: "Please enter your PIN.", status: "correct"}]
    feedback: "کلرک می‌گه: Please enter your PIN."
  en.a1.unit59.lesson03.exercise04.respond_own_bank_statement:
    instruction: "بگین ای‌تی‌ام کجاست، بگین می‌خواهین بیلانس را چک کنین، یا بگین به پول نقد ضرورت دارین."
    accepted_answers: ["The ATM is outside", "The ATM is outside.", "I want to check my balance", "I want to check my balance.", "Please enter your PIN", "Please enter your PIN.", "I need cash", "I need cash.", "I need some cash", "I'd like to check my balance", "I would like to check my balance", "It's outside", "The ATM is outside the bank"]
    feedback: "می‌تانین بگین The ATM is outside یا I need cash."

  en.a1.unit59.lesson04.exercise01.notice_opening_time:
    instruction: "مطابق اعلانیه، بانک ساعت چند باز می‌شه؟"
    correct_option: "9:00"
    distractors: ["8:00", "10:00", "4:00"]
    accepted_answers: [{value: "9:00", status: "correct"}]
    feedback: "اعلانیه می‌گه بانک از ۹:۰۰ باز استه."
  en.a1.unit59.lesson04.exercise02.notice_cash_limit:
    instruction: "مطابق اعلانیه، حد پول نقد امروز چند استه؟"
    correct_option: "$100"
    distractors: ["$20", "$50", "$200"]
    accepted_answers: [{value: "$100", status: "correct"}]
    feedback: "حد پول نقد امروز ۱۰۰ دالر استه."
  en.a1.unit59.lesson04.exercise03.reading_cash_amount:
    instruction: "مطابق متن، لیلا چقدر پول نقد گرفت؟"
    correct_option: "twenty dollars"
    distractors: ["ten dollars", "fifty dollars", "one hundred dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "لیلا بیست دالر گرفت."
  en.a1.unit59.lesson04.exercise04.reading_who_checked_balance:
    instruction: "مطابق متن، کی بیلانس حسابش را چک کرد؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the clerk"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "میا بیلانس حسابش را چک کرد."
  en.a1.unit59.lesson04.exercise05.write_own_bank_message:
    instruction: "یک پیام کوتاه بنویسین: بگین ای‌تی‌ام کجاست، و بگین حد پول نقد چند استه."
    accepted_answers:
      - {value: "The ATM is outside. The cash limit is $100.", status: "correct"}
      - {value: "The ATM is outside, and the cash limit is $100.", status: "correct"}
      - {value: "The ATM is outside and the cash limit is $100.", status: "correct"}
      - {value: "The ATM is outside. The limit is $100.", status: "correct"}
      - {value: "The ATM is outside, and the limit is $100.", status: "correct"}
      - {value: "The ATM is outside. The cash limit today is $100.", status: "correct"}
      - {value: "The ATM is outside, and the cash limit today is $100.", status: "correct"}
      - {value: "The ATM is outside. The cash limit is 100 dollars.", status: "correct"}
      - {value: "The ATM is outside, and the cash limit is 100 dollars.", status: "correct"}
      - {value: "The ATM is outside. The cash limit is one hundred dollars.", status: "correct"}
      - {value: "The ATM is outside, and the cash limit is one hundred dollars.", status: "correct"}
    feedback: "می‌تانین بگین: The ATM is outside. The cash limit is $100."
