review: {status: "unreviewed", required_next_reviewer: "fresh-context", notes: "New overlay against the shared English realization unit58 (museum), itself already reviewed clean. Authored fully at schema_version 1.1 from the start -- every teaching card that has a realization example: (all six lesson01 vocabulary cards) got a matching example_gloss:. Sibling-isolation confirmed before authoring: checked docs/content/overlays/fa-en/, docs/content/overlays/nl-en/, and docs/content/overlays/prs-en/ for any existing unit58 file -- none existed for any direction at authoring time, so no sibling file was opened or consulted, per the standing strong-form isolation rule. Dari-specific dialect choices, chosen deliberately to avoid Iranian-Farsi-isms per AUTHORING_GUIDE.md #3: museum -> موزیم (the standard Afghan Dari borrowing, as opposed to Iranian Persian's موزه); ticket -> تکت (the standard Dari word for any purchased ticket -- bus, cinema, museum -- as opposed to Iranian Persian's بلیت); asked -> پرسان کرد (Dari's compound-verb construction, as opposed to Iranian Persian's plain پرسید); other vocabulary (نمایشگاه/exhibition, نقاشی/painting, مجسمه/sculpture, راهنما/guide) is shared between the two dialects and used as-is. Colloquial Dari verb endings/register used throughout (استه for است, می‌شه/می‌خواد for می‌شود/می‌خواهد, وخت for وقت, دم for 'at/near'), same register as unit34/unit33's precedent files. Deliberately avoided the دادن-verb present-tense colloquial contraction (می‌ته, e.g. ترجیح می‌ته) that a1_unit34's own review notes flagged as unverified against a real Dari source -- this unit's content never needed a present-tense دادن construction, so the uncertain form was sidestepped entirely rather than reused unreviewed. Two genuine Dari-speaker English interference points surfaced naturally in the teaching notes rather than forced: (1) English's do-support question structure (What time does the museum open/close?) has no article/particle equivalent in Dari, which forms the same question with a simple verb-final structure and no auxiliary; (2) Is there ...? as a fixed existential-question frame doesn't map onto a single Dari word, since Dari expresses existence with استه itself rather than a dedicated 'there is' construction. Multi-clause accepted_answers (lesson04's write_own_museum_message) carries the period-joined, comma-joined, and conjunction-joined English variants per AUTHORING_GUIDE.md #12, matching the realization's own three variants exactly. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit58.museum: {title: "بازدید از موزیم"}

lessons:
  en.a1.unit58.lesson01.museum_vocabulary: {title: "کلمات موزیم"}
  en.a1.unit58.lesson02.phrases_for_the_museum: {title: "عبارات برای موزیم"}
  en.a1.unit58.lesson03.dialogue_at_the_museum: {title: "گفتگو: توی موزیم"}
  en.a1.unit58.lesson04.an_afternoon_at_the_museum: {title: "متن: یک بعد از ظهر توی موزیم"}

teaching:
  en.a1.unit58.lesson01.teach.museum: {title: "museum", gloss: "موزیم", note: "museum یعنی موزیم -- یک ساختمان که توی آن اشیای تاریخی، هنری یا علمی به نمایش گذاشته می‌شه. در دری بیشتر «موزیم» گفته می‌شه، نی «موزه» که در فارسی ایران رایج استه.", example_gloss: "این موزیم خیلی قدیمی استه."}
  en.a1.unit58.lesson01.teach.ticket: {title: "ticket", gloss: "تکت", note: "ticket یعنی تکت -- در دری برای تکت بس، سینما یا موزیم از کلمهٔ «تکت» کار گرفته می‌شه، نی «بلیت» که در فارسی ایران رایج استه.", example_gloss: "به یک تکت ضرورت دارم، لطفاً."}
  en.a1.unit58.lesson01.teach.exhibition: {title: "exhibition", gloss: "نمایشگاه", note: "exhibition یعنی نمایشگاه -- مجموعه‌ای از آثار هنری یا اشیا که برای دیدن مردم به نمایش گذاشته شده.", example_gloss: "یک نمایشگاه جدید استه."}
  en.a1.unit58.lesson01.teach.painting: {title: "painting", gloss: "نقاشی", note: "painting یعنی نقاشی -- یک تصویر که با رنگ کشیده شده.", example_gloss: "این نقاشی را واقعاً خوش دارم."}
  en.a1.unit58.lesson01.teach.sculpture: {title: "sculpture", gloss: "مجسمه", note: "sculpture یعنی مجسمه -- یک اثر هنری که از سنگ، چوب یا فلز ساخته شده.", example_gloss: "این مجسمه هم خیلی قدیمی استه."}
  en.a1.unit58.lesson01.teach.guide: {title: "guide", gloss: "راهنما", note: "guide یعنی راهنما -- کسی که به بازدیدکننده‌ها موزیم را نشان می‌ته و در بارهٔ چیزها معلومات می‌ته.", example_gloss: "امروز راهنما استه؟"}

  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open: {title: "What time does the museum open?", gloss: "موزیم ساعت چند باز می‌شه؟", note: "این سوال با what time شروع می‌شه و بعدش فعل کمکی does می‌آیه چون فعل اصلی open استه -- ساختار سوالی مثل بقیهٔ سوال‌های do-support. دری برای این نوع سوال به یک فعل کمکی جداگانه ضرورت نداره."}
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close: {title: "What time does the museum close?", gloss: "موزیم ساعت چند بسته می‌شه؟", note: "همو ساختار سوالی، خو با فعل close به‌عوض open."}
  en.a1.unit58.lesson02.teach.two_tickets_please: {title: "Two tickets, please.", gloss: "دو تکت، لطفاً.", note: "please در آخر جمله برای مؤدبانه گفتن یک خواهش کار می‌ره."}
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition: {title: "Is there a guide for the exhibition?", gloss: "آیا برای این نمایشگاه راهنما استه؟", note: "Is there ...? یعنی «آیا ... استه؟» -- برای پرسیدن در بارهٔ موجود بودن یک چیز کار می‌ره. دری این معنا را مستقیم با خودِ استه می‌رساند، بدون یک ساختار جداگانهٔ «there is»."}
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day: {title: "The museum is open every day.", gloss: "موزیم هر روز باز استه.", note: "every day یعنی هر روز."}
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings: {title: "I really enjoyed the paintings!", gloss: "من واقعاً از نقاشی‌ها خوشم آمد!", note: "enjoyed یعنی از یک چیز لذت بردن -- شکل ماضی فعل enjoy."}

  en.a1.unit58.lesson03.teach.dialogue_line1: {title: "سوال دنیل", gloss: "دنیل سلام می‌ته و می‌پرسه موزیم ساعت چند بسته می‌شه.", note: "Hi یک سلام غیررسمی استه، مناسب برای گپ‌زدن با دوستان."}
  en.a1.unit58.lesson03.teach.dialogue_line2: {title: "جواب کلرک", gloss: "کلرک می‌گه ساعت پنج بسته می‌کنن.", note: "at five o'clock یعنی ساعت پنج -- حرف اضافهٔ at پیش از وخت مشخص می‌آیه."}
  en.a1.unit58.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا خوشحال می‌شه و می‌پرسه می‌تانن دو تکت بگیرن.", note: "Can we have ...? یک طریقهٔ مؤدبانه برای خواستن یک چیز استه."}
  en.a1.unit58.lesson03.teach.dialogue_line4: {title: "جواب کلرک", gloss: "کلرک می‌گه بلی و می‌گه قیمتش دوازده دالر استه.", note: "Of course یعنی البته -- یک طریقهٔ مؤدبانه برای گفتن بلی."}
  en.a1.unit58.lesson03.teach.dialogue_line5: {title: "سوال دنیل", gloss: "دنیل می‌پرسه آیا برای این نمایشگاه راهنما استه.", note: "Is there ...? دوباره همو ساختار سوالی وجودی استه."}
  en.a1.unit58.lesson03.teach.dialogue_line6: {title: "جواب کلرک", gloss: "کلرک می‌گه بلی، نزدیک دروازهٔ ورودی یک راهنما استه.", note: "there's یعنی «there is» کوتاه شده -- near the entrance یعنی نزدیک دروازهٔ ورودی."}
  en.a1.unit58.lesson03.teach.dialogue_line7: {title: "سوال میا", gloss: "میا می‌پرسه نام نمایشگاه چیست.", note: "What is ... called? یک طریقهٔ معمول برای پرسیدن نام یک چیز استه."}
  en.a1.unit58.lesson03.teach.dialogue_line8: {title: "جواب کلرک", gloss: "کلرک می‌گه نامش «رنگ‌های شهر» استه.", note: "It's called ... یعنی «نامش ... استه» -- برای گفتن نام یک چیز کار می‌ره."}
  en.a1.unit58.lesson03.teach.dialogue_line9: {title: "جواب دنیل", gloss: "دنیل تشکر می‌کنه و می‌گه بی‌صبرانه منتظر دیدن نقاشی‌ها استه.", note: "can't wait to ... یک عبارت محاوره‌ای برای نشان دادن هیجان و اشتیاق زیاد استه."}

  en.a1.unit58.lesson04.teach.museum_notice: {title: "اعلانیهٔ موزیم", gloss: "موزیم شهر: هر روز باز استه، از ساعت ۹:۰۰ الی ۵:۰۰. تکت بزرگسال: ۶ دالر. نمایشگاه فعلی: رنگ‌های شهر، اتاق ۲.", note: "این یک اعلانیهٔ موزیم استه -- معلومات کوتاه در بارهٔ ساعت کار، قیمت تکت و نمایشگاه فعلی را به شکل خلاصه نشان می‌ته."}
  en.a1.unit58.lesson04.teach.reading_passage: {title: "متن: بازدید از موزیم", gloss: "یک بازدید از موزیم: یک بعد از ظهر شنبه، دنیل و میا تصمیم گرفتن که باهم به موزیم شهر بروند. دم دروازهٔ ورودی، کلرک به‌شان گفت که موزیم ساعت پنج بسته می‌شه. آن‌ها دو تکت به قیمت دوازده دالر خریدن. میا در بارهٔ راهنما پرسان کرد، و کلرک گفت که یکی نزدیک دروازهٔ ورودی استه. آن‌ها از نمایشگاه، رنگ‌های شهر، دیدن کردن و مقدار زیاد نقاشی‌های قشنگ را توی اتاق ۲ دیدن. دنیل از یک نقاشی از میدان کهنهٔ شهر خوشش آمد، و میا از یک نقاشی از دریا در وخت غروب آفتاب خوشش آمد. وقتی که رفتن، میا گفت که دفعهٔ بعد می‌خواد از نمایشگاه مجسمه‌ها دیدن کنه.", note: "این متن گذشتهٔ سادهٔ افعال منظم و نامنظم را با هم کار می‌گیره -- decided, told, bought, asked, said, visited, saw, liked, left."}

exercises:
  en.a1.unit58.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "ticket"
    distractors: ["museum", "exhibition", "painting", "guide"]
    accepted_answers: [{value: "ticket", status: "correct"}]
    feedback: "ticket یعنی تکت."
  en.a1.unit58.lesson01.exercise02.choose_sculpture_meaning:
    instruction: "کدام کلمه یعنی یک مجسمه که از سنگ، چوب یا فلز ساخته شده؟"
    correct_option: "sculpture"
    distractors: ["painting", "exhibition", "guide"]
    accepted_answers: [{value: "sculpture", status: "correct"}]
    feedback: "sculpture یعنی مجسمه."
  en.a1.unit58.lesson01.exercise03.match_museum_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "a building where you can see art and historical objects", "right": "museum"}, {"left": "the card or paper you buy to enter", "right": "ticket"}, {"left": "a collection of art or objects on display", "right": "exhibition"}, {"left": "a picture made with paint", "right": "painting"}, {"left": "a statue made of stone, wood, or metal", "right": "sculpture"}, {"left": "a person who shows visitors around and explains things", "right": "guide"}], "status": "correct"}]
    feedback: "museum=موزیم، ticket=تکت، exhibition=نمایشگاه، painting=نقاشی، sculpture=مجسمه، guide=راهنما."
  en.a1.unit58.lesson01.exercise04.order_museum_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "museum", "is", "very", "old."], status: "correct"}]
    feedback: "ترتیب درست: This museum is very old."
  en.a1.unit58.lesson01.exercise05.write_guide:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که بازدیدکننده‌ها را توی موزیم می‌گرداند."
    accepted_answers: [{value: "guide", status: "correct"}]
    feedback: "guide یعنی راهنما."

  en.a1.unit58.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "What time does the museum close?"
    distractors: ["What time does the museum open?", "Two tickets, please.", "Is there a guide for the exhibition?"]
    accepted_answers: [{value: "What time does the museum close?", status: "correct"}]
    feedback: "What time does the museum close? یعنی موزیم ساعت چند بسته می‌شه؟"
  en.a1.unit58.lesson02.exercise02.choose_opening_time_question:
    instruction: "کدام عبارت را یک بازدیدکننده می‌گه تا بپرسه موزیم کی باز می‌شه؟"
    correct_option: "What time does the museum open?"
    distractors: ["What time does the museum close?", "Two tickets, please.", "The museum is open every day."]
    accepted_answers: [{value: "What time does the museum open?", status: "correct"}]
    feedback: "What time does the museum open? یعنی موزیم ساعت چند باز می‌شه؟"
  en.a1.unit58.lesson02.exercise03.choose_enjoyed_meaning:
    instruction: "کدام عبارت را کسی بعد از خوش آمدنش از نقاشی‌ها می‌گه؟"
    correct_option: "I really enjoyed the paintings!"
    distractors: ["Two tickets, please.", "Is there a guide for the exhibition?", "What time does the museum close?"]
    accepted_answers: [{value: "I really enjoyed the paintings!", status: "correct"}]
    feedback: "I really enjoyed the paintings! یعنی من واقعاً از نقاشی‌ها خوشم آمد!"
  en.a1.unit58.lesson02.exercise04.order_open_every_day_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "museum", "is", "open", "every", "day."], status: "correct"}]
    feedback: "ترتیب درست: The museum is open every day."
  en.a1.unit58.lesson02.exercise05.translate_two_tickets_please:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «دو تکت، لطفاً.»"
    accepted_answers:
      - {value: "Two tickets, please.", status: "correct"}
      - {value: "Two tickets, please", status: "correct"}
    feedback: "Two tickets, please. یعنی دو تکت، لطفاً."

  en.a1.unit58.lesson03.exercise01.comprehension_ticket_count:
    instruction: "مطابق گپ، دنیل و میا چند تکت خریدن؟"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: "correct"}]
    feedback: "دنیل و میا دو تکت خریدن."
  en.a1.unit58.lesson03.exercise02.comprehension_closing_time:
    instruction: "مطابق گپ، موزیم ساعت چند بسته می‌شه؟"
    correct_option: "five o'clock"
    distractors: ["four o'clock", "six o'clock", "nine o'clock"]
    accepted_answers: [{value: "five o'clock", status: "correct"}]
    feedback: "کلرک می‌گه ساعت پنج بسته می‌کنن."
  en.a1.unit58.lesson03.exercise03.listen_dialogue_exhibition_name:
    instruction: "مطابق گپ، نام نمایشگاه چیست؟"
    correct_option: "Colors of the City"
    distractors: ["City Museum", "Room 2", "The paintings"]
    accepted_answers: [{value: "Colors of the City", status: "correct"}]
    feedback: "نام نمایشگاه «رنگ‌های شهر» (Colors of the City) استه."
  en.a1.unit58.lesson03.exercise04.respond_own_museum_statement:
    instruction: "بگین موزیم ساعت چند بسته می‌شه، تکت‌ها چند دالر استه، یا نام نمایشگاه چیست."
    accepted_answers: ["We close at five o'clock", "We close at five o'clock.", "That's twelve dollars", "That's twelve dollars.", "There's a guide near the entrance", "There's a guide near the entrance.", "It's called Colors of the City", "It's called Colors of the City."]
    feedback: "می‌تانین یکی از جواب‌های کلرک در گفتگو را تکرار کنین -- مثلاً We close at five o'clock یا That's twelve dollars."

  en.a1.unit58.lesson04.exercise01.notice_closing_time:
    instruction: "مطابق اعلانیه، موزیم ساعت چند بسته می‌شه؟"
    correct_option: "5:00"
    distractors: ["9:00", "6:00", "4:00"]
    accepted_answers: [{value: "5:00", status: "correct"}]
    feedback: "اعلانیه می‌گه موزیم از ساعت ۹:۰۰ الی ۵:۰۰ باز استه."
  en.a1.unit58.lesson04.exercise02.notice_ticket_price:
    instruction: "مطابق اعلانیه، تکت بزرگسال چند دالر استه؟"
    correct_option: "$6"
    distractors: ["$9", "$12", "$2"]
    accepted_answers: [{value: "$6", status: "correct"}]
    feedback: "اعلانیه می‌گه تکت بزرگسال ۶ دالر استه."
  en.a1.unit58.lesson04.exercise03.notice_exhibition_room:
    instruction: "مطابق اعلانیه، نمایشگاه فعلی توی کدام اتاق استه؟"
    correct_option: "Room 2"
    distractors: ["Room 1", "Room 3", "Room 5"]
    accepted_answers: [{value: "Room 2", status: "correct"}]
    feedback: "اعلانیه می‌گه نمایشگاه فعلی توی اتاق ۲ استه."
  en.a1.unit58.lesson04.exercise04.reading_ticket_count:
    instruction: "مطابق متن، دنیل و میا چند تکت خریدن؟"
    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: "correct"}]
    feedback: "متن می‌گه آن‌ها دو تکت خریدن."
  en.a1.unit58.lesson04.exercise05.write_own_museum_message:
    instruction: "یک پیام کوتاه بنویسین: بگین کدام نمایشگاه را دیدن، و بگین تکت‌ها چند دالر بود."
    accepted_answers:
      - {value: "They saw Colors of the City. That's twelve dollars.", status: "correct"}
      - {value: "They saw Colors of the City, and that's twelve dollars.", status: "correct"}
      - {value: "They saw Colors of the City and that's twelve dollars.", status: "correct"}
    feedback: "می‌تانین بگین: They saw Colors of the City. That's twelve dollars."
