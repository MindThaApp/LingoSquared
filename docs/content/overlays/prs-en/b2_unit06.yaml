  en.b2.unit06.lesson02.exercise01_choose_qualified:
    instruction: "کدام جمله دربارهٔ دو ارزش یک نظر محدود و پخته می‌ته؟"
    correct_option: "In principle, convenience matters, but fairness should carry more weight."
    distractors: ["I am not arguing for silence everywhere.", "That is fair, and I agree businesses need flexibility.", "Fairness is always the only value."]
    accepted_answers: [{value: "In principle, convenience matters, but fairness should carry more weight.", status: "correct"}]
