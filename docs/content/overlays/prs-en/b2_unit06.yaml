course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح B2 برای بحث دربارهٔ ارزش‌ها و فکرهای انتزاعی، با توضیحاتی که به دری آشناست."

units:
  en.b2.unit06.abstraction: {title: "انصاف باید وزن بیشتر داشته باشه"}

lessons:
  en.b2.unit06.lesson01.abstract_values: {title: "ارزش‌ها و محدود ساختن ادعا"}
  en.b2.unit06.lesson02.qualified_opinions: {title: "In principle، اما..."}
  en.b2.unit06.lesson03.reading_public_spaces: {title: "متن خوانی: فضاهای عمومی آرام"}
  en.b2.unit06.lesson04.the_abstract_dialogue: {title: "ارزشی که اولویت می‌تین"}

teaching:
  en.b2.unit06.lesson01.teach.value: {title: "value", gloss: "ارزش یا اصل مهم", note: "*value* در بحث انتزاعی یعنی چیزی که مردم مهم می‌دانن، مثل fairness یا convenience. اینجا معنی قیمت نیست.", example_gloss: "انصاف یک ارزش استه."}
  en.b2.unit06.lesson01.teach.fairness: {title: "fairness", gloss: "انصاف، برخورد معقول با مردم", note: "*fairness* فقط «برابری عددی» نیست؛ یعنی تصمیم برای همه معقول و منصفانه باشه.", example_gloss: "انصاف یعنی با مردم معقول برخورد شه."}
  en.b2.unit06.lesson01.teach.convenience: {title: "convenience", gloss: "آسانی و عملی بودن", note: "*convenience* یعنی چیزی زندگی یا کار روزمره را آسان‌تر می‌سازه. در بحث، می‌تانه با fairness در تضاد بیایه.", example_gloss: "آسانی، زندگی روزمره را ساده‌تر می‌سازه."}
  en.b2.unit06.lesson01.teach.flexibility: {title: "flexibility", gloss: "انعطاف، قابلیت تغییر با شرایط", note: "*flexibility* در بحث کاری یا شهری یعنی قوانین بتانن با شرایط سازگار شن.", example_gloss: "انعطاف اجازه می‌ته وقتی شرایط تغییر می‌کنه، روش هم تغییر کنه."}
  en.b2.unit06.lesson01.teach.qualify: {title: "qualify", gloss: "ادعا را محدود یا شرط‌دار ساختن", note: "*qualify* یعنی نگین گپ تان همیشه و بی‌قید درست استه؛ حد و شرطش را بگین.", example_gloss: "می‌تانین یک نظر را با محدود ساختنش پخته‌تر بسازین."}
  en.b2.unit06.lesson01.teach.prioritize: {title: "prioritize", gloss: "اولویت دادن، مهم‌تر حساب کدن", note: "*prioritize* یعنی یک ارزش را نسبت به ارزش دیگر مهم‌تر بگیرین. در انگلیسی معمولاً می‌گین *prioritize fairness*.", example_gloss: "اولویت دادن به انصاف یعنی آن را مهم‌تر حساب کدن."}

  en.b2.unit06.lesson02.teach.in_principle: {title: "In principle, convenience matters, but fairness should carry more weight.", gloss: "در اصل، آسانی مهم استه، اما انصاف باید وزن بیشتر داشته باشه.", note: "*In principle* قبول کلی می‌سازه؛ *but fairness should carry more weight* نشان می‌ته کدام ارزش مهم‌تر استه.", media_asset_key: "en.b2.audio.abstraction.sentence.01"}
  en.b2.unit06.lesson02.teach.not_arguing_everywhere: {title: "I am not arguing for silence everywhere.", gloss: "مه طرفدار سکوت در همه‌جا نیستم.", note: "این جمله ادعا را محدود می‌سازه. در دری شاید با «نه این‌که...» بگیم؛ در انگلیسی *I am not arguing for...* طبیعی استه."}
  en.b2.unit06.lesson02.teach.respond_opposing: {title: "That is fair, and I agree businesses need flexibility.", gloss: "این گپ منصفانه استه، و قبول دارم که کاروبارها انعطاف لازم دارن.", note: "اول نظر مقابل را جدی می‌گیره، بعد راه برای موقف خود باز می‌کنه."}
  en.b2.unit06.lesson02.teach.grammar_abstract_response: {title: "نظر انتزاعی قوی", gloss: "یک نظر انتزاعی قوی ارزش را نام می‌بره، ادعا را مطلق نمی‌سازه، و مستقیم به نظر مقابل جواب می‌ته. در انگلیسی فقط گفتن «من موافق نیستم» برای B2 کافی نیست.", note: "ارزش، حد ادعا، و جواب به طرف مقابل را جدا بسازین."}

  en.b2.unit06.lesson03.teach.transparent: {title: "transparent", gloss: "شفاف، قابل فهم برای همه", note: "*transparent* دربارهٔ قانون یعنی مردم بفهمن قانون چی استه و چرا وجود داره.", example_gloss: "قانون‌های شفاف آسان فهمیده می‌شن."}
  en.b2.unit06.lesson03.teach.commercial: {title: "commercial", gloss: "وابسته به کاروبار و فروش", note: "*commercial activity* یعنی فعالیتی که به تجارت و عاید مربوط استه.", example_gloss: "فعالیت تجارتی به کاروبار مربوط استه."}
  en.b2.unit06.lesson03.teach.reading_passage: {title: "متن دربارهٔ فضاهای عمومی آرام", gloss: "امارا استدلال می‌کنه که فضاهای عمومی آرام باید محافظت شن، حتی اگه این کار بعضی فعالیت‌های تجارتی را محدود کنه. نظر او مطلق نیست: او طرفدار سکوت در همه‌جا نیست، و قبول می‌کنه که کاروبارها کمی انعطاف لازم دارن. نظر مخالف لیو این استه که قوانین می‌تانن ادامهٔ کار کاروبارها را سخت‌تر بسازن. امارا مستقیم به همین نکته جواب می‌ته و می‌گه آسانی مهم استه، اما وقتی یک فضا مال همه استه، انصاف باید وزن بیشتر داشته باشه. موقف او محدود استه، چون از قانون‌های محدود و شفاف حمایت می‌کنه، نه محدودیت‌های بی‌حد.", note: "در متن ببینین کدام جمله موقف استه، کدام qualification، و کدام جواب مستقیم."}

  en.b2.unit06.lesson04.teach.q_protect_spaces: {title: "موقف امارا", gloss: "امارا می‌گه: فکر می‌کنم یک شهر باید فضاهای عمومی آرام را محافظت کنه، حتی اگه این کار بعضی فعالیت تجارتی را محدود کنه.", note: "او ارزش quiet public spaces را مطرح می‌کنه.", media_asset_key: "en.b2.audio.dialogue.abstraction.01"}
  en.b2.unit06.lesson04.teach.a_business_flexibility: {title: "نظر مخالف لیو", gloss: "لیو می‌گه: مه هم آرامی را ارزش می‌تم، اما کاروبارها برای ادامهٔ کار انعطاف لازم دارن.", note: "این مخالفت کامل نیست؛ او یک ارزش دیگر را وارد بحث می‌کنه."}
  en.b2.unit06.lesson04.teach.q_not_silence: {title: "جواب محدود امارا", gloss: "امارا می‌گه: این منصفانه استه، و مه طرفدار سکوت در همه‌جا نیستم. نکته‌ام این استه که فضاهای مشترک نباید فقط با سود شکل بگیرن.", note: "او اول قبول می‌کنه، بعد موقف خود را محدود و روشن می‌سازه."}
  en.b2.unit06.lesson04.teach.a_prioritizing: {title: "سوال دربارهٔ ارزش", gloss: "لیو می‌پرسه: پس ارزشی که اولویت می‌تی انصاف استه، نه فقط راحتی؟", note: "*prioritizing* یعنی کدام ارزش را بالاتر می‌برین."}
  en.b2.unit06.lesson04.teach.q_fairness_weight: {title: "وزن دادن به انصاف", gloss: "امارا می‌گه: دقیقاً. در اصل، آسانی مهم استه، اما وقتی یک فضا مال همه استه، انصاف باید وزن بیشتر داشته باشه.", note: "*carry more weight* یعنی در تصمیم‌گیری مهم‌تر حساب شه."}
  en.b2.unit06.lesson04.teach.a_accept_rules: {title: "پذیرش مشروط لیو", gloss: "لیو می‌گه: می‌تانم این را قبول کنم اگه قانون‌ها محدود و شفاف باشن.", note: "او هم قبول خود را شرط‌دار می‌سازه."}

