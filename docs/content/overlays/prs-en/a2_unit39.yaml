course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit39.after_the_interview: {title: "پیگیری بعد از مصاحبهٔ کاری"}

lessons:
  en.a2.unit39.lesson01.offer_vocabulary: {title: "پیشنهاد، قرارداد، و تاریخ شروع"}
  en.a2.unit39.lesson02.following_up: {title: "پیگیری کردن و قبول کردن پیشنهاد"}
  en.a2.unit39.lesson03.reading_an_offer_message: {title: "خواندن یک پیشنهاد کاری"}
  en.a2.unit39.lesson04.offer_call_dialogue: {title: "تیلفون همرای پیشنهاد کاری"}

teaching:
  en.a2.unit39.lesson01.teach.offer: {title: "offer", gloss: "پیشنهاد", note: "*offer* اینجه یعنی پیشنهاد یک وظیفه؛ به حیث فعل *to offer* یعنی پیشنهاد کردن.", example_gloss: "از شرکت برایت پث مارکیتنگ یک پیشنهاد کاری گرفتم."}
  en.a2.unit39.lesson01.teach.contract: {title: "contract", gloss: "قرارداد", note: "*contract* یعنی توافق نوشتنی بین شما و شرکت.", example_gloss: "قرارداد برای یک سال استه."}
  en.a2.unit39.lesson01.teach.salary: {title: "salary", gloss: "معاش", note: "*salary* یعنی پولی که هر ماه برای کارتان می‌گیرین.", example_gloss: "هفتهٔ آینده می‌تانیم دربارهٔ معاش گپ بزنیم."}
  en.a2.unit39.lesson01.teach.accept: {title: "accept", gloss: "قبول کردن", note: "*accept* یعنی به چیزی که برای‌تان پیشنهاد شده بلی گفتن.", example_gloss: "می‌خواهم همی وظیفه را قبول کنم."}
  en.a2.unit39.lesson01.teach.start_date: {title: "start date", gloss: "تاریخ شروع", note: "*start date* یعنی اولین روز وظیفهٔ نوی‌تان.", example_gloss: "تاریخ شروع، اولین دوشنبهٔ ماه استه."}
  en.a2.unit39.lesson01.teach.reply: {title: "reply", gloss: "جواب", note: "*reply* هم جواب یک پیام استه و هم فعل جواب دادن.", example_gloss: "همو روز یک جواب روان کردم."}
  en.a2.unit39.lesson01.teach.grammar_would_like_to: {title: "would like to برای یک خواست مؤدبانه", gloss: "می‌خواهم پیشنهاد را قبول کنم. می‌خواهم روز دوشنبه شروع کنم.", note: "*I would like to...* مؤدبانه‌تر از *I want to...* استه و به گپ‌های کاری می‌خوره."}

  en.a2.unit39.lesson02.teach.thank_you_for_the_interview: {title: "شروع کردن پیام‌تان", gloss: "از مصاحبهٔ دیروز بسیار تشکر.", note: "*Thank you for...* شکل معمول شروع یک پیام تشکر کاری استه."}
  en.a2.unit39.lesson02.teach.still_interested: {title: "گفتن اینکه هنوز علاقه دارین", gloss: "هنوز هم به همی وظیفه بسیار علاقه‌مند استم.", note: "*still* یعنی هنوز هم؛ پیش از صفت می‌آیه."}
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date: {title: "مؤدبانه پرسیدن تاریخ شروع", gloss: "تاریخ شروع را برایم گفته می‌تانین؟", note: "*Could you tell me...?* یک سوال غیرمستقیم استه: مؤدبانه‌تر از *When is the start date?*"}
  en.a2.unit39.lesson02.teach.would_like_to_accept: {title: "قبول کردن پیشنهاد", gloss: "می‌خواهم پیشنهاد را قبول کنم.", note: "همی جملهٔ معیاری قبول کردن یک وظیفه استه."}
  en.a2.unit39.lesson02.teach.grammar_indirect_questions: {title: "سوال‌های غیرمستقیم همرای Could you tell me", gloss: "تاریخ شروع را برایم گفته می‌تانین؟ دربارهٔ ساعت‌های کاری برایم گفته می‌تانین؟", note: "بعد از *Could you tell me* دیگه ترتیب سوالی نمی‌آیه -- می‌گین *the start date*، نی *what is the start date*."}

  en.a2.unit39.lesson03.teach.full_time: {title: "full time", gloss: "تمام‌وقت", note: "*full time* یعنی یک هفتهٔ کاری کامل؛ برعکسش *part time* استه.", example_gloss: "همی وظیفه تمام‌وقت استه، نی دو روز در هفته."}
  en.a2.unit39.lesson03.teach.offer_message: {title: "متن پیشنهاد کاری", gloss: "محترمه میا، از آمدن‌تان در روز سه‌شنبه تشکر. می‌خواهیم وظیفهٔ هماهنگ‌کنندهٔ مارکیتنگ را برای‌تان پیشنهاد کنیم. قرارداد تمام‌وقت استه و تاریخ شروع روز دوشنبه استه. لطفاً تا روز جمعه جواب بتین. برایت پث مارکیتنگ.", note: "یک پیشنهاد کاری همیشه چهار چیز را می‌گه: وظیفه، نوع قرارداد، تاریخ شروع، و تاریخی که باید جواب بتین."}
  en.a2.unit39.lesson03.teach.please_reply_by_friday: {title: "مهلت جواب دادن", gloss: "لطفاً تا روز جمعه جواب بتین.", note: "*by Friday* یعنی حداکثر تا جمعه، پس خود جمعه هم قبول استه."}

  en.a2.unit39.lesson04.teach.q_calling_about_interview: {title: "مصاحبه‌کننده به میا زنگ می‌زنه", gloss: "مصاحبه‌کننده می‌گه: سلام میا، دربارهٔ مصاحبهٔ روز سه‌شنبه زنگ زدم.", note: "*I am calling about...* شکل معیاری شروع یک تیلفون کاری استه."}
  en.a2.unit39.lesson04.teach.a_still_interested: {title: "میا می‌گه هنوز علاقه داره", gloss: "میا می‌گه: از زنگ‌تان تشکر. هنوز هم به همی وظیفه بسیار علاقه‌مند استم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit39.lesson04.teach.q_offer_you_the_job: {title: "مصاحبه‌کننده وظیفه را پیشنهاد می‌کنه", gloss: "مصاحبه‌کننده می‌گه: خوب، چون می‌خواهیم همی وظیفه را برای‌تان پیشنهاد کنیم.", note: "*because* اینجه جواب او را به خبر خوشی که می‌آیه وصل می‌کنه."}
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date: {title: "میا جواب می‌ته و تاریخ شروع را می‌پرسه", gloss: "میا می‌گه: چه خبر خوش. تاریخ شروع را برایم گفته می‌تانین؟", note: "اول کوتاه به خبر جواب بتین، بعد سوال‌تان را بپرسین."}
  en.a2.unit39.lesson04.teach.q_start_date_and_contract: {title: "مصاحبه‌کننده تاریخ و قرارداد را می‌گه", gloss: "مصاحبه‌کننده می‌گه: تاریخ شروع روز دوشنبه استه و قرارداد تمام‌وقت استه.", note: "همو دو حقیقتی که در پیام درس سوم هم بود."}
  en.a2.unit39.lesson04.teach.a_ask_working_hours: {title: "میا دربارهٔ ساعت‌های کاری می‌پرسه", gloss: "میا می‌پرسه: دربارهٔ ساعت‌های کاری برایم گفته می‌تانین؟", note: "همو شکل سوال غیرمستقیم که برای تاریخ شروع استعمال شد."}
  en.a2.unit39.lesson04.teach.q_nine_to_five: {title: "مصاحبه‌کننده ساعت‌ها را می‌گه", gloss: "مصاحبه‌کننده می‌گه: از ساعت نُه تا پنج، همرای یک ساعت وقت نان چاشت.", note: "*from nine to five* شکل ثابت شرح دادن یک روز کاری استه."}
  en.a2.unit39.lesson04.teach.a_accept_the_offer: {title: "میا پیشنهاد را قبول می‌کنه", gloss: "میا می‌گه: تشکر. می‌خواهم پیشنهاد را قبول کنم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit39.lesson04.teach.q_send_the_contract: {title: "مصاحبه‌کننده گفتگو را ختم می‌کنه", gloss: "مصاحبه‌کننده می‌گه: عالی. قرارداد را امروز برای‌تان روان می‌کنیم.", note: "*Wonderful* یک جواب گرم و مثبت استه که در انگلیسی کاری هم معمول استه."}

