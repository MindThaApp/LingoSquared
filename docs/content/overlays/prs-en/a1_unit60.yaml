course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit60.invitations: {title: "دعوت کردن"}

lessons:
  en.a1.unit60.lesson01.invitation_words: {title: "کلمات دعوت"}
  en.a1.unit60.lesson02.invitation_phrases: {title: "عبارات دعوت"}
  en.a1.unit60.lesson03.dialogue_inviting_a_friend: {title: "گفت‌وگو: دعوت کردن یک دوست"}
  en.a1.unit60.lesson04.dinner_invitation: {title: "متن: دعوت به شام"}

teaching:
  en.a1.unit60.lesson01.teach.invitation: {title: "invitation", gloss: "دعوت", note: "invitation یعنی دعوت یا دعوت‌نامه؛ پیامی که از کسی می‌خواهد بیاید.", example_gloss: "تشکر بابت دعوت."}
  en.a1.unit60.lesson01.teach.party: {title: "party", gloss: "محفل", note: "party یعنی محفل دوستانه یا مهمانی.", example_gloss: "محفل روز شنبه استه."}
  en.a1.unit60.lesson01.teach.dinner: {title: "dinner", gloss: "شام", note: "dinner یعنی شام؛ غذای شب.", example_gloss: "به شام بیا."}
  en.a1.unit60.lesson01.teach.picnic: {title: "picnic", gloss: "پیک‌نیک", note: "picnic یعنی غذا خوردن بیرون از خانه، معمولاً در پارک یا فضای باز.", example_gloss: "می‌تانیم پیک‌نیک داشته باشیم."}
  en.a1.unit60.lesson01.teach.bring: {title: "bring", gloss: "آوردن", note: "bring یعنی چیزی را با خود آوردن.", example_gloss: "لطفاً یک نوشیدنی بیارین."}
  en.a1.unit60.lesson01.teach.free: {title: "free", gloss: "آزاد / مصروف نبودن", note: "free در دعوت یعنی مصروف نبودن و وقت داشتن.", example_gloss: "آزاد استین؟"}

  en.a1.unit60.lesson02.teach.are_you_free: {title: "Are you free on Saturday?", gloss: "روز شنبه آزاد استین؟", note: "on Saturday برای روز هفته کار می‌ره. در انگلیسی برای روزها معمولاً on می‌آیه."}
  en.a1.unit60.lesson02.teach.would_you_like_dinner: {title: "Would you like to come to dinner?", gloss: "دوست دارین برای شام بیایین؟", note: "Would you like to ...? یک راه مؤدبانه و نرم برای دعوت کردن استه."}
  en.a1.unit60.lesson02.teach.bring_a_drink: {title: "Please bring a drink.", gloss: "لطفاً یک نوشیدنی بیارین.", note: "bring در انگلیسی از دید میزبان هم کار می‌ره: چیزی را با خود به اینجا بیارین."}
  en.a1.unit60.lesson02.teach.i_can_come: {title: "I can come.", gloss: "می‌تانم بیایم.", note: "این یک جواب ساده برای قبول کردن دعوت استه."}
  en.a1.unit60.lesson02.teach.cant_come: {title: "Sorry, I can't come.", gloss: "معذرت، آمده نمی‌تانم.", note: "can't یعنی نمی‌تانم. این جمله دعوت را مؤدبانه رد می‌کنه."}
  en.a1.unit60.lesson02.teach.see_you_at_six: {title: "See you at six.", gloss: "ساعت شش می‌بینمتان.", note: "See you ... برای ختم گپ و تایید دیدار آینده کار می‌ره."}

  en.a1.unit60.lesson03.teach.dialogue_line1: {title: "دعوت لیلا", gloss: "سلام دنیل! روز شنبه آزاد استی؟", note: "لیلا اول وقت دنیل را می‌پرسه."}
  en.a1.unit60.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "بلی، آزاد استم.", note: "Yes, I am free جواب مثبت و واضح استه."}
  en.a1.unit60.lesson03.teach.dialogue_line3: {title: "سوال لیلا", gloss: "دوست داری برای شام بیایی؟", note: "این خودِ جملهٔ دعوت استه."}
  en.a1.unit60.lesson03.teach.dialogue_line4: {title: "قبولی دنیل", gloss: "بلی، خیلی خوش می‌شم.", note: "I'd love to یعنی با خوشی قبول می‌کنم."}
  en.a1.unit60.lesson03.teach.dialogue_line5: {title: "خواهش لیلا", gloss: "لطفاً یک نوشیدنی بیار.", note: "Please bring ... یک خواهش کوتاه و مؤدبانه استه."}
  en.a1.unit60.lesson03.teach.dialogue_line6: {title: "سوال دنیل", gloss: "البته. چه وقت؟", note: "What time? سوال کوتاه برای پرسیدن ساعت استه."}
  en.a1.unit60.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "ساعت شش می‌بینمت.", note: "at six یعنی ساعت شش."}
  en.a1.unit60.lesson03.teach.dialogue_line8: {title: "تشکر دنیل", gloss: "عالی. تشکر بابت دعوت.", note: "Thank you for the invitation یک جملهٔ مؤدبانه بعد از دعوت استه."}

  en.a1.unit60.lesson04.teach.invitation_message: {title: "پیام دعوت", gloss: "دعوت به شام: شنبه ساعت ۶:۰۰. لطفاً یک نوشیدنی بیارین. آدرس: ۱۸ پارک ستریت.", note: "این پیام کوتاه زمان، چیزی که باید بیارین، و آدرس را نشان می‌ته."}
  en.a1.unit60.lesson04.teach.reading_passage: {title: "متن: شام در خانهٔ لیلا", gloss: "شام در خانهٔ لیلا: لیلا دنیل را روز شنبه به شام دعوت کرد. از او خواست که یک نوشیدنی بیاره. دنیل گفت که می‌تانه بیایه. در دعوت نوشته بود که شام ساعت ۶:۰۰ در ۱۸ پارک ستریت استه. دنیل آدرس را در تیلفون خود نوشت. او می‌خواست به وقت برسد. لیلا خوشحال بود چون دوستش می‌تانست بیایه.", note: "این متن دعوت، قبول کردن، وقت و آدرس را در یک پیام ساده تمرین می‌کنه."}

exercises:
  en.a1.unit60.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "invitation"
    distractors: ["party", "dinner", "free"]
    accepted_answers: [{value: "invitation", status: "correct"}]
    feedback: "invitation یعنی دعوت."
  en.a1.unit60.lesson01.exercise02.choose_free_meaning:
    instruction: "کدام کلمه یعنی وقت داشتن و مصروف نبودن؟"
    correct_option: "free"
    distractors: ["bring", "party", "dinner"]
    accepted_answers: [{value: "free", status: "correct"}]
    feedback: "free در اینجا یعنی آزاد و مصروف نبودن."
  en.a1.unit60.lesson01.exercise03.match_invitation_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "invitation", right: "پیامی که از کسی می‌خواد بیایه"}
      - {left: "party", right: "محفل دوستانه با چند نفر"}
      - {left: "dinner", right: "غذای شام"}
      - {left: "picnic", right: "غذاخوردن در بیرون"}
      - {left: "bring", right: "آوردن چیزی با خود تان"}
      - {left: "free", right: "فارغ و نامصروف‌بودن"}
    accepted_answers:
      - value:
          - {left: "invitation", right: "پیامی که از کسی می‌خواد بیایه"}
          - {left: "party", right: "محفل دوستانه با چند نفر"}
          - {left: "dinner", right: "غذای شام"}
          - {left: "picnic", right: "غذاخوردن در بیرون"}
          - {left: "bring", right: "آوردن چیزی با خود تان"}
          - {left: "free", right: "فارغ و نامصروف‌بودن"}
        status: "correct"
    feedback: "invitation=دعوت، party=محفل، dinner=شام، picnic=پیک‌نیک، bring=آوردن، free=آزاد."
  en.a1.unit60.lesson01.exercise04.order_party_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "party", "is", "on", "Saturday."], status: "correct"}]
    feedback: "ترتیب درست: The party is on Saturday."
  en.a1.unit60.lesson01.exercise05.write_picnic:
    instruction: "کلمه‌ای را بنویسین که یعنی غذا خوردن بیرون از خانه."
    accepted_answers: [{value: "picnic", status: "correct"}]
    feedback: "picnic یعنی پیک‌نیک."

  en.a1.unit60.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "Would you like to come to dinner?"
    distractors: ["Are you free on Saturday?", "Please bring a drink.", "See you at six."]
    accepted_answers: [{value: "Would you like to come to dinner?", status: "correct"}]
    feedback: "Would you like to come to dinner? یعنی دوست دارین برای شام بیایین؟"
  en.a1.unit60.lesson02.exercise02.choose_invitation_question:
    instruction: "کدام عبارت کسی را به شام دعوت می‌کنه؟"
    correct_option: "Would you like to come to dinner?"
    distractors: ["Are you free on Saturday?", "Please bring a drink.", "See you at six."]
    accepted_answers: [{value: "Would you like to come to dinner?", status: "correct"}]
    feedback: "Would you like to come to dinner? جملهٔ دعوت استه."
  en.a1.unit60.lesson02.exercise03.choose_acceptance:
    instruction: "کدام عبارت یک دعوت را قبول می‌کنه؟"
    correct_option: "I can come."
    distractors: ["Sorry, I can't come.", "Please bring a drink.", "Are you free on Saturday?"]
    accepted_answers: [{value: "I can come.", status: "correct"}]
    feedback: "I can come. یعنی می‌تانم بیایم."
  en.a1.unit60.lesson02.exercise04.order_bring_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["Please", "bring", "a", "drink."], status: "correct"}]
    feedback: "ترتیب درست: Please bring a drink."
  en.a1.unit60.lesson02.exercise05.translate_see_you:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «ساعت شش می‌بینمتان.»"
    accepted_answers:
      - {value: "See you at six.", status: "correct"}
      - {value: "See you at six", status: "correct"}
      - {value: "See you at six o'clock.", status: "correct"}
      - {value: "See you at 6:00.", status: "correct"}
      - {value: "See you at 6.", status: "correct"}
      - {value: "I'll see you at six.", status: "correct"}
    feedback: "See you at six. یعنی ساعت شش می‌بینمتان."

  en.a1.unit60.lesson03.exercise01.comprehension_day:
    instruction: "مطابق گفتگو، لیلا کدام روز را نام می‌گیره؟"
    correct_option: "Saturday"
    distractors: ["Friday", "Sunday", "Monday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "لیلا روز شنبه (Saturday) را نام می‌گیره."
  en.a1.unit60.lesson03.exercise02.comprehension_time:
    instruction: "مطابق گفتگو، لیلا چه ساعت را می‌گه؟"
    correct_option: "six"
    distractors: ["four", "five", "seven"]
    accepted_answers: [{value: "six", status: "correct"}]
    feedback: "لیلا می‌گه ساعت شش."
  en.a1.unit60.lesson03.exercise03.listen_dialogue_invitation:
    instruction: "لیلا کدام دعوت را می‌گه؟"
    correct_option: "Would you like to come to dinner?"
    distractors: ["Would you like to come to the party?", "Would you like to have a picnic?", "Would you like to come on Saturday?"]
    accepted_answers: [{value: "Would you like to come to dinner?", status: "correct"}]
    feedback: "لیلا می‌گه: Would you like to come to dinner?"
  en.a1.unit60.lesson03.exercise04.respond_own_invitation:
    instruction: "کسی را دعوت کنین، دعوت را قبول کنین، یا بگین چی بیاره."
    accepted_answers: ["Would you like to come to dinner", "Would you like to come to dinner?", "I can come", "I can come.", "Please bring a drink", "Please bring a drink.", "Yes, I'd love to", "I'd love to", "I would love to", "Yes, I can come", "Would you like to come to dinner on Saturday"]
    feedback: "می‌تانین بگین Would you like to come to dinner? یا I can come."

  en.a1.unit60.lesson04.exercise01.message_day:
    instruction: "مطابق دعوت، شام کدام روز استه؟"
    correct_option: "Saturday"
    distractors: ["Friday", "Sunday", "Monday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "دعوت می‌گه شام روز شنبه استه."
  en.a1.unit60.lesson04.exercise02.message_time:
    instruction: "مطابق دعوت، شام ساعت چند استه؟"
    correct_option: "6:00"
    distractors: ["5:00", "7:00", "4:00"]
    accepted_answers: [{value: "6:00", status: "correct"}]
    feedback: "شام ساعت ۶:۰۰ استه."
  en.a1.unit60.lesson04.exercise03.message_address:
    instruction: "مطابق دعوت، آدرس چیست؟"
    correct_option: "18 Park Street"
    distractors: ["8 Park Street", "18 King Street", "20 Park Street"]
    accepted_answers: [{value: "18 Park Street", status: "correct"}]
    feedback: "آدرس 18 Park Street استه."
  en.a1.unit60.lesson04.exercise04.reading_what_to_bring:
    instruction: "مطابق متن، دنیل باید چی بیاره؟"
    correct_option: "a drink"
    distractors: ["a bag", "a card", "a ticket"]
    accepted_answers: [{value: "a drink", status: "correct"}]
    feedback: "لیلا از دنیل خواست یک نوشیدنی بیاره."
  en.a1.unit60.lesson04.exercise05.write_own_invitation_message:
    instruction: "یک پیام کوتاه بنویسین: بگین شام چه وقت استه، و بگین چی باید آورد."
    accepted_answers:
      - {value: "Dinner is at 6:00. Please bring a drink.", status: "correct"}
      - {value: "Dinner is at 6:00, and please bring a drink.", status: "correct"}
      - {value: "Dinner is at 6:00 and please bring a drink.", status: "correct"}
      - {value: "Dinner is at 6:00, please bring a drink.", status: "correct"}
      - {value: "Dinner is at six. Please bring a drink.", status: "correct"}
      - {value: "Dinner is at six, and please bring a drink.", status: "correct"}
      - {value: "Dinner is at six o'clock. Please bring a drink.", status: "correct"}
      - {value: "Dinner is at 6. Please bring a drink.", status: "correct"}
      - {value: "Dinner is at 6, and please bring a drink.", status: "correct"}
    feedback: "می‌تانین بگین: Dinner is at 6:00. Please bring a drink."
