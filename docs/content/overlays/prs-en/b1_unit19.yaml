    accepted_answers:
      - {value: "Workplace communication works best when messages are clear and short.", status: "correct"}
      - {value: "Workplace communication works best when messages are clear and short", status: "correct"}
      - {value: "Workplace communication works best when messages are short and clear.", status: "correct"}
      - {value: "Communication in the workplace works best when messages are clear and short.", status: "correct"}
      - {value: "Communication in the workplace works best when messages are short and clear.", status: "correct"}
    feedback: "*Workplace communication works best when messages are clear and short* یعنی ارتباطاتِ محلِ کار وقتی بهترین کار می‌کنه که پیام‌ها واضح و کوتاه باشن."

  en.b1.unit19.lesson04.exercise01.listen_in_short_budget_client:
    instruction: "گفتگو را گوش کنین و بگین میا به‌طور خلاصه دربارهٔ چی صحبت کد."
