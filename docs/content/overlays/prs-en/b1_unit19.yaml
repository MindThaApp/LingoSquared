      - {left: "in your own words", right: "با کلماتِ خودتان"}
    accepted_answers:
      - value:
          - {left: "main point", right: "نکتهٔ اصلی"}
          - {left: "detail", right: "جزئیات"}
          - {left: "in summary", right: "خلاصه اینکه"}
          - {left: "in short", right: "به‌طور خلاصه"}
          - {left: "in your own words", right: "با کلماتِ خودتان"}
