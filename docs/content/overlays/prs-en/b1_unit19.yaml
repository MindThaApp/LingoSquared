course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit19.summarizing: {title: "خلاصه اینکه، جلسه دربارهٔ..."}

lessons:
  en.b1.unit19.lesson01.summarizing_vocabulary: {title: "کلمات برای خلاصه کدن"}
  en.b1.unit19.lesson02.giving_a_summary: {title: "خلاصه اینکه، کمتر از بودجه هستیم"}
  en.b1.unit19.lesson03.reading_a_short_article: {title: "متن خوانی: خلاصه کدنِ یک مقالهٔ کوتاه"}
  en.b1.unit19.lesson04.the_briefing_dialogue: {title: "چی واقع شد؟"}

teaching:
  en.b1.unit19.lesson01.teach.main_point: {title: "main point", gloss: "نکتهٔ اصلی", note: "*main point* یعنی مهم‌ترین فکر در یک متن یا مکالمه.", example_gloss: "نکتهٔ اصلیِ جلسه بودجه بود.", media_asset_key: "en.b1.audio.summarizing.phrase.main_point.01"}
  en.b1.unit19.lesson01.teach.detail: {title: "detail", gloss: "جزئیات", note: "*detail* یعنی یک معلوماتِ اضافیِ کوچک که نکتهٔ اصلی را کمک می‌ته.", example_gloss: "میا یک جزئیاتِ کوچک دربارهٔ برنامه اضافه کد."}
  en.b1.unit19.lesson01.teach.in_summary: {title: "in summary", gloss: "خلاصه اینکه", note: "*in summary* یک خلاصهٔ کوتاه را در آخرِ یک توضیحِ طولانی معرفی می‌ته.", example_gloss: "خلاصه اینکه، پروژه ماهِ آینده تمام می‌شه."}
  en.b1.unit19.lesson01.teach.in_short: {title: "in short", gloss: "به‌طور خلاصه", note: "*in short* یک راهِ سریع و عادی برای رفتن مستقیم به اصل مطلب در مکالمه است.", example_gloss: "به‌طور خلاصه، تیم پلان را قبول کد."}
  en.b1.unit19.lesson01.teach.in_your_own_words: {title: "in your own words", gloss: "با کلماتِ خودتان", note: "*in your own words* از کسی می‌خواد که یک چیز را با کلماتِ متفاوت از اصلش توضیح بته، نه کاپی کدنِ عین همان.", example_gloss: "لطفاً پلان را با کلماتِ خودتان توضیح بتین."}

  en.b1.unit19.lesson02.teach.in_summary_budget_client: {title: "In summary, the meeting covered the budget and the new client.", gloss: "خلاصه اینکه، جلسه دربارهٔ بودجه و مشتریِ نو بود.", note: "*in summary* یک خلاصهٔ فشرده از اینکه جلسه دربارهٔ چی بود می‌ته.", media_asset_key: "en.b1.audio.summarizing.sentence.01"}
  en.b1.unit19.lesson02.teach.main_point_under_budget: {title: "The main point was that we are under budget this month.", gloss: "نکتهٔ اصلی اینه که این ماه کمتر از بودجه هستیم.", note: "*the main point was that...* برای برجسته کدنِ تک نکتهٔ اصلی، جدا از جزئیاتِ کوچک‌تر استفاده می‌شه."}
  en.b1.unit19.lesson02.teach.grammar_summary_structure: {title: "قاعدهٔ ساختارِ خلاصه", gloss: "خلاصه را با یک عبارت مثلِ *In summary* یا *In short* شروع کنین، بعد فقط نکته‌های اصلی را به ترتیب بتین، جمله را کوتاه نگه دارین. از *The main point was that...* برای برجسته کدنِ تک مهم‌ترین فکر استفاده کنین، جدا از هر جزئیاتِ کوچک‌تر.", note: "*in summary* و *the main point was that* دو کارِ متفاوت انجام می‌تن."}

  en.b1.unit19.lesson03.teach.condensed: {title: "condensed", gloss: "فشرده", note: "*condensed* یعنی کوتاه‌شده اما نکته‌های اصلی را نگه داشته.", example_gloss: "میا یک خلاصهٔ فشرده از جلسه به دانیال داد."}
  en.b1.unit19.lesson03.teach.original_article: {title: "original article", gloss: "مقالهٔ اصلی", note: "*original article* یعنی متنِ کاملِ اصلی، قبل از خلاصه شدن.", example_gloss: "خلاصهٔ لیلا نزدیک به مقالهٔ اصلی بود."}
  en.b1.unit19.lesson03.teach.reading_passage: {title: "متن دربارهٔ خلاصه کدنِ یک مقالهٔ کوتاه", gloss: "لیلا یک مقالهٔ طولانی دربارهٔ ارتباطاتِ محلِ کار برای کورسِ دیزاینش خواند. مقالهٔ اصلی مثال‌ها و معلوماتِ زمینه‌ایِ زیاد داشت، اما لیلا فقط نکته‌های اصلی را لازم داشت. با کلماتِ خودش، یک خلاصهٔ فشرده نوشت: ارتباطاتِ محلِ کار وقتی بهترین کار می‌کنه که پیام‌ها واضح و کوتاه باشن، و وقتی مردم به‌جایِ حدس زدن، پرسش کنن. او بیشترِ مثال‌ها را حذف کد، چون آن‌ها جزئیات بودن، نه نکته‌های اصلی. معلمش گفت که خلاصه فکرهای مهم را به ترتیبِ درست نگه داشته بود.", note: "همی متن *condensed*، *main point*، و *detail* را باهم استفاده می‌ته."}

  en.b1.unit19.lesson04.teach.q_missed_meeting: {title: "پرسش دانیال", gloss: "دانیال می‌گه: جلسه را از دست دادم. می‌تانین بگین چی واقع شد؟", note: "*can you tell me what happened* یک پرسشِ ساده برای شروعِ خلاصه است.", media_asset_key: "en.b1.audio.dialogue.summarizing.01"}
  en.b1.unit19.lesson04.teach.a_in_short_budget_client: {title: "جواب میا", gloss: "میا می‌گه: البته. به‌طور خلاصه، دربارهٔ بودجه و مشتریِ نو صحبت کدیم.", note: "*in short* یک خلاصهٔ سریع را معرفی می‌ته."}
  en.b1.unit19.lesson04.teach.q_main_point_budget: {title: "پرسش دانیال", gloss: "دانیال می‌گه: نکتهٔ اصلی دربارهٔ بودجه چی بود؟", note: "*what was the main point* پرسشی است که فقط نکتهٔ اصلی را می‌خواد."}
  en.b1.unit19.lesson04.teach.a_under_budget_this_month: {title: "جواب میا", gloss: "میا می‌گه: نکتهٔ اصلی اینه که این ماه کمتر از بودجه هستیم.", note: "*the main point was that* برجستهٔ تک نکتهٔ اصلی است."}
  en.b1.unit19.lesson04.teach.q_other_details: {title: "پرسش دانیال", gloss: "دانیال می‌گه: خوب است. کدام جزئیاتِ دیگه هم بود؟", note: "*any other details* پرسش دربارهٔ معلوماتِ اضافیِ کوچک است."}
  en.b1.unit19.lesson04.teach.a_client_meeting_moved: {title: "جواب میا", gloss: "میا می‌گه: فقط یک جزئیاتِ کوچک -- جلسهٔ مشتری به هفتهٔ آینده انتقال کد.", note: "*just one small detail* نشان می‌ته که همی یک نکتهٔ اصلی نیست."}
  en.b1.unit19.lesson04.teach.q_thanks_for_summary: {title: "جواب دانیال", gloss: "دانیال می‌گه: ممنون از خلاصه. خیلی مفید بود.", note: "*that's very helpful* یک تشکرِ ساده برای خلاصه است."}

exercises:
  en.b1.unit19.lesson01.exercise01.listen_main_point:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "main point"
    distractors: ["detail", "in short", "in summary"]
    accepted_answers: [{value: "main point", status: "correct"}]
    feedback: "*main point* یعنی نکتهٔ اصلی."
  en.b1.unit19.lesson01.exercise02.choose_detail:
    instruction: "کدام کلمه یعنی یک معلوماتِ اضافیِ کوچک، نه مهم‌ترین فکر؟"
    correct_option: "detail"
    distractors: ["main point", "in summary", "in your own words"]
    accepted_answers: [{value: "detail", status: "correct"}]
    feedback: "*detail* یعنی جزئیات."
  en.b1.unit19.lesson01.exercise03.choose_in_your_own_words:
    instruction: "کدام عبارت از کسی می‌خواد که یک چیز را با کلماتِ متفاوت از اصلش توضیح بته، نه با کاپی کدنِ عین همان؟"
    correct_option: "in your own words"
    distractors: ["main point", "detail", "in short"]
    accepted_answers: [{value: "in your own words", status: "correct"}]
    feedback: "*in your own words* یعنی با کلماتِ خودتان."
  en.b1.unit19.lesson01.exercise04.match_summary_words:
    instruction: "هر معنی را به کلمه یا عبارتِ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "the single most important idea in a passage or conversation", right: "main point"}
          - {left: "a small piece of extra information that supports the main point", right: "detail"}
          - {left: "introduces a condensed summary at the end of a longer explanation", right: "in summary"}
          - {left: "a quick, casual way to get straight to the point in conversation", right: "in short"}
          - {left: "asks for an explanation that does not copy the original wording", right: "in your own words"}
        status: "correct"
    feedback: "*main point*=نکتهٔ اصلی، *detail*=جزئیات، *in summary*=خلاصه اینکه، *in short*=به‌طور خلاصه، *in your own words*=با کلماتِ خودتان."
  en.b1.unit19.lesson01.exercise05.write_main_point:
    instruction: "عبارتی را که یعنی مهم‌ترین فکر در یک متن یا مکالمه، بنویسین."
    accepted_answers:
      - {value: "main point", status: "correct"}
      - {value: "Main point", status: "correct"}
    feedback: "*main point* یعنی نکتهٔ اصلی."

  en.b1.unit19.lesson02.exercise01.choose_in_summary_budget_client:
    instruction: "کدام جمله یک خلاصهٔ فشرده از اینکه جلسه دربارهٔ چی بود می‌ته؟"
    correct_option: "In summary, the meeting covered the budget and the new client."
    distractors: ["The main point was that we are under budget this month.", "I missed the meeting. Can you tell me what happened?", "Just one small detail -- the client meeting was moved to next week."]
    accepted_answers: [{value: "In summary, the meeting covered the budget and the new client.", status: "correct"}]
    feedback: "*In summary, the meeting covered the budget and the new client* یعنی خلاصه اینکه، جلسه دربارهٔ بودجه و مشتریِ نو بود."
  en.b1.unit19.lesson02.exercise02.choose_main_point_under_budget:
    instruction: "کدام جمله تک نکتهٔ اصلی را دربارهٔ بودجه، جدا از هر جزئیاتِ کوچک‌تر، بیان می‌ته؟"
    correct_option: "The main point was that we are under budget this month."
    distractors: ["In summary, the meeting covered the budget and the new client.", "Were there any other details?", "Thanks for the summary. That's very helpful."]
    accepted_answers: [{value: "The main point was that we are under budget this month.", status: "correct"}]
    feedback: "*The main point was that we are under budget this month* یعنی نکتهٔ اصلی اینه که این ماه کمتر از بودجه هستیم."
  en.b1.unit19.lesson02.exercise03.order_in_summary_budget_client:
    instruction: "کلمات را طوری تنظیم کنین که «خلاصه اینکه، جلسه دربارهٔ بودجه و مشتریِ نو بود» شود."
    accepted_answers: [{value: ["In", "summary", "the", "meeting", "covered", "the", "budget", "and", "the", "new", "client"], status: "correct"}]
    feedback: "ترتیب درست *In summary, the meeting covered the budget and the new client* است."
  en.b1.unit19.lesson02.exercise04.reply_summarize_meeting:
    instruction: "دانیال می‌گه: جلسه را از دست دادم. می‌تانین خلاصه اینکه چی واقع شد بگین؟"
    accepted_answers:
      - {value: "In summary, the meeting covered the budget and the new client.", status: "correct"}
      - {value: "In summary, the meeting covered the budget and the new client", status: "correct"}
    feedback: "*In summary, the meeting covered the budget and the new client* یعنی خلاصه اینکه، جلسه دربارهٔ بودجه و مشتریِ نو بود."
  en.b1.unit19.lesson02.exercise05.write_main_point_under_budget:
    instruction: "بنویسین که نکتهٔ اصلی اینه که این ماه کمتر از بودجه هستیم، با 'The main point was that' آغاز کنین."
    accepted_answers:
      - {value: "The main point was that we are under budget this month.", status: "correct"}
      - {value: "The main point was that we are under budget this month", status: "correct"}
    feedback: "*The main point was that we are under budget this month* یعنی نکتهٔ اصلی اینه که این ماه کمتر از بودجه هستیم."

  en.b1.unit19.lesson03.exercise01.comprehend_condensed_summary:
    instruction: "کدام نکته‌های اصلی را لیلا در خلاصهٔ فشرده‌اش نگه داشت؟"
    correct_option: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing"
    distractors: ["workplace communication works best when messages are long and detailed", "workplace communication should always happen in written form", "workplace communication is not important for design courses"]
    accepted_answers: [{value: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing", status: "correct"}]
    feedback: "متن می‌گه *workplace communication works best when messages are clear and short, and when people ask questions instead of guessing*."
  en.b1.unit19.lesson03.exercise02.comprehend_left_out_examples:
    instruction: "لیلا چی را از خلاصه‌اش حذف کد، چون آن‌ها جزئیات بودن نه نکته‌های اصلی؟"
    correct_option: "she left out most of the examples"
    distractors: ["she left out the main point about clear messages", "she left out the whole original article", "she left out her teacher's comments"]
    accepted_answers: [{value: "she left out most of the examples", status: "correct"}]
    feedback: "متن می‌گه *she left out most of the examples*."
  en.b1.unit19.lesson03.exercise03.recognize_condensed:
    instruction: "کدام کلمه یک خلاصه را توصیف می‌ته که کوتاه‌تر شده اما نکته‌های اصلی را نگه داشته؟"
    correct_option: "condensed"
    distractors: ["main point", "detail", "original article"]
    accepted_answers: [{value: "condensed", status: "correct"}]
    feedback: "*condensed* یعنی فشرده."
  en.b1.unit19.lesson03.exercise04.order_summary_kept_important_ideas:
    instruction: "کلمات را طوری تنظیم کنین که «خلاصه فکرهای مهم را به ترتیبِ درست نگه داشته بود» شود."
    accepted_answers: [{value: ["The", "summary", "kept", "the", "important", "ideas", "in", "the", "right", "order"], status: "correct"}]
    feedback: "ترتیب درست *The summary kept the important ideas in the right order* است."
  en.b1.unit19.lesson03.exercise05.write_summary_workplace_communication:
    instruction: "نکتهٔ اصلیِ خلاصهٔ لیلا را بنویسین: اینکه ارتباطاتِ محلِ کار وقتی بهترین کار می‌کنه که پیام‌ها واضح و کوتاه باشن."
    accepted_answers:
      - {value: "Workplace communication works best when messages are clear and short.", status: "correct"}
      - {value: "Workplace communication works best when messages are clear and short", status: "correct"}
    feedback: "*Workplace communication works best when messages are clear and short* یعنی ارتباطاتِ محلِ کار وقتی بهترین کار می‌کنه که پیام‌ها واضح و کوتاه باشن."

  en.b1.unit19.lesson04.exercise01.listen_in_short_budget_client:
    instruction: "گفتگو را گوش کنین و بگین میا به‌طور خلاصه دربارهٔ چی صحبت کد."
    correct_option: "In short, we talked about the budget and the new client."
    distractors: ["I missed the meeting. Can you tell me what happened?", "What was the main point about the budget?", "Good. Were there any other details?"]
    accepted_answers: [{value: "In short, we talked about the budget and the new client.", status: "correct"}]
    feedback: "میا می‌گه *In short, we talked about the budget and the new client*."
  en.b1.unit19.lesson04.exercise02.listen_under_budget_this_month:
    instruction: "گوش کنین و بگین میا نکتهٔ اصلی دربارهٔ بودجه چی می‌گه."
    correct_option: "we are under budget this month"
    distractors: ["Thanks for the summary. That's very helpful.", "I missed the meeting. Can you tell me what happened?", "What was the main point about the budget?"]
    accepted_answers: [{value: "we are under budget this month", status: "correct"}]
    feedback: "میا می‌گه *we are under budget this month*."
  en.b1.unit19.lesson04.exercise03.choose_client_meeting_moved:
    instruction: "میا کدام جزئیاتِ کوچک را دربارهٔ جلسهٔ مشتری می‌گه؟"
    correct_option: "the client meeting was moved to next week"
    distractors: ["the client meeting was canceled", "the client meeting was moved to tomorrow", "the client meeting already happened"]
    accepted_answers: [{value: "the client meeting was moved to next week", status: "correct"}]
    feedback: "میا می‌گه *the client meeting was moved to next week*."
  en.b1.unit19.lesson04.exercise04.order_other_details:
    instruction: "کلمات را طوری تنظیم کنین که «کدام جزئیاتِ دیگه هم بود؟» شود."
    accepted_answers: [{value: ["Were", "there", "any", "other", "details"], status: "correct"}]
    feedback: "ترتیب درست *Were there any other details* است."
  en.b1.unit19.lesson04.exercise05.reply_as_mia:
    instruction: "دانیال می‌گه: نکتهٔ اصلی دربارهٔ بودجه چی بود؟"
    accepted_answers:
      - {value: "The main point was that we are under budget this month.", status: "correct"}
      - {value: "The main point was that we are under budget this month", status: "correct"}
    feedback: "*The main point was that we are under budget this month* یعنی نکتهٔ اصلی اینه که این ماه کمتر از بودجه هستیم."
