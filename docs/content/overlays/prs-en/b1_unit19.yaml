  en.b1.unit19.lesson01.exercise05.write_main_point:
    instruction: "عبارتی را که یعنی مهم‌ترین فکر در یک متن یا مکالمه، بنویسین."
    accepted_answers:
      - {value: "main point", status: "correct"}
      - {value: "Main point", status: "correct"}
    feedback: "*main point* یعنی نکتهٔ اصلی."

  en.b1.unit19.lesson02.exercise01.choose_in_summary_budget_client:
    instruction: "کدام جمله یک خلاصهٔ فشرده از اینکه جلسه دربارهٔ چی بود می‌ته؟"
    correct_option: "In summary, the meeting covered the budget and the new client."
    distractors: ["The main point was that we are under budget this month.", "I missed the meeting. Can you tell me what happened?", "Just one small detail -- the client meeting was moved to next week."]
