    instruction: "دنیل می‌گه: نکتهٔ اصلی دربارهٔ بودجه چی بود؟ به نقش میا با *The main point was that* جواب بتین: مصرف ما این ماه کمتر از بودجه استه."
    accepted_answers:
      - {value: "The main point was that we are under budget this month.", status: "correct"}
      - {value: "The main point was that we are under budget this month", status: "correct"}
