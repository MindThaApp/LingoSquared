    instruction: "میا می‌گه: فقط یک جزئیاتِ کوچک -- جلسهٔ مشتری به هفتهٔ آینده انتقال کد."
    accepted_answers:
      - {value: "Thanks for the summary. That's very helpful.", status: "correct"}
