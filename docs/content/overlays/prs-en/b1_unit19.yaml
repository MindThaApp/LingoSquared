    accepted_answers: [{value: "she left out most of the examples", status: "correct"}]
    feedback: "متن می‌گه *she left out most of the examples*."
  en.b1.unit19.lesson03.exercise03.recognize_condensed:
    instruction: "کدام کلمه یک خلاصه را توصیف می‌کنه که کوتاه‌تر شده اما نکته‌های اصلی را نگه داشته؟"
