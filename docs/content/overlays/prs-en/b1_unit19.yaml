review: {status: "reviewed", reviewed_by: "claude_fresh_context_2026-10-19", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en B1/B2 pass, fresh context, PR #39/#40 checklist): 'under budget' as calque کمتر از بودجه استیم ('we are less than the budget') → مصرف ما کمتر از بودجه استه (6x). 'was moved' glossed active انتقال کد → انتقال داده شد. Iranian معلم → استاد (course uses استاد in u03); ممنون → تشکر. Plural جزئیات used as singular ('یک جزئیاتِ کوچک') → یک نکتهٔ کوچک. Light-verb errors معرفی/بیان/توصیف/استفاده می‌ته → می‌کنه (9x). Garbled reply_summarize_meeting instruction. Two listen items used Daniel's questions/thanks as distractors for Mia's statements -- replaced with same-shape statements. reply/speak cued. Order instructions → ترتیب کنین (3x)."}

course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit19.summarizing: {title: "خلاصه اینکه، جلسه دربارهٔ..."}

lessons:
  en.b1.unit19.lesson01.summarizing_vocabulary: {title: "کلمات برای خلاصه کدن"}
  en.b1.unit19.lesson02.giving_a_summary: {title: "خلاصه اینکه، مصرف ما کمتر از بودجه استه"}
  en.b1.unit19.lesson03.reading_a_short_article: {title: "متن خوانی: خلاصه کدنِ یک مقالهٔ کوتاه"}
  en.b1.unit19.lesson04.the_briefing_dialogue: {title: "چی واقع شد؟"}

teaching:
  en.b1.unit19.lesson01.teach.main_point: {title: "main point", gloss: "نکتهٔ اصلی", note: "*main point* یعنی مهم‌ترین فکر در یک متن یا مکالمه.", example_gloss: "نکتهٔ اصلیِ جلسه بودجه بود.", media_asset_key: "en.b1.audio.summarizing.phrase.main_point.01"}
  en.b1.unit19.lesson01.teach.detail: {title: "detail", gloss: "جزئیات، نکتهٔ فرعی", note: "*detail* یعنی یک معلوماتِ اضافیِ کوچک که نکتهٔ اصلی را کمک می‌ته.", example_gloss: "میا یک نکتهٔ کوچک دربارهٔ برنامه اضافه کد."}
  en.b1.unit19.lesson01.teach.in_summary: {title: "in summary", gloss: "خلاصه اینکه", note: "*in summary* یک خلاصهٔ کوتاه را در آخرِ یک توضیحِ طولانی معرفی می‌کنه.", example_gloss: "خلاصه اینکه، پروژه ماهِ آینده تمام می‌شه."}
  en.b1.unit19.lesson01.teach.in_short: {title: "in short", gloss: "به‌طور خلاصه", note: "*in short* یک راهِ سریع و عادی برای رفتن مستقیم به اصل مطلب در مکالمه استه.", example_gloss: "به‌طور خلاصه، تیم پلان را قبول کد."}
  en.b1.unit19.lesson01.teach.in_your_own_words: {title: "in your own words", gloss: "با کلماتِ خودتان", note: "*in your own words* از کسی می‌خواد که یک چیز را با کلماتِ متفاوت از اصلش توضیح بته، نه کاپی کدنِ عین همان.", example_gloss: "لطفاً پلان را با کلماتِ خودتان توضیح بتین."}

  en.b1.unit19.lesson02.teach.in_summary_budget_client: {title: "In summary, the meeting covered the budget and the new client.", gloss: "خلاصه اینکه، جلسه دربارهٔ بودجه و مشتریِ نو بود.", note: "*in summary* یک خلاصهٔ فشرده از اینکه جلسه دربارهٔ چی بود می‌ته.", media_asset_key: "en.b1.audio.summarizing.sentence.01"}
  en.b1.unit19.lesson02.teach.main_point_under_budget: {title: "The main point was that we are under budget this month.", gloss: "نکتهٔ اصلی این بود که مصرف ما این ماه کمتر از بودجه استه.", note: "*the main point was that...* برای برجسته کدنِ تک نکتهٔ اصلی، جدا از جزئیاتِ کوچک‌تر استفاده می‌شه."}
  en.b1.unit19.lesson02.teach.grammar_summary_structure: {title: "قاعدهٔ ساختارِ خلاصه", gloss: "خلاصه را با یک عبارت مثلِ *In summary* یا *In short* شروع کنین، بعد فقط نکته‌های اصلی را به ترتیب بتین، جمله را کوتاه نگه دارین. از *The main point was that...* برای برجسته کدنِ تک مهم‌ترین فکر استفاده کنین، جدا از هر جزئیاتِ کوچک‌تر.", note: "*in summary* و *the main point was that* دو کارِ متفاوت انجام می‌تن."}

  en.b1.unit19.lesson03.teach.condensed: {title: "condensed", gloss: "فشرده", note: "*condensed* یعنی کوتاه‌شده اما نکته‌های اصلی را نگه داشته.", example_gloss: "میا یک خلاصهٔ فشرده از جلسه به دنیل داد."}
  en.b1.unit19.lesson03.teach.original_article: {title: "original article", gloss: "مقالهٔ اصلی", note: "*original article* یعنی متنِ کاملِ اصلی، قبل از خلاصه شدن.", example_gloss: "خلاصهٔ لیلا نزدیک به مقالهٔ اصلی بود."}
  en.b1.unit19.lesson03.teach.reading_passage: {title: "متن دربارهٔ خلاصه کدنِ یک مقالهٔ کوتاه", gloss: "لیلا یک مقالهٔ طولانی دربارهٔ ارتباطاتِ محلِ کار برای کورسِ دیزاینش خواند. مقالهٔ اصلی مثال‌ها و معلوماتِ زمینه‌ایِ زیاد داشت، اما لیلا فقط نکته‌های اصلی را لازم داشت. با کلماتِ خودش، یک خلاصهٔ فشرده نوشت: ارتباطاتِ محلِ کار وقتی بهترین کار می‌کنه که پیام‌ها واضح و کوتاه باشن، و وقتی مردم به‌جایِ حدس زدن، سوال کنن. او بیشترِ مثال‌ها را حذف کد، چون آن‌ها جزئیات بودن، نه نکته‌های اصلی. استادش گفت که خلاصه فکرهای مهم را به ترتیبِ درست نگه داشته بود.", note: "همی متن *condensed*، *main point*، و *detail* را باهم استفاده می‌کنه."}

  en.b1.unit19.lesson04.teach.q_missed_meeting: {title: "سوال دنیل", gloss: "دنیل می‌گه: جلسه را از دست دادم. می‌تانین بگین چی واقع شد؟", note: "*can you tell me what happened* یک سوالِ ساده برای شروعِ خلاصه استه.", media_asset_key: "en.b1.audio.dialogue.summarizing.01"}
  en.b1.unit19.lesson04.teach.a_in_short_budget_client: {title: "جواب میا", gloss: "میا می‌گه: البته. به‌طور خلاصه، دربارهٔ بودجه و مشتریِ نو صحبت کدیم.", note: "*in short* یک خلاصهٔ سریع را معرفی می‌کنه."}
  en.b1.unit19.lesson04.teach.q_main_point_budget: {title: "سوال دنیل", gloss: "دنیل می‌گه: نکتهٔ اصلی دربارهٔ بودجه چی بود؟", note: "*what was the main point* سوالی استه که فقط نکتهٔ اصلی را می‌خواد."}
  en.b1.unit19.lesson04.teach.a_under_budget_this_month: {title: "جواب میا", gloss: "میا می‌گه: نکتهٔ اصلی این بود که مصرف ما این ماه کمتر از بودجه استه.", note: "*the main point was that* برجستهٔ تک نکتهٔ اصلی استه."}
  en.b1.unit19.lesson04.teach.q_other_details: {title: "سوال دنیل", gloss: "دنیل می‌گه: خوب استه. کدام جزئیاتِ دیگه هم بود؟", note: "*any other details* سوال دربارهٔ معلوماتِ اضافیِ کوچک استه."}
  en.b1.unit19.lesson04.teach.a_client_meeting_moved: {title: "جواب میا", gloss: "میا می‌گه: فقط یک نکتهٔ کوچک -- جلسهٔ مشتری به هفتهٔ آینده انتقال داده شد.", note: "*just one small detail* نشان می‌ته که همی یک نکتهٔ اصلی نیست."}
  en.b1.unit19.lesson04.teach.q_thanks_for_summary: {title: "جواب دنیل", gloss: "دنیل می‌گه: تشکر از خلاصه. خیلی مفید بود.", note: "*that's very helpful* یک تشکرِ ساده برای خلاصه استه."}

exercises:
