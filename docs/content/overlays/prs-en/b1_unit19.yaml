    instruction: "دنیل می‌گه: جلسه را از دست دادم. می‌تانین به‌طور خلاصه بگین چی واقع شد؟ با *In summary* جواب بتین: جلسه دربارهٔ بودجه و مشتریِ نو بود."
    accepted_answers:
      - {value: "In summary, the meeting covered the budget and the new client.", status: "correct"}
      - {value: "In summary, the meeting covered the budget and the new client", status: "correct"}
    feedback: "*In summary, the meeting covered the budget and the new client* یعنی خلاصه اینکه، جلسه دربارهٔ بودجه و مشتریِ نو بود."
  en.b1.unit19.lesson02.exercise05.write_main_point_under_budget:
    instruction: "بنویسین که نکتهٔ اصلی این بود که مصرف ما این ماه کمتر از بودجه استه، با 'The main point was that' آغاز کنین."
    accepted_answers:
      - {value: "The main point was that we are under budget this month.", status: "correct"}
      - {value: "The main point was that we are under budget this month", status: "correct"}
    feedback: "*The main point was that we are under budget this month* یعنی نکتهٔ اصلی این بود که مصرف ما این ماه کمتر از بودجه استه."

  en.b1.unit19.lesson03.exercise01.comprehend_condensed_summary:
    instruction: "کدام نکته‌های اصلی را لیلا در خلاصهٔ فشرده‌اش نگه داشت؟"
    correct_option: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing"
    distractors: ["workplace communication works best when messages are long and detailed", "workplace communication should always happen in written form", "workplace communication is not important for design courses"]
    accepted_answers: [{value: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing", status: "correct"}]
    feedback: "متن می‌گه *workplace communication works best when messages are clear and short, and when people ask questions instead of guessing*."
  en.b1.unit19.lesson03.exercise02.comprehend_left_out_examples:
    instruction: "لیلا چی را از خلاصه‌اش حذف کد، چون آن‌ها جزئیات بودن نه نکته‌های اصلی؟"
    correct_option: "she left out most of the examples"
