course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit64.compliments: {title: "تعریف و تحسین"}

lessons:
  en.a1.unit64.lesson01.compliment_words: {title: "کلمات برای تعریف کردن"}
  en.a1.unit64.lesson02.compliment_phrases: {title: "عبارات برای تعریف کردن"}
  en.a1.unit64.lesson03.dialogue_giving_compliments: {title: "گفتگو: تعریف کردن"}
  en.a1.unit64.lesson04.a_kind_message: {title: "متن: یک پیام مهربان"}

teaching:
  en.a1.unit64.lesson01.teach.nice: {title: "nice", gloss: "خوب / خوش", note: "nice یعنی خوب، خوش یا دل‌پسند. برای یک چیز یا کار مثبت و ساده زیاد کار می‌ره.", example_gloss: "این خوب استه."}
  en.a1.unit64.lesson01.teach.great: {title: "great", gloss: "بسیار خوب", note: "great از nice قوی‌تر استه و برای گفتن تعریف گرم کار می‌ره.", example_gloss: "شما امروز بسیار خوب معلوم می‌شین."}
  en.a1.unit64.lesson01.teach.lovely: {title: "lovely", gloss: "بسیار مقبول / دل‌پسند", note: "lovely یعنی خیلی مقبول، شیرین یا دل‌پسند.", example_gloss: "چه لبخند مقبولی."}
  en.a1.unit64.lesson01.teach.kind: {title: "kind", gloss: "مهربان", note: "kind یعنی مهربان و نیک با دیگران.", example_gloss: "این خیلی مهربانی تان استه."}
  en.a1.unit64.lesson01.teach.smile: {title: "smile", gloss: "لبخند", note: "smile یعنی لبخند -- حالتی خوش در چهره که وخت خوشحالی ظاهر می‌شه.", example_gloss: "چه لبخند مقبولی."}
  en.a1.unit64.lesson01.teach.jacket: {title: "jacket", gloss: "جاکت", note: "jacket یعنی جاکت، لباس رویی برای بالاتنه.", example_gloss: "جاکت تان را خوش دارم."}

  en.a1.unit64.lesson02.teach.that_is_nice: {title: "That is nice.", gloss: "این خوب استه.", note: "That is nice. یک تعریف ساده برای یک چیز یا کار استه."}
  en.a1.unit64.lesson02.teach.you_look_great: {title: "You look great.", gloss: "شما بسیار خوب معلوم می‌شین.", note: "You look great. برای تعریف از ظاهر کسی کار می‌ره."}
  en.a1.unit64.lesson02.teach.like_your_jacket: {title: "I like your jacket.", gloss: "جاکت تان را خوش دارم.", note: "I like your ... راه ساده برای تعریف از چیزی است که یک نفر داره یا پوشیده."}
  en.a1.unit64.lesson02.teach.lovely_smile: {title: "What a lovely smile.", gloss: "چه لبخند مقبولی.", note: "What a ...! در انگلیسی برای تعریف احساسی و گرم کار می‌ره."}
  en.a1.unit64.lesson02.teach.very_kind: {title: "That is very kind.", gloss: "این خیلی مهربانی تان استه.", note: "این جمله جواب مؤدبانه به یک گپ خوب یا کمک استه."}
  en.a1.unit64.lesson02.teach.thank_you_much: {title: "Thank you very much.", gloss: "بسیار تشکر.", note: "Thank you very much. یک تشکر گرم و مؤدبانه استه."}

  en.a1.unit64.lesson03.teach.dialogue_line1: {title: "تعریف میا", gloss: "سلام لیلا. شما امروز بسیار خوب معلوم می‌شین.", note: "Mia با You look great today از ظاهر لیلا تعریف می‌کنه."}
  en.a1.unit64.lesson03.teach.dialogue_line2: {title: "تشکر لیلا", gloss: "تشکر، میا.", note: "Thank you جواب ساده به تعریف استه."}
  en.a1.unit64.lesson03.teach.dialogue_line3: {title: "تعریف دربارهٔ جاکت", gloss: "جاکت سبز تان را خوش دارم.", note: "green jacket یعنی جاکت سبز."}
  en.a1.unit64.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "این خیلی مهربانی تان استه.", note: "That is very kind جواب گرم به یک تعریف استه."}
  en.a1.unit64.lesson03.teach.dialogue_line5: {title: "تعریف دوم میا", gloss: "لبخند تان هم بسیار مقبول استه.", note: "too یعنی هم؛ میا یک تعریف دیگر هم می‌کنه."}
  en.a1.unit64.lesson03.teach.dialogue_line6: {title: "تعریف لیلا", gloss: "بسیار تشکر. عکس تان خوب استه.", note: "Leila بعد از تشکر، از عکس میا تعریف می‌کنه."}
  en.a1.unit64.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "تشکر. این برای دانیال استه.", note: "It is for Daniel یعنی عکس برای دانیال استه."}

  en.a1.unit64.lesson04.teach.message: {title: "پیام مهربان", gloss: "پیام مهربان: جاکت سبز تان بسیار مقبول استه. عکس تان خوب استه. از اینکه مهربان استین تشکر.", note: "این پیام کوتاه دو تعریف و یک تشکر داره."}
  en.a1.unit64.lesson04.teach.reading_passage: {title: "متن: یک تعریف برای دوست", gloss: "یک تعریف برای دوست: میا لیلا را با یک جاکت سبز دید. میا گفت لیلا بسیار خوب معلوم می‌شد. او همچنین گفت لیلا یک لبخند مقبول داشت. لیلا از میا تشکر کرد. بعد لیلا به عکس میا نگاه کرد و گفت خوب استه. میا خوش شد، چون عکس برای دانیال بود. بعدتر، لیلا یک پیام کوتاه نوشت: جاکت سبز تان بسیار مقبول استه.", note: "این متن تعریف کردن، تشکر کردن، و جواب گرم دادن را تمرین می‌کنه."}

exercises:
  en.a1.unit64.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "lovely"
    distractors: ["happy", "quiet", "ready", "open"]
    accepted_answers: [{value: "lovely", status: "correct"}]
    feedback: "lovely یعنی بسیار مقبول یا دل‌پسند."
  en.a1.unit64.lesson01.exercise02.choose_kind_meaning:
    instruction: "کدام کلمه یعنی مهربان و خوب با یک نفر؟"
    correct_option: "kind"
    distractors: ["small", "late", "cold"]
    accepted_answers: [{value: "kind", status: "correct"}]
    feedback: "kind یعنی مهربان."
  en.a1.unit64.lesson01.exercise03.match_compliment_words:
    instruction: "هر کلمهٔ انگلیسی را به توضیح دری آن وصل کنین."
    pairs:
      - {left: "nice", right: "خوب و خوشایند"}
      - {left: "great", right: "عالی و خیلی خوب"}
      - {left: "lovely", right: "مقبول و دوست‌داشتنی"}
      - {left: "kind", right: "مهربان و خوش‌رفتار با کسی"}
      - {left: "smile", right: "حالتی خوش در چهره"}
      - {left: "jacket", right: "لباسی برای بالاتنه"}
    accepted_answers:
      - value:
          - {left: "nice", right: "خوب و خوشایند"}
          - {left: "great", right: "عالی و خیلی خوب"}
          - {left: "lovely", right: "مقبول و دوست‌داشتنی"}
          - {left: "kind", right: "مهربان و خوش‌رفتار با کسی"}
          - {left: "smile", right: "حالتی خوش در چهره"}
          - {left: "jacket", right: "لباسی برای بالاتنه"}
        status: "correct"
    feedback: "nice=خوب، great=بسیار خوب، lovely=بسیار مقبول، kind=مهربان، smile=لبخند، jacket=جاکت."
  en.a1.unit64.lesson01.exercise04.order_jacket_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "like", "your", "jacket."], status: "correct"}]
    feedback: "ترتیب درست: I like your jacket."
  en.a1.unit64.lesson01.exercise05.write_smile:
    instruction: "کلمه‌ای را بنویسین که یعنی لبخند."
    accepted_answers: [{value: "smile", status: "correct"}]
    feedback: "smile یعنی لبخند."

  en.a1.unit64.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "You look great."
    distractors: ["You look tired.", "You are late.", "You have a ticket."]
    accepted_answers: [{value: "You look great.", status: "correct"}]
    feedback: "You look great. یعنی شما بسیار خوب معلوم می‌شین."
  en.a1.unit64.lesson02.exercise02.choose_compliment:
    instruction: "کدام عبارت از لباس کسی تعریف می‌کنه؟"
    correct_option: "I like your jacket."
    distractors: ["I need your receipt.", "I have a cough.", "I will visit soon."]
    accepted_answers: [{value: "I like your jacket.", status: "correct"}]
    feedback: "I like your jacket. یعنی جاکت تان را خوش دارم."
  en.a1.unit64.lesson02.exercise03.choose_thanks:
    instruction: "کدام عبارت جواب مؤدبانه به یک تعریف استه؟"
    correct_option: "Thank you very much."
    distractors: ["Where is the bank?", "Can I borrow it?", "This size is small."]
    accepted_answers: [{value: "Thank you very much.", status: "correct"}]
    feedback: "Thank you very much. یعنی بسیار تشکر."
  en.a1.unit64.lesson02.exercise04.order_great_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["You", "look", "great."], status: "correct"}]
    feedback: "ترتیب درست: You look great."
  en.a1.unit64.lesson02.exercise05.translate_nice:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «این خوب استه.»"
    accepted_answers:
      - {value: "That is nice.", status: "correct"}
      - {value: "That is nice", status: "correct"}
    feedback: "That is nice. یعنی این خوب استه."

  en.a1.unit64.lesson03.exercise01.comprehension_clothing:
    instruction: "مطابق گفتگو، میا چی را خوش داره؟"
    correct_option: "green jacket"
    distractors: ["blue shirt", "red bag", "black shoes"]
    accepted_answers: [{value: "green jacket", status: "correct"}]
    feedback: "میا جاکت سبز لیلا را خوش داره."
  en.a1.unit64.lesson03.exercise02.comprehension_photo:
    instruction: "مطابق گفتگو، عکس میا چطور استه؟"
    correct_option: "nice"
    distractors: ["old", "small", "dark"]
    accepted_answers: [{value: "nice", status: "correct"}]
    feedback: "لیلا می‌گه عکس میا خوب استه."
  en.a1.unit64.lesson03.exercise03.listen_dialogue_compliment:
    instruction: "میا کدام تعریف را می‌گه؟"
    correct_option: "I like your green jacket."
    distractors: ["I like your blue shirt.", "Your bag is heavy.", "Your room is ready."]
    accepted_answers: [{value: "I like your green jacket.", status: "correct"}]
    feedback: "میا می‌گه: I like your green jacket."
  en.a1.unit64.lesson03.exercise04.respond_own_compliment:
    instruction: "یک تعریف ساده بکنین، یا به یک تعریف جواب بتین."
    accepted_answers: ["I like your jacket", "I like your jacket.", "You look great", "You look great.", "That is nice", "That is nice.", "Thank you very much", "Thank you very much.", "Thank you", "Thank you.", "That is very kind", "That is very kind.", "What a lovely smile", "What a lovely smile.", "I like your green jacket", "I like your green jacket.", "You look nice", "You look nice.", "That's nice", "That's nice.", "Thanks", "Thanks."]
    feedback: "می‌تانین بگین You look great. یا Thank you very much."

  en.a1.unit64.lesson04.exercise01.message_jacket:
    instruction: "مطابق پیام، جاکت سبز چطور استه؟"
    correct_option: "lovely"
    distractors: ["small", "wet", "closed"]
    accepted_answers: [{value: "lovely", status: "correct"}]
    feedback: "پیام می‌گه جاکت سبز بسیار مقبول استه."
  en.a1.unit64.lesson04.exercise02.message_photo:
    instruction: "مطابق پیام، عکس چطور استه؟"
    correct_option: "nice"
    distractors: ["late", "empty", "heavy"]
    accepted_answers: [{value: "nice", status: "correct"}]
    feedback: "پیام می‌گه عکس خوب استه."
  en.a1.unit64.lesson04.exercise03.reading_who_wore_jacket:
    instruction: "مطابق متن، کی جاکت سبز پوشیده بود؟"
    correct_option: "Leila"
    distractors: ["Mia", "Daniel", "the clerk"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "لیلا جاکت سبز پوشیده بود."
  en.a1.unit64.lesson04.exercise04.reading_who_photo_for:
    instruction: "مطابق متن، عکس برای کی بود؟"
    correct_option: "Daniel"
    distractors: ["Leila", "Mia", "the teacher"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "عکس برای دانیال بود."
  en.a1.unit64.lesson04.exercise05.write_own_kind_message:
    instruction: "یک پیام کوتاه بنویسین: از جاکت تعریف کنین، و تشکر کنین."
    accepted_answers:
      - {value: "Your jacket is lovely. Thank you.", status: "correct"}
      - {value: "Your jacket is nice. Thank you.", status: "correct"}
      - {value: "I like your jacket. Thank you.", status: "correct"}
      - {value: "Your jacket is lovely, thank you.", status: "correct"}
      - {value: "Your jacket is nice, thank you.", status: "correct"}
      - {value: "I like your jacket, thank you.", status: "correct"}
      - {value: "Your green jacket is lovely. Thank you.", status: "correct"}
      - {value: "Your green jacket is lovely, thank you.", status: "correct"}
      - {value: "Your jacket is great. Thank you.", status: "correct"}
      - {value: "Your jacket is lovely. Thank you very much.", status: "correct"}
      - {value: "Your jacket is nice. Thank you very much.", status: "correct"}
      - {value: "I like your jacket. Thank you very much.", status: "correct"}
      - {value: "I like your green jacket. Thank you.", status: "correct"}
    feedback: "می‌تانین بگین: Your jacket is lovely. Thank you."
