review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit42 (personality), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first and again returned HTTP 402 (no credits in this environment) -- authored from established Dari vocabulary/grammar knowledge instead. Genuine prs<->en contrastive-grammar point, on the warm-up-quickly card: English idiomatically extends a literal physical-temperature phrasal verb (warm up) to mean becoming socially comfortable, an idiom Dari does not share -- Dari expresses the same idea with an unrelated verb of habituation/familiarity (زود عادت می‌کنه / زود باهاش خو می‌گیره, roughly \"quickly gets used to him\"), not a temperature metaphor at all. Dari-specific vocabulary used for authenticity: خو گرفتن (to get used to/warm up to someone), a common Afghan colloquial expression. Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit42.personality: {title: "توضیف خصلت کسی"}

lessons:
  en.a1.unit42.lesson01.personality_vocabulary: {title: "کلمات خصلت"}
  en.a1.unit42.lesson02.talking_about_someones_character: {title: "گپ‌زدن دربارهٔ خصلت کسی"}
  en.a1.unit42.lesson03.dialogue_what_is_daniel_like: {title: "گپ: دنیل چطور آدمیس؟"}
  en.a1.unit42.lesson04.three_friends_three_personalities: {title: "متن: سه رفیق، سه خصلت"}

teaching:
  en.a1.unit42.lesson01.teach.friendly: {title: "friendly", gloss: "مهربان", note: "friendly یعنی مهربان و خوش‌گپ.", example_gloss: "همسایه‌ام خیلی مهربان استه."}
  en.a1.unit42.lesson01.teach.funny: {title: "funny", gloss: "بذله‌گو / خنده‌آور", note: "funny یعنی کسی که مردم را می‌خنداند.", example_gloss: "برادرم واقعاً بذله‌گو استه."}
  en.a1.unit42.lesson01.teach.hardworking: {title: "hardworking", gloss: "زحمت‌کش", note: "hardworking یعنی زحمت‌کش -- کسی که سخت کار می‌کنه و زود دست از کار نمی‌کشه.", example_gloss: "او یک کارمند زحمت‌کش استه."}
  en.a1.unit42.lesson01.teach.shy: {title: "shy", gloss: "خجالتی", note: "shy یعنی خجالتی -- کسی که پیش رویارویی همرای مردم نو کمی معذب استه.", example_gloss: "او اول‌ها یک‌خورده خجالتی استه."}
  en.a1.unit42.lesson01.teach.calm: {title: "calm", gloss: "آرام", note: "calm یعنی آرام -- کسی که زود عصبانی یا مضطرب نمی‌شه.", example_gloss: "مادرم خیلی آرام استه."}
  en.a1.unit42.lesson01.teach.talkative: {title: "talkative", gloss: "پرگپ", note: "talkative یعنی پرگپ -- کسی که زیاد گپ می‌زنه.", example_gloss: "خواهرم خیلی پرگپ استه."}

  en.a1.unit42.lesson02.teach.a_little_shy: {title: "a little shy", gloss: "یک‌خورده خجالتی", note: "a little shy یعنی یک‌خورده خجالتی.", example_gloss: "او اول‌ها یک‌خورده خجالتی استه، خو زود خو می‌گیره."}
  en.a1.unit42.lesson02.teach.very_hardworking: {title: "very hardworking", gloss: "خیلی زحمت‌کش", note: "very hardworking یعنی خیلی زحمت‌کش.", example_gloss: "همکارم خیلی زحمت‌کش استه."}
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor: {title: "have a great sense of humor", gloss: "خیلی بذله‌گو بودن", note: "have a great sense of humor یعنی خیلی بذله‌گو استن، همیشه چیز خنده‌دار می‌گه.", example_gloss: "دنیل خیلی بذله‌گو استه."}
  en.a1.unit42.lesson02.teach.get_along_with_everyone: {title: "get along with everyone", gloss: "با همه خوب رفتار داشتن", note: "get along with یک فعل مرکب انگلیسیس، همو نوعی که در واحد محل هم دیدین -- دری معادلش را با رابطهٔ خوب داشتن می‌ته.", example_gloss: "میا در محل کار با همه رابطهٔ خوب داره."}
  en.a1.unit42.lesson02.teach.warm_up_quickly: {title: "warm up quickly", gloss: "زود خو گرفتن", note: "warm up quickly تحت‌اللفظی یعنی «زود گرم شدن»، خو اینجه یک اصطلاح استه به معنای زود عادت‌کردن یا خودمانی‌شدن با کسی. دری اصطلاح مشابه‌اش خو گرفتن استه -- هیچ ربطی به گرمی حرارت نداره، درحالیکه انگلیسی از یک استعارهٔ حرارتی کار می‌گیره.", example_gloss: "او خجالتی استه، خو زود خو می‌گیره وقتی کسی را بشناسه."}
  en.a1.unit42.lesson02.teach.whats_he_like_question: {title: "What's he like?", gloss: "او چطور آدمیس؟", note: "این یک اصطلاح استه، نی ترجمهٔ کلمه‌به‌کلمه -- What ... like؟ برای پرسیدن دربارهٔ خصلت یک کس کار می‌ره."}

  en.a1.unit42.lesson03.teach.dialogue_line1: {title: "میا می‌پرسه", gloss: "هفتهٔ آینده با دنیل یک پروژهٔ نو شروع می‌کنم. او چطور آدمیس؟", note: "شروع گپ با یک سوال دربارهٔ خصلت کسی."}
  en.a1.unit42.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "او خیلی مهربان استه، و خیلی هم بذله‌گو استه.", note: "دو صفت با and وصل شده."}
  en.a1.unit42.lesson03.teach.dialogue_line3: {title: "میا می‌گه", gloss: "چه خوب! کار همرایش آسان استه؟", note: "easy to work with -- اصطلاح برای گفتن کسی همکاری آسانیس."}
  en.a1.unit42.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "بلی، خیلی هم زحمت‌کش استه. همیشه کارهایش را به‌وخت خلاص می‌کنه.", note: "also یعنی هم، همچنان."}
  en.a1.unit42.lesson03.teach.dialogue_line5: {title: "میا می‌پرسه", gloss: "در ملاقات‌ها هیچ وخت خجالتی می‌شه؟", note: "ever اینجه یعنی هیچ وخت/هیچ."}
  en.a1.unit42.lesson03.teach.dialogue_line6: {title: "جواب لیلا", gloss: "یک‌خورده، خو زود خو می‌گیره وقتی کسی را بشناسه.", note: "once he knows you یعنی وقتی که کسی را بشناسه."}
  en.a1.unit42.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "تشکر، لیلا. حالی در بارهٔ پروژه راحت‌تر احساس می‌کنم.", note: "relaxed یعنی راحت، بدون نگرانی."}

  en.a1.unit42.lesson04.teach.reading_passage: {title: "متن: سه رفیق، سه خصلت", gloss: "دنیل، لیلا و میا رفقای نزدیک استند، خو خصلت‌های‌شان خیلی فرق داره. دنیل مهربان و بذله‌گو استه -- او همیشه رفقایش را می‌خنداند. اول‌ها یک‌خورده خجالتی استه وقتی کسان نو را می‌بینه، خو زود خو می‌گیره. لیلا آرام و خلاق استه. او نقاشی را دوست داره چون کمکش می‌کنه آرام بمانه، و به‌ندرت از چیزی عصبانی می‌شه. میا برون‌گرا و منظم استه. او دوست داره برای گروپ پلان بسازه، و وقتی به رفقایش چیز نو یاد می‌ده خیلی صبورسته -- او بود که به دنیل پختن یاد داد. با آنکه هرسه‌شان فرق دارند، با همه رابطهٔ خوب دارند و از وخت‌گذرانی باهم لذت می‌برند.", note: "این متن چند صفت خصلت را با هم در جمله‌های واقعی نشان می‌ده."}

exercises:
  en.a1.unit42.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد را انتخاب کنین."
    correct_option: "hardworking"
    distractors: ["friendly", "shy", "calm"]
    accepted_answers: [{value: "hardworking", status: "correct"}]
    feedback: "hardworking یعنی زحمت‌کش."
  en.a1.unit42.lesson01.exercise02.choose_shy_meaning:
    instruction: "کدام کلمه یعنی کسی که پیش رویارویی همرای مردم نو کمی معذب استه؟"
    correct_option: "shy"
    distractors: ["friendly", "funny", "talkative"]
    accepted_answers: [{value: "shy", status: "correct"}]
    feedback: "shy یعنی خجالتی."
  en.a1.unit42.lesson01.exercise03.match_personality_words:
    instruction: "هر کلمه را به معنایش وصل کنین."
    accepted_answers: [{"value": [{"left": "kind and easy to talk to", "right": "friendly"}, {"left": "makes people laugh", "right": "funny"}, {"left": "works hard and doesn't give up easily", "right": "hardworking"}, {"left": "nervous or quiet around new people", "right": "shy"}, {"left": "doesn't get upset or nervous easily", "right": "calm"}, {"left": "talks a lot", "right": "talkative"}], "status": "correct"}]
    feedback: "friendly=مهربان، funny=بذله‌گو، hardworking=زحمت‌کش، shy=خجالتی، calm=آرام، talkative=پرگپ."
  en.a1.unit42.lesson01.exercise04.order_hardworking_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["She", "is", "a", "hardworking", "employee."], status: "correct"}]
    feedback: "ترتیب درست: She is a hardworking employee."
  en.a1.unit42.lesson01.exercise05.write_calm_word:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که زود عصبانی یا مضطرب نمی‌شه."
    accepted_answers: [{value: "calm", status: "correct"}]
    feedback: "calm یعنی آرام."

  en.a1.unit42.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که گفته شد را انتخاب کنین."
    correct_option: "get along with everyone"
    distractors: ["a little shy", "very hardworking", "warm up quickly"]
    accepted_answers: [{value: "get along with everyone", status: "correct"}]
    feedback: "get along with everyone یعنی با همه خوب رفتار داشتن."
  en.a1.unit42.lesson02.exercise02.choose_sense_of_humor_meaning:
    instruction: "کدام عبارت یعنی کسی خیلی بذله‌گو استه و مردم را می‌خنداند؟"
    correct_option: "have a great sense of humor"
    distractors: ["a little shy", "very hardworking", "get along with everyone"]
    accepted_answers: [{value: "have a great sense of humor", status: "correct"}]
    feedback: "have a great sense of humor یعنی خیلی بذله‌گو بودن."
  en.a1.unit42.lesson02.exercise03.choose_warm_up_quickly_meaning:
    instruction: "کدام عبارت یعنی کسی زود بعد از دیدن مردم نو راحت می‌شه؟"
    correct_option: "warm up quickly"
    distractors: ["a little shy", "very hardworking", "get along with everyone"]
    accepted_answers: [{value: "warm up quickly", status: "correct"}]
    feedback: "warm up quickly یعنی زود خو گرفتن."
  en.a1.unit42.lesson02.exercise04.order_coworker_sentence:
    instruction: "کلمات را به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "coworker", "is", "very", "hardworking."], status: "correct"}]
    feedback: "ترتیب درست: My coworker is very hardworking."
  en.a1.unit42.lesson02.exercise05.translate_whats_he_like:
    instruction: "این جمله را به انگلیسی ترجمه کنین: «او چطور آدمیس؟»"
    accepted_answers:
      - {value: "What's he like?", status: "correct"}
      - {value: "What's he like", status: "correct"}
    feedback: "What's he like?"

  en.a1.unit42.lesson03.exercise01.comprehension_leila_daniel_personality:
    instruction: "مطابق گپ، لیلا در بارهٔ خصلت دنیل چی می‌گه؟"
    correct_option: "friendly and funny"
    distractors: ["shy and quiet", "calm and serious", "talkative and loud"]
    accepted_answers: [{value: "friendly and funny", status: "correct"}]
    feedback: "لیلا می‌گه He's very friendly, and he's really funny too."
  en.a1.unit42.lesson03.exercise02.comprehension_leila_daniel_work:
    instruction: "مطابق گپ، لیلا در بارهٔ عادت‌های کاری دنیل چی می‌گه؟"
    correct_option: "hardworking"
    distractors: ["lazy", "disorganized", "slow"]
    accepted_answers: [{value: "hardworking", status: "correct"}]
    feedback: "لیلا می‌گه he's also very hardworking."
  en.a1.unit42.lesson03.exercise03.listen_dialogue_meetings:
    instruction: "مطابق گپ، لیلا در بارهٔ دنیل در ملاقات‌ها چی می‌گه؟"
    correct_option: "a little shy"
    distractors: ["very talkative", "always late", "not very organized"]
    accepted_answers: [{value: "a little shy", status: "correct"}]
    feedback: "لیلا می‌گه A little, but he gets more comfortable once he knows you."
  en.a1.unit42.lesson03.exercise04.respond_own_personality:
    instruction: "چیزی در بارهٔ خصلت خودتان بگین، یا بپرسین کسی چطور آدمیس."
    accepted_answers: ["I'm friendly and funny", "I'm friendly and funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "I'm friendly", "I'm friendly.", "I'm funny", "I'm funny.", "I'm talkative", "I'm talkative.", "What's she like?", "What's he like?"]
    feedback: "می‌تانین بگین I'm... یا بپرسین What's he/she like؟"

  en.a1.unit42.lesson04.exercise01.reading_daniel_traits:
    instruction: "مطابق متن، دو خصلت دنیل چیستند؟"
    correct_option: "friendly and funny"
    distractors: ["shy and quiet", "calm and serious", "talkative and loud"]
    accepted_answers: [{value: "friendly and funny", status: "correct"}]
    feedback: "متن می‌گه Daniel is friendly and funny."
  en.a1.unit42.lesson04.exercise02.reading_leila_hobby_reason:
    instruction: "مطابق متن، لیلا چرا نقاشی را دوست داره؟"
    correct_option: "it helps her relax"
    distractors: ["it makes money", "her family taught her", "it's a popular hobby"]
    accepted_answers: [{value: "it helps her relax", status: "correct"}]
    feedback: "متن می‌گه it helps her relax."
  en.a1.unit42.lesson04.exercise03.reading_mia_taught_daniel:
    instruction: "مطابق متن، میا صبورانه چی به دنیل یاد داد؟"
    correct_option: "how to cook"
    distractors: ["how to paint", "how to swim", "how to drive"]
    accepted_answers: [{value: "how to cook", status: "correct"}]
    feedback: "متن می‌گه she taught Daniel how to cook."
  en.a1.unit42.lesson04.exercise04.write_own_personality_sentence:
    instruction: "یک جمله در بارهٔ خصلت خودتان بنویسین، با «I'm...» یا «I am...»."
    accepted_answers: ["I'm friendly", "I'm friendly.", "I am friendly", "I am friendly.", "I'm funny", "I'm funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "I'm talkative", "I'm talkative."]
    feedback: "می‌تانین از الگوی I'm.../I am... کار بگیرین."
