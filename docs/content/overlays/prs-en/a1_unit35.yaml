review: {status: "reviewed", required_next_reviewer: "native_speaker_pass", notes: "Review 2026-10-19 (prs-en A1/A2 pass): 11 fixes — Iranian forms to Afghan colloquial (می‌خوای، می‌خونه، بفرست); درحالیکه; computer match right; recipe gloss; untaught distractors (music/news/email/video/look-up) replaced; call-heard distractor. NATIVE FLAGS: none. Prior note: New overlay against the shared English realization unit35 (technology/devices), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Firecrawl search against the DLI Dari Basic Course was attempted first (per standing instruction) and again returned HTTP 402 (no credits in this environment, same as unit32) -- authored from established Dari vocabulary/grammar knowledge instead, same dialect conventions as every other unit in this course. Genuine prs<->en contrastive-grammar point, on the phone card: English marks possession with a separate word before the noun (my phone, her laptop), while Dari attaches a possessive enclitic directly onto the noun itself (تلفنم = تلفن+م, one word meaning my phone) -- there is no free-standing Dari word that does what my/her/his do in English. Dari-leaning technology vocabulary used where it differs from Iranian Farsi register: کمپیوتر/لپ‌تاپ/تبلت/اپلیکیشن as widely used loanwords in Afghan Dari tech speech, and بتری for battery (distinct from the Iranian باتری). Sibling-isolation rule followed -- no en-prs, fa-en, or nl-en overlay for this unit was opened while authoring this file. Needs the mandatory fresh-context review before shipping, same bar as every other unit."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای گفت‌وگوهای کوتاه روزمره، با توضیحاتی که به دری آشناست."

units:
  en.a1.unit35.technology: {title: "گپ‌زدن در بارهٔ وسایل و اپلیکیشن‌ها"}

lessons:
  en.a1.unit35.lesson01.device_vocabulary: {title: "تلفن و وسایل دیگه"}
  en.a1.unit35.lesson02.using_your_phone: {title: "استعمال تلفن‌تان"}
  en.a1.unit35.lesson03.dialogue_new_phone: {title: "گپ در بارهٔ یک تلفن کهنه"}
  en.a1.unit35.lesson04.how_they_use_their_phones: {title: "متن: طرز استفادهٔ تلفن‌شان"}

teaching:
  en.a1.unit35.lesson01.teach.phone: {title: "phone", gloss: "تلفن", note: "phone یعنی تلفن (موبایل). نکتهٔ گرامری: انگلیسی برای گفتن مالکیت از یک کلمهٔ جدا پیش از اسم کار می‌گیره (my phone، her laptop)، در حالی‌که دری پسوند ملکی را مستقیم به آخر اسم می‌چسپونه (تلفنم = تلفن + م، یعنی «تلفن من» در یک کلمه) -- پس my/her/his در انگلیسی همیشه یک کلمهٔ جدای پیش از اسم می‌مانه، خو معادلش در دری معمولاً پسوند به خود اسم استه.", example_gloss: "به مادرم از تلفنم زنگ می‌زنم."}
  en.a1.unit35.lesson01.teach.laptop: {title: "laptop", gloss: "لپ‌تاپ", note: "laptop یعنی لپ‌تاپ، یک کمپیوتر کوچک که می‌تانین با خود ببرین.", example_gloss: "او لپ‌تاپش را برای کار استعمال می‌کنه."}
  en.a1.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "تبلت", note: "tablet یعنی تبلت، یک وسیلهٔ صفحه‌لمسی مسطح.", example_gloss: "او روی تبلتش کتاب می‌خونه."}
  en.a1.unit35.lesson01.teach.computer: {title: "computer", gloss: "کمپیوتر", note: "computer یعنی کمپیوتر.", example_gloss: "ما در خانه یک کمپیوتر داریم."}
  en.a1.unit35.lesson01.teach.app: {title: "app", gloss: "اپلیکیشن", note: "app یعنی اپلیکیشن (کوتاه‌شدهٔ application) -- یک برنامه که روی تلفن یا تبلت دانلود می‌کنین.", example_gloss: "من یک اپلیکیشن نو روی تلفنم دارم."}
  en.a1.unit35.lesson01.teach.camera: {title: "camera", gloss: "کمره", note: "camera یعنی کمره، وسیله یا بخشی از تلفن که عکس می‌گیره.", example_gloss: "این کمره عکس‌های خیلی خوب می‌گیره."}

  en.a1.unit35.lesson02.teach.make_a_call: {title: "make a call", gloss: "زنگ زدن", note: "make a call یعنی زنگ زدن.", example_gloss: "من هر یکشنبه به برادرم زنگ می‌زنم."}
  en.a1.unit35.lesson02.teach.send_a_text: {title: "send a text", gloss: "پیام فرستادن", note: "send a text یعنی پیام (اس‌ام‌اس) فرستادن.", example_gloss: "او هر سحر برای رفیقش پیام می‌فرسته."}
  en.a1.unit35.lesson02.teach.download_an_app: {title: "download an app", gloss: "اپلیکیشن دانلود کردن", note: "download an app یعنی اپلیکیشن دانلود کردن.", example_gloss: "او هر هفته یک اپلیکیشن نو دانلود می‌کنه."}
  en.a1.unit35.lesson02.teach.wifi: {title: "wifi", gloss: "وایفای", note: "wifi یعنی وایفای، یک ارتباط بی‌سیم به انترنت.", example_gloss: "وایفای خانهٔ ما تیز استه."}
  en.a1.unit35.lesson02.teach.battery: {title: "battery", gloss: "بتری", note: "battery یعنی بتری -- بخشی از تلفن که انرژی/برق را ذخیره می‌کنه.", example_gloss: "بتری تلفنم خالی استه."}
  en.a1.unit35.lesson02.teach.how_use_phone_question: {title: "How do you use your phone?", gloss: "تلفنت را چطور استعمال می‌کنی؟", note: "این سوال با how (چطور) شروع می‌شه و بعدش فعل کمکی do می‌آیه چون فعل اصلی use استه -- همو ساختار do-support که در واحدهای پیش هم دیدین."}

  en.a1.unit35.lesson03.teach.dialogue_line1: {title: "میا می‌گه", gloss: "تلفنم خیلی کهنه استه. خیلی هم آهسته کار می‌کنه.", note: "شروع گپ با شکایت از تلفن کهنه."}
  en.a1.unit35.lesson03.teach.dialogue_line2: {title: "لیلا می‌گه", gloss: "باید یک دانهٔ نو بگیری. بیشتر از چی برایش کار می‌گیری؟", note: "should برای پیشنهاد کار می‌ره."}
  en.a1.unit35.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "بیشتر به خواهرم پیام می‌دم و عکس می‌گیرم.", note: "mostly یعنی بیشتر اوقات."}
  en.a1.unit35.lesson03.teach.dialogue_line4: {title: "لیلا می‌گه", gloss: "من تلفنم را برای زنگ‌زدن به والدینم هر آخر هفته کار می‌گیرم. اپلیکیشن‌های زیاد هم استعمال می‌کنم.", note: "use ... to + فعل یعنی از چیزی برای یک کار خاص کار گرفتن."}
  en.a1.unit35.lesson03.teach.dialogue_line5: {title: "میا می‌پرسه", gloss: "کدام اپلیکیشن‌ها را استعمال می‌کنی؟", note: "which اینجه یعنی کدام."}
  en.a1.unit35.lesson03.teach.dialogue_line6: {title: "جواب لیلا", gloss: "من یک اپلیکیشن آشپزی و یک اپلیکیشن نقشه استعمال می‌کنم. می‌خواهی دانلودشان کنی؟", note: "want to + فعل یعنی خواستن انجام یک کار."}
  en.a1.unit35.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "بلی، لطفاً نام‌هاشان را برایم بفرست!", note: "خواهش با please نرم‌تر می‌شه."}

  en.a1.unit35.lesson04.teach.reading_passage: {title: "متن: طرز استفادهٔ تلفن‌شان", gloss: "دنیل، لیلا و میا هرکدام تلفن‌های‌شان را طور مختلف استعمال می‌کنن. دنیل از پیام‌دادن زیاد خوشش نمی‌آیه؛ او ترجیح می‌ته که زنگ بزنه. لیلا از تلفنش برای نقشه و یک اپلیکیشن آشپزی وقتی دستور پخت نو را امتحان می‌کنه استفاده می‌کنه. میا عکس‌های زیاد می‌گیره و برای فامیلش می‌فرسته. هر سه‌شان از لپ‌تاپ برای کار استفاده می‌کنن، و آخر هفته‌ها همرای دوستان‌شان ویدیو چت می‌کنن.", note: "این متن چند فعل مرکب مربوط به تکنالوژی (use ... for، prefer to، send to) را با هم در جمله‌های واقعی نشان می‌ده."}

