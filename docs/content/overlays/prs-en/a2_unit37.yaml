course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحاتی که به دری آشناست."

units:
  en.a2.unit37.video_calls: {title: "گپ زدن دربارهٔ ویدیو کال"}

lessons:
  en.a2.unit37.lesson01.video_call_vocabulary: {title: "کمره، مایکروفون، و کنکشن"}
  en.a2.unit37.lesson02.describing_your_video_calls: {title: "گفتن اینکه چطور ویدیو کال می‌کنین و چی را ترجیح می‌تین"}
  en.a2.unit37.lesson03.reading_about_video_calls: {title: "خواندن دربارهٔ ویدیو کال‌های یک نفر دیگه"}
  en.a2.unit37.lesson04.video_calls_dialogue: {title: "گپ زدن همرای یک دوست دربارهٔ ویدیو کال"}

teaching:
  en.a2.unit37.lesson01.teach.video_call: {title: "video call", gloss: "ویدیو کال", note: "*video call* یعنی یک تماس که در آن یکدیگر را هم می‌بینین.", example_gloss: "هر دوشنبه همرای تیمم یک ویدیو کال دارم."}
  en.a2.unit37.lesson01.teach.camera: {title: "camera", gloss: "کمره", note: "*camera* یعنی همو بخشی که تصویر شما را نشان می‌ته.", example_gloss: "پیش از شروع جلسه کمره‌تان را روشن کنین."}
  en.a2.unit37.lesson01.teach.microphone: {title: "microphone", gloss: "مایکروفون", note: "*microphone* یعنی همو بخشی که آواز شما را می‌رسانه.", example_gloss: "مایکروفونم خاموش بود، پس هیچ‌کس آوازم را نشنید."}
  en.a2.unit37.lesson01.teach.connection: {title: "connection", gloss: "کنکشن", note: "*connection* یعنی ارتباط کمپیوترتان همرای انترنت.", example_gloss: "کنکشن خراب بود، پس تصویر بند شد."}
  en.a2.unit37.lesson01.teach.mute: {title: "mute", gloss: "خاموش کردن آواز", note: "*mute* یعنی آوازتان را خاموش کنین تا دیگران نشنون.", example_gloss: "وختی خودم گپ نمی‌زنم، مایکروفونم را خاموش می‌کنم."}
  en.a2.unit37.lesson01.teach.face_to_face: {title: "face to face", gloss: "روبه‌رو", note: "*face to face* یعنی در عین اتاق، نی از پشت سکرین.", example_gloss: "بعضی جلسه‌ها روبه‌رو بهتر از آنلاین استن."}
  en.a2.unit37.lesson01.teach.grammar_comparison: {title: "مقایسه همرای faster than و less than", gloss: "یک ویدیو کال از یک ملاقات تیزتر استه. یک ویدیو کال از یک ملاقات روبه‌رو کمتر شخصی استه.", note: "برای صفت‌های کوتاه *-er than* می‌آیه (*faster than*)؛ برای صفت‌های درازتر *less ... than* یا *more ... than* استعمال می‌شه."}

  en.a2.unit37.lesson02.teach.video_call_every_monday: {title: "گفتن اینکه چند بار ویدیو کال دارین", gloss: "هر دوشنبه همرای تیمم یک ویدیو کال دارم.", note: "*every Monday* یعنی هر دوشنبه، پس یک عادت ثابت."}
  en.a2.unit37.lesson02.teach.turn_on_your_camera: {title: "خواستن اینکه کسی کمره‌اش را روشن کنه", gloss: "کمره‌تان را روشن کرده می‌تانین؟", note: "*turn on* یعنی روشن کردن؛ برعکسش *turn off* استه."}
  en.a2.unit37.lesson02.teach.you_were_on_mute: {title: "گفتن اینکه آواز کسی خاموش بود", gloss: "ببخشین، آوازتان خاموش بود.", note: "*you were on mute* یک عبارت ثابت انگلیسی استه که در جلسه‌های آنلاین خیلی شنیده می‌شه."}
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face: {title: "دادن نظر همرای یک ترجیح", gloss: "فکر می‌کنم ویدیو کال‌ها مفید استن، اما ملاقات روبه‌رو را ترجیح می‌تم.", note: "*I think... but I prefer...* اول نظرتان و بعد ترجیح‌تان را می‌ته."}
  en.a2.unit37.lesson02.teach.grammar_prefer: {title: "prefer X to Y", gloss: "ویدیو کال را از تماس تیلفونی ترجیح می‌تم. ملاقات روبه‌رو را از ویدیو کال ترجیح می‌تم.", note: "دقت کنین: بعد از *prefer* کلمهٔ *to* می‌آیه، نی *than* -- *I prefer video calls to phone calls*."}

  en.a2.unit37.lesson03.teach.headphones: {title: "headphones", gloss: "هدفون", note: "*headphones* در انگلیسی همیشه جمع استه، حتی اگر یک دانه باشه.", example_gloss: "هدفون استعمال می‌کنم تا فامیلم آواز جلسه را نشنون."}
  en.a2.unit37.lesson03.teach.leilas_message: {title: "پیام لیلا", gloss: "صنف‌های آنلاینم حالی همه ویدیو کال استن. کمره‌ام را روشن می‌کنم، اما مایکروفونم را خاموش می‌کنم تا وختی که استاد یک سوال بپرسه. هدفون استعمال می‌کنم، چون کنکشنم همرای آن بهتر استه. فکر می‌کنم ویدیو کال‌ها وقت زیاد صرفه‌جویی می‌کنن، اما باز هم ملاقات روبه‌رو همرای هم‌صنفی‌هایم را ترجیح می‌تم.", note: "یک پیام غیررسمی لیلا دربارهٔ صنف‌های آنلاین خودش -- سویهٔ A2."}
  en.a2.unit37.lesson03.teach.mute_until_question: {title: "گفتن اینکه کِی مایکروفون‌تان را خاموش می‌کنین", gloss: "مایکروفونم را خاموش می‌کنم تا وختی که استاد یک سوال بپرسه.", note: "*until* یعنی تا همو لحظه‌ای که یک چیز واقع می‌شه."}

  en.a2.unit37.lesson04.teach.q_lot_of_video_calls: {title: "لیلا دربارهٔ کار دانیل می‌پرسه", gloss: "لیلا می‌پرسه: در کارتان ویدیو کال زیاد دارین؟", note: "*a lot of* یعنی زیاد؛ هم برای چیزهای شمردنی و هم غیرشمردنی استعمال می‌شه."}
  en.a2.unit37.lesson04.teach.a_call_every_monday: {title: "دانیل دربارهٔ کال ثابتش می‌گه", gloss: "دانیل می‌گه: بلی، هر دوشنبه همرای تیمم یک ویدیو کال دارم.", note: "همو جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit37.lesson04.teach.q_turn_on_camera: {title: "لیلا دربارهٔ کمره‌اش می‌پرسه", gloss: "لیلا می‌پرسه: کمره‌تان را روشن می‌کنین؟", note: "یک سوال کوتاه برای گرفتن جزئیات بیشتر."}
  en.a2.unit37.lesson04.teach.a_always_but_mute: {title: "عادت دانیل در جلسه‌ها", gloss: "دانیل می‌گه: همیشه، اما وختی خودم گپ نمی‌زنم مایکروفونم را خاموش می‌کنم.", note: "*when I am not speaking* اینجه یعنی در همو لحظه‌هایی که گپ نمی‌زنم."}
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls: {title: "لیلا دربارهٔ صنف‌هایش می‌گه", gloss: "لیلا می‌گه: صنف‌های آنلاینم حالی همه ویدیو کال استن.", note: "همو صنف‌های دوشنبه و چهارشنبهٔ لیلا از واحد ۳۳."}
  en.a2.unit37.lesson04.teach.a_what_do_you_think: {title: "دانیل نظرش را می‌پرسه", gloss: "دانیل می‌پرسه: نظرتان دربارهٔ آن چیست؟", note: "*What do you think about them?* دربارهٔ نظر شما راجع به همو چیزی که تازه گفته شد می‌پرسه."}
  en.a2.unit37.lesson04.teach.q_useful_but_prefer: {title: "لیلا نظرش را می‌ته", gloss: "لیلا می‌گه: فکر می‌کنم ویدیو کال‌ها مفید استن، اما ملاقات روبه‌رو را ترجیح می‌تم.", note: "همو جملهٔ نظر که در درس دوم یاد گرفتین."}
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal: {title: "دانیل همرایش موافق استه", gloss: "دانیل می‌گه: موافقم. یک ویدیو کال از یک ملاقات تیزتر استه، اما کمتر شخصی استه.", note: "*I agree* برای موافقت گفته می‌شه؛ بعد از آن معمولاً دلیل خودتان را می‌گین."}
  en.a2.unit37.lesson04.teach.q_exactly: {title: "لیلا تأیید می‌کنه", gloss: "لیلا می‌گه: دقیقاً.", note: "*Exactly* یک شکل کوتاه گفتن اینکه کاملاً موافقین استه."}

exercises:
  en.a2.unit37.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "microphone"
    distractors: ["camera", "connection", "mute"]
    accepted_answers: [{value: "microphone", status: "correct"}]
    feedback: "*microphone* یعنی مایکروفون."
  en.a2.unit37.lesson01.exercise02.choose_mute_word:
    instruction: "کدام کلمه یعنی آوازتان را خاموش کنین تا دیگران نشنون؟"
    correct_option: "mute"
    distractors: ["camera", "connection", "headphones"]
    accepted_answers: [{value: "mute", status: "correct"}]
    feedback: "*mute* یعنی خاموش کردن آواز."
  en.a2.unit37.lesson01.exercise03.choose_connection_word:
    instruction: "کدام کلمه یعنی ارتباط کمپیوترتان همرای انترنت؟"
    correct_option: "connection"
    distractors: ["camera", "microphone", "mute"]
    accepted_answers: [{value: "connection", status: "correct"}]
    feedback: "*connection* یعنی کنکشن."
  en.a2.unit37.lesson01.exercise04.match_video_call_words:
    instruction: "هر معنی را به کلمه یا عبارت درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "a call where you can see the other people", right: "video call"}
          - {left: "the part that shows your picture", right: "camera"}
          - {left: "the part that carries your voice", right: "microphone"}
          - {left: "the link between your computer and the internet", right: "connection"}
          - {left: "to turn your sound off", right: "mute"}
          - {left: "in the same room, not on a screen", right: "face to face"}
          - {left: "happening on the internet", right: "online"}
          - {left: "when people come together to talk about work", right: "meeting"}
        status: "correct"
    feedback: "*video call*=ویدیو کال، *camera*=کمره، *microphone*=مایکروفون، *connection*=کنکشن، *mute*=خاموش کردن آواز، *face to face*=روبه‌رو، *online*=آنلاین، *meeting*=جلسه."
  en.a2.unit37.lesson01.exercise05.write_microphone:
    instruction: "کلمه‌ای را بنویسین که یعنی همو بخشی که آواز شما را می‌رسانه."
    accepted_answers:
      - {value: "microphone", status: "correct"}
      - {value: "Microphone", status: "correct"}
    feedback: "*microphone* یعنی مایکروفون."

  en.a2.unit37.lesson02.exercise01.listen_camera_request:
    instruction: "گوش کنین و جمله‌ای را که گفته شده انتخاب کنین."
    correct_option: "Can you turn on your camera"
    distractors: ["Sorry, you were on mute.", "I have a video call with my team every Monday.", "I prefer video calls to phone calls."]
    accepted_answers: [{value: "Can you turn on your camera", status: "correct"}]
    feedback: "همی یعنی: کمره‌تان را روشن کرده می‌تانین؟"
  en.a2.unit37.lesson02.exercise02.choose_weekly_call_answer:
    instruction: "کسی می‌پرسه در کارتان چند بار ویدیو کال دارین. چی می‌گین؟"
    correct_option: "I have a video call with my team every Monday."
    distractors: ["Sorry, you were on mute.", "Can you turn on your camera?", "I prefer video calls to phone calls."]
    accepted_answers: [{value: "I have a video call with my team every Monday.", status: "correct"}]
    feedback: "*every Monday* نشان می‌ته که همی یک عادت ثابت استه."
  en.a2.unit37.lesson02.exercise03.choose_mute_reply:
    instruction: "کسی در ویدیو کال گپ می‌زنه، اما هیچ‌کس آوازش را نمی‌شنوه. چی می‌گین؟"
    correct_option: "Sorry, you were on mute."
    distractors: ["Can you turn on your camera?", "I have a video call with my team every Monday.", "I prefer video calls to phone calls."]
    accepted_answers: [{value: "Sorry, you were on mute.", status: "correct"}]
    feedback: "*you were on mute* را وختی می‌گین که مایکروفون کسی خاموش بوده."
  en.a2.unit37.lesson02.exercise04.order_turn_on_camera:
    instruction: "کلمات را طوری تنظیم کنین که «کمره‌تان را روشن کرده می‌تانین؟» شود."
    accepted_answers: [{value: ["Can", "you", "turn", "on", "your", "camera"], status: "correct"}]
    feedback: "ترتیب درست *Can you turn on your camera* استه."
  en.a2.unit37.lesson02.exercise05.order_video_call_monday:
    instruction: "کلمات را طوری تنظیم کنین که «هر دوشنبه همرای تیمم یک ویدیو کال دارم» شود."
    accepted_answers: [{value: ["I", "have", "a", "video", "call", "with", "my", "team", "every", "Monday"], status: "correct"}]
    feedback: "ترتیب درست *I have a video call with my team every Monday* استه."
  en.a2.unit37.lesson02.exercise06.reply_opinion_video_calls:
    instruction: "کسی می‌پرسه نظرتان دربارهٔ ویدیو کال چیست. همرای جملهٔ نظر همی درس جواب بتین: مفید استن، اما ملاقات روبه‌رو را ترجیح می‌تین."
    accepted_answers:
      - {value: "I think video calls are useful, but I prefer meeting people face to face.", status: "correct"}
      - {value: "I think video calls are useful but I prefer meeting people face to face", status: "correct"}
    feedback: "*I think video calls are useful, but I prefer meeting people face to face* اول نظر و بعد ترجیح را می‌ته."
  en.a2.unit37.lesson02.exercise07.write_opinion_with_reason:
    instruction: "نظرتان را دربارهٔ ویدیو کال همرای I think و but I prefer بنویسین، دقیقاً مثل همی درس."
    accepted_answers:
      - {value: "I think video calls are useful, but I prefer meeting people face to face.", status: "correct"}
      - {value: "I think video calls are useful but I prefer meeting people face to face", status: "correct"}
    feedback: "*I think video calls are useful, but I prefer meeting people face to face* همو جملهٔ همی درس استه."

  en.a2.unit37.lesson03.exercise01.read_camera_habit:
    instruction: "لیلا در شروع یک صنف آنلاین چی می‌کنه؟"
    correct_option: "turn on my camera"
    distractors: ["mute my camera", "use my phone", "send a message to the teacher"]
    accepted_answers: [{value: "turn on my camera", status: "correct"}]
    feedback: "در متن نوشته *I turn on my camera*."
  en.a2.unit37.lesson03.exercise02.read_headphones_reason:
    instruction: "لیلا چرا هدفون استعمال می‌کنه؟"
    correct_option: "my connection is better with them"
    distractors: ["her classmates cannot hear her", "her camera works better", "the teacher asks for them"]
    accepted_answers: [{value: "my connection is better with them", status: "correct"}]
    feedback: "در متن نوشته *my connection is better with them*."
  en.a2.unit37.lesson03.exercise03.choose_leilas_opinion:
    instruction: "نظر لیلا دربارهٔ ویدیو کال چیست؟"
    correct_option: "video calls save a lot of time"
    distractors: ["video calls are too long", "video calls are always better", "video calls are difficult for her"]
    accepted_answers: [{value: "video calls save a lot of time", status: "correct"}]
    feedback: "در متن نوشته *video calls save a lot of time*."
  en.a2.unit37.lesson03.exercise04.choose_what_she_prefers:
    instruction: "طبق پیامش، لیلا باز هم چی را ترجیح می‌ته؟"
    correct_option: "meeting my classmates face to face"
    distractors: ["studying at home", "writing to her classmates", "having more online classes"]
    accepted_answers: [{value: "meeting my classmates face to face", status: "correct"}]
    feedback: "در متن نوشته *I still prefer meeting my classmates face to face*."
  en.a2.unit37.lesson03.exercise05.order_mute_until_question:
    instruction: "کلمات را طوری تنظیم کنین که «مایکروفونم را خاموش می‌کنم تا وختی که استاد یک سوال بپرسه» شود."
    accepted_answers: [{value: ["I", "mute", "my", "microphone", "until", "the", "teacher", "asks", "a", "question"], status: "correct"}]
    feedback: "ترتیب درست *I mute my microphone until the teacher asks a question* استه."
  en.a2.unit37.lesson03.exercise06.write_own_video_call_message:
    instruction: "جملهٔ لیلا را دربارهٔ هدفونش، همرای because، بنویسین."
    accepted_answers:
      - {value: "I use headphones because my connection is better with them.", status: "correct"}
      - {value: "I use headphones because my connection is better with them", status: "correct"}
    feedback: "*I use headphones because my connection is better with them* اول عادت و بعد دلیل را می‌ته."

  en.a2.unit37.lesson04.exercise01.listen_call_day:
    instruction: "گفتگو را گوش کنین و انتخاب کنین که دانیل کِی ویدیو کال ثابتش را داره."
    correct_option: "a video call with my team every Monday"
    distractors: ["a video call with my team every Friday", "a video call with my manager every morning", "a video call with my classmates every week"]
    accepted_answers: [{value: "a video call with my team every Monday", status: "correct"}]
    feedback: "دانیل می‌گه *a video call with my team every Monday*."
  en.a2.unit37.lesson04.exercise02.listen_camera_habit:
    instruction: "گوش کنین و انتخاب کنین که دانیل همرای مایکروفونش چی می‌کنه."
    correct_option: "I mute my microphone when I am not speaking"
    distractors: ["I turn off my camera when I am not speaking", "I use headphones in every meeting", "I never mute my microphone"]
    accepted_answers: [{value: "I mute my microphone when I am not speaking", status: "correct"}]
    feedback: "دانیل می‌گه *I mute my microphone when I am not speaking*."
  en.a2.unit37.lesson04.exercise03.choose_daniels_opinion:
    instruction: "دانیل دربارهٔ یک ویدیو کال چی می‌گه؟"
    correct_option: "faster than a visit"
    distractors: ["longer than a visit", "more personal than a visit", "better than a meeting"]
    accepted_answers: [{value: "faster than a visit", status: "correct"}]
