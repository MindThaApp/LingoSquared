      - {left: "procrastinate", right: "به تعویق انداختن (کاری را که باید کد، دیر کدن)"}
      - {left: "delay", right: "تأخیر"}
    accepted_answers:
      - value:
          - {left: "regret", right: "پشیمانی"}
          - {left: "wish", right: "آرزو کدن"}
          - {left: "mistake", right: "اشتباه"}
          - {left: "hindsight", right: "درکِ بعد از واقع شدن (فهمِ حالا دربارهٔ گذشته)"}
          - {left: "procrastinate", right: "به تعویق انداختن (کاری را که باید کد، دیر کدن)"}
