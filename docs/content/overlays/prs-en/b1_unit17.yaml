course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit17.regret: {title: "کاش زودتر کمک می‌خواستم"}

lessons:
  en.b1.unit17.lesson01.regret_vocabulary: {title: "کلمات برای پشیمانی و آرزو"}
  en.b1.unit17.lesson02.past_hypothetical_forms: {title: "کاش زودتر کمک می‌خواستم"}
  en.b1.unit17.lesson03.reading_a_reflective_message: {title: "متن خوانی: نگاه به گذشتهٔ یک ماهِ شلوغ"}
  en.b1.unit17.lesson04.the_regret_dialogue: {title: "اگه زودتر از میا می‌پرسیدم..."}

teaching:
  en.b1.unit17.lesson01.teach.regret: {title: "regret", gloss: "پشیمانی", note: "*regret* یعنی احساسِ غم دربارهٔ چیزی که کدین یا نکدین.", example_gloss: "دانیال دربارهٔ ازدست‌دادنِ ضرب‌الاجل پشیمانی احساس کد."}
  en.b1.unit17.lesson01.teach.wish: {title: "wish", gloss: "آرزو کدن", note: "*wish* یعنی خواستنِ اینکه چیزی فرق از آنچه واقعاً بود، می‌بود.", example_gloss: "دانیال یک آرزو دربارهٔ هفتهٔ گذشته داشت."}
  en.b1.unit17.lesson01.teach.mistake: {title: "mistake", gloss: "اشتباه", note: "*mistake* یعنی یک کارِ غلط که از قضاوتِ ضعیف ناشی می‌شه.", example_gloss: "صبر کدنِ طولانی برای خواستنِ کمک یک اشتباه بود."}
  en.b1.unit17.lesson01.teach.hindsight: {title: "hindsight", gloss: "درکِ بعد از واقع شدن (فهمِ حالا دربارهٔ گذشته)", note: "*hindsight* یعنی فهمِ یک رویدادِ گذشته، فقط حالا که تمام شده.", example_gloss: "in hindsight، دانیال باید زودتر حرف می‌زد."}
  en.b1.unit17.lesson01.teach.procrastinate: {title: "procrastinate", gloss: "به تعویق انداختن (کاری را که باید کد، دیر کدن)", note: "*procrastinate* یعنی انجامِ کاری را که باید کدین، دیر کدن.", example_gloss: "دانیال میل داره وقتی یک کار مشکل آواز می‌ته، procrastinate کنه."}
  en.b1.unit17.lesson01.teach.delay: {title: "delay", gloss: "تأخیر", note: "*delay* یعنی مدتِ وقتی که یک چیز دیرتر از پلان می‌شه.", example_gloss: "تأخیر باعث شد دانیال اولین ضرب‌الاجلش را از دست بته."}

  en.b1.unit17.lesson02.teach.wish_had_asked: {title: "I wish I had asked for help sooner.", gloss: "کاش زودتر کمک می‌خواستم.", note: "*I wish + past perfect* یک آرزو دربارهٔ چیزی که در گذشته واقع نشد، نشان می‌ته."}
  en.b1.unit17.lesson02.teach.should_have_talked: {title: "I should have talked to my manager earlier.", gloss: "باید زودتر با مدیرم صحبت می‌کدم.", note: "*should have + past participle* یعنی حالا فکر می‌کنین کارِ درست چی بود."}
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished: {title: "If I had asked Mia for help in week one, I would have finished on time.", gloss: "اگه در هفتهٔ اول از میا کمک می‌خواستم، به‌وقت تمام می‌کدم.", note: "*if + past perfect, would have + past participle* یک نتیجهٔ فرضی در گذشته نشان می‌ته."}
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical: {title: "قاعدهٔ فرضِ گذشته", gloss: "برای بیانِ پشیمانی دربارهٔ گذشته، از wish + past perfect (I wish I had asked...)، should have + past participle (I should have talked...)، یا if + past perfect با would have + past participle (If I had asked..., I would have finished...) استفاده کنین. همی سه شکل چیزی را نشان می‌تن که واقعاً واقع نشد.", note: "همی سه شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit17.lesson03.teach.looking_back: {title: "looking back", gloss: "نگاه کدن به گذشته", note: "*looking back* یک جمله را با نگاهی به گذشته شروع می‌ته.", example_gloss: "Looking back، دانیال آرزو داره که زودتر کمک می‌خواست."}
  en.b1.unit17.lesson03.teach.missed_deadline: {title: "missed deadline", gloss: "ضرب‌الاجلِ ازدست‌رفته", note: "*missed deadline* یعنی یک تاریخِ آخری که به‌وقت رعایت نشد.", example_gloss: "دانیال قبل از خواستنِ کمک، یک ضرب‌الاجل را از دست داد."}
  en.b1.unit17.lesson03.teach.reading_passage: {title: "متن دربارهٔ نگاه به گذشتهٔ یک ماهِ شلوغ", gloss: "سلام لیلا، looking back، کاش زودتر کمک می‌خواستم. باید زودتر دربارهٔ کارِ زیادم با مدیرم صحبت می‌کدم. تا وقتی که همینه را کدم، یک ضرب‌الاجل را از قبل از دست داده بودم. اگه در هفتهٔ اول از میا کمک می‌خواستم، هر دو پروژه را به‌وقت تمام می‌کدم. صبر کدنِ طولانی یک اشتباه بود. دانیال", note: "همی متن wish، should have، و if...would have را باهم استفاده می‌ته."}

  en.b1.unit17.lesson04.teach.q_wish_asked_sooner: {title: "پرسش دانیال", gloss: "دانیال می‌گه: looking back، کاش زودتر کمک می‌خواستم.", note: "*I wish I had asked* یک آرزو دربارهٔ گذشته نشان می‌ته."}
  en.b1.unit17.lesson04.teach.a_what_happened: {title: "جواب لیلا", gloss: "لیلا می‌گه: چی واقع شد؟", note: "*What happened?* یک پرسشِ ساده دربارهٔ گذشته است."}
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed: {title: "جواب دانیال", gloss: "دانیال می‌گه: باید زودتر دربارهٔ کارِ زیادم با مدیرم صحبت می‌کدم. تا وقتی که همینه را کدم، یک ضرب‌الاجل را از قبل از دست داده بودم.", note: "*should have* و *had already missed* باهم استفاده شدن."}
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed: {title: "پرسش لیلا", gloss: "لیلا می‌گه: همی یک پشیمانیِ منصفانه است، اما آخر کارش را درست کدی.", note: "*a fair regret* یعنی یک پشیمانیِ منطقی."}
  en.b1.unit17.lesson04.teach.q_true_if_had_asked: {title: "جواب دانیال", gloss: "دانیال می‌گه: راست است. اگه در هفتهٔ اول از میا کمک می‌خواستم، هر دو پروژه را به‌وقت تمام می‌کدم.", note: "*if + past perfect, would have* اینجه یک نتیجهٔ فرضی نشان می‌ته."}
  en.b1.unit17.lesson04.teach.a_now_you_know: {title: "جواب لیلا", gloss: "لیلا می‌گه: خب، حالی برای دفعهٔ بعد می‌دانی.", note: "*now you know for next time* یک تشویقِ آینده‌نگر است."}

exercises:
  en.b1.unit17.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شد انتخاب کنین."
    correct_option: "hindsight"
    distractors: ["regret", "wish", "mistake"]
    accepted_answers: [{value: "hindsight", status: "correct"}]
    feedback: "*hindsight* یعنی درکِ بعد از واقع شدن."
  en.b1.unit17.lesson01.exercise02.choose_regret:
    instruction: "کدام کلمه یعنی احساسِ غم دربارهٔ چیزی که کدین یا نکدین؟"
    correct_option: "regret"
    distractors: ["wish", "mistake", "delay"]
    accepted_answers: [{value: "regret", status: "correct"}]
    feedback: "*regret* یعنی پشیمانی."
  en.b1.unit17.lesson01.exercise03.choose_procrastinate:
    instruction: "کدام کلمه یعنی انجامِ کاری را که باید کدین، دیر کدن؟"
    correct_option: "procrastinate"
    distractors: ["hindsight", "mistake", "regret"]
    accepted_answers: [{value: "procrastinate", status: "correct"}]
    feedback: "*procrastinate* یعنی به تعویق انداختن."
  en.b1.unit17.lesson01.exercise04.match_regret_words:
    instruction: "هر معنی را به کلمهٔ درست انگلیسی وصل کنین."
    accepted_answers:
      - value:
          - {left: "a feeling of sadness about something you did or did not do", right: "regret"}
          - {left: "a desire for something to be different from how it actually was", right: "wish"}
          - {left: "a wrong action caused by poor judgment", right: "mistake"}
          - {left: "understanding of a past event only now that it is over", right: "hindsight"}
          - {left: "to delay doing something you should be doing", right: "procrastinate"}
          - {left: "a period of time by which something is made later than planned", right: "delay"}
        status: "correct"
    feedback: "*regret*=پشیمانی، *wish*=آرزو کدن، *mistake*=اشتباه، *hindsight*=درکِ بعد از واقع شدن، *procrastinate*=به تعویق انداختن، *delay*=تأخیر."
  en.b1.unit17.lesson01.exercise05.write_mistake:
    instruction: "کلمه‌ای را که یعنی یک کارِ غلط که از قضاوتِ ضعیف ناشی می‌شه بنویسین."
    accepted_answers:
      - {value: "mistake", status: "correct"}
      - {value: "Mistake", status: "correct"}
    feedback: "*mistake* یعنی اشتباه."

  en.b1.unit17.lesson02.exercise01.choose_wish_had_asked:
    instruction: "کدام جمله یک آرزو دربارهٔ چیزی که در گذشته واقع نشد، نشان می‌ته؟"
    correct_option: "I wish I had asked for help sooner."
    distractors: ["I should have talked to my manager earlier.", "If I had asked Mia for help in week one, I would have finished on time.", "That's a fair regret, but you fixed it in the end."]
    accepted_answers: [{value: "I wish I had asked for help sooner.", status: "correct"}]
    feedback: "*I wish I had asked for help sooner* یعنی کاش زودتر کمک می‌خواستم."
  en.b1.unit17.lesson02.exercise02.choose_should_have_talked:
    instruction: "کدام جمله می‌گه که گوینده حالا فکر می‌کنه کارِ درست چی بود که زودتر باید می‌کد؟"
    correct_option: "I should have talked to my manager earlier."
    distractors: ["I wish I had asked for help sooner.", "If I had asked Mia for help in week one, I would have finished on time.", "Well, now you know for next time."]
    accepted_answers: [{value: "I should have talked to my manager earlier.", status: "correct"}]
    feedback: "*I should have talked to my manager earlier* یعنی باید زودتر با مدیرم صحبت می‌کدم."
  en.b1.unit17.lesson02.exercise03.order_should_have_talked:
    instruction: "کلمات را طوری تنظیم کنین که «باید زودتر با مدیرم صحبت می‌کدم» شود."
    accepted_answers: [{value: ["I", "should", "have", "talked", "to", "my", "manager", "earlier"], status: "correct"}]
    feedback: "ترتیب درست *I should have talked to my manager earlier* است."
  en.b1.unit17.lesson02.exercise04.reply_express_regret:
    instruction: "پشیمانی نشان بتین که زودتر کمک نخواستین، با 'I wish I had' آغاز کنین."
    accepted_answers:
      - {value: "I wish I had asked for help sooner.", status: "correct"}
      - {value: "I wish I had asked for help sooner", status: "correct"}
    feedback: "*I wish I had asked for help sooner* یعنی کاش زودتر کمک می‌خواستم."
  en.b1.unit17.lesson02.exercise05.write_if_had_asked_would_have_finished:
    instruction: "یک جمله بنویسین که بگه اگه در هفتهٔ اول از میا کمک می‌خواستین، به‌وقت تمام می‌کدین، با 'If I had asked Mia' آغاز کنین."
    accepted_answers:
      - {value: "If I had asked Mia for help in week one, I would have finished on time.", status: "correct"}
      - {value: "If I had asked Mia for help in week one, I would have finished on time", status: "correct"}
    feedback: "*If I had asked Mia for help in week one, I would have finished on time* یعنی اگه در هفتهٔ اول از میا کمک می‌خواستم، به‌وقت تمام می‌کدم."

  en.b1.unit17.lesson03.exercise01.comprehend_what_happened:
    instruction: "قبل از اینکه دانیال با مدیرش صحبت کنه، واقعاً چی واقع شد؟"
    correct_option: "I had already missed one deadline"
    distractors: ["he had already finished both projects", "he had already quit the evening class", "he had already talked to Mia"]
    accepted_answers: [{value: "I had already missed one deadline", status: "correct"}]
    feedback: "متن می‌گه *I had already missed one deadline*."
  en.b1.unit17.lesson03.exercise02.comprehend_wished_for:
    instruction: "دانیال آرزو داره که چی کارِ متفاوتی می‌کد؟"
    correct_option: "asked Mia for help in week one"
    distractors: ["talked to his manager sooner about a raise", "canceled both projects", "skipped the evening class from the start"]
    accepted_answers: [{value: "asked Mia for help in week one", status: "correct"}]
    feedback: "متن می‌گه *asked Mia for help in week one*."
  en.b1.unit17.lesson03.exercise03.recognize_missed_deadline:
    instruction: "کدام عبارت یعنی یک تاریخِ آخری که به‌وقت رعایت نشد؟"
    correct_option: "missed deadline"
    distractors: ["looking back", "hindsight", "workload"]
    accepted_answers: [{value: "missed deadline", status: "correct"}]
    feedback: "*missed deadline* یعنی ضرب‌الاجلِ ازدست‌رفته."
  en.b1.unit17.lesson03.exercise04.order_looking_back_wish:
    instruction: "کلمات را طوری تنظیم کنین که «looking back، کاش زودتر کمک می‌خواستم» شود."
    accepted_answers: [{value: ["Looking", "back", "I", "wish", "I", "had", "asked", "for", "help", "sooner"], status: "correct"}]
    feedback: "ترتیب درست *Looking back, I wish I had asked for help sooner* است."
  en.b1.unit17.lesson03.exercise05.write_mistake_to_wait:
    instruction: "یک جمله بنویسین که بگه صبر کدنِ طولانی یک اشتباه بود، با 'It was a mistake' آغاز کنین."
    accepted_answers:
      - {value: "It was a mistake to wait so long.", status: "correct"}
      - {value: "It was a mistake to wait so long", status: "correct"}
    feedback: "*It was a mistake to wait so long* یعنی صبر کدنِ طولانی یک اشتباه بود."

  en.b1.unit17.lesson04.exercise01.listen_wish_asked_sooner:
    instruction: "گفتگو را گوش کنین و بگین دانیال دربارهٔ چی پشیمان است."
    correct_option: "I wish I had asked for help sooner"
    distractors: ["missing his evening class entirely", "choosing the wrong project to lead", "disagreeing with Leila's opinion"]
    accepted_answers: [{value: "I wish I had asked for help sooner", status: "correct"}]
    feedback: "دانیال می‌گه *I wish I had asked for help sooner*."
  en.b1.unit17.lesson04.exercise02.listen_missed_deadline:
    instruction: "گوش کنین و بگین دانیال چی واقعاً واقع شد را می‌گه."
    correct_option: "I had already missed one deadline"
    distractors: ["he had already finished the report early", "he had already talked to Mia", "he had already quit the evening class"]
    accepted_answers: [{value: "I had already missed one deadline", status: "correct"}]
    feedback: "دانیال می‌گه *I had already missed one deadline*."
  en.b1.unit17.lesson04.exercise03.choose_would_have_finished:
    instruction: "دانیال می‌گه اگه در هفتهٔ اول از میا کمک می‌خواست، چی واقع می‌شد؟"
    correct_option: "I would have finished both projects on time."
    distractors: ["he would have canceled the evening class", "he would have asked for a longer deadline instead", "he would have given the project to Leila"]
    accepted_answers: [{value: "I would have finished both projects on time.", status: "correct"}]
    feedback: "دانیال می‌گه *I would have finished both projects on time*."
  en.b1.unit17.lesson04.exercise04.order_now_you_know:
    instruction: "کلمات را طوری تنظیم کنین که «خب، حالی برای دفعهٔ بعد می‌دانی» شود."
    accepted_answers: [{value: ["Well", "now", "you", "know", "for", "next", "time"], status: "correct"}]
    feedback: "ترتیب درست *Well, now you know for next time* است."
  en.b1.unit17.lesson04.exercise05.reply_as_daniel:
    instruction: "لیلا می‌گه: همی یک پشیمانیِ منصفانه است، اما آخر کارش را درست کدی."
    accepted_answers:
      - {value: "If I had asked Mia for help in week one, I would have finished both projects on time.", status: "correct"}
      - {value: "If I had asked Mia for help in week one, I would have finished both projects on time", status: "correct"}
    feedback: "*If I had asked Mia for help in week one, I would have finished both projects on time* یعنی اگه در هفتهٔ اول از میا کمک می‌خواستم، هر دو پروژه را به‌وقت تمام می‌کدم."
  en.b1.unit17.lesson04.exercise06.speak_regret_dialogue:
    instruction: "لیلا می‌گه: چی واقع شد؟"
    accepted_answers:
      - {value: "I should have talked to my manager earlier about the workload.", status: "correct"}
      - {value: "I should have talked to my manager earlier about the workload", status: "correct"}
    feedback: "*I should have talked to my manager earlier about the workload* یعنی باید زودتر دربارهٔ کارِ زیادم با مدیرم صحبت می‌کدم."
