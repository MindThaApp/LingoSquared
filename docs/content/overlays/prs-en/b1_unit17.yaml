course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح B1 برای مکالمهٔ روزمرهٔ بیشتر جزئیات‌دار، با توضیحاتی که به دری آشناست."

units:
  en.b1.unit17.regret: {title: "کاش زودتر کمک خواسته بودم"}

lessons:
  en.b1.unit17.lesson01.regret_vocabulary: {title: "کلمات برای پشیمانی و آرزو"}
  en.b1.unit17.lesson02.past_hypothetical_forms: {title: "کاش زودتر کمک خواسته بودم"}
  en.b1.unit17.lesson03.reading_a_reflective_message: {title: "متن خوانی: نگاه به گذشتهٔ یک ماهِ شلوغ"}
  en.b1.unit17.lesson04.the_regret_dialogue: {title: "اگه زودتر از میا کمک خواسته بودم..."}

teaching:
  en.b1.unit17.lesson01.teach.regret: {title: "regret", gloss: "پشیمانی", note: "*regret* یعنی احساسِ غم دربارهٔ چیزی که کدین یا نکدین.", example_gloss: "دنیل دربارهٔ ازدست‌دادنِ ضرب‌الاجل پشیمانی احساس کد."}
  en.b1.unit17.lesson01.teach.wish: {title: "wish", gloss: "آرزو کدن", note: "*wish* یعنی خواستنِ اینکه چیزی فرق از آنچه واقعاً بود، می‌بود.", example_gloss: "دنیل یک آرزو دربارهٔ هفتهٔ گذشته داشت."}
  en.b1.unit17.lesson01.teach.mistake: {title: "mistake", gloss: "اشتباه", note: "*mistake* یعنی یک کارِ غلط که از قضاوتِ ضعیف ناشی می‌شه.", example_gloss: "صبر کدنِ طولانی برای خواستنِ کمک یک اشتباه بود."}
  en.b1.unit17.lesson01.teach.hindsight: {title: "hindsight", gloss: "درکِ بعد از واقع شدن (فهمِ حالا دربارهٔ گذشته)", note: "*hindsight* یعنی فهمِ یک رویدادِ گذشته، فقط حالا که تمام شده.", example_gloss: "حالا که فکرش را می‌کنه، دنیل باید زودتر حرف می‌زد."}
  en.b1.unit17.lesson01.teach.procrastinate: {title: "procrastinate", gloss: "به تعویق انداختن (کاری را که باید کد، دیر کدن)", note: "*procrastinate* یعنی انجامِ کاری را که باید کدین، دیر کدن.", example_gloss: "دنیل وقتی یک کار مشکل معلوم شه، اکثراً آن را به تعویق می‌اندازه."}
  en.b1.unit17.lesson01.teach.delay: {title: "delay", gloss: "تأخیر", note: "*delay* یعنی مدتِ وقتی که یک چیز دیرتر از پلان می‌شه.", example_gloss: "تأخیر باعث شد دنیل اولین ضرب‌الاجلش را از دست بته."}

  en.b1.unit17.lesson02.teach.wish_had_asked: {title: "I wish I had asked for help sooner.", gloss: "کاش زودتر کمک خواسته بودم.", note: "*I wish + past perfect* یک آرزو دربارهٔ چیزی که در گذشته واقع نشد، نشان می‌ته."}
  en.b1.unit17.lesson02.teach.should_have_talked: {title: "I should have talked to my manager earlier.", gloss: "باید زودتر با مدیرم صحبت می‌کدم.", note: "*should have + past participle* یعنی حالا فکر می‌کنین کارِ درست چی بود."}
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished: {title: "If I had asked Mia for help in week one, I would have finished on time.", gloss: "اگه در هفتهٔ اول از میا کمک خواسته بودم، به‌وقت تمام کده بودم.", note: "*if + past perfect, would have + past participle* یک نتیجهٔ فرضی در گذشته نشان می‌ته."}
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical: {title: "قاعدهٔ فرضِ گذشته", gloss: "برای بیانِ پشیمانی دربارهٔ گذشته، از wish + past perfect (I wish I had asked...)، should have + past participle (I should have talked...)، یا if + past perfect با would have + past participle (If I had asked..., I would have finished...) استفاده کنین. همی سه شکل چیزی را نشان می‌تن که واقعاً واقع نشد.", note: "همی سه شکل با هم فرق دارن، حتی اگه معنای‌شان نزدیک باشه."}

  en.b1.unit17.lesson03.teach.looking_back: {title: "looking back", gloss: "نگاه کدن به گذشته", note: "*looking back* یک جمله را با نگاهی به گذشته شروع می‌کنه.", example_gloss: "حالا که به گذشته نگاه می‌کنه، دنیل آرزو داره که کاش زودتر کمک خواسته بود."}
  en.b1.unit17.lesson03.teach.missed_deadline: {title: "missed deadline", gloss: "ضرب‌الاجلِ ازدست‌رفته", note: "*missed deadline* یعنی یک تاریخِ آخری که به‌وقت رعایت نشد.", example_gloss: "دنیل قبل از خواستنِ کمک، یک ضرب‌الاجل را از دست داد."}
  en.b1.unit17.lesson03.teach.reading_passage: {title: "متن دربارهٔ نگاه به گذشتهٔ یک ماهِ شلوغ", gloss: "سلام لیلا، حالا که به گذشته نگاه می‌کنم، کاش زودتر کمک خواسته بودم. باید زودتر دربارهٔ کارِ زیادم با مدیرم صحبت می‌کدم. تا وقتی که همی کار را کدم، یک ضرب‌الاجل را از قبل از دست داده بودم. اگه در هفتهٔ اول از میا کمک خواسته بودم، هر دو پروژه را به‌وقت تمام کده بودم. صبر کدنِ طولانی یک اشتباه بود. دنیل", note: "همی متن wish، should have، و if...would have را باهم استفاده می‌کنه."}

  en.b1.unit17.lesson04.teach.q_wish_asked_sooner: {title: "حرف دنیل", gloss: "دنیل می‌گه: حالا که به گذشته نگاه می‌کنم، کاش زودتر کمک خواسته بودم.", note: "*I wish I had asked* یک آرزو دربارهٔ گذشته نشان می‌ته."}
  en.b1.unit17.lesson04.teach.a_what_happened: {title: "جواب لیلا", gloss: "لیلا می‌گه: چی واقع شد؟", note: "*What happened?* یک سوالِ ساده دربارهٔ گذشته استه."}
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed: {title: "جواب دنیل", gloss: "دنیل می‌گه: باید زودتر دربارهٔ کارِ زیادم با مدیرم صحبت می‌کدم. تا وقتی که همی کار را کدم، یک ضرب‌الاجل را از قبل از دست داده بودم.", note: "*should have* و *had already missed* باهم استفاده شدن."}
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed: {title: "جواب لیلا", gloss: "لیلا می‌گه: همی یک پشیمانیِ بجا استه، اما آخر کارش را درست کدی.", note: "*a fair regret* یعنی یک پشیمانیِ منطقی."}
  en.b1.unit17.lesson04.teach.q_true_if_had_asked: {title: "جواب دنیل", gloss: "دنیل می‌گه: راست استه. اگه در هفتهٔ اول از میا کمک خواسته بودم، هر دو پروژه را به‌وقت تمام کده بودم.", note: "*if + past perfect, would have* اینجه یک نتیجهٔ فرضی نشان می‌ته."}
  en.b1.unit17.lesson04.teach.a_now_you_know: {title: "جواب لیلا", gloss: "لیلا می‌گه: خب، حالی برای دفعهٔ بعد می‌دانی.", note: "*now you know for next time* یک تشویقِ آینده‌نگر استه."}

