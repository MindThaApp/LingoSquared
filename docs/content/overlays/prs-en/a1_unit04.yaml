  en.a1.unit04.lesson03.teach.its_tuesday_july_7: {title: "سه‌شنبه، هفت جولای", gloss: "سه‌شنبه، هفت جولای استه", note: "روز هفته پیش از تاریخ کامل می‌آیه: [روز هفته]، [ماه] [روز]."}
  en.a1.unit04.lesson03.teach.numeric_form: {title: "نوشتن تاریخ به شکل رقمی", gloss: "می‌تانین به شکل ۷/۷ هم بنویسینش", note: "در امریکا فارمت رقمی تاریخ ماه/روز استه (7/7)، نی روز/ماه مثل افغانستان؛ همی فرق باعث سوءفهم می‌شه، مثلاً 7/9 یعنی نُه جولای، نی هفت سپتمبر."}
  en.a1.unit04.lesson03.teach.birthday_question: {title: "سالگره‌تان کی استه؟", gloss: "سالگره‌تان کی استه؟", note: "When's your birthday? برای پرسیدن تاریخ سالگره استعمال می‌شه."}
  en.a1.unit04.lesson03.teach.birthday_answer: {title: "سه مارچ", gloss: "سالگره‌ام سه مارچ استه", note: "My birthday is March 3rd؛ بعد از is اول ماه و بعد روز می‌آیه، و روز معمولاً به شکل ترتیبی (3rd = third) خوانده می‌شه."}

  en.a1.unit04.lesson04.teach.opens: {title: "باز شدن", gloss: "باز می‌شه", note: "opens شکل سوم‌شخص مفرد فعل open (باز شدن) استه.", example_gloss: "کتابخانه پنجشنبه‌ها باز می‌شه."}
  en.a1.unit04.lesson04.teach.again: {title: "دوباره", gloss: "دوباره", note: "again یعنی دوباره یا بازهم.", example_gloss: "به‌زودی بازهم می‌بینمتان!"}
  en.a1.unit04.lesson04.teach.q_date: {title: "پرسیدن تاریخ امروز", gloss: "دنیل می‌پرسه امروز چندم استه", note: "همو سوال درس قبل استه، اینجا در یک گفتگوی واقعی."}
  en.a1.unit04.lesson04.teach.a_date: {title: "جواب تاریخ", gloss: "لیلا می‌گه سه‌شنبه، هفت جولای استه", note: "جواب کامل هم روز هفته و هم تاریخ ماه را شامل می‌شه."}
  en.a1.unit04.lesson04.teach.q_library: {title: "پرسیدن زمان بازشدن دوباره", gloss: "دنیل می‌پرسه کتابخانه کی دوباره باز می‌شه", note: "When's the library open again? دربارهٔ تاریخ آیندهٔ بازشدن می‌پرسه."}
  en.a1.unit04.lesson04.teach.a_library: {title: "جواب بازشدن", gloss: "لیلا می‌گه پنجشنبه نُه جولای باز می‌شه", note: "It opens on Thursday, July 9th؛ حرف اضافهٔ on پیش از روز هفته می‌آیه."}
  en.a1.unit04.lesson04.teach.closing: {title: "ختم‌کردن گفتگو", gloss: "دنیل می‌گه عالی، همو وقت می‌بینمتان", note: "See you then یعنی «همو وقت می‌بینمتان» برای ختم‌کردن گفتگوی وعده."}

