  en.a1.unit04.lesson03.teach.whats_the_date: {title: "امروز چندم استه؟", gloss: "تاریخ امروز چندم استه؟", note: "What's today's date? دقیق‌تر از What day is it استه، چون تاریخ کامل (روز، ماه، سال) را می‌پرسه."}
