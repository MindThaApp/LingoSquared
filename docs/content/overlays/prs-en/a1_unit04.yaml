  en.a1.unit04.lesson02.teach.march: {title: "مارچ", gloss: "مارچ", note: "March سومین ماه سال میلادی استه.", example_gloss: "سالگره‌ام در مارچ استه."}
  en.a1.unit04.lesson02.teach.july: {title: "جولای", gloss: "جولای", note: "July هفتمین ماه سال میلادی استه.", example_gloss: "سالگره‌ام در جولای استه."}
  en.a1.unit04.lesson02.teach.september: {title: "سپتمبر", gloss: "سپتمبر", note: "September نُهمین ماه سال میلادی استه.", example_gloss: "سالگره‌ام در سپتمبر استه."}
  en.a1.unit04.lesson02.teach.december: {title: "دسمبر", gloss: "دسمبر", note: "December آخرین ماه سال میلادی استه.", example_gloss: "سالگره‌ام در دسمبر استه."}
