  en.a1.unit04.lesson01.teach.tuesday: {title: "سه‌شنبه", gloss: "سه‌شنبه", note: "Tuesday یعنی سه‌شنبه.", example_gloss: "من سه‌شنبه‌ها وقت دارم."}
  en.a1.unit04.lesson01.teach.wednesday: {title: "چارشنبه", gloss: "چارشنبه", note: "Wednesday یعنی چارشنبه؛ حرف d در گفتار به‌زوری شنیده می‌شه.", example_gloss: "من چارشنبه‌ها وقت دارم."}
  en.a1.unit04.lesson01.teach.thursday: {title: "پنجشنبه", gloss: "پنجشنبه", note: "Thursday یعنی پنجشنبه.", example_gloss: "من پنجشنبه‌ها وقت دارم."}
  en.a1.unit04.lesson01.teach.friday: {title: "جمعه", gloss: "جمعه", note: "Friday یعنی جمعه؛ در تقویم امریکایی یک روز کاری معمولی استه، نی رخصتی رسمی.", example_gloss: "من جمعه‌ها وقت دارم."}
  en.a1.unit04.lesson01.teach.saturday: {title: "شنبه", gloss: "شنبه", note: "Saturday یعنی شنبه؛ در تقویم امریکایی جزو آخر هفته (weekend) استه.", example_gloss: "من شنبه‌ها وقت دارم."}
  en.a1.unit04.lesson01.teach.sunday: {title: "یکشنبه", gloss: "یکشنبه", note: "Sunday یعنی یکشنبه؛ در تقویم امریکایی جزو آخر هفته (weekend) استه، و در بسیاری تقویم‌های امریکایی هفته از همی روز شروع می‌شه.", example_gloss: "من یکشنبه‌ها وقت دارم."}
  en.a1.unit04.lesson01.teach.what_day: {title: "امروز کدام روز استه؟", gloss: "امروز کدام روز استه؟", note: "What day is it today? دربارهٔ روز هفته می‌پرسه، نی تاریخ کامل."}

