teaching:
  es.a1.unit14.lesson01.teach.el_apartamento:
    title: Mieszkanie
    gloss: mieszkanie
    note: '*Apartamento* jest rodzaju męskiego.'
    example_gloss: Mieszkam w małym mieszkaniu.
  es.a1.unit14.lesson01.teach.la_cocina:
    title: Kuchnia
    gloss: kuchnia
    note: 'Zobacz notatkę gramatyczną poniżej o innym znaczeniu tego słowa: „gotowanie”.'
    example_gloss: Moja kuchnia jest bardzo mała.
  es.a1.unit14.lesson01.teach.el_dormitorio:
    title: Sypialnia
    gloss: sypialnia
    note: '*Dormitorio* jest rodzaju męskiego i pochodzi od *dormir* (spać).'
    example_gloss: W sypialni stoi duże łóżko.
  es.a1.unit14.lesson01.teach.el_bano:
    title: Łazienka
    gloss: łazienka
    note: '*Baño* jest rodzaju męskiego.'
    example_gloss: Mieszkanie ma jedną łazienkę.
  es.a1.unit14.lesson01.teach.la_sala:
    title: Salon
    gloss: salon
    note: '*Sala* jest rodzaju żeńskiego.'
    example_gloss: Oglądamy telewizję w salonie.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: pomieszczenie czy gotowanie'
    gloss: Czym się różni la cocina (kuchnia) od cocinar (gotować).
    note: Zobacz treść karty.
    target_text: '*La cocina* oznacza tu „kuchnię” (pomieszczenie). To inne znaczenie niż *cocina*/*cocinar* (gotowanie/gotować), które pojawiało się dotąd w całej historii w odniesieniu do warsztatów. Kontekst pozwala je odróżnić: w *taller de cocina* chodzi o gotowanie; *la cocina* w domu lub mieszkaniu to pomieszczenie; *cocinar* to czasownik „gotować”.'
  es.a1.unit14.lesson02.teach.alquilar:
    title: Wynajmować
    gloss: wynajmować
    note: Bezokolicznik użyty w *quiero alquilar* (chcę wynająć).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: Budynek
    gloss: budynek
    note: '*Edificio* jest rodzaju męskiego.'
    example_gloss: Budynek znajduje się blisko parku.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Wolny / niezamieszkany
    gloss: wolny / niezamieszkany
    note: '*Desocupado* opisuje lokal do wynajęcia, który jest pusty i dostępny.'
  es.a1.unit14.lesson02.teach.grande:
    title: Duży
    gloss: duży
    note: '*Grande* nie zmienia formy w zależności od rodzaju (w przeciwieństwie do przymiotników na -o/-a).'
  es.a1.unit14.lesson02.teach.pequeno:
    title: Mały
    gloss: mały
    note: '*Pequeño/pequeña* – przeciwieństwo *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Pytanie o liczbę sypialni
    gloss: Ile ma sypialni?
    note: '*¿Cuántos...tiene?* (ile... ma?) to typowy wzór pytania o cechy miejsca.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: Opis sypialni i kuchni
    gloss: Ma dwie sypialnie i dużą kuchnię.
    note: '*Tiene* (ma) + liczba + rzeczownik, tu z *dormitorio*, *cocina* i *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Wyrażanie celu poszukiwań
    gloss: Chcę wynająć mieszkanie z dużą kuchnią.
    note: '*Quiero* (chcę) + bezokolicznik *alquilar*, a *con* (z) wprowadza pożądaną cechę.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Wyjaśnienie korzyści
    gloss: Dzięki temu możesz też gotować w domu.
    note: '*Así* (dzięki temu) + *puedes* (możesz) + bezokolicznik wiąże cel mieszkaniowy z motywem gotowania z całej historii.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Czytamy ogłoszenie o mieszkaniu
    gloss: Wolne mieszkanie w budynku blisko parku. Ma dwie sypialnie, łazienkę, salon i dużą kuchnię. Jest idealne dla kogoś, kto chce gotować w domu.
    note: Realistyczne ogłoszenie w stylu ogłoszeń drobnych.
    glosses:
      desocupado: wolny / niezamieszkany
      edificio: budynek
      cerca: blisko
      parque: park
      Tiene: ma (od tener)
      dormitorios: sypialnie
      baño: łazienka
      sala: salon
      grande: duży
      perfecto: idealny
      quiere: chce (od querer)
      cocinar: gotować
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Jak zdanie względne opisuje idealnego najemcę.
    note: Zobacz treść karty.
    target_text: '*Para alguien que quiere* (dla kogoś, kto chce) łączy *alguien* (ktoś) i *que* (kto, który), aby wprowadzić zdanie względne. To częsty wzór w ogłoszeniach opisujących idealnego najemcę.'
  es.a1.unit14.lesson06.teach.line01:
    title: Przedstawienie problemu i celu
    gloss: Mateo mówi, że jego kuchnia jest bardzo mała i że chce wynająć mieszkanie z dużą kuchnią.
    note: Łączy *mi cocina es muy pequeña* (moja kuchnia jest bardzo mała) ze zdaniem o celu *quiero alquilar un apartamento con una cocina grande* (chcę wynająć mieszkanie z dużą kuchnią).
  es.a1.unit14.lesson06.teach.line02:
    title: Propozycja sprawdzenia ogłoszeń
    gloss: Elena proponuje, żeby zajrzeć do gazety – jest tam dużo ogłoszeń.
    note: '*El periódico* (gazeta) i *anuncios* (ogłoszenia) to nowe słownictwo z ogłoszeń drobnych, używane w prawdziwym życiu.'
  es.a1.unit14.lesson06.teach.line03:
    title: Znalezienie ogłoszenia
    gloss: Mateo znajduje budynek z wolnym mieszkaniem.
    note: '*Este edificio* (ten budynek) i *desocupado* (wolny, dostępny).'
  es.a1.unit14.lesson06.teach.line04:
    title: Pytanie o sypialnie
    gloss: Elena pyta, ile ono ma sypialni.
    note: Typowe pytanie o cechy miejsca.
  es.a1.unit14.lesson06.teach.line05:
    title: Odpowiedź ze szczegółami
    gloss: Mateo mówi, że mieszkanie ma dwie sypialnie i dużą kuchnię.
    note: '*Tiene* (ma) + liczba + rzeczownik.'
  es.a1.unit14.lesson06.teach.line06:
    title: Potwierdzenie kolejnych cech
    gloss: Elena jest zachwycona i zauważa, że mieszkanie ma też łazienkę i salon.
    note: '*Baño* (łazienka) i *sala* (salon) uzupełniają listę pomieszczeń; *también* (też, także) stoi na końcu.'
  es.a1.unit14.lesson06.teach.line07:
    title: Decyzja o telefonie
    gloss: Mateo postanawia jeszcze dziś zadzwonić do agencji.
    note: '*Voy a llamar* (zadzwonię, mam zamiar zadzwonić) + *hoy mismo* (jeszcze dziś, właśnie dzisiaj); *la agencia* to agencja wynajmu.'
  es.a1.unit14.lesson06.teach.line08:
    title: Aprobata i zakończenie sceny
    gloss: Elena przytakuje i zauważa, że w domu też będzie mógł gotować.
    note: '*Así puedes cocinar en casa también* (dzięki temu możesz też gotować w domu) kończy scenę.'
