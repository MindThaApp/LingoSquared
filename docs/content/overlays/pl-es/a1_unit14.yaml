course:
  title: Hiszpański A1
  description: 'Opisywanie domu. Ciąg dalszy historii Eleny i Matea: Elena pomaga Mateowi przeglądać ogłoszenia w gazecie w poszukiwaniu nowego mieszkania z większą kuchnią.'
