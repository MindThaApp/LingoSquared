teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Zdenerwowany
    gloss: zdenerwowany
    note: '*Nervioso* (rodzaj męski) / *nerviosa* (rodzaj żeński) – typowa para przymiotników na -o/-a.'
    example_gloss:
    - Mateo jest zdenerwowany.
    - Elena jest zdenerwowana.
  es.a1.unit12.lesson01.teach.contento:
    title: Zadowolony
    gloss: zadowolony
    note: '*Contento/contenta* opisuje uczucie radości lub zadowolenia, a nie stałą cechę.'
    example_gloss:
    - Mateo jest zadowolony.
    - Elena jest zadowolona.
  es.a1.unit12.lesson01.teach.cansado:
    title: Zmęczony
    gloss: zmęczony
    note: '*Cansado/cansada*, od czasownika *cansar* (męczyć).'
    example_gloss:
    - Po warsztatach jestem zmęczony. (mężczyzna)
    - Po warsztatach jestem zmęczona. (kobieta)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Zmartwiony
    gloss: zmartwiony
    note: '*Preocupado/preocupada*, od czasownika *preocupar* (martwić).'
    example_gloss:
    - Mateo jest zmartwiony.
    - Elena jest zmartwiona.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Dumny
    gloss: dumny
    note: '*Orgulloso/orgullosa* – w *estoy orgulloso/a de...* (jestem dumny z...) przed tym, z czego jesteś dumny, stoi *de*.'
    example_gloss:
    - Jestem z ciebie dumny. (mężczyzna)
    - Jestem z ciebie dumna. (kobieta)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Jestem zdenerwowany (mężczyzna)
    gloss: Jestem zdenerwowany.
    note: '*Estoy* (jestem, od *estar*) + męska forma przymiotnika.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Jestem zdenerwowana (kobieta)
    gloss: Jestem zdenerwowana.
    note: Ta sama konstrukcja z przymiotnikiem w rodzaju żeńskim.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Jestem zadowolony (mężczyzna)
    gloss: Jestem zadowolony.
    note: '*Estoy contento* – ten sam wzorzec: *estar* + przymiotnik.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar a ser przy uczuciach
    gloss: Dlaczego uczucia wyraża się zwykle czasownikiem estar, a nie ser.
    note: Zobacz treść samej karty.
    target_text: '*Estar* + przymiotnik opisuje stan przejściowy lub uczucie (estoy nervioso – jestem [teraz] zdenerwowany), w przeciwieństwie do *ser* + przymiotnik, które wyraża cechę stałą. Uczucia zwykle wyraża się czasownikiem *estar*.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Zapytaj, jak ktoś się czuje
    gloss: Jak się Pan/Pani czuje?
    note: '*¿Cómo te sientes?* zawiera czasownik zwrotny *sentirse* (czuć się), który różni się od konstrukcji *estar* + przymiotnik.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Opisz mieszane uczucia
    gloss: Czuję się trochę zdenerwowany, ale zadowolony.
    note: '*Me siento* (czuję się) + przymiotnik, a *pero* (ale) zestawia dwa uczucia naraz – to naturalna odpowiedź na pytanie *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Coś się pali
    gloss: Coś się przypala!
    note: '*Se quema* to forma zwrotna czasownika *quemar* (palić, przypalać) – dosłownie „samo się pali”. Tak naturalnie mówi się, że coś się przypala, bez wskazywania sprawcy.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Martwię się (mężczyzna)
    gloss: Jestem zmartwiony.
    note: '*Preocupado* we wzorcu *estoy* + przymiotnik.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Nie martw się
    gloss: Nie martw się.
    note: Zobacz następną notkę gramatyczną.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Zaproponuj, żeby zacząć od nowa
    gloss: Możemy zacząć od nowa.
    note: '*Podemos* (możemy) + bezokolicznik; *de nuevo* (od nowa, jeszcze raz) to częsty zwrot, gdy coś robimy ponownie.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: Wzorzec rozkazu przeczącego w zwrocie „nie martw się”.
    note: Zobacz treść samej karty.
    target_text: '*No te preocupes* (nie martw się) to przeczący rozkaz w formie nieformalnej, zbudowany jako *no* + zaimek zwrotny (*te*) + czasownik.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: Podsumowanie zajęć
    gloss: Przed zajęciami Elena i Mateo byli trochę zdenerwowani. Podczas zajęć coś się przypaliło i oboje się martwili. Ale zaczęli od nowa i w końcu ciasto wyszło idealnie. Teraz oboje są bardzo dumni i zadowoleni.
    note: '*Estaban* (byli) opisuje, jak czuli się wtedy, a *están* (są) – jak czują się teraz.'
    glosses:
      Antes: przed
      clase: zajęcia, lekcja
      estaban: byli (od estar)
      poco: trochę
      nerviosos: zdenerwowani
      Durante: podczas
      algo: coś
      quemó: przypaliło się (od quemarse)
      dos: oboje
      preocupados: zmartwieni
      Pero: ale
      empezaron: zaczęli (od empezar)
      nuevo: od nowa
      final: koniec
      pastel: ciasto
      salió: wyszło (od salir)
      perfecto: idealny
      Ahora: teraz
      están: są (od estar)
      orgullosos: dumni
      contentos: zadowoleni
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: Zgodność przymiotników w liczbie mnogiej
    gloss: Dlaczego grupa mieszana płciowo wymaga przymiotników w męskiej liczbie mnogiej.
    note: Zobacz treść samej karty.
    target_text: Gdy opisujemy Elenę i Mateo razem, przymiotniki przyjmują męską formę liczby mnogiej (nerviosos, preocupados, orgullosos, contentos) – to ogólna zasada hiszpańska, gdy w grupie jest przynajmniej jeden mężczyzna.
  es.a1.unit12.lesson06.teach.line01:
    title: Zapytaj, jak czuje się Mateo
    gloss: Elena pyta Mateo, jak się czuje przed zajęciami.
    note: '*¿Cómo te sientes?* to pytanie o to, jak ktoś się czuje.'
  es.a1.unit12.lesson06.teach.line02:
    title: Odpowiedz, opisując mieszane uczucia
    gloss: Mateo mówi, że czuje się trochę zdenerwowany, ale zadowolony.
    note: 'Mateo używa form męskich: *nervioso* i *contento*.'
  es.a1.unit12.lesson06.teach.line03:
    title: Zareaguj na kłopot
    gloss: Elena się zgadza, a potem zauważa, że coś się przypala.
    note: '*¡Ay, no!* (o nie!) to częsty okrzyk przerażenia.'
  es.a1.unit12.lesson06.teach.line04:
    title: Wyraź zmartwienie
    gloss: Mateo mówi, że się martwi, i pyta, co robić.
    note: '*¿Qué hacemos?* (co robimy?) to praktyczne pytanie.'
  es.a1.unit12.lesson06.teach.line05:
    title: Uspokój i zaproponuj rozwiązanie
    gloss: Elena mówi, żeby się nie martwił – mogą zacząć od nowa.
    note: Łączy *no te preocupes* i *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Zgódź się i spróbuj jeszcze raz
    gloss: Mateo się zgadza i proponuje spróbować jeszcze raz.
    note: '*Vamos a intentarlo otra vez* (spróbujmy tego jeszcze raz) wykorzystuje znaną z wcześniejszych lekcji konstrukcję *vamos a* + bezokolicznik, tym razem z zaimkiem dopełnienia *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Ogłoś sukces
    gloss: Elena oznajmia, że ciasto jest teraz idealne.
    note: '*¡Mira!* (patrz!) to wykrzyknik zwracający uwagę; *el pastel* (ciasto) to potrawa, wokół której toczy się cała historia.'
  es.a1.unit12.lesson06.teach.line08:
    title: Świętuj i wyraź dumę
    gloss: Mateo się cieszy i mówi, że jest dumny z nich obojga.
    note: '*¡Qué bien!* (jak dobrze!) to wykrzyknienie według wzoru *¡Qué...!*, jak w *¡Qué calor!*; *de nosotros* (z nas) rozszerza *estoy orgulloso de ti* na grupę.'
  es.a1.unit12.lesson06.teach.line09:
    title: Podziel się dumą
    gloss: Elena zgadza się, że też jest dumna – udało im się razem.
    note: '*Lo logramos juntos* (udało nam się to razem) to naturalne zakończenie rozmowy; pojawia się tu po raz pierwszy czasownik *lograr* (osiągnąć, dokonać).'
