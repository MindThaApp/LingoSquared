teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Bardziej... niż
    gloss: bardziej... niż
    note: '*Más...que* porównuje dwie różne ilości lub rzeczy – zobacz notatkę gramatyczną poniżej.'
    example_gloss: Nowe mieszkanie jest większe niż stare.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Mniej... niż
    gloss: mniej... niż
    note: '*Menos...que*, przeciwieństwo *más...que*.'
    example_gloss: Stare mieszkanie jest mniejsze niż nowe.
  es.a1.unit15.lesson01.teach.tan_como:
    title: Tak... jak
    gloss: tak samo...jak
    note: '*Tan...como* porównuje dwie RÓWNE rzeczy – to zupełnie inna konstrukcja niż *más/menos*, a nie po prostu kolejny sposób powiedzenia tego samego.'
    example_gloss: Mateo gotuje tak samo dobrze jak Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Nierówność i równość
    gloss: Różnica między más/menos...que a tan...como.
    note: Zobacz tekst na samej karcie.
    target_text: '*Más...que* (bardziej... niż) i *menos...que* (mniej... niż) porównują dwie RÓŻNE rzeczy lub ilości. *Tan...como* (tak... jak) porównuje dwie RÓWNE rzeczy – to inna konstrukcja, a nie synonim *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Porównaj nowe mieszkanie
    gloss: Nowe mieszkanie jest większe niż stare.
    note: '*Más grande que* (większe niż) wstawia *grande* (duży) do wzoru *más...que*.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Porównaj stare mieszkanie
    gloss: Stare mieszkanie jest mniejsze niż nowe.
    note: '*Más pequeño que* (mniejszy niż) używa *pequeño* (mały) i wyraża to samo porównanie z przeciwnej strony.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Zapytaj, które jest większe
    gloss: Które mieszkanie jest większe?
    note: '*¿Cuál...?* (które...?) + przymiotnik w stopniu wyższym to standardowy sposób pytania o porównanie.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Odpowiedz, które jest większe
    gloss: Nowe jest większe niż stare.
    note: To samo porównanie, tym razem jako bezpośrednia odpowiedź na pytanie z *¿cuál...?*; *el nuevo* (nowe) pomija powtarzany rzeczownik.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Porównaj umiejętności gotowania
    gloss: Mateo gotuje tak samo dobrze jak Elena.
    note: '*Tan bien como* (tak samo dobrze jak) to *tan* + przysłówek + *como*, czyli wzór równości zastosowany do sposobu wykonywania czynności, a nie do wielkości rzeczy.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Powiedz, że jesteście dobrym zespołem
    gloss: Jesteśmy dobrym zespołem.
    note: '*Somos* (jesteśmy) + *un buen equipo* (dobry zespół) to naturalne podsumowanie po porównaniu równości.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: Porównanie dwóch mieszkań
    gloss: Stare mieszkanie Mateo ma małą kuchnię. Nowe mieszkanie jest większe, a kuchnia też jest większa. Stare jest mniejsze niż nowe i dlatego Mateo chce się przeprowadzić. Nowe ma więcej miejsca do gotowania.
    note: Realistyczne podsumowanie porównujące oba mieszkania.
    glosses:
      viejo: stary
      tiene: ma (od tener)
      pequeña: mały
      nuevo: nowy
      grande: duży
      también: też
      pequeño: mały
      eso: niż
      quiere: chce (od querer)
      mudarse: przeprowadzić się
      espacio: miejsce, przestrzeń
      cocinar: gotować
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (dlatego)
    gloss: Jak por eso łączy przyczynę ze skutkiem.
    note: Zobacz tekst na samej karcie.
    target_text: '*Por eso* (dlatego, z tego powodu) łączy przyczynę ze skutkiem – mała kuchnia jest powodem, dla którego Mateo chce się przeprowadzić; to ta sama logika przyczyny i skutku, którą znasz już z *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: Zapytaj, czy już widział
    gloss: Elena pyta, czy Mateo już widział nowe mieszkanie.
    note: '*¿Ya viste...?* (czy już widziałeś...?) to nowa forma pytania w czasie przeszłym.'
  es.a1.unit15.lesson06.teach.line02:
    title: Potwierdź, że jest większe
    gloss: Mateo potwierdza, że jest większe niż stare, razem z kuchnią.
    note: Porównanie *más...que* rozszerzone o *la cocina también* (kuchnia też).
  es.a1.unit15.lesson06.teach.line03:
    title: Zapytaj, które jest mniejsze
    gloss: Elena pyta, które mieszkanie jest w takim razie mniejsze.
    note: '*Entonces* (więc, w takim razie) to spójnik logiczny, który już znasz; pytanie ma wzór *¿Cuál...?* z *pequeño* zamiast *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Odpowiedz i wyjaśnij
    gloss: Mateo mówi, że stare jest mniejsze, i dlatego chce się przeprowadzić.
    note: '*El viejo es más pequeño que el nuevo* oraz *por eso quiero mudarme* (dlatego chcę się przeprowadzić).'
  es.a1.unit15.lesson06.teach.line05:
    title: Zgódź się, że to ma sens
    gloss: Elena mówi, że to ma sens – nowe ma więcej miejsca do gotowania.
    note: '*Tiene mucho sentido* (to ma duży sens) to nowe wyrażenie zgody; *más espacio para cocinar* znaczy więcej miejsca do gotowania.'
  es.a1.unit15.lesson06.teach.line06:
    title: Rozwiń myśl
    gloss: Mateo się zgadza i dodaje, że skoro Elena gotuje tak samo dobrze jak on, potrzebują miejsca dla dwojga.
    note: '*Tan bien como* (tak samo dobrze jak) użyte teraz w rozmowie: *tú cocinas* (ty gotujesz).'
  es.a1.unit15.lesson06.teach.line07:
    title: Odwdzięcz się komplementem
    gloss: Elena entuzjastycznie się zgadza i mówi, że on gotuje tak samo dobrze jak ona.
    note: '*¡Es verdad!* (to prawda!) + *tú cocinas tan bien como yo* (gotujesz tak samo dobrze jak ja) – to samo porównanie *tan bien como*, tym razem skierowane do Mateo.'
  es.a1.unit15.lesson06.teach.line08:
    title: Zakończ w duchu współpracy
    gloss: Mateo podsumowuje, że są dobrym zespołem.
    note: '*Somos un buen equipo* (jesteśmy dobrym zespołem) kończy dialog.'
