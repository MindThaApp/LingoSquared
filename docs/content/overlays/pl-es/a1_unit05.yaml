teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Pytanie o godzinę
    gloss: Która jest godzina?
    note: '*Qué hora* („która godzina”) pyta o czas na zegarze, inaczej niż *qué fecha* („jaka data”).'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: Jest pierwsza
    gloss: Jest pierwsza.
    note: W następnej notatce gramatycznej wyjaśniamy, dlaczego tylko przy pierwszej godzinie używa się *es*, a nie *son*.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es czy son przy godzinach
    gloss: Dlaczego pierwsza godzina różni się od wszystkich pozostałych.
    note: '*Es la una* (liczba pojedyncza), ale *son las dos, son las tres...* (liczba mnoga).'
    target_text: Przy pierwszej godzinie używa się czasownika w liczbie pojedynczej *es* (Es la una), a przy wszystkich pozostałych godzinach liczby mnogiej *son* (Son las dos, Son las tres...), ponieważ *la una* jest w liczbie pojedynczej („jedna [godzina]”), a *las dos*, *las tres* itd. w mnogiej.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Druga, czwarta, piąta, siódma
    gloss: Jest druga, jest czwarta, jest piąta, jest siódma.
    note: '*Son las...* (liczba mnoga) mówimy przy każdej godzinie oprócz pierwszej, zgodnie z poprzednią notatką gramatyczną.'
    example_gloss:
    - Jest druga.
    - Jest czwarta.
    - Jest piąta.
    - Jest siódma.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: Kwadrans po
    gloss: Jest kwadrans po czwartej (czwarta piętnaście).
    note: '*Y cuarto* („i kwadrans”) dodaje piętnaście minut do podanej godziny.'
  es.a1.unit05.lesson02.teach.y_media:
    title: Wpół do / pół godziny po
    gloss: Jest wpół do ósmej (siódma trzydzieści).
    note: '*Y media* („i pół”) dodaje trzydzieści minut do podanej godziny.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Za kwadrans
    gloss: Jest za kwadrans piąta (czwarta czterdzieści pięć).
    note: W następnej notatce gramatycznej wyjaśniamy, jak *menos* odlicza minuty do następnej pełnej godziny.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (do pełnej godziny)
    gloss: Jak hiszpański liczy minuty brakujące do następnej godziny.
    note: '*Las cinco menos cuarto* = za kwadrans piąta (4:45).'
    target_text: '*Menos* („minus”, „do”) odlicza minuty DO następnej pełnej godziny: *las cinco menos cuarto* to 4:45, czyli „za kwadrans piąta”.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Rano, po południu, w nocy
    gloss: rano, po południu, wieczorem/w nocy
    note: '*De la mañana/tarde/noche* wyjaśnia, czy chodzi o godzinę przed południem, czy po południu, podobnie jak polskie „rano”, „po południu” czy „w nocy” po podaniu godziny.'
    example_gloss:
    - Jest ósma rano.
    - Warsztaty zaczynają się o czwartej po południu.
    - Jest dziesiąta w nocy.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: Warsztaty zaczynają się o czwartej
    gloss: Warsztaty zaczynają się o czwartej po południu.
    note: '*Empieza* („zaczyna się”) to forma trzeciej osoby czasownika *empezar*, nowego czasownika w tej lekcji.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Pytanie o godzinę rozpoczęcia
    gloss: O której zaczynają się warsztaty?
    note: '*A qué hora* („o której godzinie”) to standardowy sposób pytania, kiedy odbywa się dane wydarzenie, w odróżnieniu od ogólnego *qué hora es* („która jest godzina”).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Pytanie o godzinę spotkania
    gloss: O której się spotykamy?
    note: '*Nos vemos* (widzimy się / spotkamy się) to konstrukcja zwrotna używana do umawiania się na spotkanie.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Zaproponuj godzinę spotkania
    gloss: Spotkamy się o wpół do czwartej?
    note: Łączy *y media* z *nos vemos*, aby zaproponować konkretną godzinę.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: Przed warsztatem
    gloss: To jest przed warsztatem.
    note: '*Antes de* (przed) jest przeciwieństwem *después* (po).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: Zgoda / Dobrze
    gloss: Zgoda / Dobrze
    note: '*De acuerdo* to naturalny, krótki sposób potwierdzenia planu, podobny w funkcji do *Muy bien*.'
    example_gloss: Zgoda, spotkamy się o wpół do czwartej.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Czytamy plan dnia
    gloss: Warsztat zaczyna się o czwartej po południu. Wcześniej Elena i Mateo spotykają się o wpół do czwartej. Warsztat kończy się o szóstej. Następnego dnia spotykają się o pierwszej, żeby zjeść obiad.
    note: 'Krótki plan dnia: spotkanie, warsztat i obiad następnego dnia.'
    glosses:
      taller: warsztat
      empieza: zaczyna się (od empezar)
      cuatro: cztery
      tarde: popołudnie
      Antes: przed, wcześniej
      ven: spotykają się (od verse)
      tres: trzy
      media: pół, połowa
      termina: kończy się (od terminar)
      seis: sześć
      día: dzień
      siguiente: następny
      almorzar: jeść obiad
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: Następnego dnia
    gloss: następnego dnia
    note: '*Al día siguiente* (następnego dnia) to częsty sposób przeniesienia opowieści na kolejny dzień. Różni się od *la próxima clase* (następne zajęcia – konkretne wydarzenie, a nie dzień w kalendarzu).'
  es.a1.unit05.lesson06.teach.line01:
    title: Zapytaj o jedzenie po warsztacie
    gloss: Mateo mówi, że warsztat kończy się o szóstej, i pyta, czy Elena będzie potem głodna.
    note: '*Tienes hambre* (jesteś głodny) to nowy idiom – dosłownie „masz głód”, czyli ta sama konstrukcja z czasownikiem „mieć” co w *tener ... años* i *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Zgoda i propozycja na następny dzień
    gloss: Elena odpowiada, że tak, trochę, i proponuje zjeść dopiero następnego dnia.
    note: '*¿Comemos mañana?* proponuje jutro zamiast zaraz po warsztacie i przygotowuje kolejną wymianę zdań o konkretnej godzinie.'
  es.a1.unit05.lesson06.teach.line03:
    title: Zgoda i pytanie o godzinę
    gloss: Mateo zgadza się, że to dobry pomysł, i pyta o godzinę.
    note: '*Buena idea* (dobry pomysł) to naturalny, krótki sposób zgody na propozycję.'
  es.a1.unit05.lesson06.teach.line04:
    title: Zaproponuj pierwszą
    gloss: Elena proponuje spotkanie o pierwszej.
    note: '*A la una* (o pierwszej) używa liczby pojedynczej *la una*, tak jak w *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Potwierdzenie i wzmianka o restauracji
    gloss: Mateo potwierdza, że pierwsza mu odpowiada, i wspomina o pobliskiej restauracji.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (blisko), jak w *cerca de tus padres*, tutaj użyte w odniesieniu do miejsca.'
  es.a1.unit05.lesson06.teach.line06:
    title: Serdeczne zakończenie
    gloss: 'Elena reaguje z radością i mówi: do zobaczenia jutro.'
    note: '*¡Genial!* (świetnie!) kończy rozmowę entuzjastycznym akcentem, podobnie jak *¡Qué bien!*.'
