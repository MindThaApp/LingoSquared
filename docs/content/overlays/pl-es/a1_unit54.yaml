  description: 'Hiszpański dla początkujących o sporcie i ćwiczeniach: nazwy popularnych dyscyplin, mówienie o tym, jak często je uprawiasz, różnica między hacer deporte a jugar a / hacer + nazwa sportu oraz umawianie się na wspólne ćwiczenia.'
