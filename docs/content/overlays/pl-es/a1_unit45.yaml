teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Pytanie o łączną cenę
    gloss: Ile to kosztuje w sumie?
    note: '*En total* wyjaśnia, że chodzi o całkowitą cenę wszystkiego razem, a nie o cenę jednej rzeczy.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Podawanie łącznej ceny
    gloss: W sumie kosztuje to dwadzieścia pięć euro.
    note: '*Cuesta* to 3. osoba liczby pojedynczej czasownika *costar* (kosztować); samogłoska tematu zmienia się z *o* na *ue*, gdy pada na nią akcent.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Płacenie kartą lub gotówką
    gloss: płacić kartą, płacić gotówką
    note: '*Pagar con tarjeta* (płacić kartą) i *pagar en efectivo* (płacić gotówką) mają różne przyimki: *con* dla narzędzia, *en* dla formy pieniędzy.'
    example_gloss:
    - Czy mogę tu zapłacić kartą?
    - Płacę gotówką.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Pytanie, czy można zapłacić kartą
    gloss: Czy mogę tu zapłacić kartą?
    note: '*Puedo* (mogę) to forma *yo* czasownika *poder*; *aquí* (tutaj) odnosi pytanie do miejsca, w którym jesteś.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Pytanie o preferowaną formę płatności
    gloss: Woli Pan/Pani zapłacić gotówką czy kartą?
    note: '*Quiere* to grzeczna forma *usted* czasownika *querer*, której używa tu nieznajomy kasjer; do przyjaciela powiesz *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: Rachunek
    gloss: rachunek
    note: 'Rzeczownik rodzaju żeńskiego: *la cuenta*. W restauracji to rachunek, w banku – konto.'
    example_gloss: Podzielimy rachunek?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Propozycja podzielenia rachunku
    gloss: Podzielimy rachunek?
    note: '*¿Dividimos...?* używa formy *nosotros*, by złożyć propozycję – podobnie jak po polsku „podzielimy…?”.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Prośba o osobne płacenie
    gloss: Czy mogę zapłacić osobno?
    note: '*Por separado* (osobno) mówi, w jaki sposób płacisz; *pagar* (płacić) to codzienny czasownik na to.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: Reszta
    gloss: reszta
    note: 'Rzeczownik rodzaju męskiego: *el cambio*. Znaczy też zmianę czegokolwiek, np. *un cambio de planes*.'
    example_gloss: Oto Pana/Pani reszta.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Wydawanie reszty
    gloss: Oto Pana/Pani reszta.
    note: '*Su* to dzierżawczy zaimek pasujący do grzecznościowego *usted* („Pana/Pani”); *Aquí tiene* to zwykły uprzejmy sposób podania czegoś.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Odmowa przyjęcia reszty
    gloss: Nie potrzebuję reszty.
    note: '*Necesitar* (potrzebować) łączy się z dopełnieniem bez przyimka: *necesito cambio*; *no* neguje czasownik.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Trzydzieści pięć
    gloss: trzydzieści pięć
    note: '*Treinta y cinco* (trzydzieści pięć): od 31 do 99 dziesiątki i jedności łączy się spójnikiem *y* i zapisuje jako osobne wyrazy.'
    example_gloss: To kosztuje trzydzieści pięć euro.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Czytamy rachunek z restauracji
    gloss: 'Rachunek: dwa dania główne i dwie kawy. Razem: trzydzieści pięć euro. Zapłacono kartą.'
    note: Zwróć uwagę, co zamówiono, jaka jest suma i jak zapłacono.
    glosses:
      Cuenta: rachunek
      dos: dwa
      platos: dania główne
      cafés: kawy
      Total: razem
      treinta: trzydzieści pięć
      euros: euro
      Pagado: zapłacono
      tarjeta: karta
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena prosi o rachunek
    gloss: 'Elena: Poprosimy o rachunek?'
    note: '*Pedir* (prosić o, zamawiać) ma za dopełnienie *la cuenta*: *pedimos la cuenta* (prosimy o rachunek).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo pyta o sumę
    gloss: 'Mateo: Tak, dobry pomysł. Ile to kosztuje w sumie?'
    note: Powtórzenie pytania *¿cuánto cuesta en total?* z lekcji 1.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena podaje sumę
    gloss: 'Elena: To trzydzieści pięć euro. Podzielimy?'
    note: 'Przy kwotach pieniędzy używa się *son*: *son treinta y cinco euros* – czasownik jest w liczbie mnogiej, bo kwota jest mnoga.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo nalega, że zapłaci
    gloss: 'Mateo: Nie, dzisiaj ja płacę. Bardzo mi pomogłaś.'
    note: '*Deja que pague yo* (pozwól, że ja zapłacę) zawiera tryb łączący *pague* po *que*; na razie zapamiętaj to jako gotową formułę. *Me has ayudado* to czas perfecto (pomogłaś mi).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena jest wzruszona
    gloss: 'Elena: Jak miło z twojej strony! Dziękuję.'
    note: '*¡Qué amable eres!* (jaki jesteś miły!) składa się z *qué* + przymiotnik i jest ciepłą reakcją na hojny gest; *muchas gracias* to mocniejsze *dziękuję*.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo pyta o płatność kartą
    gloss: 'Mateo: Czy mogę tu zapłacić kartą?'
    note: Wykorzystuje pytanie *¿puedo pagar con tarjeta aquí?* z lekcji 2, tym razem w prawdziwej restauracji.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: forma on/ona'
    gloss: Mateo płaci rachunek.
    note: '*Paga* to trzecia osoba liczby pojedynczej czasownika *pagar* (płacić): *Mateo paga la cuenta*.'
