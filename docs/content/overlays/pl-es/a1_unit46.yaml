teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Złe samopoczucie
    gloss: Nie czuję się dobrze.
    note: '*Sentirse* jest czasownikiem zwrotnym (*me siento*, *te sientes*); *no me siento bien* to ogólny, łagodny sposób powiedzenia, że coś jest nie tak.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Chory
    gloss: chory
    note: 'Podstawowy przymiotnik, używany z *estar* (do stanów): *estoy enfermo*.'
    example_gloss: Jestem chory.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Być chorym
    gloss: Jestem chory.
    note: '*Enfermo* oznacza stan bardziej ogólny i poważniejszy niż *no me siento bien*; zmienia się w zależności od płci mówiącego (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Ból głowy
    gloss: ból głowy
    note: 'Po hiszpańsku *dolor de cabeza* łączy się z *tener* i występuje bez rodzajnika: *tengo dolor de cabeza*.'
    example_gloss: Boli mnie głowa.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: Mieć ból głowy
    gloss: Boli mnie głowa.
    note: 'Objawy łączą się z *tener* (mieć): *tengo dolor de cabeza*, czyli dosłownie „mam ból głowy”.'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Ból brzucha
    gloss: ból brzucha
    note: 'Ten sam wzór bez rodzajnika co w *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: Boli mnie brzuch.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: Mieć ból brzucha
    gloss: Boli mnie brzuch.
    note: Ten sam wzór z *tener* co w *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Pytanie ogólne
    gloss: Co się stało?
    note: Ogólne pytanie, którego możesz użyć, gdy podejrzewasz, że coś jest nie tak.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: Częsty zwrot
    gloss: O co chodzi?
    note: '*¿Qué te pasa?* to naturalny sposób zapytania, co się stało (dosłownie „co ci się dzieje?”); nie tłumacz tego słowo w słowo.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Ból gardła
    gloss: ból gardła
    note: 'Ten sam wzór co *dolor de cabeza* i *dolor de estómago*: *dolor de garganta*.'
    example_gloss: Boli mnie gardło.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: Mieć ból gardła
    gloss: Boli mnie gardło.
    note: Ten sam wzór z *tener* co przy innych objawach.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Pytanie o samopoczucie
    gloss: Wszystko w porządku? Nie, nie czuję się dobrze.
    note: '*¿Estás bien?* to bardzo częste, swobodne pytanie między przyjaciółmi; do osoby, do której zwracasz się przez *usted*, mówisz *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Gorączka
    gloss: gorączka
    note: 'Po *tener* występuje bez rodzajnika, jak inne objawy: *tengo fiebre*.'
    example_gloss: Mam gorączkę.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: Mieć gorączkę
    gloss: Mam gorączkę.
    note: Ten sam wzór z *tener*.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Przeziębienie
    gloss: przeziębiony / mieć przeziębienie
    note: '*Resfriado* jest tu przymiotnikiem używanym z *estar*; można też powiedzieć *tengo un resfriado*, używając rzeczownika *resfriado*.'
    example_gloss: Jestem przeziębiony.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Mówimy, że jesteśmy przeziębieni
    gloss: Jestem przeziębiony.
    note: Po hiszpańsku można powiedzieć *estoy resfriado* (przymiotnik), czyli dosłownie „jestem przeziębiony”; przymiotnik zmienia się w zależności od płci mówiącego (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar czy tener – zależy od rodzaju słowa
    gloss: 'Enfermo i resfriado to przymiotniki i używa się ich z estar: jestem chory, jestem przeziębiony. Fiebre i dolor de cabeza to rzeczowniki i używa się ich z tener: mam gorączkę, boli mnie głowa.'
    note: 'Wybór między *estar* a *tener* zależy od rodzaju słowa: przymiotniki (*enfermo*, *resfriado*) łączą się z *estar*, a rzeczowniki oznaczające objawy (*fiebre*, *dolor de cabeza*) z *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: Apteka
    gloss: apteka
    note: 'Rzeczownik rodzaju żeńskiego: *la farmacia*.'
    example_gloss: Idę do apteki.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: Powitanie farmaceuty
    gloss: W czym mogę pomóc?
    note: '*¿En qué puedo ayudarle?* to standardowe grzecznościowe pytanie w obsłudze klienta; *ayudarle* zawiera zaimek dopełnienia *le* w formie grzecznościowej *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Prośba o coś na objaw
    gloss: Czy ma Pan/Pani coś na ból głowy?
    note: '*Algo para* + objaw to naturalny sposób proszenia o lek: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: Tabletka
    gloss: tabletka
    note: 'Rzeczownik rodzaju żeńskiego: *la pastilla*; *una pastilla* to tabletka.'
    example_gloss: Biorę tabletkę.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Dawkowanie leku
    gloss: Weź tabletkę dwa razy dziennie.
    note: '*Toma* to forma rozkazująca (nieformalna, 2. os. l. poj.) czasownika *tomar* (brać), używana w instrukcjach.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Rejestr w aptece
    gloss: W aptece używa się grzecznościowej formy usted (Pan/Pani).
    note: 'Farmaceuta to nieznana osoba dorosła, z którą rozmawiasz w usługowej sytuacji, dlatego używasz formy *usted*: *¿Tiene algo...?*, a nie *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Przeczytaj poradę z apteki
    gloss: 'Rada: weź tabletkę dwa razy dziennie, popijając wodą. Dobrze odpoczywaj i pij dużo wody. Nadal źle się czujesz po trzech dniach? W takim razie idź do lekarza.'
    note: Zwróć uwagę na dawkowanie, dwa zalecenia niezwiązane z lekiem oraz na to, kiedy iść do lekarza.
    glosses:
      Consejo: rada
      toma: brać / weź
      veces: razy
      día: dzień
      pastilla: tabletka
      Descansa: odpoczywać / odpocznij
      bebe: pić / pij
      sentirte: czuć się
      sigues: nadal
      bien: dobrze
      médico: lekarz / lekarz rodzinny
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena pyta, co słychać
    gloss: 'Elena: Cześć, Mateo, jak się masz? Czujesz się już lepiej?'
    note: '*Ya* (już) pokazuje, że Elena sprawdza, czy Mateo czuje się lepiej niż przy ostatniej rozmowie; *te sientes* to forma nieformalna (*tú*) czasownika *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo nadal źle się czuje
    gloss: 'Mateo: Jeszcze nie za dobrze. Nadal boli mnie głowa i jestem zmęczony.'
    note: '*Sigo con* (nadal mam) pokazuje, że ból głowy nie minął; *cansado* (zmęczony) to nowy, przydatny przymiotnik, który zmienia się zależnie od rodzaju (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena pyta o lek
    gloss: 'Elena: Wziąłeś tabletkę?'
    note: '*Has tomado* to czas przeszły złożony (pretérito perfecto): *has* + imiesłów *tomado*, ten sam wzorzec co w *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo potwierdza
    gloss: 'Mateo: Tak, wziąłem tabletkę. Teraz pójdę odpocząć.'
    note: '*Voy a descansar* (zamierzam odpocząć) to konstrukcja bliskiej przyszłości: *ir a* + bezokolicznik.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena życzy mu zdrowia
    gloss: 'Elena: Dobry pomysł. Dobrze odpocznij. Szybkiego powrotu do zdrowia!'
    note: '*¡Que te mejores!* to stały zwrot, którym życzy się szybkiego powrotu do zdrowia; zawiera formę trybu łączącego *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo się żegna
    gloss: 'Mateo: Dzięki, do jutra!'
    note: '*Hasta mañana* ma ten sam schemat *hasta* + czas co pożegnania takie jak *hasta luego*.'
