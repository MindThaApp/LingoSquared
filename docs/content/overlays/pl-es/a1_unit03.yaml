answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Hiszpański A1
  description: Słownictwo dotyczące najbliższej i dalszej rodziny, przymiotniki dzierżawcze oraz opisywanie domowników. Ciąg dalszy historii Eleny i Mateo z warsztatów kulinarnych z lekcji 01–02. Kurs zwraca uwagę na przymiotniki dzierżawcze (mi/tu/su) oraz na rzeczowniki rodzinne oznaczone rodzajem.
units:
  es.a1.unit03.family:
    title: Rodziny Eleny i Mateo
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: Najbliższa rodzina
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'Zaimki dzierżawcze: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: Dalsza rodzina
  es.a1.unit03.lesson04.describing_family_size:
    title: Ile osób jest w domu
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Czytamy profil rodziny
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Rodzinne zdjęcia Eleny i Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Matka
    gloss: matka
    note: '*Madre* jest rodzaju żeńskiego. *Mamá* jest częstsze w codziennych rozmowach w rodzinie, a *madre* jest neutralne i występuje w słownictwie tego kursu.'
  es.a1.unit03.lesson01.teach.padre:
    title: Ojciec
    gloss: ojciec
    note: '*Padre* jest rodzaju męskiego. *Papá* to codzienny odpowiednik, tak jak *mamá* przy *madre*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Brat
    gloss: brat
    note: '*Hermano* jest rodzaju męskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Siostra
    gloss: siostra
    note: '*Hermana* jest rodzaju żeńskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Syn
    gloss: syn
    note: '*Hijo* jest rodzaju męskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson01.teach.hija:
    title: Córka
    gloss: córka
    note: '*Hija* jest rodzaju żeńskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson01.teach.padres:
    title: Rodzice
    gloss: rodzice
    note: '*Padres* (liczba mnoga rodzaju męskiego) oznacza parę mieszaną, czyli matkę i ojca razem. Hiszpański stosuje tę zasadę zawsze, gdy w grupie jest choć jeden mężczyzna.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Rodzeństwo
    gloss: rodzeństwo; bracia
    note: '*Hermanos* może znaczyć „bracia” (sami chłopcy) albo „rodzeństwo” (grupa mieszana), według tej samej zasady co *padres*: męska liczba mnoga obejmuje grupy mieszane.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: Moja rodzina
    gloss: moja rodzina
    note: '*Mi* (bez akcentu) to przymiotnik dzierżawczy „mój/moja”; nie zmienia się według rodzaju, tylko według liczby (*mis* przy rzeczownikach w liczbie mnogiej).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: Twoja rodzina (nieformalnie)
    gloss: twoja rodzina
    note: '*Tu* (bez akcentu, w odróżnieniu od zaimka *tú*) to forma nieformalna, pasująca do rejestru *tú* z lekcji 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: Twoja/jego/jej rodzina (formalnie lub o trzeciej osobie)
    gloss: jego/jej/Pana/Pani rodzina
    note: '*Su* oznacza „jego”, „jej” ORAZ formalne „Pana/Pani” (*usted*). Sam zaimek dzierżawczy tego nie rozróżnia; znaczenie wynika z kontekstu. Polszczyzna ma tu osobne słowa: „jego”, „jej”, „Pana”.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Pytanie o rodzeństwo
    gloss: Masz rodzeństwo?
    note: '*Tienes* to forma czasownika *tener* dla *tú*, tego samego, którego użyliśmy do podania wieku w lekcji 2.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Podawanie liczby rodzeństwa
    gloss: Mam dwie siostry.
    note: '*Tengo* („mam”) w połączeniu z liczbą i nazwą członka rodziny to standardowy sposób mówienia o rodzeństwie.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Pytanie, czy rodzina jest duża
    gloss: Czy twoja rodzina jest duża?
    note: '*Grande* („duży”) nie zmienia formy według rodzaju, tylko według liczby (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Opis małej rodziny
    gloss: Moja rodzina jest mała.
    note: '*Pequeña* zgadza się z rzeczownikiem rodzaju żeńskiego *familia*; forma męska *pequeño* występuje przy rzeczowniku rodzaju męskiego.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Dziadek
    gloss: dziadek
    note: '*Abuelo* jest rodzaju męskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Babcia
    gloss: babcia
    note: '*Abuela* jest rodzaju żeńskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: Dziadkowie
    gloss: dziadkowie
    note: '*Abuelos* (męska liczba mnoga) oznacza parę mieszaną, tak samo jak *padres* i *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: Wujek
    gloss: wujek
    note: '*Tío* ma akcent pisany, ponieważ akcent pada na *í*, co rozbija połączenie samogłosek, które inaczej tworzyłoby dyftong.'
  es.a1.unit03.lesson03.teach.tia:
    title: Ciocia
    gloss: ciotka
    note: '*Tía* ma ten sam akcent co *tío*, z tego samego powodu.'
  es.a1.unit03.lesson03.teach.primo:
    title: Kuzyn
    gloss: kuzyn
    note: '*Primo* jest rodzaju męskiego, w liczbie pojedynczej; podobnie jak w polskim („kuzyn” i „kuzynka”), hiszpański wyraża płeć kuzyna.'
  es.a1.unit03.lesson03.teach.prima:
    title: Kuzynka
    gloss: kuzynka
    note: '*Prima* jest rodzaju żeńskiego, w liczbie pojedynczej.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: Moi dziadkowie
    gloss: moi dziadkowie
    note: '*Mis* to liczba mnoga od *mi*; jest wymagane zawsze, gdy rzeczownik jest w liczbie mnogiej, niezależnie od jego rodzaju.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Zapytaj o liczbę rodzeństwa
    gloss: Ile masz rodzeństwa?
    note: '*Cuántos* (liczba mnoga rodzaju męskiego, bo *hermanos* obejmuje też grupy mieszane) zgadza się z rzeczownikiem, o który pytasz.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Podaj liczbę osób w domu
    gloss: Jest nas pięcioro w domu.
    note: Po hiszpańsku liczbę wszystkich domowników podaje się naturalnie formą *somos* („jesteśmy”), podobnie jak po polsku mówimy „jest nas pięcioro”, a nie dosłownie „są pięć osób”.
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Opisz dużą rodzinę
    gloss: Moja rodzina jest duża.
    note: '*Grande* odnosi się tu do *familia* (rodzaj żeński), ale ma tę samą formę *grande* co przy rzeczownikach rodzaju męskiego, ponieważ przymiotniki zakończone na -e, takie jak *grande*, nie zmieniają formy w zależności od rodzaju.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Powiedz, że masz wielu kuzynów
    gloss: Mam wielu kuzynów.
    note: Użyto *muchos* (liczba mnoga rodzaju męskiego), ponieważ *primos*, podobnie jak *hermanos* i *padres*, może oznaczać grupę mieszaną.
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Zapytaj, czy ktoś mieszka blisko rodziców
    gloss: Czy mieszkasz blisko rodziców?
    note: '*Tus* to liczba mnoga od *tu*; jest wymagane, ponieważ *padres* jest w liczbie mnogiej.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Powiedz, z kim mieszkasz
    gloss: Mieszkam z dziadkami.
    note: '*Con* („z”) wprowadza osoby, z którymi ktoś mieszka; *vivo* to forma *yo* czasownika *vivir*, którą znasz już z jednostki 1 (*vivo en Londres*).'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Profil rodziny Eleny
    gloss: 'Nazywam się Elena. Mam trzydzieści jeden lat i mieszkam z dziadkami w Hiszpanii. Moja mama i mój tata mieszkają w Barcelonie. Mam siostrę i brata: jest nas pięcioro w domu. Moja młodsza siostra ma na imię Sofía i ma dwadzieścia lat.'
    note: Ten profil łączy słownictwo i konstrukcje z lekcji 1–4 w spójny krótki tekst zamiast pojedynczych zdań. To ta sama umiejętność rozumienia, kto jest kim, którą sprawdza czytanie w tej jednostce.
    glosses:
      llamo: nazywam się (od llamarse)
      Tengo: mam (od tener)
      treinta: trzydzieści
      años: lat
      vivo: mieszkają (od vivir)
      abuelos: dziadkowie
      madre: matka
      padre: ojciec
      viven: mieszkają (od vivir)
      hermana: siostra
      hermano: brat
      somos: jesteśmy (od ser)
      cinco: pięć
      casa: dom
      menor: młodsza
      tiene: ma (od tener)
      veinte: dwadzieścia
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Młodsza siostra
    gloss: młodsza siostra
    note: '*Menor* („młodszy/młodsza”) stoi po rzeczowniku, który opisuje, i nie zmienia formy w zależności od rodzaju.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Mieszka (trzecia osoba)
    gloss: mieszka
    note: '*Vive* to forma 3. osoby liczby pojedynczej czasownika *vivir*. Używamy jej, mówiąc O kimś (*Elena vive*...), a nie o sobie (*vivo*, które pojawiło się w lekcji 4 jednostki 1 i ponownie w lekcji 4 tej jednostki).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Jej/jego/ich (rzeczownik w liczbie mnogiej)
    gloss: jej/jego/ich
    note: '*Sus* to liczba mnoga od *su*; *su* oznacza „jego/jej/Pana/Pani” przy rzeczowniku w liczbie pojedynczej, a *sus abuelos* znaczy „jej dziadkowie”, gdy mowa o Elenie w trzeciej osobie.'
  es.a1.unit03.lesson06.teach.line01:
    title: Pokaż zdjęcia rodziny
    gloss: Elena pokazuje Mateo zdjęcie i przedstawia rodziców oraz młodszą siostrę.
    note: '*Estos son* („to są”, liczba mnoga rodzaju męskiego/mieszana) przedstawia rodziców, a *esta es* („to jest”, rodzaj żeński, liczba pojedyncza) przedstawia siostrę.'
  es.a1.unit03.lesson06.teach.line02:
    title: Zareaguj i zapytaj o rodzeństwo
    gloss: Mateo reaguje ciepło i pyta, czy Elena ma więcej rodzeństwa.
    note: '*Qué bonito* to naturalna, ciepła reakcja na widok zdjęcia, podobna w funkcji do *Qué bien* z jednostki 1.'
  es.a1.unit03.lesson06.teach.line03:
    title: Podaj liczbę domowników i zadaj pytanie zwrotne
    gloss: Elena mówi, że ma siostrę i brata, że jest ich w domu pięcioro, a potem pyta o rodzinę Mateo.
    note: '*Somos cinco en casa* podaje liczbę wszystkich domowników i kontynuuje wzorzec z lekcji 4.'
  es.a1.unit03.lesson06.teach.line04:
    title: Opisz mniejszą rodzinę
    gloss: 'Mateo mówi, że jego rodzina jest mniejsza – są tylko we troje: rodzice i on – ale ma wielu kuzynów.'
    note: '*Pero* („ale”) wprowadza kontrast między małą najbliższą rodziną a licznymi dalszymi krewnymi.'
  es.a1.unit03.lesson06.teach.line05:
    title: Zapytaj o bliskość rodziców
    gloss: Elena pyta, czy Mateo mieszka blisko rodziców.
    note: '*Cerca de* („blisko”) to częsty sposób opisywania bliskości w przestrzeni.'
  es.a1.unit03.lesson06.teach.line06:
    title: Wyjaśnij odległość i utrzymywanie kontaktu
    gloss: Mateo mówi, że nie, bo jego rodzice mieszkają w Kolumbii, ale rozmawiają przez telefon co tydzień.
    note: 'Kontynuacja faktu z jednostki 1: Mateo pochodzi z Kolumbii, ale mieszka w Londynie, a jego rodzice zostali w Kolumbii.'
  es.a1.unit03.lesson06.teach.line07:
    title: Okaż zrozumienie i opowiedz o swojej sytuacji
    gloss: Elena mówi, że rozumie, i dodaje, że mieszka tu, w Hiszpanii, z dziadkami.
    note: '*Entiendo* („rozumiem”) to naturalny, krótki sposób, by zareagować na to, co ktoś powiedział, zanim dodasz własną, powiązaną informację.'
  es.a1.unit03.lesson06.teach.line08:
    title: Zakończ ciepłą uwagą
    gloss: Mateo mówi, że to miło mieć rodzinę blisko.
    note: '*Qué bien tener a la familia cerca* kończy rozmowę ciepłą, refleksyjną uwagą, nawiązującą do wzorca *qué bien*/*qué bonito* z całego dialogu.'
