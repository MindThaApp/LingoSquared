teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Wstawać
    gloss: wstawać → wstaję
    note: '*Levantarse* jest czasownikiem zwrotnym: zaimek *me* stoi przed czasownikiem, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: Ubierać się
    gloss: ubierać się → ubieram się
    note: '*Vestirse* też jest zwrotne: *Me visto*. Tutaj *me* odpowiada polskiemu „się”.'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Jeść śniadanie
    gloss: jeść śniadanie → jem śniadanie
    note: '*Desayunar* nie jest zwrotne: *Desayuno*, bez *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Praca
    gloss: pracować → pracuję
    note: '*Trabajar* to regularny czasownik na -ar: forma *yo* kończy się na -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Jeść
    gloss: jeść → jem
    note: '*Comer* to regularny czasownik na -er: forma *yo* kończy się na -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: Zmywać naczynia
    gloss: zmywać naczynia → zmywam naczynia
    note: '*Lavar los platos* nie jest zwrotne: *Lavo los platos*. Dopełnienie *los platos* stoi po czasowniku.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Spać
    gloss: spać → śpię
    note: '*Dormir* zmienia samogłoskę rdzenia w formie *yo*: *duermo* (o zmienia się w ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: Wzór zwrotny
    gloss: 'Z czasownikami levantarse i vestirse zaimek stoi przed czasownikiem: levantarse → Me levanto.'
    note: 'W czasownikach zwrotnych stawiaj *me* przed odmienionym czasownikiem: mów *Me levanto*, a nie *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse w zdaniu
    gloss: 'wstawać: Wstaję o siódmej.'
    note: 'Określenie czasu stoi po czasowniku: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse w zdaniu
    gloss: 'ubierać się: Ubieram się.'
    note: 'Wzór to *me* + *visto*: zaimek stoi tuż przed czasownikiem.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos w zdaniu
    gloss: 'zmywać naczynia: Zmywam naczynia po jedzeniu.'
    note: '*Después de comer* („po jedzeniu”) składa się z *de* i bezokolicznika i może stać na końcu zdania.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Czasowniki bez me
    gloss: 'Bez zaimka: Jem śniadanie. Pracuję. Śpię. Te czasowniki nie są zwrotne.'
    note: '*Desayuno*, *trabajo* i *duermo* nie mają *me*: te czasowniki nie są zwrotne.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Wstawać wpół do ósmej
    gloss: Wstaję o 7:30.
    note: 'Po hiszpańsku „wpół do” wyraża się przez *y media*, czyli dosłownie „i pół”: *las siete y media* to 7:30. Przed godziną użyj *a las*.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Ubierać się za kwadrans ósma
    gloss: Ubieram się o 7:45.
    note: '*Las ocho menos cuarto* liczy się wstecz od następnej godziny: 7:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Jeść śniadanie o ósmej
    gloss: Jem śniadanie o ósmej.
    note: 'Przed godziną użyj *a las*: *a las ocho*. Dla pierwszej jest *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Pracować od dziewiątej do piątej
    gloss: Pracuję od dziewiątej do piątej.
    note: '*De ... a ...* podaje godzinę początku i końca: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Jeść obiad wpół do siódmej
    gloss: Jem o 18:30.
    note: '*De la tarde* wyraźnie wskazuje popołudnie/wieczór, więc *las seis y media* to tutaj 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Spać o jedenastej
    gloss: Śpię od jedenastej.
    note: 'Przed godziną użyj *a las*: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: Najpierw, potem, później
    gloss: najpierw, potem, później
    note: '*Primero* oznacza pierwszą czynność, *luego* następną, a *después* to, co po niej.'
    example_gloss:
    - Najpierw wstaję.
    - Potem się ubieram.
    - Później jem śniadanie.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: Poranek w trzech krokach
    gloss: Najpierw wstaję. Potem się ubieram. Później jem śniadanie.
    note: 'Czasowniki zwrotne mają *me* przed czasownikiem: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Słowa porządkujące
    gloss: 'Primero, luego i después porządkują twoje czynności; forma czasownika się nie zmienia: Después desayuno.'
    note: 'Słowa porządkujące stoją na początku zdania, a forma czasownika się nie zmienia: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: Mój dzień
    gloss: Mój dzień — Wstaję o 7:30. Później się ubieram, a o ósmej jem śniadanie. Pracuję od dziewiątej do piątej. O 18:30 jem obiad. Potem zmywam naczynia. O jedenastej idę spać.
    note: Zwróć uwagę zarówno na kolejność czynności, jak i na godziny. Zauważ *me levanto* i *me visto* z *me*.
    glosses:
      Mi: mój
      día: dzień
      levanto: wstawać (me levanto)
      media: wpół do (y media = i pół)
      ocho: osiem
      Después: później
      visto: ubierać się (me visto)
      las: rodzajnik przed godziną (las ocho)
      desayuno: jeść śniadanie
      Trabajo: praca
      nueve: dziewięć
      cinco: pięć
      siete: siedem
      tarde: po południu, wieczorem
      como: jeść
      lavo: zmywać naczynia (lavo los platos)
      once: jedenaście
      duermo: spać
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Pytanie o dzień
    gloss: 'Elena: Jak wygląda twój dzień, Mateo?'
    note: '*¿Cómo es tu día?* to nieformalny sposób zapytania, jak wygląda czyjś dzień; *tu* to nieformalne „twój”.'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: Poranek Mateo
    gloss: 'Mateo: Wstaję o 7:30. Później się ubieram, a o ósmej jem śniadanie.'
    note: Mateo łączy trzy poranne czynności za pomocą *después* i *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: Dzień pracy Mateo
    gloss: 'Elena: Kiedy pracujesz? Mateo: Pracuję od dziewiątej do piątej.'
    note: 'Elena i Mateo mówią do siebie na ty, używając nieformalnych form *tú*: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: Wieczór Mateo
    gloss: 'Mateo: O 18:30 jem obiad. Potem zmywam naczynia. O jedenastej idę spać.'
    note: '*Después* stoi na początku zdania, ale forma czasownika się nie zmienia: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: Poranek Eleny
    gloss: 'Elena: Wstaję o szóstej, ale śniadanie jem dopiero o 6:30.'
    note: '*No ... hasta* znaczy „dopiero (o)”, dosłownie „nie aż do”. Elena zestawia godzinę wstawania z godziną śniadania.'
