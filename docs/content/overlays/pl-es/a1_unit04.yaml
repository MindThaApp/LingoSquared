course:
  title: Hiszpański A1
  description: Dni tygodnia, miesiące roku oraz pytanie o datę i podawanie daty kalendarzowej i urodzin; dalszy ciąg historii Eleny i Mateo z warsztatów kulinarnych z jednostek 01–03. Szczególna uwaga na sposób podawania daty za pomocą liczebników głównych.
