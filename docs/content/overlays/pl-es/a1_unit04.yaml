teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Poniedziałek–piątek
    gloss: poniedziałek, wtorek, środa, czwartek, piątek
    note: Hiszpańskie nazwy dni tygodnia pisze się małą literą, podobnie jak w polskim; wielką tylko na początku zdania.
    example_gloss:
    - Warsztaty kulinarne są we wtorki.
    - W czwartki uczę się hiszpańskiego.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Sobota, niedziela
    gloss: sobota, niedziela
    note: '*Sábado* i *domingo* to jedyne dwa dni tygodnia, które w liczbie mnogiej przyjmują -s (*los sábados*, *los domingos*); pozostałe nazwy dni mają taką samą formę w liczbie pojedynczej i mnogiej.'
    example_gloss:
    - W soboty chodzę na targ.
    - W niedziele odpoczywam.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Dzisiaj jest piątek
    gloss: Dzisiaj jest piątek.
    note: '*Hoy* (dzisiaj) + *es* (jest) + nazwa dnia wprost podaje, jaki jest dzisiaj dzień; rodzajnik nie jest potrzebny.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: Warsztaty są we wtorki
    gloss: Warsztaty kulinarne są we wtorki.
    note: '*Los martes* (z rodzajnikiem w liczbie mnogiej *los*) znaczy „we wtorki” jako stały termin w harmonogramie, a nie jeden konkretny wtorek.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Styczeń–czerwiec
    gloss: styczeń, luty, marzec, kwiecień, maj, czerwiec
    note: Podobnie jak dni tygodnia, hiszpańskie nazwy miesięcy pisze się małą literą, chyba że stoją na początku zdania. W polskim jest tak samo.
    example_gloss:
    - Moje urodziny są w marcu.
    - W czerwcu jest gorąco.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Lipiec–grudzień
    gloss: lipiec, sierpień, wrzesień, październik, listopad, grudzień
    note: '*Septiembre* przypomina polskie „september” z łacińskiego rdzenia; wiele hiszpańskich nazw miesięcy jest podobnych do nazw używanych w innych językach europejskich.'
    example_gloss:
    - Warsztaty kulinarne zaczynają się w lipcu.
    - W grudniu odwiedzam rodzinę.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Moje urodziny są w marcu
    gloss: Moje urodziny są w marcu.
    note: '*En* (w) stosuje się z samą nazwą miesiąca, bez konkretnego dnia.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Pytanie o dzisiejszą datę
    gloss: Jaka jest dzisiaj data?
    note: '*Qué fecha* (jaka data) to standardowy sposób pytania o datę kalendarzową, inny niż *qué hora* (która godzina), które pojawi się w jednej z kolejnych jednostek.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Podawanie daty
    gloss: Dziś jest dwudziesty drugi lipca.
    note: '*El veintidós de julio* dosłownie znaczy „dwadzieścia dwa lipca”. Po hiszpańsku datę podaje się liczebnikiem głównym, a nie porządkowym, jak w polskim „dwudziestego drugiego”.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: Hiszpański zapis daty
    gloss: Jak po hiszpańsku podaje się daty.
    note: Liczebnik główny + de + miesiąc. Na pierwszy dzień miesiąca często mówi się *el primero* (zwłaszcza w Ameryce Łacińskiej), używa się też *el uno*, szczególnie w Hiszpanii.
    target_text: 'Po hiszpańsku datę podaje się za pomocą liczebnika głównego + de + miesiąc, a nie liczebnika porządkowego: el veintidós de julio dosłownie znaczy „dwadzieścia dwa lipca”. Na określenie pierwszego dnia miesiąca wielu użytkowników języka (zwłaszcza w Ameryce Łacińskiej) mówi *el primero*; *el uno* też jest częste, szczególnie w Hiszpanii.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Zapytaj, kiedy są warsztaty
    gloss: Kiedy są warsztaty?
    note: '*Cuándo* (kiedy) pyta ogólnie o czas, a *qué fecha* (drugie pytanie z tej lekcji) pyta konkretnie o datę. Oba pytania są tu naturalne.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Podaj datę warsztatów
    gloss: Warsztaty są dwudziestego drugiego lipca.
    note: Ten sam wzorzec daty co w zdaniu *hoy es el veintidós de julio*, tylko z innym podmiotem (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Zapytaj o czyjeś urodziny
    gloss: Kiedy masz urodziny?
    note: '*Tu cumpleaños* (twoje urodziny) to forma nieformalna, w rejestrze *tú*, używana wobec przyjaciół.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Podaj datę swoich urodzin
    gloss: Moje urodziny są dziesiątego marca.
    note: Inaczej niż w *en marzo* (w marcu, tylko miesiąc), pełna data urodzin wymaga *el* i liczby określającej dzień, tak samo jak w *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Podaj datę urodzin trzeciej osoby
    gloss: Urodziny Mateo są dwudziestego drugiego sierpnia.
    note: '*El cumpleaños de Mateo* (urodziny Mateo) wyraża przynależność za pomocą *de*, tak samo jak *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: Gratulacje!
    gloss: Gratulacje! / Wszystkiego najlepszego!
    note: '*¡Felicidades!* to uniwersalne słowo na gratulacje, używane zarówno przy urodzinach, jak i przy innych dobrych wiadomościach.'
    example_gloss: Gratulacje, Elena! Dziś są twoje urodziny.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Czytamy harmonogram warsztatów
    gloss: Warsztaty kulinarne odbywają się we wtorki. Najbliższe zajęcia są dwudziestego drugiego lipca. Potem są zajęcia dwudziestego dziewiątego lipca. Warsztaty kończą się dwunastego sierpnia.
    note: Ten krótki harmonogram łączy w jednym tekście nazwy dni tygodnia i wzorzec daty, które już znasz.
    glosses:
      taller: warsztaty
      cocina: kulinarne
      martes: we wtorki
      próxima: następny
      clase: zajęcia
      veintidós: dwadzieścia dwa
      julio: lipiec
      Después: potem
      hay: jest (od haber)
      veintinueve: dwadzieścia dziewięć
      termina: kończy się (od terminar)
      doce: dwanaście
      agosto: sierpień
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: Najbliższe zajęcia
    gloss: najbliższe zajęcia
    note: '*Próxima* (następna) zgadza się z rzeczownikiem rodzaju żeńskiego *clase*. Forma rodzaju męskiego to *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (potem)
    gloss: Jak *después* łączy zdarzenia w kolejności.
    note: '*Después* = potem, później, po.'
    target_text: '*Después* (po, potem) łączy dwa wydarzenia w kolejności: najpierw jedno, potem drugie.'
  es.a1.unit04.lesson06.teach.line01:
    title: Zapytaj o najbliższe zajęcia
    gloss: Mateo pyta Elenę, kiedy są najbliższe zajęcia warsztatów.
    note: '*La próxima clase del taller* = najbliższe zajęcia warsztatów.'
  es.a1.unit04.lesson06.teach.line02:
    title: Podaj datę
    gloss: Elena potwierdza, że to dwudziesty drugi lipca, wtorek.
    note: Elena dodaje po dacie *un martes* (wtorek), potwierdzając, że zajęcia są w zwykły dzień warsztatów, czyli we wtorek.
  es.a1.unit04.lesson06.teach.line03:
    title: Zapytaj, kiedy kończą się warsztaty
    gloss: Mateo pyta, kiedy kończą się warsztaty.
    note: '*Perfecto* (świetnie) to naturalne krótkie potwierdzenie przed kolejnym pytaniem.'
  es.a1.unit04.lesson06.teach.line04:
    title: Podaj datę zakończenia
    gloss: Elena mówi, że kończą się dwunastego sierpnia.
    note: Ta sama data zakończenia, co w wydrukowanym harmonogramie.
  es.a1.unit04.lesson06.teach.line05:
    title: Zapytaj o urodziny w trakcie rozmowy
    gloss: Mateo mówi „à propos” i pyta, kiedy są urodziny Eleny.
    note: '*Por cierto* (à propos, przy okazji) naturalnie wprowadza zmianę tematu w trakcie rozmowy.'
  es.a1.unit04.lesson06.teach.line06:
    title: Podaj datę i zadaj pytanie zwrotne
    gloss: 'Elena mówi: dziesiątego marca, po czym pyta: „A twoje?”'
    note: '*¿Y el tuyo?* (a twoje?) używa zaimka dzierżawczego *tuyo*, nowej krótkiej formy do zwrotnego pytania o coś już nazwanego (*cumpleaños* jest rodzaju męskiego, stąd *tuyo*, a nie *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: Podaj datę urodzin Mateo
    gloss: 'Mateo mówi: dwudziestego drugiego sierpnia.'
    note: Krótka, pełna odpowiedź z tym samym wzorcem daty, bez powtarzania „mi cumpleaños es”. W szybkiej rozmowie brzmi to naturalnie.
  es.a1.unit04.lesson06.teach.line08:
    title: Zareaguj i zauważ kolejność
    gloss: Elena reaguje z radością, zauważając, że jego urodziny wypadają po zakończeniu warsztatów.
    note: '*Es después del taller* (to po warsztatach): 22 sierpnia jest po zakończeniu warsztatów 12 sierpnia.'
