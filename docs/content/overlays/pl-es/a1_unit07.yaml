teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: Targ
    gloss: targ
    note: '*Mercado* jest rodzaju męskiego.'
    example_gloss: Chodźmy na targ.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Owoce, warzywa
    gloss: owoce, warzywa
    note: '*Verdura* oznacza warzywa w ogóle (często zielone). To rzeczownik rodzaju żeńskiego w liczbie pojedynczej, używany zbiorczo, podobnie jak polskie „warzywa” czy „zielenina”.'
    example_gloss:
    - Chcę kupić owoce.
    - Warzywa są świeże.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Jajka, chleb
    gloss: jajka, chleb
    note: '*Huevos* jest już w liczbie mnogiej (liczba pojedyncza to *huevo*). *Pan* (chleb) jest rzeczownikiem niepoliczalnym, podobnie jak po polsku, i w codziennym znaczeniu nie ma naturalnej liczby mnogiej.'
    example_gloss:
    - Potrzebuję jajek.
    - Chleb jest z dzisiejszego ranka.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Zapytaj o cenę
    gloss: Ile to kosztuje?
    note: '*Cuesta* to forma 3. osoby czasownika *costar* (kosztować), nowego czasownika w tej lekcji.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: Zapytaj o cenę – inna forma
    gloss: Ile to jest?
    note: Zobacz następną notatkę gramatyczną, w której porównano tę formę z *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Podaj cenę
    gloss: Kosztuje dwa.
    note: Krótka, pełna odpowiedź o cenie – waluta wynika z kontekstu, podobnie jak po polsku, gdy przy zakupach mówi się samą liczbę.
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta czy Cuánto es
    gloss: Dwa równie naturalne sposoby pytania o cenę.
    note: Zobacz treść karty.
    target_text: '*¿Cuánto cuesta?* („ile to kosztuje?”) i *¿Cuánto es?* („ile to jest?”) to dwa naturalne sposoby zapytania o cenę – w codziennych zakupach można ich używać zamiennie.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Poproś o tuzin jajek
    gloss: Poproszę tuzin jajek.
    note: '*Docena* (tuzin) to rzeczownik, po którym zawsze następuje *de* i nazwa produktu, podobnie jak po polsku „tuzin” łączy się z dopełniaczem (tuzin jajek).'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Poproś o kilo pomidorów
    gloss: Poproszę kilo pomidorów.
    note: '*Kilo* ma ten sam wzór z *de* i nazwą produktu co *docena*.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Pół kilo
    gloss: pół kilo
    note: '*Medio* (pół) stoi przed rzeczownikiem i zgadza się z nim w rodzaju (*medio kilo* – rodzaj męski; *media docena* – rodzaj żeński).'
    example_gloss: Poproszę pół kilo chleba.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Trochę
    gloss: trochę
    note: '*Un poco de* używamy, gdy mówimy o nieokreślonej, niewielkiej ilości i dokładna miara nie jest potrzebna.'
    example_gloss: Chcę trochę owoców.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Zapytaj, czy coś jeszcze jest potrzebne
    gloss: Czy potrzebuje Pan/Pani czegoś jeszcze?
    note: '*Necesita* to forma *usted* czasownika *necesitar*, czyli grzecznościowa, jakiej zwykle używa sprzedawca wobec klienta.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Powiedz, że macie już wszystko
    gloss: Nie, myślę, że mamy już wszystko.
    note: '*Creo que* (myślę, że) to częsty sposób złagodzenia wypowiedzi; tutaj potwierdza, że lista zakupów jest kompletna.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: Podziękuj sprzedawcy
    gloss: Świetnie, dziękuję.
    note: Krótkie, naturalne zakończenie rozmowy przy zakupach.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Czytanie cen na etykietach
    gloss: 'Stoisko Rosy: pomidory, dwa za kilo. Jajka, cztery za tuzin. Chleb, sześć. Świeże owoce codziennie.'
    note: 'Typowa etykieta cenowa na straganie: produkt, cena, a potem jednostka, której cena dotyczy (*el kilo*, *la docena*). *Puesto* to stragan; ten prowadzi Rosa.'
    glosses:
      Puesto: stoisko / stragan
      tomates: pomidory
      kilo: kilogram
      Huevos: jajka
      docena: tuzin
      Pan: chleb
      Fruta: owoce
      fresca: świeże
      todos: każdy
      días: dni
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo jako „za kilo”
    gloss: Jak słowo oznaczające jednostkę po cenie znaczy „za” tę jednostkę.
    note: Zobacz treść karty.
    target_text: '*El kilo* po cenie („tomates, dos el kilo”) oznacza „za kilogram” – cena dotyczy każdego kupowanego kilograma.'
  es.a1.unit07.lesson06.teach.line01:
    title: Zaproponuj pójście na targ
    gloss: Elena proponuje pójść na targ po składniki na następne zajęcia.
    note: '*Para la próxima clase* znaczy „na następne zajęcia” – kolejne spotkanie warsztatów kulinarnych.'
  es.a1.unit07.lesson06.teach.line02:
    title: Zgódź się i zapytaj, czego trzeba
    gloss: Mateo zgadza się i pyta, czego potrzebują.
    note: '*¿Qué necesitamos?* to forma *nosotros* czasownika *necesitar*, odpowiadająca polskiemu „potrzebujemy” (my razem).'
  es.a1.unit07.lesson06.teach.line03:
    title: Zwróć uwagę na świeże pomidory
    gloss: Elena mówi, że najpierw warzywa, i zwraca uwagę, jak świeże są pomidory.
    note: '*¡Qué tomates tan frescos!* (jakie świeże pomidory!) to wykrzyknienie z *qué*, jak *¡Qué bonito!* z lekcji 3, ale zbudowane z rzeczownikiem: *qué* + rzeczownik + *tan* + przymiotnik.'
  es.a1.unit07.lesson06.teach.line04:
    title: Sprzedawca pyta o ilość
    gloss: Sprzedawca pyta Elenę, ile chce.
    note: '*Señorita* to grzeczny zwrot do młodej kobiety, zgodny z formą grzecznościową *usted*, jakiej sprzedawca używa wobec klienta (niektórzy dziś uważają go za nieco staromodny).'
  es.a1.unit07.lesson06.teach.line05:
    title: Zamów kilo i zapytaj o cenę
    gloss: Elena prosi o kilo i pyta o cenę.
    note: Łączy *un kilo* z *¿Cuánto cuesta?* z wcześniejszej części lekcji w jednej naturalnej wymianie.
  es.a1.unit07.lesson06.teach.line06:
    title: Podaj cenę
    gloss: Sprzedawca mówi, że kosztuje dwa.
    note: '*Cuesta dos* – krótka odpowiedź o cenie; waluta wynika z kontekstu.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo zamawia jajka i chleb
    gloss: Mateo mówi, że potrzebuje tuzina jajek i chleba.
    note: Łączy *huevos*/*pan* z *una docena de* z wcześniejszej części lekcji; *yo* jest opcjonalne i lekko podkreśla osobę („ja potrzebuję...”), podobnie jak polskie „ja”.
  es.a1.unit07.lesson06.teach.line08:
    title: Sprzedawca podaje obie ceny
    gloss: Sprzedawca mówi, że jajka kosztują cztery, a chleb sześć.
    note: '*Cuestan* (liczba mnoga, „kosztują”) zgadza się z podmiotem w liczbie mnogiej *los huevos*, inaczej niż *cuesta* w liczbie pojedynczej użyte przy pomidorach.'
  es.a1.unit07.lesson06.teach.line09:
    title: Podziękuj sprzedawcy
    gloss: 'Mateo mówi: świetnie, dziękuję.'
    note: To samo krótkie zakończenie co wcześniej w tej lekcji.
  es.a1.unit07.lesson06.teach.line10:
    title: Zapytaj przyjaciela, czy potrzebuje czegoś jeszcze
    gloss: Elena pyta Mateo, czy potrzebuje czegoś jeszcze.
    note: '*¿Necesitas...?* to forma *tú*, używana wobec przyjaciela; *¿Necesita...?* sprzedawcy to forma *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: Powiedz, że macie wszystko
    gloss: Mateo mówi, że nie, myśli, że mają już wszystko.
    note: '*Creo que* (myślę, że) łagodzi odpowiedź; *ya* znaczy „już”.'
