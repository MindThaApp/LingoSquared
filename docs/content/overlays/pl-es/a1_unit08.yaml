teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Bank, apteka
    gloss: bank, apteka
    note: '*Banco* jest rodzaju męskiego, a *farmacia* żeńskiego.'
    example_gloss:
    - Idę do banku.
    - Apteka otwiera się o dziewiątej.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Park, restauracja
    gloss: park, restauracja
    note: Oba rzeczowniki są rodzaju męskiego.
    example_gloss:
    - Park jest bardzo ładny.
    - Jemy w restauracji.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Biblioteka
    gloss: biblioteka
    note: '*Biblioteca* jest rodzaju żeńskiego.'
    example_gloss: Uczę się w bibliotece.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: Blisko
    gloss: Restauracja jest blisko targu.
    note: Po *cerca de* („blisko”) zawsze występuje *de* przed miejscem odniesienia.
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Daleko od
    gloss: Park jest daleko od targu.
    note: '*Lejos de* („daleko od”) jest przeciwieństwem *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: Obok
    gloss: Bank jest obok targu.
    note: '*Al lado de* („obok”) to stały zwrot (*al* = *a* + *el lado*). Przed rzeczownikiem rodzaju męskiego, jak *mercado*, *de* + *el* łączy się w *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: Naprzeciwko
    gloss: Apteka jest naprzeciwko targu.
    note: '*Enfrente de* (naprzeciwko) opisuje dwa miejsca po przeciwnych stronach czegoś, na przykład ulicy.'
  es.a1.unit08.lesson02.teach.entre:
    title: Między
    gloss: Biblioteka jest między bankiem a parkiem.
    note: '*Entre* (między) wymaga dwóch punktów odniesienia, połączonych tutaj za pomocą *y* (i).'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Zapytaj, gdzie jest bank
    gloss: Gdzie jest bank?
    note: '*Dónde está* (gdzie jest) to podstawowy wzór pytania o położenie miejsca.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Odpowiedz, podając położenie
    gloss: Jest obok targu.
    note: '*Del* to zlanie się *de* + *el*; jest obowiązkowe przed rzeczownikiem rodzaju męskiego *mercado*.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Zapytaj, gdzie jest apteka
    gloss: Gdzie jest apteka?
    note: Ten sam wzór pytania, tu z rzeczownikiem rodzaju żeńskiego – samo pytanie nie zmienia się w zależności od rodzaju.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Odpowiedź: naprzeciwko'
    gloss: Jest naprzeciwko targu.
    note: '*Enfrente de* + *el mercado* daje *enfrente del mercado* – to samo zlanie *del* co w *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Zapytaj, czy to daleko
    gloss: Czy to daleko?
    note: Krótkie pytanie uzupełniające, w którym pomijamy podmiot, bo wynika on już z kontekstu.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Odpowiedź: nie, jest blisko'
    gloss: Nie, jest blisko.
    note: Samo *cerca* (bez *de*) wystarcza jako krótka odpowiedź, inaczej niż pełna fraza *cerca de* z nazwanym miejscem.
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Odpowiedź: tak, dość daleko'
    gloss: Tak, to dość daleko.
    note: '*Bastante* (dość) wzmacnia *lejos*, ale słabiej niż *muy* (bardzo).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Czytanie o okolicy
    gloss: W tej okolicy jest wiele przydatnych miejsc. Bank jest obok targu. Apteka jest naprzeciwko targu. Park jest daleko, ale biblioteka jest między bankiem a parkiem. Restauracja jest bardzo blisko targu.
    note: Ten krótki tekst łączy w jednym opisie okolicy wyrażenia określające położenie z tej lekcji.
    glosses:
      barrio: dzielnica
      hay: jest, są (od haber)
      muchos: wiele
      lugares: miejsca
      útiles: przydatny
      banco: bank
      está: znajduje się (od estar)
      lado: bok, strona
      mercado: targ
      farmacia: apteka
      enfrente: naprzeciwko
      parque: park
      lejos: daleko
      biblioteca: biblioteka
      entre: między
      restaurante: restauracja
      cerca: blisko
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (jest/są)
    gloss: Dlaczego hay nie zmienia się w liczbie pojedynczej i mnogiej.
    note: Zobacz tekst na samej karcie.
    target_text: '*Hay* („jest/są”) nie zmienia się w liczbie pojedynczej ani mnogiej: *hay un banco* i *hay muchos lugares* mają to samo słowo.'
  es.a1.unit08.lesson06.teach.line01:
    title: Zapytaj, gdzie jest bank
    gloss: Mateo pyta Elenę, gdzie jest bank.
    note: To samo pytanie *¿Dónde está...?* co wcześniej w tej lekcji, tu zaczęte od imienia Eleny, by zwrócić jej uwagę.
  es.a1.unit08.lesson06.teach.line02:
    title: Odpowiedz i odwołaj się do targu
    gloss: Elena mówi, że bank jest obok targu, na którym kupili jajka.
    note: '*Donde compramos los huevos* (gdzie kupiliśmy jajka) nawiązuje do ich zakupów z lekcji 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Zapytaj o aptekę
    gloss: Mateo potwierdza i pyta o aptekę.
    note: '*Ah, sí* (a tak) to naturalna krótka reakcja przed kolejnym pytaniem.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Odpowiedź: naprzeciwko'
    gloss: Elena mówi, że apteka jest naprzeciwko targu.
    note: 'Krótka odpowiedź: podmiot (*la farmacia*) jest pominięty, bo wynika z pytania.'
  es.a1.unit08.lesson06.teach.line05:
    title: Zapytaj o park
    gloss: Mateo pyta o park i czy jest blisko.
    note: Dwa pytania w jednej wypowiedzi – naturalne w swobodnej rozmowie.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Odpowiedź: daleko, potem wzmianka o bibliotece'
    gloss: Elena mówi, że park jest daleko, ale biblioteka jest między bankiem a parkiem.
    note: '*Pero* (ale) zestawia odległość parku z dogodniejszym położeniem biblioteki.'
  es.a1.unit08.lesson06.teach.line07:
    title: Podziękuj i zapytaj o restaurację
    gloss: Mateo dziękuje Elenie i pyta o restaurację, w której jedli.
    note: '*El restaurante donde comimos* (restauracja, w której jedliśmy) nawiązuje do ich lunchu z lekcji 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Potwierdź, że jest bardzo blisko
    gloss: Elena potwierdza, że restauracja jest bardzo blisko targu.
    note: '*Muy cerca* (bardzo blisko): *muy* (bardzo) jest mocniejsze niż *bastante* (dość), jak w *bastante lejos* (dość daleko).'
