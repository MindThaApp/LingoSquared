teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: Praca
    gloss: praca
    note: '*Trabajo* jest rodzaju męskiego i oznacza też formę czasownika „pracuję”.'
    example_gloss: Lubię swoją pracę.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: Biuro
    gloss: biuro
    note: '*Oficina* jest rodzaju żeńskiego.'
    example_gloss: Pracuję w biurze.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: Lada
    gloss: lada
    note: '*Escritorio* jest rodzaju męskiego.'
    example_gloss: To moje biurko.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: Szkoła
    gloss: szkoła
    note: '*Escuela* jest rodzaju żeńskiego.'
    example_gloss: Uczę w szkole.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: Uczniowie / studenci
    gloss: uczniowie / studenci
    note: '*Estudiante* ma tę samą formę dla mężczyzny i kobiety; liczba mnoga *los estudiantes* oznacza też grupę mieszaną.'
    example_gloss: Mam dwudziestu uczniów.
  es.a1.unit13.lesson02.teach.trabajar:
    title: Pracować
    gloss: pracować
    note: Bezokolicznik czasownika, używany w konstrukcjach takich jak *me gusta trabajar* (lubię pracować).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Powiedz, że jesteś księgowym
    gloss: Jestem księgowym.
    note: Nazwy zawodów występują po *ser* bez rodzajnika — zobacz notatkę gramatyczną poniżej.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Powiedz, że jesteś nauczycielką
    gloss: Jestem nauczycielką.
    note: '*Profesora* to żeńska forma od *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Powiedz, gdzie uczysz
    gloss: Uczę w szkole.
    note: '*Enseño* (uczę) to forma 1. osoby liczby pojedynczej od *enseñar*; tu razem z *escuela* (szkoła).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: Nazwy zawodów z ser
    gloss: Jak po hiszpańsku podać zawód bez rodzajnika.
    note: Zobacz tekst na samej karcie.
    target_text: 'Nazwy zawodów występują po *ser* bez rodzajnika: *soy contador* (jestem księgowym), a nie *soy un contador*. *Contador* ma żeńską formę *contadora*; *profesor/profesora* to taka sama para form męskiej i żeńskiej oznaczająca nauczyciela (dla kobiety dodajesz *-a*).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Zapytaj kogoś o pracę
    gloss: Czym się Pan/Pani zajmuje zawodowo?
    note: '*¿En qué trabajas?* (dosłownie „w czym pracujesz?”) to standardowy sposób zapytania o czyjś zawód.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Odpowiedz, jaki masz zawód
    gloss: Pracuję w biurze. Jestem księgowym.
    note: Łączy *oficina* z *soy contador* w naturalną odpowiedź złożoną z dwóch zdań.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Powiedz, że lubisz swoją pracę
    gloss: Lubię swoją pracę.
    note: Znów konstrukcja z *gustar*, tym razem z *mi trabajo* (moja praca).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Powiedz, co wolisz
    gloss: Ale wolę gotować.
    note: '*Prefiero* (wolę) to forma, którą już znasz; *cocinar* (gotować) to bezokolicznik czasownika oznaczającego główne zajęcie bohaterów tej historii.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Powiedz, że oboje wolicie to
    gloss: Oboje wolimy to.
    note: '*Preferimos* to forma *nosotros* od *preferir*, użyta, gdy Elena i Mateo są zgodni.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Czytanie o ich pracy
    gloss: Mateo pracuje w biurze w Londynie. Jest księgowym. Elena uczy w szkole. Jest nauczycielką i ma dwudziestu uczniów. Oboje lubią swoją pracę, ale wolą razem gotować we wtorki.
    note: Krótkie podsumowanie codziennej pracy Mateo i Eleny.
    glosses:
      trabaja: pracuje (od trabajar)
      oficina: biuro
      contador: księgowy
      enseña: uczy (od enseñar)
      escuela: szkoła
      profesora: nauczycielka
      tiene: ma (od tener)
      veinte: dwadzieścia
      estudiantes: uczniowie
      gusta: podoba się / jest lubiane (od gustar)
      trabajo: praca
      prefieren: wolą (od preferir)
      cocinar: gotować
      juntos: razem
      martes: wtorki
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Jak gustar rozszerza się na dopełnienie dalsze w liczbie mnogiej.
    note: Zobacz tekst samej karty.
    target_text: '*A los dos les gusta* (obojgu się podoba) rozszerza konstrukcję z *gustar*, którą już znasz, na dopełnienie w liczbie mnogiej: *les* (im) zamiast *me/te* (mi/ci).'
  es.a1.unit13.lesson06.teach.line01:
    title: Zapytaj o pracę Mateo
    gloss: Elena pyta Mateo, czym się zajmuje zawodowo.
    note: Pytanie, które już znasz, tym razem skierowane do Mateo po imieniu.
  es.a1.unit13.lesson06.teach.line02:
    title: Odpowiedz, podając swój zawód
    gloss: Mateo mówi, że pracuje w biurze jako księgowy.
    note: 'Pełna odpowiedź, którą już znasz: gdzie pracuje, a potem jego zawód.'
  es.a1.unit13.lesson06.teach.line03:
    title: Zareaguj i opowiedz o swojej pracy
    gloss: Elena uważa, że to ciekawe, i mówi, że jest nauczycielką.
    note: '*Interesante* (ciekawe) to nowe słowo podobne do polskiego; reszta, czyli *soy profesora* i *enseño en una escuela*, jest ci już znana.'
  es.a1.unit13.lesson06.teach.line04:
    title: Zapytaj, czy lubi uczyć
    gloss: Mateo pyta, czy Elena lubi uczyć.
    note: '*¿Te gusta enseñar?* łączy znany już schemat pytania z *gustar* z bezokolicznikiem *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: Potwierdź i dodaj swoją preferencję
    gloss: Elena mówi, że bardzo to lubi, ale woli gotować z nim we wtorki.
    note: '*Contigo* (z tobą) to nowa, zrośnięta forma przyimka z zaimkiem; *los martes* (we wtorki) ma rodzajnik w liczbie mnogiej, bo chodzi o stały, powtarzający się dzień tygodnia.'
  es.a1.unit13.lesson06.teach.line06:
    title: Zgódź się z tą samą preferencją
    gloss: Mateo mówi, że jego praca też mu się podoba, ale woli gotować.
    note: '*A mí también* (ja też) to wzmocniona forma zgody przy *gustar*: *a mí* podkreśla, kto coś lubi.'
  es.a1.unit13.lesson06.teach.line07:
    title: Wyciągnij wniosek
    gloss: Elena podsumowuje, że oboje wolą to (gotować razem).
    note: '*Entonces* (więc, wtedy) to nowy spójnik wyrażający wynikanie; reszta to *los dos preferimos esto* (oboje wolimy to).'
  es.a1.unit13.lesson06.teach.line08:
    title: Potwierdź z entuzjazmem
    gloss: 'Mateo się zgadza: zdecydowanie.'
    note: '*Definitivamente* (zdecydowanie) to nowy przysłówek podobny do polskiego, który kończy scenę.'
