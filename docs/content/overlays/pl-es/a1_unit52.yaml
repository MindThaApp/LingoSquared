answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Hiszpański A1
  description: 'Hiszpański dla początkujących: opisywanie podstawowego wyglądu osoby — wzrost i wrażenie wieku, kolor włosów i oczu, podstawowe pytanie ¿Cómo es ...? oraz porównywanie wyglądu dwóch osób.'
units:
  es.a1.unit52.appearance:
    title: Opisywanie wyglądu
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Wysoki, niski, stary i młody
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Opisywanie włosów
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Oczy i jak ktoś wygląda?
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena opisuje Ninę
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Porównanie Diega i Lucíi
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo rozpoznaje Ninę
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*Alto* opisuje osobę wysoką, a *bajo* niską; oba słowa zgadzają się z osobą: *alta*, *baja*.'
    example_gloss:
    - Lucía jest wysoka.
    - Diego jest niski.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Stary i młody
    gloss: stary / młody
    note: '*Mayor* i *joven* wyrażają ogólne wrażenie wieku, a nie dokładną liczbę lat.'
    example_gloss:
    - Dziadek jest stary.
    - Mateo jest młody.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: wrażenie, nie liczba'
    gloss: Aby podać dokładny wiek, używasz tener años, np. ¿Cuántos años tienes?; mayor daje ogólne wrażenie bez liczby, np. El abuelo es mayor.
    note: 'Aby podać dokładny wiek, mówisz *tener años*: *¿Cuántos años tienes?* *Mayor* daje tylko ogólne wrażenie, bez liczby.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía jest wysoka, a Diego niski
    gloss: Lucía jest wysoka, a Diego jest niski.
    note: Proste zdanie złożone z *y* („i”), przygotowujące bezpośrednie porównanie w jednej z kolejnych lekcji.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Włosy
    gloss: włosy
    note: '*El pelo* jest rodzaju męskiego i pozostaje w liczbie pojedynczej, gdy mówisz o czyichś włosach jako całości.'
    example_gloss: Mateo ma krótkie czarne włosy.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: 'Trzy kolory włosów: *rubio* (blond), *castaño* (brązowy) i *gris* (siwy). *Rubio* zgadza się z rzeczownikiem: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena ma blond włosy.
    - Diego ma brązowe włosy.
    - Dziadek ma siwe włosy.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*Largo* (długi) znasz już z lekcji o wzroście, teraz dotyczy długości włosów; *corto* (krótki) jest nowe: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía ma długie włosy.
    - Diego ma krótkie włosy.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Przymiotnik stoi po rzeczowniku
    gloss: 'Przymiotnik stoi po rzeczowniku: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'W hiszpańskim przymiotnik zwykle stoi po rzeczowniku i zgadza się z nim: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo i cabello
    gloss: 'Pelo i cabello znaczą to samo. W tym kursie używamy słowa pelo: el pelo largo.'
    note: '*Pelo* i *cabello* oznaczają w codziennym hiszpańskim „włosy”; w tym kursie używamy słowa *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo ma krótkie czarne włosy
    gloss: Mateo ma krótkie czarne włosy.
    note: Wraca słowo *negro* (czarny) z unii o ubraniach.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena ma długie blond włosy
    gloss: Elena ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Oczy
    gloss: oczy
    note: '*Los ojos* to liczba mnoga od *el ojo*; oba słowa są rodzaju męskiego.'
    example_gloss: Mateo ma brązowe oczy.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: '*Azul* (niebieski) i *verde* (zielony) mają jedną formę dla obu rodzajów; *marrón* (brązowy) to zwykłe słowo na kolor oczu, a włosy są *castaño*.'
    example_gloss:
    - Elena ma niebieskie oczy.
    - Diego ma brązowe oczy.
    - Lucía ma zielone oczy.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos wymaga przymiotnika w liczbie mnogiej
    gloss: 'Przy ojos (liczba mnoga) przymiotnik też jest w liczbie mnogiej: ojos azules, ojos marrones, ojos verdes.'
    note: 'Przymiotniki zgadzają się w liczbie: *ojos* to liczba mnoga, więc *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Jak wygląda Elena?
    gloss: Jak wygląda Elena?
    note: '*¿Cómo es ...?* to podstawowe pytanie tej lekcji; użyj go, by zapytać o wygląd każdej osoby.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena ma długie blond włosy i niebieskie oczy
    gloss: Elena ma długie blond włosy i niebieskie oczy.
    note: Wzorcowa odpowiedź łącząca włosy i oczy w jednym zdaniu za pomocą *y*.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena przedstawia Ninę
    gloss: 'Elena: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.'
    note: '*Viene* („przychodzi”) wprowadza kogoś nowego; *se llama* znaczy „nazywa się”.'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo pyta, jak ona wygląda
    gloss: 'Mateo: Świetnie! Jak wygląda?'
    note: 'Wraca podstawowe pytanie tej lekcji, tym razem bez imienia: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena opisuje wzrost i włosy Niny
    gloss: 'Elena: Jest niska i ma krótkie blond włosy.'
    note: Łączy *baja* z pierwszej lekcji ze słownictwem o włosach; *baja* jest rodzaju żeńskiego, bo Nina to dziewczyna.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo pyta o jej oczy
    gloss: 'Mateo: A oczy?'
    note: '*¿Y los ojos?* podejmuje temat z rodzajnikiem określonym, więc po hiszpańsku nie potrzeba tu *sus*; podobnie po polsku nie mówimy „a jej oczy”, gdy wiadomo, o kim mowa.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena opisuje oczy Niny
    gloss: 'Elena: Ma zielone oczy.'
    note: Wracają *los ojos verdes* z lekcji o oczach.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo rozpozna ją
    gloss: 'Mateo: Dzięki! W takim razie ją rozpoznam.'
    note: '*La reconoceré* („rozpoznam ją”) to forma czasu przyszłego; *la* znaczy „ją” i stoi przed czasownikiem.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Porównanie Diega i Lucíi
    gloss: Diego i Lucía są rodzeństwem, ale wyglądają zupełnie inaczej. Diego jest niski, ma krótkie brązowe włosy i brązowe oczy. Lucía jest wyższa od Diega, ma długie brązowe włosy i zielone oczy. A ty, jak wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      hermano: brat
      hermana: siostra
      eres: wyglądać
      diferentes: różnie
      bajo: niski
      corto: niski
      castaño: brązowy
      pelo: włosy
      marrones: brązowy
      ojos: oczy
      alta: wyższy
      largo: długi
      verdes: zielony
      cómo: (część wyrażenia „cómo es” = jaki jest)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Ponowne użycie wzoru porównania
    gloss: 'Znasz już wzór porównania: más + przymiotnik + que. Tutaj używasz go do osób: Lucía jest wyższa od Diega.'
    note: Wzorzec *más + adjective + que* z jednostki o porównaniach, tym razem użyty w odniesieniu do osób, a nie przedmiotów.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía ma dłuższe włosy niż Diego
    gloss: Lucía ma dłuższe włosy niż Diego.
    note: '*Más largo que* porównuje dwie rzeczy: *el pelo más largo que Diego*; *largo* pozostaje w rodzaju męskim, bo *pelo* jest rodzaju męskiego.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: Wzorcowe zdanie w pierwszej osobie z *tengo*, które możesz wykorzystać, opisując siebie.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo wypatruje Niny
    gloss: 'Mateo: Patrz, to Nina? Ma krótkie blond włosy i zielone oczy.'
    note: '*Mira* („patrz”) to forma rozkazująca nieformalna od *mirar*, użyta tu, by coś wskazać.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena potwierdza
    gloss: 'Elena: Tak, to Nina!'
    note: Krótkie, naturalne potwierdzenie.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina wita Mateo
    gloss: 'Nina: Cześć, jesteś Mateo?'
    note: 'Proste nieformalne pytanie na powitanie: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo wita Ninę
    gloss: 'Mateo: Tak! Miło cię poznać, Nina.'
    note: '*Encantado de conocerte* to standardowa fraza przy pierwszym spotkaniu; kobieta mówi *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: Zamyka dialog – Mateo rozpoznał Ninę dzięki wcześniejszemu opisowi Eleny.
