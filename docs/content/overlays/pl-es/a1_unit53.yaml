    gloss: Lucía kocha koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
