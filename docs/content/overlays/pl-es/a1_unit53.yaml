teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*Animal* to słowo ogólne, a *mascota* oznacza właśnie zwierzę domowe; *mascota* jest rodzaju żeńskiego, nawet gdy chodzi o samca.'
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Pies i kot
