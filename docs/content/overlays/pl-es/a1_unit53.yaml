    gloss: 'Mateo: Masz zwierzę domowe, Elena?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena ma psa
    gloss: 'Elena: Tak, mam psa.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo pyta, jak wygląda
    gloss: 'Mateo: Jaki jest?'
    note: Znasz już *¿Cómo es?* z wcześniejszej lekcji o wyglądzie; tu pytamy o zwierzę.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena opisuje swojego psa
    gloss: 'Elena: Ma brązową sierść i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él i lo w odniesieniu do zwierząt
    gloss: Él i lo mogą odnosić się także do zwierzęcia, nie tylko do osoby.
    note: Dotąd *él* w kursie odnosiło się zawsze do osoby; tu wyraźnie pokazujemy, że dotyczy też zwierząt, razem z *lo* („go”) jako zaimkiem dopełnienia.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo pyta o spacery
    gloss: 'Mateo: Wyprowadzasz go na spacer codziennie?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena opisuje swoją rutynę
    gloss: 'Elena: Tak, codziennie wyprowadzam go na spacer i karmię go.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía i Diego o zwierzętach
    gloss: 'Mateo i Lucía kochają zwierzęta, ale żadne z nich nie ma zwierzęcia domowego. Mateo kocha psy, a Lucía kocha koty. Diego ma zwierzę: kota. Często bawi się ze swoim kotem i codziennie go karmi. A ty masz zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      encantan: kochać
      dos: oboje
      animales: zwierzęta
      ninguno: oboje
      mascota: zwierzę domowe
      perros: psy
      gatos: koty
      gato: kot
      juega: bawi się
      da: daje
      todos: każdy
      comer: karma
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego często bawi się ze swoim kotem
    gloss: Diego często bawi się ze swoim kotem.
    note: Znasz już *a menudo* („często”) z wcześniejszych lekcji.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena pyta Ninę
    gloss: 'Elena: Nina, ty też masz zwierzę domowe?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: '*Se llama* („nazywa się”) to zwrot ze służący do podawania imienia, znany z pierwszej lekcji.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Reakcja Mateo
    gloss: 'Mateo: Jak miło! Co z nim robisz codziennie?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Mateo też kocha ptaki
    gloss: 'Mateo: Ja też kocham ptaki.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena kończy rozmowę
    gloss: 'Elena: Jak miło, że nasza trójka kocha zwierzęta!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
