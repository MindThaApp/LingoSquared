    - Diego ma kota.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nina ma ptaka.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: Ten sam wzór pytania *¿Tienes ...?* znasz już z wcześniejszych lekcji.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: W *No tengo mascota* po prostu stawiamy *no* przed czasownikiem; zobacz notatkę gramatyczną.
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: jak powiedzieć, że czegoś nie masz'
    gloss: 'Aby powiedzieć, że czegoś nie masz, postaw no przed tengo: No tengo tiempo, no tengo mascota.'
    note: Wzór *no tengo* znasz już z *No tengo tiempo*; nowy jest tylko rzeczownik.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: '*Sacar a pasear* to stały zwrot: *sacar* („wyprowadzać”) + *a pasear* („na spacer”).'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear i „a” osobowe
    gloss: 'Gdy dopełnieniem jest zwierzę lub osoba, przed nim stawiamy a: saco al perro a pasear.'
    note: Wraca wyrażenie *saco al perro* z poprzedniej karty; przyimek *a* przed osobą lub zwierzęciem, na którym nam zależy, pojawia się w hiszpańskim w funkcji dopełnienia.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Diego bawi się ze swoim kotem.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: '*Sacar a pasear* łączy się z *todos los días* („codziennie”), które znasz z wcześniejszej lekcji; *a* + *el* daje *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: '*Dar de comer* („dawać jeść”) znaczy „karmić”; *le* odnosi się do zwierzęcia: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Liczba mnoga kończy się na -s: perro → perros, gato → gatos. Po spółgłosce dodajemy -es: animal → animales.'
    note: Regularny wzór liczby mnogiej w hiszpańskim, wprowadzony tu po raz pierwszy na przykładzie nazw zwierząt.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Mateo kocha psy.
    - Lucía kocha koty.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: '*Me encantan* jest w liczbie mnogiej, bo *los animales* jest w liczbie mnogiej: czasownik zgadza się z tym, co kochasz.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
