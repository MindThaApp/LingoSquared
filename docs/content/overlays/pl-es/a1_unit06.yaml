teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Kanapka, sałatka
    gloss: kanapka, sałatka
    note: Oba rzeczowniki są zapożyczone lub przystosowane – *sándwich* to bezpośrednie zapożyczenie z angielskiego, z akcentem pisanym oznaczającym sylabę akcentowaną.
    example_gloss:
    - Chcę kanapkę.
    - W sałatce jest pomidor.
  es.a1.unit06.lesson01.teach.sopa:
    title: Zupa
    gloss: zupa
    note: '*Sopa* jest rodzaju żeńskiego, jak większość hiszpańskich rzeczowników zakończonych na -a.'
    example_gloss: Zupa jest bardzo dobra.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Woda, kawa
    gloss: woda, kawa
    note: '*Agua* jest rodzaju żeńskiego, ale w liczbie pojedynczej występuje z rodzajnikiem męskim *el* (nie *la*), bo zaczyna się akcentowaną samogłoską *a* – to prawdziwa hiszpańska nieregularność, nie literówka.'
    example_gloss:
    - Poproszę wodę.
    - Dla mnie kawa.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Chcę kanapkę
    gloss: Chcę kanapkę.
    note: '*Quiero* (chcę) to forma 1. osoby liczby pojedynczej czasownika *querer*, nowego w tej lekcji.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Dla mnie kawa
    gloss: Dla mnie kawa.
    note: '*Para mí* (dla mnie) to częsty alternatywny zwrot przy zamawianiu: nazywa danie bez powtarzania czasownika – zobacz następną notkę gramatyczną.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Pytanie, co ktoś chce zjeść
    gloss: Co chcesz zjeść?
    note: '*Quieres* to forma czasownika *querer* dla *tú*, używana wobec przyjaciół.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero czy Para mí
    gloss: Dwa równie naturalne sposoby zamawiania.
    note: '*Quiero un café* i *Para mí, un café* są równie dobre przy zamawianiu.'
    target_text: '*Quiero* („chcę”) i *Para mí* („dla mnie”, mówione przed nazwaniem dania) to naturalne i jednakowo grzeczne sposoby zamawiania w nieformalnej sytuacji – żaden nie jest bardziej poprawny od drugiego.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: Karta dań
    gloss: karta dań
    note: '*Menú* ma akcent pisany, ponieważ akcent pada na ostatnią sylabę.'
    example_gloss: Czy możemy zobaczyć menu?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Prośba o menu
    gloss: Czy możemy zobaczyć menu?
    note: '*Podemos* (możemy) to forma 1. osoby liczby mnogiej czasownika *poder*, nowego w tej lekcji.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Proszę bardzo
    gloss: Proszę bardzo.
    note: '*Aquí tiene* to standardowy zwrot kelnera, gdy podaje coś klientowi. Używa grzecznej formy *usted* nawet w nieformalnej rozmowie – to utarta formuła grzecznościowa, a nie zmiana rejestru.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Smacznego
    gloss: Smacznego
    note: '*Buen provecho* to zwykłe życzenie, które mówi się komuś przed rozpoczęciem jedzenia – podobnie jak polskie „smacznego”.'
    example_gloss: Proszę bardzo. Smacznego.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Deser
    gloss: deser
    note: '*Postre* jest rodzaju męskiego.'
    example_gloss: Na deser chcę ciasto.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Zamawianie deseru
    gloss: Na deser chcę ciasto.
    note: '*De postre* (na deser) wprowadza to, co ktoś zamawia jako ostatnie danie – tak samo jak *para mí* wprowadza główne zamówienie.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Prośba o rachunek
    gloss: Rachunek, proszę.
    note: '*La cuenta* (rachunek) to standardowy sposób, by poprosić o możliwość zapłaty na koniec posiłku.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Czytamy menu
    gloss: 'Menu: kanapka, pięć. Sałatka, osiem. Zupa, trzy. Kawa lub woda, wliczone. Deser: ciasto.'
    note: Realistyczny format drukowanego menu, w którym słownictwo z tej lekcji występuje razem z cenami.
    glosses:
      Menú: menu
      sándwich: bułka
      Ensalada: sałatka
      Sopa: zupa
      Café: kawa
      agua: woda
      incluido: wliczone w cenę
      Postre: deser
      pastel: ciasto
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (wliczone)
    gloss: Co znaczy, gdy napój jest oznaczony jako wliczony.
    note: '*Incluido* = wliczone w cenę, bez dopłaty.'
    target_text: '*Incluido* (wliczone) oznacza, że napój jest do posiłku gratis, bez dopłaty.'
  es.a1.unit06.lesson06.teach.line01:
    title: Powitanie i pytanie o zamówienie
    gloss: Kelner wita Elenę i Mateo i pyta, co chcą zjeść.
    note: '*Buenas tardes* (dzień dobry po południu) mówi się od południa, więc pasuje do pory lunchu.'
  es.a1.unit06.lesson06.teach.line02:
    title: Elena zamawia
    gloss: Elena prosi o sałatkę i wodę.
    note: '*Una ensalada y agua* = sałatka i woda.'
  es.a1.unit06.lesson06.teach.line03:
    title: Mateo zamawia
    gloss: Mateo zamawia dla siebie kanapkę i kawę.
    note: Używa *Para mí* zamiast powtarzać *Quiero*.
  es.a1.unit06.lesson06.teach.line04:
    title: Pytanie o deser
    gloss: Kelner przytakuje i pyta, czy chcą coś na deser.
    note: '*¿Algo de postre?* (coś na deser?) to naturalny, krótki sposób zaproponowania deseru.'
  es.a1.unit06.lesson06.teach.line05:
    title: Deser do podziału
    gloss: 'Elena się zgadza: jedno ciasto dla nich dwojga.'
    note: '*Para los dos* (dla nas dwojga) oznacza jeden deser na dwoje – całkiem naturalny wybór w prawdziwym życiu.'
  es.a1.unit06.lesson06.teach.line06:
    title: Zgoda i prośba o rachunek
    gloss: Mateo się zgadza i prosi o rachunek.
    note: '*La cuenta, por favor* = rachunek, proszę.'
  es.a1.unit06.lesson06.teach.line07:
    title: Podanie rachunku
    gloss: Kelner przynosi im rachunek.
    note: '*Aquí tiene* mówi się, gdy się coś komuś podaje.'
  es.a1.unit06.lesson06.teach.line08:
    title: Ciepłe zakończenie
    gloss: Elena dziękuje kelnerowi i mówi, że jedzenie było pyszne.
    note: '*¡Qué buena comida!* ma ten sam wzór wykrzyknienia *¡Qué ...!* co *¡Qué bien!* i *¡Qué bonito!*.'
