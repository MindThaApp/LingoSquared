teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: Ulica
    gloss: ulica
    note: '*Calle* jest rodzaju żeńskiego.'
    example_gloss: Mieszkam przy tej ulicy.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: Róg
    gloss: róg
    note: '*Esquina* jest rodzaju żeńskiego.'
    example_gloss: Bank jest na rogu.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Idź prosto
    gloss: Proszę iść prosto.
    note: '*Sigue* to forma rozkazująca (ty) czasownika *seguir* (iść dalej, kontynuować), używana w całej tej lekcji we wskazówkach.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Skręć w lewo
    gloss: Proszę skręcić w lewo.
    note: '*Dobla* to forma rozkazująca (ty) czasownika *doblar* (skręcać, zginać). Zobacz kolejną notatkę o *doblar* i *girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Skręć w prawo
    gloss: Proszę skręcić w prawo.
    note: '*Gira* to forma rozkazująca (ty) czasownika *girar* (skręcać, obracać), w pełni wymienna z *doblar*.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: Przejdź przez ulicę
    gloss: Przejdź przez ulicę.
    note: '*Cruza* to forma rozkazująca (ty) czasownika *cruzar* (przechodzić, przekraczać).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar i girar
    gloss: Dwa równie naturalne słowa na „skręcać”.
    note: Zobacz treść karty.
    target_text: '*Doblar* i *girar* znaczą „skręcać” i są tu w pełni wymienne – to kwestia preferencji regionalnej, a nie stylu czy znaczenia. W tej lekcji używamy obu.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Pytanie, jak gdzieś dojść
    gloss: Jak dojdę do biblioteki?
    note: '*Cómo llego a* (jak dojdę/dojadę do) to standardowy sposób pytania o drogę do konkretnego miejsca.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Powiedz, że to łatwe
    gloss: To proste.
    note: Częsta uspokajająca fraza, którą mówi się przed wskazaniem drogi.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Idź prosto tą ulicą
    gloss: Idź prosto tą ulicą.
    note: '*Por esta calle* (tą ulicą) precyzuje, którą ulicą iść.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: Skręć w lewo na rogu
    gloss: Skręć w lewo na rogu.
    note: '*En la esquina* (na rogu) mówi, gdzie należy skręcić.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Prośba o potwierdzenie
    gloss: Czy tak jest dobrze?
    note: '*¿Está bien así?* (czy tak jest dobrze?) sprawdza zrozumienie po powtórzeniu wskazówek – naturalny krok po usłyszeniu trasy.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Potwierdzenie
    gloss: Tak, zgadza się.
    note: '*Así es* (tak właśnie jest) to naturalne, krótkie potwierdzenie.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Nie zgub się
    gloss: Nie zgub się!
    note: '*No te pierdas* to forma zakazu (ty) czasownika *perderse* (gubić się) – ciepłe, swobodne pożegnanie.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Czytanie pisemnych wskazówek
    gloss: 'Aby dojść do biblioteki z targu: idź prosto tą ulicą. Skręć w lewo na rogu. Potem przejdź przez ulicę. Biblioteka jest po prawej.'
    note: 'Pisemne wskazówki podają kroki po kolei: *Para llegar a...* (aby dojść do...) nazywa cel, każdy krok to rozkaz w formie *tú* (*sigue*, *dobla*, *cruza*), a *después* (potem) łączy kroki.'
    glosses:
      llegar: dojść / dotrzeć
      biblioteca: biblioteka
      desde: od, z
      mercado: targ
      sigue: iść dalej (od seguir)
      derecho: prosto
      calle: ulica
      Dobla: skręć (od doblar)
      izquierda: lewy, w lewo
      esquina: róg
      Después: potem / później
      cruza: przejdź (od cruzar)
      está: znajduje się (od estar)
      derecha: prawy, w prawo
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (od, z)
    gloss: Jak desde wskazuje punkt początkowy trasy.
    note: Zobacz treść karty.
    target_text: '*Desde* (od, z) wskazuje punkt początkowy trasy, a *a* (do) – cel: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: Pytanie o drogę
    gloss: Mateo pyta Elenę, jak dojść z targu do biblioteki.
    note: 'To samo pytanie *¿Cómo llego a...?* co wcześniej w tej lekcji, tym razem z punktem początkowym: *desde el mercado* (z targu).'
  es.a1.unit09.lesson06.teach.line02:
    title: Pierwszy krok
    gloss: Elena mówi, że to proste, i podaje pierwszą wskazówkę.
    note: '*Es fácil* (to proste) uspokaja, zanim padnie pierwszy krok.'
  es.a1.unit09.lesson06.teach.line03:
    title: Powtórz i zapytaj, co dalej
    gloss: Mateo powtarza wskazówkę i pyta, co dalej.
    note: '*Sigo derecho* (idę prosto) to forma pierwszej osoby od *seguir*; Mateo na bieżąco potwierdza, że idzie za wskazówkami.'
  es.a1.unit09.lesson06.teach.line04:
    title: Podaj drugi krok
    gloss: Elena mówi mu, żeby na rogu skręcił w lewo.
    note: '*Dobla* (skręć) -- *gira* znaczyłoby tu to samo.'
  es.a1.unit09.lesson06.teach.line05:
    title: Powtórz i potwierdź
    gloss: Mateo powtarza skręt i pyta, czy dobrze zrozumiał.
    note: '*Doblo* (skręcam) odpowiada jego wcześniejszemu *Sigo derecho* -- Mateo powtarza każdy krok w formie *yo*, żeby się upewnić.'
  es.a1.unit09.lesson06.teach.line06:
    title: Potwierdź i podaj ostatnie kroki
    gloss: Elena potwierdza, a potem mówi, żeby przeszedł przez ulicę -- biblioteka będzie po prawej.
    note: '*Sí, así es* (tak, dokładnie) potwierdza, a *después* (potem) wprowadza ostatnie kroki trasy.'
  es.a1.unit09.lesson06.teach.line07:
    title: Podziękuj Elenie
    gloss: Mateo serdecznie dziękuje Elenie.
    note: '*Muchas gracias* (bardzo dziękuję) to cieplejsza wersja zwykłego *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Odpowiedz i pożegnaj
    gloss: Elena mówi „nie ma za co” i radzi, żeby się nie zgubił.
    note: '*De nada* (nie ma za co) to standardowa odpowiedź na *gracias*.'
