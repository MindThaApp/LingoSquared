teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: Dzwonić
    gloss: dzwonić
    note: Bezokolicznik czasownika oznaczającego telefonowanie.
    example_gloss: Muszę do ciebie zadzwonić.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Mówimy, że zadzwonimy
    gloss: Zadzwonię do ciebie.
    note: '*Llamo* to forma *yo* czasownika *llamar*; z *te* znaczy dosłownie „dzwonię do ciebie”. W tym znaczeniu hiszpański używa czasu teraźniejszego, tak jak często robi to też polski („zaraz dzwonię”), choć po polsku zwykle mówimy „zadzwonię”.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Odbieranie telefonu
    gloss: Cześć, tu Elena.
    note: Przez telefon hiszpański przedstawia rozmówcę za pomocą *soy* + imię (dosłownie „jestem”), a polski mówi „tu” + imię.
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo odpowiada w ten sam sposób
    gloss: Cześć, tu Mateo.
    note: Ten sam wzór *soy* + imię, co w *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Pytanie, kto dzwoni
    gloss: Z kim rozmawiam?
    note: '*¿Con quién hablo?* to standardowe pytanie, gdy nie wiesz, kto dzwoni.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Przedstawianie się oficjalnie
    gloss: Rozmawia Pan/Pani z Eleną.
    note: '*Habla con* + imię to grzecznościowa forma *usted* czasownika *hablar*: uprzejmy odpowiednik *soy* + imię.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Prośba o powtórzenie
    gloss: Możesz to powtórzyć?
    note: '*¿Puedes...?* (Możesz...?) + *repetir* (powtórzyć) + *eso* (to).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Prośba o wolniejsze mówienie
    gloss: Nie mów tak szybko, proszę.
    note: '*No hables* to przeczący tryb rozkazujący czasownika *hablar* (w formie nieformalnej); *tan rápido* (tak szybko) określa stopień.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Mówimy, że słabo słychać
    gloss: Słabo cię słyszę.
    note: '*Oír* (słyszeć) z *no ... bien* (niedobrze) oznacza problem ze słyszeniem i różni się od *entender* (rozumieć); *te oigo* znaczy „słyszę cię”.'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: SMS
    gloss: wiadomość, SMS
    note: 'Rzeczownik rodzaju męskiego: *el mensaje*. Hiszpanie mówią też *el SMS* lub *el texto*, ale *mensaje* jest wyborem neutralnym.'
    example_gloss: Wiadomość jest od Eleny.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Zapowiedź wysłania wiadomości
    gloss: Wyślę ci wiadomość.
    note: '*Enviar* (wysłać) stoi po zaimku *te* (ci): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Zapowiedź oddzwonienia
    gloss: Zadzwonię do ciebie później.
    note: '*Más tarde* (później) stoi na końcu zdania: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Przeczytaj wymianę wiadomości
    gloss: 'Mateo: Cześć, Elena, możesz do mnie zadzwonić? Muszę ci coś powiedzieć. Elena: Tak, jasne, oddzwonię za pięć minut.'
    note: Zwróć uwagę, o co prosi Mateo, dlaczego i kiedy Elena obiecuje oddzwonić.
    glosses:
      Hola: cześć
      puedes: możesz
      llamarme: zadzwonić
      Tengo: muszę
      algo: coś
      contarte: opowiedzieć, powiedzieć
      claro: jasne
      llamada: zadzwonić
      cinco: pięć
      minutos: minuty
      devuelvo: z powrotem
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo odbiera telefon
    gloss: 'Mateo: Halo, tu Mateo.'
    note: 'Ta sama konstrukcja *soy* + imię z pierwszej lekcji, tym razem w prawdziwej rozmowie telefonicznej: osoba, która odbiera, odzywa się pierwsza i podaje swoje imię.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena się przedstawia
    gloss: 'Elena: Cześć, Mateo, tu Elena. Mateo: Dzięki, że dzwonisz!'
    note: '*Gracias por llamar* (dzięki za telefon) to *gracias por* + bezokolicznik.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena pyta o zmianę w pracy
    gloss: 'Elena: Jak poszła ci pierwsza zmiana?'
    note: '*Ha ido* to czas present perfect od *ir* (tu „potoczyć się, pójść”): *ha* + imiesłów *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo ma dobre wieści
    gloss: 'Mateo: Poszła bardzo dobrze, lepiej, niż się spodziewałem.'
    note: '*Ha ido muy bien* powtarza present perfect z pytania; *mejor de lo esperado* (lepiej, niż oczekiwano) porównuje za pomocą *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado podane z bezokolicznikami
    gloss: ha ido → ir (iść), es → ser (być), esperado → esperar (oczekiwać)
    note: '*Ha ido*, *es* i *esperado* podano razem z bezokolicznikami: *ir*, *ser*, *esperar*. Na razie traktuj *ha ido muy bien* jako utrwalony zwrot; present perfect poćwiczysz dokładnie później.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena jest dumna
    gloss: 'Elena: Miło to słyszeć! Jestem z ciebie dumna.'
    note: '*Orgulloso/a de* (dumny z) to stałe połączenie z *de*; przymiotnik zgadza się z osobą mówiącą (*orgullosa*, bo mówi Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo jest wzruszony
    gloss: 'Mateo: Dziękuję bardzo, to wiele dla mnie znaczy.'
    note: '*Significa* to forma 3. osoby od *significar* (znaczyć); *para mí* (dla mnie) mówi, dla kogo to ważne.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Jego
    gloss: Jego pierwsza zmiana poszła bardzo dobrze.
    note: '*Su* oznacza tu „jego” (także „jej” albo „Pana/Pani” przy *usted*); z kontekstu wiadomo, o czyje chodzi.'
