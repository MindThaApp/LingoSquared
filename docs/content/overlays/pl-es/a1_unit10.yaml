teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Pogoda
    gloss: pogoda
    note: '*Tiempo* znaczy też „czas”. Znaczenie wynika z kontekstu.'
    example_gloss: Jaka jest dziś pogoda?
  es.a1.unit10.lesson01.teach.el_sol:
    title: Słońce
    gloss: słońce
    note: '*Sol* jest rodzaju męskiego.'
    example_gloss: Dziś jest bardzo słonecznie.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: Deszcz
    gloss: deszcz
    note: '*Lluvia* jest rodzaju żeńskiego.'
    example_gloss: Nie lubię deszczu.
  es.a1.unit10.lesson01.teach.el_viento:
    title: Wiatr
    gloss: wiatr
    note: '*Viento* jest rodzaju męskiego.'
    example_gloss: Dziś jest bardzo wietrznie.
  es.a1.unit10.lesson01.teach.la_nube:
    title: Chmura
    gloss: chmura
    note: '*Nube* jest rodzaju żeńskiego.'
    example_gloss: Nie ma ani jednej chmury.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Jest gorąco
    gloss: Jest gorąco.
    note: '*Hace calor* (dosłownie „robi upał”) to standardowe wyrażenie opisujące gorącą pogodę.'
    example_gloss: W lipcu jest bardzo gorąco.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Jest zimno
    gloss: Jest zimno.
    note: '*Hace frío* ma ten sam wzór co *hace calor*: *hace* + rzeczownik.'
    example_gloss: W grudniu jest zimno.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: Jest słonecznie
    gloss: Jest słonecznie.
    note: W *hace sol* występuje *el sol* (słońce) w tym samym wyrażeniu z hace.
  es.a1.unit10.lesson02.teach.llueve:
    title: Pada deszcz
    gloss: Pada deszcz.
    note: '*Llueve* to osobna forma czasownika (od *llover*, padać), a nie wzór z *hace*. Zobacz następną notatkę gramatyczną.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: Jest pochmurno
    gloss: Jest pochmurno.
    note: '*Está nublado* składa się z *estar* + przymiotnik. To trzeci, odrębny wzór opisu pogody.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: trzy wzory'
    gloss: Trzy różne wzory gramatyczne do opisu pogody.
    note: Zobacz tekst na samej karcie.
    target_text: Wyrażenia pogodowe z *hace* (hace calor, hace frío, hace sol) to stała konstrukcja, dosłownie „robi ciepło/zimno/słońce”. *Llueve* („pada deszcz”) to osobna forma czasownika, a *está nublado* („jest pochmurno”) używa *estar* + przymiotnik -- trzy różne wzorce na opisanie pogody.
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Pytanie o pogodę
    gloss: Jaka jest dziś pogoda?
    note: '*¿Qué tiempo hace hoy?* to standardowe pytanie o aktualną pogodę, ze słowem *el tiempo* (pogoda).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Opis upalnej, słonecznej pogody
    gloss: Jest bardzo gorąco i słonecznie.
    note: Łączy dwa wyrażenia z *hace* za pomocą *y* (i).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Opis upalnej, wietrznej pogody
    gloss: Jest gorąco, ale wieje wiatr.
    note: '*Pero* (ale) zestawia dwa fakty o pogodzie: upał i wiatr. Użyto *hay* + rzeczownik, jak w *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Rozmowa o zimie w Madrycie
    gloss: Zimą w Madrycie jest bardzo zimno.
    note: '*En invierno* (zimą) wprowadza nazwę pory roku. Poniżej jest zestawione z *en julio*.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Rozmowa o lipcowym upale
    gloss: W lipcu jest zbyt gorąco.
    note: '*Demasiado* (zbyt, za dużo) wzmacnia *calor* bardziej niż zwykłe *mucho* (dużo, bardzo).'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Wyjaśnienie, po co potrzebna woda
    gloss: Potrzebujemy wody, bo jest gorąco.
    note: '*Porque* (ponieważ) łączy potrzebę z przyczyną związaną z pogodą. To praktyczne zdanie na warsztaty.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Czytanie prognozy pogody
    gloss: Dziś, 22 lipca, jest bardzo gorąco i słonecznie. Nie ma ani jednej chmury. Trochę też wieje wiatr. To dobry dzień na warsztaty kulinarne, ale ważne, żeby zabrać wodę.
    note: Krótka prognoza na 22 lipca, dzień zajęć kulinarnych.
    glosses:
      Hoy: dziś
      veintidós: dwudziesty drugi
      julio: lipiec
      hace: jest (pogoda; od hacer)
      calor: upał, gorąco
      sol: słońce, słonecznie
      hay: jest, są (od haber)
      nube: chmura
      También: także
      poco: trochę
      viento: wiatr
      buen: dobry, dobrze
      día: dzień
      ir: iść, jechać
      taller: warsztaty, pracownia
      cocina: kuchnia, kulinarny
      importante: ważny
      llevar: zabierać, nosić
      agua: woda
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (trochę)
    gloss: Jak un poco de opisuje małą ilość.
    note: Zobacz tekst na samej karcie.
    target_text: '*Un poco de* („trochę”) łączy się z nazwami produktów, a tu opisuje niewielką ilość wiatru -- ten sam wzorzec z innym rzeczownikiem.'
  es.a1.unit10.lesson06.teach.line01:
    title: Komentarz o upale
    gloss: Elena zauważa, jak dziś jest gorąco.
    note: '*¡Qué calor hace hoy!* (dosłownie „jaki upał robi dziś”, czyli „ale dziś gorąco!”) to wykrzyknikowe użycie wyrażenia *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Zgoda i dodatkowy szczegół
    gloss: Mateo przytakuje i zauważa, że nie ma ani jednej chmury.
    note: Łączy *hace mucho calor y hace sol* z *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Propozycja zabrania wody
    gloss: Elena mówi, że potrzebują wody na drogę.
    note: '*El camino* (droga) oznacza ich spacer na warsztaty.'
  es.a1.unit10.lesson06.teach.line04:
    title: Zgoda i wskazanie sklepu
    gloss: Mateo się zgadza i wspomina o sklepie w pobliżu.
    note: '*Cerca de aquí* (blisko stąd) zawiera wyrażenie miejsca *cerca de* (blisko).'
  es.a1.unit10.lesson06.teach.line05:
    title: Zestawienie zimy i lata
    gloss: Elena zestawia mroźne zimy w Madrycie z dzisiejszym nadmiernym lipcowym upałem.
    note: 'Łączy dwa zdania o porach roku: *en invierno hace mucho frío* i *en julio hace demasiado calor*.'
  es.a1.unit10.lesson06.teach.line06:
    title: Wyrażanie preferencji
    gloss: Mateo mówi, że woli upał, bo w Londynie pada prawie codziennie.
    note: '*Prefiero* (wolę) to nowa forma czasownika w 1. osobie. *Casi todos los días* (prawie codziennie) to przydatne wyrażenie częstotliwości.'
  es.a1.unit10.lesson06.teach.line07:
    title: Zgoda i pospieszanie
    gloss: Elena się zgadza i mówi, że powinni iść, bo spóźnią się na zajęcia.
    note: '*Es verdad* znaczy „to prawda”; *o* (lub) sygnalizuje tu konsekwencję („bo inaczej”).'
  es.a1.unit10.lesson06.teach.line08:
    title: Zgoda i w drogę
    gloss: Mateo przyznaje jej rację i idą.
    note: '*Tienes razón* (masz rację) to częsta formuła zgody.'
