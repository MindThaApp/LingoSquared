answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Hiszpański A1
  description: 'Opisywanie podstawowej pogody. Dalszy ciąg historii Eleny i Mateo: poranek 22 lipca, dzień warsztatów. Idą razem na zajęcia i rozmawiają o upale.'
