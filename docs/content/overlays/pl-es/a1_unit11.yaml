teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: Koszula
    gloss: koszula
    note: '*Camisa* jest rodzaju żeńskiego.'
    example_gloss: Podoba mi się ta koszula.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: Spodnie
    gloss: spodnie
    note: '*Pantalón* w hiszpańskim jest w liczbie pojedynczej, choć po polsku „spodnie” występuje tylko w liczbie mnogiej.'
    example_gloss: Spodnie kosztują dwadzieścia.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: Kurtka
    gloss: kurtka
    note: '*Chaqueta* jest rodzaju żeńskiego.'
    example_gloss: Potrzebuję kurtki na zimę.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: Buty
    gloss: buty
    note: '*Zapatos* jest w liczbie mnogiej, tak samo jak polskie „buty”.'
    example_gloss: Te buty są wygodne.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: Fartuch
    gloss: fartuch
    note: '*Delantal* jest rodzaju męskiego – to przedmiot, którego Elena i Mateo potrzebują na warsztaty.'
    example_gloss: Potrzebujemy fartucha na warsztaty.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Pytanie o rozmiar
    gloss: Jaki nosisz rozmiar?
    note: '*¿Qué talla usas?* to standardowy sposób zapytania o czyjś rozmiar ubrania.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Podanie rozmiaru
    gloss: Noszę rozmiar M.
    note: '*Uso* (noszę, używam) + *la talla* (rozmiar) + samo określenie rozmiaru.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Powiedz, że dobrze leży
    gloss: Dobrze na mnie leży.
    note: '*Me queda bien* zawiera czasownik *quedar* (leżeć, pasować) – zobacz następną notatkę gramatyczną.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Powiedz, że źle leży
    gloss: Źle na mnie leży.
    note: Przeciwieństwo *me queda bien* – wystarczy zamienić *bien* na *mal*.
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Jak quedar opisuje dopasowanie, a nie ogólną jakość.
    note: Zobacz tekst na samej karcie.
    target_text: '*Me queda bien* (dobrze na mnie leży) używa czasownika *quedar* (leżeć, pasować), innego niż *ser* czy *estar* – dosłownie „zostaje/pozostaje dobrze na mnie”. *Bien* i *mal* opisują tu dopasowanie, a nie jakość.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Pytanie o cenę fartucha
    gloss: Ile kosztuje ten fartuch?
    note: Wzór *¿Cuánto cuesta?* z konkretnym przedmiotem wskazanym za pomocą *este* (ten).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: Podanie ceny
    gloss: Kosztuje dwanaście.
    note: '*Cuesta* + liczba podaje cenę.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este czy esta
    gloss: Jak zaimek wskazujący zgadza się z rodzajem rzeczownika.
    note: Zobacz tekst na samej karcie.
    target_text: '*Este* (ten, rodzaj męski) zgadza się z *el delantal*; *esta* (ta, rodzaj żeński) pasuje do *esta camisa* – zaimek wskazujący zmienia się wraz z rodzajem rzeczownika, tak jak inne przymiotniki.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Powiedz, że podoba ci się ten
    gloss: Podoba mi się ten.
    note: '*Este* występuje tu samodzielnie jako zaimek („ten”) i odnosi się do przedmiotu, o którym przed chwilą mowa.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Powiedz, że to kupisz
    gloss: Kupię to.
    note: '*Voy a* + bezokolicznik to konstrukcja bliskiej przyszłości; *comprarlo* łączy zaimek dopełnienia *lo* (to) z bezokolicznikiem *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Powiedz, że kupujecie dwa
    gloss: Kupujemy dwa.
    note: '*Compramos* (kupujemy) to forma *nosotros*, użyta, gdy Elena i Mateo decydują razem.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Czytanie cennika
    gloss: 'W tym sklepie koszula kosztuje piętnaście, spodnie kosztują dwadzieścia, kurtka kosztuje trzydzieści, a buty kosztują dwadzieścia pięć. Fartuch jest najtańszy: kosztuje tylko dwanaście.'
    note: 'Cennik sklepowy: *cuesta* (kosztuje) dla jednego przedmiotu, *cuestan* (kosztują) dla liczby mnogiej, np. *los zapatos*.'
    glosses:
      tienda: sklep
      camisa: koszula
      cuesta: kosztuje (od costar)
      quince: piętnaście
      pantalón: spodnie
      veinte: dwadzieścia
      chaqueta: kurtka
      treinta: trzydzieści
      zapatos: buty
      cuestan: kosztują (od costar)
      veinticinco: dwadzieścia pięć
      delantal: fartuch
      barato: tani
      solo: tylko
      doce: dwanaście
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (najtańszy)
    gloss: Jak el/la + más + przymiotnik tworzy stopień najwyższy.
    note: Zobacz tekst na samej karcie.
    target_text: '*El más barato* (najtańszy) to stopień najwyższy – *el/la* + *más* + przymiotnik, a *de/en* wskazuje grupę, z którą porównujemy. Ta jednostka nie uczy jeszcze pełnego schematu porównań, tylko tej jednej częstej frazy zakupowej.'
  es.a1.unit11.lesson06.teach.line01:
    title: Wyrażenie potrzeby
    gloss: Elena mówi, że potrzebują fartuchów na warsztaty.
    note: '*Delantales* to liczba mnoga od *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Zgoda i propozycja sklepu
    gloss: Mateo się zgadza i proponuje pójść do tamtego sklepu.
    note: '*Tienes razón* znaczy „masz rację”, a *esa tienda* – „tamten sklep”.'
  es.a1.unit11.lesson06.teach.line03:
    title: Sprzedawca wita klientów
    gloss: Sprzedawca wita ich i proponuje pomoc.
    note: '*¿Los ayudo?* (czy w czymś państwu pomóc?) to typowe powitanie sprzedawcy, skierowane do Eleny i Mateo jednocześnie.'
  es.a1.unit11.lesson06.teach.line04:
    title: Powiedzenie, czego szukają
    gloss: Elena odpowiada, że tak, szukają fartuchów.
    note: '*Buscamos* (szukamy) to forma *nosotros* czasownika *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: Sprzedawca pokazuje fartuchy i pyta o rozmiar
    gloss: Sprzedawca pokazuje kilka fartuchów i pyta o ich rozmiar.
    note: '*¿Qué talla usan?* używa liczby mnogiej *usan* (państwo noszą), bo pytanie dotyczy obojga, w przeciwieństwie do liczby pojedynczej *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Podanie rozmiaru
    gloss: Mateo mówi, że nosi rozmiar M.
    note: '*Uso la talla mediana* to odpowiedź na *¿Qué talla usan?* w odniesieniu do niego samego.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena się zgadza
    gloss: Elena mówi, że ona nosi ten sam rozmiar.
    note: '*Yo también* znaczy „ja też”.'
  es.a1.unit11.lesson06.teach.line07:
    title: Pytanie o cenę
    gloss: Mateo pyta, ile kosztuje fartuch.
    note: '*Este* (ten) wskazuje fartuch, który ma przed sobą.'
  es.a1.unit11.lesson06.teach.line07b:
    title: Podanie ceny
    gloss: Sprzedawca mówi, że kosztuje dwanaście.
    note: '*Cuesta* + liczba podaje cenę.'
  es.a1.unit11.lesson06.teach.line08:
    title: Potwierdzenie dopasowania i decyzja o zakupie
    gloss: Elena mówi, że dobrze leży, że jej się podoba i że go kupi.
    note: Łączy po kolei *me queda bien*, *me gusta este* i *voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: Zgoda i zakup dwóch
    gloss: Mateo mówi, że jemu też dobrze leży, i kupują dwa.
    note: '*A mí también* (ja też, z naciskiem) powtarza schemat zgody z *también* z dodatkowym zaimkiem podkreślającym; *compramos dos* kończy scenę.'
