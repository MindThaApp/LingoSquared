  es.a1.unit51.lesson02.a_que_hora_sale:
    title: O której odjeżdża pociąg?
  es.a1.unit51.lesson03.retraso:
    title: Opóźnienie
  es.a1.unit51.lesson04.orientarse_en_la_estacion:
    title: Jak trafić na dworcu
  es.a1.unit51.lesson05.leer_un_billete_de:
    title: Czytamy bilet kolejowy
  es.a1.unit51.lesson06.elena_y_mateo_de:
    title: Elena i Mateo w podróży
teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Bilet wstępu
    gloss: bilet wstępu
    note: '*El billete* jest rodzaju męskiego, dlatego mówimy *un billete*, a nie *una*.'
    example_gloss: Poproszę bilet do Toledo.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Prośba o bilet
    gloss: Poproszę bilet do Toledo.
    note: '*Quisiera* („chciał(a)bym”) łagodzi prośbę i jest grzeczniejsze niż *quiero* („chcę”).'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: Kasjer pyta o rodzaj biletu
    gloss: Chce Pan/Pani bilet w jedną stronę czy powrotny?
    note: '*Quiere* to grzeczna forma *usted* czasownika *querer*, użyta tu wobec obcego pracownika dworca.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Grzeczna odpowiedź
    gloss: Powrotny, proszę.
    note: '*Por favor* znaczy „proszę”; prośba pozostaje grzeczna i krótka.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Forma grzecznościowa przy kasie
    gloss: Przy kasie zwykle używa się formy grzecznościowej usted.
    note: Do obcych osób wykonujących usługi zwracamy się per *usted*, a nie *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Peron
    gloss: peron
    note: '*El andén* jest rodzaju męskiego: *un andén*, *el andén*.'
    example_gloss: Z którego peronu odjeżdża pociąg do Toledo?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Pytanie o peron
    gloss: Z którego peronu odjeżdża pociąg do Toledo?
    note: '*¿De qué andén ...?* pyta konkretnie o peron, a nie o ogólne miejsce.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Podawanie szczegółów odjazdu
    gloss: Pociąg odjeżdża za kwadrans dziesiąta z peronu piątego.
    note: '*Las diez menos cuarto* wykorzystuje schemat „minus kwadrans” z lekcji o godzinach.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Pytanie o godzinę przyjazdu
    gloss: O której godzinie przyjeżdża pociąg?
    note: '*¿A qué hora llega ...?* pyta o godzinę przyjazdu; *llegar* jest regularne, a przed godziną stoi *a las*.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Podawanie godziny przyjazdu
    gloss: Pociąg przyjeżdża o jedenastej.
    note: '*Llega a las once* zawiera czasownik *llegar* („przyjeżdżać”) i *a las* przed godziną.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: Punktualnie / opóźnienie
    gloss: na czas, punktualnie; opóźnienie
    note: '*A tiempo* to stałe wyrażenie oznaczające, że coś dzieje się zgodnie z planem. *El retraso* („opóźnienie”) jest rodzaju męskiego.'
    example_gloss:
    - Pociąg nie odjeżdża punktualnie.
    - 'Uwaga: pociąg do Toledo ma opóźnienie.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Komunikat
    gloss: 'Uwaga: pociąg do Toledo ma opóźnienie.'
    note: '*Atención* rozpoczyna komunikat na dworcu, podobnie jak polskie „Uwaga, uwaga”.'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: 'Zaprzeczenie: nie na czas'
    gloss: Pociąg nie odjeżdża punktualnie.
    note: '*No* stoi tuż przed czasownikiem i neguje całe zdanie: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: Zmiana peronu
    gloss: Pociąg odjeżdża z peronu trzeciego zamiast z piątego.
    note: '*En lugar de* znaczy „zamiast”.'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Podawanie długości opóźnienia
    gloss: Pociąg ma dziesięć minut opóźnienia.
    note: '*Lleva retraso* (dosłownie „niesie opóźnienie”) to naturalny sposób, by powiedzieć, że coś ma opóźnienie.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Wejście, wyjście, poczekalnia
    gloss: wejście; wyjście; poczekalnia
    note: '*La entrada*, *la salida* i *la sala de espera* to rzeczowniki rodzaju żeńskiego.'
    example_gloss:
    - Gdzie jest wejście?
    - Gdzie jest wyjście?
    - Gdzie jest poczekalnia?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Pytanie, gdzie jest peron
    gloss: Gdzie jest peron siódmy?
    note: Ten zwrot powtarza schemat *¿Dónde está ...?* z lekcji o wskazywaniu drogi.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Wskazywanie drogi
    gloss: Prosto, a potem w prawo.
    note: '*Todo recto* i *a la derecha* to zwroty z lekcji o wskazywaniu drogi, tu użyte na dworcu.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Pytanie o poczekalnię
    gloss: Gdzie jest poczekalnia?
    note: Ten sam schemat pytania zastosowany do nowego miejsca.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Czytamy wydrukowany bilet
    gloss: 'Bilet: Madrid Atocha – Toledo. Odjazd: 10:10, peron siódmy. Przyjazd: za dziesięć jedenasta. Powrotny. Cena: dwanaście euro czterdzieści.'
    note: Zwróć uwagę na godzinę odjazdu i peron, godzinę przyjazdu, rodzaj biletu i cenę.
    glosses:
      Billete: bilet
      Salida: odjazd
      diez: dziesięć
      andén: peron
      siete: siedem
      Llegada: przyjazd
      once: jedenaście
      vuelta: bilet powrotny
      Precio: cena
      doce: dwanaście
      euros: euro
      cuarenta: czterdzieści
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo przedstawia plan
    gloss: 'Mateo: Musimy iść na peron siódmy. Pociąg odjeżdża o dziesiątej dziesięć.'
    note: '*Tenemos que* + bezokolicznik („musimy”) wyraża praktyczną konieczność.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena czyta tablicę
    gloss: 'Elena: Patrz, tam jest tablica: opóźnienie, dziesięć minut.'
    note: '*Ahí está* („tam jest”) wskazuje tablicę; *el panel* to tablica informacyjna.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo zachowuje spokój
    gloss: 'Mateo: Nie ma problemu, mamy jeszcze czas na kawę.'
    note: '*No hay problema* to częste, potoczne uspokojenie.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: Pociąg przyjeżdża
    gloss: 'Elena: Dobry pomysł. O, pociąg już jest! Peron siódmy, dokładnie!'
    note: '*Ya* („już”) pokazuje, że pociąg przyjechał szybciej, niż się spodziewano, zważywszy na właśnie ogłoszone opóźnienie.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Wsiadają do pociągu
    gloss: 'Mateo: Chodźcie, wszyscy wsiadają! Toledo, jedziemy!'
    note: '*Suben* („wsiadają”) pochodzi od czasownika *subir*, czyli wsiadać do pociągu; *¡Allá vamos!* to naturalny sposób, by powiedzieć „jedziemy!”, „ruszamy!”.'
