teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: Zero
    gloss: zero
    note: '*Cero* oznacza liczbę zero, a także cyfrę 0 przy głośnym odczytywaniu ciągu cyfr.'
  es.a1.unit02.lesson01.teach.uno:
    title: Jeden
    gloss: jeden
    note: '*Uno* skraca się do *un* przed rzeczownikiem rodzaju męskiego w liczbie pojedynczej (*un huevo*, jedno jajko), a przed rzeczownikiem rodzaju żeńskiego przyjmuje postać *una* (*una taza*, jedna szklanka). Samo, np. przy liczeniu, pozostaje *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Dwa
    gloss: dwa
    note: '*Dos* nie zmienia formy, niezależnie od rodzaju rzeczownika.'
  es.a1.unit02.lesson01.teach.tres:
    title: Trzy
    gloss: trzy
    note: '*Tres*, podobnie jak *dos*, jest niezmienne.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Cztery
    gloss: cztery
    note: '*Cuatro* jest niezmienne.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Pięć
    gloss: pięć
    note: '*Cinco* jest niezmienne.'
  es.a1.unit02.lesson01.teach.seis:
    title: Sześć
    gloss: sześć
    note: '*Seis* jest niezmienne.'
  es.a1.unit02.lesson01.teach.siete:
    title: Siedem
    gloss: siedem
    note: '*Siete* jest niezmienne.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Osiem
    gloss: osiem
    note: '*Ocho* jest niezmienne.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Dziewięć
    gloss: dziewięć
    note: '*Nueve* jest niezmienne.'
  es.a1.unit02.lesson01.teach.diez:
    title: Dziesięć
    gloss: dziesięć
    note: '*Diez* jest niezmienne.'
  es.a1.unit02.lesson02.teach.once:
    title: Jedenaście
    gloss: jedenaście
    note: '*Once* do *quince* (11–15) to pojedyncze słowa, których uczysz się jako zestawu; liczby od szesnastu do dziewiętnastu są zbudowane z *diez* (*dieciséis*, *diecisiete*...).'
  es.a1.unit02.lesson02.teach.doce:
    title: Dwanaście
    gloss: dwanaście
    note: '*Doce* to jedno słowo; przypomina *dos*, ale ma własną pisownię.'
  es.a1.unit02.lesson02.teach.trece:
    title: Trzynaście
    gloss: trzynaście
    note: '*Trece* to jedno słowo; przypomina *tres*, ale ma własną pisownię.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Czternaście
    gloss: czternaście
    note: '*Catorce* to jedno słowo; przypomina *cuatro*, ale ma własną pisownię.'
  es.a1.unit02.lesson02.teach.quince:
    title: Piętnaście
    gloss: piętnaście
    note: '*Quince* to ostatnia ze zrośniętych liczb od jedenastu wzwyż, zanim od szesnastu zmienia się schemat.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Dwadzieścia
    gloss: dwadzieścia
    note: '*Veinte* to osobne słowo. Od *veintiuno* (21) do dwudziestu dziewięciu dziesiątki i jedności zlewają się w jedno słowo; ten schemat wróci w lekcji 3 przy *veintiocho*.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Trzydzieści
    gloss: trzydzieści
    note: Od trzydziestu wzwyż dziesiątki i jedności łączy *y* („i”), a całość zapisuje się jako trzy osobne słowa, inaczej niż w przypadku liczb od 21 do 29.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Trzydzieści cztery
    gloss: trzydzieści cztery
    note: '*Treinta y cuatro* zapisuje się jako trzy osobne słowa: dziesiątki, *y* i jedności.'
  es.a1.unit02.lesson02.teach.cien:
    title: Sto
    gloss: sto
    note: '*Cien* to forma oznaczająca równo 100; gdy liczba ma ciąg dalszy, pojawia się *ciento* (*ciento uno*, 101), czego ta lekcja jeszcze nie omawia.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Pytanie o wiek (nieformalnie)
    gloss: Ile masz lat?
    note: Po hiszpańsku dosłownie pyta się, ile lat masz, używając czasownika *tener* („mieć”), a nie *ser* czy *estar*. To podobne do polskiego „ile masz lat?”.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Podawanie wieku
    gloss: Mam dwadzieścia osiem lat.
    note: '*Tengo* to forma yo czasownika *tener*. Pełna odpowiedź zwykle zawiera *años* („lata”); gdy temat wieku jest już znany, można to pominąć, jak w *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Pytanie o wiek (formalnie)
    gloss: Ile Pan/Pani ma lat?
    note: '*Tiene* to forma *usted* czasownika *tener*, zgodna z formalnym stylem wprowadzonym w lekcji 1.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Podawanie wieku z liczbą złożoną
    gloss: Mam trzydzieści jeden lat.
    note: W *treinta y uno* zostaje *uno* (nie *un*), bo w tej odpowiedzi żaden rzeczownik nie występuje bezpośrednio po liczbie.
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: Zwrot pytania o wiek
    gloss: A ty, ile masz lat?
    note: '*Tienes* bez powtarzania *años* to naturalne, częste skrócenie, gdy temat rozmowy jest już jasny.'
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Zapytaj o numer telefonu
    gloss: Jaki jest twój numer telefonu?
    note: Gdy prosimy o podanie jednej konkretnej rzeczy ze zbioru możliwości, np. numeru telefonu, naturalne jest *cuál*, a nie *qué*.
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Numer odczytany cyfra po cyfrze
    gloss: Sześć, jeden, pięć, zero, dwa, dziewięć, siedem, trzy
    note: Numer telefonu można odczytać cyfra po cyfrze, tak jak tutaj. Wielu Hiszpanów łączy też cyfry w pary, więc osłuchaj się z oboma sposobami, podobnie jak w polskim, gdzie numer też czyta się na różne sposoby.
  es.a1.unit02.lesson04.teach.es_el:
    title: Wprowadź numer
    gloss: To jest...
    note: Używamy *el* (rodzaj męski, „ten”), ponieważ *número* jest rzeczownikiem rodzaju męskiego.
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Poproś o powtórzenie
    gloss: Możesz powtórzyć, proszę?
    note: '*Puedes* to forma *tú* czasownika *poder* (móc), przydatna, gdy numer wypowiedziany jest zbyt szybko, by go zapamiętać.'
  es.a1.unit02.lesson04.teach.claro:
    title: Zgódź się chętnie
    gloss: Jasne; oczywiście
    note: '*Claro* to częsty, przyjazny sposób zgody na prośbę.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Podaj potrzebną ilość
    gloss: Potrzebuję trzech jajek.
    note: '*Necesito* to forma yo czasownika *necesitar* (potrzebować). *Huevos* (jajka) pozostaje w liczbie mnogiej po każdej liczbie większej niż jeden.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Zapytaj, ile czegoś trzeba
    gloss: Ile jajek potrzebujesz?
    note: '*Cuántos* zgadza się w rodzaju i liczbie z rzeczownikiem, o który pytamy; *huevos* to rodzaj męski, liczba mnoga, więc używamy *cuántos* (nie *cuántas*).'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Podaj odmierzoną ilość
    gloss: Dwie szklanki mąki
    note: '*De* łączy miarę (*tazas*, szklanki) z tym, co odmierzamy (*harina*, mąka). W polskim ta relacja wyraża się dopełniaczem („szklanki mąki”), a w hiszpańskim przyimkiem de.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Podaj połowę ilości
    gloss: Pół szklanki cukru
    note: '*Media* zgadza się z rzeczownikiem rodzaju żeńskiego *taza*; forma męska *medio* występuje z rzeczownikami rodzaju męskiego.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Powiedz, co masz
    gloss: Mam cztery jajka na stole.
    note: '*Tengo* (mam) mówi o tym, co już jest dostępne, w odróżnieniu od *necesito* (potrzebuję), które mówi o tym, czego jeszcze brakuje.'
  es.a1.unit02.lesson06.teach.line01:
    title: Zapytaj o liczbę jajek
    gloss: Elena pyta Mateo, ile jajek potrzebuje do przepisu.
    note: Dalej używamy formy *tú*, jak w jednostce 1, bo rozmawiają ze sobą rówieśnicy.
  es.a1.unit02.lesson06.teach.line02:
    title: Wymień składniki
    gloss: Mateo mówi, że potrzebuje trzech jajek i dwóch szklanek mąki.
    note: '*Necesito* wskazuje, czego jeszcze brakuje do przepisu.'
  es.a1.unit02.lesson06.teach.line03:
    title: Powiedz, co masz
    gloss: Elena mówi, że ma cztery jajka na stole, i pyta, czy on potrzebuje też cukru.
    note: '*Tengo* wskazuje, co Elena już ma, niezależnie od tego, czego potrzebuje Mateo.'
  es.a1.unit02.lesson06.teach.line04:
    title: Potwierdź małą ilość
    gloss: Mateo mówi, że tak, trochę – około pół szklanki.
    note: '*Como* oznacza tu „około” lub „mniej więcej”, a nie częstsze „jak”.'
  es.a1.unit02.lesson06.teach.line05:
    title: Zapytaj o numer telefonu
    gloss: Elena mówi, że świetnie, i prosi Mateo o numer telefonu, żeby napisać do niego w sprawie następnych zajęć.
    note: '*Así te escribo* („żebym mogła do ciebie napisać”) wyjaśnia, po co pyta – to naturalny nawyk przed prośbą o dane kontaktowe.'
  es.a1.unit02.lesson06.teach.line06:
    title: Podaj numer telefonu
    gloss: Mateo odczytuje swój numer cyfra po cyfrze.
    note: '*Es el* wprowadza numer i zgadza się z rzeczownikiem rodzaju męskiego *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Podziękuj i zapytaj o wiek
    gloss: 'Elena dziękuje i zadaje jeszcze jedno pytanie: ile on ma lat.'
    note: '*Una pregunta más* („jeszcze jedno pytanie”) naturalnie sygnalizuje zmianę tematu w tej samej rozmowie.'
  es.a1.unit02.lesson06.teach.line08:
    title: Podaj jego wiek
    gloss: Mateo mówi, że ma dwadzieścia osiem lat, i zadaje Elenie to samo pytanie.
    note: '*Tengo veintiocho años* zawiera zrośniętą formę liczebnika z dwudziestkami, zgodnie ze wzorcem z lekcji 2.'
  es.a1.unit02.lesson06.teach.line09:
    title: Podaj jej wiek
    gloss: Elena mówi, że ma trzydzieści jeden lat.
    note: W *Tengo treinta y uno* pomijamy *años*, bo z kontekstu wiadomo, że chodzi o wiek – to naturalne skrócenie, zgodne ze wzorcem z lekcji 3, gdzie pytanie wraca bez powtarzania *años*.
