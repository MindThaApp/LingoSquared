course:
  title: Hiszpański A1
  description: Liczby 0–100, wiek, numery telefonów i ilości w przepisach; ciąg dalszy historii Eleny i Mateo na warsztatach kulinarnych z lekcji 1. Szczególną uwagę zwracamy na wyrażanie wieku czasownikiem tener oraz na zgodność rodzaju w określeniach ilości.
