answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Hiszpański A1
  description: Poznaj neutralne, ogólnohiszpańskie powitania, sposoby przedstawiania się i praktyczne rozmowy towarzyskie na pierwsze spotkanie. Wskazówki zwracają uwagę na rejestr w hiszpańskim, zgodność rodzaju i liczby, pomijanie podmiotu oraz formy czasowników.
units:
  es.a1.unit01.greetings:
    title: Powitania i pierwsze spotkania
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: Wybór między tú a usted
  es.a1.unit01.lesson02.greetings_by_time:
    title: Powitania i pożegnania w ciągu dnia
  es.a1.unit01.lesson03.names_and_introductions:
    title: Imiona i przedstawianie się
  es.a1.unit01.lesson04.origin_and_language:
    title: Pochodzenie, miejsce zamieszkania i język
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: Rozmowa towarzyska podczas wspólnego zajęcia
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: Pierwsze spotkanie na warsztatach kulinarnych
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Grzeczne „Pan/Pani”
    gloss: Pan/Pani; ty (formalnie)
    note: Po polsku o formalności świadczy zwrot „Pan/Pani”, a w hiszpańskim służy do tego zaimek usted. Używa się go wobec nieznajomej osoby dorosłej lub tam, gdzie wypada okazać szacunek. Choć odpowiada polskiemu „Pan/Pani”, łączy się z tą samą formą czasownika co él i ella (jak w trzeciej osobie).
  es.a1.unit01.lesson01.teach.tu:
    title: Nieformalne „ty”
    gloss: ty (nieformalnie, liczba pojedyncza)
    note: Tú mówisz do przyjaciela, rówieśnika, dziecka lub innej osoby, gdy relacja jest nieformalna. Akcent odróżnia zaimek tú („ty”) od dzierżawczego tu, czyli „twój”.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Formalne pytanie o samopoczucie
    gloss: Jak się Pan/Pani miewa?
    note: Está to forma czasownika estar dla usted. Do pytania o czyjś aktualny stan hiszpański używa estar. Cómo ma akcent, bo jest wyrazem pytającym.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Nieformalne pytanie o samopoczucie
    gloss: Jak się masz?
    note: Estás to forma czasownika estar dla tú. Tak jak w polskim „jak się Pan miewa” i „jak się masz” czasownik zmienia formę, tak w hiszpańskim está zmienia się w estás, zależnie od tego, do kogo mówisz.
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Krótka odpowiedź
    gloss: Dobrze, dziękuję.
    note: Po hiszpańsku można odpowiedzieć samym bien, bez powtarzania podmiotu i czasownika, podobnie jak po polsku mówimy po prostu „dobrze”.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Pozytywna odpowiedź
    gloss: Bardzo dobrze, dziękuję.
    note: Muy wzmacnia bien i nie zmienia formy.
  es.a1.unit01.lesson01.teach.and_usted:
    title: Zwrot pytania w formie formalnej
    gloss: A Pan/Pani?
    note: Zachowaj usted, gdy oddajesz pytanie w grzecznej formie.
  es.a1.unit01.lesson01.teach.and_tu:
    title: Zwrot pytania w formie nieformalnej
    gloss: A ty?
    note: Używaj tú, gdy rozmowa jest nieformalna. Akcent ma znaczenie, bo tu bez akcentu znaczy „twój”.
  es.a1.unit01.lesson02.teach.hola:
    title: Uniwersalne powitanie
    gloss: cześć; dzień dobry
    note: Hola pasuje o każdej porze dnia, zarówno w sytuacjach formalnych, jak i nieformalnych.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Powitanie rano
    gloss: dzień dobry (rano)
    note: Rzeczowniki hiszpańskie mają rodzaj gramatyczny, podobnie jak polskie. Días jest rodzaju męskiego w liczbie mnogiej, dlatego przymiotnik ma formę buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Powitanie po południu
    gloss: dzień dobry (po południu)
    note: Tardes jest rodzaju żeńskiego w liczbie mnogiej, więc pasuje do niego buenas. Zmiana buenos na buenas to zgodność gramatyczna, a nie zmiana stopnia uprzejmości.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Powitanie wieczorem lub w nocy
    gloss: dobry wieczór; dobranoc
    note: Noches jest rodzaju żeńskiego w liczbie mnogiej, dlatego towarzyszy mu buenas. Tym zwrotem możesz powitać kogoś wieczorem lub pożegnać się przed snem.
  es.a1.unit01.lesson02.teach.adios:
    title: Bezpośrednie pożegnanie
    gloss: do widzenia
    note: Adiós jest neutralne, ale może brzmieć bardziej ostatecznie niż pożegnania w stylu „do zobaczenia”.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: Do zobaczenia później
    gloss: do zobaczenia później
    note: Hasta luego to utarte pożegnanie i nie należy go tłumaczyć słowo w słowo.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Przyjazne pożegnanie
    gloss: do zobaczenia
    note: Dosłownie nos vemos jest bliższe znaczeniu „widzimy się”.
  es.a1.unit01.lesson02.teach.good_day:
    title: Grzeczne życzenie na pożegnanie
    gloss: Miłego dnia.
    note: Tenga to forma usted użyta w tym grzecznym życzeniu. Buen to skrócona forma rodzaju męskiego liczby pojedynczej od bueno przed słowem día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Pytanie o imię w formie formalnej
    gloss: Jak Pan/Pani ma na imię?
    note: Hiszpański wyraża to mniej więcej jako „jak się Pan/Pani nazywa”. Se łączy się z formalną formą llama, właściwą dla usted. Podobnie jak w polskim „Pan/Pani” wymaga innej formy czasownika niż „ty”.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Podaj swoje imię
    gloss: Mam na imię Lucía.
    note: Me llamo dosłownie znaczy „nazywam się”. Końcówka czasownika już wskazuje mówiącego, więc hiszpański zwykle pomija tu yo, podobnie jak polski pomija „ja”.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Pytanie o imię w formie nieformalnej
    gloss: Jak masz na imię?
    note: Te pasuje do nieformalnego tú, a llamas ma końcówkę -as właściwą dla tú. Porównaj formalne se llama z nieformalnym te llamas.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Przedstaw się za pomocą ser
    gloss: Jestem Diego.
    note: Soy to forma pierwszej osoby liczby pojedynczej czasownika ser. Hiszpański używa ser do określania tożsamości. Polskie „jestem” obejmuje i tożsamość, i stany tymczasowe, a hiszpański rozdziela te użycia między ser i estar.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Radość z poznania kogoś
    gloss: Miło mi poznać.
    note: Mucho gusto to stały, powszechnie zrozumiały zwrot. W przeciwieństwie do przymiotników takich jak encantado czy encantada nie zmienia się w zależności od płci mówiącego.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Odwzajemnienie uczuć
    gloss: Wzajemnie.
    note: Igualmente to zwięzła odpowiedź na Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Przedstaw mężczyznę
    gloss: To jest Carlos.
    note: Polskie „to” nie zmienia się według rodzaju, a hiszpański wybiera este, gdy wskazywana osoba lub rzecz jest gramatycznie rodzaju męskiego.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Przedstaw kobietę
    gloss: To jest Ana.
    note: Esta używamy dla osoby lub rzeczy rodzaju żeńskiego. Esta nie ma tu akcentu; está z akcentem to forma czasownika estar i znaczy „jest” (np. o położeniu).
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Pytanie o pochodzenie w formie formalnej
    gloss: Skąd Pan/Pani jest?
    note: Es to forma czasownika ser dla usted. Do określenia pochodzenia hiszpański używa ser, a nie estar. Dónde ma akcent w pytaniu bezpośrednim.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Powiedz, skąd pochodzisz
    gloss: Jestem z Meksyku.
    note: Soy to forma yo czasownika ser. Podmiot yo jest zbędny, bo soy już wskazuje mówiącego.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Pytanie o pochodzenie w formie nieformalnej
    gloss: Skąd jesteś?
    note: Eres to forma tú czasownika ser. Porównaj formalne es usted z nieformalnym eres, tak jak po polsku „Pan jest” i „jesteś”.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Kolejna wypowiedź o pochodzeniu
    gloss: Jestem z Kolumbii.
    note: Aby powiedzieć, skąd pochodzisz, użyj soy de i nazwy miejsca.
  es.a1.unit01.lesson04.teach.live_london:
    title: Powiedz, gdzie mieszkasz
    gloss: Mieszkam w Londynie.
    note: Vivo to forma yo czasownika vivir. Hiszpański nie potrzebuje yo, bo końcówka -o wskazuje mówiącego, podobnie jak w polskim „mieszkam”.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Pytanie o hiszpański w formie formalnej
    gloss: Czy Pan/Pani mówi po hiszpańsku?
    note: Hiszpański tworzy to pytanie rozstrzygnięcia bez dodatkowego słowa, takiego jak polskie „czy”. Habla to forma usted; o pytaniu świadczą intonacja i znaki zapytania.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Ograniczona znajomość
    gloss: Tak, trochę.
    note: Sí z akcentem znaczy „tak”. Si bez akcentu znaczy „jeśli”, chociaż pisownia bez akcentu jest tu akceptowana jako tolerancja błędu na poziomie A1.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Opisz trwającą sytuację
    gloss: Wciąż się uczę.
    note: Estoy to forma yo czasownika estar. Tutaj estar wyraża czynność w toku, a soy w Soy de Colombia oznacza pochodzenie lub tożsamość. Polskie „jestem” nie rozróżnia tych użyć, bo hiszpański ma dwa czasowniki.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Formalne pytanie o pierwszą wizytę
    gloss: Czy jest Pan/Pani tu po raz pierwszy?
    note: Su znaczy „Pana/Pani”, gdy zwracasz się do kogoś przez usted. Hiszpańskie su i tu zachowują wybór między formą formalną a nieformalną, podobnie jak polskie „Pana/Pani” i „twój”.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Nieformalne pytanie o pierwszą wizytę
    gloss: Czy jesteś tu po raz pierwszy?
    note: Tu bez akcentu to nieformalny zaimek dzierżawczy „twój”. Porównaj go z zaimkiem tú, który ma akcent.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Potwierdź, że to pierwsza wizyta
    gloss: Tak, jestem tu pierwszy raz.
    note: Primera ma rodzaj żeński, bo zgadza się z rzeczownikiem vez. Tak jak w polskim przymiotnik dopasowuje się do rzeczownika.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Podaj cel swojego przyjścia
    gloss: Jestem tu na warsztatach kulinarnych.
    note: Vengo to forma yo czasownika venir, czyli „przychodzę” lub „idę”. Al to obowiązkowe zlanie a i el.
  es.a1.unit01.lesson05.teach.me_too:
    title: Podziel tę samą sytuację
    gloss: Ja też.
    note: Yo también przydaje się, gdy wypowiedź rozmówcy dotyczy także ciebie.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Zapytaj o zainteresowanie
    gloss: Lubisz gotować?
    note: Gustar ma inny szyk niż polskie „lubić”. Te wskazuje osobę, która odczuwa upodobanie, a cocinar to to, co się podoba. Czasownik pozostaje w formie gusta, bo czynność traktuje się jako liczbę pojedynczą.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Wyrażanie dużego zainteresowania
    gloss: Tak, bardzo.
    note: Mucho odpowiada na pytanie o stopień i tutaj nie zmienia formy.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Pozytywna reakcja
    gloss: Super!
    note: Qué ma w tym wykrzyknieniu akcent. Wprowadza pozytywną reakcję, a nie pytanie.
  es.a1.unit01.lesson06.teach.line01:
    title: Początek spotkania
    gloss: Elena wita się z Mateo i pyta, czy jest tu pierwszy raz.
    note: Oboje używają nieformalnych form z tú, bo spotykają się jako równi sobie uczestnicy tych samych zajęć.
  es.a1.unit01.lesson06.teach.line02:
    title: Początek spotkania, odpowiedź
    gloss: Mateo odpowiada, że tak, jest tu pierwszy raz, i wyjaśnia, że przyszedł na warsztaty kulinarne.
    note: Vengo al taller podaje powód obecności w tym miejscu; czas teraźniejszy opisuje sytuację trwającą teraz.
  es.a1.unit01.lesson06.teach.line03:
    title: Wymiana imion
    gloss: Elena mówi, że ona też jest tu pierwszy raz, podaje swoje imię i pyta Mateo o jego.
    note: Me llamo to naturalny sposób podania imienia. Podobnie jak w polskim, zaimek (yo) zwykle się pomija, bo forma czasownika już wskazuje mówiącego.
  es.a1.unit01.lesson06.teach.line04:
    title: Wymiana imion, odpowiedź
    gloss: Mateo podaje swoje imię i mówi, że miło mu ją poznać.
    note: Soy to inny naturalny sposób podania imienia, z czasownikiem ser zamiast zwrotnego llamarse.
  es.a1.unit01.lesson06.teach.line05:
    title: Pytanie o pochodzenie
    gloss: Elena odwzajemnia uprzejmość (Wzajemnie) i pyta, skąd jest Mateo.
    note: De dónde eres pyta o pochodzenie, używając nieformalnej formy z tú.
  es.a1.unit01.lesson06.teach.line06:
    title: Pytanie o pochodzenie, odpowiedź
    gloss: Mateo pochodzi z Kolumbii, ale mieszka w Londynie, po czym zadaje Elenie to samo pytanie.
    note: Soy de wyraża pochodzenie, a vivo en obecne miejsce zamieszkania. Pero łączy te dwa przeciwstawne fakty.
  es.a1.unit01.lesson06.teach.line07:
    title: Rozmowa o zainteresowaniach
    gloss: Elena mówi, że jest z Hiszpanii, i pyta, czy Mateo lubi gotować.
    note: Soy opisuje pochodzenie, tak samo jak w wypowiedzi Mateo.
  es.a1.unit01.lesson06.teach.line08:
    title: Rozmowa o zainteresowaniach, odpowiedź
    gloss: Mateo mówi, że bardzo lubi gotować, ale wciąż się uczy.
    note: Estoy aprendiendo opisuje czynność trwającą w tej chwili. W polskim wystarczy zwykły czasownik „uczę się”, a w hiszpańskim używa się tu konstrukcji estar + gerundio.
  es.a1.unit01.lesson06.teach.line09:
    title: Zakończenie rozmowy
    gloss: Elena mówi, że ona też się uczy, i że zobaczą się w środku.
    note: Nos vemos zapowiada spotkanie w najbliższym czasie, a dentro określa miejsce.
  es.a1.unit01.lesson06.teach.line10:
    title: Zakończenie rozmowy, odpowiedź
    gloss: Mateo zgadza się i potwierdza, że zobaczą się.
    note: Sí po prostu potwierdza propozycję Eleny, zanim powtórzy nos vemos.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: Która forma „ty/Pan/Pani” jest grzecznościowa?
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted to grzecznościowa forma liczby pojedynczej, używana z czasownikiem w trzeciej osobie.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: Która forma służy do nieformalnego zwracania się do jednego przyjaciela lub rówieśnika?
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: Zaimek pisze się tú; tu bez akcentu znaczy „twój”.
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: Posłuchaj i wybierz zdanie, które słyszysz.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: Wpisz nieformalne pytanie, które słyszysz.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: Ułóż w kolejności pytanie w formie grzecznościowej.
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: Wybierz pytanie zwrotne zachowujące formę grzecznościową.
    correct_option: ¿Y usted?
    distractors:
    - ¿Y tú?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: Wybierz pytanie zwrotne do przyjaciela lub rówieśnika.
    correct_option: ¿Y tú?
    distractors:
    - ¿Y usted?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: Popraw nieformalne pytanie.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: Z tú potrzebna jest forma estás; está używa się z usted.
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: Odpowiedz grzecznie na pytanie.
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Odpowiedz nieformalnie, podziękuj i zadaj pytanie zwrotne.
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
    - Bien, gracias. Y tu?
    - Bien, gracias, ¿y tú?
  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: Posłuchaj i wybierz powitanie.
    correct_option: Hola
    distractors:
    - Adiós
    - Hasta luego
    accepted_answers:
    - Hola
  es.a1.unit01.lesson02.exercise02.listen_morning:
    instruction: Wpisz poranne powitanie, które słyszysz.
    accepted_answers:
    - Buenos días
    - Buenos dias
  es.a1.unit01.lesson02.exercise03.order_afternoon:
    instruction: Ułóż w kolejności powitanie popołudniowe.
    correct_response:
    - Buenas
    - tardes
  es.a1.unit01.lesson02.exercise04.select_night:
    instruction: Co oznacza to wyrażenie jako powitanie wieczorne?
    correct_option: Dobry wieczór.
    distractors:
    - Dzień dobry.
    - Do zobaczenia później.
    accepted_answers:
    - Dobry wieczór.
  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: Posłuchaj i wybierz wyrażenie, które słyszysz.
    correct_option: Buenas noches
    distractors:
    - Buenos días
