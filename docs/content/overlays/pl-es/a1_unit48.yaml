teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Trzy popularne czasowniki związane z hobby: *leer* (czytać), *hacer deporte* (uprawiać sport) i *cocinar* (gotować).'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Czas wolny
    gloss: czas wolny
    note: '*El tiempo libre* to wyrażenie rodzaju męskiego i kluczowe określenie, gdy mówisz o hobby.'
    example_gloss: W wolnym czasie lubię czytać.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*Me gusta leer* („lubię czytać”) to *gustar* + bezokolicznik; *me gusta* pozostaje takie samo przy każdej czynności.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Jeszcze trzy czasowniki związane z hobby: *escuchar música* (słuchać muzyki), *dibujar* (rysować) i *jugar videojuegos* (grać w gry wideo).'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: '*Escuchar* łączy się z dopełnieniem bezpośrednio, bez przyimka: *escuchar música*.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: '*Con amigos* („z przyjaciółmi”) wykorzystuje przyimek *con* z wcześniejszych lekcji.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: 'Cztery podstawowe przysłówki częstotliwości: *siempre* (zawsze), *a menudo* (często), *a veces* (czasami), *nunca* (nigdy). Zwykle stoją przed czasownikiem lub na początku zdania.'
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*Cada semana* i *cada fin de semana* oznaczają „każdy/każdego”; *cada* nigdy nie zmienia formy.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada nigdy się nie zmienia
    gloss: 'Cada pozostaje bez zmian: cada semana, cada fin de semana.'
    note: '*Cada* nigdy się nie zmienia: stoi tak samo przed rzeczownikami rodzaju żeńskiego (*semana*) i męskiego (*fin de semana*).'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena zaczyna rozmowę o hobby
    gloss: 'Elena: Często spacerujemy razem. Ale co jeszcze robisz w wolnym czasie, Mateo?'
    note: '*A menudo paseamos juntos* („często spacerujemy razem”): *paseamos* to forma *nosotros* czasownika *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Hobby Mateo
    gloss: 'Mateo: Lubię gotować, także w domu. I często uprawiam sport.'
    note: '*También en casa* („także w domu”) pokazuje, że Mateo gotuje dla przyjemności, a nie tylko w pracy w restauracji.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena jest zaskoczona
    gloss: 'Elena: Gotujesz też w domu? Przecież w pracy gotujesz cały dzień!'
    note: '*Todo el día* („cały dzień”) podkreśla, jak dużo Mateo już gotuje w pracy.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo wyjaśnia
    gloss: 'Mateo: Tak, ale gotowanie wydaje mi się relaksujące. A ty, co lubisz robić?'
    note: '*Cocinar me parece relajante* dosłownie znaczy „gotowanie wydaje mi się relaksujące”: *me parece* + przymiotnik to naturalny sposób wyrażania opinii.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Hobby Eleny
    gloss: 'Elena: Lubię czytać i często słucham muzyki.'
    note: Łączy w jednym zdaniu dwa czasowniki związane z hobby z wcześniejszych lekcji za pomocą *y* (i).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo pyta o gry wideo
    gloss: 'Mateo: Ty też grasz w gry wideo?'
    note: Krótkie pytanie rozstrzygnięcia z *jugar videojuegos* z lekcji 2; *tú también* („ty też”) używa nieformalnego *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena odpowiada
    gloss: 'Elena: Nie, nigdy nie gram w gry wideo. Ale czasami rysuję!'
    note: '*Nunca* („nigdy”) i *a veces* („czasami”) z lekcji 3, zestawione w jednej odpowiedzi.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Porównujemy hobby
    gloss: Mateo i ja często spacerujemy razem. Ale mamy też inne zainteresowania. Mateo lubi gotować, także w domu, i często uprawia sport. Ja lubię czytać i często słucham muzyki. Czasami rysuję, ale nigdy nie gram w gry wideo. Co ty lubisz robić w wolnym czasie?
    note: Wiadomość Eleny podsumowuje informacje z poprzedniej lekcji i kończy się pytaniem do czytelnika – głównym pytaniem tej jednostki.
    glosses:
      paseamos: spacerować
      menudo: często
      juntos: razem
      otras: inne
      cocinar: gotuje
      gusta: chętnie
      casa: w domu
      deporte: uprawia (sport)
      leer: czytam
      escucho: słucham
      música: muzyka
      dibujo: rysuję
      veces: czasami
      videojuegos: gram w gry wideo
      nunca: nigdy
      libre: wolny
      tiempo: czas
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo pyta o weekend
    gloss: 'Mateo: Co robisz w ten weekend?'
    note: '*Este fin de semana* („w ten weekend”) używa *este* z rzeczownikiem rodzaju męskiego *fin de semana*.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena jeszcze nie wie
    gloss: 'Elena: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść.'
    note: '*Quiero salir* („chcę wyjść”) to popularny sposób, by powiedzieć, że chcesz wyjść z domu.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo proponuje plan
    gloss: 'Mateo: Pójdziemy razem na spacer? Potem ugotuję coś dla nas.'
    note: '*Después* („potem”) to słowo porządkujące kolejność: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena się zgadza
    gloss: 'Elena: Dobry pomysł! Lubię obie te rzeczy: spacerować i gotować.'
    note: '*Las dos cosas* (obie rzeczy) pokazuje, że Elena lubi obie równie mocno, a nie jedną bardziej od drugiej.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo potwierdza
    gloss: 'Mateo: Świetnie! W takim razie widzimy się w sobotę!'
    note: Przyjazne zakończenie potwierdzające plan na *el sábado* (sobotę); przed konkretnym dniem tygodnia hiszpański używa *el*.
