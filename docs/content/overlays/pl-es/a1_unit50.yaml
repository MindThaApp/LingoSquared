answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Hiszpański A1
  description: 'Hiszpański dla początkujących: proponowanie, przyjmowanie, odmawianie, umawianie się oraz czytanie i pisanie prostych planów.'
units:
  es.a1.unit50.plans:
    title: Proste plany
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Proponowanie zajęcia
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Przyjmowanie lub odrzucanie planu
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Ustalanie dnia i godziny
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Czytanie zaproszenia
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Pisanie i potwierdzanie planu
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Elena i Mateo robią plan
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Razem
    gloss: razem
    note: '*Juntos* podkreśla, że osoby robią coś razem; zgadza się z osobami (*juntas*, jeśli wszystkie są kobietami).'
    example_gloss: Napijemy się razem kawy?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Napić się kawy
    gloss: napić się kawy
    note: Po hiszpańsku mówi się *tomar un café* (dosłownie „wziąć kawę”), a nie „pić kawę”.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Pójść do kina
    gloss: pójść do kina
    note: '*Ir al cine* (dosłownie „iść do kina”) to zwykły sposób, by powiedzieć, że idzie się na film; *al* to *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Napijemy się kawy?
    gloss: Napijemy się kawy?
    note: '*¿Tomamos ...?* to czas teraźniejszy w formie *nosotros*, którą proponuje się coś wspólnie.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: 'Jak proponować: ¿Tomamos ...?'
    gloss: 'Tak zwykle proponuje się wspólne zrobienie czegoś: czasownik w pierwszej osobie liczby mnogiej + coś.'
    note: 'Forma *nosotros* (*tomamos*) służy do składania propozycji, podobnie jak polskie „napijemy się?”: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Masz ochotę pójść do kina?
    gloss: Masz ochotę pójść do kina?
    note: '*¿Tienes ganas de ...?* to nieformalne pytanie, czy ktoś ma ochotę coś zrobić; po *de* następuje bezokolicznik.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Tak, świetnie!
    gloss: Tak, świetnie!
    note: '*¡Sí, qué bien!* to krótkie, entuzjastyczne przyjęcie propozycji.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Dobry pomysł
    gloss: Dobry pomysł!
    note: '*¡Buena idea!* przyjmuje propozycję, chwaląc ją.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: To dobry plan
    gloss: To dobry plan.
    note: To nieco pełniejsza pozytywna odpowiedź.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Odmowa z powodem
    gloss: Przykro mi, nie mogę, bo pracuję.
    note: '*Lo siento* łagodzi odmowę, a *porque* wprowadza krótki powód.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: Nie mam czasu
    gloss: Nie mam czasu.
    note: '*No tengo tiempo* to bezpośredni, ale zwyczajny powód odmowy; *no* stoi przed czasownikiem.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Uprzejma odmowa
    gloss: „Przykro mi” + „nie mogę” + krótki powód sprawiają, że odmowa brzmi uprzejmie.
    note: W rozmowie powód nie jest obowiązkowy, ale dzięki niemu odpowiedź jest uprzejma i bardziej zrozumiała.
  es.a1.unit50.lesson03.teach.quedar:
    title: Umawianie się
    gloss: umówić się
    note: '*Quedar* znaczy „umówić się na spotkanie”: *¿Quedamos el viernes?* Wielu mieszkańców Ameryki Łacińskiej mówi zamiast tego *¿Nos vemos el viernes?*'
    example_gloss: Umówimy się w piątek o wpół do trzeciej?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Spotkanie w piątek o wpół do trzeciej
    gloss: Umówimy się w piątek o 14:30?
    note: Zdanie łączy dzień tygodnia *el viernes* z *a las* i godziną.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media znaczy „wpół do”
    gloss: wpół do trzeciej = 2:30; „o wpół do trzeciej” podaje godzinę spotkania.
    note: 'Po polsku mówimy „wpół do trzeciej” (patrząc na następną godzinę), a po hiszpańsku liczy się od godziny, która już minęła: *las dos y media* to dosłownie „druga i pół”, czyli 2:30.'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: Data i godzina
    gloss: w piątek 17 kwietnia o 3:15
    note: 'Dni tygodnia i miesiące pisze się po hiszpańsku małą literą, jak po polsku, a w datach występuje *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Potwierdzenie godziny
    gloss: Tak, piątek o wpół do trzeciej mi odpowiada.
    note: '*Me viene bien* (dosłownie „pasuje mi”) potwierdza, że zaproponowany termin jest dobry.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Wiadomość, zaproszenie, kawiarnia językowa
    gloss: wiadomość, zaproszenie, kawiarnia językowa
    note: '*Un mensaje* to krótka wiadomość pisemna lub cyfrowa, *una invitación* zaprasza do wspólnej aktywności, a *el café de idiomas* to miejsce spotkań grupy.'
    example_gloss:
    - Mam wiadomość od Eleny.
    - To zaproszenie do kawiarni językowej.
    - Pijemy kawę w kawiarni językowej.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: Zaproszenie od Eleny
    gloss: Cześć, Mateo, masz ochotę napić się kawy w kawiarni językowej w sobotę 18 kwietnia o wpół do trzeciej? Pozdrawiam, Elena.
    note: 'Czytaj, szukając czterech informacji: co, kiedy (data), o której godzinie i gdzie.'
    glosses:
      Hola: cześć
      ganas: ochota (tener ganas de = mieć ochotę)
      sábado: sobota
      abril: kwiecień
      media: i pół (y media = wpół do następnej godziny)
      dos: dwa
      café: kawa
      tomar: pić / wypić
      idiomas: kawiarnia językowa
      saludo: pozdrowienia
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Wiadomość z propozycją
    gloss: Cześć, Mateo, napijemy się kawy w piątek o wpół do trzeciej? Pozdrawiam, Elena.
    note: Wiadomość zawiera powitanie, aktywność, dzień, godzinę i zakończenie.
    glosses:
      Hola: cześć
      vamos: czy pójdziemy
      viernes: piątek
      media: i pół (y media = wpół do następnej godziny)
      dos: dwa
      café: kawa
      tomar: pić / wypić
      saludo: pozdrowienia
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Wiadomość potwierdzająca
    gloss: Cześć, Eleno, tak, świetnie! Piątek o wpół do trzeciej mi odpowiada. Do zobaczenia w piątek! Mateo.
    note: Odpowiedź przyjmuje propozycję i powtarza termin, by go potwierdzić.
    glosses:
      Hola: cześć
      bien: fajnie / świetnie
      viernes: piątek
      media: i pół (y media = wpół do następnej godziny)
      dos: dwa
      viene: dobrze / pasuje
      Hasta: do / do zobaczenia
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Co zawiera wiadomość
    gloss: Krótka wiadomość podaje, co robimy, w jaki dzień lub jakiego dnia i o której godzinie.
    note: Powitanie i zakończenie są przydatne, ale najważniejsze jest to, co robicie i kiedy.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena proponuje kawę
    gloss: 'Elena: Napijemy się kawy w piątek? Mateo: Tak, świetnie! O której?'
    note: Mateo przyjmuje propozycję, zanim zapyta o godzinę.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Pierwsza godzina Eleny
    gloss: 'Elena: O wpół do trzeciej.'
    note: '*Las dos y media* znaczy 2:30, tak jak w lekcji o podawaniu godzin.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo proponuje inną godzinę
    gloss: 'Mateo: Przykro mi, o wpół do trzeciej nie mogę. Może być o piętnaście po trzeciej?'
    note: '*¿Puede ser a ...?* to zwięzły sposób zapytania, czy odpowiada inna godzina.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Ustalają ostateczny plan
    gloss: 'Elena: Tak, kwadrans po trzeciej mi odpowiada. Mateo: Dobry plan. W takim razie umawiamy się w piątek kwadrans po trzeciej.'
    note: Tu *quedamos* to znów forma *nosotros*, tym razem potwierdzająca plan.
