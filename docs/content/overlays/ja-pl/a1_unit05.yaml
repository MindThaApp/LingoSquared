teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: 家族
    gloss: 家族
    note: 家族全体を指す一般的な単語です。特定の続柄ではなく、一つの世帯の人たち全体に使います。
    example_gloss: これは私の家族です。
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: 母、父
    gloss: 母、父
    note: 両親を表す基本の二語です。日常会話では親しみを込めた mama や tata もよく耳にしますが、ここでは中立的で標準的な matka と ojciec を学びます。
    example_gloss:
    - こちらは私の母です。
    - こちらは私の父です。
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: 兄弟、姉妹
    gloss: 兄弟、姉妹
    note: どちらも普通の名詞で、brat は男性名詞、siostra は女性名詞です。このレッスンの文法ノートで扱う mój/moja の使い分けに関わります。
    example_gloss:
    - こちらは私の兄弟です。
    - こちらは私の姉妹です。
  pl.a1.unit05.lesson01.teach.rodzice:
    title: 両親
    gloss: 両親
    note: Rodzice は男性人称の複数名詞で、mój/moja ではなく独自の所有形 moi を取ります。このレッスンの例文と文法ノートで確認しましょう。
    example_gloss: 私の両親はワルシャワに住んでいます。
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 「私の」:mój・moja・moi
    gloss: 私の父、私の兄弟 -- 私の母、私の姉妹 -- 私の両親。
    note: ポーランド語の所有詞は、修飾する名詞の性に合わせて形が変わります。男性名詞の前では *mój*(*mój ojciec*、*mój brat*)、女性名詞の前では *moja*(*moja matka*、*moja siostra*)を使い、男性人称の複数名詞 *rodzice* の前では不規則な別の形 *moi* を使います。
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: これは私の父です
    gloss: これは私の父です。
    note: '*To jest*(これは~です)は、名詞の性に関係なく同じ形で使えます。変わるのは所有詞の mój/moja だけです。'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: 祖父、祖母
    gloss: 祖父、祖母
    note: 祖父と祖母を表す日常的で標準的な言葉で、子どもも大人も使います。
    example_gloss:
    - こちらは私の祖父です。
    - こちらは私の祖母です。
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: おじ、おば
    gloss: おじ、おば
    note: wujek は父方でも母方でも、またおばの夫にも使います。ciotka も父方・母方どちらのおばにも、おじの妻にも使います。
    example_gloss:
    - こちらは私のおじです。
    - こちらは私のおばです。
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: 息子、娘
    gloss: 息子、娘
    note: 例文では、*mieć*(持つ)の後ろで必要な対格の形を示しています。*syn* は *syna*、*córka* は *córkę* になります。語尾が変わる理由は、このあとの文法ノートで説明します。
    example_gloss:
    - 私には息子がいます。
    - 私には娘がいます。
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 持つ:mam, masz, ma
    gloss: 持つ:私は持っている、あなたは持っている、彼/彼女は持っている -- 私には兄弟がいます、あなたには姉妹がいます、彼/彼女には息子がいます。
    note: '*Mieć* は「持つ、いる」を表す動詞です。*Mam*(私は持っている)と *ma*(彼/彼女は持っている)がこのレッスンの主な新出形です。*masz*(あなたは持っている)は、ユニット2の年齢をたずねる表現ですでに出てきました。'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: 持っているものを言う
    gloss: 「持つ」の後では、名詞の語尾が変わります:brat -> brata、siostra -> siostrę、syn -> syna、córka -> córkę。
    note: これは対格で、*mieć* のような動詞の直接目的語になる名詞が取る形です。*brat* や *syn* のように人(や動物)を表す男性名詞は *-a* を付けます。*siostra* や *córka* のような女性名詞は、語末の *-a* が *-ę* に変わります。
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: 私には兄(弟)と姉(妹)がいます
    gloss: 私には兄(弟)と姉(妹)がいます。
    note: 文法ノートで学んだ対格の語尾を、文の中で実際に使います。接続詞 *i*(~と、そして)も新しく出てきます。
  pl.a1.unit05.lesson03.teach.lub:
    title: または
    gloss: または
    note: lub は、二つの選択肢を挙げる「はい・いいえ」で答える質問の中で、「または」の意味で使います。
    example_gloss: お兄さん(弟さん)か、お姉さん(妹さん)はいますか?
  pl.a1.unit05.lesson03.teach.tylko:
    title: だけ
    gloss: だけ
    note: 日本語の「だけ」は語の後ろに付きますが、tylko は限定したい語の直前に置きます。
    example_gloss: 私には姉(妹)しかいません。
  pl.a1.unit05.lesson03.teach.gdzie:
    title: どこ
    gloss: どこ
    note: 基本的な疑問詞です。このレッスンの会話のように、mieszkać(住む)とよく一緒に使われます。
    example_gloss: あなたのお兄さん(弟さん)はどこに住んでいますか?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: 彼、彼女、そして「住む」
    gloss: 彼、彼女 -- 住む:私は住んでいる、彼/彼女は住んでいる。彼は Gdańsk に住んでいます。彼女は Kraków に住んでいます。
    note: '*On*(彼)と *ona*(彼女)は三人称の代名詞です。*Mieszkać*(住む)は *mieć* と同じく、一人称と三人称で同じ型の活用をします。*mieszkam*(私は住んでいる。ユニット1の *Mieszkam w Warszawie* で登場)と *mieszka*(彼/彼女は住んでいる)です。地名は *w* の後ろで場所格になります。*Gdańsk* は *w Gdańsku*、*Kraków* は *w Krakowie* となり、ユニット1の *Mieszkam w Warszawie* と同じ「w + 場所格」の型です。'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek が兄弟姉妹についてたずねる
    gloss: Marek は Ewa に、お兄さん(弟さん)かお姉さん(妹さん)がいるかたずねます。
    note: ユニット1で学んだ疑問の標識 *Czy* を使った、「はい・いいえ」で答える質問です。Ewa と Marek はもう親しくなったので、丁寧な *pan*/*pani* から親しい *ty*(*masz*、*A ty?*、*twój*)に切り替えています。
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa が答えて、たずね返す
    gloss: Ewa は兄(弟)と姉(妹)がいると答え、Marek にも同じ質問をたずね返します。
    note: '*A ty?*(「あなたは?」)は、質問してきた相手に同じ質問を返すときの、簡潔で自然な言い方です。'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek が答える
    gloss: Marek は姉(妹)しかいないと言い、その人は Kraków に住んでいると話します。そして Ewa にお兄さん(弟さん)のことをたずねます。
    note: Marek には兄弟がおらず、*tylko siostrę*(姉妹だけ)です。Ewa はすでに兄弟がいると言っているので、Ewa の兄弟についてたずねても問題ありません。
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa が答える
    gloss: Ewa は、兄(弟)は Gdańsk に住んでいて、息子と娘がいると話します。
    note: レッスン2で学んだ、この単元の syn/córka の対格の型をもう一度使っています。
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek が反応する
    gloss: Marek は「すてきな家族だね!」と言います。
    note: '*Fajna* は「すてき」「いいね」を表すくだけた日常的な言葉です。会話の締めくくりの自然な反応で、ユニット4の *Świetnie!* と同じくらいの丁寧さです。'
