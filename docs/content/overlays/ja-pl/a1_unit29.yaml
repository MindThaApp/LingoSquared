    example_gloss: 私は天気予報を調べます。
  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: 2つの動詞、2つの格
    gloss: '*Sprawdzam* は対格をとります:*prognozę pogody*。*Używam* は生格をとります:*telefonu*。'
    note: ほとんどの動詞は対格をとりますが、*używać* は例外で、生格が必要です。
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
