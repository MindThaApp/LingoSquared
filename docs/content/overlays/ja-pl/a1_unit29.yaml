    example_gloss: アプリでメッセージを送ります。
  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: メッセージの動詞:送る・読む
    gloss: '*prognoza pogody*(天気予報)はもう知っていますね。*Wiadomość* は、送る(*wysyłam*、*wysyłasz*)ことも、読む(*czytam*、*czytasz*)こともできるメッセージです。'
    note: 新しい単語を、天気の単元ですでに学んだ複合名詞と結び付けています。
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewaがアプリでメッセージを送る
    gloss: Ewaはアプリでメッセージを送ります。
    note: '*Wysyłać*(送る)は、手段を表すのに *przez* + 対格を使います:*przez aplikację*。'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
