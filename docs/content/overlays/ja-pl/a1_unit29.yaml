  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia と do + 曜日など
    gloss: '*Do widzenia!* はもう知っていますね。日を表す言葉を続けることもできます:*Do soboty!*、*Do jutra!*(*do* のあとは生格になります)。'
    note: あいさつの単元で学んだ別れの表現を、特定の日を示す形に広げます。
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: 誰が何を使いますか？
    gloss: Ewaは毎日Marekに電話します。アプリではなく、電話を使います。Marekは家にパソコンがありませんが、携帯電話でインターネットを使います。Tomekは毎朝天気予報を調べます。そのあと、走りに行きます。Kasiaはよく Ewaにメッセージを送ります。あなたも毎日携帯電話を使いますか?
    note: 4人の機器の使い方を比較する、スポーツの単元と同じ形式の読解です。
