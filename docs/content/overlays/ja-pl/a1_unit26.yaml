teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*Zwierzę* は「動物」を表す一般的な言葉で、*zwierzak* は日常会話で「ペット」を表す言葉です。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - エヴァは犬を飼っています。
    - トメクは猫を飼っています。
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: これまでのユニットで学んだ *Masz ...?* という質問の型と同じです。*masz* は *mieć* の *ty* の形です。
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*Nie mam* の後では、持っていないものが属格になります:*zwierzaka*。文法ノートを見てください。'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + 属格
    gloss: '*nie mam* の後では目的語が属格になります:*Nie mam czasu*(時間がありません)、そしてここでは *Nie mam zwierzaka*(ペットを飼っていません)。'
    note: '*Nie mam czasu* と同じパターンで、名詞だけが新しくなります。*zwierzak* のような男性活動体名詞は対格と属格が同じ形ですが、女性名詞では形が変わります(*Mam rybę* は *Nie mam ryby* になります)。'
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*Wyprowadzać na spacer* は動物を散歩に連れて行くときの決まった言い方です。習慣なので動詞は不完了体です。文法ノートを見てください。'
    example_gloss: 私は毎日犬を散歩させます。
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: 習慣を表す不完了体
    gloss: '*Wyprowadzać*(不完了体)は習慣を表します:*Codziennie wyprowadzam psa.* 完了体の *wyprowadzić* は、1回の終わった散歩に使います。'
    note: 体のペア:不完了体(*wyprowadzać*)は繰り返される動作に、完了体(*wyprowadzić*)は1回きりの完了した動作に使います。
  pl.a1.unit26.lesson02.teach.karmic:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: トメクは自分の猫と遊んでいます。
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*wyprowadzać na spacer* と *codziennie*(毎日)を組み合わせた文です。目的語の *psa* は対格です。'
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*Karmić*(餌をあげる)は動物を対格にします:*karmię kota*。ここでは *codziennie* と組み合わせています。'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 複数形:pies, psy
    gloss: 複数形:*pies* は *psy*、*kot* は *koty*、*ryba* は *ryby*、*ptak* は *ptaki* になります。ほとんどの複数形は *-y* で終わり、k と g の後では *-i* になります。
    note: ポーランド語の規則的な複数形のパターンです。ここで動物の名詞を例に初めて学びます。
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - マレクは犬が大好きです。
    - カシアは猫が大好きです。
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*Kocham* は *kochać* の *ja* の形です。目的語の *zwierzęta* は対格の複数形です。'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: カシアは猫が大好きですが、ペットは飼っていません
    gloss: カシアは猫が大好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: マレクがペットについて尋ねる
    gloss: マレク:エヴァ、ペットを飼っていますか?
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: エヴァは犬を飼っている
    gloss: エヴァ:はい、犬を飼っています。
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: マレクがどんな見た目か尋ねる
    gloss: マレク:どんな見た目ですか?
    note: 以前のレッスンで学んだ *Jak wygląda ...?* という質問を、今度は動物について使っています。犬のことも *on* で表せます。
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: エヴァが自分の犬を説明する
    gloss: エヴァ:茶色の毛で、小さいです。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: 動物に使う on と ona
    gloss: 動物にも文法上の性があります。*pies* や *kot* には *on*(彼)、*ryba* には *ona*(彼女)を使います。これらの代名詞は、人だけでなく動物も指すことができます。
    note: 代名詞は名詞の性に合わせます。*pies* と *ptak* は *on*、*ryba* は *ona*、*zwierzę* は *ono* になります。
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek が散歩について尋ねる
    gloss: Marek:毎日、彼を散歩に連れて行っていますか?
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa が日課を話す
    gloss: Ewa:はい、毎日散歩に連れて行って、ごはんもあげています。
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: 動物についての Marek、Kasia、Tomek
    gloss: Marek と Kasia は二人とも動物が大好きですが、どちらもペットを飼っていません。Marek は犬が好きで、Kasia は猫が好きです。Tomek はペットを飼っています。猫です。よく猫と遊び、毎日ごはんをあげています。あなたはペットを飼っていますか?
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      kochają: 愛する
      oboje: 両方とも
      zwierzęta: 動物
      zwierzaka: ペット
      psy: 犬たち
      koty: 猫たち
      kota: 猫
      bawi: 遊ぶ
      daje: 与える
      co: 毎～
      jeść: 餌
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek はよく猫と遊びます
    gloss: Tomek はよく猫と遊びます。
    note: '*Bawić się z*(〜と遊ぶ)は造格を取ります:*z kotem*。*Często* は「よく」を表す頻度の副詞です。'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa が Nina に尋ねる
    gloss: Ewa:Nina、あなたもペットを飼っていますか?
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: NinaはPicoという鳥を飼っています
    gloss: Nina：はい、鳥を飼っています。名前はPicoです。
    note: '*Ma na imię*(〜という名前です)は、前に名前を紹介したときと同じ表現です。'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek の反応
    gloss: Marek:いいですね!毎日その子と何をしていますか?
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Ninaは毎日その鳥に餌を与えます
    gloss: Nina：毎日その鳥に餌を与えています。
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek も鳥が大好き
    gloss: Marek:私も鳥が大好きです。
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa が会話を締めくくる
    gloss: Ewa:私たち三人とも動物が好きなんて、素敵ですね!
    note: このユニットで登場した三人と動物についての話をまとめて、会話を締めくくっています。
