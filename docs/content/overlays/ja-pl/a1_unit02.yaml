answer_policy:
  diacritics: 'Same standing policy as unit01: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: ポーランド語 A1
units:
  pl.a1.unit02.numbers:
    title: 数
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0から10までの数
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: 11から100までの数と値段
  pl.a1.unit02.lesson03.phone_and_age:
    title: 電話番号と年齢
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: ゼロ
    note: このユニットで学ぶすべての数の出発点です。
    example_gloss: 今日は0度です。
  pl.a1.unit02.lesson01.teach.jeden:
    title: 一
    gloss: 一
    note: '*Jeden* のあとには、このレッスンの他の数と違って、ふつうの単数形の名詞が来ます。'
    example_gloss: 私は電話を1台持っています。
  pl.a1.unit02.lesson01.teach.dwa:
    title: 二
    gloss: 二
    note: '*Dwa*、*trzy*、*cztery* のあとには、*psy*(犬)のような特別な複数形の名詞が来ます。*pięć* 以上の数のあとの複数形とは異なります。'
    example_gloss: 私は犬を2匹飼っています。
  pl.a1.unit02.lesson01.teach.trzy:
    title: 三
    gloss: 三
    note: '*dwa* と同じ複数形のパターンです:*trzy złote*(3złoty)で、*trzy złotych* ではありません。'
    example_gloss: コーヒーは3złotyです。
  pl.a1.unit02.lesson01.teach.cztery:
    title: 四
    gloss: 四
    note: この複数形のパターンを共有する3つの数(*dwa*、*trzy*、*cztery*)の最後です。
    example_gloss: 私は本を4冊持っています。
  pl.a1.unit02.lesson01.teach.piec:
    title: 五
    gloss: 五
    note: '*pięć* 以上の数のあとでは、別の複数形(属格の複数形。*minuty* ではなく *minut* など)になります。このパターンはこのユニットの最後まで続きます。'
    example_gloss: 私には5分あります。
  pl.a1.unit02.lesson01.teach.szesc:
    title: 六
    gloss: 六
    note: '*pięć* と同じ属格の複数形のパターンです:*sześć jabłek*(りんご6個)。'
    example_gloss: リンゴを6個持っています。
  pl.a1.unit02.lesson01.teach.siedem:
    title: 七
    gloss: 七
    note: 曜日の話をするときに役立つ数です。
    example_gloss: 1週間は7日です。
  pl.a1.unit02.lesson01.teach.osiem:
    title: 八
    gloss: 八
    note: '*Mam osiem lat* は直訳すると「私は8年を持っている」です。ポーランド語では年齢を「~である」ではなく、*mieć*(持つ)を使って言います。第3レッスンで詳しく練習します。'
    example_gloss: 私は8歳です。
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: 九
    gloss: 九
    note: ここでも属格の複数形です:*dziewięć osób*(9人)。
    example_gloss: 9人が列に並んで待っています。
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: 十
    gloss: 十
    note: 1桁の数の最後です。第2レッスンでは10代と10の位の数に進みます。
    example_gloss: 私の指は10本です。
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: 十一
    gloss: 十一
    note: 11から19までの数は *-naście* で終わります。*pięć* 以上と同じく属格の複数形を取ります:*jedenaście osób*。
    example_gloss: クラスは11人です。
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: 十二
    gloss: 十二
    note: '*jedenaście* と同じ *-naście* のパターンです。'
    example_gloss: 1年は12か月です。
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: 十五
    gloss: 十五
    note: これも *-naście* の10代のパターンです:*piętnaście minut*(15分)。
    example_gloss: 15分の休憩があります。
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: 二十
    gloss: 二十
    note: 20から40までの数は *-dzieści* で終わり、*-naście* の10代とは別のパターンです。*Dwadzieścia* 自体は属格の複数形を取ります(*dwadzieścia lat*)が、一の位が加わるとどうなるかは第3レッスンで確認しましょう。
    example_gloss: 20歳です。
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: '21'
    gloss: '21'
    note: 日本語と同じように、合成数は十の位のあとに一の位を続けるだけで作れ、つなぎの言葉は要りません。
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: 三十
    gloss: 三十
    note: '*dwadzieścia* と同じ *-dzieści* のパターンです。'
    example_gloss: 切符は30złotyです。
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: 五十
    gloss: 五十
    note: 50から90までの数は、*-dzieści* ではなく、3つ目のパターン *-dziesiąt* になります。
    example_gloss: 私は50złotyを持っています。
  pl.a1.unit02.lesson02.teach.sto:
    title: 百
    gloss: '100'
    note: きりのいい数で、複雑な語尾を気にする必要がありません。
    example_gloss: それは100złotyです。
  pl.a1.unit02.lesson02.teach.ile:
    title: いくら/いくつ
    gloss: いくら、いくつ
    note: 数量や値段をたずねるときの疑問詞です。
    example_gloss: これはいくらですか?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: 値段をたずねる
    gloss: これはいくらですか?
    note: '*Kosztować*(「値段がする」)が動詞で、*to*(「これ/それ」)が主語です。この質問全体が、よく使われる決まった言い方です。'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: 値段を言う
    gloss: これは20złotyです。
    note: '*Złotych* は *złoty*(ポーランドの通貨)の属格の複数形で、*dwadzieścia* 自体が取る複数形と同じです。'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: 男性に電話番号をたずねる
    gloss: お電話番号は何番ですか?(男性に、丁寧な言い方)
    note: 直訳は「その男性の電話番号は何ですか」です。*Pana* は *pan* の所有を表す形(属格)で、「その方の」、つまり「あなたの」という意味になります。
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: 女性に電話番号をたずねる
    gloss: お電話番号は何番ですか?(女性に、丁寧な言い方)
    note: '*pana* を *pani* に替えれば、女性に丁寧にたずねる言い方になります。ユニット1と同じパターンです。'
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: くだけた言い方で電話番号をたずねる
    gloss: 電話番号は何番?(くだけた言い方)
    note: 友達や同年代の人と話すときは、*pana*/*pani* の代わりに *Twój*(あなたの、くだけた言い方)を使います。
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 番号を言う前の導入
    gloss: 番号は…です。
    note: 数字を一つずつ読み上げる前の短い導入で、ポーランド語で電話番号を声に出して伝えるときの自然な言い方です。
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: 電話番号の例
    gloss: 6、1、5、0、2。
    note: ポーランド語の電話番号は、日本語と同じように1桁ずつ読みます。ここに出てくる数字はすべて、このユニットで学んだ数です。
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: くだけた言い方で年齢をたずねる
    gloss: 何歳？（親称）
    note: 直訳は「あなたは何年持っていますか」です。ポーランド語では年齢を *mieć*(持つ)で表します。第1レッスンの *osiem* のカードで見たパターンです。
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: 丁寧な言い方で年齢をたずねる
    gloss: おいくつですか?(男性に、丁寧な言い方)
    note: '*Ma* はユニット1の *pan jest*/*pan ma* で見たのと同じ三人称の動詞の形です。*pan* は文法上「その男性」という三人称の主語として扱われます。'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: 自分の年齢を言う
    gloss: 私は28歳です。
    note: '*Mam* は *mieć*(持つ)の一人称の形です。*Dwadzieścia osiem* は *osiem*(8)で終わるので、5から9で終わる数と同じく *lat* を取ります。第3レッスンの会話には、違う形で終わる数が出てきます。'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: エヴァがマレクに電話番号をたずねる
    gloss: エヴァがマレクに、丁寧な言い方で電話番号をたずねます。
    note: このレッスンで学んだ丁寧な電話番号の質問をそのまま使っています。
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: マレクが番号を伝える
    gloss: マレクが電話番号を1桁ずつ読み上げます。
    note: ここに出てくる数字は、このユニットの第1・第2レッスンですべて学んだものです。
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: エヴァがマレクの年齢をたずねる
    gloss: エヴァはお礼を言い、丁寧な言い方で年齢をたずねます。
    note: '*Dziękuję*(「ありがとう」)と *A*(「それで、では」)は、丁寧さのレベルが変わっても形が変わりません。ユニット1の *dziękuję* のカードと同じです。'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: マレクが年齢を答え、同じ質問を返す
    gloss: マレクは28歳だと言い、丁寧な言い方でエヴァにも年齢をたずね返します。
    note: '*A pani?* は女性に丁寧に質問を返す言い方で、ユニット1で学んだ *A pan?* と同じ短いパターンです。'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: エヴァが年齢を答える
    gloss: エヴァは32歳だと言います。
    note: '*Trzydzieści dwa* は *dwa*(2)で終わるので、8で終わる *dwadzieścia osiem*(*lat* を取る)と違って、*lata* を取ります。2、3、4で終わる数(10代を除く)は、この別の複数形を使います。*lat* と *lata* は入れ替えられず、どちらが正しいかは数の最後の桁で決まります。'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: マレクが会話を締めくくる
    gloss: マレクは、お話しできてよかったと言って、別れのあいさつをします。
    note: '*Do zobaczenia* はユニット1で学んだ「また会いましょう」のあいさつです。'
