teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: 月曜日
    gloss: 月曜日
    note: ポーランドで週の最初の曜日とされる日です。
    example_gloss: 今日は月曜日です。
  pl.a1.unit03.lesson01.teach.wtorek:
    title: 火曜日
    gloss: 火曜日
    note: 要注意です。「火曜日に」と言うときは、*wtorek* の前に *w* ではなく *we* を使います。詳しくはこのレッスンの後半で説明します。
    example_gloss: 今日は火曜日です。
  pl.a1.unit03.lesson01.teach.sroda:
    title: 水曜日
    gloss: 水曜日
    note: 他の多くの曜日と違って、女性名詞です。
    example_gloss: 今日は水曜日です。
  pl.a1.unit03.lesson01.teach.czwartek:
    title: 木曜日
    gloss: 木曜日
    note: '*poniedziałek*、*wtorek*、*piątek* と同じ男性名詞のパターンです。'
    example_gloss: 今日は木曜日です。
  pl.a1.unit03.lesson01.teach.piatek:
    title: 金曜日
    gloss: 金曜日
    note: この単元の後半でまた出てきます。エヴァとマレクがもう一度会う約束をする日です。
    example_gloss: 今日は金曜日です。
  pl.a1.unit03.lesson01.teach.sobota:
    title: 土曜日
    gloss: 土曜日
    note: 週末の一日です。*weekend* という外来語も、ポーランドでは多くの人が使います。
    example_gloss: 今日は土曜日です。
  pl.a1.unit03.lesson01.teach.niedziela:
    title: 日曜日
    gloss: 日曜日
    note: このレッスンで学ぶ7つの曜日の最後です。
    example_gloss: 今日は日曜日です。
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: 曜日をたずねる
    gloss: 今日は何曜日ですか。
    note: 直接たずねる形です。*dzień tygodnia* は直訳すると「週の日」という意味です。
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: w と we の例外
    gloss: 月曜日に、木曜日に、金曜日に――ただし火曜日だけは(発音しやすくするため)別の形。
    note: ほとんどの曜日は「*w* + 曜日」で「〜曜日に」を表します。*Wtorek* だけは本当の例外で、*w wtorek* ではなく *we wtorek* と言います。理由は単に発音しやすいからです。誤植ではなく、本物の不規則です。
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: 金曜日に映画を見に行きます
    gloss: 金曜日に映画を見に行きます。
    note: '*Piątek* は *w* の後でも形が変わりません。形が変わるのは *środa*、*sobota*、*niedziela* だけです(A1では簡単にするため、このレッスンでは扱いません)。'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: 1月、2月、3月
    gloss: 1月;2月;3月
    note: '*Luty* は文法的に変わった語で、普通の名詞ではなく形容詞のように変化します(「2月に」の形は、この単元の後半で出てきます)。'
    example_gloss:
    - 私の誕生日は1月です。
    - 2月にワルシャワへ行きます。
    - 私の誕生日は3月です。
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: 4月、5月、6月
    gloss: 4月;5月;6月
    note: '*Maj* は、この単元のストーリーで二つの日付の両方に出てくる月です。'
    example_gloss:
    - 4月にワルシャワへ行きます。
    - 私の誕生日は5月です。
    - 6月にワルシャワへ行きます。
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: 7月、8月、9月
    gloss: 7月;8月;9月
    note: ここにも本物の不規則があります。「9月に」は *w wrześniu* ではなく *we wrześniu* です。*wtorek* で見たのと同じ、発音しやすくするための *we* です。
    example_gloss:
    - 7月は休暇中です。
    - 8月にワルシャワへ行きます。
    - 私の誕生日は9月です。
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: 10月、11月、12月
    gloss: 10月;11月;12月
    note: 一年の最後の3か月で、これで12か月がそろいます。
    example_gloss:
    - 10月にワルシャワへ行きます。
    - 私の誕生日は11月です。
    - 12月は休暇中です。
  pl.a1.unit03.lesson02.teach.urodziny:
    title: 誕生日
    gloss: 誕生日
    note: '*Urodziny* は、一人の人の一回の誕生日でも、ポーランド語では文法上つねに複数です。*są*(複数の「です」)と一緒に使い、*jest*(単数の「です」)は使いません。このレッスンの後半で、この点を練習します。'
    example_gloss: 私の誕生日は5月です。
  pl.a1.unit03.lesson02.teach.kiedy:
    title: いつ
    gloss: いつ
    note: いつかという時点をたずねるときの疑問詞です。
    example_gloss: 打ち合わせはいつですか。
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: 誕生日をたずねる
    gloss: 誕生日はいつですか？
    note: 複数の *urodziny* に合わせて、*jest* ではなく *są* を使います。*urodziny* のカードで示したパターンです。
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: 誕生日を伝える
    gloss: 私の誕生日は5月10日です。
    note: '*Dziesiątego maja* は、日が *-ego*、月が *-a* で終わり、前置詞はまったく付きません。これが特定の日付を言う標準的な形です。詳しい型は、このレッスンの後半の文法ノートで確認します。'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: 打ち合わせの日をたずねる
    gloss: 打ち合わせはいつですか。
    note: '*Spotkanie*(打ち合わせ、会うこと)は、第3課の会話でまた出てきます。'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: 打ち合わせの日を伝える
    gloss: 打ち合わせは5月15日です。
    note: '*dziesiątego maja* と同じ、*-ego* + *-a* の日付の型で、日の数字が違うだけです。'
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: ポーランド語の日付の言い方
    gloss: 日付:日は -ego、月は -a で終わる(ただし2月は lutego)。前置詞は付けない――5月10日、5月15日。
    note: 「金曜日に」(*w piątek*)は前置詞 *w* が必要ですが、特定の日付を言うときはまったく違い、前置詞は一切付けません。
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: また会おうと提案する
    gloss: 次はいつ会えますか。
    note: '*Znowu* は「再び」の意味で、もう一度会う日程を話し始めるときの自然な言い方です。'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: 男性に丁寧に金曜日の都合をたずねる
    gloss: 金曜日はご都合いかがですか。(男性に対して、丁寧な言い方)
    note: '*Panu* は *pan* の与格形です。*odpowiadać*(「都合がよい」)は、相手を表す語を必ず与格にします。例:*Piątek mi odpowiada.*(金曜日は私に都合がよいです)'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: 女性に丁寧に金曜日の都合をたずねる
    gloss: 金曜日はご都合いかがですか。(女性に対して、丁寧な言い方)
    note: 女性に丁寧に言うときは、*panu* を *pani* に替えます。*pani* は主格でも与格でも同じ形で、*pan*/*panu* のように変わりません。
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: 友達に金曜日の都合を聞く(くだけた言い方)
    gloss: 金曜日は都合がいい?
    note: 友達や同年代の人と話すときは、*panu*/*pani* の代わりに *ci* を使います。くだけた言い方の与格の「あなた」です。
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: 金曜日が都合がいいと伝える
    gloss: 金曜日は都合がいいです。
    note: '*Mi* は一人称の与格です。*panu*/*pani*/*ci* と同じ格のパターンで、「あなた」ではなく「私」を表します。'
  pl.a1.unit03.lesson03.teach.data:
    title: 日付
    gloss: 日付
    note: カレンダー上の日付を表す語です。data は「日付」の意味で、「データ(情報)」の意味ではありません。
    example_gloss: 何日になりますか?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: 何日になるかを尋ねる
    gloss: 何日になりますか?
    note: 曜日は決まったけれど、正確な日付はまだ決まっていないときに、自然に続けられる質問です。
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa がまた会おうと提案する
    gloss: Ewa が Marek に、いつまた会えるか尋ねます。
    note: このレッスンの最初の質問と全く同じ文です。
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek が丁寧に金曜日を提案する
    gloss: Marek が Ewa に、金曜日は都合がよいかを丁寧に尋ねます。
    note: 第1ユニットから続く丁寧な言い方で、Ewa に *pani* と呼びかけています。
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa が承諾して日付を尋ねる
    gloss: Ewa は金曜日で大丈夫だと答え、正確な日付を尋ねます。
    note: 第1ユニットで出てきた *Tak*(「はい」)で、Ewa の承諾が始まります。そのあとで正確な日付を尋ねます。
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek が日付を伝える
    gloss: Marek は5月15日だと言います。
    note: ここの2つの単語は、このユニットのレッスン2で既に学びました。
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa が確認して別れの挨拶をする
    gloss: Ewa は「すばらしい」と言い、5月15日に会いましょうと言います。
    note: '*Do zobaczenia* は第1ユニットの別れの挨拶で、ここでは具体的な日付と組み合わせています。'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek が会話を締めくくる
    gloss: Marek も別れの挨拶を返します。
    note: 最も短い締めくくりで、別れの挨拶だけです。
