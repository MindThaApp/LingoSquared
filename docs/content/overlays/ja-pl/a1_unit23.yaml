    title: レストランのレシートを読む
  pl.a1.unit23.lesson06.ewa_i_marek_placa:
    title: EwaとMarekが会計をする
teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: 合計金額をたずねる
    gloss: 合計でいくらですか?
    note: '*W sumie*(合計で)は、1つの値段ではなく全部を合わせた金額を知りたいことをはっきりさせます。'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: 合計金額を伝える
    gloss: 合計で100ズウォティです。
    note: '*Kosztuje* は *kosztować*(値段が~である)の *on/ona/ono* の形です。5以上の数は複数生格を取ります:*sto złotych*。'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: カードや現金で支払う
    gloss: カードで支払う、現金で支払う
    note: '*Płacić kartą*(カードで払う)も *płacić gotówką*(現金で払う)も、*płacić* の後に造格を使います:*kartą*、*gotówką*。'
    example_gloss:
    - ここでカードで支払えますか?
    - 現金で支払います。
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: カードが使えるかたずねる
    gloss: ここでカードで支払えますか?
    note: '*Tu*(ここで)は、今いる場所での支払いについての質問にします。*czy* はyes/noで答える質問を作り、*mogę* は「私はできる」という意味です。'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: 支払い方法の希望をたずねる
    gloss: 現金とカード、どちらでお支払いですか?
    note: '*Czy chce pan ...?* は *Czy chcesz ...?* の丁寧な形で、ここでは初対面のレジ係が使っています(男性には *pan*、女性には *pani*)。'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: お会計
    gloss: お会計
    note: 男性名詞です:*rachunek*(生格は *rachunku*)。
    example_gloss: 割り勘にしましょうか?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: 割り勘を提案する
    gloss: 割り勘にしましょうか?
    note: '*Może podzielimy ...?* は、一緒に何かをしようと丁寧に提案する言い方です。*podzielimy* は *podzielić* の *my* の形です。'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: 別々に支払いたいとたずねる
    gloss: 別々に支払ってもいいですか?
    note: '*Osobno*(別々に)は *zapłacić*(支払う、完了体:1回の支払いが終わること)と一緒に使います。'
  pl.a1.unit23.lesson04.teach.reszta:
    title: おつり
    gloss: おつり
    note: 女性名詞です:*reszta*(生格は *reszty*、*nie potrzebuję reszty* のように使います)。
    example_gloss: こちらがおつりです。
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: おつりを渡す
    gloss: こちらがおつりです。
    note: '*Pana* は丁寧な「あなたの」(男性に対して。女性には *pani*)で、カウンターでの丁寧な言い方に合っています。'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: おつりを断る
    gloss: おつりはいりません。
    note: '*Nie potrzebuję* + 生格:否定文では目的語が生格になるので、*reszty* となります。'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: '35'
    gloss: '35'
    note: '*Trzydzieści pięć* は2語で書きます。十の位が先、一の位が後です(30 + 5)。'
    example_gloss: 140ズウォティです。
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: レストランのお会計を読む
    gloss: お会計:メインディッシュ2つとコーヒー2杯。合計:140ズウォティ。カードで支払い済み。
    note: 注文した物、合計金額、支払い方法に注目しましょう。
    glosses:
      Rachunek: お会計
      dwa: '2'
      dania: メインディッシュ (dania główne)
      kawy: コーヒー
      Razem: 合計
      złotych: ズウォティ
      Zapłacono: 支払い済み
      kartą: カード
      sto: 百
      czterdzieści: '40'
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewaが会計を頼む
    gloss: 'Ewa: お会計をお願いしませんか?'
    note: '*Poprosić o*(~を頼む)の後は対格が来ます:*o rachunek*。*Poprosimy* は完了体の未来です。'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marekが合計を尋ねる
    gloss: 'Marek: ええ、いい考えですね。合計でいくらですか?'
    note: レッスン1の *Ile to kosztuje w sumie?* という質問をもう一度使っています。
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewaが合計を伝える
    gloss: 'Ewa: 140ズウォティです。割り勘にしますか?'
    note: '*Podzielimy się?*(直訳:「分けましょうか?」)は再帰の *się* を使って、会計を分け合うことを表します。'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marekは自分が払うと言い張る
    gloss: 'Marek: いいえ、今日は私が払います。とても助けてもらいましたから。'
    note: '*Dzisiaj ja płacę*(直訳:「今日は私が払う」)は、支払いを申し出るときの決まった言い方です。*pomogłaś* は *pomóc*(助ける)の女性形の過去で、MarekがEwaに話しているためです。'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewaは感激している
    gloss: 'エヴァ: ご親切にありがとうございます。'
    note: '*Miło z twojej strony*(ご親切に)は、気前のよい行いに対してよく使われる温かい褒め言葉です。*z* + 生格で *z twojej strony* となります。'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: マレクがカード払いについてたずねる
    gloss: 'マレク: ここでカードで払えますか?'
    note: レッスン2の *Czy mogę tu zapłacić kartą?* という質問を、今度は実際のレストランで使います。
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: 三人称単数の形'
    gloss: マレクが会計を払います。
    note: '*Płaci* は *płacić*(払う)の *on/ona/ono* の形です。'
