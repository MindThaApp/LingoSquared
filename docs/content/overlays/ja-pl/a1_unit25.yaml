teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Wysoki* は背が高い人、*niski* は背が低い人を表します。女性の場合は *wysoka* や *niska* になります。'
    example_gloss:
    - カシャは背が高いです。
    - トメクは背が低いです。
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: ここでの *stary* と *młody* は、正確な年数ではなく、全体的な印象を表します。
    example_gloss:
    - おじいさんは年を取っています。
    - マレクは若いです。
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: Stary:印象か年齢か
    gloss: '*Stary* は *Dziadek jest stary* のように、全体的な印象を表します。正確な年齢を言うときは、ポーランド語では別の構文を使います:*Ile masz lat?*'
    note: 見た目の年齢の印象は *stary* や *młody* で表します。正確な年齢は *Ile masz lat?* と尋ね、*mam ... lat*(私は…歳です)と答えます。
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: カシアは背が高く、トメクは背が低い
    gloss: カシアは背が高く、トメクは背が低いです。
    note: 対比の *a*(一方で)を使った簡単な複文です。*Wysoka* と *niski* は、女性の主語と男性の主語にそれぞれ合わせた形で、レッスン5の比較につながります。
  pl.a1.unit25.lesson02.teach.wlosy:
    title: 髪
    gloss: 髪
    note: '*Włosy* はポーランド語では常に複数形です:*długie włosy*(長い髪)。'
    example_gloss: マレクは短い黒髪です。
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の色を表す3つの語です。*Blond* は形が変わりません。*brązowe* と *siwe* は *włosy* に合わせた複数形です。
    example_gloss:
    - エヴァは金髪です。
    - トメクは茶色の髪です。
    - おじいさんは白髪です。
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Długie*(長い)と *krótkie*(短い)は、*włosy* に合わせた複数形です。'
    example_gloss:
    - カシアは髪が長いです。
    - トメクは髪が短いです。
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy には複数形の形容詞
    gloss: '*Włosy* は複数形なので、形容詞も複数形になります:長い髪、短い髪、茶色の髪、黒い髪。'
    note: 男性人称ではない複数名詞には、*-e* で終わる形容詞がつきます:*długie włosy*。*Blond* は例外で、形が変わりません(*blond włosy*)。
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: Włosy:常に複数形
    gloss: '*Włosy*(髪)は常に複数形です:*jej włosy są długie*(彼女の髪は長い。直訳は「彼女の髪たちは長い」)。*Jej* は「彼女の」という意味です。'
    note: ポーランド語では「髪」は複数名詞なので、動詞や形容詞も複数形に合わせます。*Jej*(「彼女の」)は、持ち物がいくつあっても形が変わりません。
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: マレクは短い黒髪です
    gloss: マレクは短い黒髪です。
    note: '*Czarne*(黒い)は *włosy* に合わせた複数形です。'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: エヴァは長い金髪です
    gloss: エヴァは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  pl.a1.unit25.lesson03.teach.oczy:
    title: 目
    gloss: 目
    note: '*Oczy* は *oko* の複数形です。ポーランド語では、両目をまとめて複数形で言うのが普通です。'
    example_gloss: マレクは茶色の目をしています。
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: 目の色を表す3つの語で、*oczy* に合わせた複数形です:*niebieskie*、*brązowe*、*zielone*。
    example_gloss:
    - エヴァは青い目をしています。
    - トメクは茶色の目をしています。
    - カシャは緑の目をしています。
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy には -e
    gloss: '*Oczy* は複数形なので、形容詞は *-e* で終わります:青い目、茶色の目、緑の目。'
    note: レッスン2の *włosy* と同じ複数形の語尾です:*niebieskie oczy*、*brązowe oczy*、*zielone oczy*。
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: エヴァはどんな外見ですか?
    gloss: エヴァはどんな外見ですか?
    note: '*Jak wygląda ...?* はこのユニットの中心となる質問です。誰かの外見をたずねるときに使い回せます。'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: エヴァは長い金髪で青い目です
    gloss: エヴァは長い金髪で、青い目をしています。
    note: 髪と目を *i*(そして)で1文にまとめた答えの見本です。
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: エヴァがニナを紹介する
    gloss: エヴァ:語学カフェに新しい女の子が来るの。名前はニナよ。
    note: '*Przychodzi*(来る)は、新しい人を場面に登場させる言い方です。*do kawiarni językowej* は *do* + 生格を使っています。'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: マレクが外見をたずねる
    gloss: マレク:そうなんだ!どんな外見の子?
    note: このユニットの中心となる質問を、名前の代わりに *ona*(彼女)を使って再び使っています。
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: エヴァがニナの身長と髪を説明する
    gloss: エヴァ:背が低くて、短い金髪よ。
    note: レッスン1の *niska*(*niski* の女性形)と、レッスン2の髪の語彙を組み合わせています。
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: マレクが目についてたずねる
    gloss: マレク:目は?
    note: ここでの *jej* は「彼女の」という所有を表す語で、*jej oczy* は「彼女の目」の意味です。*Jej* は形が変わりません。
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: エヴァがニナの目を説明する
    gloss: エヴァ:緑の目をしているわ。
    note: レッスン3の *zielone oczy* をもう一度使っています。
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: マレクは彼女を見分けられる
    gloss: マレク:ありがとう!それなら見分けられるよ。
    note: '*Rozpoznam* は完了体の未来形(「見分けるだろう」)です。*ją* は *ona*(彼女)の対格です。'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: トメクとカシャを比べる
    gloss: トメクとカシアは兄妹ですが、見た目が違います。トメクは背が低く、短い茶色の髪と茶色の目をしています。カシアはトメクより背が高く、長い茶色の髪と緑の目をしています。あなたはどんな外見ですか?
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      brat: 兄弟
      siostra: 姉妹
      wyglądają: ～に見える
      inaczej: 異なる
      niski: 背が低い
      krótkie: 背が低い
      brązowe: 茶色の
      włosy: 髪
      oczy: 目
      wyższa: より背が高い
      długie: 長い
      zielone: 緑色の
      wyglądasz: あなたは(…な)外見だ(くだけた言い方・見た目について)
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: 比較級をもう一度使う
    gloss: 比較級:*wysoki*(背が高い)は *wyższy*(より背が高い)になり、比べる相手は *niż*(〜より)の後に置きます:カシアはトメクより背が高いです。
    note: ポーランド語では形容詞の語尾を変えて比較級を作り、性にも一致します。カシア(女性)には *wyższa* を使います。
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: カシアはトメクより髪が長い
    gloss: カシアはトメクより髪が長いです。
    note: '*Dłuższe*(より長い)は *włosy* に合わせた複数形で、*niż*(〜より)が比較の相手を導きます。'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*Mam ...* を使った一人称の文の見本で、自分の外見を説明するときにそのまま使えます。'
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: マレクがニナを見つける
    gloss: マレク:見て、あれがニナ?短い金髪で緑の目だよ。
    note: '*Patrz*(見て)は *patrzeć* の命令形です。*Czy to Nina?* は「あれはニナ?」とたずねる文です。'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: エヴァが確認する
    gloss: エヴァ:ええ、ニナよ!
    note: 短く自然に、そうだと伝える表現です。
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: ニナがマレクにあいさつする
    gloss: ニナ:こんにちは、マレクですか?
    note: くだけた簡単なあいさつの質問です。*być* の後では名前は造格になります:*jesteś Markiem?*
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: マレクがあいさつを返す
    gloss: マレク:はい!はじめまして、ニナ。
    note: '*Miło cię poznać* は初対面の定番のあいさつです(「はじめまして」。*poznać* は「知り合う」の意味)。ニナへの呼びかけは呼格になります:*Nino*。'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 対話の締めくくりです。マレクはエヴァの説明のおかげで、ニナを見分けられました。
