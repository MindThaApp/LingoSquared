teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: パン
    gloss: パン
    note: 基本的な主食の単語で、どんな食事でもしょっちゅう出てきます。
    example_gloss: これはパンです。
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: バター、チーズ
    gloss: バター;チーズ
    note: 前者は中性名詞、後者は男性名詞(無生物)です。どちらも、この課の文法ノートにあるように proszę o の後で語尾が変わりません。
    example_gloss:
    - これはバターです。
    - これはチーズです。
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: 水、牛乳
    gloss: 水;牛乳
    note: Woda は女性名詞です(対格の wodę はこの課の文法ノートに出てきます)。mleko は中性名詞で、形は変わりません。
    example_gloss:
    - これは水です。
    - これは牛乳です。
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: コーヒー、紅茶
    gloss: コーヒー;紅茶
    note: どちらも女性名詞です。注文するときに実際に言うのは対格の kawę/herbatę で、この課の文法ノートで扱います。
    example_gloss:
    - これはコーヒーです。
    - これは紅茶です。
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 注文する:proszę o + 対格
    gloss: 〜をください + 対格:コーヒー -> kawę、紅茶 -> herbatę、水 -> wodę。パン、チーズ、牛乳は変わりません。
    note: '*Proszę o*(「〜をください」、直訳は「〜を頼みます」)の後には対格が来ます。*kawa*、*herbata*、*woda* のような女性名詞は、語末の *-a* が *-ę* に変わります。*chleb* や *ser* のような男性名詞(無生物)や、*mleko* のような中性名詞は、辞書の形のまま変わりません。'
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: コーヒーをお願いします
    gloss: コーヒーをお願いします。
    note: 一品を注文するときの、日常的で丁寧な言い方です。文法ノートのパターンを、完全な依頼の文で使います。
  pl.a1.unit06.lesson02.teach.zupa:
    title: スープ
    gloss: スープ
    note: 昼食や夕食の定番で、この単元のレストランの場面のように、日替わり料理になることもよくあります。
    example_gloss: これはスープです。
  pl.a1.unit06.lesson02.teach.sok:
    title: ジュース
    gloss: ジュース
    note: chleb や ser と同じ男性名詞(無生物)なので、注文するときに語尾は変わりません。
    example_gloss: これはジュースです。
  pl.a1.unit06.lesson02.teach.cukier:
    title: 砂糖
    gloss: 砂糖
    note: コーヒーや紅茶に使えます。これも男性名詞(無生物)で、語尾は変わりません。
    example_gloss: これは砂糖です。
  pl.a1.unit06.lesson02.teach.rachunek:
    title: お会計
    gloss: お会計
    note: 食事の最後に頼むものです。proszę o rachunek は、丁寧で標準的な頼み方です。
    example_gloss: お会計をお願いします。
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 好む:lubię, lubi
    gloss: 好む:私は好きです、彼/彼女は好きです -- コーヒーが好きです。彼はスープが好きです。
    note: '*Lubić* は「好む、好きだ」という意味の動詞です。ここで学ぶのは一人称(*lubię*)と三人称(*lubi*)の形だけです。*Lubić* も *proszę o* と同じく対格を取ります。*lubię kawę* であって、*lubię kawa* ではありません。'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: スープが好きです
    gloss: スープが好きです。
    note: Zupa は対格で zupę になります。第1課の文法ノートと同じ、女性名詞の -a -> -ę の変化です。
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: 日替わり料理
    gloss: 日替わり料理はスープです。
    note: '*Dnia* は *dzień*(日)の生格です。*danie dnia* は直訳すると「その日の料理」で、メニューにもよくある決まった言い方です。'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: おすすめする:polecam, poleca
    gloss: おすすめする:私はおすすめします、彼/彼女はおすすめします -- コーヒーをおすすめします。彼はスープをおすすめします。
    note: '*Polecać* は「おすすめする」という意味の動詞です。店員が料理を勧めるときに使い、客がおすすめを尋ねるときも同じ動詞を使います。これも *proszę o* や *lubić* と同じく対格を取ります。'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: おすすめは何ですか?
    gloss: おすすめは何ですか?
    note: '*Co*(何)に、丁寧な呼びかけの *pan* が付いた形です。第1単元と同じ丁寧な呼びかけで、店員に尋ねるのに自然な質問です。'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: どうぞ/どういたしまして
    gloss: どうぞ。
    note: 日常的で幅広く使える表現です。何かを出すときに言い、dziękuję(ありがとう)への返事としても自然です。
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: すぐお持ちします
    gloss: すぐお持ちします。
    note: 直訳は「もう出しています」で、注文を受けたことを伝える店員の決まった返事です。
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: 店員が日替わり料理を告げる
    gloss: 店員があいさつをして、今日の日替わり料理はスープだと告げます。
    note: Dzień dobry は、第1単元のあいさつで学んだ表現です。
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: エヴァがおすすめを尋ねる
    gloss: エヴァが店員に、おすすめは何かを尋ねます。
    note: 丁寧な質問です。pan で店員に敬意を込めて呼びかけています。
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: 店員がコーヒーをすすめる
    gloss: 店員がコーヒーをすすめます。
    note: Polecam は、この課の文法ノートで学んだ一人称の形です。
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: エヴァが注文する
    gloss: エヴァは「わかりました」と言って、コーヒーとスープを注文します。
    note: proszę o に、家族の単元で学んだ「と」を表す i をつなげています。第1課の注文のパターンと、第2課のスープの語彙をあわせて使います。
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: 店員が確認する
    gloss: 店員が、すぐお持ちしますと言います。
    note: 料理が来る前の、短くて自然な確認の返事です。
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: エヴァがお会計を頼む
    gloss: エヴァはお礼を言って、お会計を頼みます。
    note: 第1単元の dziękuję と、第2課の proszę o + rachunek を使っています。
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: 店員が会計を渡す
    gloss: 店員が「どうぞ」と言います。
    note: この課の前半で学んだ proszę bardzo が、ここでは会計を手渡すときの言葉として使われています。
