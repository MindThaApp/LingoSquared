teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: うれしい、悲しい、怒っている
    gloss: うれしい、悲しい、怒っている
    note: '*jestem*(私は〜です)と一緒に使う、基本的な感情を表す3つの言葉です。これらは男性形で、女性は *szczęśliwa, smutna, zła* と言います。'
    example_gloss:
    - 私はうれしいです。
    - 私は悲しいです。
    - 私は怒っています。
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: うれしいと言う
    gloss: 私はうれしいです。
    note: '*Jestem*(私は〜です、*być* の形)+形容詞が基本の形で、日本語の「私は〜です」に似ています。形容詞は話す人に合わせます：*szczęśliwy*(男性)、*szczęśliwa*(女性)。'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: 気持ちを対比させる
    gloss: 私は怒っていません、悲しいんです。
    note: '*Nie* は動詞のすぐ前に置きます：*Nie jestem zły*。2つ目の文で、本当の気持ちを述べています。'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: 理由をたずねる
    gloss: どうしてうれしいの？
    note: '*Dlaczego*(なぜ)は、理由をたずねるときの基本の疑問詞です。'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: 理由を言う
    gloss: 新しいアパートがあるので、私はうれしいです。
    note: '*Bo*(なぜなら)は理由を導きます。*mam*(私は持っている)の後ろでは、名詞は対格になります：*nowe mieszkanie*。'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: よくない理由
    gloss: 雨が降っているので、私は悲しいです。
    note: '*Pada deszcz*(雨が降っている、直訳は「雨が落ちる」)は天気を表す普通の言い方で、ここでは理由として使われています。'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: 緊張している
    gloss: 緊張している
    note: 緊張を表す基本的な言葉です。
    example_gloss: 初めてのシフトの前で、私は緊張しています。
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: 何に緊張しているかを言う
    gloss: 初めてのシフトの前で、私は緊張しています。
    note: '*Przed*(直訳は「〜の前に」)+造格で、何について緊張しているのかを表します：*przed pierwszą zmianą*。日本語の「〜について」「〜を前に」にあたる言い方です。'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: 相手を安心させる
    gloss: 心配しないで。
    note: '*Nie martw się*(直訳は「自分を心配させないで」)は、相手を安心させる基本のフレーズです。*się* は再帰代名詞です。'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: 相手の気持ちをたずねる
    gloss: マレクはどう感じていますか？
    note: '*Czuć się*(感じる、再帰動詞)は、気持ちの状態をたずねたり述べたりする基本の言い方です：*Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: 人の気持ちを説明する
    gloss: 彼は緊張しています。
    note: '*Się* は動詞と一緒に置きます：*on czuje się*。形容詞は *on* に合わせて男性形になります：*zdenerwowany*。'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: 人がなぜそう感じるのかをたずねる
    gloss: なぜ彼は緊張しているのですか。
    note: '*dlaczego*(なぜ)と、*On czuje się zdenerwowany* の *czuje się* の形を組み合わせた文です。'
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: 気持ちについてのメッセージを読む
    gloss: こんにちは、エヴァ。初めて一人でするシフトの前で、少し緊張しています。でも、新しい仕事と新しいアパートがあるので、うれしくもあります。きっとうまくいくと思います。
    note: 書き手が何に緊張しているか、何がうれしいのか、全体としてどう見通しているかをつかみましょう。
    glosses:
      trochę: 少し
      zdenerwowany: 緊張している
      pierwszą: 最初の
      zmianą: シフト
      samodzielną: ひとりで
      szczęśliwy: うれしい
      bo: なぜなら
      nową: 新しい
      pracę: 仕事
      nowe: 新しい
      mieszkanie: アパート
      myślę: 思う
      będzie: うまくいく
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: エヴァがマレクの気持ちをたずねる
    gloss: エヴァ：こんにちは、マレク。初めてのシフトの前で、気分はどう？
    note: '*Przed pierwszą zmianą*(初めてのシフトを前に)は、第3課の *przed* +造格の型をもう一度使っています。*Czujesz się* は *ty* の形です。'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: マレクが緊張していると打ち明ける
    gloss: マレク：正直に言うと、少し緊張しています。
    note: '*Szczerze mówiąc*(正直に言うと、直訳は「率直に言えば」)は、打ち明ける気持ちをやわらげます。'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: エヴァが励ます
    gloss: エヴァ：心配しないで、きっとうまくやれるよ！
    note: '*Dobrze sobie poradzisz*(直訳は「うまく対処するだろう」)は、励ましの決まり文句です。*poradzisz* は *poradzić sobie* の *ty* の未来形です。'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: マレクがお礼を言う
    gloss: マレク：ありがとう、本当に助かるよ。
    note: '*Pomaga* は *pomagać*(助ける)の *on/ona/ono* の形です。*dzięki* はくだけた「ありがとう」です。'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: エヴァが結果を予想する
    gloss: エヴァ：そのあとは、きっととてもうれしくて誇らしい気持ちになるよ。
    note: '*Na pewno*(きっと)は、自信を持った予想を表します。*dumny*(誇らしい)は新しい便利な形容詞です。*Będziesz* は *być* の未来形です。'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: マレクが同意する
    gloss: マレク：うん、僕もそう思う。
    note: '*Ja też tak myślę*(直訳「私もそう思います」)は、同意を表す自然な言い方です。ここでは対比のために *ja* が加えられています。'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: jest と mu でまとめる
    gloss: マレクは初めてのシフトの前で緊張しています。エヴァは彼を助けます。
    note: '*Jest* は *być*(~である)の *on/ona* の形です。*mu* は「彼に」の意味です(*pomagać* は与格を取るため与格です)。小さな語ですが、他の人について話すときに欠かせません。'
