teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: 私はエンジニアです/教師です
    gloss: 私はエンジニアです。私は教師です。――'inżynier' と 'nauczycielka' は 'Jestem' の後で語尾が変わります。
    note: このコースで、職業を表すときに語の語尾が変わるのは初めてです。今のところ、この二つの職業の単語だけに当てはまります。
  pl.a1.unit17.lesson01.teach.inzynier:
    title: エンジニア
    gloss: エンジニア
    note: 日常のポーランド語では、この語は女性に対しても普通は *inżynier* のままです。
    example_gloss: マレクはエンジニアです。
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: 先生
    gloss: 先生(男性)/先生(女性)
    note: '*inżynier* と違って、この職業を表す語は性によって形が変わります。男性は *nauczyciel*、女性は *nauczycielka* です。'
    example_gloss:
    - 彼は先生です。
    - エヴァは先生です。
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: マレクとエヴァ、もう一度
    gloss: Marek、Ewa -- これまでのレッスンで、この名前はもう知っていますね。
    note: このレッスンでは両方の名前を使うので、簡単におさらいしましょう。
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: 「です・ある」、もう一度
    gloss: Jest -- この語は、これまでのレッスンで「Dom jest tam」(家はあそこにあります)のようにもう出てきましたね。
    note: このレッスンでは人の職業を言うときにも使うので、簡単におさらいしましょう。
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: マレクの仕事
    gloss: マレクはエンジニアです。
    note: このユニット全体で、マレクについてこの事実を土台にします。
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: エヴァの仕事
    gloss: エヴァは先生です。
    note: このユニット全体で、エヴァについてこの事実を土台にします。
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: 働く -- あなたは働く
    gloss: Pracować(pracuję はこれまでのレッスンでもう知っていますね):pracuję(私)、pracujesz(あなた)。あなたはどこで働いていますか?
    note: 今のところ形は二つだけです。自分のことは *pracuję*、相手にたずねるときは *pracujesz* です。前のユニットの *czuć się* と同じ型です。
  pl.a1.unit17.lesson02.teach.szkola:
    title: 学校
    gloss: 学校
    note: エヴァのような先生が働く場所です。
    example_gloss: 私は学校で働いています。
  pl.a1.unit17.lesson02.teach.biuro:
    title: 事務所
    gloss: オフィス
    note: マレクのようなエンジニアが働く場所です。
    example_gloss: 私は事務所で働いています。
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: 学校で、事務所で
    gloss: W + 職場:w szkole、w biurze -- w Warszawie や w Krakowie と同じ型です。
    note: すでに習った都市名（*w Warszawie*、*w Krakowie*）と同じ考え方です。場所を*〜で・〜に*と表すために、語尾が少し変わります。
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: どこで働いていますか?
    gloss: どこで働いていますか?
    note: 相手の仕事についてたずねるときの自然な質問です。
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: 「あなたは?」、もう一度
    gloss: A ty -- この表現は、これまでのレッスンでもう知っていますね。
    note: このレッスンの会話の前に、簡単におさらいしましょう。
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: マレクがエヴァに仕事をたずねる
    gloss: エヴァ、あなたはどこで働いていますか?
    note: マレクは直接の質問で会話を始めます。
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: エヴァが答える
    gloss: 私は学校で働いています。先生です。
    note: エヴァは職場と職業の両方を言います。このユニットで先に出てきた内容と同じです。
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: エヴァがマレクにたずね返す
    gloss: あなたは、マレク?どこで働いていますか?
    note: エヴァは同じ質問をマレクに返します。
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: マレクが答える
    gloss: 私は事務所で働いています。エンジニアです。
    note: マレクは職場と職業の両方を言います。このユニットで先に出てきた内容と同じです。
