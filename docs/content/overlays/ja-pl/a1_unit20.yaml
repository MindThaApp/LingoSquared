teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: ~です、~があります、これは、~をください -- もう一度
    gloss: Jest、są、To、Poproszę、Ile、kosztuje、złotych、chcę、do -- これまでのレッスンですでに習った単語です。
    note: このレッスンで服の買い物の話に使う前に、簡単におさらいします。
  pl.a1.unit20.lesson01.teach.sklep:
    title: 店
    gloss: 店
    note: お店を表す一般的な語です。
    example_gloss: 店に行きます。
  pl.a1.unit20.lesson01.teach.koszula:
    title: シャツ
    gloss: シャツ
    note: 女性名詞です。形容詞も女性形になります。
    example_gloss: これはシャツです。
  pl.a1.unit20.lesson01.teach.spodnie:
    title: ズボン
    gloss: ズボン
    note: 1本でもポーランド語では常に複数形で、単数形はありません。
    example_gloss: これはズボンです。
  pl.a1.unit20.lesson01.teach.kupic:
    title: 買う
    gloss: 買う
    note: '*chcę*(~したい)の後に使います。前のレッスンの *iść*(行く)と同じです。*chcę kupić* は「買いたい」という意味です。'
    example_gloss: シャツを買いたいです。
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: ズボンを買いたいです
    gloss: ズボンを買いたいです。
    note: chcę + 不定詞の同じ型を、ズボンに使った文です。
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: シャツはいくらですか？
    gloss: シャツはいくらですか？
    note: 特定の商品の値段をたずねる自然な言い方で、買い物のレッスンで習った *Ile kosztuje* を使います。
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: どんな -- 男性形
    gloss: '*Jaki*、*Jaka* -- Jaki は男性名詞について、*Jaka* は女性名詞についてたずねる語です(Jaka は天気のレッスンですでに習いました)。'
    note: '*Kolor*(色)は男性名詞なので、*Jaka* ではなく *Jaki* と組み合わせます。'
  pl.a1.unit20.lesson02.teach.kolor:
    title: 色
    gloss: 色
    note: 男性名詞です。
    example_gloss: 何色ですか？
  pl.a1.unit20.lesson02.teach.sukienka:
    title: ワンピース
    gloss: ワンピース
    note: '*koszula* と同じく、女性名詞です。'
    example_gloss: これはワンピースです。
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: 青い
    gloss: Koszula jest niebieska. -- *niebieska* は *koszula* のような女性名詞に合う形です。
    note: この形だけを扱います。このコースではここまで *koszula* と組み合わせて使います。
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: 赤
    gloss: Sukienka jest czerwona. -- *czerwona* も *niebieska* と同じく、女性名詞に合う形です。
    note: この形はここでは *sukienka* と組み合わせます。*niebieska* が *koszula* と組み合わさっているのと同じです。
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: シャツは青いです
    gloss: シャツは青いです。
    note: このユニットの後半で、マレクがシャツを買う場面で再び使う文です。
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: ワンピースは赤いです
    gloss: ワンピースは赤いです。
    note: jest + 色の同じ型を、別の品物に使います。
  pl.a1.unit20.lesson03.teach.recap_words:
    title: こんにちは、どうぞ、とても -- もう一度
    gloss: Dzień、dobry、Proszę、bardzo、i、Dobrze、Co -- これまでのレッスンですでに習った単語です。
    note: このレッスンの店での会話の前に、簡単におさらいします。
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: サイズ
    gloss: サイズ
    note: ポーランドの服のサイズは、たいていSやMやLのようにアルファベットで表します。日本でも同じです。
    example_gloss: サイズはいくつですか？
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: 男性への呼びかけ、ほしい
    gloss: Co pan chce kupić? -- *pan* は男性への丁寧な呼びかけで、女性への *pani* にあたります(*pani* は買い物のレッスンですでに習いました)。
    note: '*chce* は *chcieć* の三人称単数の形です。*chcę*(私は~したい)と *chcesz*(あなたは~したい)はすでに習いました。'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: 何をお買い求めですか？
    gloss: 何をお買い求めですか？
    note: 店員が男性のお客さんに丁寧に声をかける言い方です。
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: 店員がマレクにあいさつする
    gloss: こんにちは！何をお買い求めですか？
    note: Sprzedawca(店員)は、前の買い物のユニットで市場の店主が使ったのと同じ丁寧な言い方で話し始めます。
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: マレクが欲しいものを伝える
    gloss: シャツとズボンを買いたいです。
    note: マレクは、買いたい2つの品物を両方伝えています。
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: 店員がサイズをたずねる
    gloss: サイズはいくつですか？
    note: 短くて自然な、続けてたずねる質問です。
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: マレクがサイズを答える
    gloss: Mサイズです。
    note: マレクはサイズの文字だけで答えます。これが自然な答え方です。
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: 店員が在庫と値段を伝える
    gloss: 青いシャツとズボンがございます。合わせて100ズウォティです。
    note: '*Mamy* は「私たちは持っている」という意味です(*mam*/*masz* の仲間です)。この後ろで、*koszula* は *koszulę* に、*niebieska* は *niebieską* に変わります。*Chcę kupić koszulę* で見たのと同じ変化です。色は第2課の青いシャツとつながっています。'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: マレクが承諾する
    gloss: はい、それをお願いします。
    note: マレクは購入を確認して、やり取りを締めくくります。
