teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: 起きる、(私は)起きます
    gloss: 起きる;(私は)起きます
    note: Wstawać は不定詞(辞書の形)で、wstaję は自分の日課を話すときによく使う一人称の形です。
    example_gloss: 私は朝7時に起きます。
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: 食べる、(私は)食べます
    gloss: 食べる;(私は)食べます
    note: Jeść は少し不規則ですが、jem(「私は食べます」)が一番よく使う形です。ポーランド人はどの食事でもこの形で「食べる」と言います。
    example_gloss: 私は朝、朝食を食べます。
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: 朝食
    gloss: 朝食
    note: Śniadanie は jem の後でも形が変わりません。「朝食を食べます」は jem śniadanie で、覚える語尾はありません。
    example_gloss: 朝、私は朝食を食べます。
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: 飲む、(私は)飲みます
    gloss: 飲む;(私は)飲みます
    note: Pić は不定詞で、piję は一人称の形です。jem や wstaję と同じように使います。
    example_gloss: 私は朝にコーヒーを飲みます。
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: 自分について話す
    gloss: Wstaję, jem, piję -- この章では自分のことだけを、一人称(私)で話します。自分の一日を説明するときと同じです。
    note: この章ではどの動詞も意図的に「私」の形だけを使います。*wstaję*(起きます)、*jem*(食べます)、*piję*(飲みます)です。「あなた」「彼」「彼女」の形を同時に覚えなくても、自分の日課を話すことに集中できます。
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: 私は朝7時に起きます
    gloss: 私は朝7時に起きます。
    note: 文法ノートのパターンの実践です。o + 時刻の前置格の形(siódmej)で、その時刻に、という意味になります。前の時刻の章と同じです。
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: 私は朝食を食べて、コーヒーを飲みます
    gloss: 私は朝食を食べて、コーヒーを飲みます。
    note: 一人称の動詞二つを i(〜と、そして)でつないでいます。朝の行動を並べる自然な言い方です。
  pl.a1.unit10.lesson02.teach.obiad:
    title: 昼食
    gloss: 昼食/昼ごはん
    note: śniadanie と同じく、obiad も jem の後で形が変わりません。jem obiad は「昼食を食べます」という意味です。
    example_gloss: 私は正午に昼食を食べます。
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: 働く、(私は)働きます
    gloss: 働く;(私は)働きます
    note: Pracować は、買い物の章の kosztować → kosztuje と同じ -ować → -uję のパターンです。今回は一人称です。
    example_gloss: 私は午後に働きます。
  pl.a1.unit10.lesson02.teach.dom:
    title: 住まい
    gloss: 家/自宅
    note: 「家」を表す日常的な語で、「家に帰る」という表現でよく出てきます。
    example_gloss: 家はあそこです。
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: 家へ
    gloss: 家へ -- do の後は生格を使い、dom の生格は語尾が -u の domu になります。bank → banku、park → parku、hotel → hotelu と同じパターンです。
    note: '*Do domu*(「家へ」「家に帰る」)は、bank、hotel、park で習った *do* の後の生格語尾 *-u* と同じです。同じパターンの名詞がもう一つ増えました。'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: 戻る、(私は)戻ります
    gloss: 戻る/帰る;(私は)戻ります/帰ります
    note: do domu と一緒に使って「家に帰ります」と言います。ポーランド語で最もよく使う日常表現の一つです。
    example_gloss: 私は夜、家に帰ります。
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: 正午に、午後に、夕方に
    gloss: 正午に;午後に;夕方に
    note: 前の時間の章の復習です。rano(朝)や w nocy(夜に)と合わせて、一日の時間帯をすべて言えます。
    example_gloss:
    - 私は正午に昼食を食べます。
    - 私は午後に働きます。
    - 私は夕方に家に帰ります。
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: 私は午後に働いて、それから家に帰ります
    gloss: 私は午後に働いて、それから家に帰ります。
    note: 道案内の章で習った、コンマ + potem(それから)でつなぐパターンです。今回は一日の流れの二つの部分をつないでいます。
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: 寝る、(私は)寝ます
    gloss: 寝る;(私は)寝ます
    note: Śpię は不定詞 spać から母音が変わる不規則な形に見えますが、とてもよく使う動詞なので、そのまま覚えましょう。
    example_gloss: 私は夜中に眠ります。
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: あなたは?私もです。
    gloss: あなたは?/私も。
    note: A ty? は会話を相手に返す簡単な言い方で、ja też は「私も」という意味です。どちらも日常の雑談でよく使います。
    example_gloss: 私も朝、朝食を食べます。
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: でも、お茶、〜ない
    gloss: でも;お茶(目的語の形);〜ない
    note: Ale は対比を導入します。nie が動詞ではなく語の直前にあると「〜ではなく」の意味になります。piję herbatę, nie kawę は「コーヒーではなく紅茶を飲みます」です。
    example_gloss: 私はお茶を飲みますが、コーヒーは飲みません。
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: 早く、10時に
    gloss: 早く;10時に -- 前の課の czwartej、siódmej と同じ、o の後の時刻の -ej 語尾です。
    note: '*O dziesiątej*(「10時に」)は、すでに習った時刻のパターンと同じです。*o* の後で *dziesiąta* が *dziesiątej* になります。*czwarta* → *czwartej*、*siódma* → *siódmej* と同じです。'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: エヴァが朝のことを話す
    gloss: エヴァは、朝7時に起きてコーヒーを飲むと言っています。
    note: この章で最初に習った文型を、実際の会話の中で使っています。
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: エヴァが一日の続きを話す
    gloss: エヴァは、朝食を食べて、それから午後に働くと言っています。
    note: 第2課と同じ potem で、一人称の行動を二つつないでいます。
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: エヴァが話し終えて、マレクにたずねる
    gloss: エヴァは、夕方に家に帰ると言っています。あなたは?
    note: A ty? は、新しい疑問文の文法を使わずに、マレクに話を渡しています。
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: マレクが自分の朝を話す
    gloss: マレクは、自分も7時に起きると言っています!でも、コーヒーではなく紅茶を飲みます。
    note: Ja też で起きる時刻が同じだと伝えてから、飲み物については ale...nie で対比しています。
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: マレクが自分の一日を話す
    gloss: マレクは、朝に働いて、それから正午に昼食を食べると言っています。
    note: エヴァとは違う一日の順番です。先に仕事をして、それから昼食をとります。
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: マレクが睡眠について話す
    gloss: マレクは、早く、夜10時に寝ると言っています。
    note: 新しい動詞 spać/śpię と、この課で復習した時刻のパターンで会話を締めくくります。
