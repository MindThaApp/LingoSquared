teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: どんな、です、今日、〜ない：復習
    gloss: Jaka, jest, Dziś, nie -- これらの語は前のレッスンで学びました。
    note: 天気の話をする前に、さっと復習しましょう。
  pl.a1.unit19.lesson01.teach.pogoda:
    title: 天気
    gloss: 天気
    note: 天気や気象状況を表す一般的な語です。
    example_gloss: どんな天気？
  pl.a1.unit19.lesson01.teach.zimno:
    title: 寒い
    gloss: 寒い
    note: 気温を表す語で、性によって形は変わりません。
    example_gloss: 寒いです。
  pl.a1.unit19.lesson01.teach.goraco:
    title: 暑い
    gloss: 暑い
    note: 「*zimno*」の反対の語で、こちらも性によって形は変わりません。
    example_gloss: 暑いです。
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: 寒い、暑い
    gloss: Jest zimno. Jest gorąco. -- ポーランド語では、「*jest*」+天気の語で天気を表します。性による変化はありません。
    note: この単純な型は、このユニットのどの天気の語にも使えます。
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: どんな天気？
    gloss: どんな天気？
    note: 今の天気をたずねる自然な言い方です。
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: 今日は寒いです
    gloss: 今日は寒いです。
    note: このユニット全体の土台になる、今日の天気を表す文です。
  pl.a1.unit19.lesson02.teach.pada:
    title: 雨が降っている
    gloss: 雨が降っている/雨が降る
    note: 主語なしで単独で使います。ポーランド語で「雨が降っている」と言うときの普通の言い方です。
    example_gloss: 今日は雨が降っています。
  pl.a1.unit19.lesson02.teach.snieg:
    title: 雪
    gloss: 雪
    note: 雪を表す語で、「*pada*」と組み合わせると「雪が降っている」という意味になります。
    example_gloss: 雪が降っています。
  pl.a1.unit19.lesson02.teach.mgla:
    title: 霧
    gloss: 霧
    note: もう一つのよくある天気です。
    example_gloss: 霧が出ています。
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: 良い
    gloss: Pogoda jest dobra. -- 「*dobra*」は、「*pogoda*」のような女性名詞に合います。
    note: 「*dobry*」(「*Dzień dobry*」に出てくる語)の女性形です。*chory/chora*と同じ、-y/-aの型です。
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: ひどい
    gloss: Jaka straszna pogoda! -- 「*straszna*」も、「*dobra*」と同じように「*pogoda*」に合います。
    note: 強い語なので、本当に悪い天気のときに使います。
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: なんてひどい天気でしょう！
    gloss: なんてひどい天気でしょう！
    note: 悪い天気についての自然な感嘆表現です。
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: 天気は良いです
    gloss: 天気は良いです。
    note: このレッスンの前半に出た天気の語を、もう一度使っています。
  pl.a1.unit19.lesson03.teach.recap_words:
    title: はい、そして、私、〜も：復習
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- これらの語は前のレッスンで学びました。
    note: このレッスンの会話の前に、さっと復習しましょう。
  pl.a1.unit19.lesson03.teach.bo:
    title: なぜなら
    gloss: なぜなら
    note: 予定と、その理由になる天気をつなぎます。
    example_gloss: 雨が降っているので、公園には行きません。
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: 雨なので、行きたくありません
    gloss: 雨が降っているので、公園には行きたくありません。
    note: 天気の描写と実際の予定を組み合わせた、このユニットが目指す形そのものです。
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: クラクフで：復習
    gloss: W Krakowie -- これは前のレッスンで学びました。例：「Ona mieszka w Krakowie」(彼女はクラクフに住んでいます)。
    note: このレッスンの会話で二つの場所の天気を比べる前に、さっと復習しましょう。
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: マレクが天気をたずねる
    gloss: 今日はどんな天気ですか？
    note: マレクは、今日の天気をたずねて会話を始めます。
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: エヴァが答える
    gloss: 雨が降っています。寒いです。
    note: エヴァは、今日の実際の天気を伝えます。
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: マレクが反応して、予定を話す
    gloss: なんてひどい天気でしょう！雨が降っているので、公園には行きたくありません。
    note: マレクは天気に反応し、それを理由に自分の予定を伝えます。
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: エヴァも同意する
    gloss: 私も公園には行きません。
    note: エヴァも、マレクと同じ予定にします。
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: マレクがクラクフについてたずねる
    gloss: クラクフは？あちらの天気はどうですか。
    note: マレクは、別の町の天気に話題を移します。
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: エヴァが答える
    gloss: クラクフでは雪が降っています。あちらはとても寒いです。
    note: エヴァは、クラクフのもっと寒い天気を伝えます。
