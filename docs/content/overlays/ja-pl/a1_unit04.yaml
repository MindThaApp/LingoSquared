answer_policy:
  diacritics: 'Same standing policy as ユニット1/unit02/unit03: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: ポーランド語 A1
units:
  pl.a1.unit04.time:
    title: 時間と時刻
lessons:
  pl.a1.unit04.lesson01.ktora_godzina:
    title: 何時ですか?
  pl.a1.unit04.lesson02.o_ktorej_godzinie:
    title: 何時に
  pl.a1.unit04.lesson03.ustalamy_godzine_spotkania:
    title: 会う時間を決める
teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: 1時、2時、3時
    gloss: 1時、2時、3時
    note: ポーランド語では、時刻を女性形の序数で表します。省略されている女性名詞 *godzina*(時間)に合わせた形で、*pierwsza* は文字どおり「1番目の(時間)」という意味です。
    example_gloss:
    - 1時です。
    - 2時です。
    - 3時です。
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: 4時、5時、6時
    gloss: 4時、5時、6時
    note: '*pierwsza*、*druga*、*trzecia* と同じ、女性形の序数のパターンです。'
    example_gloss:
    - 4時です。
    - 5時です。
    - 6時です。
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: 7時、8時、9時
    gloss: 7時、8時、9時
    note: 12時間のうち真ん中の3つで、同じパターンです。
    example_gloss:
    - 7時です。
    - 8時です。
    - 9時です。
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: 10時、11時、12時
    gloss: 10時;11時;12時
    note: 最後の3つの時刻です。これで1時から12時までがそろいます。
    example_gloss:
    - 10時です。
    - 11時です。
    - 12時です。
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: 時間をたずねる
    gloss: 何時ですか？
    note: 直訳は「どの時間ですか?」です。*która* は女性名詞 *godzina* に合わせた形で、この課を通して同じ一致のパターンが出てきます。
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: godzina は女性名詞
    gloss: 時刻は pierwsza, druga, trzecia と言い、pierwszy, drugi, trzeci とは言いません。
    note: '*Pierwszy*、*drugi*、*trzeci* は同じ序数の男性形で、ポーランド語のほかの場面では男性名詞に使います。でも *godzina* は女性名詞なので、時刻を言うときには使いません。'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: 朝、正午、午後
    gloss: 朝に;正午に;午後に
    note: '*Rano* は前置詞なしで単独で使います。*w południe* と *po południu* はそれぞれ決まった前置詞がつきます。この3つは一般的な規則から導くより、決まった表現として覚えましょう。'
    example_gloss:
    - 朝、コーヒーを飲みます。
    - 正午に昼食を食べます。
    - 私は午後に働きます。
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: 夕方、夜
    gloss: 夕方に;夜に
    note: '*Wieczorem* は決まった副詞の形で、前置詞は要りません。*w nocy* は *w* と *noc*(夜)の前置格を組み合わせた形です。'
    example_gloss:
    - 夕方にテレビを見ます。
    - 夜は寝ます。
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: 何時に?と尋ねる
    gloss: 何時に？
    note: 今何時かではなく、何かがいつ行われるかを尋ねるときは、*Która jest godzina?* の代わりにこちらを使います。
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: 「〜時に」の言い方
    gloss: 4時、7時、10時 -- でも 4時に、7時に、10時に。
    note: '*o*(「〜に」)の後では、時刻を表す語の語尾 *-a* が *-ej* に変わります。*czwarta* → *o czwartej*、*siódma* → *o siódmej*、*dziesiąta* → *o dziesiątej*。どの時刻も同じ型です。つづりで注意が要るのは *druga* → *o drugiej* だけで、*g* の後に *i* が入ります。'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: 早起きのエヴァ
    gloss: エヴァは朝7時に起きます。
    note: '*Wstaje* は *wstawać*(起きる)の三人称単数形です。'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: 列車の出発時刻
    gloss: 列車は午後4時に出発します。
    note: '*Odjeżdża* は *odjeżdżać*(出発する)の三人称単数形です。'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: 会議・待ち合わせ
    gloss: 会う約束
    note: 第3課に出てきた語(*Kiedy jest spotkanie?*)と同じです。エヴァとマレクが、また会う曜日と日付を決めていました。
    example_gloss: 会う約束は金曜日です。
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: 会う時間を尋ねる
    gloss: 5月15日の金曜日は、何時に会えますか?
    note: この課の *o której godzinie* と第3課の曜日・日付を組み合わせた文です。エヴァとマレクはすでに5月15日の金曜日と決めていて、今度は正確な時間を決めます。
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: 時間を提案する
    gloss: 午後4時はどうですか?
    note: '*Może* だけで「たぶん、もしかして」という意味です。時間を提案するときの、やわらかく自然な言い方です。'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: 時間が都合よいと伝える
    gloss: 午後4時で大丈夫です。
    note: 第3課の *Piątek mi odpowiada* と同じ *[time] + mi + odpowiada* の型です。時間そのものが文法上の主語で、*odpowiadać* は「人」を必ず与格(*mi*=「私にとって」)で表します。
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: 予定をまとめて確認する
    gloss: 5月15日の4時に会いましょう!
    note: 第1課の別れのあいさつ *Do zobaczenia* に、日付と時間を組み合わせた形です。
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: エヴァが時間を尋ねる
    gloss: エヴァはマレクに、5月15日の金曜日は何時に会えるか尋ねます。
    note: この課の最初の質問とまったく同じです。
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: マレクが午後4時を提案する
    gloss: マレクは午後4時を提案します。
    note: 断定ではなく、やわらかい提案です。それを示すのが *może* です。
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: エヴァが了承する
    gloss: エヴァは午後4時で大丈夫だと言います。
    note: 第3課の「金曜日は都合がよい」というやり取りと同じ与格の構文です。
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: マレクが予定をまとめる
    gloss: マレクは「いいですね」と言い、5月15日の4時に会いましょうと言います。
    note: '*Świetnie* は第3課に出てきた、喜びを表す感嘆の言葉です。'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: エヴァが別れを告げる
    gloss: エヴァも別れのあいさつを返します。
    note: いちばん短い締めくくりで、別れのあいさつだけです。
