teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: 痛い
    gloss: Boleć(痛む)の現在形：boli(彼/彼女/それ)と bolą(彼ら)。Głowa mnie boli は「頭が痛い」という意味で、直訳すると「頭が私を痛ませる」です。
    note: 体の痛みを言うときは、*boleć* の現在形はこの2つの形だけを使います。痛む部位が主語で、*mnie* が「誰の痛みか」を表すので、「私が痛む」という形は覚えなくて大丈夫です。
  pl.a1.unit16.lesson01.teach.glowa:
    title: 頭
    gloss: 頭
    note: 「痛い」と言うときにいちばんよく使う部位です。
    example_gloss: 頭が痛いです。
  pl.a1.unit16.lesson01.teach.gardlo:
    title: のど
    gloss: のど
    note: 風邪やのどの痛みを伝えるときに便利です。
    example_gloss: 喉が痛いです。
  pl.a1.unit16.lesson01.teach.brzuch:
    title: おなか
    gloss: おなか
    note: 食べ過ぎたときや、食べ物が合わなかったときに便利です。
    example_gloss: おなかが痛いです。
  pl.a1.unit16.lesson01.teach.zeby:
    title: 歯
    gloss: 歯
    note: ここではいつも複数形で使います。ポーランド語話者の実際の言い方と同じです。そのため *boli* ではなく *bolą* が使われます。
    example_gloss: 歯が痛いです。
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: どこが痛いですか？
    gloss: どこが痛いですか？
    note: 具合が悪そうな人にたずねる、自然な質問です。
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: 気分はどうですか
    gloss: Czuć się(感じる):czuję się(私)、czujesz się(あなた)。ご気分はいかがですか？
    note: 今のところ形は2つだけです。自分のことには *czuję*、相手にたずねるときには *czujesz* を使います。
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: 調子がよい・悪い
    gloss: 気分がいいです。具合が悪いです。-- dobrze はもう知っていますね。źle はその反対の言葉です。
    note: 最初のレッスンから使ってきた *dobrze* と、その反対の言葉を組み合わせます。
  pl.a1.unit16.lesson02.teach.zle:
    title: 悪く
    gloss: 悪く
    note: 体調がよくないと伝えるときに必要な言葉です。
    example_gloss: 具合が悪いです。
  pl.a1.unit16.lesson02.teach.goraczka:
    title: 熱
    gloss: 熱
    note: 症状を伝えるときによく使う、基本の言葉です。
    example_gloss: 熱があります。
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ma -- もう一度
    gloss: Ewa, ma -- この名前と、動詞 mieć(持つ)のこの形は、前のレッスンで学びました(Mam, masz, ma)。
    note: このレッスンでどちらも使うので、軽くおさらいします。
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: 病気の
    gloss: 病気の(男性)/病気の(女性)
    note: '*młodszy/starsza* で学んだ -y/-a の型と同じです。男性には *chory*、女性には *chora* を使います。'
    example_gloss:
    - 彼は病気です。
    - 彼女は病気です。
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: エヴァは具合が悪い
    gloss: 具合が悪いです。熱があります。
    note: エヴァが自分の症状を話しています。このユニットの会話でも、同じことをもう一度言います。
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: マレク、もう一度
    gloss: マレク――この名前は前のレッスンで習いました。
    note: このレッスンの会話の前に、ちょっと復習です。
  pl.a1.unit16.lesson03.teach.i_recap:
    title: 「と」、もう一度
    gloss: I――この単語は前のレッスンで習いました。
    note: このレッスンの会話の前に、ちょっと復習です。
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: どうぞと水、もう一度
    gloss: Proszę と wodę――どちらの単語も前のレッスンで習いました。
    note: このレッスンの会話の前に、ちょっと復習です。
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: ありがとう、もう一度
    gloss: Dziękuję――この単語は前のレッスンで習いました。
    note: このレッスンの会話の前に、ちょっと復習です。
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: 休む
    gloss: 休む
    note: '*Proszę* は、まっすぐ行く・曲がるなどをお願いするときにすでに使った形と同じで、*Proszę* +不定詞で使います。命令形は必要ありません。'
    example_gloss: 休んでください。
  pl.a1.unit16.lesson03.teach.pic:
    title: 飲む
    gloss: 飲む
    note: これも *Proszę* の後に同じように続く不定詞です。
    example_gloss: 水を飲んでください。
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: マレクがエヴァに具合を尋ねる
    gloss: エヴァ、具合はどう？
    note: マレクは様子がおかしいと気づいて、率直に尋ねます。
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: エヴァが症状を説明する
    gloss: 具合が悪いです。喉が痛くて、熱があります。
    note: エヴァは二つの症状をはっきり伝えています。このユニットの前のほうで話したことと同じ内容です。
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: マレクが簡単なアドバイスをする
    gloss: 休んで、水を飲んでください。
    note: 簡単な、診断ではないアドバイスです。医療上の指示ではなく、ごく常識的なことです。
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: エヴァがマレクにお礼を言う
    gloss: わかりました、ありがとう、マレク。
    note: 会話を締めくくる、シンプルでおなじみの言葉です。
