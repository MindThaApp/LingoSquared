teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: 行く、たどり着く
    gloss: 行く;たどり着く
    note: よく似た2つの移動の動詞です。iść は「行く・歩く」を表す一般的な動詞、dojść は目的地に「着く・たどり着く」ことを表し、このレッスンの質問の型で使います。
    example_gloss:
    - まっすぐ行ってください。
    - 銀行へはどう行きますか。
  pl.a1.unit09.lesson01.teach.prosto:
    title: まっすぐ
    gloss: まっすぐ
    note: いちばん基本的な方向の言葉です。iść のすぐあとに置いて「まっすぐ行く」と言います。
    example_gloss: 公園までまっすぐ行ってください。
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: そこ、それから
    gloss: そこに;それから
    note: Tam は場所を指し、potem は手順をつなぎます(「まずこれ、それからあれ」)。道案内を続けて言うのにどちらも欠かせません。
    example_gloss:
    - 銀行はそこです。
    - それから、まっすぐ行ってください。
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Proszę + 不定詞
    gloss: Proszę + 不定詞 -- Proszę(どうぞ)に動詞の不定詞(辞書に載っている形)を続けるのが、道を教えるときの日常的で丁寧な言い方で、別の命令形は必要ありません。例:まっすぐ行ってください。
    note: '*Proszę* に不定詞の動詞を続けると、ポーランド語で丁寧に何かを頼む言い方になります。*Proszę iść prosto*(「まっすぐ行ってください」)。知らない人にも使える安全で丁寧な形なので、道を教えたり聞いたりするのに別の「命令形」は必要ありません。(友人どうしでは、ふつうその命令形を使います。それはあとで学びます。)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: 〜へはどう行きますか([場所])
    gloss: 〜へはどう行けばいいですか?-- Jak(どう)+ dojść(着く、行き着く)で、場所への行き方を尋ねます。Jak dojść do banku?(銀行へはどう行けばいいですか?)Jak dojść do hotelu?(ホテルへは?)Jak dojść do parku?(公園へは?)do の後の名詞は、前の単元の「隣に」「向かいに」の後と同じ -u の生格語尾になります。bank → banku、hotel → hotelu、park → parku。
    note: '*Jak dojść do...?* は、場所への行き方を尋ねるときの日常的な表現です。*do* の後に来る場所の名前は、*obok*/*naprzeciwko* の後で習ったのと同じ *-u* の生格語尾になります。*bank* は *banku*、*hotel* は *hotelu*、*park* は *parku* となります。前置詞が新しくなっただけで、パターンはまったく同じです。'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: 銀行へはどう行きますか。
    gloss: 銀行へはどう行きますか。
    note: 文法ノートのパターンを、このレッスン最初の目的地で使ってみましょう。
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: 右、左
    gloss: 右、左
    note: na の後に置いて、ものの位置や曲がる方向を表します。na prawo(右に・右へ)、na lewo(左に・左へ)。
    example_gloss:
    - 銀行は右にあります。
    - 公園は左にあります。
  pl.a1.unit09.lesson02.teach.skrecic:
    title: 曲がる
    gloss: 曲がる
    note: 進む方向を変えることを表す動詞です。na prawo/na lewo と組み合わせて「右に曲がる」「左に曲がる」の意味になります。
    example_gloss: 右に曲がってください。
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: 左に曲がってください
    gloss: 左に曲がってください。
    note: 同じ Proszę + 不定詞のパターンを、今度は skręcić と na lewo で使います。
  pl.a1.unit09.lesson02.teach.ulica:
    title: 通り
    gloss: 通り
    note: どんな通りにも使える一般的な単語です。道案内で特定の通りの名前が出てくるときに役立ちます。
    example_gloss: 通りはあちらです。
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: potem でつなぐ道順
    gloss: まっすぐ行って、それから右に曲がってください。-- いくつかの指示は、コンマと potem(それから)でつなげられます。まず一つ目の動作、それから次の動作です。
    note: 指示を続けて言うときは、コンマと *potem* でつなぐだけです。*Proszę iść prosto, potem skręcić na prawo*(「まっすぐ行って、それから右に曲がってください」)。実際の複数ステップの道案内も、まさにこの形で聞こえてきます。
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: わかりました
    gloss: わかりました
    note: 道案内を理解したことを伝え、そのうえで続けて質問するときに便利な言い方です。
    example_gloss: わかりました、ありがとうございます。
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: エヴァが公園への行き方を尋ねる
    gloss: エヴァは「すみません」と声をかけ、公園への行き方を尋ねます。
    note: Przepraszam で質問を切り出します。前の単元の場所の会話と同じ、丁寧な習慣です。
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: 通行人が公園への道を教える
    gloss: 通行人は「まっすぐ行って、それから左に曲がってください。公園はあそこです」と言います。
    note: このレッスンの文法ノートで説明したとおり、potem を使った二つの指示のつながりです。
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: エヴァは理解を伝え、銀行について尋ねる
    gloss: エヴァは「わかりました」と言い、銀行への行き方を尋ねます。
    note: Rozumiem で、最初の道案内を理解したことを示してから、新しい質問をします。
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: 通行人が銀行への道を教える
    gloss: 通行人は「右に曲がって、それからまっすぐ行ってください。銀行は右にあります」と言います。
    note: 公園とは違う二段階の道順ですが、同じ Proszę + 不定詞のパターンを使っています。
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: エヴァがお礼を言う
    gloss: エヴァは「どうもありがとうございます」と言います。
    note: Dziękuję bardzo は、買い物や場所の単元でも出てきた表現です。
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: 通行人が答える
    gloss: 通行人は「どういたしまして」と言います。
    note: Proszę bardzo は、お礼に対する決まった返事で、これまでの単元にも出てきました。
