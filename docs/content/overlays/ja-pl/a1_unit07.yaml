teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: バナナ
    gloss: バナナ
    note: どの市場やお店にもある身近な果物で、1本ずつでも量り売りでも売られています。
    example_gloss: これはバナナです。
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: トマト、きゅうり
    gloss: トマト、きゅうり
    note: どちらも男性名詞(無生物)です。この課の後半でキロ単位で買うときに、複数属格の形(pomidorów、ogórków)が必要になります。
    example_gloss:
    - これはトマトです。
    - これはきゅうりです。
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: じゃがいも、玉ねぎ
    gloss: じゃがいも、玉ねぎ
    note: Ziemniak は男性名詞(無生物)で、banan や pomidor と同じ複数属格 -ów のグループです。cebula は女性名詞です。
    example_gloss:
    - これはじゃがいもです。
    - これは玉ねぎです。
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: 安い、高い
    gloss: 安く、高く
    note: '*Tanio* と *drogo* は副詞で、ポーランド語では *kosztować*(「値段が〜である」)と直接組み合わせます。*To kosztuje drogo* は直訳すると「それは高く値がつく」で、「それは高い」という意味です。'
    example_gloss:
    - とても安い!
    - とても高い!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 値段が〜である:kosztuje、kosztują
    gloss: 値段が〜である:kosztuje(1つの場合)、kosztują(複数の場合)-- バナナは安いです。バナナ(複数)は安いです。
    note: '*Kosztować* は「値段が〜である」という動詞です。1つなら *kosztuje*、複数なら *kosztują* を使います。*jest* と *są* の違いと同じで、値段について言うときの形です。どちらでも市場の店員さんには通じますが、ネイティブが実際に言うのは *banany kosztują* です。'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: バナナはいくらですか?
    gloss: バナナはいくらですか?
    note: 値段の交渉を始めるときの定番の質問です。*Ile*(いくら)に、バナナ1つについて尋ねるので単数の *kosztuje* を続けます。
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: グレープフルーツ
    gloss: グレープフルーツ
    note: pomidor や ziemniak と同じ男性名詞(無生物)なので、proszę o の後でも語尾は変わりません。
    example_gloss: これはグレープフルーツです。
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: みかん、オレンジ
    gloss: みかん、オレンジ
    note: どちらも、食べ物の課に出てきた kawa や herbata と同じ女性名詞です。対格では -a が -ę に変わりますが、この課では辞書の形だけを使います。
    example_gloss:
    - これはみかんです。
    - これはオレンジです。
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: 1キロ、半キロ
    gloss: 1キロ、半キロ
    note: '*Kilo* は、何をどれだけ量るときでも、それ自体の語尾は変わりません。変わるのは *kilo* の後に続く名詞のほうで、この課の文法ノートで説明します。'
    example_gloss:
    - トマトを1キロください。
    - バナナを半キロください。
  pl.a1.unit07.lesson02.teach.poprosze:
    title: 〜をお願いします
    gloss: 〜をお願いします・〜をください
    note: '*Poproszę* は、食べ物の課で習った *proszę o* より少し洗練された、日常的な言い方です。どちらも「〜をお願いします」の意味で、ポーランド人は自由に使い分けます。*Poproszę* の後には欲しいものをそのまま続け、*o* は要りません。'
    example_gloss: グレープフルーツをお願いします。
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 「kilo」の後:-ów の語尾
    gloss: 「kilo」の後の複数属格:banan → バナナの、pomidor → トマトの、ziemniak → じゃがいもの。
    note: '*kilo* や *pół kilo* のように重さで量を言うとき、後に続く名詞は複数属格という別の形になります。規則的なこの3つの男性名詞では、*-ów* を付けるだけです。*banan* は *bananów*、*pomidor* は *pomidorów*、*ziemniak* は *ziemniaków* になります。'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: トマトを1キロください
    gloss: トマトを1キロください。
    note: 文法ノートの -ów のパターンを実際の注文で使います。kilo の後で pomidor は pomidorów になります。
  pl.a1.unit07.lesson03.teach.dla:
    title: 〜のための
    gloss: 〜のための
    note: 「〜のための」を意味する簡単な前置詞です。店員さんは *Co dla pani?*(直訳は「あなたには何を?」)と言って、お客さんに丁寧に注文を尋ねます。
    example_gloss: これはあなたのです。
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: 新鮮な、とても
    gloss: 新鮮な、とても
    note: 市場の店員さんがよく使う2つの言葉です。商品の新鮮さや、安さ・高さを話すときに使います。
    example_gloss:
    - トマトは新鮮です。
    - とても安い!
  pl.a1.unit07.lesson03.teach.trochę:
    title: 少し
    gloss: 少し
    note: 不満をやわらかく伝える言い方です。親しい値引き交渉では、drogo だけより trochę drogo(「少し高い」)のほうがずっと自然です。
    example_gloss: ちょっと高いですね。
  pl.a1.unit07.lesson03.teach.razem:
    title: 合計で・一緒に
    gloss: 合計・全部で
    note: 店の人が、支払う最終的な金額を言う直前に使う言葉です。
    example_gloss: 全部で10ズウォティです。
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: 何になさいますか
    gloss: 何になさいますか?
    note: 直訳は「あなた(丁寧)には何を」。店の人がお客さんに最初にかける、ごく自然なひと言です。
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: 店の人がエヴァに声をかける
    gloss: 店の人があいさつをして、エヴァに何がほしいか尋ねます。
    note: Dzień dobry は、ユニット1のあいさつで学んだ表現です。
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: エヴァがバナナの値段を尋ねる
    gloss: エヴァがバナナはいくらか尋ねます。
    note: Kosztują は、このユニットの文法ノートで学んだ複数形です。バナナを複数のものとしてまとめて尋ねているためです。
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: 店の人が値段を伝える
    gloss: 店の人が、1キロ5ズウォティで、とても新鮮だと言います。
    note: 値段を言うときの自然な省略表現です。「[値段] kilo」で1キロあたりの値段を表し、「〜あたり」にあたる語は必要ありません。
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: エヴァがバナナを注文する
    gloss: エヴァは「わかりました」と言って、バナナを1キロ頼みます。
    note: poproszę に kilo + bananów を組み合わせた、レッスン2の文法ノートと同じ型です。
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: 店の人がトマトをすすめる
    gloss: 店の人が「トマトはどうですか」と尋ね、1キロ8ズウォティだと言います。
    note: 3行目と同じ省略した値段の言い方で、今度は別の品物です。
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: エヴァがやんわり値段にふれて注文する
    gloss: エヴァは「ちょっと高いですね」と言いつつ、半キロ買うことにします。
    note: Trochę drogo は不満をやわらげる言い方です。エヴァは買うものの、量を少なめにします。
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: 店の人が合計金額を伝える
    gloss: 店の人が「どうぞ」と言って、合計は9ズウォティだと伝えます。
    note: バナナ5ズウォティ+トマト半キロ4ズウォティで、合計9ズウォティ。場面の中で出てきた値段と合っています。
