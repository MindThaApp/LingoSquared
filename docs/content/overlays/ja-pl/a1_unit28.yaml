    title: 誰がどのように移動する？
    gloss: エヴァは毎日電車で通勤しています。マレクはふだん自転車ですが、雨が降るときは電車で行きます。トメクは車を運転するほうが好きです。カシャは近くに住んでいて、歩いて通勤しています。あなたは仕事へどうやって行きますか？
    note: 短い読み物の中で、4つの異なる通勤方法と一つの条件(雨)を比べています。
    glosses:
      podróżuje: 通勤する
      co: 毎～
      dzień: 日
      pociągiem: 電車
      pracy: 仕事
      jeździ: 自転車で行く
      zwykle: たいてい
      pada: 雨が降る
      jedzie: 乗る
      jeździć: 車で行く
      woli: 〜のほうを好む
      samochodem: 車
      mieszka: 住んでいる
      blisko: 近くに
      chodzi: 歩いて行く
      podróżujesz: 行く
