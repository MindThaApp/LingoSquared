teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: 銀行、郵便局
    gloss: 銀行；郵便局
    note: どちらも日常のよくある用事の場所です。bank は日本語の「バンク」に似ていて覚えやすい語で、poczta は手紙や荷物を送りに行く場所です。
    example_gloss:
    - ここは銀行です。
    - ここは郵便局です。
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: 薬局、レストラン
    gloss: 薬局；レストラン
    note: Apteka は薬を買う場所で、何でも売っている店ではありません。restauracja は日本語の「レストラン」に近い形の語です。
    example_gloss:
    - ここは薬局です。
    - ここはレストランです。
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: ホテル；公園
    note: どちらも日本語の「ホテル」「パーク」とそっくりなので、文字でも音でも見つけやすい語です。
    example_gloss:
    - ここはホテルです。
    - ここは公園です。
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: 〜はどこですか？
    gloss: 「場所」はどこですか？ -- Gdzie(どこ)と jest(ある・です)で、場所を尋ねます。銀行はどこですか？ 薬局はどこですか？
    note: '*Gdzie* は「どこ」、*jest* は「ある・いる」にあたる語です。合わせた *Gdzie jest...?* は、どんな場所についても「どこですか」と尋ねるときの日常的な型です。場所が1つのときはそのまま使います。複数の場所について尋ねるときは、jest の代わりに *są*(「ある」の複数形)を使います。'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: 銀行はどこですか？
    gloss: 銀行はどこですか？
    note: 文法ノートの型を、このレッスン最初の場所の語で使ってみましょう。
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: 近い、遠い
    gloss: 近い；遠い
    note: 対になる簡単な組み合わせです。jest のすぐあとに置いて、場所が近いか遠いかを表します。
    example_gloss:
    - 公園は近いです。
    - ホテルは遠いです。
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: 遠くない
    gloss: 遠くない
    note: もともとは *nie*(〜ない)と *daleko*(遠く)が一語になったものです。ある場所がすぐ行ける所にあると、やわらかく安心させたいときによく使われます。
    example_gloss: 薬局は遠くありません。
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: 隣に、向かいに
    gloss: 隣に；向かいに
    note: どちらも、近さだけでなく、目印になる場所に対する位置を表します。後ろに続く名詞は生格になります。このレッスンの文法ノートを見てください。
    example_gloss:
    - 薬局は銀行の隣にあります。
    - レストランはホテルの向かいにあります。
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 「obok」「naprzeciwko」「blisko + 名詞」のあと：生格
    gloss: 「〜の隣に」「〜の向かいに」「〜の近くに」+場所のあとは生格になります。bank → banku、hotel → hotelu、park → parku。薬局は銀行の隣にあります。レストランはホテルの向かいにあります。レストランは公園の近くにあります。
    note: '*Obok*、*naprzeciwko*、そして場所が後ろに続く *blisko* は、どれも生格を取るので、後ろの名詞の語尾が変わります。規則的な男性名詞のこの3語では、*-u* を付けます。*bank* は *banku*、*hotel* は *hotelu*、*park* は *parku* になります。*blisko* を単独で使うときは生格は不要で、*To jest blisko*(「それは近いです」)も *blisko parku*(「公園の近く」)と同じく正しい文です。'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: 薬局は銀行の隣にあります
    gloss: 薬局は銀行の隣にあります。
    note: 文法ノートの -u のパターンを実際の文で使います。obok のあとで bank は banku になります。
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: すみません
    gloss: すみません／ごめんなさい
    note: 知らない人に声をかけるときの日常的な言い方です。質問のあとではなく、質問の前に言います。
    example_gloss: すみません、銀行はどこですか。
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: エヴァが薬局の場所をたずねる
    gloss: エヴァは「すみません」と言って、薬局はどこかたずねます。
    note: Przepraszam は、このレッスンの語彙ノートにあるとおり質問の前に言います。マレクのように知っている相手でも、何かたずねる前に声をかける丁寧な言い方です。
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: マレクが薬局の場所を教える
    gloss: マレクは、薬局は遠くなく、銀行の隣だと言います。
    note: レッスン2の文法ノートにある niedaleko と、obok + banku を組み合わせています。
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: エヴァがマレクにお礼を言い、レストランの場所をたずねる
    gloss: エヴァはお礼を言って、レストランはどこかたずねます。
    note: Dziękuję は前のユニットで出てきました。A(それで、では)は、新しい質問を前の話につなげます。
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: マレクがレストランの場所を教える
    gloss: マレクは、レストランはホテルの向かいで、公園の近くだと言います。
    note: Naprzeciwko + hotelu(生格で、banku と同じパターン)に、2つ目の目印として blisko を加えています。
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: エヴァがもう一度マレクにお礼を言う
    gloss: エヴァは「どうもありがとうございます」と言います。
    note: Bardzo(とても)は、proszę bardzo と同じように dziękuję を強めます。
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: マレクが答える
    gloss: マレクは「どういたしまして」と言います。
    note: Proszę bardzo は、買い物のユニットで出てきた、お礼に対する決まった返事です。
