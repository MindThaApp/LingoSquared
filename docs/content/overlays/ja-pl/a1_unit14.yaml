teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: 若い
    gloss: 若い
    note: 基本的な形容詞です。この課で学ぶ比較級の出発点になります。
    example_gloss: マレクは若いです。
  pl.a1.unit14.lesson01.teach.stary:
    title: 年を取った
    gloss: 年を取った
    note: młody の反対の意味の語です。この課で比較級にするもう一つの形容詞です。
    example_gloss: おじいさんは年を取っています。
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 比較の作り方：-szy を付ける
    gloss: stary や młody のような短い形容詞は、語尾の -y を -szy に変えます。stary は starszy、młody は młodszy になります。すべての形容詞がこの形になるわけではありません。
    note: この2語の簡単な規則です。語末の *-y* を取って *-szy* を付けると比較級になります。ほかの多くの形容詞は違う語尾を使うので、何にでも当てはめないでください。
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: より年上の
    gloss: より年上の
    note: starszy は男性（on）に、starsza は女性（ona）に使います。stary の比較級です。
    example_gloss:
    - おじいさんはお父さんより年上です。
    - おばあさんはお母さんより年上です。
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: より年下の
    gloss: より年下の
    note: 男性には młodszy、女性には młodsza を使います。młody の比較級です。
    example_gloss:
    - お父さんはおじいさんより年下です。
    - お母さんはおばあさんより年下です。
  pl.a1.unit14.lesson01.teach.niz:
    title: 〜より
    gloss: 〜より
    note: niż は比べる二つのものをつなぎます。niż の後の語は基本の形のままです。
    example_gloss: 息子は父親より若いです。
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: 比較級は性に一致する
    gloss: starszy/starsza と młodszy/młodsza は、byłem/byłam と同じように性によって形が変わります。男性（on）には starszy、młodszy、女性（ona）には starsza、młodsza を使います。
    note: '*byłem*/*byłam* と同じ仕組みです。男性について話すか女性について話すかで語尾が変わります。'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: エヴァはマレクより年上です
    gloss: エヴァはマレクより年上です。
    note: 二人の登場人物についての本当の事実です。エヴァは32歳、マレクは28歳です。
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: マレクはエヴァより年下です
    gloss: マレクはエヴァより年下です。
    note: 同じ事実を逆の言い方で表しています。
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: 「良い」をもう一度
    gloss: dobry（良い）は Dzień dobry で、すでに知っている語です。
    note: 最初の課から出てきた同じ形容詞で、今回は比較級を作る元になります。
  pl.a1.unit14.lesson02.teach.zly:
    title: 悪い
    gloss: 悪い
    note: dobry の反対の意味で、この課の新しい単語です。
    example_gloss: 今日はついていない日です。
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: dobry と zły は不規則
    gloss: dobry と zły は不規則です。dobry は lepszy、zły は gorszy になり、-szy は付けません。
    note: '*stary*/*młody* とは違い、この2語は規則的な *-szy* の形になりません。比較級の形をそのまま覚える必要があります。'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: より良い
    gloss: より良い
    note: 男性には lepszy、女性（または kawa のような女性名詞）には lepsza を使います。dobry の不規則な比較級です。
    example_gloss:
    - 彼は私より上手です。
    - コーヒーは紅茶よりおいしいです。
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: より悪い
    gloss: より悪い
    note: gorszy/gorsza は zły の不規則な比較級です。
    example_gloss:
    - 彼は私より下手です。
    - 紅茶はコーヒーよりおいしくないです。
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: コーヒーと紅茶をもう一度
    gloss: kawa と herbata は、飲み物の課ですでに習った単語です。
    note: この課で比較に使う前に、簡単に復習します。
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: 前と同じ仕組み
    gloss: lepszy/lepsza と gorszy/gorsza は、前の課の starszy/starsza と同じように性によって形が変わります。
    note: 今学んだ男性形と女性形の区別を、新しい2語にも当てはめます。
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: 私、私は〜です、あなた
    gloss: ja、jestem、ty は、前の課ですでに習った単語です。
    note: この課の会話の前に、簡単に復習します。
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: はい、いいえ、いいです
    gloss: tak、nie、dobrze もすでに知っている単語です。
    note: 会話の前にもう一つ、簡単な復習です。
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: 「でも」をもう一度
    gloss: ale（でも）は前の課ですでに習った単語です。対照的な二つの文をつなぎます。
    note: 対比を示す短いつなぎの言葉で、日本語の「でも」「しかし」に近い働きをします。
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: マレクは紅茶のほうがいいと言う
    gloss: 紅茶はコーヒーよりおいしいよ！
    note: マレクは、好みの課で話したとおり、自分の意見から始めます。
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: エヴァは反対する
    gloss: いや、いや！コーヒーのほうが紅茶よりおいしいよ！
    note: エヴァも、以前話したとおり、自分の意見で言い返します。
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: マレクは年の話に変える
    gloss: わかった、わかった。でも僕は君より年下だよ！
    note: マレクは飲み物の議論をあきらめて、自信のある話題を持ち出します。
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: エヴァは認めて、もう一度自分の意見を言う
    gloss: ええ、私のほうが年上ね。でもコーヒーのほうがおいしいわ！
    note: エヴァは年齢の事実を認めてから、コーヒーについての自分の意見に戻ります。
