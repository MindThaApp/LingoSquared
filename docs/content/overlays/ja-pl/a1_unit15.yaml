teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: 駅
    gloss: 駅
    note: 電車やバスが発着する場所です。この単元の出発点になります。
    example_gloss: 駅はホテルの近くです。
  pl.a1.unit15.lesson01.teach.bilet:
    title: 切符
    gloss: 切符
    note: 電車やバスに乗る前に必要になります。
    example_gloss: 切符は20ズウォティです。
  pl.a1.unit15.lesson01.teach.peron:
    title: プラットホーム
    gloss: プラットホーム
    note: 電車を待って実際に立つ場所です。
    example_gloss: 1番ホームはあそこです。
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: 1番ホーム、2番ホーム…
    gloss: ホームの番号を言うには、Peron numer + 数字 と言えます。Peron numer jeden, Peron numer dwa.
    note: 見た目より簡単です。*peron* + *numer* + すでに知っている普通の数字を言うだけです。(駅のアナウンスでは *peron pierwszy* のように序数を使うことも多いですが、*peron numer jeden* はいつでも通じます。)
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: もう一度、電車
    gloss: Pociąg odjeżdża o czwartej po południu -- この文は時間の課で学習済みです。
    note: 時間の単元と同じ内容を、今度は旅行の場面で使います。
  pl.a1.unit15.lesson01.teach.krakow:
    title: クラクフ
    gloss: クラクフ
    note: ポーランドの実在の都市で、この単元で最初の行き先です。
    example_gloss: クラクフは遠いです。
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: クラクフへ
    gloss: どこかへ行くときは、do + 都市名の別の形を使います。do Krakowa (do Kraków ではありません)。この形はそのまま丸ごと覚えましょう。
    note: '*Krakowa* を規則から導こうとせず、今は *do Krakowa* をひとまとまりの決まった表現として覚えましょう。'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: クラクフまでの切符をお願いします
    gloss: クラクフまでの切符をお願いします。
    note: 切符売り場でそのまま使える表現です。
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: 行く(乗り物で)
    gloss: 'Jechać(乗り物で行く): jadę(私は行く)、jedzie(彼/彼女は行く)。明日、私はクラクフへ行きます。Marek はクラクフへ行きます。'
    note: 今のところ形は二つだけです。自分には *jadę*、ほかの人には *jedzie* を使います。
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek はクラクフへ行きます
    gloss: Marek は明日クラクフへ行きます。
    note: Marek 自身の旅行です。彼の話はこの単元の会話に続きます。
  pl.a1.unit15.lesson02.teach.autobus:
    title: バス
    gloss: バス
    note: 都市間を移動するもう一つの一般的な方法です。
    example_gloss: バスは駅にあります。
  pl.a1.unit15.lesson02.teach.warszawa:
    title: ワルシャワ
    gloss: ワルシャワ
    note: ポーランドの首都で、この単元で二番目の行き先です。
    example_gloss: ワルシャワは遠いです。
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: ワルシャワへ
    gloss: Warszawa は Kraków とは変わり方が違います。do Warszawy (do Warszawa ではありません)。都市ごとに固有の形があるので、両方を別々に覚えましょう。
    note: '*Krakowa* と *Warszawy* は同じ規則には従いません。だからこそ、共通の規則ではなく一つずつ覚えるのです。'
  pl.a1.unit15.lesson02.teach.dokad:
    title: どこへ
    gloss: どこへ
    note: 今いる場所ではなく、行き先をたずねる言葉です。すでにある物の場所をたずねる「どこ」とは違います。
    example_gloss: バスはどこへ行きますか?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: もう一度、7時に
    gloss: Siódmej -- この時刻の形は時間の課で学習済みです (o siódmej = 7時に)。
    note: 時刻を表す同じ形を、今度は出発時刻に使います。
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: ワルシャワ行きのバスは7時に出発します
    gloss: ワルシャワ行きのバスは7時に出発します。
    note: この課の行き先と時刻の表現を、実際の一つの文にまとめています。
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: もう一度、いつ
    gloss: Kiedy -- この言葉は日付の課で学習済みです。Kiedy odjeżdża autobus?(バスはいつ出発しますか?)
    note: 旅行の前に自然にたずねる質問です。
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa はワルシャワへ行きます
    gloss: Ewa は明日ワルシャワへ行きます。
    note: Ewa 自身の旅行です。彼女の話もこの単元の会話で Marek の話と並んで続きます。
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: もう一度、私
    gloss: Ja -- この言葉は前の課で学習済みです。
    note: この課の会話の前に、簡単におさらいします。
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: もう一度、私の
    gloss: Mój -- この言葉は家族の課で学習済みです。
    note: この課の会話の前に、簡単におさらいします。
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: もう一度、朝の10時に
    gloss: Dziesiątej と rano -- どちらの形も時間の課で学習済みです (o dziesiątej rano = 朝の10時に)。
    note: この課の会話の前に、簡単におさらいします。
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: ありがとう、そしてまた
    gloss: Dziękuję と Do zobaczenia -- どちらも前の課で学習済みです。
    note: この課の会話の前に、簡単におさらいします。
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: 良い旅を!
    gloss: Miłej podróży! は、相手に良い旅を願うときの言い方です。一語ずつ訳さず、全体で一つの表現として使います。
    note: 決まった慣用的な別れのあいさつです。*Dzień dobry* を覚えたときと同じように、ひとまとまりで覚えましょう。
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek は明日クラクフへ行きます
    gloss: 明日、私はクラクフへ行きます。私の電車は午後4時に出発します。
    note: Marek は自分の旅行の予定から話し始めます。第1課で彼について学んだ内容と同じです。
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa は明日ワルシャワへ行きます
    gloss: 私はワルシャワへ行きます。私のバスは朝10時に出発します。
    note: Ewa も自分の予定を話します。第2課で彼女について学んだ内容と同じです。
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek は Ewa に良い旅を願います
    gloss: 良い旅を!
    note: Marek はこの課の新しい慣用表現を使って Ewa を気づかいます。
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa は Marek にお礼を言って別れます
    gloss: ありがとう!またね!
    note: おなじみの簡単な言葉で会話が終わります。
