teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: 〜したい、私は〜したい
    gloss: 〜したい；私は〜したい
    note: Chcieć は不定詞で、chcę は自分の望みを言うときに使う、日常的な一人称の形です。
    example_gloss: 映画館に行きたいです。
  pl.a1.unit11.lesson01.teach.chcesz:
    title: あなたは〜したい
    gloss: あなたは〜したい（親しい相手に）
    note: Chcesz は親しい相手に使う「あなた」の形で、masz や jesteś と同じように使います。友達に何がしたいか尋ねるときにそのまま使えます。
    example_gloss: コーヒーはいかがですか？
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: 私は〜したい、あなたは〜したい
    gloss: Chcę, chcesz は masz (mieć) や jesteś (być) と同じパターンです。chcesz は「あなた」の形（二人称）で、相手に何がしたいかを尋ねるときに使います。
    note: この単元では「私」以外の形も必要です。*chcę*（私は〜したい）と *chcesz*（あなたは〜したい）は、すでに知っている *masz* や *jesteś* と同じ人称のパターンを、新しい動詞に当てはめたものです。
  pl.a1.unit11.lesson01.teach.kino:
    title: 映画館
    gloss: 映画館
    note: 映画館を表す日常的な言葉で、予定を立てるときによく出てきます。
    example_gloss: これは映画館です。
  pl.a1.unit11.lesson01.teach.razem:
    title: いっしょに
    gloss: 一緒に
    note: Razem は買い物の場面では「合計」の意味にもなります（買い物の単元で出てきました）。ここでは、もう一つの日常的な意味「一緒に」で使われています。
    example_gloss: 一緒に行きたいですか？
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: 映画館に行きたいですか？
    gloss: 映画館に行きたいですか？
    note: Czy は「はい・いいえ」で答える疑問文を作ります。chcesz iść do kina は相手が何をしたいかを尋ねていて、予定を提案する基本の言い方です。
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: 金曜日に一緒に映画館に行きたいですか？
    gloss: 金曜日に一緒に映画館に行きたいですか？
    note: 完全な提案の形です。今学んだ質問に、razem（一緒に）と w piątek（金曜日に）を加えています。
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: 〜できる、私は〜できる
    gloss: 〜できる；私は〜できる
    note: Móc は不定詞で、mogę は一人称の形です。前の日付と時間の単元で出てきた możemy（「私たちは〜できる」）と同じ動詞で、こちらは単数の形です。
    example_gloss: 金曜日に来られます。
  pl.a1.unit11.lesson02.teach.mozesz:
    title: あなたは〜できる
    gloss: あなたは〜できる（親しい相手に）
    note: Możesz は親しい相手に使う「あなた」の形で、chcesz と同じ二人称のパターンです。相手が何かできるかどうかを尋ねるときに使います。
    example_gloss: 土曜日は大丈夫ですか？
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: 来る
    gloss: 来る
    note: 誰かに会いに来るときの動詞です。mogę や możesz と組み合わせて、誰が来られるか、来られないかを言えます。
    example_gloss: 金曜日に来たいです。
  pl.a1.unit11.lesson02.teach.moc_note:
    title: 私は〜できる、あなたは〜できる
    gloss: 'Móc: mogę, możesz は、chcesz と同じ二人称（あなた）の形です。Mogę に不定詞を続けると、できることを表します：mogę przyjść（来られます）、mogę iść（行けます）。'
    note: '*Mogę* に動詞の不定詞を続けると、できることを表せます。*mogę przyjść*（「来られます」）も *mogę iść*（「行けます」）も、この同じ簡単なパターンです。'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: 喜んで
    gloss: 喜んで
    note: 誘いを温かく快く受けるときの言い方です。tak（はい）や bardzo（とても）と組み合わせると、気持ちがさらに伝わります。
    example_gloss: はい、ぜひ！
  pl.a1.unit11.lesson02.teach.niestety:
    title: 残念ながら
    gloss: 残念ながら
    note: 誘いを丁寧に断るときの自然な前置きで、ほとんどの場合、あとに nie mogę（できません）が続きます。
    example_gloss: 残念ながら、できません。
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: 土曜日に
    gloss: W + 曜日：男性名詞の曜日（piątek, poniedziałek, czwartek）は語尾が変わりません：w piątek。女性名詞の曜日（sobota, środa, niedziela）は、kawa → kawę と同じ対格の語尾 -ę になります：w sobotę。
    note: '*w* の後では、どの曜日も同じ形になるわけではありません。*sobota* のような女性名詞の曜日は *sobotę* に変わります。これは *kawa* → *kawę*、*herbata* → *herbatę* で学んだ *-a* → *-ę* と全く同じ語尾です。*piątek* のような男性名詞の曜日は、そのままの形です。'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: 土曜日に来られますか？
    gloss: 土曜日に来られますか？
    note: możesz、przyjść、そして新しく学んだ w sobotę の形を組み合わせた文です。別の日について尋ねる完全な言い方です。
  pl.a1.unit11.lesson03.teach.moze:
    title: たぶん、〜はどう
    gloss: たぶん／〜はどう？
    note: 代案を出すときの言葉です。最初の予定がうまくいかず、別の案を出したいときにいつも使えます。
    example_gloss: 土曜日はどうですか？
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może と mogę の違い
    gloss: Może と mogę は似ていますが、意味が違います。może（「たぶん」）は新しい案を出すときに使い、mogę（動詞の「私」の形、「私は〜できる」）は自分にできることを表します。
    note: 文字で見ると間違えやすい二つです。*może*（「たぶん」。ここでは何かを提案するときに使います）と *mogę*（「私は〜できる」という一人称の動詞）は、同じ語源でも文の中での働きが違います。最後の文字に注意しましょう。
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: 何時に？
    gloss: 何時に？
    note: 日にちがすでに決まったあとで、具体的な時間を尋ねる標準的な言い方です。o której は前の時間の単元で出てきました。
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa が映画を提案する
    gloss: Ewa は Marek に、金曜日に映画館へ行きたいかと尋ねます。
    note: この単元で最初に学んだ質問を、実際の会話の中で再び使っています。
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek は金曜日は無理
    gloss: Marek は、残念ながら金曜日は行けないと言います。
    note: Niestety で断りを和らげてから、nie mogę ではっきり伝えます。
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek が土曜日を提案する
    gloss: Marek は「土曜日はどう？」と尋ねます。
    note: Może は、断って会話を終わらせるのではなく、代案を出す言葉です。
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa が喜んで承諾する
    gloss: Ewa は「土曜日？ ぜひ！」と言います。
    note: 提案された日を（w sobotę の形のまま）繰り返してから、chętnie で承諾します。
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa が時間を尋ねる
    gloss: Ewa は「何時に？」と尋ねます。
    note: 日にちが決まったので、最後に決める細かい点は時間です。
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek が時間を伝える
    gloss: Marek は「午後4時に」と言います。
    note: 前の時間や日課の単元で学んだ時刻のパターンを使い、具体的な時間を決めて話をまとめます。
