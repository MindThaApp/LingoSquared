    title: Lubię の文型
    gloss: '*Lubię* +季節で、どの季節が好きかを言います:*Lubię lato.* 季節は対格になります:*wiosnę*、*zimę*。'
    note: '*Lubię*(「私は好きです」)は対格をとります。*-a* で終わる女性名詞は *-ę* に変わります(*zima* → *zimę*、*wiosna* → *wiosnę*)。一方、*jesień* と *lato*(*-o* で終わる名詞)は形が変わりません。季節についてどう思うかを言うときは、*Uważam* +対格+ *za* +形容詞を使います:*Uważam jesień za ładną*。'
