    title: 季節についての会話
    gloss: 今は春です。チューリップがきれいです。ニナが「どの季節がきれいだと思う?」と尋ねます。マレクは「夏が好き。夏は泳ぐよ」と言います。エヴァは「冬が好き。冬はスケートをするの」と言います。
