teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: 家、です、持っている ― おさらい
    gloss: 'Dom, jest, ma, Marek, Ewa ― これらの単語は前のレッスンで学びました。例： 「Dom jest tam」(家はそこにあります)。'
    note: このレッスンで自分の家について話す前に、簡単におさらいします。
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: アパート
    gloss: アパート
    note: 一軒家ではなく、集合住宅の一戸のことです。
    example_gloss: エヴァはアパートに住んでいます。
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: 大きい
    gloss: 家は大きいです。― 「*duży*」は「*dom*」のような男性名詞に合わせて使います。
    note: このコースで大きさを表す単語が出てくるのは初めてです。今のところ「*dom*」にだけ使います。
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: マレクの家
    gloss: マレクは家を持っています。その家は大きいです。
    note: このユニット全体で、マレクについての土台になる事実です。
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: エヴァの家
    gloss: エヴァはアパートに住んでいます。
    note: このユニット全体で、エヴァについての土台になる事実です。
  pl.a1.unit18.lesson01.teach.pokoj:
    title: 部屋
    gloss: 部屋
    note: 家の中のどんな部屋にも使える一般的な言葉です。
    example_gloss: 部屋はどこですか？
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: 部屋はいくつ？
    gloss: 部屋はいくつありますか？部屋が2つあります。― 「Ile」、数字、「mam」/「masz」は前のレッスンで学びました。「*pokoi*」と「*pokoje*」は「*pokój*」の形です。
    note: 「*Pokoi*」は「*Ile*」のすぐ後に使い、「*pokoje*」は「*dwa*」「*trzy*」「*cztery*」(2、3、4)のすぐ後に使います。
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: 部屋はいくつありますか？
    gloss: 部屋はいくつありますか？
    note: 相手の家について尋ねるときの自然な質問です。
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: 部屋が2つあります
    gloss: 部屋が2つあります。
    note: 上の質問に対する自然な答えです。
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: キッチン
    gloss: キッチン
    note: 家の中で最もよくある部屋の一つです。
    example_gloss: キッチンは小さいです。
  pl.a1.unit18.lesson02.teach.mala_note:
    title: 小さい
    gloss: キッチンは小さいです。― 「*mała*」は「*kuchnia*」のような女性名詞に合わせて使います。
    note: これは「*duży*」(大きい)とは別の単語です。今のところ「*kuchnia*」にだけ使います。
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: 寝室
    gloss: 寝室
    note: 寝る部屋です。
    example_gloss: 寝室はどこですか？
  pl.a1.unit18.lesson02.teach.lazienka:
    title: バスルーム
    gloss: 浴室
    note: シャワーやトイレがある部屋です。
    example_gloss: バスルームはどこですか？
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: どこ、そこ ― おさらい
    gloss: 'Gdzie, tam ― これらの単語は前のレッスンで学びました。例： 「Bank jest tam」(銀行はそこにあります)。'
    note: このレッスンで部屋について話す前に、簡単におさらいします。
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: 部屋で、キッチンで…
    gloss: 'W + 部屋・キッチン・寝室・バスルーム： w pokoju, w kuchni, w sypialni, w łazience ― w szkole(学校で)や w biurze(オフィスで)と同じパターンです。'
    note: すでに学んだ職場の言葉と同じ考え方です。その部屋の「中で」を表すために、語尾が少し変わります。
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: バスルームはどこ？
    gloss: バスルームはどこですか？バスルームはあそこです。
    note: 人の家で部屋を探すときの自然なやり取りです。
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: キッチンは小さいです
    gloss: キッチンは小さいです。
    note: このレッスンの前半に出た大きさの言葉をもう一度使います。
  pl.a1.unit18.lesson03.teach.recap_words:
    title: はい、と、です(複数)― おさらい
    gloss: Tak, i, są, A, ja, jeden ― これらの単語は前のレッスンで学びました。
    note: このレッスンの会話の前に、簡単におさらいします。
  pl.a1.unit18.lesson03.teach.lodowka:
    title: 冷蔵庫
    gloss: 冷蔵庫
    note: キッチンによくある家電です。
    example_gloss: キッチンに冷蔵庫があります。
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: オーブン
    gloss: オーブン
    note: キッチンによくあるもう一つの家電です。
    example_gloss: キッチンにオーブンがあります。
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: マレクが自分の家を説明する
    gloss: 家があります。その家は大きいです。
    note: マレクは自分の家の説明から会話を始めます。
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: エヴァが部屋の数を尋ねる
    gloss: 部屋はいくつありますか？
    note: エヴァは続けて自然な質問をします。
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: マレクが答える
    gloss: 部屋は2つあります。家にはキッチン、寝室、バスルームがあります。
    note: マレクは部屋の数を答え、家にある部屋を挙げます。
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: エヴァが自分の家を説明する
    gloss: わたしはアパートに住んでいます。部屋は1つです。
    note: エヴァは、自分のもっと小さな家の話に移ります。
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: エヴァがキッチンについて尋ねる
    gloss: キッチンは小さいですか？
    note: エヴァはマレクのキッチンについて続けて質問します。
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: マレクが答える
    gloss: はい、キッチンは小さいです。キッチンには冷蔵庫とオーブンがあります。
    note: マレクはキッチンの大きさを認め、中にある2つのものを挙げます。
