teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: 電話する
    gloss: 電話する
    note: 電話をかけることを表す動詞の不定詞です。
    example_gloss: あなたに電話しなければなりません。
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: 電話すると伝える
    gloss: あなたに電話します。
    note: '*Zadzwonię* は *zadzwonić*(電話する、一回きり)の完了体の未来形です。ポーランド語では「電話するね」という約束にこの形を使います。'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: 電話に出る
    gloss: もしもし、エヴァです。
    note: '*Tu* + 名前(直訳「ここは…」)は、電話で名乗るときの標準的な言い方です。'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: マレクも同じように答える
    gloss: もしもし、マレクです。
    note: '*Halo, tu Ewa* と同じ *tu* + 名前のパターンです。'
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: 誰からの電話か尋ねる
    gloss: どちら様ですか？
    note: '*Z kim rozmawiam?*(直訳「誰と話していますか」)は、知らない相手からの電話での標準的な言い方です。*kim* は *z* の後の造格です。'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: 丁寧に名乗る
    gloss: エヴァさんとお話しされています。
    note: '*Rozmawia pan z Ewą* は丁寧な言い方です：*pan*(男性に)または *pani*(女性に)+三人称の動詞、そして *z* + 造格を使います。'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: もう一度言ってもらう
    gloss: それをもう一度言ってもらえますか？
    note: '*Możesz*(できますか、*móc* から)+不定詞 *powtórzyć*(繰り返す)+*to*(それ)。'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: ゆっくり話してもらう
    gloss: そんなに速く話さないでください。
    note: '*Nie mów* は否定の命令(話さないで)で、*tak szybko* は「そんなに速く」の意味です。'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: よく聞こえないと伝える
    gloss: よく聞こえません。
    note: '*Nie słyszę cię dobrze* は聞こえにくいことを伝える言い方です。*cię* は *ty* の対格で、*dobrze* は「よく」の意味です。'
  pl.a1.unit22.lesson04.teach.sms:
    title: メッセージ
    gloss: メッセージ
    note: '*SMS* は外来語の男性名詞です：*ten SMS*。'
    example_gloss: そのSMSはエヴァからです。
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: メッセージを送ると伝える
    gloss: あなたにメッセージを送ります。
    note: '*Wysłać*(送る)は、相手には与格 *ci*(あなたに)、送るものには対格を取ります：*Wyślę ci SMS*。'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: かけ直すと伝える
    gloss: 後でかけ直します。
    note: '*Oddzwonić*(かけ直す)はポーランド語では一語の動詞です：*oddzwonię później*。'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: メッセージのやり取りを読む
    gloss: マレク：やあ、エヴァ。電話してくれる？伝えたいことがあるんだ。エヴァ：うん、もちろん。5分後にかけ直すね。
    note: マレクが何を頼んでいるか、それはなぜか、そしてエヴァがいつかけ直すと言っているかに注目しましょう。
    glosses:
      Cześć: やあ
      możesz: できる
      zadzwonić: 電話する
      Muszę: ~しなければならない
      coś: 何か
      powiedzieć: 伝える
      oczywiście: もちろん
      oddzwonię: 電話をかけ直す
      pięć: '5'
      minut: 分
      za: 〜後に
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: マレクが電話に出る
    gloss: マレク：もしもし、マレクです。
    note: レッスン1と同じ *tu* + 名前のパターンを、実際の電話で使っています。電話に出た人が先に話し、名前を名乗ります。
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: エヴァが名乗る
    gloss: エヴァ：こんにちは、マレク。エヴァだよ。マレク：電話をくれてうれしいな！
    note: '*Fajnie, że* ...(…ということがうれしい)は、出来事に対する前向きな反応を表します。*że* が節を導きます。'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: エヴァがシフトについてたずねる
    gloss: エヴァ：初めてのシフトはどうだった？
    note: '*Jak ci poszła ...?*(直訳「…はあなたにとってどう進みましたか」)は、すでに起きたことをたずねる言い方です。*Ci* は *ty* の与格で、*poszła* は女性名詞 *zmiana* に合わせた形です。'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: マレクが良い知らせを伝える
    gloss: マレク：とてもうまくいったよ。思っていたよりずっと良かった。
    note: '*Poszło* は *iść* の過去形で、語尾 *-o*(「それ」、ここでは「~という結果になる」)がついています。*myślałem* は *myśleć*(考える)の過去形で、男性の話し手の語尾です。'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 過去形：było、poszło、myślałem
    gloss: 過去形：*było*(あった)は *być*(~である)から、*poszło*(行った、うまくいった)は *iść*(行く)から、*myślałem*(私は思った)は *myśleć*(考える)からできます。
    note: ポーランド語の過去形は *-ł-* に性を表す語尾を付けて作ります：*myślał*(彼)、*myślała*(彼女)、*było*(それ)。今は、このレッスンに出てくる場面で、*było*、*poszło*、*myślałem* を決まった形として覚えてください。
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewaは誇らしい
    gloss: 'Ewa：それを聞けてうれしいです！あなたを誇りに思います。'
    note: '*Dumny z*(~を誇りに思う)は決まった組み合わせで、*z* の後に生格が来るので *z ciebie* となります。Ewaは女性なので *dumna* と言います。'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marekは感激している
    gloss: 'Marek：ありがとう、私にはとても大きな意味があります。'
    note: '*Znaczy* は *znaczyć*(意味する)の *on/ona/ono* の形です。*dla mnie*(私にとって)で、誰にとって大切かを表します。'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: 彼の
    gloss: 彼の初めてのシフトはとてもうまくいきました。
    note: '*Jego*(彼の)は形が変わらず、名詞の前に置きます：*jego pierwsza zmiana*。女性名詞でも形は変わりません。'
