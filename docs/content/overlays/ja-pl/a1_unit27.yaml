  pl.a1.unit27.lesson01.teach.gram_w_pilke:
    title: 私はサッカーをします
    gloss: 私はサッカーをします。
    note: '*Gram w piłkę nożną*(直訳は「私はサッカーの中でプレーする」)は、*grać w* + 対格を使います。ほかのスポーツには別の動詞を使います。文法ノートを見てください。'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: スポーツごとの動詞
    gloss: スポーツにはそれぞれ決まった動詞があります:*gram w piłkę nożną*、*biegam*、*pływam*、*ćwiczę jogę*。
    note: この段階では、スポーツごとに別の動詞を覚える必要はありません。一つの構文で、どのスポーツも言い表せます。
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
    title: 週に～回
    gloss: 週に～回
    example_gloss: 私は週に2回ヨガをします。
  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: '*codziennie*(毎日)と*często*(よく)はもう知っていますね。*Dwa razy w tygodniu*(週に2回)は、頻度をもっと具体的に言う新しい表現です。'
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: 私は週に2回ヨガをします
    gloss: 私は週に2回ヨガをします。
  pl.a1.unit27.lesson02.teach.marek_czesto_gra:
    title: マレクはよくサッカーをします
    gloss: マレクはよくサッカーをします。
    note: '*Często*(よく)は頻度を表す副詞で、動詞の前に置きます:*Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport と gram w の違い
    gloss: '*Uprawiam sport* は、運動をしていることを一般的に言う表現です。*gram w piłkę nożną* のような動詞は、具体的なスポーツを表します。どちらも正しいポーランド語です。'
    note: '*Uprawiać sport* は趣味のレッスンで学んだ一般的な動詞で、*grać w* などの動詞は具体的なスポーツを表します。一方は一般的、もう一方は具体的です。'
