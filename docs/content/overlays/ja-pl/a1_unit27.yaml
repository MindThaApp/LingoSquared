  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać は人称によって変わる
    gloss: '*Biegać*(走る)は人称によって語尾が変わります:*biegam*(私は走る)、*biegasz*(あなたは走る)、*biega*(彼は走る)。'
    note: ポーランド語の動詞は人称ごとに異なる語尾を取るので、主語の代名詞は通常省略されます:*biegam*、*biegasz*、*biega*。
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
    title: マレクの反応
    gloss: マレク:いいですね、僕はそこでよくサッカーをしています。
  pl.a1.unit27.lesson05.teach.ewa_cwiczy_joge:
    title: エヴァとカシアのスポーツ
    gloss: エヴァは週に2回ヨガをしています。穏やかに体を動かすのが大好きです。カシアはヨガはしませんが、泳ぐのが大好きです。カシアはほぼ毎週、よく泳いでいます。あなたはどんなスポーツをしていますか?
    note: 短い読み物の中で、2つの異なるスポーツと2つの異なる頻度の表現を対比しています。
    glosses:
      ćwiczy: する
      dwa: '2'
      razy: 回
      tygodniu: 週
      jogę: ヨガ
      uwielbia: 大好きである
      spokojny: 穏やかに
      ruch: 動く
      pływać: 泳ぐこと
      pływa: 泳ぐ
      często: よく
      prawie: ほとんど
      jaki: どの
      sport: スポーツ
  pl.a1.unit27.lesson05.teach.kasia_czesto_plywa:
    title: カシアはほぼ毎週、よく泳いでいます
    gloss: カシアはほぼ毎週、よく泳いでいます。
  pl.a1.unit27.lesson05.teach.gram_w_pilke:
    title: 私はサッカーをします。サッカーが大好きです
    gloss: 私はサッカーをします。サッカーが大好きです
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  pl.a1.unit27.lesson06.teach.ewa_moze_pocwiczymy:
    title: エヴァが提案する
    gloss: エヴァ:一緒に運動しませんか?
  pl.a1.unit27.lesson06.teach.moze_pocwiczymy_razem:
    title: Może poćwiczymy ...?
    gloss: '*Może poćwiczymy ...?*(直訳は「たぶん私たちは運動する?」)は、一緒に何かをしようと提案する言い方です。前のレッスンですでに知っているかもしれません。'
    note: 予定についての課で学んだ、何かを一緒にしようと提案する構文をそのまま使っています。
  pl.a1.unit27.lesson06.teach.kasia_tak_fajnie:
    title: カシアが賛成する
    gloss: カシア:はい、いいですね!私は泳ぐのが大好きです。
  pl.a1.unit27.lesson06.teach.marek_wole_grac:
    title: マレクはサッカーのほうがいい
    gloss: マレク:僕はサッカーをするほうがいいです。
  pl.a1.unit27.lesson06.teach.tomek_a_ja:
    title: トメクは走るのが好き
    gloss: トメク:僕は走るのが好きです。
