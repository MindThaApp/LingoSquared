teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: 昨日
    gloss: 昨日
    note: 最近の終わった一日について話すときの基本の時間表現です。この単元で学ぶ過去形と自然に組み合わせて使えます。
    example_gloss: 昨日は映画館にいました。
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: 昨日は何があった?
    gloss: 昨日は何があった?
    note: 最近の出来事を話してもらうときの自然な聞き方です。było は答える人によって変わらないので、誰にたずねるときにも使えます。
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: było は動詞 być(いる・ある)の過去形の中性形(「それ」にあたる形)です。co(何)に合わせた形なので、「何があったか」を広くたずねる Co było wczoraj? で使います。答える人が誰でも同じ語です。
    note: '*Było* は中性形の「〜だった/あった」で、たずねる相手ではなく *co*(何)に合わせた形です。そのため *Co było wczoraj?* のような開かれた質問では「何があった?」の意味になります。'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: (私は)いた(男性/女性)
    gloss: (私は)いた(男性が言う場合)/(私は)いた(女性が言う場合)
    note: ポーランド語の過去形では話し手の性別が表れます。男性が話すなら byłem、女性が話すなら byłam です。どちらも「私はいた」という意味で、違いはありません。
    example_gloss:
    - 昨日は映画館にいました。
    - 昨日は映画館にいました。
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 過去形:-em と -am
    gloss: 過去形の動詞の語尾は、話し手の性別によって変わります。男性が話すなら -em(byłem)、女性が話すなら -am(byłam)です。これは być だけでなく、過去形のすべての動詞に当てはまります。
    note: 最後の文字に注目しましょう。*-em* は男性が話していること、*-am* は女性が話していることを表します。この単元の過去形の動詞はすべて同じパターンです。
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: 映画館で
    gloss: kino は w の後で語尾が変わります。idę do kina(どこへ?)と jestem w kinie(どこで?)では形が違います。w kinie は前置格で、誰かが行く先ではなく、何かが起こる「場所」を表します。
    note: 2つの異なる語尾は、2つの異なる問いに対応します。*do kina* は「どこへ?」(計画の単元で学びました)、*w kinie* は「どこで?」の答えです。混同しないようにしましょう。
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: 昨日は映画館にいました(男性)
    gloss: 昨日は映画館にいました。
    note: byłem、wczoraj、w kinie を組み合わせた文で、男性が自分がいた場所を伝える言い方です。
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: 昨日は映画館にいました(女性)
    gloss: 昨日は映画館にいました。
    note: 同じ文を byłam で言ったものです。女性が自分がいた場所を伝える言い方です。
  pl.a1.unit12.lesson02.teach.film:
    title: 映画
    gloss: 映画
    note: 見たものについて話すときの日常的な語です。映画館に行った話をするとき、何度も出てきます。
    example_gloss: 良い映画を見ました。
  pl.a1.unit12.lesson02.teach.dobry:
    title: 良い
    gloss: 良い
    note: dobry は dzień dobry(こんにちは)の中で既に出てきました。ここでは単独で、ふつうの形容詞「良い」として使われています。
    example_gloss: とても良い映画!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: (私は)見た(男性/女性)
    gloss: (私は)見た(男性が言う場合)/(私は)見た(女性が言う場合)
    note: zobaczyć は、一度きりの完了した「見る」行為を表します(続いている「見える」を表す widzieć とは違います)。男性が話すなら zobaczyłem、女性が話すなら zobaczyłam で、byłem/byłam と同じ -em/-am のパターンです。
    example_gloss:
    - 良い映画を見ました。
    - 良い映画を見ました。
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: byłem/byłam と同じパターン
    gloss: byłem/byłam と同じパターンです。zobaczyłem は男性が、zobaczyłam は女性が言います。zobaczyć は完了体の動詞で、1回の終わった出来事を表します。
    note: 語尾は同じで、動詞が新しくなっただけです。*zobaczyłem/zobaczyłam* は、今学んだ *byłem/byłam* とまったく同じパターンです。
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: (私は)作った/した(男性/女性)
    gloss: (私は)作った/した(男性が言う場合)/(私は)作った/した(女性が言う場合)
    note: zrobić は、一度きりの完了した行為について「作る」と「する」の両方を表します。男性は zrobiłem、女性は zrobiłam で、ここでも同じパターンです。
    example_gloss:
    - 昼食を作りました。
    - 昼食を作りました。
  pl.a1.unit12.lesson02.teach.obiad:
    title: 昼食
    gloss: 昼食
    note: 日課の単元で obiad が出てきたのを覚えているかもしれません。ここでは、マレクがその日のメインの食事として作るものです。
    example_gloss: これはおいしい昼食です。
  pl.a1.unit12.lesson02.teach.pyszny:
    title: おいしい
    gloss: おいしい
    note: 食べ物をほめる、温かみのある日常的な言い方です。obiad の話の流れで自然に出てきます。
    example_gloss: これはおいしい昼食です。
  pl.a1.unit12.lesson03.teach.jaki:
    title: どんな/どの
    gloss: どんな/どの
    note: 以前、電話番号や曜日をたずねるときに jaki が出てきましたね。ここでも同じように、具体的な詳細をたずねるために使います。どの映画?
    example_gloss: これはどんな映画ですか?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: 一語の短い質問
    gloss: 会話では、一語だけの短い質問ができます。例えば、Czy obiad był pyszny? という完全な質問の代わりに Pyszny? と言えます。自然で素早く、日常会話らしい言い方です。
    note: 文脈からすでに分かるとき、実際の会話では完全な文を省きます。*Pyszny?* だけで「おいしかった?」という意味になります。
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek が何があったかをたずねる
    gloss: こんにちは、Ewa! 昨日は何があったの?
    note: この単元で最初に習った質問を、ここでは実際の会話の始まりに使っています。
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa は映画館にいた
    gloss: 映画館にいたの! いい映画を見たよ。
    note: Byłam と zobaczyłam はどちらも女性形で、話しているのが Ewa だと分かります。
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek がどんな映画かをたずねる
    gloss: どんな映画?
    note: jaki を使った、短くて自然な続きの質問です。
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa が答えて、聞き返す
    gloss: とてもいい映画! あなたは?
    note: A ty?(あなたは?)を使えば、新しい文法を使わずに会話を Marek に返せます。
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek は昼ご飯を作った
    gloss: 昼ご飯を作ったよ!
    note: Zrobiłem は男性形で、話しているのが Marek だと分かります。この日に自分が済ませたことです。
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa がおいしかったかをたずねる
    gloss: おいしかった?
    note: 一語の質問で、この課の文法ノートで見たパターンそのものです。
