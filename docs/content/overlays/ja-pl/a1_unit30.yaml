    gloss: トメクは働いているだけでなく、勉強もしています。成人教育センターでスペイン語の講座に通っています。毎週、新しい単語を学んでいます。カシャは大学で専攻の勉強をしています。そこで医療・介護(ヘルスケア)を勉強しています。二人とも勉強が好きです。あなたは何を勉強していますか。それとも、何を学びたいですか。
