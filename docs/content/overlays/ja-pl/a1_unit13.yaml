teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: 音楽
    gloss: 音楽
    note: 好きなものや嫌いなものを話すときの定番の話題です。
    example_gloss: 私は音楽が好きです。
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: lubić(好む)の後に目的語が来ると、muzyka は muzykę に変わります。kawa が kawę になるのと同じです。Lubię muzykę であって、Lubię muzyka ではありません。
    note: すでに知っているパターンと同じです。*kawa* が *kawę* になるように、*muzyka* も *lubię* の目的語になると *muzykę* になります。
  pl.a1.unit13.lesson01.teach.lubisz:
    title: あなたは好き
    gloss: あなたは好き(親しい相手に)
    note: lubić の ty の形です。友達に何かが好きかどうかを直接たずねるために必要な形です。
    example_gloss: 音楽は好きですか?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: Lubić(好む):lubię(私)、lubisz(あなた)、lubi(彼・彼女)。lubię と lubi はすでに知っています。lubisz は新しい形で、話している相手に使います。
    note: '*Lubię* と *lubi* はもうおなじみですね。*lubisz* は、同じ動詞の足りなかった「あなた」の形を補います。'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: 音楽は好きですか?
    gloss: 音楽は好きですか?
    note: Czy ではじめると、はい・いいえで答える質問になります。友達に好みをたずねる自然な言い方です。
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: はい、好きです。
    gloss: はい、好きです。
    note: 短くて自然な答えです。muzykę という語を繰り返す必要はありません。
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: いいえ、好きではありません。
    gloss: いいえ、好きではありません。
    note: Nie nie lubię は nie が重なって見えますが、間違いではありません。最初の nie は質問への答えで、二つ目の nie は lubię を否定しています。
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: 短い答え
    gloss: 短い答え:Tak, lubię. / Nie, nie lubię. -- 質問から何のことか分かるので、muzykę という語を繰り返す必要はありません。
    note: '*Pyszny?* だけで成り立つのと同じように、*Tak, lubię.* も何の話かをもう一度言う必要はありません。文脈が伝えてくれるからです。'
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: 音楽が大好きです
    gloss: 音楽が大好きです。
    note: Bardzo(とても)は、単なる好みを強めます。bardzo は最初の課からすでに出てきています。
  pl.a1.unit13.lesson02.teach.wole:
    title: 私は〜のほうが好き
    gloss: 私は〜のほうが好き
    note: この課で初めて出てくる動詞 woleć(〜のほうを好む)です。ここでは lubię と同じく「私」の形だけを学びます。
    example_gloss: 紅茶のほうが好きです。
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: Woleć:この課では wolę だけ
    gloss: Woleć(〜のほうを好む):wolę(私は)。この課では lubię と同じく「私」の形だけを学びます。Wolę kawę. = コーヒーのほうが好きです。
    note: 今のところ *woleć* の *ja*(私)の形だけです。*lubię* を最初に学んだときと同じ範囲です。
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: コーヒーと紅茶、もう一度
    gloss: Wolę + 目的語:kawa は kawę、herbata は herbatę になります。すでに知っているのと同じパターンです。
    note: 前と同じ対格のパターンで、動詞が新しくなっただけです:*wolę kawę*、*wolę herbatę*。
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: コーヒーのほうが好きです
    gloss: コーヒーの方が好きです。
    note: wolę を使った、好みをそのまま述べる文です。
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: 紅茶のほうが好きです
    gloss: 紅茶のほうが好きです。
    note: kawę の代わりに herbatę を使った、同じパターンです。
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: 「または」を表す czy
    gloss: Kawa czy herbata? の czy は、はい・いいえの質問の文頭に付く czy とは別のものです。ここでは二つの選択肢をつなぎ、「か」「または」の意味になります。Kawa czy herbata? = コーヒーと紅茶、どちらですか?
    note: 注意:*czy* はふつうはい・いいえの質問を始めますが、このように名詞と名詞の間にあると「または」の意味になります。
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: コーヒーそれとも紅茶?
    gloss: コーヒーそれとも紅茶?
    note: 相手に選んでもらうときの、短くて自然な言い方です。
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: 私もです
    gloss: 私も
    note: 相手の言ったことに同意するときの短い言い方です。
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też をもう一度
    gloss: Ja też は「私も」という意味です。日課の課ですでに出てきました(Ja też wstaję o siódmej「私も7時に起きます」)。
    note: このフレーズは前にも出てきた、というちょっとした復習です。
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? に動詞は不要
    gloss: 前の課の Pyszny? と同じように、短い質問 Kawa czy herbata? にも動詞は要りません。文脈で十分です。
    note: '*Pyszny?* と同じパターンです。文脈ではっきり分かるので、動詞のない短い質問で済みます。'
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: マレクがエヴァに音楽が好きか尋ねる
    gloss: 音楽は好きですか?
    note: マレクは、この課で学んだ質問で会話を始めます。
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: エヴァは好きだと答え、聞き返す
    gloss: はい、大好きです!あなたは?
    note: A ty?(あなたは?)で、質問をマレクに返します。前の課にも出てきたパターンです。
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: マレクも同意して、飲み物について尋ねる
    gloss: 私も好きです。コーヒーと紅茶、どちらがいいですか?
    note: Ja też lubię で相手の答えに同意してから、「どちらか」を選ぶ新しい質問に話題を変えます。
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: エヴァはコーヒーのほうが好き
    gloss: コーヒーの方が好きです。
    note: エヴァ自身の好みを wolę で述べています。日課の課に出てきた、コーヒーを飲むあのエヴァです。
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: マレクは紅茶のほうが好き
    gloss: 紅茶のほうが好きです。
    note: マレク自身の好みで、エヴァとは反対の選択です。
