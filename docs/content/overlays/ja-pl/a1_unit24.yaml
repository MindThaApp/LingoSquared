  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: 読書、運動、料理
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: 音楽、絵、ゲーム
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: 自由時間には何をしますか？
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: エヴァとマレクが趣味について話す
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: マレクとエヴァが趣味を比べる
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: 一緒に週末の予定を立てる
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: 'よく使う趣味の動詞が三つあります: *czytać*(読む)、*uprawiać sport*(スポーツをする)、*gotować*(料理する)。'
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: 自由時間
    gloss: 自由時間
    note: '*Wolny czas* は趣味を話すときの重要なフレーズです。形容詞 *wolny*(自由な)は男性名詞 *czas* に合わせた形です。*w wolnym czasie* では、どちらも前置格になっています。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Lubię*(私は好きです)の後ろには不定詞が来ます: *lubię czytać*。*W wolnym czasie* では *w* + 前置格を使います。'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: '趣味をさらに三つ: *słuchać muzyki*(音楽を聴く)、*rysować*(絵を描く)、*grać w gry*(ゲームをする)。'
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Słuchać* の後ろは常に生格です: *słucham muzyki* であって、*muzyka* ではありません。'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Z przyjaciółmi*(友達と)では、*z* + 複数造格を使います。'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: '基本の頻度を表す副詞は四つ: *zawsze*、*często*、*czasami*、*nigdy*。形は変わりません。また *nigdy* を使うときは動詞の前に *nie* が必要です: *Nigdy nie gram.*'
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Co tydzień* と *co weekend* はどちらも「毎~」という意味です。*co* の後ろは対格で、co 自体は形が変わりません。次のカードを見てください。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + 対格
    gloss: '*Co* + 対格は「毎~」という意味です: 毎週、毎週末、毎月。'
    note: '*Co* は、どの名詞が来ても形の変わらない「毎~」を表す一つの語です。*tydzień*、*weekend*、*miesiąc* のような男性の無生名詞は、主格と対格が同じ形です。'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: エヴァが趣味の話を切り出す
    gloss: 'エヴァ: 私たちはよく一緒に散歩しますよね。ほかに、自由な時間には何をしているんですか、マレク?'
    note: '*Spacerujemy* は *spacerować* の *my*(私たち)の形です。*Marku* は呼格で、相手に直接呼びかけるときに使います。'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: マレクの趣味
    gloss: 'マレク: 料理が好きで、家でもします。それに、よく運動もしています。'
    note: '*Także w domu*(家でも)は、マレクが仕事だけでなく楽しみとしても料理をすることを表します。*w domu* は前置格です。'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: エヴァが驚く
    gloss: 'エヴァ: 家でも料理するんですか? 仕事で一日中作っているのに!'
    note: '*Cały dzień*(一日中)は、マレクが職場ですでにたくさん料理していることを強調しています。*przecież* は「だって~じゃないですか」というニュアンスを加えます。'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: マレクが説明する
    gloss: 'マレク: ええ、でも料理をするとほっとするんです。あなたは、何をするのが好きですか?'
    note: '*Gotowanie mnie odpręża* は直訳すると「料理が私をリラックスさせる」です。ポーランド語では、このように行為を主語にして、*mnie*(私を)を対格にする言い方がよくあります。'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: エヴァの趣味
    gloss: 'エヴァ: 読書が好きで、よく音楽を聴きます。'
    note: レッスン1と2の趣味の動詞を、*i*(〜と、そして)で1つの文にまとめています。
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: マレクがゲームについて尋ねる
    gloss: マレク:あなたもゲームをしますか?
    note: '*grać w gry*(ゲームをする)を使った、はい・いいえで答える短い質問です。*też* は「〜も」という意味です。'
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: エヴァの答え
    gloss: エヴァ:いいえ、ゲームは全然しません。でも、ときどき絵を描きます!
    note: 第3課の *nigdy*(決して〜ない)と *czasami*(ときどき)を1つの答えで対比しています。二重否定に注意:*nigdy nie gram*。
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: 趣味を比べる
    gloss: マレクと私はよく一緒に散歩します。でも、ほかの趣味もあります。マレクは料理が好きで、家でも作りますし、よくスポーツもします。私は読書が好きで、よく音楽を聴きます。ときどき絵を描きますが、ゲームは全然しません。あなたは自由な時間に何をするのが好きですか?
    note: エヴァのメッセージは第4課の内容をまとめ、最後にこのユニットの中心となる質問を読み手にしています。
    glosses:
      spacerujemy: 散歩する
      często: よく
      razem: 一緒に
      inne: ほかの
      gotować: 料理する
      lubi: ～するのが好き
      domu: 家で
      uprawia: 運動する
      czytać: 読む
      słucham: 聴く
      muzyki: 音楽
      rysuję: 絵を描く
      czasami: 時々
      gram: ビデオゲームをする
      nigdy: 決して〜ない
      wolnym: 自由な
      czasie: 時間
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: マレクが週末のことを尋ねる
    gloss: マレク:今週末は何をしますか?
    note: '*W ten weekend*(今週末)は、時を表す表現で *w* + 対格を使います。'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: エヴァはまだ決めていない
    gloss: エヴァ:まだわかりません。読書も好きだけど、外にも出かけたいです。
    note: '*Wyjść na dwór*(外に出る)は、家から出たいときによく使う言い方です。*chcę* + 不定詞は「〜したい」という意味です。'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: マレクが計画を提案する
    gloss: マレク:一緒に散歩に行きませんか?そのあと、僕たちのために何か作ります。
    note: '*Potem*(そのあと)は順序を表す言葉です。*ugotuję* は、料理が出来上がるという結果を表すので完了体です。'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: エヴァが賛成する
    gloss: エヴァ:いい考えですね!散歩も料理も好きです。
    note: '*Lubię i ..., i ...*(〜も〜も好き)は、エヴァが2つのことを同じくらい好きだと表します。'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: マレクが確認する
    gloss: マレク:よかった。じゃあ、土曜日に会いましょう!
    note: 土曜日の計画を確認する、親しみのある締めくくりの一言です。*w sobotę* は曜日を表す *w* + 対格です。
