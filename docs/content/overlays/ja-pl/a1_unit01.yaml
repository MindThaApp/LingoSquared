  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-pl by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Japanese string was translated and adapted. Needs native Japanese review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: ポーランド語 A1
  description: ポーランド語で挨拶をしたり、調子を尋ねたり、自己紹介をしたり、基本的な個人情報をやり取りしたりできるようになります。pan/pani/ty という敬意の区別(ポーランド語では文法にもはっきり表れます)、動詞の語尾の一致、場面に合った自然な言い方のポイントも学びます。
units:
  pl.a1.unit01.greetings:
    title: 挨拶と初対面
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: pan・pani・ty：調子の尋ね方
  pl.a1.unit01.lesson02.greetings_by_time:
    title: 一日の時間帯ごとの挨拶と別れの言葉
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: 名前と出身を伝える
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: 男性への丁寧な呼びかけ
    gloss: 〜さん；あなた(男性への丁寧な呼びかけ)
    note: ポーランド語では、相手との関係によって呼び方を選びます。*pan* は初対面の男性や、仕事上で敬意を払うべき男性に使います。文法上、*pan* は三人称の主語として扱われます。「pan jest」は直訳すると「あの方は〜です」で、「あなた」の意味で使われていても、本当の二人称の形ではありません。日本語で相手を名前や「〜さん」で呼ぶ感覚に近いところがあります。
  pl.a1.unit01.lesson01.teach.pani:
    title: 女性への丁寧な呼びかけ
    gloss: 〜さん；あなた(女性への丁寧な呼びかけ)
    note: '*pan* の女性形です。初対面の女性や、仕事上で敬意を払うべき女性には *pani* を使います。成人女性であれば、結婚しているかどうかに関係なく *pani* と呼びます。日常の呼びかけで未婚・既婚を区別することはありません。'
  pl.a1.unit01.lesson01.teach.ty:
    title: 親しい「きみ・あなた」
    gloss: あなた、君(親しい相手に対して・単数)
    note: '*Ty* は、友人、同年代の人、家族、子どもなど、親しい間柄の一人に対して使います。*pan*/*pani* と違って、*ty* には本当の二人称の動詞語尾がつきます。たとえば *masz*(「あなたは持っている/〜である」)で、三人称の形ではありません。'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: 男性への丁寧な調子の尋ね方
    gloss: お元気ですか？(男性に対して・丁寧)
    note: 直訳は「あの方はどのように過ごしていらっしゃいますか」です。*Ma* は動詞の三人称の形で(*pan* が文法上の主語なので一致しています)、*on*(「彼」)と同じ語尾です。
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: お元気ですか？(女性に対して・丁寧)
    gloss: お元気ですか？(女性に対して・丁寧)
    note: '*Jak się pan ma?* と同じ型で、*pan* の代わりに *pani* を入れます。動詞の形 *ma* は変わりません。相手の性別に関係なく、同じ三人称の語尾です。'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: 親しい相手への体調のたずね方
    gloss: 元気？(親しい相手に対して)
    note: '*ty* のときは、*ma* ではなく本当の二人称の語尾 *masz* がつきます。丁寧な *Jak się pan/pani ma?* と親しい *Jak się masz?* を比べてみましょう。動詞の形そのものに pan/pani と ty の違いが現れているのが聞き取れる、いちばん役に立つ対の例です。'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: 決まった答え方
    gloss: 元気です、ありがとう。
    note: '*Dziękuję*(「ありがとう」)は、相手が *pan*、*pani*、*ty* のどれでも変わりません。丁寧さの違いは質問の側だけに表れます。'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: 丁寧に聞き返す
    gloss: あなたは？(男性に対して・丁寧)
    note: 丁寧に話している男性に、同じ質問を返す短い言い方です。女性に返すときは *pan* を *pani* に替えます(「A pani?」)。
  pl.a1.unit01.lesson01.teach.a_ty:
    title: 親しい相手に聞き返す
    gloss: 君は？（くだけた表現）
    note: 友人や同年代の人に質問を返すときは *ty* を使います。
  pl.a1.unit01.lesson02.teach.czesc:
    title: 親しい間柄の「こんにちは」と「さようなら」
    gloss: やあ；じゃあね(親しい相手に・出会いにも別れにも)
    note: '*Cześć* はポーランド語の挨拶の中では珍しく、同じくだけた場面で「やあ」にも「じゃあね」にも使えます。ただし *ty* で話す間柄でだけ使い、*pan*/*pani* には使いません。'
    example_gloss: やあ、元気ですか？
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: 一日中使える挨拶
    gloss: おはようございます；こんにちは
    note: '*Dzień dobry* は夕方になる前ならいつでも使えます。*cześć* と違って丁寧さに左右されず、*pan*、*pani*、*ty* のどれにも使えます。あまり知らない人への挨拶として、いちばん無難です。'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: 夕方の挨拶
    gloss: こんばんは
    note: 夕方になったら *dzień dobry* の代わりに使います。丁寧さに関係なく使えるのは同じです。
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: 夜の別れの挨拶
    gloss: おやすみなさい
    note: '*dzień dobry* や *dobry wieczór* と違い、*dobranoc* は出会いの挨拶ではなく別れの言葉です。夜に別れるときや寝る前に言い、会話の最初には使いません。'
    example_gloss: おやすみ、ピョトル！
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: 標準的な別れの挨拶
    gloss: さようなら
    note: 丁寧さを気にせず使える、無難な別れの言い方です。*pan*、*pani*、*ty* のどれにも使えます。*do zobaczenia* より、別れの意味合いが強く聞こえます。
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: 「また会いましょう」という別れの挨拶
    gloss: じゃあね；また会おう
    note: 直訳は「(お互いに)会うときまで」です。より中立的な *do widzenia* と違って、また会うことを見込んでいるニュアンスがあります。
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: 丁寧な別れの願いの言葉
    gloss: 良い一日を！
    note: '*Miłego dnia* は願いを表すときに生格を使っており、*smacznego*(「召し上がれ」)と同じ型です。この段階では格ごとに分析せず、決まった表現として丸ごと覚えるのがよいでしょう。'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: 丁寧に名前を尋ねる
    gloss: お名前は何ですか？(男性に対して・丁寧)
    note: 直訳は「あの方は何と名乗っていらっしゃいますか」で、*nazywać się* は「〜という名前である」という意味の再帰動詞です。女性に丁寧に尋ねるときは *pan* を *pani* に替えます。
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: 親しく下の名前を尋ねる
    gloss: お名前(下の名前)は？
    note: こちらは別の言い回し *mieć na imię*(「名前として〜を持つ」)で、フルネームや姓ではなく、特に下の名前を尋ねます。同年代の人に名前を聞くときの、自然で親しい言い方です。
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: フルネームを名乗る
    gloss: 私の名前はアンナ・コヴァルスカです。
    note: '*nazywać się* の一人称の形で、名前と姓を続けて言うのが自然です。より丁寧で、きちんとした自己紹介になります。'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: 下の名前を名乗る
    gloss: 私の名前はアンナです。
    note: '*mieć na imię* の一人称の形で、下の名前だけを続けるのが自然です。*Nazywam się...* に対する、くだけた言い方です。'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: 会えてうれしいという気持ち
    gloss: はじめまして、お会いできてうれしいです。
    note: 初対面のときによく使われる決まった表現で、丁寧な場面でも親しい場面でも使えます。
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: 親しく出身を尋ねる
    gloss: どちらのご出身ですか。
    note: '*Skąd* は「どこから」という意味です。ここでは *ty* で話す親しい形を示しています。丁寧な形 *Skąd pan/pani jest?* は、このレッスンの最後の会話に出てきます。'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: 出身を伝える
    gloss: 私はカナダの出身です。
    note: '*Z*(「〜から」)は生格をとるので、*Kanada* は *Kanady* になります。ほとんどの国名が、*z* の後で同じ型になります。'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: 住んでいる場所を言う
    gloss: 私はワルシャワに住んでいます。
    note: ここでは *w*(「〜に」)が前置格をとるので、*Warszawa* は *Warszawie* になります。出身(*z*)と現在の居住地(*w*)では、地名の格が違います。例外として暗記するのではなく、規則として気づいておくとよいでしょう。
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: 出会いのきっかけ
    gloss: エヴァはマレクに挨拶し、丁寧に名前を尋ねます。
    note: エヴァは初めて会う相手に、丁寧な *pan* を使っています。初対面の仕事の場面や、よく知らない相手との場面では、これが無難な基本です。
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: 出会いのきっかけ(返事)
    gloss: マレクはフルネームを名乗り、お会いできてうれしいと言います。
    note: 丁寧に名前を聞かれたときは、*Nazywam się* にフルネームを続けるのが、自然で完全な答え方です。
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: 出身をたずねる
    gloss: エヴァも同じ気持ちを返し、マレクの出身を丁寧に尋ねます。
    note: '*Skąd pan jest?* はこのレッスンの *Skąd jesteś?* の丁寧な形で、*pan jest*/*pan ma* ですでに見た三人称の動詞の型と同じ *jest* を使います。'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: 出身をたずねる(返事)
    gloss: マレクはカナダ出身だが、ワルシャワに住んでいると言います。
    note: '*Ale*(「しかし」)は、マレクの出身地と今住んでいる所の対比をつないでいます。*jestem z*/*mieszkam w* が示す違いと同じです。'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: 言語能力について尋ねる
    gloss: エヴァはマレクに、ポーランド語を話すかどうか丁寧に尋ねます。
    note: '*Czy* は「はい・いいえ」で答える質問を始める語です。日本語の文末の「か」のように、質問であることを示します。ただし *czy* は文頭に置きます。'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: 言語能力について尋ね、答えて、締めくくる
    gloss: マレクは少し話せて、まだ勉強中だと言い、さよならを言います。
    note: '*Jeszcze się uczę*(「まだ勉強中です」)は、努力を続けていることを謙虚に伝える自然な言い方です。学習者自身が自分について言うのにも役立ちます。'
exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: 男性に対して、丁寧に敬意をこめて呼びかける言葉はどれですか？
    correct_option: pan
    distractors:
    - pani
    - ty
    accepted_answers:
    - pan
    feedback: Pan は男性への丁寧な呼びかけで、三人称の動詞の形をとります。
  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: 女性に対して、丁寧に敬意をこめて呼びかける言葉はどれですか？
    correct_option: pani
    distractors:
    - パン
    - ty
    accepted_answers:
    - pani
    feedback: Pani は女性への丁寧な呼びかけで、pan と同じ三人称の動詞の形をとります。
  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: 親しい友人や同年代の一人に呼びかける言葉はどれですか？
    correct_option: ty
    distractors:
    - パン
    - pani
    accepted_answers:
    - ty
    feedback: Ty は友人、同年代の人、親しい間柄で使い、本当の二人称の動詞語尾をとります。
  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: 男性への丁寧な調子の尋ね方を、正しい順に並べましょう。
    accepted_answers:
    - - Jak
      - się
      - pan
      - ma
    - - Jak
      - pan
      - się
      - ma
  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: 親しい相手への調子の尋ね方を、正しい順に並べましょう。
    correct_response:
    - Jak
    - się
    - masz
  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: 丁寧さを保ったまま、質問を返しましょう。
    correct_option: A pan?
    distractors:
    - A ty?
    - Jak się masz?
    accepted_answers:
    - A pan?
    - A pan
    - A pani?
    - A pani
    feedback: A pan?/A pani? は、質問を返すときに丁寧さを保つ言い方です。
  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: 友人や同年代の人に質問を返しましょう。
    correct_option: A ty?
    distractors:
    - A pan?
    - A pani?
    accepted_answers:
    - A ty?
    - A ty
    feedback: A ty? は、質問を返すときの親しい言い方です。
  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: 親しい相手への質問を直しましょう。ty に合わない動詞の語尾が使われています。
    accepted_answers:
    - Jak się masz?
    - Jak się masz
    - Jak ty się masz?
    - Jak się ty masz?
    feedback: Ty には ma ではなく masz の語尾がつきます。ma は pan/pani(または on/ona)にだけ使います。
  pl.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 質問に丁寧に答えましょう。
    accepted_answers:
    - Dobrze, dziękuję.
    - Dobrze, dziękuję
    - Dziękuję, dobrze.
    - Dobrze, dziękuję. A pan?
    - Dziękuję, dobrze. A pan?
    - Dobrze, dziękuję. A pani?
    - Dziękuję, dobrze. A pani?
  pl.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: くだけた言い方で答え、お礼を言って、相手に同じ質問を返しましょう。
    accepted_answers:
    - Dobrze, dziękuję. A ty?
    - Dobrze, dziękuję, a ty?
    - Dobrze, dziękuję. A ty
    - Dziękuję, dobrze. A ty?
  pl.a1.unit01.lesson02.exercise01.select_hi:
    instruction: くだけた場面で「やあ」にも「じゃあね」にも使える言葉はどれですか？
    correct_option: Cześć
    distractors:
    - Dzień dobry
    - Do widzenia
    accepted_answers:
    - Cześć
  pl.a1.unit01.lesson02.exercise02.select_evening:
    instruction: 夕方や夜に使うあいさつはどれですか？
    correct_option: Dobry wieczór
    distractors:
    - Dzień dobry
    - Dobranoc
    accepted_answers:
    - Dobry wieczór
  pl.a1.unit01.lesson02.exercise03.select_night_meaning:
    instruction: この言葉の意味は何ですか？
    correct_option: おやすみなさい。
    distractors:
    - こんばんは。
    - またね。
    accepted_answers:
    - おやすみなさい。
    feedback: Dobranoc は、夜に別れるときに言う別れの言葉で、出会いの挨拶ではありません。
  pl.a1.unit01.lesson02.exercise04.order_morning:
    instruction: 一日中使える挨拶を、正しい順に並べましょう。
    correct_response:
    - Dzień
    - dobry
  pl.a1.unit01.lesson02.exercise05.order_goodbye:
    instruction: 標準的な別れの挨拶を、正しい順に並べましょう。
    correct_response:
    - Do
    - widzenia
  pl.a1.unit01.lesson02.exercise06.order_see_you:
    instruction: 「また会いましょう」の別れの挨拶を、正しい順に並べましょう。
    correct_response:
    - Do
    - zobaczenia
  pl.a1.unit01.lesson02.exercise07.order_nice_day:
    instruction: 丁寧な結びの言葉を組み立てましょう。
    correct_response:
    - Miłego
    - dnia
  pl.a1.unit01.lesson02.exercise08.reply_to_evening:
    instruction: 夕方の挨拶を返してから、さよならを言いましょう。
    accepted_answers:
    - Dobry wieczór. Do widzenia.
    - Dobry wieczór, do widzenia.
  pl.a1.unit01.lesson02.exercise09.speak_friendly_closing:
    instruction: 親しい人に「また会いましょう」と言いましょう。
    accepted_answers:
    - Do zobaczenia.
    - Do zobaczenia
  pl.a1.unit01.lesson03.exercise01.select_formal_name_question:
    instruction: 男性に丁寧に名前を尋ねる質問はどれですか？
    correct_option: Jak się pan nazywa?
    distractors:
    - Jak masz na imię?
    - Skąd jesteś?
    accepted_answers:
    - Jak się pan nazywa?
    - Jak się pan nazywa
  pl.a1.unit01.lesson03.exercise02.select_informal_name_question:
    instruction: 友人に親しく下の名前を尋ねる質問はどれですか？
    correct_option: Jak masz na imię?
    distractors:
    - Jak się pan nazywa?
    - Jak się masz?
    accepted_answers:
    - Jak masz na imię?
    - Jak masz na imię
  pl.a1.unit01.lesson03.exercise03.comprehend_origin:
    instruction: このせりふを読みましょう。マレクはどこの出身で、どこに住んでいますか？
    correct_option: カナダの出身で、ワルシャワに住んでいます。
    distractors:
    - ポーランドの出身で、カナダに住んでいます。
    - ワルシャワの出身で、カナダに住んでいます。
    accepted_answers:
    - カナダの出身で、ワルシャワに住んでいます。
