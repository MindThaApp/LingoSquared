    title: Pasărea Ninei
teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*Animal* este cuvântul general, iar *mascota* înseamnă anume animal de companie; *mascota* este feminin, chiar și pentru un animal de sex masculin.'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Elena are un câine.
    - Diego are o pisică.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: Același tipar de întrebare *¿Tienes ...?* pe care îl știi deja din unitățile anterioare.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: '*No tengo mascota* pune pur și simplu *no* înaintea verbului; vezi nota de gramatică.'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: cum spui că nu ai ceva'
    gloss: 'Ca să spui că nu ai ceva, pune no înaintea lui tengo: No tengo tiempo, no tengo mascota.'
    note: Reia tiparul *no tengo* învățat deja cu *No tengo tiempo*; doar substantivul este nou.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: '*Sacar a pasear* este o expresie fixă: *sacar* („a scoate”) + *a pasear* („la plimbare”).'
    example_gloss: Îmi scot câinele la plimbare în fiecare zi.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear și «a» personal
    gloss: 'Când obiectul este un animal sau o persoană, în față apare a: saco al perro a pasear.'
    note: Reia *saco al perro* de pe cardul anterior; *a* personal apare înaintea animalelor sau a persoanelor la care ții.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: A da de mâncare
    gloss: a hrăni
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Diego se joacă cu pisica lui.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Îmi scot câinele la plimbare în fiecare zi.
    note: '*Sacar a pasear* se îmbină cu *todos los días* (în fiecare zi), cunoscut deja dintr-o unitate anterioară; *a* + *el* devine *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: '*Dar de comer* („a da de mâncare”) înseamnă a hrăni; *le* ține locul animalului: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Pluralul se termină în -s: perro → perros, gato → gatos. După consoană este -es: animal → animales.'
    note: Tiparul regulat al pluralului în spaniolă, introdus aici pentru prima dată, cu substantive despre animale ca exemple.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Lui Mateo îi plac foarte mult câinii.
    - Lui Lucía îi plac foarte mult pisicile.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: '*Me encantan* este la plural pentru că *los animales* este la plural: verbul se acordă cu lucrul care îți place.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía adoră pisicile, dar nu are animal de companie
    gloss: Lucía adoră pisicile, dar nu are un animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo întreabă despre un animal de companie
    gloss: 'Mateo: Ai un animal de companie, Elena?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena are un câine
    gloss: 'Elena: Da, am un câine.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo întreabă cum arată
    gloss: 'Mateo: Cum arată?'
    note: Reia *¿Cómo es?* din unitatea anterioară despre aspect, acum pentru un animal.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena își descrie câinele
    gloss: 'Elena: Are părul castaniu și e mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él și lo pentru animale
    gloss: Él și lo se pot referi și la un animal, nu doar la o persoană.
    note: Până acum, *él* se referea în curs la o persoană; aici se arată explicit extinderea la animale, împreună cu *lo* („îl”) ca pronume de complement.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo întreabă despre plimbări
    gloss: 'Mateo: Îl scoți la plimbare în fiecare zi?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena își descrie rutina
    gloss: 'Elena: Da, îl scot la plimbare în fiecare zi și îi dau de mâncare.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía și Diego despre animale
    gloss: 'Lui Mateo și Lucíei le plac foarte mult animalele, dar niciunul dintre ei nu are animal de companie. Lui Mateo îi plac câinii, iar Lucíei îi plac pisicile. Diego are un animal de companie: o pisică. Se joacă des cu pisica lui și îi dă de mâncare în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      encantan: iubesc
      dos: amândoi
      animales: animale
      ninguno: amândoi
      mascota: animal de companie
      perros: câini
      gatos: pisici
      gato: pisică
      juega: se joacă
      da: dă
      todos: fiecare
      comer: mâncare
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego se joacă des cu pisica lui
    gloss: Diego se joacă des cu pisica lui.
    note: Reia *a menudo* (des), cunoscut deja din unități anterioare.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena o întreabă pe Nina
    gloss: 'Elena: Nina, și tu ai un animal de companie?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina are o pasăre pe nume Pico
    gloss: 'Nina: Da, am o pasăre. Se numește Pico.'
    note: '*Se llama* („se numește”) reia formula pentru nume din prima unitate.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Reacția lui Mateo
    gloss: 'Mateo: Ce frumos! Ce faci cu el în fiecare zi?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Și lui Mateo îi plac păsările
    gloss: 'Mateo: Și mie îmi plac foarte mult păsările.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena încheie conversația
    gloss: 'Elena: Ce frumos că nouă, celor trei, ne plac animalele!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
