  es.a1.unit07.lesson01.el_mercado:
    title: Piața
  es.a1.unit07.lesson02.preguntar_el_precio:
    title: Întrebi prețul
  es.a1.unit07.lesson03.cantidades:
    title: 'Cantități: duzină, kilogram, puțin din'
  es.a1.unit07.lesson04.una_compra_sencilla:
    title: O cumpărătură simplă
  es.a1.unit07.lesson05.leer_las_etiquetas_de_precio:
    title: Citirea etichetelor de preț
  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: Elena și Mateo merg la piață
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: Piața
    gloss: piața
    note: '*Mercado* este de genul masculin.'
    example_gloss: Să mergem la piață.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Fructe, legume
    gloss: fructe, legume
    note: '*Verdura* înseamnă legume în general (adesea verzi); este un substantiv feminin singular, folosit și cu sens colectiv, ca „verdețurile” sau „legumele” în română.'
    example_gloss:
    - Vreau să cumpăr fructe.
    - Legumele sunt proaspete.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Ouă, pâine
    gloss: ouă, pâine
    note: '*Huevos* este deja la plural (singularul este *huevo*); *pan* (pâine) este un substantiv nenumărabil, ca „pâine” în română, fără plural firesc în sensul obișnuit.'
    example_gloss:
    - Am nevoie de ouă.
    - Pâinea este de azi-dimineață.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Întreabă prețul
    gloss: Cât costă?
    note: '*Cuesta* este forma de persoana a treia a verbului *costar* (a costa), un verb nou în această unitate.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: Întreabă prețul, formă alternativă
    gloss: Cât face?
    note: Vezi nota de gramatică următoare, care compară această formă cu *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Spune un preț
    gloss: Costă doi.
    note: 'Un răspuns scurt și complet despre preț: moneda este subînțeleasă din context, la fel cum în română spunem adesea doar un număr când cumpărăm ceva.'
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta vs. Cuánto es
    gloss: Două moduri la fel de firești de a întreba prețul.
    note: Vezi textul cardului.
    target_text: '*¿Cuánto cuesta?* (cât costă?) și *¿Cuánto es?* (cât face?) sunt ambele moduri firești de a întreba un preț -- interschimbabile în acest context obișnuit de cumpărături.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Cere o duzină de ouă
    gloss: O duzină de ouă, vă rog.
    note: '*Docena* (duzină) este un substantiv și este urmat mereu de *de* plus obiectul, ca în română „o duzină de ouă”.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Cere un kilogram de roșii
    gloss: Un kilogram de roșii, vă rog.
    note: '*Kilo* urmează același tipar cu *de* plus obiectul ca *docena*.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Jumătate de kilogram
    gloss: jumătate de kilogram
    note: '*Medio* (jumătate) stă înaintea substantivului pe care îl determină și se acordă în gen (*medio kilo*, masculin; *media docena* ar fi feminin).'
    example_gloss: Jumătate de kilogram de pâine, vă rog.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Puțin din
    gloss: puțin din
    note: '*Un poco de* se folosește pentru o cantitate mică, nespecificată, când nu e nevoie de o cantitate exactă.'
    example_gloss: Vreau puține fructe.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Întreabă dacă mai este nevoie de ceva
    gloss: Mai aveți nevoie de ceva?
    note: '*Necesita* este forma de *usted* a verbului *necesitar*, registrul politicos pe care un vânzător îl folosește de obicei cu un client.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Spune că ai tot ce-ți trebuie
    gloss: Nu, cred că avem deja tot.
    note: '*Creo que* (cred că) este un mod frecvent de a nuanța o afirmație; aici confirmă că lista de cumpărături este completă.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: Mulțumește vânzătorului
    gloss: Perfect, mulțumesc.
    note: O încheiere scurtă și firească pentru o cumpărătură.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Citirea etichetelor de preț
    gloss: 'Taraba Rosei: roșii, două pe kilogram. Ouă, patru duzina. Pâine, șase. Fructe proaspete în fiecare zi.'
    note: 'O etichetă obișnuită de la taraba din piață: produsul, prețul, apoi unitatea pentru care se aplică prețul (*el kilo*, *la docena*). *Puesto* este o tarabă de piață; Rosa o conduce pe aceasta.'
    glosses:
      Puesto: tarabă
      tomates: roșii
      kilo: kilogram
      Huevos: ouă
      docena: duzină
      Pan: pâine
      Fruta: fructe
      fresca: proaspăt
      todos: fiecare
      días: zile
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo ca „pe kilogram”
    gloss: Cum un cuvânt de unitate după un preț înseamnă „pe” acea unitate.
    note: Vezi textul cardului.
    target_text: '*El kilo* după un preț ("tomates, dos el kilo") înseamnă „pe kilogram” -- prețul se aplică fiecărui kilogram cumpărat.'
  es.a1.unit07.lesson06.teach.line01:
    title: Propune să mergeți la piață
    gloss: Elena propune să meargă la piață după ingrediente pentru ora următoare.
    note: '*Para la próxima clase* înseamnă „pentru ora următoare” – următoarea sesiune a atelierului de gătit.'
  es.a1.unit07.lesson06.teach.line02:
    title: Fii de acord și întreabă ce trebuie
    gloss: Mateo e de acord și întreabă de ce au nevoie.
    note: '*¿Qué necesitamos?* folosește forma de *nosotros* a verbului *necesitar*, corespunzătoare lui „avem nevoie” spus împreună.'
  es.a1.unit07.lesson06.teach.line03:
    title: Arată roșiile proaspete
    gloss: Elena spune că mai întâi legume și arată cât de proaspete par roșiile.
    note: '*¡Qué tomates tan frescos!* este o exclamație cu *qué*, ca *¡Qué bonito!* din Unitatea 3, dar construită cu un substantiv: *qué* + substantiv + *tan* + adjectiv.'
  es.a1.unit07.lesson06.teach.line04:
    title: Vânzătorul întreabă cantitatea
    gloss: Vânzătorul o întreabă pe Elena cât dorește.
    note: '*Señorita* este un mod politicos de a te adresa unei femei tinere, potrivit registrului de *usted* al vânzătorului față de un client (azi unii vorbitori îl găsesc puțin demodat).'
  es.a1.unit07.lesson06.teach.line05:
    title: Comandă un kilogram și întreabă prețul
    gloss: Elena cere un kilogram și întreabă prețul.
    note: Combină *un kilo* cu *¿Cuánto cuesta?* din această unitate într-un schimb firesc de replici.
  es.a1.unit07.lesson06.teach.line06:
    title: Spune prețul
    gloss: Vânzătorul spune că costă doi.
    note: '*Cuesta dos* – un răspuns scurt despre preț, cu moneda subînțeleasă din context.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo comandă ouă și pâine
    gloss: Mateo spune că are nevoie de o duzină de ouă și de pâine.
    note: Combină *huevos*/*pan* cu *una docena de* din această unitate; *yo* este opțional și adaugă o ușoară accentuare („eu am nevoie...”).
  es.a1.unit07.lesson06.teach.line08:
    title: Vânzătorul spune ambele prețuri
    gloss: Vânzătorul spune că ouăle costă patru, iar pâinea, șase.
    note: '*Cuestan* (plural, costă) se acordă cu subiectul la plural *los huevos*, spre deosebire de singularul *cuesta* folosit pentru roșii.'
  es.a1.unit07.lesson06.teach.line09:
    title: Mulțumește vânzătorului
    gloss: Mateo spune perfect, mulțumesc.
    note: Aceeași încheiere scurtă ca mai devreme în această unitate.
  es.a1.unit07.lesson06.teach.line10:
    title: Întreabă un prieten dacă mai are nevoie de ceva
    gloss: Elena îl întreabă pe Mateo dacă mai are nevoie de ceva.
    note: '*¿Necesitas...?* este forma de *tú*, pentru un prieten; *¿Necesita...?* al vânzătorului este forma de *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: Spune că ai tot ce-ți trebuie
    gloss: Mateo spune că nu, crede că au deja tot.
    note: '*Creo que* (cred că) nuanțează răspunsul; *ya* înseamnă „deja”.'
