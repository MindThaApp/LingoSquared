  es.a1.unit05.lesson03.partes_del_dia:
    title: Părțile zilei și ora de începere a atelierului
  es.a1.unit05.lesson04.proponer_una_hora_para_verse:
    title: Propunem o oră de întâlnire
  es.a1.unit05.lesson05.leer_el_horario_del_dia:
    title: Citim programul zilei
  es.a1.unit05.lesson06.planear_el_almuerzo_dialogue:
    title: Elena și Mateo planifică prânzul
teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Întreabă ora
    gloss: Cât este ceasul?
    note: '*Qué hora* („ce oră”) întreabă ora de pe ceas, spre deosebire de *qué fecha* („ce dată” din calendar).'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: Este ora unu
    gloss: Este ora unu.
    note: Vezi nota de gramatică următoare despre motivul pentru care *es* (nu *son*) se folosește doar pentru ora unu.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es și son la oră
    gloss: De ce ora unu este diferită de toate celelalte ore.
    note: '*Es la una* (singular), dar *son las dos, son las tres...* (plural).'
    target_text: Ora unu folosește verbul la singular *es* (Es la una), dar toate celelalte ore folosesc pluralul *son* (Son las dos, Son las tres...), deoarece *la una* este singular („ora una”), iar *las dos*, *las tres* etc. sunt la plural.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Orele două, patru, cinci, șapte
    gloss: Este ora două, este ora patru, este ora cinci, este ora șapte.
    note: '*Son las...* (plural) se folosește pentru toate orele, cu excepția orei unu, conform notei de gramatică anterioare.'
    example_gloss:
    - Este ora două.
    - Este ora patru.
    - Este ora cinci.
    - Este ora șapte.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: Și un sfert
    gloss: Este patru și un sfert.
    note: '*Y cuarto* („și un sfert”) adaugă cincisprezece minute la ora indicată.'
  es.a1.unit05.lesson02.teach.y_media:
    title: Și jumătate
    gloss: Este șapte și jumătate.
    note: '*Y media* („și jumătate”) adaugă treizeci de minute la ora indicată.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Fără un sfert
    gloss: Este cinci fără un sfert (patru și patruzeci și cinci).
    note: Vezi nota de gramatică următoare despre cum *menos* numără înapoi până la ora următoare.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (până la ora următoare)
    gloss: Cum numără spaniola minutele rămase până la ora următoare.
    note: '*Las cinco menos cuarto* = cinci fără un sfert (4:45).'
    target_text: '*Menos* („fără”) numără înapoi PÂNĂ la ora următoare: *las cinco menos cuarto* este 4:45, adică „cinci fără un sfert”, ca și în română.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Dimineața, după-amiaza, noaptea
    gloss: dimineața, după-amiaza, seara/noaptea
    note: '*De la mañana/tarde/noche* precizează dacă este AM sau PM, la fel cum în română adăugăm „dimineața”, „seara” sau „noaptea” după oră.'
    example_gloss:
    - Este ora opt dimineața.
    - Atelierul începe la patru după-amiaza.
    - Este ora zece seara.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: Atelierul începe la patru
    gloss: Atelierul începe la patru după-amiaza.
    note: '*Empieza* („începe”) este forma de persoana a treia a verbului *empezar*, un verb nou în această unitate.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Întreabă la ce oră începe ceva
    gloss: La ce oră începe atelierul?
    note: '*A qué hora* („la ce oră”) este modalitatea standard de a întreba când are loc un anumit eveniment, diferită de întrebarea generală *qué hora es* („cât este ceasul acum”).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Întreabă când să vă întâlniți
    gloss: La ce oră ne vedem?
    note: '*Nos vemos* (ne vedem / ne întâlnim) este o construcție de tip reflexiv, folosită pentru a stabili o întâlnire cu cineva.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Propune o oră de întâlnire
    gloss: Ne vedem la trei și jumătate?
    note: Combină *y media* cu *nos vemos* pentru a propune o oră anume.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: Înainte de atelier
    gloss: Asta e înainte de atelier.
    note: '*Antes de* (înainte de) este opusul lui *después* (după).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: De acord / Bine
    gloss: De acord / Bine
    note: '*De acuerdo* este o modalitate naturală și scurtă de a confirma un plan, cu funcție asemănătoare lui *Muy bien*.'
    example_gloss: De acord, ne vedem la trei și jumătate.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Citim programul zilei
    gloss: Atelierul începe la patru după-amiaza. Înainte, Elena și Mateo se întâlnesc la trei și jumătate. Atelierul se termină la șase. A doua zi, se întâlnesc la unu ca să ia prânzul.
    note: 'Un program scurt al zilei: întâlnirea, atelierul și prânzul din ziua următoare.'
    glosses:
      taller: atelier
      empieza: începe (de la empezar)
      cuatro: patru
      tarde: după-amiază
      Antes: înainte
      ven: se întâlnesc (de la verse)
      tres: trei
      media: jumătate
      termina: se termină (de la terminar)
      seis: șase
      día: zi
      siguiente: următor
      almorzar: a lua prânzul
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: A doua zi
    gloss: a doua zi / în ziua următoare
    note: '*Al día siguiente* (în ziua următoare) este o formulă frecventă pentru a duce povestea într-o altă zi; este diferit de *la próxima clase* (următoarea oră de curs, un eveniment anume, nu o zi din calendar).'
  es.a1.unit05.lesson06.teach.line01:
    title: Întreabă despre masa de după atelier
    gloss: Mateo spune că atelierul se termină la șase și o întreabă pe Elena dacă îi e foame după aceea.
    note: '*Tienes hambre* (ți-e foame) este o expresie nouă: literal „ai foame”, aceeași construcție cu „a avea” ca în *tener ... años* și *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Acceptă și propune ziua următoare
    gloss: Elena spune că da, puțin, și propune să mănânce împreună a doua zi.
    note: '*¿Comemos mañana?* propune ziua de mâine, nu imediat după atelier, și pregătește schimbul următor despre o oră anume.'
  es.a1.unit05.lesson06.teach.line03:
    title: Acceptă și întreabă ora
    gloss: Mateo spune că e o idee bună și întreabă la ce oră.
    note: '*Buena idea* (idee bună) este o modalitate naturală și scurtă de a fi de acord cu o propunere.'
  es.a1.unit05.lesson06.teach.line04:
    title: Propune ora unu
    gloss: Elena propune să se vadă la ora unu.
    note: '*A la una* (la ora unu) folosește singularul *la una*, ca în *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Confirmă și amintește un restaurant
    gloss: Mateo confirmă ora unu și amintește de un restaurant din apropiere.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (aproape de), ca în *cerca de tus padres*, aici folosit pentru un loc.'
  es.a1.unit05.lesson06.teach.line06:
    title: Încheie cu căldură
    gloss: Elena reacționează bucuroasă și spune „pe mâine”.
    note: '*¡Genial!* (grozav!) încheie schimbul pe un ton entuziast, cu funcție asemănătoare lui *¡Qué bien!*.'
