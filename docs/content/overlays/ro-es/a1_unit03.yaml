answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaniolă A1
  description: Vocabularul familiei apropiate și extinse, adjectivele posesive și descrierea unei gospodării, în continuarea poveștii atelierului de gătit al Elenei și al lui Mateo din unitățile 01-02. Se evidențiază registrul adjectivelor posesive (mi/tu/su) și substantivele de familie marcate după gen.
units:
  es.a1.unit03.family:
    title: Familiile Elenei și ale lui Mateo
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: Familia apropiată
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'Posesivele: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: Familia extinsă
  es.a1.unit03.lesson04.describing_family_size:
    title: Câți sunt acasă
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Citim profilul unei familii
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Fotografii de familie cu Elena și Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Mama
    gloss: mamă
    note: '*Madre* este de genul feminin. *Mamá* este cuvântul mai des folosit în familie, iar *madre* este neutru și apare în listele de vocabular ale acestui curs.'
  es.a1.unit03.lesson01.teach.padre:
    title: Tatăl
    gloss: tată
    note: '*Padre* este de genul masculin. *Papá* este echivalentul uzual, paralel cu *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Fratele
    gloss: frate
    note: '*Hermano* este masculin singular.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Sora
    gloss: soră
    note: '*Hermana* este feminin singular.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Fiul
    gloss: fiu
    note: '*Hijo* este masculin singular.'
  es.a1.unit03.lesson01.teach.hija:
    title: Fiica
    gloss: fiică
    note: '*Hija* este feminin singular.'
  es.a1.unit03.lesson01.teach.padres:
    title: Părinții
    gloss: părinți
    note: '*Padres* (masculin plural) se referă la o pereche mixtă (mama și tatăl împreună), ca în română: ca și în română, pluralul masculin cuprinde și grupurile în care există cel puțin un bărbat.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Frații
    gloss: frați; frați (băieți)
    note: '*Hermanos* poate însemna „frați” (toți bărbați) sau „frați și surori” (grup mixt), după aceeași regulă ca *padres*: pluralul masculin cuprinde și grupurile mixte.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: Familia mea
    gloss: familia mea
    note: '*Mi* (fără accent) este adjectivul posesiv „meu/mea”; nu se schimbă după gen, ci doar după număr (*mis* pentru substantive la plural).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: Familia ta
    gloss: familia ta
    note: '*Tu* (fără accent, spre deosebire de pronumele *tú*) este posesivul pentru persoana cu care vorbești pe „tu”, la fel ca registrul *tú* din Unitatea 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: Familia lui/ei/dumneavoastră
    gloss: familia lui/ei/dumneavoastră
    note: '*Su* înseamnă „lui”, „ei” ȘI „dumneavoastră” (*usted*); spre deosebire de română, spaniola nu face această distincție prin posesiv, iar sensul reiese din context.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Întreabă despre frați și surori
    gloss: Ai frați sau surori?
    note: '*Tienes* este forma de *tú* a verbului *tener*, același verb folosit pentru vârstă în Unitatea 2.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Spune câți frați și surori ai
    gloss: Am două surori.
    note: '*Tengo* (am) împreună cu un număr și cu substantivul de familie este modul obișnuit de a descrie frații și surorile.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Întreabă dacă o familie este mare
    gloss: Familia ta este mare?
    note: '*Grande* (mare) nu se schimbă după gen, ci doar după număr (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Descrie o familie mică
    gloss: Familia mea este mică.
    note: '*Pequeña* se acordă cu substantivul feminin *familia*; forma masculină *pequeño* apare cu un substantiv masculin.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Bunicul
    gloss: bunic
    note: '*Abuelo* este masculin singular.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Bunica
    gloss: bunică
    note: '*Abuela* este feminin singular.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: Bunicii
    gloss: bunici
    note: '*Abuelos* (masculin plural) cuprinde o pereche mixtă, la fel ca *padres* și *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: Unchiul
    gloss: unchi
    note: '*Tío* are accent scris deoarece accentul cade pe *í*, ceea ce desface un diftong care altfel s-ar forma.'
  es.a1.unit03.lesson03.teach.tia:
    title: Mătușa
    gloss: mătușă
    note: '*Tía* are același accent ca *tío*, din același motiv.'
  es.a1.unit03.lesson03.teach.primo:
    title: Vărul
    gloss: văr
    note: '*Primo* este masculin singular; ca și în română (văr/verișoară), spaniola marchează genul verișorului.'
  es.a1.unit03.lesson03.teach.prima:
    title: Verișoara
    gloss: verișoară
    note: '*Prima* este feminin singular.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: Bunicii mei
    gloss: bunicii mei
    note: '*Mis* este forma de plural a lui *mi*, obligatorie ori de câte ori substantivul determinat este la plural, indiferent de genul lui.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Întreabă câți frați și surori are cineva
    gloss: Câți frați și surori ai?
    note: '*Cuántos* (masculin plural, deoarece *hermanos* include și grupurile mixte) se acordă cu substantivul despre care se întreabă.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Spune câți oameni sunteți în casă
    gloss: Suntem cinci acasă.
    note: '*Somos* (suntem) este modul firesc de a spune în spaniolă câte persoane sunt în gospodărie; se folosește verbul „a fi” la persoana I plural, la fel ca în română: „suntem cinci”.'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Descrie o familie mare
    gloss: Familia mea este mare.
    note: '*Grande* se referă aici la *familia* (feminin), dar păstrează aceeași formă *grande* ca la substantivele masculine, pentru că adjectivele terminate în -e, ca *grande*, nu se schimbă după gen.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Spune că ai mulți veri
    gloss: Am mulți veri.
    note: Se folosește *muchos* (masculin plural) deoarece *primos*, ca și *hermanos* și *padres*, poate desemna un grup mixt.
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Întreabă dacă cineva locuiește aproape de părinți
    gloss: Locuiești aproape de părinții tăi?
    note: '*Tus* este pluralul lui *tu* și este necesar deoarece *padres* este la plural.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Spune cu cine locuiești
    gloss: Locuiesc cu bunicii mei.
    note: '*Con* (cu) introduce persoanele cu care locuiește cineva; *vivo* este forma pentru *yo* a verbului *vivir*, întâlnită deja în Unitatea 1, în *vivo en Londres*.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Profilul familiei Elenei
    gloss: 'Mă numesc Elena. Am treizeci și unu de ani și locuiesc cu bunicii mei în Spania. Mama și tatăl meu locuiesc în Barcelona. Am o soră și un frate: suntem cinci acasă. Sora mea mai mică se numește Sofía și are douăzeci de ani.'
    note: Acest profil reia vocabular și structuri din lecțiile 01-04 într-un text scurt și coerent, nu în propoziții izolate; este aceeași abilitate de a înțelege cine este cine, pe care o urmărește evaluarea de citire a acestei unități.
    glosses:
      llamo: mă numesc (de la llamarse)
      Tengo: am (de la tener)
      treinta: treizeci
      años: ani
      vivo: locuiesc (de la vivir)
      abuelos: bunici
      madre: mamă
      padre: tată
      viven: locuiesc (de la vivir)
      hermana: soră
      hermano: frate
      somos: suntem (de la ser)
      cinco: cinci
      casa: acasă
      menor: mai mică
      tiene: se numește / are (de la tener)
      veinte: douăzeci
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Sora mai mică
    gloss: sora mai mică
    note: '*Menor* (mai mic/mică) stă după substantivul pe care îl descrie și nu își schimbă forma după gen.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Locuiește (persoana a III-a)
    gloss: locuiește
    note: '*Vive* este forma de persoana a III-a singular a verbului *vivir*, folosită pentru a vorbi DESPRE cineva (*Elena vive*...), nu despre sine (*vivo*, întâlnit în lecția 04 din Unitatea 1 și din nou în lecția 04 a acestei unități).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Al ei/al lui/al lor (substantiv la plural)
    gloss: ei/lui/lor
    note: '*Sus* este pluralul lui *su*; la fel cum *su* înseamnă „al lui / al ei / al dumneavoastră” înaintea unui substantiv la singular, sus se folosește înaintea unui substantiv la plural. De exemplu, *sus abuelos* înseamnă „bunicii ei”, când vorbim despre Elena la persoana a treia.'
  es.a1.unit03.lesson06.teach.line01:
    title: Arată fotografii de familie
    gloss: Elena îi arată lui Mateo o fotografie și îi prezintă părinții și sora mai mică.
    note: '*Estos son* (aceștia sunt, masculin/plural mixt) îi prezintă pe părinți; *esta es* (aceasta este, feminin singular) o prezintă pe soră.'
  es.a1.unit03.lesson06.teach.line02:
    title: Reacționează și întreabă despre frați
    gloss: Mateo reacționează călduros și o întreabă dacă mai are frați sau surori.
    note: '*Qué bonito* este o reacție firească și caldă la vederea unei fotografii, cu o funcție asemănătoare cu *Qué bien* din Unitatea 1.'
  es.a1.unit03.lesson06.teach.line03:
    title: Spune câți sunteți acasă și întoarce întrebarea
    gloss: Elena spune că are o soră și un frate, deci sunt cinci acasă, apoi îl întreabă despre familia lui Mateo.
    note: '*Somos cinco en casa* spune câți oameni sunt în gospodărie, continuând modelul din lecția 04.'
  es.a1.unit03.lesson06.teach.line04:
    title: Descrie o familie mai mică
    gloss: 'Mateo spune că familia lui este mai mică, sunt doar trei: părinții lui și el, dar are mulți veri.'
    note: '*Pero* (dar) marchează contrastul dintre o familie apropiată mică și multele rude din familia extinsă.'
  es.a1.unit03.lesson06.teach.line05:
    title: Întreabă dacă locuiește aproape de părinți
    gloss: Elena îl întreabă pe Mateo dacă locuiește aproape de părinții lui.
    note: '*Cerca de* (aproape de) este o expresie uzuală pentru a descrie apropierea fizică.'
  es.a1.unit03.lesson06.teach.line06:
    title: Explică distanța și cum țineți legătura
    gloss: Mateo spune că nu, ei locuiesc în Columbia și vorbesc la telefon în fiecare săptămână.
    note: 'Continuă ceea ce știm din Unitatea 1: Mateo este din Columbia, dar locuiește la Londra, iar părinții lui au rămas în Columbia.'
  es.a1.unit03.lesson06.teach.line07:
    title: Arată înțelegere și spune ce se întâmplă la tine
    gloss: Elena spune că înțelege și că ea locuiește cu bunicii ei aici, în Spania.
    note: '*Entiendo* (înțeleg) este o modalitate scurtă și firească de a arăta că ai auzit ce ți-a spus cineva, înainte de a adăuga un detaliu despre tine.'
  es.a1.unit03.lesson06.teach.line08:
    title: Încheie cu o remarcă caldă
    gloss: Mateo spune că e frumos să ai familia aproape.
    note: '*Qué bien tener a la familia cerca* încheie schimbul de replici pe o notă caldă și reflexivă, reluând modelul *qué bien*/*qué bonito* din tot dialogul.'
