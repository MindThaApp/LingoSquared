teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Sendviș, salată
    gloss: sendviș, salată
    note: Ambele substantive sunt împrumutate/adaptate -- *sándwich* este un împrumut direct din engleză, scris cu accent pentru a marca silaba accentuată.
    example_gloss:
    - Vreau un sendviș.
    - Salata conține roșii.
  es.a1.unit06.lesson01.teach.sopa:
    title: Supă
    gloss: supă
    note: '*Sopa* este feminin, ca majoritatea substantivelor spaniole terminate în -a.'
    example_gloss: Supa este foarte bună.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Apă, cafea
    gloss: apă, cafea
    note: '*Agua* este feminin, dar la singular primește articolul masculin *el* (nu *la*), pentru că începe cu un sunet *a* accentuat -- o particularitate reală a spaniolei, nu o greșeală.'
    example_gloss:
    - Vreau apă, vă rog.
    - Pentru mine, o cafea.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Vreau un sendviș
    gloss: Vreau un sendviș.
    note: '*Quiero* (vreau) este forma pentru persoana I a verbului *querer*, un verb nou în această unitate.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Pentru mine, o cafea
    gloss: Pentru mine, o cafea.
    note: '*Para mí* (pentru mine) este o formulă frecventă alternativă de comandă, care numește produsul fără a repeta un verb -- vezi nota de gramatică următoare.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Întreabă ce vrea cineva să mănânce
    gloss: Ce vrei să mănânci?
    note: '*Quieres* este forma pentru *tú* a verbului *querer*, registrul informal folosit cu prietenii.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero vs. Para mí
    gloss: Două moduri la fel de naturale de a comanda.
    note: '*Quiero un café* și *Para mí, un café* sunt corecte când comanzi.'
    target_text: '*Quiero* („vreau”) și *Para mí* („pentru mine”, spus înainte de a numi produsul) sunt amândouă moduri naturale și la fel de politicoase de a comanda într-un cadru informal -- niciunul nu este mai corect decât celălalt.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: Meniul
    gloss: meniul
    note: '*Menú* are accent scris pentru că accentul cade pe ultima silabă.'
    example_gloss: Putem vedea meniul?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Cere să vezi meniul
    gloss: Putem vedea meniul?
    note: '*Podemos* (putem) este forma pentru persoana I plural a verbului *poder*, un verb nou în această unitate.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Poftiți
    gloss: Poftiți.
    note: '*Aquí tiene* este formula obișnuită a unui ospătar când dă ceva clientului, cu forma politicoasă *usted* chiar și într-un schimb altfel informal -- o formulă fixă de politețe, nu o schimbare de registru.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Poftă bună
    gloss: Poftă bună
    note: '*Buen provecho* se spune obișnuit înainte ca cineva să înceapă să mănânce, ca funcție similar cu românescul „poftă bună”.'
    example_gloss: Poftiți. Poftă bună.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Desert
    gloss: desert
    note: '*Postre* este masculin.'
    example_gloss: La desert, vreau tort.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Comandă desert
    gloss: La desert, vreau tort.
    note: '*De postre* (la desert) introduce ce comandă cineva ca ultim fel, același tipar ca *para mí* care introduce comanda principală.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Cere nota de plată
    gloss: Nota de plată, vă rog.
    note: '*La cuenta* (nota de plată) este modul obișnuit de a cere să plătești la sfârșitul mesei.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Citirea meniului
    gloss: 'Meniu: sendviș, cinci. Salată, opt. Supă, trei. Cafea sau apă, inclus. Desert: tort.'
    note: Un format realist de meniu tipărit, care reia vocabularul de mâncare al unității, cu prețuri.
    glosses:
      Menú: meniu
      sándwich: sendviș
      Ensalada: salată
      Sopa: supă
      Café: cafea
      agua: apă
      incluido: inclus
      Postre: desert
      pastel: tort
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (inclus)
    gloss: Ce înseamnă când o băutură este marcată ca inclusă.
    note: '*Incluido* = inclus, fără cost suplimentar.'
    target_text: '*Incluido* (inclus) îți arată că băutura vine gratuit la masă, fără cost suplimentar.'
  es.a1.unit06.lesson06.teach.line01:
    title: Salut și întrebare despre comandă
    gloss: Ospătarul îi salută pe Elena și Mateo și îi întreabă ce vor să mănânce.
    note: '*Buenas tardes* (bună ziua, după-amiaza) se folosește de la prânz încolo, deci se potrivește la ora prânzului.'
  es.a1.unit06.lesson06.teach.line02:
    title: Elena comandă
    gloss: Elena comandă o salată și apă, vă rog.
    note: '*Una ensalada y agua* = o salată și apă.'
  es.a1.unit06.lesson06.teach.line03:
    title: Mateo comandă
    gloss: Mateo comandă pentru el un sendviș și o cafea.
    note: Folosește *Para mí* în loc să repete *Quiero*.
  es.a1.unit06.lesson06.teach.line04:
    title: Întrebare despre desert
    gloss: Ospătarul aprobă și întreabă dacă doresc desert.
    note: '*¿Algo de postre?* (ceva la desert?) este un mod natural și scurt de a oferi desert.'
  es.a1.unit06.lesson06.teach.line05:
    title: Comandă un desert de împărțit
    gloss: Elena spune da, un tort pentru amândoi.
    note: '*Para los dos* (pentru amândoi) înseamnă un singur desert împărțit între ei, o alegere firească în viața reală.'
  es.a1.unit06.lesson06.teach.line06:
    title: Acceptă și cere nota de plată
    gloss: Mateo e de acord și cere nota de plată.
    note: '*La cuenta, por favor* = nota de plată, vă rog.'
  es.a1.unit06.lesson06.teach.line07:
    title: Înmânează nota de plată
    gloss: Chelnerul le aduce nota de plată.
    note: '*Aquí tiene* se spune când întinzi cuiva ceva.'
  es.a1.unit06.lesson06.teach.line08:
    title: Încheie cu amabilitate
    gloss: Elena îi mulțumește chelnerului și spune ce bună a fost mâncarea.
    note: '*¡Qué buena comida!* folosește același tipar de exclamație *¡Qué ...!* ca *¡Qué bien!* și *¡Qué bonito!*.'
