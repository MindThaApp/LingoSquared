    title: Planuri pentru un weekend împreună
teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'Trei verbe uzuale pentru hobby-uri: *leer* (a citi), *hacer deporte* (a face sport) și *cocinar* (a găti).'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Timpul liber
    gloss: timp liber
    note: '*El tiempo libre* este o expresie cu substantiv masculin și este expresia-cheie pentru a vorbi despre hobby-uri.'
    example_gloss: În timpul liber îmi place să citesc.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber îmi place să citesc.
    note: '*Me gusta leer* (îmi place să citesc) folosește *gustar* + infinitiv; *me gusta* rămâne neschimbat pentru orice activitate.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei verbe pentru hobby-uri: *escuchar música* (a asculta muzică), *dibujar* (a desena) și *jugar videojuegos* (a juca jocuri video).'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: '*Escuchar* se construiește direct cu complementul, fără prepoziție: *escuchar música*, ca în română „a asculta muzică”.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: '*Con amigos* (cu prieteni) reia prepoziția *con* din lecțiile anterioare.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: 'Cele patru adverbe de frecvență de bază: *siempre* (întotdeauna), *a menudo* (adesea), *a veces* (uneori), *nunca* (niciodată). De obicei stau înaintea verbului sau la începutul propoziției.'
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*Cada semana* și *cada fin de semana* înseamnă amândouă „în fiecare”; *cada* nu își schimbă niciodată forma.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada nu se schimbă niciodată
    gloss: 'Cada rămâne la fel: cada semana, cada fin de semana.'
    note: '*Cada* nu se schimbă niciodată: este la fel înaintea substantivelor feminine (*semana*) și masculine (*fin de semana*).'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena aduce vorba despre hobby-uri
    gloss: 'Elena: Ne plimbăm adesea împreună. Dar ce altceva mai faci tu în timpul liber, Mateo?'
    note: '*A menudo paseamos juntos* (ne plimbăm adesea împreună): *paseamos* este forma de *nosotros* a verbului *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Hobby-urile lui Mateo
    gloss: 'Mateo: Îmi place să gătesc, și acasă. Și fac sport des.'
    note: '*También en casa* (și acasă) arată că Mateo gătește și de plăcere, nu doar la locul de muncă de la restaurant.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena este surprinsă
    gloss: 'Elena: Gătești și acasă? Tu deja gătești toată ziua la muncă!'
    note: '*Todo el día* (toată ziua) subliniază cât de mult gătește Mateo deja la muncă.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo explică
    gloss: 'Mateo: Da, dar mie gătitul mi se pare relaxant. Și tu, ce îți place să faci?'
    note: '*Cocinar me parece relajante* înseamnă literal „gătitul mi se pare relaxant”: *me parece* + adjectiv este o formă firească de a-ți spune părerea.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Hobby-urile Elenei
    gloss: 'Elena: Îmi place să citesc și ascult adesea muzică.'
    note: Combină două verbe pentru hobby-uri din lecțiile anterioare într-o singură propoziție, cu *y* (și).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo întreabă despre jocuri video
    gloss: 'Mateo: Și tu joci jocuri video?'
    note: O întrebare scurtă cu da/nu, cu *jugar videojuegos* din lecția 2; *tú también* (și tu) folosește pronumele informal *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena răspunde
    gloss: 'Elena: Nu, nu joc niciodată jocuri video. Dar uneori desenez!'
    note: '*Nunca* (niciodată) și *a veces* (uneori) din lecția 3, puse în contrast într-un singur răspuns.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Comparăm hobby-urile
    gloss: Mateo și cu mine ne plimbăm adesea împreună. Dar avem și alte pasiuni. lui Mateo îi place să gătească, și acasă, și face sport des. Mie îmi place să citesc și ascult adesea muzică. Uneori desenez, dar nu joc niciodată jocuri video. Ție ce îți place să faci în timpul liber?
    note: Mesajul Elenei reia informații din lecțiile anterioare și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      paseamos: a se plimba
      menudo: des
      juntos: împreună
      otras: alte
      cocinar: gătește
      gusta: cu plăcere
      casa: acasă
      deporte: face sport
      leer: citesc
      escucho: ascult
      música: muzică
      dibujo: desenez
      veces: uneori
      videojuegos: joc jocuri video
      nunca: niciodată
      libre: liber
      tiempo: timp
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo întreabă despre weekend
    gloss: 'Mateo: Ce faci în weekendul acesta?'
    note: '*Este fin de semana* (weekendul acesta) folosește *este* cu substantivul masculin *fin de semana*.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena nu s-a hotărât
    gloss: 'Elena: Încă nu știu. Îmi place să citesc, dar vreau și să ies.'
    note: '*Quiero salir* (vreau să ies) este o formă uzuală de a spune că vrei să ieși din casă.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo propune un plan
    gloss: 'Mateo: Ne plimbăm împreună? După aceea gătesc eu pentru noi.'
    note: '*Después* (după aceea) este un cuvânt care arată succesiunea: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena acceptă
    gloss: 'Elena: Bună idee! Îmi plac amândouă: și plimbatul, și gătitul.'
    note: '*Las dos cosas* (ambele lucruri) arată că Elenei îi plac la fel de mult două lucruri, nu unul mai mult decât celălalt.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo confirmă
    gloss: 'Mateo: Perfect! Atunci ne vedem sâmbătă!'
    note: O replică prietenoasă de încheiere, care confirmă planul pentru *el sábado* (sâmbătă). Spaniola folosește *el* înaintea unei zile precise, în timp ce româna spune simplu „sâmbătă”.
