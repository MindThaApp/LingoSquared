teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Cum afli prețul total
    gloss: Cât costă în total?
    note: '*En total* arată că vrei prețul total, adunat, nu prețul unui singur produs.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Cum spui prețul total
    gloss: Costă douăzeci și cinci de euro în total.
    note: '*Cuesta* este persoana a treia singular a verbului *costar* (a costa); vocala radicalului se schimbă din *o* în *ue* când este accentuată.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Plata cu cardul sau în numerar
    gloss: a plăti cu cardul, a plăti în numerar
    note: '*Pagar con tarjeta* (a plăti cu cardul) și *pagar en efectivo* (a plăti în numerar) folosesc prepoziții diferite: *con* pentru instrument, *en* pentru forma banilor.'
    example_gloss:
    - Pot plăti cu cardul aici?
    - Plătesc în numerar.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Cum întrebi dacă se poate plăti cu cardul
    gloss: Pot plăti cu cardul aici?
    note: '*Puedo* (pot) este forma de persoana I singular (*yo*) a verbului *poder*; *aquí* (aici) leagă întrebarea de locul în care te afli.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Cum întrebi cum preferă cineva să plătească
    gloss: Doriți să plătiți în numerar sau cu cardul?
    note: '*Quiere* este forma de politețe (*usted*) a verbului *querer*, folosită aici de un casier necunoscut; unui prieten i-ai spune *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: Nota de plată
    gloss: nota de plată
    note: 'Substantiv feminin: *la cuenta*. La restaurant înseamnă nota de plată; la bancă înseamnă contul.'
    example_gloss: Împărțim nota de plată?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Cum propui să împărțiți nota de plată
    gloss: Împărțim nota de plată?
    note: '*¿Dividimos...?* folosește forma de persoana I plural (*nosotros*) pentru a face o propunere, la fel ca în română „împărțim...?”.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Cum ceri să plătești separat
    gloss: Pot plăti separat?
    note: '*Por separado* (separat) arată cum plătești; *pagar* (a plăti) este verbul obișnuit pentru asta.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: Restul
    gloss: restul
    note: 'Substantiv masculin: *el cambio*. Înseamnă și schimbare în general, ca în *un cambio de planes*.'
    example_gloss: Poftiți restul.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Cum dai restul
    gloss: Poftiți restul.
    note: '*Su* este posesivul care corespunde formei de politețe *usted* („dumneavoastră”); *Aquí tiene* este formula politicoasă obișnuită când întinzi cuiva ceva.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Cum refuzi restul
    gloss: Nu am nevoie de rest.
    note: '*Necesitar* (a avea nevoie) își ia complementul direct, fără prepoziție: *necesito cambio*; *no* neagă verbul.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Treizeci și cinci
    gloss: treizeci și cinci
    note: '*Treinta y cinco* (treizeci și cinci): de la 31 la 99, spaniola leagă zecile de unități cu *y*, scris ca cuvinte separate.'
    example_gloss: Costă treizeci și cinci de euro.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Citește o notă de plată de la restaurant
    gloss: 'Nota: două feluri principale și două cafele. Total: treizeci și cinci de euro. Plătit cu cardul.'
    note: Urmărește ce s-a comandat, totalul și cum s-a plătit.
    glosses:
      Cuenta: nota de plată
      dos: două
      platos: feluri principale
      cafés: cafele
      Total: totalul
      treinta: treizeci și cinci
      euros: euro
      Pagado: plătit
      tarjeta: card
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena cere nota de plată
    gloss: 'Elena: Cerem nota de plată?'
    note: '*Pedir* (a cere, a comanda) are drept complement direct *la cuenta*: *pedimos la cuenta* (cerem nota de plată).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo întreabă totalul
    gloss: 'Mateo: Da, bună idee. Cât costă în total?'
    note: Reia întrebarea *¿cuánto cuesta en total?* din lecția 1.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena spune totalul
    gloss: 'Elena: Sunt treizeci și cinci de euro. Împărțim?'
    note: '*Son* se folosește cu sume de bani: *son treinta y cinco euros* cere verbul la plural, deoarece suma este la plural.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo insistă să plătească
    gloss: 'Mateo: Nu, lasă-mă să plătesc eu azi. M-ai ajutat foarte mult.'
    note: '*Deja que pague yo* (lasă-mă să plătesc eu) folosește conjunctivul *pague* după *que*; deocamdată învață-l ca pe o formulă fixă. *Me has ayudado* este perfectul compus (m-ai ajutat).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena este mișcată
    gloss: 'Elena: Ce drăguț ești! Mulțumesc mult.'
    note: '*¡Qué amable eres!* (ce amabil ești!) folosește *qué* + adjectiv ca să reacționezi cu căldură la un gest generos; *muchas gracias* este un *mulțumesc* mai apăsat.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo întreabă dacă poate plăti cu cardul
    gloss: 'Mateo: Pot plăti cu cardul aici?'
    note: Reia întrebarea *¿puedo pagar con tarjeta aquí?* din lesson02, acum în restaurantul propriu-zis.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: forma pentru el/ea'
    gloss: Mateo plătește nota.
    note: '*Paga* este persoana a treia singular a verbului *pagar* (a plăti): *Mateo paga la cuenta*.'
