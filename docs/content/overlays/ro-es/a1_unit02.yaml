  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaniolă A1
  description: Numerele de la 0 la 100, vârsta, numerele de telefon și cantitățile din rețete, în continuarea poveștii Elenei și a lui Mateo de la atelierul de gătit din unitatea 1. Se pun în evidență expresiile de vârstă cu tener și acordul în gen în expresiile de cantitate.
