  es.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Numerele de la zero la zece
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: De la unsprezece la o sută
  es.a1.unit02.lesson03.asking_age:
    title: Cum întrebi vârsta cuiva
  es.a1.unit02.lesson04.phone_numbers:
    title: Numerele de telefon
  es.a1.unit02.lesson05.recipe_quantities:
    title: Cantitățile din rețete
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: Numărăm ingredientele cu Elena și Mateo
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: Zero
    gloss: zero
    note: '*Cero* se folosește atât ca număr, cât și ca cifră atunci când citești un șir de cifre cu voce tare.'
  es.a1.unit02.lesson01.teach.uno:
    title: Unu
    gloss: unu
    note: '*Uno* se scurtează în *un* înaintea unui substantiv masculin singular (*un huevo*, un ou) și devine *una* înaintea unuia feminin (*una taza*, o cană). Singur, de exemplu la numărat, rămâne *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Doi
    gloss: doi
    note: '*Dos* nu se schimbă, indiferent de genul substantivului.'
  es.a1.unit02.lesson01.teach.tres:
    title: Trei
    gloss: trei
    note: '*Tres*, ca și *dos*, este invariabil.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Patru
    gloss: patru
    note: '*Cuatro* este invariabil.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Cinci
    gloss: cinci
    note: '*Cinco* este invariabil.'
  es.a1.unit02.lesson01.teach.seis:
    title: Șase
    gloss: șase
    note: '*Seis* este invariabil.'
  es.a1.unit02.lesson01.teach.siete:
    title: Șapte
    gloss: șapte
    note: '*Siete* este invariabil.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Opt
    gloss: opt
    note: '*Ocho* este invariabil.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Nouă
    gloss: nouă
    note: '*Nueve* este invariabil.'
  es.a1.unit02.lesson01.teach.diez:
    title: Zece
    gloss: zece
    note: '*Diez* este invariabil.'
  es.a1.unit02.lesson02.teach.once:
    title: Unsprezece
    gloss: unsprezece
    note: '*Once* până la *quince* (11-15) sunt cuvinte de sine stătătoare, de învățat ca grup; de la șaisprezece la nouăsprezece numerele se formează de la *diez* (*dieciséis*, *diecisiete*...).'
  es.a1.unit02.lesson02.teach.doce:
    title: Doisprezece
    gloss: doisprezece
    note: '*Doce* este un cuvânt de sine stătător; seamănă cu *dos*, dar se scrie în formă proprie.'
  es.a1.unit02.lesson02.teach.trece:
    title: Treisprezece
    gloss: treisprezece
    note: '*Trece* este un cuvânt de sine stătător; seamănă cu *tres*, dar se scrie în formă proprie.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Paisprezece
    gloss: paisprezece
    note: '*Catorce* este un cuvânt de sine stătător; seamănă cu *cuatro*, dar se scrie în formă proprie.'
  es.a1.unit02.lesson02.teach.quince:
    title: Cincisprezece
    gloss: cincisprezece
    note: '*Quince* este ultimul dintre numerele scrise într-un singur cuvânt, înainte ca modelul să se schimbe la șaisprezece.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Douăzeci
    gloss: douăzeci
    note: '*Veinte* este un cuvânt de sine stătător. De la *veintiuno* (21) încolo, zecile și unitățile se scriu într-un singur cuvânt până la douăzeci și nouă, model care reapare cu *veintiocho* în lecția 3.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Treizeci
    gloss: treizeci
    note: De la treizeci încolo, zecile și unitățile se leagă prin *y* (și) și se scriu ca trei cuvinte separate, spre deosebire de cele din seria douăzecilor.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Treizeci și patru
    gloss: treizeci și patru
    note: '*Treinta y cuatro* se scrie ca trei cuvinte separate: zecea, *y* și unitatea.'
  es.a1.unit02.lesson02.teach.cien:
    title: O sută
    gloss: o sută
    note: '*Cien* este forma folosită pentru exact 100, singură; *ciento* apare când numărul continuă (*ciento uno*, 101), lucru pe care această unitate nu îl predă încă.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Întreabă vârsta, informal
    gloss: Câți ani ai?
    note: Spaniola întreabă literal câți ani ai, cu verbul *tener* (a avea), nu cu *ser* sau *estar*. În română se folosește tot „a avea”, deci construcția este asemănătoare.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Spune-ți vârsta
    gloss: Am douăzeci și opt de ani.
    note: '*Tengo* este forma pentru yo a verbului *tener*. Un răspuns complet include de obicei *años* (ani); când vârsta este deja subiectul, poate fi omis, ca în *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Întreabă vârsta, formal
    gloss: Câți ani ai?
    note: '*Tiene* este forma pentru *usted* a verbului *tener*, în acord cu registrul formal introdus în Unitatea 1.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Spune o vârstă compusă
    gloss: Am treizeci și unu de ani.
    note: '*Treinta y uno* păstrează *uno* (nu *un*) aici, pentru că în acest răspuns niciun substantiv nu urmează direct după el.'
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: Întoarce întrebarea despre vârstă
    gloss: Și tu, câți ani ai?
    note: '*Tienes* fără *años* repetat este o scurtare naturală și frecventă, odată ce subiectul a fost deja stabilit.'
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Cere un număr de telefon
    gloss: Care este numărul tău de telefon?
    note: '*Cuál*, și nu *qué*, este alegerea naturală când ceri cuiva să aleagă sau să precizeze un singur element dintr-o mulțime de posibilități, cum este un număr de telefon.'
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Un număr citit cifră cu cifră
    gloss: Șase, unu, cinci, zero, doi, nouă, șapte, trei
    note: Un număr de telefon poate fi citit cifră cu cifră, ca aici. Mulți vorbitori de spaniolă grupează cifrele și câte două, așa că ascultă atent ambele variante.
  es.a1.unit02.lesson04.teach.es_el:
    title: Introdu numărul
    gloss: Este...
    note: '*El* (articolul masculin) se folosește pentru că *número* este un substantiv masculin.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Cere repetarea
    gloss: Poți repeta, te rog?
    note: '*Puedes* este forma de persoana a doua (*tú*) a verbului *poder* (a putea), utilă oricând un număr rostit trece prea repede ca să-l prinzi.'
  es.a1.unit02.lesson04.teach.claro:
    title: Confirmă pe loc
    gloss: Sigur; desigur
    note: '*Claro* este o modalitate frecventă și prietenoasă de a accepta o rugăminte.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Spune o cantitate necesară
    gloss: Am nevoie de trei ouă.
    note: '*Necesito* este forma de persoana I a verbului *necesitar* (a avea nevoie). *Huevos* (ouă) rămâne la plural după orice număr mai mare decât unu.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Întreabă câte sunt necesare
    gloss: De câte ouă ai nevoie?
    note: '*Cuántos* se acordă în gen și număr cu substantivul despre care se întreabă; *huevos* este masculin plural, deci se folosește *cuántos* (nu *cuántas*).'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Spune o cantitate măsurată
    gloss: Două căni de făină
    note: '*De* leagă unitatea de măsură (*tazas*, căni) de ceea ce se măsoară (*harina*, făină), la fel ca de în română: „două căni de făină”.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Spune o jumătate de cantitate
    gloss: O jumătate de cană de zahăr
    note: '*Media* se acordă cu substantivul feminin *taza*; forma masculină *medio* apare, în schimb, cu substantive masculine.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Spune ce ai la îndemână
    gloss: Am patru ouă pe masă.
    note: '*Tengo* (am) arată ce ai deja la dispoziție, spre deosebire de *necesito* (am nevoie), care arată ce încă lipsește.'
  es.a1.unit02.lesson06.teach.line01:
    title: Întreabă câte ouă
    gloss: Elena îl întreabă pe Mateo de câte ouă are nevoie pentru rețetă.
    note: Continuă registrul *tú* din Unitatea 1 între cei doi prieteni.
  es.a1.unit02.lesson06.teach.line02:
    title: Spune ingredientele
    gloss: Mateo spune că are nevoie de trei ouă și două căni de făină.
    note: '*Necesito* arată ce mai trebuie pentru rețetă.'
  es.a1.unit02.lesson06.teach.line03:
    title: Oferă ce ai la îndemână
    gloss: Elena spune că are patru ouă pe masă și îl întreabă dacă are nevoie și de zahăr.
    note: '*Tengo* arată ce are Elena deja la dispoziție, separat de ce a spus Mateo că îi trebuie.'
  es.a1.unit02.lesson06.teach.line04:
    title: Confirmă o cantitate mică
    gloss: Mateo spune că da, puțin -- cam o jumătate de cană.
    note: '*Como* înseamnă aici „cam”, „aproximativ”, și nu sensul său mai frecvent de „ca” sau „precum”.'
  es.a1.unit02.lesson06.teach.line05:
    title: Cere un număr de telefon
    gloss: Elena spune că e perfect, apoi îi cere lui Mateo numărul de telefon ca să-i scrie despre următoarea oră.
    note: '*Así te escribo* („ca să-ți scriu”) explică de ce întreabă, un obicei firesc în conversație înainte de a cere date de contact.'
  es.a1.unit02.lesson06.teach.line06:
    title: Spune numărul de telefon
    gloss: Mateo își citește numărul cifră cu cifră.
    note: '*Es el* introduce numărul, acordat cu substantivul masculin *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Mulțumește-i și întreabă-l câți ani are
    gloss: 'Elena îi mulțumește, apoi mai pune o întrebare: câți ani are.'
    note: '*Una pregunta más* („încă o întrebare”) marchează o schimbare firească de subiect în aceeași conversație.'
  es.a1.unit02.lesson06.teach.line08:
    title: Spune-i vârsta
    gloss: Mateo spune că are douăzeci și opt de ani și îi pune Elenei aceeași întrebare.
    note: '*Tengo veintiocho años* folosește forma contrasă a numerelor din a doua zece, conform modelului lecției 2.'
  es.a1.unit02.lesson06.teach.line09:
    title: Spune-i vârsta ei
    gloss: Elena spune că are treizeci și unu de ani.
    note: '*Tengo treinta y uno* omite *años* aici, deoarece subiectul (vârsta) e clar din context -- o scurtare naturală, conform modelului lecției 3, în care întrebarea e returnată fără a repeta *años*.'
