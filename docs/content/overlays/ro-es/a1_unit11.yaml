teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: Cămașa
    gloss: cămașa
    note: '*Camisa* este de genul feminin.'
    example_gloss: Îmi place cămașa asta.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: Pantalonii
    gloss: pantalonii
    note: '*Pantalón* este singular în spaniolă, deși în română „pantalonii” se folosește de obicei la plural.'
    example_gloss: Pantalonii costă douăzeci.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: Jacheta
    gloss: jacheta
    note: '*Chaqueta* este de genul feminin.'
    example_gloss: Am nevoie de o jachetă pentru iarnă.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: Pantofii
    gloss: pantofii
    note: '*Zapatos* este la plural, ca „pantofii” în română.'
    example_gloss: Pantofii aceștia sunt comozi.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: Șorțul
    gloss: șorțul
    note: '*Delantal* este de genul masculin -- obiectul anume de care au nevoie Elena și Mateo pentru atelier.'
    example_gloss: Avem nevoie de un șorț pentru atelier.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Întreabă ce mărime porți
    gloss: Ce mărime porți?
    note: '*¿Qué talla usas?* este modul obișnuit de a întreba mărimea hainelor cuiva.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Spune ce mărime porți
    gloss: Port mărimea M.
    note: '*Uso* (port) + *la talla* (mărimea) + cuvântul care indică mărimea.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Spune că ți se potrivește
    gloss: Mi se potrivește bine.
    note: '*Me queda bien* folosește verbul *quedar* (a se potrivi, a sta bine) -- vezi nota de gramatică următoare.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Spune că nu ți se potrivește
    gloss: Mi se potrivește prost.
    note: Opusul lui *me queda bien*, cu *mal* în loc de *bien*.
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Cum descrie quedar croiala, nu calitatea generală.
    note: Vezi textul cardului.
    target_text: '*Me queda bien* (mi se potrivește bine) folosește *quedar* (a se potrivi, a sta), un verb diferit de *ser* sau *estar* – literal „îmi rămâne bine”. *Bien* și *mal* descriu aici croiala, nu calitatea.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Întreabă prețul șorțului
    gloss: Cât costă șorțul acesta?
    note: Folosește structura *¿Cuánto cuesta?* și numește un obiect anume cu *este* (acesta).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: Spune prețul
    gloss: Costă doisprezece.
    note: '*Cuesta* + număr indică prețul.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este vs. esta
    gloss: Cum se acordă demonstrativul cu genul substantivului.
    note: Vezi textul cardului.
    target_text: '*Este* (acesta, masculin) se acordă cu *el delantal*; *esta* (aceasta, feminin) merge cu *esta camisa* – demonstrativul se schimbă după genul substantivului, la fel ca orice adjectiv.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Spune că îți place acesta
    gloss: Îmi place acesta.
    note: '*Este* stă aici singur, ca pronume („acesta”), și se referă la obiectul tocmai menționat.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Spune că îl vei cumpăra
    gloss: Am de gând să-l cumpăr.
    note: '*Voy a* + infinitiv este construcția pentru viitorul apropiat; *comprarlo* leagă pronumele complement *lo* (îl) de infinitivul *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Spune că cumperi două
    gloss: Cumpărăm două.
    note: '*Compramos* (cumpărăm) este forma pentru *nosotros*, folosită când Elena și Mateo hotărăsc împreună.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Citirea unei liste de prețuri
    gloss: 'În acest magazin, cămașa costă cincisprezece, pantalonii costă douăzeci, jacheta costă treizeci, iar pantofii costă douăzeci și cinci. Șorțul este cel mai ieftin: costă doar doisprezece.'
    note: 'O listă de prețuri dintr-un magazin: *cuesta* (costă) pentru un singur obiect, *cuestan* (costă) pentru obiecte la plural, ca *los zapatos*.'
    glosses:
      tienda: magazin
      camisa: cămașă
      cuesta: costă (de la costar)
      quince: cincisprezece
      pantalón: pantaloni
      veinte: douăzeci
      chaqueta: jachetă
      treinta: treizeci
      zapatos: pantofi
      cuestan: costă (de la costar, plural)
      veinticinco: douăzeci și cinci
      delantal: șorț
      barato: ieftin
      solo: doar
      doce: doisprezece
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (cel mai ieftin)
    gloss: Cum se formează superlativul cu el/la + más + adjectiv.
    note: Vezi textul cardului.
    target_text: '*El más barato* (cel mai ieftin) este un superlativ – *el/la* + *más* + adjectiv, iar *de/en* indică grupul în care se compară. Unitatea aceasta nu predă încă tiparul complet al comparației, doar această expresie frecventă din magazine.'
  es.a1.unit11.lesson06.teach.line01:
    title: Spune ce vă trebuie
    gloss: Elena spune că au nevoie de șorțuri pentru atelier.
    note: '*Delantales* este pluralul lui *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Fii de acord și propune un magazin
    gloss: Mateo e de acord și propune să meargă la magazinul acela.
    note: '*Tienes razón* înseamnă „ai dreptate”; *esa tienda* înseamnă „magazinul acela”.'
  es.a1.unit11.lesson06.teach.line03:
    title: Vânzătorul îi salută
    gloss: Vânzătorul îi salută și se oferă să îi ajute.
    note: '*¿Los ayudo?* (vă ajut?) este o formulă obișnuită a vânzătorilor, adresată împreună Elenei și lui Mateo.'
  es.a1.unit11.lesson06.teach.line04:
    title: Spune ce căutați
    gloss: Elena spune că da, caută șorțuri.
    note: '*Buscamos* (căutăm) este forma pentru *nosotros* a verbului *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: Vânzătorul arată opțiuni și întreabă mărimea
    gloss: Vânzătorul arată câteva șorțuri și întreabă ce mărime poartă.
    note: '*¿Qué talla usan?* folosește pluralul *usan* (purtați), adresat ambilor, spre deosebire de singularul *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Spune o mărime
    gloss: Mateo spune că poartă mărimea M.
    note: '*Uso la talla mediana* răspunde la *¿Qué talla usan?* pentru el însuși.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena este de acord
    gloss: Elena spune că poartă aceeași mărime.
    note: '*Yo también* înseamnă „și eu”.'
  es.a1.unit11.lesson06.teach.line07:
    title: Întreabă prețul
    gloss: Mateo întreabă cât costă șorțul.
    note: '*Este* (acesta) arată șorțul din fața lui.'
  es.a1.unit11.lesson06.teach.line07b:
    title: Spune prețul
    gloss: Vânzătorul spune că costă doisprezece.
    note: '*Cuesta* + număr indică prețul.'
  es.a1.unit11.lesson06.teach.line08:
    title: Confirmă croiala și hotărăște să cumperi
    gloss: Elena spune că i se potrivește, că îi place și că îl va cumpăra.
    note: Îmbină în succesiune *me queda bien*, *me gusta este* și *voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: Fii de acord și cumpără două
    gloss: Mateo spune că și lui i se potrivește și că cumpără două.
    note: '*A mí también* (și mie, cu accent pe pronume) reia structura de acord cu *también*, cu un pronume de întărire; *compramos dos* încheie scena.'
