    title: Cine ce studiază?
    gloss: Diego nu doar lucrează, ci și studiază. Urmează un curs de spaniolă la centrul de educație pentru adulți. În fiecare săptămână învață cuvinte noi. Lucía urmează o formare la colegiu. Acolo studiază științele sănătății. Amândurora le place să studieze. Tu ce studiezi sau ce ți-ar plăcea să înveți?
    note: Compară studiile lui Diego și ale Luciei, după modelul lecturii de comparație din unitatea despre tehnologie.
    glosses:
      trabaja: lucrează
      solo: doar
      estudia: studiază
      sigue: ia
      curso: curs
      español: spaniolă
      escuela: școală (escuela de idiomas = școală de limbi străine)
