answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaniolă A1
  description: 'Spaniolă pentru începători, pentru a descrie aspectul fizic de bază al unei persoane: impresii despre înălțime și vârstă, culoarea părului și a ochilor, întrebarea esențială ¿Cómo es ...? și compararea aspectului a două persoane.'
units:
  es.a1.unit52.appearance:
    title: Descrierea înfățișării
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Înalt, scund, bătrân și tânăr
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Descrierea părului
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Ochii și cum arată cineva?
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena o descrie pe Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Comparație între Diego și Lucía
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo o recunoaște pe Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*Alto* descrie o persoană înaltă, iar *bajo* una scundă; ambele se acordă cu persoana: *alta*, *baja*.'
    example_gloss:
    - Lucía este înaltă.
    - Diego este scund.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: '*Mayor* și *joven* dau o impresie generală despre vârstă, nu un număr exact de ani.'
    example_gloss:
    - Bunicul este bătrân.
    - Mateo este tânăr.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: o impresie, nu un număr'
    gloss: Pentru vârsta exactă se folosește tener años, ca în ¿Cuántos años tienes?; mayor dă o impresie generală, fără număr, ca în El abuelo es mayor.
    note: 'Pentru vârsta exactă se spune *tener años*: *¿Cuántos años tienes?* *Mayor* dă doar o impresie generală, fără număr.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía este înaltă, iar Diego este scund
    gloss: Lucía este înaltă, iar Diego este scund.
    note: O propoziție simplă cu *y* („și”), care pregătește comparația directă dintr-o lecție următoare.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Părul
    gloss: părul
    note: '*El pelo* este masculin și rămâne la singular când vorbești despre părul cuiva în ansamblu.'
    example_gloss: Mateo are părul scurt și negru.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: 'Trei culori ale părului: *rubio* (blond), *castaño* (șaten) și *gris* (cărunt). *Rubio* se acordă cu substantivul: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena are părul blond.
    - Diego are părul șaten.
    - Bunicul are părul cărunt.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*Largo* (lung) a apărut în lecția despre înălțime, iar acum se folosește pentru lungimea părului; *corto* (scurt) este nou: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía are părul lung.
    - Diego are părul scurt.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Adjectivul urmează după substantiv
    gloss: 'Adjectivul vine după substantiv: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'Ca și în română, în spaniolă adjectivul stă de obicei după substantiv și se acordă cu el: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo și cabello
    gloss: 'Pelo și cabello înseamnă același lucru. În acest curs spunem pelo: el pelo largo.'
    note: '*Pelo* și *cabello* înseamnă amândouă „păr” în spaniola de zi cu zi; în acest curs se folosește *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo are părul scurt și negru
    gloss: Mateo are părul scurt și negru.
    note: Refolosește *negro* (negru) din unitatea despre haine.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena are părul lung și blond
    gloss: Elena are părul lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Ochii
    gloss: ochii
    note: '*Los ojos* este pluralul lui *el ojo*; ambele sunt masculine.'
    example_gloss: Mateo are ochii căprui.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: '*Azul* (albastru) și *verde* (verde) au o singură formă pentru ambele genuri; *marrón* (căprui) este cuvântul obișnuit pentru culoarea ochilor, iar pentru păr se spune *castaño*.'
    example_gloss:
    - Elena are ochii albaștri.
    - Diego are ochii căprui.
    - Lucía are ochii verzi.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos cere un adjectiv la plural
    gloss: 'Cu ojos (plural), adjectivul este tot la plural: ojos azules, ojos marrones, ojos verdes.'
    note: 'Adjectivele se acordă în număr: *ojos* este la plural, deci *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Cum arată Elena?
    gloss: Cum arată Elena?
    note: '*¿Cómo es ...?* este întrebarea esențială a acestei unități; o poți folosi pentru a întreba despre aspectul oricui.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena are părul lung și blond și ochii albaștri
    gloss: Elena are părul lung și blond și ochii albaștri.
    note: Un răspuns model care îmbină părul și ochii într-o singură propoziție cu *y*.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena o prezintă pe Nina
    gloss: 'Elena: La cafeneaua de limbi vine o fată nouă. O cheamă Nina.'
    note: '*Viene* („vine”) introduce pe cineva nou; *se llama* înseamnă „o cheamă”.'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo întreabă cum arată
    gloss: 'Mateo: Super! Cum arată?'
    note: 'Refolosește întrebarea esențială a unității, fără nume: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena descrie înălțimea și părul Ninei
    gloss: 'Elena: Este scundă și are părul scurt și blond.'
    note: Îmbină *baja* din prima lecție cu vocabularul pentru păr; *baja* este la feminin, pentru că Nina este o fată.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo întreabă despre ochii ei
    gloss: 'Mateo: Și ochii?'
    note: '*¿Y los ojos?* reia subiectul cu articolul hotărât, așa că în spaniolă nu e nevoie de un posesiv precum *sus*.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena descrie ochii Ninei
    gloss: 'Elena: Are ochii verzi.'
    note: Refolosește *los ojos verdes* din lecția despre ochi.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo o va recunoaște
    gloss: 'Mateo: Mulțumesc! Atunci o voi recunoaște.'
    note: '*La reconoceré* („o voi recunoaște”) este o formă de viitor; *la* înseamnă „o” și stă înaintea verbului.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Comparație între Diego și Lucía
    gloss: Diego și Lucía sunt frate și soră, dar sunt diferiți. Diego este scund și are părul scurt și șaten și ochii căprui. Lucía este mai înaltă decât Diego și are părul lung și șaten și ochii verzi. Dar tu, cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      hermano: frate
      hermana: soră
      eres: a arăta
      diferentes: diferit
      bajo: scund
      corto: scund
      castaño: șaten
      pelo: păr
      marrones: șaten
      ojos: ochi
      alta: mai înalt
      largo: lung
      verdes: verde
      cómo: (parte din „cómo es” = cum este / cum arată)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Refolosirea tiparului comparativului
    gloss: 'Cunoști deja structura comparativului: más + adjectiv + que. Aici o folosești pentru persoane: Lucía este mai înaltă decât Diego.'
    note: Structura *más + adjective + que* din unitatea despre comparații, aplicată acum persoanelor, nu obiectelor.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía are părul mai lung decât Diego
    gloss: Lucía are părul mai lung decât Diego.
    note: '*Más largo que* compară două lucruri: *el pelo más largo que Diego*; *largo* rămâne la masculin pentru că *pelo* este masculin.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: O propoziție-model la persoana I cu *tengo*, utilă când te descrii pe tine.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo o zărește pe Nina
    gloss: 'Mateo: Uite, aceea e Nina? Are părul scurt și blond și ochii verzi.'
    note: '*Mira* („privește”) este imperativul informal al verbului *mirar*, folosit aici pentru a arăta ceva.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena confirmă
    gloss: 'Elena: Da, aceea e Nina!'
    note: O confirmare scurtă și naturală.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina îl salută pe Mateo
    gloss: 'Nina: Bună, tu ești Mateo?'
    note: 'O întrebare simplă de salut, informală: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo îi răspunde Ninei la salut
    gloss: 'Mateo: Da! Încântat să te cunosc, Nina.'
    note: '*Encantado de conocerte* este formula obișnuită la prima întâlnire; o femeie spune *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Mateo a recunoscut-o pe Nina după descrierea făcută mai devreme de Elena.'
