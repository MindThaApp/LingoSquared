teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Nu te simți bine
    gloss: Nu mă simt bine.
    note: '*Sentirse* este reflexiv (*me siento*, *te sientes*); *no me siento bien* este modul general, ușor, de a spune că ceva nu e în regulă.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Bolnav
    gloss: bolnav
    note: 'Un adjectiv de bază, folosit cu *estar* (a fi, pentru stări): *estoy enfermo*.'
    example_gloss: Sunt bolnav.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: A fi bolnav
    gloss: Sunt bolnav.
    note: '*Enfermo* exprimă o stare mai generală și mai puternică decât *no me siento bien*; se schimbă după genul vorbitorului (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Durere de cap
    gloss: durere de cap
    note: 'În spaniolă se folosește *dolor de cabeza* cu *tener* și fără articol: *tengo dolor de cabeza*.'
    example_gloss: Mă doare capul.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: A avea dureri de cap
    gloss: Mă doare capul.
    note: 'Simptomele se combină cu *tener* (a avea): *tengo dolor de cabeza*, ca în română „am dureri de cap”.'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Durere de stomac
    gloss: durere de stomac
    note: 'Același tipar fără articol ca la *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: Am dureri de stomac.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: A avea dureri de stomac
    gloss: Am dureri de stomac.
    note: Urmează același tipar cu *tener* ca *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Întrebare generală
    gloss: Ce s-a întâmplat?
    note: Un mod general, potrivit pentru orice situație, de a întreba dacă ceva nu este în regulă.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: O expresie frecventă
    gloss: Ce ai?
    note: '*¿Qué te pasa?* este modul firesc de a întreba ce nu este în regulă (literal „ce ți se întâmplă?”); nu o traduce cuvânt cu cuvânt.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Durere în gât
    gloss: durere în gât
    note: 'Același tipar ca *dolor de cabeza* și *dolor de estómago*: *dolor de garganta*.'
    example_gloss: Mă doare gâtul.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: A avea dureri în gât
    gloss: Mă doare gâtul.
    note: Urmează același tipar cu *tener* ca celelalte simptome.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Ne interesăm de cineva
    gloss: Ești bine? Nu, nu mă simt bine.
    note: '*¿Estás bien?* este o întrebare foarte frecventă și familiară între prieteni; cu cineva căruia îi spui *usted* devine *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Febră
    gloss: febră
    note: 'Se folosește fără articol după *tener*, ca celelalte simptome: *tengo fiebre*.'
    example_gloss: Am febră.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: A avea febră
    gloss: Am febră.
    note: Urmează tiparul cu *tener*.
  es.a1.unit46.lesson03.teach.resfriado:
    title: A fi răcit
    gloss: răcit / a fi răcit
    note: '*Resfriado* este un adjectiv folosit cu *estar*; poți spune și *tengo un resfriado*, cu substantivul *resfriado*.'
    example_gloss: Sunt răcit.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Spunem că suntem răciți
    gloss: Sunt răcit.
    note: În spaniolă se poate spune *estoy resfriado* (adjectiv), la fel ca în română „sunt răcit”; adjectivul se schimbă după genul vorbitorului (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar sau tener depinde de felul cuvântului
    gloss: 'Enfermo și resfriado sunt adjective și se folosesc cu estar: sunt bolnav, sunt răcit. Fiebre și dolor de cabeza sunt substantive și se folosesc cu tener: am febră, am dureri de cap.'
    note: 'Alegerea dintre *estar* și *tener* depinde de felul cuvântului: adjectivele (*enfermo*, *resfriado*) se folosesc cu *estar*, substantivele care denumesc simptome (*fiebre*, *dolor de cabeza*) se folosesc cu *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: Farmacia
    gloss: farmacia
    note: 'Un substantiv feminin: *la farmacia*.'
    example_gloss: Merg la farmacie.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: Salutul farmacistului
    gloss: Cu ce vă pot ajuta?
    note: '*¿En qué puedo ayudarle?* este o întrebare formală standard într-un serviciu; *ayudarle* folosește pronumele formal *le*, pentru *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Cerem ceva pentru un simptom
    gloss: Aveți ceva pentru durerea de cap?
    note: '*Algo para* + simptom este modul firesc de a cere un remediu: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: O tabletă
    gloss: o tabletă / o pastilă
    note: 'Un substantiv feminin: *la pastilla*; *una pastilla* este o pastilă sau o tabletă.'
    example_gloss: Iau o pastilă.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Indicații de dozare
    gloss: Ia o pastilă de două ori pe zi.
    note: '*Toma* este imperativul informal al verbului *tomar* (a lua), folosit pentru instrucțiuni.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Registrul la farmacie
    gloss: La farmacie folosești forma de politețe (dumneavoastră).
    note: 'Farmacistul este un adult necunoscut, într-un rol de serviciu, așa că folosești *usted*: *¿Tiene algo...?* în loc de *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Citește un sfat de la farmacie
    gloss: 'Sfat: ia o pastilă de două ori pe zi, cu apă. Odihnește-te bine și bea multă apă. Tot nu te simți bine după trei zile? Atunci mergi la medic.'
    note: Urmărește doza, cele două recomandări care nu sunt medicamente și momentul în care trebuie să mergi la medic.
    glosses:
      Consejo: sfat
      toma: a lua
      veces: ori
      día: zi
      pastilla: pastilă
      Descansa: a se odihni
      bebe: a bea
      sentirte: a se simți
      sigues: încă
      bien: bine
      médico: medic
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena întreabă cum se simte Mateo
    gloss: 'Elena: Salut, Mateo, ce mai faci? Te simți deja mai bine?'
    note: '*Ya* (deja) arată că Elena verifică dacă Mateo se simte mai bine de când au vorbit ultima dată; *te sientes* este forma informală, de *tú*, a verbului *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo încă nu se simte bine
    gloss: 'Mateo: Încă nu prea bine. Mă doare capul în continuare și sunt obosit.'
    note: '*Sigo con* (încă am) arată că durerea de cap nu a trecut; *cansado* (obosit) este un adjectiv nou și util, care se schimbă după gen (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena întreabă despre medicament
    gloss: 'Elena: Ai luat o pastilă?'
    note: '*Has tomado* este perfectul compus: *has* + participiul *tomado*, același tipar ca în *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo confirmă
    gloss: 'Mateo: Da, am luat o pastilă. Acum o să mă odihnesc.'
    note: '*Voy a descansar* (o să mă odihnesc) folosește structura de viitor apropiat *ir a* + infinitiv.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena îi urează însănătoșire
    gloss: 'Elena: Bună idee. Odihnește-te bine. Însănătoșire grabnică!'
    note: '*¡Que te mejores!* este expresia fixă obișnuită prin care urezi cuiva însănătoșire rapidă; folosește conjunctivul *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo își ia rămas-bun
    gloss: 'Mateo: Mulțumesc, pe mâine!'
    note: '*Hasta mañana* urmează tiparul *hasta* + moment, ca formulele de rămas-bun precum *hasta luego*.'
