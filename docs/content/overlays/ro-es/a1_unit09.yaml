teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: Strada
    gloss: strada
    note: '*Calle* este substantiv feminin.'
    example_gloss: Locuiesc pe această stradă.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: Colțul
    gloss: colțul
    note: '*Esquina* este substantiv feminin.'
    example_gloss: Banca este la colț.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Mergi drept
    gloss: Mergi drept.
    note: '*Sigue* este forma de imperativ informal a verbului *seguir* (a urma, a continua), folosită în toate indicațiile din această unitate.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Virează la stânga
    gloss: Virează la stânga.
    note: '*Dobla* este forma de imperativ informal a verbului *doblar* (a vira, a îndoi). Vezi nota de gramatică următoare despre *doblar* și *girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Virează la dreapta
    gloss: Virează la dreapta.
    note: '*Gira* este forma de imperativ informal a verbului *girar* (a vira, a roti), complet interschimbabilă cu *doblar*.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: Traversează strada
    gloss: Traversează strada.
    note: '*Cruza* este forma de imperativ informal a verbului *cruzar* (a traversa).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar și girar
    gloss: Două cuvinte la fel de naturale pentru „a vira”.
    note: Vezi textul cardului.
    target_text: '*Doblar* și *girar* înseamnă amândouă „a vira” și sunt complet interschimbabile aici; este o preferință regională, nu o diferență de registru sau de sens. Ambele apar în această unitate.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Întreabă cum ajungi undeva
    gloss: Cum ajung la bibliotecă?
    note: '*Cómo llego a* (cum ajung la) este modul obișnuit de a cere indicații spre un loc anume.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Spune că e ușor
    gloss: E ușor.
    note: O expresie frecventă și liniștitoare, spusă înainte de a da indicații.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Mergi drept pe această stradă
    gloss: Mergi drept pe această stradă.
    note: '*Por esta calle* (pe această stradă) arată pe ce stradă să mergi.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: Virează la stânga la colț
    gloss: Virează la stânga la colț.
    note: '*En la esquina* (la colț) arată unde se face virajul.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Cere confirmarea
    gloss: Este corect așa?
    note: '*¿Está bien así?* (e bine așa?) verifică dacă ai înțeles, după ce repeți indicațiile; este pasul firesc după ce ți s-a explicat un drum.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Confirmă
    gloss: Da, așa este.
    note: '*Así es* (așa este) este o confirmare scurtă și naturală.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Să nu te rătăcești
    gloss: Să nu te rătăcești!
    note: '*No te pierdas* este imperativul negativ informal al verbului *perderse* (a se rătăci), o urare caldă și degajată la despărțire.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Citirea indicațiilor scrise
    gloss: 'Ca să ajungi la bibliotecă din piață: mergi drept pe această stradă. Virează la stânga la colț. Apoi traversează strada. Biblioteca este în dreapta.'
    note: 'Indicațiile scrise enumeră pașii în ordine: *Para llegar a...* (ca să ajungi la...) numește destinația, apoi fiecare pas este un imperativ cu *tú* (*sigue*, *dobla*, *cruza*), iar *después* (apoi) leagă pașii.'
    glosses:
      llegar: a ajunge
      biblioteca: biblioteca
      desde: din, de la
      mercado: piață
      sigue: continuă / mergi (de la seguir)
      derecho: drept înainte
      calle: strada
      Dobla: virează (de la doblar)
      izquierda: stânga
      esquina: colț
      Después: apoi
      cruza: traversează (de la cruzar)
      está: se află (de la estar)
      derecha: dreapta
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (din, de la)
    gloss: Cum marchează desde punctul de plecare al unui traseu.
    note: Vezi textul cardului.
    target_text: '*Desde* (din, de la) marchează punctul de plecare al unui traseu și se asociază cu *a* (la) pentru destinație: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: Cere indicații
    gloss: Mateo o întreabă pe Elena cum ajunge la bibliotecă din piață.
    note: 'Aceeași întrebare *¿Cómo llego a...?* de mai devreme, acum cu un punct de plecare: *desde el mercado* (din piață).'
  es.a1.unit09.lesson06.teach.line02:
    title: Dă primul pas
    gloss: Elena spune că este ușor și dă prima indicație.
    note: '*Es fácil* (este ușor) liniștește înainte de a da primul pas.'
  es.a1.unit09.lesson06.teach.line03:
    title: Repetă și cere mai multe indicații
    gloss: Mateo repetă indicația și întreabă ce urmează.
    note: '*Sigo derecho* (merg înainte) este forma de persoana I a verbului *seguir*; Mateo confirmă activ în timp ce urmează indicațiile.'
  es.a1.unit09.lesson06.teach.line04:
    title: Spune al doilea pas
    gloss: Elena îi spune să o ia la stânga la colț.
    note: '*Dobla* (virează) -- *gira* ar însemna același lucru aici.'
  es.a1.unit09.lesson06.teach.line05:
    title: Repetă și confirmă
    gloss: Mateo repetă virajul și întreabă dacă e corect.
    note: '*Doblo* (virez) reia *Sigo derecho* de mai devreme -- Mateo repetă fiecare pas la persoana I (*yo*) ca să verifice.'
  es.a1.unit09.lesson06.teach.line06:
    title: Confirmă și spune ultimii pași
    gloss: Elena confirmă, apoi îi spune să traverseze strada -- biblioteca va fi în dreapta.
    note: '*Sí, así es* (da, așa este) confirmă, apoi *después* (apoi) introduce ultimii pași ai traseului.'
  es.a1.unit09.lesson06.teach.line07:
    title: Mulțumește-i Elenei
    gloss: Mateo îi mulțumește călduros Elenei.
    note: '*Muchas gracias* (mulțumesc mult) este o variantă mai călduroasă a lui *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Răspunde și ia-ți la revedere
    gloss: Elena spune „cu plăcere” și îi spune să nu se rătăcească.
    note: '*De nada* (cu plăcere) este răspunsul obișnuit la *gracias*.'
