teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: Slujba / munca
    gloss: slujba / munca
    note: '*Trabajo* este de genul masculin și este și forma verbală „lucrez”.'
    example_gloss: Îmi place slujba mea.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: Biroul
    gloss: biroul
    note: '*Oficina* este de genul feminin.'
    example_gloss: Lucrez într-un birou.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: Ghișeul
    gloss: ghișeul
    note: '*Escritorio* este de genul masculin.'
    example_gloss: Aceasta este masa mea de lucru.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: Școala
    gloss: școala
    note: '*Escuela* este de genul feminin.'
    example_gloss: Predau la o școală.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: Studenții
    gloss: studenții
    note: '*Estudiante* are aceeași formă pentru bărbat și pentru femeie; pluralul *los estudiantes* cuprinde un grup mixt.'
    example_gloss: Am douăzeci de studenți.
  es.a1.unit13.lesson02.teach.trabajar:
    title: A lucra
    gloss: a lucra
    note: Forma de infinitiv a verbului, folosită în construcții precum *me gusta trabajar* (îmi place să lucrez).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Spune că ești contabil
    gloss: Sunt contabil.
    note: Numele profesiilor se folosesc cu *ser* + profesie, fără articol – vezi nota de gramatică de mai jos.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Spune că ești profesoară (feminin)
    gloss: Sunt profesoară.
    note: '*Profesora* este forma de feminin a lui *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Spune unde predai
    gloss: Predau la o școală.
    note: '*Enseño* (predau) este forma de persoana I a lui *enseñar*, aici împreună cu *escuela* (școală).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: Profesiile cu ser
    gloss: Cum exprimă spaniola o profesie fără articol.
    note: Vezi textul cardului.
    target_text: 'Numele profesiilor se folosesc cu *ser* + profesie, fără articol: *soy contador* (sunt contabil), nu *soy un contador*. *Contador* are o formă de feminin corespunzătoare, *contadora*; *profesor/profesora* este același tip de pereche masculin/feminin pentru „profesor” (adaugi *-a* pentru o femeie).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Întreabă despre meseria cuiva
    gloss: Cu ce te ocupi?
    note: '*¿En qué trabajas?* (literal „în ce lucrezi?”) este modul obișnuit de a întreba pe cineva ce meserie are.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Răspunde cu meseria ta
    gloss: Lucrez într-un birou. Sunt contabil.
    note: Îmbină *oficina* cu *soy contador* într-un răspuns firesc din două propoziții.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Spune că îți place slujba
    gloss: Îmi place slujba mea.
    note: Reia construcția cu *gustar*, împreună cu *mi trabajo* (slujba mea).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Exprimă o preferință
    gloss: Dar prefer să gătesc.
    note: '*Prefiero* (prefer) este o formă pe care ai mai întâlnit-o; *cocinar* (a găti) este infinitivul activității centrale a întregii povești.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Spune că amândoi preferați asta
    gloss: Amândoi preferăm asta.
    note: '*Preferimos* este forma de *nosotros* a verbului *preferir*, folosită atunci când Elena și Mateo cad de acord.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Citim despre slujbele lor
    gloss: Mateo lucrează într-un birou din Londra. Este contabil. Elena predă la o școală. Este profesoară și are douăzeci de elevi. Amândurora le place slujba, dar preferă să gătească împreună marțea.
    note: Un scurt rezumat al meseriilor lui Mateo și Elenei.
    glosses:
      trabaja: lucrează (de la trabajar)
      oficina: birou
      contador: contabil
      enseña: predă (de la enseñar)
      escuela: școală
      profesora: profesoară
      tiene: are (de la tener)
      veinte: douăzeci
      estudiantes: elevi
      gusta: place (de la gustar)
      trabajo: slujbă
      prefieren: preferă (de la preferir)
      cocinar: a găti
      juntos: împreună
      martes: marțea
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Cum se extinde gustar la un complement indirect la plural.
    note: Vezi textul cardului.
    target_text: '*A los dos les gusta* (le place amândurora) extinde construcția cu *gustar* (pe care o știi deja) la un complement indirect la plural: *les* (lor) în loc de *me/te* (mie/ție).'
  es.a1.unit13.lesson06.teach.line01:
    title: Întreabă-l pe Mateo despre meseria lui
    gloss: Elena îl întreabă pe Mateo ce lucrează.
    note: Întrebarea învățată mai devreme, acum adresată lui Mateo pe nume.
  es.a1.unit13.lesson06.teach.line02:
    title: Răspunde cu meseria lui
    gloss: Mateo spune că lucrează într-un birou, ca contabil.
    note: 'Răspunsul complet învățat mai devreme: unde lucrează, apoi numele meseriei.'
  es.a1.unit13.lesson06.teach.line03:
    title: Reacționează și spune-ți meseria
    gloss: Elena spune că i se pare interesant și povestește că este profesoară.
    note: '*Interesante* (interesant) este o nouă rudă transparentă; restul, *soy profesora* și *enseño en una escuela*, îl știi deja.'
  es.a1.unit13.lesson06.teach.line04:
    title: Întreab-o dacă îi place să predea
    gloss: Mateo o întreabă dacă îi place să predea.
    note: '*¿Te gusta enseñar?* combină tiparul cunoscut al întrebării cu *gustar* cu infinitivul *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: Confirmă și adaugă o preferință
    gloss: Elena spune că îi place mult, dar preferă să gătească cu el marțea.
    note: '*Contigo* (cu tine) este o formă nouă, contrasă, de prepoziție + pronume; *los martes* (marțea) folosește articolul la plural pentru o zi obișnuită a săptămânii.'
  es.a1.unit13.lesson06.teach.line06:
    title: Ești de acord cu aceeași preferință
    gloss: Mateo spune că și lui îi place slujba, dar preferă să gătească.
    note: '*A mí también* (și mie) este tiparul de acord apăsat pentru *gustar*: *a mí* subliniază cui îi place.'
  es.a1.unit13.lesson06.teach.line07:
    title: Trage concluzia
    gloss: Elena concluzionează că amândoi preferă asta (să gătească împreună).
    note: '*Entonces* (deci / atunci) este un nou conector logic; restul este *los dos preferimos esto* (amândoi preferăm asta).'
  es.a1.unit13.lesson06.teach.line08:
    title: Confirmă cu entuziasm
    gloss: 'Mateo e de acord: categoric.'
    note: '*Definitivamente* (categoric) este un nou adverb transparent care încheie scena.'
