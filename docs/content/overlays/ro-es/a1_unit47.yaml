teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: A suna
    gloss: a suna
    note: Infinitivul verbului folosit pentru a da un telefon.
    example_gloss: Trebuie să te sun.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Spui că suni
    gloss: Te sun.
    note: '*Llamo* este forma de *yo* a verbului *llamar*; împreună cu *te* înseamnă „te sun”. Ca și în română, prezentul exprimă aici o acțiune apropiată în viitor.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Răspunsul la telefon
    gloss: Bună, sunt Elena.
    note: 'La telefon, în spaniolă te identifici cu *soy* + nume (literal „sunt”), la fel ca în română: „Bună, sunt Elena”.'
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo răspunde la fel
    gloss: Bună, sunt Mateo.
    note: Același tipar *soy* + nume ca în *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Întrebi cine sună
    gloss: Cu cine vorbesc?
    note: '*¿Con quién hablo?* este fraza obișnuită când nu știi cine sună.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Te prezinți formal
    gloss: Vorbiți cu Elena.
    note: '*Habla con* + nume folosește forma de politețe *usted* a verbului *hablar*: corespondentul politicos al lui *soy* + nume.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Ceri să repete
    gloss: Poți repeta asta?
    note: '*¿Puedes...?* (Poți ...?) plus *repetir* (a repeta) plus *eso* (asta).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Ceri cuiva să vorbească mai rar
    gloss: Nu vorbi atât de repede, te rog.
    note: '*No hables* este imperativul negativ informal al verbului *hablar*; *tan rápido* (atât de repede) indică gradul.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Spui că nu auzi bine
    gloss: Nu te aud bine.
    note: '*Oír* (a auzi) împreună cu *no ... bien* (nu... bine) exprimă o problemă de auz și este diferit de *entender* (a înțelege); *te oigo* înseamnă „te aud”.'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: Mesajul text
    gloss: mesajul text
    note: 'Substantiv masculin: *el mensaje*. Vorbitorii de spaniolă spun și *el SMS* sau *el texto*, dar *mensaje* este varianta neutră.'
    example_gloss: Mesajul este de la Elena.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Cum spui că trimiți un mesaj
    gloss: Îți trimit un mesaj.
    note: '*Enviar* (a trimite) vine după pronumele *te* (ție): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Cum spui că suni înapoi
    gloss: Te sun mai târziu.
    note: '*Más tarde* (mai târziu) stă la sfârșitul propoziției: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Citește o conversație prin mesaje
    gloss: 'Mateo: Salut, Elena, mă poți suna? Trebuie să-ți spun ceva. Elena: Da, sigur, te sun înapoi în cinci minute.'
    note: Urmărește ce îi cere Mateo, de ce și când spune Elena că sună înapoi.
    glosses:
      Hola: salut
      puedes: a putea
      llamarme: a suna
      Tengo: a trebui / a fi nevoit să
      algo: ceva
      contarte: a povesti / a spune
      claro: sigur / desigur
      llamada: a suna
      cinco: cinci
      minutos: minute
      devuelvo: înapoi
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo răspunde la telefon
    gloss: 'Mateo: Alo, sunt Mateo.'
    note: 'Același tipar *soy* + nume din prima lecție, folosit acum într-o convorbire telefonică reală: cine răspunde vorbește primul și își spune numele.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena se prezintă
    gloss: 'Elena: Salut, Mateo, sunt Elena. Mateo: Mulțumesc că ai sunat!'
    note: '*Gracias por llamar* (mulțumesc că ai sunat) se formează cu *gracias por* + infinitiv.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena întreabă despre tură
    gloss: 'Elena: Cum a fost prima ta tură?'
    note: '*Ha ido* este perfectul compus al verbului *ir* (aici „a decurge”): *ha* + participiul *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo dă vești bune
    gloss: 'Mateo: A mers foarte bine, mai bine decât mă așteptam.'
    note: '*Ha ido muy bien* reia perfectul compus din întrebare; *mejor de lo esperado* (mai bine decât se aștepta) face comparația cu *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado sunt arătate împreună cu infinitivele lor
    gloss: ha ido → ir (a merge), es → ser (a fi), esperado → esperar (a aștepta)
    note: '*Ha ido*, *es* și *esperado* sunt arătate împreună cu infinitivele lor: *ir*, *ser*, *esperar*. Deocamdată, consideră *ha ido muy bien* o expresie fixă; perfectul compus se exersează pe larg mai târziu.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena este mândră
    gloss: 'Elena: Ce bine să aud asta! Sunt mândră de tine.'
    note: '*Orgulloso/a de* (mândru de) este o combinație fixă cu *de*; adjectivul se acordă cu cel care vorbește (*orgullosa* pentru Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo este emoționat
    gloss: 'Mateo: Mulțumesc mult, asta înseamnă mult pentru mine.'
    note: '*Significa* este forma de persoana a treia a verbului *significar* (a însemna); *para mí* (pentru mine) arată cui îi este importantă.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Posesivul „său”
    gloss: Prima lui tură a mers foarte bine.
    note: '*Su* este aici posesivul „lui” (sau „ei”, ori „dumneavoastră” cu *usted*); contextul arată al cui este.'
