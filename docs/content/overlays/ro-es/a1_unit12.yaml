teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Nervos
    gloss: nervos
    note: '*Nervioso* (masculin) / *nerviosa* (feminin) -- pereche obișnuită de adjective în -o/-a.'
    example_gloss:
    - Mateo este nervos.
    - Elena este nervoasă.
  es.a1.unit12.lesson01.teach.contento:
    title: Fericit
    gloss: fericit / mulțumit
    note: '*Contento/contenta* descrie starea de fericire sau de mulțumire, nu o trăsătură permanentă.'
    example_gloss:
    - Mateo este fericit.
    - Elena este fericită.
  es.a1.unit12.lesson01.teach.cansado:
    title: Obosit
    gloss: obosit
    note: '*Cansado/cansada*, de la *cansar* (a obosi).'
    example_gloss:
    - După atelier, sunt obosit. (masculin)
    - După atelier, sunt obosită. (feminin)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Îngrijorat
    gloss: îngrijorat
    note: '*Preocupado/preocupada*, de la *preocupar* (a îngrijora).'
    example_gloss:
    - Mateo este îngrijorat.
    - Elena este îngrijorată.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Mândru
    gloss: mândru
    note: '*Orgulloso/orgullosa* -- *estoy orgulloso/a de...* (sunt mândru de...) cere *de* înaintea lucrului pentru care ești mândru.'
    example_gloss:
    - Sunt mândru de tine. (masculin)
    - Sunt mândră de tine. (feminin)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Sunt nervos (masculin)
    gloss: Sunt nervos.
    note: '*Estoy* (eu sunt, de la *estar*) + forma de masculin a adjectivului.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Sunt nervoasă (feminin)
    gloss: Sunt nervos.
    note: Aceeași construcție, cu forma de feminin a adjectivului.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Sunt fericit (masculin)
    gloss: Sunt fericit.
    note: '*Estoy contento* -- același tipar *estar* + adjectiv.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar sau ser pentru sentimente
    gloss: De ce sentimentele se exprimă de obicei cu estar, nu cu ser.
    note: Vezi textul cardului.
    target_text: '*Estar* + adjectiv descrie o stare sau un sentiment trecător (estoy nervioso -- sunt nervos [acum]), spre deosebire de *ser* + adjectiv, care exprimă o trăsătură permanentă. Sentimentele se exprimă de obicei cu *estar*.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Întreabă cum se simte cineva
    gloss: Cum te simți?
    note: '*¿Cómo te sientes?* folosește *sentirse* (a se simți), un verb reflexiv, diferit de *estar* + adjectiv.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Descrie un sentiment amestecat
    gloss: Mă simt puțin nervos, dar fericit.
    note: '*Me siento* (mă simt) + adjectiv, cu *pero* (dar) care pune în contrast două sentimente simultane -- răspunsul firesc la *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Se arde ceva
    gloss: Se arde ceva!
    note: '*Se quema* este forma reflexivă a verbului *quemar* (a arde) -- „se arde singur”, modul firesc de a spune că ceva arde fără a spune cine face asta.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Sunt îngrijorat (masculin)
    gloss: Sunt îngrijorat.
    note: '*Preocupado* în tiparul *estoy* + adjectiv.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Nu te îngrijora
    gloss: Nu-ți face griji.
    note: Vezi nota de gramatică următoare.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Propune să o iei de la capăt
    gloss: Putem începe din nou.
    note: '*Podemos* (putem) + infinitiv; *de nuevo* (din nou) este o expresie uzuală pentru a reface ceva.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes (nu te îngrijora) este un imperativ negativ informal, format din no + pronume reflexiv (te) + verb.
    gloss: No te preocupes
    note: Vezi textul cardului.
    target_text: '*No te preocupes* (nu-ți face griji) este un imperativ negativ informal, format din *no* + pronume reflexiv (*te*) + verb.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: O reflecție despre curs
    gloss: O reflecție despre curs
    note: '*Estaban* (erau) descrie cum se simțeau atunci; *están* (sunt) descrie cum se simt acum.'
    glosses:
      Antes: Estaban (erau) descrie cum se simțeau atunci; están (sunt) descrie cum se simt acum.
      clase: înainte
      estaban: curs, oră
      poco: erau (de la estar)
      nerviosos: nervos
      Durante: nervos
      algo: în timpul
      quemó: ceva
      dos: s-a ars (de la quemarse)
      preocupados: îngrijorat
      Pero: îngrijorat
      empezaron: dar
      nuevo: au început (de la empezar)
      final: din nou
      pastel: sfârșit, final
      salió: prăjitură, tort
      perfecto: a ieșit (de la salir)
      Ahora: perfect
      están: acum
      orgullosos: mândru
      contentos: bucuros
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: Acordul adjectivelor la plural
    gloss: De ce un grup mixt primește adjective la masculin plural.
    note: Vezi textul cardului.
    target_text: Când vorbești despre Elena și Mateo împreună, adjectivele iau forma de masculin plural (nerviosos, preocupados, orgullosos, contentos) -- regula obișnuită în spaniolă, ca și în română, când un grup include cel puțin un membru de genul masculin.
  es.a1.unit12.lesson06.teach.line01:
    title: Întreabă cum se simte Mateo
    gloss: Elena îl întreabă pe Mateo cum se simte înainte de curs.
    note: '*¿Cómo te sientes?* întreabă cum se simte cineva.'
  es.a1.unit12.lesson06.teach.line02:
    title: Răspunde cu un sentiment amestecat
    gloss: Mateo spune că se simte puțin nervos, dar fericit.
    note: Mateo folosește formele de masculin *nervioso* și *contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: Reacționează la incident
    gloss: Elena este de acord, apoi observă că se arde ceva.
    note: '*¡Ay, no!* (vai, nu!) este o exclamație obișnuită de alarmă.'
  es.a1.unit12.lesson06.teach.line04:
    title: Exprimă îngrijorarea
    gloss: Mateo spune că este îngrijorat și întreabă ce să facă.
    note: '*¿Qué hacemos?* (ce facem?) este o întrebare practică.'
  es.a1.unit12.lesson06.teach.line05:
    title: Liniștește și propune o soluție
    gloss: Elena îi spune să nu se îngrijoreze -- pot începe din nou.
    note: Combină *no te preocupes* și *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Fii de acord și încearcă din nou
    gloss: Mateo este de acord și propune să încerce din nou.
    note: '*Vamos a intentarlo otra vez* (hai să încercăm din nou) reia construcția *vamos a* + infinitiv din unitățile anterioare, acum cu pronumele de obiect *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Anunță succesul
    gloss: Elena anunță că prăjitura este acum perfectă.
    note: '*¡Mira!* (uite!) este o interjecție pentru a atrage atenția; *el pastel* (prăjitura) este desertul din centrul incidentului.'
  es.a1.unit12.lesson06.teach.line08:
    title: Sărbătorește și exprimă mândria
    gloss: Mateo se bucură și spune că este mândru de amândoi.
    note: '*¡Qué bien!* (ce bine!) folosește tiparul exclamativ *¡Qué...!*, ca în *¡Qué calor!*; *de nosotros* (de noi) extinde *estoy orgulloso de ti* la un grup.'
  es.a1.unit12.lesson06.teach.line09:
    title: Împărtășește mândria
    gloss: Elena spune că și ea este mândră -- au reușit împreună.
    note: '*Lo logramos juntos* (am reușit împreună) este o replică firească de final; aici apare pentru prima dată *lograr* (a reuși).'
