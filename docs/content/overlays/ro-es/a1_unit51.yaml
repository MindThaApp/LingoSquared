teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Biletul de intrare
    gloss: biletul de intrare
    note: '*El billete* este de genul masculin, deci se spune *un billete*, nu *una*.'
    example_gloss: Aș dori un bilet până la Toledo.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Cum ceri un bilet
    gloss: Aș dori un bilet până la Toledo.
    note: '*Quisiera* („aș dori”) face cererea mai blândă și este mai politicos decât *quiero*.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: Casierul întreabă ce fel de bilet
    gloss: Doriți un bilet dus sau dus-întors?
    note: '*Quiere* este forma de politețe *usted* a verbului *querer*, folosită aici pentru un angajat necunoscut al gării.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Cum răspunzi politicos
    gloss: Dus-întors, vă rog.
    note: '*Por favor* înseamnă „vă rog”; cererea rămâne politicoasă și scurtă.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Registrul la ghișeu
    gloss: La ghișeu se folosește de obicei forma de politețe usted.
    note: Persoanele necunoscute care lucrează în servicii li se adresează cu *usted*, nu cu *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Peronul
    gloss: peronul
    note: '*El andén* este de genul masculin: *un andén*, *el andén*.'
    example_gloss: De la ce peron pleacă trenul spre Toledo?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Cum întrebi de peron
    gloss: De la ce peron pleacă trenul spre Toledo?
    note: '*¿De qué andén ...?* întreabă anume despre peron, nu despre un loc oarecare.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Cum spui detaliile plecării
    gloss: Trenul pleacă la zece fără un sfert de la peronul cinci.
    note: '*Las diez menos cuarto* reia modelul „fără un sfert” din lecția despre oră.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Cum întrebi ora sosirii
    gloss: La ce oră ajunge trenul?
    note: '*¿A qué hora llega ...?* întreabă ora sosirii; *llegar* este regulat și se construiește cu *a las* înaintea orei.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Cum spui ora sosirii
    gloss: Trenul ajunge la ora unsprezece.
    note: '*Llega a las once* folosește *llegar* („a ajunge”) cu *a las* înaintea orei.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: La timp / întârzierea
    gloss: la timp; întârzierea
    note: '*A tiempo* este o expresie fixă pentru ceva care se întâmplă conform programului. *El retraso* („întârzierea”) este de genul masculin.'
    example_gloss:
    - Trenul nu pleacă la timp.
    - 'Atenție: trenul spre Toledo are întârziere.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Un anunț
    gloss: 'Atenție: trenul spre Toledo are întârziere.'
    note: '*Atención* deschide un anunț din gară, la fel ca „Atenție, stimați călători” în română.'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: Cum negi „la timp”
    gloss: Trenul nu pleacă la timp.
    note: '*No* stă chiar înaintea verbului și neagă toată propoziția: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: O schimbare de peron
    gloss: Trenul pleacă de la peronul trei, în loc de peronul cinci.
    note: '*En lugar de* înseamnă „în loc de”.'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Cum spui cât este întârzierea
    gloss: Trenul are zece minute de întârziere.
    note: '*Lleva retraso* (literal „poartă întârziere”) este modul firesc de a spune că ceva are întârziere.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Intrarea, ieșirea, sala de așteptare
    gloss: intrarea; ieșirea; sala de așteptare
    note: '*La entrada*, *la salida* și *la sala de espera* sunt toate substantive de genul feminin.'
    example_gloss:
    - Unde este intrarea?
    - Unde este ieșirea?
    - Unde este sala de așteptare?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Cum întrebi unde este un peron
    gloss: Unde este peronul șapte?
    note: Aici se reia modelul *¿Dónde está ...?* din lecțiile despre indicații.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Cum dai indicații
    gloss: Drept înainte și apoi la dreapta.
    note: '*Todo recto* și *a la derecha* sunt expresiile de direcție din lecțiile despre indicații, reluate într-o gară.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Cum întrebi de sala de așteptare
    gloss: Unde este sala de așteptare?
    note: Același model de întrebare, aplicat unui loc nou.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Citește un bilet tipărit
    gloss: 'Bilet: Madrid Atocha – Toledo. Plecare: zece și zece, peronul șapte. Sosire: unsprezece fără zece. Dus-întors. Preț: doisprezece euro patruzeci.'
    note: Urmărește ora și peronul de plecare, ora sosirii, tipul biletului și prețul.
    glosses:
      Billete: bilet
      Salida: plecare
      diez: zece
      andén: peron
      siete: șapte
      Llegada: sosire
      once: unsprezece
      vuelta: bilet dus-întors
      Precio: preț
      doce: doisprezece
      euros: euro
      cuarenta: patruzeci
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo spune planul
    gloss: 'Mateo: Trebuie să ajungem la peronul șapte. Trenul pleacă la zece și zece.'
    note: '*Tenemos que* + infinitiv („trebuie să”) exprimă o necesitate practică.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena citește panoul
    gloss: 'Elena: Uite panoul: întârziere, zece minute.'
    note: '*Ahí está* („uite-l acolo”) arată panoul; *el panel* este panoul de informații.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo rămâne calm
    gloss: 'Mateo: Nicio problemă, mai avem timp de o cafea.'
    note: '*No hay problema* este o formulă obișnuită, informală, de liniștire.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: Sosește trenul
    gloss: 'Elena: Bună idee. Ah, uite trenul, a și venit! Peronul șapte, exact!'
    note: '*Ya* („deja”) arată că trenul a sosit mai devreme decât se aștepta, având în vedere întârzierea tocmai anunțată.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Se urcă în tren
    gloss: 'Mateo: Haideți, se urcă toată lumea! Toledo, venim!'
    note: '*Suben* („se urcă”) vine de la *subir*, a se urca într-un mijloc de transport; *¡Allá vamos!* este modul firesc de a spune „hai la drum / venim”, o traducere cuvânt cu cuvânt ar suna ciudat.'
