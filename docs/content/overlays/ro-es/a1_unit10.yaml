teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Vremea
    gloss: vremea
    note: '*Tiempo* înseamnă și „timp”; contextul arată care este sensul.'
    example_gloss: Cum e vremea astăzi?
  es.a1.unit10.lesson01.teach.el_sol:
    title: Soarele
    gloss: soarele
    note: '*Sol* este de genul masculin.'
    example_gloss: Azi este foarte mult soare.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: Ploaia
    gloss: ploaia
    note: '*Lluvia* este de genul feminin.'
    example_gloss: Nu-mi place ploaia.
  es.a1.unit10.lesson01.teach.el_viento:
    title: Vântul
    gloss: vântul
    note: '*Viento* este de genul masculin.'
    example_gloss: Astăzi bate mult vântul.
  es.a1.unit10.lesson01.teach.la_nube:
    title: Norul
    gloss: norul
    note: '*Nube* este de genul feminin.'
    example_gloss: Nu e niciun nor.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Este cald
    gloss: E cald.
    note: '*Hace calor* (literal „face căldură”) este expresia obișnuită pentru vremea caldă.'
    example_gloss: Este foarte cald în iulie.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Este frig
    gloss: E frig.
    note: '*Hace frío* urmează același tipar *hace* + substantiv ca *hace calor*.'
    example_gloss: În decembrie este frig.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: Este soare
    gloss: Este soare.
    note: '*Hace sol* folosește *el sol* (soarele) în același tipar de expresie.'
  es.a1.unit10.lesson02.teach.llueve:
    title: Plouă
    gloss: Plouă.
    note: '*Llueve* este o formă verbală de sine stătătoare (de la *llover*, „a ploua”), nu tiparul cu *hace*; vezi nota de gramatică următoare.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: Este înnorat
    gloss: Este înnorat.
    note: '*Está nublado* folosește *estar* + adjectiv, al treilea tipar distinct pentru descrierea vremii.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: trei tipare'
    gloss: Trei tipare gramaticale diferite pentru a descrie vremea.
    note: Vezi textul cardului.
    target_text: 'Expresiile despre vreme cu *hace* (hace calor, hace frío, hace sol) sunt o expresie fixă, literal „face căldură/frig/soare”. *Llueve* (plouă) este o formă verbală de sine stătătoare, iar *está nublado* (este înnorat) folosește *estar* + adjectiv -- trei tipare diferite pentru aceeași idee: descrierea vremii.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Întreabă despre vreme
    gloss: Cum e vremea astăzi?
    note: '*¿Qué tiempo hace hoy?* este modul obișnuit de a întreba despre vremea de acum, cu *el tiempo* („vremea”).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Descrie o vreme caldă și cu soare
    gloss: Este foarte cald și senin, cu soare.
    note: Combină două expresii cu *hace* prin *y* („și”).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Descrie o vreme caldă și cu vânt
    gloss: Este cald, dar bate vântul.
    note: '*Pero* („dar”) pune în contrast două fapte despre vreme: căldura și vântul; se folosește *hay* + substantiv, ca în *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Vorbește despre iarna la Madrid
    gloss: Iarna e foarte frig la Madrid.
    note: '*En invierno* („iarna”) introduce un anotimp, în contrast cu *en julio* de mai jos.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Vorbește despre căldura din iulie
    gloss: În iulie este prea cald.
    note: '*Demasiado* („prea”) întărește *calor* mai mult decât simplul *mucho* („mult”).'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Explică de ce ai nevoie de apă
    gloss: Avem nevoie de apă pentru că e cald.
    note: '*Porque* („pentru că”) leagă o nevoie de cauza ei legată de vreme, o frază practică pentru atelier.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Citim o prognoză meteo
    gloss: Azi, 22 iulie, este foarte cald și senin. Nu este niciun nor. Bate și un pic de vânt. Este o zi bună pentru atelierul de gătit, dar este important să iei apă.
    note: O scurtă prognoză pentru 22 iulie, ziua cursului de gătit.
    glosses:
      Hoy: azi
      veintidós: al douăzeci și doilea
      julio: iulie
      hace: este / vremea este (de la hacer)
      calor: vreme caldă / căldură
      sol: cu soare / soare
      hay: există / este (de la haber)
      nube: nor
      También: de asemenea
      poco: puțin
      viento: vânt
      buen: bine
      día: zi
      ir: a merge
      taller: atelier
      cocina: gătit
      importante: important
      llevar: a lua / a căra
      agua: apă
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de („un pic de”)
    gloss: Cum arată un poco de o cantitate mică.
    note: Vezi textul cardului.
    target_text: '*Un poco de* (puțin) se folosește la cantitățile de alimente, iar aici descrie o cantitate mică de vânt -- același tipar, cu un substantiv nou.'
  es.a1.unit10.lesson06.teach.line01:
    title: Comentează căldura
    gloss: Elena spune cât de cald este azi.
    note: '*¡Qué calor hace hoy!* („ce căldură face azi”, adică „ce cald este azi!”) este o folosire exclamativă a expresiei *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Fii de acord și adaugă detalii
    gloss: Mateo este de acord și spune că nu e niciun nor.
    note: Combină *hace mucho calor y hace sol* cu *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Propune să luați apă
    gloss: Elena spune că au nevoie de apă pentru drum.
    note: '*El camino* („drumul”) se referă la plimbarea lor până la atelier.'
  es.a1.unit10.lesson06.teach.line04:
    title: Fii de acord și arată un magazin
    gloss: Mateo este de acord și spune că e un magazin aproape.
    note: '*Cerca de aquí* („aproape de aici”) folosește locuțiunea *cerca de* („aproape de”).'
  es.a1.unit10.lesson06.teach.line05:
    title: Compară iarna cu vara
    gloss: Elena compară iernile friguroase din Madrid cu căldura excesivă de azi, din iulie.
    note: 'Combină cele două fraze despre anotimpuri: *en invierno hace mucho frío* și *en julio hace demasiado calor*.'
  es.a1.unit10.lesson06.teach.line06:
    title: Spune ce preferi
    gloss: 'Mateo spune că preferă căldura: la Londra plouă aproape în fiecare zi.'
    note: '*Prefiero* („prefer”) este o nouă formă verbală de persoana întâi; *casi todos los días* („aproape în fiecare zi”) este o expresie utilă de frecvență.'
  es.a1.unit10.lesson06.teach.line07:
    title: Fii de acord și grăbește pasul
    gloss: Elena este de acord și spune că trebuie să meargă, altfel întârzie la curs.
    note: '*Es verdad* înseamnă „e adevărat”; *o* (sau) anunță aici o consecință („altfel”).'
  es.a1.unit10.lesson06.teach.line08:
    title: De acord, mergem
    gloss: Mateo e de acord cu ea și pleacă.
    note: '*Tienes razón* (ai dreptate) este o expresie frecventă pentru a fi de acord.'
