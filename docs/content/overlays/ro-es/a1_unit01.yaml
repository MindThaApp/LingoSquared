teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Forma de politețe
    gloss: dumneavoastră (formal, de politețe)
    note: Și româna, și spaniola marchează alegerea dintre formal și informal (tu / dumneavoastră). Usted se folosește cu un adult necunoscut sau când tonul trebuie să fie respectuos. Deși se traduce prin „dumneavoastră”, verbul se conjugă la fel ca la él sau ella (persoana a treia singular).
  es.a1.unit01.lesson01.teach.tu:
    title: Forma informală
    gloss: tu (informal, singular)
    note: Tú se folosește cu un prieten, un coleg, un copil sau cu altă persoană când relația este informală. Accentul deosebește pronumele tú de posesivul tu, care înseamnă „tău / ta”.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Întrebare formală despre starea cuiva
    gloss: Ce mai faceți?
    note: Está este forma de usted a verbului estar. Spaniola folosește estar pentru starea de moment a cuiva. Cómo poartă accent, deoarece este cuvânt interogativ.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Întrebare informală despre starea cuiva
    gloss: Ce mai faceți?
    note: 'Estás este forma de tú a verbului estar. Ca în română (faceți / faci), verbul se schimbă după persoana căreia i te adresezi: está pentru usted, estás pentru tú.'
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Un răspuns scurt
    gloss: Bine, mulțumesc.
    note: Spaniola poate răspunde doar cu bien, fără a repeta subiectul sau verbul.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Un răspuns pozitiv
    gloss: Foarte bine, mulțumesc.
    note: Muy întărește pe bien și nu se schimbă.
  es.a1.unit01.lesson01.teach.and_usted:
    title: Întoarce întrebarea formală
    gloss: Dar dumneavoastră?
    note: Păstrează usted când întorci o întrebare formulată respectuos.
  es.a1.unit01.lesson01.teach.and_tu:
    title: Întoarce întrebarea informală
    gloss: Dar dumneavoastră?
    note: Folosește tú când schimbul este informal. Accentul scris contează, deoarece tu fără accent înseamnă „tău / ta”.
  es.a1.unit01.lesson02.teach.hola:
    title: Salut universal
    gloss: salut; bună
    note: Hola se potrivește în orice moment al zilei, atât în situații formale, cât și informale.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Salut de dimineață
    gloss: bună dimineața
    note: Substantivele spaniole au gen gramatical, ca și cele românești. Días este masculin plural, deci adjectivul apare ca buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Salut de după-amiază
    gloss: bună ziua (după-amiaza)
    note: Tardes este feminin plural, deci buenas se acordă cu el. Trecerea de la buenos la buenas este acord gramatical, nu o schimbare a gradului de politețe.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Salut de seară sau de noapte
    gloss: bună seara; noapte bună
    note: Noches este feminin plural și de aceea primește buenas. Expresia poate saluta pe cineva seara sau poate încheia o întâlnire înainte de culcare.
  es.a1.unit01.lesson02.teach.adios:
    title: Rămas-bun direct
    gloss: la revedere
    note: Adiós este neutru, dar poate suna mai definitiv decât o expresie de tipul „pe curând”.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: Pe curând
    gloss: ne vedem mai târziu
    note: Hasta luego este o formulă de rămas-bun convențională și nu trebuie citită cuvânt cu cuvânt.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Rămas-bun prietenos
    gloss: ne vedem
    note: Literal, nos vemos este mai aproape de „ne vedem unul pe altul”.
  es.a1.unit01.lesson02.teach.good_day:
    title: Urare politicoasă de încheiere
    gloss: Să aveți o zi bună.
    note: Tenga este forma de usted folosită în această urare politicoasă. Buen este forma scurtată de masculin singular a lui bueno înaintea cuvântului día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Întreabă formal numele cuiva
    gloss: Cum vă numiți?
    note: Spaniola o exprimă aproximativ ca „cum vă numiți / cum vă chemați”, cu verb reflexiv, ca în română. Se însoțește de forma de politețe llama, folosită cu usted.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Spune-ți numele
    gloss: Mă numesc Lucía.
    note: Me llamo înseamnă literal „mă numesc / mă cheamă”. Terminația verbului arată deja cine vorbește, așa că spaniola omite de obicei yo, ca româna care omite „eu”.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Întreabă informal numele cuiva
    gloss: Cum vă numiți?
    note: Te se folosește cu tú, iar llamas are terminația -as specifică persoanei a doua. Compară forma formală se llama cu cea informală te llamas.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Prezintă-te cu ser
    gloss: Sunt Diego.
    note: Soy este forma de persoana întâi singular a verbului ser. Spaniola folosește ser pentru identitate. Spre deosebire de română, care are un singur verb „a fi”, spaniola împarte utilizările între ser și estar.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Plăcere la cunoaștere
    gloss: Îmi pare bine.
    note: Mucho gusto este o expresie fixă, înțeleasă pretutindeni. Spre deosebire de adjective precum encantado sau encantada, nu se schimbă după genul vorbitorului.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Întoarce urarea
    gloss: Asemenea.
    note: Igualmente este un răspuns scurt la Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Prezintă un bărbat
    gloss: Acesta este Carlos.
    note: Ca în română (acesta / aceasta), demonstrativul are gen în spaniolă. Se folosește este când persoana sau substantivul indicat este masculin.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Prezintă o femeie
    gloss: Aceasta este Ana.
    note: Folosește esta pentru un referent feminin. Esta nu are accent aici; está, cu accent, este o formă a lui estar și înseamnă „este” sau „se află”.
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Întreabă formal de unde este cineva
    gloss: De unde sunteți?
    note: Es este forma de usted a verbului ser. Spaniola folosește ser, nu estar, pentru origine. Dónde are accent într-o întrebare directă.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Spune de unde ești
    gloss: Sunt din Mexic.
    note: Soy este forma de yo a verbului ser. Subiectul yo nu este necesar, deoarece soy arată deja cine vorbește.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Întreabă informal de unde este cineva
    gloss: De unde sunteți?
    note: Eres este forma de tú a verbului ser. Compară forma formală es (usted) cu cea informală eres, ca în română sunteți / ești.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Altă afirmație despre origine
    gloss: Sunt din Columbia.
    note: Folosește soy de urmat de un loc pentru a spune originea.
  es.a1.unit01.lesson04.teach.live_london:
    title: Spune unde locuiești
    gloss: Locuiesc la Londra.
    note: Vivo este forma de yo a verbului vivir. Spaniola nu are nevoie de yo, deoarece terminația -o arată cine vorbește, la fel ca în română.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Întreabă formal despre spaniolă
    gloss: Vorbiți spaniolă?
    note: Spaniola formează această întrebare cu răspuns da/nu fără cuvânt auxiliar, ca româna. Habla este forma de usted; intonația și semnele de întrebare marchează întrebarea.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Capacitate limitată
    gloss: Da, puțin.
    note: Sí cu accent înseamnă „da”. Si fără accent înseamnă „dacă”, deși scrierea fără accent este acceptată aici ca variantă tolerată la A1.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Descrie o situație în desfășurare
    gloss: Încă învăț.
    note: Estoy este forma de yo a verbului estar. Aici estar exprimă o activitate în desfășurare, în timp ce soy din Soy de Colombia exprimă originea sau identitatea. Româna folosește „a fi” în ambele situații, dar spaniola alege între ser și estar.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Întreabă formal despre o primă vizită
    gloss: Este prima dată când sunteți aici?
    note: Su înseamnă „dumneavoastră / al dumneavoastră” când te adresezi cuiva cu usted. Ca în română (tău / dumneavoastră), su față de tu păstrează alegerea formală sau informală.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Întreabă informal despre o primă vizită
    gloss: Este prima dată când sunteți aici?
    note: Tu fără accent este posesivul informal „tău / ta”. Compară-l cu pronumele tú, care poartă accent.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Confirmă că este prima ta vizită
    gloss: Da, este prima mea dată.
    note: Primera este feminin deoarece se acordă cu vez. Ca în română, adjectivul se acordă în gen cu substantivul.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Spune unde mergi
    gloss: Am venit la atelierul de gătit.
    note: Vengo este forma de yo a verbului venir, adică „vin” sau „am venit”. Al este contragerea obligatorie a lui a + el.
  es.a1.unit01.lesson05.teach.me_too:
    title: Împărtășește aceeași situație
    gloss: Și eu.
    note: Yo también este util când afirmația celeilalte persoane se potrivește și în cazul tău.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Întreabă despre un interes
    gloss: Îți place să gătești?
    note: 'Gustar funcționează ca „a plăcea” în română: persoana care simte plăcerea apare ca pronume în dativ. Te marchează această persoană, iar cocinar este ceea ce place. Verbul rămâne gusta deoarece activitatea este tratată ca singular.'
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Exprimă un interes puternic
    gloss: Da, foarte mult.
    note: Mucho răspunde la întrebarea despre grad și nu își schimbă forma aici.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Reacție pozitivă
    gloss: Ce bine!
    note: În această exclamație, Qué are accent. Exprimă o reacție pozitivă, nu pune o întrebare.
  es.a1.unit01.lesson06.teach.line01:
    title: Începutul întâlnirii
    gloss: Elena îl salută pe Mateo și îl întreabă dacă e prima lui dată aici.
    note: Amândoi folosesc formele informale cu tú, pentru că se întâlnesc ca egali, la aceeași activitate.
  es.a1.unit01.lesson06.teach.line02:
    title: Începutul întâlnirii, răspuns
    gloss: Mateo spune că da, e prima lui dată și explică că a venit la atelierul de gătit.
    note: Vengo al taller arată motivul pentru care e acolo, folosind prezentul pentru o situație în desfășurare.
  es.a1.unit01.lesson06.teach.line03:
    title: Schimb de nume
    gloss: Elena spune că și pentru ea e prima dată, își spune numele și îl întreabă pe al lui Mateo.
    note: Me llamo este o formulă naturală pentru a-ți spune numele. Ca și în română, pronumele yo se omite de obicei, pentru că forma verbului arată deja cine vorbește.
  es.a1.unit01.lesson06.teach.line04:
    title: Schimb de nume, răspuns
    gloss: Mateo își spune numele și zice că îi pare bine de cunoștință.
    note: Soy este o altă formulă naturală pentru a-ți spune numele, cu verbul ser în loc de verbul reflexiv llamarse.
  es.a1.unit01.lesson06.teach.line05:
    title: Întrebare despre origine
    gloss: Elena răspunde la politețe (Likewise, adică „și mie”) și îl întreabă de unde este Mateo.
    note: De dónde eres întreabă despre origine, folosind forma informală cu tú.
  es.a1.unit01.lesson06.teach.line06:
    title: Întrebare despre origine, răspuns
    gloss: Mateo e din Columbia, dar locuiește la Londra, apoi îi pune Elenei aceeași întrebare.
    note: Soy de exprimă originea, iar vivo en exprimă locuința actuală. Pero leagă contrastul dintre cele două informații.
  es.a1.unit01.lesson06.teach.line07:
    title: Discuție despre un interes
    gloss: Elena spune că e din Spania și îl întreabă pe Mateo dacă îi place să gătească.
    note: Soy arată originea, același tipar pe care tocmai l-a folosit Mateo.
  es.a1.unit01.lesson06.teach.line08:
    title: Discuție despre un interes, răspuns
    gloss: Mateo spune că îi place mult să gătească, dar că încă învață.
    note: Estoy aprendiendo arată o acțiune aflată în desfășurare chiar acum. Româna folosește de obicei prezentul simplu (învăț), iar spaniola preferă estar + gerunziu.
  es.a1.unit01.lesson06.teach.line09:
    title: Încheierea conversației
    gloss: Elena spune că și ea învață și că ne vedem înăuntru.
    note: Nos vemos anunță o întâlnire așteptată mai târziu, iar dentro precizează unde.
  es.a1.unit01.lesson06.teach.line10:
    title: Încheierea conversației, răspuns
    gloss: Mateo e de acord și confirmă că se vor vedea.
    note: Sí confirmă pur și simplu propunerea Elenei, înainte de a repeta nos vemos.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: Care formă de adresare este respectuoasă sau formală?
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted este forma respectuoasă de singular și cere verbul la persoana a treia.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: Care formă i se adresează informal unui prieten sau unui egal?
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: Pronumele se scrie tú; tu fără accent înseamnă „al tău”.
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: Ascultă și alege propoziția pe care o auzi.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: Scrie întrebarea informală pe care o auzi.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: Pune în ordine întrebarea formală.
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: Alege întrebarea de întoarcere care păstrează registrul respectuos.
    correct_option: ¿Y usted?
    distractors:
    - ¿Y tú?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: Alege întrebarea de întoarcere potrivită pentru un prieten sau un egal.
    correct_option: ¿Y tú?
    distractors:
    - ¿Y usted?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: Corectează întrebarea informală.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: Tú cere forma estás; está se folosește cu usted.
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: Răspunde politicos la întrebare.
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Răspunde informal, mulțumește și întoarce întrebarea.
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
    - Bien, gracias. Y tu?
    - Bien, gracias, ¿y tú?
  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: Ascultă și alege salutul.
    correct_option: Hola
    distractors:
    - Adiós
    - Hasta luego
    accepted_answers:
    - Hola
  es.a1.unit01.lesson02.exercise02.listen_morning:
    instruction: Scrie salutul de dimineață pe care îl auzi.
    accepted_answers:
    - Buenos días
    - Buenos dias
  es.a1.unit01.lesson02.exercise03.order_afternoon:
    instruction: Pune în ordine salutul de după-amiază.
    correct_response:
    - Buenas
    - tardes
  es.a1.unit01.lesson02.exercise04.select_night:
    instruction: Ce înseamnă această expresie ca salut de seară?
    correct_option: Bună seara.
    distractors:
    - Bună dimineața.
    - Ne vedem mai târziu.
    accepted_answers:
    - Bună seara.
  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: Ascultă și alege expresia pe care o auzi.
    correct_option: Buenas noches
    distractors:
    - Buenos días
    - Buenas tardes
    accepted_answers:
    - Buenas noches
  es.a1.unit01.lesson02.exercise06.choose_farewell:
    instruction: Ce rol are acest cuvânt?
    correct_option: Spune la revedere.
    distractors:
    - Întreabă un nume.
    - Spune mulțumesc.
    accepted_answers:
    - Spune la revedere.
  es.a1.unit01.lesson02.exercise07.listen_until_later:
    instruction: Pune în ordine formula de rămas-bun pe care o auzi.
    correct_response:
    - Hasta
    - luego
  es.a1.unit01.lesson02.exercise08.reply_to_afternoon:
    instruction: Răspunde la salut, apoi încheie scurta conversație.
    accepted_answers:
    - Buenas tardes. Hasta luego.
    - Buenas tardes, hasta luego.
    - Buenas tardes. Adiós.
    - Buenas tardes. Nos vemos.
    - Buenas tardes. Que tenga un buen día.
  es.a1.unit01.lesson02.exercise09.order_good_day:
    instruction: Construiește urarea politicoasă de încheiere.
    correct_response:
    - Que
    - tenga
    - un
    - buen
    - día
  es.a1.unit01.lesson02.exercise10.speak_friendly_closing:
    instruction: Spune prietenos un „ne vedem”.
    accepted_answers:
    - Nos vemos.
    - Nos vemos
  es.a1.unit01.lesson03.exercise01.listen_formal_name:
    instruction: Ascultă și alege ce întreabă vorbitorul.
    correct_option: Vorbitorul întreabă politicos cum îl cheamă pe cineva.
    distractors:
    - Vorbitorul întreabă unde locuiește cineva.
    - Vorbitorul întreabă informal cum se simte cineva.
    accepted_answers:
    - Vorbitorul întreabă politicos cum îl cheamă pe cineva.
  es.a1.unit01.lesson03.exercise02.order_name_answer:
    instruction: Construiește fraza prin care Lucía își spune numele.
    correct_response:
    - Me
    - llamo
