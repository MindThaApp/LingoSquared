  es.a1.unit04.lesson01.dias_de_la_semana:
    title: Zilele săptămânii
  es.a1.unit04.lesson02.los_meses_del_ano:
    title: Lunile anului
  es.a1.unit04.lesson03.preguntar_y_decir_la_fecha:
    title: Cum întrebi și spui data
  es.a1.unit04.lesson04.el_cumpleanos:
    title: Zilele de naștere ale Elenei și ale lui Mateo
  es.a1.unit04.lesson05.leer_el_horario_del_taller:
    title: Citim programul atelierului
  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: Elena și Mateo planifică următoarea oră
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Luni-vineri
    gloss: luni, marți, miercuri, joi, vineri
    note: Numele zilelor săptămânii se scriu cu literă mică în spaniolă, la fel ca în română, cu excepția începutului de propoziție.
    example_gloss:
    - Atelierul de gătit are loc marțea.
    - Joia învăț spaniola.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Sâmbătă, duminică
    gloss: Sâmbătă, duminică
    note: '*Sábado* și *domingo* sunt singurele două zile care primesc -s la plural (*los sábados*, *los domingos*); celelalte zile au aceeași formă la singular și la plural.'
    example_gloss:
    - Sâmbăta merg la piață.
    - Duminica mă odihnesc.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Astăzi este vineri
    gloss: Astăzi este vineri.
    note: '*Hoy* (astăzi) + *es* (este) + numele zilei indică direct ziua de azi, fără articol.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: Atelierul are loc marțea
    gloss: Atelierul de gătit are loc marțea.
    note: '*Los martes* (cu articolul plural *los*) înseamnă „marțea”, adică în mod repetat, nu doar într-o anumită marți.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Ianuarie-iunie
    gloss: ianuarie, februarie, martie, aprilie, mai, iunie
    note: Ca și zilele săptămânii, numele lunilor se scriu în spaniolă cu literă mică, la fel ca în română, cu excepția începutului de propoziție.
    example_gloss:
    - Ziua mea de naștere este în martie.
    - În iunie este cald.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Iulie-decembrie
    gloss: iulie, august, septembrie, octombrie, noiembrie, decembrie
    note: '*Septiembre* seamănă mult cu românescul „septembrie”: multe nume de luni sunt asemănătoare în spaniolă și în română.'
    example_gloss:
    - Atelierul de gătit începe în iulie.
    - În decembrie îmi vizitez familia.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Ziua mea este în martie
    gloss: Ziua mea de naștere este în martie.
    note: '*En* (în) se folosește doar cu numele lunii, fără o zi anume.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Întreabă data de azi
    gloss: Ce dată este astăzi?
    note: '*Qué fecha* (ce dată) este modul obișnuit de a întreba data calendaristică, diferit de *qué hora* (cât este ceasul), pe care îl vei învăța într-o unitate viitoare.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Spune data
    gloss: Astăzi este 22 iulie.
    note: '*El veintidós de julio* se citește literal „douăzeci și doi de iulie”: în spaniolă se folosește un numeral cardinal simplu, la fel ca în română, nu un ordinal.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: Formatul datei în spaniolă
    gloss: Cum se spune data calendaristică în spaniolă.
    note: Numeral cardinal + de + lună. Pentru prima zi a lunii, *el primero* este frecvent (mai ales în America Latină), iar *el uno* se folosește și el, mai ales în Spania.
    target_text: 'Data se exprimă în spaniolă cu numeral cardinal + de + lună, la fel ca în română: el veintidós de julio înseamnă literal „douăzeci și doi iulie”. Pentru prima zi a lunii, în spaniolă nu se folosește „întâi” ca în română, ci mulți vorbitori (mai ales în America Latină) spun *el primero*; *el uno* este și el frecvent, mai ales în Spania.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Întreabă când are loc atelierul
    gloss: Când este atelierul?
    note: '*Cuándo* (când) întreabă în general despre moment; *qué fecha* (cealaltă întrebare din această lecție) cere în mod special o dată calendaristică. Ambele sunt naturale aici.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Spune data atelierului
    gloss: Atelierul este pe 22 iulie.
    note: Reia același tipar al datei din *hoy es el veintidós de julio*, doar cu alt subiect (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Întreabă despre ziua de naștere a cuiva
    gloss: Când este ziua ta?
    note: '*Tu cumpleaños* (ziua ta de naștere, informal) folosește registrul *tú*, potrivit pentru prieteni.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Spune când e ziua ta de naștere
    gloss: Ziua mea de naștere este pe 10 martie.
    note: Spre deosebire de *en marzo* (în martie, doar luna), o dată completă de naștere folosește *el* plus numărul zilei, același tipar ca în *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Spune ziua de naștere a unei a treia persoane
    gloss: Ziua lui Mateo este pe 22 august.
    note: '*El cumpleaños de Mateo* (ziua lui Mateo) folosește *de* pentru posesie, aceeași construcție ca în *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: La mulți ani!
    gloss: Felicitări! / La mulți ani!
    note: '*¡Felicidades!* este cuvântul general pentru felicitări, folosit des la zile de naștere, dar și pentru alte vești bune.'
    example_gloss: Felicitări, Elena! Astăzi este ziua ta.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Citim programul atelierului
    gloss: Atelierul de gătit este marțea. Următoarea oră este pe 22 iulie. După aceea, mai este o oră pe 29 iulie. Atelierul se termină pe 12 august.
    note: Acest program scurt folosește, într-un singur text, numele zilelor săptămânii și tiparul datei pe care le-ai învățat.
    glosses:
      taller: atelier
      cocina: de gătit
      martes: marțea
      próxima: următoarea
      clase: oră de curs
      veintidós: douăzeci și doi
      julio: Iulie
      Después: după aceea
      hay: există, este (de la haber)
      veintinueve: douăzeci și nouă
      termina: se termină (de la terminar)
      doce: doisprezece
      agosto: august
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: Următoarea oră
    gloss: următoarea oră
    note: '*Próxima* (următoarea) se acordă cu substantivul feminin *clase*; forma masculină ar fi *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (după)
    gloss: Cum leagă *después* evenimentele în succesiune.
    note: '*Después* = după, după aceea.'
    target_text: '*Después* (după, apoi) leagă două evenimente în succesiune: mai întâi unul, apoi celălalt.'
  es.a1.unit04.lesson06.teach.line01:
    title: Întreabă despre următoarea oră
    gloss: Mateo o întreabă pe Elena când este următoarea oră a atelierului.
    note: '*La próxima clase del taller* = următoarea oră a atelierului.'
  es.a1.unit04.lesson06.teach.line02:
    title: Spune data
    gloss: Elena confirmă că este 22 iulie, într-o marți.
    note: Elena adaugă *un martes* (într-o marți) după dată, confirmând că ora are loc în ziua obișnuită a atelierului, marțea.
  es.a1.unit04.lesson06.teach.line03:
    title: Întreabă când se termină atelierul
    gloss: Mateo întreabă când se termină atelierul.
    note: '*Perfecto* (perfect) este o reacție scurtă și naturală înainte de a pune o altă întrebare.'
  es.a1.unit04.lesson06.teach.line04:
    title: Spune data de încheiere
    gloss: Elena spune că se termină pe 12 august.
    note: Aceeași dată de încheiere ca în programul tipărit.
  es.a1.unit04.lesson06.teach.line05:
    title: Întreabă despre ziua de naștere, în mijlocul conversației
    gloss: Mateo spune „apropo” și o întreabă când este ziua Elenei.
    note: '*Por cierto* (apropo) introduce în mod natural o schimbare de subiect în timpul unei conversații.'
  es.a1.unit04.lesson06.teach.line06:
    title: Spune data și întoarce întrebarea
    gloss: Elena spune 10 martie, apoi întreabă „și a ta?”
    note: '*¿Y el tuyo?* (și a ta?) folosește pronumele posesiv *tuyo*, o formă scurtă nouă pentru a întoarce o întrebare despre ceva deja numit (*cumpleaños* este masculin, deci *tuyo*, nu *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: Spune ziua lui Mateo
    gloss: Mateo spune 22 august.
    note: Un răspuns scurt și complet, care reia tiparul datei fără a repeta „mi cumpleaños es”, firesc într-un schimb rapid vorbit.
  es.a1.unit04.lesson06.teach.line08:
    title: Reacționează și observă momentul
    gloss: Elena reacționează cu bucurie, observând că ziua lui cade după încheierea atelierului.
    note: '*Es después del taller* (este după atelier): 22 august vine după încheierea atelierului, pe 12 august.'
