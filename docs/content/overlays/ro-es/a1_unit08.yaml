teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Banca, farmacia
    gloss: bancă, farmacie
    note: '*Banco* este masculin; *farmacia* este feminin.'
    example_gloss:
    - Merg la bancă.
    - Farmacia se deschide la nouă.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Parcul, restaurantul
    gloss: parc, restaurant
    note: Ambele substantive sunt masculine.
    example_gloss:
    - Parcul este foarte frumos.
    - Mâncăm la restaurant.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Biblioteca
    gloss: bibliotecă
    note: '*Biblioteca* este feminin.'
    example_gloss: Învăț la bibliotecă.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: Aproape
    gloss: Restaurantul este aproape de piață.
    note: '*Cerca de* (aproape de) cere întotdeauna *de* înaintea locului de referință.'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Departe de
    gloss: Parcul este departe de piață.
    note: '*Lejos de* (departe de) este opusul lui *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: Lângă
    gloss: Banca este lângă piață.
    note: '*Al lado de* (lângă) este o expresie fixă (*al* = *a* + *el lado*). Înaintea unui substantiv masculin ca *mercado*, *de* + *el* se contrage în *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: Vizavi de
    gloss: Farmacia este în fața pieței.
    note: '*Enfrente de* (vizavi de) descrie două locuri aflate de părți opuse ale unui spațiu, de exemplu ale unei străzi.'
  es.a1.unit08.lesson02.teach.entre:
    title: Între
    gloss: Biblioteca este între bancă și parc.
    note: '*Entre* (între) cere două puncte de reper, legate aici prin *y* (și).'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Întreabă unde este banca
    gloss: Unde este banca?
    note: '*Dónde está* (unde este) este structura obișnuită pentru a întreba unde se află un loc.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Răspunde indicând locul
    gloss: Este lângă piață.
    note: '*Del* este forma contrasă din *de* + *el*, obligatorie înainte de substantivul masculin *mercado*.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Întreabă unde este farmacia
    gloss: Unde este farmacia?
    note: 'Aceeași structură de întrebare, folosită cu un substantiv feminin: întrebarea nu se schimbă în funcție de gen.'
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Răspuns: vizavi de'
    gloss: Este vizavi de piață.
    note: '*Enfrente de* + *el mercado* devine *enfrente del mercado*, aceeași contragere *del* ca în *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Întreabă dacă este departe
    gloss: Este departe?
    note: O întrebare scurtă de continuare, în care subiectul se omite pentru că reiese din context.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Răspuns: nu, este aproape'
    gloss: Nu, este aproape.
    note: '*Cerca* singur (fără *de*) funcționează ca răspuns scurt, spre deosebire de expresia completă *cerca de*, folosită cu un loc numit.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Răspuns: da, destul de departe'
    gloss: Da, este destul de departe.
    note: '*Bastante* (destul de) intensifică pe *lejos* fără să fie la fel de puternic ca *muy* (foarte).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Citim despre cartier
    gloss: În cartierul acesta sunt multe locuri utile. Banca este lângă piață. Farmacia este vizavi de piață. Parcul este departe, dar biblioteca este între bancă și parc. Restaurantul este foarte aproape de piață.
    note: Acest text scurt reunește expresiile de localizare din lecție într-o singură descriere a cartierului.
    glosses:
      barrio: cartier
      hay: există, sunt (de la haber)
      muchos: mulți, multe
      lugares: locuri
      útiles: utile
      banco: bancă (instituție)
      está: se află, este (de la estar)
      lado: parte, latură
      mercado: piață
      farmacia: farmacie
      enfrente: în față / vizavi de
      parque: parc
      lejos: departe
      biblioteca: bibliotecă
      entre: între
      restaurante: restaurant
      cerca: aproape
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (există, sunt)
    gloss: De ce hay nu se schimbă la singular sau plural.
    note: 'Hay (există, sunt) nu se schimbă la singular sau la plural: hay un banco și hay muchos lugares folosesc același cuvânt.'
    target_text: '*Hay* (există / sunt) nu se schimbă la singular sau la plural: *hay un banco* și *hay muchos lugares* folosesc același cuvânt.'
  es.a1.unit08.lesson06.teach.line01:
    title: Întreabă unde este banca
    gloss: Mateo o întreabă pe Elena unde este banca.
    note: Aceeași întrebare *¿Dónde está...?* de mai devreme, începută cu numele Elenei pentru a-i atrage atenția.
  es.a1.unit08.lesson06.teach.line02:
    title: Răspunde și face referire la piață
    gloss: Elena spune că este lângă piață, unde au cumpărat ouăle.
    note: '*Donde compramos los huevos* (unde am cumpărat ouăle) face referire la excursia lor de cumpărături din Unitatea 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Întreabă despre farmacie
    gloss: Mateo confirmă că a înțeles și întreabă despre farmacie.
    note: '*Ah, sí* (a, da) este un mod firesc de a confirma pe scurt înainte de următoarea întrebare.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Răspuns: vizavi de'
    gloss: Elena spune că este vizavi de piață.
    note: 'Un răspuns scurt: subiectul (*la farmacia*) se omite pentru că reiese din întrebare.'
  es.a1.unit08.lesson06.teach.line05:
    title: Întreabă despre parc
    gloss: Mateo întreabă despre parc și dacă este aproape.
    note: Combină două întrebări într-o singură replică, lucru firesc într-o conversație informală.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Răspuns: departe, apoi menționează biblioteca'
    gloss: Elena spune că parcul este departe, dar că biblioteca este între bancă și parc.
    note: '*Pero* (dar) opune distanța parcului poziției mai comode a bibliotecii.'
  es.a1.unit08.lesson06.teach.line07:
    title: Mulțumește și întreabă despre restaurant
    gloss: Mateo îi mulțumește Elenei și întreabă despre restaurantul unde au mâncat.
    note: '*El restaurante donde comimos* (restaurantul unde am mâncat) face referire la masa lor de prânz din Unitatea 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Confirmă că este foarte aproape
    gloss: Elena confirmă că este foarte aproape de piață.
    note: '*Muy cerca* (foarte aproape): *muy* (foarte) este mai puternic decât *bastante* (destul de), ca în *bastante lejos* (destul de departe).'
