teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: A se ridica din pat
    gloss: a se ridica din pat → mă ridic din pat
    note: '*Levantarse* este reflexiv: pronumele *me* stă înaintea verbului, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: A se îmbrăca
    gloss: a se îmbrăca → mă îmbrac
    note: '*Vestirse* este tot reflexiv: *Me visto*. Aici *me* înseamnă „pe mine”.'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: A lua micul dejun
    gloss: a lua micul dejun → iau micul dejun
    note: '*Desayunar* nu este reflexiv: *Desayuno*, fără *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Munca
    gloss: a lucra → lucrez
    note: '*Trabajar* este un verb regulat în -ar: forma *yo* se termină în -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: A mânca
    gloss: a mânca → mănânc
    note: '*Comer* este un verb regulat în -er: forma *yo* se termină în -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: A spăla vasele
    gloss: a spăla vasele → spăl vasele
    note: '*Lavar los platos* nu este reflexiv: *Lavo los platos*. Complementul *los platos* rămâne după verb.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: A dormi
    gloss: a dormi → dorm
    note: '*Dormir* schimbă vocala din rădăcină la forma *yo*: *duermo* (o devine ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: Modelul reflexiv
    gloss: 'La levantarse și vestirse, pronumele stă înaintea verbului: levantarse → Me levanto.'
    note: 'La verbele reflexive, pune *me* înaintea verbului conjugat: spune *Me levanto*, nu *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse într-o propoziție
    gloss: 'a se ridica din pat: Mă ridic din pat la șapte.'
    note: 'Indicația de timp vine după verb: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse într-o propoziție
    gloss: 'a se îmbrăca: Mă îmbrac.'
    note: 'Modelul este *me* + *visto*: pronumele rămâne chiar înaintea verbului.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos într-o propoziție
    gloss: 'a spăla vasele: Spăl vasele după ce mănânc.'
    note: '*Después de comer* („după masă”, adică „după ce mănânc”) folosește *de* plus un infinitiv și poate sta la sfârșit.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Verbe fără me
    gloss: 'Fără pronume: Iau micul dejun. Lucrez. Dorm. Aceste verbe nu sunt reflexive.'
    note: '*Desayuno*, *trabajo* și *duermo* nu au *me*: aceste verbe nu sunt reflexive.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Mă ridic din pat la șapte și jumătate
    gloss: Mă ridic din pat la 7:30.
    note: 'Ca și în română („și jumătate”), spaniola spune *y media*: *las siete y media* înseamnă 07:30. Folosește *a las* înaintea orei.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Mă îmbrac la opt fără un sfert
    gloss: Mă îmbrac la 7:45.
    note: '*Las ocho menos cuarto* se numără înapoi de la ora următoare: 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Iau micul dejun la opt
    gloss: Iau micul dejun la ora opt.
    note: 'Folosește *a las* înaintea orei: *a las ocho*. Pentru ora unu se spune *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Lucrez de la nouă la cinci
    gloss: Lucrez de la ora nouă până la ora cinci.
    note: '*De ... a ...* indică ora de început și ora de sfârșit: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Mănânc la șase și jumătate
    gloss: Mănânc la 18:30.
    note: '*De la tarde* precizează că e seara, deci *las seis y media* înseamnă aici 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Dorm la unsprezece
    gloss: Dorm la ora unsprezece.
    note: 'Folosește *a las* înaintea orei: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: Mai întâi, apoi, după aceea
    gloss: mai întâi, apoi, după aceea
    note: '*Primero* marchează prima activitate, *luego* pe următoarea, iar *después* ce urmează.'
    example_gloss:
    - Mai întâi mă ridic din pat.
    - Apoi mă îmbrac.
    - După aceea iau micul dejun.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: O dimineață în trei pași
    gloss: Mai întâi mă ridic din pat. Apoi mă îmbrac. După aceea iau micul dejun.
    note: 'Verbele reflexive păstrează *me* înaintea verbului: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Cuvinte de ordine
    gloss: 'Primero, luego și después ordonează ce faci; verbul nu se schimbă: Después desayuno.'
    note: 'Cuvintele de ordine încep propoziția, iar forma verbului nu se schimbă: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: Ziua mea
    gloss: Ziua mea — Mă ridic din pat la 7:30. După aceea mă îmbrac, iar la opt iau micul dejun. Lucrez de la nouă la cinci. La 18:30 mănânc. După aceea spăl vasele. La unsprezece dorm.
    note: Citește urmărind atât ordinea activităților, cât și orele lor. Observă *me levanto* și *me visto* cu *me*.
    glosses:
      Mi: meu
      día: zi
      levanto: a se ridica din pat (me levanto)
      media: și jumătate (y media = și jumătate)
      ocho: opt
      Después: după aceea
      visto: a se îmbrăca (me visto)
      las: articol înaintea orelor (las ocho)
      desayuno: a lua micul dejun
      Trabajo: a lucra
      nueve: nouă
      cinco: cinci
      siete: șapte
      tarde: seara
      como: a mânca
      lavo: a spăla vasele (lavo los platos)
      once: unsprezece
      duermo: a dormi
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Întrebări despre o zi
    gloss: 'Elena: Cum arată ziua ta, Mateo?'
    note: '*¿Cómo es tu día?* este o formă informală de a cere cuiva să-și descrie ziua; *tu* este „al tău” informal.'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: Dimineața lui Mateo
    gloss: 'Mateo: Mă ridic din pat la 7:30. După aceea mă îmbrac, iar la opt iau micul dejun.'
    note: Mateo leagă trei activități de dimineață cu *después* și *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: Ziua de lucru a lui Mateo
    gloss: 'Elena: Când lucrezi? Mateo: Lucrez de la nouă la cinci.'
    note: 'Elena și Mateo folosesc între ei formele informale de *tú*: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: Seara lui Mateo
    gloss: 'Mateo: La 18:30 mănânc. După aceea spăl vasele. La unsprezece dorm.'
    note: '*Después* începe propoziția, dar forma verbului rămâne aceeași: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: Dimineața Elenei
    gloss: 'Elena: Mă ridic din pat la șase, dar nu iau micul dejun decât la 6:30.'
    note: '*No ... hasta* înseamnă „nu până când”, „abia la”. Elena compară ora trezirii cu ora micului dejun.'
