teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Mai...decât
    gloss: mai...decât
    note: '*Más...que* compară două cantități sau lucruri diferite -- vezi nota de gramatică de mai jos.'
    example_gloss: Apartamentul nou este mai mare decât cel vechi.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Mai puțin...decât
    gloss: mai puțin...decât
    note: '*Menos...que*, opusul lui *más...que*.'
    example_gloss: Apartamentul vechi este mai puțin mare decât cel nou.
  es.a1.unit15.lesson01.teach.tan_como:
    title: La fel de...ca
    gloss: la fel de...ca
    note: '*Tan...como* compară două lucruri EGALE – o construcție cu totul diferită de *más/menos*, nu doar o altă variantă pentru același lucru.'
    example_gloss: Mateo gătește la fel de bine ca Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Inegalitate și egalitate
    gloss: Diferența dintre más/menos...que și tan...como.
    note: Vezi textul cardului.
    target_text: '*Más...que* (mai...decât) și *menos...que* (mai puțin...decât) compară două lucruri sau cantități DIFERITE. *Tan...como* (la fel de...ca) compară două lucruri EGALE -- o construcție diferită, nu doar un sinonim al lui *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Compară apartamentul nou
    gloss: Apartamentul nou este mai mare decât cel vechi.
    note: '*Más grande que* (mai mare decât) pune *grande* (mare) în structura *más...que*.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Compară apartamentul vechi
    gloss: Apartamentul vechi este mai mic decât cel nou.
    note: '*Más pequeño que* (mai mic decât) folosește *pequeño* (mic) și exprimă comparația din sens opus.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Întreabă care este mai mare
    gloss: Care apartament este mai mare?
    note: '*¿Cuál...?* (care...?) + adjectiv la comparativ este modul obișnuit de a cere o comparație.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Răspunde care este mai mare
    gloss: Cel nou este mai mare decât cel vechi.
    note: Aceeași comparație, acum ca răspuns direct la întrebarea *¿cuál...?*; *el nuevo* (cel nou) evită repetarea substantivului.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Compară egal priceperea la gătit
    gloss: Mateo gătește la fel de bine ca Elena.
    note: '*Tan bien como* (la fel de bine ca) folosește *tan* + adverb + *como*, structura egalității aplicată modului în care se face o acțiune, nu mărimii unui substantiv.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Spune că sunteți o echipă bună
    gloss: Suntem o echipă bună.
    note: '*Somos* (suntem) + *un buen equipo* (o echipă bună) este o concluzie firească după o comparație de egalitate.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: Compararea celor două apartamente
    gloss: Apartamentul vechi al lui Mateo are o bucătărie mică. Apartamentul nou este mai mare, iar bucătăria este și ea mai mare. Cel vechi este mai mic decât cel nou, de aceea Mateo vrea să se mute. Cel nou are mai mult spațiu pentru gătit.
    note: Un rezumat realist care compară cele două apartamente.
    glosses:
      viejo: vechi
      tiene: are (de la tener)
      pequeña: mic
      nuevo: noi
      grande: mare
      también: de asemenea / și
      pequeño: mic
      eso: care / că
      quiere: vrea (de la querer)
      mudarse: a se muta
      espacio: spațiu
      cocinar: a găti
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (de aceea)
    gloss: Cum leagă por eso o cauză de o consecință.
    note: Vezi textul cardului.
    target_text: '*Por eso* (de aceea) leagă un motiv de rezultatul lui -- bucătăria mică este motivul pentru care Mateo vrea să se mute, aceeași logică cauză-efect pe care ai întâlnit-o deja la *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: Întreabă dacă l-a văzut
    gloss: Elena îl întreabă pe Mateo dacă a văzut deja apartamentul nou.
    note: '*¿Ya viste...?* (ai văzut deja...?) este o formă nouă de întrebare la trecut.'
  es.a1.unit15.lesson06.teach.line02:
    title: Confirmă că este mai mare
    gloss: Mateo confirmă că este mai mare decât cel vechi, inclusiv bucătăria.
    note: O comparație cu *más...que*, extinsă cu *la cocina también* (și bucătăria).
  es.a1.unit15.lesson06.teach.line03:
    title: Întreabă care este mai mic
    gloss: Elena întreabă, deci, care apartament este mai mic.
    note: '*Entonces* (atunci / deci) este un conector logic pe care l-ai mai văzut; întrebarea folosește structura *¿Cuál...?* cu *pequeño* în loc de *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Răspunde și explică
    gloss: Mateo spune că cel vechi este mai mic și de aceea vrea să se mute.
    note: '*El viejo es más pequeño que el nuevo* plus *por eso quiero mudarme* (de aceea vreau să mă mut).'
  es.a1.unit15.lesson06.teach.line05:
    title: Spune că are sens
    gloss: 'Elena spune că are sens: cel nou are mai mult spațiu pentru gătit.'
    note: '*Tiene mucho sentido* (are mult sens) este o expresie nouă de acord; *más espacio para cocinar* înseamnă mai mult spațiu pentru gătit.'
  es.a1.unit15.lesson06.teach.line06:
    title: Continuă raționamentul
    gloss: Mateo este de acord și adaugă că, fiindcă Elena gătește la fel de bine ca el, au nevoie de spațiu pentru amândoi.
    note: '*Tan bien como* (la fel de bine ca), folosit acum în conversație cu *tú cocinas* (tu gătești).'
  es.a1.unit15.lesson06.teach.line07:
    title: Întoarce complimentul
    gloss: Elena este încântată de acord și spune că el gătește la fel de bine ca ea.
    note: '*¡Es verdad!* (e adevărat!) + *tú cocinas tan bien como yo* (tu gătești la fel de bine ca mine) – aceeași comparație cu *tan bien como*, întoarsă spre Mateo.'
  es.a1.unit15.lesson06.teach.line08:
    title: Încheie cu spirit de echipă
    gloss: Mateo concluzionează că sunt o echipă bună.
    note: '*Somos un buen equipo* (suntem o echipă bună) încheie dialogul.'
