teaching:
  es.a1.unit14.lesson01.teach.el_apartamento:
    title: Apartamentul
    gloss: apartamentul
    note: '*Apartamento* este de genul masculin.'
    example_gloss: Locuiesc într-un apartament mic.
  es.a1.unit14.lesson01.teach.la_cocina:
    title: Bucătăria
    gloss: bucătăria
    note: Vezi nota de gramatică de mai jos despre celălalt sens al acestui cuvânt, „gătit”.
    example_gloss: Bucătăria mea este foarte mică.
  es.a1.unit14.lesson01.teach.el_dormitorio:
    title: Dormitorul
    gloss: dormitorul
    note: '*Dormitorio* este de genul masculin și vine de la *dormir* (a dormi).'
    example_gloss: Dormitorul are un pat mare.
  es.a1.unit14.lesson01.teach.el_bano:
    title: Baia
    gloss: baia
    note: '*Baño* este de genul masculin.'
    example_gloss: Apartamentul are o baie.
  es.a1.unit14.lesson01.teach.la_sala:
    title: Sufrageria
    gloss: sufrageria
    note: '*Sala* este de genul feminin.'
    example_gloss: Ne uităm la televizor în sufragerie.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: încăperea sau gătitul'
    gloss: Diferența dintre la cocina (bucătăria) și cocinar (a găti).
    note: Vezi textul cardului.
    target_text: '*La cocina* înseamnă aici „bucătăria” (o încăpere), un sens diferit de *cocina*/*cocinar* (gătit/a găti), folosit în toată povestea pentru atelierul în sine. Contextul le deosebește: în *taller de cocina* înseamnă gătit; *la cocina* dintr-o casă sau dintr-un apartament este încăperea; *cocinar* este verbul „a găti”.'
  es.a1.unit14.lesson02.teach.alquilar:
    title: A închiria
    gloss: a închiria
    note: Verbul la infinitiv, folosit în *quiero alquilar* (vreau să închiriez).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: Clădirea
    gloss: clădirea
    note: '*Edificio* este de genul masculin.'
    example_gloss: Clădirea este aproape de parc.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Liber / neocupat
    gloss: liber / disponibil
    note: '*Desocupado* descrie o locuință de închiriat care este goală și disponibilă în prezent.'
  es.a1.unit14.lesson02.teach.grande:
    title: Mare
    gloss: mare
    note: '*Grande* nu își schimbă forma după gen (spre deosebire de adjectivele în -o/-a).'
  es.a1.unit14.lesson02.teach.pequeno:
    title: Mic
    gloss: mic
    note: '*Pequeño/pequeña*, opusul lui *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Întreabă câte dormitoare are
    gloss: Câte dormitoare are?
    note: '*¿Cuántos...tiene?* (câte... are?) este un tipar obișnuit pentru a întreba despre caracteristicile unui loc.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: Descrie dormitoarele și bucătăria
    gloss: Are două dormitoare și o bucătărie mare.
    note: '*Tiene* (are) + număr + substantiv, aici cu *dormitorio*, *cocina* și *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Spune ce locuință vrei
    gloss: Vreau să închiriez un apartament cu o bucătărie mare.
    note: '*Quiero* (vreau) + infinitivul *alquilar*, iar *con* (cu) introduce caracteristica dorită.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Explică avantajul
    gloss: Așa poți găti și acasă.
    note: '*Así* (așa) + *puedes* (poți) + infinitiv leagă scopul legat de locuință de tema gătitului din toată povestea.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Citirea unui anunț pentru un apartament
    gloss: Apartament liber într-o clădire aproape de parc. Are două dormitoare, o baie, o sufragerie și o bucătărie mare. Este perfect pentru cineva care vrea să gătească acasă.
    note: Un anunț realist, în stilul anunțurilor mici din ziar.
    glosses:
      desocupado: liber / disponibil
      edificio: clădire
      cerca: aproape / în apropiere
      parque: parc
      Tiene: are (de la tener)
      dormitorios: dormitoare
      baño: baie
      sala: sufragerie
      grande: mare
      perfecto: perfect
      quiere: vrea (de la querer)
      cocinar: a găti
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Cum o propoziție relativă descrie chiriașul ideal.
    note: Vezi textul cardului.
    target_text: '*Para alguien que quiere* (pentru cineva care vrea) folosește *alguien* (cineva) + *que* (care) pentru a introduce o propoziție relativă, un tipar frecvent în anunțurile care descriu chiriașul ideal.'
  es.a1.unit14.lesson06.teach.line01:
    title: Spune problema și scopul
    gloss: Mateo spune că bucătăria lui este foarte mică și că vrea să închirieze un apartament cu una mare.
    note: Îmbină *mi cocina es muy pequeña* (bucătăria mea este foarte mică) cu enunțul scopului *quiero alquilar un apartamento con una cocina grande*.
  es.a1.unit14.lesson06.teach.line02:
    title: Propune să se uite la anunțuri
    gloss: 'Elena propune să se uite în ziar: sunt multe anunțuri.'
    note: '*El periódico* (ziarul) și *anuncios* (anunțuri) sunt cuvinte noi, din anunțurile mici din viața reală.'
  es.a1.unit14.lesson06.teach.line03:
    title: Găsește un anunț
    gloss: Mateo găsește o clădire cu un apartament liber.
    note: '*Este edificio* (această clădire) și *desocupado* (liber, disponibil).'
  es.a1.unit14.lesson06.teach.line04:
    title: Întreabă despre dormitoare
    gloss: Elena întreabă câte dormitoare are.
    note: Întrebarea obișnuită pentru a afla caracteristicile unui loc.
  es.a1.unit14.lesson06.teach.line05:
    title: Răspunde cu detalii
    gloss: Mateo spune că are două dormitoare și o bucătărie mare.
    note: '*Tiene* (are) + număr + substantiv.'
  es.a1.unit14.lesson06.teach.line06:
    title: Confirmă alte caracteristici
    gloss: Elena este încântată și observă că mai are o baie și o sufragerie.
    note: '*Baño* (baie) și *sala* (living) completează lista camerelor; *también* (și, de asemenea) vine la sfârșit.'
  es.a1.unit14.lesson06.teach.line07:
    title: Hotărăște să sune
    gloss: Mateo hotărăște să sune la agenție chiar astăzi.
    note: '*Voy a llamar* (o să sun) + *hoy mismo* (chiar astăzi); *la agencia* este agenția de închirieri.'
  es.a1.unit14.lesson06.teach.line08:
    title: Aprobă și încheie discuția
    gloss: Elena aprobă și observă că poate găti și acasă.
    note: '*Así puedes cocinar en casa también* (așa poți găti și acasă) încheie scena.'
