answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaniolă A1
  description: 'Spaniolă pentru începători: să propui, să accepți, să refuzi, să stabilești o oră, să citești și să scrii planuri simple.'
units:
  es.a1.unit50.plans:
    title: Planuri simple
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Propunerea unei activități
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Acceptarea sau refuzul unui plan
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Stabilirea zilei și a orei
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Citirea unei invitații
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Scrierea și confirmarea unui plan
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Elena și Mateo fac un plan
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Împreună
    gloss: împreună
    note: '*Juntos* arată clar că persoanele fac activitatea împreună; se acordă cu persoanele (*juntas* dacă sunt toate femei).'
    example_gloss: Bem o cafea împreună?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Luăm o cafea
    gloss: a lua o cafea
    note: În spaniolă se spune *tomar un café* (literal „a lua o cafea”), nu cu un verb care înseamnă „a bea”.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Mergem la film
    gloss: a merge la film
    note: '*Ir al cine* („a merge la cinema”) este felul obișnuit de a spune că mergi să vezi un film; *al* este *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Luăm o cafea?
    gloss: Luăm o cafea?
    note: '*¿Tomamos ...?* folosește prezentul persoanei *nosotros* pentru a propune ceva împreună.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: Cum folosim ¿Tomamos ...?
    gloss: ¿Tomamos + ceva? este modul obișnuit de a propune o activitate împreună.
    note: 'Forma *nosotros* (*tomamos*) se folosește pentru propuneri, ca „să luăm...?” sau „luăm...?” în română: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Ai chef să mergi la film?
    gloss: Ai chef să mergi la film?
    note: '*¿Tienes ganas de ...?* întreabă informal dacă cineva are chef să facă ceva; după *de* urmează un verb la infinitiv.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Da, super!
    gloss: Da, super!
    note: '*¡Sí, qué bien!* este o acceptare scurtă și entuziastă.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Bună idee
    gloss: Bună idee!
    note: '*¡Buena idea!* acceptă propunerea lăudând-o.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: Este un plan bun
    gloss: Este un plan bun.
    note: Este un răspuns pozitiv puțin mai amplu.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Refuzăm cu un motiv
    gloss: Îmi pare rău, nu pot, pentru că lucrez.
    note: '*Lo siento* îndulcește refuzul, iar *porque* introduce motivul scurt.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: Nu am timp
    gloss: Nu am timp.
    note: '*No tengo tiempo* este un motiv direct, dar obișnuit, pentru a refuza; *no* se pune înaintea verbului.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Un refuz amabil
    gloss: Lo siento + no puedo + un motiv scurt face refuzul amabil.
    note: În conversație motivul este opțional, dar face modelul mai util și mai politicos.
  es.a1.unit50.lesson03.teach.quedar:
    title: A stabili o întâlnire
    gloss: a se înțelege asupra unei întâlniri
    note: '*Quedar* înseamnă a stabili o întâlnire: *¿Quedamos el viernes?* Mulți vorbitori din America Latină spun în schimb *¿Nos vemos el viernes?*'
    example_gloss: Ne vedem vineri la 2:30?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Ne vedem vineri la două și jumătate
    gloss: Ne vedem vineri la 2:30?
    note: Aici se îmbină ziua săptămânii *el viernes* cu *a las* și ora.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media înseamnă jumătate
    gloss: las dos y media = 2:30; a las dos y media arată ora întâlnirii.
    note: 'Ca în română, ora se spune pornind de la ora care tocmai a trecut: *las dos y media* este 2:30, literal „două și jumătate”.'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: O dată și o oră
    gloss: vineri, 17 aprilie, la 3:15
    note: 'Ca în română, zilele săptămânii și lunile se scriu cu literă mică, dar în spaniolă data se leagă cu *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Confirmăm ora
    gloss: Da, vineri la 2:30 îmi convine.
    note: '*Me viene bien* („îmi convine”) confirmă că ora propusă se potrivește.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Mesaj, invitație, cafenea de limbi
    gloss: mesajul, invitația, cafeneaua de limbi
    note: '*Un mensaje* este un mesaj scurt, scris sau digital, *una invitación* te cheamă să participi la o activitate, iar *el café de idiomas* este locul de întâlnire al grupului.'
    example_gloss:
    - Am un mesaj de la Elena.
    - Aceasta este o invitație la cafeneaua de limbi.
    - Luăm o cafea la cafeneaua de limbi.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: Invitația Elenei
    gloss: Salut, Mateo, ai chef să luăm o cafea la cafeneaua de limbi sâmbătă, 18 aprilie, la 2:30? Cu bine, Elena.
    note: 'Citește și caută patru detalii: activitatea, data, ora și locul.'
    glosses:
      Hola: salut
      ganas: poftă, chef (tener ganas de = a avea chef de)
      sábado: sâmbătă
      abril: aprilie
      media: jumătate (y media = și jumătate)
      dos: două
      café: cafea
      tomar: a bea / a lua
      idiomas: cafenea de limbi
      saludo: cu bine
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Un mesaj cu o propunere
    gloss: Salut, Mateo, luăm o cafea vineri la 2:30? Cu bine, Elena.
    note: Mesajul conține un salut, activitatea, ziua, ora și încheierea.
    glosses:
      Hola: salut
      vamos: hai să
      viernes: vineri
      media: jumătate (y media = și jumătate)
      dos: două
      café: cafea
      tomar: a bea / a lua
      saludo: cu bine
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Un mesaj de confirmare
    gloss: Salut, Elena, da, super! Vineri la 2:30 îmi convine. Pe vineri! Mateo.
    note: Răspunsul acceptă activitatea și repetă programul pentru a-l confirma.
    glosses:
      Hola: salut
      bien: bine / super
      viernes: vineri
      media: jumătate (y media = și jumătate)
      dos: două
      viene: bine / convine
      Hasta: până / pe curând
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Ce conține un mesaj
    gloss: Un mesaj scurt indică activitatea, ziua sau data și ora.
    note: Salutul și încheierea sunt utile, dar detaliile importante sunt activitatea și momentul în care are loc.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena propune o cafea
    gloss: 'Elena: Luăm o cafea vineri? Mateo: Da, super! La ce oră?'
    note: Mateo acceptă activitatea înainte de a întreba ora.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Prima oră propusă de Elena
    gloss: 'Elena: La 2:30.'
    note: '*Las dos y media* înseamnă 2:30, ca în lecția despre oră.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo propune altă oră
    gloss: 'Mateo: Îmi pare rău, la 2:30 nu pot. Se poate la 3:15?'
    note: '*¿Puede ser a ...?* este un mod concis de a întreba dacă o altă oră se potrivește.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Stabilesc planul final
    gloss: 'Elena: Da, la 3:15 îmi convine. Mateo: Bun plan. Atunci ne vedem vineri la 3:15.'
    note: Aici *quedamos* este din nou forma *nosotros*, care acum confirmă planul.
