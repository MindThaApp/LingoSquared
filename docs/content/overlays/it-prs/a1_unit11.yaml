teaching:
  prs.a1.unit11.lesson01.teach.saat_word:
    title: Ora / orologio
    gloss: ora / orologio
    note: '*ساعت* significa sia «ora» sia «orologio» e, nelle espressioni dell''orario, indica anche «le ... in punto».'
    example_gloss: Che ore sono?
  prs.a1.unit11.lesson01.teach.daqiqa_word:
    title: Minuto
    gloss: minuto
    note: '*دقیقه* significa «minuto».'
    example_gloss: Aspetta cinque minuti.
  prs.a1.unit11.lesson01.teach.nim_word:
    title: Mezza
    gloss: mezzo
    note: '*نیم* significa «mezzo» e si usa per la mezz''ora (per esempio *ساعت سه و نیم*, le tre e mezza).'
    example_gloss: Sono le sette e mezza.
  prs.a1.unit11.lesson01.teach.rub_word:
    title: Quarto
    gloss: quarto
    note: '*ربع* significa «quarto» e si usa per i quarti d''ora (per esempio *ساعت چهار و ربع*, le quattro e un quarto).'
    example_gloss: Sono le otto meno un quarto.
  prs.a1.unit11.lesson01.teach.numbers_review:
    title: Numeri da 1 a 5 (ripasso)
    gloss: uno, due, tre, quattro, cinque
    note: '*یک، دو، سه، چهار، پنج* ripassano i numeri dell''Unità 4, necessari per dire l''ora.'
    example_gloss:
    - Ho un libro.
    - Ho due fratelli.
    - Ho tre sorelle.
    - Restano quattro giorni.
    - Aspetta cinque minuti.
  prs.a1.unit11.lesson02.teach.chand_word:
    title: Quanti / che
    gloss: quanti / che
    note: '*چند* si unisce a *ساعت* per chiedere l''ora: *ساعت چند است؟*'
    example_gloss: Che ore sono?
  prs.a1.unit11.lesson02.teach.saat_chand_ast:
    title: Che ore sono?
    gloss: Che ore sono?
    note: '*ساعت چند است؟* è il modo neutro e cortese di chiedere l''ora in dari.'
  prs.a1.unit11.lesson02.teach.register_note:
    title: Nota sul registro
    gloss: ساعت چند است؟ (forma completa, neutra)
    note: '*ساعت چند است؟* è la forma completa e neutra: è corretta sia nello scritto sia nel parlato. Nel parlato veloce e informale *است* si riduce spesso a una -ه finale (come in *چنده*), ma finché impari usa la forma completa.'
    target_text: ساعت چند است؟ (forma completa, neutra)
  prs.a1.unit11.lesson03.teach.saat_se_ast:
    title: Sono le tre.
    gloss: Sono le tre.
    note: '*ساعت سه است* indica l''ora esatta.'
  prs.a1.unit11.lesson03.teach.saat_se_o_nim:
    title: Sono le tre e mezza.
    gloss: Sono le tre e mezza.
    note: '*و* (e) unisce l''ora e la mezz''ora: *ساعت سه و نیم است*.'
  prs.a1.unit11.lesson03.teach.saat_char_o_rub:
    title: Sono le quattro e un quarto.
    gloss: Sono le quattro e un quarto.
    note: '*ساعت چهار و ربع است* aggiunge un quarto d''ora all''ora.'
  prs.a1.unit11.lesson04.teach.sobh_review:
    title: Mattina (ripasso)
    gloss: mattina
    note: '*صبح* ripassa il saluto del mattino dell''Unità 1 (*صبح بخیر*).'
    example_gloss: La mattina mi alzo presto.
  prs.a1.unit11.lesson04.teach.zohr_word:
    title: Mezzogiorno
    gloss: mezzogiorno
    note: '*ظهر* significa «mezzogiorno»: è una parola nuova, che non compariva tra i saluti dell''Unità 1.'
    example_gloss: Pranzo a mezzogiorno.
  prs.a1.unit11.lesson04.teach.asr_review:
    title: Pomeriggio (ripasso)
    gloss: pomeriggio
    note: '*عصر* ripassa il saluto del pomeriggio/della sera dell''Unità 1 (*عصر بخیر*).'
    example_gloss: Lavoro il pomeriggio.
  prs.a1.unit11.lesson04.teach.shab_review:
    title: Notte (ripasso)
    gloss: notte
    note: '*شب* ripassa il saluto della notte dell''Unità 1 (*شب بخیر*).'
    example_gloss: La sera vado a dormire presto.
  prs.a1.unit11.lesson04.teach.saat_noh_sobh:
    title: Sono le nove del mattino.
    gloss: Sono le nove del mattino.
    note: '*ساعت نه صبح است* unisce l''orario e il momento della giornata.'
  prs.a1.unit11.lesson04.teach.haft_word:
    title: Sette (7)
    gloss: sette (7)
    note: '*هفت* significa «sette» ed è necessario per dire le sette di sera.'
    example_gloss: Vengo alle sette.
  prs.a1.unit11.lesson05.teach.qarar_word:
    title: Appuntamento
    gloss: appuntamento
    note: '*قرار* significa «appuntamento»: è una parola nuova, legata agli appuntamenti personali di questa unità, e si distingue da *جلسه* (riunione), che compare nel dialogo precedente sull''organizzazione di una riunione.'
    example_gloss: Ho un appuntamento.
  prs.a1.unit11.lesson05.teach.qarar_saat_chand:
    title: A che ora è il Suo appuntamento?
    gloss: A che ora è il Suo appuntamento?
    note: '*قرار شما ساعت چند است؟* chiede con cortesia (*شما*) l''orario dell''appuntamento di qualcuno.'
  prs.a1.unit11.lesson05.teach.qarar_answer:
    title: Il mio appuntamento è alle otto e mezza.
    gloss: Il mio appuntamento è alle otto e mezza.
    note: '*قرار من ساعت هشت و نیم است* indica l''orario del proprio appuntamento.'
  prs.a1.unit11.lesson06.teach.names:
    title: Zarmina e Homayoun
    gloss: Zarmina, Homayoun
    note: '*زرمینه* e *همایون* sono i due interlocutori del dialogo di questa lezione.'
    example_gloss:
    - Zarmina viene alle sette.
    - Homayoun viene alle otto.
  prs.a1.unit11.lesson06.teach.dialogue_line1:
    title: Scusi, a che ora è la riunione?
    gloss: Scusi, a che ora è la riunione?
    note: Zarmina chiede con cortesia l'orario della riunione.
  prs.a1.unit11.lesson06.teach.dialogue_line2:
    title: La riunione è alle nove del mattino.
    gloss: La riunione è alle nove del mattino.
    note: Homayoun dice l'orario della riunione.
  prs.a1.unit11.lesson06.teach.dialogue_line3:
    title: Alle nove? Bene. Io vengo alle otto e mezza.
    gloss: Alle nove? Bene. Io vengo alle otto e mezza.
    note: Zarmina conferma e dice a che ora arriverà lei.
  prs.a1.unit11.lesson06.teach.dialogue_line4:
    title: Molto bene, vi aspetto.
    gloss: Molto bene, vi aspetto.
    note: '*منتظر استم* (aspetto) usa la desinenza della copula *استم*, già incontrata.'
