course:
  title: Italiano–Dari A1
  description: 'Dari afghano per principianti: cibi e bevande, ordinare con cortesia, chiedere che cosa c''è, le quantità e le buone maniere al ristorante, compreso chiedere il conto.'
units:
  prs.a1.unit08.food:
    title: Il cibo e come ordinare un pasto
