  prs.a1.unit08.lesson06.restaurant_dialogue:
    title: Una conversazione completa in una casa da tè
teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Pane
    gloss: pane
    note: نان è un alimento base di ogni pasto afghano.
    example_gloss: Il pane è fresco.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Riso pilaf
    gloss: riso pilaf
    note: 'پلو è il piatto afghano di riso pilaf, speziato in modo particolare e spesso cucinato con carne, carote o uvetta: non è semplice riso bianco.'
    example_gloss: Il riso pilaf è buonissimo.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Stufato di carne e verdure
    gloss: stufato di carne e verdure
    note: قورمه è il termine generico per uno stufato di carne e verdure, di solito servito con il پلو.
    example_gloss: Mangio lo stufato con il riso pilaf.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Tè (ripasso)
    gloss: tè
    note: چای è la bevanda che si offre quasi ovunque in Afghanistan.
    example_gloss: Un tè, per favore.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: L'acqua
    gloss: acqua
    note: آب è la parola comune per «acqua».
    example_gloss: Un'acqua, per favore.
  prs.a1.unit08.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la parola di collegamento comune che serve a unire un elenco di cibi.
    target_text: و (e)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Ordinare il tè con cortesia
    gloss: Vorrei un tè.
    note: 'یک چای می‌خواهم è un modo neutro e cortese di ordinare: usa direttamente می‌خواهم (voglio) invece di una costruzione più indiretta.'
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Per favore
    gloss: per favore
    note: لطفاً si può aggiungere a quasi ogni richiesta per renderla più gentile.
    example_gloss: Per favore, aiutami.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Ordinare il pane con cortesia
    gloss: Vorrei un pane.
    note: Lo stesso schema یک [item] می‌خواهم vale per qualsiasi nome di cibo o bevanda.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Chiedere cosa c'è
    gloss: Che cosa avete?
    note: چی دارین؟ è il modo naturale per chiedere a un negoziante o a un cameriere quali cibi ci sono.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Rispondere con ciò che c'è
    gloss: Abbiamo pilaf di riso e stufato.
    note: پلو و قورمه داریم usa داریم (abbiamo), la forma noi di دارم. Il negoziante dice «noi» perché parla a nome di tutto il locale.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Fresco
    gloss: fresco
    note: تازه si usa per il cibo appena preparato.
    example_gloss: Questo pane è fresco.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Un piatto di pilaf di riso
    gloss: un piatto di pilaf di riso
    note: بشقاب (piatto) è la parola di conteggio per il cibo servito in un piatto.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Due pani
    gloss: due pani
    note: تا è il classificatore generico che si mette dopo un numero per la maggior parte delle cose numerabili, qui due pezzi di pane.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Fare un ordine completo
    gloss: Un piatto di pilaf di riso e due pani, per favore.
    note: In un solo ordine si possono unire più quantità con و (e).
  prs.a1.unit08.lesson05.teach.bill_word:
    title: Il conto
    gloss: il conto
    note: بل (dall'inglese «bill») è la parola di uso quotidiano in Afghanistan per il conto del ristorante.
    example_gloss: Il conto, per favore.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Chiedere quanto viene il conto
    gloss: Quanto viene il conto?
    note: 'بل چند می‌شه؟ significa letteralmente «il conto diventa quanto», il modo naturale e quotidiano di chiedere il totale. می‌شه è la forma parlata di می‌شود: è quella che sentirai in negozio, mentre nello scritto si usa می‌شود.'
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Dire che il cibo era delizioso
    gloss: Era buonissimo.
    note: خیلی خوش‌مزه بود è un complimento naturale da fare dopo un pasto.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Casa da tè
    gloss: casa da tè / semplice locale dove mangiare
    note: چایخانه è un tipo comune di semplice locale in Afghanistan, soprattutto a Kabul, dove si servono tè e pasti semplici.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Benvenuti (ripasso)
    gloss: benvenuto
    note: خوش آمدین è stato introdotto nell'unità dei saluti; qui è usato come saluto del negoziante.
  prs.a1.unit08.lesson06.teach.turn01:
    title: Il negoziante saluta il cliente
    gloss: Il negoziante dà il benvenuto al cliente e gli chiede che cosa desidera.
    note: چی میل دارین؟ è una domanda iniziale cortese, simile nella funzione a چی دارین؟ ma impostata sul desiderio del cliente.
  prs.a1.unit08.lesson06.teach.turn02:
    title: Il cliente chiede che cosa c'è
    gloss: Il cliente saluta il negoziante e chiede che cosa c'è.
    note: چی دارین؟ apre lo scambio per ordinare, dalla lezione 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: Il negoziante elenca ciò che c'è
    gloss: Il negoziante dice che ha pilaf di riso e stufato, entrambi freschi.
    note: هردو (entrambi) conferma la freschezza di tutti e due i piatti nominati.
  prs.a1.unit08.lesson06.teach.turn04:
    title: Il cliente fa un ordine completo
    gloss: Il cliente accetta e ordina un piatto di pilaf di riso con stufato, più un tè.
    note: Qui si uniscono lo schema delle quantità della lezione 4 e il lessico del cibo della lezione 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: Il negoziante conferma l'ordine
    gloss: Il negoziante dice che lo porta subito.
    note: چشم, letteralmente «sui miei occhi», è un modo rispettoso per dire «certamente». می‌آرم è la forma parlata di می‌آورم (porto), e همین حالا significa «subito».
  prs.a1.unit08.lesson06.teach.turn06:
    title: Il cliente fa un complimento al cibo e chiede il conto
    gloss: Il cliente dice che era buonissimo e chiede il conto.
    note: Entrambe le frasi riprendono direttamente il lessico della lezione 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: Il negoziante dice il totale
    gloss: Il negoziante ringrazia e dice che il conto è di duecento afghani.
    note: افغانی è la moneta dell'Afghanistan; دوصد (duecento) si unisce al nome della moneta per indicare un prezzo.
