    title: Tu (informale) / tu hai (informale)
    gloss: tu (informale) / tu hai (informale)
    note: تو (tu, informale) e داری (tu hai, informale) sono già noti e si usano nel dialogo informale di questa lezione tra amici stretti.
    target_text: تو (tu, informale) / داری (tu hai, informale)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: Che / ogni giorno
    gloss: che / quale / ogni giorno
    note: چه (che/quale, ripasso di «che colore» dell'Unità 21) e هر روز (ogni giorno, ripasso dell'Unità 24) si usano insieme per chiedere come ci si prende cura di un animale domestico.
    target_text: چه (che/quale) / هر روز (ogni giorno)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, hai un animale domestico?'
    gloss: 'Homayoun: Zarmina, hai un animale domestico?'
    note: Una domanda informale tra amici, con la forma informale داری.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Sì, ho un gatto'
    gloss: 'Zarmina: Sì, ho un gatto.'
    note: Risponde con بلی e یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Di che colore è il tuo gatto?'
    gloss: 'Homayoun: Di che colore è il tuo gatto?'
    note: Usa چه رنگ (che colore), lo stesso schema della domanda sugli acquisti dell'Unità 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Zarmina: È bianco'
    gloss: 'Zarmina: È bianco.'
    note: 'Una risposta breve: solo il colore più است. Il gatto è già chiaro dalla domanda, quindi پشک non si ripete.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Gli dai da mangiare ogni giorno?'
    gloss: 'Homayoun: Gli dai da mangiare ogni giorno?'
    note: Introduce غذا می‌دهی (tu dai da mangiare, informale), formato da غذا (cibo) + می‌دهی, la forma informale corrispondente a می‌دهد dell'Unità 18.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Sì, gli do da mangiare ogni giorno'
    gloss: 'Zarmina: Sì, gli do da mangiare ogni giorno.'
    note: Applica هر روز (ogni giorno) a می‌دهم (io do da mangiare, 1ª persona).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: Lettura su un animale domestico
    gloss: Zarmina ha un gatto. Il suo gatto è bianco e piccolo. Zarmina dà da mangiare al gatto ogni giorno.
    note: Un breve testo che riprende il lessico degli animali domestici dell'unità e introduce دارد (ha, 3ª persona, ripasso dalle Unità 26/27) e می‌دهد (dà, dà da mangiare, 3ª persona, ripasso dall'Unità 18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: Ma
    gloss: ma
    note: اما significa «ma» (ripasso delle unità precedenti).
    target_text: اما (ma)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: Io sono
