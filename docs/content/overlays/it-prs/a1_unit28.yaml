teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: Animale
    gloss: animale
    note: حیوان significa animale, la parola generica che comprende gli animali domestici e le altre creature.
    example_gloss: Il cane è un animale.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: Cane
    gloss: cane
