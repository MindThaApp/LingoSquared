    example_gloss: Ho un cane.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: Gatto
    gloss: gatto
    note: 'پشک significa gatto: è la parola di uso quotidiano in dari/afghano, diversa da گربه del persiano dell''Iran.'
    example_gloss: Ho un gatto.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: Uccello
    gloss: uccello
    note: پرنده significa uccello.
    example_gloss: Ho un uccello.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: Il pesce
    gloss: pesce
    note: ماهی significa pesce.
    example_gloss: Ho un pesce.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: Animale domestico
    gloss: animale domestico
    note: 'حیوان خانگی significa letteralmente «animale di casa»: حیوان (animale, già visto) + خانگی (domestico).'
    example_gloss: Il cane è il mio animale domestico.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: Io ho / Lei ha (formale) / è
    gloss: ho / Lei ha / è
    note: دارم (ho), دارین (Lei ha, forma formale) e است (è) sono già stati visti nelle unità precedenti e in questa unità servono per parlare degli animali domestici.
    target_text: دارم (io ho) / دارین (Lei ha, formale) / است (è)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: حیوان خانگی دارین؟ è il modo cortese e formale per chiedere a qualcuno se ha un animale domestico.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: بلی (sì, già visto nell'unità 3) unito a سگ دارم di questa unità.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: نخیر (no formale, già visto nell'unità 3) unito a حیوان خانگی ندارم (non ho animali domestici).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
