course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: il lessico degli animali e degli animali domestici (cane, gatto, uccello, pesce), come chiedere e rispondere se si ha un animale domestico con حیوان خانگی دارین؟, come descrivere la taglia e il colore di un animale e un dialogo tra Zarmina e Homayoun su come tenere e nutrire un gatto.'
