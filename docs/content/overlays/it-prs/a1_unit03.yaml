        مادر: madre
        پدر: padre
        برادر: fratello
        خواهر: sorella
      status: correct
    feedback: Il dari distingue se zii e zie sono dal lato del padre o della madre; le ultime quattro parole ripassano la famiglia stretta della lezione 1.
    pairs:
    - left: کاکا
      right: fratello del padre
    - left: عمه
      right: sorella del padre
    - left: ماما
      right: fratello della madre
    - left: خاله
      right: sorella della madre
    - left: مادر
      right: madre
    - left: پدر
      right: padre
    - left: برادر
      right: fratello
    - left: خواهر
      right: sorella
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: 'Riordina: Questa è mia nonna.'
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من significa «mia nonna».
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 'Completa: Il fratello di mia madre è mio zio materno.'
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: مامایم significa «mio zio materno».
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: 'Traduci in dari: Lei è mia zia paterna.'
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: Si accetta la spaziatura da tastiera; l'ortografia standard usa lo ZWNJ.
    - value: او عمهٔ من است
      status: correct
    feedback: عمه indica la sorella del padre.
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'Spiega il legame di parentela, non una persona precisa: di'' che lo zio paterno (کاکا) è il fratello di tuo padre e lo zio materno (ماما) è il fratello di tua madre.'
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا è dal lato del padre; ماما è dal lato della madre.
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: Quante persone ci sono in questa famiglia?
    correct_option: cinque
    distractors:
    - quattro
    - sei
    - sette
    accepted_answers:
    - value: cinque
      status: correct
    feedback: پنج نفر significa «cinque persone».
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: Scegli il significato di من تک‌فرزند استم.
    correct_option: Sono figlio unico / figlia unica.
    distractors:
    - Ho un figlio.
    - Ho un fratello.
    - Siamo una sola famiglia.
    accepted_answers:
    - value: Sono figlio unico / figlia unica.
      status: correct
    feedback: تک‌فرزند significa «figlio unico».
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: Abbina ogni parola o espressione al suo significato.
    accepted_answers:
    - value:
        دارم: ho
        داریم: noi abbiamo
        دارین: voi avete / Lei ha (forma di rispetto)
        فامیل: famiglia
        تک‌فرزند: figlio unico
        یک برادر و دو خواهر دارم: Ho un fratello e due sorelle.
      status: correct
    feedback: Le desinenze distinguono «io», «noi» e il «voi/Lei» di rispetto o plurale; le ultime tre mostrano il lessico della famiglia e دارم in una frase completa, tutto della stessa lezione.
    pairs:
    - left: دارم
      right: ho
    - left: داریم
      right: noi abbiamo
    - left: دارین
      right: voi avete / Lei ha (forma di rispetto)
    - left: فامیل
      right: famiglia
    - left: تک‌فرزند
      right: figlio unico
    - left: یک برادر و دو خواهر دارم
      right: Ho un fratello e due sorelle.
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: 'Riordina: Nella nostra famiglia siamo in sei.'
    accepted_answers:
    - value:
      - فامیل
      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: فامیل ما شش نفر است indica una famiglia di sei persone.
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 'Completa: Ho un fratello.'
    accepted_answers:
    - value: دارم
      status: correct
    feedback: دارم significa «ho».
  prs.a1.unit03.lesson03.exercise06.translate_size:
    instruction: 'Traduci in dari: Nella nostra famiglia siamo in quattro.'
    accepted_answers:
    - value: فامیل ما چهار نفر است
      status: correct
    - value: فامیل من چهار نفر است
      status: acceptable_with_note
      note: Significa «nella mia famiglia siamo in quattro».
    feedback: Usa il numero con نفر است.
  prs.a1.unit03.lesson03.exercise07.describe_own:
    instruction: 'Scrivi due frasi in dari con questi dati: la tua famiglia è di quattro persone e hai un fratello.'
    accepted_answers:
    - value: فامیل من چهار نفر است. یک برادر دارم.
      status: correct
    - value: فامیل من چهار نفر است، یک برادر دارم.
      status: correct
    - value: فامیل من چهار نفر است و یک برادر دارم.
      status: correct
    - value: فامیل ما چهار نفر است. یک برادر دارم.
      status: correct
    - value: فامیل ما چهار نفر است و یک برادر دارم.
      status: correct
    feedback: فامیل من چهار نفر است indica il numero di persone; یک برادر دارم aggiunge l'informazione sul fratello.
  prs.a1.unit03.lesson04.exercise01.recognize_question:
    instruction: Che cosa chiede برادر و خواهر دارین؟
    correct_option: Ha fratelli e sorelle?
    distractors:
    - I suoi genitori stanno bene?
    - Quanto è grande la sua famiglia?
    - È sposato/a?
    accepted_answers:
    - value: Ha fratelli e sorelle?
      status: correct
    feedback: دارین significa «ha / avete» nel registro di rispetto o plurale.
  prs.a1.unit03.lesson04.exercise02.recognize_negative:
    instruction: Scegli il significato di نخیر، خواهر ندارم.
    correct_option: No, non ho sorelle.
    distractors:
    - Sì, ho una sorella.
    - No, mia sorella non è qui.
    - Non ho fratelli.
    accepted_answers:
    - value: No, non ho sorelle.
      status: correct
    feedback: نخیر è «no» e ندارم è «non ho».
  prs.a1.unit03.lesson04.exercise03.match_answers:
    instruction: Abbina ogni risposta al suo significato.
    accepted_answers:
    - value:
        بلی: sì
        نخیر: 'no'
        بلی، دارم: sì, ho
        نخیر، ندارم: no, non ho
      status: correct
    feedback: 'بلی afferma; نخیر è il «no» rispettoso: si usano da soli o insieme a un''informazione.'
    pairs:
    - left: بلی
      right: sì
    - left: نخیر
      right: 'no'
    - left: بلی، دارم
      right: sì, ho
    - left: نخیر، ندارم
      right: no, non ho
  prs.a1.unit03.lesson04.exercise04.order_question:
    instruction: 'Riordina la domanda di cortesia: Quanti fratelli e sorelle ha?'
    accepted_answers:
    - value:
      - چند
      - برادر
      - و
      - خواهر
      - دارین
      status: correct
    feedback: چند introduce la domanda sulla quantità.
  prs.a1.unit03.lesson04.exercise05.complete_polite:
    instruction: 'Completa: Quante persone siete in famiglia?'
    accepted_answers:
