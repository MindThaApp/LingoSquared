teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Madre
    gloss: madre
    note: مادر è la parola dari neutra per «madre».
    example_gloss: Mia madre è gentile.
  prs.a1.unit03.lesson01.teach.father:
    title: Padre
    gloss: padre
    note: پدر è la parola dari neutra per «padre».
    example_gloss: Mio padre è medico.
  prs.a1.unit03.lesson01.teach.brother:
    title: Fratello
    gloss: fratello
    note: برادر significa «fratello».
    example_gloss: Ho un fratello.
  prs.a1.unit03.lesson01.teach.sister:
    title: Sorella
    gloss: sorella
    note: خواهر significa «sorella».
    example_gloss: Mia sorella è insegnante.
  prs.a1.unit03.lesson01.teach.parents:
    title: Genitori
    gloss: padre e madre; genitori
    note: In dari per indicare i genitori si dice comunemente پدر و مادر.
    example_gloss: I miei genitori vivono a Kabul.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Presentare tua madre
    gloss: Questa è mia madre.
    note: La desinenza ـم in مادرم significa «mio/mia».
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Nonno
    gloss: nonno
    note: پدرکلان è il termine più usato in dari afghano; letteralmente «padre grande» o «padre anziano».
    example_gloss: Mio nonno è anziano.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Nonna
    gloss: nonna
    note: مادرکلان è il termine più usato in dari afghano; letteralmente «madre grande» o «madre anziana».
    example_gloss: Mia nonna è gentile.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Il fratello del padre
    gloss: zio paterno
    note: کاکا indica in modo specifico il fratello di tuo padre.
    example_gloss: Mio zio vive a Herat.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: La sorella del padre
    gloss: zia paterna
    note: عمه indica in modo specifico la sorella di tuo padre.
    example_gloss: Mia zia è insegnante.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Il fratello della madre
    gloss: zio materno
    note: In dari ماما indica in modo specifico il fratello di tua madre.
    example_gloss: Mio zio (materno) è ingegnere.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: La sorella della madre
    gloss: zia materna
    note: خاله indica in modo specifico la sorella di tua madre.
    example_gloss: Mia zia (materna) vive a Kabul.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Tieni distinti i due lati della famiglia
    gloss: Kaka e amma sono paterni; mama e khala sono materni.
    note: In italiano «zio» e «zia» non dicono se il parente è da parte di padre o di madre, mentre queste quattro parole dari lo distinguono.
  prs.a1.unit03.lesson03.teach.family:
    title: La famiglia
    gloss: famiglia
    note: فامیل è la parola dari afghana di uso comune per «famiglia».
    example_gloss: La mia famiglia è numerosa.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Chiedere con cortesia quante persone ci sono in famiglia
    gloss: Quante persone ci sono nella tua famiglia?
    note: ـتان indica il «vostro/Suo» di cortesia; نفر è il numerale classificatore per le persone.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Dire quante persone ci sono in famiglia
    gloss: Nella nostra famiglia siamo in cinque.
    note: Il dari indica la famiglia con un numero di persone seguito da نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Contare i fratelli e le sorelle
    gloss: Ho un fratello e due sorelle.
    note: دارم significa «ho». Dopo un numero il nome resta al singolare.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Figlio unico
    gloss: Sono figlio unico.
    note: استم è la forma di prima persona del dari di Kabul presentata in questo corso.
  prs.a1.unit03.lesson03.teach.possession:
    title: Le forme del verbo «avere»
    gloss: ho; abbiamo; avete / ha (Lei)
    note: دارین è la forma di rispetto o di plurale per «voi avete / Lei ha» nel dari colloquiale colto di Kabul.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Chiedere dei fratelli
    gloss: Hai fratelli e sorelle? / Ha fratelli e sorelle?
    note: دارین rende la domanda rispettosa o plurale.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Chiedere quanti fratelli ha qualcuno
    gloss: Quanti fratelli e sorelle hai? / Quanti fratelli e sorelle ha?
    note: چند chiede «quanti».
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Chiedere dei genitori di qualcuno
    gloss: I Suoi genitori stanno bene?
    note: جور استند è un modo afghano confidenziale per dire «stanno bene».
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Risposta affermativa
    gloss: Sì, ho un fratello.
    note: بلی è il «sì» cortese e standard usato in Afghanistan.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Risposta negativa
    gloss: No, non ho sorelle.
    note: نخیر è il «no» rispettoso; ندارم significa «non ho».
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Il «vostro/Suo» di cortesia
    gloss: la Sua famiglia; Sua madre; Suo padre
    note: La desinenza possessiva ـتان è di rispetto o di plurale. In questo corso si unisce alla parola con uno ZWNJ.
  prs.a1.unit03.lesson05.teach.married:
    title: Sposato
    gloss: sposato/a
    note: متأهل è un termine neutro per lo stato civile.
    example_gloss: Lui/lei è sposato/a.
  prs.a1.unit03.lesson05.teach.single:
    title: Single
    gloss: celibe; non sposato
    note: مجرد in questo contesto significa non sposato.
    example_gloss: Sono single.
  prs.a1.unit03.lesson05.teach.husband:
    title: Marito
    gloss: marito
    note: شوهر è la parola comune per «marito».
    example_gloss: Mio marito è ingegnere.
  prs.a1.unit03.lesson05.teach.wife:
    title: Moglie
    gloss: moglie
    note: خانم può significare «moglie» oppure «signora» (appellativo di cortesia per una donna); lo si capisce dal contesto.
    example_gloss: Mia moglie è insegnante.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Chiedere con cortesia se si è sposati
    gloss: È sposato/a?
    note: Alla lettera chiede «Si è sposato/a?». La desinenza ـین è la forma di cortesia di Kabul.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Dire che si è sposati
    gloss: Sì, sono sposato/a.
    note: استم è la copula di prima persona usata nel dari afghano.
  prs.a1.unit03.lesson05.teach.children:
    title: Chiedere dei figli
    gloss: Ha figli?
    note: اولاد è una parola collettiva comune per «figlio» o «figli».
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam chiede quanti siete in famiglia
    gloss: Quante persone siete in famiglia?
    note: Maryam usa il ـتان di rispetto.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh parla dei suoi fratelli
    gloss: Siamo in cinque. Ho un fratello e una sorella.
    note: I membri della famiglia si contano con نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam chiede se è sposata
    gloss: È sposata?
    note: La domanda è cortese e neutra nella forma.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh parla di suo marito
    gloss: Sì, sono sposata. Mio marito è studente universitario.
    note: محصل, e non il persiano dell'Iran دانشجو, è la parola afghana consolidata per «studente» usata qui.
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam chiede dei figli
    gloss: Ha figli?
    note: دارین mantiene il registro di rispetto.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh risponde
    gloss: No, non abbiamo ancora figli.
    note: نخیر è un «no» rispettoso; نداریم significa «non abbiamo».
