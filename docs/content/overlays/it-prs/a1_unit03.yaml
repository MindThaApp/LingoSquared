      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: Usa این, il termine di parentela con «mio/mia» e است.
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: Scegli il significato di پدرکلان.
    correct_option: nonno
    distractors:
    - nonna
    - padre
    - zio paterno
    accepted_answers:
    - value: nonno
      status: correct
    feedback: پدرکلان significa «nonno» nel dari afghano.
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
