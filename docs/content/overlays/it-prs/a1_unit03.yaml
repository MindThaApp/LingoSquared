    title: La famiglia e i parenti
lessons:
  prs.a1.unit03.lesson01.immediate_family:
    title: I familiari stretti
  prs.a1.unit03.lesson02.extended_family:
    title: I parenti da parte di madre e di padre
  prs.a1.unit03.lesson03.family_size:
    title: Quante persone ci sono nella tua famiglia?
  prs.a1.unit03.lesson04.ask_about_family:
    title: Chiedere della famiglia di un'altra persona
  prs.a1.unit03.lesson05.marital_status:
