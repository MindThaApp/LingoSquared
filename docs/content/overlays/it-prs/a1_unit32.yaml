  prs.a1.unit32.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: Compleanno
    gloss: compleanno
    note: تولد significa compleanno, la parola chiave di questa unità.
    example_gloss: Il mio compleanno è in Hamal.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: Festa
    gloss: festa
    note: جشن significa festa o celebrazione.
    example_gloss: La nostra festa è grande.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Torta
    gloss: torta
    note: کیک significa torta, un prestito comune al persiano e al dari.
    example_gloss: La torta è deliziosa.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Regalo
    gloss: regalo
    note: هدیه significa regalo, una parola comune di uso quotidiano in dari e persiano (si usa anche تحفه).
    example_gloss: Questo regalo è per te.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Congratulazioni
    gloss: congratulazioni
    note: تبریک significa congratulazioni e si usa con می‌گویم (dico) nell'espressione di uso quotidiano تبریک می‌گویم (mi congratulo).
    example_gloss: Congratulazioni!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Buon compleanno (formazione)
    gloss: il tuo compleanno (informale) + benedetto → Buon compleanno
    note: تولدت unisce تولد (compleanno) al suffisso informale -ت, «tuo»; مبارک significa benedetto, felice. Insieme, تولدت مبارک è l'augurio di compleanno standard in dari e persiano.
    target_text: تولدت (il tuo compleanno, informale) + مبارک (benedetto) = تولدت مبارک (Buon compleanno)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: Buon compleanno!
    gloss: Buon compleanno!
    note: È l'augurio di compleanno autentico e molto diffuso in dari e persiano (تولدتان مبارک è la variante formale, che non compare negli esercizi di questa unità).
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: Lei / in / è
    gloss: Lei (formale) / in, a / è
    note: شما (Lei, formale), در (in, a) e است (è) sono già stati visti nelle unità precedenti.
    target_text: شما (tu/Lei, formale) / در (in/a) / است (è)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: Io / quale
    gloss: io / quale
    note: من (io) e کدام (quale) sono già stati visti nelle unità precedenti.
    target_text: من (io) / کدام (quale)
  prs.a1.unit32.lesson02.teach.month_word:
    title: Mese
    gloss: mese
    note: ماه significa mese, una parola davvero nuova per questo corso.
    example_gloss: Questo mese è caldo.
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Hamal
    gloss: Hamal (il primo mese)
    note: حمل è il primo mese del calendario solare hijri.
    target_text: حمل (Hamal, il primo mese)
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: In quale mese è il tuo compleanno?
    gloss: In quale mese è il tuo compleanno?
    note: Unisce تولد (compleanno, già visto), شما (Lei, formale, già visto), در (in, già visto), کدام (quale, già visto) e ماه (mese).
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: Il mio compleanno è in Hamal
    gloss: Il mio compleanno è in Hamal.
    note: Unisce la costruzione già vista تولد من در ... است (il mio compleanno è in ...) con حمل (Hamal).
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: Invito / festa
    gloss: invito / festa
    note: دعوت e مهمانی sono qui riproposte entrambe, perché ogni file del corso ripresenta il proprio lessico.
    target_text: دعوت (invito) / مهمانی (festa)
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: Segno dell'oggetto / a
    gloss: marca dell'oggetto / a, verso
    note: را (marca dell'oggetto) e به (a, verso) sono due parole grammaticali già viste.
    target_text: را (segno dell'oggetto) / به (a / verso)
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: Io faccio
    gloss: io faccio → io invito
    note: می‌کنم (io faccio, già visto) si combina con دعوت e forma il verbo composto دعوت می‌کنم (io invito).
    target_text: می‌کنم (faccio) — دعوت می‌کنم (invito)
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: Ti invito alla festa di compleanno
    gloss: Ti invito alla festa di compleanno.
    note: Unisce la costruzione già vista من ... را به ... دعوت می‌کنم (invito ... a ...) con جشن تولد (festa di compleanno).
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: Verrai? (formale)
    gloss: verrà? (formale)
    note: می‌آیین segue il modello formale in -ین già visto (come استین/می‌خوانین/می‌کنین).
    target_text: می‌آیین؟ (verrai? formale)
  prs.a1.unit32.lesson03.teach.will_you_come_question:
    title: Verrete?
    gloss: Verrete?
    note: Unisce شما (voi/Lei, forma di cortesia, già visto) a می‌آیین.
  prs.a1.unit32.lesson04.teach.review_time_words:
    title: Venerdì / ora / quanti / sette
    gloss: venerdì / ora, in punto / quanti, che / sette
    note: جمعه, ساعت, چند e هفت sono già stati presentati nelle unità precedenti (date e ore).
    target_text: جمعه (venerdì) / ساعت (ora / alle ore) / چند (quanti / che) / هفت (sette)
  prs.a1.unit32.lesson04.teach.review_informal_come:
    title: Tu (informale) / tu vieni / io vengo / sì / molto bene / grazie mille
    gloss: tu (informale) / tu vieni (informale) / io vengo / sì / molto bene / grazie mille
    note: تو, می‌آیی, می‌آیم, بلی, بسیار خوب e تشکر زیاد sono già noti e qui sono raccolti per il registro informale del dialogo.
    target_text: تو (tu, informale) / می‌آیی (tu vieni, informale) / می‌آیم (io vengo) / بلی (sì) / بسیار خوب (molto bene) / تشکر زیاد (grazie mille)
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: 'Basir: Maryam, venerdì c''è la mia festa di compleanno. Vieni?'
    gloss: Maryam, venerdì c'è la mia festa di compleanno. Vieni?
  prs.a1.unit32.lesson04.teach.dialogue_line2:
    title: 'Maryam: Sì, vengo! A che ora è venerdì?'
    gloss: Sì, vengo! A che ora è venerdì?
  prs.a1.unit32.lesson04.teach.dialogue_line3:
    title: 'Basir: Alle sette.'
    gloss: Alle sette.
  prs.a1.unit32.lesson04.teach.dialogue_line4:
    title: 'Maryam: Benissimo. Buon compleanno, Basir!'
    gloss: Benissimo. Buon compleanno, Basir!
  prs.a1.unit32.lesson04.teach.dialogue_line5:
    title: 'Basir: Grazie mille!'
    gloss: Grazie mille!
  prs.a1.unit32.lesson05.teach.happy_word:
    title: Contento
    gloss: felice
    note: خوشحال significa felice, contento.
    example_gloss: Lui/Lei è felice.
  prs.a1.unit32.lesson05.teach.review_u_yak:
    title: Lui/lei / un, uno
    gloss: lui/lei / un, uno, una
    note: او (lui/lei, già visto nell'unità 31) e یک (un/uno/una, già visto nell'unità 4) vengono ripresi qui.
    target_text: او (lui/lei) / یک (un/una / uno)
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: Lui/lei viene / lui/lei porta
    gloss: lui/lei viene / lui/lei porta
    note: می‌آید e می‌آورد sono le forme della terza persona, secondo il modello in -د già noto (per esempio می‌خواند dell'unità 31).
    target_text: می‌آید (lui/lei viene) / می‌آورد (lui/lei porta)
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: Lettura su una festa
    gloss: La festa di compleanno di Basir è venerdì. È alle sette. Maryam viene alla festa. Porta un regalo. Basir è felice.
  prs.a1.unit32.lesson06.teach.review_like_have_time:
    title: Mi piace / tempo / non ho / ma
    gloss: mi piace / tempo / non ho / ma
    note: دوست دارم (mi piace), وقت (tempo), ندارم (non ho) e اما (ma) sono già noti e riprendono la costruzione conclusiva dell'unità 31.
    target_text: دوست دارم (mi piace) / وقت (tempo) / ندارم (non ho) / اما (ma)
  prs.a1.unit32.lesson06.teach.wrap_summary:
    title: Mi piacciono le feste, ma non ho tempo
    gloss: Mi piacciono le feste, ma non ho tempo.
    note: Unisce جشن را دوست دارم (mi piacciono le feste, costruzione già vista) a اما وقت ندارم (ma non ho tempo).
