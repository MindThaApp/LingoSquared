course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: lessico di feste e compleanni (compleanno, festa, torta, regalo, congratulazioni), come chiedere e dire in quale mese cade il compleanno, una formula di invito formale e un dialogo tra Basir e Maryam su una festa di compleanno.'
units:
  prs.a1.unit32.celebrations:
    title: Le feste
    description: 'Parla di compleanni e feste: di'' quando è il tuo compleanno, invita qualcuno e fai gli auguri.'
