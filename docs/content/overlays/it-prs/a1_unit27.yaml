course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: il lessico dell''aspetto fisico (alto, basso, capelli, occhi, barba, occhiali), come chiedere che aspetto ha qualcuno con قیافه‌اش چطور است؟, il colore dei capelli e degli occhi (رنگ مو/رنگ چشم) e un dialogo tra Zarmina e Homayoun per riconoscere una persona dal suo aspetto.'
units:
  prs.a1.unit27.appearance:
    title: Aspetto fisico
    description: Descrivi l'aspetto fisico di base di una persona e chiedi che aspetto ha qualcuno.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Parole per l'aspetto
  prs.a1.unit27.lesson02.appearance_question:
    title: Chiedere dell'aspetto
  prs.a1.unit27.lesson03.hair_eye_color:
    title: Colore di capelli e occhi
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Dialogo sull'aspetto
  prs.a1.unit27.lesson05.reading_appearance:
    title: Lettura sull'aspetto
  prs.a1.unit27.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Alto
    gloss: alto
    note: 'قد بلند significa letteralmente "statura lunga": قد (statura) + بلند (lungo/alto).'
    example_gloss: È alto/a.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Basso
    gloss: basso
    note: 'قد کوتاه significa letteralmente "statura corta": قد (statura, ripasso) + کوتاه (corto).'
    example_gloss: È basso/a.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: I capelli
    gloss: capelli
    note: مو significa capelli; موی è la stessa parola in forma di stato costrutto, usata davanti a un'altra parola (per esempio موی سیاه, "capelli neri").
    example_gloss: Ha i capelli neri.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Occhio
    gloss: occhio
    note: چشم significa occhio (per descrivere il colore degli occhi si usa il singolare, il modo naturale di dirlo ogni giorno).
    example_gloss: Ha gli occhi neri.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Barba
    gloss: barba
    note: ریش significa barba.
    example_gloss: Ha la barba.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Occhiali
    gloss: occhiali
    note: عینک significa occhiali.
    example_gloss: Porta gli occhiali.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: È / ha (3ª persona)
    gloss: è / ha (3ª persona)
    note: است (è) e دارد (ha, 3ª persona) sono già stati visti all'inizio del corso e si usano in tutta l'unità per descrivere l'aspetto di una persona.
    target_text: است (è) / دارد (ha, 3ª persona)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Aspetto / fisionomia
    gloss: aspetto / fisionomia
    note: قیافه indica l'aspetto di una persona (per esempio خوش قیافه, "di bell'aspetto").
    example_gloss: Ha un bell'aspetto.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Come
    gloss: come
    note: چطور significa "come" (già visto all'inizio del corso, in saluti come چطور استین؟).
    target_text: چطور (come)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Il suo aspetto
    gloss: il suo aspetto
    note: قیافه‌اش unisce قیافه (aspetto) al suffisso possessivo ‌اش ("suo").
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: Che aspetto ha?
    gloss: Che aspetto ha?
    note: قیافه‌اش چطور است؟ è il modo naturale per chiedere che aspetto abbia qualcuno. Non si usa il solo چطور است؟, che da solo significa "Come sta?" (il saluto sul benessere e la salute).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: È alto/alta
    gloss: È alto/alta.
    note: Unisce او (lui/lei, già visto) a قد بلند است, presente in questa unità.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: Ha i capelli neri
    gloss: Ha i capelli neri.
    note: Unisce موی (capelli) con سیاه (nero) e دارد (ha).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: Ha la barba
    gloss: Ha la barba.
    note: Usa ریش دارد, la stessa struttura con "avere" vista sopra per i capelli neri.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Colore
    gloss: colore
    note: رنگ significa colore (già introdotto nel corso, nell'Unità 21 sui vestiti).
    target_text: رنگ (colore)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Blu
    gloss: blu
    note: آبی significa azzurro / blu.
    example_gloss: Ha gli occhi azzurri.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Marrone
    gloss: marrone
    note: قهوه‌ای significa marrone (si usa per il colore di capelli o occhi).
    example_gloss: Ha i capelli castani.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Colore degli occhi
    gloss: colore degli occhi
    note: 'رنگ چشم significa letteralmente "colore di occhio": رنگ (colore) + چشم (occhio).'
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Colore dei capelli
    gloss: colore dei capelli
    note: 'رنگ مو significa letteralmente "colore di capello": رنگ (colore) + مو (capelli).'
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Ha gli occhi azzurri
    gloss: Ha gli occhi azzurri.
    note: Applica آبی di questa lezione a چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Ha i capelli castani
    gloss: Ha i capelli castani.
    note: Applica قهوه‌ای di questa lezione a موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Fratello / tuo fratello
    gloss: fratello / tuo fratello (informale)
    note: برادر (fratello) è un ripasso dell'Unità 3; برادرت aggiunge il suffisso possessivo informale ‌ت ("tuo"), in linea con il registro informale di تو.
    target_text: برادر (fratello) / برادرت (tuo fratello, informale)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Sì / grazie / anche
    gloss: sì / grazie / anche
    note: بلی (sì), تشکر (grazie) e هم (anche) sono tutti ripassi di unità precedenti.
    target_text: بلی (sì) / تشکر (grazie) / هم (anche)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, che aspetto ha tuo fratello?'
    gloss: 'Homayoun: Zarmina, che aspetto ha tuo fratello?'
    note: Una domanda informale tra amici, con il possessivo -ت su برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: È alto e ha i capelli neri'
    gloss: 'Zarmina: È alto e ha i capelli neri.'
    note: Unisce due caratteristiche con و (e).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ha la barba?'
    gloss: 'Homayoun: Ha la barba?'
    note: Una domanda sì/no formata semplicemente con l'intonazione ascendente su ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sì, ha la barba e porta anche gli occhiali'
    gloss: 'Zarmina: Sì, ha la barba e porta anche gli occhiali.'
    note: Usa هم (anche) per una seconda caratteristica.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Bene, grazie'
    gloss: 'Homayoun: Bene, grazie.'
    note: خوب (bene) è una nuova semplice parola di chiusura; تشکر (grazie) è un ripasso.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Lettura sull'aspetto fisico
    gloss: Karim è alto. Ha i capelli neri e gli occhi castani. Non ha la barba, ma porta gli occhiali.
    note: Un breve brano di lettura che riprende le parole dell'unità sull'aspetto e introduce il nome del personaggio کریم (Karim, già presente nell'unità sui confronti) e ندارد (non ha, la forma negativa di دارد alla terza persona).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Ma
    gloss: ma
    note: اما significa ma (già visto in questa unità, nel brano di lettura della lezione 5; è anche un ripasso di unità precedenti).
    target_text: اما (ma)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Io sono / io ho
    gloss: io sono / io ho
    note: استم (io sono) e دارم (io ho) sono entrambi ripassi di unità precedenti, usati qui per descrivere il proprio aspetto in prima persona.
    target_text: استم (io sono) / دارم (io ho)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Sono basso, ma ho i capelli neri
    gloss: Sono basso/bassa, ma ho i capelli neri.
    note: Unisce due caratteristiche fisiche con اما.
