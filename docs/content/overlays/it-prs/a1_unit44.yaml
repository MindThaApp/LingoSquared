course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: separa i rifiuti domestici nel bidone giusto, chiedi in quale bidone va un oggetto e leggi un breve calendario con due giorni di raccolta. Parla di spazzatura, carta, plastica e vetro e conferma con un amico la raccolta differenziata nei bidoni verde e blu.'
units:
  prs.a1.unit44.waste_disposal:
    title: Differenziare i rifiuti
    description: Separa i rifiuti domestici nel bidone giusto, chiedi in quale bidone va un oggetto e comprendi un semplice calendario della raccolta dei rifiuti.
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: 'Vocabolario: rifiuti, bidone e plastica'
  prs.a1.unit44.lesson02.paper_and_glass:
    title: Carta, vetro e bidone blu
  prs.a1.unit44.lesson03.throwing_away_waste:
    title: Buttare i rifiuti
  prs.a1.unit44.lesson04.waste_sorting_dialogue:
    title: Dialogo sulla raccolta differenziata
  prs.a1.unit44.lesson05.reading:
    title: 'Lettura: Wahid e i rifiuti'
  prs.a1.unit44.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: 'Ripasso: è, in'
    gloss: è / in
    note: است e در (usati in tutto il corso) sono parole di ripasso che servono per dire dove si trova qualcosa.
    target_text: است (è) / در (in)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 'Ripasso: colore, verde, blu'
    gloss: colore / verde / blu
    note: رنگ, سبز e آبی sono parole di ripasso che servono per nominare i due bidoni dei rifiuti.
    target_text: رنگ (colore) / سبز (verde) / آبی (azzurro / blu)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Bidone
    gloss: bidone
    note: سطل è la parola dari di uso quotidiano per indicare un bidone o un secchio.
    example_gloss: Il bidone è verde.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Rifiuti / spazzatura
    gloss: rifiuti / spazzatura
    note: زباله significa rifiuti domestici o spazzatura.
    example_gloss: La spazzatura è nel bidone.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: Bidone verde
    gloss: bidone verde
    note: سطل سبز unisce سطل (bidone) e سبز (verde).
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plastica
    gloss: plastica
    note: پلاستیک è un prestito standard usato in tutte le varietà del persiano, dari compreso.
    example_gloss: La plastica è nel bidone blu.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: La spazzatura è nel bidone verde
    gloss: La spazzatura è nel bidone verde.
    note: زباله در سطل سبز است unisce le parole imparate prima in questa lezione.
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: 'Ripasso: quale, in, è'
    gloss: quale / in / è
    note: کدام, در e است sono parole di ripasso che servono per chiedere in quale bidone va un oggetto.
    target_text: کدام (quale) / در (in) / است (è)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: La carta
    gloss: la carta
    note: کاغذ è la parola dari di uso quotidiano per indicare la carta.
    example_gloss: La carta è nel bidone.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: Vetro
    gloss: vetro
    note: شیشه è la parola dari di uso quotidiano per indicare il vetro.
    example_gloss: Il vetro è nel bidone.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: Bidone blu
    gloss: bidone blu
    note: سطل آبی unisce سطل (bidone) e آبی (blu) e si usa per i materiali riciclabili come carta, plastica e vetro.
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: In quale bidone va la carta?
    gloss: In quale bidone va la carta?
    note: کاغذ در کدام سطل است؟ chiede in quale bidone va un oggetto.
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: La carta è nel bidone blu
    gloss: La carta è nel bidone blu.
    note: کاغذ در سطل آبی است risponde alla domanda indicando il bidone giusto.
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: Il vetro è nel bidone blu
    gloss: Il vetro è nel bidone blu.
    note: شیشه در سطل آبی است segue lo stesso schema della frase sulla carta.
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: 'Ripasso: segno dell''oggetto, butto/metto'
    gloss: (segno dell'oggetto) / butto / metto
    note: 'را e می‌اندازم (dall''Unità 36, dove significava «aggiungo il sale») sono parole di ripasso: انداختن copre davvero sia «aggiungere/mettere» sia «buttare/gettare».'
    target_text: را (marcatore dell'oggetto) / می‌اندازم (metto / butto)
  prs.a1.unit44.lesson03.teach.away_word:
    title: Via
    gloss: via
    note: دور (via) si combina con می‌اندازم nella costruzione standard دور انداختن («buttare via»).
    example_gloss: Lo butto via.
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: Butto via la spazzatura
    gloss: Butto via la spazzatura.
    note: زباله را دور می‌اندازم unisce زباله را, دور e می‌اندازم.
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: Metto la plastica nel bidone blu
    gloss: Metto la plastica nel bidone blu.
    note: پلاستیک را در سطل آبی می‌اندازم usa می‌اندازم nel senso di «mettere dentro».
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: Metto la carta nel bidone blu
    gloss: Metto la carta nel bidone blu.
    note: کاغذ را در سطل آبی می‌اندازم segue lo stesso schema con il bidone blu.
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: 'Ripasso: non butto/non metto'
    gloss: non butto / non metto
    note: نمی‌اندازم è la normale forma negativa di می‌اندازم, formata con نمی-.
    target_text: نمی‌اندازم (non metto / non butto)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: Non metto il vetro nel bidone verde
    gloss: Non metto il vetro nel bidone verde.
    note: شیشه را در سطل سبز نمی‌اندازم esprime una regola di differenziazione con la forma negativa.
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: Metto il vetro nel bidone blu
    gloss: Metto il vetro nel bidone blu.
    note: شیشه را در سطل آبی می‌اندازم indica l'azione corretta per il vetro.
  prs.a1.unit44.lesson04.teach.review_this:
    title: 'Ripasso: questo'
    gloss: questo
    note: این è una parola di ripasso usata nel dialogo.
    target_text: این (questo)
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: 'Ripasso: molto, bene, grazie mille, prego'
    gloss: molto / bene / grazie mille / prego
    note: بسیار, خوب, تشکر زیاد e خواهش می‌کنم sono parole di ripasso usate per chiudere il dialogo.
    target_text: بسیار (molto) / خوب (buono / bene) / تشکر زیاد (grazie mille) / خواهش می‌کنم (prego)
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria, in quale bidone metto questo vetro?'
    gloss: Shukria, in quale bidone metto questo vetro?
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: 'Shukria: Il vetro va nel bidone blu.'
    gloss: Il vetro va nel bidone blu.
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: 'Wahid: In quale bidone metto questa spazzatura?'
    gloss: In quale bidone metto questa spazzatura?
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: 'Shukria: La spazzatura va nel bidone verde.'
    gloss: La spazzatura va nel bidone verde.
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: 'Wahid: Molto bene. Grazie mille.'
    gloss: Molto bene. Grazie mille.
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: 'Shukria: Prego.'
    gloss: Prego.
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: 'Ripasso: Wahid, lui/lei, ogni giorno, anche, felice'
    gloss: Wahid / lui/lei / ogni giorno / anche / felice
    note: وحید, او, هر روز, هم e خوشحال sono parole di ripasso usate nel brano di lettura.
    target_text: وحید (Wahid) / او (lui/lei) / هر روز (ogni giorno) / هم (anche) / خوشحال (contento)
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: 'Ripasso: lui/lei butta'
    gloss: lui/lei butta / mette
    note: می‌اندازد è la forma della terza persona della famiglia می‌اندازم/نمی‌اندازم vista prima in questa unità.
    target_text: می‌اندازد (mette / butta)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: 'Lettura: Wahid e i rifiuti'
    gloss: Wahid butta via la spazzatura ogni giorno. La carta è nel bidone blu. Anche la plastica è nel bidone blu. La spazzatura è nel bidone verde. Wahid è felice.
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: 'Ripasso: lunedì, martedì, ma, Lei (formale)'
    gloss: lunedì / martedì / ma / Lei (formale)
    note: دوشنبه, سه‌شنبه, اما e شما sono parole di ripasso usate per esprimere un calendario con due voci.
    target_text: دوشنبه (lunedì) / سه‌شنبه (martedì) / اما (ma) / شما (Lei, forma di cortesia)
  prs.a1.unit44.lesson06.teach.collection_word:
    title: Raccolta
    gloss: raccolta
    note: جمع‌آوری significa raccolta e si usa per il giorno della raccolta dei rifiuti, proprio come in italiano «raccolta dei rifiuti».
    example_gloss: Il giorno della raccolta è lunedì.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: Il giorno della raccolta della carta è lunedì
    gloss: Il giorno della raccolta della carta è lunedì.
    note: روز جمع‌آوری کاغذ دوشنبه است indica l'oggetto e il suo giorno di raccolta.
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: Il giorno della raccolta dei rifiuti è martedì
    gloss: Il giorno della raccolta dei rifiuti è martedì.
    note: روز جمع‌آوری زباله سه‌شنبه است segue lo stesso schema per i rifiuti.
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: Carta lunedì, ma rifiuti martedì
    gloss: Il giorno della raccolta della carta è lunedì, ma il giorno della raccolta dei rifiuti è martedì.
    note: اما mette in contrasto i due giorni di raccolta.
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: 'Ripasso: tu butti / metti (formale)'
    gloss: voi buttate / mettete (formale)
    note: می‌اندازین è la forma di cortesia al plurale e segue la stessa desinenza -ین di می‌خواهین e کنین.
    target_text: می‌اندازین (Lei mette / butta, forma di cortesia)
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: Che giorno butta i rifiuti?
    gloss: Che giorno butta i rifiuti?
    note: La versione formale con شما per chiedere in quale giorno qualcuno butta i rifiuti.
