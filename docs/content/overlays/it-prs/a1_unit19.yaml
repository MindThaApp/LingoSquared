    example_gloss: Il tavolo è vicino alla finestra.
  prs.a1.unit19.lesson03.teach.is_word:
    title: È
    gloss: è
    note: است è la copula -- میز نزدیک کلکین است significa «il tavolo è vicino alla finestra».
    target_text: است (è)
  prs.a1.unit19.lesson04.teach.this_word:
    title: Questo
    gloss: questo
    note: این significa questo.
    target_text: این (questo)
  prs.a1.unit19.lesson04.teach.has_word:
    title: Ha
    gloss: ha
    note: دارد è la terza persona singolare del presente di داشتن (avere).
    target_text: دارد (ha -- terza persona)
  prs.a1.unit19.lesson04.teach.one_word:
    title: Uno
    gloss: uno
    note: یک significa uno.
    example_gloss: Ho una cucina.
  prs.a1.unit19.lesson04.teach.and_word:
    title: E
    gloss: e
    note: و significa «e» e unisce due frasi o due elementi.
    target_text: و (e)
  prs.a1.unit19.lesson04.teach.description_text:
    title: Una breve descrizione di una casa
    gloss: Questa casa ha due camere da letto. Ha una cucina e un bagno.
    note: Una breve descrizione in terza persona che indica il numero delle stanze.
  prs.a1.unit19.lesson05.teach.big_word:
    title: Grande
    gloss: grande
    note: بزرگ significa grande; il corso l'ha già introdotto con il comparativo بزرگ‌تر nell'unità sui confronti.
    example_gloss: La cucina è grande.
  prs.a1.unit19.lesson05.teach.across_from_word:
    title: Di fronte a
    gloss: di fronte a
    note: مقابل significa di fronte a o dirimpetto a.
    target_text: مقابل (di fronte a)
  prs.a1.unit19.lesson05.teach.longer_description_text:
    title: Una descrizione più lunga di una casa
    gloss: Questa casa ha due camere da letto. Ha una cucina e un bagno. La cucina è grande. Il tavolo è di fronte alla finestra.
    note: La stessa descrizione della lezione precedente, ampliata con informazioni su dimensioni e posizione.
  prs.a1.unit19.lesson06.teach.names:
    title: Laila e Feridoon
    gloss: Laila, Feridoon
    note: Personaggi che ricorrono in questo corso.
    example_gloss:
    - Io sono Laila.
    - Io sono Feridoon.
  prs.a1.unit19.lesson06.teach.you_word:
    title: Lei (formale)
    gloss: Lei
    note: شما è il pronome di seconda persona di cortesia.
    target_text: شما (Lei -- formale)
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: Quanti
    gloss: quanti
    note: چند significa quanti.
    target_text: چند (quanti)
  prs.a1.unit19.lesson06.teach.yes_word:
    title: Sì
    gloss: sì
    note: بلی è la parola cortese/formale per «sì», in linea con il registro di questo corso.
    example_gloss: Sì, è grande.
  prs.a1.unit19.lesson06.teach.dialogue_line1:
    title: Feridoon chiede
    gloss: Quante stanze ha la Sua casa?
  prs.a1.unit19.lesson06.teach.dialogue_line2:
    title: Laila risponde
    gloss: Ha due camere da letto.
  prs.a1.unit19.lesson06.teach.dialogue_line3:
    title: Feridoon chiede
    gloss: La cucina è grande?
  prs.a1.unit19.lesson06.teach.dialogue_line4:
    title: Laila risponde
    gloss: Sì, è grande.
