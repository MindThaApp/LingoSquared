  prs.a1.unit19.lesson06.home_dialogue:
    title: Un dialogo sulla casa di qualcuno
teaching:
  prs.a1.unit19.lesson01.teach.house_word:
    title: Casa
    gloss: casa
    note: خانه significa casa (sia l'edificio sia la propria abitazione).
    example_gloss: Ho una casa.
  prs.a1.unit19.lesson01.teach.room_word:
    title: Stanza
    gloss: stanza
    note: اتاق significa stanza.
    example_gloss: Ho una camera.
  prs.a1.unit19.lesson01.teach.sleep_word:
    title: Dormire
    gloss: sonno
    note: خواب significa sonno -- اتاق خواب significa letteralmente «stanza del sonno», cioè camera da letto.
    example_gloss: Ho una camera.
  prs.a1.unit19.lesson01.teach.kitchen_word:
    title: Cucina
    gloss: cucina
    note: آشپزخانه significa cucina.
    example_gloss: Ho una cucina.
  prs.a1.unit19.lesson01.teach.bathroom_word:
    title: Bagno
    gloss: bagno
    note: تشناب è il termine standard del dari afghano per bagno/toilette, diverso da دستشویی del persiano dell'Iran.
    example_gloss: Ho un bagno.
  prs.a1.unit19.lesson01.teach.have_word:
    title: Ho
    gloss: ho
    note: دارم è la prima persona singolare del presente di داشتن (avere).
    target_text: دارم (ho)
  prs.a1.unit19.lesson02.teach.table_word:
    title: Tavolo
    gloss: tavolo
    note: میز significa tavolo.
    example_gloss: Ho un tavolo.
  prs.a1.unit19.lesson02.teach.chair_word:
    title: Sedia
    gloss: sedia
    note: چوکی è il termine standard del dari afghano per sedia, diverso da صندلی del persiano dell'Iran.
    example_gloss: Ho una sedia.
  prs.a1.unit19.lesson02.teach.bed_word:
    title: Letto
    gloss: letto
    note: تخت significa letto.
    example_gloss: Ho un letto.
  prs.a1.unit19.lesson02.teach.window_word:
    title: Finestra
    gloss: finestra
    note: کلکین è il termine standard del dari afghano per finestra, diverso da پنجره del persiano dell'Iran.
    example_gloss: Ho una finestra.
  prs.a1.unit19.lesson03.teach.two_word:
    title: Due
    gloss: due
    note: دو significa due.
    example_gloss: Ho due stanze.
  prs.a1.unit19.lesson03.teach.three_word:
    title: Tre
    gloss: tre
    note: سه significa tre.
    example_gloss: Ho tre stanze.
