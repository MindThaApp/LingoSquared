course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: le stanze di base (camera da letto, cucina, bagno), gli oggetti di casa (tavolo, sedia, letto, finestra), come unire quantità e posizione, la lettura di una breve e poi di una più lunga descrizione di una casa e un dialogo in cui si chiede della casa di qualcuno.'
units:
  prs.a1.unit19.housing:
    title: Abitazione
    description: Descrivere una casa semplice, le stanze, gli oggetti di casa e la posizione.
