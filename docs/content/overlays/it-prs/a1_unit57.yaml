  prs.a1.unit57.lesson01.teach.beach_word:
    title: Spiaggia
    gloss: spiaggia / riva
    note: '*ساحل* è la parola standard in dari e in farsi per spiaggia, riva o costa. Poiché l''Afghanistan non ha sbocco sul mare, in questo corso la usiamo per la riva sabbiosa di un lago o di un fiume, una meta molto comune per una gita in giornata.'
