    - شهر
    - کار
    accepted_answers:
    - value: هرات
      status: correct
    feedback: هرات è una città; افغانستان è il paese e شهر è la parola generica per «città».
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
