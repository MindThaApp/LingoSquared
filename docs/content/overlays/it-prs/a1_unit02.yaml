      status: correct
    feedback: شما از کجا استین؟ chiede la provenienza, con از (da) e کجا (dove).
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: Quale di queste è una città dell'Afghanistan?
    correct_option: هرات
    distractors:
