  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: Quale espressione chiede di dove è qualcuno?
    correct_option: Di dov'è Lei?
    distractors:
    - Che lavoro fa?
    - Come si chiama?
    - Come sta? (formale)
    accepted_answers:
