      status: correct
    feedback: نام‌تان چیست؟ è la forma rispettosa per una persona appena conosciuta.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ va bene per chiedere il nome a...
    correct_option: un caro amico
    distractors:
    - uno sconosciuto appena incontrato
    - un anziano a un evento formale
    - un cliente del tuo negozio
    accepted_answers:
    - value: un caro amico
      status: correct
    feedback: Il possessivo informale -ت in نامت si usa solo con un caro amico o un coetaneo, come la regola di تو/استی nell'Unità 1.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
