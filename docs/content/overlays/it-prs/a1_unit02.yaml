course:
  title: Italiano–Dari A1
  description: 'Dari afghano per principianti: scambiarsi i nomi, dire da dove si viene e che lavoro si fa, presentare una terza persona e usare correttamente titoli e registro di cortesia in un primo incontro.'
units:
  prs.a1.unit02.introductions:
    title: Presentazioni e conoscenze
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Chiedere e dire il proprio nome
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Chiedere della città e del paese d'origine
  prs.a1.unit02.lesson03.occupation:
    title: Chiedere il lavoro a qualcuno
  prs.a1.unit02.lesson04.introducing_others:
    title: Presentare una terza persona
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Usare i titoli di cortesia e il registro giusto
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Conoscere persone a un ritrovo
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Chiedere il nome a qualcuno con cortesia
    gloss: Come si chiama?
    note: نام‌تان چیست؟ è la forma rispettosa per una persona adulta appena conosciuta e continua il registro شما/استین dell'Unità 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Dire il proprio nome con است
    gloss: Mi chiamo Faridun.
    note: نام من ... است è il modo scritto di dire il proprio nome. Nella conversazione si dice di solito نامم ... است (نامم = نام + -م, il mio nome). Entrambe le forme sono corrette.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Dire il proprio nome con استم
    gloss: Sono Faridun.
    note: استم segue direttamente il nome; è la stessa copula della prima persona dell'Unità 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Chiedere il nome a un amico stretto
    gloss: Come ti chiami?
    note: نامت چیست؟ usa il possessivo informale -ت. Usalo solo con un coetaneo o un amico stretto, proprio come تو/استی nell'Unità 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: La parola per «nome»
    gloss: nome
    note: نام è il sostantivo che compare da solo sia nella domanda formale sia in quella informale viste sopra.
    example_gloss: Come ti chiami?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Possessivo formale e possessivo per amici stretti
    gloss: -تان per chi rispetti con il Lei; -ت per un amico stretto.
    note: La stessa distinzione di registro dell'Unità 1 (شما/تو) si ritrova nelle desinenze possessive di نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Chiedere di dove è qualcuno
    gloss: Di dov'è Lei?
    note: شما از کجا استین؟ mantiene l'abbinamento rispettoso شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Dire che sei di Kabul
    gloss: Sono di Kabul.
    note: من از کابل استم segue lo schema من از [luogo] استم, valido per qualsiasi città.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Dire che sei di Herat
    gloss: Sono di Herat.
    note: هرات è una grande città dell'Afghanistan occidentale.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Dire che sei di Mazar-i-Sharif
    gloss: Sono di Mazar-i-Sharif.
    note: مزار شریف si scrive in due parole ed è una grande città dell'Afghanistan settentrionale.
  prs.a1.unit02.lesson02.teach.country:
    title: Afghanistan
    gloss: Afghanistan
    note: افغانستان si usa dopo از proprio come il nome di una città.
    example_gloss: Vengo dall'Afghanistan.
  prs.a1.unit02.lesson02.teach.city_word:
    title: La parola per «città»
    gloss: città
    note: شهر indica la città in generale, a differenza del nome di una città specifica.
    example_gloss: Kabul è una grande città.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Chiedere che lavoro fa qualcuno
    gloss: Che lavoro fa?
    note: کار شما چیست؟ significa letteralmente «qual è il suo lavoro?» ed è il modo normale di chiedere la professione.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Medico
    gloss: medico
    note: داکتر è il termine dari comune per «medico» e, in modo informale, anche per chi ha un dottorato.
    example_gloss: Lui/lei è medico.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Insegnante
    gloss: insegnante
    note: معلم è il termine generico per «insegnante» a qualsiasi livello scolastico.
    example_gloss: È un insegnante.
  prs.a1.unit02.lesson03.teach.engineer:
    title: Ingegnere
    gloss: ingegnere
    note: مهندس indica gli ingegneri in generale, senza specificare una disciplina.
    example_gloss: Lui/lei è ingegnere.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Negoziante
    gloss: negoziante
    note: دوکاندار (da دوکان, negozio) è il termine quotidiano di Kabul; questo corso usa l'ortografia dari دوکان e non il مغازه del persiano iraniano.
    example_gloss: È un negoziante.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Dire la propria professione
    gloss: Sono un'insegnante.
    note: من [professione] استم è lo schema valido per qualsiasi professione presentata in questa lezione.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Presentare qualcuno in modo formale
    gloss: Mi permetta di presentarle il mio collega.
    note: اجازه بدهین همکارم را معرفی کنم è un modo rispettoso di coinvolgere una terza persona nella conversazione.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Dire il nome della persona che presenti
    gloss: Questa è la mia collega Arezoo.
    note: این [persona] است indica direttamente chi viene presentato.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Dire che sei felice di conoscere qualcuno
    gloss: Piacere.
    note: از آشنایی با شما خوش شدم è la stessa formula di primo incontro dell'Unità 1, qui riutilizzata dopo la presentazione di una terza persona.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Rispondere che anche tu sei felice
    gloss: Piacere mio.
    note: من هم خوش شدم è la risposta breve e naturale.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Amico
    gloss: amico
    note: دوست è una parola generica per «amico», che non specifica il grado di confidenza.
    example_gloss: È un mio amico.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Collega
    gloss: collega
    note: همکار indica chi lavora con te, già incontrato nel dialogo sul lavoro dell'Unità 1.
    example_gloss: È un mio collega.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Signor / Signore
    gloss: signor / signore
    note: جناب precede il nome o il titolo di un uomo come forma di rispetto ed è comune nell'uso urbano afghano quotidiano.
    example_gloss: Signore, prego, si accomodi.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Signora
    gloss: signora
    note: خانم precede il nome di una donna e si usa indipendentemente dallo stato civile.
    example_gloss: Signora, prego, si accomodi.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Rivolgersi a un uomo con cortesia
    gloss: Signor Faridun
    note: جناب più il nome proprio è una forma di cortesia comune e non richiede necessariamente il cognome.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Rivolgersi a una donna con cortesia
    gloss: Signora Arezoo
    note: خانم più il nome proprio funziona come جناب per un uomo.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Quando usare ciascun registro
    gloss: Usa شما e استین con chi hai appena conosciuto; usa تو e استی solo con un amico stretto.
    note: Ripete la regola sul registro dell'Unità 1, applicandola direttamente alle presentazioni.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Chiedere con cortesia di ripetere il nome
    gloss: Potrebbe ripetere il suo nome?
    note: می‌توانین نام‌تان را دوباره بگویین؟ è un modo naturale e cortese di chiedere di ripetere, senza creare imbarazzo.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Ritrovo / festa
    gloss: ritrovo
    note: مهمانی indica un ritrovo sociale informale, ambientazione del dialogo di questa lezione.
    example_gloss: Il ritrovo è piacevole.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila inizia le presentazioni
    gloss: Leila saluta Faridun e gli chiede il nome, rivolgendosi a lui con rispetto con جناب.
    note: Leila e Faridun non si conoscono, quindi lei usa fin dall'inizio il registro rispettoso.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun dice il suo nome
    gloss: Faridun ricambia il saluto e dice il suo nome.
    note: سلام علیکم è il saluto più completo dell'Unità 1, adatto a un primo incontro. Nella conversazione Faridun dice نامم فریدون است (نامم = نام من, il mio nome), la forma parlata di tutti i giorni.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila gli chiede di dove è
    gloss: Leila dice di essere lieta di conoscerlo e gli chiede di dove è.
    note: La stessa formula از آشنایی با شما خوش شدم arriva dal dialogo sul lavoro dell'Unità 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun risponde e rigira la domanda
    gloss: Faridun dice di essere di Herat e rivolge la stessa domanda a Leila.
    note: و شما؟ rigira la domanda in modo sintetico, come visto nell'Unità 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila risponde e chiede del lavoro
    gloss: Leila dice di essere di Kabul e chiede a Faridun che lavoro fa.
    note: La conversazione passa naturalmente dalla provenienza alla professione.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun risponde e rigira la domanda
    gloss: Faridun dice di essere ingegnere e rivolge la stessa domanda a Leila.
    note: شما چطور؟ è un modo breve di rigirare una domanda già chiara dal contesto.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila dice la sua professione
    gloss: Leila dice di essere insegnante.
    note: Conclude lo scambio sulla professione con lo schema visto prima nell'unità.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun presenta una terza persona
    gloss: Faridun presenta la sua collega Arezoo.
    note: Qui entra in scena un terzo partecipante, con la formula di presentazione formale della lezione 4.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila dà il benvenuto ad Arezoo
    gloss: Leila dà il benvenuto ad Arezoo, rivolgendosi a lei con rispetto con خانم.
    note: خوش آمدین è la formula di benvenuto dell'Unità 1, qui rivolta a una persona appena presentata.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo risponde
    gloss: Arezoo ringrazia Leila e dice di essere felice di conoscerla.
    note: از دیدن شما خوشحال شدم è una variante naturale della formula «piacere di conoscerti», con دیدن (vedere) al posto di آشنایی.
exercises:
