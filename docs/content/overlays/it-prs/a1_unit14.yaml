  prs.a1.unit14.lesson06.preferences_dialogue:
    title: Un dialogo sulle preferenze
teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: mi piace
    gloss: mi piace
    note: دوست دارم significa letteralmente «ho amicizia (con questo)» ed è il modo normale per dire «mi piace».
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: Caffè
    gloss: caffè
    note: قهوه significa «caffè».
    example_gloss: Mi piace il caffè.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: Tè
    gloss: tè
    note: چای significa «tè».
    example_gloss: Non mi piace il tè.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: non mi piace
    gloss: non mi piace
    note: دوست ندارم è la forma negativa di دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: io
    gloss: io
    note: من è il pronome personale di prima persona, usato da solo.
    example_gloss: Mi piace il caffè.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (marca dell'oggetto)
    gloss: (segna il complemento oggetto del verbo)
    note: را segna il complemento oggetto diretto determinato. In dari si usa sia nel parlato quotidiano sia nello scritto; la forma رو, tipica dell'iraniano, non si usa.
    target_text: را (marca dell'oggetto)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Quale
    gloss: quale
    note: کدام significa «quale» (tra più cose).
    example_gloss: Quale ti piace?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: La musica
    gloss: musica
    note: موسیقی significa «musica».
    example_gloss: Mi piace la musica.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: Lei ha / Le piace (formale)
    gloss: avete / vi piace
    note: دارین è la forma di seconda persona di cortesia/plurale del verbo داشتن (avere), coerente con il registro di cortesia di questo corso, basato su استم/استین.
    target_text: دارین (Lei ha/Le piace, formale)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: Quale ti piace?
    gloss: Quale ti piace?
    note: کدام را دوست دارین؟ – را segna l'oggetto, qui la cosa che stai scegliendo.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: Più
    gloss: più
    note: بیشتر significa «di più».
    example_gloss: Mi piace di più il caffè.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: O
    gloss: o
    note: یا significa «o» e si usa per proporre una scelta tra due cose.
    target_text: یا (o)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: Caffè o tè?
    gloss: Caffè o tè?
    note: قهوه یا چای؟ propone una scelta tra le due bevande della lezione 1.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Perché
    gloss: perché
    note: چون introduce una causa o un motivo.
    target_text: چون (perché)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: È delizioso
    gloss: è delizioso
    note: 'خوش‌مزه است è la forma completa, non contratta («è delizioso»): in questo corso است resta separato e non si contrae.'
    example_gloss: Mi piace il caffè perché è delizioso.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: È interessante
    gloss: è interessante
    note: جالب است è la forma completa, non contratta («è interessante»).
    example_gloss: Mi piace la musica perché è interessante.
  prs.a1.unit14.lesson04.teach.va_word:
    title: E
    gloss: e
    note: و significa «e» e unisce due frasi o due elementi.
    target_text: و (e)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: Negar
    gloss: Negar
    note: Un nome femminile afghano molto comune.
    example_gloss: A Negar piace il tè.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: Gli/le piace
    gloss: gli/le piace
    note: 'دارد è la forma completa di terza persona di داشتن (avere): دوست دارد significa «gli/le piace», sul modello di دوست دارم alla prima persona.'
    target_text: دوست دارد (gli/le piace, forma completa della 3ª persona)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: Non gli/le piace
    gloss: non gli/le piace
    note: 'ندارد è la forma negativa completa di terza persona: دوست ندارد significa «non gli/le piace».'
    target_text: دوست ندارد (non gli/le piace, forma completa della 3ª persona)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: È caldo
    gloss: è caldo
    note: گرم است è la forma completa, non contratta («è caldo»).
    example_gloss: A Negar piace il tè perché è caldo.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: Testo di esempio sulle preferenze
    gloss: A Negar piace il tè perché è caldo. A Negar non piace la musica.
    note: Un breve racconto in terza persona che riunisce il lessico delle preferenze di questa unità.
  prs.a1.unit14.lesson06.teach.names:
    title: Karim e Negar
    gloss: Karim, Negar
    note: Nomi afghani comuni, usati in tutto il corso.
    example_gloss:
    - Sono Karim.
    - Sono Negar.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: E Lei?
    gloss: E Lei?
    note: شما چطور؟ è il modo cortese per restituire la domanda all'altra persona, coerente con il registro di cortesia della famiglia di استین.
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: È ottimo
    gloss: è ottimo
    note: عالی است è la forma completa, non contratta («è ottimo»).
    example_gloss: Il caffè è ottimo.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: Karim chiede
    gloss: 'Tè o caffè: quale Le piace di più?'
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Negar risponde
    gloss: Mi piace di più il caffè perché è delizioso. E Lei?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Karim risponde
    gloss: A me piace il tè perché è caldo.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Negar reagisce
    gloss: Ottimo!
