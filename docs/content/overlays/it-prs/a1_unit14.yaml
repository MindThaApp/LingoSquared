course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: esprimere gusti e preferenze, chiedere cosa piace, scegliere tra due opzioni, dare semplici motivazioni e leggere un breve dialogo sulle preferenze di due persone.'
units:
