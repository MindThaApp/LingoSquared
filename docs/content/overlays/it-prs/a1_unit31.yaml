  prs.a1.unit31.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Istruzione
    gloss: istruzione / studi
    note: تحصیل significa istruzione o studi in generale, ed è la parola che dà il tema a questa unità.
    example_gloss: L'istruzione è una cosa buona.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Università
    gloss: università
    note: 'پوهنتون significa università: è la parola standard in Afghanistan (come nel nome dell''Università di Kabul), diversa dall''iraniano دانشگاه.'
    example_gloss: L'università è a Kabul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: Scuola
    gloss: scuola
    note: مکتب significa scuola.
    example_gloss: Questa scuola è buona.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Corso di studi
    gloss: corso di studi / indirizzo
    note: رشته significa corso di studi o indirizzo universitario, una parola standard comune al persiano e al dari.
    example_gloss: Il mio corso di studi è medicina.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Studente
    gloss: studente
    note: 'محصل significa studente universitario: è il termine standard del dari afghano, diverso dall''iraniano دانشجو.'
    example_gloss: Lui/Lei è uno studente / una studentessa.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Lezione
    gloss: lezione
    note: درس significa lezione e si usa con خواندن (leggere) per formare l'espressione composta che vuol dire «studiare».
    example_gloss: Studio ogni giorno.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Studiare
    gloss: lezione + leggere → studio
    note: 'درس (lezione) si combina con خواندن (leggere) e forma درس می‌خوانم (studio): letteralmente «leggo una lezione», un modello di verbo composto davvero nuovo per questo corso.'
    target_text: درس (lezione) + خواندن (leggere, studiare) = درس می‌خوانم (studio)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Studio all'università
    gloss: Studio all'università.
    note: Unisce من (io, ripasso), در (a/in, ripasso), پوهنتون e درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Medicina
    gloss: medicina
    note: طب significa medicina come corso di studi, una parola standard comune al persiano e al dari.
    example_gloss: Medicina è difficile.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Giurisprudenza
    gloss: giurisprudenza
    note: حقوق significa giurisprudenza come corso di studi, una parola standard comune al persiano e al dari.
    example_gloss: Giurisprudenza è interessante.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Economia
    gloss: economia
    note: اقتصاد significa economia come corso di studi, una parola standard comune al persiano e al dari.
    example_gloss: Anche economia è difficile.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Letteratura
    gloss: letteratura
    note: ادبیات significa letteratura come corso di studi, una parola standard comune al persiano e al dari.
    example_gloss: Mi piace la letteratura.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Il mio corso di studi è medicina
    gloss: Il mio corso di studi è medicina.
    note: Unisce رشته من (il mio corso di studi, ripasso) con است (è), introdotto qui per la prima volta.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Studio medicina
    gloss: Studio medicina.
    note: Applica من ... می‌خوانم (studio, ripasso) direttamente al nome di un corso di studi, per esempio طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Dove
    gloss: dove
    note: کجا significa dove.
    target_text: کجا (dove)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Tu studi (formale)
    gloss: Lei studia
    note: درس می‌خوانین è la forma di cortesia di «tu studi / Lei studia» e segue il modello verbale formale in -ین già visto (per esempio استفاده می‌کنین dell'Unità 30).
    target_text: درس می‌خوانین (voi/Lei studia, formale)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Dove studi?
    gloss: Dove studia Lei?
    note: Unisce شما (Lei, forma di cortesia, ripasso), کجا (dove), درس e می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Studio all'Università di Kabul
    gloss: Studio all'Università di Kabul.
    note: Unisce من در ... درس می‌خوانم (studio a ..., ripasso) con پوهنتون کابل (Università di Kabul).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: Lui/lei studia
    gloss: lui/lei studia
    note: درس می‌خواند è la forma della 3ª persona, secondo lo schema già noto dei verbi in -د (per esempio استفاده می‌کند dell'Unità 30).
    target_text: درس می‌خواند (lui/lei studia, 3ª persona)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Tu / tu studi (informale)
    gloss: tu / tu studi
    note: تو e می‌خوانی sono il registro informale usato tra Karim e Parwin.
    target_text: تو (tu, informale) / می‌خوانی (tu studi, informale)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, dove studi?'
    gloss: Parwin, dove studi?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: Studio all''Università di Kabul. Il mio indirizzo di studi è medicina.'
    gloss: Studio all'Università di Kabul. Il mio indirizzo di studi è medicina.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: Medicina è difficile?'
    gloss: Medicina è difficile?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Sì, è difficile ma interessante. E tu?'
    gloss: Sì, è difficile ma interessante. E tu?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: Io studio a scuola.'
    gloss: Io studio a scuola.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: Fantastico!'
    gloss: Fantastico!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Lettura sull'istruzione
    gloss: Parwin studia all'Università di Kabul. Il suo indirizzo di studi è medicina. Medicina è difficile ma interessante. Karim studia a scuola.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Mi piace / tempo / non ho
    gloss: mi piace / tempo / non ho
    note: دوست دارم (mi piace), وقت (tempo) e ندارم (non ho) sono tutti ripasso delle Unità 11, 14, 26, 29 e 30.
    target_text: دوست دارم (mi piace) / وقت (tempo) / ندارم (non ho)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Mi piace studiare, ma non ho tempo
    gloss: Mi piace studiare, ma non ho tempo.
    note: Unisce تحصیل را دوست دارم (mi piace lo studio, costruzione già vista) con اما وقت ندارم (ma non ho tempo).
