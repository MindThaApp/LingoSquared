course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: il lessico dell''istruzione e dello studio (università, scuola, corso di studi, studente, lezione), come indicare il proprio corso di studi (medicina, giurisprudenza, economia, letteratura), come chiedere e dire dove si studia e un dialogo tra Karim e Parwin sugli studi e su come li vivono.'
units:
  prs.a1.unit31.education:
    title: Istruzione
    description: Parla di cosa studi, dove studi e di come ti senti a riguardo.
