teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Ripasso: questo, è, in, bene/buono'
    gloss: questo / è / in / buono
    note: Sono parole di ripasso (usate in tutto il corso) per parlare del concerto.
    target_text: این (questo) / است (è) / در (in) / خوب (buono)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Concerto
    gloss: concerto
    note: È la parola dari moderna di uso standard per «concerto», un prestito da lingue europee, come *موزیم* (museo).
    example_gloss: Questo concerto è bello.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Cantante
    gloss: cantante
    note: È la parola dari moderna, semplice e comune, per «cantante». Esiste anche un'alternativa più classica, *آوازخوان*, ma è meno usata nel parlato quotidiano.
    example_gloss: Il cantante è al concerto.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: Questo è un concerto
    gloss: Questo è un concerto.
    note: Unisce «questo», «è» e «concerto» come il corso ha già fatto con queste parole in altri punti.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: Il cantante è al concerto
    gloss: Il cantante è al concerto.
    note: Unisce «cantante», «in» e «concerto».
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Ripasso: quanto, afghani, è, trenta, ora, otto, sera, avviene, in, biglietto'
    gloss: quanto / afghani / è / trenta / ore / otto / sera / avviene / in / biglietto
    note: Sono parole di ripasso (dalle unità precedenti) per parlare dell'orario di inizio e del prezzo del concerto.
    target_text: چند (quanto) / افغانی (afghani) / است (è) / سی (trenta) / ساعت (ora / alle) / هشت (otto) / شب (sera) / می‌شود (diventa / fa) / در (in) / تکت (biglietto)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Inizio
    gloss: inizio
    note: Si combina con *می‌شود* («avviene») per dire «inizia», con lo stesso schema di verbo composto che il corso ha già usato altrove.
    example_gloss: Il concerto inizia alle otto di sera.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Sima
    gloss: Sima
    note: Sima è un nome proprio afghano comune, qui usato per la cantante del concerto.
    example_gloss: Sima è una cantante.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: Leggere la locandina del concerto
    gloss: Sima è una cantante. Il concerto inizia alle otto di sera. Il biglietto costa 30 afghani.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Ripasso: quando'
    gloss: quando
    note: È una parola di ripasso usata per chiedere quando inizia il concerto.
    target_text: کی (quando)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: Quando inizia il concerto?
    gloss: Quando inizia il concerto?
    note: Unisce le parole imparate prima in questa lezione.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: Il concerto inizia alle otto di sera
    gloss: Il concerto inizia alle otto di sera.
    note: Indica l'orario di inizio del concerto, come sulla locandina.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Ripasso: volete (forma di cortesia), venerdì, andiamo'
    gloss: volete (cortesia) / venerdì / andiamo
    note: Sono parole di ripasso usate per proporre un programma, con lo stesso schema che il corso ha già stabilito per proporre una gita al parco.
    target_text: می‌خواهین (vuole, forma di cortesia) / جمعه (venerdì) / برویم (andiamo)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Ripasso: concerto'
    gloss: concerto
    note: È una parola di ripasso usata per proporre di andare al concerto.
    target_text: کنسرت (concerto)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: Vuole andare al concerto venerdì?
    gloss: Vuole andare al concerto venerdì?
    note: Riprende lo schema per proporre un programma già stabilito in questo corso, applicato al concerto.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Ripasso: sì, ottimo, d''accordo'
    gloss: sì / ottimo / d'accordo
    note: Sono parole di ripasso usate per accettare un programma.
    target_text: بلی (sì) / عالی (ottimo) / قبول (d'accordo)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: Sì, ottimo! D'accordo.
    gloss: Sì, ottimo! D'accordo.
    note: Serve ad accettare il programma proposto per il concerto.
