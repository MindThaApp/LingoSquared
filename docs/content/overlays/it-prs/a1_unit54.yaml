    target_text: سلام (salve) / یک (uno / un) / تکت (biglietto) / می‌خواهم (voglio)
  prs.a1.unit54.lesson04.teach.review_welcome_concert_start:
    title: 'Ripasso: prego (nel porgere qualcosa), concerto, Sima, ore, otto, sera, inizia'
    gloss: prego, ecco / concerto / Sima / ore / otto / sera / inizia
    note: Sono parole di ripasso usate per indicare l'orario di inizio del concerto.
    target_text: بفرمایین (prego / ecco) / کنسرت (concerto) / سیما (Sima) / ساعت (ora / alle) / هشت (otto) / شب (sera) / شروع می‌شود (inizia)
  prs.a1.unit54.lesson04.teach.review_ask_price:
