course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: lessico di denaro e pagamento, come chiedere il metodo di pagamento, il cambio di valuta presso un صرافی (cambiavalute) e un dialogo tra Zarmina e Homayoun che cambiano dollari in afghani.'
units:
  prs.a1.unit23.money:
    title: Il denaro
    description: Cavartela in situazioni di base legate al denaro, come cambiare valuta, pagare e chiedere come si paga.
lessons:
  prs.a1.unit23.lesson01.money_vocabulary:
    title: Parole del denaro
  prs.a1.unit23.lesson02.payment_method:
    title: Metodo di pagamento
  prs.a1.unit23.lesson03.currency_exchange:
    title: Cambio di valuta
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: Dal cambiavalute
  prs.a1.unit23.lesson05.reading_receipt:
    title: Leggere uno scontrino
  prs.a1.unit23.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: Il denaro
    gloss: denaro
    note: پول significa «denaro».
    example_gloss: Ho dei soldi.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Contanti
    gloss: in contanti
    note: نقد significa «contanti».
    example_gloss: Pago in contanti.
  prs.a1.unit23.lesson01.teach.kart:
    title: Carta
    gloss: carta
    note: کارت significa «carta» (carta di pagamento).
    example_gloss: Ho una carta.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Dollaro
    gloss: dollaro
    note: 'دالر significa «dollaro» (USD): è molto diffuso e viene quotato accanto all''afghani nel cambio valuta quotidiano in Afghanistan.'
    example_gloss: Ho cento dollari.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: Ho
    gloss: ho
    note: دارم significa «ho» (già introdotto nell'Unità 10, sugli acquisti).
    example_gloss: Ho dei soldi.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Cento
    gloss: cento
    note: 'صد significa «cento»: già introdotto nell''Unità 4 sui numeri e riusato nell''Unità 10 sugli acquisti.'
    example_gloss: Ho cento dollari.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Pago
    gloss: pago
    note: می‌پردازم significa «pago».
    example_gloss: Pago in contanti.
  prs.a1.unit23.lesson02.teach.ya:
    title: O
    gloss: o
    note: یا significa «o».
    example_gloss: Pago in contanti o con la carta.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Contanti o carta?
    gloss: Paga in contanti o con la carta?
    note: Una domanda frequente in un negozio o allo sportello di un cambiavalute.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Posso
    gloss: posso
    note: می‌توانم significa «posso» (già introdotto in precedenza nel corso).
    example_gloss: Posso pagare in contanti.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Pagare
    gloss: pagare
    note: 'بپردازم è la forma congiuntiva di «pagare», usata dopo می‌توانم (posso): می‌توانم نقد بپردازم significa letteralmente «posso pagare in contanti».'
    example_gloss: Posso pagare in contanti.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Cambiavalute
    gloss: cambiavalute
    note: صرافی è la vera e comune istituzione afghana per il cambio di valuta, distinta dalla بانک (banca) formale.
    example_gloss: Vado dal cambiavalute.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: Cambiare
    gloss: cambiare (valuta)
    note: تبدیل کردن significa «cambiare» (valuta).
    example_gloss: Cambio dollari in afghani.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Tasso di cambio
    gloss: tasso di cambio
    note: نرخ significa «tasso» / «tasso di cambio».
    example_gloss: Qual è il cambio del dollaro oggi?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: Qual è il cambio di oggi?
    gloss: Qual è il cambio del dollaro oggi?
    note: Il modo standard per chiedere il tasso di cambio.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Afghani
    gloss: afghani
    note: افغانی è la valuta dell'Afghanistan (già introdotta nell'Unità 10 sugli acquisti, ad es. «صد افغانی»).
    example_gloss: Ho cento afghani.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'Ripasso: è, oggi, quanto'
    gloss: è / oggi / quanto
    note: است, امروز e چند sono parole di ripasso (già viste in precedenza nel corso), combinate nella domanda sul cambio di questa lezione.
    example_gloss: Qual è il cambio del dollaro oggi?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Ripasso: a, segno dell''oggetto, faccio, fare, voglio'
    gloss: a / segno dell'oggetto / faccio / fare / voglio
    note: به, را, می‌کنم, کنم e می‌خواهم sono parole di ripasso (già viste in precedenza nel corso), combinate nelle frasi di questa lezione sul cambio.
    example_gloss: Voglio cambiare dollari in afghani.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: voglio
    gloss: voglio
    note: می‌خواهم significa «voglio» (già visto nelle unità precedenti).
    example_gloss: Voglio cambiare dei dollari.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: Quanti ne ha?
    gloss: Quanti dollari ha?
    note: دارین è la forma di cortesia/plurale di «avere», rivolta al cliente.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Ecco a Lei
    gloss: ecco a Lei
    note: بفرمایین è una formula di cortesia usata quando si porge qualcosa.
    example_gloss: Ecco a Lei, settemila afghani.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Mille
    gloss: mille
    note: هزار significa «mille».
    example_gloss: Settemila afghani.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه, il personaggio fisso del corso.
    example_gloss: Zarmina va dal cambiavalute.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Molto bene
    gloss: molto bene
    note: بسیار خوب, già visto, qui usato per accettare un'offerta.
    example_gloss: Molto bene, grazie.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'Ripasso: settanta, grazie, fece'
    gloss: settanta / grazie / fece (lui/lei)
    note: هفتاد e تشکر sono parole di ripasso; کرد è la terza persona del passato di کردن (fare), già usata nella lezione sul passato dell'Unità 20, qui combinata per riassumere lo scambio.
    example_gloss: Zarmina ha cambiato cento dollari in afghani.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina: Salve, voglio cambiare dollari in afghani.'
    gloss: Salve, voglio cambiare dollari in afghani.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Cambiavalute: Quanti dollari ha?'
    gloss: Quanti dollari ha?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Zarmina: Ho cento dollari. Qual è il cambio di oggi?'
    gloss: Ho cento dollari. Qual è il cambio di oggi?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Cambiavalute: Oggi un dollaro vale settanta afghani.'
    gloss: Oggi un dollaro vale settanta afghani.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina: Molto bene, cambi pure.'
    gloss: Molto bene, cambi pure.
    note: تبدیل کنین è l'imperativo di cortesia «(per favore) cambi».
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Cambiavalute: Ecco a Lei, settemila afghani.'
    gloss: Ecco a Lei, settemila afghani.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina: Grazie.'
    gloss: Grazie.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Ricevuta
    gloss: ricevuta
    note: رسید significa «ricevuta».
    example_gloss: Prendo una ricevuta.
  prs.a1.unit23.lesson05.teach.migiram:
    title: Prendo / ricevo
    gloss: prendo / ricevo
    note: می‌گیرم significa «prendo / ricevo».
    example_gloss: Prendo i soldi.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Brano di lettura
    gloss: Zarmina è andata dal cambiavalute. Aveva cento dollari e voleva cambiarli in afghani. Il cambio di oggi era di settanta afghani. Zarmina ha ricevuto settemila afghani e ha preso una ricevuta.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: È andato / è andata
    gloss: andato
    note: رفت è il passato «è andato / è andata» (lui/lei).
    example_gloss: Zarmina è andata dal cambiavalute.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'Ripasso: sette, ha preso/ricevuto (lui/lei), ho preso/ricevuto'
    gloss: sette / ha preso, ha ricevuto (lui/lei) / ho preso, ho ricevuto
    note: هفت è un numero già visto; گرفت e گرفتم sono il passato di terza e di prima persona singolare di گرفتن (prendere, ricevere), qui usati per la somma che Zarmina ha ricevuto.
    example_gloss: Zarmina ha ricevuto settemila afghani.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Riepilogo finale
    gloss: 'Ho dei soldi: contanti e carta. Posso cambiare i dollari in afghani dal cambiavalute. Il cambio di oggi è di settanta afghani per un dollaro.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: Per
    gloss: per
    note: برای significa «per».
    example_gloss: Settanta afghani per un dollaro.
  prs.a1.unit23.lesson06.teach.review_va:
    title: E
    gloss: e
    note: و significa «e» e lo conosci già dalle unità precedenti.
    example_gloss: 'Ho dei soldi: contanti e carta.'
