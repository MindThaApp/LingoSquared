teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Negozio
    gloss: negozio
    note: دوکان è la vera parola del dari afghano per indicare un piccolo negozio di quartiere, diversa da مغازه del persiano dell'Iran.
    example_gloss: Questo negozio è grande.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Prezzo
    gloss: prezzo
    note: قیمت significa prezzo.
    example_gloss: Quanto costa questo?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Economico
    gloss: economico
    note: ارزان significa economico, a buon prezzo.
    example_gloss: Questo è economico.
  prs.a1.unit10.lesson01.teach.gran:
    title: Caro
    gloss: caro
    note: گران è il contrario di ارزان.
    example_gloss: Questo è caro.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Sconto
    gloss: sconto
    note: تخفیف significa sconto sul prezzo.
    example_gloss: Fate sconti?
  prs.a1.unit10.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la congiunzione comune usata per unire due brevi affermazioni o richieste.
    example_gloss: Compro mele e pane.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: Quanto costa?
    gloss: Quanto viene?
    note: قیمتش چند است؟ significa letteralmente «il suo prezzo, quanto è?»
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: Costa cento afghani.
    gloss: Costa cento afghani.
    note: صد افغانی است indica un prezzo usando افغانی, la valuta afghana.
  prs.a1.unit10.lesson03.teach.sib:
    title: Mela/Mele
    gloss: mela/mele
    note: سیب significa mela; qui è usato in senso generico o plurale, per la merce in vendita.
    example_gloss: Vorrei un chilo di mele.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Chilo
    gloss: chilo
    note: کیلو è l'unità standard per vendere la frutta e la verdura a peso.
    example_gloss: Vorrei un chilo di mele.
  prs.a1.unit10.lesson03.teach.label_text:
    title: 'Mele: un chilo, cento afghani'
    gloss: 'Mele: un chilo, cento afghani'
    note: 'سیب: یک کیلو صد افغانی è un tipico cartellino del prezzo al mercato.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Vorrei un chilo di mele.
    gloss: Vorrei un chilo di mele.
    note: یک کیلو سیب می‌خواهم usa lo stesso schema یک [item] می‌خواهم visto per ordinare il cibo nell'Unità 8.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Ne vorrei due chili.
    gloss: Ne vorrei due chili.
    note: دو کیلو می‌خواهم sostituisce دو (due) per indicare una quantità maggiore.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: Può farmi uno sconto?
    gloss: Può farmi uno sconto?
    note: تخفیف می‌توانین بدهین؟ chiede con cortesia un prezzo più basso, usando می‌توانین (può).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Per Lei fa 180 afghani.
    gloss: Per Lei fa 180 afghani.
    note: 'برای شما صد و هشتاد افغانی می‌شه propone un totale scontato: 20 afghani in meno rispetto ai 200 pieni per due chili a 100 l''uno.'
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Prego, si accomodi
    gloss: prego, si accomodi
    note: بفرمایین è un invito cordiale e cortese che il negoziante rivolge al cliente quando arriva.
    example_gloss: Ecco, questo è il prezzo.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Salve, prego, si accomodi.
    gloss: Salve, prego, si accomodi.
    note: Il negoziante accoglie il cliente con calore.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Salve. Quanto costano le mele?
    gloss: Salve. Quanto costano le mele?
    note: Il cliente chiede il prezzo delle mele.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Un chilo costa cento afghani.
    gloss: Un chilo costa cento afghani.
    note: Il negoziante dice il prezzo al chilo.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Ne vorrei due chili. Può farmi uno sconto?
    gloss: Ne vorrei due chili. Può farmi uno sconto?
    note: Il cliente dice la quantità e chiede uno sconto.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Sì, per Lei due chili fanno 180 afghani.
    gloss: Sì, per te due chili fanno 180 afghani.
    note: Il negoziante accetta e dà il totale scontato, in linea con il prezzo di 100 afghani al chilo indicato nella battuta 3 (200 meno 20 afghani di sconto).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Va benissimo, grazie.
    gloss: Va benissimo, grazie.
    note: Il cliente accetta il prezzo e ringrazia il negoziante.
