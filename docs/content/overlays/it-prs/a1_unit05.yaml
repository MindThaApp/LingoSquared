teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Mercato
    gloss: mercato / bazar
    note: بازار è la parola comune per una zona di mercato, spesso un'intera strada o un intero quartiere di negozi.
    example_gloss: Il bazar è vicino.
  prs.a1.unit05.lesson01.teach.bank:
    title: Banca
    gloss: banca
    note: بانک è un prestito diretto, molto simile alla parola italiana «banca» per suono e significato.
    example_gloss: Dov'è la banca?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Moschea
    gloss: moschea
    note: مسجد è la parola standard per indicare una moschea.
    example_gloss: La moschea è grande.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Ospedale
    gloss: ospedale
    note: شفاخانه è la parola afghana di uso quotidiano per «ospedale»; è diversa dal persiano iraniano بیمارستان, che chi parla dari può capire ma di solito non usa.
    example_gloss: L'ospedale è lontano.
  prs.a1.unit05.lesson01.teach.school:
    title: Scuola
    gloss: scuola
    note: مکتب è la parola afghana di uso quotidiano per «scuola»; è diversa dal persiano iraniano مدرسه, che in dari di solito indica specificamente una scuola religiosa.
    example_gloss: La scuola è vicino a casa.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Farmacia
    gloss: farmacia
    note: دواخانه è la parola afghana di uso quotidiano per «farmacia» (da دوا, medicina); è diversa dal persiano iraniano داروخانه.
    example_gloss: Dov'è la farmacia?
  prs.a1.unit05.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la parola di collegamento comune usata per unire un elenco di luoghi.
    target_text: و (e)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Ufficio postale
    gloss: ufficio postale
    note: پوسته خانه unisce پوسته (posta) e خانه (casa/edificio).
    example_gloss: L'ufficio postale è chiuso.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Ambasciata
    gloss: ambasciata
    note: سفارت è la parola standard per indicare un'ambasciata.
    example_gloss: L'ambasciata è a Kabul.
  prs.a1.unit05.lesson02.teach.airport:
    title: Aeroporto
    gloss: aeroporto
    note: میدان هوایی è il termine afghano di uso quotidiano per «aeroporto» (letteralmente «campo d'aria»); è diverso dal persiano iraniano فرودگاه.
    example_gloss: L'aeroporto è lontano.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Ufficio (ripasso)
    gloss: ufficio
    note: دفتر è già stato introdotto in un'unità precedente; qui compare insieme agli altri luoghi pubblici.
    example_gloss: Il mio ufficio è vicino.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Chiedere dov'è il mercato
    gloss: Dov'è il mercato?
    note: بازار کجاست؟ è lo schema di base per chiedere dove si trova un luogo qualsiasi.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Chiedere dov'è l'ospedale
    gloss: Dov'è l'ospedale?
    note: Lo stesso schema con کجاست vale per qualsiasi nome di luogo.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Attirare gentilmente l'attenzione di qualcuno
    gloss: Scusi, dov'è la farmacia?
    note: ببخشین apre con cortesia una domanda rivolta a uno sconosciuto, con la stessa funzione di «scusi» in italiano.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Come si forma کجاست
    gloss: کجاست è formato da کجا (dove) più است (è), contratti insieme.
    note: Riconoscere questa scomposizione aiuta a vedere lo schema, invece di memorizzare کجاست come un blocco unico e non analizzato.
  prs.a1.unit05.lesson04.teach.near:
    title: Vicino
    gloss: vicino a
    note: نزدیک descrive qualcosa che è vicino.
    example_gloss: La banca è vicina.
  prs.a1.unit05.lesson04.teach.far:
    title: Lontano
    gloss: lontano
    note: دور descrive qualcosa che è a distanza.
    example_gloss: L'ospedale è lontano.
  prs.a1.unit05.lesson04.teach.here:
    title: Qui
    gloss: qui
    note: این‌جا indica il luogo in cui si trova chi parla.
    example_gloss: La banca è qui.
  prs.a1.unit05.lesson04.teach.there:
    title: Là
    gloss: là
    note: آن‌جا indica un luogo lontano da chi parla.
    example_gloss: La farmacia è là.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Dire che il mercato è vicino
    gloss: Il mercato è vicino.
    note: بازار نزدیک است usa lo stesso verbo copulativo است visto in tutto il corso.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Dire che l'aeroporto è lontano
    gloss: L'aeroporto è lontano.
    note: میدان هوایی دور است segue lo stesso schema, con دور al posto di نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Accanto a
    gloss: accanto a
    note: در کنار significa letteralmente «al lato di».
  prs.a1.unit05.lesson05.teach.behind:
    title: Dietro
    gloss: dietro
    note: پشت indica che qualcosa si trova dietro un altro luogo.
    example_gloss: La farmacia è dietro la scuola.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Di fronte / dirimpetto
    gloss: di fronte / dirimpetto
    note: مقابل indica che qualcosa si trova esattamente di fronte a un altro luogo.
    example_gloss: La banca è di fronte alla moschea.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Collocare l'ospedale rispetto alla moschea
    gloss: L'ospedale è accanto alla moschea.
    note: شفاخانه در کنار مسجد است combina un luogo, la preposizione در کنار e la copula است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Grazie mille
    gloss: Grazie mille.
    note: تشکر زیاد rafforza il comune تشکر già imparato.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina chiede della farmacia
    gloss: Zarmina chiede gentilmente a un passante dove si trova la farmacia.
    note: ببخشین apre la domanda con rispetto, ed è adatto a uno sconosciuto.
  prs.a1.unit05.lesson06.teach.turn02:
    title: Il passante dà indicazioni
    gloss: Il passante dice che la farmacia non è lontana, di andare dritto, e che è accanto alla scuola.
    note: 'Qui si uniscono vari schemi di questa unità: دور نیست (دور alla forma negativa), مستقیم بروین e در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina ringrazia il passante
    gloss: Zarmina lo ringrazia molto.
    note: تشکر زیاد chiude lo scambio con cortesia.
  prs.a1.unit05.lesson06.teach.turn04:
    title: La risposta modesta del passante
    gloss: Di niente / non c'è di che.
    note: 'قابلی نداره è un modo comune e modesto di rispondere ai ringraziamenti nel dari afghano di tutti i giorni; ha una funzione simile a خواهش می‌کنم, ma è più informale. نداره è la forma parlata di ندارد: all''orecchio sentirai نداره, mentre nello scritto accurato si usa ندارد.'
