course:
  title: Italiano–Dari A1
  description: 'Dari afghano per principianti: nominare i luoghi comuni della città, chiedere dove si trova qualcosa, dare semplici risposte sulla posizione e seguire indicazioni di base per raggiungere un luogo.'
