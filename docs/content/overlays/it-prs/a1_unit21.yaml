  prs.a1.unit21.lesson06.wrap_up_reading:
    title: Lettura di riepilogo
teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: I vestiti
    gloss: vestiti
    note: لباس significa «vestiti» (è la parola generale).
    example_gloss: Questi sono vestiti nuovi.
  prs.a1.unit21.lesson01.teach.perahan:
    title: Camicia
    gloss: camicia
    note: پیراهن significa «camicia».
    example_gloss: Questa camicia è bella.
  prs.a1.unit21.lesson01.teach.patlun:
    title: Pantaloni
    gloss: pantaloni
    note: 'پطلون significa «pantaloni»: è la vera parola del dari afghano (un prestito dall''inglese, da «pantaloon»), diversa da شلوار del persiano iraniano.'
    example_gloss: Questi pantaloni sono costosi.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Scarpe
    gloss: scarpe
    note: کفش significa «scarpe».
    example_gloss: Queste scarpe costano poco.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: È / sono
    gloss: è
    note: است («è») ti è già familiare dall'unità sui saluti.
    example_gloss: Questa è una camicia.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Caro
    gloss: caro
    note: گران («costoso») ti è già familiare dall'unità sugli acquisti.
    example_gloss: Questi pantaloni sono costosi.
  prs.a1.unit21.lesson02.teach.rang:
    title: Colore
    gloss: colore
    note: رنگ significa «colore».
    example_gloss: Di che colore è questa camicia?
  prs.a1.unit21.lesson02.teach.siyah:
    title: Nero
    gloss: nero
    note: سیاه significa «nero».
    example_gloss: Questi pantaloni sono neri.
  prs.a1.unit21.lesson02.teach.safid:
    title: Bianco
    gloss: bianco
    note: سفید significa «bianco».
    example_gloss: Questa camicia è bianca.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Rosso
    gloss: rosso
    note: 'سرخ significa «rosso»: è la forma del dari e del persiano classico, non il colloquiale iraniano قرمز.'
    example_gloss: Queste scarpe sono rosse.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Taglia
    gloss: taglia
    note: اندازه significa «taglia» (sostantivo).
    example_gloss: Che taglia porti?
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: Che taglia porti?
    gloss: Che taglia porti?
    note: اندازه شما چند است؟ significa letteralmente «la tua taglia è quanto?».
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: È questa la tua taglia?
    gloss: È questa la tua taglia?
    note: این اندازه شما است؟ usa این («questo»), introdotto qui.
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Grande
    gloss: grande
    note: بزرگ («grande») ti è già familiare dall'unità sui confronti.
    example_gloss: Questa camicia è grande.
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Piccolo
    gloss: piccolo
    note: کوچک («piccolo») ti è già familiare dall'unità sui confronti.
    example_gloss: Queste scarpe sono piccole.
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: Posso provare questo?
    gloss: Posso provare questo?
    note: پرو کردن significa «provare» un capo (un prestito dal francese, comune a dari e persiano). می‌توانم این را پرو کنم؟ significa letteralmente «posso questo provare-fare?».
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: Sì, può provarlo
    gloss: Sì, può provarlo.
    note: می‌توانین پرو کنین è la forma di cortesia della seconda persona dello stesso verbo.
  prs.a1.unit21.lesson04.teach.label_text:
    title: Un'etichetta di abbigliamento
    gloss: 'Camicia: taglia grande, colore bianco, 500 afghani'
    note: Una semplice etichetta con capo, taglia, colore e prezzo.
  prs.a1.unit21.lesson04.teach.review_ra:
    title: Marcatore dell'oggetto
    gloss: (marcatore dell'oggetto)
    note: 'را segna il complemento oggetto: ti è già familiare dalle frasi delle unità precedenti.'
    example_gloss: Voglio questa camicia.
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Afghani
    gloss: afghani
    note: افغانی («afghani») è la valuta, già familiare dall'unità sugli acquisti.
    example_gloss: Sono 500 afghani.
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: Di che colore è questa camicia?
    gloss: Di che colore è questa camicia?
    note: این پیراهن چه رنگ دارد؟ usa دارد («ha»), introdotto qui.
  prs.a1.unit21.lesson05.teach.turn01:
    title: Il negoziante saluta
    gloss: Buongiorno, prego.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Zarmina chiede
    gloss: Buongiorno. Di che colore è questa camicia?
    note: زرمینه (Zarmina) è un personaggio ricorrente del corso, presentato per la prima volta nelle unità sull'ora e sulla routine quotidiana.
  prs.a1.unit21.lesson05.teach.turn03:
    title: Il negoziante risponde
    gloss: Ce l'ho nera e bianca.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Zarmina sceglie
    gloss: Voglio la camicia bianca. La taglia è grande?
    note: اندازه‌اش («la sua taglia») aggiunge a اندازه la desinenza del possessivo.
  prs.a1.unit21.lesson05.teach.turn05:
    title: Il negoziante conferma
    gloss: Sì, è grande. Può provarla.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Zarmina la prova
    gloss: Grazie. Questa è la mia taglia. Quanto costa?
  prs.a1.unit21.lesson05.teach.turn07:
    title: Il negoziante dice il prezzo
    gloss: Costa 500 afghani.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Zarmina accetta
    gloss: Benissimo, la compro.
    note: می‌خرم è la prima persona singolare del presente di خریدن («comprare»).
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Negoziante
    gloss: negoziante
    note: دوکاندار («negoziante») ti è già familiare dall'unità sugli acquisti.
    example_gloss: Il negoziante vende camicie.
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: Benissimo
    gloss: benissimo
    note: بسیار خوب («benissimo») ti è già familiare dall'unità sugli acquisti.
    example_gloss: Benissimo, grazie.
  prs.a1.unit21.lesson05.teach.review_che:
    title: Che cosa
    gloss: che cosa
    note: چه (che, cosa) -- già familiare dalle domande delle unità precedenti.
    example_gloss: Di che colore è questo?
  prs.a1.unit21.lesson06.teach.review_va:
    title: E
    gloss: e
    note: و (e) -- già familiare dall'unità sugli acquisti.
    example_gloss: Compro una camicia e dei pantaloni.
  prs.a1.unit21.lesson06.teach.review_yak:
    title: Uno
    gloss: uno
    note: یک (uno) -- già familiare dall'unità sui numeri.
    example_gloss: Compro una camicia.
  prs.a1.unit21.lesson06.teach.review_ba:
    title: A
    gloss: a
    note: به (a, verso) -- già familiare dalle unità sulle indicazioni stradali e sulla routine quotidiana.
    example_gloss: Vado al negozio.
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Negozio
    gloss: negozio
    note: دوکان (negozio) -- già familiare dall'unità sugli acquisti.
    example_gloss: Questo negozio è grande.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: È andata
    gloss: andato
    note: رفت (è andato/a, terza persona) -- già familiare dall'unità sugli eventi passati.
    example_gloss: Zarmina è andata al negozio.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Il suo prezzo
    gloss: il suo prezzo
    note: قیمتش (il suo prezzo) -- già familiare dall'unità sugli acquisti.
    example_gloss: Costava 500 afghani.
  prs.a1.unit21.lesson06.teach.summary_text:
    title: Un riassunto degli acquisti
    gloss: Zarmina è andata al negozio. Ha comprato una camicia bianca e grande. Costava 500 afghani.
    note: خرید (ha comprato) e بود (era) sono entrambi forme del passato semplice, già familiari dall'unità sugli eventi passati.
