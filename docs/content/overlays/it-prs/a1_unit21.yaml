course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: vocabolario dei capi di abbigliamento, colori, taglie, provare un capo, leggere un''etichetta e un dialogo completo in negozio per comprare una camicia.'
units:
  prs.a1.unit21.clothing:
    title: Comprare vestiti
    description: Riconoscere i capi di abbigliamento più comuni e fare un semplice acquisto di vestiti.
lessons:
  prs.a1.unit21.lesson01.clothing_vocabulary:
    title: Parole dei vestiti
