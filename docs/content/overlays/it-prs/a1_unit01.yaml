course:
  title: Italiano–Dari A1
  description: 'Dari afghano per principianti: lettura della scrittura perso-araba, comprensione del parlato quotidiano afghano, saluti estesi e un primo incontro rispettoso in un ufficio di Kabul.'
units:
  prs.a1.unit01.greetings:
    title: Saluti e primi incontri
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Leggi le lettere di questa unità
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Scambia i saluti di tutti i giorni
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Saluta e congedati nei diversi momenti della giornata
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Usa la conversazione di cortesia formale e informale
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Chiedi della famiglia e mostra rispetto agli ospiti
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Affronta il primo giorno in un ufficio di Kabul
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Le lettere ا، ب، ت e د
    gloss: a/ā, b, t e d
    note: Il dari si scrive da destra a sinistra. La lettera د non si lega a quella che la segue a sinistra.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Le lettere ر e ز
    gloss: r e z
    note: Nessuna delle due lettere si lega a quella successiva.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Le lettere س، ش e ص
    gloss: s, sh e s
    note: س e ص rappresentano entrambe il suono s nel dari comune; ش rappresenta il suono sh (come in «scena»).
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Le lettere ج، چ، ح e خ
    gloss: j, ch, h e kh
    note: چ è ch. خ è il suono che di solito si traslittera kh.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Le lettere ع، غ، ف e ق
    gloss: ʿ, gh, f e q
    note: La pronuncia esatta di غ e ق varia tra i parlanti di dari; nella scrittura tienile sempre distinte.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Le lettere ک، گ، ل e م
    gloss: k, g, l e m
    note: ک è il kaf persiano, la forma usata per k nel dari. ل e م si legano alle lettere su entrambi i lati.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Le lettere ن، و، ه e ی
    gloss: n, w/v/o/u, h e y/i lunga
    note: ی è la ye persiana, usata per y e per la vocale lunga i. و può essere una consonante (w/v) o una vocale lunga (o/u).
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Leggi una parola con lettere legate
    gloss: ciao
    note: Le lettere si legano a formare سلام. Le vocali brevi di norma non si scrivono.
    example_gloss: Ciao! Sono Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Un saluto quotidiano rispettoso
    gloss: La pace sia su di te / ciao
    note: سلام علیکم è diffuso in tutto l'Afghanistan e va bene sia tra persone di confidenza sia in incontri rispettosi.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Rispondere al saluto
    gloss: E su di te la pace
    note: وعلیکم سلام è la risposta convenzionale a سلام علیکم. Sono accettate anche le forme con السلام.
  prs.a1.unit01.lesson02.teach.salam:
    title: Un saluto breve
    gloss: ciao
    note: سلام è un saluto più breve e versatile.
    example_gloss: Ciao, come stai?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Benvenuto
    gloss: benvenuto
    note: خوش آمدین è il benvenuto parlato rispettoso, usato per una persona o per più persone.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Grazie
    gloss: grazie
    note: تشکر è la forma del dari afghano preferita in questo corso. ممنون e ممنونم sono varianti secondarie comprese da tutti.
    example_gloss: Grazie mille.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Una risposta formale ai ringraziamenti
    gloss: prego / di nulla
    note: خواهش می‌کنم è una risposta cortese diffusa in tutto il mondo persofono. Non è presentata come un uso colloquiale tipicamente afghano.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Arrivederci
    gloss: arrivederci; addio
    note: خدا حافظ è un saluto di congedo convenzionale in dari afghano e spesso si scrive in due parole.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Saluto del mattino
    gloss: buongiorno
    note: صبح بخیر si usa di mattina.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Saluto diurno
    gloss: buongiorno
    note: روز بخیر è un saluto cortese per le ore del giorno.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Saluto del tardo pomeriggio
    gloss: buon pomeriggio / buonasera
    note: عصر بخیر si addice alla parte più avanzata della giornata.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Espressione per la notte
    gloss: buonanotte
    note: شب بخیر di solito chiude la serata, invece di aprire un normale incontro diurno.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Un congedo cortese per il giorno
    gloss: buona giornata
    note: روز خوش è un congedo cortese e piuttosto formale, diffuso in tutta l'area persofona e non una formula colloquiale tipicamente afghana.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Fino al prossimo incontro
    gloss: spero di rivederti
    note: به امید دیدار è un congedo caloroso ma rispettoso.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Chiedere con cortesia come sta qualcuno
    gloss: Come sta?
    note: استین è una forma parlata cortese comune in dari afghano, usata con شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Chiedere a un coetaneo o a un amico stretto
    gloss: Come sta?
    note: تو e استی sono forme informali al singolare; non usare automaticamente questa combinazione con una persona anziana o appena conosciuta.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Dire che stai bene
    gloss: Sto bene, grazie.
    note: استم significa «sono». È la forma parlata del dari afghano usata in tutto il corso.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Dire che stai bene di salute
    gloss: Sto bene.
    note: جور esprime lo stare bene o in buona salute ed è frequente nei saluti afghani.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Una risposta sobria
    gloss: Non c'è male.
    note: بد نیستم è una risposta neutra.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Restituire la domanda
    gloss: E Lei?
    note: و شما؟ mantiene lo scambio rispettoso e conciso.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Prolungare il saluto
    gloss: Tutti bene?
    note: Le sequenze di saluto afghane possono continuare con domande sulla famiglia prima di passare agli affari.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Chiedere della famiglia di qualcuno
    gloss: La tua famiglia sta bene?
    note: Chiedere della famiglia è parte abituale di un saluto afghano esteso. Il corso scrive la forma possessiva come فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Chiedere della casa e dei familiari
    gloss: Tutti a casa stanno bene?
    note: اهل خانه indica nel complesso i membri della famiglia che vivono in casa.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Rispondere alla domanda sulla famiglia
    gloss: Grazie a Dio, stanno tutti bene.
    note: Qui شکر è un'espressione abbreviata di gratitudine, non la parola «zucchero» in senso letterale.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Dare una risposta calorosa e cortese
    gloss: Che tu possa vivere a lungo / grazie.
    note: زنده باشین è una formula di cortesia afghana comune, spesso detta in risposta a un ringraziamento o a parole gentili. باشین è la forma parlata di rispetto per «voi/Lei».
  prs.a1.unit01.lesson05.teach.own_home:
    title: Accogliere calorosamente un ospite
    gloss: Questa è casa tua.
    note: 'خانهٔ خودتان است rassicura l''ospite: è il benvenuto.'
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Offrire il posto d'onore
    gloss: Prego, accomodati al posto d'onore.
    note: In una stanza per gli ospiti, بالا بفرمایین invita l'ospite verso il posto più onorevole, lontano dall'ingresso. Non significa necessariamente «di sopra».
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Saluta prima gli anziani
    gloss: Salutiamo prima gli anziani.
    note: Salutare prima gli anziani esprime rispetto. I saluti con contatto fisico dipendono dal rapporto, dal genere e dai segnali individuali; chi studia non deve dare per scontato che una stretta di mano sia appropriata.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Ufficio
    gloss: ufficio
    note: دفتر indica un ufficio o un luogo di lavoro.
    example_gloss: Il mio ufficio è a Kabul.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kabul
    gloss: Kabul
    note: کابل è la capitale dell'Afghanistan e l'ambientazione di questo dialogo.
    example_gloss: Vivo a Kabul.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed si presenta come il nuovo collega
    gloss: Hamed dice di essere il nuovo collega.
    note: Entrambi gli interlocutori sono colleghi adulti uomini che si incontrano in un ufficio a Kabul.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib gli dà il benvenuto e gli chiede il nome
    gloss: Najib gli dà il benvenuto e gli chiede come si chiama.
    note: خوش آمدین è il benvenuto rispettoso del dari parlato, adatto sia a una persona sia a più persone.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed dice il suo nome
    gloss: Hamed dice come si chiama.
    note: نامم حامد است (mi chiamo Hamed) è la forma parlata di tutti i giorni; نامم è نام + -م (mio). Nello scritto trovi anche نام من حامد است. Entrambe sono corrette.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib si presenta e dice di essere lieto di conoscerlo
    gloss: Najib si presenta e dice di essere lieto di conoscerlo.
    note: از آشنایی با شما خوش شدم si riferisce esplicitamente al fare conoscenza, quindi è adatta a un primo incontro.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed ricambia il piacere e chiede a Najib come sta
    gloss: Hamed ricambia il piacere e chiede a Najib come sta.
    note: Lo scambio mantiene il rispettoso شما e استین tra colleghi che si conoscono da poco.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib risponde
    gloss: Najib dice che sta bene, grazie.
    note: جور استم، تشکر risponde alla domanda sul benessere, come visto prima in questa unità.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib chiede della famiglia di Hamed
    gloss: Najib chiede della famiglia di Hamed.
    note: La domanda sui familiari allunga il saluto prima di passare al lavoro.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed dice che tutti stanno bene
    gloss: Hamed dice che tutti stanno bene.
    note: شکر، همه جور استند risponde alla domanda sulla famiglia, come visto prima in questa unità.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib si offre di presentargli gli altri colleghi
    gloss: Najib si offre di presentargli gli altri colleghi.
    note: بفرمایین qui invita Hamed a seguirlo, non a sedersi né a prendere qualcosa.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed accetta ringraziando
    gloss: Hamed accetta ringraziando.
    note: بسیار خوب viene introdotto qui come chiara risposta affermativa.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib risponde con cordialità e indica la scrivania di Hamed
    gloss: Najib risponde con cordialità e indica la scrivania di Hamed.
    note: Il dialogo si chiude con l'inizio della giornata di lavoro, senza ripetere i saluti di congedo di una visita a casa.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed lo ringrazia
    gloss: Hamed lo ringrazia.
    note: تشکر chiude lo scambio in modo semplice.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: Con quale lettera inizia سلام?
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام inizia con س. Questa domanda verifica l'ortografia della parola studiata, non quali lettere possano rappresentare il suono s.
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: Quale lettera rappresenta il suono ch (come in «ciao»)?
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ rappresenta il suono ch (come in «ciao»).
    prompt_blocks:
    - ci (come in «ciao»)
