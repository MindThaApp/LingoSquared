  prs.a1.unit01.lesson01.exercise04.match_final_group:
    instruction: Abbina ogni lettera al suo valore sonoro approssimativo.
    accepted_answers:
    - value:
        خ: kh
        ق: gh/q
        ل: l
        م: m
        ن: n
        و: w/v
        ه: h
        ی: y/i lunga
      status: correct
    feedback: Questi valori sonori ritorneranno spesso in tutta l'unità.
    pairs:
    - left: خ
      right: kh
    - left: ق
      right: gh/q
    - left: ل
      right: l
    - left: م
      right: m
    - left: ن
      right: n
    - left: و
      right: w/v
    - left: ه
      right: h
    - left: ی
      right: y/i lunga
  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: Ordina le lettere per formare سلام.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م forma سلام.
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: Seleziona la parola scritta in forma legata che significa «ciao».
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام significa «ciao».
    prompt_blocks:
    - ciao
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: Il dari si scrive da destra a sinistra?
    options:
    - sì
    - 'no'
    accepted_answers:
    - value: sì
      status: correct
    feedback: La scrittura dari procede da destra a sinistra.
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: Copia esattamente سلام.
    accepted_answers:
    - value: سلام
      status: correct
    feedback: L'ortografia corretta è سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: Che cosa significa questa espressione?
    correct_option: salve (la pace sia con voi)
    distractors:
    - arrivederci
    - benvenuto
    - grazie
    accepted_answers:
    - value: salve (la pace sia con voi)
      status: correct
    feedback: سلام علیکم significa «salve» (letteralmente «la pace sia con voi»).
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Traduci in dari: «E su di voi la pace» (la risposta convenzionale a سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Variante accettata con spaziatura diversa.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Variante comune della risposta completa.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Risposta completa comune con la congiunzione staccata.
    feedback: وعلیکم سلام è la risposta convenzionale; sono valide anche le forme complete comuni che contengono السلام.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Rispondi a سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Comprensibile, ma meno reciproca della risposta completa.
    feedback: وعلیکم سلام e وعلیکم السلام sono risposte complete convenzionali.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Seleziona il significato di خوش آمدین.
    correct_option: benvenuto
    distractors:
    - arrivederci
    - grazie
    - buonanotte
    accepted_answers:
    - value: benvenuto
      status: correct
    feedback: خوش آمدین significa «benvenuto».
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Traduci in dari: Grazie.'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
      status: acceptable_with_note
      note: Si capisce in dari; تشکر è la forma preferita nel corso.
    - value: ممنونم
      status: acceptable_with_note
      note: Si capisce in dari; تشکر è la forma preferita nel corso.
    feedback: تشکر è la risposta dari afghana preferita in questo corso.
  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: Riordina l'espressione formale usata in tutte le regioni per dire «Prego».
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم è una risposta cortese ai ringraziamenti, usata in tutte le regioni.
  prs.a1.unit01.lesson02.exercise07.goodbye_meaning:
    instruction: Seleziona il significato di خدا حافظ.
    correct_option: arrivederci
    distractors:
    - benvenuto
    - ciao
    - grazie
    accepted_answers:
    - value: arrivederci
      status: correct
    feedback: خدا حافظ è un saluto di congedo.
  prs.a1.unit01.lesson02.exercise08.speak_exchange:
    instruction: Senti سلام علیکم. Ricambia il saluto a voce.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Una risposta più breve ma meno reciproca.
    feedback: Usa وعلیکم سلام o وعلیکم السلام per una risposta completa convenzionale.
  prs.a1.unit01.lesson03.exercise01.translate_morning:
    instruction: 'Traduci in dari: Buongiorno.'
    accepted_answers:
    - value: صبح بخیر
      status: correct
    - value: صبح به خیر
      status: acceptable_with_note
      note: Variante comune con spaziatura diversa.
    feedback: صبح بخیر significa «buongiorno».
  prs.a1.unit01.lesson03.exercise02.recognize_day_reading:
    instruction: Che cosa significa questa espressione?
    correct_option: buongiorno (saluto diurno)
    distractors:
    - buonanotte
    - buon pomeriggio/buonasera
    - buona giornata
    accepted_answers:
    - value: buongiorno (saluto diurno)
