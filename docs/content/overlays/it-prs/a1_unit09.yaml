teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Sabato e domenica
    gloss: Sabato, domenica
    note: شنبه (sabato) è il primo giorno della settimana in Afghanistan; یکشنبه (domenica) viene subito dopo.
    example_gloss:
    - Oggi è sabato.
    - Domani è domenica.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Lunedì e martedì
    gloss: lunedì, martedì
    note: دوشنبه e سه‌شنبه significano letteralmente «secondo giorno» e «terzo giorno» dopo شنبه.
    example_gloss:
    - Lunedì ho lezione.
    - Martedì ho un appuntamento.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Mercoledì e giovedì
    gloss: mercoledì, giovedì
    note: 'چهارشنبه e پنجشنبه seguono lo stesso schema: «quarto giorno» e «quinto giorno».'
    example_gloss:
    - Il mercoledì lavoro.
    - Ci vediamo giovedì.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: Venerdì
    gloss: venerdì
    note: جمعه è il giorno festivo settimanale in Afghanistan, con una funzione simile a quella della domenica in Italia.
    example_gloss: Il venerdì è giorno di riposo.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Data
    gloss: data
    note: تاریخ è la parola generica per indicare una data del calendario.
    example_gloss: Qual è la data di oggi?
  prs.a1.unit09.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la congiunzione più comune e viene usata in tutta questa unità.
    target_text: و (e)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: Il giorno festivo settimanale
    gloss: Il venerdì è il giorno libero della settimana.
    note: A differenza del fine settimana sabato-domenica, in Afghanistan il principale giorno festivo settimanale è *جمعه* (venerdì); il giovedì è spesso mezza giornata lavorativa.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (1º mese)
    gloss: Hamal, il primo mese del calendario Hijri Shamsi (circa fine marzo-aprile)
    note: حمل apre l'anno solare afghano e coincide con il capodanno Nowruz.
    example_gloss: Hamal è il primo mese dell'anno.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (2º mese)
    gloss: Sawr, il secondo mese (circa aprile-maggio)
    note: ثور viene dopo حمل.
    example_gloss: A Sawr il tempo è bello.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Jawza (3º mese)
    gloss: Jawza, il terzo mese (circa maggio-giugno)
    note: جوزا viene dopo ثور.
    example_gloss: Sono nato/a a Jawza.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: Il calendario dell'Afghanistan
    gloss: L'Afghanistan usa il calendario hijri shamsi (egira solare).
    note: È lo stesso calendario solare usato in Iran, diverso sia dal calendario gregoriano sia dal calendario hijri lunare.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Chiedere che giorno è oggi
    gloss: Che giorno della settimana è oggi?
    note: 'امروز چند شنبه است؟ significa letteralmente «oggi è quale -shanbe»: è il modo naturale per chiedere il giorno della settimana.'
  prs.a1.unit09.lesson03.teach.today_word:
    title: Oggi
    gloss: oggi
    note: امروز indica il giorno presente.
    example_gloss: Che data è oggi?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Dire una data completa
    gloss: Oggi è giovedì, 15 di Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است unisce il giorno della settimana, la data in numero ordinale e il nome del mese.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Chiedere che giorno è un evento
    gloss: Che giorno è la riunione?
    note: جلسه کدام روز است؟ usa کدام (quale) per chiedere il giorno di un evento.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Chiedere una data precisa
    gloss: Che giorno di Hamal è lunedì?
    note: دوشنبه چندم حمل است؟ chiede a quale giorno del mese cade lunedì.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19º
    gloss: 19º
    note: '*نوزدهم* è la forma ordinale di diciannove e segue lo stesso schema ordinale di *پانزدهم* (15º).'
    example_gloss: Oggi è il 19.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun chiede il giorno della riunione
    gloss: Homayoun chiede a Bashir che giorno è la riunione.
    note: جلسه کدام روز است؟ dalla lezione 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Bashir risponde
    gloss: Bashir dice che pensa sia lunedì.
    note: فکر می‌کنم (penso) attenua la risposta, perché Bashir non è del tutto sicuro.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun chiede la data esatta
    gloss: Homayoun chiede che giorno di Hamal è lunedì.
    note: دوشنبه چندم حمل است؟ dalla lezione 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Bashir dà la data esatta
    gloss: Bashir dice che lunedì è il 19 di Hamal.
    note: '*دوشنبه نوزدهم حمل است* unisce giorno, data ordinale e mese, secondo lo schema della lezione 4.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun chiede del venerdì
    gloss: Homayoun accetta e chiede a Bashir se è libero venerdì.
    note: وقت داری؟ (hai tempo?) è un modo naturale per chiedere la disponibilità.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Bashir dice di essere impegnato
    gloss: 'Bashir dice di no: venerdì è impegnato.'
    note: مصروف استم (sono impegnato) spiega perché il venerdì non va bene.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun conferma lunedì
    gloss: 'Homayoun dice che non c''è problema: vedrà Bashir lunedì.'
    note: مشکل نیست (non c'è problema) smorza il contrattempo prima di confermare il programma originale di lunedì.
