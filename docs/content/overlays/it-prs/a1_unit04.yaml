teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Uno, due, tre
    gloss: 1, 2, 3
    note: یک، دو، سه sono i numeri di base persiani, comuni a dari e farsi.
    example_gloss:
    - Ho un fratello.
    - Ho due libri.
    - Ho tre sorelle.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Quattro, cinque, sei
    gloss: 4, 5, 6
    note: چهار è la forma scritta standard; in alcuni parlanti, nel parlato informale, si accorcia in چار, ma in questo corso si usa l'ortografia standard.
    example_gloss:
    - Ho quattro libri.
    - Aspetta cinque minuti.
    - Ha sei libri.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Sette, otto
    gloss: 7, 8
    note: هفت، هشت continuano la sequenza.
    example_gloss:
    - In una settimana ci sono sette giorni.
    - Verrò alle otto.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Nove, dieci
    gloss: 9, 10
    note: نه، ده completano i numeri da uno a dieci.
    example_gloss:
    - In classe ci sono nove persone.
    - Ho dieci dita.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Undici, dodici, tredici
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده sono parole distinte, non semplici composti delle cifre delle unità.
    example_gloss:
    - Ho lezione alle undici.
    - In un anno ci sono dodici mesi.
    - Ha tredici anni.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Quattordici, quindici, sedici
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده continuano i numeri da undici a diciannove.
    example_gloss:
    - Verrò tra quattordici giorni.
    - Ha quindici libri.
    - Ha sedici anni.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Diciassette, diciotto, diciannove
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده completano i numeri da undici a diciannove.
    example_gloss:
    - Ha diciassette libri.
    - Ha diciotto anni.
    - Mancano diciannove giorni.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Venti
    gloss: '20'
    note: بیست apre le decine, che vedremo per intero nella prossima lezione.
    example_gloss: Ho venti libri.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Venti, trenta, quaranta
    gloss: 20, 30, 40
    note: بیست، سی، چهل sono le parole delle decine, ciascuna con una forma propria e non prevedibile.
    example_gloss:
    - Ho vent'anni.
    - Questo mese ha trenta giorni.
    - Ha quarant'anni.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Cinquanta, sessanta
    gloss: 50, 60
    note: پنجاه، شصت continuano le decine.
    example_gloss:
    - Ha cinquanta libri.
    - Sessanta minuti sono un'ora.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Settanta, ottanta
    gloss: 70, 80
    note: هفتاد، هشتاد continuano le decine.
    example_gloss:
    - Questo libro ha settanta pagine.
    - Ha ottanta libri.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Novanta, cento
    gloss: 90, 100
    note: نود، صد completano la sequenza fino a cento.
    example_gloss:
    - Ha novant'anni.
    - Ha cento libri.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Unire decine e unità
    gloss: 25 è letteralmente «venti e cinque».
    note: Una parola delle decine e una delle unità si uniscono con و (e), lo stesso connettore usato altrove in questo corso, per esempio بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: Quanti / quanto
    gloss: quanti / quanto
    note: چند introduce una domanda su una quantità, compresa l'età.
    example_gloss: Quanti anni ha?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: Anno
    gloss: anno
    note: سال si usa per dire l'età, letteralmente «anni».
    example_gloss: Ho vent'anni.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Chiedere l'età a qualcuno con cortesia
    gloss: Quanti anni hai?
    note: چند ساله استین؟ significa letteralmente «di quanti anni sei», con la forma di rispetto استین, usata con una persona che non conosci bene.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Chiedere l'età a un amico stretto
    gloss: Quanti anni hai?
    note: 'چند ساله استی؟ usa la forma informale استی: riservala a un amico stretto o a un coetaneo, come la regola di registro già vista in questo corso.'
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Dire la propria età
    gloss: Ho 25 anni.
    note: بیست و پنج ساله استم unisce il numero, ساله («di … anni») e استم.
  prs.a1.unit04.lesson05.teach.number_word:
    title: Numero
    gloss: numero
    note: نمبر è un termine di uso quotidiano molto diffuso in Afghanistan (dal persiano/inglese) per «numero», soprattutto il numero di telefono.
    example_gloss: Questo è il mio numero di telefono.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Telefono
    gloss: telefono
    note: تلفن è la parola standard per «telefono».
    example_gloss: Il mio telefono è rotto.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Chiedere il numero di telefono
    gloss: Qual è il tuo numero di telefono?
    note: نمبر تلفن‌تان چند است؟ usa lo stesso schema con چند della domanda sull'età, applicato al numero di telefono.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Zero
    gloss: zero
    note: صفر serve per leggere la maggior parte dei numeri di telefono afghani.
    example_gloss: Lo zero è un numero.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Dire il proprio numero di telefono
    gloss: Il mio numero di telefono è 079-345-678.
    note: In Afghanistan i numeri di telefono si leggono di solito a piccoli gruppi, non cifra per cifra, come in questo esempio.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun saluta Bashir
    gloss: Homayoun chiede a Bashir come sta, usando il registro informale adatto a un amico stretto.
    note: جور استی؟ mostra che i due sono già amici stretti, quindi in tutto il dialogo si usa il registro informale.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir risponde e chiede l'età a Homayoun
    gloss: Bashir dice che sta bene e chiede a Homayoun quanti anni ha.
    note: چند ساله استی؟ usa il registro informale, coerente con la loro amicizia.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun risponde e ripete la domanda
    gloss: Homayoun dice di avere 28 anni e fa la stessa domanda a Bashir.
    note: Si riutilizza direttamente lo schema per rispondere sull'età visto nella lezione 4.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir risponde
    gloss: Bashir dice di avere 26 anni.
    note: Conclude lo scambio sull'età.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun chiede il numero di telefono a Bashir
    gloss: Homayoun chiede il numero di telefono a Bashir.
    note: تلفنت usa la desinenza possessiva informale, in linea con il registro del resto del dialogo.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir dice il suo numero di telefono
    gloss: Bashir legge il suo numero di telefono a piccoli gruppi.
    note: Il numero è letto a gruppi, in modo naturale, come nell'esempio della lezione 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun conferma di averlo salvato
    gloss: Homayoun ringrazia e dice che lo salva subito.
    note: سیف می‌کنم (dall'inglese «save») è un prestito informale, legato alla tecnologia e molto comune in Afghanistan, adatto a questo scambio tra amici.
