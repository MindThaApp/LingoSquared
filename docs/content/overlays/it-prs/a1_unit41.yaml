course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: segnalare lo smarrimento di un oggetto personale, chiedere se è stato ritrovato, descriverlo per colore e dimensione e leggere un breve brano su un oggetto smarrito.'
units:
  prs.a1.unit41.lost_items:
    title: Oggetti smarriti
    description: Segnala lo smarrimento di un oggetto personale, chiedi se è stato ritrovato, descrivilo e riconoscilo quando lo ritrovi.
lessons:
  prs.a1.unit41.lesson01.lost_item_vocabulary:
    title: Lessico degli oggetti smarriti
  prs.a1.unit41.lesson02.asking_if_found:
    title: Chiedere se è stato ritrovato
  prs.a1.unit41.lesson03.describing_the_item:
    title: Descrivere l'oggetto
  prs.a1.unit41.lesson04.lost_bag_dialogue:
    title: Dialogo sulla borsa smarrita
  prs.a1.unit41.lesson05.reading:
    title: Lettura sulla borsa smarrita
  prs.a1.unit41.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Ripasso: questo, è'
    gloss: questo / è
    note: این e است sono parole di ripasso usate per dire che cosa è qualcosa.
    target_text: این (questo) / است (è)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Ripasso: io ho'
    gloss: ho
    note: دارم è una parola di ripasso che si usa per dire quale oggetto possiedi o hai con te.
    target_text: دارم (ho)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Borsa
    gloss: borsa
    note: خریطه è la parola dari standard per «borsa».
    example_gloss: Ho una borsa.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Portafoglio
    gloss: portafoglio
    note: کیف پول significa «portafoglio» e unisce letteralmente کیف (borsa, custodia) e پول (denaro).
    example_gloss: Ho un portafoglio.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Chiave
    gloss: chiave
    note: کلید significa «chiave».
    example_gloss: Ho una chiave.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Occhiali
    gloss: occhiali
    note: عینک significa occhiali (da vista).
    example_gloss: Ho gli occhiali.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: È perso
    gloss: è perso / è andato perso
    note: 'گم شده unisce گم (perso) e شده (è diventato): è il modo normale per dire che qualcosa è perso, con lo stesso schema di زخمی است (è ferito) dell''Unità 40.'
    example_gloss: La mia borsa è persa.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: Il mio portafoglio è perso!
    gloss: Ho perso il portafoglio!
    note: کیف پولم unisce کیف پول al suffisso possessivo -م (mio), come خانه‌ام (la mia casa) nelle unità precedenti.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'Ripasso: puoi / può, me, aiuto, fare (imperativo di cortesia)'
    gloss: può / me / aiuto / faccia
    note: می‌توانین, مه ره, کمک e کنین insieme servono a chiedere aiuto.
    target_text: می‌توانین (può) / مه ره (me) / کمک (aiuto) / کنین (faccia — imperativo di cortesia)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'Ripasso: (marca dell''oggetto)'
    gloss: (marca dell'oggetto)
    note: 'را indica la cosa su cui ricade l''azione: qui, la cosa che è stata vista.'
    target_text: را (marcatore dell'oggetto)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: Ha visto?
    gloss: ha visto / avete visto
    note: دیدین è la forma di cortesia (2ª persona plurale) del passato di دیدن (vedere), già incontrato nell'Unità 2 in از دیدن شما خوشحال شدم.
    example_gloss: Ha visto la mia borsa?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: Ha visto la mia borsa?
    gloss: Ha visto la mia borsa?
    note: Unisce خریطه‌ام (la mia borsa) a را e دیدین per chiedere se qualcuno l'ha notata.
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: È stato trovato
    gloss: è stato trovato / è saltato fuori
    note: 'پیدا شده unisce پیدا (trovato/disponibile) e شده (è diventato): è il modo normale per chiedere se qualcosa è saltato fuori.'
    example_gloss: La mia chiave è stata trovata.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: La mia chiave è stata trovata?
    gloss: Hanno trovato la mia chiave?
    note: کلیدم unisce کلید al suffisso possessivo -م (la mia chiave).
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 'Ripasso: colore, nero, bianco, e'
    gloss: colore / nero / bianco / e
    note: رنگ, سیاه, سفید e و servono a descrivere il colore di un oggetto.
    target_text: رنگ (colore) / سیاه (nero) / سفید (bianco) / و (e)
  prs.a1.unit41.lesson03.teach.review_size:
    title: 'Ripasso: grande, piccolo'
    gloss: grande / piccolo
    note: بزرگ e کوچک descrivono la dimensione di un oggetto.
    target_text: بزرگ (grande) / کوچک (piccolo)
  prs.a1.unit41.lesson03.teach.here_word:
    title: Qui
    gloss: qui
    note: اینجا significa qui.
    example_gloss: La chiave è qui.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: La mia borsa è nera
    gloss: La mia borsa è nera.
    note: خریطه‌ام (la mia borsa) più سیاه (nero) descrive l'oggetto per aiutare a riconoscerlo.
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: Il mio portafoglio è piccolo e nero
    gloss: Il mio portafoglio è piccolo e nero.
    note: 'و (e) unisce due aggettivi: کوچک (piccolo) e سیاه (nero).'
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 'Ripasso: che cosa, grazie mille'
    gloss: che cosa / grazie mille
    note: چه e تشکر زیاد sono parole di ripasso usate nel dialogo.
    target_text: چه (che cosa) / تشکر زیاد (grazie mille)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 'Ripasso: sì, prego'
    gloss: sì / prego
    note: بلی e خواهش می‌کنم sono parole di ripasso usate nel dialogo.
    target_text: بلی (sì) / خواهش می‌کنم (prego)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, ho perso la borsa!'
    gloss: Zarmina, ho perso la borsa!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Di che colore è?'
    gloss: Di che colore è?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: 'Homayoun: È nera.'
    gloss: È nera.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sì, l''ho vista! È qui.'
    gloss: Sì, l'ho vista! È qui.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Grazie mille!'
    gloss: Grazie mille!
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Prego.'
    gloss: Prego.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: 'Ripasso: uno, ha'
    gloss: uno / ha
    note: یک e دارد sono parole di ripasso usate nel brano di lettura.
    target_text: یک (uno) / دارد (ha)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: Lettura su una borsa smarrita
    gloss: Homayoun ha una borsa. La sua borsa è nera. La sua borsa è andata persa. Zarmina vede la borsa. La borsa è qui!
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: 'Ripasso: non ho, ma, Lei (forma di cortesia)'
    gloss: non ho / ma / Lei (cortesia)
    note: ندارم, اما e شما sono parole di ripasso usate per contrapporre un possesso e per fare una domanda formale.
    target_text: ندارم (non ho) / اما (ma) / شما (Lei, forma di cortesia)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: Ho la chiave, ma non ho la borsa
    gloss: Ho la chiave, ma non ho la borsa.
    note: اما contrappone l'avere la chiave al non avere la borsa.
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: Ha visto la mia borsa?
    gloss: Lei ha visto la mia borsa?
    note: La versione di cortesia con شما all'inizio, per rivolgere una domanda diretta in modo educato.
