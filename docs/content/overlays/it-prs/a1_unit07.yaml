course:
  title: Italiano–Dari A1
  description: 'Dari afghano per principianti: rispondere al telefono, presentarsi in una chiamata, chiedere di ripetere o di parlare lentamente, lasciare un messaggio e scrivere semplici messaggi di testo.'
units:
  prs.a1.unit07.communication:
    title: Parlare al telefono
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: Rispondere al telefono
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Presentarsi in una chiamata
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Chiedere di ripetere o di parlare più lentamente
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Lasciare un messaggio
  prs.a1.unit07.lesson05.text_messages:
    title: Leggere e scrivere un breve messaggio di testo
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: Una telefonata completa
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Pronto (al telefono)
    gloss: pronto (al telefono)
    note: الو si usa specificamente per rispondere o iniziare una telefonata, diversamente da سلام, che si usa di persona.
    example_gloss: Pronto, sono Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Invitare chi chiama a continuare
    gloss: Sì, prego.
    note: بلی، بفرمایین è il modo naturale di rispondere dopo aver alzato la cornetta; usa il cortese بفرمایین («prego», «dica») già incontrato in questo corso. Non è una traduzione letterale di «sono in ascolto».
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Telefono (ripasso)
    gloss: telefono
    note: تلفن è stato introdotto nell'unità sui numeri; qui è l'ambientazione dell'intera unità.
    example_gloss: Il mio telefono è rotto.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Chiedere chi sta chiamando
    gloss: Scusi, chi parla?
    note: ببخشین، کی صحبت می‌کند؟ chiede con cortesia l'identità di chi chiama.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Presentarsi
    gloss: Sono Farid.
    note: من فرید استم dice direttamente chi sta chiamando, con lo stesso schema con استم delle unità precedenti.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Spiegare il tuo legame con la persona chiamata
    gloss: Sono un collega di Homayoun.
    note: همکار همایون استم spiega il motivo della chiamata, ed è utile quando chi risponde non ti conosce.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Chiedere di parlare lentamente
    gloss: Parli lentamente, per favore.
    note: لطفاً آهسته صحبت کنین è una richiesta naturale e cortese quando la linea è disturbata o quando si sta imparando la lingua.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Chiedere di ripetere (ripasso)
    gloss: Potrebbe ripeterlo?
    note: می‌توانین دوباره بگویین؟ è stato introdotto nell'unità sulle presentazioni; vale altrettanto bene per una telefonata.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Unire le due richieste
    gloss: Per favore, parli lentamente e lo ripeta.
    note: و unisce le due richieste in un'unica frase naturale.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Messaggio
    gloss: messaggio
    note: پیام è la parola generica per «messaggio», parlato o scritto.
    example_gloss: Ho un messaggio per Lei.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Dire che vuoi lasciare un messaggio
    gloss: Voglio lasciare un messaggio.
    note: می‌خواهم یک پیام بگذارم si dice quando la persona che chiami non è disponibile.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Dire che richiamerai più tardi
    gloss: Richiamo più tardi.
    note: بعد زنگ می‌زنم è una semplice alternativa al lasciare un messaggio.
  prs.a1.unit07.lesson05.teach.short_message:
    title: Messaggio
    gloss: messaggio di testo (SMS)
    note: پیام کوتاه significa letteralmente «messaggio breve» ed è il modo di dire quotidiano per indicare un SMS.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Un messaggio d'esempio
    gloss: Domani la riunione è alle nove.
    note: فردا جلسه ساعت نه است è un'informazione completa e naturale da riferire in un messaggio.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Confermare che riferirai il messaggio
    gloss: Lo riferisco / glielo faccio avere.
    note: می‌رسانم conferma che il messaggio arriverà al destinatario.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima risponde al telefono
    gloss: Lima risponde con il saluto telefonico.
    note: الو؟ è il modo standard di rispondere a una chiamata in arrivo.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid la saluta e verifica chi è
    gloss: Farid la saluta e le chiede se è Lima.
    note: الو، سلام unisce il saluto telefonico e il saluto di tutti i giorni.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima lo invita a continuare e chiede chi chiama
    gloss: Lima lo invita a continuare e chiede chi sta chiamando.
    note: بلی، بفرمایین e کی صحبت می‌کند؟ provengono entrambi dalle lezioni 1 e 2.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid si presenta
    gloss: Farid dice di essere un collega di Homayoun.
    note: Riprende lo schema del collega della lezione 2 e dà a Lima un motivo per fidarsi della chiamata.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima gli chiede di parlare lentamente
    gloss: Lima lo saluta e gli chiede di parlare lentamente.
    note: آهسته صحبت کنین، لطفاً riprende la richiesta della lezione 3.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid accetta e chiede di lasciare un messaggio
    gloss: Farid accetta e dice di voler lasciare un messaggio per Homayoun.
    note: Estende lo schema di پیام della lezione 4 indicando un destinatario preciso (برای همایون, «per Homayoun»).
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima accetta di scriverlo
    gloss: Lima lo invita a proseguire e dice che sta scrivendo.
    note: بفرمایین qui invita Farid a continuare a parlare.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid dà il contenuto del messaggio
    gloss: Farid le chiede di dire che la riunione è domani alle nove.
    note: Riprende direttamente il messaggio d'esempio della lezione 5.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima conferma e promette di riferirlo
    gloss: Lima conferma i dettagli e dice che lo riferirà.
    note: می‌رسانم chiude la parte della chiamata dedicata al messaggio, come visto nella lezione 5.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid la ringrazia e la saluta
    gloss: Farid la ringrazia molto e la saluta.
    note: تشکر زیاد e خدا حافظ riprendono entrambi il lessico delle unità precedenti.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima saluta
    gloss: Lima saluta.
    note: خدا حافظ chiude la chiamata.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Dire che qualcuno ha lasciato un messaggio (passato)
    gloss: Farid ha lasciato un messaggio.
    note: گذاشت è il passato semplice («ha lasciato») del verbo usato in می‌خواهم یک پیام بگذارم della lezione 4, dove بگذارم significa «lascio». Si usa per riassumere ciò che è successo dopo una chiamata.
    target_text: فرید پیام گذاشت (Farid ha lasciato un messaggio)
