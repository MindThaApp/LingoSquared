    example_gloss: Ascoltare musica è il mio hobby.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: Guardare film
    gloss: guardare film
    note: فلم دیدن significa letteralmente "vedere film" -- فلم (film) + دیدن (vedere).
    example_gloss: Guardare film è il mio hobby.
