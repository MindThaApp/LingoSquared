    target_text: هم (anche) / گاهی (a volte) / و (e)
  prs.a1.unit26.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, che cosa fai nel tempo libero?'
    gloss: 'Homayoun: Zarmina, che cosa fai nel tempo libero?'
    note: Una domanda informale tra amici, con تو/-ی.
  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Mi piace leggere e a volte ascolto anche musica'
    gloss: 'Zarmina: Mi piace leggere e a volte ascolto anche musica.'
    note: Unisce due attività con و (e).
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Faccio una passeggiata ogni settimana'
    gloss: 'Homayoun: Ogni settimana faccio una passeggiata.'
    note: Riprende la frase della lezione 3 *من هر هفته پیاده‌روی می‌کنم* (Ogni settimana faccio una passeggiata).
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Bene! Anche a me piace guardare i film'
    gloss: 'Zarmina: Bene! Anche a me piace guardare i film.'
    note: Usa هم (anche) con una nuova attività.
  prs.a1.unit26.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Anch''io a volte cucino'
    gloss: 'Homayoun: Anch''io a volte cucino.'
    note: Usa گاهی (a volte) e می‌کنم con آشپزی.
  prs.a1.unit26.lesson05.teach.reading_passage:
    title: Lettura sugli hobby
    gloss: A Zarmina piace leggere. Nel tempo libero Homayoun fa passeggiate. A volte anche lui cucina.
    note: 'Un breve brano che riassume le parole sugli hobby dell''unità: ripassa او (lui/lei) e introduce le forme della terza persona, molto usate, می‌کند (fa) e دارد (ha / gli piace).'
