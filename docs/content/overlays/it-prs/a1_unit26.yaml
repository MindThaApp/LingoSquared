course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: vocabolario di hobby e tempo libero (leggere, ascoltare musica, guardare film, camminare, cucinare), come chiedere a qualcuno che cosa gli piace fare nel tempo libero con دوست دارین, la frequenza con هر هفته/آخر هفته e un dialogo tra Zarmina e Homayoun che confronta come passano il tempo libero.'
units:
  prs.a1.unit26.hobbies:
    title: Hobby
    description: Descrivi che cosa fai tu e che cosa fanno gli altri per divertirsi nel tempo libero e chiedi a qualcuno dei suoi hobby.
