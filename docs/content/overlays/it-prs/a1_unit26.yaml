    title: Camminare
    gloss: camminare
    note: پیاده‌روی significa camminare (come attività o esercizio fisico).
    example_gloss: Camminare è il mio hobby.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: Cucinare
    gloss: cucinare
    note: آشپزی significa cucinare, cucina (l'attività).
