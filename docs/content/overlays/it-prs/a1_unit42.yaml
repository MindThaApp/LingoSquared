teaching:
  prs.a1.unit42.lesson01.teach.review_appointment_doctor_have:
    title: 'Ripasso: appuntamento, dottore, ho, è'
    gloss: appuntamento / dottore / ho / è
    note: قرار، داکتر، دارم e است sono parole di ripasso che servono per parlare di un appuntamento.
    target_text: قرار (appuntamento) / داکتر (medico) / دارم (ho) / است (è)
  prs.a1.unit42.lesson01.teach.review_want_one:
    title: 'Ripasso: voglio, un/uno/una'
    gloss: voglio / un / uno / una
    note: می‌خواهم e یک si combinano per dire che cosa vuoi.
    target_text: می‌خواهم (voglio) / یک (un / uno)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Dente
    gloss: dente
    note: دندان è la parola dari standard per «dente».
    example_gloss: Ho un dente.
  prs.a1.unit42.lesson01.teach.dentist_phrase:
    title: Il dentista
    gloss: dentista
    note: داکتر دندان significa letteralmente «medico dei denti» ed è la parola standard del dari afghano per dire dentista.
  prs.a1.unit42.lesson01.teach.want_appointment_phrase:
    title: Vorrei un appuntamento
    gloss: Vorrei un appuntamento.
    note: یک قرار می‌خواهم unisce یک (un/uno), قرار (appuntamento) e می‌خواهم (voglio).
  prs.a1.unit42.lesson01.teach.review_with:
    title: 'Ripasso: con'
    gloss: con
    note: با significa «con».
    target_text: با (con)
