teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Questo
    gloss: questo
    note: این significa «questo».
    example_gloss: Questo è più grande.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Quello
    gloss: quello
    note: 'آن significa «quello»: il dari di questo corso usa la forma piena آن, non la forma colloquiale iraniana اون.'
    example_gloss: Quello è più piccolo.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: È più grande
    gloss: è più grande
    note: 'بزرگ‌تر است è la forma piena, non contratta («è più grande»): *بزرگ‌تر* è il comparativo di *بزرگ* (grande) e *است* resta una parola separata.'
    example_gloss: Questo è più grande di quello.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: È più piccolo
    gloss: è più piccolo
    note: کوچک‌تر است è la forma piena («è più piccolo»); کوچک è l'ortografia standard del dari (non la forma colloquiale iraniana کوچیک).
    example_gloss: Quello è più piccolo di questo.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Di / che (nel confronto)
    gloss: di / che (nel confronto)
    note: 'از introduce il termine di paragone: X از Y بزرگ‌تر است significa «X è più grande di Y».'
    target_text: از (di/che, nel confronto)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Costa di più
    gloss: costa di più
    note: گران‌تر است è la forma piena («costa di più», «è più caro»); گران è l'ortografia standard del dari (non la forma colloquiale iraniana گرون).
    example_gloss: Questo costa più di quello.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Costa di meno
    gloss: costa di meno
    note: ارزان‌تر است è la forma piena («costa di meno», «è più economico»); ارزان è l'ortografia standard del dari (non la forma colloquiale iraniana ارزون).
    example_gloss: Quello costa meno di questo.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim e Negar
    gloss: Karim, Negar
    note: Nomi afghani comuni, usati in tutto il corso.
    example_gloss:
    - Io sono Karim.
    - Io sono Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Più alto
    gloss: più alto / è più alto/alta
    note: '*قد بلندتر است* significa letteralmente «la statura è più alta»: *قد* (statura), *بلندتر* (più alto, comparativo di *بلند*, alto), *است* (è).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Più giovane
    gloss: più giovane / è più giovane
    note: جوان‌تر است è la forma completa (è più giovane) -- جوان è l'ortografia standard del dari (non il colloquiale iraniano جوون).
    example_gloss: Negar è più giovane di Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: È meglio
    gloss: è meglio
    note: بهتر است è la forma completa -- بهتر (migliore) è il comparativo irregolare di خوب (buono).
    example_gloss: Questo è meglio di quello.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: È peggio
    gloss: è peggio
    note: بدتر است è la forma completa -- بدتر (peggiore) è il comparativo irregolare di بد (cattivo).
    example_gloss: Quello è peggio di questo.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Perché
    gloss: perché
    note: چون introduce una causa.
    target_text: چون (perché)
  prs.a1.unit15.lesson04.teach.va_word:
    title: E
    gloss: e
    note: و significa «e» e collega due frasi o due elementi.
    target_text: و (e)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Testo di esempio con confronti
    gloss: Karim è più alto di Negar. Negar è più giovane di Karim.
    note: Un breve confronto in terza persona che unisce il lessico di questa unità.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim e Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim è più alto.
    - Negar è più giovane.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Ma
    gloss: ma
    note: اما significa «ma» e introduce un contrasto.
    target_text: اما (ma)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Sì
    gloss: sì
    note: بلی è la parola educata/formale per «sì», coerente con il registro di questo corso.
    example_gloss: Sì, questo costa di più.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim dice
    gloss: Questo costa più di quello, ma è migliore.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar risponde
    gloss: Sì, ma quello costa meno.
