teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: Dritto
    gloss: dritto
    note: مستقیم indica il procedere dritto in avanti.
    example_gloss: Vada dritto.
  prs.a1.unit06.lesson01.teach.left:
    title: Sinistra
    gloss: sinistra
    note: چپ è la direzione sinistra.
    example_gloss: Gira a sinistra.
  prs.a1.unit06.lesson01.teach.right:
    title: Destra
    gloss: destra
    note: راست è la direzione destra.
    example_gloss: Gira a destra.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: Girate (imperativo di cortesia)
    gloss: girare
    note: بپیچین è la forma di cortesia dell'imperativo del verbo «girare», usata per dare indicazioni a qualcuno.
    example_gloss: Gira a destra.
  prs.a1.unit06.lesson01.teach.to_word:
    title: A / verso
    gloss: a / verso
    note: به si unisce a una parola di direzione, come in به چپ (a sinistra).
    target_text: به (a/verso)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: Dire a qualcuno di andare dritto
    gloss: Vai dritto.
    note: مستقیم بروین è l'indicazione di base, nella forma imperativa di cortesia.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: Dire a qualcuno di girare a sinistra
    gloss: Gira a sinistra.
    note: به چپ بپیچین significa letteralmente «girate a sinistra».
  prs.a1.unit06.lesson02.teach.turn_right:
    title: Dire a qualcuno di girare a destra
    gloss: Gira a destra.
    note: به راست بپیچین segue lo stesso schema, con راست al posto di چپ.
  prs.a1.unit06.lesson03.teach.first_word:
    title: Prima
    gloss: prima
    note: اول indica il primo passaggio in una sequenza di indicazioni.
    example_gloss: Prima andate dritto.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Poi
    gloss: poi
    note: بعد indica il passaggio successivo al primo.
    example_gloss: Poi gira a sinistra.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: Unire due passaggi di un'indicazione
    gloss: Prima andate dritto, poi girate a destra.
    note: اول e بعد permettono di mettere in sequenza più passaggi in una sola indicazione.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Chiedere con cortesia come arrivare in un posto
    gloss: Potrebbe dirmi come arrivare al mercato?
    note: می‌توانین بگویین...؟ è un modo cortese per chiedere «Potrebbe dirmi...?» e va bene per chiedere indicazioni a uno sconosciuto. بروم significa «io vado», quindi la frase intera chiede come si può arrivare lì.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Chiedere dove si trova un luogo (ripasso)
    gloss: Scusi, dov'è la farmacia?
    note: ببخشین، [place] کجاست؟ è stata introdotta nell'unità sui luoghi; è un modo naturale per iniziare prima di chiedere indicazioni.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Confermare di aver capito
    gloss: Grazie mille, ho capito.
    note: تشکر زیاد، فهمیدم chiude con cortesia lo scambio e conferma che le indicazioni erano chiare.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Ufficio (ripasso)
    gloss: ufficio
    note: دفتر è già stata introdotta in un'unità precedente; qui è usata come destinazione per esercitare lo schema per chiedere indicazioni con cortesia.
    example_gloss: L'ufficio è vicino.
  prs.a1.unit06.lesson05.teach.after_word:
    title: Dopo
    gloss: dopo
    note: بعد از introduce un punto di riferimento che si incontra prima della destinazione.
    example_gloss: Dopo la moschea c'è la banca.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: Di fronte / dirimpetto
    gloss: di fronte / dirimpetto
    note: روبه‌رو è un nuovo sinonimo di مقابل (di fronte), introdotto nell'unità sui luoghi; nel dari di ogni giorno si usano entrambi per dire «di fronte».
    example_gloss: La banca è di fronte alla moschea.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Dare un'indicazione con un punto di riferimento
    gloss: Dopo la moschea, la banca è di fronte a Lei.
    note: بعد از مسجد، بانک روبه‌روی شماست unisce un punto di riferimento (بعد از مسجد) a una posizione relativa (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: Scuola (ripasso)
    gloss: scuola
    note: مکتب è stata introdotta nell'unità sui luoghi; qui è usata come punto di riferimento nella frase di pratica.
    example_gloss: La scuola è vicina.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila chiede indicazioni
    gloss: Sohaila chiede con cortesia a un negoziante come arrivare alla farmacia.
    note: ببخشین apre la domanda con rispetto, e می‌توانین بگویین؟ è la formula cortese per chiedere indicazioni, vista nella lezione 4.
  prs.a1.unit06.lesson06.teach.turn02:
    title: Il negoziante dà il primo passaggio
    gloss: Il negoziante conferma e dice di andare prima dritto.
    note: اول مستقیم بروین apre la sequenza di indicazioni.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila conferma e chiede cosa viene dopo
    gloss: Sohaila ripete «dritto» per conferma, poi chiede cosa viene dopo.
    note: بعد چطور؟ è un modo naturale e sintetico per chiedere il passaggio successivo.
  prs.a1.unit06.lesson06.teach.turn04:
    title: Il negoziante dà il secondo passaggio e il punto di riferimento
    gloss: Il negoziante dice di girare a sinistra, poi indica dove si trova la farmacia usando la moschea e la banca come punti di riferimento.
    note: Qui si uniscono l'indicazione di svolta della lezione 2 e lo schema dei punti di riferimento della lezione 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila lo ringrazia e conferma di aver capito
    gloss: Sohaila lo ringrazia molto e dice di aver capito.
    note: تشکر زیاد، فهمیدم chiude lo scambio, come visto nella lezione 4.
  prs.a1.unit06.lesson06.teach.turn06:
    title: La risposta modesta del negoziante e il saluto
    gloss: Il negoziante minimizza il ringraziamento e le augura buon viaggio.
    note: قابلی نداره è stata introdotta nell'unità sui luoghi; سفر خوش (buon viaggio) è un saluto naturale per chi sta per andare a piedi da qualche parte.
