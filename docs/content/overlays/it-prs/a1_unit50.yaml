teaching:
  prs.a1.unit50.lesson01.teach.review_this_is_in:
    title: 'Ripasso: questo, è, in'
    gloss: questo / è / in
    note: Sono parole di ripasso (usate in tutto il corso) per parlare della piscina.
    target_text: این (questo) / است (è) / در (in)
  prs.a1.unit50.lesson01.teach.pool_word:
    title: Piscina
    gloss: piscina
    note: Questo è il termine dari per «piscina», un'espressione che trovi in una domanda come «L'hotel ha la piscina?»
    example_gloss: Questa è una piscina.
  prs.a1.unit50.lesson01.teach.staff_word:
    title: Personale / dipendente
    gloss: personale / dipendente
    note: È una parola generica per indicare un membro del personale, qui usata per la persona che lavora in piscina.
    example_gloss: Il dipendente è in piscina.
  prs.a1.unit50.lesson01.teach.this_is_pool_phrase:
    title: Questa è una piscina
    gloss: Questa è una piscina.
    note: Unisce «questo», «è» e «piscina» nello stesso modo in cui il corso ha già unito queste parole altrove.
  prs.a1.unit50.lesson01.teach.staff_at_pool_phrase:
    title: Il dipendente è in piscina
    gloss: Il dipendente è in piscina.
    note: Unisce «dipendente», «in» e «piscina».
  prs.a1.unit50.lesson02.teach.review_want_get_ticket:
    title: 'Ripasso: voglio, che io prenda, biglietto, uno/un'
    gloss: voglio / che io prenda / biglietto / uno/un
    note: «Che io prenda» è la forma attesa del congiuntivo di un verbo già studiato, costruita come tutti gli altri congiuntivi del corso (che io lavi, che io prenda).
    target_text: می‌خواهم (voglio) / بگیرم (che io prenda — congiuntivo) / تکت (biglietto) / یک (uno / un)
  prs.a1.unit50.lesson02.teach.want_ticket_phrase:
    title: Voglio fare un biglietto
    gloss: Vorrei fare un biglietto.
    note: Amplia lo stesso schema «volere + congiuntivo» già usato per il prestito in biblioteca, per prendere un appuntamento, noleggiare una bicicletta e usare la lavanderia.
  prs.a1.unit50.lesson02.teach.review_price_words:
    title: 'Ripasso: quanto, afghani, venti, è'
    gloss: quanto / afghani / venti / è
    note: Sono parole di ripasso (di unità precedenti) usate per chiedere il prezzo del biglietto.
    target_text: چند (quanto) / افغانی (afghani) / بیست (venti) / است (è)
  prs.a1.unit50.lesson02.teach.ask_ticket_price_phrase:
    title: Quanto costa il biglietto?
    gloss: Quanto costa il biglietto?
    note: Unisce le parole insegnate prima in questa lezione.
  prs.a1.unit50.lesson02.teach.ticket_price_answer_phrase:
    title: Costa 20 afghani
    gloss: Costa 20 afghani.
    note: Indica il prezzo con numeri e valuta già studiati.
  prs.a1.unit50.lesson03.teach.locker_word:
    title: Armadietto
    gloss: armadietto
    note: È la parola dari di uso quotidiano per armadio o armadietto, qui usata per l'armadietto della piscina.
    example_gloss: L'armadietto è il numero tre.
  prs.a1.unit50.lesson03.teach.review_where_number_three:
    title: 'Ripasso: dov''è, numero, tre'
    gloss: dov'è / numero / tre
    note: Sono parole di ripasso usate per chiedere e indicare il numero dell'armadietto.
    target_text: کجاست (dov'è) / نمبر (numero) / سه (tre)
  prs.a1.unit50.lesson03.teach.where_locker_phrase:
    title: Dov'è l'armadietto?
    gloss: Dov'è l'armadietto?
    note: Unisce «armadietto» e «dov'è».
  prs.a1.unit50.lesson03.teach.your_locker_number_phrase:
    title: Il tuo armadietto è il numero tre
    gloss: Il tuo armadietto è il numero tre.
    note: «Il tuo armadietto» usa lo stesso suffisso di «la tua lavanderia» dell'Unità 49 e «il tuo noleggio» dell'Unità 48.
  prs.a1.unit50.lesson03.teach.closed_word:
    title: Chiuso
    gloss: chiuso
    note: È la parola dari di uso quotidiano per «chiuso», qui usata per indicare l'orario di chiusura della piscina.
    example_gloss: La piscina è chiusa.
  prs.a1.unit50.lesson03.teach.open_word:
    title: Aperto
    gloss: aperto
    note: È la parola dari di uso quotidiano per «aperto», qui usata per indicare quando la piscina è aperta.
    example_gloss: La piscina è aperta.
  prs.a1.unit50.lesson03.teach.review_when_hour_five:
    title: 'Ripasso: quando, ore, cinque'
    gloss: quando / ore / cinque
    note: Sono parole di ripasso usate per chiedere e indicare l'orario di chiusura.
    target_text: کی (quando) / ساعت (ora / alle) / پنج (cinque)
  prs.a1.unit50.lesson03.teach.ask_when_closed_phrase:
    title: Quando chiude la piscina?
    gloss: Quando chiude la piscina?
    note: Unisce «piscina», «quando» e «chiuso».
  prs.a1.unit50.lesson03.teach.closed_at_five_phrase:
    title: Chiude alle 5
    gloss: Chiude alle 5.
    note: Indica l'orario di chiusura con «ore» e «cinque», già studiati.
  prs.a1.unit50.lesson04.teach.review_hello_want_get:
