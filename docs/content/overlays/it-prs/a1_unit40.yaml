course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: riconoscere un''emergenza di base, chiedere aiuto, dire se serve la polizia, un''ambulanza o i vigili del fuoco, descrivere una ferita e leggere un breve testo sulle emergenze.'
units:
  prs.a1.unit40.emergencies:
    title: Emergenze
    description: Riconoscere un'emergenza di base, chiedere aiuto e dire che tipo di aiuto serve (polizia, ambulanza o vigili del fuoco).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Aiuto in caso di emergenza
  prs.a1.unit40.lesson02.asking_for_help:
    title: Chiedere aiuto
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Ferito e sanguinante
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Dialogo di emergenza
  prs.a1.unit40.lesson05.emergency_reading:
    title: Leggere di aiuto in emergenza
  prs.a1.unit40.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Ripasso: aiuto, voglio'
    gloss: aiuto / voglio
    note: کمک e می‌خواهم sono parole di ripasso usate in tutta l'unità per dire che tipo di aiuto serve.
    target_text: کمک (aiuto) / می‌خواهم (voglio)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Ripasso: questo, è'
    gloss: questo / è
    note: این e است sono parole di base già viste, usate per dire di che tipo di situazione si tratta.
    target_text: این (questo) / است (è)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Emergenza
    gloss: emergenza
    note: اضطراری significa emergenza/urgente.
    example_gloss: È un'emergenza.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Polizia
    gloss: polizia
    note: پولیس è la parola standard del dari afghano per "polizia" (un prestito dall'inglese), molto simile all'italiano.
    example_gloss: Mi serve la polizia.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Ambulanza
    gloss: ambulanza
    note: امبولانس significa ambulanza.
    example_gloss: Mi serve un'ambulanza.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Fuoco
    gloss: incendio
    note: آتش significa fuoco.
    example_gloss: C'è un incendio.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Vigili del fuoco
    gloss: vigili del fuoco
    note: اطفائیه è il termine d'uso quotidiano a Kabul per indicare i vigili del fuoco.
    example_gloss: Mi servono i vigili del fuoco.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: È un'emergenza! Ho bisogno della polizia!
    gloss: È un'emergenza! Ho bisogno della polizia!
    note: این اضطراری است unisce این (questo), اضطراری (emergenza) e است (è).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Ripasso: può/potete, fate (imperativo di cortesia), a/per, presto'
    gloss: può/potete / fate / a/per / presto
    note: می‌توانین, کنین, به e زود (delle unità precedenti) si combinano con altre parole per formare richieste e comandi cortesi.
    target_text: می‌توانین (puoi / può) / کنین (fate — imperativo di cortesia) / به (a / per) / زود (presto, in fretta)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Me
    gloss: mi / me
    note: 'مه ره è la forma parlata del dari di Kabul per مرا ("me" come complemento oggetto): مه è la forma parlata di من e ره è la forma parlata della particella dell''oggetto را. Nello scritto trovi di solito مرا, che è accettato.'
    example_gloss: Puoi aiutarmi?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Può aiutarmi?
    gloss: Può aiutarmi?
    note: Una frase dari reale e molto usata per chiedere aiuto direttamente.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Chiami! (imperativo)
    gloss: chiamare
    note: زنگ بزنین è l'imperativo di cortesia di زنگ زدن (telefonare, chiamare), sulla base di زنگ می‌زنم (chiamo), già visto.
    example_gloss: Chiami la polizia!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Venga! (imperativo)
    gloss: venire
    note: بیایین è l'imperativo di cortesia di آمدن (venire).
    example_gloss: Venga presto!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Chiami l'ambulanza!
    gloss: Chiami l'ambulanza!
    note: به (a/per) più امبولانس (ambulanza) più l'imperativo زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Ripasso: lui/lei, lui/lei ha'
    gloss: lui/lei / lui/lei ha
    note: او e دارد sono forme di ripasso usate per descrivere la condizione di un'altra persona in un'emergenza.
    target_text: او (lui/lei) / دارد (ha)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Ferito
    gloss: ferito
    note: زخمی significa ferito.
    example_gloss: È ferito/a.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Emorragia
    gloss: emorragia
    note: خون‌ریزی significa emorragia, perdita di sangue.
    example_gloss: Sta sanguinando.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: È ferito/a! Ho bisogno di un'ambulanza!
    gloss: È ferito/a! Ho bisogno di un'ambulanza!
    note: Unisce زخمی con امبولانس می‌خواهم, già visto.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: Sta sanguinando! Venga presto!
    gloss: Sta sanguinando! Venga presto!
    note: Unisce خون‌ریزی con زود بیایین, già visto.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Ripasso: che cosa, lui/lei viene, chiamo, grazie mille'
    gloss: che cosa / lui/lei viene / chiamo / grazie mille
    note: چه, می‌آید, زنگ می‌زنم e تشکر زیاد sono parole di ripasso usate nel dialogo di emergenza.
    target_text: چه (che cosa) / می‌آید (viene) / زنگ می‌زنم (telefono) / تشکر زیاد (grazie mille)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, aiuto! Aiuto!'
    gloss: Zarmina, aiuto! Aiuto!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Che cosa?'
    gloss: Che cosa?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun: È ferito/a! Sta sanguinando!'
    gloss: È ferito/a! Sta sanguinando!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Serve un''ambulanza. Chiamo!'
    gloss: Serve un'ambulanza. Chiamo!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Grazie mille!'
    gloss: Grazie mille!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina: L''ambulanza arriva presto.'
    gloss: L'ambulanza arriva presto.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Ripasso: uno, persona, città, lui/lei fa, in'
    gloss: uno / persona / città / lui/lei fa / in
    note: یک, نفر, شهر, می‌کند e در sono parole di ripasso usate in questo brano.
    target_text: یک (uno) / نفر (persona) / شهر (città) / می‌کند (fa) / در (in / a)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Lettura su un'emergenza
    gloss: In città una persona è ferita. Sta sanguinando. Homayoun aiuta. Arriva un'ambulanza.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Ripasso: telefono, non ho, ma, Lei (formale)'
    gloss: telefono / non ho / ma / Lei (formale)
    note: تلفن, ندارم, اما e شما sono parole di ripasso usate per contrapporre un bisogno a un limite e per fare una domanda formale.
    target_text: تلفن (telefono) / ندارم (non ho) / اما (ma) / شما (Lei, forma di cortesia)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Ho bisogno di aiuto, ma non ho il telefono
    gloss: Ho bisogno di aiuto, ma non ho il telefono.
    note: اما contrappone il bisogno di aiuto al fatto di non avere un telefono per chiamarlo.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Puoi aiutarmi?
    gloss: Può aiutare?
    note: La versione formale con شما per chiedere aiuto in modo diretto e cortese.
