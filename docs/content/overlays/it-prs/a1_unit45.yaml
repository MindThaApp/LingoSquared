course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: fare il check-in in hotel, chiedere dei servizi della camera (bagno, colazione, wifi) e della chiave, dire quante notti ti fermi, leggere una breve conferma di prenotazione e chiedere l''orario di check-out.'
units:
  prs.a1.unit45.accommodation:
    title: Hotel e camera
    description: Fai il check-in in hotel, chiedi dei servizi della camera e della chiave, indica la durata del soggiorno, leggi una conferma di prenotazione e chiedi l'orario di check-out.
lessons:
  prs.a1.unit45.lesson01.hotel_room_key_vocabulary:
    title: Hotel, camera e chiave
  prs.a1.unit45.lesson02.bathroom_and_reservation:
    title: Bagno e prenotazione
  prs.a1.unit45.lesson03.room_number_and_nights:
    title: Numero della camera e quante notti
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: 'Dialogo: il check-in in hotel'
  prs.a1.unit45.lesson05.reading:
    title: Leggere la prenotazione di Homayoun
  prs.a1.unit45.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Ripasso: questo, è, in'
    gloss: questo / è / in
    note: این, است e در (usate in tutto il corso) sono parole di ripasso per parlare di hotel e camere.
    target_text: این (questo) / است (è) / در (in)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: hotel
    note: هوتل è la parola del dari afghano per «hotel», scritta con una waw, diversa dalla forma persiana iraniana هتل.
    example_gloss: Questo è un hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Stanza
    gloss: stanza
    note: اتاق è la parola di uso quotidiano per «camera».
    example_gloss: La camera è nell'hotel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: La camera è nell'hotel
    gloss: La camera è nell'hotel.
    note: اتاق در هوتل است unisce parole imparate prima in questa lezione.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Chiave
    gloss: chiave
    note: کلید è la parola standard del dari per «chiave».
    example_gloss: Questa è una chiave.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Chiave della camera
    gloss: chiave della camera
    note: کلید اتاق unisce کلید (chiave) e اتاق (camera).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: Questa è la chiave della camera
    gloss: Questa è la chiave della camera.
    note: این کلید اتاق است unisce parole imparate prima in questa lezione.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Ripasso: ho, ha'
    gloss: ho / ha
    note: دارم e دارد sono parole di ripasso usate per chiedere dei servizi della camera.
    target_text: دارم (ho) / دارد (ha)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Bagno
    gloss: bagno
    note: تشناب è la parola di uso quotidiano per «bagno» o «toilette».
    example_gloss: La camera ha il bagno.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: La camera ha il bagno?
    gloss: La camera ha il bagno?
    note: اتاق تشناب دارد؟ è una domanda sì/no formata con l'intonazione ascendente, senza una parola interrogativa.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Sì, ha il bagno
    gloss: Sì, ha il bagno.
    note: بلی è la parola di ripasso per «sì».
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Prenotazione
    gloss: prenotazione
    note: رزرو è un prestito molto diffuso per «prenotazione».
    example_gloss: Ho una prenotazione.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: Ho una prenotazione
    gloss: Ho una prenotazione.
    note: رزرو دارم unisce رزرو (prenotazione) e دارم (ho).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Ripasso: quanti/che numero, per, voglio'
    gloss: quanti / che numero / per / voglio
    note: چند, برای e می‌خواهم sono parole di ripasso usate per fare domande sulla camera.
    target_text: چند (quanti / che numero) / برای (per) / می‌خواهم (voglio)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Numero
    gloss: numero
    note: 'نمبر è il prestito di uso quotidiano nel dari afghano per «numero»: si usa per i numeri di camera, di telefono e simili.'
    example_gloss: numero della camera
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: Qual è il numero della camera?
    gloss: Qual è il numero della camera?
    note: نمبر اتاق چند است؟ chiede il numero della camera usando چند.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Ripasso: notte, due, tre'
    gloss: notte / due / tre
    note: شب, دو e سه sono parole di ripasso usate per indicare la durata del soggiorno.
    target_text: شب (notte) / دو (due) / سه (tre)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Resto
    gloss: resto
    note: می‌مانم deriva da ماندن, «restare» o «fermarsi».
    example_gloss: Mi fermo due notti.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Mi fermo due notti
    gloss: Mi fermo due notti.
    note: دو شب می‌مانم unisce دو شب (due notti) e می‌مانم (resto).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: La voglio per due notti
    gloss: La voglio per due notti.
    note: برای دو شب می‌خواهم usa برای (per) con la parola di ripasso می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Ripasso: lei si ferma (formale)'
    gloss: lei si ferma (formale)
    note: می‌مانین è la forma di cortesia (plurale) di می‌مانم e fa parte della stessa famiglia in -ین di می‌خواهین/کنین, che trovi altrove in questo corso.
    target_text: می‌مانین (Lei resta, forma di cortesia)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: Quante notti si ferma?
    gloss: Quante notti si ferma?
    note: چند شب می‌مانین؟ è la domanda formale che farebbe il receptionist di un hotel.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Ripasso: benvenuto, come si chiama?, sono'
    gloss: benvenuto / come si chiama? / sono
    note: خوش آمدین, نام‌تان چیست؟ e استم sono parole di ripasso usate al check-in.
    target_text: خوش آمدین (benvenuto) / نام‌تان چیست؟ (come si chiama?) / استم (sono)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'Ripasso: anche, e invece, ecco a lei, grazie mille'
    gloss: anche / e invece / ecco a lei / grazie mille
    note: هم, چطور, بفرمایین e تشکر زیاد (viste nelle unità precedenti) sono parole di ripasso usate per chiudere il dialogo.
    target_text: هم (anche) / چطور (e per quanto riguarda / come) / بفرمایین (prego, ecco) / تشکر زیاد (grazie mille)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: La colazione
    gloss: colazione
    note: 'چای صبح significa letteralmente «tè del mattino»: è il modo quotidiano del dari afghano per dire «colazione», formato da چای (tè, unità 8) e صبح (mattina, unità 16).'
  prs.a1.unit45.lesson04.teach.included_word:
    title: Incluso
    gloss: incluso
    note: شامل significa «incluso» e si usa per dire che un servizio è compreso nella camera.
    example_gloss: La colazione è inclusa.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Wifi
    gloss: wifi
    note: وای‌فای è il prestito standard per «wifi».
    example_gloss: C'è anche il wifi.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Buongiorno. Ho una prenotazione. Mi fermo due notti.'
    gloss: Buongiorno. Ho una prenotazione. Mi fermo due notti.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Receptionist: Benvenuto. Come si chiama?'
    gloss: Benvenuto. Come si chiama?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Sono Homayoun.'
    gloss: Sono Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Receptionist: Molto bene. La camera ha il bagno e la colazione è inclusa.'
    gloss: Molto bene. La camera ha il bagno e la colazione è inclusa.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun: E il wifi?'
    gloss: E il wifi?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Receptionist: Sì, c''è anche il wifi. Ecco la chiave.'
    gloss: Sì, c'è anche il wifi. Ecco la chiave.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'Ripasso: prenotazione, numero, cinque, lunedì, martedì, e'
    gloss: prenotazione / numero / cinque / lunedì / martedì / e
    note: رزرو, نمبر (di questa unità), پنج, دوشنبه, سه‌شنبه e و sono parole di ripasso usate nel brano di lettura.
    target_text: رزرو (prenotazione) / نمبر (numero) / پنج (cinque) / دوشنبه (lunedì) / سه‌شنبه (martedì) / و (e)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'Ripasso: lui/lei si ferma'
    gloss: lui/lei si ferma
    note: می‌ماند è la forma della 3ª persona della famiglia می‌مانم/می‌مانین, vista prima in questa unità.
    target_text: می‌ماند (resta)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: 'Lettura: la prenotazione di Homayoun'
    gloss: 'Questa è la prenotazione di Homayoun. La camera è la numero cinque. Homayoun si ferma due notti: lunedì e martedì. La camera ha il bagno e la colazione è inclusa.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'Ripasso: ma, Lei (formale), ora, tempo/orario, sette, dodici'
    gloss: ma / Lei (formale) / ora / tempo, orario / sette / dodici
    note: اما, شما, ساعت, وقت (di unità precedenti) e هفت/دوازده sono parole di ripasso usate per indicare un orario.
    target_text: اما (ma) / شما (Lei, forma di cortesia) / ساعت (ora) / وقت (tempo) / هفت (sette) / دوازده (dodici)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Check-out / uscita
    gloss: check-out / uscita
    note: خروج indica il check-out, come in وقت خروج.
    example_gloss: orario del check-out
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: Il check-out è alle dodici
    gloss: Il check-out è alle dodici.
    note: وقت خروج ساعت دوازده است indica l'orario del check-out.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: La colazione è alle sette, ma il check-out è alle dodici
    gloss: La colazione è alle sette, ma il check-out è alle dodici.
    note: اما mette in contrasto l'orario della colazione e quello del check-out.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: A che ora è il Suo check-out?
    gloss: A che ora è il Suo check-out?
    note: La versione formale, con شما, della domanda sull'orario del check-out.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (molto bene) / چای (tè) / صبح (mattina) / و (e)
