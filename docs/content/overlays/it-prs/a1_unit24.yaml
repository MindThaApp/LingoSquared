    title: Vado
    gloss: vado
    note: می‌روم significa «vado» (già visto in precedenza nel corso).
    example_gloss: Vado a piedi.
  prs.a1.unit24.lesson02.teach.ba:
    title: In/con
    gloss: in/con
    note: با è la preposizione strumentale, usata per «con/in [mezzo di trasporto]».
    example_gloss: Vado in autobus.
