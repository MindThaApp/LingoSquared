    gloss: Vado in taxi.
    note: با تکسی می‌روم significa «Vado in taxi».
  prs.a1.unit24.lesson02.teach.chetor:
    title: Come
    gloss: come
    note: چطور significa «come».
    example_gloss: Come vai?
  prs.a1.unit24.lesson02.teach.chetor_miravi:
    title: Come vai?
    gloss: Come vai?
    note: Una domanda comune per chiedere a qualcuno con quale mezzo si sposta.
  prs.a1.unit24.lesson03.teach.ticket:
    title: Biglietto
    gloss: biglietto
    note: تکت significa «biglietto», un prestito di uso quotidiano molto comune.
    example_gloss: Compro un biglietto.
  prs.a1.unit24.lesson03.teach.station:
