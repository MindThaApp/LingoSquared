course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: il vocabolario dei trasporti (autobus, taxi, auto, bicicletta, a piedi), come dire in che modo ti sposti, comprare un biglietto e un dialogo tra Zarmina e Homayoun che confronta i modi di andare al lavoro.'
units:
