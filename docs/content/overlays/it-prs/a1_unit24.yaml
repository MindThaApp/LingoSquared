    gloss: Quanto costa il biglietto?
    note: Una domanda comune quando si compra un biglietto.
  prs.a1.unit24.lesson03.teach.review_khoram:
    title: Compro
    gloss: compro
    note: می‌خرم significa «compro» (già visto in precedenza nel corso).
    example_gloss: Compro un biglietto.
  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: 'Zarmina: Come vai in città?'
    gloss: 'Zarmina: Homayoun, come vai in città?'
    note: شهر significa «città», parola nuova in questa battuta.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Homayoun: Io vado a piedi, è vicino'
    gloss: 'Homayoun: Io vado a piedi, è vicino. E tu come vai?'
    note: نزدیک significa «vicino», parola nuova in questa battuta.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Zarmina: Io vado in taxi, è diretto e veloce'
    gloss: 'Zarmina: Io vado in taxi, è diretto e veloce.'
    note: تیز significa «veloce», parola nuova in questa battuta.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun: Anche l''autobus va bene, è economico'
    gloss: 'Homayoun: Anche l''autobus va bene, è economico.'
    note: ارزان significa «economico», parola nuova in questa battuta.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina: Sì, ma il taxi è più veloce'
    gloss: 'Zarmina: Sì, ma il taxi è più veloce.'
    note: اما significa «ma»; تیزتر è il comparativo «più veloce».
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Lettura sul tragitto quotidiano
    gloss: Zarmina va in città in taxi ogni giorno. Il taxi è veloce, ma non è economico. Homayoun va a piedi, perché la sua casa è vicina. Risparmia soldi per comprare un'auto.
    note: Un breve testo che riprende il vocabolario dell'unità e il connettivo «چون» (perché).
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: Bicicletta (ripasso)
    gloss: bicicletta
    note: دوچرخه significa «bicicletta» (ripasso della lezione 1).
    example_gloss: Vado in bicicletta.
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: Ogni giorno vado a piedi o in autobus
    gloss: Ogni giorno vado a piedi o in autobus.
    note: یا significa «o», parola nuova in questa frase finale di riepilogo.
