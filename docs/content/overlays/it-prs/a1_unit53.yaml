  prs.a1.unit53.lesson02.teach.museum_ticket_price_answer_phrase:
    title: Il biglietto costa 40 afghani
    gloss: Il biglietto costa 40 afghani.
    note: Indica il prezzo del biglietto del museo secondo l'avviso.
  prs.a1.unit53.lesson03.teach.review_ask_want_setup:
    title: 'Ripasso: Lei/voi (formale), che cos''è, io, voglio, un/uno'
    gloss: Lei/voi (formale) / che cos'è / io / voglio / un/uno
    note: Sono parole di ripasso per chiedere e dire che cosa si desidera.
    target_text: شما (Lei) / چیست (che cos'è) / من (io) / می‌خواهم (voglio) / یک (uno / un)
  prs.a1.unit53.lesson03.teach.review_exhibition_word:
    title: 'Ripasso: mostra'
    gloss: mostra
    note: È una parola di ripasso usata per chiedere che cos'è la mostra.
    target_text: نمایشگاه (mostra)
  prs.a1.unit53.lesson03.teach.ask_exhibition_phrase:
