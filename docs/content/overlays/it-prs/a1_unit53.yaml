    title: Riepilogo
teaching:
  prs.a1.unit53.lesson01.teach.review_this_is_in_good:
    title: 'Ripasso: questo, è, in, buono'
    gloss: questo / è / in / buono
    note: Sono parole di ripasso (usate in tutto il corso) per parlare del museo.
    target_text: این (questo) / است (è) / در (in) / خوب (buono)
  prs.a1.unit53.lesson01.teach.museum_word:
    title: Museo
    gloss: museo
    note: È la parola standard del dari afghano per «museo», diversa dal موزه del persiano iraniano.
    example_gloss: Il museo è bello.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Ripasso: addetto'
    gloss: addetto, dipendente
    note: È la stessa parola generica per «dipendente» già incontrata al cinema e in piscina, qui riusata per la biglietteria del museo.
    target_text: کارمند (impiegato)
  prs.a1.unit53.lesson01.teach.this_is_museum_phrase:
    title: Questo è un museo
    gloss: Questo è un museo.
    note: Unisce «questo», «è» e «museo» come già fatto altrove in questo corso.
  prs.a1.unit53.lesson01.teach.staff_at_museum_phrase:
    title: L'addetto è al museo
    gloss: L'addetto è al museo.
    note: Unisce «addetto», «in» e «museo».
  prs.a1.unit53.lesson02.teach.review_price_and_exhibit_words:
    title: 'Ripasso: quanto, afghani, è, quaranta, in, foto, interessante, biglietto'
    gloss: quanto / afghani / è / quaranta / in / foto / interessante / biglietto
    note: Sono parole di ripasso (da unità precedenti) per parlare del prezzo e della mostra del museo.
    target_text: چند (quanto) / افغانی (afghani) / است (è) / چهل (quaranta) / در (in) / عکس (foto) / جالب (interessante) / تکت (biglietto)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Mostra
    gloss: mostra
    note: 'È una parola standard del dari/persiano per «mostra»: نمایش (esposizione) più گاه (luogo).'
    example_gloss: La mostra fotografica è interessante.
  prs.a1.unit53.lesson02.teach.museum_notice_reading:
    title: Leggere l'avviso del museo
    gloss: Al museo c'è una mostra fotografica. Il biglietto costa 40 afghani.
