course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: visita un museo, leggi di una mostra e del prezzo del biglietto, acquista un biglietto d''ingresso, chiedi gli orari di apertura e racconta in modo semplice ciò che hai visto.'
units:
  prs.a1.unit53.museum:
    title: Il museo
    description: Visita un museo, acquista un biglietto d'ingresso, chiedi informazioni su una mostra o sugli orari di apertura e racconta in modo semplice ciò che hai visto.
