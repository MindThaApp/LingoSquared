teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Biglietto
    gloss: biglietto
    note: تکت significa biglietto. È la parola dari afghana di uso quotidiano; بلیط (scritta anche بلیت, la parola di tipo iraniano) è compresa e accettata, ma تکت è quella che sentirai più spesso.
    example_gloss: Ho un biglietto.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Treno
    gloss: treno
    note: قطار significa treno.
    example_gloss: Il treno è buono.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Autobus
    gloss: autobus
    note: بس significa autobus, un uso comune nel dari afghano.
    example_gloss: L'autobus è buono.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Aeroporto
    gloss: aeroporto
    note: 'میدان هوایی significa aeroporto: è il termine dari afghano usato in questo corso (non l''iraniano فرودگاه), in linea con l''Unità 5.'
    example_gloss: L'aeroporto è buono.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Un/uno/una
    gloss: un / uno
    note: یک significa uno ed è usato qui come articolo indeterminativo (un biglietto).
    target_text: یک (un/uno/una)
  prs.a1.unit16.lesson01.teach.az_word:
    title: Da
    gloss: da
    note: از significa da e indica la provenienza (da non confondere con l'altro uso, quello di «di» nei confronti).
    target_text: از (da)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Due
    gloss: due
    note: دو significa due.
    example_gloss: Ho due biglietti.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Binario due
    gloss: binario due
    note: سکوی دو unisce سکو (binario) al connettore ezafe -ی e a دو (due).
    target_text: سکوی دو (binario due)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: Una grande città dell'Afghanistan occidentale.
    example_gloss: Vado a Herat.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Voglio
    gloss: voglio
    note: می‌خواهم è la forma completa, non contratta, di «voglio», in linea con il registro di questo corso.
    target_text: می‌خواهم (voglio)
  prs.a1.unit16.lesson02.teach.be_word:
    title: A
    gloss: a / per
    note: 'به indica la destinazione: به هرات significa a Herat.'
    target_text: به (a)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Voglio un biglietto per Herat
    gloss: Voglio un biglietto per Herat
    note: یک تکت به هرات می‌خواهم riunisce il vocabolario di questa lezione nel modo standard per chiedere un biglietto.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Binario
    gloss: binario
    note: سکو significa binario (in una stazione ferroviaria).
    example_gloss: Il treno parte dal binario due.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Parte
    gloss: parte
    note: حرکت می‌کند è la forma completa, non contratta, di «parte / si muove».
    target_text: حرکت می‌کند (parte)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Quando
    gloss: quando
    note: کی significa quando e serve a chiedere l'orario.
    target_text: کی (quando)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Mattina
    gloss: mattina
    note: صبح significa mattina.
    example_gloss: Il treno parte alle otto del mattino.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Esempio di testo d'orario
    gloss: Il treno per Herat parte dal binario due alle otto del mattino.
    note: 'Un breve annuncio che unisce il vocabolario di viaggio di questa unità: poiché per il dari non c''è audio disponibile, questo testo scritto sostituisce un annuncio parlato in stazione.'
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Domani
    gloss: domani
    note: فردا significa domani.
    example_gloss: Parto domani mattina.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Molto bene / va bene
    gloss: molto bene / va bene
    note: بسیار خوب è il modo completo e formale per dire va bene / molto bene, in linea con il registro di questo corso (non il colloquiale باشه).
    example_gloss: Il treno è molto buono.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: Il viaggiatore dice
    gloss: Voglio un biglietto per Herat.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: Il venditore chiede
    gloss: Quando desidera partire?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: Il viaggiatore risponde
    gloss: Domani mattina.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: Il venditore conferma
    gloss: Molto bene, il treno parte dal binario due alle otto del mattino.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Grazie mille
    gloss: grazie mille
    note: تشکر زیاد è un modo educato e comune per dire grazie mille, già visto nelle Unità 5 e 6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: Prego
    gloss: prego / di nulla
    note: قابلی نداره è la risposta educata standard a un ringraziamento, già vista nelle Unità 5 e 6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Buon viaggio
    gloss: buon viaggio
    note: سفر خوش è un augurio di commiato comune per chi sta per partire, già visto nell'Unità 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: E
    gloss: e
    note: و significa e e collega due frasi o due elementi.
    target_text: و (e)
