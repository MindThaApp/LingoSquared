    target_text: این (questo) / است (è) / در (in)
  prs.a1.unit48.lesson01.teach.review_shop_shopkeeper_bike:
    title: 'Ripasso: negozio, negoziante, bicicletta'
    gloss: negozio / negoziante / bicicletta
    note: Negozio e negoziante sono parole di ripasso dell'Unità 10; bicicletta è una parola di ripasso dell'Unità 24.
    target_text: دوکان (negozio) / دوکاندار (negoziante) / دوچرخه (bicicletta)
  prs.a1.unit48.lesson01.teach.rent_word:
    title: Affitto / noleggio
    gloss: affitto / noleggio
    note: È la parola dari di uso quotidiano per il costo di un affitto o noleggio, già usata in questo corso per l'affitto della casa.
    example_gloss: Questo è un negozio di noleggio biciclette.
  prs.a1.unit48.lesson01.teach.this_is_bike_rental_shop_phrase:
    title: Questo è un negozio di noleggio biciclette
    gloss: Questo è un negozio di noleggio biciclette.
