course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: identificare e descrivere i colori degli oggetti di uso quotidiano, chiedere di che colore è qualcosa, dire e chiedere le preferenze di colore e descrivere la casa di una persona in un breve testo.'
