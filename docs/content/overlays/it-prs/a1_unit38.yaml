    title: 'Homayoun: Zarmina, di che colore è la tua macchina?'
    gloss: Zarmina, di che colore è la tua macchina?
  prs.a1.unit38.lesson04.teach.dialogue_line2:
    title: 'Zarmina: La mia macchina è blu.'
    gloss: La mia macchina è blu.
  prs.a1.unit38.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Di che colore è la tua camicia?'
    gloss: Di che colore è la tua camicia?
  prs.a1.unit38.lesson04.teach.dialogue_line4:
    title: 'Zarmina: La mia camicia è verde e bianca.'
    gloss: La mia camicia è verde e bianca.
  prs.a1.unit38.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Quale colore ti piace?'
    gloss: Quale colore ti piace?
  prs.a1.unit38.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Mi piace il colore blu.'
    gloss: Mi piace il colore blu.
  prs.a1.unit38.lesson05.teach.review_reading_words:
    title: 'Ripasso: lui/lei, stanza, tavolo, gli/le piace'
    gloss: lui/lei / stanza / tavolo / gli/le piace
    note: او, اتاق e میز sono parole di ripasso; دوست دارد è la forma della terza persona singolare di دوست داشتن (piacere), già usata in questo corso per altre persone.
    target_text: او (lui/lei) / اتاق (stanza) / میز (tavolo) / دوست دارد (a lui/lei piace)
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: Lettura sulla casa di Zarmina
    gloss: Questa è la casa di Zarmina. La sua casa è bianca e blu. La sua stanza è verde. Il suo tavolo è marrone. Le piace il colore verde.
  prs.a1.unit38.lesson06.teach.review_like_dislike:
    title: 'Ripasso: mi piace, non mi piace'
    gloss: mi piace / non mi piace
    note: دوست دارم e دوست ندارم sono le forme affermativa e negativa di ripasso di دوست داشتن (piacere), viste per la prima volta nella lezione 3 e ora messe a confronto con اما in questa lezione di riepilogo.
    target_text: دوست دارم (mi piace) / دوست ندارم (non mi piace)
  prs.a1.unit38.lesson06.teach.contrast_phrase:
    title: Mi piace il rosso, ma non mi piace il nero
    gloss: Mi piace il rosso, ma non mi piace il nero.
    note: اما mette in contrasto un colore che piace con uno che non piace, usando insieme دوست دارم e دوست ندارم.
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: Quale colore ti piace?
    gloss: Quale colore Le piace?
    note: Aggiunge شما (tu/Lei, forma di cortesia) alla stessa domanda delle lezioni 3 e 4, ora rivolta direttamente a te.
