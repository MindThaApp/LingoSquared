    target_text: دوست دارین (vi piace/Le piace, formale) / را (segno dell'oggetto)
  prs.a1.unit38.lesson03.teach.which_color_like_question_phrase:
    title: Quale colore Le piace?
    gloss: Quale colore Le piace?
    note: کدام رنگ را دوست دارین؟ significa letteralmente «quale colore [marcatore dell'oggetto] Le piace?»
  prs.a1.unit38.lesson03.teach.i_like_green_phrase:
