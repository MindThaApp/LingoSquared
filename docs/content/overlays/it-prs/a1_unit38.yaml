    title: Di che colore è questo libro?
    gloss: Di che colore è questo libro?
    note: 'این کتاب چه رنگ است؟ significa letteralmente «questo libro che colore è?»: è il modo naturale di chiedere di che colore è qualcosa.'
  prs.a1.unit38.lesson03.teach.review_like_formal:
