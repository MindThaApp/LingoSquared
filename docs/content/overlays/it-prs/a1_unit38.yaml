teaching:
  prs.a1.unit38.lesson01.teach.review_basics:
    title: 'Ripasso: colore, è, nero, bianco, rosso'
    gloss: colore / è / nero / bianco / rosso
    note: رنگ, است, سیاه, سفید e سرخ sono parole di ripasso usate in tutta l'unità.
    target_text: رنگ (colore) / است (è) / سیاه (nero) / سفید (bianco) / سرخ (rosso)
  prs.a1.unit38.lesson01.teach.review_objects:
    title: 'Ripasso: questo, camicia, macchina, libro, io, e, ma'
    gloss: questo / camicia / macchina / libro / io / e / ma
    note: این, پیراهن, موتر, کتاب, من, و e اما sono parole di ripasso usate per costruire le frasi sui colori di questa unità.
    target_text: این (questo) / پیراهن (camicia) / موتر (auto) / کتاب (libro) / من (io) / و (e) / اما (ma)
  prs.a1.unit38.lesson01.teach.abi_word:
    title: Blu
    gloss: blu
    note: آبی è la parola standard in dari per «blu».
    example_gloss: La macchina è blu.
  prs.a1.unit38.lesson01.teach.zard_word:
    title: Giallo
    gloss: giallo
    note: زرد significa giallo.
    example_gloss: Questa camicia è gialla.
  prs.a1.unit38.lesson01.teach.sabz_word:
    title: Verde
    gloss: verde
    note: سبز significa verde.
    example_gloss: Il libro è verde.
  prs.a1.unit38.lesson01.teach.narenji_word:
    title: Arancione
    gloss: arancione
    note: نارنجی significa arancione (il colore).
    example_gloss: Questa camicia è arancione.
  prs.a1.unit38.lesson01.teach.blue_and_white_phrase:
    title: La mia camicia è blu e bianca
    gloss: La mia camicia è blu e bianca.
    note: و unisce i due colori in un'unica frase.
  prs.a1.unit38.lesson01.teach.black_but_orange_phrase:
    title: La macchina è nera, ma la camicia è arancione
    gloss: La macchina è nera, ma la camicia è arancione.
    note: اما contrappone i colori di due oggetti diversi in un'unica frase.
  prs.a1.unit38.lesson02.teach.review_house:
    title: 'Ripasso: casa'
    gloss: casa
    note: خانه è una parola di ripasso usata nelle frasi sui colori di questa lezione.
    target_text: خانه (casa)
  prs.a1.unit38.lesson02.teach.khakestari_word:
    title: Grigio
    gloss: grigio
    note: خاکستری significa grigio.
    example_gloss: La macchina è grigia.
  prs.a1.unit38.lesson02.teach.banafsh_word:
