course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: prendere in prestito e restituire un semplice oggetto della biblioteca, chiedere la data di scadenza e leggere un breve brano su un libro preso in prestito; chiedere quale libro desidera qualcuno, proporre e confermare una data di restituzione e capire un semplice scambio in biblioteca.'
units:
  prs.a1.unit43.library:
    title: La biblioteca
    description: Chiedere un libro, prenderlo in prestito e restituirlo, chiedere e confermare una data di restituzione e leggere un breve brano su un libro preso in prestito.
lessons:
  prs.a1.unit43.lesson01.library_vocabulary:
    title: Il lessico della biblioteca
  prs.a1.unit43.lesson02.asking_return_date:
    title: Chiedere la data di restituzione
  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: Prendere in prestito e restituire il libro
  prs.a1.unit43.lesson04.library_dialogue:
    title: Dialogo in biblioteca
  prs.a1.unit43.lesson05.reading:
    title: Lettura sul libro preso in prestito
  prs.a1.unit43.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Ripasso: libro, ho, è, in'
    gloss: libro / ho / è / in
    note: کتاب, دارم, است e در sono parole di ripasso che servono per parlare di un libro.
    target_text: کتاب (libro) / دارم (ho) / است (è) / در (in)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Ripasso: voglio, un/uno/una'
    gloss: voglio / un, uno, una / uno (numero)
    note: می‌خواهم e یک si combinano per dire che cosa vuoi.
    target_text: می‌خواهم (voglio) / یک (un / uno)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Biblioteca
    gloss: biblioteca
    note: کتابخانه è la parola standard in dari per «biblioteca» ed è formata da کتاب (libro) e خانه (casa).
    example_gloss: Il libro è in biblioteca.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliotecario
    gloss: bibliotecario
    note: کتابدار significa letteralmente «chi tiene i libri» (chi si prende cura dei libri) ed è formato come دوکاندار («negoziante», Unità 8).
    example_gloss: Il bibliotecario è in biblioteca.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Voglio un libro
    gloss: Voglio un libro.
    note: یک کتاب می‌خواهم unisce یک (un/uno), کتاب (libro) e می‌خواهم (voglio).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Ripasso: da, marcatore dell''oggetto'
    gloss: da / (marcatore dell'oggetto)
    note: از (da) e را (indica l'oggetto della frase, dalle Unità 14 e 26) sono parole da ripassare.
    target_text: از (da / di) / را (marcatore dell'oggetto)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Voglio il libro dal bibliotecario
    gloss: Voglio il libro dal bibliotecario.
    note: از کتابدار (dal bibliotecario) si aggiunge a کتاب را می‌خواهم.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Voglio un libro dal bibliotecario
    gloss: Voglio un libro dal bibliotecario.
    note: Unisce یک (un/uno) a کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Ripasso: data, giorno, lunedì'
    gloss: data / giorno / lunedì
    note: تاریخ, روز e دوشنبه (tutte dell'Unità 9) sono parole da ripassare, usate per chiedere la data di restituzione.
    target_text: تاریخ (data) / روز (giorno) / دوشنبه (lunedì)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Ripasso: quale, è'
    gloss: quale / è
    note: کدام e است sono parole da ripassare, usate per fare una domanda.
    target_text: کدام (quale) / است (è)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Restituire / ridare
    gloss: restituire / ridare
    note: 'پس دادن significa letteralmente «dare indietro»: پس (indietro) si combina con دادن (dare).'
    example_gloss: La data di restituzione è lunedì.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: Quale giorno è la data di restituzione?
    gloss: Quale giorno è la data di restituzione del libro?
    note: تاریخ پس دادن کتاب کدام روز است؟ chiede quando bisogna restituire un libro preso in prestito.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: La data di restituzione è lunedì
    gloss: La data di restituzione è lunedì.
    note: تاریخ پس دادن دوشنبه است risponde alla domanda indicando un giorno preciso.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Ripasso: voglio, libro, un/uno/una, questo'
    gloss: voglio / libro / un, uno, una / uno (numero) / questo
    note: می‌خواهم، کتاب، یک e این sono parole da ripassare, usate per chiedere un libro preciso.
    target_text: می‌خواهم (voglio) / کتاب (libro) / یک (un / uno) / این (questo)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Prendere
    gloss: prendere
    note: بگیرم è la forma congiuntiva («che io prenda»), la stessa che l'Unità 42 usava con می‌خواهم per dire «voglio prendere».
    example_gloss: Voglio prendere un libro.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Prestito
    gloss: prestito
    note: قرض significa prestito; قرض گرفتن («prendere in prestito») è il modo comune in dari per dire «prendere in prestito».
    example_gloss: Questo libro è in prestito.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Voglio prendere in prestito il libro
    gloss: Voglio prendere in prestito il libro.
    note: می‌خواهم کتاب را قرض بگیرم unisce می‌خواهم, کتاب را, قرض e il congiuntivo بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: Dare (indietro)
    gloss: dare (indietro)
    note: بدهم è la forma congiuntiva di دادن (dare); con پس (indietro) significa «restituire».
    example_gloss: Voglio restituirlo.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: Voglio restituire il libro
    gloss: Voglio restituire il libro.
    note: می‌خواهم کتاب را پس بدهم unisce می‌خواهم, کتاب را, پس e il congiuntivo بدهم.
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: 'Ripasso: molto, buono'
    gloss: molto / buono
    note: بسیار e خوب sono parole da ripassare, usate per confermare qualcosa.
    target_text: بسیار (molto) / خوب (buono / bene)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: Va bene
    gloss: Va bene.
    note: خوب است conferma che qualcosa va bene.
  prs.a1.unit43.lesson04.teach.review_hello_want:
    title: 'Ripasso: ciao, voglio'
    gloss: ciao / voglio
    note: سلام e می‌خواهم sono parole da ripassare, usate nel dialogo.
    target_text: سلام (ciao / salve) / می‌خواهم (voglio)
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: 'Ripasso: molto, grazie mille, prego'
    gloss: molto / grazie mille / prego
    note: بسیار, تشکر زیاد e خواهش می‌کنم sono parole da ripassare, usate nel dialogo.
    target_text: بسیار (molto) / تشکر زیاد (grazie mille) / خواهش می‌کنم (prego)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Buongiorno. Vorrei prendere in prestito un libro.'
    gloss: Buongiorno. Vorrei prendere in prestito un libro.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Bibliotecario: Buongiorno. Quale libro desidera?'
    gloss: Buongiorno. Quale libro desidera?
    note: می‌خواهین è la forma plurale di cortesia di «voi volete», usata per rivolgersi con rispetto a una persona.
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Vorrei questo libro.'
    gloss: Vorrei questo libro.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Bibliotecario: Bene. La data di restituzione è lunedì.'
    gloss: Bene. La data di restituzione è lunedì.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Molto bene. Grazie mille.'
    gloss: Molto bene. Grazie mille.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Bibliotecario: Prego.'
    gloss: Prego.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: 'Ripasso: Homayoun, lui/lei, ha'
    gloss: Homayoun / lui, lei / ha (lui, lei)
    note: همایون, او e دارد sono parole da ripassare, usate nel brano di lettura.
    target_text: همایون (Homayoun) / او (lui/lei) / دارد (ha)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Lettura sul libro preso in prestito
    gloss: Homayoun ha un libro. Il suo libro è della biblioteca. La data di restituzione del suo libro è lunedì. Homayoun è felice.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Ripasso: non ho, ma, Lei/voi (formale)'
    gloss: non ho / ma / Lei, voi (formale)
    note: ندارم, اما e شما sono parole da ripassare, usate per mettere in contrasto due giorni.
    target_text: ندارم (non ho) / اما (ma) / شما (Lei, forma di cortesia)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Ripasso: martedì'
    gloss: martedì
    note: سه‌شنبه è una parola da ripassare.
    target_text: سه‌شنبه (martedì)
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: Lunedì ho un libro, ma martedì no
    gloss: Lunedì ho un libro, ma martedì non ce l'ho.
    note: اما mette in contrasto l'avere un libro il lunedì e il non averlo il martedì.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Quale libro desidera?
    gloss: Quale libro desidera?
    note: La versione formale, con شما, della domanda su quale libro vuole qualcuno.
