course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: chiedi al farmacista un medicinale semplice, descrivi un sintomo di base (mal di testa, mal di stomaco o mal di denti), chiedi una compressa o uno sciroppo e capisci un''indicazione di dosaggio elementare.'
units:
  prs.a1.unit46.pharmacy:
    title: Farmacia e medicinali
    description: Chiedi al farmacista un medicinale semplice, descrivi un sintomo di base, chiedi una compressa o uno sciroppo e capisci un'indicazione di dosaggio elementare.
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: Farmacia e farmacista
  prs.a1.unit46.lesson02.symptom_vocabulary:
    title: Mal di testa, mal di stomaco e mal di denti
  prs.a1.unit46.lesson03.medicine_forms:
    title: Compressa e sciroppo
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: Dialogo in farmacia
  prs.a1.unit46.lesson05.reading:
    title: Leggere una ricetta
  prs.a1.unit46.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Ripasso: questo, è, in'
    gloss: questo / è / in
    note: این, است e در (usati in tutto il corso) sono parole già note, utili per parlare della farmacia.
    target_text: این (questo) / است (è) / در (in)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Farmacia
    gloss: farmacia
    note: دواخانه significa letteralmente «casa dei medicinali», formata come کتابخانه («casa dei libri», biblioteca, Unità 43).
    example_gloss: Questa è una farmacia.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: Questa è una farmacia
    gloss: Questa è una farmacia.
    note: این دواخانه است combina parole imparate prima in questa lezione.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Farmacista
    gloss: farmacista
    note: دواساز significa letteralmente «chi prepara i medicinali».
    example_gloss: Il farmacista è in farmacia.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: Il farmacista è in farmacia
    gloss: Il farmacista è in farmacia.
    note: دواساز در دواخانه است combina دواساز (farmacista) e دواخانه (farmacia).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Ripasso: medicinale, voglio'
    gloss: medicinale / voglio
    note: دوا e می‌خواهم sono parole già note, utili per chiedere un medicinale.
    target_text: دوا (medicina) / می‌خواهم (voglio)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Voglio un medicinale
    gloss: Voglio un medicinale.
    note: دوا می‌خواهم combina دوا (medicinale) e می‌خواهم (voglio).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Ripasso: mal di testa, mal di stomaco, ho, ha'
    gloss: mal di testa / mal di stomaco / ho / ha (forma di cortesia)
    note: سردرد, دل‌درد, دارم e دارین sono parole già note, utili per descrivere un sintomo.
    target_text: سردرد (mal di testa) / دل‌درد (mal di pancia) / دارم (ho) / دارین (ha — forma di cortesia)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Ripasso: molto, sì, no'
    gloss: molto / sì / no
    note: بسیار, بلی e نخیر (di unità precedenti) sono parole già note, utili per rispondere a una domanda su un sintomo.
    target_text: بسیار (molto) / بلی (sì) / نخیر (no)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Mal di denti
    gloss: mal di denti
    note: دندان‌درد unisce دندان (dente, Unità 42) e lo stesso -درد («dolore») già usato in سردرد e دل‌درد.
    example_gloss: Ho mal di denti.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: Ho un forte mal di denti
    gloss: Ho un forte mal di denti.
    note: بسیار دندان‌درد دارم usa بسیار (molto) per rafforzare il sintomo.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: Ha mal di testa?
    gloss: Ha mal di testa?
    note: سردرد دارین؟ è una domanda sì/no formata con l'intonazione ascendente, senza una parola interrogativa a parte.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: No, ho mal di denti
    gloss: No, ho mal di denti.
    note: نخیر risponde alla domanda precedente e indica il sintomo vero.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Ripasso: voglio, un/uno'
    gloss: voglio / un / uno
    note: می‌خواهم e یک (di unità precedenti) sono parole già note, utili per chiedere una forma di medicinale.
    target_text: می‌خواهم (voglio) / یک (un / uno)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Compressa
    gloss: compressa / pastiglia
    note: قرص è la parola di uso comune in dari per compressa o pastiglia.
    example_gloss: Voglio una compressa.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Voglio una compressa
    gloss: Voglio una compressa.
    note: یک قرص می‌خواهم unisce یک (una) e قرص (compressa).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Sciroppo
    gloss: sciroppo
    note: شربت è la parola dari di uso comune per indicare una medicina liquida o uno sciroppo.
    example_gloss: Voglio lo sciroppo.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Voglio lo sciroppo
    gloss: Voglio lo sciroppo.
    note: شربت می‌خواهم unisce شربت (sciroppo) e می‌خواهم (voglio).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Ripasso: quale, medicina, vuole (forma di cortesia)'
    gloss: quale / medicina / vuole (forma di cortesia)
    note: کدام, دوا e می‌خواهین sono parole di ripasso usate per chiedere che cosa desidera un cliente.
    target_text: کدام (quale) / دوا (medicina) / می‌خواهین (vuole — forma di cortesia)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Quale medicina desidera?
    gloss: Quale medicina desidera?
    note: کدام دوا می‌خواهین؟ è la domanda di cortesia che farebbe un farmacista.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Ripasso: salve, mal di pancia, ho'
    gloss: salve / mal di pancia / ho
    note: سلام, دل‌درد e دارم (delle unità precedenti) sono parole di ripasso usate per aprire il dialogo.
    target_text: سلام (buongiorno) / دل‌درد (mal di pancia) / دارم (ho)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Ripasso: medicina, vuole (forma di cortesia), sì'
    gloss: medicina / vuole (forma di cortesia) / sì
    note: دوا, می‌خواهین e بلی (delle unità precedenti) sono parole di ripasso usate nelle domande del farmacista.
    target_text: دوا (medicina) / می‌خواهین (vuole — forma di cortesia) / بلی (sì)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Ripasso: questo, compressa, buono, è'
    gloss: questo / compressa / buono / è
    note: این, قرص, خوب e است (delle unità precedenti e di questa lezione) sono parole di ripasso usate per descrivere la medicina.
    target_text: این (questo) / قرص (compressa) / خوب (buono) / است (è)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Pezzo
    gloss: pezzo / dose
    note: دانه è un classificatore numerale per un pezzo o una dose, usato per le compresse.
    example_gloss: Tre pezzi.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Prendere
    gloss: prenda (forma di cortesia)
    note: بگیرین è l'imperativo di cortesia «prenda» e appartiene alla stessa famiglia in -ین di کنین/بنوشین in altre parti di questo corso.
    example_gloss: Prenda tre pezzi al giorno.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'Ripasso: giorno, tre, grazie mille, prego'
    gloss: giorno / tre / grazie mille / prego
    note: روز, سه, تشکر زیاد e خواهش می‌کنم (delle unità precedenti) sono parole di ripasso usate per chiudere il dialogo.
    target_text: روز (giorno) / سه (tre) / تشکر زیاد (grazie mille) / خواهش می‌کنم (prego)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Salve. Ho mal di pancia.'
    gloss: Salve. Ho mal di pancia.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Farmacista: Buongiorno. Desidera una medicina?'
    gloss: Buongiorno. Desidera una medicina?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Sì, voglio una compressa.'
    gloss: Sì, voglio una compressa.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Farmacista: Questa compressa è buona. Ne prenda tre al giorno.'
    gloss: Questa compressa è buona. Ne prenda tre al giorno.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Grazie mille.'
    gloss: Grazie mille.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Farmacista: Prego.'
    gloss: Prego.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Ripasso: questo, è, Homayoun, da'
    gloss: questo / è / Homayoun / da
    note: 'این, است e همایون sono parole di ripasso usate nel brano di lettura. از (delle unità precedenti, di solito «da») qui è usato con است per indicare il possesso: این نسخه از همایون است significa letteralmente «questa ricetta è di Homayoun», cioè «questa è la ricetta di Homayoun», come در این کتاب از من است, «questo libro è mio».'
    target_text: این (questo) / است (è) / همایون / از (da / di)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Ripasso: uno, compressa, giorno, tre, pezzo, prenda'
    gloss: uno / compressa / giorno / tre / pezzo / prenda
    note: یک, قرص, روز, سه, دانه e بگیرین (di questa unità) sono parole di ripasso usate nel brano di lettura.
    target_text: یک (una) / قرص (compressa) / روز (giorno) / سه (tre) / دانه (pezzo) / بگیرین (prenda)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Ricetta
    gloss: ricetta medica
    note: نسخه è la parola dari di uso comune per indicare la ricetta medica o l'etichetta di un medicinale.
    example_gloss: Questa è una ricetta medica.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Leggere una ricetta
    gloss: Questa è la ricetta di Homayoun. È una compressa. Ne prenda tre al giorno.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'Ripasso: ma, Lei, quanti'
    gloss: ma / Lei (forma di cortesia) / quanti
    note: اما, شما e چند (delle unità precedenti) sono parole di ripasso usate per indicare una posologia.
    target_text: اما (ma) / شما (Lei, forma di cortesia) / چند (quanti)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Ripasso: mattina, sera, due, tre, pezzo, è, la vostra ricetta'
    gloss: mattina / notte / due / tre / pezzo / è / la sua ricetta
    note: صبح, شب, دو, سه, دانه, است (delle unità precedenti e di questa) e نسخه‌تان (la vostra ricetta, con lo stesso suffisso -تان di نام‌تان/تلفن‌تان in altre parti del corso) sono parole di ripasso usate per chiudere l'unità.
    target_text: صبح (mattina) / شب (notte / sera) / دو (due) / سه (tre) / دانه (pezzo) / است (è) / نسخه‌تان (la sua ricetta)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: La mattina due pezzi, ma la sera tre pezzi
    gloss: La mattina sono due pezzi, ma la sera sono tre pezzi.
    note: اما mette in contrasto la dose del mattino e quella della sera.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: Quanti pezzi prevede la vostra ricetta?
    gloss: Quanti pezzi prevede la vostra ricetta?
    note: La forma di cortesia, con شما e il suffisso -تان, per chiedere la posologia di una ricetta.
