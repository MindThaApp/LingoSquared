course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: impara a nominare gli oggetti della cucina e gli ingredienti, a descrivere le azioni del cucinare, a seguire semplici passaggi di una ricetta e a parlare della preparazione di un pasto.'
units:
  prs.a1.unit36.cooking:
    title: Cucinare
    description: Impara a nominare le azioni di base in cucina, a descrivere la preparazione del cibo e a seguire o dare semplici istruzioni di cucina.
lessons:
  prs.a1.unit36.lesson01.cooking_words:
    title: Parole della cucina
  prs.a1.unit36.lesson02.cooking_actions:
    title: Azioni in cucina
  prs.a1.unit36.lesson03.cooking_steps:
    title: Passaggi della ricetta
