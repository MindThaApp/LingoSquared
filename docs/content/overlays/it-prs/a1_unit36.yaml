  prs.a1.unit36.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Cucina
    gloss: cucina
    note: آشپزخانه è la parola dari standard per «cucina».
    example_gloss: Oggi sono in cucina.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Il cibo
    gloss: cibo / un pasto
    note: غذا indica il cibo o il pasto in generale, a differenza di un piatto specifico come پلو.
    example_gloss: Il cibo è delizioso.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Cipolla
    gloss: cipolla
    note: پیاز è la parola dari comune per «cipolla», usatissima nella cucina afghana.
    example_gloss: La cipolla è fresca.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Carne
    gloss: carne
    note: گوشت significa «carne».
    example_gloss: La carne è fresca.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Ripasso: uno, voglio, in, sono'
    gloss: uno/un / voglio / in o a / sono
    note: یک, می‌خواهم, در e استم sono forme già viste, usate nelle frasi di cucina di questa unità.
    target_text: یک (uno/un) / می‌خواهم (voglio) / در (in/a) / استم (sono)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Cucino il cibo
    gloss: Cucino il cibo.
    note: می‌پزم è la prima persona singolare del presente di پختن, «cucinare».
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Sono in cucina
    gloss: Sono in cucina.
    note: استم è la prima persona singolare della copula, qui usata con در per indicare il luogo.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Sale
    gloss: sale
    note: نمک significa «sale».
    example_gloss: Voglio il sale.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Il riso
    gloss: riso
    note: برنج è il riso crudo (il chicco), diverso da پلو, il piatto di riso cotto presentato nell'unità sul cibo.
    example_gloss: Cucino il riso.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Ripasso: faccio, tagliato'
    gloss: faccio / tagliato, a pezzetti
    note: می‌کنم è un ripasso; خرد è nuovo e si unisce alle forme di کردن per dire «tagliare a pezzetti».
    target_text: می‌کنم (faccio) / خرد (tagliato a pezzetti)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Taglio la cipolla
    gloss: Taglio la cipolla.
    note: 'خرد می‌کنم significa letteralmente «rendo a pezzetti»: è un tipico schema di verbo composto.'
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Aggiungo il sale
    gloss: Aggiungo il sale.
    note: می‌اندازم (da انداختن, «gettare, mettere dentro») è il verbo dari naturale per aggiungere un ingrediente.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Cucino la carne
    gloss: Cucino la carne.
    note: Sostituisci گوشت con برنج per indicare un altro cibo che stai cucinando.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Ripasso: prima, poi'
    gloss: prima / poi
    note: اول e بعد sono parole già viste, usate per ordinare i passaggi di una ricetta.
    target_text: اول (prima) / بعد (poi)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Ripasso: acqua, calda'
    gloss: acqua / calda
    note: آب e گرم sono parole già viste nelle unità precedenti.
    target_text: آب (acqua) / گرم (caldo)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Verso
    gloss: verso
    note: می‌ریزم (da ریختن, «versare») è il verbo naturale per aggiungere un liquido, diverso da می‌اندازم, che si usa per gli ingredienti solidi.
    example_gloss: Verso l'acqua.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Prima taglio la cipolla
    gloss: Prima taglio la cipolla.
    note: اول indica il primo passaggio di una sequenza.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Poi cucino la carne
    gloss: Poi cucino la carne.
    note: بعد indica il passo successivo in una sequenza.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Verso acqua calda
    gloss: Verso acqua calda.
    note: Unisce گرم (caldo) e می‌ریزم (verso).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Ciao / sì / per favore / certo / grazie / stufato / delizioso / è
    gloss: ciao / sì / per favore / va bene, certo / grazie / stufato / delizioso / è
    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه e است sono parole di ripasso usate nel dialogo in cucina.
    target_text: سلام (ciao) / بلی (sì) / لطفاً (per favore) / چشم (certo/volentieri) / تشکر (grazie) / قورمه (stufato) / خوش‌مزه (delizioso) / است (è)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia: Buongiorno, che cosa cucina?'
    gloss: Buongiorno, che cosa cucina?
    note: چی می‌پزین؟ usa la forma di cortesia می‌پزین.
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid: Preparo il qorma.'
    gloss: Preparo il qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia: Le do una mano?'
    gloss: Le do una mano?
    note: کمک می‌کنم؟ significa letteralmente «aiuto?», un modo naturale di offrire aiuto.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid: Sì, per favore tagli la cipolla.'
    gloss: Sì, per favore tagli la cipolla.
    note: 'کنین è la forma di cortesia dell''imperativo: «tagli!».'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia: Certo.'
    gloss: Certo.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid: Grazie, il cibo è delizioso.'
    gloss: Grazie, il cibo è delizioso.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: Lui/lei, in, fa, cucina, molto, contento, è
    gloss: lui/lei / in oppure a / lui/lei fa / lui/lei cuoce / molto / felice / è
    note: او è il pronome dari per «lui» e «lei»; می‌کند e می‌پزد sono le forme della terza persona dei verbi usati prima in questa unità.
    target_text: او (lui/lei) / در (in/a) / می‌کند (lui/lei fa) / می‌پزد (lui/lei cucina) / بسیار (molto) / خوشحال (contento) / است (è)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 'Lettura: Nadia cucina'
    gloss: Nadia è in cucina. Taglia la cipolla. Poi cuoce la carne. Il cibo è molto buono. Nadia è felice.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم (mi piace) / را (segno dell'oggetto) / اما (ma) / وقت ندارم (non ho tempo)
