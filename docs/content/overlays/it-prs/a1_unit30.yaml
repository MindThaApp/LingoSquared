course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: vocabolario di tecnologia e dispositivi (cellulare, computer, internet, app, foto), espressioni per le azioni con il telefono (mandare un messaggio, telefonare, fare una foto, scaricare un''app), come chiedere e dire quante volte al giorno si usa il cellulare e un dialogo tra Zarmina e Homayoun sull''uso di telefono, computer e internet.'
units:
  prs.a1.unit30.technology:
    title: Tecnologia
    description: Parla di cellulari, computer, internet e app, e di quanto spesso li usi.
lessons:
  prs.a1.unit30.lesson01.device_vocabulary:
    title: Parole della tecnologia
  prs.a1.unit30.lesson02.phone_actions:
    title: Azioni con il telefono
  prs.a1.unit30.lesson03.frequency_question:
    title: Quante volte al giorno?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Dialogo sulla tecnologia
  prs.a1.unit30.lesson05.reading_technology:
    title: Lettura sulla tecnologia
  prs.a1.unit30.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Tecnologia
    gloss: tecnologia
    note: 'تکنالوژی significa tecnologia: è la grafia standard afghana, diversa da quella iraniana تکنولوژی.'
    example_gloss: La tecnologia è buona.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Cellulare
    gloss: cellulare
    note: موبایل significa cellulare, ed è diverso dal più generico تلفن (telefono, ripasso dell'unità 7).
    example_gloss: Ho un cellulare.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Computer
    gloss: computer
    note: کمپیوتر significa computer, un prestito standard comune al persiano e al dari.
    example_gloss: Il computer è in ufficio.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت significa internet, un prestito standard comune al persiano e al dari.
    example_gloss: Internet è lento.
  prs.a1.unit30.lesson01.teach.app_word:
    title: App
    gloss: app
    note: اپلیکیشن significa app (applicazione), un prestito standard comune al persiano e al dari.
    example_gloss: Questa app è buona.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Foto
    gloss: foto
    note: عکس significa foto o immagine.
    example_gloss: Questa foto è bella.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Usare
    gloss: usare + fare → io uso
    note: 'استفاده (uso) si combina con کردن (fare, ripasso) per formare استفاده می‌کنم (io uso): è lo stesso schema con verbo leggero già visto in questo corso, ad esempio بازی می‌کنم (unità 29) e ورزش می‌کنم (unità 29).'
    target_text: استفاده (uso) + کردن (fare) = استفاده می‌کنم (io uso)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Uso internet
    gloss: Uso internet.
    note: Unisce من (io, ripasso), از (da/con, ripasso), انترنت e استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Messaggio
    gloss: messaggio
    note: پیام significa messaggio.
    target_text: پیام (messaggio)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: Mando un messaggio
    gloss: Mando un messaggio
    note: 'می‌فرستم significa «mando»: è un verbo nuovo, diverso dal verbo بگذارم (lasciare un messaggio) dell''unità 7.'
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: Telefono
    gloss: Telefono
    note: زنگ می‌زنم significa «telefono».
    target_text: زنگ می‌زنم (telefono)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: Faccio una foto
    gloss: Faccio una foto
    note: عکس می‌گیرم riprende می‌گیرم (prendo/ricevo, ripasso dell'unità 23) applicato a عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: Scaricare
    gloss: scaricare
    note: دانلود è il prestito standard dari per «download», usato con کردن (fare, ripasso) come verbo leggero, ad esempio دانلود می‌کنم (scarico).
    example_gloss: Scarico un'app.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: Voglio scaricare un'app
    gloss: Voglio scaricare un'app
    note: Segue lo stesso schema می‌خواهم + congiuntivo di می‌خواهم یک پیام بگذارم (voglio lasciare un messaggio) dell'unità 7.
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: Quanti / volta
    gloss: quanti / volta
    note: چند بار si usa qui per chiedere la frequenza.
    target_text: چند (quanti) / بار (volta)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: Giorno
    gloss: giorno
    note: روز significa giorno.
    target_text: روز (giorno)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: Tu usi (formale)
    gloss: usate / usa (formale)
    note: استفاده می‌کنین è la forma di cortesia «usate / Lei usa», come lo schema ورزش می‌کنین dell'unità 29.
    target_text: استفاده می‌کنین (Lei usa, formale)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: Quante volte al giorno usate il cellulare?
    gloss: Quante volte al giorno usa il cellulare?
    note: Unisce چند بار (quante volte), در روز (al giorno), از موبایل (dal cellulare) e استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: Uso internet ogni giorno
    gloss: Uso internet ogni giorno.
    note: هر روز si combina con از انترنت استفاده می‌کنم.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: Lui/lei usa
    gloss: lui/lei usa
    note: استفاده می‌کند è la forma della 3ª persona, secondo lo schema di می‌کند già visto nell'Unità 29.
    target_text: استفاده می‌کند (lui/lei usa, 3ª persona)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: Tu / tu usi (informale)
    gloss: tu (informale) / tu usi (informale)
    note: تو e می‌کنی sono il registro informale usato tra Homayoun e Zarmina.
    target_text: تو (tu, informale) / می‌کنی (tu usi, informale)
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Dove
    gloss: dove
    note: کجا significa «dove».
    target_text: کجا (dove)
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, quante volte al giorno usi il cellulare?'
    gloss: Zarmina, quante volte al giorno usi il cellulare?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Uso molto il cellulare. Faccio foto e mando messaggi.'
    gloss: Uso molto il cellulare. Faccio foto e mando messaggi.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Usi il computer?'
    gloss: Usi il computer?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sì, in ufficio uso il computer.'
    gloss: Sì, in ufficio uso il computer.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Io uso internet ogni giorno.'
    gloss: Uso internet ogni giorno.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Ottimo!'
    gloss: Ottimo!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Lettura sulla tecnologia
    gloss: Zarmina usa il cellulare ogni giorno. Fa foto e manda messaggi. In ufficio usa il computer. Homayoun usa internet ogni giorno.
  prs.a1.unit30.lesson06.teach.review_ama:
    title: Ma
    gloss: ma
    note: اما significa «ma».
    target_text: اما (ma)
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: Mi piace / tempo / non ho
    gloss: mi piace / tempo / non ho
    note: دوست دارم (mi piace), وقت (tempo) e ندارم (non ho) sono un ripasso delle Unità 11, 14, 26 e 29.
    target_text: دوست دارم (mi piace) / وقت (tempo) / ندارم (non ho)
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: Mi piace la tecnologia, ma non ho tempo
    gloss: Mi piace la tecnologia, ma non ho tempo.
    note: Unisce تکنالوژی را دوست دارم (mi piace la tecnologia, costruzione già vista) con اما وقت ندارم (ma non ho tempo).
