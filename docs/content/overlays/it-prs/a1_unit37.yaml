    title: Dialogo sulla personalità
  prs.a1.unit37.lesson05.personality_reading:
    title: Leggere della personalità
  prs.a1.unit37.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Simpatico
    gloss: simpatico
    note: مهربان è la parola dari standard per una persona gentile e di buon cuore.
    example_gloss: Lui/Lei è gentile.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Laborioso
    gloss: laborioso
    note: 'زحمتکش significa letteralmente «chi si dà pena e fatica»: una persona laboriosa.'
    example_gloss: Lui/Lei è laborioso/a.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Intelligente
    gloss: intelligente / sveglio
    note: 'باهوش unisce با (con) e هوش (intelligenza): una persona intelligente e sveglia.'
    example_gloss: Lui/Lei è intelligente.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Pigro
    gloss: pigro
    note: تنبل significa pigro.
    example_gloss: Lui/Lei è pigro/a.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Ripasso: lui/lei, è, e, ma'
    gloss: lui/lei / è / e / ma
    note: او, است, و e اما sono forme già viste, usate in tutte le frasi sulla personalità di questa unità.
    target_text: او (lui/lei) / است (è) / و (e) / اما (ma)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: Lui/Lei è gentile e laborioso/a
    gloss: Lui/Lei è gentile e laborioso/a.
    note: و unisce i due tratti in un'unica frase.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Lui/Lei è intelligente, ma pigro/a
    gloss: Lui/Lei è intelligente, ma pigro/a.
    note: اما mette in contrasto due tratti nella stessa frase.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Divertente
    gloss: simpatico / scherzoso
    note: شوخ descrive una persona che ama scherzare o è giocosa.
    example_gloss: Lui/Lei è simpatico/a.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Di poche parole
    gloss: di poche parole / riservato
    note: 'کم‌حرف significa letteralmente «poche parole»: una persona silenziosa e riservata.'
    example_gloss: Lui/Lei è di poche parole.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Sincero
    gloss: sincero
    note: 'راستگو unisce راست (vero, retto) e گو (che dice): una persona che dice la verità, sincera.'
    example_gloss: Lui/Lei è sincero/a.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Ripasso: e, ma'
    gloss: e / ma
    note: و e اما sono parole già viste, usate per unire o contrapporre i tratti.
    target_text: و (e) / اما (ma)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Lui/Lei è simpatico/a e sincero/a
    gloss: Lui/Lei è simpatico/a e sincero/a.
    note: Unisce due tratti positivi con و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Lui/Lei è di poche parole, ma gentile
    gloss: Lui/Lei è di poche parole, ma gentile.
    note: اما contrappone un tratto riservato a uno caloroso.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Persona
    gloss: persona
    note: آدم è una parola comune, valida per uomo e donna, per indicare una persona o un essere umano.
    example_gloss: Lui/Lei è una brava persona.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Ripasso: come/che tipo di, perché, aiuto'
    gloss: come, che tipo di / perché / aiuto
    note: چطور, چون e کمک sono forme già viste, usate per chiedere della personalità e spiegarla.
    target_text: چطور (come, in che modo) / چون (perché) / کمک (aiuto)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: Che tipo di persona è?
    gloss: Che tipo di persona è?
    note: 'او چطور آدم است؟ chiede letteralmente «lui/lei è che tipo di persona?»: il modo naturale per chiedere com''è qualcuno.'
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Lui/Lei è gentile, perché aiuta
    gloss: È gentile, perché aiuta.
    note: چون introduce la causa; کمک می‌کند significa letteralmente «fa aiuto».
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: È laborioso/a, perché lavora molto
    gloss: È laborioso/a, perché lavora molto.
    note: زیاد کار می‌کند significa letteralmente «fa molto lavoro».
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Sì / un po' / sempre
    gloss: sì / un po' / sempre
    note: بلی, کمی e همیشه sono parole di ripasso usate nel dialogo sul carattere.
    target_text: بلی (sì) / کمی (un po') / همیشه (sempre)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, che tipo di persona è Karim?'
    gloss: Zarmina, che tipo di persona è Karim?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Karim è gentile e laborioso.'
    gloss: Karim è gentile e laborioso.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Homayoun: È intelligente?'
    gloss: È intelligente?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Sì, è intelligente, ma un po'' taciturno.'
    gloss: Sì, è intelligente, ma un po' taciturno.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Homayoun: È sincero?'
    gloss: È sincero?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Sì, è sempre sincero.'
    gloss: Sì, è sempre sincero.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: A volte, tutti, segno dell'oggetto, a loro piace
    gloss: a volte / tutti / segno dell'oggetto / vogliono bene, amano
    note: گاهی (a volte) e همه (tutti) compaiono nel brano; را segna un complemento oggetto determinato; دوست دارند è la terza persona plurale di دوست دارم (voglio bene, mi piace).
    target_text: گاهی (a volte) / همه (tutti) / را (segno dell'oggetto) / دوست دارند (a loro piace)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Lettura sul carattere di Homayoun
    gloss: Homayoun è gentile e laborioso. È intelligente, ma a volte taciturno. È sempre sincero. Tutti gli vogliono bene.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Ripasso: io sono, Lei è (formale)'
    gloss: io sono / Lei è (formale)
    note: استم e استین sono le forme di ripasso della copula per «io sono» e «Lei è» (formale), usate in tutte le frasi di questa lezione di riepilogo.
    target_text: استم (sono) / استین (siete/è, formale)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Sono gentile, ma a volte pigro/a
    gloss: Sono gentile, ma a volte pigro/a.
    note: من (io) e استم (sono) permettono di descrivere direttamente il proprio carattere, con lo stesso schema usato nell'unità per او/است.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: Che tipo di persona è Lei?
    gloss: Che tipo di persona è Lei?
    note: Aggiunge شما (Lei, formale) e استین (Lei è, formale) alla stessa forma di domanda della lezione 3, ora rivolta direttamente a chi studia.
