course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: impara a nominare i principali tratti della personalità, a chiedere com''è una persona, a dare semplici motivi con «perché» e a descrivere il carattere di qualcuno in un breve testo.'
units:
  prs.a1.unit37.personality:
    title: Personalità
    description: Descrivi i principali tratti della personalità di una persona e chiedi com'è qualcuno.
