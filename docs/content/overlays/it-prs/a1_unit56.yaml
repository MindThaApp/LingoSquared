    title: Abbonamento
    gloss: abbonamento / iscrizione
    note: È la parola dari usata normalmente per indicare l'iscrizione o la tessera di abbonamento a un club o a un centro.
    example_gloss: L'abbonamento di questa palestra è buono.
  prs.a1.unit56.lesson01.teach.equipment_word:
    title: Attrezzatura
    gloss: attrezzatura / cose
    note: È la parola dari standard per indicare l'attrezzatura, gli strumenti o gli effetti personali.
    example_gloss: Questa palestra ha buone attrezzature.
  prs.a1.unit56.lesson01.teach.membership_good_phrase:
    title: L'abbonamento di questa palestra è buono
    gloss: L'abbonamento di questa palestra è buono.
