course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: il lessico delle faccende domestiche (faccende, scopa, piatti, pulito, aiuto), dire quale faccenda va fatta oggi con باید, chiedere aiuto a qualcuno per una faccenda e un dialogo tra Wahid e Shukria su come dividersi i lavori di casa.'
units:
  prs.a1.unit33.household:
    title: Le faccende domestiche
    description: 'Parla delle faccende domestiche: di'' quali lavori vanno fatti, chi li fa e chiedi aiuto per uno di essi.'
