    title: Lui/lei / ogni giorno / è
    gloss: lui/lei / ogni giorno / è
    note: او (lui/lei, ripasso), هر روز (ogni giorno, ripasso) e است (è, ripasso) vengono riproposti qui insieme.
    target_text: او (lui/lei) / هر روز (ogni giorno) / است (è)
  prs.a1.unit33.lesson05.teach.review_mishuyad:
    title: Lui/lei lava
    gloss: lui/lei lava
    note: می‌شوید è la terza persona di شستن, secondo il modello già noto dei verbi alla terza persona in -د (per esempio می‌کند).
    target_text: می‌شوید (lui/lei lava)
