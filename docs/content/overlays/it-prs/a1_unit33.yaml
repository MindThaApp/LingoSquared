    title: Chi / lui-lei fa
    gloss: chi / lui/lei fa
    note: کی (chi, ripasso) e می‌کند (lui/lei fa, ripasso) vengono riproposti qui insieme.
    target_text: کی (chi) / می‌کند (lui/lei fa)
  prs.a1.unit33.lesson03.teach.who_sweeps_question:
    title: Chi spazza?
    gloss: Chi spazza?
    note: Unisce کی (chi, ripasso) e جاروب می‌کند (spazza, terza persona).
