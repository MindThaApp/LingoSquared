    title: Tu (informale) / tu fai / anche / grazie / molto
    gloss: tu (informale) / tu fai (informale) / anche / grazie / molto
    note: تو, می‌کنی, هم, تشکر e زیاد sono tutte parole già viste, qui raccolte per il registro informale del dialogo.
    target_text: تو (tu, informale) / می‌کنی (tu fai, informale) / هم (anche) / تشکر (grazie) / زیاد (molto)
  prs.a1.unit33.lesson04.teach.review_room_object_marker:
