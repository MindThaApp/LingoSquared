  prs.a1.unit33.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Faccende domestiche
    gloss: faccende domestiche / lavori di casa
    note: کار خانه significa faccende o lavori di casa; è l'espressione che dà il tema a questa unità.
    example_gloss: Ci sono tante faccende da fare.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Scopa
    gloss: scopa
    note: جاروب significa scopa ed è la parola dari più diffusa in Afghanistan.
    example_gloss: Dov'è la scopa?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Piatti
    gloss: piatti
    note: ظرف significa piatti (stoviglie); è una parola comune a persiano e dari.
    example_gloss: I piatti sono in cucina.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Pulito
    gloss: pulito
    note: پاک significa pulito e descrive una stanza o un oggetto.
    example_gloss: La stanza è pulita.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: Lavare / fare
    gloss: lavare / fare — lavo / faccio
    note: شستن (lavare) è un verbo davvero nuovo; کردن (fare) e می‌کنم (faccio) sono un ripasso delle unità precedenti.
    target_text: شستن (lavare) / کردن (fare) — می‌شویم (lavo) / می‌کنم (faccio)
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: Spazzo
    gloss: Spazzo.
    note: 'Unisce جاروب (scopa) a می‌کنم (faccio, ripasso): letteralmente «faccio scopa».'
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: Lavo i piatti
    gloss: Lavo i piatti.
    note: Unisce ظرف (piatti) a می‌شویم (lavo), la prima persona di شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Oggi / che cosa / sì
    gloss: oggi / che cosa / sì
    note: امروز, چه e بلی sono tutte parole già viste nelle unità precedenti.
    target_text: امروز (oggi) / چه (che cosa) / بلی (sì)
  prs.a1.unit33.lesson02.teach.must_word:
    title: Dovere / bisogna
    gloss: dovere / bisogna
    note: باید è una parola modale davvero nuova, qui usata per dire che una faccenda va fatta.
    target_text: باید (dovere / bisogna)
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: Che io faccia
    gloss: che io faccia
    note: کنم è la forma congiuntiva semplice usata dopo باید con i verbi formati con کردن (senza il prefisso می‌).
    target_text: کنم (che io faccia — si usa dopo باید con i verbi formati con کردن, senza il prefisso می‌)
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Oggi devo spazzare
    gloss: Oggi devo spazzare.
    note: Unisce امروز (oggi, ripasso) a باید جاروب کنم (devo spazzare).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: Devo pulire
    gloss: Devo pulire.
    note: Unisce باید (dovere, ripasso) a پاک کنم (che io pulisca).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: Che cosa devo fare?
    gloss: Che cosa devo fare?
    note: Unisce چه کار (quale lavoro) a باید کنم (devo fare).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Sì, devo spazzare
    gloss: Sì, devo spazzare.
    note: Unisce بلی (sì, ripasso) a باید جاروب کنم (devo spazzare).
  prs.a1.unit33.lesson03.teach.help_word:
    title: Aiuto
    gloss: aiuto
    note: کمک significa aiuto ed è una parola nuova in questo corso.
    example_gloss: Voglio un aiuto.
  prs.a1.unit33.lesson03.teach.review_lotfan_kardan_man:
    title: Per favore / fare / io / fate! (formale)
    gloss: per favore / fare / io / fate! (formale)
    note: لطفاً, کردن, من e کنین (l'imperativo formale, della stessa famiglia del suffisso formale -ین) sono tutte parole già viste nelle unità precedenti.
    target_text: لطفاً (per favore) / کردن (fare) / من (io) / کنین (fate! formale)
  prs.a1.unit33.lesson03.teach.please_help_phrase:
    title: Per favore, aiuto
    gloss: Per favore, aiutate.
    note: Unisce لطفاً (per favore, ripasso) e کمک کنین (aiutate!, imperativo di cortesia).
