    title: Mi piace / tempo / non ho / ma
    gloss: mi piace / tempo / non ho / ma
    note: دوست دارم (mi piace), وقت (tempo), ندارم (non ho) e اما (ma) sono tutte parole già viste nelle unità precedenti, nello stesso schema di ripasso.
    target_text: دوست دارم (mi piace) / وقت (tempo) / ندارم (non ho) / اما (ma)
  prs.a1.unit33.lesson06.teach.wrap_summary:
