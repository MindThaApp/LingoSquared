    note: اتاق e را (segno dell'oggetto, ripasso) vengono riproposti qui insieme.
    target_text: اتاق (stanza) / را (segno dell'oggetto)
  prs.a1.unit33.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria, oggi devo spazzare. Mi aiuti?'
    gloss: Shukria, oggi devo spazzare. Mi aiuti?
  prs.a1.unit33.lesson04.teach.dialogue_line2:
    title: 'Shukria: Sì, ti aiuto. Io lavo i piatti.'
    gloss: Sì, ti aiuto. Io lavo i piatti.
  prs.a1.unit33.lesson04.teach.dialogue_line3:
    title: 'Wahid: Pulisci anche tu?'
    gloss: Pulisci anche tu?
  prs.a1.unit33.lesson04.teach.dialogue_line4:
    title: 'Shukria: Sì, pulisco la stanza.'
    gloss: Sì, pulisco la stanza.
  prs.a1.unit33.lesson04.teach.dialogue_line5:
    title: 'Wahid: Grazie mille!'
    gloss: Grazie mille!
