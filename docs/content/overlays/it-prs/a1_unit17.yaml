course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: i sintomi di base (mal di testa, febbre, mal di pancia), dire che non ci si sente bene, chiedere un medico o una medicina, leggere un breve avviso con indicazioni di salute e un breve messaggio che descrive i sintomi, e un dialogo con un medico.'
units:
  prs.a1.unit17.health:
    title: Salute
    description: Esporre un semplice problema di salute e capire consigli semplici e immediati.
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: Parole dei sintomi
  prs.a1.unit17.lesson02.feeling_unwell:
    title: Dire che non ci si sente bene
  prs.a1.unit17.lesson03.asking_for_help:
    title: Chiedere un medico o una medicina
  prs.a1.unit17.lesson04.reading_health_advice:
    title: Leggere un avviso con indicazioni di salute
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: Leggere un messaggio sulla salute
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: Un dialogo con il medico
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Mal di testa
    gloss: mal di testa
    note: سردرد è un composto di سر (testa) e درد (dolore).
    example_gloss: Ho mal di testa.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Febbre
    gloss: febbre
    note: تب significa «febbre».
    example_gloss: Ho la febbre.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Mal di pancia
    gloss: mal di pancia
    note: دل‌درد è un composto di دل (pancia, stomaco, in senso colloquiale) e درد (dolore).
    example_gloss: Ho mal di pancia.
  prs.a1.unit17.lesson01.teach.have_word:
    title: Ho
    gloss: ho
    note: دارم è la prima persona singolare del presente di داشتن (avere).
    target_text: دارم (ho)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Malato
    gloss: malato
    note: مریض significa «malato».
    example_gloss: Sono malato.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Sono
    gloss: sono
    note: استم è la prima persona della copula nel registro cortese, coerente con il registro استم/استین di questo corso.
    target_text: استم (sono)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Come sto
    gloss: come mi sento / le mie condizioni
    note: 'حالم (حال + م) significa letteralmente «la mia condizione»: حالم خوب نیست significa «non mi sento bene».'
    target_text: حالم (come sto / le mie condizioni)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Buono / Bello
    gloss: buono / bello
    note: خوب significa «buono» o «bene».
    example_gloss: Non mi sento bene.
  prs.a1.unit17.lesson02.teach.not_word:
    title: Non è
    gloss: non è
    note: 'نیست è la copula negativa: خوب نیست significa «non è buono / non sta bene».'
    target_text: نیست (non è)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Medico
    gloss: medico
    note: داکتر è la grafia e la pronuncia standard del dari afghano per «medico» (diversa dal دکتر del persiano dell'Iran).
    example_gloss: Voglio un medico.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Medicina
    gloss: medicina
    note: دوا significa «medicina».
    example_gloss: Voglio una medicina.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Voglio
    gloss: voglio
    note: می‌خواهم significa «voglio».
    target_text: می‌خواهم (voglio)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: Riposo
    gloss: riposarsi
    note: 'استراحت è il sostantivo «riposo»: insieme a کنین forma l''imperativo «Riposate!»'
    example_gloss: Riposate.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Faccia (formale)
    gloss: fate (imperativo di cortesia)
    note: 'کنین è l''imperativo di cortesia di کردن (fare): استراحت کنین significa letteralmente «fate riposo», cioè «Riposate».'
    target_text: کنین (faccia -- imperativo formale)
  prs.a1.unit17.lesson04.teach.water_word:
    title: L'acqua
    gloss: acqua
    note: آب significa «acqua».
    example_gloss: Bevete molta acqua.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Molto
    gloss: molto
    note: زیاد significa «molto».
    example_gloss: Bevete molta acqua.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Beva (formale)
    gloss: bevete (imperativo di cortesia)
    note: بنوشین è l'imperativo di cortesia di نوشیدن (bere).
    target_text: بنوشین (beva -- imperativo formale)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: Un avviso con indicazioni di salute
    gloss: Riposate. Bevete molta acqua.
    note: Un breve avviso con due consigli di salute di base.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: Ciao
    gloss: ciao
    note: سلام significa «ciao».
    example_gloss: Ciao. Sono malato.
  prs.a1.unit17.lesson05.teach.and_word:
    title: E
    gloss: e
    note: و significa «e» e unisce due elementi o due proposizioni.
    target_text: و (e)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Un breve messaggio sulla salute
    gloss: Ciao. Sono malato. Ho mal di testa e febbre.
    note: Un breve messaggio in prima persona che descrive due sintomi.
  prs.a1.unit17.lesson06.teach.names:
    title: Bashir e il medico
    gloss: Bashir, il medico
    note: Bashir è un personaggio ricorrente in questo corso; al medico ci si rivolge con l'appellativo onorifico صاحب.
    example_gloss:
    - Sono Bashir.
    - Sono il medico.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Come
    gloss: come
    note: چطور significa «come».
    target_text: چطور (come)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Lei è (formale)
    gloss: voi siete; Lei è
    note: استین è la seconda persona della copula nel registro cortese, coerente con il registro استم/استین di questo corso.
    target_text: استین (Lei è -- formale)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Ringraziare
    gloss: grazie
    note: تشکر significa «grazie».
    example_gloss: Grazie, dottore.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Signore
    gloss: signore
    note: 'صاحب è un appellativo di rispetto che si pone dopo un nome o un titolo: داکتر صاحب significa «dottore», detto con rispetto, un uso tipicamente afghano.'
    example_gloss: Grazie, dottore.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: Il medico saluta Bashir
    gloss: Buongiorno. Come sta?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Bashir risponde
    gloss: Buongiorno. Sono malato. Ho mal di testa e febbre.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: Il medico dà dei consigli
    gloss: Riposa. Bevi molta acqua.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Bashir ringrazia il dottore
    gloss: Grazie, dottore.
