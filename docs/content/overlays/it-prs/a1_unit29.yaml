course:
  title: Italiano–Dari A1
  description: 'Dari di Kabul per principianti: lessico di sport ed esercizio fisico (calcio, pallavolo, cricket, nuoto), come chiedere e dire quante volte a settimana si fa sport, dire dove si gioca o ci si allena, e un dialogo tra Zarmina e Homayoun che combina sport, frequenza e luogo.'
units:
  prs.a1.unit29.sports:
    title: Sport
    description: Parla di quali sport o attività fisica pratichi, quanto spesso e dove.
lessons:
  prs.a1.unit29.lesson01.sport_vocabulary:
    title: Parole dello sport
  prs.a1.unit29.lesson02.frequency_question:
    title: Quante volte a settimana?
  prs.a1.unit29.lesson03.location:
    title: Dove fai sport
  prs.a1.unit29.lesson04.sports_dialogue:
    title: Dialogo sullo sport
  prs.a1.unit29.lesson05.reading_sports:
    title: Lettura sullo sport
  prs.a1.unit29.lesson06.wrap_up:
    title: Riepilogo
teaching:
  prs.a1.unit29.lesson01.teach.sport_word:
    title: Sport
    gloss: sport / esercizio fisico
    note: 'ورزش significa sport o esercizio fisico: è la parola generale per qualsiasi attività fisica.'
    example_gloss: Il nuoto è un buono sport.
  prs.a1.unit29.lesson01.teach.football_word:
    title: Calcio
    gloss: calcio
    note: فوتبال significa calcio (il gioco del pallone).
    example_gloss: Il calcio è un buono sport.
  prs.a1.unit29.lesson01.teach.volleyball_word:
    title: Pallavolo
    gloss: pallavolo
    note: والیبال significa pallavolo.
    example_gloss: Anche la pallavolo è uno sport.
  prs.a1.unit29.lesson01.teach.cricket_word:
    title: Cricket
    gloss: cricket
    note: کرکت significa cricket, uno sport davvero molto popolare proprio in Afghanistan.
    example_gloss: Il cricket è uno sport popolare.
  prs.a1.unit29.lesson01.teach.swimming_word:
    title: Nuoto
    gloss: nuoto
    note: شنا significa nuoto.
    example_gloss: Il nuoto è un buono sport.
  prs.a1.unit29.lesson01.teach.review_bazi_kardan:
    title: Gioco / fare → giocare
    gloss: gioco / fare → io gioco
    note: 'بازی (gioco) si combina con کردن (fare, ripasso) per formare بازی می‌کنم (io gioco): è lo stesso schema con verbo leggero già visto in پیاده‌روی می‌کنم e آشپزی می‌کنم.'
    target_text: بازی (gioco) + کردن (fare) = بازی می‌کنم (io gioco)
  prs.a1.unit29.lesson01.teach.combined_sentence:
    title: Il calcio è uno sport
    gloss: Il calcio è uno sport.
    note: Unisce فوتبال، یک (un, ripasso), ورزش e است (è, ripasso).
  prs.a1.unit29.lesson02.teach.review_chand:
    title: Quanti
    gloss: quanti / quante
    note: چند qui si usa per chiedere la frequenza.
    target_text: چند (quanti)
  prs.a1.unit29.lesson02.teach.bar_word:
    title: Volta
    gloss: volta (come in «una volta», un'occorrenza)
    note: بار significa «volta» nel senso di contare le occorrenze, non l'ora dell'orologio.
    example_gloss: Nuoto una volta a settimana.
  prs.a1.unit29.lesson02.teach.review_dar_hafta:
    title: In / settimana
    gloss: in / settimana
    note: در (in, ripasso) e هفته (settimana, ripasso dall'Unità 4/Unità 9) insieme significano «a settimana».
    target_text: در (in) / هفته (settimana)
  prs.a1.unit29.lesson02.teach.varzesh_mikonin:
    title: Lei fa sport (formale)
    gloss: Lei fa sport
    note: ورزش می‌کنین è la forma di cortesia, formale, di «tu fai sport» (Lei fa sport).
    target_text: ورزش می‌کنین (Lei fa sport, formale)
  prs.a1.unit29.lesson02.teach.question_frequency:
    title: Quante volte a settimana fa sport?
    gloss: Quante volte a settimana fa sport?
    note: Unisce چند بار (quante volte) + در هفته (a settimana) + ورزش می‌کنین (Lei fa sport, formale).
  prs.a1.unit29.lesson02.teach.do_bar_answer:
    title: Gioco a calcio due volte a settimana
    gloss: Gioco a calcio due volte a settimana.
    note: دو (due, ripasso dall'Unità 4) بار در هفته indica la frequenza prima del nome dello sport e della costruzione بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.bashgah_word:
    title: Palestra
    gloss: palestra
    note: باشگاه significa palestra o club sportivo.
    example_gloss: La palestra è grande.
  prs.a1.unit29.lesson03.teach.review_park:
    title: Parco
    gloss: parco
    note: پارک è un ripasso dalla lezione sui programmi dell'Unità 13.
    target_text: پارک (parco)
  prs.a1.unit29.lesson03.teach.dar_bashgah:
    title: In palestra
    gloss: in palestra
    note: در (in/a, ripasso) + باشگاه.
  prs.a1.unit29.lesson03.teach.dar_park:
    title: Nel parco
    gloss: nel parco
    note: در (in, ripasso) + پارک (ripasso).
  prs.a1.unit29.lesson03.teach.shena_mikonam:
    title: Nuoto in palestra
    gloss: Nuoto in palestra.
    note: Unisce در باشگاه con شنا می‌کنم (io nuoto), lo stesso schema con verbo leggero di بازی می‌کنم.
  prs.a1.unit29.lesson03.teach.futbol_park:
    title: Gioco a calcio nel parco
    gloss: Gioco a calcio nel parco.
    note: Unisce در پارک con فوتبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.review_to_miokni:
    title: Tu (informale) / tu fai (informale)
    gloss: tu (informale) / tu fai, pratichi (informale)
    note: تو (tu, informale) e می‌کنی (tu fai, informale) sono entrambi ripasso e si usano nel dialogo informale di questa lezione tra amici stretti.
    target_text: تو (tu, informale) / می‌کنی (tu fai/pratichi, informale)
  prs.a1.unit29.lesson04.teach.koja_word:
    title: Dove
    gloss: dove
    note: 'کجا significa «dove»: è legato a کجاست (ripasso delle Unità 5 e 6, letteralmente «dov''è»), ma qui si usa da solo davanti a un verbo.'
    target_text: کجا (dove)
  prs.a1.unit29.lesson04.teach.review_mikonad:
    title: Lui/lei fa/gioca
    gloss: lui/lei fa, pratica, gioca
    note: 'می‌کند è la forma della 3ª persona singolare (ripasso) di می‌کنم e می‌کنی. Non compare in questo dialogo: si esercita nel brano di lettura della prossima lezione.'
    target_text: می‌کند (lui/lei fa/gioca, 3ª persona)
  prs.a1.unit29.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, quante volte a settimana fai sport?'
    gloss: 'Homayoun: Zarmina, quante volte a settimana fai sport?'
    note: Una domanda informale tra amici, con la forma informale می‌کنی.
  prs.a1.unit29.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Gioco a pallavolo due volte a settimana'
    gloss: 'Zarmina: Gioco a pallavolo due volte a settimana.'
    note: Risponde con دو بار در هفته e والیبال بازی می‌کنم.
  prs.a1.unit29.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Dove giochi?'
    gloss: 'Homayoun: Dove giochi?'
    note: Usa کجا (dove), appena introdotto in questa lezione.
  prs.a1.unit29.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Gioco in palestra'
    gloss: 'Zarmina: Gioco in palestra.'
    note: Una risposta breve con در باشگاه.
  prs.a1.unit29.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Gioco a calcio al parco ogni settimana'
    gloss: 'Homayoun: Gioco a calcio al parco ogni settimana.'
    note: Introduce هر («ogni», ripasso dall'Unità 24) insieme a هفته per formare هر هفته.
  prs.a1.unit29.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Fantastico!'
    gloss: 'Zarmina: Fantastico!'
    note: عالی است chiude lo scambio in modo positivo.
  prs.a1.unit29.lesson05.teach.reading_passage:
    title: Lettura sugli sport
    gloss: Zarmina gioca a pallavolo due volte a settimana. Gioca in palestra. Homayoun gioca a calcio al parco ogni settimana.
    note: Un breve brano che riassume il lessico degli sport dell'unità e presenta می‌کند (fa, 3ª persona, ripasso) e او (lui/lei, ripasso) riferiti ai due personaggi già noti.
  prs.a1.unit29.lesson06.teach.review_ama:
    title: Ma
    gloss: ma
    note: اما significa «ma» (ripasso da unità precedenti).
    target_text: اما (ma)
  prs.a1.unit29.lesson06.teach.review_like_have_time:
    title: Mi piace / tempo / non ho
    gloss: mi piace / tempo / non ho
    note: دوست دارم («mi piace», ripasso dalle Unità 14 e 26), وقت («tempo», ripasso dalle Unità 11 e 26) e ندارم («non ho», ripasso dalle Unità 3 e 28) si combinano nella frase conclusiva.
    target_text: دوست دارم (mi piace) / وقت (tempo) / ندارم (non ho)
  prs.a1.unit29.lesson06.teach.wrap_summary:
    title: Mi piace il calcio, ma non ho tempo
    gloss: Mi piace il calcio, ma non ho tempo.
    note: Unisce una preferenza e un impedimento con اما, dando a وقت ندارم un uso concreto.
