teaching:
  fa.a1.unit17.lesson01.teach.halam_khoob_nist_phrase:
    title: Ich fühle mich nicht gut
    gloss: Ich fühle mich nicht gut
    note: حالم خوب نیست bedeutet wörtlich „mein Befinden ist nicht gut“ – die übliche Art zu sagen, dass es einem nicht gut geht.
  fa.a1.unit17.lesson01.teach.sardard_word:
    title: Kopfschmerzen
    gloss: Kopfschmerzen
    note: سردرد bedeutet Kopfschmerzen.
    example_gloss: Ich habe Kopfschmerzen.
  fa.a1.unit17.lesson01.teach.daram_word:
    title: Ich habe
    gloss: ich habe
    note: دارم bedeutet „ich habe“ und steht mit einem Nomen für eine Beschwerde (سردرد دارم = Ich habe Kopfschmerzen).
    target_text: دارم (ich habe)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: Fieber
    gloss: Fieber
    note: تب bedeutet Fieber.
    example_gloss: Ich habe Fieber.
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: Mein Bauch tut weh
    gloss: mein Bauch tut weh
    note: دلم درد می‌کنه bedeutet wörtlich „mein Bauch schmerzt“ – die umgangssprachliche Art zu sagen, dass der Bauch wehtut.
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: Ich bin müde
    gloss: Ich bin müde
    note: '*خسته‌ام* bedeutet „Ich bin müde“: Die Endung *-ام* ist die Kurzform von *هستم* (ich bin), angehängt an *خسته* (müde).'
    example_gloss: Ich bin heute müde.
  fa.a1.unit17.lesson03.teach.komak_word:
    title: Hilfe
    gloss: Hilfe
    note: کمک bedeutet Hilfe.
    example_gloss: Kannst du mir helfen?
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: Du kannst
    gloss: du kannst
    note: می‌تونی ist die umgangssprachliche Kurzform von می‌توانی (du kannst), 2. Person informell.
    target_text: می‌تونی (du kannst, umgangssprachlich)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: Können Sie mir helfen?
    gloss: Können Sie mir helfen?
    note: '*می‌تونی کمکم کنی؟* verbindet *می‌تونی* (du kannst) mit *کمکم کنی* (wörtlich „meine Hilfe tun“, also: mir helfen).'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: Arzt / Ärztin
    gloss: Arzt / Ärztin
    note: دکتر bedeutet Arzt/Ärztin.
    example_gloss: Der Arzt hat gesagt, du sollst dich ausruhen.
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: Medikament
    gloss: Medikament
    note: دارو bedeutet Medikament.
    example_gloss: Nimm dieses Medikament.
  fa.a1.unit17.lesson04.teach.esterahat_kon_phrase:
    title: Ausruhen (Befehl)
    gloss: ruhen Sie sich aus
    note: استراحت کن ist der informelle Imperativ – ruh dich aus!
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: Wasser trinken (Befehl)
    gloss: trink Wasser
    note: آب بخور ist der informelle Imperativ – trink Wasser!
  fa.a1.unit17.lesson04.teach.va_word:
    title: Und
    gloss: und
    note: و bedeutet „und“ und verbindet zwei Sätze oder Satzteile.
    target_text: و (und)
  fa.a1.unit17.lesson05.teach.reading_text:
    title: Beispielnotiz über Beschwerden
    gloss: Ich habe Kopfschmerzen und Fieber. Ich bin müde.
    note: Eine kurze Notiz in der Ich-Form mit dem Wortschatz dieser Lektion zu Beschwerden.
  fa.a1.unit17.lesson06.teach.names:
    title: Nima und Sara
    gloss: Nima, Sara
    note: Häufige iranische Namen, die in diesem Kurs immer wieder vorkommen.
    example_gloss:
    - Nima hat Kopfschmerzen.
    - Sara hilft Nima.
  fa.a1.unit17.lesson06.teach.ham_word:
    title: Auch
    gloss: auch
    note: هم bedeutet „auch“ und steht nach dem Wort, auf das es sich bezieht (آب هم بخور = trink auch Wasser).
    target_text: هم (auch)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: In Ordnung
    gloss: in Ordnung
    note: باشه ist die umgangssprachliche Kurzform von باشد (okay/einverstanden).
    example_gloss: Okay, ich ruhe mich aus.
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: Danke
    gloss: danke
    note: ممنون bedeutet „danke“.
    example_gloss: Danke für deine Hilfe.
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: Er/sie hat
    gloss: er/sie hat
    note: داره ist die umgangssprachliche Form der 3. Person von دارد (hat) – sie entspricht dem Muster von دارم in der 1. Person.
    target_text: داره (er/sie hat, umgangssprachliche 3. Person)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: Nima sagt
    gloss: Mir geht es nicht gut. Ich habe Kopfschmerzen und Fieber.
  fa.a1.unit17.lesson06.teach.dialogue_line2:
    title: Sara rät
    gloss: Ruh dich aus. Trink auch Wasser.
  fa.a1.unit17.lesson06.teach.dialogue_line3:
    title: Nima antwortet
    gloss: Okay, danke.
