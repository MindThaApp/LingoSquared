teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Samstag, Sonntag
    gloss: Samstag, Sonntag
    note: شنبه und یکشنبه sind die ersten beiden Tage der iranischen Woche, die am Samstag beginnt.
    example_gloss:
    - Heute ist Samstag.
    - Morgen ist Sonntag.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Montag, Dienstag
    gloss: Montag, Dienstag
    note: دوشنبه und سه‌شنبه folgen auf شنبه und یکشنبه.
    example_gloss:
    - Am Montag habe ich Unterricht.
    - Am Dienstag habe ich einen Termin.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Mittwoch, Donnerstag
    gloss: Mittwoch, Donnerstag
    note: چهارشنبه und پنجشنبه sind die Tage in der zweiten Wochenhälfte.
    example_gloss:
    - Am Mittwoch arbeite ich.
    - Wir sehen uns am Donnerstag.
  fa.a1.unit10.lesson01.teach.jome:
    title: Freitag
    gloss: Freitag
    note: جمعه ist der letzte Tag der Woche und in Iran der traditionelle wöchentliche Ruhetag.
    example_gloss: Freitag ist ein freier Tag.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: Der wöchentliche Ruhetag
    gloss: Freitag ist der wöchentliche freie Tag.
    note: جمعه (Freitag) ist in Iran der traditionelle wöchentliche Ruhetag, auch wenn einige moderne Betriebe inzwischen zusätzlich donnerstagnachmittags schließen.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farvardin (1. Monat)
    gloss: Farvardin, der erste Monat des iranischen Sonnenjahres
    note: فروردین eröffnet das iranische Sonnenjahr, etwa Ende März (um die Frühlings-Tagundnachtgleiche bzw. Nowruz).
    example_gloss: Farvardin ist der erste Monat des Jahres.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibehesht (2. Monat)
    gloss: Ordibehesht, der zweite Monat
    note: اردیبهشت folgt auf فروردین, etwa April–Mai.
    example_gloss: Im Ordibehesht ist das Wetter schön.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Khordad (3. Monat)
    gloss: Khordad, der dritte Monat
    note: خرداد folgt auf اردیبهشت, etwa Mai–Juni.
    example_gloss: Ich bin im Khordad geboren.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: Der iranische Sonnenkalender
    gloss: Iran verwendet den Solarhidschri-Kalender (persischen Kalender).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* besagt, dass der Iran diesen Kalender im Alltag für Datumsangaben verwendet – denselben Kalender wie Afghanistan, aber mit persischen Monatsnamen statt der arabisch geprägten Namen in Afghanistan.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Welcher Wochentag ist heute?
    gloss: Welcher Wochentag ist heute?
    note: 'امروز چندشنبه‌ست؟ fragt wörtlich: „Heute, der wievielte Wochentag ist es?“ – mit der umgangssprachlichen Verkürzung -e für چندشنبه است.'
  fa.a1.unit10.lesson03.teach.today_word:
    title: Heute
    gloss: heute
    note: امروز bedeutet „heute“.
    example_gloss: Der Wievielte ist heute?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Heute ist Donnerstag, der 10. Ordibehesht.
    gloss: Heute ist Donnerstag, der 10. Ordibehesht.
    note: امروز پنجشنبه، دهم اردیبهشته verbindet Wochentag, Ordnungszahl und Monatsnamen in einem Satz. Dabei steht die umgangssprachliche Verkürzung -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Datum
    gloss: Datum
    note: '*تاریخ* bedeutet „Datum“ – das allgemeine Wort für ein Kalenderdatum, wie in *تاریخ جلسه* (das Datum der Sitzung).'
    example_gloss: Welches Datum ist heute?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: An welchem Wochentag ist das Treffen?
    gloss: An welchem Tag ist die Besprechung?
    note: جلسه کدوم روزه؟ fragt, an welchem Wochentag eine Veranstaltung stattfindet.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Der Wievielte ist Dienstag im Ordibehesht?
    gloss: Der Wievielte ist Dienstag im Ordibehesht?
    note: سه‌شنبه چندم اردیبهشته؟ fragt nach dem genauen Datum eines genannten Wochentags.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: der 8.
    gloss: der 8.
    note: '*هشتم* bedeutet „der Achte“ (des Monats).'
    example_gloss: Heute ist der 8.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, an welchem Tag ist die Besprechung?
    gloss: Reza, an welchem Tag ist die Besprechung?
    note: Maryam fragt Reza direkt und spricht ihn mit seinem Namen an.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Ich glaube, am Dienstag.
    gloss: Ich glaube, am Dienstag.
    note: 'فکر کنم („ich glaube“) schwächt Rezas Antwort ab: Er ist nicht ganz sicher.'
  fa.a1.unit10.lesson06.teach.turn03:
    title: Der Wievielte ist Dienstag im Ordibehesht?
    gloss: Der Wievielte ist Dienstag im Ordibehesht?
    note: Maryam fragt nach und möchte das genaue Datum wissen.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Dienstag ist der 8. Ordibehesht.
    gloss: Dienstag ist der 8. Ordibehesht.
    note: Reza nennt das genaue Datum.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Okay, gut. Wie sieht es am Freitag aus, hast du Zeit?
    gloss: Okay, gut. Wie sieht es am Freitag aus, hast du Zeit?
    note: Maryam bestätigt das Datum und fragt dann nach einem anderen Tag.
  fa.a1.unit10.lesson06.teach.turn06:
    title: Nein, am Freitag habe ich viel zu tun.
    gloss: Nein, am Freitag habe ich viel zu tun.
    note: سرم شلوغه (wörtlich „mein Kopf ist voll/belebt“) ist die natürliche umgangssprachliche Art im Iran, zu sagen, dass man beschäftigt ist.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Kein Problem, wir sehen uns am Dienstag.
    gloss: Kein Problem, wir sehen uns am Dienstag.
    note: مشکلی نیست („kein Problem“) nimmt Rezas Absage höflich an, und می‌بینمت bedeutet „ich sehe dich“ – damit steht Dienstag als Tag der Besprechung fest, passend zu den Sätzen 02 und 04.
  fa.a1.unit10.lesson06.teach.va_and:
    title: Und
    gloss: und
    note: '*و* bedeutet „und“. Es kann zwei Tage verbinden, wie in *دوشنبه و سه‌شنبه*, oder zwei zusammengehörige Fragen, wie in *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: Ich habe montags und dienstags Unterricht.
