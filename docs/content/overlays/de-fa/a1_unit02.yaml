    correct_option: چ
    distractors:
    - ش
    - ج
    - خ
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ steht für „tsch“.
  fa.a1.unit02.lesson01.exercise03.match_ye_he:
    instruction: Ordnen Sie jedem Buchstaben seinen ungefähren Laut zu.
    accepted_answers:
    - value:
        ی: j (wie in „Jahr“)
        ه: h
        ک: k
        گ: g
        و: w / o
        ب: b
        خ: ch (wie in „Bach“)
        ز: s (stimmhaft, wie in „Sonne“)
      status: correct
    feedback: ی kann für y oder langes i stehen; ه ist h; ک ist k und گ ist g; و kann für v oder einen Vokal stehen und ب ist b; خ wird meist als kh umschrieben und ز ist z.
    pairs:
    - left: ی
      right: j (wie in „Jahr“)
    - left: ه
      right: h
    - left: ک
      right: k
    - left: گ
      right: g
    - left: و
      right: w / o
    - left: ب
      right: b
    - left: خ
      right: ch (wie in „Bach“)
    - left: ز
      right: s (stimmhaft, wie in „Sonne“)
