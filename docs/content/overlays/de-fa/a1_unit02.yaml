course:
  title: Persisch A1
  description: 'Iranisches Persisch für Anfänger: Sie lernen die Schrift zu lesen, Alltagssprache zu verstehen und praktische Gespräche höflich zu führen.'
units:
  fa.a1.unit02.introductions:
    title: Namen, Herkunft und Vorstellungen
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Die Buchstaben für Vorstellungen lesen
  fa.a1.unit02.lesson02.names:
    title: Einen Namen erfragen und nennen
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Singularpronomen und „sein“
  fa.a1.unit02.lesson04.countries_nationalities:
