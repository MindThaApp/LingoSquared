  fa.a1.unit02.lesson04.exercise01.iran_pair:
    instruction: Ordnen Sie jedem persischen Wort seine deutsche Bedeutung zu.
    accepted_answers:
    - value:
        ایران: Iran
        ایرانی: iranisch
        انگلیس: England
        انگلیسی: englisch
        فرانسه: Frankreich
        فرانسوی: französisch
        کشور: Land
        ملیت: Nationalität
      status: correct
