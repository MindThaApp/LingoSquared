  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Begegnung im Farsi-Kurs
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Die Buchstaben ن und ت
    gloss: n und t
    note: ن steht für n. ت steht für t; beide verbinden sich nach beiden Seiten.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Die Buchstaben ش und چ
    gloss: sch und tsch
    note: ش steht für sch und چ für tsch.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Die Buchstaben ی und ه
    gloss: j/langes i und h
    note: ی klingt wie j oder wie ein langes ī. ه ist h und ändert beim Verbinden seine Form.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Die Buchstaben ک und گ
    gloss: k und g
    note: ک steht für k; beim Tippen verwenden Sie das persische ک, nicht den ähnlich aussehenden arabischen Buchstaben. گ fügt ک einen zusätzlichen Strich hinzu und steht für g.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Die Buchstaben ج und د
    gloss: dsch und d
    note: ج steht für dsch. د steht für d und verbindet sich nicht mit dem folgenden Buchstaben nach links.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Die Buchstaben ر und ف
    gloss: r und f
    note: ر steht für r und verbindet sich nicht weiter; ف steht für f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Die Buchstaben و und ب
    gloss: w/o/u und b
    note: و kann für w oder einen Vokal stehen und verbindet sich nicht weiter. ب steht für b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Die Buchstaben خ und ز
    gloss: ch (wie in „Bach“) und s (stimmhaft, wie in „Sonne“)
    note: خ ist der Laut, der meist als kh umschrieben wird (wie das ch in „Bach“); ز steht für das stimmhafte s wie in „Sonne“.
  fa.a1.unit02.lesson02.teach.esm:
    title: Name
    gloss: Name
    note: اسم wird im gewöhnlichen Persisch des Iran esm gelesen.
    example_gloss: Mein Name ist Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: ich
    gloss: ich
    note: من ist das Personalpronomen der ersten Person Singular.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا ist ein verbreiteter iranischer Vorname.
    example_gloss: Sara ist meine Freundin.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Förmliche oder schriftliche Vorstellung
    gloss: Mein Name ist Sara.
    note: '*اسم من سارا است* ist korrekt, aber formell; Sie finden es meist in geschriebenen Texten.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Natürliche gesprochene Vorstellung
    gloss: Mein Name ist Sara.
    note: اسمم ist die Kurzform von اسم من, während ساراست aus سارا und است zusammengezogen ist.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Höflich nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: اسم شما چیه؟ ist gewöhnliches, neutral-höfliches gesprochenes Persisch im Iran.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Vertraut nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: اسمت چیه؟ ist Singular und informell; verwenden Sie es nur, wenn die Beziehung es erlaubt.
  fa.a1.unit02.lesson03.teach.man:
    title: ich
    gloss: ich
    note: من hat kein grammatisches Geschlecht.
  fa.a1.unit02.lesson03.teach.to:
    title: du, informell im Singular
    gloss: Sie
    note: تو ist informell im Singular; zur höflichen Anrede verwendet man normalerweise شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: Er oder sie
    gloss: er / sie
    note: او ist geschlechtsneutral und kann sich auf „er“ oder „sie“ beziehen.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Ich bin
    gloss: ich bin
    note: هستم ist die Vollform von بودن in der ersten Person Singular.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Du bist
    gloss: Sie sind; ihr seid
    note: هستی passt zum informellen Singular تو.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: Er oder sie ist
    gloss: er/sie ist; er/sie ist vorhanden
    note: هست ist die Vollform der dritten Person Singular und drückt oft Existenz oder Nachdruck aus.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Förmliches Prädikat der Zugehörigkeit
    gloss: Er oder sie ist Iraner(in).
    note: In einem neutralen, förmlich-schriftlichen Satz über die Identität ist است die übliche Kopula der dritten Person.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Gesprochenes Prädikat der Zugehörigkeit
    gloss: Er oder sie ist Iraner(in).
    note: ایرانیه ist die natürliche gesprochene Kurzform von ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Iran
    gloss: Iran
    note: ایران ist ein Ländername.
    example_gloss: Ich komme aus dem Iran.
  fa.a1.unit02.lesson04.teach.iranian:
    title: iranisch / Iraner(in)
    gloss: iranisch
    note: ایرانی kann die Nationalität oder Herkunft bezeichnen.
    example_gloss: Ich bin Iraner(in).
  fa.a1.unit02.lesson04.teach.england:
    title: England
    gloss: England
    note: '*انگلیس* bedeutet eigentlich England; in der Alltagssprache verwenden Iraner es oft für das gesamte Vereinigte Königreich.'
    example_gloss: Ich komme aus England.
  fa.a1.unit02.lesson04.teach.english:
    title: Englisch
    gloss: englisch
    note: انگلیسی kann die Nationalität, die Sprache oder etwas bezeichnen, das mit England zu tun hat; der Kontext klärt die Bedeutung.
    example_gloss: Ich bin Engländer.
  fa.a1.unit02.lesson04.teach.france:
    title: Frankreich
    gloss: Frankreich
    note: فرانسه ist der Name des Landes Frankreich.
    example_gloss: Ich komme aus Frankreich.
  fa.a1.unit02.lesson04.teach.french:
    title: Französisch
    gloss: französisch
    note: فرانسوی kann die Nationalität oder etwas bezeichnen, das mit Frankreich zu tun hat.
    example_gloss: Ich bin Franzose.
  fa.a1.unit02.lesson04.teach.country:
    title: Land
    gloss: Land
    note: کشور ist das allgemeine Wort für „Land“ (Staat).
    example_gloss: Iran ist ein Land.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Nationalität
    gloss: Nationalität
    note: ملیت ist das formelle Substantiv für „Nationalität“.
    example_gloss: Was ist Ihre Nationalität?
  fa.a1.unit02.lesson05.teach.ahl:
    title: Aus / stammend aus
    gloss: aus / stammend aus
    note: اهل verbindet eine Person mit ihrem Herkunftsort; es bedeutet nicht einfach, dass jemand gerade dort wohnt.
    example_gloss: Er/Sie kommt aus England.
  fa.a1.unit02.lesson05.teach.koja:
    title: Wo
    gloss: wo
    note: کجا fragt nach einem Ort.
    example_gloss: Woher kommen Sie?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Förmliche Standardfrage
    gloss: Woher kommen Sie?
    note: اهل کجا هستید؟ ist höfliches Standard-Persisch und passt in formelle Rede oder sorgfältiges Vorlesen.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Neutral-höfliche gesprochene Frage
    gloss: Woher kommen Sie?
    note: اهل کجا هستین؟ ist die übliche höfliche Sprechform im iranischen Farsi.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Informelle Frage
    gloss: Woher kommen Sie?
    note: اهل کجایی؟ ist die informelle Form für eine Person (Singular, „du“).
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Den Herkunftsort nennen
    gloss: Ich komme aus dem Iran.
    note: من اهل ایران هستم nennt die Herkunft, nicht den aktuellen Wohnort.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Kurze Antwort zur Nationalität
    gloss: Ich bin Iraner(in).
    note: '*ایرانی‌ام* entsteht, indem die Endung *ـام* („ich bin“) an *ایرانی* angehängt wird; davor steht ein kleiner Halbabstand.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Den Ort überprüfen
    gloss: Sara fragt, ob dies der Farsi-Kurs ist.
    note: ببخشید lenkt höflich die Aufmerksamkeit auf sich, bevor man eine praktische Frage stellt.
  fa.a1.unit02.lesson06.teach.yes:
    title: Ja
    gloss: ja
    note: بله ist das neutral-höfliche Wort für „ja“.
    example_gloss: Ja, natürlich.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina stellt sich vor
    gloss: Mina bestätigt den Ort, stellt sich vor und fragt Sara nach ihrem Namen.
    note: Die gesprochene höfliche Frage passt zu zwei Erwachsenen, die sich in einem Kurs begegnen.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara nennt ihren Namen
    gloss: Mein Name ist Sara.
    note: Sara verwendet das zuvor gelernte kompakte gesprochene Muster.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina fragt nach der Herkunft
    gloss: Woher kommen Sie?
    note: هستین hält das Gespräch höflich, aber natürlich und gesprochen.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Herkunft austauschen
    gloss: Sara sagt, dass sie aus England kommt, und fragt, ob Mina aus dem Iran kommt.
    note: Die beiden Sprecherinnen bleiben bei den höflichen Formen, weil sie sich gerade erst kennengelernt haben.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: Herkunft austauschen, Antwort
    gloss: Mina bestätigt, dass sie Iranerin ist.
    note: '*ایرانی‌ام* ist die Kurzform von *ایرانی هستم* („ich bin Iraner/Iranerin“).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Die Vorstellung erwidern
    gloss: Sara sagt, dass sie sich freut, Mina kennenzulernen.
    note: از آشنایی با شما خوشوقتم ist ein natürlicher Abschluss ihres Gesprächs.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Den Gruß erwidern und den Kurs betreten
    gloss: Mina sagt, dass sie sich auch freut, und bittet Sara herein.
    note: من هم همین‌طور erwidert Saras höflichen Gruß, bevor بفرمایید داخل die Kursszene weiterführt.
exercises:
