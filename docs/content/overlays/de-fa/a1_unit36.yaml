teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Nett
    gloss: lieb / freundlich
    note: '*مهربون* beschreibt jemanden, der freundlich oder warmherzig ist.'
    example_gloss: Sara ist sehr lieb.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Lustig
    gloss: lustig
    note: '*بامزه* beschreibt jemanden, der lustig oder witzig ist.'
    example_gloss: Nima ist lustig.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Schüchtern
    gloss: schüchtern
    note: '*خجالتی* beschreibt jemanden, der schüchtern ist.'
    example_gloss: Er/Sie ist ein bisschen schüchtern.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Ernst
    gloss: ernst
    note: '*جدی* beschreibt jemanden, der ernst ist.'
    example_gloss: Unser Lehrer ist ernst.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Wie das verschmolzene „ist“ an Charakterwörter tritt
    gloss: er/sie ist lieb / lustig / schüchtern (verschmolzene Kopula)
    note: '*مهربونه* verschmilzt *مهربون* + *است* direkt, weil *مهربون* auf einen Konsonanten endet. *بامزه‌ست* wird mit einem geschriebenen Zwischenraum-Nichtverbinder (ZWNJ) vor *ست* geschrieben, weil *بامزه* bereits auf den Vokal *ه* endet. *خجالتیه* hängt *ه* direkt an ein Wort auf *ی* an – dasselbe Muster wie *قهوه‌ایه* aus der Lektion über das Aussehen.'
    target_text: مهربونه = مهربون + است (verschmolzenes „ist“, nach Konsonant) / بامزه‌ست = بامزه + است (nach Vokal, mit Halbraum) / خجالتیه = خجالتی + ه (nach ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Klug
    gloss: clever / schlau
    note: '*زرنگ* beschreibt jemanden, der schlau und vor allem praktisch geschickt und einfallsreich ist.'
    example_gloss: Maryam ist sehr clever.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Faul
    gloss: faul
    note: '*تنبل* beschreibt jemanden, der faul ist.'
    example_gloss: Heute bin ich ein bisschen faul.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Fleißig
    gloss: fleißig
    note: '*زحمت‌کش* beschreibt jemanden, der hart arbeitet und sich wirklich anstrengt.'
    example_gloss: Mein Vater ist sehr fleißig.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Geduldig
    gloss: geduldig
    note: '*صبور* beschreibt jemanden, der geduldig ist.'
    example_gloss: Unser Lehrer ist sehr geduldig.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Eine Charaktereigenschaft verneinen
    gloss: er/sie ist nicht faul
    note: '*نیست* verneint die verschmolzene Kopula: *تنبل نیست* bedeutet „er/sie ist nicht faul“ – dasselbe *نیست*, das Sie schon zum Verneinen von Gefühlen gelernt haben.'
    target_text: تنبل نیست (er/sie ist nicht faul) -- نیست verneint die verschmolzene Kopula
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Persönlichkeit
    gloss: Persönlichkeit
    note: '*شخصیت* bedeutet „Persönlichkeit“ oder „Charakter“.'
    example_gloss: Seine/Ihre Persönlichkeit ist sehr gut.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Wie ist seine/ihre Persönlichkeit?
    gloss: Wie ist seine/ihre Persönlichkeit?
    note: '*چطوره؟* („wie ist …?“) kennen Sie schon aus der Lektion über Begrüßungen; *ش* ist das Possessivsuffix „sein/ihr“, angehängt an *شخصیت* („Persönlichkeit“).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: Er/Sie ist sehr lieb und clever
    gloss: Er/Sie ist sehr lieb und clever
    note: '*و* bedeutet „und“ und verbindet zwei Eigenschaftswörter.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Wie ist er/sie so?
    gloss: Wie ist er/sie so?
    note: '*چه جوریه؟* ist eine gängige umgangssprachliche Art zu fragen „Wie ist er/sie so?“ – eine Alternative zu *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Persönlichkeit / wie ist ...? / wie ist ... so?
    gloss: Persönlichkeit / wie ist ...? / wie ist er/sie so?
    note: Mit diesen drei Ausdrücken können Sie nach der Persönlichkeit eines Menschen fragen und sie benennen.
    target_text: شخصیت (Persönlichkeit) / چطوره؟ (wie ist …?) / چه جوریه؟ (wie ist … so?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / überhaupt nicht / nur / cool
    gloss: Nima / Sara / Maryam / überhaupt nicht / nur / cool
    note: '*مریم* ist die Freundin von *سارا*, bereits in der Lektion über das Aussehen vorgestellt. *اصلاً* bedeutet „überhaupt nicht“. *فقط* bedeutet „nur“. *باحال* bedeutet „cool/nett“.'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Ich würde sie gern besser kennenlernen
    gloss: Ich würde sie gern besser kennenlernen
    note: '*بیشتر* bedeutet „mehr“. *باهاش* bedeutet „mit ihm/ihr“. *آشنا بشم* bedeutet „dass ich ihn/sie kennenlerne“.'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, wie ist Maryam so?'
    gloss: Sara, wie ist Maryam so?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara: Sie ist sehr lieb und klug.'
    gloss: Sie ist sehr lieb und klug.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima: Ist sie nicht faul?'
    gloss: Ist sie nicht faul?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara: Nein, überhaupt nicht, sie ist sogar sehr fleißig. Sie ist nur ein bisschen schüchtern.'
    gloss: Nein, überhaupt nicht, sie ist sogar sehr fleißig. Sie ist nur ein bisschen schüchtern.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima: Das ist cool, ich würde sie gern besser kennenlernen.'
    gloss: Das ist cool, ich würde sie gern besser kennenlernen.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Lesetext: Maryams Persönlichkeit'
    gloss: Maryam ist Saras Freundin. Sie ist sehr lieb und klug. Auch bei der Arbeit ist sie fleißig und nie faul. Sie ist nur ein bisschen schüchtern, deshalb spricht sie in großen Gruppen nicht viel.
    note: Der Text beschreibt Maryams Persönlichkeit in der dritten Person, mit denselben Eigenschaften wie im Dialog.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Nie (mit verneintem Verb)
    gloss: nie
    note: '*هیچ‌وقت* steht mit einem verneinten Verb (*نیست*, *نمی‌زنه*) und bedeutet „nie“. Im Persischen gibt es also eine Verneinung am Verb zusammen mit هیچ‌وقت; im Deutschen steht dagegen nur „nie“ ohne zusätzliches „nicht“.'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Ich finde mich sehr fleißig, aber ich bin auch ein bisschen faul
    gloss: Ich finde mich sehr fleißig, aber ich bin auch ein bisschen faul
    note: '*فکر می‌کنم* bedeutet „ich denke/glaube“. *زحمت‌کشم* verschmilzt *زحمت‌کش* + *هستم* („ich bin“). *هستم* ist die volle, unverschmolzene Form von „ich bin“, die hier nach *هم* („auch“) zur Betonung steht.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Wie ist deine Persönlichkeit?
    gloss: Wie ist deine Persönlichkeit?
    note: '*شخصیتت* hängt das umgangssprachliche Possessivsuffix *ت* („dein“) an *شخصیت* an – die Form im *تو*-Register zu *شخصیتش*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Lieb / lustig / schüchtern / ernst / klug / faul / fleißig / geduldig
    gloss: lieb / lustig / schüchtern / ernst / klug / faul / fleißig / geduldig
    note: Das sind die acht wichtigsten Wörter zur Persönlichkeit in dieser Einheit.
