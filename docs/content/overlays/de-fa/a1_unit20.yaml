    title: Schuhe
    gloss: Schuhe
    note: کفش bedeutet „Schuhe“.
    example_gloss: Haben Sie Schuhe?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: Jacke
    gloss: Jacke
    note: کت bedeutet „Jackett“ (etwa Anzugjacke oder Blazer); für einen dicken Wintermantel verwendet man meist ein anderes Wort.
    example_gloss: Ich möchte eine Jacke.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: Schön / hübsch
    gloss: schön
    note: قشنگ ist ein gängiges Alltagswort für „schön/hübsch“ und wird oft mit der verkürzten Form -e (قشنگه) verwendet.
    example_gloss: Diese Jacke ist schön.
  fa.a1.unit20.lesson01.teach.want_word:
    title: Ich möchte (Wiederholung)
    gloss: ich möchte
    note: '*می‌خوام* ist die gesprochene Alltagsform von *می‌خواهم*. Sie sind ihr in einer früheren Einheit begegnet; hier wird sie durchgehend verwendet, um Kleidungsstücke zu verlangen.'
    target_text: می‌خوام (ich möchte)
  fa.a1.unit20.lesson01.teach.va_word:
    title: Und (Wiederholung)
    gloss: und
    note: '*و* ist das gängige Bindewort für „und“, wiederholt aus einer früheren Einheit.'
    target_text: و (und)
  fa.a1.unit20.lesson02.teach.color_word:
    title: Farbe
    gloss: Farbe
    note: رنگ ist das allgemeine Wort für „Farbe“.
    example_gloss: Welche Farbe möchten Sie?
  fa.a1.unit20.lesson02.teach.red_word:
    title: Rot
    gloss: rot
    note: قرمز bedeutet „rot“.
    example_gloss: Dieses Hemd ist rot.
  fa.a1.unit20.lesson02.teach.blue_word:
    title: Blau
    gloss: blau
    note: آبی bedeutet „blau“; mit der verkürzten Form -e (آبیه) heißt es „ist blau“.
    example_gloss: Meine Hose ist blau.
  fa.a1.unit20.lesson02.teach.black_word:
    title: Schwarz
    gloss: schwarz
    note: سیاه bedeutet „schwarz“.
    example_gloss: Schwarze Schuhe sind schön.
  fa.a1.unit20.lesson02.teach.white_word:
    title: Weiß
    gloss: weiß
    note: سفید bedeutet „weiß“.
    example_gloss: Ich möchte eine weiße Jacke.
  fa.a1.unit20.lesson03.teach.size_word:
    title: Größe
    gloss: Größe
    note: سایز ist das Alltagswort für die Kleidergröße.
    example_gloss: Welche Größe möchten Sie?
  fa.a1.unit20.lesson03.teach.big_word:
    title: Groß
    gloss: groß
    note: بزرگ bedeutet „groß“.
    example_gloss: Ich möchte eine große Größe.
  fa.a1.unit20.lesson03.teach.small_word:
    title: Klein
    gloss: klein
    note: کوچیک bedeutet „klein“; mit der verkürzten Form -e (کوچیکه) heißt es „ist klein“.
    example_gloss: Diese Schuhe sind klein.
  fa.a1.unit20.lesson03.teach.medium_word:
    title: Mittelgroß
    gloss: mittel
    note: متوسط bedeutet „mittel“ (mittlere Größe).
    example_gloss: Haben Sie eine mittlere Größe?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: Um Anprobe bitten
    gloss: Darf ich es anprobieren?
    note: می‌تونم امتحانش کنم؟ ist die alltägliche, umgangssprachliche Art, zu fragen, ob man ein Kleidungsstück anprobieren darf.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: Ja, bitte
    gloss: Ja, bitte sehr.
    note: '*بله، بفرمایید* ist eine höfliche Art, wie ein Verkäufer zustimmt; es greift *بفرمایید* aus einer früheren Einheit wieder auf.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: Die umgangssprachliche Form می‌تونم (Wiederholung)
    gloss: ich kann (gesprochene Form)
    note: 'In der Alltagssprache wird das geschriebene -ان- oft zu -ون-: *می‌توانم* wird zu *می‌تونم* (ich kann). Dieselbe Veränderung kennen Sie schon von *تومن*, der gesprochenen Form von *تومان*.'
  fa.a1.unit20.lesson05.teach.label_text:
    title: Ein Kleidungsetikett
    gloss: 'Größe: groß. Farbe: rot.'
    note: Ein kurzes Kleidungsetikett im selben Format, wie Sie es auf echter Kleidung sehen würden.
  fa.a1.unit20.lesson06.teach.please_review:
    title: Bitte / Gehen Sie ruhig voran (Wiederholung)
    gloss: bitte / nur zu
    note: Wiederholung aus einer früheren Lektion.
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: Danke (Wiederholung)
    gloss: danke
    note: Wiederholung aus einer früheren Lektion.
  fa.a1.unit20.lesson06.teach.ok_review:
    title: Okay (Wiederholung)
    gloss: in Ordnung
    note: Wiederholung aus einer früheren Lektion.
