  fa.a1.unit20.lesson01.teach.shirt_word:
    title: Hemd
    gloss: Hemd
    note: پیراهن ist das allgemeine Wort für „Hemd“.
    example_gloss: Ich möchte ein Hemd.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: Hose
    gloss: Hose
    note: شلوار bedeutet „Hose“.
