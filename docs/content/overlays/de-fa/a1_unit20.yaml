    title: Der Verkäufer begrüßt den Kunden
    gloss: Hallo, bitte sehr.
  fa.a1.unit20.lesson06.teach.turn02:
    title: Nima bittet um ein blaues Hemd
    gloss: Hallo. Ich möchte ein blaues Hemd.
  fa.a1.unit20.lesson06.teach.turn03:
    title: Der Verkäufer fragt nach der Größe
    gloss: Welche Größe möchten Sie?
  fa.a1.unit20.lesson06.teach.turn04:
    title: Nima nennt die Größe und fragt, ob er es anprobieren darf
    gloss: Mittlere Größe. Kann ich es anprobieren?
  fa.a1.unit20.lesson06.teach.turn05:
    title: Der Verkäufer stimmt zu
    gloss: Ja, bitte sehr.
  fa.a1.unit20.lesson06.teach.turn06:
    title: Nima gefällt es und er fragt nach dem Preis
    gloss: Es ist schön. Wie viel kostet das?
  fa.a1.unit20.lesson06.teach.turn07:
    title: Der Ladenbesitzer nennt den Preis
    gloss: Es kostet 30.000 Toman.
  fa.a1.unit20.lesson06.teach.turn08:
    title: Nima willigt ein, bar zu zahlen
    gloss: Okay, ich zahle bar. Danke.
