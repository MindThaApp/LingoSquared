course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: Wortschatz rund ums Telefon, einen Anruf annehmen, jemanden bitten, etwas zu wiederholen oder langsam zu sprechen, eine kurze Nachricht lesen und ein Gespräch höflich beenden.'
units:
