teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Telefon
    gloss: Handy
    note: تلفن ist das allgemeine Wort für Telefon.
    example_gloss: Wo ist mein Telefon?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Nachricht
    gloss: Nachricht
    note: پیام ist eine schriftliche Nachricht bzw. Textnachricht.
    example_gloss: Ich habe eine Nachricht.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Anrufen
    gloss: anrufen
    note: زنگ زدن (wörtlich „klingeln“) ist das alltägliche Verb für „jemanden anrufen“.
    example_gloss: Ruf mich an.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Stimme
    gloss: Stimme
    note: صدا bedeutet „Stimme“ und beschreibt, wie jemand bei einem Anruf klingt.
    example_gloss: Deine Stimme klingt gut.
  fa.a1.unit22.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gängige Bindewort („und“), das Sie aus früheren Lektionen kennen.
    target_text: و (und)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Hallo (am Telefon)
    gloss: Hallo, ich höre
    note: الو ist die Begrüßung am Telefon (von Angesicht zu Angesicht wird sie nicht verwendet); بفرمایید bedeutet hier etwa „bitte, ich höre“.
  fa.a1.unit22.lesson02.teach.its_me:
    title: Ich bin's, Narges
    gloss: Hallo, ich bin's, Narges
    note: '*منم* besteht aus *من* (ich) und der Verbendung -م („bin“) und bedeutet „ich bin''s“ – eine sehr gängige Art, sich am Telefon zu melden. (Dieselbe Schreibung kann auch „ich auch“ bedeuten, nämlich *من هم*; hier ist es aus dem Kontext klar.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Kannst du das wiederholen?
    gloss: können Sie das wiederholen?
    note: می‌شه (umgangssprachlich für می‌شود, „ist es möglich“) + تکرار کنید (wiederholen Sie) ist die übliche höfliche Bitte.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Bitte sprechen Sie langsamer
    gloss: bitte sprechen Sie langsamer
    note: آهسته‌تر ist der Komparativ von آهسته („langsam“) – „langsamer“.
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: Ich habe eine Nachricht für dich
    gloss: ich habe eine Nachricht für dich
    note: برات ist die Verkürzung von برای („für“) + ت (umgangssprachlich „dich“).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Komm morgen um vier ins Café
    gloss: komm morgen um vier ins Café
    note: بیا ist der umgangssprachliche Imperativ von آمدن („kommen“), nur aus dem Stamm gebildet – dasselbe Muster wie bei anderen Imperativen in A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Tschüss, wir sprechen später
    gloss: tschüss, wir sprechen später
    note: بعداً bedeutet „später“; صحبت می‌کنیم ist die Präsensform „wir sprechen / wir werden sprechen“.
  fa.a1.unit22.lesson05.teach.better_now:
    title: Ist es jetzt besser?
    gloss: ist es jetzt besser?
    note: الان bedeutet „jetzt“; بهتر شد heißt wörtlich „ist besser geworden“. Im Persischen steht bei dieser Nachfrage ganz natürlich die Vergangenheit, während im Deutschen meist das Präsens steht („Ist es jetzt besser?“).
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Hallo Narges, wie geht's dir?
    gloss: hallo Narges, wie geht's dir?
    note: '*چطوری* ist das informelle „Wie geht’s dir?“ und passt hier, weil Ali und Narges befreundet sind.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Deine Stimme setzt immer wieder aus
    gloss: deine Stimme setzt immer wieder aus
    note: قطع و وصل می‌شه heißt wörtlich „wird unterbrochen und verbunden“ – der natürliche persische Ausdruck für eine schlechte Telefonverbindung.
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali geht ans Telefon
    gloss: 'Ali: Hallo, bitte sehr.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges nennt ihren Namen
    gloss: 'Narges: Hallo Ali, ich bin''s, Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali grüßt zurück
    gloss: 'Ali: Hallo Narges, wie geht''s dir?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges bittet ihn, langsamer zu sprechen
    gloss: 'Narges: Gut, danke. Kannst du bitte langsamer sprechen? Deine Verbindung bricht ständig ab.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali fragt nach
    gloss: 'Ali: Okay, ist es jetzt besser?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges richtet die Nachricht aus
    gloss: 'Narges: Ja, besser. Ich habe eine Nachricht für dich: Komm morgen um vier ins Café.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Sie gehen (umgangssprachlich)
    gloss: sie gehen (gesprochene Form)
    note: '*می‌رن* ist die umgangssprachliche Form von *می‌روند* (sie gehen), im gleichen Register wie der Rest dieses Kurses.'
    target_text: می‌رن (sie gehen, umgangssprachlich)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali sagt zu
    gloss: 'Ali: Okay, ich komme auf jeden Fall.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges beendet das Gespräch
    gloss: 'Narges: Tschüss, wir sprechen später.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali verabschiedet sich
    gloss: 'Ali: Tschüss.'
