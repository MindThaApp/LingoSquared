  fa.a1.unit21.lesson01.teach.money_word:
    title: Geld
    gloss: Geld
    note: پول ist das allgemeine Wort für „Geld“.
    example_gloss: Wo ist mein Geld?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Bank
    gloss: Bank
    note: بانک ist das allgemeine Wort für „Bank“.
    example_gloss: Die Bank ist in der Nähe.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Dollar
    gloss: Dollar
    note: دلار ist das Wort für den (US-)Dollar, die gängigste Fremdwährung in alltäglichen Wechselgesprächen.
    example_gloss: Ich habe Dollar.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Umtausch
    gloss: umtauschen
    note: تبدیل bedeutet „umtauschen / umwandeln“ und wird mit کردن („machen“) zu تبدیل کردن verbunden.
    example_gloss: Ich möchte (Geld) wechseln.
  fa.a1.unit21.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gängige Bindewort („und“), das Sie aus früheren Lektionen kennen.
    target_text: و (und)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Sagen, dass Sie Geld wechseln möchten
    gloss: Ich möchte Dollar in Toman wechseln.
    note: In می‌خوام دلار به تومن تبدیل کنم steht به („in“, „zu“) vor der Zielwährung.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Fragen, wie viele Dollar jemand hat
    gloss: Wie viele Dollar haben Sie?
    note: '*چقدر دلار دارید؟* enthält *چقدر* (wie viel), ein Wort, das Sie aus früheren Fragen zu Mengen schon kennen.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Geldautomat
    gloss: Geldautomat
    note: خودپرداز bedeutet wörtlich „Selbstbediener/Selbstzahler“ und ist das gängige Wort für den Geldautomaten.
    example_gloss: Der Geldautomat ist dort drüben.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Sagen, dass Sie Geld abheben möchten
    gloss: Ich möchte am Geldautomaten Geld abheben.
    note: می‌خوام از خودپرداز پول بردارم enthält از („von“, „aus“) und بردارم („ich hebe ab“, „ich nehme heraus“).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Nach Kleingeld fragen
    gloss: Haben Sie Kleingeld?
    note: In پول خرد دارید؟ steht خرد („klein“, „Wechselgeld“) nach پول („Geld“).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Bitte sehr (Wiederholung)
    gloss: bitte sehr / bitte
    note: '*بفرمایید* wurde in einer früheren Lektion eingeführt; hier sagt man es, wenn man jemandem etwas überreicht.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Kurs
    gloss: Kurs
    note: نرخ ist das Wort für den (Wechsel-)Kurs.
    example_gloss: Wie hoch ist der Kurs heute?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Einen Kurs pro Dollar nennen
    gloss: Jeder Dollar kostet 30 Toman.
    note: هر دلار سی تومنه enthält هر (jeder/jede/jedes) und die umgangssprachliche Verkürzung auf -e (*تومنه* = *تومن است*), die Sie schon kennen.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: Hundert
    gloss: hundert
    note: صد ist die Zahl 100.
    example_gloss: Ich habe hundert Dollar.
  fa.a1.unit21.lesson06.teach.please_do:
    title: Bitte tun Sie es
    gloss: bitte wechseln Sie (es)
    note: لطفاً تبدیل کنید ist die höfliche Imperativform von تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Sara bittet darum, Geld zu wechseln
    gloss: Sara begrüßt den Angestellten und sagt, dass sie Dollar in Toman wechseln möchte.
    note: Greift می‌خوام دلار به تومن تبدیل کنم aus Lektion 2 wieder auf.
  fa.a1.unit21.lesson06.teach.turn02:
    title: Der Angestellte fragt, wie viele Dollar es sind
    gloss: Der Angestellte begrüßt Sara und fragt, wie viele Dollar sie hat.
    note: Greift چقدر دلار دارید؟ aus Lektion 2 wieder auf.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara nennt den Betrag und fragt nach dem Kurs
    gloss: Sara sagt, dass sie hundert Dollar hat, und fragt nach dem heutigen Kurs.
    note: صد („hundert“) ist neu; نرخ امروز چنده؟ greift die Kursfrage aus Lektion 5 wieder auf.
  fa.a1.unit21.lesson06.teach.turn04:
    title: Der Angestellte nennt den Kurs
    gloss: Der Angestellte sagt, dass jeder Dollar 30 Toman kostet.
    note: Greift هر دلار سی تومنه aus Lektion 5 wieder auf.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara ist einverstanden und bittet den Angestellten, fortzufahren
    gloss: Sara ist einverstanden und bittet den Angestellten, bitte zu wechseln.
    note: لطفاً تبدیل کنید, in dieser Lektion zuvor gelernt.
  fa.a1.unit21.lesson06.teach.turn06:
    title: Der Angestellte übergibt den Gesamtbetrag
    gloss: Bitte sehr, dreitausend Toman.
    note: '*سه هزار تومن* = 100 Dollar × 30 Toman pro Dollar. *هزار* (tausend) kennen Sie aus der Lektion über die Zahlen.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara bedankt sich und fragt auch nach Kleingeld
    gloss: Danke. Haben Sie auch Kleingeld?
    note: Greift پول خرد دارید؟ aus Lektion 4 wieder auf, mit هم („auch“).
  fa.a1.unit21.lesson06.teach.turn08:
    title: Der Angestellte bestätigt und übergibt es
    gloss: Ja, bitte sehr.
    note: بله („ja“) ist ein Wiederholungswort; بفرمایید schließt den Wechselvorgang ab.
