course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: die Körpergröße beschreiben (groß/klein), Haare (Länge und Farbe: schwarz, blond), Augenfarbe (braun, grün, blau), ob jemand eine Brille trägt, die Frage „Wie sieht er/sie aus?“, ein kurzer Lesetext über Nimas eigenes Aussehen (نیما) und ein Abschlussdialog zwischen نیما und سارا darüber, wie man Saras Freundin مریم erkennt.'
