teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: Er / sie
    gloss: er / sie
    note: '*او* kommt hier wieder vor, als Subjekt in Beschreibungen des Aussehens.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Körpergröße
    gloss: Körpergröße
    note: '*قد* kommt hier noch einmal allein vor. *قدش* fügt das Possessivsuffix *-ش* („seine/ihre“) hinzu, dasselbe Muster wie *امتحانش* in Lektion 20.'
    example_gloss: Nima ist groß.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Groß
    gloss: groß
    note: '*بلند* bedeutet „groß“ (auch „lang“). *قدش بلنده* heißt wörtlich „seine/ihre Größe ist hoch“ – so sagt man ganz natürlich umgangssprachlich, dass jemand groß ist.'
    example_gloss: Er ist groß.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Klein
    gloss: klein
    note: '*کوتاه* bedeutet „klein“ (von der Körpergröße) bzw. „kurz“.'
    example_gloss: Er ist klein.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: Haare
    gloss: Haar / Haare
    note: '*مو* bedeutet „Haar“. *موی* ist die Ezafe-Form (Verbindungsform) vor einem Adjektiv, wie in *موی بلند* (lange Haare).'
    example_gloss: Er hat lange Haare.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Seine / ihre Haare
    gloss: seine / ihre Haare
    note: '*موهاش* verbindet den Plural *موها* (Haare) mit dem Possessivsuffix *-ش* – „seine/ihre Haare“.'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Schwarz
    gloss: schwarz
    note: '*مشکی* ist das alltägliche Wort für schwarze Haare/Augen – hier natürlicher als *سیاه* aus Lektion 20, das eher zu Kleidung passt als zu Haaren.'
    example_gloss: Ihre Haare sind schwarz.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Blond
    gloss: blond
    note: '*بلوند* (ein Lehnwort) bedeutet „blond“.'
    example_gloss: Sie hat blonde Haare.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Auge
    gloss: Auge
    note: '*چشم* bedeutet „Auge“. *چشمای* ist die umgangssprachliche Form aus Plural + Ezafe (Augen von …), wie in *چشمای آبی* (blaue Augen).'
    example_gloss: Er hat braune Augen.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Seine / Ihre Augen
    gloss: seine / ihre Augen
    note: '*چشماش* verbindet den umgangssprachlichen Plural *چشما* mit dem Possessivsuffix *-ش* – „seine/ihre Augen“. Beachten Sie: *چشماش آبیه* hat die Singularendung *-ه*, obwohl *چشما* ein Plural ist – das ist im Persischen normal, denn bei Plural von Dingen (nicht Personen) steht meist ein Singularverb.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Braun
    gloss: braun
    note: '*قهوه‌ای* (wörtlich „kaffeefarben“) bedeutet „braun“.'
    example_gloss: Ihre Augen sind braun.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Grün
    gloss: grün
    note: '*سبز* bedeutet „grün“.'
    example_gloss: Ihre Augen sind grün.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Blau
    gloss: blau
    note: '*آبی* kommt hier wieder vor, für die Augenfarbe.'
    example_gloss: Ihre Augen sind blau.
  fa.a1.unit25.lesson04.teach.man_review:
    title: ich
    gloss: ich
    note: '*من*, schon gut bekannt, kommt hier wieder vor, für die Selbstbeschreibung.'
    example_gloss: Ich habe braune Haare.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: Ich habe / er-sie hat
    gloss: ich habe / er-sie hat
    note: '*دارم*/*داره* funktionieren genauso bei einem körperlichen Merkmal: *موی مشکی دارم* bedeutet „Ich habe schwarze Haare.“'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Brille
    gloss: Brille
    note: '*عینک* bedeutet „Brille“.'
    example_gloss: Er trägt eine Brille.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: Er/Sie trägt
    gloss: er/sie trägt
    note: '*می‌زنه* (wörtlich „schlägt/stößt“) ist das übliche Verb für „eine Brille tragen“ – *عینک می‌زنه* bedeutet „trägt eine Brille“, also ein anderes Verb als *می‌کنم* (tun/machen) aus Lektion 8 und 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: Wie sieht er/sie aus?
    gloss: Wie sieht er/sie aus?
    note: '*چه شکلیه؟* heißt wörtlich „Was für eine Form hat er/sie/es?“ – so fragt man umgangssprachlich, wie jemand aussieht.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: Und
    gloss: und
    note: '*و* bedeutet „und“ – so schon in Lektion 14 und 24 verwendet.'
    example_gloss: Er ist groß und hat schwarze Haare.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, schon in Lektion 11 als Figur eingeführt, kommt hier wieder vor.'
    example_gloss: Nima ist Saras Freund.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Lesetext: Nimas Aussehen'
    gloss: Nima ist groß. Er hat schwarze Haare und braune Augen. Er trägt eine Brille.
    note: Dieser Text verwendet alle Strukturen aus den Lektionen 1–4 – kaum neue Wörter, Sie erkennen sie nur im zusammenhängenden Text wieder.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* ist eine neue Figur – eine Freundin von سارا, die نیما noch nicht kennt.'
    example_gloss: Maryam ist Saras Freundin.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Jetzt
    gloss: jetzt
    note: '*الان* kommt hier wieder vor.'
    example_gloss: Maryam kommt gleich.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Kommt
    gloss: kommt
    note: '*میاد* ist die umgangssprachliche Präsensform von *آمدن* (kommen).'
    example_gloss: Maryam kommt gleich.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: Welche Farbe hat es?
    gloss: welche Farbe hat es?
    note: '*چه رنگیه؟* besteht aus *چه* (was, aus Lektion 4), *رنگی* (farbig, aus *رنگ* + *-ی*) und *-ه* (ist) – „Welche Farbe hat es?“'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Okay, danke
    gloss: okay, danke
    note: '*باشه* und *ممنون*, beide schon behandelt, bilden hier zusammen einen natürlichen Schlusssatz.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara: Maryam kommt gleich.'
    gloss: Maryam kommt gleich.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima: Wie sieht Maryam aus?'
    gloss: Wie sieht Maryam aus?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara: Sie ist groß und hat schwarze Haare.'
    gloss: Sie ist groß und hat schwarze Haare.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima: Welche Farbe haben ihre Augen?'
    gloss: Welche Farbe haben ihre Augen?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara: Ihre Augen sind braun.'
    gloss: Ihre Augen sind braun.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima: Okay, danke.'
    gloss: Okay, danke.
