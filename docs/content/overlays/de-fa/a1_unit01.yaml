teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Persisch wird von rechts nach links geschrieben
    gloss: Persisch wird von rechts nach links geschrieben.
    note: Lesen Sie Persisch vom rechten Rand aus nach links.
  fa.a1.unit01.lesson01.teach.seen:
    title: Der Buchstabe س
    gloss: s
    note: س steht normalerweise für einen s-Laut (wie in „Haus“ oder „Wasser“, stimmlos).
  fa.a1.unit01.lesson01.teach.lam:
    title: Der Buchstabe ل
    gloss: l
    note: ل steht für einen l-Laut und verbindet sich mit den Nachbarbuchstaben.
  fa.a1.unit01.lesson01.teach.alef:
    title: Der Buchstabe ا
    gloss: ā / a
    note: ا steht oft für langes ā und verbindet sich nicht mit dem folgenden Buchstaben.
  fa.a1.unit01.lesson01.teach.mim:
    title: Der Buchstabe م
    gloss: m
    note: م steht für einen m-Laut und verändert beim Verbinden seine Form.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Bilden Sie سلام
    gloss: hallo
    note: سلام wird salâm gelesen. Kurze Vokale werden in der persischen Schrift normalerweise weggelassen.
    example_gloss: Hallo! Ich bin Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Hallo
    gloss: hallo
    note: سلام passt in formellen wie in informellen Situationen.
    example_gloss: Hallo, geht es Ihnen gut?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Guten Morgen
    gloss: guten Morgen
    note: صبح بخیر ist ein neutral-höflicher Morgengruß.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Guten Tag oder guten Abend
    gloss: guten Tag / guten Abend
    note: عصر بخیر sagt man ab dem späteren Nachmittag bis in den Abend.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Verabschiedung
    gloss: auf Wiedersehen
    note: خداحافظ wird khodâhâfez gelesen und ist der allgemeine Standardgruß zum Abschied.
    example_gloss: Auf Wiedersehen, bis später!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Danke
    gloss: danke
    note: ممنون ist gebräuchlich und natürlich; متشکرم ist etwas förmlicher.
    example_gloss: Vielen Dank.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: Bitte / Gern geschehen
    gloss: bitte / gern geschehen
    note: خواهش می‌کنم ist die übliche Antwort auf einen Dank.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Wie geht es Ihnen? Höfliche gesprochene Form
    gloss: Wie geht es Ihnen?
    note: حالتون چطوره؟ ist neutral-höfliches, gesprochenes iranisches Persisch. حال شما چطور است؟ ist die förmlichere bzw. geschriebene Entsprechung.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: mir geht es gut
    gloss: mir geht es gut
    note: خوبم setzt sich aus خوب und der Endung der 1. Person ـم zusammen.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Guten Tag
    gloss: guten Tag
    note: روز بخیر ist höflich, wird in der lockeren Alltagssprache aber seltener gebraucht als سلام.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Gute Nacht
    gloss: gute Nacht
    note: شب بخیر ist normalerweise ein Abschiedsgruß oder Wunsch zur Schlafenszeit, kein Begrüßungsgruß.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Willkommen
    gloss: willkommen
    note: خوش آمدید ist die höfliche Form für einen oder mehrere Gäste.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Auf ein Wiedersehen
    gloss: auf ein Wiedersehen / bis wir uns wiedersehen
    note: به امید دیدار ist ein gepflegter, neutral-höflicher Abschiedsgruß.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Tschüss, bis gleich
    gloss: tschüss, bis bald
    note: فعلاً gehört zur Umgangssprache und ist weniger förmlich als خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Einen schönen Tag noch
    gloss: einen schönen Tag noch
    note: باشید kennzeichnet in diesem festen Abschiedsgruß die höfliche Form.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Neutral-höfliche gesprochene Form
    gloss: Wie geht es Ihnen?
    note: Verwenden Sie حالتون چطوره؟ bei einem fremden Erwachsenen oder in einem gewöhnlichen höflichen Gespräch. Die ausdrücklich förmliche bzw. geschriebene Form ist حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Informell
    gloss: Wie geht es Ihnen?
    note: چطوری؟ ist umgangssprachlich und passt zu Freunden, Familie und Gleichaltrigen, wenn die Beziehung es erlaubt.
  fa.a1.unit01.lesson04.teach.to:
    title: Vertrauliche Anrede
    gloss: Sie
    note: تو ist Singular und informell; verwenden Sie es nicht automatisch bei einem fremden Erwachsenen.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Sehr gut
    gloss: mir geht es sehr gut
    note: خیلی verstärkt خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Nicht schlecht
    gloss: mir geht es nicht schlecht, danke
    note: بد نیستم ist eine natürliche, gemäßigte Antwort und keine negative Klage.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: Und Ihnen? Höflich
    gloss: Und Sie?
    note: Mit شما چطور؟ geben Sie die Frage höflich zurück.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: Und dir? Informell
    gloss: Und Sie?
    note: تو چطور؟ passt zu einer informellen Beziehung.
  fa.a1.unit01.lesson05.teach.chai:
    title: Tee
    gloss: Tee
    note: '*چای* ist das Getränk Tee. Sie hören es im Angebot *چای بفرمایید* (nehmen Sie doch Tee).'
    example_gloss: Bitte, möchten Sie Tee?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Bitte, treten Sie näher
    gloss: bitte / nur zu / hier, bitte
    note: '*بفرمایید* ändert seine Bedeutung je nach Situation: Es kann „Bitte sehr“ (beim Anbieten von Tee), „Bitte, kommen Sie herein“ (an der Tür) oder „Nach Ihnen“ bedeuten.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Sie sind zu freundlich
    gloss: Sie sind sehr freundlich
    note: لطف دارید erwidert ein Kompliment höflich.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Machen Sie sich bitte keine Umstände
    gloss: bitte machen Sie sich keine Mühe
    note: زحمت نکشید kann eine aufrichtige Ablehnung oder eine höfliche erste Reaktion auf ein konkretes Angebot sein.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Danke für Ihre Freundlichkeit
    gloss: danke für Ihre Freundlichkeit
    note: Das klingt herzlicher und ausdrücklicher als ممنون allein.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: situationsabhängige iranische Höflichkeitsformen
    note: Taarof bezeichnet situationsabhängige Konventionen des Anbietens, Ablehnens, Dankens und Respektzeigens. Die Praxis hängt von Beziehung, Generation, Region und Situation ab; keine feste Zahl von Ablehnungen oder Wiederholungen entscheidet darüber, ob ein Angebot ernst gemeint ist.
  fa.a1.unit01.lesson06.teach.line01:
    title: Willkommen
    gloss: Ali heißt Narges willkommen.
    note: Das Gespräch beginnt mit der Begrüßung, bevor man sich vorstellt.
  fa.a1.unit01.lesson06.teach.line02:
    title: Willkommen, Antwort
    gloss: Narges grüßt zurück und bedankt sich.
    note: ممنون (danke) ist eine natürliche Antwort auf eine Willkommensbegrüßung.
  fa.a1.unit01.lesson06.teach.line03:
    title: Namen austauschen
    gloss: Ali sagt, wer er ist.
    note: '*من علی هستم* bedeutet „Ich bin Ali“. *هستم* („bin“) steht am Satzende.'
  fa.a1.unit01.lesson06.teach.line04:
    title: 'Namen austauschen: Antwort'
    gloss: Narges sagt, wer sie ist.
    note: Dasselbe Muster *من ... هستم*, das Ali gerade benutzt hat.
  fa.a1.unit01.lesson06.teach.line05:
    title: Angenehm
    gloss: Ali sagt, dass er sich freut, sie kennenzulernen.
    note: '*خوشوقتم* bedeutet „Es freut mich“. Zusammen mit *از آشنایی با شما* ist es die übliche höfliche Wendung, wenn man jemanden kennenlernt.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Freut mich, Antwort
    gloss: Narges erwidert die Freude.
    note: همین‌طور bedeutet in dieser Antwort „ebenso“.
  fa.a1.unit01.lesson06.teach.line07:
    title: Fragen, wie es jemandem geht
    gloss: Ali fragt höflich, wie es ihr geht.
    note: Ali verwendet die neutral-höfliche gesprochene Form auf ـتون, weil dies ein höfliches erstes Treffen ist.
  fa.a1.unit01.lesson06.teach.line08:
    title: Fragen, wie es jemandem geht, Antwort
    gloss: Narges antwortet und gibt die Frage zurück.
    note: شما چطور؟ greift die Frage auf, um sie zurückzugeben – eine gängige Abkürzung.
  fa.a1.unit01.lesson06.teach.line09:
    title: Einladung
    gloss: Ali sagt, dass es ihm auch gut geht, und bittet Narges herein.
    note: '*بفرمایید داخل* bedeutet „Bitte, kommen Sie herein“. *داخل* („drinnen“) zeigt, was angeboten wird.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Höfliche Ablehnung
    gloss: Narges bedankt sich, erklärt aber, dass sie gehen muss.
    note: Eine höfliche Absage beginnt trotzdem mit einem Dank, bevor die Ablehnung folgt. *ولی باید برم* bedeutet „aber ich muss gehen“.
  fa.a1.unit01.lesson06.teach.line11:
    title: Das Gespräch beenden
    gloss: Ali nimmt ihre Antwort an und hofft auf ein Wiedersehen.
    note: Die abgelehnte Einladung führt nun natürlich zum Abschied.
  fa.a1.unit01.lesson06.teach.line12:
    title: 'Das Gespräch beenden: Antwort'
    gloss: Narges verabschiedet sich.
    note: '*خداحافظ* ist der übliche, allgemeine Abschiedsgruß.'
