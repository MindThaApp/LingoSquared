  fa.a1.unit26.lesson01.teach.oo_review:
    title: Er / sie
    gloss: er / sie
    note: '*او* kommt hier wieder vor.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: Ich habe / er-sie hat / ich habe nicht
    gloss: ich habe / er-sie hat / ich habe nicht
    note: '*دارم*/*داره* funktionieren genauso bei einem Haustier. *ندارم* (ich habe nicht) und *نداره* (er/sie hat nicht) sind die passenden verneinten Formen – beide kamen schon zusammen im Familiendialog in Lektion 4 vor.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Tier
    gloss: Tier
    note: '*حیوان* bedeutet „Tier“.'
    example_gloss: Eine Katze ist ein Tier.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Haustier
    gloss: Haustier
    note: '*حیوان خونگی* heißt wörtlich „Haustier“ im Sinne von „Tier des Hauses“ – das ist der übliche Ausdruck für „Haustier“.'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Hund
    gloss: Hund
    note: '*سگ* bedeutet „Hund“.'
    example_gloss: Ich habe einen Hund.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Katze
    gloss: Katze
    note: '*گربه* bedeutet „Katze“.'
    example_gloss: Er/Sie hat eine Katze.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Vogel
    gloss: Vogel
    note: '*پرنده* bedeutet „Vogel“.'
    example_gloss: Sie hat einen Vogel.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Fisch
    gloss: der Fisch
    note: '*ماهی* bedeutet „Fisch“.'
    example_gloss: Ich habe einen Fisch.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Du hast
    gloss: du hast
    note: '*داری* kommt hier wieder vor, in derselben informellen Form der 2. Person.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: '*حیوان خونگی داری؟* verbindet *حیوان خونگی* aus Lektion 1 mit *داری* – so fragt man ganz natürlich, ob jemand ein Haustier hat.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Ja
    gloss: ja
    note: '*آره* ist das alltägliche, umgangssprachliche Wort für „ja“.'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Name
    gloss: Name
    note: '*اسم* funktioniert genauso für den Namen eines Haustiers.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Wie heißt er/sie/es?
    gloss: wie heißt er/sie/es?
    note: '*اسمش چیه؟* verbindet das Possessivsuffix *-ش* (schon bei *قدش*/*موهاش* in Lektion 25 gesehen) mit *چیه؟* aus Lektion 2 – „Wie heißt er/sie/es?“'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Essen
    gloss: Essen
    note: '*غذا* ist dasselbe Wort, das auch für Tierfutter verwendet wird.'
    example_gloss: Ich mag Essen.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Ich gebe / ich füttere
    gloss: ich gebe / ich füttere
    note: '*می‌دم* (wörtlich „ich gebe“), schon in *گوش می‌دم* in Lektion 24 vorgekommen, ist zusammen mit *غذا* das natürliche Verb für „ein Haustier füttern“.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Mein Hund
    gloss: mein Hund
    note: '*سگم* verbindet *سگ* mit dem Possessivsuffix *-م* – „mein Hund“, dasselbe verschmolzene Muster wie *اسمم* in Lektion 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Ich füttere meinen Hund.
    gloss: Ich füttere meinen Hund.
    note: '*سگم رو غذا می‌دم* verwendet *رو* (die Objektmarkierung, schon in *قهوه رو بیشتر دوست دارم* in Lektion 14 gesehen), um *سگم* als das Wesen zu markieren, das gefüttert wird.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: Welche Farbe hat es?
    gloss: welche Farbe hat es?
    note: '*چه رنگیه؟* funktioniert genauso, um die Farbe eines Haustiers zu erfragen.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Weiß
    gloss: weiß
    note: '*سفید* kommt hier wieder vor, für die Farbe eines Haustiers. *گربه‌ی* ist die Ezafe-Form von *گربه* vor einem Besitzer, wie in *گربه‌ی من* (meine Katze) – dasselbe Muster wie *خونه‌ی من* in Lektion 19, bei Nomen, die auf einen Vokal enden, statt eines angehängten Suffixes.'
    example_gloss: Meine Katze ist weiß.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Klein
    gloss: klein
    note: '*کوچیک* kommt hier wieder vor, für die Größe eines Haustiers.'
    example_gloss: Mein Fisch ist klein.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Groß
    gloss: groß
    note: '*بزرگ* kommt hier wieder vor, für die Größe eines Haustiers.'
    example_gloss: Mein Hund ist groß.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, schon in Lektion 2 als Figur eingeführt, kommt hier wieder vor.'
    example_gloss: Sara hat eine Katze.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: Eins / ein
    gloss: eins / ein
    note: '*یک* wird hier als unbestimmter Artikel „ein/eine“ verwendet.'
  fa.a1.unit26.lesson05.teach.va_review:
    title: Und
    gloss: und
    note: '*و* bedeutet „und“ – so schon in Lektion 14, 24 und 25 verwendet.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Paschmak
    gloss: Paschmak
    note: '*پشمک* (wörtlich „Zuckerwatte“) ist ein gängiger echter Haustiername im Iran – der Name von Saras Katze.'
    example_gloss: Saras Katze heißt Paschmak.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: Jeden Tag
    gloss: jeden Tag
    note: '*هر روز* funktioniert hier genauso beim Füttern eines Haustiers.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: Er/Sie gibt / füttert
    gloss: er/sie gibt / füttert
    note: '*می‌ده* ist die umgangssprachliche Form der 3. Person desselben Verbs wie *می‌دم* (ich gebe/füttere) aus Lektion 3.'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Lesetext: Saras Katze'
    gloss: Sara hat eine Katze. Sie heißt Paschmak. Paschmak ist weiß und klein. Sara füttert Paschmak jeden Tag.
    note: Dieser Text verwendet alle Strukturen aus den Lektionen 1–4 – kaum neue Wörter, Sie erkennen sie nur im zusammenhängenden Text wieder.
  fa.a1.unit26.lesson06.teach.in_word:
    title: Dies
    gloss: dieser / diese / dieses
    note: '*این* bedeutet „dies/diese/dieser“.'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: Wem gehört es?
    gloss: wem gehört es?
    note: '*کیه* wird hier verwendet, um zu fragen, wem ein Haustier gehört.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: Es gehört mir
    gloss: es gehört mir
    note: '*منه* ist die umgangssprachliche Verkürzung von *من است* – „es gehört mir“. *گربه‌ی منه* bedeutet „Das ist meine Katze“.'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: Es ist mein Hund
    gloss: es ist mein Hund
    note: '*سگمه* verbindet *سگم* (mein Hund) aus Lektion 3 mit derselben Endung *-ه* („ist“) wie in *منه* – „Das ist mein Hund“.'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Süß
    gloss: süß
    note: '*خوشگل* bedeutet „süß“ oder „hübsch“. *خیلی* bedeutet „sehr“.'
    example_gloss: Saras Katze ist sehr süß.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: Danke
    gloss: danke
    note: '*ممنون* taucht hier als natürlicher Schlusssatz wieder auf.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Nima: Wem gehört diese Katze?'
    gloss: Wem gehört diese Katze?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Sara: Das ist meine Katze. Sie heißt Paschmak.'
    gloss: Das ist meine Katze. Sie heißt Paschmak.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Nima: Welche Farbe hat sie?'
    gloss: Welche Farbe hat sie?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Sara: Weiß und klein.'
    gloss: Weiß und klein.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Nima: Sehr süß!'
    gloss: Sehr süß!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Sara: Danke!'
    gloss: Danke!
