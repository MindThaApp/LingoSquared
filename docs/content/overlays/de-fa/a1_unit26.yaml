course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: gängige Haustiere und Tiere benennen (Hund, Katze, Vogel, Fisch), fragen „Hast du ein Haustier?“, den Namen eines Haustiers nennen und es füttern, Farbe und Größe eines Haustiers beschreiben, ein kurzer Lesetext über Saras Katze پشمک (سارا) und ein Abschlussdialog zwischen سارا und نیما, die پشمک bewundern.'
