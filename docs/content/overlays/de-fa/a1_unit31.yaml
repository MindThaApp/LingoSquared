course:
  title: Persisch A1
  description: 'Umgangssprachliches Persisch (Iran) für Anfänger: Wörter rund um Feste und Geburtstag (Geburtstag, Party, Kuchen, Geschenk), fragen und sagen, wann man Geburtstag hat (*تولدت کِیه؟*), mit bereits gelernten Monats- und Ordnungszahlwörtern, jemanden zu einer Party einladen und eine Einladung annehmen (*میای به مهمونی؟* / *آره، حتماً میام*), ein Geburtstagsdialog zwischen Nima und Sara mit *تولدت مبارک* („Alles Gute zum Geburtstag“), ein Lesetext über Nimas Geburtstag und ein abschließender Rückblick, in dem Sie Feste nennen, die Sie mögen, und eine eigene Einladung oder einen Glückwunsch schreiben.'
