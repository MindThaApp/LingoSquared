course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: Sportarten benennen (Fußball, Basketball, Volleyball, Schwimmen), fragen „Welchen Sport magst du?“, sagen, wo man Sport treibt (Fitnessstudio, Schwimmbad, Park), über die Häufigkeit sprechen (jeden Tag, jede Woche, manchmal, N-mal), ein kurzer Lesetext über Nimas Sportroutine und ein Abschlussdialog zwischen نیما und سارا, in dem sie vergleichen, welchen Sport sie treiben, wie oft und wo.'
