  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: Fortbewegungsmittel benennen (Bus, U-Bahn, Auto, Fahrrad, zu Fuß, Taxi), sagen, wie man regelmäßig pendelt (jeden Tag mit dem Bus zur Arbeit), fragen, welches Verkehrsmittel besser ist (اتوبوس یا مترو، کدوم بهتره؟), nach dem Preis eines Fahrscheins fragen und einen kurzen Fahrplansatz lesen, ein Lesetext über die Arbeits- und Schulwege von نیما und سارا und ein Abschlussdialog zwischen نیما und سارا, in dem sie vergleichen, wie sie unterwegs sind.'
