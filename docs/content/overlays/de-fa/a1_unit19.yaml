    title: Beispiel einer Wohnungsbeschreibung
    gloss: Mein Haus hat zwei Schlafzimmer. Es hat auch eine Küche und ein Badezimmer.
    note: Eine kurze Beschreibung in der Ich-Form, die den Wortschatz zum Wohnen aus dieser Einheit verbindet.
  fa.a1.unit19.lesson06.teach.names:
    title: Nima und Sara
    gloss: Nima, Sara
    note: Häufige iranische Namen, die in diesem Kurs immer wieder vorkommen.
