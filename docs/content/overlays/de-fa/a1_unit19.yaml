  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: Es ist gut
    gloss: es ist gut
    note: خوبه ist die umgangssprachliche Kurzform von خوب است („es ist gut“).
    example_gloss: Dieses Haus ist gut.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Ja
    gloss: ja
    note: آره ist die umgangssprachliche Form von بله (ja).
    example_gloss: Ja, es ist gut.
