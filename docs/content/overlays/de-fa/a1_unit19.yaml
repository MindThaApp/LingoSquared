    target_text: بالای (über/oben auf)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: Das ist das Bett
    gloss: es ist das Bett
    note: '*تخته* ist *تخت* (Bett) plus das umgangssprachliche -e für „ist“ (von *است*). In *میز کنار تخته* macht das -e am Ende der Wendung den Satz erst vollständig: Der Tisch [ist] neben dem Bett.'
    target_text: تخته (es ist das Bett, umgangssprachlich)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: Das ist die Küche
    gloss: es ist die Küche
    note: '*آشپزخانه‌س* ist *آشپزخانه* (Küche) plus das umgangssprachliche „ist“ nach einem Vokal (von *است*). In *صندلی تو آشپزخانه‌س* beendet es den Satz: Der Stuhl [ist] in der Küche.'
    target_text: آشپزخانه‌س (es ist die Küche, umgangssprachlich)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: Auch
    gloss: auch
    note: هم bedeutet „auch“ und steht nach dem Wort, auf das es sich bezieht.
