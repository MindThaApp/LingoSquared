    gloss: Haus von / mein Haus
    note: خونه‌ی ist die Ezafe-Form von خونه und steht vor dem Besitzer (خونه‌ی من = mein Haus).
    target_text: خونه‌ی (Haus von / mein Haus, Ezafe-Form)
