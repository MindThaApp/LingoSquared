    example_gloss: Mein Haus ist groß.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Schlafzimmer
    gloss: Schlafzimmer
    note: اتاق خواب heißt wörtlich „Schlafzimmer“ (Raum zum Schlafen).
    example_gloss: Es hat zwei Schlafzimmer.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Küche
    gloss: Küche
    note: آشپزخانه bedeutet Küche.
    example_gloss: Die Küche ist groß.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Badezimmer
    gloss: Badezimmer
    note: حموم bedeutet Badezimmer (umgangssprachliche Form von حمام).
    example_gloss: Das Badezimmer ist sauber.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Wie viele
    gloss: wie viele
    note: چند تا bedeutet „wie viele“ und steht bei zählbaren Nomen.
    target_text: چند تا (wie viele)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Zwei
    gloss: zwei
    note: دو تا bedeutet „zwei“ (von etwas Zählbarem).
    example_gloss: Es hat zwei Badezimmer.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: Es hat
    gloss: er/sie/es hat
    note: داره ist die umgangssprachliche Kurzform von دارد („hat“) und wird verwendet, um zu beschreiben, was ein Zuhause enthält.
    target_text: داره (es hat, umgangssprachlich)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Bett
    gloss: Bett
    note: تخت bedeutet Bett.
    example_gloss: Das Bett ist im Schlafzimmer.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Tisch
    gloss: Tisch
    note: میز bedeutet Tisch.
    example_gloss: Der Tisch steht neben dem Fenster.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Stuhl
    gloss: Stuhl
    note: صندلی bedeutet Stuhl.
    example_gloss: Neben dem Tisch steht ein Stuhl.
  fa.a1.unit19.lesson03.teach.ye_word:
