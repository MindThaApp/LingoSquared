course:
  title: Persisch A1
  description: 'Iranisches Persisch für Anfänger: Wortschatz zu Essen und Trinken, höflich im Restaurant bestellen, nach der Speisekarte und nach Empfehlungen fragen, Mengenangaben und Restaurant-Etikette einschließlich der Bitte um die Rechnung.'
units:
