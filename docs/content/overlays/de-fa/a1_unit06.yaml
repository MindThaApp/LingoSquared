    title: Essen und eine Mahlzeit bestellen
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Essen und Getränke
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Höflich bestellen
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Nach der Speisekarte fragen und eine Empfehlung bekommen
  fa.a1.unit06.lesson04.quantities:
    title: Bestimmte Mengen bestellen
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Restaurantetikette und die Rechnung
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Ein ganzes Gespräch im Restaurant
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Brot
    gloss: Brot
    note: نان gehört zu jeder iranischen Mahlzeit; meist ist es Fladenbrot, das zu fast allem gereicht wird.
    example_gloss: Ich mag Brot.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Reis
    gloss: der Reis
    note: برنج (Reis) ist fester Bestandteil der meisten iranischen Hauptgerichte.
    example_gloss: Reis mit Hähnchen ist lecker.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Hähnchen
    gloss: das Hähnchen
    note: مرغ bedeutet sowohl das Tier (Huhn) als auch das Fleisch (Hähnchen).
    example_gloss: Ich esse Hähnchen.
  fa.a1.unit06.lesson01.teach.ab:
    title: Wasser
    gloss: das Wasser
    note: آب ist das gewöhnliche Wort für Wasser.
    example_gloss: Ich möchte Wasser.
  fa.a1.unit06.lesson01.teach.chai:
    title: Tee
    gloss: Tee
    note: چای ist das Getränk, das man in Iran fast überall angeboten bekommt; es kam schon in der Taarof-Lektion in Einheit 1 vor.
    example_gloss: Einen Tee, bitte.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Kaffee
    gloss: Kaffee
    note: قهوه wird in iranischen Städten neben Tee immer üblicher.
    example_gloss: Der Kaffee ist heiß.
  fa.a1.unit06.lesson01.teach.mive:
    title: Das Obst
    gloss: Obst
    note: میوه ist ein Oberbegriff für jede Art von Obst.
    example_gloss: Ich mag Obst.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: Und / oder
    gloss: و (und), یا (oder)
    note: Beides sind gängige Bindewörter, mit denen man bei einer Bestellung Speisen und Getränke verbindet.
    target_text: و (und)، یا (oder)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Höflich Tee bestellen
    gloss: Ich hätte gern einen Tee.
    note: می‌خواستم ist wörtlich eine Vergangenheitsform von „wollen“, wirkt aber als höfliche, abgeschwächte Bitte – der passende Ton gegenüber einem Kellner oder Verkäufer, den Sie nicht kennen.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Bitte
    gloss: bitte
    note: لطفاً kann man fast jeder Bitte hinzufügen, um sie freundlicher zu machen.
    example_gloss: Bitte helfen Sie mir.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Tee umgangssprachlich bestellen
    gloss: Ich möchte einen Tee.
    note: یه چای می‌خوام verwendet die umgangssprachlichen Formen یه (ein) und می‌خوام (ich will). Sagen Sie das nur zu engen Freunden oder Familienmitgliedern, nicht zu einem Kellner, den Sie gerade erst treffen.
  fa.a1.unit06.lesson02.teach.register_note:
    title: Das richtige Bestellverb wählen
    gloss: Verwenden Sie می‌خواستم bei Fremden oder dem Kellner und می‌خوام nur bei engen Freunden.
    note: Das ist die auf das Bestellen bezogene Version des Unterschieds im Sprachniveau, den Sie bei den Begrüßungen in Einheit 1 kennengelernt haben.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Höflich Brot bestellen
    gloss: Ich hätte gern etwas Brot.
    note: Dasselbe Muster mit می‌خواستم funktioniert mit jeder Speise und jedem Getränk.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Speisekarte
    gloss: Speisekarte
    note: منو ist ein Lehnwort und wird genauso verwendet wie „Menü“ bzw. „Speisekarte“ im Deutschen.
    example_gloss: Die Speisekarte, bitte.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Nach der Speisekarte fragen
    gloss: Haben Sie eine Speisekarte?
    note: منو دارید؟ fragt wörtlich „Haben Sie eine Speisekarte?“ – die übliche Art, danach zu fragen.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Nach einer Empfehlung fragen
    gloss: Was empfehlen Sie?
    note: چی توصیه می‌کنید؟ ist eine natürliche, häufige Frage an den Kellner.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Was der Kellner Sie fragt
    gloss: Was möchten Sie?
    note: چی میل دارید؟ ist die höfliche Standardfrage, mit der ein Kellner das Bestellgespräch eröffnet.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Hähnchenkebab
    gloss: Hähnchenkebab
    note: جوجه‌کباب (mariniertes gegrilltes Hähnchen) gehört zu den häufigsten Gerichten auf iranischen Speisekarten.
    example_gloss: Ich nehme den Hähnchenkebab.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: Der Kellner empfiehlt das Gericht
    gloss: Der Hähnchenkebab ist heute sehr gut.
    note: خوبه ist die gesprochene Kurzform von خوب است und passt zu einer lockeren Empfehlung des Kellners.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Ja, bitte sehr
    gloss: Ja, bitte sehr.
    note: بله heißt „ja“; بفرمایید (schon aus der Taarof-Lektion in Einheit 1 bekannt) sagt man auch hier, wenn man jemandem etwas reicht, zum Beispiel die Speisekarte.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Ein Glas Tee
    gloss: ein Glas Tee
    note: لیوان (Glas) ist das Zählwort für Getränke, die in einem Glas serviert werden.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Zwei Stück Brot
    gloss: zwei Stück Brot
    note: تا ist ein Zählwort, das bei den meisten zählbaren Dingen nach der Zahl steht, hier bei zwei Stück Brot.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Ein Teller Reis
    gloss: ein Teller Reis
    note: بشقاب (Teller) ist das Zählwort für Essen, das auf einem Teller serviert wird.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Eine ganze Bestellung zusammenstellen
    gloss: Einen Teller Reis und zwei Stück Brot, bitte.
    note: Mehrere Mengenangaben können in einer Bestellung mit و (und) verbunden werden.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Das Zählwort تا
    gloss: 'تا steht bei zählbaren Dingen nach der Zahl: دو تا (zwei), سه تا (drei).'
    note: Das ist dasselbe allgemeine Zählmuster, das in Einheit 3 mit den Zahlen gelernt wird, hier angewandt auf das Bestellen von Essen.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: Die Rechnung
    gloss: die Rechnung
    note: صورت‌حساب ist das übliche Wort für die Rechnung im Restaurant.
    example_gloss: Die Rechnung, bitte.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Nach der Rechnung fragen
    gloss: Könnten Sie mir bitte die Rechnung bringen?
    note: صورت‌حساب رو لطف می‌کنید؟ ist eine höfliche, natürliche Art, im Restaurant um die Rechnung zu bitten.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Sagen, dass das Essen lecker war
    gloss: Es war sehr lecker.
    note: خیلی خوشمزه بود ist ein natürliches Kompliment an den Kellner oder Gastgeber nach dem Essen.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Guten Appetit
    gloss: Guten Appetit
    note: نوش جان sagt man zu jemandem, der isst oder gleich essen wird, ungefähr wie „Guten Appetit“; die essende Person sagt es nicht über ihr eigenes Essen.
  fa.a1.unit06.lesson05.teach.chashm:
    title: Die höfliche Bestätigung des Kellners
    gloss: Sofort.
    note: چشم، الان میارم ist eine respektvolle Art des Personals, eine Bitte zu bestätigen und zu sagen, dass es das Gewünschte sofort bringt.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Restaurant
    gloss: Restaurant
    note: رستوران ist das gewöhnliche Wort für „Restaurant“, den Schauplatz des Dialogs in dieser Einheit.
    example_gloss: Dieses Restaurant ist gut.
  fa.a1.unit06.lesson06.teach.turn01:
    title: Der Kellner begrüßt den Gast
    gloss: Der Kellner heißt den Gast willkommen und fragt, was er möchte.
    note: چی میل دارید؟ ist dieselbe höfliche Eröffnungsfrage aus Lektion 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: Der Gast fragt nach der Speisekarte
    gloss: Der Gast grüßt den Kellner und fragt nach der Speisekarte.
    note: منو دارید؟ eröffnet das Bestellgespräch.
  fa.a1.unit06.lesson06.teach.turn03:
    title: Der Kellner reicht die Speisekarte
    gloss: Der Kellner bestätigt und reicht die Speisekarte.
    note: بفرمایید ist dasselbe höfliche Wort zum Anbieten aus Einheit 1, hier beim Überreichen von etwas.
  fa.a1.unit06.lesson06.teach.turn04:
    title: Der Gast bittet um eine Empfehlung
    gloss: Der Gast fragt, was der Kellner empfiehlt.
    note: چی توصیه می‌کنید؟ aus Lektion 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: Der Kellner empfiehlt ein Gericht
    gloss: Der Kellner sagt, der Hähnchenkebab sei heute sehr gut.
    note: جوجه‌کباب امروز خیلی خوبه verwendet das umgangssprachliche خوبه, wie es in gesprochenen Empfehlungen üblich ist.
  fa.a1.unit06.lesson06.teach.turn06:
    title: Der Kunde gibt eine ganze Bestellung auf
    gloss: Der Gast stimmt zu und bestellt Hähnchenkebab mit Reis und dazu einen Tee.
    note: Hier wird می‌خواستم verwendet, passend für einen Kellner, den der Gast nicht persönlich kennt.
  fa.a1.unit06.lesson06.teach.turn07:
    title: Der Kellner bestätigt die Bestellung
    gloss: Der Kellner sagt, dass er es sofort bringt.
    note: چشم، الان میارم aus Lektion 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: Der Kunde lobt das Essen und fragt nach der Rechnung
    gloss: Der Kunde sagt, dass es lecker war, und fragt nach der Rechnung.
    note: Beide Wendungen greifen direkt den Wortschatz aus Lektion 5 auf.
  fa.a1.unit06.lesson06.teach.turn09:
    title: Der Kellner bringt die Rechnung
    gloss: Der Kellner stimmt zu und sagt, dass er sie sofort bringt.
    note: البته (natürlich) ist hier eine natürliche, höfliche Zustimmung.
