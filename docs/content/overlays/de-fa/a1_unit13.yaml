    title: ich
    gloss: ich
    note: من ist das alleinstehende Personalpronomen der 1. Person, hier zur Betonung verwendet (من خونه موندم – ich für meinen Teil bin zu Hause geblieben).
    example_gloss: Ich bin zu Hause geblieben.
  fa.a1.unit13.lesson06.teach.names:
    title: Nima und Sara
    gloss: Nima, Sara
    note: نیما und سارا sind die beiden Sprecher im Dialog dieser Lektion.
    example_gloss:
    - Nima ist zu Hause geblieben und hat ein Buch gelesen.
    - Sara ist gestern ins Kino gegangen.
