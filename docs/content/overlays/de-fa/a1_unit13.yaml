    title: Beispieltext über ein aktuelles Ereignis
    gloss: Gestern bin ich ins Kino gegangen. Ich habe einen guten Film gesehen. Danach habe ich zu Mittag gegessen.
    note: Ein kurzer Bericht in der ersten Person, der den Wortschatz der Vergangenheit dieser Lektion verbindet.
