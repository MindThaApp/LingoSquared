  fa.a1.unit13.lesson03.teach.chikar_word:
    title: Was (Tätigkeit)
    gloss: was (Tätigkeit)
    note: چیکار (was für eine Arbeit/Tätigkeit) wird benutzt, um zu fragen, was jemand getan hat.
    example_gloss: Was hast du gestern gemacht?
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: Du hast gemacht
    gloss: du hast gemacht
    note: کردی ist das einfache Präteritum von کردن (machen, tun), informelle 2. Person.
    example_gloss: Was hast du gemacht?
