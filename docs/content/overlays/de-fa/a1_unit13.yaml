course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: das einfache Präteritum, beschreiben, was gestern passiert ist, nach einem kürzlichen Ereignis fragen, über ein kürzliches Ereignis lesen und schreiben und ein Dialog, in dem zwei Personen ihr Wochenende vergleichen.'
