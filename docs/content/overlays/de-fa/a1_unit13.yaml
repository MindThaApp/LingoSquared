    note: خونه موندم bedeutet „ich bin zu Hause geblieben“ und verwendet das umgangssprachliche خونه („Haus, zu Hause“).
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: Und du?
    gloss: Und du?
    note: تو چی؟ heißt wörtlich „du, was?“ und ist eine natürliche Art, eine Frage zurückzugeben.
