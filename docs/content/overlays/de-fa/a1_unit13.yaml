    title: Was hast du gestern gemacht?
    gloss: Was hast du gestern gemacht?
    note: Nima fragt zu Beginn, was Sara gestern gemacht hat.
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: Ich bin ins Kino gegangen und habe einen guten Film gesehen. Und du?
    gloss: Ich bin ins Kino gegangen und habe einen guten Film gesehen. Und du?
    note: Sara antwortet und gibt die Frage zurück.
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: Ich bin zu Hause geblieben und habe ein Buch gelesen.
    gloss: Ich bin zu Hause geblieben und habe ein Buch gelesen.
    note: Nima beschreibt seinen eigenen Tag.
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: Super!
    gloss: Großartig!
    note: Sara reagiert positiv und beendet damit den Austausch.
  fa.a1.unit13.lesson06.teach.third_person_past:
    title: Er/sie ging, sah, machte, blieb, las (3. Person)
    gloss: er/sie ging, sah, machte, blieb, las (3. Person)
    note: رفت، دید، کرد، موند، خوند sind die Formen der einfachen Vergangenheit in der 3. Person. Man braucht sie, um zu vergleichen, was Sara und Nima jeweils gemacht haben.
    target_text: رفت، دید، کرد، موند، خوند (er/sie ging, sah, tat, blieb, las – 3. Person)
