    example_gloss: Ich habe zu Mittag gegessen.
  fa.a1.unit13.lesson01.teach.didam_word:
    title: Ich habe gesehen
    gloss: ich habe gesehen
    note: دیدم ist das einfache Präteritum von دیدن (sehen), 1. Person.
    example_gloss: Ich habe einen guten Film gesehen.
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: Kino
    gloss: Kino
    note: سینما bedeutet „Kino“.
    example_gloss: Gestern bin ich ins Kino gegangen.
  fa.a1.unit13.lesson02.teach.be_word:
    title: Nach / zu
    gloss: nach / zu
    note: به bedeutet „zu“ bzw. „nach“ und steht vor einem Ziel.
    target_text: به (nach/zu)
