    title: Ich koche gern, aber ich habe keine Zeit
    gloss: Ich koche gern, aber ich habe keine Zeit
    note: '*دوست دارم* bedeutet „ich mag“. *ولی* bedeutet „aber“. *وقت ندارم* bedeutet „ich habe keine Zeit“.'
