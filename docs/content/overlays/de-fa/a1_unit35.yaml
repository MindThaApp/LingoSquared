    title: Ghormeh Sabzi
    gloss: Ghormeh Sabzi (persischer Kräutereintopf)
    note: '*قرمه‌سبزی* ist ein bekannter iranischer Eintopf mit Kräutern und Bohnen, ein alltägliches Gericht der Hausmannskost.'
