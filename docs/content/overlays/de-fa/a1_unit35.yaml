    title: Er/sie kocht / macht / gießt ein / wird
    gloss: er/sie kocht / macht / gießt / wird
    note: '*می‌پزه*, *می‌کنه*, *می‌ریزه* und *می‌شه* sind die umgangssprachlichen Formen der 3. Person der Verben, die zuvor in der 1. Person vorkamen.'
