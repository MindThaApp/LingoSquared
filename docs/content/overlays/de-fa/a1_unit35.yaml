    title: 'Nima: Hallo, was kochst du?'
    gloss: Hallo, was kochen Sie?
  fa.a1.unit35.lesson04.teach.dialogue_line2:
    title: 'Sara: Ich koche Ghormeh Sabzi.'
    gloss: Ich koche Ghormeh Sabzi.
  fa.a1.unit35.lesson04.teach.dialogue_line3:
    title: 'Nima: Willst du Hilfe?'
    gloss: Willst du Hilfe?
  fa.a1.unit35.lesson04.teach.dialogue_line4:
    title: 'Sara: Ja, hack bitte die Zwiebel.'
    gloss: Ja, hack bitte die Zwiebel.
  fa.a1.unit35.lesson04.teach.dialogue_line5:
    title: 'Nima: Okay.'
    gloss: Okay.
  fa.a1.unit35.lesson04.teach.dialogue_line6:
    title: 'Sara: Danke, das Essen wird sehr lecker.'
    gloss: Danke, das Essen wird sehr lecker.
  fa.a1.unit35.lesson05.teach.reading_text:
    title: 'Lesetext: Sara kocht Ghormeh Sabzi'
    gloss: Sara ist in der Küche. Sie kocht Ghormeh Sabzi. Zuerst hackt Nima die Zwiebel, danach brät Sara sie in Öl an. Sie gibt auch Salz dazu. Das Essen gart langsam und wird sehr lecker.
    note: Der Text erzählt die Handlungen des Dialogs mit Verbformen der dritten Person nach; wie im Dialog hackt Nima die Zwiebel.
