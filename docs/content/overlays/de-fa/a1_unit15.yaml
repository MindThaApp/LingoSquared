teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Dies
    gloss: dieser / diese / dieses
    note: این bedeutet „dies“.
    example_gloss: Dies ist größer als das.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: Das
    gloss: das
    note: اون bedeutet „jene/r/s“ (umgangssprachliche Form von آن).
    example_gloss: Das ist kleiner als dies.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: Es ist größer
    gloss: es ist größer
    note: بزرگ‌تره ist die umgangssprachliche Kurzform von بزرگ‌تر است (es ist größer). بزرگ‌تر ist der Komparativ von بزرگ (groß).
    example_gloss: Dies ist größer als das.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: Es ist kleiner
    gloss: es ist kleiner
    note: کوچیک‌تره ist die umgangssprachliche Kurzform von کوچیک‌تر است (es ist kleiner).
    example_gloss: Das ist kleiner als dies.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Als
    gloss: als
    note: 'از markiert den Vergleichspunkt: X از Y بزرگ‌تره bedeutet „X ist größer als Y“.'
    target_text: از (als)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Es ist teurer
    gloss: es ist teurer
    note: گرون‌تره ist die umgangssprachliche Kurzform von گرون‌تر است. گرون‌تر ist der Komparativ von گرون (teuer).
    example_gloss: Dies ist teurer als das.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Es ist billiger
    gloss: es ist billiger
    note: ارزون‌تره ist die umgangssprachliche Kurzform von ارزون‌تر است. ارزون‌تر ist der Komparativ von ارزون (billig).
    example_gloss: Das ist billiger als dies.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima und Sara
    gloss: Nima, Sara
    note: Häufige iranische Namen, die in diesem Kurs immer wieder vorkommen.
    example_gloss:
    - Nima ist größer als Sara.
    - Sara ist jünger als Nima.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Größer
    gloss: größer / er/sie ist größer
    note: '*قد بلندتره* bedeutet wörtlich „die Größe ist höher“: *قد* (Körpergröße) + *بلندتر* (größer, Komparativ von *بلند*, hoch/lang/groß) + *است* (ist), zu *-ه* verkürzt.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Jünger
    gloss: jünger / er/sie ist jünger
    note: جوون‌تره ist die umgangssprachliche Kurzform von جوون‌تر است. جوون‌تر ist der Komparativ von جوون (jung).
    example_gloss: Sara ist jünger als Nima.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: Es ist besser
    gloss: es ist besser
    note: '*بهتره* ist die umgangssprachliche Kurzform von *بهتر است*. *بهتر* (besser) ist der unregelmäßige Komparativ von *خوب* (gut).'
    example_gloss: Dies ist besser als das.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: Es ist schlechter
    gloss: es ist schlechter
    note: '*بدتره* ist die umgangssprachliche Kurzform von *بدتر است*. *بدتر* (schlechter) ist der regelmäßige Komparativ von *بد* (schlecht): dasselbe Wort plus die gewöhnliche Endung *تر*, anders als das unregelmäßige *بهتر*.'
    example_gloss: Das ist schlechter als dies.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Weil
    gloss: weil
    note: چون leitet eine Begründung ein.
    target_text: چون (weil)
  fa.a1.unit15.lesson04.teach.va_word:
    title: Und
    gloss: und
    note: و bedeutet „und“ und verbindet zwei Sätze oder Satzteile.
    target_text: و (und)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Beispieltext zu einem Vergleich
    gloss: Nima ist größer als Sara. Sara ist jünger als Nima.
    note: Ein kurzer Vergleich in der dritten Person, der den Wortschatz dieser Lektion verbindet.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima und Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima hat gesagt, dieses hier ist teurer.
    - Sara hat gesagt, jenes ist billiger.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Aber
    gloss: aber
    note: ولی bedeutet „aber“ und leitet einen Gegensatz ein.
    target_text: ولی (aber)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Ja
    gloss: ja
    note: آره ist die umgangssprachliche Form von بله (ja).
    example_gloss: Ja, das stimmt.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima sagt
    gloss: Dies ist teurer als das, aber es ist besser.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara antwortet
    gloss: Ja, aber jenes ist billiger.
