  fa.a1.unit37.lesson02.teach.review_negation:
    title: Das Auto ist nicht schwarz, sondern weiß
    gloss: Das Auto ist nicht schwarz, es ist weiß.
    note: '*نیست* verneint die verschmolzene Kopula, bereits in der Lektion über Gefühle gelernt – dasselbe Muster wie *تنبل نیست* („er/sie ist nicht faul“) aus der Persönlichkeitslektion.'
    target_text: ماشین سیاه نیست، سفیده. (Das Auto ist nicht schwarz, sondern weiß.) -- نیست verneint die verschmolzene Kopula
  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: Welche Farbe hat es?
    gloss: Welche Farbe hat sie?
    note: '*رنگش* hängt das Possessivsuffix *ش* („seine/ihre“) an *رنگ* („Farbe“) an – dasselbe Muster wie *شخصیتش*/*موهاش*/*چشماش*. *چیه؟* („was ist es?“) wurde bereits in der Lektion über Vorstellungen gelernt (*اسم شما چیه؟*).'
  fa.a1.unit37.lesson03.teach.che_rangiye:
