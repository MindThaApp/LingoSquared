    gloss: Welche Farbe hat sie?
    note: '*چه رنگیه؟* ist eine ebenso gängige alternative Art, dieselbe Frage zu stellen – dasselbe Muster wie *چه جوریه؟* aus der Persönlichkeitslektion.'
  fa.a1.unit37.lesson03.teach.answer_rang_mashinam:
