  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: Zwei Arten, nach der Farbe zu fragen
    gloss: Welche Farbe hat es? / Was für eine Farbe ist es?
    note: '*رنگش چیه؟* und *چه رنگیه؟* stellen dieselbe Frage und sind in der Umgangssprache austauschbar.'
    target_text: رنگش چیه؟ (Welche Farbe hat es? -- ش ist das Possessivsuffix, wie bei شخصیتش/موهاش/چشماش) / چه رنگیه؟ (eine alternative Formulierung, dasselbe Muster wie چه جوریه؟)
