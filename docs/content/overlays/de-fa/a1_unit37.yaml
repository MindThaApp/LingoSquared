  fa.a1.unit37.lesson01.teach.review_known_colors:
    title: 'Bereits bekannte Farben: weiß / schwarz / rot / blau / grün / braun'
    gloss: Farbe / weiß / schwarz / rot / blau / grün / braun
    note: '*رنگ* („Farbe“), *سفید*, *سیاه*, *قرمز* und *آبی* wurden bereits in der Kleidungslektion gelernt; *سبز* und *قهوه‌ای* bereits in der Lektion über das Aussehen. Diese Lektion verwendet sie alle, ohne sie neu einzuführen.'
    target_text: رنگ (Farbe) / سفید (weiß) / سیاه (schwarz) / قرمز (rot) / آبی (blau) / سبز (grün) / قهوه‌ای (braun) -- aus früheren Lektionen bereits bekannt
  fa.a1.unit37.lesson02.teach.banafsh:
