teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: Universität
    gloss: Universität
    note: '*دانشگاه* ist das gängige, alltägliche Wort für „Universität“.'
    example_gloss: Diese Universität ist gut.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Student / Studentin
    gloss: Student/Studentin
    note: '*دانشجو* bedeutet „Student/Studentin“ (an der Universität). *من دانشجو هستم* („Ich bin Student/Studentin“) verwendet die bereits bekannte Form *هستم*.'
    example_gloss: Ich bin Student/in.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Lektion / Fach
    gloss: Lektion / Fach
    note: '*درس* bedeutet sowohl „Lektion“ als auch, allgemeiner, „Studienfach“.'
    example_gloss: Dieses Fach ist interessant.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Sprache
    gloss: Sprache
    note: '*زبان* ist das gängige Wort für „Sprache“.'
    example_gloss: Persisch ist eine Sprache.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Ich / dies
    gloss: ich / dieser
    note: '*من* und *این* kommen hier wieder vor, um über Ihr Studium zu sprechen.'
    target_text: من (ich) / این (dieser/diese/dieses)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: In / an
    gloss: in / bei
    note: '*در* bedeutet „in“ oder „an“ und wird hier für „an der Universität“ verwendet.'
    target_text: در (in / an)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Studieren/lesen + ich = ich studiere/lese
    gloss: studieren/lesen + ich = ich studiere/lese
    note: '*خوندن* („lesen“ oder „lernen/studieren“, wie in *کتاب خوندن*) erhält im Präsens dieselbe Endung *-م* wie *می‌کنم* und ergibt *می‌خونم*: „ich lese“ oder „ich studiere“.'
    target_text: خوندن (studieren/lesen) + م = می‌خونم (ich studiere/lese)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Ich studiere an der Universität
    gloss: Ich studiere an der Uni
    note: '*من در دانشگاه درس می‌خونم* setzt sich zusammen aus *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Mathe
    gloss: Mathe
    note: '*ریاضی* ist das übliche Wort für „Mathe“ bzw. „Mathematik“.'
    example_gloss: Mathe ist interessant.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Studienfach / Fachrichtung
    gloss: Studienfach / Fachrichtung
    note: '*رشته* bedeutet „Studienfach“ oder „Fachrichtung“. In *رشته‌ی من* („mein Studienfach“) verbindet das zusätzliche *ی* das Nomen mit *من*.'
    example_gloss: Mein Studienfach ist Sprache.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Englisch
    gloss: Englisch
    note: '*انگلیسی* („Englisch“) kommt hier wieder vor, diesmal als Name eines Fachs, das Sie studieren können.'
    target_text: انگلیسی (Englisch)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Lernen + ich = ich lerne
    gloss: lernen + ich = ich lerne
    note: '*یاد گرفتن* bedeutet „lernen“. Die Präsensform *یاد می‌گیرم* verwendet dasselbe Verb *گرفتن* wie *عکس می‌گیرم* („ich mache ein Foto“), aber in anderer Bedeutung.'
    target_text: یاد گرفتن (lernen) + م = یاد می‌گیرم (ich lerne)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Du studierst/liest
    gloss: du studierst / du liest (informell)
    note: '*می‌خونی* ist die informelle Form der 2. Person zu *می‌خونم*; man verwendet sie, um jemanden direkt zu fragen.'
    target_text: می‌خونی (du studierst/liest, informell)
  fa.a1.unit30.lesson02.teach.review_chi:
    title: Was
    gloss: was
    note: '*چی* („was“) kommt hier wieder vor.'
    target_text: چی (was)
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: Was studierst du?
    gloss: Was studierst du?
    note: '*چی درس می‌خونی؟* fügt alle Bausteine dieser Lektion zusammen.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Mein Hauptfach ist Mathe. Ich lerne auch Englisch.
    gloss: Mein Hauptfach ist Mathe. Ich lerne auch Englisch.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* nennt Ihr Studienfach und ein weiteres Fach, mit der Objektmarkierung *رو* und *هم* („auch“).'
  fa.a1.unit30.lesson03.teach.review_koja:
