  fa.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Nima: Ja, es ist schwer, aber interessant.'
    gloss: Ja, es ist schwer, aber interessant.
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Sara: Wie schön!'
    gloss: Wie schön!
