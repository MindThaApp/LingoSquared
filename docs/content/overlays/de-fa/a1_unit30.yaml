    note: '*به* („zu, nach“) kommt hier wieder vor, für „zur Uni“.'
    target_text: به (zu / nach)
  fa.a1.unit30.lesson03.teach.review_miram:
    title: Ich gehe
    gloss: ich gehe / ich fahre
    note: '*می‌رم* („ich gehe“) kommt hier wieder vor, für „zur Uni gehen“.'
    target_text: می‌رم (ich gehe)
  fa.a1.unit30.lesson03.teach.review_har_ruz:
