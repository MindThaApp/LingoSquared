    title: 'Lesetext: Das Studium von Nima und Sara'
    gloss: Nima studiert an der Uni Mathe. Mathe ist schwer, aber interessant. Sara studiert Englisch. Sie geht jeden Tag zur Uni.
    note: Dieser Text erzählt den Dialog in der 3. Person nach. Es gibt fast keine neuen Wörter, daher üben Sie hier vor allem, Wörter im zusammenhängenden Text wiederzuerkennen.
