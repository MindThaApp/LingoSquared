    title: Ich mag / Zeit / Ich habe nicht
    gloss: ich mag / Zeit / ich habe nicht
    note: '*دوست دارم*, *وقت* und *ندارم* verbinden sich hier zu einem natürlichen Satz über eine Vorliebe und eine Einschränkung beim Lernen.'
    target_text: دوست دارم (ich mag) / وقت (Zeit) / ندارم (ich habe nicht)
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: Manchmal
    gloss: manchmal
    note: '*گاهی* („manchmal“) kommt hier wieder vor.'
    target_text: گاهی (manchmal)
