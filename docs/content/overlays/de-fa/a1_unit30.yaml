course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: Wörter rund um Universität und Studium (Universität, Student/Studentin, Lektion/Fach, Sprache), darüber sprechen, welches Fach man studiert oder lernt (Mathe, Studienfach, Englisch als Fach), fragen und antworten, wo man studiert (*کجا درس می‌خونی؟*) und wie oft man hingeht, ein Lesetext über das Studium von *نیما* und *سارا* sowie ein Abschlussdialog zwischen *نیما* und *سارا* über ihre Fächer und was sie davon halten (schwer, aber interessant).'
