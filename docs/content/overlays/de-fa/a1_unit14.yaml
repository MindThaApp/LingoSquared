teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: ich mag
    gloss: ich mag
    note: دوست دارم bedeutet wörtlich „Ich habe Freundschaft (mit ihm/ihr/es)“ – die übliche Art, „Ich mag …“ zu sagen.
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Kaffee
    gloss: Kaffee
    note: قهوه bedeutet „Kaffee“.
    example_gloss: Ich mag Kaffee.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Tee
    gloss: Tee
    note: چای bedeutet „Tee“.
    example_gloss: Tee gefällt mir nicht.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: ich mag nicht
    gloss: Ich mag nicht
    note: دوست ندارم ist die Verneinung von دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: ich
    gloss: ich
    note: من bedeutet „ich“ – oft weggelassen, weil die Verbendung das Subjekt schon zeigt, kann aber zur Betonung stehen.
    example_gloss: Ich mag Musik.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Welche/r/s
    gloss: welche/r/s
    note: کدوم bedeutet „welche(r/s)“.
    example_gloss: Welches mögen Sie?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: Musik
    gloss: Musik
    note: موسیقی bedeutet „Musik“.
    example_gloss: Ich mag Musik.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Du willst
    gloss: du willst
    note: می‌خوای ist die umgangssprachliche Form der 2. Person von می‌خواهی („du willst“).
    target_text: می‌خوای (du möchtest, umgangssprachlich)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Welches mögen Sie?
    gloss: Welches mögen Sie?
    note: کدوم رو دوست داری؟ – رو markiert das Objekt (schriftsprachlich را), داری ist die 2. Person von داشتن („haben“).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Mehr
    gloss: mehr
    note: بیشتر bedeutet „mehr“.
    example_gloss: Ich mag Kaffee lieber.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Oder
    gloss: oder
    note: یا bedeutet „oder“ und bietet die Wahl zwischen zwei Dingen an.
    target_text: یا (oder)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Kaffee oder Tee?
    gloss: Kaffee oder Tee?
    note: قهوه یا چای؟ bietet die Wahl zwischen den beiden Getränken aus Lektion 1 an.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Weil
    gloss: weil
    note: چون leitet eine Begründung ein.
    target_text: چون (weil)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: Es schmeckt gut
    gloss: es ist lecker
    note: خوشمزه‌ست ist die umgangssprachliche Kontraktion von خوشمزه است („es ist lecker“).
    example_gloss: Der Kaffee ist lecker.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: Es ist interessant
    gloss: es ist interessant
    note: جالبه ist die umgangssprachliche Kontraktion von جالب است („es ist interessant“).
    example_gloss: Diese Musik ist interessant.
  fa.a1.unit14.lesson04.teach.va_word:
    title: Und
    gloss: und
    note: '*و* bedeutet „und“ und kann zwei kurze Aussagen verbinden, etwa dass man etwas mag und es beschreibt. Es ist lockerer als *چون* (weil), das den Grund direkt nennt.'
    target_text: و (und)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Ein häufiger iranischer Frauenname.
    example_gloss: Sara mag Tee.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: Er/sie mag
    gloss: er/sie mag
    note: داره ist die umgangssprachliche Form der dritten Person von دارد (hat). دوست داره bedeutet „er/sie mag“ und entspricht dem Muster von دوست دارم in der ersten Person.
    target_text: دوست داره (er/sie mag, umgangssprachliche 3. Person)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: Er/sie mag nicht
    gloss: er/sie mag nicht
    note: نداره ist die umgangssprachliche verneinte Form der dritten Person. دوست نداره bedeutet „er/sie mag nicht“.
    target_text: دوست نداره (er/sie mag nicht, umgangssprachliche 3. Person)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: Es ist warm
    gloss: es ist warm
    note: گرمه ist die umgangssprachliche Kurzform von گرم است (es ist warm).
    example_gloss: Der Tee ist warm.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Beispieltext über Vorlieben
    gloss: Sara mag Tee, weil er warm ist. Sara mag keine Musik.
    note: Ein kurzer Bericht in der 3. Person, der den Wortschatz dieser Lektion zu Vorlieben verbindet.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima und Sara
    gloss: Nima, Sara
    note: Häufige iranische Namen, die in diesem Kurs immer wieder vorkommen.
    example_gloss:
    - Nima mag Tee.
    - Sara mag Kaffee.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: Und du?
    gloss: Und du?
    note: تو چی؟ ist eine kurze, gebräuchliche Art, die Frage an das Gegenüber zurückzugeben.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: Das ist großartig
    gloss: das ist großartig
    note: عالیه ist die umgangssprachliche Kurzform von عالی است (es ist großartig).
    example_gloss: Das ist großartig.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima fragt
    gloss: Tee oder Kaffee – was mögen Sie lieber?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara antwortet
    gloss: Ich mag Kaffee lieber, weil er lecker ist. Und Sie?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima antwortet
    gloss: Ich mag Tee, weil er warm ist.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara reagiert
    gloss: Das ist großartig!
