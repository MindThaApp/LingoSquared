  fa.a1.unit07.lesson01.teach.or_word:
    title: Oder
    gloss: oder
    note: یا verbindet zwei alternative Wetterlagen.
    target_text: یا (oder)
  fa.a1.unit07.lesson02.teach.hot:
    title: Heiß
    gloss: heiß
    note: گرم beschreibt heißes Wetter oder allgemein Wärme.
