  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: Begründung und Vorschlag verbinden
    gloss: Da es regnet, nehmen wir besser einen Regenschirm mit.
    note: چون بارونیه، بهتره چتر ببریم verbindet eine Wetterbegründung mit einem Vorschlag.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: Vorschlagen, einen Mantel anzuziehen
    gloss: Da es kalt ist, ziehen wir besser einen Mantel an.
    note: چون سرده، بهتره کت بپوشیم folgt demselben Muster aus Begründung und Vorschlag, hier bei kaltem Wetter.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: Vorschlagen, einen Mantel anzuziehen
    gloss: wir ziehen besser einen Mantel an
    note: کت بپوشیم folgt demselben Muster بهتره + Verb wie چتر ببریم, hier bei kaltem Wetter.
    example_gloss: Es ist kalt, lass uns einen Mantel anziehen.
  fa.a1.unit07.lesson06.teach.turn01:
    title: Sara fragt nach dem heutigen Wetter
    gloss: Sara fragt, wie das Wetter heute ist.
    note: هوا چطوره؟ greift die Frage aus Lektion 3 wieder auf.
  fa.a1.unit07.lesson06.teach.turn02:
    title: Reza sagt, dass es regnet
    gloss: Reza sagt, er glaubt, es ist regnerisch.
    note: فکر کنم (ich glaube) schwächt die Aussage ab, da er nur vermutet und nicht sicher ist.
  fa.a1.unit07.lesson06.teach.turn03:
    title: Sara schlägt vor, einen Regenschirm mitzunehmen
    gloss: Sara sagt, dann nehmen sie besser einen Regenschirm mit.
    note: پس (dann/also) verbindet die Wetterlage mit dem Vorschlag.
  fa.a1.unit07.lesson06.teach.turn04:
    title: Reza stimmt zu und fragt nach morgen
    gloss: Reza stimmt zu und fragt, wie es morgen ist.
    note: فردا چی؟ ist eine natürliche, knappe Art, nach dem nächsten Tag zu fragen.
  fa.a1.unit07.lesson06.teach.turn05:
    title: Sara beschreibt das Wetter von morgen
    gloss: Sara sagt, morgen wird es sonnig und heiß.
    note: آفتابیه و گرمه verbindet zwei verkürzte Wetterformen mit و.
  fa.a1.unit07.lesson06.teach.turn06:
    title: Reza schlägt vor, in den Park zu gehen
    gloss: Reza sagt, das sei toll, also gehen sie in den Park.
    note: عالیه (toll) ist eine positive Reaktion, bevor der Plan vorgeschlagen wird.
  fa.a1.unit07.lesson06.teach.turn07:
    title: Sara stimmt zu und verabschiedet sich
    gloss: Sara stimmt zu und sagt, dass sie ihn morgen sieht.
    note: باشه (okay) ist eine gängige umgangssprachliche Art, einem Plan zuzustimmen.
