    gloss: آفتابیه ist die gesprochene Alltagsform von آفتابی است.
    note: 'Dasselbe Muster (Adjektiv + ه) gilt für jedes Wetterwort: سرده، گرمه، بارونیه، ابریه، برفیه.'
