  fa.a1.unit07.lesson02.teach.cold:
    title: Kalt
    gloss: kalt
    note: سرد beschreibt kaltes Wetter oder allgemein Kälte.
    example_gloss: Im Winter ist es kalt.
  fa.a1.unit07.lesson02.teach.cool:
    title: Kühl
    gloss: kühl
    note: خنک beschreibt mildes, kühles Wetter zwischen گرم und سرد.
    example_gloss: Abends ist es kühl.
