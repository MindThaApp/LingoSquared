    title: Fragen, wie das Wetter ist
    gloss: Wie ist das Wetter?
    note: هوا چطوره؟ verwendet چطوره, das umgangssprachliche „wie ist“, das Sie schon aus حالتون چطوره؟ in Lektion 1 kennen.
