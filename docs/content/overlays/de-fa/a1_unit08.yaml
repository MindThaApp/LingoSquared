teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: Laden
    gloss: Geschäft
    note: مغازه ist das allgemeine Wort für einen kleinen Laden oder ein Geschäft.
    example_gloss: Dieser Laden ist groß.
  fa.a1.unit08.lesson01.teach.price_word:
    title: Preis
    gloss: Preis
    note: قیمت ist das allgemeine Wort für „Preis“.
    example_gloss: Was kostet das?
  fa.a1.unit08.lesson01.teach.discount_word:
    title: Rabatt
    gloss: Rabatt
    note: تخفیف bedeutet „Rabatt“ und ist im iranischen Alltag beim Einkaufen und Feilschen ein gängiges Wort.
    example_gloss: Haben Sie einen Rabatt?
  fa.a1.unit08.lesson01.teach.apple_word:
    title: Apfel
    gloss: Apfel
    note: سیب ist ein gängiges Beispiel, um Preise und Mengen zu üben.
    example_gloss: Ich möchte einen Apfel.
  fa.a1.unit08.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gebräuchliche Bindewort, das in dieser Lektion immer wieder vorkommt.
    target_text: و (und)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: Fragen, was etwas kostet
    gloss: Wie viel kostet das?
    note: این چنده؟ ist die alltägliche, umgangssprachliche Art, nach dem Preis zu fragen, eine Verkürzung von این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: Einen Kilopreis nennen
    gloss: Das Kilo kostet 30 Toman.
    note: کیلویی سی تومنه nennt einen Preis pro Kilo mit der umgangssprachlichen Verkürzung auf -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: Die umgangssprachliche Verkürzung auf -e (Wiederholung)
    gloss: تومنه ist die gesprochene Kurzform von تومن است.
    note: Es ist dasselbe Muster, das Sie schon bei Wetterwörtern wie آفتابیه gesehen haben.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: Um ein Kilo Äpfel bitten
    gloss: Ich möchte ein Kilo Äpfel.
    note: یک کیلو سیب می‌خوام verwendet کیلو (Kilo) als Mengeneinheit.
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: Um ein halbes Kilo bitten
    gloss: Ich möchte ein halbes Kilo.
    note: نصف کیلو می‌خوام setzt نصف (halb) statt eines ganzen Kilos ein.
  fa.a1.unit08.lesson04.teach.discount_question:
    title: Um Rabatt bitten
    gloss: Geben Sie Rabatt?
    note: تخفیف می‌دید؟ ist eine natürliche, häufige Frage auf iranischen Basaren und in Geschäften – Feilschen gehört dort ganz normal zum Einkaufen und gilt weder als unhöflich noch als ungewöhnlich.
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: Der Verkäufer nennt einen niedrigeren Preis
    gloss: Ich berechne Ihnen 28 Toman.
    note: برات بیست و هشت تومن حساب می‌کنم ist ein kleiner Nachlass gegenüber dem ursprünglichen Preis von 30 Toman.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: Sagen, dass man bar bezahlt
    gloss: Ich zahle bar.
    note: نقدی حساب می‌کنم nennt die Zahlungsart mit نقدی (bar).
  fa.a1.unit08.lesson05.teach.card_question:
    title: Nach Kartenzahlung fragen
    gloss: Nehmen Sie Karten?
    note: کارت می‌گیرید؟ fragt, ob Kartenzahlung möglich ist.
  fa.a1.unit08.lesson06.teach.please_review:
    title: Bitte / Gehen Sie ruhig voran (Wiederholung)
    gloss: bitte / nur zu
    note: بفرمایید kam schon in der Einheit über Begrüßungen vor; hier lädt der Ladenbesitzer damit den Kunden ein.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: Danke (Wiederholung)
    gloss: danke
    note: ممنون kam schon in der Einheit über Begrüßungen vor.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: Keine Ursache (Wiederholung)
    gloss: keine Ursache / gern geschehen
    note: قابلی نداره ist eine bescheidene, gebräuchliche Art, einen Dank abzuwehren, und kam schon in einer früheren Einheit vor.
  fa.a1.unit08.lesson06.teach.turn01:
    title: Der Ladenbesitzer begrüßt den Kunden
    gloss: Der Ladenbesitzer begrüßt den Kunden und bittet ihn herein.
    note: بفرمایید lädt den Kunden ein, sich umzusehen oder etwas zu fragen.
  fa.a1.unit08.lesson06.teach.turn02:
    title: Der Kunde fragt nach dem Preis
    gloss: Der Kunde begrüßt den Ladenbesitzer und fragt nach dem Preis der Äpfel.
    note: این چنده؟ aus Lektion 2, hier angewendet auf سیب‌ها (die Äpfel).
  fa.a1.unit08.lesson06.teach.turn03:
    title: Der Ladenbesitzer nennt den Preis
    gloss: Der Ladenbesitzer sagt, das Kilo kostet 30 Toman.
    note: کیلویی سی تومنه aus Lektion 2.
  fa.a1.unit08.lesson06.teach.turn04:
    title: Der Kunde bestellt und bittet um Rabatt
    gloss: Der Kunde sagt, dass er ein Kilo möchte, und fragt nach einem Rabatt.
    note: Hier verbinden sich das Mengenmuster aus Lektion 3 und die Rabattfrage aus Lektion 4.
  fa.a1.unit08.lesson06.teach.turn05:
    title: Der Ladenbesitzer willigt in einen niedrigeren Preis ein
    gloss: Der Ladenbesitzer stimmt zu und bietet 28 Toman an.
    note: باشه (einverstanden) zeigt Zustimmung, bevor der reduzierte Preis genannt wird.
  fa.a1.unit08.lesson06.teach.turn06:
    title: Der Kunde bedankt sich und bezahlt
    gloss: Der Kunde bedankt sich beim Ladenbesitzer und sagt, dass er bar zahlt.
    note: Hier verbinden sich der Zahlungswortschatz aus Lektion 5 und ein einfaches Danke.
  fa.a1.unit08.lesson06.teach.turn07:
    title: Der Ladenbesitzer beschließt das Gespräch
    gloss: Der Ladenbesitzer wehrt den Dank ab und sagt „bitte“.
    note: قابلی نداره، بفرمایید beendet den Kauf höflich.
