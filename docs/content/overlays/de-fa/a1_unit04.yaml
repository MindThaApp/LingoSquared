teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Mutter
    gloss: Mutter
    note: مادر ist das neutrale Wort für „Mutter“ in der Schriftsprache und in formellen Situationen.
    example_gloss: Meine Mutter ist freundlich.
  fa.a1.unit04.lesson01.teach.maman:
    title: Mama
    gloss: Mama
    note: مامان ist das alltägliche Wort der gesprochenen Sprache, das die meisten Familien tatsächlich verwenden.
    example_gloss: Mama, ich habe Hunger.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Vater
    gloss: Vater
    note: پدر ist das neutrale Wort für „Vater“ in der Schriftsprache und in formellen Situationen.
    example_gloss: Mein Vater ist Arzt.
  fa.a1.unit04.lesson01.teach.baba:
    title: Papa
    gloss: Papa
    note: بابا ist das alltägliche Wort der gesprochenen Sprache, das die meisten Familien tatsächlich verwenden.
    example_gloss: Papa, wo bist du?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Bruder
    gloss: Bruder
    note: برادر; die gesprochene, liebevolle Form داداش kommt später in dieser Lektion vor.
    example_gloss: Ich habe einen Bruder.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Schwester
    gloss: Schwester
    note: خواهر ist das Standardwort für „Schwester“.
    example_gloss: Meine Schwester ist Studentin.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Formelle und alltägliche Wörter
    gloss: Mama und Papa sind wie Mutter und Vater, aber umgangssprachlicher.
    note: 'Das Persische hat für die Eltern zwei echte Register, keine strikte Trennung in formell und informell: مامان/بابا nennen die meisten Menschen ihre Eltern tatsächlich, auch in höflicher Gesellschaft.'
  fa.a1.unit04.lesson02.teach.daram:
    title: Ich habe
    gloss: ich habe
    note: '*دارم* ist die Form der ersten Person von *داشتن* („haben“) – das zentrale Verb, um die Familie zu beschreiben.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Eins
    gloss: eins
    note: یک steht vor einem gezählten Nomen, z. B. یک برادر (ein Bruder).
    example_gloss: Ich habe eine Schwester.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: Ich habe einen Bruder.
    gloss: Ich habe einen Bruder.
    note: 'Wortstellung: Subjekt, Menge + Nomen, Verb – typisch persische SOV-Stellung.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: Ich habe keine Schwester.
    gloss: Ich habe keine Schwester.
    note: ندارم ist die Verneinung von دارم; ein eigenes Wort für „eine“ ist nicht nötig.
  fa.a1.unit04.lesson02.teach.family_big:
    title: Meine Familie ist groß.
    gloss: Meine Familie ist groß.
    note: بزرگه ist die gesprochene, zusammengezogene Form von „بزرگ است“ (ist groß).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Unsere Familie ist klein.
    gloss: Unsere Familie ist klein.
    note: کوچیکه ist die gesprochene, zusammengezogene Form von „کوچک است“ (ist klein), mit der umgangssprachlichen Aussprache کوچیک statt geschriebenem کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Großvater
    gloss: Großvater
    note: پدربزرگ, wörtlich „großer Vater“ – gilt für beide Seiten der Familie.
    example_gloss: Mein Großvater ist alt.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Großmutter
    gloss: Großmutter
    note: مادربزرگ, wörtlich „große Mutter“ – gilt für beide Seiten der Familie.
    example_gloss: Meine Großmutter ist freundlich.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Onkel väterlicherseits
    gloss: Onkel (Bruder des Vaters)
    note: عمو bedeutet speziell „Bruder des Vaters“, nicht allgemein „Onkel“.
    example_gloss: Mein Onkel wohnt in Teheran.
  fa.a1.unit04.lesson03.teach.amme:
    title: Tante väterlicherseits
    gloss: Tante (Schwester des Vaters)
    note: عمه bedeutet speziell „Schwester des Vaters“.
    example_gloss: Meine Tante ist Lehrerin.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Onkel mütterlicherseits
    gloss: Onkel (Bruder der Mutter)
    note: دایی bedeutet speziell „Bruder der Mutter“ – im Persischen wird bei jeder Tante und jedem Onkel unterschieden, von welcher Seite der Familie sie stammen; das Deutsche sagt dagegen einfach „Onkel“.
    example_gloss: Mein Onkel (mütterlicherseits) ist Ingenieur.
  fa.a1.unit04.lesson03.teach.khale:
    title: Tante mütterlicherseits
    gloss: Tante (Schwester der Mutter)
    note: خاله bedeutet speziell „Schwester der Mutter“.
    example_gloss: Meine Tante (mütterlicherseits) wohnt in Isfahan.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Väterliche und mütterliche Seite
    gloss: Onkel und Tante (väterlicherseits) gehören zur Seite des Vaters; Onkel und Tante (mütterlicherseits) gehören zur Seite der Mutter.
    note: Diese Vierteilung (عمو/عمه gegenüber دایی/خاله) hat im Deutschen keine Entsprechung in einzelnen Wörtern – das Deutsche sagt für beide Seiten einfach „Onkel“ bzw. „Tante“.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Wie viele
    gloss: wie viele
    note: چند تا steht in der Umgangssprache vor dem Zählen von Personen oder Dingen.
    example_gloss: Wie viele Schwestern haben Sie?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Wie viele Geschwister haben Sie? (höflich)
    gloss: Wie viele Geschwister hast du?
    note: دارید ist die höfliche Form (Plural) von „haben“ und passt zu شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Wie viele Geschwister hast du? (informell)
    gloss: Wie viele Geschwister hast du?
    note: داری ist die informelle Singularform, die man bei Gleichaltrigen oder Jüngeren verwendet.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Wie viele Personen hat Ihre Familie?
    gloss: Wie viele Personen hat Ihre Familie?
    note: نفر ist das Zählwort für Personen; نفرن ist die gesprochene, zusammengezogene Form von „نفر هستند“ (sind ... Personen).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Wir sind vier: ich, meine Mama, mein Papa und mein Bruder.'
    gloss: 'Wir sind vier: ich, meine Mama, mein Papa und mein Bruder.'
    note: نفریم = „نفر هستیم“ (wir sind ... Personen), zusammengezogen, gesprochene Sprache.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Ehemann
    gloss: Ehemann
    note: شوهر ist das Standardwort für „Ehemann“.
    example_gloss: Mein Mann ist Ingenieur.
  fa.a1.unit04.lesson05.teach.zan:
    title: Ehefrau
    gloss: Ehefrau
    note: زن bedeutet auch allgemein „Frau“; der Kontext macht die Bedeutung klar.
    example_gloss: Meine Frau ist Lehrerin.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Verheiratet
    gloss: verheiratet
    note: متأهل ist ein neutrales, häufig verwendetes Adjektiv für den Familienstand „verheiratet“.
    example_gloss: Er/Sie ist verheiratet.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Ledig
    gloss: ledig
    note: مجرد ist das Standardwort für „unverheiratet“.
    example_gloss: Ich bin ledig.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Ich bin ledig.
    gloss: Ich bin ledig.
    note: 'مجردم = مجرد + م („ich bin“): dasselbe Suffix der 1. Person wie in خوبم („mir geht es gut“).'
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Ich bin verheiratet.
    gloss: Ich bin verheiratet.
    note: متأهلم = متأهل + م („ich bin“), dasselbe Muster wie مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Enkelkind
    gloss: Enkelkind
    note: نوه bedeutet Enkel oder Enkelin – im Persischen muss das Geschlecht hier nicht angegeben werden.
    example_gloss: Er/Sie hat ein Enkelkind.
  fa.a1.unit04.lesson05.teach.example:
    title: Mein Bruder ist verheiratet; er hat einen Sohn.
    gloss: Mein Bruder ist verheiratet; er hat einen Sohn.
    note: متأهله = „متأهل است“ („ist verheiratet“) in der gesprochenen, verkürzten Form; داره = „دارد“ („hat“) in der gesprochenen Form.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: Ist das dein Familienfoto?
    gloss: Ist das dein Familienfoto?
    note: خانواده‌ته = „خانواده‌ی تو است“ („ist deine Familie“) verkürzt – ein sehr häufiges Muster in der gesprochenen Sprache.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Ja. Das ist meine Mama, das ist mein Papa.
    gloss: Ja. Das ist meine Mama, das ist mein Papa.
    note: '*آره* ist das gesprochene „Ja“ (im Gegensatz zum formellen *بله*). *مامانمه* besteht aus *مامانم* („meine Mama“) plus der gesprochenen Endung für „ist“.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Wer ist dieser Mann?
    gloss: Wer ist dieser Mann?
    note: کیه = „کی است“ („wer ist“) in der gesprochenen, verkürzten Form.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: Das ist mein Bruder. Ich habe einen Bruder und keine Schwester.
    gloss: Das ist mein Bruder. Ich habe einen Bruder und keine Schwester.
    note: داداش ist das liebevolle Alltagswort für „Bruder“ und wird hier statt des neutraleren برادر aus Lektion 1 verwendet.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 'Bei mir ist es umgekehrt: Ich habe zwei Schwestern und keinen Bruder.'
    gloss: 'Bei mir ist es umgekehrt: Ich habe zwei Schwestern und keinen Bruder.'
    note: برعکسه = „برعکس است“ („ist umgekehrt“) in verkürzter Form.
  fa.a1.unit04.lesson06.teach.closing:
    title: Dann ist deine Familie ja auch lebhaft!
    gloss: Dann ist deine Familie ja auch lebhaft!
    note: شلوغه = „شلوغ است“ („ist voll/lebhaft“) verkürzt – eine herzliche, gängige Art, eine Familie mit mehreren Kindern zu beschreiben.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Formelle Sprache: hat / hat nicht / ist'
    gloss: 'Gesprochen: hat, hat nicht. Formell geschrieben: hat, hat nicht; er ist mein Bruder.'
    note: 'دارد/ندارد/است sind die formellen Schriftformen der gesprochenen Formen داره/نداره, die in diesem Dialog vorkommen. Beachten Sie: In formellen Texten wird auch das liebevolle داداش durch das neutrale برادر ersetzt.'
