    note: '*وقت آزاد* bedeutet „Freizeit“ – wörtlich „freie Zeit“.'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Hobby
    gloss: Hobby
    note: '*سرگرمی* bedeutet „Hobby“ oder „Zeitvertreib“.'
    example_gloss: Lesen ist ein Hobby.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Bücher lesen
    gloss: Bücher lesen
    note: '*کتاب خوندن* heißt wörtlich „Bücherlesen“ – *کتاب* (Buch) kennen Sie schon, *خوندن* (lesen) ist hier neu.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: Ich mag ...
    gloss: ich mag
    note: '*دوست دارم* funktioniert mit einer Tätigkeit genauso wie mit einer Sache: *کتاب خوندن دوست دارم* bedeutet „Ich lese gern Bücher.“'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: Musik
    gloss: Musik
    note: '*موسیقی* kommt hier wieder vor.'
    example_gloss: Ich höre Musik.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: Ich höre zu
    gloss: ich höre zu
    note: '*گوش می‌دم* heißt wörtlich „ich gebe Ohr“ – so sagt man auf Persisch ganz natürlich „ich höre zu“.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Film
    gloss: Film
    note: '*فیلم* kommt hier wieder vor.'
    example_gloss: Ich schaue Filme.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Ich sehe / Ich schaue
    gloss: ich sehe / ich schaue
    note: '*می‌بینم* ist die Präsensform des Verbs, dessen Vergangenheit (*دیدم*, „ich sah/habe gesehen“) schon behandelt wurde.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Sport / Training
    gloss: Sport / Training
    note: '*ورزش* bedeutet sowohl „Sport“ als auch allgemein „Training/Bewegung“.'
    example_gloss: Ich mache Sport.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Ich mache
    gloss: ich mache
    note: '*می‌کنم* ist das allgemeine Verb „ich tue/mache“, das in zusammengesetzten Verben wie *ورزش می‌کنم* (ich treibe Sport) vorkommt.'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Fußball
    gloss: Fußball
    note: '*فوتبال* bedeutet „Fußball“.'
    example_gloss: Ich mag Fußball.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Ich spiele Fußball
    gloss: Ich spiele Fußball
    note: '*بازی* bedeutet „Spiel“ bzw. „spielen“ – *فوتبال بازی می‌کنم* heißt wörtlich „ich mache Fußballspiel“, also „ich spiele Fußball“.'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Woche
    gloss: Woche
    note: '*هفته* bedeutet „Woche“.'
    example_gloss: Ich mache jede Woche Sport.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: Jede Woche
    gloss: jede Woche
    note: '*هر* verbindet sich genauso mit *هفته* zu *هر هفته* (jede Woche).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Manchmal
    gloss: manchmal
    note: '*گاهی* bedeutet „manchmal“.'
    example_gloss: Manchmal lese ich Bücher.
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: Was machst du in deiner Freizeit?
    gloss: Was machst du in deiner Freizeit?
    note: '*چیکار می‌کنی* wurde schon behandelt – hier wird es verwendet, um speziell nach der Freizeit zu fragen.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, schon in Lektion 11 als Figur eingeführt, kommt hier wieder vor.'
    example_gloss: Nima liest gern Bücher.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: Ein paar / wie viele
    gloss: ein paar / wie viele
    note: '*چند* („wie viele“/„einige“) verbindet sich mit dem Zählwort *تا* und bedeutet vor einem zählbaren Nomen „ein paar“ oder „wie viele“.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: Er/sie liest
    gloss: er/sie liest
    note: '*می‌خونه* ist die umgangssprachliche Form der 3. Person von *خوندن* (lesen).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: Auch
    gloss: auch
    note: '*هم* bedeutet „auch“ und wurde schon in Lektion 11 so verwendet.'
    example_gloss: Nima spielt auch Fußball.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: Er/sie macht
    gloss: er/sie macht
    note: '*می‌کنه* ist die umgangssprachliche Form der 3. Person zu *می‌کنم* (ich tue/mache).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Lesetext: Nimas Freizeit'
    gloss: Nima liest gern Bücher. Jede Woche liest er ein paar Bücher. Manchmal spielt er auch Fußball.
    note: '*چند تا* vor *کتاب* bedeutet „ein paar Bücher“; *می‌خونه* und *می‌کنه* sind die umgangssprachlichen Formen der 3. Person, mit denen man über andere spricht.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, schon in Lektion 14 als Figur eingeführt, kommt hier wieder vor.'
    example_gloss: Sara schaut gern Filme.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: Sehen / ansehen
    gloss: sehen / ansehen
    note: '*دیدن* ist der Infinitiv des Verbs, dessen Präsens (*می‌بینم*) in einer früheren Lektion und dessen Vergangenheit (*دیدم*) in Lektion 13 behandelt wurde.'
    example_gloss: Ich sehe gern Filme.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Ich gehe ins Kino
    gloss: Ich gehe ins Kino
    note: '*سینما* (Kino) wurde schon behandelt; *می‌رم* (ich gehe) kennen Sie aus *می‌رم سر کار* (ich gehe zur Arbeit).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Was
    gloss: was
    note: '*چی* bedeutet „was“ – so schon in Lektion 14 bei *تو چی؟* („Und du?“).'
    example_gloss: Und du?
  fa.a1.unit24.lesson06.teach.va_word:
    title: Und
    gloss: und
    note: '*و* bedeutet „und“ – so schon in Lektion 14 verwendet.'
    example_gloss: Ich lese gern und ich mag Fußball.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: Wie schön!
    gloss: wie schön!
    note: '*چه خوب!* wurde schon behandelt – eine gängige positive Reaktion, wie „Wie schön!“'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, was machst du in deiner Freizeit?'
    gloss: Sara, was machst du in deiner Freizeit?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara: Ich sehe gern Filme ...'
    gloss: Ich sehe gern Filme. Jede Woche gehe ich ins Kino. Und du?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima: Ich lese gern Bücher ...'
    gloss: Ich lese gern Bücher. Manchmal spiele ich auch Fußball.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara: Wie schön!'
    gloss: Wie schön!
