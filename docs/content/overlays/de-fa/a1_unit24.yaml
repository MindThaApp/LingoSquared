course:
  title: Persisch A1
  description: 'Persisch (Iran) für Anfänger: den Begriff Hobby/Freizeit benennen, vier alltägliche Aktivitäten (lesen, Musik hören, Filme schauen, Sport/Fußball), sagen, wie oft man sie macht, jemanden fragen, was er in seiner Freizeit macht, ein kurzer Lesetext über Nimas Hobbys (نیما) und ein Abschlussdialog zwischen نیما und سارا.'
