teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Zahl
    gloss: Nummer
    note: عدد ist das allgemeine Wort für „Zahl“.
    example_gloss: Das ist eine Zahl.
  fa.a1.unit03.lesson01.teach.zero:
    title: 'Null'
    gloss: 0 – null
    note: صفر steht für die Null, auch als einzelne Ziffer in einer längeren Zahl wie einer Telefonnummer.
    example_gloss: Null ist eine Zahl.
  fa.a1.unit03.lesson01.teach.one:
    title: Eins
    gloss: 1 – eins
    note: یک bedeutet „eins“.
    example_gloss: Ich habe ein Buch.
  fa.a1.unit03.lesson01.teach.two:
    title: Zwei
    gloss: 2 – zwei
    note: دو bedeutet „zwei“.
    example_gloss: Ich habe zwei Äpfel.
  fa.a1.unit03.lesson01.teach.three:
    title: Drei
    gloss: 3 – drei
    note: سه bedeutet „drei“.
    example_gloss: Er hat drei Brüder.
  fa.a1.unit03.lesson01.teach.four:
    title: Vier
    gloss: 4 – vier
    note: چهار bedeutet „vier“.
    example_gloss: Es ist vier Uhr.
  fa.a1.unit03.lesson01.teach.five:
    title: Fünf
    gloss: 5 – fünf
    note: پنج bedeutet „fünf“.
    example_gloss: Warten Sie fünf Minuten.
  fa.a1.unit03.lesson01.teach.six:
    title: Sechs
    gloss: 6 – sechs
    note: شش bedeutet „sechs“.
    example_gloss: Es gibt sechs Stühle.
  fa.a1.unit03.lesson01.teach.seven:
    title: Sieben
    gloss: 7 – sieben
    note: هفت bedeutet „sieben“.
    example_gloss: Eine Woche hat sieben Tage.
  fa.a1.unit03.lesson01.teach.eight:
    title: Acht
    gloss: 8 – acht
    note: هشت bedeutet „acht“.
    example_gloss: Wir sehen uns um acht.
  fa.a1.unit03.lesson01.teach.nine:
    title: Neun
    gloss: 9 – neun
    note: نه bedeutet „neun“. Es ist auch das normale Wort für „nein“ – ob die Zahl oder das „Nein“ gemeint ist, erkennen Sie am Zusammenhang (z. B. beim Zählen oder innerhalb einer Zahl).
    example_gloss: Hier sind neun Schüler.
  fa.a1.unit03.lesson01.teach.ten:
    title: Zehn
    gloss: 10 – zehn
    note: ده bedeutet „zehn“.
    example_gloss: Ich habe zehn Finger.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Elf
    gloss: 11 – elf
    note: یازده bedeutet „elf“.
    example_gloss: Ich habe um elf Uhr Unterricht.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Zwölf
    gloss: 12 – zwölf
    note: دوازده bedeutet „zwölf“.
    example_gloss: Ein Jahr hat zwölf Monate.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Dreizehn
    gloss: 13 – dreizehn
    note: سیزده bedeutet „dreizehn“.
    example_gloss: Er/Sie ist dreizehn Jahre alt.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Vierzehn
    gloss: 14 – vierzehn
    note: چهارده bedeutet „vierzehn“.
    example_gloss: Ich komme in vierzehn Tagen.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Fünfzehn
    gloss: 15 – fünfzehn
    note: پانزده bedeutet „fünfzehn“.
    example_gloss: Er/Sie hat fünfzehn Bücher.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Sechzehn
    gloss: 16 – sechzehn
    note: شانزده bedeutet „sechzehn“. Es lässt sich nicht aus شش (sechs) + ده (zehn) ableiten und sollte als eigenes Wort gelernt werden.
    example_gloss: Er/Sie ist sechzehn Jahre alt.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Siebzehn
    gloss: 17 – siebzehn
    note: هفده bedeutet „siebzehn“.
    example_gloss: Siebzehn Leute sind gekommen.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Achtzehn
    gloss: 18 – achtzehn
    note: هجده bedeutet „achtzehn“.
    example_gloss: Er/Sie ist achtzehn Jahre alt.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Neunzehn
    gloss: 19 – neunzehn
    note: نوزده bedeutet „neunzehn“.
    example_gloss: Es bleiben neunzehn Tage.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Zwanzig
    gloss: 20 – zwanzig
    note: بیست bedeutet „zwanzig“.
    example_gloss: Ich habe zwanzig Bücher.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Dreißig
    gloss: 30 – dreißig
    note: سی bedeutet „dreißig“.
    example_gloss: Dieser Monat hat dreißig Tage.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: Vierzig bis neunzig
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود sind die übrigen Zehnerzahlen.
    example_gloss:
    - Er/Sie ist vierzig Jahre alt.
    - Es gibt fünfzig Stühle.
    - Sechzig Minuten sind eine Stunde.
    - Dieses Buch hat siebzig Seiten.
    - Er/Sie hat achtzig Bücher.
    - Er/Sie ist neunzig Jahre alt.
  fa.a1.unit03.lesson02.teach.combining:
    title: Zehner und Einer verbinden
    gloss: fünfundzwanzig
    note: بیست و پنج heißt wörtlich „zwanzig und fünf“ – Zehnerwort, و, Einerwort. Anders als im Deutschen steht also der Zehner vor dem Einer.
  fa.a1.unit03.lesson03.teach.shomare:
    title: Nummer (von etwas)
    gloss: Nummer
    note: شماره steht für eine Kennnummer wie eine Telefon- oder Hausnummer, im Unterschied zu عدد in der allgemeinen Bedeutung „Zahl“.
    example_gloss: Das ist meine Telefonnummer.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Telefon
    gloss: Telefon
    note: تلفن bezeichnet Telefone allgemein, auch Mobiltelefone.
    example_gloss: Ich habe kein Telefon.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Nach einer Telefonnummer fragen
    gloss: Wie lautet deine Telefonnummer?
    note: شماره تلفنتون چنده؟ ist die übliche höfliche Art, nach einer Telefonnummer zu fragen. Eine Nummer Ziffer für Ziffer zu lesen, wird immer verstanden und ist für Anfänger am sichersten; im Alltag werden Ziffern auch gruppiert, doch diese Lektion übt zuerst die einfachere Ziffer-für-Ziffer-Form.
  fa.a1.unit03.lesson03.teach.chande:
    title: Wie viel / was ist es?
    gloss: Wie viel ist es? / Wie viel kostet es?
    note: چنده؟ ist die Kurzform von چند است und fragt je nach Zusammenhang nach einer Zahl, einer Menge oder einem Preis.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Eine Zahl Ziffer für Ziffer lesen
    gloss: null, neun, eins, zwei, drei, vier, fünf, sechs, sieben, acht, acht
    note: In dieser Lektion üben Sie, Zahlen Ziffer für Ziffer zu lesen. Eine echte iranische Handynummer hat 11 Ziffern und beginnt mit 0, z. B. 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: Jahr
    gloss: Jahr
    note: سال steht sowohl für das Kalenderjahr als auch für das Alter einer Person.
    example_gloss: Ich bin zwanzig Jahre alt.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Ich (Wiederholung)
    gloss: ich
    note: Eine kurze Erinnerung an من, das Sie hier brauchen, um in einem ganzen Satz Ihr eigenes Alter zu nennen.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Nach dem Alter fragen (informell)
    gloss: Wie alt bist du?
    note: چند سالته؟ ist die informelle Form für eine Person; چند سالتونه؟ ist die höfliche Entsprechung.
  fa.a1.unit03.lesson04.teach.salame:
    title: Das eigene Alter nennen
    gloss: Ich bin 25 Jahre alt.
    note: سالمه hängt die Possessivendung ـم (mein) direkt an سال und fügt dann die umgangssprachliche Kopula ـه (ist) an – wörtlich „mein-Jahr-ist“.
  fa.a1.unit03.lesson04.teach.ta:
    title: Zählwort
    gloss: (Zählwort, keine direkte deutsche Entsprechung)
    note: 'تا ist das allgemeine Zählwort für die meisten Gegenstände: Zahl + تا + Nomen.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Apfel
    gloss: Apfel
    note: سیب bedeutet „Apfel“.
    example_gloss: Ich mag Äpfel.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Buch
    gloss: Buch
    note: کتاب bedeutet „Buch“.
    example_gloss: Das ist ein gutes Buch.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Eine Menge bestellen
    gloss: Ich hätte gern zwei Äpfel.
    note: دو تا سیب می‌خوام stellt die gezählte Menge wie bei تا üblich vor das Nomen.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Preis
    gloss: Preis
    note: قیمت ist das allgemeine Wort für „Preis“.
    example_gloss: Was kostet das?
  fa.a1.unit03.lesson05.teach.toman:
    title: Toman
    gloss: Toman (iranische Währung im Alltag)
    note: Die offizielle Währung des Iran ist der Rial, aber im Alltag werden Preise fast immer in Toman genannt (1 Toman = 10 Rial).
    example_gloss: Das kostet zehntausend Toman.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Tausend
    gloss: tausend
    note: هزار bedeutet „tausend“; Preise werden meist in Tausend Toman genannt.
    example_gloss: Ich habe tausend Toman.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Nach dem Preis fragen
    gloss: Wie viel kostet das?
    note: این چنده؟ ist die übliche Art, nach dem Preis von etwas zu fragen, das vor Ihnen liegt.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Einen Preis nennen
    gloss: Es kostet 30.000 Toman.
    note: تومنه ist die Kurzform von تومن است; das vollständige Muster lautet Zahl + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara schlägt vor, zusammen zu üben
    gloss: Sara sagt, dass sie zusammen Persisch üben möchte, und fragt Minas Telefonnummer.
    note: باهم bedeutet „zusammen“; می‌خوام ... تمرین کنیم bedeutet „ich möchte, dass wir üben“ – تمرین کنیم allein kann als Frage auch „Sollen wir üben?“ bedeuten.
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina nennt ihre Nummer
    gloss: Mina stimmt zu und liest ihre 11-stellige Nummer Ziffer für Ziffer vor.
    note: شماره‌ام ist die Kurzform von شماره من; هشته ist die Kurzform von هشت است und schließt die Zahlenreihe ab.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara prüft, ob sie die Nummer richtig notiert hat
    gloss: Sara bittet Mina zu warten, während sie die Nummer aufschreibt, und liest sie dann zur Kontrolle noch einmal vor.
    note: درسته؟ („Stimmt das?“) ist eine gängige Art, eine gerade gehörte Nummer oder Information zu überprüfen.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina bestätigt und fragt zurück
    gloss: Mina bestätigt, dass es stimmt, und fragt nach Saras Nummer.
    note: آره ist ein umgangssprachliches „Ja“, lockerer als بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara nennt ihre Nummer
    gloss: Sara liest ihre eigene elfstellige Nummer Ziffer für Ziffer vor.
    note: یکه ist die verkürzte Form von یک است und beendet die Zahlenreihe genauso, wie هشته die Nummer von Mina beendet hat.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina sagt zu, anzurufen
    gloss: Mina sagt, dass sie Sara morgen anruft.
    note: زنگ می‌زنم بهت bedeutet „Ich rufe dich an“ – wörtlich „Ich schlage die Klingel zu dir“.
