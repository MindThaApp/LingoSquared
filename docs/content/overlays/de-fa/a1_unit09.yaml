teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Stunde / Uhr
    gloss: Stunde / Uhr
    note: ساعت bedeutet sowohl „Stunde“ als auch „Uhr“ und ist das Grundwort für die Uhrzeit.
    example_gloss: Wie spät ist es?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minute
    gloss: Minute
    note: دقیقه ist das Wort für „Minute“.
    example_gloss: Warten Sie fünf Minuten.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Halb
    gloss: halb
    note: نیم bedeutet „halb“ und wird für die halbe Stunde verwendet.
    example_gloss: Es ist halb acht.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Viertel
    gloss: Viertel
    note: ربع bedeutet „Viertel“ und wird für die Viertelstunde verwendet.
    example_gloss: Es ist Viertel vor acht.
  fa.a1.unit09.lesson01.teach.va_word:
    title: Und
    gloss: und
    note: و ist das gebräuchliche Bindewort, das in dieser Lektion immer wieder vorkommt.
    target_text: و (und)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: ساعت چنده؟ ist die alltägliche, umgangssprachliche Art, nach der Uhrzeit zu fragen.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: Die umgangssprachliche Verkürzung auf -e (Wiederholung)
    gloss: چنده ist die alltägliche gesprochene Kurzform von چند است.
    note: Es ist dasselbe Verkürzungsmuster, das Sie schon von Wetter- und Einkaufswörtern wie آفتابیه und تومنه kennen.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Sagen, dass es halb vier ist
    gloss: Es ist halb vier.
    note: ساعت سه و نیمه verbindet die Stunde, و (und) und die verkürzte Form نیمه (halb).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: Die umgangssprachliche Verkürzung auf -e, angewendet auf نیم
    gloss: نیمه ist die alltägliche gesprochene Kurzform von نیم است.
    note: Dasselbe Muster wie bei چنده, nur mit نیم statt چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Morgen
    gloss: Morgen, Vormittag
    note: صبح bezeichnet den Morgen als Tageszeit.
    example_gloss: Ich stehe morgens früh auf.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Mittag
    gloss: Mittag
    note: ظهر bezeichnet die Mittagszeit.
    example_gloss: Ich esse mittags zu Mittag.
  fa.a1.unit09.lesson04.teach.asr:
    title: Nachmittag
    gloss: Nachmittag
    note: عصر bezeichnet den Nachmittag bzw. frühen Abend.
    example_gloss: Ich arbeite nachmittags.
  fa.a1.unit09.lesson04.teach.shab:
    title: Nacht
    gloss: Nacht
    note: شب bezeichnet die Nacht.
    example_gloss: Abends gehe ich früh schlafen.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Termin
    gloss: Termin
    note: قرار ist das allgemeine Wort für einen Termin oder eine Verabredung.
    example_gloss: Ich habe einen Termin.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Fragen, um wie viel Uhr ein Termin ist
    gloss: Um wie viel Uhr ist der Termin?
    note: قرار ساعت چنده؟ wendet die Frage nach der Uhrzeit aus Lektion 2 auf einen bestimmten Termin an.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Eine Uhrzeit mit Tageszeit angeben
    gloss: vier Uhr nachmittags
    note: ساعت چهار عصر verbindet die Stunde mit عصر, um Vormittag und Nachmittag zu unterscheiden.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Morgen (Wiederholung)
    gloss: morgen
    note: فردا wurde in einer früheren Lektion eingeführt; hier dient es dazu, den Termin einzuleiten.
    example_gloss: Ich habe morgen einen Termin.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Sagen, dass man etwas später kommt
    gloss: Ich komme etwas später.
    note: '*یکم دیر می‌شه* verwendet das umgangssprachliche *یکم* („ein bisschen“) und *دیر* („spät“).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar fragt nach der Uhrzeit des Termins morgen
    gloss: Negar fragt, um wie viel Uhr der Termin morgen ist.
    note: قرار فردا ساعت چنده؟ verbindet die Terminfrage aus Lektion 5 mit فردا (morgen).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash antwortet unsicher
    gloss: Arash sagt, er glaube, es sei vier Uhr.
    note: فکر کنم (ich glaube) schwächt die Antwort ab, da er sich nicht ganz sicher ist.
  fa.a1.unit09.lesson06.teach.turn03:
    title: Negar fragt nach, ob morgens oder nachmittags
    gloss: Negar fragt, ob vier Uhr nachmittags oder morgens gemeint ist.
    note: Das klärt eine mögliche Unklarheit, denn ساعت چهار allein sagt nicht, welche vier Uhr gemeint ist.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash stellt klar
    gloss: 'Arash sagt: nachmittags.'
    note: Eine Ein-Wort-Antwort ist natürlich, sobald die Frage den Zusammenhang geklärt hat.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar stimmt zu und passt ihre Ankunftszeit an
    gloss: Negar stimmt zu und sagt, sie komme um Viertel nach vier.
    note: ساعت چهار و ربع verbindet die Stunde mit ربع (Viertel).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash fragt, warum die zusätzliche Viertelstunde
    gloss: Arash fragt, warum sie „Viertel nach“ sagt.
    note: '*چرا ربع؟* ist eine kurze Art zu fragen: „Warum Viertel?“'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar erklärt, dass sie sich etwas verspäten wird
    gloss: Negar erklärt, dass sie wegen der Arbeit etwas später kommt.
    note: '*چون* („weil“) leitet den Grund ein, hier mit *یکم دیر می‌شه* („ich werde ein bisschen spät dran sein“), das Sie in dieser Lektion gerade gelernt haben.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash beruhigt sie
    gloss: 'Arash sagt: Okay, kein Problem.'
    note: 'مشکلی نیست (kein Problem) beruhigt Negar: Die kleine Verspätung ist in Ordnung.'
