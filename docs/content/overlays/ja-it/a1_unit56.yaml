    title: 火事についての文章
    gloss: 図書館の言語カフェで火事が起きています。従業員が言います。「非常口へ行ってください!火事です!」ニーナは助けが必要です。ジュリアはニーナと一緒にいます。マルコは消防に電話します。みんな外にいます。大丈夫です!
    note: 火事の場面を現在形でまとめたもので、従業員の言葉は直接引用になっています。
    glosses:
      caffè: カフェ(caffè linguistico = 言語カフェ)
      biblioteca: 図書館
      incendio: 火
      dipendente: 職員
      dice: 言う
      Andate: 行く(andate = 行ってください、複数の人への命令)
      emergenza: 緊急(uscita di emergenza = 非常口)
      aiuto: 助け
      bisogno: 必要(ho bisogno di = 私は〜が必要です)
      chiama: 電話します
      vigili: 消防士(vigili del fuoco = 消防隊)
      tutti: みんな
      fuori: 外に
      bene: 大丈夫(va bene = それでいいです)
  it.a1.unit56.lesson05.teach.sono_tutti_fuori:
    title: 全員が外に出ています
    gloss: 全員が外に出ています。よかったです。
