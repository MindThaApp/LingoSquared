    note: '*Quanto costano?* は複数の物について、「それらはいくらですか」と尋ねるときに使います。'
  it.a1.unit08.lesson01.teach.costano_tre_euro:
    title: Costano tre euro al chilo.
    gloss: 1キロ3ユーロです。
    note: '*al chilo*(1キロあたり)は、重さの単位あたりの値段を表します。'
