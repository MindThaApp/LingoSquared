teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: 仕事
    note: '*il lavoro* は男性名詞で、「職業」と一般的な「仕事」の両方を表します。'
    example_gloss:
    - 私の仕事はおもしろいです。
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: 教師、店員
    note: '*insegnante*(教師)は男性にも女性にも同じ形を使います。*commesso*(店員)は男性形で、女性形は*commessa*です。'
    example_gloss:
    - 私は教師で、店員ではありません。
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: お仕事は何ですか？
    note: '*Che lavoro fai?*(直訳は「どんな仕事をしていますか」)は、職業をたずねるときの標準的な言い方です。'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: 私は教師です。
    note: イタリア語では、修飾語のつかない職業名の前には冠詞を付けません。*Sono insegnante*と言い、*Sono un insegnante*とは言いません。
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: 私は店員です。
    note: '*Sono insegnante*と同じく、冠詞を付けない形です。'
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: 事務所、学校
    note: '*l''ufficio*(事務所)は、母音の前なので冠詞が短くなります。*la scuola*(学校)は女性名詞です。'
    example_gloss:
    - 私はオフィスで働いています。
    - 私は学校で働いています。
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: どこで働いていますか?
    note: '*Dove*(どこ)に*lavori*(あなたは働く、親しい相手への形)が続きます。'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: 私は事務所で働いています。
    note: '*Lavoro in*(私は〜で働いています)に*un ufficio*(ある事務所)が続きます。'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: 私は学校で働いています。
    note: '*una scuola*(ある学校)を使った同じ型です。'
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: 始めます、終わります
    note: '*inizio*(私は始める)と*finisco*(私は終える)は、*iniziare*と*finire*の現在形の一人称です。'
    example_gloss:
    - 私は9時に始めます。
    - 私は5時に終わります。
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: 何時に始めますか。
    note: '*A che ora*(何時に)に*inizi*(あなたは始める、親しい相手への形)が続きます。'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: 私は9時に始めて、5時に終わります。
    note: '*alle nove* / *alle cinque*(9時に/5時に)のように、時刻の前には*alle*を使います。第5課の時刻の表現と同じです。'
