teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: お金、カード
    note: '*Soldi* はイタリア語では複数形です。*carta* は、支払いに使うカードを指す一般的な短い言い方です。'
    example_gloss:
    - 私はお金を持っています。
    - カードで払います。
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: 現金、レシート
    note: '*Contanti* は複数形です。*scontrino* は、お店で受け取るごく普通のレシートです。'
    example_gloss:
    - 現金で払います。
    - レシートです。
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: カードで払います。
    note: カードで払うときは *con la carta* を使います。
    example_gloss:
    - カフェでカードで払います。
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: 現金で払います。
    note: 現金で払うときは *in contanti* を使います。
    example_gloss:
    - 今日は現金で払います。
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: カードで払えますか。
    note: '*Posso pagare...?* は、その支払い方法が使えるかどうかを尋ねる表現です。'
    example_gloss:
    - 今日はカードで払えますか。
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: 10ユーロです。
    note: イタリア語では、値段を言うときに複数形の *sono* を使うことがよくあります。
    example_gloss:
    - このTシャツは10ユーロです。
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: はい、もちろんです。
    note: 「はい」には、アクセント付きの *Sì* を使います。アクセントのない *si* は別の意味です。
    example_gloss:
    - はい、もちろん、カードで払います。
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: レシートです。
    note: '*Ecco* は何かを差し出したり示したりするときの言葉で、「ここに…があります」という意味です。'
    example_gloss:
    - ありがとうございます、レシートです。
