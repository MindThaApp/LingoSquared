teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: 今夜、明日
    note: '*stasera*(今夜)と *domani*(明日)は、予定を提案するときによく使う2つの時を表す語です。'
    example_gloss:
    - 今夜は空いていますか?
  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: いいですよ / オーケー、行きましょう
    note: '*va bene*(いいですよ)は提案を受け入れる言い方です。*andiamo*(行きましょう)は *andare* の「私たち」の形で、誘うときに使います。'
    example_gloss:
    - いいですよ、一緒に行きましょう。
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: 今夜、映画に行きませんか?
    note: '*Andiamo* を疑問文にすると、いっしょに何かをしようと提案する言い方になります。'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: いいですね、行きましょう!
