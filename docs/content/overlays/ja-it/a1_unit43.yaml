teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*Animale* は「動物」を表す一般的な語で、*animale domestico* はペット(直訳は「家庭の動物」)を意味します。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - ジュリアは犬を飼っています。
    - ルカは猫を飼っています。
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: '*Hai ...?* は *avere* の *tu* の形です。平叙文の語順のまま、声の調子だけで疑問文になります。'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: 何かを持っていないと言うには、動詞の前に *non* を置きます：*non ho*。文法ノートも見てください。
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: 動詞の前の non
    gloss: 何かを持っていないと言うときは、動詞の前に non を置きます：Non ho tempo, Non ho animali domestici.
    note: '*non ho* の後ろの名詞には、ふつう冠詞をつけません：*non ho tempo*、*non ho animali*。日本語の「時間がない」「動物を飼っていない」のように、「いくつか」「何も」にあたる語は入れません。'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*Portare a spasso* は動物を散歩させるときの決まった言い方です。代名詞は動詞の前に置きます：*lo porto a spasso*。'
    example_gloss: 私は毎日犬を散歩させます。
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: 代名詞は動詞の前に置く
    gloss: 代名詞 lo は「犬」を受けて、動詞の前に置きます：lo porto a spasso, gli do da mangiare.
    note: 日本語では「彼を散歩させる」のように目的語を動詞の前に言いますが、イタリア語でも *lo* や *gli* は動詞の前に置きます：*lo porto*、*gli do*。
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  it.a1.unit43.lesson02.teach.giocare_con:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: ルカは自分の猫と遊びます。
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*Ogni giorno*(毎日)は文の最後に置きます：*porto a spasso il cane ogni giorno*。'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*Dare da mangiare*(えさをあげる)は、直訳すると「食べるために与える」です。*Do* は *dare* の *io* の形です。'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 複数形：il cane -> i cani
    gloss: 複数形では語末の母音と冠詞が変わります：il cane -> i cani, il gatto -> i gatti, l'uccello -> gli uccelli, il pesce -> i pesci.
    note: 動物の名詞を例にして、イタリア語の規則的な複数形のパターンを初めて学びます。
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - マルコは犬が好きです。
    - キアラは猫が好きです。
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*Amare*(愛する、好き)は目的語を直接とります：*amo gli animali*。複数形の名詞には複数形の冠詞 *gli* が必要です。'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: キアラは猫が好きだが、ペットは飼っていない
    gloss: キアラは猫が好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: マルコがペットについて尋ねる
    gloss: マルコ：ジュリア、ペットを飼っていますか？
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: ジュリアは犬を飼っている
    gloss: ジュリア：はい、犬を飼っています。
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: マルコが見た目を尋ねる
    gloss: マルコ：どんな犬ですか？
    note: '*Com''è?* は動物にも使えます。答えには *è* か *ha* を使います：*è piccolo*、*ha il pelo castano*。'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: ジュリアが自分の犬を説明する
    gloss: ジュリア：毛は茶色で、小さいです。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: 動物は男性か女性かに分かれる
    gloss: 動物も人と同じように男性か女性かに分かれます：il cane は lui、la gatta は lei です。
    note: イタリア語には物を指す「それ」にあたる代名詞がなく、名詞はすべて男性か女性のどちらかです。そのため犬は *lui*、猫は *lei* で、代名詞もそれに従います(*lo*、*la*)。
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: マルコが散歩について尋ねる
    gloss: マルコ：毎日散歩に連れて行っていますか？
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: ジュリアが毎日の世話を説明する
    gloss: ジュリア：はい、毎日散歩に連れて行って、えさもあげています。
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: マルコ、キアラ、ルカの動物の話
    gloss: マルコとキアラは二人とも動物が好きですが、どちらもペットは飼っていません。マルコは犬が好きで、キアラは猫が好きです。一方、ルカはペットを飼っています。猫です。よく自分の猫と遊び、毎日えさをあげています。あなたはペットを飼っていますか？
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      amano: 愛する
      entrambi: 両方とも
      animali: 動物
      due: 二つ(nessuno dei due = 二人のどちらも〜ない)
      domestico: 家庭の(animale domestico = ペット)
      cani: 犬たち
      gatti: 猫たち
      gatto: 猫
      gioca: 遊ぶ
      dà: 与える
      ogni: 毎～
      mangiare: 食べること(dare da mangiare = えさをあげる)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: ルカはよく自分の猫と遊ぶ
    gloss: ルカはよく自分の猫と遊びます。
    note: '*Spesso*(よく)は動詞の後ろに置きます：*gioca spesso*。*Giocare con* は「〜と遊ぶ」という意味です。'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: ジュリアがニーナに尋ねる
    gloss: ジュリア：ニーナ、あなたもペットを飼っていますか？
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: NinaはPicoという鳥を飼っています
    gloss: Nina：はい、鳥を飼っています。名前はPicoです。
    note: '*Si chiama Pico* は「名前はピコです」という意味で、直訳すると「ピコと自分を呼ぶ」です。'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: マルコの反応
    gloss: マルコ：すてきですね！毎日いっしょに何をしていますか？
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Ninaは毎日その鳥に餌を与えます
    gloss: Nina：毎日その鳥に餌を与えています。
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: マルコも鳥が好き
    gloss: マルコ：ぼくも鳥が好きです。
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: ジュリアが会話を締めくくる
    gloss: ジュリア：三人とも動物が好きなんて、すてきですね！
    note: 三人の登場人物の動物にまつわる話をまとめる締めくくりの一言です。
