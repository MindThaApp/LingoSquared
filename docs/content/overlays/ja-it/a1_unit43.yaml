course:
  title: イタリア語 A1
  description: ペットや身近な動物について話すための、初級イタリア語です。動物の名前、基本的な世話(散歩、えさやり、遊ぶこと)、ペットを飼っていなくても好きな動物を言う表現、そしてイタリア語の複数形を学びます。
