teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: もっと、より少なく
    note: '*più*(もっと)と *meno*(より少なく)は比較の基本の語です。形容詞の前に置いたり、*di* と一緒に使ったりして比べます。'
    example_gloss:
    - コーヒーは多めに、紅茶は少なめにしてほしいです。
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: 〜より / 〜の
    note: '*più* や *meno* のあとの *di*(〜の)は「〜より」の意味になります(*più di due euro*)。定冠詞の前では縮約します：*di* + *i* = *dei*、*di* + *le* = *delle*。'
    example_gloss:
    - コーヒーは2ユーロ以上します。
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: りんごはトマトより高いです。
    note: '*più dei pomodori* は *di* + *i*(縮約して *dei*)を使って、*i pomodori* と比べています。'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: トマトはりんごより安いです。
    note: '*meno delle mele* は *di* + *le*(縮約して *delle*)を使って、*le mele* と比べています。'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: りんごとトマトのどちらが好きですか？
    note: '*Quale*(どちら)は、今挙げた2つのうちから選ぶよう相手に尋ねる言葉です。'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: りんごのほうが好きです。
    note: '*Preferisco*(私は〜のほうが好きです)と *le mele*(りんご)を組み合わせて、選んで答えます。'
    example_gloss:
    - トマトのほうが好きです。
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: 〜と同じくらい
    note: '*come*(〜と同じくらい)は *buono/a* と一緒に使い、2つのものが同等であることを表します。'
    example_gloss:
    - 紅茶はコーヒーと同じくらいおいしいです。
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: りんごはトマトと同じくらいおいしいです。
    note: '*sono buone*(おいしい、女性複数形)は *le mele* に合わせた形です。*come* が同等の比較を導きます。'
