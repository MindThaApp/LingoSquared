teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: コーヒー、クロワッサン
    note: どちらも男性名詞(*il*)です。*caffè* はイタリアで日常的に飲まれるエスプレッソ、*cornetto* は朝食の定番の菓子パンです。
    example_gloss:
    - コーヒーを1つお願いします。
    - クロワッサンを1つお願いします。
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: サンドイッチ、水
    note: '*panino* は男性名詞(*il*)です。*acqua* は女性名詞ですが、母音の前なので *l''* になります。'
    example_gloss:
    - サンドイッチを1つお願いします。
    - 水を1つお願いします。
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: 何になさいますか?
    note: バールの店員がお客さんに尋ねる、丁寧な *Lei* の形の質問です。
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: コーヒーとクロワッサンをお願いします。
    note: '*Vorrei*(〜をお願いしたい)は注文するときの丁寧な言い方で、*e*(と)でもう1つの品を加えます。'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: コーヒーを2つお願いします。
    note: 2つ以上注文するときは、冠詞の代わりに *due*(2つの)を使います。
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: お客様は?
    note: '*E per Lei?* は、丁寧な *Lei* を使って、次のお客さんに何にするかを尋ねる言い方です。'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: 以上です、ありがとう。
    note: もう注文がないときに、注文を締めくくる決まった言い方です。
  it.a1.unit07.lesson03.teach.il_menu_il_conto:
    title: il menù, il conto
    gloss: メニュー、お会計
    note: どちらも男性名詞(*il*)です。
