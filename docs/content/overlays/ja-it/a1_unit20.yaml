teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: 暑い、寒い
    note: イタリア語では気温を言うとき、*fa caldo/freddo* という決まった言い方をします。「暑い」「寒い」という形容詞を使うのとは違います。
    example_gloss:
    - 今日は暑いです。
    - 今日は寒いです。
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: 雨が降っている、晴れている
    note: '*Piove* は一語で成り立つ天気の文です。*c''è il sole* は直訳すると「太陽がある」です。'
    example_gloss:
    - 今日は雨が降っています。
    - 今日は晴れています。
  it.a1.unit20.lesson01.teach.che_tempo_fa:
    title: Che tempo fa oggi?
    gloss: 今日はどんな天気ですか？
    note: '*Che tempo fa?* は天気をたずねるときの定番の質問です。'
    example_gloss:
    - 今日はどんな天気ですか？
  it.a1.unit20.lesson01.teach_oggi_piove:
    title: Oggi piove.
    gloss: 今日は雨が降っています。
    note: '*Oggi* は文頭に来ることが多いですが、*Piove oggi.* も正しい文です。'
    example_gloss:
    - 今日は雨が降っています。
  it.a1.unit20.lesson02.teach_oggi_piove_freddo:
    title: Oggi piove e fa freddo.
    gloss: 今日は雨で寒いです。
    note: 2つの天気を *e* でつなぎます。
    example_gloss:
    - 今日は雨で寒いです。
  it.a1.unit20.lesson02.teach_restiamo_a_casa:
    title: Restiamo a casa.
    gloss: 家にいましょう。
    note: '*Restiamo* は「私たちは」にあたる形で、簡単な提案として使います。'
    example_gloss:
    - 家にいましょう。
  it.a1.unit20.lesson02.teach_andiamo_al_museo:
    title: Andiamo al museo.
    gloss: 美術館に行きましょう。
    note: '*Andiamo* は「私たちは行く」の意味にも、提案の「行きましょう」の意味にもなります。'
    example_gloss:
    - 美術館に行きましょう。
  it.a1.unit20.lesson02.teach_allora:
    title: Allora restiamo a casa?
    gloss: じゃあ、家にいましょうか？
    note: '*Allora* は、天気と計画をつなぎます。'
    example_gloss:
    - じゃあ、家にいましょうか？
