teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: もしもし、どちらさまですか?
    note: '*Pronto* は、イタリア語で電話に出るときの普通の言い方で、*ciao* は使いません。'
    example_gloss:
    - もしもし、エレナです。
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: 電話、メッセージ
    note: '*Messaggio* は男性名詞なので、*un messaggio* と言います。'
    example_gloss:
    - メッセージを送りますね。
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: エレナです。
    note: イタリア語では、電話で名乗るときによく *sono* を使います。
    example_gloss:
    - もしもし、エレナです。
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: サム、エレナだよ。
    note: 電話で「エレナです」と言うときは、*Sono Elena* が自然です。
    example_gloss:
    - サム、電話してるのはエレナだよ。
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: もう一度言ってもらえますか?
    note: '*Puoi* はくだけた言い方で、Elena と Sam の間柄にふさわしい形です。'
    example_gloss:
    - サム、もう一度言ってもらえる?
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: もっとゆっくりお願いします。
    note: '*Più piano* は「もっとゆっくり」という意味で、ゆっくり話してほしいときの普通の言い方です。'
    example_gloss:
    - もっとゆっくり話してください。
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: メッセージを送りますね。
    note: '*Ti mando* は、くだけた会話で「あなたに送る」という意味です。'
    example_gloss:
    - サム、メッセージを送るね。
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: はい、エレナです。
    note: '*Sì* にはアクセント記号が付きます。「はい」の意味で、アクセントのない *si* とは書かないでください。'
    example_gloss:
    - はい、電話しているのはエレナです。
