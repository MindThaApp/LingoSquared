    gloss: ニーナは語学カフェに来たばかりです。ほかの人たちがどんな人か、マルコに尋ねます。マルコが話してくれます。ジュリアは優しくて忍耐強く、看護師として働いています。ルカは面白くて、スペイン語の講座に通っています。キアラは好奇心旺盛で、新しいことを学ぶのが好きです。マルコ自身は穏やかです。
