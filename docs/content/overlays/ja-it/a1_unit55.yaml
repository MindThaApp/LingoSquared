    title: 季節についての会話
    gloss: 今は春です。チューリップがきれいです。ニーナが尋ねます。「どの季節がいちばんきれいだと思う?」マルコは言います。「夏が好き。夏は泳ぐよ。」ジュリアは言います。「冬が好き。冬はスケートをするよ。」
