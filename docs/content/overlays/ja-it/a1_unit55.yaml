    title: Mi piace + 季節
    gloss: Mi piace + 季節は、その季節をどう思うかを表します:Mi piace l'estate.(夏が好きです。)季節が二つのときは mi piacciono を使います:Mi piacciono l'estate e l'inverno.(夏と冬が好きです。)
