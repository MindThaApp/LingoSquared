teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: 昨日、今朝
    note: '*ieri*(昨日)と *stamattina*(今朝)は、最近の出来事を話すときに使う2つの時を表す語です。'
    example_gloss:
    - 昨日は家にいました。
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: 私は行きました(男性)、私は行きました(女性)
    note: '*sono andato/andata* は *andare* の近過去で、助動詞 *essere* を使います。過去分詞は主語の性に合わせて変わります。'
    example_gloss:
    - 今朝は仕事に行きました。
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: 昨日、映画に行きました。
    note: '*Sono andato*(男性の話し手)に *al cinema*(映画館へ)と *ieri*(昨日)を加えると、完了した過去の出来事を表せます。'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: いい映画を見ました!
    note: '*Ho visto* は、助動詞 *avere* と不規則な過去分詞 *visto*(*vedere*「見る」の過去分詞)を使います。'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: 昼食にサンドイッチを食べました。
    note: '*Ho mangiato* は、*avere* と規則的な過去分詞 *mangiato*(*mangiare*「食べる」の過去分詞)を使います。*a pranzo* は「昼食に」という意味です。'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: 昨日は何をしましたか?
    note: '*hai fatto* は *fare*(する)の近過去で、ここでは最近の過去の出来事をたずねるのに使われています。'
    example_gloss:
    - 今朝は何をしましたか?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: 昨夜
    note: '*ieri sera* は *ieri*(昨日)と *sera*(夜)を組み合わせて、過去の特定の時を表します。'
    example_gloss:
    - 昨夜、映画に行きました。
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: 今朝は、いつも通り仕事に行きました。
    note: '*sono andata*(女性の話し手)に *come sempre*(いつも通り)を加えると、習慣的な過去の行動を表せます。'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: あなたは今朝、何をしましたか?
    note: '*E tu*(あなたは?)は、同じ質問を相手に返す言い方です。'
    example_gloss:
    - あなたは昨夜、何をしましたか?
