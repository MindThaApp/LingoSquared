    title: マルコがニーナを見分ける
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Alto* は背が高い人、*basso* は背が低い人を表します。イタリア語の形容詞は人に合わせて形が変わります:*alto/alta*、*basso/bassa*。'
    example_gloss:
    - キアラは背が高いです。
    - ルカは背が低いです。
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: '*Anziano*(年配の)と *giovane*(若い)は、正確な年数ではなく、全体的な印象を表します。*Giovane* は -e で終わるので、男性にも女性にも同じ形を使います。'
    example_gloss:
    - おじいさんは年を取っています。
    - マルコは若いです。
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 年齢:avere anni か anziano か
    gloss: 正確な年齢はイタリア語では avere + anni で言います:Quanti anni hai? 全体的な印象は形容詞で言います:Il nonno è anziano.
    note: 日本語では「30歳です」と言いますが、イタリア語では「30年を持っている」(*ho trent'anni*)と言います。形容詞 *anziano* は、その人がどのくらい年上に見えるかを表すときに使います。
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: キアラは背が高く、ルカは背が低い
    gloss: キアラは背が高く、ルカは背が低いです。
    note: 二つの形容詞を *e*(「と」「そして」)でつないでいます。それぞれが人に合わせて形が変わります:*alta*(女性形)と *basso*(男性形)。
  it.a1.unit42.lesson02.teach.i_capelli:
    title: 髪
    gloss: 髪
    note: イタリア語では *i capelli* は複数形です。髪を「複数の毛」として言い表します。単数形の *il capello* は、1本の毛を指します。
    example_gloss: マルコは短い黒髪です。
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の色を表す三つの語です。*capelli* に合わせて男性複数形になります:*biondi*、*castani*、*grigi*。髪には *neri*(黒い)も使います。
    example_gloss:
    - ジュリアはブロンドの髪です。
    - ルカは茶色の髪です。
    - おじいさんは白髪です。
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Lunghi*(長い)と *corti*(短い)は、*capelli* と同じく複数形です。*alto*(背が高い)は人にだけ使い、髪には使いません。'
    example_gloss:
    - キアラは髪が長いです。
    - ルカは髪が短いです。
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: capelli は複数形
    gloss: capelli は複数形なので、形容詞も複数形になります:i capelli biondi, castani, grigi, neri, lunghi, corti.
    note: 形容詞は名詞の後ろに置き、性と数を名詞に合わせます:*capelli lunghi*(男性複数形)、*occhi azzurri*。
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: 髪と目には avere を使う
    gloss: 人を説明するとき、イタリア語では髪や目に avere を使います:Giulia ha i capelli biondi e gli occhi azzurri.
    note: イタリア語では冠詞も必要です:*i capelli*、*gli occhi*。*è bionda* と言うこともできますが、ここでは *avere* の型を覚えましょう。
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: マルコは短い黒髪です
    gloss: マルコは短い黒髪です。
    note: '*Neri*(黒い)は男性複数形で、*capelli* に合わせています。'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: ジュリアは長いブロンドの髪です
    gloss: ジュリアは長いブロンドの髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: 目
    gloss: 目
    note: '*Occhio*(目)は男性名詞です。複数形は *occhi* で、母音で始まるので *gli* がつきます。'
    example_gloss: マルコは茶色い目をしています。
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: 目の色です:*azzurri*(青い)、*marroni*(茶色い)、*verdi*(緑の)。これらの複数形は男性にも女性にも使えます。
    example_gloss:
    - ジュリアは青い目をしています。
    - ルカは茶色い目をしています。
    - キアラは緑の目をしています。
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: 色の形容詞も複数形に合わせる
    gloss: 目の色は occhi に合わせて複数形になります:occhi azzurri, marroni, verdi.
    note: 単数形が -e で終わる形容詞(*verde*、*marrone*)は、複数形で -i になります:*verdi*、*marroni*。
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: ジュリアはどんな外見ですか?
    gloss: ジュリアはどんな外見ですか?
    note: '*Com''è?* は外見をたずねる基本の質問です。*Com''è* は *come è* の e が省略されて、アポストロフィがついた形です。'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: ジュリアは長いブロンドの髪と青い目をしています
    gloss: ジュリアは長いブロンドの髪と青い目をしています。
    note: 模範解答です:*avere* + 髪 + *e* + 目を1文にまとめます。
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: ジュリアがニーナを紹介する
    gloss: ジュリア:語学カフェに新しい女の子が来るの。名前はニーナよ。
    note: '*Viene*(来る)は、新しく来る人を紹介するときに使います。*Si chiama* は「名前は〜です」という意味で、直訳すると「自分を〜と呼ぶ」です。'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: マルコがどんな外見かたずねる
    gloss: マルコ:わかった!どんな子?
    note: 名前なしで同じ質問をしています。誰のことかは文脈から分かります。
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: ジュリアがニーナの身長と髪を説明する
    gloss: ジュリア:背が低くて、短いブロンドの髪よ。
    note: '*È bassa*(背が低い)は女性形の *bassa* を使っています。そのあとに *ha* を使って髪の説明が続きます。'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: マルコが目についてたずねる
    gloss: マルコ:目は?
    note: '*E gli occhi?* では動詞が省略されています。イタリア語では、文脈から分かる語をよく省きます。'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: ジュリアがニーナの目を説明する
    gloss: ジュリア:緑の目をしているわ。
    note: '*Ha gli occhi verdi*:動詞の語尾で「彼女」だと分かるので、主語の代名詞は必要ありません。'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: マルコは彼女を見分けられそう
    gloss: マルコ:ありがとう!それなら見分けられるよ。
    note: '*La riconosco*(彼女を見分けます):目的語の代名詞 *la* は動詞の前に置きます。'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: ルカとキアラを比べる
    gloss: ルカとキアラは兄妹ですが、あまり似ていません。ルカは背が低く、短い茶色の髪で、茶色い目をしています。キアラはルカより背が高く、長い茶色の髪で、緑の目をしています。あなたはどんな外見ですか?
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      fratello: 兄弟
      sorella: 姉妹
      sembrano: 〜に見える
      diversi: 異なる
      basso: 背が低い
      corti: 背が低い
      castani: 茶色の
      capelli: 髪
      marroni: 茶色の
      occhi: 目
      alta: 背が高い(più alta = もっと背が高い)
      lunghi: 長い
      verdi: 緑色の
      come: どんな(Tu come sei? = あなたはどんな外見ですか?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 比べる:più ... di
    gloss: イタリア語では più + 形容詞 + di で比べます:Chiara è più alta di Luca.
    note: 形容詞の前に *più*、比べる相手の前に *di* を置きます。形容詞は性に合わせて形が変わります:*più alta*、*più alto*。
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: キアラはルカより髪が長い
    gloss: キアラはルカより髪が長いです。
    note: '*I capelli più lunghi di Luca*:形容詞は *capelli* に合わせて複数形のままです。'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*Ho i capelli corti e castani*:自分の外見を説明するときは *avere* を使います。'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: MarcoがNinaを見つける
    gloss: Marco:見て、あれはNinaかな?髪は短いブロンドで、目は緑色だよ。
    note: '*Guarda*(見て)は *tu* に対する命令形です。*Quella* は女性・女の子について「あの人」という意味です。'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giuliaが答える
    gloss: Giulia:ええ、Ninaよ!
    note: 短く自然に、そうだと伝える表現です。
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: NinaがMarcoにあいさつする
    gloss: Nina:こんにちは、Marcoさんですか?
    note: '*Sei Marco?* は親しい間柄で使う質問です。*sei* は *essere* の *tu* の形なので、*tu* は必要ありません。'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: MarcoがNinaにあいさつを返す
    gloss: Marco:はい!はじめまして、Nina。
    note: '*Piacere di conoscerti* は初めて会う人にいう表現です。*-ti* は「あなたを」という意味です。'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 会話の締めくくりです。MarcoはGiuliaの先ほどの説明のおかげでNinaだと気づくことができました。
