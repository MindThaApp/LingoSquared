teaching:
  it.a1.unit21.lesson01.teach_maglietta_pantaloni:
    title: la maglietta, i pantaloni
    gloss: Tシャツ、ズボン
    note: '*Maglietta* は女性名詞の単数形、*pantaloni* は複数形です。日本語の「ズボン」は単数でも複数でも形が同じですが、イタリア語の pantaloni は複数形で使います。'
    example_gloss:
    - Tシャツは青です。
    - ズボンはエレナのものです。
  it.a1.unit21.lesson01.teach_scarpe_giacca:
    title: le scarpe, la giacca
    gloss: 靴、ジャケット
    note: '*Scarpe* は複数形、*giacca* は女性名詞の単数形です。'
    example_gloss:
    - その靴は履きやすいです。
    - そのジャケットは大きいです。
  it.a1.unit21.lesson01.teach_blu_nero:
    title: blu
    gloss: 青い
    note: '*Blu* は性によって形が変わりません。'
    example_gloss:
    - Tシャツは青です。
  it.a1.unit21.lesson01.teach_la_maglietta_e_blu:
    title: La maglietta è blu.
    gloss: Tシャツは青です。
    note: 1つのものの色を言うときは *è* を使います。
    example_gloss:
    - Tシャツは青です。
  it.a1.unit21.lesson02.teach_taglia_piccola_media_grande:
    title: taglia piccola, media, grande
    gloss: 小さいサイズ、中くらい、大きい
    note: '*Taglia* は服のサイズのことです。女性名詞なので、サイズを表す語もそれに合わせます：*taglia piccola*、*taglia media*。*grande* は男性でも女性でも同じ形です。'
    example_gloss:
    - Mサイズをください。
  it.a1.unit21.lesson02.teach_vorrei_maglietta_blu:
    title: Vorrei una maglietta blu, taglia media.
    gloss: 青いTシャツをください。Mサイズです。
    note: '*Vorrei* を使うと、服を頼むときの言い方が丁寧になります。'
    example_gloss:
    - 青いTシャツをください。Mサイズです。
  it.a1.unit21.lesson02.teach_quanto_costa:
    title: Quanto costa?
    gloss: いくらですか?
    note: 1つのものについては単数の *costa* を使います。
    example_gloss:
    - いくらですか。
  it.a1.unit21.lesson02.teach_costa_dieci_euro:
    title: Costa dieci euro.
    gloss: 10ユーロです。
    note: '*Euro* は、標準的な用法では数字のあとでも形が変わりません。'
    example_gloss:
    - 10ユーロです。
