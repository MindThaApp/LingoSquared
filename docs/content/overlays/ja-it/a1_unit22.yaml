teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: うれしい、悲しい
    note: '*Felice* と *triste* は *-e* で終わるので、男性にも女性にも同じ形を使います（*Sam è felice*、*Elena è felice*）。'
    example_gloss:
    - 今日はうれしいです。
    - 今日は悲しいです。
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: 疲れた、緊張した
    note: これらの形容詞は語尾が変わることがあります。この単元では、辞書に載っている男性形を学びます。
    example_gloss:
    - サムは疲れています。
    - 今日は緊張しています。
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: 気分はどうですか。
    note: '*Ti senti* は、友だちに使うくだけた「あなたは感じる」の形です。'
    example_gloss:
    - 今日は気分はどう？
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: 私はうれしいです。
    note: '*sono* の後に気持ちを表す形容詞を付けて使います。'
    example_gloss:
    - 今日はうれしいです。
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: なぜ/なぜなら
    note: この課では、*perché* は気持ちの理由を表します。
    example_gloss:
    - 今日は晴れているので、うれしいです。
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: 今日は晴れているので、うれしいです。
    note: これは、気持ちと理由がそろった完全な文です。
    example_gloss:
    - ミラノは今日、晴れているので、うれしいです。
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: 少し疲れています。
    note: ここでは Elena が言っているので、*stanca* は女性形です。
    example_gloss:
    - 今日は少し疲れています。
  it.a1.unit22.lesson02.teach_ma_sto_bene:
    title: ma sto bene
    gloss: でも元気です
    note: '*Ma* は、疲れている気持ちと、大丈夫であることを対比させます。'
    example_gloss:
    - 疲れていますが、元気です。
