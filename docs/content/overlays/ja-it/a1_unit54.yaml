    title: Vorrei + il + 色
    gloss: Vorrei + il + 色 で、選ぶ色を伝えます:Vorrei il rosa.
    note: Vorrei(~がほしいのですが)は、丁寧に選んだり頼んだりするときの言い方です。色を名詞として使うときは il が付きます:il rosso、il rosa。色を形容詞として使うときは名詞に合わせて変化します(i tulipani sono rossi)。ただし rosa と viola は変化しません。
