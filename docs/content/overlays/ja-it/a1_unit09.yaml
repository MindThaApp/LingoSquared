teaching:
  it.a1.unit09.lesson01.teach.farmacia_banca:
    title: la farmacia, la banca
    gloss: 薬局、銀行
    note: どちらの名詞も女性名詞です(*la*)。
    example_gloss:
    - すみません、薬局はどこですか。
  it.a1.unit09.lesson01.teach.stazione_ufficio_postale:
    title: la stazione, l'ufficio postale
    gloss: 駅、郵便局
    note: '*stazione* は女性名詞(*la*)です。*ufficio* は男性名詞ですが、母音の前なので *l''* になります。'
    example_gloss:
    - 駅はこの近くです。
  it.a1.unit09.lesson01.teach.scusi_dove_la_farmacia:
    title: Scusi, dov'è la farmacia?
    gloss: すみません、薬局はどこですか？
    note: '*Scusi*(すみません、丁寧な言い方)で質問を切り出し、そのあとに *dov''è*(どこにありますか)が続きます。'
  it.a1.unit09.lesson01.teach.e_qui_vicino:
    title: È qui vicino, in Via Roma.
    gloss: この近くです、ローマ通りにあります。
    note: '*qui vicino*(この近く)のあとに通りの名前を続けると、より正確な場所を伝えられます。'
  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: この近くに銀行はありますか。
    note: '*C''è*(〜があります)は存在をたずねる表現で、ここでは *qui vicino*(この近く)が続いています。'
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: はい、この近くに1軒あります。
    note: '*ce n''è una*(それが1つあります)は *c''è* の質問に答える形で、女性名詞の *banca* を受けています。'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: 駅のそばです。
    note: '*accanto a*(〜のそば)に冠詞を続けると、目印を基準にした正確な位置を表せます。'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: どうもありがとうございます。
    note: 直訳は「千の感謝」で、ふつうの *grazie* よりも強い感謝の言い方です。
  it.a1.unit09.lesson03.teach.dove_e_la_stazione:
    title: Dov'è la stazione?
    gloss: 駅はどこですか。
    note: '*Dov''è*(〜はどこですか)に名詞を続けると、特定の場所の位置をたずねられます。'
    example_gloss:
    - 駅は銀行のとなりです。
