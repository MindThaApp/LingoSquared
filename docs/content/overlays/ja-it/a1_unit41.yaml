  it.a1.unit41.lesson04.giulia_e_marco_parlano:
    title: ジュリアとマルコが趣味について話す
  it.a1.unit41.lesson05.marco_e_giulia_confrontano:
    title: マルコとジュリアが趣味を比べる
  it.a1.unit41.lesson06.programmare_un_fine_settimana:
    title: 一緒に週末の予定を立てる
teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う趣味の動詞を3つ、不定詞で紹介します。*leggere*(読む)、*fare sport*(運動する、スポーツをする)、*cucinare*(料理する)。イタリア語の不定詞は -are、-ere、-ire で終わります。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: 自由時間
    gloss: 空いている時間
    note: '*Il tempo libero* は男性名詞なので *il* がつきます。趣味について話すときの大切な表現です。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Leggo* は *leggere*(読む)の *io* の形です。イタリア語では主語の代名詞を省略します。*Io leggo* ではなく *Leggo* と言います。'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味をさらに3つ：*ascoltare musica*(音楽を聴く)、*disegnare*(絵を描く)、*giocare ai videogiochi*(ビデオゲームをする)。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Ascoltare* は目的語をそのまま続けます。*ascolto musica* のように、「を」にあたる語は間に入りません。'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Con gli amici* は「友達と」という意味です。*Gli* は、母音で始まる男性名詞の前に置く複数形の冠詞です。'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 頻度を表す4つの語です。*Mai*(決して〜ない)は動詞の前に *non* が必要です。*non gioco mai* のように言います。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Ogni*(毎〜)は形が変わりません。*ogni settimana*、*ogni fine settimana*。次のカードも見てください。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: mai には non が必要。ogni は形が変わらない
    gloss: mai がつくと、動詞の前に non も置きます：Non gioco mai. Ogni はどの名詞の前でも同じ形です：ogni settimana, ogni fine settimana.
    note: 日本語でも「一度も〜ない」のように否定の形を使いますが、イタリア語でも mai を使うときは動詞の前に non が必要です。*non gioco mai*（直訳は「私はしないことは一度もない」ではなく、「私は決してしない」という意味）です。*Ogni* の後ろには必ず単数の名詞が来ます。
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: ジュリアが趣味の話を切り出す
    gloss: ジュリア：私たちはよくいっしょに散歩しますね。ところでマルコは、自由な時間にほかに何をしていますか？
    note: '*Passeggiamo* は *passeggiare*(散歩する)の *noi*(私たち)の形です。*Spesso* は動詞の後ろに置きます。'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: マルコの趣味
    gloss: マルコ：料理が好きで、家でもよくします。それから、よく運動もします。
    note: '*Anche a casa*(家でも)は、マルコが仕事だけでなく楽しみとしても料理することを表します。*A casa* は「家で」の意味で、冠詞はつきません。'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: ジュリアが驚く
    gloss: ジュリア：家でも料理するの？仕事で一日中料理しているのに！
    note: '*Già*(すでに)と *tutto il giorno*(一日中)は、マルコが仕事ですでにたくさん料理していることを表しています。'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: マルコが説明する
    gloss: マルコ：うん、でも料理するとリラックスできるんだ。ジュリアは、何をするのが好き？
    note: '*Cucinare mi rilassa* は直訳すると「料理することが私を落ち着かせる」です。する行為が主語で、*mi*(私を)が目的語です。'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: ジュリアの趣味
    gloss: ジュリア：読書が好きで、よく音楽も聴きます。
    note: 2つの趣味を *e*(と、そして)でつないでいます。どちらの動詞も *io* の形のままです：*leggo* と *ascolto*。
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: マルコがゲームについて尋ねる
    gloss: マルコ：ゲームもする？
    note: はい・いいえで答える質問は、語順は平叙文のままで、声の調子だけを上げます：*Giochi anche ai videogiochi?* *Anche* は「も」という意味です。
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: ジュリアが答える
    gloss: ジュリア：ううん、ゲームは全然しないよ。でも、ときどき絵を描くよ！
    note: '*Non ... mai*(決して〜ない)と *a volte*(ときどき)が1つの答えの中で対比されています。*Ma* は「でも」という意味です。'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: 趣味を比べる
    gloss: マルコと私はよくいっしょに散歩します。でも、ほかの趣味もあります。マルコは料理が好きで、家でもよくします。それに、よく運動もします。私は読書が好きで、よく音楽を聴きます。ときどき絵を描きますが、ゲームは全然しません。あなたは自由な時間に何をするのが好きですか？
    note: ジュリアのメッセージは、これまでの内容をまとめ、最後にこの単元の中心となる質問を読み手に投げかけています。
    glosses:
      passeggiamo: 散歩します
      spesso: よく
      insieme: 一緒に
      altri: ほかの
      cucina: 料理する
      volentieri: 喜んで
      casa: 家(a casa = 家で)
      sport: スポーツ(fa sport = 運動する)
      leggo: 読む
      ascolto: 聴く
      musica: 音楽
      disegno: 絵を描く
      volte: 回(a volte = ときどき)
      videogiochi: ビデオゲーム
      mai: 決して〜ない
      libero: 自由な
      tempo: 時間
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: マルコが週末の予定を尋ねる
    gloss: マルコ：今週末は何をするの？
    note: '*Questo fine settimana*(今週末)は男性名詞なので、*questo* になります。*Fai* は *fare*(する)の *tu* の形です。'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: ジュリアは迷っている
    gloss: ジュリア：まだわからないな。読書は好きだけど、出かけたい気持ちもあるの。
    note: '*Non lo so ancora*(まだ知りません):*lo* は知らない内容を指し、動詞の前に置きます。*Uscire* は「出かける」という意味です。'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: マルコが計画を提案する
    gloss: マルコ：いっしょに散歩しない？そのあと、僕が二人のために料理するよ。
    note: '*Poi*(それから、あとで)は予定の順番を表します。*Cucino io*(動詞の後ろに *io*)は「私が作る」という気持ちを強調します。'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: ジュリアが賛成する
    gloss: ジュリア：いい考えね！散歩も料理も好きなの。
    note: '*Sia ... sia ...* は「…も…も」という意味です：*mi piace sia passeggiare sia cucinare*。'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: マルコが確認する
    gloss: マルコ：完璧。それじゃ、土曜日に会おう！
    note: '*Ci vediamo sabato*(土曜日に会いましょう)：次に来る曜日を指すときは、曜日の前に冠詞をつけません。'
