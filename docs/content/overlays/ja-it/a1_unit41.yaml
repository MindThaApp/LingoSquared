course:
  title: イタリア語 A1
  description: 自由な時間の過ごし方を話すための初級イタリア語です。趣味の語彙、頻度を表す表現、自由な時間に何をするか尋ねたり答えたりする方法、二人の趣味の比べ方を学びます。
