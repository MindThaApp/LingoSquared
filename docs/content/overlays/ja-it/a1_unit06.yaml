teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: 母、父
    note: イタリア語の名詞には性があり、冠詞は女性なら *la*、男性なら *il* を使います。日本語の名詞には、こうした冠詞も性の区別もありません。
    example_gloss:
    - こちらは私の父です。
    - こちらは私の母です。
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: 兄(弟)、姉(妹)
    note: '*fratello* は男性名詞(*il*)、*sorella* は女性名詞(*la*)です。'
    example_gloss:
    - 私には兄(弟)が1人と姉(妹)が1人います。
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: こちらは私の父です。こちらは私の母です。
    note: '*Questo/Questa*(こちらの)は、指す人の性に合わせます。男性には *questo*、女性には *questa* を使います。'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: 祖父、祖母
    note: '*padre/madre* と同じ、男性・女性の冠詞のパターンです。'
    example_gloss:
    - 祖父はローマに住んでいます。
    - 祖母は料理がとても上手です。
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: 兄弟姉妹はいますか？
    note: '*Hai*(あなたは持っている)+家族を表す語+*o*(または)は、兄弟姉妹についてたずねる基本の言い方です。'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: 私には兄(弟)が1人と姉(妹)が1人います。
    note: '*Ho*(私は持っている)で答えます。*un*(1つの、男性)と *una*(1つの、女性)を使います。'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: 夫、妻
    note: これも男性・女性のペアで、同じ冠詞のパターンです。
    example_gloss:
    - サムには妻がいます。
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: お子さんはいますか？
    note: '*figli*(子どもたち)は、人数や性別に関係なく、一般的にたずねるときに使う複数形です。'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: はい、子どもが2人います。男の子が1人と女の子が1人です。
    note: '*maschio*(男の子)と *femmina*(女の子)は、合計の人数を言ったあとに子どもの性別を補足する言葉です。'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: 息子、娘
    note: '*figli* の単数形で、男性・女性の冠詞の基本パターンに従います。'
    example_gloss:
    - エレナには息子が1人と娘が1人います。
