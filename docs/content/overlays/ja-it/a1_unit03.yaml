teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: 0、1、2、3、4、5
    note: 最初の6つの数字です。この課の値段、年齢、電話番号の土台になります。
    example_gloss:
    - 兄弟が2人います。
    - 5時です。
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: 6、7、8、9、10
    note: 6から10までの数字です。これで0から10までがそろいます。
    example_gloss:
    - 1日8時間働いています。
    - その店は10時に開きます。
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: 何歳ですか。
    note: 直訳すると「何年を持っていますか」です。日本語では「何歳ですか」と「です」を使いますが、イタリア語では年齢を言うときに「〜である」ではなく *avere*(持つ)を使います。
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: 30歳です。
    note: '*avere*(持つ)を使って年齢を言う決まった表現です(直訳は「30年を持っている」)。「30」はここでは数として学ぶわけではありません。このユニットで扱う数は0〜10で、30と50はこの決まった表現と値段にだけ出てきます。'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: コーヒーはいくらですか?
    note: '*Quanto costa* は、品物1つの値段を尋ねるときの標準的な言い方です。'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: 1ユーロ、2ユーロ
    note: 日本語の「ユーロ」と同じように、イタリア語の *euro* も複数形で形が変わりません。*un euro* も *due euro* も *euro* のままです。
    example_gloss:
    - 1ユーロです。
    - 2ユーロ50セントです。
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: クロワッサンは?
    note: 2つ目の品物、*cornetto*(イタリアの朝食用クロワッサン)の値段を尋ねる短い続きの質問です。
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: 2ユーロ50セントです。
    note: '*e cinquanta* でセントの部分を加えます。直訳は「そして50」で、50セントの端数がある値段ならどれにも同じように使います。'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: いくつにしますか?
    note: バリスタや店員が、欲しい個数を丁寧に尋ねる言い方です。*ne* はすでに話に出た品物の代わりをします。
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: 3つください。
    note: '*Ne vorrei* + 数は、数量を丁寧に頼む言い方です。ここでも *ne* が先に出た品物を指します。'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: 電話番号は何番ですか。
    note: 相手の電話番号を尋ねるくだけた言い方で、*tuo*(親しい相手に使う「あなたの」)を使います。
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: 明日電話するね!
    note: 電話番号を教えてもらったあとに、親しみを込めてやり取りを締めくくる言い方です。
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: 私の番号
    note: イタリア語の電話番号は、たいてい最初のレッスンで学んだ数字を使って一桁ずつ読みます。
    example_gloss: 私の番号は0、3、4、2、1です。
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: 私の番号は0、3、4、2、1です。
    note: サムが電話番号を一桁ずつ伝えています。これがイタリア語で電話番号を読む標準的な方法です。
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: 完璧です、ありがとう!
    note: 必要な情報を聞き終えたあとに、明るく簡潔にやり取りを締めくくる言い方です。
