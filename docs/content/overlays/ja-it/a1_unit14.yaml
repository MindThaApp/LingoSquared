teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: 好む、私は好む
    note: '*preferire*(好む)は、現在形のほとんどの活用で -isc- が入る -ire 動詞です。*preferisco* は「私は好む」です。'
    example_gloss:
    - 私はコーヒーより紅茶の方が好きです。
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: コーヒーと紅茶、どちらが好きですか?
    note: '*Preferisci*(あなたは好む)と *o*(または)を使うと、2つのうちから選ぶ質問になります。'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: コーヒーの方が好きです。
    note: '*Preferisco*(私は好む)と *il caffè*(コーヒー)で、好みを伝えます。'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: クロワッサンがとても好きです。
    note: '*Mi piace*(私には好ましい=私は好き)と *molto*(とても)で、強い好意を表します。'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: 朝は紅茶が好きではありません。
    note: '*Non mi piace*(好きではない)は「好き」の構文を否定した形で、*la mattina* は「朝に」という意味です。'
    example_gloss:
    - 夜はコーヒーが好きではありません。
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: あなたは?
    note: '*E a te?*(あなたには?)は、相手に自分の好みをたずねる表現です。'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: 私もコーヒーが好きです!
    note: '*Anch''io*(私も)は、相手が *preferisco* で言った好みに同意するときに使います。(*mi piace* の文に同意するときは *Anche a me* と言います。)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: 私は違います、紅茶の方が好きです。
    note: '*A me no*(私は違う)は、*mi piace* の文に反対して、自分の好みを言う前に使います(「好き」の構文にある *a me* と対応しています)。*preferisco* の文に反対するときは、代わりに *Io no* と言います。'
    example_gloss:
    - 私は違います、コーヒーの方が好きです。
