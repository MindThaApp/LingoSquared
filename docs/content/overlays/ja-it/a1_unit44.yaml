    gloss: 週に～回
    example_gloss: 私は週に2回ヨガをします。
  it.a1.unit44.lesson02.teach.conosci_gia_ogni:
    title: Volte a settimana
    gloss: ogni giornoとspessoはもう知っていますね。Due volte a settimana(週に2回)は、頻度をより正確に言う表現です。
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
