    title: Facciamo ...?
    gloss: Facciamo ...?(…しませんか?)は、一緒に何かをしようと提案する言い方で、前のレッスンですでに習っています。
    note: 予定についての課で学んだ、何かを一緒にしようと提案する構文をそのまま使っています。
