    title: Correre:規則変化の-ere動詞
    gloss: Correreは規則変化の-ere動詞です:io corro, tu corri, lui/lei corre。
    note: '*Corro*(私)、*corri*(あなた)、*corre*(彼/彼女):語尾で誰が走るのかが分かるので、主語の代名詞は省略できます。'
