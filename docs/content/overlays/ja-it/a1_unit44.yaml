  it.a1.unit44.lesson03.teach.conosci_gia_fare:
    title: fare sport か、具体的なスポーツ名か
    gloss: fare sportは、趣味のレッスンですでに習いましたね(Faccio sport il sabato)。スポーツの名前を言うときは、fareかgiocare aを使います:Faccio yoga, gioco a calcio。どちらも正しい言い方です。
    note: '*Fare sport* は「スポーツをする」という一般的な言い方です。スポーツの名前を言うときは、*fare* +スポーツ(*faccio yoga*)か、*giocare a*(*gioco a calcio*)を使います。'
