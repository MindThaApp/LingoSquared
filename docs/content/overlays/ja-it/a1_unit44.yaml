    gloss: Marco:いいですね、私もそこでよくサッカーをしますよ。
  it.a1.unit44.lesson05.teach.giulia_fa_yoga:
    title: GiuliaとChiaraのスポーツの話
    gloss: Giuliaは週に2回ヨガをします。ゆったり体を動かすのが好きです。Chiaraはヨガはしませんが、泳ぐのが大好きです。Chiaraはよく、ほぼ毎週泳ぎます。あなたは何のスポーツをしていますか?
    note: 二つのスポーツと、頻度の二通りの言い方を対比しています。*nuota*(泳ぐ)と*nuotare*(泳ぐこと、不定詞)に注目しましょう:語尾で主語が分かります。
    glosses:
      fa: する
      due: '2'
      volte: 回
      settimana: 週
      yoga: ヨガ
      ama: 大好きである
      calma: 穏やか(con calma =穏やかに)
      muoversi: 動く
      nuotare: 泳ぐ
      nuota: 泳ぐ
      spesso: よく
      quasi: ほとんど
      che: どんな(che sport =どんなスポーツ)
      sport: スポーツ
  it.a1.unit44.lesson05.teach.chiara_nuota_spesso:
