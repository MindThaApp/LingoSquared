  it.a1.unit44.lesson01.teach.con_molti_sport:
    title: fare か giocare a + スポーツ
    gloss: ほとんどのスポーツにはfareを使い(faccio yoga, faccio jogging, faccio nuoto)、チームスポーツや球技にはgiocare aを使います(gioco a calcio)。
    note: この段階では、スポーツごとに別の動詞を覚える必要はありません。一つの構文で、どのスポーツも言い表せます。
  it.a1.unit44.lesson02.teach.volte_a_settimana:
