teaching:
  it.a1.unit16.lesson01.teach.mi_fa_male:
    title: mi fa male
    gloss: 痛い / 〜が痛い
    note: '*mi fa male* は直訳すると「私に痛みを与える」という意味です。後ろに体の部位を置くと、その部分が痛いと言えます。'
    example_gloss:
    - 頭が痛いです。
  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola:
    title: la testa, la pancia, la gola
    gloss: 頭、おなか、のど
    note: '*mi fa male* と一緒に使って痛みを伝える、よく使う体の部位が3つです。'
    example_gloss:
    - おなかが痛いです。
    - 喉が痛いです。
  it.a1.unit16.lesson01.teach.cosa_hai:
    title: Cosa hai?
    gloss: どうしたんですか?
    note: '*Cosa hai?*(直訳は「何を持っていますか?」)は、相手にどうしたのかを尋ねるときの表現です。'
  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: 頭が痛いです。
    note: '*la testa*(頭)は女性名詞なので、*la* がつきます。'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: 具合が悪いです
    note: '*mi sento*(私は感じる)に *bene*(よく)がついた形です。*non* で打ち消して、気分がよくないことを表します。'
    example_gloss:
    - 今日は気分がよくありません。
  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: 熱、咳
    note: よく使う症状の言い方で、*avere*(持つ)と一緒に使います。*Ho la febbre*(熱があります)。
    example_gloss:
    - 熱があります。
    - 咳が出ます。
  it.a1.unit16.lesson02.teach.non_mi_sento_bene_phrase:
    title: Non mi sento bene.
    gloss: 気分がよくありません。
    note: 体調がよくないことを伝える一般的な表現で、具体的な症状を言う前に使えます。
  it.a1.unit16.lesson02.teach.ho_la_febbre_e_la_tosse:
    title: Ho la febbre e la tosse.
    gloss: 熱と咳があります。
    note: '*Ho*(私は持っている)のあとに、*e*(と)でつないだ2つの症状が続きます。'
  it.a1.unit16.lesson03.teach.il_dottore_la_dottoressa:
    title: il dottore, la dottoressa
    gloss: 医者(男性)、医者(女性)
    note: '*il dottore* と *la dottoressa* は、「医者」の男性形と女性形です。'
    example_gloss:
    - 医者に行かなければなりません。
    - 女性の医者のところへ行かなければなりません。
  it.a1.unit16.lesson03.teach.riposa_la_medicina:
    title: riposa, la medicina
    gloss: 休んで!(親しい相手に)、薬
    note: '*riposa* は *riposare*(休む)の、親しい相手に対する命令形です。*la medicina* は「薬」です。'
    example_gloss:
    - 今日は休んでください。
    - この薬を飲んでください。
  it.a1.unit16.lesson03.teach.devo_andare_dal_dottore:
    title: Devo andare dal dottore.
    gloss: 医者に行かなければなりません。
    note: '*Devo*(〜しなければならない)に *andare dal dottore*(医者のところへ行く)が続きます。*dal* は *da* と *il* が一つになった形です。'
  it.a1.unit16.lesson03.teach.prendi_questa_medicina_e_riposa:
    title: Prendi questa medicina e riposa.
    gloss: この薬を飲んで、休んでください。
    note: '*Prendi*(取る・飲む、親しい相手に対する命令形)のあとに、*questa medicina*(この薬)と *riposa*(休んで)が続きます。'
