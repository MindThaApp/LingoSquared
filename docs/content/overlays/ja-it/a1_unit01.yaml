course:
  title: イタリア語 A1
  description: 日常のあいさつや短い会話を中心に、A1レベルのイタリア語を詳しい日本語の解説で学びます。
units:
  it.a1.unit01.greetings_and_introductions:
    title: あいさつと自己紹介
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: tuとLei:くだけたあいさつと丁寧なあいさつ
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: 返事とお別れのあいさつ
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 自己紹介:オフィスでの初日
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: やあ、おはようございます
    note: '*Ciao*は、友達や同年代の人との間で一日中使えるくだけたあいさつです。*Buongiorno*は日中の標準的で丁寧なあいさつで、朝から午後まで使えます。'
    example_gloss:
    - やあ、元気ですか?
    - おはようございます、お元気ですか?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: 元気ですか(くだけた言い方)、お元気ですか(丁寧な言い方)
    note: '*come stai*は*tu*(友達や同年代の人)と、*come sta*は*Lei*(初対面の人、上司、敬意を示したい相手)と組み合わせます。同じ質問でも、言い方が違います。'
    example_gloss:
    - やあ、今日は元気ですか?
    - おはようございます、今日はお元気ですか?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: やあ、元気ですか?
    note: 友達、クラスメート、同年代の人に使う、くだけたあいさつと質問です。
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: おはようございます、お元気ですか?
    note: 丁寧な言い方で、新しい同僚の上司など、敬意を払うべき相手に使います。
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: tu:くだけた言い方 · Lei:丁寧で敬意を示す言い方
    note: '*tu*は、友達、クラスメート、同年代の人に使う日常的な「あなた」です。*Lei*は、初対面の人、職場の上下関係、見知らぬ人に使う丁寧な「あなた」で、動詞も専用の形になります(*tu stai*と*Lei sta*を比べてみましょう)。'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: 元気です、ありがとう
    note: 「お元気ですか」に対する簡単で中立的な返事です。*e tu?*または*e Lei?*を続ければ、どちらの言い方にも使えます。
    example_gloss:
    - 元気です、ありがとう。あなたは?
    - 元気です、ありがとうございます。あなたは?(丁寧な言い方)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: 君は？（くだけた表現）
    note: 友達や同年代の人に、同じ質問を返すくだけた言い方です。
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: あなたは？（丁寧）
    note: '*Lei*の丁寧な言い方に合わせて、同じ質問を返す言い方です。'
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: 元気です、ありがとう。あなたは?
    note: 友達や同年代の人に言う、返事と質問返しをそろえたくだけた言い方です。
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: 元気です、ありがとうございます。あなたはいかがですか?
    note: 敬意を払うべき相手に言う、返事と質問返しをそろえた丁寧な言い方です。
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: こんばんは、おやすみなさい
    note: '*Buonasera*は、夜にどこかへ着いたときに使うあいさつです。*Buonanotte*は、寝るときや一日を終えるときに言う別れの言葉で、出会いのあいさつには使いません。'
    example_gloss:
    - こんばんは、お元気ですか?
    - おやすみなさい、また明日。
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: さようなら、また明日。
    note: '*Arrivederla*は*Lei*に対して使う丁寧な別れのあいさつで、職場や初対面の人にふさわしい言い方です。'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: じゃあね、また明日!
    note: 翌日また会う友達や同年代の人に使う、くだけた別れのあいさつです。
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: すみません、お名前は何ですか?(丁寧な言い方)
    note: '*Come si chiama?*は、丁寧な*Lei*の言い方で、直訳すると「何と呼ばれていますか」です。*scusi*(「すみません」)を添えると、見知らぬ人に尋ねるときの自然な丁寧さが加わります。'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: 名前は何ですか?(くだけた言い方)
    note: 友達や同年代の人に使う、くだけた言い方です。
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: 私の名前はElenaです。
    note: '*chiamarsi*は「〜と呼ばれる」という意味です。自分の名前を言うときの標準的な言い方で、どちらの言い方でも使えます。'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: 私はSamです。
    note: '*mi chiamo*の簡単な言い換えで、*essere*(である)の後ろに名前をそのまま続けます。'
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: はじめまして、お会いできて光栄です(丁寧な言い方)
    note: '*Piacere*だけでも、どちらの言い方でも使える「はじめまして」の短くて一般的な言い方です。*Piacere di conoscerla*はより丁寧な形で、*Lei*に対して使います。'
    example_gloss:
    - はじめまして、Sam!
    - お会いできて光栄です、Elenaさん。
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: オフィスへようこそ!
    note: '*Benvenuto*は「ようこそ」の男性形です(男性に対して使い、女性を迎えるときは*Benvenuta*を使います)。'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: どうもありがとう。/ 本当にありがとうございます。
    note: ふつうの*Grazie*より強く、気持ちのこもった感謝の言い方です。
