  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: 誰が何を使いますか？
    gloss: ジュリアは毎日マルコに電話します。アプリではなく、携帯電話を使います。マルコは家にパソコンがありませんが、携帯電話でインターネットを使います。ルカは毎朝天気予報を調べます。それからジョギングに行きます。キアラはよくジュリアにメッセージを送ります。あなたも毎日携帯電話を使いますか。
    note: 4人の機器の使い方を比較する、スポーツの単元と同じ形式の読解です。
    glosses:
      chiama: 電話をする
      ogni: 毎～
      giorno: 日
      usa: 使う
      telefono: 携帯電話
      app: アプリ
      computer: パソコン
      casa: 家(a casa = 家で)
      internet: インターネット
      cerca: 調べる
      mattina: 朝
      previsioni: 予報(previsioni del tempo = 天気予報)
      va: 行く
      correre: 走る
      manda: 送る
      spesso: よく
      messaggio: メッセージ
      usi: あなたは使う
  it.a1.unit46.lesson05.teach.luca_cerca_le:
    title: ルカは毎朝予報を調べる
    gloss: ルカは毎朝天気予報を調べます。
  it.a1.unit46.lesson05.teach.chiara_manda_spesso:
