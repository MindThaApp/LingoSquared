  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: キアラの予定
    gloss: キアラ:わたしは泳ぎたいけど、公園にはわたしも行くよ。
    note: '*Preferisco nuotare*(泳ぐほうが好きです)は、好みをストレートに伝える言い方です。*Anch''io*(わたしも)はアポストロフィを含む一語です。'
