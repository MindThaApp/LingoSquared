course:
  title: イタリア語 A1
  description: 日常のあいさつや短い会話を中心に、A1レベルのイタリア語を詳しい日本語の解説で学びます。
units:
  it.a1.unit02.origin_nationality_language:
    title: 出身地・国籍・言語
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: ご出身はどちらですか?出身を尋ねる・答える
  it.a1.unit02.lesson02.parlare_italiano:
    title: イタリア語を話す:レベルと言語
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: 仕事とミラノへようこそ
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: どこの
    note: '*di dove* は出身をたずねたり答えたりするときの基本の表現です。*sei*(くだけた言い方)または *è*(丁寧な言い方)と一緒に使います。'
    example_gloss:
    - サム、出身はどこ?
    - エレナさん、ご出身はどちらですか?
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: どちらのご出身ですか。
    note: 友だちや同年代の相手に使うくだけた質問です。第1課の *tu* に対応します。
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: ご出身はどちらですか？（丁寧）
    note: 丁寧な質問です。第1課の *Lei* に対応します。
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: 私はアメリカ人で、シカゴ出身です。
    note: 国籍と出身の都市をいっしょに伝える言い方です。
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: 私はイタリア人で、ミラノ出身です。
    note: エレナは女性なので、国籍を表す語は女性形の *italiana* になります。
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: アメリカ人(男性・女性)、イタリア人(男性・女性)
    note: イタリア語では、国籍を表す語の語尾が、その人の性別に合わせて変わります。男性は *-o*、女性は *-a* です(*Sam è americano*、*Elena è italiana*)。
    example_gloss:
    - サムはアメリカ人です。
    - エレナはイタリア人です。
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: イタリア語を話しますか?
    note: くだけた質問で、*parlare*(話す)の *tu* の形を使っています。
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: イタリア語を話されますか?(丁寧な言い方)
    note: 丁寧な質問で、*parlare* の *Lei* の形を使っています。
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: イタリア語を少し話します
    note: 自分のレベルを控えめに言う、よく使われる表現です。*un po'* は「少し」という意味です。
    example_gloss: イタリア語を少し話します。勉強して1年になります。
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: 英語を話します。
    note: 同じ *parlo*(私は話す)の形で、別の言語を言うことができます。
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: イタリア語を勉強して1年になります。
    note: '*da un anno* は「1年前から」という意味で、過去に始まって今も続いている行動を表します。'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: どのくらい勉強していますか?
    note: '*Da quanto*(どのくらい前から)+現在形の *studi*(あなたは勉強する、くだけた言い方)で、続いている行動がどのくらい続いているかをたずねます。答えも同じ形で、*Studio da un anno.* のように言います。'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: イタリア語がお上手ですね!
    note: 相手の語学力をほめる親しみのある一言で、くだけた *tu* の形を使っています。
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: お仕事は何ですか？
    note: くだけた質問で、*fare*(する)の *tu* の形を使っています。
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: お仕事は何をされていますか?(丁寧な言い方)
    note: 丁寧な質問で、*fare* の *Lei* の形を使っています。
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: 私はエンジニアです
    note: イタリア語では、職業名の前に普通は冠詞をつけません。*sono ingegnere* と言い、*sono un ingegnere* とは言いません。
    example_gloss: 私はエンジニアで、ミラノで働いています。
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: 仕事でここに来ています。
    note: '*per lavoro* は、そこにいる理由が観光ではなく仕事であることを説明します。'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: 2年間ここにいます。
    note: '*per lavoro* と同じ形ですが、ここでは理由ではなく期間を表しています。'
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: いいですね、ミラノへようこそ!
    note: '*Che bello* は「すてきですね」「いいですね」という意味で、喜びを込めた反応としてよく使われます。'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: どうもありがとう!
    note: 第1課で学んだ、強調したお礼の言い方です。ここでは温かい歓迎への返事として使っています。
