teaching:
  it.a1.unit19.lesson01.teach.treno_stazione:
    title: il treno, la stazione
    gloss: 電車、駅
    note: '*il treno* は男性名詞、*la stazione* は女性名詞です。'
    example_gloss:
    - 電車は駅にいます。
  it.a1.unit19.lesson01.teach.binario_biglietto:
    title: il binario, il biglietto
    gloss: ホーム、切符
    note: '*binario* は電車のホーム(線路)、*biglietto* は切符のことです。'
    example_gloss:
    - この切符はローマ行きです。
  it.a1.unit19.lesson01.teach.parte_alle_otto:
    title: Parte alle otto.
    gloss: 8時に出発します。
    note: '*parte* は、乗り物について「出発する」という意味で使います。'
    example_gloss:
    - 電車は8時に出発します。
  it.a1.unit19.lesson01.teach.dal_binario_tre:
    title: dal binario tre
    gloss: 3番線から
    note: '*dal* は *da* と *il* が結びついた形で、「〜から」という意味です。'
    example_gloss:
    - 3番線から出発します。
  it.a1.unit19.lesson02.teach.a_che_ora_parte:
    title: A che ora parte il treno?
    gloss: 電車は何時に出発しますか。
    note: 決まった出発時刻をたずねるときは *A che ora...?* を使います。
    example_gloss:
    - ローマ行きの電車は何時に出発しますか。
  it.a1.unit19.lesson02.teach.vorrei_un_biglietto:
    title: Vorrei un biglietto per Roma alle otto, per favore.
    gloss: 8時のローマ行きの切符を1枚お願いします。
    note: '*Vorrei* は買い物やお願いのときに使う丁寧な言い方です。*alle otto* で乗る時刻を付け加えています。'
    example_gloss:
    - おはようございます、ローマ行きの切符を1枚お願いします。
  it.a1.unit19.lesson02.teach.il_treno_per_roma:
    title: il treno per Roma
    gloss: ローマ行きの電車
    note: 旅行先を言うときは *per* を使います。
    example_gloss:
    - ローマ行きの電車は8時に出ます。
