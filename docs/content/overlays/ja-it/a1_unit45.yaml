    title: in+乗り物、徒歩は a piedi
    gloss: イタリア語では乗り物には in を使います。in treno、in bicicletta、in macchina。徒歩は a piedi で、vado a piedi と言います。
    note: 日本語では「電車で」と言いますが、イタリア語では *in treno* と言い、冠詞は付けません。*in treno* が正しく、*nel treno* とは言いません。
  it.a1.unit45.lesson04.teach.marco_allora_prendo:
    title: マルコが答える
    gloss: マルコ:それなら電車に乗るよ、ジュリアと一緒に。
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: 誰がどのように移動する？
    gloss: ジュリアは毎日電車で通勤しています。マルコはふだん自転車で行きますが、雨の日は電車にも乗ります。ルカは車で行くほうが好きです。キアラは近くに住んでいて、歩いて通勤しています。あなたはどうやって通勤していますか?
    note: 4つの移動手段と1つの条件(*quando piove*、雨が降るとき)を対比しています。*Andare*(行く)は不規則動詞で、*vado*、*va* となります。
    glosses:
      viaggia: 通勤する
      ogni: 毎～
      giorno: 日
      treno: 電車
      lavoro: 仕事
      bicicletta: 自転車(in bicicletta = 自転車で)
      solito: ふつうの(di solito = ふだん)
      piove: 雨が降る
      prende: 乗る
      andare: 行く(andare in macchina = 車で行く)
      preferisce: 〜のほうを好む
      macchina: 車
      abita: 住んでいる
      vicino: 近くに
      piedi: 足(a piedi = 徒歩で)
      vai: あなたは行く
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: キアラは近くに住んでいて、歩いて通勤する
    gloss: キアラは近くに住んでいて、歩いて通勤しています。
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
    title: ジュリアが誘う
