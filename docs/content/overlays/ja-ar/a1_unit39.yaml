    title: 季節についての会話
    gloss: 今は春です。バラがきれいです。ヌールが尋ねます。「どの季節がきれいだと思う?」ユスフは言います。「夏が好きだよ。夏は泳ぐんだ。」ライラは言います。「冬が好き。冬はスケートをするの。」
    note: 季節についての会話をまとめた短い文章です。季節名は ال のついた男性名詞で、たとえば الصيف（aṣ-ṣayf）や الشتاء（ash-shitāʾ）です。
    glosses:
      الربيع: 春
      الورود: バラ
      جميلة: 美しい
      تسأل: 尋ねる
      فصل: 季節
      تراه: 思う／感じる
      يقول: 言う
      الصيف: 夏
      أحب: 好き(私は好き)
      نسبح: 泳ぐ
      الشتاء: 冬
      نتزلج: アイススケートをする
