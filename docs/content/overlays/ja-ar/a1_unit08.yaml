  ar.a1.unit08.lesson01.teach.price:
    title: 値段
    gloss: 値段
    note: سعر(siʿr)は「値段」という意味です。
    example_gloss: りんごはいくらですか。
  ar.a1.unit08.lesson01.teach.apple:
    title: りんご
    gloss: りんご
    note: تفاح(tuffāḥ)はりんご全般を表す集合名詞で、1個のりんごは تفاحة(tuffāḥa)といいます。
    example_gloss: りんごは10ディルハムです。
  ar.a1.unit08.lesson01.teach.dirhams:
    title: ディルハム
    gloss: ディルハム
    note: دراهم(darāhim)は درهم(dirham)の複数形で、モロッコやUAEの通貨です。3~10の数のあとには複数形を使います。
    example_gloss: 私は10ディルハム持っています。
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: りんごはいくらですか。
    gloss: リンゴはいくらですか？
    note: كم سعر التفاح؟(kam siʿr at-tuffāḥ)は、直訳すると「りんごの値段はどれくらいですか」という意味です。ما سعر التفاح؟(値段は何ですか)や بكم التفاح؟(りんごはいくらですか)も標準的な言い方です。
    example_gloss: ライラは「りんごはいくらですか」と言いました。
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: 10ディルハムで
    gloss: 10ディルハムで
    note: 接頭辞 بـ(bi-)は値段を表します。بعشرة(bi-ʿashara)は「10で」という意味です。
    example_gloss: りんごは10ディルハムです。
  ar.a1.unit08.lesson02.teach.two_apples:
    title: りんご2つ
    gloss: りんご2つ
    note: تفاحتين(tuffāḥatayn)は تفاحة(りんご1個)の双数形で、أريد のあとに使う目的語の形です。
    example_gloss: りんごを2つ。
  ar.a1.unit08.lesson02.teach.want_two:
    title: りんごを2つほしいです
    gloss: りんごを2つほしいです
    note: أريد は、ほしいものの前に置きます。
    example_gloss: りんごを2つほしいです。
  ar.a1.unit08.lesson02.teach.line01:
    title: 値段をたずねる
    gloss: ライラがりんごの値段を尋ねます。
    note: これも同じ値段の尋ね方です。
    example_gloss: ライラは「りんごはいくらですか」と言いました。
  ar.a1.unit08.lesson02.teach.line02:
    title: 値段を言う
    gloss: 店員は、りんごは10ディルハムだと言います。
    note: بعشرة は、عشرة に値段を表す بـ がついた形です。
    example_gloss: 店員は「りんごは10ディルハムです」と言いました。
  ar.a1.unit08.lesson02.teach.line03:
    title: 数量を頼む
    gloss: ライラは丁寧にりんごを2つ頼みます。
    note: من فضلك をつけると、丁寧な依頼になります。
    example_gloss: ライラは「りんごを2つください」と言いました。
  ar.a1.unit08.lesson02.teach.line04:
    title: 品物を渡す
    gloss: 店員が「どうぞ」と言います。
    note: تفضلي は食べ物のユニットで出てきました。女性に対して使い、男性には تفضل と言います。
    example_gloss: 店員は「どうぞ」と言いました。
