teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: 仕事
    gloss: 仕事
    note: عمل(ʿamal)は「仕事」という意味です。ما عملك؟ は相手の仕事をたずねる文です。語末の ـك は「あなたの」で、男性には ʿamaluka、女性には ʿamaluki と読みますが、書き方は同じです。
    example_gloss: あなたのお仕事は何ですか。
  ar.a1.unit18.lesson01.teach.engineer:
    title: エンジニア
    gloss: エンジニア
    note: مهندس(muhandis)は男性形で、ユースフに使っています。女性は أنا مهندسة(anā muhandisa)と言います。
    example_gloss: 私はエンジニアです。
  ar.a1.unit18.lesson01.teach.office:
    title: 事務所
    gloss: オフィス
    note: مكتب(maktab)は「オフィス」です。في مكتب は「オフィスで」という意味です。
    example_gloss: 私はオフィスで働いています。
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: オフィスで働いています
    gloss: オフィスで働いています
    note: أعمل(aʿmal)は「私は働く」という意味です。عمل(仕事)と同じ語根で、語頭の أ が「私」を表します。
    example_gloss: ユースフは言いました。「オフィスで働いています。」
  ar.a1.unit18.lesson02.teach.write:
    title: 私は書く
    gloss: 書きます
    note: أكتب(aktub)は「私は書く」という意味です。
    example_gloss: 仕事で書きます。
  ar.a1.unit18.lesson02.teach.read:
    title: 私は読む
    gloss: 読みます
    note: أقرأ(aqraʾ)は「私は読む」という意味です。
    example_gloss: 仕事で読みます。
  ar.a1.unit18.lesson02.teach.at_work:
    title: 職場で
    gloss: 職場で
    note: العمل(al-ʿamal)は「その仕事」です。في العمل は「職場で、仕事で」という意味です。
    example_gloss: 仕事で書いたり読んだりします。
  ar.a1.unit18.lesson02.teach.line01:
    title: 仕事をたずねる
    gloss: ライラはユースフに仕事をたずねます。
    note: يا يوسف は、ユースフに名前で呼びかける言い方です。
    example_gloss: ライラは言いました。「ユースフ、お仕事は何ですか。」
  ar.a1.unit18.lesson02.teach.line02:
    title: 仕事を答える
    gloss: ユースフは、自分はエンジニアだと言います。
    note: 「です」にあたる語は、アラビア語では必要ありません。
    example_gloss: ユースフは言いました。「私はエンジニアです。」
  ar.a1.unit18.lesson02.teach.line03:
    title: 職場を答える
    gloss: ユースフは、オフィスで働いていると言います。
    note: أعمل في で、働く場所を表します。
    example_gloss: ユースフは言いました。「オフィスで働いています。」
  ar.a1.unit18.lesson02.teach.line04:
    title: していることをたずねる
    gloss: ライラは、ユースフが毎日何をしているかをたずねます。
    note: 日課をたずねる質問をもう一度使っています。تفعل は男性に対して使います。女性には ماذا تفعلين كل يوم؟ と言います。
    example_gloss: ライラは言いました。「毎日何をしていますか。」
  ar.a1.unit18.lesson02.teach.line05:
    title: していることを答える
    gloss: ユースフは、仕事で書いたり読んだりすると言います。
    note: و(wa、「と」)は2つの動作をつなぎ、次の語にくっつけて書きます:وأقرأ。
    example_gloss: ユースフは言いました。「仕事で書いたり読んだりします。」
