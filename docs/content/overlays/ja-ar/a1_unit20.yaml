teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: 天気
    gloss: 天気
    note: الجو(al-jaww)は天気を表す日常的な言葉です。ユニットのタイトルにある الطقس(aṭ-ṭaqs)も「天気」という意味です。
    example_gloss: 今日の天気はどうですか。
  ar.a1.unit20.lesson01.teach.sunny:
    title: 晴れ
    gloss: 晴れた
    note: مشمس(mushmis)は「晴れた」という意味です。الجو に合わせて男性形になっています。
    example_gloss: 今日は天気が晴れです。
  ar.a1.unit20.lesson01.teach.cold:
    title: 寒い
    gloss: 寒い
    note: بارد(bārid)は「寒い、冷たい」という意味です。
    example_gloss: 今日は寒いです。
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: 今日は晴れ
    gloss: 今日は天気が晴れです
    note: アラビア語では、「〜です」にあたる単語は必要ありません。
    example_gloss: ユースフは「今日は天気が晴れです」と言いました。
  ar.a1.unit20.lesson02.teach.hot:
    title: 暑い
    gloss: 暑い
    note: حار(ḥārr)は「暑い」という意味です。
    example_gloss: 暑いです。
  ar.a1.unit20.lesson02.teach.weather_question:
    title: 天気はどうですか
    gloss: 今日の天気はどうですか
    note: كيف(kayfa)は「どう」とたずねる言葉で、كيف حالك؟(お元気ですか)のようにも使います。
    example_gloss: ライラは「今日の天気はどう?」と言いました。
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: 水を飲みましょう
    gloss: 水を飲みましょう
    note: هيا(hayyā)+「私たちは〜する」の動詞で「〜しましょう」という意味になります。نشرب(nashrab)は「私たちは飲む」という意味です。
    example_gloss: 暑いです。水を飲みましょう。
  ar.a1.unit20.lesson02.teach.line01:
    title: 天気をたずねる
    gloss: ライラが今日の天気をたずねています。
    note: اليوم は「今日」という意味です。
    example_gloss: ライラは「今日の天気はどう?」と言いました。
  ar.a1.unit20.lesson02.teach.line02:
    title: 晴れて暑い
    gloss: ユースフは天気が晴れて暑いと言っています。
    note: و(wa、「そして」)は二つの天気を表す言葉をつなぎ、次の単語に続けて وحار のように書きます。
    example_gloss: ユースフは「天気は晴れて暑いです」と言いました。
  ar.a1.unit20.lesson02.teach.line03:
    title: カフェを提案する
    gloss: ライラがカフェに行こうと提案しています。
    note: هل نذهب は「行きましょうか」とたずねる表現です。
    example_gloss: ライラは「カフェに行きましょうか」と言いました。
  ar.a1.unit20.lesson02.teach.line04:
    title: 水を飲む計画
    gloss: ユースフは「はい」と答え、水を飲もうと提案しています。
    note: هيا نشرب は「水を飲みましょう」の「飲みましょう」にあたる表現です。
    example_gloss: ユースフは「はい、水を飲みましょう」と言いました。
