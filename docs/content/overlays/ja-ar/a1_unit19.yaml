teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: 家
    gloss: 家
    note: بيت(bayt)は「家」です。語尾の ـي は「私の」を表すので、بيتي(baytī)は「私の家」です。
    example_gloss: 私の家は図書館の近くにあります。
  ar.a1.unit19.lesson01.teach.room:
    title: 部屋
    gloss: 部屋
    note: غرفة(ghurfa)は女性名詞(ة で終わる)なので、女性形の واحدة が後に続きます。
    example_gloss: 私の家には部屋が一つあります。
  ar.a1.unit19.lesson01.teach.kitchen:
    title: キッチン
    gloss: 台所
    note: مطبخ(maṭbakh)は「台所」です。アラビア語には「ある」にあたる語がなく、في بيتي(私の家に)で始めることでその意味を表します。
    example_gloss: 私の家には台所があります。
  ar.a1.unit19.lesson01.teach.one_room:
    title: 一つの部屋
    gloss: 一つの部屋
    note: 数の「一」は名詞の後に置かれ、名詞に性を合わせます。غرفة واحدة(ghurfa wāḥida)。男性名詞なら واحد になります。
    example_gloss: 私の家には部屋が一つあります。
  ar.a1.unit19.lesson02.teach.table:
    title: テーブル
    gloss: テーブル
    note: طاولة(ṭāwila)は「テーブル」です。غرفة と同じく ة で終わる女性名詞です。
    example_gloss: 部屋にテーブルがあります。
  ar.a1.unit19.lesson02.teach.in_room:
    title: 部屋の中
    gloss: 部屋の中に
    note: الغرفة(al-ghurfa)は「その部屋」という意味です。
    example_gloss: テーブルは部屋にあります。
  ar.a1.unit19.lesson02.teach.near_library:
    title: 図書館の近く
    gloss: 図書館の近くに
    note: قرب(qurb)は「近く」という意味です。المكتبة は場所の単元で学んだ「図書館」です。
    example_gloss: 私の家は図書館の近くにあります。
  ar.a1.unit19.lesson02.teach.line01:
    title: 場所をたずねる
    gloss: ライラはユースフの家がどこかをたずねています。
    note: أين は「どこ」をたずねる語です。بيتك(baytuka)は男性に言う「あなたの家」で、女性に言うときは baytuki ですが、書くと同じ形です。
    example_gloss: ライラは言いました。「ユースフ、あなたの家はどこですか。」
  ar.a1.unit19.lesson02.teach.line02:
    title: 家の場所
    gloss: ユースフは自分の家が図書館の近くにあると言っています。
    note: بيتي は「私の家」という意味です。
    example_gloss: ユースフは言いました。「私の家は図書館の近くにあります。」
  ar.a1.unit19.lesson02.teach.line03:
    title: 部屋
    gloss: ユースフは自分の家に部屋が一つと台所があると言っています。
    note: و(wa、「と」「そして」)は二つの家の設備をつなぎ、次の語にくっつけて ومطبخ のように書きます。
    example_gloss: ユースフは言いました。「私の家には部屋が一つと台所があります。」
  ar.a1.unit19.lesson02.teach.line04:
    title: 物についてたずねる
    gloss: ライラはユースフにテーブルがあるかをたずねています。
    note: هل は「はい・いいえ」で答える質問を始める語です。عندك(ʿindaka)は男性に言う「あなたは持っている」で、女性に言うときは ʿindaki ですが、書くと同じ形です。
    example_gloss: ライラは言いました。「テーブルはありますか。」
  ar.a1.unit19.lesson02.teach.line05:
    title: 物の場所
    gloss: ユースフは部屋にテーブルがあると言っています。
    note: عندي は所有を表します。
    example_gloss: ユースフは言いました。「はい、部屋にテーブルがあります。」
