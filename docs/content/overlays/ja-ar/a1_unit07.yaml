teaching:
  ar.a1.unit07.lesson01.teach.water:
    title: 水
    gloss: 水
    note: ماء (māʾ) は「水」という意味です。
    example_gloss: 水がほしいです。
  ar.a1.unit07.lesson01.teach.coffee:
    title: コーヒー
    gloss: コーヒー
    note: قهوة (qahwa) は「コーヒー」という意味です。
    example_gloss: 水とコーヒーがほしいです。
  ar.a1.unit07.lesson01.teach.bread:
    title: パン
    gloss: パン
    note: خبز (khubz) は「パン」という意味です。أريد や تريدين のような動詞の目的語になるときは、خبزا (khubzan) と書きます。
    example_gloss: パンがほしいです。
  ar.a1.unit07.lesson01.teach.i_want:
    title: 私は〜がほしい
    gloss: 〜がほしいです
    note: أريد (urīdu) は率直ですが、標準的な依頼の形です。
    example_gloss: 水がほしいです。
  ar.a1.unit07.lesson01.teach.please:
    title: お願いします
    gloss: お願いします
    note: من فضلك (min faḍlika；女性には min faḍliki) は、依頼の後に付けて丁寧にする表現です。文頭に置くこともできます。
    example_gloss: お水をお願いします。
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: パンはいかがですか？
    gloss: パンはいかがですか？
    note: تريدين (turīdīna) は女性に対する「あなたがほしい」で、ここではレイラに言っています。男性には تريد (turīdu) を使います。
    example_gloss: ウェイターは言いました。「パンはいかがですか？」
  ar.a1.unit07.lesson02.teach.one_bread:
    title: パン一切れ
    gloss: パン一切れ
    note: قطعة خبز واحدة (qiṭʿat khubz wāḥida) は、パンを数えられる単位にした言い方です。واحدة は قطعة に合わせて女性形になっています。
    example_gloss: パンを一切れほしいです。
  ar.a1.unit07.lesson02.teach.here_you_are:
    title: どうぞ
    gloss: どうぞ
    note: تفضلي (tafaḍḍalī) は、女性に物を差し出すときに言います。男性には تفضل (tafaḍḍal) を使います。
    example_gloss: ウェイターは言いました。「どうぞ。」
  ar.a1.unit07.lesson02.teach.line01:
    title: 注文する
    gloss: レイラが丁寧に水とコーヒーを注文します。
    note: 依頼は أريد のあとに注文する品を続けて言います。
    example_gloss: レイラは言いました。「こんにちは。水とコーヒーをお願いします。」
  ar.a1.unit07.lesson02.teach.line02:
    title: 続けて尋ねる
    gloss: ウェイターは、パンがほしいかどうか尋ねます。
    note: هل は「はい・いいえ」で答える疑問文の始まりを示します。
    example_gloss: ウェイターは言いました。「パンはいかがですか？」
  ar.a1.unit07.lesson02.teach.line03:
    title: 質問に答える
    gloss: レイラは「はい」と答えて、パンを一切れ頼みます。
    note: نعم は「はい」という答えです。
    example_gloss: レイラは言いました。「はい、パンを一切れほしいです。」
  ar.a1.unit07.lesson02.teach.line04:
    title: 注文の品を出す
    gloss: ウェイターが「どうぞ」と言います。
    note: تفضلي でこのやり取りが締めくくられます。
    example_gloss: ウェイターは言いました。「どうぞ。」
