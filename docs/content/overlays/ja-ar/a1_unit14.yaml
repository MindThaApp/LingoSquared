teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: 好きです
    gloss: 好きです
    note: أحب(uḥibbu)は「私は好きです」という意味です。アラビア語では一般的なものに ال(定冠詞)を付けるので、「コーヒーが好きです」は أحب القهوة となります。直訳すると「その coffee が好きです」です。
    example_gloss: コーヒーが好きです。
  ar.a1.unit14.lesson01.teach.tea:
    title: 紅茶
    gloss: お茶
    note: شاي(shāy)は「お茶」です。الشاي(ash-shāy)は ال が付いた形で、お茶一般について話すときにアラビア語ではこの形を使います。
    example_gloss: 私はお茶が好きではありません。
  ar.a1.unit14.lesson01.teach.dislike:
    title: 私は好きではありません
    gloss: 私は好きではありません
    note: 日本語では「好きではない」と形容や語尾を変えて否定しますが、アラビア語では動詞 أحب の前に لا を置いて否定します。
    example_gloss: 私はお茶が好きではありません。
  ar.a1.unit14.lesson01.teach.water:
    title: 水
    gloss: 水
    note: الماء(al-māʾ)は ماء(水。食べ物の単元で学びました)に ال を付けた形で、水一般を指すときに使います。
    example_gloss: 私は水が好きです。
  ar.a1.unit14.lesson01.teach.and_not:
    title: そして~ない
    gloss: そして~ない
    note: ولا(wa-lā)は و(そして)と لا(~ない)がつながった形で、好きなものの後に、好きではないものを付け加えます。
    example_gloss: 私はコーヒーが好きで、お茶は好きではありません。
  ar.a1.unit14.lesson02.teach.prefer:
    title: 〜のほうが好きです
    gloss: 〜のほうが好きです
    note: أفضل(ufaḍḍilu)は「私は~のほうが好きです」という意味で、複数の選択肢からひとつを選ぶときに使います。
    example_gloss: コーヒーのほうが好きです。
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: どちらが好き?
    gloss: どちらが好き?
    note: ここでの تفضل は tufaḍḍil で「あなたは~のほうが好きです」という意味で、男性に対して使います。女性に対しては تفضلين(tufaḍḍilīn)になります。食べ物の単元の تفضل(tafaḍḍal、どうぞ)とは別の単語ですが、書き方は同じです。
    example_gloss: ヌールは言いました。「ユースフ、何のほうが好き?」
  ar.a1.unit14.lesson02.teach.line01:
    title: ヌールがたずねる
    gloss: ヌールがユースフに、何のほうが好きかをたずねます。
    note: ヌールはユースフの姉(妹)です。男性に話しかけているので تفضل と言っています。女性にたずねるときは ماذا تفضلين؟ になります。
    example_gloss: ヌールは言いました。「ユースフ、何のほうが好き?」
  ar.a1.unit14.lesson02.teach.line02:
    title: ユースフはコーヒーのほうが好き
    gloss: ユースフは、コーヒーのほうが好きだと言います。
    note: أفضل は複数の選択肢のなかからひとつを選ぶ言い方で、أحب は単に何かが好きだと言う言い方です。
    example_gloss: ユースフは言いました。「コーヒーのほうが好きです。」
  ar.a1.unit14.lesson02.teach.line03:
    title: ユースフはお茶が好きではない
    gloss: ユースフは、お茶が好きではないと言います。
    note: لا أحب は、好きではないことを簡単に表す言い方です。
    example_gloss: ユースフは言いました。「お茶は好きではありません。」
  ar.a1.unit14.lesson02.teach.line04:
    title: ヌールは水が好き
    gloss: ヌールは、水が好きだと言います。
    note: أنا(私)は、強調したいときに加えることができます。
    example_gloss: ヌールは言いました。「私は水が好きです。」
