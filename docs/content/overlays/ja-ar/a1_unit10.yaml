teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: 右
    gloss: 右(方向)
    note: يمين (yamīn) は右側を表します。اليمين (al-yamīn) は「その右」、つまり「右」です。
    example_gloss: 右へ。
  ar.a1.unit10.lesson01.teach.left:
    title: 左
    gloss: 左(方向)
    note: يسار (yasār) は左側を表します。اليسار (al-yasār) は「その左」、つまり「左」です。
    example_gloss: 左へ。
  ar.a1.unit10.lesson01.teach.forward:
    title: まっすぐ
    gloss: まっすぐ
    note: إلى الأمام (ilā l-amām) は直訳すると「前へ」で、「まっすぐ」「前方へ」を言うときの普通の言い方です。
    example_gloss: 図書館はまっすぐ前です。
  ar.a1.unit10.lesson01.teach.to_right:
    title: 右へ
    gloss: 右へ
    note: إلى (ilā) は、方向や場所への移動を表します。
    example_gloss: 市場は右です。
  ar.a1.unit10.lesson02.teach.walk:
    title: 歩く
    gloss: 歩く
    note: امش (imshi) は男性に言う「歩いて!」という命令の形で、女性に言うときは امشي (imshī) です。歩いて道案内をするときによく使う動詞です。
    example_gloss: まっすぐ進んでください。
  ar.a1.unit10.lesson02.teach.then:
    title: それから
    gloss: そのとき／それから
    note: ثم (thumma) は、道順の二つの段階を順番につなぎます。
    example_gloss: まっすぐ進んで、それから右です。
  ar.a1.unit10.lesson02.teach.route:
    title: 二段階の道順
    gloss: まっすぐ進んで、それから右へ
    note: 一つ目の段階+ثم+二つ目の段階。ثم のあとでは動詞をくり返しません。
    example_gloss: レイラは言いました。「まっすぐ進んで、それから右に行ってください。」
  ar.a1.unit10.lesson02.teach.line01:
    title: 図書館の場所をたずねる
    gloss: ユースフは図書館がどこにあるかたずねます。
    note: أين المكتبة؟ は「場所」の単元ですでに出てきました。
    example_gloss: ユースフは言いました。「図書館はどこですか?」
  ar.a1.unit10.lesson02.teach.line02:
    title: 道を教える
    gloss: レイラは道順の基本を2つ教えます。
    note: レイラは男性に話しているので امش と言っています。女性に言うときは امشي になります。
    example_gloss: レイラは言いました。「まっすぐ進んで、それから右に行ってください。」
  ar.a1.unit10.lesson02.teach.line03:
    title: お礼を言う
    gloss: ユースフはお礼を言います。
    note: شكرا は、助けてもらったやりとりを丁寧にしめくくる言葉です。
    example_gloss: ユースフは言いました。「ありがとう。」
  ar.a1.unit10.lesson02.teach.line04:
    title: 場所を確認する
    gloss: レイラは図書館が市場の近くにあると言います。
    note: 「場所」の単元で学んだ قرب をここでも使っています。図書館は市場の近くです。
    example_gloss: レイラは言いました。「図書館は市場の近くです。」
