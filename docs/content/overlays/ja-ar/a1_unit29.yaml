  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: 動詞は人称によって変わる
    gloss: 動詞は主語の人称によって形が変わります:أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī)「私は自転車で通勤します」、يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi)「ユスフは自転車で通勤します」。
    note: 語頭の أ (a-) は「私」、ي (ya-) は「彼」を表します。عملي の語末の ي は「私の」、عمله の語末の ه は「彼の」を表します。
