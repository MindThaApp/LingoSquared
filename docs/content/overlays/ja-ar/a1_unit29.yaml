  ar.a1.unit29.lesson02.teach.kthyra_wkl_ywm:
    title: 交通手段にも同じ言葉
    gloss: كثيرا (kathīran)「よく」と كل يوم (kull yawm)「毎日」はすでに知っている言葉で、交通手段の話でも使えます:أركب الدراجة كثيرا (arkab ad-darrāja kathīran)「よく自転車に乗ります」、أسافر بالقطار كل يوم (usāfir bi-l-qiṭār kull yawm)「毎日電車で移動します」。
