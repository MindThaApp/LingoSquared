  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: 誰がどのように移動する？
    gloss: ライラは毎日電車で通勤しています。ユスフはたいてい自転車ですが、雨が降ると電車にも乗ります。カリームは車を運転するほうが好きです。サーラは近くに住んでいて、歩いて通勤しています。あなたはどうやって通勤していますか?
    note: 女性の動詞(تسافر、تسكن、تمشي)は ت (ta-) で始まり、男性の動詞(يركب、يذهب、يقود、يفضل)は ي (ya-) で始まります。
    glosses:
      تسافر: 通勤する
      كل: 毎～
      يوم: 日
      بالقطار: 電車で
      عملها: 仕事
      يركب: 自転車で行く
      غالبا: たいてい
      أمطرت: 雨が降る
      يذهب: 乗る
      يقود: 車で行く
      يفضل: 〜のほうを好む
      السيارة: 車
      تسكن: 住んでいる
      قريبا: 近くに
      وتمشي: 歩いて行く
      تذهب: 行く
