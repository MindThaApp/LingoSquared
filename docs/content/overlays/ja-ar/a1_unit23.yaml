teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: 電話
    gloss: 携帯電話
    note: هاتف (hātif) は「電話」という意味です。
    example_gloss: これは電話です。
  ar.a1.unit23.lesson01.teach.hear:
    title: あなたの声が聞こえます
    gloss: あなたの声が聞こえます
    note: أسمعك(男性に対しては asmaʿuka、女性に対しては asmaʿuki)は「あなたの声が聞こえます」という意味です。لا أسمعك (lā asmaʿuk) は「あなたの声が聞こえません」という意味です。
    example_gloss: あなたの声が聞こえません。
  ar.a1.unit23.lesson01.teach.repeat:
    title: 繰り返す
    gloss: 繰り返す
    note: أعد (aʿid) は男性に対して言う形で、女性に対しては أعيدي (aʿīdī) と言います。أعد من فضلك は、丁寧に繰り返しをお願いする表現です。
    example_gloss: あなたの声が聞こえません。もう一度言ってください。
  ar.a1.unit23.lesson01.teach.slowly:
    title: ゆっくり話す
    gloss: ゆっくり話して
    note: تكلم ببطء (takallam bi-buṭʾ) は男性に対して言う形で、女性に対しては تكلمي ببطء (takallamī bi-buṭʾ) と言います。
    example_gloss: ゆっくり話してください。
  ar.a1.unit23.lesson02.teach.message:
    title: メッセージ
    gloss: メッセージ
    note: رسالة (risāla) は「メッセージ」の意味です。「手紙」の意味にもなります。
    example_gloss: これはメッセージです。
  ar.a1.unit23.lesson02.teach.appointment:
    title: 約束
    gloss: その予約
    note: موعد (mawʿid) は「約束、予約」という意味で、الموعد (al-mawʿid) は「その約束」です。
    example_gloss: 約束は5時です。
  ar.a1.unit23.lesson02.teach.line01:
    title: 電話に出る
    gloss: ユースフは電話でライラにあいさつし、名前を名乗ります。
    note: 電話では、أنا يوسف (anā Yūsuf) で誰からかかってきたかを伝えます。
    example_gloss: ユースフは「こんにちは、ユースフです」と言いました。
  ar.a1.unit23.lesson02.teach.line02:
    title: 聞こえない
    gloss: ライラは、ユースフの声が聞こえないと言います。
    note: これは、聞き返しのお願いにつながる一言です。
    example_gloss: ライラは「こんにちは、ユースフ。声が聞こえません」と言いました。
  ar.a1.unit23.lesson02.teach.line03:
    title: ゆっくり話してもらう
    gloss: ライラはユースフにゆっくり話してほしいと頼みます。
    note: من فضلك で依頼が丁寧になります。ライラは男性に話しかけているので تكلم と言います。
    example_gloss: ライラは「ゆっくり話してください」と言いました。
  ar.a1.unit23.lesson02.teach.line04:
    title: 大事な情報
    gloss: ユースフは、約束は5時だと言います。
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) は「5時に」という意味です。
    example_gloss: ユースフは「約束は5時です。」と言いました。
  ar.a1.unit23.lesson02.teach.line05:
    title: 聞き返す
    gloss: ライラはユースフにもう一度言ってほしいと頼みます。
    note: أعد من فضلك は「もう一度言ってください」という依頼の表現です。
    example_gloss: ライラは「もう一度言ってください。」と言いました。
  ar.a1.unit23.lesson02.teach.line06:
    title: 詳細をくり返す
    gloss: ユースフは約束の時間をくり返します。
    note: くり返された文で時間を確認します。
    example_gloss: ユースフは「約束は5時です。」と言いました。
