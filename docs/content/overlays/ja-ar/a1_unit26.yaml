course:
  title: アラビア語 A1
  description: 人の基本的な外見(身長や年齢、髪と目の色)を表すアラビア語の入門コースです。كيف تبدو؟ (kayfa tabdū?)「どんな見た目ですか」という質問と、أطول من (aṭwal min)「〜より背が高い」を使った二人の比較も学びます。
