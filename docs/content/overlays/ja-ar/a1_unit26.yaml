  ar.a1.unit26.lesson02.wsf_alshar:
    title: 髪について説明する
  ar.a1.unit26.lesson03.alaynan_wkyf_ybdw_alshkhs:
    title: 目と人の外見の尋ね方
  ar.a1.unit26.lesson04.lyla_tsf_nwr:
    title: ライラがヌールの外見を説明する
  ar.a1.unit26.lesson05.mqarna_byn_krym_wsara:
    title: カリームとサーラを比べる
  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: ユースフがヌールだと気づく
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: طويل (ṭawīl) は「背が高い」、قصير (qaṣīr) は「背が低い」という意味です。女性には ة が付きます:طويلة (ṭawīla)、قصيرة (qaṣīra)。
    example_gloss:
    - サーラは背が高いです。
    - カリームは背が低いです。
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: كبير في السن (kabīr fī as-sinn) と صغير في السن (ṣaghīr fī as-sinn) は、正確な年齢ではなく、年齢の大まかな印象を表します。
    example_gloss:
    - おじいさんは年を取っています。
    - ユースフは若いです。
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 年齢:数字か印象か
    gloss: كم عمرك؟ (kam ʿumruka?) は年齢の数を尋ねる表現です。一方、كبير في السن (kabīr fī as-sinn) は数字を使わずに大まかな印象を述べる表現で、たとえば الجد كبير في السن (al-jadd kabīr fī as-sinn)「祖父は高齢です」のように使います。
    note: 正確な年齢を尋ねるときは كم عمرك؟ を使います。ここでの كبير في السن は、見た目の年齢の印象を述べるだけです。
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: サーラは背が高く、カリームは背が低いです
    gloss: サーラは背が高く、カリームは背が低いです。
    note: و (wa-) は二つの文をつなぎ、次の単語にくっつけて書きます:وكريم (wa-karīm)。形容詞は性が一致します:سارة طويلة は女性形、كريم قصير は男性形です。
  ar.a1.unit26.lesson02.teach.alshar:
    title: 髪
    gloss: 髪
    note: الشعر (ash-shaʿr) は「髪」という意味です。ش は太陽文字なので、ال の ل は発音されず、ash-shaʿr となります。
    example_gloss: ユースフは短い黒髪です。
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: أشقر (ashqar)、بني (bunnī)、رمادي (ramādī) は髪の色を表し、名詞の後ろに置きます:شعر أشقر (shaʿr ashqar)。
    example_gloss:
    - ライラは金髪です。
    - カリームは茶色の髪です。
    - おじいさんは白髪です。
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: طويل (ṭawīl) と قصير (qaṣīr) は髪にも使います:شعر طويل (shaʿr ṭawīl)、شعر قصير (shaʿr qaṣīr)。男性名詞である شعر の後ろに置きます。
    example_gloss:
    - サーラは長い髪です。
    - カリームは短い髪です。
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: 形容詞は名詞のあとに置く
    gloss: アラビア語では形容詞は名詞の後ろに置き、名詞と性が一致します:شعر قصير (shaʿr qaṣīr)、شعر طويل (shaʿr ṭawīl)、شعر أشقر (shaʿr ashqar)、شعر بني (shaʿr bunnī)、شعر رمادي (shaʿr ramādī)、شعر أسود (shaʿr aswad)。
    note: شعر (shaʿr) は男性名詞なので、形容詞も男性形になります。不定の名詞では、どちらの語にも ال は付きません。
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: 髪と彼女の髪
    gloss: شعر (shaʿr) は「髪」という意味です。代名詞 ها (hā「彼女の」)を付けると、شعرها (shaʿruhā「彼女の髪」)になります。
    note: 語尾の ها は持ち主を表します:شعرها(彼女の髪)、اسمها(彼女の名前)、عيناها(彼女の目)。単語につなげて書きます。
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: ユースフは短い黒髪です
    gloss: ユースフは短い黒髪です。
    note: ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad):名前の前の ل (li-) は「〜は…を持っている」の意味で、名前につなげて書きます。
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: ライラは長い金髪です
    gloss: ライラは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  ar.a1.unit26.lesson03.teach.alaynan:
    title: 目
    gloss: 目
    note: العينان (al-ʿaynān) は「目」という意味です。双数名詞で、アラビア語にはちょうど二つのものを表す専用の語尾 ان があります。
    example_gloss: ユーセフは茶色い目をしています。
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: أزرق (azraq)「青い」、بني (bunnī)「茶色の」、أخضر (akhḍar)「緑の」は男性形です。عينان「両目」には双数形を使います:زرقاوان (zarqāwān)、بنيتان (bunnīyatān)、خضراوان (khaḍrāwān)。
    example_gloss:
    - ライラは青い目をしています。
    - カリームは茶色の目をしています。
    - サーラは緑の目をしています。
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: 目は双数、形容詞も双数
    gloss: عينان (ʿaynān)は双数なので、形容詞も双数にします:عينان زرقاوان (ʿaynān zarqāwān)、عينان بنيتان (ʿaynān bunnīyatān)、عينان خضراوان (ʿaynān khaḍrāwān)。
    note: 双数では、名詞にも形容詞にも語尾 ان を付けます。また、عين は女性名詞なので、形容詞も女性形になります。
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: ライラはどんな見た目ですか。
    gloss: ライラはどんな見た目ですか。
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?)は「ライラはどんな見た目ですか」とたずねる文です。ライラは女性なので تبدو (tabdū)を使い、男性なら يبدو (yabdū)になります。
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: ライラは長い金髪で、青い目をしています
    gloss: ライラは長い金髪で、青い目をしています。
    note: لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān):ل +名前で「〜は持っている」を表し、و が髪と目をつなぎます。
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: ライラがヌールを紹介する
    gloss: ライラ:新しい女の子が言語カフェに来ます。名前はヌールです。
    note: ستأتي (sa-taʾtī)は「彼女は来るでしょう」という意味です。س (sa-)は未来を表し、ت (ta-)は「彼女」を表します。اسمها (ismuhā)は「彼女の名前」という意味です。
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: ユーセフが彼女の見た目をたずねる
    gloss: ユーセフ:わかった!どんな見た目ですか。
    note: كيف تبدو؟ (kayfa tabdū?)には、今回は名前がありません。動詞 تبدو だけで「彼女は見える」という意味を表すからです。
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: ライラがヌールの身長と髪を説明する
    gloss: ライラ:彼女は背が低くて、短い金髪です。
    note: قصيرة (qaṣīra)はヌールが女性なので女性形ですが、شعر قصير أشقر は شعر が男性名詞なので男性形のままです。
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: ユーセフが彼女の目についてたずねる
    gloss: ユーセフ:じゃあ、目は?
    note: وعيناها (wa-ʿaynāhā)は「そして彼女の目」という意味です。و (wa-)は名詞にくっつき、最後の ها (hā)が「彼女の」を表します。
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: ライラがヌールの目を説明する
    gloss: ライラ:彼女は緑色の目をしています。
    note: لها (lahā)は「彼女は持っている」という意味で、ل (la-)+ ها (hā)です。عينان خضراوان (ʿaynān khaḍrāwān)は、双数の名詞に双数の形容詞が付いた形です。
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: ユーセフは彼女だとわかる
    gloss: ユーセフ:ありがとう!それなら彼女だとわかりそうです。
    note: سأتعرف عليها (sa-ataʿarraf ʿalayhā)は「私は彼女だとわかるでしょう」という意味です。س (sa-)は未来を表し、عليها の ها は「彼女」を表します。
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: カリームとサーラを比べる
    gloss: カリームとサーラは兄妹ですが、見た目は違います。カリームは背が低く、短い茶髪で、茶色い目をしています。サーラはカリームより背が高く、長い茶髪で、緑色の目をしています。あなたはどんな見た目ですか。
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      أخ: 兄弟
      أخت: 姉妹
      تبدو: ～に見える
      مختلفان: 異なる
      القامة: 背が低い
      قصير: 背が低い
      بني: 茶色の
      شعر: 髪
      بنيتان: 茶色の
      وعينان: 目
      أطول: より背が高い
      طويل: 長い
      خضراوان: 緑色の
      المظهر: 外見(見た目)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: أفعل で比べる
    gloss: 比べるときは、أفعل (afʿal)の形+ من (min)を使います:سارة أطول من كريم (sāra aṭwal min karīm)「サーラはカリームより背が高い」。
    note: طويل (ṭawīl)は比較級で أطول (aṭwal)になり、من (min)は「〜より」という意味です。この形は女性でも変わりません。
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: サーラの髪はカリームの髪より長い
    gloss: サーラの髪はカリームの髪より長いです。
    note: لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm):شعر が男性名詞なので、أطول は男性形のままです。
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: لدي (ladayya)は「私は持っている」という意味です。アラビア語には「持つ」にあたる動詞がありません。形容詞は名詞の後ろに置きます:شعر قصير بني (shaʿr qaṣīr bunnī)。
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: ユーセフがヌールを見つける
    gloss: ユーセフ:見て、あれはヌールかな?短い金髪で、緑色の目をしているよ。
    note: انظري (unẓurī)は女性に対する命令形です。ユーセフがライラに話しかけているからです。男性に対しては انظر (unẓur)になります。هذه (hādhihi)は女性名詞に使う「この/これ」です。
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: ライラが確認する
    gloss: ライラ:うん、あれがヌールよ!
    note: 短く自然に、そうだと伝える表現です。
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: ヌールがユーセフにあいさつする
    gloss: ヌール:こんにちは、ユーセフさんですか。
    note: هل أنت يوسف؟ (hal anta yūsuf?)は「はい/いいえ」で答える疑問文です。هل (hal)+「be動詞」のない文の形です。
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: ユーセフもあいさつを返す
    gloss: ユーセフ:はい!はじめまして、ヌール。
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika)は、初対面のときの丁寧な表現です。ب (bi-)は معرفتك にくっつき、最後の ك は「あなた」を表します。
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: ヌールもあいさつを返す
    gloss: ヌール:私もはじめまして!
    note: 会話はここで終わります。ユーセフは、先ほどのライラの説明のおかげでヌールだとわかりました。
