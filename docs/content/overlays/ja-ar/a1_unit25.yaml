teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: القراءة (al-qirāʾa)は「読書」、ممارسة الرياضة (mumārasat ar-riyāḍa)は「スポーツをすること」、الطبخ (aṭ-ṭabkh)は「料理」です。どれも名詞なので、冠詞 ال が付いています。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: 自由時間
    gloss: 空いている時間
    note: وقت الفراغ (waqt al-farāgh)は直訳すると「空いている時間」です。最初の語には ال が付かず、2番目の語だけに付きます。
    example_gloss: 私は自由時間に読書をするのが好きです。
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: أحب (uḥibb)は「私は好きです」という意味で、男性も女性も同じ形です。فراغي (farāghī)の末尾の ي は「私の」を表します。
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā)は「音楽を聴くこと」、الرسم (ar-rasm)は「絵を描くこと」、لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū)は「テレビゲームをすること」です。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: الاستماع (al-istimāʿ)は、聴く対象の前に إلى (ilā, 〜へ)が必要です:الاستماع إلى الموسيقى。
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: مع (maʿa)は「〜と一緒に」という意味です:مع الأصدقاء (maʿa al-aṣdiqāʾ)。冠詞 ال は الأصدقاء に付いたままです。
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: دائما (dāʾiman)、كثيرا (kathīran)、أحيانا (aḥyānan)、أبدا (abadan)は副詞なので、性によって形が変わりません。語末の ا (alif)には記号を付けずに書きます。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: كل أسبوع (kull usbūʿ)も كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ)も كل (kull, 毎〜)を使います。次のカードを見てください。
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 「毎〜」:كل
    gloss: كل (kull, 毎〜)のあとの名詞は単数形で、ال は付きません:كل أسبوع (kull usbūʿ)、كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ)。
    note: كل (kull)は形が変わりません。أسبوع のような男性名詞の前でも、عطلة のような女性名詞の前でも同じ語を使います。
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: レイラが趣味の話を切り出す
    gloss: レイラ:私たちはよく一緒に散歩しますね。でも、ユーセフ、自由な時間にほかには何をしますか。
    note: نتمشى (natamashshā)の語頭の ن (na-)は「私たちは」を表すので、アラビア語では「私たち」という単語を別に置く必要がありません。معا (maʿan)は「一緒に」です。
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: ユーセフの趣味
    gloss: ユーセフ:料理が好きです。家でもします。それに、よく運動もします。
    note: في البيت أيضا (fī al-bayt ayḍan)は「家でも」を付け加えています。وأمارس (wa-umāris)は و(そして)が動詞にくっつき、一語として書きます。
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: レイラが驚く
    gloss: レイラ:家でも料理するんですか。仕事ですでに一日中料理しているのに!
    note: تطبخ (taṭbukh)は男性に対する「あなたは〜する」の形で、女性に対しては تطبخين (taṭbukhīn)と言います。طوال اليوم (ṭawāl al-yawm)は「一日中」という意味です。
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: ユーセフが説明する
    gloss: ユーセフ:ええ、でも料理するとほっとするんです。あなたは何をするのが好きですか。
    note: أجد (ajid)は「私は〜と感じる」、مريحا (murīḥan)は「ほっとする、くつろげる」という意味です。وأنت (wa-anta)は و と أنت がつながった形で、「そしてあなたは」です。
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: レイラの趣味
    gloss: レイラ:読書が好きで、音楽もよく聴きます。
    note: و は二つの趣味をつなぎます:أحب القراءة (uḥibb al-qirāʾa)と وأستمع (wa-astamiʿ, そして私は聴く)。و は次の語にくっつけて書きます。
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: ユーセフがゲームについてたずねる
    gloss: ユーセフ:ゲームもしますか。
    note: تلعبين (talʿabīn)は女性に対する「あなたは〜する」の形です。ユーセフがレイラにたずねているからで、男性なら تلعب (talʿab)です。هل (hal)は「はい/いいえ」で答える疑問文を作ります。
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: レイラが答える
    gloss: レイラ:いいえ、ゲームは絶対にしません。でも、ときどき絵を描きます。
    note: أبدا (abadan)は「決して〜ない」、أحيانا (aḥyānan)は「ときどき」です。動詞は لا (lā)で否定します:لا ألعب (lā alʿab)は「私は遊ばない」という意味です。
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: 趣味を比べる
    gloss: ユーセフと私はよく一緒に散歩します。でも、ほかにも趣味があります。ユーセフは料理が好きで、家でもします。それによく運動もします。私は読書が好きで、音楽もよく聴きます。ときどき絵を描きますが、ゲームは絶対にしません。あなたは自由な時間に何をするのが好きですか。
    note: レイラのメッセージはこれまでの内容をまとめ、読み手にこのユニットの中心となる質問をして終わります。
    glosses:
      نتمشى: 散歩する
      كثيرا: よく
      معا: 一緒に
      أخرى: ほかの
      يطبخ: 料理する
      يحب: ～するのが好き
      البيت: 家(家で)
      ويمارس: 運動する
      أقرأ: 読む
      وأستمع: 聴く
      الموسيقى: 音楽
      أرسم: 絵を描く
      أحيانا: 時々
      ألعب: 遊ぶ(ゲームを)
      أبدا: 決して〜ない
      فراغك: あなたの自由な(時間)
      وقت: 時間
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: ユーセフが週末の予定をたずねる
    gloss: ユーセフ:今週末は何をする予定ですか。
    note: ستفعلين (sa-tafʿalīn)は未来の形です。語頭の س (sa-)が未来を表し、語末の ين は女性に対する形です。عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ)は「週末」です。
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: レイラは迷っている
    gloss: レイラ:まだわかりません。読書も好きですが、出かけたい気持ちもあります。
    note: لا أعرف بعد (lā aʿrif baʿd)は「まだわかりません」という意味です。أن أخرج (an akhruj)は「出かけること」です。
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: ユーセフが計画を提案する
    gloss: ユーセフ:一緒に散歩しませんか。そのあと、私が料理を作りますよ。
    note: هل نتمشى (hal natamashshā)は、一緒にしようと誘うときの普通の言い方で、هل +「私たちは〜する」の動詞の形です。لنا (lanā)は ل(〜のために)と نا(私たち)が一語になった形です。
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: レイラが賛成する
    gloss: レイラ:いい考えですね。散歩も料理も、どちらも好きです。
    note: كليهما (kilayhimā)は「両方」という意味で、最後に置き、二つのこと(المشي والطبخ, al-mashy wa-aṭ-ṭabkh)を指します。
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: ユーセフが確認する
    gloss: ユーセフ:いいですね。では、土曜日に会いましょう。
    note: يوم السبت (yawm as-sabt)は「土曜日に」という意味です。ال の ل は太陽文字の س の前では発音されないので、as-sabt と書きます。
