teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: 動物、ペット
    gloss: 動物／ペット
    note: حيوان (ḥayawān) は「動物」、حيوان أليف (ḥayawān alīf) は「ペット」という意味です。أليف (alīf) は「人に慣れた」という意味の形容詞で、名詞の後ろに置きます。
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - ライラは犬を飼っています。
    - カリームは猫を飼っています。
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - ヌールは鳥を飼っています。
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: هل لديك (hal ladayka) は「あなたは~を持っていますか」とたずねる言い方です。女性に対しても書き方は同じですが、最後の母音が i になり、ladayki と読みます。هل (hal) は「はい/いいえ」で答える疑問文を作ります。
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: ليس لدي (laysa ladayya) は「私は~を持っていません」という意味です。ليس (laysa) が否定を表し、لدي (ladayya) は「私は持っている」という意味です。
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 持っていないと言う:ليس لدي
    gloss: 何かを持っていないと言うときは ليس لدي (laysa ladayya) を使います:ليس لدي وقت(時間がありません)、ليس لدي حيوان أليف(ペットを飼っていません)。
    note: ليس لدي はどんな名詞にも使え、名詞の性によって変わりません。「彼は」「彼女は」の場合は ليس لديه (laysa ladayhi)、ليس لديها (laysa ladayhā) と言います。
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) は直訳すると「動物を散歩に連れて行くこと」です。動詞は أخذ「取る、連れて行く」です。
    example_gloss: 私は毎日犬を散歩させます。
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: 動詞は人称によって変わる
    gloss: 動詞は主語によって形が変わります:آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha)「私は犬を散歩に連れて行きます」、كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha)「カリームは犬を散歩に連れて行きます」。
    note: 語頭の أ (a-) は「私」、ي (ya-) は「彼」を表します。نزهة (nuzha) は「散歩」や「ちょっとした外出」という意味です。
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: カリームは猫と遊びます。
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: كل يوم (kull yawm) は「毎日」という意味です。كل + ال のない単数名詞 の形です。
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: أطعم (uṭʿim) は「私はえさをあげる」という意味です。القطة (al-qiṭṭa) は女性名詞で、ال は名詞にくっつけて書きます。
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 複数形:كلب → كلاب
    gloss: 複数形には不規則なものが多いので、名詞と一緒に覚えましょう:كلب (kalb) は كلاب (kilāb)、قطة (qiṭṭa) は قطط (qiṭaṭ)、طائر (ṭāʾir) は طيور (ṭuyūr) になります。
    note: アラビア語の複数形は多くが「壊れた複数形」なので、複数形は名詞と一緒に覚えます。また、動物の複数形には女性単数の形容詞が付きます。
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - ユーセフは犬が好きです。
    - サーラは猫が好きです。
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) は「私は動物が好きです」という意味です。複数形は ات で終わり、冠詞 ال が名詞にくっつきます。
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: サーラは猫が好きだけれど、ペットはいない
    gloss: サーラは猫が好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: ユーセフがペットについてたずねる
    gloss: ユーセフ:ライラ、ペットを飼っていますか?
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: ライラは犬を飼っている
    gloss: ライラ:はい、犬を飼っています。
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: ユーセフが見た目をたずねる
    gloss: ユーセフ:どんな見た目ですか?
    note: كيف يبدو؟ (kayfa yabdū?) は「彼はどんな見た目ですか」とたずねる言い方です。كلب「犬」は男性名詞なので、يبدو は男性形です。
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: ライラが自分の犬を説明する
    gloss: ライラ:茶色の毛で、小さいです。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: 動物を指す代名詞
    gloss: 動物を表す単語はすべて男性か女性のどちらかです。犬は هو (huwa、彼)、猫は هي (hiya、彼女)で受けます。أطعمه (uṭʿimuhu) の語尾の ه は「彼を」「それを」という意味です。
    note: كلب のような男性の動物名詞には男性の代名詞と形容詞を、قطة のような女性の動物名詞には女性のものを使います。
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: ユーセフが散歩についてたずねる
    gloss: ユーセフ:毎日散歩に連れて行っていますか?
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: ライラが日課を説明する
    gloss: ライラ:はい、毎日散歩に連れて行って、えさもあげています。
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: ユーセフ、サーラ、カリームと動物
    gloss: ユーセフとサーラは二人とも動物が好きですが、どちらもペットは飼っていません。ユーセフは犬が好きで、サーラは猫が好きです。一方、カリームはペットを飼っています。猫です。彼はよく猫と遊び、毎日猫にえさをあげています。あなたはペットを飼っていますか?
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      يحبان: 愛する
      كلاهما: 両方とも
      الحيوانات: 動物
      منهما: その(二人の)どちらも
      أليف: ペット(直訳:人に慣れた)
      الكلاب: 犬たち
      القطط: 猫たち
      قطة: 猫
      يلعب: 遊ぶ
      ويعطي: 与える
      كل: 毎～
      طعاما: 餌
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: カリームはよく猫と遊ぶ
    gloss: カリームはよく猫と遊びます。
    note: قطته (qiṭṭatuhu) は「彼の猫」という意味です。語尾の ه (hu) が「彼の」を表し、قطة の ة は前に ت に変わります。
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: ライラがヌールに尋ねる
    gloss: ライラ:ヌール、あなたもペットを飼っていますか?
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: ヌールの鳥の名前はピコ
    gloss: ヌール:はい、鳥を飼っています。名前はピコです。
    note: اسمه (ismuhu) は「彼の名前」という意味です。語末の ه が「彼の」を表します。بيكو (bīkū) はこの鳥の名前です。
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: ユースフの反応
    gloss: ユースフ:かわいいですね!毎日いっしょに何をしていますか?
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: ヌールは毎日えさをあげる
    gloss: ヌール:毎日えさをあげています。
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: ユースフも鳥が好き
    gloss: ユースフ:ぼくも鳥が好きです。
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: ライラが会話をしめくくる
    gloss: ライラ:私たち三人とも動物が好きなんて、すてきですね!
    note: このユニットで登場した三人と動物についての話をまとめて、会話を締めくくっています。
