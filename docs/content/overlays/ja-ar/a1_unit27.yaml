course:
  title: アラビア語 A1
  description: ペットや身近な動物について話すための初級アラビア語です。動物の名前、基本的な世話(散歩、えさやり、遊び)、飼っていなくても好きな動物を伝える言い方、よく使う複数形を学びます。
