  ar.a1.unit31.lesson05.teach.krym_la_yaml:
    title: 誰が何を学んでいますか？
    gloss: カリームは仕事をしているだけでなく、勉強もしています。成人教育センターでスペイン語の講座を受けています。毎週、新しい単語を学んでいます。サラはカレッジのプログラムに入っています。そこで医療・介護(ヘルスケア)を勉強しています。二人とも勉強が好きです。あなたは何を勉強していますか。それとも、何を学びたいですか。
    note: カリームとサラの勉強を比べる読み物です。
    glosses:
      يعمل: 働いています
      فقط: ～だけ
      يدرس: 専攻しています
      يتابع: 乗る
      دورة: 講座
      الإسبانية: スペイン語
      مركز: センター(成人教育センター)
      يتعلم: 学んでいます
      كل: 毎～
      أسبوع: 週
      جديدة: 新しい
      كلمات: 単語
      تلتحق: 在籍している(プログラムを受けている)
      ببرنامج: 学位課程
      الكلية: 大学
      الرعاية: ケア(ヘルスケア)
      كلاهما: 両方とも
      يحب: 好んで
      الدراسة: 勉強すること
      تتعلم: 学ぶ
