teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: お名前は?
    gloss: お名前は何ですか。
    note: ما اسمك؟(mā ismuk)は名前をたずねる標準的な言い方です。母音記号なしの表記は、相手が男性でも女性でも同じです。
  ar.a1.unit02.lesson01.teach.ismee:
    title: 私の名前は…です
    gloss: 私の名前は〜です
    note: اسمي(ismī)は、اسم(名前)に「私の」を表す語尾 ـي がついた形です。
    example_gloss: 私の名前はカリームです。
  ar.a1.unit02.lesson01.teach.ana:
    title: 私
    gloss: 私
    note: أنا(anā)は「私」を表す独立した代名詞です。アラビア語の動詞は人称も自分で示しますが、この文のような単純な名詞文や、強調したいときには أنا を使います。
    example_gloss: 私はサラです。
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: お会いできてうれしいです
    gloss: はじめまして
    note: تشرفنا(tasharrafnā)は直訳すると「私たちは光栄です」で、人と会ったときの標準的なお互いの返事です。どちらが先に言ってもかまいません。
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: ご出身はどちらですか？
    gloss: どちらのご出身ですか。
    note: من أين أنت؟(男性には min ayna anta、女性には min ayna anti)は出身をたずねる言い方です。母音記号なしの表記は男女どちらも同じです。
  ar.a1.unit02.lesson02.teach.ana_min:
    title: 私は〜の出身です
    gloss: 私は〜の出身です
    note: أنا من(anā min)の後ろには、国名や都市名がそのまま続きます。
  ar.a1.unit02.lesson02.teach.lubnan:
    title: レバノン
    gloss: レバノン
    note: لبنان(lubnān)は、この課のほとんどの国名と違って、定冠詞がつきません。
    example_gloss: 私はレバノンの出身です。
  ar.a1.unit02.lesson02.teach.misr:
    title: エジプト
    gloss: エジプト
    note: مصر(miṣr)も定冠詞がつきません。
    example_gloss: 私はエジプトの出身です。
  ar.a1.unit02.lesson02.teach.urdun:
    title: ヨルダン
    gloss: ヨルダン
    note: الأردن(al-ʾurdun)は、この課の المغرب や العراق と同じように、定冠詞 الـ が名前の一部として常についています。
    example_gloss: 私はヨルダンの出身です。
  ar.a1.unit02.lesson02.teach.maghrib:
    title: モロッコ
    gloss: モロッコ
    note: المغرب (al-maghrib)は、もともと「西」という意味です。日没の礼拝(マグリブの礼拝)と同じ語根です。
    example_gloss: 私はモロッコの出身です。
  ar.a1.unit02.lesson02.teach.soorya:
    title: シリア
    gloss: シリア
    note: سوريا (sūryā)には定冠詞がつきません。
    example_gloss: 私はシリアの出身です。
  ar.a1.unit02.lesson02.teach.iraq:
    title: イラク
    gloss: イラク
    note: العراق (al-ʿirāq)には定冠詞がつきます。
    example_gloss: 私はイラクの出身です。
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: 〜の出身ですか?
    gloss: エジプトの出身ですか?
    note: هل (hal)は「はい・いいえ」で答える疑問文の文頭に置く疑問の印で、それ自体に意味はありません。日本語の文末の「か」に近い働きです。
  ar.a1.unit02.lesson03.teach.naam:
    title: はい
    gloss: はい
    note: نعم (naʿam)は肯定の答えの基本の言い方です。
    example_gloss: はい、私はエジプトの出身です。
  ar.a1.unit02.lesson03.teach.laa:
    title: いいえ
    gloss: いいえ
    note: لا (lā)は否定の答えの基本の言い方です。
    example_gloss: いいえ、私はレバノンの出身です。
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: お会いできてうれしかったです
    gloss: お会いできてうれしかったです
    note: سعدت بلقائك (saʿidtu bi-liqāʾik)は تشرفنا よりも温かみのある結びの表現で、別れる直前によく使われます。
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: ようこそ
    gloss: ようこそ/どうぞ歓迎します
    note: مرحبا بك (marḥaban bik)は بك「あなたに」がついた形です。前置詞 بـ に「あなた」を表す接尾辞 ـك がついたもので、أهلا بك の بك と同じです。
  ar.a1.unit02.lesson04.teach.line01:
    title: 最初のあいさつ
    gloss: ユーセフがライラにあいさつします。
    note: 名前を交換する前に、まずシンプルな مرحبا で会話が始まります。
  ar.a1.unit02.lesson04.teach.line02:
    title: 最初のあいさつ(返事)
    gloss: ライラもあいさつを返します。
    note: 同じ مرحبا という語が、あいさつをする側にも返す側にも使えます。
  ar.a1.unit02.lesson04.teach.line03:
    title: 名前をたずねる
    gloss: ユーセフが彼女の名前をたずねます。
    note: ما اسمك؟ で自己紹介が始まります。
  ar.a1.unit02.lesson04.teach.line04:
    title: 名前をたずねる(返事)
    gloss: ライラは答えて、彼にたずね返します。
    note: وأنت؟ は質問全体をくり返さずに済ませる、よく使われる省略表現です。
  ar.a1.unit02.lesson04.teach.line05:
    title: 答えとお互いの喜び
    gloss: ユーセフは名前を言って、彼女に会えてうれしいと伝えます。
    note: تشرفنا で名前の交換が締めくくられます。
  ar.a1.unit02.lesson04.teach.line06:
    title: お互いの喜び(返事)
    gloss: ライラも同じ表現を返します。
    note: تشرفنا は片方だけでなく、二人とも自然に口にする表現です。
  ar.a1.unit02.lesson04.teach.line07:
    title: 出身をたずねる
    gloss: ユーセフが彼女の出身をたずねます。
    note: من أين أنت؟ で話題が出身地に移ります。
  ar.a1.unit02.lesson04.teach.line08:
    title: 出身をたずねる(返事)
    gloss: ライラは答えて、彼にたずね返します。
    note: 彼女はここでも وأنت؟ を使っています。前に出てきた省略表現と同じです。
  ar.a1.unit02.lesson04.teach.line09:
    title: 出身を言う
    gloss: ユーセフはレバノンの出身だと言います。
    note: أنا من لبنان は、これまでのレッスンで学んだ型と同じです。
  ar.a1.unit02.lesson04.teach.line10:
    title: 会話を終える
    gloss: ライラは、彼に会えてうれしかったと言います。
    note: سعدت بلقائك は、会話が自然に終わりに近づいていることを示します。
  ar.a1.unit02.lesson04.teach.line11:
    title: 別れのあいさつ
    gloss: ユーセフは、いつでも歓迎すると言って別れのあいさつをします。
    note: دائما(いつも・いつでも)がつくことで、مرحبا بك が「いつでもどうぞ」という誘いになり、そのあと別れの مع السلامة が続きます。
  ar.a1.unit02.lesson04.teach.line12:
    title: 別れのあいさつ(返事)
    gloss: ライラも別れのあいさつをします。
    note: مع السلامة で会話が終わります。a1_unit01 で学びました。
