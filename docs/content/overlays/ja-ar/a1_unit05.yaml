teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: 時刻
    gloss: 時刻/時
    note: الساعة(as-sāʿa)は文字どおり「時間」(時計の意味もあります)で、時刻の答えはこの語で始まります。
    example_gloss: 3時です。
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: 何時ですか？
    gloss: 何時ですか？
    note: كم الساعة؟ は文字どおりには「時間はいくつ？」とたずねています。
    example_gloss: ライラは「何時ですか？」と言いました。
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: 3時
    gloss: 3時です。
    note: الثالثة(ath-thālitha)は女性形の序数「3番目の」で、女性名詞の الساعة に合わせた形です。文字どおりには「3番目の時間」です。
    example_gloss: ライラは「3時です」と言いました。
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: 5時
    gloss: 5時です。
    note: الخامسة(al-khāmisa)は「5番目の(時間)」です。このA1のユニットでは、ちょうどの時刻だけを扱います。
    example_gloss: ライラは「5時です」と言いました。
  ar.a1.unit05.lesson01.teach.sabah:
    title: 朝
    gloss: 朝に
    note: صباحا(ṣabāḥan)を添えると、時刻が午前だとはっきりします。في الصباح も同じ意味です。
    example_gloss: 朝の5時です。
  ar.a1.unit05.lesson01.teach.masaa:
    title: 夕方に
    gloss: 夕方に
    note: مساء(masāʾan)を添えると、時刻が夕方・夜だとはっきりします。في المساء も同じ意味です。
    example_gloss: 夕方の5時です。
  ar.a1.unit05.lesson02.teach.mata:
    title: いつ
    gloss: いつ
    note: متى(matā)は、何かがいつ起こるかをたずねる語です。
    example_gloss: レッスンはいつですか？
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: レッスンはいつですか？
    gloss: レッスンはいつですか？
    note: アラビア語では、この簡単な質問に「〜です」にあたる語を入れません。
    example_gloss: ユーセフは「レッスンはいつですか？」と言いました。
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: レッスンは5時
    gloss: レッスンは5時です。
    note: الساعة は、予定の時刻を言うときにも使えます。
    example_gloss: ライラは「レッスンは5時です」と言いました。
  ar.a1.unit05.lesson02.teach.line01:
    title: 時刻をたずねる
    gloss: ユーセフが時刻をたずねます。
    note: كم الساعة؟ は現在の時刻をたずねる表現です。
    example_gloss: ユーセフは「何時ですか？」と言いました。
  ar.a1.unit05.lesson02.teach.line02:
    title: 時刻を言う
    gloss: ライラは3時だと答えます。
    note: 答えは الساعة で始まります。
    example_gloss: ライラは「3時です」と言いました。
  ar.a1.unit05.lesson02.teach.line03:
    title: 「いつ」とたずねる
    gloss: ユーセフはレッスンがいつかをたずねます。
    note: و は、この質問を前のやりとりにつなげる働きをします。
    example_gloss: ユーセフは「それで、レッスンはいつですか？」と言いました。
  ar.a1.unit05.lesson02.teach.line04:
    title: 予定の時刻を答える
    gloss: ライラはレッスンが5時だと言います。
    note: これは予定を答える言い方です。
    example_gloss: ライラは「レッスンは5時です」と言いました。
