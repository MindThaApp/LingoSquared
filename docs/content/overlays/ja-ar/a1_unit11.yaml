teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: 毎日
    gloss: 毎日
    note: كل يوم(kull yawm)は動詞の後ろに置く(أدرس كل يوم)ことが多いですが、文頭に置く(كل يوم أدرس)こともできます。
    example_gloss: 私は毎日勉強します。
  ar.a1.unit11.lesson01.teach.wake:
    title: 起きます
    gloss: 起きます
    note: أستيقظ(astayqiẓ)は「私は起きます」という意味です。現在形の動詞では、語頭の أ が「私」を表します。السابعة(as-sābiʿa)は時刻での「7」です。
    example_gloss: 7時に目を覚まします。
  ar.a1.unit11.lesson01.teach.study:
    title: 私は勉強します
    gloss: 私は勉強します
    note: أدرس(adrus)は「私は勉強します」という意味で、درس(授業)と同じ語根を持ちます。التاسعة(at-tāsiʿa)は時刻での「9」です。
    example_gloss: 私は9時に勉強します。
  ar.a1.unit11.lesson01.teach.sleep:
    title: 寝ます
    gloss: 私は寝ます/私は床につきます
    note: أنام(anām)は「私は寝ます」という意味で、時刻と一緒に使うと「床につく」という意味になります。العاشرة(al-ʿāshira)は時刻での「10」です。
    example_gloss: 私は10時に寝ます。
  ar.a1.unit11.lesson02.teach.what_do:
    title: 毎日何をしていますか？
    gloss: 毎日何をしていますか？
    note: ماذا(mādhā)は「何」をたずねる語で、تفعل(tafʿal)は男性に言う「あなたはする」です。女性に言うときは تفعلين(tafʿalīn)になります。
    example_gloss: レイラは言いました。「毎日何をしていますか？」
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: 日課の3つの文
    gloss: 私は7時に起きます。9時に勉強します。10時に寝ます。
    note: どの文も「動詞+في الساعة+時刻」の形で、合わせると一日の流れを表せます。
    example_gloss: 毎日、私は7時に起きます。9時に勉強します。10時に寝ます。
  ar.a1.unit11.lesson02.teach.line01:
    title: 日課をたずねる
    gloss: レイラはユースフが毎日何をしているかたずねます。
    note: レイラは男性にたずねているので تفعل と言っています。女性になら ماذا تفعلين كل يوم؟ となります。
    example_gloss: レイラは言いました。「毎日何をしていますか？」
  ar.a1.unit11.lesson02.teach.line02:
    title: 起きる時刻
    gloss: ユースフは7時に起きると言います。
    note: 時刻の前には في الساعة を使います。
    example_gloss: ユースフは言いました。「私は7時に起きます。」
  ar.a1.unit11.lesson02.teach.line03:
    title: 勉強する時刻
    gloss: ユースフは9時に勉強すると言います。
    note: أدرس でも同じ時刻の言い方ができます。
    example_gloss: ユースフは言いました。「私は9時に勉強します。」
  ar.a1.unit11.lesson02.teach.line04:
    title: 寝る時刻
    gloss: ユースフは10時に床につくと言います。
    note: 一日の最後の行動にも、أنام で同じ時刻の言い方を使います。
    example_gloss: ユースフは言いました。「私は10時に寝ます。」
