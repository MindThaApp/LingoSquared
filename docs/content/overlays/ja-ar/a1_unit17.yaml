teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: 痛み
    gloss: 痛み
    note: ألم (alam) は「痛み」という意味で、عندي ألم (ʿindī alam) は「私には痛みがあります」です。
    example_gloss: 痛みがあります。
  ar.a1.unit17.lesson01.teach.head:
    title: 頭
    gloss: 頭
    note: الرأس (ar-raʾs) は「頭」です。アラビア語では عندي ألم في الرأس、つまり「頭に痛みがある」と言います。日本語の「頭が痛い」に近い言い方です。
    example_gloss: 頭に痛みがあります。
  ar.a1.unit17.lesson01.teach.stomach:
    title: おなか
    gloss: お腹
    note: البطن (al-baṭn) は、お腹の辺りを指します。
    example_gloss: お腹に痛みがあります。
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: 頭の痛み
    gloss: 頭が痛いです
    note: عندي ألم は直訳すると「私のもとに痛みがある」で、アラビア語で「痛みがある」と言う方法です。في+体の部分で、痛む場所を表します。
    example_gloss: ライラは「頭が痛いです」と言いました。
  ar.a1.unit17.lesson02.teach.problem_question:
    title: どうしたの？
    gloss: どうしたの？
    note: ما (mā) は「何」とたずねる語で、المشكلة (al-mushkila) は「問題」という意味です。
    example_gloss: どうしたの、ライラ？
  ar.a1.unit17.lesson02.teach.drink:
    title: 水を飲んでください
    gloss: 水を飲んで
    note: اشربي (ishrabī) は女性に向けて言う「飲んで！」という命令の形で、ここではライラに言っています。男性に言うときは اشرب (ishrab) です。
    example_gloss: ユースフは「水を飲んでね」と言いました。
  ar.a1.unit17.lesson02.teach.rest:
    title: 休んでください
    gloss: 休んで
    note: استريحي (istarīḥī) は女性に向けて言う「休んで！」という命令の形で、男性に言うときは استرح (istariḥ) です。
    example_gloss: 今日は休んでください。
  ar.a1.unit17.lesson02.teach.need_help:
    title: 助けが必要です
    gloss: 助けが必要です
    note: أحتاج (aḥtāj) は「私は必要とする」、مساعدة (musāʿada) は「助け」という意味です。إلى を使った أحتاج إلى مساعدة という形も出てきますが、どちらも正しい言い方です。
    example_gloss: 痛みがあります。助けが必要です。
  ar.a1.unit17.lesson02.teach.line01:
    title: 問題をたずねる
    gloss: ユースフはライラにどうしたのかをたずねます。
    note: يا ليلى は、ライラに名前で呼びかける言い方です。
    example_gloss: ユースフは「どうしたの、ライラ？」と言いました。
  ar.a1.unit17.lesson02.teach.line02:
    title: 症状を伝える
    gloss: ライラは頭が痛いと言っています。
    note: 症状をそのまま直接述べています。
    example_gloss: ライラは「頭が痛いです」と言いました。
  ar.a1.unit17.lesson02.teach.line03:
    title: 簡単なアドバイス
    gloss: ユースフはライラに、水を飲んで休むように言います。
    note: ユースフがライラに話しかけているので、2つの命令形はどちらも女性形です。و(wa、「と」「そして」)は次の語にくっつけて書きます：واستريحي。
    example_gloss: ユースフは言いました。「水を飲んで休んでください。」
  ar.a1.unit17.lesson02.teach.line04:
    title: お礼
    gloss: ライラがお礼を言います。
    note: شكرا で短いやりとりが終わります。
    example_gloss: ライラは言いました。「ありがとう。」
