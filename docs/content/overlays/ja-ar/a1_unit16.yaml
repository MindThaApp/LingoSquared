    example_gloss: 列車は5時です。
  ar.a1.unit16.lesson01.teach.to_cairo:
    title: カイロへ
    gloss: カイロへ
    note: القاهرة (al-qāhira)はカイロのことで、إلى (ilā)は目的地を示します。
    example_gloss: カイロ行きの切符がほしいです。
  ar.a1.unit16.lesson01.teach.ticket_request:
    title: 切符がほしいです
    gloss: カイロ行きの切符がほしいです
