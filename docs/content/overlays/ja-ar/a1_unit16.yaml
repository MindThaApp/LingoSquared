    example_gloss: カイロ行きの切符をお願いします。
  ar.a1.unit16.lesson02.teach.platform:
    title: プラットホーム
    gloss: ホーム
    note: الرصيف (ar-raṣīf)は駅のホームのことです。同じ語で歩道の意味もあります。
    example_gloss: ホームはここです。
  ar.a1.unit16.lesson02.teach.second_platform:
    title: 2番ホーム
    gloss: 2番ホーム
    note: الثاني (ath-thānī) は「2番目の」という意味で、男性形です。男性名詞の الرصيف に合わせた形で、形容詞と同じく名詞の後ろに置き、ال も付きます。
    example_gloss: 2番ホームからです。
  ar.a1.unit16.lesson02.teach.which_platform:
    title: どのホーム?
    gloss: どのホームから?
    note: أي (ayy) は「どの」とたずねる語です。
    example_gloss: ライラは「どのホームからですか?」と言いました。
  ar.a1.unit16.lesson02.teach.line01:
    title: ライラが切符を頼む
    gloss: ライラはカイロ行きの切符を頼みます。
    note: من فضلك を付けると、ていねいな頼み方になります。
    example_gloss: ライラは「カイロ行きの切符をお願いします」と言いました。
  ar.a1.unit16.lesson02.teach.line02:
    title: 出発時刻
    gloss: 駅員が列車の時刻を伝えます。
    note: في الساعة は、出発時刻を示すときに使います。
    example_gloss: 駅員は「列車は5時です」と言いました。
  ar.a1.unit16.lesson02.teach.line03:
    title: ホームをたずねる
    gloss: ライラはどのホームかをたずねます。
    note: أي の後ろでは、رصيف に ال は付きません。
    example_gloss: ライラは「どのホームからですか?」と言いました。
  ar.a1.unit16.lesson02.teach.line04:
    title: ホームの答え
    gloss: 駅員は2番ホームだと言います。
    note: من الرصيف الثاني は、ホームの質問に対する答えです。
    example_gloss: 駅員は「2番ホームからです」と言いました。
