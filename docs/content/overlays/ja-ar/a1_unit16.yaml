    title: 切符
    gloss: 切符
    note: تذكرة (tadhkira)は女性名詞です。ة で終わる語はたいてい女性名詞です。
    example_gloss: 切符がほしいです。
  ar.a1.unit16.lesson01.teach.train:
    title: 列車
