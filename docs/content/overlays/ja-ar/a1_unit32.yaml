    title: パーティーでは誰が何をする？
    gloss: 土曜日はサラの誕生日です。パーティーでお祝いします。ユースフはカリームとレイラをパーティーに招待します。カリームは友だちとお祝いするのが大好きです。レイラもパーティーに来ます。みんながサラのために喜んでいます。
    note: パーティーの計画を振り返り、学業の単元と同じ比較読解の形式でまとめています。
    glosses:
      السبت: 土曜日
      ميلاد: 誕生(「誕生日」の「誕生」)
      نحتفل: 祝う
      بحفلة: パーティー
      يدعو: 招待します
      إلى: 〜へ(「パーティーに招待する」の「に」にあたる部分)
      الاحتفال: 祝います
      يحب: ～するのが好き
      الأصدقاء: 友達
      ستأتي: 来ます
      الجميع: みんな
      سعداء: うれしい
  ar.a1.unit32.lesson05.teach.ywsf_ydaw_krym:
