teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: 衣類
    gloss: 服
    note: ملابس (malābis) は「服」を表す複数名詞です。
    example_gloss: 服がほしいです。
  ar.a1.unit21.lesson01.teach.shirt:
    title: シャツ
    gloss: シャツ
    note: قميص (qamīṣ) は「シャツ」の意味です。أريد の後では目的語の語尾 -an がつき、قميصا (qamīṣan) になります。
    example_gloss: シャツがほしいです。
  ar.a1.unit21.lesson01.teach.blue:
    title: 青い
    gloss: 青い
    note: أزرق (azraq) は男性形で、قميص に合わせています。女性名詞には زرقاء (zarqāʾ) を使います。أريد の後でも、أزرق には余分なアリフはつきません：قميصا أزرق。
    example_gloss: 青いシャツがほしいです。
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: 青いシャツ
    gloss: 青いシャツ
    note: アラビア語では、色は物の後ろに来ます：قميصا أزرق (qamīṣan azraq)。
    example_gloss: 青いシャツがほしいです。
  ar.a1.unit21.lesson02.teach.size:
    title: サイズ
    gloss: サイズ
    note: مقاس (maqās) は「サイズ」の意味です。ما المقاس؟ (mā l-maqās) はサイズをたずねる表現です。
    example_gloss: サイズはいくつですか？
  ar.a1.unit21.lesson02.teach.medium:
    title: Mサイズ
    gloss: 中サイズ
    note: متوسط (mutawassiṭ) は「中くらいの」の意味です。بـ (bi-、「~の」「~で」) を使うと品物につなげられます：قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ)、中サイズのシャツ。
    example_gloss: 中サイズのシャツがほしいです。
  ar.a1.unit21.lesson02.teach.price:
    title: 10ディルハム
    gloss: 10ディルハム
    note: بعشرة (bi-ʿashara) は「10で」の意味です。買い物の課と同じく、接頭辞 بـ が値段を表します。
    example_gloss: そのシャツは10ディルハムです。
  ar.a1.unit21.lesson02.teach.line01:
    title: 品物を頼む
    gloss: レイラは青いシャツを頼みます。
    note: من فضلك を添えると、丁寧な依頼になります。
    example_gloss: レイラは「青いシャツをお願いします」と言いました。
  ar.a1.unit21.lesson02.teach.line02:
    title: サイズをたずねる
    gloss: 店員はサイズをたずねます。
    note: 店員がサイズをたずねています：ما المقاس؟
    example_gloss: 店員は「サイズは？」と言いました。
  ar.a1.unit21.lesson02.teach.line03:
    title: サイズを伝える
    gloss: レイラは中サイズだと言います。
    note: サイズの質問に、そのまま答えています。
    example_gloss: レイラは「中サイズです」と言いました。
  ar.a1.unit21.lesson02.teach.line04:
    title: 品物と値段を伝える
    gloss: 店員はシャツを渡して、値段を伝えます。
    note: تفضلي (tafaḍḍalī) は、女性に物を渡すときに言います。男性には تفضل (tafaḍḍal) と言います。
    example_gloss: 店員は「どうぞ。そのシャツは10ディルハムです」と言いました。
