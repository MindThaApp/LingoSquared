    - サーラは水泳をします。
  ar.a1.unit28.lesson01.teach.ma_alryada_alty:
    title: どんなスポーツをしますか？
    gloss: どんなスポーツをしますか？
  ar.a1.unit28.lesson01.teach.alab_kra_alqdm:
    title: 私はサッカーをします
    gloss: 私はサッカーをします。
    note: ألعب (alʿab) は球技に使う動詞です：ألعب كرة القدم (alʿab kurat al-qadam)。كرة القدم は直訳すると「足のボール」です。
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: スポーツの動詞：أمارس と ألعب
    gloss: ほとんどのスポーツの前には أمارس (umāris、私はする)を使います：أمارس اليوغا (umāris al-yūghā)、أمارس الركض (umāris ar-rakḍ)、أمارس السباحة (umāris as-sibāḥa)。球技には ألعب (alʿab、私はプレーする)を使います：ألعب كرة القدم。
    note: أمارس (umāris) はほとんどのスポーツに使えますが、球技には ألعب (alʿab) を使うので、動詞はスポーツといっしょに覚えましょう。
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: 週に～回
    gloss: 週に～回
    example_gloss: 私は週に2回ヨガをします。
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: 週に～回
    gloss: كثيرا (kathīran) や كل يوم (kull yawm) は大まかな言い方で、مرتين في الأسبوع (marratayn fī al-usbūʿ) は頻度を正確に表します。مرتين は مرة (marra、回)の双数形です。
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
    title: 私は週に2回ヨガをします
    gloss: 私は週に2回ヨガをします。
  ar.a1.unit28.lesson02.teach.ywsf_ylab_kra:
    title: ユースフはよくサッカーをします
    gloss: ユースフはよくサッカーをします。
    note: يلعب (yalʿab) は「彼はプレーする」という意味で、語頭の ي (ya-) が「彼」を表します。كثيرا (kathīran) は「よく」という意味です。
  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: スポーツの話し方、2通り
    gloss: أمارس الرياضة (umāris ar-riyāḍa) はスポーツ全般について話す言い方で、أمارس اليوغا (umāris al-yūghā) は具体的なスポーツ名を挙げる言い方です。どちらも正しい表現です。
    note: رياضة (riyāḍa) は女性名詞で、اليوغا (al-yūghā) は ال が付いたスポーツ名です。
  ar.a1.unit28.lesson03.teach.mmarsa_alryada:
    title: 運動する
    gloss: 運動する／スポーツをする
    example_gloss: 私は毎日運動します。
  ar.a1.unit28.lesson03.teach.hb_alsbaha:
    title: 泳ぐことが大好きである
    gloss: 泳ぐことが大好きである
    example_gloss: サーラは水泳が好きです。
  ar.a1.unit28.lesson03.teach.sara_thb_alsbaha:
    title: サーラは水泳が好きです
    gloss: サーラは水泳が好きです。
    note: تحب (tuḥibb) は「彼女は好む」という意味で、語頭の ت (ta-) が「彼女」を表します。السباحة (as-sibāḥa) は太陽文字で始まるので、as-sibāḥa と書きます。
  ar.a1.unit28.lesson04.teach.ywsf_hl_trkd:
    title: ユースフがカリームに尋ねる
    gloss: ユースフ：カリーム、よく走るの？
  ar.a1.unit28.lesson04.teach.krym_nam_arkd:
    title: カリームが答える
    gloss: カリーム：うん、毎週2回走るよ。
  ar.a1.unit28.lesson04.teach.ywsf_ayn_trkd:
    title: ユースフが場所を尋ねる
    gloss: ユースフ：どこで走るの？
  ar.a1.unit28.lesson04.teach.krym_fy_alhdyqa:
    title: カリームが場所を答える
    gloss: カリーム：公園だよ、家の近くの。
  ar.a1.unit28.lesson04.teach.ytghyr_alfal_ma:
    title: 動詞は人称によって変わる
    gloss: 動詞は主語の人称によって変わります：أنا أركض (anā arkuḍ)、كريم يركض (karīm yarkuḍ)、أنت تركض (anta tarkuḍ)。
    note: 動詞の最初の文字が主語を表します：أ (a-) は「私」、ي (ya-) は「彼」、ت (ta-) は「あなた」または「彼女」です。
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: ユースフの反応
    gloss: ユースフ：いいね、僕はそこでよくサッカーをするよ。
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: ライラとサーラのスポーツの話
    gloss: ライラは週に2回ヨガをします。静かに体を動かすのが好きです。サーラはヨガはしませんが、水泳が好きです。サーラはよく、ほぼ毎週泳ぎます。あなたはどんなスポーツをしていますか。
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) と سارة تسبح (sāra tasbaḥ) では、どちらも女性なので ت (ta-) で始まる動詞を使います。動詞の前に لا を置くと否定になります。
    glosses:
      تمارس: する
      مرتين: 2回(二度)
      الأسبوع: 週
      اليوغا: ヨガ
      تحب: 大好きである
      بهدوء: 穏やかに
      تتحرك: 動く
      السباحة: 泳ぐこと
      تسبح: 泳ぐ
      كثيرا: よく
      تقريبا: ほとんど
      ما: どの
      الرياضة: スポーツ
  ar.a1.unit28.lesson05.teach.sara_tsbh_kthyra:
    title: サーラはよく、ほぼ毎週泳ぎます
    gloss: サーラはよく、ほぼ毎週泳ぎます。
  ar.a1.unit28.lesson05.teach.alab_kra_alqdm:
    title: 私はサッカーをします。サッカーが大好きです
    gloss: 私はサッカーをします。サッカーが大好きです
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  ar.a1.unit28.lesson06.teach.lyla_hl_nmars:
    title: ライラが提案する
    gloss: ライラ：いっしょに運動しませんか。
  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: いっしょにしようと誘う
    gloss: いっしょにしようと誘うときは、هل (hal) +「私たち」の動詞を使います：هل نتمشى؟ (hal natamashshā?)、هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?)。
    note: 予定についての課で学んだ、何かを一緒にしようと提案する構文をそのまま使っています。
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: サーラが賛成する
    gloss: サーラ：うん、いいね！水泳が好きなの。
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
    title: ユースフはサッカーがいい
    gloss: ユースフ：僕はサッカーをするほうがいいな。
  ar.a1.unit28.lesson06.teach.krym_wana_ahb:
    title: カリームはランニングが好き
    gloss: カリーム：僕は走るのが好きだよ。
  ar.a1.unit28.lesson06.teach.lyla_idhn_nmars:
    title: ライラが会話を締めくくる
    gloss: ライラ：じゃあ、今週は4人でいっしょに運動しましょう！
    note: このユニットに出てくる4人全員のスポーツの好みをまとめています。
