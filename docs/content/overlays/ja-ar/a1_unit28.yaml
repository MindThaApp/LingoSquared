course:
  title: アラビア語 A1
  description: スポーツや運動について話す初級アラビア語です。身近なスポーツの名前、頻度の言い方、動詞 أمارس (umāris) と ألعب (alʿab)、そして一緒に運動する約束の仕方を学びます。
