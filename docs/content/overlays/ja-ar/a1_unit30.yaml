  ar.a1.unit30.lesson01.teach.astkhdm_hatfy_kl:
    title: 私は毎日携帯電話を使います
    gloss: 私は毎日、携帯電話を使います。
    note: أستخدم (astakhdim)は「私は使う」という意味です。هاتفي の末尾の ي は「私の」を表します。
  ar.a1.unit30.lesson02.teach.alttbyq:
    title: アプリ
    gloss: アプリ
    example_gloss: 私は天気予報のアプリを持っています。
  ar.a1.unit30.lesson02.teach.alrsala:
    title: メッセージ
    gloss: メッセージ
    example_gloss: アプリでメッセージを送ります。
  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: メッセージ：送る・読む
    gloss: رسالة (risāla)は、送る(أرسل رسالة, ursil risāla)または読む(أقرأ رسالة, aqraʾ risāla)「メッセージ」という意味です。
    note: この新しい単語を、天気予報の文章や、人々が送ったり読んだりするメッセージと結びつけます。
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: レイラがアプリでメッセージを送る
    gloss: レイラはアプリでメッセージを送ります。
    note: ترسل (tursil)は「彼女は送る」という意味で、語頭の ت (ta-)が「彼女」を表します。عبر (ʿabra)は「~を通じて」という意味です。
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: ユスフがメッセージを読む
    gloss: ユスフはメッセージを読みます。
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: 調べる
    gloss: 調べる
    example_gloss: 私は天気予報を調べます。
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: عن を伴う動詞
    gloss: 動詞 أبحث (abḥath)には عن (ʿan)が続きます：أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs)。一方、أستخدم (astakhdim)は目的語がそのまま続きます：أستخدم هاتفي。
    note: عن (ʿan)は「~について」「~を」といった意味です。アラビア語の動詞はそれぞれ決まった前置詞を取るので、セットで覚えましょう。
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: カリームが天気予報を調べる
    gloss: カリームは天気予報を調べます。
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: それから彼はジョギングをします
    gloss: その後、彼はジョギングに行きます。
    note: ثم (thumma) は「それから」という意味の独立した単語で、و のようにつなげて書きません。يذهب للركض (yadhhab li-r-rakḍ) は「走りに行く」という意味です。ل + الركض が للركض になります。
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: レイラの提案
    gloss: レイラ：土曜日の10時に運動しませんか？
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: ユースフの賛成
    gloss: ユースフ：いい考えですね！天気予報を調べます。
    note: فكرة جيدة (fikra jayyida)：名詞 فكرة が女性形なので、形容詞 جيدة も同じく ة で終わります。سأبحث (sa-abḥath) は未来形で、س + أبحث です。
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: ユースフが天気を確認する
    gloss: ユースフ：土曜日は晴れですよ！
    note: الجو مشمس (al-jaww mushmis) は「天気は晴れです」という意味で、「です」にあたる語は入りません。مشمس は الجو に合わせて男性形です。
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: カリームがメッセージを見る
    gloss: カリーム：メッセージを見ました。土曜日にまた会いましょう！
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + 曜日など
    gloss: إلى اللقاء (ilā al-liqāʾ、さようなら)はもう知っていますね。あとに曜日などを付けることもできます：إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt、土曜日にまた)、إلى اللقاء غدا (ilā al-liqāʾ ghadan、明日また)。
    note: あいさつの単元で学んだ別れの表現を、特定の日を示す形に広げます。
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: 誰が何を使いますか？
    gloss: レイラは毎日ユースフに電話します。アプリではなく、携帯電話を使います。ユースフは家にパソコンがありませんが、携帯電話でインターネットを使います。カリームは毎朝、天気予報を調べます。それから走りに行きます。サーラはよくレイラにメッセージを送ります。あなたも毎日携帯電話を使いますか？
    note: 4人の機器の使い方を比較する、スポーツの単元と同じ形式の読解です。
    glosses:
      تتصل: 電話をする
      كل: 毎～
      يوم: 日
      تستخدم: 使う
      هاتفها: 携帯電話
      تطبيقا: アプリ
      حاسوب: パソコン
      البيت: 自宅で
      الإنترنت: インターネット
      يبحث: 調べる
      صباح: 朝
      توقعات: 予報(天気予報)
      يذهب: 行く
      للركض: 走りに
      ترسل: 送る
      كثيرا: よく
      رسالة: メッセージ
      تستعمل: 使う
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: カリームは毎朝予報を調べる
    gloss: カリームは毎朝、天気予報を調べます。
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: サーラはよくレイラにメッセージを送る
    gloss: サーラはよくレイラにメッセージを送ります。
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: レイラが計画を確認する
    gloss: レイラ：メッセージを見ました。土曜日の10時に公園で運動しませんか？
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: ユースフが天気を確認する
    gloss: ユースフ：はい、それに土曜日は晴れですよ！
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: カリームの予定
    gloss: カリーム：じゃあ、僕は走ります。そのあと、サッカーもします。
    note: سأركض (sa-arkuḍ) は「走ります」という意味で、س が未来を表します。بعد ذلك (baʿda dhālik) は「そのあと」という意味です。
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: サーラの予定
    gloss: サーラ：私は水泳のほうが好きですが、公園にも行きます。
    note: أفضل (ufaḍḍil) は「私は〜のほうが好きです」という意味です。لكنني (lākinnanī) は「でも私は」、سآتي (sa-ātī) は「私は来ます」という意味です。
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: レイラが会話を締めくくる
    gloss: レイラ：いいですね！土曜日に公園で会いましょう！
    note: この一文で、この単元のメッセージのやり取りと、スポーツの単元で立てた予定の両方を締めくくります。
