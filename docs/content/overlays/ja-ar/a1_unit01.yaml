    title: あいさつと別れの言葉
lessons:
  ar.a1.unit01.lesson01.script_ramp:
    title: はじめてのアラビア語を読んでみよう
  ar.a1.unit01.lesson02.everyday_greetings:
    title: 日常のあいさつ
  ar.a1.unit01.lesson03.time_and_farewells:
    title: 一日のあいさつと別れのあいさつ
  ar.a1.unit01.lesson04.wellbeing_exchange:
    title: 相手の調子をたずねる
teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: アラビア語は右から左へ
    gloss: アラビア語は右から左へ書きます。
    note: アラビア語は右端から左へ向かって読みます。
  ar.a1.unit01.lesson01.teach.mim:
    title: 文字 م
    gloss: m
    note: م は m の音を表し、単語の中での位置によって形が変わります。
  ar.a1.unit01.lesson01.teach.ra:
    title: 文字 ر
    gloss: r
    note: ر は巻き舌の r の音を表し、後ろの文字とはつながりません。
  ar.a1.unit01.lesson01.teach.ha:
    title: 文字 ح
    gloss: ḥ
    note: ح は喉の奥から息を摩擦させて出す h の音で、日本語のハ行の音とは違います。
  ar.a1.unit01.lesson01.teach.ba:
    title: 文字 ب
    gloss: b
    note: ب は b の音を表し、前後の文字とつながります。
  ar.a1.unit01.lesson01.teach.alef:
    title: 文字 ا
    gloss: ā / a
    note: ا は長母音 ā を表し、次の文字とはつながりません。
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: مرحبا を組み立てよう
    gloss: こんにちは
    note: مرحبا は marḥaban と読みます。アラビア語の表記では、短母音ふつう書きません。
    example_gloss: こんにちは！私はサラです。
  ar.a1.unit01.lesson02.teach.marhaba:
    title: こんにちは
    gloss: こんにちは
    note: مرحبا は温かみのある万能のあいさつで、ほとんどどんな場面でも使えます。
    example_gloss: やあ、元気ですか？
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: おはようございます
    gloss: おはようございます
    note: صباح الخير は ṣabāḥ al-khayr と読み、直訳は「よきことの朝」です。
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: こんにちは・こんばんは(午後〜夕方)
    gloss: こんにちは / こんばんは
    note: مساء الخير は masāʾ al-khayr と読み、午後遅くから夜にかけて使います。
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: さようなら
    gloss: さようなら
    note: مع السلامة は maʿa as-salāma と読み、直訳は「無事とともに」。一般的な別れのあいさつです。
    example_gloss: ありがとう、さようなら！
  ar.a1.unit01.lesson02.teach.shukran:
    title: ありがとう
    gloss: ありがとう
    note: شكرا は shukran と読み、どんな場面でも使えます。
    example_gloss: どうもありがとうございます。
  ar.a1.unit01.lesson02.teach.afwan:
    title: どういたしまして
    gloss: どういたしまして
    note: عفوا(ʿafwan)は شكرا に対する決まった返事です。場面が違えば「すみません」の意味にもなります。
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: おやすみなさい
    gloss: おやすみなさい
    note: تصبح على خير(tuṣbiḥ ʿalā khayr)は、夜に別れるときや寝る前に言う表現で、最初のあいさつではありません。تصبح は男性に対する形で、女性には تصبحين على خير(tuṣbiḥīna ʿalā khayr)と言います。
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: ようこそ
    gloss: ようこそ
    note: أهلا وسهلا(ahlan wa sahlan)は、客を迎えるときや、到着した人を温かく迎えるときに使います。
    example_gloss: ようこそ！ようこそいらっしゃいました。
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: ではまた
    gloss: ではまた / また会うときまで
    note: إلى اللقاء(ilā al-liqāʾ)は、きちんとした中立的な別れのあいさつです。
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: おはようの返事
    gloss: おはよう(返事)
    note: صباح النور(ṣabāḥ an-nūr、「光の朝」)は、صباح الخير に対する決まった返事です。
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: こんばんはの返事
    gloss: こんばんは(返事)
    note: مساء النور(masāʾ an-nūr)は、مساء الخير に対する決まった返事です。
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: よい一日を
    gloss: よい一日を
    note: يوما سعيدا(yawman saʿīdan)は、別れ際に添える温かい一言です。
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: お元気ですか？
    gloss: お元気ですか？
    note: كيف حالك؟(kayfa ḥāluk)は、相手の調子をたずねる標準的な言い方です。母音記号を付けない表記なら、相手が誰でも同じ形で使えます。
  ar.a1.unit01.lesson04.teach.gender_note:
    title: 男性への「あなた」と女性への「あなた」
    gloss: あなた(男性)/ あなた(女性)
    note: アラビア語の話し言葉では、أنتَ(anta、男性に)と أنتِ(anti、女性に)を区別し、حالَك と حالِك も同じように区別します。ここに示した母音記号がなければ、このコースで使う表記は男女どちらも同じ形になります。
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: 元気です
    gloss: 元気 / 良好
    note: بخير(bikhayr)は、كيف حالك؟ に対する標準的な肯定の答えです。
    example_gloss: 今日は元気です。
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: おかげさまで
    gloss: おかげさまで / 神に感謝します
    note: الحمد لله(al-ḥamdu lillāh)は、話し手自身の信仰に関係なく、答えで بخير のあとによく続けられます。日本語の「おかげさまで」のように、会話の自然な締めくくりとして働きます。
    example_gloss: 元気です、おかげさまで。
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: あなたは？
    gloss: あなたは？
    note: وأنت؟(男性には wa anta、女性には wa anti)は、同じ質問を相手に返す言い方です。母音記号なしの表記は男女で同じです。
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: 最高です
    gloss: 最高 / すばらしい
    note: ممتاز(mumtāz)は、بخير より熱のこもった言い方です。
    example_gloss: 今日は絶好調です！
  ar.a1.unit01.lesson04.teach.la_bas:
    title: 悪くないです
    gloss: 悪くない
    note: لا بأس(lā baʾs)は、不満ではない、ほどほどの自然な答えです。
