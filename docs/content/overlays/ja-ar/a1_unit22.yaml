teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: 気持ち
    gloss: 気持ち
    note: شعور (shuʿūr) は「気持ち」の意味です。
    example_gloss: これは気持ちです。
  ar.a1.unit22.lesson01.teach.happy:
    title: うれしい
    gloss: うれしい
    note: سعيد (saʿīd) は男性について言う形です。女性は أنا سعيدة (anā saʿīda) と言います。
    example_gloss: 私はうれしいです。
  ar.a1.unit22.lesson01.teach.sad:
    title: 悲しい
    gloss: 悲しい
    note: حزين (ḥazīn) は男性について言う形です。女性は أنا حزينة (anā ḥazīna) と言います。
    example_gloss: 私は悲しいです。
  ar.a1.unit22.lesson01.teach.because:
    title: なぜなら
    gloss: なぜなら／～なので
    note: لأن (li-anna) は理由を導く言葉で、「~なので」の意味です。
    example_gloss: 天気が晴れているので、うれしいです。
  ar.a1.unit22.lesson02.teach.how_feel:
    title: 気分はどうですか
    gloss: ご気分はいかがですか？
    note: كيف تشعر؟ (kayfa tashʿur) は男性に気分をたずねる表現です。女性には كيف تشعرين؟ (kayfa tashʿurīn) と言います。
    example_gloss: ユースフ、気分はどう?
  ar.a1.unit22.lesson02.teach.tired:
    title: 疲れた
    gloss: 疲れた
    note: متعب (mutʿab) は男性について、متعبة (mutʿaba) は女性について言う形です。そのためレイラは أنا متعبة と言います。
    example_gloss: 私は疲れています。
  ar.a1.unit22.lesson02.teach.okay:
    title: 大丈夫
    gloss: 大丈夫
    note: بخير (bi-khayr) は「大丈夫」の意味で、直訳すると「よい状態で」です。
    example_gloss: 大丈夫ですか?
  ar.a1.unit22.lesson02.teach.line01:
    title: 気分をたずねる
    gloss: ライラはユースフに気分をたずねます。
    note: يا (yā) は、呼びかける相手の名前の前に置きます。
    example_gloss: ライラは「ユースフ、気分はどう?」と言いました。
  ar.a1.unit22.lesson02.teach.line02:
    title: 気持ちと理由
    gloss: ユースフは、天気が晴れているのでうれしいと言います。
    note: この文は、気持ちとその理由の両方を述べています。
    example_gloss: ユースフは「天気が晴れているのでうれしいです」と言いました。
  ar.a1.unit22.lesson02.teach.line03:
    title: 別の気持ち
    gloss: ライラは、仕事があるので疲れていると言います。
    note: متعبة は話し手のライラ(女性)に合わせた形です。
    example_gloss: ライラは「仕事があるので疲れています」と言いました。
  ar.a1.unit22.lesson02.teach.line04:
    title: 様子を確かめる
    gloss: ユースフはライラに大丈夫かどうかたずねます。
    note: هل (hal) は「はい・いいえ」で答える疑問文を作ります。ユースフはライラ(女性)にたずねているので、أنت は「アンティ」(anti)と読みます。男性に対しては「アンタ」(anta)です。
    example_gloss: ユースフは「大丈夫ですか?」と言いました。
  ar.a1.unit22.lesson02.teach.line05:
    title: 「はい」と言う
    gloss: ライラは「はい」と答え、お礼を言います。
    note: نعم は「はい」という返事です。
    example_gloss: ライラは「はい、ありがとう」と言いました。
exercises:
  ar.a1.unit22.lesson01.exercise01.recognize_happy:
    instruction: 意味を選んでください。
    correct_option: うれしい
    distractors:
    - 悲しい
    - 疲れた
    - 寒い
    accepted_answers:
    - value: うれしい
      status: correct
    feedback: سعيد は「うれしい、幸せな」という意味です。
  ar.a1.unit22.lesson01.exercise02.listen_happy_cause:
    instruction: 音声を聞いて、聞こえたものを選んでください。
    correct_option: 天気が晴れているので、うれしいです。
    distractors:
    - 仕事があるので、悲しいです。
    - 授業があるので、疲れています。
    - 大丈夫ですか?
    accepted_answers:
    - value: 天気が晴れているので、うれしいです。
      status: correct
    feedback: 聞こえた文は أنا سعيد لأن الجو مشمس です。
  ar.a1.unit22.lesson01.exercise03.match_feelings:
    instruction: 気持ちを表すアラビア語の単語を、それぞれ意味に結びつけましょう。
    accepted_answers:
    - value:
        شعور: 気持ち
        سعيد: うれしい
        حزين: 悲しい
        لأن: なぜなら
        أنا: 私
        الجو: 天気
      status: correct
    feedback: これらの単語は、気持ちを表したり、理由を述べたりするときに使います。
    pairs:
    - left: شعور
      right: 気持ち
    - left: سعيد
      right: うれしい
    - left: حزين
      right: 悲しい
    - left: لأن
      right: なぜなら
    - left: أنا
      right: 私
    - left: الجو
      right: 天気
  ar.a1.unit22.lesson01.exercise04.order_happy_cause:
    instruction: 「天気が晴れているので、うれしいです」になるように、アラビア語の単語を並べ替えましょう。
    accepted_answers:
    - value:
      - أنا
      - سعيد
      - لأن
      - الجو
      - مشمس
      status: correct
    feedback: أنا سعيد لأن الجو مشمس は、気持ちと理由を述べる文です。
  ar.a1.unit22.lesson01.exercise05.write_feeling_cause:
    instruction: 気持ちと理由を述べる次のアラビア語の文を、そのまま入力しましょう:天気が晴れているので、うれしいです。
    accepted_answers:
