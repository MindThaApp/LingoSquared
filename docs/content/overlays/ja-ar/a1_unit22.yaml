    feedback: أنا سعيد لأن الجو مشمس が求められている文です。女性が書くときは أنا سعيدة لأن الجو مشمس となります。
    prompt_blocks:
    - 次のアラビア語の「気持ちと理由」の文を、そのとおりに入力してください:天気が晴れているので、うれしいです。
