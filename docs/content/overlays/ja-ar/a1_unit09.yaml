teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: 場所
    gloss: 場所
    note: مكان(makān)は「場所」を表す一般的な言葉です。هذا(これ)は数字のユニットで学びました。
    example_gloss: これは場所です。
  ar.a1.unit09.lesson01.teach.library:
    title: 図書館
    gloss: 図書館
    note: مكتبة(maktaba)は「図書館」も「書店」も意味しますが、ここでは図書館です。المكتبة(al-maktaba)は「その図書館」です。
    example_gloss: 図書館はここにあります。
  ar.a1.unit09.lesson01.teach.market:
    title: 市場
    gloss: 市場
    note: سوق(sūq)は「市場」という意味で、السوق(as-sūq)は「その市場」です。
    example_gloss: 市場はここにあります。
  ar.a1.unit09.lesson01.teach.cafe:
    title: カフェ
    gloss: カフェ
    note: مقهى (maqhā) は「カフェ」という意味で、قهوة(コーヒー)と同じ語根の語です。المقهى (al-maqhā) は「そのカフェ」です。
    example_gloss: カフェはここです。
  ar.a1.unit09.lesson01.teach.here:
    title: ここ
    gloss: ここ
    note: هنا (hunā) は、ふつう場所を表す語のあとに置きます。المقهى هنا は「カフェはここです」という意味です。この文では、「です」にあたる語はアラビア語には要りません。
    example_gloss: カフェはここです。
  ar.a1.unit09.lesson02.teach.where_library:
    title: 図書館はどこですか。
    gloss: 図書館はどこですか。
    note: أين (ayna) は「どこ」とたずねる語です。من أين أنت؟(どちらの出身ですか)で出てきました。
    example_gloss: ユースフは「図書館はどこですか」と言いました。
  ar.a1.unit09.lesson02.teach.near:
    title: 近く
    gloss: ~の近く
    note: قرب (qurba) は「近く」という意味で、基準になる場所の前に置きます。قرب المكتبة は「図書館の近く」です。بالقرب من (bi-l-qurbi min) も同じ意味です。
    example_gloss: カフェは図書館の近くにあります。
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: 図書館は市場の近くです
    gloss: 図書館は市場の近くです
    note: ここでは、「です」にあたる別の語はアラビア語には要りません。
    example_gloss: ライラは「図書館は市場の近くです」と言いました。
  ar.a1.unit09.lesson02.teach.line01:
    title: 場所をたずねる
    gloss: ユースフは図書館がどこかをたずねています。
    note: أين は場所をたずねる文の最初に置きます。
    example_gloss: ユースフは「図書館はどこですか」と言いました。
  ar.a1.unit09.lesson02.teach.line02:
    title: 図書館の場所を答える
    gloss: ライラは、図書館はここで市場の近くだと言っています。
    note: هنا と قرب は一緒に使えます。「ここ、市場の近く」という意味になります。
    example_gloss: ライラは「図書館はここ、市場の近くです」と言いました。
  ar.a1.unit09.lesson02.teach.line03:
    title: カフェの場所をたずねる
    gloss: ユースフはカフェがどこかをたずねています。
    note: و (wa、「そして」)は次の語につなげて書きます。وأين (wa-ayna) は「では、どこ」という意味です。
    example_gloss: ユースフは「じゃあ、カフェはどこですか」と言いました。
  ar.a1.unit09.lesson02.teach.line04:
    title: カフェの場所を答える
    gloss: ライラは、カフェは図書館の近くだと言っています。
    note: 場所+قرب+もう一つの場所。المقهى قرب المكتبة は「カフェは図書館の近くです」という意味です。
    example_gloss: ライラは「カフェは図書館の近くです」と言いました。
