    title: レイラが荷物を送る
    gloss: レイラはベイルートの祖父母に送る荷物を持っています。郵便局で切手を買います。荷物に住所を書きます。荷物は明日届きます。手紙は三日かかります。
    note: 荷物についての短い文章です。動詞は主語に合わせます。男性名詞なら الطرد يصل (aṭ-ṭard yaṣil)、女性のレイラなら ليلى تشتري (Layla tashtarī) となります。
    glosses:
      طرد: 荷物
      لجدها: 彼女の祖父に
      وجدتها: そして彼女の祖母
      تشتري: 買います
      طابعا: 切手
      البريد: 郵便局(郵便)
      تكتب: 書きます
      العنوان: 住所
      يصل: 届く(男性形の動詞)
      غدا: 明日
      إليهما: 彼ら(二人)に。動詞とこの語を合わせて「二人のところに届く」という意味になります
      الرسالة: 手紙
      تستغرق: （一定の時間が）かかります
      ثلاثة: '3'
      أيام: 日
