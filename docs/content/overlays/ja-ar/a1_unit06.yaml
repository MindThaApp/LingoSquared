teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: 家族
    gloss: 家族
    note: عائلة(ʿāʾila)は「家族」を表す一般的な語です。例文の هذه は هذا(これ)の女性形で、عائلة が女性名詞なので使われています。
    example_gloss: これは家族です。
  ar.a1.unit06.lesson01.teach.father:
    title: 父
    gloss: 父
    note: أب(ab)は「父」という意味です。
    example_gloss: 私には父がいます。
  ar.a1.unit06.lesson01.teach.mother:
    title: 母
    gloss: 母
    note: أم(umm)は「母」という意味です。
    example_gloss: 私には母がいます。
  ar.a1.unit06.lesson01.teach.brother:
    title: 兄・弟
    gloss: 兄／弟
    note: أخ(akh)は「兄・弟」という意味です。アラビア語では年上か年下かを区別しません。
    example_gloss: 私には兄(弟)がいます。
  ar.a1.unit06.lesson01.teach.sister:
    title: 姉・妹
    gloss: 姉／妹
    note: أخت(ukht)は「姉・妹」という意味です。アラビア語では年上か年下かを区別しません。
    example_gloss: 私には兄(弟)と姉(妹)がいます。
  ar.a1.unit06.lesson01.teach.i_have:
    title: 私は~を持っています
    gloss: 私には~がいる・ある
    note: عندي(ʿindī、直訳は「私のところに」)は、「~がある・いる」を言うときのA1向けの簡単な表現です。لدي(ladayya)はよりあらたまった言い方です。
    example_gloss: 私には姉(妹)がいます。
  ar.a1.unit06.lesson02.teach.in_family:
    title: あなたの家族に
    gloss: あなたの家族に
    note: ここの من は man(「誰」)で、من أين أنت؟ の min(「~から」)ではありません。表記は同じです。عائلتك は「あなたの家族」で、男性に対しては ʿāʾilatuka、女性に対しては ʿāʾilatuki と読みます。
    example_gloss: あなたの家族には誰がいますか。
  ar.a1.unit06.lesson02.teach.sister_name:
    title: 彼女の名前はヌールです
    gloss: 彼女の名前はヌール
    note: اسمها は「彼女の名前」という意味です。
    example_gloss: ユースフは「彼女の名前はヌールです」と言いました。
  ar.a1.unit06.lesson02.teach.line01:
    title: 家族についてたずねる
    gloss: ライラはユースフの家族に誰がいるかをたずねています。
    note: ここの من(man)は「誰」の意味です。يا يوسف は名前を呼んで話しかける言い方です。
    example_gloss: ライラは「ユースフ、あなたの家族には誰がいますか」と言いました。
  ar.a1.unit06.lesson02.teach.line02:
    title: 家族を紹介する
    gloss: ユースフは、父と母と姉(妹)がいると言っています。
    note: و は家族の名前をつなぎます。
    example_gloss: ユースフは「父と母と姉(妹)がいます」と言いました。
  ar.a1.unit06.lesson02.teach.line03:
    title: 姉(妹)の名前をたずねる
    gloss: ライラはユースフの姉(妹)の名前をたずねています。
    note: أختك は「あなたの姉(妹)」で、男性に対しては ukhtuka、女性に対しては ukhtuki と読みます。ここではライラがユースフにたずねているので ukhtuka です。
    example_gloss: ライラは「あなたの姉(妹)の名前は何ですか」と言いました。
  ar.a1.unit06.lesson02.teach.line04:
    title: 彼女の名前を答える
    gloss: ユースフは、彼女の名前はヌールだと言っています。
    note: 語尾の ـها は「彼女の」という意味です。اسمها(ismuhā)は「彼女の名前」です。
    example_gloss: ユースフは「彼女の名前はヌールです」と言いました。
