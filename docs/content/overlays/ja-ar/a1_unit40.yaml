    title: 火事についての文章
    gloss: 図書館の言語カフェで火事が起きています。スタッフが言います。「非常口へ行ってください！」ヌールは助けが必要です。ライラはヌールと一緒にいます。ユースフは消防に電話します。みんな外にいます。よかったです！
    note: 現在形で火事の場面を短くまとめた文章です。動詞に注目しましょう。الموظف يقول(スタッフが言う)は男性なので ي で始まり、نور تحتاج(ヌールが必要とする)は女性なので ت で始まります。
    glosses:
      مقهى: カフェ
      المكتبة: 図書館
      حريق: 火
      الموظف: 職員
      يقول: 言う
      اذهبوا: 行く
      مخرج: 出口
      مساعدة: 助け
      تحتاج: 必要とする
      يتصل: 電話します
      بالإطفاء: 消防
      الجميع: みんな
      الخارج: 外に
      جيد: よい
