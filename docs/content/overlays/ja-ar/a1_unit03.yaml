teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: 一
    gloss: 一
    note: واحد (wāḥid) は、名詞なしで単独でも使い、「いくつ？」への答えになります。
    example_gloss: 本を1冊持っています。
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: 二
    gloss: 二
    note: اثنان (ithnān) は、単独で言うときの「2」の形です。
    example_gloss: 兄弟が2人います。
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: 三
    gloss: 三
    note: ثلاثة (thalātha) は、単独で言うときの「3」の形です。
    example_gloss: 1、2、3。
  ar.a1.unit03.lesson01.teach.arbaa:
    title: 四
    gloss: 四
    note: أربعة (arbaʿa) は、単独で言うときの「4」の形です。
    example_gloss: 私は本を4冊持っています。
  ar.a1.unit03.lesson01.teach.khamsa:
    title: 五
    gloss: 五
    note: خمسة (khamsa) は、単独で言うときの「5」の形です。
    example_gloss: 私は本を5冊持っています。
  ar.a1.unit03.lesson02.teach.sitta:
    title: 六
    gloss: 六
    note: ستة (sitta) は、単独で言うときの「6」の形です。
    example_gloss: 本を6冊持っています。
  ar.a1.unit03.lesson02.teach.sabaa:
    title: 七
    gloss: 七
    note: سبعة (sabʿa) は、単独で言うときの「7」の形です。
    example_gloss: 私は本を7冊持っています。
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: 八
    gloss: 八
    note: ثمانية (thamāniya) は、単独で言うときの「8」の形です。
    example_gloss: 私は本を8冊持っています。
  ar.a1.unit03.lesson02.teach.tisaa:
    title: 九
    gloss: 九
    note: تسعة (tisʿa) は、単独で言うときの「9」の形です。
    example_gloss: 私は9ディルハム持っています。
  ar.a1.unit03.lesson02.teach.ashara:
    title: 十
    gloss: 十
    note: عشرة (ʿashara) は、単独で言うときの「10」の形です。
    example_gloss: 私は10ディナール持っています。
  ar.a1.unit03.lesson03.teach.kam:
    title: これはいくらですか。
    gloss: これはいくらですか。
    note: كم هذا؟ (kam hādhā) は値段をたずねる簡単な言い方です。بكم هذا؟ (bi-kam hādhā、「いくらでこれは？」)もよく使われます。
  ar.a1.unit03.lesson03.teach.raqam:
    title: 番号
    gloss: 番号
    note: رقم (raqam) は、電話番号のように「番号」を表す一般的な語です。
    example_gloss: 私の番号は1です。
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: 値段をたずねる
    gloss: ユースフが値段をたずねます。
    note: كم هذا؟ で会話が始まります。
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: 値段を伝える
    gloss: レイラが5だと答えます。
    note: بخمسة は、前置詞 بـ(~で)が数字に直接くっついた形です。
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: ほかの品物をたずねる
    gloss: ユースフが別の物を指します。
    note: وهذا؟ は、前の流れをふまえて質問を短くした言い方です。
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: 2つ目の値段を言う
    gloss: レイラが10だと答えます。
    note: بعشرة は بخمسة と同じパターンです。
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: お礼を言う
    gloss: ユースフがお礼を言います。
    note: あいさつの単元で学んだ شكرا で会話が終わります。
