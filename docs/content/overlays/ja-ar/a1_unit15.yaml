course:
  title: アラビア語 A1
  description: 日常のやりとりのための現代標準アラビア語(フスハー)の入門コースです。
units:
  ar.a1.unit15.comparisons:
    title: 比較
lessons:
  ar.a1.unit15.lesson01.basic_comparisons:
    title: より大きい、より小さい
  ar.a1.unit15.lesson02.compare_choices:
    title: より近い、より安い
teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: 〜より
    gloss: 〜より
    note: من (min)は「〜出身の」を表す語と同じです(أنا من لبنان)。比較を表す語の後ろに置くと「〜より」という意味になります。
    example_gloss: 市場はカフェより大きいです。
  ar.a1.unit15.lesson01.teach.bigger:
    title: より大きい
    gloss: より大きい
    note: أكبر (akbar)は كبير (kabīr、大きい)から作られます。أكبر、أصغر、أقرب、أرخص のような比較の語はすべて أ で始まり、男性名詞にも女性名詞にも同じ形を使います。
    example_gloss: 市場はカフェより大きいです。
  ar.a1.unit15.lesson01.teach.smaller:
    title: より小さい
    gloss: より小さい
    note: 「より小さい」を表す أصغر (aṣghar)は、أكبر と同じ أ のパターンです。
    example_gloss: カフェは市場より小さいです。
  ar.a1.unit15.lesson01.teach.nearer:
    title: より近い
    gloss: より近い
    note: أقرب (aqrab)は距離を比べる語で、「より近い」という意味です。
    example_gloss: カフェは市場より近いです。
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: 市場のほうが大きい
    gloss: 市場はカフェより大きいです
    note: この比較文では、「です」にあたる別の語は必要ありません。
    example_gloss: ユースフは「市場はカフェより大きいです」と言いました。
  ar.a1.unit15.lesson02.teach.nearer:
    title: より近い
    gloss: より近い
    note: أقرب (aqrab)は距離を比べる語で、「より近い」という意味です。
    example_gloss: カフェは市場より近いです。
  ar.a1.unit15.lesson02.teach.cheaper:
    title: より安い
    gloss: より安い
    note: أرخص (arkhaṣ)は値段を比べる語で、「より安い」という意味です。
    example_gloss: 水はコーヒーより安いです。
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: カフェのほうが近い
    gloss: カフェは市場より近いです
    note: 2つ目の名詞の前には من を置きます。
    example_gloss: ユースフは「カフェは市場より近いです」と言いました。
  ar.a1.unit15.lesson02.teach.line01:
    title: 好みをたずねる
    gloss: ライラはユースフに何が好きか(どちらがいいか)尋ねています。
    note: ライラは男性に尋ねているので تفضل (tufaḍḍil)と言います。女性に尋ねるときは ماذا تفضلين؟ となります。
    example_gloss: ライラは「どちらがいいですか」と言いました。
  ar.a1.unit15.lesson02.teach.line02:
    title: カフェのほうがいい
    gloss: ユースフはカフェのほうがいいと言っています。
    note: أفضل の後ろに場所を置いて、好むほうの選択肢を表すことができます。
    example_gloss: ユースフは「カフェのほうがいいです」と言いました。
  ar.a1.unit15.lesson02.teach.line03:
    title: 距離を比べる
    gloss: ユースフはカフェは市場より近いと言っています。
    note: أقرب من が理由を示しています。
    example_gloss: ユースフは「カフェは市場より近いです」と言いました。
  ar.a1.unit15.lesson02.teach.line04:
    title: 大きさを比べる
    gloss: ヌールは、市場はカフェより大きいと付け加えています。
    note: والسوق (was-sūq)は、و(そして)が السوق にくっついた形で、「そして市場は」という意味です。
    example_gloss: ヌールは「それに、市場はカフェより大きいです」と言いました。
