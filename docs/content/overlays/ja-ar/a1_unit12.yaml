teaching:
  ar.a1.unit12.lesson01.teach.tomorrow:
    title: 明日
    gloss: 明日
    note: غدا(ghadan)は、行動が近い未来であることを表します。
    example_gloss: 私は明日勉強します。
  ar.a1.unit12.lesson01.teach.go:
    title: 私たちは行く
    gloss: 行きます/行く予定です
    note: نذهب(nadh-hab)は「私たちは行く」という意味で、語頭の ن が「私たち」を表します。غدا と一緒に使うと、現在形の動詞が予定を表します。
    example_gloss: 私たちはカフェに行きます。
  ar.a1.unit12.lesson01.teach.plan_time:
    title: 明日の5時
    gloss: 明日の5時
    note: في الساعة(〜時に)の後に時刻が来ます。時刻の単元で学んだとおりです。
    example_gloss: 私たちは明日の5時に行きます。
  ar.a1.unit12.lesson02.teach.propose:
    title: 予定を提案する
    gloss: 明日カフェに行きませんか？
    note: هل(hal)は、文を「はい・いいえ」で答える疑問文にします。نذهب と一緒に使うと「行きませんか？」という提案になります。
    example_gloss: ライラは言いました。「明日カフェに行きませんか？」
  ar.a1.unit12.lesson02.teach.accept:
    title: 時刻を言って受ける
    gloss: はい、5時に
    note: نعم と時刻だけで答えられます。動詞は要りません。
    example_gloss: ユースフは言いました。「はい、5時に」
  ar.a1.unit12.lesson02.teach.decline:
    title: シンプルに断る
    gloss: いいえ、授業があります
    note: لا で簡単に断り、その後に عندي(私は〜がある)で理由を言います。
    example_gloss: いいえ、明日は授業があります。
  ar.a1.unit12.lesson02.teach.line01:
    title: ライラが提案する
    gloss: ライラが明日カフェに行こうと提案しています。
    note: この文から予定を決めるやりとりが始まります。
    example_gloss: ライラは言いました。「明日カフェに行きませんか？」
  ar.a1.unit12.lesson02.teach.line02:
    title: ユースフが受ける
    gloss: ユースフは承諾して、時刻を伝えています。
    note: これで、予定にすることと日と時刻がそろいました。
    example_gloss: ユースフは言いました。「はい、5時に」
  ar.a1.unit12.lesson02.teach.line03:
    title: ライラが確認する
    gloss: ライラは「いいね」と言って、別れのあいさつをしています。
    note: جيد(jayyid)は「良い」という意味で、ここでは予定を了承しています。إلى اللقاء は、あいさつの単元で学んだ別れのあいさつです。
    example_gloss: ライラは言いました。「いいね。ではまた」
