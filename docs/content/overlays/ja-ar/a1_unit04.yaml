teaching:
  ar.a1.unit04.lesson01.teach.tareekh:
    title: 日付
    gloss: 日付
    note: この質問の تاريخ は、カレンダー上の日付を表します。
    example_gloss: 今日は何日ですか。
  ar.a1.unit04.lesson01.teach.al_yawm:
    title: 今日
    gloss: 今日
    note: اليوم は、文脈によって「今日」と「日」のどちらの意味にもなります。
    example_gloss: 今日は何日ですか。
  ar.a1.unit04.lesson01.teach.ma_tareekh:
    title: 今日は何日ですか。
    gloss: 今日は何日ですか。
    note: アラビア語では、疑問詞 ما が名詞句 تاريخ اليوم の前に置かれます。
    example_gloss: ライラは「今日は何日ですか」と言いました。
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: 5月の
    gloss: 5月の
    note: 日付では月の前に من を使います:الخامس من مايو。
    example_gloss: 今日は5月5日です。
  ar.a1.unit04.lesson01.teach.may:
    title: 5月
    gloss: 5月
    note: مايو(māyū)はエジプトをはじめアラブ世界の多くで使われる5月の名称です。レバノン、シリア、ヨルダン、イラクでは同じ月を أيار(ayyār)と呼びます。
    example_gloss: 今日は5月5日です。
  ar.a1.unit04.lesson01.teach.june:
    title: 6月
    gloss: 6月
    note: يونيو(yūnyū)はエジプトをはじめアラブ世界の多くで使われる6月の名称です。レバノン、シリア、ヨルダン、イラクでは同じ月を حزيران(ḥazīrān)と呼びます。
    example_gloss: 今日は6月6日です。
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: 5番目
    gloss: 5番目の
    note: الخامس は、この簡単な日付で5日を表す序数の形です。
    example_gloss: 今日は5月5日です。
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: 6番目
    gloss: 6番目の
    note: السادس は、6日を表す序数の形です。
    example_gloss: 今日は6月6日です。
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: 5月5日
    gloss: 5月5日
    note: 日本語の「5月5日」は月→日の順ですが、アラビア語では「日 من 月」の順に言い、間に من を入れます。
    example_gloss: 5月5日です。
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: 6月6日
    gloss: 6月6日
    note: これで、日と月がはっきり分かる日付になります。
    example_gloss: 6月6日です。
  ar.a1.unit04.lesson02.teach.line01:
    title: 日付をたずねる
    gloss: ライラが今日の日付を尋ねます。
    note: ما تاريخ اليوم؟ は時刻ではなく、カレンダー上の日付を尋ねる表現です。
    example_gloss: ライラは「今日は何日ですか」と言いました。
  ar.a1.unit04.lesson02.teach.line02:
    title: 日付を答える
    gloss: ユースフは5月5日だと答えます。
    note: 答えの文は اليوم で始まります。
    example_gloss: ユースフは「今日は5月5日です」と言いました。
  ar.a1.unit04.lesson02.teach.line03:
    title: 授業があることを伝える
    gloss: ライラは今日授業があると言います。
    note: عندي は「私は〜を持っています」という意味で、前に数字と一緒に出てきました。
    example_gloss: ライラは「ありがとう。今日は授業があります」と言いました。
  ar.a1.unit04.lesson02.teach.line04:
    title: 授業の日を伝える
    gloss: ユースフは授業の日付を伝えます。
    note: في は、授業がいつあるかを示します。
    example_gloss: ユースフは「授業は5月5日です」と言いました。
