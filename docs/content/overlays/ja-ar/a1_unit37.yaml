      مضحك: おもしろい
      ويحضر: 受講する／通う
      دورة: 講座
      الإسبانية: スペイン語
      فضولية: 好奇心が強い
      تتعلم: 学んでいます
      تحب: ～するのが好き
      جديدة: 新しい
      أشياء: 物事
      نفسه: 自身
      هادئ: 物静かな
