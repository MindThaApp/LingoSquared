    title: ヌールがみんなの話を聞く
    gloss: ヌールは言語カフェの新入りです。ヌールはユーセフに、ほかの人たちがどんな人か尋ねます。ユーセフが教えてくれます。レイラは優しくて忍耐強く、看護師として働いています。カリームは面白い人で、スペイン語の講座に通っています。サーラは好奇心旺盛で、新しいことを学ぶのが好きです。ユーセフ自身は穏やかな人です。
    note: グループについての短い文章です。形容詞は人に合わせて変わります。女性には لطيفة (laṭīfa)、男性には مضحك (muḍḥik) を使います。
    glosses:
      الجديدة: 新入りの人
      مقهى: カフェ
      تسأل: 尋ねる
      الآخرون: ほかの人たち
      يخبرها: 話す
      لطيفة: 親切な／感じのよい
      وصبورة: 辛抱強い
      تعمل: 働いています
