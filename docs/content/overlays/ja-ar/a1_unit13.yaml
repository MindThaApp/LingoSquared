teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: 昨日
    gloss: 昨日
    note: أمس(ams)は「昨日」という意味です。ذهبت のような過去形の動詞と一緒に使い、文末にも文頭にも置けます。
    example_gloss: 昨日、私は市場へ行きました。
  ar.a1.unit13.lesson01.teach.went:
    title: 私は行った
    gloss: 私は行った
    note: ذهبت(dhahabtu)は「私は行った」という意味です。過去形の語尾 -tu が「私」を表します。母音記号がないと、同じ文字が dhahabta / dhahabti(あなたは行った、男性/女性に対して)や dhahabat(彼女は行った)とも読めますが、文脈で判断します。
    example_gloss: 私は市場へ行きました。
  ar.a1.unit13.lesson01.teach.bought:
    title: 私は買った
    gloss: 私は買った
    note: اشتريت(ishtaraytu)は「私は買った」という意味です。ذهبت と同じく、「私」を表す語尾 -tu で終わります。
    example_gloss: 私はりんごを買いました。
  ar.a1.unit13.lesson01.teach.apples_object:
    title: りんご
    gloss: りんご
    note: تفاحا(tuffāḥan)は、買い物の単元で学んだ تفاح(りんご)が動詞の目的語になった形です。余分な ا は語尾の -an を表します。
    example_gloss: 私はりんごを買いました。
  ar.a1.unit13.lesson02.teach.what_did:
    title: 昨日は何をしましたか？
    gloss: 昨日は何をしましたか？
    note: ماذا(mādhā)は「何」を尋ねる語で、فعلت はここでは「あなたはした」という意味です。男性には faʿalta、女性には faʿalti と読みますが、書き方は同じです。ユースフはライラに尋ねているので、faʿalti と言います。
    example_gloss: ユースフは言いました。「昨日、何をしましたか。」
  ar.a1.unit13.lesson02.teach.drank:
    title: 飲みました
    gloss: 飲みました
    note: شربت(sharibtu)は「私は飲んだ」という意味です。ذهبت や اشتريت と同じ、「私」を表す語尾 -tu が付いています。
    example_gloss: 私はコーヒーを飲みました。
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: 最近の出来事の流れ
    gloss: 私は市場へ行きました。りんごを買いました。コーヒーを飲みました。
    note: 短い過去形の文を続けて、自分がしたことを伝えます。どの動詞も「私」を表す -tu で終わります。
    example_gloss: 昨日、私は市場へ行きました。りんごを買いました。コーヒーを飲みました。
  ar.a1.unit13.lesson02.teach.line01:
    title: 昨日のことを尋ねる
    gloss: ユースフはライラに、昨日何をしたかを尋ねます。
    note: ユースフは女性のライラに尋ねているので、فعلت はここでは faʿalti と読みます。男性に対しては faʿalta です。
    example_gloss: ユースフは言いました。「昨日、何をしましたか。」
  ar.a1.unit13.lesson02.teach.line02:
    title: 市場へ行った
    gloss: ライラは市場へ行ったと言います。
    note: ذهبت は、終わった動きを表します。
    example_gloss: ライラは言いました。「私は市場へ行きました。」
  ar.a1.unit13.lesson02.teach.line03:
    title: りんごを買った
    gloss: ライラはりんごを買ったと言います。
    note: ここで、終わった行動がもう一つ加わります。
    example_gloss: ライラは言いました。「私はりんごを買いました。」
  ar.a1.unit13.lesson02.teach.line04:
    title: コーヒーを飲んだ
    gloss: ライラはコーヒーを飲んだと言います。
    note: これで、短い出来事の話が完成します。
    example_gloss: ライラは言いました。「私はコーヒーを飲みました。」
