teaching:
  ar.a1.unit24.lesson01.teach.money:
    title: お金
    gloss: お金
    note: مال (māl) は一般的な「お金」を表します。
    example_gloss: これはお金です。
  ar.a1.unit24.lesson01.teach.pay:
    title: 私は払います
    gloss: 私は払います
    note: أدفع (adfaʿ) は「私は払います」の意味です。
    example_gloss: 10ディルハム払います。
  ar.a1.unit24.lesson01.teach.card:
    title: カード
    gloss: カード
    note: بطاقة (biṭāqa) は「カード」、بالبطاقة (bil-biṭāqa) は「カードで」の意味です。سأدفع (sa-adfaʿ) では、接頭辞の سـ が أدفع を未来にして「払います(これから払う)」となります。
    example_gloss: カードで払います。
  ar.a1.unit24.lesson01.teach.cash:
    title: 現金
    gloss: 現金
    note: نقدا (naqdan) は「現金で」の意味です。
    example_gloss: 現金で払います。
  ar.a1.unit24.lesson02.teach.amount:
    title: 金額
    gloss: 金額
    note: مبلغ (mablagh) は金額のことです。كم المبلغ؟ (kam al-mablagh) は、いくら払えばよいかをたずねる表現です。
    example_gloss: 金額はいくらですか。
  ar.a1.unit24.lesson02.teach.can_pay:
    title: 支払えますか。
    gloss: カードで支払えますか？
    note: هل أستطيع (hal astaṭīʿ) は「私は~できますか」、الدفع (ad-dafʿ) は「支払うこと」の意味です。
    example_gloss: 現金で払えますか。
  ar.a1.unit24.lesson02.teach.line01:
    title: 金額をたずねる
    gloss: ライラは金額をたずねます。
    note: كم は「いくつ・いくら」をたずねます。
    example_gloss: ライラは「金額はいくらですか。」と言いました。
  ar.a1.unit24.lesson02.teach.line02:
    title: 金額を伝える
    gloss: 店員は金額が10ディルハムだと言います。
    note: دراهم (darāhim) は、買い物の単元で出てきた通貨を表す語です。
    example_gloss: 店員は「金額は10ディルハムです。」と言いました。
  ar.a1.unit24.lesson02.teach.line03:
    title: カード払いをたずねる
    gloss: ライラはカードで払えるかどうかたずねます。
    note: 使える支払い方法を尋ねる表現です。
    example_gloss: ライラは「カードで払えますか。」と言いました。
  ar.a1.unit24.lesson02.teach.line04:
    title: 支払い方法を案内する
    gloss: 店員はカードでも現金でも払えると言います。
    note: أو (aw) は「または」の意味です。
    example_gloss: 店員は「はい、または現金でも大丈夫です。」と言いました。
  ar.a1.unit24.lesson02.teach.line05:
    title: 支払い方法を選ぶ
    gloss: ライラはカードで払うと言います。
    note: これで支払い方法が決まります。
    example_gloss: ライラは「カードで払います。」と言いました。
