  ar.a1.unit36.lesson05.teach.lyla_wywsf_ytbkhan:
    title: ライラとユースフが一緒に料理する
    gloss: ライラとユースフは、アレクサンドリアにあるユースフの家のキッチンで一緒に料理します。ライラは玉ねぎを切ります。ユースフはフライパンでトマトを炒めます。ユースフは料理を準備します。ライラは料理を味見します。料理はおいしいです!
    note: 一緒に料理することについての短い文章です。يطبخان (yaṭbukhān) の語尾 ـان は「2人が料理する」という意味です。
    glosses:
      يطبخان: 料理する
      معا: 一緒に
      مطبخ: キッチン
      تقطع: 切る
      البصلة: 玉ねぎ
      يقلي: 焼く
      الطماطم: トマト
      المقلاة: フライパン
      يقوم: 行う。「準備」を表す語と一緒に使うと「準備する」という意味になる
      الطعام: 食事／食べ物
      بتجهيز: 準備すること。「準備する」という表現を完成させる
      تتذوق: 味見する
      لذيذ: おいしい
  ar.a1.unit36.lesson05.teach.altaam_jahz_whw:
    title: 食事ができあがり、おいしい
    gloss: 食事ができあがって、おいしいです！
