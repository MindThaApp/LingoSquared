  ar.a1.unit38.lesson05.teach.nwr_wlyla_tdhhban:
    title: ヌールとライラ、バラを買う
    gloss: ヌールとライラは土曜日に花市場へ行きます。ライラは何色がほしいですか?ライラは赤がいいです。ヌールは何色がほしいですか?ヌールは黄色がいいです。二人はバラを5本買います。値段は10ディルハムです。バラはとてもきれいです!
    note: 市場へ出かけた短い文章です。色の語は、説明する対象に合わせて形が変わります。الأحمر (al-aḥmar) は色そのものを指しますが、الورود حمراء (al-wurūd ḥamrāʾ) では「バラ」に合わせて女性形になります。
    glosses:
      تذهبان: 行く
      السبت: 土曜日
      سوق: 市場
      اللون: 色
      تريده: 欲しい
      تريد: ~がほしいのですが
      الأحمر: 赤
      الأصفر: 黄色
      تشتريان: 買う
      خمس: '5'
      ورود: バラ
      السعر: 料金
      عشرة: '10'
      دراهم: ディルハム
      جميلة: 美しい
  ar.a1.unit38.lesson05.teach.nwr_wlyla_thban:
