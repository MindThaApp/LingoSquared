teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: занятие
    note: '*class* значит «занятие», «урок» (встреча, на которой чему-то учатся).'
    example_gloss: У меня занятие каждый вторник вечером.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: курс
    note: '*course* значит «курс» (серия занятий по одной теме).'
    example_gloss: В этом году он проходит компьютерный курс.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: студент / слушатель
    note: '*student* значит «студент» или «слушатель курсов»: тот, кто учится в школе или на занятии.'
    example_gloss: Она студентка местного колледжа.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: домашнее задание
    note: '*homework* значит «домашнее задание».'
    example_gloss: Я делаю домашнее задание после ужина.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: предмет
    note: '*subject* значит «предмет» (то, что изучают).'
    example_gloss: Математика — мой любимый предмет.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: контрольная
    note: '*test* значит «контрольная», «тест».'
    example_gloss: В пятницу у нас контрольная.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: ходить на занятия
    note: '*take a class* — устойчивое английское сочетание, которое значит «ходить на занятия», «посещать занятия». Не переводи дословно «брать урок»: в английском здесь всегда *take*, а например *follow a class* звучит неправильно.'
    example_gloss: Я хожу на занятия каждый вторник вечером.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: делать домашнее задание
    note: '*do homework*: глагол здесь *do*, а не *make*. В русском «делать» подходит для обоих, а в английском нужно выбирать, и с домашним заданием это всегда *do*.'
    example_gloss: Он делает домашнее задание после ужина.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: готовиться к контрольной
    note: '*study for a test* значит «готовиться к контрольной». *For* здесь указывает на цель (ради чего учишься).'
    example_gloss: Я каждую пятницу готовлюсь к контрольной.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: местный колледж для взрослых
    note: '*community college* — американское учебное заведение, где в основном взрослые проходят курсы параллельно с работой. Точного русского аналога нет, поэтому его описывают словами.'
    example_gloss: Она учится в местном колледже.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: вечером
    note: '*in the evening* значит «вечером».'
    example_gloss: Моё занятие вечером.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: Что ты изучаешь?
    note: В этом вопросе используется present continuous (*are you studying*) для того, чем ты занимаешься в этот период жизни. В русском для этого отдельного времени нет, там обычное настоящее время.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: Ты сегодня после работы чем-нибудь занят(а)?'
    note: '*anything* здесь значит «что-нибудь» и стоит в вопросе.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Да, сегодня вечером у меня урок фотографии.'
    note: '*tonight* значит «сегодня вечером».'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: Ответ Даниэля
    gloss: 'Даниэль говорит: О, здорово! Где ты на него ходишь?'
    note: '*Where do you take it?*: и здесь *take* подходит к посещению занятия или курса, как в *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: В местном колледже в центре города. Два раза в неделю.'
    note: '*twice a week*: и здесь *a* значит «в».'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: Вопрос Даниэля
    gloss: 'Даниэль говорит: Как идёт пока?'
    note: '*so far* значит «пока что», «до сих пор».'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Мне очень нравится. Я учусь лучше пользоваться камерой.'
    note: '*I''m learning how to ...*: present continuous для навыка, который ты развиваешь прямо сейчас.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: Последняя реплика Даниэля
    gloss: 'Даниэль говорит: Здорово! Может, как-нибудь научишь и меня.'
    note: '*sometime* значит «как-нибудь», «когда-нибудь»: неопределённое время в будущем.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Текст о Даниэле, Лейле и Мии
    gloss: Даниэль, Лейла и Миа учатся чему-то новому помимо работы. Даниэль по понедельникам вечером ходит на компьютерный курс, чтобы освоить новые навыки для работы. Лейла учит испанский, потому что когда-нибудь хочет поехать в Мексику. У Мии два раза в неделю урок фотографии в местном колледже, и она уже делает гораздо лучшие фотографии. Иногда они вместе обсуждают свои занятия за обедом.
    note: '*takes a computer course*: используется *take*, а не *follow*, та же ловушка, что и в *take a class*.'
