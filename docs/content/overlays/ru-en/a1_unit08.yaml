teaching:
  en.a1.unit08.lesson01.teach.a_pound_of:
    title: a pound of apples
    gloss: фунт яблок
    note: '*a pound* — единица веса (около 454 граммов), в США так обычно продают фрукты и овощи.'
  en.a1.unit08.lesson01.teach.a_dozen:
    title: a dozen eggs
    gloss: дюжина яиц
    note: '*a dozen* означает «двенадцать штук».'
