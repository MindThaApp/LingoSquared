    title: a bottle of water
    gloss: бутылка воды
    note: '*a bottle of* означает «бутылка ...».'
  en.a1.unit08.lesson01.teach.a_bag_of:
    title: a bag of rice
    gloss: пакет риса
    note: '*a bag of* означает «пакет ...» — для сыпучих товаров вроде риса.'
  en.a1.unit08.lesson01.teach.a_kilo_of:
    title: a kilo of tomatoes
    gloss: килограмм помидоров
    note: '*a kilo of* означает «килограмм»; в США в быту обычно взвешивают в *pounds*, а *kilo* слышно реже.'
  en.a1.unit08.lesson02.teach.how_much_are:
    title: How much are the apples?
    gloss: Сколько стоят яблоки?
    note: '*How much are...?* спрашивает о цене чего-то во множественном числе.'
  en.a1.unit08.lesson02.teach.two_dollars_a_pound:
    title: They're two dollars a pound.
    gloss: Они стоят два доллара за фунт.
    note: '*a pound* в конце предложения здесь означает «за фунт», как и *per pound*.'
  en.a1.unit08.lesson02.teach.can_i_have_two_pounds:
    title: Can I have two pounds, please?
    gloss: Можно мне два фунта, пожалуйста?
    note: '*Can I have...?* — вежливая формула просьбы при покупках.'
  en.a1.unit08.lesson02.teach.is_it_fresh:
    title: Is it fresh?
    gloss: Это свежее?
    note: Полезный вопрос при покупке свежих продуктов, таких как фрукты или овощи.
  en.a1.unit08.lesson03.teach.per_pound:
    title: per pound
    gloss: за фунт
    note: '*per pound* указывает цену за единицу веса, например, на ценниках.'
    example_gloss: Яблоки стоят два доллара за фунт.
  en.a1.unit08.lesson03.teach.label_text:
    title: Ценник
    gloss: 'Яблоки: 2 доллара за фунт. Яйца: 4 доллара за дюжину. Рис: 3 доллара за пакет.'
    note: Знак доллара в английском ставится ПЕРЕД числом (*$2*), а в русском цену обычно пишут с валютой после числа.
  en.a1.unit08.lesson04.teach.thats_x_dollars:
    title: That's eight dollars.
    gloss: С вас восемь долларов.
    note: '*That''s X dollars* соответствует русскому «С вас X долларов».'
  en.a1.unit08.lesson04.teach.q_price:
    title: Вопрос Даниэля
    gloss: 'Дэниел: Сколько стоят яблоки?'
    note: Дэниел начинает разговор с вопроса о цене.
  en.a1.unit08.lesson04.teach.a_price:
    title: Ответ Лейлы
    gloss: 'Лейла: Они стоят два доллара за фунт.'
    note: Лейла называет цену за фунт.
  en.a1.unit08.lesson04.teach.q_two_pounds:
    title: Заказ Даниэля
    gloss: 'Дэниел: Хорошо, можно мне два фунта, пожалуйста?'
    note: '*OK* показывает, что Дэниел согласен с ценой, прежде чем сделать заказ.'
  en.a1.unit08.lesson04.teach.a_sure_anything_else:
    title: Уточнение Лейлы
    gloss: 'Лейла: Конечно. Что-нибудь ещё?'
    note: '*Sure* здесь означает «конечно» или «с удовольствием».'
  en.a1.unit08.lesson04.teach.q_eggs_too:
    title: Дополнительный заказ Даниэля
    gloss: 'Дэниел: Да, и ещё дюжину яиц.'
    note: '*too* в конце предложения означает «тоже, ещё».'
  en.a1.unit08.lesson04.teach.a_total:
    title: Заключение Лейлы
    gloss: 'Лейла: С вас восемь долларов.'
    note: Лейла называет общую цену за яблоки и яйца вместе.
