course:
  title: Английский B1
  description: 'Английский уровня B1: обязанности, возможности, гипотетические ситуации и рассказы о повседневной жизни, с подробными объяснениями на русском языке.'
units:
  en.b1.unit01.necessity:
    title: Дела, которые нужно сделать или которые стоило бы сделать
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must, have to и should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: должен (сильная личная обязанность)
    note: '*must* выражает сильную личную обязанность — то, что вы сами считаете очень важным.'
    example_gloss: Я должен закончить это задание сегодня.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: должен (обязанность извне)
    note: '*have to* выражает обязанность, которая идёт извне, например, из правила или срока.'
    example_gloss: Я должен заплатить аренду до пятницы.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: стоило бы / тебе стоит
    note: '*should* — рекомендация, а не строгая обязанность.'
    example_gloss: Тебе стоит скоро позвонить стоматологу.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: задача; задание
    note: '*task* означает задачу или работу, которую нужно выполнить.'
    example_gloss: У меня есть ещё одно задание, которое нужно выполнить.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: арендная плата
    note: '*rent* — деньги, которые платят за жильё.'
    example_gloss: Арендную плату нужно внести в пятницу.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: приём; запись на приём
    note: '*appointment* — назначенная встреча с кем-то, например, с врачом.'
    example_gloss: На этой неделе у меня приём у стоматолога.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: выразить сильную обязанность
    gloss: Я должен закончить это задание сегодня.
    note: '*I must* выражает сильную личную обязанность.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: выразить внешнюю обязанность
    gloss: Я должен заплатить аренду до пятницы.
    note: '*I have to* выражает обязанность, которая идёт извне, как срок платежа.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Форма для 'she'
    gloss: Ей нужно записаться на приём.
    note: С *he/she/it* *have to* превращается в *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: дать рекомендацию
    gloss: Тебе стоит позвонить и подтвердить приём.
    note: '*should* даёт рекомендацию, а не строгую обязанность, как *must* или *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Формы 'have to'
    gloss: Мне нужно идти. Ей нужно идти. Нам нужно идти. Им нужно идти.
    note: Только с *he/she/it* *have* превращается в *has*; со всеми остальными лицами остаётся *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Выразить сожаление о прошлом
    gloss: Мне следовало позвонить раньше.
    note: '*should have* + причастие выражает сожаление о том, чего не сделали.'
    example_gloss: Мне следовало позвонить раньше.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: нельзя
    note: '*must not* означает запрет: что-то абсолютно не разрешено. Осторожно: *must not* значит не «не должен» в смысле «не обязан», а «нельзя»; «не обязан» — это *don''t have to*.'
    example_gloss: Тебе нельзя снова это забывать.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: не обязан / не нужно
    note: '*don''t have to* значит, что что-то не обязательно; это отличается от *must not* (запрет).'
    example_gloss: Тебе не обязательно приходить, если ты занят.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Сожаление, запрет и отсутствие обязанности
    gloss: Мне следовало позвонить. Я забыл. Тебе нельзя снова это забывать. Тебе не обязательно приходить.
    note: '*should have* + причастие выражает сожаление о прошлом. *must not* — запрет; *don''t have to* значит «не обязательно, но можно».'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Текст: спортзал'
    gloss: Вчера Дэниел забыл продлить абонемент в спортзале. Ему следовало поставить напоминание на телефоне. Теперь он должен заплатить штраф за просрочку. Ему нельзя забыть об этом снова в следующем месяце.
    note: Короткий текст об ошибке Дэниела и её последствиях.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Лейла спрашивает о членстве
    gloss: 'Лейла говорит: Дэниел, ты продлил абонемент в спортзале?'
    note: Прямой вопрос, чтобы проверить, сделано ли уже что-то.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Ответ Даниэля: забыл'
    gloss: 'Дэниел говорит: О нет, я забыл! Мне следовало сделать это на прошлой неделе.'
    note: '*I should have done that* выражает сожаление о том, что не было сделано.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Лейла предупреждает Даниэля
    gloss: 'Лейла говорит: Ты должен позвонить им сегодня, а то заплатишь штраф за просрочку.'
    note: '*must* здесь выражает срочное личное предупреждение.'
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Даниэль называет другие обязанности
    gloss: 'Дэниел говорит: Ты права. Мне ещё нужно заплатить аренду до пятницы, и мне тоже стоит позвонить стоматологу.'
    note: Дэниел сочетает в одном ответе *have to* (обязанность) и *should* (рекомендация).
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Лейла успокаивает Даниэля
    gloss: 'Лейла говорит: Тебе не обязательно делать всё сегодня. Но нельзя снова забывать про спортзал.'
    note: Лейла противопоставляет *don't have to* (не обязательно) и *must not* (запрет).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Даниэль принимает решение
    gloss: 'Дэниел говорит: Знаю. В этом месяце мне нужно быть организованнее.'
    note: '*I must be* здесь выражает личное решение.'
