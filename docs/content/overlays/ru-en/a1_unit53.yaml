course:
  title: Английский A1
  description: 'Английский уровня A1: приветствия и короткие разговоры в повседневных ситуациях, с подробными объяснениями на русском языке.'
units:
  en.a1.unit53.bike_rental:
    title: Аренда велосипеда
lessons:
  en.a1.unit53.lesson01.bike_rental_vocabulary:
    title: Слова для аренды велосипеда
  en.a1.unit53.lesson02.phrases_for_renting_a_bike:
    title: Фразы для аренды велосипеда
  en.a1.unit53.lesson03.dialogue_at_the_rental_shop:
    title: 'Разговор: в пункте проката велосипедов'
  en.a1.unit53.lesson04.a_bike_ride_along_the_river:
    title: 'Читаем: велопрогулка вдоль реки'
teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: брать напрокат
    note: '*rent* значит «брать или сдавать напрокат». В английском направление определяется контекстом, тогда как в русском используются разные выражения.'
    example_gloss: Я хочу взять велосипед напрокат.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: залог
    note: '*deposit* значит «залог» — деньги, которые платят заранее и получают обратно, если возвращают велосипед без повреждений.'
    example_gloss: Залог составляет двадцать долларов.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: возвращать
    note: '*return* здесь значит «возвращать что-либо», а не «возвращаться».'
    example_gloss: Пожалуйста, верните велосипед сегодня.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: час
    note: '*hour* значит «час».'
    example_gloss: Это стоит десять долларов в час.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: размер
    note: '*size* значит «размер».'
    example_gloss: Какой размер вам нужен?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: шлем
    note: '*helmet* значит «шлем».'
    example_gloss: У вас есть шлем?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Я хотел бы взять велосипед напрокат, пожалуйста.
    note: '*I''d like to* — сокращение от *I would like to* и вежливый способ высказать просьбу; это мягче, чем прямое *I want*.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: Сколько это стоит в час?
    note: В вопросе *does it cost* используется вспомогательный глагол *does*, поскольку смысловой глагол — *cost*.
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: Мне нужен маленький велосипед.
    note: В конструкции *need a small bike* глагол *need* ставится прямо перед существительным. По-русски обычно говорят «мне нужен маленький велосипед».
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: Можно мне шлем, пожалуйста?
    note: '*Can I have ...?* — устойчивый вежливый способ попросить что-либо в магазине. Дословно переводить эту конструкцию не нужно.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: Когда мне нужно его вернуть?
    note: В вопросе *do I need to* используется вспомогательный глагол *do*.
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: Десять долларов в час.
    note: '*an hour* здесь значит «в час»: артикль *an* перед единицей времени передаёт значение «за каждый».'
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: Сотрудник проката приветствует посетительниц
    gloss: 'Сотрудник проката говорит: Здравствуйте! Чем я могу вам сегодня помочь?'
    note: '*How can I help you today?* — устойчивое вежливое приветствие в сфере услуг.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: Просьба Мии
    gloss: 'Миа говорит: Мы хотели бы взять напрокат два велосипеда. Мы хотим прокатиться вдоль реки.'
    note: Во фразе *We'd like to rent* глагол *rent* означает, что велосипеды берут напрокат.
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: Сотрудник спрашивает о размере
    gloss: 'Сотрудник проката говорит: Конечно. Какой размер вам нужен?'
    note: В вопросе *What size do you need?* используется вспомогательный глагол *do*.
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: Размер Лейлы
    gloss: 'Лейла говорит: Мне нужен маленький.'
    note: '*one* заменяет здесь слово *bike*, чтобы его не повторять. По-русски существительное тоже можно опустить: «мне нужен маленький».'
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: Размер Мии
    gloss: 'Миа говорит: А мне нужен средний.'
    note: Здесь *one* также заменяет слово *bike*.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: Цена и залог
    gloss: 'Сотрудник проката говорит: Отлично, вот ваши велосипеды. Прокат стоит десять долларов в час, а залог составляет двадцать долларов.'
    note: 'В этой реплике два разных факта: почасовая цена и сумма залога. Не путай их.'
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Миа спрашивает о возврате
    gloss: 'Миа говорит: Когда нам нужно их вернуть?'
    note: '*them* здесь относится к велосипедам и стоит во множественном числе.'
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: Время возврата
    gloss: 'Сотрудник проката говорит: Пожалуйста, верните их не позднее пяти часов.'
    note: '*by five o''clock* значит «не позднее пяти часов», а не после пяти.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Лейла благодарит сотрудника
    gloss: 'Лейла говорит: Отлично, спасибо!'
    note: '*Great, thank you!* — короткая вежливая фраза для завершения разговора.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Текст о велопрогулке вдоль реки
    gloss: 'Тёплым днём Миа пригласила Лейлу покататься вдоль реки рядом с её домом. Ни у одной из них не было велосипеда, поэтому они вместе пошли в пункт проката. Сотрудник спросил, какой размер им нужен. Лейла взяла маленький велосипед, а Миа — средний. Прокат стоил десять долларов в час, а залог за оба велосипеда составлял двадцать долларов. Велосипеды нужно было вернуть не позднее пяти часов. Прогулка вдоль реки была прекрасной: они видели людей, гулявших с собаками и наслаждавшихся солнечной погодой. Они вернули велосипеды точно вовремя и получили залог обратно. Потом они рассказали Даниэлю о прогулке, и он сказал, что в следующий раз хочет поехать с ними.'
    note: '*owned* — прошедшая форма от *own* («владеть»); *Neither of them owned a bike* значит «Ни у одной из них не было велосипеда».'
