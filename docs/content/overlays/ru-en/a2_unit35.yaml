teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: аптека
    note: '*pharmacy* — магазин, где можно получить лекарства.'
    example_gloss: Рядом с поликлиникой есть аптека.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: фармацевт
    note: '*pharmacist* — человек, который выдаёт лекарства.'
    example_gloss: Фармацевт объяснил мне, как принимать лекарство.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: таблетка
    note: '*tablet* — отдельная твёрдая порция лекарства, которую глотают.'
    example_gloss: Я принимаю одну таблетку утром и одну вечером.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: доза
    note: '*dose* — количество лекарства, которое принимают за один раз.'
    example_gloss: Доза — одна таблетка два раза в день.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: повторный отпуск лекарства
    note: '*refill* — новая упаковка того же лекарства без повторного визита к врачу.'
    example_gloss: Мне нужен повторный отпуск лекарства, потому что таблетки почти закончились.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: побочные эффекты
    note: '*side effects* — дополнительные действия, которые лекарство может оказывать на организм.'
    example_gloss: Фармацевт объяснил мне побочные эффекты этого лекарства.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Sagen, wie oft man etwas einnimmt
    gloss: один раз в день, два раза в день, три раза в день, каждые восемь часов
    note: '*once a day* = один раз в день, *twice a day* = два раза в день, *three times a day* = три раза в день, *every eight hours* = каждые восемь часов.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Sagen, weshalb man am Tresen steht
    gloss: Я хотел бы забрать лекарство по рецепту.
    note: '*I''d like to...* — стандартная вежливая форма, чтобы сказать, чего вы хотите.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Die Dosierung, die man zu hören bekommt
    gloss: Принимайте по одной таблетке два раза в день во время еды.
    note: '*with food* означает «во время еды», то есть не натощак.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Fragen, wie lange man es einnehmen muss
    gloss: Сколько дней мне это принимать?
    note: '*How many...?* употребляется с исчисляемыми предметами, например, с днями.'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Nach Nebenwirkungen fragen
    gloss: Есть ли побочные эффекты?
    note: '*Are there any...?* — обычный способ спросить, есть ли что-то.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should und shouldn't für Anweisungen
    gloss: Вам стоит принимать это во время еды. Вам не стоит прекращать приём раньше времени.
    note: '*should* даёт совет или указание; *shouldn''t* — отрицательная форма.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: перед сном
    note: '*before bed* означает «перед тем, как лечь спать».'
    example_gloss: Некоторые лекарства действуют лучше, если принимать их перед сном.
  en.a2.unit35.lesson03.teach.label_text:
    title: Das Apothekenetikett
    gloss: 'Средство от простуды. Принимайте по одной таблетке два раза в день во время еды в течение пяти дней. Не прекращайте приём таблеток раньше времени. Возможные побочные эффекты: вы можете почувствовать усталость. Повторный отпуск: один.'
    note: 'Аптечная этикетка коротка и сжата: короткие предложения и никаких вежливых формул.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Der Warnhinweis auf dem Etikett
    gloss: Не прекращайте приём таблеток раньше времени.
    note: '*Do not...* — запрет в повелительной форме, как на этикетках и вывесках.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel meldet sich am Tresen
    gloss: 'Дэниел говорит: Здравствуйте, я хотел бы забрать лекарство по рецепту.'
    note: '*Hi* звучит проще, чем *Hello*, но у аптечного окошка так вполне можно сказать.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Der Apotheker fragt nach dem Namen
    gloss: 'Фармацевт говорит: Конечно. Как вас зовут?'
    note: '*Of course* здесь значит «конечно, без проблем».'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel nennt den Grund für das Medikament
    gloss: 'Дэниел говорит: Дэниел. Врач выписал мне лекарство от сильной простуды.'
    note: 'Это продолжение визита к врачу из урока 28: та же простуда.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Der Apotheker nennt die Dosierung
    gloss: 'Фармацевт говорит: Вот, пожалуйста. Принимайте по одной таблетке два раза в день во время еды.'
    note: '*Here it is* говорят, когда что-то подают.'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel fragt, wie lange
    gloss: 'Дэниел спрашивает: Сколько дней мне это принимать?'
    note: Тот же вопрос, что и во втором уроке.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Die Antwort des Apothekers
    gloss: 'Фармацевт говорит: Пять дней. Не прекращайте приём таблеток раньше времени.'
    note: То же указание, что и на этикетке в уроке 3.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel fragt nach Nebenwirkungen
    gloss: 'Дэниел спрашивает: Есть ли побочные эффекты?'
    note: Тот же вопрос, что и во втором уроке.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Der Apotheker nennt die Nebenwirkung
    gloss: 'Фармацевт говорит: Вы можете почувствовать усталость, но это всё.'
    note: '*but that''s all* здесь значит «но это всё».'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel bedankt sich beim Apotheker
    gloss: 'Дэниел говорит: Большое спасибо.'
    note: '*very much* делает благодарность более выразительной.'
