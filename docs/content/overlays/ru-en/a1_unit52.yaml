  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: Парикмахер приветствует клиента
    gloss: 'Парикмахер говорит: Здравствуйте, чем я могу вам сегодня помочь?'
    note: '*How can I help you today?* значит «Чем я могу вам сегодня помочь?».'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: Просьба Даниэля
    gloss: 'Даниэль говорит: Я хотел бы постричься, пожалуйста. Моя сестра приезжает на следующей неделе.'
    note: Во фразе *I'd like a haircut* используется существительное *haircut*, а по-русски естественно сказать «я хотел бы постричься».
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "Парикмахер спрашивает"
    gloss: 'Парикмахер спрашивает: Хорошо, какую причёску вы хотите?'
    note: '*what style do you want* значит «какую причёску вы хотите».'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Пожелание Даниэля
    gloss: 'Даниэль говорит: Ту же причёску, только немного короче.'
    note: '*just a little shorter* значит «только немного короче».'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: Вопрос Мии
    gloss: 'Миа спрашивает: Можете сначала вымыть ему голову?'
    note: '*Can you wash his hair first?* значит «Можете сначала вымыть ему голову?».'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: Ответ парикмахера
    gloss: 'Парикмахер говорит: Конечно, это входит в стоимость стрижки.'
    note: '*included with* значит «входит в стоимость».'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: Даниэль спрашивает о цене
    gloss: 'Даниэль спрашивает: Отлично. Сколько это стоит?'
    note: '*Great.* здесь значит «Отлично» и используется как короткая реакция.'
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: Цена
    gloss: 'Парикмахер говорит: Двадцать долларов.'
    note: Повторение уже изученной фразы.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: Текст о визите в парикмахерскую
    gloss: 'Визит в парикмахерскую: На следующей неделе к Даниэлю должна была приехать из Чикаго сестра, поэтому он решил постричься. Миа посоветовала своего любимого парикмахера в небольшом салоне рядом с её домом и пошла вместе с ним. Парикмахер спросила, какую причёску он хочет, и Даниэль ответил, что ту же, только немного короче. Сначала она вымыла ему голову — это входило в стоимость стрижки. Стрижка стоила двадцать долларов. Когда всё было готово, Миа сказала, что он отлично выглядит. По дороге домой они встретились с Лейлой за чашкой кофе. После простуды Лейле было уже гораздо лучше, и новая причёска Даниэля ей тоже очень понравилась.'
    note: '*looked great* значит «отлично выглядел».'
