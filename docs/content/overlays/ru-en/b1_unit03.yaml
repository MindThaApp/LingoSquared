    title: If there's another one, you should join
teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: если
    note: '*if* вводит условие. Как и в русском, «если» (*if*) отличается от «когда» (*when*): *if* означает только условие, а *when* — время.'
    example_gloss: Если пойдёт дождь, мы останемся дома.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: дождь / идти (о дожде)
    note: '*rain* — вода, которая падает с неба, или глагол «идти (о дожде)».'
    example_gloss: На этих выходных может пойти дождь.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: остаться дома
    note: '*stay home* значит не выходить из дома и остаться дома.'
    example_gloss: Если пойдёт дождь, мы останемся дома.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: выходные
    note: '*weekend* — суббота и воскресенье.'
    example_gloss: Какие у тебя планы на выходные?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: свободное время
    note: '*free time* — время, когда вы не работаете и не заняты.'
    example_gloss: В последнее время у меня мало свободного времени.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: рисовать
    note: '*paint* значит создавать картину красками.'
    example_gloss: Лейла любит рисовать по выходным.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: Если завтра пойдёт дождь, мы останемся дома.
    note: '*if + настоящее время, will + начальная форма* выражает реальное, возможное условие в будущем.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: Если на этих выходных у меня будет свободное время, я буду рисовать.
    note: 'Та же конструкция: *if + настоящее время, will + начальная форма*.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: Если пойдёт дождь, мы останемся дома. Если у меня будет время, я буду рисовать.
    note: После *if* английский здесь использует настоящее время, хотя речь о будущем, — не *will rain*. В русском после «если» тоже можно сказать «пойдёт», но в английском так нельзя.
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: бы
    note: '*would* + начальная форма выражает нереальную или гипотетическую ситуацию в настоящем.'
    example_gloss: Если бы у меня было больше времени, я бы рисовала каждый день.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: занятие / курс
    note: '*class* — организованное занятие или курс с преподавателем.'
    example_gloss: Недалеко от её дома был курс рисования.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: Лейла любит рисовать, но у неё мало свободного времени. Если бы у неё было больше свободного времени, она бы рисовала каждый день. В прошлом месяце недалеко от её дома был курс рисования. Если бы она узнала о нём раньше, она бы записалась. Теперь она каждую неделю проверяет, нет ли новых курсов.
    note: Короткий текст с нереальной ситуацией в настоящем и нереальной ситуацией в прошлом.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: 'Дэниел говорит: Какие у тебя планы на выходные?'
    note: Простой открытый вопрос, чтобы начать разговор.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: 'Лейла говорит: Если не будет дождя, я пойду гулять. Если будет дождь, я останусь дома и буду рисовать.'
    note: Два реальных условия подряд, в зависимости от погоды.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: 'Дэниел говорит: Звучит здорово. Ты ходила на тот курс рисования в прошлом месяце?'
    note: Уточняющий вопрос о том, что было в прошлом.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: 'Лейла говорит: Нет. Если бы я узнала о нём раньше, я бы записалась.'
    note: '*if + past perfect, would have + причастие* выражает нереальное прошлое или сожаление.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: 'Дэниел говорит: Жаль. Если будет ещё один, тебе стоит записаться.'
    note: Дэниел использует *should*, чтобы подбодрить Лейлу воспользоваться следующей возможностью.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: 'Лейла говорит: Ты прав. Если увижу такой, сразу запишусь.'
    note: Новое реальное условие о будущем, уже не гипотетическое.
