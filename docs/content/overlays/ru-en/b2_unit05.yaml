course:
  title: Английский B2
  description: Английский на уровне B2 для тонких разговоров, аргументации, предположений и профессиональных дискуссий, с объяснениями на неформальном русском.
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: Неформальный, деловой и официальный стиль
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: 'Чтение: три адресата'
  en.b2.unit05.lesson04.the_register_dialogue:
    title: To a friend, yes. To the clinic, no.
teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: регистр, степень формальности речи
    note: '*register* — это то, насколько формально или неформально ты звучишь. В русском есть «ты» и «вы», а в английском только одно *you*, поэтому тон передаётся прежде всего формулировкой.'
    example_gloss: Регистр меняется, когда меняется адресат.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: неформальный, непринуждённый
    note: '*casual* подходит для друга или знакомого. Это более прямой стиль, но не обязательно невежливый.'
    example_gloss: Неформальное сообщение подходит для друга.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: деловой, вежливо-профессиональный
    note: '*professional* подходит для коллеги: вежливо и чётко, но без лишней официальности.'
    example_gloss: Деловое сообщение подходит для коллеги.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: официальный, формальный
    note: '*formal* подходит для учреждения. В английском это обычно передаётся более длинными и непрямыми просьбами.'
    example_gloss: Официальное сообщение подходит для учреждения.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: аудитория, адресат
    note: '*audience* — это человек или группа, для которых ты пишешь или говоришь.'
    example_gloss: Твой адресат влияет на выбор слов.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: учреждение, организация
    note: '*institution* — это организация, например клиника, банк или университет.'
    example_gloss: Клиника — это учреждение.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Официальная просьба
    gloss: Буду признателен, если Вы подтвердите, можно ли перенести мою запись на пятницу.
    note: '*I would be grateful if you could...* — официальная формула. В английском для вежливости не нужно другое слово вместо *you*: она создаётся всей конструкцией.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Неформальная просьба
    gloss: Можешь перенести это на пятницу?
    note: '*Can you...?* хорошо подходит для друга, но для учреждения звучит слишком прямо.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Деловая просьба
    gloss: Можем ли мы перенести встречу на пятницу, если пятница тебе всё ещё подходит?
    note: '*Could we...?* звучит вежливо и как совместное решение, для коллеги это то, что нужно.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: Уважаемая команда по планированию,
    note: '*Dear...* — обычное официальное обращение в письме. Оно звучит менее торжественно, чем русское «Уважаемые...».'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Смена регистра
    gloss: Когда меняешь регистр, содержание оставляй тем же. В неформальном английском можно задавать прямые вопросы. В деловом английском часто используется could. В официальном английском часто используется I would be grateful if you could.
    note: 'Не своди всё к выбору между «ты» и «вы»: в английском меняется вся фраза.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: чопорный, слишком официальный
    note: '*stiff* значит, что сообщение звучит излишне официально для данной ситуации.'
    example_gloss: Чопорное сообщение звучит слишком официально для этой ситуации.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: уместный, подходящий
    note: '*appropriate* значит, что формулировка подходит адресату и ситуации.'
    example_gloss: Уместное сообщение подходит адресату.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Текст для чтения: одно сообщение, три адресата'
    gloss: 'Нине нужно перенести запись на пятницу. Другу она пишет: Can you move it to Friday? Сообщение прямое и неформальное. Коллеге она пишет: Could we move the appointment to Friday if that still works for you? Сообщение деловое и вежливое. Клинике она пишет: I would be grateful if you could confirm whether my appointment can be moved to Friday. Содержание во всех трёх текстах одинаковое, но регистр меняется в зависимости от адресата.'
    note: В английском регистр меняется за счёт формулировки, а не отдельного слова для «вы».
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Нина спрашивает о формулировке
    gloss: 'Нина говорит: Мне нужно спросить, можно ли перенести мою запись. Можно ли мне просто написать: ''Can you move it?'''
    note: '*just write* показывает, что она сомневается, подходит ли прямая форма.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Оскар обращает внимание на регистр
    gloss: 'Оскар говорит: Другу — да. Клинике так звучит слишком неформально.'
    note: И здесь в английском просто используется *you*, но сама фраза слишком прямая для клиники.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Нина спрашивает о стиле для коллеги
    gloss: 'Нина спрашивает: Что бы ты написал коллеге?'
    note: Для коллеги нужен деловой, а не максимально официальный стиль.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Оскар предлагает вариант для коллеги
    gloss: 'Оскар говорит: Я бы написал: ''Could we move the appointment to Friday if that still works for you?'''
    note: '*Could we* и *if that still works for you* делают просьбу мягче.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Нина спрашивает о клинике
    gloss: 'Нина спрашивает: А клинике?'
    note: Для учреждения нужна более официальная структура просьбы.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Оскар предлагает официальный вариант
    gloss: 'Оскар говорит: Я бы написал: ''I would be grateful if you could confirm whether my appointment can be moved to Friday.'''
    note: Этот вариант не требует прямо что-то сделать, а просит подтверждения.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Нина подводит итог
    gloss: 'Нина говорит: То же сообщение, другой регистр.'
    note: 'Содержание остаётся прежним: перенести запись на пятницу.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Оскар соглашается
    gloss: 'Оскар говорит: Именно. Содержание остаётся тем же, но меняется степень формальности.'
    note: В этом суть владения регистром на уровне B2.
