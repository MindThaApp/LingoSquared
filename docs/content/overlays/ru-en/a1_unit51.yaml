  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: Аптекарь приветствует посетителей
    gloss: 'Аптекарь говорит: Здравствуйте, я могу вам помочь?'
    note: '*Hi, can I help you?* значит «Здравствуйте, я могу вам помочь?».'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Жалобы Лейлы
    gloss: 'Лейла говорит: Да, у меня сильный кашель и насморк.'
    note: Повторение уже изученной фразы.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: Аптекарь советует сироп
    gloss: 'Аптекарь говорит: У меня есть сироп от кашля, который должен помочь. Принимайте его перед сном.'
    note: '*before bed* значит «перед сном»; это указание относится к сиропу, а не к таблеткам.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: Вопрос Дэниела
    gloss: 'Дэниел спрашивает: А от боли в горле у вас тоже что-нибудь есть?'
    note: '*too* в конце предложения значит «тоже».'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: Аптекарь советует таблетки
    gloss: 'Аптекарь говорит: Да, эти таблетки хорошо помогают от боли в горле. Принимайте по одной каждые четыре часа.'
    note: 'Это дозировка таблеток: каждые четыре часа. Сироп принимают в другое время — перед сном.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: Решение Лейлы
    gloss: 'Лейла говорит: Отлично, я возьму и то и другое. Сколько это стоит?'
    note: '*I''ll take both.* значит «Я возьму и то и другое».'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: Цена
    gloss: 'Аптекарь говорит: Девять долларов.'
    note: Повторение уже изученной фразы.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Лейла платит
    gloss: 'Лейла говорит: Вот, пожалуйста. Спасибо!'
    note: '*Here you go.* значит «Вот, пожалуйста»; так говорят, передавая что-либо.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Текст о визите в аптеку
    gloss: 'Визит в аптеку: Через несколько дней после поездки в горы с Мией Лейла простудилась. У неё был сильный кашель, насморк и болело горло. Дэниел пошёл с ней в аптеку рядом с её домом. Аптекарь выслушал жалобы Лейлы и посоветовал сироп от кашля и таблетки. Сироп следовало принимать перед сном, а таблетки — по одной каждые четыре часа. За оба лекарства Лейла заплатила девять долларов. По дороге домой Дэниел также купил ей коробку бумажных платков. В тот вечер Лейла приняла лекарство, и к выходным кашель стал гораздо слабее.'
    note: '*by the weekend* значит «к выходным».'
