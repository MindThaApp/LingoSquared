teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: задержка
    note: '*delay* означает «задержка».'
    example_gloss: Поезд в 5:15 задерживается на сорок пять минут.
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: отменён
    note: '*cancelled* означает, что что-то не состоится. О поездах по-русски говорят: «поезд отменён».'
    example_gloss: Поезд в 5:15 не отменён, а только задерживается.
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: альтернатива
    note: '*alternative* означает другую возможность.'
    example_gloss: 'Сотрудник предложил альтернативу: автобус в 5:30.'
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: объявление
    note: '*notice* означает письменное объявление для пассажиров, например, на вокзале.'
    example_gloss: Я прочитал на вокзале объявление о задержке.
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: неполадка сигнализации
    note: '*signal problem* означает неисправность сигналов на железнодорожных путях.'
    example_gloss: Задержка вызвана неполадкой сигнализации на путях.
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: Вежливо спросить о причине
    gloss: Я хотел узнать, почему поезд задерживается.
    note: '*I was wondering why...* — вежливый, косвенный способ спросить о причине.'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: Спросить об альтернативе
    gloss: Есть ли другой способ добраться сегодня вечером домой?
    note: С *Is there another way to...?* спрашивают об альтернативах.
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: Назвать причину опоздания
    gloss: Поезд задерживается из-за неполадки сигнализации.
    note: С *has been delayed because of...* называют причину задержки.
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: время отправления
    note: '*departure time* означает «время отправления».'
    example_gloss: Новое время отправления — 6:00.
  en.a2.unit31.lesson03.teach.notice_text:
    title: Текст уведомления
    gloss: 'Объявление: Поезд в 5:15 задерживается из-за неполадки сигнализации. Новое время отправления — 6:00. В 5:30 у вокзала будет автобус.'
    note: Формальное объявление с причиной, новым временем и альтернативой.
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: Сообщить своё решение
    gloss: Я поеду на автобусе.
    note: '*instead* означает «вместо этого».'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: Сотрудник предлагает помощь
    gloss: 'Сотрудник спрашивает: Могу я вам помочь?'
    note: '*Can I help you?* — стандартный вопрос вокзального персонала.'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: Даниэль спрашивает о причине
    gloss: 'Дэниел говорит: Да, я хотел узнать, почему поезд задерживается.'
    note: Тот же вежливый вопрос, что и во втором уроке.
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: Сотрудник объясняет задержку
    gloss: 'Сотрудник говорит: На путях неполадка сигнализации. Новое время отправления — 6:00.'
    note: Сотрудник называет причину и новое время отправления.
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: Даниэль спрашивает об альтернативе
    gloss: 'Дэниел говорит: Есть ли другой способ добраться сегодня вечером домой?'
    note: Тот же вопрос, что и во втором уроке.
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: Сотрудник называет альтернативу
    gloss: 'Сотрудник говорит: В 5:30 от вокзала отправляется автобус.'
    note: Сотрудник называет конкретную альтернативу с временем и местом.
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: Окончательное решение Даниэля
    gloss: 'Дэниел говорит: Спасибо. Тогда я поеду на автобусе.'
    note: Дэниел благодарит сотрудника и сообщает своё решение.
