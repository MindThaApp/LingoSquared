teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: соглашаться
    note: '*agree* значит думать, что другой человек прав.'
    example_gloss: Я с тобой согласен.
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: не соглашаться, быть другого мнения
    note: '*disagree* значит думать, что другой человек не прав.'
    example_gloss: Я не согласен с этим мнением.
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: мнение
    note: '*opinion* значит личное мнение о чём-либо.'
    example_gloss: У каждого своё мнение.
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: считать, верить
    note: '*believe* значит думать, что что-то правда.'
    example_gloss: Я считаю, что это хорошая идея.
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: причина
    note: '*reason* значит объяснение, стоящее за мнением.'
    example_gloss: Почему ты так думаешь?
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: экономить время
    note: '*save time* значит тратить на что-то меньше времени.'
    example_gloss: Удалённая работа помогает мне экономить время.
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: Zustimmen und einen Grund nennen
    gloss: Я согласен, что работать из дома лучше, потому что экономишь время.
    note: '*I agree that... because...* соединяет мнение с причиной.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: Widersprechen und einen Grund nennen
    gloss: Я не согласен, что это лучше, потому что скучаешь по коллегам.
    note: '*I disagree that... because...* соединяет противоположное мнение с причиной.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: Я согласен, что так лучше. Я не согласен, что так лучше.
    note: После *agree*/*disagree* слово *that* вводит придаточное предложение с мнением, с которым соглашаются или не соглашаются. В отличие от русского «что», в английском перед *that* запятая не ставится.
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: сосредоточиться
    note: '*focus* значит направить внимание на что-то.'
    example_gloss: Дома ей легче сосредоточиться.
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: уважать
    note: '*respect* значит уважать мнение другого человека, даже если вы не согласны.'
    example_gloss: Они уважают мнение друг друга.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'Lesetext: zwei Meinungen'
    gloss: Миа считает, что работать из дома лучше, потому что ей там легче сосредоточиться. Лейла не согласна. Она считает, что лучше ходить в офис, потому что ей нравится каждый день видеть коллег. Они не сходятся во мнениях, но уважают мнение друг друга.
    note: Короткий текст с двумя противоположными мнениями.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel eröffnet die Debatte
    gloss: 'Дэниел говорит: Ты думаешь, работать из дома лучше, чем в офисе?'
    note: Открытый вопрос, чтобы начать спор.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila sieht das anders
    gloss: 'Лейла говорит: Я не согласна, что так лучше. Я думаю, что теряешь важные разговоры с коллегами.'
    note: Лейла называет своё мнение и причину.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel erkennt Leilas Argument an, bleibt aber bei seiner Meinung
    gloss: 'Дэниел говорит: Справедливое замечание, но я согласен, что это экономит много времени.'
    note: '*that''s a fair point* признаёт мнение другого человека, прежде чем высказать своё.'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila gibt etwas zu, bleibt aber bei ihrer Vorliebe
    gloss: 'Лейла говорит: Я согласна, что это экономит время, но я всё равно больше люблю офис.'
    note: Лейла признаёт один довод, не меняя своего общего мнения.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel beendet das Gespräch
    gloss: 'Дэниел говорит: Понятно. У каждого своё мнение.'
    note: Естественный, дружелюбный способ закончить спор.
