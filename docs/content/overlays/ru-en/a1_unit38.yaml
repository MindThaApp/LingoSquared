    example_gloss: Мыть посуду — самое нелюбимое моё домашнее дело.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: посуда
    note: '*dishes* значит «посуда»: тарелки, чашки и столовые приборы, которые нужно мыть.'
    example_gloss: Я мою посуду после ужина.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: стирка
    note: '*laundry* значит «стирка», «бельё»: одежда, которую стирают, сушат и складывают.'
    example_gloss: Она стирает по воскресеньям.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: пылесосить
    note: '*vacuum* значит «пылесосить».'
    example_gloss: Он каждую субботу пылесосит гостиную.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
