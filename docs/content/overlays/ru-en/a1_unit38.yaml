    note: '*trash* значит «мусор».'
    example_gloss: Ты можешь вынести мусор?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: убирать
    note: '*clean* значит «убирать», «чистить».'
    example_gloss: Мы вместе убираем квартиру.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: мыть посуду
    note: '*wash the dishes* значит «мыть посуду». *Do the dishes* так же употребительно и значит то же самое.'
    example_gloss: Я каждый вечер мою посуду.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: стирать
    note: '*do the laundry* значит «стирать», «заниматься стиркой».'
    example_gloss: Она стирает по воскресеньям.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: вынести мусор
    note: В *take out the trash* используется *take out*, а не *do*. В отличие от *do the laundry* и *do the dishes*, здесь *do* не подходит.
    example_gloss: Ты можешь вынести мусор?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: убрать в ванной
    note: '*clean the bathroom* значит «убрать в ванной», «вычистить ванную».'
    example_gloss: Он по выходным убирает в ванной.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: нужно
    note: '*need to* значит «нужно что-то сделать».'
    example_gloss: В эти выходные мне нужно пропылесосить гостиную.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: Можешь помочь мне с посудой?
    note: Вежливый способ попросить о помощи с домашним делом.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 'Мия говорит: В моей квартире бардак. В эти выходные ко мне придут гости.'
    note: '*a mess* значит «бардак», «беспорядок».'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: Предложение Даниэля
    gloss: 'Даниэль спрашивает: Хочешь, помогу с уборкой?'
    note: '*Do you want some help ...ing?* — естественный способ предложить помощь.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Ответ: Миа"
    gloss: 'Мия говорит: Да, пожалуйста! Мне нужно пропылесосить гостиную и помыть посуду.'
    note: '*I need to* + глагол значит «мне нужно» + глагол.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: Предложение Даниэля
    gloss: 'Даниэль говорит: Я могу пропылесосить за тебя. А ты можешь помыть посуду.'
    note: '*for you* здесь значит «за тебя», «вместо тебя».'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Дополнение Мии
    gloss: 'Мия говорит: Спасибо! Мне ещё нужно постирать.'
    note: '*still need to* значит «ещё нужно».'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: Предложение Даниэля
    gloss: 'Даниэль говорит: На это у меня сегодня нет времени, но я могу вынести мусор перед уходом.'
    note: '*before I leave* значит «перед тем как я уйду».'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Благодарность Мии
    gloss: 'Мия говорит: Это очень помогло бы. Огромное спасибо!'
    note: '*That would help a lot* значит «это очень помогло бы». *Would* делает фразу вежливее.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Текст о домашних делах
    gloss: У Даниэля, Лейлы и Мии у каждого свои привычки в домашних делах. Даниэль каждый вечер после ужина моет посуду, а по субботам пылесосит квартиру. Лейла не против стирки, но терпеть не может убирать в ванной. Кошка Мии, Луна, оставляет шерсть повсюду, поэтому Мия пылесосит квартиру почти каждый день. В прошлые выходные к Мии должны были прийти гости, и Даниэль предложил ей помощь. Он пропылесосил гостиную и вынес за неё мусор. Мия была очень благодарна ему за помощь.
    note: '*doesn''t mind* значит «не против», «не возражает».'
