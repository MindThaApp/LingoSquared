    title: Cafe Menu
    gloss: 'Меню кафе: Кофе — 3 доллара. Чай — 2 доллара. Суп — 5 долларов. Сэндвич — 6 долларов.'
    note: Знак доллара в английском ставится ПЕРЕД числом (*$3*), а в русском валюта пишется после числа (3 доллара или 3 $).
