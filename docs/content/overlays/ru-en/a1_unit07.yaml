    gloss: 'Лейла: Здравствуйте, я хотела бы кофе и сэндвич, пожалуйста.'
    note: '*Hi* — непринуждённое приветствие, подходящее для кафе.'
  en.a1.unit07.lesson04.teach.a_anything_else:
    title: Уточнение официанта
    gloss: 'Официант: Конечно. Что-нибудь ещё?'
    note: '*Sure* здесь означает «конечно» или «с удовольствием».'
  en.a1.unit07.lesson04.teach.reply_thats_all:
    title: Ответ Лейлы
    gloss: 'Лейла: Нет, это всё, спасибо.'
    note: Полный ответ подтверждает, что заказ закончен.
  en.a1.unit07.lesson04.teach.q_for_here:
    title: Вопрос официанта
    gloss: 'Официант: Здесь или с собой?'
    note: Этот вопрос в американских кафе часто задают после заказа.
  en.a1.unit07.lesson04.teach.reply_for_here:
    title: Ответ Лейлы
    gloss: 'Лейла: Здесь, пожалуйста.'
    note: '*For here* показывает, что Лейла хочет остаться в кафе.'
  en.a1.unit07.lesson04.teach.closing_price:
