teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: опыт
    note: '*experience* означает «опыт», особенно профессиональный.'
    example_gloss: У меня два года опыта работы в маркетинге.
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: должность
    note: '*position* означает должность или место работы в компании.'
    example_gloss: Эта должность предназначена для координатора по маркетингу.
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: готовность приступить к работе (когда вы свободны)
    note: '*availability* означает, когда у вас есть время, например, чтобы приступить к работе.'
    example_gloss: Интервьюер спросил меня, когда я смогу начать работать.
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: сильная сторона
    note: '*strength* означает то, что у вас получается особенно хорошо.'
    example_gloss: Одна из моих сильных сторон — умение организовывать себя.
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: требование
    note: '*requirement* означает то, что требуется для должности.'
    example_gloss: Два года опыта работы — требование для этой должности.
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: Описать свой опыт
    gloss: У меня два года опыта работы в маркетинге в социальных сетях.
    note: Этим предложением вы на собеседовании описываете свой профессиональный опыт.
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: Назвать сильную сторону
    gloss: Одна из моих сильных сторон — умение организовывать себя.
    note: '*One of my strengths is...* — обычный способ назвать сильную сторону на собеседовании.'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: Назвать, когда вы свободны
    gloss: Я могу приступить к работе в следующий понедельник.
    note: С *I'm available to start...* вы говорите, с какого момента можете начать работать.
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: резюме
    note: '*resume* означает «резюме». Это слово употребляется в основном в американском английском.'
    example_gloss: Пожалуйста, принесите резюме на собеседование.
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: крайний срок
    note: '*deadline* означает срок, к которому что-то должно быть готово.'
    example_gloss: На работе я всегда укладываюсь в сроки.
  en.a2.unit30.lesson03.teach.posting_text:
    title: Текст объявления о вакансии
    gloss: 'Компания Bright Path Marketing ищет координатора по маркетингу. Требования: два года опыта, хорошие навыки письма и готовность приступить к работе немедленно. Пожалуйста, принесите резюме на собеседование.'
    note: Формальное объявление о вакансии с требованиями и указанием.
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: Рассказать о своём способе работы
    gloss: Я укладываюсь в сроки и хорошо работаю в команде.
    note: '*I meet deadlines* и *I work well in a team* — полезные предложения, чтобы описать свой стиль работы.'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: Интервьюер спрашивает об опыте
    gloss: 'Интервьюер говорит: Спасибо, что пришли сегодня. Расскажите, пожалуйста, о вашем опыте.'
    note: '*Thank you for coming in today* — вежливое начало собеседования.'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Ответ Мии об опыте
    gloss: 'Миа говорит: У меня два года опыта работы в маркетинге в социальных сетях. Кроме того, я руководила небольшой командой.'
    note: 'То же предложение об опыте, что и во втором уроке, с дополнительной деталью: она руководила командой.'
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: Спросить о сильной стороне
    gloss: 'Интервьюер говорит: Это здорово. Какая у вас сильная сторона?'
    note: Интервьюер реагирует положительно и задаёт следующий вопрос.
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Ответ Мии о её сильной стороне
    gloss: 'Миа говорит: Я очень организованна и укладываюсь в сроки.'
    note: Миа называет свою сильную сторону (организованность) и конкретный пример (соблюдение сроков).
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: Спросить, есть ли ещё вопросы
    gloss: 'Интервьюер спрашивает: У вас есть вопросы о должности?'
    note: Устойчивый вопрос в конце собеседования.
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Миа задаёт свой вопрос
    gloss: 'Миа говорит: Да, мне было бы интересно узнать, как выглядит типичная рабочая неделя на этой должности.'
    note: '*I was wondering...* — вежливый способ самому задать вопрос.'
