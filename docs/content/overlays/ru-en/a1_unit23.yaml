teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: учитель, учительница
    note: '*teacher* значит «учитель» или «учительница». В английском род здесь не различают: *teacher* подходит для обоих.'
    example_gloss: Лейла — учительница.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: медбрат, медсестра
    note: '*nurse* значит «медбрат» или «медсестра». Для мужчин и женщин слово одно и то же.'
    example_gloss: Я медбрат/медсестра.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: инженер
    note: '*engineer* значит «инженер». Перед гласным стоит *an*: *an engineer*.'
    example_gloss: Дэниел — инженер.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: повар
    note: '*cook* значит «повар»; это слово ещё и глагол («готовить»).'
    example_gloss: Мой брат — повар.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: водитель
    note: '*driver* значит «водитель». В *bus driver* сначала называют транспорт, а потом *driver*, то есть «водитель автобуса».'
    example_gloss: Он водитель автобуса.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: Кем ты работаешь?
    note: Вопросом *What do you do?* ты спрашиваешь о профессии. Дословно это «Что ты делаешь?», а по смыслу — «Кем ты работаешь?».
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Я медбрат/медсестра.
    note: 'Фразой *I''m a...* ты называешь свою профессию. Следи за артиклем: по-русски говорят просто «Я учитель», а в английском перед профессией обязательно стоит *a* или *an*.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: Где ты работаешь?
    note: Вопросом *Where do you work?* ты спрашиваешь о месте работы.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: пациенты
    note: '*patients* значит «пациенты» (множественное число). Слово произносится *PAY-shents*.'
    example_gloss: Я каждый день помогаю пациентам.
  en.a1.unit23.lesson03.teach.profile_text:
    title: Текст о профессии
    gloss: Я медбрат/медсестра. Я работаю в больнице. Я помогаю пациентам и каждый день пишу отчёты.
    note: В этом коротком рассказе человек говорит о своей профессии и ежедневной работе.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: Это интересная работа.
    note: '*interesting* значит «интересный».'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: Спрашиваем Дэниела о профессии
    gloss: 'Лейла спрашивает: Дэниел, кем ты работаешь?'
    note: Тот же вопрос, что и во втором уроке, только теперь с именем.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: Я инженер. Я работаю в небольшой компании в центре города.'
    note: Дэниел называет свою профессию и говорит, где он работает.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: Спрашиваем о ежедневных обязанностях
    gloss: 'Лейла спрашивает: Чем ты занимаешься каждый день?'
    note: Этот вопрос о ежедневных обязанностях.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: Я пишу отчёты и отвечаю на электронные письма. Иногда я встречаюсь с клиентами.'
    note: Дэниел называет несколько дел, которые он делает каждый день.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: Спрашиваем, нравится ли Дэниелу работа
    gloss: 'Лейла спрашивает: Тебе нравится твоя работа?'
    note: Вопросом *Do you like your job?* ты спрашиваешь, нравится ли человеку его работа.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: Да, очень. Это интересная работа.'
    note: Дэниел говорит «да» и называет причину.
