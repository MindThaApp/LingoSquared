    example_gloss: Официант очень приветливый.
  en.a1.unit56.lesson01.teach.table:
    title: table
    gloss: стол
    note: '*table* означает «стол».'
    example_gloss: Наш столик стоит у окна.
  en.a1.unit56.lesson01.teach.menu:
    title: menu
    gloss: меню
    note: '*menu* означает «меню».'
    example_gloss: Можно посмотреть меню, пожалуйста?
  en.a1.unit56.lesson01.teach.order:
    title: order
    gloss: заказывать
    note: '*order* означает «заказывать».'
    example_gloss: Я хотел бы заказать курицу.
  en.a1.unit56.lesson01.teach.bill:
    title: bill
    gloss: счёт
    note: '*bill* означает «счёт».'
    example_gloss: Счёт был на десять долларов.
  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: Этот столик свободен?
    note: '*free* здесь значит «свободный, не занятый» — как и русское «свободно».'
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: Можно мне сейчас сделать заказ?
    note: '*Can I...?* — прямой способ попросить о чём-то, менее формальный, чем *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: Я бы хотел салат, пожалуйста.
    note: '*I''d like* (сокращение от *I would like*) — вежливый способ сделать заказ.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: Сколько стоит салат?
    note: '*How much is...?* спрашивает о цене.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: Можно нам счёт, пожалуйста?
    note: '*Could we have...?* — вежливый способ попросить. По-русски вежливость часто передают словами «пожалуйста» и «можно», а в английском её естественно выражает форма *could*.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: Приятного аппетита!
    note: '*Enjoy your meal!* — устойчивое выражение, которое официант говорит перед тем, как вы начнёте есть. Буквально это «наслаждайтесь вашей едой», а русское «Приятного аппетита!» построено иначе. Учи эту фразу целиком, а не по словам.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Лейла спрашивает про столик
    gloss: 'Лейла говорит: Привет! Этот столик свободен?'
    note: В *Is this table free?* слово *free* значит «свободный, не занятый».
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: Официант показывает столик
    gloss: 'Официант говорит: Да, садитесь здесь, пожалуйста.'
    note: '*please sit here* — короткое вежливое приглашение.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Миа просит меню
    gloss: 'Миа говорит: Можно посмотреть меню, пожалуйста?'
    note: '*Could I see...?* — снова вежливое *could*, как в *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: Официант приносит меню
    gloss: 'Официант говорит: Конечно, вот, пожалуйста.'
    note: '*Of course, here you are* — устойчивая фраза, когда что-то подают.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: Заказ Лейлы
    gloss: 'Лейла говорит: Я бы хотела курицу, пожалуйста.'
    note: 'Отдельный факт: Лейла заказала курицу.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: Заказ Мии
    gloss: 'Миа говорит: Я бы хотела салат, пожалуйста.'
    note: 'Отдельный факт: Миа заказала салат.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: Официант желает приятного аппетита
    gloss: 'Официант говорит: Отличный выбор! Приятного аппетита!'
    note: '*Enjoy your meal!* — устойчивая заключительная фраза, прежде чем гости начнут есть.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Лейла спрашивает цену курицы
    gloss: 'Лейла говорит: Сколько стоит курица?'
    note: '*How much is...?* спрашивает о цене.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: Цена курицы
    gloss: 'Официант говорит: Курица стоит двенадцать долларов.'
    note: 'Отдельный факт: цена курицы, отдельно от салата и общего счёта.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Миа спрашивает цену салата
    gloss: 'Миа говорит: Сколько стоит салат?'
    note: '*How much is...?* — тот же вопрос, что и про курицу.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: Цена салата
    gloss: 'Официант говорит: Салат стоит семь долларов.'
    note: 'Второй отдельный факт: цена салата.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Лейла просит счёт"
    gloss: 'Лейла говорит: Можно нам счёт, пожалуйста?'
    note: '*Could we have...?* — снова вежливое *could*.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: Общий счёт
    gloss: 'Официант говорит: С вас девятнадцать долларов, пожалуйста.'
    note: 'Третий отдельный факт: общий счёт, а не отдельные цены курицы и салата.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Меню
    gloss: 'Меню ресторана: курица — $12. Салат — $7. Пицца — $10. Сок — $3.'
    note: В меню четыре блюда с ценами.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Текст: обед в ресторане'
    gloss: Однажды вечером Лейла и Миа решили попробовать новый ресторан в центре города. Официант проводил их к столику у окна. Он принёс им меню с курицей, салатом, пиццей и соком. Лейла заказала курицу, а Миа заказала салат. Курица стоила двенадцать долларов, а салат — семь долларов. Пока они ели, они говорили о занятиях Мии по фотографии. Когда они закончили, официант принёс счёт. С них двоих вышло девятнадцать долларов. Лейла сказала, что ресторан отличный, а Миа сказала, что хочет в следующий раз привести сюда Даниэля.
    note: '*ordered* — прошедшее время от *order* («заказывать»).'
