teaching:
  en.a1.unit56.lesson01.teach.restaurant:
    title: restaurant
    gloss: ресторан
    note: '*restaurant* означает «ресторан».'
    example_gloss: Этот ресторан открыт каждый вечер.
  en.a1.unit56.lesson01.teach.waiter:
    title: waiter
    gloss: официант
