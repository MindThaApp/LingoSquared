teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: пока; в то время как
    note: '*while* значит, что что-то происходит одновременно с чем-то другим.'
    example_gloss: Пока я ехал, пошёл дождь.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: спущенное колесо, прокол
    note: '*flat tire* — колесо без воздуха, которое больше не работает.'
    example_gloss: На шоссе у меня спустило колесо.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: съехать на обочину
    note: '*pull over* значит остановить машину у края дороги.'
    example_gloss: Мне пришлось сразу съехать на обочину.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: незнакомец, посторонний
    note: '*stranger* значит человека, которого вы не знаете.'
    example_gloss: Незнакомый человек остановился, чтобы мне помочь.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: автомеханик
    note: '*mechanic* значит человека, который чинит машины.'
    example_gloss: Механик быстро починил мне колесо.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: сказал, что
    note: '*said that* используют, чтобы передать то, что сказал кто-то другой.'
    example_gloss: Он сказал, что может помочь.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Hintergrundgeschehen mit 'while'
    gloss: Когда я ехал на работу, у меня спустило колесо.
    note: '*while* + прошедшее время с *was/were* + -ing описывает фон, который прерывается чем-то другим.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Folgendes Ereignis mit 'when'
    gloss: Когда я съехал на обочину, остановился незнакомец, чтобы помочь.
    note: '*when* вводит следующее событие в истории.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: Пока я ехал, у меня спустило колесо. Когда я съехал на обочину, мне помог незнакомец.
    note: '*while* отмечает фон (длящееся действие); *when* отмечает следующее, более короткое событие, которое в нём происходит.'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: уже позвонил
    note: '*had already* + причастие описывает то, что уже произошло до другого момента в прошлом.'
    example_gloss: Когда он приехал, я уже позвонила Дэниелу.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: сдержал слово
    note: '*kept his word* значит, что человек сделал то, что обещал.'
    example_gloss: Он сдержал слово и починил колесо за десять минут.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: Вчера утром, пока Лейла ехала на работу, у неё вдруг спустило колесо. Она съехала на обочину тихой улицы. Незнакомец остановил свою машину и предложил помочь. К тому времени, когда приехал механик, Лейла уже позвонила Дэниелу, чтобы сказать, что опоздает. Механик сказал, что может починить колесо за десять минут. Он сдержал слово, и Лейла пришла на работу всего на двадцать минут позже.
    note: История в прошедшем времени с фоном (*while*), последовательностью событий (*when*) и тем, что уже произошло раньше (*had already*).
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel bemerkt, dass Leila zu spät ist
    gloss: 'Дэниел говорит: Ты опаздываешь! Что случилось?'
    note: Прямой, обеспокоенный вопрос, с которого начинается история.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila beginnt ihre Geschichte
    gloss: 'Лейла говорит: Пока я ехала на работу, у меня вдруг спустило колесо.'
    note: '*while* отмечает фон, на котором произошло что-то другое.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel fragt nach
    gloss: 'Дэниел говорит: О нет! Что ты сделала?'
    note: Короткий уточняющий вопрос, чтобы услышать продолжение истории.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila erzählt weiter
    gloss: 'Лейла говорит: Я съехала на обочину, и незнакомец остановился, чтобы мне помочь.'
    note: Следующее событие в истории после фона.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reagiert und fragt weiter
    gloss: 'Дэниел говорит: Как мило с его стороны. Ты вызвала механика?'
    note: '*that was kind of him* — естественная реакция на чью-то доброту.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila beendet die Geschichte
    gloss: 'Лейла говорит: Да, я уже вызвала механика до того, как приехал незнакомец. Механик сказал, что может починить за десять минут, и он это сделал!'
    note: '*had already called* показывает, что уже произошло до приезда незнакомца.'
