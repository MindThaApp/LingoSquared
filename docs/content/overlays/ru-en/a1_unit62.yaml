course:
  title: Английский A1
  description: 'Английский уровня A1: приветствия и короткие разговоры в повседневных ситуациях, с подробными объяснениями на русском языке.'
units:
  en.a1.unit62.phone_calls:
    title: Телефонные разговоры
lessons:
  en.a1.unit62.lesson01.phone_words:
    title: Слова для телефонных разговоров
  en.a1.unit62.lesson02.phone_phrases:
    title: Фразы для разговора по телефону
  en.a1.unit62.lesson03.dialogue_on_the_phone:
    title: 'Разговор: по телефону'
  en.a1.unit62.lesson04.phone_message:
    title: 'Читаем: телефонное сообщение'
teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: телефон
    note: '*phone* значит «телефон». В повседневной речи *phone* чаще всего означает мобильный телефон.'
    example_gloss: Мой телефон здесь.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: звонить / звонок
    note: '*call* может быть звонком или значить «звонить»: *a call* (существительное), *to call* (глагол).'
    example_gloss: Я могу тебе позвонить.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: сообщение
    note: '*message* значит «сообщение».'
    example_gloss: Оставьте сообщение.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: голосовое сообщение, автоответчик
    note: '*voicemail* значит записанное голосовое сообщение (автоответчик).'
    example_gloss: Голосовое сообщение короткое.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: повторять
    note: '*repeat* значит «повторить, сказать ещё раз».'
    example_gloss: Пожалуйста, повторите это.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: медленно
    note: '*slowly* значит «медленно». Это наречие на *-ly*; в русском «медленно» — наречие, а «медленный» — отдельное прилагательное, а в английском *slow* и *slowly* тоже разные слова.'
    example_gloss: Пожалуйста, говорите медленно.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Здравствуйте, это Лейла.
    note: По телефону в английском говорят *this is...*, чтобы сказать, кто звонит. *My name is...* по телефону звучит необычно.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: Могу я поговорить с Мией?
    note: '*speak to* значит «говорить с». Русское «с» здесь передаётся словом *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Пожалуйста, повторите это.
    note: '*Please repeat that* — вежливая просьба повторить.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Пожалуйста, говорите медленно.
    note: '*slowly* здесь стоит после глагола *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Оставьте сообщение.
    note: '*leave a message* — устойчивое выражение «оставить сообщение».'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Я перезвоню позже.
    note: '*call back* значит «перезвонить». Частица *back* стоит после глагола, как приставка «пере-» в слове «перезвонить».'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Миа отвечает на звонок
    gloss: 'Миа говорит: Алло, это Миа.'
    note: '*this is Mia* по телефону звучит естественно.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Лейла называет себя
    gloss: 'Лейла говорит: Привет, Миа, это Лейла.'
    note: Говоря о себе по телефону, используй *this is*.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Лейла плохо слышит
    gloss: 'Лейла говорит: Я тебя плохо слышу.'
    note: '*can''t hear you well* значит «плохо тебя слышать».'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Лейла просит говорить медленно
    gloss: 'Лейла говорит: Пожалуйста, говори медленнее.'
    note: '*Please speak slowly* — вежливая просьба.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Миа называет время
    gloss: 'Миа говорит: Конечно. Совещание в четыре часа.'
    note: '*at four* — с временем используется *at*.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Лейла просит повторить
    gloss: 'Лейла говорит: Пожалуйста, повтори это.'
    note: '*repeat that* относится к тому, что только что было сказано.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: 'Миа повторяет: четыре часа'
    gloss: 'Миа говорит: Четыре часа.'
    note: '*Four o''clock* — ровное время, без минут.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Лейла перезвонит позже
    gloss: 'Лейла говорит: Спасибо. Я перезвоню позже.'
    note: '*I''ll* — краткая форма от *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: Телефонное сообщение
    gloss: 'Телефонное сообщение: Миа звонила в 3:00. Совещание в комнате 5. Пожалуйста, перезвоните.'
    note: В сообщении указано, кто звонил, время, комната и что нужно сделать.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'Текст: короткий телефонный разговор'
    gloss: 'Короткий телефонный разговор: Миа позвонила Лейле днём. Звук был нечётким, поэтому Лейла попросила Мию говорить медленно. Миа сказала, что совещание в четыре часа в комнате 5. Лейла попросила Мию повторить время. Позже Лейла написала телефонное сообщение. В сообщении говорилось, что Миа звонила в 3:00 и просила перезвонить.'
    note: '*called* — прошедшее время от *call*.'
