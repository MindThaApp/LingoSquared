teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: заказ
    note: '*order* — сам заказ. Как глагол *to order* означает «заказывать».'
    example_gloss: Мой заказ пришёл на два дня позже.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: доставка
    note: '*delivery* — момент, когда ваш заказ привозят вам домой.'
    example_gloss: Доставка пришла во вторник утром.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: посылка
    note: '*parcel* — упакованная посылка, которую оставляют у вашей двери.'
    example_gloss: Посылку оставили снаружи у моей двери.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: повреждённый
    note: '*damaged* говорит, что вещь повредили в пути, но она, возможно, ещё работает. Обычно так говорят об упаковке.'
    example_gloss: Коробка была повреждена, когда пришла.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: сломанный
    note: '*broken* сильнее, чем *damaged*: вещь больше не работает.'
    example_gloss: Лампа в посылке была сломана.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: замена, замена товара
    note: '*replacement* — новый экземпляр вместо сломанного. *refund* — возврат денег.'
    example_gloss: Я попросила замену, а не возврат денег.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived und has not arrived yet
    gloss: Мой заказ пришёл вчера. Мой заказ ещё не пришёл.
    note: '*arrived* используют с указанием момента в прошлом. *has not arrived yet* говорит, что вы всё ещё ждёте.'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Sagen, wofür Sie anrufen
    gloss: Я хотела бы сообщить о проблеме с моим заказом.
    note: '*I''d like to report a problem with ...* — та же вежливая форма, что и в случае с протечкой в уроке 29.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Sagen, was nicht stimmt
    gloss: Лампа пришла сломанной.
    note: '*arrived broken* значит: она была сломана уже при получении.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Zwischen Ersatz und Rückerstattung wählen
    gloss: Можно ли мне получить замену вместо возврата денег?
    note: '*instead of* противопоставляет две возможности: вы выбираете первую, а не вторую.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Ihre Bestellnummer nennen
    gloss: Номер моего заказа — 8154.
    note: Называйте номер заказа сразу, когда его спрашивают; по нему сотрудник находит ваш заказ.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of zum Auswählen
    gloss: Можно ли мне получить замену вместо возврата денег? Я хотела бы получить деньги обратно вместо обмена.
    note: 'После *instead of* стоит существительное или форма на -ing (*instead of a refund*, *instead of getting a refund*), но не начальная форма глагола: не *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: коробка
    note: '*box* — коробка, в которой лежит ваш заказ. *parcel* — вся посылка целиком, как её доставляют.'
    example_gloss: Лампа была в большой коробке.
  en.a2.unit40.lesson03.teach.return_message:
    title: Die Antwort des Shops
    gloss: Спасибо за ваше сообщение. Нам жаль, что ваша лампа пришла сломанной. Пожалуйста, положите лампу обратно в коробку и принесите её на почту. Новая лампа будет отправлена в течение трёх рабочих дней. Номер заказа 8154.
    note: 'Ответ службы поддержки всегда называет: проблему, что вам нужно сделать и что сделает магазин.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Was Sie mit der kaputten Lampe tun sollen
    gloss: Пожалуйста, положите лампу обратно в коробку и принесите её на почту.
    note: '*put ... back in ...* значит положить что-то обратно туда, откуда оно было взято.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila ruft den Online-Shop an
    gloss: 'Лейла говорит: Здравствуйте, я хотела бы сообщить о проблеме с моим заказом.'
    note: По телефону сразу говорят, зачем звонят.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: Der Mitarbeiter fragt nach
    gloss: 'Сотрудник говорит: Мне жаль это слышать. В чём проблема?'
    note: '*I''m sorry to hear that* — устойчивая вежливая реакция сотрудника на плохие новости.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila erklärt das Problem
    gloss: 'Лейла говорит: Лампа пришла сломанной. Коробка была повреждена.'
    note: 'Обрати внимание на разницу: коробка *damaged*, а лампа *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: Der Mitarbeiter fragt nach der Bestellnummer
    gloss: 'Сотрудник говорит: Понятно. Не могли бы вы назвать номер вашего заказа?'
    note: Та же форма косвенного вопроса *Could you tell me ...?*, что и в уроке 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila nennt ihre Bestellnummer
    gloss: 'Лейла говорит: Номер моего заказа — 8154.'
    note: То же предложение, что и во втором уроке.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet zwei Möglichkeiten an
    gloss: 'Сотрудник говорит: Спасибо. Вы хотите возврат денег или замену?'
    note: '*or* здесь ставит рядом две возможности; вы выбираете одну из них.'
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila wählt den Ersatz
    gloss: 'Лейла говорит: Можно ли мне получить замену вместо возврата денег?'
    note: Тот же вопрос, что и во втором уроке.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: Der Mitarbeiter regelt es
    gloss: 'Сотрудник говорит: Конечно. Новая лампа будет отправлена в течение трёх рабочих дней.'
    note: То же обещание, что и в сообщении из урока 3.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Mitarbeiter
    gloss: 'Лейла говорит: Большое спасибо.'
    note: '*very much* делает благодарность чуть выразительнее.'
