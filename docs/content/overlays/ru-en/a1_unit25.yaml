    note: '*always* означает «всегда»; стоит перед глаголом: *I always go running*.'
  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: часто
    note: '*often* означает «часто». Обрати внимание на порядок слов в английском: *She often cooks dinner* (подлежащее, *often*, глагол). В русском наречие можно ставить где угодно («Она часто готовит ужин», «Часто она готовит ужин»), а в английском оно занимает своё место перед глаголом, и подлежащее всегда стоит перед ним.'
  en.a1.unit30.lesson02.teach.sometimes:
    title: sometimes
    gloss: иногда
    note: '*sometimes* означает «иногда». В русском наречие в начале предложения не меняет порядок слов: «Иногда я хожу бегать». В английском так же подлежащее остаётся перед глаголом: *Sometimes I go running*. Следи, чтобы после *sometimes* сразу шло подлежащее, а не глагол.'
  en.a1.unit30.lesson02.teach.rarely:
