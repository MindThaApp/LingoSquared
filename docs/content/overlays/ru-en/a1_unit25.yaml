    note: '*never* означает «никогда».'
  en.a1.unit30.lesson02.teach.free_time_question:
    title: What do you do in your free time?
    gloss: Что ты делаешь в свободное время?
    note: '*free time* означает «свободное время».'
  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: Мне нравится читать.
    note: '*I like* + глагол с окончанием *-ing* — так говорят, что тебе что-то нравится.'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: Вопрос Лейлы
    gloss: 'Лейла спрашивает: Что ты делаешь в свободное время, Даниэль?'
    note: Лейла начинает разговор с прямого вопроса к Даниэлю.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Я часто бегаю. И иногда готовлю. А ты?'
    note: Даниэль называет два хобби и говорит, как часто он ими занимается, а потом возвращает вопрос словами *What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Лейла о живописи
    gloss: 'Лейла говорит: Я обожаю рисовать красками. Я рисую почти каждые выходные.'
    note: '*almost every weekend* означает «почти каждые выходные».'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: Следующий вопрос Даниэля
    gloss: 'Даниэль говорит: Здорово! А ты когда-нибудь играешь в видеоигры?'
    note: '*Do you ever...?* используют, чтобы спросить, делает ли человек что-то хоть иногда.'
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: Последний ответ Лейлы
    gloss: 'Лейла говорит: Редко. Я предпочитаю читать книгу.'
    note: '*I prefer...* означает «я предпочитаю...», то есть «мне больше нравится...».'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Текст о хобби
    gloss: У Даниэля и Лейлы разные хобби. Даниэль всегда бегает по субботам утром и иногда готовит для друзей. Лейла никогда не бегает, но часто рисует по выходным. Они оба любят видеоигры, но редко играют вместе.
    note: Этот текст прямо сравнивает хобби Даниэля и Лейлы и то, как часто они ими занимаются.
