    title: I wish I had asked for help sooner
lessons:
  en.b1.unit17.lesson01.regret_vocabulary:
    title: Слова для сожалений и желаний
  en.b1.unit17.lesson02.past_hypothetical_forms:
    title: I wish I had asked for help sooner
  en.b1.unit17.lesson03.reading_a_reflective_message:
    title: 'Читаем: оглядываясь на трудный месяц'
  en.b1.unit17.lesson04.the_regret_dialogue:
    title: If I had asked Mia sooner...
teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: сожаление
    note: '*regret* значит чувство грусти из-за того, что вы сделали или не сделали.'
    example_gloss: Дэниел сожалел о пропущенном сроке.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: желание, пожелание
    note: '*wish* значит желать, чтобы что-то произошло иначе, чем произошло на самом деле.'
    example_gloss: У Дэниела было одно пожелание насчёт прошлой недели.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: ошибка
    note: '*mistake* значит то, что сделано неправильно из-за неверной оценки.'
    example_gloss: Так долго ждать, прежде чем попросить о помощи, было ошибкой.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: задним числом
    note: '*hindsight* значит понимание события, которое приходит только потом.'
    example_gloss: Задним числом Дэниелу следовало сказать об этом раньше.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: откладывать на потом
    note: '*procrastinate* значит откладывать то, что нужно сделать.'
    example_gloss: Дэниел часто откладывает дела, когда они кажутся трудными.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: задержка
    note: '*delay* значит период, из-за которого что-то происходит позже, чем планировалось.'
    example_gloss: Из-за задержки Дэниел пропустил свой первый срок.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + Partizip
    gloss: Жаль, что я не попросил о помощи раньше.
    note: '*I wish I had asked* выражает пожелание о том, чего не произошло в прошлом.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + Partizip
    gloss: Мне следовало раньше поговорить с руководителем.
    note: '*I should have talked* говорит, как было бы правильно поступить, если смотреть задним числом.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + Partizip, I would have + Partizip
    gloss: Если бы я попросил Мию о помощи в первую неделю, я закончил бы вовремя.
    note: '*if I had asked..., I would have finished...* описывает нереальное последствие в прошлом.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: Formen, um Bedauern über die Vergangenheit auszudrücken
    gloss: Чтобы выразить сожаление о прошлом, используют wish + past perfect (I wish I had asked...), should have + причастие (I should have talked...) или if + past perfect с would have + причастие (If I had asked..., I would have finished...). Все три описывают то, чего на самом деле не произошло.
    note: 'Форма: выбирайте между wish + had, should have или if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: оглядываясь назад
    note: '*looking back* вводит размышление о прошлом.'
    example_gloss: Оглядываясь назад, Дэниел жалеет, что не попросил о помощи раньше.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: пропущенный срок
    note: '*missed deadline* значит срок, который не был соблюдён.'
    example_gloss: Дэниел пропустил один срок, прежде чем попросил о помощи.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'Lesetext: Rückblick auf einen anstrengenden Monat'
    gloss: Привет, Лейла, оглядываясь назад, жаль, что я не попросил о помощи раньше. Мне следовало раньше поговорить с руководителем о нагрузке. К тому времени, как я это сделал, я уже пропустил один срок. Если бы я попросил Мию о помощи в первую неделю, я закончил бы оба проекта вовремя. Было ошибкой так долго ждать. Дэниел
    note: Короткое, задумчивое сообщение.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel beginnt mit einer Reflexion
    gloss: 'Дэниел говорит: Оглядываясь назад, жаль, что я не попросил о помощи раньше.'
    note: '*looking back* начинает задумчивый разговор.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila fragt nach
    gloss: 'Лейла говорит: Что случилось?'
    note: Короткий открытый вопрос, чтобы узнать больше.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel erklärt, was er hätte tun sollen
    gloss: 'Дэниел говорит: Мне следовало раньше поговорить с руководителем о нагрузке. К тому времени, как я это сделал, я уже пропустил один срок.'
    note: '*should have talked* и *had already missed* связывают сожаление с конкретным последствием.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila beruhigt Daniel
    gloss: 'Лейла говорит: Не волнуйся. Ты же всё исправил в конце концов.'
    note: '*Don''t worry* успокаивает человека, который чувствует вину.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel beschreibt, was anders hätte sein können
    gloss: 'Дэниел говорит: Это верно. Если бы я попросил Мию о помощи в первую неделю, я закончил бы оба проекта вовремя.'
    note: '*if I had asked..., I would have finished...* описывает нереальное последствие в прошлом.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila schließt aufmunternd ab
    gloss: 'Лейла говорит: Ну, теперь ты знаешь на следующий раз.'
    note: Короткое, позитивное завершение разговора.
