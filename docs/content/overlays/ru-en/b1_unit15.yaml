teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: жаловаться
    note: '*complain* значит официально сказать, что что-то не в порядке или не устраивает.'
    example_gloss: Миа решила пожаловаться на повреждённое кресло.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: повреждённый
    note: '*damaged* описывает товар, который сломан или повреждён.'
    example_gloss: Кресло пришло повреждённым.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: возврат денег
    note: '*refund* значит деньги, которые возвращают за возвращённый или бракованный товар.'
    example_gloss: Миа попросила вернуть деньги.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: замена
    note: '*replacement* значит новый товар вместо неисправного.'
    example_gloss: Вместо этого компания предложила замену.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: разрешить, уладить
    note: '*resolve* значит полностью решить проблему.'
    example_gloss: Сотрудник пообещал быстро уладить проблему.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: проблема, вопрос
    note: '*issue* значит проблему, которой нужно заняться.'
    example_gloss: Миа чётко изложила проблему.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + существительное
    gloss: Я пишу, чтобы пожаловаться на повреждённый товар.
    note: '*I''m writing to complain about* вежливо начинает письменную жалобу.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + существительное
    gloss: Я хотел бы получить деньги за этот товар обратно.
    note: '*I would like a refund for* вежливо просит вернуть деньги.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: Структура вежливой жалобы
    gloss: 'Вежливая письменная жалоба обычно состоит из трёх частей: назвать проблему (I''m writing to complain about...), сказать, что уже произошло (it arrived damaged / it stopped working), и попросить о конкретном решении (I would like a refund / I would like a replacement).'
    note: 'Форма: назвать проблему, сказать, что произошло, попросить о конкретном решении.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: офисное кресло
    note: '*desk chair* значит кресло, в котором сидят за письменным столом.'
    example_gloss: Миа заказала новое офисное кресло для своего домашнего офиса.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: как можно скорее
    note: '*as soon as possible* значит без лишней задержки.'
    example_gloss: Миа попросила как можно скорее прислать замену.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'Текст: жалоба на офисное кресло'
    gloss: Уважаемая команда GreenDesk, я пишу, чтобы пожаловаться на повреждённый товар. На прошлой неделе я заказала офисное кресло для своего домашнего офиса, но оно пришло со сломанным колесом. Я хотела бы как можно скорее получить замену. Пожалуйста, сообщите мне, как действовать дальше. Спасибо, Миа
    note: Короткое вежливое письмо с жалобой.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Миа звонит пожаловаться на офисное кресло
    gloss: 'Миа говорит: Здравствуйте, я звоню, чтобы пожаловаться на офисное кресло, которое я заказала.'
    note: '*I''m calling to complain about* вежливо начинает жалобу по телефону.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: Сотрудник спрашивает о проблеме
    gloss: 'Сотрудник говорит: Мне жаль это слышать. В чём проблема?'
    note: '*I''m sorry to hear that* — вежливая, сочувственная реакция.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Миа описывает проблему
    gloss: 'Миа говорит: Оно пришло со сломанным колесом, так что я не могу им пользоваться.'
    note: '*it arrived with a broken wheel* объясняет, что уже произошло.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: Сотрудник предлагает решение
    gloss: 'Сотрудник говорит: Понимаю. Вы хотите возврат денег или замену?'
    note: '*would you like... or...* даёт клиенту выбор.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Миа выбирает замену
    gloss: 'Миа говорит: Я бы предпочла замену, если это возможно.'
    note: '*I would prefer a replacement, if that''s possible* вежливо называет предпочтение.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Сотрудник подтверждает решение
    gloss: 'Сотрудник говорит: Конечно. Мы уладим это и отправим вам новое кресло к пятнице.'
    note: '*we''ll resolve this and send... by Friday* — конкретное обещание с датой.'
