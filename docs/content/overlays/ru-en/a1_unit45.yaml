  en.a1.unit45.lesson01.teach.fire_department:
    title: fire department
    gloss: пожарная служба
    note: '*fire department* значит «пожарная служба».'
    example_gloss: Пожарные уже здесь.
  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: Позвоните 911!
    note: В США при чрезвычайной ситуации звонят по номеру *911*. В России экстренные службы вызывают по номерам 112, 101, 102 и 103, так что этот номер стоит запомнить отдельно.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: Мне нужна помощь!
    note: '*I need help!* значит «мне нужна помощь!».'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: Пришлите полицию, пожалуйста.
    note: '*Send the police, please.* значит «пришлите полицию, пожалуйста».'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Пришлите скорую, пожалуйста.
    note: '*Send an ambulance, please.* значит «пришлите скорую, пожалуйста».'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: Пожар!
    note: '*There''s a fire!* значит «пожар!».'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: Что у вас случилось?
    note: Это стандартный вопрос оператора экстренной службы в США, как только вы звоните по 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Лейла чувствует запах дыма
    gloss: 'Лейла спрашивает: Даниэль, что-то горит? Я чувствую запах дыма!'
    note: 'После *smell* идёт существительное без предлога: I smell smoke значит «я чувствую запах дыма». Будь внимателен: *I smell of smoke* значит другое («от меня пахнет дымом»).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: Объяснение Даниэля
    gloss: 'Даниэль говорит: О нет, сковородка загорелась! Я готовил ужин.'
    note: '*caught fire* значит «загорелся»: так говорят, когда что-то внезапно вспыхивает.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Указания Лейлы
    gloss: 'Лейла говорит: Спокойно. Выключи плиту! Я позову на помощь.'
    note: '*call for help* значит «звать на помощь». Не пропускай слово *for*.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: Предупреждение Даниэля
    gloss: 'Даниэль говорит: Скорее, огонь разгорается!'
    note: '*getting bigger* значит «становиться больше»: *get* + прилагательное передаёт изменение.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Лейла звонит в службу спасения
    gloss: 'Лейла говорит: Здравствуйте, это экстренная ситуация. На кухне у моего друга пожар. Пришлите, пожалуйста, пожарных.'
    note: 'Так звучит разговор со службой спасения в США: там звонят по 911.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Облегчение Даниэля
    gloss: 'Даниэль говорит: Слава богу. Кажется, огонь уже погас, но давай на всякий случай подождём на улице.'
    note: '*just in case* значит «на всякий случай».'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Совет Лейлы
    gloss: 'Лейла говорит: Хорошая мысль. Безопаснее подождать на улице, пока они приедут.'
    note: '*safer* — сравнительная степень от *safe*: к прилагательному добавляется *-er* (как в русском «безопасный» — «безопаснее»).'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Текст о правилах при пожаре
    gloss: 'При пожаре: во-первых, сохраняйте спокойствие. Во-вторых, сразу покиньте здание. Не пользуйтесь лифтом, идите по лестнице. В-третьих, когда окажетесь на улице, позвоните 911 и назовите свой адрес. Наконец, ждите на улице, пока не приедут пожарные. После пожара на кухне у Даниэля он и Лейла ждали на улице, как и сказано в объявлении. Пожарные быстро приехали и убедились, что всё безопасно. Позже к ним зашла Миа узнать, как дела, и обрадовалась, что никто не пострадал.'
    note: '*elevator* — американское слово для лифта. В британском английском говорят *lift*.'
