    gloss: куртка
    note: '*jacket* означает «куртка».'
    example_gloss: Я ношу куртку, когда холодно.
  en.a1.unit12.lesson01.teach.dress:
    title: dress
    gloss: платье
    note: '*dress* означает «платье».'
    example_gloss: На ней красивое платье.
  en.a1.unit12.lesson02.teach.small:
    title: small
    gloss: маленький / размер S
    note: '*small* означает «маленький», а как размер одежды — «S».'
    example_gloss: Эта рубашка слишком маленькая.
  en.a1.unit12.lesson02.teach.medium:
    title: medium
    gloss: средний / размер M
    note: '*medium* означает «средний», а как размер одежды — «M».'
    example_gloss: Обычно я ношу размер M.
  en.a1.unit12.lesson02.teach.large:
    title: large
    gloss: большой / размер L
    note: '*large* означает «большой», а как размер одежды — «L».'
    example_gloss: Эта куртка размера L.
  en.a1.unit12.lesson02.teach.blue:
    title: blue
    gloss: синий
    note: '*blue* означает «синий» или «голубой».'
    example_gloss: Рубашка синяя.
  en.a1.unit12.lesson02.teach.black:
    title: black
    gloss: чёрный
    note: '*black* означает «чёрный».'
    example_gloss: У неё чёрные туфли.
  en.a1.unit12.lesson02.teach.do_you_have_in_medium:
    title: Do you have this in a medium?
    gloss: У вас есть это в размере M?
    note: '*Do you have this in...?* спрашивает о другом размере.'
  en.a1.unit12.lesson02.teach.do_you_have_in_blue:
    title: Do you have it in blue?
    gloss: У вас есть это в синем цвете?
    note: '*Do you have it in...?* спрашивает о другом цвете.'
  en.a1.unit12.lesson03.teach.size:
    title: size
    gloss: размер
    note: '*size* означает «размер».'
    example_gloss: Какой размер у этой рубашки?
  en.a1.unit12.lesson03.teach.color:
    title: color
    gloss: цвет
    note: '*color* означает «цвет» (американское написание без ''u''; британское — colour).'
    example_gloss: Какого цвета куртка?
  en.a1.unit12.lesson03.teach.label_text:
    title: Этикетка на одежде
    gloss: 'Рубашка. Размер: M. Цвет: синий. Цена: 20 долларов.'
    note: Знак доллара в английском ставится ПЕРЕД числом (*$20*), а в русском цену обычно пишут с валютой после числа.
  en.a1.unit12.lesson03.teach.label_summary_sentence:
    title: The shirt is a medium and it's blue.
    gloss: Рубашка размера M, и она синяя.
    note: Полное описание размера и цвета в одном предложении.
  en.a1.unit12.lesson04.teach.here_you_go:
    title: Here you go.
    gloss: Пожалуйста, держите.
    note: '*Here you go* говорят, когда что-то передают человеку.'
  en.a1.unit12.lesson04.teach.ill_take_it:
    title: I'll take it, thanks.
    gloss: Я возьму, спасибо.
    note: '*I''ll take it* показывает, что ты решил(а) купить вещь.'
  en.a1.unit12.lesson04.teach.q_medium:
    title: Вопрос Лейлы
    gloss: 'Лейла: Извините, у вас есть эта рубашка размера M?'
    note: Лейла вежливо спрашивает о другом размере.
  en.a1.unit12.lesson04.teach.a_here_you_go:
    title: Ответ продавца
    gloss: 'Продавец: Да, пожалуйста.'
    note: Продавец протягивает Лейле рубашку нужного размера.
  en.a1.unit12.lesson04.teach.q_blue:
    title: Уточнение Лейлы
    gloss: 'Лейла: Отлично. А в синем цвете есть?'
    note: Теперь Лейла спрашивает о другом цвете.
  en.a1.unit12.lesson04.teach.a_yes_we_do:
    title: Ответ продавца
    gloss: 'Продавец: Да, есть.'
    note: '*we do* коротко подтверждает, что такой цвет есть в наличии.'
  en.a1.unit12.lesson04.teach.closing_ill_take_it:
    title: Заключение Лейлы
    gloss: 'Лейла: Я возьму, спасибо.'
    note: Лейла решает купить вещь.
