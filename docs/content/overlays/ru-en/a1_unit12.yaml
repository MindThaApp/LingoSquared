  en.a1.unit12.lesson01.teach.pants:
    title: pants
    gloss: брюки
    note: '*pants* означает «брюки» — в английском это слово всегда во множественном числе.'
    example_gloss: Эти брюки слишком длинные.
  en.a1.unit12.lesson01.teach.shoes:
    title: shoes
    gloss: туфли, обувь
    note: '*shoes* означает «обувь» (множественное число).'
