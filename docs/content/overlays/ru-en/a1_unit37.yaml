    title: congratulate someone on
    gloss: поздравить кого-то с
    note: 'После *congratulate someone* всегда используется предлог *on*. Русское «с» («поздравить с») здесь не подсказка: другие предлоги, например *with* или *for*, не подходят.'
    example_gloss: Мы поздравляем его с повышением.
