    gloss: Хочешь прийти на мою вечеринку?
    note: Дружелюбный, неформальный способ пригласить кого-то.
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: Вопрос Лейлы
    gloss: 'Лейла спрашивает: Ты знал(а), что у Даниэля день рождения 12 октября?'
    note: '*Did you know ...?* — естественный способ начать разговор с новой информации.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: Ответ Мии
    gloss: 'Мия говорит: Нет, не знала! Это в следующую пятницу.'
    note: '*No, I didn''t!* — короткий отрицательный ответ на вопрос *Did you know ...?*: «Нет, не знал(а)».'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: Предложение Лейлы
    gloss: 'Лейла говорит: Давай устроим для него вечеринку-сюрприз в офисе.'
    note: '*Let''s* + глагол используется, чтобы что-то предложить, как «давай(те)» в русском.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: Ответ Мии
    gloss: 'Мия говорит: Отличная идея! Я могу пригласить остальную команду.'
    note: '*the rest of the team* значит «остальная команда».'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: 'Лейла говорит: Отлично. Я куплю ему подарок, может быть, новые кроссовки для бега, ведь он обожает бегать.'
    note: '*since* здесь значит «потому что», «раз» (причина), а не «с тех пор как» (время).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: Предложение Мии
    gloss: 'Мия говорит: Это хорошая идея. Купим ещё и торт?'
    note: '*Should we ...?* используется, чтобы вместе принять решение.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Да, конечно! Мы все вместе поздравим его с днём рождения.'
    note: '*We''ll all wish him a happy birthday* значит: все мы поздравим его с днём рождения.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Текст о вечеринке-сюрпризе
    gloss: Даниэль не знал, что Лейла и Мия планируют для него вечеринку-сюрприз. 12 октября, в день рождения, он пришёл на работу и нашёл в комнате отдыха воздушные шары и торт. Все поздравили его с днём рождения. Лейла подарила ему новые кроссовки для бега. Мия подарила ему фотографию трёх коллег вместе в рамке, которую сама сделала. Даниэль был очень рад и поблагодарил всех за чудесный сюрприз.
    note: '*he arrived at work and found*: прошедшее время от *arrive* и *find* («пришёл на работу и нашёл»).'
