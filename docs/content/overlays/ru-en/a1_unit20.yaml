    title: cheapest
    gloss: самый дешёвый
    note: '*cheapest* — превосходная степень от *cheap* (для трёх и более предметов).'
    example_gloss: Это самая дешёвая рубашка в магазине.
  en.a1.unit20.lesson03.teach.car_comparison_text:
    title: Текст о сравнении машин
    gloss: Красная машина быстрее синей, но синяя дешевле. Белая машина — самая дешёвая из трёх.
    note: 'В этом тексте сравниваются три машины: красная быстрее синей, синяя дешевле красной, а белая — самая дешёвая.'
  en.a1.unit20.lesson04.teach.how_much_cheaper:
    title: How much cheaper?
    gloss: Насколько дешевле?
    note: '*How much...?* используется, чтобы спросить о величине разницы.'
  en.a1.unit20.lesson04.teach.by_five_dollars:
    title: cheaper by five dollars
    gloss: дешевле на пять долларов
    note: '*by five dollars* указывает точную разницу.'
