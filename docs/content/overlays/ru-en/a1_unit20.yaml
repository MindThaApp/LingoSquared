    title: Вопрос о сумке
    gloss: 'Лейла спрашивает: Какая сумка тебе нравится, маленькая или большая?'
    note: Этот вопрос похож на вопрос из второго урока, но теперь Лейла спрашивает, какая сумка нравится Даниэлю.
  en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Большая красивее, но маленькая дешевле.'
    note: С помощью *but* Даниэль противопоставляет два сравнения.
  en.a1.unit20.lesson04.teach.q_how_much_cheaper:
    title: Вопрос о разнице
    gloss: 'Лейла спрашивает: Насколько дешевле?'
    note: Тот же вопрос, что и выше.
  en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars:
    title: Точные цены
    gloss: 'Даниэль говорит: Маленькая стоит десять долларов, а большая — пятнадцать.'
    note: 'Даниэль называет цену обеих сумок: десять и пятнадцать долларов.'
  en.a1.unit20.lesson04.teach.a_cheaper_by_five:
    title: Вывод Лейлы
    gloss: 'Лейла говорит: Хорошо, маленькая дешевле на пять долларов. Беру маленькую.'
    note: Пятнадцать минус десять — пять, значит, маленькая сумка дешевле на пять долларов.
