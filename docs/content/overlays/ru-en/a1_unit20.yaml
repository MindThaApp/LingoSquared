  en.a1.unit20.lesson02.teach.small_cheaper_than_big:
    title: The small bag is cheaper than the big bag.
    gloss: Маленькая сумка дешевле большой сумки.
    note: '*than* используется для прямого сравнения двух предметов; по-русски ему соответствует «чем» или родительный падеж.'
