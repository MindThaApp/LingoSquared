  en.a1.unit49.lesson02.teach.which_bin_does_this_go_in:
    title: Which bin does this go in?
    gloss: В какой контейнер это идёт?
    note: '*go in* здесь значит «класть куда-то», «относиться к определённому контейнеру».'
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: Это идёт в контейнер для переработки.
    note: '*This goes in the recycling bin.* значит «это идёт в контейнер для переработки».'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: Зелёный контейнер для стекла.
    note: '*is for ...* значит «предназначен для ...», так говорят о назначении предмета.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: Можешь вынести мусор?
    note: '*take out* — составной глагол: можно сказать и *take out the trash*, и *take the trash out*. По-русски это один глагол: «вынести».'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: День вывоза мусора — вторник.
    note: '*Collection day is on Tuesday.* значит «день вывоза мусора — вторник».'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: А бумага и пищевые отходы?
    note: '*What about ...?* значит «а как насчёт ...?» или просто «а ...?», так спрашивают о чём-то другом.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: Предупреждение Мии
    gloss: 'Миа говорит: Подожди, эта стеклянная банка не идёт в мусор!'
    note: '*doesn''t go in the trash* значит «не идёт в мусор», «не выбрасывается в мусор».'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Извинение Даниэля
    gloss: 'Даниэль говорит: О нет, прости! В какой контейнер она идёт?'
    note: '*Which bin does it go in?* повторяет только что изученный вопрос.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Объяснение Мии
    gloss: 'Миа говорит: В зелёный контейнер. Мы здесь сдаём стекло на переработку.'
    note: '*We recycle glass here.* значит «мы здесь сдаём стекло на переработку».'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: А бумага и пищевые отходы?'
    note: Повторение вопроса *What about ...?*, изученного раньше.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: Объяснение Мии
    gloss: 'Миа говорит: Бумага идёт в синий контейнер, а пищевые отходы — в коричневый.'
    note: '*goes in ..., and ... goes in ...* повторяет одну и ту же конструкцию для двух видов мусора.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: Вопрос Даниэля о дне вывоза
    gloss: 'Даниэль говорит: Понял. Когда день вывоза мусора?'
    note: '*Got it.* — неформальный способ сказать «понял».'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Контейнеры для переработки выставляют по вторникам, а обычный мусор — по пятницам.'
    note: 'Обрати внимание: Миа называет два разных дня для двух видов мусора: вторник для переработки, пятница для обычного мусора.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: Обещание Даниэля
    gloss: 'Даниэль говорит: Спасибо! В следующий раз я всё рассортирую правильно.'
    note: '*I''ll sort everything correctly next time.* значит «в следующий раз я всё рассортирую правильно».'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Текст о том, как сортируют мусор
    gloss: 'Как сортировать мусор: во многих многоквартирных домах есть разные контейнеры для разных видов мусора. Стекло обычно идёт в зелёный контейнер, а бумага — в синий. Пищевые отходы идут в коричневый контейнер, а всё остальное — в чёрный контейнер для обычного мусора. Полезно знать свой день вывоза, потому что контейнеры забирают только раз в неделю. Даниэль практикуется в рецептах из книги, которую взял в библиотеке, и часто готовит вместе с Мией у неё дома. Вчера вечером он приготовил блюдо по рецепту из книги, а потом чуть не бросил стеклянную банку в обычный мусор. Миа остановила его и показала, как в её доме сортируют мусор. Она объяснила, что контейнеры для переработки выставляют по вторникам, а обычный мусор — по пятницам. Даниэль был благодарен и сказал, что отныне будет сортировать всё правильно.'
    note: '*almost put a glass jar in the regular trash* значит «чуть не бросил стеклянную банку в обычный мусор».'
