teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: высокий
    note: '*tall* значит «высокий» (о росте человека).'
    example_gloss: Мой брат высокий.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: низкий, невысокий
    note: '*short* здесь значит «невысокий» (о человеке); ещё *short* значит «короткий», например о волосах.'
    example_gloss: Моя сестра невысокая.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: волосы
    note: '*hair* значит «волосы». В английском это неисчисляемое слово: *her hair is long*, а не *her hairs are long*.'
    example_gloss: У неё длинные волосы.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: светловолосый, светлый
    note: '*blond* значит «светловолосый, светлый».'
    example_gloss: Его волосы светлые.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: кудрявый, вьющийся
    note: '*curly* значит «кудрявый, вьющийся».'
    example_gloss: У Лейлы кудрявые волосы.
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: глаза
    note: '*eyes* значит «глаза» (множественное число).'
    example_gloss: У меня карие глаза.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: голубой, синий
    note: '*blue* значит «голубой, синий».'
    example_gloss: Её глаза голубые.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: коричневый, карий
    note: '*brown* значит «коричневый»; о глазах говорят «карий».'
    example_gloss: Мои глаза карие.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: зелёный
    note: '*green* значит «зелёный».'
    example_gloss: У него зелёные глаза.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: очки
    note: '*glasses* значит «очки». Слово всегда стоит во множественном числе; *wears glasses* значит «носит очки».'
    example_gloss: Мой отец носит очки.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: Как она выглядит?
    note: 'Следи за порядком слов: по-русски вопрос «Как она выглядит?» строится без вспомогательного глагола. В английском с обычным глаголом (*look*) в вопросе всегда нужен *does* или *do*: *What does she look like?*, а не *What looks she like?*. Именно *does* («do-конструкцию») чаще всего забывают.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: Начало разговора у Лейлы
    gloss: 'Лейла говорит: Сегодня у нас новая коллега. Её зовут Миа.'
    note: '*starting today* значит «начиная с сегодняшнего дня».'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: Вопрос Дэниела
    gloss: 'Дэниел спрашивает: Как она выглядит?'
    note: 'Снова вопрос с *does*: не пропускай *does* и не строй вопрос только за счёт порядка слов, как по-русски.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: Описание от Лейлы
    gloss: 'Лейла говорит: Она высокая, у неё кудрявые светлые волосы.'
    note: '*She''s* — краткая форма от *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: Уточнение Дэниела
    gloss: 'Дэниел спрашивает: Она носит очки?'
    note: 'И здесь нужен вспомогательный глагол: *Does she wear glasses?*, а не *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: Ответ Лейлы
    gloss: 'Лейла говорит: Да, носит. У неё ещё и зелёные глаза.'
    note: '*Yes, she does* — краткий утвердительный ответ, в котором повторяется вспомогательный глагол *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: Последняя реплика Дэниела
    gloss: 'Дэниел говорит: Хорошо, кажется, я вижу её сейчас у двери.'
    note: '*at the door* значит «у двери».'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: Текст о Дэниеле и Лейле
    gloss: Дэниел и Лейла — хорошие друзья, но они не похожи друг на друга. Дэниел высокий, у него короткие чёрные волосы. Он носит очки. Лейла невысокая, у неё длинные кудрявые каштановые волосы. У неё голубые глаза, а у Дэниела карие. Оба много смеются.
    note: '*don''t look the same* значит «выглядят по-разному, не похожи». В английском и в отрицании нужен вспомогательный глагол (*don''t* = *do not*).'
