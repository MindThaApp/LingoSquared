teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: хотя
    note: '*although* вводит противопоставление в том же предложении с помощью полного придаточного.'
    example_gloss: Хотя в офисе тихо, Миа предпочитает работать дома.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: хотя; даже если
    note: '*even though* подчёркивает противопоставление сильнее, чем *although*.'
    example_gloss: Лейла сохраняет концентрацию, хотя её квартира маленькая.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: несмотря на
    note: После *despite* стоит существительное или форма на -ing, а не полное придаточное предложение.
    example_gloss: Несмотря на отвлекающие факторы, Дэниел заканчивает отчёт вовремя.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: однако, но
    note: '*however* начинает новое предложение после точки или точки с запятой.'
    example_gloss: В офисе тихо. Однако Миа предпочитает работать дома.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: веский довод, хороший аргумент
    note: '*valid point* значит разумный или убедительный довод.'
    example_gloss: Это веский довод насчёт концентрации.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: убедить
    note: '*convince* значит убедить кого-то в чём-то.'
    example_gloss: Лейла пыталась убедить Мию вернуться в офис.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + полное придаточное предложение
    gloss: Хотя в офисе тихо, Миа предпочитает работать дома.
    note: '*although* + подлежащее + глагол образует полное придаточное предложение противопоставления.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + существительное
    gloss: Несмотря на отвлекающие факторы, Дэниел заканчивает отчёт вовремя.
    note: После *despite* стоит существительное, а не полное придаточное предложение.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite и however
    gloss: 'Although и even though начинают полное придаточное предложение: Although the office is quiet, Mia prefers home. После despite стоит существительное или форма на -ing, а не придаточное предложение: Despite the distractions, Daniel finishes his report. However начинает новое предложение после точки или точки с запятой: The office is quiet. However, Mia prefers home.'
    note: 'Форма: *although/even though* + придаточное; *despite* + существительное/форма на -ing; *however* как вводное слово после точки.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: гибкость
    note: '*flexibility* значит способность легко менять планы или способ работы.'
    example_gloss: Миа и Лейла обе согласны, что гибкость важна.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: командная работа
    note: '*teamwork* значит работать вместе как команда.'
    example_gloss: Лейла считает, что офис способствует лучшей командной работе.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Текст: где работать'
    gloss: Миа и Лейла расходятся во мнениях насчёт того, где работать. Миа работает дома, потому что там удобно. Хотя ей не хватает общения с коллегами, дома она делает больше. Лейла предпочитает офис. Несмотря на шум, ей нравится разговаривать с коллегами в перерывах. Даже если Миа делает веский довод насчёт концентрации, Лейла всё же считает, что офис способствует лучшей командной работе. Однако обе согласны, что гибкость важна.
    note: Короткий текст с противопоставлениями.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Миа вводит противопоставление
    gloss: 'Миа говорит: Лейла, хотя офис хороший, дома я делаю больше.'
    note: '*although* + полное придаточное предложение в начале.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Лейла излагает свою точку зрения
    gloss: 'Лейла говорит: Я понимаю, но несмотря на шум, мне очень нравится разговаривать с людьми в перерывах.'
    note: '*despite* + существительное (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Миа признаёт довод, но остаётся при своём мнении
    gloss: 'Миа говорит: Это веский довод. Однако я всё равно думаю, что одна я лучше концентрируюсь.'
    note: '*however* здесь начинает новое предложение после точки.'
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Лейла поддразнивает Мию
    gloss: 'Лейла говорит: Хотя я предпочитаю офис, я не смогу тебя переубедить, ведь так?'
    note: '*even though* подчёркивает противопоставление.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Миа находит компромисс
    gloss: 'Миа говорит: Наверное, нет! Однако мы согласны, что важнее всего гибкость.'
    note: '*however* связывает две противоположные мысли как новое предложение.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Лейла завершает разговор на позитивной ноте
    gloss: 'Лейла говорит: Несмотря на наши разные предпочтения, мы всё делаем вовремя.'
    note: '*despite* + существительное (*our different preferences*).'
