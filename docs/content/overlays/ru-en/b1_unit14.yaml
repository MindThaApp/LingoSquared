teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: было бы возможно
    note: '*would it be possible to* вежливо спрашивает, возможно ли что-то в принципе.'
    example_gloss: Можно ли перенести встречу на четверг?
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: мне было интересно, можно ли
    note: '*I was wondering if* делает просьбу косвенной и осторожной.'
    example_gloss: Мне было интересно, не могли бы вы сегодня просмотреть мой отчёт.
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: не могли бы мы
    note: '*could we possibly* вежливо просит о том, что вы сделали бы вместе.'
    example_gloss: Не могли бы мы начать встречу на пять минут позже?
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: я был бы признателен, если бы
    note: '*I would appreciate it if* говорит, что вы были бы благодарны, если бы кто-то что-то сделал.'
    example_gloss: Я был бы признателен, если бы вы скоро прислали протокол.
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: повестка дня
    note: '*agenda* значит список тем, которые нужно обсудить на встрече.'
    example_gloss: Дэниел добавил в повестку дня ещё один пункт.
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: вернуться к вопросу, напомнить о себе
    note: '*follow up* значит снова связаться после встречи или выполнения задачи.'
    example_gloss: Миа вернётся к вопросу по электронной почте после встречи.
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: Можно ли перенести встречу на четверг?
    note: '*would it be possible to* + начальная форма вежливо просит о перемене.'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: Мне было интересно, не могли бы вы сегодня просмотреть мой отчёт.
    note: '*I was wondering if you could* — косвенный, вежливый способ спросить.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Abgeschwächte Bitten bei der Arbeit
    gloss: В официальных просьбах на работе используйте смягчённую условную форму вроде Would it be possible to... или I was wondering if... вместо прямого приказа. Эти формы звучат вежливее, чем Move the meeting или Review my report.
    note: 'Форма: используйте смягчённую условную форму вместо прямого приказа.'
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: обновление по бюджету
    note: '*budget update* значит отчёт о том, как тратятся деньги.'
    example_gloss: Дэниел подготовил обновление по бюджету для встречи.
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: затем, после этого
    note: '*afterward* значит по времени после чего-то другого.'
    example_gloss: Протокол мы можем просмотреть после этого.
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Nachricht vor dem Meeting'
    gloss: Привет, Дэниел, надеюсь, у тебя всё хорошо. Нельзя ли добавить обновление по бюджету в повестку дня на завтрашнюю встречу? Я была бы признательна, если бы ты принёс последние цифры. Не могли бы мы начать на десять минут раньше, чтобы после этого было время на вопросы? Спасибо, Миа
    note: Короткое деловое сообщение со смягчёнными просьбами.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: Die Teamleitung eröffnet das Meeting höflich
    gloss: 'Руководитель команды говорит: Доброе утро, Миа. Можно ли начать сегодня с обновления по бюджету?'
    note: '*would it be possible to* вежливо спрашивает о порядке на встрече.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia macht eine zusätzliche Bitte
    gloss: 'Миа говорит: Конечно. Мне было интересно, не могли бы мы также добавить нового клиента в повестку дня.'
    note: '*I was wondering if we could* — косвенный, вежливый способ что-то предложить.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: Die Teamleitung bittet um ein kurzes Meeting
    gloss: 'Руководитель команды говорит: Хорошая идея. Не могли бы мы уложить эту встречу в тридцать минут?'
    note: '*could we possibly* вежливо просит о том, что сделали бы оба вместе.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia bittet um etwas für das nächste Mal
    gloss: 'Миа говорит: Постараюсь. Я была бы признательна, если бы в следующий раз все присылали вопросы заранее.'
    note: '*I would appreciate it if* говорит, что вы были бы благодарны.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: Die Teamleitung stimmt zu und verspricht nachzufassen
    gloss: 'Руководитель команды говорит: Это справедливая просьба. Я пришлю напоминание перед следующей встречей.'
    note: '*follow up* здесь значит позже вернуться к этому вопросу.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia schließt mit einer Bestätigung
    gloss: 'Миа говорит: Спасибо. Я пришлю обновлённую повестку дня сегодня во второй половине дня.'
    note: Короткое, вежливое завершение разговора.
