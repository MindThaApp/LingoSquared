course:
  title: Английский A1
  description: 'Английский уровня A1: приветствия и короткие разговоры в повседневных ситуациях, с подробными объяснениями на русском языке.'
units:
  en.a1.unit33.transportation:
    title: Передвижение по городу
lessons:
  en.a1.unit33.lesson01.transport_vocabulary:
    title: Способы передвижения
  en.a1.unit33.lesson02.describing_commutes:
    title: Как добраться
  en.a1.unit33.lesson03.dialogue_commute_talk:
    title: 'Разговор: о дороге на работу'
  en.a1.unit33.lesson04.two_commuters:
    title: 'Чтение: две разные дороги на работу'
teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: автобус
    note: '*bus* значит «автобус». Глагол к нему: *take*, то есть *take the bus*. Обрати внимание: по-русски для большинства транспорта подходит одна конструкция («ехать на автобусе, на поезде, на машине»), а в английском у каждого вида транспорта свой глагол (*take*, *drive*, *ride*). Их нужно учить отдельно.'
    example_gloss: Я езжу на автобусе.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: поезд
    note: '*train* значит «поезд». Как и с *bus*, здесь используется *take*: *take the train*.'
    example_gloss: Она едет на поезде.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: машина
    note: '*car* значит «машина». С машиной используется не *take*, а *drive*: *drive my car*. Это другой глагол, не тот, что с автобусом или поездом.'
    example_gloss: Я езжу на работу на своей машине.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: велосипед
    note: '*bike* значит «велосипед». Здесь снова другой глагол: *ride a bike* (не *take* и не *drive*).'
    example_gloss: Я каждый день езжу на работу на велосипеде.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: идти пешком
    note: '*walk* значит «идти пешком». Дополнительный глагол вроде *take*, *drive* или *ride* не нужен, потому что *walk* уже сам глагол: *walk to work*, а не *take a walk to work*.'
    example_gloss: Я хожу на работу пешком.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: Как ты добираешься до работы?
    note: Этот вопрос начинается со вспомогательного глагола *do*, потому что смысловой глагол здесь *get*. В русском вопрос «Как ты добираешься до работы?» строится без вспомогательного глагола.
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: обычно
    note: '*usually* значит «обычно». В английском это наречие обычно стоит между подлежащим и основным глаголом: *I usually take the bus*.'
    example_gloss: Я обычно езжу на автобусе.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: минуты
    note: '*minutes* значит «минуты». В предложении *It takes twenty minutes* слово *it* — пустое подлежащее без собственного значения, оно лишь занимает место подлежащего. В русском подлежащее можно просто опустить: «Занимает двадцать минут». В английском же подлежащее обязательно, и этим *it* пользуются. Но не в каждом английском предложении о времени это работает одинаково.'
    example_gloss: Это занимает двадцать минут.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: опаздывающий
    note: '*late* значит «опаздывающий», «с опозданием» (приезжает позже, чем ожидалось): *The bus is often late.*'
    example_gloss: Автобус часто опаздывает.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: быстрее
    note: '*faster* значит «быстрее»: сравнительная степень от *fast* с окончанием *-er*. Для сравнения используется *than*: *faster than the bus*.'
    example_gloss: Поезд быстрее автобуса.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: Вопрос Лейлы
    gloss: 'Лейла спрашивает: Как ты добираешься до работы, Даниэль?'
    note: Начало разговора со словами *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Обычно я езжу на автобусе. Это занимает около двадцати минут.'
    note: 'Сразу две вещи: глагол *take* для автобуса и пустое подлежащее *it* в *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: Вопрос Лейлы
    gloss: 'Лейла спрашивает: Тебе это нравится?'
    note: Общий вопрос (ответ «да» или «нет») с *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Нормально, но автобус часто опаздывает. А ты?'
    note: '*How about you?* значит «А ты?»: короткий способ задать вопрос в ответ.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Я езжу на машине. Так быстрее, но парковаться трудно.'
    note: Для машины используется глагол *drive*, а не *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Текст о Лейле и Даниэле
    gloss: Лейла каждый день ездит на работу на машине. Дорога занимает около пятнадцати минут, но парковка возле её офиса — это трудно. У Даниэля нет машины, поэтому он ездит на автобусе. Поездка на автобусе занимает двадцать минут, и автобус иногда опаздывает, но Даниэлю не нужно беспокоиться о парковке.
    note: 'Обрати внимание: *take* используется для автобуса и поезда, *drive* для машины.'
