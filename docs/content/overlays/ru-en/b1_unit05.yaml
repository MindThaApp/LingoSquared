    gloss: обновление, свежая информация
    note: '*update* значит новая информация о том, как идут дела.'
    example_gloss: Я каждую неделю даю своей команде обновление.
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: крайний срок
    note: '*deadline* значит срок, к которому что-то должно быть готово.'
    example_gloss: Крайний срок по отчёту — пятница.
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: отчёт
    note: '*report* значит письменный документ о работе или результатах.'
    example_gloss: Каждый месяц я пишу отчёт о продажах.
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: в графике
    note: '*on schedule* значит, что всё идёт по плану, без опоздания.'
    example_gloss: Проект идёт по графику.
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: с отставанием от графика
    note: '*behind schedule* значит, что что-то идёт медленнее, чем запланировано.'
    example_gloss: На этой неделе у нас небольшое отставание от графика.
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: Eine Zuständigkeit nennen
    gloss: Я отвечаю за ежемесячный отчёт.
    note: '*I''m responsible for...* — прямой способ описать задачу на работе.'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: Sagen, dass etwas im Zeitplan liegt
    gloss: Проект идёт по графику.
    note: '*on schedule* значит, что задержки нет.'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: Eine Statusmeldung geben
    gloss: У меня небольшое отставание от графика, но я закончу к пятнице.
    note: '*I''m a little behind schedule, but I''ll finish by...* — честный способ сообщить о задержке и назвать конкретный срок.'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: Statusmeldungen geben
    gloss: Я отвечаю за отчёт. Проект идёт по графику. У меня отставание от графика.
    note: Эти три предложения — стандартные формулировки для разговора на работе об обязанностях и ходе дел.
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: команда
    note: '*team* значит группа людей, которые работают вместе.'
