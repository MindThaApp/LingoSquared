teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: отвечать за; ответственный за
    note: '*responsible for* значит, что ваша задача — заботиться о чём-то.'
    example_gloss: Я отвечаю за ежемесячный отчёт.
  en.b1.unit05.lesson01.teach.update:
