    gloss: техническая проблема
    note: '*technical problem* значит проблему с оборудованием или программным обеспечением.'
    example_gloss: У него отставание от графика из-за технической проблемы.
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Wochenbericht'
    gloss: Дэниел отвечает за ежемесячный отчёт о продажах. Каждую неделю он даёт своей команде короткое обновление. На этой неделе у него небольшое отставание от графика из-за технической проблемы, но он рассчитывает закончить к пятнице. Он всегда говорит своей команде правду о задержках.
    note: Короткий текст о том, как Дэниел честно говорит о задержке.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel bittet Mia um Hilfe
    gloss: 'Дэниел говорит: Миа, ты можешь помочь мне просмотреть этот отчёт, прежде чем я его отправлю?'
    note: '*could you help me...* — вежливый способ попросить коллегу о помощи.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia sagt zu
    gloss: 'Миа говорит: Конечно. С чем тебе нужна помощь?'
    note: '*of course* — дружелюбный и прямой способ ответить «да».'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel erklärt, was er braucht
    gloss: 'Дэниел говорит: Я хочу убедиться, что цифры верные.'
    note: '*make sure* значит проверить, что что-то правильно.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia verspricht, es durchzusehen
    gloss: 'Миа говорит: Без проблем. Я посмотрю его сегодня во второй половине дня и пришлю тебе свои замечания.'
    note: '*I''ll check it this afternoon* — конкретное обещание с указанием времени.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel bedankt sich bei Mia
    gloss: 'Дэниел говорит: Спасибо, я очень это ценю.'
    note: '*I really appreciate it* — искренний способ выразить благодарность.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia bietet weitere Hilfe an
    gloss: 'Миа говорит: Не за что. Дай знать, если понадобится что-то ещё.'
    note: '*let me know if...* оставляет дверь открытой для дальнейшей помощи.'
