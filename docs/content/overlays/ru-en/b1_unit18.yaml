teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: договорённость, назначенная встреча
    note: '*arrangement* значит план, который уже согласован с кем-то другим, например, назначенное время.'
    example_gloss: У Мии договорённость с Лейлой о встрече в пятницу.
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: намерение, замысел
    note: '*intention* значит то, что вы решили сделать, но время с кем-то ещё не согласовано.'
    example_gloss: Намерение Дэниела — закончить проект рано.
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: прогноз, предсказание
    note: '*prediction* значит оценку того, что произойдёт, на основании признаков.'
    example_gloss: 'Мой прогноз: проект закончится вовремя.'
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: непременно, определённо
    note: '*definitely* показывает, что вы полностью уверены: это произойдёт.'
    example_gloss: Дэниел определённо закончит отчёт сегодня.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: вероятно
    note: '*probably* показывает, что вы довольно уверены, но не полностью.'
    example_gloss: Проект, вероятно, займёт два месяца.
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: возможно, может быть
    note: '*might* показывает, что это лишь слабая возможность.'
    example_gloss: Дэниел, возможно, попросит Лейлу присоединиться к команде.
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (твёрдая договорённость)
    gloss: Я встречаюсь с Лейлой за обедом в пятницу.
    note: '*I am meeting Leila for lunch on Friday* использует present continuous (длительное время) для твёрдой договорённости с конкретным, уже согласованным временем.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (намерение)
    gloss: Я собираюсь начать новый проект с командой дизайнеров.
    note: '*I am going to start a new project* использует going to для уже принятого решения без конкретного времени.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Твёрдые договорённости и намерения
    gloss: 'Используйте present continuous (I am meeting Leila on Friday) для твёрдой договорённости: конкретное время, уже согласованное с кем-то другим. Используйте going to (I am going to start a new project) для намерения или решения, которое вы уже приняли, даже если конкретное время ещё не назначено. В русском оба случая выражаются настоящим или будущим временем; в английском нужно выбирать.'
    note: 'Форма: выбирайте между present continuous для твёрдой договорённости и going to для намерения.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: вовремя
    note: '*on time* значит точно в запланированное время или к запланированной дате.'
    example_gloss: Дэниел считает, что проект закончится вовремя.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: уверенный
    note: '*confident* значит чувствовать уверенность, что что-то пройдёт хорошо.'
    example_gloss: Дэниел уверен в новом проекте.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Текст: планы Даниэля на следующий месяц'
    gloss: В следующем месяце Дэниел собирается начать новый проект с командой дизайнеров. Он встречается с ними в пятницу утром, чтобы спланировать первые шаги. Дэниел уверен в проекте, но не совсем уверен, что он закончится вовремя. Он предполагает, что это, вероятно, займёт около двух месяцев. Возможно, он попросит Лейлу присоединиться к команде, потому что у неё есть полезный опыт в дизайне. Если она согласится, проект определённо пойдёт быстрее.
    note: Короткий текст о планах и прогнозах.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Миа спрашивает о планах Даниэля
    gloss: 'Миа говорит: Дэниел, какие у тебя планы на следующий месяц?'
    note: Открытый вопрос, чтобы начать разговор.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Даниэль говорит о своих намерениях
    gloss: 'Дэниел говорит: Я собираюсь начать новый проект с командой дизайнеров.'
    note: '*going to* указывает на уже принятое решение.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Миа продолжает расспрашивать
    gloss: 'Миа говорит: Звучит интересно. Ты встречаешься с ними на этой неделе?'
    note: Уточняющий вопрос о твёрдой договорённости.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Даниэль подтверждает твёрдую договорённость
    gloss: 'Дэниел говорит: Да, я встречаюсь с ними в пятницу утром.'
    note: '*I am meeting... on Friday morning* — present continuous для твёрдой договорённости.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Миа спрашивает о дате
    gloss: 'Миа говорит: Ты думаешь, проект закончится вовремя?'
    note: Вопрос о прогнозе.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Даниэль делает прогноз
    gloss: 'Дэниел говорит: Не уверен, но это, вероятно, займёт около двух месяцев.'
    note: '*probably* показывает довольно большую, но не полную уверенность.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Миа настроена оптимистично
    gloss: 'Миа говорит: Ну, я уверена, что всё пройдёт хорошо.'
    note: Ободряющее замечание.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Даниэль называет слабую возможность
    gloss: 'Дэниел говорит: Спасибо. Возможно, я также попрошу Лейлу присоединиться к команде.'
    note: '*might* показывает слабую возможность.'
