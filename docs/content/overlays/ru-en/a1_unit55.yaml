    gloss: бассейн
    note: '*swimming pool* значит «бассейн».'
    example_gloss: Бассейн открывается каждое утро.
  en.a1.unit55.lesson01.teach.ticket:
    title: ticket
    gloss: билет / пропуск
    note: '*ticket* значит «билет» или «пропуск».'
    example_gloss: Чтобы войти в бассейн, нужен билет.
  en.a1.unit55.lesson01.teach.locker:
    title: locker
    gloss: шкафчик
    note: '*locker* значит «шкафчик».'
    example_gloss: Положи сумку в шкафчик.
  en.a1.unit55.lesson01.teach.swim_cap:
    title: swim cap
    gloss: шапочка для плавания
    note: '*swim cap* значит «шапочка для плавания».'
    example_gloss: Пожалуйста, надевайте в бассейне шапочку для плавания.
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: правила
    note: '*rules* значит «правила».'
    example_gloss: Прочитай правила бассейна перед плаванием.
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: спасатель
    note: '*lifeguard* значит «спасатель» — человек, который следит за безопасностью пловцов.'
    example_gloss: Спасатель каждый день следит за бассейном.
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: Я хотел бы купить билет, пожалуйста.
    note: '*I''d like to* — сокращение от *I would like to* и вежливый способ высказать просьбу.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: Где находятся шкафчики?
    note: 'В вопросе *Where are...?* используется обратный порядок слов: глагол стоит перед подлежащим.'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: Во сколько вы открываетесь?
    note: В вопросе *do you open* используется вспомогательный глагол *do*.
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: Пять долларов за один билет.
    note: '*for one ticket* значит «за один билет».'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: Мне нужна шапочка для плавания?
    note: В вопросе *Do I need...?* используется вспомогательный глагол *do*.
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: Мы закрываемся в восемь часов.
    note: 'Перед точным временем в английском используется *at*: *at eight o''clock* — «в восемь часов».'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: Спасатель приветствует посетителей
    gloss: 'Спасатель говорит: Здравствуйте! Вы сегодня пришли поплавать?'
    note: 'В *Are you here to swim today?* инфинитив *to swim* обозначает цель: «пришли, чтобы поплавать».'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Билеты Дэниела
    gloss: 'Дэниел говорит: Да, два билета, пожалуйста.'
    note: Короткая прямая просьба о двух билетах.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: Цена
    gloss: 'Спасатель говорит: Конечно! Пять долларов за один билет.'
    note: 'Отдельный факт: цена одного билета.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Мия спрашивает о шапочке
    gloss: 'Мия говорит: Нам нужны шапочки для плавания?'
    note: В вопросе *Do we need...?* также используется вспомогательный глагол *do*.
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: Правило о шапочках
    gloss: 'Спасатель говорит: Да, в бассейне обязательно носить шапочки.'
    note: '*swim caps are required* — пассивная конструкция, формально сообщающая правило. По-русски естественно сказать «шапочки обязательны» или «нужно носить шапочки».'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Дэниел спрашивает о шкафчиках
    gloss: 'Дэниел говорит: Где находятся шкафчики?'
    note: Короткий вопрос, не сообщающий нового факта о цене или времени.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: Расположение шкафчиков
    gloss: 'Спасатель говорит: Шкафчики находятся у входа.'
    note: 'Отдельный факт: расположение шкафчиков, а не то, что нужно для их использования.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Что нужно для шкафчиков
    gloss: 'Спасатель говорит: Для них нужна монета в один доллар.'
    note: '*a dollar coin* состоит из двух раздельно написанных слов: *dollar* и *coin*. По-русски говорят «монета в один доллар» или «долларовая монета».'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Мия спрашивает о времени закрытия
    gloss: 'Мия говорит: Во сколько вы закрываетесь?'
    note: В вопросе *What time do you close?* используется вспомогательный глагол *do*.
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: Время закрытия
    gloss: 'Спасатель говорит: Мы закрываемся в восемь часов.'
    note: 'Ещё один отдельный факт: время закрытия.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Текст: день в бассейне'
    gloss: 'Жарким июльским днём Дэниел и Мия решили освежиться в районном бассейне. У входа висела табличка с правилами: не бегать, в бассейне обязательно носить шапочку. Они попросили у спасателя два билета. Один билет стоил пять долларов. Спасатель объяснил, что шкафчики находятся у входа и для них нужна монета в один доллар. Дэниел и Мия положили сумки в шкафчик и плавали почти два часа. Перед уходом они ещё раз посмотрели на табличку: бассейн закрывается в восемь. Мия сказала, что хочет вернуться в следующие выходные и попробовать прыгнуть с трамплина.'
    note: '*required* используется в пассивной конструкции; *swim caps are required* значит «шапочки для плавания обязательны».'
