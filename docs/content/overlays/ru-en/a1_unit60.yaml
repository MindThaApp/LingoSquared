  en.a1.unit60.lesson02.teach.are_you_free:
    title: Are you free on Saturday?
    gloss: Ты свободен в субботу?
    note: '*on Saturday* — перед днём недели нужен предлог *on*; в русском здесь говорят «в субботу».'
  en.a1.unit60.lesson02.teach.would_you_like_dinner:
    title: Would you like to come to dinner?
    gloss: Хочешь прийти на ужин?
    note: '*Would you like to...?* — вежливый способ пригласить кого-то.'
  en.a1.unit60.lesson02.teach.bring_a_drink:
    title: Please bring a drink.
    gloss: Пожалуйста, принеси напиток.
    note: '*bring* здесь означает «принести с собой на встречу».'
  en.a1.unit60.lesson02.teach.i_can_come:
    title: I can come.
    gloss: Я могу прийти.
    note: Эта фраза коротко и ясно принимает приглашение.
  en.a1.unit60.lesson02.teach.cant_come:
    title: Sorry, I can't come.
    gloss: Извини, я не могу прийти.
    note: '*can''t* — сокращение от *cannot*.'
  en.a1.unit60.lesson02.teach.see_you_at_six:
    title: See you at six.
    gloss: До встречи в шесть.
    note: '*at six* — перед временем по часам нужен предлог *at*; в русском здесь говорят «в шесть».'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: Лейла спрашивает, свободен ли Даниэль
    gloss: 'Лейла говорит: Привет, Даниэль! Ты свободен в субботу?'
    note: '*Are you free...?* спрашивает, есть ли у человека время.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Даниэль свободен
    gloss: 'Даниэль говорит: Да, я свободен.'
    note: '*I am free* означает «у меня есть время».'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Лейла приглашает Даниэля
    gloss: 'Лейла говорит: Хочешь прийти на ужин?'
    note: '*Would you like to come...?* звучит вежливо и дружелюбно.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: Даниэль соглашается
    gloss: 'Даниэль говорит: Да, с удовольствием.'
    note: '*I''d love to* — тёплый способ сказать «да».'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: Лейла просит принести напиток
    gloss: 'Лейла говорит: Пожалуйста, принеси напиток.'
    note: '*Please bring...* — вежливая просьба.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Даниэль спрашивает о времени
    gloss: 'Даниэль говорит: Конечно. Во сколько?'
    note: '*What time?* — короткий естественный вопрос.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Лейла называет шесть часов
    gloss: 'Лейла говорит: До встречи в шесть.'
    note: '*at six* — перед временем по часам нужен предлог *at*.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Даниэль благодарит Лейлу
    gloss: 'Даниэль говорит: Отлично. Спасибо за приглашение.'
    note: В *Thank you for...* предлог *for* вводит причину благодарности.
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Приглашение
    gloss: 'Приглашение на ужин: суббота, 6:00. Пожалуйста, принеси напиток. Адрес: Park Street, 18.'
    note: В приглашении указаны день, время, что Даниэль должен принести, и адрес.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Текст: ужин у Лейлы дома'
    gloss: 'Ужин у Лейлы дома: Лейла пригласила Даниэля на ужин в субботу. Она попросила его принести напиток. Даниэль сказал, что сможет прийти. В приглашении было написано, что ужин в 6:00 по адресу Park Street, 18. Даниэль записал адрес в телефон. Он хотел прийти вовремя. Лейла была рада, потому что её друг смог прийти.'
    note: '*invited Daniel to dinner* означает, что Лейла пригласила Даниэля на ужин.'
