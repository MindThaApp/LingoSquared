teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: быть в состоянии / мочь
    note: '*be able to* означает, что у вас есть способность или возможность что-то сделать.'
    example_gloss: Я могу продлить права онлайн.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: суметь сделать
    note: '*manage to* значит, что что-то получилось, часто несмотря на трудности.'
    example_gloss: Мне удалось заполнить бланк за десять минут.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: продлить / обновить
    note: '*renew* значит продлить документ до того, как он истечёт.'
    example_gloss: Мне нужно продлить водительские права.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: водительские права
    note: '*license* здесь означает официальный документ, дающий право водить (сокращение от *driver''s license*). Британский английский пишет это существительное *licence*.'
    example_gloss: Срок действия моих прав истекает в этом месяце.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: онлайн
    note: '*online* значит через интернет, а не в физическом месте.'
    example_gloss: Теперь их можно продлить онлайн.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: лично / на месте
    note: '*in person* значит прийти самому, а не онлайн.'
    example_gloss: В прошлом году мне пришлось идти лично.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: выразить возможность в настоящем
    gloss: Теперь я могу продлить права онлайн.
    note: '*I am able to* выражает возможность в настоящем.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: отрицать возможность в прошлом
    gloss: В прошлом году я не мог сделать это онлайн.
    note: '*was not able to* выражает, что в прошлом такой возможности не было.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: сказать, что что-то удалось
    gloss: Мне удалось заполнить бланк за десять минут.
    note: '*managed to* подчёркивает, что что-то удалось, часто несмотря на усилия.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Настоящее и прошлое с 'be able to'
    gloss: Я могу его продлить. Я смог его продлить. Я мог бы тебе помочь.
    note: '*am able to* (сейчас), *was able to* (прошлое), *would be able to* (гипотетически или как предложение) — формы одной и той же конструкции.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: друг / подруга
    note: '*friend* значит друг или подруга.'
    example_gloss: Моя подруга продлила свои права на прошлой неделе.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: система
    note: '*system* значит организованный способ что-то делать.'
    example_gloss: Новая система намного быстрее.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Текст: новая система'
    gloss: В прошлом году люди не могли продлить права онлайн. Все должны были идти в учреждение лично. В этом году система изменилась. Теперь люди могут продлить всё из дома. Моя подруга Миа смогла сделать это за десять минут.
    note: Короткий текст о том, как новая система упрощает продление.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Лейла спрашивает о водительских правах
    gloss: 'Лейла говорит: Ты смог продлить права онлайн?'
    note: '*were you able to* спрашивает о возможности в прошлом.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'Ответ Даниэля: онлайн не получилось'
    gloss: 'Дэниел говорит: Нет, не смог. Мне пришлось идти в учреждение лично.'
    note: '*wasn''t able to* — разговорная краткая форма от *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Лейла рассказывает о своём опыте
    gloss: 'Лейла говорит: Правда? Мне удалось сделать это онлайн за десять минут.'
    note: '*managed to* подчёркивает, что у Лейлы всё получилось быстро и без проблем.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Даниэль думает о следующем разе
    gloss: 'Дэниел говорит: В следующий раз я смог бы сэкономить время, если бы тоже сделал это онлайн.'
    note: '*would be able to* здесь выражает гипотетическую возможность в будущем.'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Лейла предлагает помощь
    gloss: 'Лейла говорит: В следующий раз я могла бы тебе помочь, если хочешь.'
    note: '*would be able to* здесь используется для вежливого предложения.'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Даниэль благодарит
    gloss: 'Дэниел говорит: Спасибо, это было бы здорово.'
    note: '*I''d like that* — естественный способ с благодарностью принять предложение.'
