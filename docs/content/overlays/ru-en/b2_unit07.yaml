course:
  title: Английский B2
  description: Английский на уровне B2 для тонких разговоров, аргументации, предположений и профессиональных дискуссий, с объяснениями на неформальном русском.
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Условия, отказы и уступки
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 'Чтение: о чём договорились?'
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: пункт договорённости, условие соглашения
    note: '*term* — это пункт договорённости. Здесь это не «учебный период», как в школе.'
    example_gloss: Условие — это один из пунктов соглашения.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: предложение
    note: '*proposal* — это предложение возможных условий.'
    example_gloss: Предложение подсказывает возможные условия.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: отказ
    note: '*refusal* говорит, что условие неприемлемо. В английском чёткий отказ обычно звучит лучше, если назвать причину.'
    example_gloss: Отказ говорит, что условие неприемлемо.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: уступка
    note: '*concession* значит, что ты отказываешься от части своей позиции, чтобы соглашение стало возможным.'
    example_gloss: Уступка — это отказ от части своей позиции.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: объём работ
    note: '*scope* — это сколько работы входит в задачу. В переговорах можно взвешивать срок и объём работ друг против друга.'
    example_gloss: Объём работ — это количество работы, которое входит в задачу.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: условие (то, что должно быть выполнено)
    note: '*condition* — это то, что должно выполняться, чтобы договорённость заработала.'
    example_gloss: Условие нужно выполнить, прежде чем договорённость вступит в силу.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Уступка на условии
    gloss: Я могу согласиться на более ранний срок при условии, что объём работ будет сокращён.
    note: '*I can agree... on condition that...* звучит чётко, но профессионально. Фраза смягчает, не становясь расплывчатой.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Чёткий отказ
    gloss: Я не могу согласиться на вторник при полном объёме работ.
    note: '*I cannot agree to...* звучит деловее, чем резкий отказ вроде *No, that is impossible*.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Принять с условием
    gloss: Я могу это принять, если полное приложение будет прислано на следующей неделе.
    note: '*I can accept that if...* делает условие явным.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Отказать и всё же вести переговоры
    gloss: Используй I cannot agree, чтобы чётко обозначить границу. Используй I can agree on condition that, чтобы предложить уступку с условием.
    note: Слишком прямой отказ может прозвучать в английском резко. Назови границу, причину и условие.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: краткое изложение для руководства
    note: '*executive summary* — это короткое изложение главных пунктов отчёта.'
    example_gloss: Краткое изложение для руководства даёт главные пункты отчёта.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: графики, диаграммы
    note: '*charts* показывают информацию наглядно.'
    example_gloss: Графики показывают информацию наглядно.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Текст для чтения: пересмотренные условия'
    gloss: 'Прия сначала предложила четверг как срок сдачи полного отчёта. Маркус возразил, потому что клиенту нужно было раньше. Прия отказалась соглашаться на вторник при полном объёме работ, потому что это поставило бы под угрозу качество. Затем она предложила уступку с условием: вторник возможен, если объём сократить до краткого изложения для руководства и графиков. Маркус принял это условие, но добавил один пункт: полное приложение должно прийти на следующей неделе. Итог договорённости: вторник для краткого изложения и графиков, следующая неделя для приложения.'
    note: 'Переговоры твёрдые, но профессиональные: отказ, причина, условие и согласие.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Прия делает предложение
    gloss: 'Прия говорит: Мы можем сдать отчёт к четвергу, если объём работ останется таким, как планировалось.'
    note: Она сразу связывает срок с объёмом работ.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Маркус возражает
    gloss: 'Маркус говорит: Четверг для клиента слишком поздно. Можешь сдать к вторнику?'
    note: Он просит более ранний срок, не меняя сразу объём работ.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Прия отказывает с причиной
    gloss: 'Прия говорит: Я не могу согласиться на вторник при полном объёме работ. Это поставило бы под угрозу качество.'
    note: Причина делает отказ профессиональным и менее резким.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Маркус спрашивает об условиях
    gloss: 'Маркус говорит: Что сделало бы вторник возможным?'
    note: Этот вопрос открывает путь к уступке с условием.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Прия предлагает условие
    gloss: 'Прия говорит: Я могу согласиться на более ранний срок при условии, что объём работ будет сокращён до краткого изложения для руководства и графиков.'
    note: '*on condition that* звучит чётко и профессионально.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Маркус принимает с дополнительным условием
    gloss: 'Маркус говорит: Я могу это принять, если полное приложение будет прислано на следующей неделе.'
    note: Он соглашается, но фиксирует, когда будет сдана остальная часть.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Прия закрепляет договорённость
    gloss: 'Прия говорит: Договорились. Вторник для краткого изложения и графиков, следующая неделя для приложения.'
    note: '*Agreed* коротко и ясно завершает переговоры.'
