course:
  title: Английский A1
  description: 'Английский уровня A1: приветствия и короткие разговоры в повседневных ситуациях, с подробными объяснениями на русском языке.'
units:
  en.a1.unit35.technology:
    title: Устройства и приложения
lessons:
  en.a1.unit35.lesson01.device_vocabulary:
    title: Телефоны и другие устройства
  en.a1.unit35.lesson02.using_your_phone:
    title: Как пользоваться телефоном
  en.a1.unit35.lesson03.dialogue_new_phone:
    title: 'Разговор: старый телефон'
  en.a1.unit35.lesson04.how_they_use_their_phones:
    title: 'Чтение: как они пользуются телефоном'
teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: телефон
    note: '*phone* значит «телефон».'
    example_gloss: Я звоню маме со своего телефона.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: ноутбук
    note: '*laptop* значит «ноутбук».'
    example_gloss: Она использует свой ноутбук для работы.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: планшет
    note: '*tablet* значит «планшет».'
    example_gloss: Он читает книги на своём планшете.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: компьютер
    note: '*computer* значит «компьютер».'
    example_gloss: У нас дома есть компьютер.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: приложение
    note: '*app* значит «приложение».'
    example_gloss: У меня на телефоне новое приложение.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: камера
    note: '*camera* значит «камера», «фотоаппарат».'
    example_gloss: Эта камера делает потрясающие фото.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: позвонить
    note: '*make a call* — устойчивое сочетание глагола и существительного, его нужно запомнить целиком. В русском для этого есть один глагол, «позвонить», а в английском сочетание *make* + *call* работает как одно выражение.'
    example_gloss: Я каждое воскресенье звоню брату.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: отправить сообщение
    note: '*send a text* — тоже устойчивое сочетание глагола и существительного, как и *make a call*. В русском для этого говорят «отправить сообщение», «написать смс». В английском обычно используется сочетание *send a text*.'
    example_gloss: Она каждое утро отправляет сообщение своей подруге.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: скачать приложение
    note: '*download an app*: *download* — такой же простой глагол, как русское «скачать», так что это самое лёгкое из трёх устойчивых сочетаний.'
    example_gloss: Он каждую неделю скачивает новое приложение.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: вайфай
    note: '*wifi* значит «вайфай» (беспроводной интернет).'
    example_gloss: Вайфай у меня дома быстрый.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: батарея
    note: '*battery* значит «батарея», «аккумулятор».'
    example_gloss: Батарея моего телефона почти разряжена.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: Как ты пользуешься своим телефоном?
    note: В *Do you use ...?* используется то же вспомогательное *do*, что и в других английских вопросах.
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: Жалоба Мии
    gloss: 'Мия говорит: Мой телефон такой старый. Он очень медленный.'
    note: '*so* + прилагательное (*so old*) усиливает значение, как «такой» или «очень» в русском.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Совет Лейлы
    gloss: 'Лейла говорит: Тебе стоит купить новый. Для чего ты его чаще всего используешь?'
    note: '*What do you use it for most?* заканчивается предлогом *for*. В русском предлог идёт перед вопросительным словом («Для чего ты его используешь?»), а в английском вопрос начинается с *what*, и *for* остаётся в конце.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Ответ: Миа"
    gloss: 'Мия говорит: В основном я пишу сообщения сестре и делаю фото.'
    note: '*text* можно использовать и как глагол (*I text my sister*). Это встречается чаще, чем *send a text*, оба варианта правильные.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: Как пользуется Лейла
    gloss: 'Лейла говорит: Я звоню родителям каждые выходные со своего телефона. Я также пользуюсь многими приложениями.'
    note: '*call* как глагол (*I call my parents*) — обычный разговорный вариант. *Make a call* — устойчивое сочетание из урока 2.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: Вопрос Мии
    gloss: 'Мия спрашивает: Какими приложениями ты пользуешься?'
    note: '*Which apps do you use?*: *which* спрашивает о выборе из группы (приложения), как «какие» в русском.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'Лейла говорит: Я пользуюсь кулинарным приложением и приложением с картами. Хочешь их скачать?'
    note: '*Do you want to ...?* строится с *do*, хотя *want* само по себе обычный глагол.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Ответ: Миа"
    gloss: 'Мия говорит: Да, пожалуйста, пришли мне названия!'
    note: '*please* стоит здесь перед глаголом (*please send ...*) и делает просьбу вежливее.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Текст о Даниэле, Лейле и Мии
    gloss: Даниэль, Лейла и Мия пользуются телефонами по-разному. Даниэль не любит писать сообщения, он предпочитает звонить. Лейла использует телефон для карт. Ещё она пользуется кулинарным приложением, когда пробует новые рецепты. Мия делает много фотографий и отправляет их своей семье. Все они используют ноутбуки для работы, а по выходным общаются с друзьями по видеосвязи.
    note: '*He prefers to call people instead*: *instead* в конце предложения значит «вместо этого» (то есть вместо сообщений).'
