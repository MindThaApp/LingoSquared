teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: перенести
    note: '*reschedule* значит перенести встречу на другое время.'
    example_gloss: Мне нужно перенести ремонт, потому что я буду на работе.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: сосед, соседка
    note: '*neighbor* — человек, который живёт рядом с вами. Английское слово не говорит, мужчина это или женщина.'
    example_gloss: Моя соседка может открыть дверь сантехнику.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: ключ
    note: '*key* — небольшой металлический предмет, которым открывают дверь.'
    example_gloss: Я оставлю ключ у соседки.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: протечка
    note: '*leak* здесь существительное: само место, откуда течёт вода. Глагол *to leak* значит «протекать, капать».'
    example_gloss: Протечка под моей кухонной раковиной усиливается.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: починено
    note: '*fixed* — причастие от *to fix* («чинить»), означает, что вещь больше не сломана.'
    example_gloss: Раковина теперь починена, и вода больше не течёт.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: время после полудня
    note: '*afternoon* — часть дня после полудня; время до полудня называется *morning*.'
    example_gloss: Сантехник пришёл во второй половине дня, а не утром.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't и won't, когда что-то не получается
    gloss: Я не могу быть дома с 14:00 до 16:00. Во второй половине дня меня не будет дома.
    note: '*can''t* говорит, что что-то невозможно. *won''t* говорит, что в будущем просто не будет так.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Сказать, что хотите перенести встречу
    gloss: Мне нужно перенести ремонт.
    note: '*I need to ...* — деловая, нейтральная формулировка: это необходимо, но звучит не грубо.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Попросить другое время
    gloss: Было бы возможно прийти вместо этого утром?
    note: '*Would it be possible to ...?* — самая осторожная форма просьбы. *instead* значит «вместо этого».'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Сказать, где ключ
    gloss: Я оставлю ключ у соседки.
    note: '*leave something with someone* значит оставить что-то у кого-то.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Спросить, решена ли проблема
    gloss: Протечка теперь устранена?
    note: '*Is ... fixed?* спрашивает о результате, а не о самой работе.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Назвать причину с because
    gloss: Я не могу быть дома с 14:00 до 16:00, потому что в это время я на работе.
    note: '*because* связывает проблему с причиной. Как и в русском, порядок слов после него не меняется: глагол остаётся на своём обычном месте.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: сообщение
    note: '*message* — любое короткое письменное сообщение: СМС, сообщение в чате или короткое электронное письмо.'
    example_gloss: Я получил сообщение о новом времени ремонта.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: Сообщение о новой дате
    gloss: Ремонт 6180 перенесён. Сантехник придёт завтра с 9:00 до 11:00. Ваша соседка откроет дверь. Пожалуйста, подтвердите это новое время сообщением сегодня.
    note: 'Сообщение от управляющей компании короткое и деловое: что изменилось, когда и что вам ещё нужно сделать.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Когда просят подтвердить
    gloss: Пожалуйста, подтвердите это новое время сообщением сегодня.
    note: '*confirm* значит «подтвердить»; *by message* значит «сообщением».'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Даниэль звонит в управляющую компанию
    gloss: 'Дэниел говорит: Здравствуйте, мне нужно перенести ремонт.'
    note: По телефону начинают с *Hello* и сразу называют цель звонка.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: Управляющая компания спрашивает, какой ремонт
    gloss: 'Управляющая компания говорит: Без проблем. О каком ремонте речь?'
    note: '*Which repair is it?* спрашивает об одной вещи из известной группы.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Даниэль называет номер заявки на ремонт
    gloss: 'Дэниел говорит: Ремонт 6180, протечка под моей кухонной раковиной.'
    note: 'Тот же номер ремонта, что и в уроке 29: та же протекающая раковина.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: Управляющая компания спрашивает о причине
    gloss: 'Управляющая компания говорит: Понятно. Почему вы не можете быть дома?'
    note: '*Why can''t you ...?* спрашивает о причине, по которой что-то не получается.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Даниэль называет причину и просит утро
    gloss: 'Дэниел говорит: Я не могу быть дома с 14:00 до 16:00, потому что в это время я на работе. Можно ли вместо этого прийти утром?'
    note: 'Сначала причина, потом просьба: так звучит вежливее, чем сразу что-то требовать.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: Управляющая компания предлагает новый срок
    gloss: 'Управляющая компания говорит: Да, сантехник может прийти с 9:00 до 11:00.'
    note: '*between 9am and 11am* — новый промежуток времени.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Даниэль решает вопрос с ключом
    gloss: 'Дэниел говорит: Спасибо. Я оставлю ключ у соседки.'
    note: То же предложение, что и во втором уроке.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: Управляющая компания просит подтвердить
    gloss: 'Управляющая компания говорит: Хорошо. Пожалуйста, подтвердите это новое время сообщением сегодня.'
    note: То же требование, что и в сообщении из урока 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Даниэль говорит, когда подтвердит
    gloss: 'Дэниел говорит: Я подтвержу его сегодня днём.'
    note: '*this afternoon* значит «сегодня во второй половине дня», то есть сегодня после полудня.'
