course:
  title: Английский A2
  description: Английский уровня A2 для более формальных повседневных ситуаций, с подробными объяснениями на русском языке.
units:
  en.a2.unit38.repair_visit:
    title: Переносим и подтверждаем время ремонта
lessons:
  en.a2.unit38.lesson01.repair_visit_vocabulary:
    title: Перенос, ключ и соседи
  en.a2.unit38.lesson02.moving_the_appointment:
    title: Переносим приём на другое время
  en.a2.unit38.lesson03.reading_a_rescheduling_message:
    title: Читаем сообщение о новом времени
  en.a2.unit38.lesson04.repair_visit_dialogue:
