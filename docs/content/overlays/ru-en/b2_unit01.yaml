    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: Позиция, доказательства и опровержение
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 'Чтение: защита гибридного графика'
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: позиция, утверждение
    note: '*claim* — это позиция, которую ты отстаиваешь. Здесь это не жалоба и не требование о возмещении ущерба.'
    example_gloss: Её позиция в том, что план нужно продолжать.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: доказательства, подтверждающие данные
    note: '*evidence* — это факты, цифры или примеры, которыми ты подкрепляешь свою позицию.'
    example_gloss: Этот пример даёт Мии доказательства в пользу её позиции.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: контраргумент
    note: '*counterargument* — это довод против твоей позиции. По-английски это слово пишется слитно.'
    example_gloss: Дэниел выдвигает контраргумент.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: опровергать
    note: '*rebut* значит ответить на контраргумент, не отказываясь от собственной позиции.'
    example_gloss: Миа опровергает опасения с помощью доказательств.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: уступать, признавать
    note: '*concede* значит признать, что часть чужого довода разумна. Это не то же самое, что отказаться от всей своей позиции.'
    example_gloss: Можно признать обоснованность опасений, не отказываясь от своей главной позиции.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: перевешивать
    note: '*outweigh* употребляется, когда преимущество, риск или причина важнее чего-то другого.'
    example_gloss: Убедительные доказательства могут перевесить опасения.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Признать риск и сохранить позицию
    gloss: Я согласен, что у плана есть риски, но доказательства по-прежнему говорят в пользу того, чтобы продолжать.
    note: '*I agree..., but...* сначала признаёт чужой довод. Затем *but the evidence still supports...* показывает, что твоя позиция остаётся прежней.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Назвать главную причину
    gloss: Самая веская причина в том, что результаты опроса были последовательными.
    note: '*The strongest reason is that...* вводит твоё главное обоснование. Обрати внимание на порядок слов после *that*: сначала подлежащее, потом сказуемое.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Признать обоснованность опасений
    gloss: Это справедливые опасения; однако данные указывают в другом направлении.
    note: '*That is a fair concern; however,...* звучит профессионально: ты признаёшь опасения, но опровергаешь их данными.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Как отстаивать позицию
    gloss: Назови свою позицию, приведи доказательства, признай самый сильный довод противников и опровергни его. Фразы вроде That is a fair concern и However помогают звучать разумно, не отказываясь от своей позиции.
    note: 'Порядок слов в английском предложении фиксированный, в отличие от русского, где его можно свободно менять: *the data points in the other direction*, а не *the data in the other direction points*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: удержание сотрудников
    note: '*retention* здесь значит, что сотрудники остаются, а не уходят.'
    example_gloss: Лучшее удержание сотрудников означает, что из команды уходит меньше людей.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: сотрудничество
    note: '*collaboration* — это совместная работа над задачей или проектом. В русском слово «коллаборация» (и особенно «коллаборационизм») нередко несёт негативный исторический оттенок, а в английском *collaboration* нейтрально и означает обычное сотрудничество.'
    example_gloss: Хорошее сотрудничество помогает команде завершить работу.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Текст для чтения: защита гибридного графика'
    gloss: 'Миа доказывает, что компания должна сохранить гибридный график и в следующем квартале. Её главная позиция: гибридная работа улучшает удержание сотрудников и не снижает результативность. Самое весомое доказательство — опрос персонала: сотрудники гибридных команд реже говорили, что ищут другую работу. Самый сильный контраргумент состоит в том, что сотрудничество может ухудшиться, если люди не бывают в офисе каждый день. Миа признаёт эти опасения, но опровергает их данными по проектам: гибридные команды сдавали работу вовремя, а их оценки по результатам проверки были чуть выше. Поэтому она делает вывод, что преимущества перевешивают риски.'
    note: 'Текст выстраивает полный аргумент: позиция, доказательства, контраргумент, опровержение и вывод.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Миа называет свою позицию
    gloss: 'Миа говорит: Я думаю, что мы должны сохранить гибридный график на следующий квартал.'
    note: Миа начинает с ясной позиции, которую можно отстаивать.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Дэниел спрашивает о причине
    gloss: 'Дэниел говорит: Какова твоя самая веская причина?'
    note: Дэниел спрашивает не о мнении вообще, а о главном обосновании.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Миа приводит доказательства
    gloss: 'Миа говорит: Самая веская причина — удержание сотрудников. В опросе персонала люди, работавшие в гибридном режиме, реже говорили, что ищут другую работу.'
    note: Миа опирается на результаты опроса как на доказательство, а не просто на ощущение.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Дэниел называет контраргумент
    gloss: 'Дэниел говорит: Некоторые руководители считают, что сотрудничество слабее, когда люди не бывают в офисе каждый день.'
    note: Это контраргумент, на который Мие предстоит ответить.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Миа опровергает данными
    gloss: 'Миа говорит: Это справедливые опасения. Однако данные по проектам их не подтверждают. Гибридные команды сдавали работу вовремя, а их оценки по результатам проверки были чуть выше.'
    note: В *does not support it* используется *does*, потому что в английском отрицание в настоящем времени строится с вспомогательным глаголом *do*.
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Дэниел подводит итог позиции
    gloss: 'Дэниел говорит: То есть твоя позиция в том, что преимущества перевешивают риски?'
    note: '*outweigh* выражает сопоставление преимуществ и рисков.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Миа завершает предложением решения
    gloss: 'Миа говорит: Именно. Нам нужно улучшить порядок проведения совещаний, а не отменять график.'
    note: Миа защищает план, но при этом предлагает практическое улучшение.
