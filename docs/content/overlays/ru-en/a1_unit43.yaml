teaching:
  en.a1.unit43.lesson01.teach.red:
    title: red
    gloss: красный
    note: '*red* значит «красный».'
    example_gloss: Моя машина красная.
  en.a1.unit43.lesson01.teach.blue:
    title: blue
    gloss: синий / голубой
    note: '*blue* значит «синий», «голубой».'
    example_gloss: Небо голубое.
  en.a1.unit43.lesson01.teach.green:
    title: green
    gloss: зелёный
    note: '*green* значит «зелёный».'
    example_gloss: Трава зелёная.
  en.a1.unit43.lesson01.teach.yellow:
    title: yellow
    gloss: жёлтый
    note: '*yellow* значит «жёлтый».'
    example_gloss: Солнце жёлтое.
  en.a1.unit43.lesson01.teach.black:
    title: black
    gloss: чёрный
    note: '*black* значит «чёрный».'
    example_gloss: Его туфли чёрные.
  en.a1.unit43.lesson01.teach.white:
    title: white
    gloss: белый
    note: '*white* значит «белый».'
    example_gloss: Её рубашка белая.
  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: тёмно-синий
    note: '*dark blue* в английском пишется двумя отдельными словами, а не через дефис, как русское «тёмно-синий».'
    example_gloss: На нём тёмно-синяя рубашка.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: светло-зелёный
    note: '*light green* пишется так же, как *dark blue*: двумя отдельными словами, а не через дефис, как русское «светло-зелёный».'
    example_gloss: Она покрасила свою спальню в светло-зелёный цвет.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: хорошо сочетается с
    note: '*goes well with* значит, что два цвета или предмета одежды хорошо сочетаются друг с другом.'
    example_gloss: Эта синяя рубашка хорошо сочетается с чёрными брюками.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: слишком яркий
    note: '*too bright* значит «слишком яркий», «слишком бросающийся в глаза».'
    example_gloss: Жёлтый — весёлый цвет, но для работы он слишком яркий.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: Какой твой любимый цвет?
    note: '*What''s your favorite ...?* спрашивает о предпочтении.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: Мой любимый цвет — синий.
    note: '*My favorite ... is ...* — привычный способ назвать то, что тебе нравится больше всего.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: Мне нужна новая рубашка для нашей презентации на следующей неделе. Поможешь выбрать цвет?'
    note: '*Can you help me* + глагол*?* просит о помощи.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: Вопрос Мии
    gloss: 'Миа говорит: Конечно! Какие цвета тебе нравятся?'
    note: '*What colors do you like?* спрашивает, какие цвета нравятся человеку.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Мне нравятся синий и зелёный, но я не уверен, что выглядит профессионально.'
    note: '*I''m not sure what looks professional* значит «я не уверен, что выглядит профессионально».'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Совет Мии
    gloss: 'Миа говорит: Тёмно-синий — отличный выбор. Он выглядит профессионально и хорошо сочетается с чёрными брюками.'
    note: '*It looks professional* значит «это выглядит профессионально».'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: А как насчёт вот этой жёлтой?'
    note: '*What about ...?* предлагает другой вариант.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Совет Мии
    gloss: 'Миа говорит: Жёлтый — весёлый цвет, но для презентации он слишком яркий. Я бы выбрала тёмно-синюю рубашку.'
    note: '*I''d choose* значит «я бы выбрал(а)».'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: Решение Даниэля
    gloss: 'Даниэль говорит: Спасибо, Миа. Значит, тёмно-синяя!'
    note: '*Dark blue it is!* — неформальный способ подтвердить решение.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Текст о трёх любимых цветах
    gloss: У Даниэля, Лейлы и Мии разные любимые цвета. Любимый цвет Даниэля — синий. Он говорит, что это спокойный цвет и что он хорошо сочетается почти со всем, что он носит на работу. Любимый цвет Лейлы — зелёный, цвет растений и садов, которые она любит рисовать. Светло-зелёный кажется ей особенно красивым. Любимый цвет Мии — жёлтый, потому что он напоминает ей о солнце и всегда поднимает настроение. Хотя им нравятся разные цвета, они согласны, что цвета делают каждый день веселее.
    note: '*reminds her of the sun* значит «напоминает ей о солнце».'
