    title: '''in order to'' и ''so that'''
    gloss: Я учусь, чтобы улучшить свой английский. Я учусь, чтобы запомнить больше.
    note: '*in order to* стоит перед глаголом; *so that* стоит перед полным придаточным предложением. В русском для обоих случаев используется «чтобы»: *in order to* — «чтобы» + инфинитив, *so that* — «чтобы» + придаточное.'
