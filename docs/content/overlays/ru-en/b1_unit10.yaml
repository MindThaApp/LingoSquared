  en.b1.unit10.lesson03.teach.reading_passage:
    title: 'Текст: чёткие цели'
    gloss: У Дэниела и Лейлы обоих есть чёткие цели. Дэниел ходит на вечерний курс, чтобы улучшить английский для работы. Он тренируется писать короткие обновления, чтобы звучать более профессионально. Лейла копит деньги, чтобы в следующем году пойти на курс дизайна. Она читает описания курсов, чтобы выбрать подходящую программу.
    note: Короткий текст о целях с *in order to* и *so that*.
