    gloss: 'Лейла говорит: Это понятно. Ты занимаешься каждый вечер?'
    note: Уточняющий вопрос о том, как Дэниел собирается достичь цели.
  en.b1.unit10.lesson04.teach.a_remember_vocabulary:
    title: Даниэль использует 'so that'
    gloss: 'Дэниел говорит: Я занимаюсь тридцать минут, чтобы запомнить больше слов.'
    note: '*so that I can remember...* называет желаемый результат.'
  en.b1.unit10.lesson04.teach.q_saving_money:
    title: Лейла называет собственную цель
