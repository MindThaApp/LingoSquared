teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: дружелюбный
    note: '*friendly* значит «дружелюбный»: приветливый и с ним легко общаться.'
    example_gloss: Мой сосед очень дружелюбный.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: смешной / забавный
    note: '*funny* значит «смешной», «забавный»: тот, кто смешит других.'
    example_gloss: Мой брат очень смешной.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: трудолюбивый
    note: '*hardworking* значит «трудолюбивый»: тот, кто усердно работает и не сдаётся.'
    example_gloss: Она трудолюбивая сотрудница.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: застенчивый
    note: '*shy* значит «застенчивый»: человек стесняется или нервничает среди незнакомых людей.'
    example_gloss: Он поначалу немного стесняется.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: спокойный
    note: '*calm* значит «спокойный»: такого человека нелегко расстроить или заставить нервничать.'
    example_gloss: Моя мама очень спокойная.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: разговорчивый
    note: '*talkative* значит «разговорчивый»: тот, кто много говорит.'
    example_gloss: Моя сестра очень разговорчивая.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: немного застенчивый
    note: '*a little* здесь значит «немного», «слегка» (степень), а не «маленький» (размер): не переводи это как «маленький застенчивый».'
    example_gloss: Он поначалу немного стесняется, но быстро осваивается.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: очень трудолюбивый
    note: '*very hardworking* значит «очень трудолюбивый».'
    example_gloss: Мой коллега очень трудолюбивый.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: иметь отличное чувство юмора
    note: '*have a great sense of humor* значит «иметь отличное чувство юмора».'
    example_gloss: У Даниэля отличное чувство юмора.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: ладить со всеми
    note: '*get along with everyone* значит «ладить со всеми».'
    example_gloss: Миа ладит со всеми на работе.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: быстро осваиваться / быстро раскрываться
    note: '*warm up quickly* значит «быстро осваиваться среди новых людей».'
    example_gloss: Он застенчивый, но быстро раскрывается, как только узнаёт тебя.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: Какой он?
    note: '*What''s he like?* спрашивает о характере человека, а не о том, как он выглядит.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: Вопрос Мии
    gloss: 'Миа спрашивает: На следующей неделе я начинаю новый проект с Даниэлем. Какой он?'
    note: '*What''s he like?* спрашивает о характере человека.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Он очень дружелюбный и к тому же очень смешной.'
    note: '*and he''s really funny too* значит «и к тому же он очень смешной».'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: Вопрос Мии
    gloss: 'Миа говорит: Приятно слышать! С ним легко работать?'
    note: '*Is he easy to work with?* спрашивает, приятно ли работать с человеком.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Да, он ещё и очень трудолюбивый. Он всегда выполняет задачи вовремя.'
    note: '*finishes his tasks on time* значит «выполняет задачи вовремя».'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: Вопрос Мии
    gloss: 'Миа спрашивает: Он когда-нибудь стесняется на совещаниях?'
    note: '*ever* здесь значит «когда-нибудь», «бывает ли, что».'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Немного, но он чувствует себя увереннее, как только узнаёт тебя.'
    note: '*once he knows you* значит «как только он тебя узнает».'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Благодарность Мии
    gloss: 'Миа говорит: Спасибо, Лейла. Теперь я спокойнее отношусь к проекту.'
    note: '*I feel more relaxed* значит «я чувствую себя спокойнее, расслабленнее».'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Текст о трёх характерах
    gloss: 'Даниэль, Лейла и Миа — близкие друзья, но характеры у них очень разные. Даниэль дружелюбный и смешной: он всегда смешит друзей. Он немного застенчив с новыми людьми, но быстро осваивается. Лейла спокойная и творческая. Она любит рисовать, потому что это помогает ей расслабиться, и она редко из-за чего-то расстраивается. Миа общительная и организованная. Она любит составлять планы для всей компании и очень терпелива, когда учит друзей чему-то новому: именно она научила Даниэля готовить. Хотя все они разные, они хорошо ладят и любят проводить время вместе.'
    note: '*even though* значит «хотя», «несмотря на то что».'
