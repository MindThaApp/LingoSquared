teaching:
  en.a1.unit19.lesson01.teach.like:
    title: like
    gloss: любить, нравиться
    note: '*like* значит «нравиться» или «любить».'
    example_gloss: Я люблю кофе.
  en.a1.unit19.lesson01.teach.dont_like:
    title: don't like
    gloss: не любить, не нравиться
    note: '*don''t like* — отрицательная форма от *like*.'
    example_gloss: Я не люблю чай.
  en.a1.unit19.lesson01.teach.prefer:
    title: prefer
    gloss: предпочитать
    note: С помощью *prefer* ты говоришь, что тебе больше по душе или что ты выберешь, если есть выбор.
    example_gloss: Я предпочитаю кофе.
  en.a1.unit19.lesson01.teach.love:
    title: love
    gloss: обожать, очень любить
    note: '*love* значит «очень сильно любить».'
    example_gloss: Я очень люблю свою семью.
  en.a1.unit19.lesson01.teach.hate:
    title: hate
    gloss: ненавидеть, терпеть не мочь
    note: '*hate* — противоположность *love*.'
    example_gloss: Я терпеть не могу опаздывать.
  en.a1.unit19.lesson02.teach.do_you_like_or:
    title: Do you like coffee or tea?
    gloss: Ты любишь кофе или чай?
    note: Эту фразу используют, чтобы спросить о выборе из двух вариантов.
  en.a1.unit19.lesson02.teach.i_prefer_tea:
    title: I prefer tea.
    gloss: Я предпочитаю чай.
    note: С помощью *I prefer...* ты говоришь, что тебе больше по душе.
  en.a1.unit19.lesson02.teach.because_reason:
    title: I like tea because it's milder.
    gloss: Я люблю чай, потому что он мягче.
    note: '*because* используют, чтобы назвать причину предпочтения.'
  en.a1.unit19.lesson03.teach.very_much:
    title: very much
    gloss: очень сильно
    note: '*very much* значит «очень сильно».'
    example_gloss: Я очень люблю кофе.
  en.a1.unit19.lesson03.teach.preference_text:
    title: Текст о предпочтениях
    gloss: Я люблю чай, но не люблю кофе. Я предпочитаю чай, потому что он мягче.
    note: В этом коротком тексте человек говорит, что ему нравится и почему.
  en.a1.unit19.lesson04.teach.too_strong:
    title: It's too strong.
    gloss: Он слишком крепкий.
    note: '*too strong* значит «слишком крепкий».'
  en.a1.unit19.lesson04.teach.q_coffee_or_tea:
    title: Вопрос про кофе или чай
    gloss: 'Лейла спрашивает: Ты любишь кофе или чай?'
    note: Тот же вопрос, что и во втором уроке.
  en.a1.unit19.lesson04.teach.a_prefer_tea_not_much:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Я предпочитаю чай. Кофе я не очень люблю.'
    note: Даниэль называет своё предпочтение, а потом добавляет подробность.
  en.a1.unit19.lesson04.teach.q_why_not:
    title: Why not?
    gloss: Почему нет?
    note: С помощью *Why not?* спрашивают о причине, когда кому-то что-то не нравится.
  en.a1.unit19.lesson04.teach.a_too_strong_calmer:
    title: Полный ответ Даниэля
    gloss: 'Даниэль говорит: Я думаю, он слишком крепкий. Я люблю чай, потому что он мягче.'
    note: Даниэль объясняет, почему ему не нравится кофе и почему он предпочитает чай.
  en.a1.unit19.lesson04.teach.he_prefers_thinks:
    title: He prefers tea. He thinks it's too strong.
    gloss: Он предпочитает чай. Он считает, что кофе слишком крепкий.
    note: '*prefers* и *thinks* — формы третьего лица единственного числа (*he*/*she*), в конце у них стоит *-s*.'
