teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: район
    note: '*neighborhood* значит «район»: местность вокруг твоего дома, с ближайшими улицами и зданиями.'
    example_gloss: Я люблю свой район.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: сосед / соседка
    note: '*neighbor* значит «сосед»: человек, который живёт рядом с тобой или недалеко от тебя.'
    example_gloss: Мой сосед очень отзывчивый.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: рядом / поблизости
    note: '*nearby* значит «рядом», «поблизости».'
    example_gloss: Поблизости есть парк.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: тихий / спокойный
    note: '*quiet* значит «тихий», «спокойный»: без лишнего шума.'
    example_gloss: Моя улица ночью очень тихая.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: шумный
    note: '*noisy* значит «шумный»: полный громких звуков.'
    example_gloss: Улица рядом с моей шумная.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: дружелюбный
    note: '*friendly* значит «дружелюбный».'
    example_gloss: Мои соседи очень дружелюбные.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: жить в районе
    note: '*live in a neighborhood* значит «жить в каком-то районе».'
    example_gloss: Я живу в тихом районе.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: ладить с соседями
    note: '*get along with your neighbors* значит «поддерживать хорошие, дружеские отношения с теми, кто живёт рядом».'
    example_gloss: Я лажу со своими соседями.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: близко к
    note: '*close to* значит «близко к» (какому-то месту).'
    example_gloss: Моя квартира недалеко от продуктового магазина.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: пять минут пешком
    note: '*a five-minute walk* — устойчивый английский оборот: число + существительное через дефис, причём существительное стоит в единственном числе (не *minutes*). По-русски мы говорим просто «пять минут пешком».'
    example_gloss: Парк в пяти минутах ходьбы от моего дома.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: здороваться с
    note: '*say hello to* значит «поздороваться с кем-то».'
    example_gloss: Утром я всегда здороваюсь со своим соседом.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: Какой у тебя район?
    note: '*What''s ... like?* спрашивает об описании, а не о предпочтении.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: Вопрос Лейлы
    gloss: 'Лейла говорит: Я, возможно, скоро перееду. Какой у тебя район, Миа?'
    note: '*might* + глагол выражает возможность: может быть, да, а может быть, нет.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Мне там очень нравится. Там тихо, и поблизости есть парк.'
    note: '*there''s a park nearby* значит «поблизости есть парк».'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: Вопрос Лейлы
    gloss: 'Лейла говорит: Звучит здорово. Это близко к продуктовому магазину?'
    note: '*That sounds nice* — естественная реакция на хорошую новость.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Да, есть один всего в пяти минутах ходьбы от моего дома.'
    note: '*just* здесь значит «всего», «только»: подчёркивает, что расстояние небольшое.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: Вопрос Лейлы
    gloss: 'Лейла спрашивает: А как твои соседи? Они дружелюбные?'
    note: '*What about ...?* — естественный способ перейти к новой теме.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Очень! Мой сосед, господин Лопес, поливает мои цветы, когда меня нет.'
    note: '*waters my plants* значит «поливает мои растения»: в английском *water* здесь глагол.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: Реакция Лейлы
    gloss: 'Лейла говорит: Как мило. Кажется, я бы хотела жить рядом с тобой!'
    note: '*I''d like to* + глагол значит «я бы хотел(а)» + действие.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Текст о трёх районах
    gloss: 'Даниэль, Лейла и Миа живут в разных районах. Район Даниэля оживлённый: рестораны и магазины рядом с его домом. Он знает нескольких соседей и часто здоровается с ними в коридоре. Лейла живёт в тихом районе, недалеко от бассейна, где она плавает. У её соседки напротив большая собака, которая много лает. Район Мии тоже тихий, а продуктовый магазин всего в пяти минутах ходьбы от её дома. Её сосед господин Лопес очень дружелюбный и поливает её цветы, когда её нет. Поговорив с Мией, Лейла решила поискать квартиру рядом с ней.'
    note: '*decided she wants to look for* значит «решила, что хочет поискать (квартиру)».'
