teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: наличные
    note: '*cash* — это наличные деньги (купюры и монеты). В английском это неисчисляемое слово: *some cash*, но не *a cash*.'
    example_gloss: У меня есть немного наличных.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: карта
    note: '*card* — общее слово для любой пластиковой платёжной карты.'
    example_gloss: Моя карта синяя.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: кредитная карта
    note: '*credit card* — карта, с которой ты занимаешь деньги у банка и потом возвращаешь их. По-русски это «кредитная карта».'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: дебетовая карта
    note: '*debit card* — карта, с которой деньги сразу списываются с твоего счёта. Обычная банковская карта с твоими деньгами — это и есть *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: итого, общая сумма
    note: '*total* — вся сумма, которую нужно заплатить.'
    example_gloss: Какова общая сумма?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: Вы принимаете кредитные карты?
    note: '*Do you take credit cards?* — обычный вопрос перед оплатой. Здесь *take* значит «принимать».'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Извините, только наличные.
    note: '*Sorry, cash only.* — обычный ответ магазинов, которые не принимают карты.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Да, я заплачу картой.
    note: '*Yes, I''ll pay by card.* — окончательный выбор способа оплаты. После *by* слово *card* стоит без артикля.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: налог
    note: '*tax* — налог. В большинстве магазинов США он добавляется к цене только на кассе, а не уже включён в ценник, как у нас.'
    example_gloss: Налог — один доллар.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: Кассовый чек
    gloss: 'Кофе: 3 доллара. Сэндвич: 6 долларов. Налог: 1 доллар. Итого: 10 долларов.'
    note: Это настоящий кассовый чек.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: Общая сумма — 10 долларов.
    note: Это предложение подводит итог по чеку одной полной фразой.
  en.a1.unit15.lesson04.teach.q_total:
    title: Спрашиваем об общей сумме
    gloss: Лейла спрашивает, какова общая сумма
    note: '*How much is the total?* — обычный вопрос об итоговой сумме. Глагол *is* стоит в единственном числе, потому что *the total* — это одна сумма.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: Ответ об общей сумме
    gloss: 'Кассир говорит: с вас пятнадцать долларов.'
    note: '*It''s fifteen dollars.* — полный ответ на вопрос об итоговой сумме.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: Спрашиваем об оплате картой
    gloss: Лейла спрашивает, принимают ли кредитные карты
    note: Тот же вопрос, что и раньше.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: Ответ об оплате картой
    gloss: 'Кассир говорит: да, принимаем.'
    note: '*Yes, we do.* — полный краткий ответ. В английском вместо одного «да» повторяют вспомогательный глагол *do*.'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: Окончательный выбор оплаты
    gloss: 'Лейла говорит: отлично, я заплачу картой.'
    note: Это предложение завершает разговор окончательным выбором способа оплаты.
