    example_gloss: Это мой двоюродный брат / моя двоюродная сестра.
  en.a1.unit06.lesson02.teach.my_mother:
    title: my mother
    gloss: моя мама
    note: '*my* соответствует «мой / моя / моё / мои» — здесь «моя», потому что «мама» женского рода.'
  en.a1.unit06.lesson02.teach.your_father:
    title: your father
    gloss: твой отец / ваш отец
    note: Русское «твой» или «ваш» зависит от собеседника («ты» или «вы»), а окончание — от рода и числа существительного (твой отец, твоя мать). Английское *your* никогда не меняется.
  en.a1.unit06.lesson02.teach.his_sister:
    title: his sister
    gloss: его сестра
    note: '*his* соответствует «его», которое не меняется. Принадлежность определяется владельцем — мужчиной, а не родом слова «сестра».'
  en.a1.unit06.lesson02.teach.her_brother:
    title: her brother
    gloss: её брат
    note: '*her* соответствует «её», которое тоже не меняется; оно относится к владелице-женщине.'
