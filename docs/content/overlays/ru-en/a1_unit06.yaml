    title: I have two brothers.
    gloss: У меня два брата.
    note: '*brothers* — форма множественного числа от *brother*.'
  en.a1.unit06.lesson03.teach.do_you_have_siblings:
    title: Do you have any siblings?
    gloss: У тебя есть братья или сёстры?
    note: '*Do you have any siblings?* — общий вопрос о братьях и сёстрах.'
  en.a1.unit06.lesson03.teach.no_i_dont:
    title: No, I don't. I'm an only child.
    gloss: Нет. Я единственный ребёнок.
    note: '*an only child* означает «единственный ребёнок в семье».'
  en.a1.unit06.lesson04.teach.photo:
