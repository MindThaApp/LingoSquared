    example_gloss: У меня есть фото.
  en.a1.unit06.lesson04.teach.q_family:
    title: Лейла спрашивает о семье
    gloss: 'Лейла: Это ваша семья?'
    note: '*Is this your family?* — вопрос о том, изображена ли на фото семья собеседника.'
  en.a1.unit06.lesson04.teach.a_parents:
    title: Ответ о родителях
    gloss: 'Дэниел: Да. Это моя мама, а это мой папа.'
    note: Полный ответ называет обоих родителей по отдельности.
  en.a1.unit06.lesson04.teach.q_who:
    title: Спросить о человеке
    gloss: 'Лейла: Кто это?'
    note: '*Who is this?* спрашивает, кто изображён.'
  en.a1.unit06.lesson04.teach.a_sister_teacher:
    title: Ответ о сестре
    gloss: 'Дэниел: Это моя сестра. Она учительница.'
    note: '*She''s a teacher.* называет профессию.'
  en.a1.unit06.lesson04.teach.q_brothers:
    title: Спросить о братьях
    gloss: 'Лейла: У вас есть братья?'
    note: '*Do you have any brothers?* спрашивает именно о братьях, а не о братьях и сёстрах вообще.'
  en.a1.unit06.lesson04.teach.a_no_one_sister:
    title: Ответ о братьях и сёстрах
    gloss: 'Дэниел: Нет. У меня только одна сестра.'
    note: '*I just have one sister.* уточняет предыдущий ответ.'
