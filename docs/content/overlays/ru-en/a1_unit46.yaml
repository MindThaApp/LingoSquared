course:
  title: Английский A1
  description: 'Английский уровня A1: приветствия и короткие разговоры в повседневных ситуациях, с подробными объяснениями на русском языке.'
units:
  en.a1.unit46.lost_items:
    title: Как сообщить о потерянной вещи
lessons:
  en.a1.unit46.lesson01.lost_items_vocabulary:
    title: Слова для потерянных вещей
  en.a1.unit46.lesson02.reporting_a_lost_item:
    title: Как сообщить о потерянной вещи
  en.a1.unit46.lesson03.dialogue_missing_backpack:
    title: 'Разговор: пропавший рюкзак'
  en.a1.unit46.lesson04.lost_and_found_notice:
    title: 'Чтение: бюро находок'
teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: потерянный; потерял
    note: '*lost* значит «потерянный» или «потерял(а)». Как в русском, для «я потерял кошелёк» в английском нужно прошедшее время: I lost my wallet.'
    example_gloss: Я потерял кошелёк.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: найденный; нашёл
    note: '*found* — форма прошедшего времени и причастие глагола *find*: I found your keys значит «я нашёл твои ключи».'
    example_gloss: Я нашёл твои ключи!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: ключи
    note: '*keys* значит «ключи».'
    example_gloss: Это мои ключи.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: кошелёк
    note: '*wallet* значит «кошелёк».'
    example_gloss: Это твой кошелёк?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: рюкзак
    note: '*backpack* значит «рюкзак».'
    example_gloss: Мой рюкзак чёрный.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: Я потерял кошелёк.
    note: 'В русском тоже говорят «я потерял кошелёк»: английское *lost* — это просто прошедшее время глагола *lose*.'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: Ты не видел мои ключи?
    note: '*Have you seen ...?* значит «ты не видел ...?». В английском такой вопрос про недавний опыт строится с *have* и третьей формой глагола, а в русском достаточно прошедшего времени.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: Кто-нибудь нашёл рюкзак?
    note: '*Has anyone found ...?* значит «кто-нибудь нашёл ...?».'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: Он чёрный с красной лямкой.
    note: '*It''s black with a red strap.* значит «он чёрный с красной лямкой».'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: Где бюро находок?
    note: '*the lost and found* — устойчивое английское название бюро находок, дословно «потерянное и найденное».'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: Да, мы его нашли!
    note: '*Yes, we found it!* значит «да, мы его нашли!».'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: Миа, где твой рюкзак? Он же был у тебя у фонтана.'
    note: '*had* — форма прошедшего времени глагола *have*; здесь оно значит «был у тебя».'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: Испуг Мии
    gloss: 'Миа говорит: О нет, ты прав! У меня его нет. Там внутри моя камера!'
    note: '*My camera is inside!* значит «там внутри моя камера!».'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: Предложение Даниэля
    gloss: 'Даниэль говорит: Не волнуйся, давай позвоним в офис парка и спросим.'
    note: '*Don''t worry* значит «не волнуйся».'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Звонок Даниэля
    gloss: 'Даниэль говорит: Здравствуйте, мы потеряли чёрный рюкзак возле фонтана. Кто-нибудь его нашёл?'
    note: '*we lost a black backpack* значит «мы потеряли чёрный рюкзак»: в английском здесь простое прошедшее время *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: Вопрос Мии
    gloss: 'Миа говорит: Что они сказали?'
    note: В *did they say* глагол *did* — вспомогательный, он показывает прошедшее время в вопросе.
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: Хорошая новость от Даниэля
    gloss: 'Даниэль говорит: Они его нашли! Он чёрный с жёлтой лямкой, верно? Его держат на стойке регистрации.'
    note: '*right?* в конце фразы — короткий уточняющий вопрос, как русское «верно?» или «да?».'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Облегчение Мии
    gloss: 'Миа говорит: Да, это он! Пойдём заберём его прямо сейчас. Слава богу.'
    note: '*Let''s go get it* значит «пойдём заберём его»: два глагола подряд, без *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Текст о бюро находок
    gloss: 'Бюро находок: если вы потеряли вещь в парке, сначала подумайте, где вы видели её в последний раз. Затем идите в офис парка у главных ворот и опишите вещь: назовите цвет и особые приметы. Оставьте своё имя и номер телефона, чтобы сотрудники могли позвонить вам, если найдут её позже. После того как Миа потеряла рюкзак возле фонтана, она и Даниэль сразу позвонили в офис парка. Сотрудники уже нашли его и хранили на стойке регистрации. Миа очень обрадовалась, что получила камеру обратно в целости. Позже она рассказала Лейле всю историю, и Лейла сказала, что в следующий раз поможет Мии лучше следить за своими вещами.'
    note: '*keep better track of your things* значит «лучше следить за своими вещами».'
