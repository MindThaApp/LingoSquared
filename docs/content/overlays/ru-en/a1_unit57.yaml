    example_gloss: Мне нужно купить билет.
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: время начала сеанса
    note: '*showtime* означает «время начала сеанса» — момент, когда фильм начинается.'
    example_gloss: Во сколько начинается сеанс?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: место, кресло
    note: '*seat* означает «место» или «кресло».'
    example_gloss: Это место свободно?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: экран
    note: '*screen* означает «экран».'
    example_gloss: Экран очень большой.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: попкорн
    note: '*popcorn* означает «попкорн».'
    example_gloss: Мы всегда покупаем попкорн в кинотеатре.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: Во сколько начинается фильм?
    note: В *does the film start* вспомогательный глагол *does* нужен для вопроса, потому что основной глагол — *start*.
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Два билета на сеанс в семь часов, пожалуйста.
    note: '*for the seven o''clock show* привязывает билеты к конкретному сеансу.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: Можно мне немного попкорна, пожалуйста?
    note: '*Can I have...?* — прямой и очень распространённый способ что-то заказать.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: Сколько всего с меня?
    note: '*in total* означает «в итоге, всего»; так спрашивают об итоговой цене.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: С вас двадцать долларов, пожалуйста.
    note: '*That''s* + сумма — устойчивый способ назвать цену.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: Мне очень понравилось!
    note: 'В английском здесь подлежащее — тот, кто смотрел: *I liked it*, с глаголом *like* и дополнением *it*. В русском говорят «мне понравилось», и порядок мысли другой. Учи фразу целиком, а не по словам.'
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Даниэль спрашивает о времени сеанса
    gloss: 'Даниэль говорит: Привет! Во сколько начинается фильм?'
    note: В *does the film start* вспомогательный глагол *does* нужен для вопроса.
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: Время сеанса
    gloss: 'Кассир говорит: Следующий сеанс в семь часов.'
    note: '*at seven o''clock* — перед точным временем нужен предлог *at*; в русском в этом месте стоит «в» (в семь часов).'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Даниэль заказывает билеты
    gloss: 'Даниэль говорит: Отлично. Можно нам два билета, пожалуйста?'
    note: 'Один отдельный факт: количество билетов (два).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: Цена билетов
    gloss: 'Кассир говорит: Конечно. С вас шестнадцать долларов.'
    note: 'Один отдельный факт: цена обоих билетов вместе.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Лейла заказывает попкорн
    gloss: 'Лейла говорит: Можно нам немного попкорна, пожалуйста?'
    note: Это просьба, а не новый факт о цене.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: Цена попкорна
    gloss: 'Кассир говорит: Конечно. Попкорн стоит четыре доллара.'
    note: 'Второй отдельный факт: цена попкорна, отдельно от билетов.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Даниэль спрашивает об итоговой сумме
    gloss: 'Даниэль говорит: Сколько всего с меня?'
    note: '*in total* спрашивает о сумме всех цен.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: Итоговая сумма
    gloss: 'Кассир говорит: С вас двадцать долларов, пожалуйста.'
    note: 'Третий отдельный факт: общая сумма, а не отдельные цены билетов и попкорна.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Лейла не может дождаться
    gloss: 'Лейла говорит: Спасибо! Не могу дождаться, когда посмотрю его.'
    note: '*I can''t wait to...* — устойчивое выражение, показывающее нетерпение и радость.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Расписание кинотеатра
    gloss: 'Расписание кинотеатра: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: В расписании три фильма с временем начала и ценой.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Текст: вечер в кино'
    gloss: Однажды вечером Даниэль и Лейла решили сходить в кино. Они спросили, во сколько начинается фильм, и кассир сказал, что следующий сеанс, Star Journey, в семь часов. Они купили два билета за шестнадцать долларов и пакет попкорна за четыре доллара. Всего вышло двадцать долларов. Они посмотрели фильм вместе, он был про исследователей космоса. Было очень смешно. Когда фильм закончился, Лейла сказала, что ей очень понравилось, а Даниэль сказал, что хочет посмотреть и следующий.
    note: '*watched* — прошедшее время от *watch* («смотреть»).'
