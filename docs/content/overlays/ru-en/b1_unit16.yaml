teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: совет
    note: '*advice* значит мнение о том, что человеку стоит сделать.'
    example_gloss: Лейла дала Дэниелу полезный совет.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: предлагать
    note: '*suggest* значит предложить идею на рассмотрение.'
    example_gloss: Лейла предложила способ справиться с его нагрузкой.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: перегруженный, подавленный
    note: '*overwhelmed* значит чувство, что нужно сделать больше, чем вы можете.'
    example_gloss: Дэниел чувствовал себя перегруженным двумя проектами.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: расставлять приоритеты
    note: '*prioritize* значит сначала сделать самую важную задачу.'
    example_gloss: Дэниел решил поставить в приоритет проект с ближайшим сроком.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: рабочая нагрузка
    note: '*workload* значит весь объём работы, который нужно выполнить человеку.'
    example_gloss: Нагрузка Дэниела выросла после того, как он пришёл в команду в марте.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: отклонить
    note: '*decline* значит вежливо отказаться от предложения.'
    example_gloss: Дэниел мог принять совет или вежливо отказаться.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + инфинитив
    gloss: На твоём месте я бы поговорил с твоим руководителем.
    note: '*if I were you, I would* — форма нереального условия для совета.'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + инфинитив
    gloss: Тебе стоит поставить в приоритет проект с ближайшим сроком.
    note: '*you should* — прямая рекомендация.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: Как насчёт того, чтобы попросить коллегу помочь?
    note: '*how about + -ing* — более мягкий способ что-то предложить.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Формы для совета
    gloss: 'Совет и предложения выражаются разными формами: If I were you, I would... (нереальная гипотеза), You should... (прямая рекомендация) и How about + -ing...? (более мягкое предложение). Выбирайте более сильную или более мягкую форму в зависимости от того, насколько уверенно вы хотите звучать.'
    note: 'Форма: выбирайте между нереальной гипотезой, прямой рекомендацией или мягким предложением.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: крайний срок
    note: '*deadline* значит дату, к которой что-то должно быть закончено.'
    example_gloss: Ближайший срок Дэниела — следующая пятница.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: Это понятно. Я попробую.
    note: '*that makes sense* показывает, что вы понимаете совет и принимаете его.'
    example_gloss: Это понятно. Я попробую на этой неделе.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Текст: совет при слишком большой нагрузке'
    gloss: Привет, Лейла, на этой неделе я чувствую себя перегруженным. Я руковожу двумя проектами, и к тому же у меня вечерний курс. Есть совет? Привет, Дэниел, на твоём месте я бы поговорила с твоим руководителем о нагрузке. Тебе также стоит поставить в приоритет проект с ближайшим сроком. Как насчёт того, чтобы попросить Мию помочь с другим? Спасибо, это понятно. Я попробую и дам тебе знать, как получится.
    note: Короткий дружеский совет между коллегами.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Даниэль объясняет свою проблему
    gloss: 'Дэниел говорит: Я немного перегружен. Я руковожу двумя проектами, и у меня ещё вечерний курс три раза в неделю.'
    note: '*a little overwhelmed* описывает ситуацию, когда работы немного слишком много.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Лейла даёт первый совет
    gloss: 'Лейла говорит: На твоём месте я бы поговорила с руководителем о нагрузке.'
    note: '*if I were you, I would* — нереальная гипотетическая форма.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Даниэль колеблется
    gloss: 'Дэниел говорит: Хорошая идея, но я не хочу выглядеть так, будто не справляюсь.'
    note: '*I don''t want to seem like* выражает беспокойство о том, как человек выглядит.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Лейла делает два конкретных предложения
    gloss: 'Лейла говорит: Тебе стоит сначала поставить в приоритет проект с ближайшим сроком. Как насчёт того, чтобы попросить коллегу помочь с другим?'
    note: '*you should* и *how about* сочетают прямое и мягкое предложение.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Даниэль принимает совет
    gloss: 'Дэниел говорит: Мне нравится. Я спрошу Мию, есть ли у неё время на этой неделе.'
    note: '*I like that* показывает, что вы принимаете совет.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Лейла подтверждает план
    gloss: 'Лейла говорит: Это похоже на надёжный план.'
    note: Короткое, ободряющее завершение разговора.
