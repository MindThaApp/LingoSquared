  en.a1.unit18.lesson02.teach.what_did_you_do:
    title: What did you do yesterday?
    gloss: Что ты делал вчера?
    note: С помощью *What did you do...?* спрашивают о событии в прошлом.
  en.a1.unit18.lesson02.teach.i_worked:
    title: I worked in the morning.
    gloss: Утром я работал.
    note: Этот ответ называет и занятие, и время.
  en.a1.unit18.lesson02.teach.last_week:
    title: I saw a movie last week.
    gloss: На прошлой неделе я смотрел фильм.
    note: '*last week* значит «на прошлой неделе».'
  en.a1.unit18.lesson03.teach.together:
    title: together
    gloss: вместе
    note: '*together* значит «вместе».'
    example_gloss: Мы вместе смотрели фильм.
  en.a1.unit18.lesson03.teach.event_text:
    title: Текст о событии
    gloss: Вчера я навестил родителей. Мы вместе поужинали и посмотрели фильм.
    note: Это короткое описание недавнего события.
  en.a1.unit18.lesson03.teach.the_writers_parents:
    title: the writer's parents
    gloss: родители автора
    note: '*writer''s* значит «автора»: окончание *''s* показывает принадлежность.'
  en.a1.unit18.lesson04.teach.it_was_great:
    title: It was great.
    gloss: Это было здорово.
    note: '*It was great* значит, что впечатления были очень хорошими.'
  en.a1.unit18.lesson04.teach.q_last_weekend:
    title: Спрашиваем о прошлых выходных
    gloss: Лейла спрашивает, что Даниэль делал в прошлые выходные.
    note: '*last weekend* значит «в прошлые выходные».'
  en.a1.unit18.lesson04.teach.a_visited_parents:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: я навестил родителей.'
    note: В ответе называется простое событие в прошлом.
  en.a1.unit18.lesson04.teach.q_good_time:
    title: Спрашиваем, хорошо ли прошло время
    gloss: 'Лейла спрашивает: тебе было весело?'
    note: С помощью *Did you have a good time?* спрашивают, хорошо ли человек провёл время.
  en.a1.unit18.lesson04.teach.a_yes_great:
    title: Полный ответ Даниэля
    gloss: 'Даниэль говорит: да, мы вместе поужинали и посмотрели фильм. Это было здорово.'
    note: Даниэль говорит, что они делали вместе, а затем — что он обо всём этом думает.
  en.a1.unit18.lesson04.teach.his_parents:
    title: his parents
    gloss: его родители
    note: '*his* — притяжательное местоимение к *he*: «его», как в «его родители».'
