course:
  title: Английский A1
  description: 'Английский уровня A1: приветствия и короткие разговоры в повседневных ситуациях, с подробными объяснениями на русском языке.'
units:
  en.a1.unit63.asking_for_help:
    title: Просим о помощи
lessons:
  en.a1.unit63.lesson01.help_words:
    title: Слова о помощи
  en.a1.unit63.lesson02.help_phrases:
    title: Фразы, чтобы попросить о помощи
  en.a1.unit63.lesson03.dialogue_helping_with_a_bag:
    title: 'Разговор: помогаем нести сумку'
  en.a1.unit63.lesson04.a_helpful_neighbor:
    title: 'Читаем: отзывчивый сосед'
teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: помогать / помощь
    note: '*help* может быть глаголом «помогать» или существительным «помощь». Как и по-русски, это переходный глагол, но по-английски после него просто местоимение без предлога: *help me* («помоги мне»), без *to*.'
    example_gloss: Ты можешь мне помочь?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: нести
    note: '*carry* значит держать что-то и переносить с места на место.'
    example_gloss: Я могу это нести.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: тяжёлый
    note: '*heavy* значит «тяжёлый» (по весу).'
    example_gloss: Это тяжело.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: сумка
    note: '*bag* значит «сумка», также «пакет, мешок».'
    example_gloss: Эта сумка тяжёлая.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: дверь
    note: '*door* значит «дверь».'
    example_gloss: Открой дверь.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: полка
    note: '*shelf* значит «полка», например на стене или в шкафу. Множественное число — *shelves*.'
    example_gloss: Положи это на полку.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: Ты можешь мне помочь?
    note: '*Can you...?* — прямой, обычный способ попросить о помощи.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Эта сумка тяжёлая.
    note: '*this bag* используют для сумки, которая находится рядом с тобой.'
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: Не мог бы ты открыть дверь?
    note: '*Could you...?* звучит вежливее, чем *Can you...?*. По-русски это похоже на «не мог бы ты ...?».'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Я могу помочь.
    note: Это предложение предлагает помощь.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Спасибо за твою помощь.
    note: '*Thank you for...* использует *for* для причины благодарности, как русское «спасибо за».'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Положи это на полку.
    note: '*put it on...* значит «положить или поставить что-то на что-то». В английском здесь нет различия между «положить» и «поставить»: и то и другое — *put*.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Лейла просит о помощи
    gloss: 'Лейла говорит: Привет, Дэниел. Ты можешь мне помочь?'
    note: '*Can you help me?* — основная фраза, чтобы попросить о помощи.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Дэниел спрашивает, что нужно
    gloss: 'Дэниел говорит: Конечно. Что тебе нужно?'
    note: '*Of course* значит «конечно».'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: Сумка тяжёлая
    gloss: 'Лейла говорит: Эта сумка тяжёлая.'
    note: '*heavy* объясняет, почему нужна помощь.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Дэниел может нести сумку
    gloss: 'Дэниел говорит: Я могу её донести.'
    note: '*carry it* относится к сумке. В английском о вещах говорят *it*; сумка здесь не «она», как по-русски.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Лейла просит открыть дверь
    gloss: 'Лейла говорит: Не мог бы ты ещё открыть дверь?'
    note: '*Could you...?* делает просьбу вежливой.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Дэниел спрашивает про полку
    gloss: 'Дэниел говорит: Да. Мне поставить сумку на полку?'
    note: Фразой *Can I ...?* Дэниел предлагает поставить сумку на полку.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Лейла благодарит Дэниела
    gloss: 'Лейла говорит: Да, пожалуйста. Спасибо за помощь.'
    note: '*Thank you for your help* — устойчивая фраза благодарности.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Дэниел отвечает
    gloss: 'Дэниел говорит: Не за что.'
    note: '*No problem* — короткий дружелюбный ответ.'
  en.a1.unit63.lesson04.teach.help_note:
    title: Hilfszettel
    gloss: 'Записка о помощи: Синяя сумка тяжёлая. Пожалуйста, положите её на полку возле двери.'
    note: В записке сказано, о какой сумке речь и куда её положить.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'Текст: отзывчивый сосед'
    gloss: 'Отзывчивый сосед: У Лейлы была тяжёлая синяя сумка. Она увидела Дэниела у двери и попросила о помощи. Дэниел внёс сумку внутрь. Лейла также попросила его открыть дверь. Потом Дэниел положил сумку на полку возле двери. Лейла поблагодарила Дэниела за помощь. Дэниел сказал: Не за что. Позже Лейла написала короткую записку: Синяя сумка лежит на полке.'
    note: '*carried* — прошедшее время от *carry*.'
