teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: сказал, что
    note: '*said that* используют, чтобы передать то, что сказал кто-то другой.'
    example_gloss: Она сказала, что у неё много дел.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: сказал мне, что
    note: '*told me that* используют, когда кто-то передал информацию именно вам.'
    example_gloss: Он сказал мне, что встречу отменили.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: спросил, ли
    note: '*asked whether* передаёт общий вопрос и звучит немного официальнее, чем *asked if*.'
    example_gloss: Миа спросила, нужна ли нам помощь.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: спросил, ли
    note: '*asked if* передаёт общий вопрос в повседневной речи.'
    example_gloss: Миа спросила, нужна ли нам помощь.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: сообщение
    note: '*message* значит короткое письменное или голосовое сообщение.'
    example_gloss: Лейла отправила сообщение после обеда.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: подтвердить
    note: '*confirm* значит сказать, что что-то точно или правильно.'
    example_gloss: Пожалуйста, подтверди время, прежде чем выходить.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: свободен, есть время
    note: '*available* значит свободный или способный встретиться.'
    example_gloss: У Мии есть время после обеда.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Передать чьи-то слова
    gloss: Миа сказала, что она свободна после обеда.
    note: 'В косвенной речи в английском *is* часто сдвигается в *was*: *Mia said that she was available*. В русском время обычно не сдвигается: «Миа сказала, что она свободна».'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Передать вам информацию
    gloss: Лейла сказала мне, что в офисе было много народу.
    note: '*told me that* используют, когда информацию передали прямо вам.'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Прямая и косвенная речь
    gloss: 'Миа говорит: «Я свободна». Миа сказала, что она была свободна.'
    note: 'Прямая речь: *I am available*. Косвенная: *Mia said that she was available*. В косвенной речи исходное высказывание часто сдвигается на одну временную ступень назад.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: краткое резюме
    note: '*short summary* значит краткую версию только с самыми важными пунктами.'
    example_gloss: Краткого резюме достаточно для сегодняшней встречи.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: полный отчёт
    note: '*full report* значит весь отчёт, а не только краткую версию.'
    example_gloss: Миа спросила, нужен ли нам полный отчёт.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Текст: переписка'
    gloss: Лейла прочитала сообщение Мии и позвонила Дэниелу. Она сказала, что Миа свободна после обеда. Она также сказала, что Миа закончила цифры. Миа спросила, нужен ли команде сегодня полный отчёт. Дэниел сказал Лейле, что краткого резюме достаточно, потому что встреча длится всего пятнадцать минут.
    note: Короткий текст о том, как передавать чужие высказывания и вопросы.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Даниэль спрашивает об ответе Мии
    gloss: 'Дэниел говорит: Миа ответила насчёт проверки?'
    note: Общий вопрос о предыдущем сообщении.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Лейла передаёт слова Мии
    gloss: 'Лейла говорит: Да, она сказала, что свободна после обеда.'
    note: '*she said that she was available* передаёт слова Мии.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Даниэль продолжает расспрашивать
    gloss: 'Дэниел говорит: Отлично. Она спрашивала что-нибудь ещё?'
    note: Уточняющий вопрос, чтобы узнать, был ли в сообщении ещё один вопрос.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Лейла передаёт вопрос Мии
    gloss: 'Лейла говорит: Она спросила, нужен ли нам сегодня полный отчёт.'
    note: '*asked if* превращает прямой общий вопрос в косвенную речь.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Даниэль спрашивает об ответе Лейлы
    gloss: 'Дэниел говорит: Что ты ей ответила?'
    note: Вопрос об информации, которую передала Лейла.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Лейла передаёт свой ответ
    gloss: 'Лейла говорит: Я сказала ей, что краткого резюме достаточно.'
    note: '*I told her that...* передаёт информацию, которую вы сообщили кому-то другому.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Даниэль завершает переписку
    gloss: 'Дэниел говорит: Отлично. Я скажу команде, что мы можем собраться в два.'
    note: Дэниел снова использует *tell ... that*, чтобы передать информацию.
