teaching:
  en.a1.unit64.lesson01.teach.nice:
    title: nice
    gloss: приятный, хороший, милый
    note: '*nice* может означать «приятный», «хороший» или «милый» — в зависимости от ситуации.'
    example_gloss: Это приятно.
  en.a1.unit64.lesson01.teach.great:
    title: great
    gloss: отличный, замечательный
    note: '*great* сильнее, чем *nice*, и означает «замечательный».'
    example_gloss: Ты выглядишь замечательно.
  en.a1.unit64.lesson01.teach.lovely:
    title: lovely
    gloss: прелестный, очаровательный
    note: '*lovely* звучит тепло и дружелюбно.'
    example_gloss: Какая прелестная улыбка.
  en.a1.unit64.lesson01.teach.kind:
    title: kind
    gloss: добрый, любезный
    note: '*kind* означает «дружелюбный и добрый к людям».'
    example_gloss: Это очень любезно.
  en.a1.unit64.lesson01.teach.smile:
    title: smile
    gloss: улыбка
    note: '*smile* означает «улыбка».'
    example_gloss: Какая прелестная улыбка.
  en.a1.unit64.lesson01.teach.jacket:
    title: jacket
    gloss: куртка, жакет
    note: '*jacket* означает «куртка» или «жакет».'
    example_gloss: Мне нравится твоя куртка.
  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: Это приятно.
    note: '*That is nice* — короткая положительная реакция.'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: Ты выглядишь замечательно.
    note: '*look* здесь означает «выглядеть», а не «смотреть».'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: Мне нравится твоя куртка.
    note: '*I like your...* — обычный способ сделать комплимент по поводу чьей-то вещи.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Какая прелестная улыбка.
    note: '*What a...* используют, чтобы сказать комплимент как восклицание.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: Это очень любезно.
    note: '*very* усиливает слово *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Большое спасибо.
    note: '*Thank you very much* — вежливая и тёплая фраза благодарности.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Миа делает комплимент"
    gloss: 'Мия говорит: Привет, Лейла. Ты сегодня замечательно выглядишь.'
    note: '*You look great* — прямой комплимент.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Лейла благодарит Мию
    gloss: 'Лейла говорит: Спасибо, Мия.'
    note: '*Thank you* означает «спасибо».'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Мия говорит про зелёную куртку
    gloss: 'Мия говорит: Мне нравится твоя зелёная куртка.'
    note: '*I like your green jacket* — комплимент одежде.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Лейла отвечает любезно
    gloss: 'Лейла говорит: Это очень любезно.'
    note: '*That is very kind* — ответ на что-то приятное, что сказал человек.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Мия говорит про улыбку
    gloss: 'Мия говорит: И какая у тебя прелестная улыбка! Смотри, это моя фотография.'
    note: '*too* здесь означает «тоже».'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Лейла хвалит фотографию
    gloss: 'Лейла говорит: Большое спасибо. Твоя фотография очень хорошая.'
    note: '*Your photo is nice* — ответный комплимент.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Мия объясняет про фотографию
    gloss: 'Мия говорит: Спасибо. Она для Даниэля.'
    note: '*Thanks* короче, чем *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Доброе сообщение
    gloss: 'Доброе сообщение: Твоя зелёная куртка прелестна. Твоя фотография очень хорошая. Спасибо, что ты такая добрая.'
    note: В сообщении два комплимента и благодарность.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Текст: комплимент подруге'
    gloss: 'Комплимент подруге: Мия увидела Лейлу в зелёной куртке. Мия сказала, что Лейла выглядит замечательно. Ещё она сказала, что у Лейлы прелестная улыбка. Лейла поблагодарила Мию. Потом Лейла посмотрела на фотографию Мии и сказала, что она хорошая. Мия обрадовалась, потому что фотография была для Даниэля. Позже Лейла написала короткое сообщение: Твоя зелёная куртка прелестна.'
    note: '*looked great* — прошедшее время от *look great*.'
