teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: до того как; перед
    note: '*before* значит раньше другого события.'
    example_gloss: Мой руки, прежде чем готовить.
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: после того как; после
    note: '*after* значит позже другого события.'
    example_gloss: Позвони мне после того, как закончишь работу.
  en.b1.unit08.lesson01.teach.as_soon_as:
    title: as soon as
    gloss: как только
    note: '*as soon as* значит сразу, как только что-то происходит.'
    example_gloss: Как только я приеду, я тебе напишу.
  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: к тому времени, как
    note: '*by the time* значит не позже того момента, когда что-то происходит.'
    example_gloss: К тому времени, как приедет Миа, ужин будет готов.
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: отметиться, что добрался или в безопасности
    note: '*check in* значит коротко сообщить кому-то, что вы на месте или в безопасности.'
    example_gloss: Отметься, пожалуйста, когда доберёшься до гостиницы.
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: запереть
    note: '*lock up* значит закрыть и запереть помещение или здание.'
    example_gloss: Я запираю офис, прежде чем уйти.
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: Etwas sofort danach tun
    gloss: Как только я окажусь дома, я тебе позвоню.
    note: '*as soon as* показывает, что второе действие происходит сразу после первого.'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: Zuerst etwas tun
    gloss: Прежде чем подняться наверх, пожалуйста, проверь почту.
    note: '*before* показывает, какое действие должно произойти первым.'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: Präsens in Zeitsätzen
    gloss: Когда я приду домой, я тебе позвоню. Пожалуйста, проверь почту, прежде чем подняться наверх.
    note: 'В английских придаточных времени для будущего события стоит настоящее время: *when I get home*, а не *when I will get home*. В русском здесь, наоборот, будущее время: «когда я приду домой».'
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: входная дверь
    note: '*front door* значит главную дверь в передней части дома или здания.'
    example_gloss: Дэниел запирает входную дверь после того, как проверил почту.
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: готов
    note: '*ready* значит подготовленный или готовый к использованию.'
    example_gloss: К тому времени, как приедет Миа, ужин будет готов.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Lesetext: der Abendplan'
    gloss: У Дэниела тщательный вечерний распорядок. Когда он приходит домой, он сначала проверяет почту. После того как он проверит почту, он запирает входную дверь. Прежде чем приступить к ужину, он моет руки и убирает со стола. К тому времени, как приедет Миа, кухня готова, а еда тёплая.
    note: Короткий текст с *when*, *after*, *before* и *by the time*.
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila bittet um einen Anruf
    gloss: 'Лейла говорит: Дэниел, ты можешь позвонить мне, когда придёшь домой?'
    note: Вопрос с *when*, который называет время действия.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel verspricht, sofort anzurufen
    gloss: 'Дэниел говорит: Конечно. Как только я приду домой, я тебе позвоню.'
    note: '*as soon as* ясно показывает, что он позвонит сразу.'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila gibt eine erste Aufgabe
    gloss: 'Лейла говорит: Пожалуйста, проверь почту, прежде чем подняться наверх.'
    note: '*before* показывает, что сначала идёт почта.'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel nennt den nächsten Schritt
    gloss: 'Дэниел говорит: Хорошо. После того как я проверю почту, я запру входную дверь.'
    note: '*after* показывает порядок двух действий.'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila nennt den Zeitpunkt
    gloss: 'Лейла говорит: Отлично. К тому времени, как приедет Миа, всё должно быть готово.'
    note: '*by the time* значит, что всё должно быть готово к этому моменту или раньше.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel schließt den Plan ab
    gloss: 'Дэниел говорит: Тогда мы сможем приступить к ужину, когда она приедет.'
    note: '*when she arrives* называет момент, когда можно начинать.'
