course:
  title: Английский B2
  description: Английский на уровне B2 для тонких разговоров, аргументации, предположений и профессиональных дискуссий, с объяснениями на неформальном русском.
units:
  en.b2.unit04.narrative_time:
    title: By the time I arrived
lessons:
  en.b2.unit04.lesson01.timeline_roles:
    title: Фон, главное событие и то, что было раньше
  en.b2.unit04.lesson02.shifting_time:
    title: While I was checking, the power went out
  en.b2.unit04.lesson03.reading_an_incident_account:
    title: 'Чтение: проблема на площадке'
  en.b2.unit04.lesson04.the_narrative_dialogue:
    title: Walk me through what happened
teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: фон, предыстория
    note: '*background* — это то, что уже происходило или задаёт контекст. В английских рассказах фон часто выражают в past continuous.'
    example_gloss: Фоновая информация рассказывает о том, что уже происходило.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: главное событие
    note: '*foreground* — это событие, к которому движется рассказ. В английском его часто выражают в simple past, а не автоматически в present perfect.'
    example_gloss: Главное событие — самое важное событие в рассказе.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: предшествующий, более ранний
    note: '*prior* значит более ранний, чем другой момент в прошлом. Обычно это past perfect: *had moved*.'
    example_gloss: Предшествующее событие произошло раньше другого события в прошлом.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: прерывать
    note: '*interrupt* употребляется, когда короткое событие врывается в то, что уже шло.'
    example_gloss: Внезапная проблема может прервать действие.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: продолжающийся, длящийся
    note: '*ongoing* хорошо соответствует русскому несовершенному виду («проверял», «расставляли»). В английском такое длящееся действие в прошлом обычно выражается формой *was/were + -ing*.'
    example_gloss: Длящееся действие продолжается какое-то время.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: хронология, реальная последовательность
    note: '*chronology* — это реальная последовательность событий, даже если рассказ излагает их в другом порядке.'
    example_gloss: Хронология — это реальный порядок событий.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Что-то произошло ещё раньше
    gloss: К тому времени, как я приехал, координатор уже перенёс оборудование внутрь.
    note: '*had already moved* показывает, что это случилось до *I arrived*. В русском для этого нет особой формы, порядок событий понятен из контекста; в английском же нужно сказать *had moved*, а не *moved* и не *has moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Длящееся действие и прерывание
    gloss: Пока я проверял звуковую систему, отключилось электричество.
    note: '*was checking* соответствует русскому несовершенному виду «проверял». Само прерывание — simple past: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Приезд во время фонового действия
    gloss: Когда я приехал, волонтёры расставляли стулья.
    note: Используй *were setting up* для того, что шло, когда произошло главное событие.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: Временные слои в рассказе
    gloss: Используй past continuous для фонового действия, simple past для главных событий и past perfect для того, что случилось раньше.
    note: 'В русском есть только одно прошедшее время, и там не нужно выбирать форму для «более раннего» события, а в английском рассказе это обязательно: главное событие обычно в simple past, например *the power went out*, а не *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: площадка, место проведения
    note: '*venue* — это место, где проходит мероприятие.'
    example_gloss: Площадка — это место, где проходит мероприятие.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: задержанный, отложенный
    note: '*delayed* значит, что что-то начинается или происходит позже, чем планировалось.'
    example_gloss: Мероприятие началось на двадцать минут позже.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Текст для чтения: проблема на площадке'
    gloss: Саймон рассказал эту историю не в строго хронологическом порядке. До того как он приехал на площадку, координатор перенёс оборудование внутрь, потому что ожидался дождь. Когда Саймон приехал, волонтёры расставляли стулья. Пока он проверял звуковую систему, отключилось электричество. Он позвонил управляющей зданием, которая объяснила, что ремонтная бригада работала неподалёку ещё утром. Команда задержала начало на двадцать минут, но к тому времени, как вошли гости, свет уже снова включился.
    note: 'Обрати внимание на английские временные слои: *had moved* для более раннего, *were setting up* для фона и *went out* для главного события.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Харпер просит рассказать
    gloss: 'Харпер спрашивает: Можешь шаг за шагом рассказать, что произошло на площадке?'
    note: '*walk me through* значит провести кого-то шаг за шагом через событие.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Саймон соединяет временные слои
    gloss: 'Саймон говорит: Когда я приехал, волонтёры расставляли стулья, но координатор уже перенёс оборудование внутрь, потому что ожидался дождь.'
    note: Хороший рассказ сочетает фоновое действие с более ранним событием.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Харпер проверяет последовательность
    gloss: 'Харпер спрашивает: То есть оборудование было в безопасности ещё до твоего приезда?'
    note: 'Вопрос о последовательности: оборудование было в безопасности уже до приезда Саймона.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Саймон называет прерывание
    gloss: 'Саймон говорит: Именно. Потом, пока я проверял звуковую систему, отключилось электричество.'
    note: '*while I was checking* — длящееся действие; *the power went out* — прерывание.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Харпер спрашивает о следующем шаге
    gloss: 'Харпер спрашивает: Что ты сделал после этого?'
    note: '*What did you do...?* использует simple past с *did* для вопроса о завершённом шаге.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Саймон сообщает более раннюю предысторию
    gloss: 'Саймон говорит: Я позвонил управляющей зданием, и она сказала мне, что ремонтная бригада работала неподалёку ещё этим утром.'
    note: '*had been working* показывает, что эта работа шла ещё раньше этим утром.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Харпер спрашивает о мероприятии
    gloss: 'Харпер спрашивает: А мероприятие?'
    note: Короткий вопрос просит рассказать о последствиях для мероприятия.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Саймон завершает рассказ
    gloss: 'Саймон говорит: Мы задержали начало на двадцать минут, но к тому времени, как вошли гости, свет уже снова включился.'
    note: '*had come back on* произошло до момента, когда вошли гости.'
