teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: приём; запись на приём
    note: '*appointment* означает назначенное время приёма, например, в госучреждении.'
    example_gloss: У меня в пятницу приём в DMV (отделе регистрации автомобилей и водительских прав).
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: документ
    note: '*document* означает официальный документ или бумагу.'
    example_gloss: Принесите, пожалуйста, один документ, подтверждающий место жительства.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: подтверждение места жительства
    note: '*proof of residency* означает документ, который показывает, где вы живёте.'
    example_gloss: В качестве подтверждения места жительства подойдёт счёт за электричество.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: бланк; анкета
    note: '*form* означает бланк, который нужно заполнить.'
    example_gloss: Пожалуйста, заполните этот бланк до приёма.
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: номер подтверждения
    note: '*confirmation number* означает номер, который подтверждает вашу запись на приём.'
    example_gloss: Ваш номер подтверждения — 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: Я хотел узнать, могу ли я записаться на приём.
    note: '*I was wondering whether...* — вежливый, формальный способ что-то спросить.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: Можно ли прийти в эту пятницу?
    note: '*Would it be possible...?* — очень вежливая просьба.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: Мне нужно изменить адрес, потому что в прошлом месяце я переехал.
    note: С *because* начинается придаточное предложение, называющее причину.
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: удостоверение личности с фотографией
    note: '*photo ID* означает удостоверение личности с фотографией, например, паспорт или водительские права.'
    example_gloss: Вам понадобятся удостоверение личности с фотографией и документ, подтверждающий место жительства.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: счёт за коммунальные услуги
    note: '*utility bill* означает счёт за электричество, газ или воду.'
    example_gloss: Счёт за электричество — частый пример документа, подтверждающего место жительства.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Text des Hinweises
    gloss: Чтобы изменить адрес, принесите, пожалуйста, удостоверение личности с фотографией и один документ, подтверждающий место жительства, например, счёт за коммунальные услуги. Если у вас нет такого счёта, можно принести договор аренды.
    note: 'Формальное объявление: в нём сказано, что нужно принести и что можно принести вместо этого.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: Я принесу удостоверение личности с фотографией.
    note: С *will* говорят о том, что собираются сделать (будущее время).
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: Не могли бы вы сказать, что мне нужно принести?
    note: '*Could you tell me...?* — вежливый косвенный вопрос. После *what* порядок слов обычный: *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Fragen, wie lange
    gloss: 'Сотрудник спрашивает: Как давно вы живёте по новому адресу?'
    note: '*How long have you lived...?* спрашивает, как долго что-то продолжается. В английском для этого используют Present Perfect (*have lived*), а в русском — обычное настоящее время («как давно вы живёте»). Ответ может начинаться с *since*: *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniels Antwort
    gloss: 'Дэниел говорит: С прошлого месяца.'
    note: '*Since last month* означает «с прошлого месяца». Здесь достаточно короткого ответа.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Nach einem Termin fragen
    gloss: 'Дэниел спрашивает: Можно ли прийти в эту пятницу?'
    note: Тот же вопрос, что и на втором уроке.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Antwort des Sachbearbeiters
    gloss: 'Сотрудник говорит: Да, пятница, 10 утра подойдёт. Ваш номер подтверждения — 4471.'
    note: Сотрудник подтверждает время и называет номер подтверждения.
