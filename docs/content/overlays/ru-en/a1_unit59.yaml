    gloss: Банкомат на улице.
    note: '*outside* стоит в конце: *is outside*.'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: Мия спрашивает о банкомате
    gloss: 'Мия говорит: Привет! Где банкомат?'
    note: '*Where is...?* спрашивает о месте.'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: Где банкомат
    gloss: 'Сотрудник говорит: Банкомат на улице.'
    note: '*outside* означает «снаружи, на улице».'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: Лейла спрашивает о своей карте
    gloss: 'Лейла говорит: Можно воспользоваться этой картой?'
    note: '*this card* указывает на карту, которая у неё с собой.'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: Карта подходит
    gloss: 'Сотрудник говорит: Да, этой картой можно пользоваться.'
    note: '*Yes* означает «да»; *that card* указывает на карту Лейлы.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Мия хочет проверить остаток на счёте
    gloss: 'Мия говорит: Я хочу проверить остаток на счёте.'
    note: 'После *want* второй глагол идёт с частицей *to*: *want to check*.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: PIN-код
    gloss: 'Сотрудник говорит: Пожалуйста, введите свой PIN-код.'
    note: '*Please* делает просьбу вежливой.'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: Лейле тоже нужны наличные
    gloss: 'Лейла говорит: Мне тоже нужны наличные.'
    note: '*too* означает «тоже» и здесь стоит в конце.'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: Снятие двадцати долларов
    gloss: 'Сотрудник говорит: Вы можете снять двадцать долларов.'
    note: '*take out* здесь означает «снимать деньги».'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: Мия благодарит сотрудника
    gloss: 'Мия говорит: Спасибо! Это очень полезно.'
    note: '*helpful* означает «полезный, помогающий».'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: Объявление банка
    gloss: 'Объявление банка: открыто с 9:00 до 16:00. Банкомат на улице. Лимит снятия наличных сегодня: $100. Карты принимаются.'
    note: В объявлении указаны часы работы, место банкомата и лимит.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'Текст: короткий визит в банк'
    gloss: 'Короткий визит в банк: однажды утром Мия и Лейла вместе пошли в банк. Мия хотела проверить остаток на счёте, а Лейле были нужны наличные. Сотрудник сказал, что банкомат на улице. Лейла воспользовалась картой и сняла двадцать долларов. Мия ввела PIN-код и проверила остаток. Перед уходом они прочитали объявление. Банк был открыт с 9:00 до 16:00, а лимит на снятие наличных составлял $100. Мия сказала, что визит прошёл легко.'
    note: '*took out* — прошедшее время от *take out* в значении «снять деньги».'
