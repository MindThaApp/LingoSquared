  en.a1.unit59.lesson02.teach.can_i_use_this_card:
    title: Can I use this card?
    gloss: Можно воспользоваться этой картой?
    note: '*Can I use...?* спрашивает, возможно ли что-то или разрешено ли.'
  en.a1.unit59.lesson02.teach.enter_your_pin:
    title: Please enter your PIN.
    gloss: Пожалуйста, введите свой PIN-код.
    note: '*enter* здесь означает «вводить». *PIN* — сам PIN-код.'
  en.a1.unit59.lesson02.teach.atm_outside:
