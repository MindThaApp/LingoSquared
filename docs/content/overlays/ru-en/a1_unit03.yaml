    example_gloss: Номер моего дома — двенадцать.
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: тринадцать
    note: 'От 13 до 19 английский добавляет к основному числу *-teen*, как русский «-надцать». Но у *thirteen* меняется основа: *thir-*, а не *three*.'
