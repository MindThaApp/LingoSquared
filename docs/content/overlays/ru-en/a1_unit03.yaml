  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: пятнадцать
    note: '*fifteen*, а не *fiveteen* — небольшое исключение в английском.'
    example_gloss: Номер моего дома — пятнадцать.
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: двадцать
    note: '*twenty* — английское число 20.'
    example_gloss: Номер моего дома — двадцать.
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: двадцать один
    note: 'Как и в русском, сначала называют десятки, потом единицы: *twenty-one*, но через дефис.'
  en.a1.unit03.lesson02.teach.thirty:
    title: thirty
    gloss: тридцать
    note: '*thirty* — английское число 30.'
    example_gloss: Это стоит тридцать долларов.
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: сорок
    note: 'Осторожно: *forty*, а не *fourty* — буква *u* из *four* пропадает.'
    example_gloss: Это стоит сорок долларов.
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: пятьдесят
    note: '*fifty* — английское число 50.'
    example_gloss: Это стоит пятьдесят долларов.
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: сто
    note: В английском перед *hundred* всегда стоит *one* или *a* (*one hundred*, *a hundred*); по-русски достаточно сказать «сто».
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: Сколько тебе лет? / Сколько вам лет?
    note: '*How old are you?* подходит в любом регистре: различия между «ты» и «вы» в английском нет.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: Мне двадцать пять лет.
    note: 'Здесь другой порядок слов, чем в русском: в английском говорят буквально «я двадцать пять лет старый» (*I''m … years old*).'
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: Сколько это стоит?
    note: Вопрос о цене.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: Это стоит десять долларов.
    note: Стандартный ответ на вопрос о цене.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: Какой у тебя номер телефона?
    note: Вопрос о номере телефона.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: Пять-пять-пять, один-два-три-четыре.
    note: Номера телефонов в английском называют по цифрам, делая паузы между группами.
  en.a1.unit03.lesson04.teach.market:
    title: market
    gloss: рынок
    note: Место, где покупают продукты и другие товары.
    example_gloss: Мы на рынке.
  en.a1.unit03.lesson04.teach.apples:
    title: apples
    gloss: яблоки
    note: Множественное число от *apple*.
    example_gloss: Яблоки свежие.
  en.a1.unit03.lesson04.teach.opening:
    title: Даниэль начинает разговор
    gloss: 'Дэниел спрашивает: Сколько это стоит?'
    note: Простой вопрос о цене.
  en.a1.unit03.lesson04.teach.price_five:
    title: Лейла отвечает
    gloss: 'Лейла говорит: Это стоит пять долларов.'
    note: Ответ на вопрос Дэниела о цене.
  en.a1.unit03.lesson04.teach.ask_apples:
    title: Даниэль спрашивает про яблоки
    gloss: 'Дэниел спрашивает: А сколько стоят яблоки?'
    note: '*And* связывает этот вопрос с предыдущим.'
  en.a1.unit03.lesson04.teach.price_two:
    title: Лейла отвечает
    gloss: 'Лейла говорит: Они стоят два доллара.'
    note: Здесь *They're*, потому что *apples* — множественное число.
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: Даниэль спрашивает, сколько лет магазину
    gloss: 'Дэниел говорит: Хорошо, а сколько лет этому магазину?'
    note: '*How old* можно сказать и о вещах, а не только о людях.'
  en.a1.unit03.lesson04.teach.shop_age:
    title: Лейла отвечает
    gloss: 'Лейла говорит: Ему двадцать лет!'
    note: 'Та же конструкция, что и для людей: *years old* подходит и для предметов.'
