  en.a1.unit65.lesson02.teach.want_return:
    title: I want to return this.
    gloss: Я хочу это вернуть.
    note: '*I want to return this* — прямая фраза у стойки возврата.'
  en.a1.unit65.lesson02.teach.can_exchange:
    title: Can I exchange it?
    gloss: Можно это обменять?
    note: '*Can I...?* спрашивает, возможно ли что-то или разрешено ли это.'
  en.a1.unit65.lesson02.teach.have_receipt:
    title: Do you have the receipt?
    gloss: У тебя есть чек?
    note: '*receipt* — это чек, который показывает, что ты заплатил.'
