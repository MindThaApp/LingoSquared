    note: '*get a refund* означает получить деньги обратно.'
  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: Дэниел хочет кое-что вернуть
    gloss: 'Дэниел говорит: Привет. Я хочу вернуть эту рубашку.'
    note: '*return this shirt* означает вернуть эту рубашку.'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: Сотрудник просит чек
    gloss: 'Сотрудник говорит: У вас есть чек?'
    note: '*Do you have...?* спрашивает, есть ли что-то у человека с собой.'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: У Дэниела есть чек
    gloss: 'Дэниел говорит: Да, вот он. Размер слишком маленький.'
    note: '*Here it is* означает «вот он».'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: Сотрудник предлагает обмен
    gloss: 'Сотрудник говорит: Мы можем обменять её на размер побольше.'
    note: '*for a larger size* говорит, на что меняют товар.'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "Даниэль говорит «да»"
    gloss: 'Дэниел говорит: Да, пожалуйста.'
    note: '*Yes, please* — вежливое согласие.'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: Есть размер побольше
    gloss: 'Сотрудник говорит: У нас есть размер побольше, синего цвета.'
    note: '*We have...* сообщает, что есть в наличии.'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: Дэниелу не нужны деньги обратно
    gloss: 'Дэниел говорит: Отлично. Мне не нужен возврат денег.'
    note: '*I do not need* означает «мне не нужно».'
  en.a1.unit65.lesson04.teach.return_note:
    title: Записка о возврате
    gloss: 'Записка о возврате: Синяя рубашка. Размер маленький. Обменять на размер побольше. Нужен чек.'
    note: В записке указаны товар, размер, действие и чек.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'Текст: обмен в магазине'
    gloss: 'Обмен в магазине: Дэниел купил синюю рубашку, но размер оказался слишком маленьким. Он вернулся в магазин с чеком. Сотрудник попросил чек и предложил размер побольше. Дэниел обменял рубашку. Деньги обратно ему были не нужны, потому что синяя рубашка большего размера подошла.'
    note: '*exchanged* — прошедшее время от *exchange*.'
