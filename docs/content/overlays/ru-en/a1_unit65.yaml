    gloss: Этот размер слишком маленький.
    note: '*too small* означает «слишком маленький».'
  en.a1.unit65.lesson02.teach.larger_size:
    title: I need a larger size.
    gloss: Мне нужен размер побольше.
    note: '*larger* означает «больше».'
