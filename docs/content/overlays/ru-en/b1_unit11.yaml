    title: Would you take the course?
teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: бы
    note: '*would* + начальная форма выражает воображаемый результат или вежливое предпочтение.'
    example_gloss: Я бы присоединился, если бы у меня было больше времени.
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: предпочёл бы
    note: '*would rather* значит, что вы предпочитаете одно другому.'
    example_gloss: Я бы предпочёл пойти на курс по выходным.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: если бы я был
    note: '*if I were* вводит нереальную ситуацию о себе самом.'
    example_gloss: Если бы я был свободен сегодня вечером, я бы пошёл.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: возможность, шанс
    note: '*opportunity* значит хорошую возможность что-то сделать.'
    example_gloss: Этот курс — хорошая возможность для Лейлы.
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: сожаление
    note: '*regret* значит сожаление о решении, принятом в прошлом.'
    example_gloss: 'Она сожалеет об одном: что не начала копить деньги раньше.'
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: рискнуть, попытать удачу
    note: '*take a chance* значит попробовать что-то, даже если успех не гарантирован.'
    example_gloss: Если бы курс был дешевле, она бы рискнула.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: Eine unwirkliche Situation in der Gegenwart
    gloss: Если бы у меня было больше времени, я бы записалась на курс дизайна.
    note: 'После *if* для нереальной ситуации в настоящем стоит прошедшее время: *If I had more time*. Как и в русском «если бы у меня было больше времени», где глагол стоит в прошедшем времени с «бы».'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: Если бы он был дешевле, я бы записалась сегодня.
    note: '*were* естественно звучит в нереальном условии, даже с *it*.'
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Unwirkliche Bedingungen in der Gegenwart
    gloss: Если бы он был дешевле, я бы записалась.
    note: 'Форма: *if* + прошедшее время, затем *would* + начальная форма.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: раньше
    note: '*sooner* значит раньше, чем это произошло на самом деле.'
    example_gloss: Если бы она узнала об этом раньше, она бы накопила больше денег.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: уверенный
    note: '*confident* значит, что вы чувствуете, что можете что-то хорошо делать.'
    example_gloss: Если бы Дэниел присоединился, Лейла чувствовала бы себя увереннее.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Lesetext: eine verpasste Gelegenheit'
    gloss: 'Лейла нашла курс дизайна, на который она очень хочет пойти. Он полезный, но дорогой. Если бы он был дешевле, она бы записалась сегодня. Если бы Дэниел тоже пошёл на курс, она чувствовала бы себя увереннее. Её единственное сожаление — время: если бы она узнала о курсе раньше, она бы накопила больше денег.'
    note: Короткий текст с нереальными условиями в настоящем и прошлом.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia stellt eine hypothetische Frage
    gloss: 'Миа говорит: Лейла, ты бы пошла на курс дизайна, если бы он был дешевле?'
    note: Вежливый гипотетический вопрос с *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila nennt das vorgestellte Ergebnis
    gloss: 'Лейла говорит: Конечно. Если бы он был дешевле, я бы записалась сегодня.'
    note: '*If it were cheaper, I would...* описывает, что она сделала бы в другой ситуации.'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia schlägt ein weiteres Szenario vor
    gloss: 'Миа говорит: А если бы Дэниел тоже пошёл?'
    note: '*What if...* вводит воображаемую возможность.'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila beschreibt ihr Gefühl
    gloss: 'Лейла говорит: Если бы Дэниел присоединился, я бы чувствовала себя увереннее.'
    note: '*joined* стоит в прошедшем времени, потому что ситуация только воображаемая.'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia nennt ihre Vorliebe
    gloss: 'Миа говорит: Я бы предпочла пойти на курс по выходным, а не на вечерний.'
    note: '*would rather ... than ...* сравнивает два предпочтения.'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila spricht über ein Bedauern in der Vergangenheit
    gloss: 'Лейла говорит: Я тоже. Если бы я узнала об этом раньше, я бы накопила больше денег.'
    note: '*if + past perfect, would have + причастие* описывает нереальную ситуацию в прошлом.'
