teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: головная боль
    note: '*headache* значит «головная боль». В английском это существительное в единственном числе с артиклем: *a headache*, а не «головные боли».'
    example_gloss: У меня болит голова.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: боль в животе
    note: '*stomachache* значит «боль в животе». Здесь тоже единственное число с артиклем: *a stomachache*.'
    example_gloss: У меня болит живот.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: температура, жар
    note: '*fever* значит «температура, жар». Говорят *have a fever*, а не *have fever*.'
    example_gloss: Кажется, у меня температура.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: кашель
    note: '*cough* значит «кашель». Это и существительное, и глагол: *a cough* (кашель), *to cough* (кашлять).'
    example_gloss: У Дэниела сильный кашель.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: боль в горле
    note: '*sore throat* значит «боль в горле». *sore* означает «воспалённый, болезненный»; артикль тоже нужен: *a sore throat*.'
    example_gloss: У меня болит горло.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: Что случилось?
    note: Вопросом *What's wrong?* ты спрашиваешь, в чём проблема. *What's* — краткая форма от *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: У меня болит голова.
    note: 'Фразой *I have a...* ты называешь жалобу. Дословно это «у меня есть ...»: по-английски жалоба называется существительным с *have*, а не глаголом «болит».'
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: Мне жарко.
    note: Фразой *I feel...* ты говоришь, как ты себя физически чувствуешь. *I feel hot* дословно «я чувствую себя горячим», а значит «мне жарко». В английском подлежащее здесь *I*, а не «мне».
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: отдыхать
    note: '*rest* значит «отдыхать».'
    example_gloss: Мне нужно отдохнуть.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: Текст о жалобах
    gloss: У меня болят голова и горло. Кажется, у меня ещё и температура. Мне нужно отдохнуть.
    note: В этом коротком тексте человек описывает сразу несколько жалоб.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Тебе стоит сходить к врачу.
    note: 'Фразой *You should...* ты даёшь простой совет: «тебе стоит ...». После *should* глагол стоит без *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: Спрашиваем, как дела
    gloss: 'Лейла говорит: Ты неважно выглядишь. Что случилось?'
    note: '*You don''t look well* значит: «Ты неважно выглядишь».'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: У меня болят голова и горло.'
    note: Дэниел называет сразу две жалобы.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: Спрашиваем о температуре
    gloss: 'Лейла спрашивает: У тебя температура?'
    note: Вопросом *Do you have a fever?* ты спрашиваешь о конкретной жалобе.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: Не уверен, но мне жарко.'
    note: Дэниел не уверен, но говорит, как он себя чувствует.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Совет Лейлы
    gloss: 'Лейла говорит: Тебе стоит отдохнуть и попить воды. Если лучше не станет, сходи к врачу.'
    note: Лейла сначала даёт простой совет, а потом говорит, когда Дэниелу стоит пойти к врачу.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Последний ответ Дэниела
    gloss: 'Дэниел говорит: Хорошо, спасибо. Сегодня я отдохну.'
    note: Дэниел принимает совет и говорит, что собирается делать сегодня.
