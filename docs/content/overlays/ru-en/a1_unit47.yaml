teaching:
  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: приём; встреча (по записи)
    note: '*appointment* значит «приём» или «встреча по записи».'
    example_gloss: У меня приём в четверг.
  en.a1.unit47.lesson01.teach.available:
    title: available
    gloss: свободный; доступный
    note: '*available* значит «свободный» или «доступный».'
    example_gloss: Ты свободен в четверг?
  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: записать; забронировать
    note: '*book* здесь значит «записать» или «забронировать», а не существительное «книга».'
    example_gloss: Я хочу записаться на приём.
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: подтвердить
    note: '*confirm* значит «подтвердить».'
    example_gloss: Можешь подтвердить время?
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: перенести
    note: '*reschedule* значит «перенести встречу на другое время».'
    example_gloss: Можем ли мы перенести на пятницу?
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: Я хотел бы записаться на приём.
    note: '*I''d* — сокращение от *I would*. Эта форма звучит вежливее, чем *I want*: по-русски похоже на «я хотел бы» вместо «я хочу».'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: Вы свободны в пятницу?
    note: 'Перед днём недели в английском нужен предлог *on*: *on Friday*, как русское «в пятницу». Не пропускай его.'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: Какое время вам подходит?
    note: '*works for you* здесь значит «вам подходит» — это устойчивое выражение, а не буквальное «работает».'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: Это время мне подходит.
    note: '*That time works for me.* значит «это время мне подходит».'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: Можем ли мы перенести на понедельник?
    note: В *reschedule for ...* новая дата вводится словом *for*, а не *to*.
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: Ваша запись подтверждена.
    note: '*Your appointment is confirmed.* значит «ваша запись подтверждена».'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: Вопрос Мии
    gloss: 'Миа спрашивает: Лейла, с Максом всё в порядке? В последнее время он выглядит немного усталым.'
    note: '*He seems a little tired lately.* значит «в последнее время он выглядит немного усталым».'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: Объяснение Лейлы
    gloss: 'Лейла говорит: Всё в порядке, не волнуйся. Просто ему пора на ежегодный осмотр. Надо позвонить ветеринару.'
    note: '*due for* значит «пора на что-то», о том, что нужно сделать вовремя.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Лейла звонит ветеринару
    gloss: 'Лейла говорит: Здравствуйте, я хотела бы записаться на осмотр моей собаки.'
    note: '*I''d like to* звучит вежливее, чем *I want to*; по-русски похоже на «я хотела бы» вместо «я хочу».'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: Вопрос Мии
    gloss: 'Миа спрашивает: Что они сказали?'
    note: В *did they say* глагол *did* — вспомогательный, он показывает прошедшее время в вопросе.
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Они свободны в четверг в три часа дня.'
    note: '*at 3pm* — перед точным временем ставится *at*.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: Проверочный вопрос Мии
    gloss: 'Миа спрашивает: Тебе подходит это время?'
    note: '*Does that time work for you?* — вопросительная форма от *that time works for you*, с вспомогательным *does*, как и в других вопросах.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: Подтверждение от Лейлы
    gloss: 'Лейла говорит: Да, мне подходит. Четверг, три часа дня -- спасибо! Запись Макса подтверждена.'
    note: 'В *Max''s appointment* окончание *''s* показывает принадлежность: «запись Макса».'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Текст о записи на приём
    gloss: 'Как записаться на приём: если вам нужно к врачу, стоматологу или в другую службу, обычно сначала нужно записаться. Позвоните и скажите, что хотели бы записаться на приём. Администратор скажет, какие дни и время свободны. Выберите время, которое вам подходит, и вашу запись подтвердят. Если что-то изменится, позвоните снова и попросите перенести приём. На прошлой неделе Лейла позвонила ветеринару, чтобы записать свою собаку Макса на ежегодный осмотр. У них было свободно в четверг в три часа дня, и Лейла подтвердила время. У Даниэля тоже есть запись -- в понедельник утром он идёт к стоматологу на осмотр. Он сказал, что не волнуется, просто на этой неделе немного занят.'
    note: '*a little busy this week* значит «немного занят на этой неделе».'
