teaching:
  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: Хочешь сходить в кино на этих выходных?
    note: Фразой *Do you want to...?* ты предлагаешь занятие. После *to* стоит глагол в начальной форме, без окончаний.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: Хочешь пойти погулять?
    note: '*Would you like to...?* — чуть более вежливый вариант *Do you want to...?* По-русски это похоже на «Не хочешь...?» или «Не желаешь...?».'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: Конечно, с удовольствием!
    note: Фразой *I'd love to* ты с радостью соглашаешься. *I'd* — краткая форма от *I would*; после *to* глагол опускают, потому что он уже прозвучал в вопросе.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Извини, не получится. В субботу я занят.
    note: Этой фразой ты отказываешься и называешь причину. *can't* — краткая форма от *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: Может, в другой раз?
    note: Так ты показываешь, что с радостью пришёл бы в другой раз.
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: обедать
    note: '*have lunch* значит «обедать». Как и с другими приёмами пищи, артикля нет.'
  en.a1.unit17.lesson03.teach.invitation_text:
    title: Текст приглашения
    gloss: Привет! Хочешь пообедать в пятницу? Как насчёт часа дня в кафе?
    note: Это приглашение на обед.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: Воскресенье мне подходит.
    note: '*works for me* значит, что тебе это удобно.'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
    title: Вопрос о кино
    gloss: Дэниел спрашивает, не сходят ли они в кино на этих выходных
    note: Тот же вопрос, что и в первом уроке.
  en.a1.unit17.lesson04.teach.a_love_to_what_day:
    title: Соглашаемся и спрашиваем про день
    gloss: 'Лейла говорит: Конечно, с удовольствием! В какой день?'
    note: Лейла сначала соглашается, а потом спрашивает про день.
  en.a1.unit17.lesson04.teach.q_saturday:
    title: Предлагаем субботу
    gloss: 'Дэниел говорит: Как насчёт субботы?'
    note: Фразой *How about...?* ты предлагаешь конкретное время.
  en.a1.unit17.lesson04.teach.a_busy_sunday:
    title: Отказываемся и предлагаем воскресенье
    gloss: 'Лейла говорит: Извини, не получится. В субботу я занята. А как насчёт воскресенья?'
    note: Лейла отказывается от субботы и предлагает воскресенье.
  en.a1.unit17.lesson04.teach.a_sunday_works:
    title: Согласие на воскресенье
    gloss: 'Дэниел говорит: Воскресенье мне подходит.'
    note: Дэниел согласен на воскресенье, значит, план готов.
