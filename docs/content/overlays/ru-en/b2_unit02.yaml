course:
  title: Английский B2
  description: Английский на уровне B2 для тонких разговоров, аргументации, предположений и профессиональных дискуссий, с объяснениями на неформальном русском.
units:
  en.b2.unit02.speculation:
    title: It must have gone down overnight
lessons:
  en.b2.unit02.lesson01.certainty_and_deduction:
    title: May, might, must и cannot
  en.b2.unit02.lesson02.present_and_past_speculation:
    title: It must have been a system problem
  en.b2.unit02.lesson03.reading_an_incident_note:
    title: 'Чтение: что, вероятно, произошло?'
  en.b2.unit02.lesson04.the_speculation_dialogue:
    title: A deduction, not just a guess
teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: может быть, возможно
    note: '*may* выражает возможность. Здесь это не разрешение, как в *May I...?*.'
    example_gloss: Это может быть правдой.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: мог бы, не исключено
    note: '*might* выражает осторожную возможность, часто чуть менее уверенную, чем *may*.'
    example_gloss: Это, возможно, и правда, но не наверняка.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: должно быть, наверняка
    note: '*must* здесь выражает твёрдый вывод на основе фактов, а не обязанность.'
    example_gloss: Это, должно быть, правда.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: не может быть, исключено
    note: '*cannot* употребляется, когда факты исключают какую-то версию. Для прошлого получается *cannot have been*.'
    example_gloss: Это не может быть правдой.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: вывод на основе доказательств
    note: '*deduction* — это рассуждение от улик к выводу, а не просто догадка.'
    example_gloss: Вывод Мии основан на доказательствах.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: догадки, гадание
    note: '*guesswork* — это предположения при слабых доказательствах или вовсе без них.'
    example_gloss: Без доказательств такое объяснение было бы просто гаданием.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May и might часто пересекаются по значению. Оба показывают возможное объяснение; might часто звучит чуть осторожнее.
    note: Не переводи русское «может быть» или «возможно» всё время словом *maybe*. В аккуратно составленном предложении *may* и *might* обычно звучат лучше.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Твёрдый вывод о прошлом
    gloss: Сервер, должно быть, вышел из строя ночью, потому что не было сформировано ни одного отчёта.
    note: 'Русское «должно быть, случилось» передаётся в английском конструкцией *must have* + причастие прошедшего времени: *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Возможная причина в прошлом
    gloss: Отчёты, возможно, дали сбой ночью.
    note: '*may have failed* называет возможную причину, а не твёрдый вывод.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Осторожное предположение
    gloss: Вместо этого причиной могла быть проблема с правами доступа.
    note: '*might have been* оставляет причину открытой и звучит осторожнее, чем *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: Исключить версию
    gloss: Это не могло быть только проблемой с отчётами.
    note: Русское «не могло быть» в английском передаётся как *cannot have been* или, в разговорной речи, *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: Модальные глаголы для предположений
    gloss: Используй must be для твёрдого вывода о настоящем и must have been для твёрдого вывода о прошлом. Используй may/might для возможности в настоящем и may have/might have для возможности в прошлом. Используй cannot/cannot have been, когда факты исключают какое-то объяснение.
    note: 'Обрати внимание: здесь *must* означает не «обязан», а «должно быть, так и есть»: это вывод.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: сбой, отказ в работе
    note: '*outage* — это сбой, при котором система или служба не работает.'
    example_gloss: Сбой в работе системы привёл к тому, что отчёты не запустились.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: последствие
    note: '*consequence* — это результат какой-то причины или проблемы.'
    example_gloss: Одно из последствий в том, что на панели могут отображаться устаревшие данные.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Текст для чтения: что, вероятно, произошло?'
    gloss: Ночные отчёты не запустились, а страница мониторинга пуста. Миа говорит, что сервер, должно быть, вышел из строя ночью. Дэниел предполагает, что причиной могла быть проблема с правами доступа, но она не объясняет пустую страницу мониторинга. Финансовому отделу, возможно, не хватает утренних цифр, а клиентская панель может показывать старые данные, пока отчёты не будут пересобраны. Миа не вполне уверена, но её объяснение — вывод из имеющихся доказательств, а не просто гадание.
    note: Текст разделяет факты, возможные причины, твёрдые выводы, исключённые версии и возможные последствия.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Дэниел называет факт
    gloss: 'Дэниел говорит: Ни один из ночных отчётов не был сформирован.'
    note: Это известный факт, пока ещё не предположение.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Миа делает твёрдый вывод
    gloss: 'Миа говорит: Сервер, должно быть, вышел из строя ночью.'
    note: '*must have gone down* — твёрдый вывод о прошлом.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Дэниел называет возможную причину
    gloss: 'Дэниел говорит: Вместо этого причиной могла быть проблема с правами доступа.'
    note: '*might have been* оставляет вариант открытым, но не делает его достоверным.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Миа исключает ограниченное объяснение
    gloss: 'Миа говорит: Возможно, но страница мониторинга тоже пуста, так что это не могло быть только проблемой с отчётами.'
    note: '*cannot have been only...* исключает объяснение, потому что фактов больше.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Дэниел спрашивает о последствиях
    gloss: 'Дэниел спрашивает: Каких последствий нам ждать?'
    note: После причины возникает вопрос о возможных последствиях.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Миа называет возможные последствия
    gloss: 'Миа говорит: Финансовому отделу, возможно, не хватает утренних цифр, а клиентская панель может показывать старые данные.'
    note: '*may be missing* и *might show* называют возможные последствия, а не достоверные факты.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Дэниел уточняет степень уверенности
    gloss: 'Дэниел говорит: То есть это вывод, а не просто догадка?'
    note: Дэниел спрашивает, опираются ли рассуждения Мии на доказательства.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Миа уточняет свой вывод
    gloss: 'Миа говорит: Да. Доказательств немного, но они указывают на сбой в работе системы.'
    note: Твёрдый вывод может признавать и ограниченность доказательств.
