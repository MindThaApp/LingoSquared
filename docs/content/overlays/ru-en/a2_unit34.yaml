teaching:
  en.a2.unit34.lesson01.teach.refund:
    title: refund
    gloss: возврат денег
    note: '*refund* означает, что вам возвращают деньги.'
    example_gloss: Я хотел бы вернуть деньги за этот блендер.
  en.a2.unit34.lesson01.teach.exchange:
    title: exchange
    gloss: обмен / обменять
    note: '*exchange* означает обменять один товар на другой.'
    example_gloss: Вы хотите вернуть деньги или лучше обменять товар?
  en.a2.unit34.lesson01.teach.receipt:
    title: receipt
    gloss: кассовый чек
    note: '*receipt* означает кассовый чек, который подтверждает, что вы что-то купили.'
    example_gloss: У вас с собой чек?
  en.a2.unit34.lesson01.teach.return_policy:
    title: return policy
    gloss: правила возврата
    note: '*return policy* означает правила магазина о том, как можно вернуть товар.'
    example_gloss: По правилам возврата магазина у вас есть 30 дней.
  en.a2.unit34.lesson01.teach.defective:
    title: defective
    gloss: бракованный
    note: '*defective* означает сломанный или работающий неправильно.'
    example_gloss: Блендер был бракованным, поэтому я его вернул.
  en.a2.unit34.lesson02.teach.return_blender_stopped_working:
    title: Вернуть неисправный товар
    gloss: Я хотел бы вернуть этот блендер. Он перестал работать после первого использования.
    note: '*I''d like to return...* — вежливый способ вернуть товар.'
  en.a2.unit34.lesson02.teach.refund_or_exchange_question:
    title: Продавщица предлагает выбор
    gloss: Вы хотите вернуть деньги или обменять товар?
    note: С *Would you like...or...?* предлагают выбор.
  en.a2.unit34.lesson02.teach.id_like_a_refund:
    title: попросить вернуть деньги
    gloss: Я хотел бы вернуть деньги, пожалуйста.
    note: '*I''d like..., please* — вежливый способ о чём-то попросить.'
  en.a2.unit34.lesson03.teach.within_30_days:
    title: сказать, в какой срок можно вернуть
    gloss: Товары можно вернуть в течение 30 дней при наличии чека.
    note: '*within 30 days* означает «в течение 30 дней».'
  en.a2.unit34.lesson03.teach.policy_text:
    title: Текст о правилах возврата
    gloss: 'Правила возврата: товары можно вернуть в течение 30 дней при наличии чека. Бракованные товары можно обменять или вернуть за них деньги в любое время.'
    note: Формальные правила возврата со сроком и исключением для бракованных товаров.
  en.a2.unit34.lesson03.teach.i_have_my_receipt:
    title: сказать, что у тебя есть чек
    gloss: У меня есть чек с прошлой недели.
    note: '*from last week* означает «с прошлой недели».'
  en.a2.unit34.lesson04.teach.q_return_blender:
    title: Лейла возвращает миксер
    gloss: 'Лейла говорит: Здравствуйте, я хотела бы вернуть этот блендер. Он перестал работать после первого использования.'
    note: Те же предложения, что и во втором уроке, теперь с приветствием.
  en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt:
    title: Продавец спрашивает чек
    gloss: 'Продавец говорит: Мне жаль это слышать. У вас с собой чек?'
    note: '*I''m sorry to hear that* — вежливый способ выразить сочувствие.'
  en.a2.unit34.lesson04.teach.q_yes_bought_last_week:
    title: Лейла подтверждает покупку
    gloss: 'Лейла говорит: Да, вот он. Я купила блендер на прошлой неделе.'
    note: Лейла отдаёт чек и говорит, когда купила блендер.
  en.a2.unit34.lesson04.teach.a_refund_or_exchange:
    title: Продавец предлагает выбор
    gloss: 'Продавец говорит: Спасибо. Вы хотите вернуть деньги или обменять товар?'
    note: Тот же вопрос, который мы учили во втором уроке.
  en.a2.unit34.lesson04.teach.q_id_like_a_refund:
    title: Лейла выбирает возврат денег
    gloss: 'Лейла говорит: Я хотела бы вернуть деньги, пожалуйста.'
    note: То же предложение, которое мы учили во втором уроке.
  en.a2.unit34.lesson04.teach.a_refund_thirty_five:
    title: Продавец возвращает деньги
    gloss: 'Продавец говорит: Без проблем. Вот ваш возврат: тридцать пять долларов.'
    note: Продавец оформляет возврат и называет точную сумму.
