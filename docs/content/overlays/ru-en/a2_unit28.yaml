course:
  title: Английский A2
  description: Английский уровня A2 для более формальных повседневных ситуаций, с подробными объяснениями на русском языке.
units:
  en.a2.unit28.doctor:
    title: Поход к врачу
lessons:
  en.a2.unit28.lesson01.health_followup_vocabulary:
    title: Лекарства и приёмы
  en.a2.unit28.lesson02.calling_to_make_an_appointment:
    title: Звоним, чтобы записаться на приём
  en.a2.unit28.lesson03.reading_an_appointment_confirmation:
    title: Читаем подтверждение записи
  en.a2.unit28.lesson04.doctor_appointment_dialogue:
    title: У врача
teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: лекарство
    note: '*medicine* означает «лекарство» или «медикамент».'
    example_gloss: Врач дал мне лекарство от головной боли.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: рецепт
    note: '*prescription* означает рецепт, который выписывает врач.'
    example_gloss: Врач выписал мне рецепт на лекарство.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: повторный приём
    note: '*follow-up appointment* означает ещё один приём, на котором врач проверяет, как вы себя чувствуете.'
    example_gloss: Если лучше не станет, вам понадобится повторный приём.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: становиться хуже
    note: '*getting worse* означает, что симптомы усиливаются.'
    example_gloss: Моя головная боль усиливается, а не проходит.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: страховая карта
    note: '*insurance card* — карта вашей медицинской страховки; в России ближе всего к ней страховой полис.'
    example_gloss: Принесите страховую карту на приём.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: Прежние жалобы
    gloss: головная боль, боль в горле, температура
    note: Эти слова вы уже учили в уроке 22; здесь мы их повторяем.
    example_gloss:
    - У меня болит голова.
    - У меня болит горло.
    - У меня температура.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: Попросить о записи на приём
    gloss: Я хотел бы записаться на приём к врачу.
    note: С *I'd like to...* вежливо просят о записи на приём.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: Сказать, как давно у вас жалобы
    gloss: У меня три дня болят голова и горло, и становится хуже.
    note: 'Для того, что длится уже некоторое время, английский использует *Present Perfect* (*I''ve had ... for three days*). В русском для этого достаточно настоящего времени: «у меня уже три дня болит ...».'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: прийти за десять минут
    note: '*arrive ten minutes early* означает прийти за десять минут до приёма.'
    example_gloss: Пожалуйста, приходите на приём за десять минут до его начала.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: Текст подтверждения
    gloss: Ваша запись на сегодня на 15:00 подтверждена. Пожалуйста, принесите страховую карту и приходите за десять минут до приёма. Номер подтверждения — 7724.
    note: 'Формальное подтверждение: в нём названы время, то, что нужно сделать, и номер.'
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: Понятно.
    note: С *I see* показывают, что ты понял.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: Спросить, что случилось
    gloss: 'Врач спрашивает: Что вас беспокоит?'
    note: Тот же вопрос, который Лейла задавала в уроке 22, только теперь его задаёт врач.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Ответ Даниэля о жалобах
    gloss: 'Дэниел говорит: У меня три дня болят голова и горло, и становится хуже.'
    note: То же предложение, что и во втором уроке.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: Диагноз врача
    gloss: 'Врач говорит: Понятно. У вас сильная простуда.'
    note: Простой повседневный диагноз, ничего серьёзного.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: Спросить о лекарствах
    gloss: 'Дэниел спрашивает: Нужно ли мне принимать какое-нибудь лекарство?'
    note: Дэниел спрашивает о лечении, выслушав диагноз.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: Инструкции по приёму лекарства
    gloss: 'Врач говорит: Да, принимайте это лекарство два раза в день в течение пяти дней и пейте много воды.'
    note: 'Точное указание: два раза в день, пять дней.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: Спросить о повторном приёме
    gloss: 'Дэниел спрашивает: Нужно ли мне прийти снова, если лучше не станет?'
    note: Дэниел использует то же условие (*if it doesn't get better*), что и Лейла в уроке 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: Ответ врача о повторном приёме
    gloss: 'Врач говорит: Да, если за неделю лучше не станет, приходите на повторный приём.'
    note: 'Врач точно говорит, когда Дэниелу нужно прийти снова: если в течение недели не станет лучше.'
