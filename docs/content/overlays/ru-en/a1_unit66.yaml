teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: симптом
    note: '*symptom* значит «симптом», то есть признак болезни, который ты чувствуешь. Обрати внимание на написание: *symptom* пишется через *y*.'
    example_gloss: Это симптом.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: кашель
    note: '*cough* значит «кашель». Произносится *kof*; сочетание *gh* здесь читается как *f*.'
    example_gloss: У меня кашель.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: температура, жар
    note: '*fever* значит «температура, жар».'
    example_gloss: У тебя температура?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: горло
    note: '*throat* значит «горло» в смысле глотки; для внешней части, шеи, говорят *neck*.'
    example_gloss: У меня болит горло.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: головная боль
    note: '*headache* значит «головная боль» (в английском это единственное число).'
    example_gloss: У меня болит голова.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: лекарство
    note: '*medicine* значит «лекарство» или «медицина». Слово неисчисляемое: *some medicine*.'
    example_gloss: Прими это лекарство.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: У меня кашель.
    note: По-английски говорят *have a cough* с *a*; по-русски артикля нет («у меня кашель»).
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: У меня болит горло.
    note: '*hurts* значит «болит». В английском подлежащее — часть тела (*my throat hurts*), а не «у меня», как по-русски.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: У меня болит голова.
    note: По-английски говорят *have a headache* с *a*; по-русски артикля нет, и вместо существительного часто используют глагол «болит».
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: У вас есть лекарство?
    note: '*Do you have...?* спрашивает, есть ли что-то.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Примите это с водой.
    note: '*with water* стоит в конце предложения.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Пожалуйста, обратитесь к врачу.
    note: '*Please* делает предложение вежливым.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Лейла называет жалобу
    gloss: 'Лейла говорит: Здравствуйте. У меня кашель.'
    note: '*I have a cough* называет жалобу.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: Аптекарь спрашивает о температуре
    gloss: 'Аптекарь говорит: У вас температура?'
    note: '*Do you have a fever?* — вопрос, на который отвечают «да» или «нет».'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: У Лейлы нет температуры
    gloss: 'Лейла говорит: Нет, температуры нет. У меня болит горло.'
    note: '*No, I do not have...* отрицает жалобу. В английском отрицание строится с *do not*, а не с «нет», как «у меня нет».'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: Аптекарь спрашивает о головной боли
    gloss: 'Аптекарь говорит: У вас болит голова?'
    note: '*headache* значит «головная боль».'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: У Лейлы болит голова
    gloss: 'Лейла говорит: Да, у меня болит голова.'
    note: '*Yes* значит «да».'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: Совет аптекаря
    gloss: 'Аптекарь говорит: Примите это лекарство с водой. Пожалуйста, обратитесь к врачу, если вам станет хуже.'
    note: '*if you feel worse* значит «если вам станет хуже».'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Лейла благодарит
    gloss: 'Лейла говорит: Спасибо.'
    note: '*Thank you* — краткая форма благодарности.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: Аптечная записка
    gloss: 'Аптечная записка: Кашель и боль в горле. Температуры нет. Принимать лекарство с водой. Обратиться к врачу, если станет хуже.'
    note: В записке названы жалобы и простые советы.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'Текст: визит в аптеку'
    gloss: 'Визит в аптеку: Лейла пошла в аптеку, потому что у неё был кашель и болело горло. Аптекарь спросил, есть ли у неё температура. Лейла ответила, что температуры нет, но болит голова. Аптекарь дал ей лекарство и сказал принимать его с водой. В записке было написано, что нужно обратиться к врачу, если ей станет хуже.'
    note: '*felt worse* — прошедшее время от *feel worse*.'
