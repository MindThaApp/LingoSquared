course:
  title: Английский B2
  description: Английский на уровне B2 для тонких разговоров, аргументации, предположений и профессиональных дискуссий, с объяснениями на неформальном русском.
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Согласие, противоречие и обоснование
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Чтение: опрос и отчёт перевозчика'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: источник
    note: '*source* — это источник, который даёт информацию. Не используй везде *according to*: иногда речь идёт о совпадении или противоречии между источниками.'
    example_gloss: Источник даёт информацию.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: обобщать, сводить воедино
    note: '*synthesize* значит объединять информацию из нескольких источников в связный ответ.'
    example_gloss: Обобщить — значит свести воедино информацию из источников.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: оценивать
    note: '*evaluate* значит оценивать, насколько что-то убедительно или весомо.'
    example_gloss: Оценить — значит определить, насколько что-то весомо.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: согласие, совпадение
    note: '*agreement* значит, что источники говорят одно и то же по какому-то пункту.'
    example_gloss: Согласие означает, что источники говорят одно и то же.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: противоречие, конфликт
    note: '*conflict* значит, что источники противоречат друг другу или расходятся по какому-то пункту.'
    example_gloss: Противоречие означает, что источники расходятся во мнениях.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: суждение, взвешенная оценка
    note: '*judgment* — это обоснованное суждение о том, какой источник сильнее. В американском варианте пишется *judgment*, в британском встречается и *judgement*.'
    example_gloss: Суждение объясняет, какой источник сильнее.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Согласие и противоречие вместе
    gloss: Оба источника согласны, что спрос вырос, но расходятся в оценке причины.
    note: '*Both sources agree... but they disagree...* лучше, чем два отдельных предложения с постоянным *according to*.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: напротив, в отличие от этого
    note: '*By contrast* используй, когда действительно противопоставляешь два источника или два пункта. Это не универсальная связка вроде русского «а» или «зато».'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: лучше обоснован
    note: '*better supported on the cause* значит, что доказательства причины убедительнее.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Построение обобщения
    gloss: В обобщении нужно назвать, в чём источники совпадают, в чём противоречат друг другу и какое изложение лучше обосновано.
    note: Используй *agree*, *conflict* и *better supported*, чтобы точно описать отношения между источниками.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: опрос, анкетирование
    note: '*survey* собирает ответы или замечания многих людей.'
    example_gloss: Опрос может собрать много замечаний.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: изложение, версия событий
    note: '*account* — это отчёт или объяснение того, что произошло.'
    example_gloss: Изложение объясняет, что произошло.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Источник A: Опрос пассажиров говорит, что опоздания автобусов участились после открытия новой больницы. Многие пассажиры говорят, что маршрут теперь переполнен, особенно утром. Опрос утверждает, что главная причина — возросший спрос.'
    note: В источнике A много замечаний пассажиров, но это не обязательно самое сильное доказательство причины.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Источник B: Отчёт перевозчика соглашается, что спрос вырос после открытия больницы, но называет главной причиной задержек нехватку водителей. В отчёт включены данные о персонале за тот же период.'
    note: '*staffing records* — более сильное доказательство причины, чем только впечатления пассажиров.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Тесса называет источник A
    gloss: 'Тесса говорит: Я прочитала два изложения о поздней работе автобусов. Опрос пассажиров говорит, что спрос вырос после открытия новой больницы.'
    note: Здесь вводится источник и пункт о возросшем спросе.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Роуэн называет источник B
    gloss: 'Роуэн говорит: Отчёт перевозчика согласен, что спрос вырос, но называет главной проблемой нехватку водителей.'
    note: Источник B подтверждает один пункт, но расходится в причине.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Тесса обобщает
    gloss: 'Тесса говорит: Значит, источники согласны насчёт возросшего спроса, но противоречат друг другу в причине.'
    note: '*agree on* и *conflict about* кратко описывают отношения между источниками.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Роуэн спрашивает о доказательствах
    gloss: 'Роуэн спрашивает: Какое изложение лучше обосновано?'
    note: Он просит дать оценку, а не просто пересказ.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Тесса сравнивает доказательства
    gloss: 'Тесса говорит: В опросе много замечаний пассажиров, но отчёт перевозчика включает данные о персонале.'
    note: 'Это вопрос о доказательствах: замечания против данных.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Роуэн просит дать оценку
    gloss: 'Роуэн спрашивает: И каково твоё суждение?'
    note: '*judgment* означает обоснованный вывод.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Тесса высказывает суждение
    gloss: 'Тесса говорит: Отчёт перевозчика лучше обоснован в вопросе причины, хотя опрос полезен тем, что показывает опыт пассажиров.'
    note: '*although* позволяет учитывать оба источника и всё же вынести суждение.'
