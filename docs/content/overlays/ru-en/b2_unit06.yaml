teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: ценность
    note: '*value* здесь значит принцип, который люди считают важным, а не только денежную стоимость.'
    example_gloss: Справедливость — это ценность.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: справедливость, беспристрастность
    note: '*fairness* — это разумное и честное отношение к людям. Слово сильнее и абстрактнее, чем просто *nice*.'
    example_gloss: Справедливость означает разумное отношение к людям.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: удобство, практичность
    note: '*convenience* — это удобство. Не переводи русское «лёгкость» как *easiness* в таком B2-контексте.'
    example_gloss: Удобство облегчает повседневную жизнь.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: гибкость
    note: '*flexibility* — это способность подстраиваться, когда меняются обстоятельства.'
    example_gloss: Гибкость позволяет меняться, когда меняются обстоятельства.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: уточнять, смягчать (мнение)
    note: '*qualify* здесь значит ограничить или уточнить своё мнение. Это не «получить квалификацию».'
    example_gloss: Можно уточнить мнение, ограничив его.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: отдавать приоритет
    note: '*prioritize fairness* значит считать справедливость важнее другой ценности.'
    example_gloss: Отдать приоритет справедливости значит считать её важнее чего-то другого.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Взвешивание ценностей
    gloss: В принципе, удобство важно, но справедливость должна весить больше.
    note: '*In principle* значит «в принципе, в теории»: сначала признаёшь общее правило, а дальше с *but* добавляешь свой главный акцент. Не путай с *eventually*: оно значит «в конце концов».'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Ограничение своей позиции
    gloss: Я не выступаю за тишину везде.
    note: '*I am not arguing for...* ограничивает твоё утверждение. Это лучше, чем расплывчатая калька с *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Прямой ответ другой стороне
    gloss: Это справедливо, и я согласен, что бизнесу нужна гибкость.
    note: '*That is fair* признаёт чужой довод, не отказываясь от собственной ценности.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Построение абстрактного мнения
    gloss: Сильное абстрактное мнение называет ценность, уточняет утверждение и прямо отвечает на точку зрения другого человека.
    note: Используй точные слова уровня B2, такие как *in principle*, *fairness* и *carry more weight*, а не постоянное *a bit* для смягчения.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: прозрачный, понятный
    note: '*transparent rules* — это правила, которые легко понять и проверить.'
    example_gloss: Прозрачные правила легко понять.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: коммерческий, деловой
    note: '*commercial activity* — это деятельность, связанная с бизнесом и прибылью.'
    example_gloss: Коммерческая деятельность связана с бизнесом.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Текст для чтения: тихие общественные места'
    gloss: 'Амара считает, что тихие общественные места нужно защищать, даже если это ограничивает часть коммерческой деятельности. Её позиция не абсолютна: она выступает не за тишину везде и признаёт, что бизнесу нужна некоторая гибкость. Лео возражает, что правила могут усложнить выживание бизнеса. Амара отвечает прямо на этот довод: удобство важно, но справедливость должна весить больше, когда место принадлежит всем. Её позиция оговорена, потому что она поддерживает ограниченные и прозрачные правила, а не неограниченные запреты.'
    note: 'Это абстрактный английский: называй ценности и точно ограничивай своё утверждение.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Амара называет свою позицию
    gloss: 'Амара говорит: Я думаю, город должен защищать тихие общественные места, даже если это ограничивает часть коммерческой деятельности.'
    note: '*even if* показывает, что она признаёт недостаток.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Лео называет другую ценность
    gloss: 'Лео говорит: Я тоже ценю тишину, но бизнесу нужна гибкость, чтобы выжить.'
    note: Лео противопоставляет гибкость акценту Амары на общественном пространстве.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Амара уточняет
    gloss: 'Амара говорит: Это справедливо, и я не выступаю за тишину везде. Моя мысль в том, что общие места не должны формироваться только прибылью.'
    note: '*not arguing for silence everywhere* не даёт её позиции прозвучать абсолютно.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Лео называет ценность
    gloss: 'Лео говорит: Значит, ценность, которой ты отдаёшь приоритет, — справедливость, а не просто комфорт?'
    note: '*prioritizing* здесь значит: делать важнее при взвешивании.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Амара взвешивает ценности
    gloss: 'Амара говорит: Именно. В принципе, удобство важно, но справедливость должна весить больше, когда место принадлежит всем.'
    note: '*carry more weight* — естественное английское выражение для «весить больше».'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Лео соглашается при условии
    gloss: 'Лео говорит: Я могу с этим согласиться, если правила будут ограниченными и прозрачными.'
    note: Согласие зависит от ограниченности и ясности правил.
