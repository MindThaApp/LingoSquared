course:
  title: Английский A2
  description: Английский уровня A2 для более формальных повседневных ситуаций, с подробными объяснениями на русском языке.
units:
  en.a2.unit39.after_the_interview:
    title: После собеседования
lessons:
  en.a2.unit39.lesson01.offer_vocabulary:
    title: Предложение, договор и дата выхода на работу
  en.a2.unit39.lesson02.following_up:
    title: Напоминаем о себе и принимаем предложение
  en.a2.unit39.lesson03.reading_an_offer_message:
    title: Читаем предложение о работе
  en.a2.unit39.lesson04.offer_call_dialogue:
    title: Звонок с предложением о работе
teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: предложение
    note: '*offer* здесь — предложение о работе. Как глагол *to offer* означает «предлагать».'
    example_gloss: Я получила предложение о работе от Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: трудовой договор, договор
    note: '*contract* — письменное соглашение между вами и компанией.'
    example_gloss: Договор заключается на один год.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: зарплата
    note: '*salary* — сумма, которую человек получает в месяц или в год.'
    example_gloss: О зарплате мы можем поговорить на следующей неделе.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: принять, согласиться
    note: '*accept* значит ответить «да» на то, что вам предлагают.'
    example_gloss: Я хотела бы принять эту должность.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: дата выхода на работу
    note: '*start date* — первый день на вашей новой работе.'
    example_gloss: Дата выхода на работу — первый понедельник месяца.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: ответ
    note: '*reply* — это и ответ на сообщение, и глагол «отвечать».'
    example_gloss: Я отправила ответ в тот же день.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to für einen höflichen Wunsch
    gloss: Я хотела бы принять предложение. Я хотела бы начать в понедельник.
    note: '*I would like to ...* вежливее, чем *I want to ...*, и подходит для делового общения.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Die Nachricht beginnen
    gloss: Спасибо за вчерашнее собеседование.
    note: '*Thank you for ...* — обычное начало короткого делового сообщения с благодарностью.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Sagen, dass Sie weiterhin interessiert sind
    gloss: Я по-прежнему очень заинтересована в этой должности.
    note: '*still* значит «по-прежнему, всё ещё» и стоит перед прилагательным.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Höflich nach dem Starttermin fragen
    gloss: Не могли бы вы сообщить мне дату выхода на работу?
    note: '*Could you tell me ...?* — косвенный вопрос, вежливее, чем *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Das Angebot annehmen
    gloss: Я хотела бы принять предложение.
    note: Это стандартное предложение, чтобы принять должность.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Indirekte Fragen mit Could you tell me
    gloss: Не могли бы вы сообщить мне дату выхода на работу? Не могли бы вы рассказать мне о рабочих часах?
    note: 'После *Could you tell me* порядок слов уже не вопросительный: говорят *the start date*, а не *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: полная занятость
    note: '*full time* означает полную рабочую неделю; противоположность — *part time* (неполная занятость).'
    example_gloss: Должность на полный рабочий день, а не только на два дня в неделю.
  en.a2.unit39.lesson03.teach.offer_message:
    title: Die Nachricht mit dem Angebot
    gloss: Уважаемая Миа, спасибо, что пришли к нам во вторник. Мы хотели бы предложить вам должность координатора по маркетингу. Договор на полный рабочий день, дата выхода на работу — понедельник. Пожалуйста, ответьте нам до пятницы. Bright Path Marketing.
    note: 'В сообщении с предложением о работе всегда названы четыре вещи: должность, вид договора, дата выхода на работу и срок вашего ответа.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: Die Antwortfrist
    gloss: Пожалуйста, ответьте до пятницы.
    note: '*by Friday* значит «не позже пятницы», то есть в саму пятницу ещё можно.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: Die Interviewerin ruft Mia an
    gloss: 'Сотрудница компании говорит: Здравствуйте, Миа, я звоню по поводу собеседования во вторник.'
    note: '*I am calling about ...* — обычное начало делового телефонного разговора.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia sagt, dass sie weiterhin interessiert ist
    gloss: 'Миа говорит: Спасибо за звонок. Я по-прежнему очень заинтересована в этой должности.'
    note: То же предложение, что и во втором уроке.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: Die Interviewerin bietet die Stelle an
    gloss: 'Сотрудница компании говорит: Отлично, потому что мы хотели бы предложить вам эту должность.'
    note: '*because* здесь связывает ответ Мии с хорошей новостью, которая следует.'
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia reagiert und fragt nach dem Starttermin
    gloss: 'Миа говорит: Это замечательная новость. Не могли бы вы сообщить мне дату выхода на работу?'
    note: Сначала коротко отреагировать на новость, и только потом задать вопрос.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: Die Interviewerin nennt Termin und Vertrag
    gloss: 'Сотрудница компании говорит: Дата выхода на работу — понедельник, договор на полный рабочий день.'
    note: Те же два факта, что и в сообщении из урока 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia fragt nach den Arbeitszeiten
    gloss: 'Миа спрашивает: Не могли бы вы рассказать мне о рабочих часах?'
    note: Та же форма косвенного вопроса, что и о дате выхода на работу.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: Die Interviewerin nennt die Arbeitszeiten
    gloss: 'Сотрудница компании говорит: С девяти до пяти, с часовым перерывом на обед.'
    note: '*from nine to five* — устойчивое выражение для описания рабочего дня.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia nimmt das Angebot an
    gloss: 'Миа говорит: Спасибо. Я хотела бы принять предложение.'
    note: То же предложение, что и во втором уроке.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: Die Interviewerin beendet das Gespräch
    gloss: 'Сотрудница компании говорит: Прекрасно. Мы пришлём вам договор сегодня же.'
    note: '*Wonderful* — тёплая, положительная реакция, вполне обычная и в деловом английском.'
