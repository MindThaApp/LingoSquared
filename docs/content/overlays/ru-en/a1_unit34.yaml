teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: футбол
    note: '*soccer* значит «футбол». Глагол к нему: *play*, то есть *play soccer*. По-русски тоже говорят «играть в футбол», но в английском с названием спорта нужно помнить отдельный глагол: *play*, *go* или *do*.'
    example_gloss: Мы играем в футбол по субботам.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: теннис
    note: '*tennis* значит «теннис». Как и с *soccer*, здесь используется *play*: *play tennis*.'
    example_gloss: Она играет в теннис каждые выходные.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: баскетбол
    note: '*basketball* значит «баскетбол». Здесь тоже *play*: *play basketball*, как с *soccer* и *tennis*. С играми с мячом в английском всегда используется *play* + название спорта.'
    example_gloss: Они играют в баскетбол в парке.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: плавание
    note: '*swimming* значит «плавание», «плавать». Здесь глагол меняется: *go swimming* (не *play swimming*). Для занятий вроде плавания и бега в английском используется *go* + форма на *-ing*. В русском для этого есть собственный глагол («плавать»), а в английском нужна пара *go* + *swimming*.'
    example_gloss: Я хожу плавать два раза в неделю.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: йога
    note: '*yoga* значит «йога». Глагол здесь *do*: *do yoga*. Для индивидуальных занятий вроде йоги в английском используется *do*, а не *play* и не *go*. По-русски говорят «заниматься йогой», так что *do* легко запомнить. Но помни, что в английском три глагола (*play*, *go*, *do*), и их выбирают по виду спорта.'
    example_gloss: Он занимается йогой по утрам.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: заниматься спортом
    note: '*exercise* значит «заниматься спортом», «тренироваться»: это общее слово для физической активности. В отличие от *soccer*, *swimming* и *yoga*, *exercise* можно использовать как глагол без *play*, *go* или *do*: *Do you exercise every day?*'
    example_gloss: Ты занимаешься спортом каждый день?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: два раза в неделю
    note: '*twice a week* значит «два раза в неделю». Слово *a* здесь означает не «один», а «в»: число + *a* + единица времени показывает, как часто что-то происходит за этот период. По-русски для этого тоже используется «в» («два раза в неделю»).'
    example_gloss: Он играет в теннис два раза в неделю.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: три раза в неделю
    note: '*three times a week* значит «три раза в неделю». Как и в *twice a week*, *a* здесь означает «в», а не «один»: *times* («раза») плюс *a week* («в неделю») показывают, как часто это бывает за неделю.'
    example_gloss: Она плавает три раза в неделю.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: в выходные
    note: '*on weekends* значит «в выходные». В английском перед выходными и днями недели используется *on*, а в русском для этого есть «в» («в выходные», «в субботу»). Просто запомни английский предлог *on*.'
    example_gloss: Мы играем в баскетбол в выходные.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: спортзал
    note: '*gym* значит «спортзал»: место с тренажёрами и занятиями для спорта.'
    example_gloss: Он занимается йогой в спортзале.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: бассейн
    note: '*pool* значит «бассейн»: место, наполненное водой, где можно плавать.'
    example_gloss: Я плаваю в бассейне.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: Как часто ты занимаешься спортом?
    note: 'Этот вопрос начинается с *how often* («как часто»). Дальше идёт вспомогательный глагол *do*, потому что основной глагол здесь *exercise*: то же самое *do* в вопросах, как и в других английских вопросах.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: Хочешь в субботу поиграть с нами в футбол?'
    note: Начало разговора с приглашением поиграть в футбол. С *soccer* используется *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Я не очень люблю футбол. Я предпочитаю плавание.'
    note: '*don''t really like* значит «не очень любить»: более мягкий способ сказать «нет».'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Ничего страшного! Как часто ты ходишь плавать?'
    note: '*go swimming*: с плаванием используется *go*, а не *play* или *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Два раза в неделю, обычно в бассейне рядом с моим домом.'
    note: '*Twice a week*: и здесь *a* значит «в».'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: Здорово! Я иногда тоже занимаюсь йогой, но бег всё равно мой любимый.'
    note: '*do yoga*: с йогой используется *do*, отдельно от *play* и *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Текст о Даниэле, Лейле и Мии
    gloss: 'Даниэль, Лейла и Мия каждый по-своему остаются активными. Даниэль каждое утро перед работой ходит бегать. Лейла предпочитает плавание: она ходит в бассейн два раза в неделю. Мия новенькая в команде, но она уже каждое воскресенье играет в теннис со своей соседкой. По субботам они иногда вместе играют в футбол в парке, но футбол ни для кого не любимый вид спорта.'
    note: 'В этом тексте есть все три глагола: *goes running* (*go*), *plays tennis* и *play soccer* (*play*). У каждого вида спорта свой глагол.'
