teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: Который час?
    note: '*What time is it?* — общий вопрос о времени.'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: Три часа.
    note: '*It''s three o''clock.* называет ровный час.'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: Половина четвёртого.
    note: 'Осторожно, настоящая ловушка: по-английски *half past three* — это половина часа ПОСЛЕ трёх, то есть 3:30. В русском «половина четвёртого» тоже означает 3:30, но логика другая: русский считает от следующего часа. Если перевести *half past three* дословно, получится «половина после трёх», а значит ровно то же время: 3:30.'
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: Пять часов.
    note: '*It''s five o''clock.* называет ровный час 5:00.'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: Четверть четвёртого.
    note: '*It''s a quarter past three.* означает 3:15.'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: Без четверти четыре.
    note: '*It''s a quarter to four.* означает 3:45.'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: Десять минут пятого.
    note: '*It''s ten past four.* означает 4:10.'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: Без десяти пять.
    note: '*It''s ten to five.* означает 4:50.'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: утро
    note: '*morning* означает «утро», примерно с 6 до 12 часов.'
    example_gloss: Доброе утро, Дэниел!
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: день (после полудня)
    note: '*afternoon* означает время после полудня, примерно с 12 до 17 часов.'
    example_gloss: Я работаю днём.
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: вечер
    note: '*evening* означает «вечер», примерно с 17 до 21 часа; границы нечёткие.'
    example_gloss: Добрый вечер, Лейла!
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: ночь
    note: '*night* означает «ночь», примерно с 21 до 6 часов.'
    example_gloss: Спокойной ночи, Дэниел!
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: Магазин открывается в девять утра.
    note: 'Перед временем в английском стоит *at*, как «в» в русском: *at nine* («в девять»).'
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: Магазин закрывается в восемнадцать часов (в шесть вечера).
    note: В английском повседневное время обычно называют в 12-часовом формате с указанием времени суток (*six in the evening*), а в русском для официальных часов работы часто используют 24-часовой формат (восемнадцать часов).
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: открывается в
    note: '*opens at* + время означает «открывается в» + время.'
    example_gloss: Библиотека открывается в девять.
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: закрывается в
    note: '*closes at* + время означает «закрывается в» + время.'
    example_gloss: Библиотека закрывается в шесть.
  en.a1.unit05.lesson04.teach.q_open:
    title: Даниэль спрашивает о времени работы
    gloss: 'Дэниел: Во сколько открывается библиотека?'
    note: '*What time does ...?* спрашивает о точном времени. В вопросе стоит *does*, поэтому *open* без -s.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Ответ о времени открытия
    gloss: 'Лейла: Она открывается в девять утра.'
    note: Полный ответ называет точное время и время суток.
  en.a1.unit05.lesson04.teach.q_close:
    title: Спросить о времени закрытия
    gloss: 'Дэниел: А во сколько она закрывается?'
    note: '*And* начинает второй вопрос в том же разговоре.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Ответ о времени закрытия
    gloss: 'Лейла: Она закрывается в восемнадцать часов (в шесть вечера).'
    note: Полный ответ и здесь называет точное время.
  en.a1.unit05.lesson04.teach.closing:
    title: Завершить разговор
    gloss: 'Дэниел: Отлично, тогда увидимся в девять!'
    note: '*See you at nine!* означает, что вы увидитесь в девять часов.'
