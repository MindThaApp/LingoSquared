teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: выражаться осторожнее, смягчать
    note: '*hedge* значит делать утверждение менее категоричным. Русское «немного» или «слегка» не стоит автоматически переводить как *a little*.'
    example_gloss: Лейла использует seems, чтобы смягчить своё утверждение о новом порядке.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: ограничивать, вносить уточнение
    note: '*qualify* значит ограничить утверждение условием или исключением.'
    example_gloss: Выражение 'provided we agree' ограничивает поддержку Лейлы.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: подчёркивать, выделять
    note: '*emphasize* значит усилить какую-то часть своего сообщения.'
    example_gloss: Дэниел подчёркивает проблему с рабочей нагрузкой.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: в какой-то мере
    note: '*to some extent* часто звучит естественнее, чем везде подряд *a little*.'
    example_gloss: В какой-то мере этот порядок отвечает на опасения команды.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: в целом, в общих чертах
    note: '*broadly* выражает общую поддержку или общую истину с возможными исключениями.'
    example_gloss: Предложение в целом полезно, хотя и не идеально.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: при условии, что
    note: '*provided* вводит условие. По значению оно близко к русскому «при условии, что», но в английском часто звучит формально и деловито.'
    example_gloss: Мы можем поддержать этот порядок при условии, что мы договоримся.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Осторожность и усиление вместе
    gloss: Порядок кажется разумным, но он действительно создаёт для команды дополнительную работу.
    note: '*seems* делает положительное утверждение осторожнее; *does create* подчёркивает, что дополнительная работа и правда возникает. В русском такой нажим обычно передают словами «действительно» или «всё же»: он всё же создаёт дополнительную работу.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Сосредоточиться на одной проблеме
    gloss: Меня беспокоит дополнительная работа для команды.
    note: '*What worries me is...* выносит мысль вперёд, чтобы сфокусироваться на ней. Дальше сохраняй английский порядок слов: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Общая поддержка с условием
    gloss: В целом это полезно, при условии, что сроки будут скорректированы.
    note: '*broadly useful, provided...* выражает поддержку с чётким условием.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Нюанс и акцент
    gloss: Используй seems, broadly или to some extent, чтобы смягчить или ограничить утверждение. Используй do или does перед основным глаголом, чтобы подчеркнуть, что что-то действительно так. Используй What matters is... или What worries me is..., чтобы обратить внимание на один пункт.
    note: 'Для тебя, вероятно, самым непривычным окажется *does create*: это не «делает создаёт», а усиление глагола *create*, как русское «действительно создаёт».'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: в целом, в общем
    note: '*overall* смотрит на картину в целом, даже если есть детали или исключения.'
    example_gloss: В целом Лейла поддерживает это решение.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: условие
    note: '*condition* — это то, что должно быть выполнено, прежде чем что-то вступит в силу.'
    example_gloss: Её условие в том, что сроки нужно скорректировать.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Текст для чтения: поддержка с условиями'
    gloss: 'Отзыв Лейлы положительный, но тщательно выверенный. Она говорит, что новый порядок проверки в целом кажется разумным, этим она смягчает утверждение и не звучит категорично. Она также говорит, что он в общем полезен при условии, что сроки будут скорректированы. Это условие ограничивает её поддержку: она не принимает новый порядок точно в том виде, как он написан. Дэниел подчёркивает другое с помощью конструкции с фокусом: его беспокоит дополнительная нагрузка на команду. Оба говорящих поддерживают новый порядок в принципе, но их язык показывает разную степень готовности взять на себя обязательства.'
    note: Текст показывает, как одно и то же содержание можно сделать мягче, сильнее или более условным.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Лейла выражается осторожно
    gloss: 'Лейла говорит: Новый порядок проверки в целом кажется разумным.'
    note: '*seems reasonable overall* звучит положительнее критики, но не категорично.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Дэниел замечает осторожность
    gloss: 'Дэниел говорит: Это звучит довольно осторожно. Ты хочешь сказать, что он ещё не совсем готов?'
    note: Дэниел замечает, что Лейла не говорит просто *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Лейла уточняет дальше
    gloss: 'Лейла говорит: Именно. Это может быть работоспособно, но нужны более чёткие сроки.'
    note: '*may be workable* оставляет место для сомнения; *but* называет ограничение.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Дэниел направляет внимание на проблему
    gloss: 'Дэниел говорит: Я согласен. Меня беспокоит дополнительная работа для команды.'
    note: '*What worries me is...* направляет внимание на одну проблему.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Лейла усиливает с помощью does
    gloss: 'Лейла говорит: Справедливо. Порядок действительно создаёт более качественные проверки, но добавляет ещё один этап согласования.'
    note: '*does create* подчёркивает, что это преимущество действительно существует, несмотря на последующее ограничение.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Дэниел подводит итог условию
    gloss: 'Дэниел говорит: Значит, мы должны поддержать его с условиями?'
    note: Он подводит итог осторожной поддержке Лейлы.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Лейла выражает условную поддержку
    gloss: 'Лейла говорит: Да. Я бы сказала, что в целом это полезно, при условии, что сроки будут скорректированы.'
    note: '*provided* здесь означает «при условии, что»: поддержка действует, только если условие выполнено.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: Одно и то же содержание, три степени силы
    gloss: Порядок создаёт дополнительную работу. Порядок, похоже, создаёт дополнительную работу. Порядок действительно создаёт дополнительную работу.
    note: Эти три предложения тренируют нейтральную форму, более осторожную с *seems to* и более настойчивую с *does*.
