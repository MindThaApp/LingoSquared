  en.a1.unit67.lesson03.teach.dialogue_line1:
    title: Миа спрашивает о семье
    gloss: 'Миа говорит: Привет, Даниэль. Как поживает твоя семья?'
    note: '*How is your family?* — главный вопрос разговора.'
  en.a1.unit67.lesson03.teach.dialogue_line2:
    title: У Даниэля хорошие новости
    gloss: 'Даниэль говорит: У них всё хорошо. У меня хорошие новости.'
    note: '*They are well* означает «у них всё хорошо».'
  en.a1.unit67.lesson03.teach.dialogue_line3:
    title: Миа спрашивает о новостях
    gloss: 'Миа говорит: Что за новости?'
    note: '*What is...?* просит больше информации.'
  en.a1.unit67.lesson03.teach.dialogue_line4:
    title: У сестры родился ребёнок
    gloss: 'Даниэль говорит: У моей сестры родился ребёнок.'
    note: '*My sister has a baby* делится семейной новостью.'
  en.a1.unit67.lesson03.teach.dialogue_line5:
    title: Миа тепло реагирует
    gloss: 'Миа говорит: Это замечательно.'
    note: '*wonderful* звучит тепло и позитивно.'
  en.a1.unit67.lesson03.teach.dialogue_line6:
    title: Даниэль поедет в гости
    gloss: 'Даниэль говорит: Спасибо. Мы скоро приедем в гости.'
    note: '*soon* означает «скоро».'
  en.a1.unit67.lesson03.teach.dialogue_line7:
    title: Миа говорит, что Даниэль, должно быть, гордится
    gloss: 'Миа говорит: Ты, наверное, очень гордишься.'
    note: '*must be* говорит о том, что, скорее всего, правда.'
  en.a1.unit67.lesson03.teach.dialogue_line8:
    title: Даниэль гордится
    gloss: 'Даниэль говорит: Я горжусь ею.'
    note: '*of her* относится к его сестре.'
  en.a1.unit67.lesson04.teach.family_note:
    title: Семейная записка
    gloss: 'Семейная записка: Хорошие новости. У моей сестры родился ребёнок. Мы скоро приедем в гости.'
    note: В записке коротко сообщается о хороших новостях и о визите.
  en.a1.unit67.lesson04.teach.reading_passage:
    title: 'Текст: хорошие семейные новости'
    gloss: 'Хорошие семейные новости: Миа спросила Даниэля о его семье. Даниэль сказал, что у них всё хорошо. Потом он поделился хорошей новостью: у его сестры родился ребёнок. Миа сказала, что это замечательная новость. Даниэль сказал, что он с семьёй скоро приедет в гости. Он гордился своей сестрой. Позже Миа отправила короткое сообщение: Я рада за твою семью.'
    note: '*shared good news* означает «поделился хорошими новостями».'
