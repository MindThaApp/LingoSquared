  en.a1.unit01.lesson05.noun_phrases_and_closings:
    title: Дружеское прощание
teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: Привет
    note: '*Hello* — нейтральное универсальное приветствие, уместное почти в любой ситуации.'
    example_gloss: Привет, Дэниел!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: Привет (неформально)
    note: '*Hi* звучит более непринуждённо, чем *Hello*; так здороваются между друзьями.'
    example_gloss: Привет, Лейла!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: Доброе утро
    note: '*Good morning* говорят утром.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: Добрый день
    note: '*Good afternoon* говорят после полудня. В английском нет одного выражения, которое подходило бы на весь день, как русское «здравствуйте».'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: Добрый вечер
    note: '*Good evening* говорят вечером.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: До свидания
    note: '*Goodbye* — нейтральное универсальное прощание.'
    example_gloss: До свидания, до завтра!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: Пока
    note: '*Bye* звучит непринуждённее, чем *Goodbye*, как русское «пока».'
    example_gloss: Пока, до скорого!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: Как дела? / Как поживаете?
    note: '*How are you?* подходит и для формального, и для неформального общения: в английском нет разницы между «ты» и «вы».'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: У меня всё хорошо, спасибо.
    note: Простой нейтральный ответ.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: У меня всё хорошо, спасибо.
    note: Значит то же, что и *I'm fine, thanks*; в повседневной речи оба варианта одинаково распространены.
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: Неплохо, спасибо.
    note: 'Непринуждённый, слегка сдержанный ответ: ни особенно хорошо, ни плохо.'
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: А у тебя? / А у вас?
    note: Так возвращают вопрос собеседнику; подходит в любой ситуации, различать «ты» и «вы» не нужно.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: Ты в порядке?
    note: '*Are you okay?* скорее спрашивают, не случилось ли что-то у собеседника, чем просто здороваются, как в случае с *How are you?*'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Приятно познакомиться.
    note: Так говорят при первой встрече.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: Мне тоже приятно.
    note: Подходящий ответ на *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: До встречи. / Увидимся позже.
    note: Так говорят, когда человека увидят снова в тот же день, как русское «до скорого».
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: Хорошего дня.
    note: 'Дружеское прощание: пожелание, чтобы остаток дня прошёл хорошо.'
