    title: Are you free at 6pm?
    gloss: Ты свободен в шесть вечера?
    note: '*at 6pm* указывает точное время.'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: Текстовое сообщение
    gloss: Привет, Лейла, ты свободна в шесть вечера? Давай встретимся в кафе.
    note: В короткой записке вопрос о времени сочетается с конкретным предложением.
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: Это сообщение предлагает время и место для встречи.
    note: '*to suggest* означает «предлагать» — это цель сообщения.'
  en.a1.unit14.lesson04.teach.how_about:
    title: How about 6pm at the cafe?
