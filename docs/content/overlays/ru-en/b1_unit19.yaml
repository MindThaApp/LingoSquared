teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: главный пункт, суть
    note: '*main point* значит самую важную мысль в тексте или разговоре.'
    example_gloss: Главным пунктом встречи был бюджет.
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: деталь
    note: '*detail* значит небольшую дополнительную информацию, которая поддерживает главный пункт.'
    example_gloss: Миа добавила одну небольшую деталь о расписании.
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: в итоге, подводя итог
    note: '*in summary* вводит краткое резюме в конце длинного объяснения.'
    example_gloss: В итоге проект закончится в следующем месяце.
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: вкратце
    note: '*in short* — быстрый, неформальный способ перейти к сути в разговоре.'
    example_gloss: 'Вкратце: команда согласилась с планом.'
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: своими словами
    note: '*in your own words* просит объяснить так, чтобы не повторять исходный текст.'
    example_gloss: Объясни план своими словами.
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ... (подвести итог)
    gloss: В итоге на встрече обсуждали бюджет и нового клиента.
    note: '*In summary, the meeting covered...* начинает краткое резюме того, что обсуждалось.'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ... (назвать главное)
    gloss: Главным было то, что в этом месяце мы укладываемся в бюджет.
    note: '*The main point was that...* называет самую важную мысль отдельно от мелких деталей.'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: Структура резюме
    gloss: Начинайте резюме с таких выражений, как In summary или In short, затем называйте только главные пункты по порядку, коротким предложением. Используйте The main point was that..., чтобы выделить единственную самую важную мысль отдельно от мелких деталей.
    note: 'Форма: начинайте с In summary/In short и используйте The main point was that... для главного пункта.'
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: сжатый, краткий
    note: '*condensed* описывает резюме, которое сделали короче, но сохранили главные пункты.'
    example_gloss: Миа дала Дэниелу краткое резюме встречи.
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: исходная статья, оригинал статьи
    note: '*original article* значит полный исходный текст до того, как его сократили.'
    example_gloss: Резюме Лейлы близко совпадало с исходной статьёй.
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Текст: краткий пересказ статьи'
    gloss: 'Лейла прочитала для своего курса дизайна длинную статью о коммуникации на рабочем месте. В исходной статье было много примеров и справочной информации, но Лейле были нужны только главные пункты. Своими словами она написала сжатое резюме: коммуникация на работе работает лучше всего, когда сообщения ясные и короткие и когда люди задают вопросы, а не гадают. Большинство примеров она убрала, потому что это были детали, а не главные пункты. Её преподаватель сказал, что резюме сохранило важные мысли в правильном порядке.'
    note: Короткий текст для чтения.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Даниэль просит объяснить
    gloss: 'Дэниел говорит: Я пропустил встречу. Можешь рассказать, что там было?'
    note: Открытый вопрос, чтобы попросить резюме.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Миа кратко подводит итог
    gloss: 'Миа говорит: Конечно. Вкратце: мы говорили о бюджете и о новом клиенте.'
    note: '*in short* начинает быстрое неформальное резюме.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Даниэль спрашивает о главном
    gloss: 'Дэниел говорит: Что было главным по бюджету?'
    note: Конкретный вопрос о главном пункте.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Миа называет главное
    gloss: 'Миа говорит: Главным было то, что в этом месяце мы укладываемся в бюджет.'
    note: '*the main point was that...* выделяет самую важную мысль.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Даниэль спрашивает о подробностях
    gloss: 'Дэниел говорит: Хорошо. Были ещё какие-то детали?'
    note: Уточняющий вопрос о второстепенных деталях.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Миа называет небольшую деталь
    gloss: 'Миа говорит: Только одна небольшая деталь: встречу с клиентом перенесли на следующую неделю.'
    note: '*just one small detail* вводит небольшой дополнительный факт.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: Даниэль благодарит Мию
    gloss: 'Дэниел говорит: Спасибо за резюме. Это очень полезно.'
    note: Короткое признательное завершение разговора.
