    gloss: время года
    note: '*season* значит «время года».'
    example_gloss: Какое у тебя любимое время года?
  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: летом
    note: '*in the summer* значит «летом». В русском артиклей нет, а в английском перед названием времени года артикль *the* часто можно опустить: и *in summer*, и *in the summer* правильно (так же *in spring*, *in fall*, *in winter*).'
    example_gloss: Летом мы ходим на пляж.
  en.a1.unit44.lesson02.teach.leaves_change_color:
    title: the leaves change color
    gloss: листья меняют цвет
    note: '*the leaves change color* значит «листья меняют цвет».'
    example_gloss: Осенью листья меняют цвет.
  en.a1.unit44.lesson02.teach.it_snows_a_lot:
    title: it snows a lot
    gloss: часто идёт снег
    note: '*it snows a lot* значит «часто идёт снег», «снега много».'
    example_gloss: Зимой часто идёт снег.
  en.a1.unit44.lesson02.teach.flowers_bloom:
    title: flowers bloom
    gloss: цветы распускаются
    note: '*flowers bloom* значит «цветы распускаются».'
    example_gloss: Весной цветут цветы.
  en.a1.unit44.lesson02.teach.whats_your_favorite_season:
    title: What's your favorite season?
    gloss: Какое у тебя любимое время года?
    note: '*What''s your favorite season?* спрашивает о любимом времени года.'
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: Моё любимое время года — осень.
    note: '*My favorite season is ...* — привычный способ назвать то, что тебе нравится больше всего.'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: Вопрос Мии
    gloss: 'Миа спрашивает: Какое у тебя любимое время года, Лейла?'
    note: '*What''s your favorite ...?* спрашивает о предпочтении.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Осень. Листья меняют цвет, и погода отличная, чтобы рисовать на улице.'
    note: '*great weather for painting outside* значит «отличная погода, чтобы рисовать на улице».'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: Реакция Мии
    gloss: 'Миа говорит: Звучит здорово. Моё любимое время года — весна.'
    note: '*My favorite season is spring* значит «моё любимое время года — весна».'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: Вопрос Лейлы
    gloss: 'Лейла спрашивает: Почему весна?'
    note: '*Why spring?* — короткий способ спросить о причине.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Цветы распускаются, и я люблю их фотографировать для курса по фотографии.'
    note: '*I love taking photos* значит «я люблю фотографировать».'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: Вопрос Лейлы
    gloss: 'Лейла говорит: Понятно! А там, где ты живёшь, весна тёплая или холодная?'
    note: '*That makes sense!* — естественная реакция на хорошее объяснение.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Обычно тёплая, с небольшим дождём. Отлично подходит для прогулок на улице.'
    note: '*with a little rain* значит «с небольшим дождём».'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Текст о трёх любимых временах года
    gloss: У Даниэля, Лейлы и Мии разные любимые времена года. Любимое время года Даниэля — лето. Он любит играть в футбол и бегать, когда погода тёплая и солнечная. Любимое время года Лейлы — осень, потому что она любит рисовать листья, пока они меняют цвет. Любимое время года Мии — весна. Она фотографирует цветы для своего курса по фотографии. Хотя им нравятся разные времена года, они всегда находят время вместе насладиться природой.
    note: '*even though* значит «хотя», «несмотря на то что».'
