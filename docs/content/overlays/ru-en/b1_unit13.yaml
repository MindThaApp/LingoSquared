teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: который (о людях)
    note: '*who* в придаточном относится к человеку.'
    example_gloss: Дэниел, который пришёл в команду в марте, уже руководит двумя проектами.
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: который (о вещах)
    note: '*which* в придаточном относится к предмету.'
    example_gloss: Курс дизайна, который выбрала Лейла, начинается в июне.
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: который (определительное)
    note: '*that* в определительном придаточном относится к человеку или предмету.'
    example_gloss: Клиент, который звонил сегодня утром, хочет встречи.
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: чей; которого
    note: '*whose* в придаточном указывает на принадлежность.'
    example_gloss: Клиент, чей проект они сейчас заканчивают, уже одобрил дизайн.
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: где
    note: '*where* в придаточном относится к месту.'
    example_gloss: Офис, в котором работает Дэниел, находится в центре города.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: коллега
    note: '*coworker* значит человека, с которым вы работаете.'
    example_gloss: У Мии есть коллега, которая по вечерам изучает испанский.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who im bestimmenden Relativsatz
    gloss: Коллега, которая сидит рядом с Мией, очень организованна.
    note: '*who* здесь вводит информацию, которая нужна, чтобы понять, о ком идёт речь.'
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who im nicht bestimmenden Relativsatz
    gloss: Дэниел, который пришёл в команду в марте, уже руководит двумя проектами.
    note: Запятые показывают, что придаточное даёт дополнительную информацию, не нужную для того, чтобы понять, о ком речь.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: Bestimmende und nicht bestimmende Relativsätze
    gloss: 'Используйте определительное придаточное без запятых, чтобы точно сказать, кого или что вы имеете в виду: The colleague who sits next to Mia is organized. Используйте неопределительное придаточное с запятыми, чтобы добавить дополнительную информацию о том, кто уже известен: Daniel, who joined in March, already leads two projects. Внимание: в русском придаточное предложение всегда выделяется запятыми, а в английском запятыми выделяется только неопределительное.'
    note: 'Форма: определительное = без запятых, говорит, кто или что имеется в виду; неопределительное = запятые, добавляет дополнительную информацию.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: крайний срок
    note: '*deadline* значит дату или время, к которым что-то должно быть закончено.'
    example_gloss: Коллега, которая сидит рядом с Мией, всегда укладывается в сроки.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: одобрить
    note: '*approve* значит официально принять что-то.'
    example_gloss: Клиент уже одобрил первый вариант дизайна.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue Büro'
    gloss: Миа работает с несколькими людьми, которые облегчают ей работу. Дэниел, который пришёл в команду в марте, уже руководит двумя проектами. Коллега, которая сидит рядом с Мией, очень организованна и всегда укладывается в сроки. В их офисе, который находится на пятом этаже, есть небольшая кухня, где все вместе обедают. Клиент, чей проект они сейчас заканчивают, уже одобрил первый вариант дизайна.
    note: Короткий текст с определительными и неопределительными придаточными.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia stellt die neue Kollegin vor
    gloss: 'Миа говорит: Лейла, ты уже познакомилась с женщиной, которая только что пришла в нашу команду?'
    note: '*who* здесь относится к *the woman*.'
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila fragt nach dem Platz der neuen Kollegin
    gloss: 'Лейла говорит: Ещё нет. Это та, чей стол стоит у окна?'
    note: '*whose* указывает на принадлежность: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia beschreibt die neue Kollegin
    gloss: 'Миа говорит: Да, это она. Она дизайнер, которая закончила проект логотипа.'
    note: '*who* относится к *the designer*.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila erinnert sich an das Projekt
    gloss: 'Лейла говорит: А, помню. Это тот проект, который выиграл награду в прошлом месяце?'
    note: '*which* относится к *the project*.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia erzählt von ihrem früheren Büro
    gloss: 'Миа говорит: Именно. Офис, в котором она раньше работала, был намного меньше нашего.'
    note: '*where* относится к месту: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila versteht, warum sie die Küche mag
    gloss: 'Лейла говорит: Это объясняет, почему ей так нравится кухня, где все вместе обедают.'
    note: '*where* относится к *the kitchen*.'
