    example_gloss: Это мой читательский билет.
  en.a1.unit48.lesson02.teach.do_you_have_a_library_card:
    title: Do you have a library card?
    gloss: У тебя есть читательский билет?
    note: '*Do you have a library card?* значит «у тебя есть читательский билет?».'
  en.a1.unit48.lesson02.teach.yes_heres_my_library_card:
    title: Yes, here's my library card.
    gloss: Да, вот мой читательский билет.
    note: '*here''s* — сокращение от *here is*.'
  en.a1.unit48.lesson02.teach.id_like_to_borrow_this_book:
    title: I'd like to borrow this book.
    gloss: Я хотел бы взять эту книгу домой.
    note: '*I''d like to...* значит «я хотел бы ...» — та же вежливая форма, что в предыдущем уроке.'
  en.a1.unit48.lesson02.teach.when_is_this_book_due:
    title: When is this book due?
    gloss: К какому сроку нужно вернуть эту книгу?
    note: 'Снова слово *due*: у него нет одного слова-соответствия в русском, обычно говорят «срок возврата».'
  en.a1.unit48.lesson02.teach.can_i_return_this_book:
    title: Can I return this book?
    gloss: Можно сдать эту книгу?
    note: '*Can I return this book?* значит «можно сдать эту книгу?».'
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday:
    title: Your book is due on Friday.
    gloss: Вашу книгу нужно вернуть в пятницу.
    note: В *due on Friday* перед днём недели стоит *on*.
  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: Предложение Лейлы
    gloss: 'Лейла говорит: Мне нужно вернуть эту книгу в библиотеку. Хочешь пойти со мной?'
    note: '*Do you want to come with me?* значит «хочешь пойти со мной?».'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: Ответ Даниэля
    gloss: 'Даниэль говорит: Конечно! Кажется, я никогда раньше не брал книги в библиотеке.'
    note: 'В *I don''t think I''ve ever ...* используется Present Perfect (*have ever*) для жизненного опыта; по-русски здесь обычное прошедшее время: «я никогда не брал».'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Лейла у стойки
    gloss: 'Лейла говорит: Здравствуйте, я хотела бы сдать эту книгу и ещё взять новую.'
    note: '*and I''d like to ... too* значит «и я ещё хотела бы ...».'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: Вопрос библиотекаря
    gloss: 'Библиотекарь говорит: Отлично, спасибо. У вас с собой читательский билет?'
    note: '*Do you have your library card?* значит «у вас с собой читательский билет?».'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: Да, вот он.'
    note: '*here it is* значит «вот он (она, оно)».'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: Объяснение библиотекаря
    gloss: 'Библиотекарь говорит: Отлично. Эту новую книгу нужно вернуть через три недели.'
    note: '*due back in three weeks* значит «нужно вернуть через три недели».'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Даниэль тоже хочет взять книгу
    gloss: 'Даниэль говорит: Можно и мне получить читательский билет? Я хотел бы взять книгу рецептов.'
    note: '*Can I get ... too?* значит «можно и мне получить ...?».'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: Библиотекарь помогает Даниэлю
    gloss: 'Библиотекарь говорит: Конечно! Просто заполните эту анкету.'
    note: '*fill out this form* значит «заполнить эту анкету». Слово *out* — часть глагола, его нельзя пропускать, а по-русски это один глагол: «заполнить».'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Текст о том, как работает библиотека
    gloss: 'Поход в библиотеку: в большинстве библиотек можно брать книги, а иногда и другие вещи, на несколько недель. Чтобы что-то взять, обычно нужен читательский билет. Когда вы берёте книгу, библиотекарь назовёт срок возврата, то есть день, когда её нужно вернуть. Если к этому времени вы не закончили, часто можно попросить у библиотекаря больше времени. С тех пор как Лейла переехала в новую квартиру, у неё стало меньше книг, чем раньше, и она начала брать их в библиотеке. На прошлой неделе она вернула одну книгу и взяла новую, а её друг Даниэль пошёл с ней. Он никогда раньше не брал библиотечных книг, поэтому завёл свой читательский билет и взял книгу рецептов, чтобы практиковаться в рецептах, которым его учит Миа. Библиотекарь напомнила им обоим вернуть книги до срока. Миа нечасто бывает в библиотеке, но однажды брала книгу по фотографии для своих занятий.'
    note: '*checked out a cookbook* значит «взял книгу рецептов»: *check out* — устойчивое выражение для того, чтобы взять книгу в библиотеке.'
