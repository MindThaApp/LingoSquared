  en.a1.unit40.lesson02.teach.send_a_letter:
    title: send a letter
    gloss: отправить письмо
    note: '*send a letter* значит «отправить письмо».'
    example_gloss: Я хочу отправить письмо родителям.
  en.a1.unit40.lesson02.teach.buy_a_stamp:
    title: buy a stamp
    gloss: купить марку
    note: '*buy a stamp* значит «купить марку».'
    example_gloss: Мне нужно купить марку для этой открытки.
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: написать адрес
    note: '*write the address* значит «написать адрес».'
    example_gloss: Пожалуйста, напишите адрес на посылке.
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: сколько это займёт времени
    note: '*how long will it take* значит «сколько времени это займёт».'
    example_gloss: Сколько времени она будет идти?
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: срочная почта / экспресс-доставка
    note: '*express mail* значит «срочная почта»: более быстрая и более дорогая отправка.'
    example_gloss: Срочная почта быстрее обычной.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: Сколько стоит отправить это?
    note: '*How much does it cost to ...?* спрашивает о цене какого-то действия.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: Просьба Даниэля
    gloss: 'Даниэль говорит: Здравствуйте, я бы хотел отправить эту посылку, пожалуйста.'
    note: '*I''d like to* + глагол — вежливый способ о чём-то попросить. Это намного вежливее, чем *I want*, которое у окошка звучит довольно грубо.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: Спрашивает сотрудница
    gloss: 'Сотрудница говорит: Конечно! Куда она едет?'
    note: '*Where is it going?* спрашивает о пункте назначения.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: В Чикаго. Это подарок на день рождения для моей сестры.'
    note: '*It''s a birthday gift for my sister* значит «это подарок на день рождения для моей сестры».'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: Спрашивает сотрудница
    gloss: 'Сотрудница говорит: Вам обычной почтой или срочной? Срочная идёт около двух дней.'
    note: '*regular or express mail* значит «обычная или срочная почта».'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: Выбор Даниэля
    gloss: 'Даниэль говорит: Давайте срочную, пожалуйста. Сколько это стоит?'
    note: '*I''ll take ...* — естественный способ сделать выбор в магазине или на почте.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: Отвечает сотрудница
    gloss: 'Сотрудница говорит: Это двенадцать долларов. Вот ваш чек.'
    note: '*Here''s your receipt* значит «вот ваш чек».'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Благодарность Даниэля
    gloss: 'Даниэль говорит: Спасибо! Хорошего дня.'
    note: '*Have a good day* — вежливое прощание.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Текст о трёх походах на почту
    gloss: Даниэль, Лейла и Миа хорошо знают, как всё устроено на почте. На прошлой неделе Даниэль отправил посылку на день рождения сестре в Чикаго. Он заплатил за срочную доставку, потому что хотел, чтобы посылка пришла быстро, и она шла всего два дня. Лейла собирается переезжать поближе к Мие, поэтому пошла на почту отправить родителям несколько старых книг. Сотрудница взвесила посылку и дала ей марку. Лейла спросила, сколько времени будет идти посылка, и сотрудница ответила, что около недели, раз уж она выбрала обычную почту. Миа редко отправляет посылки, но всегда покупает марку для писем, которые пишет бабушке. Она говорит, что письмо с маркой кажется более личным, чем сообщение в телефоне.
    note: '*getting ready to move* значит «собираться переезжать».'
