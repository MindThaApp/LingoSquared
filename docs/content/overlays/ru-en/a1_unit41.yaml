  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: Приглашение Мии
    gloss: 'Миа спрашивает: Сегодня вечером я готовлю пасту. Хочешь помочь мне приготовить?'
    note: '*Do you want to help me* + глагол*?* — естественный способ позвать кого-то помочь.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: Ответ Даниэля
    gloss: 'Даниэль говорит: Конечно! Только я не очень хороший повар.'
    note: '*though* в конце предложения выражает лёгкое противопоставление, примерно как «правда» или «вот только» по-русски.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: Поддержка Мии
    gloss: 'Миа говорит: Ничего страшного, я покажу. Можешь нарезать этот лук?'
    note: '*I''ll show you* значит «я тебе покажу».'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: Вопрос Даниэля
    gloss: 'Даниэль говорит: Не проблема. Насколько мелко его нарезать?'
    note: '*should* здесь просит совета.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: Объяснение Мии
    gloss: 'Миа говорит: Мелкими кусочками, вот так. Теперь давай сварим макароны.'
    note: '*like this* значит «вот так», «таким образом».'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: Ответ Даниэля
    gloss: 'Даниэль говорит: Можно попробовать соус? Очень вкусно!'
    note: '*Can I* + глагол*?* просит разрешения.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: Завершение Мии
    gloss: 'Миа говорит: Отлично! Ужин почти готов.'
    note: '*almost ready* значит «почти готов».'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Текст о совместной готовке
    gloss: Даниэль, Лейла и Миа готовят по-разному. С тех пор как Лейла переехала в новую квартиру рядом с Мией, трое друзей часто готовят ужин вместе. Лейла хорошо готовит. Она часто делает пасту по старому рецепту своей мамы. Миа тоже любит готовить, и она научила Даниэля нарезать лук, не порезав пальцы. Даниэль пока не очень хороший повар, но быстро учится. Вчера вечером Миа попросила Даниэля помочь ей приготовить пасту. Он нарезал лук, пока Миа варила макароны и готовила соус. Даниэль попробовал соус и сказал, что он очень вкусный. Лейла пришла как раз тогда, когда ужин был готов, и все трое поели вместе на кухне у Мии.
    note: '*arrived just as dinner was ready* значит «пришла как раз тогда, когда ужин был готов».'
