    title: Если это случится, мы сделаем вот что
lessons:
  en.b1.unit07.lesson01.condition_vocabulary:
    title: If, unless, condition и result
  en.b1.unit07.lesson02.real_conditions:
    title: If it starts late, I will send a message
  en.b1.unit07.lesson03.reading_a_meeting_plan:
    title: 'Читаем: запасной план'
  en.b1.unit07.lesson04.the_meeting_plan_dialogue:
    title: If the room is busy, we will meet online
teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: если
    note: '*if* вводит возможное условие.'
    example_gloss: Если автобус опоздает, я тебе позвоню.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: если не; разве что
    note: '*unless* значит примерно то же, что *if not*: что-то происходит, кроме случая, когда условие всё же выполняется.'
    example_gloss: Если план не изменится, мы встретимся в десять.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: условие
    note: '*condition* значит ситуацию, которая должна возникнуть сначала.'
    example_gloss: 'Условие понятно: мы начинаем, если все пришли.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: результат, следствие
    note: '*result* значит то, что происходит из-за условия.'
    example_gloss: В результате мы встречаемся онлайн.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: задержка
    note: '*delay* значит, что что-то происходит позже, чем планировалось.'
    example_gloss: Задержка может привести к тому, что все опоздают.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: перенести на другое время
    note: '*reschedule* значит выбрать новое время для встречи или приёма.'
    example_gloss: Если у врача много дел, мы перенесём приём.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Eine reale Bedingung mit Ergebnis
    gloss: Если встреча начнётся поздно, я всем отправлю сообщение.
    note: 'При реальном условии в будущем после *if* стоит настоящее время: *If the meeting starts late*, а не *will start*.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Eine verneinte Bedingung
    gloss: Если отчёт не будет готов, мы перенесём проверку.
    note: '*if ... not* делает условие отрицательным.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Reale Bedingungen in der Zukunft
    gloss: Если начнётся поздно, я отправлю сообщение. Если отчёт не будет готов, мы перенесём проверку.
    note: После *if* стоит настоящее время, а в результате часто стоит *will*.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: запасной план, план Б
    note: '*backup plan* значит дополнительный план на случай, если первый не сработает.'
    example_gloss: Нам нужен запасной план, если комната будет занята.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: перенести обновление
    note: '*move the update* значит обсудить обновление в другое время.'
    example_gloss: Если Лейла опоздает, мы перенесём её обновление на завтра.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Lesetext: der Ersatzplan'
    gloss: Дэниел пишет запасной план для встречи команды. Если конференц-зал свободен, команда соберётся там в десять. Если зал занят, они встретятся онлайн. Если Лейла не подключится к десяти, Дэниел перенесёт её обновление на завтра. Если отчёт не будет готов, Миа вместо этого отправит более короткое обновление.
    note: Короткий текст с реальными условиями, результатами и *unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia fragt nach dem Plan
    gloss: 'Миа говорит: Дэниел, что нам делать, если встреча начнётся поздно?'
    note: Вопрос о результате возможного условия.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel nennt das Ergebnis
    gloss: 'Дэниел говорит: Если начнётся поздно, я всем отправлю сообщение.'
    note: '*If it starts late, I will...* связывает реальную возможность с конкретным действием.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia fragt nach Leila
    gloss: 'Миа говорит: А если Лейла не сможет подключиться?'
    note: Короткий уточняющий вопрос с той же структурой условия.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel verwendet 'unless'
    gloss: 'Дэниел говорит: Если она не подключится к десяти, мы перенесём её обновление на завтра.'
    note: '*unless she joins by ten* значит: если она не подключится до десяти.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia fragt nach dem Raum
    gloss: 'Миа говорит: Звучит справедливо. А если комната всё ещё будет занята, мы встретимся онлайн?'
    note: Миа проверяет запасной план на случай, если комната занята.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel bestätigt den Online-Plan
    gloss: 'Дэниел говорит: Да, если комната занята, мы вместо этого встретимся онлайн.'
    note: '*instead* значит, что этот план заменяет другой.'
