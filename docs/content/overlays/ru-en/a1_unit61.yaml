  en.a1.unit61.lesson01.teach.excuse:
    title: excuse
    gloss: оправдание, причина
    note: '*excuse* — причина, которую называют, объясняя проблему.'
    example_gloss: Вот моё оправдание.
  en.a1.unit61.lesson01.teach.traffic:
    title: traffic
    gloss: дорожное движение, пробки
    note: '*traffic* означает движение транспорта на дороге.'
    example_gloss: На дороге пробки.
  en.a1.unit61.lesson01.teach.mistake:
    title: mistake
    gloss: ошибка
    note: '*mistake* означает «ошибка».'
    example_gloss: Я допустил ошибку.
  en.a1.unit61.lesson01.teach.problem:
    title: problem
    gloss: проблема
    note: '*problem* означает «проблема».'
    example_gloss: Не проблема.
  en.a1.unit61.lesson02.teach.im_sorry:
    title: I'm sorry.
    gloss: Мне жаль.
    note: '*I''m sorry* — стандартная фраза, чтобы извиниться.'
  en.a1.unit61.lesson02.teach.im_late:
    title: I'm late.
    gloss: Я опаздываю.
    note: '*late* здесь означает «с опозданием», а не «поздно вечером».'
  en.a1.unit61.lesson02.teach.bus_is_late:
    title: The bus is late.
    gloss: Автобус опаздывает.
    note: 'И про человека, и про автобус английский говорит одинаково: *is late*; в русском для этого есть глагол «опаздывать».'
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: Ничего страшного.
    note: '*That''s okay* — дружелюбный способ принять извинение.'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: Не проблема.
    note: '*No problem* — короткий неформальный ответ на извинение или благодарность.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: Я допустил ошибку.
    note: Английский говорит *make a mistake* (буквально «сделать ошибку»), а не *do a mistake*.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Даниэль извиняется"
    gloss: 'Даниэль говорит: Привет, Миа. Прости, что я опоздал.'
    note: '*I''m sorry I''m late* соединяет извинение и его причину.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Миа принимает извинение
    gloss: 'Миа говорит: Ничего страшного.'
    note: '*That''s okay* — просто и дружелюбно.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: Автобус опаздывает
    gloss: 'Даниэль говорит: Автобус опаздывает.'
    note: Эта фраза называет причину.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Миа говорит, что можно подождать
    gloss: 'Миа говорит: Без проблем. Мы можем подождать.'
    note: '*We can wait* означает, что ждать можно.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Даниэль ошибся со временем
    gloss: 'Даниэль говорит: Я ошибся со временем.'
    note: '*with the time* означает «со временем» или «в том, что касается времени».'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: Урок начинается в три часа
    gloss: 'Миа говорит: Ничего. Урок начинается в три часа.'
    note: '*at three* — перед временем по часам нужен предлог *at*.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Даниэль благодарит Мию
    gloss: 'Даниэль говорит: Спасибо, что подождала.'
    note: 'После *Thank you for* глагол принимает форму на *-ing*: *waiting*.'
  en.a1.unit61.lesson04.teach.class_note:
    title: Записка об уроке
    gloss: 'Записка об уроке: Урок начинается в 3:00. Пожалуйста, приходи вовремя. Если опаздываешь, отправь сообщение.'
    note: В записке сказано, что делать, если ты опаздываешь.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Текст: извинение перед уроком'
    gloss: 'Извинение перед уроком: Даниэль опоздал на урок, потому что автобус опаздывал. Он встретил Мию у класса. Даниэль сказал, что ему жаль. Ещё он сказал, что ошибся со временем. Миа сказала, что всё в порядке. Урок был в 3:00. Даниэль отправил учителю короткое сообщение. В нём было написано: «Прошу прощения, что опаздываю. Автобус опаздывает.»'
    note: '*because* называет причину: потому что автобус опаздывал.'
