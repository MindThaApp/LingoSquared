teaching:
  en.a1.unit61.lesson01.teach.sorry:
    title: sorry
    gloss: извини, мне жаль
    note: '*sorry* — обычное слово, которым просят прощения.'
    example_gloss: Мне жаль.
  en.a1.unit61.lesson01.teach.late:
    title: late
    gloss: опоздавший, поздно
    note: '*late* означает «не вовремя», с опозданием.'
