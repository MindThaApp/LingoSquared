teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: просыпаться
    note: '*wake up* значит «просыпаться». Это глагол с частицей, и пишутся они раздельно.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: одеваться
    note: '*get dressed* значит «одеваться». Возвратного «-ся» здесь нет: нельзя сказать *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: идти на работу
    note: '*go to work* значит «идти на работу». В этом устойчивом выражении перед *work* нет артикля.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: ужинать
    note: '*have dinner* значит «ужинать». Названия приёмов пищи идут без артикля: *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: ложиться спать
    note: '*go to bed* значит «ложиться спать». Здесь тоже нет артикля перед *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: Во сколько ты просыпаешься?
    note: 'Вопросом *What time do you wake up?* ты спрашиваешь, когда человек встаёт. В вопросе нужен вспомогательный глагол *do*: нельзя сказать *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Я просыпаюсь в семь каждый день.
    note: '*every day* используют для ежедневной привычки. Это слово стоит в конце или в начале предложения.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Я одеваюсь утром.
    note: '*in the morning* называет часть суток, а не точное время. Русское «утром» передаётся как *in the morning*.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: Обычно я ложусь спать в одиннадцать.
    note: '*usually* значит «обычно»; так описывают привычку, которая не всегда одинакова. Следи за порядком слов: в английском *usually* стоит перед смысловым глаголом (*I usually go*). В русском «обычно» можно переставлять свободно, а здесь нельзя: *I go usually to bed* — ошибка.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: потом, затем
    note: '*then* значит «потом» или «затем»; оно показывает порядок событий.'
    example_gloss: Я завтракаю, а потом иду на работу.
  en.a1.unit16.lesson03.teach.routine_text:
    title: Текст о распорядке дня
    gloss: Каждый день я просыпаюсь в семь. Потом я одеваюсь и завтракаю.
    note: Это короткое описание утреннего распорядка.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: Что ты делаешь после этого?
    note: Вопросом *What do you do after that?* ты спрашиваешь, что человек делает дальше в течение дня.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: Спрашиваем о времени пробуждения
    gloss: 'Лейла спрашивает: Во сколько ты просыпаешься?'
    note: Тот же вопрос, что и раньше.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: Ответ о пробуждении
    gloss: 'Дэниел говорит: Я просыпаюсь в семь каждый день.'
    note: Полный ответ называет и время, и ежедневное повторение.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: Спрашиваем, что дальше
    gloss: 'Лейла спрашивает: Что ты делаешь после этого?'
    note: Этот вопрос — естественное продолжение разговора о распорядке дня.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: Описываем весь распорядок дня
    gloss: 'Дэниел говорит: Я одеваюсь, завтракаю и иду на работу. Обычно я ложусь спать в одиннадцать.'
    note: Дэниел называет несколько дел подряд, в правильном порядке.
