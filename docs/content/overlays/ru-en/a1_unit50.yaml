    gloss: Завтрак включён.
    note: '*Breakfast is included.* значит «завтрак включён».'
  en.a1.unit50.lesson02.teach.heres_your_key:
    title: Here's your key.
    gloss: Вот ваш ключ.
    note: '*Here''s* — сокращение от *here is*.'
  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Миа у стойки регистрации
    gloss: 'Миа говорит: Здравствуйте, у нас бронь на две ночи.'
    note: '*we have a reservation* значит «у нас есть бронь».'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: Администратор встречает гостей
    gloss: 'Администратор говорит: Добро пожаловать! На какое имя оформлена бронь?'
    note: '*What''s the name on the reservation?* значит «на какое имя оформлена бронь?».'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Ответ: Лейла"
    gloss: 'Лейла говорит: На моё имя, Лейла.'
    note: 'По-английски говорят *it''s under my name* («оно под моим именем»), а по-русски бронь оформлена «на моё имя». Предлог другой: нужно запомнить *under*.'
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: Администратор даёт ключ
    gloss: 'Администратор говорит: Отлично. Вот ваш ключ. В вашем номере две кровати.'
    note: '*Your room has two beds.* значит «в вашем номере две кровати».'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: Вопрос Мии про вай-фай
    gloss: 'Миа спрашивает: В номере есть вай-фай?'
    note: Повторение вопроса, изученного раньше.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: Администратор о завтраке
    gloss: 'Администратор говорит: Да, а завтрак внизу, с семи до десяти.'
    note: '*from seven to ten* значит «с семи до десяти».'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: Вопрос Лейлы о выезде
    gloss: 'Лейла говорит: Спасибо! Во сколько выезд?'
    note: Повторение вопроса *What time is check-out?*, изученного раньше.
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: Администратор о выезде
    gloss: 'Администратор говорит: Выезд в одиннадцать часов.'
    note: '*Check-out is at eleven o''clock.* значит «выезд в одиннадцать часов».'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Текст о выходных в гостевом доме
    gloss: 'Выходные в гостевом доме: Миа и Лейла съездили на выходные в горы. Миа любит фотографировать, а Лейла любит рисовать красками, так что это было идеальное место для отдыха. Когда они приехали в гостевой дом, они сказали администратору, что у них бронь на две ночи, с 14 по 16 ноября. Администратор спросил, на какое имя оформлена бронь, и Лейла ответила, что она оформлена на неё. В их номере были две кровати и вай-фай, а завтрак каждое утро был включён с семи до десяти. Выезд был в одиннадцать часов. Миа сделала много фотографий гор, а Лейла нарисовала небольшую картину с видом из их окна. Даниэль остался дома на эти выходные и готовил ужин для себя по рецепту из книги, которую взял в библиотеке. Когда Миа и Лейла вернулись, они показали ему свои фотографии и картину, и они ему очень понравились.'
    note: '*Their room had two beds and wifi* значит «в их номере были две кровати и вай-фай».'
