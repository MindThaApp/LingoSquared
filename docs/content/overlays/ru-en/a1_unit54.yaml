teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: прачечная самообслуживания
    note: '*laundromat* значит «прачечная самообслуживания» — место со стиральными машинами, где можно постирать за плату.'
    example_gloss: Сегодня я иду в прачечную.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: стиральная машина
    note: '*washing machine* значит «стиральная машина».'
    example_gloss: Стиральная машина сломана.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: сушильная машина
    note: '*dryer* значит «сушильная машина».'
    example_gloss: Положи одежду в сушильную машину.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: монеты по 25 центов
    note: '*quarters* — американские монеты достоинством двадцать пять центов, которые часто нужны для машин в прачечной. Точного отдельного названия для них в русском нет.'
    example_gloss: Машины принимают монеты по 25 центов.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: средство для стирки
    note: '*detergent* значит «средство для стирки».'
    example_gloss: Чтобы выстирать одежду, нужно средство для стирки.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: одна загрузка
    note: '*load* здесь значит «одна загрузка» — количество белья, которое стирают за один раз.'
    example_gloss: У меня много белья для одной загрузки.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Я хотел бы постирать несколько вещей, пожалуйста.
    note: '*I''d like to* — сокращение от *I would like to* и вежливый способ высказать просьбу.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: У вас есть мелочь для машин?
    note: '*change* здесь значит «мелочь, разменные монеты», а не «изменение».'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: Сколько длится цикл стирки?
    note: '*take* здесь значит «длиться», то есть занимать определённое время. В выражении *the machines take quarters* тот же глагол означает «принимать».'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: Три доллара за одну загрузку.
    note: '*for one load* значит «за одну загрузку».'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: Во сколько вы закрываетесь?
    note: В вопросе *do you close* используется вспомогательный глагол *do*.
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Пожалуйста, заберите бельё до девяти часов.
    note: '*pick up* значит «забирать», а *by nine o''clock* — «не позднее девяти часов».'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: Сотрудник приветствует посетителей
    gloss: 'Сотрудник говорит: Здравствуйте! Вам нужна стиральная машина?'
    note: В вопросе *Do you need...?* используется вспомогательный глагол *do*.
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: Причина Лейлы
    gloss: 'Лейла говорит: Да, пожалуйста. Моя стиральная машина дома сломана.'
    note: '*at home* значит «дома».'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: Просьба Даниэля
    gloss: 'Даниэль говорит: У меня тоже немного белья. Мне тоже можно воспользоваться машиной?'
    note: '*too* в конце первой фразы и *as well* во второй означают «тоже».'
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: Сотрудник рассказывает о монетах
    gloss: 'Сотрудник говорит: Конечно! Машины принимают монеты по 25 центов.'
    note: '*take* здесь значит «принимать» в качестве оплаты. В *The wash cycle takes thirty minutes* этот глагол означает «длиться».'
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: У Лейлы есть монеты
    gloss: 'Лейла говорит: Да, у меня есть монеты по 25 центов.'
    note: Краткое подтверждение без нового факта.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: Продолжительность цикла стирки
    gloss: 'Сотрудник говорит: Цикл стирки длится тридцать минут.'
    note: '*take* здесь значит «длиться», в отличие от *take quarters* выше.'
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Даниэль спрашивает о цене
    gloss: 'Даниэль говорит: А сколько это стоит?'
    note: В вопросе *How much does it cost?* используется вспомогательный глагол *does*.
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: Цена
    gloss: 'Сотрудник говорит: Три доллара за одну загрузку.'
    note: Это отдельный факт, не связанный с количеством монет или продолжительностью стирки.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: Время закрытия
    gloss: 'Сотрудник говорит: Прачечная закрывается в девять, поэтому заберите бельё до этого времени.'
    note: '*so* здесь значит «поэтому» и связывает время закрытия с просьбой прийти вовремя.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Текст: визит в прачечную'
    gloss: Однажды днём у Лейлы сломалась домашняя стиральная машина. Она решила пойти в прачечную самообслуживания дальше по улице. Даниэль пошёл с ней, потому что у него тоже было немного белья. В прачечной сотрудник объяснил, что машины принимают монеты по 25 центов, а цикл стирки длится тридцать минут. Одна загрузка стоила три доллара. Пока вещи стирались, Даниэль и Лейла разговаривали и пили кофе в соседнем кафе. Прачечная закрывалась в девять, поэтому они забрали бельё вовремя. Лейла была благодарна Даниэлю за компанию и сказала, что её домашнюю стиральную машину, вероятно, починят до выходных.
    note: '*would be fixed* значит «будет починена»: Лейла ожидает ремонта, но ещё не уверена в нём.'
