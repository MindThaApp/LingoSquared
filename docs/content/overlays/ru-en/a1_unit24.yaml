teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: спальня
    note: '*bedroom* значит «спальня». Слово составлено из *bed* («кровать») и *room* («комната»), но произносится и пишется как два слова с отдельным ударением.'
    example_gloss: Моя спальня рядом с ванной.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: кухня
    note: '*kitchen* значит «кухня». Произносится *KITCH-en*; звук *t* отдельно не слышен.'
    example_gloss: Кухня рядом с гостиной.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: ванная
    note: '*bathroom* значит «ванная». В США так часто называют и туалет.'
    example_gloss: В ванной есть душ.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: гостиная
    note: '*living room* значит «гостиная». Это два отдельных слова.'
    example_gloss: Мы смотрим телевизор в гостиной.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: сад
    note: '*garden* значит «сад». В США для сада или двора за домом часто говорят *yard*.'
    example_gloss: Сада нет, но есть балкон.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: Это кухня.
    note: 'Фразой *This is ...* ты показываешь на что-то. *the* указывает на конкретный предмет: кухню именно этой квартиры.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: Сколько там комнат?
    note: Конструкцией *How many...are there?* ты спрашиваешь о количестве. *many* стоит при исчисляемых существительных во множественном числе; *are* — потому что *rooms* во множественном числе.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: Там небольшая кухня.
    note: Конструкцией *There's...* (*there is*) ты говоришь, что где-то что-то есть. Это русское «есть», «имеется»; если предметов несколько, говорят *there are*.
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: рядом с
    note: '*next to* значит «рядом с». Это два слова, и они всегда идут вместе.'
    example_gloss: Стул стоит рядом со столом.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: квартира
    note: '*apartment* значит «квартира» (американский вариант; в Великобритании говорят *flat*).'
    example_gloss: В квартире Дэниела две спальни.
  en.a1.unit24.lesson03.teach.home_text:
    title: Текст о квартире
    gloss: В моей квартире две спальни и одна ванная. Рядом с гостиной есть небольшая кухня.
    note: В этом коротком тексте человек описывает свою квартиру и называет количество комнат.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: Какая твоя любимая комната?
    note: '*favorite* значит «любимый».'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: Спрашиваем о квартире
    gloss: 'Лейла говорит: Расскажи мне о своей квартире.'
    note: Фразой *Tell me about...* ты просишь кого-то что-то описать.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: В ней две спальни и одна ванная. Рядом с гостиной небольшая кухня.'
    note: Дэниел называет количество комнат и говорит, где находится кухня.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: Спрашиваем о саде
    gloss: 'Лейла спрашивает: Там есть сад?'
    note: Вопросом *Is there...?* ты спрашиваешь, есть ли что-то.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Ответ Дэниела
    gloss: 'Дэниел говорит: Нет, сада нет, но есть небольшой балкон.'
    note: Дэниел сначала говорит «нет», а потом называет альтернативу.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Последний ответ Дэниела
    gloss: 'Дэниел говорит: Моя любимая комната — гостиная. Она рядом с кухней, поэтому там удобно ужинать.'
    note: Дэниел называет свою любимую комнату и объясняет почему.
