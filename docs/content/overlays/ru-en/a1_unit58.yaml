teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: музей
    note: '*museum* означает «музей» — слово почти такое же, как в русском.'
    example_gloss: Этот музей очень старый.
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: билет
    note: '*ticket* означает «входной билет», документ, по которому тебя пускают внутрь.'
    example_gloss: Мне нужен один билет, пожалуйста.
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: выставка
    note: '*exhibition* означает собрание произведений искусства или предметов, которое можно осмотреть.'
    example_gloss: Есть новая выставка.
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: картина
    note: '*painting* означает произведение искусства, написанное красками.'
    example_gloss: Мне очень нравится эта картина.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: скульптура
    note: '*sculpture* означает произведение искусства из камня, дерева или металла — по-русски это «скульптура».'
    example_gloss: Эта скульптура тоже очень старая.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: экскурсовод, гид
    note: '*guide* означает человека, который водит посетителей по музею и всё объясняет.'
    example_gloss: Сегодня есть экскурсовод?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: Во сколько открывается музей?
    note: Этот вопрос начинается с *what time*, затем идёт вспомогательный глагол *does*, потому что основной глагол — *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: Во сколько закрывается музей?
    note: Тот же вопрос, что и *What time does the museum open?*, только вместо *open* стоит *close*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Два билета, пожалуйста.
    note: '*please* в конце делает просьбу вежливой, как и при заказе еды.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: Есть ли экскурсовод для этой выставки?
    note: '*Is there...?* спрашивает, есть ли что-то на месте, — здесь экскурсовод.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: Музей открыт каждый день.
    note: '*every day* означает «каждый день» и стоит в конце предложения.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: Мне очень понравились картины!
    note: '*enjoyed* — прошедшее время от *enjoy* («получать удовольствие»); так вспоминают о чём-то приятном.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: Вопрос Даниэля
    gloss: 'Даниэль говорит: Привет! Во сколько закрывается музей?'
    note: '*Hi!* — неформальное приветствие.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: Ответ сотрудника
    gloss: 'Сотрудник говорит: Мы закрываемся в пять часов.'
    note: '*at* + время показывает, когда что-то происходит, например *at five o''clock*; по-русски здесь стоит «в» (в пять часов).'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: Просьба Мии
    gloss: 'Мия говорит: Отлично. Можно нам два билета, пожалуйста?'
    note: '*Can we have...?* — вежливый способ о чём-то попросить или что-то заказать.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: Цена
    gloss: 'Сотрудник говорит: Конечно. С вас двенадцать долларов.'
    note: '*That''s* + сумма — так называют цену.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: Вопрос Даниэля об экскурсоводе
    gloss: 'Даниэль спрашивает: Есть ли экскурсовод для этой выставки?'
    note: Та же конструкция *Is there...?*, что и раньше в этом уроке.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: Сотрудник об экскурсоводе
    gloss: 'Сотрудник говорит: Да, экскурсовод есть у входа.'
    note: '*there''s* — сокращение от *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Мия спрашивает о названии
    gloss: 'Мия спрашивает: Как называется выставка?'
    note: '*What is ... called?* — обычный способ спросить, как что-то называется.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: Название выставки
    gloss: 'Сотрудник говорит: Она называется Colors of the City.'
    note: '*It''s called...* — ответ на вопрос *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: Заключительная реплика Даниэля
    gloss: 'Даниэль говорит: Спасибо! Не могу дождаться, когда увижу картины.'
    note: '*can''t wait to...* означает, что ты очень рад что-то сделать.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Табличка музея
    gloss: 'Городской музей: открыт каждый день, с 9:00 до 17:00. Билет для взрослых: 6 долларов. Текущая выставка: Colors of the City, зал 2.'
    note: На табличке указаны часы работы, цена и название выставки.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Текст о Даниэле и Мии
    gloss: 'Поход в музей: в одну из суббот после обеда Даниэль и Мия решили вместе сходить в Городской музей. У входа сотрудник сказал им, что музей закрывается в пять часов. Они купили два билета за двенадцать долларов. Даниэль спросил про экскурсовода, и сотрудник сказал, что он есть у входа. Они посмотрели выставку Colors of the City и увидели много красивых картин в зале 2. Даниэлю понравилась картина со старой городской площадью, а Мии — картина с рекой на закате. Когда они уходили, Мия сказала, что в следующий раз хочет сходить на выставку скульптур.'
    note: '*decided to visit* — после *decided* идёт *to* + инфинитив, чтобы сказать, что человек решил сделать.'
