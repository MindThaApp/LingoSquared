teaching:
  en.a1.unit32.lesson01.teach.dog:
    title: dog
    gloss: собака
    note: '*dog* означает «собака».'
    example_gloss: У меня есть собака.
  en.a1.unit32.lesson01.teach.cat:
    title: cat
    gloss: кошка
    note: '*cat* означает «кошка».'
    example_gloss: Кошка моей сестры чёрная.
  en.a1.unit32.lesson01.teach.fish:
    title: fish
    gloss: рыба
    note: '*fish* означает «рыба».'
    example_gloss: У него есть рыба.
  en.a1.unit32.lesson01.teach.bird:
    title: bird
    gloss: птица
    note: '*bird* означает «птица».'
    example_gloss: У нас есть птица.
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: питомец
    note: '*pet* означает «питомец»; *pets* — множественное число. Обрати внимание на *any* в вопросе *Do you have any pets?* В английском *any* используется в вопросах и отрицаниях с существительными во множественном числе и неисчисляемыми словами. В русском для этого нет отдельного слова («У тебя есть питомцы?» ничего подобного не содержит), но в английском *any* опускать нельзя.'
    example_gloss: У тебя есть питомцы?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: Её зовут Луна.
    note: 'В английском для животного используют *her*/*his* (и *she*/*he*), когда пол известен. В русском местоимение зависит от грамматического рода слова: про любую «собаку» или «кошку» мы говорим «она», даже если это пёс или кот. *Her name is Luna* — значит, речь о самке.'
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: играть
    note: '*play* означает «играть».'
    example_gloss: Моя собака любит играть.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: выгуливать
    note: '*walk* здесь означает «выгуливать» питомца.'
    example_gloss: Я каждый день выгуливаю свою собаку.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: дружелюбный
    note: '*friendly* означает «дружелюбный».'
    example_gloss: Её кошка очень дружелюбная.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: маленький
    note: '*small* означает «маленький».'
    example_gloss: Рыба маленькая.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: Вопрос Даниэля
    gloss: 'Даниэль спрашивает: Миа, у тебя есть питомцы?'
    note: В русском вопросе нет отдельного слова вроде *any*, но в английском *any* здесь опускать нельзя.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Да, у меня есть кошка. Её зовут Луна.'
    note: '*She* и *her* для кошки, потому что пол (женский) известен. В русском выбор местоимения зависит от грамматического рода слова, а не от пола животного: и кошка, и собака — «она».'
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: Следующий вопрос Даниэля
    gloss: 'Даниэль говорит: Как мило! Она любит играть?'
    note: '*Does* здесь вспомогательный глагол при *she* (do-support), как и в вопросах о внешности.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "Ответ: Миа"
    gloss: 'Миа говорит: Да, она обожает играть с мячом. А ты?'
    note: '*What about you?* — короткий естественный способ задать собеседнику тот же вопрос.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Ответ: Даниэль"
    gloss: 'Даниэль говорит: У меня есть маленькая рыбка, но я хочу собаку.'
    note: '*but* соединяет здесь две противоположные мысли: питомец у него уже есть, но он хочет другое животное.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Текст о Лейле и Даниэле
    gloss: У Лейлы есть собака по кличке Макс. Он большой и очень дружелюбный. Она выгуливает его каждое утро. У Даниэля нет собаки, но есть маленькая рыбка. Рыбку не нужно выгуливать, но Даниэль всё равно любит смотреть, как она плавает.
    note: '*He* про Макса, потому что это самец. В английском *she* или *he* выбирают по настоящему полу животного, а в русском — по грамматическому роду слова (например, «собака» — всегда «она»).'
