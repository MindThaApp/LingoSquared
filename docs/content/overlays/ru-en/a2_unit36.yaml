course:
  title: Английский A2
  description: Английский уровня A2 для более формальных повседневных ситуаций, с подробными объяснениями на русском языке.
units:
  en.a2.unit36.document_correction:
    title: Просим исправить ошибку в официальном документе
lessons:
  en.a2.unit36.lesson01.document_vocabulary:
    title: Справки, ошибки и копии
  en.a2.unit36.lesson02.asking_for_a_correction:
    title: Просим внести исправление
  en.a2.unit36.lesson03.reading_a_correction_notice:
    title: Читаем письмо об исправлении
  en.a2.unit36.lesson04.correction_dialogue:
    title: У окошка в службе регистрации
teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: свидетельство, справка
    note: '*certificate* — официальный документ, который выдаёт учреждение; *registration certificate* — свидетельство о регистрации по месту жительства.'
    example_gloss: Свидетельство о регистрации пришло через две недели после приёма.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: ошибка
    note: '*mistake* — то, что написано или сделано неправильно.'
    example_gloss: В моём адресе в этом бланке ошибка.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: написано, произнесено по буквам
    note: '*spelled* говорит, какими буквами и в каком порядке пишется слово.'
    example_gloss: Моё имя пишется с одной буквой L, а не с двумя.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: исправить
    note: '*correct* здесь глагол: сделать неправильное правильным.'
    example_gloss: Сотрудник может исправить мою фамилию сегодня.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: копия
    note: '*copy* — второй, идентичный экземпляр документа.'
    example_gloss: Учреждение оставляет себе копию каждого документа.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: паспорт
    note: '*passport* — документ для поездок с вашей фотографией.'
    example_gloss: На официальный приём я всегда беру с собой паспорт.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is и there are
    gloss: На моём свидетельстве ошибка. На моём свидетельстве две ошибки.
    note: '*there is* используют, когда речь об одном предмете, а *there are* — когда их больше одного. В русском в обоих случаях достаточно слова «есть» или «имеется».'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: Сказать, что есть ошибка
    gloss: На моём свидетельстве о регистрации ошибка.
    note: '*There is a mistake on...* — деловой, формальный способ сообщить об ошибке.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: Сказать, что именно не так
    gloss: Моя фамилия написана неправильно.
    note: '*last name* — фамилия; *first name* — имя.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: Спросить, можно ли исправить
    gloss: Не могли бы вы это исправить, пожалуйста?
    note: '*Could you...?* вежливее, чем *Can you...?*, и подходит для окошка в учреждении.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: Спросить, сколько это займёт
    gloss: Сколько времени займёт исправление?
    note: '*How long...?* спрашивает о длительности во времени, а не о длине.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: две вежливые просьбы
    gloss: Не могли бы вы это исправить, пожалуйста? Можно ли получить новое свидетельство?
    note: '*Could you...?* просит что-то сделать; *Would it be possible to...?* ещё осторожнее и спрашивает, возможно ли это вообще.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: рабочие дни
    note: '*working days* — дни с понедельника по пятницу, то есть без выходных.'
    example_gloss: Учреждение отвечает на каждое письмо в течение пяти рабочих дней.
  en.a2.unit36.lesson03.teach.notice_text:
    title: Письмо с исправлением
    gloss: Заявление об исправлении получено. Ваше свидетельство о регистрации будет исправлено в течение пяти рабочих дней. Пожалуйста, принесите паспорт и это письмо в учреждение. Номер дела 3092.
    note: 'Официальное письмо коротко и по делу: что произошло, что произойдёт и что вам нужно сделать.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: что принести с собой
    gloss: Пожалуйста, принесите паспорт и это письмо в учреждение.
    note: '*bring ... to ...* означает «принести что-то куда-то».'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Лейла сообщает об ошибке
    gloss: 'Лейла говорит: Здравствуйте, в моём свидетельстве о регистрации ошибка.'
    note: '*Hello* нейтральнее, чем *Hi*, и лучше подходит для окошка в учреждении.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: Сотрудник уточняет
    gloss: 'Сотрудник говорит: Понятно. Что именно не так?'
    note: '*I see* здесь значит «понятно, я слушаю».'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Лейла объясняет ошибку и просит исправить
    gloss: 'Лейла говорит: Моя фамилия написана неправильно. Не могли бы вы это исправить, пожалуйста?'
    note: Те же два предложения, что и во втором уроке, теперь вместе.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: Сотрудник спрашивает паспорт
    gloss: 'Сотрудник говорит: Конечно. У вас с собой паспорт?'
    note: '*Do you have ... with you?* значит: «У вас это сейчас с собой?»'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Лейла протягивает паспорт
    gloss: 'Лейла говорит: Да, вот он.'
    note: '*Here it is* говорят, передавая что-то человеку.'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: Сотрудник объясняет, что он делает
    gloss: 'Сотрудник говорит: Спасибо. Я сделаю копию и отправлю исправление сегодня же.'
    note: '*make a copy* — устойчивое сочетание: сделать копию.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Лейла спрашивает, сколько это займёт
    gloss: 'Лейла спрашивает: Сколько времени займёт исправление?'
    note: Тот же вопрос, что и во втором уроке.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: Ответ сотрудника
    gloss: 'Сотрудник говорит: В течение пяти рабочих дней.'
    note: '*within* значит «в пределах срока», то есть не дольше пяти рабочих дней.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Лейла благодарит сотрудника
    gloss: 'Лейла говорит: Большое спасибо.'
    note: '*very much* делает благодарность более выразительной.'
