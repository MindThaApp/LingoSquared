teaching:
  en.a1.unit02.lesson01.teach.whats_your_name:
    title: What's your name?
    gloss: Как тебя зовут? / Как вас зовут?
    note: '*What''s your name?* подходит и для формального, и для неформального общения: в английском нет разницы между «ты» и «вы».'
  en.a1.unit02.lesson01.teach.my_name_is:
    title: My name is Leila.
    gloss: Меня зовут Лейла.
    note: Стандартная форма, чтобы назвать своё имя.
  en.a1.unit02.lesson01.teach.im_leila:
    title: I'm Leila.
    gloss: Я Лейла. / Меня зовут Лейла.
    note: Более короткая и такая же распространённая замена для *My name is Leila*.
  en.a1.unit02.lesson01.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Очень приятно.
    note: Так говорят при первой встрече.
  en.a1.unit02.lesson02.teach.i_am_student:
    title: I am a student.
    gloss: Я студент / студентка.
    note: Перед названием профессии или роли в единственном числе в английском ставится *a*; в русском артикля нет (*Я студент*, а не «я один студент»).
  en.a1.unit02.lesson02.teach.are_you_teacher:
    title: Are you a teacher?
    gloss: Вы учитель? / Ты учитель? (учительница)
    note: Вопрос с *Are you...?* подходит в любом регистре.
  en.a1.unit02.lesson02.teach.yes_i_am:
    title: Yes, I am.
    gloss: Да, это так.
    note: Короткий полный ответ на вопросы вроде *Are you a teacher?*
  en.a1.unit02.lesson02.teach.no_im_student:
    title: No, I'm a student.
    gloss: Нет, я студент / студентка.
    note: Отрицательный ответ с указанием своей настоящей роли.
  en.a1.unit02.lesson02.teach.are_you_member:
    title: Are you a new member?
    gloss: Вы новый участник? / Ты новый участник?
    note: Вопрос о членстве, например, в библиотеке или клубе.
  en.a1.unit02.lesson02.teach.he_is_teacher:
    title: He is a teacher.
    gloss: Он учитель.
    note: Третье лицо единственного числа, мужской род.
  en.a1.unit02.lesson02.teach.she_is_engineer:
    title: She is an engineer.
    gloss: Она инженер.
    note: Третье лицо единственного числа, женский род. Здесь *an*, а не *a*, потому что *engineer* начинается с гласного звука.
  en.a1.unit02.lesson03.teach.library:
    title: library
    gloss: библиотека
    note: Место, где можно взять книги почитать.
    example_gloss: Я в библиотеке.
  en.a1.unit02.lesson03.teach.library_assistant:
    title: library assistant
    gloss: помощник библиотекаря
    note: Человек, который работает в библиотеке.
  en.a1.unit02.lesson03.teach.opening:
    title: Daniel eröffnet das Gespräch
    gloss: 'Дэниел говорит: Добрый день. Я Дэниел.'
    note: Формальное дружелюбное начало разговора.
  en.a1.unit02.lesson03.teach.request:
    title: Daniel fragt nach dem Namen
    gloss: 'Дэниел говорит: Как вас зовут?'
    note: Сразу после представления. Дэниел и Лейла пока не знакомы, поэтому разговор остаётся в формальном регистре, на «вы».
  en.a1.unit02.lesson03.teach.names:
    title: Leila antwortet
    gloss: 'Лейла говорит: Здравствуйте. Я Лейла. Я студентка. Очень приятно.'
    note: Лейла называет своё имя, свою роль и произносит обычную вежливую фразу.
  en.a1.unit02.lesson03.teach.room_and_member:
    title: Daniel fragt nach der Mitgliedschaft
    gloss: 'Дэниел говорит: Мне тоже приятно. Вы новый участник? Лейла говорит: Да.'
    note: Дэниел отвечает на вежливую фразу и спрашивает о членстве, по-прежнему на «вы».
  en.a1.unit02.lesson03.teach.role:
    title: Daniel nennt seinen Beruf
    gloss: 'Дэниел говорит: Я инженер.'
    note: Перед профессией в английском стоит *a* или *an* (*I'm an engineer*); в русском артикля нет.
  en.a1.unit02.lesson03.teach.closing:
    title: Daniel und Leila schließen das Gespräch ab
    gloss: 'Дэниел говорит: Добро пожаловать в библиотеку. Лейла говорит: Спасибо.'
    note: Дружелюбное вежливое завершение.
