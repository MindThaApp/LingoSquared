    title: Разговор с другом о видеозвонках
teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: видеозвонок
    note: '*video call* — разговор, в котором собеседники ещё и видят друг друга. По-русски также говорят «видеосвязь» или «видеоконференция».'
    example_gloss: Каждый понедельник у меня видеозвонок с моей командой.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: камера
    note: '*camera* — устройство, которое передаёт ваше изображение.'
    example_gloss: Пожалуйста, включи камеру до начала встречи.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: микрофон
    note: '*microphone* — устройство, которое передаёт ваш голос.'
    example_gloss: Мой микрофон был выключен, поэтому остальные меня не слышали.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: соединение
    note: '*connection* — связь между вашим компьютером и интернетом.'
    example_gloss: Соединение было плохим, поэтому изображение остановилось.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: отключить звук
    note: '*mute* значит выключить свой звук, чтобы другие вас не слышали.'
    example_gloss: Я отключаю микрофон, когда не говорю.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: лично / лицом к лицу
    note: '*face to face* значит находиться в одной комнате, а не разговаривать через экран.'
    example_gloss: Некоторые встречи лучше проводить лично, а не онлайн.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Сравнение с faster than и less ... than
    gloss: Видеозвонок быстрее, чем визит. Видеозвонок менее личный, чем встреча лицом к лицу.
    note: К коротким прилагательным добавляют *-er* и ставят после *than* (*faster than*). С более длинными прилагательными используют *less ... than* или *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Сказать, как часто у вас видеозвонки
    gloss: Каждый понедельник у меня видеозвонок с моей командой.
    note: '*every Monday* значит «каждый понедельник» и описывает постоянную привычку.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Попросить включить камеру
    gloss: Ты можешь включить камеру?
    note: '*turn on* значит «включить», противоположное — *turn off* («выключить»).'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Сказать, что у кого-то был отключён звук
    gloss: Извини, у тебя был отключён звук.
    note: '*you were on mute* — устойчивое выражение, когда кого-то не было слышно, потому что его микрофон был выключен.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Высказать мнение с предпочтением
    gloss: Я думаю, что видеозвонки удобны, но я больше люблю встречаться с людьми лично.
    note: С *I think ... but I prefer ...* сначала высказывают мнение, а потом говорят, что нравится больше.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: Я предпочитаю видеозвонки телефонным звонкам. Я предпочитаю личные встречи видеозвонкам.
    note: 'Осторожно: после *prefer* в английском стоит *to*, а не *than*, хотя по-русски можно сказать «больше, чем»: *I prefer video calls to phone calls*.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: наушники
    note: '*headphones* в английском всегда стоит во множественном числе, даже если вы используете одну пару.'
    example_gloss: Я пользуюсь наушниками, чтобы моя семья не слышала встречу.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Сообщение Лейлы
    gloss: Мои онлайн-занятия теперь все проходят как видеозвонки. Я включаю камеру, но микрофон остаётся выключенным, пока преподаватель не задаст вопрос. Я пользуюсь наушниками, потому что с ними соединение лучше. Я считаю, что видеозвонки экономят много времени, но всё же больше люблю встречаться с одноклассниками лично.
    note: Непринуждённое сообщение от Лейлы о её онлайн-занятиях.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Сказать, когда вы отключаете микрофон
    gloss: Мой микрофон остаётся выключенным, пока преподаватель не задаст вопрос.
    note: '*until* значит «до тех пор, пока»: что-то продолжается, пока не наступит определённый момент.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Лейла спрашивает о работе Даниэля
    gloss: 'Лейла спрашивает: У тебя на работе много видеозвонков?'
    note: '*a lot of* значит «много» и подходит и к исчисляемым, и к неисчисляемым словам.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Даниэль рассказывает о своей назначенной встрече
    gloss: 'Дэниел говорит: Да, каждый понедельник у меня видеозвонок с моей командой.'
    note: То же предложение, что и во втором уроке.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Лейла спрашивает о камере
    gloss: 'Лейла спрашивает: Ты включаешь камеру?'
    note: Короткий уточняющий вопрос, чтобы узнать больше.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Привычка Даниэля в видеозвонке
    gloss: 'Дэниел говорит: Всегда, но я отключаю микрофон, когда не говорю.'
    note: '*when I am not speaking* здесь значит «в те моменты, когда я не говорю».'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Лейла рассказывает о своих курсах
    gloss: 'Лейла говорит: Мои онлайн-занятия теперь все проходят как видеозвонки.'
    note: Это связано с её занятиями по понедельникам и средам из урока 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Даниэль спрашивает её мнение
    gloss: 'Дэниел спрашивает: Что ты об этом думаешь?'
    note: '*What do you think about them?* спрашивает о мнении по поводу того, о чём только что говорили.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Лейла высказывает своё мнение
    gloss: 'Лейла говорит: Я думаю, что видеозвонки удобны, но я больше люблю встречаться с людьми лично.'
    note: То же мнение, что и во втором уроке.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Даниэль соглашается с ней
    gloss: 'Дэниел говорит: Я согласен. Видеозвонок быстрее, чем визит, но менее личный.'
    note: С *I agree* выражают согласие. После этого обычно называют свою причину.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Лейла подтверждает
    gloss: 'Лейла говорит: Именно.'
    note: '*Exactly* — короткий способ сказать, что вы полностью согласны.'
