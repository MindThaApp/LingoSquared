teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: 每天
    gloss: 每天
    note: كل يوم (kull yawm) 常放在动词之后(أدرس كل يوم),也可以放在句首(كل يوم أدرس)。
    example_gloss: 我每天学习。
  ar.a1.unit11.lesson01.teach.wake:
    title: 我起床
    gloss: 我起床
    note: أستيقظ (astayqiẓ) 的意思是“我起床”;开头的 أ 在现在时动词中表示“我”。السابعة (as-sābiʿa) 在钟点中表示“七”。
    example_gloss: 我七点醒来。
  ar.a1.unit11.lesson01.teach.study:
    title: 我学习
    gloss: 我学习
    note: أدرس (adrus) 的意思是“我学习”;它与 درس(课)同词根。التاسعة (at-tāsiʿa) 在钟点中表示“九”。
    example_gloss: 我九点学习。
  ar.a1.unit11.lesson01.teach.sleep:
    title: 我睡觉
    gloss: 我睡觉/我上床睡觉
    note: أنام (anām) 的意思是“我睡觉”;与时间连用时表示“我上床睡觉”。العاشرة (al-ʿāshira) 在钟点中表示“十”。
    example_gloss: 我十点睡觉。
  ar.a1.unit11.lesson02.teach.what_do:
    title: 你每天做什么？
    gloss: 你每天做什么？
    note: ماذا (mādhā) 表示“什么”,تفعل (tafʿal) 表示“你做”,对男士说；对女士则说 تفعلين (tafʿalīn)。
    example_gloss: 蕾拉说：你每天做什么？
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: 三个日常句子
    gloss: 我七点起床。我九点学习。我十点睡觉。
    note: 每个句子都是 动词 + في الساعة + 钟点；合在一起就描述了一整天。
    example_gloss: 每天，我七点起床。我九点学习。我十点睡觉。
  ar.a1.unit11.lesson02.teach.line01:
    title: 询问日常安排
    gloss: 蕾拉问优素福每天做什么。
    note: 蕾拉说 تفعل,是因为她在问一位男士；问女士则说：ماذا تفعلين كل يوم؟
    example_gloss: 蕾拉说：你每天做什么？
  ar.a1.unit11.lesson02.teach.line02:
    title: 起床时间
    gloss: 优素福说他七点起床。
    note: 时间前要用 في الساعة。
    example_gloss: 优素福说：我七点起床。
  ar.a1.unit11.lesson02.teach.line03:
    title: 学习时间
    gloss: 优素福说他九点学习。
    note: 同样的时间句型也适用于 أدرس。
    example_gloss: 优素福说：我九点学习。
  ar.a1.unit11.lesson02.teach.line04:
    title: 睡觉时间
    gloss: 优素福说他十点上床睡觉。
    note: 他一天中的最后一件事，同样用这个时间句型加 أنام。
    example_gloss: 优素福说：我十点睡觉。
