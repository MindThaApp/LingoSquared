    gloss: 优素福：你在哪里跑步？
  ar.a1.unit28.lesson04.teach.krym_fy_alhdyqa:
    title: 卡里姆回答地点
    gloss: 卡里姆：在公园，离我家很近。
  ar.a1.unit28.lesson04.teach.ytghyr_alfal_ma:
    title: 动词随人称变化
    gloss: 动词随人称变化：أنا أركض (anā arkuḍ,我跑步)、كريم يركض (karīm yarkuḍ,卡里姆跑步)、أنت تركض (anta tarkuḍ,你跑步)。
    note: 动词的第一个字母表示动作的执行者：أ (a-) 是“我”,ي (ya-) 是“他”,ت (ta-) 是“你”或“她”。
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: 优素福的反应
    gloss: 优素福：太好了，我经常在那里踢足球。
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: 莱拉和萨拉谈运动
    gloss: 莱拉每周练两次瑜伽。她喜欢安静地活动身体。萨拉不练瑜伽，但她喜欢游泳。萨拉经常游泳，几乎每周都去。你做什么运动？
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) 和 سارة تسبح (sāra tasbaḥ) 中的动词都以 ت (ta-) 开头，因为主语都是女性。动词前加 لا 表示否定。
    glosses:
      تمارس: 做
      مرتين: 两次
      الأسبوع: 周
      اليوغا: 瑜伽
      تحب: 喜欢
      بهدوء: 平静地
      تتحرك: 活动
      السباحة: 游泳
      تسبح: 游泳
      كثيرا: 经常
      تقريبا: 几乎
      ما: 哪个
      الرياضة: 运动
  ar.a1.unit28.lesson05.teach.sara_tsbh_kthyra:
    title: 萨拉经常游泳，几乎每周都去
    gloss: 萨拉经常游泳，几乎每周都去。
  ar.a1.unit28.lesson05.teach.alab_kra_alqdm:
    title: 我踢足球。我爱足球。
