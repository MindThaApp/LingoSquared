  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: 提议一起做某事
    gloss: 提议大家一起做某事时，用 هل (hal) + “我们”形式的动词：هل نتمشى؟ (hal natamashshā?)、هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?)。
    note: 沿用计划单元中提出建议的同一句型。
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: 萨拉同意
    gloss: 萨拉：好啊，太棒了！我喜欢游泳。
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
    title: 优素福更喜欢足球
    gloss: 优素福：我更想踢足球。
  ar.a1.unit28.lesson06.teach.krym_wana_ahb:
