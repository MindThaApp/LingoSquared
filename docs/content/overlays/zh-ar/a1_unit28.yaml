  ar.a1.unit28.lesson01.teach.alab_kra_alqdm:
    title: 我踢足球
    gloss: 我踢足球。
    note: ألعب (alʿab) 是用于球类运动的动词：ألعب كرة القدم (alʿab kurat al-qadam)。كرة القدم 字面意思是“脚的球”。
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 运动相关的动词：أمارس 和 ألعب
    gloss: 大多数运动前用 أمارس (umāris,我做/练):أمارس اليوغا (umāris al-yūghā)、أمارس الركض (umāris ar-rakḍ)、أمارس السباحة (umāris as-sibāḥa)。球类运动用 ألعب (alʿab,我玩/打):ألعب كرة القدم。
    note: أمارس (umāris) 适用于大多数运动，但球类运动要用 ألعب (alʿab),所以要把动词和运动名称一起记。
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: 每周……次
    gloss: 每周……次
    example_gloss: 我每周做两次瑜伽。
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: 每周……次
    gloss: كثيرا (kathīran) 和 كل يوم (kull yawm) 比较笼统；مرتين في الأسبوع (marratayn fī al-usbūʿ) 则准确说明频率。مرتين 是 مرة (marra,次)的双数形式。
    note: 这是在爱好单元已学频率词汇的基础上进行扩展。
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
    title: 我每周做两次瑜伽
    gloss: 我每周做两次瑜伽。
  ar.a1.unit28.lesson02.teach.ywsf_ylab_kra:
    title: 优素福经常踢足球
    gloss: 优素福经常踢足球。
    note: يلعب (yalʿab) 意为“他玩/打”:开头的字母 ي (ya-) 表示“他”。كثيرا (kathīran) 意为“经常”。
  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: 谈论运动的两种方式
    gloss: أمارس الرياضة (umāris ar-riyāḍa) 泛指做运动，而 أمارس اليوغا (umāris al-yūghā) 点明具体的运动项目。两种说法都正确。
    note: رياضة (riyāḍa) 是阴性名词，اليوغا (al-yūghā) 是带 ال 的运动名称。
  ar.a1.unit28.lesson03.teach.mmarsa_alryada:
    title: 锻炼
    gloss: 锻炼／做运动
    example_gloss: 我每天锻炼。
  ar.a1.unit28.lesson03.teach.hb_alsbaha:
    title: 喜欢游泳
