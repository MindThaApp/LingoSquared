    example_gloss: 萨拉喜欢游泳。
  ar.a1.unit28.lesson03.teach.sara_thb_alsbaha:
    title: 萨拉喜欢游泳
    gloss: 萨拉喜欢游泳。
    note: تحب (tuḥibb) 意为“她喜欢”:开头的字母 ت (ta-) 表示“她”。السباحة (as-sibāḥa) 以日字母开头，所以写作 as-sibāḥa。
  ar.a1.unit28.lesson04.teach.ywsf_hl_trkd:
    title: 优素福问卡里姆
