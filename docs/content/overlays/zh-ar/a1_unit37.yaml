      تعمل: 工作
      ممرضة: 护士
      مضحك: 有趣的
      ويحضر: 上（课）／参加
      دورة: 课程
      الإسبانية: 西班牙语
      فضولية: 好奇的
      تتعلم: 学习
      تحب: 喜欢
      جديدة: 新的
      أشياء: 事物
      نفسه: 本人／自己
      هادئ: 安静的
