    title: 努尔听大家介绍
    gloss: 努尔是语言咖啡馆的新成员。她问优素福其他人是什么样的。优素福告诉了她:莱拉和善又有耐心,是一名护士;卡里姆很搞笑,正在上西班牙语课;萨拉很好奇,喜欢学习新东西;优素福自己则很沉稳。
    note: 这是一段关于这群人的短文。形容词要与人物的性别一致:女性用 لطيفة (laṭīfa),男性用 مضحك (muḍḥik)。
