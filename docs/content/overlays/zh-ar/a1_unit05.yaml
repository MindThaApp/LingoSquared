teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: 时间
    gloss: 时间/钟点
    note: الساعة(as-sāʿa)字面意思是“小时”(也指钟表);表示钟点的回答都以它开头。
    example_gloss: 现在是三点。
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: 现在几点？
    gloss: 现在几点？
    note: كم الساعة؟ 字面意思是“钟点是多少?”
    example_gloss: 蕾拉说:现在几点?
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: 三点整
    gloss: 现在是三点。
    note: الثالثة(ath-thālitha)是阴性序数词“第三”,与阴性的 الساعة 保持一致,字面意思是“第三个钟点”。
    example_gloss: 蕾拉说:现在是三点。
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: 五点
    gloss: 现在是五点。
    note: الخامسة(al-khāmisa),“第五(个钟点)”。A1 阶段只学整点。
    example_gloss: 蕾拉说:现在是五点。
  ar.a1.unit05.lesson01.teach.sabah:
    title: 早晨
    gloss: 在早上
    note: صباحا(ṣabāḥan)可以说明时间是早上;في الصباح 表达的意思相同。
    example_gloss: 现在是早上五点。
  ar.a1.unit05.lesson01.teach.masaa:
    title: 在晚上
    gloss: 在晚上
    note: مساء(masāʾan)可以说明时间是傍晚或晚上;في المساء 表达的意思相同。
    example_gloss: 现在是下午五点。
  ar.a1.unit05.lesson02.teach.mata:
    title: 什么时候
    gloss: 什么时候
    note: متى(matā)用来询问某事什么时候发生。
    example_gloss: 课什么时候上?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: 课什么时候上?
    gloss: 课什么时候上?
    note: 在这个简单的问句中,阿拉伯语可以省略“是”。
    example_gloss: 优素福说:课什么时候上?
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: 课在五点
    gloss: 课在五点。
    note: الساعة 也可以用来引出预定的时间。
    example_gloss: 蕾拉说:课在五点。
  ar.a1.unit05.lesson02.teach.line01:
    title: 询问时间
    gloss: 优素福询问时间。
    note: كم الساعة؟ 用来询问当前的时间。
    example_gloss: 优素福说:现在几点?
  ar.a1.unit05.lesson02.teach.line02:
    title: 说出时间
    gloss: 蕾拉说现在是三点。
    note: 回答以 الساعة 开头。
    example_gloss: 蕾拉说:现在是三点。
  ar.a1.unit05.lesson02.teach.line03:
    title: 询问时间
    gloss: 优素福问课什么时候上。
    note: و 把这个问题与前面的对话衔接起来。
    example_gloss: 优素福说:那课什么时候上?
  ar.a1.unit05.lesson02.teach.line04:
    title: 说出预定的时间
    gloss: 蕾拉说课在五点。
    note: 这是回答日程安排的说法。
    example_gloss: 蕾拉说:课在五点。
