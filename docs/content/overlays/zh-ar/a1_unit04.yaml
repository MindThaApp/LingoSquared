teaching:
  ar.a1.unit04.lesson01.teach.tareekh:
    title: 日期
    gloss: 日期
    note: 在这个问句中，تاريخ 指日历上的日期。
    example_gloss: 今天几号？
  ar.a1.unit04.lesson01.teach.al_yawm:
    title: 今天
    gloss: 今天
    note: اليوم 根据语境既可表示“今天”，也可表示“这一天”。
    example_gloss: 今天几号？
  ar.a1.unit04.lesson01.teach.ma_tareekh:
    title: 今天几号？
    gloss: 今天几号？
    note: 阿拉伯语把疑问词 ما 放在名词短语 تاريخ اليوم 之前。
    example_gloss: 蕾拉说：今天几号？
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: 五月的
    gloss: 五月的
    note: 表示日期时，月份前要用 من：الخامس من مايو。
    example_gloss: 今天是五月五日。
  ar.a1.unit04.lesson01.teach.may:
    title: 五月
    gloss: 五月
    note: مايو（māyū）是埃及和大部分阿拉伯国家使用的五月名称；在黎巴嫩、叙利亚、约旦和伊拉克，同一个月叫 أيار（ayyār）。
    example_gloss: 今天是五月五日。
  ar.a1.unit04.lesson01.teach.june:
    title: 六月
    gloss: 六月
    note: يونيو（yūnyū）是埃及和大部分阿拉伯国家使用的六月名称；在黎巴嫩、叙利亚、约旦和伊拉克，同一个月叫 حزيران（ḥazīrān）。
    example_gloss: 今天是六月六日。
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: 第五
    gloss: 第五
    note: 在这个简单的日期中，الخامس 是表示 5 日的序数形式。
    example_gloss: 今天是五月五日。
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: 第六
    gloss: 第六
    note: السادس 是表示 6 日的序数形式。
    example_gloss: 今天是六月六日。
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: 5月5日
    gloss: 五月五日
    note: 阿拉伯语是“日在前、月在后”，中间用 من 连接；汉语则是月在前、日在后，不用连接词。
    example_gloss: 五月五日。
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: 6月6日
    gloss: 六月六日
    note: 这种说法同时包含日和月，不会产生歧义。
    example_gloss: 六月六日。
  ar.a1.unit04.lesson02.teach.line01:
    title: 询问日期
    gloss: 蕾拉询问今天的日期。
    note: ما تاريخ اليوم؟ 问的是日历上的日期，而不是时间。
    example_gloss: 蕾拉说：今天几号？
  ar.a1.unit04.lesson02.teach.line02:
    title: 说出日期
    gloss: 优素福说今天是5月5日。
    note: 回答以 اليوم 开头。
    example_gloss: 优素福说：今天是五月五日。
  ar.a1.unit04.lesson02.teach.line03:
    title: 提到一节课
    gloss: 蕾拉说她今天有一节课。
    note: عندي 意思是“我有”，之前在数字相关内容中出现过。
    example_gloss: 蕾拉说：谢谢。我今天有一节课。
  ar.a1.unit04.lesson02.teach.line04:
    title: 说明上课的日期
    gloss: 优素福说出上课的日期。
    note: في 表示课程发生的时间。
    example_gloss: 优素福说：课在五月五日。
