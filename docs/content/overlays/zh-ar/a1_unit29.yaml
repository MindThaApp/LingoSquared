    title: 萨拉问下雨的情况
    gloss: 萨拉：那下雨的时候呢？
  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: 动词随人称变化
    gloss: 动词随人称变化：أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī，我骑自行车去上班)，يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi，优素福骑自行车去他的单位上班)。
    note: 词首的字母 أ (a-) 表示“我”，ي (ya-) 表示“他”。عملي 末尾的 ي 表示“我的”，عمله 末尾的 ه 表示“他的”。
  ar.a1.unit29.lesson04.teach.ywsf_idhn_adhhb:
    title: 优素福回答
    gloss: 优素福：那我就和蕾拉一起坐火车。
  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: 谁怎么出行?
    gloss: 蕾拉每天坐火车去上班。优素福通常骑自行车，但下雨时也会坐火车。卡里姆更喜欢开车。萨拉住得近，走路去上班。你怎么去上班？
    note: 女性的动词（تسافر、تسكن、تمشي）以 ت (ta-) 开头，男性的动词（يركب、يذهب、يقود、يفضل）以 ي (ya-) 开头。
    glosses:
      تسافر: 出行
      كل: 每一
      يوم: 天
      بالقطار: 坐火车
      عملها: 工作
      يركب: 骑自行车
      غالبا: 通常
      أمطرت: 下雨
      يذهب: 乘坐
      يقود: 开车
      يفضل: 更喜欢
      السيارة: 汽车
      تسكن: 住
      قريبا: 附近
      وتمشي: 步行
      تذهب: 出行
  ar.a1.unit29.lesson05.teach.sara_tskn_qryba:
    title: 萨拉住得近，走路去上班
    gloss: 萨拉住得近，走路去上班。
  ar.a1.unit29.lesson06.teach.lyla_hl_nrkb:
