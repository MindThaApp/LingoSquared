    gloss: 在售票窗口，说 من فضلك (min faḍlik，请) 来礼貌地提出请求：تذكرة إلى القاهرة، من فضلك。对男性和女性，写法都一样。
    note: 沿用之前在服务场景中已经学过的正式用语。
