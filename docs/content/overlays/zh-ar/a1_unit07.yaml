course:
  title: 阿拉伯语 A1
  description: 面向日常交流的零基础现代标准阿拉伯语(福斯哈)。
units:
  ar.a1.unit07.food:
    title: 食物
lessons:
  ar.a1.unit07.lesson01.food_drink:
    title: 水和咖啡
  ar.a1.unit07.lesson02.cafe_exchange:
    title: 在咖啡馆
teaching:
  ar.a1.unit07.lesson01.teach.water:
    title: 水
    gloss: 水
    note: ماء（māʾ）的意思是“水”。
    example_gloss: 我想要水。
  ar.a1.unit07.lesson01.teach.coffee:
    title: 咖啡
    gloss: 咖啡
    note: قهوة（qahwa）的意思是“咖啡”。
    example_gloss: 我想要水和咖啡。
  ar.a1.unit07.lesson01.teach.bread:
    title: 面包
    gloss: 面包
    note: خبز（khubz）的意思是“面包”。在 أريد 或 تريدين 这类动词后作宾语时，写作 خبزا（khubzan）。
    example_gloss: 我想要面包。
  ar.a1.unit07.lesson01.teach.i_want:
    title: 我要
    gloss: 我要
    note: أريد（urīdu）是直接但规范的请求说法。
    example_gloss: 我想要水。
  ar.a1.unit07.lesson01.teach.please:
    title: 请
    gloss: 请
    note: من فضلك（min faḍlika；对女士说 min faḍliki）放在请求之后表示礼貌，也可以放在句首。
    example_gloss: 请给我一杯水。
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: 你要面包吗？
    gloss: 你要面包吗？
    note: تريدين（turīdīna）是对女士说的“你想要”，这里指蕾拉；对男士则说 تريد（turīdu）。
    example_gloss: 服务员说：你要面包吗？
  ar.a1.unit07.lesson02.teach.one_bread:
    title: 一片面包
    gloss: 一片面包
    note: قطعة خبز واحدة（qiṭʿat khubz wāḥida）给面包加上了可数的单位；واحدة 用阴性，是为了与 قطعة 保持一致。
    example_gloss: 我想要一片面包。
  ar.a1.unit07.lesson02.teach.here_you_are:
    title: 给你
    gloss: 给你
    note: 递东西给女士时说 تفضلي（tafaḍḍalī）；对男士则说 تفضل（tafaḍḍal）。
    example_gloss: 服务员说：给您。
  ar.a1.unit07.lesson02.teach.line01:
    title: 点单
    gloss: 蕾拉礼貌地点了水和咖啡。
    note: 点单时用 أريد 加上所要的东西。
    example_gloss: 蕾拉说：你好。请给我水和咖啡。
  ar.a1.unit07.lesson02.teach.line02:
    title: 继续追问
    gloss: 服务员问她要不要面包。
    note: هل 用来引出是非疑问句。
    example_gloss: 服务员说：你要面包吗？
  ar.a1.unit07.lesson02.teach.line03:
    title: 回答追问
    gloss: 蕾拉回答“是”，并要了一片面包。
    note: نعم 表示肯定的回答。
    example_gloss: 蕾拉说：是的，我想要一片面包。
  ar.a1.unit07.lesson02.teach.line04:
    title: 上餐
    gloss: 服务员说“给您”。
    note: تفضلي 为这次对话画上句号。
    example_gloss: 服务员说：给您。
