teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: 地方
    gloss: 地方
    note: مكان (makān) 是表示“地方”的通用词。هذا(这个)在数字单元中学过。
    example_gloss: 这是一个地方。
  ar.a1.unit09.lesson01.teach.library:
    title: 图书馆
    gloss: 图书馆
    note: مكتبة (maktaba) 可以指图书馆,也可以指书店;这里指图书馆。المكتبة (al-maktaba) 是“这个图书馆”。
    example_gloss: 图书馆在这里。
  ar.a1.unit09.lesson01.teach.market:
    title: 市场
    gloss: 市场
    note: سوق (sūq) 的意思是“市场”;السوق (as-sūq) 是“这个市场”。
    example_gloss: 市场在这里。
  ar.a1.unit09.lesson01.teach.cafe:
    title: 咖啡馆
    gloss: 咖啡馆
    note: مقهى (maqhā) 意思是咖啡馆，与 قهوة（咖啡）有关。المقهى (al-maqhā) 是“那家咖啡馆”。
    example_gloss: 咖啡馆在这里。
  ar.a1.unit09.lesson01.teach.here:
    title: 这里
    gloss: 这里
    note: هنا (hunā) 通常放在表示地点的词后面：المقهى هنا，咖啡馆在这里。这个句子里阿拉伯语不需要表示“是／在”的词。
    example_gloss: 咖啡馆在这里。
  ar.a1.unit09.lesson02.teach.where_library:
    title: 图书馆在哪里？
    gloss: 图书馆在哪里？
    note: أين (ayna) 用来问“哪里”；你在 من أين أنت؟（你来自哪里？）中见过它。
    example_gloss: 优素福说：图书馆在哪里？
  ar.a1.unit09.lesson02.teach.near:
    title: 近
    gloss: 附近
    note: قرب (qurba) 意思是“附近、靠近”，放在所指地点之前：قرب المكتبة，在图书馆附近。بالقرب من (bi-l-qurbi min) 意思相同。
    example_gloss: 咖啡馆在图书馆附近。
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: 图书馆在市场附近
    gloss: 图书馆在市场附近
    note: 这里阿拉伯语不需要单独表示“是／在”的词。
    example_gloss: 蕾拉说：图书馆在市场附近。
  ar.a1.unit09.lesson02.teach.line01:
    title: 问地点
    gloss: 优素福问图书馆在哪里。
    note: أين 用来引出询问地点的问句。
    example_gloss: 优素福说：图书馆在哪里？
  ar.a1.unit09.lesson02.teach.line02:
    title: 说明图书馆的位置
    gloss: 蕾拉说图书馆就在这里，市场附近。
    note: هنا 和 قرب 可以一起出现：在这里，市场附近。
    example_gloss: 蕾拉说：图书馆就在这里，市场附近。
  ar.a1.unit09.lesson02.teach.line03:
    title: 问咖啡馆在哪里
    gloss: 优素福问咖啡馆在哪里。
    note: و (wa，和) 与后面的词连写：وأين (wa-ayna)，“那……在哪里”。
    example_gloss: 优素福说：那咖啡馆在哪里？
  ar.a1.unit09.lesson02.teach.line04:
    title: 说明咖啡馆的位置
    gloss: 蕾拉说咖啡馆在图书馆附近。
    note: 地点 + قرب + 另一个地点：المقهى قرب المكتبة，咖啡馆在图书馆附近。
    example_gloss: 蕾拉说：咖啡馆在图书馆附近。
