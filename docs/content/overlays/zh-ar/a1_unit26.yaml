course:
  title: 阿拉伯语 A1
  description: 初级阿拉伯语，学习描述一个人的基本外貌：身高和年龄、头发和眼睛的颜色、问句 كيف تبدو؟ (kayfa tabdū?)，以及用 أطول من (aṭwal min) 比较两个人。
units:
  ar.a1.unit26.appearance:
    title: 描述外貌
lessons:
  ar.a1.unit26.lesson01.twyl_wqsyr_wkbyr_fy:
    title: 高、矮、年老和年轻
  ar.a1.unit26.lesson02.wsf_alshar:
    title: 描述头发
  ar.a1.unit26.lesson03.alaynan_wkyf_ybdw_alshkhs:
    title: 眼睛和询问某人的外貌
  ar.a1.unit26.lesson04.lyla_tsf_nwr:
    title: 蕾拉描述诺尔
  ar.a1.unit26.lesson05.mqarna_byn_krym_wsara:
    title: 比较卡里姆和萨拉
  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: 优素福认出诺尔
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: 高和矮
    gloss: 高的／矮的
    note: طويل (ṭawīl) 意为“高”，قصير (qaṣīr) 意为“矮”。形容女性时要加 ة：طويلة (ṭawīla)、قصيرة (qaṣīra)。
    example_gloss:
    - 萨拉个子高。
    - 卡里姆个子矮。
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: كبير في السن (kabīr fī as-sinn) 和 صغير في السن (ṣaghīr fī as-sinn) 描述的是对年龄的大致印象，而不是确切的岁数。
    example_gloss:
    - 爷爷年纪大了。
    - 优素福很年轻。
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 年龄：数字还是印象
    gloss: كم عمرك؟ (kam ʿumruka?) 问的是具体的岁数，而 كبير في السن (kabīr fī as-sinn) 只是不带数字的大致印象，例如 الجد كبير في السن (al-jadd kabīr fī as-sinn)。
    note: 想问某人确切的年龄，用 كم عمرك؟。这里的 كبير في السن 只是描述某人看起来年纪大。
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: 萨拉个子高，卡里姆个子矮
    gloss: 萨拉个子高，卡里姆个子矮。
    note: و (wa-) 连接两个句子，并与后面的词连写：وكريم (wa-karīm)。形容词要与名词保持一致：سارة طويلة 是阴性，كريم قصير 是阳性。
  ar.a1.unit26.lesson02.teach.alshar:
    title: 头发
    gloss: 头发
    note: الشعر (ash-shaʿr) 意为“头发”。ش 是日字母，所以 ال 中的 ل 不发音：ash-shaʿr。
    example_gloss: 优素福有黑色短发。
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: أشقر (ashqar)、بني (bunnī) 和 رمادي (ramādī) 用来描述头发，放在名词之后：شعر أشقر (shaʿr ashqar)。
    example_gloss:
    - 蕾拉有金色的头发。
    - 卡里姆有棕色的头发。
    - 爷爷头发灰白。
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: طويل (ṭawīl) 和 قصير (qaṣīr) 也可以描述头发：شعر طويل (shaʿr ṭawīl)、شعر قصير (shaʿr qaṣīr)。它们跟在 شعر 之后，而 شعر 是阳性词。
    example_gloss:
    - 萨拉有长发。
    - 卡里姆有短发。
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: 形容词放在名词后面
    gloss: 在阿拉伯语中，形容词放在名词之后，并与名词保持一致：شعر قصير (shaʿr qaṣīr)、شعر طويل (shaʿr ṭawīl)、شعر أشقر (shaʿr ashqar)、شعر بني (shaʿr bunnī)、شعر رمادي (shaʿr ramādī)、شعر أسود (shaʿr aswad)。
    note: شعر (shaʿr) 是阳性词，所以它的形容词也是阳性。名词不定指时，两个词都不加 ال。
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: 头发与她的头发
    gloss: شعر (shaʿr) 意为“头发”。加上代词 ها (hā，她的)，就成了 شعرها (shaʿruhā，她的头发)。
    note: 词尾 ها 表示所属者：شعرها（她的头发）、اسمها（她的名字）、عيناها（她的眼睛）。它与前面的词连写。
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: 优素福有黑色短发
    gloss: 优素福有黑色短发。
    note: ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad)：名字前的 ل (li-) 表示“拥有”，并与名字连写。
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: 蕾拉有金色长发
    gloss: 蕾拉有金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  ar.a1.unit26.lesson03.teach.alaynan:
    title: 眼睛
    gloss: 眼睛
    note: العينان (al-ʿaynān) 意为“眼睛”。它是双数名词：阿拉伯语用特殊的词尾 ان 专门表示“恰好两个”。
    example_gloss: 优素福有棕色的眼睛。
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: أزرق (azraq) 蓝色、بني (bunnī) 棕色、أخضر (akhḍar) 绿色是阳性形式。与 عينان 搭配时要用双数形式:زرقاوان (zarqāwān)、بنيتان (bunnīyatān)、خضراوان (khaḍrāwān)。
    example_gloss:
    - 蕾拉有蓝色的眼睛。
    - 卡里姆有棕色的眼睛。
    - 萨拉有绿色的眼睛。
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: 双数的眼睛,双数的形容词
    gloss: عينان (ʿaynān) 是双数,所以它的形容词也要用双数:عينان زرقاوان (ʿaynān zarqāwān)、عينان بنيتان (ʿaynān bunnīyatān)、عينان خضراوان (ʿaynān khaḍrāwān)。
    note: 在双数中,名词和形容词都要加词尾 ان。由于 عين 是阴性名词,形容词也要用阴性形式。
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: 蕾拉长什么样？
    gloss: 蕾拉长什么样？
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) 询问蕾拉的外貌。因为蕾拉是女性,所以用 تبدو (tabdū);如果问的是男性,则用 يبدو (yabdū)。
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: 蕾拉有一头金色长发和一双蓝眼睛
    gloss: 蕾拉有一头金色长发和一双蓝眼睛。
    note: لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān):ل + 人名表示“有”,و 连接头发和眼睛。
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: 蕾拉介绍努尔
    gloss: 蕾拉:语言咖啡馆要来一位新女孩,她叫努尔。
    note: ستأتي (sa-taʾtī) 意为“她将来”:س (sa-) 表示将来时,ت (ta-) 表示“她”。اسمها (ismuhā) 意为“她的名字”。
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: 优素福问她长什么样
    gloss: 优素福:好啊!她长什么样?
    note: كيف تبدو؟ (kayfa tabdū?) 这次没有出现名字:动词 تبدو 本身就表示“她看起来”。
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: 蕾拉描述努尔的身高和头发
    gloss: 蕾拉:她个子矮,有一头金色短发。
    note: قصيرة (qaṣīra) 是阴性,因为努尔是女性;但 شعر قصير أشقر 仍用阳性,因为 شعر 是阳性名词。
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: 优素福问她的眼睛
    gloss: 优素福:那她的眼睛呢?
    note: وعيناها (wa-ʿaynāhā) 意为“还有她的眼睛”:و (wa-) 连写在名词前,词尾的 ها (hā) 表示“她的”。
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: 蕾拉描述努尔的眼睛
    gloss: 蕾拉:她有一双绿色的眼睛。
    note: لها (lahā) 意为“她有”:ل (la-) + ها (hā)。عينان خضراوان (ʿaynān khaḍrāwān) 是双数名词加双数形容词。
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: 优素福能认出她
    gloss: 优素福:谢谢!那我就能认出她了。
    note: سأتعرف عليها (sa-ataʿarraf ʿalayhā) 意为“我会认出她”:س (sa-) 表示将来时,عليها 中的 ها 表示“她”。
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: 比较卡里姆和萨拉
    gloss: 卡里姆和萨拉是兄妹,但他们长得不一样。卡里姆个子矮,有棕色短发和棕色眼睛。萨拉比卡里姆高,有棕色长发和绿色眼睛。你长什么样?
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      أخ: 兄弟
      أخت: 姐妹
      تبدو: 看起来
      مختلفان: 不同的
      القامة: 矮(身高)
      قصير: 矮的
      بني: 棕色的
      شعر: 头发
      بنيتان: 棕色的
      وعينان: 眼睛
      أطول: 更高的
      طويل: 长的
      خضراوان: 绿色的
      المظهر: 外貌(一个人的长相)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: 用 أفعل 做比较
    gloss: 表示比较时,用 أفعل (afʿal) 形式 + من (min):سارة أطول من كريم (sāra aṭwal min karīm),萨拉比卡里姆高。
    note: طويل (ṭawīl) 在比较级中变为 أطول (aṭwal),من (min) 意为“比”。说女性时这个形式不变。
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: 萨拉的头发比卡里姆的长
    gloss: 萨拉的头发比卡里姆的长。
    note: لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm):أطول 保持阳性,因为 شعر 是阳性名词。
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: لدي (ladayya) 意为“我有”;阿拉伯语没有“有”这个动词。形容词放在名词后面:شعر قصير بني (shaʿr qaṣīr bunnī)。
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: 优素福发现了努尔
    gloss: 优素福:你看,那是努尔吗?她有金色短发和绿色眼睛。
    note: انظري (unẓurī) 是对女性说的命令式,因为优素福在对蕾拉说话;对男性则说 انظر (unẓur)。هذه (hādhihi) 意为“这”,用于阴性名词。
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: 蕾拉确认
    gloss: 蕾拉:对,那就是努尔!
    note: 这是一个简短自然的肯定回答。
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: 努尔向优素福问好
    gloss: 努尔:你好,你是优素福吗?
    note: هل أنت يوسف؟ (hal anta yūsuf?) 是是非问句:هل (hal) + 一个不带“是”动词的句子。
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: 优素福回应努尔
    gloss: 优素福:是的!很高兴认识你,努尔。
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) 是初次见面时的礼貌用语。ب (bi-) 连写在 معرفتك 前,词尾的 ك 表示“你”。
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: 努尔回应问候
    gloss: 努尔:我也很高兴认识你!
    note: 对话到此结束——优素福根据蕾拉之前的描述,成功认出了努尔。
