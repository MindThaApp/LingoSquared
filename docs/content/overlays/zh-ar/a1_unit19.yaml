teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: 房子
    gloss: 房子
    note: بيت（bayt）是“房子”；词尾 ـي 表示“我的”，所以 بيتي（baytī）是“我的家”。
    example_gloss: 我家在图书馆附近。
  ar.a1.unit19.lesson01.teach.room:
    title: 房间
    gloss: 房间
    note: غرفة（ghurfa）是阴性词（以 ة 结尾），所以后面跟阴性的 واحدة。
    example_gloss: 我家有一个房间。
  ar.a1.unit19.lesson01.teach.kitchen:
    title: 厨房
    gloss: 厨房
    note: مطبخ（maṭbakh）是“厨房”。阿拉伯语没有相当于“有”的词：以 في بيتي（在我家）开头就起到了这个作用。
    example_gloss: 我家有一个厨房。
  ar.a1.unit19.lesson01.teach.one_room:
    title: 一个房间
    gloss: 一个房间
    note: 数字“一”放在名词后面，并与名词保持一致：غرفة واحدة（ghurfa wāḥida）；阳性名词用 واحد。
    example_gloss: 我家有一个房间。
  ar.a1.unit19.lesson02.teach.table:
    title: 桌子
    gloss: 桌子
    note: طاولة（ṭāwila）是“桌子”；和 غرفة 一样以 ة 结尾，是阴性词。
    example_gloss: 我在房间里有一张桌子。
  ar.a1.unit19.lesson02.teach.in_room:
    title: 在房间里
    gloss: 在房间里
    note: الغرفة（al-ghurfa）的意思是“这个房间”。
    example_gloss: 桌子在房间里。
  ar.a1.unit19.lesson02.teach.near_library:
    title: 在图书馆附近
    gloss: 在图书馆附近
    note: قرب（qurb）意思是“附近”；المكتبة 是“图书馆”，在地点单元学过。
    example_gloss: 我家在图书馆附近。
  ar.a1.unit19.lesson02.teach.line01:
    title: 问“在哪里”
    gloss: 莱拉问优素福的家在哪里。
    note: أين 用来问“在哪里”；بيتك（baytuka）是“你的家”，对男性说；对女性说是 baytuki，写法相同。
    example_gloss: 莱拉说：优素福，你家在哪里？
  ar.a1.unit19.lesson02.teach.line02:
    title: 家的位置
    gloss: 优素福说他家在图书馆附近。
    note: بيتي 意思是“我的家”。
    example_gloss: 优素福说：我家在图书馆附近。
  ar.a1.unit19.lesson02.teach.line03:
    title: 房间
    gloss: 优素福说他家有一个房间和一个厨房。
    note: و（wa，“和”）连接两个家居设施，并与后面的词连写：ومطبخ。
    example_gloss: 优素福说：我家有一个房间和一个厨房。
  ar.a1.unit19.lesson02.teach.line04:
    title: 询问物品
    gloss: 莱拉问优素福有没有桌子。
    note: هل 用来引出是非疑问句；عندك（ʿindaka）意思是“你有”，对男性说；对女性说是 ʿindaki，写法相同。
    example_gloss: 莱拉说：你有桌子吗？
  ar.a1.unit19.lesson02.teach.line05:
    title: 物品的位置
    gloss: 优素福说他在房间里有一张桌子。
    note: عندي 表示拥有。
    example_gloss: 优素福说：是的，我在房间里有一张桌子。
