    title: 街区里谁是谁？
    gloss: 优素福住在亚历山大港一个漂亮的街区，离超市很近。萨米是优素福的男邻居，玛丽亚姆是优素福的女邻居。萨米非常友好，每天都向优素福问好。优素福很了解萨米和玛丽亚姆。
    note: 一段关于邻居的短文。جار (jār) 指男邻居，جارة (jāra) 指女邻居：词尾的 ة 表示阴性。
