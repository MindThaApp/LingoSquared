  ar.a1.unit38.lesson05.teach.nwr_wlyla_tdhhban:
    title: 努尔和蕾拉买玫瑰
    gloss: 努尔和蕾拉星期六去花市。蕾拉想要哪种颜色？蕾拉想要红色。努尔想要哪种颜色？努尔想要黄色。她们买了五朵玫瑰花。价钱是十迪拉姆。玫瑰花非常漂亮！
    note: 一段关于逛市场的短文。颜色词要与所描述的对象保持一致：الأحمر (al-aḥmar) 指颜色本身，而 الورود حمراء (al-wurūd ḥamrāʾ) 用阴性形式来形容玫瑰花。
