teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: 家庭
    gloss: 家庭
    note: عائلة（ʿāʾila）是“家庭”的通用说法。例句中的 هذه 是 هذا（这）的阴性形式，因为 عائلة 是阴性名词。
    example_gloss: 这是一个家庭。
  ar.a1.unit06.lesson01.teach.father:
    title: 父亲
    gloss: 父亲
    note: أب（ab）的意思是“父亲”。
    example_gloss: 我有一位父亲。
  ar.a1.unit06.lesson01.teach.mother:
    title: 母亲
    gloss: 母亲
    note: أم（umm）的意思是“母亲”。
    example_gloss: 我有一位母亲。
  ar.a1.unit06.lesson01.teach.brother:
    title: 哥哥／弟弟
    gloss: 兄弟
    note: أخ（akh）的意思是“兄弟”。
    example_gloss: 我有一个哥哥/弟弟。
  ar.a1.unit06.lesson01.teach.sister:
    title: 姐姐／妹妹
    gloss: 姐妹
    note: أخت（ukht）的意思是“姐妹”。
    example_gloss: 我有一个兄弟和一个姐妹。
  ar.a1.unit06.lesson01.teach.i_have:
    title: 我有
    gloss: 我有
    note: عندي（ʿindī，字面意思是“在我这里”）是 A1 阶段表达“拥有某物”的简单说法；لدي（ladayya）是较正式的同义说法。
    example_gloss: 我有一个姐妹。
  ar.a1.unit06.lesson02.teach.in_family:
    title: 在你的家人中
    gloss: 在你的家庭里
    note: 这里的 من 读作 man，意思是“谁”，不是 min“来自”（如 من أين أنت؟）——两者写法相同。عائلتك 的意思是“你的家庭”：对男性说读 ʿāʾilatuka，对女性说读 ʿāʾilatuki。
    example_gloss: 你的家里有谁？
  ar.a1.unit06.lesson02.teach.sister_name:
    title: 她的名字叫诺尔
    gloss: 她的名字叫诺尔
    note: اسمها 的意思是“她的名字”。
    example_gloss: 优素福说：她的名字叫诺尔。
  ar.a1.unit06.lesson02.teach.line01:
    title: 询问家人
    gloss: 莱拉问优素福家里有谁。
    note: 这里的 من（man）意思是“谁”。يا يوسف 是用名字称呼优素福。
    example_gloss: 莱拉说：优素福，你家里有谁？
  ar.a1.unit06.lesson02.teach.line02:
    title: 介绍家人
    gloss: 优素福说他有父亲、母亲和一个姐妹。
    note: و 用来连接家庭成员。
    example_gloss: 优素福说：我有父亲、母亲和一个姐妹。
  ar.a1.unit06.lesson02.teach.line03:
    title: 询问姐妹的名字
    gloss: 莱拉问他姐妹的名字。
    note: أختك 的意思是“你的姐妹”：对男性说读 ukhtuka，对女性说读 ukhtuki。这里莱拉问的是优素福，所以读 ukhtuka。
    example_gloss: 莱拉说：你姐妹叫什么名字？
  ar.a1.unit06.lesson02.teach.line04:
    title: 说出她的名字
    gloss: 优素福说她的名字叫诺尔。
    note: 词尾 ـها 表示“她的”：اسمها（ismuhā），她的名字。
    example_gloss: 优素福说：她的名字叫诺尔。
