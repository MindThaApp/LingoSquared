  description: 面向日常交流的零基础现代标准阿拉伯语(福斯哈)。
units:
  ar.a1.unit22.emotions:
    title: 情绪
lessons:
  ar.a1.unit22.lesson01.feeling_cause:
    title: 我很开心
  ar.a1.unit22.lesson02.ask_feelings:
