teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: 感受
    gloss: 感受
    note: شعور (shuʿūr) 意思是“感受”。
    example_gloss: 这是一种感受。
  ar.a1.unit22.lesson01.teach.happy:
    title: 开心
    gloss: 高兴的
    note: سعيد (saʿīd) 用于男性；女性说 أنا سعيدة (anā saʿīda)。
    example_gloss: 我很开心。
  ar.a1.unit22.lesson01.teach.sad:
    title: 难过
    gloss: 伤心的
    note: حزين (ḥazīn) 用于男性；女性说 أنا حزينة (anā ḥazīna)。
    example_gloss: 我很伤心。
  ar.a1.unit22.lesson01.teach.because:
    title: 因为
    gloss: 因为
    note: لأن (li-anna) 用来引出原因。
    example_gloss: 我很开心，因为天气晴朗。
  ar.a1.unit22.lesson02.teach.how_feel:
    title: 你感觉怎么样？
    gloss: 你感觉怎么样？
    note: كيف تشعر؟ (kayfa tashʿur) 用来问男士的感受；问女士则说 كيف تشعرين؟ (kayfa tashʿurīn)。
    example_gloss: 你感觉怎么样，优素福？
  ar.a1.unit22.lesson02.teach.tired:
    title: 累的
    gloss: 疲倦
    note: متعب (mutʿab) 用于男性；متعبة (mutʿaba) 用于女性，所以蕾拉说 أنا متعبة。
    example_gloss: 我累了。
  ar.a1.unit22.lesson02.teach.okay:
    title: 还好
    gloss: 还好
    note: بخير (bi-khayr) 意思是“还好”,字面意思是“处于良好(的状态)”。
    example_gloss: 你还好吗？
  ar.a1.unit22.lesson02.teach.line01:
    title: 询问感受
    gloss: 蕾拉问优素福感觉怎么样。
    note: يا (yā) 放在被称呼者的名字之前。
    example_gloss: 蕾拉说：优素福，你感觉怎么样？
  ar.a1.unit22.lesson02.teach.line02:
    title: 感受和原因
    gloss: 优素福说他很开心，因为天气晴朗。
    note: 这句话同时说出了感受和原因。
    example_gloss: 优素福说：我很开心，因为天气晴朗。
  ar.a1.unit22.lesson02.teach.line03:
    title: 另一种感受
    gloss: 蕾拉说她很累，因为她有工作。
    note: متعبة 是阴性形式，与蕾拉(女性)一致。
    example_gloss: 蕾拉说：我很累，因为我有工作。
  ar.a1.unit22.lesson02.teach.line04:
    title: 确认是否安好
    gloss: 优素福问蕾拉是否还好。
    note: هل (hal) 用来引导是非问句。优素福问的是蕾拉，所以 أنت 读作 anti(对男性则读 anta)。
    example_gloss: 优素福说：你还好吗？
  ar.a1.unit22.lesson02.teach.line05:
    title: 回答“是”
    gloss: 蕾拉回答“是”,并向他道谢。
    note: نعم 是表示“是”的回答。
    example_gloss: 蕾拉说：是的，谢谢。
