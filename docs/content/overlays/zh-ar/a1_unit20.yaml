teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: 天气
    gloss: 天气
    note: الجو (al-jaww) 是表示“天气”的日常用词；单元标题中的 الطقس (aṭ-ṭaqs) 也表示天气。
    example_gloss: 今天天气怎么样？
  ar.a1.unit20.lesson01.teach.sunny:
    title: 晴天
    gloss: 晴朗的
    note: مشمس (mushmis) 意思是“晴朗的”；它是阳性，与 الجو 保持一致。
    example_gloss: 今天天气晴朗。
  ar.a1.unit20.lesson01.teach.cold:
    title: 寒冷
    gloss: 寒冷的
    note: بارد (bārid) 意思是“冷的”。
    example_gloss: 今天天气很冷。
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: 今天晴天
    gloss: 今天天气晴朗
    note: 阿拉伯语不需要单独的词来表示“是”。
    example_gloss: 优素福说：今天天气晴朗。
  ar.a1.unit20.lesson02.teach.hot:
    title: 热
    gloss: 热
    note: حار (ḥārr) 意思是“热的”。
    example_gloss: 天气很热。
  ar.a1.unit20.lesson02.teach.weather_question:
    title: 天气怎么样？
    gloss: 今天天气怎么样？
    note: كيف (kayfa) 表示“如何、怎么样”，如 كيف حالك؟
    example_gloss: 蕾拉说：今天天气怎么样？
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: 我们去喝水吧
    gloss: 我们去喝水吧
    note: هيا (hayyā) 加“我们”形式的动词表示“我们……吧”；نشرب (nashrab) 意思是“我们喝”。
    example_gloss: 天气很热。我们去喝水吧。
  ar.a1.unit20.lesson02.teach.line01:
    title: 询问天气
    gloss: 蕾拉询问今天的天气。
    note: اليوم 意思是“今天”。
    example_gloss: 蕾拉说：今天天气怎么样？
  ar.a1.unit20.lesson02.teach.line02:
    title: 晴朗而炎热
    gloss: 优素福说天气晴朗而炎热。
    note: و (wa，和) 连接两个描述天气的词，并与后面的词连写：وحار。
    example_gloss: 优素福说：天气晴朗而炎热。
  ar.a1.unit20.lesson02.teach.line03:
    title: 提议去咖啡馆
    gloss: 蕾拉提议去咖啡馆。
    note: هل نذهب 的意思是“我们去……好吗”。
    example_gloss: 蕾拉说：我们去咖啡馆好吗？
  ar.a1.unit20.lesson02.teach.line04:
    title: 喝水的计划
    gloss: 优素福答应了，并提议去喝水。
    note: هيا نشرب 的意思是“我们喝水吧”。
    example_gloss: 优素福说：好，我们去喝水吧。
