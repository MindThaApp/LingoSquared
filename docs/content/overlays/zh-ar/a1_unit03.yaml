teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: 一
    gloss: 一
    note: واحد (wāḥid) 也可以单独使用，不带名词，用来回答“多少”。
    example_gloss: 我有一本书。
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: 二
    gloss: 二
    note: اثنان (ithnān) 是“二”单独使用时的基本形式。
    example_gloss: 我有两个兄弟。
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: 三
    gloss: 三
    note: ثلاثة (thalātha) 是“三”单独使用时的基本形式。
    example_gloss: 一，二，三。
  ar.a1.unit03.lesson01.teach.arbaa:
    title: 四
    gloss: 四
    note: أربعة (arbaʿa) 是“四”单独使用时的基本形式。
    example_gloss: 我有四本书。
  ar.a1.unit03.lesson01.teach.khamsa:
    title: 五
    gloss: 五
    note: خمسة (khamsa) 是“五”单独使用时的基本形式。
    example_gloss: 我有五本书。
  ar.a1.unit03.lesson02.teach.sitta:
    title: 六
    gloss: 六
    note: ستة (sitta) 是“六”单独使用时的基本形式。
    example_gloss: 我有六本书。
  ar.a1.unit03.lesson02.teach.sabaa:
    title: 七
    gloss: 七
    note: سبعة (sabʿa) 是“七”单独使用时的基本形式。
    example_gloss: 我有七本书。
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: 八
    gloss: 八
    note: ثمانية (thamāniya) 是“八”单独使用时的基本形式。
    example_gloss: 我有八本书。
  ar.a1.unit03.lesson02.teach.tisaa:
    title: 九
    gloss: 九
    note: تسعة (tisʿa) 是“九”单独使用时的基本形式。
    example_gloss: 我有九迪拉姆。
  ar.a1.unit03.lesson02.teach.ashara:
    title: 十
    gloss: 十
    note: عشرة (ʿashara) 是“十”单独使用时的基本形式。
    example_gloss: 我有十第纳尔。
  ar.a1.unit03.lesson03.teach.kam:
    title: 这个多少钱？
    gloss: 这个多少钱？
    note: كم هذا؟ (kam hādhā) 是询问价格的简单说法；بكم هذا؟ (bi-kam hādhā，“这个以多少钱？”) 也很常用。
  ar.a1.unit03.lesson03.teach.raqam:
    title: 数字；号码
    gloss: 数字；号码
    note: رقم (raqam) 是表示数字的通用词，也用于电话号码等。
    example_gloss: 我的号码是一。
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: 询问价格
    gloss: 优素福询问某样东西多少钱。
    note: كم هذا؟ 开启了这段对话。
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: 说出价格
    gloss: 蕾拉说这个五块钱。
    note: بخمسة 把介词 بـ（以、按）直接连在数字上。
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: 询问另一件东西
    gloss: 优素福指着另一样东西。
    note: وهذا؟ 借助前面的语境，把问句说得更简短。
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: 说出第二个价格
    gloss: 蕾拉说这个十块钱。
    note: بعشرة 的构成方式与 بخمسة 相同。
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: 道谢
    gloss: 优素福向她道谢。
    note: 问候单元中学过的 شكرا 为这段对话收尾。
