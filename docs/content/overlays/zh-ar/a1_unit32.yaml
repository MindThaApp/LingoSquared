  ar.a1.unit32.lesson05.teach.ywm_alsbt_ayd:
    title: 派对上谁做什么？
    gloss: 星期六是萨拉的生日。我们办聚会庆祝。优素福邀请卡里姆和蕾拉来参加聚会。卡里姆喜欢和朋友们一起庆祝。蕾拉也会来参加聚会。大家都为萨拉感到高兴。
    note: 回顾派对计划。
    glosses:
      السبت: 星期六
      ميلاد: 出生（如“生日”中的“生”）
      نحتفل: 庆祝
      بحفلة: 派对
      يدعو: 邀请
      إلى: 到（“邀请……来参加聚会”中的“来”）
      الاحتفال: 庆祝
      يحب: 喜欢
      الأصدقاء: 朋友们
      ستأتي: 来
      الجميع: 大家
      سعداء: 高兴的
  ar.a1.unit32.lesson05.teach.ywsf_ydaw_krym:
    title: 优素福邀请卡里姆和蕾拉
    gloss: 优素福邀请卡里姆和蕾拉来参加聚会。
  ar.a1.unit32.lesson05.teach.aljmya_sadaa_mn:
    title: 大家都为萨拉高兴
    gloss: 大家都为萨拉感到高兴。
  ar.a1.unit32.lesson06.teach.ywsf_ayd_mylad:
