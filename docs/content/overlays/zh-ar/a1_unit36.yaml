    title: 莱拉和优素福一起做饭
    gloss: 莱拉和优素福在亚历山大优素福家的厨房里一起做饭。莱拉切洋葱。优素福在平底锅里煎番茄。优素福准备饭菜。莱拉尝饭菜。饭菜很好吃！
    note: 一段关于一起做饭的短文。يطبخان (yaṭbukhān) 末尾的 ـان 表示他们两个人在做饭。
