teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: القراءة (al-qirāʾa) 是阅读，ممارسة الرياضة (mumārasat ar-riyāḍa) 是做运动，الطبخ (aṭ-ṭabkh) 是烹饪。它们都是名词，所以带有冠词 ال。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: 空闲时间
    gloss: 空闲时间
    note: وقت الفراغ (waqt al-farāgh) 字面意思是“空闲的时间”。第一个词不带 ال，只有第二个词带。
    example_gloss: 我空闲时喜欢阅读。
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: أحب (uḥibb) 是“我喜欢”，男女通用。فراغي (farāghī) 末尾的 ي 表示“我的”。
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) 是听音乐，الرسم (ar-rasm) 是画画，لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) 是玩电子游戏。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: الاستماع (al-istimāʿ) 后面要加 إلى (ilā，“向、到”)，再接所听的对象：الاستماع إلى الموسيقى。
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: مع (maʿa) 是“和、与”：مع الأصدقاء (maʿa al-aṣdiqāʾ)。冠词 ال 仍然连在 الأصدقاء 上。
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: دائما (dāʾiman)、كثيرا (kathīran)、أحيانا (aḥyānan) 和 أبدا (abadan) 都是副词，不随性别变化。词尾的 ا (alif) 不加任何符号。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: كل أسبوع (kull usbūʿ) 和 كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) 都用了 كل (kull，“每”)；见下一张卡片。
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 每：كل
    gloss: 在 كل (kull，“每”) 之后，名词用单数且不带 ال：كل أسبوع (kull usbūʿ)、كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ)。
    note: كل (kull) 形式不变：阳性名词 أسبوع 和阴性名词 عطلة 前都用同一个词。
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: 蕾拉聊起爱好
    gloss: 蕾拉：我们常常一起散步。不过优素福，你空闲时还做什么？
    note: نتمشى (natamashshā) 开头的字母 ن (na-) 表示“我们”，所以阿拉伯语不需要单独的“我们”一词。معا (maʿan) 是“一起”。
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: 优素福的爱好
    gloss: 优素福：我喜欢做饭，在家也做。我还经常做运动。
    note: في البيت أيضا (fī al-bayt ayḍan) 补充了“在家也”。وأمارس (wa-umāris) 把 و (“和”) 与动词连在一起，写成一个词。
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: 蕾拉感到惊讶
    gloss: 蕾拉：你在家也做饭？你工作中都已经做一整天饭了！
    note: تطبخ (taṭbukh) 是对男性说的“你做饭”；对女性要说 تطبخين (taṭbukhīn)。طوال اليوم (ṭawāl al-yawm) 是“一整天”。
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: 优素福解释
    gloss: 优素福：是的，不过我觉得做饭很放松。你呢，你喜欢做什么？
    note: أجد (ajid) 是“我觉得、我发现”，مريحا (murīḥan) 是“令人放松的”。وأنت (wa-anta) 是 و 加 أنت：“那你呢”。
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: 蕾拉的爱好
    gloss: 蕾拉：我喜欢阅读，也经常听音乐。
    note: و 连接两项爱好：أحب القراءة (uḥibb al-qirāʾa) 和 وأستمع (wa-astamiʿ，“并且我听”)。它与后面的词连写。
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: 优素福问起玩游戏
    gloss: 优素福：你也玩电子游戏吗？
    note: تلعبين (talʿabīn) 是对女性说的“你玩”，因为优素福问的是蕾拉；对男性则说 تلعب (talʿab)。هل (hal) 引出是非疑问句。
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: 蕾拉的回答
    gloss: 蕾拉：不，我从不玩电子游戏。不过我有时画画！
    note: أبدا (abadan) 是“从不”，أحيانا (aḥyānan) 是“有时”。动词用 لا (lā) 否定：لا ألعب (lā alʿab) 是“我不玩”。
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: 比较爱好
    gloss: 我和优素福经常一起散步。不过我们还有其他爱好。优素福喜欢做饭，在家也做，还经常做运动。我喜欢阅读，也经常听音乐。我有时画画，但从不玩电子游戏。你空闲时喜欢做什么？
    note: 蕾拉的消息回顾了前面课程中的内容，并以本单元的核心问题向读者提问作结。
    glosses:
      نتمشى: 散步
      كثيرا: 经常
      معا: 一起
      أخرى: 其他的
      يطبخ: 做饭
      يحب: 喜欢
      البيت: 房子（在家）
      ويمارس: 锻炼
      أقرأ: 阅读
      وأستمع: 听
      الموسيقى: 音乐
      أرسم: 画画
      أحيانا: 有时
      ألعب: 玩（电子游戏）
      أبدا: 从不
      فراغك: 你的空闲（时间）
      وقت: 时间
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: 优素福问周末的安排
    gloss: 优素福：这个周末你打算做什么？
    note: ستفعلين (sa-tafʿalīn) 是将来时：开头的字母 س (sa-) 表示将来，词尾 ين 表示对象是女性。عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) 是周末。
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: 蕾拉还没拿定主意
    gloss: 蕾拉：我还不知道。我喜欢阅读，不过我也想出去走走。
    note: لا أعرف بعد (lā aʿrif baʿd) 是“我还不知道”。أن أخرج (an akhruj) 是“出去”。
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: 优素福提出计划
    gloss: 优素福：我们一起去散步好吗？之后我给我们做饭。
    note: هل نتمشى (hal natamashshā) 是提议一起做某事的常用说法：هل + 表示“我们”的动词。لنا (lanā) 是 ل（“为”）+ نا（“我们”），连写成一个词。
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: 蕾拉同意
    gloss: 蕾拉：好主意！散步和做饭我都喜欢。
    note: كليهما (kilayhimā) 是“两者都”，放在末尾，指前面提到的两件事：المشي والطبخ (al-mashy wa-aṭ-ṭabkh)。
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: 优素福确认
    gloss: 优素福：太好了。那周六见！
    note: يوم السبت (yawm as-sabt) 是“在周六”。ال 中的 ل 在 س 这个日字母前不发音，所以读作 as-sabt。
