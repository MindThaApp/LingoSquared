  ar.a1.unit08.lesson01.teach.price:
    title: 价格
    gloss: 价格
    note: سعر (siʿr) 的意思是“价格”。
    example_gloss: 苹果多少钱？
  ar.a1.unit08.lesson01.teach.apple:
    title: 苹果
    gloss: 苹果
    note: تفاح (tuffāḥ) 是表示“苹果”的集合名词；一个苹果是 تفاحة (tuffāḥa)。
    example_gloss: 苹果十迪拉姆。
  ar.a1.unit08.lesson01.teach.dirhams:
    title: 迪拉姆
    gloss: 迪拉姆
    note: دراهم (darāhim) 是 درهم (dirham,迪拉姆)的复数，迪拉姆是摩洛哥和阿联酋的货币；数字3至10之后用复数。
    example_gloss: 我有十迪拉姆。
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: 苹果多少钱？
    gloss: 苹果多少钱？
    note: كم سعر التفاح؟ (kam siʿr at-tuffāḥ) 字面意思是“苹果的价格是多少”。ما سعر التفاح؟(价格是多少)和 بكم التفاح؟(苹果多少钱)也是标准说法。
    example_gloss: 莱拉说：苹果多少钱？
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: 十迪拉姆
    gloss: 十迪拉姆
    note: 前缀 بـ (bi-) 表示价格：بعشرة (bi-ʿashara),即“以十(的价格)”。
    example_gloss: 苹果十迪拉姆。
  ar.a1.unit08.lesson02.teach.two_apples:
    title: 两个苹果
    gloss: 两个苹果
    note: تفاحتين (tuffāḥatayn) 是 تفاحة(一个苹果)的双数形式，为 أريد 之后使用的宾格形式。
    example_gloss: 两个苹果。
  ar.a1.unit08.lesson02.teach.want_two:
    title: 我要两个苹果
    gloss: 我要两个苹果
    note: أريد 要放在所要的东西之前。
    example_gloss: 我要两个苹果。
  ar.a1.unit08.lesson02.teach.line01:
    title: 询问价格
    gloss: 莱拉询问苹果的价格。
    note: 这是同一个询问价格的句型。
    example_gloss: 莱拉说：苹果多少钱？
  ar.a1.unit08.lesson02.teach.line02:
    title: 说出价格
    gloss: 卖家说苹果十迪拉姆。
    note: بعشرة 是把表示价格的前缀加在 عشرة 上。
    example_gloss: 卖家说：苹果十迪拉姆。
  ar.a1.unit08.lesson02.teach.line03:
    title: 提出数量要求
    gloss: 莱拉礼貌地要两个苹果。
    note: من فضلك 让请求显得礼貌。
    example_gloss: 莱拉说：我要两个苹果，谢谢。
  ar.a1.unit08.lesson02.teach.line04:
    title: 把东西递给对方
    gloss: 卖家说“给你”。
    note: تفضلي 在食物单元学过；对女士说 تفضلي,对男士说 تفضل。
    example_gloss: 卖家说：给你。
