teaching:
  ar.a1.unit24.lesson01.teach.money:
    title: 钱
    gloss: 钱
    note: مال（māl）泛指“钱”。
    example_gloss: 这是钱。
  ar.a1.unit24.lesson01.teach.pay:
    title: 我付款
    gloss: 我付款
    note: أدفع（adfaʿ）的意思是“我付款”。
    example_gloss: 我付十迪拉姆。
  ar.a1.unit24.lesson01.teach.card:
    title: 银行卡
    gloss: 银行卡
    note: بطاقة（biṭāqa）的意思是“卡”；بالبطاقة（bil-biṭāqa）的意思是“用卡”。在 سأدفع（sa-adfaʿ）中，前缀 سـ 使 أدفع 变成将来时：我将付款。
    example_gloss: 我用银行卡付款。
  ar.a1.unit24.lesson01.teach.cash:
    title: 现金
    gloss: 现金
    note: نقدا（naqdan）的意思是“用现金”。
    example_gloss: 我付现金。
  ar.a1.unit24.lesson02.teach.amount:
    title: 金额
    gloss: 金额
    note: مبلغ（mablagh）指一笔钱的数额；كم المبلغ؟（kam al-mablagh）用来问要付多少钱。
    example_gloss: 金额是多少？
  ar.a1.unit24.lesson02.teach.can_pay:
    title: 我可以付款吗？
    gloss: 我可以刷卡吗？
    note: هل أستطيع（hal astaṭīʿ）的意思是“我可以……吗”；الدفع（ad-dafʿ）的意思是“付款”。
    example_gloss: 我可以付现金吗？
  ar.a1.unit24.lesson02.teach.line01:
    title: 询问金额
    gloss: 莱拉询问金额。
    note: كم 用来问“多少”。
    example_gloss: 莱拉说：金额是多少？
  ar.a1.unit24.lesson02.teach.line02:
    title: 告知金额
    gloss: 卖家说金额是十迪拉姆。
    note: دراهم（darāhim）是购物单元中出现过的货币词。
    example_gloss: 卖家说：金额是十迪拉姆。
  ar.a1.unit24.lesson02.teach.line03:
    title: 询问刷卡付款
    gloss: 莱拉问能不能刷卡付款。
    note: 这句话用来询问是否接受某种付款方式。
    example_gloss: 莱拉说：我可以刷卡吗？
  ar.a1.unit24.lesson02.teach.line04:
    title: 提供付款方式
    gloss: 卖家说可以刷卡或付现金。
    note: أو（aw）的意思是“或者”。
    example_gloss: 卖家说：可以，或者付现金。
  ar.a1.unit24.lesson02.teach.line05:
    title: 选择付款方式
    gloss: 莱拉说她用银行卡付款。
    note: 这样就完成了付款方式的选择。
    example_gloss: 莱拉说：我用银行卡付款。
