course:
  title: 阿拉伯语 A1
  description: 面向日常交流的零基础现代标准阿拉伯语(福斯哈)。
units:
  ar.a1.unit15.comparisons:
    title: 比较
lessons:
  ar.a1.unit15.lesson01.basic_comparisons:
    title: 更大和更小
  ar.a1.unit15.lesson02.compare_choices:
    title: 更近与更便宜
teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: 比
    gloss: 比
    note: من (min)与“来自”是同一个词（أنا من لبنان）；放在比较词之后则表示“比”。
    example_gloss: 市场比咖啡馆大。
  ar.a1.unit15.lesson01.teach.bigger:
    title: 更大
    gloss: 更大
    note: أكبر (akbar) 来自 كبير (kabīr，大)。أكبر、أصغر、أقرب、أرخص 这类比较词都以 أ 开头，修饰阳性和阴性名词时形式不变。
    example_gloss: 市场比咖啡馆大。
  ar.a1.unit15.lesson01.teach.smaller:
    title: 更小
    gloss: 更小
    note: أصغر (aṣghar)意为“更小”，与 أكبر 的 أ 形式相同。
    example_gloss: 咖啡馆比市场小。
  ar.a1.unit15.lesson01.teach.nearer:
    title: 更近
    gloss: 更近
    note: أقرب (aqrab)用来比较距离：更近。
    example_gloss: 咖啡馆比市场近。
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: 市场更大
    gloss: 市场比咖啡馆大
    note: 这种比较句中，阿拉伯语不需要单独的“是”。
    example_gloss: 优素福说：市场比咖啡馆大。
  ar.a1.unit15.lesson02.teach.nearer:
    title: 更近
    gloss: 更近
    note: أقرب (aqrab)用来比较距离：更近。
    example_gloss: 咖啡馆比市场近。
  ar.a1.unit15.lesson02.teach.cheaper:
    title: 更便宜
    gloss: 更便宜
    note: أرخص (arkhaṣ)用来比较价格：更便宜。
    example_gloss: 水比咖啡便宜。
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: 咖啡馆更近
    gloss: 咖啡馆比市场近
    note: 第二个比较对象前要保留 من。
    example_gloss: 优素福说：咖啡馆比市场近。
  ar.a1.unit15.lesson02.teach.line01:
    title: 询问偏好
    gloss: 蕾拉问优素福更喜欢什么。
    note: 蕾拉说 تفضل (tufaḍḍil)，因为她在问一位男士；问女士则说：ماذا تفضلين؟
    example_gloss: 蕾拉说：你更喜欢什么？
  ar.a1.unit15.lesson02.teach.line02:
    title: 更喜欢咖啡馆
    gloss: 优素福说他更喜欢咖啡馆。
    note: أفضل 后面可以直接接地点，表示偏好的选项。
    example_gloss: 优素福说：我更喜欢咖啡馆。
  ar.a1.unit15.lesson02.teach.line03:
    title: 比较距离
    gloss: 优素福说咖啡馆比市场近。
    note: أقرب من 说明了理由。
    example_gloss: 优素福说：咖啡馆比市场近。
  ar.a1.unit15.lesson02.teach.line04:
    title: 比较大小
    gloss: 努尔补充说市场比咖啡馆大。
    note: والسوق (was-sūq)是 و（和）与 السوق 连写：而且市场。
    example_gloss: 努尔说：而且市场比咖啡馆大。
