teaching:
  ar.a1.unit16.lesson01.teach.ticket:
    title: 票
    gloss: 车票
    note: تذكرة (tadhkira)是阴性名词：以 ة 结尾的词通常是阴性。
    example_gloss: 我想要一张票。
  ar.a1.unit16.lesson01.teach.train:
    title: 火车
    gloss: 火车
    note: القطار (al-qiṭār)：ال 表示特指，相当于“这／那”。
    example_gloss: 火车五点开。
  ar.a1.unit16.lesson01.teach.to_cairo:
    title: 去开罗
    gloss: 去开罗
    note: القاهرة (al-qāhira)是开罗；إلى (ilā)表示目的地。
    example_gloss: 我想要一张去开罗的票。
  ar.a1.unit16.lesson01.teach.ticket_request:
    title: 我想要一张票
    gloss: 我想要一张去开罗的票
    note: أريد 可用于简单的出行请求。
    example_gloss: 请给我一张去开罗的票。
  ar.a1.unit16.lesson02.teach.platform:
    title: 站台
    gloss: 站台
    note: الرصيف (ar-raṣīf)是火车站台；这个词也可指人行道。
    example_gloss: 站台在这里。
  ar.a1.unit16.lesson02.teach.second_platform:
    title: 二号站台
    gloss: 二号站台
    note: الثاني (ath-thānī)意为“第二”,这里是阳性形式,与 الرصيف 一致;它像形容词一样放在名词后面,并且也要加 ال。
    example_gloss: 从二号站台。
  ar.a1.unit16.lesson02.teach.which_platform:
    title: 哪个站台?
    gloss: 从哪个站台?
    note: أي (ayy)用来询问“哪一个”。
    example_gloss: 蕾拉说:从哪个站台?
  ar.a1.unit16.lesson02.teach.line01:
    title: 蕾拉买票
    gloss: 蕾拉要买一张去开罗的票。
    note: من فضلك 让请求显得礼貌。
    example_gloss: 蕾拉说:请给我一张去开罗的票。
  ar.a1.unit16.lesson02.teach.line02:
    title: 发车时间
    gloss: 工作人员告知火车的时间。
    note: في الساعة 用来引出发车时间。
    example_gloss: 工作人员说:火车五点开。
  ar.a1.unit16.lesson02.teach.line03:
    title: 询问站台
    gloss: 蕾拉问是哪个站台。
    note: 在 أي 之后,رصيف 不带 ال。
    example_gloss: 蕾拉说:从哪个站台?
  ar.a1.unit16.lesson02.teach.line04:
    title: 回答站台
    gloss: 工作人员说是二号站台。
    note: من الرصيف الثاني 回答了关于站台的问题。
    example_gloss: 工作人员说:从二号站台。
