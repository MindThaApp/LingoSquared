teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: 动物与宠物
    gloss: 动物／宠物
    note: حيوان（ḥayawān）意思是动物，حيوان أليف（ḥayawān alīf）意思是宠物。أليف（alīf）是形容词，意思是温顺的，放在名词之后。
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 蕾拉有一只狗。
    - 卡里姆有一只猫。
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - 努尔有一只鸟。
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: هل لديك（hal ladayka）意思是“你有……吗”。问女士时写法相同，但最后一个元音是 i：ladayki。هل（hal）用来引出是非问句。
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: ليس لدي（laysa ladayya）意思是“我没有”：ليس（laysa）表示否定，لدي（ladayya）意思是“我有”。
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 表示“没有”：ليس لدي
    gloss: 要说自己没有某物，用 ليس لدي（laysa ladayya）：ليس لدي وقت（我没有时间），ليس لدي حيوان أليف（我没有宠物）。
    note: ليس لدي 可以搭配任何名词，不随性别变化。说“他”和“她”时分别用 ليس لديه（laysa ladayhi）和 ليس لديها（laysa ladayhā）。
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: 遛（动物）
    gloss: 遛（动物）
    note: أخذ الحيوان في نزهة（akhdh al-ḥayawān fī nuzha）字面意思是带动物出去走走。动词是 أخذ，意思是“带，拿”。
    example_gloss: 我每天遛狗。
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: 动词随人称变化
    gloss: 动词随人称变化：آخذ الكلب في نزهة（ākhudh al-kalb fī nuzha），我带狗去散步；كريم يأخذ كلبه في نزهة（karīm yākhudh kalbahu fī nuzha），卡里姆带他的狗去散步。
    note: 开头的字母 أ（a-）表示“我”，ي（ya-）表示“他”。نزهة（nuzha）意思是散步或短途外出。
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: 和……玩
    gloss: 和……玩
    example_gloss: 卡里姆和他的猫玩。
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: كل يوم（kull yawm）意思是每天：كل + 不带 ال 的单数名词。
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: أطعم（uṭʿim）意思是“我喂”。القطة（al-qiṭṭa）是阴性名词，ال 与名词连写。
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 复数：كلب → كلاب
    gloss: 许多复数形式是不规则的，所以要连同名词一起记：كلب（kalb）的复数是 كلاب（kilāb），قطة（qiṭṭa）的复数是 قطط（qiṭaṭ），طائر（ṭāʾir）的复数是 طيور（ṭuyūr）。
    note: 阿拉伯语的复数大多是破碎复数，所以每个复数都要连同它的名词一起学；表示动物的复数要搭配阴性单数形容词。
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 优素福喜欢狗。
    - 萨拉喜欢猫。
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: أحب الحيوانات（uḥibb al-ḥayawānāt）意思是“我喜欢动物”。这个复数以 ات 结尾，冠词 ال 与它连写。
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: 萨拉喜欢猫，但没有宠物
    gloss: 萨拉喜欢猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: 优素福问起宠物
    gloss: 优素福：蕾拉，你有宠物吗？
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: 蕾拉有一只狗
    gloss: 蕾拉：有，我有一只狗。
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: 优素福问它长什么样
    gloss: 优素福：它长什么样？
    note: كيف يبدو؟（kayfa yabdū?）意思是“他（它）长什么样？”。يبدو（yabdū）用阳性，因为 كلب（狗）是阳性名词。
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: 蕾拉描述她的狗
    gloss: 蕾拉：它有棕色的毛，个头很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: 指代动物的代词
    gloss: 每个表示动物的词不是阳性就是阴性：狗用 هو（huwa，他/它），猫用 هي（hiya，她/它）。أطعمه（uṭʿimuhu）中的词尾 ه 意思是“他/它”（作宾语）。
    note: 像 كلب 这样的阳性动物词搭配阳性代词和形容词；像 قطة 这样的阴性词搭配阴性代词和形容词。
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: 优素福问遛狗的事
    gloss: 优素福：你每天都带它去散步吗？
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: 蕾拉说起她的日常
    gloss: 蕾拉：是的，我每天带它去散步，也喂它。
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: 优素福、萨拉和卡里姆谈动物
    gloss: 优素福和萨拉都喜欢动物，但两人都没有宠物。优素福喜欢狗，萨拉喜欢猫。卡里姆倒是有宠物：一只猫。他经常和他的猫玩，每天都喂猫。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      يحبان: 喜爱
      كلاهما: 两者都
      الحيوانات: 动物
      منهما: 他们之中的（两人都）
      أليف: 宠物（字面：温顺的）
      الكلاب: 狗
      القطط: 猫
      قطة: 猫
      يلعب: 玩
      ويعطي: 给
      كل: 每一
      طعاما: 食物
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: 卡里姆经常和他的猫玩
    gloss: 卡里姆经常和他的猫玩。
    note: قطته（qiṭṭatuhu）意思是“他的猫”：词尾 ه（hu）表示“他的”，قطة 的 ة 在它前面变成 ت。
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: 蕾拉问努尔
    gloss: 蕾拉：努尔，你也有宠物吗？
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: 努尔有一只叫皮科的鸟
    gloss: 努尔：有，我有一只鸟。它叫皮科。
    note: اسمه (ismuhu) 意思是“它的名字／他的名字”，词尾的 ه 表示“他的／它的”。بيكو (bīkū) 是这只鸟的名字。
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: 优素福的反应
    gloss: 优素福：太棒了！你每天和它做什么？
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: 努尔每天喂它
    gloss: 努尔：我每天喂它。
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: 优素福也喜欢鸟
    gloss: 优素福：我也喜欢鸟。
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: 蕾拉为对话作结
    gloss: 蕾拉：真好，我们三个人都喜欢动物！
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
