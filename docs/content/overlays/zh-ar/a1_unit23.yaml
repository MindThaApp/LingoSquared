teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: 电话
    gloss: 手机
    note: هاتف (hātif) 的意思是“电话”。
    example_gloss: 这是一部电话。
  ar.a1.unit23.lesson01.teach.hear:
    title: 我听得到你
    gloss: 我听得到你
    note: أسمعك(对男性说 asmaʿuka,对女性说 asmaʿuki)的意思是“我听得到你”;لا أسمعك (lā asmaʿuk) 的意思是“我听不到你”。
    example_gloss: 我听不到你。
  ar.a1.unit23.lesson01.teach.repeat:
    title: 重复
    gloss: 重复
    note: أعد (aʿid) 是对男性说的;对女性说 أعيدي (aʿīdī)。أعد من فضلك 是礼貌地请对方重复。
    example_gloss: 我听不到你。请重复一遍。
  ar.a1.unit23.lesson01.teach.slowly:
    title: 说慢一点
    gloss: 说慢一点
    note: تكلم ببطء (takallam bi-buṭʾ) 是对男性说的;对女性说 تكلمي ببطء (takallamī bi-buṭʾ)。
    example_gloss: 请说慢一点。
  ar.a1.unit23.lesson02.teach.message:
    title: 消息
    gloss: 消息
    note: رسالة (risāla) 是“消息”,也可以指“信”。
    example_gloss: 这是一条消息。
  ar.a1.unit23.lesson02.teach.appointment:
    title: 约定
    gloss: 预约
    note: موعد (mawʿid) 的意思是“约定、预约”;الموعد (al-mawʿid) 是“那个约定”。
    example_gloss: 约定在五点钟。
  ar.a1.unit23.lesson02.teach.line01:
    title: 接电话
    gloss: 优素福在电话里问候蕾拉,并说出自己的名字。
    note: 在电话里,أنا يوسف (anā Yūsuf) 用来表明打电话的人是谁。
    example_gloss: 优素福说:你好,我是优素福。
  ar.a1.unit23.lesson02.teach.line02:
    title: 听不到
    gloss: 蕾拉说她听不到优素福。
    note: 这句话引出接下来的澄清请求。
    example_gloss: 蕾拉说:你好,优素福,我听不到你。
  ar.a1.unit23.lesson02.teach.line03:
    title: 请对方慢点说
    gloss: 蕾拉请优素福说慢一点。
    note: من فضلك 使请求显得礼貌;蕾拉说 تكلم,因为她是对男性说话。
    example_gloss: 蕾拉说:请说慢一点。
  ar.a1.unit23.lesson02.teach.line04:
    title: 关键信息
    gloss: 优素福说约定在五点钟。
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) 的意思是“在五点钟”。
    example_gloss: 优素福说：约会在五点。
  ar.a1.unit23.lesson02.teach.line05:
    title: 请求重复
    gloss: 莱拉请优素福重复一遍。
    note: أعد من فضلك 是请对方重复的说法。
    example_gloss: 莱拉说：请重复一遍。
  ar.a1.unit23.lesson02.teach.line06:
    title: 重复细节
    gloss: 优素福重复约会的时间。
    note: 重复的这句话确认了时间。
    example_gloss: 优素福说：约会在五点。
