teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: 阿拉伯语从右向左书写
    gloss: 阿拉伯语从右向左书写。
    note: 阅读阿拉伯语时，从右边开始向左读。
  ar.a1.unit01.lesson01.teach.mim:
    title: 字母 م
    gloss: m
    note: م 表示 m 的音，在单词中的位置不同，字形也会随之变化。
  ar.a1.unit01.lesson01.teach.ra:
    title: 字母 ر
    gloss: r
    note: ر 表示颤舌的 r 音，且不与后面的字母相连。
  ar.a1.unit01.lesson01.teach.ha:
    title: 字母 ح
    gloss: ḥ
    note: ح 是从喉咙深处发出的带气流的 h 音，与普通话的 h（如“好”）不同，发音位置更靠后、更深。
  ar.a1.unit01.lesson01.teach.ba:
    title: 字母 ب
    gloss: b
    note: ب 表示 b 的音，可以与前后的字母相连。
  ar.a1.unit01.lesson01.teach.alef:
    title: 字母 ا
    gloss: ā / a
    note: ا 表示长元音 ā，不与后面的字母相连。
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: 拼写 مرحبا
    gloss: 你好
    note: مرحبا 读作 marḥaban。阿拉伯语书写时通常省略短元音。
    example_gloss: 你好！我是萨拉。
  ar.a1.unit01.lesson02.teach.marhaba:
    title: 你好
    gloss: 你好
    note: مرحبا 是一句亲切的通用问候语，几乎适用于任何场合。
    example_gloss: 嗨，你好吗？
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: 早上好
    gloss: 早上好
    note: صباح الخير 读作 ṣabāḥ al-khayr，字面意思是“美好的早晨”。
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: 下午好或晚上好
    gloss: 下午好 / 晚上好
    note: مساء الخير 读作 masāʾ al-khayr，从傍晚前后一直用到晚上。
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: 再见
    gloss: 再见
    note: مع السلامة 读作 maʿa as-salāma，字面意思是“带着平安”，是最常用的通用告别语。
    example_gloss: 谢谢，再见！
  ar.a1.unit01.lesson02.teach.shukran:
    title: 谢谢
    gloss: 谢谢
    note: شكرا 读作 shukran，各种语体和场合都可以使用。
    example_gloss: 非常感谢。
  ar.a1.unit01.lesson02.teach.afwan:
    title: 不客气
    gloss: 不客气
    note: عفوا（ʿafwan）是回应 شكرا 的惯用语；在其他语境中也可以表示“不好意思”。
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: 晚安
    gloss: 晚安
    note: تصبح على خير（tuṣbiḥ ʿalā khayr）用于晚上道别或睡前，不能用作见面时的问候。تصبح 是对男性说的形式；对女性则说 تصبحين على خير（tuṣbiḥīna ʿalā khayr）。
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: 欢迎
    gloss: 欢迎
    note: أهلا وسهلا（ahlan wa sahlan）用于欢迎客人，或在对方到来时热情地打招呼。
    example_gloss: 欢迎！欢迎你。
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: 再见
    gloss: 再见 / 下次见
    note: إلى اللقاء（ilā al-liqāʾ）是一句得体、中性的告别语。
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: 早上好（回应）
    gloss: 早上好［回应］
    note: صباح النور（ṣabāḥ an-nūr，“光明的早晨”）是回应 صباح الخير 的惯用语。
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: 晚上好（回应）
    gloss: 晚上好［回应］
    note: مساء النور（masāʾ an-nūr）是回应 مساء الخير 的惯用语。
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: 祝你有愉快的一天
    gloss: 祝你今天愉快
    note: يوما سعيدا（yawman saʿīdan）是一句亲切的结束祝福语。
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: 你好吗？
    gloss: 你好吗？
    note: كيف حالك؟（kayfa ḥāluk）是询问对方近况的标准说法；不标音符时，书写形式对任何听话人都适用。
  ar.a1.unit01.lesson04.teach.gender_note:
    title: 阳性的“你”和阴性的“你”
    gloss: 你（对男性）/ 你（对女性）
    note: 口语中阿拉伯语区分 أنتَ（anta，对男性）和 أنتِ（anti，对女性），حالَك 和 حالِك 也是同样的区别。不标这些音符时，本课程使用的书写形式对两者是相同的。
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: 很好
    gloss: 很好 / 挺好
    note: بخير（bikhayr）是回答 كيف حالك؟ 的标准肯定答复。
    example_gloss: 我今天很好。
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: 感谢真主
    gloss: 感谢真主 / 赞美真主
    note: الحمد لله（al-ḥamdu lillāh）回答时常常接在 بخير 之后，无论说话人是否有宗教信仰，它都相当于一句普通的会话收尾语，类似“托您的福”“还好”这样的客套话。
    example_gloss: 很好，感谢真主。
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: 你呢？
    gloss: 你呢？
    note: وأنت؟（对男性说 wa anta，对女性说 wa anti）用来把问题反问回去；不标音符时，两者的拼写相同。
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: 太棒了
    gloss: 极好 / 很棒
    note: ممتاز（mumtāz）比 بخير 语气更热情。
    example_gloss: 我今天好极了！
  ar.a1.unit01.lesson04.teach.la_bas:
    title: 不错
    gloss: 不错
    note: لا بأس（lā baʾs）是一种自然而不太热烈的回答，并不是在抱怨。
