teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: 衣服
    gloss: 衣服
    note: ملابس (malābis) 是复数名词,意思是“衣服”。
    example_gloss: 我想要衣服。
  ar.a1.unit21.lesson01.teach.shirt:
    title: 衬衫
    gloss: 衬衫
    note: قميص (qamīṣ) 意思是“衬衫”;在 أريد 之后作宾语,带宾格词尾 -an:قميصا (qamīṣan)。
    example_gloss: 我想要一件衬衫。
  ar.a1.unit21.lesson01.teach.blue:
    title: 蓝色
    gloss: 蓝色
    note: أزرق (azraq) 是阳性形式,与 قميص 一致;修饰阴性名词时变为 زرقاء (zarqāʾ)。在 أريد 之后,أزرق 不再加额外的 alif:قميصا أزرق。
    example_gloss: 我想要一件蓝色衬衫。
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: 一件蓝衬衫
    gloss: 一件蓝色衬衫
    note: 阿拉伯语中颜色放在物品之后:قميصا أزرق (qamīṣan azraq)。这与汉语“蓝色衬衫”的语序相反。
    example_gloss: 我想要一件蓝色衬衫。
  ar.a1.unit21.lesson02.teach.size:
    title: 尺码
    gloss: 尺码
    note: مقاس (maqās) 意思是“尺码”;ما المقاس؟ (mā l-maqās) 用来询问尺码。
    example_gloss: 什么尺码？
  ar.a1.unit21.lesson02.teach.medium:
    title: 中号
    gloss: 中号
    note: متوسط (mutawassiṭ) 意思是“中等的”;与 بـ (bi-,“在……方面/以”)连用,附在物品之后:قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ),即“一件中码的衬衫”。
    example_gloss: 我想要一件中码的衬衫。
  ar.a1.unit21.lesson02.teach.price:
    title: 十迪拉姆
    gloss: 十迪拉姆
    note: بعشرة (bi-ʿashara) 意思是“以十(迪拉姆)的价格”:前缀 بـ 表示价格,和购物单元中一样。
    example_gloss: 这件衬衫十迪拉姆。
  ar.a1.unit21.lesson02.teach.line01:
    title: 提出需求
    gloss: 蕾拉想要一件蓝色衬衫。
    note: من فضلك 让请求显得礼貌。
    example_gloss: 蕾拉说:我想要一件蓝色衬衫,麻烦您。
  ar.a1.unit21.lesson02.teach.line02:
    title: 询问尺码
    gloss: 售货员询问尺码。
    note: 售货员询问尺码:ما المقاس؟
    example_gloss: 售货员说:什么尺码?
  ar.a1.unit21.lesson02.teach.line03:
    title: 说出尺码
    gloss: 蕾拉说要中码。
    note: 这是对尺码问题的直接回答。
    example_gloss: 蕾拉说:中码。
  ar.a1.unit21.lesson02.teach.line04:
    title: 递上商品并报价
    gloss: 售货员递上衬衫并说出价格。
    note: تفضلي (tafaḍḍalī) 是递东西给女士时说的;对男士则说 تفضل (tafaḍḍal)。
    example_gloss: 售货员说:给您。这件衬衫十迪拉姆。
