    title: 谁学什么？
    gloss: 卡里姆不只是工作，还在学习。他在成人教育中心上西班牙语课程。他每周学新单词。萨拉在学院读一个学习项目。她在那里学习医疗保健。两个人都喜欢学习。你学什么，或者你想学什么？
    note: 对比卡里姆和萨拉的学习情况，与科技单元的对比阅读形式相同。
