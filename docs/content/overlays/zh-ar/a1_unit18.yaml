teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: 工作
    gloss: 工作
    note: عمل(ʿamal)的意思是工作。ما عملك؟ 询问对方的工作;词尾 ـك 表示“你的”:对男性是 ʿamaluka,对女性是 ʿamaluki,写法相同。
    example_gloss: 你的工作是什么?
  ar.a1.unit18.lesson01.teach.engineer:
    title: 工程师
    gloss: 工程师
    note: مهندس(muhandis)是阳性形式,用于优素福;女性说 أنا مهندسة(anā muhandisa)。
    example_gloss: 我是工程师。
  ar.a1.unit18.lesson01.teach.office:
    title: 办公室
    gloss: 办公室
    note: مكتب(maktab)是办公室;في مكتب 的意思是在办公室里。
    example_gloss: 我在办公室工作。
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: 我在办公室工作
    gloss: 我在办公室工作
    note: أعمل(aʿmal)的意思是我工作;它与 عمل(工作)同词根,开头的 أ 表示“我”。
    example_gloss: 优素福说:我在办公室工作。
  ar.a1.unit18.lesson02.teach.write:
    title: 我写
    gloss: 我写
    note: أكتب(aktub)的意思是我写。
    example_gloss: 我在工作中写作。
  ar.a1.unit18.lesson02.teach.read:
    title: 我读
    gloss: 我读
    note: أقرأ(aqraʾ)的意思是我读。
    example_gloss: 我在工作中阅读。
  ar.a1.unit18.lesson02.teach.at_work:
    title: 在工作中
    gloss: 在工作中
    note: العمل(al-ʿamal)是这份工作;في العمل 的意思是在工作中。
    example_gloss: 我在工作中写作和阅读。
  ar.a1.unit18.lesson02.teach.line01:
    title: 询问工作
    gloss: 蕾拉问优素福做什么工作。
    note: يا يوسف 是用名字称呼优素福。
    example_gloss: 蕾拉说:优素福,你做什么工作?
  ar.a1.unit18.lesson02.teach.line02:
    title: 说明职业
    gloss: 优素福说他是工程师。
    note: 不需要单独表示“是”的词。
    example_gloss: 优素福说:我是工程师。
  ar.a1.unit18.lesson02.teach.line03:
    title: 说明工作地点
    gloss: 优素福说他在办公室工作。
    note: أعمل في 后面说出工作地点。
    example_gloss: 优素福说:我在办公室工作。
  ar.a1.unit18.lesson02.teach.line04:
    title: 询问日常活动
    gloss: 蕾拉问优素福每天做什么。
    note: 这里再次用到日常问句;تفعل 是对男性说的。对女性说:ماذا تفعلين كل يوم؟
    example_gloss: 蕾拉说:你每天做什么?
  ar.a1.unit18.lesson02.teach.line05:
    title: 说明日常活动
    gloss: 优素福说他在工作中写作和阅读。
    note: و(wa,和)连接两项活动,并与后面的词连写:وأقرأ。
    example_gloss: 优素福说:我在工作中写作和阅读。
