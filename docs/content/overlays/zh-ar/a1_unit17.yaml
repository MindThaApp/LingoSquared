teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: 疼痛
    gloss: 疼痛
    note: ألم (alam)意为“疼痛”;عندي ألم (ʿindī alam)就是“我疼”。
    example_gloss: 我疼。
  ar.a1.unit17.lesson01.teach.head:
    title: 头
    gloss: 头
    note: الرأس (ar-raʾs)是“头”。阿拉伯语说 عندي ألم في الرأس,字面是“头部有疼痛”,不像汉语用“头痛”一个词来表达。
    example_gloss: 我头痛。
  ar.a1.unit17.lesson01.teach.stomach:
    title: 肚子
    gloss: 肚子
    note: البطن (al-baṭn)指肚子或腹部。
    example_gloss: 我肚子疼。
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: 头痛
    gloss: 我头痛
    note: عندي ألم 字面是“我这里有疼痛”,是阿拉伯语表示“我疼”的说法；في + 身体部位说明疼的位置。
    example_gloss: 蕾拉说：我头痛。
  ar.a1.unit17.lesson02.teach.problem_question:
    title: 怎么了？
    gloss: 怎么了？
    note: ما (mā)意为“什么”;المشكلة (al-mushkila)意为“问题”。
    example_gloss: 怎么了，蕾拉？
  ar.a1.unit17.lesson02.teach.drink:
    title: 喝水
    gloss: 喝水
    note: اشربي (ishrabī)是对女性说的命令式“喝！”,这里对象是蕾拉；对男性则说 اشرب (ishrab)。
    example_gloss: 优素福说：喝点水。
  ar.a1.unit17.lesson02.teach.rest:
    title: 休息
    gloss: 休息
    note: استريحي (istarīḥī)是对女性说的命令式“休息！”;对男性则说 استرح (istariḥ)。
    example_gloss: 今天好好休息。
  ar.a1.unit17.lesson02.teach.need_help:
    title: 我需要帮助
    gloss: 我需要帮助
    note: أحتاج (aḥtāj)意为“我需要”,مساعدة (musāʿada)意为“帮助”。你还会遇到带 إلى 的 أحتاج إلى مساعدة,两种说法都正确。
    example_gloss: 我疼。我需要帮助。
  ar.a1.unit17.lesson02.teach.line01:
    title: 询问问题
    gloss: 优素福问蕾拉怎么了。
    note: يا ليلى 是用名字称呼蕾拉。
    example_gloss: 优素福说：怎么了，蕾拉？
  ar.a1.unit17.lesson02.teach.line02:
    title: 说出症状
    gloss: 蕾拉说她头痛。
    note: 直接说出症状。
    example_gloss: 蕾拉说：我头痛。
  ar.a1.unit17.lesson02.teach.line03:
    title: 简单的建议
    gloss: 优素福让蕾拉喝点水，休息一下。
    note: 两个命令式都是阴性形式，因为优素福是对蕾拉说话；و(wa,和)与后面的词连写：واستريحي。
    example_gloss: 优素福说：喝点水，休息一下。
  ar.a1.unit17.lesson02.teach.line04:
    title: 道谢
    gloss: 蕾拉说谢谢。
    note: شكرا 为这段简短的对话作结。
    example_gloss: 蕾拉说：谢谢。
