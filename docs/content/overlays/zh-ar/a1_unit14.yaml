teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: 我喜欢
    gloss: 我喜欢
    note: أحب（uḥibbu）意思是“我喜欢”。阿拉伯语谈论泛指的事物时要加 ال（定冠词），所以“我喜欢咖啡”是 أحب القهوة，字面意思是“我喜欢这咖啡”。
    example_gloss: 我喜欢咖啡。
  ar.a1.unit14.lesson01.teach.tea:
    title: 茶
    gloss: 茶
    note: شاي（shāy）是“茶”；الشاي（ash-shāy）加了 ال，阿拉伯语泛指茶时就这样用。
    example_gloss: 我不喜欢茶。
  ar.a1.unit14.lesson01.teach.dislike:
    title: 我不喜欢
    gloss: 我不喜欢
    note: 阿拉伯语的否定不需要另外的助动词，直接在 أحب 前加 لا 即可。
    example_gloss: 我不喜欢茶。
  ar.a1.unit14.lesson01.teach.water:
    title: 水
    gloss: 水
    note: الماء（al-māʾ）是加了 ال 的 ماء（水，见食物单元），用来泛指水。
    example_gloss: 我喜欢水。
  ar.a1.unit14.lesson01.teach.and_not:
    title: 而不
    gloss: 而不；也不
    note: ولا（wa-lā）是 و（和）与 لا（不）连写：用于在表示喜欢之后接上不喜欢的内容。
    example_gloss: 我喜欢咖啡，不喜欢茶。
  ar.a1.unit14.lesson02.teach.prefer:
    title: 我更喜欢
    gloss: 我更喜欢
    note: أفضل（ufaḍḍilu）意思是“我更喜欢”：在几个选项中选择其一。
    example_gloss: 我更喜欢咖啡。
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: 你更喜欢什么？
    gloss: 你更喜欢什么？
    note: 这里的 تفضل 读作 tufaḍḍil，意思是“你更喜欢”，对男性说；对女性则说 تفضلين（tufaḍḍilīn）。它与食物单元里的 تفضل（tafaḍḍal，“请用”）是不同的词，只是写法相同。
    example_gloss: 努尔说：你更喜欢什么，优素福？
  ar.a1.unit14.lesson02.teach.line01:
    title: 努尔提问
    gloss: 努尔问优素福更喜欢什么。
    note: 努尔是优素福的姐姐（妹妹）。她说 تفضل，因为她问的是男性；问女性则说：ماذا تفضلين؟
    example_gloss: 努尔说：你更喜欢什么，优素福？
  ar.a1.unit14.lesson02.teach.line02:
    title: 优素福更喜欢咖啡
    gloss: 优素福说他更喜欢咖啡。
    note: أفضل 表示在多个选项中选其一；أحب 只是表示喜欢某样东西。
    example_gloss: 优素福说：我更喜欢咖啡。
  ar.a1.unit14.lesson02.teach.line03:
    title: 优素福不喜欢茶
    gloss: 优素福说他不喜欢茶。
    note: لا أحب 直接表达不喜欢。
    example_gloss: 优素福说：我不喜欢茶。
  ar.a1.unit14.lesson02.teach.line04:
    title: 努尔喜欢水
    gloss: 努尔说她喜欢水。
    note: 为了强调，可以加上 أنا（我）。
    example_gloss: 努尔说：我喜欢水。
