  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 消息：发送与阅读
    gloss: رسالة（risāla）指可以发送（أرسل رسالة，ursil risāla）或阅读（أقرأ رسالة，aqraʾ risāla）的消息。
    note: 把这个新词与天气预报短文以及人们发送和阅读的消息联系起来。
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: 蕾拉通过应用程序发一条消息
    gloss: 蕾拉通过应用程序发一条消息。
    note: ترسل（tursil）的意思是“她发送”：开头的字母 ت（ta-）表示“她”。عبر（ʿabra）的意思是“通过”。
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: 优素福读消息
    gloss: 优素福读消息。
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: 查看
    gloss: 查看；查询
    example_gloss: 我查看天气预报。
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: 与 عن 搭配的动词
    gloss: 动词 أبحث（abḥath）后面要接 عن（ʿan）：أبحث عن توقعات الطقس（abḥath ʿan tawaqquʿāt aṭ-ṭaqs）。而 أستخدم（astakhdim）则直接接宾语：أستخدم هاتفي。
    note: عن（ʿan）的意思是“关于”或“寻找”。每个阿拉伯语动词都有自己搭配的介词，所以要一起学习。
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: 卡里姆查看天气预报
    gloss: 卡里姆查看天气预报。
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: 然后他去跑步
    gloss: 然后他去慢跑。
    note: ثم (thumma)意思是“然后”，是一个独立的词，和 و 不同，不与后面的词连写。يذهب للركض (yadhhab li-r-rakḍ)意思是“他去跑步”：ل + الركض 变成 للركض。
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: 蕾拉提议
    gloss: 蕾拉：我们周六十点一起运动好吗？
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: 优素福同意
    gloss: 优素福：好主意！我去查一下天气预报。
    note: فكرة جيدة (fikra jayyida)：形容词 جيدة 和名词一样以 ة 结尾，因为两者都是阴性。سأبحث (sa-abḥath)是将来时：س + أبحث。
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: 优素福查看天气
    gloss: 优素福：周六是晴天！
    note: الجو مشمس (al-jaww mushmis)意思是“天气晴朗”，句中没有相当于“是”的词。مشمس 是阳性，与 الجو 保持一致。
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: 卡里姆看到消息
    gloss: 卡里姆：我看到消息了。周六见！
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + 某一天
    gloss: 你已经认识 إلى اللقاء (ilā al-liqāʾ，再见)。后面还可以加上日期：إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt，周六见)，إلى اللقاء غدا (ilā al-liqāʾ ghadan，明天见)。
    note: 把问候单元中的告别用语扩展到具体的某一天。
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: 谁用什么？
    gloss: 蕾拉每天给优素福打电话。她用的是手机，不是应用。优素福家里没有电脑，但他用手机上网。卡里姆每天早上查天气预报，然后去跑步。萨拉经常给蕾拉发消息。你也每天用手机吗？
    note: 对比四个人物使用设备的习惯，与运动单元的对比阅读形式相呼应。
    glosses:
      تتصل: 打电话
      كل: 每一
      يوم: 天
      تستخدم: 使用
      هاتفها: 手机
      تطبيقا: 应用程序
      حاسوب: 电脑
      البيت: 在家
      الإنترنت: 互联网
      يبحث: 查看
      صباح: 早上
      توقعات: 预报（天气预报）
      يذهب: 去
      للركض: 去跑步
      ترسل: 发送
      كثيرا: 经常
      رسالة: 消息
      تستعمل: 使用
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: 卡里姆每天早上查预报
    gloss: 卡里姆每天早上查天气预报。
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: 萨拉常给蕾拉发消息
    gloss: 萨拉经常给蕾拉发消息。
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: 蕾拉确认计划
    gloss: 蕾拉：我看到消息了。我们周六十点在公园一起运动好吗？
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: 优素福确认天气
    gloss: 优素福：好啊，而且周六是晴天！
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: 卡里姆的计划
    gloss: 卡里姆：那我去跑步。之后我还要踢足球。
    note: سأركض (sa-arkuḍ)意思是“我将要跑步”：س 表示将来。بعد ذلك (baʿda dhālik)意思是“之后”。
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: 萨拉的计划
    gloss: 萨拉：我更喜欢游泳，不过我也会去公园。
    note: أفضل (ufaḍḍil)意思是“我更喜欢”。لكنني (lākinnanī)意思是“但是我”，سآتي (sa-ātī)意思是“我将来”。
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: 蕾拉结束对话
    gloss: 蕾拉：太好了！周六公园见！
    note: 一句话同时收束了本单元的消息对话和运动单元的计划。
