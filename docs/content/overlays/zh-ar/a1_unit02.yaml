teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: 你叫什么名字？
    gloss: 您叫什么名字？
    note: ما اسمك؟(mā ismuk)是询问姓名的标准说法；不标短元音的书写形式对任何听者都适用。
  ar.a1.unit02.lesson01.teach.ismee:
    title: 我的名字是
    gloss: 我的名字[是]
    note: اسمي(ismī)由 اسم(名字)加表示“我的”的词尾 ـي 构成。
    example_gloss: 我叫卡里姆。
  ar.a1.unit02.lesson01.teach.ana:
    title: 我
    gloss: 我
    note: أنا(anā)是表示“我”的独立人称代词；阿拉伯语动词本身也标示人称，但在强调时以及像这样的简单名词句中会使用 أنا。
    example_gloss: 我是萨拉。
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: 很高兴认识你
    gloss: 很高兴认识你
    note: تشرفنا(tasharrafnā)字面意思是“我们感到荣幸”,是初次见面时双方通用的回应，谁先说都可以。
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: 你来自哪里？
    gloss: 你来自哪里？
    note: من أين أنت؟(对男性读 min ayna anta,对女性读 min ayna anti)用来询问对方来自哪里；不标短元音的写法对两者相同。
  ar.a1.unit02.lesson02.teach.ana_min:
    title: 我来自
    gloss: 我来自
    note: أنا من(anā min)后面直接接国家或城市的名称。
  ar.a1.unit02.lesson02.teach.lubnan:
    title: 黎巴嫩
    gloss: 黎巴嫩
    note: لبنان(lubnān)不带定冠词，这与本课中大多数其他国家不同。
    example_gloss: 我来自黎巴嫩。
  ar.a1.unit02.lesson02.teach.misr:
    title: 埃及
    gloss: 埃及
    note: مصر(miṣr)同样不带定冠词。
    example_gloss: 我来自埃及。
  ar.a1.unit02.lesson02.teach.urdun:
    title: 约旦
    gloss: 约旦
    note: الأردن(al-ʾurdun)的名称中始终带有定冠词 الـ,本课中的 المغرب 和 العراق 也是如此。
    example_gloss: 我来自约旦。
  ar.a1.unit02.lesson02.teach.maghrib:
    title: 摩洛哥
    gloss: 摩洛哥
    note: المغرب (al-maghrib)字面意思是“西方”，与表示日落／昏礼时间的词同出一个词根。
    example_gloss: 我来自摩洛哥。
  ar.a1.unit02.lesson02.teach.soorya:
    title: 叙利亚
    gloss: 叙利亚
    note: سوريا (sūryā) 不带定冠词。
    example_gloss: 我来自叙利亚。
  ar.a1.unit02.lesson02.teach.iraq:
    title: 伊拉克
    gloss: 伊拉克
    note: العراق (al-ʿirāq) 带有定冠词。
    example_gloss: 我来自伊拉克。
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: 你来自……吗？
    gloss: 你来自埃及吗？
    note: هل (hal) 是是非疑问标记，放在句首，本身没有独立的意思，作用类似汉语句末的“吗”。
  ar.a1.unit02.lesson03.teach.naam:
    title: 是
    gloss: 是
    note: نعم (naʿam) 是表示肯定的标准回答。
    example_gloss: 是的，我来自埃及。
  ar.a1.unit02.lesson03.teach.laa:
    title: 不
    gloss: 不是
    note: لا (lā) 是表示否定的标准回答。
    example_gloss: 不，我来自黎巴嫩。
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: 很高兴见到你
    gloss: 很高兴见到你
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) 比 تشرفنا 更亲切，常在临别前说。
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: 欢迎你
    gloss: 欢迎你／欢迎来这里
    note: مرحبا بك (marḥaban bik) 多了 بك，意为“对你”：介词 بـ 加上表示“你”的后缀 ـك，与 أهلا بك 中的 بك 相同。
  ar.a1.unit02.lesson04.teach.line01:
    title: 开场问候
    gloss: 优素福向蕾拉问好。
    note: 在互通姓名之前，对话先以一句简单的 مرحبا 开场。
  ar.a1.unit02.lesson04.teach.line02:
    title: 开场问候的回应
    gloss: 蕾拉向他回礼问好。
    note: 问候的双方都可以使用同一个词 مرحبا。
  ar.a1.unit02.lesson04.teach.line03:
    title: 询问姓名
    gloss: 优素福问她叫什么名字。
    note: ما اسمك؟ 用来开启自我介绍。
  ar.a1.unit02.lesson04.teach.line04:
    title: 询问姓名的回应
    gloss: 蕾拉回答后又反问他。
    note: وأنت؟ 沿用上一个问题，不必重复整句话，是常见的简略说法。
  ar.a1.unit02.lesson04.teach.line05:
    title: 回答并表示高兴
    gloss: 优素福说出自己的名字，并说很高兴认识她。
    note: تشرفنا 为互通姓名画上句号。
  ar.a1.unit02.lesson04.teach.line06:
    title: 互表高兴的回应
    gloss: 蕾拉用同一句话回应。
    note: تشرفنا 双方都可以说，并不只限于一方。
  ar.a1.unit02.lesson04.teach.line07:
    title: 询问来自哪里
    gloss: 优素福问她来自哪里。
    note: من أين أنت؟ 把话题转到来自哪里。
  ar.a1.unit02.lesson04.teach.line08:
    title: 询问来自哪里的回应
    gloss: 蕾拉回答后又反问他。
    note: 她再次用 وأنت؟ 反问，与前面的简略说法相同。
  ar.a1.unit02.lesson04.teach.line09:
    title: 说明来自哪里
    gloss: 优素福说他来自黎巴嫩。
    note: أنا من لبنان 沿用了前面课程学过的句型。
  ar.a1.unit02.lesson04.teach.line10:
    title: 结束对话
    gloss: 蕾拉说很高兴见到他。
    note: سعدت بلقائك 表明谈话自然地接近尾声。
  ar.a1.unit02.lesson04.teach.line11:
    title: 告别
    gloss: 优素福说随时欢迎她再来，并道别。
    note: دائما（总是／随时）使 مرحبا بك 变成一个随时有效的邀请，之后再说告别语 مع السلامة。
  ar.a1.unit02.lesson04.teach.line12:
    title: 告别的回应
    gloss: 蕾拉道别。
    note: مع السلامة 为对话收尾，这句话在 a1_unit01 中学过。
