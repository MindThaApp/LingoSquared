teaching:
  ar.a1.unit12.lesson01.teach.tomorrow:
    title: 明天
    gloss: 明天
    note: غدا（ghadan）表示动作发生在不久的将来。
    example_gloss: 我明天学习。
  ar.a1.unit12.lesson01.teach.go:
    title: 我们去
    gloss: 我们去／我们要去
    note: نذهب（nadh-hab）意思是“我们去”；开头的 ن 表示“我们”。和 غدا 一起用时，现在时动词表示计划。
    example_gloss: 我们去咖啡馆。
  ar.a1.unit12.lesson01.teach.plan_time:
    title: 明天五点
    gloss: 明天五点
    note: في الساعة（在……点）放在具体钟点之前，和时间单元里一样。
    example_gloss: 我们明天五点去。
  ar.a1.unit12.lesson02.teach.propose:
    title: 提出计划
    gloss: 我们明天去咖啡馆好吗？
    note: هل（hal）把陈述句变成是非疑问句；和 نذهب 一起用时表示提议：我们去好吗？
    example_gloss: 莱拉说：我们明天去咖啡馆好吗？
  ar.a1.unit12.lesson02.teach.accept:
    title: 答应并说出时间
    gloss: 好，五点
    note: 可以只用 نعم 加时间来回答，不需要动词。
    example_gloss: 优素福说：好，五点。
  ar.a1.unit12.lesson02.teach.decline:
    title: 简单拒绝
    gloss: 不行，我有课
    note: لا 用来简单地拒绝，后面用 عندي（我有）说明理由。
    example_gloss: 不行，我明天有课。
  ar.a1.unit12.lesson02.teach.line01:
    title: 莱拉提议
    gloss: 莱拉提议明天去咖啡馆。
    note: 这句话开启了商量计划的对话。
    example_gloss: 莱拉说：我们明天去咖啡馆好吗？
  ar.a1.unit12.lesson02.teach.line02:
    title: 优素福答应
    gloss: 优素福答应了，并说出时间。
    note: 现在计划有了活动、日期和时间。
    example_gloss: 优素福说：好，五点。
  ar.a1.unit12.lesson02.teach.line03:
    title: 莱拉确认
    gloss: 莱拉说“好”并道别。
    note: جيد（jayyid）意思是“好”；这里用来确认计划。إلى اللقاء 是问候单元里学过的“再见”。
    example_gloss: 莱拉说：好。再见。
