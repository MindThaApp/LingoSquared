teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: 昨天
    gloss: 昨天
    note: أمس(ams)的意思是“昨天”。它与 ذهبت 这类过去时动词连用,可以放在句末,也可以放在句首。
    example_gloss: 我昨天去了市场。
  ar.a1.unit13.lesson01.teach.went:
    title: 我去了
    gloss: 我去了
    note: ذهبت(dhahabtu)的意思是“我去了”:过去时词尾 -tu 表示“我”。不标元音符号时,同样的字母也可以读作 dhahabta / dhahabti(你去了,对男性/对女性)或 dhahabat(她去了),要靠上下文判断。
    example_gloss: 我去了市场。
  ar.a1.unit13.lesson01.teach.bought:
    title: 我买了
    gloss: 我买了
    note: اشتريت(ishtaraytu)的意思是“我买了”;和 ذهبت 一样,以 -tu 结尾表示“我”。
    example_gloss: 我买了苹果。
  ar.a1.unit13.lesson01.teach.apples_object:
    title: 苹果
    gloss: 苹果
    note: تفاحا(tuffāḥan)是 تفاح(苹果,购物单元学过)作动词宾语的形式;多出的 ا 用来书写 -an 词尾。
    example_gloss: 我买了苹果。
  ar.a1.unit13.lesson02.teach.what_did:
    title: 你昨天做了什么？
    gloss: 您昨天做了什么？
    note: ماذا(mādhā)表示“什么”;这里的 فعلت 意思是“你做了”:对男性读 faʿalta,对女性读 faʿalti(书写形式相同)。优素福问的是蕾拉,所以他说 faʿalti。
    example_gloss: 优素福说:你昨天做了什么?
  ar.a1.unit13.lesson02.teach.drank:
    title: 我喝了
    gloss: 我喝了
    note: شربت(sharibtu)的意思是“我喝了”;它和 ذهبت、اشتريت 一样,以 -tu(我)结尾。
    example_gloss: 我喝了咖啡。
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: 近期事件的叙述
    gloss: 我去了市场。我买了苹果。我喝了咖啡。
    note: 连续几个简短的过去时句子,就能讲述你做过的事。每个动词都以 -tu 结尾表示“我”。
    example_gloss: 昨天,我去了市场。我买了苹果。我喝了咖啡。
  ar.a1.unit13.lesson02.teach.line01:
    title: 询问昨天的事
    gloss: 优素福问蕾拉昨天做了什么。
    note: 优素福问的是女性蕾拉,所以这里的 فعلت 读作 faʿalti;对男性则读 faʿalta。
    example_gloss: 优素福说:你昨天做了什么?
  ar.a1.unit13.lesson02.teach.line02:
    title: 去了市场
    gloss: 蕾拉说她去了市场。
    note: ذهبت 表示已经完成的行动。
    example_gloss: 蕾拉说:我去了市场。
  ar.a1.unit13.lesson02.teach.line03:
    title: 买了苹果
    gloss: 蕾拉说她买了苹果。
    note: 这里又增加了第二个已完成的动作。
    example_gloss: 蕾拉说:我买了苹果。
  ar.a1.unit13.lesson02.teach.line04:
    title: 喝了咖啡
    gloss: 蕾拉说她喝了咖啡。
    note: 这句话让这段简短的叙述完整了。
    example_gloss: 蕾拉说:我喝了咖啡。
