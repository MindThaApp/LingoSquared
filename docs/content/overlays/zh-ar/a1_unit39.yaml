  ar.a1.unit39.lesson06.teach.krym_ara_alkhryf:
    title: 卡里姆回答
    gloss: 卡里姆：我觉得秋天很美。秋天很宁静。
  ar.a1.unit39.lesson06.teach.ywsf_arbaa_fswl:
    title: 优素福结束对话
    gloss: 优素福：四个季节，四个最爱！真有意思。
