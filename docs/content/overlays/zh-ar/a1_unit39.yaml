  ar.a1.unit39.lesson05.teach.alan_alrbya_alwrwd:
    title: 关于季节的对话
    gloss: 现在是春天。玫瑰花很漂亮。诺尔问：你觉得哪个季节最美？优素福说：我喜欢夏天。夏天我们去游泳。莱拉说：我喜欢冬天。冬天我们去滑冰。
    note: 一段回顾季节对话的短文。带 ال 的季节名称都是阳性词，例如 الصيف (aṣ-ṣayf) 和 الشتاء (ash-shitāʾ)。
    glosses:
      الربيع: 春天
      الورود: 玫瑰花
      جميلة: 漂亮
      تسأل: 问
      فصل: 季节
      تراه: 觉得
      يقول: 说
      الصيف: 夏天
      أحب: 喜欢（我喜欢）
      نسبح: 游泳
      الشتاء: 冬天
      نتزلج: 滑冰
  ar.a1.unit39.lesson05.teach.alhwar_an_alfswl:
    title: 对话很有趣
    gloss: 关于季节的对话很有趣。
  ar.a1.unit39.lesson06.teach.krym_mrhba_baljmya:
    title: 卡里姆加入小组
    gloss: 卡里姆：大家好！莱拉，你觉得哪个季节最美？
  ar.a1.unit39.lesson06.teach.lyla_ahb_alshtaa:
    title: 莱拉回答
