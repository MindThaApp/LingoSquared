teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: 右
    gloss: 右（方向）
    note: يمين (yamīn) 指右边；اليمين (al-yamīn) 是“右边”。
    example_gloss: 往右。
  ar.a1.unit10.lesson01.teach.left:
    title: 左
    gloss: 左（方向）
    note: يسار (yasār) 指左边；اليسار (al-yasār) 是“左边”。
    example_gloss: 往左。
  ar.a1.unit10.lesson01.teach.forward:
    title: 一直往前
    gloss: 一直往前
    note: إلى الأمام (ilā l-amām) 字面意思是“向前面”；是表示“直走、往前”的常用说法。
    example_gloss: 图书馆就在正前方。
  ar.a1.unit10.lesson01.teach.to_right:
    title: 往右
    gloss: 向右
    note: إلى (ilā) 表示朝某个方向或地点移动。
    example_gloss: 市场在右边。
  ar.a1.unit10.lesson02.teach.walk:
    title: 走
    gloss: 走
    note: امش (imshi) 是对男性说的命令式“走！”；对女性则说 امشي (imshī)。它是指路时常用的动词。
    example_gloss: 一直往前走。
  ar.a1.unit10.lesson02.teach.then:
    title: 然后
    gloss: 到时；然后
    note: ثم (thumma) 按先后顺序连接两个路线步骤。
    example_gloss: 先直走，然后往右。
  ar.a1.unit10.lesson02.teach.route:
    title: 两个路线步骤
    gloss: 先直走，然后往右
    note: 第一步 + ثم + 第二步。ثم 后面不再重复动词。
    example_gloss: 蕾拉说:一直往前走,然后向右拐。
  ar.a1.unit10.lesson02.teach.line01:
    title: 询问图书馆
    gloss: 优素福问图书馆在哪里。
    note: أين المكتبة؟ 在“地点”部分已经用过了。
    example_gloss: 优素福说:图书馆在哪里?
  ar.a1.unit10.lesson02.teach.line02:
    title: 指路
    gloss: 蕾拉说了两个基本的路线步骤。
    note: 蕾拉说 امش,是因为她在对男士说话;对女士则要说 امشي。
    example_gloss: 蕾拉说:一直往前走,然后向右拐。
  ar.a1.unit10.lesson02.teach.line03:
    title: 向别人道谢
    gloss: 优素福说谢谢。
    note: شكرا 用来礼貌地结束求助的对话。
    example_gloss: 优素福说:谢谢。
  ar.a1.unit10.lesson02.teach.line04:
    title: 确认地点
    gloss: 蕾拉说图书馆在市场附近。
    note: 这里再次用到“地点”单元学过的 قرب:图书馆在市场附近。
    example_gloss: 蕾拉说:图书馆在市场附近。
