    title: 蕾拉寄包裹
    gloss: 蕾拉有一个包裹要寄给在贝鲁特的外公外婆。她在邮局买了邮票,在包裹上写了地址。包裹明天送到。信要三天。
    note: 一篇关于包裹的短文。动词要与主语一致:阳性名词用 الطرد يصل(aṭ-ṭard yaṣil),而主语是女性时则用 ليلى تشتري(Layla tashtarī)。
    glosses:
      طرد: 包裹
      لجدها: 给她的外公
      وجدتها: 和她的外婆
      تشتري: 买
      طابعا: 邮票
      البريد: 邮局(邮政)
      تكتب: 写
      العنوان: 地址
      يصل: 到达(阳性动词)
      غدا: 明天
      إليهما: 给他们俩;动词加上这个词表示“送到他们那里”
      الرسالة: 信
      تستغرق: 需要（一段时间）
      ثلاثة: 三
      أيام: 天
