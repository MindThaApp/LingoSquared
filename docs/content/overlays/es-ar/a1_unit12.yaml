teaching:
  ar.a1.unit12.lesson01.teach.tomorrow:
    title: Mañana
    gloss: mañana
    note: غدا (ghadan) sitúa una acción en el futuro próximo.
    example_gloss: Estudio mañana.
  ar.a1.unit12.lesson01.teach.go:
    title: Vamos
    gloss: vamos / vamos a ir
    note: نذهب (nadh-hab) significa «vamos»; la ن inicial marca «nosotros». Con غدا, el verbo en presente expresa un plan.
    example_gloss: Vamos a la cafetería.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Mañana a las cinco
    gloss: mañana a las cinco
    note: في الساعة («a la hora») va antes de la hora, como en la unidad de las horas.
    example_gloss: Vamos mañana a las cinco.
  ar.a1.unit12.lesson02.teach.propose:
    title: Proponer un plan
    gloss: ¿Vamos a la cafetería mañana?
    note: 'هل (hal) convierte una afirmación en una pregunta de sí o no; con نذهب funciona como propuesta: ¿vamos?'
    example_gloss: 'Layla dijo: ¿Vamos a la cafetería mañana?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Aceptar con una hora
    gloss: Sí, a las cinco
    note: Puedes responder solo con نعم y la hora; no hace falta verbo.
    example_gloss: 'Yusuf dijo: Sí, a las cinco.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Rechazar de forma sencilla
    gloss: No, tengo clase
    note: لا es un rechazo simple, seguido de un motivo con عندي (tengo).
    example_gloss: No, mañana tengo clase.
  ar.a1.unit12.lesson02.teach.line01:
    title: Layla propone
    gloss: Layla propone ir a la cafetería mañana.
    note: Esta frase inicia el intercambio para hacer planes.
    example_gloss: 'Layla dijo: ¿Vamos a la cafetería mañana?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Yusuf acepta
    gloss: Yusuf acepta y da la hora.
    note: Ahora el plan tiene una actividad, un día y una hora.
    example_gloss: 'Yusuf dijo: Sí, a las cinco.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Layla confirma
    gloss: Layla dice «bien» y «hasta luego».
    note: جيد (jayyid) significa «bueno»; aquí confirma el plan. إلى اللقاء es la despedida de la unidad de saludos.
    example_gloss: 'Layla dijo: Bien. Hasta luego.'
