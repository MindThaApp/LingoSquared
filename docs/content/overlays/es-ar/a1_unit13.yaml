teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Ayer
    gloss: ayer
    note: أمس (ams) significa «ayer». Va con un verbo en pasado, como ذهبت, y puede ir al final o al principio de la oración.
    example_gloss: Ayer fui al mercado.
  ar.a1.unit13.lesson01.teach.went:
    title: Fui
    gloss: Fui
    note: 'ذهبت (dhahabtu) significa «fui»: la terminación de pasado -tu marca la primera persona. Sin vocales, las mismas letras pueden leerse también dhahabta / dhahabti («fuiste», a un hombre / a una mujer) o dhahabat («ella fue»); el contexto indica cuál es.'
    example_gloss: Fui al mercado.
  ar.a1.unit13.lesson01.teach.bought:
    title: Compré
    gloss: Compré
    note: اشتريت (ishtaraytu) significa «compré»; como ذهبت, termina en -tu para la primera persona.
    example_gloss: Compré manzanas.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Manzanas
    gloss: manzanas
    note: تفاحا (tuffāḥan) es تفاح («manzanas», de la unidad de compras) como complemento directo del verbo; la ا adicional escribe la terminación -an.
    example_gloss: Compré manzanas.
  ar.a1.unit13.lesson02.teach.what_did:
    title: ¿Qué hiciste ayer?
    gloss: ¿Qué hiciste ayer?
    note: 'ماذا (mādhā) significa «qué»; فعلت aquí significa «hiciste»: faʿalta a un hombre, faʿalti a una mujer (se escribe igual). Yusuf le pregunta a Layla, así que dice faʿalti.'
    example_gloss: 'Yusuf dijo: ¿Qué hiciste ayer?'
  ar.a1.unit13.lesson02.teach.drank:
    title: Bebí
    gloss: bebí
    note: شربت (sharibtu) significa «bebí»; tiene la misma terminación -tu (yo) que ذهبت y اشتريت.
    example_gloss: Bebí café.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Secuencia de un hecho reciente
    gloss: Fui al mercado. Compré manzanas. Bebí café.
    note: Varias oraciones cortas en pasado seguidas cuentan lo que hiciste. Cada verbo termina en -tu para «yo».
    example_gloss: Ayer fui al mercado. Compré manzanas. Bebí café.
  ar.a1.unit13.lesson02.teach.line01:
    title: Preguntar por ayer
    gloss: Yusuf pregunta qué hizo Layla ayer.
    note: Yusuf le pregunta a Layla, una mujer, así que فعلت se lee faʿalti aquí; a un hombre sería faʿalta.
    example_gloss: 'Yusuf dijo: ¿Qué hiciste ayer?'
  ar.a1.unit13.lesson02.teach.line02:
    title: Fui al mercado
    gloss: Layla dice que fue al mercado.
    note: ذهبت expresa un movimiento completado.
    example_gloss: 'Layla dijo: Fui al mercado.'
  ar.a1.unit13.lesson02.teach.line03:
    title: Compré manzanas
    gloss: Layla dice que compró manzanas.
    note: Esto añade una segunda acción completada.
    example_gloss: 'Layla dijo: Compré manzanas.'
  ar.a1.unit13.lesson02.teach.line04:
    title: Bebí café
    gloss: Layla dice que bebió café.
    note: Esto completa el breve relato de lo ocurrido.
    example_gloss: 'Layla dijo: Bebí café.'
