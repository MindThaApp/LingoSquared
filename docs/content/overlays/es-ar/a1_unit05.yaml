teaching:
  ar.a1.unit05.lesson01.teach.saa_a:
    title: La hora
    gloss: la hora
    note: الساعة (as-sāʿa) significa literalmente «la hora» (también «el reloj»); las respuestas con la hora empiezan con ella.
    example_gloss: Son las tres.
  ar.a1.unit05.lesson01.teach.kam_saa_a:
    title: ¿Qué hora es?
    gloss: ¿Qué hora es?
    note: كم الساعة؟ pregunta literalmente «¿cuánto es la hora?».
    example_gloss: 'Layla dijo: ¿Qué hora es?'
  ar.a1.unit05.lesson01.teach.three_oclock:
    title: Las tres en punto
    gloss: Son las tres.
    note: 'الثالثة (ath-thālitha) es el ordinal femenino «tercera», que concuerda con el femenino الساعة: literalmente «la hora tercera».'
    example_gloss: 'Layla dijo: Son las tres.'
  ar.a1.unit05.lesson01.teach.five_oclock:
    title: Las cinco
    gloss: Son las cinco.
    note: الخامسة (al-khāmisa), «la quinta (hora)». Este nivel A1 se limita a las horas en punto.
    example_gloss: 'Layla dijo: Son las cinco.'
  ar.a1.unit05.lesson01.teach.sabah:
    title: Por la mañana
    gloss: por la mañana
    note: صباحا (ṣabāḥan) puede aclarar que la hora es de la mañana; في الصباح dice lo mismo.
    example_gloss: Son las cinco de la mañana.
  ar.a1.unit05.lesson01.teach.masaa:
    title: Por la tarde
    gloss: por la noche
    note: مساء (masāʾan) puede aclarar que la hora es de la tarde o la noche; في المساء dice lo mismo.
    example_gloss: Son las cinco de la tarde.
  ar.a1.unit05.lesson02.teach.mata:
    title: Cuándo
    gloss: cuándo
    note: متى (matā) pregunta cuándo ocurre algo.
    example_gloss: ¿Cuándo es la clase?
  ar.a1.unit05.lesson02.teach.mata_lesson:
    title: ¿Cuándo es la clase?
    gloss: ¿Cuándo es la clase?
    note: En esta pregunta sencilla el árabe omite el verbo «es».
    example_gloss: 'Yusuf dijo: ¿Cuándo es la clase?'
  ar.a1.unit05.lesson02.teach.lesson_at_five:
    title: La clase es a las cinco
    gloss: La clase es a las cinco.
    note: الساعة también puede introducir una hora programada.
    example_gloss: 'Layla dijo: La clase es a las cinco.'
  ar.a1.unit05.lesson02.teach.line01:
    title: Preguntar la hora
    gloss: Yusuf pregunta la hora.
    note: كم الساعة؟ pregunta por la hora actual.
    example_gloss: 'Yusuf dijo: ¿Qué hora es?'
  ar.a1.unit05.lesson02.teach.line02:
    title: Decir la hora
    gloss: Layla dice que son las tres.
    note: La respuesta empieza con الساعة.
    example_gloss: 'Layla dijo: Son las tres.'
  ar.a1.unit05.lesson02.teach.line03:
    title: Preguntar cuándo
    gloss: Yusuf pregunta cuándo es la clase.
    note: و enlaza esta pregunta con el intercambio anterior.
    example_gloss: 'Yusuf dijo: ¿Y cuándo es la clase?'
  ar.a1.unit05.lesson02.teach.line04:
    title: Dar la hora programada
    gloss: Layla dice que la clase es a las cinco.
    note: Esta es la respuesta sobre el horario.
    example_gloss: 'Layla dijo: La clase es a las cinco.'
