teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: El tiempo
    gloss: el tiempo (clima)
    note: الجو (al-jaww) es la palabra de uso diario para «el tiempo» (atmosférico); الطقس (aṭ-ṭaqs), en el título de la unidad, también significa «tiempo».
    example_gloss: ¿Qué tiempo hace hoy?
  ar.a1.unit20.lesson01.teach.sunny:
    title: Soleado
    gloss: soleado
    note: مشمس (mushmis) significa «soleado»; es masculino para concordar con الجو.
    example_gloss: Hoy hace sol.
  ar.a1.unit20.lesson01.teach.cold:
    title: Frío
    gloss: frío
    note: بارد (bārid) significa «frío».
    example_gloss: Hoy hace frío.
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: Hoy hace sol
    gloss: Hoy hace sol
    note: En árabe no hace falta una palabra aparte para «es» o «está».
    example_gloss: 'Yusuf dijo: Hoy hace sol.'
  ar.a1.unit20.lesson02.teach.hot:
    title: Calor
    gloss: calor
    note: حار (ḥārr) significa «caluroso» o «caliente».
    example_gloss: Hace calor.
  ar.a1.unit20.lesson02.teach.weather_question:
    title: ¿Qué tiempo hace?
    gloss: ¿Qué tiempo hace hoy?
    note: كيف (kayfa) significa «cómo», como en كيف حالك؟
    example_gloss: 'Layla dijo: ¿Qué tiempo hace hoy?'
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: Vamos a beber agua
    gloss: vamos a beber agua
    note: هيا (hayyā) + un verbo en «nosotros» significa «vamos a»; نشرب (nashrab) significa «bebemos».
    example_gloss: Hace calor. Vamos a beber agua.
  ar.a1.unit20.lesson02.teach.line01:
    title: Preguntar por el tiempo
    gloss: Layla pregunta por el tiempo de hoy.
    note: اليوم significa «hoy».
    example_gloss: 'Layla dijo: ¿Qué tiempo hace hoy?'
  ar.a1.unit20.lesson02.teach.line02:
    title: Soleado y caluroso
    gloss: Yusuf dice que hace sol y calor.
    note: 'و (wa, «y») une las dos palabras sobre el tiempo y se escribe unida a la palabra siguiente: وحار.'
    example_gloss: 'Yusuf dijo: Hace sol y calor.'
  ar.a1.unit20.lesson02.teach.line03:
    title: Proponer la cafetería
    gloss: Layla propone ir a la cafetería.
    note: هل نذهب significa «¿vamos?».
    example_gloss: 'Layla dijo: ¿Vamos a la cafetería?'
  ar.a1.unit20.lesson02.teach.line04:
    title: El plan del agua
    gloss: Yusuf dice que sí y propone beber agua.
    note: هيا نشرب significa «vamos a beber».
    example_gloss: 'Yusuf dijo: Sí, vamos a beber agua.'
