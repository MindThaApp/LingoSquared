teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: Sentimiento
    gloss: sentimiento
    note: شعور (shuʿūr) significa «sentimiento».
    example_gloss: Esto es un sentimiento.
  ar.a1.unit22.lesson01.teach.happy:
    title: Feliz
    gloss: feliz
    note: سعيد (saʿīd) describe a un hombre; una mujer dice أنا سعيدة (anā saʿīda).
    example_gloss: Estoy contento.
  ar.a1.unit22.lesson01.teach.sad:
    title: Triste
    gloss: triste
    note: حزين (ḥazīn) describe a un hombre; una mujer dice أنا حزينة (anā ḥazīna).
    example_gloss: Estoy triste.
  ar.a1.unit22.lesson01.teach.because:
    title: Porque
    gloss: porque
    note: لأن (li-anna) introduce una causa.
    example_gloss: Estoy feliz porque hace sol.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: ¿Cómo te sientes?
    gloss: ¿Cómo te sientes?
    note: 'كيف تشعر؟ (kayfa tashʿur) se le pregunta a un hombre; a una mujer se le dice: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: ¿Cómo te sientes, Yusuf?
  ar.a1.unit22.lesson02.teach.tired:
    title: Cansado
    gloss: cansado
    note: متعب (mutʿab) describe a un hombre; متعبة (mutʿaba) describe a una mujer, por eso Layla dice أنا متعبة.
    example_gloss: Estoy cansado.
  ar.a1.unit22.lesson02.teach.okay:
    title: Bien
    gloss: bien
    note: بخير (bi-khayr) significa «bien», literalmente «en buena (salud)».
    example_gloss: ¿Estás bien?
  ar.a1.unit22.lesson02.teach.line01:
    title: Preguntar por un sentimiento
    gloss: Layla pregunta a Yusuf cómo se siente.
    note: يا (yā) va antes del nombre de la persona a quien nos dirigimos.
    example_gloss: 'Layla dijo: ¿Cómo te sientes, Yusuf?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Sentimiento y causa
    gloss: Yusuf dice que está feliz porque hace sol.
    note: Esta frase expresa un sentimiento y su causa.
    example_gloss: 'Yusuf dijo: Estoy feliz porque hace sol.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Otro sentimiento
    gloss: Layla dice que está cansada porque tiene trabajo.
    note: متعبة concuerda con Layla, que es una mujer.
    example_gloss: 'Layla dijo: Estoy cansada porque tengo trabajo.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Comprobar si está bien
    gloss: Yusuf pregunta a Layla si está bien.
    note: 'هل (hal) inicia una pregunta de sí o no. Yusuf le pregunta a Layla, así que أنت se lee anti (a un hombre: anta).'
    example_gloss: 'Yusuf dijo: ¿Estás bien?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Decir que sí
    gloss: Layla dice que sí y le da las gracias.
    note: نعم es la respuesta afirmativa.
    example_gloss: 'Layla dijo: Sí, gracias.'
