  ar.a1.unit11.lesson01.teach.every_day:
    title: Cada día
    gloss: cada día
    note: كل يوم (kull yawm) suele ir después del verbo (أدرس كل يوم), pero también puede ir al principio de la oración (كل يوم أدرس).
    example_gloss: Estudio todos los días.
  ar.a1.unit11.lesson01.teach.wake:
    title: Me despierto
    gloss: me despierto
    note: أستيقظ (astayqiẓ) significa «me despierto»; la أ inicial marca «yo» en los verbos en presente. السابعة (as-sābiʿa) es «siete» en las horas del reloj.
    example_gloss: Me despierto a las siete.
  ar.a1.unit11.lesson01.teach.study:
    title: Estudio
    gloss: estudio
    note: أدرس (adrus) significa «estudio»; comparte raíz con درس («lección»). التاسعة (at-tāsiʿa) es «nueve» en las horas del reloj.
    example_gloss: Estudio a las nueve.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Duermo
    gloss: duermo / me acuesto
    note: أنام (anām) significa «duermo»; con una hora significa «me acuesto». العاشرة (al-ʿāshira) es «diez» en las horas del reloj.
    example_gloss: Duermo a las diez.
  ar.a1.unit11.lesson02.teach.what_do:
    title: ¿Qué haces cada día?
    gloss: ¿Qué haces cada día?
    note: ماذا (mādhā) pregunta «qué», y تفعل (tafʿal) significa «haces», dicho a un hombre; a una mujer se le dice تفعلين (tafʿalīn).
    example_gloss: 'Layla dijo: ¿Qué haces cada día?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Tres frases de rutina
    gloss: Me despierto a las siete. Estudio a las nueve. Me duermo a las diez.
    note: Cada frase es un verbo + في الساعة + la hora; juntas describen un día entero.
    example_gloss: Cada día me despierto a las siete. Estudio a las nueve. Me duermo a las diez.
  ar.a1.unit11.lesson02.teach.line01:
    title: Preguntar por la rutina
    gloss: Layla le pregunta a Yusuf qué hace cada día.
    note: 'Layla dice تفعل porque le habla a un hombre; a una mujer se le dice: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla dijo: ¿Qué haces cada día?'
  ar.a1.unit11.lesson02.teach.line02:
    title: La hora de despertarse
    gloss: Yusuf dice que se despierta a las siete.
    note: Usa في الساعة antes de la hora.
    example_gloss: 'Yusuf dijo: Me despierto a las siete.'
  ar.a1.unit11.lesson02.teach.line03:
    title: La hora de estudiar
    gloss: Yusuf dice que estudia a las nueve.
    note: El mismo patrón de hora funciona con أدرس.
    example_gloss: 'Yusuf dijo: Estudio a las nueve.'
  ar.a1.unit11.lesson02.teach.line04:
    title: La hora de dormir
    gloss: Yusuf dice que se acuesta a las diez.
    note: La última actividad de su día usa el mismo patrón de hora con أنام.
    example_gloss: 'Yusuf dijo: Me duermo a las diez.'
