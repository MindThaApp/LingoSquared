  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Dos formas de hablar de deporte
    gloss: أمارس الرياضة (umāris ar-riyāḍa) habla del deporte en general, mientras que أمارس اليوغا (umāris al-yūghā) nombra el deporte concreto. Ambas son correctas.
    note: رياضة (riyāḍa) es un sustantivo femenino, y اليوغا (al-yūghā) es el nombre de un deporte con ال añadido.
