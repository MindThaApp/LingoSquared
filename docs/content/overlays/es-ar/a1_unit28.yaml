    note: 'ألعب (alʿab) es el verbo para los juegos de pelota: ألعب كرة القدم (alʿab kurat al-qadam). Literalmente, كرة القدم es «la pelota del pie».'
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Verbos para el deporte: أمارس y ألعب'
    gloss: 'Di أمارس (umāris, «practico») antes de la mayoría de los deportes: أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Para los juegos de pelota di ألعب (alʿab, «juego»): ألعب كرة القدم.'
    note: أمارس (umāris) sirve para la mayoría de los deportes, pero los juegos de pelota llevan ألعب (alʿab); por eso conviene aprender el verbo junto con el deporte.
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Veces por semana
    gloss: veces por semana
    example_gloss: Hago yoga dos veces por semana.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Veces por semana
    gloss: كثيرا (kathīran) y كل يوم (kull yawm) son expresiones generales; مرتين في الأسبوع (marratayn fī al-usbūʿ) indica con exactitud la frecuencia. مرتين es el dual de مرة (marra, «vez»).
    note: Amplía el vocabulario de frecuencia que ya se vio en la unidad de pasatiempos.
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
