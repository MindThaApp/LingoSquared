    gloss: 'El verbo cambia según la persona: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'La primera letra del verbo indica quién realiza la acción: أ (a-) es «yo», ي (ya-) es «él» y ت (ta-) es «tú» o «ella».'
