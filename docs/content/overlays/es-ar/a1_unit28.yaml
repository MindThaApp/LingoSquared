  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla y Sara hablan de deporte
    gloss: Layla practica yoga dos veces por semana. Le encanta moverse con calma. Sara no practica yoga, pero le encanta nadar. Sara nada mucho, casi todas las semanas. ¿Qué deporte practicas tú?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) y سارة تسبح (sāra tasbaḥ) usan verbos que empiezan con ت (ta-) porque las dos son mujeres. لا delante de un verbo lo vuelve negativo.
    glosses:
      تمارس: hace
      مرتين: dos veces
      الأسبوع: semana
      اليوغا: yoga
      تحب: le encanta
      بهدوء: con calma
      تتحرك: moverse
      السباحة: la natación
      تسبح: nada
      كثيرا: a menudo
      تقريبا: casi
