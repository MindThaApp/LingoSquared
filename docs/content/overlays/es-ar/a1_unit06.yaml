teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: La familia
    gloss: familia
    note: عائلة (ʿāʾila) es la palabra general para familia. En el ejemplo, هذه es la forma femenina de هذا (este), que se usa porque عائلة es femenina.
    example_gloss: Esta es una familia.
  ar.a1.unit06.lesson01.teach.father:
    title: Padre
    gloss: padre
    note: أب (ab) significa padre.
    example_gloss: Tengo un padre.
  ar.a1.unit06.lesson01.teach.mother:
    title: Madre
    gloss: madre
    note: أم (umm) significa madre.
    example_gloss: Tengo una madre.
  ar.a1.unit06.lesson01.teach.brother:
    title: Hermano
    gloss: hermano
    note: أخ (akh) significa hermano.
    example_gloss: Tengo un hermano.
  ar.a1.unit06.lesson01.teach.sister:
    title: Hermana
    gloss: hermana
    note: أخت (ukht) significa hermana.
    example_gloss: Tengo un hermano y una hermana.
  ar.a1.unit06.lesson01.teach.i_have:
    title: Tengo
    gloss: tengo
    note: عندي (ʿindī, literalmente «conmigo») es la forma sencilla de A1 para decir que tienes algo; لدي (ladayya) es un equivalente más formal.
    example_gloss: Tengo una hermana.
  ar.a1.unit06.lesson02.teach.in_family:
    title: En tu familia
    gloss: en tu familia
    note: 'Aquí من es man, «quién», y no min, «de», como en من أين أنت؟; se escriben igual. عائلتك significa tu familia: ʿāʾilatuka si hablas a un hombre, ʿāʾilatuki si hablas a una mujer.'
    example_gloss: ¿Quién está en tu familia?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Su nombre es Nour
    gloss: su nombre es Nour
    note: اسمها significa su nombre (de ella).
    example_gloss: 'Yusuf dijo: Su nombre es Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Preguntar por la familia
    gloss: Layla pregunta quién está en la familia de Yusuf.
    note: من (man) significa quién aquí. يا يوسف se dirige a Yusuf por su nombre.
    example_gloss: 'Layla dijo: ¿Quién está en tu familia, Yusuf?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Describir la familia
    gloss: Yusuf dice que tiene padre, madre y una hermana.
    note: و une a los miembros de la familia.
    example_gloss: 'Yusuf dijo: Tengo padre, madre y una hermana.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Preguntar el nombre de la hermana
    gloss: Layla pregunta el nombre de la hermana de Yusuf.
    note: 'أختك significa tu hermana: ukhtuka si hablas a un hombre, ukhtuki si hablas a una mujer. Aquí Layla pregunta a Yusuf, así que es ukhtuka.'
    example_gloss: 'Layla dijo: ¿Cómo se llama tu hermana?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Decir su nombre
    gloss: Yusuf dice que su hermana se llama Nour.
    note: 'La terminación ـها significa «de ella»: اسمها (ismuhā), su nombre.'
    example_gloss: 'Yusuf dijo: Su nombre es Nour.'
