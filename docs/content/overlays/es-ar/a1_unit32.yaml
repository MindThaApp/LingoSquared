    title: ¿Quién hace qué para la fiesta?
    gloss: El sábado es el cumpleaños de Sara. Lo celebramos con una fiesta. Yusuf invita a Karim y a Layla a la fiesta. A Karim le encanta celebrar con los amigos. Layla también vendrá a la fiesta. Todos están contentos por Sara.
