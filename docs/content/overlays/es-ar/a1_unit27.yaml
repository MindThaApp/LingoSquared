teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: حيوان (ḥayawān) significa «animal» y حيوان أليف (ḥayawān alīf) significa «mascota». أليف (alīf) es un adjetivo que significa «doméstico, manso», y va después del sustantivo.
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Layla tiene un perro.
    - Karim tiene un gato.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nour tiene un pájaro.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: 'هل لديك (hal ladayka) significa «¿tienes?». A una mujer se le dice igual, pero la última vocal es i: ladayki. هل (hal) abre una pregunta de sí o no.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: 'ليس لدي (laysa ladayya) significa «no tengo»: ليس (laysa) niega y لدي (ladayya) significa «tengo».'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'No tener: ليس لدي'
    gloss: 'Para decir que no tienes algo, usa ليس لدي (laysa ladayya): ليس لدي وقت (no tengo tiempo), ليس لدي حيوان أليف (no tengo mascota).'
    note: ليس لدي se usa con cualquier sustantivo y no cambia según el género. Para «él» y «ella» se dice ليس لديه (laysa ladayhi) y ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) significa literalmente «llevar al animal de paseo». El verbo es أخذ, «tomar, llevar».
    example_gloss: Paseo al perro todos los días.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: El verbo cambia según la persona
    gloss: 'El verbo cambia según la persona: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), «saco a pasear al perro»; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), «Karim saca a pasear a su perro».'
    note: La letra inicial أ (a-) indica «yo» y ي (ya-) indica «él». نزهة (nuzha) es un paseo o una salida corta.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Jugar con
    gloss: jugar con
    example_gloss: Karim juega con su gato.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: 'كل يوم (kull yawm) significa «todos los días»: كل + un sustantivo singular sin ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: أطعم (uṭʿim) significa «doy de comer». القطة (al-qiṭṭa) es femenino, y el ال se escribe unido al sustantivo.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Plurales: كلب → كلاب'
    gloss: 'Muchos plurales son irregulares, así que apréndelos junto con el sustantivo: كلب (kalb) pasa a كلاب (kilāb), قطة (qiṭṭa) a قطط (qiṭaṭ) y طائر (ṭāʾir) a طيور (ṭuyūr).'
    note: En árabe predominan los plurales rotos, por lo que cada plural se aprende junto con su sustantivo; el plural de animales lleva el adjetivo en femenino singular.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Yusuf le encantan los perros.
    - A Sara le encantan los gatos.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) significa «amo a los animales». El plural termina en ات y lleva el artículo ال unido a la palabra.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: A Sara le encantan los gatos, pero no tiene mascota
    gloss: A Sara le encantan los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf pregunta por una mascota
    gloss: 'Yusuf: ¿Tienes una mascota, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla tiene un perro
    gloss: 'Layla: Sí, tengo un perro.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf pregunta cómo es
    gloss: 'Yusuf: ¿Cómo es?'
    note: كيف يبدو؟ (kayfa yabdū?) pregunta cómo es él. يبدو (yabdū) es masculino porque كلب, perro, es un sustantivo masculino.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla describe a su perro
    gloss: 'Layla: Tiene el pelo marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Pronombres para animales
    gloss: 'Toda palabra de animal es masculina o femenina: el perro es هو (huwa, él) y la gata es هي (hiya, ella). La terminación ه en أطعمه (uṭʿimuhu) significa «lo».'
    note: Un nombre de animal masculino como كلب lleva pronombres y adjetivos masculinos; uno femenino como قطة los lleva femeninos.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf pregunta por los paseos
    gloss: 'Yusuf: ¿Lo sacas a pasear todos los días?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla describe su rutina
    gloss: 'Layla: Sí, lo saco a pasear todos los días y le doy de comer.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara y Karim hablan de animales
    gloss: 'A Yusuf y a Sara les encantan los animales, pero ninguno de los dos tiene mascota. Yusuf ama a los perros y Sara ama a los gatos. Karim, en cambio, sí tiene una mascota: una gata. Juega mucho con su gata y le da de comer todos los días. ¿Tienes tú una mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      يحبان: adorar
      كلاهما: los dos
      الحيوانات: animales
      منهما: de ellos (ninguno de los dos)
      أليف: mascota (lit. doméstico)
      الكلاب: perros
      القطط: gatos
      قطة: gato
      يلعب: juega
      ويعطي: da
      كل: cada
      طعاما: comida
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim juega mucho con su gata
    gloss: Karim juega mucho con su gata.
    note: 'قطته (qiṭṭatuhu) significa «su gata»: la terminación ه (hu) significa «su», y la ة de قطة se convierte en ت ante ella.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla le pregunta a Nour
    gloss: 'Layla: Nour, ¿tú también tienes una mascota?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour tiene un pájaro llamado Pico
    gloss: 'Nour: Sí, tengo un pájaro. Se llama Pico.'
    note: اسمه (ismuhu) significa «su nombre»; la ه final significa «su». بيكو (bīkū) es el nombre del pájaro.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Yusuf reacciona
    gloss: 'Yusuf: ¡Qué bonito! ¿Qué haces con él todos los días?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour le da de comer todos los días
    gloss: 'Nour: Le doy de comer todos los días.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: A Yusuf también le encantan los pájaros
    gloss: 'Yusuf: A mí también me encantan los pájaros.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla cierra la conversación
    gloss: 'Layla: ¡Qué bonito que a los tres nos gusten los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
