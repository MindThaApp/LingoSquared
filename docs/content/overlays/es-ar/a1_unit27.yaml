course:
  title: Árabe en español A1
  description: 'Árabe para principiantes para hablar de mascotas y animales comunes: cómo nombrarlos, cuidados básicos (pasear, dar de comer, jugar), decir qué animales te encantan aunque no tengas ninguno y plurales frecuentes.'
