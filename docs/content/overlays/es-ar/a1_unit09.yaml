teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Lugar
    gloss: lugar
    note: مكان (makān) es la palabra general para «lugar». هذا (este/esto) se vio con los números.
    example_gloss: Este es un lugar.
  ar.a1.unit09.lesson01.teach.library:
    title: Biblioteca
    gloss: biblioteca
    note: مكتبة (maktaba) puede significar «biblioteca» o «librería»; aquí es una biblioteca. المكتبة (al-maktaba) es «la biblioteca».
    example_gloss: La biblioteca está aquí.
  ar.a1.unit09.lesson01.teach.market:
    title: Mercado
    gloss: mercado
    note: سوق (sūq) significa «mercado»; السوق (as-sūq) es «el mercado».
    example_gloss: El mercado está aquí.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Cafetería
    gloss: cafetería
    note: مقهى (maqhā) significa «cafetería»; está relacionada con قهوة (café). المقهى (al-maqhā) es «la cafetería».
    example_gloss: La cafetería está aquí.
  ar.a1.unit09.lesson01.teach.here:
    title: Aquí
    gloss: aquí
    note: 'هنا (hunā) suele ir después del lugar: المقهى هنا, «la cafetería está aquí». En árabe no hace falta una palabra para «está» en esta oración.'
    example_gloss: La cafetería está aquí.
  ar.a1.unit09.lesson02.teach.where_library:
    title: ¿Dónde está la biblioteca?
    gloss: ¿Dónde está la biblioteca?
    note: أين (ayna) pregunta «dónde»; ya la viste en من أين أنت؟ (¿de dónde eres?).
    example_gloss: 'Yusuf dijo: ¿Dónde está la biblioteca?'
  ar.a1.unit09.lesson02.teach.near:
    title: Cerca
    gloss: cerca
    note: 'قرب (qurba) significa «cerca» y va antes del lugar al que se refiere: قرب المكتبة, «cerca de la biblioteca». بالقرب من (bi-l-qurbi min) significa lo mismo.'
    example_gloss: La cafetería está cerca de la biblioteca.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: La biblioteca está cerca del mercado
    gloss: La biblioteca está cerca del mercado
    note: En árabe no hace falta una palabra aparte para «está» aquí.
    example_gloss: 'Layla dijo: La biblioteca está cerca del mercado.'
  ar.a1.unit09.lesson02.teach.line01:
    title: Preguntar dónde
    gloss: Yusuf pregunta dónde está la biblioteca.
    note: أين abre la pregunta sobre la ubicación.
    example_gloss: 'Yusuf dijo: ¿Dónde está la biblioteca?'
  ar.a1.unit09.lesson02.teach.line02:
    title: Ubicar la biblioteca
    gloss: Layla dice que la biblioteca está aquí, cerca del mercado.
    note: 'هنا y قرب pueden aparecer juntos: aquí, cerca del mercado.'
    example_gloss: 'Layla dijo: La biblioteca está aquí, cerca del mercado.'
  ar.a1.unit09.lesson02.teach.line03:
    title: Preguntar por la cafetería
    gloss: Yusuf pregunta dónde está la cafetería.
    note: 'و (wa, «y») se escribe unida a la palabra siguiente: وأين (wa-ayna), «y dónde».'
    example_gloss: 'Yusuf dijo: ¿Y dónde está la cafetería?'
  ar.a1.unit09.lesson02.teach.line04:
    title: Ubicar la cafetería
    gloss: Layla dice que la cafetería está cerca de la biblioteca.
    note: 'Lugar + قرب + segundo lugar: المقهى قرب المكتبة, «la cafetería está cerca de la biblioteca».'
    example_gloss: 'Layla dijo: La cafetería está cerca de la biblioteca.'
