  ar.a1.unit07.lesson01.teach.water:
    title: Agua
    gloss: agua
    note: ماء (māʾ) significa «agua».
    example_gloss: Quiero agua.
  ar.a1.unit07.lesson01.teach.coffee:
    title: Café
    gloss: café
    note: قهوة (qahwa) significa «café».
    example_gloss: Quiero agua y café.
  ar.a1.unit07.lesson01.teach.bread:
    title: Pan
    gloss: pan
    note: خبز (khubz) significa «pan». Como complemento directo de un verbo como أريد o تريدين, se escribe خبزا (khubzan).
    example_gloss: Quiero pan.
  ar.a1.unit07.lesson01.teach.i_want:
    title: quiero
    gloss: quiero
    note: أريد (urīdu) es una forma de pedir directa pero habitual.
    example_gloss: Quiero agua.
  ar.a1.unit07.lesson01.teach.please:
    title: Por favor
    gloss: por favor
    note: من فضلك (min faḍlika; a una mujer, min faḍliki) añade cortesía después de una petición; también puede ir al principio.
    example_gloss: Quiero agua, por favor.
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: ¿Quieres pan?
    gloss: ¿Quieres pan?
    note: تريدين (turīdīna) significa «quieres» dicho a una mujer, aquí Layla; a un hombre se le dice تريد (turīdu).
    example_gloss: 'El camarero dijo: ¿Quiere pan?'
  ar.a1.unit07.lesson02.teach.one_bread:
    title: Una pieza de pan
    gloss: una pieza de pan
    note: قطعة خبز واحدة (qiṭʿat khubz wāḥida) da al pan una unidad contable; واحدة es femenino para concordar con قطعة.
    example_gloss: Quiero una pieza de pan.
  ar.a1.unit07.lesson02.teach.here_you_are:
    title: Aquí tiene
    gloss: aquí tiene
    note: تفضلي (tafaḍḍalī) se dice a una mujer al entregarle algo; a un hombre se le dice تفضل (tafaḍḍal).
    example_gloss: 'El camarero dijo: Aquí tiene.'
  ar.a1.unit07.lesson02.teach.line01:
    title: Hacer un pedido
    gloss: Layla pide agua y café con cortesía.
    note: La petición usa أريد más lo que se pide.
    example_gloss: 'Layla dijo: Hola. Quiero agua y café, por favor.'
  ar.a1.unit07.lesson02.teach.line02:
    title: Hacer otra pregunta
    gloss: El camarero le pregunta si quiere pan.
    note: هل introduce una pregunta de sí o no.
    example_gloss: 'El camarero dijo: ¿Quiere pan?'
  ar.a1.unit07.lesson02.teach.line03:
    title: Responder a la pregunta
    gloss: Layla dice que sí y pide una pieza de pan.
    note: نعم expresa la respuesta afirmativa.
    example_gloss: 'Layla dijo: Sí, quiero una pieza de pan.'
  ar.a1.unit07.lesson02.teach.line04:
    title: Servir el pedido
    gloss: El camarero dice «aquí tiene».
    note: تفضلي completa el intercambio.
    example_gloss: 'El camarero dijo: Aquí tiene.'
