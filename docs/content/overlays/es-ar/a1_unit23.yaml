teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Teléfono
    gloss: teléfono
    note: هاتف (hātif) significa «teléfono».
    example_gloss: Esto es un teléfono.
  ar.a1.unit23.lesson01.teach.hear:
    title: Te oigo
    gloss: te oigo
    note: أسمعك (asmaʿuka a un hombre, asmaʿuki a una mujer) significa «te oigo»; لا أسمعك (lā asmaʿuk) significa «no te oigo».
    example_gloss: No te oigo.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Repetir
    gloss: repite
    note: 'أعد (aʿid) se dice a un hombre; a una mujer: أعيدي (aʿīdī). أعد من فضلك pide con cortesía que alguien repita.'
    example_gloss: No te oigo. Repite, por favor.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Habla despacio
    gloss: habla despacio
    note: 'تكلم ببطء (takallam bi-buṭʾ) se dice a un hombre; a una mujer: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Habla despacio, por favor.
  ar.a1.unit23.lesson02.teach.message:
    title: Mensaje
    gloss: mensaje
    note: رسالة (risāla) es un mensaje; también puede significar carta.
    example_gloss: Este es un mensaje.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Cita
    gloss: la cita
    note: موعد (mawʿid) significa cita; الموعد (al-mawʿid) es la cita.
    example_gloss: La cita es a las cinco.
  ar.a1.unit23.lesson02.teach.line01:
    title: Contestar el teléfono
    gloss: Yusuf saluda a Layla por teléfono y dice su nombre.
    note: Por teléfono, أنا يوسف (anā Yūsuf) indica quién llama.
    example_gloss: 'Yusuf dijo: Hola, soy Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: No se oye
    gloss: Layla dice que no oye a Yusuf.
    note: Esto prepara la petición de aclaración.
    example_gloss: 'Layla dijo: Hola, Yusuf, no te oigo.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Pedir que hable despacio
    gloss: Layla le pide a Yusuf que hable despacio.
    note: من فضلك mantiene la petición cortés; Layla dice تكلم porque habla con un hombre.
    example_gloss: 'Layla dijo: Habla despacio, por favor.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Dato clave
    gloss: Yusuf dice que la cita es a las cinco.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) significa a las cinco.
    example_gloss: 'Yusuf dijo: La cita es a las cinco.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Pedir que repita
    gloss: Layla le pide a Yusuf que repita.
    note: أعد من فضلك es la petición para que repita.
    example_gloss: 'Layla dijo: Repite, por favor.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Repetir el dato
    gloss: Yusuf repite la hora de la cita.
    note: La frase repetida confirma la hora.
    example_gloss: 'Yusuf dijo: La cita es a las cinco.'
