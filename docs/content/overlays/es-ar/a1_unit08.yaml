  ar.a1.unit08.lesson01.teach.apple:
    title: Manzanas
    gloss: manzanas
    note: تفاح (tuffāḥ) es un sustantivo colectivo para «manzanas»; una manzana es تفاحة (tuffāḥa).
    example_gloss: Las manzanas cuestan diez dírhams.
  ar.a1.unit08.lesson01.teach.dirhams:
    title: Dírhams
    gloss: dírhams
    note: دراهم (darāhim) es el plural de درهم (dírham), la moneda de Marruecos y de los Emiratos Árabes Unidos; después de los números del 3 al 10 se usa el plural.
    example_gloss: Tengo diez dírhams.
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: ¿Cuánto cuestan las manzanas?
    gloss: ¿Cuánto cuestan las manzanas?
    note: كم سعر التفاح؟ (kam siʿr at-tuffāḥ) pregunta literalmente «¿cuánto es el precio de las manzanas?». ما سعر التفاح؟ («¿cuál es el precio?») y بكم التفاح؟ («¿por cuánto están las manzanas?») también son formas estándar.
    example_gloss: 'Layla dijo: ¿Cuánto cuestan las manzanas?'
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: Por diez dírhams
    gloss: por diez dírhams
    note: 'El prefijo بـ (bi-) marca el precio: بعشرة (bi-ʿashara), «por diez».'
    example_gloss: Las manzanas cuestan diez dírhams.
  ar.a1.unit08.lesson02.teach.two_apples:
    title: Dos manzanas
    gloss: dos manzanas
    note: تفاحتين (tuffāḥatayn) es el dual de تفاحة («una manzana»), en la forma de complemento directo que se usa después de أريد.
    example_gloss: Dos manzanas.
  ar.a1.unit08.lesson02.teach.want_two:
    title: Quiero dos manzanas
    gloss: quiero dos manzanas
    note: Pon أريد antes de lo que pides.
    example_gloss: Quiero dos manzanas.
  ar.a1.unit08.lesson02.teach.line01:
    title: Preguntar el precio
    gloss: Layla pregunta el precio de las manzanas.
    note: Es el mismo patrón de pregunta por el precio.
    example_gloss: 'Layla dijo: ¿Cuánto cuestan las manzanas?'
  ar.a1.unit08.lesson02.teach.line02:
    title: Decir el precio
    gloss: El vendedor dice que las manzanas cuestan diez dírhams.
    note: بعشرة une el prefijo del precio a عشرة.
    example_gloss: 'El vendedor dijo: Las manzanas cuestan diez dírhams.'
  ar.a1.unit08.lesson02.teach.line03:
    title: Pedir una cantidad
    gloss: Layla pide dos manzanas con cortesía.
    note: من فضلك mantiene la petición cortés.
    example_gloss: 'Layla dijo: Quiero dos manzanas, por favor.'
  ar.a1.unit08.lesson02.teach.line04:
    title: Entregar el producto
    gloss: El vendedor dice «aquí tienes».
    note: 'تفضلي apareció en la unidad de comida; se dice a una mujer (a un hombre: تفضل).'
    example_gloss: 'El vendedor dijo: Aquí tienes.'
