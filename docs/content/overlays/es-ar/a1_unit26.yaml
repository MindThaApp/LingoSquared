course:
  title: Árabe en español A1
  description: 'Árabe para principiantes para describir el aspecto básico de una persona: estatura y edad, color del pelo y de los ojos, la pregunta كيف تبدو؟ (kayfa tabdū?) y la comparación de dos personas con أطول من (aṭwal min).'
units:
  ar.a1.unit26.appearance:
    title: Describir el aspecto
lessons:
  ar.a1.unit26.lesson01.twyl_wqsyr_wkbyr_fy:
    title: Alto, bajo, viejo y joven
  ar.a1.unit26.lesson02.wsf_alshar:
    title: Describir el pelo
  ar.a1.unit26.lesson03.alaynan_wkyf_ybdw_alshkhs:
    title: Los ojos y ¿cómo es alguien?
  ar.a1.unit26.lesson04.lyla_tsf_nwr:
    title: Layla describe a Nour
  ar.a1.unit26.lesson05.mqarna_byn_krym_wsara:
    title: Comparamos a Karim y Sara
  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: Yusuf reconoce a Nour
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Alto y bajo
    gloss: alto / bajo
    note: 'طويل (ṭawīl) significa alto y قصير (qaṣīr) bajo. Para una mujer llevan ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara es alta.
    - Karim es bajo.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Viejo y joven
    gloss: viejo / joven
    note: كبير في السن (kabīr fī as-sinn) y صغير في السن (ṣaghīr fī as-sinn) describen una impresión general de la edad, no un número exacto de años.
    example_gloss:
    - El abuelo es viejo.
    - Yusuf es joven.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'La edad: un número o una impresión'
    gloss: كم عمرك؟ (kam ʿumruka?) pregunta por un número de años, mientras que كبير في السن (kabīr fī as-sinn) da una impresión general sin número, como en الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Usa كم عمرك؟ para preguntar exactamente la edad de alguien. Aquí كبير في السن solo describe lo mayor que parece alguien.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara es alta y Karim es bajo
    gloss: Sara es alta y Karim es bajo.
    note: 'و (wa-) une las dos oraciones y se escribe pegada a la palabra siguiente: وكريم (wa-karīm). Los adjetivos concuerdan: سارة طويلة es femenino y كريم قصير es masculino.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: El pelo
    gloss: el pelo
    note: 'الشعر (ash-shaʿr) significa el pelo. ش es una letra solar, así que la ل de ال no se pronuncia: ash-shaʿr.'
    example_gloss: Yusuf tiene el pelo corto y negro.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: 'أشقر (ashqar), بني (bunnī) y رمادي (ramādī) describen el pelo y van después del sustantivo: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla tiene el pelo rubio.
    - Karim tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: 'طويل (ṭawīl) y قصير (qaṣīr) también describen el pelo: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Van después de شعر, que es masculino.'
    example_gloss:
    - Sara tiene el pelo largo.
    - Karim tiene el pelo corto.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: El adjetivo va después del sustantivo
    gloss: 'En árabe el adjetivo va después del sustantivo y concuerda con él: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) es masculino, así que sus adjetivos también van en masculino. Con un sustantivo indefinido, ninguna de las dos palabras lleva ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: El pelo y su pelo
    gloss: شعر (shaʿr) significa pelo. Añade el pronombre ها (hā, su, de ella) y obtienes شعرها (shaʿruhā, su pelo).
    note: 'La terminación ها indica el poseedor: شعرها (su pelo), اسمها (su nombre), عيناها (sus ojos). Se escribe unida a la palabra.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf tiene el pelo corto y negro
    gloss: Yusuf tiene el pelo corto y negro.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) antes de un nombre significa tiene, y se escribe unida al nombre.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla tiene el pelo largo y rubio
    gloss: Layla tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Los ojos
    gloss: los ojos
    note: 'العينان (al-ʿaynān) significa los ojos. Es un sustantivo en dual: el árabe tiene una terminación especial ان para exactamente dos.'
    example_gloss: Yusuf tiene los ojos marrones.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: 'أزرق (azraq) azul, بني (bunnī) marrón y أخضر (akhḍar) verde son las formas masculinas. Con عينان se usan las formas de dual: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla tiene los ojos azules.
    - Karim tiene los ojos marrones.
    - Sara tiene los ojos verdes.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Ojos en dual, adjetivo en dual
    gloss: 'عينان (ʿaynān) está en dual, así que su adjetivo también: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: En dual, la terminación ان se añade tanto al sustantivo como al adjetivo. Además, el adjetivo es femenino porque عين es un sustantivo femenino.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: ¿Cómo es Layla físicamente?
    gloss: ¿Cómo es Layla físicamente?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) pregunta por el aspecto de Layla. تبدو (tabdū) es femenino porque Layla es una mujer; para un hombre es يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla tiene el pelo largo y rubio y los ojos azules
    gloss: Layla tiene el pelo largo y rubio y los ojos azules.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + un nombre significa tiene, y و une el pelo y los ojos.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla presenta a Nour
    gloss: 'Layla: Va a venir una chica nueva al café de idiomas. Se llama Nour.'
    note: 'ستأتي (sa-taʾtī) significa ella vendrá: س (sa-) marca el futuro y ت (ta-) significa ella. اسمها (ismuhā) significa su nombre.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf pregunta cómo es ella
    gloss: 'Yusuf: ¡Vale! ¿Cómo es físicamente?'
    note: 'Esta vez كيف تبدو؟ (kayfa tabdū?) no lleva nombre: el verbo تبدو ya significa ella parece.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla describe la estatura y el pelo de Nour
    gloss: 'Layla: Es bajita y tiene el pelo corto y rubio.'
    note: قصيرة (qaṣīra) es femenino porque Nour es una mujer, pero شعر قصير أشقر sigue en masculino porque شعر es un sustantivo masculino.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf pregunta por sus ojos
    gloss: 'Yusuf: ¿Y sus ojos?'
    note: 'وعيناها (wa-ʿaynāhā) significa y sus ojos: و (wa-) se une al sustantivo, y ها (hā) al final significa su (de ella).'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla describe los ojos de Nour
    gloss: 'Layla: Tiene los ojos verdes.'
    note: 'لها (lahā) significa ella tiene: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) es un sustantivo en dual con un adjetivo en dual.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf la reconocerá
    gloss: 'Yusuf: ¡Gracias! Entonces la reconoceré.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) significa la reconoceré: س (sa-) marca el futuro y ها en عليها significa a ella.'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Comparando a Karim y Sara
    gloss: Karim y Sara son hermanos, pero son distintos físicamente. Karim es bajo y tiene el pelo corto y castaño y los ojos marrones. Sara es más alta que Karim y tiene el pelo largo y castaño y los ojos verdes. ¿Y tú, cómo eres?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      أخ: hermano
      أخت: hermana
      تبدو: parecerse
      مختلفان: diferentes
      القامة: bajo de estatura
      قصير: bajo
      بني: castaño
      شعر: pelo
      بنيتان: castaño
      وعينان: ojos
      أطول: más alta
      طويل: largo
      خضراوان: verdes
      المظهر: aspecto (cómo se ve alguien)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Comparar con أفعل
    gloss: 'Para comparar, usa la forma أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm), Sara es más alta que Karim.'
    note: طويل (ṭawīl) pasa a أطول (aṭwal) en el comparativo, y من (min) significa que. La forma no cambia para una mujer.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara tiene el pelo más largo que Karim
    gloss: Sara tiene el pelo más largo que Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول sigue en masculino porque شعر es un sustantivo masculino.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: 'لدي (ladayya) significa tengo; el árabe no tiene un verbo tener. Los adjetivos van después del sustantivo: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf ve a Nour
    gloss: 'Yusuf: Mira, ¿es esa Nour? Tiene el pelo corto y rubio y los ojos verdes.'
    note: انظري (unẓurī) es la orden dirigida a una mujer, porque Yusuf habla con Layla; a un hombre se le dice انظر (unẓur). هذه (hādhihi) significa esta, para un sustantivo femenino.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla lo confirma
    gloss: 'Layla: ¡Sí, es Nour!'
    note: Una confirmación breve y natural.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour saluda a Yusuf
    gloss: 'Nour: Hola, ¿eres Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) es una pregunta de sí o no: هل (hal) + una oración sin verbo ser.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf saluda a Nour
    gloss: 'Yusuf: ¡Sí! Encantado de conocerte, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) es la fórmula cortés para un primer encuentro. ب (bi-) se une a معرفتك, y la ك final significa te (a ti).
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour responde al saludo
    gloss: 'Nour: ¡Igualmente, encantada de conocerte!'
    note: 'Cierra el diálogo: Yusuf reconoció a Nour gracias a la descripción de Layla.'
