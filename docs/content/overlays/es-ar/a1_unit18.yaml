teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: El trabajo
    gloss: trabajo
    note: 'عمل (ʿamal) significa «trabajo». ما عملك؟ pregunta por el trabajo de alguien; la terminación ـك significa «tu»: ʿamaluka a un hombre, ʿamaluki a una mujer, que se escriben igual.'
    example_gloss: ¿A qué te dedicas?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Ingeniero
    gloss: ingeniero
    note: مهندس (muhandis) es la forma masculina, usada para Yusuf; una mujer dice أنا مهندسة (anā muhandisa).
    example_gloss: Soy ingeniero.
  ar.a1.unit18.lesson01.teach.office:
    title: Oficina
    gloss: oficina
    note: مكتب (maktab) es «oficina»; في مكتب significa «en una oficina».
    example_gloss: Trabajo en una oficina.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Trabajo en una oficina
    gloss: Trabajo en una oficina
    note: أعمل (aʿmal) significa «trabajo»; comparte la raíz con عمل («trabajo»), y la أ del comienzo marca «yo».
    example_gloss: 'Yusuf dijo: Trabajo en una oficina.'
  ar.a1.unit18.lesson02.teach.write:
    title: Escribo
    gloss: escribo
    note: أكتب (aktub) significa «escribo».
    example_gloss: Escribo en el trabajo.
  ar.a1.unit18.lesson02.teach.read:
    title: Leo
    gloss: leo
    note: أقرأ (aqraʾ) significa «leo».
    example_gloss: Leo en el trabajo.
  ar.a1.unit18.lesson02.teach.at_work:
    title: En el trabajo
    gloss: en el trabajo
    note: العمل (al-ʿamal) es «el trabajo»; في العمل significa «en el trabajo».
    example_gloss: Escribo y leo en el trabajo.
  ar.a1.unit18.lesson02.teach.line01:
    title: Preguntar por el trabajo
    gloss: Layla le pregunta a Yusuf a qué se dedica.
    note: يا يوسف se dirige a Yusuf por su nombre.
    example_gloss: 'Layla dijo: ¿A qué te dedicas, Yusuf?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Decir la profesión
    gloss: Yusuf dice que es ingeniero.
    note: No hace falta una palabra aparte para «soy».
    example_gloss: 'Yusuf dijo: Soy ingeniero.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Decir dónde trabajas
    gloss: Yusuf dice que trabaja en una oficina.
    note: أعمل في indica el lugar de trabajo.
    example_gloss: 'Yusuf dijo: Trabajo en una oficina.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Preguntar la actividad
    gloss: Layla pregunta a Yusuf qué hace todos los días.
    note: 'Reutiliza la pregunta sobre la rutina; تفعل se dice a un hombre. A una mujer: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla dijo: ¿Qué haces todos los días?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Decir la actividad
    gloss: Yusuf dice que escribe y lee en el trabajo.
    note: 'و (wa, «y») une las dos actividades y se escribe pegada a la palabra siguiente: وأقرأ.'
    example_gloss: 'Yusuf dijo: Escribo y leo en el trabajo.'
