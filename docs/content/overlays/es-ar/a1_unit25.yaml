teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: القراءة (al-qirāʾa) es «la lectura», ممارسة الرياضة (mumārasat ar-riyāḍa) es «hacer deporte» y الطبخ (aṭ-ṭabkh) es «cocinar». Cada una es un sustantivo, por eso lleva el artículo ال unido.
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: El tiempo libre
    gloss: tiempo libre
    note: وقت الفراغ (waqt al-farāgh) es literalmente «el tiempo del espacio libre». La primera palabra no lleva ال; solo la segunda lo lleva.
    example_gloss: En mi tiempo libre me gusta leer.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: أحب (uḥibb) significa «me gusta» y es igual para un hombre y una mujer. La ـي final de فراغي (farāghī) significa «mi».
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) es «escuchar música», الرسم (ar-rasm) es «dibujar» y لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) es «jugar a videojuegos».
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: 'الاستماع (al-istimāʿ) necesita إلى (ilā, «a») antes de lo que se escucha: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: 'مع (maʿa) significa «con»: مع الأصدقاء (maʿa al-aṣdiqāʾ). El artículo ال permanece unido a الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) y أبدا (abadan) son adverbios, así que nunca cambian según el género. La ا (alif) final se escribe sin ningún signo.
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: كل أسبوع (kull usbūʿ) y كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) usan كل (kull, «cada»); mira la tarjeta siguiente.
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Cada: كل'
    gloss: 'Después de كل (kull, «cada») el sustantivo va en singular y sin ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) nunca cambia: se usa la misma palabra ante un sustantivo masculino como أسبوع y ante uno femenino como عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla saca el tema de los pasatiempos
    gloss: 'Layla: Caminamos juntos a menudo. Pero ¿qué más haces en tu tiempo libre, Yusuf?'
    note: La letra inicial ن (na-) de نتمشى (natamashshā) significa «nosotros», así que el árabe no necesita una palabra aparte para «nosotros». معا (maʿan) significa «juntos».
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Los pasatiempos de Yusuf
    gloss: 'Yusuf: Me gusta cocinar, también en casa. Y hago deporte a menudo.'
    note: في البيت أيضا (fī al-bayt ayḍan) añade «también en casa». وأمارس (wa-umāris) une و («y») al verbo y se escribe como una sola palabra.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla se sorprende
    gloss: 'Layla: ¿Cocinas también en casa? ¡Si ya cocinas todo el día en tu trabajo!'
    note: تطبخ (taṭbukh) es el verbo «tú» para un hombre; a una mujer se le dice تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) significa «todo el día».
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf se explica
    gloss: 'Yusuf: Sí, pero me parece que cocinar es relajante. Y tú, ¿qué te gusta hacer?'
    note: 'أجد (ajid) significa «encuentro / me parece» y مريحا (murīḥan) significa «relajante». وأنت (wa-anta) une و a أنت: «y tú».'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Los pasatiempos de Layla
    gloss: 'Layla: Me gusta leer y escucho música a menudo.'
    note: 'و une los dos pasatiempos: أحب القراءة (uḥibb al-qirāʾa) y وأستمع (wa-astamiʿ, «y escucho»). Se escribe unida a la palabra siguiente.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf pregunta por los videojuegos
    gloss: 'Yusuf: ¿Tú también juegas a videojuegos?'
    note: تلعبين (talʿabīn) es el verbo «tú» para una mujer, porque Yusuf le pregunta a Layla; para un hombre es تلعب (talʿab). هل (hal) inicia una pregunta de sí o no.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Layla responde
    gloss: 'Layla: No, nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: 'أبدا (abadan) significa «nunca» y أحيانا (aḥyānan) «a veces». El verbo se niega con لا (lā): لا ألعب (lā alʿab) significa «no juego».'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Comparar aficiones
    gloss: Yusuf y yo caminamos juntos a menudo. Pero también tenemos otros pasatiempos. A Yusuf le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y escucho música a menudo. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer en tu tiempo libre?
    note: El mensaje de Layla resume datos de una lección anterior y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      نتمشى: pasea
      كثيرا: a menudo
      معا: juntos
      أخرى: otros
      يطبخ: cocina
      يحب: le gusta
      البيت: la casa (en casa)
      ويمارس: hace deporte
      أقرأ: leer
      وأستمع: escucho
      الموسيقى: música
      أرسم: dibujo
      أحيانا: a veces
      ألعب: jugar (videojuegos)
      أبدا: nunca
      فراغك: tu (tiempo) libre
      وقت: tiempo
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf pregunta por el fin de semana
    gloss: 'Yusuf: ¿Qué vas a hacer este fin de semana?'
    note: 'ستفعلين (sa-tafʿalīn) es futuro: la letra inicial س (sa-) lo marca y la terminación ين indica que habla una mujer. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) es el fin de semana.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla no se decide
    gloss: 'Layla: Todavía no lo sé. Me gusta leer, pero también quiero salir.'
    note: لا أعرف بعد (lā aʿrif baʿd) significa todavía no lo sé. أن أخرج (an akhruj) significa salir.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf propone un plan
    gloss: 'Yusuf: ¿Damos un paseo juntos? Después cocinaré para nosotros.'
    note: 'هل نتمشى (hal natamashshā) es la forma habitual de proponer algo juntos: هل + un verbo en «nosotros». لنا (lanā) es ل (para) + نا (nosotros), escrito como una sola palabra.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla acepta
    gloss: 'Layla: ¡Buena idea! Me gustan tanto caminar como cocinar.'
    note: 'كليهما (kilayhimā) significa ambos y va al final, refiriéndose a las dos cosas: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf confirma
    gloss: 'Yusuf: Perfecto. ¡Entonces nos vemos el sábado!'
    note: يوم السبت (yawm as-sabt) significa el sábado. La ل de ال no se pronuncia delante de س, una letra solar, por eso escribimos as-sabt.
