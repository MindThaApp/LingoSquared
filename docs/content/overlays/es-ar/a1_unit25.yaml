course:
  title: Árabe en español A1
  description: 'Árabe para principiantes para describir actividades del tiempo libre: vocabulario de pasatiempos, expresiones de frecuencia, preguntar y responder qué hace alguien en su tiempo libre y comparar los pasatiempos de dos personas.'
