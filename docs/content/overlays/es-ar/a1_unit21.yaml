teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: La ropa
    gloss: ropa
    note: ملابس (malābis) es un sustantivo plural que significa ropa.
    example_gloss: Quiero ropa.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Camisa
    gloss: camisa
    note: 'قميص (qamīṣ) significa camisa; después de أريد lleva la terminación de objeto -an: قميصا (qamīṣan).'
    example_gloss: Quiero una camisa.
  ar.a1.unit21.lesson01.teach.blue:
    title: Azul
    gloss: azul
    note: 'أزرق (azraq) es la forma masculina, que concuerda con قميص; con un sustantivo femenino pasa a ser زرقاء (zarqāʾ). Después de أريد, أزرق no lleva alif añadida: قميصا أزرق.'
    example_gloss: Quiero una camisa azul.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Una camisa azul
    gloss: una camisa azul
    note: 'En árabe el color va después del objeto: قميصا أزرق (qamīṣan azraq).'
    example_gloss: Quiero una camisa azul.
  ar.a1.unit21.lesson02.teach.size:
    title: Talla
    gloss: la talla
    note: مقاس (maqās) significa talla; ما المقاس؟ (mā l-maqās) pregunta por la talla.
    example_gloss: ¿Qué talla?
  ar.a1.unit21.lesson02.teach.medium:
    title: Talla mediana
    gloss: talla mediana
    note: 'متوسط (mutawassiṭ) significa mediano; con بـ (bi-, de/en) se une a un objeto: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), una camisa de talla mediana.'
    example_gloss: Quiero una camisa de talla mediana.
  ar.a1.unit21.lesson02.teach.price:
    title: Diez dirhams
    gloss: diez dirhams
    note: 'بعشرة (bi-ʿashara) significa por diez: el prefijo بـ indica el precio, como en la unidad de compras.'
    example_gloss: La camisa cuesta diez dirhams.
  ar.a1.unit21.lesson02.teach.line01:
    title: Pedir un artículo
    gloss: Layla pide una camisa azul.
    note: من فضلك mantiene la petición cortés.
    example_gloss: 'Layla dijo: Quiero una camisa azul, por favor.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Preguntar la talla
    gloss: El vendedor pregunta qué talla.
    note: 'El vendedor pregunta por la talla: ما المقاس؟'
    example_gloss: 'El vendedor dijo: ¿Qué talla?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Dar la talla
    gloss: Layla dice talla mediana.
    note: Esto responde directamente a la pregunta sobre la talla.
    example_gloss: 'Layla dijo: Talla mediana.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Entregar el artículo y decir el precio
    gloss: El vendedor entrega la camisa y dice el precio.
    note: 'تفضلي (tafaḍḍalī) se dice a una mujer al entregarle algo; a un hombre: تفضل (tafaḍḍal).'
    example_gloss: 'El vendedor dijo: Tenga. La camisa cuesta diez dirhams.'
