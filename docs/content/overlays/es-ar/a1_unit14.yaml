teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: Me gusta
    gloss: me gusta
    note: أحب (uḥibbu) significa «me gusta» o «amo». En árabe se usa ال («el/la») para hablar de las cosas en general, así que «me gusta el café» es أحب القهوة, literalmente «me gusta el café».
    example_gloss: Me gusta el café.
  ar.a1.unit14.lesson01.teach.tea:
    title: Té
    gloss: té
    note: شاي (shāy) es «té»; الشاي (ash-shāy) añade ال, como se hace en árabe al hablar del té en general.
    example_gloss: No me gusta el té.
  ar.a1.unit14.lesson01.teach.dislike:
    title: No me gusta
    gloss: no me gusta
    note: 'En español la negación va con «no» delante del verbo, y en árabe también: se usa لا antes de أحب, sin ningún verbo auxiliar.'
    example_gloss: No me gusta el té.
  ar.a1.unit14.lesson01.teach.water:
    title: Agua
    gloss: agua
    note: الماء (al-māʾ) es ماء («agua», de la unidad de comida) con ال, que se usa para hablar del agua en general.
    example_gloss: Me gusta el agua.
  ar.a1.unit14.lesson01.teach.and_not:
    title: Y no
    gloss: y no
    note: 'ولا (wa-lā) es و («y») unida a لا («no»): añade algo que no te gusta después de algo que sí.'
    example_gloss: Me gusta el café y no me gusta el té.
  ar.a1.unit14.lesson02.teach.prefer:
    title: prefiero
    gloss: prefiero
    note: 'أفضل (ufaḍḍilu) significa «prefiero»: eliges una opción antes que otra.'
    example_gloss: Prefiero el café.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: ¿Qué prefieres?
    gloss: ¿Qué prefieres?
    note: تفضل aquí es tufaḍḍil, «prefieres», dicho a un hombre; a una mujer se le dice تفضلين (tufaḍḍilīn). Es una palabra distinta de تفضل (tafaḍḍal, «aquí tienes») de la unidad de comida, aunque se escribe igual.
    example_gloss: 'Nour dijo: «¿Qué prefieres, Yusuf?»'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour pregunta
    gloss: Nour le pregunta a Yusuf qué prefiere.
    note: 'نور (Nour) es la hermana de Yusuf. Dice تفضل porque le pregunta a un hombre; a una mujer: ماذا تفضلين؟'
    example_gloss: 'Nour dijo: «¿Qué prefieres, Yusuf?»'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf prefiere el café
    gloss: Yusuf dice que prefiere el café.
    note: أفضل elige una opción entre otras; أحب simplemente dice que algo te gusta.
    example_gloss: 'Yusuf dijo: «Prefiero el café».'
  ar.a1.unit14.lesson02.teach.line03:
    title: A Yusuf no le gusta el té
    gloss: Yusuf dice que no le gusta el té.
    note: لا أحب expresa simplemente que algo no te gusta.
    example_gloss: 'Yusuf dijo: «No me gusta el té».'
  ar.a1.unit14.lesson02.teach.line04:
    title: A Nour le gusta el agua
    gloss: Nour dice que le gusta el agua.
    note: Se puede añadir أنا («yo») para dar énfasis.
    example_gloss: 'Nour dijo: «A mí me gusta el agua».'
