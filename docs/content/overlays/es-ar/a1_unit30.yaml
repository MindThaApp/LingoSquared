    gloss: buscar
    example_gloss: Consulto la previsión del tiempo.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: Un verbo con عن
    gloss: 'El verbo أبحث (abḥath) va seguido de عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). En cambio, أستخدم (astakhdim) lleva el complemento directamente: أستخدم هاتفي.'
    note: عن (ʿan) significa «sobre» o «por». Cada verbo árabe tiene su propia preposición, así que conviene aprenderlos juntos.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Karim busca el pronóstico del tiempo
    gloss: Karim busca el pronóstico del tiempo.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Luego se va a correr
    gloss: Luego se va a correr.
    note: 'ثم (thumma) significa «luego» y es una palabra independiente, a diferencia de و. يذهب للركض (yadhhab li-r-rakḍ) significa «va a correr»: ل + الركض se convierte en للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Layla propone un plan
    gloss: 'Layla: ¿Hacemos deporte el sábado a las diez?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Yusuf acepta
    gloss: 'Yusuf: ¡Buena idea! Buscaré el pronóstico del tiempo.'
    note: 'فكرة جيدة (fikra jayyida): el adjetivo جيدة termina en ة como el sustantivo, porque ambos son femeninos. سأبحث (sa-abḥath) es el futuro: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf revisa el tiempo
    gloss: 'Yusuf: ¡El sábado hará sol!'
    note: الجو مشمس (al-jaww mushmis) significa «el tiempo está soleado», sin ninguna palabra para «está». مشمس es masculino porque concuerda con الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Karim ve el mensaje
    gloss: 'Karim: Veo el mensaje. ¡Hasta el sábado!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + un día
    gloss: 'Ya conoces إلى اللقاء (ilā al-liqāʾ, adiós). Puedes añadir un día: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: ¿Quién usa qué?
    gloss: Layla llama a Yusuf todos los días. Usa su teléfono, no una aplicación. Yusuf no tiene computadora en casa, pero usa internet en su teléfono. Karim busca el pronóstico del tiempo cada mañana. Luego se va a correr. Sara envía mensajes a Layla a menudo. ¿Tú también usas tu teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
    glosses:
      تتصل: llama
      كل: cada
      يوم: día
      تستخدم: usa
      هاتفها: teléfono
      تطبيقا: aplicación
      حاسوب: ordenador
      البيت: en casa
      الإنترنت: internet
      يبحث: consulta
      صباح: mañana
      توقعات: pronóstico (del tiempo)
      يذهب: va
      للركض: para correr
      ترسل: envía
      كثيرا: a menudo
      رسالة: mensaje
      تستعمل: usar
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Karim busca el pronóstico cada mañana
    gloss: Karim busca el pronóstico del tiempo cada mañana.
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: Sara escribe a Layla a menudo
    gloss: Sara envía mensajes a Layla a menudo.
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: Layla confirma el plan
    gloss: 'Layla: Veo el mensaje. ¿Hacemos deporte el sábado a las diez en el parque?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Yusuf confirma el tiempo
    gloss: 'Yusuf: Sí, ¡y el sábado hará sol!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: El plan de Karim
    gloss: 'Karim: Entonces correré. Después también jugaré al fútbol.'
    note: 'سأركض (sa-arkuḍ) significa «correré»: س marca el futuro. بعد ذلك (baʿda dhālik) significa «después de eso».'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: El plan de Sara
    gloss: 'Sara: Prefiero nadar, pero yo también iré al parque.'
    note: أفضل (ufaḍḍil) significa «prefiero». لكنني (lākinnanī) significa «pero yo», y سآتي (sa-ātī) significa «vendré».
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Layla cierra la conversación
    gloss: 'Layla: ¡Genial! ¡Hasta el sábado en el parque!'
    note: Cierra en una sola línea el hilo de mensajes de esta unidad y el plan de la unidad de deportes.
