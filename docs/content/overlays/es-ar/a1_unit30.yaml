  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Mensaje: enviar y leer'
    gloss: رسالة (risāla) significa un mensaje que se envía (أرسل رسالة, ursil risāla) o se lee (أقرأ رسالة, aqraʾ risāla).
    note: Relaciona la palabra nueva con el texto del pronóstico del tiempo y con los mensajes que la gente envía y lee.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Layla envía un mensaje por la aplicación
    gloss: Layla envía un mensaje por la aplicación.
    note: 'ترسل (tursil) significa «ella envía»: la letra inicial ت (ta-) indica «ella». عبر (ʿabra) significa «a través de» o «por medio de».'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Yusuf lee el mensaje
    gloss: Yusuf lee el mensaje.
  ar.a1.unit30.lesson03.teach.albhth_an:
