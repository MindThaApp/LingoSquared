teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: Dolor
    gloss: dolor
    note: ألم (alam) significa «dolor»; عندي ألم (ʿindī alam) es «tengo dolor».
    example_gloss: Tengo dolor.
  ar.a1.unit17.lesson01.teach.head:
    title: Cabeza
    gloss: la cabeza
    note: الرأس (ar-raʾs) es la cabeza. El árabe dice عندي ألم في الرأس, «un dolor en la cabeza», mientras que el español dice «dolor de cabeza» con la preposición «de».
    example_gloss: Tengo dolor en la cabeza.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Estómago
    gloss: el estómago
    note: البطن (al-baṭn) es el estómago o la zona del vientre.
    example_gloss: Tengo dolor en el estómago.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Dolor de cabeza
    gloss: Tengo dolor de cabeza
    note: عندي ألم, literalmente «conmigo (hay) dolor», es como el árabe dice «tengo dolor»; في + la parte del cuerpo indica dónde.
    example_gloss: 'Layla dijo: Tengo dolor de cabeza.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: ¿Cuál es el problema?
    gloss: ¿Cuál es el problema?
    note: ما (mā) pregunta «qué»; المشكلة (al-mushkila) significa «el problema».
    example_gloss: ¿Cuál es el problema, Layla?
  ar.a1.unit17.lesson02.teach.drink:
    title: Bebe agua
    gloss: bebe agua
    note: اشربي (ishrabī) es la orden «¡bebe!» dicha a una mujer, aquí Layla; a un hombre se le dice اشرب (ishrab).
    example_gloss: 'Yusuf dijo: Bebe agua.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Descanso
    gloss: descansa
    note: استريحي (istarīḥī) es la orden «¡descansa!» dicha a una mujer; a un hombre se le dice استرح (istariḥ).
    example_gloss: Descansa hoy.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Necesito ayuda
    gloss: Necesito ayuda
    note: أحتاج (aḥtāj) significa «necesito» y مساعدة (musāʿada) significa «ayuda». También encontrarás أحتاج إلى مساعدة, con إلى; ambas formas son correctas.
    example_gloss: Tengo dolor. Necesito ayuda.
  ar.a1.unit17.lesson02.teach.line01:
    title: Preguntar por el problema
    gloss: Yusuf le pregunta a Layla cuál es el problema.
    note: يا ليلى se dirige a Layla por su nombre.
    example_gloss: 'Yusuf dijo: ¿Cuál es el problema, Layla?'
  ar.a1.unit17.lesson02.teach.line02:
    title: Decir el síntoma
    gloss: Layla dice que le duele la cabeza.
    note: El síntoma se dice directamente.
    example_gloss: 'Layla dijo: Tengo dolor de cabeza.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Un consejo sencillo
    gloss: Yusuf le dice a Layla que beba agua y descanse.
    note: 'Las dos órdenes están en femenino porque Yusuf habla con Layla; و (wa, «y») se escribe unida a la palabra siguiente: واستريحي.'
    example_gloss: 'Yusuf dijo: Bebe agua y descansa.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Gracias
    gloss: Layla da las gracias.
    note: شكرا cierra el breve intercambio.
    example_gloss: 'Layla dijo: Gracias.'
