teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Que
    gloss: que
    note: من (min) es la misma palabra que «de» (أنا من لبنان); después de una palabra de comparación significa «que».
    example_gloss: El mercado es más grande que el café.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Más grande
    gloss: más grande
    note: أكبر (akbar) viene de كبير (kabīr, «grande»). Las palabras de comparación como أكبر, أصغر, أقرب y أرخص empiezan todas por أ y mantienen la misma forma para sustantivos masculinos y femeninos.
    example_gloss: El mercado es más grande que el café.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Más pequeño
    gloss: más pequeño
    note: أصغر (aṣghar), «más pequeño», tiene el mismo patrón con أ que أكبر.
    example_gloss: El café es más pequeño que el mercado.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Más cerca
    gloss: más cerca
    note: 'أقرب (aqrab) compara distancias: «más cerca», «más cercano».'
    example_gloss: El café está más cerca que el mercado.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: El mercado es más grande
    gloss: El mercado es más grande que el café
    note: En esta comparación, el árabe no necesita una palabra aparte para «es».
    example_gloss: 'Yusuf dijo: El mercado es más grande que el café.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Más cerca
    gloss: más cerca
    note: 'أقرب (aqrab) compara distancias: «más cerca», «más cercano».'
    example_gloss: El café está más cerca que el mercado.
  ar.a1.unit15.lesson02.teach.cheaper:
    title: Más barato
    gloss: más barato
    note: 'أرخص (arkhaṣ) compara precios: «más barato».'
    example_gloss: El agua es más barata que el café.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: El café está más cerca
    gloss: El café está más cerca que el mercado
    note: Mantén من delante del segundo elemento.
    example_gloss: 'Yusuf dijo: El café está más cerca que el mercado.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Preguntar una preferencia
    gloss: Layla le pregunta a Yusuf qué prefiere.
    note: 'Layla dice تفضل (tufaḍḍil) porque se lo pregunta a un hombre; a una mujer se le diría: ماذا تفضلين؟'
    example_gloss: 'Layla dijo: ¿Qué prefieres?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Preferir el café
    gloss: Yusuf dice que prefiere el café.
    note: أفضل puede llevar un lugar como opción preferida.
    example_gloss: 'Yusuf dijo: Prefiero el café.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Comparar distancias
    gloss: Yusuf dice que el café está más cerca que el mercado.
    note: أقرب من da la razón.
    example_gloss: 'Yusuf dijo: El café está más cerca que el mercado.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Comparar tamaños
    gloss: Nour añade que el mercado es más grande que el café.
    note: 'والسوق (was-sūq) es و («y») unida a السوق: «y el mercado».'
    example_gloss: 'Nour dijo: Y el mercado es más grande que el café.'
