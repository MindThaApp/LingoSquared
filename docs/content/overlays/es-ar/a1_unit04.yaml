teaching:
  ar.a1.unit04.lesson01.teach.tareekh:
    title: Fecha
    gloss: fecha
    note: En esta pregunta, تاريخ significa una fecha del calendario.
    example_gloss: ¿Qué fecha es hoy?
  ar.a1.unit04.lesson01.teach.al_yawm:
    title: Hoy
    gloss: hoy
    note: اليوم se usa tanto para «hoy» como para «el día», según el contexto.
    example_gloss: ¿Qué fecha es hoy?
  ar.a1.unit04.lesson01.teach.ma_tareekh:
    title: ¿Qué fecha es hoy?
    gloss: ¿Qué fecha es hoy?
    note: El árabe coloca la palabra interrogativa ما delante del sintagma nominal تاريخ اليوم.
    example_gloss: 'Layla dijo: ¿Qué fecha es hoy?'
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: De mayo
    gloss: de mayo
    note: 'Las fechas usan من antes del mes: الخامس من مايو.'
    example_gloss: Hoy es cinco de mayo.
  ar.a1.unit04.lesson01.teach.may:
    title: Mayo
    gloss: mayo
    note: مايو (māyū) es el nombre de mayo que se usa en Egipto y en gran parte del mundo árabe; en el Líbano, Siria, Jordania e Irak ese mismo mes se llama أيار (ayyār).
    example_gloss: Hoy es cinco de mayo.
  ar.a1.unit04.lesson01.teach.june:
    title: Junio
    gloss: junio
    note: يونيو (yūnyū) es el nombre de junio que se usa en Egipto y en gran parte del mundo árabe; en el Líbano, Siria, Jordania e Irak ese mismo mes se llama حزيران (ḥazīrān).
    example_gloss: Hoy es seis de junio.
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: El quinto
    gloss: el quinto
    note: الخامس es el ordinal que se usa para el día 5 en esta fecha sencilla.
    example_gloss: Hoy es cinco de mayo.
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: El sexto
    gloss: el sexto
    note: السادس es el ordinal que se usa para el día 6.
    example_gloss: Hoy es seis de junio.
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: 5 de mayo
    gloss: el cinco de mayo
    note: 'Como en español («cinco de mayo»), se usa من entre el día y el mes: الخامس من مايو.'
    example_gloss: El cinco de mayo.
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: 6 de junio
    gloss: el seis de junio
    note: 'Así la fecha queda clara: día y mes.'
    example_gloss: El seis de junio.
  ar.a1.unit04.lesson02.teach.line01:
    title: Preguntar la fecha
    gloss: Layla pregunta la fecha de hoy.
    note: ما تاريخ اليوم؟ pregunta por la fecha del calendario, no por la hora.
    example_gloss: 'Layla dijo: ¿Qué fecha es hoy?'
  ar.a1.unit04.lesson02.teach.line02:
    title: Decir la fecha
    gloss: Yusuf dice que es 5 de mayo.
    note: La respuesta empieza con اليوم.
    example_gloss: 'Yusuf dijo: Hoy es cinco de mayo.'
  ar.a1.unit04.lesson02.teach.line03:
    title: Mencionar una clase
    gloss: Layla dice que hoy tiene una clase.
    note: عندي significa «tengo» y se usó antes con los números.
    example_gloss: 'Layla dijo: Gracias. Hoy tengo una clase.'
  ar.a1.unit04.lesson02.teach.line04:
    title: Indicar la fecha de la clase
    gloss: Yusuf indica la fecha de la clase.
    note: في indica cuándo tiene lugar la clase.
    example_gloss: 'Yusuf dijo: La clase es el cinco de mayo.'
