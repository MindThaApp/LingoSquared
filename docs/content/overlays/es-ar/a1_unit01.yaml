teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: El árabe se escribe de derecha a izquierda
    gloss: El árabe se escribe de derecha a izquierda.
    note: Lee el árabe desde el borde derecho hacia la izquierda.
  ar.a1.unit01.lesson01.teach.mim:
    title: La letra م
    gloss: m
    note: م representa el sonido m y cambia de forma según su posición en la palabra.
  ar.a1.unit01.lesson01.teach.ra:
    title: La letra ر
    gloss: r
    note: ر representa una r vibrante (como la de «pero») y no se une a la letra que le sigue.
  ar.a1.unit01.lesson01.teach.ha:
    title: La letra ح
    gloss: ḥ
    note: ح es una h aspirada y suave que se produce en lo profundo de la garganta; no es la h muda del español, que no se pronuncia.
  ar.a1.unit01.lesson01.teach.ba:
    title: La letra ب
    gloss: b
    note: ب representa el sonido b y se une a las letras vecinas.
  ar.a1.unit01.lesson01.teach.alef:
    title: La letra ا
    gloss: ā / a
    note: ا marca una vocal larga ā y no se une a la letra siguiente.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Forma مرحبا
    gloss: hola
    note: مرحبا se lee marḥaban. Las vocales breves normalmente no se escriben en árabe.
    example_gloss: ¡Hola! Soy Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Hola
    gloss: hola
    note: مرحبا es un saludo cálido y versátil, adecuado en casi cualquier situación.
    example_gloss: Hola, ¿cómo estás?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Buenos días
    gloss: buenos días
    note: صباح الخير se lee ṣabāḥ al-khayr y significa literalmente «mañana de bien».
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Buenas tardes o buenas noches
    gloss: buenas tardes / buenas noches
    note: مساء الخير se lee masāʾ al-khayr y se usa desde última hora de la tarde hasta la noche.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Despedida
    gloss: adiós
    note: مع السلامة se lee maʿa as-salāma, literalmente «con seguridad»; es la despedida general habitual.
    example_gloss: Gracias, ¡adiós!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Gracias
    gloss: gracias
    note: شكرا se lee shukran y sirve en cualquier registro.
    example_gloss: Muchas gracias.
  ar.a1.unit01.lesson02.teach.afwan:
    title: De nada
    gloss: de nada
    note: عفوا (ʿafwan) es la respuesta habitual a شكرا; en otro contexto también puede significar «perdón».
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Buenas noches
    gloss: buenas noches (para ir a dormir)
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) se dice al despedirse por la noche o al irse a dormir; no es un saludo de inicio. تصبح es la forma para un hombre; para una mujer se dice تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Bienvenido
    gloss: bienvenido
    note: أهلا وسهلا (ahlan wa sahlan) se usa para dar la bienvenida a un invitado o para saludar con calidez a alguien que llega.
    example_gloss: ¡Bienvenido! Bienvenido a ti.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: Hasta pronto
    gloss: hasta pronto / hasta la vista
    note: إلى اللقاء (ilā al-liqāʾ) es una despedida elegante y neutra.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Buenos días, respuesta
    gloss: buenos días [respuesta]
    note: صباح النور (ṣabāḥ an-nūr, «mañana de luz») es la respuesta habitual a صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Buenas tardes o noches, respuesta
    gloss: buenas tardes / buenas noches [respuesta]
    note: مساء النور (masāʾ an-nūr) es la respuesta habitual a مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Que tengas un buen día
    gloss: que tengas un buen día
    note: يوما سعيدا (yawman saʿīdan) es un cálido deseo de despedida.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: ¿Cómo estás?
    gloss: ¿Cómo está usted?
    note: كيف حالك؟ (kayfa ḥāluk) es la forma habitual de preguntar cómo está alguien; sin vocales, la escritura sirve para cualquier interlocutor.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: «Tú» masculino y femenino
    gloss: tú (masc.) / tú (fem.)
    note: En árabe hablado se distingue أنتَ (anta, a un hombre) de أنتِ (anti, a una mujer), y también حالَك de حالِك. Sin los signos vocálicos que se muestran aquí, las formas escritas que se usan en este curso son idénticas para ambos.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Bien
    gloss: bien
    note: بخير (bikhayr) es la respuesta positiva habitual a كيف حالك؟
    example_gloss: Hoy estoy bien.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Gracias a Dios
    gloss: gracias a Dios / alabado sea Dios
    note: الحمد لله (al-ḥamdu lillāh) suele acompañar a بخير en la respuesta, sin importar la práctica religiosa de quien habla; funciona como un cierre conversacional corriente, parecido a «gracias a Dios» en la expresión «bien, gracias a Dios» en español.
    example_gloss: Bien, gracias a Dios.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: ¿Y tú?
    gloss: ¿Y usted?
    note: وأنت؟ (wa anta a un hombre, wa anti a una mujer) devuelve la pregunta; la escritura sin vocales es la misma para ambos.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Excelente
    gloss: excelente / genial
    note: ممتاز (mumtāz) es una versión más entusiasta que بخير.
    example_gloss: ¡Hoy estoy genial!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: No está mal
    gloss: no está mal
    note: لا بأس (lā baʾs) es una respuesta moderada y natural, no una queja.
