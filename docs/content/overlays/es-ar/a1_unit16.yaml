teaching:
  ar.a1.unit16.lesson01.teach.ticket:
    title: Billete
    gloss: billete
    note: 'تذكرة (tadhkira) es un sustantivo femenino: las palabras que terminan en ة suelen ser femeninas.'
    example_gloss: Quiero un billete.
  ar.a1.unit16.lesson01.teach.train:
    title: Tren
    gloss: el tren
    note: 'القطار (al-qiṭār): ال significa «el».'
    example_gloss: El tren sale a las cinco.
  ar.a1.unit16.lesson01.teach.to_cairo:
    title: A El Cairo
    gloss: a El Cairo
    note: القاهرة (al-qāhira) es El Cairo; إلى (ilā) indica el destino.
    example_gloss: Quiero un billete a El Cairo.
  ar.a1.unit16.lesson01.teach.ticket_request:
    title: Quiero un billete
    gloss: Quiero un billete a El Cairo
    note: أريد sirve para una petición sencilla de viaje.
    example_gloss: Quiero un billete a El Cairo, por favor.
  ar.a1.unit16.lesson02.teach.platform:
    title: Andén
    gloss: el andén
    note: الرصيف (ar-raṣīf) es el andén de una estación; la misma palabra también significa acera.
    example_gloss: El andén está aquí.
  ar.a1.unit16.lesson02.teach.second_platform:
    title: Andén dos
    gloss: andén dos
    note: الثاني (ath-thānī) significa «segundo»; es la forma masculina, que concuerda con الرصيف. Como un adjetivo, va después del sustantivo y también lleva ال.
    example_gloss: Del andén dos.
  ar.a1.unit16.lesson02.teach.which_platform:
    title: ¿Qué andén?
    gloss: ¿de qué andén?
    note: أي (ayy) pregunta «cuál» o «qué».
    example_gloss: 'Layla dijo: ¿De qué andén?'
  ar.a1.unit16.lesson02.teach.line01:
    title: Layla pide un billete
    gloss: Layla pide un billete a El Cairo.
    note: من فضلك hace que la petición sea cortés.
    example_gloss: 'Layla dijo: Quiero un billete a El Cairo, por favor.'
  ar.a1.unit16.lesson02.teach.line02:
    title: Hora de salida
    gloss: El empleado indica la hora del tren.
    note: في الساعة introduce la hora de salida.
    example_gloss: 'El empleado dijo: El tren sale a las cinco.'
  ar.a1.unit16.lesson02.teach.line03:
    title: Pregunta por el andén
    gloss: Layla pregunta por el andén.
    note: رصيف aparece sin ال después de أي.
    example_gloss: 'Layla dijo: ¿De qué andén?'
  ar.a1.unit16.lesson02.teach.line04:
    title: Respuesta sobre el andén
    gloss: El empleado dice que es el andén dos.
    note: من الرصيف الثاني responde a la pregunta sobre el andén.
    example_gloss: 'El empleado dijo: Del andén dos.'
