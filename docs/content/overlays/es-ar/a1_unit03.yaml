teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Uno
    gloss: uno
    note: واحد (wāḥid) también se usa solo, sin sustantivo, para responder a «¿cuántos?».
    example_gloss: Tengo un libro.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Dos
    gloss: dos
    note: اثنان (ithnān) es la forma independiente de «dos», la que se usa para citarlo.
    example_gloss: Tengo dos hermanos.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Tres
    gloss: tres
    note: ثلاثة (thalātha) es la forma independiente de «tres», la que se usa para citarlo.
    example_gloss: Uno, dos, tres.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Cuatro
    gloss: cuatro
    note: أربعة (arbaʿa) es la forma independiente de «cuatro», la que se usa para citarlo.
    example_gloss: Tengo cuatro libros.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Cinco
    gloss: cinco
    note: خمسة (khamsa) es la forma independiente de «cinco», la que se usa para citarlo.
    example_gloss: Tengo cinco libros.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Seis
    gloss: seis
    note: ستة (sitta) es la forma independiente de «seis», la que se usa para citarlo.
    example_gloss: Tengo seis libros.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Siete
    gloss: siete
    note: سبعة (sabʿa) es la forma independiente de «siete», la que se usa para citarlo.
    example_gloss: Tengo siete libros.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Ocho
    gloss: ocho
    note: ثمانية (thamāniya) es la forma independiente de «ocho», la que se usa para citarlo.
    example_gloss: Tengo ocho libros.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Nueve
    gloss: nueve
    note: تسعة (tisʿa) es la forma independiente de «nueve», la que se usa para citarlo.
    example_gloss: Tengo nueve dírhams.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Diez
    gloss: diez
    note: عشرة (ʿashara) es la forma independiente de «diez», la que se usa para citarlo.
    example_gloss: Tengo diez dinares.
  ar.a1.unit03.lesson03.teach.kam:
    title: ¿Cuánto cuesta esto?
    gloss: ¿Cuánto cuesta esto?
    note: كم هذا؟ (kam hādhā) es una forma sencilla de preguntar un precio; بكم هذا؟ (bi-kam hādhā, «¿por cuánto es esto?») también es muy común.
  ar.a1.unit03.lesson03.teach.raqam:
    title: Número
    gloss: número
    note: رقم (raqam) es la palabra general para «número», como en un número de teléfono.
    example_gloss: Mi número es uno.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Preguntar el precio
    gloss: Yusuf pregunta cuánto cuesta algo.
    note: كم هذا؟ abre el intercambio.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Decir el precio
    gloss: Layla dice que cuesta cinco.
    note: بخمسة une la preposición بـ («por», «a») directamente al número.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Preguntar por otro artículo
    gloss: Yusuf señala otra cosa.
    note: وهذا؟ acorta la pregunta aprovechando el contexto anterior.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Di el segundo precio
    gloss: Layla dice que cuesta diez.
    note: بعشرة sigue el mismo patrón que بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Dar las gracias
    gloss: Yusuf le da las gracias.
    note: شكرا, de la unidad de saludos, cierra el intercambio.
