teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: Derecha
    gloss: derecha (dirección)
    note: يمين (yamīn) designa el lado derecho; اليمين (al-yamīn) es «la derecha».
    example_gloss: A la derecha.
  ar.a1.unit10.lesson01.teach.left:
    title: Izquierda
    gloss: izquierda (dirección)
    note: يسار (yasār) designa el lado izquierdo; اليسار (al-yasār) es «la izquierda».
    example_gloss: A la izquierda.
  ar.a1.unit10.lesson01.teach.forward:
    title: Todo recto
    gloss: todo recto
    note: إلى الأمام (ilā l-amām) significa literalmente «hacia el frente»; es la forma habitual de decir «todo recto» o «hacia delante».
    example_gloss: La biblioteca está todo recto.
  ar.a1.unit10.lesson01.teach.to_right:
    title: A la derecha
    gloss: a la derecha
    note: إلى (ilā) indica movimiento hacia una dirección o un lugar.
    example_gloss: El mercado está a la derecha.
  ar.a1.unit10.lesson02.teach.walk:
    title: Camina
    gloss: camina
    note: امش (imshi) es el imperativo «¡camina!» dirigido a un hombre; a una mujer se le dice امشي (imshī). Es el verbo habitual para indicar un camino a pie.
    example_gloss: Camina todo recto.
  ar.a1.unit10.lesson02.teach.then:
    title: Luego
    gloss: entonces
    note: ثم (thumma) une dos pasos de un recorrido en orden.
    example_gloss: Camina todo recto y luego a la derecha.
  ar.a1.unit10.lesson02.teach.route:
    title: Dos pasos de un recorrido
    gloss: Camina todo recto y luego a la derecha
    note: Primer paso + ثم + segundo paso. El verbo no se repite después de ثم.
    example_gloss: 'Layla dijo: Camina todo recto y luego a la derecha.'
  ar.a1.unit10.lesson02.teach.line01:
    title: Preguntar por la biblioteca
    gloss: Yusuf pregunta dónde está la biblioteca.
    note: أين المكتبة؟ ya se usó en la unidad de lugares.
    example_gloss: 'Yusuf dijo: ¿Dónde está la biblioteca?'
  ar.a1.unit10.lesson02.teach.line02:
    title: Dar indicaciones
    gloss: Layla da dos indicaciones básicas del camino.
    note: Layla dice امش porque habla con un hombre; a una mujer le diría امشي.
    example_gloss: 'Layla dijo: Camina todo recto y luego a la derecha.'
  ar.a1.unit10.lesson02.teach.line03:
    title: Dar las gracias
    gloss: Yusuf da las gracias.
    note: شكرا cierra con cortesía el intercambio de ayuda.
    example_gloss: 'Yusuf dijo: Gracias.'
  ar.a1.unit10.lesson02.teach.line04:
    title: Confirmar el lugar
    gloss: Layla dice que la biblioteca está cerca del mercado.
    note: 'Aquí se reutiliza قرب de la unidad de lugares: la biblioteca está cerca del mercado.'
    example_gloss: 'Layla dijo: La biblioteca está cerca del mercado.'
