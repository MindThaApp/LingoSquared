teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Casa
    gloss: casa
    note: بيت (bayt) es «casa»; la terminación ـي significa «mi», así que بيتي (baytī) es «mi casa».
    example_gloss: Mi casa está cerca de la biblioteca.
  ar.a1.unit19.lesson01.teach.room:
    title: Habitación
    gloss: habitación
    note: غرفة (ghurfa) es femenino (termina en ة), por eso va seguida de واحدة, en femenino.
    example_gloss: En mi casa hay una habitación.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Cocina
    gloss: cocina
    note: 'مطبخ (maṭbakh) es «cocina». El árabe no tiene una palabra para «hay» aquí: empezar con في بيتي («en mi casa») cumple esa función.'
    example_gloss: En mi casa hay una cocina.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Una habitación
    gloss: una habitación
    note: 'El numeral «uno» va después del sustantivo y concuerda con él: غرفة واحدة (ghurfa wāḥida); con un sustantivo masculino es واحد.'
    example_gloss: En mi casa hay una habitación.
  ar.a1.unit19.lesson02.teach.table:
    title: Mesa
    gloss: mesa
    note: طاولة (ṭāwila) es «mesa»; como غرفة, termina en ة y es femenino.
    example_gloss: Tengo una mesa en la habitación.
  ar.a1.unit19.lesson02.teach.in_room:
    title: En la habitación
    gloss: en la habitación
    note: الغرفة (al-ghurfa) significa «la habitación».
    example_gloss: La mesa está en la habitación.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Cerca de la biblioteca
    gloss: cerca de la biblioteca
    note: قرب (qurb) significa «cerca de»; المكتبة es «la biblioteca», de la unidad de los lugares.
    example_gloss: Mi casa está cerca de la biblioteca.
  ar.a1.unit19.lesson02.teach.line01:
    title: Preguntar dónde
    gloss: Layla pregunta dónde está la casa de Yusuf.
    note: أين significa «dónde»; بيتك (baytuka) es «tu casa», dicho a un hombre; a una mujer se le dice baytuki, que se escribe igual.
    example_gloss: 'Layla dijo: ¿Dónde está tu casa, Yusuf?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Ubicación de la casa
    gloss: Yusuf dice que su casa está cerca de la biblioteca.
    note: بيتي significa «mi casa».
    example_gloss: 'Yusuf dijo: Mi casa está cerca de la biblioteca.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Las habitaciones
    gloss: Yusuf dice que su casa tiene una habitación y una cocina.
    note: 'و (wa, «y») une las dos partes de la casa y se escribe pegada a la palabra siguiente: ومطبخ.'
    example_gloss: 'Yusuf dijo: En mi casa hay una habitación y una cocina.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Preguntar por un objeto
    gloss: Layla pregunta a Yusuf si tiene una mesa.
    note: هل inicia una pregunta de sí o no; عندك (ʿindaka) significa «tienes», dicho a un hombre; a una mujer se le dice ʿindaki, que se escribe igual.
    example_gloss: 'Layla dijo: ¿Tienes una mesa?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Ubicación del objeto
    gloss: Yusuf dice que tiene una mesa en la habitación.
    note: عندي expresa posesión.
    example_gloss: 'Yusuf dijo: Sí, tengo una mesa en la habitación.'
