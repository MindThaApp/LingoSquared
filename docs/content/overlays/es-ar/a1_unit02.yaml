teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: ¿Cómo te llamas?
    gloss: ¿Cómo se llama usted?
    note: ما اسمك؟ (mā ismuk) es la forma habitual de preguntar el nombre; sin vocalizar, la forma escrita sirve para cualquier interlocutor.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Mi nombre es
    gloss: mi nombre [es]
    note: اسمي (ismī) combina اسم («nombre») con la terminación posesiva ـي («mi»).
    example_gloss: Me llamo Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: yo
    gloss: yo
    note: أنا (anā) es el pronombre independiente «yo»; en árabe el verbo también marca la persona, pero أنا se usa para enfatizar y en oraciones nominales sencillas como esta.
    example_gloss: Soy Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Encantado de conocerte
    gloss: mucho gusto
    note: تشرفنا (tasharrafnā), literalmente «nos sentimos honrados», es la respuesta mutua habitual al conocer a alguien; cualquiera de las dos personas puede decirla primero.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: ¿De dónde eres?
    gloss: ¿De dónde eres?
    note: من أين أنت؟ (min ayna anta a un hombre, min ayna anti a una mujer) sirve para preguntar el origen de alguien; sin vocalizar, se escribe igual para ambos.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Soy de
    gloss: Soy de
    note: أنا من (anā min) va seguido directamente del nombre de un país o una ciudad.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Líbano
    gloss: Líbano
    note: لبنان (lubnān) no lleva artículo definido, a diferencia de la mayoría de los otros países de esta lección.
    example_gloss: Soy del Líbano.
  ar.a1.unit02.lesson02.teach.misr:
    title: Egipto
    gloss: Egipto
    note: مصر (miṣr) tampoco lleva artículo definido.
    example_gloss: Soy de Egipto.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Jordania
    gloss: Jordania
    note: الأردن (al-ʾurdun) siempre lleva el artículo definido الـ como parte de su nombre, igual que المغرب y العراق en esta lección.
    example_gloss: Soy de Jordania.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Marruecos
    gloss: Marruecos
    note: المغرب (al-maghrib) significa literalmente «el poniente» (el oeste); es la misma raíz que se usa para la oración del atardecer.
    example_gloss: Soy de Marruecos.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Siria
    gloss: Siria
    note: سوريا (sūryā) no lleva artículo definido.
    example_gloss: Soy de Siria.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Irak
    gloss: Irak
    note: العراق (al-ʿirāq) lleva el artículo definido.
    example_gloss: Soy de Irak.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: ¿Eres de...?
    gloss: ¿Eres de Egipto?
    note: هل (hal) es una partícula de pregunta de sí o no que se coloca al principio de la oración; por sí sola no tiene significado.
  ar.a1.unit02.lesson03.teach.naam:
    title: Sí
    gloss: sí
    note: نعم (naʿam) es la respuesta afirmativa habitual.
    example_gloss: Sí, soy de Egipto.
  ar.a1.unit02.lesson03.teach.laa:
    title: 'No'
    gloss: 'no'
    note: لا (lā) es la respuesta negativa habitual.
    example_gloss: No, soy del Líbano.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Me alegra haberte conocido
    gloss: me alegra haberte conocido
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) es una frase de cierre más cálida que تشرفنا, que se suele usar justo antes de despedirse.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Bienvenido
    gloss: bienvenido / eres bienvenido aquí
    note: 'مرحبا بك (marḥaban bik) añade بك, «a ti»: la preposición بـ con el pronombre sufijo ـك (tú); es el mismo بك de أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Saludo inicial
    gloss: Yusuf saluda a Layla.
    note: El intercambio empieza con un simple مرحبا antes de decir los nombres.
  ar.a1.unit02.lesson04.teach.line02:
    title: Saludo inicial, respuesta
    gloss: Layla le devuelve el saludo.
    note: La misma palabra مرحبا sirve para ambas partes de un saludo.
  ar.a1.unit02.lesson04.teach.line03:
    title: Preguntar el nombre
    gloss: Yusuf le pregunta su nombre.
    note: ما اسمك؟ da inicio a la presentación.
  ar.a1.unit02.lesson04.teach.line04:
    title: Preguntar el nombre, respuesta
    gloss: Layla responde y le pregunta a él.
    note: وأنت؟ retoma la pregunta sin repetir toda la frase, un atajo muy común.
  ar.a1.unit02.lesson04.teach.line05:
    title: Respuesta y mutuo placer
    gloss: Yusuf dice su nombre y que está encantado de conocerla.
    note: تشرفنا cierra el intercambio de nombres.
  ar.a1.unit02.lesson04.teach.line06:
    title: Mutuo placer, respuesta
    gloss: Layla responde con la misma frase.
    note: تشرفنا lo dicen con naturalidad las dos personas, no solo una.
  ar.a1.unit02.lesson04.teach.line07:
    title: Preguntar el origen
    gloss: Yusuf le pregunta de dónde es.
    note: من أين أنت؟ lleva la conversación al tema del origen.
  ar.a1.unit02.lesson04.teach.line08:
    title: Preguntar el origen, respuesta
    gloss: Layla responde y le pregunta a él.
    note: Ella vuelve a usar وأنت؟, el mismo atajo de la línea anterior.
  ar.a1.unit02.lesson04.teach.line09:
    title: Decir el origen
    gloss: Yusuf dice que es del Líbano.
    note: أنا من لبنان sigue el mismo patrón que se enseñó en esta lección.
  ar.a1.unit02.lesson04.teach.line10:
    title: Cerrar la conversación
    gloss: Layla dice que le alegra haberlo conocido.
    note: سعدت بلقائك indica que la conversación va llegando naturalmente a su fin.
  ar.a1.unit02.lesson04.teach.line11:
    title: Despedida
    gloss: Yusuf le da la bienvenida siempre que quiera y se despide.
    note: دائما (siempre) suaviza مرحبا بك y lo convierte en una invitación abierta antes de la despedida مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Despedida, respuesta
    gloss: Layla se despide.
    note: مع السلامة cierra el intercambio; se enseñó en la unidad 1.
