    title: Yo pago
    gloss: yo pago
    note: أدفع (adfaʿ) significa «yo pago».
    example_gloss: Pago diez dirhams.
  ar.a1.unit24.lesson01.teach.card:
    title: Tarjeta
    gloss: tarjeta
    note: 'بطاقة (biṭāqa) significa tarjeta; بالبطاقة (bil-biṭāqa) significa con tarjeta. En سأدفع (sa-adfaʿ), el prefijo سـ pone أدفع en futuro: pagaré.'
    example_gloss: Pagaré con tarjeta.
  ar.a1.unit24.lesson01.teach.cash:
    title: Efectivo
    gloss: efectivo
    note: نقدا (naqdan) significa en efectivo.
    example_gloss: Pago en efectivo.
  ar.a1.unit24.lesson02.teach.amount:
    title: Importe
    gloss: el importe
    note: مبلغ (mablagh) es una cantidad de dinero; كم المبلغ؟ (kam al-mablagh) pregunta cuánto hay que pagar.
    example_gloss: ¿Cuánto es el importe?
  ar.a1.unit24.lesson02.teach.can_pay:
    title: ¿Puedo pagar?
    gloss: ¿Puedo pagar con tarjeta?
    note: هل أستطيع (hal astaṭīʿ) significa «¿puedo?»; الدفع (ad-dafʿ) significa «pagar» (el pago).
    example_gloss: ¿Puedo pagar en efectivo?
  ar.a1.unit24.lesson02.teach.line01:
    title: Preguntar el importe
    gloss: Layla pregunta el importe.
    note: كم pregunta cuánto.
    example_gloss: 'Layla dijo: ¿Cuánto es el importe?'
  ar.a1.unit24.lesson02.teach.line02:
    title: Decir el importe
    gloss: El vendedor dice que el importe es de diez dirhams.
    note: دراهم (darāhim) es la palabra de la moneda de la unidad de compras.
    example_gloss: 'El vendedor dijo: El importe es de diez dirhams.'
  ar.a1.unit24.lesson02.teach.line03:
    title: Preguntar por el pago con tarjeta
    gloss: Layla pregunta si puede pagar con tarjeta.
    note: Pregunta por una forma de pago aceptada.
    example_gloss: 'Layla dijo: ¿Puedo pagar con tarjeta?'
  ar.a1.unit24.lesson02.teach.line04:
    title: Ofrecer formas de pago
    gloss: El vendedor dice que se puede pagar con tarjeta o en efectivo.
    note: أو (aw) significa «o».
    example_gloss: 'El vendedor dijo: Sí, o en efectivo.'
  ar.a1.unit24.lesson02.teach.line05:
    title: Elegir la forma de pago
    gloss: Layla dice que pagará con tarjeta.
    note: Con esto se completa la elección del pago.
    example_gloss: 'Layla dijo: Pagaré con tarjeta.'
