teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *lezen* (يقرأ)، و*sporten* (يمارس الرياضة)، و*koken* (يطبخ).'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*De vrije tijd* اسم من النوع *de*. وهي العبارة الأساسية للحديث عن الهوايات.'
    example_gloss: في وقت فراغي، أحب القراءة.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*Lees* هي صيغة المتكلم المفرد من الفعل *lezen* (يقرأ).'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاثة أفعال أخرى للهوايات: *muziek luisteren* (الاستماع إلى الموسيقى)، و*tekenen* (الرسم)، و*gamen* (لعب الألعاب الإلكترونية)، وهو فعل هولندي شائع مقترض من لغة أجنبية.'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: الفعل *Luisteren naar* (يستمع إلى) يأتي دائمًا مع *naar* قبل المفعول.
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: تعيد *Met vrienden* (مع الأصدقاء) استخدام *vrienden* من الدرس الأول.
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: ظروف التكرار الأربعة الأساسية. وقد ظهرت *Vaak* سابقًا في الوحدة 5 ضمن *Zie je hem vaak?*؛ أما الثلاث الأخرى فجديدة هنا.
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: تعني *Elke week* و*elk weekend* كلتاهما «كل»، لكن الصيغة تتغير بحسب نوع الاسم — انظر البطاقة التالية.
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: elke أو elk
    gloss: مع الكلمات من النوع de مثل week تستخدم elke. ومع الكلمات من النوع het مثل weekend تستخدم elk.
    note: '*Week* كلمة من النوع de (*de week*)، لذلك تأخذ *elke*؛ و*weekend* كلمة من النوع het (*het weekend*)، لذلك تأخذ *elk* — وهو نمط التوافق نفسه بين *de rekening* و*het wisselgeld* في الوحدة 23.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte تفتح موضوع الهوايات
    gloss: 'Lotte: نتمشى معًا كثيرًا. لكن ماذا تفعل أيضًا في وقت فراغك يا Omar؟'
    note: '*We wandelen vaak samen* تعيد ما ورد في الوحدة 13، حيث قالت لوتي وقال عمر إنهما يحبان *wandelen*.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: هوايات عمر
    gloss: 'عمر: أحب الطبخ، حتى في البيت. وأمارس الرياضة كثيرًا.'
    note: '*Ook thuis* (في البيت أيضًا) توضح أن عمر يطبخ للمتعة، وليس في عمله بالمطعم فقط.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: لوتي مندهشة
    gloss: 'لوتي: وتطبخ في البيت أيضًا؟ أنت تطبخ طوال اليوم في عملك أصلًا!'
    note: '*Al de hele dag* (طوال اليوم أصلًا) تؤكد كم يطبخ عمر في عمله.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: عمر يشرح
    gloss: 'عمر: نعم، لكنني أجد الطبخ مريحًا. وأنتِ، ماذا تحبين أن تفعلي؟'
    note: '*Koken vind ik ontspannend* تقدّم المفعول به *koken* إلى بداية الجملة للتأكيد، وحرفيًا: «الطبخ، أجده مريحًا».'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: هوايات لوتي
    gloss: 'لوتي: أحب القراءة وأستمع إلى الموسيقى كثيرًا.'
    note: تجمع فعلين من أفعال الهوايات في الدرسين 1 و2 في جملة واحدة بالكلمة *en* (و).
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: عمر يسأل عن ألعاب الفيديو
    gloss: 'عمر: هل تلعبين ألعاب الفيديو أيضًا؟'
    note: سؤال قصير إجابته بنعم أو لا، ويستخدم *gamen* من الدرس 2.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: لوتي تجيب
    gloss: 'لوتي: لا، لا ألعب ألعاب الفيديو أبدًا. لكنني أرسم أحيانًا!'
    note: '*Nooit* (أبدًا) و*soms* (أحيانًا) من الدرس 3، متقابلتان في إجابة واحدة.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: مقارنة الهوايات
    gloss: أنا وعمر نتمشى معًا كثيرًا. لكن لدينا هوايات أخرى أيضًا. يحب عمر الطبخ، حتى في البيت، ويمارس الرياضة كثيرًا. أحب القراءة وأستمع إلى الموسيقى كثيرًا. أرسم أحيانًا، لكنني لا ألعب ألعاب الفيديو أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخّص رسالة لوتي حقائق من الدرس 4 وتنتهي بسؤال القارئ السؤال الأساسي في الوحدة.
    glosses:
      wandelen: يتنزه
      vaak: غالبًا
      samen: معًا
      andere: أخرى
      kookt: يطبخ
      graag: يحب
      thuis: في البيت
      sport: يمارس الرياضة
      lees: القراءة
      luister: أستمع
      muziek: موسيقى
      teken: أرسم
      soms: أحيانًا
      game: ألعب ألعاب الفيديو
      nooit: أبدًا
      vrije: فراغ
      tijd: وقت
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: عمر يسأل عن عطلة نهاية الأسبوع
    gloss: 'عمر: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: '*Dit weekend* (نهاية هذا الأسبوع) تعيد التعبير الزمني من الوحدة 19.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: لوتي لم تقرر بعد
    gloss: 'لوتي: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج.'
    note: '*Naar buiten* (إلى الخارج) طريقة شائعة للتعبير عن الرغبة في مغادرة البيت.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: عمر يقترح خطة
    gloss: 'عمر: هل نتمشى معًا؟ سأطبخ لنا بعد ذلك.'
    note: '*Daarna* (بعد ذلك) تعيد كلمة الترتيب من *eerst, dan, daarna* في الوحدة 10.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: لوتي توافق
    gloss: 'لوتي: فكرة جيدة! أحب المشي والطبخ كليهما.'
    note: '*Allebei* (كلاهما) تبيّن أن لوتي تحب الأمرين بالقدر نفسه، دون تفضيل أحدهما.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: عمر يؤكد
    gloss: 'عمر: ممتاز. إذن أراكِ يوم السبت!'
    note: جملة ختام ودية تؤكد الخطة ليوم *zaterdag* (السبت).
