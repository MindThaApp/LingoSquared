teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: السؤال عن السعر الإجمالي
    gloss: كم يكلّف في المجموع؟
    note: '*In totaal* (إجمالًا) توضّح أنك تريد السعر الكلي المجمّع لا سعر قطعة واحدة.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: ذكر السعر الإجمالي
    gloss: يكلّف خمسة وعشرين يورو في المجموع.
    note: '*Kost* هي صيغة الغائب المفرد من *kosten* (يكلّف).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: الدفع بالبطاقة أو نقدًا
    gloss: يدفع بالبطاقة، يدفع نقدًا
    note: '*Pinnen* فعل هولندي خاص بالدفع بالبطاقة، مشتق من الرقم السري المستخدم للتصريح بالدفع؛ و*contant betalen* (حرفيًا «نقدًا يدفع») هو المقابل للدفع النقدي، وتأتي *contant* قبل *betalen* بوصفها ظرفًا.'
    example_gloss:
    - هل يمكنني الدفع بالبطاقة هنا؟
    - أنا أدفع نقدًا.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: السؤال عن إمكانية الدفع بالبطاقة
    gloss: هل يمكنني الدفع بالبطاقة هنا؟
    note: '*Hier* (هنا) تربط السؤال بالمكان الذي أنت فيه.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: السؤال عن طريقة الدفع المفضّلة
    gloss: هل تريد الدفع نقدًا أم بالبطاقة؟
    note: '*Wilt u* ...؟ هي الصيغة الرسمية من *wil je* ...؟، ويستخدمها هنا أمين صندوق لا يعرفك.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: الفاتورة
    gloss: الفاتورة
    note: 'اسم من الجنس المشترك: *de rekening*.'
    example_gloss: هل نقسّم الفاتورة؟
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: اقتراح تقسيم الفاتورة
    gloss: هل نقسّم الفاتورة؟
    note: تعيد *Zullen we* ...? استخدام نمط اقتراح الخطط الذي ظهر في الوحدتين 11 و19.
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: طلب الدفع على حدة
    gloss: هل يمكنني الدفع على حدة؟
    note: '*Apart* (بشكل منفصل) تصف *afrekenen* (تسوية الحساب)، وهو فعل قريب من *betalen* يُستخدم تحديدًا لإنهاء عملية الدفع.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: الباقي
    gloss: الباقي
    note: 'اسم من النوع het: *het wisselgeld*، وهو مركّب من *wisselen* (يصرف) و*geld* (مال).'
    example_gloss: تفضّل، هذا هو الباقي.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: تسليم الباقي
    gloss: تفضّل، هذا هو الباقي.
    note: '*Uw* هي صيغة الملكية الرسمية (ـك بصيغة الاحترام)، وتناسب الأسلوب الرسمي عند الصندوق.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: رفض أخذ الباقي
    gloss: لا أحتاج إلى الباقي.
    note: تعيد *Nodig hebben* (يحتاج) النمط الذي ظهر في *rugzak nodig hebben* في الوحدة 14.
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: خمسة وثلاثون
    gloss: خمسة وثلاثون
    note: '*Vijfendertig* (حرفيًا «خمسة وثلاثون») تتبع النمط الهولندي المعتاد في الأعداد المركبة: الآحاد قبل العشرات، وهو الترتيب نفسه في العربية.'
    example_gloss: يكلّف خمسة وثلاثين يورو.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: اقرأ فاتورة مطعم
    gloss: 'الفاتورة: طبقان رئيسيان وقهوتان. المجموع: خمسة وثلاثون يورو. مدفوعة بالبطاقة.'
    note: تتبّع ما طُلب، والمجموع، وطريقة الدفع.
    glosses:
      Rekening: فاتورة
      twee: اثنان
      hoofdgerechten: أطباق رئيسية
      koffies: قهوتان
      Totaal: المجموع
      vijfendertig: خمسة وثلاثون
      euro: يورو
      Betaald: مدفوعة
      pin: بطاقة
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Lotte تطلب الفاتورة
    gloss: 'Lotte: هل نطلب الفاتورة؟'
    note: الفعل *Vragen* (يطلب) يأخذ *de rekening* مفعولًا به مباشرًا.
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Omar يسأل عن المجموع
    gloss: 'Omar: نعم، فكرة جيدة. كم يبلغ المجموع؟'
    note: يعيد سؤال *hoeveel kost het in totaal?* الذي ظهر في الدرس الأول.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Lotte تذكر المجموع
    gloss: 'Lotte: المجموع خمسة وثلاثون يورو. هل نتقاسمه؟'
    note: '*Delen* (يقتسم) تشير هنا إلى *de rekening* من السياق.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Omar يصرّ على الدفع
    gloss: 'Omar: لا، دعني أدفع اليوم. لقد ساعدتني كثيرًا.'
    note: '*Laat mij* ... (دعني ...) طريقة معتادة لعرض القيام بشيء ما؛ و*geholpen* هو اسم المفعول من الفعل *helpen* (يساعد).'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Lotte متأثرة
    gloss: 'Lotte: هذا لطف منك! شكرًا لك.'
    note: '*Lief van je* (لطف منك) مجاملة دافئة وشائعة لموقف كريم.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Omar يسأل عن الدفع بالبطاقة
    gloss: 'Omar: هل يمكنني الدفع بالبطاقة هنا؟'
    note: يعيد سؤال *kan ik hier pinnen?* الذي ظهر في الدرس الثاني، لكن الآن في المطعم نفسه.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: صيغة الغائب (هو/هي)'
    gloss: Omar يدفع الفاتورة.
    note: '*Betaalt* هي صيغة الغائب المفرد من الفعل *betalen* (يدفع).'
