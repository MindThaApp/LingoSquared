teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: مرحبًا وأهلًا
    gloss: مرحبًا
    note: '*Hallo* محايدة وتصلح في اللقاءات غير الرسمية والرسمية معًا. أما *Hoi* فشائعة وغير رسمية.'
    example_gloss:
    - مرحبًا، هل أنت جديد هنا؟
    - أهلًا، أنا نور.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: 'ضمير المخاطب: الصيغة غير الرسمية والرسمية'
    gloss: أنتَ (غير رسمي، مع التشديد) / أنتَ (غير رسمي، دون تشديد) / حضرتك (رسمي)
    note: '*Jij* ضمير المخاطب المفرد غير الرسمي، ويُستخدم عند التشديد عليه أو للمقابلة. أما *Je* فهي الصيغة المعتادة غير المشدَّد عليها في الكلام اليومي. و*U* تدل على الاحترام والمسافة. وهي طبيعية في هولندا مع بعض الغرباء الأكبر سنًا وفي العلاقات الرسمية صراحةً، لكن jij/je شائعة بين البالغين في كثير من المحلات وأماكن العمل أيضًا.'
    example_gloss:
    - هل أنت جديد هنا؟ (غير رسمي، مع التشديد)
    - أنت جديد هنا. (غير رسمي، دون تشديد)
    - هل حضرتك جديد هنا؟ (رسمي)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: اسأل شخصًا من عمرك إن كان جديدًا
    gloss: هل أنت جديد هنا؟
    note: 'في السؤال تتحول *jij bent* إلى *ben jij*: يسقط حرف t عندما يأتي *jij* بعد الفعل.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: اسأل بصيغة رسمية إن كان شخص ما جديدًا
    gloss: هل حضرتك جديد هنا؟
    note: مع *u* نستخدم *bent u*، ويبقى حرف t.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: اختيار صيغة المخاطب
    gloss: 'أنتَ: غير رسمي · حضرتك: رسمي أو مهذّب'
    note: استخدم *jij/je* مع الأصدقاء والأقران والأطفال، وفي كثير من المواقف الحديثة غير المتكلَّفة. واستخدم *u* حين تقتضي العلاقة الاحترام أو المسافة؛ وتختلف التفضيلات فعلًا، لذا اتبع ما يختاره الطرف الآخر.
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: تحيات الصباح وما بعد الظهر والمساء
    gloss: صباح الخير / نهارك سعيد / مساء الخير
    note: تُستخدم *Goedemorgen* في الصباح، وعادةً حتى الظهر تقريبًا. وتُستخدم *Goedemiddag* من الظهر تقريبًا وطوال فترة ما بعد الظهر. أما *Goedenavond* فهي تحية المساء.
    example_gloss:
    - صباح الخير! كيف حالك؟
    - نهارك سعيد، كيف حال حضرتك؟ (رسمي)
    - مساء الخير! هل أنت جديد هنا؟
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: كيف الحال؟
    gloss: كيف حالك؟
    note: '*Hoe gaat het?* طريقة شائعة ومحايدة للسؤال عن حال شخص ما.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: كيف حالك؟ (غير رسمي)
    gloss: كيف حالك؟
    note: '*Met je* تحدد الشخص المخاطَب صراحةً وبصيغة غير رسمية.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: كيف حالك؟ (رسمي)
    gloss: كيف حالك؟
    note: استخدم *met u* عندما يتطلب اللقاء مخاطبة رسمية.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'بخير، شكرًا: غير رسمي'
    gloss: بخير، شكرًا.
    note: '*Dank je* تناسب المخاطبة غير الرسمية.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'بخير، شكرًا: رسمي'
    gloss: بخير، شكرًا.
    note: '*Dank u* تناسب المخاطبة الرسمية.'
  nl.a1.unit01.lesson02.teach.prima:
    title: ممتاز
    gloss: ممتاز / جيد
    note: '*Prima* إجابة قصيرة وإيجابية.'
    example_gloss: ممتاز، شكرًا لك.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: لا بأس
    gloss: ليس سيئًا
    note: '*Niet slecht* إجابة إيجابية قليلًا في العادة.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: وأنت؟ (غير رسمي)
    gloss: وأنت؟
    note: '*Jou* هي الصيغة غير الرسمية المشدَّد عليها بعد *met*.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: وأنت؟ (رسمي)
    gloss: وأنت؟
    note: '*U* تُبقي سؤال الرد رسميًا.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: السؤال عن الاسم بصيغة غير رسمية
    gloss: ما اسمك؟
    note: '*Hoe heet je?* هو سؤال الاسم المعتاد بصيغة غير رسمية.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: السؤال عن الاسم بصيغة رسمية
    gloss: ما اسمك؟
    note: '*Hoe heet u?* سؤال مهذّب؛ وثمة صيغة رسمية أخرى أقرب إلى الطابع الإداري هي *Wat is uw naam?*، وهي غير مختبَرة هنا.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: قل اسمك
    gloss: اسمي نور.
    note: '*Ik heet ...* طريقة مباشرة وقياسية لذكر اسمك.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: عرّف بنفسك بطريقة طبيعية
    gloss: أنا نور.
    note: '*Ik ben ...* شائعة خاصةً في التعارف المنطوق.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: اسمي
    gloss: اسمي نور.
    note: '*Mijn naam is ...* صحيحة، لكنها أكثر صراحة قليلًا من *Ik ben ...* أو *Ik heet ...*.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: سعيد بلقائك
    gloss: تشرفنا.
    note: عبارة ودّية وطبيعية في اللقاء الأول.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: تشرفت بمعرفتك
    gloss: تشرفت بمعرفتك
    note: '*Aangenaam* عبارة متعارف عليها وأكثر رسمية من *Leuk je te ontmoeten*.'
    example_gloss: تشرفت بمعرفتك! أنا نور.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: اسأل من أين شخص ما
    gloss: من أين أنت؟
    note: '*Kom je* هي صيغة السؤال غير الرسمية.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: اسأل بصيغة رسمية من أين شخص ما
    gloss: من أين أنت؟
    note: 'مع *u* يكون الفعل *komt*: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: من هولندا
    gloss: أنا من هولندا.
    note: استخدم *uit* قبل بلد الأصل.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: من بلجيكا
    gloss: أنا من بلجيكا.
    note: تحتوي *België* على نقطتين فوق حرف e الثاني.
  nl.a1.unit01.lesson04.teach.from_germany:
    title: من ألمانيا
    gloss: أنا من ألمانيا.
    note: '*Duitsland* هي البلد، و*Duits* هي اللغة.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: الجنسية الهولندية
    gloss: أنا هولندي.
    note: يمكن أن تدل *Nederlands* على الجنسية وعلى اللغة الهولندية أيضًا.
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: الجنسية البلجيكية
    gloss: أنا بلجيكي.
    note: '*Belgisch* تصف هنا الجنسية البلجيكية.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: التحدث بالهولندية
    gloss: أتكلم الهولندية.
    note: تُكتب أسماء اللغات في الهولندية بحرف كبير في أولها.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: التحدث بالإنجليزية
    gloss: أتكلم الإنجليزية.
    note: '*Engels* هي الكلمة الهولندية الدالة على اللغة الإنجليزية.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: التحدث بالألمانية
    gloss: أتكلم الألمانية.
    note: '*Duits* هي الكلمة الهولندية الدالة على اللغة الألمانية.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: مقهى اللغة والمكتبة
    gloss: مقهى اللغة / المكتبة
    note: '*taalcafé* لقاء خفيف الضغط لممارسة اللغة الهولندية مع الآخرين. وكثيرًا ما تستضيف المكتبات العامة في هولندا أنشطة محلية، منها مقاهي اللغة.'
    example_gloss:
    - أنا هنا من أجل مقهى اللغة.
    - أتعلم الهولندية في المكتبة.
  nl.a1.unit01.lesson05.teach.location:
    title: مكان اللقاء
    gloss: مقهى اللغة في المكتبة.
    note: هذا يحدد مكان المشهد.
  nl.a1.unit01.lesson05.teach.here_for:
    title: تأكد من النشاط المشترك
    gloss: هل أنت هنا من أجل مقهى اللغة؟
    note: هذه افتتاحية ودّية وطبيعية حين يصل شخصان من أجل النشاط نفسه.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: أكّد النشاط
    gloss: نعم، أنا هنا من أجل مقهى اللغة.
    note: تكرر الإجابة النشاط بوضوح.
  nl.a1.unit01.lesson05.teach.learning:
    title: قل ما الذي تتعلمه
    gloss: أتعلم الهولندية.
    note: '*Leer* هي صيغة المتكلم المفرد من الفعل *leren* أي تعلّم.'
  nl.a1.unit01.lesson05.teach.me_too:
    title: وأنا أيضًا
    gloss: وأنا أيضًا.
    note: '*Ik ook* طريقة قصيرة وطبيعية للتعبير عن أمر مشترك.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: اسأل إن كانت هذه أول مرة لشخص ما
    gloss: هل هذه أول مرة لك؟
    note: حديث ودّي عابر في نشاط يتكرر.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: قل إنها أول مرة لك
    gloss: نعم، هذه هي المرة الأولى لي.
    note: تعني *Mijn* «my» أي «ـي» للملكية (لي / خاصتي).
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: لوتي تبدأ الحديث
    gloss: 'لوتي: مرحبًا، أنا لوتي. ما اسمك؟'
    note: تستخدم لوتي الصيغة غير الرسمية *je* في هذا اللقاء الجماعي المريح.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: عمر يذكر اسمه
    gloss: 'عمر: اسمي عمر. تشرفت بمعرفتك.'
    note: يجيب عن سؤال الاسم ويعبّر عن سروره بالتعرف.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: لوتي تسأل عن بلده
    gloss: 'لوتي: وأنا كذلك! من أين أنت؟'
    note: '*Jou ook!* ردّ قصير طبيعي على *Leuk je te ontmoeten*.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: عمر يذكر بلده
    gloss: 'عمر: أنا من مصر. وأنتِ؟'
    note: '*En jij?* تعيد السؤال نفسه بصيغة غير رسمية.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: لوتي تواصل الحديث الودي
    gloss: 'لوتي: أنا من هولندا. هل هذه أول مرة لك في مقهى اللغات؟'
    note: تعني *Bij het taalcafé* «في مقهى اللغات» بوصفه نشاطًا.
  nl.a1.unit01.lesson06.teach.omar_language:
    title: عمر يجيب ويذكر ما يتعلمه
    gloss: 'عمر: نعم، هذه هي المرة الأولى لي. أتعلم الهولندية.'
    note: يجيب عن سؤال لوتي أولًا ثم يضيف معلومة أساسية عن نفسه.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: الوداع
    gloss: إلى اللقاء!
    note: '*Tot ziens* وداع محايد.'
  nl.a1.unit01.lesson06.teach.closing:
    title: خاتمة طبيعية
    gloss: 'لوتي: رائع! أراك الأسبوع القادم. عمر: أراك الأسبوع القادم!'
    note: تكرار *Tot volgende week* طبيعي حين يتوقع المتحدثان أن يلتقيا مجددًا.
exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: أي خيار يتضمن صيغتين غير رسميتين للمخاطب المفرد؟
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij وje صيغتان غير رسميتين للمفرد، أما u فرسمية.
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: اختر الضمير الرسمي لإكمال السؤال.
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier? صيغة مخاطبة رسمية.
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: استمع واختر الموقف الذي يناسب السؤال.
    correct_option: يُسأل شخص تجري مخاطبته رسميًا عمّا إذا كان جديدًا هنا.
    distractors:
    - يُسأل شخص من الأقران عمّا إذا كان جديدًا هنا.
    - يُسأل شخص تجري مخاطبته رسميًا عمّا إذا كان يسكن هنا.
    - يُسأل شخص تجري مخاطبته رسميًا عمّا إذا كان من هنا.
    accepted_answers:
    - value: يُسأل شخص تجري مخاطبته رسميًا عمّا إذا كان جديدًا هنا.
      status: correct
    feedback: Bent u nieuw hier? تستخدم u وbent للمخاطبة الرسمية.
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: طابق كل صيغة هولندية مع مستواها اللغوي.
    accepted_answers:
    - value:
      - left: jij / je
        right: informeel
      - left: u
        right: formeel of beleefd
      status: correct
    feedback: Jij/je غير رسمية، أما u فرسمية أو مهذبة.
    pairs:
    - left: jij / je
      right: informeel
    - left: u
      right: formeel of beleefd
  nl.a1.unit01.lesson01.exercise05.order_formal:
    instruction: 'رتّب الكلمات لتسأل بصيغة رسمية: «هل أنت جديد هنا؟»'
    accepted_answers:
    - value:
      - Bent
      - u
      - nieuw
      - hier
      status: correct
    feedback: السؤال الرسمي هو Bent u nieuw hier?
  nl.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: استمع ورتّب السؤال غير الرسمي.
    accepted_answers:
    - value:
      - Ben
      - jij
      - nieuw
      - hier
      status: correct
    feedback: التسجيل يقول Ben jij nieuw hier?
  nl.a1.unit01.lesson01.exercise07.complete_formal:
    instruction: أكمل السؤال الرسمي.
    accepted_answers:
    - value: Bent
      status: correct
    - value: bent
      status: correct
    feedback: 'استخدم bent مع u: Bent u nieuw hier?'
  nl.a1.unit01.lesson01.exercise08.listen_type_formal:
    instruction: استمع واكتب السؤال الهولندي كاملًا.
    accepted_answers:
    - value: Bent u nieuw hier?
      status: correct
    - value: Bent u nieuw hier
      status: correct
    - value: bent u nieuw hier?
      status: correct
    - value: bent u nieuw hier
