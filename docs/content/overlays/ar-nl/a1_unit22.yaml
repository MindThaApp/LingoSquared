teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: الاتصال
    gloss: يتصل
    note: صيغة المصدر للفعل الذي يُستخدم لإجراء مكالمة هاتفية.
    example_gloss: عليّ أن أتصل بك.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: قول إنك ستتصل
    gloss: سأتصل بك.
    note: '*Bel* هي صيغة ik من الفعل *bellen*؛ وتكتفي الهولندية هنا بالمضارع للتعبير عن «سأتصل بك»، بينما تضيف العربية السين أو سوف.'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: الرد على الهاتف
    gloss: مرحبًا، معك لوتي.
    note: تُستخدم *Met* + الاسم (حرفيًا «مع الاسم») في الهولندية للتعريف بنفسك على الهاتف، وهي قريبة من قولنا «معك فلان» في العربية.
  nl.a1.unit22.lesson01.teach.met_omar:
    title: عمر يردّ بالطريقة نفسها
    gloss: مرحبًا، معك عمر.
    note: 'النمط نفسه: *met* + الاسم، كما في *Hallo, met Lotte*.'
  nl.a1.unit22.lesson02.teach.met_wie:
    title: السؤال عن هوية المتصل
    gloss: مع من أتحدث؟
    note: '*Met wie spreek ik?* عبارة رسمية معتادة للسؤال عن هوية متصل لا تعرفه.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: التعريف بنفسك بصيغة رسمية
    gloss: تتحدث مع لوتي.
    note: '*U spreekt met* + الاسم هي الصيغة الرسمية المقابلة للصيغة غير الرسمية *met* + الاسم.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: طلب الإعادة
    gloss: هل يمكنك إعادة ذلك؟
    note: '*Kun je* ...؟ (هل تستطيع ...؟) + *herhalen* (يكرّر) + *dat* (ذلك).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: طلب التحدث ببطء
    gloss: لا تتكلم بهذه السرعة، من فضلك.
    note: '*Niet zo* + صفة تنفي درجة الصفة لا الفعل نفسه: أي «ليس بهذه السرعة»، وليس «لا تتكلم».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: قول إنك لا تسمع جيداً
    gloss: لا أسمعك جيداً.
    note: '*Horen* (يسمع) مع *niet goed* (ليس جيدًا) تعبّر عن مشكلة في السمع، وتختلف عن *verstaan* (يفهم ما يُقال).'
  nl.a1.unit22.lesson04.teach.sms:
    title: رسالة نصية
    gloss: الرسالة النصية
    note: 'اسم من الجنس المشترك: *de sms*، وهو مأخوذ مباشرة من الاختصار الدولي.'
    example_gloss: الرسالة النصية من لوتي.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: قول إنك سترسل رسالة
    gloss: سأرسل لك رسالة.
    note: يأخذ الفعل *Sturen* (يرسل) المفعول غير المباشر (*je*) قبل المفعول المباشر (*een sms*).
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: قول إنك ستعاود الاتصال
    gloss: سأتصل بك لاحقاً.
    note: تأتي *Terug* (رجوعًا) في آخر الجملة كجزء منفصل من الفعل؛ و*bellen* + *terug* تعني «يعاود الاتصال».
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: قراءة محادثة نصية
    gloss: 'عمر: مرحبًا لوتي، هل يمكنك أن تتصلي بي؟ عليّ أن أخبرك بشيء. لوتي: نعم بالطبع، سأعاود الاتصال بك بعد خمس دقائق.'
    note: تتبّع ما يطلبه عمر، وسبب طلبه، ومتى تقول لوتي إنها ستعاود الاتصال.
    glosses:
      Hoi: مرحباً
      kun: تستطيع
      bellen: الاتصال
      moet: يجب أن / عليّ
      iets: شيء ما
      vertellen: أخبر
      natuurlijk: بالطبع
      bel: الاتصال
      vijf: خمسة
      minuten: دقائق
      terug: أعيد
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: عمر يردّ على المكالمة
    gloss: 'عمر: مرحبًا، معك عمر.'
    note: 'نمط *met* + الاسم نفسه الذي مرّ سابقًا، يُستخدم الآن في مكالمة فعلية: الشخص الذي يردّ يتكلم أولًا ويذكر اسمه.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: لوتي تعرّف بنفسها
    gloss: 'لوتي: مرحبًا يا عمر، معك لوتي. عمر: جميل أنك اتصلتِ!'
    note: '*Fijn dat* ... (جميل أن ... / يسرّني أن ...) تعبّر عن ردّ فعل إيجابي تجاه حدث ما.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: لوتي تسأل عن نوبة العمل
    gloss: 'لوتي: كيف كانت نوبة عملك الأولى؟'
    note: '*Was* هي الماضي البسيط من *zijn*، وهي بنية مختلفة عن الماضي المركّب (hebben/zijn + اسم المفعول، مثل *Ik heb gewerkt*) الذي مرّ في الوحدة 12؛ انظر الملاحظة التي تلي السطر التالي مباشرة.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: عمر يزفّ خبرًا سارًا
    gloss: 'عمر: سار كل شيء على ما يرام، أفضل مما ظننت.'
    note: '*Ging* هي الماضي البسيط من *gaan* (يذهب، وتعني هنا «يسير الأمر»)؛ و*dacht* هي الماضي البسيط من *denken* (يظنّ / يفكّر).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was وging وdacht صيغ للماضي البسيط
    gloss: was → يكون، ging → يذهب، dacht → يفكّر
    note: '*Was* و*ging* و*dacht* صيغ شاذة للماضي البسيط (verleden tijd)، وهي نمط مختلف لم يُشرح رسميًا بعد عن الماضي المركّب في الوحدة 12 (hebben/zijn + اسم المفعول). في الوقت الحالي احفظ was/ging/dacht كعبارات ثابتة في السياقات التي ظهرت فيها في هذا الدرس؛ أما قواعد تصريف الماضي البسيط كاملةً فستأتي في مستوى لاحق.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: لوتي فخورة
    gloss: 'لوتي: كم يسعدني سماع ذلك! أنا فخورة بك.'
    note: '*Trots op* (فخور بـ) تركيب ثابت؛ تلزم *op* ولا تصحّ *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: عمر متأثر
    gloss: 'عمر: شكرًا لك، هذا يعني لي الكثير.'
    note: '*Betekent* هي صيغة الغائب المفرد من *betekenen* (يعني)؛ و*voor me* (بالنسبة لي) تبيّن لمن يهمّ الأمر.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: 'الملكية: su'
    gloss: سارت مناوبته الأولى بشكل جيد جداً.
    note: '*Zijn* هنا ضمير ملكية بمعنى «خاصّ به»، وليست الفعل «يكون»؛ والسياق هو ما يميّز بين الكلمتين المتطابقتين في الشكل.'
