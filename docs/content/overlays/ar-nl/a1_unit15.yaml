teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: التذكرة
    gloss: التذكرة
    note: '*Het kaartje* اسم محايد؛ استخدم *het* وليس *de*.'
    example_gloss: أودّ تذكرة إلى أوتريخت.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: طلب تذكرة
    gloss: أودّ تذكرة إلى أوتريخت.
    note: '*Wil graag* تلطّف الطلب، وهو النمط نفسه المستخدم لطلب الطعام في الوحدة 6.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: الموظف يسأل عن النوع
    gloss: هل تريد تذكرة ذهاب فقط أم ذهاب وعودة؟
    note: '*Wilt u* هي صيغة المخاطب الرسمية من *willen*، وتُستخدم هنا مع موظف محطة لا تعرفه.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: الإجابة بلباقة
    gloss: ذهاب وعودة، من فضلك.
    note: '*Alstublieft* هي «من فضلك» الرسمية، وتناسب مستوى *u* في هذا الحوار.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: مستوى الكلام عند الشباك
    gloss: عند الشباك تستخدم عادةً صيغة المخاطب المهذبة u.
    note: 'تتمة للتمييز بين *jij*/*je* و*u* الذي ورد في الوحدة 1: الغرباء في مواقع الخدمة يُخاطَبون عادةً بـ *u*.'
  nl.a1.unit15.lesson02.teach.perron:
    title: الرصيف
    gloss: الرصيف
    note: '*Het perron* اسم محايد؛ استخدم *het* وليس *de*.'
    example_gloss: من أي رصيف يغادر القطار المتجه إلى أوتريخت؟
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: السؤال عن الرصيف
    gloss: من أي رصيف يغادر القطار المتجه إلى أوتريخت؟
    note: '*Van welk perron* تسأل عن الرصيف تحديدًا، وتختلف عن السؤال عن مكان عام.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: ذكر تفاصيل المغادرة
    gloss: يغادر القطار في العاشرة إلا ربعًا من الرصيف الخامس.
    note: '*Kwart voor tien* تعيد نمط الساعة الذي ورد في الوحدة 4.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: السؤال عن وقت الوصول
    gloss: في أي ساعة يصل القطار؟
    note: '*Komt ... aan* فعل منفصل (*aankomen*)؛ تنتقل *aan* إلى نهاية السؤال.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: ذكر وقت الوصول
    gloss: يصل القطار في الساعة الحادية عشرة.
    note: '*Komt aan* تُظهر مرة أخرى جزأي الفعل المنفصل متباعدين في الجملة.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: في الوقت المحدد / التأخير
    gloss: في الوقت المحدد؛ التأخير
    note: '*Op tijd* تعبير ثابت يصف حدوث شيء في موعده. *De vertraging* (التأخير) اسم من الجنس المشترك.'
    example_gloss:
    - لا يغادر القطار في الوقت المحدد.
    - 'تنبيه: القطار المتجه إلى أوتريخت متأخر.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: إعلان
    gloss: 'تنبيه: القطار المتجه إلى أوتريخت متأخر.'
    note: '*Let op* (حرفيًا «انتبه») تفتتح إعلانًا في المحطة، مثل «انتباه أيها الركاب» في العربية.'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: نفي الالتزام بالوقت
    gloss: لا يغادر القطار في الوقت المحدد.
    note: تقع *Niet* مباشرة قبل *op tijd* لنفي التعبير كله.
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: تغيير الرصيف
    gloss: يغادر القطار من الرصيف الثالث بدلًا من الرصيف الخامس.
    note: '*In plaats van* تعني «بدلًا من».'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: ذكر مدة التأخير
    gloss: القطار متأخر عشر دقائق.
    note: '*Heeft vertraging* (حرفيًا «لديه تأخير») هي الطريقة الطبيعية للقول إن شيئًا ما متأخر، إلى جانب الصفة *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: المدخل والمخرج وقاعة الانتظار
    gloss: المدخل؛ المخرج؛ قاعة الانتظار
    note: '*De ingang* و*de uitgang* و*de wachtruimte* كلها أسماء من الجنس المشترك.'
    example_gloss:
    - أين المدخل؟
    - أين المخرج؟
    - أين قاعة الانتظار؟
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: السؤال عن مكان الرصيف
    gloss: أين الرصيف السابع؟
    note: يعيد هذا نمط *Waar is...?* من دروس الاتجاهات في الوحدة 9.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: إعطاء الاتجاهات
    gloss: استمر مباشرة ثم انعطف يمينًا.
    note: '*Rechtdoor* و*rechts* هما كلمتا الاتجاه نفسهما اللتان وردتا في الوحدة 9، وتُستخدمان هنا في سياق المحطة.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: السؤال عن قاعة الانتظار
    gloss: أين قاعة الانتظار؟
    note: نمط السؤال نفسه مطبّق على مكان جديد.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: قراءة تذكرة مطبوعة
    gloss: 'التذكرة: من أمستردام سنترال إلى أوتريخت سنترال. المغادرة: العاشرة وعشر دقائق، الرصيف سبعة. الوصول: الحادية عشرة إلا عشر دقائق. ذهاب وعودة. السعر: اثنا عشر يورو وأربعون سنتًا.'
    note: انتبه إلى وقت المغادرة والرصيف، ووقت الوصول، ونوع التذكرة، والسعر.
    glosses:
      Kaartje: تذكرة
      Vertrek: مغادرة
      tien: عشرة
      perron: رصيف
      zeven: سبع
      Aankomst: وصول
      elf: إحدى عشرة
      Retour: تذكرة ذهاب وإياب
      Prijs: سعر
      twaalf: اثنا عشر
      euro: يورو
      veertig: أربعون
  nl.a1.unit15.lesson06.teach.omar_open:
    title: عمر يعرض الخطة
    gloss: 'عمر: علينا الذهاب إلى الرصيف سبعة. القطار يغادر في العاشرة وعشر دقائق.'
    note: '*Moeten* (يجب/يلزم) تعبّر هنا عن حاجة عملية، لا عن إلزام صارم.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: لوتّه تقرأ اللافتة
    gloss: 'لوتّه: انظر، هناك اللوحة: تأخير، عشر دقائق.'
    note: '*Daar staat* (حرفيًا «هناك يقف») هي الطريقة الطبيعية للقول إن لافتة تعرض شيئًا.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: عمر يحافظ على هدوئه
    gloss: 'عمر: لا مشكلة، ما زال لدينا وقت لقهوة.'
    note: '*Geen probleem* عبارة طمأنة شائعة وغير رسمية.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: يصل القطار
    gloss: 'لوتّه: فكرة جيدة. آه، ها هو القطار قد وصل. الرصيف سبعة، بالضبط!'
    note: '*Al* (بالفعل) تدل على أن القطار وصل أبكر من المتوقع، بعد التأخير المعلن للتو.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: يصعدون إلى القطار
    gloss: 'عمر: هيا، لنصعد. أوتريخت، ها نحن قادمون!'
    note: '*Stappen in* (يصعد إلى) فعل منفصل؛ تنتقل *in* إلى نهاية الجملة. و*We komen eraan* (حرفيًا «نحن نأتي إليه») هي الطريقة الهولندية الطبيعية للقول «ها نحن قادمون»، والترجمة الحرفية كلمة بكلمة ستبدو غريبة.'
