teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: الشعور بالتوعك
    gloss: لا أشعر أنني بخير.
    note: الفعل *Voelen* انعكاسي هنا (*je*/*me voelen*)؛ و*niet lekker* طريقة عامة ولطيفة للقول إن شيئًا ما ليس على ما يرام.
  nl.a1.unit16.lesson01.teach.ziek:
    title: مريض
    gloss: مريض
    note: الصفة الأساسية، وتُستعمل مع *zijn* (يكون).
    example_gloss: أنا مريض.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: أن تكون مريضًا
    gloss: أنا مريض.
    note: '*Ziek* تصف حالة أعمّ وأقوى من *niet lekker*.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: صداع
    gloss: صداع
    note: 'تُستعمل دون أداة تعريف أو تنكير بعد *hebben*: *Ik heb hoofdpijn* وليس *Ik heb een hoofdpijn*.'
    example_gloss: أعاني من صداع.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: الإصابة بصداع
    gloss: أعاني من صداع.
    note: تقترن الأعراض عادةً في الهولندية بالفعل *hebben* (يملك).
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: وجع المعدة
    gloss: وجع في المعدة
    note: النمط نفسه دون أداة، كما في *hoofdpijn*.
    example_gloss: أعاني من وجع في المعدة.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: الإصابة بوجع في المعدة
    gloss: أعاني من وجع في المعدة.
    note: يتبع نمط *hebben* نفسه كما في *hoofdpijn*.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: سؤال عام
    gloss: ما الأمر؟
    note: طريقة عامة تصلح لسؤال الشخص إن كان هناك مشكلة.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: تعبير شائع
    gloss: ما بك؟
    note: '*Scheelt eraan* تعبير ثابت (يقارب حرفيًا «ما الناقص فيه»)؛ فلا تترجمه كلمة بكلمة.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: التهاب الحلق
    gloss: التهاب في الحلق
    note: النمط نفسه دون أداة، كما في *hoofdpijn* و*buikpijn*.
    example_gloss: أعاني من التهاب في الحلق.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: الإصابة بالتهاب الحلق
    gloss: أعاني من التهاب في الحلق.
    note: يتبع نمط *hebben* نفسه كما في الأعراض الأخرى.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: الاطمئنان على شخص
    gloss: هل أنت بخير؟ لا، لا أشعر أنني بخير.
    note: '*Gaat het?* سؤال شائع وغير رسمي للاطمئنان بين الأصدقاء.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: الحمّى
    gloss: حمّى
    note: تُستعمل دون أداة بعد *hebben*، مثل الأعراض الأخرى.
    example_gloss: عندي حمّى.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: الإصابة بالحمّى
    gloss: عندي حمّى.
    note: يتبع نمط *hebben*.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: الإصابة بنزلة برد
    gloss: مصاب بنزلة برد
    note: صفة تُستعمل مع *zijn*، وليست اسمًا يُستعمل مع *hebben*؛ وهذا مصدر ارتباك شائع.
    example_gloss: أنا مصاب بنزلة برد.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: قول إنك مصاب بنزلة برد
    gloss: أنا مصاب بنزلة برد.
    note: تستعمل الهولندية *zijn* + *verkouden*؛ فلا تقل *Ik heb een verkouden*.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: الاختيار بين zijn و hebben يتوقف على نوع الكلمة، لا على مدة الحالة
    gloss: 'Ziek و verkouden صفتان وتُستعملان مع zijn: أنا مريض، أنا مصاب بنزلة برد. أما koorts و hoofdpijn فاسمان وتُستعملان مع hebben.'
    note: الاختيار بين *zijn* و*hebben* يتبع نوع الكلمة نحويًا (صفة أم اسم عَرَض)، لا مدى مؤقتية الحالة؛ فكلمة *koorts* (اسم) مؤقتة مثل *verkouden* (صفة)، ومع ذلك تأخذ *hebben* لا *zijn*.
  nl.a1.unit16.lesson04.teach.apotheek:
    title: الصيدلية
    gloss: الصيدلية
    note: 'اسم من الجنس العام: *de apotheek*.'
    example_gloss: أنا ذاهب إلى الصيدلية.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: تحية الصيدلاني
    gloss: كيف أستطيع مساعدتك؟
    note: '*Waarmee kan ik u helpen?* تحية خدمة رسمية معتادة، وتواصل استعمال صيغة *u* من درسَي الأسلوب في الوحدة 1 والوحدة 15.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: طلب شيء لعَرَض معين
    gloss: هل لديك شيء لعلاج الصداع؟
    note: '*Iets tegen* + اسم العَرَض هي الطريقة الطبيعية لطلب دواء.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: قرص
    gloss: قرص دواء
    note: 'اسم محايد: *het tablet*، مع أنه يُستعمل هنا نكرةً: *een tablet*.'
    example_gloss: أتناول قرصًا.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: تعليمات الجرعة
    gloss: تناول قرصًا مرتين في اليوم.
    note: '*Neem* هو فعل الأمر من *nemen* (يأخذ)، ويُستعمل في التعليمات.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: أسلوب الكلام في الصيدلية
    gloss: في الصيدلية تستعمل صيغة المخاطب المهذبة u.
    note: الصيدلاني شخص بالغ لا تعرفه ويؤدي عملًا خدميًا، وهي قاعدة الأسلوب نفسها عند شباك التذاكر في الوحدة 15.
  nl.a1.unit16.lesson05.teach.advies:
    title: اقرأ نصيحة في صيدلية
    gloss: 'نصيحة: تناول حبة مرتين في اليوم مع الماء. ارتح جيدًا واشرب كثيرًا من الماء. هل ما زلت لا تشعر بتحسن بعد ثلاثة أيام؟ إذن اذهب إلى الطبيب.'
    note: انتبه إلى الجرعة، والنصيحتين الأخريين غير الدواء، ومتى تذهب إلى الطبيب.
    glosses:
      Advies: نصيحة
      neem: تناول
      keer: مرات
      dag: يوم
      tablet: حبة دواء
      Rust: ارتح
      drink: اشرب
      Voel: تشعر
      steeds: ما زال
      lekker: جيدًا
      huisarts: طبيب
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte تطمئن على Omar
    gloss: 'Lotte: مرحبًا Omar، كيف حالك؟ هل تشعر بتحسن بعد؟'
    note: '*Al* (بعد/بالفعل) تدل على أن Lotte تسأل هل تحسّن Omar منذ آخر مرة تحدثا فيها.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar ما زال متعبًا
    gloss: 'Omar: ليس جيدًا بعد. ما زال عندي صداع وأنا متعب.'
    note: '*Nog steeds* (ما زال) تدل على أن الصداع السابق لم يزُل؛ و*moe* (متعب) صفة جديدة ومفيدة.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte تسأل عن الدواء
    gloss: 'Lotte: هل تناولت قرصًا؟'
    note: '*Genomen* هو اسم المفعول من *nemen*، ويتبع نمط *heb* + اسم المفعول نفسه الذي ورد في الوحدة 12.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar يؤكد
    gloss: 'Omar: نعم، تناولت قرصًا. سأذهب لأرتاح الآن.'
    note: '*Ga nu rusten* (سأرتاح الآن) تستعمل نمط المستقبل القريب *gaan* + المصدر.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte تتمنى له الشفاء
    gloss: 'Lotte: فكرة جيدة. ارتح جيدًا. سلامتك!'
    note: '*Beterschap!* هي العبارة الثابتة المعتادة لتمني الشفاء العاجل لأحدهم.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar يودّع
    gloss: 'Omar: شكرًا لك، إلى الغد!'
    note: '*Tot morgen!* تعيد استعمال نمط *tot* + الزمن الوارد في عبارات الوداع بالوحدات السابقة.'
