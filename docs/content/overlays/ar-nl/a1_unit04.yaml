  nl.a1.unit04.lesson01.teach.hour:
    title: الساعة
    gloss: الساعة
    note: 'تأتي *uur* بعد العدد للساعة الكاملة بالضبط: *twee uur* تعني الساعة الثانية تمامًا.'
    example_gloss: الساعة الثانية تمامًا.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: الساعة الثانية
    gloss: 2:00 — الساعة الثانية تمامًا
    note: للساعة الكاملة قل العدد ثم *uur*.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: الساعة الثالثة
    gloss: 3:00 — الساعة الثالثة تمامًا
    note: '*Drie uur* تعني 3:00 بالضبط.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: في منتصف الطريق نحو الثالثة
    gloss: 2:30 — الثانية والنصف
    note: 'فرق مهم: تدل *half drie* في الهولندية على الساعة القادمة. الوقت هو 2:30 وليس 3:30.'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: كلمة half تشير إلى الساعة التالية
    gloss: نصف الثالثة = منتصف الطريق نحو الساعة الثالثة = 2:30
    note: اقرأ *half* + الساعة على أنها منتصف الطريق نحو تلك الساعة. لذلك تعني *half vier* الساعة 3:30.
  nl.a1.unit04.lesson01.teach.half_four:
    title: في منتصف الطريق نحو الرابعة
    gloss: 3:30 — الثالثة والنصف
    note: '*Half vier* هي منتصف الطريق نحو الرابعة، لذلك تعني 3:30.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: قول نصف ساعة
    gloss: الساعة الآن الثانية والنصف.
    note: '*Het is ...* هي الصيغة المعتادة لذكر الوقت الحالي.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: ربع الساعة
    gloss: ربع الساعة
    note: تُستعمل *kwart* في تعبيرين ثابتين للساعة هما *kwart over* و*kwart voor*.
    example_gloss: ربع الساعة خمس عشرة دقيقة.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: الثانية والربع
    gloss: 2:15 — الثانية والربع
    note: '*Kwart over twee* تعني بعد الثانية بخمس عشرة دقيقة.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: معنى over هو «بعد»
    gloss: over = بعد الساعة الكاملة
    note: في تعبيرات الساعة، تعدّ *over* إلى الأمام من الساعة التي مضت للتو.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: الثالثة إلا ربعًا
    gloss: 2:45 — الثالثة إلا ربعًا
    note: '*Kwart voor drie* تعني قبل الثالثة بخمس عشرة دقيقة، أي 2:45.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: معنى voor هو «إلا» أو «قبل»
    gloss: voor = قبل الساعة الكاملة التالية
    note: في تعبيرات الساعة، تشير *voor* إلى الساعة التالية.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: الثالثة والربع
    gloss: 3:15 — الثالثة والربع
    note: 'تحتفظ *over* بالساعة التي مضت للتو: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: الرابعة إلا ربعًا
    gloss: 3:45 — الرابعة إلا ربعًا
    note: 'تذكر *voor* الساعة المقبلة: *kwart voor vier* تعني 3:45.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: السؤال عن الوقت
    gloss: كم الساعة؟
    note: '*Hoe laat is het?* هو السؤال اليومي المعتاد عن الوقت الحالي.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: قل الوقت
    gloss: الساعة الثانية والنصف.
    note: تذكّر أن كلمة الساعة الهولندية *drie* هنا تجعل الوقت 2:30، أي أن النصف يُحسب نحو الساعة التالية، بخلاف العربية التي تقول «الثانية والنصف».
  nl.a1.unit04.lesson03.teach.ask_start:
    title: اسأل متى يبدأ نشاط ما
    gloss: متى يبدأ مقهى اللغة؟
    note: تبدأ *Hoe laat* السؤال الذي يطلب وقتًا على الساعة.
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: في الثانية والربع
    gloss: في الثانية والربع.
    note: استخدم *om* قبل الوقت عند الحديث عن موعد حدوث شيء.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: استخدام om لموعد حدث
    gloss: 'في + الوقت: في الساعة الثانية، في الثانية والنصف'
    note: لا تستخدم *om* عند ذكر الوقت الحالي فقط بعبارة *Het is*.
  nl.a1.unit04.lesson03.teach.late:
    title: اسأل إن كنت متأخرًا
    gloss: هل أنا متأخر؟
    note: تعني *Laat* هنا «متأخر»، والعبارة طبيعية في أي حوار عن المواعيد.
  nl.a1.unit04.lesson03.teach.on_time:
    title: قل إن أحدًا وصل في الوقت المناسب
    gloss: لا، أنت في الوقت المناسب.
    note: تعني *Op tijd* «في الوقت المناسب». وتُبقي *Je* الحوار غير رسمي.
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: الرابعة عشرة
    gloss: 14:00 — الساعة الرابعة عشرة
    note: تستخدم الجداول والإعلانات نظام الأربع والعشرين ساعة عادةً. *Veertien uur* قراءة منطوقة واضحة للساعة 14:00.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: الثامنة عشرة
    gloss: 18:00 — الساعة الثامنة عشرة
    note: '*Achttien uur* هي صيغة نظام الأربع والعشرين ساعة للسادسة مساءً.'
  nl.a1.unit04.lesson04.teach.morning:
    title: السابعة صباحًا
    gloss: 7:00 — السابعة صباحًا
    note: تعني *'s Ochtends* «في الصباح». و*'s* في البداية جزء من التعبير الثابت.
  nl.a1.unit04.lesson04.teach.afternoon:
    title: الثانية بعد الظهر
    gloss: 14:00 — الثانية بعد الظهر
    note: تشمل *'s Middags* فترة ما بعد الظهر التي تبدأ نحو الظهيرة؛ وبها يُميَّز 14:00 عن 02:00 في نظام الاثنتي عشرة ساعة.
  nl.a1.unit04.lesson04.teach.evening:
    title: الثامنة مساءً
    gloss: 20:00 — الثامنة مساءً
    note: تُستخدم *'s Avonds* لوقت المساء، أي تقريبًا من أواخر ما بعد الظهر حتى منتصف الليل.
  nl.a1.unit04.lesson04.teach.night:
    title: الثانية ليلًا
    gloss: 2:00 — الثانية ليلًا
    note: تُستخدم *'s Nachts* لساعات الليل؛ والساعة 02:00 هي بطبيعة الحال *twee uur 's nachts*.
  nl.a1.unit04.lesson04.teach.day_parts:
    title: أجزاء اليوم
    gloss: الصباح · بعد الظهر · المساء · الليل
    note: 'حدود هذه الفترات في الهولندية تقريبية: يمتد *ochtend* حتى نحو الظهر، ويبدأ *middag* من الظهر حتى العصر، ويستمر *avond* خلال المساء، ويشمل *nacht* ساعات الليل.'
    example_gloss:
    - أشرب القهوة في الصباح.
    - مقهى اللغة بعد الظهر.
    - أقرأ في المساء.
    - أنام في الليل.
  nl.a1.unit04.lesson05.teach.schedule:
