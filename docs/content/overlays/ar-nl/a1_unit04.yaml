    gloss: 'مقهى اللغة مفتوح: 14:00–16:00'
    note: تستخدم الجداول الهولندية غالبًا نقطة بين الساعات والدقائق؛ فالوقت 14.00 هو نفسه 14:00.
  nl.a1.unit04.lesson05.teach.welcome:
    title: وقت الترحيب
    gloss: 14:15 ترحيب
    note: 'يمكن قول 14.15 في الكلام اليومي بنظام الاثنتي عشرة ساعة: *kwart over twee*.'
  nl.a1.unit04.lesson05.teach.workshop:
    title: وقت ورشة العمل
    gloss: 14:45 ورشة عمل
    note: '14.45 هي *kwart voor drie*: الربع الذي يسبق الثالثة.'
  nl.a1.unit04.lesson05.teach.break:
    title: وقت الاستراحة
    gloss: 15:30 استراحة
    note: 15.30 هي *half vier*، أي في منتصف الطريق نحو الرابعة، وليست الرابعة والنصف.
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: اسأل عن وقت في الجدول
    gloss: في أي ساعة تبدأ الورشة؟
    note: تسأل *Begint* عن موعد بدء النشاط.
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: اذكر وقت ورشة العمل
    gloss: في الثالثة إلا ربعًا.
    note: الوقت 14.45 في الجدول يقابل *kwart voor drie*.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: تأكيد وقت مقهى اللغة
    gloss: 'لوتّه: متى يبدأ مقهى اللغة يوم الجمعة؟ عمر: في الثانية والربع، أي في 14:15.'
    note: 'يذكر عمر الصيغتين صراحةً: *kwart over twee* و14.15 تدلان على الوقت نفسه، وهو وقت الترحيب في الجدول.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: اسأل عن ورشة العمل
    gloss: 'لوتّه: ومتى تبدأ ورشة العمل؟ عمر: في الثالثة إلا ربعًا.'
    note: '*Kwart voor drie* هي 14:45، كما في الجدول.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: اذكر وقت الوصول
    gloss: 'لوتّه: جيد. إذن سأكون هناك في الساعة الثانية.'
    note: تنوي لوتّه الوصول في 14:00، أي قبل بدء الفعالية في 14:15 بخمس عشرة دقيقة.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: إنهاء الاتفاق
    gloss: 'عمر: ممتاز، أراك بعد ظهر الجمعة!'
    note: '*Vrijdagmiddag* كلمة مركبة طبيعية تعني «بعد ظهر الجمعة».'
