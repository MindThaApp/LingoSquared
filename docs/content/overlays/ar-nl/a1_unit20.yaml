teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: معطف، سترة صوفية
    gloss: المعطف، السترة الصوفية
    note: كلتا الكلمتين *de jas* و*de trui* اسمان من الجنس المشترك.
    example_gloss:
    - أبحث عن معطف.
    - عندي سترة صوفية.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: سروال، أحذية
    gloss: السروال، الأحذية
    note: 'كلمة *broek* مفرد في الهولندية، كما في العربية: نقول *een broek* وليس *broeken* للدلالة على قطعة واحدة. أما *schoenen* فهي جمع *schoen*، وغالبًا ما نتحدث عن الأحذية بصيغة الجمع.'
    example_gloss:
    - أنا أبحث عن بنطال.
    - أبحث عن أحذية.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: قول ما تبحث عنه
    gloss: أبحث عن معطف.
    note: يأخذ الفعل *zoeken* (بحث عن) مفعولًا به مباشرًا دون حرف جر هنا، بخلاف العربية التي نقول فيها «بحث عن». (توجد أيضًا صيغة *zoeken naar*، لكن المفعول المباشر هو أبسط نمط.)
  nl.a1.unit20.lesson02.teach.maat:
    title: المقاس
    gloss: المقاس
    note: 'اسم من الجنس المشترك: *de maat*.'
    example_gloss: ما مقاسك؟
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: السؤال عن المقاس
    gloss: ما مقاسك؟
    note: تُستخدم *Welke* (أي) لأن لكلمة *maat* مجموعة صغيرة من الإجابات المتوقعة (S أو M أو L أو رقم).
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: ذكر مقاسك
    gloss: مقاسي M.
    note: يُستخدم الفعل *hebben* (يملك) هنا لذكر المقاس، بينما نقول في العربية ببساطة «مقاسي M».
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: أسود، أزرق
    gloss: أسود، أزرق
    note: صفتا اللون الأساسيتان في هذا الدرس.
    example_gloss:
    - أريد المعطف باللون الأسود.
    - هل لديكم هذا أيضًا باللون الأزرق؟
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: طلب لون معيّن
    gloss: أريد المعطف باللون الأسود.
    note: '*In het* + اللون هي الطريقة المعتادة لتحديد لون قطعة الملابس عند طلبها.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: السؤال عن لون آخر
    gloss: هل لديكم هذا أيضًا باللون الأزرق؟
    note: تسأل *Ook* (أيضًا) عن توفّر لون بديل، وذلك بصيغة الاحترام *u*.
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: السؤال عن مناسبة المقاس
    gloss: هل يناسبك هذا المعطف؟
    note: '*Passen* (يناسب) هو الفعل الطبيعي للحديث عن ملاءمة الملابس للجسم، ويختلف عن *passen* بمعنى «يجرّب ارتداء».'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: تأكيد أن المقاس مناسب
    gloss: يناسبني تمامًا.
    note: '*Goed* (جيدًا) تصف مدى ملاءمة القطعة.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: صغير جدًا
    gloss: إنه صغير جدًا.
    note: تأتي *Te* (أكثر من اللازم) قبل الصفة للتعبير عن الزيادة.
  nl.a1.unit20.lesson04.teach.te_groot:
    title: كبير جدًا
    gloss: إنه كبير جدًا.
    note: 'النمط نفسه: *te* + صفة، كما في بطاقة *te klein* السابقة.'
  nl.a1.unit20.lesson05.teach.negentig:
    title: تسعون
    gloss: تسعون
    note: '*Negentig* هو العدد 90، ويُستخدم هنا في سعر المعطف.'
    example_gloss: يكلّف المعطف تسعين يورو.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: ذكر السعر
    gloss: يكلّف المعطف تسعين يورو.
    note: '*Kost* هي صيغة الغائب المفرد من *kosten* (يكلّف).'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: اقرأ إيصال متجر
    gloss: 'معطف شتوي: المقاس M، اللون أسود. السعر: تسعون يورو. هذا المعطف يناسبني وهو دافئ.'
    note: تتبّع المقاس واللون والسعر والصفتين المذكورتين عن المعطف.
    glosses:
      Winterjas: معطف شتوي
      maat: المقاس
      kleur: لون
      zwart: أسود
      Prijs: سعر
      negentig: تسعون
      euro: يورو
      jas: معطف
      past: يناسب
      warm: دافئ
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: لوتي تلاحظ المعطف
    gloss: 'لوتي: هذا المعطف جميل! ما مقاسك؟'
    note: '*Mooi* (جميل) ردّ فعل إيجابي عام، وقد ورد في وحدات سابقة.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: عمر يطلب تجربته
    gloss: 'عمر: مقاسي M. هل يمكنني تجربته؟'
    note: '*Mag ik ...?* (هل يمكنني ...؟) هي الطريقة المهذّبة المعتادة لطلب الإذن؛ وتعني *passen* هنا «يجرّب» وليس «يناسب».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: لوتي تسأل عن الملاءمة
    gloss: 'لوتي: بالطبع. هل يناسبك جيدًا؟'
    note: '*Hij* (هو) يعود إلى *de jas*، وهو اسم من الجنس المشترك.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: عمر يؤكد
    gloss: 'عمر: نعم، يناسبني جيدًا وهو دافئ.'
    note: يطابق تمامًا الإيصال الذي قرأته سابقًا، فهذا هو المعطف نفسه.
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: لوتي تسأل عن اللون
    gloss: 'لوتي: رائع! هل تريده باللون الأسود أم الأزرق؟'
    note: يعيد *Wil je... of...?* نمط عرض الخيارات الذي ورد في دروس التفضيلات في الوحدة 13.
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: عمر يقرّر
    gloss: 'عمر: سآخذه باللون الأسود.'
    note: '*Nemen* (يأخذ) هو الفعل الطبيعي لحسم خيار الشراء، بما يطابق اللون المذكور في الإيصال.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem مقابل neemt
    gloss: Neem هي صيغة المتكلم (ik) من nemen (يأخذ)، وneemt هي صيغة الغائب (hij أو zij).
    note: 'نمط المضارع المنتظم: *ik neem, jij/hij/zij neemt*.'
