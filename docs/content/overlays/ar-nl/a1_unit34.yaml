    gloss: 'أنت تعرف *Tot ziens!* بالفعل. ويمكنك أيضًا ذكر اسم يوم: *Tot zaterdag!*، *Tot morgen!*'
    note: توسّع نمط التوديع من وحدة التحيات ليشمل يومًا محددًا.
  nl.a1.unit34.lesson05.teach.tekst:
    title: من يستخدم ماذا؟
    gloss: تتصل لوتي بعمر كل يوم. هي تستخدم هاتفها، لا تطبيقًا. ليس لدى عمر حاسوب في المنزل، لكنه يستخدم الإنترنت على هاتفه. يبحث ساندر كل صباح عن النشرة الجوية. ثم يذهب للجري. كثيرًا ما ترسل فينا رسالة إلى لوتي. هل تستخدم أنت أيضًا هاتفك كل يوم؟
    note: تقارن عادات الشخصيات الأربع في استخدام الأجهزة، على غرار قراءة المقارنة في وحدة الرياضة.
