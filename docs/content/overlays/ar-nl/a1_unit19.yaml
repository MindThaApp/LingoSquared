teaching:
  nl.a1.unit19.lesson01.teach.weer:
    title: الطقس
    gloss: الطقس
    note: 'اسم يأخذ أداة التعريف het: *het weer*.'
    example_gloss: كيف حال الطقس؟
  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: السؤال عن الطقس
    gloss: كيف حال الطقس؟
    note: تسأل *Wat voor* + اسم عن «أي نوع من»؛ وهو سؤال عام شائع جدًا.
  nl.a1.unit19.lesson01.teach.zonnig:
    title: مشمس
    gloss: الطقس مشمس.
    note: النمط المعتاد هو *Het is* + صفة الطقس، مع الضمير غير الشخصي *het* (أي «هو» الذي لا يعود على شيء).
  nl.a1.unit19.lesson01.teach.regent:
    title: تمطر
    gloss: إنها تمطر.
    note: 'يُستخدم الفعل *regenen* (أمطر) بلا فاعل محدد: *het regent*، ولا حاجة إلى صفة منفصلة.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: غائم
    gloss: الطقس غائم.
    note: يتبع النمط نفسه *het is* + صفة، كما في *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: بارد
    gloss: الطقس بارد اليوم.
    note: تضع كلمة *Vandaag* (اليوم) وصف الطقس في إطار زمني.
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: الطقس دافئ اليوم.
    note: تُستخدم *Warm* في الحديث اليومي عن الطقس بمعنى «دافئ» و«حار» معًا.
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: مقابلة بين درجات الحرارة
    gloss: الطقس ليس باردًا، بل دافئ.
    note: تنفي *Niet* الصفة *koud* مباشرة، وتأتي قبلها.
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: النشرة الجوية
    gloss: النشرة الجوية
    note: 'اسم يأخذ أداة التعريف het: *het weerbericht*، وهو مركّب من *weer* (طقس) و*bericht* (نشرة، تقرير).'
    example_gloss: ما هي النشرة الجوية؟
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: طقس الغد
    gloss: غدًا الطقس مشمس.
    note: تنتقل *Morgen* (غدًا) إلى بداية الجملة، فينقلب ترتيب *is het* بعدها.
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: نشرة جوية ليومين
    gloss: يوم السبت الطقس مشمس ودافئ، لكن يوم الأحد تمطر السماء طوال اليوم.
    note: تؤكد عبارة *De hele dag* (طوال اليوم) أن المطر يستمر مدة طويلة.
  nl.a1.unit19.lesson04.teach.wandeling:
    title: النزهة
    gloss: النزهة
    note: 'اسم يأخذ أداة التعريف de: *de wandeling*.'
    example_gloss: هل نذهب في نزهة؟
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: اقتراح نزهة
    gloss: هل نذهب في نزهة؟
    note: تكرر *Zullen we...?* نمط اقتراح الخطط من الوحدة 11؛ أما *een wandeling maken* (حرفيًا «صنع نزهة») فهي التعبير الثابت للقول «الذهاب في نزهة مشيًا».
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: خطة مشروطة
    gloss: إذا أمطرت السماء، نبقى في الداخل.
    note: تُدخل *Als* (إذا) الشرط؛ وفي الجملة الرئيسية *blijven we binnen* ينقلب ترتيب الفاعل والفعل لأن جملة الشرط جاءت أولًا.
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: الموافقة والاقتراح
    gloss: فكرة جيدة! لنذهب في نزهة.
    note: '*Laten we...* (لنفعل...) طريقة شائعة أخرى لاقتراح نشاط، إلى جانب *Zullen we...?* من الوحدة 11.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: قراءة نشرة جوية ليومين
    gloss: 'النشرة الجوية: يوم السبت الطقس مشمس ودافئ. يوم الأحد تمطر السماء طوال اليوم.'
    note: تتبّع حالة الطقس في كل يوم.
    glosses:
      Weerbericht: نشرة جوية
      zaterdag: السبت
      zonnig: مشمس
      warm: دافئ
      Zondag: الأحد
      regent: تمطر
      hele: كامل
      dag: يوم
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: لوتي تسأل عن عطلة نهاية الأسبوع
    gloss: 'لوتي: كيف سيكون الطقس في نهاية هذا الأسبوع؟'
    note: تضع عبارة *Dit weekend* (نهاية هذا الأسبوع) السؤال في المستقبل القريب.
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: عمر يخبرها بتوقعات الطقس
    gloss: 'عمر: يوم السبت الطقس مشمس ودافئ، لكن يوم الأحد تمطر طوال اليوم.'
    note: هذه هي الجملة نفسها التي وردت في النشرة الجوية التي قرأتها.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: لوتي تقترح خطة
    gloss: 'لوتي: إذًا، هل نذهب في نزهة مشيًا يوم السبت؟'
    note: تربط *Dan* (إذًا) الاقتراح مباشرة بالطقس الجميل الذي وصفه عمر للتو.
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: عمر يوافق ويخطط ليوم الأحد
    gloss: 'عمر: فكرة جيدة. ويوم الأحد سنبقى في البيت براحة.'
    note: كلمة *Lekker* هنا كلمة تعبيرية تفيد معنى «بكل راحة ولطف»، وتُستخدم كثيرًا قبل صفة أو فعل لجعله أكثر جاذبية.
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: لوتي تحسم الخطة
    gloss: 'لوتي: رائع، إذًا سنشاهد فيلمًا.'
    note: يرتبط الفعل *Kijken* (يشاهد) بشكل طبيعي مع *een film* (فيلم).
