teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: الشقة وغرفة الجلوس وغرفة النوم
    gloss: الشقة، غرفة الجلوس، غرفة النوم
    note: كلمة *Het appartement* تأخذ أداة التعريف het، أما *de woonkamer* و*de slaapkamer* فتأخذان de.
    example_gloss:
    - لديّ شقة.
    - لديّ غرفة جلوس.
    - لديّ غرفة نوم.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: المطبخ والحمّام
    gloss: المطبخ، الحمّام
    note: كلمتا *De keuken* و*De badkamer* تأخذان أداة التعريف de.
    example_gloss:
    - لديّ مطبخ.
    - لديّ حمّام.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: قول إنّ لديك شقة
    gloss: لديّ شقة.
    note: الفعل *Hebben* (يملك) هو الفعل الطبيعي للحديث عن المسكن الذي لديك، مثل «لديّ شقة». هذا مثال عام؛ أما شقة Omar الخاصة في Utrecht فتُقدَّم لاحقًا في هذه الوحدة.
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: سرد جميع الغرف
    gloss: لديّ صالون وغرفة نوم ومطبخ وحمّام.
    note: تضم الجملة الغرف الأربع من مفردات هذا الدرس، مفصولة بفواصل وقبل الأخيرة الكلمة *en*.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: السؤال عن عدد الغرف
    gloss: كم غرفة لديك؟
    note: تُستخدم *Hoeveel* (كم) في سؤال الكمية كما في دروس الأعداد السابقة.
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: ذكر عدد غرف النوم
    gloss: لديّ غرفتا نوم.
    note: '*Slaapkamers* هي جمع *slaapkamer*، ويُصاغ بانتظام بإضافة -s.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: ذكر العدد الإجمالي للغرف
    gloss: تضمّ الشقة ثلاث غرف.
    note: '*Kamers* كلمة عامة تعني «غرف»، ولا تقتصر على غرف النوم.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: شرفة، حديقة
    gloss: الشرفة، الحديقة
    note: كلمة *Het balkon* تأخذ أداة التعريف het، أما *de tuin* فتأخذ de.
    example_gloss:
    - توجد شرفة.
    - لا توجد حديقة.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: قول إنّ شيئًا موجود
    gloss: توجد شرفة.
    note: '*Er is* هي البنية الهولندية المعتادة للدلالة على الوجود، وتقابل «يوجد» في العربية.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: قول إنّ شيئًا غير موجود
    gloss: لا توجد حديقة.
    note: تنفي *Geen* الاسم النكرة -- نقول *geen tuin* وليس *niet een tuin*.
  nl.a1.unit18.lesson04.teach.gezellig:
    title: مريح ودافئ
    gloss: مريح ودافئ
    note: صفة هولندية شائعة جدًا ومميزة، تصف جوًّا دافئًا ومريحًا، ولا يقابلها في العربية لفظ واحد يؤدي المعنى تمامًا.
    example_gloss: الشقة صغيرة لكنها مريحة ودافئة.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: نمط شائع في الوصف
    gloss: الشقة صغيرة لكنها مريحة ودافئة.
    note: عبارة *Klein maar gezellig* طريقة شائعة جدًا وطبيعية يصف بها الهولنديون مسكنًا صغيرًا وصفًا إيجابيًا.
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: وصف حجم الغرفة
    gloss: الصالون كبير.
    note: تصف *Groot* هنا غرفة بعينها، لا المسكن كله.
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: وصف حجم غرفة أخرى
    gloss: المطبخ صغير.
    note: النمط نفسه كما في بطاقة *groot* السابقة، لكن مع غرفة أخرى وكلمة *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: قراءة إعلان عن سكن
    gloss: 'شقة في Utrecht: غرفة نوم واحدة، وغرفة معيشة، ومطبخ، وحمّام. توجد شرفة لكن لا توجد حديقة. الشقة صغيرة لكنها مريحة.'
    note: انتبه إلى عدد الغرف، وإلى المرافق الموجودة وغير الموجودة، وإلى الانطباع العامّ.
    glosses:
      Appartement: شقة
      slaapkamer: غرفة نوم
      woonkamer: غرفة جلوس
      keuken: المطبخ
      badkamer: حمّام
      balkon: شرفة
      tuin: حديقة
      klein: صغير
      gezellig: مريح ودافئ
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: تسأل Lotte عن الشقة
    gloss: 'Lotte: مرحبًا Omar، كيف هي شقتك الجديدة في Utrecht؟'
    note: '*Nieuwe* هي الصيغة المصرّفة من *nieuw* (جديد)، وتُستخدم قبل الاسم.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Omar يصفها
    gloss: 'Omar: إنها صغيرة لكنها مريحة. عندي غرفة نوم واحدة، وغرفة معيشة، ومطبخ، وحمّام.'
    note: يطابق تمامًا إعلان السكن الذي قرأته في درس سابق -- هذه هي شقة Omar الفعلية.
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: تسأل Lotte عن الشرفة
    gloss: 'Lotte: هل عندك شرفة؟'
    note: سؤال مباشر جوابه نعم أو لا، يستخدم *heb je ...?* التي مرّت في وحدات سابقة.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Omar يجيب
    gloss: 'Omar: نعم، عندي شرفة، لكن لا توجد حديقة.'
    note: يطابق ما ورد في إعلان الدرس الخامس عن الشرفة وغياب الحديقة.
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: استخدام hij بدل اسم Omar
    gloss: 'بدلًا من Omar يمكنك أن تقول hij: لديه شرفة.'
    note: يمكن للضمير *Hij* (هو) أن يحل محل اسم Omar بعد أن يُذكر في المحادثة.
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Lotte تتجاوب بود
    gloss: 'Lotte: هذا رائع! سأزورك قريبًا في وقت ما.'
    note: '*Komen langs* (يزور / يمرّ على) فعل منفصل؛ تنتقل *langs* إلى آخر الجملة.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Omar يرحب بها
    gloss: 'Omar: جميل، أنتِ مرحَّب بكِ دائمًا.'
    note: عبارة *Altijd welkom* طريقة دافئة وطبيعية لدعوة أحدهم إلى الزيارة مجددًا.
