teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: تكوين صيغة المقارنة
    gloss: في المقارنات غالبًا ما تضيف -er إلى الصفة وتستخدم dan.
    note: تقابل *Dan* الأداة «من» في المقارنة، وتأتي دائمًا بعد الصفة في صيغة المقارنة.
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: كبير، صغير
    gloss: كبير، صغير
    note: '*Groot* و*klein* صفتان أساسيتان قبل إضافة -er.'
    example_gloss:
    - الحقيبة الظهرية كبيرة.
    - الحقيبة صغيرة.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: الحقيبة الظهرية أكبر
    gloss: الحقيبة الظهرية أكبر من الحقيبة.
    note: '*Groter* هي *groot* + *er*؛ وتقدّم *dan* الشيء الثاني الذي تتم المقارنة به.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: الحقيبة أصغر
    gloss: الحقيبة أصغر من الحقيبة الظهرية.
    note: '*Kleiner* هي *klein* + *er* على النمط نفسه.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: سعر الحقيبة الظهرية
    gloss: تكلّف الحقيبة الظهرية خمسة وأربعين يورو.
    note: '*Kost* هي صيغة المفرد الغائب للفعل *kosten* أي «يكلّف».'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: سعر الحقيبة
    gloss: تكلّف الحقيبة عشرين يورو.
    note: سعر أقل من سعر الحقيبة الظهرية، تمهيدًا للمقارنة التالية.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: غالٍ، رخيص
    gloss: غالٍ، رخيص
    note: '*Duur* و*goedkoop* صفتان أساسيتان قبل إضافة *-der* أو *-er*.'
    example_gloss:
    - الحقيبة الظهرية غالية.
    - الحقيبة رخيصة.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: الحقيبة الظهرية أغلى
    gloss: الحقيبة الظهرية أغلى من الحقيبة.
    note: '*Duurder* هي *duur* + *der*. تضيف الهولندية *-der* بدل *-er* المضاعفة بعد كلمة تنتهي أصلًا بحرف r.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: الحقيبة أرخص
    gloss: الحقيبة أرخص من الحقيبة الظهرية.
    note: '*Goedkoper* هي *goedkoop* + *er*، وهي عكس الجملة السابقة.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: المقارنة بالتساوي
    gloss: استخدم net zo ثم الصفة ثم als للمقارنة بين شيئين متساويين.
    note: هذا يقابل في العربية التركيب «بقدر ما... مثل»، أي مقارنة شيئين متساويين في الصفة.
  nl.a1.unit14.lesson03.teach.mooi:
    title: جميلة بالقدر نفسه
    gloss: هذه الحقيبة الظهرية جميلة مثل تلك الحقيبة.
    note: تقع *Mooi* (جميل) بين *net zo* و*als* دون تغيير، فلا تُضاف إليها نهاية -er في هذا التركيب.
  nl.a1.unit14.lesson03.teach.praktisch:
    title: عملية بالقدر نفسه
    gloss: الحقيبة الظهرية عملية مثل الحقيبة.
    note: يمكن لأي صفة عادية أن تملأ موضع *net zo ... als* نفسه.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: تكوين صيغة التفضيل
    gloss: في صيغة التفضيل غالبًا ما تستخدم het ثم الصفة ثم st.
    note: هذه الصيغة الخبرية (بعد *is*) تأخذ *het* مهما كان جنس الاسم.
  nl.a1.unit14.lesson04.teach.duurst:
    title: الأغلى من بين اثنين
    gloss: من بين هاتين، الحقيبة الظهرية هي الأغلى ثمنًا.
    note: '*Duurst* هي *duur* + *st*. يمكن في الهولندية استخدام صيغة التفضيل حتى عند المقارنة بين خيارين فقط.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'غير منتظم: goed, beter, best'
    gloss: 'صيغ goed وbeter وbest غير منتظمة: dit is de beste keuze (هذا هو الخيار الأفضل). وveel وmeer وmeest تعمل بالطريقة نفسها.'
    note: السلسلتان (*goed/beter/best* و*veel/meer/meest*) لا تتبعان نمط -er/-st المنتظم. وفي العربية أيضًا تأتي «أفضل» مقابل «جيد» دون اشتقاق منتظم.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: أفضل خيار للرحلة
    gloss: هذه الحقيبة الظهرية هي الخيار الأفضل لرحلة قطار طويلة.
    note: '*Beste* هي الصيغة الوصفية (قبل الاسم)، وتأخذ النهاية -e التي تضيفها الصفات الهولندية عادةً قبل الاسم.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: مساحة أكبر
    gloss: الحقيبة الظهرية فيها مساحة أكبر من الحقيبة.
    note: '*Meer* هي صيغة المقارنة غير المنتظمة لـ *veel* (كثير)، وتقابل «أكثر» في العربية.'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: قراءة إعلان متجر
    gloss: 'حقيبة ظهر Bergsport: خمسة وأربعون يورو. هذه الحقيبة الظهرية كبيرة وقوية. حقيبة كتف Stad: عشرون يورو. هذه الحقيبة أصغر وأخف من حقيبة الظهر، لكنها أقل قوة. لرحلة طويلة تكون حقيبة الظهر هي الخيار الأفضل، لأنها أقوى وفيها مساحة أكبر.'
    note: تتبّع أسعار المنتجين وأحجامهما، والمنتج الذي يوصي به الإعلان وسبب ذلك.
    glosses:
      Rugzak: حقيبة ظهر
      vijfenveertig: خمسة وأربعون
      euro: يورو
      groot: كبير
      sterk: قوي
      Schoudertas: حقيبة كتف
      twintig: عشرون
      tas: حقيبة
      kleiner: أصغر
      lichter: أخف
      minder: أقل
      lange: طويل
      reis: رحلة
      beste: الأفضل
      keuze: خيار
      sterker: أقوى
      ruimte: مساحة
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte تشير إلى الحجم
    gloss: 'Lotte: انظر، هذه الحقيبة الظهرية أكبر من تلك الحقيبة.'
    note: '*Kijk* (انظر) طريقة شائعة للفت انتباه شخص إلى شيء ما.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar يشرح سبب حاجته إليها
    gloss: 'Omar: نعم، وفيها مساحة أكبر. أحتاج إلى حقيبة كبيرة لرحلة القطار.'
    note: '*Nodig hebben* (يحتاج إلى) تركيب ثابت؛ والشيء الذي تحتاج إليه يوضع بين *hebben* و*nodig*.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte تؤكد الاختيار
    gloss: 'Lotte: إذن الحقيبة الظهرية هي الخيار الأفضل لك.'
    note: '*Dan* هنا تعني «في هذه الحالة»، وليست أداة المقارنة *dan* التي مرّت في دروس المقارنة؛ فالكلمة نفسها تُكتب بالشكل نفسه في الاستعمالين.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar يسأل عن رأي Lotte
    gloss: 'Omar: بالضبط. أي حقيبة تراها الأجمل؟'
    note: '*Vind jij het mooist* تعيد استخدام نمط التعبير عن الرأي من دروس *vinden* في الوحدة 13.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte تختار حقيبة الكتف
    gloss: 'Lotte: أرى أن حقيبة الكتف هذه هي الأجمل. وهي خفيفة أيضًا.'
    note: '*Licht* (خفيف الوزن) صفة جديدة ومفيدة لوصف الحقائب والأمتعة.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: يحسمان القرار
    gloss: 'Omar: حسنًا، إذن أشتري أنا الحقيبة الظهرية وتشترين أنتِ حقيبة الكتف.'
    note: تحذف الجملة الثانية الفعل المكرر *koop*، وهذا طبيعي في الهولندية المحكية عندما يكون المعنى واضحًا من السياق.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop مقابل koopt
    gloss: Koop هي صيغة المتكلم (ik) من kopen (يشتري)؛ أما koopt فهي صيغة الغائب المفرد (hij أو zij).
    note: 'نمط المضارع المنتظم: *ik koop*، *jij/hij/zij koopt*.'
