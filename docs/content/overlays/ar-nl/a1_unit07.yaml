    title: بطاقات الأسعار في السوق
    gloss: 'التفاح: 2,50 يورو للكيلو. الكمثرى: 3,00 يورو للكيلو. الطماطم: 2,00 يورو للكيلو. الفلفل: 1,00 يورو للحبة.'
    note: اقرأ *per kilo* بمعنى «للكيلو» و*per stuk* بمعنى «للقطعة الواحدة». تستخدم البطاقات الهولندية الفاصلة في كتابة الأسعار.
    glosses:
      Appels: تفاح
      kilo: كيلوغرام
      Peren: الكمثرى
      Tomaten: طماطم
      stuk: قطعة / حبة
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: ماذا تريد؟
    gloss: ماذا تريد؟
    note: '*Wat mag het zijn?* سؤال شائع ولطيف من بائع في السوق أو عامل في متجر.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: إذن سآخذ كيلو من الكمثرى
    gloss: إذن سآخذ كيلو من الكمثرى، من فضلك.
    note: '*Dan neem ik ...* طريقة طبيعية لتقرير ما تشتريه بعد سماع السعر.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: هل تريد شيئًا آخر؟
    gloss: هل تريد شيئًا آخر؟
    note: سؤال قصير شائع يطرحه البائع بعد ذلك.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: لا، شكرًا
    gloss: لا، شكرًا.
    note: تتوافق *Dank u* مع صيغة الاحترام *u* المستخدمة مع البائع.
  nl.a1.unit07.lesson05.teach.total:
    title: المجموع 3,00 يورو
    gloss: المجموع 3,00 يورو — ثلاثة يورو.
    note: '*Dat is dan ...* طريقة شائعة يذكر بها البائع المبلغ الإجمالي. يُنطق السعر المكتوب €3,00 هكذا: *drie euro*.'
  nl.a1.unit07.lesson05.teach.pin:
    title: هل يمكنني الدفع بالبطاقة؟
    gloss: هل يمكنني الدفع بالبطاقة؟
    note: '*Pinnen* هو الفعل الهولندي اليومي للدفع بالبطاقة المصرفية أو الائتمانية عبر جهاز الدفع.'
  nl.a1.unit07.lesson06.teach.opening:
    title: التحية والسؤال عن السعر
    gloss: 'البائع: مساء الخير. ماذا تريد؟ لوتّه: مساء الخير. بكم كيلو التفاح؟'
    note: هذا حوار ودّي ومهذّب بين زبونة وبائع.
  nl.a1.unit07.lesson06.teach.purchase:
    title: اختيار الكمية
    gloss: 'البائع: يورو اثنان وخمسون سنتًا للكيلو، أي 2,50 يورو. لوتّه: إذن سآخذ كيلو، من فضلك.'
    note: بما أن التفاح مفهوم من الجملة السابقة، يمكن للوتّه أن تقول ببساطة *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: الدفع بالبطاقة
    gloss: 'البائع: المجموع 2,50 يورو. لوتّه: هل يمكنني الدفع بالبطاقة؟ البائع: نعم، بالطبع.'
    note: '*Kan ik pinnen?* هو السؤال العملي المعتاد عند الدفع.'
  nl.a1.unit07.lesson06.teach.closing:
    title: إنهاء الحديث
    gloss: 'لوتّه: شكرًا. إلى اللقاء! البائع: إلى اللقاء!'
    note: '*Tot ziens* مناسبة لإنهاء هذا الحوار المهذّب بين زبون وبائع.'
