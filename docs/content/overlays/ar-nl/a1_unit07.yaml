teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: السوق، المتجر، الكشك
    gloss: السوق، المتجر، الكشك
    note: قد تعني *de markt* سوقًا بوجه عام أو سوقًا مفتوحة منتظمة. أما *de winkel* فهي المتجر أو المحل. وتعني *kraam* كشكًا في سوق مفتوحة.
    example_gloss:
    - أنا ذاهب إلى السوق.
    - أنا ذاهب إلى المتجر.
    - يبيع الكشك التفاح.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: تفاح، إجاص، طماطم، فلفل رومي
    gloss: تفاح، إجاص، طماطم، فلفل رومي
    note: المفرد *appel* والجمع *appels*. والمفرد *peer* والجمع *peren*. والمفرد *tomaat* والجمع *tomaten*. وفي الهولندية تعني *paprika* الفلفل الرومي، ويُكتب جمعها *paprika's*.
    example_gloss:
    - أودّ تفاحًا.
    - أودّ إجاصًا.
    - أودّ طماطم.
    - أودّ فلفلًا رومي.
  nl.a1.unit07.lesson02.teach.kilo:
    title: كيلو
    gloss: كيلو
    note: '*Een kilo* تعني كيلوغرامًا واحدًا.'
    example_gloss: أريد كيلو من التفاح.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: للكيلو
    note: تذكر بطاقات الأسعار في السوق غالبًا سعر الكيلو.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: كم سعر كيلو التفاح؟
    gloss: كم يكلّف كيلو التفاح؟
    note: '*Hoeveel kost ...?* يسأل عن السعر. والشيء الذي له ثمن هنا هو *een kilo*، لذا يُستخدم الفعل المفرد *kost*.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: يكلّف كيلو التفاح 2.50 يورو
    gloss: يكلّف كيلو التفاح 2.50 يورو.
    note: 'تُكتب الأسعار في الهولندية بفاصلة عشرية: €2,50.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: يوروان وخمسون
    gloss: 2.50 يورو — يوروان وخمسون
    note: يُقال €2,50 عادةً *twee euro vijftig*، دون *en* ودون *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: غرامات، رطل، قطعة، قطعتان
    gloss: مئة غرام، رطل = 500 غرام، قطعة واحدة، قطعتان
    note: بعد العدد تُستخدم هنا *gram* وليس *grammen*. وفي الهولندية اليومية تعني *een pond* 500 غرام، وهو تعبير قديم غير رسمي وليس وحدة مترية رسمية. وتعني *per stuk* أن لكل قطعة سعرها الخاص؛ وعند ذكر العدد وحده بعد أعداد أكبر من واحد تُستخدم *stuks*، كما في *twee stuks*.
    example_gloss:
    - أريد 100 غرام من الجبن.
    - رطل من التفاح، من فضلك.
    - هل يمكنني الحصول على قطعة واحدة، من فضلك؟
    - أودّ قطعتين، من فضلك.
  nl.a1.unit07.lesson03.teach.how_much:
    title: كم تريد؟
    gloss: كم تريد؟
    note: يستخدم البائع صيغة الاحترام *u*. ويمكن أن يسأل *Hoeveel* عن الوزن أو عن العدد.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: رطل من الطماطم، من فضلك
    gloss: رطل (500 غرام) من الطماطم، من فضلك.
    note: هذا جواب قصير كامل وطبيعي حين يسأل البائع *Hoeveel wilt u?*
