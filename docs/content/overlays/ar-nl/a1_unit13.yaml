teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden للطعام والشراب
    gloss: تستخدم الهولندية غالبًا التعبير lekker vinden مع الطعام والشراب.
    note: 'فعل «أحب» العربي لا يقابله تعبير هولندي واحد. مع الطعم قل *Ik vind ... lekker*، وحرفيًا: أجده لذيذًا.'
  nl.a1.unit13.lesson01.teach.koffie:
    title: حب القهوة
    gloss: أحب القهوة.
    note: يأتي الطعام أو الشراب بين *vind* و*lekker*.
  nl.a1.unit13.lesson01.teach.thee:
    title: عدم حب الشاي
    gloss: لا أحب الشاي.
    note: ضع *niet* قبل *lekker* لتعبّر عن عدم إعجابك بالطعم.
  nl.a1.unit13.lesson01.teach.question:
    title: السؤال عن الطعم
    gloss: هل تحب شوربة الطماطم؟
    note: في السؤال غير الرسمي تأتي *vind* قبل *je*. وهذا امتداد لأسلوب *jij/je* في الدورة.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden للأنشطة
    gloss: 'تستخدم الهولندية غالبًا التعبير leuk vinden مع الأنشطة: أحب ركوب الدراجة.'
    note: استخدم *leuk* لا *lekker* مع نشاط مثل ركوب الدراجة.
  nl.a1.unit13.lesson02.teach.walking:
    title: حب المشي
    gloss: أحب المشي.
    note: يأتي النشاط *wandelen* بين *vind* و*leuk*.
  nl.a1.unit13.lesson02.teach.dislike:
    title: عدم حب التسوق
    gloss: لا أحب التسوق.
    note: تأتي *Niet* قبل *leuk*.
  nl.a1.unit13.lesson02.teach.activity_question:
    title: السؤال عن الأنشطة
    gloss: ماذا تحب أن تفعل؟
    note: '*Wat vind je leuk om te doen?* سؤال عام طبيعي عن الأنشطة التي يفضّلها الشخص.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: حب أقوى أو أعمّ
    gloss: يعبّر Houden van عن حب قوي أو عام.
    note: استخدمه بانتقاء. فردود الفعل العادية تجاه طعام أو نشاط معيّن يُعبَّر عنها بصورة أطبع بـ*lekker vinden* أو *leuk vinden*.
  nl.a1.unit13.lesson03.teach.music:
    title: حب الموسيقى
    gloss: أعشق الموسيقى / أحب الموسيقى كثيرًا.
    note: '*Houd* هي صيغة *ik* من الفعل *houden*، وتليها *van*.'
  nl.a1.unit13.lesson03.teach.films:
    title: عدم حب الأفلام
    gloss: لا أحب الأفلام.
    note: في النفي تقع *niet* بين *houd* و*van*.
  nl.a1.unit13.lesson03.teach.contrast:
    title: اختر التعبير الطبيعي
    gloss: 'للطعم العادي قل أيضًا: أحب القهوة. وللنشاط: أحب المشي.'
    note: لا تستخدم *houden van* آليًا مقابلًا لكل فعل «أحب» في العربية.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: عرض خيارين
    gloss: هل تريد قهوة أم شايًا؟
    note: '*Wil je ... of ...?* يطلب من الشخص الآخر أن يختار.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: قل ما تفضّله
    gloss: أفضّل الشاي.
    note: تأتي *Liever* بعد *wil* في نمط الاختيار العادي هذا.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: تفضيل شيء واحد
    gloss: أفضّل السترة الزرقاء.
    note: العبارة *Ik heb liever ...* طبيعية أيضًا عند تفضيل شيء على آخر.
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever تدل على الخيار المفضّل
    gloss: التفضيل يُظهر أنك تختار خيارًا بدلًا من الآخر.
    note: يمكن أن تبقى المقارنة ضمنية عندما يكون الخياران واضحين من سياق الحديث.
  nl.a1.unit13.lesson05.teach.message:
    title: قراءة عدة تفضيلات
    gloss: مرحبًا Lotte، أعجبني الفيلم، لكن Omar لا يحب الأفلام. هو يفضّل الذهاب إلى الحديقة. أنا أحب المشي أيضًا.
    note: تتبّع من أعجبه الفيلم، ومن لا يحب الأفلام، وما البديل الذي يختاره Omar.
    glosses:
      Hoi: مرحباً
      vind: يعجبني / أرى
      film: فيلم
      leuk: ممتع / لطيف
      maar: لكن
      houdt: يحب
      films: أفلام
      wil: تريد
      liever: يفضّل
      park: حديقة
      wandelen: المشي
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotte تعرض طعامين
    gloss: 'Lotte: ماذا تريد أن تأكل يا Omar؟ هل تريد خبزًا أم حساء الطماطم؟'
    note: السؤال الثاني يقدّم الخيارين.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omar يختار الحساء
    gloss: 'Omar: أفضّل حساء الطماطم. أراه لذيذًا. وأنتِ؟'
    note: يختار Omar أولًا باستخدام *liever*، ثم يعلّل اختياره بالذوق باستخدام *lekker*.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotte تختار الخبز
    gloss: 'Lotte: أفضّل الخبز. حساء الطماطم ليس لذيذًا جدًا بالنسبة لي.'
    note: تخفّف *Niet zo lekker* من حدّة النفي، وهي طبيعية في حديث ودّي.
  nl.a1.unit13.lesson06.teach.activity:
    title: اختيار ما سنفعله بعد ذلك
    gloss: 'Omar: ماذا تريدين أن تفعلي بعد الأكل؟ Lotte: أحب المشي.'
    note: تصف *Leuk* النشاط *wandelen*.
  nl.a1.unit13.lesson06.teach.plan:
    title: يتشاركان التفضيل نفسه
    gloss: 'Omar: وأنا كذلك. أحب المشي كثيرًا. هل نذهب إلى الحديقة؟ Lotte: فكرة جيدة.'
    note: هذا يعيدنا إلى لغة التخطيط غير الرسمية من الوحدة 11.
