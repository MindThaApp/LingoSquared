teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: سعيد وحزين وغاضب
    gloss: سعيد، حزين، غاضب
    note: ثلاث كلمات أساسية شائعة للمشاعر، تُستعمل مع zijn (يكون) لوصف ما تشعر به.
    example_gloss:
    - أنا سعيد.
    - أنا حزين.
    - أنا غاضب.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: قول إنك سعيد
    gloss: أنا سعيد.
    note: النمط الأساسي هو *Zijn* (يكون) + صفة شعور. في العربية نقول «أنا سعيد» دون فعل «يكون» في الحاضر، أما في الهولندية فلا بد من zijn.
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: المقارنة بين مشاعر
    gloss: لست غاضبًا، أنا حزين.
    note: '*Niet* تنفي *boos* مباشرة؛ ثم تذكر الجملة الثانية الشعور الفعلي.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: السؤال عن السبب
    gloss: لماذا أنت سعيد؟
    note: '*Waarom* (لماذا) هي أداة الاستفهام المعتادة للسؤال عن السبب.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: ذكر السبب
    gloss: أنا سعيد لأن لدي شقة جديدة.
    note: '*Omdat* (لأن) تُدخل جملة السبب، وينتقل الفعل إلى آخر هذه الجملة (*heb* يأتي بعد *appartement*).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: سبب سلبي
    gloss: أنا حزين لأن المطر يهطل.
    note: تعيد هذه الجملة استعمال *regent* (تمطر) من وحدة الطقس لتكون جملة السبب.
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: متوتر
    gloss: متوتر
    note: الكلمة المعتادة للتعبير عن التوتر.
    example_gloss: أنا متوتر قبل أول مناوبة لي.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: ذكر سبب توترك
    gloss: أنا متوتر قبل أول مناوبة لي.
    note: تُستعمل *Voor* (حرفيًا «لأجل») لذكر سبب التوتر أو موضوعه، ويقابلها في العربية «من» أو «بسبب».
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: طمأنة شخص ما
    gloss: لا تقلق.
    note: '*Maak je geen zorgen* (حرفيًا «لا تجعل لنفسك همومًا») عبارة ثابتة معتادة للطمأنة.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: السؤال عن شعور شخص ما
    gloss: كيف يشعر Omar؟
    note: '*Voelen zich* (يشعر، فعل انعكاسي) هو الطريقة المعتادة للسؤال عن الحالة العاطفية أو وصفها، ويختلف عن *voelen* الجسدي الذي ورد في دروس الصحة في الوحدة 16.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: وصف شعور شخص ما
    gloss: إنه يشعر بالتوتر.
    note: '*Zich* ضمير انعكاسي للغائب، ويأتي مع *voelt*.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: السؤال عن سبب شعور شخص ما
    gloss: لماذا يشعر بالتوتر؟
    note: تجمع هذه الجملة بين *waarom* ونمط *voelt zich* من الجملة *Hij voelt zich zenuwachtig*.
  nl.a1.unit21.lesson05.teach.bericht:
    title: اقرأ رسالة عن المشاعر
    gloss: مرحبًا Lotte، أنا متوتر قليلًا بشأن أول نوبة عمل لي بمفردي. لكنني سعيد أيضًا لأن لدي عملًا جديدًا وشقة جديدة. أظن أن الأمور ستسير على ما يرام.
    note: تتبّع سبب توتر الكاتب، وما يسعده، ونظرته العامة.
    glosses:
      beetje: قليلًا
      zenuwachtig: متوتر
      eerste: أول
      dienst: مناوبة
      alleen: وحده
      blij: سعيد
      want: لأن
      nieuwe: جديد
      baan: عمل
      nieuw: جديد
      appartement: شقة
      denk: يظن
      komt: سيكون على ما يرام
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte تسأل Omar عن شعوره
    gloss: 'Lotte: مرحبًا Omar، كيف تشعر تجاه أول نوبة عمل لك؟'
    note: '*Voor je eerste dienst* (بشأن أول نوبة عمل لك) تعيد نمط *voor* + اسم من الدرس 3.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar يعترف بأنه متوتر
    gloss: 'Omar: أنا متوتر قليلًا، بصراحة.'
    note: '*Eerlijk gezegd* (بصراحة) تخفف من وقع الاعتراف.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte تطمئنه
    gloss: 'Lotte: لا تقلق، أنت قادر على ذلك!'
    note: '*Je kunt het goed* (حرفيًا «أنت تستطيع ذلك جيدًا») عبارة ثابتة للتشجيع.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar يشكرها
    gloss: 'Omar: شكرًا، هذا يساعدني فعلًا.'
    note: '*Helpt* هي صيغة الغائب من *helpen* (يساعد).'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte تتوقع النتيجة
    gloss: 'Lotte: وبعد ذلك ستكون سعيدًا جدًا وفخورًا بالتأكيد.'
    note: '*Vast* (بالتأكيد) تعبّر عن توقع واثق؛ و*trots* (فخور) صفة جديدة ومفيدة.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar يوافق
    gloss: 'Omar: نعم، أظن ذلك أيضًا.'
    note: '*Dat denk ik ook* (حرفيًا «ذلك أظن أنا أيضًا») طريقة طبيعية للموافقة على رأي أحدهم.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: التلخيص باستعمال is وzijn وhem
    gloss: Omar متوتر بشأن أول نوبة عمل له. Lotte تساعده.
    note: '*Is* هي صيغة الغائب من *zijn* (يكون)؛ أما *zijn* هنا فتعني «له» (ملكية)؛ و*hem* ضمير المفعول به للغائب المذكر (الهاء) — ثلاث كلمات صغيرة لكنها أساسية للحديث عن شخص آخر.'
