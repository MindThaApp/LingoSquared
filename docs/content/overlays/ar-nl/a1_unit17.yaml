  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: المهنة / طبّاخ
    gloss: المهنة؛ طبّاخ
    note: 'الكلمة *het beroep* (المهنة) اسم من الجنس المحايد. أما *kok* (طبّاخ) فاسم مهنة شائع يُستعمل لأي جنس: *een kok*، *de kok*.'
    example_gloss:
    - ما مهنتك؟
    - أعمل طبّاخًا.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: أن تقول إنك طبّاخ
    gloss: أعمل طبّاخًا.
    note: النمط *werken als* + المهنة هو الطريقة المعتادة لذكر الوظيفة، دون أداة قبل اسم المهنة.
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: ممرّضة
    gloss: ممرّضة
    note: هو المصطلح الحديث المحايد لهذه المهنة، ويُستعمل لأي جنس.
    example_gloss: أعمل ممرّضًا.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: أن تقول إنك ممرّض
    gloss: أعمل ممرّضًا.
    note: يتبع النمط نفسه *werken als* كما في *kok*.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: السؤال عن مكان العمل
    gloss: أين تعمل؟
    note: سؤال متابعة مباشر للسؤال *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: العمل في مطعم
    gloss: أعمل في مطعم.
    note: تأتي مع *een restaurant* أداة النكرة هنا لأنه واحد من مطاعم كثيرة.
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: المستشفى
    gloss: المستشفى
    note: 'اسم من الجنس المحايد: *het ziekenhuis*.'
    example_gloss: أعمل في المستشفى.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: العمل في المستشفى
    gloss: أعمل في المستشفى.
    note: تأتي مع *het ziekenhuis* أداة التعريف، لأن المستشفى هنا مؤسسة محددة معروفة، كما في العربية حين نقول «في المستشفى».
  nl.a1.unit17.lesson02.teach.kantoor:
    title: العمل في مكتب
    gloss: يعمل بعض الناس في مكتب.
    note: '*Op kantoor* (في المكتب) تعبير ثابت بلا أداة، بخلاف *in een restaurant* و*in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: موعد البدء
    gloss: أبدأ في الساعة التاسعة.
    note: '*Begin* هو صيغة ik من الفعل *beginnen* (يبدأ)، وهي تعيد نمط الساعة من الوحدة 4.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: أيام العمل
    gloss: أعمل من الاثنين إلى الجمعة.
    note: يعيد *Van... tot...* نمط المدى لأيام الأسبوع من الوحدة 3.
  nl.a1.unit17.lesson03.teach.pauze:
    title: الاستراحة
    gloss: الاستراحة
    note: 'اسم من الجنس العام: *de pauze*.'
    example_gloss: لديّ استراحة في الساعة الثانية عشرة.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: أخذ استراحة
    gloss: لديّ استراحة في الساعة الثانية عشرة.
    note: '*Pauze hebben* (أخذ استراحة) هو النمط الثابت الطبيعي.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: موعد الانتهاء
    gloss: أنتهي في الساعة الخامسة.
    note: '*Stop* هو صيغة ik من الفعل *stoppen* (يتوقف/ينتهي).'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: يوم عمل كامل
    gloss: أبدأ في الساعة التاسعة وأنتهي في الساعة الخامسة.
    note: يجمع *begin* و*stop* بالحرف *en* في جملة واحدة تصف يوم عمل كاملًا.
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: نهايات الفعل مع الغائب
    gloss: 'مع «هو» أو «هي» يأخذ الفعل عادةً حرف -t إضافيًا: هو يعمل، هي تعمل.'
    note: يصبح *werk* ← *werkt* مع *hij* و*zij*، وهذا هو النمط المنتظم للغائب في المضارع الهولندي.
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: وظيفة لوتّه
    gloss: تعمل لوتّه ممرّضة.
    note: '*Werkt* وليس *werk* لأن الفاعل اسم من الغائب وليس *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: وظيفة عمر
    gloss: يعمل عمر طبّاخًا.
    note: نهاية -t نفسها للغائب كما في *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: استعمال الضمائر
    gloss: هي تعمل في المستشفى. هو يعمل في مطعم.
    note: '*Zij* و*hij* يحلّان محل الاسمين لوتّه وعمر، مع بقاء صيغة الفعل نفسها للغائب بنهاية -t.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: اقرأ نبذتين عن العمل
    gloss: تعمل لوتّه ممرّضة في المستشفى. تبدأ في الساعة السابعة وتعمل من الاثنين إلى الجمعة. يعمل عمر طبّاخًا في مطعم. يبدأ في الساعة الحادية عشرة وله استراحة في الساعة الرابعة.
    note: تتبّع مهنة كل شخص ومكان عمله وجدوله على حدة.
    glosses:
      werkt: يعمل
      verpleegkundige: ممرضة
      ziekenhuis: المستشفى
      begint: يبدأ
      zeven: سبع
      maandag: الاثنين
      vrijdag: الجمعة
      kok: طبّاخ
      restaurant: مطعم
      elf: إحدى عشرة
      pauze: استراحة
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: لوتّه تسأل عن العمل
    gloss: 'لوتّه: مرحبًا يا عمر! أنا فضولية، ماذا تعمل في الواقع؟'
    note: الكلمة *Eigenlijk* (في الواقع) تلطّف السؤال فيبدو فضولًا ودودًا لا استجوابًا.
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: عمر يجيب
    gloss: 'عمر: أعمل طبّاخًا في مطعم. وأنت؟'
    note: '*En jij?* هي الطريقة المعتادة لإعادة السؤال إلى الطرف الآخر.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: لوتّه تجيب
    gloss: 'لوتّه: أعمل ممرّضة في المستشفى.'
    note: تتوافق مع المهنة ومكان العمل المذكورين سابقًا.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: عمر يسأل عن ساعات العمل
    gloss: 'عمر: ما ساعات عملك؟'
    note: التعبير *Uren maken* (حرفيًا «صنع ساعات») تعبير ثابت لوصف جدول العمل.
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: لوتّه تذكر ساعات عملها
    gloss: 'لوتّه: أبدأ في الساعة السابعة وأعمل من الاثنين إلى الجمعة.'
    note: يتوافق مع الجدول المذكور سابقًا في نص القراءة.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: ردّ فعل عمر
    gloss: 'عمر: هذا مبكر! أنا أبدأ لاحقًا، في الساعة الحادية عشرة.'
    note: يطابق وقت بداية عمر المذكور سابقًا في الدرس 5.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: لوتّه تختم الموضوع
    gloss: 'لوتّه: لكل وظيفة إيقاعها الخاص، على ما أظن.'
    note: عبارة ختامية طبيعية فيها شيء من التأمل؛ يكفي أن تفهم معناها دون الحاجة إلى إعادتها بالنص نفسه.
