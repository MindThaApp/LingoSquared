teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: الاستيقاظ
    gloss: الاستيقاظ → أستيقظ
    note: 'ينفصل الفعل *Opstaan* في الجملة الرئيسية: *Ik sta op*. تنتقل البادئة *op* إلى النهاية.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: ارتداء الملابس
    gloss: ارتداء الملابس → أرتدي ملابسي
    note: 'الفعل *Zich aankleden* انعكاسي ومنفصل. مع *ik* نستعمل *me*، وتنتقل *aan* إلى النهاية: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: تناول الفطور
    gloss: تناول الفطور → أتناول الفطور
    note: 'الفعل *Ontbijten* لا ينفصل: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: العمل
    gloss: العمل → أعمل
    note: 'الفعل *Werken* لا ينفصل: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: الأكل
    gloss: الأكل → آكل
    note: 'صيغة *ik* من الفعل *eten* هي *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: غسل الأطباق
    gloss: غسل الأطباق → أغسل الأطباق
    note: 'ينفصل الفعل *Afwassen*: *Ik was af*. تنتقل البادئة *af* إلى النهاية.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: النوم
    gloss: النوم → أنام
    note: 'الفعل *Slapen* لا ينفصل. وصيغته مع *ik* فيها حرف علة طويل: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: نمط الانفصال
    gloss: 'في الجملة الرئيسية العادية، ينتقل الجزء الأول إلى النهاية: opstaan → Ik sta op.'
    note: لا تقل *Ik opsta*. صرّف الفعل الرئيسي وضع البادئة القصيرة في نهاية الجملة الرئيسية.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan في جملة
    gloss: 'الاستيقاظ: أستيقظ في السابعة.'
    note: يأتي تعبير الوقت بين *sta* والبادئة الأخيرة *op*.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden في جملة
    gloss: 'ارتداء الملابس: أرتدي ملابسي.'
    note: النمط هو *Ik* + *kleed* + *me* + *aan*. وتبقى *Aan* في النهاية.
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen في جملة
    gloss: 'غسل الأطباق: أغسل الأطباق بعد الأكل.'
    note: تأتي *Na het eten* بين *was* والبادئة الأخيرة *af*.
  nl.a1.unit10.lesson02.teach.contrast:
    title: أفعال لا تنفصل
    gloss: 'غير منفصلة: أتناول الفطور. أعمل. أنام. لا يأتي أي جزء في النهاية.'
    note: تبقى *Ontbijten* و*werken* و*slapen* صيغة فعل واحدة في هذه الجمل الرئيسية.
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: الاستيقاظ في السابعة والنصف
    gloss: أستيقظ في السابعة والنصف.
    note: 'تذكّر طريقة الساعة في الهولندية: *half acht* تعني منتصف الطريق نحو الثامنة، أي 07:30. وتبقى *Op* في النهاية.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: ارتداء الملابس في الثامنة إلا ربعًا
    gloss: أرتدي ملابسي في الثامنة إلا ربعًا.
    note: يأتي الوقت قبل البادئة المنفصلة الأخيرة *aan*.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: تناول الفطور في الثامنة
    gloss: أتناول الفطور في الساعة الثامنة.
    note: استعمل *om* قبل الوقت. الفعل *Ontbijt* لا ينفصل.
  nl.a1.unit10.lesson03.teach.work_time:
    title: العمل من التاسعة إلى الخامسة
    gloss: أعمل من الساعة التاسعة إلى الساعة الخامسة.
    note: تعطي *Van ... tot ...* وقت البداية ووقت النهاية.
  nl.a1.unit10.lesson03.teach.eat_time:
    title: الأكل في السادسة والنصف
    gloss: آكل في السادسة والنصف مساءً.
    note: تجعل *'s Avonds* المساء واضحًا، فتكون *half zeven* هنا 18:30.
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: النوم في الحادية عشرة
    gloss: أنام في الساعة الحادية عشرة.
    note: 'استعمل *om* قبل الوقت: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: أولًا، ثم، بعد ذلك
    gloss: أولًا، ثم، بعد ذلك
    note: تدل *Eerst* على النشاط الأول، وتنتقل *dan* إلى التالي، وتربط *daarna* بما سبق.
    example_gloss:
    - أولًا أستيقظ.
    - ثم أرتدي ملابسي.
    - بعد ذلك أتناول الفطور.
  nl.a1.unit10.lesson04.teach.sequence:
    title: صباح من ثلاث خطوات
    gloss: أولًا أستيقظ. ثم أرتدي ملابسي. بعد ذلك أتناول الفطور.
    note: 'تبقى البادئات المنفصلة في نهاية جملها: *sta ik op*؛ *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: الفعل قبل ik
    gloss: 'بعد eerst وdan وdaarna يأتي الفعل قبل ik: Daarna ontbijt ik.'
    note: البدء بكلمة ترتيب يحوّل *Ik ontbijt* إلى *Daarna ontbijt ik*.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: يومي
    gloss: يومي — أستيقظ في السابعة والنصف. بعد ذلك أرتدي ملابسي، وفي الثامنة أتناول الفطور. أعمل من التاسعة إلى الخامسة. في السادسة والنصف مساءً آكل. بعد ذلك أغسل الأطباق. في الحادية عشرة أنام.
    note: اقرأ بانتباه لترتيب الأنشطة وأوقاتها معًا. لاحظ *op* و*aan* و*af* في نهاية جمل الأفعال المنفصلة.
    glosses:
      Mijn: خاصتي
      dag: يوم
      sta: ينهض من النوم (مع op)
      half: نصف الساعة قبل الساعة التالية (half acht = 7:30)
      acht: ثمانية
      Daarna: بعد ذلك
      kleed: يرتدي ملابسه (مع me ... aan)
      uur: الساعة
      ontbijt: يتناول الفطور
      werk: يعمل
      negen: تسع
      vijf: خمسة
      zeven: سبع
      avonds: في المساء
      eet: يأكل
      was: يغسل الأطباق (مع af)
      elf: إحدى عشرة
      slaap: ينام
  nl.a1.unit10.lesson06.teach.question:
    title: السؤال عن اليوم
    gloss: 'Lotte: كيف يبدو يومك يا Omar؟'
    note: '*Hoe ziet jouw dag eruit?* طريقة غير رسمية لدعوة شخص إلى وصف يومه. الفعل *Eruitzien* منفصل: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: صباح Omar
    gloss: 'Omar: أستيقظ في السابعة والنصف. بعد ذلك أرتدي ملابسي، وفي الثامنة أتناول الفطور.'
    note: يربط Omar بين ثلاثة أنشطة صباحية ويُبقي *op* و*aan* في نهاية جملتيهما.
  nl.a1.unit10.lesson06.teach.work:
    title: يوم عمل Omar
    gloss: 'Lotte: متى تعمل؟ Omar: أعمل من التاسعة إلى الخامسة.'
    note: تستعمل Lotte وOmar الضمير غير الرسمي *je* فيما بينهما.
  nl.a1.unit10.lesson06.teach.evening:
    title: مساء Omar
    gloss: 'Omar: في السادسة والنصف مساءً آكل. بعد ذلك أغسل الأطباق. في الحادية عشرة أنام.'
    note: 'البدء بوقت أو بـ*daarna* يضع الفعل قبل *ik*: *eet ik* و*was ik* و*slaap ik*. وتبقى *Af* في النهاية.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: صباح Lotte
    gloss: 'Lotte: أستيقظ في السادسة، لكنني لا أتناول الفطور إلا في السادسة والنصف.'
    note: تعني *Pas* هنا «ليس قبل». تقابل Lotte بين وقت استيقاظها ووقت فطورها.
