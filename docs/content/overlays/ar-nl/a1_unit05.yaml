teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: الأب والأم
    gloss: أب / أم
    note: '*Vader* هي الكلمة المحايدة المعتادة للأب. *Moeder* هي الكلمة المحايدة المعتادة للأم.'
    example_gloss:
    - هذا أبي.
    - تلك هي أمي.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: الوالدان والأخ والأخت
    gloss: الوالدان / الأخ / الأخت
    note: '*Ouders* تأتي دائمًا بصيغة الجمع بهذا المعنى؛ و*de broer* و*de zus* كلتاهما تأخذ أداة التعريف *de*.'
    example_gloss:
    - يعيش والداي في أوتريخت.
    - لدي أخ.
    - لدي أخت.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: الطفل والأطفال
    gloss: الطفل / الأطفال
    note: '*Kind* من الكلمات التي تأخذ *het*: *het kind*. أما الجمع *kinderen* فيأخذ *de*، مع أن المفرد *kind* يأخذ het.'
    example_gloss:
    - لأختي طفل واحد.
    - لعمّي وعمّتي طفلان.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: لدي أخ وأخت
    gloss: لدي أخ وأخت.
    note: '*Ik heb ...* هي الطريقة المعتادة للتعبير عن أفراد العائلة الذين لديك.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: الجد والجدة والعم والعمة
    gloss: جد / جدة / عم / عمة
    note: '*Opa* هي الكلمة اليومية للجد؛ أما *grootvader* فأكثر رسمية وتُستعمل في الكتابة. *Oma* هي الكلمة اليومية للجدة؛ أما *grootmoeder* فأكثر رسمية وتُستعمل في الكتابة. *De oom*. *De tante*.'
    example_gloss:
    - يعيش جدي وجدتي في روتردام.
    - عمر جدتي تسعة وتسعون عامًا.
    - يعيش عمّي في أمستردام.
    - لعمّي وعمّتي طفلان.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef وnicht كلمتان ملتبستان
    gloss: ابن العم أو ابن الأخ/الأخت؛ بنت العم أو بنت الأخ/الأخت
    note: في العربية كلمات مختلفة لابن العم وابن الأخ، أما الهولندية فلا تفرّق بينهما بكلمة مختلفة، بل يحدد السياق المقصود. لا تُختبر هاتان الكلمتان في تمارين هذه الوحدة، وإنما ذُكرتا هنا لتتعرّف إليهما لاحقًا.
    target_text: neef = ابن العم أو ابن الأخ؛ nicht = بنت العم أو ابنة الأخ
  nl.a1.unit05.lesson02.teach.gezin:
    title: الأسرة (من يعيشون معًا)
    gloss: الأسرة (من يعيشون معًا)
    note: '*Gezin* تشير إلى الأسرة التي تعيش معها (عادةً الوالدان والأطفال)؛ أما *familie* فكلمة أوسع تعني العائلة الممتدة والأقارب عمومًا.'
    example_gloss: تعيش أسرتي في أوتريخت.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: جدي وجدتي يعيشان في روتردام
    gloss: يعيش جدي وجدتي في روتردام.
    note: تُستعمل *Wonen in* مع أسماء المدن لبيان مكان سكن الشخص.
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: لعمّي وعمّتي طفلان
    gloss: لعمّي وعمّتي طفلان.
    note: نستعمل *hebben* لأن *oom en tante* يشير إلى شخصين.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: ضمير الملكية «ـي» و«ـك» (غير مشدَّد ومشدَّد)
    gloss: ـي / ـك (غير مشدَّد) / ـك (مشدَّد)
    note: تبقى *Mijn* بالصيغة نفسها قبل الأسماء المسبوقة بـ de وhet، سواء كان الاسم مفردًا أو جمعًا. *Je* هي الصيغة الودية المعتادة حين لا تشدّد على صاحب الشيء، وهي أيضًا لا تتغير قبل أي اسم. *Jouw* أقوى من *je* ويلزم عند المقابلة بين فرد من عائلة شخص وفرد من عائلة شخص آخر، وهي كذلك لا تتغير قبل أي اسم.
    example_gloss:
    - هذا أخي.
    - هل هذه أختك؟
    - هل تلك أختك؟
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je وjouw
    gloss: كلتاهما تعني «ـك» في الخطاب الودي
    note: استعمل *je* حين لا يكون هناك تشديد خاص. واستعمل *jouw* حين تشدّد على صاحب الشيء، خاصةً في المقابلة. يمكن استعمال الصيغة الكاملة *jouw* من دون مقابلة أيضًا، لكن *je* هي الأكثر شيوعًا هنا.
    target_text: كلتا الكلمتين je وjouw تعنيان «ـك» في صيغة المخاطب غير الرسمية. تُستعمل je عادةً دون تأكيد، أما jouw فهي أقوى وتلزم عند المقابلة. وتبقى كلتاهما بالشكل نفسه قبل كل اسم.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: هذا أخي
    gloss: هذا أخي.
    note: تُستعمل *Dit is ...* لتقديم شخص قريب.
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: هل تلك أختك؟
    gloss: هل تلك أختك؟
    note: تشير *Dat is ...* إلى شخص أبعد أو سبق ذكره.
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: ضمير الملكية «ـه» و«ـها»
    gloss: ـه / ـها
    note: تبقى *Zijn* دائمًا بالصيغة نفسها، مثل *mijn* و*je* و*jouw*. وكذلك *Haar* لا تتغير.
    example_gloss:
    - هذا والده.
    - تلك والدتها.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn وhaar
    gloss: ـه لمالك مذكر، ـها لمالكة مؤنثة
    note: 'في أمثلة هذه الدروس، اختر *zijn* إذا كان المالك ذكرًا و*haar* إذا كانت المالكة أنثى. ولا تؤثر كلمة القرابة التي بعدها في الاختيار: *zijn vader* و*zijn moeder*؛ *haar vader* و*haar moeder*.'
    target_text: zijn = «ـه»، haar = «ـها»؛ وتبقى كلتاهما على حالها مهما كان الاسم الذي يليها.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: هذا والده
    gloss: هذا والده.
    note: '*Zijn vader* — والده.'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: تلك والدتها
    gloss: تلك والدتها.
    note: '*Haar moeder* — والدتها.'
  nl.a1.unit05.lesson05.teach.heet:
    title: اسمه / اسمها
    gloss: يُدعى
    note: '*Ik heet...* / *Hij heet...* — الطريقة المعتادة لذكر اسم شخص، وقد مرّت معنا في الوحدة 1.'
    example_gloss: اسمي لوته.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'أسماء أفراد العائلة: ساندر وفينا ويان وماريكه'
    gloss: ساندر (اسم هولندي للذكور) / فينا (اسم هولندي للإناث) / يان (اسم هولندي للذكور) / ماريكه (اسم هولندي للإناث)
    note: الأسماء الأربعة أسماء أولى شائعة في هولندا — ساندر ويان للذكور، وفينا وماريكه للإناث.
    example_gloss:
    - اسم أخي ساندر.
    - اسم أختي فينا.
    - اسم أبي يان.
    - اسم أمي ماريكه.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: روتردام
    note: مدينة هولندية كبرى.
    example_gloss: يعيش جدّ لوته وجدّتها في روتردام.
  nl.a1.unit05.lesson05.teach.profile:
    title: تعريف لوته بعائلتها
    gloss: اسمي لوته. لدي أخ وأخت. اسم أخي ساندر واسم أختي فينا. اسم أبي يان واسم أمي ماريكه. يعيش جدي وجدتي في روتردام.
    note: تعريف شفهي قصير من لوته بعائلتها، يعيد استعمال مفردات من دروس هذه الوحدة السابقة.
  nl.a1.unit05.lesson06.teach.egypte:
    title: مصر
    gloss: مصر
    note: بلد عمر الأصلي، كما في الوحدات السابقة.
    example_gloss: يعيش والداي في مصر.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: كل شهر
    gloss: كل شهر
    note: تعبّر *Elke* مع اسم مفرد عن معنى «كل ...».
    example_gloss: نعم، كل شهر.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: هل لديك إخوة أو أخوات؟
    gloss: 'لوته: هل لديك إخوة أو أخوات يا عمر؟ عمر: نعم، لدي أختان. ليس لدي إخوة. وأنتِ؟ لوته: لدي أخ وأخت.'
    note: '*Broers of zussen* — إخوة أو أخوات، بصيغة الجمع.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: هل يعيش والداك في هولندا أيضًا؟
    gloss: 'عمر: هل يعيش والداكِ في هولندا أيضًا؟ لوته: نعم، يعيش والداي في أوتريخت. وعائلتك أنت؟ عمر: يعيش والداي في مصر، لكن عمّي يعيش هنا في أمستردام.'
    note: '*Wonen ook in* — يعيشون أيضًا في، لسؤال شخص آخر عمّا إذا كان الأمر نفسه ينطبق عليه.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: هل تراه كثيرًا؟
    gloss: 'لوته: جميل! هل تراه كثيرًا؟ عمر: نعم، كل شهر.'
    note: '*Zie je hem vaak?* — طريقة طبيعية وشائعة للسؤال عن تكرار الزيارة.'
