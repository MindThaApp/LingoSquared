teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: طويل وقصير
    gloss: طويل / قصير
    note: '*Lang* تصف شخصًا طويلًا، و*klein* تصف شخصًا قصيرًا (وهي الكلمة نفسها التي تُستخدم للشيء الصغير في موضع آخر من هذه الدورة).'
    example_gloss:
    - فينا طويلة.
    - ساندر قصير.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: '*Oud* و*jong* تصفان هنا انطباعًا عامًا عن المظهر، لا عددًا محددًا من السنوات.'
    example_gloss:
    - الجد كبير في السن.
    - عمر شاب.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: رقم أو انطباع'
    gloss: 'يمكن أن تدل Oud على عدد محدد من السنوات، كما في: Hoe oud ben je? أو على انطباع عام دون رقم، كما في: Opa is oud.'
    note: تعرف *oud* من السؤال عن العمر بدقة (*Hoe oud ben je?*). وهنا تصف كم يبدو الشخص كبيرًا في السن، دون ذكر أي رقم.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: فينا طويلة وساندر قصير
    gloss: فينا طويلة وساندر قصير.
    note: جملة بسيطة تجمع بين وصفين بالحرف *en* (و)، وتمهّد للمقارنة المباشرة في الدرس 5.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: الشعر
    gloss: الشعر
    note: '*Haar* اسم من أسماء het: *het haar*.'
    example_gloss: عمر لديه شعر أسود قصير.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: ثلاثة ألوان للشعر. سبق أن تعلّمتَ *zwart* (أسود) مع الملابس، وها هي تُستخدم هنا مع الشعر.
    example_gloss:
    - لوته لديها شعر أشقر.
    - ساندر لديه شعر بني.
    - شعر الجد رمادي.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: '*Lang* (طويل) هي كلمة الطول نفسها من الدرس 1، لكنها تصف هنا طول الشعر. أما *kort* (قصير) فهي جديدة هنا.'
    example_gloss:
    - فينا لديها شعر طويل.
    - ساندر لديه شعر قصير.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar مع صفة بلا نهاية
    gloss: 'Haar اسم من أسماء het ولا تسبقه أداة تعريف، لذلك تبقى الصفة بلا نهاية: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: لا تُضاف النهاية -e قبل *haar* في هذه الصيغة النكرة التي لا أداة تعريف فيها. أما *ogen* في الدرس 3 فتأخذ النهاية -e.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: معنيان'
    gloss: 'لكلمة Haar معنيان: «الشعر» (الاسم الجديد في هذا الدرس) و«ها» أي ضمير الملكية للمؤنث (من الوحدة 5، مثل haar moeder). يحدد السياق المعنى المقصود.'
    note: 'هذه كلمة هولندية لها شكل واحد ومعنيان: *haar* الاسم (الشعر) و*haar* ضمير الملكية (ها) تُكتبان بالطريقة نفسها. ويوضح باقي الجملة دائمًا المعنى المقصود.'
    target_text: 'لكلمة Haar معنيان: «شعر» (الاسم الجديد في هذا الدرس) و«ـها» أو «لها» (صفة الملكية، مثل haar moeder). السياق يبيّن لك المقصود.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: عمر لديه شعر أسود قصير
    gloss: عمر لديه شعر أسود قصير.
    note: تُستخدم هنا *zwart* (أسود) التي وردت في وحدة الملابس، الوحدة 20.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: لوته لديها شعر أشقر طويل
    gloss: لوته لديها شعر أشقر طويل.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: العيون
    gloss: العيون
    note: '*Ogen* جمع *het oog*، ويأخذ الجمع دائمًا الأداة *de*.'
    example_gloss: عمر لديه عينان بنيتان.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: سبق أن تعلّمتَ *blauw* (أزرق) مع الملابس، وتعلّمتَ *bruin* (بني) للتو في الدرس 2 مع الشعر، أما *groen* (أخضر) فجديدة هنا.
    example_gloss:
    - لوته لديها عينان زرقاوان.
    - ساندر لديه عينان بنيتان.
    - فينا لديها عينان خضراوان.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen تأخذ -e
    gloss: 'مع ogen (جمع) تأخذ الصفة النهاية -e: blauwe ogen, bruine ogen, groene ogen.'
    note: قارن ذلك بـ*haar* في الدرس 2 حيث تبقى الصفة بلا نهاية. أما مع الجمع فتأخذ الصفة النهاية -e دائمًا، سواء كان الاسم من فئة de أو het.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: كيف تبدو لوته؟
    gloss: كيف تبدو لوته؟
    note: '*Hoe ziet ... eruit?* هو السؤال الأساسي في هذه الوحدة، وتستطيع استخدامه للسؤال عن مظهر أي شخص.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: لوته لديها شعر أشقر طويل وعينان زرقاوان
    gloss: لوته لديها شعر أشقر طويل وعينان زرقاوان.
    note: إجابة نموذجية تجمع الشعر والعينين في جملة واحدة بالحرف *en* (و).
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: لوته تقدّم نينا
    gloss: 'لوته: ستأتي فتاة جديدة إلى taalcafé. اسمها نينا.'
    note: '*Er komt* (ستأتي / تأتي) تُستخدم لتقديم شخص جديد في المشهد.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: عمر يسأل كيف تبدو
    gloss: 'عمر: حسنًا! كيف تبدو؟'
    note: هو سؤال الوحدة الأساسي نفسه، لكن مع *ze* (هي) بدل الاسم.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: لوته تصف طول نينا وشعرها
    gloss: 'لوته: هي قصيرة ولديها شعر أشقر قصير.'
    note: تجمع بين *klein* من الدرس 1 ومفردات الشعر من الدرس 2.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: عمر يسأل عن عينيها
    gloss: 'عمر: وعيناها؟'
    note: '*Haar* هنا تعني «ها» أي ضمير الملكية (من الوحدة 5)، وليس «الشعر». راجع ملاحظة الكلمة ذات المعنيين في الدرس 2.'
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: لوته تصف عيني نينا
    gloss: 'لوته: لديها عينان خضراوان.'
    note: تُستخدم هنا *groene ogen* من الدرس 3.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: عمر سيتعرّف عليها
    gloss: 'عمر: شكرًا! إذن سأتعرّف عليها.'
    note: '*Herken ik haar wel* تعني «سأتعرّف عليها بلا شك». و*haar* هنا ضمير المفعول «ها» مرة أخرى، وليس «الشعر».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: مقارنة بين ساندر وفينا
    gloss: ساندر وفينا أخ وأخت، لكنهما يختلفان في المظهر. ساندر قصير ولديه شعر بني قصير وعينان بنيتان. فينا أطول من ساندر ولديها شعر بني طويل وعينان خضراوان. كيف تبدو أنت؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      broer: أخ
      zus: أخت
      zien: مظهر
      anders: مختلف
      klein: قصير
      kort: قصير
      bruin: بني
      haar: الشعر
      bruine: بني
      ogen: العيون
      langer: أطول
      lang: طويل
      groene: أخضر
      eruit: (جزء من 'eruit zien' = يبدو / يظهر)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: إعادة استخدام نمط المقارنة
    gloss: 'تعرف هذا النمط من المقارنات: صفة + er + dan. وهنا تستخدمه مع الأشخاص: Fenna is langer dan Sander، أي فينا أطول من ساندر.'
    note: هو نمط *الصفة + -er + dan* نفسه من وحدة التسوّق لحقيبة الظهر في الوحدة 14، لكنه يُطبَّق هنا على وصف الأشخاص بدل الأشياء.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: فينا شعرها أطول من شعر ساندر
    gloss: فينا شعرها أطول من شعر ساندر.
    note: تبقى *langer* بلا نهاية قبل *haar* (اسم من أسماء het)، وهي القاعدة نفسها الواردة في ملاحظة الدرس 2، حتى في صيغة التفضيل والمقارنة.
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: جملة نموذجية بضمير المتكلم تستخدم *Ik heb ...*، جاهزة لوصف مظهرك أنت.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: عمر يلمح نينا
    gloss: 'عمر: انظري، هل هذه نينا؟ لديها شعر أشقر قصير وعينان خضراوان.'
    note: سبق أن استُخدمت *Kijk* (انظر) بالطريقة نفسها في حوار الوحدة 14.
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: لوته تؤكد
    gloss: 'لوته: نعم، هذه نينا!'
    note: تأكيد قصير وطبيعي.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: نينا تحيّي عمر
    gloss: 'نينا: مرحبًا، هل أنت عمر؟'
    note: 'سؤال تحية بسيط وغير رسمي: *ben jij ...?*'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: عمر يردّ التحية على نينا
    gloss: 'عمر: نعم! سررت بلقائك يا نينا.'
    note: '*Leuk je te ontmoeten* هي العبارة المعتادة عند اللقاء الأول حقًا (انظر الوحدة 1)، وليست *leuk je te zien* التي تُقال لشخص تعرفه من قبل.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: تُختتم بها المحادثة، فقد تعرّف عمر على نينا من وصف لوته السابق.
