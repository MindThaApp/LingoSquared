  description: 'هولندية للمبتدئين لوصف المظهر الجسدي الأساسي للشخص: انطباعات الطول والعمر، ولون الشعر والعينين، والسؤال الأساسي Hoe ziet ... eruit?، ومقارنة مظهر شخصين.'
