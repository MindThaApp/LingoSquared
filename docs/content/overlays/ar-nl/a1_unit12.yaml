      Daar: هناك
      koffie: قهوة
      gedronken: شرب
  nl.a1.unit12.lesson06.teach.question:
    title: ماذا فعلتَ أمس؟
    gloss: 'Lotte: ماذا فعلتَ أمس يا Omar؟'
    note: '*Wat heb je ... gedaan?* هو السؤال المعتاد وغير الرسمي للسؤال عمّا فعله شخص ما.'
  nl.a1.unit12.lesson06.teach.answer:
    title: أفعال Omar الثلاثة
    gloss: 'Omar: عملتُ. ثم ذهبتُ إلى السوبرماركت. اشتريتُ تفاحًا.'
    note: تعرض الإجابة ثلاثة أفعال بسيطة مكتملة في جمل منفصلة.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: وماذا عن صباح اليوم؟
    gloss: 'Lotte: وماذا فعلتَ صباح اليوم؟'
    note: استبدل *gisteren* بـ *vanmorgen* للسؤال عن وقت قريب آخر.
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Omar جاء إلى مقهى اللغة
    gloss: 'Omar: صباح اليوم جئتُ إلى مقهى اللغة في الساعة الثامنة.'
    note: 'الفعل *komen* يأخذ *zijn*: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Lotte شربت القهوة
    gloss: 'Lotte: جميل. شربتُ القهوة صباح اليوم.'
    note: 'الفعل *Drinken* يأخذ *hebben*: *heb ... gedronken*.'
