    gloss: عملتُ أمس.
    note: عندما تبدأ الجملة بـ *gisteren* يأتي *heb* قبل *ik*.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: قهوة صباح اليوم
    gloss: صباح اليوم في الساعة الثامنة شربتُ القهوة.
    note: هنا نستخدم *om acht uur* من نظام الساعة في الوحدة 4.
  nl.a1.unit12.lesson04.teach.time_order:
    title: الزمن في البداية يغيّر الترتيب
    gloss: 'بعد Gisteren أو Vanmorgen يأتي الفعل قبل ik: Gisteren heb ik ...'
    note: هذا هو ترتيب الفعل قبل *ik* نفسه الذي رأيناه بعد *daarna* في الوحدة 10.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: سردٌ لأحداث قريبة
    gloss: صباح اليوم ذهبتُ إلى السوبرماركت. اشتريتُ تفاحًا. بعد ذلك ذهبتُ إلى مقهى اللغة. هناك شربتُ القهوة.
    note: اقرأ مع الانتباه إلى الإشارة الزمنية والأماكن وكل فعل مكتمل.
    glosses:
      Vanmorgen: صباح اليوم
      supermarkt: السوبرماركت
      gegaan: ذهب
      appels: تفاح
      gekocht: اشترى
      Daarna: بعد ذلك
