teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: الماضي الهولندي في الحياة اليومية
    gloss: في المحادثة، يُعبَّر عن الحدث المنتهي عادةً بـ hebben أو zijn مع اسم المفعول.
    note: تستعمل الهولندية في الكلام اليومي هذا التركيب، أي فعلًا مساعدًا مع اسم المفعول، للتعبير عن حدث انتهى، وهو يقابل في العربية غالبًا الفعل الماضي البسيط. فالجملة *Ik heb koffie gedronken* تعني عادةً «شربتُ القهوة».
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: شربتُ القهوة
    gloss: يشرب ← شربتُ القهوة.
    note: '*Heb* هو الفعل المساعد، و*gedronken* هو اسم المفعول من *drinken*.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: ذهبتُ إلى السوبرماركت
    gloss: يذهب ← ذهبتُ إلى السوبرماركت.
    note: 'يستخدم *Gaan* الفعل *zijn*: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: اسم المفعول في نهاية الجملة
    gloss: 'يقع اسم المفعول في نهاية الجملة: Ik heb koffie gedronken. تذكّر موضع op في نهاية الجملة Ik sta op.'
    note: دربتك الوحدة 10 على الانتباه إلى عنصر مهم في نهاية الجملة. وهنا العنصر الأخير هو اسم المفعول.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: معظم الأفعال تستخدم hebben
    gloss: معظم الأفعال تستخدم hebben.
    note: في هذه الوحدة استخدم *hebben* مع *drinken* و*eten* و*werken* و*kopen*.
  nl.a1.unit12.lesson02.teach.drinken:
    title: drinken مع hebben
    gloss: يشرب ← شربتُ القهوة.
    note: النمط الكامل هو *ik + heb + ... + gedronken*، وبينهما المفعول به.
  nl.a1.unit12.lesson02.teach.eten:
    title: eten مع hebben
    gloss: يأكل ← أكلتُ الخبز.
    note: اسم المفعول من *eten* هو *gegeten*.
  nl.a1.unit12.lesson02.teach.werken:
    title: werken مع hebben
    gloss: يعمل ← عملتُ.
    note: اسم المفعول من *werken* هو *gewerkt*.
  nl.a1.unit12.lesson02.teach.kopen:
    title: kopen مع hebben
    gloss: يشتري ← اشتريتُ تفاحًا.
    note: اسم المفعول من *kopen* هو *gekocht*.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: gaan وkomen يستخدمان zijn
    gloss: مع gaan وkomen استخدم zijn.
    note: يستخدم هذان الفعلان الشائعان للحركة الفعل *zijn* لا *hebben* في تركيب الحدث المنتهي الذي نتعلمه هنا.
  nl.a1.unit12.lesson03.teach.gaan:
    title: gaan مع zijn
    gloss: يذهب ← ذهبتُ إلى السوبرماركت.
    note: استخدم *ben* مع *ik* وضع *gegaan* في النهاية.
  nl.a1.unit12.lesson03.teach.komen:
    title: komen مع zijn
    gloss: يأتي ← جئتُ إلى مقهى اللغة.
    note: استخدم *ben* مع *ik* وضع *gekomen* في النهاية.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: مقارنة بين الفعلين المساعدين
    gloss: عملتُ، لكنني ذهبتُ إلى السوبرماركت.
    note: '*Werken* يأخذ *hebben*؛ و*gaan* يأخذ *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: أمس، هذا الصباح
    gloss: أمس، هذا الصباح
    note: '*Gisteren* تعني اليوم السابق لليوم الحالي، أما *vanmorgen* فتشير إلى صباح اليوم نفسه.'
    example_gloss:
