teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: Pieniądze
    gloss: pieniądze
    note: پول to ogólne słowo oznaczające pieniądze.
    example_gloss: Gdzie są moje pieniądze?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Bank
    gloss: bank
    note: بانک to ogólne słowo oznaczające bank.
    example_gloss: Bank jest blisko.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Dolar
    gloss: dolar
    note: دلار to dolar (amerykański), najczęstsza waluta obca w codziennych rozmowach o wymianie pieniędzy.
    example_gloss: Mam dolary.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Wymiana
    gloss: wymiana
    note: 'تبدیل znaczy „wymiana, zamiana” i występuje z czasownikiem کردن („robić”): تبدیل کردن.'
    example_gloss: Chcę wymienić (pieniądze).
  fa.a1.unit21.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to najczęstszy spójnik łączący, znany już z wcześniejszych jednostek.
    target_text: و („i”)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Powiedz, że chcesz wymienić walutę
    gloss: Chcę wymienić dolary na tomany.
    note: W zdaniu می‌خوام دلار به تومن تبدیل کنم przyimek به („do, na”) wskazuje walutę docelową.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Zapytaj, ile ktoś ma dolarów
    gloss: Ile macie dolarów?
    note: '*چقدر دلار دارید؟* zawiera *چقدر* („ile”), słowo, które znasz już z wcześniejszych pytań o ilość.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Bankomat
    gloss: bankomat
    note: خودپرداز dosłownie znaczy „samoobsługa / sam wypłaca”; to standardowe słowo oznaczające bankomat.
    example_gloss: Bankomat jest tam.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Powiedz, że chcesz wypłacić pieniądze
    gloss: Chcę wypłacić pieniądze z bankomatu.
    note: W zdaniu می‌خوام از خودپرداز پول بردارم występuje از („z”) oraz بردارم („wypłacam, biorę”).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Prośba o drobne
    gloss: Czy macie drobne?
    note: W zwrocie پول خرد دارید؟ słowo خرد („drobny”) stoi po پول („pieniądze”).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Proszę (powtórka)
    gloss: proszę
    note: '*بفرمایید* pojawiło się we wcześniejszej lekcji; tutaj używa się go przy podawaniu czegoś komuś.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Kurs
    gloss: kurs
    note: نرخ to słowo oznaczające kurs (wymiany).
    example_gloss: Jaki jest dzisiaj kurs?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Podawanie kursu za jednego dolara
    gloss: Każdy dolar kosztuje 30 tomanów.
    note: هر دلار سی تومنه zawiera هر (każdy) oraz potoczną końcówkę -e (*تومنه* = *تومن است*), którą już znasz.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: Sto
    gloss: sto
    note: صد to liczba 100.
    example_gloss: Mam sto dolarów.
  fa.a1.unit21.lesson06.teach.please_do:
    title: Proszę to zrobić
    gloss: proszę wymienić
    note: لطفاً تبدیل کنید to grzeczna forma rozkazująca czasownika تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Sara prosi o wymianę waluty
    gloss: Sara wita się z pracownikiem i mówi, że chce wymienić dolary na tomany.
    note: Powtórka zdania می‌خوام دلار به تومن تبدیل کنم z lekcji 2.
  fa.a1.unit21.lesson06.teach.turn02:
    title: Pracownik pyta, ile jest dolarów
    gloss: Pracownik wita Sarę i pyta, ile ma dolarów.
    note: Powtórka zdania چقدر دلار دارید؟ z lekcji 2.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara podaje kwotę i pyta o kurs
    gloss: Sara mówi, że ma sto dolarów, i pyta o dzisiejszy kurs.
    note: صد (sto) to nowe słowo; نرخ امروز چنده؟ powtarza pytanie o kurs z lekcji 5.
  fa.a1.unit21.lesson06.teach.turn04:
    title: Pracownik podaje kurs
    gloss: Pracownik mówi, że każdy dolar kosztuje 30 tomanów.
    note: Powtórka zdania هر دلار سی تومنه z lekcji 5.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara się zgadza i prosi o dokonanie wymiany
    gloss: Sara się zgadza i prosi pracownika o wymianę.
    note: لطفاً تبدیل کنید – zwrot z początku tej lekcji.
  fa.a1.unit21.lesson06.teach.turn06:
    title: Pracownik podaje całą kwotę
    gloss: Proszę, trzy tysiące tomanów.
    note: '*سه هزار تومن* = 100 dolarów × 30 tomanów za dolara. *هزار* (tysiąc) powtarzamy z lekcji o liczbach.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara dziękuje i prosi też o drobne
    gloss: Dziękuję. Czy ma Pan/Pani też drobne?
    note: Powtórka pytania پول خرد دارید؟ z lekcji 4 z dodatkiem هم (też).
  fa.a1.unit21.lesson06.teach.turn08:
    title: Pracownik potwierdza i podaje pieniądze
    gloss: Tak, proszę.
    note: بله (tak) to słowo z powtórki; بفرمایید kończy wymianę.
