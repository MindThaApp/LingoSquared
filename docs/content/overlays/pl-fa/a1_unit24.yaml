    title: Co tydzień
    gloss: co tydzień
    note: '*هر* łączy się tak samo z *هفته*, tworząc *هر هفته* (co tydzień).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Czasami
    gloss: czasami
    note: '*گاهی* znaczy czasami.'
    example_gloss: Czasami czytam książki.
