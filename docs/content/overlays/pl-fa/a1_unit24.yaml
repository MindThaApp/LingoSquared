    title: Co robisz w wolnym czasie?
    gloss: Co robisz w wolnym czasie?
    note: Zwrot *چیکار می‌کنی* już znasz – tutaj służy do zapytania konkretnie o czas wolny.
  fa.a1.unit24.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, postać znana z lekcji 11, pojawia się tu ponownie.'
    example_gloss: Nima lubi czytać książki.
