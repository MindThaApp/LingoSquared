    gloss: kilka / ile
    note: '*چند* (ile/kilka) w połączeniu z klasyfikatorem *تا* znaczy „kilka” lub „ile” przed rzeczownikiem policzalnym.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: On/ona czyta
    gloss: on/ona czyta
    note: '*می‌خونه* to potoczna forma 3. osoby od *خوندن* (czytać).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: Też
    gloss: też
    note: '*هم* znaczy „też”; użyte tak już w lekcji 11.'
    example_gloss: Nima też gra w piłkę nożną.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: On/ona robi
    gloss: on/ona robi
    note: '*می‌کنه* to potoczna forma 3. osoby od *می‌کنم* (robię).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Czytanka: czas wolny Nimy'
    gloss: Nima lubi czytać książki. Co tydzień czyta kilka książek. Czasami też gra w piłkę nożną.
    note: '*چند تا* przed *کتاب* znaczy „kilka książek”; *می‌خونه* i *می‌کنه* to potoczne formy 3. osoby, używane, gdy mówimy o kimś innym.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, postać znana z lekcji 14, pojawia się tu ponownie.'
    example_gloss: Sara lubi oglądać filmy.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: Oglądać / widzieć
    gloss: oglądać / widzieć
    note: '*دیدن* to bezokolicznik czasownika, którego czas teraźniejszy (*می‌بینم*) poznałeś w lekcji 2, a przeszły (*دیدم*) w lekcji 13.'
    example_gloss: Lubię oglądać filmy.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Idę do kina
    gloss: idę do kina
    note: '*سینما* (kino) już poznałeś; *می‌رم* (idę) znasz ze zwrotu *می‌رم سر کار* (idę do pracy).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Co
    gloss: co
    note: '*چی* znaczy „co” – użyte tak już w lekcji 14 w zwrocie *تو چی؟* (A ty?).'
    example_gloss: A ty?
  fa.a1.unit24.lesson06.teach.va_word:
    title: I
    gloss: i
    note: '*و* znaczy „i” – użyte tak już w lekcji 14.'
    example_gloss: Lubię czytać i lubię piłkę nożną.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: Jak miło!
    gloss: jak miło!
    note: '*چه خوب!* już poznałeś – to częsta pozytywna reakcja, jak „super!”.'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima: Saro, co robisz w wolnym czasie?'
    gloss: Saro, co robisz w wolnym czasie?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara: Lubię oglądać filmy...'
    gloss: Lubię oglądać filmy. Co tydzień chodzę do kina. A ty?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima: Lubię czytać książki...'
    gloss: Lubię czytać książki. Czasami też gram w piłkę nożną.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara: Jak miło!'
    gloss: Jak miło!
