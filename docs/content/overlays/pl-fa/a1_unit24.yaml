teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: Czas wolny
    gloss: czas wolny
    note: '*وقت آزاد* znaczy „czas wolny” – dosłownie „wolny/otwarty czas”.'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Hobby
    gloss: hobby
    note: '*سرگرمی* znaczy hobby lub zajęcie na czas wolny.'
    example_gloss: Czytanie to hobby.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Czytanie książek
    gloss: czytanie książek
    note: '*کتاب خوندن* dosłownie znaczy „książko-czytanie” – słowo *کتاب* (książka) już znasz, *خوندن* (czytać) jest tu nowe.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: Ja lubię ...
    gloss: lubię
    note: '*دوست دارم* działa tak samo z czynnością, jak z przedmiotem: *کتاب خوندن دوست دارم* znaczy „Lubię czytać książki”.'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: Muzyka
    gloss: muzyka
    note: '*موسیقی* pojawia się tu ponownie.'
    example_gloss: Słucham muzyki.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: Słucham
    gloss: słucham
    note: '*گوش می‌دم* dosłownie znaczy „daję ucho” – to naturalny sposób, by po persku powiedzieć „słucham”.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Film
    gloss: film
    note: '*فیلم* pojawia się tu ponownie.'
    example_gloss: Oglądam filmy.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Oglądam / widzę
    gloss: oglądam / widzę
    note: '*می‌بینم* to czas teraźniejszy czasownika, którego czas przeszły (*دیدم*, „widziałem/widziałam”) już poznałeś.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Sport / ćwiczenia
    gloss: sport / ćwiczenia
    note: '*ورزش* oznacza zarówno „sport”, jak i ogólnie „ćwiczenia fizyczne”.'
    example_gloss: Ćwiczę.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Robię
    gloss: robię
    note: '*می‌کنم* to ogólny czasownik „robić”, używany w czasownikach złożonych, np. *ورزش می‌کنم* (ćwiczę).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Piłka nożna
    gloss: piłka nożna
    note: '*فوتبال* znaczy piłka nożna.'
    example_gloss: Lubię piłkę nożną.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Gram w piłkę nożną
    gloss: gram w piłkę nożną
    note: '*بازی* znaczy „gra/zabawa” – *فوتبال بازی می‌کنم* dosłownie znaczy „robię grę w piłkę”.'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Tydzień
    gloss: tydzień
    note: '*هفته* znaczy tydzień.'
    example_gloss: Ćwiczę co tydzień.
