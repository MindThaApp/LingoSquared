    example_gloss: Jest mi smutno.
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: Jestem (forma skrócona)
    gloss: jestem (forma skrócona z przymiotnikiem)
    note: '*خوشحالم* to *خوشحال* + *هستم* skrócone do końcówki *-م*. Po niemym *-ه* ta sama końcówka zapisuje się jako *-ام*, np. *خسته‌ام*.'
    target_text: خوشحالم = خوشحال + هستم (jestem zadowolony/zadowolona, forma skrócona)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Zmęczony
    gloss: zmęczony
    note: خسته znaczy „zmęczony”.
    example_gloss: Jestem zmęczony/zmęczona.
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: Nie czuję się dobrze
    gloss: nie czuję się dobrze
    note: خوب نیستم zaprzecza poznane wcześniej خوبم („mam się dobrze”) za pomocą نیستم, czyli zaprzeczenia od هستم.
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Głodny
    gloss: głodny
    note: '*گشنه* znaczy „głodny”. To potoczna forma mówiona od *گرسنه*, które poznałeś w lekcji 4.'
    example_gloss: Jestem głodny.
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: Trochę
    gloss: trochę
    note: یکم łagodzi opis uczucia, podobnie jak polskie „trochę” czy „nieco”.
    example_gloss: Jestem trochę zmęczony.
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: Zły
    gloss: zły
    note: عصبانی znaczy „zły, zdenerwowany”.
    example_gloss: Dlaczego jesteś zły?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Zmartwiony
    gloss: zmartwiony
    note: نگران znaczy „zaniepokojony, zmartwiony”.
    example_gloss: Martwię się.
  fa.a1.unit23.lesson03.teach.chera_word:
    title: Dlaczego
    gloss: dlaczego
    note: '*چرا* znaczy „dlaczego”; *هستی* to nieformalna forma „jesteś” i skraca się do *-ی*: *نگران هستی* staje się *نگرانی*.'
    target_text: چرا (dlaczego)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: Pracowałem
    gloss: pracowałem / pracowałam
    note: کار کردم dosłownie znaczy „pracę zrobiłem”.
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: Jest dzień wolny
    gloss: jest dzień wolny
    note: تعطیله znaczy „jest dzień wolny, jest święto”.
    example_gloss: Dzisiaj jest dzień wolny.
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: Dzisiaj
    gloss: dzisiaj
    note: امروز znaczy „dzisiaj”.
    example_gloss: Dzisiaj jestem zmęczony.
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: Dużo
    gloss: dużo
    note: زیاد znaczy „dużo, za dużo”.
    example_gloss: Dużo pracowałem.
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: Sara
    gloss: Sara
    note: سارا, postać znana z lekcji 14, pojawia się tu znowu.
    example_gloss: Sara jest zmęczona.
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 'Czytanka: Dzień Sary'
    gloss: Sara jest dziś trochę zmęczona, bo dużo pracowała. Sara nie jest smutna, tylko zmęczona.
    note: '*خسته‌ست* i *کرده* to potoczne formy 3. osoby od *خسته‌ام* i *کردم*; *نیست* zaprzecza *هست*; *فقط* znaczy „tylko”.'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: Jak miło!
    gloss: jak miło!
    note: چه خوب! to częsta pozytywna reakcja, jak „to świetnie!”.
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: 'Nima: Saro, jak się masz?'
    gloss: Saro, jak się masz?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 'Sara: Jestem trochę zmęczona...'
    gloss: Jestem dziś trochę zmęczona, bo dużo pracowałam. A ty, jak się masz?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 'Nima: Jestem szczęśliwy...'
    gloss: Jestem szczęśliwy, bo dziś jest dzień wolny.
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 'Sara: Jak miło!'
    gloss: Jak miło!
