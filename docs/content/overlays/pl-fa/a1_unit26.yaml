teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: Ja
    gloss: ja
    note: '*من*, które już dobrze znasz, wraca tutaj, gdy mówisz o własnym zwierzaku.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: On / ona
    gloss: on / ona
    note: '*او* pojawia się tu ponownie.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: Mam / on-ona ma / nie mam
    gloss: mam / on-ona ma / nie mam
    note: '*دارم*/*داره* działają tak samo w zdaniach o zwierzęciu. *ندارم* (nie mam) i *نداره* (on/ona nie ma) to odpowiadające im formy przeczące -- obie były już użyte razem w dialogu o rodzinie w jednostce 4.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Zwierzę
    gloss: zwierzę
    note: '*حیوان* znaczy „zwierzę”.'
    example_gloss: Kot to zwierzę.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Zwierzę domowe
    gloss: zwierzę domowe
    note: '*حیوان خونگی* dosłownie znaczy „zwierzę domowe” -- to standardowy sposób, by powiedzieć „zwierzak domowy”.'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Pies
    gloss: pies
    note: '*سگ* znaczy „pies”.'
    example_gloss: Mam psa.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Kot
    gloss: kot
    note: '*گربه* znaczy „kot”.'
    example_gloss: On ma kota.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Ptak
    gloss: ptak
    note: '*پرنده* znaczy „ptak”.'
    example_gloss: Ona ma ptaka.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Ryba
    gloss: ryba
    note: '*ماهی* znaczy „ryba”.'
    example_gloss: Mam rybę.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Masz
    gloss: masz
    note: '*داری* wraca tutaj w tej samej nieformalnej formie 2. osoby.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: Masz zwierzę domowe?
    gloss: masz zwierzę domowe?
    note: '*حیوان خونگی داری؟* łączy *حیوان خونگی* z lekcji 1 z *داری* – to naturalny sposób, by zapytać kogoś, czy ma zwierzę domowe.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Tak
    gloss: no tak
    note: '*آره* to potoczne, codzienne słowo oznaczające „tak”.'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Imię, nazwa
    gloss: imię, nazwa
    note: '*اسم* działa tak samo, gdy pytasz o imię zwierzęcia.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Jak ma na imię?
    gloss: jak ma na imię?
    note: '*اسمش چیه؟* łączy przyrostek dzierżawczy *-ش* (widziany już w *قدش*/*موهاش* w Jednostce 25) z *چیه؟* z Jednostki 2 – „jak on/ona/ono ma na imię?”'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Jedzenie
    gloss: jedzenie
    note: '*غذا* to to samo słowo, którego używa się też na karmę dla zwierząt.'
    example_gloss: Lubię jedzenie.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Daję / karmię
    gloss: daję / karmię
    note: '*می‌دم* (dosłownie „daję”), które pojawiło się już w *گوش می‌دم* w Jednostce 24, to w połączeniu z *غذا* naturalny czasownik oznaczający karmienie zwierzęcia.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Mój pies
    gloss: mój pies
    note: '*سگم* łączy *سگ* z przyrostkiem dzierżawczym *-م* – „mój pies”, według tego samego zrośniętego wzorca co *اسمم* z Jednostki 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Karmię mojego psa.
    gloss: Karmię mojego psa.
    note: W *سگم رو غذا می‌دم* słowo *رو* (znacznik dopełnienia, widziany już w *قهوه رو بیشتر دوست دارم* w Jednostce 14) oznacza, że *سگم* jest tym, kogo się karmi.
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: Jakiego jest koloru?
    gloss: jakiego jest koloru?
    note: '*چه رنگیه؟* działa tak samo, gdy opisujesz maść lub kolor zwierzęcia.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Biały
    gloss: biały
    note: '*سفید* wraca tu przy opisie koloru zwierzęcia. *گربه‌ی* to forma *گربه* z ezafe, używana przed posiadaczem, np. w *گربه‌ی من* (mój kot) – ten sam wzorzec co *خونه‌ی من* w Jednostce 19; przy rzeczownikach zakończonych samogłoską stosuje się go zamiast zrośniętego przyrostka.'
    example_gloss: Mój kot jest biały.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Mały
    gloss: mały
    note: '*کوچیک* wraca tu przy opisie wielkości zwierzęcia.'
    example_gloss: Moja rybka jest mała.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Duży
    gloss: duży
    note: '*بزرگ* wraca tu przy opisie wielkości zwierzęcia.'
    example_gloss: Mój pies jest duży.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, postać znana już z Jednostki 2, pojawia się tu ponownie.'
    example_gloss: Sara ma kota.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: Jeden / pewien
    gloss: jeden / pewien
    note: '*یک* służy tu do wprowadzenia nowej, nieokreślonej osoby lub rzeczy – w polskim odpowiada temu zwykły rzeczownik albo „jakiś”.'
  fa.a1.unit26.lesson05.teach.va_review:
    title: I
    gloss: i
    note: '*و* znaczy „i” – w tym znaczeniu pojawiło się już w Jednostkach 14, 24 i 25.'
