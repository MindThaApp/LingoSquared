course:
  title: Perski (farsi) A1
  description: 'Perski (irański) dla początkujących: nazywanie popularnych zwierząt domowych (pies, kot, ptak, ryba), pytanie „Masz zwierzę domowe?”, podawanie imienia zwierzaka i karmienie go, opisywanie jego koloru i wielkości, krótki tekst do czytania o kocie سارا o imieniu پشمک oraz końcowy dialog między سارا i نیما, którzy podziwiają پشمک.'
