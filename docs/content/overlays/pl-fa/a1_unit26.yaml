  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Czytanie: kot Sary'
    gloss: Sara ma kota. Kot ma na imię Paszmak. Paszmak jest biały i mały. Sara codziennie karmi Paszmaka.
    note: Ten tekst wykorzystuje wszystkie konstrukcje z lekcji 1–4 – prawie bez nowego słownictwa, chodzi o rozpoznawanie ich w spójnym tekście.
  fa.a1.unit26.lesson06.teach.in_word:
    title: Ten, to
    gloss: ten, to
    note: '*این* znaczy „ten”, „to”.'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: Czyje to jest?
    gloss: czyje to jest?
    note: '*کیه* służy tu do pytania, czyje jest dane zwierzę.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: To moje
    gloss: to moje
    note: '*منه* to potoczna forma skrócona od *من است* – „to jest moje”. *گربه‌ی منه* znaczy „to mój kot”.'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: To mój pies
    gloss: to mój pies
    note: '*سگمه* łączy *سگم* (mój pies) z lekcji 3 z tą samą końcówką *-ه* („jest”) co w *منه* – „to mój pies”.'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Słodki
    gloss: słodki, ładny
    note: '*خوشگل* znaczy „słodki” lub „ładny”. *خیلی* znaczy „bardzo”.'
