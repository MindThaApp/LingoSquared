    title: Podziękowanie
    gloss: dziękuję
    note: '*ممنون* wraca tu jako naturalne zakończenie rozmowy.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Nima: Czyj to kot?'
    gloss: Czyj to kot?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Sara: To mój kot. Ma na imię Paszmak.'
    gloss: To mój kot. Ma na imię Paszmak.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Nima: Jakiego jest koloru?'
    gloss: Jakiego jest koloru?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Sara: Biały i mały.'
    gloss: Biały i mały.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Nima: Bardzo słodki!'
    gloss: Bardzo słodki!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Sara: Dziękuję!'
    gloss: Dziękuję!
