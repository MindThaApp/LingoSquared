teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: Słonecznie
    gloss: słonecznie
    note: آفتابی opisuje słoneczną pogodę.
    example_gloss: Dziś jest słonecznie.
  fa.a1.unit07.lesson01.teach.rainy:
    title: Deszczowy
    gloss: deszczowy
    note: بارونی to potoczna, codzienna pisownia i wymowa słowa بارانی („deszczowy”).
    example_gloss: Jutro będzie deszczowo.
  fa.a1.unit07.lesson01.teach.cloudy:
    title: Pochmurnie
    gloss: pochmurny
    note: ابری opisuje pochmurną pogodę.
    example_gloss: Jest pochmurno.
  fa.a1.unit07.lesson01.teach.snowy:
    title: Śnieżnie
    gloss: śnieżny
    note: برفی opisuje śnieżną pogodę.
    example_gloss: Zimą pogoda jest śnieżna.
  fa.a1.unit07.lesson01.teach.or_word:
    title: Lub
    gloss: lub
    note: یا łączy dwie alternatywne pogody.
    target_text: یا (lub)
  fa.a1.unit07.lesson02.teach.hot:
    title: Gorąco
    gloss: gorący
    note: گرم ogólnie opisuje upalną pogodę lub wysoką temperaturę.
    example_gloss: Dziś jest gorąco.
  fa.a1.unit07.lesson02.teach.cold:
    title: Zimno
    gloss: zimno
    note: سرد ogólnie opisuje zimną pogodę lub niską temperaturę.
    example_gloss: Zimą jest zimno.
  fa.a1.unit07.lesson02.teach.cool:
    title: Chłodno
    gloss: chłodny
    note: خنک opisuje łagodną, chłodną pogodę, pomiędzy گرم a سرد.
    example_gloss: Wieczorami jest chłodno.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: Pogoda
    gloss: pogoda
    note: هوا to ogólne słowo oznaczające pogodę (znaczy też „powietrze”).
    example_gloss: Jaka jest dziś pogoda?
  fa.a1.unit07.lesson03.teach.weather_question:
    title: Zapytaj o pogodę
    gloss: Jaka jest pogoda?
    note: هوا چطوره؟ używa słowa چطوره, potocznego pytania „jak jest”, które znasz już z حالتون چطوره؟ w Lekcji 1.
  fa.a1.unit07.lesson03.teach.today_word:
    title: Dzisiaj
    gloss: dzisiaj
    note: امروز oznacza bieżący dzień.
    example_gloss: Dziś jest ładna pogoda.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: Jutro
    gloss: jutro
    note: فردا oznacza następny dzień.
    example_gloss: Do zobaczenia jutro.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: Powiedz, że dziś jest słonecznie
    gloss: Dziś jest słonecznie.
    note: امروز هوا آفتابیه używa potocznego skrótu -e (آفتابیه = آفتابی است), który już poznałeś w tym kursie.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: Powiedz, że dziś jest zimno
    gloss: Dziś jest zimno.
    note: امروز سرده ma ten sam wzorzec skrócenia.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: Potoczny skrót -e
    gloss: آفتابیه to codzienna, mówiona forma skrócona od آفتابی است.
    note: 'Ten sam wzorzec (przymiotnik + ه) działa przy każdym słowie o pogodzie: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: Powiedz, że dziś pada deszcz
    gloss: Dziś jest deszczowo.
    note: امروز بارونیه stosuje ten sam skrót -e do słowa بارونی.
  fa.a1.unit07.lesson05.teach.because_word:
    title: Ponieważ / bo
    gloss: ponieważ / bo
    note: چون wprowadza powód propozycji.
    example_gloss: Zakładam płaszcz, bo jest zimno.
  fa.a1.unit07.lesson05.teach.better_to:
    title: Zaproponuj wzięcie parasola
    gloss: Lepiej weźmy parasol.
    note: بهتره چتر ببریم używa potocznego بهتره („lepiej”), by łagodnie coś zaproponować.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: Połącz powód z propozycją
    gloss: Skoro jest deszczowo, lepiej weźmy parasol.
    note: چون بارونیه، بهتره چتر ببریم łączy powód związany z pogodą z propozycją.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: Zaproponuj założenie płaszcza
    gloss: Skoro jest zimno, lepiej załóżmy płaszcze.
    note: چون سرده، بهتره کت بپوشیم ma ten sam wzorzec powód + propozycja, tu dla zimnej pogody.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: Zaproponuj założenie płaszcza
    gloss: lepiej załóżmy płaszcze
    note: کت بپوشیم ma ten sam wzorzec بهتره + czasownik co چتر ببریم, tu dla zimnej pogody.
    example_gloss: Jest zimno, załóżmy płaszcze.
  fa.a1.unit07.lesson06.teach.turn01:
    title: Sara pyta o dzisiejszą pogodę
    gloss: Sara pyta, jaka jest dziś pogoda.
    note: هوا چطوره؟ to pytanie z lekcji 3.
  fa.a1.unit07.lesson06.teach.turn02:
    title: Reza mówi, że jest deszczowo
    gloss: Reza mówi, że chyba pada deszcz.
    note: فکر کنم („chyba”, „myślę, że”) łagodzi wypowiedź, bo Reza zgaduje i nie jest pewny.
  fa.a1.unit07.lesson06.teach.turn03:
    title: Sara proponuje wzięcie parasola
    gloss: Sara mówi, że w takim razie lepiej wziąć parasol.
    note: پس („więc”, „w takim razie”) łączy fakt o pogodzie z propozycją.
  fa.a1.unit07.lesson06.teach.turn04:
    title: Reza się zgadza i pyta o jutro
    gloss: Reza się zgadza i pyta, jak będzie jutro.
    note: فردا چی؟ to naturalny, zwięzły sposób, by zapytać o następny dzień.
  fa.a1.unit07.lesson06.teach.turn05:
    title: Sara opisuje jutrzejszą pogodę
    gloss: Sara mówi, że jutro będzie słonecznie i gorąco.
    note: آفتابیه و گرمه łączy dwa skrócone zdania o pogodzie za pomocą و.
  fa.a1.unit07.lesson06.teach.turn06:
    title: Reza proponuje pójście do parku
    gloss: Reza mówi, że super, więc chodźmy do parku.
    note: عالیه („super”) to pozytywna reakcja przed zaproponowaniem planu.
  fa.a1.unit07.lesson06.teach.turn07:
    title: Sara się zgadza i żegna
    gloss: Sara się zgadza i mówi, że zobaczy go jutro.
    note: باشه („dobrze”, „okej”) to częsty potoczny sposób na zgodę na plan.
