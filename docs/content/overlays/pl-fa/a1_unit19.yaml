course:
  title: Perski (farsi) A1
  description: 'Perski irański dla początkujących: podstawowe słownictwo pokoi, opisywanie domu za pomocą liczb, przedmioty domowe, położenie w domu, czytanie krótkiego opisu mieszkania i dialog o czyimś domu.'
units:
