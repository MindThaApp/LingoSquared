teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: Dom
    gloss: dom
    note: خونه znaczy „dom” (potoczna forma słowa خانه).
    example_gloss: Mój dom jest duży.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Sypialnia
    gloss: sypialnia
    note: اتاق خواب dosłownie znaczy „pokój do spania” – sypialnia.
    example_gloss: Ma dwie sypialnie.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Kuchnia
    gloss: kuchnia
    note: آشپزخانه znaczy „kuchnia”.
    example_gloss: Kuchnia jest duża.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Łazienka
    gloss: łazienka
    note: حموم znaczy „łazienka” (potoczna forma słowa حمام).
    example_gloss: Łazienka jest czysta.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Ile
    gloss: ile
    note: چند تا znaczy „ile”; używa się z rzeczownikami policzalnymi.
    target_text: چند تا (ile)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Dwa
    gloss: dwa
    note: دو تا znaczy „dwa” (czegoś policzalnego).
    example_gloss: Ma dwie łazienki.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: Ma
    gloss: ma
    note: داره to potoczna forma słowa دارد („ma”); używa się jej, opisując, co jest w domu.
    target_text: داره (ma, potocznie)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Łóżko
    gloss: łóżko
    note: تخت znaczy „łóżko”.
    example_gloss: Łóżko jest w sypialni.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Stół
    gloss: stół
    note: میز znaczy „stół”.
    example_gloss: Stół stoi obok okna.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Krzesło
    gloss: krzesło
    note: صندلی znaczy „krzesło”.
    example_gloss: Obok stołu stoi krzesło.
  fa.a1.unit19.lesson03.teach.ye_word:
    title: Jeden / pewien
    gloss: jeden / pewien
    note: یه to potoczna forma słowa یک („jeden”, „pewien”).
    target_text: یه (jeden / pewien, potocznie)
  fa.a1.unit19.lesson03.teach.va_word:
    title: I
    gloss: i
    note: و znaczy „i” i łączy dwa zdania lub dwa elementy.
    target_text: و (i)
  fa.a1.unit19.lesson04.teach.too_word:
    title: W / wewnątrz
    gloss: w / wewnątrz
    note: تو znaczy „w, wewnątrz” i wskazuje miejsce w pomieszczeniu.
    target_text: تو (w / wewnątrz)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: Obok
    gloss: obok
    note: کنار znaczy „obok”.
    target_text: کنار (obok)
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: Nad / na
    gloss: nad / na górze
    note: بالای znaczy „nad, na górze”.
    target_text: بالای (nad / na górze)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: To jest łóżko
    gloss: to łóżko
    note: '*تخته* to *تخت* („łóżko”) plus potoczne -e w znaczeniu „jest” (od *است*). W zdaniu *میز کنار تخته* właśnie końcówka -e na końcu wyrażenia tworzy zdanie: stół [jest] obok łóżka.'
    target_text: تخته (to łóżko, potocznie)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: To jest kuchnia
    gloss: to kuchnia
    note: '*آشپزخانه‌س* to *آشپزخانه* („kuchnia”) plus potoczne „jest” po samogłosce (od *است*). W zdaniu *صندلی تو آشپزخانه‌س* kończy ono zdanie: krzesło [jest] w kuchni.'
    target_text: آشپزخانه‌س (to kuchnia, potocznie)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: Też
    gloss: też / również
    note: هم znaczy „też, również” i stoi po słowie, którego dotyczy.
    target_text: هم (też / również)
  fa.a1.unit19.lesson05.teach.man_word:
    title: Ja
    gloss: ja
    note: من znaczy „ja”.
    example_gloss: Mój dom ma dwie sypialnie.
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: Dom (kogoś) / mój dom
    gloss: dom kogoś / mój dom
    note: خونه‌ی to forma ezafe słowa خونه, używana przed posiadaczem (خونه‌ی من = mój dom).
    target_text: خونه‌ی (dom kogoś / mój dom, forma ezafe)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: Przykładowy opis mieszkania
    gloss: Mój dom ma dwie sypialnie. Ma też kuchnię i łazienkę.
    note: Krótki opis w pierwszej osobie, łączący słownictwo z tej lekcji o domu.
  fa.a1.unit19.lesson06.teach.names:
    title: Nima i Sara
    gloss: Nima, Sara
    note: Popularne irańskie imiona, które pojawiają się w całym kursie.
    example_gloss:
    - Dom Nimy jest duży.
    - Dom Sary jest mały.
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: Jaki jest twój dom?
    gloss: Jaki jest twój dom?
    note: خونه‌ت چطوره؟ łączy خونه‌ت („twój dom”) z چطوره؟ („jaki jest?”).
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: Jest dobry
    gloss: jest dobry / dobra / dobre
    note: خوبه to potoczna forma wyrażenia خوب است („jest dobry”).
    example_gloss: Ten dom jest dobry.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Tak
    gloss: tak
    note: آره to potoczna forma słowa بله („tak”).
    example_gloss: Tak, jest dobry.
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: Nima pyta
    gloss: Jaki jest twój dom?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: Sara odpowiada
    gloss: Jest dobry. Ma dwie sypialnie i kuchnię.
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: Nima pyta
    gloss: Ma też łazienkę?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: Sara odpowiada
    gloss: Tak, ma też łazienkę.
