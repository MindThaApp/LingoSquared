teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: Sklep
    gloss: sklep
    note: مغازه to ogólne słowo oznaczające mały sklep.
    example_gloss: Ten sklep jest duży.
  fa.a1.unit08.lesson01.teach.price_word:
    title: Cena
    gloss: cena
    note: قیمت to ogólne słowo oznaczające cenę.
    example_gloss: Ile to kosztuje?
  fa.a1.unit08.lesson01.teach.discount_word:
    title: Zniżka
    gloss: zniżka
    note: تخفیف oznacza zniżkę. To częste słowo w codziennych zakupach i targowaniu się w Iranie.
    example_gloss: Czy są jakieś zniżki?
  fa.a1.unit08.lesson01.teach.apple_word:
    title: Jabłko
    gloss: jabłko
    note: سیب to typowy przykład towaru do ćwiczenia cen i ilości.
    example_gloss: Chcę jabłko.
  fa.a1.unit08.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to zwykłe słowo łączące, które pojawia się w całej tej jednostce.
    target_text: و (i)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: Pytanie o cenę
    gloss: Ile to kosztuje?
    note: این چنده؟ to codzienny, potoczny sposób pytania o cenę; to skrócona forma od این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: Podaj cenę za kilogram
    gloss: Kilo kosztuje 30 tomanów.
    note: کیلویی سی تومنه podaje cenę za kilo w potocznej formie ze skróconym -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: Potoczne skrócenie -e (powtórka)
    gloss: تومنه to codzienna, mówiona forma od تومن است.
    note: To ten sam wzorzec skracania, który już znasz ze słów o pogodzie, np. آفتابیه.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: Prośba o kilo jabłek
    gloss: Poproszę kilo jabłek.
    note: W zdaniu یک کیلو سیب می‌خوام jednostką miary jest کیلو (kilogram).
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: Prośba o pół kilo
    gloss: Poproszę pół kilo.
    note: W zdaniu نصف کیلو می‌خوام słowo نصف (pół) zastępuje pełne kilo.
  fa.a1.unit08.lesson04.teach.discount_question:
    title: Prośba o zniżkę
    gloss: Czy da Pan/Pani zniżkę?
    note: تخفیف می‌دید؟ to naturalne, częste pytanie na irańskich bazarach i w sklepach. Targowanie się to normalna, oczekiwana część zakupów, a nie coś niegrzecznego czy dziwnego.
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: Sprzedawca proponuje niższą cenę
    gloss: Policzę ci 28 tomanów.
    note: برات بیست و هشت تومن حساب می‌کنم to propozycja niewielkiej zniżki od pierwotnej ceny 30 tomanów.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: Zapowiedz płatność gotówką
    gloss: Zapłacę gotówką.
    note: نقدی حساب می‌کنم podaje sposób płatności za pomocą słowa نقدی (gotówką).
  fa.a1.unit08.lesson05.teach.card_question:
    title: Pytanie o płatność kartą
    gloss: Czy można płacić kartą?
    note: کارت می‌گیرید؟ pyta, czy można zapłacić kartą.
  fa.a1.unit08.lesson06.teach.please_review:
    title: Proszę / zapraszam (powtórka)
    gloss: proszę / zapraszam
    note: بفرمایید pojawiło się już w jednostce o powitaniach; tutaj sprzedawca używa go, by zaprosić klienta.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: Dziękuję (powtórka)
    gloss: dziękuję
    note: ممنون pojawiło się już w jednostce o powitaniach.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: Nie ma sprawy (powtórka)
    gloss: nie ma sprawy / nie ma za co
    note: قابلی نداره to skromny, częsty sposób odpowiedzi na podziękowanie, który pojawił się już we wcześniejszej jednostce.
  fa.a1.unit08.lesson06.teach.turn01:
    title: Sprzedawca wita klienta
    gloss: Sprzedawca wita klienta i zaprasza go do środka.
    note: بفرمایید zaprasza klienta, by się rozejrzał lub o coś zapytał.
  fa.a1.unit08.lesson06.teach.turn02:
    title: Klient pyta o cenę
    gloss: Klient wita sprzedawcę i pyta o cenę jabłek.
    note: این چنده؟ z lekcji 2, tu użyte z سیب‌ها (jabłka).
  fa.a1.unit08.lesson06.teach.turn03:
    title: Sprzedawca podaje cenę
    gloss: Sprzedawca mówi, że kilo kosztuje 30 tomanów.
    note: کیلویی سی تومنه z lekcji 2.
  fa.a1.unit08.lesson06.teach.turn04:
    title: Klient zamawia i prosi o zniżkę
    gloss: Klient mówi, że chce kilo, i pyta o zniżkę.
    note: To połączenie wzorca ilości z lekcji 3 i pytania o zniżkę z lekcji 4.
  fa.a1.unit08.lesson06.teach.turn05:
    title: Sprzedawca zgadza się na niższą cenę
    gloss: Sprzedawca się zgadza i proponuje 28 tomanów.
    note: باشه (dobrze) oznacza zgodę, zanim sprzedawca poda cenę po zniżce.
  fa.a1.unit08.lesson06.teach.turn06:
    title: Klient dziękuje i płaci
    gloss: Klient dziękuje sprzedawcy i mówi, że zapłaci gotówką.
    note: To połączenie słownictwa o płatności z lekcji 5 z prostym podziękowaniem.
  fa.a1.unit08.lesson06.teach.turn07:
    title: Sprzedawca kończy rozmowę
    gloss: Sprzedawca odpowiada na podziękowanie i zaprasza klienta.
    note: قابلی نداره، بفرمایید grzecznie kończy transakcję.
