teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Godzina / zegar
    gloss: godzina / zegar
    note: ساعت oznacza zarówno „godzinę”, jak i „zegar” i jest podstawowym słowem przy podawaniu czasu.
    example_gloss: Która jest godzina?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minuta
    gloss: minuta
    note: دقیقه to słowo oznaczające minutę.
    example_gloss: Poczekaj pięć minut.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Pół
    gloss: pół
    note: نیم oznacza „pół” i służy do podawania pełnej połowy godziny.
    example_gloss: Jest wpół do ósmej.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Kwadrans
    gloss: kwadrans
    note: ربع oznacza kwadrans, czyli piętnaście minut.
    example_gloss: Jest za kwadrans ósma.
  fa.a1.unit09.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to powszechne słowo łączące, używane w całej tej lekcji.
    target_text: و (i)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Zapytaj, która jest godzina
    gloss: Która jest godzina?
    note: ساعت چنده؟ to codzienny, potoczny sposób pytania o godzinę.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: Potoczne skrócenie -e (powtórka)
    gloss: چنده to potoczne, mówione skrócenie formy چند است.
    note: Ten sam wzorzec skrócenia znasz już ze słów o pogodzie i zakupach, takich jak آفتابیه i تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Powiedz, że jest wpół do czwartej
    gloss: Jest wpół do czwartej.
    note: ساعت سه و نیمه łączy godzinę, و („i”) oraz skróconą formę نیمه („pół”).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: Potoczne skrócenie -e w słowie نیم
    gloss: نیمه to potoczne, mówione skrócenie formy نیم است.
    note: Ten sam wzorzec co w چنده, tylko zastosowany do نیم zamiast چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Rano
    gloss: rano
    note: صبح oznacza poranek, czyli rano.
    example_gloss: Rano wstaję wcześnie.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Południe
    gloss: południe
    note: ظهر oznacza południe.
    example_gloss: W południe jem obiad.
  fa.a1.unit09.lesson04.teach.asr:
    title: Popołudnie
    gloss: popołudnie
    note: عصر oznacza popołudnie i wczesny wieczór.
    example_gloss: Pracuję po południu.
  fa.a1.unit09.lesson04.teach.shab:
    title: Noc
    gloss: noc
    note: شب oznacza noc, także wieczór.
    example_gloss: Wieczorem chodzę wcześnie spać.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Spotkanie
    gloss: spotkanie
    note: قرار to ogólne słowo oznaczające umówione spotkanie.
    example_gloss: Mam spotkanie.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Zapytaj, o której jest spotkanie
    gloss: O której jest spotkanie?
    note: قرار ساعت چنده؟ stosuje pytanie o godzinę z lekcji 2 do konkretnego spotkania.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Podaj godzinę z porą dnia
    gloss: czwarta po południu
    note: ساعت چهار عصر łączy godzinę ze słowem عصر, aby odróżnić poranek od popołudnia.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Jutro (powtórka)
    gloss: jutro
    note: فردا pojawiło się w jednej z wcześniejszych lekcji; tutaj służy do wprowadzenia tematu spotkania.
    example_gloss: Jutro mam spotkanie.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Powiedz, że się trochę spóźnisz
    gloss: Trochę się spóźnię.
    note: '*یکم دیر می‌شه* zawiera potoczne *یکم* („trochę”) i *دیر* („późno”, „spóźniony”).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar pyta o godzinę jutrzejszego spotkania
    gloss: Negar pyta, o której jest jutrzejsze spotkanie.
    note: قرار فردا ساعت چنده؟ łączy pytanie o spotkanie z lekcji 5 ze słowem فردا („jutro”).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash odpowiada niepewnie
    gloss: Arash mówi, że chyba o czwartej.
    note: فکر کنم („chyba”, „myślę, że”) łagodzi odpowiedź, bo Arash nie jest do końca pewien.
  fa.a1.unit09.lesson06.teach.turn03:
    title: 'Negar dopytuje: rano czy po południu'
    gloss: Negar pyta, czy chodzi o czwartą po południu, czy rano.
    note: To pytanie usuwa niejednoznaczność, bo samo ساعت چهار nie mówi, o którą czwartą chodzi.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash wyjaśnia
    gloss: 'Arash mówi: po południu.'
    note: Odpowiedź jednym słowem jest naturalna, gdy pytanie wyjaśniło już kontekst.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar się zgadza i zmienia godzinę przyjścia
    gloss: Negar się zgadza i mówi, że przyjdzie o czwartej piętnaście.
    note: ساعت چهار و ربع łączy godzinę ze słowem ربع („kwadrans”).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash pyta, dlaczego dodatkowy kwadrans
    gloss: Arash pyta, dlaczego mówi o kwadransie po czwartej.
    note: '*چرا ربع؟* to krótki sposób zapytania: „Dlaczego kwadrans?”'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar tłumaczy, że trochę się spóźni
    gloss: Negar tłumaczy, że trochę się spóźni, bo wychodzi z pracy.
    note: '*چون* („ponieważ”) wprowadza powód, tu z użyciem *یکم دیر می‌شه* („trochę się spóźnię”), które poznałeś w tej lekcji.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash uspokaja Negar
    gloss: 'Arash mówi: dobrze, nie ma problemu.'
    note: مشکلی نیست („nie ma problemu”) zapewnia Negar, że małe spóźnienie nie szkodzi.
