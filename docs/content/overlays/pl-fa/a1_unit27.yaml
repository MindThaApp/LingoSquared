    title: Nima
    gloss: Nima
    note: '*نیما*, postać znana już z lekcji 11, wraca tutaj.'
    example_gloss: Nima lubi sport.
  fa.a1.unit27.lesson05.teach.dare_review:
    title: On/ona ma / lubi
    gloss: on/ona ma / lubi
    note: '*داره* to forma 3. osoby. W zwrocie *ورزش دوست داره* znaczy „on/ona lubi sport”.'
  fa.a1.unit27.lesson05.teach.mikone_review:
    title: On/ona robi
    gloss: on/ona robi
    note: '*می‌کنه*, które pojawiło się już w tekście do czytania w lekcji 24, to potoczna forma 3. osoby od *می‌کنم*.'
  fa.a1.unit27.lesson05.teach.mire_word:
    title: On/ona idzie
    gloss: on/ona idzie
    note: '*می‌ره* to potoczna forma 3. osoby tego samego czasownika co *می‌رم* („idę”) z lekcji 3.'
  fa.a1.unit27.lesson05.teach.ham_review:
    title: Też / także
    gloss: też / także
    note: '*هم* znaczy „też” lub „także”.'
  fa.a1.unit27.lesson05.teach.va_review:
    title: I / a
    gloss: i / a
    note: '*و* znaczy „i”. Używaliśmy go tak już w lekcjach 5, 14, 24, 25 i 26.'
  fa.a1.unit27.lesson05.teach.reading_text:
    title: 'Czytanie: Sporty Nimy'
    gloss: Nima lubi sport. Co tydzień trzy razy gra w piłkę nożną. Czasami chodzi też na basen i pływa.
    note: Ten tekst wykorzystuje wszystkie konstrukcje z lekcji 1–4 oraz *می‌ره* z lekcji 5. Prawie nie ma w nim nowego słownictwa, chodzi o rozpoznawanie znanych form w ciągłym tekście.
  fa.a1.unit27.lesson06.teach.dam_review:
    title: Mam / lubię
    gloss: mam / lubię
    note: '*دارم* wraca tutaj.'
  fa.a1.unit27.lesson06.teach.are_review:
    title: 'No'
    gloss: 'no'
    note: '*آره* to codzienne, potoczne słowo oznaczające „tak”.'
  fa.a1.unit27.lesson06.teach.tochi_review:
    title: A ty?
    gloss: a ty?
    note: '*تو چی؟* wraca tutaj, by zadać pytanie zwrotne. Samo *تو* to nieformalne „ty”.'
  fa.a1.unit27.lesson06.teach.chekhoob_review:
    title: Jak fajnie!
    gloss: jak fajnie!
    note: '*چه خوب!* to tutaj również naturalna reakcja.'
  fa.a1.unit27.lesson06.teach.miri_word:
    title: Chodzisz
    gloss: chodzisz / idziesz
    note: '*می‌ری* to nieformalna forma 2. osoby tego samego czasownika co *می‌رم* („idę”) z lekcji 3 i *می‌ره* („on/ona idzie”) z lekcji 5.'
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: Świetny / doskonały
    gloss: świetny / doskonały
    note: '*عالیه* to częsty potoczny sposób, by powiedzieć „świetnie” lub „doskonale”.'
    example_gloss: Ta siłownia jest świetna.
  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: 'Nima: Jaki sport lubisz?'
    gloss: Jaki sport lubisz?
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: 'Sara: Lubię pływać. Co tydzień chodzę trzy razy na basen. A ty?'
    gloss: Lubię pływać. Co tydzień chodzę trzy razy na basen. A ty?
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: 'Nima: Lubię piłkę nożną. Codziennie chodzę do parku i gram.'
    gloss: Lubię piłkę nożną. Codziennie chodzę do parku i gram.
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: 'Sara: Jak fajnie! Chodzisz też na siłownię?'
    gloss: Jak fajnie! Chodzisz też na siłownię?
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: 'Nima: Tak, czasami chodzę też na siłownię.'
    gloss: Tak, czasami chodzę też na siłownię.
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: 'Sara: Świetnie!'
    gloss: Świetnie!
