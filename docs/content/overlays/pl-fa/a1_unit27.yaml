teaching:
  fa.a1.unit27.lesson01.teach.man_review:
    title: Ja
    gloss: ja
    note: '*من*, które już dobrze znasz, wraca tu, gdy mówisz o własnym sporcie.'
  fa.a1.unit27.lesson01.teach.varzesh_review:
    title: Sport / ćwiczenia
    gloss: sport / ćwiczenia
    note: '*ورزش* to ogólne słowo oznaczające „sport” lub „ćwiczenia” i jest osią całej tej lekcji.'
    example_gloss: Ćwiczenia są dobre.
  fa.a1.unit27.lesson01.teach.mikonam_review:
    title: Robię
    gloss: robię
    note: '*می‌کنم* to czasownik „robić” – w tej lekcji używany, gdy mówisz o uprawianiu sportu.'
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: Piłka nożna
    gloss: piłka nożna
    note: '*فوتبال* wraca tu jako pierwszy sport w tej lekcji.'
    example_gloss: Piłka nożna to sport.
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: Gram w piłkę nożną
    gloss: Gram w piłkę nożną
    note: '*فوتبال بازی می‌کنم* znaczy „Gram w piłkę nożną” – *بازی* znaczy „gra / granie”.'
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: Koszykówka
    gloss: koszykówka
    note: '*بسکتبال* to powszechnie używane zapożyczenie oznaczające koszykówkę.'
    example_gloss: Lubię koszykówkę.
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: Gram w koszykówkę
    gloss: Gram w koszykówkę
    note: '*بسکتبال بازی می‌کنم* ma dokładnie taki sam wzór jak *فوتبال بازی می‌کنم* – wystarczy zmienić nazwę sportu.'
  fa.a1.unit27.lesson02.teach.volleyball_word:
    title: Siatkówka
    gloss: siatkówka
    note: '*والیبال* to powszechnie używane zapożyczenie oznaczające siatkówkę.'
    example_gloss: On/ona lubi siatkówkę.
  fa.a1.unit27.lesson02.teach.volleyball_bazi_mikonam_phrase:
    title: Gram w siatkówkę
    gloss: Gram w siatkówkę
    note: '*والیبال بازی می‌کنم* ma ten sam wzór *بازی می‌کنم* co piłka nożna i koszykówka.'
  fa.a1.unit27.lesson02.teach.shena_word:
    title: Pływanie
    gloss: pływanie
    note: '*شنا* znaczy „pływanie”. W odróżnieniu od piłki nożnej, koszykówki i siatkówki łączy się bezpośrednio z *می‌کنم*, a nie z *بازی می‌کنم*, bo nie jest grą w piłkę.'
    example_gloss: Lubię pływać.
  fa.a1.unit27.lesson02.teach.shena_mikonam_phrase:
    title: Pływam
    gloss: pływam
    note: '*شنا می‌کنم* znaczy „pływam”, dosłownie „robię pływanie”.'
  fa.a1.unit27.lesson02.teach.che_review:
    title: Co / jaki
    gloss: co / jaki
    note: '*چه* pojawia się tu w nowym wzorcu pytania.'
  fa.a1.unit27.lesson02.teach.doost_dari_review:
    title: Lubisz
    gloss: lubisz
    note: '*دوست داری* wraca tutaj w pytaniach o sport.'
  fa.a1.unit27.lesson02.teach.che_varzeshi_phrase:
    title: Jaki sport lubisz?
    gloss: jaki sport lubisz?
    note: '*چه ورزشی دوست داری؟* łączy *چه*, *ورزش* i końcówkę *-ی* (daje ona „jaki sport”) z *دوست داری*. To naturalny sposób, by zapytać, jaki sport ktoś lubi.'
  fa.a1.unit27.lesson03.teach.koja_review:
    title: Gdzie
    gloss: gdzie
    note: '*کجا* działa tu tak samo, gdy pytamy o miejsce uprawiania sportu.'
  fa.a1.unit27.lesson03.teach.koja_varzesh_mikoni_phrase:
    title: Gdzie uprawiasz sport?
    gloss: gdzie uprawiasz sport?
    note: '*کجا ورزش می‌کنی؟* łączy *کجا* z *ورزش* i formą 2. osoby od *می‌کنم*.'
  fa.a1.unit27.lesson03.teach.mieram_review:
    title: Idę
    gloss: idę
    note: '*می‌رم* wraca tutaj w zdaniach o chodzeniu w miejsca do uprawiania sportu.'
  fa.a1.unit27.lesson03.teach.bashgah_word:
    title: Siłownia
    gloss: siłownia
    note: '*باشگاه* znaczy „siłownia” lub „klub”. Tak jak we wzorcu *می‌رم سینما* z lekcji 24 nie potrzeba przyimka: wystarczy *می‌رم* + miejsce.'
    example_gloss: Chodzę na siłownię.
  fa.a1.unit27.lesson03.teach.estakhr_word:
    title: Basen
    gloss: basen
    note: '*استخر* znaczy „basen pływacki”.'
    example_gloss: Idę na basen i pływam.
  fa.a1.unit27.lesson03.teach.park_word:
    title: Park
    gloss: park
    note: '*پارک* to bezpośrednie zapożyczenie, czyli „park”.'
    example_gloss: Idę do parku i gram w piłkę nożną.
  fa.a1.unit27.lesson04.teach.har_rooz_review:
    title: Codziennie
    gloss: codziennie
    note: '*هر روز* wraca tutaj w zdaniach o częstotliwości uprawiania sportu.'
  fa.a1.unit27.lesson04.teach.har_hafte_review:
    title: Co tydzień
    gloss: co tydzień
    note: '*هر هفته* wraca tutaj.'
  fa.a1.unit27.lesson04.teach.gahi_review:
    title: Czasami
    gloss: czasami
    note: '*گاهی* wraca tutaj.'
  fa.a1.unit27.lesson04.teach.baar_word:
    title: Raz / liczba razów
    gloss: raz / razy
    note: '*بار* to słowo liczące oznaczające „raz” lub „razy”. Używa się go z liczbą, by powiedzieć, jak często coś się robi.'
    example_gloss: Ćwiczę raz.
  fa.a1.unit27.lesson04.teach.do_se_review:
    title: Dwa / trzy
    gloss: dwa / trzy
    note: '*دو* i *سه* służą tu do liczenia, ile razy.'
  fa.a1.unit27.lesson04.teach.do_baar_phrase:
    title: Dwa razy
    gloss: dwa razy
    note: '*دو بار* łączy *دو* („dwa”) z *بار*: „dwa razy”.'
  fa.a1.unit27.lesson04.teach.se_baar_phrase:
    title: Trzy razy
    gloss: trzy razy
    note: '*سه بار* łączy *سه* („trzy”) z *بار*: „trzy razy”.'
  fa.a1.unit27.lesson04.teach.har_hafte_do_baar_phrase:
    title: Ćwiczę dwa razy w tygodniu
    gloss: ćwiczę dwa razy w tygodniu
    note: '*هر هفته دو بار ورزش می‌کنم* łączy wszystko z tej lekcji: „co tydzień”, „dwa razy” i „ćwiczę”.'
