course:
  title: Perski (farsi) A1
  description: 'Perski (irański) dla początkujących: nazywanie sportów (piłka nożna, koszykówka, siatkówka, pływanie), pytanie „Jaki sport lubisz?”, mówienie, gdzie uprawiasz sport (siłownia, basen, park), mówienie o częstotliwości (codziennie, co tydzień, czasami, N razy), krótki tekst do czytania o sportowej rutynie نیما oraz końcowy dialog między نیما i سارا, w którym porównują, jakie sporty uprawiają, jak często i gdzie.'
