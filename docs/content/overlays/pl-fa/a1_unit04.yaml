    title: Zdjęcie rodzinne
teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Matka
    gloss: matka
    note: مادر to neutralne, pisane i oficjalne słowo oznaczające matkę.
    example_gloss: Moja mama jest życzliwa.
  fa.a1.unit04.lesson01.teach.maman:
    title: Mama
    gloss: mama
    note: مامان to codzienne słowo mówione, którego używa większość rodzin.
    example_gloss: Mamo, jestem głodny.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Ojciec
    gloss: ojciec
    note: پدر to neutralne, pisane i oficjalne słowo oznaczające ojca.
    example_gloss: Mój ojciec jest lekarzem.
  fa.a1.unit04.lesson01.teach.baba:
    title: Tata
    gloss: tata
    note: بابا to codzienne słowo mówione, którego używa większość rodzin.
    example_gloss: Tato, gdzie jesteś?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Brat
    gloss: brat
    note: برادر; potoczna, pieszczotliwa forma داداش pojawi się później w tej lekcji.
    example_gloss: Mam jednego brata.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Siostra
    gloss: siostra
    note: خواهر to standardowe słowo oznaczające siostrę.
    example_gloss: Moja siostra jest studentką.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Słowa oficjalne i codzienne
    gloss: Mama i tata znaczą to samo co matka i ojciec, ale są mniej oficjalne.
    note: 'W perskim są dwa rzeczywiste rejestry nazw rodziców, bez ostrego podziału na oficjalny i nieoficjalny: مامان/بابا to słowa, którymi większość ludzi nazywa własnych rodziców, nawet w grzecznym towarzystwie.'
  fa.a1.unit04.lesson02.teach.daram:
    title: Mam
    gloss: mam
    note: '*دارم* to forma 1. osoby od *داشتن* („mieć”) – podstawowego czasownika przy opisywaniu rodziny.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Jeden
    gloss: jeden
    note: یک stoi przed policzalnym rzeczownikiem, np. یک برادر (jeden brat).
    example_gloss: Mam jedną siostrę.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: Mam jednego brata.
    gloss: Mam jednego brata.
    note: 'Szyk zdania: podmiot, liczba + rzeczownik, czasownik – typowy perski szyk SOV.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: Nie mam siostry.
    gloss: Nie mam siostry.
    note: ندارم to zaprzeczenie od دارم; osobne słowo oznaczające „jakiś” nie jest potrzebne.
  fa.a1.unit04.lesson02.teach.family_big:
    title: Moja rodzina jest duża.
    gloss: Moja rodzina jest duża.
    note: بزرگه to potoczna, skrócona forma od „بزرگ است” („jest duży”).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Nasza rodzina jest mała.
    gloss: Nasza rodzina jest mała.
    note: کوچیکه to potoczna, skrócona forma od „کوچک است” („jest mały”), z mówioną wymową کوچیک zamiast pisanego کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Dziadek
    gloss: dziadek
    note: پدربزرگ, dosłownie „duży ojciec” – dotyczy dziadka ze strony ojca i matki.
    example_gloss: Mój dziadek jest stary.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Babcia
    gloss: babcia
    note: مادربزرگ, dosłownie „duża matka” – dotyczy babci ze strony ojca i matki.
    example_gloss: Moja babcia jest życzliwa.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Wujek ze strony ojca
    gloss: wujek (brat ojca)
    note: عمو oznacza konkretnie brata ojca, nie jest ogólnym słowem „wujek”.
    example_gloss: Mój wujek mieszka w Teheranie.
  fa.a1.unit04.lesson03.teach.amme:
    title: Ciotka ze strony ojca
    gloss: ciotka (siostra ojca)
    note: عمه oznacza konkretnie siostrę ojca.
    example_gloss: Moja ciocia jest nauczycielką.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Wujek ze strony matki
    gloss: wujek (brat matki)
    note: دایی oznacza konkretnie brata matki – perski rozróżnia, z której strony rodziny pochodzi każda ciotka i każdy wujek.
    example_gloss: Mój wujek (brat matki) jest inżynierem.
  fa.a1.unit04.lesson03.teach.khale:
    title: Ciotka ze strony matki
    gloss: ciotka (siostra matki)
    note: خاله oznacza konkretnie siostrę matki.
    example_gloss: Moja ciocia (siostra matki) mieszka w Isfahanie.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Strona ojca i strona matki
    gloss: Wujek i ciotka ze strony ojca należą do rodziny ojca; wujek i ciotka ze strony matki – do rodziny matki.
    note: Ten poczwórny podział (عمو/عمه oraz دایی/خاله) odpowiada polskim słowom „wujek” i „ciotka”, ale perski za każdym razem wskazuje stronę rodziny.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Ile
    gloss: ile
    note: چند تا używa się przed nieformalnym liczeniem osób lub rzeczy.
    example_gloss: Ile masz sióstr?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Ile macie rodzeństwa? (grzecznie)
    gloss: Ile masz rodzeństwa?
    note: دارید to grzeczna forma liczby mnogiej od „mieć”, pasująca do شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Ile masz rodzeństwa? (nieformalnie)
    gloss: Ile masz rodzeństwa?
    note: داری to nieformalna forma liczby pojedynczej, używana wobec rówieśnika lub kogoś młodszego.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Ile osób liczy twoja rodzina?
    gloss: Ile osób liczy wasza rodzina?
    note: نفر to słowo liczące osoby; نفرن to potoczna, skrócona forma od „نفر هستند” („są … osobami”).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Jest nas czworo: ja, moja mama, mój tata i mój brat.'
    gloss: 'Jest nas czworo: ja, moja mama, mój tata i mój brat.'
    note: نفریم = „نفر هستیم” („jesteśmy … osobami”) w skróconej formie, w rejestrze mówionym.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Mąż
    gloss: mąż
    note: شوهر to standardowe słowo oznaczające męża.
    example_gloss: Mój mąż jest inżynierem.
  fa.a1.unit04.lesson05.teach.zan:
    title: Żona
    gloss: żona
    note: زن znaczy też ogólnie „kobieta”; znaczenie wynika z kontekstu.
    example_gloss: Moja żona jest nauczycielką.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Żonaty / zamężna
    gloss: żonaty / zamężna
    note: متأهل to neutralny, powszechnie używany przymiotnik określający stan cywilny.
    example_gloss: Jest żonaty / zamężna.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Stanu wolnego
    gloss: stanu wolnego (niezamężna / nieżonaty)
    note: مجرد to standardowe słowo oznaczające osobę niezamężną lub nieżonatą.
    example_gloss: Jestem singlem / singielką.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Jestem singlem / singielką.
    gloss: Jestem singlem / singielką.
    note: مجردم = مجرد + م („jestem”), ten sam wzorzec końcówki 1. osoby co w خوبم („jestem dobrze”).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Jestem żonaty / zamężna.
    gloss: Jestem żonaty / zamężna.
    note: متأهلم = متأهل + م („jestem”), ten sam wzorzec co w مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Wnuk / wnuczka
    gloss: wnuk / wnuczka
    note: نوه oznacza wnuka lub wnuczkę – w perskim nie trzeba tu określać płci.
    example_gloss: Ma jedno wnuczę.
  fa.a1.unit04.lesson05.teach.example:
    title: Mój brat jest żonaty; ma jednego syna.
    gloss: Mój brat jest żonaty; ma jednego syna.
    note: متأهله = „متأهل است” („jest żonaty”) w formie skróconej, rejestr mówiony; داره = „دارد” („ma”) w rejestrze mówionym.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: Czy to wasze zdjęcie rodzinne?
    gloss: Czy to twoje zdjęcie rodzinne?
    note: خانواده‌ته = „خانواده‌ی تو است” („to twoja rodzina”) w formie skróconej – bardzo częsty wzorzec mówiony.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Tak. To jest moja mama, a to mój tata.
    gloss: Tak. To moja mama, a to mój tata.
    note: '*آره* to potoczne „tak” (formalnie: *بله*). *مامانمه* to *مامانم* („moja mama”) z potoczną końcówką oznaczającą „jest”.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Kim jest ten pan?
    gloss: Kim jest ten pan?
    note: کیه to skrócona, potoczna forma od „کی است” (kim jest).
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: To mój brat. Mam jednego brata, nie mam siostry.
    gloss: To mój brat. Mam jednego brata, nie mam siostry.
    note: داداش to czuła, codzienna nazwa brata, używana tu zamiast bardziej neutralnego برادر z lekcji 1.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 'Moja rodzina jest odwrotna: mam dwie siostry, nie mam brata.'
    gloss: 'Moja rodzina jest odwrotna: mam dwie siostry, nie mam brata.'
    note: برعکسه to skrócone „برعکس است” (jest odwrotna).
  fa.a1.unit04.lesson06.teach.closing:
    title: No to u ciebie w rodzinie też jest gwarno!
    gloss: No to u ciebie w rodzinie też jest gwarno!
    note: شلوغه to skrócone „شلوغ است” (jest tłoczno/gwarno). To ciepły, częsty sposób opisania rodziny z kilkorgiem dzieci.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Rejestr formalny: ma / nie ma / jest'
    gloss: 'Mowa potoczna: ma, nie ma. Formalny język pisany: ma, nie ma; on jest moim bratem.'
    note: دارد/ندارد/است to formalne, pisane odpowiedniki potocznych form داره/نداره używanych w tym dialogu. Zwróć uwagę, że w formalnym piśmie czułe داداش zastępuje też neutralne برادر.
