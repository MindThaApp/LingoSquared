    gloss: trochę później
    note: یه‌کم دیرتر znaczy „trochę później” i służy do porównania dwóch planów dnia.
  fa.a1.unit11.lesson06.teach.turn01:
    title: O której godzinie budzisz się codziennie?
    gloss: O której godzinie budzisz się codziennie?
    note: Sara zaczyna od pytania Nimy o godzinę budzenia się.
  fa.a1.unit11.lesson06.teach.turn02:
    title: Budzę się o siódmej. A ty?
    gloss: Budzę się o siódmej. A ty?
    note: Nima odpowiada i zwraca pytanie do Sary.
  fa.a1.unit11.lesson06.teach.turn03:
    title: Ja trochę później, o ósmej.
    gloss: Ja trochę później, o ósmej.
    note: Sara porównuje swoją godzinę budzenia się z godziną Nimy.
  fa.a1.unit11.lesson06.teach.turn04:
    title: Co robisz po przebudzeniu?
    gloss: Co robisz po przebudzeniu?
    note: Nima pyta o kolejny punkt w planie dnia Sary.
  fa.a1.unit11.lesson06.teach.turn05:
    title: Jem śniadanie i idę do pracy. Wieczorem zwykle chodzę spać o jedenastej.
    gloss: Jem śniadanie i idę do pracy. Wieczorem zwykle chodzę spać o jedenastej.
    note: Sara opisuje resztę swojego dnia w jednej wypowiedzi, zgodnie z godzinami budzenia się i zasypiania z tej lekcji.
  fa.a1.unit11.lesson06.teach.third_person_forms:
    title: On/ona budzi się, on/ona idzie spać
    gloss: on/ona budzi się, on/ona idzie spać
    note: بیدار می‌شه i می‌خوابه to formy 3. osoby (او). Przydają się, gdy opowiadasz, co robi Sara lub Nima, w odróżnieniu od form 1. osoby (بیدار می‌شم، می‌خوابم) użytych wcześniej w tej lekcji.
