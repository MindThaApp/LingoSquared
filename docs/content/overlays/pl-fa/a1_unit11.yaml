    note: '*صبح*, *ظهر*, *عصر* i *شب* to cztery pory dnia, powtórzone z lekcji 9.'
    example_gloss:
    - Rano się budzę.
    - W południe jem obiad.
    - Pracuję po południu.
    - W nocy śpię.
  fa.a1.unit11.lesson03.teach.night_routine:
