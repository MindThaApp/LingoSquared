    title: Tekst o codziennym planie dnia
    gloss: Codziennie budzę się o siódmej. Potem jem śniadanie i idę do pracy.
    note: To spójny opis porannej rutyny, w którym użyto هر روز i بعدش, by uporządkować kolejność czynności.
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: A ty?
    gloss: A ty?
