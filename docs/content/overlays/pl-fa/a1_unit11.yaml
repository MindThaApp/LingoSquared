teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: Budzę się
    gloss: budzę się
    note: بیدار می‌شم to potoczna, teherańska forma od بیدار می‌شوم.
    example_gloss: Codziennie budzę się o siódmej.
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: Jem śniadanie
    gloss: jem śniadanie
    note: صبحونه می‌خورم używa potocznego słowa صبحونه („śniadanie”), a nie bardziej formalnego صبحانه.
    example_gloss: Jem śniadanie i idę do pracy.
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: Idę do pracy
    gloss: idę do pracy
    note: میرم سر کار to forma potoczna od می‌روم سر کار.
    example_gloss: Potem idę do pracy.
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: Idę spać
    gloss: idę spać
    note: 'می‌خوابم znaczy: śpię / idę spać.'
    example_gloss: Wieczorem wcześnie idę spać.
  fa.a1.unit11.lesson01.teach.va_word:
    title: I
    gloss: i
    note: '*و* to najczęstszy spójnik łączący czynności dnia codziennego, znany już z lekcji 9.'
    example_gloss: Budzę się i jem śniadanie.
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: O której się budzisz?
    gloss: O której się budzisz?
    note: '*ساعت چند بیدار می‌شی؟* zawiera zwrot *ساعت چند* (o której godzinie) z lekcji o podawaniu czasu w lekcji 9.'
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: Budzę się o siódmej.
    gloss: Budzę się o siódmej.
    note: ساعت هفت بیدار می‌شم podaje konkretną godzinę budzenia się.
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: Codziennie
    gloss: codziennie
    note: هر روز znaczy „codziennie” i pokazuje, że czynność jest regularna.
