    note: قهوه znaczy „kawa”.
    example_gloss: Lubię kawę.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Herbata
    gloss: herbata
    note: چای znaczy „herbata”.
    example_gloss: Nie lubię herbaty.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: nie lubię
    gloss: nie lubię
    note: دوست ندارم to zaprzeczenie wyrażenia دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: Ja
    gloss: ja
    note: من znaczy „ja” – często można je pominąć, bo końcówka czasownika już wskazuje podmiot, ale można go użyć dla podkreślenia.
    example_gloss: Lubię muzykę.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Który
    gloss: który
    note: کدوم znaczy „który” (z kilku).
    example_gloss: Który lubisz?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: Muzyka
    gloss: muzyka
    note: موسیقی znaczy „muzyka”.
    example_gloss: Lubię muzykę.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Chcesz
    gloss: chcesz
    note: می‌خوای to potoczna, nieformalna forma 2. osoby od می‌خواهی („chcesz”).
    target_text: می‌خوای (chcesz, nieformalnie)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Który lubisz?
    gloss: Który lubisz?
    note: کدوم رو دوست داری؟ – رو oznacza dopełnienie (potocznie, w piśmie را), a داری to forma 2. osoby czasownika داشتن („mieć”).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Bardziej
    gloss: bardziej
    note: بیشتر znaczy „bardziej” lub „więcej”.
    example_gloss: Bardziej lubię kawę.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Lub
    gloss: lub
    note: یا znaczy „lub” / „albo” i służy do zaproponowania wyboru między dwiema rzeczami.
    target_text: یا (lub)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Kawa czy herbata?
    gloss: Kawa czy herbata?
    note: قهوه یا چای؟ oferuje wybór między dwoma napojami poznanymi w lekcji 1.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Ponieważ
    gloss: ponieważ / bo
    note: چون wprowadza powód.
    target_text: چون (ponieważ)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: Jest pyszne
    gloss: jest pyszne
    note: خوشمزه‌ست to potoczne zestawienie z خوشمزه است („jest pyszne”).
    example_gloss: Kawa jest pyszna.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: Jest ciekawe
    gloss: jest ciekawe
    note: جالبه to potoczne zestawienie z جالب است („jest ciekawe”).
    example_gloss: Ta muzyka jest ciekawa.
  fa.a1.unit14.lesson04.teach.va_word:
    title: I
    gloss: i
    note: '*و* znaczy „i” i może łączyć dwa krótkie zdania, np. że coś lubimy i jak to opisujemy. Jest luźniejsze niż *چون* („ponieważ”), które podaje powód wprost.'
    target_text: و (i)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Popularne irańskie imię żeńskie.
    example_gloss: Sara lubi herbatę.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: On/ona lubi
    gloss: on/ona lubi
    note: داره to potoczna forma 3. osoby od دارد („ma”) – دوست داره znaczy „on/ona lubi”, tak jak دوست دارم w 1. osobie.
    target_text: دوست داره (on/ona lubi, 3. osoba potocznie)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: On/ona nie lubi
    gloss: on/ona nie lubi
    note: نداره to potoczna forma przecząca 3. osoby – دوست نداره znaczy „on/ona nie lubi”.
    target_text: دوست نداره (on/ona nie lubi, 3. osoba potocznie)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: Jest ciepła
    gloss: jest ciepła
    note: گرمه to potoczne zestawienie z گرم است („jest ciepłe”).
    example_gloss: Herbata jest ciepła.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Przykładowy tekst o preferencjach
    gloss: Sara lubi herbatę, bo jest ciepła. Sara nie lubi muzyki.
    note: Krótka relacja w 3. osobie, łącząca słownictwo o preferencjach z tej lekcji.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima i Sara
    gloss: Nima, Sara
    note: Popularne irańskie imiona, które pojawiają się w całym kursie.
    example_gloss:
    - Nima lubi herbatę.
    - Sara lubi kawę.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: A ty?
    gloss: A ty?
    note: تو چی؟ to krótki, częsty sposób, by odwrócić pytanie do rozmówcy.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: Świetnie
    gloss: świetnie
    note: عالیه to potoczne zestawienie z عالی است („jest świetne”).
    example_gloss: To jest świetne.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima pyta
    gloss: Herbata czy kawa – którą lubisz bardziej?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara odpowiada
    gloss: Bardziej lubię kawę, bo jest pyszna. A ty?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima odpowiada
    gloss: Lubię herbatę, bo jest ciepła.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara reaguje
    gloss: Świetnie!
