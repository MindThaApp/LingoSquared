course:
  title: Perski (farsi) A1
  description: 'Perski irański (farsi) dla początkujących: nauka czytania pisma, rozumienie codziennej mowy i grzeczne radzenie sobie w praktycznych rozmowach.'
units:
  fa.a1.unit01.greetings:
    title: Powitania i pierwsze spotkania
lessons:
  fa.a1.unit01.lesson01.script_ramp:
    title: Przeczytaj swoje pierwsze perskie słowo
  fa.a1.unit01.lesson02.everyday_greetings:
    title: Codzienne powitania
  fa.a1.unit01.lesson03.time_and_farewells:
    title: Powitania i pożegnania w ciągu dnia
  fa.a1.unit01.lesson04.formal_informal_wellbeing:
    title: Uprzejma i nieformalna rozmowa na co dzień
  fa.a1.unit01.lesson05.taarof_basics:
    title: Pierwsze spojrzenie na taarof
  fa.a1.unit01.lesson06.first_meeting_dialogue:
    title: Dialog z pierwszego spotkania
teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Perski pisze się od prawej do lewej
    gloss: Po persku pisze się od prawej do lewej.
    note: Czytaj po persku od prawej krawędzi w stronę lewej.
  fa.a1.unit01.lesson01.teach.seen:
    title: Litera س
    gloss: s
    note: س zwykle oznacza dźwięk s.
  fa.a1.unit01.lesson01.teach.lam:
    title: Litera ل
    gloss: l
    note: ل oznacza dźwięk l i łączy się z sąsiednimi literami.
  fa.a1.unit01.lesson01.teach.alef:
    title: Litera ا
    gloss: ā / a
    note: ا często oznacza długie ā i nie łączy się z następną literą.
  fa.a1.unit01.lesson01.teach.mim:
    title: Litera م
    gloss: m
    note: م oznacza dźwięk m i zmienia kształt po połączeniu z innymi literami.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Ułóż słowo سلام
    gloss: cześć
    note: سلام czyta się salâm. Krótkie samogłoski zwykle pomija się w zapisie perskim.
    example_gloss: Cześć! Jestem Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Cześć
    gloss: cześć
    note: سلام pasuje zarówno w sytuacjach formalnych, jak i nieformalnych.
    example_gloss: Cześć, jak się masz?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Dzień dobry (rano)
    gloss: dzień dobry (rano)
    note: صبح بخیر to neutralne, uprzejme powitanie poranne.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Dzień dobry po południu / dobry wieczór
    gloss: dzień dobry (po południu) / dobry wieczór
    note: عصر بخیر mówi się od późnego popołudnia do wieczora.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Do widzenia
    gloss: do widzenia
    note: خداحافظ czyta się khodâhâfez; to standardowe, ogólne pożegnanie.
    example_gloss: Do widzenia, do zobaczenia później!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Dziękuję
    gloss: dziękuję
    note: ممنون jest częste i naturalne; متشکرم jest nieco bardziej formalne.
    example_gloss: Bardzo dziękuję.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: Proszę / nie ma za co
    gloss: nie ma za co
    note: خواهش می‌کنم to zwyczajowa odpowiedź na podziękowanie.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Jak się Pan/Pani czuje? Uprzejma forma mówiona
    gloss: Jak się Pan/Pani miewa?
    note: حالتون چطوره؟ to neutralna, uprzejma forma mówiona w irańskim perskim. حال شما چطور است؟ to jej bardziej formalny lub pisany odpowiednik.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: Dobrze się czuję
    gloss: czuję się dobrze
    note: خوبم łączy خوب z końcówką pierwszej osoby ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Dzień dobry
    gloss: dzień dobry
    note: روز بخیر jest uprzejme, ale w swobodnej mowie używa się go rzadziej niż سلام.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Dobranoc
    gloss: dobranoc
    note: شب بخیر to zwykle pożegnanie lub życzenie na dobranoc, a nie powitanie na początek rozmowy.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Witaj
    gloss: witaj / witamy
    note: خوش آمدید to uprzejma forma używana wobec jednego gościa lub kilku gości.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Do zobaczenia
    gloss: mam nadzieję, że do zobaczenia / do następnego spotkania
    note: به امید دیدار to wytworne, neutralnie uprzejme pożegnanie.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Na razie
    gloss: na razie
    note: فعلاً jest potoczne i mniej formalne niż خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Miłego dnia
    gloss: miłego dnia
    note: باشید oznacza w tym stałym pożegnaniu formę grzecznościową.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Neutralnie uprzejma forma mówiona
    gloss: Jak się Pan/Pani miewa?
    note: Użyj حالتون چطوره؟ wobec nieznajomego dorosłego lub w zwykłej uprzejmej rozmowie. Wyraźnie formalna lub pisana forma to حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Nieformalnie
    gloss: Jak się Pan/Pani miewa?
    note: چطوری؟ jest potoczne i pasuje do przyjaciół, rodziny i rówieśników, gdy relacja na to pozwala.
  fa.a1.unit01.lesson04.teach.to:
    title: Nieformalne „ty”
    gloss: ty
    note: تو jest w liczbie pojedynczej i nieformalne; nie używaj go automatycznie wobec nieznajomego dorosłego.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Bardzo dobrze
    gloss: czuję się bardzo dobrze
    note: خیلی wzmacnia خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Nieźle
    gloss: nie najgorzej, dziękuję
    note: بد نیستم to naturalna, umiarkowana odpowiedź, a nie narzekanie.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: A Pan/Pani? Uprzejmie
    gloss: A Pan/Pani?
    note: Użyj شما چطور؟, aby uprzejmie zadać to samo pytanie z powrotem.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: A ty? Nieformalnie
    gloss: A Pan/Pani?
    note: تو چطور؟ pasuje do nieformalnej relacji.
  fa.a1.unit01.lesson05.teach.chai:
    title: Herbata
    gloss: herbata
    note: '*چای* to napój. Usłyszysz to słowo w propozycji *چای بفرمایید* (proszę, herbata).'
    example_gloss: Proszę, czy napije się Pan/Pani herbaty?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Proszę
    gloss: proszę / proszę bardzo / oto, proszę
    note: '*بفرمایید* zmienia znaczenie zależnie od sytuacji: może znaczyć „proszę” przy podawaniu herbaty, „proszę wejść” przy drzwiach albo „proszę przodem”.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Jest Pan/Pani bardzo uprzejmy/uprzejma
    gloss: to bardzo uprzejme z Pana/Pani strony
    note: لطف دارید to uprzejma odpowiedź na komplement.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Proszę sobie nie robić kłopotu
    gloss: proszę sobie nie robić kłopotu
    note: زحمت نکشید może być szczerą odmową albo uprzejmą pierwszą odpowiedzią na konkretną propozycję.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Dziękuję za Pana/Pani uprzejmość
    gloss: dziękuję za Pana/Pani uprzejmość
    note: To cieplejsze i wyraźniejsze podziękowanie niż samo ممنون.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: irańskie zasady grzeczności zależne od kontekstu
    note: Taarof to zależne od kontekstu zasady proponowania, odmawiania, dziękowania i okazywania szacunku. Zwyczaje różnią się w zależności od relacji, pokolenia, regionu i sytuacji; żadna stała liczba odmów czy powtórzeń nie rozstrzyga, czy propozycja jest szczera.
  fa.a1.unit01.lesson06.teach.line01:
    title: Witaj
    gloss: Ali wita Nargis.
    note: Rozmowa zaczyna się od powitania, a dopiero potem następuje przedstawienie się.
  fa.a1.unit01.lesson06.teach.line02:
    title: Powitanie, odpowiedź
    gloss: Nargis odpowiada na powitanie i dziękuje.
    note: ممنون (dziękuję) to naturalna odpowiedź na powitanie.
  fa.a1.unit01.lesson06.teach.line03:
    title: Wymiana imion
    gloss: Ali mówi, kim jest.
    note: '*من علی هستم* znaczy „jestem Ali”. *هستم* („jestem”) stoi na końcu zdania.'
  fa.a1.unit01.lesson06.teach.line04:
    title: Wymiana imion, odpowiedź
    gloss: Nargis mówi, kim jest.
    note: Ten sam wzorzec *من ... هستم*, którego użył Ali.
  fa.a1.unit01.lesson06.teach.line05:
    title: Miło mi poznać
    gloss: Ali mówi, że miło mu ją poznać.
    note: '*خوشوقتم* znaczy „jest mi miło”. Z *از آشنایی با شما* tworzy standardową uprzejmą formułę na powitanie nowo poznanej osoby.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Miło mi poznać, odpowiedź
    gloss: Nargis odwzajemnia uprzejmość.
    note: همین‌طور znaczy w tej odpowiedzi „podobnie” lub „wzajemnie”.
  fa.a1.unit01.lesson06.teach.line07:
    title: Zapytaj, jak ktoś się czuje
    gloss: Ali uprzejmie pyta, jak ona się czuje.
    note: Ali używa neutralnie uprzejmej formy mówionej z ـتون, bo to uprzejme pierwsze spotkanie.
  fa.a1.unit01.lesson06.teach.line08:
    title: Zapytaj, jak ktoś się czuje, odpowiedź
    gloss: Nargis odpowiada i zadaje to samo pytanie jemu.
    note: شما چطور؟ powtarza pytanie, by zadać je rozmówcy, co jest częstym skrótem.
  fa.a1.unit01.lesson06.teach.line09:
    title: Zaproszenie
    gloss: Ali mówi, że on też czuje się dobrze, i zaprasza Nargis do środka.
    note: '*بفرمایید داخل* znaczy „proszę wejść”. *داخل* („do środka”) pokazuje, co jest proponowane.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Uprzejma odmowa
    gloss: Nargis dziękuje, ale wyjaśnia, że musi iść.
    note: Uprzejma odmowa nadal zaczyna się od podziękowania, a dopiero potem następuje odmowa. *ولی باید برم* znaczy „ale muszę iść”.
  fa.a1.unit01.lesson06.teach.line11:
    title: Zakończenie rozmowy
    gloss: Ali przyjmuje jej odpowiedź i wyraża nadzieję na kolejne spotkanie.
    note: Odrzucone zaproszenie naturalnie prowadzi do pożegnania.
  fa.a1.unit01.lesson06.teach.line12:
    title: Zakończenie rozmowy, odpowiedź
    gloss: Nargis się żegna.
    note: '*خداحافظ* to standardowe, ogólne pożegnanie.'
exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
    instruction: Wybierz perskie słowo salâm.
    correct_option: سلام
    distractors:
    - سام
    - لام
    - ماس
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام to pełne zapisane słowo salâm.
  fa.a1.unit01.lesson01.exercise02.recognize_seen:
    instruction: Która litera oznacza dźwięk s?
    correct_option: س
    distractors:
    - ل
    - ا
    - م
    accepted_answers:
    - value: س
      status: correct
    feedback: س oznacza dźwięk s.
  fa.a1.unit01.lesson01.exercise03.recognize_lam:
    instruction: Która litera oznacza dźwięk l?
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: ل oznacza dźwięk l.
  fa.a1.unit01.lesson01.exercise04.build_salam:
    instruction: Ułóż litery w słowo سلام.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: Litery ułożone we właściwej kolejności tworzą słowo سلام.
  fa.a1.unit01.lesson01.exercise05.select_missing_lam:
    instruction: Wybierz brakującą literę perską.
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: Brakująca litera to ل.
  fa.a1.unit01.lesson01.exercise06.match_letters:
    instruction: Dopasuj każdą literę perską do jej przybliżonego dźwięku w piśmie łacińskim.
    accepted_answers:
    - value:
        س: s
        ل: l
        ا: ā
        م: m
      status: correct
    feedback: Te cztery skojarzenia składają się na słowo سلام.
    pairs:
    - left: س
      right: s
    - left: ل
      right: l
    - left: ا
      right: ā
    - left: م
      right: m
  fa.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: Czy to perskie słowo czyta się od prawej strony?
    correct_option: Tak
    distractors:
    - Nie
    accepted_answers:
    - value: Tak
      status: correct
    feedback: Pismo perskie czyta się od prawej do lewej.
  fa.a1.unit01.lesson01.exercise08.romanize_salam:
    instruction: Wpisz powszechnie używaną transliterację słowa سلام literami łacińskimi.
    answer_language_code: en
    accepted_answers:
    - value: salam
      status: correct
    - value: salâm
      status: correct
    - value: salām
      status: correct
    - value: salaam
      status: acceptable_with_note
      note: Popularna pisownia w alfabecie łacińskim.
    feedback: Forma kursowa to salâm; salam i salām są również akceptowane.
  fa.a1.unit01.lesson02.exercise01.recognize_salam_reading:
    instruction: Co oznacza to słowo?
    correct_option: cześć
    distractors:
    - do widzenia
    - dziękuję
    - dzień dobry (rano)
    accepted_answers:
    - value: cześć
      status: correct
    feedback: سلام znaczy „cześć”.
  fa.a1.unit01.lesson02.exercise02.recognize_morning_reading:
    instruction: Co oznacza to powitanie?
    correct_option: dzień dobry (rano)
    distractors:
    - dzień dobry (po południu) / dobry wieczór
    - do widzenia
    - cześć
    accepted_answers:
    - value: dzień dobry (rano)
      status: correct
    feedback: صبح بخیر to neutralne, uprzejme powitanie poranne.
  fa.a1.unit01.lesson02.exercise03.goodbye_meaning:
    instruction: Wybierz znaczenie słowa خداحافظ.
    correct_option: do widzenia
    distractors:
    - cześć
    - dziękuję
    - dobry wieczór
    accepted_answers:
    - value: do widzenia
      status: correct
    feedback: خداحافظ to standardowe, ogólne pożegnanie.
  fa.a1.unit01.lesson02.exercise04.recognize_evening_reading:
    instruction: Co oznacza to powitanie?
    correct_option: dzień dobry (po południu) / dobry wieczór
    distractors:
    - dzień dobry (rano)
    - do widzenia
    - cześć
    accepted_answers:
    - value: dzień dobry (po południu) / dobry wieczór
      status: correct
    feedback: عصر بخیر mówi się w późniejszej porze dnia.
  fa.a1.unit01.lesson02.exercise05.order_youre_welcome:
    instruction: Ułóż perskie słowa tworzące zwrot „proszę bardzo” (w odpowiedzi na podziękowanie).
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم to utarta odpowiedź na podziękowanie.
  fa.a1.unit01.lesson02.exercise06.reply_how_are_you:
    instruction: Odpowiedz uprzejmie zwrotem, którego się nauczyłeś.
    accepted_answers:
    - value: خوبم، ممنون
      status: correct
    - value: خوبم ممنون
      status: correct
    - value: خوبم، ممنونم
      status: correct
    - value: من خوبم، ممنون
      status: correct
    - value: خوبم. ممنون
      status: correct
    - value: خوبم ممنونم
      status: correct
    - value: من خوبم ممنون
      status: correct
    - value: من خوبم، ممنونم
      status: correct
    - value: خوبم، مرسی
      status: correct
    - value: خوبم، متشکرم
      status: correct
    - value: خوبم
      status: acceptable_with_note
      note: Poprawne, ale mniej kompletne towarzysko.
    feedback: خوبم، ممنون znaczy „Dobrze, dziękuję”.
  fa.a1.unit01.lesson02.exercise07.produce_thanks:
    instruction: 'Przetłumacz na perski: Dziękuję.'
    accepted_answers:
    - value: ممنون
      status: correct
    - value: ممنونم
      status: correct
    - value: متشکرم
      status: correct
    - value: مرسی
      status: acceptable_with_note
      note: Bardzo częste zapożyczenie w mowie potocznej.
    - value: خیلی ممنون
      status: acceptable_with_note
      note: Znaczy „dziękuję bardzo”.
    - value: ممنون از شما
      status: acceptable_with_note
      note: Nieco pełniejszy, uprzejmy sposób podziękowania.
    feedback: ممنون to cel tej lekcji; pozostałe warianty są również naturalne w irańskim perskim.
  fa.a1.unit01.lesson02.exercise08.romanize_goodbye:
    instruction: Wpisz powszechnie używaną transliterację słowa خداحافظ literami łacińskimi.
    answer_language_code: en
    accepted_answers:
    - value: khodahafez
      status: correct
    - value: khodâhâfez
      status: correct
    - value: khodāhāfez
      status: correct
    - value: khoda hafez
      status: correct
    - value: khodā hāfez
      status: correct
    - value: khodafez
      status: correct
    - value: khodâ hâfez
      status: correct
