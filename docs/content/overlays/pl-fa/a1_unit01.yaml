    accepted_answers:
    - value: ممنون
      status: correct
    - value: ممنونم
      status: correct
    - value: متشکرم
      status: correct
    - value: خیلی ممنون
      status: acceptable_with_note
      note: Naturalne, z dodatkowym podkreśleniem.
    - value: مرسی
