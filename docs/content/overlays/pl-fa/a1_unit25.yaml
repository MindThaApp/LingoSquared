course:
  title: Perski (farsi) A1
  description: 'Perski irański dla początkujących: opisywanie wzrostu (wysoki/niski), włosów (długość i kolor: czarne, blond), koloru oczu (brązowe, zielone, niebieskie) i tego, czy ktoś nosi okulary, pytanie „Jak on/ona wygląda?”, krótki tekst do czytania o wyglądzie نیما oraz dialog między نیما i سارا o rozpoznaniu przyjaciółki سارا, مریم.'
