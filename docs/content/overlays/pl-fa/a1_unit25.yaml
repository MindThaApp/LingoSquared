teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: On / ona
    gloss: on / ona
    note: '*او* wraca tutaj jako podmiot w opisach wyglądu.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Wzrost
    gloss: wzrost
    note: '*قد* pojawia się tu ponownie samodzielnie. *قدش* dodaje przyrostek dzierżawczy *-ش* (jego/jej wzrost), tak samo jak *امتحانش* w Unit 20.'
    example_gloss: Nima jest wysoki.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Wysoki
    gloss: wysoki
    note: '*بلند* znaczy „wysoki” (lub „długi”). *قدش بلنده* dosłownie znaczy „jego/jej wzrost jest wysoki” – to naturalny potoczny sposób, by powiedzieć, że ktoś jest wysoki.'
    example_gloss: Jest wysoki.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Niski
    gloss: niski
    note: '*کوتاه* znaczy „niski” (lub „krótki”).'
    example_gloss: Jest niski.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: Włosy
    gloss: włosy
    note: '*مو* znaczy „włosy”. *موی* to forma z ezafe (łącznikiem) używana przed przymiotnikiem, np. *موی بلند* (długie włosy).'
    example_gloss: Ma długie włosy.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Jego / jej włosy
    gloss: jego / jej włosy
    note: '*موهاش* łączy liczbę mnogą *موها* (włosy) z przyrostkiem dzierżawczym *-ش* – „jego/jej włosy”.'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Czarny
    gloss: czarny
    note: '*مشکی* to codzienne, potoczne słowo na czarne włosy i oczy – naturalniejsze tutaj niż *سیاه* z Unit 20, które lepiej pasuje do ubrań niż do włosów.'
    example_gloss: Ma czarne włosy.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Blond
    gloss: blond
    note: '*بلوند* (zapożyczenie) znaczy „blond”.'
    example_gloss: Ma blond włosy.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Oko
    gloss: oko
    note: '*چشم* znaczy „oko”. *چشمای* to potoczna forma liczby mnogiej z ezafe (oczy…), np. *چشمای آبی* (niebieskie oczy).'
    example_gloss: Ma brązowe oczy.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Jego / jej oczy
    gloss: jego / jej oczy
    note: '*چشماش* łączy potoczną liczbę mnogą *چشما* z przyrostkiem dzierżawczym *-ش* – „jego/jej oczy”. Zwróć uwagę, że *چشماش آبیه* ma końcówkę liczby pojedynczej *-ه*, choć *چشما* jest w liczbie mnogiej – w perskim to normalne: rzeczy (nie osoby) w liczbie mnogiej zwykle łączą się z czasownikiem w liczbie pojedynczej.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Brązowy
    gloss: brązowy
    note: '*قهوه‌ای* (dosłownie „kawowy”) znaczy „brązowy”.'
    example_gloss: Ma brązowe oczy.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Zielony
    gloss: zielony
    note: '*سبز* znaczy „zielony”.'
    example_gloss: Ma zielone oczy.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Niebieski
    gloss: niebieski
    note: '*آبی* wraca tutaj jako kolor oczu.'
    example_gloss: Ma niebieskie oczy.
  fa.a1.unit25.lesson04.teach.man_review:
    title: Ja
    gloss: ja
    note: '*من*, dobrze już znane, wraca tutaj w opisie samego siebie.'
    example_gloss: Mam brązowe włosy.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: Mam / on-ona ma
    gloss: mam / on-ona ma
    note: '*دارم*/*داره* działają tak samo przy cechach wyglądu: *موی مشکی دارم* znaczy „mam czarne włosy”.'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Okulary
    gloss: okulary
    note: '*عینک* znaczy „okulary”.'
    example_gloss: Nosi okulary.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: On/ona nosi
    gloss: on/ona nosi
    note: '*می‌زنه* (dosłownie „uderza”) to naturalny czasownik używany przy noszeniu okularów – *عینک می‌زنه* znaczy „nosi okulary”. To inny czasownik niż *می‌کنم* (robić) z Unit 8 i Unit 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: Jak on/ona wygląda?
    gloss: jak on/ona wygląda?
    note: '*چه شکلیه؟* dosłownie znaczy „jaki to kształt?” – to standardowy potoczny sposób zapytania, jak ktoś wygląda.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: I
    gloss: i
    note: '*و* znaczy „i” – było już używane w ten sposób w Unit 14 i Unit 24.'
    example_gloss: Jest wysoki i ma czarne włosy.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, postać znana już z Unit 11, wraca tutaj.'
    example_gloss: Nima jest przyjacielem Sary.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Czytanie: wygląd Nimy'
    gloss: Nima jest wysoki. Ma czarne włosy i brązowe oczy. Nosi okulary.
    note: Ten tekst powtarza wszystkie konstrukcje z lekcji 1–4 – prawie bez nowego słownictwa, chodzi o rozpoznawanie ich w spójnym tekście.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* to nowa postać – przyjaciółka سارا, której نیما jeszcze nie poznał.'
    example_gloss: Maryam jest przyjaciółką Sary.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Teraz
    gloss: teraz
    note: '*الان* wraca tutaj.'
    example_gloss: Maryam przychodzi teraz.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Przychodzi
    gloss: przychodzi
    note: '*میاد* to potoczna forma czasu teraźniejszego czasownika *آمدن* (przychodzić).'
    example_gloss: Maryam przychodzi teraz.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: Jakiego to koloru?
    gloss: jakiego to koloru?
    note: '*چه رنگیه؟* składa się z *چه* (co/jaki, z lekcji 4), *رنگی* (o jakimś kolorze, od *رنگ* + *-ی*) i *-ه* (jest) – „jakiego to koloru?”'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Dobrze, dziękuję
    gloss: dobrze, dziękuję
    note: '*باشه* i *ممنون*, oba poznane wcześniej, łączą się tu w naturalne zakończenie rozmowy.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara: Maryam przychodzi teraz.'
    gloss: Maryam przychodzi teraz.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima: Jak wygląda Maryam?'
    gloss: Jak wygląda Maryam?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara: Jest wysoka i ma czarne włosy.'
    gloss: Jest wysoka i ma czarne włosy.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima: Jakiego koloru są jej oczy?'
    gloss: Jakiego koloru są jej oczy?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara: Ma brązowe oczy.'
    gloss: Ma brązowe oczy.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima: Dobrze, dziękuję.'
    gloss: Dobrze, dziękuję.
