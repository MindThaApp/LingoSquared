    example_gloss: Poszedłem do restauracji.
  fa.a1.unit13.lesson01.teach.khordam_word:
    title: zjadłem / zjadłam
    gloss: zjadłem
    note: خوردم to czas przeszły prosty czasownika خوردن („jeść”), pierwsza osoba.
    example_gloss: Zjadłem obiad.
  fa.a1.unit13.lesson01.teach.didam_word:
    title: Zobaczyłem
    gloss: zobaczyłem
    note: دیدم to czas przeszły prosty czasownika دیدن („widzieć”), pierwsza osoba.
    example_gloss: Obejrzałem dobry film.
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: Kino
    gloss: kino
    note: سینما znaczy „kino”.
    example_gloss: Wczoraj poszedłem do kina.
  fa.a1.unit13.lesson02.teach.be_word:
    title: Do
    gloss: do, na
    note: به znaczy „do” i stoi przed miejscem, dokąd ktoś idzie.
    target_text: به (do, na)
  fa.a1.unit13.lesson02.teach.diruz_sinama_raftam:
    title: Wczoraj poszedłem do kina.
    gloss: Wczoraj poszedłem do kina.
    note: دیروز به سینما رفتم łączy słowa z tej lekcji w pełne zdanie.
  fa.a1.unit13.lesson03.teach.chikar_word:
    title: Co (jaka czynność)
    gloss: co (jaka czynność)
    note: چیکار (dosłownie „jaka praca/czynność”) służy do pytania, co ktoś robił.
    example_gloss: Co robiłeś wczoraj?
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: Zrobiłeś
    gloss: zrobiłeś
    note: کردی to czas przeszły prosty czasownika کردن („robić”), nieformalna druga osoba.
    example_gloss: Co zrobiłeś?
  fa.a1.unit13.lesson03.teach.question_phrase:
    title: Co robiłeś wczoraj?
    gloss: Co Pan/Pani robił(a) wczoraj?
    note: دیروز چیکار کردی؟ to potoczny, bardzo częsty sposób zapytania, co ktoś robił wczoraj.
  fa.a1.unit13.lesson04.teach.film_word:
