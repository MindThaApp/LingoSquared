    title: Zostałem w domu
    gloss: zostałem w domu
    note: خونه موندم znaczy „zostałem w domu”. Używa potocznej formy خونه („dom”).
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: A ty?
    gloss: a ty?
    note: تو چی؟ dosłownie znaczy „ty, co”. To naturalny sposób, by odbić pytanie.
