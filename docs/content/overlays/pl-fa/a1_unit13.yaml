    title: Co robiłeś wczoraj?
    gloss: Co Pan/Pani robił(a) wczoraj?
    note: Nima na początku pyta Sarę, co robiła wczoraj.
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: Poszłam do kina i obejrzałam dobry film. A ty?
    gloss: Poszłam do kina i obejrzałam dobry film. A ty?
    note: Sara odpowiada i odbija pytanie.
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: Zostałem w domu i czytałem książkę.
    gloss: Zostałem w domu i czytałem książkę.
    note: Nima opowiada o swoim dniu.
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: Świetnie!
    gloss: Świetnie!
    note: Sara reaguje pozytywnie i kończy rozmowę.
