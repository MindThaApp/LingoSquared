teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Sobota, niedziela
    gloss: sobota, niedziela
    note: شنبه i یکشنبه to pierwsze dwa dni irańskiego tygodnia, który zaczyna się w sobotę.
    example_gloss:
    - Dzisiaj jest sobota.
    - Jutro jest niedziela.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Poniedziałek, wtorek
    gloss: poniedziałek, wtorek
    note: دوشنبه i سه‌شنبه następują po شنبه i یکشنبه.
    example_gloss:
    - W poniedziałek mam zajęcia.
    - We wtorek mam spotkanie.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Środa, czwartek
    gloss: środa, czwartek
    note: چهارشنبه i پنجشنبه to dni w środku i pod koniec tygodnia.
    example_gloss:
    - W środę pracuję.
    - Zobaczymy się w czwartek.
  fa.a1.unit10.lesson01.teach.jome:
    title: Piątek
    gloss: piątek
    note: جمعه to ostatni dzień tygodnia i tradycyjny cotygodniowy dzień wolny w Iranie.
    example_gloss: Piątek jest dniem wolnym.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: Cotygodniowy dzień wolny
    gloss: Piątek to cotygodniowy dzień wolny.
    note: جمعه (piątek) to tradycyjny cotygodniowy dzień odpoczynku w Iranie, choć niektóre nowoczesne miejsca pracy zamykają też w czwartek po południu.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farwardin (1. miesiąc)
    gloss: Farwardin, pierwszy miesiąc irańskiego roku słonecznego
    note: فروردین rozpoczyna irański rok słoneczny, mniej więcej pod koniec marca (około wiosennej równonocy, czyli Nowruza).
    example_gloss: Farwardin to pierwszy miesiąc roku.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibeheszt (2. miesiąc)
    gloss: Ordibeheszt, drugi miesiąc
    note: اردیبهشت następuje po فروردین, mniej więcej od kwietnia do maja.
    example_gloss: W Ordibeheszcie pogoda jest ładna.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Chordad (3. miesiąc)
    gloss: Chordad, trzeci miesiąc
    note: خرداد następuje po اردیبهشت, mniej więcej od maja do czerwca.
    example_gloss: Urodziłem się w Chordadzie.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: Irański kalendarz słoneczny
    gloss: Iran używa kalendarza solarnego hidżry (perskiego).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* oznacza, że Iran używa tego kalendarza na co dzień. Ten sam system kalendarza stosuje Afganistan, ale z perskimi nazwami miesięcy, a nie z nazwami pochodzenia arabskiego.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Jaki dziś dzień tygodnia?
    gloss: Jaki dziś dzień tygodnia?
    note: 'امروز چندشنبه‌ست؟ dosłownie pyta: „dziś który dzień tygodnia?”. To potoczna forma ze skróceniem -e od چندشنبه است.'
  fa.a1.unit10.lesson03.teach.today_word:
    title: Dzisiaj
    gloss: dzisiaj
    note: امروز znaczy „dziś”.
    example_gloss: Którego dziś mamy?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Dziś jest czwartek, dziesiąty Ordibeheszt.
    gloss: Dziś jest czwartek, dziesiąty Ordibeheszt.
    note: امروز پنجشنبه، دهم اردیبهشته łączy w jednym zdaniu nazwę dnia, datę w liczebniku porządkowym i nazwę miesiąca, w potocznej formie ze skróceniem -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Data
    gloss: data
    note: '*تاریخ* znaczy „data” – ogólne słowo na datę kalendarzową, jak w *تاریخ جلسه* (data spotkania).'
    example_gloss: Jaka jest dzisiaj data?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: W który dzień jest spotkanie?
    gloss: W który dzień jest spotkanie?
    note: جلسه کدوم روزه؟ pyta, w który dzień tygodnia odbędzie się wydarzenie.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Którego Ordibeheszta jest wtorek?
    gloss: Którego Ordibeheszta jest wtorek?
    note: سه‌شنبه چندم اردیبهشته؟ pyta o konkretną datę liczbową wskazanego dnia.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: ósmy
    gloss: ósmy
    note: '*هشتم* znaczy „ósmy” (dzień miesiąca).'
    example_gloss: Dziś jest ósmy.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, w który dzień jest spotkanie?
    gloss: Reza, w który dzień jest spotkanie?
    note: Maryam zaczyna od bezpośredniego pytania do Rezy, zwracając się do niego po imieniu.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Chyba we wtorek.
    gloss: Chyba we wtorek.
    note: فکر کنم („chyba”, „myślę, że”) łagodzi odpowiedź Rezy, pokazując, że nie jest jej całkiem pewien.
  fa.a1.unit10.lesson06.teach.turn03:
    title: Którego Ordibeheszta jest wtorek?
    gloss: Którego Ordibeheszta jest wtorek?
    note: Maryam dopytuje o konkretną datę liczbową.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Wtorek to ósmy Ordibeheszt.
    gloss: Wtorek to ósmy Ordibeheszt.
    note: Reza podaje konkretną datę.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Dobrze, świetnie. A piątek? Masz czas?
    gloss: Dobrze, świetnie. A piątek? Masz czas?
    note: Maryam potwierdza datę, a potem pyta o inny dzień.
  fa.a1.unit10.lesson06.teach.turn06:
    title: Nie, w piątek jestem zajęty.
    gloss: Nie, w piątek jestem zajęty.
    note: سرم شلوغه (dosłownie „moja głowa jest zajęta/zatłoczona”) to naturalny potoczny irański sposób, by powiedzieć, że jest się zajętym.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Nie ma problemu, zobaczymy się we wtorek.
    gloss: Nie ma problemu, zobaczymy się we wtorek.
    note: مشکلی نیست („nie ma problemu”) uprzejmie przyjmuje odmowę Rezy, a می‌بینمت znaczy „zobaczymy się” – potwierdza wtorek jako dzień spotkania, zgodnie z wcześniejszymi wypowiedziami.
  fa.a1.unit10.lesson06.teach.va_and:
    title: I
    gloss: i
    note: '*و* znaczy „i”. Może łączyć dwa dni, jak w *دوشنبه و سه‌شنبه*, albo dwa powiązane pytania, jak w *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: W poniedziałek i wtorek mam zajęcia.
