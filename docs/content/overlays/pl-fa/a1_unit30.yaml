    gloss: uczysz się / studiujesz (nieformalnie)
    note: '*می‌خونی* to nieformalna forma 2. osoby od *می‌خونم*, używana do bezpośredniego pytania kogoś.'
    target_text: می‌خونی (uczysz się/czytasz, nieformalnie)
  fa.a1.unit30.lesson02.teach.review_chi:
