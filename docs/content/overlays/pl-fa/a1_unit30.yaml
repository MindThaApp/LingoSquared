    note: '*دانشگاه* to standardowe, codzienne słowo oznaczające „uniwersytet”.'
    example_gloss: Ten uniwersytet jest dobry.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Student
    gloss: student
    note: '*دانشجو* oznacza „student uczelni”. W zdaniu *من دانشجو هستم* („Jestem studentem/studentką”) użyto potocznej formy *هستم*.'
    example_gloss: Jestem studentem.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Lekcja / przedmiot
    gloss: lekcja / przedmiot
    note: '*درس* znaczy zarówno „lekcja”, jak i ogólniej „przedmiot nauki”.'
    example_gloss: Ten przedmiot jest ciekawy.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Język
    gloss: język
    note: '*زبان* to standardowe słowo oznaczające „język”.'
    example_gloss: Perski to język.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Ja / to
    gloss: ja / to
    note: '*من* i *این* wracają tutaj w rozmowie o studiach.'
    target_text: من (ja) / این (to)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: W / na
    gloss: w / na
    note: '*در* znaczy „w” lub „na” i tutaj służy do powiedzenia „na uniwersytecie”.'
    target_text: در (w / na)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Uczyć się/czytać + ja = uczę się/czytam
    gloss: uczyć się/czytać + ja = uczę się/czytam
    note: '*خوندن* („czytać” lub „uczyć się”, jak w *کتاب خوندن*) przyjmuje w czasie teraźniejszym tę samą końcówkę *-م* co *می‌کنم*, co daje *می‌خونم*, czyli „uczę się” lub „czytam”.'
    target_text: خوندن (uczyć się/czytać) + م = می‌خونم (uczę się/czytam)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Studiuję na uniwersytecie
    gloss: Studiuję na uniwersytecie
    note: '*من در دانشگاه درس می‌خونم* składa się z *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Matematyka
    gloss: matematyka
    note: '*ریاضی* to standardowe słowo oznaczające „matematykę”.'
    example_gloss: Matematyka jest ciekawa.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Kierunek studiów
    gloss: kierunek studiów
    note: '*رشته* oznacza kierunek studiów na uczelni. W *رشته‌ی من* („mój kierunek”) dodatkowe *ی* łączy rzeczownik z *من*.'
    example_gloss: Mój kierunek to języki.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Angielski
    gloss: angielski
    note: '*انگلیسی* („angielski”) wraca tutaj jako nazwa przedmiotu, którego możesz się uczyć.'
    target_text: انگلیسی (angielski)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Uczyć się + ja = uczę się
    gloss: uczyć się + ja = uczę się
    note: '*یاد گرفتن* znaczy „uczyć się, nauczyć się”. Jego forma czasu teraźniejszego *یاد می‌گیرم* zawiera ten sam czasownik *گرفتن* co *عکس می‌گیرم* („robię zdjęcie”), ale w innym znaczeniu.'
    target_text: یاد گرفتن (uczyć się, przyswajać) + م = یاد می‌گیرم (uczę się)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
