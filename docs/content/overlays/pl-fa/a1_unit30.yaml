course:
  title: Perski (farsi) A1
  description: 'Perski irański dla początkujących: nazywanie słów związanych z uczelnią i nauką (uniwersytet, student, lekcja/przedmiot, język), opowiadanie, jakiego przedmiotu się uczysz lub studiujesz (matematyka, kierunek studiów, angielski jako przedmiot), pytanie i odpowiadanie, gdzie się uczysz (*کجا درس می‌خونی؟*) i jak często chodzisz na uczelnię, tekst do czytania o studiach *نیما* i *سارا* oraz dialog między *نیما* i *سارا* o ich przedmiotach i o tym, co o nich sądzą (trudne, ale ciekawe).'
