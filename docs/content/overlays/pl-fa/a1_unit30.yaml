    title: 'Czytanie: studia Nimy i Sary'
    gloss: Nima studiuje na uniwersytecie matematykę. Matematyka jest trudna, ale ciekawa. Sara studiuje angielski. Ona chodzi na uniwersytet codziennie.
    note: Ten tekst opowiada dialog w 3. osobie. Prawie nie ma w nim nowych słów, więc to ćwiczenie w rozpoznawaniu słów w ciągłym tekście.
