teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Ten / to
    gloss: to / ten
    note: این znaczy „ten / to”.
    example_gloss: To jest większe niż tamto.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: Tamten / tamto
    gloss: tamto / tamten
    note: اون znaczy „tamten / tamto” (potoczna forma od آن).
    example_gloss: Tamto jest mniejsze niż to.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: Jest większy
    gloss: jest większy
    note: بزرگ‌تره to potoczne ściągnięcie بزرگ‌تر است („jest większy”) – بزرگ‌تر to stopień wyższy od بزرگ („duży”).
    example_gloss: To jest większe niż tamto.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: Jest mniejszy
    gloss: jest mniejszy
    note: کوچیک‌تره to potoczne ściągnięcie کوچیک‌تر است („jest mniejszy”).
    example_gloss: Tamto jest mniejsze niż to.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Niż
    gloss: niż
    note: 'از wskazuje punkt odniesienia w porównaniu – X از Y بزرگ‌تره znaczy: X jest większy niż Y.'
    target_text: از (niż)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Jest droższy
    gloss: jest droższy
    note: گرون‌تره to potoczne ściągnięcie گرون‌تر است – گرون‌تر to stopień wyższy od گرون („drogi”).
    example_gloss: To jest droższe niż tamto.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Jest tańsze
    gloss: jest tańsze
    note: ارزون‌تره to potoczna, skrócona forma ارزون‌تر است. ارزون‌تر to stopień wyższy od ارزون (tani).
    example_gloss: To jest tańsze niż tamto.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima i Sara
    gloss: Nima, Sara
    note: Popularne irańskie imiona, które pojawiają się w całym kursie.
    example_gloss:
    - Nima jest wyższy od Sary.
    - Sara jest młodsza od Nimy.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Wyższy
    gloss: wyższy / jest wyższy, jest wyższa
    note: '*قد بلندتره* dosłownie znaczy „wzrost jest dłuższy”: *قد* (wzrost) + *بلندتر* (wyższy; stopień wyższy od *بلند*, wysoki/długi) + *است* (jest), skrócone do *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Młodszy
    gloss: młodszy / jest młodszy, jest młodsza
    note: جوون‌تره to potoczna, skrócona forma جوون‌تر است. جوون‌تر to stopień wyższy od جوون (młody).
    example_gloss: Sara jest młodsza od Nimy.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: Jest lepsze
    gloss: jest lepsze
    note: '*بهتره* to potoczna, skrócona forma *بهتر است*. *بهتر* (lepszy) to nieregularny stopień wyższy od *خوب* (dobry).'
    example_gloss: To jest lepsze niż tamto.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: Jest gorsze
    gloss: jest gorsze
    note: '*بدتره* to potoczna, skrócona forma *بدتر است*. *بدتر* (gorszy) to regularny stopień wyższy od *بد* (zły): to samo słowo z zwykłą końcówką *تر*, w odróżnieniu od nieregularnego *بهتر*.'
    example_gloss: To jest gorsze niż tamto.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Ponieważ
    gloss: ponieważ / bo
    note: چون wprowadza przyczynę.
    target_text: چون (ponieważ)
  fa.a1.unit15.lesson04.teach.va_word:
    title: I
    gloss: i
    note: و znaczy „i” i łączy dwa zdania lub dwa elementy.
    target_text: و (i)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Przykładowy tekst porównawczy
    gloss: Nima jest wyższy od Sary. Sara jest młodsza od Nimy.
    note: Krótkie porównanie osób w trzeciej osobie, łączące słownictwo z tej lekcji.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima i Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima powiedział, że to jest droższe.
    - Sara powiedziała, że tamto jest tańsze.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Ale
    gloss: ale
    note: ولی znaczy „ale” i wprowadza przeciwstawienie.
    target_text: ولی (ale)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Tak
    gloss: no tak
    note: آره to potoczna forma słowa بله (tak).
    example_gloss: No tak, zgadza się.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima mówi
    gloss: To jest droższe niż tamto, ale lepsze.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara odpowiada
    gloss: No tak, ale tamto jest tańsze.
