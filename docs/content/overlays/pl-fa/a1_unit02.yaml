course:
  title: Perski (farsi) A1
  description: 'Perski irański (farsi) dla początkujących: nauka czytania pisma, rozumienie codziennej mowy i grzeczne radzenie sobie w praktycznych rozmowach.'
units:
  fa.a1.unit02.introductions:
    title: Imiona, pochodzenie i przedstawianie się
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Czytaj litery używane przy przedstawianiu się
  fa.a1.unit02.lesson02.names:
    title: Pytaj o imię i podawaj je
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Zaimki w liczbie pojedynczej i „być”
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Kraje i narodowości
  fa.a1.unit02.lesson05.origin:
    title: Zapytaj, skąd ktoś pochodzi
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Spotkanie na zajęciach z farsi
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Litery ن i ت
    gloss: n i t
    note: ن oznacza n. ت oznacza t; obie łączą się z obu stron.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Litery ش i چ
    gloss: sz i cz
    note: ش oznacza sz, a چ oznacza cz.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Litery ی i ه
    gloss: j/długie i oraz h
    note: ی brzmi jak j lub długie ī. ه to h i zmienia kształt przy łączeniu.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Litery ک i گ
    gloss: k i g
    note: ک oznacza k; przy pisaniu na klawiaturze używaj perskiego ک, a nie podobnie wyglądającej litery arabskiej. گ ma dodatkową kreskę względem ک i oznacza g.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Litery ج i د
    gloss: dż i d
    note: ج oznacza dż. د oznacza d i nie łączy się dalej w lewo.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Litery ر i ف
    gloss: r i f
    note: ر oznacza r i nie łączy się dalej; ف oznacza f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Litery و i ب
    gloss: w/o/u i b
    note: و może oznaczać w lub samogłoskę i nie łączy się dalej. ب oznacza b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Litery خ i ز
    gloss: ch i z
    note: خ to dźwięk zapisywany zwykle jako kh, podobny do polskiego ch; ز oznacza z.
  fa.a1.unit02.lesson02.teach.esm:
    title: Imię
    gloss: imię
    note: اسم w zwykłym irańskim perskim czyta się esm.
    example_gloss: Mam na imię Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: Ja
    gloss: ja
    note: من to zaimek pierwszej osoby liczby pojedynczej.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا to popularne irańskie imię.
    example_gloss: Sara jest moją przyjaciółką.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Formalne lub pisemne przedstawienie się
    gloss: Mam na imię Sara.
    note: '*اسم من سارا است* jest poprawne, ale formalne; najczęściej zobaczysz to w piśmie.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Naturalne mówione przedstawienie się
    gloss: Mam na imię Sara.
    note: اسمم to skrócone اسم من, a ساراست łączy سارا i است.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Uprzejme pytanie o imię
    gloss: Jak masz na imię?
    note: اسم شما چیه؟ to zwykły, neutralnie grzeczny mówiony irański perski.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Pytanie o imię w formie nieformalnej
    gloss: Jak masz na imię?
    note: اسمت چیه؟ jest w liczbie pojedynczej i nieformalne; używaj tego tylko wtedy, gdy pozwala na to relacja.
  fa.a1.unit02.lesson03.teach.man:
    title: Ja
    gloss: ja
    note: من nie ma rodzaju gramatycznego.
  fa.a1.unit02.lesson03.teach.to:
    title: Ty, nieformalna liczba pojedyncza
    gloss: ty
    note: تو jest nieformalne i w liczbie pojedynczej; grzecznościowo zwykle mówi się شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: On lub ona
    gloss: on / ona
    note: او nie wskazuje rodzaju i może oznaczać zarówno „on”, jak i „ona”.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Jestem
    gloss: jestem
    note: هستم to pełna forma pierwszej osoby liczby pojedynczej czasownika بودن.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Jesteś
    gloss: jesteście; jest Pan/Pani
    note: هستی pasuje do nieformalnego تو w liczbie pojedynczej.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: On lub ona jest
    gloss: on/ona jest; jest obecny/obecna
    note: هست to pełna forma 3. osoby liczby pojedynczej; często wyraża istnienie lub podkreślenie.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Formalne orzeczenie tożsamości
    gloss: On/ona jest Irańczykiem/Iranką.
    note: W neutralnym, formalnym zdaniu pisanym o tożsamości است to zwykła łącznik w 3. osobie.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Mówione orzeczenie tożsamości
    gloss: On/ona jest Irańczykiem/Iranką.
    note: ایرانیه to naturalne mówione zlanie się form ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Iran
    gloss: Iran
    note: ایران to nazwa państwa.
    example_gloss: Pochodzę z Iranu.
  fa.a1.unit02.lesson04.teach.iranian:
    title: irański; Irańczyk
    gloss: irański / Irańczyk
    note: ایرانی może określać narodowość lub pochodzenie.
    example_gloss: Jestem Irańczykiem/Iranką.
  fa.a1.unit02.lesson04.teach.england:
    title: Anglia
    gloss: Anglia
    note: '*انگلیس* zwykle oznacza Anglię; w codziennej mowie Irańczycy często używają tego słowa na określenie całego Wielkiej Brytanii.'
    example_gloss: Pochodzę z Anglii.
  fa.a1.unit02.lesson04.teach.english:
    title: angielski; Anglik
    gloss: angielski / Anglik
    note: انگلیسی może oznaczać narodowość, język lub coś związanego z Anglią; znaczenie wynika z kontekstu.
    example_gloss: Jestem Anglikiem/Angielką.
  fa.a1.unit02.lesson04.teach.france:
    title: Francja
    gloss: Francja
    note: فرانسه to nazwa państwa Francja.
    example_gloss: Pochodzę z Francji.
  fa.a1.unit02.lesson04.teach.french:
    title: francuski; Francuz
    gloss: francuski / Francuz
    note: فرانسوی może określać narodowość lub coś związanego z Francją.
    example_gloss: Jestem Francuzem/Francuzką.
  fa.a1.unit02.lesson04.teach.country:
    title: Kraj
    gloss: kraj
    note: کشور to ogólne słowo oznaczające kraj.
    example_gloss: Iran to kraj.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Narodowość
    gloss: narodowość
    note: ملیت to formalny rzeczownik oznaczający narodowość.
    example_gloss: Jaka jest Pana/Pani narodowość?
  fa.a1.unit02.lesson05.teach.ahl:
    title: Z; rodem z
    gloss: z / rodem z
    note: اهل łączy osobę z miejscem pochodzenia; nie oznacza po prostu, że ktoś obecnie mieszka w danym miejscu.
    example_gloss: On/ona pochodzi z Anglii.
  fa.a1.unit02.lesson05.teach.koja:
    title: Gdzie
    gloss: gdzie
    note: کجا pyta o miejsce.
    example_gloss: Skąd Pan/Pani pochodzi?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Formalne pytanie standardowe
    gloss: Skąd Pan/Pani jest?
    note: اهل کجا هستید؟ to uprzejmy standardowy perski, pasujący do mowy formalnej lub starannego czytania.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Neutralnie uprzejme pytanie mówione
    gloss: Skąd Pan/Pani jest?
    note: اهل کجا هستین؟ to zwykła uprzejma forma mówiona w irańskim farsi.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Pytanie nieformalne
    gloss: Skąd Pan/Pani jest?
    note: اهل کجایی؟ to forma nieformalna w liczbie pojedynczej (do jednej osoby, na ty).
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Podanie miejsca pochodzenia
    gloss: Pochodzę z Iranu.
    note: من اهل ایران هستم wskazuje pochodzenie, a nie obecne miejsce zamieszkania.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Krótka odpowiedź o narodowości
    gloss: Jestem Irańczykiem/Iranką.
    note: '*ایرانی‌ام* powstaje przez dodanie do *ایرانی* końcówki *ـام* (jestem), zapisanej z małym półspacją przed końcówką.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Sprawdzenie miejsca
    gloss: Sara pyta, czy to jest zajęcie z farsi.
    note: ببخشید uprzejmie zwraca uwagę przed praktycznym pytaniem.
  fa.a1.unit02.lesson06.teach.yes:
    title: Tak
    gloss: tak
    note: بله to neutralnie uprzejme słowo „tak”.
    example_gloss: Tak, oczywiście.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina przedstawia się
    gloss: Mina potwierdza miejsce, przedstawia się i pyta Sarę o imię.
    note: Uprzejme pytanie w formie mówionej pasuje do dwóch dorosłych osób spotykających się na zajęciach.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara podaje swoje imię
    gloss: Mam na imię Sara.
    note: Sara używa zwartego wzorca mówionego, poznanego wcześniej.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina pyta o pochodzenie
    gloss: Skąd Pan/Pani jest?
    note: هستین zachowuje uprzejmy, a zarazem swobodny ton rozmowy.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Wymiana informacji o pochodzeniu
    gloss: Sara mówi, że pochodzi z Anglii, i pyta, czy Mina pochodzi z Iranu.
    note: Obie rozmówczynie zachowują formy grzecznościowe, bo dopiero się poznały.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: Wymiana informacji o pochodzeniu, odpowiedź
    gloss: Mina potwierdza, że jest Iranką.
    note: '*ایرانی‌ام* to krótka forma od *ایرانی هستم* (jestem Irańczykiem/Iranką).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Odpowiedź na przedstawienie się
    gloss: Sara mówi, że miło jej poznać Minę.
    note: از آشنایی با شما خوشوقتم to naturalne zakończenie ich rozmowy.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Odwzajemnienie powitania i wejście na zajęcia
    gloss: Mina mówi, że jej również miło, i zaprasza Sarę do środka.
    note: من هم همین‌طور odwzajemnia uprzejme powitanie Sary, a بفرمایید داخل posuwa scenkę zajęć naprzód.
exercises:
  fa.a1.unit02.lesson01.exercise01.recognize_noon:
    instruction: Która litera oznacza dźwięk n?
    correct_option: ن
    distractors:
    - ت
    - ر
    - و
    accepted_answers:
    - value: ن
      status: correct
    feedback: ن oznacza dźwięk n.
  fa.a1.unit02.lesson01.exercise02.recognize_che:
    instruction: Która litera oznacza dźwięk cz (ch w transkrypcji angielskiej)?
