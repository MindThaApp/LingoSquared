    - value: اسم من سارا است
      status: acceptable_with_note
      note: Poprawne, ale bardziej formalne niż w pytaniu.
    feedback: Naturalna odpowiedź mówiona to اسمم ساراست.
  fa.a1.unit02.lesson02.exercise07.choose_informal:
    instruction: Który rejestr najlepiej opisuje اسمت چیه؟
    correct_option: forma nieformalna w liczbie pojedynczej
    distractors:
    - formalny perski pisany
    - liczba mnoga grzecznościowa
    - neutralnie grzeczny perski mówiony
    accepted_answers:
    - value: forma nieformalna w liczbie pojedynczej
      status: correct
    feedback: Dodane ـت oznacza nieformalne „twój/twoja” w liczbie pojedynczej.
  fa.a1.unit02.lesson02.exercise08.speak_name:
