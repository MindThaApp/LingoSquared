    - value: سارا هستم
      status: correct
    - value: اسم من ساراست
      status: correct
    - value: من سارام
      status: correct
    - value: سارام
      status: correct
    - value: سارا
      status: correct
    - value: اسمم سارا است
      status: acceptable_with_note
