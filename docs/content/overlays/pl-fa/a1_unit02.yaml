      right: j
    - left: ه
      right: h
    - left: ک
      right: k
    - left: گ
      right: g
    - left: و
      right: w / o
    - left: ب
      right: b
    - left: خ
      right: ch
    - left: ز
      right: z
  fa.a1.unit02.lesson01.exercise04.choose_persian_ke:
    instruction: Wybierz perską literę oznaczającą k.
    correct_option: ک
    distractors:
    - گ
    - ج
    - ف
    accepted_answers:
    - value: ک
      status: correct
    feedback: Perskie ک oznacza dźwięk k.
  fa.a1.unit02.lesson01.exercise06.recognize_fe:
    instruction: Która litera oznacza dźwięk f?
    correct_option: ف
    distractors:
    - و
    - ب
    - ت
    accepted_answers:
    - value: ف
      status: correct
    feedback: ف oznacza dźwięk f.
  fa.a1.unit02.lesson02.exercise01.recognize_esme_shoma_reading:
    instruction: Jakiej informacji dotyczy to pytanie?
    correct_option: imię rozmówcy
    distractors:
    - kraj rozmówcy
    - godzina
    - zawód mówiącego
    accepted_answers:
    - value: imię rozmówcy
      status: correct
    feedback: اسم شما چیه؟ pyta rozmówcę o imię.
  fa.a1.unit02.lesson02.exercise02.name_meaning:
    instruction: Wybierz znaczenie słowa اسم.
    correct_option: imię
    distractors:
    - kraj
    - zajęcia
    - język
    accepted_answers:
    - value: imię
      status: correct
    feedback: اسم oznacza imię.
  fa.a1.unit02.lesson02.exercise03.formal_name:
    instruction: Ułóż formalne, pisane przedstawienie się.
    accepted_answers:
    - value:
      - اسم
      - من
      - سارا
      - است
      status: correct
    feedback: اسم من سارا است to celowo formalny wzorzec pisany.
  fa.a1.unit02.lesson02.exercise04.translate_spoken_name:
