  fa.a1.unit02.lesson03.exercise01.pronoun_i:
    instruction: Wybierz perski zaimek oznaczający „ja”.
    correct_option: من
    distractors:
    - تو
    - او
    - شما
    accepted_answers:
    - value: من
      status: correct
    feedback: من oznacza „ja”.
  fa.a1.unit02.lesson03.exercise02.pronoun_you:
    instruction: Wybierz nieformalne „ty” w liczbie pojedynczej.
    correct_option: تو
    distractors:
    - من
    - او
    - شما
    accepted_answers:
    - value: تو
      status: correct
    feedback: تو to nieformalne „ty” w liczbie pojedynczej.
  fa.a1.unit02.lesson03.exercise03.pronoun_gender:
    instruction: Czy او może odnosić się zarówno do mężczyzny, jak i do kobiety?
    options:
    - Tak
    - Nie
    accepted_answers:
    - value: Tak
      status: correct
    feedback: Perskie zaimki trzeciej osoby liczby pojedynczej nie rozróżniają rodzaju gramatycznego.
  fa.a1.unit02.lesson03.exercise04.order_i_am:
    instruction: Ułóż słowa tak, aby powiedzieć „jestem”.
    accepted_answers:
    - value:
      - من
      - هستم
      status: correct
    feedback: من هستم znaczy „ja jestem”.
  fa.a1.unit02.lesson03.exercise05.order_you_are:
    instruction: Ułóż słowa tak, aby powiedzieć nieformalne „jesteś” w liczbie pojedynczej.
    accepted_answers:
    - value:
      - تو
      - هستی
      status: correct
    feedback: تو هستی to nieformalna forma liczby pojedynczej.
  fa.a1.unit02.lesson03.exercise06.order_forms:
    instruction: 'Ułóż słowa tak, aby powiedzieć: jestem, jesteś, on/ona jest.'
    accepted_answers:
    - value:
      - من
      - هستم
      - تو
      - هستی
      - او
      - هست
      status: correct
    feedback: To trzy pełne formy liczby pojedynczej w kolejności osób.
