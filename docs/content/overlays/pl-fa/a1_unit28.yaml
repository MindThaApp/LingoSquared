teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: Ja
    gloss: ja
    note: '*من* już znasz, a tutaj wraca w wypowiedziach o tym, jak się przemieszczasz.'
  fa.a1.unit28.lesson01.teach.ba_word:
    title: Czymś / z
    gloss: z / za pomocą / (jechać) czymś
    note: '*با* to przyimek używany ze środkiem transportu: *با* + nazwa środka transportu + *می‌رم* znaczy „jadę (czymś)”.'
    target_text: با (z / za pomocą)
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: Autobus
    gloss: autobus
    note: '*اتوبوس* to codzienne słowo oznaczające „autobus”.'
    example_gloss: Jadę autobusem.
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: Jadę autobusem
    gloss: Jadę autobusem
    note: '*با اتوبوس می‌رم* składa się z *با* + *اتوبوس* + *می‌رم* („idę / jadę”).'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: Metro
    gloss: metro
    note: '*مترو* to zapożyczenie używane na co dzień – teherańskie metro naprawdę nazywa się *مترو*.'
    example_gloss: Jadę metrem.
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: Jadę metrem
    gloss: Jadę metrem
    note: '*با مترو می‌رم* ma dokładnie ten sam wzór *با* + środek transportu + *می‌رم* co w przypadku autobusu.'
  fa.a1.unit28.lesson02.teach.mashin_word:
    title: Samochód
    gloss: samochód
    note: '*ماشین* to codzienne słowo oznaczające „samochód”.'
    example_gloss: Jadę samochodem.
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: Jadę samochodem
    gloss: Jadę samochodem
    note: '*با ماشین می‌رم* ma ten sam wzór *با* + środek transportu + *می‌رم*.'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Rower
    gloss: rower
    note: '*دوچرخه* znaczy „rower” – dosłownie „dwukołowiec”.'
    example_gloss: Jadę rowerem.
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: Jadę rowerem
    gloss: Jadę rowerem
    note: '*با دوچرخه می‌رم* to jeszcze raz ten sam wzór.'
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: Codziennie
    gloss: codziennie
    note: '*هر روز* wraca tutaj przy opisie codziennego dojazdu.'
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: Pracować
    gloss: pracować
    note: '*سر کار* znaczy „do pracy” – nie potrzeba przyimka, wystarczy *می‌رم* + *سر کار*.'
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: Codziennie jadę do pracy samochodem
    gloss: Codziennie jadę do pracy samochodem
    note: '*هر روز با ماشین می‌رم سر کار* łączy wszystko z tej lekcji: częstotliwość, środek transportu i cel.'
  fa.a1.unit28.lesson03.teach.piyade_word:
    title: Pieszo
    gloss: pieszo
    note: '*پیاده* znaczy „pieszo” – w przeciwieństwie do poprzednich środków transportu NIE potrzebuje *با*: mówisz po prostu *پیاده می‌رم*, a nie *با پیاده می‌رم*.'
    example_gloss: Idę pieszo.
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: Idę pieszo (bez با)
    gloss: Idę pieszo
    note: '*پیاده می‌رم* – *پیاده* działa tu jak przysłówek, podobnie jak w polskim „idę pieszo” nie potrzeba żadnego przyimka.'
    target_text: پیاده می‌رم (bez با)
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: Taksówka
    gloss: taksówka
    note: '*تاکسی* to zapożyczenie używane na co dzień i, tak jak inne pojazdy, WYMAGA *با*.'
    example_gloss: Jadę taksówką.
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: Jadę taksówką
    gloss: Jadę taksówką
    note: '*با تاکسی می‌رم* ma regularny wzór *با* + środek transportu.'
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: Który
    gloss: który / jaki
    note: '*کدوم* znaczy „który”; tutaj służy do pytania, który środek transportu jest lepszy.'
    target_text: کدوم (który)
  fa.a1.unit28.lesson03.teach.behtare_review:
    title: Lepiej
    gloss: lepiej
    note: '*بهتره* znaczy „jest lepszy / lepsze”.'
  fa.a1.unit28.lesson03.teach.ya_review:
    title: Lub
    gloss: lub / albo
    note: '*یا* łączy tutaj dwa środki transportu do wyboru.'
    target_text: یا (albo)
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: Autobus czy metro, co jest lepsze?
    gloss: Autobus czy metro, co jest lepsze?
    note: '*اتوبوس یا مترو، کدوم بهتره؟* łączy *یا*, które wylicza możliwości, z *کدوم بهتره؟*, którym prosisz o radę.'
  fa.a1.unit28.lesson04.teach.belit_review:
    title: Bilet
    gloss: bilet
    note: '*بلیط* wraca tutaj w znaczeniu zwykłego biletu na lokalny autobus.'
    example_gloss: Gdzie jest bilet na autobus?
  fa.a1.unit28.lesson04.teach.gheymat_review:
    title: Cena
    gloss: cena
    note: '*قیمت* znaczy „cena”.'
  fa.a1.unit28.lesson04.teach.cheghadr_review:
    title: Ile
    gloss: ile
    note: '*چقدر* służy tutaj do pytania o cenę biletu.'
  fa.a1.unit28.lesson04.teach.belit_cheghadr_phrase:
    title: Ile kosztuje bilet na autobus?
    gloss: Ile kosztuje bilet na autobus?
    note: '*بلیط اتوبوس چقدره؟* łączy *بلیط اتوبوس* z *چقدره* („ile to kosztuje”).'
  fa.a1.unit28.lesson04.teach.daghighe_review:
    title: Minuta
    gloss: minuta
    note: '*دقیقه* wraca tutaj w kontekście rozkładu jazdy autobusów.'
  fa.a1.unit28.lesson04.teach.panzdah_review:
    title: Piętnaście
    gloss: piętnaście
    note: '*پانزده* służy tutaj do określenia, jak często jeździ autobus.'
  fa.a1.unit28.lesson04.teach.miad_word:
    title: Przychodzi
    gloss: przyjeżdża / przychodzi
    note: '*میاد* to potoczna forma na co dzień oznaczająca „przyjeżdża / przychodzi” (od *می‌آید*); tutaj służy do mówienia, jak często przyjeżdża autobus.'
    target_text: میاد (przyjeżdża / przychodzi)
  fa.a1.unit28.lesson04.teach.sign_text:
    title: 'Czytanie: tablica na przystanku'
    gloss: Ile kosztuje bilet na autobus? Autobus przyjeżdża co piętnaście minut.
    note: Krótkie zdanie w stylu tablicy z rozkładem, łączące pytanie o cenę biletu z informacją o częstotliwości kursowania.
  fa.a1.unit28.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, postać znana już z Lekcji 11, wraca tutaj.'
    example_gloss: Nima codziennie chodzi do pracy.
  fa.a1.unit28.lesson05.teach.mire_review:
    title: On/ona idzie
    gloss: on/ona idzie
    note: '*می‌ره* to potoczna forma 3. osoby czasownika „iść / jechać”.'
  fa.a1.unit28.lesson05.teach.gahi_review:
    title: Czasem
    gloss: czasem
    note: '*گاهی* wraca tutaj.'
  fa.a1.unit28.lesson05.teach.ham_review:
    title: Też
    gloss: też / także
    note: '*هم* znaczy „też” lub „także”; tutaj dotyczy tego, że Nima czasem chodzi pieszo.'
    target_text: هم (też)
  fa.a1.unit28.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, postać znana już z Lekcji 2, wraca tutaj.'
    example_gloss: Sara codziennie chodzi do szkoły.
  fa.a1.unit28.lesson05.teach.madrese_review:
    title: Szkoła
    gloss: szkoła
    note: '*مدرسه* to tutaj cel codziennej drogi سارا.'
    example_gloss: Sara idzie do szkoły.
  fa.a1.unit28.lesson05.teach.reading_text:
    title: 'Czytanie: dojazdy Nimy i Sary'
    gloss: Nima codziennie jeździ do pracy autobusem. Czasem chodzi też pieszo. Sara codziennie jeździ do szkoły rowerem.
    note: Ten tekst wykorzystuje wszystkie konstrukcje z lekcji 1–4 oraz *می‌ره* i *مدرسه* z lekcji 5. Prawie nie ma tu nowego słownictwa – chodzi o rozpoznawanie znanych form w ciągłym tekście.
  fa.a1.unit28.lesson06.teach.tochi_review:
    title: A ty?
    gloss: a ty?
    note: '*تو چی؟* pojawia się tu znowu, by oddać pytanie rozmówcy.'
  fa.a1.unit28.lesson06.teach.choon_word:
    title: Ponieważ
    gloss: ponieważ / bo
    note: '*چون* znaczy „ponieważ” – to nowe spójnik, użyty tu do uzasadnienia rady.'
    target_text: چون (ponieważ)
  fa.a1.unit28.lesson06.teach.varzeshe_word:
    title: To sport
    gloss: to sport
    note: '*ورزشه* składa się z *ورزش* (poznanego wcześniej) i łącznika *-ه* („jest”).'
  fa.a1.unit28.lesson06.teach.vali_review:
    title: Ale
    gloss: ale
    note: '*ولی* pojawia się tu znowu.'
    target_text: ولی (ale)
  fa.a1.unit28.lesson06.teach.chekhoob_review:
    title: Jak miło!
    gloss: jak miło!
    note: '*چه خوب!* to naturalna reakcja na zakończenie rozmowy także tutaj.'
  fa.a1.unit28.lesson06.teach.are_review:
    title: Tak
    gloss: tak
    note: '*آره* to potoczne słowo „tak”, używane na co dzień; pojawia się tu ponownie.'
  fa.a1.unit28.lesson06.teach.dialogue_line1:
    title: 'Nima: Codziennie jeżdżę do pracy autobusem. A ty?'
    gloss: Codziennie jeżdżę do pracy autobusem. A ty?
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: 'Sara: Ja jeżdżę do szkoły rowerem.'
    gloss: Jeżdżę do szkoły rowerem.
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: 'Nima: Autobus czy rower – co jest lepsze?'
    gloss: Autobus czy rower – co jest lepsze?
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: 'Sara: Rower jest lepszy, bo to sport.'
    gloss: Rower jest lepszy, bo to sport.
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: 'Nima: Tak, ale czasem chodzę też pieszo.'
    gloss: Tak, ale czasem chodzę też pieszo.
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: 'Sara: Jak miło!'
    gloss: Jak miło!
