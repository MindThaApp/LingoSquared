course:
  title: Perski (farsi) A1
  description: 'Perski (irański) dla początkujących: nazywanie środków transportu (autobus, metro, samochód, rower, pieszo, taksówka), mówienie o tym, jak regularnie dojeżdżasz (codziennie autobusem do pracy), pytanie, który środek transportu jest lepszy (اتوبوس یا مترو، کدوم بهتره؟), pytanie o cenę lokalnego biletu i czytanie krótkiego zdania z rozkładu jazdy, tekst do czytania o codziennych dojazdach نیما i سارا oraz dialog końcowy między نیما i سارا, w którym porównują, jak się poruszają.'
