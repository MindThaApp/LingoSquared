  description: 'Perski (Iran) dla początkujących: nazywanie codziennych urządzeń (telefon, komputer, internet, aplikacja), czynności na telefonie (wysyłanie wiadomości, dzwonienie, robienie zdjęć, pobieranie aplikacji), pytanie i odpowiadanie, jak często korzystasz z telefonu (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), tekst o tym, jak z urządzeń korzystają *نیما* i *سارا*, oraz dialog *نیما* i *سارا* o tym, jak każde z nich korzysta z technologii.'
