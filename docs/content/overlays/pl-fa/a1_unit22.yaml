teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Telefon
    gloss: telefon
    note: تلفن to ogólne słowo oznaczające telefon.
    example_gloss: Gdzie jest mój telefon?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Wiadomość
    gloss: wiadomość
    note: پیام to wiadomość pisemna, SMS.
    example_gloss: Mam wiadomość.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Dzwonić
    gloss: dzwonić
    note: زنگ زدن (dosłownie „dzwonić”) to codzienny czasownik oznaczający telefonowanie do kogoś.
    example_gloss: Zadzwoń do mnie.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Głos
    gloss: głos
    note: صدا znaczy głos; używa się go, by opisać, jak ktoś brzmi podczas rozmowy.
    example_gloss: Masz dobry głos.
  fa.a1.unit22.lesson01.teach.va_word:
    title: I
    gloss: i
    note: و to najczęstszy spójnik; powtórka z wcześniejszych lekcji.
    target_text: و (i)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Halo (przez telefon)
    gloss: halo, słucham
    note: الو to powitanie używane tylko przez telefon (nie w rozmowie twarzą w twarz); بفرمایید znaczy tu mniej więcej „słucham, proszę mówić”.
  fa.a1.unit22.lesson02.teach.its_me:
    title: To ja, Narges
    gloss: cześć, to ja, Narges
    note: '*منم* to *من* („ja”) z końcówką czasownika -م („jestem”), więc znaczy „to ja” – bardzo częsty sposób przedstawienia się przez telefon. (Taka sama pisownia może też znaczyć „ja też”, czyli *من هم*; tutaj kontekst jest jasny.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Możesz to powtórzyć?
    gloss: czy może Pan/Pani powtórzyć?
    note: می‌شه (potocznie od می‌شود, „czy można”) + تکرار کنید („powtórzyć”) to standardowa uprzejma forma prośby.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Proszę mówić wolniej
    gloss: proszę mówić wolniej
    note: آهسته‌تر to stopień wyższy od آهسته („wolno”) – „wolniej”.
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: Mam dla ciebie wiadomość
    gloss: mam dla ciebie wiadomość
    note: برات to skrócone برای („dla”) + ت (potoczne „ciebie”).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Przyjdź jutro o czwartej do kawiarni
    gloss: przyjdź jutro o czwartej do kawiarni
    note: بیا to potoczny tryb rozkazujący od آمدن („przychodzić”), utworzony od samego tematu – tak samo jak inne rozkaźniki poznane na poziomie A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Pa, porozmawiamy później
    gloss: pa, porozmawiamy później
    note: بعداً znaczy „później”; صحبت می‌کنیم to „rozmawiamy / porozmawiamy”.
  fa.a1.unit22.lesson05.teach.better_now:
    title: Czy teraz jest lepiej?
    gloss: czy teraz jest lepiej?
    note: 'الان znaczy „teraz”; بهتر شد dosłownie znaczy „stało się lepsze”. W farsi do sprawdzenia, czy coś się poprawiło, naturalnie używa się czasu przeszłego, mimo że po polsku powiemy w czasie teraźniejszym: „jest lepiej?”.'
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Cześć, Narges, jak się masz?
    gloss: cześć, Narges, jak się masz?
    note: '*چطوری* to nieformalne „jak się masz?”, odpowiednie tutaj, bo Ali i Narges są przyjaciółmi.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Twój głos się urywa
    gloss: twój głos się urywa
    note: قطع و وصل می‌شه dosłownie znaczy „rozłącza się i łączy”. To naturalny zwrot w farsi na przerywane połączenie telefoniczne.
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali odbiera
    gloss: 'Ali: Halo, słucham.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges się przedstawia
    gloss: 'Narges: Cześć, Ali, to ja, Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali odpowiada na powitanie
    gloss: 'Ali: Cześć, Narges, jak się masz?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges prosi, by mówił wolniej
    gloss: 'Narges: Dobrze, dziękuję. Możesz mówić trochę wolniej? Twój głos się urywa.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali sprawdza
    gloss: 'Ali: Dobrze, czy teraz jest lepiej?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges przekazuje wiadomość
    gloss: 'Narges: Tak, lepiej. Mam dla ciebie wiadomość: przyjdź jutro o czwartej do kawiarni.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Oni idą (potocznie)
    gloss: oni idą (forma mówiona)
    note: '*می‌رن* to nieformalna, mówiona forma od *می‌روند* (oni idą), w tym samym potocznym rejestrze co reszta kursu.'
    target_text: می‌رن (oni idą, potocznie)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali potwierdza
    gloss: 'Ali: Dobrze, na pewno przyjdę.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges kończy rozmowę
    gloss: 'Narges: Pa, porozmawiamy później.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali się żegna
    gloss: 'Ali: Pa.'
