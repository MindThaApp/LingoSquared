course:
  title: Perski (farsi) A1
  description: 'Perski (Iran) dla początkujących: nazywanie słów związanych ze świętowaniem i urodzinami (urodziny, przyjęcie, ciasto, prezent), pytanie o datę urodzin i odpowiadanie na nie (*تولدت کِیه؟*) z użyciem poznanych już miesięcy i liczebników porządkowych, zapraszanie na przyjęcie i przyjmowanie zaproszenia (*میای به مهمونی؟* / *آره، حتماً میام*), dialog Nimy i Sary o urodzinach z wyrażeniem *تولدت مبارک* („wszystkiego najlepszego”), tekst do czytania o urodzinach Nimy oraz podsumowanie: nazywanie uroczystości, które lubisz, i pisanie własnego zaproszenia lub życzeń.'
