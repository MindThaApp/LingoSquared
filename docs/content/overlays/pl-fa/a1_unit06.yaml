course:
  title: Perski (farsi) A1
  description: 'Perski irański dla początkujących: słownictwo związane z jedzeniem i piciem, uprzejme zamawianie w restauracji, pytanie o menu i polecenia, ilości oraz savoir-vivre w restauracji, w tym prośba o rachunek.'
units:
  fa.a1.unit06.food:
    title: Jedzenie i zamawianie posiłku
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Jedzenie i napoje
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Uprzejme zamawianie
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Pytanie o menu i prośba o polecenie
  fa.a1.unit06.lesson04.quantities:
    title: Zamawianie konkretnych ilości
  fa.a1.unit06.lesson05.restaurant_etiquette:
