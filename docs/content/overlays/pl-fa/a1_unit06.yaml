  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Pełna rozmowa w restauracji
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Chleb
    gloss: chleb
    note: نان to podstawa każdego irańskiego posiłku, zwykle płaski chleb podawany prawie do wszystkiego.
    example_gloss: Lubię chleb.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Ryż
    gloss: ryż
    note: برنج to główny element większości irańskich dań głównych.
    example_gloss: Ryż z kurczakiem jest pyszny.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Kurczak
    gloss: kurczak
    note: مرغ oznacza zarówno ptaka, jak i mięso.
    example_gloss: Jem kurczaka.
  fa.a1.unit06.lesson01.teach.ab:
    title: Woda
    gloss: woda
    note: آب to zwykłe słowo oznaczające wodę.
    example_gloss: Chcę wody.
  fa.a1.unit06.lesson01.teach.chai:
    title: Herbata
    gloss: herbata
    note: چای to napój podawany niemal wszędzie w Iranie, znany już z lekcji o taarof w jednostce 1.
    example_gloss: Poproszę herbatę.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Kawa
    gloss: kawa
    note: قهوه jest w irańskich miastach coraz popularniejsza obok herbaty.
    example_gloss: Kawa jest gorąca.
  fa.a1.unit06.lesson01.teach.mive:
    title: Owoce
    gloss: owoce
    note: میوه to ogólne słowo oznaczające każdy owoc.
    example_gloss: Lubię owoce.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: I / lub
    gloss: و (i), یا (lub)
    note: Oba to częste spójniki, którymi łączy się jedzenie i napoje w zamówieniu.
    target_text: و (i), یا (lub)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Uprzejme zamówienie herbaty
    gloss: Poproszę herbatę.
    note: می‌خواستم dosłownie jest formą czasu przeszłego od „chcieć”, ale działa jak uprzejma, złagodzona prośba – naturalny rejestr wobec kelnera lub sprzedawcy, którego nie znasz.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Proszę
    gloss: proszę
    note: لطفاً można dodać, aby złagodzić niemal każdą prośbę.
    example_gloss: Proszę, pomóż mi.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Zamawianie herbaty nieformalnie
    gloss: Chcę herbatę.
    note: یه چای می‌خوام używa potocznego یه („jeden/jakiś”) i می‌خوام („chcę”) – zarezerwuj to dla bliskiego przyjaciela lub rodziny, nie dla kelnera, którego dopiero poznałeś.
  fa.a1.unit06.lesson02.teach.register_note:
    title: Wybór właściwego czasownika przy zamawianiu
    gloss: Z nieznajomym lub kelnerem używaj می‌خواستم; می‌خوام tylko z bliskim przyjacielem.
    note: To wersja podziału na rejestry, znanego już z powitań w jednostce 1, odnosząca się do zamawiania.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Uprzejme zamówienie chleba
    gloss: Poproszę chleb.
    note: Ten sam wzorzec z می‌خواستم stosuje się do każdego rzeczownika oznaczającego jedzenie lub napój.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Menu
    gloss: menu
    note: منو to zapożyczenie, używane tak samo jak w polskim „menu”.
    example_gloss: Poproszę menu.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Prośba o menu
    gloss: Czy mają Państwo menu?
    note: منو دارید؟ dosłownie znaczy „czy mają Państwo menu?” – to zwykły sposób, by o nie poprosić.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Prośba o polecenie
    gloss: Co Państwo polecają?
    note: چی توصیه می‌کنید؟ to naturalne, częste pytanie do kelnera.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: O co pyta kelner
    gloss: Co podać?
    note: چی میل دارید؟ to uprzejmy, standardowy sposób, w jaki kelner zaczyna przyjmowanie zamówienia.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Kebab z kurczaka
    gloss: kebab z kurczaka
    note: جوجه‌کباب (marynowany kurczak z grilla) to jedno z najpopularniejszych dań w irańskim menu.
    example_gloss: Zamawiam kebab z kurczaka.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: Kelner poleca danie
    gloss: Kebab z kurczaka jest dziś bardzo dobry.
    note: خوبه to potoczna, mówiona forma od خوب است, naturalna w swobodnym poleceniu kelnera.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Tak, proszę bardzo
    gloss: Tak, proszę bardzo.
    note: بله znaczy „tak”; بفرمایید (znane już z lekcji o taarof w jednostce 1) pada tu ponownie przy podawaniu komuś czegoś, np. menu.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Szklanka herbaty
    gloss: szklanka herbaty
    note: لیوان („szklanka”) to słowo liczące używane przy napojach podawanych w szklance.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Dwa kawałki chleba
    gloss: dwa kawałki chleba
    note: تا to słowo liczące, które stawia się po liczbie przy liczeniu większości zwykłych przedmiotów policzalnych, tu dwóch kawałków chleba.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Talerz ryżu
    gloss: talerz ryżu
    note: بشقاب („talerz”) to słowo liczące dla jedzenia podawanego na talerzu.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Pełne zamówienie
    gloss: Poproszę talerz ryżu i dwa kawałki chleba.
    note: Kilka określeń ilości można połączyć w jednym zamówieniu za pomocą و („i”).
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Słowo liczące تا
    gloss: 'تا stawia się po liczbie przy rzeczach policzalnych: دو تا (dwa), سه تا (trzy).'
    note: To ten sam ogólny wzorzec liczenia, który poznałeś przy liczbach w jednostce 3, tu zastosowany do zamawiania jedzenia.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: Rachunek
    gloss: rachunek
    note: صورت‌حساب to standardowe słowo oznaczające rachunek w restauracji.
    example_gloss: Rachunek, proszę.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Prośba o rachunek
    gloss: Czy mogę prosić o rachunek?
    note: صورت‌حساب رو لطف می‌کنید؟ to uprzejmy, naturalny sposób, by poprosić w restauracji o rachunek.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Powiedz, że jedzenie było pyszne
    gloss: Było bardzo smaczne.
    note: خیلی خوشمزه بود to naturalny komplement, który mówi się kelnerowi lub gospodarzowi po posiłku.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Smacznego
    gloss: Smacznego!
    note: نوش جان mówi się do osoby, która je lub zaraz zacznie jeść; odpowiada polskiemu „smacznego”, ale nie mówi tego osoba jedząca o własnym posiłku.
  fa.a1.unit06.lesson05.teach.chashm:
    title: Uprzejme potwierdzenie kelnera
    gloss: Już się robi.
    note: چشم، الان میارم to pełen szacunku sposób, w jaki obsługa potwierdza prośbę i zapowiada, że zaraz to przyniesie.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Restauracja
    gloss: restauracja
    note: رستوران to zwykłe słowo oznaczające restaurację, czyli miejsce akcji dialogu w tej jednostce.
    example_gloss: Ta restauracja jest dobra.
  fa.a1.unit06.lesson06.teach.turn01:
    title: Kelner wita klienta
    gloss: Kelner wita klienta i pyta, co chciałby zamówić.
    note: چی میل دارید؟ to to samo uprzejme pytanie otwierające z lekcji 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: Klient prosi o menu
    gloss: Klient wita kelnera i prosi o menu.
    note: منو دارید؟ rozpoczyna rozmowę o zamówieniu.
  fa.a1.unit06.lesson06.teach.turn03:
    title: Kelner podaje menu
    gloss: Kelner potwierdza i podaje menu.
    note: بفرمایید to to samo uprzejme słowo z jednostki 1; tutaj używane przy podawaniu komuś czegoś.
  fa.a1.unit06.lesson06.teach.turn04:
    title: Klient prosi o polecenie
    gloss: Klient pyta, co poleca kelner.
    note: چی توصیه می‌کنید؟ z lekcji 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: Kelner poleca danie
    gloss: Kelner mówi, że kebab z kurczaka jest dziś bardzo dobry.
    note: جوجه‌کباب امروز خیلی خوبه zawiera potoczną formę خوبه, naturalną w mówionych poleceniach.
  fa.a1.unit06.lesson06.teach.turn06:
    title: Klient składa pełne zamówienie
    gloss: Klient się zgadza i zamawia kebab z kurczaka z ryżem oraz herbatę.
    note: Użyto tu formy می‌خواستم, odpowiedniej wobec kelnera, którego klient osobiście nie zna.
  fa.a1.unit06.lesson06.teach.turn07:
    title: Kelner potwierdza zamówienie
    gloss: Kelner mówi, że zaraz to przyniesie.
    note: چشم، الان میارم z lekcji 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: Klient chwali jedzenie i prosi o rachunek
    gloss: Klient mówi, że było pyszne, i prosi o rachunek.
    note: Obie frazy wykorzystują słownictwo z lekcji 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: Kelner przynosi rachunek
    gloss: Kelner się zgadza i mówi, że zaraz przyniesie.
    note: البته („oczywiście”) to tu naturalna, uprzejma odpowiedź twierdząca.
