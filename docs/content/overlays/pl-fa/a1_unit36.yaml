  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Miły
    gloss: miły / życzliwy
    note: '*مهربون* opisuje kogoś życzliwego i ciepłego.'
    example_gloss: Sara jest bardzo miła.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Zabawny
    gloss: zabawny
    note: '*بامزه* opisuje kogoś zabawnego i pełnego uroku.'
    example_gloss: Nima jest zabawny.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Nieśmiały
    gloss: nieśmiały
    note: '*خجالتی* opisuje kogoś nieśmiałego.'
    example_gloss: On/ona jest trochę nieśmiały/nieśmiała.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Poważny
    gloss: poważny
    note: '*جدی* opisuje kogoś poważnego.'
    example_gloss: Nasz nauczyciel jest poważny.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Jak zrośnięte „jest” łączy się ze słowami opisującymi cechy
    gloss: on/ona jest miły/miła / zabawny/zabawna / nieśmiały/nieśmiała (zrośnięta spójka)
    note: '*مهربونه* powstaje przez bezpośrednie połączenie *مهربون* + *است*, bo *مهربون* kończy się na spółgłoskę. W *بامزه‌ست* przed *ست* pisze się półspację (ZWNJ), bo *بامزه* kończy się już na samogłoskę *ه*. W *خجالتیه* końcówka *ه* dołącza się wprost do słowa zakończonego na *ی*, tak samo jak w *قهوه‌ایه* z lekcji o wyglądzie.'
    target_text: مهربونه = مهربون + است (zlana forma „jest”, po spółgłosce) / بامزه‌ست = بامزه + است (po samogłosce, z ZWNJ) / خجالتیه = خجالتی + ه (po ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Bystry
    gloss: zaradny / bystry
    note: '*زرنگ* opisuje kogoś bystrego i zaradnego, zwłaszcza w praktycznych sprawach.'
    example_gloss: Maryam jest bardzo zaradna.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Leniwy
    gloss: leniwy
    note: '*تنبل* opisuje kogoś leniwego.'
    example_gloss: Dzisiaj jestem trochę leniwy/leniwa.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Pracowity
    gloss: pracowity
    note: '*زحمت‌کش* opisuje kogoś, kto ciężko pracuje i wkłada w to prawdziwy wysiłek.'
    example_gloss: Mój ojciec jest bardzo pracowity.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Cierpliwy
    gloss: cierpliwy
    note: '*صبور* opisuje kogoś cierpliwego.'
    example_gloss: Nasz nauczyciel jest bardzo cierpliwy.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Zaprzeczanie cechy charakteru
    gloss: on/ona nie jest leniwy/leniwa
    note: '*نیست* zaprzecza zrośniętą spójkę: *تنبل نیست* znaczy „on/ona nie jest leniwy/leniwa”. To samo *نیست* służyło już do zaprzeczania uczuć.'
    target_text: تنبل نیست (on/ona nie jest leniwy/a) -- نیست zaprzecza zlaną formę „jest”
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Osobowość
    gloss: osobowość
    note: '*شخصیت* znaczy „osobowość” lub „charakter”.'
    example_gloss: Jego/jej osobowość jest bardzo dobra.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Jaki ma charakter?
    gloss: Jaki ma charakter?
    note: '*چطوره؟* („jaki/jak jest…?”) znasz już z lekcji o powitaniach; *ش* to końcówka dzierżawcza „jego/jej” dodana do *شخصیت* („osobowość”).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: On/ona jest bardzo miły/miła i bystry/bystra
    gloss: On/ona jest bardzo miły/miła i bystry/bystra
    note: '*و* znaczy „i” i łączy dwa słowa opisujące cechy.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Jaki on/ona jest?
    gloss: Jaki on/ona jest?
    note: '*چه جوریه؟* to częsty potoczny sposób zapytania „jaki on/ona jest?”, alternatywa dla *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Osobowość / jaki jest...? / jaki/jaka jest...?
    gloss: osobowość / jaki/jak jest…? / jaki jest…?
    note: Te trzy wyrażenia pozwalają zapytać o czyjś charakter i go nazwać.
    target_text: شخصیت (charakter, osobowość) / چطوره؟ (jaki/jaka jest...?) / چه جوریه؟ (jaki/jaka jest...?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / wcale nie / tylko / fajny
    gloss: Nima / Sara / Maryam / wcale nie / tylko / fajny
    note: '*مریم* to przyjaciółka *سارا*, znana już z lekcji o wyglądzie. *اصلاً* znaczy „wcale nie”. *فقط* znaczy „tylko”. *باحال* znaczy „fajny”.'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Chciałbym/Chciałabym poznać ją lepiej
    gloss: Chciałbym/Chciałabym poznać ją lepiej
    note: '*بیشتر* znaczy „więcej”. *باهاش* znaczy „z nim/z nią”. *آشنا بشم* znaczy „żebym się zaznajomił/zaznajomiła, żebym poznał/poznała”.'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima: Saro, jaka jest Maryam?'
    gloss: Saro, jaka jest Maryam?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara: Jest bardzo miła i bystra.'
    gloss: Jest bardzo miła i bystra.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima: Nie jest leniwa?'
    gloss: Nie jest leniwa?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara: Nie, wcale nie, jest też bardzo pracowita. Jest tylko trochę nieśmiała.'
    gloss: Nie, wcale nie, jest też bardzo pracowita. Jest tylko trochę nieśmiała.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima: Fajnie, chciałbym ją lepiej poznać.'
    gloss: Fajnie, chciałbym ją lepiej poznać.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Czytanie: osobowość Maryam'
    gloss: Maryam jest przyjaciółką Sary. Jest bardzo miła i bystra. W pracy też jest pracowita i nigdy nie jest leniwa. Jest tylko trochę nieśmiała, dlatego w dużych grupach niewiele mówi.
    note: Tekst opisuje osobowość Maryam w trzeciej osobie, tymi samymi cechami, które pojawiły się w dialogu.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Nigdy (z czasownikiem w formie przeczącej)
    gloss: nigdy
    note: '*هیچ‌وقت* łączy się z czasownikiem w formie przeczącej (*نیست*, *نمی‌زنه*) i znaczy „nigdy”. Podobnie jak w polskim „nigdy nie jest”, mamy tu podwójne przeczenie.'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Myślę, że jestem bardzo pracowity/pracowita, ale jestem też trochę leniwy/leniwa
    gloss: Myślę, że jestem bardzo pracowity/pracowita, ale jestem też trochę leniwy/leniwa
    note: '*فکر می‌کنم* znaczy „myślę”. *زحمت‌کشم* to zrośnięte *زحمت‌کش* + *هستم* („jestem”). *هستم* to pełna, niezrośnięta forma „jestem”, użyta tu po *هم* („też”) dla podkreślenia.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Jaki masz charakter?
    gloss: Jaki masz charakter?
    note: W *شخصیتت* potoczna końcówka dzierżawcza *ت* („twój”) dołącza się do *شخصیت*; to wersja z rejestru *تو* odpowiadająca formie *شخصیتش*.
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Miły / zabawny / nieśmiały / poważny / bystry / leniwy / pracowity / cierpliwy
    gloss: miły / zabawny / nieśmiały / poważny / bystry / leniwy / pracowity / cierpliwy
    note: To osiem podstawowych słów opisujących charakter z tej lekcji.
