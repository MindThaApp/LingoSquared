  fa.a1.unit37.lesson05.teach.reading_text:
    title: 'Czytanka: Mój dom'
    gloss: Mój dom jest biały. W domu jest szary stół. Na stole leży czerwona książka i żółta książka. Mój kot też tam jest, jest pomarańczowy.
