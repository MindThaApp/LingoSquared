  fa.a1.unit37.lesson02.teach.khakestari:
    title: Szary
    gloss: szary
    note: '*خاکستری* opisuje coś, co jest szare.'
    example_gloss: Stół jest szary.
  fa.a1.unit37.lesson02.teach.review_negation:
    title: Samochód nie jest czarny, jest biały
    gloss: Samochód nie jest czarny, jest biały.
    note: '*نیست* tworzy formę przeczącą zrośniętej kopuły, znanej już z lekcji o emocjach. Wzór jest taki sam jak w *تنبل نیست* („on/ona nie jest leniwy/leniwa”) z lekcji o osobowości.'
    target_text: ماشین سیاه نیست، سفیده. (Samochód nie jest czarny, jest biały.) -- نیست neguje zrośniętą formę łącznika
  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: Jakiego to koloru?
    gloss: Jakiego to koloru?
    note: '*رنگش* to *رنگ* („kolor”) z dodaną końcówką dzierżawczą *ش* („jego/jej”), tak samo jak w *شخصیتش*/*موهاش*/*چشماش*. Zwrot *چیه؟* („co to jest?”) pojawił się już w lekcji o przedstawianiu się (*اسم شما چیه؟*).'
  fa.a1.unit37.lesson03.teach.che_rangiye:
    title: Jakiego to koloru? (wariant)
    gloss: Jakiego to koloru?
