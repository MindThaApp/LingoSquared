    title: Mój samochód jest niebieski
    gloss: Mój samochód jest niebieski.
    note: '*ماشینم* to *ماشین* („samochód”) z końcówką dzierżawczą *م* („mój”), tak samo jak w *اسمم*/*پدرم*.'
  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: Dwa sposoby pytania o kolor
    gloss: jakiego to koloru? / jakiego to koloru?
    note: '*رنگش چیه؟* i *چه رنگیه؟* zadają to samo pytanie i w potocznej mowie można ich używać zamiennie.'
    target_text: رنگش چیه؟ (jakiego to jest koloru? -- przyrostek dzierżawczy ش, tak samo jak w شخصیتش/موهاش/چشماش) / چه رنگیه؟ (inne sformułowanie, ten sam wzorzec co چه جوریه؟)
