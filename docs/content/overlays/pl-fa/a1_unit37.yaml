    title: Jaki kolor lubisz?
    gloss: Jaki kolor lubisz?
    note: '*چه رنگی* („jaki kolor”) + *دوست داری* („lubisz”, 2. osoba, znane z pytania *کدوم رو بیشتر دوست داری؟* w lekcji o upodobaniach).'
