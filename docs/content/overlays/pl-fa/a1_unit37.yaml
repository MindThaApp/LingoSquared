  fa.a1.unit37.lesson01.teach.review_known_colors:
    title: 'Znane już kolory: biały / czarny / czerwony / niebieski / zielony / brązowy'
    gloss: kolor / biały / czarny / czerwony / niebieski / zielony / brązowy
    note: '*رنگ* („kolor”), *سفید*, *سیاه*, *قرمز* i *آبی* były już w lekcji o ubraniach; *سبز* i *قهوه‌ای* były już w lekcji o wyglądzie. Ta lekcja korzysta z nich bez ponownego wprowadzania.'
    target_text: رنگ (kolor) / سفید (biały) / سیاه (czarny) / قرمز (czerwony) / آبی (niebieski) / سبز (zielony) / قهوه‌ای (brązowy) -- już znane z wcześniejszych lekcji
  fa.a1.unit37.lesson02.teach.banafsh:
    title: Fioletowy
    gloss: fioletowy
    note: '*بنفش* opisuje coś fioletowego.'
