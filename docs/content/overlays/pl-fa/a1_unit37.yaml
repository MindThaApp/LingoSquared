    gloss: Jakiego koloru jest twoja książka?
    note: '*کتابت* to *کتاب* („książka”) z dodaną nieformalną końcówką dzaimka dzierżawczego *ت* („twój/twoja”), czyli ten sam wzorzec, którego używa się w rejestrze *تو*, co w słowie *شخصیتت* z lekcji o osobowości.'
