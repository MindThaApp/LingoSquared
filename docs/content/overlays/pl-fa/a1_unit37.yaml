    title: 'Sara: Fioletowa. A jakiego koloru jest twój samochód?'
    gloss: Fioletowa. A jakiego koloru jest twój samochód?
  fa.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Nima: Niebieski. Bardzo lubię kolor niebieski.'
    gloss: Niebieski. Bardzo lubię kolor niebieski.
  fa.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Sara: Ja też lubię kolor fioletowy.'
    gloss: Ja też lubię kolor fioletowy.
  fa.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Nima: Super!'
