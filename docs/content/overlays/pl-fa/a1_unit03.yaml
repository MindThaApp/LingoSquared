course:
  title: Perski (farsi) A1
  description: 'Perski irański (farsi) dla początkujących: nauka czytania pisma, rozumienie codziennej mowy i grzeczne radzenie sobie w praktycznych rozmowach.'
units:
  fa.a1.unit03.numbers:
    title: Liczby
lessons:
  fa.a1.unit03.lesson01.zero_to_ten:
    title: Od zera do dziesięciu
  fa.a1.unit03.lesson02.eleven_to_ninety_nine:
    title: Od jedenastu do dziewięćdziesięciu dziewięciu
  fa.a1.unit03.lesson03.phone_numbers:
    title: Numery telefonów
  fa.a1.unit03.lesson04.ages_and_quantities:
    title: Wiek i ilości
  fa.a1.unit03.lesson05.prices:
    title: Ceny w tomanach
  fa.a1.unit03.lesson06.dialogue_phone_numbers:
    title: Wymiana numerów telefonów
teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Liczba
    gloss: numer
    note: عدد to ogólne słowo oznaczające liczbę.
    example_gloss: To jest liczba.
  fa.a1.unit03.lesson01.teach.zero:
    title: Zero
    gloss: 0 — zero
    note: صفر oznacza zero, także jako cyfra w dłuższej liczbie, np. w numerze telefonu.
    example_gloss: Zero jest liczbą.
  fa.a1.unit03.lesson01.teach.one:
    title: Jeden
    gloss: 1 — jeden
    note: یک to jeden.
    example_gloss: Mam jedną książkę.
  fa.a1.unit03.lesson01.teach.two:
    title: Dwa
    gloss: 2 — dwa
    note: دو to dwa.
    example_gloss: Mam dwa jabłka.
  fa.a1.unit03.lesson01.teach.three:
    title: Trzy
    gloss: 3 — trzy
    note: سه to trzy.
    example_gloss: On ma trzech braci.
  fa.a1.unit03.lesson01.teach.four:
    title: Cztery
    gloss: 4 — cztery
    note: چهار to cztery.
    example_gloss: Jest czwarta.
  fa.a1.unit03.lesson01.teach.five:
    title: Pięć
    gloss: 5 — pięć
    note: پنج to pięć.
    example_gloss: Poczekaj pięć minut.
  fa.a1.unit03.lesson01.teach.six:
    title: Sześć
    gloss: 6 — sześć
    note: شش to sześć.
    example_gloss: Są tu sześć krzeseł.
  fa.a1.unit03.lesson01.teach.seven:
    title: Siedem
    gloss: 7 — siedem
    note: هفت to siedem.
    example_gloss: Tydzień ma siedem dni.
  fa.a1.unit03.lesson01.teach.eight:
    title: Osiem
    gloss: 8 — osiem
    note: هشت to osiem.
    example_gloss: Zobaczymy się o ósmej.
  fa.a1.unit03.lesson01.teach.nine:
    title: Dziewięć
    gloss: 9 — dziewięć
    note: نه to dziewięć. Jest to też zwykłe słowo oznaczające „nie” — z kontekstu (np. gdy słyszysz je w liczeniu lub w liczbie) wynika, o które znaczenie chodzi.
    example_gloss: Jest tu dziewięcioro uczniów.
  fa.a1.unit03.lesson01.teach.ten:
    title: Dziesięć
    gloss: 10 — dziesięć
    note: ده to dziesięć.
    example_gloss: Mam dziesięć palców.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Jedenaście
    gloss: 11 — jedenaście
    note: یازده to jedenaście.
    example_gloss: O jedenastej mam zajęcia.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Dwanaście
    gloss: 12 — dwanaście
    note: دوازده to dwanaście.
    example_gloss: Rok ma dwanaście miesięcy.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Trzynaście
    gloss: 13 — trzynaście
    note: سیزده to trzynaście.
    example_gloss: Ma trzynaście lat.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Czternaście
    gloss: 14 — czternaście
    note: چهارده to czternaście.
    example_gloss: Przyjdę za czternaście dni.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Piętnaście
    gloss: 15 — piętnaście
    note: پانزده to piętnaście.
    example_gloss: Ma piętnaście książek.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Szesnaście
    gloss: 16 — szesnaście
    note: شانزده to szesnaście — nie da się tego wywnioskować z شش (sześć) + ده (dziesięć), więc warto nauczyć się tego jako osobnego słowa.
    example_gloss: Ma szesnaście lat.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Siedemnaście
    gloss: 17 — siedemnaście
    note: هفده to siedemnaście.
    example_gloss: Przyszło siedemnaście osób.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Osiemnaście
    gloss: 18 — osiemnaście
    note: هجده to osiemnaście.
    example_gloss: Ma osiemnaście lat.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Dziewiętnaście
    gloss: 19 — dziewiętnaście
    note: نوزده to dziewiętnaście.
    example_gloss: Zostało dziewiętnaście dni.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Dwadzieścia
    gloss: 20 — dwadzieścia
    note: بیست to dwadzieścia.
    example_gloss: Mam dwadzieścia książek.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Trzydzieści
    gloss: 30 — trzydzieści
    note: سی to trzydzieści.
    example_gloss: Ten miesiąc ma trzydzieści dni.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: Od czterdziestu do dziewięćdziesięciu
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود to pozostałe pełne dziesiątki.
    example_gloss:
    - On/ona ma czterdzieści lat.
    - Jest pięćdziesiąt krzeseł.
    - Sześćdziesiąt minut to jedna godzina.
    - Ta książka ma siedemdziesiąt stron.
    - On/ona ma osiemdziesiąt książek.
    - On/ona ma dziewięćdziesiąt lat.
  fa.a1.unit03.lesson02.teach.combining:
    title: Łączenie dziesiątek i jedności
    gloss: dwadzieścia pięć
    note: بیست و پنج to dosłownie „dwadzieścia i pięć” — dziesiątki, و, jedności.
  fa.a1.unit03.lesson03.teach.shomare:
    title: Numer
    gloss: numer
    note: شماره oznacza numer identyfikujący, np. telefonu lub domu; różni się od ogólnego znaczenia عدد, czyli „liczba”.
    example_gloss: To jest mój numer telefonu.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Telefon
    gloss: telefon
    note: تلفن oznacza telefony w ogóle, także komórkowe.
    example_gloss: Nie mam telefonu.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Zapytaj o numer telefonu
    gloss: Jaki jest twój numer telefonu?
    note: شماره تلفنتون چنده؟ to zwykły, uprzejmy sposób zapytania o numer telefonu. Podawanie numeru cyfra po cyfrze zawsze jest zrozumiałe i dla początkujących najbezpieczniejsze; w prawdziwej mowie normalne jest też łączenie cyfr w grupy, ale ta lekcja ćwiczy najpierw prostszą formę cyfra po cyfrze.
  fa.a1.unit03.lesson03.teach.chande:
    title: Ile to / jaki to?
    gloss: jaki to numer? / ile to kosztuje?
    note: چنده؟ to skrócone چند است i pyta o liczbę, ilość lub cenę, zależnie od kontekstu.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Czytanie numeru cyfra po cyfrze
    gloss: zero, dziewięć, jeden, dwa, trzy, cztery, pięć, sześć, siedem, osiem, osiem
    note: Ta lekcja ćwiczy czytanie numerów cyfra po cyfrze. Prawdziwy irański numer komórkowy ma 11 cyfr i zaczyna się od 0, np. 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: Rok
    gloss: rok
    note: سال oznacza zarówno rok kalendarzowy, jak i służy do podawania wieku.
    example_gloss: Mam dwadzieścia lat.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Ja (powtórka)
    gloss: ja
    note: Krótkie przypomnienie من („ja”), potrzebne, by pełnym zdaniem powiedzieć o swoim wieku.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Pytanie o wiek (nieformalnie)
    gloss: Ile masz lat?
    note: چند سالته؟ to forma nieformalna w liczbie pojedynczej; چند سالتونه؟ to jej grzeczna odpowiedniczka.
  fa.a1.unit03.lesson04.teach.salame:
    title: Podawanie swojego wieku
    gloss: Mam 25 lat.
    note: سالمه łączy z سال końcówkę dzierżawczą ـم („mój”), a potem potoczną spójkę ـه („jest”) — dosłownie „mój-rok-jest”.
  fa.a1.unit03.lesson04.teach.ta:
    title: Liczebnik pomocniczy do liczenia
    gloss: (słowo liczące, bez odpowiednika w polskim)
    note: 'تا to uniwersalne słowo liczące używane przy liczeniu większości przedmiotów: liczba + تا + rzeczownik.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Jabłko
    gloss: jabłko
    note: سیب to jabłko.
    example_gloss: Lubię jabłka.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Książka
    gloss: książka
    note: کتاب to książka.
    example_gloss: To dobra książka.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Poproś o ilość
    gloss: Poproszę dwa jabłka.
    note: دو تا سیب می‌خوام stawia liczbę przed rzeczownikiem, jak zwykle przy تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Cena
    gloss: cena
    note: قیمت to ogólne słowo oznaczające cenę.
    example_gloss: Ile to kosztuje?
  fa.a1.unit03.lesson05.teach.toman:
    title: Toman
    gloss: toman (irańska waluta w codziennym użyciu)
    note: Oficjalną walutą Iranu jest rial, ale w codziennej mowie ceny podaje się prawie zawsze w tomanach (1 toman = 10 riali).
    example_gloss: To kosztuje dziesięć tysięcy tomanów.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Tysiąc
    gloss: tysiąc
    note: هزار to tysiąc; ceny podaje się zwykle w tysiącach tomanów.
    example_gloss: Mam tysiąc tomanów.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Pytanie o cenę
    gloss: Ile to kosztuje?
    note: این چنده؟ to zwykły sposób zapytania o cenę czegoś, co masz przed sobą.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Podaj cenę
    gloss: To kosztuje 30 000 tomanów.
    note: تومنه to skrócone تومن است; pełny wzór to liczba + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara proponuje wspólne ćwiczenie
    gloss: Sara mówi, że chce razem z Miną ćwiczyć perski, i pyta o jej numer telefonu.
    note: باهم znaczy „razem”; می‌خوام ... تمرین کنیم znaczy „chcę, żebyśmy poćwiczyli” — samo تمرین کنیم jako pytanie może też znaczyć „poćwiczymy?”
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina podaje swój numer
    gloss: Mina się zgadza i czyta swój 11-cyfrowy numer cyfra po cyfrze.
    note: شماره‌ام to skrócone شماره من; هشته to skrócone هشت است i zamyka numer.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara sprawdza, czy dobrze zapisała
    gloss: Sara prosi Minę, by poczekała, aż zapisze numer, a potem czyta go na głos, żeby się upewnić.
    note: درسته؟ („czy to się zgadza?”) to częsty sposób sprawdzenia numeru lub informacji, którą się właśnie usłyszało.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina potwierdza i pyta o numer Sary
    gloss: Mina potwierdza, że numer się zgadza, i pyta o numer Sary.
    note: آره to nieformalne „tak”, bardziej potoczne niż بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara podaje swój numer
    gloss: Sara czyta swój 11-cyfrowy numer cyfra po cyfrze.
    note: یکه to skrócone یک است i kończy numer tak samo, jak هشته zakończyło numer Miny.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina zgadza się zadzwonić
    gloss: Mina mówi, że jutro zadzwoni do Sary.
    note: زنگ می‌زنم بهت znaczy „zadzwonię do ciebie” — dosłownie „uderzam w dzwonek do ciebie”.
