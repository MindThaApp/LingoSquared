    example_gloss: 그 사람은 조금 수줍음이 많아요.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: 진지한
    gloss: 진지한
    note: '*جدی*는 진지한 사람을 나타내요.'
    example_gloss: 우리 선생님은 진지하세요.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: 성격 단어에 줄어든 '이다'가 붙는 방법
    gloss: 그/그녀는 친절해요 / 재미있어요 / 수줍음이 많아요 (축약된 이다)
    note: '*مهربونه*는 *مهربون*이 자음으로 끝나기 때문에 *مهربون*과 *است*가 바로 합쳐진 형태예요. *بامزه‌ست*는 *بامزه*가 이미 모음 *ه*로 끝나기 때문에 *ست* 앞에 ZWNJ(반공백)를 써서 붙여요. *خجالتیه*는 *ی*로 끝나는 단어에 *ه*를 바로 붙인 형태로, 외모 단원의 *قهوه‌ایه*와 같은 방식이에요.'
    target_text: مهربونه = مهربون + است (줄어든 '이다', 자음으로 끝날 때) / بامزه‌ست = بامزه + است (모음으로 끝날 때, ZWNJ 사용) / خجالتیه = خجالتی + ه (ی로 끝날 때)
  fa.a1.unit36.lesson02.teach.zerang:
    title: 똑똑한
    gloss: 똑똑한
    note: '*زرنگ*는 똑똑하고 영리한 사람, 특히 실속 있고 요령 좋은 사람을 나타내요.'
    example_gloss: 마리암은 정말 똑똑해요.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: 게으른
    gloss: 게으른
    note: '*تنبل*은 게으른 사람을 나타내요.'
    example_gloss: 오늘은 좀 게을러요.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: 부지런한
    gloss: 부지런한
    note: '*زحمت‌کش*는 열심히 일하고 진짜 노력하는 사람을 나타내요.'
    example_gloss: 우리 아버지는 아주 부지런하세요.
  fa.a1.unit36.lesson02.teach.sabur:
    title: 인내심 있는
    gloss: 인내심 있는
    note: '*صبور*는 인내심이 있는 사람을 나타내요.'
    example_gloss: 우리 선생님은 아주 참을성이 많아요.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: 성격 특징 부정하기
    gloss: 게으르지 않아요
    note: '*نیست*는 축약된 이다를 부정해요. *تنبل نیست*는 ''그/그녀는 게으르지 않아요''라는 뜻이고, 감정을 부정할 때 이미 배운 *نیست*와 같아요.'
    target_text: تنبل نیست (그 사람은 게으르지 않아요)
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: 성격
    gloss: 성격
    note: '*شخصیت*은 ''성격'' 또는 ''인격''이라는 뜻이에요.'
    example_gloss: 그/그녀의 성격은 매우 좋아요.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: 그 사람 성격이 어때요?
    gloss: 그 사람 성격이 어때요?
    note: '*چطوره؟*(''어때요?'')는 인사 단원에서 이미 배웠어요. *ش*는 ''그/그녀의''를 뜻하는 소유 접미사로, *شخصیت*(''성격'')에 붙어요.'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: 그/그녀는 정말 친절하고 똑똑해요
    gloss: 그/그녀는 정말 친절하고 똑똑해요
    note: '*و*는 ''그리고''라는 뜻으로, 성격을 나타내는 두 단어를 이어 줘요.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: 그 사람은 어떤 사람이에요?
    gloss: 그 사람은 어떤 사람이에요?
    note: '*چه جوریه؟*는 ''그/그녀는 어떤 사람이에요?''라고 물을 때 쓰는 흔한 구어체 표현으로, *شخصیتش چطوره؟* 대신 쓸 수 있어요.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: 성격 / ~은 어때요? / ~은 어떤 사람이에요?
    gloss: 성격 / ~은 어때요? / ~은 어떤 사람이에요?
    note: 이 세 가지 표현으로 다른 사람의 성격을 묻고 말할 수 있어요.
    target_text: شخصیت (성격) / چطوره؟ (어때요?) / چه جوریه؟ (어떤 사람이에요?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: 니마 / 사라 / 마리암 / 전혀 / 단지 / 멋진
    gloss: 니마 / 사라 / 마리암 / 전혀 / 단지 / 멋진
    note: '*مریم*은 *سارا*의 친구로, 외모 단원에서 이미 나왔어요. *اصلاً*는 ''전혀''라는 뜻이에요. *فقط*는 ''단지, 오직''이라는 뜻이에요. *باحال*은 ''멋진, 괜찮은''이라는 뜻이에요.'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: 그녀와 더 친해지고 싶어요
    gloss: 그녀와 더 친해지고 싶어요
    note: '*بیشتر*는 ''더''라는 뜻이에요. *باهاش*는 ''그/그녀와 함께''라는 뜻이에요. *آشنا بشم*은 ''알게 되다, 친해지다''라는 뜻이에요.'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: '니마: 사라, 마리암은 어떤 사람이에요?'
    gloss: 사라, 마리암은 어떤 사람이에요?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: '사라: 정말 친절하고 똑똑해요.'
    gloss: 정말 친절하고 똑똑해요.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: '니마: 게으르지 않아요?'
    gloss: 게으르지 않아요?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: '사라: 아니요, 전혀요. 정말 부지런하기도 해요. 단지 좀 수줍음이 많아요.'
    gloss: 아니요, 전혀요. 정말 부지런하기도 해요. 단지 좀 수줍음이 많아요.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: '니마: 멋지네요. 그녀와 더 친해지고 싶어요.'
    gloss: 멋지네요. 그녀와 더 친해지고 싶어요.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: '읽기: 마리암의 성격'
    gloss: 마리암은 사라의 친구예요. 정말 친절하고 똑똑해요. 일도 열심히 하고, 절대 게으르지 않아요. 단지 좀 수줍음이 많아서 큰 모임에서는 말을 많이 하지 않아요.
    note: 이 글은 대화에 나온 것과 같은 특징으로 마리암의 성격을 3인칭으로 설명해요.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: 절대 ~ 않다 (부정 동사와 함께)
    gloss: 전혀 하지 않다
    note: '*هیچ‌وقت*는 부정 동사(*نیست*, *نمی‌زنه*)와 함께 써서 ''절대 ~ 않다''라는 뜻을 나타내요. 한국어에서 ''절대, 한 번도''가 ''~지 않다''와 함께 쓰이는 것과 같은 방식이에요.'
  fa.a1.unit36.lesson06.teach.self_description:
    title: 저는 정말 부지런하다고 생각하는데, 좀 게으르기도 해요
    gloss: 저는 정말 부지런하다고 생각하는데, 좀 게으르기도 해요
    note: '*فکر می‌کنم*은 ''~라고 생각해요''라는 뜻이에요. *زحمت‌کشم*은 *زحمت‌کش* + *هستم*(''저는 ~예요'')이 합쳐진 형태예요. *هستم*은 ''저는 ~예요''의 합치지 않은 완전한 형태로, 여기서는 *هم*(''~도'') 뒤에서 강조하기 위해 쓰였어요.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: 당신 성격은 어때요?
    gloss: 당신 성격은 어때요?
    note: '*شخصیتت*은 *شخصیت*에 ''너의''를 뜻하는 구어체 소유 접미사 *ت*를 붙인 것으로, *شخصیتش*의 *تو* 말투 버전이에요.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: 친절한 / 재미있는 / 수줍음이 많은 / 진지한 / 똑똑한 / 게으른 / 부지런한 / 인내심 있는
    gloss: 친절한 / 재미있는 / 수줍음이 많은 / 진지한 / 똑똑한 / 게으른 / 부지런한 / 인내심 있는
    note: 이 단원의 핵심 성격 단어 여덟 개예요.
