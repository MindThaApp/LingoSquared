    title: 인사와 첫 만남
lessons:
  fa.a1.unit01.lesson01.script_ramp:
    title: 첫 페르시아어 단어 읽기
  fa.a1.unit01.lesson02.everyday_greetings:
    title: 일상 인사말
  fa.a1.unit01.lesson03.time_and_farewells:
    title: 하루 중 인사와 작별 인사
  fa.a1.unit01.lesson04.formal_informal_wellbeing:
    title: 공손한 인사와 편한 일상 대화
  fa.a1.unit01.lesson05.taarof_basics:
    title: 타아로프 첫걸음
  fa.a1.unit01.lesson06.first_meeting_dialogue:
    title: 첫 만남 대화
teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: 페르시아어는 오른쪽에서 왼쪽으로 써요
    gloss: 페르시아어는 오른쪽에서 왼쪽으로 써요.
    note: 페르시아어는 오른쪽 끝에서 왼쪽으로 읽어요.
  fa.a1.unit01.lesson01.teach.seen:
    title: 글자 س
    gloss: s
    note: س는 보통 s 소리를 나타내요.
  fa.a1.unit01.lesson01.teach.lam:
    title: 글자 ل
    gloss: l
    note: ل는 l 소리를 나타내고 앞뒤 글자와 이어 써요.
  fa.a1.unit01.lesson01.teach.alef:
    title: 글자 ا
    gloss: ā / a
    note: ا는 흔히 긴 ā 소리를 나타내고, 뒤의 글자와는 이어지지 않아요.
  fa.a1.unit01.lesson01.teach.mim:
    title: 글자 م
    gloss: m
    note: م은 m 소리를 나타내고, 이어 쓸 때 모양이 바뀌어요.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: سلام 만들기
    gloss: 안녕하세요
    note: سلام은 salâm이라고 읽어요. 페르시아어 표기에서는 짧은 모음을 보통 쓰지 않아요.
    example_gloss: 안녕하세요! 저는 니마예요.
  fa.a1.unit01.lesson02.teach.salam:
    title: 안녕하세요
    gloss: 안녕하세요
    note: سلام은 격식을 차리는 상황과 편한 상황 모두에서 쓸 수 있어요.
    example_gloss: 안녕하세요, 잘 지내세요?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: 좋은 아침이에요
    gloss: 좋은 아침이에요
    note: صبح بخیر는 무난하고 공손한 아침 인사예요.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: 좋은 오후 또는 저녁이에요
    gloss: 좋은 오후예요 / 좋은 저녁이에요
    note: عصر بخیر는 늦은 오후부터 저녁까지 쓰는 인사예요.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: 작별 인사
    gloss: 안녕히 가세요
    note: خداحافظ는 khodâhâfez라고 읽고, 가장 일반적인 작별 인사예요.
    example_gloss: 안녕히 가세요, 나중에 봐요!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: 고맙습니다
    gloss: 고맙습니다
    note: ممنون은 흔히 쓰는 자연스러운 말이에요. متشکرم은 조금 더 격식 있는 표현이에요.
    example_gloss: 정말 고맙습니다.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: 천만에요
    gloss: 천만에요
    note: خواهش می‌کنم은 감사 인사에 대한 기본적인 대답이에요.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: 안녕하세요? 공손한 구어체
    gloss: 안녕하세요?
    note: حالتون چطوره؟는 이란 페르시아어에서 무난하고 공손한 구어체예요. حال شما چطور است؟는 더 격식 있는 문어체 표현이에요.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: 잘 지내요
    gloss: 잘 지내요
    note: خوبم은 خوب에 1인칭 어미 ـم이 붙은 말이에요.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: 좋은 하루
    gloss: 좋은 하루 되세요
    note: روز بخیر는 공손하지만, 편한 대화에서는 سلام보다 덜 자주 써요.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: 안녕히 주무세요
    gloss: 잘 자요
    note: شب بخیر는 보통 헤어질 때나 잠자리에 들기 전에 하는 인사이고, 만나서 하는 첫인사로는 쓰지 않아요.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: 환영해요
    gloss: 환영해요
    note: خوش آمدید는 손님 한 명 또는 여러 명에게 쓰는 공손한 표현이에요.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: 또 만나길 바라요
    gloss: 또 만나길 바라요 / 다시 만날 때까지
    note: به امید دیدار는 세련되고 무난하며 공손한 작별 인사예요.
  fa.a1.unit01.lesson03.teach.fealan:
    title: 일단 안녕
    gloss: 일단 안녕, 이따 봐요
    note: فعلاً는 구어체이고 خداحافظ보다 덜 격식적이에요.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: 좋은 하루 보내세요
    gloss: 좋은 하루 보내세요
    note: 이 고정된 작별 인사에서 باشید는 공손한 형태를 나타내요.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: 무난하고 공손한 구어체
    gloss: 안녕하세요?
    note: 처음 만난 어른이나 일반적인 공손한 대화에서는 حالتون چطوره؟를 쓰세요. 격식 있는 문어체 표현은 حال شما چطور است؟예요.
  fa.a1.unit01.lesson04.teach.informal_question:
    title: 편한 표현
    gloss: 안녕하세요?
    note: چطوری؟는 구어체로, 관계가 허락한다면 친구, 가족, 또래에게 쓸 수 있어요.
  fa.a1.unit01.lesson04.teach.to:
    title: 격식 없는 '너'
    gloss: 너
    note: تو는 단수이고 편한 말투예요. 처음 만난 어른에게는 쓰지 마세요.
  fa.a1.unit01.lesson04.teach.very_well:
    title: 아주 잘 지내요
    gloss: 아주 잘 지내요
    note: خیلی는 خوبم의 뜻을 강조해요.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: 나쁘지 않아요
    gloss: 나쁘지 않아요, 감사합니다
    note: بد نیستم은 불평이 아니라 적당히 괜찮다는 뜻의 자연스러운 대답이에요.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: 당신은요? 공손한 표현
    gloss: 당신은요?
    note: 공손하게 되물을 때는 شما چطور؟를 쓰세요.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: 너는 어때? 친근한 표현
    gloss: 당신은요?
    note: تو چطور؟는 편한 사이에 어울려요.
  fa.a1.unit01.lesson05.teach.chai:
    title: 차
    gloss: 차
    note: '*چای*는 마시는 차예요. *چای بفرمایید*(차 드세요)라는 권유에서 자주 들을 거예요.'
    example_gloss: 자, 차 드시겠어요?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: 자, 그렇게 하세요
    gloss: 어서 하세요 / 드세요 / 여기 있습니다
    note: '*بفرمایید*는 상황에 따라 뜻이 달라져요. 차를 내밀 때는 ''여기 있습니다'', 문 앞에서는 ''들어오세요'', 길을 양보할 때는 ''먼저 가세요''라는 뜻이 될 수 있어요.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: 과분한 말씀이에요
    gloss: 정말 친절하세요
    note: لطف دارید는 칭찬에 공손하게 답할 때 써요.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: 수고하지 마세요
    gloss: 애쓰지 않으셔도 돼요
    note: زحمت نکشید는 진심 어린 거절일 수도 있고, 구체적인 권유에 대한 공손한 첫 대답일 수도 있어요.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: 친절에 감사드려요
    gloss: 친절에 감사드려요
    note: ممنون만 말할 때보다 더 따뜻하고 감사의 뜻이 분명하게 드러나요.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: 타아로프
    gloss: 상황에 따라 달라지는 이란식 예절
    note: 타아로프는 권하고, 사양하고, 감사하고, 존중을 표현할 때 상황에 따라 달라지는 예절 관습이에요. 관계, 세대, 지역, 상황에 따라 다르고, 몇 번 거절하거나 되풀이하느냐로 권유가 진심인지 정해지지는 않아요.
  fa.a1.unit01.lesson06.teach.line01:
    title: 환영해요
    gloss: 알리가 나르게스를 맞이해요.
    note: 자기소개에 앞서 먼저 인사로 대화를 시작해요.
  fa.a1.unit01.lesson06.teach.line02:
    title: 환영 인사에 답하기
    gloss: 나르게스가 인사를 받고 감사를 표해요.
    note: ممنون(감사합니다)은 환영 인사에 대한 자연스러운 대답이에요.
  fa.a1.unit01.lesson06.teach.line03:
    title: 이름 주고받기
    gloss: 알리가 자신이 누구인지 말해요.
    note: '*من علی هستم*은 ''저는 알리예요''라는 뜻이에요. *هستم*(이에요)은 문장 끝에 와요.'
  fa.a1.unit01.lesson06.teach.line04:
    title: 이름 주고받기, 대답
    gloss: 나르게스가 자신이 누구인지 말해요.
    note: 알리가 방금 쓴 *من ... هستم* 패턴과 같아요.
  fa.a1.unit01.lesson06.teach.line05:
    title: 처음 뵙겠습니다
    gloss: 알리가 만나서 반갑다고 말해요.
    note: '*خوشوقتم*은 ''기뻐요''라는 뜻이에요. *از آشنایی با شما*와 함께 쓰면 처음 만났을 때 하는 표준적인 공손한 인사가 돼요.'
  fa.a1.unit01.lesson06.teach.line06:
    title: 만나서 반갑다는 말에 답하기
    gloss: 나르게스가 같은 마음이라고 답해요.
    note: 이 대답에서 همین‌طور는 '마찬가지로'라는 뜻이에요.
  fa.a1.unit01.lesson06.teach.line07:
    title: 안부 묻기
    gloss: 알리가 공손하게 안부를 물어요.
    note: 처음 만난 공손한 자리라서 알리는 무난하고 공손한 구어체 ـتون 형태를 써요.
  fa.a1.unit01.lesson06.teach.line08:
    title: 안부 묻기에 답하기
    gloss: 나르게스가 대답하고 같은 질문을 되물어요.
    note: شما چطور؟는 같은 질문을 그대로 되묻는 흔한 줄임 표현이에요.
  fa.a1.unit01.lesson06.teach.line09:
    title: 초대
    gloss: 알리가 자기도 잘 지낸다고 말하고 나르게스를 안으로 초대해요.
    note: '*بفرمایید داخل*은 ''안으로 들어오세요''라는 뜻이에요. *داخل*(안)은 무엇을 권하는지 보여 줘요.'
  fa.a1.unit01.lesson06.teach.line10:
    title: 공손한 거절
    gloss: 나르게스가 감사를 표하고 가야 한다고 설명해요.
    note: 공손하게 거절할 때도 거절에 앞서 먼저 감사를 말해요. *ولی باید برم*은 '하지만 가야 해요'라는 뜻이에요.
  fa.a1.unit01.lesson06.teach.line11:
    title: 대화 마무리
    gloss: 알리가 그녀의 대답을 받아들이고 다시 만나길 바라요.
    note: 초대를 사양한 뒤라 자연스럽게 작별 인사로 이어져요.
  fa.a1.unit01.lesson06.teach.line12:
    title: 대화 마무리, 대답
    gloss: 나르게스가 작별 인사를 해요.
    note: '*خداحافظ*는 가장 일반적인 작별 인사예요.'
exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
    instruction: 페르시아어 단어 salâm을 고르세요.
    correct_option: سلام
    distractors:
    - سام
    - لام
    - ماس
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام은 salâm을 완전하게 적은 단어예요.
  fa.a1.unit01.lesson01.exercise02.recognize_seen:
    instruction: s 소리가 나는 글자는 무엇일까요?
    correct_option: س
    distractors:
    - ل
    - ا
    - م
    accepted_answers:
    - value: س
      status: correct
    feedback: س는 s 소리를 나타내요.
  fa.a1.unit01.lesson01.exercise03.recognize_lam:
    instruction: l 소리가 나는 글자는 무엇일까요?
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: ل는 l 소리를 나타내요.
  fa.a1.unit01.lesson01.exercise04.build_salam:
    instruction: 글자를 순서대로 배열해 سلام을 만드세요.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: 글자를 순서대로 놓으면 سلام이 돼요.
  fa.a1.unit01.lesson01.exercise05.select_missing_lam:
    instruction: 빠진 페르시아어 글자를 고르세요.
    correct_option: ل
    distractors:
    - س
    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: 빠진 글자는 ل입니다.
  fa.a1.unit01.lesson01.exercise06.match_letters:
    instruction: 각 페르시아어 글자를 대략적인 라틴 문자 소리와 연결하세요.
    accepted_answers:
    - value:
        س: s
        ل: l
        ا: ā
        م: m
      status: correct
    feedback: 이 네 가지 연결이 모여 سلام이 됩니다.
    pairs:
    - left: س
      right: s
    - left: ل
      right: l
    - left: ا
      right: ā
    - left: م
      right: m
  fa.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: 이 페르시아어 단어는 오른쪽에서부터 읽나요?
    correct_option: 네
    distractors:
    - 아니요
    accepted_answers:
    - value: 네
      status: correct
    feedback: 페르시아어는 오른쪽에서 왼쪽으로 읽습니다.
  fa.a1.unit01.lesson01.exercise08.romanize_salam:
    instruction: سلام의 일반적인 라틴 문자 표기를 입력하세요.
    answer_language_code: en
    accepted_answers:
    - value: salam
      status: correct
    - value: salâm
      status: correct
    - value: salām
      status: correct
    - value: salaam
      status: acceptable_with_note
      note: 라틴 문자로 흔히 쓰는 표기입니다.
    feedback: 과정에서 쓰는 표기는 salâm이며, salam과 salām도 정답으로 인정됩니다.
  fa.a1.unit01.lesson02.exercise01.recognize_salam_reading:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 안녕하세요
    distractors:
    - 안녕히 가세요
    - 고맙습니다
    - 좋은 아침이에요
    accepted_answers:
    - value: 안녕하세요
      status: correct
    feedback: سلام은 '안녕하세요'라는 뜻입니다.
  fa.a1.unit01.lesson02.exercise02.recognize_morning_reading:
    instruction: 이 인사말은 무슨 뜻일까요?
    correct_option: 좋은 아침이에요
    distractors:
    - 좋은 오후예요 / 좋은 저녁이에요
    - 안녕히 가세요
    - 안녕하세요
    accepted_answers:
    - value: 좋은 아침이에요
      status: correct
    feedback: صبح بخیر는 무난하고 공손한 아침 인사입니다.
  fa.a1.unit01.lesson02.exercise03.goodbye_meaning:
