teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: 숫자
    gloss: 번호
    note: عدد는 '수, 숫자'를 뜻하는 일반적인 단어예요.
    example_gloss: 이것은 숫자예요.
  fa.a1.unit03.lesson01.teach.zero:
    title: 영
    gloss: 0 — 영
    note: صفر는 0을 뜻하며, 전화번호 같은 긴 숫자 안의 숫자 0에도 쓰여요.
    example_gloss: 영은 숫자예요.
  fa.a1.unit03.lesson01.teach.one:
    title: 일
    gloss: 1 — 일, 하나
    note: یک는 하나(1)예요.
    example_gloss: 저는 책이 한 권 있어요.
  fa.a1.unit03.lesson01.teach.two:
    title: 이
    gloss: 2 — 이, 둘
    note: دو는 둘(2)이에요.
    example_gloss: 사과가 두 개 있어요.
  fa.a1.unit03.lesson01.teach.three:
    title: 삼
    gloss: 3 — 삼, 셋
    note: سه는 셋(3)이에요.
    example_gloss: 그에게는 형제가 세 명 있어요.
  fa.a1.unit03.lesson01.teach.four:
    title: 사
    gloss: 4 — 사, 넷
    note: چهار는 넷(4)이에요.
    example_gloss: 4시예요.
  fa.a1.unit03.lesson01.teach.five:
    title: 오
    gloss: 5 — 오, 다섯
    note: پنج는 다섯(5)이에요.
    example_gloss: 5분 기다리세요.
  fa.a1.unit03.lesson01.teach.six:
    title: 육
    gloss: 6 — 육, 여섯
    note: شش는 여섯(6)이에요.
    example_gloss: 의자가 여섯 개 있어요.
  fa.a1.unit03.lesson01.teach.seven:
    title: 칠
    gloss: 7 — 칠, 일곱
    note: هفت는 일곱(7)이에요.
    example_gloss: 일주일은 7일이에요.
  fa.a1.unit03.lesson01.teach.eight:
    title: 팔
    gloss: 8 — 팔, 여덟
    note: هشت는 여덟(8)이에요.
    example_gloss: 8시에 뵐게요.
  fa.a1.unit03.lesson01.teach.nine:
    title: 구
    gloss: 9 — 구, 아홉
    note: نه는 아홉(9)이에요. '아니요'를 뜻하는 일반적인 말이기도 해요. 숫자를 세거나 숫자 안에서 들리면 문맥으로 어느 뜻인지 구별할 수 있어요.
    example_gloss: 여기 학생이 아홉 명 있어요.
  fa.a1.unit03.lesson01.teach.ten:
    title: 십
    gloss: 10 — 십, 열
    note: ده는 열(10)이에요.
    example_gloss: 저는 손가락이 열 개 있어요.
  fa.a1.unit03.lesson02.teach.eleven:
    title: 십일
    gloss: 11 — 십일, 열하나
    note: یازده는 11이에요.
    example_gloss: 11시에 수업이 있어요.
  fa.a1.unit03.lesson02.teach.twelve:
    title: 십이
    gloss: 12 — 십이, 열둘
    note: دوازده는 12예요.
    example_gloss: 1년은 12개월이에요.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: 십삼
    gloss: 13 — 십삼, 열셋
    note: سیزده는 13이에요.
    example_gloss: 그는/그녀는 열세 살이에요.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: 십사
    gloss: 14 — 십사, 열넷
    note: چهارده는 14예요.
    example_gloss: 14일 뒤에 올게요.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: 십오
    gloss: 15 — 십오, 열다섯
    note: پانزده는 15예요.
    example_gloss: 그는/그녀는 책이 열다섯 권 있어요.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: 십육, 열여섯
    gloss: 16 — 십육, 열여섯
    note: شانزده는 16이에요. شش(6)와 ده(10)를 합친 형태에서 예상할 수 없으니 하나의 단어로 외워 두는 게 좋아요.
    example_gloss: 그는/그녀는 열여섯 살이에요.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: '17'
    gloss: 17 — 십칠, 열일곱
    note: هفده는 17이에요.
    example_gloss: 열일곱 명이 왔어요.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: '18'
    gloss: 18 — 십팔, 열여덟
    note: هجده는 18이에요.
    example_gloss: 그는/그녀는 열여덟 살이에요.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: '19'
    gloss: 19 — 십구, 열아홉
    note: نوزده는 19예요.
    example_gloss: 19일 남았어요.
  fa.a1.unit03.lesson02.teach.twenty:
    title: 이십
    gloss: 20 — 이십, 스물
    note: بیست는 20이에요.
    example_gloss: 저는 책이 스무 권 있어요.
  fa.a1.unit03.lesson02.teach.thirty:
    title: 삼십
    gloss: 30 — 삼십, 서른
    note: سی는 30이에요.
    example_gloss: 이번 달은 30일까지 있어요.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: 40부터 90까지
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود는 나머지 십 단위 수예요.
    example_gloss:
    - 그는/그녀는 마흔 살이에요.
    - 의자가 쉰 개 있어요.
    - 60분은 1시간이에요.
    - 이 책은 70쪽이에요.
    - 그는/그녀는 책이 여든 권 있어요.
    - 그는/그녀는 아흔 살이에요.
  fa.a1.unit03.lesson02.teach.combining:
    title: 십 단위와 일 단위 합치기
    gloss: '25'
    note: بیست و پنج는 문자 그대로 '20 그리고 5'이며, 십 단위 말, و, 일 단위 말의 순서예요.
  fa.a1.unit03.lesson03.teach.shomare:
    title: 번호
    gloss: 번호
    note: شماره는 전화번호나 집 번지처럼 무언가를 식별하는 번호에 쓰여요. 일반적인 '수'를 뜻하는 عدد와는 달라요.
    example_gloss: 이것은 제 전화번호예요.
  fa.a1.unit03.lesson03.teach.telefon:
    title: 전화
    gloss: 전화기 / 전화
    note: تلفن은 휴대전화를 포함해 전화기 전반을 가리켜요.
    example_gloss: 저는 전화기가 없어요.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: 전화번호 묻기
    gloss: 전화번호가 뭐예요?
    note: شماره تلفنتون چنده؟는 전화번호를 물을 때 쓰는 일반적인 공손한 표현이에요. 숫자를 한 자리씩 읽으면 항상 알아듣기 때문에 초보자에게 가장 안전한 방법이에요. 실제 대화에서는 숫자를 묶어서 읽기도 하지만, 이번 수업에서는 더 쉬운 한 자리씩 읽기부터 연습해요.
  fa.a1.unit03.lesson03.teach.chande:
    title: 얼마예요? / 뭐예요?
    gloss: 몇이에요? / 얼마예요?
    note: چنده؟는 چند است의 줄임말이에요. 상황에 따라 번호, 수량, 가격을 물어요.
  fa.a1.unit03.lesson03.teach.read_number:
    title: 숫자를 한 자리씩 읽기
    gloss: 영, 구, 일, 이, 삼, 사, 오, 육, 칠, 팔, 팔
    note: '이번 수업에서는 숫자를 한 자리씩 읽는 연습을 해요. 실제 이란 휴대전화 번호는 11자리이고 0으로 시작해요. 예: 0912 345 6788.'
  fa.a1.unit03.lesson04.teach.sal:
    title: 해, 연도
    gloss: 해, 년, 살
    note: سال은 달력의 연도와 나이를 셀 때 모두 써요.
    example_gloss: 저는 스무 살이에요.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: 나 (복습)
    gloss: 나
    note: من을 간단히 복습해요. 나이를 완전한 문장으로 말할 때 필요해요.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: 나이 묻기 (친근한 말투)
    gloss: 몇 살이에요?
    note: چند سالته؟는 친근한 단수 표현이고, چند سالتونه؟는 공손한 표현이에요.
  fa.a1.unit03.lesson04.teach.salame:
    title: 나이 말하기
    gloss: 저는 25살이에요.
    note: سالمه는 سال에 소유 어미 ـم(내)을 바로 붙이고, 구어체 이다 어미 ـه를 더한 형태예요. 직역하면 "나의 나이이다"예요.
  fa.a1.unit03.lesson04.teach.ta:
    title: 세는 단위 (분류사)
    gloss: (개수를 셀 때 쓰는 말, 한국어의 '개'와 비슷해요)
    note: تا는 대부분의 사물을 셀 때 쓰는 범용 단위어예요. 수 + تا + 명사 순서로 써요.
  fa.a1.unit03.lesson04.teach.sib:
    title: 사과
    gloss: 사과
    note: سیب는 사과예요.
    example_gloss: 저는 사과를 좋아해요.
  fa.a1.unit03.lesson04.teach.ketab:
    title: 책
    gloss: 책
    note: کتاب는 책이에요.
    example_gloss: 이건 좋은 책이에요.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: 수량 요청하기
    gloss: 사과 두 개 주세요.
    note: دو تا سیب می‌خوام은 تا를 쓸 때 늘 그렇듯 센 수량을 명사 앞에 둬요.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: 가격
    gloss: 가격
    note: قیمت은 가격을 뜻하는 일반적인 단어예요.
    example_gloss: 이것의 가격이 얼마예요?
  fa.a1.unit03.lesson05.teach.toman:
    title: 토만
    gloss: 토만 (이란의 화폐, 일상에서 쓰는 단위)
    note: 이란의 공식 화폐는 리알이지만, 일상 대화에서는 거의 항상 토만으로 가격을 말해요 (1토만 = 10리알).
    example_gloss: 이건 1만 토만이에요.
  fa.a1.unit03.lesson05.teach.hezar:
    title: 천
    gloss: 천
    note: هزار는 천이에요. 가격은 보통 몇천 토만 단위로 말해요.
    example_gloss: 저는 1000토만이 있어요.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: 가격 묻기
    gloss: 이거 얼마예요?
    note: این چنده؟는 눈앞에 있는 물건의 가격을 물을 때 쓰는 일반적인 표현이에요.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: 가격 말하기
    gloss: 3만 토만이에요.
    note: تومنه는 تومن است의 줄임말이에요. 전체 형태는 수 + هزار + تومنه예요.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: 사라가 함께 연습하자고 제안해요
    gloss: 사라는 함께 페르시아어를 연습하고 싶다며 미나의 전화번호를 물어요.
    note: باهم은 '함께'라는 뜻이고, می‌خوام ... تمرین کنیم은 '우리가 연습하면 좋겠어요'라는 뜻이에요. تمرین کنیم만 의문문으로 쓰면 '연습할까요?'라는 뜻도 될 수 있어요.
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: 미나가 번호를 알려줘요
    gloss: 미나는 좋다고 하며 11자리 번호를 한 자리씩 읽어줘요.
    note: شماره‌ام은 شماره من의 줄임말이고, هشته는 هشت است의 줄임말로 숫자 읽기를 마무리해요.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: 사라가 제대로 적었는지 확인해요
    gloss: 사라는 번호를 적을 동안 기다려 달라고 한 뒤, 확인하려고 번호를 다시 읽어요.
    note: درسته؟('맞아요?')는 방금 들은 번호나 정보를 확인할 때 자주 쓰는 표현이에요.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: 미나가 맞다고 하고 되물어요
    gloss: 미나는 맞다고 확인해 주고 사라의 번호를 물어요.
    note: آره는 친근한 '네'로, بله보다 더 편한 말이에요.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: 사라가 번호를 알려줘요
    gloss: 사라는 자신의 11자리 번호를 한 자리씩 읽어줘요.
    note: یکه는 یک است의 줄임말로, 미나의 번호가 هشته로 끝났던 것처럼 숫자 읽기를 마무리해요.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: 미나가 전화하겠다고 해요
    gloss: 미나는 내일 사라에게 전화하겠다고 말해요.
    note: زنگ می‌زنم بهت은 '너에게 전화할게'라는 뜻이에요. 직역하면 '너에게 벨을 친다'예요.
exercises:
  fa.a1.unit03.lesson01.exercise01.recognize_yek:
    instruction: یک의 뜻을 고르세요.
    correct_option: 하나
    distractors:
    - 둘
    - 다섯
    - 열
    accepted_answers:
    - value: 하나
      status: correct
    feedback: یک은 '하나'라는 뜻이에요.
  fa.a1.unit03.lesson01.exercise02.recognize_panj:
    instruction: پنج의 뜻을 고르세요.
    correct_option: 다섯
    distractors:
    - 하나
    - 여덟
    - 셋
    accepted_answers:
    - value: 다섯
      status: correct
    feedback: پنج은 '다섯'이라는 뜻이에요.
  fa.a1.unit03.lesson01.exercise03.recognize_zero_to_five_reading:
    instruction: 순서대로 나열한 이 숫자들은 무엇일까요?
    correct_option: 0, 1, 2, 3, 4, 5
    distractors:
    - 1, 2, 3, 4, 5, 6
    - 0, 2, 4, 6, 8, 10
    - 5, 4, 3, 2, 1, 0
    accepted_answers:
    - value: 0, 1, 2, 3, 4, 5
      status: correct
    feedback: صفر، یک، دو، سه، چهار، پنج은 0부터 5까지 순서대로 센 거예요.
  fa.a1.unit03.lesson01.exercise04.match_low:
    instruction: 각 숫자 단어와 알맞은 숫자를 짝지으세요.
    accepted_answers:
    - value:
        صفر: '0'
        یک: '1'
        دو: '2'
        سه: '3'
        چهار: '4'
        پنج: '5'
        شش: '6'
      status: correct
    feedback: صفر부터 شش까지는 0부터 6까지예요.
    pairs:
    - left: صفر
      right: '0'
    - left: یک
      right: '1'
    - left: دو
      right: '2'
    - left: سه
      right: '3'
    - left: چهار
      right: '4'
    - left: پنج
      right: '5'
    - left: شش
      right: '6'
  fa.a1.unit03.lesson01.exercise05.match_high:
    instruction: 각 단어를 알맞은 뜻과 연결하세요.
    accepted_answers:
    - value:
        هفت: '7'
        هشت: '8'
        نه: '9'
        ده: '10'
        عدد: 번호
        صفر: '0'
      status: correct
    feedback: هفت، هشت، نه، ده은 7부터 10까지예요. عدد는 '숫자'라는 뜻이고, صفر는 영이에요.
    pairs:
    - left: هفت
      right: '7'
    - left: هشت
      right: '8'
    - left: نه
      right: '9'
    - left: ده
      right: '10'
    - left: عدد
      right: 번호
    - left: صفر
      right: '0'
  fa.a1.unit03.lesson01.exercise06.order_ascending:
    instruction: 작은 수부터 큰 수 순서로 배열하세요.
    accepted_answers:
    - value:
      - یک
      - دو
      - سه
      status: correct
