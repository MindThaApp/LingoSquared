course:
  title: 페르시아어 A1
  description: '초급 이란 페르시아어: 흔한 반려동물과 동물(개, 고양이, 새, 물고기) 이름 말하기, "반려동물 있어요?" 묻기, 반려동물의 이름 말하기와 먹이 주기, 반려동물의 색과 크기 묘사하기, سارا의 고양이 پشمک에 관한 짧은 읽기 글, 그리고 پشمک을 칭찬하는 سارا와 نیما의 마무리 대화를 다뤄요.'
