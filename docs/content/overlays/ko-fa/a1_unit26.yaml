teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: 나
    gloss: 나
    note: 이미 익숙한 *من*이 여기서 자신의 반려동물을 말할 때 다시 나와요.
  fa.a1.unit26.lesson01.teach.oo_review:
    title: 그 / 그녀
    gloss: 그 / 그녀
    note: '*او*가 여기서 다시 나와요.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: 나는 있다 / 그(그녀)는 있다 / 나는 없다
    gloss: 나는 있다 / 그(그녀)는 있다 / 나는 없다
    note: '*دارم*/*داره*는 반려동물에도 똑같이 쓰여요. *ندارم*(저는 없어요)과 *نداره*(그/그녀는 없어요)은 짝이 되는 부정형이며, 둘 다 4과의 가족 대화에서 이미 함께 쓰였어요.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: 동물
    gloss: 동물
    note: '*حیوان*은 ''동물''이라는 뜻이에요.'
    example_gloss: 고양이는 동물이에요.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: 반려동물
    gloss: 반려동물
    note: '*حیوان خونگی*는 글자 그대로 ''집 동물''이라는 뜻으로, ''반려동물''을 나타내는 표준적인 표현이에요.'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: 개
    gloss: 개
    note: '*سگ*은 ''개''라는 뜻이에요.'
    example_gloss: 저는 개가 있어요.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: 고양이
    gloss: 고양이
    note: '*گربه*는 ''고양이''라는 뜻이에요.'
    example_gloss: 그는 고양이가 있어요.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: 새
    gloss: 새
    note: '*پرنده*는 ''새''라는 뜻이에요.'
    example_gloss: 그녀는 새가 있어요.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: 생선
    gloss: 생선
    note: '*ماهی*는 ''물고기''라는 뜻이에요.'
    example_gloss: 저는 물고기가 있어요.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: 당신은 있다
    gloss: 너는 있다
    note: '*داری*가 같은 형태의 비격식 2인칭으로 여기서 다시 나와요.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: 반려동물이 있어요?
    gloss: 반려동물 있어요?
    note: '*حیوان خونگی داری؟*는 1과의 *حیوان خونگی*와 *داری*를 합친 것으로, 상대에게 반려동물이 있는지 묻는 자연스러운 표현이에요.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: 응
    gloss: 응
    note: '*آره*는 ''네''를 뜻하는 일상적인 구어체 표현이에요.'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: 이름
    gloss: 이름
    note: '*اسم*은 반려동물의 이름을 말할 때도 똑같이 써요.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: 이름이 뭐예요?
    gloss: 이름이 뭐예요?
    note: '*اسمش چیه؟*는 소유 접미사 *-ش*(25단원의 *قدش*, *موهاش*에서 이미 봤어요)와 2단원의 *چیه؟*가 합쳐진 표현으로, ''그(그녀/그것)의 이름이 뭐예요?''라는 뜻이에요.'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: 음식
    gloss: 음식
    note: '*غذا*는 반려동물 사료를 말할 때도 똑같이 쓰는 단어예요.'
    example_gloss: 저는 음식을 좋아해요.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: (제가) 줘요 / 먹이를 줘요
    gloss: 줘요 / 먹이를 줘요
    note: '*می‌دم*(직역하면 ''제가 줘요'')은 24단원의 *گوش می‌دم*에서 이미 살짝 나왔어요. *غذا*와 함께 쓰면 반려동물에게 먹이를 준다는 뜻의 자연스러운 표현이 돼요.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: 내 강아지
    gloss: 내 강아지
    note: '*سگم*은 *سگ*에 소유 접미사 *-م*이 붙은 말로, ''내 강아지''라는 뜻이에요. 2단원의 *اسمم*과 같은 결합 방식이에요.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: 저는 강아지에게 먹이를 줘요.
    gloss: 저는 강아지에게 먹이를 줘요.
    note: '*سگم رو غذا می‌دم*에서는 목적어 표지 *رو*(14단원의 *قهوه رو بیشتر دوست دارم*에서 이미 봤어요)가 *سگم*을 먹이를 받는 대상으로 표시해 줘요.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: 무슨 색이에요?
    gloss: 무슨 색이에요?
    note: '*چه رنگیه؟*는 반려동물의 색깔을 말할 때도 똑같이 써요.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: 흰색
    gloss: 흰색
    note: '*سفید*가 여기서 반려동물의 색깔을 말할 때 다시 나와요. *گربه‌ی*는 *گربه*가 소유자 앞에 올 때 쓰는 에자페 형태로, *گربه‌ی من*(내 고양이)처럼 써요. 19단원의 *خونه‌ی من*과 같은 방식이며, 모음으로 끝나는 명사에는 접미사를 붙이는 대신 이 형태를 써요.'
    example_gloss: 제 고양이는 하얘요.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: 작은
    gloss: 작은
    note: '*کوچیک*이 여기서 반려동물의 크기를 말할 때 다시 나와요.'
    example_gloss: 제 물고기는 작아요.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: 큰
    gloss: 큰
    note: '*بزرگ*이 여기서 반려동물의 크기를 말할 때 다시 나와요.'
    example_gloss: 제 강아지는 커요.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: 사라
    gloss: 사라
    note: '*سارا*는 2단원부터 등장인물로 나왔고, 여기서 다시 나와요.'
    example_gloss: 사라는 고양이가 있어요.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: 하나 / 한
    gloss: 하나 / 한
    note: '*یک*은 여기서 ''한 마리, 한 …''처럼 막연한 하나를 나타내는 데 쓰여요.'
  fa.a1.unit26.lesson05.teach.va_review:
    title: 그리고 / 와
    gloss: 그리고 / 와
    note: '*و*는 ''그리고, ~와''라는 뜻이에요. 14단원, 24단원, 25단원에서도 이미 이렇게 썼어요.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: 파슈마크
    gloss: 파슈마크
    note: '*پشمک*(직역하면 ''솜사탕'')은 이란에서 실제로 반려동물 이름으로 흔히 쓰이는 이름이에요. 여기서는 사라의 고양이 이름이에요.'
    example_gloss: 사라의 고양이 이름은 파슈마크예요.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: 매일
    gloss: 매일
    note: '*هر روز*는 반려동물에게 먹이를 주는 문장에서도 똑같이 써요.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: 그(그녀)가 줘요 / 먹이를 줘요
    gloss: 그(그녀)가 줘요 / 먹이를 줘요
    note: '*می‌ده*는 3단원의 *می‌دم*(제가 줘요/먹이를 줘요)과 같은 동사의 3인칭 구어체 형태예요.'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: '읽기: 사라의 고양이'
    gloss: 사라는 고양이가 있어요. 이름은 파슈마크예요. 파슈마크는 하얗고 작아요. 사라는 매일 파슈마크에게 먹이를 줘요.
    note: 이 읽기 글은 1~4과의 모든 표현을 다시 사용해요. 새 어휘는 거의 없고, 이어진 글 속에서 익힌 표현을 알아보는 연습이에요.
  fa.a1.unit26.lesson06.teach.in_word:
    title: 이
    gloss: 이
    note: '*این*은 ''이, 이것''이라는 뜻이에요.'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: 누구 거예요?
    gloss: 누구 거예요?
    note: '*کیه*는 여기서 어떤 반려동물이 누구의 것인지 물을 때 쓰여요.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: 제 거예요
    gloss: 제 거예요
    note: '*منه*는 *من است*의 구어체 축약형으로 ''제 거예요''라는 뜻이에요. *گربه‌ی منه*는 ''제 고양이예요''라는 뜻이에요.'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: 제 강아지예요
    gloss: 제 강아지예요
    note: '*سگمه*는 3단원의 *سگم*(내 강아지)에 *منه*와 같은 ''~이다'' 어미 *-ه*가 붙은 형태로, ''제 강아지예요''라는 뜻이에요.'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: 귀여운
    gloss: 귀여운
    note: '*خوشگل*은 귀엽다, 예쁘다는 뜻이에요. *خیلی*는 ''매우''라는 뜻이에요.'
    example_gloss: 사라의 고양이는 아주 귀여워요.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: 감사
    gloss: 고마워요
    note: '*ممنون*이 여기서 자연스러운 마무리 인사로 다시 나와요.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: '니마: 이 고양이는 누구 거예요?'
    gloss: 이 고양이는 누구 거예요?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: '사라: 제 고양이예요. 이름은 파슈마크예요.'
    gloss: 제 고양이예요. 이름은 파슈마크예요.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: '니마: 무슨 색이에요?'
    gloss: 무슨 색이에요?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: '사라: 하얗고 작아요.'
    gloss: 하얗고 작아요.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: '니마: 아주 귀여워요!'
    gloss: 아주 귀여워요!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: '사라: 고마워요!'
    gloss: 고마워요!
