    note: '*سرگرمی*는 취미 또는 소일거리라는 뜻이에요.'
    example_gloss: 독서는 취미예요.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: 책 읽기
    gloss: 책 읽기
    note: '*کتاب خوندن*은 글자 그대로 ''책 읽기''예요. *کتاب*(책)는 앞에서 배웠고, *خوندن*(읽다)은 여기서 처음 나와요.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: 나는 ... 좋아해요
    gloss: 좋아해요
    note: '*دوست دارم*은 사물뿐 아니라 활동에도 똑같이 쓰여요. *کتاب خوندن دوست دارم*은 ''책 읽기를 좋아해요''라는 뜻이에요.'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: 음악
    gloss: 음악
    note: '*موسیقی*가 여기서 다시 나와요.'
    example_gloss: 저는 음악을 들어요.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: 들어요
    gloss: 들어요
    note: '*گوش می‌دم*은 글자 그대로 ''귀를 준다''라는 뜻으로, 페르시아어에서 ''듣다''를 나타내는 자연스러운 표현이에요.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: 영화
    gloss: 영화
    note: '*فیلم*이 여기서 다시 나와요.'
