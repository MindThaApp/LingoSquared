    gloss: 정말 좋네요!
    note: '*چه خوب!*은 앞에서 배웠어요. ''잘됐네요!''처럼 긍정적으로 반응할 때 자주 쓰는 표현이에요.'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: '니마: 사라, 여가 시간에 뭐 해요?'
    gloss: 사라, 여가 시간에 뭐 해요?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: '사라: 저는 영화 보기를 좋아해요...'
    gloss: 저는 영화 보기를 좋아해요. 매주 영화관에 가요. 당신은요?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: '니마: 저는 책 읽기를 좋아해요...'
    gloss: 저는 책 읽기를 좋아해요. 가끔은 축구도 해요.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: '사라: 정말 좋네요!'
    gloss: 정말 좋네요!
