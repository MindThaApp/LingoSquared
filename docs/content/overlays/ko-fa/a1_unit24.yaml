  fa.a1.unit24.lesson04.teach.gahi_word:
    title: 가끔
    gloss: 가끔
    note: '*گاهی*는 가끔이라는 뜻이에요.'
    example_gloss: 저는 가끔 책을 읽어요.
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: 여가 시간에 무엇을 하나요?
    gloss: 여가 시간에 무엇을 하나요?
    note: '*چیکار می‌کنی*는 앞에서 배웠어요. 여기서는 그 표현을 다시 써서 여가 시간에 무엇을 하는지 물어요.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: 니마
    gloss: 니마
    note: 11과에서 등장인물로 나왔던 *نیما*가 여기서 다시 나와요.
    example_gloss: 니마는 책 읽기를 좋아해요.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: 몇 개 / 몇 개나
    gloss: 몇 개 / 몇 개나
    note: '*چند*(몇/여러)는 단위를 세는 말 *تا*와 결합해서, 셀 수 있는 명사 앞에서 ''몇 개'' 또는 ''몇 개나''를 뜻해요.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
