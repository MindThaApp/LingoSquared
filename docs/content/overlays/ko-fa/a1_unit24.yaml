  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: 봐요
    gloss: 봐요
    note: '*می‌بینم*은 앞에서 과거형(*دیدم*, ''봤어요'')을 배운 동사의 현재형이에요.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: 운동
    gloss: 운동
    note: '*ورزش*는 ''스포츠''와 일반적인 ''운동''을 모두 뜻해요.'
    example_gloss: 저는 운동해요.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: 해요
    gloss: 해요
    note: '*می‌کنم*은 ''하다/만들다''를 뜻하는 일반 동사로, *ورزش می‌کنم*(운동해요)처럼 복합 동사에 쓰여요.'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: 축구
