    note: '*کتاب* 앞의 *چند تا*는 ''몇 권의 책''을 뜻해요. *می‌خونه*와 *می‌کنه*는 다른 사람에 대해 말할 때 쓰는 3인칭 구어체 형태예요.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: 사라
    gloss: 사라
    note: 14과에서 등장인물로 나왔던 *سارا*가 여기서 다시 나와요.
