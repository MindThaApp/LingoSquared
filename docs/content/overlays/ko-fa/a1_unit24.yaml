    note: '*فوتبال*은 축구라는 뜻이에요.'
    example_gloss: 저는 축구를 좋아해요.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: 저는 축구를 해요
    gloss: 축구를 해요
    note: '*بازی*는 놀이/경기라는 뜻이에요. *فوتبال بازی می‌کنم*은 글자 그대로 ''축구 경기를 해요''라는 뜻이에요.'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: 주
    gloss: 주, 일주일
    note: '*هفته*는 주(일주일)라는 뜻이에요.'
