  fa.a1.unit04.lesson06.family_photo_dialogue:
    title: 가족사진
teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: 어머니
    gloss: 어머니
    note: مادر는 어머니를 뜻하는 중립적인 문어체·격식체 단어예요.
    example_gloss: 우리 어머니는 친절하세요.
  fa.a1.unit04.lesson01.teach.maman:
    title: 엄마
    gloss: 엄마
    note: مامان은 대부분의 가정에서 실제로 쓰는 일상 구어 표현이에요.
    example_gloss: 엄마, 배고파요.
  fa.a1.unit04.lesson01.teach.pedar:
    title: 아버지
    gloss: 아버지
    note: پدر는 글이나 격식 있는 자리에서 쓰는 중립적인 '아버지'라는 말이에요.
    example_gloss: 제 아버지는 의사예요.
  fa.a1.unit04.lesson01.teach.baba:
    title: 아빠
    gloss: 아빠
    note: بابا는 대부분의 가정에서 실제로 쓰는 일상 구어 표현이에요.
    example_gloss: 아빠, 어디 계세요?
  fa.a1.unit04.lesson01.teach.baradar:
    title: 형, 오빠, 남동생
    gloss: 남자 형제
    note: برادر예요. 구어에서 쓰는 친근한 표현인 داداش는 이 단원 뒤에서 나와요.
    example_gloss: 저는 남자 형제가 한 명 있어요.
  fa.a1.unit04.lesson01.teach.khahar:
    title: 누나, 언니, 여동생
    gloss: 여자 형제
    note: خواهر는 '자매(언니, 누나, 여동생)'를 뜻하는 표준 단어예요.
    example_gloss: 제 언니는 대학생이에요.
  fa.a1.unit04.lesson01.teach.register_note:
    title: 격식 있는 말과 일상적인 말
    gloss: 엄마와 아빠는 어머니와 아버지와 같은 뜻이지만 더 친근한 말이에요.
    note: 페르시아어에서 부모님을 부르는 말은 딱 격식/비격식으로 나뉘지 않아요. مامان/بابا는 정중한 자리에서도 대부분의 사람들이 자기 부모님을 실제로 부르는 말이에요.
  fa.a1.unit04.lesson02.teach.daram:
    title: 저는 ~이/가 있어요
    gloss: 저는 ~이/가 있어요
    note: '*دارم*은 *داشتن*(''가지다, 있다'')의 1인칭 형태로, 가족을 말할 때 핵심이 되는 동사예요.'
  fa.a1.unit04.lesson02.teach.yek:
    title: 일
    gloss: 일
    note: 'یک은 세는 명사 앞에 쓰여요. 예: یک برادر(형제 한 명).'
    example_gloss: 저는 자매가 한 명 있어요.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: 저는 남자 형제가 한 명 있어요.
    gloss: 저는 남자 형제가 한 명 있어요.
    note: '어순: 주어, 수량+명사, 동사 순서로, 한국어처럼 전형적인 SOV 어순이에요.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: 저는 자매가 없어요.
    gloss: 저는 자매가 없어요.
    note: ندارم은 دارم의 부정형이에요. '한 명'에 해당하는 말을 따로 쓸 필요는 없어요.
  fa.a1.unit04.lesson02.teach.family_big:
    title: 우리 가족은 대가족이에요.
    gloss: 우리 가족은 대가족이에요.
    note: بزرگه는 구어체로, 'بزرگ است'(크다)를 줄여 쓴 형태예요.
  fa.a1.unit04.lesson02.teach.family_small:
    title: 우리 가족은 식구가 적어요.
    gloss: 우리 가족은 식구가 적어요.
    note: کوچیکه는 구어체로, 'کوچک است'(작다)를 줄여 쓴 형태예요. 문어체 کوچک 대신 구어 발음 کوچیک을 써요.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: 할아버지
    gloss: 할아버지
    note: پدربزرگ은 글자 그대로 '큰 아버지'라는 뜻이며, 친가와 외가 모두에 쓰여요.
    example_gloss: 제 할아버지는 연세가 많으세요.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: 할머니
    gloss: 할머니
    note: مادربزرگ은 글자 그대로 '큰 어머니'라는 뜻이며, 친가와 외가 모두에 쓰여요.
    example_gloss: 제 할머니는 친절하세요.
  fa.a1.unit04.lesson03.teach.amoo:
    title: 친가 삼촌(아버지의 형제)
    gloss: 삼촌(아버지의 형제)
    note: عمو는 일반적인 '삼촌'이 아니라 정확히 아버지의 형제를 뜻해요.
    example_gloss: 제 삼촌은 테헤란에 살아요.
  fa.a1.unit04.lesson03.teach.amme:
    title: 친가 고모(아버지의 자매)
    gloss: 고모(아버지의 자매)
    note: عمه는 정확히 아버지의 자매를 뜻해요.
    example_gloss: 제 고모는 선생님이에요.
  fa.a1.unit04.lesson03.teach.dayi:
    title: 외가 삼촌(어머니의 형제)
    gloss: 외삼촌(어머니의 형제)
    note: دایی는 정확히 어머니의 형제를 뜻해요. 페르시아어는 한국어처럼 친가 쪽인지 외가 쪽인지에 따라 삼촌과 이모·고모를 구분해요.
    example_gloss: 제 외삼촌은 엔지니어예요.
  fa.a1.unit04.lesson03.teach.khale:
    title: 외가 이모(어머니의 자매)
    gloss: 이모(어머니의 자매)
    note: خاله는 정확히 어머니의 자매를 뜻해요.
    example_gloss: 제 이모는 이스파한에 살아요.
  fa.a1.unit04.lesson03.teach.register_note:
    title: 아버지 쪽과 어머니 쪽
    gloss: 삼촌과 고모는 아버지 쪽이고, 외삼촌과 이모는 어머니 쪽이에요.
    note: 이렇게 네 가지로 나뉘는 호칭(عمو/عمه 대 دایی/خاله)은 한국어의 삼촌/고모, 외삼촌/이모 구분과 비슷해요.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: 몇 명 / 몇 개
    gloss: 몇 명, 몇 개
    note: چند تا는 사람이나 사물의 수를 일상적으로 물을 때 앞에 써요.
    example_gloss: 자매가 몇 명이세요?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: 형제자매가 몇 명이세요? (정중한 표현)
    gloss: 형제자매가 몇 명이에요?
    note: دارید는 '가지다'의 정중한 형태(복수형)로, شما와 짝을 이뤄요.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: 형제자매가 몇 명이니? (친근한 표현)
    gloss: 형제자매가 몇 명이에요?
    note: داری는 친근한 단수형으로, 또래나 손아랫사람에게 써요.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: 가족이 몇 명이세요?
    gloss: 가족이 몇 명이세요?
    note: نفر는 사람을 세는 단위예요. نفرن은 구어체로, 'نفر هستند'(~명이다)를 줄인 형태예요.
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 우리는 네 명이에요. 저, 엄마, 아빠, 그리고 형(오빠)이요.
    gloss: 우리는 네 명이에요. 저, 엄마, 아빠, 그리고 형(오빠)이요.
    note: نفریم은 구어체로, 'نفر هستیم'(우리는 ~명이다)을 줄인 형태예요.
  fa.a1.unit04.lesson05.teach.showhar:
    title: 남편
    gloss: 남편
    note: شوهر는 '남편'을 뜻하는 표준 단어예요.
    example_gloss: 제 남편은 엔지니어예요.
  fa.a1.unit04.lesson05.teach.zan:
    title: 아내
    gloss: 아내
    note: زن은 일반적으로 '여자'라는 뜻도 있어요. 문맥으로 뜻을 알 수 있어요.
    example_gloss: 제 아내는 선생님이에요.
  fa.a1.unit04.lesson05.teach.motahel:
    title: 결혼한
    gloss: 결혼한
    note: متأهل은 혼인 여부를 말할 때 흔히 쓰는 중립적인 형용사예요.
    example_gloss: 그는(그녀는) 결혼했어요.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: 미혼
    gloss: 미혼의, 결혼하지 않은
    note: مجرد는 '미혼'을 뜻하는 표준 단어예요.
    example_gloss: 저는 미혼이에요.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: 저는 미혼이에요.
    gloss: 저는 미혼이에요.
    note: مجردم = مجرد + م('저는 ~이다'). خوبم('저는 좋아요')과 같은 1인칭 접미사 패턴이에요.
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: 저는 결혼했어요.
    gloss: 저는 결혼했어요.
    note: متأهلم = متأهل + م('저는 ~이다'). مجردم과 같은 패턴이에요.
  fa.a1.unit04.lesson05.teach.nave:
    title: 손주
    gloss: 손주
    note: نوه는 손자와 손녀를 모두 가리켜요. 페르시아어에서는 여기서 성별을 구분할 필요가 없어요.
    example_gloss: 그에게(그녀에게) 손주가 한 명 있어요.
  fa.a1.unit04.lesson05.teach.example:
    title: 제 형(오빠)은 결혼했고, 아들이 한 명 있어요.
    gloss: 제 형(오빠)은 결혼했고, 아들이 한 명 있어요.
    note: متأهله는 구어체로, 'متأهل است'(결혼했다)를 줄인 형태예요. داره도 'دارد'(가지고 있다)의 구어 형태예요.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: 이거 네 가족사진이야?
    gloss: 이거 네 가족사진이야?
    note: خانواده‌ته는 'خانواده‌ی تو است'(네 가족~이다)를 줄인 형태로, 구어에서 아주 흔한 패턴이에요.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: 응. 이쪽은 우리 엄마고, 이쪽은 우리 아빠야.
    gloss: 응. 이쪽은 우리 엄마고, 이쪽은 우리 아빠야.
    note: '*آره*는 구어체 ''응/네''예요(격식체는 *بله*). *مامانمه*는 *مامانم*(''우리 엄마'')에 구어체 ''~이다'' 어미가 붙은 형태예요.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: 이 남자분은 누구야?
    gloss: 이 남자분은 누구야?
    note: کیه는 구어체로, 'کی است'(누구예요)를 줄인 형태예요.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: 우리 오빠야. 오빠는 한 명 있고, 여자 형제는 없어.
    gloss: 우리 오빠야. 오빠는 한 명 있고, 여자 형제는 없어.
    note: داداش는 형제를 부르는 친근한 일상 표현이에요. 1과에서 배운 더 중립적인 برادر 대신 여기서 썼어요.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 우리 집은 반대네. 나는 자매가 두 명 있고, 남자 형제는 없어.
    gloss: 우리 집은 반대네. 나는 자매가 두 명 있고, 남자 형제는 없어.
    note: برعکسه는 'برعکس است'(반대이다)를 줄인 형태예요.
  fa.a1.unit04.lesson06.teach.closing:
    title: 그럼 너희 가족도 북적북적하겠다!
    gloss: 그럼 너희 가족도 북적북적하겠다!
    note: شلوغه는 'شلوغ است'(북적이다)를 줄인 형태로, 아이가 여럿인 가족을 따뜻하게 표현하는 흔한 말이에요.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: '격식체: 가지고 있다 / 가지고 있지 않다 / ~이다'
    gloss: '구어: 가지고 있다, 가지고 있지 않다. 격식 있는 문어: 가지고 있다, 가지고 있지 않다. 그는 제 형제입니다.'
    note: دارد/ندارد/است는 이 대화에서 쓴 구어체 داره/نداره 등에 해당하는 격식 문어체예요. 격식 있는 글에서는 친근한 داداش 대신 중립적인 برادر를 쓴다는 점도 기억하세요.
exercises:
  fa.a1.unit04.lesson01.exercise01.recognize_madar:
    instruction: 이 단어의 뜻을 고르세요.
    correct_option: 어머니
    distractors:
    - 아버지
    - 남자 형제
    - 여자 형제
    accepted_answers:
    - value: 어머니
      status: correct
    feedback: مادر는 '어머니'라는 뜻이에요.
  fa.a1.unit04.lesson01.exercise02.recognize_pedar:
    instruction: 이 단어의 뜻을 고르세요.
    correct_option: 아버지
    distractors:
    - 어머니
    - 남자 형제
    - 여자 형제
    accepted_answers:
    - value: 아버지
      status: correct
    feedback: پدر는 '아버지'라는 뜻이에요.
  fa.a1.unit04.lesson01.exercise03.recognize_baradar:
    instruction: 이 단어의 뜻을 고르세요.
    correct_option: 남자 형제
    distractors:
    - 여자 형제
    - 어머니
    - 아버지
    accepted_answers:
    - value: 남자 형제
      status: correct
    feedback: برادر는 '남자 형제'라는 뜻이에요.
  fa.a1.unit04.lesson01.exercise04.match_formal_informal:
    instruction: 격식 있는 단어와 일상에서 쓰는 단어를 짝지어 보세요.
    accepted_answers:
    - value:
        مادر: مامان
        پدر: بابا
      status: correct
    feedback: مادر/مامان은 둘 다 '어머니'이고, پدر/بابا는 둘 다 '아버지'예요.
    pairs:
    - left: مادر
      right: مامان
    - left: پدر
      right: بابا
  fa.a1.unit04.lesson01.exercise05.recognize_madar_pedar_reading:
    instruction: 이 두 단어는 무슨 뜻일까요?
    correct_option: 어머니, 아버지
    distractors:
    - 남자 형제, 여자 형제
    - 네, 아니요
    - 큰, 작은
    accepted_answers:
    - value: 어머니, 아버지
      status: correct
    feedback: مادر، پدر는 '어머니, 아버지'라는 뜻이에요.
  fa.a1.unit04.lesson01.exercise05b.recognize_khahar:
    instruction: 이 단어의 뜻을 고르세요.
    correct_option: 여자 형제
    distractors:
    - 남자 형제
    - 어머니
    - 아버지
    accepted_answers:
    - value: 여자 형제
      status: correct
    feedback: خواهر는 '여자 형제'라는 뜻이에요.
  fa.a1.unit04.lesson01.exercise06.order_khahar:
    instruction: '단어를 순서대로 배열하세요: 여자 형제, 남자 형제.'
    accepted_answers:
    - value:
      - خواهر
      - برادر
      status: correct
    feedback: خواهر برادر.
  fa.a1.unit04.lesson01.exercise07.translate_baradar_khahar:
    instruction: '페르시아어로 번역하세요: 남자 형제, 여자 형제.'
    accepted_answers:
    - value: برادر خواهر
      status: correct
    - value: برادر، خواهر
      status: correct
    - value: برادر و خواهر
      status: correct
