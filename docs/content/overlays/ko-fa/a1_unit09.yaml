teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: 시/시계
    gloss: 시/시계
    note: ساعت은 '시'와 '시계'를 모두 뜻하며, 시간을 말할 때 기본이 되는 단어예요.
    example_gloss: 몇 시예요?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: 분
    gloss: 분
    note: دقیقه는 '분'을 뜻하는 단어예요.
    example_gloss: 5분만 기다려요.
  fa.a1.unit09.lesson01.teach.half_word:
    title: 반, 절반
    gloss: 반
    note: نیم은 '반'을 뜻하며, 30분을 말할 때 써요.
    example_gloss: 7시 반이에요.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: 15분
    gloss: 15분(4분의 1)
    note: ربع는 '4분의 1'을 뜻하며, 15분을 말할 때 써요.
    example_gloss: 8시 15분 전이에요.
  fa.a1.unit09.lesson01.teach.va_word:
    title: 그리고
    gloss: 그리고
    note: و는 이 단원 전체에서 쓰이는 대표적인 연결 단어예요.
    target_text: و (그리고)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: 지금 몇 시인지 묻기
    gloss: 몇 시예요?
    note: ساعت چنده؟는 시간을 묻는 일상적인 구어체 표현이에요.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: 구어체 -e 축약 (복습)
    gloss: چنده는 چند است를 일상 대화에서 줄여 말한 형태예요.
    note: 날씨와 쇼핑 단어인 آفتابیه, تومنه 등에서 이미 본 것과 같은 축약 방식이에요.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: 3시 반이라고 말하기
    gloss: 3시 반이에요.
    note: ساعت سه و نیمه는 시, و(그리고), 그리고 축약형 نیمه(반)가 합쳐진 표현이에요.
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: 구어체 -e 축약, نیم에 적용
    gloss: نیمه는 نیم است를 일상 대화에서 줄여 말한 형태예요.
    note: چند 대신 نیم에 적용했을 뿐, چنده와 같은 방식이에요.
  fa.a1.unit09.lesson04.teach.sobh:
    title: 아침
    gloss: 아침
    note: صبح는 하루 중 아침 시간대를 가리켜요.
    example_gloss: 아침 일찍 일어나요.
  fa.a1.unit09.lesson04.teach.zohr:
    title: 정오
    gloss: 정오
    note: ظهر는 정오 무렵을 가리켜요.
    example_gloss: 저는 정오에 점심을 먹어요.
  fa.a1.unit09.lesson04.teach.asr:
    title: 오후
    gloss: 오후
    note: عصر는 오후에서 초저녁까지의 시간대를 가리켜요.
    example_gloss: 저는 오후에 일해요.
  fa.a1.unit09.lesson04.teach.shab:
    title: 밤
    gloss: 밤
    note: شب는 밤을 가리켜요.
    example_gloss: 밤에 일찍 자요.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: 약속
    gloss: 약속
    note: قرار는 약속이나 미리 정해 둔 만남을 가리키는 일반적인 단어예요.
    example_gloss: 저는 약속이 있어요.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: 약속이 몇 시인지 묻기
    gloss: 약속이 몇 시예요?
    note: قرار ساعت چنده؟는 시간을 묻는 표현을 특정한 약속에 적용한 문장이에요.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: 하루의 시간대와 함께 시각 말하기
    gloss: 오후 네 시
    note: ساعت چهار عصر는 시각에 عصر를 붙여서 오전인지 오후인지 구분해 줘요.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: 내일 (복습)
    gloss: 내일
    note: فردا는 앞선 단원에서 배운 단어예요. 여기서는 약속을 말할 때 쓰였어요.
    example_gloss: 저는 내일 약속이 있어요.
  fa.a1.unit09.lesson06.teach.late_word:
    title: 조금 늦는다고 말하기
    gloss: 조금 늦을 것 같아요.
    note: '*یکم دیر می‌شه*에는 구어체 *یکم*(조금)과 *دیر*(늦은)가 쓰였어요.'
  fa.a1.unit09.lesson06.teach.turn01:
    title: 네가르가 내일 약속 시간을 물어요
    gloss: 네가르가 내일 약속이 몇 시냐고 물어요.
    note: قرار فردا ساعت چنده؟는 약속 시간을 묻는 표현에 فردا(내일)를 더한 문장이에요.
  fa.a1.unit09.lesson06.teach.turn02:
    title: 아라시가 확신 없이 대답해요
    gloss: 아라시가 네 시인 것 같다고 말해요.
    note: فکر کنم(~인 것 같아요)은 확실하지 않아서 대답을 부드럽게 만들어 줘요.
  fa.a1.unit09.lesson06.teach.turn03:
    title: 네가르가 오전인지 오후인지 되물어요
    gloss: 네가르가 네 시가 오후인지 오전인지 물어요.
    note: ساعت چهار만으로는 어느 네 시인지 알 수 없으니, 헷갈릴 수 있는 점을 확인하는 말이에요.
  fa.a1.unit09.lesson06.teach.turn04:
    title: 아라시가 분명히 말해 줘요
    gloss: 아라시가 오후라고 말해요.
    note: 질문으로 상황이 이미 분명해졌을 때는 한 단어로 대답해도 자연스러워요.
  fa.a1.unit09.lesson06.teach.turn05:
    title: 네가르가 동의하며 도착 시간을 조정해요
    gloss: 네가르가 알겠다고 하며 네 시 십오 분에 오겠다고 말해요.
    note: ساعت چهار و ربع는 시각에 ربع(15분)를 더한 표현이에요.
  fa.a1.unit09.lesson06.teach.turn06:
    title: 아라시가 왜 15분을 더하는지 물어요
    gloss: 아라시가 왜 십오 분 후라고 하는지 물어요.
    note: '*چرا ربع؟*는 "왜 15분이에요?"라는 뜻의 짧은 질문이에요.'
  fa.a1.unit09.lesson06.teach.turn07:
    title: 네가르가 조금 늦을 거라고 설명해요
    gloss: 네가르가 퇴근이 조금 늦어질 거라고 설명해요.
    note: '*چون*(왜냐하면)은 이유를 이끄는 말이에요. 이번 레슨에서 배운 *یکم دیر می‌شه*(조금 늦을 거예요)와 함께 쓰였어요.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: 아라시가 안심시켜 줘요
    gloss: 아라시가 알겠다고, 문제없다고 말해요.
    note: مشکلی نیست(문제없어요)는 조금 늦는 건 괜찮다고 네가르를 안심시키는 말이에요.
