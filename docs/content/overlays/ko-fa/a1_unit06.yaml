teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: 빵
    gloss: 빵
    note: نان은 이란 식사에서 빠지지 않는 주식으로, 거의 모든 음식과 함께 나오는 납작한 빵을 흔히 가리킵니다.
    example_gloss: 저는 빵을 좋아해요.
  fa.a1.unit06.lesson01.teach.berenj:
    title: 쌀밥
    gloss: 쌀밥
    note: برنج은 이란의 대부분의 메인 요리에서 중심이 되는 재료예요.
    example_gloss: 밥과 닭고기는 맛있어요.
  fa.a1.unit06.lesson01.teach.morgh:
    title: 닭고기
    gloss: 닭고기
    note: مرغ은 새(닭)와 닭고기를 둘 다 뜻해요.
    example_gloss: 저는 닭고기를 먹어요.
  fa.a1.unit06.lesson01.teach.ab:
    title: 물
    gloss: 물
    note: آب은 물을 뜻하는 일반적인 단어예요.
    example_gloss: 저는 물을 원해요.
  fa.a1.unit06.lesson01.teach.chai:
    title: 차
    gloss: 차
    note: چای는 이란 어디서나 기본으로 내오는 음료예요. 1과의 타로프 수업에서 이미 나왔어요.
    example_gloss: 차 한 잔 주세요.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: 커피
    gloss: 커피
    note: قهوه는 이란 도시에서 차와 함께 점점 흔해지고 있어요.
    example_gloss: 커피가 뜨거워요.
  fa.a1.unit06.lesson01.teach.mive:
    title: 과일
    gloss: 과일
    note: میوه는 모든 과일을 아우르는 일반적인 단어예요.
    example_gloss: 저는 과일을 좋아해요.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: 그리고 / 또는
    gloss: و (그리고), یا (또는)
    note: 둘 다 주문할 때 음식과 음료를 연결하는 데 흔히 쓰는 연결어예요.
    target_text: و (그리고), یا (또는)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: 공손하게 차 주문하기
    gloss: 차 한 잔 주세요.
    note: می‌خواستم은 문자 그대로는 '원하다'의 과거형이지만, 부드럽고 공손한 부탁 표현으로 쓰여요. 처음 보는 종업원이나 가게 주인에게 하기에 알맞은 말투예요.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: 부탁드려요
    gloss: 부탁드려요
    note: لطفاً는 거의 모든 부탁을 부드럽게 만들어 줘요.
    example_gloss: 저를 도와주세요.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: 편하게 차 주문하기
    gloss: 차 한 잔 줘.
    note: یه چای می‌خوام은 구어체 یه(하나의)와 می‌خوام(원해요)을 쓴 표현이에요. 방금 만난 종업원이 아니라 친한 친구나 가족에게만 쓰세요.
  fa.a1.unit06.lesson02.teach.register_note:
    title: 알맞은 주문 동사 고르기
    gloss: 낯선 사람이나 종업원에게는 می‌خواستم을, 친한 친구에게만 می‌خوام을 쓰세요.
    note: 1과의 인사말에서 배운 말투 구분을 주문에 맞게 적용한 거예요.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: 공손하게 빵 주문하기
    gloss: 빵 좀 주세요.
    note: 어떤 음식이나 음료 명사에도 같은 می‌خواستم 패턴을 쓸 수 있어요.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: 메뉴판
    gloss: 메뉴판
    note: منو는 외래어로, 한국어의 '메뉴'처럼 쓰여요.
    example_gloss: 메뉴판 부탁드려요.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: 메뉴판 요청하기
    gloss: 메뉴판 있나요?
    note: منو دارید؟는 문자 그대로 '메뉴판이 있나요?'라는 뜻으로, 메뉴판을 달라고 할 때 쓰는 보통 표현이에요.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: 추천 부탁하기
    gloss: 뭘 추천하세요?
    note: چی توصیه می‌کنید؟는 종업원에게 흔히 하는 자연스러운 질문이에요.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: 종업원이 묻는 말
    gloss: 무엇을 드릴까요?
    note: چی میل دارید؟는 종업원이 주문을 받기 시작할 때 쓰는 공손하고 표준적인 표현이에요.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: 닭고기 케밥
    gloss: 닭고기 케밥
    note: جوجه‌کباب(양념해서 구운 닭고기)은 이란 메뉴에서 가장 흔한 요리 중 하나예요.
    example_gloss: 닭고기 케밥을 주문할게요.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: 종업원이 요리를 추천할 때
    gloss: 오늘은 닭고기 케밥이 아주 맛있어요.
    note: خوبه는 خوب است의 구어체 줄임말로, 종업원이 편하게 추천할 때 자연스러워요.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: 네, 여기 있습니다
    gloss: 네, 여기 있습니다.
    note: بله는 '네'라는 뜻이에요. بفرمایید는 1과의 타로프 수업에서 나왔는데, 여기서도 메뉴판 같은 것을 건네줄 때 다시 써요.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: 차 한 잔
    gloss: 차 한 잔
    note: لیوان(잔)은 잔에 담겨 나오는 음료를 셀 때 쓰는 단위어예요.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: 빵 두 개
    gloss: 빵 두 개
    note: تا는 대부분의 셀 수 있는 물건을 셀 때 숫자 뒤에 붙는 단위어예요. 여기서는 빵 두 개를 세고 있어요.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: 밥 한 접시
    gloss: 밥 한 접시
    note: بشقاب(접시)은 접시에 담긴 음식을 셀 때 쓰는 단위어예요.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: 한 번에 전체 주문하기
    gloss: 밥 한 접시와 빵 두 개 주세요.
    note: 여러 수량 표현을 و(그리고)로 이어서 한 번에 주문할 수 있어요.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: 단위어 تا
    gloss: 'تا는 셀 수 있는 것의 숫자 뒤에 붙어요: دو تا(둘), سه تا(셋).'
    note: 3과에서 숫자와 함께 배운 것과 같은 기본 세는 방식을 음식 주문에 적용한 거예요.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: 계산서
    gloss: 계산서
    note: صورت‌حساب은 식당 계산서를 가리키는 표준 단어예요.
    example_gloss: 계산서 부탁드려요.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: 계산서 요청하기
    gloss: 계산서 좀 가져다주시겠어요?
    note: صورت‌حساب رو لطف می‌کنید؟는 식당에서 계산서를 요청할 때 쓰는 공손하고 자연스러운 표현이에요.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: 음식이 맛있었다고 말하기
    gloss: 아주 맛있었어요.
    note: خیلی خوشمزه بود는 식사 후에 종업원이나 초대한 사람에게 건네기 좋은 자연스러운 칭찬이에요.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: 맛있게 드세요
    gloss: 맛있게 드세요
    note: نوش جان은 식사 중이거나 식사하려는 사람에게 하는 말로, 한국어의 '맛있게 드세요'와 비슷해요. 먹는 사람이 자기 음식에 대해 하는 말은 아니에요.
  fa.a1.unit06.lesson05.teach.chashm:
    title: 종업원의 공손한 대답
    gloss: 바로 가져다 드릴게요.
    note: چشم، الان میارم은 직원이 요청을 공손하게 받아들이며 바로 가져오겠다고 할 때 쓰는 표현이에요.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: 식당
    gloss: 식당
    note: رستوران은 식당을 뜻하는 일반적인 단어로, 이 단원 대화의 배경이에요.
    example_gloss: 이 식당은 좋아요.
  fa.a1.unit06.lesson06.teach.turn01:
    title: 종업원이 손님을 맞이할 때
    gloss: 종업원이 손님을 맞이하며 무엇을 드시겠는지 물어요.
    note: چی میل دارید؟는 3과에서 나온 것과 같은 공손한 첫 질문이에요.
  fa.a1.unit06.lesson06.teach.turn02:
    title: 손님이 메뉴판을 요청할 때
    gloss: 손님이 종업원에게 인사하고 메뉴판을 요청해요.
    note: منو دارید؟로 주문 대화를 시작해요.
  fa.a1.unit06.lesson06.teach.turn03:
    title: 종업원이 메뉴판을 건넬 때
    gloss: 종업원이 그렇다고 답하며 메뉴판을 건네요.
    note: بفرمایید는 1과에서 나온 공손한 권유 표현으로, 여기서는 무언가를 건넬 때 써요.
  fa.a1.unit06.lesson06.teach.turn04:
    title: 손님이 추천을 부탁할 때
    gloss: 손님이 종업원에게 무엇을 추천하는지 물어요.
    note: 3과에 나온 چی توصیه می‌کنید؟예요.
  fa.a1.unit06.lesson06.teach.turn05:
    title: 종업원이 요리를 추천할 때
    gloss: 종업원이 오늘은 닭고기 케밥이 아주 맛있다고 말해요.
    note: جوجه‌کباب امروز خیلی خوبه에는 말할 때 자연스러운 구어체 خوبه가 쓰였어요.
  fa.a1.unit06.lesson06.teach.turn06:
    title: 손님이 전체 주문을 할 때
    gloss: 손님이 동의하며 닭고기 케밥과 밥, 그리고 차 한 잔을 주문해요.
    note: 여기서는 손님이 개인적으로 모르는 종업원에게 말하는 상황이라 می‌خواستم을 써요.
  fa.a1.unit06.lesson06.teach.turn07:
    title: 종업원이 주문을 받아들여요
    gloss: 종업원이 바로 가져다 드리겠다고 말해요.
    note: چشم، الان میارم은 lesson05에서 나온 표현이에요.
  fa.a1.unit06.lesson06.teach.turn08:
    title: 손님이 음식을 칭찬하고 계산서를 부탁해요
    gloss: 손님이 아주 맛있었다고 말하고 계산서를 부탁해요.
    note: 두 표현 모두 lesson05의 어휘를 그대로 다시 써요.
  fa.a1.unit06.lesson06.teach.turn09:
    title: 종업원이 계산서를 가져와요
    gloss: 종업원이 그러겠다고 답하며 바로 가져다 드리겠다고 말해요.
    note: البته(물론이죠)는 여기서 쓰기 좋은 자연스럽고 공손한 긍정 대답이에요.
exercises:
  fa.a1.unit06.lesson01.exercise01.recognize_naan:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 빵
    distractors:
    - 밥
    - 닭고기
    - 과일
    accepted_answers:
    - value: 빵
      status: correct
    feedback: نان은 '빵'이라는 뜻이에요.
  fa.a1.unit06.lesson01.exercise02.recognize_drinks:
    instruction: 다음 중 음식이 아니라 음료인 것은 무엇일까요?
    correct_option: چای
    distractors:
    - نان
    - برنج
    - مرغ
    accepted_answers:
    - value: چای
      status: correct
    feedback: چای(차)는 음료이고, 나머지는 음식이에요.
  fa.a1.unit06.lesson01.exercise03.recognize_naan_reading:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 빵
    distractors:
    - 커피
    - 차
    - 물
    accepted_answers:
    - value: 빵
      status: correct
    feedback: نان은 '빵'이라는 뜻이에요.
  fa.a1.unit06.lesson01.exercise04.match_food_words:
    instruction: 각 단어를 알맞은 한국어 뜻과 짝지으세요.
    accepted_answers:
    - value:
        نان: 빵
        برنج: 쌀밥
        مرغ: 닭고기
        آب: 물
        چای: 차
        قهوه: 커피
        میوه: 과일
      status: correct
    feedback: 이 일곱 단어는 이번 단원의 기본 음식·음료 어휘예요.
    pairs:
    - left: نان
      right: 빵
    - left: برنج
      right: 쌀밥
    - left: مرغ
      right: 닭고기
    - left: آب
      right: 물
    - left: چای
      right: 차
    - left: قهوه
      right: 커피
    - left: میوه
      right: 과일
  fa.a1.unit06.lesson01.exercise05.order_food_word:
    instruction: 단어를 배열해서 '빵과 밥과 닭고기'라고 말해 보세요.
    accepted_answers:
    - value:
      - نان
      - و
      - برنج
      - و
      - مرغ
      status: correct
    feedback: نان و برنج و مرغ는 و로 세 가지 음식을 이어서 나열해요.
  fa.a1.unit06.lesson01.exercise06.translate_fruit:
    instruction: '페르시아어로 번역하세요: 과일.'
    accepted_answers:
    - value: میوه
      status: correct
    feedback: میوه는 '과일'이라는 뜻이에요.
  fa.a1.unit06.lesson01.exercise07.write_own_drink:
    instruction: 좋아하는 음료인 차 또는 커피를 페르시아어로 쓰세요.
    accepted_answers:
    - value: چای
      status: correct
    - value: قهوه
      status: correct
    feedback: چای와 قهوه 둘 다 정답으로 인정돼요.
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: 이 표현은 무슨 뜻일까요?
    correct_option: 차 한 잔 주세요. (공손한 표현)
    distractors:
    - 차 한 잔 줘요. (격식 없는 표현)
    - 차 있어요?
    - 차가 맛있어요.
    accepted_answers:
    - value: 차 한 잔 주세요. (공손한 표현)
      status: correct
    feedback: می‌خواستم은 잘 모르는 사람에게 주문할 때 쓰는 공손한 형태예요.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام은 누구에게 말할 때 알맞을까요?
    correct_option: 집에서 차를 끓여 주는 친한 친구
    distractors:
    - 방금 만난 종업원
    - 모르는 가게 주인
    - 격식 있는 저녁 식사 자리의 어르신
    accepted_answers:
