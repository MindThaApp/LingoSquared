    gloss: 할인해 주세요?
    note: تخفیف می‌دید؟는 이란의 바자르와 가게에서 자주 쓰는 자연스러운 질문이에요. 흥정은 쇼핑 문화의 당연한 일부이고, 무례하거나 이상한 일이 아니에요.
  fa.a1.unit08.lesson04.teach.discount_offer:
