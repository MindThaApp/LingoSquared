    note: نقدی حساب می‌کنم은 نقدی(현금으로)를 써서 결제 방법을 말해요.
  fa.a1.unit08.lesson05.teach.card_question:
    title: 카드 결제 가능한지 묻기
    gloss: 카드 받으세요?
