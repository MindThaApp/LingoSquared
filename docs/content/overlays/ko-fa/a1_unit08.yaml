    gloss: 어서 오세요 / 말씀하세요 / 드세요
    note: بفرمایید는 인사 단원에서 배웠어요. 여기서는 가게 주인이 손님을 맞이할 때 써요.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: 감사합니다 (복습)
    gloss: 고맙습니다
    note: ممنون은 인사 단원에서 배웠어요.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: 별말씀을요 (복습)
    gloss: 별것 아니에요 / 천만에요
    note: قابلی نداره는 감사 인사를 겸손하게 받아넘기는 흔한 표현으로, 앞선 단원에서 이미 나왔어요.
  fa.a1.unit08.lesson06.teach.turn01:
    title: 가게 주인이 손님에게 인사하기
    gloss: 가게 주인이 손님에게 인사하며 맞이해요.
    note: بفرمایید는 손님에게 둘러보거나 필요한 것을 말씀하시라는 뜻이에요.
  fa.a1.unit08.lesson06.teach.turn02:
    title: 손님이 가격을 묻기
    gloss: 손님이 주인에게 인사하고 사과 가격을 물어요.
    note: lesson02의 این چنده؟를 سیب‌ها(사과들)에 적용한 문장이에요.
  fa.a1.unit08.lesson06.teach.turn03:
    title: 가게 주인이 가격을 말하기
    gloss: 가게 주인이 1킬로에 30토만이라고 말해요.
    note: lesson02의 کیلویی سی تومنه예요.
  fa.a1.unit08.lesson06.teach.turn04:
    title: 손님이 주문하고 할인을 요청하기
    gloss: 손님이 1킬로를 원한다고 말하고 할인을 부탁해요.
    note: lesson03의 수량 표현과 lesson04의 할인 질문을 합친 대화예요.
  fa.a1.unit08.lesson06.teach.turn05:
    title: 가게 주인이 낮은 가격에 동의하기
    gloss: 가게 주인이 승낙하며 28토만을 제안해요.
    note: باشه(좋아요)는 깎아 준 가격을 말하기 전에 동의를 나타내요.
  fa.a1.unit08.lesson06.teach.turn06:
    title: 손님이 감사하고 계산하기
    gloss: 손님이 주인에게 감사를 전하고 현금으로 낸다고 말해요.
    note: lesson05의 결제 어휘에 간단한 감사 인사를 더한 대화예요.
  fa.a1.unit08.lesson06.teach.turn07:
    title: 가게 주인이 거래를 마무리하기
    gloss: 가게 주인이 감사 인사를 받아넘기며 물건을 건네요.
    note: قابلی نداره، بفرمایید는 거래를 공손하게 마무리하는 말이에요.
