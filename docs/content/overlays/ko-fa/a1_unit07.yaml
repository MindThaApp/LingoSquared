    gloss: 날씨
    note: هوا는 날씨를 뜻하는 일반적인 단어예요(‘공기’라는 뜻도 있어요).
    example_gloss: 오늘 날씨가 어때요?
  fa.a1.unit07.lesson03.teach.weather_question:
    title: 날씨 묻기
    gloss: 날씨가 어때요?
    note: هوا چطوره؟는 1단원의 حالتون چطوره؟에서 이미 본 구어체 의문사 چطوره('어때요')를 다시 써요.
  fa.a1.unit07.lesson03.teach.today_word:
    title: 오늘
    gloss: 오늘
    note: امروز는 오늘을 나타내요.
    example_gloss: 오늘은 날씨가 좋아요.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: 내일
    gloss: 내일
    note: فردا는 다음 날을 나타내요.
    example_gloss: 내일 봐요.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: 오늘 날씨가 맑다고 말하기
    gloss: 오늘은 날씨가 맑아요.
    note: امروز هوا آفتابیه는 이 과정에서 이미 익힌 구어체 축약 -e(آفتابیه = آفتابی است)를 써요.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: 오늘 춥다고 말하기
    gloss: 오늘은 추워요.
    note: امروز سرده도 같은 축약 패턴을 따라요.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: 구어체 -e 축약
    gloss: آفتابیه는 آفتابی است를 일상 대화에서 줄여 말하는 형태예요.
    note: '이 패턴(형용사 + ه)은 모든 날씨 단어에 똑같이 적용돼요: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: 오늘 비가 온다고 말하기
    gloss: 오늘은 비가 와요.
    note: امروز بارونیه는 بارونی에도 같은 -e 축약을 적용한 표현이에요.
  fa.a1.unit07.lesson05.teach.because_word:
    title: 왜냐하면 / ~니까
    gloss: 왜냐하면 / ~니까
    note: چون은 제안의 이유를 말할 때 씁니다.
    example_gloss: 추워서 코트를 입어요.
  fa.a1.unit07.lesson05.teach.better_to:
    title: 우산을 가져가자고 제안하기
    gloss: 우산을 가져가는 게 좋겠어요.
    note: بهتره چتر ببریم은 구어체 بهتره(~하는 게 더 좋다)를 써서 부드럽게 제안하는 표현이에요.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: 이유와 제안을 함께 말하기
    gloss: 비가 오니까 우산을 가져가는 게 좋겠어요.
    note: چون بارونیه، بهتره چتر ببریم은 날씨라는 이유와 제안을 이어 줍니다.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: 코트를 입자고 제안하기
    gloss: 추우니까 코트를 입는 게 좋겠어요.
    note: چون سرده، بهتره کت بپوشیم은 같은 '이유 + 제안' 패턴을 추운 날씨에 적용한 문장이에요.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: 코트를 입자고 제안하기
    gloss: 코트를 입는 게 좋겠어요
    note: کت بپوشیم은 چتر ببریم처럼 بهتره + 동사 패턴을 추운 날씨에 적용한 표현이에요.
    example_gloss: 날씨가 추우니까 코트를 입어요.
  fa.a1.unit07.lesson06.teach.turn01:
    title: 사라가 오늘 날씨를 묻는다
    gloss: 사라가 오늘 날씨가 어떤지 물어요.
    note: هوا چطوره؟는 lesson03에서 나온 질문을 다시 쓴 거예요.
  fa.a1.unit07.lesson06.teach.turn02:
    title: 레자가 비가 온다고 말한다
    gloss: 레자가 비가 오는 것 같다고 말해요.
    note: فکر کنم(~인 것 같아요)은 확실하지 않고 추측하는 것이라서 말을 부드럽게 해 줘요.
  fa.a1.unit07.lesson06.teach.turn03:
    title: 사라가 우산을 가져가자고 제안한다
    gloss: 사라가 그럼 우산을 가져가는 게 좋겠다고 말해요.
    note: پس(그럼, 그러면)는 날씨 이야기와 제안을 이어 줘요.
  fa.a1.unit07.lesson06.teach.turn04:
    title: 레자가 동의하고 내일을 묻는다
    gloss: 레자가 동의하고 내일은 어떤지 물어요.
    note: فردا چی؟는 다음 날을 간단하고 자연스럽게 묻는 표현이에요.
  fa.a1.unit07.lesson06.teach.turn05:
    title: 사라가 내일 날씨를 말한다
    gloss: 사라가 내일은 맑고 덥다고 말해요.
    note: آفتابیه و گرمه는 줄여 쓴 날씨 표현 두 개를 و로 이은 거예요.
  fa.a1.unit07.lesson06.teach.turn06:
    title: 레자가 공원에 가자고 제안한다
    gloss: 레자가 좋다면서 그럼 공원에 가자고 말해요.
    note: عالیه(아주 좋아요)는 계획을 제안하기 전에 긍정적으로 반응하는 말이에요.
  fa.a1.unit07.lesson06.teach.turn07:
    title: 사라가 동의하고 작별 인사를 한다
    gloss: 사라가 동의하며 내일 보자고 말해요.
    note: باشه(좋아요)는 계획에 동의할 때 흔히 쓰는 구어체 표현이에요.
