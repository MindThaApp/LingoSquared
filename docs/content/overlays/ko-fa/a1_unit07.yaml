teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: 맑음
    gloss: 화창한
    note: آفتابی는 맑은 날씨를 나타내요.
    example_gloss: 오늘은 날씨가 화창해요.
  fa.a1.unit07.lesson01.teach.rainy:
    title: 비 오는
    gloss: 비 오는
    note: بارونی는 بارانی(비 오는)의 일상 구어체 표기이자 발음이에요.
    example_gloss: 내일은 비가 올 거예요.
  fa.a1.unit07.lesson01.teach.cloudy:
    title: 흐림
    gloss: 흐린
    note: ابری는 흐린 날씨를 나타내요.
    example_gloss: 날씨가 흐려요.
  fa.a1.unit07.lesson01.teach.snowy:
    title: 눈 오는
    gloss: 눈 오는
    note: برفی는 눈이 오는 날씨를 나타내요.
    example_gloss: 겨울에는 눈이 와요.
  fa.a1.unit07.lesson01.teach.or_word:
    title: 또는
    gloss: 또는
    note: یا는 두 가지 날씨 상태를 '또는'으로 이어 줘요.
    target_text: یا (또는)
  fa.a1.unit07.lesson02.teach.hot:
    title: 더운
    gloss: 더운
    note: گرم은 더운 날씨나 일반적인 따뜻한 기온을 나타내요.
    example_gloss: 오늘은 날씨가 더워요.
  fa.a1.unit07.lesson02.teach.cold:
    title: 추위
    gloss: 추운
    note: سرد는 추운 날씨나 일반적인 차가운 기온을 나타내요.
    example_gloss: 겨울에는 날씨가 추워요.
  fa.a1.unit07.lesson02.teach.cool:
    title: 선선한
    gloss: 선선한
    note: خنک는 گرم과 سرد 사이의 온화하고 선선한 날씨를 나타내요.
    example_gloss: 저녁에는 선선해요.
  fa.a1.unit07.lesson03.teach.weather_word:
