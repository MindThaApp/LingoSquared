teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: 돈
    gloss: 돈
    note: پول은 '돈'을 뜻하는 일반적인 단어예요.
    example_gloss: 내 돈은 어디에 있어요?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: 은행
    gloss: 은행
    note: بانک은 '은행'을 뜻하는 일반적인 단어예요.
    example_gloss: 은행이 가까워요.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: 달러
    gloss: 달러
    note: دلار는 (미국) 달러를 뜻하며, 일상적인 환전 대화에서 가장 흔히 나오는 외화예요.
    example_gloss: 저는 달러가 있어요.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: 환전
    gloss: 환전
    note: تبدیل은 '환전하다/바꾸다'라는 뜻이고, کردن('하다')과 함께 تبدیل کردن으로 써요.
    example_gloss: (돈을) 환전하고 싶어요.
  fa.a1.unit21.lesson01.teach.va_word:
    title: 그리고
    gloss: 그리고
    note: و는 앞 단원에서 배운 대표적인 연결 단어예요. 복습해요.
    target_text: و (그리고)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: 환전하고 싶다고 말하기
    gloss: 달러를 토만으로 환전하고 싶어요.
    note: می‌خوام دلار به تومن تبدیل کنم에서는 바꿀 대상 통화를 나타낼 때 به(~으로)를 써요.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: 달러가 얼마나 있는지 묻기
    gloss: 달러를 얼마나 갖고 계세요?
    note: '*چقدر دلار دارید؟*에는 *چقدر*(얼마, 얼마나)가 쓰였어요. 앞서 수량을 묻는 질문에서 본 단어예요.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: 현금자동입출금기
    gloss: ATM
    note: خودپرداز는 글자 그대로 '스스로 지급하는 것'이라는 뜻이며, ATM 기계를 가리키는 표준어예요.
    example_gloss: ATM은 저기에 있어요.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: 돈을 인출하고 싶다고 말하기
    gloss: ATM에서 돈을 인출하고 싶어요.
    note: می‌خوام از خودپرداز پول بردارم에는 از(~에서)와 بردارم(인출해요, 꺼내요)이 쓰였어요.
  fa.a1.unit21.lesson04.teach.change_question:
    title: 잔돈이 있는지 묻기
    gloss: 잔돈 있으세요?
    note: پول خرد دارید؟에서는 پول(돈) 뒤에 خرد(작은, 잔돈)가 와요.
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: 여기 있어요 (복습)
    gloss: 여기 있어요 / 어서 하세요
    note: '*بفرمایید*는 앞 단원에서 배웠어요. 여기서는 무언가를 건네줄 때 써요.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: 환율
    gloss: 환율
    note: نرخ는 (환)율을 뜻하는 단어예요.
    example_gloss: 오늘 환율이 얼마예요?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: 달러당 환율 말하기
    gloss: 1달러에 30토만이에요.
    note: هر دلار سی تومنه에는 هر(각, ~마다)와 이미 배운 구어체 축약 -e(*تومنه* = *تومن است*)가 쓰였어요.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: 백
    gloss: 백
    note: صد는 숫자 100이에요.
    example_gloss: 저는 100달러가 있어요.
  fa.a1.unit21.lesson06.teach.please_do:
    title: 해 주세요
    gloss: 환전해 주세요
    note: لطفاً تبدیل کنید는 تبدیل کردن(바꾸다)의 공손한 명령형이에요.
  fa.a1.unit21.lesson06.teach.turn01:
    title: 사라가 환전을 부탁해요
    gloss: 사라가 직원에게 인사하고 달러를 토만으로 환전하고 싶다고 말해요.
    note: 앞 레슨의 می‌خوام دلار به تومن تبدیل کنم을 다시 써요.
  fa.a1.unit21.lesson06.teach.turn02:
    title: 직원이 달러가 얼마나 있는지 물어요
    gloss: 직원이 사라에게 인사하고 달러가 얼마나 있는지 물어요.
    note: 앞 레슨의 چقدر دلار دارید؟를 다시 써요.
  fa.a1.unit21.lesson06.teach.turn03:
    title: 사라가 금액을 말하고 환율을 물어요
    gloss: 사라가 100달러가 있다고 말하고 오늘 환율을 물어요.
    note: صد(백)는 새 단어예요. نرخ امروز چنده؟는 앞 레슨의 환율 질문을 다시 써요.
  fa.a1.unit21.lesson06.teach.turn04:
    title: 직원이 환율을 말해요
    gloss: 직원이 1달러에 30토만이라고 말해요.
    note: 앞 레슨의 هر دلار سی تومنه를 다시 써요.
  fa.a1.unit21.lesson06.teach.turn05:
    title: 사라가 동의하고 진행해 달라고 부탁해요
    gloss: 사라가 알겠다고 하고 환전해 달라고 정중히 부탁해요.
    note: لطفاً تبدیل کنید는 이번 레슨에서 앞서 배웠어요.
  fa.a1.unit21.lesson06.teach.turn06:
    title: 직원이 총액을 건네요
    gloss: 여기 있어요, 3천 토만입니다.
    note: '*سه هزار تومن* = 100달러 × 달러당 30토만이에요. *هزار*(천)는 숫자 단원에서 복습한 단어예요.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: 사라가 감사 인사를 하고 잔돈도 있는지 물어요
    gloss: 감사합니다. 잔돈도 있으세요?
    note: 앞 레슨의 پول خرد دارید؟에 هم(~도)을 더했어요.
  fa.a1.unit21.lesson06.teach.turn08:
    title: 직원이 그렇다고 답하며 건네요
    gloss: 네, 여기 있어요.
    note: بله(네)는 복습 단어예요. بفرمایید로 환전을 마무리해요.
