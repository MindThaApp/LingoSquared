    title: 전화하세요!
    gloss: 전화하세요!
    note: '*زنگ بزنید!*는 앞에서 배운 *زنگ زدن*(''전화하다'')의 공손한 명령형입니다.'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: '니마: 여보세요! 도와주세요! 경찰이 필요해요!'
    gloss: 여보세요! 도와주세요! 경찰이 필요해요!
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: '사라: 알겠어요. 경찰이 가요.'
    gloss: 알겠어요. 경찰이 가요.
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: '니마: 고마워요! 빨리 오세요!'
    gloss: 고마워요! 빨리 오세요!
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: '사라: 알겠어요!'
    gloss: 알겠어요!
  fa.a1.unit39.lesson05.teach.reading_note:
    title: 이 안내문에 대해
    gloss: 사고 / 위험 / 불
    note: 안내문에서는 각 응급 상황 뒤에 물음표가 붙어, '사고가 났나요?'라고 묻는 것처럼 보입니다. 전화해야 할 기관은 바로 그 뒤에 나옵니다.
  fa.a1.unit39.lesson05.teach.reading_text:
    title: '읽기: 응급 안내문'
    gloss: 사고? 구급차가 필요해요! 위험? 경찰이 필요해요! 불? 소방서가 필요해요! 빨리 전화하세요!
    note: 응급 상황 유형별로 어디에 전화해야 하는지 알려 주는 짧은 안내문입니다.
  fa.a1.unit39.lesson06.teach.review_polis_komak:
