    example_gloss: 응급 상황이에요! 도와주세요!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: '복습: 여보세요 / 알겠어요 / 고마워요'
    gloss: 여보세요(전화) / 알겠어요 / 고마워요
    note: '*الو*, *باشه*, *ممنون*은 앞에서 이미 배웠습니다.'
  fa.a1.unit39.lesson04.teach.review_miad:
    title: 오고 있어요
    gloss: 오고 있어요
    note: '*میاد*(''그/그녀/그것이 오고 있어요'')는 앞에서 배운 *میام*(''저는 가고 있어요''가 아니라 ''저는 오고 있어요'')과 같은 인칭 어미 규칙을 따릅니다.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: 빨리 오세요!
    gloss: 빨리 오세요!
    note: '*زود*는 ''빨리''라는 뜻이고, *بیایید*는 ''오세요!''라는 공손한 명령형입니다.'
