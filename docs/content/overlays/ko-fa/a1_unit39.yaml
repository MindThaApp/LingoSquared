  fa.a1.unit39.lesson01.teach.lazame:
    title: 필요한
    gloss: 필요해요
    note: '*لازمه*는 ''필요해요''라는 뜻의 한 단어로, *قشنگه*(''예뻐요'')나 *گرمه*(''더워요'')와 같은 방식으로 만들어져요.'
    example_gloss: 도움이 필요해요!
  fa.a1.unit39.lesson01.teach.polis:
    title: 경찰
    gloss: 경찰
    note: '*پلیس*은 ''경찰''이라는 뜻의 외래어로, 일상 대화에서 쓰입니다.'
    example_gloss: 경찰이 필요해요!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: 구급차
    gloss: 구급차
    note: '*آمبولانس*는 ''구급차''라는 뜻입니다.'
    example_gloss: 구급차가 필요해요!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: 소방서
    gloss: 소방서
    note: '*آتش‌نشانی*는 ''소방서'' 또는 ''소방대''라는 뜻입니다.'
    example_gloss: 소방서가 필요해요!
  fa.a1.unit39.lesson02.teach.atash:
    title: 불
    gloss: 불
    note: '*آتش*는 ''불''이라는 뜻으로, *آتش‌نشانی*(''소방서'')의 어근입니다.'
    example_gloss: 불이야! 소방서가 필요해요!
  fa.a1.unit39.lesson02.teach.khatar:
    title: 위험
    gloss: 위험
    note: '*خطر*는 ''위험''이라는 뜻입니다.'
    example_gloss: 위험해요! 경찰이 필요해요!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: '복습: 격식체 명령형과 비격식체 명령형'
    gloss: 하세요! (격식) / 해! (비격식)
    note: '*کنید*는 격식을 갖춘 명령형 또는 복수 명령형 어미입니다. 친구에게 쓰던 *استراحت کن*(''쉬어!'')의 *کن*은 잘 아는 한 사람에게 쓰는 비격식 형태입니다.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: 도와주세요!
    gloss: 도와주세요!
    note: '*کمک کنید!*는 도움을 청할 때 쓰는 공손한 표현으로, 낯선 사람이나 긴급 구조대에게 알맞습니다.'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: 사고
    gloss: 사고
    note: '*تصادف*는 ''사고''라는 뜻입니다.'
    example_gloss: 사고예요! 도와주세요!
