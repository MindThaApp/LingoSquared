teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: 그 / 그녀
    gloss: 그 / 그녀
    note: '*او*는 여기서 외모를 묘사하는 문장의 주어로 다시 나와요. 페르시아어 او는 남녀 구분 없이 쓰여요.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: 키
    gloss: 키
    note: '*قد*가 여기서 다시 나옵니다. *قدش*는 *-ش* 소유 접미사가 붙은 형태(그/그녀의 키)로, 20단원의 *امتحانش*와 같은 방식이에요.'
    example_gloss: 니마는 키가 커요.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: 키가 큰
    gloss: 키가 큰
    note: '*بلند*는 ''키가 큰'' 또는 ''긴''이라는 뜻이에요. *قدش بلنده*는 직역하면 ''그/그녀의 키가 크다''로, 누군가 키가 크다고 말할 때 쓰는 자연스러운 구어체 표현이에요.'
    example_gloss: 그는 키가 커요.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: 키가 작은
    gloss: 키가 작은
    note: '*کوتاه*는 ''키가 작은'' 또는 ''짧은''이라는 뜻이에요.'
    example_gloss: 그는 키가 작아요.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: 머리카락
    gloss: 머리카락
    note: '*مو*는 머리카락을 뜻해요. *موی*는 형용사 앞에서 쓰는 에자페(연결) 형태로, *موی بلند*(긴 머리)처럼 써요.'
    example_gloss: 그는 머리가 길어요.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: 그/그녀의 머리카락
    gloss: 그/그녀의 머리카락
    note: '*موهاش*는 복수형 *موها*(머리카락들)에 *-ش* 소유 접미사가 결합한 형태로, ''그/그녀의 머리카락''이라는 뜻이에요.'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: 검은색
    gloss: 검은색
    note: '*مشکی*는 머리카락이나 눈동자가 검다고 할 때 일상적으로 쓰는 구어체 단어예요. 여기서는 20단원의 *سیاه*보다 더 자연스러워요. سیاه는 머리카락보다 옷에 더 잘 어울려요.'
    example_gloss: 그녀는 머리카락이 검어요.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: 금발
    gloss: 금발의
    note: '*بلوند*(외래어)는 금발이라는 뜻이에요.'
    example_gloss: 그녀의 머리카락은 금발이에요.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: 눈
    gloss: 눈
    note: '*چشم*은 눈을 뜻해요. *چشمای*는 구어체 복수형 + 에자페 형태(~의 눈들)로, *چشمای آبی*(파란 눈)처럼 써요.'
    example_gloss: 그는 갈색 눈을 가졌어요.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: 그/그녀의 눈
    gloss: 그/그녀의 눈
    note: '*چشماش*는 구어체 복수형 *چشما*에 *-ش* 소유 접미사가 결합한 형태로, ''그/그녀의 눈''이라는 뜻이에요. *چشماش آبیه*에서 *چشما*가 복수인데도 단수 어미 *-ه*를 쓰는 점에 주의하세요. 페르시아어에서는 사람이 아닌 복수 명사에 보통 단수 동사를 쓰기 때문에 자연스러운 현상이에요.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: 갈색
    gloss: 갈색의
    note: '*قهوه‌ای*(직역하면 ''커피색'')는 갈색을 뜻해요.'
    example_gloss: 그녀의 눈은 갈색이에요.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: 초록색
    gloss: 초록색
    note: '*سبز*는 초록색을 뜻해요.'
    example_gloss: 그녀의 눈은 초록색이에요.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: 파란색
    gloss: 파란색
    note: '*آبی*가 여기서 눈동자 색을 말할 때 다시 나옵니다.'
    example_gloss: 그녀의 눈은 파란색이에요.
  fa.a1.unit25.lesson04.teach.man_review:
    title: 나
    gloss: 나
    note: 이미 익숙한 *من*이 여기서 자기 외모를 설명할 때 다시 나옵니다.
    example_gloss: 저는 갈색 머리예요.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: 나는 ~을 가지고 있다 / 그(녀)는 ~을 가지고 있다
    gloss: 나는 ~을 가지고 있다 / 그(녀)는 ~을 가지고 있다
    note: '*دارم*/*داره*는 신체적 특징을 말할 때도 똑같이 쓰여요. *موی مشکی دارم*은 ''저는 검은 머리예요.''라는 뜻이에요.'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: 안경
    gloss: 안경
    note: '*عینک*은 안경을 뜻해요.'
    example_gloss: 그는 안경을 써요.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: 그/그녀가 쓰다
    gloss: (그/그녀가) 써요
    note: '*می‌زنه*(직역하면 ''치다'')는 안경을 쓴다고 할 때 쓰는 자연스러운 동사예요. *عینک می‌زنه*는 ''안경을 쓴다''는 뜻이며, 8단원과 24단원의 *می‌کنم*(하다/만들다)과는 다른 동사예요.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: 그/그녀는 어떻게 생겼어요?
    gloss: 그/그녀는 어떻게 생겼어요?
    note: '*چه شکلیه؟*는 직역하면 ''어떤 모양이에요?''로, 누군가의 외모를 물을 때 쓰는 표준적인 구어체 표현이에요.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: 그리고
    gloss: 그리고, ~와/과
    note: '*و*는 ''그리고''라는 뜻이에요. 14단원과 24단원에서도 이미 이렇게 썼어요.'
    example_gloss: 그는 키가 크고 머리카락은 검은색이에요.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: 니마
    gloss: 니마
    note: 11단원에서 등장인물로 소개된 *نیما*가 여기서 다시 나옵니다.
    example_gloss: 니마는 사라의 친구예요.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: '읽기: 니마의 외모'
    gloss: 니마는 키가 커요. 머리카락은 검은색이고 눈은 갈색이에요. 안경을 써요.
    note: 이 읽기 글은 1~4과의 모든 구문을 다시 사용해요. 새 어휘는 거의 없고, 이어지는 글 속에서 익힌 표현을 알아보는 연습이에요.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: 마리암
    gloss: 마리암
    note: '*مریم*은 새로운 등장인물로, نیما가 아직 만나 보지 못한 سارا의 친구예요.'
    example_gloss: 마리암은 사라의 친구예요.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: 지금
    gloss: 지금
    note: '*الان*이 여기서 다시 나옵니다.'
    example_gloss: 마리암은 지금 와요.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: 오고 있다
    gloss: 오는 중이에요
    note: '*میاد*는 *آمدن*(오다)의 구어체 현재형이에요.'
    example_gloss: 마리암은 지금 와요.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: 무슨 색이에요?
    gloss: 무슨 색이에요?
    note: '*چه رنگیه؟*는 *چه*(무엇, 4과), *رنگی*(색깔의, *رنگ* + *-ی*), *-ه*(~이다)가 결합한 말로, ''무슨 색이에요?''라는 뜻이에요.'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: 알겠어요, 고마워요
    gloss: 알겠어요, 고마워요
    note: 앞에서 배운 *باشه*와 *ممنون*이 여기서 대화를 마무리하는 자연스러운 말로 함께 쓰여요.
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: '사라: 마리암이 지금 와요.'
    gloss: 마리암은 지금 와요.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: '니마: 마리암은 어떻게 생겼어요?'
    gloss: 마리암은 어떻게 생겼어요?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: '사라: 키가 크고 머리카락은 검은색이에요.'
    gloss: 키가 크고 머리카락은 검은색이에요.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: '니마: 눈은 무슨 색이에요?'
    gloss: 눈은 무슨 색이에요?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: '사라: 눈은 갈색이에요.'
    gloss: 그녀의 눈은 갈색이에요.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: '니마: 알겠어요, 고마워요.'
    gloss: 알겠어요, 고마워요.
