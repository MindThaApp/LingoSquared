course:
  title: 페르시아어 A1
  description: '이란 페르시아어 입문: 키(큼/작음), 머리카락(길이와 색: 검은색, 금발), 눈 색(갈색, 초록색, 파란색), 안경 착용 여부를 묘사하기, "그/그녀는 어떻게 생겼어요?" 묻기, نیما 자신의 외모에 관한 짧은 읽기 글, 그리고 سارا의 친구 مریم을 알아보는 것에 대한 نیما와 سارا의 마무리 대화.'
