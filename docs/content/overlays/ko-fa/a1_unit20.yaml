  fa.a1.unit20.lesson01.teach.shirt_word:
    title: 셔츠
    gloss: 셔츠
    note: پیراهن은 셔츠를 가리키는 일반적인 말이에요.
    example_gloss: 셔츠를 원해요.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: 바지
    gloss: 바지
    note: شلوار는 '바지'라는 뜻이에요.
    example_gloss: 이 바지는 얼마예요?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: 신발
    gloss: 신발
    note: کفش는 '신발'이라는 뜻이에요.
    example_gloss: 신발 있어요?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: 재킷
    gloss: 재킷
    note: کت는 정장 재킷이나 블레이저 같은 재킷을 뜻해요. 두꺼운 겨울 코트는 보통 다른 말로 불러요.
    example_gloss: 재킷을 원해요.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: 멋진 / 예쁜
    gloss: 멋진
    note: قشنگ는 '멋지다, 예쁘다'를 뜻하는 일상적인 말로, 축약형 -e(قشنگه)와 함께 자주 써요.
    example_gloss: 이 재킷 멋져요.
  fa.a1.unit20.lesson01.teach.want_word:
    title: 원해요 (복습)
    gloss: 저는 원해요
    note: '*می‌خوام*은 *می‌خواهم*의 일상 구어 형태예요. 앞 유닛에서 배웠고, 이번 유닛에서 옷을 요청할 때 계속 쓰여요.'
    target_text: می‌خوام (원해요)
  fa.a1.unit20.lesson01.teach.va_word:
    title: 그리고 (복습)
    gloss: 그리고
    note: '*و*는 ''그리고''를 뜻하는 흔한 연결어로, 앞 유닛에서 복습했어요.'
    target_text: و (그리고)
  fa.a1.unit20.lesson02.teach.color_word:
    title: 색
    gloss: 색
    note: رنگ는 '색'을 뜻하는 일반적인 말이에요.
    example_gloss: 무슨 색을 원하세요?
  fa.a1.unit20.lesson02.teach.red_word:
