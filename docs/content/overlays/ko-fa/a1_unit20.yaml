    gloss: 중간(의)
    note: متوسط는 '중간, 보통 사이즈'라는 뜻이에요.
    example_gloss: 중간 사이즈 있어요?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: 입어 봐도 되는지 묻기
    gloss: 입어 봐도 돼요?
    note: می‌تونم امتحانش کنم؟는 옷을 입어 봐도 되는지 물을 때 일상에서 쓰는 구어체 표현이에요.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: 네, 그러세요
    gloss: 네, 그러세요.
    note: '*بله، بفرمایید*는 가게 주인이 정중하게 허락할 때 쓰는 말이에요. 앞선 단원에서 배운 *بفرمایید*가 다시 나와요.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: 구어체 می‌تونم 축약형 (복습)
    gloss: 저는 ~할 수 있어요 (구어체)
    note: 일상 대화에서는 글로 쓰는 -ان-이 -ون-으로 바뀌는 경우가 많아요. *می‌توانم*이 *می‌تونم*(할 수 있어요)이 되는 식이에요. *تومان*의 구어체인 *تومن*에서도 같은 변화를 이미 봤어요.
  fa.a1.unit20.lesson05.teach.label_text:
    title: 옷 라벨
    gloss: '사이즈: 라지. 색상: 빨간색.'
    note: 실제 옷에 붙어 있는 것과 같은 형식의 짧은 라벨(택)이에요.
  fa.a1.unit20.lesson06.teach.please_review:
    title: 여기 있습니다 / 그러세요 (복습)
    gloss: 여기 있습니다 / 그러세요
    note: 앞선 단원에서 배운 표현을 복습해요.
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: 감사합니다 (복습)
    gloss: 고맙습니다
    note: 앞선 단원에서 배운 표현을 복습해요.
  fa.a1.unit20.lesson06.teach.ok_review:
    title: 알겠어요 (복습)
    gloss: 괜찮은
    note: 앞선 단원에서 배운 표현을 복습해요.
  fa.a1.unit20.lesson06.teach.turn01:
    title: 가게 주인이 손님에게 인사해요
    gloss: 안녕하세요, 어서 오세요.
  fa.a1.unit20.lesson06.teach.turn02:
    title: 니마가 파란색 셔츠를 찾아요
    gloss: 안녕하세요. 파란색 셔츠를 원해요.
  fa.a1.unit20.lesson06.teach.turn03:
    title: 가게 주인이 사이즈를 물어요
    gloss: 어떤 사이즈를 원하세요?
  fa.a1.unit20.lesson06.teach.turn04:
    title: 니마가 사이즈를 말하고 입어 봐도 되는지 물어요
    gloss: 중간 사이즈요. 입어 봐도 돼요?
  fa.a1.unit20.lesson06.teach.turn05:
    title: 가게 주인이 허락해요
    gloss: 네, 그러세요.
  fa.a1.unit20.lesson06.teach.turn06:
    title: 니마가 마음에 들어 하며 가격을 물어요
    gloss: 예쁘네요. 이거 얼마예요?
  fa.a1.unit20.lesson06.teach.turn07:
    title: 가게 주인이 가격을 말해요
    gloss: 3만 토만이에요.
  fa.a1.unit20.lesson06.teach.turn08:
    title: 니마가 현금으로 내겠다고 해요
    gloss: 네, 현금으로 계산할게요. 감사합니다.
