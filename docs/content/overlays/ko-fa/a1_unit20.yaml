    note: کوچیک은 '작다, 작은'이라는 뜻이에요. '작아요'라고 할 때는 줄임형 -e를 붙여 کوچیکه라고 해요.
    example_gloss: 이 신발은 작아요.
  fa.a1.unit20.lesson03.teach.medium_word:
