    gloss: 파란색
    note: آبی는 '파란색'이라는 뜻이며, 축약형 -e(آبیه)를 붙여 '파래요'라고 말해요.
    example_gloss: 내 바지는 파래요.
  fa.a1.unit20.lesson02.teach.black_word:
    title: 검은색
    gloss: 검은색
    note: سیاه는 '검은색'이라는 뜻이에요.
    example_gloss: 검은색 신발이 예뻐요.
  fa.a1.unit20.lesson02.teach.white_word:
