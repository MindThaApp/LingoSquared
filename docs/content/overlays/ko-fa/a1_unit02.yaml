course:
  title: 페르시아어 A1
  description: 문자 읽기, 일상 대화 이해, 실용적인 회화를 공손하게 구사하는 데 초점을 맞춘 이란 페르시아어 초급 과정이에요.
units:
  fa.a1.unit02.introductions:
    title: 이름, 출신, 자기소개
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: 자기소개에 쓰는 글자 읽기
  fa.a1.unit02.lesson02.names:
    title: 이름 묻고 말하기
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: 단수 인칭대명사와 be동사
  fa.a1.unit02.lesson04.countries_nationalities:
    title: 나라와 국적
  fa.a1.unit02.lesson05.origin:
    title: 어디 출신인지 묻기
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: 페르시아어 수업에서 만나기
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: 글자 ن 과 ت
    gloss: n과 t
    note: ن 은 n을 나타내요. ت 은 t를 나타내며, 둘 다 양쪽 글자와 이어 써요.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: 글자 ش 와 چ
    gloss: sh와 ch
    note: ش 은 sh를, چ 은 ch를 나타내요.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: 글자 ی 와 ه
    gloss: y/긴 i와 h
    note: ی 은 y 또는 긴 ī 소리가 나요. ه 은 h이고, 이어 쓸 때 모양이 바뀌어요.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: 글자 ک 와 گ
    gloss: k와 g
    note: ک 은 k를 나타내요. 입력할 때는 모양이 비슷한 아랍어 글자가 아니라 페르시아어 ک 을 쓰세요. گ 은 ک 에 획이 하나 더 있고 g를 나타내요.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: 글자 ج 와 د
    gloss: j와 d
    note: ج 은 j를 나타내요. د 은 d를 나타내며 왼쪽 글자와 이어지지 않아요.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: 글자 ر 와 ف
    gloss: r와 f
    note: ر 은 r를 나타내며 뒤 글자와 이어지지 않아요. ف 은 f를 나타내요.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: 글자 و 와 ب
    gloss: v/o/u와 b
    note: و 은 v 또는 모음을 나타낼 수 있으며 뒤 글자와 이어지지 않아요. ب 은 b를 나타내요.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: 글자 خ 와 ز
    gloss: kh와 z
    note: خ 은 흔히 kh로 적는 소리예요. ز 은 z를 나타내요.
  fa.a1.unit02.lesson02.teach.esm:
    title: 이름
    gloss: 이름
    note: اسم 은 일반적인 이란 페르시아어에서 esm으로 읽어요.
    example_gloss: 제 이름은 사라예요.
  fa.a1.unit02.lesson02.teach.man:
    title: 나
    gloss: 나
    note: من 은 1인칭 단수 대명사예요.
  fa.a1.unit02.lesson02.teach.sara:
    title: 사라
    gloss: 사라
    note: سارا 는 이란에서 흔한 여자 이름이에요.
    example_gloss: 사라는 제 친구예요.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: 격식 있는 자기소개 또는 글에서의 자기소개
    gloss: 제 이름은 사라예요.
    note: '*اسم من سارا است* 은 맞는 표현이지만 격식을 갖춘 말이라, 주로 글에서 볼 수 있어요.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: 자연스러운 구어체 자기소개
    gloss: 제 이름은 사라예요.
    note: اسمم 은 اسم من 을 줄인 말이고, ساراست 은 سارا 와 است 를 합친 말이에요.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: 공손하게 이름 묻기
    gloss: 이름이 뭐예요?
    note: اسم شما چیه؟ 은 이란 페르시아어에서 흔히 쓰는 중립적이고 공손한 구어체 표현이에요.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: 격식 없이 이름 묻기
    gloss: 이름이 뭐예요?
    note: اسمت چیه؟ 은 단수이고 친근한 말투예요. 관계가 허락할 때만 쓰세요.
  fa.a1.unit02.lesson03.teach.man:
    title: 나
    gloss: 나
    note: من 에는 문법적 성이 없어요.
  fa.a1.unit02.lesson03.teach.to:
    title: 너, 친근한 단수 표현
    gloss: 너 / 당신
    note: تو 는 친근한 단수 표현이에요. 공손하게 부를 때는 보통 شما 를 써요.
  fa.a1.unit02.lesson03.teach.oo:
    title: 그 또는 그녀
    gloss: 그 / 그녀
    note: او 는 성별 구분이 없어서 그와 그녀를 모두 가리킬 수 있어요.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: 저는 ~이에요
    gloss: 저는 ~이에요
    note: هستم 은 بودن 의 1인칭 단수 완전한 형태예요.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: 너는 ~이야
    gloss: 당신은 ~이에요
    note: هستی 은 친근한 단수 تو 와 짝을 이뤄요.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: 그 또는 그녀는 ~이에요
    gloss: 그/그녀는 ~이에요; 그/그녀가 있어요
    note: هست 은 3인칭 단수의 완전한 형태이고, 존재나 강조의 뜻을 담는 경우가 많아요.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: 격식 있는 신분·국적 서술
    gloss: 그 또는 그녀는 이란 사람이에요.
    note: 격식 있는 문어체의 신분·국적 문장에서 است는 일반적인 3인칭 copula(~이다)예요.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: 구어체 서술어
    gloss: 그 사람은 이란 사람이에요.
    note: ایرانیه는 ایرانی است를 줄여 말하는 자연스러운 구어체예요.
  fa.a1.unit02.lesson04.teach.iran:
    title: 이란
    gloss: 이란
    note: ایران은 나라 이름이에요.
    example_gloss: 저는 이란 출신이에요.
  fa.a1.unit02.lesson04.teach.iranian:
    title: 이란 사람
    gloss: 이란의 / 이란 사람
    note: ایرانی는 국적이나 출신을 나타낼 수 있어요.
    example_gloss: 저는 이란 사람이에요.
  fa.a1.unit02.lesson04.teach.england:
    title: 영국(잉글랜드)
    gloss: 잉글랜드
    note: '*انگلیس*는 보통 잉글랜드를 뜻하지만, 일상 대화에서 이란 사람들은 영국 전체를 가리킬 때도 자주 써요.'
    example_gloss: 저는 영국 출신이에요.
  fa.a1.unit02.lesson04.teach.english:
    title: 영국 사람, 영어
    gloss: 영국의 / 영국 사람 / 영어
    note: انگلیسی는 국적, 언어, 영국과 관련된 것을 나타낼 수 있어요. 어떤 뜻인지는 문맥으로 알 수 있어요.
    example_gloss: 저는 영국 사람이에요.
  fa.a1.unit02.lesson04.teach.france:
    title: 프랑스
    gloss: 프랑스
    note: فرانسه는 프랑스라는 나라 이름이에요.
    example_gloss: 저는 프랑스 출신이에요.
  fa.a1.unit02.lesson04.teach.french:
    title: 프랑스 사람, 프랑스어
    gloss: 프랑스의 / 프랑스 사람 / 프랑스어
    note: فرانسوی는 국적이나 프랑스와 관련된 것을 나타낼 수 있어요.
    example_gloss: 저는 프랑스 사람이에요.
  fa.a1.unit02.lesson04.teach.country:
    title: 나라
    gloss: 나라
    note: کشور는 나라를 뜻하는 일반적인 단어예요.
    example_gloss: 이란은 하나의 나라예요.
  fa.a1.unit02.lesson04.teach.nationality:
    title: 국적
    gloss: 국적
    note: ملیت은 '국적'을 뜻하는 격식 있는 명사예요.
    example_gloss: 국적이 어디세요?
  fa.a1.unit02.lesson05.teach.ahl:
    title: ~ 출신
    gloss: ~ 출신
    note: اهل은 사람과 출신 지역을 연결해요. 지금 그곳에 산다는 뜻은 아니에요.
    example_gloss: 그 사람은 영국 출신이에요.
  fa.a1.unit02.lesson05.teach.koja:
    title: 어디
    gloss: 어디
    note: کجا는 장소를 물을 때 써요.
    example_gloss: 어디 출신이세요?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: 격식 있는 표준 질문
    gloss: 어디에서 오셨어요?
    note: اهل کجا هستید؟는 정중한 표준 페르시아어로, 격식 있는 말이나 신중한 글에 어울려요.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: 무난하고 정중한 구어체 질문
    gloss: 어디에서 오셨어요?
    note: اهل کجا هستین؟는 이란 페르시아어에서 쓰는 일반적인 정중한 구어체예요.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: 친근한 질문
    gloss: 어디에서 오셨어요?
    note: اهل کجایی؟는 친한 사이에서 한 사람에게 쓰는 표현이에요.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: 출신지 말하기
    gloss: 저는 이란 출신이에요.
    note: من اهل ایران هستم.은 현재 사는 곳이 아니라 출신지를 말해요.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: 짧은 국적 대답
    gloss: 저는 이란 사람이에요.
    note: '*ایرانی‌ام*은 *ایرانی*에 ''저는 ~이에요''를 뜻하는 어미 *ـام*을 붙인 형태이고, 어미 앞에 작은 띄움(반공백)을 넣어 써요.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: 장소 확인하기
    gloss: 사라가 여기가 페르시아어 수업인지 물어요.
    note: ببخشید는 실용적인 질문을 하기 전에 정중하게 주의를 끄는 말이에요.
  fa.a1.unit02.lesson06.teach.yes:
    title: 네
    gloss: 네
    note: بله는 무난하고 정중한 '네'예요.
    example_gloss: 네, 물론이죠.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: 미나가 자기소개를 해요
    gloss: 미나는 맞다고 확인하고, 자기소개를 한 뒤 사라의 이름을 물어요.
    note: 정중한 구어체 질문은 수업에서 처음 만난 두 성인에게 잘 어울려요.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: 사라가 이름을 말해요
    gloss: 제 이름은 사라예요.
    note: 사라는 앞에서 배운 간결한 구어체 표현을 써요.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: 미나가 출신을 물어요
    gloss: 어디에서 오셨어요?
    note: هستین은 정중하면서도 대화체의 느낌을 유지해요.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: 출신 주고받기
    gloss: 사라는 영국 출신이라고 말하고, 미나가 이란 출신인지 물어요.
    note: 두 사람은 방금 만났기 때문에 계속 정중한 형태를 써요.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: 출신 주고받기, 답하기
    gloss: 미나는 이란 사람이라고 확인해 줘요.
    note: '*ایرانی‌ام*은 *ایرانی هستم*(저는 이란 사람이에요)의 짧은 형태예요.'
  fa.a1.unit02.lesson06.teach.pleased:
    title: 소개에 인사로 답하기
    gloss: 사라가 미나를 만나서 반갑다고 말해요.
    note: از آشنایی با شما خوشوقتم은 두 사람의 대화를 자연스럽게 마무리해 줘요.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: 인사에 답하고 교실로 안내하기
    gloss: 미나도 반갑다고 말하고 사라에게 안으로 들어오라고 해요.
    note: من هم همین‌طور는 사라의 정중한 인사에 답하고, 그다음 بفرمایید داخل로 수업 장면이 이어져요.
exercises:
  fa.a1.unit02.lesson01.exercise01.recognize_noon:
    instruction: n 소리를 나타내는 글자는 무엇일까요?
    correct_option: ن
    distractors:
    - ت
    - ر
    - و
    accepted_answers:
    - value: ن
      status: correct
    feedback: ن은 n 소리를 나타내요.
  fa.a1.unit02.lesson01.exercise02.recognize_che:
    instruction: ch 소리를 나타내는 글자는 무엇일까요?
    correct_option: چ
    distractors:
    - ش
    - ج
    - خ
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ는 ch 소리를 나타내요.
  fa.a1.unit02.lesson01.exercise03.match_ye_he:
    instruction: 각 글자를 대략적인 소리와 연결하세요.
    accepted_answers:
    - value:
        ی: y
        ه: h
        ک: k
        گ: g
        و: v / o
        ب: b
        خ: kh
        ز: z
      status: correct
    feedback: ی는 y 또는 긴 i를 나타낼 수 있고, ه는 h예요. ک는 k, گ는 g이고, و는 v 또는 모음을 나타낼 수 있으며 ب는 b예요. خ는 보통 kh로 표기하고 ز는 z예요.
    pairs:
    - left: ی
      right: y
    - left: ه
      right: h
    - left: ک
      right: k
    - left: گ
      right: g
    - left: و
      right: v / o
    - left: ب
      right: b
    - left: خ
      right: kh
    - left: ز
      right: z
  fa.a1.unit02.lesson01.exercise04.choose_persian_ke:
    instruction: k를 나타내는 페르시아어 글자를 고르세요.
    correct_option: ک
    distractors:
    - گ
    - ج
    - ف
    accepted_answers:
    - value: ک
      status: correct
    feedback: 페르시아어 ک는 k 소리를 나타내요.
  fa.a1.unit02.lesson01.exercise06.recognize_fe:
    instruction: f 소리를 나타내는 글자는 무엇일까요?
    correct_option: ف
    distractors:
    - و
    - ب
    - ت
    accepted_answers:
    - value: ف
      status: correct
    feedback: ف는 f 소리를 나타내요.
  fa.a1.unit02.lesson02.exercise01.recognize_esme_shoma_reading:
    instruction: 이 질문은 어떤 정보를 묻고 있나요?
    correct_option: 듣는 사람의 이름
    distractors:
    - 듣는 사람의 나라
    - 시간
    - 말하는 사람의 직업
    accepted_answers:
    - value: 듣는 사람의 이름
      status: correct
    feedback: اسم شما چیه؟는 듣는 사람의 이름을 묻는 말이에요.
  fa.a1.unit02.lesson02.exercise02.name_meaning:
    instruction: اسم의 뜻을 고르세요.
    correct_option: 이름
    distractors:
    - 나라
    - 수업
    - 언어
    accepted_answers:
    - value: 이름
      status: correct
    feedback: اسم은 '이름'이라는 뜻이에요.
  fa.a1.unit02.lesson02.exercise03.formal_name:
    instruction: 격식 있는 문어체 자기소개를 순서대로 배열하세요.
    accepted_answers:
    - value:
      - اسم
      - من
      - سارا
      - است
      status: correct
    feedback: اسم من سارا است는 일부러 격식을 갖춘 문어체 표현이에요.
  fa.a1.unit02.lesson02.exercise04.translate_spoken_name:
    instruction: '페르시아어(이란)로 번역하세요: 제 이름은 사라예요.'
    accepted_answers:
    - value: اسمم ساراست
      status: correct
    - value: اسمم ساراست.
      status: correct
    - value: اسم من ساراست
      status: correct
    - value: اسم من ساراست.
      status: correct
    - value: اسمم سارا است
      status: acceptable_with_note
      note: copula를 띄어 쓴 형태로, 이해는 되는 표기예요.
    - value: اسم من سارا است
