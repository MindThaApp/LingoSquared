teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: 토요일, 일요일
    gloss: 토요일, 일요일
    note: شنبه 와 یکشنبه 는 토요일에 시작하는 이란의 한 주에서 첫 두 요일이에요.
    example_gloss:
    - 오늘은 토요일이에요.
    - 내일은 일요일이에요.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: 월요일, 화요일
    gloss: 월요일, 화요일
    note: دوشنبه 와 سه‌شنبه 는 شنبه 와 یکشنبه 다음에 와요.
    example_gloss:
    - 월요일에 수업이 있어요.
    - 화요일에 약속이 있어요.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: 수요일, 목요일
    gloss: 수요일, 목요일
    note: چهارشنبه 와 پنجشنبه 는 한 주의 중반에서 후반에 있는 요일이에요.
    example_gloss:
    - 수요일에 일해요.
    - 목요일에 봐요.
  fa.a1.unit10.lesson01.teach.jome:
    title: 금요일
    gloss: 금요일
    note: جمعه 는 한 주의 마지막 날이고, 이란에서 전통적으로 매주 쉬는 날이에요.
    example_gloss: 금요일은 휴일이에요.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: 매주 쉬는 날
    gloss: 금요일은 매주 쉬는 날이에요.
    note: جمعه(금요일)는 이란에서 전통적으로 매주 쉬는 날이에요. 다만 요즘은 목요일 오후에도 문을 닫는 직장이 일부 있어요.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: 파르바르딘 (1월)
    gloss: 파르바르딘, 이란 태양력의 첫 번째 달
    note: فروردین 은 이란 태양력의 새해를 여는 달로, 대략 3월 말(춘분과 노루즈 무렵)이에요.
    example_gloss: 파르바르딘은 한 해의 첫 번째 달이에요.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: 오르디베헤シت (2월)
    gloss: 오르디베헤シت, 두 번째 달
    note: اردیبهشت 은 فروردین 다음 달로, 대략 4월~5월이에요.
    example_gloss: 오르디베헤シت에는 날씨가 좋아요.
  fa.a1.unit10.lesson02.teach.khordad:
    title: 호르다드 (3월)
    gloss: 호르다드, 세 번째 달
    note: خرداد 는 اردیبهشت 다음 달로, 대략 5월~6월이에요.
    example_gloss: 저는 호르다드에 태어났어요.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: 이란 태양력
    gloss: 이란은 히즈라 태양력(페르시아력)을 사용해요.
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* 는 이란이 일상 날짜에 이 달력 체계를 쓴다는 뜻이에요. 아프가니스탄도 같은 달력 체계를 쓰지만, 아프가니스탄은 아랍어에서 온 달 이름을 쓰는 반면 이란은 페르시아 고유의 달 이름을 써요.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: 오늘은 무슨 요일이에요?
    gloss: 오늘은 무슨 요일이에요?
    note: امروز چندشنبه‌ست؟ 는 직역하면 '오늘은 한 주의 몇 번째 요일이에요?'라는 뜻이에요. چندشنبه است 의 구어체 축약형 -e 가 붙은 형태예요.
  fa.a1.unit10.lesson03.teach.today_word:
    title: 오늘
    gloss: 오늘
    note: امروز 는 '오늘'이라는 뜻이에요.
    example_gloss: 오늘 며칠이에요?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: 오늘은 목요일, 오르디베헤シت 10일이에요.
    gloss: 오늘은 목요일, 오르디베헤シت 10일이에요.
    note: امروز پنجشنبه، دهم اردیبهشته 는 요일, 서수 날짜, 달 이름을 한 문장에 담고 있고, 구어체 축약형 -e 를 써요(اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: 날짜
    gloss: 날짜
    note: '*تاریخ* 는 ''날짜''라는 뜻으로, 달력상의 날짜를 두루 가리키는 말이에요. 예: *تاریخ جلسه* (회의 날짜).'
    example_gloss: 오늘 날짜가 어떻게 돼요?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: 회의가 무슨 요일이에요?
    gloss: 회의가 무슨 요일이에요?
    note: جلسه کدوم روزه؟ 는 어떤 일이 한 주의 어느 요일에 있는지 묻는 말이에요.
  fa.a1.unit10.lesson05.teach.which_date:
    title: 오르디베헤シت의 화요일은 며칠이에요?
    gloss: 화요일은 오르디베헤쉬트 며칠이에요?
    note: سه‌شنبه چندم اردیبهشته؟는 특정 요일의 날짜(며칠인지)를 묻는 표현이에요.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 8일
    gloss: 8일
    note: '*هشتم*은 (한 달 중) 8일을 뜻해요.'
    example_gloss: 오늘은 8일이에요.
  fa.a1.unit10.lesson06.teach.turn01:
    title: 레자, 회의가 무슨 요일이에요?
    gloss: 레자, 회의가 무슨 요일이에요?
    note: 마리암이 레자의 이름을 부르며 직접 물어보며 대화를 시작해요.
  fa.a1.unit10.lesson06.teach.turn02:
    title: 화요일일 거예요.
    gloss: 화요일일 거예요.
    note: فکر کنم(제 생각에는)은 레자의 대답이 완전히 확실하지는 않다는 느낌을 부드럽게 나타내요.
  fa.a1.unit10.lesson06.teach.turn03:
    title: 화요일은 오르디베헤쉬트 며칠이에요?
    gloss: 화요일은 오르디베헤쉬트 며칠이에요?
    note: 마리암이 이어서 정확한 날짜를 물어봐요.
  fa.a1.unit10.lesson06.teach.turn04:
    title: 화요일은 오르디베헤쉬트 8일이에요.
    gloss: 화요일은 오르디베헤쉬트 8일이에요.
    note: 레자가 정확한 날짜를 알려 줘요.
  fa.a1.unit10.lesson06.teach.turn05:
    title: 네, 좋아요. 금요일은 어때요? 시간 있어요?
    gloss: 네, 좋아요. 금요일은 어때요? 시간 있어요?
    note: 마리암이 날짜를 확인한 다음, 다른 요일은 어떤지 물어봐요.
  fa.a1.unit10.lesson06.teach.turn06:
    title: 아니요, 금요일은 바빠요.
    gloss: 아니요, 금요일은 바빠요.
    note: سرم شلوغه(직역하면 '머리가 바쁘다/복잡하다')는 이란 사람들이 바쁘다고 말할 때 쓰는 자연스러운 구어 표현이에요.
  fa.a1.unit10.lesson06.teach.turn07:
    title: 괜찮아요, 화요일에 봐요.
    gloss: 괜찮아요, 화요일에 봐요.
    note: مشکلی نیست(괜찮아요)는 레자의 거절을 정중하게 받아들이는 말이고, می‌بینمت는 '만날게요'라는 뜻이에요. 그래서 회의 날이 화요일로 확정돼요.
  fa.a1.unit10.lesson06.teach.va_and:
    title: 그리고
    gloss: 그리고, ~와/과
    note: '*و*는 ''그리고, ~와/과''라는 뜻이에요. *دوشنبه و سه‌شنبه*처럼 두 요일을 잇거나, *جلسه کدوم روزه و چندم اردیبهشته؟*처럼 관련된 두 질문을 이을 수 있어요.'
    example_gloss: 저는 월요일과 화요일에 수업이 있어요.
