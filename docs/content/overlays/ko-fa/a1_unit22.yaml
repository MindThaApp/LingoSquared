teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: 전화기
    gloss: 전화기
    note: تلفن은 전화기를 가리키는 일반적인 단어예요.
    example_gloss: 내 전화기가 어디 있지?
  fa.a1.unit22.lesson01.teach.message_word:
    title: 메시지
    gloss: 메시지
    note: پیام은 글로 쓴 메시지, 즉 문자 메시지예요.
    example_gloss: 메시지가 하나 있어요.
  fa.a1.unit22.lesson01.teach.call_word:
    title: 전화하다
    gloss: 전화하다
    note: زنگ زدن(문자 그대로는 '벨을 울리다')은 누군가에게 전화하는 일상적인 동사예요.
    example_gloss: 나한테 전화해.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: 목소리
    gloss: 목소리
    note: صدا는 목소리라는 뜻으로, 통화할 때 상대의 목소리가 어떤지 말할 때 써요.
    example_gloss: 목소리가 좋아요.
  fa.a1.unit22.lesson01.teach.va_word:
    title: 그리고
    gloss: 그리고
    note: و는 단어나 문장을 잇는 흔한 접속어로, 앞 단원에서 이미 배웠어요.
    target_text: و (그리고)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: 여보세요 (전화)
    gloss: 여보세요, 말씀하세요
    note: الو는 전화 받을 때만 쓰는 인사말이에요(얼굴을 보고 말할 때는 쓰지 않아요). 여기서 بفرمایید는 '말씀하세요, 듣고 있어요'와 비슷한 뜻이에요.
  fa.a1.unit22.lesson02.teach.its_me:
    title: 저예요, 나르게스예요
    gloss: 안녕하세요, 저예요, 나르게스예요
    note: '*منم*은 *من*(나)에 서술 어미 -م("~예요")이 붙은 말로, ''저예요''라는 뜻이에요. 전화에서 자신을 밝힐 때 아주 흔히 써요. (같은 철자가 ''나도''라는 뜻의 *من هم*일 수도 있지만, 여기서는 문맥상 분명해요.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: 다시 말해 줄 수 있어요?
    gloss: 다시 말씀해 주시겠어요?
    note: می‌شه(می‌شود의 구어체, '가능한가요')에 تکرار کنید(반복하세요)를 붙인 것은 정중하게 부탁하는 기본 표현이에요.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: 천천히 말씀해 주세요
    gloss: 천천히 말씀해 주세요
    note: آهسته‌تر는 آهسته(천천히)의 비교형으로, '더 천천히'라는 뜻이에요.
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: 너한테 전할 메시지가 있어
    gloss: 너한테 전할 메시지가 있어
    note: برات는 برای(~를 위해)와 ت(친근한 말투의 '너')가 줄어든 말이에요.
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: 내일 네 시에 카페로 와
    gloss: 내일 네 시에 카페로 와
    note: بیا는 آمدن(오다)의 어간만 쓰는 구어체 명령형이에요. A1에서 이미 배운 다른 명령형과 같은 방식이에요.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: 안녕, 나중에 얘기하자
    gloss: 안녕, 나중에 얘기하자
    note: بعداً는 '나중에'라는 뜻이고, صحبت می‌کنیم은 '이야기한다/이야기할 것이다'를 뜻하는 현재·미래형이에요.
  fa.a1.unit22.lesson05.teach.better_now:
    title: 이제 좀 나아졌어?
    gloss: 이제 좀 나아졌어?
    note: الان은 '지금'이라는 뜻이에요. بهتر شد는 직역하면 '더 좋아졌다'로, 페르시아어에서는 이런 상태를 확인할 때 자연스럽게 과거형을 써요. 한국어의 '나아졌어?'와 비슷해요.
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: 안녕 나르게스, 잘 지내?
    gloss: 안녕 나르게스, 잘 지내?
    note: '*چطوری*는 친근한 말투의 ''잘 지내?''예요. 알리와 나르게스는 친구 사이라서 이 표현이 어울려요.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: 목소리가 끊겼다 들렸다 해요
    gloss: 목소리가 끊겼다 들렸다 해요
    note: قطع و وصل می‌شه는 직역하면 '끊겼다 연결됐다 한다'로, 전화 연결이 불안정할 때 쓰는 자연스러운 페르시아어 관용 표현이에요.
  fa.a1.unit22.lesson06.teach.turn01:
    title: 알리가 전화를 받아요
    gloss: '알리: 여보세요, 말씀하세요.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: 나르게스가 자신을 밝혀요
    gloss: '나르게스: 안녕 알리, 나 나르게스야.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: 알리가 인사를 받아요
    gloss: '알리: 안녕 나르게스, 잘 지내?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: 나르게스가 천천히 말해 달라고 부탁해요
    gloss: '나르게스: 잘 지내, 고마워. 좀 천천히 말해 줄래? 목소리가 끊겼다 들렸다 해.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: 알리가 확인해요
    gloss: '알리: 알았어, 이제 좀 나아졌어?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: 나르게스가 메시지를 전해요
    gloss: '나르게스: 응, 나아졌어. 너한테 전할 메시지가 있어, 내일 네 시에 카페로 와.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: 그들이 가요 (구어체)
    gloss: 그들이 가요 (구어체)
    note: '*می‌رن*은 *می‌روند*(그들이 가다)의 구어체 형태로, 이 코스의 다른 표현들과 같은 구어체예요.'
    target_text: می‌رن (그들이 가요, 구어체)
  fa.a1.unit22.lesson06.teach.turn07:
    title: 알리가 확답해요
    gloss: '알리: 알았어, 꼭 갈게.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: 나르게스가 통화를 끝내요
    gloss: '나르게스: 안녕, 나중에 얘기하자.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: 알리가 작별 인사를 해요
    gloss: '알리: 안녕.'
