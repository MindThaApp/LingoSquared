teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: من ... دارم
    note: تحت‌اللفظی یعنی «پیش من ... هست» و روش معمول روسی برای گفتن «دارم» است. در درس ۳ هم «У меня два брата» همین قالب «У меня» را داشت؛ وقتی جمله درباره‌ی تعداد است، معمولاً «есть» حذف می‌شه.
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: این ... است
    note: «Это» برای معرفی کردن یا نشان دادن آدم یا چیزی به کار می‌ره، و به جنسیت دستوری اون آدم یا چیز بستگی نداره.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: مادر، پدر
    note: «мать» یکی از معدود اسم‌های مؤنث روسی است که به نرم‌نشان (-ь) ختم می‌شه.
    example_gloss:
    - این مادر من است.
    - این پدر من است.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: برادر، خواهر
    note: «брат» همون کلمه‌ای است که در درس ۳ باهاش شمردید («У меня два брата»)؛ «сестра» مؤنثِ اونه.
    example_gloss:
    - این برادر من است.
    - من یک خواهر دارم.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: مال من (مذکر)، مال من (مؤنث)
    note: «мой» با اسم‌های مذکر مثل «отец» و «брат» می‌آد و «моя» با اسم‌های مؤنث مثل «мать» و «сестра».
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: مادربزرگ، پدربزرگ
    note: 'هر دو به -а ختم می‌شن، ولی «дедушка» به یک مرد اشاره داره و از نظر مطابقت مذکر حساب می‌شه: «мой дедушка» ولی «моя бабушка».'
    example_gloss:
    - این مادربزرگ من است.
    - این پدربزرگ من است.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: شوهر، زن
    note: «муж» مذکر و «жена» مؤنث است، طبق الگوی معمول پایان اسم‌ها.
    example_gloss:
    - این شوهرم است.
    - این همسرم است.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: پسر، دختر
    note: «дочь» هم مثل «мать» یک اسم مؤنث است که به نرم‌نشان (-ь) ختم می‌شه.
    example_gloss: من یک پسر و یک دختر دارم.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: بچه‌ها
    note: «дети» جمعِ بی‌قاعده‌ی «ребёнок» («بچه») است؛ مفرد و جمعش کلاً دو کلمه‌ی متفاوته.
    example_gloss: بچه دارید؟
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: '... دارید؟ (رسمی)'
    note: از «вас»ی رسمی استفاده می‌کنه، مطابق با حالت «вы» در درس ۲.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: این کیه؟
    note: روش معمول پرسیدن اینکه کسی کیه، مثلاً وقتی به یک عکس نگاه می‌کنید.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: اسمش آنا است.
    note: تحت‌اللفظی یعنی «اون رو آنا صدا می‌کنن» — «Её» («او را») مفعول فعل «зовут» است، نه فاعل.
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: ماکسیم درباره‌ی عکس می‌پرسه
    gloss: 'ماکسیم: این توی عکس کیه؟'
    note: ماکسیم با اشاره به عکس شروع می‌کنه و می‌پرسه «Кто это на фото?»
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: اولگا خانواده‌اش را معرفی می‌کنه
    gloss: 'اولگا: این خانواده‌ی منه.'
    note: در «Это моя семья» کلمه‌ی «семья» («خانواده») مؤنث است، برای همین «моя» با اون مطابقت می‌کنه.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: اولگا سه عضو خانواده را نام می‌بره
    gloss: 'اولگا: اینجا پدرم، مادرم و برادرمه.'
    note: «Вот» («اینه / ایناهاش») فهرست را شروع می‌کنه؛ هر صفت ملکی (мой/моя) با اسمی که بعدش می‌آد مطابقت داره.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: ماکسیم درباره‌ی دختر می‌پرسه
    gloss: 'ماکسیم: خب این دختر کیه؟'
    note: «А» پرسش بعدی ماکسیم را درباره‌ی نفر چهارم توی عکس به‌طور طبیعی شروع می‌کنه.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: اولگا اسم دخترش را می‌گه
    gloss: 'اولگا: این دخترمه. اسمش آنا است.'
    note: اولگا با «моя дочь» جواب می‌ده و بعد با «Её зовут Анна» اسم رو می‌گه.
