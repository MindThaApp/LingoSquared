  ru.a1.unit37.lesson05.teach.nina_novenkaya_v:
    title: Nina درباره‌ی همه می‌شنود
    gloss: نینا تازه به کافهٔ زبان اومده. از دیما می‌پرسه بقیه چه جور آدم‌هایی هستن. دیما توضیح می‌ده. ناستیا مهربون و صبوره و پرستاره. ایگور بامزه‌ست و کلاس اسپانیایی می‌ره. لنا کنجکاوه و دوست داره چیزهای جدید یاد بگیره. خود دیما آرومه.
    note: ویژگی‌های شخصیتی اعضای گروه را مرور می‌کند.
    glosses:
