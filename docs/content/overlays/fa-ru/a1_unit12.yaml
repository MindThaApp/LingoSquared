teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: بیا برویم...
    note: Давай نشانه‌ی پیشنهاد دوستانه است («بیا»)؛ пойдём صورت «ما» از آینده‌ی فعل «رفتن» است. این دو با هم برای پیشنهاد یک کار می‌آیند.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: سینما
    note: кино اسمی خنثی و تصریف‌ناپذیر به معنای «سینما» است.
    example_gloss: بیا برویم سینما.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: فردا، روز شنبه
    note: завтра یعنی «فردا»؛ в субботу برای روز هفته از в به‌علاوه‌ی حالت مفعولی (винительный) استفاده می‌کند.
    example_gloss: بیا فردا برویم سینما.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: باشه، موافقم.
    note: согласен («موافق») را گوینده‌ی مرد می‌گوید؛ گوینده‌ی زن می‌گوید согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: متأسفانه نمی‌توانم.
    note: К сожалению («متأسفانه») رد کردن را نرم‌تر می‌کند؛ не могу یعنی «نمی‌توانم».
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: ساعت چند همدیگر را ببینیم؟
    note: Во сколько درباره‌ی ساعت می‌پرسد؛ встретимся صورت «ما» از آینده‌ی فعل «ملاقات کردن» است.
    example_gloss: بگوییم ساعت هفت.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: ناستя برنامه پیشنهاد می‌دهد
    gloss: 'ناستя: بیا شنبه برویم سینما.'
    note: Настя گفت‌وگو را با Давай пойдём в кино в субботу شروع می‌کند.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Дима می‌پذیرد و ساعت را می‌پرسد
    gloss: 'Дима: باشه، موافقم. ساعت چند همدیگر را ببینیم؟'
    note: Дима می‌پذیرد، بعد می‌پرسد Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: ناستیا زمان و مکان پیشنهاد می‌دهد
    gloss: 'ناستیا: بیا ساعت هفت، جلوی سینما قرار بذاریم.'
    note: عبارت у кинотеатра یعنی «جلوی سینما / کنار سینما» و بعد از у، اسم به حالت родительный (مضاف‌الیه) می‌آید.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: دیما تأیید می‌کند
    gloss: 'دیما: عالیه، تا شنبه.'
    note: Отлично, до субботы گفت‌وگو را تمام می‌کند؛ до субботы یعنی «تا شنبه».
