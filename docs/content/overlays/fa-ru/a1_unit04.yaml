teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: امروز چه روزی است؟
    note: Какой با اسم مذکر день («روز») هماهنگ است.
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: دوشنبه، سه‌شنبه
    note: در روسی نام روزهای هفته با حرف کوچک نوشته می‌شود. (خط فارسی حرف بزرگ و کوچک ندارد، ولی در روسی این نکته مهم است.)
    example_gloss:
    - امروز دوشنبه است.
    - امروز سه‌شنبه است.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: چهارشنبه، پنجشنبه
    note: مثل همه‌ی نام‌های روزهای هفته در روسی، среда و четверг با حرف کوچک نوشته می‌شوند؛ فقط اول جمله بزرگ می‌شوند.
    example_gloss:
    - امروز چهارشنبه است.
    - امروز پنجشنبه است.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: جمعه، شنبه
    note: суббота دو б دارد؛ غلط املایی رایجی است.
    example_gloss:
    - امروز جمعه است.
    - امروز شنبه است.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: یکشنبه
    note: آخرین روز در فهرست روزهای هفته‌ی روسی.
    example_gloss: امروز یکشنبه است.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: امروز ... است.
    note: Сегодня به‌علاوه‌ی نام روز فعل ربطی نمی‌خواهد؛ در فارسی «است» می‌آید ولی در روسی نیازی به آن نیست.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: تاریخ امروز چنده؟
    note: Какое با اسم خنثی число («تاریخ / عدد») هماهنگ است، برخلاف какой день در بالا.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: اول، سوم
    note: عدد ترتیبی تاریخ پایانهٔ خنثی (-ое/-ье) می‌گیرد، چون با اسم نهفتهٔ число هماهنگ است.
    example_gloss:
    - امروز اول ژانویه است.
    - امروز سوم ژانویه است.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: پنجم، دهم
    note: همان الگوی ترتیبیِ خنثی مثل первое/третье.
    example_gloss:
    - امروز پنجم اکتبر است.
    - امروز دهم آوریل است.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: ژانویه، آوریل (بعد از تاریخ)
    note: بعد از تاریخ، نام ماه به حالت اضافی (родительный) می‌رود؛ برای همین январь می‌شود января و апрель می‌شود апреля.
    example_gloss:
    - امروز سوم ژانویه است.
    - امروز دهم آوریل است.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: اکتبر (بعد از تاریخ)
    note: شکل حالت اضافیِ октябрь، با همان الگوی بعد از تاریخ مثل января/апреля.
    example_gloss: امروز پنجم اکتبر است.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: تاریخ امروز چنده؟
    note: روش استاندارد برای پرسیدن تاریخ روز.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: روز سه‌شنبه
    note: 'حرف اضافهٔ в برای راحت‌تر شدن تلفظ قبل از вторник به во تبدیل می‌شود؛ خودِ вторник تغییری نمی‌کند (ولی نام روزهای مؤنث تغییر می‌کند: в среду، в пятницу، в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: جلسه
    note: اسمی رایج برای جلسه یا قرار ملاقاتِ از پیش تعیین‌شده.
    example_gloss: جلسه روز سه‌شنبه است.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: آنا روز را می‌پرسد
    gloss: 'آنا: امروز چه روزیه؟'
    note: آنا گفتگو را با همان سؤال دربارهٔ день از درس 1 شروع می‌کند.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: ویکتور با روز و تاریخ جواب می‌دهد
    gloss: 'ویکتور: امروز چهارشنبه، سوم ژانویه‌ست.'
    note: ویکتور روز هفته و تاریخ ترتیبی را با هم می‌گوید و ماه را به شکل حالت اضافیِ января می‌آورد.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: آنا سه‌شنبه را پیشنهاد می‌دهد
    gloss: 'آنا: خوبه. جلسه سه‌شنبه‌ست؟'
    note: Хорошо جواب ویکتور را تأیید می‌کند، بعد آنا سؤال بعدی‌اش را می‌پرسد.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: ویکتور تاریخ را تأیید می‌کند
    gloss: 'ویکتور: بله، سه‌شنبه، نهم ژانویه.'
    note: 'Да تأیید می‌کند و بعد ویکتور روز و تاریخ را دوباره می‌گوید. برای اینکه بگوییم چیزی «در» چه تاریخی اتفاق می‌افتد، خودِ عدد ترتیبی هم به حالت اضافی می‌رود: девятого января («در نهم ژانویه»)؛ مقایسه کنید با Сегодня девятое января («امروز نهم ژانویه است»).'
