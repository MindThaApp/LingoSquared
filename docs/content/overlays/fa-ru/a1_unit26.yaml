teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Высокий* یعنی قدبلند و *невысокий* یعنی قدکوتاه (در اصل «نه‌چندان بلند»). پایان صفت با جنسیت عوض می‌شود: *высокая*، *невысокая*.'
    example_gloss:
    - لنا قدبلند است.
    - ایگور قدکوتاه است.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Старый* و *молодой* این‌جا تصور کلی از سن را می‌گویند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - پدربزرگ مسنه.
    - دیما جوان است.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: صفت با جنسیت عوض می‌شود
    gloss: 'صفت با شخص هم‌جنس می‌شود: *он высокий, она высокая*؛ *он старый, она старая*.'
    note: صفت‌های مذکر به *-ый*، *-ий* یا *-ой* ختم می‌شوند (*высокий*، *молодой*) و صفت‌های مؤنث به *-ая* (*высокая*، *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: لنا قدبلند است و ایگور قدکوتاه
    gloss: لنا قدبلند است و ایگور قدکوتاه.
    note: 'دو جمله با *а* (ولی، در مقابل) کنار هم می‌آیند: *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: مو
    gloss: مو
    note: '*Волосы* (مو) در روسی جمع است: *У Насти светлые волосы*؛ هیچ‌وقت مفرد نمی‌آید.'
    example_gloss: دیما موهای کوتاه و مشکی دارد.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: 'سه رنگ مو به شکل جمع، هماهنگ با *волосы*: *светлые*، *каштановые*، *седые*.'
    example_gloss:
    - ناستیا موهای بور دارد.
    - ایگور موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Длинные* (بلند) و *короткие* (کوتاه) هم با *волосы* که جمع است هماهنگ می‌شوند.'
    example_gloss:
    - لنا موهای بلند دارد.
    - ایگور موهای کوتاه دارد.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: صفت با волосы هماهنگ می‌شود
    gloss: '*Волосы* جمع است، پس صفت هم جمع می‌شود: *длинные волосы*، *короткие волосы*، *светлые волосы*، *чёрные волосы*.'
    note: صفت‌های جمع به *-ые* یا *-ие* ختم می‌شوند. همین پایان را در درس بعد با *глаза* هم می‌بینید.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: у + حالت ملکی (родительный)
    gloss: 'بعد از *у* صاحبِ چیز در حالت родительный می‌آید: *у Насти* (ناستیا دارد)، *у Димы* (دیما دارد)، *у неё* (او دارد).'
    note: 'روسی این‌طور «داشتن» را می‌گوید: *у* + родительный + چیزی که دارد. فعلی برای «داشتن» وجود ندارد.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: دیما موهای کوتاه و مشکی دارد
    gloss: دیما موهای کوتاه و مشکی دارد.
    note: '*Чёрные* (مشکی) با *волосы* که جمع است هماهنگ شده. حرف *ё* در این دوره همیشه نوشته می‌شود.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: ناستیا موهای بلند و بور دارد
    gloss: ناستیا موهای بلند و بور دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  ru.a1.unit26.lesson03.teach.glaza:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Глаза* (چشم‌ها) جمعِ *глаз* است؛ نشانه‌ی جمع *-а* است.'
    example_gloss: دیما چشم‌های قهوه‌ای دارد.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: '*Голубые* آبیِ روشن است، *карие* قهوه‌ای فقط برای چشم است و *зелёные* سبز. هر سه جمع‌اند.'
    example_gloss:
    - ناستیا چشم‌های آبی دارد.
    - ایگور چشم‌های قهوه‌ای دارد.
    - لنا چشم‌های سبز دارد.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: صفت با глаза هماهنگ می‌شود
    gloss: '*Глаза* جمع است، پس صفت هم جمع می‌شود: *голубые глаза*، *карие глаза*، *зелёные глаза*.'
    note: چشم قهوه‌ای *карие* است، نه *коричневые*، و موی قهوه‌ای *каштановые*؛ روسی برای چشم و مو کلمه‌های جدا دارد.
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: ناستیا چه شکلی است؟
    gloss: ناستیا چه شکلی است؟
    note: '*Как выглядит ...?* سؤال اصلی این واحد است. فعل *выглядит* با فاعل مفرد می‌آید.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: ناستیا موهای بلند و بور و چشم‌های آبی دارد
    gloss: ناستیا موهای بلند و بور و چشم‌های آبی دارد.
    note: 'در جواب نمونه، مو و چشم با *и* به هم وصل می‌شوند: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: ناستیا نینا را معرفی می‌کند
    gloss: 'ناستیا: یک دختر تازه به کافه‌ی زبان می‌آید. اسمش نینا است.'
    note: '*Придёт* (می‌آید) آینده‌ی کامل (совершенный вид) است. *Её зовут Нина* در اصل یعنی «او را نینا صدا می‌زنند».'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: دیما می‌پرسد او چه شکلی است
    gloss: 'دیما: خوب! چه شکلی است؟'
    note: باز همان سؤال اصلی، این بار با *она* (او) به‌جای اسم.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: ناستیا قد و موی نینا را توصیف می‌کند
    gloss: 'ناستیا: قدش کوتاه است و موهای کوتاه و بور دارد.'
    note: '*невысокая* از درس اول و کلمه‌های مو از درس دوم با هم آمده‌اند. *И у неё* حقیقت دوم را اضافه می‌کند.'
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: دیما درباره‌ی چشم‌هایش می‌پرسد
    gloss: 'دیما: چشم‌هایش چه رنگی است؟'
    note: '*Какие у неё глаза?* از *у неё* («او دارد») استفاده می‌کند. *Неё* شکل *она* بعد از حرف اضافه‌ی *у* است.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: ناستیا چشم‌های نینا را توصیف می‌کند
    gloss: 'ناستیا: چشم‌هایش سبز است.'
    note: '*зелёные глаза* از درس سوم دوباره آمده، با *у неё* برای «او دارد».'
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: دیما او را خواهد شناخت
    gloss: 'دیما: ممنون! پس می‌شناسمش.'
    note: '*Я её узнаю* (او را می‌شناسم): *её* حالت مفعولی (винительный) *она* است، چون نینا مفعول است.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: مقایسه‌ی ایگور و لنا
    gloss: ایگور و لنا برادر و خواهرند، ولی ظاهرشان فرق دارد. ایگور قدکوتاه است و موهای کوتاه و قهوه‌ای و چشم‌های قهوه‌ای دارد. لنا از ایگور قدبلندتر است و موهای بلند و قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      брат: برادر
      сестра: خواهر
      выглядят: به نظر رسیدن
      по-разному: متفاوت
      невысокий: کوتاه‌قد
      короткие: کوتاه‌قد
      каштановые: قهوه‌ای
      волосы: مو
      карие: قهوه‌ای
      глаза: چشم‌ها
      выше: قدبلندتر
      длинные: بلند
      зелёные: سبز
      выглядишь: ظاهرت چطور است / به نظر می‌رسی (مثل «как ты выглядишь?»)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: مقایسه با выше
    gloss: 'بعد از *выше* (قدبلندتر) کسی که با او مقایسه می‌کنیم در حالت родительный می‌آید: *Лена выше Игоря*.'
    note: '*выше* که صفت تفضیلی است با جنسیت عوض نمی‌شود. کسی که با او مقایسه می‌کنیم در حالت родительный می‌آید یا بعد از *чем*.'
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: موهای لنا از موهای ایگور بلندتر است
    gloss: موهای لنا از موهای ایگور بلندتر است.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* هیچ‌وقت عوض نمی‌شود و *чем* (از، تا) بخش دوم را شروع می‌کند.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: 'یک جمله‌ی نمونه برای ظاهر خودتان: *У меня* («من دارم») + صفت + اسم.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: دیما نینا را می‌بیند
    gloss: 'دیما: ببین، این نینا است؟ موهای کوتاه و بور و چشم‌های سبز دارد.'
    note: '*Смотри* (ببین) امر غیررسمی است و در گفت‌وگوهای قبلی هم همین‌طور به کار رفته.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: ناستیا تأیید می‌کند
    gloss: 'ناستیا: آره، نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: نینا به دیما سلام می‌کند
    gloss: 'نینا: سلام، تو دیما هستی؟'
    note: 'یک سؤال ساده‌ی صمیمی: روسی در این جمله فعل «بودن» لازم ندارد، فقط *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: دیما جواب سلام نینا را می‌دهد
    gloss: 'دیما: آره! از آشنایی باهات خوشحالم، نینا.'
    note: '*Приятно познакомиться* عبارت رایج برای اولین دیدار با کسی است. *Познакомиться* یعنی با آدم تازه‌ای آشنا شدن.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: 'گفت‌وگو تمام می‌شود: دیما نینا را با توصیف قبلی ناستیا شناخت.'
