  description: 'روسی مقدماتی برای توصیف ظاهر ساده‌ی آدم‌ها: تصور کلی از قد و سن، رنگ مو و چشم، سؤال اصلی «Как ты выглядишь?» و مقایسه‌ی ظاهر دو نفر.'
