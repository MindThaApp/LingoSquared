    correct_option: دیما موهای کوتاه و مشکی دارد.
    distractors:
    - دیما موهای بلند و مشکی دارد.
    - دیما موهای کوتاه و قهوه‌ای دارد.
    - دیما موهای کوتاه و بور دارد.
