    example_gloss: مستقیم بروید، بعد به راست.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: به سمت چپ
    note: налево جهت حرکت را نشان می‌دهد و قرینه‌ی направо است.
    example_gloss: به چپ بپیچید.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: بپیچید (دستور مؤدبانه)
    note: поверните شکل امر مؤدبانه‌ی повернуть («پیچیدن») است؛ за углом یعنی «سر پیچ».
    example_gloss: سر پیچ به چپ بپیچید.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: بلوک، دور
