    title: گردشگر می‌پرسد دور است یا نه
    gloss: 'گردشگر: از اینجا دور است؟'
    note: Это далеко отсюда? برای پرسیدن فاصله‌ی پیاده‌روی است.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: رهگذر زمان را تخمین می‌زند
    gloss: 'رهگذر: نه، پنج دقیقه پیاده.'
    note: Прохожий با Нет, пять минут пешком («پیاده») جواب می‌دهد.
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: گردشگر از رهگذر تشکر می‌کند
