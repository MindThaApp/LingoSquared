    title: Как дойти до...?
    gloss: چطور می‌شود به ... رسید؟
    note: Как дойти до...? روش استاندارد و مؤدبانه برای پرسیدن آدرس از یک غریبه است و بعد از آن مقصد در حالت родительный می‌آید.
