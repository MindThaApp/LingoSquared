    note: музей مذکر است؛ музея شکل родительный آن است که بعد از до («تا») می‌آید.
    example_gloss: چطور می‌شود به موزه رسید؟
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: مستقیم
    note: прямо یعنی مستقیم رفتن؛ Идите شکل دستور مؤدبانه‌ی «بروید» است.
    example_gloss: مستقیم بروید.
  ru.a1.unit10.lesson01.teach.napravo:
