    gloss: ناستя هر روز با قطار سر کار می‌رود. دیما معمولاً با دوچرخه می‌رود، ولی وقتی باران می‌آید او هم با قطار می‌رود. ایگور ترجیح می‌دهد با ماشین برود. Лена نزدیک کارش زندگی می‌کند و پیاده سر کار می‌رود. شما چطور به سر کار می‌روید؟
    note: 'متنی که چهار روش رفتن به سر کار و یک شرط (باران) را مقایسه می‌کند: *обычно ... но когда идёт дождь ...*.'
