teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: اسم شما چیست؟ (رسمی)؛ اسمت چیست؟ (خودمانی)
    note: Как вас зовут? شکل رسمی вас را دارد و برای غریبه‌ها یا موقعیت‌های مؤدبانه است. Как тебя зовут? شکل خودمانی тебя را دارد و با دوستان، بچه‌ها و هم‌سن‌وسال‌ها به کار می‌رود.
    example_gloss:
    - سلام! اسمتان چیست؟
    - سلام! اسمت چیه؟
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: اسم من ویکتور است.
    note: Меня зовут (در اصل «مرا صدا می‌زنند») روش استاندارد گفتن اسم در روسی است، در هر سطحی از رسمیت.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: اسم من آنا است.
    note: همان الگوی Меня зовут ... با اسمی دیگر؛ این عبارت به جنسیت گوینده بستگی ندارد و تغییر نمی‌کند.
  ru.a1.unit02.lesson01.teach.register_note:
    title: انتخاب سؤال درست
    gloss: Как вас зовут? مؤدبانه است یا برای غریبه‌ها. Как тебя зовут? برای دوستان، بچه‌ها و هم‌سن‌وسال‌هاست.
    note: تفاوت رسمی و خودمانی در اینجا همان تفاوت вы و ты است که در درس دوم کامل یاد می‌گیرید؛ вас و тебя شکل مفعولی вы و ты هستند.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: شما (رسمی)؛ تو (خودمانی)
    note: 'این تفاوت شبیه «شما» و «تو» در فارسی است: вы با غریبه‌ها، بزرگ‌ترها و در محیط کار به کار می‌رود؛ ты با دوستان، خانواده و بچه‌ها.'
    example_gloss:
    - شما اهل کجایید؟ (رسمی)
    - تو اهل کجایی؟ (خودمانی)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: کِی از کدام استفاده کنیم
    gloss: 'Вы رسمی است: با غریبه‌ها، سر کار، با بزرگ‌ترها. Ты خودمانی است: با دوستان، خانواده، بچه‌ها.'
    note: اگر با کسی که انتظار вы دارد از ты استفاده کنید، ممکن است زیادی صمیمی یا حتی بی‌ادبانه به نظر برسد؛ اگر مطمئن نیستید، با вы شروع کنید.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: می‌شود خودمانی (ты) صحبت کنیم؟
    note: روشی مؤدبانه برای پیشنهاد گذر از вы رسمی به ты خودمانی، وقتی رابطه به‌اندازهٔ کافی صمیمی شده باشد.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: بیایید خودمانی (ты) صحبت کنیم.
    note: روشی کمی مستقیم‌تر و دعوت‌کننده‌تر برای همان پیشنهاد تغییر لحن مثل Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: اهل کجایید؟ (رسمی)
    note: از вы رسمی استفاده می‌کند و به اولین دیدار یا فضای کاری می‌خورد.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: اهل کجایی؟ (غیررسمی)
    note: شکل خودمانی آن است و با کسی به کار می‌رود که خوب می‌شناسیدش.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: من اهل کانادا هستم.
    note: Из («از») حالت اضافهٔ مالکیتی (родительный) می‌گیرد، برای همین Канада اینجا Канады می‌شود؛ این الگوی بیان مبدأ را به خاطر بسپارید، هرچند دستور کامل حالت‌ها بعداً می‌آید.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: من اهل مسکو هستم.
    note: 'همان الگوی Я из Канады: Москва بعد از из به Москвы تبدیل می‌شود.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: بیایید آشنا شویم.
    note: روشی مؤدبانه و رایج برای شروع معرفی بین کسانی که برای اولین بار همدیگر را می‌بینند.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: از آشنایی خوشحالم
    note: جواب مؤدبانه و معمول بعد از اینکه کسی تازه اسمش را گفته است.
    example_gloss: اسم من جان است. -- از آشنایی خوشحالم.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: ایرینا پتروونا معرفی را شروع می‌کند
    gloss: 'ایرینا پتروونا می‌گوید: سلام! بیایید آشنا شویم. اسم من ایرینا پتروونا است.'
    note: ایرینا پتروونا برای اولین بار در محیط رسمی اداره با جان آشنا می‌شود، برای همین از Здравствуйте مؤدبانه و در کل از вы استفاده می‌کند.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: جان با اسمش جواب می‌دهد
    gloss: 'جان می‌گوید: از آشنایی خوشحالم. اسم من جان است.'
    note: جان با Очень приятно لحن رسمی و مؤدبانهٔ ایرینا پتروونا را رعایت می‌کند.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: ایرینا پتروونا می‌پرسد جان اهل کجاست
    gloss: 'ایرینا پتروونا می‌پرسد: جان، شما اهل کجایید؟'
    note: او مطابق فضای اداره از Откуда вы رسمی استفاده می‌کند.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: جان جواب می‌دهد و سؤال را برمی‌گرداند
    gloss: 'جان می‌گوید: من اهل کانادا هستم. شما اهل کجایید؟'
    note: جان می‌گوید اهل کجاست و با А вы откуда? مؤدبانه همان سؤال را برمی‌گرداند.
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: ایرینا پتروونا جواب می‌دهد
    gloss: 'ایرینا پتروونا می‌گوید: من اهل مسکو هستم.'
    note: او گفت‌وگو را کامل می‌کند، با همان الگوی بیان مبدأ در حالت родительный که در درس دوم آمد.
