    gloss: 'نستیا: آره، من سگ دارم.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: دیما می‌پرسه چه شکلیه
    gloss: 'دیما: چه شکلیه؟'
    note: سؤال *Как он выглядит?* برای حیوانات هم به کار می‌ره. *Он* برای حیوان نر به کار می‌ره.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: نستیا سگش رو توصیف می‌کنه
    gloss: 'نستیا: پشمش قهوه‌ایه و کوچیکه.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он و она برای حیوان‌ها
    gloss: 'حیوان خانگی هم مثل آدم‌ها می‌تواند *он* یا *она* باشد: *У меня собака, он маленький*.'
    note: از نظر دستوری *собака* مؤنث است، ولی روس‌ها وقتی بدانند حیوان خانگی نر است، اغلب *он* می‌گویند.
