    title: حیوان خانگی دارید؟
    gloss: حیوان خانگی داری؟
    note: '*У тебя есть ...?* سؤال «داری ...؟» است: *у тебя* (تحت‌اللفظی «پیش تو») + *есть* + چیزی که می‌پرسید.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: '*Нет* + родительный یعنی چیزی رو ندارید: *у меня нет домашнего животного*. به نکتهٔ دستوری نگاه کنید.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: нет به‌اضافهٔ родительный
    gloss: 'بعد از *нет* چیزی که نیست در حالت родительный می‌آید: *у меня нет времени*، *у меня нет домашнего животного*.'
    note: 'با حالت مثبت مقایسه کنید: *у меня есть собака* (именительный) ولی *у меня нет собаки* (родительный).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: بردنِ حیوان به پیاده‌روی
    gloss: حیوان را به پیاده‌روی بردن
    note: '*Гулять с собакой* از *с* به‌اضافهٔ حالت творительный یعنی *собакой* استفاده می‌کنه. به نکتهٔ دستوری نگاه کنید.'
    example_gloss: من هر روز سگ را به پیاده‌روی می‌برم.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: с به‌اضافهٔ творительный
    gloss: 'بعد از *с* (با) اسم در حالت творительный می‌آید: *гулять с собакой*، *играть с кошкой*.'
    note: 'творительный اسم‌های مؤنث به *-ой* یا *-ей* ختم می‌شه: *собакой*، *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به گربه غذا می‌دهم.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: ایگور با گربه‌اش بازی می‌کنه.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: من هر روز سگ را به پیاده‌روی می‌برم
    gloss: من هر روز سگ را به پیاده‌روی می‌برم.
    note: '*Каждый день* (هر روز) قید زمانه و حرف اضافه نمی‌گیره: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: من هر روز به گربه غذا می‌دهم
    gloss: من هر روز به گربه غذا می‌دهم.
    note: '*Кормить* حیوان رو به‌عنوان مفعول مستقیم در حالت винительный می‌گیره: *кошка* می‌شه *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: حیوانات بعد از любить
    gloss: 'بعد از *любить* اسم حیوان در حالت винительный می‌آید که برای اسم‌های جاندار جمع مثل родительный جمع است: *собак*، *кошек*، *птиц*، *рыб*.'
    note: الگوی جمع منظم روسی که اینجا برای اولین بار با اسم حیوانات به‌عنوان مثال معرفی می‌شه.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: سگ‌ها و گربه‌ها
    gloss: سگ‌ها / گربه‌ها
    example_gloss:
