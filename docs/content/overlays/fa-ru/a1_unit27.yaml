    title: واکنش دیما
    gloss: 'دیما: چه عالی! هر روز باهاش چی کار می‌کنی؟'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina هر روز غذا می‌دهد
    gloss: 'Nina: هر روز بهش غذا می‌دم.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: دیما هم پرنده‌ها را دوست دارد
    gloss: 'دیما: من هم پرنده‌ها را دوست دارم.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: ناستیا گفتگو را تمام می‌کند
