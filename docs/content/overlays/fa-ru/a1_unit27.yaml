    gloss: 'ناستیا: آره، هر روز باهاش قدم می‌زنم و بهش غذا می‌دم.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: دیما، لنا و ایگور دربارهٔ حیوان‌ها
    gloss: 'دیما و لنا هر دو حیوان‌ها را دوست دارند، ولی هیچ‌کدامشان حیوان خانگی ندارند. دیما سگ‌ها را دوست دارد و لنا گربه‌ها را. اما ایگور حیوان خانگی دارد: یک گربه. او اغلب با گربه‌اش بازی می‌کند و هر روز به او غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      любят: خیلی دوست دارد
      оба: هر دو
      животных: حیوان‌ها
      обоих: هر دو
      домашнего: حیوان خانگی
      собак: سگ‌ها
      кошек: گربه‌ها
      кошка: گربه
      играет: بازی می‌کند
      даёт: می‌دهد
      каждый: هر
      корм: غذا
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: ایگور اغلب با گربه‌اش بازی می‌کند
    gloss: ایگور اغلب با گربه‌اش بازی می‌کند.
    note: '*Со своей кошкой*: *со* همان *с* است پیش از چند همخوانِ پشت‌سرهم، و *своей* یعنی «مالِ خودش» و به فاعل جمله برمی‌گردد.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
