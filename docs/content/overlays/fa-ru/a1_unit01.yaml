teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: جهت خواندن
    gloss: الفبای روسی برخلاف فارسی از چپ به راست خوانده می‌شود.
    note: خط روسی (سیریلیک) از چپ به راست نوشته و خوانده می‌شود، یعنی برعکس فارسی. برای همین باید جهت چشم‌تان را عوض کنید و در کنارش شکل و صدای حرف‌های جدید را یاد بگیرید.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: حرف Z (ز)
    note: مثل «ز» در «زمین» تلفظ می‌شود. شکل کوچک آن، з، شبیه عدد ۳ انگلیسی است.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: حرف D (د)
    note: مثل «د» در «در» تلفظ می‌شود. شکل کوچک آن، д، نسخهٔ کوچک‌شدهٔ حرف بزرگ است و زیر خط دو «پایهٔ» کوتاه دارد. شبیه حرف لاتین d نیست، پس شکلش را از نو یاد بگیرید.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: حرف R (ر)
    note: مثل «ر» غلتان تلفظ می‌شود، یعنی همان «ر» فارسی که زبان را می‌لرزانید. شکلش شبیه P لاتین است، پس آن را «پ» یا «p» نخوانید.
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: حرف A (ا)
    note: مثل «آ» در «آب» تلفظ می‌شود. شکلش درست مثل A لاتین است و صدایش هم به آن نزدیک است.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: حرف V (و)
    note: مثل «و» در «ورزش» (v) تلفظ می‌شود. شکلش شبیه B لاتین است؛ این هم یکی دیگر از شکل‌های فریبنده است.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: حرف S (س)
    note: مثل «س» در «سیب» تلفظ می‌شود. شکلش شبیه C لاتین است، ولی در روسی هرگز صدای «ک» نمی‌دهد.
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: حرف T (ت)
    note: مثل «ت» در «تاب» تلفظ می‌شود. شکل کوچک т در دست‌نویس گاهی شبیه m کوچک نوشته می‌شود؛ ولی اول همین شکل چاپی را یاد بگیرید.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: حرف U (او)
    note: مثل «او» در «دود» تلفظ می‌شود. شکلش شبیه y لاتین است، ولی صدایش ربطی به آن ندارد.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: حرف Ye (یِ)
    note: در ابتدای کلمه یا هجا مثل «یِ» در «یخ» تلفظ می‌شود. شکلش درست مثل E لاتین است ولی صدایش کاملاً فرق دارد.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ و ь: نشانهٔ سخت و نشانهٔ نرم'
    gloss: نشانهٔ سخت ъ و نشانهٔ نرم ь صدای مستقل ندارند؛ تلفظ حرف کنارشان را تغییر می‌دهند.
    note: این دو نشانه هیچ‌وقت خودشان صدایی نمی‌دهند. ь همخوان قبل از خودش را نرم می‌کند و ъ مرز سختی بین دو صدا ایجاد می‌کند. وقتی به کلمه‌های واقعی برسیم، دوباره سراغشان می‌آییم.
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: حرف «ای کوتاه»
    note: مثل «ی» در «وای» تلفظ می‌شود؛ یک صدای کوتاه و لغزنده است، نه یک مصوت کامل. این حرف در Здравствуйте هست، یعنی کلمه‌ای که این درس به آن می‌رسد.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: سلام (رسمی)
    note: سلام کامل و رسمی که با حرف‌های همین درس ساخته شده است. بلند و پر از همخوان به نظر می‌رسد، ولی همهٔ حرف‌هایش را در همین درس دیده‌اید.
    example_gloss: سلام! اسم من ویکتور است.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: سلام (رسمی)؛ سلام (دوستانه)
    note: Здравствуйте سلام مطمئن و رسمی است و در هر ساعتی از روز و برای هر غریبه‌ای کاربرد دارد. Привет خودمانی است و با دوستان و هم‌سن‌وسال‌ها گفته می‌شود.
    example_gloss:
    - سلام! حال شما چطور است؟ (رسمی)
    - سلام! چطوری؟ (دوستانه)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: صبح بخیر
    note: صبح‌ها تا نزدیک ظهر گفته می‌شود.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: روز بخیر / سلام
    note: سلام معمولی روز است و از نزدیک ظهر تا بعدازظهر به کار می‌رود.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: عصر بخیر
    note: موقع رسیدن به جایی در عصر یا شب گفته می‌شود؛ سلام است، نه خداحافظی.
  ru.a1.unit01.lesson02.teach.register_note:
    title: انتخاب سلام مناسب
    gloss: Здравствуйте در هر ساعتی از روز و در موقعیت‌های مؤدبانه کاربرد دارد. Привет خودمانی است و بین دوستان گفته می‌شود.
    note: اگر مطمئن نیستید ساعت چند است یا با چه کسی صحبت می‌کنید، Здравствуйте همیشه امن است؛ Привет را فقط برای کسانی بگویید که خوب می‌شناسید.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: چطوری؟ / حالت چطوره؟ (دوستانه)
    note: روش رایج و خودمانی برای پرسیدن حال کسی، بین دوستان و هم‌سن‌وسال‌ها.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: حال شما چطور است؟ (رسمی)
    note: روش رسمی پرسیدن حال کسی، متناسب با حالت «вы» (شما).
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: خوبم، ممنون
    note: جواب ساده و مثبتی که در هر دو حالت رسمی و خودمانی می‌شود گفت.
    example_gloss: حالت چطوره؟ — خوبم، ممنون.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: بد نیستم / همین‌طوری
    note: جوابی بین خنثی و کمی منفی، وقتی اوضاع نه عالی است و نه بد.
    example_gloss: حالت چطوره؟ — همین‌طوری.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: تو چطوری؟ (خودمانی)
    note: روش خودمانی برای پرس‌وجو از طرف مقابل، متناسب با حالت «ты» (تو).
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: خداحافظ (معمولی/رسمی)
    note: خداحافظی استاندارد و همه‌کاره؛ معنای تحت‌اللفظی‌اش نزدیک به «تا دیدار بعدی» است.
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: فعلاً (دوستانه)
    note: روش خودمانی و بسیار رایج برای خداحافظی بین دوستان و آشناها.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: فردا می‌بینمت
    note: خداحافظی صمیمانه، وقتی انتظار دارید فردا دوباره طرف را ببینید.
  ru.a1.unit01.lesson03.teach.anna:
    title: آنا به ماکسیم سلام می‌کند
    gloss: 'آنا می‌گوید: روز بخیر! حالت چطوره؟'
    note: آنا و ماکسیم همکارند و وسط روز به هم سلام می‌کنند. کلمهٔ дела نشان می‌دهد که صمیمی و خودمانی حرف می‌زنند.
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: ماکسیم جواب می‌دهد و می‌پرسد
    gloss: 'ماکسیم می‌گوید: خوبم، ممنون. تو چطوری؟'
    note: ماکسیم جواب می‌دهد و مثل آنا خودمانی سؤال را برمی‌گرداند.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: آنا گفت‌وگو را تمام می‌کند
    gloss: 'آنا می‌گوید: منم خوبم. خب، فردا می‌بینمت!'
    note: آنا گپ کوتاه را جمع می‌کند و صمیمانه خداحافظی می‌کند.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: ماکسیم خداحافظی می‌کند
    gloss: 'ماکسیم می‌گوید: فردا می‌بینمت!'
    note: ماکسیم حرف آنا را تکرار می‌کند و گفت‌وگو تمام می‌شود.
