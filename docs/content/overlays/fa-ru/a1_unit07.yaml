teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: منو
    note: «меню» اسمی خنثی و تصریف‌ناپذیر است که از فرانسوی آمده و شکلش هیچ‌وقت تغییر نمی‌کند.
    example_gloss: بفرمایید، این منو.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: گارسون (مرد)، گارسون (زن)
    note: «официант» مذکر و «официантка» مؤنث است، طبق الگوی معمول پایانه‌ها برای جنسیت.
    example_gloss: گارسون زن در رستوران کار می‌کند.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: این میز خالی است؟
    note: «столик» شکل تصغیر «стол» (میز) است و معمولاً برای میز رستوران به کار می‌رود؛ «свободен» (خالی) با اسم مذکر هماهنگ است.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: بله، بفرمایید بنشینید.
    note: «садитесь» امر رسمی/جمع از «садиться» (نشستن) است و با «вы» به کار می‌رود.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: چی سفارش می‌دهید؟
    note: «будете заказывать» ساختار آینده است («سفارش خواهید داد») که گارسون برای پرسیدن خواستهٔ مشتری به کار می‌برد.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: من ... می‌خواهم
    note: «хочу» صیغهٔ اول شخص مفرد «хотеть» (خواستن) است و برای سفارش غذا و نوشیدنی به کار می‌رود.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: چای، قهوه
    note: «чай» و «кофе» هر دو نوشیدنی‌های پرسفارش‌اند؛ «кофе» تصریف نمی‌شود و با اینکه به «-е» ختم می‌شود، از نظر دستوری مذکر است.
    example_gloss:
    - چای می‌خواهم.
    - قهوه می‌خواهم.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: نان، بورش (سوپ چغندر)
    note: «борщ» سوپ چغندر معروف روسی است؛ هر دو اسم مذکرند.
    example_gloss:
    - نان دارید؟
    - بورش می‌خواهم.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: سالاد
    note: «и» (و) در اینجا دو چیز سفارش‌داده‌شده را به هم وصل می‌کند، مثل «борщ и салат».
    example_gloss: بورش و سالاد می‌خواهم.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: بستنی
    note: «мороженое» اسمی خنثی است که شبیه صفت است («چیزِ یخ‌زده»)؛ الگویی رایج در اسم‌های غذایی روسی.
    example_gloss: برای دسر بستنی بیاورید.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: لطفاً ... بیاورید
    note: «Принесите» امر رسمی/جمع از «принести» (آوردن) است و با «вы» به کار می‌رود.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: ممنون.
    note: «Спасибо» روش معمول تشکر کردن در هر گفت‌وگوی مؤدبانه است.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: گارسون می‌پرسد چی سفارش می‌دهید
    gloss: 'گارسون: چی سفارش می‌دهید؟'
    note: گارسون گفت‌وگو را با «Что будете заказывать?» شروع می‌کند.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: توریست غذا سفارش می‌دهد
    gloss: 'توریست: بورش و سالاد می‌خواهم.'
    note: «Турист» (توریست) با «Я хочу борщ и салат» جواب می‌دهد.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: گارسون دربارهٔ نوشیدنی می‌پرسد
    gloss: 'گارسون: چی می‌نوشید؟'
    note: «пить» (نوشیدن) با «будете» می‌آید، مثل سؤال قبلی با «заказывать».
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: توریست نوشیدنی سفارش می‌دهد
    gloss: 'توریست: چای می‌خواهم.'
    note: 'توریست ساده جواب می‌دهد: «Я хочу чай».'
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: گارسون دربارهٔ دسر می‌پرسد
    gloss: 'گارسون: برای دسر چی؟'
    note: «А на сладкое?» سؤال کوتاه بعدی است، یعنی «و برای شیرینی (دسر) چی؟»
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: توریست دسر سفارش می‌دهد
    gloss: 'توریست: برای دسر لطفاً بستنی بیاورید.'
    note: توریست با «На сладкое принесите мороженое, пожалуйста» جواب می‌دهد.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: گارسون سفارش را تأیید می‌کند
    gloss: 'گارسون: بسیار خوب. ممنون.'
    note: «Хорошо» (بسیار خوب، باشه) سفارش را تأیید می‌کند و «Спасибо» گفت‌وگو را مؤدبانه تمام می‌کند.
