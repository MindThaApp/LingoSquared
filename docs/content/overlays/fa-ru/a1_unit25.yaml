teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج برای سرگرمی‌ها: *читать* (خواندن)، *заниматься спортом* (ورزش کردن) و *готовить* (آشپزی کردن).'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*Свободное время* عبارت کلیدی برای صحبت دربارهٔ سرگرمی‌هاست. صفت *свободное* برای هماهنگی با *время* به *-ое* ختم می‌شود.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Люблю* صورت *я* از *любить* (دوست داشتن) است. بعد از آن فعل دوم به شکل مصدر می‌ماند: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *слушать музыку* (گوش دادن به موسیقی)، *рисовать* (نقاشی کردن) و *играть в игры* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: '*Слушать* مفعولش را مستقیم می‌گیرد: *музыку* حالت مفعولی (accusative) از *музыка* است، با پایانهٔ *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*С друзьями* (با دوستان): بعد از حرف اضافهٔ *с* حالت ابزاری (instrumental) می‌آید، برای همین *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: 'چهار قید اصلی تکرار: *всегда*، *часто*، *иногда*، *никогда*. این‌ها هیچ‌وقت شکلشان عوض نمی‌شود.'
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Каждую неделю* و *каждые выходные* هر دو یعنی «هر»، اما پایانه از اسم پیروی می‌کند؛ کارت بعدی را ببینید.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: '«هر»: مؤنث و جمع'
    gloss: '*Неделя* مؤنث است، پس *каждую неделю* می‌گیرد. *Выходные* جمع است، پس *каждые выходные* می‌گیرد.'
    note: '*Каждый* مثل هر صفت دیگری با اسمش هماهنگ می‌شود: *каждый день* (مذکر)، *каждую неделю* (مؤنث، حالت مفعولی)، *каждые выходные* (جمع).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: نستیا بحث سرگرمی‌ها را پیش می‌کشد
    gloss: 'نستیا: ما اغلب با هم قدم می‌زنیم. تو در اوقات فراغتت دیگه چه کار می‌کنی، دیما؟'
    note: '*Мы часто гуляем вместе*: فعل بعد از *мы* (ما) پایانهٔ *-ем* می‌گیرد و *гулять* یعنی برای تفریح قدم زدن.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: سرگرمی‌های دیما
    gloss: 'دیما: من آشپزی را دوست دارم، توی خانه هم. و اغلب ورزش هم می‌کنم.'
    note: '*И дома тоже* (توی خانه هم): *и ... тоже* نشان می‌دهد دیما برای تفریح آشپزی می‌کند، نه فقط سر کار.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: نستیا تعجب کرده
    gloss: 'نستیا: تو توی خانه هم آشپزی می‌کنی؟ تو که کل روز سر کار آشپزی می‌کنی!'
    note: '*Весь день* (تمام روز) تأکید می‌کند که دیما سر کار همین حالا هم چقدر آشپزی می‌کند. *Весь* با *день* که مذکر است هماهنگ شده.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: توضیح دیما
    gloss: 'دیما: آره، ولی آشپزی برای من آرامش‌بخشه. تو چی؟ تو دوست داری چی کار کنی؟'
    note: '*Готовить меня расслабляет* کار را اول می‌آورد؛ تحت‌اللفظی یعنی «آشپزی مرا آرام می‌کند» و *меня* در حالت مفعولی است.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: سرگرمی‌های ناستیا
    gloss: 'ناستیا: من کتاب خواندن را دوست دارم و اغلب موسیقی گوش می‌دهم.'
    note: 'دو فعل سرگرمی از درس‌های قبل با *и* (و) به هم وصل شده‌اند: *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: دیما دربارهٔ بازی می‌پرسد
    gloss: 'دیما: تو هم بازی می‌کنی؟'
    note: 'یک پرسش کوتاه بله/خیر: در روسی ترتیب کلمات عوض نمی‌شود و فقط آهنگ صدا بالا می‌رود: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: جواب ناستیا
    gloss: 'ناستیا: نه، من هیچ‌وقت بازی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Никогда не* (هیچ‌وقت) قبل از فعل یک *не* اضافه لازم دارد. *Иногда* (گاهی) نقطهٔ مقابل آن است.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و دیما اغلب با هم قدم می‌زنیم. ولی سرگرمی‌های دیگری هم داریم. دیما آشپزی را دوست دارد، توی خانه هم، و اغلب ورزش می‌کند. من کتاب خواندن را دوست دارم و اغلب موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی نمی‌کنم. تو توی وقت آزادت دوست داری چی کار کنی؟
    note: پیام ناستیا مطالب درس چهارم را مرور می‌کند و با پرسش اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      гуляем: قدم می‌زنیم
      часто: اغلب
      вместе: با هم
      другие: دیگر
      готовить: آشپزی می‌کند
      любит: دوست دارد
      дома: توی خانه
      занимается: ورزش می‌کند
      читать: بخوانم
      слушаю: گوش می‌دهم
      музыку: موسیقی
      рисую: نقاشی می‌کشم
      иногда: گاهی
      играю: بازی ویدیویی می‌کنم
      никогда: هرگز
      свободное: آزاد
      время: وقت
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: دیما دربارهٔ آخر هفته می‌پرسد
    gloss: 'دیما: این آخر هفته چی کار می‌کنی؟'
    note: '*В эти выходные* (این آخر هفته): *выходные* جمع است، برای همین *эти* هم جمع است، و *в* همراه زمان، حالت مفعولی می‌گیرد.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: ناستیا مردد است
    gloss: 'ناستیا: هنوز نمی‌دونم. کتاب خواندن را دوست دارم، ولی می‌خوام بیرون هم برم.'
    note: '*Хочу ещё выйти на улицу* یعنی «می‌خواهم بیرون هم بروم». *Хочу* صورت *я* از فعل *хотеть* است.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: دیما یک برنامه پیشنهاد می‌دهد
    gloss: 'دیما: بیا با هم قدم بزنیم. بعدش من برامون غذا درست می‌کنم.'
    note: '*Давай погуляем* راه رایج پیشنهاد دادنِ کاری با هم است، و *потом* (بعدش) مرحلهٔ بعد را مشخص می‌کند.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: ناستیا موافقت می‌کند
    gloss: 'ناستیا: فکر خوبیه! هم قدم زدن را دوست دارم هم آشپزی را.'
    note: '*Мне нравится* تحت‌اللفظی یعنی «برای من خوشایند است»: شخص در حالت дательный (*мне*) می‌آید و چیزی که دوستش داریم بعد از آن.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: دیما قرار را قطعی می‌کند
    gloss: 'دیما: عالیه. پس شنبه می‌بینمت!'
    note: '*Увидимся в субботу* (شنبه می‌بینیم‌ت): *в* همراه روز هفته حالت مفعولی می‌گیرد، برای همین *суббота* می‌شود *субботу*.'
