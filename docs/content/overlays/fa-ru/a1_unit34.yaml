    title: چه کسی کیست؟ در محله
    gloss: دیما در یک محله‌ی خوب در کازان، نزدیک سوپرمارکت زندگی می‌کند. پاول همسایه‌ی مرد دیما و آنا همسایه‌ی زن دیما است. پاول خیلی خوش‌برخورد است و هر روز به دیما سلام می‌کند. دیما پاول و آنا را خوب می‌شناسد.
    note: مشخص می‌کند پاول و آنا چه کسانی هستند و مثل درس‌های درباره‌ی تحصیل، جشن‌ها و کارهای خانه، متن را جمع‌بندی می‌کند.
