    note: «вашей» ضمیر ملکی محترمانه‌ی «شما» است و با اسم مؤنث «улице» در حالت مکانی هماهنگ شده است.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: آنا درباره‌ی خیابان می‌پرسد
    gloss: 'آنا: توی خیابان شما چی هست؟'
    note: آنا گفت‌وگو را با «Что есть на вашей улице?» شروع می‌کند.
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: ویکتور سه جا را نام می‌برد
    gloss: 'ویکتور: توی خیابان من یک مغازه، یک کتابخانه و یک بانک هست.'
    note: «На моей улице есть» با «есть» (هست) فهرست می‌کند و آیتم‌ها با «и» به هم وصل می‌شوند.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: آنا می‌پرسد بانک کجاست
    gloss: 'آنا: خب بانک کجاست؟'
    note: «А» به‌طور طبیعی سؤال بعدی آنا را درباره‌ی یکی از جاهایی که ویکتور گفت شروع می‌کند.
