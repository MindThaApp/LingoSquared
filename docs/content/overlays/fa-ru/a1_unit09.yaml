    title: ویکتور خیابان بانک را می‌گوید
    gloss: 'ویکتور: بانک توی خیابان پوشکین است.'
    note: ویکتور با «Банк на улице Пушкина» جواب می‌دهد و بعد از «улице» از حالت اضافه‌ی «Пушкина» استفاده می‌کند.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: آنا از ویکتور تشکر می‌کند
    gloss: 'آنا: خیلی ممنون.'
    note: «Спасибо большое» با «большое» (بزرگ) «спасибо» را قوی‌تر می‌کند و راهی رایج برای گفتن «خیلی ممنون» است.
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: ویکتور جواب می‌دهد
