  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: مغازه
    note: магазин اسم مذکر است و یعنی مغازه یا فروشگاه.
    example_gloss: داریم می‌ریم مغازه.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: چقدر
    note: сколько دربارهٔ مقدار یا قیمت می‌پرسد و معمولاً با стоит می‌آید.
    example_gloss: نان چند است؟
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: قیمتش است، تمام می‌شود
    note: стоит سوم‌شخص مفرد فعل стоить («قیمت داشتن») است و با فاعل مفرد مثل хлеб به کار می‌رود.
    example_gloss: نان صد روبل است.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: روبل
    note: рубль واحد پول روسیه است؛ بعد از сто («صد») شکل جمع در حالت اضافه یعنی рублей می‌آید.
    example_gloss: نان صد روبل است.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: نان، شیر
    note: хлеб مذکر و молоко خنثی است؛ هر دو از مواد غذایی رایج روزمره‌اند.
    example_gloss:
    - نان چند است؟
    - شیر چند است؟
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: لطفاً به من ... بدهید
    note: Дайте امر رسمی یا جمع فعل дать («دادن») است و با «вы» به کار می‌رود.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: کیلوگرم
    note: килограмм واحد معمول برای خرید میوه و سبزی یا نان بر حسب وزن است.
    example_gloss: لطفاً یک کیلو بدهید.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: نیم کیلو
    note: полкило از пол- («نیم») و кило (شکل کوتاه و محاوره‌ای килограмм) ساخته شده است.
    example_gloss: لطفاً نیم کیلو بدهید.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: عدد (تکه)
    note: штука برای شمردن تک‌تک چیزهاست؛ пять штук بعد از عدد пять از جمع حالت اضافه استفاده می‌کند.
    example_gloss:
    - لطفاً یک عدد بدهید.
    - لطفاً پنج عدد بدهید.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: گوجه‌فرنگی، خیار
    note: هر دو اسم جمع از سبزیجات‌اند؛ помидоры و огурцы هر دو مذکرند.
    example_gloss:
    - گوجه‌فرنگی دارید؟
    - خیار دارید؟
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: سیب‌زمینی، کلم
    note: картофель اسم مذکر جمعی است (مثل اسم ناشمارا به کار می‌رود) و капуста مؤنث است.
    example_gloss:
    - سیب‌زمینی دارید؟
    - کلم دارید؟
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: سیب، پرتقال
    note: بعد از «кило» در «кило яблок» کلمهٔ «яблок» به شکل جمعِ حالت مضاف‌الیهی (родительный) می‌آید («یک کیلو سیب»)، درست مثل «кило апельсинов».
    example_gloss:
    - کیلویی سیب چنده؟
    - کیلویی پرتقال چنده؟
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: '... دارید؟ (رسمی)'
    note: اینجا شکل رسمی «вас» به کار رفته است؛ این همان روش معمول برای پرسیدن از مغازه‌دار است که فلان چیز را دارد یا نه.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: بله، ... دارم
    note: '«У меня есть» (تحت‌اللفظی: «نزد من هست») روش معمول برای گفتن «دارم» است و جواب مغازه‌دار است.'
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: مشتری دربارهٔ گوجه‌فرنگی می‌پرسد
    gloss: 'مشتری: گوجه‌فرنگی دارید؟'
    note: مشتری با جملهٔ مؤدبانهٔ «У вас есть ...?» شروع می‌کند.
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: فروشنده می‌گوید بله
    gloss: 'فروشنده: بله، داریم.'
    note: '«Да, есть» جواب کوتاه و رایج است (تحت‌اللفظی: «بله، هست») و لازم نیست اسم کالا دوباره گفته شود.'
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: مشتری قیمت می‌پرسد
    gloss: 'مشتری: کیلویی سیب چنده؟'
    note: بعد از «кило» کلمهٔ «яблок» به شکل جمعِ حالت مضاف‌الیهی می‌آید.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: فروشنده قیمت را می‌گوید
    gloss: 'فروشنده: دویست روبل.'
    note: «Двести» یعنی «دویست»؛ مثل «сто» بعد از آن «рублей» (جمعِ حالت مضاف‌الیهی) می‌آید.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: مشتری یک کیلو می‌خرد
    gloss: 'مشتری: یک کیلو سیب بدید، لطفاً.'
    note: «Дайте ..., пожалуйста» را از درس 2 می‌شناسید؛ این بار با «килограмм яблок» («یک کیلو سیب»).
