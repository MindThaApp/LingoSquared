    title: فروشنده خرید را می‌دهد
    gloss: 'فروشنده: باشه، بفرمایید.'
    note: «Пожалуйста» اینجا یعنی «بفرمایید» وقتی فروشنده جنس را تحویل می‌دهد، نه «لطفاً».
