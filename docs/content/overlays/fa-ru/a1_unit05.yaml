teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: ساعت چند است؟
    note: روش استاندارد پرسیدن ساعت؛ تحت‌اللفظی یعنی «کدام ساعت؟».
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: الان ساعت یک است.
    note: «Час» به‌تنهایی یعنی «ساعت یک». در روسی اینجا «один час» نمی‌گویند، برخلاف الگوی عددهای ۲ به بالا.
    example_gloss: ساعت چند است؟ — ساعت یک.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: ساعت دو، ساعت سه
    note: بعد از два و три، کلمه‌ی час به شکل مفرد ملکی (родительный) یعنی часа درمی‌آید؛ مثل الگوی عدد و اسم در درس ۳.
    example_gloss:
    - الان ساعت دو است.
    - الان ساعت سه است.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: ساعت پنج، ساعت ده
    note: از пять به بعد، час به شکل جمع ملکی یعنی часов درمی‌آید؛ باز هم مثل الگوی ۵ به بالا در درس ۳.
    example_gloss:
    - الان ساعت پنج است.
    - الان ساعت ده است.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: چه ساعتی؟
    note: برای پرسیدن زمان وقوع یک کار به کار می‌رود؛ برخلاف Который час? که فقط ساعت فعلی را می‌پرسد.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: صبح، ظهر (وسط روز)
    note: این‌ها قیدهایی (حالت ابزاری) از утро و день هستند و بدون حرف اضافه به کار می‌روند.
    example_gloss:
    - صبح‌ها قهوه می‌خورم.
    - وسط روز کار می‌کنم.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: عصر، شب
    note: همان الگوی قید ابزاری утром/днём.
    example_gloss:
    - عصر خانه هستم.
    - شب می‌خوابم.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: ساعت دو بعدازظهر.
    note: کلمه‌ی дня (ملکی از день) بعد از ساعت نشان می‌دهد که ساعت دو بعدازظهر است، نه دو بامداد.
    example_gloss: جلسه چه ساعتی است؟ — ساعت دو بعدازظهر.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: ساعت هفت عصر.
    note: کلمه‌ی вечера (ملکی از вечер) نشان می‌دهد که این ساعت هفت، عصر است.
    example_gloss: مغازه ساعت هفت عصر بسته می‌شود.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: ببخشید، می‌شود بگویید ساعت چند است؟
    note: Скажите, пожалуйста لحن سؤال را مؤدبانه می‌کند و برای پرسیدن از غریبه مناسب است.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: قطار کی حرکت می‌کند؟
    note: Отходит («حرکت می‌کند») فعل معمول برای حرکت قطار یا اتوبوس از ایستگاه است.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: مسافر ساعت را می‌پرسد
    gloss: 'مسافر: ببخشید، می‌شود بگویید ساعت چند است؟'
    note: مسافر مؤدبانه با Скажите, пожалуйста شروع می‌کند؛ این برای صحبت با کارکنان ایستگاه مناسب است.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: فروشنده‌ی بلیت جواب می‌دهد
    gloss: 'فروشنده‌ی بلیت: ساعت هفت صبح است.'
    note: Сейчас семь часов утра ساعت فعلی را می‌گوید و برای وضوح утра («صبح») را اضافه می‌کند.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: مسافر درباره‌ی قطار می‌پرسد
    gloss: 'مسافر: و قطار کی حرکت می‌کند؟'
    note: А سؤال بعدیِ مسافر را به‌طور طبیعی شروع می‌کند.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: فروشنده‌ی بلیت ساعت حرکت را می‌گوید
    gloss: 'فروشنده‌ی بلیت: ساعت هشت صبح.'
    note: В восемь часов утра با حرف اضافه‌ی в، ساعت و بخش روز جواب می‌دهد.
