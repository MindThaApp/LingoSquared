teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: من ... دارم
    note: تحت‌اللفظی یعنی «نزد من ... (هست)»؛ راه استاندارد روسی برای گفتن «دارم» است و فعل جداگانه‌ای برای «داشتن» ندارد.
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: یک، دو
    note: بعد از «два» (دو)، اسم شکل مفرد حالت اضافی می‌گیرد؛ مثلاً «брат» (برادر) می‌شود «брата»، نه شکل جمع.
    example_gloss:
    - من یک برادر دارم.
    - من دو برادر دارم.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: سه، چهار
    note: «Три» و «четыре» هم مثل «два» اسم را به شکل مفرد حالت اضافی می‌برند؛ «книга» (کتاب) بعد از «два/три/четыре» می‌شود «книги».
    example_gloss:
    - من سه کتاب دارم.
    - من چهار کتاب دارم.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: پنج
    note: از «пять» (پنج) به بعد، اسم شکل جمع حالت اضافی می‌گیرد؛ «рубль» (روبل) می‌شود «рублей»، نه «рубли».
    example_gloss: من پنج روبل دارم.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: برادر؛ برادرها (بعد از ۲ تا ۴)
    note: «брата» شکل مفرد حالت اضافی است که فقط بعد از «два»، «три» و «четыре» می‌آید؛ جمع معمولی نیست.
    example_gloss: من دو برادر دارم.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: کتاب؛ کتاب‌ها (بعد از ۲ تا ۴)
    note: «книги» همان الگوی مفرد حالت اضافی مثل «брата» است و بعد از «два»، «три» و «четыре» می‌آید.
    example_gloss: من سه کتاب دارم.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: روبل؛ روبل‌ها (۵ به بالا)
    note: «рублей» شکل جمع حالت اضافی است که از «пять» (پنج) به بعد به کار می‌رود.
    example_gloss: من پنج روبل دارم.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: شش، هفت
    note: «шесть» و «семь» هم مثل «пять» اسم را به شکل جمع حالت اضافی می‌برند.
    example_gloss:
    - ساعت شش است.
    - من هفت روبل دارم.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: هشت، نه
    note: 'هر دو همین الگوی جمع حالت اضافی را ادامه می‌دهند: «книга» می‌شود «книг» و «рубль» می‌شود «рублей».'
    example_gloss:
    - من هشت کتاب دارم.
    - من نه روبل دارم.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: ده
    note: در گفتن سن هم به کار می‌رود، مثل «Мне десять лет» (من ده سالم است).
    example_gloss: من ده سالم است.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: کتاب‌ها (جمع حالت اضافی، ۵ به بالا)
    note: شکل جمع حالت اضافی «книга» که از «пять» به بعد می‌آید؛ حرف صدادار آخرش کاملاً می‌افتد، برخلاف «книги» که بعد از «два/три/четыре» می‌آید.
    example_gloss: من نه کتاب دارم.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: من ده سالم است.
    note: در روسی سن با حالت دادی «мне» (به من) به‌علاوه‌ی عدد و «лет» (جمع حالت اضافی «سال») گفته می‌شود؛ مثل فارسی «ده سال دارم» با فعل «داشتن» نیست و فعل «بودن» هم ندارد.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: شما چند سال دارید؟ (رسمی)
    note: از «вам»، شکل رسمی حالت دادی، استفاده می‌کند که با لحن «вы» در درس ۲ جور است.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: این چنده؟
    note: راه استاندارد پرسیدن قیمت یک جنس است و «стоит» (می‌ارزد/قیمتش است، مفرد) دارد.
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: سیب‌ها چند است؟
    note: چون «яблоки» (سیب‌ها) جمع است، «стоят» (شکل جمع «قیمت داشتن») می‌آید؛ برخلاف «стоит» مفرد در «Сколько это стоит?»
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: روبل (۱)؛ روبل (۲ تا ۴)؛ روبل (۵ به بالا)
    note: 'شکل «روبل» با عددِ قبلش عوض می‌شود: بعد از یک «рубль»، بعد از «два/три/четыре» «рубля» و از «пять» به بعد «рублей».'
    example_gloss:
    - این یک روبل می‌ارزد.
    - این دو روبل می‌ارزد.
    - این پنج روبل می‌ارزد.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: مشتری به فروشنده سلام می‌کند
    gloss: 'مشتری: سلام! سیب‌ها چند است؟'
    note: مشتری در غرفه‌ی بازار قبل از پرسیدن قیمت، مؤدبانه با «Здравствуйте» شروع می‌کند.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: فروشنده جواب می‌دهد
    gloss: 'فروشنده: سه روبل.'
    note: «Три рубля» شکل مفرد حالت اضافی «روبل» برای ۲ تا ۴ را دارد، مطابق با «три».
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: مشتری درباره‌ی قیمت نان می‌پرسد
    gloss: 'مشتری: خب، نان چند است؟'
    note: مشتری با А («و / خب») خیلی راحت سؤال بعدی را درباره‌ی کالای دوم می‌پرسد.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: فروشنده دوباره جواب می‌دهد
    gloss: 'فروشنده: شش روبل.'
    note: Шесть рублей شکل جمع حالت اضافه (родительный) را دارد که بعد از اعداد ۵ به بالا، مثل шесть، می‌آید.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: مشتری مؤدبانه تمام می‌کند
    gloss: 'مشتری: باشه، ممنون!'
    note: Хорошо, спасибо! گفت‌وگوی بازار را دوستانه تمام می‌کند و از واژه‌های درس سلام و احوال‌پرسی استفاده می‌کند.
