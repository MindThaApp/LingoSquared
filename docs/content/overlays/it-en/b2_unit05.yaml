teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: registro, livello di formalità
    note: '*register* indica quanto suoni formale o informale. A differenza dell''italiano, che distingue tra tu e Lei, l''inglese ha un solo *you*: il tono dipende soprattutto da come formuli la frase.'
    example_gloss: Il registro cambia quando cambia il destinatario.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: informale, alla buona
    note: '*casual* va bene con un amico o un conoscente. È più diretto, ma non per questo scortese.'
    example_gloss: Un messaggio informale va bene per un amico.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: professionale, cortese e di tono lavorativo
    note: '*professional* va bene con un collega: cortese e chiaro, ma senza eccessiva formalità.'
    example_gloss: Un messaggio professionale va bene per un collega.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: formale
    note: '*formal* va bene con un''istituzione. In inglese lo si ottiene spesso con richieste più lunghe e più indirette.'
    example_gloss: Un messaggio formale va bene per un'istituzione.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: destinatario, pubblico
    note: '*audience* è la persona o il gruppo a cui scrivi o parli.'
    example_gloss: Il tuo destinatario influenza la scelta delle parole.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: istituzione, ente
    note: '*institution* è un''organizzazione come una clinica, una banca o un''università.'
    example_gloss: Una clinica è un'istituzione.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Richiesta formale
    gloss: Le sarei grato se potesse confermare se il mio appuntamento può essere spostato a venerdì.
    note: '*I would be grateful if you could...* è formale. L''inglese non ha bisogno di una parola diversa per *you*: la cortesia sta in tutta la costruzione.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Richiesta informale
    gloss: Puoi spostarlo a venerdì?
    note: '*Can you...?* va benissimo con un amico, ma con un''istituzione suona subito troppo diretto.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Richiesta professionale
    gloss: Possiamo spostare l'appuntamento a venerdì, se per te va ancora bene?
    note: '*Could we...?* suona collaborativo e cortese con un collega.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: Gentile team di pianificazione,
    note: '*Dear...* è una normale formula di apertura formale. È meno rigida di molte aperture di lettera tradizionali in italiano.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Cambiare registro
    gloss: Mantieni invariato il contenuto quando cambi registro. L'inglese informale può usare domande dirette. L'inglese professionale usa spesso could. L'inglese formale usa spesso I would be grateful if you could.
    note: 'Non pensare solo alla differenza tra tu e Lei: in inglese cambia l''intera frase.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: rigido, troppo formale
    note: '*stiff* indica che un messaggio suona inutilmente formale per la situazione.'
    example_gloss: Un messaggio rigido suona troppo formale per la situazione.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: adatto, appropriato
    note: '*appropriate* indica che la formulazione è adatta al destinatario e alla situazione.'
    example_gloss: Un messaggio adatto è in sintonia con il destinatario.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Testo da leggere: lo stesso messaggio, tre destinatari'
    gloss: 'Nina deve spostare un appuntamento a venerdì. A un amico scrive: Can you move it to Friday? Il messaggio è diretto e informale. A un collega scrive: Could we move the appointment to Friday if that still works for you? Il messaggio è professionale e cortese. Alla clinica scrive: I would be grateful if you could confirm whether my appointment can be moved to Friday. Il contenuto è lo stesso nei tre testi, ma il registro cambia con il destinatario.'
    note: In inglese il registro cambia attraverso la formulazione, non con una parola diversa per il Lei.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina chiede della formulazione
    gloss: 'Nina dice: Devo chiedere se il mio appuntamento può essere spostato. Posso semplicemente scrivere: ''Can you move it?'''
    note: '*just write* mostra che dubita che la forma diretta vada bene.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar fa notare il registro
    gloss: 'Oscar dice: A un amico, sì. Alla clinica suona troppo informale.'
    note: Anche qui in inglese si usa semplicemente *you*, ma la frase in sé è troppo diretta per la clinica.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina chiede del registro per un collega
    gloss: 'Nina chiede: Cosa scriveresti a un collega?'
    note: Un collega richiede un registro professionale, non il massimo della formalità.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar propone la versione per il collega
    gloss: 'Oscar dice: Scriverei: ''Could we move the appointment to Friday if that still works for you?'''
    note: '*Could we* e *if that still works for you* addolciscono la richiesta.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina chiede della clinica
    gloss: 'Nina chiede: E alla clinica?'
    note: Un'istituzione richiede una struttura di richiesta più formale.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar propone la versione formale
    gloss: 'Oscar dice: Scriverei: ''I would be grateful if you could confirm whether my appointment can be moved to Friday.'''
    note: Questa versione non chiede bruscamente di agire, ma di confermare.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina riassume
    gloss: 'Nina dice: Stesso messaggio, registro diverso.'
    note: 'Il contenuto resta lo stesso: spostare l''appuntamento a venerdì.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar conferma
    gloss: 'Oscar dice: Esatto. Il contenuto resta lo stesso, ma il livello di formalità cambia.'
    note: Questo è il cuore del controllo del registro a livello B2.
