teaching:
  en.a1.unit14.lesson01.teach.hello_this_is:
    title: Hello, this is Daniel.
    gloss: Pronto, sono Daniel.
    note: Al telefono ci si presenta con *this is [nome]*, non con *I'm*, che si usa invece di persona.
  en.a1.unit14.lesson01.teach.hi_its:
    title: Hi, it's Leila.
    gloss: Ciao, sono Leila.
    note: '*it''s [nome]* è una variante più breve e informale di *this is [nome].*'
  en.a1.unit14.lesson01.teach.are_you_free:
    title: Are you free tonight?
    gloss: Sei libero stasera?
    note: '*free* qui significa disponibile, che ha tempo, non «gratis».'
  en.a1.unit14.lesson02.teach.can_you_repeat:
    title: Sorry, can you repeat that?
    gloss: Scusi, può ripetere?
    note: '*Sorry* introduce con cortesia la richiesta di ripetere.'
  en.a1.unit14.lesson02.teach.speak_slowly:
    title: Can you speak more slowly, please?
    gloss: Può parlare più lentamente, per favore?
    note: '*more slowly* significa «più lentamente»: è il comparativo di *slowly.*'
  en.a1.unit14.lesson02.teach.i_cant_hear:
    title: I can't hear you well.
    gloss: Non La sento bene.
    note: '*can''t hear* significa «non sento», spesso a causa di una cattiva connessione.'
  en.a1.unit14.lesson03.teach.are_you_free_at:
    title: Are you free at 6pm?
    gloss: Sei libero alle 18?
    note: '*at 6pm* indica l''ora precisa.'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: Un messaggio di testo
    gloss: Ciao Leila, sei libera alle 18? Vediamoci al bar.
    note: Un breve messaggio di testo unisce una domanda sull'orario a una proposta concreta.
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: Questo messaggio serve a proporre un orario e un luogo per un incontro.
    note: '*to suggest* significa «proporre»: è lo scopo del messaggio.'
  en.a1.unit14.lesson04.teach.how_about:
    title: How about 6pm at the cafe?
    gloss: Che ne dici delle 18 al bar?
    note: '*How about...?* propone con gentilezza un orario o un luogo.'
  en.a1.unit14.lesson04.teach.a_hello:
    title: Saluto di Leila
    gloss: 'Leila: Pronto, sono Leila.'
    note: Leila risponde al telefono dicendo il proprio nome.
  en.a1.unit14.lesson04.teach.q_free_tonight:
    title: Domanda di Daniel
    gloss: 'Daniel: Ciao Leila, sono Daniel. Sei libera stasera?'
    note: Daniel si presenta e chiede subito se lei ha tempo.
  en.a1.unit14.lesson04.teach.a_repeat_request:
    title: Richiesta di Leila
    gloss: 'Leila: Scusa, puoi ripetere?'
    note: Leila non ha capito la domanda e chiede di ripeterla.
  en.a1.unit14.lesson04.teach.repeat_question:
    title: Domanda ripetuta di Daniel
    gloss: 'Daniel: Sei libera stasera?'
    note: Daniel ripete esattamente la stessa domanda.
  en.a1.unit14.lesson04.teach.a_yes_what_time:
    title: Risposta di Leila
    gloss: 'Leila: Ah, sì! A che ora?'
    note: Leila accetta e chiede l'ora precisa.
  en.a1.unit14.lesson04.teach.suggest_time_place:
    title: Proposta di Daniel
    gloss: 'Daniel: Che ne dici delle 18 al bar?'
    note: Daniel propone ora e luogo in una sola frase.
