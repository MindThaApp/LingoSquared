  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: Il saluto del farmacista
    gloss: 'Il farmacista dice: Salve, posso aiutarla?'
    note: '*Hi, can I help you?* significa salve, posso aiutarla?'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: I sintomi di Leila
    gloss: 'Leila dice: Sì, ho una brutta tosse e il naso che cola.'
    note: Ripasso della frase già studiata.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: Il farmacista consiglia lo sciroppo
    gloss: 'Il farmacista dice: Ho uno sciroppo per la tosse che dovrebbe aiutarla. Lo prenda prima di andare a letto.'
    note: '*before bed* significa prima di andare a letto e si riferisce allo sciroppo, non alle compresse.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Ha anche qualcosa per il mal di gola?'
    note: '*too* alla fine significa anche.'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: Il farmacista consiglia le compresse
    gloss: 'Il farmacista dice: Sì, queste compresse fanno bene al mal di gola. Ne prenda una ogni quattro ore.'
    note: Questa è la dose delle compresse; lo sciroppo va preso prima di andare a letto.
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: La decisione di Leila
    gloss: 'Leila dice: Ottimo, prendo entrambi. Quanto costa?'
    note: '*I''ll take both.* significa li prendo entrambi.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: Il prezzo
    gloss: 'Il farmacista dice: Sono nove dollari.'
    note: Ripasso della frase già studiata.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila paga
    gloss: 'Leila dice: Ecco a lei. Grazie!'
    note: '*Here you go.* significa ecco a lei, quando si porge qualcosa.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Testo su una visita in farmacia
    gloss: 'Una visita in farmacia: Pochi giorni dopo la gita in montagna con Mia, Leila si prese un raffreddore. Aveva una brutta tosse, il naso che colava e anche mal di gola. Daniel l''accompagnò alla farmacia vicino al suo appartamento. Il farmacista ascoltò i sintomi di Leila e consigliò sciroppo per la tosse e compresse. Disse di prendere lo sciroppo prima di andare a letto e una compressa ogni quattro ore. Leila pagò nove dollari per entrambi. Tornando a casa, Daniel le comprò anche una scatola di fazzoletti. Quella sera Leila prese la medicina e, nel fine settimana, la tosse stava già molto meglio.'
    note: '*by the weekend* significa entro il fine settimana.'
