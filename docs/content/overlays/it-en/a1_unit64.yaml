  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: Stai benissimo.
    note: '*look* qui significa avere un aspetto, non guardare.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: Mi piace la tua giacca.
    note: '*I like your...* è un modo comune per fare un complimento su qualcosa che appartiene a qualcuno.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Che bel sorriso.
    note: '*What a...* si usa per fare un complimento in forma di esclamazione.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: È molto gentile da parte tua.
    note: '*very* rende più forte *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Grazie mille.
    note: '*Thank you very much* è una frase di ringraziamento cortese e calorosa.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia fa un complimento"
    gloss: 'Mia dice: Ciao Leila. Oggi stai benissimo.'
    note: '*You look great* è un complimento diretto.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila ringrazia Mia
    gloss: 'Leila dice: Grazie, Mia.'
    note: '*Thank you* significa grazie.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia nota la giacca verde
    gloss: 'Mia dice: Mi piace la tua giacca verde.'
    note: '*I like your green jacket* è un complimento sui vestiti.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila risponde con gentilezza
    gloss: 'Leila dice: È molto gentile da parte tua.'
    note: '*That is very kind* risponde a qualcosa di carino che qualcuno ha detto.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia nota il sorriso
    gloss: 'Mia dice: Hai anche un bellissimo sorriso! Guarda, questa è la mia foto.'
    note: '*too* qui significa anche.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila fa un complimento per la foto
    gloss: 'Leila dice: Grazie mille. La tua foto è bella.'
    note: '*Your photo is nice* restituisce un complimento.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia spiega la foto
    gloss: 'Mia dice: Grazie. È per Daniel.'
    note: '*Thanks* è più breve di *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Messaggio gentile
    gloss: 'Messaggio gentile: la tua giacca verde è bellissima. La tua foto è bella. Grazie per la tua gentilezza.'
    note: Il messaggio fa due complimenti e ringrazia qualcuno.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Testo: un complimento a un''amica'
    gloss: 'Un complimento a un''amica: Mia vide Leila con una giacca verde. Mia disse che Leila stava benissimo. Disse anche che Leila aveva un bellissimo sorriso. Leila ringraziò Mia. Poi Leila guardò la foto di Mia e disse che era bella. Mia era contenta perché la foto era per Daniel. Più tardi Leila scrisse un breve messaggio: la tua giacca verde è bellissima.'
    note: '*looked great* è il passato di *look great*.'
