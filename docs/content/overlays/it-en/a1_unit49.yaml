    gloss: spazzatura / rifiuti
    note: '*trash* significa spazzatura o rifiuti (inglese americano; *garbage* è un sinonimo).'
    example_gloss: Puoi portare fuori la spazzatura?
  en.a1.unit49.lesson01.teach.collection_day:
    title: collection day
    gloss: giorno della raccolta
    note: '*collection day* significa giorno della raccolta dei rifiuti.'
    example_gloss: Il giorno della raccolta è martedì.
  en.a1.unit49.lesson02.teach.which_bin_does_this_go_in:
    title: Which bin does this go in?
    gloss: In quale bidone va questo?
    note: '*go in* qui significa andare, essere il posto giusto per qualcosa.'
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: Questo va nel bidone del riciclo.
    note: '*This goes in the recycling bin.* significa questo va nel bidone del riciclo.'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: Il bidone verde è per il vetro.
    note: '*is for ...* significa è per ..., per dire a che cosa serve qualcosa.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: Puoi portare fuori la spazzatura?
    note: '*take out* è un phrasal verb che si può separare: take out the trash e take the trash out sono entrambi corretti. In italiano un verbo come portare fuori non si separa mai.'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: Il giorno della raccolta è martedì.
    note: '*Collection day is on Tuesday.* significa il giorno della raccolta è martedì.'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: E la carta e i rifiuti organici?
    note: '*What about ...?* significa e ...?, per chiedere di qualcos''altro.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: L'avvertimento di Mia
    gloss: 'Mia dice: Aspetta, quel barattolo di vetro non va nella spazzatura!'
    note: '*doesn''t go in the trash* significa non va nella spazzatura.'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Le scuse di Daniel
    gloss: 'Daniel dice: Oh no, scusa! In quale bidone va?'
    note: '*Which bin does it go in?* ripete la forma di domanda appena imparata.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Mia spiega
    gloss: 'Mia dice: Va nel bidone verde. Qui ricicliamo il vetro.'
    note: '*We recycle glass here.* significa qui ricicliamo il vetro.'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: E la carta e i rifiuti organici?'
    note: Ripetizione della domanda imparata prima, *What about ...?*
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: La spiegazione di Mia
    gloss: 'Mia dice: La carta va nel bidone blu e i rifiuti organici vanno nel bidone marrone.'
    note: '*goes in ..., and ... goes in ...* ripete la stessa struttura per due tipi diversi di rifiuti.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: La domanda di Daniel sul giorno della raccolta
    gloss: 'Daniel dice: Capito. Quando è il giorno della raccolta?'
    note: '*Got it.* è un modo informale per dire capito.'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Risposta di Mia"
    gloss: 'Mia dice: I bidoni del riciclo si portano fuori il martedì e la spazzatura si porta fuori il venerdì.'
    note: 'Nota: Mia indica due giorni diversi per due tipi diversi di rifiuti: martedì per il riciclo, venerdì per la spazzatura normale.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: La promessa di Daniel
    gloss: 'Daniel dice: Grazie! La prossima volta differenzierò tutto correttamente.'
    note: '*I''ll sort everything correctly next time.* significa la prossima volta differenzierò tutto correttamente.'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Testo su come funziona la raccolta differenziata
    gloss: 'Come si differenziano i rifiuti: molti condomini hanno bidoni diversi per tipi di rifiuti diversi. Il vetro di solito va nel bidone verde e la carta nel bidone blu. I rifiuti organici vanno nel bidone marrone e tutto il resto nel bidone nero della spazzatura normale. Conviene conoscere il giorno della raccolta, perché i bidoni vengono svuotati una sola volta a settimana. Daniel sta provando le ricette del libro di cucina che ha preso in prestito in biblioteca e cucina spesso con Mia a casa sua. Ieri sera ha preparato una ricetta del libro e poi stava quasi per mettere un barattolo di vetro nella spazzatura normale. Mia lo ha fermato e gli ha mostrato come si differenziano i rifiuti nel suo palazzo. Gli ha spiegato che i bidoni del riciclo si portano fuori il martedì e la spazzatura normale il venerdì. Daniel è stato grato e ha detto che d''ora in poi differenzierà tutto correttamente.'
    note: '*almost put a glass jar in the regular trash* significa stava quasi per mettere un barattolo di vetro nella spazzatura normale.'
