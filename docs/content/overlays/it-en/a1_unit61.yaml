    title: The bus is late.
    gloss: L'autobus è in ritardo.
    note: 'In inglese si usa la stessa struttura per una persona e per un autobus: *is late*.'
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: Va bene.
    note: '*That''s okay* accetta le scuse in modo gentile.'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: Nessun problema.
    note: '*No problem* è una risposta breve e informale a delle scuse o a un ringraziamento.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: Ho fatto un errore.
    note: L'inglese usa *make* con *mistake* (*make a mistake*), non *do*.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel chiede scusa"
    gloss: 'Daniel dice: Ciao Mia. Mi dispiace di essere in ritardo.'
    note: '*I''m sorry I''m late* unisce le scuse e il motivo.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia accetta le scuse
    gloss: 'Mia dice: Va bene.'
    note: '*That''s okay* è semplice e gentile.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: L'autobus è in ritardo
    gloss: 'Daniel dice: L''autobus è in ritardo.'
    note: Questa frase dà il motivo.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia dice che si può aspettare
    gloss: 'Mia dice: Nessun problema. Possiamo aspettare.'
    note: '*We can wait* significa che aspettare è possibile.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel sbaglia con l'orario
    gloss: 'Daniel dice: Ho sbagliato con l''orario.'
    note: '*with the time* significa riguardo all''orario.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: La lezione inizia alle tre
    gloss: 'Mia dice: Non fa niente. La lezione inizia alle tre.'
    note: '*at three* usa *at* davanti a un''ora.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel ringrazia Mia
    gloss: 'Daniel dice: Grazie per aver aspettato.'
    note: '*Thank you for waiting* usa *for* seguito dalla forma in -ing.'
  en.a1.unit61.lesson04.teach.class_note:
    title: Avviso della lezione
    gloss: 'Avviso della lezione: la lezione inizia alle 3:00. Per favore, arriva in orario. Se sei in ritardo, manda un messaggio.'
    note: L'avviso dice cosa fare se sei in ritardo.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Testo: scuse prima della lezione'
    gloss: 'Scuse prima della lezione: Daniel era in ritardo a lezione perché l''autobus era in ritardo. Incontrò Mia fuori dall''aula. Daniel disse che gli dispiaceva. Disse anche di aver sbagliato con l''orario. Mia disse che non c''erano problemi. La lezione era alle 3:00. Daniel mandò un breve messaggio all''insegnante. Il messaggio diceva: «Mi dispiace di essere in ritardo. L''autobus è in ritardo.»'
    note: '*because* introduce il motivo: perché l''autobus era in ritardo.'
