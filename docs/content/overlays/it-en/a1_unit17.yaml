  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: Vuoi andare al cinema questo fine settimana?
    note: Con *Do you want to...?* proponi un'attività. Dopo *to* il verbo è all'infinito, senza altre terminazioni.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: Ti va di fare una passeggiata?
    note: '*Would you like to...?* è una variante un po'' più cortese di *Do you want to...?* Corrisponde all''italiano «Ti andrebbe di...?».'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: Certo, volentieri!
    note: Con *I'd love to* accetti con entusiasmo. *I'd* è la forma contratta di *I would*; dopo *to* il verbo si omette perché compare già nella domanda.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Mi dispiace, non posso. Sabato sono impegnato.
    note: Con questa frase rifiuti e dai il motivo. *can't* è la forma contratta di *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: Magari un'altra volta?
    note: Così mostri che verresti volentieri in un'altra occasione.
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: pranzare
    note: '*have lunch* significa «pranzare». Come per gli altri pasti, non c''è l''articolo.'
  en.a1.unit17.lesson03.teach.invitation_text:
    title: Testo di un invito
    gloss: Ciao! Vuoi pranzare venerdì? Che ne dici di alle 13 al bar?
    note: Questo è un invito a pranzo.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: Domenica mi va bene.
    note: '*works for me* significa che qualcosa va bene per te.'
