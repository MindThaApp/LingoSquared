course:
  title: Inglese B1
  description: Impara l'inglese a livello B1, per doveri, possibilità, situazioni ipotetiche e racconti di vita quotidiana, con spiegazioni dettagliate in italiano.
units:
  en.b1.unit03.hypotheticals:
    title: Se piove, se avessi tempo
lessons:
  en.b1.unit03.lesson01.conditional_vocabulary:
    title: If, rain e free time
  en.b1.unit03.lesson02.real_conditions:
    title: If it rains, we will stay home
  en.b1.unit03.lesson03.reading_more_free_time:
    title: 'Lettura: if she had more free time'
  en.b1.unit03.lesson04.the_weekend_plans_dialogue:
    title: If there's another one, you should join
teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: se / qualora
    note: '*if* introduce una condizione. Come l''italiano «se», vale solo per una condizione: per un momento (quando, ogni volta che) l''inglese usa *when*.'
    example_gloss: Se piove, restiamo a casa.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: pioggia / piovere
    note: '*rain* indica l''acqua che cade dal cielo, oppure «piovere».'
    example_gloss: Potrebbe piovere questo fine settimana.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: restare a casa
    note: '*stay home* significa non uscire e restare a casa.'
    example_gloss: Se piove, restiamo a casa.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: fine settimana
    note: '*weekend* indica sabato e domenica.'
    example_gloss: Che programmi hai per il fine settimana?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: tempo libero
    note: '*free time* indica il tempo in cui non si lavora e non si è impegnati.'
    example_gloss: In questo periodo non ho molto tempo libero.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: dipingere
    note: '*paint* significa fare un quadro con i colori.'
    example_gloss: Leila ama dipingere nei fine settimana.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: Se domani piove, restiamo a casa.
    note: '*if + present, will + forma base* esprime una condizione reale e possibile nel futuro.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: Se ho tempo libero questo fine settimana, dipingerò.
    note: 'La stessa costruzione: *if + present, will + forma base*.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: Se piove, restiamo a casa. Se ho tempo, dipingerò.
    note: 'Dopo *if* l''inglese usa qui il presente, anche quando si parla del futuro: non *will rain*. In italiano nella frase con «se» si usa il presente o il futuro («se piove», «se pioverà»).'
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: condizionale (dipingerei, farei…)
    note: '*would* + forma base esprime una situazione irreale o ipotetica nel presente.'
    example_gloss: Se avessi più tempo, dipingerei ogni giorno.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: corso / lezione
    note: '*class* indica un corso organizzato o una lezione con un insegnante.'
    example_gloss: C'era un corso di pittura vicino a casa sua.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: Leila ama dipingere, ma non ha molto tempo libero. Se avesse più tempo libero, dipingerebbe ogni giorno. Il mese scorso c'era un corso di pittura vicino a casa sua. Se l'avesse saputo prima, si sarebbe iscritta. Ora controlla ogni settimana se ci sono nuovi corsi.
    note: Un breve testo di lettura con una situazione irreale nel presente e una situazione irreale nel passato.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: 'Daniel dice: Che programmi hai per il fine settimana?'
    note: Una semplice domanda aperta per iniziare una conversazione.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: 'Leila dice: Se non piove, vado a fare una passeggiata. Se piove, resto a casa e dipingo.'
    note: Due condizioni reali una dopo l'altra, a seconda del tempo.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: 'Daniel dice: Mi sembra bello. Il mese scorso hai fatto quel corso di pittura?'
    note: Una domanda di approfondimento su qualcosa nel passato.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: 'Leila dice: No. Se l''avessi saputo prima, mi sarei iscritta.'
    note: '*if + past perfect, would have + participio* esprime un passato irreale o un rammarico.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: 'Daniel dice: Peccato. Se ce n''è un altro, dovresti partecipare.'
    note: Daniel usa *should* per incoraggiare Leila a cogliere la prossima occasione.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: 'Leila dice: Hai ragione. Se ne vedo uno, mi iscrivo subito.'
    note: Una nuova condizione reale sul futuro, non più ipotetica.
