  en.a1.unit67.lesson03.teach.dialogue_line1:
    title: Mia chiede della famiglia
    gloss: 'Mia dice: Ciao Daniel. Come sta la tua famiglia?'
    note: '*How is your family?* è la domanda principale del dialogo.'
  en.a1.unit67.lesson03.teach.dialogue_line2:
    title: Daniel ha buone notizie
    gloss: 'Daniel dice: Stanno bene. Ho buone notizie.'
    note: '*They are well* significa stanno bene.'
  en.a1.unit67.lesson03.teach.dialogue_line3:
    title: Mia chiede della notizia
    gloss: 'Mia dice: Che notizia è?'
    note: '*What is...?* chiede maggiori informazioni.'
  en.a1.unit67.lesson03.teach.dialogue_line4:
    title: La sorella ha avuto un bambino
    gloss: 'Daniel dice: Mia sorella ha un bambino.'
    note: '*My sister has a baby* condivide una notizia di famiglia.'
  en.a1.unit67.lesson03.teach.dialogue_line5:
    title: Mia risponde con calore
    gloss: 'Mia dice: È meraviglioso.'
    note: '*wonderful* suona caloroso e positivo.'
  en.a1.unit67.lesson03.teach.dialogue_line6:
    title: Daniel andrà a trovarli
    gloss: 'Daniel dice: Grazie. Andremo a trovarli presto.'
    note: '*soon* significa presto, tra poco.'
  en.a1.unit67.lesson03.teach.dialogue_line7:
    title: Mia dice che Daniel deve essere orgoglioso
    gloss: 'Mia dice: Sarai sicuramente orgoglioso.'
    note: '*must be* dice che cosa è probabilmente vero.'
  en.a1.unit67.lesson03.teach.dialogue_line8:
    title: Daniel è orgoglioso
    gloss: 'Daniel dice: Sono orgoglioso di lei.'
    note: '*of her* si riferisce a sua sorella.'
  en.a1.unit67.lesson04.teach.family_note:
    title: Messaggio di famiglia
    gloss: 'Messaggio di famiglia: buone notizie. Mia sorella ha un bambino. Verremo a trovarli presto.'
    note: Il messaggio condivide in breve una buona notizia e una visita.
  en.a1.unit67.lesson04.teach.reading_passage:
    title: 'Testo: buone notizie di famiglia'
    gloss: 'Buone notizie di famiglia: Mia ha chiesto a Daniel della sua famiglia. Daniel ha detto che stavano bene. Poi ha condiviso una buona notizia: sua sorella ha avuto un bambino. Mia ha detto che la notizia era meravigliosa. Daniel ha detto che lui e la sua famiglia sarebbero andati a trovarli presto. Era orgoglioso di sua sorella. Più tardi Mia ha mandato un breve messaggio: Sono felice per la tua famiglia.'
    note: '*shared good news* significa ha condiviso una buona notizia.'
