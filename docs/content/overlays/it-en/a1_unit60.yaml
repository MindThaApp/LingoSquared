  en.a1.unit60.lesson02.teach.are_you_free:
    title: Are you free on Saturday?
    gloss: Sei libero sabato?
    note: '*on Saturday* usa *on* davanti a un giorno. In italiano di solito non serve nessuna preposizione: basta dire «sabato».'
  en.a1.unit60.lesson02.teach.would_you_like_dinner:
    title: Would you like to come to dinner?
    gloss: Ti va di venire a cena?
    note: '*Would you like to...?* è un modo cortese di invitare qualcuno.'
  en.a1.unit60.lesson02.teach.bring_a_drink:
    title: Please bring a drink.
    gloss: Porta qualcosa da bere, per favore.
    note: '*bring* qui significa portare qualcosa all''appuntamento.'
  en.a1.unit60.lesson02.teach.i_can_come:
    title: I can come.
    gloss: Posso venire.
    note: Questa frase accetta un invito in modo breve e chiaro.
  en.a1.unit60.lesson02.teach.cant_come:
    title: Sorry, I can't come.
    gloss: Mi dispiace, non posso venire.
    note: '*can''t* è la forma contratta di *cannot*.'
  en.a1.unit60.lesson02.teach.see_you_at_six:
    title: See you at six.
    gloss: Ci vediamo alle sei.
    note: '*at six* usa *at* davanti a un''ora. In italiano si dice «alle sei».'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: Leila chiede a Daniel se è libero
    gloss: 'Leila dice: Ciao Daniel! Sei libero sabato?'
    note: '*Are you free...?* chiede se qualcuno è disponibile.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Daniel è libero
    gloss: 'Daniel dice: Sì, sono libero.'
    note: '*I am free* significa sono disponibile.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila invita Daniel
    gloss: 'Leila dice: Ti va di venire a cena?'
    note: '*Would you like to come...?* è cortese e gentile.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: Daniel accetta
    gloss: 'Daniel dice: Sì, volentieri.'
    note: '*I''d love to* è un modo caloroso di dire di sì.'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: Leila chiede di portare da bere
    gloss: 'Leila dice: Porta qualcosa da bere, per favore.'
    note: '*Please bring...* è una richiesta cortese.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Daniel chiede l'ora
    gloss: 'Daniel dice: Certo. A che ora?'
    note: '*What time?* è una domanda breve e naturale.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila dice le sei
    gloss: 'Leila dice: Ci vediamo alle sei.'
    note: '*at six* usa *at* davanti a un''ora.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel ringrazia Leila
    gloss: 'Daniel dice: Perfetto. Grazie per l''invito.'
    note: '*Thank you for...* usa *for* per indicare il motivo del ringraziamento.'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Invito
    gloss: 'Invito a cena: sabato alle 6:00. Porta qualcosa da bere, per favore. Indirizzo: 18 Park Street.'
    note: L'invito indica il giorno, l'ora, cosa deve portare Daniel e l'indirizzo.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Testo: cena a casa di Leila'
    gloss: 'Cena a casa di Leila: Leila invitò Daniel a cena per sabato. Gli chiese di portare qualcosa da bere. Daniel disse che poteva venire. Nell''invito c''era scritto che la cena era alle 6:00 al 18 di Park Street. Daniel scrisse l''indirizzo sul telefono. Voleva arrivare puntuale. Leila era contenta perché il suo amico poteva venire.'
    note: '*invited Daniel to dinner* significa che Leila ha invitato Daniel a cena.'
