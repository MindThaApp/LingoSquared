teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: Ciao
    note: '*Hello* è il saluto neutro e universale: va bene in quasi ogni situazione.'
    example_gloss: Ciao, Daniel!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: Ciao (informale)
    note: '*Hi* è più informale di *Hello*, un po'' come il nostro *ciao* tra amici.'
    example_gloss: Ciao, Leila!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: Buongiorno
    note: '*Good morning* si usa al mattino, proprio come *buongiorno*.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: Buon pomeriggio
    note: '*Good afternoon* si usa nel pomeriggio. In inglese non esiste un saluto come *buongiorno* che vada bene per tutto il giorno.'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: Buonasera
    note: '*Good evening* si usa la sera, proprio come *buonasera*.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: Arrivederci
    note: '*Goodbye* è il saluto di congedo neutro e universale.'
    example_gloss: Arrivederci, a domani!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: Ciao (congedo)
    note: '*Bye* è più informale di *Goodbye*, un po'' come il nostro *ciao* quando ci si lascia.'
    example_gloss: Ciao, a presto!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: Come sta? / Come stai?
    note: '*How are you?* in inglese va bene sia in contesti formali sia informali: non c''è la distinzione grammaticale tra *Lei* e *tu* che c''è in italiano.'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: Sto bene, grazie.
    note: Una risposta semplice e neutra.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: Sto bene, grazie.
    note: 'Significa la stessa cosa di *I''m fine, thanks*: nella vita di tutti i giorni si usano entrambe.'
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: Non c'è male, grazie.
    note: 'Una risposta informale e un po'' riservata: né particolarmente bene né male.'
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: E Lei? / E tu?
    note: 'Per restituire la domanda: funziona in qualsiasi registro, senza distinzione tra formale e informale.'
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: Tutto a posto?
    note: '*Are you okay?* chiede piuttosto se a qualcuno manca qualcosa in questo momento, più che essere una domanda generica di saluto come *How are you?*'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Piacere di conoscerLa. / Piacere di conoscerti.
    note: Si dice quando si incontra qualcuno per la prima volta.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: Piacere mio.
    note: È la risposta adatta a *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: A dopo.
    note: Si usa quando si pensa di rivedere la persona nello stesso giorno, proprio come *a dopo* in italiano.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: Buona giornata.
    note: Un congedo cordiale che augura all'altra persona il resto della giornata sereno.
