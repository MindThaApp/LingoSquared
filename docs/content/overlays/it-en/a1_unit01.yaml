course:
  title: Inglese A1
  description: Impara l'inglese a livello A1, per saluti e brevi conversazioni di ogni giorno, con spiegazioni dettagliate in italiano.
units:
  en.a1.unit01.greetings:
    title: Saluti e brevi conversazioni
