course:
  title: Inglese B2
  description: Impara l'inglese a livello B2 per conversazioni sfumate, argomentazioni, ipotesi e discussioni professionali, con spiegazioni in italiano colloquiale.
units:
  en.b2.unit02.speculation:
    title: It must have gone down overnight
lessons:
  en.b2.unit02.lesson01.certainty_and_deduction:
    title: May, might, must e cannot
  en.b2.unit02.lesson02.present_and_past_speculation:
    title: It must have been a system problem
  en.b2.unit02.lesson03.reading_an_incident_note:
    title: 'Lettura: cosa è probabilmente successo?'
  en.b2.unit02.lesson04.the_speculation_dialogue:
