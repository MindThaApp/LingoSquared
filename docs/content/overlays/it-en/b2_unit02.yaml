teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: può darsi, potrebbe
    note: '*may* esprime possibilità. Qui non indica il permesso, come invece in *May I...?*.'
    example_gloss: Questo può essere vero.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: potrebbe, forse
    note: '*might* esprime una possibilità prudente, spesso un po'' meno certa di *may*.'
    example_gloss: Questo potrebbe essere vero.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: deve per forza, di sicuro
    note: Qui *must* esprime una conclusione forte basata su indizi, non un obbligo.
    example_gloss: Questo deve essere vero.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: non può, è impossibile che
    note: '*cannot* si usa quando le prove escludono qualcosa. Al passato diventa *cannot have been*.'
    example_gloss: Questo non può essere vero.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: conclusione tratta dalle prove
    note: '*deduction* è un ragionamento che parte dagli indizi, non un tirare a indovinare.'
    example_gloss: La conclusione di Mia si basa sulle prove.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: supposizioni a caso
    note: '*guesswork* è un''ipotesi fatta con poche o nessuna prova.'
    example_gloss: Senza prove, la spiegazione sarebbe solo un tirare a indovinare.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may e might
    gloss: May e might spesso si sovrappongono. Entrambi indicano una possibile spiegazione; might suona spesso un po' più cauto.
    note: Non tradurre sempre "forse" con *maybe*. In una frase ben formulata *may* e *might* sono spesso più eleganti.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Conclusione forte sul passato
    gloss: Il server deve essersi bloccato durante la notte, perché non è stato generato nessun report.
    note: 'L''italiano "deve essere stato / deve essersi bloccato" in inglese diventa *must have* + participio passato: *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Possibile causa nel passato
    gloss: I report potrebbero essere falliti durante la notte.
    note: '*may have failed* indica una causa possibile, non una conclusione certa.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Possibilità prudente
    gloss: Potrebbe essere stato invece un problema di permessi.
    note: '*might have been* lascia la causa aperta e suona più cauto di *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: Escludere qualcosa
    gloss: Non può essere stato solo un problema dei report.
    note: L'italiano "non può essere stato" in inglese diventa *cannot have been* oppure, nel parlato, *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: I verbi modali per fare ipotesi
    gloss: Usa must be per una conclusione forte sul presente e must have been per una conclusione forte sul passato. Usa may/might per una possibilità nel presente e may have/might have per una possibilità nel passato. Usa cannot/cannot have been quando le prove escludono una spiegazione.
    note: 'Attenzione: qui *must* non indica un obbligo, ma una conclusione: deve per forza essere così.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: guasto, interruzione del servizio
    note: '*outage* è un''interruzione in cui un sistema o un servizio non funziona.'
    example_gloss: Un'interruzione del sistema ha impedito l'esecuzione dei report.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: conseguenza
    note: '*consequence* è ciò che deriva da una causa o da un problema.'
    example_gloss: Una conseguenza è che il dashboard potrebbe mostrare dati vecchi.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Testo di lettura: cosa è probabilmente successo?'
    gloss: I report notturni non sono stati eseguiti e la pagina di monitoraggio è vuota. Mia dice che il server deve essersi bloccato durante la notte. Daniel suggerisce che potrebbe essere stato un problema di permessi, ma questo non può spiegare la pagina di monitoraggio vuota. Il team finanziario potrebbe non avere i numeri del mattino e il dashboard dei clienti potrebbe mostrare dati vecchi finché i report non saranno rigenerati. Mia non è del tutto sicura, ma la sua spiegazione è una conclusione tratta dalle prove disponibili, non pura congettura.
    note: Il testo distingue fatti, cause possibili, conclusioni forti, spiegazioni escluse e possibili conseguenze.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Daniel espone il fatto
    gloss: 'Daniel dice: Nessuno dei report notturni è stato generato.'
    note: Questo è il fatto noto, ancora senza alcuna ipotesi.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Mia trae una conclusione forte
    gloss: 'Mia dice: Il server deve essersi bloccato durante la notte.'
    note: '*must have gone down* è una conclusione forte sul passato.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Daniel indica una causa possibile
    gloss: 'Daniel dice: Potrebbe essere stato invece un problema di permessi.'
    note: '*might have been* lascia aperta l''opzione, ma non la rende certa.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Mia esclude una spiegazione limitata
    gloss: 'Mia dice: Forse, ma anche la pagina di monitoraggio è vuota, quindi non può essere stato solo un problema dei report.'
    note: '*cannot have been only...* esclude la spiegazione perché le prove sono più ampie.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Daniel chiede delle conseguenze
    gloss: 'Daniel chiede: Quali conseguenze dobbiamo aspettarci?'
    note: Dopo la causa arriva la domanda sulle possibili conseguenze.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Mia indica le possibili conseguenze
    gloss: 'Mia dice: Il team finanziario potrebbe non avere i numeri del mattino e il dashboard dei clienti potrebbe mostrare dati vecchi.'
    note: '*may be missing* e *might show* indicano conseguenze possibili, non fatti certi.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Daniel verifica il grado di certezza
    gloss: 'Daniel dice: Quindi è una deduzione, non solo un''ipotesi a caso?'
    note: Daniel chiede se il ragionamento di Mia si basa su prove.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Mia sfuma la sua conclusione
    gloss: 'Mia dice: Sì. Le prove sono limitate, ma indicano un''interruzione del sistema.'
    note: Una conclusione forte può comunque riconoscere i limiti delle prove.
