teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: mentre
    note: '*while* significa che qualcosa accade nello stesso tempo di qualcos''altro.'
    example_gloss: Mentre guidavo, ha cominciato a piovere.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: gomma a terra, foratura
    note: '*flat tire* indica una gomma senza aria che non funziona più.'
    example_gloss: La mia gomma si è bucata in autostrada.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: accostare
    note: '*pull over* significa fermare l''auto a lato della strada.'
    example_gloss: Ho dovuto accostare subito.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: sconosciuto, estraneo
    note: '*stranger* indica una persona che non si conosce.'
    example_gloss: Uno sconosciuto si è fermato per aiutarmi.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: meccanico
    note: '*mechanic* indica una persona che ripara le automobili.'
    example_gloss: Il meccanico ha riparato in fretta la mia gomma.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: ha detto che
    note: '*said that* si usa per riportare ciò che ha detto un''altra persona.'
    example_gloss: Ha detto che poteva aiutare.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Hintergrundgeschehen mit 'while'
    gloss: Mentre guidavo verso il lavoro, mi si è bucata una gomma.
    note: '*while* + passato con *was/were* + -ing descrive lo sfondo che viene interrotto da qualcos''altro.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Folgendes Ereignis mit 'when'
    gloss: Quando ho accostato, uno sconosciuto si è fermato per aiutarmi.
    note: '*when* introduce l''evento successivo nella storia.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: Mentre guidavo, mi si è bucata una gomma. Quando ho accostato, mi ha aiutato uno sconosciuto.
    note: '*while* segna lo sfondo (un''azione in corso); *when* segna l''evento successivo, più breve, che avviene al suo interno. In italiano corrispondono all''imperfetto («guidavo») e al passato prossimo («si è bucata»).'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: aveva già chiamato
    note: '*had already* + participio descrive qualcosa che era già accaduto prima di un altro momento nel passato.'
    example_gloss: Quando è arrivato, avevo già chiamato Daniel.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: ha mantenuto la parola
    note: '*kept his word* significa che qualcuno ha fatto ciò che aveva promesso.'
    example_gloss: Ha mantenuto la parola e l'ha riparato in dieci minuti.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: Ieri mattina, mentre Leila guidava verso il lavoro, le si è bucata all'improvviso una gomma. Ha accostato in una strada tranquilla. Uno sconosciuto ha fermato la sua auto e si è offerto di aiutarla. Quando è arrivato il meccanico, Leila aveva già chiamato Daniel per dirgli che sarebbe arrivata in ritardo. Il meccanico ha detto che poteva riparare la gomma in dieci minuti. Ha mantenuto la parola, e Leila è arrivata al lavoro con soli venti minuti di ritardo.
    note: Una storia al passato con uno sfondo (*while*), una successione di eventi (*when*) e qualcosa che era già accaduto prima (*had already*).
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel bemerkt, dass Leila zu spät ist
    gloss: 'Daniel dice: Sei in ritardo! Che cosa è successo?'
    note: Una domanda diretta e preoccupata con cui inizia la storia.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila beginnt ihre Geschichte
    gloss: 'Leila dice: Mentre guidavo verso il lavoro, mi si è bucata all''improvviso una gomma.'
    note: '*while* segna lo sfondo in cui è accaduto qualcos''altro.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel fragt nach
    gloss: 'Daniel dice: Oh no! Che cosa hai fatto?'
    note: Una breve domanda per sapere di più sulla storia.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila erzählt weiter
    gloss: 'Leila dice: Ho accostato e uno sconosciuto si è fermato per aiutarmi.'
    note: L'evento successivo nella storia, dopo lo sfondo.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reagiert und fragt weiter
    gloss: 'Daniel dice: È stato gentile da parte sua. Hai chiamato un meccanico?'
    note: '*that was kind of him* è una reazione naturale alla gentilezza di qualcuno.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila beendet die Geschichte
    gloss: 'Leila dice: Sì, ne avevo già chiamato uno prima che arrivasse lo sconosciuto. Il meccanico ha detto che poteva ripararla in dieci minuti, e così ha fatto!'
    note: '*had already called* mostra ciò che era già accaduto prima dell''arrivo dello sconosciuto.'
