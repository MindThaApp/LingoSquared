  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: La richiesta di Daniel
    gloss: 'Daniel dice: Vorrei tagliarmi i capelli, per favore. Mia sorella verrà a trovarmi la prossima settimana.'
    note: In *I'd like a haircut*, *haircut* è un sostantivo; in italiano si dice naturalmente tagliarsi i capelli.
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "Il parrucchiere chiede"
    gloss: 'Il parrucchiere chiede: Certo, che taglio desidera?'
    note: '*what style do you want* significa che taglio desidera.'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Il desiderio di Daniel
    gloss: 'Daniel dice: Lo stesso taglio, solo un po'' più corto.'
    note: '*just a little shorter* significa solo un po'' più corto.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: La domanda di Mia
    gloss: 'Mia chiede: Può lavargli prima i capelli?'
    note: '*Can you wash his hair first?* significa può lavargli prima i capelli?'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: La conferma del parrucchiere
    gloss: 'Il parrucchiere dice: Certamente, ed è incluso nel taglio.'
    note: '*included with* significa incluso nel prezzo di.'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: La domanda di Daniel sul prezzo
    gloss: 'Daniel chiede: Ottimo. Quanto costa?'
    note: 'Qui *Great.* è una breve reazione positiva: ottimo.'
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: Il prezzo
    gloss: 'Il parrucchiere dice: Costa venti dollari.'
    note: Ripasso della frase già studiata.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: Testo su una visita dal parrucchiere
    gloss: 'Una visita dal parrucchiere: La sorella di Daniel sarebbe arrivata da Chicago la settimana seguente, così decise di tagliarsi i capelli. Mia gli consigliò il suo parrucchiere preferito, in un piccolo salone vicino a casa sua, e lo accompagnò. Il parrucchiere gli chiese quale taglio volesse e lui rispose lo stesso, solo un po'' più corto. Prima gli lavò i capelli; il lavaggio era incluso. Il taglio costò venti dollari. Alla fine Mia disse che stava benissimo. Tornando a casa incontrarono Leila per un caffè. Si sentiva molto meglio dopo il raffreddore e anche lei adorò il nuovo taglio di Daniel.'
    note: '*looked great* significa stava benissimo.'
