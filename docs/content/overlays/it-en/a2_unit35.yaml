teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: farmacia
    note: '*pharmacy* è il negozio in cui si ritirano i medicinali.'
    example_gloss: Accanto allo studio medico c'è una farmacia.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: farmacista
    note: '*pharmacist* è la persona che consegna i medicinali.'
    example_gloss: Il farmacista mi ha spiegato come prendere il medicinale.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: compressa
    note: '*tablet* è un singolo pezzo solido di medicinale che si ingoia.'
    example_gloss: Prendo una compressa la mattina e un'altra la sera.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: dose
    note: '*dose* è la quantità di medicinale che si prende in una volta.'
    example_gloss: La dose è una compressa, due volte al giorno.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: ripetizione della ricetta / nuova confezione
    note: '*refill* è una nuova confezione dello stesso medicinale, senza dover tornare dal medico.'
    example_gloss: Mi serve una nuova confezione, perché le mie compresse sono quasi finite.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: effetti collaterali
    note: '*side effects* sono gli effetti aggiuntivi che un medicinale può avere sul corpo.'
    example_gloss: Il farmacista mi ha spiegato gli effetti collaterali di questo medicinale.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Sagen, wie oft man etwas einnimmt
    gloss: una volta al giorno, due volte al giorno, tre volte al giorno, ogni otto ore
    note: '*once a day* = una volta al giorno, *twice a day* = due volte al giorno, *three times a day* = tre volte al giorno, *every eight hours* = ogni otto ore.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Sagen, weshalb man am Tresen steht
    gloss: Vorrei ritirare una ricetta.
    note: '*I''d like to...* è la forma cortese standard per dire che cosa si desidera.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Die Dosierung, die man zu hören bekommt
    gloss: Prenda una compressa due volte al giorno, durante i pasti.
    note: '*with food* significa durante i pasti, cioè non a stomaco vuoto.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Fragen, wie lange man es einnehmen muss
    gloss: Per quanti giorni devo prenderlo?
    note: '*How many...?* si usa con le cose numerabili, come i giorni.'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Nach Nebenwirkungen fragen
    gloss: Ci sono effetti collaterali?
    note: '*Are there any...?* è il modo abituale di chiedere se c''è qualcosa.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should und shouldn't für Anweisungen
    gloss: Dovrebbe prenderlo durante i pasti. Non dovrebbe smettere troppo presto.
    note: '*should* dà un consiglio o un''indicazione; *shouldn''t* è la forma negativa.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: prima di andare a letto
    note: '*before bed* significa prima di andare a dormire.'
    example_gloss: Alcuni medicinali funzionano meglio se si prendono prima di andare a letto.
  en.a2.unit35.lesson03.teach.label_text:
    title: Das Apothekenetikett
    gloss: 'Medicinale per il raffreddore. Prendere una compressa due volte al giorno durante i pasti, per cinque giorni. Non interrompere troppo presto l''assunzione delle compresse. Possibili effetti collaterali: potrebbe sentirsi stanco. Ripetizioni: una.'
    note: 'Un''etichetta di farmacia è breve e concisa: frasi corte e nessuna formula di cortesia.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Der Warnhinweis auf dem Etikett
    gloss: Non interrompere troppo presto l'assunzione delle compresse.
    note: '*Do not...* è il divieto all''imperativo, come si vede su etichette e cartelli.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel meldet sich am Tresen
    gloss: 'Daniel dice: Salve, vorrei ritirare una ricetta.'
    note: '*Hi* è più informale di *Hello*, ma al banco è del tutto comune.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Der Apotheker fragt nach dem Namen
    gloss: 'Il farmacista dice: Certo. Come si chiama?'
    note: '*Of course* qui significa: volentieri, nessun problema.'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel nennt den Grund für das Medikament
    gloss: 'Daniel dice: Daniel. Il medico mi ha prescritto un medicinale per un brutto raffreddore.'
    note: 'Si collega alla visita medica dell''unità 28: lo stesso raffreddore.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Der Apotheker nennt die Dosierung
    gloss: 'Il farmacista dice: Ecco a Lei. Prenda una compressa due volte al giorno, durante i pasti.'
    note: '*Here it is* si dice quando si porge qualcosa a qualcuno.'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel fragt, wie lange
    gloss: 'Daniel chiede: Per quanti giorni devo prenderlo?'
    note: La stessa domanda della lezione 2.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Die Antwort des Apothekers
    gloss: 'Il farmacista dice: Per cinque giorni. Non interrompa troppo presto l''assunzione delle compresse.'
    note: La stessa indicazione dell'etichetta della lezione 3.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel fragt nach Nebenwirkungen
    gloss: 'Daniel chiede: Ci sono effetti collaterali?'
    note: La stessa domanda della lezione 2.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Der Apotheker nennt die Nebenwirkung
    gloss: 'Il farmacista dice: Potrebbe sentirsi stanco, nient''altro.'
    note: '*but that''s all* qui significa: ma nient''altro.'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel bedankt sich beim Apotheker
    gloss: 'Daniel dice: Grazie mille.'
    note: '*very much* rende il ringraziamento più sentito.'
