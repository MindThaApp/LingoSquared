teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: sarebbe possibile
    note: '*would it be possible to* chiede con cortesia se qualcosa sia in linea di principio possibile.'
    example_gloss: Sarebbe possibile spostare la riunione a giovedì?
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: mi chiedevo se
    note: '*I was wondering if* rende una richiesta indiretta e prudente.'
    example_gloss: Mi chiedevo se potresti rivedere oggi il mio rapporto.
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: potremmo forse
    note: '*could we possibly* chiede con cortesia qualcosa che si farebbe insieme.'
    example_gloss: Potremmo forse iniziare la riunione cinque minuti più tardi?
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: Le sarei grato se
    note: '*I would appreciate it if* dice che si sarebbe grati se qualcuno facesse qualcosa.'
    example_gloss: Ti sarei grato se potessi mandare presto il verbale.
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: ordine del giorno
    note: '*agenda* indica un elenco di argomenti da discutere in una riunione.'
    example_gloss: Daniel ha aggiunto un altro punto all'ordine del giorno.
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: fare un follow-up, ricontattare
    note: '*follow up* significa riprendere contatto dopo una riunione o un compito.'
    example_gloss: Mia fa un follow-up via e-mail dopo la riunione.
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: Sarebbe possibile spostare la riunione a giovedì?
    note: '*would it be possible to* + forma base chiede con cortesia una modifica.'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: Mi chiedevo se potresti rivedere oggi il mio rapporto.
    note: '*I was wondering if you could* è un modo indiretto e cortese di chiedere.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Abgeschwächte Bitten bei der Arbeit
    gloss: Nelle richieste formali sul lavoro usa una forma condizionale attenuata come Would it be possible to... o I was wondering if... invece di un ordine diretto. Queste forme suonano più cortesi di Move the meeting o Review my report.
    note: 'Forma: usa una forma condizionale attenuata invece di un ordine diretto.'
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: aggiornamento sul budget
    note: '*budget update* indica un rapporto su come viene speso il denaro.'
    example_gloss: Daniel ha preparato l'aggiornamento sul budget per la riunione.
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: dopo, in seguito
    note: '*afterward* significa dopo un''altra cosa nel tempo.'
    example_gloss: Possiamo rivedere le note dopo.
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Nachricht vor dem Meeting'
    gloss: Ciao Daniel, spero che tu stia bene. Sarebbe possibile aggiungere l'aggiornamento sul budget all'ordine del giorno della riunione di domani? Ti sarei grata se portassi con te i numeri più recenti. Potremmo forse iniziare dieci minuti prima, così dopo abbiamo tempo per le domande? Grazie, Mia
    note: Un messaggio breve e professionale con richieste attenuate.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: Die Teamleitung eröffnet das Meeting höflich
    gloss: 'La responsabile dice: Buongiorno, Mia. Sarebbe possibile iniziare oggi con l''aggiornamento sul budget?'
    note: '*would it be possible to* chiede con cortesia l''ordine degli argomenti nella riunione.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia macht eine zusätzliche Bitte
    gloss: 'Mia dice: Certo. Mi chiedevo se potessimo aggiungere anche il nuovo cliente all''ordine del giorno.'
    note: '*I was wondering if we could* è un modo indiretto e cortese di proporre qualcosa.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: Die Teamleitung bittet um ein kurzes Meeting
    gloss: 'La responsabile dice: Buona idea. Potremmo forse tenere questa riunione sotto i trenta minuti?'
    note: '*could we possibly* chiede con cortesia qualcosa che si fa insieme.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia bittet um etwas für das nächste Mal
    gloss: 'Mia dice: Farò del mio meglio. Ti sarei grata se la prossima volta tutti mandassero le domande in anticipo.'
    note: '*I would appreciate it if* dice che si sarebbe grati.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: Die Teamleitung stimmt zu und verspricht nachzufassen
    gloss: 'La responsabile dice: È una richiesta giusta. Prima della prossima riunione manderò un promemoria.'
    note: '*follow up* qui significa: tornarci sopra più tardi.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia schließt mit einer Bestätigung
    gloss: 'Mia dice: Grazie. Oggi pomeriggio mando l''ordine del giorno aggiornato.'
    note: Una chiusura breve e cortese della conversazione.
