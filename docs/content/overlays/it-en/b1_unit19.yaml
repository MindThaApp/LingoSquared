teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: punto principale, idea centrale
    note: '*main point* indica l''idea più importante di un testo o di una conversazione.'
    example_gloss: Il punto principale della riunione era il budget.
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: dettaglio
    note: '*detail* indica una piccola informazione aggiuntiva che sostiene il punto principale.'
    example_gloss: Mia ha aggiunto un piccolo dettaglio sul programma.
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: in sintesi
    note: '*in summary* introduce, alla fine di una spiegazione più lunga, un riassunto breve.'
    example_gloss: 'In sintesi: il progetto finirà il mese prossimo.'
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: in breve
    note: '*in short* è un modo rapido e informale di andare subito al punto in una conversazione.'
    example_gloss: In breve, il team era d'accordo sul piano.
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: con parole tue
    note: '*in your own words* chiede una spiegazione che non si limiti a riprendere il testo originale.'
    example_gloss: Spiega il piano con parole tue.
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ... (eine Zusammenfassung geben)
    gloss: In sintesi, la riunione ha trattato il budget e il nuovo cliente.
    note: '*In summary, the meeting covered...* apre un breve riassunto di ciò che è stato discusso.'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ... (den Hauptpunkt nennen)
    gloss: Il punto principale era che questo mese siamo sotto budget.
    note: '*The main point was that...* indica l''idea più importante, distinta dai dettagli minori.'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: Der Aufbau einer Zusammenfassung
    gloss: Inizia un riassunto con un'espressione come In summary o In short, poi dai soltanto i punti principali nell'ordine giusto, con frasi brevi. Usa The main point was that... per mettere in risalto l'unica idea più importante, separata dai dettagli minori.
    note: 'Forma: inizia con In summary/In short e usa The main point was that... per il punto principale.'
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: riassunto, abbreviato
    note: '*condensed* descrive un riassunto reso più breve ma che mantiene i punti principali.'
    example_gloss: Mia ha dato a Daniel un riassunto breve della riunione.
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: articolo originale
    note: '*original article* indica il testo completo originale, prima di essere riassunto.'
    example_gloss: Il riassunto di Leila corrispondeva bene all'articolo originale.
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Lesetext: einen kurzen Artikel zusammenfassen'
    gloss: 'Per il suo corso di design Leila ha letto un lungo articolo sulla comunicazione sul posto di lavoro. L''articolo originale aveva molti esempi e informazioni di contesto, ma a Leila servivano solo i punti principali. Con parole sue ha scritto un riassunto breve: la comunicazione sul lavoro funziona meglio quando i messaggi sono chiari e brevi e quando le persone fanno domande invece di tirare a indovinare. Ha lasciato fuori la maggior parte degli esempi, perché erano dettagli e non punti principali. Il suo insegnante ha detto che il riassunto ha mantenuto le idee importanti nell''ordine giusto.'
    note: Un breve testo di lettura.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Daniel bittet um eine Erklärung
    gloss: 'Daniel dice: Ho perso la riunione. Puoi dirmi che cosa è successo?'
    note: Una domanda aperta per chiedere un riassunto.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Mia gibt eine kurze Zusammenfassung
    gloss: 'Mia dice: Certo. In breve, abbiamo parlato del budget e del nuovo cliente.'
    note: '*in short* apre un riassunto rapido e informale.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Daniel fragt nach dem Hauptpunkt
    gloss: 'Daniel dice: Qual era il punto principale sul budget?'
    note: Una domanda mirata sul punto principale.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Mia nennt den Hauptpunkt
    gloss: 'Mia dice: Il punto principale era che questo mese siamo sotto budget.'
    note: '*the main point was that...* mette in risalto l''idea più importante.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Daniel fragt nach Details
    gloss: 'Daniel dice: Bene. C''erano altri dettagli?'
    note: Una domanda sui dettagli minori.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Mia nennt ein kleines Detail
    gloss: 'Mia dice: Solo un piccolo dettaglio: la riunione con il cliente è stata spostata alla prossima settimana.'
    note: '*just one small detail* introduce un piccolo fatto aggiuntivo.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel dice: Grazie per il riassunto. È molto utile.'
    note: Una chiusura breve e riconoscente della conversazione.
