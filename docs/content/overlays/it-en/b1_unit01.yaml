course:
  title: Inglese B1
  description: Impara l'inglese a livello B1, per doveri, possibilità, situazioni ipotetiche e racconti di vita quotidiana, con spiegazioni dettagliate in italiano.
units:
  en.b1.unit01.necessity:
    title: Cose che devo o dovrei fare
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must, have to e should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: dovere (obbligo forte e personale)
    note: '*must* esprime un obbligo forte e personale: qualcosa che tu stesso consideri molto importante.'
    example_gloss: Devo finire questo compito oggi.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: dovere (obbligo esterno)
    note: '*have to* esprime un obbligo che viene dall''esterno, per esempio da una regola o da una scadenza.'
    example_gloss: Devo pagare l'affitto entro venerdì.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: dovrei / dovresti
    note: '*should* è un consiglio, non un obbligo rigido.'
    example_gloss: Dovresti chiamare presto il dentista.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: compito
    note: '*task* indica un compito o un lavoro che va svolto.'
    example_gloss: Ho ancora un compito da finire.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: affitto
    note: '*rent* indica il denaro che si paga per abitare in un posto.'
    example_gloss: L'affitto scade venerdì.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: appuntamento
    note: '*appointment* indica un appuntamento fissato con qualcuno, per esempio dal medico.'
    example_gloss: Questa settimana ho un appuntamento dal dentista.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: eine starke Pflicht ausdrücken
    gloss: Devo finire questo compito oggi.
    note: '*I must* esprime un obbligo forte e personale.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: eine Pflicht von außen ausdrücken
    gloss: Devo pagare l'affitto entro venerdì.
    note: '*I have to* esprime un obbligo che viene dall''esterno, come una scadenza di pagamento.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Form bei 'she'
    gloss: Deve fissare un appuntamento.
    note: Con *he/she/it* *have to* diventa *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: eine Empfehlung geben
    gloss: Dovresti chiamare e confermare l'appuntamento.
    note: '*should* dà un consiglio, non un obbligo rigido come *must* o *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formen von 'have to'
    gloss: Devo andare. Lei deve andare. Dobbiamo andare. Loro devono andare.
    note: Solo con *he/she/it* *have* diventa *has*; con tutte le altre persone resta *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Reue über die Vergangenheit ausdrücken
    gloss: Avrei dovuto chiamare prima.
    note: '*should have* + participio esprime rammarico per qualcosa che non è stato fatto; in italiano corrisponde al condizionale passato «avrei dovuto».'
    example_gloss: Avrei dovuto chiamare prima.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: non deve / è vietato
    note: '*must not* indica un divieto: qualcosa non è assolutamente permesso. Attenzione: in italiano «non devi» è ambiguo, mentre in inglese *must not* significa «è vietato» e «non è necessario» si dice *don''t have to*.'
    example_gloss: Non devi dimenticarlo di nuovo.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: non deve / non è necessario
    note: '*don''t have to* significa che qualcosa non è obbligatorio; è diverso da *must not* (divieto).'
    example_gloss: Non devi venire se sei impegnato.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Reue, Verbot und keine Pflicht
    gloss: Avrei dovuto chiamare. Ho dimenticato. Non devi dimenticarlo di nuovo. Non è necessario che tu venga.
    note: '*should have* + participio esprime rammarico per il passato. *must not* è un divieto; *don''t have to* significa che non c''è obbligo, ma è permesso.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Lesetext: das Fitnessstudio'
    gloss: Ieri Daniel ha dimenticato di rinnovare l'abbonamento alla palestra. Avrebbe dovuto impostare un promemoria sul telefono. Ora deve pagare una penale per il ritardo. Il mese prossimo non deve dimenticarlo di nuovo.
    note: Un breve testo di lettura sull'errore di Daniel e sulle sue conseguenze.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila fragt nach der Mitgliedschaft
    gloss: 'Leila dice: Daniel, hai rinnovato l''abbonamento alla palestra?'
    note: Una domanda diretta per controllare se qualcosa è già stato fatto.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Daniels Antwort: vergessen'
    gloss: 'Daniel dice: Oh no, l''ho dimenticato! Avrei dovuto farlo la settimana scorsa.'
    note: '*I should have done that* esprime rammarico per qualcosa che non è stato fatto.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila warnt Daniel
    gloss: 'Leila dice: Devi chiamarli oggi, altrimenti pagherai una penale.'
    note: '*must* qui indica un avvertimento personale urgente.'
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel nennt weitere Pflichten
    gloss: 'Daniel dice: Hai ragione. Devo anche pagare l''affitto entro venerdì e dovrei chiamare anche il dentista.'
    note: Daniel combina *have to* (obbligo) con *should* (consiglio) in una sola risposta.
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila beruhigt Daniel
    gloss: 'Leila dice: Non devi fare tutto oggi. Ma non devi dimenticare di nuovo la palestra.'
    note: Leila contrappone *don't have to* (nessun obbligo) a *must not* (divieto).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel fasst einen Vorsatz
    gloss: 'Daniel dice: Lo so. Questo mese devo essere più organizzato.'
    note: '*I must be* qui esprime un proposito personale.'
