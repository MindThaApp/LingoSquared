teaching:
  en.a1.unit08.lesson01.teach.a_pound_of:
    title: a pound of apples
    gloss: una libbra di mele
    note: '*a pound* è un''unità di peso (circa 454 grammi), usata negli Stati Uniti per frutta e verdura.'
  en.a1.unit08.lesson01.teach.a_dozen:
    title: a dozen eggs
    gloss: una dozzina di uova
    note: '*a dozen* significa dodici pezzi.'
  en.a1.unit08.lesson01.teach.a_bottle_of:
    title: a bottle of water
    gloss: una bottiglia d'acqua
    note: '*a bottle of* significa «una bottiglia di...».'
  en.a1.unit08.lesson01.teach.a_bag_of:
    title: a bag of rice
    gloss: un sacchetto di riso
    note: '*a bag of* significa «un sacchetto di...», per i prodotti sfusi come il riso.'
  en.a1.unit08.lesson01.teach.a_kilo_of:
    title: a kilo of tomatoes
    gloss: un chilo di pomodori
    note: '*a kilo of* significa un chilo; negli Stati Uniti nella vita di tutti i giorni si pesa di solito in *pounds*, *kilo* si sente più raramente.'
  en.a1.unit08.lesson02.teach.how_much_are:
    title: How much are the apples?
    gloss: Quanto costano le mele?
    note: '*How much are...?* chiede il prezzo di qualcosa al plurale.'
  en.a1.unit08.lesson02.teach.two_dollars_a_pound:
    title: They're two dollars a pound.
    gloss: Costano due dollari alla libbra.
    note: '*a pound* alla fine della frase significa qui «alla libbra», proprio come *per pound*.'
  en.a1.unit08.lesson02.teach.can_i_have_two_pounds:
    title: Can I have two pounds, please?
    gloss: Posso avere due libbre, per favore?
    note: '*Can I have...?* è una formula di cortesia per chiedere quando si fa la spesa.'
  en.a1.unit08.lesson02.teach.is_it_fresh:
    title: Is it fresh?
    gloss: È fresco?
    note: Una domanda utile per gli alimenti freschi, come frutta o verdura.
  en.a1.unit08.lesson03.teach.per_pound:
    title: per pound
    gloss: alla libbra
    note: '*per pound* indica il prezzo per unità di peso, per esempio sui cartellini.'
    example_gloss: Le mele costano due dollari alla libbra.
  en.a1.unit08.lesson03.teach.label_text:
    title: Cartellino del prezzo
    gloss: 'Mele: 2 dollari alla libbra. Uova: 4 dollari la dozzina. Riso: 3 dollari il sacchetto.'
    note: Il simbolo del dollaro sta PRIMA del numero (*$2*), a differenza del simbolo dell'euro, che in italiano sta DOPO il numero.
  en.a1.unit08.lesson04.teach.thats_x_dollars:
    title: That's eight dollars.
    gloss: Fanno otto dollari.
    note: '*That''s X dollars* corrisponde all''italiano «Fanno X euro».'
  en.a1.unit08.lesson04.teach.q_price:
    title: Domanda di Daniel
    gloss: 'Daniel: Quanto costano le mele?'
    note: Daniel apre la conversazione con una domanda sul prezzo.
  en.a1.unit08.lesson04.teach.a_price:
    title: Risposta di Leila
    gloss: 'Leila: Costano due dollari alla libbra.'
    note: Leila dice il prezzo alla libbra.
  en.a1.unit08.lesson04.teach.q_two_pounds:
    title: Ordinazione di Daniel
    gloss: 'Daniel: Va bene, posso avere due libbre, per favore?'
    note: '*OK* conferma che Daniel accetta il prezzo prima di ordinare.'
  en.a1.unit08.lesson04.teach.a_sure_anything_else:
    title: Domanda di approfondimento di Leila
    gloss: 'Leila: Certo. Altro?'
    note: '*Sure* qui significa «certo» o «volentieri».'
  en.a1.unit08.lesson04.teach.q_eggs_too:
    title: Ordinazione aggiuntiva di Daniel
    gloss: 'Daniel: Sì, anche una dozzina di uova.'
    note: '*too* in fondo alla frase significa «anche».'
  en.a1.unit08.lesson04.teach.a_total:
    title: Conclusione di Leila
    gloss: 'Leila: Fanno otto dollari.'
    note: Leila dice il prezzo totale di mele e uova insieme.
