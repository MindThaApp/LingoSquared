teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: certificato
    note: '*certificate* è il documento ufficiale che un ufficio rilascia; *registration certificate* è il certificato di residenza.'
    example_gloss: Il mio certificato di residenza è arrivato due settimane dopo l'appuntamento.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: errore
    note: '*mistake* è qualcosa che è stato scritto o fatto in modo sbagliato.'
    example_gloss: Nel mio indirizzo su questo modulo c'è un errore.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: scritto, compitato
    note: '*spelled* dice con quali lettere e in quale ordine si scrive una parola.'
    example_gloss: Il mio nome si scrive con una L sola, non con due.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: correggere, rettificare
    note: '*correct* qui è un verbo: rendere giusto ciò che è sbagliato.'
    example_gloss: L'impiegato può correggere oggi il mio cognome.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: copia
    note: '*copy* è un secondo esemplare identico di un documento.'
    example_gloss: L'ufficio conserva una copia di ogni documento.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: passaporto
    note: '*passport* è il documento di viaggio con la tua foto.'
    example_gloss: A un appuntamento in un ufficio porto sempre il passaporto.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is und there are
    gloss: Sul mio certificato c'è un errore. Sul mio certificato ci sono due errori.
    note: '*there is* si usa per una sola cosa, *there are* per più di una, proprio come «c''è» e «ci sono» in italiano.'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: Sagen, dass ein Fehler vorliegt
    gloss: Sul mio certificato di residenza c'è un errore.
    note: '*There is a mistake on...* è il modo oggettivo e formale di segnalare un errore.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: Sagen, was genau falsch ist
    gloss: Il mio cognome è scritto in modo sbagliato.
    note: '*last name* è il cognome; *first name* è il nome.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: Fragen, ob es berichtigt werden kann
    gloss: Potrebbe correggerlo, per favore?
    note: '*Could you...?* è più cortese di *Can you...?* e va bene a uno sportello pubblico.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: Fragen, wie lange es dauert
    gloss: Quanto tempo ci vorrà per la correzione?
    note: '*How long...?* chiede una durata nel tempo, non una lunghezza.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: zwei höfliche Bitten
    gloss: Potrebbe correggerlo, per favore? Sarebbe possibile ottenere un nuovo certificato?
    note: '*Could you...?* chiede di fare qualcosa; *Would it be possible to...?* è ancora più prudente e chiede se qualcosa sia possibile.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: giorni lavorativi
    note: '*working days* sono i giorni dal lunedì al venerdì, quindi senza il fine settimana.'
    example_gloss: L'ufficio risponde a ogni lettera entro cinque giorni lavorativi.
  en.a2.unit36.lesson03.teach.notice_text:
    title: Das Schreiben zur Berichtigung
    gloss: Richiesta di correzione ricevuta. Il Suo certificato di residenza sarà corretto entro cinque giorni lavorativi. Porti per favore il Suo passaporto e questa lettera all'ufficio. Numero di riferimento 3092.
    note: 'Una lettera ufficiale è breve e oggettiva: che cosa è successo, che cosa succederà e che cosa deve fare.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: was man mitbringen soll
    gloss: Porti per favore il Suo passaporto e questa lettera all'ufficio.
    note: '*bring ... to ...* significa portare qualcosa in un luogo.'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Leila meldet den Fehler
    gloss: 'Leila dice: Buongiorno, sul mio certificato di residenza c''è un errore.'
    note: '*Hello* è più neutro di *Hi* e va meglio a uno sportello pubblico.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: Der Sachbearbeiter fragt nach
    gloss: 'L''impiegato dice: Capisco. Che cosa non va?'
    note: '*I see* qui significa: ho capito, La ascolto.'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Leila erklärt den Fehler und bittet um Berichtigung
    gloss: 'Leila dice: Il mio cognome è scritto in modo sbagliato. Potrebbe correggerlo, per favore?'
    note: Le stesse due frasi della lezione 2, ora una dopo l'altra.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: Der Sachbearbeiter fragt nach dem Reisepass
    gloss: 'L''impiegato dice: Certamente. Ha con sé il passaporto?'
    note: '*Do you have ... with you?* significa: lo ha con sé adesso?'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Leila reicht ihren Reisepass
    gloss: 'Leila dice: Sì, ecco.'
    note: '*Here it is* si dice mentre si porge qualcosa a qualcuno.'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: Der Sachbearbeiter erklärt, was er tut
    gloss: 'L''impiegato dice: Grazie. Faccio una copia e spedisco la correzione oggi stesso.'
    note: '*make a copy* è un''espressione fissa: fare una copia.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Leila fragt, wie lange es dauert
    gloss: 'Leila chiede: Quanto tempo ci vorrà per la correzione?'
    note: La stessa domanda della lezione 2.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: Die Antwort des Sachbearbeiters
    gloss: 'L''impiegato dice: Entro cinque giorni lavorativi.'
    note: '*within* significa entro un termine, quindi ci vogliono al massimo cinque giorni lavorativi.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Sachbearbeiter
    gloss: 'Leila dice: Grazie mille.'
    note: '*very much* rende il ringraziamento più sentito.'
