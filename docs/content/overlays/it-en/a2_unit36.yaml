course:
  title: Inglese A2
  description: Impara l'inglese a livello A2, per situazioni quotidiane un po' più formali, con spiegazioni dettagliate in italiano.
units:
  en.a2.unit36.document_correction:
    title: Far correggere un errore in un documento ufficiale
