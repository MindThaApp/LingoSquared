teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: telefono
    note: '*phone* significa telefono (cellulare).'
    example_gloss: Chiamo mia madre con il mio telefono.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: computer portatile
    note: '*laptop* significa computer portatile.'
    example_gloss: Lei usa il suo portatile per lavoro.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: tablet
    note: '*tablet* significa tablet.'
    example_gloss: Lui legge libri sul suo tablet.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: computer
    note: '*computer* significa computer.'
    example_gloss: Abbiamo un computer a casa.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: app
    note: '*app* significa app.'
    example_gloss: Ho una nuova app sul mio telefono.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: fotocamera
    note: '*camera* significa fotocamera (o macchina fotografica).'
    example_gloss: Questa fotocamera fa foto bellissime.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: fare una telefonata
    note: '*make a call* è una combinazione fissa di verbo + nome da ricordare insieme. Anche l''italiano ha «fare una telefonata», ma ha pure il verbo singolo «telefonare»; in inglese si usa o questa combinazione o il verbo *call* da solo.'
    example_gloss: Ogni domenica faccio una telefonata a mio fratello.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: mandare un messaggio
    note: '*send a text* è, come *make a call*, una combinazione fissa di verbo + nome. È simile all''italiano «mandare un messaggio»: in inglese si dice di solito *send a text*.'
    example_gloss: Ogni mattina lei manda un messaggio alla sua amica.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: scaricare un'app
    note: '*download an app*: in inglese e in italiano il verbo corrisponde («scaricare»), quindi questa è la più facile delle tre combinazioni fisse.'
    example_gloss: Lui scarica una nuova app ogni settimana.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: rete wireless
    note: '*wifi* significa rete wireless (connessione senza fili a internet).'
    example_gloss: La connessione a casa mia è veloce.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: batteria
    note: '*battery* significa batteria.'
    example_gloss: La batteria del mio telefono è quasi scarica.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: Come usi il telefono?
    note: '*Do you use ...?* usa l''ausiliare *do*, come le altre domande inglesi.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: Il lamento di Mia
    gloss: 'Mia dice: Il mio telefono è così vecchio. È davvero lento.'
    note: '*so* + aggettivo (*so old*) rafforza il significato, come «così» o «molto» in italiano.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Il consiglio di Leila
    gloss: 'Leila dice: Dovresti comprarne uno nuovo. Per che cosa lo usi di più?'
    note: '*What do you use it for most?* finisce con la preposizione *for*. In italiano la preposizione sta invece all''inizio della domanda («Per che cosa lo usi?»); in inglese si comincia con *what* e *for* resta in fondo.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Più che altro scrivo messaggi a mia sorella e faccio foto.'
    note: '*text* si può usare anche come verbo (*I text my sister*). È più comune di *send a text*; entrambe sono forme corrette.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: L'uso di Leila
    gloss: 'Leila dice: Uso il telefono per chiamare i miei genitori ogni fine settimana. Uso anche molte app.'
    note: '*call* come verbo (*I call my parents*) è la forma normale e informale. *Make a call* è la combinazione fissa vista nella lezione 2.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: La domanda di Mia
    gloss: 'Mia chiede: Quali app usi?'
    note: '*Which apps do you use?*: *which* chiede una scelta all''interno di un gruppo (di app), come «quali» in italiano.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'Leila dice: Uso un''app di cucina e un''app di mappe. Vuoi scaricarle?'
    note: '*Do you want to ...?* usa l''ausiliare *do*, anche se *want* è un verbo normale.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Sì, per favore, mandami i nomi!'
    note: '*please* qui sta prima del verbo (*please send ...*) e rende la richiesta più cortese. In italiano «per favore» sta spesso alla fine.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Testo su Daniel, Leila e Mia
    gloss: Daniel, Leila e Mia usano tutti il telefono in modo diverso. A Daniel non piace scrivere messaggi; preferisce telefonare. Leila usa il telefono per le mappe. Usa anche un'app di cucina quando prova nuove ricette. Mia fa molte foto e le manda alla sua famiglia. Tutti usano il portatile per lavoro e nel fine settimana fanno videochiamate con gli amici.
    note: '*He prefers to call people instead*: *instead* in fondo alla frase significa «invece» (cioè invece di scrivere messaggi).'
