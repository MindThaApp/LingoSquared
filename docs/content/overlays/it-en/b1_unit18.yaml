teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: appuntamento fissato, accordo preso
    note: '*arrangement* indica un piano già stabilito con un''altra persona, per esempio un orario concordato.'
    example_gloss: Venerdì Mia ha un appuntamento con Leila.
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: intenzione, proposito
    note: '*intention* indica qualcosa che si è deciso di fare, ma per cui non si è ancora fissato un orario con nessun altro.'
    example_gloss: L'intenzione di Daniel è finire presto il progetto.
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: previsione
    note: '*prediction* indica una valutazione di ciò che accadrà in base a dei segnali.'
    example_gloss: La mia previsione è che il progetto finirà in tempo.
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: senz'altro, di sicuro
    note: '*definitely* mostra che si è del tutto sicuri che qualcosa accadrà.'
    example_gloss: Daniel finirà senz'altro il rapporto oggi.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: probabilmente
    note: '*probably* mostra che si è abbastanza sicuri, ma non completamente.'
    example_gloss: Il progetto durerà probabilmente due mesi.
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: forse, potrebbe
    note: '*might* mostra che qualcosa è solo una debole possibilità.'
    example_gloss: Daniel potrebbe chiedere a Leila di unirsi al team.
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (impegno fissato)
    gloss: Venerdì incontro Leila per pranzo.
    note: '*I am meeting Leila for lunch on Friday* usa il present continuous (forma progressiva) per un accordo preso con un orario preciso già concordato.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (intenzione)
    gloss: Comincerò un nuovo progetto con il team di design.
    note: '*I am going to start a new project* usa going to per una decisione già presa, senza un orario fissato.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Impegni fissati e intenzioni
    gloss: 'Usa il present continuous (I am meeting Leila on Friday) per un accordo preso: un orario preciso già concordato con un''altra persona. Usa going to (I am going to start a new project) per un''intenzione o una decisione che hai già preso, anche senza un orario fisso. L''italiano usa spesso il presente o il futuro per entrambi i casi («incontro Leila venerdì», «comincerò un nuovo progetto»); in inglese devi scegliere.'
    note: 'Forma: scegli tra il present continuous per un accordo preso e going to per un''intenzione.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: in orario, in tempo
    note: '*on time* significa esattamente all''ora o alla data prevista.'
    example_gloss: Daniel pensa che il progetto finirà in tempo.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: fiducioso
    note: '*confident* significa sentirsi sicuri che qualcosa andrà bene.'
    example_gloss: Daniel è fiducioso riguardo al nuovo progetto.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Testo: i piani di Daniel per il mese prossimo'
    gloss: Il mese prossimo Daniel comincerà un nuovo progetto con il team di design. Venerdì mattina li incontra per pianificare i primi passi. Daniel è fiducioso riguardo al progetto, ma non è del tutto sicuro che finirà in tempo. Prevede che durerà probabilmente circa due mesi. Potrebbe chiedere a Leila di unirsi al team, perché ha una buona esperienza di design. Se accetta, il progetto andrà senz'altro più veloce.
    note: Un breve testo di lettura su piani e previsioni.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia chiede dei piani di Daniel
    gloss: 'Mia dice: Daniel, che programmi hai per il mese prossimo?'
    note: Una domanda aperta per iniziare la conversazione.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel dice cosa intende fare
    gloss: 'Daniel dice: Comincerò un nuovo progetto con il team di design.'
    note: '*going to* indica una decisione già presa.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia continua a chiedere
    gloss: 'Mia dice: Sembra interessante. Li incontri questa settimana?'
    note: Una domanda su un accordo preso.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel conferma l'impegno fissato
    gloss: 'Daniel dice: Sì, li incontro venerdì mattina.'
    note: '*I am meeting... on Friday morning* è il present continuous per un accordo preso.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia chiede dell'appuntamento
    gloss: 'Mia dice: Pensi che il progetto finirà in tempo?'
    note: Una domanda su una previsione.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel fa una previsione
    gloss: 'Daniel dice: Non sono sicuro, ma durerà probabilmente circa due mesi.'
    note: '*probably* mostra una certezza abbastanza forte, ma non completa.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia è ottimista
    gloss: 'Mia dice: Beh, sono sicura che andrà bene.'
    note: Un'osservazione di incoraggiamento.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel indica una possibilità remota
    gloss: 'Daniel dice: Grazie. Potrei chiedere anche a Leila di unirsi al team.'
    note: '*might* mostra una debole possibilità.'
