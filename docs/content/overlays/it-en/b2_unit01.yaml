course:
  title: Inglese B2
  description: Impara l'inglese a livello B2 per conversazioni sfumate, argomentazioni, ipotesi e discussioni professionali, con spiegazioni in italiano colloquiale.
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: Tesi, prove e confutazione
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 'Lettura: difendere un orario ibrido'
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: tesi, affermazione
    note: '*claim* è la tesi che sostieni. Qui non significa reclamo né richiesta di risarcimento.'
    example_gloss: La sua tesi è che il piano debba andare avanti.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: prova, prove a sostegno
    note: '*evidence* sono i fatti, i dati o gli esempi con cui sostieni la tua tesi.'
    example_gloss: Questo esempio fornisce a Mia una prova a sostegno della sua tesi.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: controargomento
    note: '*counterargument* è un punto che va contro la tua tesi. In inglese si scrive come una parola sola.'
    example_gloss: Daniel solleva un controargomento.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: confutare
    note: '*rebut* significa rispondere a un controargomento senza rinunciare alla propria tesi.'
    example_gloss: Mia confuta l'obiezione con delle prove.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: ammettere, riconoscere
    note: '*concede* significa riconoscere che una parte dell''altro punto è ragionevole. Non equivale a rinunciare a tutta la tua tesi.'
    example_gloss: Puoi riconoscere un'obiezione senza rinunciare alla tua tesi principale.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: pesare più di, prevalere su
    note: '*outweigh* si usa quando un vantaggio, un rischio o una ragione è più importante di qualcos''altro.'
    example_gloss: Prove solide possono pesare più di un'obiezione.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Riconoscere il rischio e mantenere la tua tesi
    gloss: Concordo sul fatto che il piano comporti dei rischi, ma le prove continuano a sostenere l'idea di andare avanti.
    note: '*I agree..., but...* riconosce prima l''altro punto. Poi *but the evidence still supports...* mostra che la tua tesi resta in piedi.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Indicare la tua ragione più forte
    gloss: La ragione più forte è che i risultati del sondaggio erano coerenti.
    note: '*The strongest reason is that...* introduce la tua motivazione principale. Dopo *that* l''ordine inglese è: soggetto prima del verbo.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Riconoscere un'obiezione fondata
    gloss: È un'obiezione fondata; tuttavia, i dati indicano la direzione opposta.
    note: '*That is a fair concern; however,...* suona professionale: riconosci l''obiezione, ma la confuti con i dati.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Difendere una tesi
    gloss: Enuncia la tua tesi, fornisci le prove, riconosci il punto contrario più forte e confutalo. Frasi come That is a fair concern e However ti fanno sembrare ragionevole senza rinunciare alla tua tesi.
    note: 'Mantieni l''ordine normale dell''inglese: soggetto, verbo, poi il resto della frase: *the data points in the other direction*, non *the data in the other direction points*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: capacità di trattenere i dipendenti
    note: Qui *retention* significa che i dipendenti restano invece di andarsene.
    example_gloss: Una migliore capacità di trattenere i dipendenti significa che meno persone lasciano il team.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: collaborazione
    note: '*collaboration* è lavorare insieme a un compito o a un progetto. Non ha la connotazione negativa e storica di "collaborazionismo".'
    example_gloss: Una buona collaborazione aiuta un team a portare a termine il lavoro.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Testo di lettura: difendere un orario ibrido'
    gloss: 'Mia sostiene che l''azienda dovrebbe mantenere l''orario ibrido il prossimo trimestre. La sua tesi principale è che il lavoro ibrido migliora la capacità di trattenere i dipendenti senza abbassare le prestazioni. La prova più solida è il sondaggio tra il personale: i dipendenti dei team ibridi dicevano meno spesso di cercare un altro lavoro. Il controargomento più forte è che la collaborazione potrebbe risentirne se le persone non sono in ufficio tutti i giorni. Mia riconosce questa preoccupazione, ma la confuta con i dati dei progetti: i team ibridi hanno consegnato in tempo e i loro punteggi di valutazione erano leggermente più alti. Per questo motivo conclude che i vantaggi pesano più dei rischi.'
    note: 'Il testo costruisce un''argomentazione completa: tesi, prove, controargomento, confutazione e conclusione.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Mia espone la sua tesi
    gloss: 'Mia dice: Penso che dovremmo mantenere l''orario ibrido per il prossimo trimestre.'
    note: Mia comincia con una tesi chiara e difendibile.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Daniel chiede la ragione
    gloss: 'Daniel dice: Qual è la tua ragione più forte?'
    note: Daniel non chiede un'opinione in generale, ma la motivazione principale.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Mia porta una prova
    gloss: 'Mia dice: La ragione più forte è la capacità di trattenere i dipendenti. Nel sondaggio tra il personale, chi lavorava in modalità ibrida diceva meno spesso di cercare un altro lavoro.'
    note: Mia usa i risultati del sondaggio come prova, non solo una sensazione.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Daniel espone il controargomento
    gloss: 'Daniel dice: Alcuni manager sostengono che la collaborazione sia più debole quando le persone non sono in ufficio tutti i giorni.'
    note: Questo è il controargomento a cui Mia dovrà rispondere tra poco.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Mia confuta con i dati
    gloss: 'Mia dice: È un''obiezione fondata. Tuttavia, i dati dei progetti non la confermano. I team ibridi hanno consegnato il lavoro in tempo e i loro punteggi di valutazione erano leggermente più alti.'
    note: '*does not support it* usa *does* perché nella forma negativa l''inglese richiede l''ausiliare do.'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Daniel riassume la posizione
    gloss: 'Daniel dice: Quindi la tua posizione è che i vantaggi pesano più dei rischi?'
    note: '*outweigh* esprime il confronto tra vantaggi e rischi.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Mia chiude con una soluzione
    gloss: 'Mia dice: Esatto. Dobbiamo migliorare le routine delle riunioni, non abolire l''orario.'
    note: Mia difende il piano, ma propone anche un miglioramento pratico.
