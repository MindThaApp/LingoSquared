  en.a1.unit68.lesson03.teach.dialogue_line1:
    title: Leila chiede l'ombrello
    gloss: 'Leila dice: Ciao Mia. Posso prendere in prestito il tuo ombrello?'
    note: '*Can I borrow your umbrella?* è la richiesta.'
  en.a1.unit68.lesson03.teach.dialogue_line2:
    title: Mia presta l'ombrello
    gloss: 'Mia dice: Sì, posso prestartelo.'
    note: '*lend it to you* dice che Mia lo presta.'
  en.a1.unit68.lesson03.teach.dialogue_line3:
    title: Leila ringrazia Mia
    gloss: 'Leila dice: Grazie. Oggi piove.'
    note: '*It is raining today* spiega perché le serve l''ombrello.'
  en.a1.unit68.lesson03.teach.dialogue_line4:
    title: Mia chiede di restituirlo
    gloss: 'Mia dice: Per favore, restituiscilo domani.'
    note: '*tomorrow* dice quando va restituito l''ombrello.'
  en.a1.unit68.lesson03.teach.dialogue_line5:
    title: Leila chiede del caricabatterie
    gloss: 'Leila dice: Certo. Ti serve un caricabatterie?'
    note: '*Of course* significa certo, naturalmente.'
  en.a1.unit68.lesson03.teach.dialogue_line6:
    title: Mia vuole farsi prestare un caricabatterie
    gloss: 'Mia dice: Sì, mi presti un caricabatterie?'
    note: '*Can you lend me...?* chiede di farsi prestare qualcosa.'
  en.a1.unit68.lesson03.teach.dialogue_line7:
    title: Leila ne presta uno
    gloss: 'Leila dice: Certo. Posso prestartene uno.'
    note: '*one* si riferisce a un caricabatterie.'
  en.a1.unit68.lesson04.teach.borrowing_note:
    title: Biglietto sul prestito
    gloss: 'Biglietto sul prestito: oggi Leila ha l''ombrello di Mia. Da restituire domani. Mia ha il caricabatterie di Leila.'
    note: Il biglietto dice chi ha quale oggetto e quando va restituito l'ombrello.
  en.a1.unit68.lesson04.teach.reading_passage:
    title: 'Testo: amici che condividono'
    gloss: 'Amici che condividono: Pioveva, così Leila ha chiesto un ombrello a Mia. Mia ha detto che poteva prestarglielo. Mia ha chiesto a Leila di restituirlo il giorno dopo. Poi a Mia serviva un caricabatterie. Leila ha prestato un caricabatterie a Mia. Le due amiche hanno scritto un breve biglietto per ricordarsi che cosa restituire.'
    note: '*lent* è il passato di *lend*.'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
    title: I borrowed your umbrella.
    gloss: Ho preso in prestito il tuo ombrello.
    note: '*borrowed* è il passato di *borrow*.'
  en.a1.unit68.lesson04.teach.will_return_tomorrow:
    title: I will return it tomorrow.
    gloss: Lo restituirò domani.
    note: '*will* + verbo descrive qualcosa che farai in futuro.'
