teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: lamentarsi, presentare un reclamo
    note: '*complain* significa dire formalmente che qualcosa non va o non è soddisfacente.'
    example_gloss: Mia ha deciso di presentare un reclamo per la sedia danneggiata.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: danneggiato
    note: '*damaged* descrive un prodotto rotto o danneggiato.'
    example_gloss: La sedia è arrivata danneggiata.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: rimborso
    note: '*refund* indica il denaro restituito per un prodotto reso o difettoso.'
    example_gloss: Mia ha chiesto un rimborso.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: sostituzione, articolo sostitutivo
    note: '*replacement* indica un nuovo articolo al posto di uno difettoso.'
    example_gloss: L'azienda ha offerto invece una sostituzione.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: risolvere, chiarire
    note: '*resolve* significa risolvere completamente un problema.'
    example_gloss: L'addetto ha promesso di risolvere rapidamente il problema.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: problema, questione
    note: '*issue* indica un problema di cui bisogna occuparsi.'
    example_gloss: Mia ha spiegato il problema in modo chiaro.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + Nomen
    gloss: Le scrivo per presentare un reclamo su un prodotto danneggiato.
    note: '*I''m writing to complain about* apre con cortesia un reclamo scritto.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + Nomen
    gloss: Vorrei un rimborso per questo articolo.
    note: '*I would like a refund for* chiede con cortesia la restituzione del denaro.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: Der Aufbau einer höflichen Beschwerde
    gloss: 'Un reclamo scritto cortese ha di solito tre parti: nominare il problema (I''m writing to complain about...), dire che cosa è già successo (it arrived damaged / it stopped working) e chiedere una soluzione precisa (I would like a refund / I would like a replacement).'
    note: 'Forma: nominare il problema, dire che cosa è successo, chiedere una soluzione precisa.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: sedia da ufficio
    note: '*desk chair* indica una sedia su cui ci si siede a una scrivania.'
    example_gloss: Mia ha ordinato una nuova sedia da ufficio per il suo ufficio a casa.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: il prima possibile
    note: '*as soon as possible* significa senza ritardi inutili.'
    example_gloss: Mia ha chiesto di avere una sostituzione il prima possibile.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Beschwerde über einen Bürostuhl'
    gloss: Gentile team GreenDesk, Le scrivo per presentare un reclamo su un prodotto danneggiato. La settimana scorsa ho ordinato una sedia da ufficio per il mio ufficio a casa, ma è arrivata con una ruota rotta. Vorrei una sostituzione il prima possibile. Mi faccia sapere, per favore, come procedere. Grazie, Mia
    note: Una breve e cortese lettera di reclamo.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Mia ruft an, um sich über den Bürostuhl zu beschweren
    gloss: 'Mia dice: Buongiorno, chiamo per presentare un reclamo su una sedia da ufficio che ho ordinato.'
    note: '*I''m calling to complain about* apre con cortesia un reclamo telefonico.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: Der Mitarbeiter fragt nach dem Problem
    gloss: 'L''addetto dice: Mi dispiace. Qual è il problema?'
    note: '*I''m sorry to hear that* è una reazione cortese ed empatica.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Mia beschreibt das Problem
    gloss: 'Mia dice: È arrivata con una ruota rotta, quindi non posso usarla.'
    note: '*it arrived with a broken wheel* spiega che cosa è già successo.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet eine Lösung an
    gloss: 'L''addetto dice: Capisco. Preferisce un rimborso o una sostituzione?'
    note: '*would you like... or...* dà al cliente una scelta.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Mia entscheidet sich für einen Ersatz
    gloss: 'Mia dice: Preferirei una sostituzione, se è possibile.'
    note: '*I would prefer a replacement, if that''s possible* esprime con cortesia una preferenza.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Der Mitarbeiter bestätigt die Lösung
    gloss: 'L''addetto dice: Certamente. Risolveremo la cosa e Le invieremo una sedia nuova entro venerdì.'
    note: '*we''ll resolve this and send... by Friday* è una promessa concreta con una data.'
