teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: alto
    note: '*tall* significa «alto» (per l''altezza di una persona).'
    example_gloss: Mio fratello è alto.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: basso
    note: '*short* qui significa «basso» (per una persona); *short* significa anche «corto», per esempio per i capelli.'
    example_gloss: Mia sorella è bassa.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: capelli
    note: '*hair* significa «capelli». In inglese è un nome non numerabile: *her hair is long*, non *her hairs are long*.'
    example_gloss: Ha i capelli lunghi.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: biondo
    note: '*blond* significa «biondo».'
    example_gloss: I suoi capelli sono biondi.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: riccio
    note: '*curly* significa «riccio».'
    example_gloss: Leila ha i capelli ricci.
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: occhi
    note: '*eyes* significa «occhi» (plurale).'
    example_gloss: Ho gli occhi marroni.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: azzurro, blu
    note: '*blue* significa «azzurro» o «blu».'
    example_gloss: I suoi occhi sono azzurri.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: marrone
    note: '*brown* significa «marrone»; per gli occhi si dice anche «castani».'
    example_gloss: I miei occhi sono marroni.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: verde
    note: '*green* significa «verde».'
    example_gloss: Ha gli occhi verdi.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: occhiali
    note: '*glasses* significa «occhiali». La parola è sempre al plurale; *wears glasses* significa «porta gli occhiali».'
    example_gloss: Mio padre porta gli occhiali.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: Com'è lei?
    note: 'Attenzione alla costruzione: in italiano la domanda «Com''è lei?» non ha nessun ausiliare. In inglese con un verbo normale (*look*) la domanda richiede sempre *does* o *do*: *What does she look like?*, mai *What looks she like?*. L''ausiliare *does* (do-support) è la dimenticanza più frequente degli italiani.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: L'inizio di Leila
    gloss: 'Leila dice: Oggi abbiamo una nuova collega. Si chiama Mia.'
    note: '*starting today* significa «a partire da oggi».'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Com''è?'
    note: 'Ancora il do-support: non omettere *does* e non costruire la domanda come in italiano.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: La descrizione di Leila
    gloss: 'Leila dice: È alta e ha i capelli ricci e biondi.'
    note: '*She''s* è la forma contratta di *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: La richiesta di Daniel
    gloss: 'Daniel chiede: Porta gli occhiali?'
    note: 'Anche qui serve l''ausiliare: *Does she wear glasses?*, non *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: La risposta di Leila
    gloss: 'Leila dice: Sì, li porta. Ha anche gli occhi verdi.'
    note: '*Yes, she does* è una breve risposta affermativa in cui si ripete l''ausiliare *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: L'ultima battuta di Daniel
    gloss: 'Daniel dice: Va bene, credo di vederla adesso alla porta.'
    note: '*at the door* significa «alla porta».'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: Testo su Daniel e Leila
    gloss: Daniel e Leila sono buoni amici, ma non si assomigliano. Daniel è alto e ha i capelli corti e neri. Porta gli occhiali. Leila è bassa e ha i capelli lunghi, ricci e castani. Ha gli occhi azzurri, mentre Daniel ha gli occhi marroni. Ridono molto entrambi.
    note: '*don''t look the same* significa «non si assomigliano». Anche qui serve l''ausiliare (*don''t* = *do not*), persino nella negazione.'
