teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: esperienza
    note: '*experience* significa esperienza, in particolare esperienza professionale.'
    example_gloss: Ho due anni di esperienza nel marketing.
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: posizione (lavorativa)
    note: '*position* indica il posto o l''incarico in un''azienda.'
    example_gloss: Questa posizione è per un coordinatore o una coordinatrice di marketing.
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: disponibilità
    note: '*availability* indica quando si ha tempo, per esempio per iniziare a lavorare.'
    example_gloss: La selezionatrice mi ha chiesto la mia disponibilità.
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: punto di forza
    note: '*strength* indica qualcosa che si sa fare particolarmente bene.'
    example_gloss: Uno dei miei punti di forza è essere organizzato.
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: requisito
    note: '*requirement* indica qualcosa che viene richiesto per il lavoro.'
    example_gloss: Due anni di esperienza professionale sono un requisito per questa posizione.
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: Descrivere la propria esperienza
    gloss: Ho due anni di esperienza nel marketing sui social media.
    note: Con questa frase descrivi la tua esperienza professionale in un colloquio.
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: Indicare un punto di forza
    gloss: Uno dei miei punti di forza è essere organizzato.
    note: '*One of my strengths is...* è il modo abituale di indicare un punto di forza in un colloquio.'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: Indicare la propria disponibilità
    gloss: Posso iniziare lunedì prossimo.
    note: Con *I'm available to start...* dici da quando puoi iniziare.
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: curriculum
    note: '*resume* significa curriculum. La parola si usa soprattutto nell''inglese americano.'
    example_gloss: Porti per favore il Suo curriculum al colloquio.
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: scadenza / termine di consegna
    note: '*deadline* indica il termine entro cui qualcosa deve essere pronto. In italiano si dice «scadenza»; in inglese è una parola comune del mondo del lavoro.'
    example_gloss: Sul lavoro rispetto sempre le scadenze.
  en.a2.unit30.lesson03.teach.posting_text:
    title: Testo dell'annuncio di lavoro
    gloss: 'Bright Path Marketing cerca un coordinatore o una coordinatrice di marketing. Requisiti: due anni di esperienza professionale, buone capacità di scrittura e disponibilità a iniziare subito. Porti per favore il Suo curriculum al colloquio.'
    note: Un annuncio di lavoro formale con requisiti e un'istruzione.
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: Parlare del proprio modo di lavorare
    gloss: Rispetto le scadenze e lavoro bene in squadra.
    note: '*I meet deadlines* e *I work well in a team* sono frasi utili per descrivere il proprio modo di lavorare.'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: La selezionatrice chiede dell'esperienza
    gloss: 'La selezionatrice dice: Grazie per essere venuta oggi. Può parlarmi della Sua esperienza?'
    note: '*Thank you for coming in today* è un''apertura cortese di un colloquio di lavoro.'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Risposta di Mia sull'esperienza
    gloss: 'Mia dice: Ho due anni di esperienza nel marketing sui social media. Inoltre ho gestito una piccola squadra.'
    note: 'La stessa frase sull''esperienza della lezione 2, con un dettaglio in più: ha gestito una squadra.'
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: Chiedere un punto di forza
    gloss: 'La selezionatrice dice: Molto bene. Qual è uno dei Suoi punti di forza?'
    note: La selezionatrice reagisce positivamente e poi fa la domanda successiva.
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Risposta di Mia sul suo punto di forza
    gloss: 'Mia dice: Sono molto organizzata e rispetto le scadenze.'
    note: Mia indica il suo punto di forza (organizzata) e un esempio concreto (rispettare le scadenze).
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: Chiedere se ci sono domande
    gloss: 'La selezionatrice chiede: Ha domande sul ruolo?'
    note: Una domanda fissa alla fine di un colloquio di lavoro.
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Mia fa una domanda sua
    gloss: 'Mia dice: Sì, mi chiedevo come sia una settimana tipo in questa posizione.'
    note: '*I was wondering...* è un modo cortese di fare a propria volta una domanda.'
