course:
  title: Inglese A2
  description: Impara l'inglese a livello A2, per situazioni quotidiane un po' più formali, con spiegazioni dettagliate in italiano.
units:
  en.a2.unit37.video_calls:
    title: Parlare delle videochiamate
lessons:
  en.a2.unit37.lesson01.video_call_vocabulary:
    title: Videocamera, microfono e connessione
  en.a2.unit37.lesson02.describing_your_video_calls:
    title: Raccontare le proprie videochiamate e dire che cosa si preferisce
  en.a2.unit37.lesson03.reading_about_video_calls:
    title: Leggere come un'altra persona usa le videochiamate
  en.a2.unit37.lesson04.video_calls_dialogue:
