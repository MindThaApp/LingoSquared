teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: videochiamata
    note: '*video call* è una conversazione in cui ci si può anche vedere. In italiano si dice anche videoconferenza o videochat.'
    example_gloss: Ogni lunedì ho una videochiamata con il mio team.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: videocamera
    note: '*camera* è il dispositivo che trasmette la tua immagine.'
    example_gloss: Accendi la videocamera prima che la riunione cominci.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: microfono
    note: '*microphone* è il dispositivo che trasmette la tua voce.'
    example_gloss: Il mio microfono era spento, perciò gli altri non mi hanno sentito.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: connessione
    note: '*connection* è il collegamento tra il tuo computer e internet.'
    example_gloss: La connessione era scarsa, perciò il video si è bloccato.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: disattivare l'audio
    note: '*mute* significa spegnere il proprio audio per non farsi sentire dagli altri.'
    example_gloss: Disattivo il microfono quando non sto parlando.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: di persona / faccia a faccia
    note: '*face to face* significa che si è nella stessa stanza e non si parla attraverso uno schermo.'
    example_gloss: Alcune riunioni sono meglio di persona che online.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Confrontare con faster than e less ... than
    gloss: Una videochiamata è più veloce di una visita. Una videochiamata è meno personale di un incontro di persona.
    note: Con gli aggettivi brevi si aggiunge *-er* e dopo si mette *than* (*faster than*). Con gli aggettivi più lunghi si usa *less ... than* o *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Dire quanto spesso si fanno videochiamate
    gloss: Ogni lunedì ho una videochiamata con il mio team.
    note: '*every Monday* significa ogni lunedì e descrive un''abitudine fissa.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Chiedere a qualcuno di accendere la fotocamera
    gloss: Puoi accendere la videocamera?
    note: '*turn on* significa accendere, il contrario è *turn off* (spegnere).'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Dire che qualcuno era in muto
    gloss: Scusa, avevi il microfono disattivato.
    note: '*you were on mute* è l''espressione fissa che si usa quando qualcuno non si sentiva perché il suo microfono era disattivato.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Dire la propria opinione con una preferenza
    gloss: Penso che le videochiamate siano utili, ma preferisco incontrare le persone di persona.
    note: Con *I think ... but I prefer ...* dici prima la tua opinione e poi che cosa preferisci.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: Preferisco le videochiamate alle telefonate. Preferisco gli incontri di persona alle videochiamate.
    note: 'Dopo *prefer* in inglese si usa *to*, non *than*: *I prefer video calls to phone calls*. Come in italiano «preferisco A a B», non si usa «che» né «di».'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: cuffie
    note: '*headphones* in inglese è sempre al plurale, anche se usi un solo paio.'
    example_gloss: Uso le cuffie perché la mia famiglia non senta la riunione.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Il messaggio di Leila
    gloss: I miei corsi online ora sono tutti videochiamate. Accendo la videocamera, ma tengo il microfono disattivato finché l'insegnante non fa una domanda. Uso le cuffie perché con quelle la mia connessione è migliore. Penso che le videochiamate facciano risparmiare molto tempo, ma preferisco comunque incontrare i miei compagni di corso di persona.
    note: Un messaggio informale di Leila sui suoi corsi online.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Dire quando si disattiva il microfono
    gloss: Tengo il microfono disattivato finché l'insegnante non fa una domanda.
    note: '*until* significa «finché»: qualcosa dura fino a un certo momento.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila chiede del lavoro di Daniel
    gloss: 'Leila chiede: Fai molte videochiamate al lavoro?'
    note: '*a lot of* significa molto e va bene sia con i nomi numerabili sia con quelli non numerabili.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel parla del suo appuntamento fisso
    gloss: 'Daniel dice: Sì, ogni lunedì ho una videochiamata con il mio team.'
    note: La stessa frase della lezione 2.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila chiede della fotocamera
    gloss: 'Leila chiede: Accendi la videocamera?'
    note: Una breve domanda di approfondimento per saperne di più.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: L'abitudine di Daniel nelle videochiamate
    gloss: 'Daniel dice: Sempre, ma disattivo il microfono quando non sto parlando.'
    note: '*when I am not speaking* qui significa: nei momenti in cui non sto parlando.'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila parla dei suoi corsi
    gloss: 'Leila dice: I miei corsi online ora sono tutti videochiamate.'
    note: Si collega ai suoi corsi del lunedì e del mercoledì dell'unità 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel chiede la sua opinione
    gloss: 'Daniel chiede: Che cosa ne pensi?'
    note: '*What do you think about them?* chiede l''opinione su qualcosa che è appena stato nominato.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila dice la sua opinione
    gloss: 'Leila dice: Penso che le videochiamate siano utili, ma preferisco incontrare le persone di persona.'
    note: La stessa opinione della lezione 2.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel è d'accordo con lei
    gloss: 'Daniel dice: Sono d''accordo. Una videochiamata è più veloce di una visita, ma è meno personale.'
    note: Con *I agree* esprimi consenso. Poi di solito si dice il proprio motivo.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila conferma
    gloss: 'Leila dice: Esatto.'
    note: '*Exactly* è un modo breve di dire che sei completamente d''accordo.'
