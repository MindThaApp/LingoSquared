teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: responsabile di
    note: '*responsible for* significa che è tuo compito occuparti di qualcosa.'
    example_gloss: Sono responsabile del rapporto mensile.
  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: aggiornamento, informazioni aggiornate
    note: '*update* indica nuove informazioni su come procede qualcosa.'
    example_gloss: Do un aggiornamento al mio team ogni settimana.
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: scadenza, termine
    note: '*deadline* indica il termine entro cui qualcosa deve essere pronto.'
    example_gloss: La scadenza del rapporto è venerdì.
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: rapporto, relazione
    note: '*report* indica un documento scritto sul lavoro o sui risultati.'
    example_gloss: Scrivo ogni mese un rapporto sulle vendite.
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: nei tempi previsti
    note: '*on schedule* significa che qualcosa procede come pianificato e non è in ritardo.'
    example_gloss: Il progetto è nei tempi previsti.
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: in ritardo sul programma
    note: '*behind schedule* significa che qualcosa procede più lentamente del previsto.'
    example_gloss: Questa settimana siamo un po' in ritardo sul programma.
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: Eine Zuständigkeit nennen
    gloss: Sono responsabile del rapporto mensile.
    note: '*I''m responsible for...* è un modo diretto di descrivere un compito sul lavoro.'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: Sagen, dass etwas im Zeitplan liegt
    gloss: Il progetto è nei tempi previsti.
    note: '*on schedule* significa che non ci sono ritardi.'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: Eine Statusmeldung geben
    gloss: Sono un po' in ritardo sul programma, ma finirò entro venerdì.
    note: '*I''m a little behind schedule, but I''ll finish by...* è un modo onesto di segnalare un ritardo e di indicare una data precisa.'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: Statusmeldungen geben
    gloss: Sono responsabile del rapporto. Il progetto è nei tempi previsti. Sono in ritardo sul programma.
    note: Queste tre frasi sono formule standard per parlare di competenze e di avanzamento sul lavoro.
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: team, squadra
    note: '*team* indica un gruppo di persone che lavorano insieme.'
    example_gloss: Ogni settimana dà al suo team un breve aggiornamento.
  en.b1.unit05.lesson03.teach.technical_problem:
    title: technical problem
    gloss: problema tecnico
    note: '*technical problem* indica un problema con apparecchi o software.'
    example_gloss: È in ritardo sul programma a causa di un problema tecnico.
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Wochenbericht'
    gloss: Daniel è responsabile del rapporto mensile sulle vendite. Ogni settimana dà al suo team un breve aggiornamento. Questa settimana è un po' in ritardo sul programma a causa di un problema tecnico, ma pensa di finire entro venerdì. Dice sempre al suo team la verità sui ritardi.
    note: Un breve testo di lettura su come Daniel parla onestamente di un ritardo.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel bittet Mia um Hilfe
    gloss: 'Daniel dice: Mia, potresti aiutarmi a rivedere questo rapporto prima che lo invii?'
    note: '*could you help me...* è un modo cortese di chiedere aiuto a un collega.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia sagt zu
    gloss: 'Mia dice: Certo. Di che cosa hai bisogno?'
    note: '*of course* è un modo cordiale e diretto di dire di sì.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel erklärt, was er braucht
    gloss: 'Daniel dice: Voglio assicurarmi che i numeri siano corretti.'
    note: '*make sure* significa controllare che qualcosa sia esatto.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia verspricht, es durchzusehen
    gloss: 'Mia dice: Nessun problema. Lo controllo questo pomeriggio e ti mando le mie note.'
    note: '*I''ll check it this afternoon* è una promessa concreta con indicazione di tempo.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel dice: Grazie, lo apprezzo davvero.'
    note: '*I really appreciate it* è un modo sincero di esprimere gratitudine.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia bietet weitere Hilfe an
    gloss: 'Mia dice: Prego. Fammi sapere se hai bisogno di altro.'
    note: '*let me know if...* lascia la porta aperta per altro aiuto.'
