teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: rimpianto, rammarico
    note: '*regret* indica un sentimento di tristezza per qualcosa che si è fatto o non si è fatto.'
    example_gloss: Daniel ha provato rammarico per aver mancato la scadenza.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: desiderio
    note: '*wish* significa desiderare che qualcosa fosse andato diversamente da come è andato davvero.'
    example_gloss: Daniel aveva un desiderio riguardo alla settimana passata.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: errore
    note: '*mistake* indica qualcosa che si è fatto in modo sbagliato per una valutazione errata.'
    example_gloss: Aspettare così a lungo prima di chiedere aiuto è stato un errore.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: con il senno di poi
    note: '*hindsight* indica la comprensione di un evento che si ha solo a posteriori.'
    example_gloss: Con il senno di poi, Daniel avrebbe dovuto parlare prima.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: rimandare, procrastinare
    note: '*procrastinate* significa rimandare qualcosa che si dovrebbe fare.'
    example_gloss: Daniel tende a rimandare quando un compito gli sembra difficile.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: ritardo
    note: '*delay* indica un periodo per cui qualcosa arriva più tardi del previsto.'
    example_gloss: Il ritardo ha fatto sì che Daniel mancasse la sua prima scadenza.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + Partizip
    gloss: Vorrei aver chiesto aiuto prima.
    note: '*I wish I had asked* esprime un desiderio su qualcosa che nel passato non è accaduto. In italiano: «vorrei aver chiesto», «magari avessi chiesto».'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + Partizip
    gloss: Avrei dovuto parlare prima con il mio responsabile.
    note: '*I should have talked* dice quale sarebbe stata a posteriori l''azione giusta.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + Partizip, I would have + Partizip
    gloss: Se avessi chiesto aiuto a Mia nella prima settimana, avrei finito in tempo.
    note: '*if I had asked..., I would have finished...* descrive una conseguenza irreale nel passato.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: Formen, um Bedauern über die Vergangenheit auszudrücken
    gloss: Per esprimere rammarico sul passato si usa wish + past perfect (I wish I had asked...), should have + participio (I should have talked...) oppure if + past perfect con would have + participio (If I had asked..., I would have finished...). Tutte e tre descrivono ciò che in realtà non è accaduto.
    note: 'Forma: scegli tra wish + had, should have o if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: guardando indietro
    note: '*looking back* introduce una riflessione sul passato.'
    example_gloss: Guardando indietro, Daniel vorrebbe aver chiesto aiuto prima.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: scadenza mancata
    note: '*missed deadline* indica un termine che non è stato rispettato.'
    example_gloss: Daniel ha mancato una scadenza prima di chiedere aiuto.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'Lesetext: Rückblick auf einen anstrengenden Monat'
    gloss: Ciao Leila, guardando indietro, vorrei aver chiesto aiuto prima. Avrei dovuto parlare prima con il mio responsabile del carico di lavoro. Quando l'ho fatto, avevo già mancato una scadenza. Se avessi chiesto aiuto a Mia nella prima settimana, avrei concluso entrambi i progetti in tempo. È stato un errore aspettare così a lungo. Daniel
    note: Un breve messaggio riflessivo.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel beginnt mit einer Reflexion
    gloss: 'Daniel dice: Guardando indietro, vorrei aver chiesto aiuto prima.'
    note: '*looking back* apre una conversazione riflessiva.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila fragt nach
    gloss: 'Leila dice: Che cosa è successo?'
    note: Una breve domanda aperta per saperne di più.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel erklärt, was er hätte tun sollen
    gloss: 'Daniel dice: Avrei dovuto parlare prima con il mio responsabile del carico di lavoro. Quando l''ho fatto, avevo già mancato una scadenza.'
    note: '*should have talked* e *had already missed* collegano il rammarico a una conseguenza concreta.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila beruhigt Daniel
    gloss: 'Leila dice: Non preoccuparti. Alla fine l''hai risolto.'
    note: '*Don''t worry* rassicura chi si sente in colpa.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel beschreibt, was anders hätte sein können
    gloss: 'Daniel dice: È vero. Se avessi chiesto aiuto a Mia nella prima settimana, avrei concluso entrambi i progetti in tempo.'
    note: '*if I had asked..., I would have finished...* descrive una conseguenza irreale nel passato.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila schließt aufmunternd ab
    gloss: 'Leila dice: Beh, ora lo sai per la prossima volta.'
    note: Una chiusura breve e positiva della conversazione.
