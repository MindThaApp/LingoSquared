teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: telefono
    note: '*phone* significa «telefono». Nella vita quotidiana *phone* di solito indica il cellulare.'
    example_gloss: Il mio telefono è qui.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: chiamare / chiamata
    note: '*call* può essere una telefonata o significare «chiamare»: *a call* (nome), *to call* (verbo).'
    example_gloss: Posso chiamarti.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: messaggio
    note: '*message* significa «messaggio».'
    example_gloss: Lascia un messaggio.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: segreteria telefonica, messaggio vocale
    note: '*voicemail* indica un messaggio vocale registrato (la segreteria telefonica).'
    example_gloss: Il messaggio vocale è breve.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: ripetere
    note: '*repeat* significa dire di nuovo.'
    example_gloss: Per favore, ripeta.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: lentamente
    note: '*slowly* significa «lentamente». È un avverbio in *-ly* e corrisponde all''italiano «-mente»: *slow* → *slowly*, «lento» → «lentamente».'
    example_gloss: Per favore, parli lentamente.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Pronto, sono Leila.
    note: Al telefono in inglese si dice *this is...* per dire chi chiama. *My name is...* al telefono suona strano.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: Posso parlare con Mia?
    note: '*speak to* significa «parlare con». L''italiano «con» qui diventa *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Per favore, ripeta.
    note: '*Please repeat that* è una richiesta cortese di ripetere.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Per favore, parli lentamente.
    note: '*slowly* qui sta dopo il verbo *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Lasci un messaggio.
    note: '*leave a message* è l''espressione fissa per «lasciare un messaggio».'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Richiamo più tardi.
    note: '*call back* significa «richiamare». La particella *back* sta dopo il verbo, mentre in italiano il «ri-» di «richiamare» sta davanti.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Mia risponde
    gloss: 'Mia dice: Pronto, sono Mia.'
    note: '*this is Mia* suona naturale al telefono.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Leila dice chi chiama
    gloss: 'Leila dice: Ciao Mia, sono Leila.'
    note: Usa *this is* per presentarti al telefono.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Leila sente male
    gloss: 'Leila dice: Non ti sento bene.'
    note: '*can''t hear you well* significa «non riesco a sentirti bene».'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Leila chiede di parlare lentamente
    gloss: 'Leila dice: Per favore, parla lentamente.'
    note: '*Please speak slowly* è una richiesta cortese.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Mia dice l'ora
    gloss: 'Mia dice: Certo. La riunione è alle quattro.'
    note: '*at four* usa *at* per un''ora.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Leila chiede di ripetere
    gloss: 'Leila dice: Per favore, ripeti.'
    note: '*repeat that* si riferisce a quello che è appena stato detto.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: 'Mia ripete: le quattro'
    gloss: 'Mia dice: Le quattro.'
    note: '*Four o''clock* è un''ora piena.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Leila richiama più tardi
    gloss: 'Leila dice: Grazie. Richiamo più tardi.'
    note: '*I''ll* è la forma contratta di *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: Messaggio telefonico
    gloss: 'Messaggio telefonico: Mia ha chiamato alle 3:00. Riunione nella stanza 5. Per favore, richiamare.'
    note: Il messaggio indica chi ha chiamato, l'ora, la stanza e che cosa fare.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'Testo: una breve telefonata'
    gloss: 'Una breve telefonata: Mia ha chiamato Leila nel pomeriggio. L''audio non era chiaro, quindi Leila ha chiesto a Mia di parlare lentamente. Mia ha detto che la riunione era alle quattro nella stanza 5. Leila ha chiesto a Mia di ripetere l''ora. Più tardi Leila ha scritto un messaggio telefonico. Nel messaggio c''era scritto che Mia aveva chiamato alle 3:00 e chiedeva di essere richiamata.'
    note: '*called* è il passato di *call*.'
