    title: Send the police, please.
    gloss: Mandate la polizia, per favore.
    note: '*Send the police, please.* significa mandate la polizia, per favore.'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Mandate un'ambulanza, per favore.
    note: '*Send an ambulance, please.* significa mandate un''ambulanza, per favore.'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: C'è un incendio!
    note: '*There''s a fire!* significa c''è un incendio!'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: Qual è la sua emergenza?
    note: È la domanda standard di un centralino d'emergenza americano non appena chiami il 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila sente odore di fumo
    gloss: 'Leila chiede: Daniel, sta bruciando qualcosa? Sento odore di fumo!'
    note: '*smell* + nome, senza preposizione: I smell smoke = sento odore di fumo. Attenzione: *I smell of smoke* significa un''altra cosa (puzzo di fumo).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: La spiegazione di Daniel
    gloss: 'Daniel dice: Oh no, la padella ha preso fuoco! Stavo preparando la cena.'
    note: '*caught fire* è un''espressione fissa per indicare che qualcosa si incendia all''improvviso.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Le istruzioni di Leila
    gloss: 'Leila dice: Mantieni la calma. Spegni i fornelli! Chiamo aiuto.'
    note: '*call for help* significa chiamare aiuto. Non dimenticare la parola *for* in questa espressione.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: L'avvertimento di Daniel
    gloss: 'Daniel dice: Sbrigati, il fuoco sta diventando più grande!'
    note: '*getting bigger* significa diventare più grande: get + aggettivo indica un cambiamento.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila chiama il numero d'emergenza
    gloss: 'Leila dice: Salve, questa è un''emergenza. C''è un incendio nella cucina di un mio amico. Mandate i vigili del fuoco, per favore.'
    note: 'Così suona una chiamata al centralino d''emergenza negli Stati Uniti: lì si chiama il 911, non il 112.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Il sollievo di Daniel
    gloss: 'Daniel dice: Grazie al cielo. Penso che ormai sia spento, ma aspettiamo fuori per sicurezza.'
    note: '*just in case* significa per sicurezza, nel caso in cui.'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Il consiglio di Leila
    gloss: 'Leila dice: Buona idea. È più sicuro aspettare fuori finché non arrivano.'
    note: '*safer* è il comparativo di *safe*: si forma aggiungendo *-er* (sicuro -> più sicuro).'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Testo sulle misure di emergenza
    gloss: 'In caso di incendio: Per prima cosa, mantieni la calma. Poi esci subito dall''edificio. Non usare l''ascensore; usa le scale. Terzo, una volta fuori, chiama il 911 e di'' il tuo indirizzo. Infine, aspetta fuori finché non arrivano i vigili del fuoco. Dopo l''incendio in cucina di Daniel, lui e Leila hanno aspettato fuori, proprio come diceva l''avviso. I vigili del fuoco sono arrivati in fretta e si sono assicurati che fosse tutto in sicurezza. Più tardi Mia è passata per vedere come stavano ed era sollevata che nessuno si fosse fatto male.'
    note: '*elevator* è la parola americana per ascensore. In inglese britannico si dice *lift*.'
