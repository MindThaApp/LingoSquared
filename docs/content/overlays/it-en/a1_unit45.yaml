  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: Chiama il 911!
    note: 'Negli Stati Uniti in caso di emergenza si chiama il *911*, non il *112* come in Italia: è una differenza importante da ricordare.'
  en.a1.unit45.lesson02.teach.i_need_help:
