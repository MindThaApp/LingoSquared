teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: sebbene, benché
    note: '*although* introduce con una frase completa un contrasto nella stessa frase.'
    example_gloss: Sebbene l'ufficio sia tranquillo, Mia preferisce lavorare da casa.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: anche se, sebbene
    note: '*even though* sottolinea il contrasto più di *although*.'
    example_gloss: Leila resta concentrata anche se il suo appartamento è piccolo.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: nonostante
    note: Dopo *despite* c'è un nome o una forma in -ing, non una frase completa.
    example_gloss: Nonostante le distrazioni, Daniel finisce il suo rapporto in tempo.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: tuttavia, però
    note: '*however* inizia una nuova frase dopo un punto o un punto e virgola.'
    example_gloss: L'ufficio è tranquillo. Tuttavia Mia preferisce lavorare da casa.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: punto valido, buon argomento
    note: '*valid point* indica un argomento ragionevole o convincente.'
    example_gloss: Questo è un punto valido per quanto riguarda la concentrazione.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: convincere
    note: '*convince* significa far cambiare idea a qualcuno.'
    example_gloss: Leila ha cercato di convincere Mia a tornare in ufficio.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + vollständiger Nebensatz
    gloss: Sebbene l'ufficio sia tranquillo, Mia preferisce lavorare da casa.
    note: '*although* + soggetto + verbo forma una frase subordinata completa di contrasto.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + Nomen
    gloss: Nonostante le distrazioni, Daniel finisce il suo rapporto in tempo.
    note: Dopo *despite* segue un nome, non una frase completa.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite und however
    gloss: 'Although e even though introducono una frase completa: Although the office is quiet, Mia prefers home. Despite è seguito da un nome o da una forma in -ing, non da una frase: Despite the distractions, Daniel finishes his report. However inizia una nuova frase dopo un punto o un punto e virgola: The office is quiet. However, Mia prefers home.'
    note: 'Forma: *although/even though* + frase; *despite* + nome/forma in -ing; *however* come avverbio di frase dopo un punto. In italiano «sebbene/benché» vogliono il congiuntivo, mentre l''inglese usa l''indicativo.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: flessibilità
    note: '*flexibility* indica la capacità di cambiare facilmente i piani o il modo di lavorare.'
    example_gloss: Mia e Leila sono entrambe d'accordo che la flessibilità è importante.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: lavoro di squadra
    note: '*teamwork* significa lavorare insieme come squadra.'
    example_gloss: Leila pensa che l'ufficio favorisca un migliore lavoro di squadra.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lesetext: wo man arbeitet'
    gloss: Mia e Leila non sono d'accordo su dove lavorare. Mia lavora da casa perché è comodo. Sebbene senta la mancanza di vedere i colleghi, a casa conclude di più. Leila preferisce l'ufficio. Nonostante il rumore, le piace parlare con i colleghi durante le pause. Anche se Mia fa un punto valido sulla concentrazione, Leila pensa comunque che l'ufficio favorisca un migliore lavoro di squadra. Tuttavia entrambe concordano sul fatto che la flessibilità sia importante.
    note: Un breve testo di lettura con dei contrasti.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia führt den Gegensatz ein
    gloss: 'Mia dice: Leila, sebbene l''ufficio sia bello, a casa concludo di più.'
    note: '*although* + frase completa all''inizio della frase.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila nennt ihre Sicht
    gloss: 'Leila dice: Capisco, ma nonostante il rumore mi piace molto parlare con le persone durante le pause.'
    note: '*despite* + nome (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung
    gloss: 'Mia dice: È un punto valido. Tuttavia penso ancora di concentrarmi meglio da sola.'
    note: '*however* qui inizia una nuova frase dopo un punto.'
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila zieht Mia auf
    gloss: 'Leila dice: Anche se preferisco l''ufficio, non riesco a convincerti a cambiare idea, vero?'
    note: '*even though* sottolinea il contrasto.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia findet einen Kompromiss
    gloss: 'Mia dice: Probabilmente no! Tuttavia possiamo concordare che la flessibilità conta più di tutto.'
    note: '*however* collega due pensieri opposti in una nuova frase.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila beendet das Gespräch positiv
    gloss: 'Leila dice: Nonostante le nostre preferenze diverse, finiamo tutto in tempo.'
    note: '*despite* + nome (*our different preferences*).'
