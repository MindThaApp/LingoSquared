teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: lezione
    note: '*class* significa lezione (un incontro in cui si impara qualcosa).'
    example_gloss: Ho lezione ogni martedì sera.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: corso
    note: '*course* significa corso (una serie di lezioni su un unico argomento).'
    example_gloss: Quest'anno segue un corso di informatica.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: studente / allievo
    note: '*student* significa studente o allievo: una persona che impara a scuola o a lezione.'
    example_gloss: Lei è studentessa al community college.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: compiti
    note: '*homework* significa compiti (da fare a casa).'
    example_gloss: Faccio i compiti dopo cena.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: materia
    note: '*subject* significa materia (un argomento che si studia).'
    example_gloss: La matematica è la mia materia preferita.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: verifica
    note: '*test* significa verifica (o test, prova scritta).'
    example_gloss: Venerdì abbiamo una verifica.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: seguire una lezione
    note: '*take a class* è la combinazione fissa inglese per «seguire una lezione». In italiano «seguire» va benissimo, ma in inglese non si dice *follow a class* (suona strano): si usa sempre *take*.'
    example_gloss: Seguo una lezione ogni martedì sera.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: fare i compiti
    note: '*do homework*: il verbo è *do*, non *make*. Qui l''italiano «fare i compiti» corrisponde all''inglese, quindi attenzione a non usare *make*.'
    example_gloss: Lui fa i compiti dopo cena.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: studiare per una verifica
    note: '*study for a test* significa studiare per una verifica. *For* indica qui lo scopo (per che cosa si studia).'
    example_gloss: Studio per una verifica ogni venerdì.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: community college (istituto locale per adulti)
    note: '*community college* è un tipo di istituto americano dove soprattutto gli adulti seguono corsi accanto al lavoro. In italiano non c''è un equivalente preciso, perciò di solito si lascia il termine inglese.'
    example_gloss: Lei studia in un community college.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: di sera
    note: '*in the evening* significa «di sera» o «la sera».'
    example_gloss: La mia lezione è di sera.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: Che cosa studi?
    note: Questa domanda usa il present continuous (*are you studying*) per qualcosa che stai facendo in questo periodo della tua vita, non il presente semplice.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Fai qualcosa oggi dopo il lavoro?'
    note: '*anything* qui significa «qualcosa» o «qualsiasi cosa» e compare in una domanda.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Sì, stasera ho un corso di fotografia.'
    note: '*tonight* significa stasera.'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: La reazione di Daniel
    gloss: 'Daniel dice: Che bello! Dove lo segui?'
    note: '*Where do you take it?*: anche qui *take* si usa per seguire una lezione o un corso, come in *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Al community college in centro. È due volte a settimana.'
    note: '*twice a week*: anche qui *a* significa «a, per».'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: La domanda di Daniel
    gloss: 'Daniel dice: Come va finora?'
    note: '*so far* significa finora.'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Mi piace molto. Sto imparando a usare meglio la mia fotocamera.'
    note: '*I''m learning how to ...*: present continuous per un''abilità che stai sviluppando in questo momento.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: L'ultima battuta di Daniel
    gloss: 'Daniel dice: Che bello! Magari un giorno puoi insegnarlo anche a me.'
    note: '*sometime* significa «un giorno» o «prima o poi»: un''indicazione di tempo vaga nel futuro.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Testo su Daniel, Leila e Mia
    gloss: Daniel, Leila e Mia stanno tutti imparando qualcosa di nuovo oltre al lavoro. Daniel segue un corso di informatica il lunedì sera per imparare nuove competenze per il suo lavoro. Leila studia spagnolo perché un giorno vuole viaggiare in Messico. Mia ha un corso di fotografia due volte a settimana al community college e scatta già foto molto migliori. A volte parlano insieme dei loro corsi a pranzo.
    note: '*takes a computer course*: si usa *take*, non *follow*; è lo stesso errore da evitare di *take a class*.'
