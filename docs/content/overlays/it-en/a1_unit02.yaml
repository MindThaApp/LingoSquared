    title: What's your name?
    gloss: Come ti chiami? / Come si chiama?
    note: '*What''s your name?* in inglese va bene sia in contesti formali sia informali: non c''è la distinzione tra *Lei* e *tu* che c''è in italiano.'
  en.a1.unit02.lesson01.teach.my_name_is:
    title: My name is Leila.
    gloss: Mi chiamo Leila.
    note: La forma standard per dire il proprio nome.
  en.a1.unit02.lesson01.teach.im_leila:
    title: I'm Leila.
    gloss: Sono Leila. / Mi chiamo Leila.
    note: Un'alternativa più breve e altrettanto comune a *My name is Leila*.
  en.a1.unit02.lesson01.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Piacere.
    note: Si dice quando si incontra qualcuno per la prima volta.
  en.a1.unit02.lesson02.teach.i_am_student:
    title: I am a student.
    gloss: Sono uno studente / una studentessa.
    note: 'Davanti a un nome di professione o di ruolo al singolare l''inglese vuole *a*; in italiano invece, dopo «sono», l''articolo spesso non c''è: *I am a student*, non *I am student*.'
  en.a1.unit02.lesson02.teach.are_you_teacher:
    title: Are you a teacher?
    gloss: È un insegnante? / Sei un insegnante?
    note: La forma interrogativa con *Are you...?* va bene in qualsiasi registro.
  en.a1.unit02.lesson02.teach.yes_i_am:
    title: Yes, I am.
    gloss: Sì, lo sono.
    note: Una risposta breve e completa a domande come *Are you a teacher?*
  en.a1.unit02.lesson02.teach.no_im_student:
    title: No, I'm a student.
    gloss: No, sono uno studente / una studentessa.
    note: Una risposta negativa che corregge il proprio ruolo.
  en.a1.unit02.lesson02.teach.are_you_member:
    title: Are you a new member?
    gloss: È un nuovo iscritto? / Sei un nuovo iscritto?
    note: Chiede se si è iscritti, per esempio a una biblioteca o a un'associazione.
  en.a1.unit02.lesson02.teach.he_is_teacher:
    title: He is a teacher.
    gloss: Lui è un insegnante.
    note: Terza persona singolare maschile.
  en.a1.unit02.lesson02.teach.she_is_engineer:
    title: She is an engineer.
    gloss: Lei è un'ingegnera.
    note: 'Terza persona singolare femminile: *an* invece di *a*, perché *engineer* inizia con una vocale.'
  en.a1.unit02.lesson03.teach.library:
    title: library
    gloss: la biblioteca
    note: Un luogo dove si possono prendere in prestito i libri.
    example_gloss: Sono in biblioteca.
  en.a1.unit02.lesson03.teach.library_assistant:
    title: library assistant
    gloss: assistente di biblioteca
    note: Una persona che lavora in una biblioteca.
  en.a1.unit02.lesson03.teach.opening:
    title: Daniel eröffnet das Gespräch
    gloss: 'Daniel dice: Buon pomeriggio. Sono Daniel.'
    note: Un'apertura formale e cordiale.
  en.a1.unit02.lesson03.teach.request:
    title: Daniel fragt nach dem Namen
    gloss: 'Daniel dice: Come si chiama?'
    note: 'Subito dopo la presentazione: Daniel e Leila non si conoscono ancora, perciò la conversazione resta nel registro formale del *Lei*.'
  en.a1.unit02.lesson03.teach.names:
    title: Leila antwortet
    gloss: 'Leila dice: Salve. Sono Leila. Sono una studentessa. Piacere.'
    note: Leila dice il proprio nome, il proprio ruolo e la consueta formula di cortesia.
  en.a1.unit02.lesson03.teach.room_and_member:
    title: Daniel fragt nach der Mitgliedschaft
    gloss: 'Daniel dice: Piacere mio. È una nuova iscritta? Leila dice: Sì, lo sono.'
    note: Daniel ricambia la formula di cortesia e chiede dell'iscrizione, sempre nel registro formale del *Lei*.
  en.a1.unit02.lesson03.teach.role:
    title: Daniel nennt seinen Beruf
    gloss: 'Daniel dice: Sono un ingegnere.'
    note: Davanti a una professione l'inglese vuole *a* o *an* (*I'm an engineer*); in italiano, dopo «sono», l'articolo di solito non si mette.
  en.a1.unit02.lesson03.teach.closing:
    title: Daniel und Leila schließen das Gespräch ab
    gloss: 'Daniel dice: Benvenuta in biblioteca. Leila dice: Grazie.'
    note: Una chiusura cordiale e cortese.
