    example_gloss: Questo dipinto mi piace molto.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: scultura
    note: '*sculpture* significa un''opera d''arte fatta di pietra, legno o metallo.'
    example_gloss: Anche questa scultura è molto antica.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: guida
    note: '*guide* significa una persona che accompagna i visitatori e spiega le cose.'
    example_gloss: Oggi c'è una guida?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: A che ora apre il museo?
    note: Questa domanda inizia con *what time*, seguito dall'ausiliare *does* perché il verbo principale è *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: A che ora chiude il museo?
    note: Stessa struttura di *What time does the museum open?*, ma con *close* al posto di *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Due biglietti, per favore.
    note: '*please* alla fine rende la richiesta cortese, come quando si ordina da mangiare.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: C'è una guida per la mostra?
    note: '*Is there...?* si usa per chiedere se qualcosa è presente; qui, una guida.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: Il museo è aperto tutti i giorni.
    note: '*every day* significa tutti i giorni e sta alla fine della frase.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: Mi sono piaciuti molto i dipinti!
    note: '*enjoyed* è il passato di *enjoy* (godersi, apprezzare), usato per ripensare a qualcosa di bello.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: La domanda di Daniel
    gloss: 'Daniel dice: Ciao! A che ora chiude il museo?'
    note: '*Hi!* è un saluto informale.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: Risponde l'addetto
    gloss: 'L''addetto dice: Chiudiamo alle cinque.'
    note: '*at* + ora indica quando succede qualcosa, come in *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: La richiesta di Mia
    gloss: 'Mia dice: Perfetto. Possiamo avere due biglietti, per favore?'
    note: '*Can we have...?* è un modo cortese di ordinare o chiedere qualcosa.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: Il prezzo
    gloss: 'L''addetto dice: Certo. Sono dodici dollari.'
    note: '*That''s* + cifra si usa per dire un prezzo.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: La domanda di Daniel sulla guida
    gloss: 'Daniel chiede: C''è una guida per la mostra?'
    note: È la stessa struttura con *Is there...?* che hai già visto nelle frasi.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: L'addetto parla della guida
    gloss: 'L''addetto dice: Sì, c''è una guida vicino all''ingresso.'
    note: '*there''s* è la forma contratta di *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia chiede il nome
    gloss: 'Mia chiede: Come si chiama la mostra?'
    note: '*What is ... called?* è il modo abituale per chiedere il nome di qualcosa.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: Il nome della mostra
    gloss: 'L''addetto dice: Si chiama Colors of the City.'
    note: '*It''s called...* è la risposta alla domanda *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: Il saluto finale di Daniel
    gloss: 'Daniel dice: Grazie! Non vedo l''ora di vedere i dipinti.'
    note: '*can''t wait to...* significa essere molto entusiasti di fare qualcosa.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Cartello del museo
    gloss: 'Museo della Città: aperto tutti i giorni, dalle 9:00 alle 17:00. Biglietto adulti: 6 dollari. Mostra in corso: Colors of the City, Sala 2.'
    note: Il cartello indica gli orari, il prezzo e il nome della mostra.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Testo su Daniel e Mia
    gloss: 'Una visita al museo: un sabato pomeriggio Daniel e Mia decisero di visitare insieme il Museo della Città. All''ingresso l''addetto disse loro che il museo chiude alle cinque. Comprarono due biglietti per dodici dollari. Daniel chiese di una guida e l''addetto rispose che ce n''era una vicino all''ingresso. Visitarono la mostra Colors of the City e videro molti bei dipinti nella Sala 2. A Daniel piacque un dipinto della vecchia piazza della città e a Mia piacque un dipinto del fiume al tramonto. Quando uscirono, Mia disse che la prossima volta vuole visitare la mostra di sculture.'
    note: '*decided to visit* usa *to* + infinito dopo *decided*, per dire cosa qualcuno ha deciso di fare.'
