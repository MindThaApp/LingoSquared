teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: aiutare / aiuto
    note: '*help* può essere il verbo «aiutare» o il nome «aiuto». Come in italiano, dopo si mette direttamente il pronome: *help me* («aiutami»), senza *to*.'
    example_gloss: Puoi aiutarmi?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: portare
    note: '*carry* significa tenere qualcosa e portarlo da un posto a un altro.'
    example_gloss: Posso portarlo io.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: pesante
    note: '*heavy* significa «pesante» (di peso).'
    example_gloss: È pesante.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: borsa
    note: '*bag* significa «borsa», anche «sacchetto» o «busta».'
    example_gloss: Questa borsa è pesante.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: porta
    note: '*door* significa «porta».'
    example_gloss: Apri la porta.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: scaffale, mensola
    note: '*shelf* significa «scaffale» o «mensola», per esempio sul muro o nell''armadio. Il plurale è *shelves*.'
    example_gloss: Mettilo sullo scaffale.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: Puoi aiutarmi?
    note: '*Can you...?* è un modo diretto e normale per chiedere aiuto.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Questa borsa è pesante.
    note: Usa *this bag* per la borsa che hai vicino.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: Potresti aprire la porta?
    note: '*Could you...?* suona più cortese di *Can you...?*. Corrisponde al condizionale italiano «Potresti...?».'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Posso aiutare.
    note: Questa frase offre aiuto.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Grazie per il tuo aiuto.
    note: '*Thank you for...* usa *for* per il motivo del ringraziamento, come «grazie per».'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Mettilo sullo scaffale.
    note: '*put it on...* significa mettere o appoggiare qualcosa su qualcos''altro. In inglese qui non si distingue tra «mettere» e «appoggiare»: in entrambi i casi si usa *put*.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Leila chiede aiuto
    gloss: 'Leila dice: Ciao Daniel. Puoi aiutarmi?'
    note: '*Can you help me?* è la frase base per chiedere aiuto.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Daniel chiede di che cosa c'è bisogno
    gloss: 'Daniel dice: Certo. Di che cosa hai bisogno?'
    note: '*Of course* significa «certo».'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: La borsa è pesante
    gloss: 'Leila dice: Questa borsa è pesante.'
    note: '*heavy* spiega perché serve aiuto.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Daniel può portare la borsa
    gloss: 'Daniel dice: Posso portarla io.'
    note: '*carry it* si riferisce alla borsa. In inglese per le cose si dice *it*; non esiste un «la» femminile come in italiano.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Leila chiede di aprire la porta
    gloss: 'Leila dice: Potresti aprire anche la porta?'
    note: '*Could you...?* rende la richiesta cortese.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Daniel chiede dello scaffale
    gloss: 'Daniel dice: Sì. Posso mettere la borsa sullo scaffale?'
    note: Con *Can I ...?* Daniel offre di mettere la borsa sullo scaffale.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Leila ringrazia Daniel
    gloss: 'Leila dice: Sì, grazie. Grazie per il tuo aiuto.'
    note: '*Thank you for your help* è una formula fissa di ringraziamento.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Daniel risponde
    gloss: 'Daniel dice: Nessun problema.'
    note: '*No problem* è una risposta breve e cordiale.'
  en.a1.unit63.lesson04.teach.help_note:
    title: Hilfszettel
    gloss: 'Biglietto d''aiuto: La borsa blu è pesante. Per favore, mettila sullo scaffale vicino alla porta.'
    note: Il biglietto dice di quale borsa si tratta e dove metterla.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'Testo: un vicino gentile'
    gloss: 'Un vicino gentile: Leila aveva una borsa blu pesante. Ha visto Daniel vicino alla porta e gli ha chiesto aiuto. Daniel ha portato dentro la borsa. Leila gli ha chiesto anche di aprire la porta. Poi Daniel ha messo la borsa sullo scaffale vicino alla porta. Leila ha ringraziato Daniel per l''aiuto. Daniel ha detto: Nessun problema. Più tardi Leila ha scritto un breve biglietto: La borsa blu è sullo scaffale.'
    note: '*carried* è il passato di *carry*.'
