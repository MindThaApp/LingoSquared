teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: spostare (un appuntamento)
    note: '*reschedule* significa spostare un appuntamento a un altro momento.'
    example_gloss: Devo spostare la riparazione perché in quel momento sarò al lavoro.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: vicino, vicina (di casa)
    note: '*neighbor* è la persona che abita accanto a te. La parola inglese non dice se è un uomo o una donna.'
    example_gloss: La mia vicina può aprire la porta all'idraulico.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: chiave
    note: '*key* è il piccolo oggetto di metallo con cui si apre la porta.'
    example_gloss: Lascio la chiave alla mia vicina.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: perdita
    note: '*leak* qui è un nome: il punto stesso da cui esce l''acqua. Il verbo *to leak* significa perdere, gocciolare.'
    example_gloss: La perdita sotto il mio lavello della cucina sta peggiorando.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: riparato
    note: '*fixed* è il participio di *to fix* (riparare) e significa che qualcosa non è più rotto.'
    example_gloss: Il lavello ora è riparato e l'acqua non esce più.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: pomeriggio
    note: '*afternoon* è la parte del giorno dopo mezzogiorno; la mattina si dice *morning*.'
    example_gloss: L'idraulico è venuto nel pomeriggio, non la mattina.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't und won't, wenn etwas nicht klappt
    gloss: Non posso essere a casa tra le 14 e le 16. Nel pomeriggio non sarò a casa.
    note: '*can''t* dice che qualcosa non è possibile. *won''t* dice che in futuro semplicemente non sarà così.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Sagen, dass Sie den Termin verschieben möchten
    gloss: Devo spostare la riparazione.
    note: '*I need to ...* è oggettivo e neutro: indica una necessità, ma non suona scortese.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Um eine andere Uhrzeit bitten
    gloss: Sarebbe possibile venire invece la mattina?
    note: '*Would it be possible to ...?* è il modo più prudente di chiedere qualcosa. *instead* significa «invece».'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Sagen, wo der Schlüssel ist
    gloss: Lascio la chiave alla mia vicina.
    note: '*leave something with someone* significa lasciare o consegnare qualcosa a qualcuno.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Fragen, ob das Problem behoben ist
    gloss: La perdita ora è riparata?
    note: '*Is ... fixed?* chiede il risultato, non il lavoro in sé.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Einen Grund mit because nennen
    gloss: Non posso essere a casa tra le 14 e le 16 perché sono al lavoro.
    note: '*because* collega il problema al motivo. Dopo di esso l''ordine delle parole non cambia, come in italiano: il verbo resta al suo posto normale.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: messaggio
    note: '*message* è qualsiasi breve messaggio scritto: un SMS, un messaggio di chat o una breve e-mail.'
    example_gloss: Ho ricevuto un messaggio sul nuovo orario della riparazione.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: Die Nachricht über den neuen Termin
    gloss: La riparazione 6180 è stata spostata. L'idraulico verrà domani tra le 9 e le 11. La Sua vicina aprirà la porta. Confermi per favore questo nuovo orario con un messaggio oggi stesso.
    note: 'Un messaggio dell''amministrazione è breve e oggettivo: che cosa è cambiato, quando e che cosa deve ancora fare.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Zur Bestätigung aufgefordert werden
    gloss: Confermi per favore questo nuovo orario con un messaggio oggi stesso.
    note: '*confirm* significa confermare; *by message* significa con un messaggio.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel ruft die Hausverwaltung an
    gloss: 'Daniel dice: Buongiorno, devo spostare la riparazione.'
    note: Al telefono si inizia con *Hello* e poi si dice subito il motivo della chiamata.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: Die Hausverwaltung fragt, welche Reparatur
    gloss: 'L''amministrazione dice: Nessun problema. Di quale riparazione si tratta?'
    note: '*Which repair is it?* chiede una singola cosa all''interno di un gruppo noto.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel nennt die Reparaturnummer
    gloss: 'Daniel dice: Riparazione 6180, la perdita sotto il lavello della mia cucina.'
    note: 'Lo stesso numero di riparazione dell''unità 29: lo stesso lavello che perde.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: Die Hausverwaltung fragt nach dem Grund
    gloss: 'L''amministrazione dice: Capisco. Perché non può essere a casa?'
    note: '*Why can''t you ...?* chiede il motivo per cui qualcosa non va.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel nennt den Grund und bittet um den Vormittag
    gloss: 'Daniel dice: Non posso essere a casa tra le 14 e le 16 perché sono al lavoro. Sarebbe possibile venire invece la mattina?'
    note: 'Prima il motivo, poi la richiesta: suona più cortese che pretendere subito qualcosa.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: Die Hausverwaltung bietet einen neuen Zeitraum an
    gloss: 'L''amministrazione dice: Sì, l''idraulico può venire tra le 9 e le 11.'
    note: '*between 9am and 11am* è il nuovo intervallo.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel regelt den Schlüssel
    gloss: 'Daniel dice: Grazie. Lascio la chiave alla mia vicina.'
    note: La stessa frase della lezione 2.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: Die Hausverwaltung bittet um Bestätigung
    gloss: 'L''amministrazione dice: Bene. Confermi per favore questo nuovo orario con un messaggio oggi stesso.'
    note: La stessa richiesta del messaggio della lezione 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel sagt, wann er bestätigt
    gloss: 'Daniel dice: Lo confermerò questo pomeriggio.'
    note: '*this afternoon* significa questo pomeriggio, cioè oggi dopo mezzogiorno.'
