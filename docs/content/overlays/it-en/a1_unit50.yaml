  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Mia alla reception
    gloss: 'Mia dice: Salve, abbiamo una prenotazione per due notti.'
    note: '*we have a reservation* significa abbiamo una prenotazione.'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: L'addetto alla reception dà il benvenuto
    gloss: 'L''addetto alla reception dice: Benvenute! A che nome è la prenotazione?'
    note: '*What''s the name on the reservation?* significa a che nome è la prenotazione?'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Risposta di Leila"
    gloss: 'Leila dice: È a nome mio, Leila.'
    note: L'inglese dice *it's under my name*, con la preposizione *under* (sotto), dove l'italiano dice è a nome mio.
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: L'addetto alla reception consegna la chiave
    gloss: 'L''addetto alla reception dice: Perfetto. Ecco la vostra chiave. La vostra camera ha due letti.'
    note: '*Your room has two beds.* significa la vostra camera ha due letti.'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: La domanda di Mia sul wifi
    gloss: 'Mia chiede: La camera ha il wifi?'
    note: Ripetizione della domanda imparata prima.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: L'addetto alla reception parla della colazione
    gloss: 'L''addetto alla reception dice: Sì, e la colazione è al piano di sotto dalle sette alle dieci.'
    note: '*from seven to ten* significa dalle sette alle dieci.'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: La domanda di Leila sul check-out
    gloss: 'Leila dice: Grazie! A che ora si deve lasciare la camera?'
    note: Ripetizione della domanda imparata prima, *What time is check-out?*
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: L'addetto alla reception parla della partenza
    gloss: 'L''addetto alla reception dice: Si lascia la camera alle undici.'
    note: '*Check-out is at eleven o''clock.* significa si lascia la camera alle undici.'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Testo su un weekend nella pensione
    gloss: 'Un weekend nella pensione: Mia e Leila hanno fatto una breve gita in montagna per il weekend. Mia ama fare foto e Leila ama dipingere, quindi era il posto perfetto per rilassarsi. Quando sono arrivate alla pensione, hanno detto all''addetto alla reception che avevano una prenotazione per due notti, dal 14 al 16 novembre. L''addetto ha chiesto a che nome fosse la prenotazione e Leila ha detto che era a nome suo. La loro camera aveva due letti e il wifi, e la colazione era inclusa ogni mattina dalle sette alle dieci. Si lasciava la camera alle undici. Mia ha fatto molte foto delle montagne e Leila ha dipinto un piccolo quadro della vista dalla finestra. Daniel è rimasto a casa quel weekend e si è cucinato la cena, con una ricetta del libro di cucina preso in prestito in biblioteca. Quando Mia e Leila sono tornate, gli hanno mostrato le foto e il quadro, e a lui sono piaciuti moltissimo.'
    note: '*Their room had two beds and wifi* significa la loro camera aveva due letti e il wifi.'
