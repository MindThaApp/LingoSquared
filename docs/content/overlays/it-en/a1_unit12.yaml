  en.a1.unit12.lesson03.teach.label_text:
    title: Kleidungsetikett
    gloss: 'Camicia. Taglia: M. Colore: blu. Prezzo: 20 dollari.'
    note: Il simbolo del dollaro sta PRIMA del numero (*$20*), a differenza del simbolo dell'euro, che in italiano sta DOPO il numero.
  en.a1.unit12.lesson03.teach.label_summary_sentence:
    title: The shirt is a medium and it's blue.
    gloss: La camicia è una taglia M ed è blu.
    note: Un riepilogo completo di taglia e colore in una sola frase.
  en.a1.unit12.lesson04.teach.here_you_go:
    title: Here you go.
    gloss: Ecco a Lei.
    note: '*Here you go* si dice quando si porge qualcosa a qualcuno.'
  en.a1.unit12.lesson04.teach.ill_take_it:
    title: I'll take it, thanks.
    gloss: La prendo, grazie.
    note: '*I''ll take it* mostra che si è deciso di acquistare.'
  en.a1.unit12.lesson04.teach.q_medium:
    title: Frage von Leila
    gloss: 'Leila: Scusi, avete questa camicia in taglia M?'
    note: Leila chiede con cortesia un'altra taglia.
  en.a1.unit12.lesson04.teach.a_here_you_go:
    title: Antwort des Verkäufers
    gloss: 'Commesso: Sì, ecco a Lei.'
    note: Il commesso porge a Leila la camicia nella taglia richiesta.
  en.a1.unit12.lesson04.teach.q_blue:
    title: Nachfrage von Leila
    gloss: 'Leila: Bene. Ce l''avete in blu?'
    note: Ora Leila chiede un altro colore.
  en.a1.unit12.lesson04.teach.a_yes_we_do:
    title: Antwort des Verkäufers
    gloss: 'Commesso: Sì, ce l''abbiamo.'
    note: '*we do* conferma brevemente che il colore è disponibile.'
  en.a1.unit12.lesson04.teach.closing_ill_take_it:
    title: Abschluss von Leila
    gloss: 'Leila: La prendo, grazie.'
    note: Leila decide di acquistare.
