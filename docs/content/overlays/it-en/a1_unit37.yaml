    example_gloss: Invito i miei colleghi alla mia festa di compleanno.
  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: congratularsi con qualcuno per
    note: Dopo *congratulate someone* si usa sempre la preposizione *on*, non *for*. In italiano invece si dice «congratularsi per», quindi non tradurre «per» con *for*.
    example_gloss: Ci congratuliamo con lui per la sua promozione.
