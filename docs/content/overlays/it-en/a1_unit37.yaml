    gloss: Ti va di venire alla mia festa?
    note: Un modo cordiale e informale per invitare qualcuno.
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: La domanda di Leila
    gloss: 'Leila chiede: Sapevi che il compleanno di Daniel è il 12 ottobre?'
    note: '*Did you know ...?* è un modo naturale per iniziare una conversazione con una nuova informazione.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: La reazione di Mia
    gloss: 'Mia dice: No, non lo sapevo! È venerdì prossimo.'
    note: '*No, I didn''t!* è una breve risposta negativa a una domanda con *Did you know ...?*: «No, non lo sapevo.»'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: La proposta di Leila
    gloss: 'Leila dice: Facciamogli una festa a sorpresa in ufficio.'
    note: '*Let''s* + verbo si usa per fare una proposta, come «facciamo...» o «andiamo a...» in italiano.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: La reazione di Mia
    gloss: 'Mia dice: Ottima idea! Posso invitare il resto della squadra.'
    note: '*the rest of the team* significa il resto della squadra.'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: 'Leila dice: Perfetto. Gli compro un regalo, magari delle scarpe da corsa nuove, visto che ama correre.'
    note: '*since* qui significa «visto che, dato che» (motivo), non «da quando» (tempo).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: La proposta di Mia
    gloss: 'Mia dice: È un''ottima idea. Prendiamo anche una torta?'
    note: '*Should we ...?* si usa per prendere una decisione insieme.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Sì, certo! Gli faremo tutti insieme gli auguri di buon compleanno.'
    note: '*We''ll all wish him a happy birthday* significa: tutti insieme gli faremo gli auguri di buon compleanno.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Testo sulla festa a sorpresa
    gloss: Daniel non sapeva che Leila e Mia stessero organizzando una festa a sorpresa per lui. Il 12 ottobre, il giorno del suo compleanno, arrivò al lavoro e trovò dei palloncini e una torta nella sala break. Tutti gli dissero «Buon compleanno!». Leila gli regalò un paio di scarpe da corsa nuove. Mia gli regalò una foto incorniciata dei tre colleghi insieme, scattata da lei stessa. Daniel era felicissimo e ringraziò tutti per la splendida sorpresa.
    note: '*he arrived at work and found*: passato di *arrive* e *find* (arrivò al lavoro e trovò ...).'
