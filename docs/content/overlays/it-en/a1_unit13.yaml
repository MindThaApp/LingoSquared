    gloss: emozionato / entusiasta
    note: '*excited* significa emozionato in senso positivo, in attesa di qualcosa di bello: non è il nervosismo negativo (per quello si usa *worried*).'
    example_gloss: Non vedo l'ora che sia domani.
  en.a1.unit13.lesson01.teach.worried:
    title: worried
    gloss: preoccupato
    note: '*worried* significa preoccupato o in ansia per qualcosa che potrebbe succedere.'
    example_gloss: È preoccupato per domani.
  en.a1.unit13.lesson02.teach.how_are_you_feeling:
    title: How are you feeling today?
    gloss: Come ti senti oggi?
    note: '*How are you feeling?* chiede in modo specifico lo stato d''animo del momento, a differenza del più generico *How are you?*'
  en.a1.unit13.lesson02.teach.im_worried_because:
    title: I'm a little worried because I have a big test tomorrow.
    gloss: Sono un po' preoccupato perché domani ho un esame importante.
    note: '*because* significa «perché» e introduce il motivo di un''emozione.'
  en.a1.unit13.lesson02.teach.im_happy_because:
    title: I'm happy because the class is almost over.
    gloss: Sono contento perché il corso sta per finire.
    note: '*almost over* significa «quasi finito».'
  en.a1.unit13.lesson03.teach.message_text:
    title: Eine Nachricht über Gefühle
    gloss: Ciao, sono un po' preoccupato perché domani ho un esame importante. Ma sono anche emozionato, perché è l'ultimo di quest'anno!
    note: Un messaggio può esprimere più emozioni, anche opposte, in frasi brevi e collegate.
  en.a1.unit13.lesson03.teach.writer_summary:
    title: The writer is worried and excited.
    gloss: Chi scrive è preoccupato ed emozionato.
    note: '*writer* indica la persona che ha scritto il messaggio.'
  en.a1.unit13.lesson04.teach.i_understand:
    title: Oh, I understand.
    gloss: Ah, capisco.
    note: '*I understand* significa «capisco» e mostra partecipazione mentre si ascolta.'
  en.a1.unit13.lesson04.teach.q_feeling:
    title: Frage von Leila
    gloss: 'Leila: Come ti senti oggi?'
    note: Leila apre la conversazione chiedendo a Daniel come si sente.
  en.a1.unit13.lesson04.teach.a_worried_test:
    title: Antwort von Daniel
    gloss: 'Daniel: Sono un po'' preoccupato perché domani ho un esame importante.'
    note: Daniel dice la sua emozione e il motivo.
  en.a1.unit13.lesson04.teach.acknowledge_and_ask:
    title: Reaktion von Leila
    gloss: 'Leila: Ah, capisco. Sei anche emozionato?'
    note: Leila mostra comprensione e chiede di un'altra emozione.
  en.a1.unit13.lesson04.teach.a_yes_happy_class:
    title: Antwort von Daniel
    gloss: 'Daniel: Sì, un po''. Sono contento che il corso stia per finire.'
    note: Daniel conferma brevemente e dice una seconda emozione, positiva.
