teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: mal di testa
    note: '*headache* significa «mal di testa». In inglese si dice *a headache*: singolare con l''articolo, come in italiano «un mal di testa».'
    example_gloss: Ho mal di testa.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: mal di pancia
    note: '*stomachache* significa «mal di pancia». Anche qui: singolare con l''articolo (*a stomachache*).'
    example_gloss: Ho mal di pancia.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: febbre
    note: '*fever* significa «febbre». Si dice *have a fever*, non *have fever*.'
    example_gloss: Credo di avere la febbre.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: tosse
    note: '*cough* significa «tosse». La parola è sia nome sia verbo: *a cough* (la tosse), *to cough* (tossire).'
    example_gloss: Daniel ha una brutta tosse.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: mal di gola
    note: '*sore throat* significa «mal di gola». *sore* vuol dire «dolorante»; anche qui serve l''articolo: *a sore throat*.'
    example_gloss: Ho mal di gola.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: Che cosa c'è che non va?
    note: Con *What's wrong?* chiedi qual è il problema. *What's* è la forma contratta di *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: Ho mal di testa.
    note: Con *I have a...* indichi un disturbo. Letteralmente è «ho un...», proprio come in italiano; l'unica differenza è l'articolo davanti al nome del disturbo.
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: Ho caldo.
    note: Con *I feel...* dici come ti senti fisicamente. *I feel hot* significa letteralmente «mi sento caldo», ma in italiano si dice «ho caldo». In inglese il soggetto è *I*.
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: riposare
    note: '*rest* significa «riposare».'
    example_gloss: Devo riposare.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: Testo sui disturbi
    gloss: Ho mal di testa e mal di gola. Credo di avere anche la febbre. Devo riposare.
    note: In questo breve testo una persona descrive più disturbi insieme.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Dovresti andare dal medico.
    note: 'Con *You should...* dai un semplice consiglio: «dovresti...». Dopo *should* il verbo è senza *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: Chiedere come va
    gloss: 'Leila dice: Non hai una bella cera. Che cosa c''è che non va?'
    note: '*You don''t look well* significa: «Non hai una bella cera».'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Ho mal di testa e mal di gola.'
    note: Daniel nomina due disturbi insieme.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: Chiedere della febbre
    gloss: 'Leila chiede: Hai la febbre?'
    note: Con *Do you have a fever?* chiedi di un disturbo preciso.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Non sono sicuro, ma ho caldo.'
    note: Daniel non è sicuro, ma dice come si sente.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Il consiglio di Leila
    gloss: 'Leila dice: Dovresti riposare e bere acqua. Se non migliora, dovresti andare dal medico.'
    note: Leila prima dà un semplice consiglio, poi dice quando Daniel dovrebbe andare dal medico.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Ultima risposta di Daniel
    gloss: 'Daniel dice: Va bene, grazie. Oggi riposerò.'
    note: Daniel accetta il consiglio e dice che cosa farà oggi.
