    title: Indicazioni per la farmacia
    gloss: 'Indicazioni per la farmacia: Vada dritto. Prenda la prima strada a sinistra. La farmacia è sulla destra.'
    note: Le indicazioni scritte mettono in fila brevi frasi imperative, un passo dopo l'altro.
  en.a1.unit10.lesson04.teach.q_bank:
    title: Domanda di Daniel
    gloss: 'Daniel: Scusi, come arrivo alla banca?'
    note: Daniel si rivolge a Leila con cortesia usando *Excuse me*.
  en.a1.unit10.lesson04.teach.a_route:
    title: Risposta di Leila
    gloss: 'Leila: Vada dritto, poi giri a sinistra all''angolo.'
    note: Leila dà indicazioni in due passaggi.
  en.a1.unit10.lesson04.teach.confirm_route:
    title: Domanda di approfondimento di Daniel
    gloss: 'Daniel: A sinistra all''angolo, va bene. È lontano?'
    note: Daniel ripete l'istruzione per essere sicuro di aver capito bene.
