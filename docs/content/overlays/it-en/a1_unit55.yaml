  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: Mi serve una cuffia?
    note: '*Do I need...?* usa *do* per formare la domanda.'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: Chiudiamo alle otto.
    note: In inglese si usa *at* davanti a un'ora precisa; in italiano si usa alle.
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: Il bagnino li saluta
    gloss: 'Il bagnino dice: Salve! Siete qui per nuotare oggi?'
    note: In *Are you here to swim today?*, *to swim* esprime lo scopo, come per nuotare.
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: I biglietti di Daniel
    gloss: 'Daniel dice: Sì, due biglietti, per favore.'
    note: Una richiesta breve e diretta di due biglietti.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: Il prezzo
    gloss: 'Il bagnino dice: Certo! Un biglietto costa cinque dollari.'
    note: Il prezzo di ciascun biglietto.
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia chiede della cuffia
    gloss: 'Mia dice: Ci serve una cuffia?'
    note: '*Do we need...?* usa *do* per formare la domanda.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: La regola della cuffia
    gloss: 'Il bagnino dice: Sì, in piscina la cuffia è obbligatoria.'
    note: '*swim caps are required* è una forma passiva e formale per esprimere una regola; in italiano è naturale dire la cuffia è obbligatoria.'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel chiede degli armadietti
    gloss: 'Daniel dice: Dove sono gli armadietti?'
    note: Una domanda breve sulla loro posizione.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: La posizione degli armadietti
    gloss: 'Il bagnino dice: Gli armadietti sono vicino all''ingresso.'
    note: Questa informazione indica dove si trovano gli armadietti.
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Che cosa serve per gli armadietti
    gloss: 'Il bagnino dice: Serve una moneta da un dollaro.'
    note: '*a dollar coin* è formato da due parole; in italiano si dice una moneta da un dollaro.'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia chiede l'orario di chiusura
    gloss: 'Mia dice: A che ora chiudete?'
    note: '*What time do you close?* usa *do* per formare la domanda.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: L'orario di chiusura
    gloss: 'Il bagnino dice: Chiudiamo alle otto.'
    note: Questa informazione indica l'orario di chiusura.
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Testo: Una giornata in piscina'
    gloss: 'In un caldo pomeriggio di luglio, Daniel e Mia decisero di rinfrescarsi nella piscina comunale. Vicino all''ingresso, un cartello elencava le regole: vietato correre e cuffia obbligatoria. Chiesero due biglietti al bagnino. Ogni biglietto costava cinque dollari. Il bagnino spiegò che gli armadietti erano vicino all''ingresso e richiedevano una moneta da un dollaro. Daniel e Mia vi misero le borse e nuotarono per quasi due ore. Prima di uscire controllarono di nuovo il cartello: la piscina chiude alle otto. Mia disse che voleva tornare il fine settimana seguente e provare il trampolino.'
    note: '*required* compare in una forma passiva; *swim caps are required* significa la cuffia è obbligatoria.'
