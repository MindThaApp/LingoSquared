    example_gloss: Il mio numero civico è dodici.
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: tredici
    note: 'Da 13 a 19 l''inglese aggiunge *-teen* al numero di base, un po'' come l''italiano *-dici*. In *thirteen* però cambia la radice: *thir-* invece di *three*.'
    example_gloss: Il mio numero civico è tredici.
  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: quindici
    note: '*fifteen*, non *fiveteen*: una piccola irregolarità dell''inglese.'
    example_gloss: Il mio numero civico è quindici.
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: venti
    note: '*twenty* è il numero inglese 20.'
    example_gloss: Il mio numero civico è venti.
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: ventuno
    note: 'A differenza dell''italiano (*ventuno*, un''unica parola), in inglese si dice prima la decina e poi l''unità, con il trattino: *twenty-one*.'
  en.a1.unit03.lesson02.teach.thirty:
