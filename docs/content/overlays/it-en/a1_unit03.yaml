    example_gloss: Costa trenta dollari.
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: quaranta
    note: 'Attenzione: *forty*, non *fourty*: la *u* di *four* scompare.'
    example_gloss: Costa quaranta dollari.
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: cinquanta
