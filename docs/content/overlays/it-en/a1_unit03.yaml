    gloss: 'Leila dice: Costa cinque dollari.'
    note: La risposta alla domanda di Daniel sul prezzo.
  en.a1.unit03.lesson04.teach.ask_apples:
    title: Daniel fragt nach den Äpfeln
    gloss: 'Daniel chiede: E quanto costano le mele?'
    note: '*And* collega questa domanda alla precedente.'
  en.a1.unit03.lesson04.teach.price_two:
    title: Leila antwortet
    gloss: 'Leila dice: Costano due dollari.'
    note: Si usa *They're* perché *apples* è plurale.
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: Daniel fragt nach dem Alter des Ladens
    gloss: 'Daniel dice: Va bene, quanti anni ha questo negozio?'
    note: '*How old* può riferirsi anche alle cose, non solo alle persone.'
