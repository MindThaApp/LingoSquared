    example_gloss: Costa cinquanta dollari.
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: cento
    note: In inglese davanti a *hundred* ci vuole sempre *one* o *a* (*one hundred*, *a hundred*); in italiano basta «cento».
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: Quanti anni ha? / Quanti anni hai?
    note: '*How old are you?* va bene in qualsiasi registro: in inglese non c''è distinzione tra *Lei* e *tu*.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: Ho venticinque anni.
    note: 'Attenzione: in inglese si dice «sono vecchio di venticinque anni», cioè numero + *years old*, con il verbo *be* e non *have* come in italiano.'
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: Quanto costa?
    note: Chiede il prezzo di qualcosa.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: Costa dieci dollari.
    note: La risposta standard a una domanda sul prezzo.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: Qual è il Suo numero di telefono?
    note: Chiede un numero di telefono.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: È cinque-cinque-cinque, uno-due-tre-quattro.
    note: In inglese i numeri di telefono si dicono cifra per cifra, con una pausa tra i gruppi.
