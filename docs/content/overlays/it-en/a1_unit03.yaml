  en.a1.unit03.lesson02.teach.eleven:
    title: eleven
    gloss: undici
    note: '*eleven* è irregolare, come l''italiano *undici* rispetto a «dieci».'
    example_gloss: Il mio numero civico è undici.
  en.a1.unit03.lesson02.teach.twelve:
