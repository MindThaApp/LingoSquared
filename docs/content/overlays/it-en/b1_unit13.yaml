teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: che (per le persone)
    note: '*who* in una frase relativa si riferisce a una persona.'
    example_gloss: Daniel, che è entrato nel team a marzo, dirige già due progetti.
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: che / il quale (per le cose)
    note: '*which* in una frase relativa si riferisce a una cosa.'
    example_gloss: Il corso di design che Leila ha scelto inizia a giugno.
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: che (restrittivo)
    note: '*that* in una frase relativa restrittiva si riferisce a una persona o a una cosa.'
    example_gloss: Il cliente che ha chiamato stamattina vuole un appuntamento.
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: il cui / la cui
    note: '*whose* in una frase relativa indica possesso.'
    example_gloss: Il cliente il cui progetto stanno finendo ha già approvato il design.
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: dove
    note: '*where* in una frase relativa si riferisce a un luogo.'
    example_gloss: L'ufficio dove lavora Daniel è in centro.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: collega
    note: '*coworker* indica una persona con cui si lavora.'
    example_gloss: Mia ha una collega che studia spagnolo la sera.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who im bestimmenden Relativsatz
    gloss: La collega che siede accanto a Mia è molto organizzata.
    note: '*who* introduce qui un''informazione necessaria per sapere di chi si parla.'
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who im nicht bestimmenden Relativsatz
    gloss: Daniel, che è entrato nel team a marzo, dirige già due progetti.
    note: Le virgole mostrano che la frase relativa dà un'informazione aggiuntiva e non necessaria per identificare la persona.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: Bestimmende und nicht bestimmende Relativsätze
    gloss: 'Usa una frase relativa restrittiva senza virgole per dire esattamente quale persona o cosa intendi: The colleague who sits next to Mia is organized. Usa una frase relativa non restrittiva con le virgole per aggiungere un''informazione su qualcuno che è già stato identificato: Daniel, who joined in March, already leads two projects. Come in italiano, solo la relativa non restrittiva va tra virgole; in inglese però nella relativa restrittiva *that* non è preceduto da virgola.'
    note: 'Forma: restrittiva = senza virgole, dice chi o che cosa si intende; non restrittiva = con le virgole, aggiunge un''informazione.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: scadenza
    note: '*deadline* indica la data o l''ora entro cui qualcosa deve essere pronto.'
    example_gloss: La collega che siede accanto a Mia rispetta sempre le scadenze.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: approvare
    note: '*approve* significa accettare ufficialmente qualcosa.'
    example_gloss: Il cliente ha già approvato la prima bozza.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue Büro'
    gloss: Mia lavora con diverse persone che le rendono il lavoro più facile. Daniel, che è entrato nel team a marzo, dirige già due progetti. La collega che siede accanto a Mia è molto organizzata e rispetta sempre le scadenze. Il loro ufficio, che si trova al quinto piano, ha una piccola cucina dove tutti pranzano insieme. Il cliente il cui progetto stanno finendo ha già approvato la prima bozza.
    note: Un breve testo di lettura con frasi relative restrittive e non restrittive.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia stellt die neue Kollegin vor
    gloss: 'Mia dice: Leila, hai già conosciuto la donna che è appena entrata nel nostro team?'
    note: '*who* qui si riferisce a *the woman*.'
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila fragt nach dem Platz der neuen Kollegin
    gloss: 'Leila dice: Non ancora. È la persona la cui scrivania è vicino alla finestra?'
    note: '*whose* indica possesso: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia beschreibt die neue Kollegin
    gloss: 'Mia dice: Sì, è lei. È la designer che ha concluso il progetto del logo.'
    note: '*who* si riferisce a *the designer*.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila erinnert sich an das Projekt
    gloss: 'Leila dice: Ah, ricordo. È il progetto che ha vinto il premio il mese scorso?'
    note: '*which* si riferisce a *the project*.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia erzählt von ihrem früheren Büro
    gloss: 'Mia dice: Esatto. L''ufficio dove lavorava prima era molto più piccolo del nostro.'
    note: '*where* si riferisce a un luogo: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila versteht, warum sie die Küche mag
    gloss: 'Leila dice: Questo spiega perché le piace tanto la cucina dove tutti pranzano insieme.'
    note: '*where* si riferisce a *the kitchen*.'
