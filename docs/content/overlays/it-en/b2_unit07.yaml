course:
  title: Inglese B2
  description: Impara l'inglese a livello B2 per conversazioni sfumate, argomentazioni, ipotesi e discussioni professionali, con spiegazioni in italiano colloquiale.
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Condizioni, rifiuti e concessioni
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 'Lettura: cosa è stato concordato?'
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: clausola, punto di un accordo
    note: '*term* è un punto di un accordo. Qui non indica un periodo scolastico.'
    example_gloss: Una clausola è una parte di un accordo.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: proposta
    note: '*proposal* è una proposta di possibili condizioni.'
    example_gloss: Una proposta suggerisce possibili condizioni.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: rifiuto, rigetto
    note: '*refusal* dice che una condizione non è accettabile. In inglese un rifiuto chiaro suona spesso meglio se accompagnato da una ragione.'
    example_gloss: Un rifiuto dice che una condizione non è accettabile.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: concessione
    note: '*concession* significa rinunciare a una parte della tua posizione per rendere possibile un accordo.'
    example_gloss: Una concessione rinuncia a una parte di una posizione.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: ambito, portata del lavoro
    note: '*scope* indica quanto lavoro è incluso. Nelle trattative si possono bilanciare scadenza e scope.'
    example_gloss: L'ambito è la quantità di lavoro inclusa.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: condizione, requisito
    note: '*condition* è qualcosa che deve essere soddisfatto prima che un accordo funzioni.'
    example_gloss: Una condizione deve essere soddisfatta prima che l'accordo funzioni.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Concessione condizionata
    gloss: Posso accettare la scadenza anticipata a condizione che l'ambito del lavoro venga ridotto.
    note: '*I can agree... on condition that...* è chiaro ma professionale. Non si attenua diventando vaghi.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Rifiutare con chiarezza
    gloss: Non posso accettare martedì come scadenza con l'ambito completo.
    note: '*I cannot agree to...* suona più professionale di un secco *No, that is impossible*.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Accettare con if
    gloss: Posso accettarlo se l'appendice completa segue la settimana prossima.
    note: '*I can accept that if...* rende esplicita la condizione.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Rifiutare e continuare a trattare
    gloss: Usa I cannot agree per porre un limite in modo chiaro. Usa I can agree on condition that per offrire una concessione condizionata.
    note: Un rifiuto troppo diretto può suonare duro in inglese. Indica il limite, il motivo e la condizione.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: sintesi per la direzione
    note: '*executive summary* è il breve riassunto dei punti principali di un rapporto.'
    example_gloss: Una sintesi per la direzione riporta i punti principali di un rapporto.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: grafici
    note: '*charts* mostrano le informazioni in modo visivo.'
    example_gloss: I grafici mostrano le informazioni in modo visivo.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Lettura: condizioni riviste'
    gloss: 'Priya ha proposto per prima giovedì come scadenza per il rapporto completo. Marcus ha fatto resistenza perché il cliente aveva bisogno di qualcosa prima. Priya ha rifiutato martedì con l''ambito completo perché avrebbe messo a rischio la qualità. Poi ha offerto una concessione condizionata: martedì era possibile se l''ambito veniva ridotto alla sintesi per la direzione e ai grafici. Marcus ha accettato quella condizione, ma ha aggiunto una clausola: l''appendice completa doveva seguire la settimana successiva. L''esito concordato è stato martedì per la sintesi e i grafici, e la settimana successiva per l''appendice.'
    note: 'La trattativa è decisa ma professionale: rifiuto, motivo, condizione e accordo.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya fa una proposta
    gloss: 'Priya dice: Possiamo consegnare il rapporto entro giovedì se l''ambito resta com''è previsto.'
    note: Collega subito la scadenza all'ambito del lavoro.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus fa resistenza
    gloss: 'Marcus dice: Giovedì è troppo tardi per il cliente. Puoi consegnarlo entro martedì?'
    note: Chiede una scadenza anticipata senza cambiare subito l'ambito.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya rifiuta con una ragione
    gloss: 'Priya dice: Non posso accettare martedì con l''ambito completo. Metterebbe a rischio la qualità.'
    note: La ragione rende il rifiuto professionale e meno brusco.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus chiede le condizioni
    gloss: 'Marcus dice: Cosa renderebbe possibile martedì?'
    note: Questa domanda apre la porta a una concessione condizionata.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya offre una condizione
    gloss: 'Priya dice: Posso accettare la scadenza anticipata a condizione che l''ambito venga ridotto alla sintesi per la direzione e ai grafici.'
    note: '*on condition that* è esplicito e professionale.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus accetta con una condizione in più
    gloss: 'Marcus dice: Posso accettarlo se l''appendice completa segue la settimana prossima.'
    note: Accetta, ma fissa quando verrà consegnato il resto.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya conclude l'accordo
    gloss: 'Priya dice: D''accordo. Martedì per la sintesi e i grafici, e la settimana prossima per l''appendice.'
    note: '*Agreed* chiude la trattativa in modo breve e chiaro.'
