teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: perso / smarrito
    note: '*lost* significa perso o smarrito. È il passato di *lose* (perdere): *I lost* = ho perso.'
    example_gloss: Ho perso il portafoglio.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: trovato
    note: '*found* è il passato di *find* (trovare): I found your keys = ho trovato le tue chiavi.'
    example_gloss: Ho trovato le tue chiavi!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: chiavi
    note: '*keys* significa chiavi.'
    example_gloss: Queste sono le mie chiavi.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: portafoglio
    note: '*wallet* significa portafoglio.'
    example_gloss: Questo è il tuo portafoglio?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: zaino
    note: '*backpack* significa zaino.'
    example_gloss: Il mio zaino è nero.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: Ho perso il portafoglio.
    note: In inglese per un fatto concluso nel passato si usa il passato semplice *lost*; in italiano si dice spesso ho perso (passato prossimo), ma il senso è lo stesso.
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: Hai visto le mie chiavi?
    note: '*Have you seen ...?* significa hai visto ...? La struttura è simile all''italiano: have (avere) come ausiliare + participio passato.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: Qualcuno ha trovato uno zaino?
    note: '*Has anyone found ...?* significa qualcuno ha trovato ...?'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: È nero con una cinghia rossa.
    note: '*It''s black with a red strap.* significa è nero con una cinghia rossa.'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: Dov'è l'ufficio oggetti smarriti?
    note: '*the lost and found* è il nome fisso in inglese americano dell''ufficio oggetti smarriti, letteralmente il perso-e-trovato.'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: Sì, l'abbiamo trovato!
    note: '*Yes, we found it!* significa sì, l''abbiamo trovato!'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Mia, dov''è il tuo zaino? Ce l''avevi vicino alla fontana.'
    note: '*had* è il passato di *have* (avere): you had it = ce l''avevi.'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: Lo spavento di Mia
    gloss: 'Mia dice: Oh no, hai ragione! Non ce l''ho. La mia macchina fotografica è dentro!'
    note: '*My camera is inside!* significa la mia macchina fotografica è dentro!'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: La proposta di Daniel
    gloss: 'Daniel dice: Non preoccuparti, chiamiamo l''ufficio del parco e chiediamo.'
    note: '*Don''t worry* significa non preoccuparti.'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: La telefonata di Daniel
    gloss: 'Daniel dice: Salve, abbiamo perso uno zaino nero vicino alla fontana. Qualcuno ne ha trovato uno?'
    note: '*we lost a black backpack* significa abbiamo perso uno zaino nero: in inglese qui si usa semplicemente il passato *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: La domanda di Mia
    gloss: 'Mia dice: Cos''hanno detto?'
    note: '*did they say* usa *did* come ausiliare del passato nelle domande.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: La buona notizia di Daniel
    gloss: 'Daniel dice: L''hanno trovato! È nero con una cinghia gialla, vero? Lo tengono alla reception.'
    note: '*right?* alla fine di una frase è una breve domanda di conferma, simile a vero? o no? in italiano.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Il sollievo di Mia
    gloss: 'Mia dice: Sì, è proprio quello! Andiamo a prenderlo subito. Grazie al cielo.'
    note: '*Let''s go get it* significa andiamo a prenderlo: due verbi di seguito, senza *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Testo sull'ufficio oggetti smarriti
    gloss: 'L''ufficio oggetti smarriti: se perdi qualcosa nel parco, pensa prima di tutto a dove l''avevi visto per l''ultima volta. Poi vai all''ufficio del parco vicino all''ingresso principale e descrivi l''oggetto: di'' di che colore è e quali sono i dettagli particolari. Lascia il tuo nome e il tuo numero di telefono, così il personale può chiamarti se lo trova più tardi. Dopo che Mia ha perso lo zaino vicino alla fontana, lei e Daniel hanno chiamato subito l''ufficio del parco. Il personale l''aveva già trovato e lo teneva alla reception. Mia era molto sollevata di riavere la sua macchina fotografica sana e salva. Più tardi ha raccontato tutta la storia a Leila, e Leila ha detto che la prossima volta l''avrebbe aiutata a tenere meglio d''occhio le sue cose.'
    note: '*keep better track of your things* significa tenere meglio d''occhio le tue cose.'
