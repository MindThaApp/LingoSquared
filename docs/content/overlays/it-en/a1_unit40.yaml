    title: express mail
    gloss: posta prioritaria / spedizione espressa
    note: '*express mail* significa posta prioritaria: una spedizione più rapida e più costosa.'
    example_gloss: La posta prioritaria è più veloce della posta ordinaria.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: Quanto costa spedire questo?
    note: '*How much does it cost to ...?* chiede il prezzo di un''azione.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: La richiesta di Daniel
    gloss: 'Daniel dice: Buongiorno, vorrei spedire questo pacco, per favore.'
    note: '*I''d like to* + verbo è un modo educato per chiedere qualcosa. È molto più cortese di *I want*, che allo sportello suona piuttosto brusco.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: L'impiegato chiede
    gloss: 'L''impiegato dice: Certo! Dove va?'
    note: '*Where is it going?* chiede la destinazione.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: A Chicago. È un regalo di compleanno per mia sorella.'
    note: '*It''s a birthday gift for my sister* significa: è un regalo di compleanno per mia sorella.'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: L'impiegato chiede
    gloss: 'L''impiegato dice: Preferisce posta ordinaria o prioritaria? La prioritaria impiega circa due giorni.'
    note: '*regular or express mail* significa posta ordinaria o prioritaria.'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: La scelta di Daniel
    gloss: 'Daniel dice: Prendo la prioritaria, per favore. Quanto costa?'
    note: '*I''ll take ...* è un modo naturale per fare una scelta quando si usa un servizio.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: L'impiegato risponde
    gloss: 'L''impiegato dice: Sono dodici dollari. Ecco la ricevuta.'
    note: '*Here''s your receipt* significa: ecco la sua ricevuta.'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Il ringraziamento di Daniel
    gloss: 'Daniel dice: Grazie! Buona giornata.'
    note: '*Have a good day* è un saluto di congedo cortese.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Testo su tre visite all'ufficio postale
    gloss: Daniel, Leila e Mia si muovono tutti bene all'ufficio postale. La settimana scorsa Daniel ha spedito un pacco di compleanno a sua sorella a Chicago. Ha pagato la posta prioritaria perché voleva che arrivasse presto, e ci ha messo solo due giorni. Leila sta per trasferirsi vicino a Mia, così è andata all'ufficio postale a spedire dei vecchi libri ai suoi genitori. L'impiegato ha pesato il pacco e le ha dato un francobollo. Leila ha chiesto quanto ci avrebbe messo il pacco, e l'impiegato ha detto circa una settimana, perché lei ha scelto la posta ordinaria. Mia non spedisce pacchi molto spesso, ma compra sempre un francobollo per le lettere che scrive a sua nonna. Dice che una lettera con il francobollo è più personale di un messaggio.
    note: '*getting ready to move* significa: prepararsi a traslocare.'
