teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: autobus
    note: '*bus* significa autobus. Il verbo che lo accompagna è *take*: *take the bus*. Attenzione: in italiano per quasi ogni mezzo si dice «prendere» (prendere l''autobus, il treno), mentre in inglese ogni mezzo ha il suo verbo (*take*, *drive*, *ride*). Vanno imparati uno per uno.'
    example_gloss: Prendo l'autobus.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: treno
    note: '*train* significa treno. Come per *bus*, qui si usa *take*: *take the train*.'
    example_gloss: Lei prende il treno.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: auto
    note: '*car* significa auto. Per l''auto non si usa *take* ma *drive*: *drive my car*. È un verbo diverso rispetto a bus e treno.'
    example_gloss: Vado al lavoro in auto.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: bicicletta
    note: '*bike* significa bicicletta. Qui si usa ancora un altro verbo: *ride a bike* (non *take* e non *drive*).'
    example_gloss: Vado al lavoro in bicicletta ogni giorno.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: camminare
    note: '*walk* significa camminare. Qui non serve un verbo in più come *take*, *drive* o *ride*, perché *walk* è già il verbo: *walk to work*, non *take a walk to work*.'
    example_gloss: Vado al lavoro a piedi.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: Come vai al lavoro?
    note: Questa domanda inizia con l'ausiliare *do*, perché il verbo vero e proprio è *get*. In italiano non serve nessun ausiliare per formulare la domanda.
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: di solito
    note: '*usually* significa «di solito». In inglese questo avverbio sta di norma tra il soggetto e il verbo principale: *I usually take the bus*.'
    example_gloss: Di solito prendo l'autobus.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: minuti
    note: '*minutes* significa minuti. In *It takes twenty minutes*, *it* è un soggetto vuoto, senza significato proprio: occupa solo il posto del soggetto. In italiano questo soggetto non si esprime («Ci vogliono venti minuti»), mentre in inglese è obbligatorio.'
    example_gloss: Ci vogliono venti minuti.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: in ritardo
    note: '*late* significa «in ritardo» (arrivare più tardi del previsto): *The bus is often late.*'
    example_gloss: L'autobus è spesso in ritardo.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: più veloce
    note: '*faster* significa «più veloce»: è il comparativo di *fast* con *-er*. Per il confronto si usa *than*: *faster than the bus*.'
    example_gloss: Il treno è più veloce dell'autobus.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: La domanda di Leila
    gloss: 'Leila chiede: Come vai al lavoro, Daniel?'
    note: Inizio del dialogo con *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Di solito prendo l''autobus. Ci vogliono circa venti minuti.'
    note: 'Due cose insieme: il verbo *take* per l''autobus e il soggetto vuoto *it* in *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: La domanda di Leila
    gloss: 'Leila chiede: Ti piace?'
    note: Domanda sì/no con *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Va bene, ma l''autobus è spesso in ritardo. E tu?'
    note: '*How about you?* significa «E tu?»: un modo breve per restituire la domanda.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Io vado in auto. È più veloce, ma parcheggiare è difficile.'
    note: Per l'auto si usa il verbo *drive*, non *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Testo su Leila e Daniel
    gloss: Leila va al lavoro in auto ogni giorno. Il tragitto dura circa quindici minuti, ma parcheggiare vicino al suo ufficio è difficile. Daniel non ha l'auto, quindi prende l'autobus. Il suo viaggio in autobus dura venti minuti e a volte l'autobus è in ritardo, ma non deve preoccuparsi del parcheggio.
    note: 'Attenzione: *take* si usa per autobus e treno, *drive* per l''auto.'
