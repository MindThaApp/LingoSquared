teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: svegliarsi
    note: '*wake up* significa «svegliarsi». È un verbo con una particella, e le due parole si scrivono separate. Nota: non c''è nessun *si* come in italiano.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: vestirsi
    note: '*get dressed* significa «vestirsi». In inglese non c''è il pronome riflessivo *si*: non si dice *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: andare al lavoro
    note: '*go to work* significa «andare al lavoro». In questa espressione fissa davanti a *work* non c''è l''articolo.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: cenare
    note: '*have dinner* significa «cenare». I pasti non vogliono l''articolo: *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: andare a letto
    note: '*go to bed* significa «andare a letto» per dormire. Anche qui non c''è l''articolo davanti a *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: A che ora ti svegli?
    note: 'Con *What time do you wake up?* chiedi a che ora una persona si alza. La domanda con *do* richiede l''ausiliare: non si dice *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Mi sveglio alle sette ogni giorno.
    note: '*every day* si usa per un''abitudine quotidiana. Sta alla fine o all''inizio della frase.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Mi vesto la mattina.
    note: '*in the morning* indica una parte della giornata, non un''ora precisa. L''italiano «la mattina» si dice *in the morning*.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: Di solito vado a letto alle undici.
    note: '*usually* significa «di solito» e descrive un''abitudine non sempre identica. Attenzione all''ordine delle parole: in inglese *usually* sta prima del verbo principale (*I usually go*). In italiano «di solito» si può spostare più liberamente; *I go usually to bed* è sbagliato.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: poi, dopo
    note: '*then* significa «poi» o «dopo» e indica l''ordine degli eventi.'
    example_gloss: Faccio colazione e poi vado al lavoro.
  en.a1.unit16.lesson03.teach.routine_text:
    title: Testo su una giornata
    gloss: Ogni giorno mi sveglio alle sette. Poi mi vesto e faccio colazione.
    note: Questa è una breve descrizione di una routine mattutina.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: Che cosa fai dopo?
    note: Con *What do you do after that?* chiedi che cosa si fa dopo nella giornata.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: Chiedere l'ora del risveglio
    gloss: 'Leila chiede: A che ora ti svegli?'
    note: La stessa domanda di prima.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: Risposta sul risveglio
    gloss: 'Daniel dice: Mi sveglio alle sette ogni giorno.'
    note: Una risposta completa indica sia l'ora sia la ripetizione quotidiana.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: Chiedere che cosa succede dopo
    gloss: 'Leila chiede: Che cosa fai dopo?'
    note: Questa domanda è un naturale proseguimento della conversazione sulla giornata.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: Descrivere tutta la giornata
    gloss: 'Daniel dice: Mi vesto, faccio colazione e vado al lavoro. Di solito vado a letto alle undici.'
    note: Daniel elenca varie attività una dopo l'altra, nell'ordine giusto.
