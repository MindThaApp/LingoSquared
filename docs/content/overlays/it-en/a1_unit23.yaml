teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: insegnante, maestro, maestra
    note: '*teacher* significa «insegnante». In inglese il genere non si distingue: *teacher* vale per uomini e donne.'
    example_gloss: Leila è un'insegnante.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: infermiere, infermiera
    note: '*nurse* significa «infermiere» o «infermiera». La parola è uguale per donne e uomini.'
    example_gloss: Sono infermiere/infermiera.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: ingegnere
    note: '*engineer* significa «ingegnere». Davanti a una vocale si usa *an*: *an engineer*.'
    example_gloss: Daniel è ingegnere.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: cuoco, cuoca
    note: '*cook* significa «cuoco» o «cuoca»; la parola è anche un verbo («cucinare»).'
    example_gloss: Mio fratello è cuoco.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: autista, conducente
    note: '*driver* significa «autista» o «conducente». In *bus driver* si nomina prima il veicolo, che in inglese precede la parola.'
    example_gloss: È un autista di autobus.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: Che lavoro fai?
    note: Con *What do you do?* chiedi che lavoro fa una persona. Letteralmente significa «Che cosa fai?», ma si intende «Che lavoro fai?».
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Sono infermiere/infermiera.
    note: 'Con *I''m a...* dici il tuo lavoro. Attenzione: in italiano si dice «Sono insegnante» senza articolo; in inglese davanti al mestiere ci vuole *a* o *an*.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: Dove lavori?
    note: Con *Where do you work?* chiedi dove lavora una persona.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: pazienti
    note: '*patients* significa «pazienti» (plurale). La parola si pronuncia *PAY-shents*.'
    example_gloss: Aiuto i pazienti ogni giorno.
  en.a1.unit23.lesson03.teach.profile_text:
    title: Testo su un lavoro
    gloss: Sono infermiere/infermiera. Lavoro in un ospedale. Aiuto i pazienti e scrivo relazioni ogni giorno.
    note: In questo breve profilo una persona racconta il suo lavoro e la sua giornata lavorativa.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: È un lavoro interessante.
    note: '*interesting* significa «interessante».'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: Chiedere a Daniel che lavoro fa
    gloss: 'Leila chiede: Daniel, che lavoro fai?'
    note: La stessa domanda della seconda lezione, questa volta con il nome.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Sono ingegnere. Lavoro in una piccola azienda in centro.'
    note: Daniel dice il suo lavoro e dove lavora.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: Chiedere dei compiti quotidiani
    gloss: 'Leila chiede: Che cosa fai ogni giorno?'
    note: Questa domanda riguarda i compiti di ogni giorno.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Scrivo relazioni e rispondo alle e-mail. A volte incontro dei clienti.'
    note: Daniel nomina alcune cose che fa ogni giorno.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: Chiedere se a Daniel piace il lavoro
    gloss: 'Leila chiede: Ti piace il tuo lavoro?'
    note: Con *Do you like your job?* chiedi se a qualcuno piace il suo lavoro.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Sì, molto. È un lavoro interessante.'
    note: Daniel dice di sì e dà anche il motivo.
