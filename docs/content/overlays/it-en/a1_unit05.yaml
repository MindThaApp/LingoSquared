teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: Che ora è?
    note: '*What time is it?* chiede l''ora in modo generale.'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: Sono le tre.
    note: '*It''s three o''clock.* dice l''ora piena.'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: Sono le tre e mezza.
    note: '*half past three* significa letteralmente «tre e mezza» e indica le 3:30: in questo caso l''inglese e l''italiano contano allo stesso modo.'
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: Sono le cinque.
    note: '*It''s five o''clock.* dice l''ora piena delle 5:00.'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: Sono le tre e un quarto.
    note: '*It''s a quarter past three.* significa le 3:15.'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: Sono le quattro meno un quarto.
    note: '*It''s a quarter to four.* significa le 3:45.'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: Sono le quattro e dieci.
    note: '*It''s ten past four.* significa le 4:10.'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: Sono le cinque meno dieci.
    note: '*It''s ten to five.* significa le 4:50.'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: mattina
    note: '*morning* significa mattina, all''incirca dalle 6 alle 12.'
    example_gloss: Buongiorno, Daniel!
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: pomeriggio
    note: '*afternoon* significa pomeriggio, all''incirca dalle 12 alle 17.'
    example_gloss: Lavoro nel pomeriggio.
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: sera
    note: '*evening* significa sera, all''incirca dalle 17 alle 21; i confini sono sfumati.'
    example_gloss: Buonasera, Leila!
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: notte
    note: '*night* significa notte, all''incirca dalle 21 alle 6.'
    example_gloss: Buonanotte, Daniel!
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: Il negozio apre alle nove del mattino.
    note: 'Davanti all''ora l''inglese usa *at*, come «alle» in italiano: *at nine* (alle nove).'
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: Il negozio chiude alle diciotto (le sei di sera).
    note: In inglese nella vita quotidiana l'ora si dice spesso con il formato a 12 ore più il momento della giornata (*six in the evening*), mentre in italiano per gli orari ufficiali di apertura si usa spesso il formato a 24 ore (le diciotto).
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: apre alle
    note: '*opens at* + ora significa «apre alle» + ora.'
    example_gloss: La biblioteca apre alle nove.
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: chiude alle
    note: '*closes at* + ora significa «chiude alle» + ora.'
    example_gloss: La biblioteca chiude alle sei.
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel fragt nach der Öffnungszeit
    gloss: 'Daniel: A che ora apre la biblioteca?'
    note: '*What time does ...?* chiede un''ora precisa. Nella domanda c''è *does*, perciò si dice *open* senza -s.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Antwort zur Öffnungszeit
    gloss: 'Leila: Apre alle nove del mattino.'
    note: Una risposta completa dice l'ora precisa e il momento della giornata.
  en.a1.unit05.lesson04.teach.q_close:
    title: Nach der Schließzeit fragen
    gloss: 'Daniel: E a che ora chiude?'
    note: '*And* introduce la seconda domanda nella stessa conversazione.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Antwort zur Schließzeit
    gloss: 'Leila: Chiude alle diciotto (le sei di sera).'
    note: Anche qui una risposta completa dice l'ora precisa.
  en.a1.unit05.lesson04.teach.closing:
    title: Das Gespräch beenden
    gloss: 'Daniel: Perfetto, ci vediamo alle nove!'
    note: '*See you at nine!* significa che ci si rivede alle nove.'
