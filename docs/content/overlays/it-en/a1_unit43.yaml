  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: blu scuro
    note: '*dark blue* si scrive in inglese con due parole separate, come in italiano «blu scuro»; ma l''ordine è diverso: in inglese *dark* viene prima del colore.'
    example_gloss: Indossa una camicia blu scuro.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: verde chiaro
    note: '*light green* si scrive anch''esso con due parole separate, come *dark blue*; anche qui l''aggettivo *light* viene prima del colore, al contrario dell''italiano «verde chiaro».'
    example_gloss: Ha dipinto la sua camera di verde chiaro.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: sta bene con / si abbina a
    note: '*goes well with* significa che due colori o capi di abbigliamento stanno bene insieme.'
    example_gloss: Questa camicia blu sta bene con i pantaloni neri.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: troppo vivace
    note: '*too bright* significa troppo vivace o troppo appariscente come colore.'
    example_gloss: Il giallo è un colore allegro, ma è troppo vivace per il lavoro.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: Qual è il tuo colore preferito?
    note: '*What''s your favorite ...?* chiede la preferenza di una persona.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: Il mio colore preferito è il blu.
    note: '*My favorite ... is ...* è il modo fisso per dire una preferenza.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Mi serve una camicia nuova per la nostra presentazione della settimana prossima. Puoi aiutarmi a scegliere un colore?'
    note: '*Can you help me* + verbo*?* chiede aiuto.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: La domanda di Mia
    gloss: 'Mia dice: Certo! Che colori ti piacciono?'
    note: '*What colors do you like?* chiede quali colori preferisce una persona.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Mi piacciono il blu e il verde, ma non so bene che cosa faccia un''impressione professionale.'
    note: '*I''m not sure what looks professional* significa: non so bene che cosa faccia un''impressione professionale.'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Il consiglio di Mia
    gloss: 'Mia dice: Il blu scuro è un''ottima scelta. Fa un''impressione professionale e sta bene con i pantaloni neri.'
    note: '*It looks professional* significa: dà un''impressione professionale.'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: E questa gialla?'
    note: '*What about ...?* propone un''alternativa.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Il consiglio di Mia
    gloss: 'Mia dice: Il giallo è un colore allegro, ma è troppo vivace per una presentazione. Io sceglierei la camicia blu scuro.'
    note: '*I''d choose* significa: sceglierei.'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: La decisione di Daniel
    gloss: 'Daniel dice: Grazie, Mia. Allora blu scuro!'
    note: '*Dark blue it is!* è un modo informale per confermare una decisione.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Testo su tre colori preferiti
    gloss: Daniel, Leila e Mia hanno tutti un colore preferito diverso. Il colore preferito di Daniel è il blu. Dice che è un colore calmo e che sta bene con quasi tutto quello che indossa per andare al lavoro. Il colore preferito di Leila è il verde, il colore delle piante e dei giardini che ama dipingere. Pensa che il verde chiaro sia particolarmente bello. Il colore preferito di Mia è il giallo, perché le ricorda il sole e la rende sempre felice. Anche se amano colori diversi, sono d'accordo che i colori rendono ogni giorno più divertente.
    note: '*reminds her of the sun* significa: le ricorda il sole.'
