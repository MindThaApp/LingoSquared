  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Vorrei noleggiare una bicicletta, per favore.
    note: '*I''d like to* è una formula cortese, più gentile del diretto *I want*.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: Quanto costa all'ora?
    note: Nella domanda *does it cost*, l'inglese usa l'ausiliare *does*.
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: Mi serve una bicicletta piccola.
    note: '*need a small bike* corrisponde a mi serve una bicicletta piccola.'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: Posso avere un casco, per favore?
    note: '*Can I have ...?* è una formula cortese per chiedere qualcosa in un negozio.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: Quando devo restituirla?
    note: Nella domanda *do I need to*, l'inglese usa l'ausiliare *do*.
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: Costa dieci dollari all'ora.
    note: Qui *an hour* significa all'ora.
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: Il noleggiatore li saluta
    gloss: 'Il noleggiatore dice: Salve! Come posso aiutarvi oggi?'
    note: '*How can I help you today?* è una formula cortese comune nei negozi e nei servizi.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: La richiesta di Mia
    gloss: 'Mia dice: Vorremmo noleggiare due biciclette. Vogliamo pedalare lungo il fiume.'
    note: Qui *rent* indica prendere le biciclette a noleggio.
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: Il noleggiatore chiede la taglia
    gloss: 'Il noleggiatore dice: Certo. Di quale taglia avete bisogno?'
    note: '*What size do you need?* usa *do* per formare la domanda.'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: La taglia di Leila
    gloss: 'Leila dice: Me ne serve una piccola.'
    note: '*one* sostituisce *bike* per evitare di ripeterlo, come una in italiano.'
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: La taglia di Mia
    gloss: 'Mia dice: E a me ne serve una media.'
    note: Anche qui *one* sostituisce *bike*.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: Il prezzo e il deposito
    gloss: 'Il noleggiatore dice: Ottimo, ecco le vostre biciclette. Costano dieci dollari all''ora e il deposito è di venti dollari.'
    note: 'La frase dà due informazioni distinte: la tariffa oraria e il deposito.'
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia chiede quando restituirle
    gloss: 'Mia dice: Quando dobbiamo restituirle?'
    note: '*them* si riferisce alle biciclette, al plurale.'
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: L'orario di restituzione
    gloss: 'Il noleggiatore dice: Restituitele entro le cinque, per favore.'
    note: '*by five o''clock* significa entro le cinque, non più tardi.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila ringrazia il noleggiatore
    gloss: 'Leila dice: Ottimo, grazie!'
    note: '*Great, thank you!* è un modo breve e cortese di concludere.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Testo su un giro in bicicletta lungo il fiume
    gloss: 'In un caldo pomeriggio Mia invitò Leila a pedalare lungo il fiume vicino al suo appartamento. Nessuna delle due possedeva una bicicletta, così andarono insieme in un negozio di noleggio. L''addetto chiese quali taglie servissero: Leila prese una bicicletta piccola e Mia una media. Il noleggio costava dieci dollari all''ora e il deposito per entrambe era di venti dollari. Dovevano restituirle entro le cinque. Il percorso lungo il fiume era bellissimo e videro persone a passeggio con i cani che si godevano il sole. Restituirono le biciclette puntualmente e riebbero il deposito. Poi raccontarono il giro a Daniel, che disse di voler andare con loro la volta successiva.'
    note: '*owned* è il passato di *own*; *Neither of them owned a bike* significa nessuna delle due possedeva una bicicletta.'
