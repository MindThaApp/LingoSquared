teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: noleggiare
    note: '*rent* significa noleggiare. In inglese può indicare sia prendere sia dare qualcosa a noleggio; il contesto chiarisce il senso.'
    example_gloss: Voglio noleggiare una bicicletta.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: deposito cauzionale
    note: '*deposit* significa deposito cauzionale: denaro versato in anticipo e restituito se la bicicletta torna integra.'
    example_gloss: Il deposito è di venti dollari.
  en.a1.unit53.lesson01.teach.return:
