  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: Vorrei fissare un appuntamento.
    note: '*I''d* è la contrazione di I would, come il condizionale italiano vorrei: è un modo gentile di chiedere, più cortese di *I want*.'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: Sei libero venerdì?
    note: 'Con i giorni della settimana l''inglese usa sempre la preposizione *on*: *on Friday*. In italiano non serve nessuna preposizione (venerdì).'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: Quale orario va bene per te?
    note: '*works for you* qui significa va bene per te: è un''espressione fissa, non significa letteralmente lavorare.'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: Quell'orario va bene per me.
    note: '*That time works for me.* significa quell''orario va bene per me.'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: Possiamo spostarlo a lunedì?
    note: '*reschedule for ...* usa *for*, non *to*, per indicare la nuova data.'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: Il tuo appuntamento è confermato.
    note: '*Your appointment is confirmed.* significa il tuo appuntamento è confermato.'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: La domanda di Mia
    gloss: 'Mia chiede: Leila, Max sta bene? Ultimamente sembra un po'' stanco.'
    note: '*He seems a little tired lately.* significa ultimamente sembra un po'' stanco.'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: La spiegazione di Leila
    gloss: 'Leila dice: Sta bene, non preoccuparti. Ha solo la visita di controllo annuale in scadenza. Devo chiamare il veterinario.'
    note: '*due for* significa essere in scadenza per, essere il momento di fare qualcosa.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila chiama il veterinario
    gloss: 'Leila dice: Salve, vorrei fissare un appuntamento per la visita di controllo del mio cane.'
    note: '*I''d like to* è più gentile di *I want to*: corrisponde al nostro vorrei.'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: La domanda di Mia
    gloss: 'Mia chiede: Cos''hanno detto?'
    note: '*did they say* usa *did* come ausiliare del passato nelle domande.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Sono disponibili giovedì alle tre del pomeriggio.'
    note: '*at 3pm* usa *at* per un orario preciso.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: La domanda di conferma di Mia
    gloss: 'Mia chiede: Quell''orario va bene per te?'
    note: '*Does that time work for you?* è la forma interrogativa di that time works for you e richiede l''ausiliare *does*, che in italiano non esiste.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: La conferma di Leila
    gloss: 'Leila dice: Sì, va bene per me. Giovedì alle tre del pomeriggio, grazie! L''appuntamento di Max è confermato.'
    note: '*Max''s appointment* usa il genitivo sassone con ''s, mentre l''italiano usa di: l''appuntamento di Max.'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Testo su come fissare un appuntamento
    gloss: 'Come si fissa un appuntamento: se devi andare da un medico, da un dentista o da un altro servizio, di solito devi prima fissare un appuntamento. Telefona e di'' che vorresti fissare un appuntamento. L''addetto alla reception ti dirà quali giorni e quali orari sono disponibili. Scegli un orario che vada bene per te e confermeranno il tuo appuntamento. Se qualcosa cambia, richiama e chiedi di spostarlo. La settimana scorsa Leila ha chiamato il veterinario per fissare un appuntamento per la visita di controllo annuale del suo cane Max. Erano disponibili giovedì alle tre del pomeriggio e Leila ha confermato l''orario. Anche Daniel ha un appuntamento: lunedì mattina va dal dentista per un controllo. Ha detto che non è agitato, solo un po'' impegnato questa settimana.'
    note: '*a little busy this week* significa un po'' impegnato questa settimana.'
