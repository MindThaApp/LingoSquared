teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: cordiale / simpatico
    note: '*friendly* significa cordiale e facile con cui parlare.'
    example_gloss: Il mio vicino è molto cordiale.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: divertente / spiritoso
    note: '*funny* significa divertente: una persona che fa ridere gli altri.'
    example_gloss: Mio fratello è davvero divertente.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: lavoratore / che lavora sodo
    note: '*hardworking* significa lavoratore, una persona che non si arrende facilmente.'
    example_gloss: Lei è una dipendente che lavora sodo.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: timido
    note: '*shy* significa timido o nervoso con le persone nuove.'
    example_gloss: All'inizio è un po' timido.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: calmo / tranquillo
    note: '*calm* significa calmo: non si agita né si innervosisce facilmente.'
    example_gloss: Mia madre è molto calma.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: loquace / chiacchierone
    note: '*talkative* significa loquace: una persona che parla molto.'
    example_gloss: Mia sorella è molto chiacchierona.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: un po' timido
    note: '*a little* qui significa un po'' (grado), non piccolo (dimensione): non va tradotto alla lettera come «piccolo timido».'
    example_gloss: All'inizio è un po' timido, ma si apre in fretta.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: molto lavoratore
    note: '*very hardworking* significa molto lavoratore.'
    example_gloss: Il mio collega è molto lavoratore.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: avere un grande senso dell'umorismo
    note: '*have a great sense of humor* significa avere un grande senso dell''umorismo.'
    example_gloss: Daniel ha un grande senso dell'umorismo.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: andare d'accordo con tutti
    note: '*get along with everyone* significa andare d''accordo con tutti.'
    example_gloss: Mia va d'accordo con tutti al lavoro.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: sciogliersi in fretta / prendere confidenza in fretta
    note: '*warm up quickly* significa prendere confidenza in fretta con persone nuove.'
    example_gloss: È timido, ma si scioglie in fretta quando ti conosce.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: Com'è lui?
    note: '*What''s he like?* chiede com''è il carattere di una persona, non il suo aspetto.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: La domanda di Mia
    gloss: 'Mia chiede: La settimana prossima comincio un nuovo progetto con Daniel. Com''è?'
    note: '*What''s he like?* chiede com''è il carattere di una persona.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Risposta di Leila"
    gloss: 'Leila dice: È molto cordiale, e anche davvero divertente.'
    note: '*and he''s really funny too* significa: ed è anche davvero divertente.'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: La domanda di Mia
    gloss: 'Mia dice: Bene! È facile lavorare con lui?'
    note: '*Is he easy to work with?* chiede se è piacevole lavorare con una persona.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Sì, lavora anche molto. Finisce sempre i suoi compiti in tempo.'
    note: '*finishes his tasks on time* significa: finisce i suoi compiti in tempo.'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: La domanda di Mia
    gloss: 'Mia chiede: Ogni tanto è timido alle riunioni?'
    note: '*ever* qui significa: qualche volta, mai.'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Un po'', ma prende più confidenza quando ti conosce.'
    note: '*once he knows you* significa: quando ti conosce.'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Il ringraziamento di Mia
    gloss: 'Mia dice: Grazie, Leila. Ora sono più tranquilla riguardo al progetto.'
    note: '*I feel more relaxed* significa: mi sento più tranquilla, più rilassata.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Testo su tre personalità
    gloss: 'Daniel, Leila e Mia sono buoni amici, ma hanno personalità molto diverse. Daniel è cordiale e divertente: fa sempre ridere i suoi amici. È un po'' timido quando conosce persone nuove, ma si scioglie in fretta. Leila è calma e creativa. Ama dipingere perché la aiuta a rilassarsi, e si arrabbia raramente per qualcosa. Mia è estroversa e organizzata. Le piace fare programmi per il gruppo ed è molto paziente quando insegna qualcosa di nuovo ai suoi amici: ha insegnato a Daniel a cucinare. Anche se sono tutti diversi, vanno d''accordo e si divertono a passare il tempo insieme.'
    note: '*even though* significa: anche se, sebbene.'
