teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: appuntamento
    note: '*appointment* indica un appuntamento fissato, per esempio presso un ufficio pubblico.'
    example_gloss: Venerdì ho un appuntamento alla motorizzazione (ufficio per patenti e veicoli).
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: documento
    note: '*document* indica un documento ufficiale o uno scritto.'
    example_gloss: Porti per favore un documento come prova di residenza.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: prova di residenza
    note: '*proof of residency* indica un documento che mostra dove si abita.'
    example_gloss: Una bolletta della luce può servire come prova di residenza.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: modulo
    note: '*form* indica un modulo da compilare.'
    example_gloss: Compili per favore questo modulo prima dell'appuntamento.
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: numero di conferma
    note: '*confirmation number* indica il numero che conferma il tuo appuntamento.'
    example_gloss: Il Suo numero di conferma è 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: Volevo chiedere se potrei fissare un appuntamento.
    note: '*I was wondering whether...* è un modo cortese e formale per chiedere qualcosa.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: Sarebbe possibile venire questo venerdì?
    note: '*Would it be possible...?* è una richiesta molto cortese.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: Devo aggiornare il mio indirizzo perché mi sono trasferito il mese scorso.
    note: Con *because* si introduce una subordinata che indica la causa.
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: documento d'identità con foto
    note: '*photo ID* indica un documento con fotografia, per esempio una carta d''identità o una patente.'
    example_gloss: Le servono un documento d'identità con foto e una prova di residenza.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: bolletta di luce, gas o acqua
    note: '*utility bill* indica la bolletta della luce, del gas o dell''acqua.'
    example_gloss: Una bolletta della luce è un esempio comune di prova di residenza.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Testo dell'avviso
    gloss: Per aggiornare il Suo indirizzo, porti per favore un documento d'identità con foto e una prova di residenza, per esempio una bolletta. Se non ha una bolletta, può portare il contratto di locazione.
    note: 'Un avviso formale: dice che cosa deve portare e che cosa può portare in alternativa.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: Porterò un documento d'identità con foto.
    note: Con *will* si dice che cosa si farà (futuro).
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: Può dirmi che cosa devo portare?
    note: '*Could you tell me...?* è una domanda indiretta cortese. Dopo *what* l''ordine delle parole è quello normale: *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Chiedere quanto tempo
    gloss: 'L''impiegato chiede: Da quanto tempo abita al nuovo indirizzo?'
    note: '*How long have you lived...?* chiede da quanto tempo dura qualcosa. L''inglese usa qui il present perfect (*have lived*), mentre l''italiano usa il presente con «da». La risposta può iniziare con *since*: *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Dal mese scorso.'
    note: '*Since last month* significa «dal mese scorso». Qui basta una risposta breve.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Chiedere un appuntamento
    gloss: 'Daniel chiede: Sarebbe possibile venire questo venerdì?'
    note: La stessa domanda della seconda lezione.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Risposta dell'addetto
    gloss: 'L''impiegato dice: Sì, venerdì alle 10 va bene. Il Suo numero di conferma è 4471.'
    note: L'impiegato conferma l'orario e dice il numero di conferma.
