  en.a1.unit07.lesson03.teach.menu_text:
    title: Cafe Menu
    gloss: 'Menu del caffè: caffè - 3 dollari. Tè - 2 dollari. Zuppa - 5 dollari. Panino - 6 dollari.'
    note: Il simbolo del dollaro sta PRIMA del numero (*$3*), a differenza del simbolo dell'euro, che in italiano sta DOPO il numero.
  en.a1.unit07.lesson04.teach.thats_x_dollars:
    title: That's nine dollars.
    gloss: Fanno nove dollari.
    note: Nell'inglese americano si paga in *dollars*, non in euro; la struttura *That's X dollars* corrisponde all'italiano «Fanno X euro».
  en.a1.unit07.lesson04.teach.q_order:
    title: Leila ordina
    gloss: 'Leila: Salve, vorrei un caffè e un panino, per favore.'
    note: '*Hi* è un saluto informale, adatto a un bar.'
  en.a1.unit07.lesson04.teach.a_anything_else:
    title: Domanda di approfondimento del cameriere
    gloss: 'Cameriere: Certo. Altro?'
    note: '*Sure* qui significa «certo» o «volentieri».'
  en.a1.unit07.lesson04.teach.reply_thats_all:
    title: Risposta di Leila
    gloss: 'Leila: No, è tutto, grazie.'
    note: Una risposta completa conferma che l'ordinazione è finita.
  en.a1.unit07.lesson04.teach.q_for_here:
    title: Domanda del cameriere
    gloss: 'Cameriere: Qui o da portare via?'
    note: Questa domanda si sente spesso nei bar americani dopo l'ordinazione.
  en.a1.unit07.lesson04.teach.reply_for_here:
    title: Risposta di Leila
    gloss: 'Leila: Qui, per favore.'
    note: '*For here* indica che Leila vuole restare nel locale.'
  en.a1.unit07.lesson04.teach.closing_price:
    title: Conclusione del cameriere
    gloss: 'Cameriere: Va bene, fanno nove dollari.'
    note: '*OK* introduce l''indicazione finale del prezzo.'
