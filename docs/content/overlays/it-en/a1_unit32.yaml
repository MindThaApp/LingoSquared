    note: '*bird* significa uccello.'
    example_gloss: Abbiamo un uccello.
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: animale domestico
    note: '*pet* significa animale domestico; *pets* è il plurale. Fai attenzione ad *any* nella domanda *Do you have any pets?* In inglese si usa *any* nelle domande e nelle frasi negative con i plurali e con i nomi non numerabili. In italiano non c''è una parola corrispondente (*Hai animali domestici?* non contiene nulla di simile), ma in inglese *any* non si può omettere.'
    example_gloss: Hai animali domestici?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: Si chiama Luna.
    note: In inglese si usano *her*/*his* (e *she*/*he*) per un animale quando se ne conosce il sesso; altrimenti si usa *it*. In italiano il genere dipende dalla parola (il cane, la gatta). *Her name is Luna* parla dunque di un animale femmina.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: giocare
    note: '*play* significa giocare.'
    example_gloss: Al mio cane piace giocare.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: portare a spasso / camminare
    note: '*walk* qui significa portare a spasso il proprio animale.'
    example_gloss: Porto a spasso il mio cane ogni giorno.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: socievole / amichevole
    note: '*friendly* significa socievole, amichevole.'
    example_gloss: Il suo gatto è molto socievole.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: piccolo
    note: '*small* significa piccolo.'
    example_gloss: Il pesce è piccolo.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Mia, hai animali domestici?'
    note: In italiano la domanda non ha una parola corrispondente ad *any*, ma in inglese non si può omettere.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Sì, ho una gatta. Si chiama Luna.'
    note: '*She* e *her* per la gatta, perché se ne conosce il sesso (femmina). In inglese si usano questi pronomi per gli animali di cui si conosce il sesso.'
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: La domanda successiva di Daniel
    gloss: 'Daniel dice: Che bello! Le piace giocare?'
    note: '*Does* è qui l''ausiliare con *she* (do-support), come nelle domande sull''aspetto.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Sì, adora giocare con una palla. E tu?'
    note: '*What about you?* è un modo breve e naturale per rivolgere all''altra persona la stessa domanda.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Ho un pesciolino, ma voglio un cane.'
    note: '*but* collega qui due idee contrapposte: ha già un animale, ma ne vuole un altro.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Testo su Leila e Daniel
    gloss: Leila ha un cane di nome Max. È grande e molto socievole. Lo porta a spasso ogni mattina. Daniel non ha un cane, ma ha un pesciolino. Il pesce non ha bisogno di passeggiate, ma a Daniel piace comunque guardarlo nuotare.
    note: '*He* per Max, perché è un animale maschio. Anche qui si sceglie *she* o *he* in base al sesso reale dell''animale.'
