    title: The ATM is outside.
    gloss: Il bancomat è fuori.
    note: '*outside* sta alla fine: *is outside*.'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: Mia chiede del bancomat
    gloss: 'Mia dice: Ciao! Dov''è il bancomat?'
    note: '*Where is...?* chiede dove si trova qualcosa.'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: Dov'è il bancomat
    gloss: 'L''impiegato dice: Il bancomat è fuori.'
    note: '*outside* significa fuori.'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: Leila chiede della sua carta
    gloss: 'Leila dice: Posso usare questa carta?'
    note: '*this card* si riferisce alla carta che ha con sé.'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: La carta funziona
    gloss: 'L''impiegato dice: Sì, può usare quella carta.'
    note: '*Yes* significa sì; *that card* si riferisce alla carta di Leila.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Mia vuole controllare il saldo
    gloss: 'Mia dice: Voglio controllare il mio saldo.'
    note: '*want to check* usa *to* davanti al secondo verbo.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: Il PIN
    gloss: 'L''impiegato dice: Inserisca il suo PIN, per favore.'
    note: '*Please* rende la richiesta più cortese.'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: Anche Leila ha bisogno di contanti
    gloss: 'Leila dice: Mi servono dei contanti anche a me.'
    note: '*too* significa anche e qui sta alla fine.'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: Prelevare venti dollari
    gloss: 'L''impiegato dice: Può prelevare venti dollari.'
    note: '*take out* qui significa prelevare denaro.'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: Mia ringrazia l'impiegato
    gloss: 'Mia dice: Grazie! Mi è stato utile.'
    note: '*helpful* significa utile.'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: Avviso della banca
    gloss: 'Avviso della banca: aperta dalle 9:00 alle 16:00. Bancomat all''esterno. Limite di prelievo oggi: $100. Carte accettate.'
    note: L'avviso indica gli orari di apertura, dov'è il bancomat e il limite.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'Testo: una breve visita in banca'
    gloss: Una mattina Mia e Leila andarono insieme in banca. Mia voleva controllare il saldo e Leila aveva bisogno di contanti. L'impiegato disse che il bancomat era fuori. Leila usò la sua carta e prelevò venti dollari. Mia inserì il suo PIN e controllò il saldo. Prima di andare via, lessero l'avviso. La banca era aperta dalle 9:00 alle 16:00 e il limite di prelievo era di $100. Mia disse che la visita era stata facile.
    note: '*took out* è il passato di *take out* nel senso di prelevare denaro.'
