teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: sala cinematografica
    note: '*cinema* significa sala cinematografica.'
    example_gloss: Questo cinema è molto frequentato.
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: biglietto
    note: '*ticket* significa biglietto.'
    example_gloss: Devo comprare un biglietto.
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: orario dello spettacolo
    note: '*showtime* significa orario dello spettacolo, cioè il momento in cui inizia il film.'
    example_gloss: A che ora è lo spettacolo del film?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: posto a sedere
    note: '*seat* significa sedia o posto a sedere.'
    example_gloss: Questo posto è libero?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: schermo
    note: '*screen* significa schermo.'
    example_gloss: Lo schermo è molto grande.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: mais soffiato
    note: '*popcorn* significa mais soffiato, lo snack che si mangia al cinema.'
    example_gloss: Compriamo sempre i popcorn al cinema.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: A che ora inizia il film?
    note: '*does the film start* usa l''ausiliare *does* per formare la domanda, perché il verbo principale è *start*.'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Due biglietti per lo spettacolo delle sette, per favore.
    note: '*for the seven o''clock show* collega i biglietti a uno spettacolo preciso.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: Posso avere dei popcorn, per favore?
    note: '*Can I have...?* è un modo diretto e molto comune per ordinare qualcosa.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: Quanto fa in totale?
    note: '*in total* significa in totale; si usa per chiedere il prezzo finale.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: Sono venti dollari, per favore.
    note: '*That''s* + prezzo è il modo abituale per dire quanto costa qualcosa.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: Mi è piaciuto davvero!
    note: 'In inglese si usa il verbo *like* con *it* come complemento oggetto: chi parla è il soggetto (*I liked it*). In italiano è la cosa a essere il soggetto (mi è piaciuto). Impara questa frase come un blocco unico, non parola per parola.'
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel chiede l'orario dello spettacolo
    gloss: 'Daniel dice: Ciao! A che ora inizia il film?'
    note: '*does the film start* usa l''ausiliare *does* per formare la domanda.'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: L'orario dello spettacolo
    gloss: 'Il cassiere dice: Il prossimo spettacolo è alle sette.'
    note: '*at seven o''clock* usa la preposizione *at* per indicare un''ora precisa; in italiano si dice «alle sette».'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel compra i biglietti
    gloss: 'Daniel dice: Perfetto. Possiamo avere due biglietti, per favore?'
    note: 'Un solo dato: il numero di biglietti (due).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: Il prezzo dei biglietti
    gloss: 'Il cassiere dice: Certo. Sono sedici dollari.'
    note: 'Un solo dato: il prezzo dei due biglietti insieme.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila ordina i popcorn
    gloss: 'Leila dice: Possiamo avere dei popcorn, per favore?'
    note: Una richiesta, non un nuovo prezzo.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: Il prezzo dei popcorn
    gloss: 'Il cassiere dice: Certo. I popcorn costano quattro dollari.'
    note: 'Un secondo dato: il prezzo dei popcorn, separato da quello dei biglietti.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel chiede il totale
    gloss: 'Daniel dice: Quanto fa in totale?'
    note: '*in total* chiede la somma di tutti i prezzi.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: Il totale
    gloss: 'Il cassiere dice: Sono venti dollari, per favore.'
    note: 'Un terzo dato: il totale, diverso dai prezzi separati di biglietti e popcorn.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila non vede l'ora
    gloss: 'Leila dice: Grazie! Non vedo l''ora di vederlo.'
    note: '*I can''t wait to...* è un''espressione fissa per mostrare entusiasmo.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Programma del cinema
    gloss: 'Programma del cinema: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: Il programma mostra tre film con il loro orario e il loro prezzo.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Testo: una serata al cinema'
    gloss: 'Una sera Daniel e Leila decisero di andare insieme a vedere un film al cinema. Chiesero a che ora iniziava e il cassiere disse che il prossimo spettacolo, Star Journey, era alle sette. Comprarono due biglietti per sedici dollari e un sacchetto di popcorn per quattro dollari. In totale furono venti dollari. Guardarono il film insieme: parlava di esploratori dello spazio ed era molto divertente. Quando finì, Leila disse che le era piaciuto davvero, e Daniel disse che vuole vedere anche il prossimo.'
    note: '*watched* è il passato di *watch* (guardare).'
