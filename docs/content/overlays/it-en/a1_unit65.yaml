    gloss: Voglio restituire questo.
    note: '*I want to return this* è una frase diretta da usare al banco resi.'
  en.a1.unit65.lesson02.teach.can_exchange:
    title: Can I exchange it?
    gloss: Posso cambiarlo?
    note: '*Can I...?* chiede se una cosa è possibile o permessa.'
