    gloss: Questa taglia è troppo piccola.
    note: '*too small* significa troppo piccolo.'
  en.a1.unit65.lesson02.teach.larger_size:
    title: I need a larger size.
    gloss: Mi serve una taglia più grande.
    note: '*larger* significa più grande.'
  en.a1.unit65.lesson02.teach.get_refund:
    title: You can get a refund.
    gloss: Puoi avere il rimborso.
    note: '*get a refund* significa ricevere indietro i soldi.'
  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: Daniel vuole restituire qualcosa
    gloss: 'Daniel dice: Salve. Voglio restituire questa camicia.'
    note: '*return this shirt* significa restituire questa camicia.'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: L'addetto chiede lo scontrino
    gloss: 'L''addetto dice: Ha lo scontrino?'
    note: '*Do you have...?* chiede se qualcuno ha con sé una cosa.'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: Daniel ha lo scontrino
    gloss: 'Daniel dice: Sì, eccolo. La taglia è troppo piccola.'
    note: '*Here it is* significa eccolo.'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: L'addetto propone il cambio
    gloss: 'L''addetto dice: Possiamo cambiarla con una taglia più grande.'
    note: '*for a larger size* dice con che cosa si cambia l''articolo.'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "Daniel dice di sì"
    gloss: 'Daniel dice: Sì, grazie.'
    note: '*Yes, please* è un modo cortese di accettare.'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: C'è una taglia più grande
    gloss: 'L''addetto dice: Abbiamo una taglia più grande in blu.'
    note: '*We have...* dice che cosa è disponibile.'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: Daniel non vuole il rimborso
    gloss: 'Daniel dice: Perfetto. Non mi serve il rimborso.'
    note: '*I do not need* significa non mi serve.'
  en.a1.unit65.lesson04.teach.return_note:
    title: Tagliando di reso
    gloss: 'Tagliando di reso: camicia blu. Taglia piccola. Cambio con taglia più grande. Scontrino obbligatorio.'
    note: Il tagliando indica l'articolo, la taglia, l'azione e lo scontrino.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'Testo: un cambio in negozio'
    gloss: 'Un cambio in negozio: Daniel ha comprato una camicia blu, ma la taglia era troppo piccola. È tornato in negozio con lo scontrino. L''addetto ha chiesto lo scontrino e ha proposto una taglia più grande. Daniel ha cambiato la camicia. Non gli serviva il rimborso, perché la camicia blu più grande andava bene.'
    note: '*exchanged* è il passato di *exchange*.'
