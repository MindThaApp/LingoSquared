teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: essere in grado di / potere
    note: '*be able to* significa avere la capacità o l''occasione di fare qualcosa.'
    example_gloss: Posso rinnovare la mia patente online.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: riuscire a fare qualcosa
    note: '*manage to* significa che qualcosa riesce, spesso nonostante un po'' di fatica.'
    example_gloss: Sono riuscito a compilare il modulo in dieci minuti.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: rinnovare / prolungare
    note: '*renew* significa rinnovare un documento prima che scada.'
    example_gloss: Devo rinnovare la mia patente.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: patente
    note: '*license* qui indica un documento ufficiale che permette di guidare (abbreviazione di *driver''s license*). L''inglese britannico scrive il nome *licence*.'
    example_gloss: La mia patente scade questo mese.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: online
    note: '*online* significa tramite internet, non in un luogo fisico.'
    example_gloss: Ora si può rinnovare online.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: di persona / allo sportello
    note: '*in person* significa andare personalmente in un posto, non online.'
    example_gloss: L'anno scorso sono dovuto andare di persona.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: eine gegenwärtige Möglichkeit ausdrücken
    gloss: Ora posso rinnovare la mia patente online.
    note: '*I am able to* esprime una possibilità nel presente.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: eine vergangene Möglichkeit verneinen
    gloss: L'anno scorso non sono riuscito a farlo online.
    note: '*was not able to* esprime che nel passato non c''era la possibilità.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: sagen, dass etwas gelungen ist
    gloss: Sono riuscito a compilare il modulo in dieci minuti.
    note: '*managed to* sottolinea che qualcosa è riuscito, spesso nonostante la fatica.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Gegenwart und Vergangenheit mit 'be able to'
    gloss: Posso rinnovarla. Ho potuto rinnovarla. Potrei aiutarti.
    note: '*am able to* (adesso), *was able to* (passato), *would be able to* (ipotetico o come offerta) sono forme della stessa costruzione.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: amico / amica
    note: '*friend* significa amico o amica.'
    example_gloss: La mia amica ha rinnovato la sua patente la settimana scorsa.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: sistema
    note: '*system* indica un modo organizzato di fare qualcosa.'
    example_gloss: Il nuovo sistema è molto più veloce.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue System'
    gloss: L'anno scorso la gente non poteva rinnovare la patente online. Tutti dovevano andare di persona in ufficio. Quest'anno il sistema è cambiato. Ora si può rinnovare tutto da casa. La mia amica Mia è riuscita a sbrigare la sua in dieci minuti.
    note: Un breve testo di lettura su come il nuovo sistema semplifica i rinnovi.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila fragt nach dem Führerschein
    gloss: 'Leila dice: Sei riuscito a rinnovare la patente online?'
    note: '*were you able to* chiede di una possibilità nel passato.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'Daniels Antwort: online ging es nicht'
    gloss: 'Daniel dice: No, non ci sono riuscito. Sono dovuto andare di persona in ufficio.'
    note: '*wasn''t able to* è la forma abbreviata parlata di *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila erzählt von ihrer Erfahrung
    gloss: 'Leila dice: Davvero? Io sono riuscita a farlo online in dieci minuti.'
    note: '*managed to* sottolinea che a Leila è riuscito in modo rapido e senza problemi.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Daniel denkt an nächstes Mal
    gloss: 'Daniel dice: La prossima volta potrei risparmiare tempo se lo facessi anch''io online.'
    note: '*would be able to* qui esprime una possibilità ipotetica nel futuro.'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila bietet Hilfe an
    gloss: 'Leila dice: La prossima volta potrei aiutarti, se vuoi.'
    note: '*would be able to* qui si usa per un''offerta cortese.'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel bedankt sich
    gloss: 'Daniel dice: Grazie, mi farebbe piacere.'
    note: '*I''d like that* è un modo naturale di accettare un''offerta con gratitudine.'
