course:
  title: Inglese A2
  description: Impara l'inglese a livello A2, per situazioni quotidiane un po' più formali, con spiegazioni dettagliate in italiano.
units:
  en.a2.unit39.after_the_interview:
    title: Dopo il colloquio di lavoro
lessons:
  en.a2.unit39.lesson01.offer_vocabulary:
    title: Offerta, contratto e data di inizio
  en.a2.unit39.lesson02.following_up:
    title: Fare un follow-up e accettare l'offerta
  en.a2.unit39.lesson03.reading_an_offer_message:
