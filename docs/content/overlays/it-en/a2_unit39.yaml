teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: offerta
    note: '*offer* qui è l''offerta per un posto di lavoro. Come verbo, *to offer* significa offrire, proporre.'
    example_gloss: Ho ricevuto un'offerta di lavoro da Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: contratto di lavoro, contratto
    note: '*contract* è l''accordo scritto tra te e l''azienda.'
    example_gloss: Il contratto dura un anno.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: stipendio
    note: '*salary* è la somma che si guadagna al mese o all''anno.'
    example_gloss: Dello stipendio possiamo parlare la prossima settimana.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: accettare
    note: '*accept* significa dire di sì a qualcosa che ti viene offerto.'
    example_gloss: Vorrei accettare il posto.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: data di inizio
    note: '*start date* è il primo giorno nel tuo nuovo lavoro.'
    example_gloss: La data di inizio è il primo lunedì del mese.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: risposta
    note: '*reply* è sia la risposta a un messaggio sia il verbo rispondere.'
    example_gloss: Ho mandato una risposta lo stesso giorno.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to für einen höflichen Wunsch
    gloss: Vorrei accettare l'offerta. Vorrei iniziare lunedì.
    note: '*I would like to ...* è più cortese di *I want to ...* e si addice ai contatti di lavoro.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Die Nachricht beginnen
    gloss: Grazie per il colloquio di ieri.
    note: '*Thank you for ...* è l''inizio abituale di un breve messaggio di ringraziamento in ambito lavorativo.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Sagen, dass Sie weiterhin interessiert sind
    gloss: Sono ancora molto interessato al posto.
    note: '*still* significa ancora e sta davanti all''aggettivo.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Höflich nach dem Starttermin fragen
    gloss: Potrebbe dirmi la data di inizio?
    note: '*Could you tell me ...?* è una domanda indiretta ed è più cortese di *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Das Angebot annehmen
    gloss: Vorrei accettare l'offerta.
    note: È la frase standard con cui si accetta un posto di lavoro.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Indirekte Fragen mit Could you tell me
    gloss: Potrebbe dirmi la data di inizio? Potrebbe dirmi qualcosa sull'orario di lavoro?
    note: 'Dopo *Could you tell me* non c''è più l''ordine delle parole della domanda: si dice *the start date*, non *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: a tempo pieno
    note: '*full time* significa una settimana lavorativa completa; il contrario è *part time* (a tempo parziale).'
    example_gloss: Il posto è a tempo pieno, non solo due giorni a settimana.
  en.a2.unit39.lesson03.teach.offer_message:
    title: Die Nachricht mit dem Angebot
    gloss: Cara Mia, grazie per essere venuta martedì. Vorremmo offrirLe il posto di coordinatrice di marketing. Il contratto è a tempo pieno e la data di inizio è lunedì. Risponda per favore entro venerdì. Bright Path Marketing.
    note: 'Un messaggio con un''offerta di lavoro indica sempre quattro cose: il posto, il tipo di contratto, la data di inizio e il termine per la risposta.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: Die Antwortfrist
    gloss: Risponda per favore entro venerdì.
    note: '*by Friday* significa al più tardi venerdì, quindi anche venerdì stesso va bene.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: Die Interviewerin ruft Mia an
    gloss: 'La selezionatrice dice: Salve Mia, La chiamo per il colloquio di martedì.'
    note: '*I am calling about ...* è l''apertura abituale di una telefonata di lavoro.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia sagt, dass sie weiterhin interessiert ist
    gloss: 'Mia dice: Grazie della chiamata. Sono ancora molto interessata al posto.'
    note: La stessa frase della lezione 2.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: Die Interviewerin bietet die Stelle an
    gloss: 'La selezionatrice dice: Bene, perché vorremmo offrirLe il posto.'
    note: '*because* collega qui la risposta di Mia alla buona notizia che segue.'
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia reagiert und fragt nach dem Starttermin
    gloss: 'Mia dice: Che bella notizia. Potrebbe dirmi la data di inizio?'
    note: Prima si reagisce brevemente alla notizia, poi si fa la domanda.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: Die Interviewerin nennt Termin und Vertrag
    gloss: 'La selezionatrice dice: La data di inizio è lunedì e il contratto è a tempo pieno.'
    note: Gli stessi due fatti del messaggio della lezione 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia fragt nach den Arbeitszeiten
    gloss: 'Mia chiede: Potrebbe dirmi qualcosa sull''orario di lavoro?'
    note: La stessa forma di domanda indiretta usata per la data di inizio.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: Die Interviewerin nennt die Arbeitszeiten
    gloss: 'La selezionatrice dice: Dalle nove alle diciassette, con un''ora per il pranzo.'
    note: '*from nine to five* è l''espressione fissa per descrivere una giornata lavorativa.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia nimmt das Angebot an
    gloss: 'Mia dice: Grazie. Vorrei accettare l''offerta.'
    note: La stessa frase della lezione 2.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: Die Interviewerin beendet das Gespräch
    gloss: 'La selezionatrice dice: Perfetto. Le mandiamo il contratto oggi stesso.'
    note: '*Wonderful* è una reazione calorosa e positiva, comune anche nell''inglese professionale.'
