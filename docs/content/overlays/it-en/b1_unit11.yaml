teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: condizionale (farei, andrei…)
    note: '*would* + forma base esprime un risultato immaginato o una preferenza cortese.'
    example_gloss: Parteciperei, se avessi più tempo.
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: preferire, volere piuttosto
    note: '*would rather* significa che si preferisce fare una cosa piuttosto che un''altra.'
    example_gloss: Preferirei seguire il corso del fine settimana.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: se io fossi
    note: '*if I were* introduce una situazione irreale che riguarda se stessi.'
    example_gloss: Se stasera fossi libero, ci andrei.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: occasione, opportunità
    note: '*opportunity* indica una buona occasione per fare qualcosa.'
    example_gloss: Questo corso è una buona occasione per Leila.
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: rimpianto, rammarico
    note: '*regret* indica rimpianto o rammarico per una decisione nel passato.'
    example_gloss: 'Ha un solo rimpianto: non aver risparmiato prima.'
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: rischiare, provarci
    note: '*take a chance* significa provare qualcosa anche se il successo non è garantito.'
    example_gloss: Se il corso costasse meno, ci proverebbe.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: Una situazione irreale nel presente
    gloss: Se avessi più tempo, seguirei un corso di design.
    note: 'Per una situazione irreale nel presente, dopo *if* si usa il passato: *If I had more time*. Corrisponde al congiuntivo imperfetto italiano («se avessi», «se fosse»).'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: Se costasse meno, mi iscriverei oggi.
    note: '*were* suona naturale in una condizione irreale, anche con *it*.'
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Condizioni irreali nel presente
    gloss: Se costasse meno, mi iscriverei.
    note: 'Forma: *if* + passato, poi *would* + forma base.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: prima
    note: '*sooner* significa prima del momento in cui qualcosa è effettivamente accaduto.'
    example_gloss: Se l'avesse saputo prima, avrebbe risparmiato di più.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: sicuro di sé, fiducioso
    note: '*confident* significa avere la sensazione di saper fare bene qualcosa.'
    example_gloss: Se Daniel partecipasse, Leila si sentirebbe più sicura di sé.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Testo: un''occasione mancata'
    gloss: 'Leila ha trovato un corso di design che desidera tanto frequentare. È utile, ma costa caro. Se costasse meno, si iscriverebbe oggi. Se anche Daniel partecipasse al corso, si sentirebbe più sicura di sé. Il suo unico rimpianto è il tempismo: se avesse saputo prima del corso, avrebbe risparmiato di più.'
    note: Un breve testo di lettura con condizioni irreali nel presente e nel passato.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia fa una domanda ipotetica
    gloss: 'Mia dice: Leila, seguiresti il corso di design se costasse meno?'
    note: Una domanda ipotetica e cortese con *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila dice il risultato immaginato
    gloss: 'Leila dice: Senz''altro. Se costasse meno, mi iscriverei oggi.'
    note: '*If it were cheaper, I would...* descrive che cosa farebbe in un''altra situazione.'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia propone un altro scenario
    gloss: 'Mia dice: E se partecipasse anche Daniel?'
    note: '*What if...* introduce una possibilità immaginata.'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila descrive come si sente
    gloss: 'Leila dice: Se partecipasse Daniel, mi sentirei più sicura di me.'
    note: '*joined* è al passato perché la situazione è solo immaginata.'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia dice la sua preferenza
    gloss: 'Mia dice: Preferirei seguire il corso del fine settimana piuttosto che quello serale.'
    note: '*would rather ... than ...* confronta due preferenze.'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila parla di un rimpianto del passato
    gloss: 'Leila dice: Anch''io. Se l''avessi saputo prima, avrei risparmiato di più.'
    note: '*if + past perfect, would have + participio* descrive una situazione irreale nel passato.'
