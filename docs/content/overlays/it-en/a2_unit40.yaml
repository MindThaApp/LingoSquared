teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: ordine
    note: '*order* è l''ordine stesso. Come verbo, *to order* significa ordinare.'
    example_gloss: Il mio ordine è arrivato con due giorni di ritardo.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: consegna
    note: '*delivery* è il momento in cui il tuo ordine viene portato a casa tua.'
    example_gloss: La consegna è arrivata martedì mattina.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: pacco
    note: '*parcel* è il pacco imballato che viene lasciato alla tua porta.'
    example_gloss: Il pacco è stato lasciato fuori dalla mia porta.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: danneggiato
    note: '*damaged* dice che qualcosa si è danneggiato durante il trasporto, ma magari funziona ancora. Di solito si dice dell''imballaggio.'
    example_gloss: La scatola era danneggiata quando è arrivata.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: rotto
    note: '*broken* è più forte di *damaged*: la cosa non funziona più.'
    example_gloss: La lampada nel pacco era rotta.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: sostituzione, articolo sostitutivo
    note: '*replacement* è un nuovo esemplare al posto di quello rotto. *refund* è il rimborso del denaro.'
    example_gloss: Ho chiesto una sostituzione invece del rimborso.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived e has not arrived yet
    gloss: Il mio ordine è arrivato ieri. Il mio ordine non è ancora arrivato.
    note: '*arrived* si usa con un momento nel passato. *has not arrived yet* dice che stai ancora aspettando adesso.'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Dire per cosa si chiama
    gloss: Vorrei segnalare un problema con il mio ordine.
    note: '*I''d like to report a problem with ...* è la stessa forma cortese usata per la perdita nell''unità 29.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Dire cosa non va
    gloss: La lampada è arrivata rotta.
    note: '*arrived broken* significa: era già rotta quando è arrivata.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Scegliere tra sostituzione e rimborso
    gloss: Potrei avere una sostituzione invece del rimborso?
    note: '*instead of* mette a confronto due possibilità: scegli la prima, non la seconda.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Dire il numero del proprio ordine
    gloss: Il numero del mio ordine è 8154.
    note: Di' subito il numero dell'ordine quando te lo chiedono; così l'addetto trova il tuo ordine.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of per scegliere
    gloss: Potrei avere una sostituzione invece del rimborso? Vorrei il rimborso invece del cambio.
    note: 'Dopo *instead of* c''è un nome o una forma in -ing (*instead of a refund*, *instead of getting a refund*), mai la forma base del verbo: non *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: scatola
    note: '*box* è la scatola in cui c''è il tuo ordine. *parcel* è tutto il pacco com''è consegnato.'
    example_gloss: La lampada era in una grande scatola.
  en.a2.unit40.lesson03.teach.return_message:
    title: La risposta del negozio
    gloss: Grazie per il Suo messaggio. Ci dispiace che la Sua lampada sia arrivata rotta. Rimetta per favore la lampada nella scatola e la porti all'ufficio postale. Una nuova lampada verrà spedita entro tre giorni lavorativi. Numero d'ordine 8154.
    note: 'Una risposta del servizio clienti indica sempre: il problema, che cosa deve fare Lei e che cosa farà il negozio.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Cosa fare con la lampada rotta
    gloss: Rimetta per favore la lampada nella scatola e la porti all'ufficio postale.
    note: '*put ... back in ...* significa rimettere qualcosa dove si trovava.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila chiama il negozio online
    gloss: 'Leila dice: Buongiorno, vorrei segnalare un problema con il mio ordine.'
    note: Al telefono si dice subito il motivo della chiamata.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: L'addetto chiede conferma
    gloss: 'L''addetto dice: Mi dispiace. Qual è il problema?'
    note: '*I''m sorry to hear that* è la reazione fissa e cortese di un addetto davanti a una brutta notizia.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila spiega il problema
    gloss: 'Leila dice: La lampada è arrivata rotta. La scatola era danneggiata.'
    note: 'Fai attenzione alla differenza: la scatola è *damaged*, la lampada è *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: L'addetto chiede il numero dell'ordine
    gloss: 'L''addetto dice: Capisco. Potrebbe dirmi il numero del Suo ordine?'
    note: La stessa forma di domanda indiretta *Could you tell me ...?* dell'unità 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila dice il numero del suo ordine
    gloss: 'Leila dice: Il numero del mio ordine è 8154.'
    note: La stessa frase della lezione 2.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: L'addetto propone due possibilità
    gloss: 'L''addetto dice: Grazie. Vuole il rimborso o una sostituzione?'
    note: '*or* mette qui due possibilità una accanto all''altra; ne scegli una.'
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila sceglie la sostituzione
    gloss: 'Leila dice: Potrei avere una sostituzione invece del rimborso?'
    note: La stessa domanda della lezione 2.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: L'addetto risolve la questione
    gloss: 'L''addetto dice: Certamente. Una nuova lampada verrà spedita entro tre giorni lavorativi.'
    note: La stessa promessa del messaggio della lezione 3.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila ringrazia l'addetto
    gloss: 'Leila dice: Grazie mille.'
    note: '*very much* rende il ringraziamento un po'' più sentito.'
