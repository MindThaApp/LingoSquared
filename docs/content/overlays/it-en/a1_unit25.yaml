    note: '*always* significa sempre; in inglese si mette prima del verbo: *I always go running*.'
  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: spesso
    note: '*often* significa spesso. Nota la posizione dell''avverbio in inglese: va tra il soggetto e il verbo, *She often cooks dinner* (soggetto, *often*, verbo). In italiano l''avverbio si sposta con più libertà (Spesso cucina la cena per la sua famiglia, Cucina spesso la cena...), mentre in inglese il soggetto resta davanti al verbo e l''avverbio non va dopo il verbo e il suo complemento.'
  en.a1.unit30.lesson02.teach.sometimes:
    title: sometimes
    gloss: a volte
    note: '*sometimes* significa a volte. In italiano puoi dire A volte vado a correre oppure Vado a correre a volte; in inglese di solito *sometimes* si mette all''inizio o prima del verbo, ma il soggetto precede sempre il verbo: *Sometimes I go running*. Non si inverte mai l''ordine soggetto-verbo.'
  en.a1.unit30.lesson02.teach.rarely:
    title: rarely
    gloss: raramente
    note: '*rarely* significa raramente.'
  en.a1.unit30.lesson02.teach.never:
    title: never
    gloss: mai
    note: '*never* significa mai.'
  en.a1.unit30.lesson02.teach.free_time_question:
