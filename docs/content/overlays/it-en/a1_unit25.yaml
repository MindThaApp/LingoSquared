    gloss: Che cosa fai nel tempo libero?
    note: '*free time* significa tempo libero.'
  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: Mi piace leggere.
    note: '*I like* + un verbo in *-ing* si usa per dire che qualcosa ti piace.'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: La domanda di Leila
    gloss: 'Leila chiede: Che cosa fai nel tuo tempo libero, Daniel?'
    note: Leila apre la conversazione con una domanda diretta a Daniel.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Vado spesso a correre. E a volte cucino. E tu?'
    note: Daniel nomina due hobby con la loro frequenza e rilancia la domanda con *What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila parla di pittura
    gloss: 'Leila dice: Adoro dipingere. Dipingo quasi ogni fine settimana.'
    note: '*almost every weekend* significa quasi ogni fine settimana.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: La domanda successiva di Daniel
    gloss: 'Daniel dice: Fantastico! Giochi mai ai videogiochi?'
    note: '*Do you ever...?* si usa per chiedere se qualcuno fa qualcosa qualche volta.'
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: L'ultima risposta di Leila
    gloss: 'Leila dice: Raramente. Preferisco leggere un libro.'
    note: '*I prefer...* significa: preferisco..., amo di più...'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Testo sugli hobby
    gloss: Daniel e Leila hanno hobby diversi. Daniel va sempre a correre il sabato mattina e a volte cucina per i suoi amici. Leila non va mai a correre, ma dipinge spesso nel fine settimana. A tutti e due piacciono i videogiochi, ma raramente giocano insieme.
    note: Questo testo mette a confronto gli hobby di Daniel e Leila e la frequenza con cui li praticano.
