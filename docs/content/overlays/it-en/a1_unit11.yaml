  en.a1.unit11.lesson02.teach.whats_weather_like:
    title: What's the weather like today?
    gloss: Che tempo fa oggi?
    note: '*What''s the weather like?* è la domanda standard sul tempo.'
  en.a1.unit11.lesson02.teach.its_sunny:
    title: It's sunny and warm.
    gloss: C'è il sole e fa tiepido.
    note: '*It''s* + aggettivo descrive il tempo attuale.'
  en.a1.unit11.lesson02.teach.its_raining:
    title: It's raining.
    gloss: Sta piovendo.
    note: '*It''s raining* è al present progressive; in italiano si usa «sta piovendo» (stare + gerundio), una costruzione simile.'
  en.a1.unit11.lesson02.teach.take_umbrella:
    title: You should take an umbrella.
    gloss: Dovresti prendere un ombrello.
    note: '*should* esprime un consiglio, come il condizionale «dovresti» in italiano.'
  en.a1.unit11.lesson03.teach.tomorrow:
    title: tomorrow
    gloss: domani
    note: '*tomorrow* significa domani (il giorno successivo).'
    example_gloss: Ci vediamo domani.
  en.a1.unit11.lesson03.teach.forecast_text:
    title: Previsioni del tempo
    gloss: Domani ci sarà il sole e farà tiepido. Sabato pioverà.
    note: '*will* + verbo forma il futuro inglese, un po'' come il futuro semplice italiano («pioverà»).'
  en.a1.unit11.lesson04.teach.lets_go:
    title: Let's go to the park.
    gloss: Andiamo al parco.
    note: '*Let''s* + verbo significa «andiamo a...», «facciamo...»: è un invito o un suggerimento.'
  en.a1.unit11.lesson04.teach.q_weather:
    title: Domanda di Leila
    gloss: 'Leila: Che tempo fa oggi?'
    note: Leila apre la conversazione con una domanda sul tempo.
  en.a1.unit11.lesson04.teach.a_sunny_warm:
    title: Risposta di Daniel
    gloss: 'Daniel: C''è il sole e fa tiepido.'
    note: Daniel descrive il tempo attuale.
  en.a1.unit11.lesson04.teach.suggest_park:
    title: Proposta di Leila
    gloss: 'Leila: Bene, andiamo al parco.'
    note: '*Great* esprime entusiasmo per il bel tempo.'
  en.a1.unit11.lesson04.teach.agree_rain_tomorrow:
    title: Risposta di Daniel
    gloss: 'Daniel: Buona idea. Ma sabato pioverà, quindi andiamo oggi.'
    note: '*so* collega il motivo (pioggia di sabato) alla conseguenza (andare oggi).'
