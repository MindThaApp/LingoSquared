  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: La proposta di Leila
    gloss: 'Leila dice: Devo restituire questo libro alla biblioteca. Vuoi venire con me?'
    note: '*Do you want to come with me?* significa vuoi venire con me?'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: La risposta di Daniel
    gloss: 'Daniel dice: Certo! Non credo di aver mai preso in prestito un libro da una biblioteca prima d''ora.'
    note: '*I don''t think I''ve ever ...* significa non credo di aver mai ..., con il present perfect (*have ever*).'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila al bancone
    gloss: 'Leila dice: Salve, vorrei restituire questo libro e vorrei anche prenderne in prestito uno nuovo.'
    note: '*and I''d like to ... too* significa e vorrei anche ...'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: Chiede la bibliotecaria
    gloss: 'La bibliotecaria dice: Perfetto, grazie. Hai la tua tessera della biblioteca?'
    note: '*Do you have your library card?* significa hai la tua tessera della biblioteca?'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Sì, eccola.'
    note: '*here it is* significa eccolo / eccola.'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: Spiega la bibliotecaria
    gloss: 'La bibliotecaria dice: Perfetto. Questo libro nuovo va restituito entro tre settimane.'
    note: '*due back in three weeks* significa da restituire entro tre settimane.'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Anche Daniel vuole un prestito
    gloss: 'Daniel dice: Posso avere anch''io una tessera della biblioteca? Vorrei prendere in prestito un libro di cucina.'
    note: '*Can I get ... too?* significa posso avere anch''io ...?'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: La bibliotecaria aiuta Daniel
    gloss: 'La bibliotecaria dice: Certo! Basta compilare questo modulo.'
    note: '*fill out this form* significa compilare questo modulo; *fill out* è un phrasal verb, cioè un verbo seguito da una particella, che in italiano corrisponde a un solo verbo (compilare).'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Testo su come funziona una biblioteca
    gloss: 'Una visita in biblioteca: la maggior parte delle biblioteche permette di prendere in prestito libri, e a volte anche altri oggetti, per qualche settimana alla volta. Per prendere in prestito qualcosa di solito serve una tessera della biblioteca. Quando prendi in prestito un libro, il bibliotecario ti dice la data di scadenza, cioè il giorno in cui devi restituirlo. Se per quella data non hai finito, spesso puoi chiedere al bibliotecario più tempo. Da quando Leila si è trasferita nel suo nuovo appartamento, non ha più tanti libri come prima, perciò ha iniziato a prenderli in prestito in biblioteca. La settimana scorsa ha restituito un libro e ne ha ritirato uno nuovo, e il suo amico Daniel è andato con lei. Non aveva mai preso in prestito un libro dalla biblioteca, quindi ha fatto la sua tessera e ha preso un libro di cucina per fare pratica con le ricette che gli insegna Mia. Il bibliotecario ha ricordato a entrambi di riportare i libri prima della scadenza. Mia non va spesso in biblioteca, ma una volta ha preso in prestito un libro di fotografia per il suo corso.'
    note: '*checked out a cookbook* significa ha preso in prestito un libro di cucina (*checked out* è l''espressione fissa inglese per il prestito in biblioteca).'
