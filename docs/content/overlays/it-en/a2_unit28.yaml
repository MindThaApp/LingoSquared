teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: medicinale
    note: '*medicine* significa medicinale o farmaco.'
    example_gloss: Il medico mi ha dato un medicinale per il mal di testa.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: ricetta
    note: '*prescription* è la ricetta che rilascia il medico.'
    example_gloss: Il medico mi ha fatto una ricetta per il medicinale.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: visita di controllo
    note: '*follow-up appointment* indica un''altra visita in cui il medico verifica come stai.'
    example_gloss: Se non migliora, Le serve una visita di controllo.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: peggiorare
    note: '*getting worse* significa che i sintomi stanno peggiorando.'
    example_gloss: Il mio mal di testa sta peggiorando, non migliorando.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: tessera sanitaria
    note: '*insurance card* è la tessera della propria assicurazione sanitaria; in Italia equivale alla tessera sanitaria.'
    example_gloss: Porti la tessera sanitaria all'appuntamento.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: Frühere Beschwerden
    gloss: mal di testa, mal di gola, febbre
    note: Queste parole le hai già imparate nell'unità 22; qui le ripassiamo.
    example_gloss:
    - Ho mal di testa.
    - Ho mal di gola.
    - Ho la febbre.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: Um einen Termin bitten
    gloss: Vorrei fissare un appuntamento con il medico, per favore.
    note: Con *I'd like to...* chiedi un appuntamento con cortesia.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: Sagen, wie lange Sie schon Beschwerden haben
    gloss: Ho mal di testa e mal di gola da tre giorni, e sta peggiorando.
    note: 'Per qualcosa che dura già da un certo tempo l''inglese usa il *Present Perfect* (*I''ve had ... for three days*). In italiano si usa il presente con «da»: Ho ... da tre giorni.'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: arrivare dieci minuti prima
    note: '*arrive ten minutes early* significa arrivare dieci minuti prima dell''appuntamento.'
    example_gloss: Arrivi per favore dieci minuti prima dell'appuntamento.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: Text der Bestätigung
    gloss: Il Suo appuntamento è confermato per oggi alle 15. Porti per favore la tessera sanitaria e arrivi dieci minuti prima. Il numero di conferma è 7724.
    note: Una conferma formale con l'ora, ciò che deve fare e un numero.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: Capisco.
    note: Con *I see* mostri di aver capito qualcosa.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: Fragen, was los ist
    gloss: 'Il medico chiede: Che cosa c''è che non va?'
    note: La stessa domanda che Leila ha fatto nell'unità 22, ora posta dal medico.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Daniels Antwort zu den Beschwerden
    gloss: 'Daniel dice: Ho mal di testa e mal di gola da tre giorni, e sta peggiorando.'
    note: La stessa frase della lezione 2.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: Die Diagnose des Arztes
    gloss: 'Il medico dice: Capisco. Ha un brutto raffreddore.'
    note: Una diagnosi semplice e comune, niente di grave.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: Nach Medikamenten fragen
    gloss: 'Daniel chiede: Devo prendere qualche medicinale?'
    note: Daniel chiede della cura dopo aver sentito la diagnosi.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: Anweisungen zum Medikament
    gloss: 'Il medico dice: Sì, prenda questo medicinale due volte al giorno per cinque giorni e beva molta acqua.'
    note: 'Un''indicazione precisa: due volte al giorno, per cinque giorni.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: Nach einem Folgetermin fragen
    gloss: 'Daniel chiede: Devo tornare se non migliora?'
    note: Daniel usa la stessa condizione (*if it doesn't get better*) che Leila ha usato nell'unità 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: Antwort des Arztes zum Folgetermin
    gloss: 'Il medico dice: Sì, se non migliora entro una settimana, torni per una visita di controllo.'
    note: 'Il medico dice con precisione quando Daniel deve tornare: se entro una settimana non va meglio.'
