course:
  title: Inglese A2
  description: Impara l'inglese a livello A2, per situazioni quotidiane un po' più formali, con spiegazioni dettagliate in italiano.
units:
  en.a2.unit28.doctor:
    title: Andare a una visita medica
lessons:
  en.a2.unit28.lesson01.health_followup_vocabulary:
    title: Medicinali e appuntamenti
  en.a2.unit28.lesson02.calling_to_make_an_appointment:
