teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: calcio
    note: '*soccer* significa calcio. Il verbo che lo accompagna è *play*: *play soccer*. In italiano si dice «giocare a calcio», ma in inglese il verbo da usare cambia a seconda dello sport: con il nome dello sport devi ricordare se serve *play*, *go* o *do*.'
    example_gloss: Giochiamo a calcio il sabato.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: tennis
    note: '*tennis* significa tennis. Come per *soccer*, qui si usa *play*: *play tennis*. Anche in italiano si dice «giocare a tennis», e in inglese è sempre *play tennis*.'
    example_gloss: Lei gioca a tennis ogni fine settimana.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: pallacanestro
    note: '*basketball* significa pallacanestro (o basket). Anche qui si usa *play*: *play basketball*, come con *soccer* e *tennis*. Con gli sport di squadra con la palla l''inglese usa quasi sempre *play* + il nome dello sport.'
    example_gloss: Giocano a basket al parco.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: nuotare
    note: '*swimming* significa nuotare. Qui il verbo cambia: *go swimming* (non *play swimming*). L''inglese usa *go* + la forma in *-ing* per attività come nuotare e correre. In italiano si dice semplicemente «nuotare» o «andare a nuotare»; in inglese il verbo *go* è praticamente obbligatorio.'
    example_gloss: Vado a nuotare due volte a settimana.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: yoga
    note: '*yoga* significa yoga. Il verbo è *do*: *do yoga*. L''inglese usa *do* per le attività individuali come lo yoga, non *play* e non *go*. Anche in italiano si dice «fare yoga», quindi qui il verbo corrisponde. Ricorda però che l''inglese ha tre verbi (*play*, *go*, *do*) da abbinare al tipo di sport.'
    example_gloss: Lui fa yoga la mattina.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: fare sport / allenarsi
    note: '*exercise* significa fare sport o attività fisica: è un termine generale per il movimento del corpo. A differenza di *soccer*, *swimming* e *yoga*, *exercise* si può usare da solo come verbo, senza *play*, *go* o *do*: *Do you exercise every day?*'
    example_gloss: Fai sport ogni giorno?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: due volte a settimana
    note: '*twice a week* significa due volte a settimana. La parola *a* qui non significa «un» ma «per, a»: numero + *a* + unità di tempo indica quante volte accade in quel periodo. In italiano si usa la stessa idea con «a» (due volte a settimana).'
    example_gloss: Lui gioca a tennis due volte a settimana.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: tre volte a settimana
    note: '*three times a week* significa tre volte a settimana. Come per *twice a week*, *a* qui vuol dire «a, per», non «un»: *times* (volte) più *a week* (a settimana) indica quante volte alla settimana.'
    example_gloss: Lei nuota tre volte a settimana.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: nel fine settimana
    note: '*on weekends* significa nel fine settimana. L''inglese usa *on* con i giorni e i fine settimana, mentre l''italiano usa «in» o «nel» (nel fine settimana).'
    example_gloss: Giochiamo a basket nel fine settimana.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: palestra
    note: gym significa palestra, un luogo con attrezzi e corsi per fare sport.
    example_gloss: Lui fa yoga in palestra.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: piscina
    note: pool significa piscina, un luogo pieno d'acqua dove si nuota.
    example_gloss: Io nuoto in piscina.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: Quanto spesso fai sport?
    note: 'Questa domanda inizia con *how often* (quanto spesso). Poi viene l''ausiliare *do*, perché il verbo principale è *exercise*: è lo stesso uso di *do* delle altre domande inglesi.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: La domanda di Daniel
    gloss: 'Daniel chiede: Vuoi giocare a calcio con noi sabato?'
    note: Inizio del dialogo con un invito a giocare a calcio. Con *soccer* si usa *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Il calcio non mi piace granché. Preferisco nuotare.'
    note: '*don''t really like* significa «non mi piace granché»: un modo più morbido per dire di no.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Va benissimo! Quanto spesso vai a nuotare?'
    note: '*go swimming*: con il nuoto si usa *go*, non *play* o *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Risposta di Leila"
    gloss: 'Leila dice: Due volte a settimana, di solito nella piscina vicino a casa mia.'
    note: '*Twice a week*: anche qui *a* significa «a, per».'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Risposta di Daniel"
    gloss: 'Daniel dice: Bene! Anch''io faccio yoga ogni tanto, ma la corsa resta la mia preferita.'
    note: '*do yoga*: con lo yoga si usa *do*, distinto da *play* e *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Testo su Daniel, Leila e Mia
    gloss: 'Daniel, Leila e Mia restano attivi ognuno a modo suo. Daniel va a correre ogni mattina prima del lavoro. Leila preferisce nuotare: va in piscina due volte a settimana. Mia è nuova nella squadra, ma gioca già a tennis ogni domenica con la sua vicina. Il sabato giocano a volte a calcio insieme al parco, ma il calcio non è lo sport preferito di nessuno.'
    note: 'Questo testo usa tutti e tre i verbi: *goes running* (*go*), *plays tennis* e *play soccer* (*play*). Ogni sport ha il suo verbo.'
