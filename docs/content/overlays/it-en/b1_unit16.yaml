teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: consiglio
    note: '*advice* indica un parere su ciò che qualcuno dovrebbe fare.'
    example_gloss: Leila ha dato a Daniel un consiglio utile.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: suggerire, proporre
    note: '*suggest* significa proporre un''idea da considerare.'
    example_gloss: Leila ha suggerito un modo per gestire il suo carico di lavoro.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: sopraffatto
    note: '*overwhelmed* significa avere la sensazione di dover fare più di quanto si riesce.'
    example_gloss: Daniel si è sentito sopraffatto dai suoi due progetti.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: stabilire le priorità, dare la precedenza
    note: '*prioritize* significa fare per prima la cosa più importante.'
    example_gloss: Daniel ha deciso di dare la precedenza al progetto con la scadenza più vicina.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: carico di lavoro
    note: '*workload* indica la quantità totale di lavoro che qualcuno deve svolgere.'
    example_gloss: Il carico di lavoro di Daniel è aumentato dopo che è entrato nel team a marzo.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: rifiutare, declinare
    note: '*decline* significa rifiutare cortesemente una proposta o un''offerta.'
    example_gloss: Daniel poteva seguire il consiglio o declinarlo con cortesia.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + infinito
    gloss: Se fossi in te, parlerei con il tuo responsabile.
    note: '*if I were you, I would* è la forma della condizione irreale per dare un consiglio. Come in italiano: «se fossi in te, parlerei».'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + infinito
    gloss: Dovresti dare la precedenza al progetto con la scadenza più vicina.
    note: '*you should* è una raccomandazione diretta.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: Che ne dici di chiedere aiuto a un collega?
    note: '*how about + -ing* è un modo più morbido di proporre qualcosa.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Forme per dare consigli
    gloss: 'Consigli e suggerimenti usano forme diverse: If I were you, I would... (un''ipotesi irreale), You should... (una raccomandazione diretta) e How about + -ing...? (un suggerimento più morbido). Scegli una forma più forte o più morbida a seconda di quanto vuoi sembrare deciso.'
    note: 'Forma: scegli tra un''ipotesi irreale, una raccomandazione diretta o un suggerimento morbido.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: scadenza, termine
    note: '*deadline* indica la data entro cui qualcosa deve essere pronto.'
    example_gloss: La scadenza più vicina di Daniel è venerdì prossimo.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: Ha senso. Ci proverò.
    note: '*that makes sense* mostra che si capisce e si accetta il consiglio.'
    example_gloss: Ha senso. Ci proverò questa settimana.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Testo: un consiglio quando si ha troppo lavoro'
    gloss: Ciao Leila, questa settimana mi sento sopraffatto. Dirigo due progetti e in più ho il corso serale. Hai qualche consiglio? Ciao Daniel, se fossi in te, parlerei con il tuo responsabile del carico di lavoro. Dovresti anche dare la precedenza al progetto con la scadenza più vicina. Che ne dici di chiedere a Mia di aiutarti con l'altro? Grazie, ha senso. Ci proverò e ti dirò come va.
    note: Un breve consiglio cordiale tra colleghi.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel spiega il suo problema
    gloss: 'Daniel dice: Mi sento un po'' sopraffatto. Dirigo due progetti e ho ancora il corso serale tre volte a settimana.'
    note: '*a little overwhelmed* descrive l''avere un po'' troppo lavoro.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila dà il suo primo consiglio
    gloss: 'Leila dice: Se fossi in te, parlerei con il tuo responsabile del carico di lavoro.'
    note: '*if I were you, I would* è la forma ipotetica irreale.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel esita
    gloss: 'Daniel dice: È una buona idea, ma non voglio dare l''impressione di non farcela.'
    note: '*I don''t want to seem like* esprime la preoccupazione di come si appare.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila fa due proposte concrete
    gloss: 'Leila dice: Dovresti dare prima la precedenza al progetto con la scadenza più vicina. Che ne dici di chiedere a un collega di aiutarti con l''altro?'
    note: '*you should* e *how about* uniscono un suggerimento diretto e uno morbido.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel accetta il consiglio
    gloss: 'Daniel dice: Mi piace. Chiederò a Mia se questa settimana ha tempo.'
    note: '*I like that* mostra che si accetta il consiglio.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila conferma il piano
    gloss: 'Leila dice: Mi sembra un piano solido.'
    note: Una chiusura breve e incoraggiante della conversazione.
