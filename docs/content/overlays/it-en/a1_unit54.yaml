teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: lavanderia self-service
    note: '*laundromat* significa lavanderia self-service: un posto con lavatrici dove lavi i vestiti pagando.'
    example_gloss: Oggi vado alla lavanderia self-service.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: lavatrice
    note: '*washing machine* significa lavatrice.'
    example_gloss: La lavatrice è rotta.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: asciugatrice
    note: '*dryer* significa asciugatrice.'
    example_gloss: Metti i tuoi vestiti nell'asciugatrice.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: monete da 25 centesimi (USA)
    note: '*quarters* sono monete americane da venticinque centesimi, spesso necessarie per le lavatrici delle lavanderie self-service. In italiano non esiste un equivalente preciso, quindi *quarters* resta quasi sempre in inglese.'
    example_gloss: Le macchine accettano monete da 25 centesimi.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: detersivo
    note: '*detergent* significa detersivo.'
    example_gloss: Ti serve il detersivo per pulire i vestiti.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: carico di bucato
    note: '*load* qui significa carico di bucato: la quantità di panni che lavi in una volta sola.'
    example_gloss: Ho un grosso carico di bucato.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Vorrei lavare qualche capo, per favore.
    note: '*I''d like to* (contrazione di *I would like to*) è il modo cortese di chiedere qualcosa.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: Ha degli spiccioli per le macchine?
    note: '*change* qui significa spiccioli (monete), non cambiamento.'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: Quanto dura il ciclo di lavaggio?
    note: '*take* qui significa durare (richiedere un certo tempo): un uso molto diverso da *the machines take quarters*, dove *take* significa accettare. In italiano si usano verbi diversi, come "durare" e "accettare".'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: Sono tre dollari per un carico.
    note: '*for one load* significa per un carico di bucato.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: A che ora chiudete?
    note: '*do you close* usa il verbo ausiliare *do* per formare la domanda.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Per favore, ritirate il vostro bucato entro le nove.
    note: '*pick up* significa ritirare; *by nine o''clock* significa entro le nove (al più tardi a quell''ora).'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: L'addetto li saluta
    gloss: 'L''addetto dice: Ciao! Vi serve una lavatrice?'
    note: '*Do you need...?* usa il verbo ausiliare *do* per formare la domanda.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: Il motivo di Leila
    gloss: 'Leila dice: Sì, grazie. La mia lavatrice a casa è rotta.'
    note: '*at home* significa a casa.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: La richiesta di Daniel
    gloss: 'Daniel dice: Anch''io ho un piccolo carico. Posso usare anch''io una macchina?'
    note: '*too* qui significa anche, a fine frase; *as well* ha lo stesso significato e compare nella seconda frase.'
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: L'addetto parla delle monete
    gloss: 'L''addetto dice: Certo! Le macchine accettano monete da 25 centesimi.'
    note: '*take* qui significa accettare (come pagamento): attenzione alla differenza con *take* in *The wash cycle takes thirty minutes* più avanti, dove *take* significa durare.'
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila ha le monete
    gloss: 'Leila dice: Sì, ho le monete.'
    note: Una breve conferma, non un fatto nuovo.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: La durata del ciclo di lavaggio
    gloss: 'L''addetto dice: Il ciclo di lavaggio dura trenta minuti.'
    note: '*take* qui significa durare: un significato diverso da *take* in *take quarters* più sopra.'
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel chiede il prezzo
    gloss: 'Daniel dice: E quanto costa?'
    note: '*How much does it cost?*: di nuovo il verbo ausiliare *does* per formare la domanda.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: Il prezzo
    gloss: 'L''addetto dice: Sono tre dollari per un carico.'
    note: Un fatto a parte, separato dal numero di monete e dalla durata.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: L'orario di chiusura
    gloss: 'L''addetto dice: La lavanderia chiude alle nove, quindi per favore ritirate il bucato prima di allora.'
    note: '*so* qui significa quindi/perciò: collega l''orario di chiusura all''invito ad arrivare in tempo.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Testo: Una visita alla lavanderia'
    gloss: Un pomeriggio la lavatrice di Leila a casa si ruppe. Decise di andare alla lavanderia self-service in fondo alla strada. Daniel andò con lei perché anche lui aveva un piccolo carico di bucato. In lavanderia l'addetto spiegò che le macchine accettano monete da 25 centesimi e che il ciclo di lavaggio dura trenta minuti. Costava tre dollari per un carico. Mentre i loro vestiti si lavavano, Daniel e Leila chiacchierarono e presero un caffè in un bar lì accanto. La lavanderia chiude alle nove, quindi si assicurarono di ritirare il bucato prima. Leila fu grata a Daniel per la compagnia e disse che la lavatrice di casa sarebbe stata probabilmente riparata entro il fine settimana.
    note: '*would be fixed* significa sarebbe stata riparata: Leila si aspetta che la macchina venga riparata, ma non è ancora certo.'
