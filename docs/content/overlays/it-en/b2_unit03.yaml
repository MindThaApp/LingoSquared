teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: attenuare un'affermazione, formulare con cautela
    note: '*hedge* significa rendere un''affermazione meno assoluta. Non tradurre automaticamente "un po''" con *a little*.'
    example_gloss: Leila usa seems per attenuare la sua affermazione sulla politica aziendale.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: limitare o sfumare
    note: '*qualify* significa limitare un''affermazione con una condizione o un''eccezione.'
    example_gloss: L'espressione 'provided we agree' limita il sostegno di Leila.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: enfatizzare, mettere in rilievo
    note: '*emphasize* significa dare più forza a una parte del tuo messaggio.'
    example_gloss: Daniel mette in rilievo il problema del carico di lavoro.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: in una certa misura
    note: '*to some extent* suona spesso più naturale che usare *a little* ovunque.'
    example_gloss: In una certa misura, la politica risponde alle preoccupazioni del team.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: in linea di massima, in generale
    note: '*broadly* esprime un sostegno o una verità di carattere generale, con spazio per le eccezioni.'
    example_gloss: La proposta è utile in linea di massima, anche se non perfetta.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: purché, a condizione che
    note: '*provided* introduce una condizione. Corrisponde all''italiano "purché", ma in inglese suona spesso formale e professionale.'
    example_gloss: Possiamo sostenere la politica, purché siamo d'accordo.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Cautela più enfasi
    gloss: La politica sembra ragionevole, ma crea davvero del lavoro extra per il team.
    note: '*seems* rende più cauta l''affermazione positiva; *does create* sottolinea che il lavoro extra c''è davvero. In italiano si ottiene un effetto simile con "davvero" o "eccome": crea eccome lavoro extra.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Mettere a fuoco una preoccupazione
    gloss: Quello che mi preoccupa è il lavoro extra per il team.
    note: '*What worries me is...* mette un punto in primo piano per dargli risalto. Poi mantieni l''ordine inglese: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Sostegno generale con una condizione
    gloss: È utile in linea di massima, purché la tempistica venga modificata.
    note: '*broadly useful, provided...* esprime sostegno con una condizione chiara.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Sfumature ed enfasi
    gloss: Usa seems, broadly o to some extent per rendere un'affermazione più cauta o più limitata. Usa do o does davanti al verbo principale per sottolineare che qualcosa è vero. Usa What matters is... o What worries me is... per portare l'attenzione su un punto.
    note: 'Per chi parla italiano *does create* è la novità: non significa "fa creare", ma dà enfasi a *create*, come "davvero" o "eccome" in italiano.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: nel complesso
    note: '*overall* guarda al quadro generale, anche se ci sono dettagli o eccezioni.'
    example_gloss: Nel complesso, Leila sostiene la politica.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: condizione
    note: '*condition* è qualcosa che deve essere soddisfatto prima che un''altra cosa valga.'
    example_gloss: La sua condizione è che la tempistica venga modificata.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Testo di lettura: sostegno con condizioni'
    gloss: 'Il feedback di Leila è positivo, ma attentamente sfumato. Dice che la politica di revisione sembra ragionevole nel complesso, il che attenua l''affermazione ed evita di suonare assoluta. Dice anche che è utile in linea di massima, purché la tempistica venga modificata. Questa condizione limita il suo sostegno: non accetta la politica esattamente com''è scritta. Daniel mette in rilievo un altro punto con una costruzione di focalizzazione: ciò che lo preoccupa è il lavoro extra per il team. Entrambi sostengono la politica in linea di principio, ma il loro linguaggio mostra diversi livelli di impegno.'
    note: Il testo mostra come lo stesso contenuto di base si possa rendere più morbido, più forte o più condizionato.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Leila si esprime con cautela
    gloss: 'Leila dice: La nuova politica di revisione sembra ragionevole nel complesso.'
    note: '*seems reasonable overall* è più positivo di una critica, ma non assoluto.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Daniel coglie la cautela
    gloss: 'Daniel dice: Suona un po'' prudente. Vuoi dire che non è del tutto pronta?'
    note: Daniel nota che Leila non dice semplicemente *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Leila precisa ulteriormente
    gloss: 'Leila dice: Esatto. Potrebbe essere praticabile, ma servono scadenze più chiare.'
    note: '*may be workable* lascia spazio al dubbio; *but* indica il limite.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Daniel mette a fuoco un punto
    gloss: 'Daniel dice: Sono d''accordo. Quello che mi preoccupa è il lavoro extra per il team.'
    note: '*What worries me is...* mette a fuoco una preoccupazione.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Leila sottolinea con does
    gloss: 'Leila dice: Giusto. La politica prevede davvero controlli di qualità migliori, ma aggiunge anche un''altra fase di approvazione.'
    note: '*does create* sottolinea che questo vantaggio esiste davvero, nonostante il limite indicato dopo.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Daniel riassume la condizione
    gloss: 'Daniel dice: Quindi dovremmo sostenerla con delle condizioni?'
    note: Riassume il sostegno sfumato di Leila.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Leila dà un sostegno condizionato
    gloss: 'Leila dice: Sì. Direi che è utile in linea di massima, purché la tempistica venga modificata.'
    note: 'Qui *provided* significa purché: il sostegno vale solo se la condizione viene soddisfatta.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: Stesso contenuto, tre livelli di forza
    gloss: La politica crea lavoro extra. La politica sembra creare lavoro extra. La politica crea davvero lavoro extra.
    note: Le tre frasi esercitano la forma neutra, quella più cauta con *seems to* e quella più enfatica con *does*.
