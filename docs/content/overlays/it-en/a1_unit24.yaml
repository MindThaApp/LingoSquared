teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: camera da letto
    note: '*bedroom* significa «camera da letto». È formata da *bed* («letto») e *room* («stanza»), ma in inglese si scrive in una sola parola e ha un solo accento principale (sulla prima parte).'
    example_gloss: La mia camera da letto è accanto al bagno.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: cucina
    note: '*kitchen* significa «cucina». Si pronuncia *KITCH-en*; la *t* non si sente da sola.'
    example_gloss: La cucina è accanto al soggiorno.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: bagno
    note: '*bathroom* significa «bagno». Negli Stati Uniti è spesso anche la parola per il gabinetto.'
    example_gloss: Il bagno ha una doccia.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: soggiorno
    note: '*living room* significa «soggiorno». Sono due parole separate.'
    example_gloss: Guardiamo la TV in soggiorno.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: giardino
    note: '*garden* significa «giardino». Negli Stati Uniti per il giardino dietro casa si dice spesso anche *yard*.'
    example_gloss: Non c'è un giardino, ma c'è un balcone.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: Questa è la cucina.
    note: 'Con *This is ...* indichi qualcosa. *the* indica qualcosa di preciso: la cucina di questo appartamento.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: Quante stanze ci sono?
    note: Con *How many...are there?* chiedi una quantità. *many* si usa con i nomi numerabili al plurale; *are* c'è perché *rooms* è plurale.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: C'è una piccola cucina.
    note: Con *There's...* (*there is*) dici che da qualche parte c'è qualcosa. Corrisponde all'italiano «c'è»; con più cose si dice *there are*, come «ci sono».
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: accanto a
    note: '*next to* significa «accanto a». Sono due parole che restano sempre insieme.'
    example_gloss: La sedia è accanto al tavolo.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: appartamento
    note: '*apartment* significa «appartamento» (americano; in inglese britannico si dice *flat*).'
    example_gloss: L'appartamento di Daniel ha due camere da letto.
  en.a1.unit24.lesson03.teach.home_text:
    title: Testo su un appartamento
    gloss: Il mio appartamento ha due camere da letto e un bagno. C'è una piccola cucina accanto al soggiorno.
    note: In questo breve testo una persona descrive il suo appartamento e dice quante stanze ha.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: Qual è la tua stanza preferita?
    note: '*favorite* significa «preferito».'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: Chiedere dell'appartamento
    gloss: 'Leila dice: Parlami del tuo appartamento.'
    note: Con *Tell me about...* chiedi a qualcuno di descrivere qualcosa.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Risposta di Daniel
    gloss: 'Daniel dice: Ha due camere da letto e un bagno. C''è una piccola cucina accanto al soggiorno.'
    note: Daniel dice quante stanze ci sono e dov'è la cucina.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: Chiedere del giardino
    gloss: 'Leila chiede: C''è un giardino?'
    note: Con *Is there...?* chiedi se qualcosa c'è.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Risposta di Daniel
    gloss: 'Daniel dice: No, non c''è, ma c''è un piccolo balcone.'
    note: Daniel prima dice di no e poi indica un'alternativa.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Ultima risposta di Daniel
    gloss: 'Daniel dice: La mia stanza preferita è il soggiorno. È vicino alla cucina, quindi è comodo cenare lì.'
    note: Daniel dice qual è la sua stanza preferita e ne dà il motivo.
