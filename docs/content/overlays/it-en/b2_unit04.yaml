course:
  title: Inglese B2
  description: Impara l'inglese a livello B2 per conversazioni sfumate, argomentazioni, ipotesi e discussioni professionali, con spiegazioni in italiano colloquiale.
units:
  en.b2.unit04.narrative_time:
    title: By the time I arrived
lessons:
  en.b2.unit04.lesson01.timeline_roles:
    title: Sfondo, evento principale e ciò che era successo prima
  en.b2.unit04.lesson02.shifting_time:
    title: While I was checking, the power went out
  en.b2.unit04.lesson03.reading_an_incident_account:
    title: 'Lettura: il problema alla sede'
  en.b2.unit04.lesson04.the_narrative_dialogue:
    title: Walk me through what happened
teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: sfondo, contesto
    note: '*background* è ciò che era già in corso o che fornisce il contesto. Nei racconti in inglese lo sfondo si esprime spesso con il past continuous.'
    example_gloss: Le informazioni di sfondo dicono che cosa stava già succedendo.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: evento principale
    note: '*foreground* è l''evento verso cui si muove il racconto. In inglese si usa spesso il simple past, non automaticamente il present perfect.'
    example_gloss: L'evento principale è l'evento più importante del racconto.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: precedente, anteriore
    note: '*prior* significa avvenuto prima di un altro momento nel passato. Di solito si esprime con il past perfect: *had moved*.'
    example_gloss: Un evento precedente è avvenuto prima di un altro evento nel passato.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: interrompere
    note: '*interrupt* si usa quando un evento breve irrompe in qualcosa che era in corso.'
    example_gloss: Un problema improvviso può interrompere un'azione.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: in corso, in svolgimento
    note: '*ongoing* si accorda bene con l''imperfetto o con "stava + gerundio" dell''italiano. In inglese si esprime spesso con *was/were + -ing*.'
    example_gloss: Un'azione in corso dura per un certo tempo.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: cronologia, ordine reale
    note: '*chronology* è l''ordine reale degli eventi, anche quando il racconto li presenta in un ordine diverso.'
    example_gloss: La cronologia è l'ordine reale in cui si sono svolti gli eventi.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Qualcosa era già successo prima
    gloss: Quando sono arrivato, il coordinatore aveva già portato l'attrezzatura all'interno.
    note: '*had already moved* indica che questo è avvenuto prima di *I arrived*. Anche l''italiano usa qui il trapassato prossimo (aveva spostato): in inglese quindi si dice *had moved*, non *has moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Azione in corso più interruzione
    gloss: Mentre controllavo l'impianto audio, è saltata la corrente.
    note: '*was checking* corrisponde all''italiano "stavo controllando". L''interruzione stessa è al simple past: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Arrivare durante un'azione di sfondo
    gloss: Quando sono arrivato, i volontari stavano sistemando le sedie.
    note: Usa *were setting up* per ciò che era in corso quando è avvenuto l'evento principale.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: I livelli temporali in un racconto
    gloss: Usa il past continuous per l'azione di sfondo, il simple past per gli eventi principali e il past perfect per ciò che era già accaduto prima.
    note: 'In italiano il passato prossimo è molto comune nel racconto, ma in una narrazione in inglese si usa spesso il simple past: *the power went out*, non *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: sede, luogo di un evento
    note: '*venue* è il luogo in cui si svolge un evento.'
    example_gloss: La sede è il posto in cui si tiene un evento.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: ritardato, rimandato
    note: '*delayed* significa che qualcosa inizia o accade più tardi del previsto.'
    example_gloss: L'evento è iniziato con venti minuti di ritardo.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Testo di lettura: il problema alla sede'
    gloss: Simon non ha raccontato la storia in rigoroso ordine cronologico. Prima che arrivasse alla sede, il coordinatore aveva portato l'attrezzatura all'interno perché era prevista pioggia. Quando Simon è arrivato, i volontari stavano sistemando le sedie. Mentre controllava l'impianto audio, è saltata la corrente. Ha chiamato il responsabile dell'edificio, che gli ha spiegato che una squadra di riparazione aveva lavorato lì vicino quella stessa mattina presto. Il team ha rimandato l'inizio di venti minuti, ma quando gli ospiti sono entrati, la luce era tornata.
    note: 'Osserva i livelli temporali dell''inglese: *had moved* per ciò che è avvenuto prima, *were setting up* per lo sfondo e *went out* per l''evento principale.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Harper chiede il racconto
    gloss: 'Harper chiede: Puoi raccontarmi passo per passo che cosa è successo alla sede?'
    note: '*walk me through* significa guidare qualcuno passo per passo attraverso un evento.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Simon combina i livelli temporali
    gloss: 'Simon dice: Certo. Quando sono arrivato, i volontari stavano sistemando le sedie, ma il coordinatore aveva già portato l''attrezzatura all''interno perché era prevista pioggia.'
    note: Un buon racconto combina l'azione di sfondo con un evento precedente.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Harper verifica l'ordine
    gloss: 'Harper chiede: Quindi l''attrezzatura era al sicuro prima che tu arrivassi?'
    note: 'La domanda riguarda l''ordine: l''attrezzatura era già al sicuro prima dell''arrivo di Simon.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Simon indica l'interruzione
    gloss: 'Simon dice: Esatto. Poi, mentre controllavo l''impianto audio, è saltata la corrente.'
    note: '*while I was checking* è l''azione in corso; *the power went out* è l''interruzione.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Harper chiede il passo successivo
    gloss: 'Harper chiede: Che cosa hai fatto dopo?'
    note: '*What did you do...?* usa il simple past con *did* per una domanda su un passo concluso.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Simon riferisce lo sfondo precedente
    gloss: 'Simon dice: Ho chiamato il responsabile dell''edificio e lei mi ha detto che una squadra di riparazione aveva lavorato lì vicino quella stessa mattina presto.'
    note: '*had been working* mostra che quel lavoro era già in corso prima, quella mattina.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Harper chiede dell'evento
    gloss: 'Harper chiede: E l''evento?'
    note: La domanda breve chiede quale sia stata la conseguenza per l'evento.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Simon conclude
    gloss: 'Simon dice: Abbiamo rimandato l''inizio di venti minuti, ma quando gli ospiti sono entrati, la luce era tornata.'
    note: '*had come back on* è avvenuto prima del momento in cui gli ospiti sono entrati.'
