    gloss: Che cosa stai cucinando?
    note: '*What are you ...ing?* chiede che cosa qualcuno sta facendo in questo momento.'
  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: L'invito di Mia
    gloss: 'Mia chiede: Stasera faccio la pasta. Vuoi aiutarmi a cucinare?'
    note: '*Do you want to help me* + verbo*?* è un modo naturale per invitare qualcuno ad aiutare.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: La risposta di Daniel
    gloss: 'Daniel dice: Certo! Però non sono un gran cuoco.'
    note: '*though* alla fine di una frase indica una lieve contrapposizione, simile a «però» in italiano; ma in inglese si mette in fondo alla frase.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: L'incoraggiamento di Mia
    gloss: 'Mia dice: Non c''è problema, ti faccio vedere io. Puoi tritare queste cipolle?'
    note: '*I''ll show you* significa: ti faccio vedere io.'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: La domanda di Daniel
    gloss: 'Daniel dice: Nessun problema. Quanto fini devo tritarle?'
    note: '*should* serve a chiedere un consiglio.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: La spiegazione di Mia
    gloss: 'Mia dice: A pezzetti piccoli, così. Ora cuociamo la pasta.'
    note: '*like this* significa: così, in questo modo.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: La risposta di Daniel
    gloss: 'Daniel dice: Posso assaggiare il sugo? Che buono!'
    note: '*Can I* + verbo*?* chiede il permesso.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: La conclusione di Mia
    gloss: 'Mia dice: Perfetto! La cena è quasi pronta.'
    note: '*almost ready* significa quasi pronto.'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Testo sul cucinare insieme
    gloss: Daniel, Leila e Mia hanno tutti capacità diverse in cucina. Da quando Leila si è trasferita in un nuovo appartamento vicino a Mia, i tre amici cucinano spesso la cena insieme. Leila è una brava cuoca. Spesso prepara la pasta con la vecchia ricetta di sua madre. Anche Mia ama cucinare, e ha insegnato a Daniel a tritare le cipolle senza tagliarsi le dita. Daniel non è ancora un gran cuoco, ma impara in fretta. Ieri sera Mia ha chiesto a Daniel di aiutarla a preparare la pasta. Lui ha tritato le cipolle mentre Mia cuoceva la pasta e preparava il sugo. Daniel ha assaggiato il sugo e ha detto che era buonissimo. Leila è arrivata proprio quando la cena era pronta, e i tre hanno mangiato insieme nella cucina di Mia.
    note: '*arrived just as dinner was ready* significa: è arrivata proprio quando la cena era pronta.'
