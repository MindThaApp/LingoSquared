teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: valore
    note: '*value* qui indica un principio che le persone ritengono importante, non solo un valore economico.'
    example_gloss: L'equità è un valore.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: equità, correttezza
    note: '*fairness* riguarda il trattamento ragionevole delle persone. È più forte e più astratto di un semplice *nice*.'
    example_gloss: L'equità significa trattare le persone in modo ragionevole.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: comodità, praticità
    note: '*convenience* è comodità e praticità. Attenzione: non corrisponde all''italiano ''convenienza'' nel senso di vantaggio economico.'
    example_gloss: La comodità rende più facile la vita quotidiana.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: flessibilità
    note: '*flexibility* è la capacità di adattarsi quando le circostanze cambiano.'
    example_gloss: La flessibilità permette di cambiare quando cambiano le circostanze.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: precisare, sfumare, limitare
    note: '*qualify* qui significa limitare o sfumare la tua opinione. Non significa ottenere un titolo di studio.'
    example_gloss: Puoi sfumare un'opinione limitandola.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: dare la priorità a
    note: '*prioritize fairness* significa che consideri l''equità più importante di un altro valore.'
    example_gloss: Dare la priorità all'equità significa considerarla più importante di qualcos'altro.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Bilanciare i valori
    gloss: In linea di principio la comodità è importante, ma l'equità dovrebbe pesare di più.
    note: '*In principle* qui significa in linea di principio. Non usare *eventually* per l''italiano ''eventualmente'': *eventually* significa alla fine.'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Limitare la tua posizione
    gloss: Non sostengo il silenzio ovunque.
    note: '*I am not arguing for...* delimita la tua tesi. È più preciso di un generico *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Rispondere direttamente all'altra parte
    gloss: È un punto ragionevole, e sono d'accordo che le aziende abbiano bisogno di flessibilità.
    note: '*That is fair* riconosce il punto dell''altro senza rinunciare al tuo valore.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Costruire un'opinione astratta
    gloss: Un'opinione astratta efficace indica un valore, precisa la tesi e risponde direttamente al punto di vista dell'altra persona.
    note: Usa parole precise da livello B2 come *in principle*, *fairness* e *carry more weight*, invece di ripetere *a bit* per sfumare.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: trasparente, facile da capire
    note: '*transparent rules* sono regole facili da capire e da verificare.'
    example_gloss: Le regole trasparenti sono facili da capire.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: commerciale, d'affari
    note: '*commercial activity* è l''attività legata alle imprese e al profitto.'
    example_gloss: L'attività commerciale ha a che fare con le imprese.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Lettura: spazi pubblici tranquilli'
    gloss: 'Amara sostiene che gli spazi pubblici tranquilli vadano protetti, anche quando ciò limita alcune attività commerciali. La sua posizione non è assoluta: non sostiene il silenzio ovunque e accetta che le aziende abbiano bisogno di una certa flessibilità. La posizione opposta di Leo è che le regole possano rendere più difficile la sopravvivenza delle aziende. Amara risponde direttamente a questo punto dicendo che la comodità è importante, ma l''equità dovrebbe pesare di più quando uno spazio appartiene a tutti. La sua posizione è sfumata perché sostiene regole limitate e trasparenti, non restrizioni illimitate.'
    note: 'Questo è inglese astratto: nomina i valori e delimita la tua tesi con precisione.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara espone la sua posizione
    gloss: 'Amara dice: Penso che una città debba proteggere gli spazi pubblici tranquilli, anche se ciò limita alcune attività commerciali.'
    note: '*even if* chiarisce che riconosce uno svantaggio.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo indica l'altro valore
    gloss: 'Leo dice: Anch''io apprezzo la quiete, ma le aziende hanno bisogno di flessibilità per sopravvivere.'
    note: Leo contrappone la flessibilità all'enfasi di Amara sullo spazio pubblico.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara precisa
    gloss: 'Amara dice: È giusto, e non sostengo il silenzio ovunque. Il mio punto è che gli spazi condivisi non dovrebbero essere plasmati solo dal profitto.'
    note: '*not arguing for silence everywhere* evita che la sua posizione suoni assoluta.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo individua il valore
    gloss: 'Leo dice: Quindi il valore a cui dai la priorità è l''equità, non solo il comfort?'
    note: '*prioritizing* qui significa: considerare più importante nel bilanciamento.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara bilancia i valori
    gloss: 'Amara dice: Esatto. In linea di principio la comodità è importante, ma l''equità dovrebbe pesare di più quando uno spazio appartiene a tutti.'
    note: '*carry more weight* è l''espressione inglese naturale per pesare di più.'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo accetta a una condizione
    gloss: 'Leo dice: Posso accettarlo se le regole sono limitate e trasparenti.'
    note: L'accettazione dipende dal carattere limitato e chiaro delle regole.
