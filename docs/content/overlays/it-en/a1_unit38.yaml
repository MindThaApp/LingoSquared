teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: faccenda domestica
    note: '*chore* significa una faccenda domestica che si fa regolarmente per tenere la casa pulita e in ordine.'
    example_gloss: Lavare i piatti è la faccenda che mi piace di meno.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: piatti / stoviglie
    note: '*dishes* significa i piatti, cioè piatti, tazze e posate da lavare.'
    example_gloss: Lavo i piatti dopo cena.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: bucato
    note: '*laundry* significa bucato: i vestiti che si lavano, si asciugano e si piegano.'
    example_gloss: Lei fa il bucato la domenica.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: passare l'aspirapolvere
    note: '*vacuum* significa passare l''aspirapolvere.'
    example_gloss: Lui passa l'aspirapolvere in soggiorno ogni sabato.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: spazzatura / rifiuti
    note: '*trash* significa spazzatura.'
    example_gloss: Puoi portare fuori la spazzatura?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: pulire
    note: '*clean* significa pulire.'
    example_gloss: Puliamo insieme l'appartamento.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: lavare i piatti
    note: '*wash the dishes* significa letteralmente lavare i piatti. *Do the dishes* è altrettanto comune e ha lo stesso significato.'
    example_gloss: Lavo i piatti ogni sera.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: fare il bucato
    note: '*do the laundry* significa fare il bucato. Qui l''inglese usa *do*, proprio come l''italiano usa «fare».'
    example_gloss: Lei fa il bucato la domenica.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: portare fuori la spazzatura
    note: '*take out the trash* usa *take out*, non *do*. A differenza di *do the laundry* o *do the dishes*, qui non si può usare *do*.'
    example_gloss: Puoi portare fuori la spazzatura?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: pulire il bagno
    note: '*clean the bathroom* significa pulire il bagno.'
    example_gloss: Lui pulisce il bagno nel fine settimana.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: dovere
    note: '*need to* significa dover fare qualcosa.'
    example_gloss: Questo fine settimana devo passare l'aspirapolvere in soggiorno.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: Puoi aiutarmi con i piatti?
    note: Un modo gentile per chiedere aiuto con una faccenda.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 'Mia dice: Il mio appartamento è un disastro. Questo fine settimana ho ospiti.'
    note: '*a mess* significa un disastro o un gran disordine.'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: L'offerta di Daniel
    gloss: 'Daniel chiede: Vuoi una mano a pulirlo?'
    note: '*Do you want some help ...ing?* è un modo naturale per offrire aiuto.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Sì, grazie! Devo passare l''aspirapolvere in soggiorno e lavare i piatti.'
    note: '*I need to* + verbo significa «devo» + verbo.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: L'offerta di Daniel
    gloss: 'Daniel dice: Posso passare io l''aspirapolvere al posto tuo. Tu puoi lavare i piatti.'
    note: '*for you* qui significa «al posto tuo», cioè «per te» nel senso di «al tuo posto».'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: L'aggiunta di Mia
    gloss: 'Mia dice: Grazie! Devo ancora fare anche il bucato.'
    note: '*still need to* significa «devo ancora».'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: L'offerta di Daniel
    gloss: 'Daniel dice: Oggi non ho tempo per questo, ma posso portare fuori la spazzatura prima di andare via.'
    note: '*before I leave* significa «prima di andare via».'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Il ringraziamento di Mia
    gloss: 'Mia dice: Mi aiuterebbe moltissimo. Grazie mille!'
    note: '*That would help a lot* significa «mi aiuterebbe moltissimo». *Would* qui rende la frase più cortese.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Testo sulle faccende di casa
    gloss: Daniel, Leila e Mia hanno tutti le loro abitudini con le faccende. Daniel lava i piatti ogni sera dopo cena e passa l'aspirapolvere in casa il sabato. A Leila non pesa fare il bucato, ma odia pulire il bagno. La gatta di Mia, Luna, lascia peli dappertutto, perciò Mia passa l'aspirapolvere quasi ogni giorno. Lo scorso fine settimana Mia aveva ospiti, così Daniel si è offerto di aiutarla. Ha passato l'aspirapolvere in soggiorno e ha portato fuori la spazzatura per lei. Mia gli è stata molto grata per l'aiuto.
    note: '*doesn''t mind* significa «non le pesa» o «non le dispiace».'
