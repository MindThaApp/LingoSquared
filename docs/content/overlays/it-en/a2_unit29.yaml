    - Il bagno è proprio accanto alla cucina.
  en.a2.unit29.lesson02.teach.report_problem:
    title: Segnalare un problema
    gloss: Vorrei segnalare un problema al lavello della cucina.
    note: Con *I'd like to report...* segnali con cortesia un problema.
  en.a2.unit29.lesson02.teach.leaking_since_morning:
    title: Spiegare da quanto tempo c'è il problema
    gloss: Perde dalla mattina.
    note: 'Per qualcosa che dura da un po'' l''inglese usa *It''s been leaking since...*, come *I''ve had ... for* nell''unità 28. In italiano basta il presente: Perde da ...'
  en.a2.unit29.lesson02.teach.ask_repair_timing:
    title: Chiedere quando verrà riparato
    gloss: Quando può venire qualcuno a ripararlo?
    note: Con *When can someone come to fix it?* chiedi con cortesia quando si può fare la riparazione.
  en.a2.unit29.lesson03.teach.between_2_4:
    title: between 2pm and 4pm
    gloss: tra le 14 e le 16
    note: '*between 2pm and 4pm* significa tra le 14 e le 16. In inglese l''ora si scrive con *pm* invece che con il formato a 24 ore.'
    example_gloss: L'idraulico arriva tra le 14 e le 16.
  en.a2.unit29.lesson03.teach.confirmation_text:
    title: Testo della comunicazione sulla riparazione
    gloss: La Sua segnalazione di un lavello della cucina che perde è stata ricevuta. Domani tra le 14 e le 16 verrà un idraulico. Il numero della riparazione è 6180.
    note: 'Una conferma formale: la segnalazione è stata ricevuta e seguono un orario e un numero.'
  en.a2.unit29.lesson04.teach.q_report_problem:
    title: Segnalare il problema al custode
    gloss: 'Daniel dice: Vorrei segnalare un problema al lavello della cucina.'
    note: La stessa frase della lezione 2.
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink:
    title: Chiedere del problema con il lavello
    gloss: 'L''amministratore chiede: Che cos''ha il lavello?'
    note: La stessa forma di domanda usata dal medico nell'unità 28 (*What's wrong?*), ora per il lavello invece che per la salute.
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing:
    title: Risposta di Daniel sulla durata e domanda sulla data della riparazione
    gloss: 'Daniel dice: Perde dalla mattina. Quando può venire qualcuno a ripararlo?'
    note: Le due frasi della lezione 2, ora una dopo l'altra.
  en.a2.unit29.lesson04.teach.a_send_plumber:
    title: La risposta del custode sull'idraulico
    gloss: 'L''amministratore dice: Capisco. Manderò un idraulico domani tra le 14 e le 16.'
    note: L'amministratore indica la data della riparazione dopo aver ascoltato il problema.
  en.a2.unit29.lesson04.teach.q_need_to_be_home:
    title: Chiedere se bisogna essere a casa
    gloss: 'Daniel chiede: Devo essere a casa?'
    note: Daniel lo chiede dopo aver sentito la data della riparazione.
  en.a2.unit29.lesson04.teach.a_confirm_window_number:
    title: L'ultima conferma del custode
    gloss: 'L''amministratore dice: Sì, per favore sia a casa tra le 14 e le 16. Ecco il Suo numero di riparazione: 6180.'
    note: L'amministratore indica l'ora precisa e il numero di riparazione.
  en.a2.unit29.lesson04.teach.a_thank_you:
    title: Ringraziamento finale
    gloss: 'Daniel dice: Grazie mille.'
    note: '*Thank you very much* è un modo cortese e formale di ringraziare, proprio come alla fine della conversazione nell''unità 25.'
