teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: essere d'accordo
    note: '*agree* significa pensare che un''altra persona abbia ragione.'
    example_gloss: Sono d'accordo con te.
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: non essere d'accordo, avere un'opinione diversa
    note: '*disagree* significa pensare che un''altra persona non abbia ragione.'
    example_gloss: Non sono d'accordo con quell'opinione.
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: opinione
    note: '*opinion* indica un''opinione personale su qualcosa.'
    example_gloss: Ognuno ha un'opinione diversa.
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: credere, ritenere
    note: '*believe* significa pensare che qualcosa sia vero.'
    example_gloss: Credo che sia una buona idea.
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: motivo
    note: '*reason* indica la spiegazione che sta dietro a un''opinione.'
    example_gloss: Qual è il tuo motivo per pensarlo?
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: risparmiare tempo
    note: '*save time* significa che per fare qualcosa serve meno tempo.'
    example_gloss: Lavorare da casa mi aiuta a risparmiare tempo.
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: Zustimmen und einen Grund nennen
    gloss: Sono d'accordo che lavorare da casa sia meglio perché si risparmia tempo.
    note: '*I agree that... because...* collega un''opinione a un motivo.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: Widersprechen und einen Grund nennen
    gloss: Non penso che sia meglio, perché si sente la mancanza dei colleghi.
    note: '*I disagree that... because...* collega un''opinione contraria a un motivo.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: Sono d'accordo che sia meglio. Non penso che sia meglio.
    note: Dopo *agree*/*disagree* *that* introduce la subordinata che dice l'opinione con cui si è o non si è d'accordo. In inglese prima di *that* non c'è la virgola, mentre in italiano «che» di solito è preceduto da una virgola solo in certi casi.
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: concentrarsi
    note: '*focus* significa rivolgere l''attenzione a qualcosa.'
    example_gloss: A casa riesce a concentrarsi più facilmente.
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: rispettare
    note: '*respect* significa rispettare l''opinione di un altro, anche se non si è d''accordo.'
    example_gloss: Rispettano l'opinione dell'altro.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'Lesetext: zwei Meinungen'
    gloss: Mia pensa che lavorare da casa sia meglio perché lì riesce a concentrarsi più facilmente. Leila la vede diversamente. Crede che sia meglio andare in ufficio perché le piace vedere i suoi colleghi ogni giorno. Non sono d'accordo, ma rispettano l'opinione dell'altra.
    note: Un breve testo di lettura con due opinioni opposte.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel eröffnet die Debatte
    gloss: 'Daniel dice: Pensi che lavorare da casa sia meglio che lavorare in ufficio?'
    note: Una domanda aperta per dare il via a un disaccordo.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila sieht das anders
    gloss: 'Leila dice: Non penso che sia meglio. Credo che si perdano conversazioni importanti con i colleghi.'
    note: Leila dice la sua opinione e un motivo.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel erkennt Leilas Argument an, bleibt aber bei seiner Meinung
    gloss: 'Daniel dice: È un buon punto, ma sono d''accordo che fa risparmiare molto tempo.'
    note: '*that''s a fair point* riconosce l''opinione dell''altro prima di dire la propria.'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila gibt etwas zu, bleibt aber bei ihrer Vorliebe
    gloss: 'Leila dice: Sono d''accordo che fa risparmiare tempo, ma preferisco comunque l''ufficio.'
    note: Leila ammette un punto senza cambiare la sua opinione complessiva.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel beendet das Gespräch
    gloss: 'Daniel dice: Capisco. Ognuno ha la sua opinione.'
    note: Un modo naturale e cordiale di chiudere un disaccordo.
