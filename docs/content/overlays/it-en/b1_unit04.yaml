course:
  title: Inglese B1
  description: Impara l'inglese a livello B1, per doveri, possibilità, situazioni ipotetiche e racconti di vita quotidiana, con spiegazioni dettagliate in italiano.
units:
  en.b1.unit04.debate:
    title: I agree, I disagree, because
lessons:
  en.b1.unit04.lesson01.debate_vocabulary:
    title: Agree, disagree e opinion
  en.b1.unit04.lesson02.agreeing_and_disagreeing:
    title: I agree that, I disagree that
  en.b1.unit04.lesson03.reading_two_opinions:
