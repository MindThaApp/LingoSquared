teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: sintomo, disturbo
    note: '*symptom* significa «sintomo» o «disturbo» che si avverte. Fai attenzione alla scrittura: *symptom* si scrive con *y*.'
    example_gloss: Questo è un sintomo.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: tosse
    note: '*cough* significa «tosse». Si pronuncia *kof*; qui *gh* si legge come *f*.'
    example_gloss: Ho la tosse.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: febbre
    note: '*fever* significa «febbre». La parola ha la stessa origine dell''italiano «febbre» (dal latino *febris*), ma la scrittura è diversa.'
    example_gloss: Hai la febbre?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: gola
    note: '*throat* significa «gola» nel senso di faringe; per la parte esterna del collo si dice *neck*.'
    example_gloss: Mi fa male la gola.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: mal di testa
    note: '*headache* significa «mal di testa» (in inglese è al singolare).'
    example_gloss: Ho mal di testa.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: medicina, farmaco
    note: '*medicine* significa «medicina» o «farmaco». La parola è non numerabile: *some medicine*.'
    example_gloss: Prendi questa medicina.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: Ho la tosse.
    note: In inglese si dice *have a cough* con *a*; in italiano si dice «ho la tosse», con l'articolo determinativo «la».
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: Mi fa male la gola.
    note: '*hurts* significa «fa male». In inglese il soggetto è la parte del corpo (*my throat hurts*), mentre in italiano c''è «mi» come complemento.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: Ho mal di testa.
    note: 'In inglese si dice *have a headache* con *a*; in italiano non c''è nessun articolo: «ho mal di testa».'
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: Ha una medicina?
    note: '*Do you have...?* chiede se qualcosa c''è.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Lo prenda con l'acqua.
    note: '*with water* sta alla fine della frase.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Per favore, chieda a un medico.
    note: '*Please* rende la frase cortese.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Leila nomina un disturbo
    gloss: 'Leila dice: Buongiorno. Ho la tosse.'
    note: '*I have a cough* indica un disturbo.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: Il farmacista chiede della febbre
    gloss: 'Il farmacista dice: Ha la febbre?'
    note: '*Do you have a fever?* è una domanda con risposta sì o no.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: Leila non ha la febbre
    gloss: 'Leila dice: No, non ho la febbre. Mi fa male la gola.'
    note: '*No, I do not have...* nega un disturbo. In inglese si nega con *do not*, non con «non» davanti al verbo come in italiano.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: Il farmacista chiede del mal di testa
    gloss: 'Il farmacista dice: Ha mal di testa?'
    note: '*headache* significa «mal di testa».'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: Leila ha mal di testa
    gloss: 'Leila dice: Sì, ho mal di testa.'
    note: '*Yes* significa «sì».'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: Il consiglio del farmacista
    gloss: 'Il farmacista dice: Prenda questa medicina con l''acqua. Per favore, chieda a un medico se si sente peggio.'
    note: '*if you feel worse* significa «se si sente peggio».'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Leila ringrazia
    gloss: 'Leila dice: Grazie.'
    note: '*Thank you* è la formula breve di ringraziamento.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: Biglietto della farmacia
    gloss: 'Biglietto della farmacia: Tosse e mal di gola. Niente febbre. Prendere la medicina con l''acqua. Chiedere a un medico se peggiora.'
    note: Il biglietto indica i disturbi e semplici consigli.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'Testo: una visita in farmacia'
    gloss: 'Una visita in farmacia: Leila è andata in farmacia perché aveva la tosse e le faceva male la gola. Il farmacista le ha chiesto se avesse la febbre. Leila ha detto di non avere la febbre, ma di avere mal di testa. Il farmacista le ha dato una medicina e le ha detto di prenderla con l''acqua. Sul biglietto c''era scritto di chiedere a un medico se si fosse sentita peggio.'
    note: '*felt worse* è il passato di *feel worse*.'
