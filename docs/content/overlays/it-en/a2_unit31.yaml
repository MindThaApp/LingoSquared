teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: ritardo
    note: '*delay* significa ritardo.'
    example_gloss: Il treno delle 5:15 ha 45 minuti di ritardo.
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: cancellato / soppresso
    note: '*cancelled* significa che qualcosa non ha luogo. Per i treni in italiano si dice di solito: il treno è soppresso.'
    example_gloss: Il treno delle 5:15 non è stato soppresso, ha solo ritardo.
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: alternativa
    note: '*alternative* significa un''altra possibilità.'
    example_gloss: 'L''addetto ha proposto un''alternativa: un autobus alle 5:30.'
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: avviso / comunicazione
    note: '*notice* indica una comunicazione scritta per i viaggiatori, per esempio un avviso in stazione.'
    example_gloss: In stazione ho letto un avviso sul ritardo.
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: guasto ai segnali
    note: '*signal problem* indica un guasto ai segnali della linea ferroviaria.'
    example_gloss: Il ritardo è dovuto a un guasto ai segnali sulla linea.
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: Chiedere cortesemente il motivo
    gloss: Volevo chiedere perché il treno è in ritardo.
    note: '*I was wondering why...* è un modo cortese e indiretto di chiedere un motivo.'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: Chiedere un'alternativa
    gloss: C'è un altro modo per tornare a casa stasera?
    note: Con *Is there another way to...?* si chiedono alternative.
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: Dire il motivo del ritardo
    gloss: Il treno è in ritardo a causa di un guasto ai segnali.
    note: Con *has been delayed because of...* si indica il motivo di un ritardo.
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: orario di partenza
    note: '*departure time* significa orario di partenza.'
    example_gloss: Il nuovo orario di partenza è alle 6:00.
  en.a2.unit31.lesson03.teach.notice_text:
    title: Testo della comunicazione
    gloss: 'Avviso: Il treno delle 5:15 è in ritardo a causa di un guasto ai segnali. Il nuovo orario di partenza è alle 6:00. Alle 5:30 c''è un autobus disponibile davanti alla stazione.'
    note: Un avviso formale con il motivo, il nuovo orario e un'alternativa.
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: Comunicare la propria decisione
    gloss: Prenderò invece l'autobus.
    note: '*instead* significa invece.'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: L'addetto offre aiuto
    gloss: 'L''addetto chiede: Posso aiutarLa?'
    note: '*Can I help you?* è una domanda standard del personale di stazione.'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: Daniel chiede il motivo
    gloss: 'Daniel dice: Sì, volevo chiedere perché il treno è in ritardo.'
    note: La stessa domanda cortese della lezione 2.
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: L'addetto spiega il ritardo
    gloss: 'L''addetto dice: C''è un guasto ai segnali sulla linea. Il nuovo orario di partenza è alle 6:00.'
    note: L'addetto dice il motivo e il nuovo orario di partenza.
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: Daniel chiede un'alternativa
    gloss: 'Daniel dice: C''è un altro modo per tornare a casa stasera?'
    note: La stessa domanda della lezione 2.
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: L'addetto indica l'alternativa
    gloss: 'L''addetto dice: Alle 5:30 parte un autobus da davanti alla stazione.'
    note: L'addetto indica un'alternativa concreta con orario e luogo.
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: La decisione finale di Daniel
    gloss: 'Daniel dice: Grazie. Allora prenderò invece l''autobus.'
    note: Daniel ringrazia l'addetto e comunica la sua decisione.
