teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: ha detto che
    note: '*said that* si usa per riferire ciò che ha detto un''altra persona.'
    example_gloss: Ha detto che era molto impegnata.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: mi ha detto che
    note: '*told me that* si usa quando qualcuno ha dato a te un''informazione.'
    example_gloss: Mi ha detto che la riunione era stata annullata.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: ha chiesto se
    note: '*asked whether* riporta una domanda sì/no e suona un po'' più formale di *asked if*.'
    example_gloss: Mia ha chiesto se avevamo bisogno di aiuto.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: ha chiesto se
    note: '*asked if* riporta una domanda sì/no nel linguaggio di tutti i giorni.'
    example_gloss: Mia ha chiesto se avevamo bisogno di aiuto.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: messaggio
    note: '*message* indica un breve messaggio scritto o vocale.'
    example_gloss: Leila ha mandato un messaggio dopo pranzo.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: confermare
    note: '*confirm* significa dire che qualcosa è sicuro o giusto.'
    example_gloss: Conferma per favore l'orario prima di uscire.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: disponibile, avere tempo
    note: '*available* significa libero o in grado di incontrarsi.'
    example_gloss: Mia è disponibile dopo pranzo.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Riportare un'affermazione
    gloss: Mia ha detto che era disponibile dopo pranzo.
    note: 'Nel discorso indiretto *is* diventa spesso *was*: *Mia said that she was available*. Come in italiano, dove si dice «ha detto che era» al passato, l''inglese sposta il verbo indietro di un tempo; in italiano però è possibile anche il presente: «ha detto che è disponibile».'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Riferire informazioni a lei
    gloss: Leila mi ha detto che in ufficio c'era molto da fare.
    note: '*told me that* si usa quando qualcuno ha dato a te direttamente l''informazione.'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Discorso diretto e indiretto
    gloss: 'Mia dice: «Sono disponibile.» Mia ha detto che era disponibile.'
    note: 'Discorso diretto: *I am available*. Indiretto: *Mia said that she was available*. Nel discorso indiretto l''affermazione originale spesso arretra di un tempo.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: breve riassunto
    note: '*short summary* indica una versione breve con solo i punti più importanti.'
    example_gloss: Per la riunione di oggi basta un breve riassunto.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: rapporto completo
    note: '*full report* indica l''intero rapporto, non solo la versione breve.'
    example_gloss: Mia ha chiesto se avevamo bisogno del rapporto completo.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Testo: lo scambio di messaggi'
    gloss: Leila ha letto il messaggio di Mia e ha chiamato Daniel. Ha detto che Mia era disponibile dopo pranzo. Ha detto anche che Mia aveva finito i numeri. Mia ha chiesto se il team avesse bisogno oggi del rapporto completo. Daniel ha detto a Leila che bastava un breve riassunto, perché la riunione durava solo quindici minuti.
    note: Un breve testo di lettura su come riferire affermazioni e domande.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel chiede la risposta di Mia
    gloss: 'Daniel dice: Mia ha risposto per la revisione?'
    note: Una domanda sì/no su un messaggio precedente.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila riporta l'affermazione di Mia
    gloss: 'Leila dice: Sì, ha detto che era disponibile dopo pranzo.'
    note: '*she said that she was available* riferisce l''affermazione di Mia.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel continua a chiedere
    gloss: 'Daniel dice: Bene. Ha chiesto anche qualcos''altro?'
    note: Una domanda per sapere se nel messaggio c'era un'altra domanda.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila riporta la domanda di Mia
    gloss: 'Leila dice: Ha chiesto se oggi ci serve il rapporto completo.'
    note: '*asked if* trasforma una domanda diretta sì/no in discorso indiretto.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel chiede la risposta di Leila
    gloss: 'Daniel dice: Che cosa le hai detto?'
    note: Una domanda sull'informazione che Leila ha dato.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila riporta la sua risposta
    gloss: 'Leila dice: Le ho detto che bastava un breve riassunto.'
    note: '*I told her that...* riporta informazioni che hai dato a un''altra persona.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel conclude lo scambio di messaggi
    gloss: 'Daniel dice: Perfetto. Dirò al team che possiamo vederci alle due.'
    note: Daniel usa di nuovo *tell ... that* per trasmettere informazioni.
