teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: contanti
    note: '*cash* indica il denaro contante (banconote e monete). In inglese è un nome non numerabile: *some cash*, mai *a cash*.'
    example_gloss: Ho dei contanti.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: carta
    note: '*card* è la parola generica per qualsiasi carta di pagamento di plastica.'
    example_gloss: La mia carta è blu.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: carta di credito
    note: '*credit card* è una carta con cui prendi in prestito denaro dalla banca e lo restituisci più tardi. Corrisponde all''italiano «carta di credito».'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: carta di debito / bancomat
    note: '*debit card* è una carta con cui i soldi vengono addebitati subito sul tuo conto. Il bancomat italiano è una *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: totale
    note: '*total* è l''importo complessivo che devi pagare.'
    example_gloss: Qual è il totale?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: Accettate carte di credito?
    note: '*Do you take credit cards?* è la domanda abituale prima di pagare. Qui *take* significa «accettare».'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Mi dispiace, solo contanti.
    note: '*Sorry, cash only.* è la risposta abituale dei negozi che non accettano carte.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Sì, pago con la carta.
    note: '*Yes, I''ll pay by card.* è la scelta finale del metodo di pagamento. Dopo *by* si dice *card* senza articolo.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: tassa, imposta
    note: '*tax* è l''imposta; nella maggior parte dei negozi americani viene aggiunta al prezzo solo alla cassa (diversamente dall''IVA, che in Italia è già compresa nel cartellino).'
    example_gloss: L'imposta è un dollaro.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: Scontrino
    gloss: 'Caffè: 3 dollari. Panino: 6 dollari. Imposta: 1 dollaro. Totale: 10 dollari.'
    note: Questo è uno scontrino vero.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: Il totale è 10 dollari.
    note: Questa frase riassume il totale dello scontrino in una frase completa.
  en.a1.unit15.lesson04.teach.q_total:
    title: Chiedere il totale
    gloss: Leila chiede quanto fa il totale
    note: '*How much is the total?* è la domanda abituale sull''importo finale. *is* è al singolare perché *the total* è un''unica somma.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: Risposta sul totale
    gloss: 'Il cassiere dice: sono quindici dollari.'
    note: '*It''s fifteen dollars.* è una risposta completa alla domanda sul totale.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: Chiedere del pagamento con carta
    gloss: Leila chiede se accettano carte di credito
    note: La stessa domanda di prima.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: Risposta sul pagamento con carta
    gloss: 'Il cassiere dice: sì, le accettiamo.'
    note: '*Yes, we do.* è una risposta breve completa. In inglese si ripete l''ausiliare *do* invece di dire solo «sì».'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: Scelta finale del pagamento
    gloss: 'Leila dice: perfetto, pago con la carta.'
    note: Questa frase conclude la conversazione con la scelta finale del pagamento.
