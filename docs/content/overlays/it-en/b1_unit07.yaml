teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: se, qualora
    note: '*if* introduce una condizione possibile.'
    example_gloss: Se l'autobus è in ritardo, ti chiamo.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: a meno che, se non
    note: '*unless* significa all''incirca *if not*: qualcosa accade, tranne se la condizione si verifica.'
    example_gloss: A meno che il piano non cambi, ci vediamo alle dieci.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: condizione
    note: '*condition* indica la situazione che deve verificarsi per prima.'
    example_gloss: 'La condizione è chiara: cominciamo se arrivano tutti.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: risultato, conseguenza
    note: '*result* indica ciò che accade a causa di una condizione.'
    example_gloss: Il risultato è che ci incontriamo online.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: ritardo
    note: '*delay* significa che qualcosa accade più tardi del previsto.'
    example_gloss: Un ritardo può far arrivare tutti tardi.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: spostare a un altro appuntamento
    note: '*reschedule* significa scegliere un nuovo orario per un appuntamento o una riunione.'
    example_gloss: Se il medico è molto impegnato, spostiamo l'appuntamento.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Eine reale Bedingung mit Ergebnis
    gloss: Se la riunione comincia in ritardo, mando un messaggio a tutti.
    note: 'Con una condizione reale nel futuro, dopo *if* c''è il presente: *If the meeting starts late*, non *will start*.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Eine verneinte Bedingung
    gloss: Se il rapporto non è pronto, spostiamo la revisione.
    note: '*if ... not* rende negativa la condizione.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Reale Bedingungen in der Zukunft
    gloss: Se comincia in ritardo, mando un messaggio. Se il rapporto non è pronto, spostiamo la revisione.
    note: Dopo *if* c'è il presente, e nel risultato c'è spesso *will*.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: piano di riserva, piano B
    note: '*backup plan* indica un piano aggiuntivo per il caso in cui il primo non funzioni.'
    example_gloss: Ci serve un piano di riserva nel caso in cui la sala sia occupata.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: spostare l'aggiornamento
    note: '*move the update* significa discutere l''aggiornamento in un altro momento.'
    example_gloss: Se Leila è in ritardo, spostiamo il suo aggiornamento a domani.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Lesetext: der Ersatzplan'
    gloss: Daniel scrive un piano di riserva per la riunione del team. Se la sala conferenze è libera, il team si incontra lì alle dieci. Se la sala è occupata, si incontrano online. A meno che Leila non si colleghi entro le dieci, Daniel sposta il suo aggiornamento a domani. Se il rapporto non è pronto, Mia manda invece un aggiornamento più breve.
    note: Un breve testo di lettura con condizioni reali, risultati e *unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia fragt nach dem Plan
    gloss: 'Mia dice: Daniel, che cosa facciamo se la riunione comincia in ritardo?'
    note: Una domanda sul risultato di una possibile condizione.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel nennt das Ergebnis
    gloss: 'Daniel dice: Se comincia in ritardo, mando un messaggio a tutti.'
    note: '*If it starts late, I will...* collega una possibilità reale a un''azione concreta.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia fragt nach Leila
    gloss: 'Mia dice: E se Leila non può collegarsi?'
    note: Una breve domanda di approfondimento con la stessa struttura condizionale.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel verwendet 'unless'
    gloss: 'Daniel dice: A meno che non si colleghi entro le dieci, spostiamo il suo aggiornamento a domani.'
    note: '*unless she joins by ten* significa: se non si collega entro le dieci.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia fragt nach dem Raum
    gloss: 'Mia dice: Mi sembra giusto. E se la sala è ancora occupata, ci incontriamo online?'
    note: Mia verifica il piano di riserva per una sala occupata.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel bestätigt den Online-Plan
    gloss: 'Daniel dice: Sì, se la sala è occupata, ci incontriamo invece online.'
    note: '*instead* significa che questo piano sostituisce l''altro.'
