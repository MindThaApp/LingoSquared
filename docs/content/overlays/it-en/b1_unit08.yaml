    gloss: entro il momento in cui
    note: '*by the time* significa al più tardi nel momento in cui accade qualcosa.'
    example_gloss: Quando Mia arriverà, la cena sarà pronta.
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: farsi sentire per dire che si è arrivati o al sicuro
    note: '*check in* significa avvisare brevemente qualcuno che si è arrivati o che si è al sicuro.'
    example_gloss: Fatti sentire quando arrivi in albergo.
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: chiudere a chiave
    note: '*lock up* significa chiudere e mettere in sicurezza una stanza o un edificio.'
    example_gloss: Chiudo a chiave prima di lasciare l'ufficio.
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: Fare qualcosa subito dopo
    gloss: Appena arrivo a casa, ti chiamo.
    note: '*as soon as* mostra che la seconda azione avviene subito dopo la prima.'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: Fare prima qualcosa
    gloss: Prima di salire di sopra, controlla per favore la posta.
    note: '*before* mostra quale azione deve avvenire per prima.'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: Il presente nelle frasi temporali
    gloss: Quando arrivo a casa, ti chiamo. Prima di salire di sopra, controlla per favore la posta.
    note: 'Nelle subordinate temporali inglesi per l''evento futuro si usa il presente: *when I get home*, non *when I will get home*. In italiano invece si usa spesso il futuro: «quando arriverò a casa».'
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: porta d'ingresso
    note: '*front door* indica la porta principale sul davanti di una casa o di un edificio.'
    example_gloss: Daniel chiude a chiave la porta d'ingresso dopo aver controllato la posta.
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: pronto
    note: '*ready* significa preparato o pronto all''uso.'
    example_gloss: Quando Mia arriverà, la cena sarà pronta.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Testo: il programma della serata'
    gloss: Daniel ha una routine serale molto attenta. Quando torna a casa, per prima cosa controlla la posta. Dopo aver controllato la posta, chiude a chiave la porta d'ingresso. Prima di iniziare la cena, si lava le mani e sparecchia il tavolo. Quando arriva Mia, la cucina è a posto e il cibo è caldo.
    note: Un breve testo di lettura con *when*, *after*, *before* e *by the time*.
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila chiede una telefonata
    gloss: 'Leila dice: Daniel, puoi chiamarmi quando torni a casa?'
    note: Una domanda con *when* per indicare il momento dell'azione.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel promette di chiamare subito
    gloss: 'Daniel dice: Certo. Appena arrivo a casa, ti chiamo.'
    note: '*as soon as* chiarisce che chiama subito.'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila dà un primo compito
    gloss: 'Leila dice: Controlla per favore la posta prima di salire di sopra.'
    note: '*before* mostra che la posta viene per prima.'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel dice il prossimo passo
    gloss: 'Daniel dice: Va bene. Dopo aver controllato la posta, chiudo a chiave la porta d''ingresso.'
    note: '*after* mostra l''ordine tra due azioni.'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila indica il momento
    gloss: 'Leila dice: Bene. Quando arriverà Mia, dovrebbe essere tutto pronto.'
    note: '*by the time* significa che tutto dovrebbe essere pronto in quel momento o prima.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel conclude il piano
    gloss: 'Daniel dice: Allora possiamo iniziare la cena quando arriva.'
    note: '*when she arrives* indica il momento in cui possono iniziare.'
