  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: Questo tavolo è libero?
    note: '*free* qui significa libero/non occupato, come in italiano "un tavolo libero".'
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: Posso ordinare adesso?
    note: '*Can I...?* è un modo diretto di chiedere qualcosa, meno formale di *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: Vorrei l'insalata, per favore.
    note: '*I''d like* (contrazione di *I would like*) è il modo cortese di ordinare.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: Quanto costa l'insalata?
    note: '*How much is...?* chiede il prezzo.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: Potremmo avere il conto, per favore?
    note: '*Could we have...?* è il modo cortese di chiedere. In italiano spesso si usa il condizionale ("Potremmo avere...?"); in inglese *could* è l''equivalente naturale e cortese.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: Buon appetito!
    note: '*Enjoy your meal!* è un''espressione fissa che il cameriere dice prima che inizi a mangiare. Alla lettera significa "goditi il pasto", ma l''italiano "Buon appetito!" è costruito in modo diverso. Impara la frase come un blocco unico, non parola per parola.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila chiede del tavolo
    gloss: 'Leila dice: Ciao! Questo tavolo è libero?'
    note: '*Is this table free?* usa *free* con il senso di libero/non occupato.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: Il cameriere indica un tavolo
    gloss: 'Il cameriere dice: Sì, prego, si sieda qui.'
    note: '*please sit here* è un invito breve e cortese.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia chiede la lista dei piatti
    gloss: 'Mia dice: Potrei vedere la lista dei piatti, per favore?'
    note: '*Could I see...?*: di nuovo il *could* cortese, come in *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: Il cameriere porta la lista dei piatti
    gloss: 'Il cameriere dice: Certo, ecco a Lei.'
    note: '*Of course, here you are* è un modo fisso di porgere qualcosa.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: L'ordinazione di Leila
    gloss: 'Leila dice: Vorrei il pollo, per favore.'
    note: 'Un fatto a parte: Leila ordina il pollo.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: L'ordinazione di Mia
    gloss: 'Mia dice: Vorrei l''insalata, per favore.'
    note: 'Un fatto a parte: Mia ordina l''insalata.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: Il cameriere augura buon appetito
    gloss: 'Il cameriere dice: Ottima scelta! Buon appetito!'
    note: '*Enjoy your meal!*: la frase fissa di chiusura prima che i clienti inizino a mangiare.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila chiede il prezzo del pollo
    gloss: 'Leila dice: Quanto costa il pollo?'
    note: '*How much is...?* chiede il prezzo.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: Il prezzo del pollo
    gloss: 'Il cameriere dice: Il pollo costa dodici dollari.'
    note: 'Un fatto a parte: il prezzo del pollo, separato da quello dell''insalata e dal conto totale.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia chiede il prezzo dell'insalata
    gloss: 'Mia dice: Quanto costa l''insalata?'
    note: '*How much is...?*: la stessa forma di domanda usata per il pollo.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: Il prezzo dell'insalata
    gloss: 'Il cameriere dice: L''insalata costa sette dollari.'
    note: 'Un secondo fatto a parte: il prezzo dell''insalata.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila chiede il conto"
    gloss: 'Leila dice: Potremmo avere il conto, per favore?'
    note: '*Could we have...?*: di nuovo il *could* cortese.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: Il conto totale
    gloss: 'Il cameriere dice: Sono diciannove dollari, prego.'
    note: 'Un terzo fatto a parte: il conto totale, diverso dai prezzi singoli di pollo e insalata.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Lista dei piatti
    gloss: 'Lista dei piatti del ristorante: Pollo - $12. Insalata - $7. Pizza - $10. Succo - $3.'
    note: La lista mostra quattro voci con i relativi prezzi.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Testo: Un pasto al ristorante'
    gloss: Una sera Leila e Mia decisero di provare un nuovo ristorante in centro. Un cameriere le accompagnò a un tavolo vicino alla finestra. Portò loro una lista con pollo, insalata, pizza e succo. Leila ordinò il pollo e Mia ordinò l'insalata. Il pollo costava dodici dollari e l'insalata sette. Mentre mangiavano, parlarono del corso di fotografia di Mia. Quando ebbero finito, il cameriere portò il conto. Erano diciannove dollari in tutto per le due. Leila disse che il ristorante era eccellente e Mia disse che la prossima volta vuole portare qui Daniel.
    note: '*ordered* è il passato di *order* (ordinare).'
