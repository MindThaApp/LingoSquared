  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: La domanda di Mia
    gloss: 'Mia chiede: Qual è la tua stagione preferita, Leila?'
    note: '*What''s your favorite ...?* chiede la preferenza di una persona.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Risposta di Leila"
    gloss: 'Leila dice: L''autunno. Le foglie cambiano colore e c''è un tempo ideale per dipingere all''aperto.'
    note: '*great weather for painting outside* significa: un tempo ideale per dipingere all''aperto.'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: La reazione di Mia
    gloss: 'Mia dice: Che bello. La mia stagione preferita è la primavera.'
    note: '*My favorite season is spring* significa: la mia stagione preferita è la primavera.'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: La domanda di Leila
    gloss: 'Leila chiede: Perché la primavera?'
    note: '*Why spring?* è un modo breve per chiedere il motivo.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Risposta di Mia"
    gloss: 'Mia dice: I fiori sbocciano e adoro fotografarli per il mio corso di fotografia.'
    note: '*I love taking photos* significa: adoro fare foto.'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: La domanda di Leila
    gloss: 'Leila dice: Ha senso! In primavera da te fa caldo o freddo?'
    note: '*That makes sense!* è una reazione naturale a una buona spiegazione.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Di solito fa caldo, con un po'' di pioggia. Perfetto per passeggiare all''aperto.'
    note: '*with a little rain* significa: con un po'' di pioggia.'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Testo su tre stagioni preferite
    gloss: Daniel, Leila e Mia hanno tutti una stagione preferita diversa. La stagione preferita di Daniel è l'estate. Ama giocare a calcio e andare a correre quando il tempo è caldo e soleggiato. La stagione preferita di Leila è l'autunno, perché ama dipingere le foglie mentre cambiano colore. La stagione preferita di Mia è la primavera. Fotografa i fiori per il suo corso di fotografia. Anche se amano stagioni diverse, trovano sempre il tempo per godersi insieme l'aria aperta.
    note: '*even though* significa: anche se, sebbene.'
