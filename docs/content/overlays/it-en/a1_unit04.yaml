teaching:
  en.a1.unit04.lesson01.teach.monday:
    title: Monday
    gloss: lunedì
    note: '*Monday* significa lunedì; in inglese i giorni della settimana si scrivono sempre con la maiuscola, a differenza dell''italiano, dove si scrivono con la minuscola.'
    example_gloss: Lunedì ho tempo.
  en.a1.unit04.lesson01.teach.tuesday:
    title: Tuesday
    gloss: martedì
    note: '*Tuesday* significa martedì.'
    example_gloss: Martedì ho tempo.
  en.a1.unit04.lesson01.teach.wednesday:
    title: Wednesday
    gloss: mercoledì
    note: '*Wednesday* significa mercoledì; la prima *d* non si pronuncia.'
    example_gloss: Mercoledì ho tempo.
  en.a1.unit04.lesson01.teach.thursday:
    title: Thursday
    gloss: giovedì
    note: '*Thursday* significa giovedì.'
    example_gloss: Giovedì ho tempo.
  en.a1.unit04.lesson01.teach.friday:
    title: Friday
    gloss: venerdì
    note: '*Friday* significa venerdì; nel calendario americano è un normale giorno lavorativo, non un giorno di riposo.'
    example_gloss: Venerdì ho tempo.
  en.a1.unit04.lesson01.teach.saturday:
    title: Saturday
    gloss: sabato
    note: '*Saturday* significa sabato; nel calendario americano fa parte del fine settimana.'
    example_gloss: Sabato ho tempo.
  en.a1.unit04.lesson01.teach.sunday:
    title: Sunday
    gloss: domenica
    note: '*Sunday* significa domenica; nel calendario americano la settimana di solito inizia di domenica, non di lunedì come in Italia.'
    example_gloss: Domenica ho tempo.
  en.a1.unit04.lesson01.teach.what_day:
    title: What day is it today?
    gloss: Che giorno è oggi?
    note: '*What day is it today?* chiede il giorno della settimana, non la data completa.'
  en.a1.unit04.lesson02.teach.january:
    title: January
    gloss: gennaio
    note: '*January* è il primo mese dell''anno.'
    example_gloss: Il mio compleanno è a gennaio.
  en.a1.unit04.lesson02.teach.march:
    title: March
    gloss: marzo
    note: '*March* è il terzo mese dell''anno.'
    example_gloss: Il mio compleanno è a marzo.
  en.a1.unit04.lesson02.teach.july:
    title: July
    gloss: luglio
    note: '*July* è il settimo mese dell''anno.'
    example_gloss: Il mio compleanno è a luglio.
  en.a1.unit04.lesson02.teach.september:
    title: September
    gloss: settembre
    note: '*September* è il nono mese dell''anno.'
    example_gloss: Il mio compleanno è a settembre.
  en.a1.unit04.lesson02.teach.december:
    title: December
    gloss: dicembre
    note: '*December* è l''ultimo mese dell''anno.'
    example_gloss: Il mio compleanno è a dicembre.
  en.a1.unit04.lesson02.teach.which_month:
    title: Which month is it?
    gloss: Che mese è?
    note: '*Which month is it?* chiede il mese in corso.'
  en.a1.unit04.lesson03.teach.whats_the_date:
    title: What's today's date?
    gloss: Quanti ne abbiamo oggi?
    note: '*What''s today''s date?* chiede la data completa, non solo il giorno della settimana.'
  en.a1.unit04.lesson03.teach.its_july_7:
    title: It's July 7th.
    gloss: È il 7 luglio.
    note: 'Nell''inglese americano il mese viene PRIMA del giorno: *July 7th*. È l''ordine inverso rispetto all''italiano, che mette prima il giorno e poi il mese (7 luglio).'
  en.a1.unit04.lesson03.teach.its_tuesday_july_7:
    title: It's Tuesday, July 7th.
    gloss: È martedì 7 luglio.
    note: 'Il giorno della settimana precede la data completa: [giorno della settimana], [mese] [giorno].'
  en.a1.unit04.lesson03.teach.numeric_form:
    title: You can also write it as 7/7.
    gloss: Si può scrivere anche 7/7.
    note: 'Attenzione: nella scrittura numerica americana il formato è mese/giorno (*7/7* = 7 luglio), non giorno/mese come in italiano (7/7). Questa differenza crea vera confusione: *7/9* significa 9 luglio, non 7 settembre.'
  en.a1.unit04.lesson03.teach.birthday_question:
    title: When's your birthday?
    gloss: Quando compie gli anni? / Quand'è il tuo compleanno?
    note: '*When''s your birthday?* chiede la data di nascita, cioè il compleanno.'
  en.a1.unit04.lesson03.teach.birthday_answer:
    title: My birthday is March 3rd.
    gloss: Il mio compleanno è il 3 marzo.
    note: Per il compleanno si usa il verbo *is*, proprio come per la data di oggi.
  en.a1.unit04.lesson04.teach.opens:
    title: opens
    gloss: apre
    note: '*opens* è la terza persona singolare di *open* (aprire).'
    example_gloss: La biblioteca apre giovedì.
  en.a1.unit04.lesson04.teach.again:
    title: again
    gloss: di nuovo
    note: '*again* significa di nuovo o ancora una volta.'
    example_gloss: Ci vediamo di nuovo presto!
  en.a1.unit04.lesson04.teach.q_date:
    title: Daniel chiede la data
    gloss: 'Daniel: Quanti ne abbiamo oggi?'
    note: È la stessa domanda imparata prima, ora in una conversazione vera.
  en.a1.unit04.lesson04.teach.a_date:
    title: Risposta sulla data
    gloss: 'Leila: È martedì 7 luglio.'
    note: Una risposta completa dice sia il giorno della settimana sia la data.
  en.a1.unit04.lesson04.teach.q_library:
    title: Chiedere della riapertura
    gloss: 'Daniel: Quando riapre la biblioteca?'
    note: '*When''s the library open again?* chiede la data della riapertura.'
  en.a1.unit04.lesson04.teach.a_library:
    title: Risposta sulla riapertura
    gloss: 'Leila: Apre giovedì 9 luglio.'
    note: '*It opens on Thursday, July 9th*; la preposizione *on* sta davanti al giorno della settimana.'
  en.a1.unit04.lesson04.teach.closing:
    title: L'etichetta della farmacia
    gloss: 'Daniel dice: Perfetto, ci vediamo allora!'
    note: '*See you then* significa che ci si rivedrà al momento indicato.'
