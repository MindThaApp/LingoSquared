course:
  title: Inglese B2
  description: Impara l'inglese a livello B2 per conversazioni sfumate, argomentazioni, ipotesi e discussioni professionali, con spiegazioni in italiano colloquiale.
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Concordanza, contraddizione e fondatezza
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Lettura: un sondaggio e un rapporto dell''azienda di trasporti'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: fonte
    note: '*source* è una fonte che fornisce informazioni. Non usare *according to* dappertutto: a volte si tratta di concordanza o contrasto tra fonti.'
    example_gloss: Una fonte fornisce informazioni.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: mettere insieme, sintetizzare
    note: '*synthesize* significa combinare le informazioni di più fonti in una risposta coerente.'
    example_gloss: Sintetizzare significa combinare le informazioni di diverse fonti.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: valutare
    note: '*evaluate* significa giudicare quanto qualcosa sia solido.'
    example_gloss: Valutare è stimare quanto qualcosa sia solido.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: concordanza
    note: '*agreement* significa che le fonti dicono la stessa cosa su un punto.'
    example_gloss: La concordanza significa che le fonti dicono la stessa cosa.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: contraddizione, conflitto
    note: '*conflict* significa che le fonti si contraddicono o differiscono su un punto.'
    example_gloss: Il conflitto significa che le fonti non sono d'accordo.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: giudizio motivato
    note: '*judgment* è un giudizio fondato su quale fonte sia più solida. In inglese americano si scrive *judgment*; in inglese britannico si trova anche *judgement*.'
    example_gloss: Un giudizio spiega quale fonte sia più solida.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Concordanza più conflitto
    gloss: Entrambe le fonti concordano sul fatto che la domanda sia aumentata, ma non sono d'accordo sulla causa.
    note: '*Both sources agree... but they disagree...* è meglio di due frasi separate con un continuo *according to*.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: invece, al contrario
    note: '*By contrast* si usa quando contrapponi davvero due fonti o due punti. Non usarlo come semplice riempitivo al posto di ''invece''.'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: meglio fondato
    note: '*better supported on the cause* significa che le prove sulla causa sono più solide.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Costruire una sintesi
    gloss: Una sintesi dovrebbe indicare dove le fonti concordano, dove sono in conflitto e quale resoconto è meglio fondato.
    note: Usa *agree*, *conflict* e *better supported* per rendere preciso il rapporto tra le fonti.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: sondaggio, indagine
    note: '*survey* raccoglie risposte o commenti da più persone.'
    example_gloss: Un sondaggio può raccogliere molti commenti.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: resoconto, versione dei fatti
    note: '*account* è un resoconto o una spiegazione di ciò che è accaduto.'
    example_gloss: Un resoconto spiega che cosa è accaduto.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Fonte A: Il sondaggio tra i passeggeri dice che gli autobus in ritardo sono diventati più frequenti dopo l''apertura del nuovo ospedale. Molti passeggeri dicono che ora la linea è affollata, soprattutto al mattino. Il sondaggio sostiene che la causa principale sia la maggiore domanda.'
    note: La fonte A contiene molti commenti dei passeggeri, ma questo non è automaticamente la prova più forte della causa.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Fonte B: Il rapporto dell''azienda di trasporti concorda sul fatto che la domanda sia aumentata dopo l''apertura dell''ospedale, ma individua come causa principale del servizio in ritardo la carenza di autisti. Il rapporto include i registri del personale per lo stesso periodo.'
    note: '*staffing records* forniscono una prova più solida della causa rispetto alla sola esperienza dei passeggeri.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa cita la fonte A
    gloss: 'Tessa dice: Ho letto due resoconti sul servizio di autobus in ritardo. Il sondaggio tra i passeggeri dice che la domanda è aumentata dopo l''apertura del nuovo ospedale.'
    note: Questo introduce una fonte e un punto sulla maggiore domanda.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan cita la fonte B
    gloss: 'Rowan dice: Il rapporto dell''azienda di trasporti concorda sul fatto che la domanda sia aumentata, ma dice che il problema principale era la carenza di autisti.'
    note: La fonte B conferma un punto, ma differisce sulla causa.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa fa la sintesi
    gloss: 'Tessa dice: Quindi le fonti concordano sulla maggiore domanda, ma sono in conflitto sulla causa.'
    note: '*agree on* e *conflict about* riassumono il rapporto tra le fonti.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan chiede delle prove
    gloss: 'Rowan chiede: Quale resoconto è meglio fondato?'
    note: Chiede un giudizio, non solo un riassunto.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa confronta le prove
    gloss: 'Tessa dice: Il sondaggio contiene molti commenti dei passeggeri, ma il rapporto dell''azienda di trasporti include i registri del personale.'
    note: 'Questa è una questione di prove: commenti contro dati.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan chiede un giudizio
    gloss: 'Rowan chiede: E quindi, qual è il tuo giudizio?'
    note: '*judgment* richiede una conclusione motivata.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa esprime il suo giudizio
    gloss: 'Tessa dice: Il rapporto dell''azienda di trasporti è meglio fondato sulla causa, anche se il sondaggio è utile per mostrare l''esperienza dei passeggeri.'
    note: '*although* tiene presenti entrambe le fonti pur esprimendo un giudizio.'
