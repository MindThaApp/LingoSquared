teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: quartiere
    note: '*neighborhood* significa quartiere: la zona intorno a casa tua, con le strade e gli edifici vicini.'
    example_gloss: Amo il mio quartiere.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: vicino / vicina di casa
    note: '*neighbor* significa vicino di casa: una persona che abita accanto a te o nelle vicinanze.'
    example_gloss: Il mio vicino è molto disponibile.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: nei dintorni / vicino
    note: '*nearby* significa vicino, nei dintorni.'
    example_gloss: C'è un parco qui vicino.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: tranquillo / silenzioso
    note: '*quiet* significa tranquillo, senza molto rumore.'
    example_gloss: La mia strada è molto tranquilla di notte.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: rumoroso
    note: '*noisy* significa pieno di rumori forti.'
    example_gloss: La strada accanto alla mia è rumorosa.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: cordiale / gentile
    note: '*friendly* significa cordiale, gentile.'
    example_gloss: I miei vicini sono molto cordiali.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: abitare in un quartiere
    note: '*live in a neighborhood* significa abitare in un quartiere.'
    example_gloss: Abito in un quartiere tranquillo.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: andare d'accordo con i vicini
    note: '*get along with your neighbors* significa avere un buon rapporto, cordiale, con le persone che abitano vicino a te.'
    example_gloss: Vado d'accordo con i miei vicini.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: vicino a
    note: '*close to* significa vicino a (un luogo).'
    example_gloss: Il mio appartamento è vicino a un supermercato.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: cinque minuti a piedi
    note: '*a five-minute walk* è uno schema fisso dell''inglese: numero + sostantivo al singolare, con il trattino, prima di *walk*. In italiano si dice «cinque minuti a piedi» o «una passeggiata di cinque minuti»; in inglese *minute* resta al singolare (non *minutes*).'
    example_gloss: Il parco è a cinque minuti a piedi da casa mia.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: salutare / dire ciao a
    note: '*say hello to* significa salutare qualcuno, dire ciao a qualcuno.'
    example_gloss: Saluto sempre il mio vicino la mattina.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: Com'è il tuo quartiere?
    note: '*What''s ... like?* chiede una descrizione, non una preferenza.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: La domanda di Leila
    gloss: 'Leila dice: Forse mi trasferirò presto. Com''è il tuo quartiere, Mia?'
    note: '*might* + verbo esprime una possibilità: forse sì, forse no.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Mi piace molto. È tranquillo e c''è un parco qui vicino.'
    note: '*there''s a park nearby* significa c''è un parco qui vicino.'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: La domanda di Leila
    gloss: 'Leila dice: Che bello. È vicino a un supermercato?'
    note: '*That sounds nice* è una risposta naturale a una buona notizia.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Sì, ce n''è uno a soli cinque minuti a piedi da casa mia.'
    note: '*just* qui significa solo, appena: sottolinea quanto è breve la distanza.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: La domanda di Leila
    gloss: 'Leila chiede: E i tuoi vicini? Sono cordiali?'
    note: '*What about ...?* è un modo naturale per introdurre un nuovo argomento.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Risposta di Mia"
    gloss: 'Mia dice: Molto cordiali! Il mio vicino, il signor Lopez, annaffia le mie piante quando sono via.'
    note: '*waters my plants* significa annaffia le mie piante: in inglese *water* qui è un verbo.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: La reazione di Leila
    gloss: 'Leila dice: Che carino. Penso che mi piacerebbe abitare vicino a te!'
    note: '*I''d like to* + verbo significa: mi piacerebbe + verbo.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Testo su tre quartieri
    gloss: Daniel, Leila e Mia abitano tutti e tre in quartieri diversi. Il quartiere di Daniel è animato, con ristoranti e negozi vicino al suo condominio. Conosce diversi vicini e spesso li saluta nel corridoio. Leila abita in un quartiere tranquillo, vicino alla piscina dove nuota. La sua vicina di fronte ha un grosso cane che abbaia molto. Anche il quartiere di Mia è tranquillo, con un supermercato a cinque minuti a piedi da casa sua. Il suo vicino, il signor Lopez, è molto cordiale e annaffia le sue piante quando lei è via. Dopo aver parlato con Mia, Leila ha deciso di cercare un appartamento vicino a lei.
    note: '*decided she wants to look for* significa: ha deciso che vuole cercare un appartamento.'
