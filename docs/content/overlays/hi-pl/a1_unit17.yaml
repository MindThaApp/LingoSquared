teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: मैं इंजीनियर / शिक्षक हूँ
    gloss: मैं इंजीनियर हूँ। मैं शिक्षिका हूँ। -- 'inżynier' और 'nauczycielka' के अंत 'Jestem' के बाद बदल जाते हैं।
    note: इस कोर्स में पहली बार किसी शब्द का अंत यह बताने के लिए बदलता है कि आप क्या काम करते हैं -- अभी यह सिर्फ़ पेशे के इन्हीं दो शब्दों पर लागू होता है।
  pl.a1.unit17.lesson01.teach.inzynier:
    title: इंजीनियर
    gloss: इंजीनियर
    note: रोज़मर्रा की पोलिश में स्त्री के लिए भी यह शब्द आम तौर पर *inżynier* ही रहता है।
    example_gloss: Marek इंजीनियर है।
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: शिक्षक
    gloss: शिक्षक (पुल्लिंग) / शिक्षिका (स्त्रीलिंग)
    note: '*inżynier* के विपरीत, पेशे का यह शब्द लिंग के अनुसार बदलता है -- पुरुष के लिए *nauczyciel*, स्त्री के लिए *nauczycielka*।'
    example_gloss:
    - वह शिक्षक है।
    - Ewa शिक्षिका है।
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek और Ewa, फिर से
    gloss: Marek, Ewa -- ये नाम आप पहले के पाठों से जानते हैं।
    note: इस पाठ में दोनों नाम आएँगे, उससे पहले एक छोटी याद-दिहानी।
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: है -- फिर से
    gloss: Jest -- यह शब्द आप पहले के पाठों से जानते हैं, जैसे 'Dom jest tam' (घर वहाँ है)।
    note: इस पाठ में इसका उपयोग किसी के पेशे के बारे में बताने के लिए होगा, उससे पहले एक छोटी याद-दिहानी।
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Marek का पेशा
    gloss: Marek इंजीनियर है।
    note: Marek के बारे में यही तथ्य इस पूरी यूनिट का आधार है।
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Ewa का पेशा
    gloss: Ewa शिक्षिका है।
    note: Ewa के बारे में यही तथ्य इस पूरी यूनिट का आधार है।
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: काम करना -- तुम काम करते हो
    gloss: 'Pracować (pracuję आप पहले के पाठों से जानते हैं): pracuję (मैं), pracujesz (तुम)। तुम कहाँ काम करते हो?'
    note: अभी सिर्फ़ दो रूप -- अपने बारे में *pracuję*, किसी और से पूछने के लिए *pracujesz*; ठीक वही ढाँचा जो पिछली यूनिट में *czuć się* का था।
  pl.a1.unit17.lesson02.teach.szkola:
    title: स्कूल
    gloss: स्कूल
    note: वह जगह जहाँ Ewa जैसी शिक्षिका काम करती है।
    example_gloss: मैं स्कूल में काम करता/करती हूँ।
  pl.a1.unit17.lesson02.teach.biuro:
    title: दफ़्तर
    gloss: दफ़्तर
    note: वह जगह जहाँ Marek जैसा इंजीनियर काम करता है।
    example_gloss: मैं दफ़्तर में काम करता/करती हूँ।
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: स्कूल में, दफ़्तर में
    gloss: 'W + कार्यस्थल: w szkole, w biurze -- वही ढाँचा जो w Warszawie या w Krakowie में है।'
    note: यह उन शहरों के नामों जैसा ही है जो आप पहले सीख चुके हैं (*w Warszawie*, *w Krakowie*) -- *में* कहने के लिए अंत थोड़ा बदल जाता है।
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: आप कहाँ काम करते हैं?
    gloss: आप कहाँ काम करते हैं?
    note: किसी के काम के बारे में पूछने का स्वाभाविक सवाल।
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: और तुम -- फिर से
    gloss: A ty -- यह अभिव्यक्ति आप पहले के पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek, Ewa से काम के बारे में पूछता है
    gloss: तुम कहाँ काम करती हो, Ewa?
    note: Marek सीधे सवाल से बातचीत शुरू करता है।
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Ewa जवाब देती है
    gloss: मैं स्कूल में काम करती हूँ। मैं शिक्षिका हूँ।
    note: Ewa अपना कार्यस्थल और पेशा दोनों बताती है -- वही बातें जो इस यूनिट में पहले बताई गईं।
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa, Marek से वही सवाल पूछती है
    gloss: और तुम, Marek? तुम कहाँ काम करते हो?
    note: Ewa सवाल Marek की ओर मोड़ देती है।
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: मारेक जवाब देता है
    gloss: मैं दफ़्तर में काम करता हूँ। मैं इंजीनियर हूँ।
    note: मारेक अपना कार्यस्थल और अपना पेशा, दोनों बताता है -- ये वही बातें हैं जो इस यूनिट में पहले आ चुकी हैं।
