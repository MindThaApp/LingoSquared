teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: शून्य
    note: इस इकाई की आगे आने वाली हर संख्या का आरंभ-बिंदु।
    example_gloss: आज तापमान शून्य डिग्री है।
  pl.a1.unit02.lesson01.teach.jeden:
    title: एक
    gloss: एक
    note: '*Jeden* के बाद सामान्य एकवचन संज्ञा आती है, जबकि इस पाठ की बाकी सभी संख्याओं के बाद ऐसा नहीं होता।'
    example_gloss: मेरे पास एक फ़ोन है।
  pl.a1.unit02.lesson01.teach.dwa:
    title: दो
    gloss: दो
    note: '*Dwa*, *trzy* और *cztery* के बाद संज्ञा का एक विशेष बहुवचन रूप आता है (जैसे *psy*, "कुत्ते") -- यह *pięć* और उससे आगे की संख्याओं के बाद आने वाले बहुवचन रूप से अलग है।'
    example_gloss: मेरे पास दो कुत्ते हैं।
  pl.a1.unit02.lesson01.teach.trzy:
    title: तीन
    gloss: तीन
    note: '*dwa* जैसा ही बहुवचन पैटर्न: *trzy złote* (तीन ज़्लोटी), *trzy złotych* नहीं।'
    example_gloss: कॉफ़ी तीन ज़्लोटी की है।
  pl.a1.unit02.lesson01.teach.cztery:
    title: चार
    gloss: चार
    note: उन तीन संख्याओं (*dwa*, *trzy*, *cztery*) में से आख़िरी, जो यही बहुवचन पैटर्न साझा करती हैं।
    example_gloss: मेरे पास चार किताबें हैं।
  pl.a1.unit02.lesson01.teach.piec:
    title: पाँच
    gloss: पाँच
    note: '*pięć* से आगे की संख्याओं के बाद संज्ञा का एक अलग बहुवचन रूप आता है (संबंध कारक बहुवचन, जैसे *minuty* की जगह *minut*) -- यह पैटर्न इस इकाई में आगे भी दिखेगा।'
    example_gloss: मेरे पास पाँच मिनट हैं।
  pl.a1.unit02.lesson01.teach.szesc:
    title: छह
    gloss: छह
    note: '*pięć* जैसा ही संबंध कारक बहुवचन पैटर्न: *sześć jabłek* (छह सेब)।'
    example_gloss: मेरे पास छह सेब हैं।
  pl.a1.unit02.lesson01.teach.siedem:
    title: सात
    gloss: सात
    note: सप्ताह के दिनों की बात करने के लिए उपयोगी संख्या।
    example_gloss: एक सप्ताह में सात दिन होते हैं।
  pl.a1.unit02.lesson01.teach.osiem:
    title: आठ
    gloss: आठ
    note: '*Mam osiem lat* का शाब्दिक अर्थ है "मेरे पास आठ साल हैं" -- पोलिश में उम्र *mieć* ("रखना, पास होना") से बताई जाती है। इस पैटर्न का पूरा अभ्यास आप पाठ 3 में करेंगे।'
    example_gloss: मैं आठ साल का हूँ।
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: नौ
    gloss: नौ
    note: 'फिर संबंध कारक बहुवचन: *dziewięć osób* (नौ लोग)।'
    example_gloss: नौ लोग कतार में प्रतीक्षा कर रहे हैं।
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: दस
    gloss: दस
    note: एक अंक वाली संख्याओं में आख़िरी -- पाठ 2 आगे ग्यारह से बीस और दहाइयों तक जाता है।
    example_gloss: मेरी दस उँगलियाँ हैं।
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: ग्यारह
    gloss: ग्यारह
    note: '11 से 19 तक की संख्याएँ *-naście* पर समाप्त होती हैं। *pięć* और उससे आगे की संख्याओं की तरह इनके बाद भी संबंध कारक बहुवचन आता है: *jedenaście osób*।'
    example_gloss: कक्षा में ग्यारह लोग हैं।
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: बारह
    gloss: बारह
    note: '*jedenaście* जैसा ही *-naście* पैटर्न।'
    example_gloss: एक साल में बारह महीने होते हैं।
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: पंद्रह
    gloss: पंद्रह
    note: 'अब भी *-naście* वाला पैटर्न: *piętnaście minut* (पंद्रह मिनट)।'
    example_gloss: मेरे पास पंद्रह मिनट का ब्रेक है।
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: बीस
    gloss: बीस
    note: 20 से 40 तक की संख्याएँ *-dzieści* पर समाप्त होती हैं -- यह *-naście* वाले पैटर्न से अलग है। *Dwadzieścia* के बाद भी संबंध कारक बहुवचन आता है (*dwadzieścia lat*), पर इकाई का अंक जोड़ने पर क्या होता है, यह पाठ 3 में देखिए।
    example_gloss: मेरी उम्र बीस साल है।
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: इक्कीस
    gloss: इक्कीस
    note: पोलिश में संयुक्त संख्याएँ पहले दहाई और फिर इकाई बोलकर बनती हैं, बीच में कोई जोड़ने वाला शब्द नहीं आता।
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: तीस
    gloss: तीस
    note: वही *-dzieści* पैटर्न, जो *dwadzieścia* में देखा।
    example_gloss: टिकट तीस ज़्लोटी का है।
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: पचास
    gloss: पचास
    note: 50 से 90 तक की संख्याओं में *-dzieści* की जगह तीसरा पैटर्न *-dziesiąt* आता है।
    example_gloss: मेरे पास पचास ज़्लोटी हैं।
  pl.a1.unit02.lesson02.teach.sto:
    title: सौ
    gloss: सौ
    note: एक सीधी गोल संख्या, जिसमें कोई संयुक्त अंत याद रखने की ज़रूरत नहीं।
    example_gloss: वह सौ ज़्लोटी का है।
  pl.a1.unit02.lesson02.teach.ile:
    title: कितना / कितने
    gloss: कितना; कितने
    note: किसी भी मात्रा या कीमत के बारे में पूछने वाला प्रश्नवाचक शब्द।
    example_gloss: यह कितने का है?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: दाम पूछना
    gloss: यह कितने का है?
    note: '*Kosztować* ("कीमत होना") क्रिया है; *to* ("यह") कर्ता है। पूरा प्रश्न एक स्थायी और बहुत आम पैटर्न है।'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: क़ीमत बताना
    gloss: यह बीस ज़्लोटी का है।
    note: '*Złotych* पोलिश मुद्रा *złoty* का संबंध कारक बहुवचन है -- वही बहुवचन पैटर्न जो *dwadzieścia* स्वयं पहले से लेता है।'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: किसी पुरुष से फ़ोन नंबर पूछना
    gloss: आपका फ़ोन नंबर क्या है? (पुरुष से, औपचारिक)
    note: 'शाब्दिक अर्थ: "सज्जन का फ़ोन नंबर क्या है।" *Pana* *pan* का स्वामित्व वाला (संबंध कारक) रूप है -- "सज्जन का", यानी "आपका"।'
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: किसी महिला से फ़ोन नंबर पूछना
    gloss: आपका फ़ोन नंबर क्या है? (महिला से, औपचारिक)
    note: किसी महिला को औपचारिक रूप से संबोधित करने के लिए *pana* की जगह *pani* रखिए, जैसा इकाई 1 के पैटर्न में था।
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: अनौपचारिक रूप से फ़ोन नंबर पूछना
    gloss: तुम्हारा फ़ोन नंबर क्या है? (अनौपचारिक)
    note: दोस्त या हमउम्र से बात करते समय *pana*/*pani* की जगह *twój* (तुम्हारा, अनौपचारिक) आता है।
  pl.a1.unit02.lesson03.teach.numer_to:
    title: नंबर बताने की शुरुआत
    gloss: नंबर है...
    note: अंक एक-एक करके पढ़ने से पहले बोला जाने वाला छोटा, स्वाभाविक आरंभ -- पोलिश में फ़ोन नंबर बोलकर बताने का सामान्य तरीका।
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: एक नमूना फ़ोन नंबर
    gloss: छह, एक, पाँच, शून्य, दो।
    note: पोलिश में फ़ोन नंबर अंक-दर-अंक पढ़े जाते हैं -- यहाँ हर अंक वही है जो इस इकाई में पहले सिखाया जा चुका है।
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: अनौपचारिक रूप से किसी की उम्र पूछना
    gloss: तुम्हारी उम्र क्या है? (अनौपचारिक)
    note: 'शाब्दिक अर्थ: "तुम्हारे पास कितने साल हैं" -- पोलिश में उम्र *mieć* ("रखना, पास होना") से बताई जाती है, वही पैटर्न जिसकी झलक पाठ 1 में *osiem* कार्ड पर मिली थी।'
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: औपचारिक रूप से किसी की उम्र पूछना
    gloss: आपकी उम्र कितनी है? (पुरुष से, औपचारिक)
    note: '*Ma* वही तीसरे पुरुष का क्रिया-रूप है जो इकाई 1 में *pan jest*/*pan ma* में देखा था -- *pan* व्याकरण में "सज्जन" जैसा तीसरे पुरुष का कर्ता है।'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: अपनी उम्र बताना
    gloss: मैं अट्ठाईस साल का/की हूँ।
    note: '*Mam* क्रिया *mieć* ("रखना, पास होना") का उत्तम पुरुष रूप है। *Dwadzieścia osiem* *osiem* (आठ) पर समाप्त होता है, इसलिए 5-9 पर समाप्त होने वाली हर संख्या की तरह इसके साथ *lat* आता है -- पाठ 3 के संवाद में ऐसी संख्या देखिए जो अलग अंक पर समाप्त होती है।'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: एवा मारेक का नंबर पूछती है
    gloss: एवा मारेक से औपचारिक रूप से उसका फ़ोन नंबर पूछती है।
    note: इस पाठ का औपचारिक फ़ोन नंबर वाला प्रश्न ज्यों का त्यों दोहराया गया है।
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: मारेक अपना नंबर बताता है
    gloss: मारेक अपना फ़ोन नंबर अंक-दर-अंक पढ़कर बताता है।
    note: यहाँ का हर अंक इस इकाई के पाठ 1-2 में पहले ही सिखाया जा चुका है।
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: एवा मारेक की उम्र पूछती है
    gloss: एवा उसे धन्यवाद देती है और औपचारिक रूप से उसकी उम्र पूछती है।
    note: '*Dziękuję* ("धन्यवाद") और *A* ("और") औपचारिकता के स्तर के साथ नहीं बदलते, जैसा इकाई 1 के *dziękuję* कार्ड में था।'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: मारेक अपनी उम्र बताता है और वही प्रश्न लौटाता है
    gloss: मारेक कहता है कि वह अट्ठाईस साल का है और औपचारिक रूप से एवा से उसकी उम्र पूछता है।
    note: '*A pani?* किसी महिला को औपचारिक रूप से वही प्रश्न लौटाता है, वही छोटा पैटर्न जो इकाई 1 में *A pan?* के लिए सिखाया गया था।'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: एवा अपनी उम्र बताती है
    gloss: एवा कहती है कि वह बत्तीस साल की है।
    note: '*Trzydzieści dwa* *dwa* (दो) पर समाप्त होता है, इसलिए *dwadzieścia osiem* (जो आठ पर समाप्त होता है और *lat* लेता है) के विपरीत इसके साथ *lata* आता है -- 2, 3 या 4 पर समाप्त होने वाली संख्याएँ (11-14 को छोड़कर) यह अलग बहुवचन रूप लेती हैं। यह एक सच्चा व्याकरणिक बारीक नियम है: *lat* और *lata* एक-दूसरे की जगह नहीं आ सकते, और कौन-सा सही है, यह संख्या के अंतिम अंक पर निर्भर करता है।'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: मारेक बातचीत समाप्त करता है
    gloss: मारेक कहता है कि उससे बात करके अच्छा लगा, और विदा लेता है।
    note: '*Do zobaczenia* इकाई 1 का "फिर मिलेंगे" वाला विदाई-वाक्य दोहराता है।'
