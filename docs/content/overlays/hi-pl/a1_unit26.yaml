  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या आपके पास कोई पालतू जानवर है?
    note: यह वही *Masz ...?* प्रश्न-रचना है जो आप पिछले पाठों में सीख चुके हैं; *masz*, *mieć* का *ty* वाला रूप है।
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: हाँ, मेरे पास एक कुत्ता है
    gloss: हाँ, मेरे पास एक कुत्ता है।
    note: इस यूनिट की नई शब्दावली के साथ एक सरल सकारात्मक उत्तर।
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: नहीं, मेरे पास कोई पालतू जानवर नहीं है
    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: '*Nie mam* के बाद संबंधकारक आता है, जो उस चीज़ को नकारता है जो आपके पास नहीं है: *zwierzaka*। व्याकरण-टिप्पणी देखिए।'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + संबंधकारक
    gloss: '*nie mam* के बाद वस्तु संबंधकारक में आती है: *Nie mam czasu* (मेरे पास समय नहीं है) और यहाँ *Nie mam zwierzaka* (मेरे पास पालतू जानवर नहीं है)।'
    note: यह *Nie mam czasu* वाली ही रचना है; बस संज्ञा नई है। *zwierzak* जैसी पुल्लिंग सजीव संज्ञाओं में कर्मकारक और संबंधकारक का रूप एक जैसा दिखता है, जबकि स्त्रीलिंग संज्ञाओं में बदलाव दिखता है (*Mam rybę* से *Nie mam ryby*)।
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: (जानवर को) टहलाने ले जाना
    gloss: (जानवर को) सैर पर ले जाना
    note: '*Wyprowadzać na spacer* जानवर को सैर कराने का स्थिर मुहावरा है; क्रिया अपूर्ण रूप में है क्योंकि यह आदत है। व्याकरण-टिप्पणी देखिए।'
    example_gloss: मैं रोज़ कुत्ते को सैर पर ले जाता हूँ।
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: आदत के लिए अपूर्ण रूप
    gloss: '*Wyprowadzać* (अपूर्ण रूप) आदत बताता है: *Codziennie wyprowadzam psa.* पूर्ण रूप *wyprowadzić* एक बार की पूरी हुई सैर के लिए आता है।'
    note: 'पहलू के जोड़े: अपूर्ण रूप (*wyprowadzać*) बार-बार होने वाले काम के लिए है, और पूर्ण रूप (*wyprowadzić*) एक बार पूरे हुए काम के लिए।'
  pl.a1.unit26.lesson02.teach.karmic:
    title: खाना खिलाना
    gloss: खाना खिलाना
    example_gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: के साथ खेलना
    gloss: के साथ खेलना
    example_gloss: Tomek अपनी बिल्ली के साथ खेलता है।
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को सैर पर ले जाता हूँ।
    note: यह *wyprowadzać na spacer* को *codziennie* (हर दिन) के साथ जोड़ता है; वस्तु *psa* कर्मकारक में है।
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: '*Karmić* (खाना खिलाना) जानवर के कर्मकारक रूप के साथ आता है: *karmię kota*। यहाँ यह *codziennie* के साथ जुड़ा है।'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'बहुवचन: pies, psy'
    gloss: 'बहुवचन: *pies* से *psy*, *kot* से *koty*, *ryba* से *ryby*, *ptak* से *ptaki*। ज़्यादातर बहुवचन *-y* पर खत्म होते हैं, और k तथा g के बाद *-i* आता है।'
    note: पोलिश का नियमित बहुवचन-ढाँचा, जो यहाँ पहली बार जानवरों की संज्ञाओं के उदाहरण से समझाया गया है।
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: कुत्ते और बिल्लियाँ
    gloss: कुत्ते / बिल्लियाँ
    example_gloss:
    - Marek को कुत्ते बहुत प्यारे हैं।
    - Kasia को बिल्लियाँ बहुत प्यारी हैं।
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: मछलियाँ और पक्षी (बहुवचन)
    gloss: मछलियाँ / पक्षी
    example_gloss:
    - मुझे मछलियाँ बहुत पसंद हैं।
    - दादाजी को पक्षी बहुत पसंद हैं।
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: मुझे जानवर बहुत पसंद हैं
    gloss: मुझे जानवर बहुत पसंद हैं।
    note: '*Kocham*, *kochać* का *ja* वाला रूप है; उसकी वस्तु *zwierzęta* कर्मकारक बहुवचन में है।'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है
    gloss: Kasia को बिल्लियाँ बहुत प्यारी हैं, पर उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek पालतू जानवर के बारे में पूछता है
    gloss: 'Marek: Ewa, क्या तुम्हारे पास कोई पालतू जानवर है?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa के पास कुत्ता है
    gloss: 'Ewa: हाँ, मेरे पास एक कुत्ता है।'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek पूछता है कि वह कैसा दिखता है
    gloss: 'Marek: वह कैसा दिखता है?'
    note: यह पहले के पाठ का *Jak wygląda ...?* प्रश्न है, जो अब किसी जानवर के बारे में पूछा गया है; कुत्ते के लिए *on* कहा जा सकता है।
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa अपने कुत्ते का वर्णन करती है
    gloss: 'Ewa: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: जानवरों के लिए on और ona
    gloss: 'जानवरों का भी व्याकरणिक लिंग होता है: *pies* और *kot* के लिए *on* (वह, पुल्लिंग), *ryba* के लिए *ona* (वह, स्त्रीलिंग)। ये सर्वनाम केवल व्यक्ति के लिए नहीं, जानवर के लिए भी आ सकते हैं।'
    note: 'सर्वनाम संज्ञा के लिंग का अनुसरण करता है: *pies* और *ptak* के साथ *on*, *ryba* के साथ *ona*, और *zwierzę* के साथ *ono* आता है।'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek सैर के बारे में पूछता है
    gloss: 'Marek: क्या तुम उसे हर दिन सैर पर ले जाती हो?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa अपनी दिनचर्या बताती है
    gloss: 'Ewa: हाँ, मैं उसे हर दिन सैर पर ले जाती हूँ और खाना खिलाती हूँ।'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia और Tomek जानवरों के बारे में
    gloss: 'Marek और Kasia दोनों को जानवर बहुत प्यारे हैं, पर उनमें से किसी के पास पालतू जानवर नहीं है। Marek को कुत्ते प्यारे हैं और Kasia को बिल्लियाँ। Tomek के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और हर दिन उसे खाना देता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      kochają: बहुत पसंद है
      oboje: दोनों
      zwierzęta: जानवर
      zwierzaka: पालतू जानवर
      psy: कुत्ते
      koty: बिल्लियाँ
      kota: बिल्ली
      bawi: खेलता है
      daje: देता है
      co: हर
      jeść: खाना
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: Tomek अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*Bawić się z* (के साथ खेलना) के बाद करणकारक आता है: *z kotem*। *Często* का अर्थ ''अक्सर'' है, यह बारंबारता बताने वाला क्रियाविशेषण है।'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa, Nina से पूछती है
    gloss: 'Ewa: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Ma na imię* (उसका नाम ... है) वही अभिव्यक्ति है जो पहले नाम बताने के लिए आई थी।'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek प्रतिक्रिया देता है
    gloss: 'Marek: कितना अच्छा! तुम हर दिन उसके साथ क्या करती हो?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek को भी पक्षी प्यारे हैं
    gloss: 'Marek: मुझे भी पक्षी बहुत प्यारे हैं।'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa बातचीत समाप्त करती है
    gloss: 'Ewa: कितना अच्छा है कि हम तीनों को जानवर प्यारे हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
