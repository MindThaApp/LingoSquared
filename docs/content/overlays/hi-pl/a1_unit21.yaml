teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: खुश, उदास और नाराज़
    gloss: खुश, उदास, नाराज़
    note: '*jestem* (मैं हूँ) के साथ इस्तेमाल होने वाले तीन बुनियादी भाव-शब्द। ये पुल्लिंग रूप हैं; महिला *szczęśliwa, smutna, zła* कहती है।'
    example_gloss:
    - मैं खुश हूँ।
    - मैं उदास हूँ।
    - मैं नाराज़ हूँ।
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: खुश होने की बात कहना
    gloss: मैं खुश हूँ।
    note: '*Jestem* (मैं हूँ, *być* से) + विशेषण बुनियादी ढाँचा है, जैसे हिंदी में "मैं ... हूँ"। पोलिश में विशेषण बोलने वाले के लिंग के अनुसार बदलता है: *szczęśliwy* (पुरुष), *szczęśliwa* (महिला)।'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: भावनाओं की तुलना करना
    gloss: मैं नाराज़ नहीं हूँ, मैं उदास हूँ।
    note: '*Nie* क्रिया के ठीक पहले आता है: *Nie jestem zły*। दूसरा उपवाक्य फिर असली भावना बताता है।'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: कारण पूछना
    gloss: आप खुश क्यों हैं?
    note: '*Dlaczego* (क्यों) कारण पूछने का सामान्य प्रश्नवाचक शब्द है।'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: कारण बताना
    gloss: मैं खुश हूँ क्योंकि मेरे पास एक नया अपार्टमेंट है।
    note: '*Bo* (क्योंकि) कारण बताता है; *mam* (मेरे पास है) के बाद संज्ञा कर्म कारक में आती है: *nowe mieszkanie*।'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: नकारात्मक कारण
    gloss: मैं उदास हूँ क्योंकि बारिश हो रही है।
    note: '*Pada deszcz* (बारिश हो रही है, शाब्दिक अर्थ "बारिश गिरती है") मौसम बताने का सामान्य वाक्यांश है, जो यहाँ कारण के रूप में आया है।'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: घबराया हुआ
    gloss: घबराया हुआ
    note: घबराहट के लिए सामान्य शब्द।
    example_gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: बताना कि किस बात से घबराहट है
    gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
    note: '*Przed* (शाब्दिक अर्थ "से पहले") + करण कारक बताता है कि घबराहट किस बारे में है: *przed pierwszą zmianą*। हिंदी में यहाँ आम तौर पर "के बारे में" या "से पहले" कहा जाता है।'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: किसी को तसल्ली देना
    gloss: चिंता मत करो।
    note: '*Nie martw się* (शाब्दिक अर्थ "खुद को चिंता में मत डालो") तसल्ली देने का सामान्य वाक्यांश है; *się* स्ववाचक सर्वनाम है।'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: पूछना कि कोई कैसा महसूस करता है
    gloss: Marek कैसा महसूस करता है?
    note: '*Czuć się* (महसूस करना, स्ववाचक रूप) भावनात्मक स्थिति के बारे में पूछने या बताने का सामान्य तरीका है: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: बताना कि कोई कैसा महसूस करता है
    gloss: वह घबराया हुआ महसूस करता है।
    note: '*Się* क्रिया के साथ रहता है: *on czuje się*। विशेषण *on* के अनुसार पुल्लिंग होता है: *zdenerwowany*।'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: पूछना कि कोई ऐसा क्यों महसूस करता है
    gloss: वह घबराया हुआ क्यों महसूस करता है?
    note: यह *dlaczego* (क्यों) को *On czuje się zdenerwowany* वाले *czuje się* ढाँचे के साथ जोड़ता है।
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: भावनाओं के बारे में एक संदेश पढ़ें
    gloss: नमस्ते Ewa, मैं अपनी पहली अकेली शिफ़्ट से पहले थोड़ा घबराया हुआ हूँ। लेकिन मैं खुश भी हूँ, क्योंकि मुझे नई नौकरी और नया फ़्लैट मिला है। मुझे लगता है सब ठीक होगा।
    note: ध्यान दें कि लिखने वाला किस बात से घबराया है, किस बात से खुश है, और कुल मिलाकर उसका नज़रिया क्या है।
    glosses:
      trochę: थोड़ा
      zdenerwowany: घबराया हुआ
      pierwszą: पहली
      zmianą: शिफ़्ट
      samodzielną: अकेला
      szczęśliwy: खुश
      bo: क्योंकि
      nową: नया
      pracę: काम
      nowe: नया
      mieszkanie: अपार्टमेंट
      myślę: सोचना, मानना
      będzie: 'चल जाएगा (यहाँ: सब ठीक हो जाएगा)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa पूछती है कि Marek कैसा महसूस कर रहा है
    gloss: 'Ewa: नमस्ते Marek, अपनी पहली शिफ़्ट से पहले तुम कैसा महसूस कर रहे हो?'
    note: '*Przed pierwszą zmianą* (अपनी पहली शिफ्ट के बारे में) में पाठ 3 वाला *przed* + करण कारक का ढाँचा फिर आया है। *Czujesz się* *ty* का रूप है।'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek मानता है कि वह घबराया हुआ है
    gloss: 'Marek: सच कहूँ तो मैं थोड़ा घबराया हुआ हूँ।'
    note: '*Szczerze mówiąc* (सच कहूँ तो, शाब्दिक अर्थ "ईमानदारी से बोलते हुए") इस स्वीकारोक्ति को नरम बना देता है।'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa उसे तसल्ली देती है
    gloss: 'Ewa: चिंता मत करो, तुम अच्छी तरह सँभाल लोगे!'
    note: '*Dobrze sobie poradzisz* (शाब्दिक अर्थ: "तुम अच्छी तरह सँभाल लोगे") हौसला बढ़ाने वाली एक स्थिर अभिव्यक्ति है; *poradzisz*, *poradzić sobie* का *ty* वाला भविष्यकाल रूप है।'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek उसे धन्यवाद देता है
    gloss: 'Marek: शुक्रिया, इससे सच में मदद मिलती है।'
    note: '*Pomaga*, *pomagać* (मदद करना) का *on/ona/ono* वाला रूप है; *dzięki* अनौपचारिक "शुक्रिया" है।'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa नतीजे का अनुमान बताती है
    gloss: 'Ewa: और बाद में तुम यक़ीनन बहुत खुश और गर्वित होगे।'
    note: '*Na pewno* (यक़ीनन) पक्का अनुमान जताता है; *dumny* (गर्वित) एक नया, उपयोगी विशेषण है। *Będziesz*, *być* का भविष्यकाल रूप है।'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek सहमत होता है
    gloss: 'Marek: हाँ, मुझे भी ऐसा ही लगता है।'
    note: '*Ja też tak myślę* (शाब्दिक अर्थ "मैं भी ऐसा सोचता हूँ") सहमति जताने का स्वाभाविक तरीका है; यहाँ ज़ोर देने के लिए *ja* जोड़ा गया है।'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: jest और mu के साथ सार बताना
    gloss: Marek अपनी पहली शिफ़्ट से पहले घबराया हुआ है। Ewa उसकी मदद करती है।
    note: '*Jest*, *być* (होना) का *on/ona* वाला रूप है; *mu* का अर्थ "उसे/उसकी" है (संप्रदान कारक, क्योंकि *pomagać* के साथ यही कारक आता है)। ये छोटे शब्द हैं, पर किसी और के बारे में बात करने के लिए ज़रूरी हैं।'
