teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: जाना, पहुँचना
    gloss: जाना; पहुँचना
    note: गति वाली दो नज़दीकी क्रियाएँ -- iść सामान्य "जाना/पैदल चलना" है, जबकि dojść ख़ास तौर पर किसी मंज़िल तक "पहुँचना" है, और इसी पाठ के सवाल वाले पैटर्न में आता है।
    example_gloss:
    - कृपया सीधे जाइए।
    - बैंक तक कैसे पहुँचूँ?
  pl.a1.unit09.lesson01.teach.prosto:
    title: सीधे आगे
    gloss: सीधे
    note: दिशा बताने वाला सबसे बुनियादी शब्द -- "सीधे जाइए" कहने के लिए iść के ठीक बाद आता है।
    example_gloss: कृपया सीधे पार्क तक जाइए।
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: वहाँ, फिर
    gloss: वहाँ; फिर
    note: Tam किसी जगह की ओर इशारा करता है; potem कदमों का क्रम बताता है ("पहले यह, फिर वह") -- रास्ता बताते समय दोनों ज़रूरी हैं।
    example_gloss:
    - बैंक वहाँ है।
    - फिर, कृपया सीधे जाइए।
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Proszę + क्रिया का मूल रूप -- Proszę (कृपया) और उसके साथ क्रिया का मूल रूप रास्ता बताने का रोज़मर्रा का विनम्र तरीक़ा है, इसमें अलग आज्ञार्थक रूप की ज़रूरत नहीं पड़ती: कृपया सीधे जाइए।'
    note: '*Proszę* और उसके साथ क्रिया का मूल रूप -- पोलिश में किसी से विनम्रता से कुछ करने को कहने का यही तरीक़ा है: *Proszę iść prosto* ("कृपया सीधे जाइए")। अजनबी के साथ यही सुरक्षित और विनम्र चुनाव है, इसलिए रास्ता बताने या समझने के लिए आपको अलग आज्ञार्थक रूप की ज़रूरत नहीं। (दोस्तों के बीच पोलिश बोलने वाले आम तौर पर वही आज्ञार्थक रूप इस्तेमाल करते हैं -- वह आप आगे सीखेंगे।)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: '... तक कैसे पहुँचें + [जगह]?'
    gloss: 'Jak dojść do + [जगह]? -- Jak (कैसे) और dojść (पहुँचना) मिलकर किसी जगह का रास्ता पूछते हैं: बैंक तक कैसे पहुँचें? होटल तक कैसे पहुँचें? पार्क तक कैसे पहुँचें? do के बाद आने वाले संज्ञा-शब्द में वही -u वाला संबंध कारक अंत लगता है जो पिछली इकाई में "के बगल में" और "के सामने" के बाद लगा था: bank -> banku, hotel -> hotelu, park -> parku।'
    note: '*Jak dojść do...?* किसी जगह तक पहुँचने का तरीक़ा पूछने वाला रोज़मर्रा का सवाल है। *do* के बाद आने वाली जगह के नाम में वही *-u* वाला संबंध कारक अंत लगता है जो आप *obok* और *naprzeciwko* के बाद सीख चुके हैं -- *bank* का *banku*, *hotel* का *hotelu*, *park* का *parku*; पैटर्न बिलकुल वही है, बस उपसर्ग नया है।'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: बैंक तक कैसे पहुँचूँ?
    gloss: बैंक तक कैसे पहुँचूँ?
    note: व्याकरण-नोट के पैटर्न का इस पाठ की पहली मंज़िल के साथ इस्तेमाल।
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: दाएँ, बाएँ
    gloss: दाएँ; बाएँ
    note: na के बाद इस्तेमाल होता है, यह बताने के लिए कि कुछ कहाँ है या किधर मुड़ना है -- na prawo (दाईं ओर), na lewo (बाईं ओर)।
    example_gloss:
    - बैंक दाईं ओर है।
    - पार्क बाईं ओर है।
  pl.a1.unit09.lesson02.teach.skrecic:
    title: मुड़ना
    gloss: मुड़ना
    note: दिशा बदलने की क्रिया -- na prawo/na lewo के साथ जुड़कर "दाएँ मुड़ना"/"बाएँ मुड़ना" का अर्थ देती है।
    example_gloss: कृपया दाएँ मुड़िए।
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: कृपया बाईं ओर मुड़िए
    gloss: कृपया बाईं ओर मुड़िए।
    note: वही Proszę + क्रियार्थक का ढाँचा, इस बार skręcić और na lewo के साथ।
  pl.a1.unit09.lesson02.teach.ulica:
    title: सड़क
    gloss: सड़क
    note: किसी भी सड़क के लिए आम शब्द — जब रास्ता बताते समय किसी सड़क का नाम आए, तब यह काम आता है।
    example_gloss: सड़क वहाँ है।
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: potem से निर्देशों को जोड़ना
    gloss: 'कृपया सीधे जाइए, फिर दाईं ओर मुड़िए। -- कई निर्देशों को अल्पविराम और शब्द potem (फिर) से जोड़ा जा सकता है: पहले एक काम, फिर अगला।'
    note: 'एक के बाद एक कई निर्देश देने के लिए उन्हें अल्पविराम और *potem* से जोड़ दीजिए: *Proszę iść prosto, potem skręcić na prawo* ("कृपया सीधे जाइए, फिर दाईं ओर मुड़िए")। असली बातचीत में कई चरणों वाले निर्देश ठीक इसी तरह बने सुनाई देंगे।'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: मैं समझता/समझती हूँ
    gloss: मैं समझता/समझती हूँ
    note: रास्ता समझ लेने की पुष्टि करने का उपयोगी तरीका, इसके बाद आप कोई और सवाल पूछ सकते हैं।
    example_gloss: मैं समझ गया/गई, धन्यवाद।
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa पार्क जाने का रास्ता पूछती है
    gloss: Ewa "माफ़ कीजिए" कहकर पूछती है कि पार्क कैसे पहुँचा जाए।
    note: Przepraszam से सवाल शुरू होता है — पिछली इकाई के जगहों वाले संवाद की वही विनम्र आदत।
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: राहगीर पार्क का रास्ता बताता है
    gloss: राहगीर कहता है कि सीधे जाइए, फिर बाईं ओर मुड़िए। पार्क वहाँ है।
    note: potem से जुड़े दो निर्देश, ठीक वैसे ही जैसे इस पाठ के व्याकरण नोट में बताया गया है।
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa पुष्टि करती है और बैंक के बारे में पूछती है
    gloss: Ewa कहती है कि वह समझ गई, और पूछती है कि बैंक कैसे पहुँचा जाए।
    note: Rozumiem से पता चलता है कि उसने पहले वाले निर्देश समझ लिए हैं, इसके बाद वह नया सवाल पूछती है।
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: राहगीर बैंक का रास्ता बताता है
    gloss: राहगीर कहता है कि दाईं ओर मुड़िए, फिर सीधे जाइए। बैंक दाईं ओर है।
    note: पार्क के रास्ते से अलग दो चरणों वाला रास्ता, पर वही Proszę + क्रियार्थक का ढाँचा।
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa धन्यवाद कहती है
    gloss: Ewa बहुत-बहुत धन्यवाद कहती है।
    note: Dziękuję bardzo, जो खरीदारी और जगहों वाली इकाइयों में भी आया था।
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: राहगीर जवाब देता है
    gloss: राहगीर कहता है, आपका स्वागत है।
    note: Proszę bardzo, धन्यवाद का सामान्य उत्तर, जो पहले की इकाइयों में भी आया था।
