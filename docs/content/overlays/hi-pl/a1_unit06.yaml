  pl.a1.unit06.lesson01.teach.chleb:
    title: रोटी
    gloss: रोटी
    note: एक बुनियादी खाद्य शब्द, जो हर भोजन में बार-बार आता है।
    example_gloss: यह रोटी है।
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: मक्खन, पनीर
    gloss: मक्खन; पनीर
    note: पहला नपुंसकलिंग है और दूसरा पुल्लिंग निर्जीव संज्ञा है। इस पाठ के व्याकरण नोट के अनुसार proszę o के बाद दोनों का अंत नहीं बदलता।
    example_gloss:
    - यह मक्खन है।
    - यह पनीर है।
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: पानी, दूध
    gloss: पानी; दूध
    note: Woda स्त्रीलिंग है (इसका कर्म रूप wodę इस पाठ के व्याकरण नोट में आता है); mleko नपुंसकलिंग है और कभी नहीं बदलता।
    example_gloss:
    - यह पानी है।
    - यह दूध है।
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: कॉफ़ी, चाय
    gloss: कॉफ़ी; चाय
    note: दोनों स्त्रीलिंग हैं। ऑर्डर देते समय आप इनके कर्म रूप kawę/herbatę ही बोलते हैं, जो इस पाठ के व्याकरण नोट में है।
    example_gloss:
    - यह कॉफ़ी है।
    - यह चाय है।
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'ऑर्डर देना: proszę o + कर्म कारक'
    gloss: 'कृपया दीजिए + कर्म रूप: कॉफ़ी -> kawę, चाय -> herbatę, पानी -> wodę। रोटी, पनीर और दूध नहीं बदलते।'
    note: '*Proszę o* ("कृपया दीजिए", शब्दशः "मैं माँगता/माँगती हूँ") के बाद कर्म कारक आता है। *kawa*, *herbata* और *woda* जैसी स्त्रीलिंग संज्ञाओं में अंतिम *-a* की जगह *-ę* आ जाता है। *chleb* और *ser* जैसी पुल्लिंग निर्जीव संज्ञाएँ तथा *mleko* जैसी नपुंसकलिंग संज्ञाएँ वैसी ही रहती हैं जैसी शब्दकोश में होती हैं।'
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: कृपया कॉफ़ी दीजिए
    gloss: कृपया कॉफ़ी दीजिए।
    note: एक चीज़ मँगाने का रोज़मर्रा का विनम्र तरीका। इसमें व्याकरण नोट का पैटर्न पूरे वाक्य में काम आता है।
  pl.a1.unit06.lesson02.teach.zupa:
    title: सूप
    gloss: सूप
    note: दोपहर या रात के खाने की आम चीज़, और अक्सर दिन का ख़ास व्यंजन, जैसा इस इकाई के रेस्तराँ वाले दृश्य में है।
    example_gloss: यह सूप है।
  pl.a1.unit06.lesson02.teach.sok:
    title: जूस
    gloss: जूस
    note: chleb और ser की तरह पुल्लिंग निर्जीव संज्ञा है। ऑर्डर देते समय इसका अंत नहीं बदलता।
    example_gloss: यह जूस है।
  pl.a1.unit06.lesson02.teach.cukier:
    title: चीनी
    gloss: चीनी
    note: कॉफ़ी या चाय के लिए काम का शब्द। यह भी पुल्लिंग निर्जीव संज्ञा है, इसका अंत नहीं बदलता।
    example_gloss: यह चीनी है।
  pl.a1.unit06.lesson02.teach.rachunek:
    title: बिल
    gloss: बिल
    note: भोजन के अंत में यही माँगा जाता है। proszę o rachunek इसे माँगने का मानक, विनम्र तरीका है।
    example_gloss: बिल दीजिए, कृपया।
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'पसंद करना: lubię, lubi'
    gloss: 'पसंद करना: मैं पसंद करता/करती हूँ, वह पसंद करता/करती है -- मुझे कॉफ़ी पसंद है। उसे सूप पसंद है।'
    note: '*Lubić* का अर्थ "पसंद करना" है। यहाँ केवल उत्तम पुरुष (*lubię*) और अन्य पुरुष (*lubi*) के रूप सिखाए गए हैं। *Lubić* के साथ भी कर्म कारक आता है, वही पैटर्न जो *proszę o* में है -- *lubię kawę*, *lubię kawa* नहीं।'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: मुझे सूप पसंद है
    gloss: मुझे सूप पसंद है।
    note: कर्म कारक में zupa का zupę हो जाता है, यानी पहले पाठ के व्याकरण नोट वाला वही स्त्रीलिंग बदलाव -a -> -ę।
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: दिन का व्यंजन
    gloss: आज का ख़ास व्यंजन सूप है।
    note: '*Dnia*, *dzień* (दिन) का संबंध कारक रूप है -- *danie dnia* शब्दशः "दिन का व्यंजन" है, मेन्यू में इसे इसी तय ढंग से लिखा जाता है।'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'सुझाना: polecam, poleca'
    gloss: 'सुझाना: मैं सुझाता/सुझाती हूँ, वह सुझाता/सुझाती है -- मैं कॉफ़ी सुझाता/सुझाती हूँ। वह सूप सुझाता है।'
    note: '*Polecać* का अर्थ "सुझाना" है -- वेटर किसी व्यंजन का सुझाव देने के लिए इसका उपयोग करता है, और ग्राहक सुझाव माँगने के लिए यही क्रिया बोलता है। इसके साथ भी कर्म कारक आता है, वही पैटर्न जो *proszę o* और *lubić* में है।'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: आप क्या सुझाते हैं?
    gloss: आप क्या सुझाते हैं?
    note: '*Co* (क्या) और औपचारिक *pan* -- वेटर से पूछने का स्वाभाविक सवाल, जिसमें पहली इकाई वाला वही औपचारिक संबोधन है।'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: यह लीजिए / कोई बात नहीं
    gloss: यह लीजिए।
    note: एक लचीला, रोज़मर्रा का वाक्यांश -- कुछ परोसते समय कहा जाता है, और dziękuję (धन्यवाद) के जवाब में भी उतना ही स्वाभाविक है।
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: अभी लाया
    gloss: अभी लाया।
    note: शब्दशः "मैं अभी परोस रहा हूँ" -- वेटर का सामान्य जवाब, जो बताता है कि ऑर्डर सुन लिया गया है।
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: वेटर आज का ख़ास व्यंजन बताता है
    gloss: वेटर नमस्ते कहता है और बताता है कि आज का ख़ास व्यंजन सूप है।
    note: Dzień dobry, जो पहली इकाई के अभिवादनों में आ चुका है।
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: एवा सुझाव माँगती है
    gloss: एवा वेटर से पूछती है कि वह क्या सुझाता है।
    note: एक विनम्र, औपचारिक सवाल -- pan से वेटर को सम्मान के साथ संबोधित किया जाता है।
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: वेटर कॉफ़ी सुझाता है
    gloss: वेटर कॉफ़ी सुझाता है।
    note: Polecam -- इस पाठ के व्याकरण नोट वाला उत्तम पुरुष रूप।
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: एवा अपना ऑर्डर देती है
    gloss: एवा "ठीक है" कहती है और कॉफ़ी और सूप मँगाती है।
    note: इसमें proszę o के साथ जोड़ने वाला शब्द i (और) है, जो परिवार वाली इकाई से है; यह पहले पाठ का ऑर्डर पैटर्न और दूसरे पाठ की सूप वाली शब्दावली दोनों दोहराता है।
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: वेटर पुष्टि करता है
    gloss: वेटर कहता है कि ऑर्डर अभी आ रहा है।
    note: खाना आने से पहले की एक छोटी, स्वाभाविक पुष्टि।
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: एवा बिल माँगती है
    gloss: एवा धन्यवाद कहती है और बिल माँगती है।
    note: पहली इकाई का dziękuję और दूसरे पाठ का proszę o + rachunek दोहराए गए हैं।
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: वेटर बिल थमाता है
    gloss: वेटर कहता है, यह लीजिए।
    note: इस पाठ में पहले सिखाया गया वही proszę bardzo, जो अब बिल थमाने के लिए भी काम आ रहा है।
