teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Wysoki* लंबे व्यक्ति के लिए और *niski* छोटे कद के व्यक्ति के लिए आता है। स्त्री के लिए *wysoka* या *niska* कहा जाता है।'
    example_gloss:
    - Kasia लंबी है।
    - Tomek छोटे कद का है।
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: यहाँ *stary* और *młody* सामान्य अनुमान बताते हैं, सालों की सही संख्या नहीं।
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - Marek जवान है।
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: अनुमान या उम्र'
    gloss: '*Stary* सामान्य अनुमान बताता है, जैसे *Dziadek jest stary* में। सही उम्र बताने के लिए पोलिश में अलग संरचना आती है: *Ile masz lat?*'
    note: कोई कितना बड़ा दिखता है, यह *stary* या *młody* से बताया जाता है; सही उम्र के लिए आप *Ile masz lat?* पूछते हैं और *mam ... lat* (मेरी उम्र ... साल है) से उत्तर देते हैं।
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia लंबी है और Tomek छोटे कद का है
    gloss: Kasia लंबी है और Tomek छोटे कद का है।
    note: '*a* (और, विरोध दिखाते हुए) वाला एक सरल मिला-जुला वाक्य। *Wysoka* और *niski* स्त्रीलिंग और पुल्लिंग कर्ता के अनुसार बदलते हैं, जिससे पाठ 5 की तुलना की तैयारी होती है।'
  pl.a1.unit25.lesson02.teach.wlosy:
    title: बाल
    gloss: बाल
    note: 'पोलिश में *włosy* हमेशा बहुवचन में रहता है: *długie włosy* (लंबे बाल)।'
    example_gloss: Marek के छोटे काले बाल हैं।
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: बालों के तीन रंग। *Blond* कभी नहीं बदलता; *brązowe* और *siwe* बहुवचन रूप हैं, जो *włosy* के अनुसार हैं।
    example_gloss:
    - Ewa के बाल सुनहरे हैं।
    - Tomek के बाल भूरे हैं।
    - दादाजी के बाल स्लेटी हैं।
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Długie* (लंबे) और *krótkie* (छोटे) बहुवचन रूप हैं, जो *włosy* के अनुसार हैं।'
    example_gloss:
    - Kasia के बाल लंबे हैं।
    - Tomek के बाल छोटे हैं।
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy के साथ बहुवचन विशेषण आता है
    gloss: '*Włosy* बहुवचन है, इसलिए विशेषण भी बहुवचन होता है: लंबे बाल, छोटे बाल, भूरे बाल, काले बाल।'
    note: 'जो बहुवचन संज्ञाएँ पुरुष व्यक्तियों की नहीं हैं, उनके विशेषण *-e* पर समाप्त होते हैं: *długie włosy*। *Blond* अपवाद है: वह कभी नहीं बदलता (*blond włosy*)।'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: हमेशा बहुवचन'
    gloss: '*Włosy* (बाल) हमेशा बहुवचन में होता है: *jej włosy są długie* (उसके बाल लंबे हैं)। *Jej* का मतलब है ''उसका/उसकी/उसके''।'
    note: पोलिश में बाल बहुवचन संज्ञा है, इसलिए क्रिया और विशेषण भी बहुवचन में चलते हैं। *Jej* ('उसका/उसकी') कभी नहीं बदलता, चाहे उसकी कितनी भी चीज़ें हों।
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek के छोटे काले बाल हैं
    gloss: Marek के छोटे काले बाल हैं।
    note: '*Czarne* (काले) बहुवचन रूप है, जो *włosy* के अनुसार है।'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa के लंबे सुनहरे बाल हैं
    gloss: Ewa के लंबे सुनहरे बाल हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  pl.a1.unit25.lesson03.teach.oczy:
    title: आँखें
    gloss: आँखें
    note: '*Oczy*, *oko* का बहुवचन है; पोलिश में आमतौर पर दोनों आँखों के लिए बहुवचन ही बोला जाता है।'
    example_gloss: Marek की आँखें भूरी हैं।
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: 'आँखों के तीन रंग, *oczy* के अनुसार बहुवचन में: *niebieskie*, *brązowe*, *zielone*।'
    example_gloss:
    - Ewa की आँखें नीली हैं।
    - Tomek की आँखें भूरी हैं।
    - Kasia की आँखें हरी हैं।
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy के साथ -e आता है
    gloss: '*Oczy* बहुवचन है, इसलिए विशेषण *-e* पर समाप्त होता है: नीली आँखें, भूरी आँखें, हरी आँखें।'
    note: 'वही बहुवचन अंत जो पाठ 2 में *włosy* के साथ था: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*।'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Ewa कैसी दिखती है?
    gloss: Ewa कैसी दिखती है?
    note: '*Jak wygląda ...?* इस यूनिट का मुख्य प्रश्न है; किसी के भी रूप-रंग के बारे में पूछने के लिए इसे दोहराइए।'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa के लंबे सुनहरे बाल और नीली आँखें हैं
    gloss: Ewa के लंबे सुनहरे बाल और नीली आँखें हैं।
    note: '*i* (और) से बाल और आँखें एक ही वाक्य में जोड़ने वाला आदर्श उत्तर।'
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa, Nina का परिचय देती है
    gloss: 'Ewa: भाषा-कैफ़े में एक नई लड़की आ रही है। उसका नाम Nina है।'
    note: '*Przychodzi* (आ रही है) दृश्य में किसी नए व्यक्ति को लाता है; *do kawiarni językowej* में *do* के बाद संबंध कारक (षष्ठी) रूप आता है।'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek पूछता है कि वह कैसी दिखती है
    gloss: 'Marek: ठीक है! वह कैसी दिखती है?'
    note: इस यूनिट का मुख्य प्रश्न फिर से, इस बार नाम की जगह *ona* (वह) के साथ।
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa, Nina का कद और बाल बताती है
    gloss: 'Ewa: वह छोटे कद की है और उसके छोटे सुनहरे बाल हैं।'
    note: पाठ 1 का *niska* (*niski* का स्त्रीलिंग रूप) और पाठ 2 के बालों की शब्दावली एक साथ आई है।
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek उसकी आँखों के बारे में पूछता है
    gloss: 'Marek: और उसकी आँखें?'
    note: यहाँ *jej* अधिकारवाचक 'उसकी' है, इसलिए *jej oczy* का मतलब है 'उसकी आँखें'; *jej* कभी नहीं बदलता।
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa, Nina की आँखों का वर्णन करती है
    gloss: 'Ewa: उसकी आँखें हरी हैं।'
    note: पाठ 3 का *zielone oczy* फिर से आया है।
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek उसे पहचान लेगा
    gloss: 'Marek: शुक्रिया! तब मैं उसे पहचान लूँगा।'
    note: '*Rozpoznam* पूर्ण भविष्य काल है (''मैं पहचान लूँगा''); *ją*, *ona* (वह) का कर्म कारक रूप है।'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Tomek और Kasia की तुलना
    gloss: Tomek और Kasia भाई-बहन हैं, लेकिन वे अलग-अलग दिखते हैं। Tomek छोटे कद का है, उसके छोटे भूरे बाल और भूरी आँखें हैं। Kasia, Tomek से लंबी है और उसके लंबे भूरे बाल और हरी आँखें हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      brat: भाई
      siostra: बहन
      wyglądają: दिखना
      inaczej: अलग
      niski: छोटे कद का
      krótkie: छोटे कद का
      brązowe: भूरा (बाल)
      włosy: बाल
      oczy: आँखें
      wyższa: ज़्यादा लंबा
      długie: लंबा
      zielone: हरा
      wyglądasz: तुम दिखते हो (अनौपचारिक), यानी कोई कैसा दिखता है
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: तुलनात्मक रूप का फिर से प्रयोग
    gloss: 'तुलनात्मक रूप: *wysoki* (लंबा) बदलकर *wyższy* (ज़्यादा लंबा) हो जाता है, और जिससे तुलना हो वह *niż* (से) के बाद आता है: Kasia, Tomek से लंबी है।'
    note: 'पोलिश में तुलनात्मक रूप विशेषण का अंत बदलकर बनता है, और वह फिर भी लिंग के अनुसार बदलता है: Kasia (स्त्रीलिंग) के लिए *wyższa*।'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia के बाल Tomek से ज़्यादा लंबे हैं
    gloss: Kasia के बाल Tomek से ज़्यादा लंबे हैं।
    note: '*Dłuższe* (ज़्यादा लंबे) बहुवचन है, जो *włosy* के अनुसार है, और *niż* (से) तुलना की शुरुआत करता है।'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*Mam ...* वाला उत्तम पुरुष का एक आदर्श वाक्य, जिसे अपना रूप-रंग बताते समय दोहराया जा सकता है।'
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: मारेक को नीना दिखती है
    gloss: 'मारेक: देखो, क्या वह नीना है? उसके छोटे सुनहरे बाल और हरी आँखें हैं।'
    note: '*Patrz* (देखो) क्रिया *patrzeć* का आज्ञार्थ रूप है। *Czy to Nina?* का अर्थ है ''क्या यह नीना है?'''
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: एवा पुष्टि करती है
    gloss: 'एवा: हाँ, वह नीना ही है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: नीना मारेक को नमस्ते कहती है
    gloss: 'नीना: नमस्ते, क्या तुम मारेक हो?'
    note: 'अनौपचारिक अभिवादन वाला एक सरल प्रश्न। *być* के बाद नाम संबंध कारक के बजाय करण कारक में आता है: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: मारेक भी नीना को नमस्ते कहता है
    gloss: 'मारेक: हाँ! तुमसे मिलकर अच्छा लगा, नीना।'
    note: '*Miło cię poznać* पहली मुलाकात का सामान्य वाक्यांश है (''मिलकर अच्छा लगा''; *poznać* का अर्थ है ''जान-पहचान करना'')। नीना को संबोधन कारक में पुकारा गया है: *Nino*।'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: संवाद यहाँ समाप्त होता है — मारेक ने एवा के पहले वर्णन से नीना को सही पहचान लिया।
exercises:
  pl.a1.unit25.lesson01.exercise01.choose_kasia_jest_wysoka:
    instruction: '''Kasia jest wysoka.'' का हिंदी अर्थ चुनिए।'
    correct_option: Kasia लंबी है।
    distractors:
    - कासिया नाटी है।
    - कासिया बूढ़ी है।
    - कासिया जवान है।
    accepted_answers:
    - value: Kasia लंबी है।
      status: correct
