teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: है, हैं, यह, मुझे चाहिए -- फिर से
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- ये शब्द आप पिछले पाठों से पहले ही जानते हैं।
    note: कपड़ों की खरीदारी की बात करने के लिए इस पाठ में इनका उपयोग होगा, उससे पहले एक छोटी याद-दिहानी।
  pl.a1.unit20.lesson01.teach.sklep:
    title: दुकान
    gloss: दुकान
    note: दुकान के लिए सामान्य शब्द।
    example_gloss: मैं दुकान जा रहा हूँ।
  pl.a1.unit20.lesson01.teach.koszula:
    title: कमीज़
    gloss: कमीज़
    note: यह स्त्रीलिंग संज्ञा है -- इसके साथ विशेषण के स्त्रीलिंग रूप आएँगे।
    example_gloss: यह एक कमीज़ है।
  pl.a1.unit20.lesson01.teach.spodnie:
    title: पैंट
    gloss: पतलून
    note: पोलिश में यह हमेशा बहुवचन में रहता है, एक जोड़ी के लिए भी -- इसका कोई एकवचन रूप नहीं है।
    example_gloss: ये पैंट हैं।
  pl.a1.unit20.lesson01.teach.kupic:
    title: खरीदना
    gloss: ख़रीदना
    note: '''*chcę*'' (मैं चाहता/चाहती हूँ) के बाद इसका प्रयोग होता है, ठीक वैसे ही जैसे पहले के पाठ में ''*iść*'' (जाना) का: ''*chcę kupić*'' -- मुझे खरीदना है।'
    example_gloss: मैं एक कमीज़ खरीदना चाहता हूँ।
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: मुझे पैंट खरीदनी है
    gloss: मुझे पैंट खरीदनी है।
    note: वही chcę + क्रिया के मूल रूप वाला ढाँचा, यहाँ पैंट के लिए।
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: कमीज़ कितने की है?
    gloss: कमीज़ कितने की है?
    note: किसी खास चीज़ का दाम पूछने का स्वाभाविक तरीका, जिसमें खरीदारी वाले पाठ का '*Ile kosztuje*' दोबारा आता है।
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: कैसा -- पुल्लिंग रूप
    gloss: Jaki, Jaka -- '*Jaki*' पुल्लिंग संज्ञाओं के बारे में पूछता है और '*Jaka*' स्त्रीलिंग संज्ञाओं के बारे में (आप '*Jaka*' को मौसम वाले पाठ से जानते हैं)।
    note: '''*Kolor*'' (रंग) पुल्लिंग है, इसलिए इसके साथ ''*Jaki*'' आता है, ''*Jaka*'' नहीं।'
  pl.a1.unit20.lesson02.teach.kolor:
    title: रंग
    gloss: रंग
    note: पुल्लिंग संज्ञा।
    example_gloss: कौन-सा रंग?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: ड्रेस
    gloss: ड्रेस
    note: '''*koszula*'' की तरह यह भी एक स्त्रीलिंग संज्ञा है।'
    example_gloss: यह ड्रेस है।
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: नीला
    gloss: Koszula jest niebieska. -- '*niebieska*' स्त्रीलिंग संज्ञाओं के साथ आता है, जैसे '*koszula*'।
    note: केवल यही रूप -- अभी तक इस कोर्स में यह '*koszula*' से जुड़ा है।
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: लाल
    gloss: Sukienka jest czerwona. -- '*czerwona*' भी स्त्रीलिंग संज्ञाओं के साथ आता है, ठीक '*niebieska*' की तरह।
    note: यहाँ यही रूप '*sukienka*' से जुड़ा है, जैसे '*niebieska*' '*koszula*' से जुड़ा है।
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: कमीज़ नीली है
    gloss: कमीज़ नीली है।
    note: यह वाक्य इस पाठ में आगे फिर काम आएगा, जब मारेक कमीज़ खरीदने जाएगा।
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: ड्रेस लाल है
    gloss: ड्रेस लाल है।
    note: वही jest + रंग वाला ढाँचा, किसी दूसरी चीज़ के लिए।
  pl.a1.unit20.lesson03.teach.recap_words:
    title: नमस्ते, कृपया, बहुत -- फिर से
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- ये शब्द आप पिछले पाठों से पहले ही जानते हैं।
    note: इस पाठ के दुकान वाले संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: साइज़
    gloss: साइज़
    note: पोलैंड में कपड़ों के साइज़ आमतौर पर बस S, M और L अक्षरों से बताए जाते हैं।
    example_gloss: कौन-सा साइज़?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: श्रीमान, चाहते हैं
    gloss: Co pan chce kupić? -- '*pan*' किसी पुरुष को आदर से संबोधित करने का तरीका है, जैसे स्त्री के लिए '*pani*' (आप '*pani*' को खरीदारी वाले पाठ से जानते हैं)।
    note: '''*chce*'' क्रिया ''*chcieć*'' का वह/वह (एक व्यक्ति) वाला रूप है -- आप ''*chcę*'' (मैं चाहता/चाहती हूँ) और ''*chcesz*'' (तुम चाहते/चाहती हो) पहले से जानते हैं।'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: आप क्या खरीदना चाहेंगे, श्रीमान?
    gloss: आप क्या खरीदना चाहेंगे, श्रीमान?
    note: दुकान का सेल्समैन किसी पुरुष ग्राहक से विनम्रता से बातचीत कैसे शुरू करता है।
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: सेल्समैन मारेक का स्वागत करता है
    gloss: नमस्ते! आप क्या खरीदना चाहेंगे?
    note: Sprzedawca (दुकान का सेल्समैन) उसी विनम्र अंदाज़ में शुरू करता है जिसमें पिछली खरीदारी वाली इकाई में बाज़ार का दुकानदार बोला था।
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: मारेक बताता है कि उसे क्या चाहिए
    gloss: मुझे एक कमीज़ और पैंट खरीदनी है।
    note: मारेक दोनों चीज़ें बताता है जो उसे खरीदनी हैं।
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: सेल्समैन साइज़ पूछता है
    gloss: कौन-सा साइज़?
    note: एक छोटा और स्वाभाविक अगला सवाल।
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: मारेक अपना साइज़ बताता है
    gloss: साइज़ M।
    note: मारेक सिर्फ़ साइज़ का अक्षर बोलकर जवाब देता है, जो स्वाभाविक तरीका है।
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: सेल्समैन बताता है कि क्या उपलब्ध है और दाम क्या है
    gloss: हमारे पास एक नीली कमीज़ और पैंट है। कुल मिलाकर सौ ज़्लोटी।
    note: '''*Mamy*'' का मतलब है ''हमारे पास है'' (''*mam*''/''*masz*'' की तरह)। इसके बाद ''*koszula*'' बदलकर ''*koszulę*'' और ''*niebieska*'' बदलकर ''*niebieską*'' हो जाता है -- वही बदलाव जो आपने ''*Chcę kupić koszulę*'' में देखा था। रंग वही है जो पिछले पाठ की नीली कमीज़ का था।'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: मारेक हामी भरता है
    gloss: ठीक है, यही दे दीजिए।
    note: मारेक खरीदारी पक्की करके बातचीत समाप्त करता है।
