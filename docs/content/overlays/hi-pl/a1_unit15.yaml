teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: स्टेशन
    gloss: स्टेशन
    note: वह जगह जहाँ ट्रेनें और बसें आती-जाती हैं — पूरी इकाई की शुरुआत यहीं से होती है।
    example_gloss: स्टेशन होटल के पास है।
  pl.a1.unit15.lesson01.teach.bilet:
    title: टिकट
    gloss: टिकट
    note: ट्रेन या बस में चढ़ने से पहले आपको यह चाहिए होगा।
    example_gloss: टिकट बीस ज़्लोटी का है।
  pl.a1.unit15.lesson01.teach.peron:
    title: प्लेटफ़ॉर्म
    gloss: प्लेटफ़ॉर्म
    note: वह जगह जहाँ आप ट्रेन का इंतज़ार करते हुए खड़े होते हैं।
    example_gloss: प्लेटफ़ॉर्म नंबर एक वहाँ है।
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: प्लेटफ़ॉर्म नंबर एक, दो...
    gloss: 'प्लेटफ़ॉर्म का नंबर बताने के लिए आप Peron numer + संख्या कह सकते हैं: Peron numer jeden, Peron numer dwa.'
    note: 'यह दिखने से ज़्यादा आसान है: बस *peron* + *numer* + कोई साधारण संख्या, जो आप पहले से जानते हैं। (स्टेशन की घोषणाओं में अक्सर क्रमसूचक शब्द आते हैं, जैसे *peron pierwszy* — "पहला प्लेटफ़ॉर्म" — लेकिन *peron numer jeden* हमेशा समझा जाता है।)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: फिर से ट्रेन
    gloss: Pociąg odjeżdża o czwartej po południu -- यह वाक्य आप समय वाले पाठ से पहले ही जानते हैं।
    note: समय वाली इकाई की वही बात, अब यात्रा के दृश्य में काम आ रही है।
  pl.a1.unit15.lesson01.teach.krakow:
    title: क्राकोव
    gloss: क्राकोव
    note: पोलैंड का एक असली शहर — इस इकाई की पहली मंज़िल।
    example_gloss: क्राकोव दूर है।
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: क्राकोव तक
    gloss: 'कहीं जाते समय हम do + शहर के नाम का दूसरा रूप कहते हैं: do Krakowa (do Kraków नहीं)। इस रूप को पूरे के पूरे याद कर लीजिए।'
    note: '*Krakowa* को किसी नियम से निकालने की कोशिश न करें — अभी *do Krakowa* को एक पक्के वाक्यांश की तरह याद कर लीजिए।'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: क्राकोव का एक टिकट दीजिए
    gloss: क्राकोव का एक टिकट दीजिए।
    note: टिकट खिड़की पर आप ठीक यही वाक्य कहेंगे।
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (किसी वाहन से जाना): jadę (मैं जाता/जाती हूँ), jedzie (वह जाता/जाती है)। कल मैं क्राकोव जा रहा/रही हूँ। मारेक क्राकोव जा रहा है।'
    note: अभी सिर्फ़ दो रूप — अपने लिए *jadę*, किसी और के लिए *jedzie*।
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: मारेक क्राकोव जा रहा है
    gloss: मारेक कल क्राकोव जा रहा है।
    note: मारेक की अपनी यात्रा — उसकी कहानी इस इकाई के संवाद में आगे बढ़ती है।
  pl.a1.unit15.lesson02.teach.autobus:
    title: बस
    gloss: बस
    note: शहरों के बीच सफ़र करने का दूसरा आम तरीका।
    example_gloss: बस स्टेशन पर है।
  pl.a1.unit15.lesson02.teach.warszawa:
    title: वॉरसॉ
    gloss: वॉरसॉ
    note: पोलैंड की राजधानी — इस इकाई की दूसरी मंज़िल।
    example_gloss: वारसॉ दूर है।
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: वारसॉ तक
    gloss: 'Warszawa का रूप Kraków से अलग तरह बदलता है: do Warszawy (do Warszawa नहीं)। हर शहर का अपना अलग रूप होता है — दोनों को अलग-अलग याद कीजिए।'
    note: '*Krakowa* और *Warszawy* एक ही ढंग से नहीं बनते — इसीलिए हर एक को अलग से याद किया जाता है, किसी साझा नियम से नहीं।'
  pl.a1.unit15.lesson02.teach.dokad:
    title: कहाँ तक / किस ओर
    gloss: कहाँ तक / किस ओर
    note: यह गंतव्य के बारे में पूछता है, स्थान के बारे में नहीं — किसी चीज़ के पहले से कहीं होने के बारे में "कहाँ" पूछने से अलग।
    example_gloss: बस कहाँ जा रही है?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: फिर से सात बजे
    gloss: Siódmej -- घंटे का यह रूप आप समय वाले पाठ से पहले ही जानते हैं (o siódmej = सात बजे)।
    note: घंटे के लिए वही रूप-पैटर्न, बस अब रवानगी के समय के लिए दोबारा इस्तेमाल हो रहा है।
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: वारसॉ की बस सात बजे निकलती है
    gloss: वारसॉ की बस सात बजे निकलती है।
    note: इस पाठ के गंतव्य और समय वाले पैटर्न एक असली वाक्य में एक साथ आते हैं।
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: फिर से "कब"
    gloss: Kiedy -- यह शब्द आप तारीख़ों वाले पाठ से पहले ही जानते हैं। बस कब निकलती है?
    note: यात्रा से पहले पूछा जाने वाला स्वाभाविक सवाल।
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: एवा वारसॉ जा रही है
    gloss: एवा कल वारसॉ जा रही है।
    note: एवा की अपनी यात्रा — उसकी कहानी इस इकाई के संवाद में मारेक की कहानी के साथ आगे बढ़ती है।
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: फिर से "मैं"
    gloss: Ja -- यह शब्द आप पिछले पाठों से पहले ही जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: फिर से "मेरा"
    gloss: Mój -- यह शब्द आप परिवार वाले पाठ से पहले ही जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: फिर से सुबह दस बजे
    gloss: Dziesiątej और rano -- दोनों रूप आप समय वाले पाठ से पहले ही जानते हैं (o dziesiątej rano = सुबह दस बजे)।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: धन्यवाद और फिर मिलेंगे
    gloss: Dziękuję और Do zobaczenia -- इन्हें आप पिछले पाठों से पहले ही जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: आपकी यात्रा शुभ हो!
    gloss: Miłej podróży! किसी को शुभ यात्रा की कामना देने का तरीका है — इसे पूरे वाक्यांश की तरह इस्तेमाल करते हैं, शब्द-दर-शब्द अनुवाद नहीं करते।
    note: विदाई का एक पक्का मुहावरा — इसे एक पूरे टुकड़े की तरह सीखिए, जैसे आपने *Dzień dobry* सीखा था।
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: मारेक कल क्राकोव जा रहा है
    gloss: कल मैं क्राकोव जा रहा हूँ। मेरी ट्रेन दोपहर बाद चार बजे निकलती है।
    note: मारेक अपनी यात्रा की योजना बताकर शुरू करता है — यही बात पहला पाठ पहले ही उसके बारे में बता चुका है।
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: एवा कल वारसॉ जा रही है
    gloss: मैं वारसॉ जा रही हूँ। मेरी बस सुबह दस बजे निकलती है।
    note: एवा अपनी योजना बताती है — यही बात दूसरा पाठ पहले ही उसके बारे में बता चुका है।
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: मारेक एवा को शुभ यात्रा की कामना देता है
    gloss: आपकी यात्रा शुभ हो!
    note: मारेक एवा को शुभकामना देने के लिए इस पाठ का नया मुहावरा इस्तेमाल करता है।
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: एवा मारेक को धन्यवाद देती है और विदा लेती है
    gloss: धन्यवाद! फिर मिलेंगे!
    note: बातचीत का एक सीधा-सादा, जाना-पहचाना अंत।
