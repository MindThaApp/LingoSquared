teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: कैसी, है, आज, नहीं -- फिर से
    gloss: Jaka, jest, Dziś, nie -- ये शब्द आप पिछले पाठों से पहले ही जानते हैं.
    note: इस पाठ में मौसम की बात करने के लिए इन शब्दों का उपयोग होगा, उससे पहले एक छोटी याद-दहानी.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: मौसम
    gloss: मौसम
    note: मौसम या मौसम की स्थिति के लिए सामान्य शब्द.
    example_gloss: मौसम कैसा है?
  pl.a1.unit19.lesson01.teach.zimno:
    title: ठंड
    gloss: ठंडा
    note: तापमान बताता है -- लिंग के अनुसार इसका रूप नहीं बदलता.
    example_gloss: ठंड है.
  pl.a1.unit19.lesson01.teach.goraco:
    title: गर्मी
    gloss: गर्म
    note: '''*zimno*'' का उलटा -- इसका रूप भी लिंग के अनुसार नहीं बदलता.'
    example_gloss: गर्मी है.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: ठंड है, गर्मी है
    gloss: 'Jest zimno. Jest gorąco. -- पोलिश में मौसम ऐसे बताया जाता है: ''*jest*'' और मौसम का शब्द, लिंग के मेल के बिना.'
    note: यही सरल पैटर्न इस इकाई के हर मौसम-शब्द के साथ चलता है.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: मौसम कैसा है?
    gloss: मौसम कैसा है?
    note: मौजूदा मौसम के बारे में पूछने का स्वाभाविक तरीका.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: आज ठंड है
    gloss: आज ठंड है।
    note: वह तथ्य जिस पर यह पूरा पाठ आज के मौसम के लिए टिका है।
  pl.a1.unit19.lesson02.teach.pada:
    title: बारिश हो रही है
    gloss: बारिश हो रही है / बारिश होती है
    note: बिना कर्ता के अकेला प्रयोग -- पोलिश में "बारिश हो रही है" कहने का यही सामान्य तरीका है।
    example_gloss: आज बारिश हो रही है।
  pl.a1.unit19.lesson02.teach.snieg:
    title: बर्फ़
    gloss: बर्फ़
    note: बर्फ़ के लिए शब्द -- '*pada*' के साथ इसका अर्थ है "बर्फ़ गिर रही है"।
    example_gloss: बर्फ़ गिर रही है।
  pl.a1.unit19.lesson02.teach.mgla:
    title: कोहरा
    gloss: कोहरा
    note: मौसम की एक और आम स्थिति।
    example_gloss: कोहरा है।
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: अच्छा
    gloss: Pogoda jest dobra. -- '*dobra*' स्त्रीलिंग संज्ञाओं के साथ आता है, जैसे '*pogoda*'।
    note: '''*dobry*'' का स्त्रीलिंग रूप (जैसे *Dzień dobry* में) -- वही -y/-a का क्रम, जैसा *chory/chora* में है।'
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: भयानक
    gloss: Jaka straszna pogoda! -- '*straszna*' भी '*pogoda*' के साथ आता है, ठीक '*dobra*' की तरह।
    note: एक कड़ा शब्द -- इसे सचमुच खराब मौसम के लिए इस्तेमाल कीजिए।
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: कितना भयानक मौसम!
    gloss: कितना भयानक मौसम!
    note: खराब मौसम पर कहा जाने वाला एक स्वाभाविक उद्गार।
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: मौसम अच्छा है
    gloss: मौसम अच्छा है।
    note: इस पाठ में पहले आया मौसम वाला शब्द फिर से प्रयोग हो रहा है।
  pl.a1.unit19.lesson03.teach.recap_words:
    title: हाँ, और, मैं, भी -- फिर से
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- ये शब्द आप पहले के पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit19.lesson03.teach.bo:
    title: क्योंकि
    gloss: क्योंकि
    note: किसी योजना को उसके पीछे के मौसम वाले कारण से जोड़ता है।
    example_gloss: मेरा पार्क जाने का इरादा नहीं है, क्योंकि बारिश हो रही है।
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: मेरा मन नहीं है, क्योंकि बारिश हो रही है
    gloss: मेरा पार्क जाने का मन नहीं है, क्योंकि बारिश हो रही है।
    note: मौसम का वर्णन और एक असली योजना साथ-साथ -- इस पाठ का यही लक्ष्य है।
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: क्राकोव में -- फिर से
    gloss: W Krakowie -- यह आप पहले के पाठों से जानते हैं, जैसे 'Ona mieszka w Krakowie' (वह क्राकोव में रहती है)।
    note: संवाद में दो जगहों के मौसम की तुलना होगी, उससे पहले एक छोटी याद-दिहानी।
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek मौसम के बारे में पूछता है
    gloss: आज मौसम कैसा है?
    note: Marek बातचीत की शुरुआत आज के मौसम के बारे में पूछकर करता है।
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa जवाब देती है
    gloss: बारिश हो रही है। ठंड है।
    note: Ewa आज का असली मौसम बताती है।
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek प्रतिक्रिया देता है और योजना बनाता है
    gloss: कितना भयानक मौसम! मेरा पार्क जाने का मन नहीं है, क्योंकि बारिश हो रही है।
    note: Marek मौसम पर प्रतिक्रिया देता है और उसी वजह से अपनी योजना बताता है।
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa सहमत होती है
    gloss: मैं भी पार्क नहीं जा रही हूँ।
    note: Ewa भी वही योजना बनाती है जो Marek ने बनाई है।
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek क्राकोव के बारे में पूछता है
    gloss: और क्राकोव में? वहाँ मौसम कैसा है?
    note: Marek बातचीत को दूसरे शहर के मौसम की ओर मोड़ता है।
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa जवाब देती है
    gloss: क्राकोव में बर्फ़ गिर रही है। वहाँ बहुत ठंड है।
    note: Ewa क्राकोव के एक अलग, ज़्यादा ठंडे मौसम का वर्णन करती है।
