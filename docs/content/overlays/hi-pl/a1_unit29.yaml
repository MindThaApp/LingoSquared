  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: टोमेक की योजना
    gloss: 'टोमेक: तब मैं दौड़ूँगा। उसके बाद फ़ुटबॉल भी खेलूँगा।'
    note: '*Wtedy* (तब) और *potem* (उसके बाद) घटनाओं का क्रम बताते हैं; *pobiegam* और *zagram* पूर्ण क्रियाएँ हैं, इसलिए ये योजना जैसे लगते हैं।'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: कासिया की योजना
    gloss: 'कासिया: मुझे तैरना ज़्यादा पसंद है, पर मैं भी पार्क आऊँगी।'
    note: '*Wolę* का अर्थ है मैं ज़्यादा पसंद करता/करती हूँ, और इसके बाद क्रिया का मूल रूप आता है: *wolę pływać*।'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: एवा बातचीत समाप्त करती है
    gloss: 'एवा: बढ़िया! शनिवार को पार्क में मिलते हैं!'
    note: एक ही पंक्ति में इस इकाई की संदेश-बातचीत और खेल वाली इकाई की योजना, दोनों को पूरा करता है।
