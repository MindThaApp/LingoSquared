  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: कौन क्या इस्तेमाल करता है?
    gloss: एवा हर दिन मारेक को फ़ोन करती है। वह ऐप नहीं, फ़ोन इस्तेमाल करती है। मारेक के घर में कंप्यूटर नहीं है, पर वह अपने फ़ोन पर इंटरनेट इस्तेमाल करता है। टोमेक हर सुबह मौसम का पूर्वानुमान देखता है। फिर वह दौड़ने जाता है। कासिया अक्सर एवा को संदेश भेजती है। क्या आप भी हर दिन फ़ोन इस्तेमाल करते हैं?
    note: चारों पात्रों की उपकरण-आदतों की तुलना करता है, जैसा खेल वाली इकाई का तुलनात्मक पाठ था।
