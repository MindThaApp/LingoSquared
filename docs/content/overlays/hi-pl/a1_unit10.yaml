teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: उठना, मैं उठता/उठती हूँ
    gloss: उठना; मैं उठता/उठती हूँ
    note: Wstawać क्रियार्थक है; wstaję उत्तम पुरुष का रोज़मर्रा का रूप है, जिससे आप अपनी दिनचर्या बताएँगे।
    example_gloss: मैं सुबह सात बजे उठता/उठती हूँ।
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: खाना, मैं खाता/खाती हूँ
    gloss: खाना; मैं खाता/खाती हूँ
    note: Jeść थोड़ी अनियमित क्रिया है, पर jem ("मैं खाता/खाती हूँ") वह रूप है जो आप सबसे ज़्यादा इस्तेमाल करेंगे — पोलिश भाषी किसी भी भोजन के लिए यही कहते हैं।
    example_gloss: मैं सुबह नाश्ता करता/करती हूँ।
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: नाश्ता
    gloss: नाश्ता
    note: Śniadanie, jem के बाद नहीं बदलता -- "मैं नाश्ता करता/करती हूँ" बस jem śniadanie है, कोई अतिरिक्त अंत सीखने की ज़रूरत नहीं।
    example_gloss: सुबह मैं नाश्ता करता/करती हूँ।
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: पीना, मैं पीता/पीती हूँ
    gloss: पीना; मैं पीता/पीती हूँ
    note: Pić क्रियार्थक है; piję उत्तम पुरुष का रूप है, जिसका प्रयोग jem और wstaję की तरह ही होता है।
    example_gloss: मैं सुबह कॉफ़ी पीता हूँ।
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: अपने बारे में बात करना
    gloss: Wstaję, jem, piję -- इस अध्याय में हम केवल अपने बारे में, उत्तम पुरुष (मैं) में बात करते हैं, ठीक वैसे ही जैसे आप अपना दिन बताते हैं।
    note: यह पूरी इकाई जान-बूझकर हर क्रिया के "मैं" रूप तक ही सीमित है -- *wstaję* (मैं उठता/उठती हूँ), *jem* (मैं खाता/खाती हूँ), *piję* (मैं पीता/पीती हूँ) -- ताकि आप अपनी दिनचर्या बताने पर ध्यान दे सकें और साथ ही यह न सीखना पड़े कि "तुम", "वह (पुरुष)" या "वह (स्त्री)" के लिए हर क्रिया कैसे बदलती है।
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: मैं सुबह सात बजे उठता हूँ
    gloss: मैं सुबह सात बजे उठता/उठती हूँ।
    note: 'व्याकरण-नोट का पैटर्न अब प्रयोग में: o + घंटे का अधिकरण कारक रूप (siódmej) "उस समय पर" का अर्थ देता है, ठीक पिछली समय वाली यूनिट की तरह।'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: मैं नाश्ता करता हूँ और कॉफ़ी पीता हूँ
    gloss: मैं नाश्ता करता हूँ और कॉफ़ी पीता हूँ।
    note: दो उत्तम पुरुष क्रियाएँ i (और) से जुड़ी हैं — अपनी सुबह की गतिविधियाँ गिनाने का स्वाभाविक तरीका।
  pl.a1.unit10.lesson02.teach.obiad:
    title: दोपहर का खाना
    gloss: दोपहर का खाना
    note: śniadanie की तरह obiad भी jem के बाद रूप नहीं बदलता — jem obiad का सीधा अर्थ है "मैं दोपहर का खाना खाता हूँ"।
    example_gloss: मैं दोपहर को खाना खाता हूँ।
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: काम करना, मैं काम करता हूँ
    gloss: काम करना; मैं काम करता हूँ
    note: Pracować वही -ować → -uję पैटर्न अपनाता है जो खरीदारी वाली यूनिट के kosztować → kosztuje में था, बस इस बार उत्तम पुरुष में।
    example_gloss: मैं दोपहर बाद काम करता/करती हूँ।
  pl.a1.unit10.lesson02.teach.dom:
    title: घर
    gloss: घर
    note: घर के लिए रोज़मर्रा का शब्द — "घर जाना/आना" जैसे वाक्यांशों में बार-बार आता है।
    example_gloss: घर वहाँ है।
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: घर की ओर
    gloss: 'घर की ओर — do के बाद संबंध कारक आता है, और dom के संबंध कारक रूप का अंत -u होता है: domu, बिल्कुल bank -> banku, park -> parku, hotel -> hotelu की तरह।'
    note: '*Do domu* ("घर की ओर" / "घर", जैसे "मैं घर जा रहा हूँ") में वही संबंध कारक अंत *-u* है जो आप *do* के बाद bank, hotel और park के साथ सीख चुके हैं — एक और संज्ञा उसी पैटर्न पर।'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: लौटना, मैं लौटता हूँ
    gloss: लौटना / वापस जाना; मैं लौटता हूँ / वापस जाता हूँ
    note: do domu के साथ इस्तेमाल होकर "मैं घर जाता हूँ" या "मैं घर लौटता हूँ" कहता है — पोलिश के सबसे आम रोज़मर्रा वाक्यांशों में से एक।
    example_gloss: मैं शाम को घर लौटता हूँ।
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: दोपहर में, दोपहर बाद, शाम को
    gloss: दोपहर के बारह बजे; दोपहर बाद; शाम को
    note: 'पिछली समय वाली यूनिट का दोहराव: rano और w nocy के साथ ये दिन के समय बताने वाले पद पूरे दिन को समेट लेते हैं।'
    example_gloss:
    - मैं दोपहर को खाना खाता हूँ।
    - मैं दोपहर बाद काम करता/करती हूँ।
    - मैं शाम को घर लौटता हूँ।
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: मैं दोपहर बाद काम करता हूँ, फिर घर लौटता हूँ
    gloss: मैं दोपहर बाद काम करता हूँ, फिर घर लौटता हूँ।
    note: दिशाओं वाली यूनिट का वही अल्पविराम + potem जोड़ने का पैटर्न, अब दिनचर्या के दो हिस्सों को जोड़ने के लिए।
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: सोना, मैं सोता हूँ
    gloss: सोना; मैं सोता हूँ
    note: Śpię में क्रिया के मूल रूप spać से स्वर का अनियमित-सा बदलाव दिखता है, पर यह बहुत आम और बार-बार आने वाली क्रिया है, इसे जैसा है वैसा याद कर लेना अच्छा है।
    example_gloss: मैं रात को सोता हूँ।
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: और आप? मैं भी।
    gloss: और तुम? / मैं भी।
    note: A ty? बातचीत को दूसरे व्यक्ति की ओर मोड़ने का सरल तरीका है; ja też का अर्थ है "मैं भी" — दोनों रोज़ की बातचीत में लगातार आते हैं।
    example_gloss: मैं भी सुबह नाश्ता करता हूँ।
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: लेकिन, चाय, नहीं
    gloss: लेकिन; चाय (कर्म के रूप में); नहीं
    note: Ale विरोध दर्शाता है; क्रिया के बजाय किसी शब्द से ठीक पहले nie का अर्थ है "वह नहीं" — piję herbatę, nie kawę यानी "मैं चाय पीता हूँ, कॉफ़ी नहीं"।
    example_gloss: मैं चाय पीता हूँ, लेकिन कॉफ़ी नहीं।
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: जल्दी, दस बजे
    gloss: जल्दी; दस बजे — o के बाद घंटों में वही -ej अंत, जो पिछले पाठ के czwartej, siódmej में था।
    note: '*O dziesiątej* ("दस बजे") में वही घंटे वाला पैटर्न दोहराया गया है जो आप सीख चुके हैं — *o* के बाद *dziesiąta* बदलकर *dziesiątej* हो जाता है, ठीक *czwarta* -> *czwartej* और *siódma* -> *siódmej* की तरह।'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: एवा अपनी सुबह के बारे में बताती है
    gloss: एवा कहती है कि वह सुबह सात बजे उठती है और कॉफ़ी पीती है।
    note: इस यूनिट का सबसे पहला सिखाया गया वाक्य-पैटर्न, अब असली बातचीत में।
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: एवा अपना दिन आगे बताती है
    gloss: एवा कहती है कि वह नाश्ता करती है, फिर दोपहर बाद काम करती है।
    note: दो उत्तम पुरुष गतिविधियों को potem से जोड़ता है, वही पैटर्न जो पाठ 2 में था।
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: एवा बात पूरी करके मारेक से पूछती है
    gloss: एवा कहती है कि वह शाम को घर लौटती है। और तुम?
    note: A ty? किसी नए प्रश्न-व्याकरण के बिना बातचीत मारेक को सौंप देता है।
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: मारेक अपनी सुबह बताता है
    gloss: मारेक कहता है कि वह भी सात बजे उठता है! लेकिन वह चाय पीता है, कॉफ़ी नहीं।
    note: Ja też एक साझा बात (उठने का समय) की पुष्टि करता है, फिर पेय के लिए ale...nie से अंतर दिखाया जाता है।
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: मारेक अपना दिन बताता है
    gloss: मारेक कहता है कि वह सुबह काम करता है, फिर दोपहर को खाना खाता है।
    note: एवा से अलग दिनचर्या का क्रम — पहले काम, फिर दोपहर का खाना।
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: मारेक नींद के बारे में बताता है
    gloss: मारेक कहता है कि वह जल्दी सोता है, रात दस बजे।
    note: बातचीत का अंत नई क्रिया spać/śpię और इस पाठ के दोहराए गए घंटे वाले पैटर्न के साथ होता है।
