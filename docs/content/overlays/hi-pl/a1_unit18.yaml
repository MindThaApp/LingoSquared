    title: कितने कमरे?
    gloss: आपके पास कितने कमरे हैं? मेरे पास दो कमरे हैं। -- 'Ile', संख्याएँ और 'mam'/'masz' आप पिछले पाठों से जानते हैं; '*pokoi*' और '*pokoje*' शब्द '*pokój*' के रूप हैं।
    note: '''*Ile*'' के ठीक बाद ''*pokoi*'' आता है; ''*dwa*'', ''*trzy*'' या ''*cztery*'' (दो, तीन, चार) के ठीक बाद ''*pokoje*'' आता है।'
