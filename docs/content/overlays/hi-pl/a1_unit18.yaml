  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: घर, है, के पास है -- फिर से
    gloss: Dom, jest, ma, Marek, Ewa -- ये शब्द आप पिछले पाठों से जानते हैं, जैसे 'Dom jest tam' (घर वहाँ है)।
