    note: इस पाठ में कमरों के बारे में बात करने से पहले एक छोटी याद-दिहानी।
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: कमरे में, रसोई में...
    gloss: 'W + कमरा, रसोई, शयनकक्ष, स्नानघर: w pokoju, w kuchni, w sypialni, w łazience -- वही तरीक़ा जो w szkole (स्कूल में) या w biurze (दफ़्तर में) में है।'
    note: वही बात जो आप कार्यस्थल के शब्दों में सीख चुके हैं -- उस कमरे 'में' कहने के लिए शब्द का अंत थोड़ा बदल जाता है।
