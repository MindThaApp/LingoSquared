  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: एवा अपने घर के बारे में बताती है
    gloss: और मेरे पास एक फ़्लैट है. मेरे पास एक कमरा है.
    note: एवा अपने छोटे घर के बारे में बताने लगती है.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: एवा रसोई के बारे में पूछती है
    gloss: क्या रसोई छोटी है?
    note: एवा मारेक से उसकी रसोई के बारे में अगला सवाल पूछती है.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
