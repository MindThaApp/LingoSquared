  pl.a1.unit18.lesson01.teach.duzy_note:
    title: बड़ा
    gloss: घर बड़ा है। -- '*duży*' पुल्लिंग संज्ञाओं के साथ आता है, जैसे '*dom*'।
    note: इस कोर्स में पहली बार कोई शब्द आकार बताता है -- अभी यह केवल '*dom*' के लिए है।
