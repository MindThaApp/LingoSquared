    gloss: मारेक के पास एक घर है। घर बड़ा है।
    note: वह बात जिस पर यह पूरी यूनिट मारेक के लिए आधारित है।
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: एवा का घर
    gloss: एवा के पास एक अपार्टमेंट है।
