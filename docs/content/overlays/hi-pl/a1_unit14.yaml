  pl.a1.unit14.lesson01.teach.stary:
    title: बूढ़ा
    gloss: बूढ़ा / बुज़ुर्ग
    note: młody का उलटा -- एक और विशेषण, जिसका तुलनात्मक रूप हम इस इकाई में बनाएँगे।
    example_gloss: दादाजी बुज़ुर्ग हैं।
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'तुलना बनाना: -szy जोड़ें'
    gloss: 'stary और młody जैसे छोटे विशेषणों में अंत -y को -szy में बदला जाता है: stary से starszy, młody से młodszy। हर विशेषण इस तरह नहीं बदलता।'
    note: 'इन दो शब्दों के लिए सरल नियम: अंतिम *-y* हटाइए और तुलनात्मक रूप के लिए *-szy* जोड़िए। कई दूसरे विशेषण अलग अंत लेते हैं, इसलिए इसे हर जगह न लगाइए।'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: उम्र में बड़ा
    gloss: उम्र में बड़ा
    note: Starszy पुरुष (या on) के लिए है; starsza स्त्री (या ona) के लिए -- stary का तुलनात्मक रूप।
    example_gloss:
    - दादा पिता से बड़े हैं।
    - दादी माँ से बड़ी हैं।
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: उम्र में छोटा
    gloss: उम्र में छोटा
    note: पुरुष के लिए młodszy, स्त्री के लिए młodsza -- młody का तुलनात्मक रूप।
    example_gloss:
    - पिता दादा से छोटे हैं।
    - माँ दादी से छोटी हैं।
  pl.a1.unit14.lesson01.teach.niz:
    title: से (तुलना में)
    gloss: से (तुलना में)
    note: Niż तुलना की जा रही दोनों चीज़ों को जोड़ता है -- niż के बाद का शब्द अपने सादे, सामान्य रूप में ही रहता है।
    example_gloss: बेटा पिता से छोटा है।
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: तुलनात्मक रूप लिंग के साथ बदलते हैं
    gloss: Starszy/starsza और młodszy/młodsza लिंग के साथ बदलते हैं, ठीक byłem/byłam की तरह। Starszy, młodszy पुरुष (on) के लिए; starsza, młodsza स्त्री (ona) के लिए।
    note: यह *byłem*/*byłam* जैसा ही नियम है -- अंत बदल जाता है, इस पर निर्भर करते हुए कि बात पुरुष की हो रही है या स्त्री की।
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa, Marek से बड़ी है
    gloss: Ewa, Marek से बड़ी है।
    note: हमारे दोनों पात्रों के बारे में एक सच्ची बात -- Ewa 32 साल की है, Marek 28 साल का।
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek, Ewa से छोटा है
    gloss: Marek, Ewa से छोटा है।
    note: वही बात, उलटे ढंग से कही गई।
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Good, फिर से
    gloss: Dobry (अच्छा) -- इसे आप Dzień dobry से पहले ही जानते हैं।
    note: यह वही विशेषण है जो आप बिल्कुल पहली इकाई से देख रहे हैं, अब तुलनात्मक रूप बनाने में इस्तेमाल हो रहा है।
  pl.a1.unit14.lesson02.teach.zly:
    title: बुरा
    gloss: बुरा
    note: dobry का उलटा -- इस इकाई का बिल्कुल नया शब्द।
    example_gloss: यह एक बुरा दिन है।
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry और zły अनियमित हैं
    gloss: 'Dobry और zły अनियमित हैं: dobry से lepszy बनता है, zły से gorszy -- आप -szy नहीं जोड़ते।'
    note: '*stary*/*młody* के विपरीत, ये दोनों नियमित *-szy* वाले ढंग पर नहीं चलते -- इनके तुलनात्मक रूप अलग से याद करने पड़ते हैं।'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: बेहतर
    gloss: बेहतर
    note: Lepszy पुरुष के लिए, lepsza स्त्री के लिए (या kawa जैसे स्त्रीलिंग शब्द के लिए) -- dobry का अनियमित तुलनात्मक रूप।
    example_gloss:
    - वह मुझसे बेहतर है।
    - कॉफ़ी चाय से बेहतर है।
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: बदतर
    gloss: बदतर / ज़्यादा बुरा
    note: Gorszy/gorsza -- zły का अनियमित तुलनात्मक रूप।
    example_gloss:
    - वह मुझसे बदतर है।
    - चाय कॉफ़ी से बदतर है।
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: कॉफ़ी और चाय, फिर से
    gloss: Kawa और herbata -- इन शब्दों को आप पेय वाले पिछले पाठ से पहले ही जानते हैं।
    note: इस पाठ में इन्हें तुलना में रखने से पहले एक छोटी याद दिलाई।
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: पहले जैसा ही नियम
    gloss: Lepszy/lepsza और gorszy/gorsza लिंग के साथ उसी तरह बदलते हैं जैसे पिछले पाठ में starszy/starsza बदलते थे।
    note: पुल्लिंग/स्त्रीलिंग का वही भेद जो आपने अभी सीखा, अब शब्दों की एक नई जोड़ी पर।
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: मैं, मैं हूँ, तुम
    gloss: Ja, jestem, ty -- इन शब्दों को आप पहले के पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद दिलाई।
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: हाँ, नहीं, ठीक है
    gloss: Tak, nie और dobrze -- ये भी आपके जाने-पहचाने शब्द हैं।
    note: संवाद से पहले एक और छोटी याद दिलाई।
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: लेकिन, फिर से
    gloss: Ale (लेकिन) -- इसे आप पहले के पाठों से जानते हैं। यह दो विरोधी वाक्यों को जोड़ता है।
    note: विरोध दिखाने वाला एक छोटा जोड़ने वाला शब्द, हिंदी के "लेकिन" की तरह।
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek कहता है कि चाय बेहतर है
    gloss: चाय कॉफ़ी से बेहतर है!
    note: Marek अपनी राय से शुरू करता है, जो उसने पसंद वाले पाठ में पहले ही बताई थी।
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa असहमत है
    gloss: नहीं, नहीं! कॉफ़ी चाय से बेहतर है!
    note: Ewa अपनी राय रखती है -- यह भी उसकी पहले कही बात से मेल खाती है।
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek बात उम्र की ओर मोड़ देता है
    gloss: ठीक है, ठीक है। लेकिन मैं तुमसे छोटा हूँ!
    note: Marek पेय की बहस छोड़ देता है और ऐसी बात उठाता है जिसमें उसे भरोसा है।
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa सहमत होती है और अपनी राय फिर दोहराती है
    gloss: हाँ, मैं बड़ी हूँ। लेकिन कॉफ़ी बेहतर है!
    note: Ewa उम्र वाली बात मान लेती है, फिर कॉफ़ी पर अपनी राय पर लौट आती है।
