teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: फ़ोन करना
    gloss: फ़ोन करना
    note: फ़ोन कॉल करने वाली क्रिया का मूल रूप।
    example_gloss: मुझे तुम्हें फ़ोन करना है।
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: फ़ोन करने की बात कहना
    gloss: मैं तुम्हें फ़ोन करूँगा।
    note: '*Zadzwonię* क्रिया *zadzwonić* (एक बार फ़ोन करना) का पूर्ण भविष्य रूप है। पोलिश में वादे या पक्के इरादे के लिए यही रूप इस्तेमाल होता है, जैसे हिंदी में «मैं फ़ोन करूँगा/करूँगी»।'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: फ़ोन उठाना
    gloss: हैलो, मैं एवा बोल रही हूँ।
    note: 'फ़ोन पर अपना परिचय देने का सामान्य तरीका *tu* + नाम है (शाब्दिक अर्थ: «यहाँ ...»)। हिंदी में हम «मैं ... बोल रहा/रही हूँ» कहते हैं, पर पोलिश में इस तरह की क्रिया नहीं लगती।'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: मारेक भी इसी तरह जवाब देता है
    gloss: हैलो, मैं मारेक बोल रहा हूँ।
    note: वही *tu* + नाम वाला ढाँचा, जो *Halo, tu Ewa* में था।
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: पूछना कि फ़ोन किसका है
    gloss: मैं किससे बात कर रहा हूँ?
    note: '*Z kim rozmawiam?* (शाब्दिक अर्थ: «मैं किससे बात कर रहा हूँ?») अनजान फ़ोन करने वाले से पूछने का सामान्य वाक्य है; *kim*, *z* के बाद आने वाला करण कारक रूप है।'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: औपचारिक ढंग से अपना परिचय देना
    gloss: आप एवा से बात कर रहे हैं।
    note: '*Rozmawia pan z Ewą* औपचारिक रूप है: इसमें *pan* (पुरुष के लिए) या *pani* (स्त्री के लिए) के साथ अन्य पुरुष की क्रिया आती है, और *z* के बाद करण कारक आता है।'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: बात दोहराने को कहना
    gloss: क्या तुम इसे दोहरा सकते हो?
    note: '*Możesz* (क्या तुम सकते हो, *móc* से) + क्रिया का मूल रूप *powtórzyć* (दोहराना) + *to* (वह)।'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: किसी से धीरे बोलने को कहना
    gloss: कृपया इतनी तेज़ मत बोलो।
    note: '*Nie mów* निषेधात्मक आज्ञार्थ रूप है (मत बोलो); *tak szybko* का अर्थ है «इतनी तेज़»।'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: कहना कि आवाज़ ठीक से नहीं आ रही
    gloss: मुझे तुम्हारी आवाज़ ठीक से नहीं आ रही।
    note: '*Nie słyszę cię dobrze* सुनने की परेशानी बताता है; *cię*, *ty* का कर्म कारक रूप है और *dobrze* का अर्थ है «अच्छी तरह»।'
  pl.a1.unit22.lesson04.teach.sms:
    title: टेक्स्ट मैसेज
    gloss: टेक्स्ट मैसेज
    note: '*SMS* पुल्लिंग संज्ञा है: *ten SMS*। पोलिश में हर संज्ञा का लिंग होता है, इसलिए इसके साथ ten आता है।'
    example_gloss: यह टेक्स्ट संदेश एवा की ओर से है।
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: टेक्स्ट भेजने की बात कहना
    gloss: मैं तुम्हें एक मैसेज भेजता हूँ।
    note: '*Wysłać* (भेजना) में व्यक्ति के लिए संप्रदान कारक *ci* (तुम्हें) आता है और भेजी जाने वाली चीज़ के लिए कर्म कारक: *Wyślę ci SMS*।'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: वापस कॉल करने की बात कहना
    gloss: मैं तुम्हें बाद में वापस कॉल करूँगा।
    note: '*Oddzwonić* (वापस फ़ोन करना) पोलिश में एक ही क्रिया है: *oddzwonię później*।'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: टेक्स्ट बातचीत पढ़ें
    gloss: 'मारेक: हाय एवा, क्या तुम मुझे फ़ोन कर सकती हो? मुझे तुम्हें कुछ बताना है। एवा: हाँ, ज़रूर, मैं पाँच मिनट में वापस फ़ोन करती हूँ।'
    note: ध्यान दीजिए कि मारेक क्या माँगता है, क्यों, और एवा कब वापस फ़ोन करने को कहती है।
    glosses:
      Cześć: हाय
      możesz: सकते हो
      zadzwonić: कॉल करना
      Muszę: करना होगा
      coś: कुछ
      powiedzieć: बताना
      oczywiście: ज़रूर
      oddzwonię: कॉल करना
      pięć: पाँच
      minut: मिनट
      za: वापस
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: मारेक फ़ोन उठाता है
    gloss: 'मारेक: हैलो, मैं मारेक बोल रहा हूँ।'
    note: 'पहले पाठ वाला वही *tu* + नाम का ढाँचा, अब असली फ़ोन बातचीत में: जो फ़ोन उठाता है, वह पहले बोलता है और अपना नाम बताता है।'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: एवा अपना परिचय देती है
    gloss: 'एवा: हाय मारेक, मैं एवा बोल रही हूँ। मारेक: अच्छा लगा कि तुमने फ़ोन किया!'
    note: '*Fajnie, że* ... («अच्छा है कि ...») किसी घटना पर सकारात्मक प्रतिक्रिया दिखाता है; *że* उपवाक्य को जोड़ता है।'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: एवा शिफ़्ट के बारे में पूछती है
    gloss: 'एवा: तुम्हारी पहली शिफ़्ट कैसी रही?'
    note: '*Jak ci poszła ...?* (शाब्दिक अर्थ: «तुम्हारे लिए ... कैसे गई?») किसी बीती बात के बारे में पूछता है। *Ci*, *ty* का संप्रदान कारक रूप है, और *poszła* स्त्रीलिंग संज्ञा *zmiana* के अनुसार बना है।'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: मारेक अच्छी खबर बताता है
    gloss: 'मारेक: बहुत अच्छी रही, मेरी सोच से भी बेहतर।'
    note: '*Poszło*, *iść* का भूतकाल रूप है जिसमें अंत *-o* है («वह»; यहाँ अर्थ «निकलना/रहना»); *myślałem*, *myśleć* (सोचना) का भूतकाल है, पुरुष वक्ता वाले अंत के साथ।'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'भूतकाल: było, poszło, myślałem'
    gloss: 'भूतकाल: *było* (था) *być* (होना) से, *poszło* (गया) *iść* (जाना) से, *myślałem* (मैंने सोचा) *myśleć* (सोचना) से।'
    note: 'पोलिश भूतकाल *-ł-* और लिंग के अंत से बनता है: *myślał* (वह, पुरुष), *myślała* (वह, स्त्री), *było* (वह, नपुंसक)। अभी *było*, *poszło* और *myślałem* को इसी पाठ के संदर्भों में तैयार रूपों की तरह सीखिए।'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: एवा को गर्व है
    gloss: 'एवा: यह सुनकर कितना अच्छा लगा! मुझे तुम पर गर्व है।'
    note: '*Dumny z* («पर गर्व करना») एक स्थिर संयोजन है: *z* + संबंध कारक, इसलिए *z ciebie*। एवा स्त्री है, इसलिए वह *dumna* कहती है।'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: मारेक भावुक हो जाता है
    gloss: 'मारेक: बहुत धन्यवाद, मेरे लिए इसका बहुत मतलब है।'
    note: '*Znaczy*, *znaczyć* (मतलब होना) का *on/ona/ono* रूप है; *dla mnie* (मेरे लिए) बताता है कि यह किसके लिए मायने रखता है।'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: उसका
    gloss: उसकी पहली शिफ़्ट बहुत अच्छी रही।
    note: '*Jego* (उसका) कभी नहीं बदलता और संज्ञा से पहले आता है: *jego pierwsza zmiana*; स्त्रीलिंग संज्ञा का इस पर कोई असर नहीं पड़ता।'
