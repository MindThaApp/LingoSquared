teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: एक, दो, तीन बजे
    gloss: एक बजा है; दो बजे हैं; तीन बजे हैं
    note: पोलिश में समय बताने के लिए स्त्रीलिंग क्रमसूचक संख्याएँ आती हैं, जो न बोले गए स्त्रीलिंग शब्द *godzina* (घंटा) के अनुसार रूप लेती हैं – *pierwsza* का शाब्दिक अर्थ है "पहला (घंटा)"।
    example_gloss:
    - एक बजा है।
    - दो बजे हैं।
    - तीन बजे हैं।
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: चार, पाँच, छह बजे
    gloss: चार बजे हैं; पाँच बजे हैं; छह बजे हैं
    note: यहाँ भी वही स्त्रीलिंग क्रमसूचक रूप है, जो *pierwsza*, *druga*, *trzecia* में था।
    example_gloss:
    - चार बजे हैं।
    - पाँच बजे हैं।
    - छह बजे हैं।
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: सात, आठ, नौ बजे
    gloss: सात बजे हैं; आठ बजे हैं; नौ बजे हैं
    note: बारह घंटों में से बीच के तीन, वही रूप-पद्धति।
    example_gloss:
    - सात बजे हैं।
    - आठ बजे हैं।
    - नौ बजे हैं।
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: दस, ग्यारह, बारह बजे
    gloss: दस बजे हैं; ग्यारह बजे हैं; बारह बजे हैं
    note: आख़िरी तीन घंटे, जिनसे 1 से 12 तक का पूरा समूह पूरा हो जाता है।
    example_gloss:
    - दस बजे हैं।
    - ग्यारह बजे हैं।
    - बारह बजे हैं।
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: समय पूछना
    gloss: समय क्या हुआ है?
    note: 'शाब्दिक अर्थ: "कौन-सा है घंटा?" -- *która* स्त्रीलिंग शब्द *godzina* के अनुसार बदलता है; यही मेल इस यूनिट में आगे भी दिखेगा।'
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina स्त्रीलिंग है
    gloss: हम pierwsza, druga, trzecia कहते हैं -- pierwszy, drugi, trzeci नहीं।
    note: '*Pierwszy*, *drugi*, *trzeci* इन्हीं क्रमसूचक संख्याओं के पुल्लिंग रूप हैं, जो पोलिश में अन्यत्र पुल्लिंग संज्ञाओं के साथ आते हैं -- लेकिन समय बताने के लिए इनका प्रयोग कभी नहीं होता, क्योंकि *godzina* स्त्रीलिंग है।'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: सुबह, दोपहर, दोपहर बाद
    gloss: सुबह; दोपहर को; दोपहर बाद
    note: '*Rano* अकेला आता है (उसके साथ कोई पूर्वसर्ग नहीं); *w południe* और *po południu* में अपना-अपना तय पूर्वसर्ग रहता है -- इन तीनों को किसी सामान्य नियम से निकालने के बजाय तैयार वाक्यांशों की तरह याद कर लेना अच्छा है।'
    example_gloss:
    - सुबह मैं कॉफ़ी पीता हूँ।
    - दोपहर को मैं खाना खाता हूँ।
    - मैं दोपहर बाद काम करता/करती हूँ।
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: शाम, रात
    gloss: शाम को; रात में
    note: '*Wieczorem* एक तय क्रियाविशेषण रूप है (पूर्वसर्ग की ज़रूरत नहीं); *w nocy* में *w* के साथ *noc* (रात) का अधिकरण कारक रूप आता है।'
    example_gloss:
    - शाम को मैं टीवी देखता हूँ।
    - रात में मैं सोता हूँ।
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: किस समय, यह पूछना
    gloss: किस समय?
    note: जब यह पूछना हो कि कोई बात कब होगी, तब *Która jest godzina?* की जगह इसका प्रयोग करें; Która jest godzina? अभी का समय पूछने के लिए है।
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: किसी घंटे पर होने की बात कहना
    gloss: चार, सात, दस बजे -- लेकिन चार बजे, सात बजे, दस बजे (उस समय पर)।
    note: '*o* ("पर") के बाद घंटे वाले शब्द का अंतिम *-a* बदलकर *-ej* हो जाता है: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*। हर घंटा इसी नियम पर चलता है; वर्तनी की एक ही खास बात है: *druga* → *o drugiej*, जिसमें *g* के बाद एक *i* जुड़ जाता है।'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa सुबह जल्दी उठती है
    gloss: Ewa सुबह सात बजे उठती है।
    note: '*Wstaje*, *wstawać* (उठना) का अन्य पुरुष एकवचन रूप है।'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: ट्रेन के छूटने का समय
    gloss: ट्रेन दोपहर बाद चार बजे छूटती है।
    note: '*Odjeżdża*, *odjeżdżać* (रवाना होना) का अन्य पुरुष एकवचन रूप है।'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: बैठक
    gloss: बैठक
    note: यही शब्द आप यूनिट 3 (*Kiedy jest spotkanie?*) में देख चुके हैं, जब Ewa और Marek दोबारा मिलने के लिए दिन और तारीख़ तय कर रहे थे।
    example_gloss: बैठक शुक्रवार को है।
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: मिलने का समय पूछना
    gloss: हम शुक्रवार, 15 मई को किस समय मिल सकते हैं?
    note: इसमें इस यूनिट का *o której godzinie* और यूनिट 3 के दिन-तारीख़ वाले वाक्यांश जुड़े हैं -- Ewa और Marek शुक्रवार, 15 मई पर पहले ही सहमत हो चुके हैं, और अब उन्हें ठीक समय तय करना है।
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: समय सुझाना
    gloss: शायद दोपहर बाद चार बजे?
    note: '*Może* अकेले "शायद" का अर्थ देता है -- समय का सुझाव नरमी से रखने का स्वाभाविक तरीका।'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: समय ठीक रहने की पुष्टि करना
    gloss: दोपहर बाद चार बजे का समय मेरे लिए ठीक है।
    note: यह वही *[time] + mi + odpowiada* पैटर्न है जो यूनिट 3 के *Piątek mi odpowiada* में था -- यहाँ समय ही वाक्य का कर्ता है, और *odpowiadać* में व्यक्ति हमेशा संप्रदान कारक में आता है (*mi*, यानी "मेरे लिए")।
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: पूरी योजना की पुष्टि करना
    gloss: 15 मई को चार बजे मिलते हैं!
    note: यह यूनिट 1 की विदाई *Do zobaczenia* को फिर से प्रयोग करता है, अब तारीख़ और समय दोनों के साथ।
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa समय पूछती है
    gloss: Ewa, Marek से पूछती है कि वे शुक्रवार, 15 मई को किस समय मिल सकते हैं।
    note: यह इस पाठ का शुरुआती प्रश्न ज्यों का त्यों दोहराता है।
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek दोपहर बाद चार बजे सुझाता है
    gloss: Marek दोपहर बाद चार बजे का सुझाव देता है।
    note: यह नरम सुझाव है, पक्का कथन नहीं -- यही *może* बताता है।
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa हामी भरती है
    gloss: Ewa कहती है कि दोपहर बाद चार बजे का समय उसके लिए ठीक है।
    note: यह यूनिट 3 की "शुक्रवार मेरे लिए ठीक है" वाली बातचीत जैसा ही संप्रदान कारक वाला ढाँचा है।
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek योजना पक्की करता है
    gloss: Marek कहता है कि बहुत बढ़िया, 15 मई को चार बजे मिलते हैं!
    note: '*Świetnie* यूनिट 3 के उत्साह वाले उद्गार को फिर से प्रयोग करता है।'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa अलविदा कहती है
    gloss: Ewa भी अलविदा कहती है।
    note: सबसे छोटा संभव समापन -- बस विदाई के शब्द।
