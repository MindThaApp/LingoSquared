teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: पुरुष के लिए औपचारिक संबोधन
    gloss: श्रीमान; महोदय (पुरुष के लिए औपचारिक संबोधन)
    note: 'हिंदी में "आप", "तुम" और "तू" के बीच सामाजिक भेद होता है, और पोलिश में भी ऐसा ही चुनाव करना पड़ता है: *pan* किसी अपरिचित या पेशेवर रूप से सम्मानित पुरुष के लिए प्रयोग होता है। व्याकरण की दृष्टि से *pan* अन्य पुरुष के कर्ता की तरह चलता है — "pan jest" का शाब्दिक अर्थ "सज्जन हैं" है, यानी यह सच्चा मध्यम पुरुष रूप नहीं है, भले ही इसका अर्थ "आप" हो।'
  pl.a1.unit01.lesson01.teach.pani:
    title: महिला के लिए औपचारिक संबोधन
    gloss: श्रीमती; महोदया (महिला के लिए औपचारिक संबोधन)
    note: यह *pan* का स्त्रीलिंग रूप है। किसी अपरिचित या पेशेवर रूप से सम्मानित महिला के लिए *pani* का प्रयोग कीजिए। हर वयस्क महिला को, वैवाहिक स्थिति की परवाह किए बिना, *pani* कहा जाता है — रोज़मर्रा के संबोधन में पोलिश में विवाहित और अविवाहित का कोई भेद नहीं है।
  pl.a1.unit01.lesson01.teach.ty:
    title: अनौपचारिक "तुम"
    gloss: तुम (अनौपचारिक, एकवचन)
    note: '*Ty* का प्रयोग किसी एक मित्र, हमउम्र, परिवार के सदस्य, बच्चे या ऐसे किसी भी व्यक्ति के लिए होता है जिससे अनौपचारिक रिश्ता हो। *pan* / *pani* के विपरीत, *ty* के साथ सच्चे मध्यम पुरुष के क्रिया-रूप आते हैं, जैसे *masz* ("तुम्हारे पास है / तुम हो"), अन्य पुरुष के रूप नहीं।'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: पुरुष से औपचारिक रूप से हालचाल पूछना
    gloss: आप कैसे हैं? (पुरुष से, औपचारिक)
    note: 'शाब्दिक अर्थ: "सज्जन कैसा महसूस करते हैं"। *Ma* क्रिया का अन्य पुरुष रूप है (जो कर्ता *pan* के साथ मेल खाता है), वही रूप जो *on* ("वह") के साथ आता है।'
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: महिला से औपचारिक रूप से हालचाल पूछना
    gloss: आप कैसी हैं? (महिला से, औपचारिक)
    note: ढाँचा *Jak się pan ma?* जैसा ही है, बस *pan* की जगह *pani* आता है। क्रिया-रूप *ma* नहीं बदलता — सामने वाले का लिंग कुछ भी हो, यह वही अन्य पुरुष का रूप रहता है।
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: अनौपचारिक हालचाल पूछना
    gloss: क्या हाल है? (अनौपचारिक)
    note: '*ty* के साथ क्रिया का सच्चा मध्यम पुरुष रूप *masz* आता है, *ma* नहीं। औपचारिक *Jak się pan/pani ma?* और अनौपचारिक *Jak się masz?* की तुलना कीजिए — क्रिया में ही pan/pani और ty का भेद सुनने के लिए यह सबसे उपयोगी जोड़ी है।'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: एक सामान्य उत्तर
    gloss: ठीक हूँ, धन्यवाद।
    note: '*Dziękuję* ("धन्यवाद") औपचारिकता के अनुसार नहीं बदलता — चाहे आप *pan*, *pani* या *ty* को उत्तर दे रहे हों, शब्द वही रहता है। औपचारिकता केवल प्रश्न से तय होती है।'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: औपचारिक प्रश्न लौटाना
    gloss: और आप? (पुरुष से, औपचारिक)
    note: जिस पुरुष से आप औपचारिक रूप से बात कर रहे हैं, उसी को प्रश्न लौटाने का यह छोटा तरीक़ा है। किसी महिला को प्रश्न लौटाते समय *pan* की जगह *pani* रखिए ("A pani?")।
  pl.a1.unit01.lesson01.teach.a_ty:
    title: अनौपचारिक प्रश्न लौटाना
    gloss: और तुम? (अनौपचारिक)
    note: किसी मित्र या हमउम्र को प्रश्न लौटाने के लिए *ty* का प्रयोग कीजिए।
  pl.a1.unit01.lesson02.teach.czesc:
    title: अनौपचारिक नमस्ते और अलविदा
    gloss: हाय; बाय (अनौपचारिक, मिलने और विदा होने दोनों पर)
    note: 'पोलिश अभिवादनों में *Cześć* कुछ अलग है: एक ही अनौपचारिक रूप में यह मिलते समय भी कहा जाता है और विदा लेते समय भी, कुछ वैसे ही जैसे हिंदी में "नमस्ते" दोनों अवसरों पर चलता है। इसका प्रयोग केवल *ty* वाले रिश्तों में होता है, *pan*/*pani* के साथ कभी नहीं।'
    example_gloss: हेलो, तुम कैसे हो?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: दिन भर का अभिवादन
    gloss: सुप्रभात; नमस्कार
    note: '*Dzień dobry* शाम से पहले किसी भी समय कहा जा सकता है और *cześć* के विपरीत औपचारिकता के लिहाज़ से तटस्थ है — इसे *pan*, *pani* और *ty* सभी के साथ बोल सकते हैं। जिसे आप अच्छी तरह नहीं जानते, उसके लिए यह सबसे सुरक्षित अभिवादन है।'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: शाम का अभिवादन
    gloss: शुभ संध्या
    note: शाम होने पर *dzień dobry* की जगह यह कहा जाता है। प्रयोग में औपचारिकता का कोई भेद नहीं है।
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: रात की विदाई
    gloss: शुभ रात्रि
    note: '*dzień dobry* / *dobry wieczór* के विपरीत, *dobranoc* अभिवादन नहीं बल्कि विदाई है — यह तब कहा जाता है जब कोई रात के लिए जा रहा हो या सोने जा रहा हो, बातचीत शुरू करने के लिए कभी नहीं।'
    example_gloss: शुभ रात्रि, पियोत्र!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: सामान्य विदाई
    gloss: अलविदा
    note: अलविदा कहने का तटस्थ और सुरक्षित तरीक़ा — *pan*, *pani* और *ty* सभी के साथ चलता है। यह *do zobaczenia* से ज़्यादा अंतिम-सा लगता है।
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: फिर मिलने की विदाई
    gloss: फिर मिलते हैं
    note: 'शाब्दिक अर्थ: "फिर देखने तक"। इसमें यह भाव है कि आप दोबारा मिलने की उम्मीद करते हैं, जबकि *do widzenia* ज़्यादा तटस्थ है।'
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: शिष्ट विदाई की शुभकामना
    gloss: आपका दिन शुभ हो!
    note: '*Miłego dnia* शुभकामना में संबंध कारक (जिसे पोलिश में dopełniacz कहते हैं) का प्रयोग करता है, ठीक *smacznego* ("भोजन का आनंद लीजिए") की तरह — यह एक स्थिर संरचना है, जिसे इस स्तर पर कारक-दर-कारक समझने के बजाय पूरे वाक्यांश के रूप में सीखना बेहतर है।'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: औपचारिक रूप से नाम पूछना
    gloss: आपका नाम क्या है? (पुरुष से, औपचारिक)
    note: 'शाब्दिक अर्थ: "सज्जन अपने को क्या कहते हैं" — *nazywać się* एक स्ववाचक क्रिया है जिसका अर्थ "नाम होना" है। किसी महिला से औपचारिक रूप से पूछते समय *pan* की जगह *pani* रखिए।'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: अनौपचारिक रूप से पहला नाम पूछना
    gloss: तुम्हारा (पहला) नाम क्या है?
    note: इसमें एक अलग मुहावरा *mieć na imię* ("पहले नाम के रूप में रखना") आता है, और यह पूरा नाम या उपनाम नहीं, बल्कि केवल पहला नाम पूछता है — हमउम्र से नाम पूछने का यह स्वाभाविक अनौपचारिक तरीक़ा है।
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: पूरा नाम बताना
    gloss: मेरा नाम अन्ना कोवाल्स्का है।
    note: यह *nazywać się* का उत्तम पुरुष रूप है, जिसके बाद स्वाभाविक रूप से पहला नाम और उपनाम साथ आते हैं — अपना परिचय देने का यह अधिक औपचारिक और पूर्ण तरीक़ा है।
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: पहला नाम बताना
    gloss: मेरा नाम अन्ना है।
    note: यह *mieć na imię* का उत्तम पुरुष रूप है, जिसके बाद स्वाभाविक रूप से केवल पहला नाम आता है — यह *Nazywam się...* का अनौपचारिक रूप है।
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: मिलकर खुशी जताना
    gloss: आपसे मिलकर बहुत अच्छा लगा।
    note: किसी से पहली बार मिलने पर कहा जाने वाला एक स्थिर और बहुप्रचलित वाक्य, जो औपचारिक और अनौपचारिक दोनों स्थितियों में ठीक रहता है।
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: अनौपचारिक रूप से मूल स्थान पूछना
    gloss: आप कहाँ से हैं?
    note: '*Skąd* का अर्थ "कहाँ से" है। यहाँ *ty* वाला अनौपचारिक रूप दिखाया गया है; इसका औपचारिक रूप *Skąd pan/pani jest?* इस पाठ के अंतिम संवाद में आता है।'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: अपना मूल स्थान बताना
    gloss: मैं कनाडा से हूँ।
    note: '*Z* ("से") के बाद संबंध कारक आता है, इसलिए *Kanada* बदलकर *Kanady* हो जाता है। ज़्यादातर देशों के नाम *z* के बाद इसी तरह बदलते हैं।'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: बताना कि आप कहाँ रहते हैं
    gloss: मैं वारसॉ में रहता/रहती हूँ।
    note: यहाँ *W* ("में") के बाद अधिकरण कारक आता है, इसलिए *Warszawa* बदलकर *Warszawie* हो जाता है। मूल स्थान (*z* के साथ) और वर्तमान निवास (*w* के साथ) में स्थान के नाम पर अलग-अलग कारक लगते हैं — इसे अपवाद की तरह रटने के बजाय एक नियम की तरह पहचानिए।
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: मुलाक़ात की शुरुआत
    gloss: एवा मारेक का अभिवादन करती है और औपचारिक रूप से उसका नाम पूछती है।
    note: एवा किसी ऐसे व्यक्ति से, जिससे वह अभी मिल रही है, औपचारिक *pan* में बात करती है — पहली पेशेवर या अपरिचित मुलाक़ात के लिए यही सुरक्षित तरीक़ा है।
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: मुलाक़ात की शुरुआत, उत्तर
    gloss: मारेक अपना पूरा नाम बताता है और कहता है कि उसे मिलकर अच्छा लगा।
    note: औपचारिक नाम-प्रश्न के उत्तर में पूरे नाम के साथ *Nazywam się* कहना स्वाभाविक और पूर्ण तरीक़ा है।
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: मूल स्थान के बारे में पूछना
    gloss: एवा भी वही भाव दोहराती है और औपचारिक रूप से पूछती है कि मारेक कहाँ से है।
    note: '*Skąd pan jest?* — इस पाठ के *Skąd jesteś?* का औपचारिक रूप — में *jest* आता है, यानी वही अन्य पुरुष का क्रिया-रूप जो हम *pan jest* / *pan ma* में पहले देख चुके हैं।'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: मूल स्थान के बारे में पूछना, उत्तर
    gloss: मारेक कहता है कि वह कनाडा से है, पर वारसॉ में रहता है।
    note: '*Ale* ("लेकिन") उस अंतर को जोड़ता है जो मारेक के मूल स्थान और वर्तमान निवास के बीच है — वही भेद जो *jestem z* और *mieszkam w* दिखाते हैं।'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: भाषा की जानकारी पूछना
    gloss: एवा औपचारिक रूप से पूछती है कि क्या मारेक पोलिश बोलता है।
    note: '*Czy* हाँ/ना वाले प्रश्न की शुरुआत करता है, कुछ वैसे ही जैसे हिंदी में "क्या" करता है; केवल *czy* ही संकेत दे देता है कि आगे प्रश्न आ रहा है।'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: भाषा की जानकारी पर उत्तर देना और विदा लेना
    gloss: मारेक कहता है कि वह थोड़ी-सी पोलिश बोलता है और अभी सीख रहा है, फिर अलविदा कहता है।
    note: '*Jeszcze się uczę* ("मैं अभी सीख रहा/रही हूँ") अपने जारी प्रयास को बताने का एक स्वाभाविक और विनम्र तरीक़ा है — पोलिश सीखने वाले के रूप में आप भी अपने बारे में यह कह सकते हैं।'
