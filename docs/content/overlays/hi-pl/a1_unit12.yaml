teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: कल (बीता हुआ)
    gloss: बीता हुआ कल
    note: हाल ही के बीते हुए दिन के बारे में बात करने का बुनियादी शब्द -- इस इकाई में सिखाए गए भूतकाल के रूपों के साथ स्वाभाविक रूप से जुड़ता है।
    example_gloss: मैं कल सिनेमा में था।
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: कल क्या हुआ?
    gloss: कल क्या हुआ?
    note: किसी से हाल की घटना सुनाने को कहने का स्वाभाविक तरीका -- było जवाब देने वाले के अनुसार नहीं बदलता, इसलिए यह सवाल आप किसी से भी पूछ सकते हैं।
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było क्रिया być (होना) का भूतकाल में नपुंसकलिंग (ono, to) रूप है -- यह co (क्या) के साथ मेल खाता है, इसलिए तब इस्तेमाल होता है जब हम सामान्य रूप से पूछते हैं कि क्या हुआ: Co było wczoraj? जवाब कोई भी दे, शब्द वही रहता है।'
    note: '*Było* नपुंसकलिंग का "था" वाला रूप है -- यह *co* (क्या) से मेल खाता है, जिससे आप पूछ रहे हैं उस व्यक्ति से नहीं, इसलिए *Co było wczoraj?* जैसे खुले सवाल में इसका मतलब "क्या हुआ था" होता है।'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: मैं था / मैं थी
    gloss: मैं था (पुरुष बोले तो) / मैं थी (स्त्री बोले तो)
    note: 'पोलिश भूतकाल में बोलने वाले का लिंग झलकता है: पुरुष बोले तो byłem, स्त्री बोले तो byłam। दोनों का मतलब ठीक "मैं था/थी" है।'
    example_gloss:
    - मैं कल सिनेमा में था।
    - मैं कल सिनेमा में था।
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'भूतकाल: -em और -am'
    gloss: 'भूतकाल की क्रियाओं का अंत बोलने वाले के लिंग के अनुसार अलग होता है: पुरुष बोले तो -em (byłem), स्त्री बोले तो -am (byłam)। यह भूतकाल की हर क्रिया पर लागू होता है, सिर्फ być पर नहीं।'
    note: 'आख़िरी अक्षरों पर ध्यान दीजिए: *-em* पुरुष वक्ता का चिह्न है, *-am* स्त्री वक्ता का। यही ढर्रा आपको इस इकाई की हर भूतकाल क्रिया में दिखेगा।'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: सिनेमा में
    gloss: 'Kino का अंत w के बाद बदल जाता है: idę do kina (कहाँ को?) का रूप jestem w kinie (कहाँ पर?) से अलग है। W kinie अधिकरण कारक है -- यह बताता है कि कुछ कहाँ होता है, यह नहीं कि कोई कहाँ जा रहा है।'
    note: 'दो अलग अंत, दो अलग सवाल: *do kina* "कहाँ को?" का जवाब देता है (यह आप योजनाओं वाली इकाई में सीख चुके हैं), जबकि *w kinie* "कहाँ पर?" का जवाब देता है -- इन्हें आपस में न मिलाइए।'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: मैं कल सिनेमा में था (पुरुष)
    gloss: मैं कल सिनेमा में था।
    note: byłem, wczoraj और w kinie को जोड़ता है -- एक पुरुष इसी तरह बताएगा कि वह कहाँ था।
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: मैं कल सिनेमा में थी (स्त्री)
    gloss: मैं कल सिनेमा में था।
    note: वही वाक्य byłam के साथ -- एक स्त्री इसी तरह बताएगी कि वह कहाँ थी।
  pl.a1.unit12.lesson02.teach.film:
    title: फ़िल्म
    gloss: फ़िल्म
    note: आपने क्या देखा, यह बताने का रोज़मर्रा का शब्द -- सिनेमा जाने की बात सुनाते समय बार-बार आता है।
    example_gloss: मैंने एक अच्छी फ़िल्म देखी।
  pl.a1.unit12.lesson02.teach.dobry:
    title: अच्छा
    gloss: अच्छा
    note: dobry आप पहले dzień dobry (नमस्ते) में देख चुके हैं -- यहाँ यह अकेले एक साधारण विशेषण की तरह है, "अच्छा"।
    example_gloss: बहुत अच्छी फ़िल्म!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: मैंने देखा (पुरुष / स्त्री)
    gloss: मैंने देखा (पुरुष बोले तो) / मैंने देखा (स्त्री बोले तो)
    note: Zobaczyć देखने के एक बार पूरे हुए काम को बताता है (widzieć के उलट, जो लगातार देखना है) -- पुरुष बोले तो zobaczyłem, स्त्री बोले तो zobaczyłam, यानी byłem/byłam वाला ही -em/-am का ढर्रा।
    example_gloss:
    - मैंने एक अच्छी फ़िल्म देखी।
    - मैंने एक अच्छी फ़िल्म देखी।
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: byłem/byłam जैसा ही ढर्रा
    gloss: 'byłem/byłam जैसा ही ढर्रा: zobaczyłem पुरुष बोलता है, zobaczyłam स्त्री। Zobaczyć पूर्ण क्रिया है -- यह एक पूरी हो चुकी घटना बताती है।'
    note: 'अंत वही, क्रिया नई: *zobaczyłem/zobaczyłam* ठीक उसी ढर्रे पर चलता है जो आपने अभी *byłem/byłam* के साथ सीखा।'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: मैंने बनाया / किया (पुरुष / स्त्री)
    gloss: मैंने बनाया / मैंने किया (पुरुष बोले तो) / मैंने बनाया / मैंने किया (स्त्री बोले तो)
    note: Zrobić एक पूरे हो चुके काम के लिए "बनाना" और "करना" दोनों का अर्थ देता है -- पुरुष के लिए zrobiłem, स्त्री के लिए zrobiłam, फिर वही ढर्रा।
    example_gloss:
    - मैंने दोपहर का खाना बनाया।
    - मैंने दोपहर का खाना बनाया।
  pl.a1.unit12.lesson02.teach.obiad:
    title: दोपहर का खाना
    gloss: दोपहर का खाना / दिन का मुख्य भोजन
    note: आपको दिनचर्या वाली इकाई से obiad याद होगा -- यहाँ यह दिन का वह मुख्य भोजन है जो मारेक बनाता है।
    example_gloss: यह बहुत स्वादिष्ट खाना है।
  pl.a1.unit12.lesson02.teach.pyszny:
    title: स्वादिष्ट
    gloss: स्वादिष्ट
    note: खाने की तारीफ़ करने का गर्मजोशी भरा, रोज़मर्रा का तरीका -- obiad के ठीक बाद स्वाभाविक रूप से आता है।
    example_gloss: यह बहुत स्वादिष्ट खाना है।
  pl.a1.unit12.lesson03.teach.jaki:
    title: कौन-सा / किस तरह का
    gloss: कौन-सा / किस तरह का
    note: 'jaki आप पहले फ़ोन नंबर और सप्ताह के दिनों के बारे में पूछते समय देख चुके हैं -- यहाँ इसी तरह किसी ख़ास बात को पूछने के लिए है: कौन-सी फ़िल्म?'
    example_gloss: यह कौन-सी फ़िल्म है?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: एक शब्द के छोटे सवाल
    gloss: बातचीत में आप सिर्फ़ एक शब्द से छोटा सवाल पूछ सकते हैं, जैसे पूरे सवाल Czy obiad był pyszny? की जगह Pyszny? -- यह रोज़मर्रा की बातचीत की तरह स्वाभाविक और तेज़ लगता है।
    note: असली बातचीत में जब संदर्भ से बात साफ़ हो, तो पूरा वाक्य छोड़ दिया जाता है -- अकेला *Pyszny?* का मतलब है "क्या स्वादिष्ट था?"
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: मारेक पूछता है कि क्या हुआ
    gloss: नमस्ते एवा! कल क्या हुआ?
    note: इस इकाई का सबसे पहला सिखाया गया सवाल, जो अब एक असली बातचीत शुरू कर रहा है।
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: एवा सिनेमा में थी
    gloss: मैं सिनेमा में थी! मैंने एक अच्छी फ़िल्म देखी।
    note: Byłam (स्त्रीलिंग) और zobaczyłam (स्त्रीलिंग) दोनों दिखाते हैं कि बोलने वाली एवा है।
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: मारेक पूछता है कौन-सी फ़िल्म
    gloss: कौन-सी फ़िल्म?
    note: jaki वाला एक छोटा, स्वाभाविक अगला सवाल।
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: एवा जवाब देती है और पलटकर पूछती है
    gloss: बहुत अच्छी! और तुम?
    note: A ty? (और तुम?) बिना किसी नए व्याकरण के बातचीत वापस मारेक को सौंप देता है।
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: मारेक ने दोपहर का खाना बनाया
    gloss: मैंने दोपहर का खाना बनाया!
    note: Zrobiłem (पुल्लिंग) दिखाता है कि बोलने वाला मारेक है -- यह उसके दिन की अपनी पूरी हो चुकी घटना है।
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: एवा पूछती है कि क्या स्वादिष्ट था
    gloss: स्वादिष्ट?
    note: एक शब्द का प्रश्न, ठीक वैसा ही जैसा इस पाठ के व्याकरण-नोट में बताया गया है।
