teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: कुल कीमत पूछना
    gloss: कुल कितना खर्च होता है?
    note: '*W sumie* (कुल मिलाकर) स्पष्ट करता है कि आप किसी एक चीज़ की नहीं, बल्कि पूरी कुल कीमत जानना चाहते हैं।'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: कुल कीमत बताना
    gloss: कुल मिलाकर इसकी कीमत एक सौ ज़्लोटी है।
    note: '*Kosztuje*, *kosztować* (कीमत होना) का *on/ona/ono* वाला रूप है। 5 से ऊपर की संख्याओं के साथ संज्ञा बहुवचन संबंध कारक में आती है: *sto złotych*।'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: कार्ड या नकद से भुगतान करना
    gloss: कार्ड से भुगतान करना, नकद भुगतान करना
    note: '*Płacić kartą* (कार्ड से भुगतान करना) और *płacić gotówką* (नकद भुगतान करना) दोनों में *płacić* के बाद साधन कारक आता है: *kartą*, *gotówką*।'
    example_gloss:
    - क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    - मैं नकद भुगतान कर रहा हूँ।
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: कार्ड से भुगतान की संभावना पूछना
    gloss: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    note: '*Tu* (यहाँ) सवाल को मौजूदा जगह से जोड़ता है; *czy* हाँ/ना वाला प्रश्न शुरू करता है और *mogę* का अर्थ ''मैं सकता/सकती हूँ'' है।'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: भुगतान की पसंद पूछना
    gloss: आप नकद भुगतान करना चाहेंगे या कार्ड से?
    note: '*Czy chce pan ...?*, *Czy chcesz ...?* का औपचारिक रूप है, जिसे यहाँ अनजान कैशियर इस्तेमाल करता है (पुरुष के लिए *pan*, स्त्री के लिए *pani*)।'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: बिल
    gloss: बिल
    note: 'पुल्लिंग संज्ञा: *rachunek* (संबंध कारक *rachunku*)।'
    example_gloss: क्या हम बिल बाँट लें?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: बिल बाँटने का सुझाव देना
    gloss: क्या हम बिल बाँट लें?
    note: '*Może podzielimy ...?* साथ मिलकर कुछ करने का विनम्र सुझाव देने का तरीका है; *podzielimy*, *podzielić* का *my* (हम) वाला रूप है।'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: अलग-अलग भुगतान करने को कहना
    gloss: क्या मैं अलग से भुगतान कर सकता हूँ?
    note: '*Osobno* (अलग से) के साथ *zapłacić* आता है (भुगतान करना, पूर्ण क्रिया: एक बार का पूरा भुगतान)।'
  pl.a1.unit23.lesson04.teach.reszta:
    title: बाकी पैसे
    gloss: खुले पैसे / बाकी पैसे
    note: 'स्त्रीलिंग संज्ञा: *reszta* (संबंध कारक *reszty*, जैसे *nie potrzebuję reszty* में)।'
    example_gloss: यह रहा आपका बचा हुआ पैसा।
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: बाकी पैसे लौटाना
    gloss: यह रहा आपका बचा हुआ पैसा।
    note: '*Pana* औपचारिक ''आपका'' है (पुरुष के लिए; स्त्री के लिए *pani*), जो काउंटर पर बोलचाल की औपचारिकता से मेल खाता है।'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: बाकी पैसे लेने से मना करना
    gloss: मुझे बाकी पैसे नहीं चाहिए।
    note: '*Nie potrzebuję* + संबंध कारक: निषेध में कर्म संबंध कारक में आता है, इसलिए *reszty*।'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: पैंतीस
    gloss: पैंतीस
    note: '*Trzydzieści pięć* दो शब्दों में लिखा जाता है: पहले दहाई, फिर इकाई (30 + 5)।'
    example_gloss: इसकी कीमत एक सौ चालीस ज़्लोटी है।
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: रेस्तराँ का बिल पढ़िए
    gloss: 'बिल: दो मुख्य व्यंजन और दो कॉफ़ी। कुल: एक सौ चालीस ज़्लोटी। कार्ड से भुगतान किया गया।'
    note: देखिए कि क्या मँगाया गया, कुल कितना हुआ और भुगतान कैसे किया गया।
    glosses:
      Rachunek: बिल
      dwa: दो
      dania: मुख्य व्यंजन
      kawy: कॉफ़ी
      Razem: कुल
      złotych: ज़्लोटी
      Zapłacono: चुकाया गया
      kartą: कार्ड
      sto: सौ
      czterdzieści: चालीस
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: एवा बिल माँगती है
    gloss: 'एवा: क्यों न हम बिल माँग लें?'
    note: '*Poprosić o* (माँगना) के बाद कर्म कारक आता है: *o rachunek*। *Poprosimy* पूर्ण भविष्यकाल है।'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: मारेक कुल रकम पूछता है
    gloss: 'मारेक: हाँ, अच्छा विचार है। कुल कितना हुआ?'
    note: यह पाठ 1 के *Ile to kosztuje w sumie?* वाले प्रश्न का दोबारा प्रयोग है।
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: एवा कुल रकम बताती है
    gloss: 'एवा: यह एक सौ चालीस ज़्लोटी है। क्या हम बाँट लें?'
    note: '*Podzielimy się?* (शाब्दिक अर्थ: ''क्या हम आपस में बाँट लें?'') में आत्मवाचक *się* का प्रयोग बिल बाँटने के अर्थ में हुआ है।'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: मारेक भुगतान करने पर अड़ता है
    gloss: 'मारेक: नहीं, आज मैं दूँगा। तुमने मेरी बहुत मदद की है!'
    note: '*Dzisiaj ja płacę* (शाब्दिक अर्थ: ''आज मैं भुगतान करता हूँ'') भुगतान की पेशकश करने का सामान्य तरीका है; *pomogłaś*, *pomóc* (मदद करना) का स्त्रीलिंग भूतकाल है, क्योंकि मारेक एवा से बात कर रहा है।'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: एवा भावुक हो जाती है
    gloss: 'एवा: यह तुम्हारी बहुत अच्छी बात है! धन्यवाद।'
    note: '*Miło z twojej strony* (आपकी ओर से भला काम) उदारता भरे इशारे के लिए एक आत्मीय, आम तारीफ़ है; *z* + संबंध कारक: *z twojej strony*।'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: मारेक कार्ड से भुगतान के बारे में पूछता है
    gloss: 'मारेक: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?'
    note: यह पाठ 2 के *Czy mogę tu zapłacić kartą?* प्रश्न का दोबारा प्रयोग है, अब असली रेस्तराँ में।
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: वह वाला रूप'
    gloss: मारेक बिल चुकाता है।
    note: '*Płaci*, *płacić* (भुगतान करना) का *on/ona/ono* वाला रूप है।'
