teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: परिवार
    gloss: परिवार
    note: परिवार के लिए सामान्य शब्द। यह पूरे घर-परिवार के लिए इस्तेमाल होता है, किसी एक रिश्ते के लिए नहीं।
    example_gloss: यह मेरा परिवार है।
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: माँ, पिता
    gloss: माँ; पिता
    note: माता-पिता के लिए ये दो मूल शब्द हैं। रोज़ की बोलचाल में आप प्यार भरे mama और tata भी सुनेंगे, पर यहाँ matka और ojciec सिखाए गए हैं, जो सामान्य मानक रूप हैं।
    example_gloss:
    - ये मेरी माँ हैं।
    - ये मेरे पिता हैं।
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: भाई, बहन
    gloss: भाई; बहन
    note: दोनों सामान्य संज्ञाएँ हैं। brat पुल्लिंग है और siostra स्त्रीलिंग, और यही इस पाठ के व्याकरण नोट में mój/moja के मेल के लिए मायने रखता है।
    example_gloss:
    - यह मेरा भाई है।
    - यह मेरी बहन है।
  pl.a1.unit05.lesson01.teach.rodzice:
    title: माता-पिता
    gloss: माता-पिता
    note: Rodzice पुल्लिंग-व्यक्तिवाचक बहुवचन संज्ञा है। इसका अपना अधिकार-रूप moi है (mój/moja नहीं), जो आप इस पाठ के उदाहरण और व्याकरण नोट में देखेंगे।
    example_gloss: मेरे माता-पिता वारसॉ में रहते हैं।
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'मेरा / मेरी / मेरे: mój, moja, moi'
    gloss: मेरे पिता, मेरा भाई -- मेरी माँ, मेरी बहन -- मेरे माता-पिता।
    note: 'पोलिश में अधिकार-सूचक शब्द उस संज्ञा के लिंग के अनुसार बदलते हैं जिसका वे वर्णन करते हैं: पुल्लिंग संज्ञा से पहले *mój* (*mój ojciec*, *mój brat*), स्त्रीलिंग संज्ञा से पहले *moja* (*moja matka*, *moja siostra*), और पुल्लिंग-व्यक्तिवाचक बहुवचन *rodzice* से पहले अलग अनियमित रूप *moi*।'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: ये मेरे पिता हैं
    gloss: ये मेरे पिता हैं।
    note: '*To jest* (यह है) संज्ञा के लिंग से बदलता नहीं है। केवल mój/moja बदलता है।'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: दादा, दादी
    gloss: दादा; दादी
    note: दादा और दादी के लिए रोज़मर्रा के सामान्य शब्द, जिन्हें बच्चे और बड़े दोनों इस्तेमाल करते हैं।
    example_gloss:
    - ये मेरे दादा/नाना हैं।
    - ये मेरी दादी/नानी हैं।
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: चाचा/मामा, चाची/मौसी
    gloss: चाचा/मामा; चाची/मौसी/बुआ
    note: ये शब्द माता-पिता के भाई-बहन और उनके जीवनसाथी, दोनों के लिए इस्तेमाल होते हैं। हिंदी में चाचा, मामा, मौसी, बुआ जैसे अलग-अलग शब्द हैं, पर पोलिश में इन सबके लिए एक ही शब्द चलता है।
    example_gloss:
    - ये मेरे चाचा/मामा/फूफा/मौसा हैं।
    - ये मेरी चाची/मौसी/बुआ हैं।
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: बेटा, बेटी
    gloss: बेटा; बेटी
    note: 'उदाहरणों में *mieć* (होना/पास होना) के बाद ज़रूरी कर्म कारक रूप दिखता है: *syn* बदलकर *syna* और *córka* बदलकर *córkę* हो जाता है। आगे के व्याकरण नोट बताते हैं कि अंत क्यों बदलता है।'
    example_gloss:
    - मेरा एक बेटा है।
    - मेरी एक बेटी है।
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'किसी के पास होना: mam, masz, ma'
    gloss: 'किसी के पास होना: मेरे पास है, तुम्हारे पास है, उसके पास है -- मेरा एक भाई है, तुम्हारी एक बहन है, उसका एक बेटा है।'
    note: '*Mieć* का अर्थ है "किसी के पास होना"। *Mam* (मेरे पास है) और *ma* (उसके पास है) इस पाठ के मुख्य नए रूप हैं। *Masz* (तुम्हारे पास है) आप यूनिट 2 में किसी की उम्र पूछते समय पहले देख चुके हैं।'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: बताना कि आपके पास क्या है
    gloss: '"मेरे पास है" जैसे क्रिया के बाद संज्ञा का अंत बदलता है: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę।'
    note: यह कर्म कारक है, यानी *mieć* जैसी क्रिया की वस्तु बनने पर संज्ञा का रूप। *brat* और *syn* जैसी व्यक्तिवाचक पुल्लिंग संज्ञाएँ (और जानवरों के नाम) *-a* जोड़ती हैं। *siostra* और *córka* जैसी स्त्रीलिंग संज्ञाएँ अंतिम *-a* की जगह *-ę* लेती हैं।
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: मेरा एक भाई और एक बहन है
    gloss: मेरा एक भाई और एक बहन है।
    note: व्याकरण नोट के कर्म कारक अंत यहाँ पूरे वाक्य में काम आते हैं, साथ ही नया जोड़ने वाला शब्द *i* (और) भी।
  pl.a1.unit05.lesson03.teach.lub:
    title: या
    gloss: या
    note: दो विकल्प देने वाले हाँ/नहीं प्रश्न में lub वैसे ही आता है जैसे हिंदी में "या" आता है।
    example_gloss: क्या तुम्हारा कोई भाई या बहन है?
  pl.a1.unit05.lesson03.teach.tylko:
    title: सिर्फ़
    gloss: सिर्फ़
    note: tylko उस शब्द से ठीक पहले आता है जिसे वह सीमित करता है। हिंदी में "सिर्फ़" भी आम तौर पर उसी शब्द के पास आता है।
    example_gloss: मेरी सिर्फ़ एक बहन है।
  pl.a1.unit05.lesson03.teach.gdzie:
    title: कहाँ
    gloss: कहाँ
    note: एक बुनियादी प्रश्नवाचक शब्द है। यह mieszkać (रहना) के साथ स्वाभाविक रूप से आता है, जैसा इस पाठ के संवाद में है।
    example_gloss: तुम्हारा भाई कहाँ रहता है?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: वह, वह -- और "रहना"
    gloss: 'वह (पुरुष), वह (स्त्री) -- रहना: मैं रहता/रहती हूँ, वह रहता/रहती है। वह गदान्स्क में रहता है। वह क्राकुफ़ में रहती है।'
    note: '*On* (वह, पुरुष) और *ona* (वह, स्त्री) अन्य पुरुष सर्वनाम हैं। *Mieszkać* (रहना) उत्तम और अन्य पुरुष में वही ढाँचा अपनाता है जो *mieć* अपनाता है: *mieszkam* (मैं रहता/रहती हूँ, यूनिट 1 के *Mieszkam w Warszawie* से) और *mieszka* (वह रहता/रहती है)। स्थान के नामों के साथ *w* के बाद अधिकरण कारक आता है: *Gdańsk* बदलकर *w Gdańsku* और *Kraków* बदलकर *w Krakowie* हो जाता है, ठीक यूनिट 1 के *Mieszkam w Warszawie* की तरह।'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: मारेक भाई-बहनों के बारे में पूछता है
    gloss: मारेक एवा से पूछता है कि क्या उसका कोई भाई या बहन है।
    note: '*Czy* वाला हाँ/नहीं प्रश्न, वही प्रश्न-सूचक शब्द जो यूनिट 1 में था। एवा और मारेक अब एक-दूसरे को अच्छी तरह जानते हैं, इसलिए वे औपचारिक *pan*/*pani* से अनौपचारिक *ty* पर आ गए हैं (*masz*, *A ty?*, *twój*)।'
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: एवा जवाब देती है और वही सवाल लौटाती है
    gloss: एवा कहती है कि उसका एक भाई और एक बहन है, फिर मारेक से वही सवाल पूछती है।
    note: '*A ty?* ("और तुम?") वही सवाल पूछने वाले की ओर लौटाने का छोटा और स्वाभाविक तरीका है।'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: मारेक जवाब देता है
    gloss: मारेक कहता है कि उसकी सिर्फ़ एक बहन है, जो क्राकुफ़ में रहती है, फिर एवा से उसके भाई के बारे में पूछता है।
    note: मारेक का कोई भाई नहीं है, सिर्फ़ *tylko siostrę* (सिर्फ़ एक बहन)। एवा के भाई के बारे में पूछना ठीक है, क्योंकि एवा पहले ही बता चुकी है कि उसका एक भाई है।
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: एवा जवाब देती है
    gloss: एवा कहती है कि उसका भाई गदान्स्क में रहता है और उसका एक बेटा और एक बेटी है।
    note: यह पाठ 2 के syn/córka वाले कर्म कारक ढाँचे को फिर से इस्तेमाल करता है।
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: मारेक प्रतिक्रिया देता है
    gloss: मारेक कहता है, क्या बढ़िया परिवार है!
    note: '*Fajna* "अच्छा/बढ़िया" के लिए रोज़ की बोलचाल का अनौपचारिक शब्द है। यह बात खत्म करते समय स्वाभाविक प्रतिक्रिया है, उसी स्तर की जैसी यूनिट 4 का *Świetnie!* था।'
