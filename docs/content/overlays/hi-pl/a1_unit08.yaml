teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: बैंक, डाकघर
    gloss: बैंक; डाकघर
    note: रोज़मर्रा के दो आम काम -- bank हिंदी के 'बैंक' जैसा ही है; poczta वह जगह है जहाँ आप चिट्ठी या पार्सल भेजते हैं।
    example_gloss:
    - यह एक बैंक है।
    - यह एक डाकघर है।
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: दवाखाना, रेस्तराँ
    gloss: दवाखाना; रेस्तराँ
    note: Apteka वह जगह है जहाँ दवाइयाँ मिलती हैं (कोई आम दुकान नहीं); restauracja हिंदी के 'रेस्तराँ' से मिलता-जुलता है।
    example_gloss:
    - यह एक दवाखाना है।
    - यह एक रेस्तराँ है।
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: होटल; पार्क
    note: दोनों शब्द हिंदी के 'होटल' और 'पार्क' जैसे ही हैं -- लिखने और बोलने, दोनों में आसानी से पहचाने जाते हैं।
    example_gloss:
    - यह एक होटल है।
    - यह एक पार्क है।
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Gdzie jest + [जगह]?
    gloss: 'Gdzie jest + [जगह]? -- Gdzie (कहाँ) और jest (है) मिलकर स्थान के बारे में पूछते हैं: बैंक कहाँ है? दवाखाना कहाँ है?'
    note: '*Gdzie* का अर्थ है "कहाँ" और *jest* का अर्थ है "है" -- साथ मिलकर *Gdzie jest...?* किसी भी जगह का पता पूछने का रोज़ का ढाँचा है। एक जगह के बारे में पूछते समय इसे जस का तस इस्तेमाल कीजिए; एक से अधिक जगहों के लिए पोलिश में *są* ("हैं") आता है।'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: बैंक कहाँ है?
    gloss: बैंक कहाँ है?
    note: व्याकरण नोट का ढाँचा इस पाठ के पहले स्थान-शब्द के साथ प्रयोग में।
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: पास, दूर
    gloss: पास; दूर
    note: विपरीतार्थक शब्दों की सरल जोड़ी, जो jest के ठीक बाद आकर बताती है कि कोई जगह कितनी पास या दूर है।
    example_gloss:
    - पार्क पास है।
    - होटल दूर है।
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: ज़्यादा दूर नहीं
    gloss: ज़्यादा दूर नहीं
    note: शाब्दिक रूप से *nie* (नहीं) और *daleko* (दूर) मिलकर एक शब्द बने हैं -- किसी को भरोसा दिलाने का नरम और बहुत आम तरीका कि जगह आसानी से पहुँच में है।
    example_gloss: दवाखाना ज़्यादा दूर नहीं है।
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: बगल में, सामने
    gloss: बगल में; सामने
    note: दोनों शब्द किसी जगह की स्थिति किसी निशान के सापेक्ष बताते हैं, सिर्फ़ यह नहीं कि वह कितनी पास है। दोनों के बाद आने वाली संज्ञा संबंध कारक में बदलती है -- इस पाठ का व्याकरण नोट देखिए।
    example_gloss:
    - दवाखाना बैंक के बगल में है।
    - रेस्तराँ होटल के सामने है।
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: '''obok''/''naprzeciwko''/''blisko + संज्ञा'' के बाद: संबंध कारक'
    gloss: '''बगल में''/''सामने''/''पास + जगह'' के बाद: संबंध कारक -- बैंक -> बैंक का रूप, होटल -> होटल का रूप, पार्क -> पार्क का रूप। दवाखाना बैंक के बगल में है। रेस्तराँ होटल के सामने है। रेस्तराँ पार्क के पास है।'
    note: '*Obok*, *naprzeciwko* और *blisko* (जब उसके बाद कोई जगह आए, अकेला न हो) तीनों संबंध कारक की माँग करते हैं, इसलिए बाद की संज्ञा का अंत बदलता है। इन तीन नियमित पुल्लिंग संज्ञाओं में इसका मतलब है *-u* जोड़ना: *bank* से *banku*, *hotel* से *hotelu*, *park* से *parku*। अकेले आने पर *blisko* को संबंध कारक की ज़रूरत नहीं -- *To jest blisko* ("यह पास है") उतना ही सही है जितना *blisko parku* ("पार्क के पास")।'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: दवाखाना बैंक के बगल में है
    gloss: दवाखाना बैंक के बगल में है।
    note: व्याकरण-नोट के -u वाले पैटर्न को असली वाक्य में इस्तेमाल करना -- obok के बाद bank बदलकर banku हो जाता है।
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: माफ़ कीजिए
    gloss: माफ़ कीजिए / क्षमा करें
    note: सवाल पूछने से पहले किसी अजनबी का ध्यान खींचने का रोज़मर्रा का तरीक़ा -- इसे सवाल के बाद नहीं, पहले कहा जाता है।
    example_gloss: माफ़ कीजिए, बैंक कहाँ है?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: एवा दवा की दुकान का पता पूछती है
    gloss: एवा "माफ़ कीजिए" कहकर पूछती है कि दवा की दुकान कहाँ है।
    note: Przepraszam सवाल की शुरुआत करता है, जैसा कि इस पाठ के शब्द-नोट में बताया गया है -- मारेक जैसे जान-पहचान वाले से भी कुछ पूछने से पहले टोकने का यही विनम्र तरीक़ा है।
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: मारेक दवा की दुकान की जगह बताता है
    gloss: मारेक कहता है कि दवा की दुकान ज़्यादा दूर नहीं है, बैंक के बगल में है।
    note: niedaleko और obok + banku को मिलाता है, दोनों पाठ 2 के व्याकरण-नोट से हैं।
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: एवा मारेक को धन्यवाद देती है और रेस्तराँ के बारे में पूछती है
    gloss: एवा धन्यवाद कहती है और पूछती है कि रेस्तराँ कहाँ है।
    note: Dziękuję पिछली इकाइयों से दोहराया गया है; A (और) नए सवाल को पिछले सवाल से जोड़ता है।
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: मारेक रेस्तराँ की जगह बताता है
    gloss: मारेक कहता है कि रेस्तराँ होटल के सामने, पार्क के पास है।
    note: Naprzeciwko + hotelu (संबंध कारक, banku जैसा ही पैटर्न) और दूसरी निशानी के लिए blisko।
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: एवा मारेक को फिर धन्यवाद देती है
    gloss: 'एवा कहती है: बहुत-बहुत धन्यवाद।'
    note: Bardzo (बहुत) dziękuję को और ज़ोरदार बना देता है, ठीक वैसे ही जैसे proszę bardzo में।
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: मारेक जवाब देता है
    gloss: 'मारेक कहता है: कोई बात नहीं, आपका स्वागत है।'
    note: Proszę bardzo, धन्यवाद का सामान्य जवाब, जो ख़रीदारी वाली इकाई से दोहराया गया है।
