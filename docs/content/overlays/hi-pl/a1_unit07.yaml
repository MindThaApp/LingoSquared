  pl.a1.unit07.lesson01.teach.banan:
    title: केला
    gloss: केला
    note: एक आम फल, जो किसी भी बाज़ार या दुकान में नग के हिसाब से या वज़न के हिसाब से बिकता है।
    example_gloss: यह केला है।
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: टमाटर, खीरा
    gloss: टमाटर; खीरा
    note: दोनों पुल्लिंग निर्जीव संज्ञाएँ हैं -- इस पाठ में आगे जब आप इन्हें किलो के हिसाब से खरीदेंगे, तब इनके संबंध कारक बहुवचन रूप (pomidorów, ogórków) काम आएँगे।
    example_gloss:
    - यह टमाटर है।
    - यह खीरा है।
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: आलू, प्याज़
    gloss: आलू; प्याज़
    note: Ziemniak पुल्लिंग निर्जीव है (banan और pomidor की तरह संबंध कारक बहुवचन में -ów लेता है); cebula स्त्रीलिंग है।
    example_gloss:
    - यह आलू है।
    - यह प्याज़ है।
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: सस्ता, महँगा
    gloss: सस्ते में; महँगे में
    note: '*Tanio* और *drogo* क्रियाविशेषण हैं और पोलिश में ये सीधे *kosztować* (“कीमत होना”) के साथ आते हैं -- *To kosztuje drogo* का शाब्दिक अर्थ है “इसकी कीमत महँगे ढंग से है”, यानी “यह महँगा है”।'
    example_gloss:
    - बहुत सस्ता!
    - बहुत महँगा!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'कीमत होना: kosztuje, kosztują'
    gloss: 'कीमत होना: इसकी कीमत है (एक चीज़), इनकी कीमत है (एक से अधिक) -- केला सस्ता है। केले सस्ते हैं।'
    note: '*Kosztować* का अर्थ है “कीमत होना”। एक चीज़ के लिए *kosztuje* और एक से अधिक के लिए *kosztują* कहिए -- ठीक वैसे ही जैसे *jest*/*są* (“है”/“हैं”), बस दामों के लिए। यह मेल बैठाना ज़रूरी है: बाज़ार का विक्रेता आपकी बात दोनों तरह समझ लेगा, पर *banany kosztują* वही है जो मूल बोलने वाला सचमुच कहता है।'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: केले की कीमत कितनी है?
    gloss: केले की कीमत कितनी है?
    note: मोल-भाव शुरू करने का रोज़मर्रा का सवाल -- *Ile* (कितना) के साथ एकवचन *kosztuje*, क्योंकि पूछा एक केले के बारे में जा रहा है।
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: चकोतरा
    gloss: चकोतरा
    note: pomidor और ziemniak की तरह पुल्लिंग निर्जीव -- proszę o के बाद इसका अंत नहीं बदलता।
    example_gloss: यह चकोतरा है।
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: मैंडरिन, संतरा
    gloss: मैंडरिन; संतरा
    note: दोनों स्त्रीलिंग हैं, जैसे खान-पान वाली इकाई के kawa और herbata -- कर्म कारक में इनका -a बदलकर -ę हो जाएगा, पर इस पाठ में केवल इनका मूल रूप चाहिए।
    example_gloss:
    - यह मैंडरिन है।
    - यह संतरा है।
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: एक किलो, आधा किलो
    gloss: एक किलो; आधा किलो
    note: '*Kilo* का अपना अंत कभी नहीं बदलता, चाहे आप कुछ भी तौलें या कितना भी माँगें -- बदलती है *kilo* के बाद आने वाली संज्ञा, जैसा इस पाठ का व्याकरण नोट समझाता है।'
    example_gloss:
    - एक किलो टमाटर, कृपया।
    - आधा किलो केले, कृपया।
  pl.a1.unit07.lesson02.teach.poprosze:
    title: मुझे चाहिए (कृपया)
    gloss: मुझे दीजिए / कृपया दीजिए
    note: '*Poproszę*, खान-पान वाली इकाई के *proszę o* का थोड़ा सलीकेदार, रोज़मर्रा का विकल्प है -- दोनों का मोटे तौर पर अर्थ “मुझे चाहिए” है और पोलिश बोलने वाले दोनों के बीच सहजता से आते-जाते हैं। *Poproszę* के तुरंत बाद वह चीज़ आती है जो आप चाहते हैं, *o* की ज़रूरत नहीं।'
    example_gloss: मुझे एक चकोतरा दीजिए।
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: '''kilo'' के बाद: -ów अंत'
    gloss: '''kilo'' के बाद संबंध कारक बहुवचन: केला -> केलों का, टमाटर -> टमाटरों का, आलू -> आलुओं का।'
    note: 'जब आप वज़न से मात्रा बताते हैं -- *kilo*, *pół kilo* -- तो उसके बाद की संज्ञा दूसरे रूप में आती है, यानी संबंध कारक बहुवचन में। इन तीन नियमित पुल्लिंग संज्ञाओं के लिए इसका मतलब बस *-ów* जोड़ना है: *banan* से *bananów*, *pomidor* से *pomidorów*, *ziemniak* से *ziemniaków*।'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: एक किलो टमाटर, कृपया
    gloss: एक किलो टमाटर, कृपया।
    note: व्याकरण नोट के -ów नियम को असली माँग में इस्तेमाल करता है -- kilo के बाद pomidor बदलकर pomidorów हो जाता है।
  pl.a1.unit07.lesson03.teach.dla:
    title: के लिए
    gloss: के लिए
    note: “के लिए” अर्थ वाला एक सरल पूर्वसर्ग -- विक्रेता *Co dla pani?* (शाब्दिक अर्थ “आपके लिए क्या?”) में इसे इस्तेमाल करके ग्राहक से औपचारिक रूप से पूछता है कि उन्हें क्या चाहिए।
    example_gloss: यह आपके लिए है।
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: ताज़ा, बहुत
    gloss: ताज़ा; बहुत
    note: दो रोज़मर्रा के शब्द जो बाज़ार का विक्रेता बार-बार इस्तेमाल करता है -- चीज़ की ताज़गी की तारीफ़ करने के लिए, या यह बताने के लिए कि वह कितनी सस्ती या महँगी है।
    example_gloss:
    - टमाटर ताज़े हैं।
    - बहुत सस्ता!
  pl.a1.unit07.lesson03.teach.trochę:
    title: थोड़ा
    gloss: थोड़ा / ज़रा
    note: शिकायत को नरमी से कहता है -- दोस्ताना मोल-भाव में सीधे drogo कहने से trochę drogo (“थोड़ा महँगा”) कहीं ज़्यादा स्वाभाविक लगता है।
    example_gloss: थोड़ा महँगा है।
  pl.a1.unit07.lesson03.teach.razem:
    title: कुल / साथ मिलाकर
    gloss: कुल / साथ मिलाकर
    note: विक्रेता यह शब्द तब कहता है जब वह आपको देनी वाली अंतिम रकम बताने वाला होता है।
    example_gloss: कुल दस ज़्लोटी।
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: आप क्या लेंगे?
    gloss: आप क्या लेंगे?
    note: शाब्दिक अर्थ “आपके लिए क्या (औपचारिक)” -- ग्राहक से विक्रेता का स्वाभाविक पहला सवाल।
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: विक्रेता Ewa का अभिवादन करता है
    gloss: विक्रेता नमस्ते कहता है और Ewa से पूछता है कि उसे क्या चाहिए।
    note: Dzień dobry, जो इकाई 1 के अभिवादनों में आ चुका है।
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa केलों के बारे में पूछती है
    gloss: Ewa पूछती है कि केलों की कीमत कितनी है।
    note: Kosztują -- इस इकाई के व्याकरण नोट का बहुवचन रूप, क्योंकि केलों के बारे में समूह के रूप में पूछा जा रहा है।
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: विक्रेता दाम बताता है
    gloss: विक्रेता कहता है कि पाँच ज़्लोटी किलो है, और केले बहुत ताज़ा हैं।
    note: दाम बताने का स्वाभाविक संक्षिप्त तरीका -- पोलिश विक्रेता प्रति किलो का भाव "[दाम] kilo" कहकर बताता है; "प्रति" के लिए अलग शब्द नहीं लगता।
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: एवा केले मँगवाती है
    gloss: एवा कहती है ठीक है, और एक किलो केले माँगती है।
    note: poproszę के साथ kilo + bananów -- ठीक वही ढाँचा जो पाठ 2 के व्याकरण नोट में है।
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: विक्रेता टमाटरों का ज़िक्र करता है
    gloss: विक्रेता टमाटरों के बारे में भी पूछता है, और कहता है कि वे आठ ज़्लोटी किलो हैं।
    note: पंक्ति 3 जैसा ही संक्षिप्त दाम वाला ढाँचा, इस बार दूसरी चीज़ के लिए।
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: एवा हल्का मोल-भाव करती है और ऑर्डर देती है
    gloss: एवा कहती है कि थोड़ा महँगा है, पर वह आधा किलो ले लेगी।
    note: Trochę drogo शिकायत को नरम कर देता है -- एवा फिर भी खरीदती है, बस कम मात्रा में।
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: विक्रेता कुल रकम बताता है
    gloss: विक्रेता कहता है यह लीजिए, और कुल नौ ज़्लोटी हुए।
    note: केलों के 5 złotych और आधा किलो टमाटरों के 4 złotych -- कुल नौ złotych, जो दृश्य में पहले बताए हर दाम से मेल खाता है।
