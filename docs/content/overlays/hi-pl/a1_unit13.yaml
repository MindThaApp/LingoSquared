teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: संगीत
    gloss: संगीत
    note: पसंद-नापसंद की बात करने के लिए आम विषय -- यह शब्द आसानी से पहचान में आ जाता है।
    example_gloss: मुझे संगीत पसंद है।
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: lubić (पसंद करना) के साथ कर्म आने पर muzyka बदलकर muzykę हो जाता है, ठीक वैसे ही जैसे kawa से kawę बनता है। Lubię muzykę, न कि Lubię muzyka।
    note: 'वही पैटर्न जो आप पहले से जानते हैं: *lubię* का कर्म बनने पर *muzyka* बदलकर *muzykę* हो जाता है, ठीक *kawa* से *kawę* की तरह।'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: तुम पसंद करते हो
    gloss: तुम पसंद करते हो (अनौपचारिक, ty)
    note: lubić का 'ty' रूप -- किसी दोस्त से सीधे पूछने के लिए ज़रूरी कि उसे कुछ पसंद है या नहीं।
    example_gloss: क्या तुम्हें संगीत पसंद है?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (पसंद करना): lubię (मैं), lubisz (तुम), lubi (वह)। Lubię और lubi आप पहले से जानते हैं -- lubisz नया रूप है, उस व्यक्ति के लिए जिससे आप बात कर रहे हैं।'
    note: '*Lubię* और *lubi* अब पुराने साथी हैं -- *lubisz* उसी क्रिया का छूटा हुआ "तुम" वाला रूप भर देता है।'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: क्या तुम्हें संगीत पसंद है?
    gloss: क्या तुम्हें संगीत पसंद है?
    note: Czy हाँ/नहीं वाले प्रश्न की शुरुआत करता है -- किसी दोस्त से उसकी पसंद पूछने का स्वाभाविक तरीक़ा।
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: हाँ, मुझे पसंद है।
    gloss: हाँ, मुझे पसंद है।
    note: एक छोटा, स्वाभाविक उत्तर -- muzykę शब्द दोहराने की ज़रूरत नहीं।
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: नहीं, मुझे नहीं।
    gloss: नहीं, मुझे पसंद नहीं है।
    note: Nie, nie lubię में दो बार nie देखकर लगता है कि गलती है, पर ऐसा नहीं है -- पहला nie प्रश्न का उत्तर देता है, दूसरा nie क्रिया lubię को नकारता है।
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: छोटे उत्तर
    gloss: 'छोटा उत्तर: Tak, lubię. / Nie, nie lubię. -- muzykę शब्द दोहराने की ज़रूरत नहीं, क्योंकि प्रश्न से पहले ही स्पष्ट है कि बात किसकी हो रही है।'
    note: जैसे *Pyszny?* अकेले कहा जा सकता है, वैसे ही *Tak, lubię.* में यह दोहराने की ज़रूरत नहीं कि बात किसकी हो रही है -- संदर्भ यह बता देता है।
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: मुझे संगीत बहुत पसंद है
    gloss: मुझे संगीत बहुत पसंद है।
    note: Bardzo (बहुत) साधारण पसंद को ज़्यादा ज़ोरदार बना देता है -- bardzo आप पहली ही इकाई से देख रहे हैं।
  pl.a1.unit13.lesson02.teach.wole:
    title: मैं ज़्यादा पसंद करता/करती हूँ
    gloss: मैं ज़्यादा पसंद करता/करती हूँ
    note: इस इकाई की बिल्कुल नई क्रिया woleć (ज़्यादा पसंद करना) -- यहाँ केवल 'मैं' वाला रूप सिखाया गया है, जैसे lubię।
    example_gloss: मुझे चाय ज़्यादा पसंद है।
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: इस इकाई में केवल wolę'
    gloss: 'Woleć (ज़्यादा पसंद करना): wolę (मैं) -- यह पाठ केवल ''मैं'' वाला रूप सिखाता है, जैसे lubię। Wolę kawę. = मुझे कॉफ़ी ज़्यादा पसंद है।'
    note: अभी केवल *woleć* का *ja* (मैं) वाला रूप, ठीक उतना ही दायरा जितना *lubię* को शुरू में मिला था।
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: फिर से कॉफ़ी और चाय
    gloss: 'Wolę + कर्म: kawa बदलकर kawę और herbata बदलकर herbatę हो जाता है -- वही पैटर्न जो आप पहले से जानते हैं।'
    note: 'पहले जैसा ही कर्म रूप का पैटर्न, बस नई क्रिया के साथ: *wolę kawę*, *wolę herbatę*।'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: मुझे कॉफ़ी ज़्यादा पसंद है
    gloss: मुझे कॉफ़ी ज़्यादा पसंद है।
    note: wolę के साथ पसंद का सीधा-सादा कथन।
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: मुझे चाय ज़्यादा पसंद है
    gloss: मुझे चाय ज़्यादा पसंद है।
    note: वही पैटर्न, kawę की जगह herbatę के साथ।
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy का अर्थ 'या'
    gloss: Kawa czy herbata? में czy वही czy नहीं है जो हाँ/नहीं वाले प्रश्न की शुरुआत करता है -- यहाँ यह दो विकल्पों को जोड़ता है, हिंदी के 'या' की तरह। Kawa czy herbata? = कॉफ़ी या चाय?
    note: 'ध्यान दीजिए: *czy* आमतौर पर हाँ/नहीं वाला प्रश्न शुरू करता है, पर इस तरह दो संज्ञाओं के बीच आने पर इसका अर्थ बस "या" होता है।'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: कॉफ़ी या चाय?
    gloss: कॉफ़ी या चाय?
    note: किसी को दो में से एक चुनने का विकल्प देने का छोटा, स्वाभाविक तरीका।
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: मैं भी
    gloss: मैं भी
    note: किसी की अभी कही बात से सहमति जताने का छोटा तरीका।
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też, एक बार फिर
    gloss: Ja też का मतलब है 'मैं भी' -- यह आप दिनचर्या वाले पाठ में पहले सीख चुके हैं (Ja też wstaję o siódmej, 'मैं भी सात बजे उठता/उठती हूँ')।
    note: एक छोटी याद दिलाने वाली बात कि यह वाक्यांश पहले भी आ चुका है।
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? में क्रिया नहीं चाहिए
    gloss: पिछली इकाई के Pyszny? की तरह, छोटे प्रश्न Kawa czy herbata? को भी क्रिया की ज़रूरत नहीं है -- संदर्भ ही काफ़ी है।
    note: '*Pyszny?* जैसा ही ढंग: क्रिया के बिना छोटा प्रश्न, जिसे संदर्भ पूरी तरह साफ़ कर देता है।'
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek पूछता है कि क्या Ewa को संगीत पसंद है
    gloss: क्या तुम्हें संगीत पसंद है?
    note: Marek बातचीत उसी प्रश्न से शुरू करता है जो इस इकाई में अभी सिखाया गया है।
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa को पसंद है और वह पलटकर पूछती है
    gloss: हाँ, मुझे बहुत पसंद है! और तुम्हें?
    note: A ty? (और तुम?) सवाल को वापस Marek की ओर मोड़ देता है, जैसा पिछली इकाइयों में भी देखा था।
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek सहमत होता है और पीने के बारे में पूछता है
    gloss: मुझे भी पसंद है। कॉफ़ी या चाय?
    note: Ja też lubię से Marek बताता है कि उसे भी पसंद है, फिर 'या' वाले नए प्रश्न से विषय बदल देता है।
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa को कॉफ़ी ज़्यादा पसंद है
    gloss: मुझे कॉफ़ी ज़्यादा पसंद है।
    note: Ewa की अपनी पसंद, wolę के साथ -- यह वही कॉफ़ी पीने वाली Ewa है जिससे हम दिनचर्या वाली इकाई में मिले थे।
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek को चाय ज़्यादा पसंद है
    gloss: मुझे चाय ज़्यादा पसंद है।
    note: Marek की अपनी पसंद -- Ewa की पसंद से उलटी।
