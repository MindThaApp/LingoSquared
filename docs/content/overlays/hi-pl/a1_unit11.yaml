teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: चाहना, मैं चाहता/चाहती हूँ
    gloss: चाहना; मैं चाहता/चाहती हूँ
    note: Chcieć क्रिया का मूल रूप (क्रियार्थक संज्ञा) है; chcę 'मैं' वाला रोज़मर्रा का रूप है, जिससे आप बताते हैं कि आप क्या चाहते हैं।
    example_gloss: मैं सिनेमा जाना चाहता/चाहती हूँ।
  pl.a1.unit11.lesson01.teach.chcesz:
    title: तुम चाहते/चाहती हो
    gloss: तुम चाहते/चाहती हो (अनौपचारिक)
    note: Chcesz अनौपचारिक 'तुम' वाला रूप है, जिसका इस्तेमाल masz और jesteś की तरह ही होता है। किसी दोस्त से पूछना हो कि वह क्या चाहता है, तो यही रूप काम आएगा।
    example_gloss: क्या तुम कॉफ़ी लोगे?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: मैं चाहता हूँ, तुम चाहते हो
    gloss: 'Chcę, chcesz -- वही ढाँचा जो masz (mieć) और jesteś (być) में है: chcesz ''तुम'' वाला रूप (द्वितीय पुरुष) है, जिसका इस्तेमाल तब होता है जब आप किसी और से पूछते हैं कि वह क्या चाहता है।'
    note: इस यूनिट में सिर्फ़ "मैं" से काम नहीं चलेगा -- *chcę* (मैं चाहता/चाहती हूँ) और *chcesz* (तुम चाहते/चाहती हो) में वही पुरुष-रूप हैं जो आप *masz* और *jesteś* में सीख चुके हैं, बस एक नई क्रिया पर लागू।
  pl.a1.unit11.lesson01.teach.kino:
    title: सिनेमा
    gloss: सिनेमा / सिनेमाघर
    note: सिनेमा के लिए रोज़ बोला जाने वाला शब्द -- योजनाएँ बनाते समय यह बार-बार आता है।
    example_gloss: यह सिनेमाघर है।
  pl.a1.unit11.lesson01.teach.razem:
    title: साथ में
    gloss: साथ-साथ
    note: Razem खरीदारी के संदर्भ में 'कुल' भी होता है (शायद आपको खरीदारी वाली यूनिट से याद हो) -- यहाँ इसका दूसरा रोज़मर्रा का अर्थ है, 'साथ-साथ'।
    example_gloss: क्या तुम साथ चलना चाहते हो?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: क्या तुम सिनेमा जाना चाहते हो?
    gloss: क्या तुम सिनेमा जाना चाहते हो?
    note: Czy हाँ/ना वाले प्रश्न की शुरुआत करता है; chcesz iść do kina पूछता है कि सामने वाला क्या करना चाहता है -- योजना का प्रस्ताव रखने का मुख्य तरीका।
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: क्या तुम शुक्रवार को साथ सिनेमा जाना चाहते हो?
    gloss: क्या तुम शुक्रवार को साथ सिनेमा जाना चाहते हो?
    note: 'पूरा प्रस्ताव: अभी सीखे प्रश्न में razem (साथ) और w piątek (शुक्रवार को) जुड़ गए हैं।'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: सकना, मैं सकता/सकती हूँ
    gloss: सकना; मैं कर सकता/सकती हूँ
    note: Móc क्रिया का मूल रूप है; mogę 'मैं' वाला रूप है -- शायद आपको पिछली तारीख़ और समय वाली यूनिट का możemy ('हम कर सकते हैं') याद हो; यह वही क्रिया है, बस एकवचन में।
    example_gloss: मैं शुक्रवार को आ सकता/सकती हूँ।
  pl.a1.unit11.lesson02.teach.mozesz:
    title: तुम कर सकते/सकती हो
    gloss: तुम कर सकते/सकती हो (अनौपचारिक)
    note: Możesz अनौपचारिक 'तुम' वाला रूप है, chcesz जैसा ही द्वितीय पुरुष का ढाँचा -- यह पूछने के लिए कि सामने वाला कुछ कर सकता है या नहीं।
    example_gloss: क्या तुम शनिवार को आ सकते हो?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: आना
    gloss: आना
    note: किसी से मिलने आने के लिए क्रिया -- mogę/możesz के साथ स्वाभाविक रूप से जुड़ती है, यह बताने के लिए कि कौन आ सकता है या नहीं आ सकता।
    example_gloss: मैं शुक्रवार को आना चाहता/चाहती हूँ।
  pl.a1.unit11.lesson02.teach.moc_note:
    title: मैं सकता हूँ, तुम सकते हो
    gloss: 'Móc: mogę, możesz -- chcesz वाला ही द्वितीय पुरुष (तुम)। Mogę के साथ क्रिया का मूल रूप जुड़कर बताता है कि आप क्या कर सकते हैं: mogę przyjść (मैं आ सकता/सकती हूँ), mogę iść (मैं जा सकता/सकती हूँ)।'
    note: '*Mogę* के साथ क्रिया का सीधा मूल रूप जुड़कर बताता है कि आप क्या कर सकते हैं -- *mogę przyjść* ("मैं आ सकता/सकती हूँ") और *mogę iść* ("मैं जा सकता/सकती हूँ") दोनों इसी सरल ढाँचे पर चलते हैं।'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: खुशी से
    gloss: खुशी से
    note: किसी योजना को गर्मजोशी और उत्साह से स्वीकार करने का तरीका -- अक्सर tak (हाँ) या bardzo (बहुत) के साथ आता है।
    example_gloss: हाँ, बहुत खुशी से!
  pl.a1.unit11.lesson02.teach.niestety:
    title: दुर्भाग्य से
    gloss: दुर्भाग्य से
    note: किसी योजना को विनम्रता से मना करने का स्वाभाविक नरम शब्द -- इसके बाद लगभग हमेशा nie mogę (मैं नहीं आ सकता/सकती) आता है।
    example_gloss: दुर्भाग्य से, मैं नहीं आ सकता/सकती।
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: शनिवार को
    gloss: 'W + सप्ताह का दिन: पुल्लिंग दिनों (piątek, poniedziałek, czwartek) का अंत नहीं बदलता -- w piątek। स्त्रीलिंग दिनों (sobota, środa, niedziela) को कर्म कारक का अंत -ę मिलता है, जैसे kawa -> kawę -- w sobotę।'
    note: '*w* के बाद हर दिन एक जैसा नहीं चलता -- *sobota* जैसे स्त्रीलिंग दिन *sobotę* बन जाते हैं, वही *-a* -> *-ę* अंत जो आप *kawa* -> *kawę* और *herbata* -> *herbatę* में सीख चुके हैं। *piątek* जैसे पुल्लिंग दिन जस के तस रहते हैं।'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: क्या तुम शनिवार को आ सकते हो?
    gloss: क्या तुम शनिवार को आ सकते हो?
    note: możesz, przyjść और नया w sobotę रूप एक साथ -- किसी दूसरे दिन के बारे में पूछने का पूरा वाक्य।
  pl.a1.unit11.lesson03.teach.moze:
    title: शायद, कैसा रहेगा
    gloss: शायद / कैसा रहेगा
    note: दूसरा विकल्प सुझाने वाला शब्द -- जब पहली योजना न बन पाए और आप कुछ और सुझाना चाहें, तब काम आता है।
    example_gloss: शनिवार कैसा रहेगा?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może और mogę
    gloss: 'Może और mogę दिखने में मिलते-जुलते हैं, पर उनके अर्थ अलग हैं: może (''शायद'') कुछ नया सुझाता है; mogę (क्रिया का ''मैं'' वाला रूप, ''मैं कर सकता/सकती हूँ'') बताता है कि आप क्या कर सकते हैं।'
    note: 'लिखे हुए रूप में इन्हें मिला देना आसान है: *może* ("शायद", यहाँ कुछ सुझाने के लिए) और *mogę* ("मैं कर सकता/सकती हूँ", ''मैं'' वाली क्रिया) वाक्य में अलग-अलग काम करते हैं, भले ही दोनों एक ही मूल से आते हों -- आख़िरी अक्षर पर ध्यान दीजिए।'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: किस समय?
    gloss: किस समय?
    note: दिन तय हो जाने के बाद ठीक समय पूछने का मानक तरीका -- शायद आपको पिछली समय वाली यूनिट का o której याद हो।
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: एवा सिनेमा का प्रस्ताव रखती है
    gloss: एवा मारेक से पूछती है कि क्या वह शुक्रवार को सिनेमा जाना चाहता है।
    note: इस यूनिट का सबसे पहला सिखाया गया प्रश्न, अब असली बातचीत में।
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: मारेक शुक्रवार को नहीं आ सकता
    gloss: मारेक कहता है कि दुर्भाग्य से वह शुक्रवार को नहीं आ सकता।
    note: Niestety मना करने को नरम बनाता है, फिर nie mogę बात साफ़ कह देता है।
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: मारेक शनिवार सुझाता है
    gloss: मारेक पूछता है, शनिवार कैसा रहेगा?
    note: Może मना करके बात खत्म करने के बजाय एक दूसरा विकल्प सामने रखता है।
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: एवा खुशी से मान लेती है
    gloss: 'एवा कहती है: शनिवार? बहुत खुशी से!'
    note: चẽtnie से स्वीकार करने से पहले सुझाए गए दिन को दोहराता है (w sobotę रूप बना रहता है)।
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: एवा समय पूछती है
    gloss: 'एवा पूछती है: किस समय?'
    note: दिन तय हो जाने के बाद तय करने के लिए आख़िरी बात समय है।
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: मारेक समय पक्का करता है
    gloss: 'मारेक कहता है: दोपहर बाद चार बजे।'
    note: बातचीत एक तय समय पर खत्म होती है, पिछली समय और दिनचर्या वाली यूनिटों के घंटे वाले ढाँचे के साथ।
