    example_gloss: आज शुक्रवार है।
  pl.a1.unit03.lesson01.teach.sobota:
    title: शनिवार
    gloss: शनिवार
    note: सप्ताहांत का हिस्सा; *weekend* उधार लिया हुआ शब्द है, जिसे कई पोलिश लोग भी बोलते हैं।
