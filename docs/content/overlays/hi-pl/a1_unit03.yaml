  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: दिन पूछना
    gloss: आज सप्ताह का कौन-सा दिन है?
    note: सीधे पूछने का रूप -- *dzień tygodnia* का शाब्दिक अर्थ "सप्ताह का दिन" है।
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: w/we का अपवाद
    gloss: सोमवार को, गुरुवार को, शुक्रवार को -- पर मंगलवार को (आसान उच्चारण के लिए)।
    note: 'ज़्यादातर दिन "*w* + [दिन]" से "[दिन] को" का अर्थ देते हैं। *Wtorek* असली अपवाद है: पोलिश में *we wtorek* कहते हैं, *w wtorek* नहीं, सिर्फ़ इसलिए कि यह बोलने में आसान है -- यह सचमुच की अनियमितता है, टाइपिंग की ग़लती नहीं।'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: शुक्रवार को सिनेमा जाना है
    gloss: शुक्रवार को सिनेमा जाना है।
    note: '*w* के बाद *piątek* नहीं बदलता -- केवल *środa*, *sobota* और *niedziela* बदलते हैं (A1 में बात सरल रखने के लिए यह इस पाठ में शामिल नहीं है)।'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: जनवरी, फ़रवरी, मार्च
    gloss: जनवरी; फ़रवरी; मार्च
    note: व्याकरण की दृष्टि से *luty* अलग है -- यह सामान्य संज्ञा की बजाय विशेषण की तरह चलता है ("फ़रवरी में" वाला रूप आप इस इकाई में आगे देखेंगे)।
    example_gloss:
    - मेरा जन्मदिन जनवरी में है।
    - फ़रवरी में वारसॉ जाना है।
    - मेरा जन्मदिन मार्च में है।
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: अप्रैल, मई, जून
    gloss: अप्रैल; मई; जून
    note: इस इकाई की कहानी में दोनों तारीख़ों के लिए *maj* ही महीना है।
    example_gloss:
    - अप्रैल में वारसॉ जाना है।
    - मेरा जन्मदिन मई में है।
    - जून में वारसॉ जाना है।
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: जुलाई, अगस्त, सितंबर
    gloss: जुलाई; अगस्त; सितंबर
    note: 'यहाँ भी एक असली अनियमितता है: "सितंबर में" *we wrześniu* है, *w wrześniu* नहीं -- वही आसान उच्चारण वाला *we*, जो आप *wtorek* में देख चुके हैं।'
    example_gloss:
    - जुलाई में मेरी छुट्टी है।
    - अगस्त में वारसॉ जाना है।
    - मेरा जन्मदिन सितंबर में है।
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: अक्टूबर, नवंबर, दिसंबर
    gloss: अक्टूबर; नवंबर; दिसंबर
    note: साल के आख़िरी तीन महीने, जिनसे बारह महीनों का पूरा सेट बनता है।
    example_gloss:
    - अक्टूबर में वारसॉ जाना है।
    - मेरा जन्मदिन नवंबर में है।
    - दिसंबर में मेरी छुट्टी है।
  pl.a1.unit03.lesson02.teach.urodziny:
    title: जन्मदिन
    gloss: जन्मदिन
    note: पोलिश में *urodziny* हमेशा बहुवचन होता है, भले ही एक व्यक्ति के एक जन्मदिन की बात हो -- इसके साथ *są* ("हैं") आता है, *jest* ("है") कभी नहीं। इसी बात का अभ्यास आप इस पाठ में आगे करेंगे।
    example_gloss: मेरा जन्मदिन मई में है।
  pl.a1.unit03.lesson02.teach.kiedy:
    title: कब
    gloss: कब
    note: समय के किसी भी बिंदु के बारे में पूछने वाला प्रश्नवाचक शब्द।
    example_gloss: बैठक कब है?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: किसी का जन्मदिन पूछना
    gloss: आपका जन्मदिन कब है?
    note: '*Są*, *jest* नहीं, बहुवचन *urodziny* के अनुसार -- वही पैटर्न जो *urodziny* कार्ड पर बताया गया था।'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: अपना जन्मदिन बताना
    gloss: मेरा जन्मदिन 10 मई को है।
    note: '*Dziesiątego maja* -- दिन का अंत *-ego* पर और महीने का अंत *-a* पर होता है, और कोई पूर्वसर्ग नहीं आता। पोलिश में किसी ख़ास तारीख़ को बताने का यही मानक तरीका है; पूरे नियम के लिए इसी पाठ का व्याकरण नोट देखिए।'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: बैठक कब है, यह पूछना
    gloss: बैठक कब है?
    note: '*Spotkanie* (बैठक) -- एक शब्द जो आप पाठ 3 के संवाद में फिर देखेंगे।'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: बैठक की तारीख़ बताना
    gloss: बैठक 15 मई को है।
    note: वही *-ego* + *-a* वाला तारीख़ का पैटर्न, जैसा *dziesiątego maja* में है, बस दिन की संख्या अलग है।
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: पोलिश में तारीख़ कैसे बताई जाती है
    gloss: 'तारीख़: दिन का अंत -ego पर, महीने का अंत -a पर (पर फ़रवरी lutego है), कोई पूर्वसर्ग नहीं -- 10 मई, 15 मई।'
    note: इसकी तुलना "शुक्रवार को" (*w piątek*, जिसमें पूर्वसर्ग *w* चाहिए) से कीजिए -- कैलेंडर की किसी ख़ास तारीख़ को बताना अलग है और उसमें कभी कोई पूर्वसर्ग नहीं आता।
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: दोबारा मिलने का सुझाव देना
    gloss: हम फिर कब मिल सकते हैं?
    note: '*Znowu* का अर्थ "फिर से" है -- दोबारा मिलने का समय तय करने की बात शुरू करने का स्वाभाविक तरीका।'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: किसी पुरुष से औपचारिक रूप से पूछना कि शुक्रवार ठीक रहेगा या नहीं
    gloss: क्या शुक्रवार आपके लिए ठीक रहेगा? (पुरुष से, औपचारिक)
    note: '*Panu*, *pan* का संप्रदान कारक रूप है -- *odpowiadać* ("अनुकूल होना") अपनी वस्तु हमेशा संप्रदान कारक में लेता है, कुछ वैसे ही जैसे हिंदी में कहते हैं "शुक्रवार मेरे *लिए* ठीक है"।'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: किसी महिला से औपचारिक रूप से पूछना कि शुक्रवार ठीक रहेगा या नहीं
    gloss: क्या शुक्रवार आपके लिए ठीक रहेगा? (महिला से, औपचारिक)
    note: '*panu* की जगह *pani* लगाने से किसी महिला को औपचारिक रूप से संबोधित किया जाता है -- यहाँ *pani* कर्ता और संप्रदान दोनों में एक-सा रहता है, *pan*/*panu* की तरह नहीं।'
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: दोस्त से अनौपचारिक रूप से पूछना कि शुक्रवार ठीक रहेगा या नहीं
    gloss: क्या शुक्रवार तुम्हारे लिए ठीक रहेगा? (अनौपचारिक)
    note: दोस्त या हमउम्र से बात करते समय *panu*/*pani* की जगह *ci* आता है – यह "तुम" का अनौपचारिक संप्रदान कारक रूप है।
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: यह कहना कि शुक्रवार आपके लिए ठीक है
    gloss: शुक्रवार मेरे लिए ठीक है।
    note: '*Mi* उत्तम पुरुष ("मैं") का संप्रदान कारक रूप है – *panu*/*pani*/*ci* जैसा ही कारक, बस "आप/तुम" की जगह "मेरे" के लिए।'
  pl.a1.unit03.lesson03.teach.data:
    title: तारीख़
    gloss: तारीख़ (कैलेंडर की)
    note: इस शब्द का रूप और उच्चारण याद रखना आसान है; यह कैलेंडर की तारीख़ के लिए आता है।
    example_gloss: वह कौन-सी तारीख़ होगी?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: पूछना कि कौन-सी तारीख़ होगी
    gloss: वह कौन-सी तारीख़ होगी?
    note: जब दो लोग सप्ताह का दिन तय कर चुके हों पर सटीक तारीख़ अभी तय न हुई हो, तब यह स्वाभाविक अगला सवाल है।
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa फिर से मिलने का सुझाव देती है
    gloss: Ewa, Marek से पूछती है कि वे दोबारा कब मिल सकते हैं।
    note: यह इस पाठ का शुरुआती सवाल ही है, ज्यों का त्यों।
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek औपचारिक रूप से शुक्रवार का प्रस्ताव रखता है
    gloss: Marek औपचारिक ढंग से Ewa से पूछता है कि क्या शुक्रवार उनके लिए ठीक रहेगा।
    note: Ewa को *pani* कहकर संबोधित किया गया है; पहली इकाई से चला आ रहा औपचारिक रूप यहाँ भी जारी है।
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa सहमत होती है और तारीख़ पूछती है
    gloss: Ewa कहती है कि शुक्रवार उसके लिए ठीक है, फिर पूछती है कि सटीक तारीख़ क्या होगी।
    note: पहली इकाई में सीखा गया *Tak* ("हाँ") सटीक तारीख़ पूछने से पहले Ewa की सहमति की शुरुआत करता है।
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek तारीख़ बताता है
    gloss: Marek कहता है, 15 मई।
    note: यहाँ के दोनों शब्द इस इकाई के दूसरे पाठ में पहले ही सिखाए जा चुके हैं।
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa पुष्टि करती है और विदा लेती है
    gloss: Ewa कहती है, बहुत बढ़िया, और 15 मई को मिलने की बात कहकर विदा लेती है।
    note: '*Do zobaczenia* पहली इकाई की विदाई का ही वाक्यांश है, जो यहाँ एक खास तारीख़ के साथ जुड़ा है।'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek बातचीत समाप्त करता है
    gloss: Marek भी बदले में विदा कहता है।
    note: सबसे छोटा संभव समापन – बस विदाई का वाक्यांश।
