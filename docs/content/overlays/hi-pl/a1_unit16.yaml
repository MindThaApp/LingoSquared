teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: दर्द होता है
    gloss: 'Boleć (दर्द करना), वर्तमान काल: boli (वह) और bolą (वे)। Głowa mnie boli का अर्थ है ''मेरे सिर में दर्द है'' -- शब्दशः ''सिर मुझे दर्द करता है।'''
    note: दर्द के लिए *boleć* के वर्तमान काल के बस यही दो रूप इस्तेमाल होते हैं -- शरीर का अंग कर्ता होता है और *mnie* बताता है कि वह किसका है, इसलिए यहाँ 'मैं दर्द करता हूँ' जैसा कोई रूप सीखना नहीं पड़ता।
  pl.a1.unit16.lesson01.teach.glowa:
    title: सिर
    gloss: सिर
    note: दर्द की शिकायत में सबसे आम शब्द।
    example_gloss: मेरे सिर में दर्द है।
  pl.a1.unit16.lesson01.teach.gardlo:
    title: गला
    gloss: गला
    note: सर्दी या गले की खराश बताने के लिए उपयोगी।
    example_gloss: मेरा गला दर्द कर रहा है।
  pl.a1.unit16.lesson01.teach.brzuch:
    title: पेट
    gloss: पेट
    note: ज़्यादा खाने के बाद, या जब कुछ खाना माफ़िक न आए, तब काम आता है।
    example_gloss: मेरे पेट में दर्द है।
  pl.a1.unit16.lesson01.teach.zeby:
    title: दाँत
    gloss: दाँत
    note: यहाँ यह हमेशा बहुवचन में आता है, ठीक वैसे ही जैसे पोलिश बोलने वाले कहते हैं -- इसीलिए इसके साथ *boli* नहीं, *bolą* आता है।
    example_gloss: मेरे दाँतों में दर्द है।
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: तुम्हें क्या दर्द है?
    gloss: तुम्हें क्या दर्द है?
    note: जिसकी तबीयत ठीक न लगे, उससे पूछने का स्वाभाविक सवाल।
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: आप कैसा महसूस कर रहे हैं?
    gloss: 'Czuć się (महसूस करना): czuję się (मैं), czujesz się (तुम)। तुम कैसा महसूस कर रहे हो?'
    note: फ़िलहाल बस दो रूप -- अपने लिए *czuję* और किसी और से पूछने के लिए *czujesz*।
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: अच्छा और बुरा
    gloss: मैं अच्छा महसूस करता/करती हूँ। मुझे बुरा लग रहा है। -- dobrze आप पहले से जानते हैं; źle उसका उलटा है।
    note: वही *dobrze* जो आप पहले पाठ से इस्तेमाल कर रहे हैं, अब अपने उलटे शब्द के साथ।
  pl.a1.unit16.lesson02.teach.zle:
    title: बुरी तरह
    gloss: खराब
    note: यह बताने के लिए ज़रूरी शब्द कि आपकी तबीयत ठीक नहीं है।
    example_gloss: मुझे ठीक नहीं लग रहा।
  pl.a1.unit16.lesson02.teach.goraczka:
    title: बुखार
    gloss: बुखार
    note: नाम लेकर बताने लायक एक आम, बुनियादी लक्षण।
    example_gloss: मुझे बुखार है।
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ma -- फिर से
    gloss: Ewa, ma -- यह नाम और क्रिया mieć (होना/पास होना) का यह रूप आप पिछले पाठों से जानते हैं (Mam, masz, ma)।
    note: इस पाठ में दोनों का उपयोग होने से पहले एक छोटी याद-दिहानी।
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: बीमार
    gloss: बीमार (पुरुष) / बीमार (स्त्री)
    note: यह वही -y/-a वाला ढर्रा है जो आप *młodszy/starsza* के साथ सीख चुके हैं -- पुरुष के लिए *chory*, स्त्री के लिए *chora*।
    example_gloss:
    - वह बीमार है।
    - वह बीमार है।
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa की तबीयत ठीक नहीं है
    gloss: मुझे बुरा लग रहा है। मुझे बुखार है।
    note: Ewa अपने लक्षण बता रही है -- यही बात वह इस इकाई के संवाद में फिर कहती है।
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, फिर से
    gloss: Marek -- यह नाम आप पिछले पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit16.lesson03.teach.i_recap:
    title: और, फिर से
    gloss: I -- यह शब्द आप पिछले पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: कृपया और पानी, फिर से
    gloss: Proszę और wodę -- ये दोनों शब्द आप पिछले पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: धन्यवाद, फिर से
    gloss: Dziękuję -- यह शब्द आप पिछले पाठों से जानते हैं।
    note: इस पाठ के संवाद से पहले एक छोटी याद-दिहानी।
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: आराम करना
    gloss: आराम करना
    note: '*Proszę* के साथ वैसे ही इस्तेमाल होता है जैसे आप सीधे जाने या किसी ओर मुड़ने के लिए कहना सीख चुके हैं -- *Proszę* + क्रिया का मूल रूप, आज्ञार्थ रूप की ज़रूरत नहीं।'
    example_gloss: कृपया आराम कीजिए।
  pl.a1.unit16.lesson03.teach.pic:
    title: पीना
    gloss: पीना
    note: क्रिया का एक और मूल रूप, जो *Proszę* के बाद इसी तरह आता है।
    example_gloss: कृपया पानी पीजिए।
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek पूछता है कि Ewa कैसा महसूस कर रही है
    gloss: Ewa, तुम कैसा महसूस कर रही हो?
    note: Marek को लगता है कि कुछ गड़बड़ है और वह सीधे पूछ लेता है।
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa अपने लक्षण बताती है
    gloss: मुझे बुरा लग रहा है। मेरे गले में दर्द है और मुझे बुखार है।
    note: Ewa साफ़ तौर पर दो लक्षण बताती है -- वही बातें जो वह इस इकाई में पहले भी बता चुकी है।
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek सीधी-सादी सलाह देता है
    gloss: कृपया आराम करें और पानी पिएँ।
    note: सीधी-सादी सलाह, कोई चिकित्सीय निर्देश नहीं -- बस आम समझ की बात।
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa, Marek को धन्यवाद देती है
    gloss: ठीक है, धन्यवाद, Marek।
    note: बातचीत का एक सरल, जाना-पहचाना समापन।
