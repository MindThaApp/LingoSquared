teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'तीन आम शौक़ वाली क्रियाएँ: *czytać* (पढ़ना), *uprawiać sport* (खेल-कूद करना) और *gotować* (खाना पकाना)।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*Wolny czas* शौक़ों के बारे में बात करने का मुख्य वाक्यांश है। विशेषण *wolny* (खाली) पुल्लिंग संज्ञा *czas* के अनुरूप रूप लेता है; *w wolnym czasie* में दोनों अधिकरण कारक में हैं।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Lubię* (मुझे पसंद है) के बाद क्रिया का मूल रूप आता है: *lubię czytać*। *W wolnym czasie* में *w* + अधिकरण कारक है।'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'तीन और शौक़: *słuchać muzyki* (संगीत सुनना), *rysować* (चित्र बनाना) और *grać w gry* (गेम खेलना)।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: '*Słuchać* के साथ हमेशा संबंध कारक आता है: *słucham muzyki*, *muzyka* नहीं।'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*Z przyjaciółmi* (दोस्तों के साथ) में *z* + बहुवचन करण कारक है।'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: 'आवृत्ति बताने वाले चार मुख्य क्रियाविशेषण: *zawsze*, *często*, *czasami*, *nigdy*। ये कभी रूप नहीं बदलते, और *nigdy* के साथ क्रिया से पहले *nie* लगाना ज़रूरी है: *Nigdy nie gram.*'
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*Co tydzień* और *co weekend* दोनों का अर्थ है ''हर ...''; *co* के बाद कर्म कारक आता है और यह कभी नहीं बदलता - अगला कार्ड देखिए।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता हूँ।
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + कर्म कारक
    gloss: '*Co* + कर्म कारक का अर्थ है ''हर'': हर हफ़्ते, हर सप्ताहांत, हर महीने।'
    note: '''हर'' के लिए *co* एक ही अपरिवर्तनीय शब्द है, चाहे संज्ञा कोई भी हो। *tydzień*, *weekend* और *miesiąc* जैसी पुल्लिंग निर्जीव संज्ञाओं का कर्ता कारक और कर्म कारक रूप एक जैसा दिखता है।'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: खाली समय के बारे में पूछना
    gloss: आप ख़ाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa शौक़ों की बात छेड़ती है
    gloss: 'Ewa: हम अक्सर साथ टहलते हैं। और खाली समय में तुम और क्या करते हो, Marek?'
    note: '*Spacerujemy*, *spacerować* का *my* (हम) वाला रूप है; *Marku* संबोधन कारक है, जो किसी को सीधे पुकारते समय इस्तेमाल होता है।'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Marek के शौक़
    gloss: 'Marek: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर खेल-कूद करता हूँ।'
    note: '*Także w domu* (घर पर भी) से पता चलता है कि Marek शौक़ से भी खाना बनाता है, सिर्फ़ रेस्तराँ की नौकरी में नहीं; *w domu* अधिकरण कारक में है।'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa हैरान है
    gloss: 'Ewa: तुम घर पर भी खाना बनाते हो? तुम तो पहले ही दिन भर काम पर खाना बनाते हो!'
    note: '*Cały dzień* (पूरा दिन) से ज़ोर पड़ता है कि Marek काम पर पहले ही कितना खाना बनाता है; *przecież* में ''आख़िर'' जैसा भाव जुड़ता है।'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek समझाता है
    gloss: 'Marek: हाँ, पर खाना बनाने से मुझे आराम मिलता है। और तुम्हें क्या करना पसंद है?'
    note: '*Gotowanie mnie odpręża* का शाब्दिक अर्थ है ''खाना बनाना मुझे आराम देता है'': पोलिश में अक्सर गतिविधि ही कर्ता बन जाती है और *mnie* (मुझे) कर्म कारक में आता है।'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Ewa के शौक़
    gloss: 'Ewa: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: पाठ 1 और 2 की दो शौक़ वाली क्रियाएँ *i* (और) से एक ही वाक्य में जुड़ी हैं।
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek गेम खेलने के बारे में पूछता है
    gloss: 'Marek: क्या तुम गेम भी खेलती हो?'
    note: पाठ 2 के *grać w gry* वाला एक छोटा हाँ/नहीं प्रश्न; *też* का अर्थ है 'भी'।
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa जवाब देती है
    gloss: 'Ewa: नहीं, मैं कभी गेम नहीं खेलती। पर कभी-कभी चित्र बनाती हूँ!'
    note: 'पाठ 3 के *nigdy* (कभी नहीं) और *czasami* (कभी-कभी) एक ही उत्तर में आमने-सामने हैं। दोहरे निषेध पर ध्यान दीजिए: *nigdy nie gram*।'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: शौक़ों की तुलना
    gloss: Marek और मैं अक्सर साथ टहलते हैं। पर हमारे और भी शौक़ हैं। Marek को खाना बनाना पसंद है, घर पर भी, और वह अक्सर खेल-कूद करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। कभी-कभी मैं चित्र बनाती हूँ, पर कभी गेम नहीं खेलती। आपको खाली समय में क्या करना पसंद है?
    note: Ewa का संदेश पाठ 4 की बातें दोहराता है और पाठक से इस इकाई का मुख्य प्रश्न पूछकर खत्म होता है।
    glosses:
      spacerujemy: टहलना
      często: अक्सर
      razem: साथ में
      inne: दूसरे
      gotować: खाना बनाता है
      lubi: पसंद है
      domu: घर पर
      uprawia: कसरत करता है
      czytać: पढ़ना
      słucham: सुनना
      muzyki: संगीत
      rysuję: चित्र बनाती हूँ
      czasami: कभी-कभी
      gram: वीडियो गेम खेलना
      nigdy: कभी नहीं
      wolnym: खाली
      czasie: समय
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek सप्ताहांत के बारे में पूछता है
    gloss: 'Marek: इस सप्ताहांत तुम क्या कर रही हो?'
    note: '*W ten weekend* (इस सप्ताहांत) में समय बताने के लिए *w* + कर्म कारक आया है।'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa असमंजस में है
    gloss: 'Ewa: अभी पता नहीं। मुझे पढ़ना पसंद है, पर बाहर भी जाना चाहती हूँ।'
    note: '*Wyjść na dwór* (बाहर जाना) घर से निकलने की इच्छा बताने का आम तरीका है; *chcę* + क्रिया का मूल रूप का अर्थ है ''मैं चाहता/चाहती हूँ''।'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek योजना सुझाता है
    gloss: 'Marek: साथ टहलने चलें? फिर मैं हमारे लिए कुछ बना दूँगा।'
    note: '*Potem* (बाद में) क्रम बताने वाला शब्द है; *ugotuję* पूर्ण रूप में है क्योंकि खाना बनाना एक पूरा हुआ परिणाम है।'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa मान जाती है
    gloss: 'Ewa: अच्छा विचार! मुझे टहलना भी पसंद है और खाना बनाना भी।'
    note: '*Lubię i ..., i ...* (''दोनों ... और ...'') दिखाता है कि Ewa को दो चीज़ें बराबर पसंद हैं, एक दूसरी से ज़्यादा नहीं।'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek पक्का करता है
    gloss: 'Marek: बढ़िया। तो शनिवार को मिलते हैं!'
    note: योजना पक्की करने वाली दोस्ताना विदाई; *w sobotę* में सप्ताह के दिन के लिए *w* + कर्म कारक है।
