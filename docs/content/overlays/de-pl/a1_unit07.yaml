teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Banane
    gloss: Banane
    note: Ein verbreitetes Obst, das auf jedem Markt und in jedem Laden stückweise oder nach Gewicht verkauft wird.
    example_gloss: Das ist eine Banane.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Tomate, Gurke
    gloss: Tomate; Gurke
    note: Beide sind maskulin und unbelebt. Ihre Genitiv-Plural-Formen (pomidorów, ogórków) brauchen Sie später in dieser Lektion, wenn Sie sie kiloweise kaufen.
    example_gloss:
    - Das ist eine Tomate.
    - Das ist eine Gurke.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Kartoffel, Zwiebel
    gloss: Kartoffel; Zwiebel
    note: Ziemniak ist maskulin und unbelebt (gleiche Genitiv-Plural-Endung -ów wie banan und pomidor); cebula ist feminin.
    example_gloss:
    - Das ist eine Kartoffel.
    - Das ist eine Zwiebel.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Billig, teuer
    gloss: billig; teuer
    note: '*Tanio* und *drogo* sind Adverbien, und im Polnischen stehen sie direkt bei *kosztować* („kosten“): *To kosztuje drogo* heißt wörtlich „Das kostet teuer“, also „Das ist teuer“.'
    example_gloss:
    - Sehr billig!
    - Sehr teuer!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'Kosten: kosztuje, kosztują'
    gloss: 'kosten: es kostet (eine Sache), sie kosten (mehrere) – Die Banane ist billig. Die Bananen sind billig.'
    note: '*Kosztować* heißt „kosten“. Verwenden Sie *kosztuje* für eine Sache und *kosztują* für mehrere, genau wie *jest*/*są* („ist“/„sind“), nur eben für Preise. Auf die richtige Form kommt es an: Ein Marktverkäufer versteht Sie in beiden Fällen, aber *banany kosztują* sagen Muttersprachler tatsächlich.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: Wie viel kostet eine Banane?
    gloss: Wie viel kostet eine Banane?
    note: 'Die alltägliche Frage zu Beginn einer Preisverhandlung: *Ile* („wie viel“) plus *kosztuje* im Singular, weil nach einer einzelnen Banane gefragt wird.'
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Grapefruit
    gloss: Grapefruit
    note: Maskulin und unbelebt wie pomidor und ziemniak; nach proszę o ändert sich die Endung nicht.
    example_gloss: Das ist eine Grapefruit.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Mandarine, Orange
    gloss: Mandarine; Orange
    note: Beide sind feminin, wie kawa und herbata in der Lektion zum Essen. Im Akkusativ wird -a zu -ę, aber in dieser Lektion brauchen Sie nur die Grundform.
    example_gloss:
    - Das ist eine Mandarine.
    - Das ist eine Orange.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Ein Kilo, ein halbes Kilo
    gloss: ein Kilo; ein halbes Kilo
    note: '*Kilo* ändert seine Endung nie, egal was Sie wiegen oder wie viel Sie verlangen. Es ist das Nomen nach *kilo*, das sich ändert, wie die Grammatikanmerkung dieser Lektion erklärt.'
    example_gloss:
    - Ein Kilo Tomaten, bitte.
    - Ein halbes Kilo Bananen, bitte.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Ich hätte gern (bitte)
    gloss: ich hätte gern / geben Sie mir bitte
    note: '*Poproszę* ist eine etwas gepflegtere, alltägliche Alternative zu *proszę o* aus der Lektion zum Essen. Beide bedeuten etwa „ich hätte gern“, und man wechselt frei zwischen ihnen. Auf *poproszę* folgt direkt das Gewünschte, ohne *o*.'
    example_gloss: Ich hätte gern eine Grapefruit.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'Nach „kilo“: die Endung -ów'
    gloss: 'Genitiv Plural nach „kilo“: banan → bananów (von Bananen), pomidor → pomidorów (von Tomaten), ziemniak → ziemniaków (von Kartoffeln).'
    note: 'Wenn Sie eine Menge nach Gewicht nennen (*kilo*, *pół kilo*), steht das folgende Nomen im Genitiv Plural. Bei diesen drei regelmäßigen maskulinen Nomen hängt man einfach *-ów* an: *banan* wird zu *bananów*, *pomidor* zu *pomidorów*, *ziemniak* zu *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Ein Kilo Tomaten, bitte
    gloss: Ein Kilo Tomaten, bitte.
    note: 'Hier wenden Sie das Muster mit -ów in einer echten Bestellung an: pomidor wird nach kilo zu pomidorów.'
  pl.a1.unit07.lesson03.teach.dla:
    title: Für
    gloss: für
    note: 'Eine einfache Präposition mit der Bedeutung „für“. Ein Verkäufer fragt damit höflich: *Co dla pani?* (wörtlich „Was für Sie?“), was die Kundin möchte.'
    example_gloss: Das ist für Sie.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Frisch, sehr
    gloss: frisch; sehr
    note: 'Zwei alltägliche Wörter, die ein Marktverkäufer ständig benutzt: um zu loben, wie frisch etwas ist, oder wie billig bzw. teuer.'
    example_gloss:
    - Die Tomaten sind frisch.
    - Sehr billig!
  pl.a1.unit07.lesson03.teach.trochę:
    title: Ein bisschen
    gloss: ein bisschen / ein wenig
    note: 'Es mildert eine Beschwerde höflich ab: trochę drogo („ein bisschen teuer“) klingt beim freundlichen Feilschen viel natürlicher als nur drogo.'
    example_gloss: Ein bisschen teuer.
  pl.a1.unit07.lesson03.teach.razem:
    title: Insgesamt / zusammen
    gloss: insgesamt / zusammen
    note: Das sagt ein Verkäufer, kurz bevor er den Endbetrag nennt.
    example_gloss: Zusammen zehn Złoty.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: Was möchten Sie?
    gloss: Was möchten Sie?
    note: Wörtlich „Was für Sie (formell)?“ – die natürliche Eröffnungsfrage eines Verkäufers an die Kundschaft.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: Der Verkäufer begrüßt Ewa
    gloss: Der Verkäufer grüßt und fragt Ewa, was sie möchte.
    note: Dzień dobry kennen Sie schon aus den Begrüßungen in Lektion 1.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa fragt nach Bananen
    gloss: Ewa fragt, wie viel die Bananen kosten.
    note: Kosztują – die Pluralform aus der Grammatikanmerkung dieser Lektion, denn es wird nach Bananen als Gruppe gefragt.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: Der Verkäufer nennt den Preis
    gloss: Der Verkäufer sagt, dass das Kilo fünf Złoty kostet und dass die Bananen sehr frisch sind.
    note: 'Eine natürliche verkürzte Preisangabe: „[Preis] kilo“ nennt ein polnischer Verkäufer den Kilopreis, ein eigenes Wort für „pro“ ist nicht nötig.'
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Ewa bestellt Bananen
    gloss: Ewa sagt „gut“ und bittet um ein Kilo Bananen.
    note: Poproszę mit kilo + bananów – genau das Muster aus der Grammatikanmerkung von Lektion 2.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: Der Verkäufer erwähnt Tomaten
    gloss: Der Verkäufer fragt auch nach Tomaten und sagt, dass das Kilo acht Złoty kostet.
    note: Dasselbe verkürzte Preismuster wie in Zeile 3, jetzt für eine andere Ware.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Ewa feilscht freundlich und bestellt
    gloss: Ewa sagt, es sei ein bisschen teuer, aber sie nehme ein halbes Kilo.
    note: Trochę drogo mildert die Beschwerde – Ewa kauft trotzdem, nur eine kleinere Menge.
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: Der Verkäufer nennt den Gesamtpreis
    gloss: 'Der Verkäufer sagt „Bitte sehr“ und nennt den Gesamtpreis: neun Złoty.'
    note: 5 złotych für die Bananen plus 4 złotych für ein halbes Kilo Tomaten – zusammen neun złotych, passend zu allen zuvor in der Szene genannten Preisen.
