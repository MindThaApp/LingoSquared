teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Zwierzę* ist das allgemeine Wort für „Tier“; *zwierzak* ist das alltägliche Wort für „Haustier“.'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Ewa hat einen Hund.
    - Tomek hat eine Katze.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: Dasselbe Fragemuster *Masz ...?* kennen Sie schon aus früheren Lektionen; *masz* ist die *ty*-Form von *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: '*Nie mam* + Genitiv verneint das, was man nicht hat: *zwierzaka*. Siehe die Grammatikanmerkung.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + Genitiv
    gloss: 'Nach *nie mam* steht das Objekt im Genitiv: *Nie mam czasu* (Ich habe keine Zeit) und hier *Nie mam zwierzaka* (Ich habe kein Haustier).'
    note: Das Muster *Nie mam czasu* kennen Sie schon; nur das Nomen ist neu. Maskuline belebte Nomen wie *zwierzak* sehen im Akkusativ und im Genitiv gleich aus, feminine Nomen zeigen die Veränderung (*Mam rybę* wird zu *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*Wyprowadzać na spacer* ist die feste Wendung für „ein Tier ausführen“; das Verb ist imperfektiv, weil es sich um eine Gewohnheit handelt. Siehe die Grammatikanmerkung.'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Imperfektiv für Gewohnheiten
    gloss: '*Wyprowadzać* (imperfektiv) beschreibt eine Gewohnheit: *Codziennie wyprowadzam psa.* Das perfektive *wyprowadzić* steht für einen einzelnen, abgeschlossenen Spaziergang.'
    note: 'Aspektpaare: Das Imperfektiv (*wyprowadzać*) steht für etwas Wiederholtes, das Perfektiv (*wyprowadzić*) für eine einmalige, abgeschlossene Handlung.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Tomek spielt mit seiner Katze.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: Verbindet *wyprowadzać na spacer* mit *codziennie* (jeden Tag); das Objekt *psa* steht im Akkusativ.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: '*Karmić* (füttern) verlangt den Akkusativ des Tieres: *karmię kota*. Hier kommt *codziennie* dazu.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Plural: pies, psy'
    gloss: 'Plural: *pies* wird zu *psy*, *kot* zu *koty*, *ryba* zu *ryby*, *ptak* zu *ptaki*. Die meisten Plurale enden auf *-y*, nach k und g auf *-i*.'
    note: Das regelmäßige polnische Pluralmuster, hier erstmals mit Tiernamen als Beispielen eingeführt.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Marek liebt Hunde.
    - Kasia liebt Katzen.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: '*Kocham* ist die *ja*-Form von *kochać*; das Objekt *zwierzęta* steht im Akkusativ Plural.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia liebt Katzen, hat aber kein Haustier
    gloss: Kasia liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek fragt nach einem Haustier
    gloss: 'Marek: Hast du ein Haustier, Ewa?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa hat einen Hund
    gloss: 'Ewa: Ja, ich habe einen Hund.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek fragt, wie er aussieht
    gloss: 'Marek: Wie sieht er aus?'
    note: Die Frage *Jak wygląda ...?* kennen Sie aus einer früheren Lektion, hier bezieht sie sich auf ein Tier; *on* kann sich auf einen Hund beziehen.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa beschreibt ihren Hund
    gloss: 'Ewa: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On und ona bei Tieren
    gloss: 'Tiere haben ein grammatisches Geschlecht: *on* (er) für *pies* und *kot*, *ona* (sie) für *ryba*. Diese Pronomen können sich auf ein Tier beziehen, nicht nur auf eine Person.'
    note: 'Das Pronomen richtet sich nach dem Geschlecht des Nomens: *pies* und *ptak* haben *on*, *ryba* hat *ona*, und *zwierzę* hat *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek fragt nach den Spaziergängen
    gloss: 'Marek: Gehst du jeden Tag mit ihm spazieren?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa beschreibt ihren Tagesablauf
    gloss: 'Ewa: Ja, ich gehe jeden Tag mit ihm spazieren und füttere ihn.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia und Tomek über Tiere
    gloss: 'Marek und Kasia lieben beide Tiere, aber keiner von beiden hat ein Haustier. Marek liebt Hunde und Kasia liebt Katzen. Tomek hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und füttert sie jeden Tag. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      kochają: lieben
      oboje: beide
      zwierzęta: Tiere
      zwierzaka: Haustier
      psy: Hunde
      koty: Katzen
      kota: Katze
      bawi: spielt
      daje: gibt
      co: jeder
      jeść: Futter
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek spielt oft mit seiner Katze
    gloss: Tomek spielt oft mit seiner Katze.
    note: '*Bawić się z* (spielen mit) verlangt den Instrumental: *z kotem*. *Często* ist das Häufigkeitsadverb für „oft“.'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa fragt Nina
    gloss: 'Ewa: Nina, hast du auch ein Haustier?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*Ma na imię* (heißt) ist dieselbe Wendung, mit der man früher einen Namen genannt hat.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek reagiert
    gloss: 'Marek: Wie schön! Was machst du jeden Tag mit ihm?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek liebt auch Vögel
    gloss: 'Marek: Ich liebe Vögel auch.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa beendet das Gespräch
    gloss: 'Ewa: Schön, dass wir drei Tiere lieben!'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
