teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: Haus, ist, hat – noch einmal
    gloss: Dom, jest, ma, Marek, Ewa – diese Wörter kennen Sie schon aus früheren Lektionen, z. B. 'Dom jest tam' (Das Haus ist dort).
    note: Eine kurze Erinnerung, bevor diese Lektion die Wörter nutzt, um über Ihr Zuhause zu sprechen.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Wohnung
    gloss: Wohnung
    note: Eine Wohnung, nicht ein ganzes Haus.
    example_gloss: Ewa hat eine Wohnung.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Groß
    gloss: Das Haus ist groß. – '*duży*' passt zu maskulinen Nomen, wie '*dom*'.
    note: Zum ersten Mal in diesem Kurs beschreibt ein Wort die Größe – vorerst gilt es nur für '*dom*'.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Mareks Zuhause
    gloss: Marek hat ein Haus. Das Haus ist groß.
    note: Die Tatsache, auf der diese ganze Einheit bei Marek aufbaut.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Ewas Zuhause
    gloss: Ewa hat eine Wohnung.
    note: Die Tatsache, auf der diese ganze Einheit bei Ewa aufbaut.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Zimmer
    gloss: Zimmer
    note: Ein allgemeines Wort für jeden Raum in einer Wohnung.
    example_gloss: Wo ist das Zimmer?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: Wie viele Zimmer?
    gloss: Wie viele Zimmer hast du? Ich habe zwei Zimmer. – „Ile“, die Zahlen und „mam“/„masz“ kennen Sie schon aus früheren Lektionen; '*pokoi*' und '*pokoje*' sind Formen des Wortes '*pokój*'.
    note: '''*Pokoi*'' steht direkt nach ''*Ile*''; ''*pokoje*'' steht direkt nach ''*dwa*'', ''*trzy*'' oder ''*cztery*'' (zwei, drei, vier).'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: Wie viele Zimmer haben Sie?
    gloss: Wie viele Zimmer hast du?
    note: Eine natürliche Frage über jemandes Zuhause.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: Ich habe zwei Zimmer
    gloss: Ich habe zwei Zimmer.
    note: Eine natürliche Antwort auf die obige Frage.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Küche
    gloss: Küche
    note: Einer der häufigsten Räume in einer Wohnung.
    example_gloss: Die Küche ist klein.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Klein
    gloss: Die Küche ist klein. – '*mała*' passt zu femininen Nomen, wie '*kuchnia*'.
    note: Dies ist ein anderes Wort als '*duży*' (groß) – vorerst gilt es nur für '*kuchnia*'.
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Schlafzimmer
    gloss: Schlafzimmer
    note: Der Raum, in dem man schläft.
    example_gloss: Wo ist das Schlafzimmer?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Badezimmer
    gloss: Badezimmer
    note: Der Raum mit Dusche und Toilette.
    example_gloss: Wo ist das Badezimmer?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: Wo, dort – noch einmal
    gloss: Gdzie, tam – diese Wörter kennen Sie schon aus früheren Lektionen, z. B. 'Bank jest tam' (Die Bank ist dort).
    note: Eine kurze Erinnerung, bevor diese Lektion die Wörter nutzt, um über Zimmer zu sprechen.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: Im Zimmer, in der Küche ...
    gloss: 'W + Zimmer, Küche, Schlafzimmer, Badezimmer: w pokoju, w kuchni, w sypialni, w łazience – dasselbe Muster wie w szkole (in der Schule) oder w biurze (im Büro).'
    note: Dieselbe Idee wie bei den Wörtern für Arbeitsorte, die Sie schon gelernt haben – die Endung ändert sich ein wenig, um „in“ diesem Raum auszudrücken.
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: Wo ist das Badezimmer?
    gloss: Wo ist das Badezimmer? Das Badezimmer ist dort.
    note: Ein natürlicher Austausch, um ein Zimmer in einer fremden Wohnung zu finden.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: Die Küche ist klein
    gloss: Die Küche ist klein.
    note: Das Wort für die Größe aus dem frühen Teil dieser Lektion wird wieder verwendet.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: Ja, und, sind – noch einmal
    gloss: Tak, i, są, A, ja, jeden – diese Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Kühlschrank
    gloss: Kühlschrank
    note: Ein gängiges Küchengerät.
    example_gloss: In der Küche steht ein Kühlschrank.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Backofen
    gloss: Backofen
    note: Ein weiteres gängiges Küchengerät.
    example_gloss: In der Küche steht ein Backofen.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek beschreibt sein Haus
    gloss: Ich habe ein Haus. Das Haus ist groß.
    note: Marek eröffnet das Gespräch, indem er sein Zuhause beschreibt.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa fragt nach den Zimmern
    gloss: Wie viele Zimmer hast du?
    note: Ewa stellt eine natürliche Anschlussfrage.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek antwortet
    gloss: Ich habe zwei Zimmer. Im Haus gibt es eine Küche, ein Schlafzimmer und ein Badezimmer.
    note: Marek nennt die Zahl seiner Zimmer und zählt die Räume in seinem Haus auf.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa beschreibt ihr Zuhause
    gloss: Und ich habe eine Wohnung. Ich habe ein Zimmer.
    note: Ewa beschreibt nun ihr eigenes, kleineres Zuhause.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa fragt nach der Küche
    gloss: Ist die Küche klein?
    note: Ewa stellt Marek eine Anschlussfrage zu seiner Küche.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek antwortet
    gloss: Ja, die Küche ist klein. In der Küche stehen ein Kühlschrank und ein Backofen.
    note: Marek bestätigt die Größe der Küche und nennt zwei Dinge darin.
