    - Ob sie einen Tisch möchte.
    - Er fragt nichts.
    accepted_answers:
    - value: Ob sie auch ein Programmheft möchte.
      status: correct
    feedback: Jan fragt *czy chce pani też program?* *Program* ist maskulin, aber keine Person, daher ist der Akkusativ gleich dem Nominativ.
