teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: Gehen, hingelangen
    gloss: gehen; hingelangen / ankommen
    note: Zwei eng verwandte Bewegungsverben – iść ist das allgemeine „gehen/zu Fuß gehen“, dojść bedeutet speziell „ein Ziel erreichen“ und steht in dem Fragemuster, das diese Lektion vermittelt.
    example_gloss:
    - Bitte gehen Sie geradeaus.
    - Wie komme ich zur Bank?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Geradeaus
    gloss: geradeaus
    note: Das grundlegendste Richtungswort – steht direkt nach iść für „geradeaus gehen“.
    example_gloss: Bitte gehen Sie geradeaus zum Park.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Dort, dann
    gloss: dort; dann
    note: Tam zeigt einen Ort an; potem ordnet Schritte nacheinander („erst dies, dann das“) – beides unverzichtbar, um eine Wegbeschreibung zu verbinden.
    example_gloss:
    - Die Bank ist dort.
    - Dann gehen Sie bitte geradeaus.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Bitte + Infinitiv – Proszę (bitte) plus ein Verb im Infinitiv (Grundform) ist die alltägliche höfliche Art, eine Richtung anzugeben, ohne eigene Befehlsform: Bitte gehen Sie geradeaus.'
    note: '*Proszę* plus ein Verb im Infinitiv ist die höfliche Art, im Polnischen jemanden zu etwas aufzufordern – *Proszę iść prosto* („Bitte gehen Sie geradeaus“). Mit Fremden ist das die sichere, höfliche Wahl; Sie brauchen also keine eigene „Befehlsform“, um Wegbeschreibungen zu geben oder zu verstehen. (Unter Freunden verwendet man im Polnischen meist stattdessen diese Befehlsform – sie lernen Sie später kennen.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: Wie komme ich zu + [Ort]?
    gloss: 'Wie komme ich zu + [Ort]? – Jak (wie) plus dojść (hingelangen) fragt nach dem Weg zu einem Ort: Wie komme ich zur Bank? Wie komme ich zum Hotel? Wie komme ich zum Park? Das Nomen nach do hat dieselbe Genitivendung -u wie nach „neben“/„gegenüber“ in der letzten Lektion: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* ist die alltägliche Frage, um nach dem Weg zu einem Ort zu fragen. Der Ortsname nach *do* erhält dieselbe Genitivendung *-u*, die Sie schon nach *obok*/*naprzeciwko* gelernt haben – aus *bank* wird *banku*, aus *hotel* wird *hotelu*, aus *park* wird *parku*, genau dasselbe Muster, nur nach einer neuen Präposition.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: Wie komme ich zur Bank?
    gloss: Wie komme ich zur Bank?
    note: Das Muster aus der Grammatikerklärung, angewendet auf das erste Ziel dieser Lektion.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Rechts, links
    gloss: rechts; links
    note: Steht nach na, um zu sagen, wo etwas liegt oder in welche Richtung man abbiegt – na prawo (nach/auf der rechten Seite), na lewo (nach/auf der linken Seite).
    example_gloss:
    - Die Bank ist rechts.
    - Der Park ist links.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: Abbiegen
    gloss: abbiegen
    note: Das Verb für den Richtungswechsel – zusammen mit na prawo/na lewo bedeutet es „rechts abbiegen“/„links abbiegen“.
    example_gloss: Bitte biegen Sie rechts ab.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Bitte biegen Sie links ab
    gloss: Bitte biegen Sie links ab.
    note: Dasselbe Muster Proszę + Infinitiv, diesmal mit skręcić und na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Straße
    gloss: Straße
    note: Ein gewöhnliches Wort für jede Straße – nützlich, wenn eine Wegbeschreibung eine bestimmte Straße beim Namen nennt.
    example_gloss: Die Straße ist dort.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Anweisungen mit potem verketten
    gloss: 'Bitte gehen Sie geradeaus, dann biegen Sie rechts ab. – Mehrere Anweisungen lassen sich mit einem Komma und dem Wort potem (dann) verbinden: erst das eine tun, dann das nächste.'
    note: 'Um mehrere Anweisungen hintereinander zu geben, verbinden Sie sie einfach mit einem Komma und *potem*: *Proszę iść prosto, potem skręcić na prawo* („Bitte gehen Sie geradeaus, dann biegen Sie rechts ab“). Genau so aufgebaut hören Sie auch echte Wegbeschreibungen mit mehreren Schritten.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Ich verstehe
    gloss: ich verstehe
    note: Nützlich, um zu bestätigen, dass Sie die Wegbeschreibung verstanden haben, bevor Sie nachfragen.
    example_gloss: Ich verstehe, danke.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa fragt, wie sie zum Park kommt
    gloss: Ewa entschuldigt sich und fragt, wie sie zum Park kommt.
    note: Przepraszam eröffnet die Frage – dieselbe höfliche Gewohnheit wie im Dialog über Orte in der vorigen Lektion.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Ein Passant erklärt den Weg zum Park
    gloss: 'Der Passant sagt: geradeaus gehen, dann links abbiegen. Der Park ist dort.'
    note: Zwei verkettete Wegangaben mit potem, genau wie in der Grammatikerklärung dieser Lektion beschrieben.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa bestätigt und fragt nach der Bank
    gloss: Ewa sagt, dass sie versteht, und fragt, wie sie zur Bank kommt.
    note: Rozumiem bestätigt, dass sie die ersten Wegangaben verstanden hat, bevor sie eine neue Frage stellt.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: Der Passant erklärt den Weg zur Bank
    gloss: 'Der Passant sagt: rechts abbiegen, dann geradeaus gehen. Die Bank ist rechts.'
    note: Eine andere Route in zwei Schritten als beim Park, mit demselben Muster Proszę + Infinitiv.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa bedankt sich
    gloss: Ewa sagt vielen Dank.
    note: Dziękuję bardzo, schon aus den Lektionen zum Einkaufen und zu Orten bekannt.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: Der Passant antwortet
    gloss: 'Der Passant sagt: Gern geschehen.'
    note: Proszę bardzo, die übliche Antwort auf einen Dank, schon aus früheren Lektionen bekannt.
