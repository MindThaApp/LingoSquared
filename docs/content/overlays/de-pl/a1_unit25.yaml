answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polnisch A1
  description: 'Polnisch für Anfänger: das grundlegende Aussehen einer Person beschreiben – Größe und Alterseindruck, Haar- und Augenfarbe, die zentrale Frage Jak wygląda ...? und das Vergleichen des Aussehens zweier Personen.'
units:
  pl.a1.unit25.wyglad:
    title: Aussehen beschreiben
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Groß, klein, alt und jung
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Haare beschreiben
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: 'Augen und: Wie sieht jemand aus?'
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa beschreibt Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Tomek und Kasia im Vergleich
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek erkennt Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Groß und klein
    gloss: groß / klein
    note: '*Wysoki* beschreibt eine große Person, *niski* eine kleine. Eine Frau ist *wysoka* oder *niska*.'
    example_gloss:
    - Kasia ist groß.
    - Tomek ist klein.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Alt und jung
    gloss: alt / jung
    note: '*Stary* und *młody* beschreiben hier einen allgemeinen Eindruck, nicht eine genaue Zahl von Jahren.'
    example_gloss:
    - Opa ist alt.
    - Marek ist jung.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: Eindruck oder Alter'
    gloss: '*Stary* beschreibt einen allgemeinen Eindruck, wie in *Dziadek jest stary*. Für ein genaues Alter verwendet man im Polnischen eine andere Struktur: *Ile masz lat?*'
    note: Wie alt jemand wirkt, drücken Sie mit *stary* oder *młody* aus; nach dem genauen Alter fragen Sie mit *Ile masz lat?* und antworten mit *mam ... lat* (ich bin ... Jahre alt).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia ist groß und Tomek ist klein
    gloss: Kasia ist groß und Tomek ist klein.
    note: Ein einfacher zusammengesetzter Satz mit *a* (und, im Gegensatz). *Wysoka* und *niski* richten sich nach einem weiblichen bzw. männlichen Subjekt und bereiten den Vergleich in Lektion 5 vor.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: Haare
    gloss: die Haare
    note: '*Włosy* steht im Polnischen immer im Plural: *długie włosy* (lange Haare).'
    example_gloss: Marek hat kurze schwarze Haare.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: Drei Haarfarben. *Blond* verändert sich nie; *brązowe* und *siwe* sind Pluralformen, passend zu *włosy*.
    example_gloss:
    - Ewa hat blonde Haare.
    - Tomek hat braune Haare.
    - Opa hat graue Haare.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Długie* (lang) und *krótkie* (kurz) sind Pluralformen, passend zu *włosy*.'
    example_gloss:
    - Kasia hat lange Haare.
    - Tomek hat kurze Haare.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy verlangt Adjektive im Plural
    gloss: '*Włosy* steht im Plural, daher steht auch das Adjektiv im Plural: lange Haare, kurze Haare, braune Haare, schwarze Haare.'
    note: 'Pluralnomen, die keine männlichen Personen bezeichnen, haben Adjektive auf *-e*: *długie włosy*. *Blond* ist die Ausnahme: Es verändert sich nie (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: immer Plural'
    gloss: '*Włosy* (Haar, Haare) steht immer im Plural: *jej włosy są długie* (ihre Haare sind lang, wörtlich „ihre Haare sind lang“ im Plural). *Jej* bedeutet „ihr/ihre“.'
    note: Haar ist im Polnischen ein Pluralwort, deshalb stehen Verben und Adjektive im Plural. *Jej* („ihr“) verändert sich nie, egal wie viele Dinge ihr gehören.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek hat kurze schwarze Haare
    gloss: Marek hat kurze schwarze Haare.
    note: '*Czarne* (schwarz) ist die Pluralform, passend zu *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa hat lange blonde Haare
    gloss: Ewa hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Augen
    gloss: die Augen
    note: '*Oczy* ist der Plural von *oko*; im Polnischen spricht man meist im Plural von beiden Augen.'
    example_gloss: Marek hat braune Augen.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: 'Drei Augenfarben im Plural, passend zu *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa hat blaue Augen.
    - Tomek hat braune Augen.
    - Kasia hat grüne Augen.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy verlangt -e
    gloss: '*Oczy* steht im Plural, daher endet das Adjektiv auf *-e*: blaue Augen, braune Augen, grüne Augen.'
    note: 'Dieselbe Pluralendung wie bei *włosy* in Lektion 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Wie sieht Ewa aus?
    gloss: Wie sieht Ewa aus?
    note: '*Jak wygląda ...?* ist die zentrale Frage dieser Einheit; mit ihr fragen Sie nach dem Aussehen jeder Person.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa hat lange blonde Haare und blaue Augen
    gloss: Ewa hat lange blonde Haare und blaue Augen.
    note: Eine Musterantwort, die Haare und Augen mit *i* (und) in einem Satz verbindet.
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa stellt Nina vor
    gloss: 'Ewa: In das Sprachcafé kommt ein neues Mädchen. Sie heißt Nina.'
    note: '*Przychodzi* (kommt) führt jemand Neuen in die Szene ein; *do kawiarni językowej* steht mit *do* + Genitiv.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek fragt, wie sie aussieht
    gloss: 'Marek: Okay! Wie sieht sie aus?'
    note: Dieselbe Kernfrage der Einheit, jetzt mit *ona* (sie) statt eines Namens.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa beschreibt Ninas Größe und Haare
    gloss: 'Ewa: Sie ist klein und hat kurze blonde Haare.'
    note: Verbindet *niska* (die weibliche Form von *niski*) aus Lektion 1 mit dem Haarwortschatz aus Lektion 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek fragt nach ihren Augen
    gloss: 'Marek: Und ihre Augen?'
    note: '*Jej* ist hier das Possessivpronomen „ihr“, also bedeutet *jej oczy* „ihre Augen“; *jej* verändert sich nie.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa beschreibt Ninas Augen
    gloss: 'Ewa: Sie hat grüne Augen.'
    note: Wiederholt *zielone oczy* aus Lektion 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek wird sie erkennen
    gloss: 'Marek: Danke! Dann erkenne ich sie.'
    note: '*Rozpoznam* ist das perfektive Futur („ich werde erkennen“); *ją* ist der Akkusativ von *ona* (sie).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Tomek und Kasia im Vergleich
    gloss: Tomek und Kasia sind Bruder und Schwester, aber sie sehen unterschiedlich aus. Tomek ist klein und hat kurze braune Haare und braune Augen. Kasia ist größer als Tomek und hat lange braune Haare und grüne Augen. Wie siehst du aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      brat: Bruder
      siostra: Schwester
      wyglądają: ist ... (vom Aussehen her)
      inaczej: verschieden
      niski: klein
      krótkie: klein
      brązowe: braun
      włosy: Haare
      oczy: Augen
      wyższa: größer
      długie: lang
      zielone: grün
      wyglądasz: du siehst aus (wie jemand aussieht)
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Den Komparativ wieder verwenden
    gloss: 'Komparativ: *wysoki* (groß) wird zu *wyższy* (größer), und die verglichene Person steht nach *niż* (als): Kasia ist größer als Tomek.'
    note: 'Im Polnischen wird der Komparativ durch die Endung des Adjektivs gebildet, und er richtet sich weiterhin nach dem Geschlecht: *wyższa* für Kasia (weiblich).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia hat längere Haare als Tomek
    gloss: Kasia hat längere Haare als Tomek.
    note: '*Dłuższe* (länger) steht im Plural passend zu *włosy*, und *niż* (als) leitet den Vergleich ein.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: Ein Musterbeispiel in der ersten Person mit *Mam ...*, das Sie bei der Beschreibung Ihres eigenen Aussehens wiederverwenden können.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek entdeckt Nina
    gloss: 'Marek: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Patrz* (schau) ist der Imperativ von *patrzeć*. *Czy to Nina?* fragt „Ist das Nina?“'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa bestätigt
    gloss: 'Ewa: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina begrüßt Marek
    gloss: 'Nina: Hallo, bist du Marek?'
    note: 'Eine einfache, informelle Begrüßungsfrage. Nach *być* steht ein Name im Instrumental: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek begrüßt Nina zurück
    gloss: 'Marek: Ja! Schön, dich kennenzulernen, Nina.'
    note: '*Miło cię poznać* ist die übliche Wendung bei einer ersten Begegnung („schön, dich kennenzulernen“; *poznać* bedeutet „kennenlernen“). Nina wird im Vokativ angesprochen: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: Beendet den Dialog – Marek hat Nina anhand von Ewas Beschreibung erfolgreich erkannt.
