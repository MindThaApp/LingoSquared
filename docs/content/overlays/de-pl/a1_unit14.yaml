teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Jung
    gloss: jung
    note: Ein einfaches beschreibendes Adjektiv – der Ausgangspunkt für die Komparativformen dieser Lektion.
    example_gloss: Marek ist jung.
  pl.a1.unit14.lesson01.teach.stary:
    title: Alt
    gloss: alt
    note: Das Gegenteil von młody – ein weiteres Adjektiv, das in dieser Lektion zum Komparativ wird.
    example_gloss: Opa ist alt.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Einen Vergleich bilden: -szy anfügen'
    gloss: 'Bei kurzen Adjektiven wie stary und młody ändert sich die Endung -y zu -szy: stary wird zu starszy, młody wird zu młodszy. Nicht jedes Adjektiv funktioniert so.'
    note: 'Ein einfaches Muster für diese beiden Wörter: Das letzte *-y* fällt weg und *-szy* kommt dazu – so entsteht der Komparativ. Viele andere Adjektive haben eine andere Endung, wenden Sie das Muster also nicht überall an.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Älter
    gloss: älter
    note: Starszy verwendet man für einen Mann (oder on), starsza für eine Frau (oder ona) – der Komparativ von stary.
    example_gloss:
    - Opa ist älter als Papa.
    - Oma ist älter als Mama.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Jünger
    gloss: jünger
    note: Młodszy für einen Mann, młodsza für eine Frau – der Komparativ von młody.
    example_gloss:
    - Papa ist jünger als Opa.
    - Mama ist jünger als Oma.
  pl.a1.unit14.lesson01.teach.niz:
    title: Als
    gloss: als
    note: Niż verbindet die beiden Dinge, die verglichen werden – das Wort nach niż bleibt in seiner normalen Grundform.
    example_gloss: Der Sohn ist jünger als der Vater.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: Komparative richten sich nach dem Geschlecht
    gloss: Starszy/starsza und młodszy/młodsza verändern sich mit dem Geschlecht, genau wie byłem/byłam. Starszy, młodszy bei einem Mann (on); starsza, młodsza bei einer Frau (ona).
    note: Dasselbe Muster wie bei *byłem*/*byłam* – die Endung ändert sich, je nachdem, ob es um einen Mann oder eine Frau geht.
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa ist älter als Marek
    gloss: Ewa ist älter als Marek.
    note: Eine wahre Tatsache über unsere beiden Figuren – Ewa ist 32, Marek ist 28.
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek ist jünger als Ewa
    gloss: Marek ist jünger als Ewa.
    note: Dieselbe Tatsache, nur andersherum ausgedrückt.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Wieder „gut“
    gloss: Dobry (gut) – kennen Sie schon aus Dzień dobry.
    note: Dasselbe Adjektiv, das Ihnen seit der allerersten Lektion begegnet, wird nun für einen Komparativ verwendet.
  pl.a1.unit14.lesson02.teach.zly:
    title: Schlecht
    gloss: schlecht
    note: Das Gegenteil von dobry – ein ganz neues Wort in dieser Lektion.
    example_gloss: Das ist ein schlechter Tag.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry und zły sind unregelmäßig
    gloss: 'Dobry und zły sind unregelmäßig: dobry wird zu lepszy, zły wird zu gorszy – es wird kein -szy angefügt.'
    note: Anders als *stary*/*młody* folgen diese beiden nicht dem regelmäßigen *-szy*-Muster – ihre Komparativformen muss man einfach lernen.
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Besser
    gloss: besser
    note: Lepszy bei einem Mann, lepsza bei einer Frau (oder bei einem femininen Wort wie kawa) – der unregelmäßige Komparativ von dobry.
    example_gloss:
    - Er ist besser als ich.
    - Kaffee ist besser als Tee.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Schlechter
    gloss: schlechter
    note: Gorszy/gorsza – der unregelmäßige Komparativ von zły.
    example_gloss:
    - Er ist schlechter als ich.
    - Tee ist schlechter als Kaffee.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Kaffee und Tee, noch einmal
    gloss: Kawa und herbata – diese Wörter kennen Sie schon aus der früheren Lektion über Getränke.
    note: Eine kurze Erinnerung, bevor diese Lektion sie in einem Vergleich verwendet.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: Dasselbe Muster wie zuvor
    gloss: Lepszy/lepsza und gorszy/gorsza verändern sich mit dem Geschlecht genauso wie starszy/starsza in der letzten Lektion.
    note: Dieselbe Unterscheidung zwischen maskulin und feminin, die Sie gerade gelernt haben, auf ein neues Wortpaar angewendet.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Ich, ich bin, du
    gloss: Ja, jestem, ty – diese Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Ja, nein, okay
    gloss: Tak, nie und dobrze – kennen Sie ebenfalls schon.
    note: Noch eine kurze Erinnerung vor dem Dialog.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Aber, noch einmal
    gloss: Ale (aber) – kennen Sie schon aus früheren Lektionen. Es verbindet zwei gegensätzliche Sätze.
    note: Ein kurzes Bindewort, das einen Gegensatz einleitet, ganz wie „aber“ im Deutschen.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek sagt, Tee ist besser
    gloss: Tee ist besser als Kaffee!
    note: Marek beginnt mit seiner eigenen Meinung, passend zu dem, was er in der Lektion über Vorlieben schon gesagt hat.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa widerspricht
    gloss: Nein, nein! Kaffee ist besser als Tee!
    note: Ewa hält mit ihrer eigenen Meinung dagegen – ebenfalls passend zu dem, was sie vorher gesagt hat.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek wechselt das Thema zum Alter
    gloss: Okay, okay. Aber ich bin jünger als du!
    note: Marek gibt den Streit über die Getränke auf und bringt stattdessen etwas zur Sprache, bei dem er sich sicher ist.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa stimmt zu und bekräftigt ihre Meinung
    gloss: Ja, ich bin älter. Aber Kaffee ist besser!
    note: Ewa bestätigt die Altersangabe und kehrt dann zu ihrer Meinung über den Kaffee zurück.
