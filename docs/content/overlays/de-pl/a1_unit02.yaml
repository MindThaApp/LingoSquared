teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: 'null'
    note: Der Ausgangspunkt für alle folgenden Zahlen in dieser Einheit.
    example_gloss: Heute sind es null Grad.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Eins
    gloss: eins
    note: Nach *jeden* steht ein normales Substantiv im Singular, anders als bei allen anderen Zahlen in dieser Lektion.
    example_gloss: Ich habe ein Telefon.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Zwei
    gloss: zwei
    note: Nach *dwa*, *trzy* und *cztery* steht eine besondere Pluralform des Substantivs (wie *psy*, „Hunde“) – anders als die Pluralform nach *pięć* und höheren Zahlen.
    example_gloss: Ich habe zwei Hunde.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Drei
    gloss: drei
    note: 'Dasselbe Pluralmuster wie bei *dwa*: *trzy złote* (drei Złoty), nicht *trzy złotych*.'
    example_gloss: Der Kaffee kostet drei Złoty.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Vier
    gloss: vier
    note: Die letzte der drei Zahlen (*dwa*, *trzy*, *cztery*) mit diesem Pluralmuster.
    example_gloss: Ich habe vier Bücher.
  pl.a1.unit02.lesson01.teach.piec:
    title: Fünf
    gloss: fünf
    note: Ab *pięć* steht das Substantiv in einer anderen Pluralform (Genitiv Plural, z. B. *minut* statt *minuty*) – dieses Muster begegnet Ihnen in der ganzen restlichen Einheit.
    example_gloss: Ich habe fünf Minuten.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Sechs
    gloss: sechs
    note: 'Dasselbe Muster mit Genitiv Plural wie bei *pięć*: *sześć jabłek* (sechs Äpfel).'
    example_gloss: Ich habe sechs Äpfel.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Sieben
    gloss: sieben
    note: Eine nützliche Zahl, um über die Wochentage zu sprechen.
    example_gloss: Eine Woche hat sieben Tage.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Acht
    gloss: acht
    note: '*Mam osiem lat* heißt wörtlich „Ich habe acht Jahre“ – das Polnische gibt das Alter mit *mieć* („haben“) an, nicht mit „sein“ wie das Deutsche. Dieses Muster üben Sie in Lektion 3 ausführlich.'
    example_gloss: Ich bin acht Jahre alt.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Neun
    gloss: neun
    note: 'Wieder Genitiv Plural: *dziewięć osób* (neun Personen).'
    example_gloss: Neun Personen warten in der Schlange.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Zehn
    gloss: zehn
    note: Die letzte der einstelligen Zahlen – Lektion 2 geht weiter mit den Zahlen ab elf und den Zehnern.
    example_gloss: Ich habe zehn Finger.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Elf
    gloss: elf
    note: 'Die Zahlen 11–19 enden auf *-naście*, ähnlich dem deutschen „-zehn“ in dreizehn bis neunzehn. Wie *pięć* und höhere Zahlen stehen sie mit dem Genitiv Plural: *jedenaście osób*.'
    example_gloss: Die Klasse besteht aus elf Personen.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Zwölf
    gloss: zwölf
    note: Dasselbe Muster auf *-naście* wie bei *jedenaście*.
    example_gloss: Ein Jahr hat zwölf Monate.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Fünfzehn
    gloss: fünfzehn
    note: 'Weiterhin das Muster der Zahlen auf *-naście*: *piętnaście minut* (fünfzehn Minuten).'
    example_gloss: Ich habe fünfzehn Minuten Pause.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Zwanzig
    gloss: zwanzig
    note: Die Zahlen 20–40 enden auf *-dzieści* – ein anderes Muster als bei den Zahlen auf *-naście*. *Dwadzieścia* selbst steht noch mit dem Genitiv Plural (*dwadzieścia lat*), aber achten Sie in Lektion 3 darauf, was passiert, wenn eine Einerziffer hinzukommt.
    example_gloss: Ich bin zwanzig Jahre alt.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Einundzwanzig
    gloss: einundzwanzig
    note: 'Zusammengesetzte Zahlen werden einfach aneinandergereiht: erst der Zehner, dann die Einer, ohne Verbindungswort.'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Dreißig
    gloss: dreißig
    note: Weiterhin das Muster auf *-dzieści* wie bei *dwadzieścia*.
    example_gloss: Die Fahrkarte kostet dreißig Złoty.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Fünfzig
    gloss: fünfzig
    note: Die Zahlen 50–90 haben ein drittes Muster, *-dziesiąt*, statt *-dzieści*.
    example_gloss: Ich habe fünfzig Złoty.
  pl.a1.unit02.lesson02.teach.sto:
    title: Einhundert
    gloss: einhundert
    note: Eine glatte runde Zahl, ohne zusammengesetzte Endung.
    example_gloss: Das kostet hundert Złoty.
  pl.a1.unit02.lesson02.teach.ile:
    title: Wie viel / wie viele
    gloss: wie viel; wie viele
    note: Das Fragewort für jede Frage nach einer Menge oder einem Preis.
    example_gloss: Wie viel kostet das?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Nach dem Preis fragen
    gloss: Wie viel kostet das?
    note: '*Kosztować* („kosten“) ist das Verb; *to* („das/es“) ist das Subjekt. Die ganze Frage ist ein fester, sehr gebräuchlicher Ausdruck.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Einen Preis nennen
    gloss: Das kostet zwanzig Złoty.
    note: '*Złotych* ist der Genitiv Plural von *złoty* (der polnischen Währung) – dasselbe Pluralmuster, das auch *dwadzieścia* selbst schon verlangt.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Nach der Telefonnummer fragen, bei einem Mann
    gloss: Wie ist Ihre Telefonnummer? (zu einem Mann, formell)
    note: Wörtlich „Welche ist die Telefonnummer des Herrn“. *Pana* ist die Possessivform (Genitiv) von *pan* – „des Herrn“, also „Ihre“.
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Nach der Telefonnummer fragen, bei einer Frau
    gloss: Wie ist Ihre Telefonnummer? (zu einer Frau, formell)
    note: Ersetzen Sie *pana* durch *pani*, um eine Frau formell anzusprechen – wie im Muster aus Einheit 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Nach der Telefonnummer fragen, informell
    gloss: Wie ist deine Telefonnummer? (informell)
    note: '*Twój* („dein“) ersetzt *pana*/*pani*, wenn Sie mit Freunden oder Gleichaltrigen sprechen.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: Eine Nummer nennen, Einleitung
    gloss: Die Nummer ist ...
    note: Eine kurze, natürliche Einleitung, bevor man die Ziffern einzeln vorliest – so nennt man im Polnischen üblicherweise eine Telefonnummer.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Eine Beispiel-Telefonnummer
    gloss: Sechs, eins, fünf, null, zwei.
    note: Polnische Telefonnummern werden Ziffer für Ziffer vorgelesen – alle Ziffern hier kennen Sie schon aus dieser Einheit.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Nach dem Alter fragen, informell
    gloss: Wie alt bist du? (informell)
    note: Wörtlich „Wie viele Jahre hast du“ – das Polnische gibt das Alter mit *mieć* („haben“) an, wie schon bei der Karte *osiem* gezeigt.
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Nach dem Alter fragen, formell
    gloss: Wie alt sind Sie? (zu einem Mann, formell)
    note: '*Ma* ist dieselbe Verbform der 3. Person, die schon bei *pan jest*/*pan ma* in Einheit 1 vorkam – *pan* verhält sich grammatisch wie „der Herr“, also wie ein Subjekt der 3. Person.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Das eigene Alter nennen
    gloss: Ich bin achtundzwanzig Jahre alt.
    note: '*Mam* ist die 1. Person von *mieć* („haben“). *Dwadzieścia osiem* endet auf *osiem* (acht); wie jede Zahl, die auf 5–9 endet, steht sie mit *lat* – achten Sie im Dialog in Lektion 3 auf eine Zahl mit anderer Endung.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa fragt nach Mareks Nummer
    gloss: Ewa fragt Marek förmlich nach seiner Telefonnummer.
    note: Greift die formelle Frage nach der Telefonnummer aus dieser Lektion genau auf.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek nennt seine Nummer
    gloss: Marek liest seine Telefonnummer Ziffer für Ziffer vor.
    note: Alle Ziffern hier wurden schon in den Lektionen 1–2 dieser Einheit gelernt.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa fragt nach Mareks Alter
    gloss: Ewa bedankt sich und fragt ihn förmlich nach seinem Alter.
    note: '*Dziękuję* („danke“) und *A* („und“) ändern sich je nach Anrede nicht, wie die Karte *dziękuję* in Einheit 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek nennt sein Alter und gibt die Frage zurück
    gloss: Marek sagt, dass er achtundzwanzig ist, und fragt Ewa förmlich nach ihrem Alter.
    note: '*A pani?* gibt die Frage förmlich an eine Frau zurück – nach demselben kurzen Muster wie *A pan?* in Einheit 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa nennt ihr Alter
    gloss: Ewa sagt, dass sie zweiunddreißig ist.
    note: '*Trzydzieści dwa* endet auf *dwa* (zwei). Anders als *dwadzieścia osiem* (endet auf acht und steht mit *lat*) steht diese Zahl mit *lata* – Zahlen, die auf 2, 3 oder 4 enden (außer den Zahlen von 12 bis 14), verwenden diese andere Pluralform. Das ist eine echte grammatische Feinheit: *lat* und *lata* sind nicht austauschbar, und welches richtig ist, hängt von der letzten Ziffer der Zahl ab.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek beendet das Gespräch
    gloss: Marek sagt, dass es schön war, mit ihr zu plaudern, und verabschiedet sich.
    note: '*Do zobaczenia* greift den Abschiedsgruß „Bis bald“ aus Einheit 1 auf.'
