teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Brot
    gloss: Brot
    note: Ein grundlegendes Wort für ein Grundnahrungsmittel – es kommt bei jeder Mahlzeit ständig vor.
    example_gloss: Das ist Brot.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Butter, Käse
    gloss: Butter; Käse
    note: Das erste Wort ist sächlich, das zweite männlich (unbelebt). Beide verändern nach proszę o ihre Endung nicht, wie die Grammatikregel dieser Lektion erklärt.
    example_gloss:
    - Das ist Butter.
    - Das ist Käse.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Wasser, Milch
    gloss: Wasser; Milch
    note: Woda ist weiblich (die Akkusativform wodę steht in der Grammatikregel dieser Lektion); mleko ist sächlich und verändert sich nie.
    example_gloss:
    - Das ist Wasser.
    - Das ist Milch.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Kaffee, Tee
    gloss: Kaffee; Tee
    note: Beide sind weiblich. Ihre Akkusativformen kawę und herbatę sagen Sie beim Bestellen tatsächlich; sie werden in der Grammatikregel dieser Lektion behandelt.
    example_gloss:
    - Das ist Kaffee.
    - Das ist Tee.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Bestellen: proszę o + Akkusativ'
    gloss: 'Ich hätte gern + Akkusativ: Kaffee -> kawę, Tee -> herbatę, Wasser -> wodę. Brot, Käse und Milch bleiben unverändert.'
    note: 'Nach *Proszę o* („ich bitte um“, hier: „ich hätte gern“) steht der Akkusativ. Weibliche Nomen wie *kawa*, *herbata* und *woda* tauschen ihr *-a* gegen *-ę*. Männliche unbelebte Nomen wie *chleb* und *ser* sowie sächliche Nomen wie *mleko* behalten genau die Form, die im Wörterbuch steht.'
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: Einen Kaffee, bitte
    gloss: Einen Kaffee, bitte.
    note: Die alltägliche, höfliche Art, etwas Einzelnes zu bestellen – hier wenden Sie das Muster der Grammatikregel in einer vollständigen Bitte an.
  pl.a1.unit06.lesson02.teach.zupa:
    title: Suppe
    gloss: Suppe
    note: Ein häufiges Gericht zum Mittag- oder Abendessen und oft das Tagesgericht, wie in der Restaurantszene dieser Einheit.
    example_gloss: Das ist Suppe.
  pl.a1.unit06.lesson02.teach.sok:
    title: Saft
    gloss: Saft
    note: Männlich und unbelebt, wie chleb und ser – beim Bestellen ändert sich die Endung nicht.
    example_gloss: Das ist Saft.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Zucker
    gloss: Zucker
    note: Nützlich für Kaffee oder Tee – ebenfalls männlich und unbelebt, die Endung bleibt gleich.
    example_gloss: Das ist Zucker.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: Die Rechnung
    gloss: die Rechnung
    note: Darum bitten Sie am Ende einer Mahlzeit – proszę o rachunek ist die übliche, höfliche Art, sie zu verlangen.
    example_gloss: Die Rechnung, bitte.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'mögen: lubię, lubi'
    gloss: 'mögen: ich mag, er/sie mag – Ich mag Kaffee. Er mag Suppe.'
    note: '*Lubić* bedeutet „mögen“. Hier lernen Sie nur die Formen der 1. Person (*lubię*) und der 3. Person (*lubi*). *Lubić* verlangt ebenfalls den Akkusativ, genau wie *proszę o*: *lubię kawę*, nicht *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: Ich mag Suppe
    gloss: Ich mag Suppe.
    note: Zupa wird im Akkusativ zu zupę – dieselbe weibliche Verschiebung -a -> -ę wie in der Grammatikregel der ersten Lektion.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: Das Tagesgericht
    gloss: Das Tagesgericht ist Suppe.
    note: '*Dnia* ist der Genitiv von *dzień* (Tag) – *danie dnia* heißt wörtlich „das Gericht des Tages“, so steht es auch auf einer Speisekarte.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'empfehlen: polecam, poleca'
    gloss: 'empfehlen: ich empfehle, er/sie empfiehlt – Ich empfehle Kaffee. Er empfiehlt Suppe.'
    note: '*Polecać* bedeutet „empfehlen“ – ein Kellner schlägt damit ein Gericht vor, und ein Gast fragt mit demselben Verb nach einem Vorschlag. Es verlangt ebenfalls den Akkusativ, wie *proszę o* und *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: Was empfehlen Sie?
    gloss: Was empfehlen Sie?
    note: '*Co* (was) plus das förmliche *pan* – die natürliche Frage an einen Kellner, mit derselben höflichen Anrede wie in Einheit 1.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Bitte sehr / gern geschehen
    gloss: Bitte sehr.
    note: Eine vielseitige Alltagswendung – man sagt sie beim Servieren, und ebenso natürlich als Antwort auf dziękuję (danke).
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Kommt sofort
    gloss: Kommt sofort.
    note: Wörtlich „Ich serviere schon“ – die übliche Antwort eines Kellners, die bestätigt, dass er die Bestellung gehört hat.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: Der Kellner nennt das Tagesgericht
    gloss: Der Kellner begrüßt die Gäste und sagt, dass das Tagesgericht Suppe ist.
    note: Dzień dobry, bekannt aus den Grüßen von Einheit 1.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa fragt nach einer Empfehlung
    gloss: Ewa fragt den Kellner, was er empfiehlt.
    note: Eine höfliche, förmliche Frage – mit pan wird der Kellner respektvoll angesprochen.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: Der Kellner empfiehlt Kaffee
    gloss: Der Kellner empfiehlt den Kaffee.
    note: Polecam – die Form der 1. Person aus der Grammatikregel dieser Lektion.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa gibt ihre Bestellung auf
    gloss: Ewa sagt „Gut“ und bestellt Kaffee und Suppe.
    note: Verbindet proszę o mit dem Bindewort i (und) aus der Familieneinheit und greift das Bestellmuster der ersten Lektion sowie den Suppen-Wortschatz der zweiten Lektion auf.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: Der Kellner bestätigt
    gloss: Der Kellner sagt, dass die Bestellung sofort kommt.
    note: Eine kurze, natürliche Bestätigung, bevor das Essen kommt.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa bittet um die Rechnung
    gloss: Ewa bedankt sich und bittet um die Rechnung.
    note: Greift dziękuję aus Einheit 1 und proszę o + rachunek aus Lektion 2 auf.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: Der Kellner reicht die Rechnung
    gloss: 'Der Kellner sagt: Bitte sehr.'
    note: Dasselbe proszę bardzo wie weiter oben in dieser Lektion, hier als Antwort beim Überreichen der Rechnung.
