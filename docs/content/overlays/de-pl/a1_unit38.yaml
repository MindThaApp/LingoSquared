  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: Ein Gespräch über die Jahreszeiten
    gloss: 'Jetzt ist Frühling. Die Tulpen sind schön. Nina fragt: Welche Jahreszeit findest du schön? Marek sagt: Ich mag den Sommer. Im Sommer schwimmen wir. Ewa sagt: Ich mag den Winter. Im Winter laufen wir Schlittschuh.'
    note: Der Text fasst das Gespräch im Sprachcafé zusammen und gibt die Aussagen der Personen in wörtlicher Rede wieder.
    glosses:
      wiosna: der Frühling
      Tulipany: Tulpen
      ładne: schön
      pyta: fragt
      porę: Jahreszeit
      uważasz: denken / finden
      mówi: sagt
      lato: der Sommer
      Lubię: unterhaltsam / lustig
      pływamy: schwimmen
      zimę: der Winter
      łyżwach: Schlittschuh laufen
