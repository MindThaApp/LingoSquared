  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: Die Konstruktion mit Lubię
    gloss: '*Lubię* + Jahreszeit sagt, welche Jahreszeit Sie mögen: *Lubię lato.* Die Jahreszeit steht im Akkusativ: *wiosnę*, *zimę*.'
    note: '*Lubię* („ich mag“) steht mit dem Akkusativ: Feminine Nomen auf *-a* wechseln zu *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), während *jesień* und *lato* (ein Nomen auf *-o*) gleich bleiben. Um zu sagen, was Sie von einer Jahreszeit halten, verwenden Sie *Uważam* + Akkusativ + *za* + Adjektiv: *Uważam jesień za ładną*.'
