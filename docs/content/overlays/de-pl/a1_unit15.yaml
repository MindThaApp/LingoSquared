  pl.a1.unit15.lesson01.na_dworcu:
    title: Am Bahnhof
  pl.a1.unit15.lesson02.kiedy_odjezdza_autobus:
    title: Wann fährt der Bus ab?
  pl.a1.unit15.lesson03.rozmowa_na_dworcu:
    title: Ein Gespräch am Bahnhof
teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Bahnhof
    gloss: der Bahnhof
    note: Der Ort, an dem Züge und Busse ankommen und abfahren – der Ausgangspunkt für diese ganze Lektion.
    example_gloss: Der Bahnhof ist in der Nähe des Hotels.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Fahrkarte
    gloss: Fahrkarte
    note: Die brauchen Sie, bevor Sie in einen Zug oder Bus einsteigen.
    example_gloss: Die Fahrkarte kostet zwanzig Złoty.
  pl.a1.unit15.lesson01.teach.peron:
    title: Bahnsteig
    gloss: Bahnsteig
    note: Dort stehen Sie und warten auf Ihren Zug.
    example_gloss: Bahnsteig eins ist dort drüben.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Bahnsteig eins, zwei ...
    gloss: 'Um eine Bahnsteignummer zu nennen, können Sie Peron numer + Zahl sagen: Peron numer jeden, Peron numer dwa.'
    note: 'Einfacher, als es aussieht: einfach *peron* + *numer* + eine gewöhnliche Zahl, die Sie schon kennen. (In Bahnhofsdurchsagen werden oft Ordnungszahlen verwendet, z. B. *peron pierwszy* – „Bahnsteig eins“ –, aber *peron numer jeden* versteht man immer.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: Der Zug, noch einmal
    gloss: Pociąg odjeżdża o czwartej po południu – diesen Satz kennen Sie schon aus der Lektion über die Uhrzeit.
    note: Genau dieselbe Information wie in der Lektion über die Uhrzeit, jetzt in einer Reisesituation angewendet.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Krakau
    gloss: Krakau
    note: Eine echte polnische Stadt – das erste Reiseziel dieser Lektion.
    example_gloss: Krakau ist weit weg.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: Nach Krakau
    gloss: 'Wenn man irgendwohin fährt, sagt man do + eine andere Form des Städtenamens: do Krakowa (nicht do Kraków). Merken Sie sich diese Form als Ganzes.'
    note: Versuchen Sie nicht, *Krakowa* aus einer Regel abzuleiten – lernen Sie *do Krakowa* vorerst einfach als feste Wendung.
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Eine Fahrkarte nach Krakau, bitte
    gloss: Eine Fahrkarte nach Krakau, bitte.
    note: Genau der Satz, den Sie am Fahrkartenschalter sagen würden.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (fahren): jadę (ich fahre), jedzie (er/sie fährt). Morgen fahre ich nach Krakau. Marek fährt nach Krakau.'
    note: Vorerst nur zwei Formen – *jadę* für sich selbst, *jedzie* für jemand anderen.
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek fährt nach Krakau
    gloss: Marek fährt morgen nach Krakau.
    note: Mareks eigene Reise – seine Geschichte geht im Dialog dieser Lektion weiter.
  pl.a1.unit15.lesson02.teach.autobus:
    title: Bus
    gloss: Bus
    note: Das andere übliche Verkehrsmittel zwischen Städten.
    example_gloss: Der Bus steht am Bahnhof.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Warschau
    gloss: Warschau
    note: Die Hauptstadt Polens – das zweite Ziel dieser Lektion.
    example_gloss: Warschau ist weit weg.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: Nach Warschau
    gloss: 'Warszawa verändert sich anders als Kraków: do Warszawy (nicht do Warszawa). Jede Stadt hat ihre eigene Form – merken Sie sich beide getrennt.'
    note: '*Krakowa* und *Warszawy* folgen nicht demselben Muster – genau deshalb merkt man sich jede Form einzeln und nicht als eine gemeinsame Regel.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: Wohin
    gloss: wohin
    note: Fragt nach dem Ziel, nicht nach dem Ort – anders als die Frage, wo sich etwas bereits befindet.
    example_gloss: Wohin fährt der Bus?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: Um sieben, noch einmal
    gloss: Siódmej – diese Uhrzeitform kennen Sie schon aus der Lektion über die Uhrzeit (o siódmej = um sieben Uhr).
    note: Dasselbe Muster der Uhrzeitform im Lokativ, hier für eine Abfahrtszeit wiederverwendet.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: Der Bus nach Warschau fährt um sieben
    gloss: Der Bus nach Warschau fährt um sieben Uhr ab.
    note: Verbindet die Muster für Ziel und Uhrzeit aus dieser Lektion in einem echten Satz.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Wann, noch einmal
    gloss: Kiedy – dieses Wort kennen Sie schon aus der Lektion über Daten. Wann fährt der Bus ab?
    note: Die naheliegende Frage vor einer Reise.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa fährt nach Warschau
    gloss: Ewa fährt morgen nach Warschau.
    note: Ewas eigene Reise – ihre Geschichte geht im Dialog dieser Lektion zusammen mit der von Marek weiter.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Ich, noch einmal
    gloss: Ja – dieses Wort kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Mein, noch einmal
    gloss: Mój – dieses Wort kennen Sie schon aus der Lektion über die Familie.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: Um zehn Uhr morgens, noch einmal
    gloss: Dziesiątej und rano – beide Formen kennen Sie schon aus der Lektion über die Uhrzeit (o dziesiątej rano = um zehn Uhr morgens).
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Danke und Auf Wiedersehen
    gloss: Dziękuję und Do zobaczenia – kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: Gute Reise!
    gloss: Miłej podróży! ist die Art, jemandem eine gute Reise zu wünschen – wir verwenden es als ganzen Ausdruck und übersetzen nicht Wort für Wort.
    note: Eine feste, idiomatische Abschiedsformel – lernen Sie sie als einen Block, so wie Sie schon *Dzień dobry* gelernt haben.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek fährt morgen nach Krakau
    gloss: Morgen fahre ich nach Krakau. Mein Zug fährt um vier Uhr nachmittags ab.
    note: Marek beginnt mit seinem eigenen Reiseplan – dieselbe Tatsache, die wir in Lektion 1 schon über ihn erfahren haben.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa fährt morgen nach Warschau
    gloss: Ich fahre nach Warschau. Mein Bus fährt um zehn Uhr morgens ab.
    note: Ewa erzählt von ihrem eigenen Plan – dieselbe Tatsache, die wir in Lektion 2 schon über sie erfahren haben.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek wünscht Ewa eine gute Reise
    gloss: Gute Reise!
    note: Marek wünscht Ewa mit dem neuen Ausdruck dieser Lektion alles Gute.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa bedankt sich bei Marek und verabschiedet sich
    gloss: Danke! Auf Wiedersehen!
    note: Ein einfacher, vertrauter Abschluss des Gesprächs.
