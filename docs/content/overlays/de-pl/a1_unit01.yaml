teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Förmliche Anrede für einen Mann
    gloss: Herr (förmliche Anrede)
    note: 'Wie das Deutsche kennt auch das Polnische eine förmliche und eine vertraute Anrede. Mit *pan* sprechen Sie einen fremden oder beruflich respektierten Mann an. Grammatisch verhält sich *pan* aber wie ein Subjekt der dritten Person: „pan jest“ heißt wörtlich „der Herr ist“ und ist keine echte Form der zweiten Person, auch wenn es „Sie sind“ bedeutet.'
  pl.a1.unit01.lesson01.teach.pani:
    title: Förmliche Anrede für eine Frau
    gloss: Frau (förmliche Anrede)
    note: Das weibliche Gegenstück zu *pan*. Verwenden Sie *pani* für eine fremde oder beruflich respektierte Frau. Jede erwachsene Frau wird mit *pani* angesprochen, unabhängig vom Familienstand.
  pl.a1.unit01.lesson01.teach.ty:
    title: Vertrauliche Anrede
    gloss: du
    note: '*Ty* verwenden Sie für einen Freund, Gleichaltrige, Familienmitglieder, Kinder und alle, mit denen Sie vertraut sind. Anders als bei *pan*/*pani* hat das Verb bei *ty* echte Endungen der zweiten Person, z. B. *masz* („du hast“), nicht die der dritten Person.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Förmliche Frage nach dem Befinden, an einen Mann
    gloss: Wie geht es Ihnen? (zu einem Mann)
    note: Wörtlich etwa „Wie hat sich der Herr?“. *Ma* ist die Form der dritten Person Singular des Verbs (passend zu *pan* als grammatischem Subjekt), dieselbe Endung wie bei *on* („er“).
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: Förmliche Frage nach dem Befinden, an eine Frau
    gloss: Wie geht es Ihnen? (zu einer Frau)
    note: Dasselbe Muster wie bei *Jak się pan ma?*, nur mit *pani* statt *pan*. Die Verbform *ma* bleibt gleich, denn sie ist unabhängig vom Geschlecht der angesprochenen Person dieselbe Endung der dritten Person.
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Vertraut nach dem Befinden fragen
    gloss: Wie geht’s? (informell)
    note: 'Bei *ty* hat das Verb die echte Endung der zweiten Person, *masz*, nicht *ma*. Vergleichen Sie das förmliche *Jak się pan/pani ma?* mit dem vertrauten *Jak się masz?*: Es ist das nützlichste Minimalpaar, um den Unterschied zwischen pan/pani und ty direkt am Verb zu hören.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Eine Standardantwort
    gloss: Gut, danke.
    note: '*Dziękuję* („danke“) ändert sich je nach Register nicht: Es ist dasselbe Wort, ob Sie auf *pan*, *pani* oder *ty* antworten. Nur die Frage selbst zeigt, ob förmlich oder vertraut gesprochen wird.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: Die förmliche Gegenfrage stellen
    gloss: Und Ihnen? (zu einem Mann, förmlich)
    note: Eine kurze Möglichkeit, die Frage an einen Mann zurückzugeben, den Sie förmlich ansprechen. Bei einer Frau ersetzen Sie *pan* durch *pani* („A pani?“).
  pl.a1.unit01.lesson01.teach.a_ty:
    title: Die vertrauliche Gegenfrage stellen
    gloss: Und dir? (informell)
    note: Mit *ty* geben Sie die Frage an einen Freund oder Gleichaltrigen zurück.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Vertrautes Hallo und Tschüss
    gloss: hallo; tschüss (vertraut, beides möglich)
    note: '*Cześć* ist unter den polnischen Grüßen etwas Besonderes: Es bedeutet im vertrauten Register sowohl „hallo“ als auch „tschüss“, ähnlich wie „ciao“ im Deutschen. Es wird nur bei Beziehungen mit *ty* verwendet, nie mit *pan*/*pani*.'
    example_gloss: Hallo, wie geht's?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Gruß für den ganzen Tag
    gloss: guten Morgen; guten Tag
    note: '*Dzień dobry* passt zu jeder Zeit vor dem Abend und ist, anders als *cześć*, im Register neutral: Sie können es mit *pan*, *pani* und *ty* gleichermaßen verwenden. Es ist der sicherste Standardgruß für jemanden, den Sie nicht gut kennen.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Abendgruß
    gloss: guten Abend
    note: Löst *dzień dobry* ab, sobald es Abend ist. Ebenfalls registerneutral.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Abschied für die Nacht
    gloss: gute Nacht
    note: Anders als *dzień dobry*/*dobry wieczór* ist *dobranoc* ein Abschiedsgruß, kein Gruß zur Begrüßung. Man sagt es, wenn jemand für die Nacht geht oder zu Bett geht, nie zu Beginn eines Gesprächs.
    example_gloss: Gute Nacht, Piotr!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Standardabschied
    gloss: auf Wiedersehen
    note: 'Die neutrale, in jedem Register passende Art, sich zu verabschieden: Sie funktioniert mit *pan*, *pani* und *ty*. Klingt endgültiger als *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Abschied mit Wiedersehen
    gloss: bis dann
    note: Wörtlich „bis [wir uns] sehen“. Es zeigt, dass Sie erwarten, sich wiederzusehen, anders als das neutralere *do widzenia*.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Höflicher Abschiedswunsch
    gloss: Einen schönen Tag!
    note: '*Miłego dnia* steht in einem Wunsch im Genitiv, nach demselben Muster wie *smacznego* („guten Appetit“). Es ist eine feste Wendung, die Sie am besten als Ganzes lernen, statt sie in diesem Stadium Fall für Fall zu analysieren.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Förmlich nach dem Namen fragen
    gloss: Wie heißen Sie? (zu einem Mann)
    note: 'Wörtlich „wie nennt sich der Herr“: *nazywać się* ist ein reflexives Verb mit der Bedeutung „heißen“. Bei einer Frau ersetzen Sie *pan* durch *pani*.'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Vertraut nach dem Vornamen fragen
    gloss: Wie heißt du?
    note: 'Hier steht eine andere Wendung: *mieć na imię* („als Vornamen haben“). Sie fragt gezielt nach dem Vornamen, nicht nach dem vollen Namen oder Nachnamen, und ist die natürliche vertraute Art, einen Gleichaltrigen nach dem Namen zu fragen.'
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Den vollen Namen nennen
    gloss: Ich heiße Anna Kowalska.
    note: Die Form der ersten Person von *nazywać się*, meist gefolgt von Vor- und Nachname zusammen. So stellt man sich förmlicher und vollständiger vor.
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Den Vornamen nennen
    gloss: Ich heiße Anna.
    note: Die Form der ersten Person von *mieć na imię*, meist nur gefolgt vom Vornamen. Sie ist die lockere Entsprechung zu *Nazywam się...*.
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Freude über das Kennenlernen ausdrücken
    gloss: Sehr angenehm.
    note: Eine feste, viel verwendete Wendung beim ersten Kennenlernen, die in förmlichen wie in vertrauten Situationen passt.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Vertraut nach der Herkunft fragen
    gloss: Woher kommen Sie?
    note: '*Skąd* bedeutet „woher“. Hier sehen Sie die vertraute Form mit *ty*; die förmliche Entsprechung *Skąd pan/pani jest?* kommt im Abschlussdialog dieser Lektion vor.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Die eigene Herkunft nennen
    gloss: Ich komme aus Kanada.
    note: '*Z* („aus“) verlangt den Genitiv, deshalb wird aus *Kanada* die Form *Kanady*. Die meisten Ländernamen folgen nach *z* diesem Muster.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Den Wohnort nennen
    gloss: Ich wohne in Warschau.
    note: '*W* („in“) verlangt hier den Lokativ, deshalb wird aus *Warszawa* die Form *Warszawie*. Herkunft (mit *z*) und aktueller Wohnort (mit *w*) verlangen beim Ortsnamen unterschiedliche Fälle. Betrachten Sie das als Muster, nicht als Ausnahme, die man auswendig lernt.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: Die Begegnung beginnen
    gloss: Ewa begrüßt Marek und fragt ihn förmlich nach seinem Namen.
    note: Ewa verwendet gegenüber jemandem, den sie gerade kennenlernt, das förmliche Register mit *pan*. Das ist der sichere Standard bei einer ersten beruflichen oder unbekannten Begegnung.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: 'Die Begegnung beginnen: Antwort'
    gloss: Marek nennt seinen vollen Namen und sagt, dass es ihn freut, sie kennenzulernen.
    note: '*Nazywam się* mit vollem Namen ist die natürliche, vollständige Antwort auf eine förmliche Frage nach dem Namen.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Nach der Herkunft fragen
    gloss: Ewa erwidert die Höflichkeit und fragt Marek förmlich, woher er kommt.
    note: '*Skąd pan jest?*, das förmliche Gegenstück zu *Skąd jesteś?* aus dieser Lektion, verwendet *jest*, also dasselbe Muster der dritten Person, das Sie schon von *pan jest*/*pan ma* kennen.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: 'Nach der Herkunft fragen: Antwort'
    gloss: Marek sagt, dass er aus Kanada kommt, aber in Warschau wohnt.
    note: '*Ale* („aber“) verbindet den Gegensatz zwischen Mareks Herkunft und seinem jetzigen Wohnort, also genau die Unterscheidung, die auch *jestem z*/*mieszkam w* ausdrückt.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Nach Sprachkenntnissen fragen
    gloss: Ewa fragt Marek förmlich, ob er Polnisch spricht.
    note: '*Czy* leitet eine Ja/Nein-Frage ein. Im Deutschen zeigt die Verbstellung an erster Stelle die Frage an; im Polnischen bleibt die Satzstellung gleich, und *czy* allein signalisiert, dass eine Frage folgt.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Nach Sprachkenntnissen fragen, antworten und sich verabschieden
    gloss: Marek sagt, dass er ein wenig spricht und noch lernt, und verabschiedet sich dann.
    note: '*Jeszcze się uczę* („ich lerne noch“) ist eine natürliche, bescheidene Art, ein laufendes Bemühen zu beschreiben. Auch als Lernender können Sie das über sich selbst sagen.'
