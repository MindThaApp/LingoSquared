teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: Ein, zwei, drei Uhr
    gloss: ein Uhr; zwei Uhr; drei Uhr
    note: Das Polnische nennt die Uhrzeit mit weiblichen Ordnungszahlen, die sich nach dem nicht genannten weiblichen Substantiv *godzina* (Stunde) richten – *pierwsza* bedeutet wörtlich „die erste (Stunde)“.
    example_gloss:
    - Es ist ein Uhr.
    - Es ist zwei Uhr.
    - Es ist drei Uhr.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Vier, fünf, sechs Uhr
    gloss: vier Uhr; fünf Uhr; sechs Uhr
    note: Dasselbe Muster mit weiblichen Ordnungszahlen wie bei *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Es ist vier Uhr.
    - Es ist fünf Uhr.
    - Es ist sechs Uhr.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Sieben, acht, neun Uhr
    gloss: sieben Uhr; acht Uhr; neun Uhr
    note: Die mittleren drei der zwölf Stunden, nach demselben Muster.
    example_gloss:
    - Es ist sieben Uhr.
    - Es ist acht Uhr.
    - Es ist neun Uhr.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Zehn, elf, zwölf Uhr
    gloss: zehn Uhr; elf Uhr; zwölf Uhr
    note: Die letzten drei Stunden, damit ist die ganze Reihe von 1 bis 12 komplett.
    example_gloss:
    - Es ist zehn Uhr.
    - Es ist elf Uhr.
    - Es ist zwölf Uhr.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: Wörtlich „Welche ist die Stunde?“ – *która* richtet sich nach dem Femininum *godzina*; dieses Übereinstimmungsmuster begegnet Ihnen in dieser Lektion immer wieder.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina ist feminin
    gloss: Wir sagen pierwsza, druga, trzecia – nicht pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* sind die maskulinen Formen derselben Ordnungszahlen. Sie stehen sonst im Polnischen bei maskulinen Substantiven, aber nie bei der Uhrzeit, denn *godzina* ist feminin.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: Morgen, Mittag, Nachmittag
    gloss: morgens; mittags; nachmittags
    note: '*Rano* steht allein (ohne Präposition); *w południe* und *po południu* haben jeweils ihre feste Präposition. Diese drei Ausdrücke lernt man am besten als feste Wendungen, nicht über eine allgemeine Regel.'
    example_gloss:
    - Morgens trinke ich Kaffee.
    - Ich esse mittags zu Mittag.
    - Ich arbeite nachmittags.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: Abend, Nacht
    gloss: abends; nachts
    note: '*Wieczorem* ist eine feste adverbiale Form (ohne Präposition); *w nocy* verbindet *w* mit dem Lokativ von *noc* (Nacht).'
    example_gloss:
    - Abends sehe ich fern.
    - Nachts schlafe ich.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Nach der Uhrzeit fragen
    gloss: Um wie viel Uhr?
    note: Verwenden Sie diese Frage statt *Która jest godzina?*, wenn Sie wissen möchten, wann etwas stattfindet, und nicht, wie spät es gerade ist.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: „Um“ eine bestimmte Uhrzeit sagen
    gloss: Vier, sieben, zehn Uhr – aber um vier, um sieben, um zehn Uhr.
    note: 'Nach *o* („um“) wird das auslautende *-a* des Stundenworts zu *-ej*: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Alle Stunden folgen diesem Muster; nur bei *druga* → *o drugiej* kommt in der Schreibung ein *i* nach dem *g* hinzu.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa steht früh auf
    gloss: Ewa steht um 7 Uhr morgens auf.
    note: '*Wstaje* ist die 3. Person Singular von *wstawać* (aufstehen).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: Die Abfahrtszeit des Zuges
    gloss: Der Zug fährt um 4 Uhr nachmittags ab.
    note: '*Odjeżdża* ist die 3. Person Singular von *odjeżdżać* (abfahren).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Treffen
    gloss: Treffen
    note: Dasselbe Wort kennen Sie aus Lektion 3 (*Kiedy jest spotkanie?*), als Ewa und Marek Tag und Datum für ein weiteres Treffen vereinbarten.
    example_gloss: Das Treffen ist am Freitag.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Nach der Uhrzeit für ein Treffen fragen
    gloss: Um wie viel Uhr können wir uns am Freitag, dem 15. Mai, treffen?
    note: 'Verbindet das *o której godzinie* dieser Lektion mit Tag und Datum aus Lektion 3: Ewa und Marek haben sich schon auf Freitag, den 15. Mai, geeinigt und müssen nun die genaue Uhrzeit festlegen.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Eine Uhrzeit vorschlagen
    gloss: Vielleicht um 4 Uhr nachmittags?
    note: '*Może* allein bedeutet „vielleicht“ – eine natürliche, höfliche Art, eine Uhrzeit vorzuschlagen.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Bestätigen, dass eine Uhrzeit passt
    gloss: 4 Uhr nachmittags passt mir.
    note: 'Dasselbe Muster *[time] + mi + odpowiada* wie bei *Piątek mi odpowiada* in Lektion 3: Die Uhrzeit selbst ist das grammatische Subjekt, und *odpowiadać* steht für die Person immer im Dativ (*mi*, „mir“).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Den ganzen Plan bestätigen
    gloss: Bis zum 15. Mai um 4!
    note: Greift den Abschiedsgruß *Do zobaczenia* aus Lektion 1 wieder auf, hier mit Datum und Uhrzeit.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa fragt nach der Uhrzeit
    gloss: Ewa fragt Marek, um wie viel Uhr sie sich am Freitag, dem 15. Mai, treffen können.
    note: Genau die Eingangsfrage dieser Lektion.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek schlägt 16 Uhr vor
    gloss: Marek schlägt 4 Uhr nachmittags vor.
    note: Ein höflicher Vorschlag, keine feste Aussage – das drückt *może* aus.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa sagt zu
    gloss: Ewa sagt, dass ihr 4 Uhr nachmittags passt.
    note: Dieselbe Dativkonstruktion wie im Austausch „Freitag passt mir“ aus Lektion 3.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek schließt die Verabredung ab
    gloss: Marek sagt „Super!“ und „Bis zum 15. Mai um 4!“
    note: '*Świetnie* greift den Ausruf der Begeisterung aus Lektion 3 wieder auf.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa verabschiedet sich
    gloss: Ewa verabschiedet sich ebenfalls.
    note: Der kürzestmögliche Abschluss – nur der Abschiedsgruß selbst.
