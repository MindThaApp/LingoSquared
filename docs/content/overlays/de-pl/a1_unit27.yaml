    gloss: Welchen Sport machst du?
  pl.a1.unit27.lesson01.teach.gram_w_pilke:
    title: Ich spiele Fußball
    gloss: Ich spiele Fußball.
    note: '*Gram w piłkę nożną* (wörtlich „ich spiele in Fußball“) verwendet *grać w* + Akkusativ; andere Sportarten brauchen andere Verben. Siehe Grammatikhinweis.'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: Für jede Sportart ein Verb
    gloss: 'Jede Sportart hat ihr eigenes Verb: *gram w piłkę nożną*, *biegam*, *pływam*, *ćwiczę jogę*.'
    note: Mit nur zwei Konstruktionen decken Sie auf diesem Niveau alle Sportarten ab – Sie müssen nicht für jede Sportart ein eigenes Verb lernen.
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
    title: Mal pro Woche
    gloss: Mal pro Woche
    example_gloss: Ich mache zweimal pro Woche Yoga.
  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: Sie kennen schon *codziennie* (jeden Tag) und *często* (oft). *Dwa razy w tygodniu* (zweimal pro Woche) ist eine neue, genauere Art, die Häufigkeit anzugeben.
    note: Erweitert den Wortschatz zur Häufigkeit, der in der Hobby-Lektion schon eingeführt wurde.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: Ich mache zweimal pro Woche Yoga
    gloss: Ich mache zweimal pro Woche Yoga.
  pl.a1.unit27.lesson02.teach.marek_czesto_gra:
