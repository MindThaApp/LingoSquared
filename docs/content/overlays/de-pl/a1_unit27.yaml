    gloss: Marek spielt oft Fußball.
    note: '*Często* (oft) ist das Häufigkeitsadverb und steht vor dem Verb: *Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport vs gram w
    gloss: '*Uprawiam sport* sagt allgemein, dass man Sport treibt. Ein Verb wie *gram w piłkę nożną* nennt die konkrete Sportart. Beides ist korrektes Polnisch.'
    note: '*Uprawiać sport* ist das allgemeine Verb aus der Lektion über Hobbys; Verben wie *grać w* nennen die konkrete Sportart. Das eine ist allgemein, das andere konkret.'
