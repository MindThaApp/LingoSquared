  pl.a1.unit27.lesson06.teach.ewa_moze_pocwiczymy:
    title: Ewa schlägt etwas vor
    gloss: 'Ewa: Wollen wir vielleicht zusammen trainieren?'
  pl.a1.unit27.lesson06.teach.moze_pocwiczymy_razem:
    title: Może poćwiczymy ...?
    gloss: '*Może poćwiczymy ...?* („vielleicht trainieren wir?“) schlägt vor, etwas gemeinsam zu tun; dieses Muster kennen Sie vielleicht schon aus einer früheren Lektion.'
    note: Verwendet genau die Konstruktion für Vorschläge aus der Lektion über Pläne.
  pl.a1.unit27.lesson06.teach.kasia_tak_fajnie:
