  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać ändert sich mit der Person
    gloss: '*Biegać* (laufen, joggen) ändert seine Endung je nach Person: *biegam* (ich laufe), *biegasz* (du läufst), *biega* (er läuft).'
    note: 'Polnische Verben haben für jede Person eine andere Endung, deshalb wird das Personalpronomen meist weggelassen: *biegam*, *biegasz*, *biega*.'
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
    title: Marek reagiert
    gloss: 'Marek: Schön, ich spiele dort oft Fußball.'
  pl.a1.unit27.lesson05.teach.ewa_cwiczy_joge:
    title: Ewa und Kasia über Sport
    gloss: Ewa macht zweimal pro Woche Yoga. Sie liebt ruhige Bewegung. Kasia macht kein Yoga, aber sie liebt es zu schwimmen. Kasia schwimmt oft, fast jede Woche. Welchen Sport treibst du?
    note: Stellt in einem kurzen Lesetext zwei verschiedene Sportarten und zwei verschiedene Häufigkeitsangaben gegenüber.
    glosses:
      ćwiczy: macht
      dwa: zwei
      razy: Mal
      tygodniu: Woche
      jogę: Yoga
      uwielbia: liebt
      spokojny: ruhig
      ruch: bewegen
      pływać: schwimmen
      pływa: schwimmt
      często: oft
      prawie: fast
      jaki: welchen
      sport: Sport
