teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Gestern
    gloss: gestern
    note: Das grundlegende Zeitwort, um über einen vergangenen, abgeschlossenen Tag zu sprechen – es passt gut zu den Vergangenheitsformen dieser Lektion.
    example_gloss: Ich war gestern im Kino.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: Was war gestern los?
    gloss: Was war gestern los?
    note: So bitten Sie ganz natürlich darum, von einem aktuellen Ereignis zu erzählen – było ändert sich nicht, egal wer antwortet, daher passt die Frage bei jedem Gegenüber.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było ist die Vergangenheitsform von być (sein) im Neutrum („es“). Sie passt zu co (was) und steht, wenn man allgemein fragt, was geschehen ist: Co było wczoraj? Es ist immer dasselbe Wort, egal wer antwortet.'
    note: '*Było* ist die neutrale Form „es war“. Sie richtet sich nach *co* (was), nicht nach der Person, die Sie fragen. In einer offenen Frage wie *Co było wczoraj?* bedeutet sie daher „es gab“ bzw. „was war los“.'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: Ich war (Mann / Frau)
    gloss: ich war (von einem Mann gesagt) / ich war (von einer Frau gesagt)
    note: 'Die polnische Vergangenheit zeigt das Geschlecht der sprechenden Person: byłem, wenn ein Mann spricht, byłam, wenn eine Frau spricht. Beide bedeuten genau „ich war“.'
    example_gloss:
    - Ich war gestern im Kino.
    - Ich war gestern im Kino.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Vergangenheit: -em oder -am'
    gloss: 'Verben in der Vergangenheit enden je nach Geschlecht der sprechenden Person unterschiedlich: -em, wenn ein Mann spricht (byłem), -am, wenn eine Frau spricht (byłam). Das gilt für jedes Verb in der Vergangenheit, nicht nur für być.'
    note: 'Achten Sie auf die letzten Buchstaben: *-em* zeigt, dass ein Mann spricht, *-am*, dass eine Frau spricht. Dasselbe Muster begegnet Ihnen in dieser Lektion bei jedem Verb in der Vergangenheit.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: Im Kino
    gloss: 'Kino ändert nach w seine Endung: idę do kina (wohin?) verwendet eine andere Form als jestem w kinie (wo?). W kinie ist der Lokativ – er sagt, WO etwas geschieht, nicht, wohin jemand geht.'
    note: 'Zwei verschiedene Endungen, zwei verschiedene Fragen: *do kina* antwortet auf „wohin?“ (das kennen Sie aus der Lektion über Pläne), *w kinie* auf „wo?“ – verwechseln Sie sie nicht.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Ich war gestern im Kino (Mann)
    gloss: Ich war gestern im Kino.
    note: Verbindet byłem, wczoraj und w kinie – so berichtet ein Mann, wo er war.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Ich war gestern im Kino (Frau)
    gloss: Ich war gestern im Kino.
    note: Derselbe Satz mit byłam – so berichtet eine Frau, wo sie war.
  pl.a1.unit12.lesson02.teach.film:
    title: Film
    gloss: Film
    note: Ein Alltagswort, um zu erzählen, was Sie gesehen haben – kommt ständig vor, wenn man von einem Kinobesuch berichtet.
    example_gloss: Ich habe einen guten Film gesehen.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Gut
    gloss: gut
    note: 'Dobry kennen Sie schon aus dzień dobry (guten Tag) – hier steht es allein als gewöhnliches Adjektiv: „gut“.'
    example_gloss: Ein sehr guter Film!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: Ich sah (Mann / Frau)
    gloss: ich sah (von einem Mann gesagt) / ich sah (von einer Frau gesagt)
    note: Zobaczyć beschreibt ein einmaliges, abgeschlossenes Sehen (im Unterschied zu widzieć, dem andauernden Sehen) – zobaczyłem, wenn ein Mann spricht, zobaczyłam, wenn eine Frau spricht; es gilt dasselbe Muster -em/-am wie bei byłem/byłam.
    example_gloss:
    - Ich habe einen guten Film gesehen.
    - Ich habe einen guten Film gesehen.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: Dasselbe Muster wie bei byłem/byłam
    gloss: 'Dasselbe Muster wie bei byłem/byłam: zobaczyłem sagt ein Mann, zobaczyłam eine Frau. Zobaczyć ist ein vollendetes Verb – es beschreibt ein einmaliges, abgeschlossenes Ereignis.'
    note: 'Gleiche Endung, neues Verb: *zobaczyłem/zobaczyłam* folgt genau dem Muster, das Sie gerade bei *byłem/byłam* gelernt haben.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: Ich machte (Mann / Frau)
    gloss: ich machte / ich tat (von einem Mann gesagt) / ich machte / ich tat (von einer Frau gesagt)
    note: Zrobić steht für „machen“ und „tun“ bei einer einmaligen, abgeschlossenen Handlung – zrobiłem für einen Mann, zrobiłam für eine Frau, wieder dasselbe Muster.
    example_gloss:
    - Ich habe das Mittagessen gemacht.
    - Ich habe das Mittagessen gemacht.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Mittagessen
    gloss: Mittagessen / Hauptmahlzeit
    note: Obiad kennen Sie vielleicht schon aus der Lektion über den Tagesablauf – hier ist es die Hauptmahlzeit des Tages, die Marek zubereitet.
    example_gloss: Das ist ein köstliches Mittagessen.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Lecker
    gloss: lecker / köstlich
    note: Eine herzliche, alltägliche Art, Essen zu loben – passt ganz natürlich direkt nach obiad.
    example_gloss: Das ist ein köstliches Mittagessen.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Was für ein / welcher
    gloss: was für ein / welcher
    note: 'Jaki kennen Sie schon aus Fragen nach Telefonnummern und Wochentagen – hier fragt es auf dieselbe Weise nach einem bestimmten Detail: welcher Film?'
    example_gloss: Was ist das für ein Film?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Kurze Ein-Wort-Fragen
    gloss: Im Gespräch kann man eine kurze Frage mit nur einem Wort stellen, z. B. Pyszny? statt der vollständigen Frage Czy obiad był pyszny? – das klingt natürlich und schnell, ganz wie im Alltag.
    note: Im echten Gespräch lässt man den ganzen Satz weg, wenn der Zusammenhang klar ist – *Pyszny?* allein bedeutet „War es lecker?“.
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek fragt, was los war
    gloss: Hallo Ewa! Was war gestern los?
    note: Die erste Frage dieser Lektion wird wieder aufgegriffen und eröffnet nun ein echtes Gespräch.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa war im Kino
    gloss: Ich war im Kino! Ich habe einen guten Film gesehen.
    note: Byłam (weiblich) und zobaczyłam (weiblich) zeigen beide, dass Ewa spricht.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek fragt nach dem Film
    gloss: Was für ein Film?
    note: Eine kurze, natürliche Nachfrage mit jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa antwortet und fragt zurück
    gloss: Sehr gut! Und du?
    note: A ty? (und du?) gibt das Wort ohne neue Grammatik an Marek zurück.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek hat Mittagessen gemacht
    gloss: Ich habe das Mittagessen gemacht!
    note: Zrobiłem (männlich) zeigt, dass Marek spricht – sein eigenes abgeschlossenes Ereignis des Tages.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa fragt, ob es lecker war
    gloss: Lecker?
    note: Eine Ein-Wort-Frage, genau das Muster aus der Grammatikerklärung dieser Lektion.
