teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Es tut weh
    gloss: 'Boleć (wehtun), Präsens: boli (er/sie/es) und bolą (sie, Plural). Głowa mnie boli bedeutet „Mir tut der Kopf weh“ – wörtlich „Der Kopf schmerzt mich“.'
    note: Für Schmerzen verwendet man *boleć* im Präsens nur in diesen zwei Formen – das Körperteil ist das Subjekt, und *mnie* sagt, wessen Körperteil es ist. Eine Form für „ich tue weh“ müssen Sie hier also nicht lernen.
  pl.a1.unit16.lesson01.teach.glowa:
    title: Kopf
    gloss: Kopf
    note: Das, was man am häufigsten als schmerzend nennt.
    example_gloss: Mir tut der Kopf weh.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: Hals
    gloss: Hals
    note: Nützlich, um eine Erkältung oder Halsschmerzen zu beschreiben.
    example_gloss: Mir tut der Hals weh.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Magen
    gloss: Bauch
    note: Nützlich nach einem großen Essen oder wenn man etwas nicht verträgt.
    example_gloss: Mir tut der Bauch weh.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Zähne
    gloss: Zähne
    note: Hier immer im Plural, so wie es Muttersprachler im Polnischen sagen – deshalb steht dabei *bolą* (nicht *boli*).
    example_gloss: Mir tun die Zähne weh.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: Was tut Ihnen weh?
    gloss: Was tut dir weh?
    note: Die natürliche Frage an jemanden, dem es nicht gut geht.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: Wie fühlst du dich?
    gloss: 'Czuć się (sich fühlen): czuję się (ich), czujesz się (du). Wie fühlst du dich?'
    note: Vorerst nur zwei Formen – *czuję* für sich selbst, *czujesz*, um jemand anderen zu fragen.
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Gut und schlecht
    gloss: Mir geht es gut. Mir geht es schlecht. – dobrze kennen Sie schon; źle ist das Gegenteil.
    note: Dasselbe *dobrze*, das Sie seit der allerersten Lektion benutzen, jetzt mit seinem Gegenteil.
  pl.a1.unit16.lesson02.teach.zle:
    title: Schlecht
    gloss: schlecht
    note: Das Wort, mit dem Sie sagen, dass es Ihnen nicht gut geht.
    example_gloss: Mir geht es schlecht.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Fieber
    gloss: Fieber
    note: Ein häufiges, grundlegendes Symptom, das man nennen kann.
    example_gloss: Ich habe Fieber.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, hat – noch einmal
    gloss: Ewa, ma – Sie kennen diesen Namen und diese Form des Verbs mieć (haben) schon aus früheren Lektionen (Mam, masz, ma).
    note: Eine kurze Erinnerung, bevor diese Lektion beides verwendet.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Krank
    gloss: krank (männlich) / krank (weiblich)
    note: Dasselbe Muster -y/-a, das Sie schon von *młodszy/starsza* kennen – *chory* für einen Mann, *chora* für eine Frau.
    example_gloss:
    - Er ist krank.
    - Sie ist krank.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa geht es nicht gut
    gloss: Mir geht es schlecht. Ich habe Fieber.
    note: Ewa beschreibt ihre eigenen Symptome – dasselbe sagt sie später noch einmal im Dialog dieser Einheit.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, noch einmal
    gloss: Marek – Sie kennen diesen Namen schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: Und, noch einmal
    gloss: I – Sie kennen dieses Wort schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: Bitte und Wasser, noch einmal
    gloss: Proszę und wodę – beide Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: Danke, noch einmal
    gloss: Dziękuję – Sie kennen dieses Wort schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: Sich ausruhen
    gloss: sich ausruhen
    note: Wird mit *Proszę* genauso verwendet, wie Sie es schon von der Bitte kennen, geradeaus zu gehen oder in eine bestimmte Richtung abzubiegen – *Proszę* + Infinitiv, ein Imperativ ist nicht nötig.
    example_gloss: Bitte ruhen Sie sich aus.
  pl.a1.unit16.lesson03.teach.pic:
    title: Trinken
    gloss: trinken
    note: Ein weiterer Infinitiv, der genauso auf *Proszę* folgt.
    example_gloss: Bitte trinken Sie Wasser.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek fragt, wie es Ewa geht
    gloss: Ewa, wie geht es dir?
    note: Marek merkt, dass etwas nicht stimmt, und fragt direkt nach.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa beschreibt ihre Symptome
    gloss: Mir geht es schlecht. Mein Hals tut weh und ich habe Fieber.
    note: Ewa nennt klar zwei Symptome – dieselben, die sie schon weiter oben in dieser Einheit genannt hat.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek gibt einen einfachen Rat
    gloss: Bitte ruhen Sie sich aus und trinken Sie Wasser.
    note: Ein einfacher Rat ohne Diagnose – keine medizinische Anweisung, nur gesunder Menschenverstand.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa bedankt sich bei Marek
    gloss: Gut, danke, Marek.
    note: Ein einfacher, vertrauter Abschluss des Gesprächs.
