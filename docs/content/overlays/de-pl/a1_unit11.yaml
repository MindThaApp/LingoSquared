teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: Wollen, ich will
    gloss: wollen; ich will
    note: Chcieć ist der Infinitiv; chcę ist die alltägliche Form der ersten Person, mit der Sie sagen, was Sie möchten.
    example_gloss: Ich will ins Kino gehen.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Du willst
    gloss: du willst
    note: Chcesz ist die informelle „du“-Form und wird genauso verwendet wie masz und jesteś – genau die Form, mit der Sie eine Freundin oder einen Freund fragen, was sie oder er möchte.
    example_gloss: Möchtest du Kaffee?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Ich will, du willst
    gloss: 'Chcę, chcesz – dasselbe Muster wie bei masz (haben) und jesteś (sein): chcesz ist die „du“-Form (2. Person), die man benutzt, wenn man jemanden fragt, was er oder sie möchte.'
    note: 'In dieser Lektion geht es um mehr als nur „ich“: *chcę* (ich will) und *chcesz* (du willst) folgen genau demselben Personenmuster wie *masz* und *jesteś*, die Sie schon kennen – nur eben bei einem neuen Verb.'
  pl.a1.unit11.lesson01.teach.kino:
    title: Das Kino
    gloss: Kino
    note: Das alltägliche Wort für „Kino“ – es kommt beim Verabreden ständig vor.
    example_gloss: Das ist das Kino.
  pl.a1.unit11.lesson01.teach.razem:
    title: Zusammen
    gloss: zusammen
    note: 'Razem bedeutet beim Einkaufen auch „insgesamt“ (vielleicht erinnern Sie sich an die Einkaufslektion) – hier steht es in seiner anderen alltäglichen Bedeutung: „zusammen“.'
    example_gloss: Möchtest du zusammen gehen?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: Möchtest du ins Kino gehen?
    gloss: Möchtest du ins Kino gehen?
    note: Czy leitet eine Ja-/Nein-Frage ein; chcesz iść do kina fragt, was der andere gern tun möchte – die wichtigste Art, einen Plan vorzuschlagen.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: Möchtest du am Freitag zusammen ins Kino gehen?
    gloss: Möchtest du am Freitag zusammen ins Kino gehen?
    note: 'Der vollständige Vorschlag: razem (zusammen) und w piątek (am Freitag), angefügt an die Frage, die Sie gerade gelernt haben.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: Können, ich kann
    gloss: können; ich kann
    note: 'Móc ist der Infinitiv, mogę die Form für „ich“ – vielleicht erinnern Sie sich an możemy („wir können“) aus den früheren Lektionen zu Datum und Uhrzeit: Es ist dasselbe Verb, nur im Singular.'
    example_gloss: Ich kann am Freitag kommen.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Du kannst
    gloss: du kannst
    note: Możesz ist die vertraute „du“-Form, dasselbe Muster der 2. Person wie bei chcesz – man fragt damit, ob jemand etwas tun kann.
    example_gloss: Kannst du am Samstag?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: Kommen
    gloss: kommen
    note: Das Verb für das Kommen zu einem Treffen – passt gut zu mogę/możesz, um zu sagen, wer kann oder nicht kann.
    example_gloss: Ich möchte am Freitag kommen.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Ich kann, du kannst
    gloss: 'Móc: mogę, możesz – dieselbe 2. Person (du) wie bei chcesz. Mogę plus Infinitiv sagt, was man tun kann: mogę przyjść (ich kann kommen), mogę iść (ich kann gehen).'
    note: '*Mogę* + ein einfaches Verb im Infinitiv sagt, was man tun kann – *mogę przyjść* („ich kann kommen“) und *mogę iść* („ich kann gehen“) folgen beide diesem einfachen Muster.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: Gern
    gloss: gern
    note: Eine herzliche, begeisterte Art, einen Plan anzunehmen – oft mit tak (ja) oder bardzo (sehr) für noch mehr Wärme.
    example_gloss: Ja, sehr gern!
  pl.a1.unit11.lesson02.teach.niestety:
    title: Leider
    gloss: leider
    note: Die natürliche Abmilderung, um einen Plan höflich abzulehnen – fast immer gefolgt von nie mogę (ich kann nicht).
    example_gloss: Leider kann ich nicht.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: Am Samstag
    gloss: 'W + Wochentag: Männliche Wochentage (piątek, poniedziałek, czwartek) ändern ihre Endung nicht – w piątek. Weibliche Wochentage (sobota, środa, niedziela) erhalten die Akkusativendung -ę, genau wie kawa -> kawę – w sobotę.'
    note: 'Nicht alle Wochentage verhalten sich nach *w* gleich: Weibliche Namen wie *sobota* werden zu *sobotę* – dieselbe Endung *-a* -> *-ę*, die Sie schon von *kawa* -> *kawę* und *herbata* -> *herbatę* kennen. Männliche Wochentage wie *piątek* bleiben unverändert.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: Kannst du am Samstag kommen?
    gloss: Kannst du am Samstag kommen?
    note: Verbindet możesz, przyjść und die neue Form w sobotę – eine vollständige Frage nach einem anderen Tag.
  pl.a1.unit11.lesson03.teach.moze:
    title: Vielleicht, wie wäre es mit
    gloss: vielleicht / wie wäre es mit
    note: Das Wort, um eine Alternative vorzuschlagen – es kommt vor, wenn der erste Plan nicht klappt und man etwas anderes vorschlagen möchte.
    example_gloss: Wie wäre es mit Samstag?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może vs. mogę
    gloss: 'Może und mogę sehen ähnlich aus, bedeuten aber Verschiedenes: może („vielleicht“) schlägt etwas Neues vor; mogę (die „ich“-Form des Verbs, „ich kann“) sagt, was man tun kann.'
    note: 'Auf dem Papier leicht zu verwechseln: *może* („vielleicht“, hier als Vorschlag) und *mogę* („ich kann“, das Verb in der 1. Person) haben im Satz verschiedene Aufgaben, obwohl sie dieselbe Wurzel haben – achten Sie auf den letzten Buchstaben.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: Um wie viel Uhr?
    gloss: Um wie viel Uhr?
    note: Die Standardfrage nach einer genauen Uhrzeit, wenn der Tag schon feststeht – vielleicht erinnern Sie sich an o której aus der früheren Lektion zur Uhrzeit.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa schlägt das Kino vor
    gloss: Ewa fragt Marek, ob er am Freitag ins Kino gehen möchte.
    note: Die allererste Frage dieser Lektion, jetzt in einem echten Gespräch.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek kann am Freitag nicht
    gloss: Marek sagt, dass er am Freitag leider nicht kann.
    note: Niestety mildert die Absage ab, bevor nie mogę sie klar ausspricht.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek schlägt Samstag vor
    gloss: 'Marek fragt: Wie wäre es mit Samstag?'
    note: Może bietet eine Alternative an, statt das Gespräch mit einer Absage zu beenden.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa sagt gern zu
    gloss: 'Ewa sagt: Am Samstag? Sehr gern!'
    note: Greift den vorgeschlagenen Tag auf (mit der Form w sobotę), bevor sie mit chętnie zusagt.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa fragt nach der Uhrzeit
    gloss: 'Ewa fragt: Um wie viel Uhr?'
    note: Wenn der Tag feststeht, fehlt nur noch die Uhrzeit.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek bestätigt die Uhrzeit
    gloss: 'Marek sagt: Um vier Uhr nachmittags.'
    note: Schließt die Verabredung mit einer festen Uhrzeit ab und greift das Muster für Uhrzeiten aus den früheren Lektionen zu Uhrzeit und Alltag auf.
