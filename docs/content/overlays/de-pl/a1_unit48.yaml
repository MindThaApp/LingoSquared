  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Hören Sie den Dialog und wählen Sie, welchen Film Nina sehen möchte.
    correct_option: Den neuen Film.
    distractors:
    - Die Kindervorstellung.
    - Irgendein Film ist ihr recht.
    - Sie sagt es nicht.
    accepted_answers:
    - value: Den neuen Film.
      status: correct
    feedback: Nina möchte *nowy film*. Das Adjektiv *nowy* richtet sich nach dem maskulinen *film*; als unbelebtes Objekt bleibt es im Akkusativ unverändert.
    prompt_blocks:
    - Welchen Film möchte Nina sehen?
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Hören Sie den Dialog und wählen Sie, wonach Iga Nina als Nächstes fragt.
    correct_option: Für welche Uhrzeit sie die Vorstellung möchte.
    distractors:
    - Ob sie Popcorn möchte.
    - Ob sie eine Quittung möchte.
    - Sie fragt nichts.
    accepted_answers:
    - value: Für welche Uhrzeit sie die Vorstellung möchte.
      status: correct
    feedback: Iga fragt *a na którą godzinę?* *Na* plus Akkusativ steht für die Uhrzeit, für die eine Vorstellung gebucht wird, und *którą* richtet sich nach dem femininen *godzina*.
    prompt_blocks:
    - Wonach fragt Iga Nina als Nächstes?
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Hören Sie den Dialog und wählen Sie, für welche Uhrzeit Nina die Vorstellung möchte.
    correct_option: Acht Uhr.
    distractors:
    - Sieben Uhr.
    - Sechs Uhr.
    - Das sagt der Dialog nicht.
    accepted_answers:
    - value: Acht Uhr.
      status: correct
    feedback: Nina sagt *na ósmą* (für acht Uhr). Die Ordnungszahl *ósma* richtet sich nach dem femininen *godzina* und steht nach *na* im Akkusativ.
    prompt_blocks:
    - Um wie viel Uhr möchte Nina die Vorstellung?
