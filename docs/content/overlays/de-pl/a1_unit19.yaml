teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: Was für eine, ist, heute, nicht – noch einmal
    gloss: Jaka, jest, Dziś, nie – diese Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Wiederholung, bevor diese Lektion sie nutzt, um über das Wetter zu sprechen.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: Wetter
    gloss: Wetter
    note: Das allgemeine Wort für das Wetter bzw. die Wetterlage.
    example_gloss: Wie ist das Wetter?
  pl.a1.unit19.lesson01.teach.zimno:
    title: Kalt
    gloss: kalt
    note: Beschreibt die Temperatur – die Form ändert sich nicht nach Geschlecht.
    example_gloss: Es ist kalt.
  pl.a1.unit19.lesson01.teach.goraco:
    title: Heiß
    gloss: heiß
    note: Das Gegenteil von „*zimno*“ – auch hier ändert sich die Form nicht nach Geschlecht.
    example_gloss: Es ist heiß.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: Es ist kalt, es ist heiß
    gloss: 'Jest zimno. Jest gorąco. – So beschreibt man im Polnischen das Wetter: „*jest*“ plus ein Wetterwort, ohne Anpassung an das Geschlecht.'
    note: Dasselbe einfache Muster funktioniert für jedes Wetterwort in dieser Lektion.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: Wie ist das Wetter?
    gloss: Wie ist das Wetter?
    note: Eine natürliche Art, nach dem aktuellen Wetter zu fragen.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: Heute ist es kalt
    gloss: Heute ist es kalt.
    note: Der Satz, auf dem diese ganze Lektion für das heutige Wetter aufbaut.
  pl.a1.unit19.lesson02.teach.pada:
    title: Es regnet
    gloss: es regnet
    note: Wird allein, ohne Subjekt, verwendet – so sagt man im Polnischen ganz normal, dass es regnet.
    example_gloss: Heute regnet es.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Schnee
    gloss: Schnee
    note: Das Wort für Schnee – zusammen mit „*pada*“ bedeutet es „es schneit“.
    example_gloss: Es schneit.
  pl.a1.unit19.lesson02.teach.mgla:
    title: Nebel
    gloss: Nebel
    note: Eine weitere häufige Wetterlage.
    example_gloss: Es ist neblig.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: Gut
    gloss: Pogoda jest dobra. – „*dobra*“ passt zu femininen Substantiven wie „*pogoda*“.
    note: Die feminine Form von „*dobry*“ (wie in „*Dzień dobry*“) – dasselbe Muster -y/-a wie bei *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Schrecklich
    gloss: Jaka straszna pogoda! – „*straszna*“ passt ebenfalls zu „*pogoda*“, genau wie „*dobra*“.
    note: Ein starkes Wort – verwenden Sie es für wirklich schlechtes Wetter.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: Was für ein schreckliches Wetter!
    gloss: Was für ein schreckliches Wetter!
    note: Ein natürlicher Ausruf bei schlechtem Wetter.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: Das Wetter ist gut
    gloss: Das Wetter ist gut.
    note: Das Wetterwort aus dem Anfang dieser Lektion wird wieder verwendet.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: Ja, und, ich, auch – noch einmal
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo – diese Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Wiederholung vor dem Dialog dieser Lektion.
  pl.a1.unit19.lesson03.teach.bo:
    title: Weil
    gloss: weil
    note: Verbindet einen Plan mit dem Wetter als Grund.
    example_gloss: Ich gehe nicht in den Park, weil es regnet.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: Ich will nicht gehen, weil es regnet
    gloss: Ich will nicht in den Park gehen, weil es regnet.
    note: Eine Wetterbeschreibung mit einem echten Plan – genau darauf arbeitet diese Lektion hin.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: In Krakau – noch einmal
    gloss: W Krakowie – das kennen Sie schon aus früheren Lektionen, z. B. „Ona mieszka w Krakowie“ (Sie wohnt in Krakau).
    note: Eine kurze Wiederholung, bevor der Dialog dieser Lektion das Wetter an zwei Orten vergleicht.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek fragt nach dem Wetter
    gloss: Wie ist das Wetter heute?
    note: Marek eröffnet das Gespräch mit der Frage nach dem heutigen Wetter.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa antwortet
    gloss: Es regnet. Es ist kalt.
    note: Ewa beschreibt das tatsächliche Wetter von heute.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek reagiert und macht einen Plan
    gloss: Was für ein schreckliches Wetter! Ich will nicht in den Park gehen, weil es regnet.
    note: Marek reagiert auf das Wetter und nennt seinen Plan deswegen.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa stimmt zu
    gloss: Ich gehe auch nicht in den Park.
    note: Ewa fasst denselben Plan wie Marek.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek fragt nach Krakau
    gloss: Und in Krakau? Wie ist das Wetter dort?
    note: Marek lenkt das Gespräch auf das Wetter in einer anderen Stadt.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa antwortet
    gloss: In Krakau schneit es. Dort ist es sehr kalt.
    note: Ewa beschreibt eine andere, kältere Wetterlage in Krakau.
