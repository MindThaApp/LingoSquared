teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Ich bin Ingenieur / Lehrerin
    gloss: Ich bin Ingenieur. Ich bin Lehrerin. -- 'inżynier' und 'nauczycielka' ändern nach 'Jestem' ihre Endung.
    note: Zum ersten Mal in diesem Kurs ändert sich die Endung eines Wortes, um den Beruf auszudrücken -- vorerst gilt das nur für diese beiden Berufsbezeichnungen.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Ingenieur
    gloss: Ingenieur/Ingenieurin
    note: Im Alltag bleibt dieses Wort auch für eine Frau meist *inżynier*.
    example_gloss: Marek ist Ingenieur.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Lehrerin
    gloss: Lehrer / Lehrerin
    note: Anders als *inżynier* verändert sich diese Berufsbezeichnung nach dem Geschlecht -- *nauczyciel* für einen Mann, *nauczycielka* für eine Frau.
    example_gloss:
    - Er ist Lehrer.
    - Ewa ist Lehrerin.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek und Ewa, noch einmal
    gloss: Marek, Ewa -- Sie kennen diese Namen schon aus früheren Lektionen.
    note: Eine kurze Erinnerung, bevor diese Lektion beide Namen verwendet.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Ist -- noch einmal
    gloss: Jest -- Sie kennen dieses Wort schon aus früheren Lektionen, z. B. 'Dom jest tam' (Das Haus ist dort).
    note: Eine kurze Erinnerung, bevor diese Lektion es verwendet, um über den Beruf einer Person zu sprechen.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Mareks Beruf
    gloss: Marek ist Ingenieur.
    note: Die Tatsache über Marek, auf der diese ganze Einheit aufbaut.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Ewas Beruf
    gloss: Ewa ist Lehrerin.
    note: Die Tatsache über Ewa, auf der diese ganze Einheit aufbaut.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: Arbeiten -- du arbeitest
    gloss: 'Pracować (pracuję kennen Sie schon aus früheren Lektionen): pracuję (ich), pracujesz (du). Wo arbeitest du?'
    note: Vorerst nur zwei Formen -- *pracuję* für sich selbst, *pracujesz*, um jemand anderen zu fragen; das gleiche Muster wie bei *czuć się* in der letzten Einheit.
  pl.a1.unit17.lesson02.teach.szkola:
    title: Schule
    gloss: Schule
    note: Der Ort, an dem eine Lehrerin wie Ewa arbeitet.
    example_gloss: Ich arbeite in einer Schule.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Büro
    gloss: Büro
    note: Der Ort, an dem ein Ingenieur wie Marek arbeitet.
    example_gloss: Ich arbeite in einem Büro.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: In der Schule, im Büro
    gloss: 'W + Arbeitsort: w szkole, w biurze -- das gleiche Muster wie w Warszawie oder w Krakowie.'
    note: Es ist dasselbe Prinzip wie bei den Städtenamen, die Sie schon kennen (*w Warszawie*, *w Krakowie*) -- die Endung ändert sich ein wenig, um *in* diesem Ort auszudrücken.
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: Wo arbeitest du?
    gloss: Wo arbeitest du?
    note: Die natürliche Frage, wenn man jemanden nach seiner Arbeit fragen möchte.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: Und du -- noch einmal
    gloss: A ty -- Sie kennen diesen Ausdruck schon aus früheren Lektionen.
    note: Eine kurze Erinnerung vor dem Dialog dieser Lektion.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek fragt Ewa nach ihrer Arbeit
    gloss: Wo arbeitest du, Ewa?
    note: Marek eröffnet das Gespräch mit einer direkten Frage.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Ewa antwortet
    gloss: Ich arbeite in einer Schule. Ich bin Lehrerin.
    note: Ewa nennt sowohl ihren Arbeitsort als auch ihren Beruf -- dieselben Angaben wie weiter oben in dieser Einheit.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa fragt Marek zurück
    gloss: Und du, Marek? Wo arbeitest du?
    note: Ewa gibt die Frage an Marek zurück.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Marek antwortet
    gloss: Ich arbeite in einem Büro. Ich bin Ingenieur.
    note: Marek nennt sowohl seinen Arbeitsort als auch seinen Beruf -- dieselben Angaben wie weiter oben in dieser Einheit.
