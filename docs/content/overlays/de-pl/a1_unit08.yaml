teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Bank, Post
    gloss: Bank; Post
    note: Zwei alltägliche Erledigungen – bank ist ein direktes Lehnwort; poczta ist der Ort, an dem man einen Brief oder ein Paket aufgibt.
    example_gloss:
    - Das ist eine Bank.
    - Das ist eine Post.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Apotheke, Restaurant
    gloss: Apotheke; Restaurant
    note: Apteka ist der Ort, an dem man Medikamente kauft (kein allgemeiner Laden); restauracja ähnelt stark dem deutschen Wort „Restaurant“.
    example_gloss:
    - Das ist eine Apotheke.
    - Das ist ein Restaurant.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: Hotel; Park
    note: Beide Wörter sind fast identisch mit dem Deutschen – schriftlich wie mündlich leicht zu erkennen.
    example_gloss:
    - Das ist ein Hotel.
    - Das ist ein Park.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Wo ist + [Ort]?
    gloss: 'Wo ist + [Ort]? – Gdzie („wo“) plus jest („ist“) fragt nach einem Ort: Wo ist die Bank? Wo ist die Apotheke?'
    note: '*Gdzie* bedeutet „wo“, *jest* bedeutet „ist“ – zusammen ist *Gdzie jest...?* das alltägliche Fragemuster, um nach dem Ort von etwas zu fragen. Verwenden Sie es unverändert, wenn Sie nach einem einzelnen Ort fragen; bei mehreren Orten steht im Polnischen stattdessen *są* („sind“).'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: Wo ist die Bank?
    gloss: Wo ist die Bank?
    note: Das Muster aus der Grammatikinfo, angewandt auf das erste Ortswort dieser Lektion.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Nah, weit
    gloss: nah; weit
    note: Ein einfaches Gegensatzpaar, das direkt nach jest steht und beschreibt, wie nah oder weit ein Ort entfernt ist.
    example_gloss:
    - Der Park ist nah.
    - Das Hotel ist weit weg.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: Nicht weit
    gloss: nicht weit
    note: Wörtlich *nie* („nicht“) plus *daleko* („weit“) in einem Wort – eine sanftere, sehr häufige Art, jemandem zu versichern, dass ein Ort leicht zu erreichen ist.
    example_gloss: Die Apotheke ist nicht weit.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: Neben, gegenüber
    gloss: neben; gegenüber
    note: Beide beschreiben die Lage eines Ortes im Verhältnis zu einem Orientierungspunkt, nicht nur, wie nah er ist. Beide verlangen, dass das folgende Nomen im Genitiv steht – siehe die Grammatikinfo dieser Lektion.
    example_gloss:
    - Die Apotheke ist neben der Bank.
    - Das Restaurant ist gegenüber dem Hotel.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'Nach ''obok''/''naprzeciwko''/''blisko + Nomen'': der Genitiv'
    gloss: 'Nach „neben“/„gegenüber“/„nahe + Ort“: Genitiv – bank -> der Bank, hotel -> des Hotels, park -> des Parks. Die Apotheke ist neben der Bank. Das Restaurant ist gegenüber dem Hotel. Das Restaurant ist nahe beim Park.'
    note: '*Obok*, *naprzeciwko* und *blisko* (wenn danach ein Ort folgt und es nicht allein steht) verlangen alle den Genitiv, daher ändert das folgende Nomen seine Endung. Bei diesen drei regelmäßigen maskulinen Nomen bedeutet das: Es kommt ein *-u* an: *bank* wird zu *banku*, *hotel* zu *hotelu*, *park* zu *parku*. Allein stehend braucht *blisko* keinen Genitiv – *To jest blisko* („Das ist nah“) ist genauso richtig wie *blisko parku* („nahe beim Park“).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: Die Apotheke ist neben der Bank
    gloss: Die Apotheke ist neben der Bank.
    note: Das -u-Muster aus der Grammatikinfo in einem echten Satz – bank wird nach obok zu banku.
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Entschuldigung
    gloss: Entschuldigung / Verzeihung
    note: Die alltägliche Art, die Aufmerksamkeit einer fremden Person zu gewinnen, bevor man eine Frage stellt – es steht vor der Frage, nicht danach.
    example_gloss: Entschuldigung, wo ist die Bank?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa fragt nach der Apotheke
    gloss: Ewa sagt „Entschuldigung“ und fragt, wo die Apotheke ist.
    note: Przepraszam eröffnet die Frage, wie in der Vokabelnotiz dieser Lektion beschrieben – selbst bei jemandem, den sie kennt, wie Marek, ist es die höfliche Art, kurz zu unterbrechen, bevor man etwas fragt.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek sagt, wo die Apotheke liegt
    gloss: Marek sagt, die Apotheke ist nicht weit, neben der Bank.
    note: Verbindet niedaleko und obok + banku, beide aus der Grammatikinfo von Lektion 2.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa bedankt sich bei Marek und fragt nach dem Restaurant
    gloss: Ewa bedankt sich und fragt, wo das Restaurant ist.
    note: Dziękuję, bereits aus früheren Lektionen bekannt; A (und) verbindet die neue Frage mit der vorherigen.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek sagt, wo das Restaurant liegt
    gloss: Marek sagt, das Restaurant liegt gegenüber dem Hotel, in der Nähe des Parks.
    note: Naprzeciwko + hotelu (Genitiv, dasselbe Muster wie banku) sowie blisko für einen zweiten Orientierungspunkt.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa bedankt sich noch einmal bei Marek
    gloss: 'Ewa sagt: vielen Dank.'
    note: Bardzo (sehr) verstärkt dziękuję, genauso wie in proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek antwortet
    gloss: 'Marek sagt: gern geschehen.'
    note: Proszę bardzo, die übliche Antwort auf einen Dank, bereits aus der Einkaufslektion bekannt.
