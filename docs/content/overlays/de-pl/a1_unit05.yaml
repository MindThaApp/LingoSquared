teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: Familie
    gloss: Familie
    note: Das allgemeine Wort für „Familie“ – es bezeichnet die ganze Familie bzw. den ganzen Haushalt, nicht nur eine einzelne Verwandtschaftsbeziehung.
    example_gloss: Das ist meine Familie.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Mutter, Vater
    gloss: Mutter; Vater
    note: Die beiden wichtigsten Elternwörter – im Alltag hören Sie auch die liebevollen Formen mama und tata, aber matka und ojciec sind die neutralen Standardformen, die hier gelernt werden.
    example_gloss:
    - Das ist meine Mutter.
    - Das ist mein Vater.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Bruder, Schwester
    gloss: Bruder; Schwester
    note: Beides sind regelmäßige Substantive – brat ist maskulin, siostra ist feminin. Das ist wichtig für die Angleichung von mój/moja im Grammatikhinweis dieser Lektion.
    example_gloss:
    - Das ist mein Bruder.
    - Das ist meine Schwester.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Eltern
    gloss: Eltern
    note: Rodzice ist ein Plural für Personen (maskulin-personal) – es hat eine eigene Possessivform, moi (nicht mój/moja), wie Sie im Beispiel und im Grammatikhinweis dieser Lektion sehen.
    example_gloss: Meine Eltern wohnen in Warschau.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Mein: mój, moja, moi'
    gloss: mein Vater, mein Bruder – meine Mutter, meine Schwester – meine Eltern.
    note: 'Possessivpronomen richten sich im Polnischen nach dem Geschlecht des Substantivs: *mój* steht vor einem maskulinen Substantiv (*mój ojciec*, *mój brat*), *moja* vor einem femininen (*moja matka*, *moja siostra*), und die eigene, unregelmäßige Form *moi* steht speziell vor dem maskulin-personalen Plural *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: Das ist mein Vater
    gloss: Das ist mein Vater.
    note: '*To jest* (das ist) bleibt unabhängig vom Geschlecht des Substantivs gleich – nur das Possessivpronomen mój/moja ändert sich.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Großvater, Großmutter
    gloss: Großvater; Großmutter
    note: Die üblichen Alltagswörter für Großvater und Großmutter, die Kinder wie Erwachsene verwenden.
    example_gloss:
    - Das ist mein Großvater.
    - Das ist meine Großmutter.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Onkel, Tante
    gloss: Onkel; Tante
    note: Bezeichnet sowohl den Bruder bzw. die Schwester eines Elternteils als auch den Ehepartner eines Geschwisterteils der Eltern – genau wie im Deutschen „Onkel“/„Tante“.
    example_gloss:
    - Das ist mein Onkel.
    - Das ist meine Tante.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Sohn, Tochter
    gloss: Sohn; Tochter
    note: 'Die Beispiele zeigen die Akkusativform, die Sie nach *mieć* (haben) brauchen: aus *syn* wird *syna*, aus *córka* wird *córkę*. Die folgenden Grammatikhinweise erklären, warum sich die Endung ändert.'
    example_gloss:
    - Ich habe einen Sohn.
    - Ich habe eine Tochter.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'Haben: mam, masz, ma'
    gloss: 'haben: ich habe, du hast, er/sie hat – ich habe einen Bruder, du hast eine Schwester, er/sie hat einen Sohn.'
    note: '*Mieć* ist das Verb „haben“. *Mam* (ich habe) und *ma* (er/sie hat) sind die wichtigsten neuen Formen dieser Lektion; *masz* (du hast) kennen Sie schon aus der Frage nach dem Alter in Lektion 2.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Sagen, was man hat
    gloss: 'Nach „haben“ verändert das Substantiv seine Endung: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: Das ist der Akkusativ – die Form, die ein Substantiv als direktes Objekt eines Verbs wie *mieć* annimmt. Maskuline Substantive für Personen (und Tiere) wie *brat* und *syn* erhalten *-a*; feminine Substantive wie *siostra* und *córka* tauschen ihr *-a* gegen *-ę*.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: Ich habe einen Bruder und eine Schwester
    gloss: Ich habe einen Bruder und eine Schwester.
    note: Wendet die Akkusativendungen aus dem Grammatikhinweis in einem ganzen Satz an – dazu kommt das neue Bindewort *i* (und).
  pl.a1.unit05.lesson03.teach.lub:
    title: Oder
    gloss: oder
    note: Wird wie im Deutschen „oder“ in einer Ja/Nein-Frage verwendet, die zwei Möglichkeiten anbietet.
    example_gloss: Hast du einen Bruder oder eine Schwester?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Nur
    gloss: nur
    note: Steht unmittelbar vor dem Wort, das es einschränkt.
    example_gloss: Ich habe nur eine Schwester.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Wo
    gloss: wo
    note: Ein grundlegendes Fragewort – passt gut zu mieszkać (wohnen), wie im Dialog dieser Lektion.
    example_gloss: Wo wohnt dein Bruder?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: Er, sie – und „wohnen“
    gloss: 'er, sie = er, sie – wohnen: ich wohne, er/sie wohnt. Er wohnt in Danzig. Sie wohnt in Krakau.'
    note: '*On* (er) und *ona* (sie) sind die Pronomen der 3. Person. *Mieszkać* (wohnen) folgt demselben Muster der 1. und 3. Person wie *mieć*: *mieszkam* (ich wohne, aus Lektion 1: *Mieszkam w Warszawie*) und *mieszka* (er/sie wohnt). Nach Ortsnamen steht *w* + Lokativ: aus *Gdańsk* wird *w Gdańsku*, aus *Kraków* wird *w Krakowie* – dasselbe Muster w + Lokativ wie in *Mieszkam w Warszawie* aus Lektion 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek fragt nach Geschwistern
    gloss: Marek fragt Ewa, ob sie einen Bruder oder eine Schwester hat.
    note: Eine Ja/Nein-Frage mit *Czy*, dem Fragewort aus Lektion 1. Ewa und Marek kennen sich nun gut und sind vom förmlichen *pan*/*pani* zum vertrauten *ty* übergegangen (*masz*, *A ty?*, *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa antwortet und fragt zurück
    gloss: Ewa sagt, dass sie einen Bruder und eine Schwester hat, und stellt Marek dann dieselbe Frage zurück.
    note: '*A ty?* („Und du?“) ist eine kurze, natürliche Art, eine Frage an die fragende Person zurückzugeben.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek antwortet
    gloss: Marek sagt, dass er nur eine Schwester hat, die in Krakau wohnt, und fragt dann Ewa nach ihrem Bruder.
    note: Marek hat keinen Bruder – nur *tylko siostrę* (nur eine Schwester). Er kann bedenkenlos nach Ewas Bruder fragen, denn Ewa hat schon gesagt, dass sie einen hat.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa antwortet
    gloss: Ewa sagt, dass ihr Bruder in Danzig wohnt und einen Sohn und eine Tochter hat.
    note: Greift das Akkusativmuster von syn/córka aus der 2. Lektion dieser Einheit wieder auf.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek reagiert
    gloss: 'Marek sagt: Tolle Familie!'
    note: '*Fajna* ist ein umgangssprachliches Alltagswort für „nett“/„toll“ – eine natürliche abschließende Reaktion, im selben Register wie *Świetnie!* aus Lektion 4.'
