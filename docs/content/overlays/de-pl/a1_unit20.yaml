teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: Ist, sind, das, ich möchte – noch einmal
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do – diese Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Wiederholung, bevor diese Lektion sie für das Einkaufen von Kleidung verwendet.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Geschäft
    gloss: Geschäft / Laden
    note: Das allgemeine Wort für einen Laden.
    example_gloss: Ich gehe in den Laden.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Hemd
    gloss: Hemd
    note: Ein feminines Substantiv – es verlangt feminine Adjektivformen.
    example_gloss: Das ist ein Hemd.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Hose
    gloss: Hose
    note: Im Polnischen immer Plural, auch für eine einzelne Hose – es gibt keine Singularform.
    example_gloss: Das sind Hosen.
  pl.a1.unit20.lesson01.teach.kupic:
    title: Kaufen
    gloss: kaufen
    note: 'Steht nach „*chcę*“ (ich möchte), genau wie „*iść*“ (gehen) in einer früheren Lektion: „*chcę kupić*“ – ich möchte kaufen.'
    example_gloss: Ich möchte ein Hemd kaufen.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Ich möchte eine Hose kaufen
    gloss: Ich möchte eine Hose kaufen.
    note: Dasselbe Muster chcę + Infinitiv, hier mit einer Hose.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: Wie viel kostet das Hemd?
    gloss: Wie viel kostet das Hemd?
    note: Eine natürliche Art, nach dem Preis eines bestimmten Artikels zu fragen, mit „*Ile kosztuje*“ aus der Einkaufslektion.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: Was für ein – maskuline Form
    gloss: Jaki, Jaka – „*Jaki*“ fragt nach maskulinen Substantiven, „*Jaka*“ nach femininen (Sie kennen „*Jaka*“ schon aus der Wetterlektion).
    note: „*Kolor*“ (Farbe) ist maskulin, deshalb steht es mit „*Jaki*“, nicht mit „*Jaka*“.
  pl.a1.unit20.lesson02.teach.kolor:
    title: Farbe
    gloss: Farbe
    note: Ein maskulines Substantiv.
    example_gloss: Welche Farbe?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Kleid
    gloss: Kleid
    note: Ein weiteres feminines Substantiv, wie „*koszula*“.
    example_gloss: Das ist ein Kleid.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Blau
    gloss: Koszula jest niebieska. – „*niebieska*“ passt zu femininen Substantiven wie „*koszula*“.
    note: Nur genau diese Form – sie ist in diesem Kurs bisher an „*koszula*“ gebunden.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Rot
    gloss: Sukienka jest czerwona. – „*czerwona*“ passt ebenfalls zu femininen Substantiven, genau wie „*niebieska*“.
    note: Diese Form ist hier an „*sukienka*“ gebunden, so wie „*niebieska*“ an „*koszula*“.
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: Das Hemd ist blau
    gloss: Das Hemd ist blau.
    note: Diese Aussage wird später in dieser Einheit wieder aufgegriffen, wenn Marek ein Hemd kauft.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: Das Kleid ist rot
    gloss: Das Kleid ist rot.
    note: Dasselbe Muster jest + Farbe, für einen anderen Artikel.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: Guten Tag, bitte, sehr – noch einmal
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co – diese Wörter kennen Sie schon aus früheren Lektionen.
    note: Eine kurze Wiederholung vor dem Dialog im Geschäft in dieser Lektion.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Größe
    gloss: Größe
    note: Kleidergrößen werden im Polnischen meist einfach mit den Buchstaben S, M und L angegeben, genau wie im Deutschen.
    example_gloss: Welche Größe?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Herr, möchte
    gloss: Co pan chce kupić? – „*pan*“ ist die höfliche Anrede für einen Mann, genau wie „*pani*“ für eine Frau (Sie kennen „*pani*“ schon aus der Einkaufslektion).
    note: „*chce*“ ist die Form für er/sie/es von „*chcieć*“ – Sie kennen schon „*chcę*“ (ich möchte) und „*chcesz*“ (du möchtest).
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: Was möchten Sie kaufen?
    gloss: Was möchten Sie kaufen?
    note: So eröffnet ein Verkäufer höflich das Gespräch mit einem männlichen Kunden.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: Der Verkäufer begrüßt Marek
    gloss: Guten Tag! Was möchten Sie kaufen?
    note: Sprzedawca (der Verkäufer) beginnt in demselben höflichen Register wie der Marktverkäufer in der früheren Einkaufseinheit.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek sagt, was er möchte
    gloss: Ich möchte ein Hemd und eine Hose kaufen.
    note: Marek nennt beide Artikel, die er kaufen möchte.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: Der Verkäufer fragt nach der Größe
    gloss: Welche Größe?
    note: Eine kurze, natürliche Anschlussfrage.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek nennt seine Größe
    gloss: Größe M.
    note: Marek antwortet, wie es üblich ist, nur mit dem Buchstaben der Größe.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: Der Verkäufer bestätigt Vorrat und Preis
    gloss: Wir haben ein blaues Hemd und eine Hose. Zusammen hundert Złoty.
    note: „*Mamy*“ bedeutet „wir haben“ (wie „*mam*“/„*masz*“). Danach wird „*koszula*“ zu „*koszulę*“ und „*niebieska*“ zu „*niebieską*“ – dieselbe Veränderung wie in „*Chcę kupić koszulę*“. Die Farbe passt zum blauen Hemd aus Lektion 2.
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek sagt zu
    gloss: Gut, ich nehme es.
    note: Marek bestätigt den Kauf und beendet damit das Gespräch.
