teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Nach dem Gesamtpreis fragen
    gloss: Wie viel kostet es insgesamt?
    note: '*W sumie* (insgesamt) macht deutlich, dass Sie den gesamten Preis wissen möchten, nicht den Preis eines einzelnen Artikels.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Den Gesamtpreis nennen
    gloss: Es kostet insgesamt hundert Złoty.
    note: '*Kosztuje* ist die *on/ona/ono*-Form von *kosztować* (kosten). Zahlen ab 5 stehen mit dem Genitiv Plural: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Mit Karte oder bar bezahlen
    gloss: mit Karte bezahlen, bar bezahlen
    note: '*Płacić kartą* (mit Karte zahlen) und *płacić gotówką* (bar zahlen) verwenden beide den Instrumental nach *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - Kann ich hier mit Karte zahlen?
    - Ich zahle bar.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Fragen, ob Kartenzahlung möglich ist
    gloss: Kann ich hier mit Karte zahlen?
    note: '*Tu* (hier) bezieht die Frage auf den aktuellen Ort; *czy* leitet eine Ja-/Nein-Frage ein und *mogę* bedeutet „ich kann/darf“.'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Nach der Zahlungsart fragen
    gloss: Möchten Sie bar oder mit Karte zahlen?
    note: '*Czy chce pan ...?* ist die förmliche Variante von *Czy chcesz ...?* und wird hier von einem unbekannten Kassierer verwendet (*pan* für einen Mann, *pani* für eine Frau).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: Die Rechnung
    gloss: die Rechnung
    note: 'Ein maskulines Nomen: *rachunek* (Genitiv *rachunku*).'
    example_gloss: Teilen wir die Rechnung?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Vorschlagen, die Rechnung zu teilen
    gloss: Teilen wir die Rechnung?
    note: '*Może podzielimy ...?* ist eine höfliche Art, etwas gemeinsam vorzuschlagen; *podzielimy* ist die *my*-Form von *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Bitten, getrennt zu zahlen
    gloss: Darf ich getrennt bezahlen?
    note: '*Osobno* (getrennt) steht bei *zapłacić* (bezahlen, perfektiv: ein abgeschlossener Zahlungsvorgang).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: Das Wechselgeld
    gloss: das Wechselgeld
    note: 'Ein feminines Nomen: *reszta* (Genitiv *reszty*, wie in *nie potrzebuję reszty*).'
    example_gloss: Hier ist Ihr Wechselgeld.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Wechselgeld zurückgeben
    gloss: Hier ist Ihr Wechselgeld.
    note: '*Pana* ist das förmliche „Ihr“ (zu einem Mann; *pani* zu einer Frau) und passt zum formellen Ton an der Kasse.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Wechselgeld ablehnen
    gloss: Ich brauche kein Wechselgeld.
    note: '*Nie potrzebuję* + Genitiv: Nach der Verneinung steht das Objekt im Genitiv, daher *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Fünfunddreißig
    gloss: fünfunddreißig
    note: '*Trzydzieści pięć* wird in zwei Wörtern geschrieben: erst die Zehner, dann die Einer (30 + 5).'
    example_gloss: Es kostet hundertvierzig Złoty.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Eine Restaurantrechnung lesen
    gloss: 'Rechnung: zwei Hauptgerichte und zwei Kaffee. Gesamt: hundertvierzig Złoty. Mit Karte bezahlt.'
    note: Achten Sie darauf, was bestellt wurde, wie hoch der Gesamtbetrag ist und wie bezahlt wurde.
    glosses:
      Rachunek: Rechnung
      dwa: zwei
      dania: Hauptgerichte (dania główne)
      kawy: Kaffee
      Razem: Gesamtbetrag
      złotych: Złoty
      Zapłacono: bezahlt
      kartą: Karte
      sto: hundert
      czterdzieści: vierzig
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa bittet um die Rechnung
    gloss: 'Ewa: Sollen wir um die Rechnung bitten?'
    note: 'Nach *poprosić o* (bitten um) steht der Akkusativ: *o rachunek*. *Poprosimy* ist das perfektive Futur.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek fragt nach dem Gesamtbetrag
    gloss: 'Marek: Ja, gute Idee. Wie viel kostet es insgesamt?'
    note: Greift die Frage *Ile to kosztuje w sumie?* aus Lektion 1 wieder auf.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa nennt den Gesamtbetrag
    gloss: 'Ewa: Das macht hundertvierzig Złoty. Sollen wir teilen?'
    note: '*Podzielimy się?* (wörtlich „teilen wir uns?“) verwendet das Reflexivpronomen *się* im Sinn von „die Rechnung teilen“.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek besteht darauf zu zahlen
    gloss: 'Marek: Nein, heute zahle ich. Du hast mir so geholfen!'
    note: '*Dzisiaj ja płacę* (wörtlich „heute ich zahle“) ist die übliche Art, anzubieten zu zahlen; *pomogłaś* ist die feminine Vergangenheitsform von *pomóc* (helfen), da Marek zu Ewa spricht.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa ist gerührt
    gloss: 'Ewa: Wie nett von dir! Danke.'
    note: '*Miło z twojej strony* (nett von dir) ist ein herzliches, gängiges Kompliment für eine großzügige Geste; *z* + Genitiv: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek fragt nach der Kartenzahlung
    gloss: 'Marek: Kann ich hier mit Karte zahlen?'
    note: Greift die Frage *Czy mogę tu zapłacić kartą?* aus Lektion 2 wieder auf, jetzt im richtigen Restaurant.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: die er/sie-Form'
    gloss: Marek bezahlt die Rechnung.
    note: '*Płaci* ist die *on/ona/ono*-Form von *płacić* (zahlen).'
