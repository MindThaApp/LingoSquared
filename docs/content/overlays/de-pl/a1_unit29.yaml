  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Verben für Nachrichten: senden und lesen'
    gloss: Sie kennen schon *prognoza pogody* (die Wettervorhersage). Eine *wiadomość* (Nachricht) können Sie senden (*wysyłam*, *wysyłasz*) oder lesen (*czytam*, *czytasz*).
    note: Verbindet das neue Wort mit dem bereits gelernten zusammengesetzten Nomen aus der Wetter-Lektion.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa schickt eine Nachricht über die App
    gloss: Ewa schickt eine Nachricht über die App.
    note: '*Wysyłać* (senden) verwendet für den Kanal *przez* + Akkusativ: *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
    title: Marek liest die Nachricht
    gloss: Marek liest die Nachricht.
  pl.a1.unit29.lesson03.teach.sprawdzac:
    title: Nachschlagen
    gloss: nachschauen; suchen
    example_gloss: Ich schaue die Wettervorhersage nach.
  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Zwei Verben, zwei Fälle
    gloss: '*Sprawdzam* steht mit dem Akkusativ: *prognozę pogody*. *Używam* steht mit dem Genitiv: *telefonu*.'
    note: Die meisten Verben stehen mit dem Akkusativ, aber *używać* ist eine Ausnahme und verlangt den Genitiv.
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
    title: Tomek sieht die Wettervorhersage nach
    gloss: Tomek sieht die Wettervorhersage nach.
  pl.a1.unit29.lesson03.teach.potem_idzie_biegac:
    title: Danach geht er joggen
    gloss: Danach geht er joggen.
    note: '*Idzie biegać* bedeutet „geht joggen“: *iść* + Infinitiv.'
  pl.a1.unit29.lesson04.teach.ewa_pocwiczymy_w:
    title: Ewa macht einen Vorschlag
    gloss: 'Ewa: Wollen wir am Samstag um zehn Sport machen?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek sagt zu
    gloss: 'Marek: Gute Idee! Ich sehe die Wettervorhersage nach.'
    note: '*Dobry pomysł!* ist eine kurze Antwort auf einen Vorschlag; das Adjektiv *dobry* richtet sich nach dem maskulinen *pomysł*.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Marek prüft das Wetter
    gloss: 'Marek: Am Samstag ist es sonnig!'
    note: '*Słonecznie* ist ein Adverb: *jest słonecznie* heißt „es ist sonnig“; ein Subjekt ist nicht nötig.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Tomek sieht die Nachricht
    gloss: 'Tomek: Ich sehe die Nachricht. Bis Samstag!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia und do + Tag
    gloss: 'Sie kennen schon *Do widzenia!* Sie können auch einen Tag nennen: *Do soboty!*, *Do jutra!* (nach *do* steht der Genitiv).'
    note: Überträgt das Verabschiedungsmuster aus der Begrüßungs-Lektion auf einen bestimmten Tag.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Wer nutzt was?
    gloss: Ewa ruft Marek jeden Tag an. Sie benutzt das Telefon, keine App. Marek hat zu Hause keinen Computer, aber er nutzt das Internet auf dem Telefon. Tomek sieht jeden Morgen die Wettervorhersage nach. Dann geht er joggen. Kasia schickt Ewa oft eine Nachricht. Benutzen Sie Ihr Telefon auch jeden Tag?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
    glosses:
      dzwoni: ruft an
      każdego: jeder
      dnia: Tag
      używa: benutzt
      telefonu: Handy
      aplikacji: App
      komputera: Computer
      domu: zu Hause
      internetu: Internet
      sprawdza: schaut nach
      ranka: der Morgen
      prognozę: Wettervorhersage
      idzie: geht
      biegać: laufen; joggen
      wysyła: schickt
      często: oft
      wiadomość: Nachricht
      używasz: benutze
  pl.a1.unit29.lesson05.teach.tomek_kazdego_ranka:
    title: Tomek sieht jeden Morgen die Vorhersage nach
    gloss: Tomek sieht jeden Morgen die Wettervorhersage nach.
  pl.a1.unit29.lesson05.teach.kasia_czesto_wysyla:
    title: Kasia schreibt Ewa oft
    gloss: Kasia schickt Ewa oft eine Nachricht.
  pl.a1.unit29.lesson06.teach.ewa_widze_wiadomosc:
    title: Ewa bestätigt den Plan
    gloss: 'Ewa: Ich sehe die Nachricht. Wollen wir am Samstag um zehn im Park Sport machen?'
  pl.a1.unit29.lesson06.teach.marek_tak_a:
    title: Marek bestätigt das Wetter
    gloss: 'Marek: Ja, und am Samstag ist es sonnig!'
  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: Tomeks Plan
    gloss: 'Tomek: Dann laufe ich. Danach spiele ich auch Fußball.'
    note: '*Wtedy* (dann) und *potem* (danach) zeigen die Reihenfolge der Ereignisse an; *pobiegam* und *zagram* sind perfektiv, deshalb klingen sie nach Plänen.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: Kasias Plan
    gloss: 'Kasia: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: '*Wolę* bedeutet „ich ziehe vor“ bzw. „ich möchte lieber“ und wird mit dem Infinitiv verbunden: *wolę pływać*.'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: Ewa beendet das Gespräch
    gloss: 'Ewa: Super! Bis Samstag im Park!'
    note: Schließt in einer Zeile den Nachrichtenverlauf dieser Lektion und den Plan aus der Sport-Lektion ab.
