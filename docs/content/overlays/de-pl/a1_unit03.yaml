teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: Montag
    gloss: Montag
    note: Der erste Tag der Woche im Polnischen, genau wie im deutschen Kalender.
    example_gloss: Heute ist Montag.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: Dienstag
    gloss: Dienstag
    note: 'Achtung: *wtorek* steht mit der Präposition *we*, nicht *w*, wenn man „am Dienstag“ sagt. Mehr dazu später in dieser Lektion.'
    example_gloss: Heute ist Dienstag.
  pl.a1.unit03.lesson01.teach.sroda:
    title: Mittwoch
    gloss: Mittwoch
    note: Ein Femininum, anders als die meisten anderen Wochentage.
    example_gloss: Heute ist Mittwoch.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: Donnerstag
    gloss: Donnerstag
    note: Dasselbe maskuline Muster wie bei *poniedziałek*, *wtorek* und *piątek*.
    example_gloss: Heute ist Donnerstag.
  pl.a1.unit03.lesson01.teach.piatek:
    title: Freitag
    gloss: Freitag
    note: Diesem Tag begegnen Sie später in der Einheit noch einmal – an ihm wollen sich Ewa und Marek wieder treffen.
    example_gloss: Heute ist Freitag.
  pl.a1.unit03.lesson01.teach.sobota:
    title: Samstag
    gloss: Samstag
    note: Gehört zum Wochenende; für „Wochenende“ sagt man im Polnischen oft *weekend* (ein englisches Lehnwort, das auch viele Polen benutzen).
    example_gloss: Heute ist Samstag.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: Sonntag
    gloss: Sonntag
    note: Der letzte der sieben Wochentage, die in dieser Lektion vorkommen.
    example_gloss: Heute ist Sonntag.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Nach dem Wochentag fragen
    gloss: Welcher Wochentag ist heute?
    note: Eine direkte Frageform – *dzień tygodnia* bedeutet wörtlich „Tag der Woche“.
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: Die Ausnahme w/we
    gloss: Am Montag, am Donnerstag, am Freitag – aber am Dienstag (zur leichteren Aussprache).
    note: 'Bei den meisten Wochentagen steht „*w* + [Tag]“ für „am [Tag]“. *Wtorek* ist die einzige echte Ausnahme: Man sagt *we wtorek*, nicht *w wtorek*, einfach weil es leichter auszusprechen ist – eine echte Unregelmäßigkeit, kein Tippfehler.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: Am Freitag gehe ich ins Kino
    gloss: Am Freitag gehe ich ins Kino.
    note: '*Piątek* verändert sich nach *w* nicht – nur *środa*, *sobota* und *niedziela* würden sich ändern (das wird in dieser Lektion nicht behandelt, damit es auf A1 einfach bleibt).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Januar, Februar, März
    gloss: Januar; Februar; März
    note: '*Luty* ist grammatisch der Sonderfall – es verhält sich wie ein Adjektiv und nicht wie ein gewöhnliches Nomen (die Form für „im Februar“ sehen Sie später in der Einheit).'
    example_gloss:
    - Ich habe im Januar Geburtstag.
    - Im Februar fahre ich nach Warschau.
    - Mein Geburtstag ist im März.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: April, Mai, Juni
    gloss: April; Mai; Juni
    note: '*Maj* ist der Monat, der in der Geschichte dieser Einheit für beide Daten vorkommt.'
    example_gloss:
    - Im April fahre ich nach Warschau.
    - Ich habe im Mai Geburtstag.
    - Im Juni fahre ich nach Warschau.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Juli, August, September
    gloss: Juli; August; September
    note: 'Noch eine echte Unregelmäßigkeit: „im September“ heißt *we wrześniu*, nicht *w wrześniu* – derselbe *we*-Tausch zur leichteren Aussprache wie bei *wtorek*.'
    example_gloss:
    - Im Juli habe ich Urlaub.
    - Im August fahre ich nach Warschau.
    - Ich habe im September Geburtstag.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Oktober, November, Dezember
    gloss: Oktober; November; Dezember
    note: Die letzten drei Monate des Jahres; damit sind alle zwölf komplett.
    example_gloss:
    - Im Oktober fahre ich nach Warschau.
    - Ich habe im November Geburtstag.
    - Im Dezember habe ich Urlaub.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: Geburtstag
    gloss: Geburtstag
    note: '*Urodziny* steht im Polnischen immer im Plural, auch für den einen Geburtstag einer Person – es steht mit *są* („sind“), nie mit *jest* („ist“). Genau diesen Punkt üben Sie später in dieser Lektion.'
    example_gloss: Ich habe im Mai Geburtstag.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Wann
    gloss: wann
    note: Das Fragewort, mit dem man nach jedem Zeitpunkt fragt.
    example_gloss: Wann ist das Treffen?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Nach dem Geburtstag fragen
    gloss: Wann haben Sie Geburtstag?
    note: '*Są*, nicht *jest*, passend zum Plural *urodziny* – das Muster, auf das schon die Karte *urodziny* hinweist.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Einen Geburtstag nennen
    gloss: Mein Geburtstag ist am 10. Mai.
    note: '*Dziesiątego maja* – der Tag endet auf *-ego*, der Monat auf *-a*, ganz ohne Präposition. So nennt man im Polnischen ein bestimmtes Datum; das ganze Muster steht in der Grammatikanmerkung weiter hinten in dieser Lektion.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Fragen, wann das Treffen ist
    gloss: Wann ist das Treffen?
    note: '*Spotkanie* (Treffen) – ein Wort, dem Sie im Dialog der 3. Lektion wieder begegnen.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: Das Datum des Treffens nennen
    gloss: Das Treffen ist am 15. Mai.
    note: Dasselbe Datumsmuster mit *-ego* + *-a* wie bei *dziesiątego maja*, nur mit einer anderen Tageszahl.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Wie man im Polnischen ein Datum nennt
    gloss: 'Ein Datum: Der Tag endet auf -ego, der Monat auf -a (aber Februar heißt lutego), ohne Präposition – 10. Mai, 15. Mai.'
    note: Anders als bei „am Freitag“ (*w piątek*, mit der Präposition *w*) steht bei einem bestimmten Kalenderdatum im Polnischen nie eine Präposition.
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Vorschlagen, sich wieder zu treffen
    gloss: Wann können wir uns wieder treffen?
    note: '*Znowu* bedeutet „wieder“ – ein natürlicher Einstieg, um über einen weiteren Termin zu sprechen.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Einen Mann förmlich fragen, ob der Freitag passt
    gloss: Passt Ihnen der Freitag? (zu einem Mann, förmlich)
    note: '*Panu* ist der Dativ von *pan* – *odpowiadać* („passen“) verlangt sein Objekt immer im Dativ, ganz wie im Deutschen: „Der Freitag passt *mir*.“'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Eine Frau förmlich fragen, ob der Freitag passt
    gloss: Passt Ihnen der Freitag? (zu einer Frau, förmlich)
    note: Ersetzen Sie *panu* durch *pani*, um eine Frau förmlich anzusprechen – *pani* bleibt hier im Nominativ und im Dativ gleich, anders als *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Einen Freund informell fragen, ob Freitag passt
    gloss: Passt dir der Freitag?
    note: '*Ci* steht anstelle von *panu*/*pani*, wenn man mit einem Freund oder Gleichaltrigen spricht – der informelle Dativ für „dir“.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Sagen, dass Freitag passt
    gloss: Der Freitag passt mir.
    note: '*Mi* ist der Dativ der ersten Person – dasselbe Kasusmuster wie bei *panu*/*pani*/*ci*, nur für „mir“ statt „Ihnen“ oder „dir“.'
  pl.a1.unit03.lesson03.teach.data:
    title: Datum
    gloss: Datum (Kalenderdatum)
    note: Dem deutschen Wort „Datum“ sehr ähnlich – leicht zu erkennen.
    example_gloss: Welches Datum wird das sein?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Fragen, welches Datum es sein wird
    gloss: Welches Datum wird das sein?
    note: Eine natürliche Anschlussfrage, wenn zwei Personen sich auf einen Wochentag geeinigt haben, aber noch nicht auf das genaue Datum.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa schlägt ein erneutes Treffen vor
    gloss: Ewa fragt Marek, wann sie sich wieder treffen können.
    note: Greift die Eingangsfrage dieser Lektion wörtlich wieder auf.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek schlägt förmlich den Freitag vor
    gloss: Marek fragt Ewa förmlich, ob ihr der Freitag passt.
    note: Spricht Ewa mit *pani* an und setzt damit die förmliche Anrede fort, die seit der ersten Einheit gilt.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa stimmt zu und fragt nach dem Datum
    gloss: Ewa sagt, dass ihr der Freitag passt, und fragt dann, welches genaue Datum es sein wird.
    note: '*Tak* („ja“), schon in Einheit 1 begegnet, eröffnet Ewas Zustimmung, bevor sie nach dem genauen Datum fragt.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek nennt das Datum
    gloss: 'Marek sagt: der 15. Mai.'
    note: Beide Wörter wurden bereits in Lektion 2 dieser Einheit eingeführt.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa bestätigt und verabschiedet sich
    gloss: Ewa sagt „Super!“ und „Bis zum 15. Mai!“.
    note: '*Do zobaczenia* greift den Abschiedsgruß aus der ersten Einheit wieder auf, hier verbunden mit einem konkreten Datum.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek beendet das Gespräch
    gloss: Marek verabschiedet sich ebenfalls.
    note: Der kürzestmögliche Abschluss – nur der Abschiedsgruß selbst.
