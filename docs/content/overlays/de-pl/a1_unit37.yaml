    title: Die Konstruktion Poproszę
    gloss: '*Poproszę* + Farbe sagt, welche Farbe Sie wählen: *Poproszę różowe.* Die Farbe endet auf *-e*, weil die Tulpen im Plural stehen.'
    note: '*Poproszę* („Ich hätte gern“) ist eine praktische Wendung, um etwas zu bestellen oder auszuwählen. Farben sind Adjektive und richten sich nach dem Substantiv: *tulipany* steht im Plural, daher die Endung *-e* (*różowe*, *czerwone*). Für sich allein steht der Farbname im Maskulinum Singular (*różowy*), weil er sich auf *kolor* bezieht.'
