teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: Aufstehen, ich stehe auf
    gloss: aufstehen; ich stehe auf
    note: Wstawać ist der Infinitiv; wstaję ist die alltägliche Form der 1. Person, mit der Sie über Ihren eigenen Tagesablauf sprechen.
    example_gloss: Ich stehe um sieben Uhr morgens auf.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: Essen, ich esse
    gloss: essen; ich esse
    note: Jeść ist leicht unregelmäßig, aber jem („ich esse“) ist die Form, die Sie am häufigsten brauchen – genau so sagt man auf Polnisch „ich esse“ bei jeder Mahlzeit.
    example_gloss: Ich frühstücke am Morgen.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: Das Frühstück
    gloss: Frühstück
    note: Śniadanie ändert sich nach jem nicht – „ich frühstücke“ heißt einfach jem śniadanie, ohne zusätzliche Endung.
    example_gloss: Am Morgen frühstücke ich.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: Trinken, ich trinke
    gloss: trinken; ich trinke
    note: Pić ist der Infinitiv; piję ist die Form der 1. Person und wird genauso verwendet wie jem und wstaję.
    example_gloss: Ich trinke morgens Kaffee.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Über sich selbst sprechen
    gloss: Wstaję, jem, piję – in dieser Lektion sprechen wir nur über uns selbst, in der 1. Person (ich), so wie Sie Ihren eigenen Tag beschreiben.
    note: Diese ganze Lektion bleibt bewusst bei der „ich“-Form jedes Verbs – *wstaję* (ich stehe auf), *jem* (ich esse), *piję* (ich trinke) –, damit Sie sich darauf konzentrieren können, Ihren eigenen Tagesablauf zu beschreiben, ohne gleichzeitig zu lernen, wie sich jedes Verb für „du“, „er“ oder „sie“ verändert.
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Ich stehe um sieben Uhr morgens auf
    gloss: Ich stehe um sieben Uhr morgens auf.
    note: 'Das Muster der Grammatikerklärung in der Praxis: o + Lokativform der Uhrzeit (siódmej) bedeutet „um“ diese Uhrzeit, genau wie in der früheren Lektion zur Uhrzeit.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Ich frühstücke und trinke Kaffee
    gloss: Ich frühstücke und trinke Kaffee.
    note: Zwei Verben in der 1. Person, verbunden mit i (und) – eine natürliche Art, die eigenen Morgenaktivitäten aufzuzählen.
  pl.a1.unit10.lesson02.teach.obiad:
    title: Mittagessen
    gloss: Mittagessen / Hauptmahlzeit am Mittag
    note: Wie śniadanie ändert sich obiad nach jem nicht – jem obiad heißt einfach „ich esse zu Mittag“.
    example_gloss: Ich esse mittags zu Mittag.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: Arbeiten, ich arbeite
    gloss: arbeiten; ich arbeite
    note: Pracować folgt demselben Muster -ować -> -uję wie kosztować -> kosztuje aus der Einkaufslektion, nur diesmal in der 1. Person.
    example_gloss: Ich arbeite nachmittags.
  pl.a1.unit10.lesson02.teach.dom:
    title: Wohnen
    gloss: Zuhause / Haus
    note: Das alltägliche Wort für „Zuhause“ – kommt ständig in der Wendung „nach Hause gehen/kommen“ vor.
    example_gloss: Das Haus ist dort.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: Nach Hause
    gloss: 'Nach Hause – do verlangt den Genitiv, und der Genitiv von dom endet auf -u: domu, genau dasselbe Muster wie bank -> banku, park -> parku, hotel -> hotelu.'
    note: '*Do domu* („nach Hause“, wie in „Ich gehe nach Hause“) verwendet dieselbe Genitivendung *-u*, die Sie nach *do* schon bei bank, hotel und park gelernt haben – ein weiteres Nomen mit demselben Muster.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: Zurückkehren, ich kehre zurück
    gloss: zurückkehren / zurückgehen; ich kehre zurück / gehe zurück
    note: Wird mit do domu verwendet, um „ich gehe nach Hause“ oder „ich kehre nach Hause zurück“ zu sagen – eine der häufigsten Alltagswendungen im Polnischen.
    example_gloss: Ich komme abends nach Hause.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: Mittags, nachmittags, abends
    gloss: mittags; nachmittags; abends
    note: 'Wiederholung aus der früheren Lektion zur Uhrzeit: Zusammen mit rano und w nocy decken diese Tageszeitangaben den ganzen Tag ab.'
    example_gloss:
    - Ich esse mittags zu Mittag.
    - Ich arbeite nachmittags.
    - Ich komme abends nach Hause.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Ich arbeite nachmittags, dann gehe ich nach Hause
    gloss: Ich arbeite nachmittags, dann gehe ich nach Hause.
    note: Dasselbe Muster aus der Lektion zur Wegbeschreibung – Komma + potem –, hier verwendet, um zwei Teile eines Tagesablaufs zu verbinden.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: Schlafen, ich schlafe
    gloss: schlafen; ich schlafe
    note: Śpię hat gegenüber dem Infinitiv spać einen unregelmäßig wirkenden Vokalwechsel, ist aber ein sehr häufiges Verb, das man einfach auswendig lernen sollte.
    example_gloss: Ich schlafe nachts.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: Und du? Ich auch.
    gloss: Und du? / Ich auch.
    note: A ty? ist die einfache Art, das Gespräch an das Gegenüber zurückzugeben; ja też bedeutet „ich auch“ – beides kommt im alltäglichen Smalltalk ständig vor.
    example_gloss: Ich frühstücke morgens auch.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Aber, Tee, nicht
    gloss: aber; Tee (als Objekt); nicht
    note: Ale leitet einen Gegensatz ein; nie direkt vor einem Wort (statt vor einem Verb) bedeutet „nicht [dieses]“ – piję herbatę, nie kawę heißt „Ich trinke Tee, keinen Kaffee.“
    example_gloss: Ich trinke Tee, aber keinen Kaffee.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Früh, um zehn Uhr
    gloss: früh; um zehn Uhr – dieselbe Endung -ej bei Uhrzeiten nach „o“ wie bei czwartej, siódmej aus der früheren Lektion.
    note: '*O dziesiątej* („um zehn“) verwendet genau das Uhrzeitmuster, das Sie schon kennen – *dziesiąta* wird nach *o* zu *dziesiątej*, genau wie *czwarta* -> *czwartej* und *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa beschreibt ihren Morgen
    gloss: Ewa sagt, dass sie um sieben Uhr morgens aufsteht und Kaffee trinkt.
    note: Greift das allererste Satzmuster dieser Lektion wieder auf, jetzt in einem echten Gespräch.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa erzählt weiter von ihrem Tag
    gloss: Ewa sagt, dass sie frühstückt und dann nachmittags arbeitet.
    note: Verbindet zwei Tätigkeiten in der ersten Person mit potem, dasselbe Muster wie in Lektion 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa schließt ab und fragt Marek
    gloss: Ewa sagt, dass sie abends nach Hause kommt. Und du?
    note: A ty? gibt das Gespräch an Marek weiter, ohne dass eine neue Fragegrammatik nötig ist.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek erzählt von seinem Morgen
    gloss: Marek sagt, dass er auch um sieben aufsteht! Aber er trinkt Tee, keinen Kaffee.
    note: Ja też bestätigt eine Gemeinsamkeit (die Aufstehzeit), bevor mit ale…nie beim Getränk ein Gegensatz folgt.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek beschreibt seinen Tag
    gloss: Marek sagt, dass er morgens arbeitet und dann mittags zu Mittag isst.
    note: Eine andere Tagesreihenfolge als bei Ewa – zuerst die Arbeit, dann eine Mahlzeit zur Mittagszeit.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek spricht über den Schlaf
    gloss: Marek sagt, dass er früh schläft, um zehn Uhr abends.
    note: Beschließt das Gespräch mit dem neuen Verb spać/śpię und dem Uhrzeitmuster, das in dieser Lektion wiederholt wird.
