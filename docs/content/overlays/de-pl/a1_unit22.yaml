teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: Anrufen
    gloss: anrufen
    note: Der Infinitiv des Verbs für „telefonisch anrufen“.
    example_gloss: Ich muss dich anrufen.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Sagen, dass man anruft
    gloss: Ich rufe dich an.
    note: '*Zadzwonię* ist das perfektive Futur von *zadzwonić* („anrufen“, einmalig). Im Polnischen verwendet man es für ein Versprechen, ähnlich wie im Deutschen „ich rufe dich an“.'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Ans Telefon gehen
    gloss: Hallo, hier ist Ewa.
    note: '*Tu* + Name (wörtlich „hier …“) ist die übliche Art, sich am Telefon zu melden – ähnlich wie im Deutschen „hier ist …“.'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek meldet sich genauso
    gloss: Hallo, hier ist Marek.
    note: Dasselbe Muster *tu* + Name wie bei *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Fragen, wer anruft
    gloss: Mit wem spreche ich?
    note: '*Z kim rozmawiam?* (wörtlich „mit wem spreche ich?“) ist die übliche Frage an einen unbekannten Anrufer; *kim* ist der Instrumental nach *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Sich förmlich melden
    gloss: Sie sprechen mit Ewa.
    note: '*Rozmawia pan z Ewą* ist die förmliche Variante: *pan* (zu einem Mann) oder *pani* (zu einer Frau) mit dem Verb in der 3. Person, dazu *z* + Instrumental.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: '*Możesz* („kannst du“, von *móc*) + der Infinitiv *powtórzyć* („wiederholen“) + *to* („das“).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Jemanden bitten, langsamer zu sprechen
    gloss: Sprich nicht so schnell, bitte.
    note: '*Nie mów* ist der verneinte Imperativ („sprich nicht“); *tak szybko* bedeutet „so schnell“.'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Sagen, dass man schlecht hört
    gloss: Ich kann dich nicht gut hören.
    note: '*Nie słyszę cię dobrze* nennt ein Hörproblem; *cię* ist der Akkusativ von *ty* und *dobrze* bedeutet „gut“.'
  pl.a1.unit22.lesson04.teach.sms:
    title: Textnachricht
    gloss: die Textnachricht
    note: '*SMS* ist ein maskulines Nomen: *ten SMS*. Im Deutschen heißt es dagegen „die SMS“ – merken Sie sich im Polnischen das maskuline Genus.'
    example_gloss: Die SMS ist von Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Sagen, dass man eine Nachricht schickt
    gloss: Ich schicke dir eine Nachricht.
    note: '*Wysłać* („schicken“) steht mit dem Dativ *ci* („dir“) für die Person und dem Akkusativ für das Geschickte: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Sagen, dass man zurückruft
    gloss: Ich rufe dich später zurück.
    note: '*Oddzwonić* („zurückrufen“) ist im Polnischen ein einzelnes Verb: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Einen Nachrichtenaustausch lesen
    gloss: 'Marek: Hallo Ewa, kannst du mich anrufen? Ich muss dir etwas sagen. Ewa: Ja, klar, ich rufe in fünf Minuten zurück.'
    note: Achten Sie darauf, worum Marek bittet, warum und wann Ewa zurückrufen will.
    glosses:
      Cześć: hallo
      możesz: kannst
      zadzwonić: anrufen
      Muszę: müssen
      coś: etwas
      powiedzieć: erzählen
      oczywiście: natürlich
      oddzwonię: anrufen
      pięć: fünf
      minut: Minuten
      za: zurück
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek nimmt den Anruf an
    gloss: 'Marek: Hallo, hier ist Marek.'
    note: 'Dasselbe Muster *tu* + Name aus Lektion 1, jetzt im eigentlichen Telefonat: Wer abnimmt, spricht zuerst und nennt seinen Namen.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa nennt ihren Namen
    gloss: 'Ewa: Hallo Marek, hier ist Ewa. Marek: Schön, dass du anrufst!'
    note: '*Fajnie, że* … („schön, dass …“) drückt eine positive Reaktion auf ein Ereignis aus; *że* leitet den Nebensatz ein.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa fragt nach der Schicht
    gloss: 'Ewa: Wie war deine erste Schicht?'
    note: '*Jak ci poszła ...?* (wörtlich: „Wie ist dir ... gegangen?“) fragt nach etwas, das schon geschehen ist. *Ci* ist der Dativ von *ty*, und *poszła* richtet sich nach dem weiblichen Substantiv *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek berichtet Gutes
    gloss: 'Marek: Es lief sehr gut, besser, als ich dachte.'
    note: '*Poszło* ist die Vergangenheit von *iść* mit der Endung *-o* („es“; hier im Sinne von „verlaufen“); *myślałem* ist die Vergangenheit von *myśleć* („denken“) mit der Endung für einen männlichen Sprecher.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Vergangenheit: było, poszło, myślałem'
    gloss: 'Vergangenheit: *było* („war“) von *być* („sein“), *poszło* („ging“, „lief“) von *iść* („gehen“), *myślałem* („ich dachte“) von *myśleć* („denken“).'
    note: 'Die polnische Vergangenheit wird mit *-ł-* plus einer Genusendung gebildet: *myślał* (er), *myślała* (sie), *było* (es). Lernen Sie *było*, *poszło* und *myślałem* vorerst als feste Formen in den Zusammenhängen dieser Lektion.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa ist stolz
    gloss: 'Ewa: Wie schön, das zu hören! Ich bin stolz auf dich.'
    note: '*Dumny z* („stolz auf“) ist eine feste Verbindung: *z* + Genitiv, also *z ciebie*. Ewa ist eine Frau, deshalb sagt sie *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek ist gerührt
    gloss: 'Marek: Vielen Dank, das bedeutet mir viel.'
    note: '*Znaczy* ist die Form für *on/ona/ono* von *znaczyć* („bedeuten“); *dla mnie* („für mich“) sagt, wem es wichtig ist.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Sein
    gloss: Seine erste Schicht ist sehr gut gelaufen.
    note: '*Jego* („sein“) ändert sich nie und steht vor dem Nomen: *jego pierwsza zmiana*; das feminine Nomen hat keinen Einfluss darauf.'
