teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Froh, traurig und wütend
    gloss: froh, traurig, wütend
    note: Drei grundlegende Gefühlswörter mit *jestem* (ich bin). Es sind maskuline Formen; eine Frau sagt *szczęśliwa, smutna, zła*.
    example_gloss:
    - Ich bin froh.
    - Ich bin traurig.
    - Ich bin wütend.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Sagen, dass man froh ist
    gloss: Ich bin glücklich.
    note: '*Jestem* (ich bin, von *być*) + Adjektiv ist das Grundmuster, genau wie im Deutschen „Ich bin …“. Das Adjektiv richtet sich nach dem Sprecher: *szczęśliwy* (Mann), *szczęśliwa* (Frau).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Gefühle gegenüberstellen
    gloss: Ich bin nicht wütend, ich bin traurig.
    note: '*Nie* steht direkt vor dem Verb: *Nie jestem zły*. Der zweite Satzteil nennt dann das tatsächliche Gefühl.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Nach dem Grund fragen
    gloss: Warum bist du froh?
    note: '*Dlaczego* (warum) ist das übliche Fragewort für einen Grund.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Einen Grund nennen
    gloss: Ich bin froh, weil ich eine neue Wohnung habe.
    note: '*Bo* (weil) leitet den Grund ein; nach *mam* (ich habe) steht das Substantiv im Akkusativ: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Ein negativer Grund
    gloss: Ich bin traurig, weil es regnet.
    note: '*Pada deszcz* (es regnet, wörtlich „Regen fällt“) ist die übliche Wendung für Regen, hier als Grund verwendet.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nervös
    gloss: nervös
    note: Das gebräuchliche Wort für Nervosität.
    example_gloss: Ich bin nervös vor meiner ersten Schicht.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Sagen, wovor man nervös ist
    gloss: Ich bin nervös vor meiner ersten Schicht.
    note: '*Przed* (wörtlich „vor“) + Instrumental sagt, worauf sich die Nervosität bezieht; im Deutschen sagt man dafür „vor“ oder „wegen“: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Jemanden beruhigen
    gloss: Mach dir keine Sorgen.
    note: '*Nie martw się* (wörtlich „mach dir keine Sorgen“) ist die übliche Beruhigungsformel; *się* ist das Reflexivpronomen.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Fragen, wie sich jemand fühlt
    gloss: Wie geht es Marek?
    note: '*Czuć się* (sich fühlen, reflexiv) ist die übliche Art, nach einem Gefühlszustand zu fragen oder ihn zu beschreiben: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Beschreiben, wie sich jemand fühlt
    gloss: Er fühlt sich nervös.
    note: '*Się* bleibt beim Verb: *on czuje się*. Das Adjektiv ist maskulin und passt zu *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Fragen, warum sich jemand so fühlt
    gloss: Warum fühlt er sich nervös?
    note: Verbindet *dlaczego* (warum) mit dem Muster *czuje się* aus *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Eine Nachricht über Gefühle lesen
    gloss: Hallo Ewa, ich bin ein bisschen nervös vor meiner ersten Schicht allein. Aber ich bin auch glücklich, weil ich eine neue Arbeit und eine neue Wohnung habe. Ich glaube, es wird gut.
    note: Achten Sie darauf, wovor der Schreiber nervös ist, was ihn froh macht und wie er insgesamt die Lage sieht.
    glosses:
      trochę: ein bisschen
      zdenerwowany: nervös
      pierwszą: erste
      zmianą: Schicht
      samodzielną: allein
      szczęśliwy: glücklich
      bo: denn, weil
      nową: neu
      pracę: Arbeit
      nowe: neu
      mieszkanie: Wohnung
      myślę: denken, glauben
      będzie: 'klappt (hier: wird gut gehen)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa fragt, wie es Marek geht
    gloss: 'Ewa: Hallo Marek, wie fühlst du dich vor deiner ersten Schicht?'
    note: '*Przed pierwszą zmianą* (vor deiner ersten Schicht) greift das Muster *przed* + Instrumental aus Lektion 3 wieder auf. *Czujesz się* ist die *ty*-Form.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek gibt zu, dass er nervös ist
    gloss: 'Marek: Ehrlich gesagt bin ich ein bisschen nervös.'
    note: '*Szczerze mówiąc* (ehrlich gesagt, wörtlich „aufrichtig sprechend“) mildert das Eingeständnis ab.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa beruhigt ihn
    gloss: 'Ewa: Keine Sorge, du schaffst das gut!'
    note: '*Dobrze sobie poradzisz* (wörtlich „du wirst gut zurechtkommen“) ist eine aufmunternde feste Wendung; *poradzisz* ist die *ty*-Futurform von *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek bedankt sich
    gloss: 'Marek: Danke, das hilft wirklich.'
    note: '*Pomaga* ist die *on/ona/ono*-Form von *pomagać* (helfen); *dzięki* ist das informelle „danke“.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa sagt den Ausgang voraus
    gloss: 'Ewa: Und danach wirst du ganz sicher sehr glücklich und stolz sein.'
    note: '*Na pewno* (ganz sicher) drückt eine zuversichtliche Vorhersage aus; *dumny* (stolz) ist ein neues, nützliches Adjektiv. *Będziesz* ist das Futur von *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek stimmt zu
    gloss: 'Marek: Ja, das glaube ich auch.'
    note: '*Ja też tak myślę* (wörtlich „ich auch so denke“) ist die natürliche Art zuzustimmen; *ja* wird hier zur Betonung hinzugefügt.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Zusammenfassen mit jest und mu
    gloss: Marek ist vor seiner ersten Schicht nervös. Ewa hilft ihm.
    note: '*Jest* ist die *on/ona*-Form von *być* (sein); *mu* bedeutet „ihm“ (Dativ, weil *pomagać* den Dativ verlangt – wie im Deutschen „helfen“). Kleine Wörter, aber unverzichtbar, wenn man über andere spricht.'
