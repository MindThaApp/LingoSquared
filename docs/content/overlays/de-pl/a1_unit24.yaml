answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polnisch A1
  description: 'Polnisch für Anfänger: Freizeitaktivitäten beschreiben – Hobby-Wortschatz, Häufigkeitsangaben, Fragen und Antworten dazu, was jemand in seiner Freizeit macht, und der Vergleich der Hobbys zweier Personen.'
units:
  pl.a1.unit24.hobby:
    title: Hobbys und Freizeit
lessons:
  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Lesen, Sport und Kochen
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Musik, Zeichnen und Gaming
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: Was machst du in deiner Freizeit?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa und Marek sprechen über Hobbys
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek und Ewa vergleichen ihre Hobbys
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Ein gemeinsames Wochenende planen
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobby-Verben: *czytać* (lesen), *uprawiać sport* (Sport treiben) und *gotować* (kochen).'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Freizeit
    gloss: Freizeit
    note: '*Wolny czas* ist die Schlüsselwendung, um über Hobbys zu sprechen. Das Adjektiv *wolny* (frei) richtet sich nach dem männlichen Substantiv *czas*; in *w wolnym czasie* stehen beide im Lokativ.'
    example_gloss: In meiner Freizeit lese ich gern.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: 'Nach *lubię* (ich mag) steht der Infinitiv: *lubię czytać*. *W wolnym czasie* steht mit *w* + Lokativ.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbys: *słuchać muzyki* (Musik hören), *rysować* (zeichnen) und *grać w gry* (Spiele spielen).'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Słuchać* steht immer mit dem Genitiv: *słucham muzyki*, nicht *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*Z przyjaciółmi* (mit Freunden) steht mit *z* + Instrumental Plural.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: 'Die vier wichtigsten Häufigkeitsadverbien: *zawsze*, *często*, *czasami*, *nigdy*. Sie verändern sich nie, und *nigdy* verlangt *nie* vor dem Verb: *Nigdy nie gram.*'
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*Co tydzień* und *co weekend* bedeuten beide „jede/n …“; nach *co* steht der Akkusativ, und co verändert sich nie – siehe die nächste Karte.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + Akkusativ
    gloss: '*Co* + Akkusativ bedeutet „jede/n/s“: jede Woche, jedes Wochenende, jeden Monat.'
    note: '*Co* ist ein festes Wort für „jede/n/s“, egal welches Substantiv folgt. Unbelebte männliche Substantive wie *tydzień*, *weekend* und *miesiąc* sehen im Nominativ und im Akkusativ gleich aus.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa spricht über Hobbys
    gloss: 'Ewa: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Marek?'
    note: '*Spacerujemy* ist die *my*-Form (wir) von *spacerować*; *Marku* ist der Vokativ, den man verwendet, wenn man jemanden direkt anspricht.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Mareks Hobbys
    gloss: 'Marek: Ich koche gern, auch zu Hause. Und ich treibe oft Sport.'
    note: '*Także w domu* (auch zu Hause) zeigt, dass Marek zum Vergnügen kocht und nicht nur bei seiner Arbeit im Restaurant; *w domu* steht im Lokativ.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa ist überrascht
    gloss: 'Ewa: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Cały dzień* (den ganzen Tag) betont, wie viel Marek bei der Arbeit ohnehin schon kocht; *przecież* drückt „doch“ aus.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek erklärt
    gloss: 'Marek: Ja, aber Kochen entspannt mich. Und du, was machst du gern?'
    note: '*Gotowanie mnie odpręża* heißt wörtlich „Kochen entspannt mich“: Im Polnischen ist oft die Tätigkeit das Subjekt, und *mnie* (mich) steht im Akkusativ.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Ewas Hobbys
    gloss: 'Ewa: Ich lese gern und höre oft Musik.'
    note: Verbindet zwei Hobby-Verben aus den Lektionen 1 und 2 mit *i* (und) in einem Satz.
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek fragt nach Computerspielen
    gloss: 'Marek: Spielst du auch Computerspiele?'
    note: Eine kurze Ja-/Nein-Frage mit *grać w gry* aus Lektion 2; *też* bedeutet „auch“.
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa antwortet
    gloss: 'Ewa: Nein, ich spiele nie Computerspiele. Aber manchmal zeichne ich!'
    note: '*Nigdy* (nie) und *czasami* (manchmal) aus Lektion 3, in einer Antwort gegenübergestellt. Beachten Sie die doppelte Verneinung: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Hobbys im Vergleich
    gloss: Marek und ich gehen oft zusammen spazieren. Aber wir haben auch andere Hobbys. Marek kocht gern, auch zu Hause, und treibt oft Sport. Ich lese gern und höre oft Musik. Manchmal zeichne ich, aber ich spiele nie Computerspiele. Was machst du in deiner Freizeit gern?
    note: Ewas Nachricht fasst Inhalte aus Lektion 4 zusammen und endet mit der Kernfrage der Einheit an den Leser.
    glosses:
      spacerujemy: spazieren gehen
      często: oft
      razem: zusammen
      inne: andere
      gotować: kocht
      lubi: mag
      domu: zu Hause
      uprawia: macht Sport
      czytać: lesen
      słucham: hören
      muzyki: Musik
      rysuję: zeichne
      czasami: manchmal
      gram: Videospiele spielen
      nigdy: nie
      wolnym: frei
      czasie: Zeit
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek fragt nach dem Wochenende
    gloss: 'Marek: Was machst du dieses Wochenende?'
    note: '*W ten weekend* (dieses Wochenende) steht für eine Zeitangabe mit *w* + Akkusativ.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa ist unentschlossen
    gloss: 'Ewa: Ich weiß noch nicht. Ich lese gern, aber ich möchte auch nach draußen gehen.'
    note: '*Wyjść na dwór* (nach draußen gehen) ist eine gängige Art zu sagen, dass man das Haus verlassen möchte; *chcę* + Infinitiv bedeutet „ich möchte“.'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek macht einen Vorschlag
    gloss: 'Marek: Gehen wir zusammen spazieren? Danach koche ich etwas für uns.'
    note: '*Potem* (danach) ist das Wort für die zeitliche Abfolge; *ugotuję* ist vollendet, weil das Kochen ein abgeschlossenes Ergebnis ist.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa stimmt zu
    gloss: 'Ewa: Gute Idee! Ich gehe gern spazieren und koche gern.'
    note: '*Lubię i ..., i ...* („sowohl … als auch …“) zeigt, dass Ewa zwei Dinge gleichermaßen mag, nicht eines lieber als das andere.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek bestätigt
    gloss: 'Marek: Super. Dann sehen wir uns am Samstag!'
    note: Ein freundlicher Schlusssatz, der den Plan für Samstag bestätigt; *w sobotę* ist *w* + Akkusativ für einen Wochentag.
