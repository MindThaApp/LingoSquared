teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: Musik
    gloss: Musik
    note: Ein häufiges Thema, wenn man über Vorlieben und Abneigungen spricht – ein leicht erkennbares Wort, weil es dem deutschen Wort ähnlich ist.
    example_gloss: Ich mag Musik.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: 'Bei lubić (mögen) + Objekt wird muzyka zu muzykę, genauso wie kawa zu kawę wird. Lubię muzykę, nicht: Lubię muzyka.'
    note: 'Dasselbe Muster, das Sie schon kennen: *muzyka* wird als Objekt von *lubię* zu *muzykę*, genauso wie *kawa* zu *kawę* wird.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Du magst
    gloss: du magst (informell, ty)
    note: Die „ty“-Form von lubić – genau das, was man braucht, um einen Freund direkt zu fragen, ob er etwas mag.
    example_gloss: Magst du Musik?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (mögen): lubię (ich), lubisz (du), lubi (er/sie). Lubię und lubi kennen Sie schon – lubisz ist die neue Form für die Person, mit der Sie sprechen.'
    note: '*Lubię* und *lubi* kennen Sie inzwischen gut – *lubisz* ergänzt die fehlende „du“-Form desselben Verbs.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: Magst du Musik?
    gloss: Magst du Musik?
    note: Czy leitet eine Ja-/Nein-Frage ein – die natürliche Art, einen Freund nach seinen Vorlieben zu fragen.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Ja, mag ich.
    gloss: Ja, mag ich.
    note: Eine kurze, natürliche Antwort – das Wort muzykę muss nicht wiederholt werden.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: Nein, mag ich nicht.
    gloss: Nein, ich mag es nicht.
    note: Nie, nie lubię sieht doppelt aus, ist aber kein Fehler – das erste nie beantwortet die Frage, das zweite nie verneint lubię.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Kurze Antworten
    gloss: 'Kurze Antwort: Tak, lubię. / Nie, nie lubię. – Das Wort muzykę muss nicht wiederholt werden, weil aus der Frage schon klar ist, worum es geht.'
    note: Genauso wie *Pyszny?* allein stehen kann, muss *Tak, lubię.* nicht wiederholen, worüber man spricht – der Kontext trägt es schon.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: Ich mag Musik sehr
    gloss: Ich mag Musik sehr.
    note: Bardzo (sehr / viel) verstärkt eine einfache Vorliebe – bardzo kennen Sie schon seit der ersten Lektion.
  pl.a1.unit13.lesson02.teach.wole:
    title: ich bevorzuge
    gloss: ich ziehe vor
    note: 'Ein ganz neues Verb in dieser Lektion: woleć (vorziehen, lieber mögen) – hier lernen Sie nur die „ich“-Form, genau wie bei lubię.'
    example_gloss: Ich trinke lieber Tee.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: in dieser Lektion nur wolę'
    gloss: 'Woleć (vorziehen, lieber mögen): wolę (ich) – diese Lektion bringt nur die „ich“-Form, genau wie bei lubię. Wolę kawę. = Ich trinke lieber Kaffee.'
    note: Vorerst nur die *ja*-Form (ich) von *woleć* – genau derselbe Umfang wie bei *lubię*, als es neu war.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Kaffee und Tee, noch einmal
    gloss: 'Wolę + Objekt: kawa wird zu kawę, herbata wird zu herbatę – dasselbe Muster, das Sie schon kennen.'
    note: 'Derselbe Akkusativ wie zuvor, nur mit einem neuen Verb: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Ich bevorzuge Kaffee
    gloss: Ich bevorzuge Kaffee.
    note: Eine einfache Aussage über eine Vorliebe mit wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Ich trinke lieber Tee
    gloss: Ich trinke lieber Tee.
    note: Dasselbe Muster mit herbatę statt kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy als „oder“
    gloss: Das czy in Kawa czy herbata? ist nicht dasselbe czy, das eine Ja-/Nein-Frage einleitet – hier verbindet es zwei Möglichkeiten, wie „oder“ im Deutschen. Kawa czy herbata? = Kaffee oder Tee?
    note: 'Achtung: *czy* leitet meist eine Ja-/Nein-Frage ein, zwischen zwei Nomen wie hier bedeutet es aber einfach „oder“.'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: Kaffee oder Tee?
    gloss: Kaffee oder Tee?
    note: Eine kurze, natürliche Art, jemandem eine Wahl anzubieten.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Ich auch
    gloss: ich auch
    note: Eine kurze Art, dem zuzustimmen, was jemand gerade gesagt hat.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też, noch einmal
    gloss: Ja też bedeutet „ich auch“ – das kennen Sie schon aus der Lektion über den Tagesablauf (Ja też wstaję o siódmej, „Ich stehe auch um sieben auf“).
    note: 'Eine kurze Erinnerung: Diese Wendung ist schon einmal vorgekommen.'
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? braucht kein Verb
    gloss: Genau wie Pyszny? aus der letzten Lektion braucht die kurze Frage Kawa czy herbata? kein Verb – der Kontext genügt.
    note: Dasselbe Muster wie bei *Pyszny?* – eine kurze Frage ohne Verb, die durch den Kontext völlig klar ist.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek fragt, ob Ewa Musik mag
    gloss: Magst du Musik?
    note: Marek eröffnet das Gespräch mit der Frage, die in dieser Lektion gerade vorkam.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa mag Musik und fragt zurück
    gloss: Ja, sehr! Und du?
    note: A ty? (Und du?) gibt die Frage an Marek zurück – dasselbe Muster wie in früheren Lektionen.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek stimmt zu und fragt nach Getränken
    gloss: Ich auch. Kaffee oder Tee?
    note: Ja też lubię bestätigt Mareks eigene Antwort, bevor er mit einer neuen Entweder-oder-Frage das Thema wechselt.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa trinkt lieber Kaffee
    gloss: Ich bevorzuge Kaffee.
    note: Ewas eigene Vorliebe mit wolę – dieselbe Kaffeetrinkerin, die wir in der Lektion über den Tagesablauf kennengelernt haben.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek trinkt lieber Tee
    gloss: Ich trinke lieber Tee.
    note: Mareks eigene Vorliebe – die gegenteilige Wahl zu Ewas.
