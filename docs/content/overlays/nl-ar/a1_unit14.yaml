  ar.a1.unit14.lesson01.teach.like:
    title: ik hou van / ik vind lekker
    gloss: ik hou van
    note: 'أحب (uḥibbu) betekent ik hou van. Het Arabisch gebruikt ال (de/het) voor dingen in het algemeen, dus Ik hou van koffie is أحب القهوة, letterlijk: ik hou van de koffie.'
    example_gloss: Ik hou van koffie.
  ar.a1.unit14.lesson01.teach.tea:
    title: Thee
    gloss: thee
    note: شاي (shāy) is thee; الشاي (ash-shāy) heeft ال, zoals het Arabisch doet als het over thee in het algemeen gaat.
    example_gloss: Ik hou niet van thee.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Ik hou niet van
    gloss: ik hou niet van
    note: In het Arabisch is geen hulpwerkwoord nodig, zoals Nederlands "doen" in sommige constructies; je zet gewoon لا voor أحب.
    example_gloss: Ik hou niet van thee.
  ar.a1.unit14.lesson01.teach.water:
    title: Water
    gloss: water
    note: الماء (al-māʾ) is ماء (water, uit de eten-unit) met ال, gebruikt voor water in het algemeen.
    example_gloss: Ik hou van water.
  ar.a1.unit14.lesson01.teach.and_not:
    title: En niet
    gloss: en niet
    note: 'ولا (wa-lā) is و (en) vastgemaakt aan لا (niet): het voegt een afkeer toe na een voorkeur.'
    example_gloss: Ik hou van koffie en ik hou niet van thee.
  ar.a1.unit14.lesson02.teach.prefer:
    title: ik geef de voorkeur aan
    gloss: ik geef de voorkeur aan
    note: 'أفضل (ufaḍḍilu) betekent ik verkies: je kiest de ene mogelijkheid boven de andere.'
    example_gloss: Ik geef de voorkeur aan koffie.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Wat heb je liever?
    gloss: Wat heb je liever?
    note: تفضل is hier tufaḍḍil, jij verkiest, gezegd tegen een man; tegen een vrouw is het تفضلين (tufaḍḍilīn). Het is een ander woord dan تفضل (tafaḍḍal, alsjeblieft) uit de eten-unit, hoewel het hetzelfde geschreven wordt.
    example_gloss: 'Nour zei: Wat verkies je, Yusuf?'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour vraagt
    gloss: Nour vraagt Yusuf wat hij verkiest.
    note: 'نور (Nour) is Yusufs zus. Ze zegt تفضل omdat ze een man aanspreekt; tegen een vrouw zeg je: ماذا تفضلين؟'
    example_gloss: 'Nour zei: Wat verkies je, Yusuf?'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf geeft de voorkeur aan koffie
    gloss: Yusuf zegt dat hij koffie verkiest.
    note: أفضل kiest één mogelijkheid boven de andere; أحب zegt gewoon dat je iets leuk vindt.
    example_gloss: 'Yusuf zei: Ik geef de voorkeur aan koffie.'
  ar.a1.unit14.lesson02.teach.line03:
    title: Yusuf houdt niet van thee
    gloss: Yusuf zegt dat hij niet van thee houdt.
    note: لا أحب drukt eenvoudig afkeer uit.
    example_gloss: 'Yusuf zei: Ik hou niet van thee.'
  ar.a1.unit14.lesson02.teach.line04:
    title: Nour houdt van water
    gloss: Nour zegt dat ze van water houdt.
    note: أنا kun je toevoegen voor nadruk.
    example_gloss: 'Nour zei: Ik hou van water.'
