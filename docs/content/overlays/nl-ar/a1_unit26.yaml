teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Lang en klein
    gloss: lang / klein
    note: 'طويل (ṭawīl) betekent lang en قصير (qaṣīr) klein. Bij een vrouw krijgen ze een ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara is lang.
    - Karim is klein.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Oud en jong
    gloss: oud / jong
    note: كبير في السن (kabīr fī as-sinn) en صغير في السن (ṣaghīr fī as-sinn) geven een algemene indruk van leeftijd, geen exact aantal jaren.
    example_gloss:
    - Opa is oud.
    - Yusuf is jong.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'Leeftijd: een getal of een indruk'
    gloss: كم عمرك؟ (kam ʿumruka?) vraagt naar een aantal jaren, terwijl كبير في السن (kabīr fī as-sinn) een algemene indruk geeft zonder getal, zoals in الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Gebruik كم عمرك؟ om te vragen hoe oud iemand precies is. كبير في السن beschrijft hier alleen hoe oud iemand eruitziet.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara is lang en Karim is klein
    gloss: Sara is lang en Karim is klein.
    note: 'و (wa-) verbindt de twee zinnen en wordt vastgeschreven aan het volgende woord: وكريم (wa-karīm). De bijvoeglijke naamwoorden congrueren: سارة طويلة is vrouwelijk en كريم قصير is mannelijk.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Haar
    gloss: het haar
    note: 'الشعر (ash-shaʿr) betekent het haar. ش is een zonneletter, dus de ل van ال wordt niet uitgesproken: ash-shaʿr.'
    example_gloss: Yusuf heeft kort zwart haar.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: 'أشقر (ashqar), بني (bunnī) en رمادي (ramādī) beschrijven haar en komen na het zelfstandig naamwoord: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla heeft blond haar.
    - Karim heeft bruin haar.
    - Opa heeft grijs haar.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: 'طويل (ṭawīl) en قصير (qaṣīr) beschrijven ook haar: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Ze volgen op شعر, dat mannelijk is.'
    example_gloss:
    - Sara heeft lang haar.
    - Karim heeft kort haar.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Het bijvoeglijk naamwoord staat achter het zelfstandig naamwoord
    gloss: 'In het Arabisch komt het bijvoeglijk naamwoord na het zelfstandig naamwoord en congrueert ermee: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) is mannelijk, dus de bijvoeglijke naamwoorden zijn ook mannelijk. Bij een onbepaald zelfstandig naamwoord krijgt geen van beide woorden ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Haar en haar haar
    gloss: شعر (shaʿr) betekent haar. Voeg het voornaamwoord ها (hā, haar) toe en je krijgt شعرها (shaʿruhā, haar haar).
    note: 'Het eind ها geeft de bezitter aan: شعرها (haar haar), اسمها (haar naam), عيناها (haar ogen). Het wordt aan het woord vastgeschreven.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf heeft kort zwart haar
    gloss: Yusuf heeft kort zwart haar.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) voor een naam betekent heeft, en wordt aan de naam vastgeschreven.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla heeft lang blond haar
    gloss: Layla heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Ogen
    gloss: de ogen
    note: 'العينان (al-ʿaynān) betekent de ogen. Het is een dualis: het Arabisch heeft een speciaal eind ان voor precies twee.'
    example_gloss: Yusuf heeft bruine ogen.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: 'أزرق (azraq) blauw, بني (bunnī) bruin en أخضر (akhḍar) groen zijn de mannelijke vormen. Bij عينان gebruik je de dualisvormen: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla heeft blauwe ogen.
    - Karim heeft bruine ogen.
    - Sara heeft groene ogen.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Ogen in de dualis, bijvoeglijk naamwoord in de dualis
    gloss: 'عينان (ʿaynān) is een dualis, dus het bijvoeglijk naamwoord staat ook in de dualis: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: In de dualis wordt het eind ان aan zowel het zelfstandig naamwoord als het bijvoeglijk naamwoord toegevoegd. Het bijvoeglijk naamwoord is ook vrouwelijk, omdat عين een vrouwelijk woord is.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Hoe ziet Layla eruit?
    gloss: Hoe ziet Layla eruit?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) vraagt hoe Layla eruitziet. تبدو (tabdū) is vrouwelijk omdat Layla een vrouw is; voor een man is het يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla heeft lang blond haar en blauwe ogen
    gloss: Layla heeft lang blond haar en blauwe ogen.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + een naam betekent heeft, en و verbindt haar en ogen.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla stelt Nour voor
    gloss: 'Layla: Er komt een nieuw meisje naar het talencafé. Ze heet Nour.'
    note: 'ستأتي (sa-taʾtī) betekent ze zal komen: س (sa-) geeft de toekomst aan en ت (ta-) betekent ze. اسمها (ismuhā) betekent haar naam.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf vraagt hoe ze eruitziet
    gloss: 'Yusuf: Oké! Hoe ziet ze eruit?'
    note: 'كيف تبدو؟ (kayfa tabdū?) heeft nu geen naam: het werkwoord تبدو betekent al ze ziet eruit.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla beschrijft Nours lengte en haar
    gloss: 'Layla: Ze is klein en ze heeft kort blond haar.'
    note: قصيرة (qaṣīra) is vrouwelijk omdat Nour een vrouw is, maar شعر قصير أشقر blijft mannelijk omdat شعر een mannelijk woord is.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf vraagt naar haar ogen
    gloss: 'Yusuf: En haar ogen?'
    note: 'وعيناها (wa-ʿaynāhā) betekent en haar ogen: و (wa-) wordt aan het zelfstandig naamwoord vastgeschreven en ها (hā) aan het eind betekent haar.'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla beschrijft Nours ogen
    gloss: 'Layla: Ze heeft groene ogen.'
    note: 'لها (lahā) betekent ze heeft: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) is een zelfstandig naamwoord in de dualis met een bijvoeglijk naamwoord in de dualis.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf zal haar herkennen
    gloss: 'Yusuf: Bedankt! Dan zal ik haar herkennen.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) betekent ik zal haar herkennen: س (sa-) geeft de toekomst aan en ها in عليها betekent haar.'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Karim en Sara vergeleken
    gloss: Karim en Sara zijn broer en zus, maar ze zien er verschillend uit. Karim is klein en heeft kort bruin haar en bruine ogen. Sara is langer dan Karim en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      أخ: broer
      أخت: zus
      تبدو: eruitzien
      مختلفان: verschillend
      القامة: klein (van lengte)
      قصير: kort
      بني: bruin
      شعر: haar
      بنيتان: bruin
      وعينان: ogen
      أطول: groter
      طويل: lang
      خضراوان: groen
      المظهر: uiterlijk (hoe iemand eruitziet)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Vergelijken met أفعل
    gloss: 'Om te vergelijken gebruik je de vorm أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm), Sara is langer dan Karim.'
    note: طويل (ṭawīl) wordt in de vergrotende trap أطول (aṭwal), en من (min) betekent dan. De vorm verandert niet voor een vrouw.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara heeft langer haar dan Karim
    gloss: Sara heeft langer haar dan Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول blijft mannelijk omdat شعر een mannelijk woord is.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: 'لدي (ladayya) betekent ik heb; het Arabisch heeft geen werkwoord voor hebben. De bijvoeglijke naamwoorden volgen op het zelfstandig naamwoord: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf ziet Nour
    gloss: 'Yusuf: Kijk, is dat Nour? Ze heeft kort blond haar en groene ogen.'
    note: انظري (unẓurī) is de gebiedende wijs voor een vrouw, omdat Yusuf tegen Layla praat; voor een man is het انظر (unẓur). هذه (hādhihi) betekent deze/dit, bij een vrouwelijk woord.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla bevestigt het
    gloss: 'Layla: Ja, dat is Nour!'
    note: Een korte, natuurlijke bevestiging.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour begroet Yusuf
    gloss: 'Nour: Hoi, ben jij Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) is een ja/nee-vraag: هل (hal) + een zin zonder werkwoord zijn.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf begroet Nour terug
    gloss: 'Yusuf: Ja! Aangenaam kennis te maken, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) is de beleefde uitdrukking bij een eerste ontmoeting. ب (bi-) wordt aan معرفتك vastgeschreven en de ك aan het eind betekent je.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour beantwoordt de groet
    gloss: 'Nour: Aangenaam kennis te maken, ook met jou!'
    note: 'Sluit de dialoog af: Yusuf heeft Nour met succes herkend aan Layla''s eerdere beschrijving.'
