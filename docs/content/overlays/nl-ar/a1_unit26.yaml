course:
  title: Arabisch in het Nederlands A1
  description: 'Arabisch voor beginners om het basisuiterlijk van iemand te beschrijven: lengte en leeftijd, haar- en oogkleur, de vraag كيف تبدو؟ (kayfa tabdū?) en het vergelijken van twee mensen met أطول من (aṭwal min).'
