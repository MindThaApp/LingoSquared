teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Huis
    gloss: huis
    note: بيت (bayt) is een huis; de uitgang ـي betekent mijn, dus بيتي (baytī) is mijn huis.
    example_gloss: Mijn huis is vlak bij de bibliotheek.
  ar.a1.unit19.lesson01.teach.room:
    title: Kamer
    gloss: kamer
    note: غرفة (ghurfa) is vrouwelijk (het eindigt op ة), dus het vrouwelijke واحدة volgt erop.
    example_gloss: In mijn huis is één kamer.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Keuken
    gloss: keuken
    note: 'مطبخ (maṭbakh) is een keuken. Het Arabisch heeft hier geen woord voor "er is": beginnen met في بيتي (in mijn huis) doet die taak.'
    example_gloss: In mijn huis is een keuken.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Eén kamer
    gloss: één kamer
    note: 'Het getal één komt na het zelfstandig naamwoord en komt ermee overeen: غرفة واحدة (ghurfa wāḥida); bij een mannelijk woord is het واحد.'
    example_gloss: In mijn huis is één kamer.
  ar.a1.unit19.lesson02.teach.table:
    title: Tafel
    gloss: tafel
    note: طاولة (ṭāwila) is een tafel; net als غرفة eindigt het op ة en is het vrouwelijk.
    example_gloss: Ik heb een tafel in de kamer.
  ar.a1.unit19.lesson02.teach.in_room:
    title: In de kamer
    gloss: in de kamer
    note: الغرفة (al-ghurfa) betekent de kamer.
    example_gloss: De tafel staat in de kamer.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Vlak bij de bibliotheek
    gloss: vlak bij de bibliotheek
    note: قرب (qurb) betekent dicht bij; المكتبة is de bibliotheek uit de eenheid over plaatsen.
    example_gloss: Mijn huis is vlak bij de bibliotheek.
  ar.a1.unit19.lesson02.teach.line01:
    title: Vragen waar
    gloss: Layla vraagt waar het huis van Yusuf is.
    note: أين vraagt waar; بيتك (baytuka) betekent jouw huis, tegen een man gezegd; tegen een vrouw is het baytuki, hetzelfde geschreven.
    example_gloss: 'Layla zei: Waar is jouw huis, Yusuf?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Ligging van het huis
    gloss: Yusuf zegt dat zijn huis vlak bij de bibliotheek is.
    note: بيتي betekent mijn huis.
    example_gloss: 'Yusuf zei: Mijn huis is vlak bij de bibliotheek.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Kamers
    gloss: Yusuf zegt dat zijn huis één kamer en een keuken heeft.
    note: 'و (wa, en) verbindt de twee onderdelen van het huis en wordt aan het volgende woord vastgeschreven: ومطبخ.'
    example_gloss: 'Yusuf zei: In mijn huis is één kamer en een keuken.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Vragen naar een voorwerp
    gloss: Layla vraagt of Yusuf een tafel heeft.
    note: هل begint een ja-neevraag; عندك (ʿindaka) betekent jij hebt, tegen een man gezegd; tegen een vrouw is het ʿindaki, hetzelfde geschreven.
    example_gloss: 'Layla zei: Heb je een tafel?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Plaats van het voorwerp
    gloss: Yusuf zegt dat hij een tafel in de kamer heeft.
    note: عندي geeft bezit aan.
    example_gloss: 'Yusuf zei: Ja, ik heb een tafel in de kamer.'
