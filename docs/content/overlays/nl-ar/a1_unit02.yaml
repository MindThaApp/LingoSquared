teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Hoe heet je?
    gloss: Hoe heet u?
    note: ما اسمك؟ (mā ismuk) is de standaardmanier om naar een naam te vragen; zonder klinkertekens geschreven werkt het voor elke gesprekspartner.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Mijn naam is
    gloss: mijn naam [is]
    note: اسمي (ismī) is اسم (naam) met de bezittelijke uitgang ـي (mijn).
    example_gloss: Mijn naam is Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: Ik
    gloss: ik
    note: أنا (anā) is het zelfstandige persoonlijk voornaamwoord voor 'ik'; Arabische werkwoorden geven de persoon ook zelf aan, maar أنا gebruik je voor nadruk en in eenvoudige zinnen zonder werkwoord zoals deze.
    example_gloss: Ik ben Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Aangenaam
    gloss: aangenaam
    note: تشرفنا (tasharrafnā), letterlijk 'wij zijn vereerd', is het gebruikelijke wederzijdse antwoord bij een kennismaking; elk van beiden kan het als eerste zeggen.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: Waar kom je vandaan?
    gloss: Waar komt u vandaan?
    note: من أين أنت؟ (min ayna anta tegen een man, min ayna anti tegen een vrouw) vraagt waar iemand vandaan komt; zonder klinkertekens is de schrijfwijze voor beiden gelijk.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Ik kom uit
    gloss: Ik kom uit
    note: Na أنا من (anā min) volgt direct de naam van een land of stad.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Libanon
    gloss: Libanon
    note: لبنان (lubnān) heeft geen bepaald lidwoord, anders dan de meeste andere landen in deze les.
    example_gloss: Ik kom uit Libanon.
  ar.a1.unit02.lesson02.teach.misr:
    title: Egypte
    gloss: Egypte
    note: مصر (miṣr) heeft ook geen lidwoord.
    example_gloss: Ik kom uit Egypte.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Jordanië
    gloss: Jordanië
    note: الأردن (al-ʾurdun) heeft altijd het bepaald lidwoord الـ als deel van de naam, net als المغرب en العراق in deze les.
    example_gloss: Ik kom uit Jordanië.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Marokko
    gloss: Marokko
    note: المغرب (al-maghrib) betekent letterlijk 'het westen' – dezelfde wortel als in de tijd van het zonsondergangsgebed (avondgebed).
    example_gloss: Ik kom uit Marokko.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Syrië
    gloss: Syrië
    note: سوريا (sūryā) heeft geen lidwoord.
    example_gloss: Ik kom uit Syrië.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Irak
    gloss: Irak
    note: العراق (al-ʿirāq) heeft het bepaald lidwoord.
    example_gloss: Ik kom uit Irak.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Kom je uit...?
    gloss: Kom je uit Egypte?
    note: هل (hal) is een vraagwoord voor ja/nee-vragen aan het begin van de zin; het heeft zelf geen betekenis.
  ar.a1.unit02.lesson03.teach.naam:
    title: Ja
    gloss: ja
    note: نعم (naʿam) is het gewone bevestigende antwoord.
    example_gloss: Ja, ik kom uit Egypte.
  ar.a1.unit02.lesson03.teach.laa:
    title: Nee
    gloss: nee
    note: لا (lā) is het gewone ontkennende antwoord.
    example_gloss: Nee, ik kom uit Libanon.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Fijn je ontmoet te hebben
    gloss: Fijn je ontmoet te hebben
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) is een warmere afsluiting dan تشرفنا en wordt vaak vlak voor het afscheid gezegd.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Welkom
    gloss: welkom / fijn dat je er bent
    note: 'مرحبا بك (marḥaban bik) voegt بك toe, ''bij jou'': het voorzetsel بـ met het achtervoegsel ـك (jou) – hetzelfde بك als in أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Openingsgroet
    gloss: Yusuf groet Layla.
    note: Het gesprek begint met een eenvoudig مرحبا, voordat er namen worden uitgewisseld.
  ar.a1.unit02.lesson04.teach.line02:
    title: Openingsgroet, antwoord
    gloss: Layla groet hem terug.
    note: Hetzelfde woord مرحبا gebruik je voor beide kanten van een groet.
  ar.a1.unit02.lesson04.teach.line03:
    title: Naar een naam vragen
    gloss: Yusuf vraagt hoe ze heet.
    note: ما اسمك؟ opent de kennismaking.
  ar.a1.unit02.lesson04.teach.line04:
    title: Naar een naam vragen, antwoord
    gloss: Layla antwoordt en vraagt het hem terug.
    note: وأنت؟ gebruikt de vraag opnieuw zonder de hele zin te herhalen, een veelgebruikte afkorting.
  ar.a1.unit02.lesson04.teach.line05:
    title: Antwoord en wederzijds plezier
    gloss: Yusuf noemt zijn naam en zegt dat het hem een genoegen is haar te ontmoeten.
    note: تشرفنا sluit de uitwisseling van namen af.
  ar.a1.unit02.lesson04.teach.line06:
    title: Wederzijds plezier, antwoord
    gloss: Layla zegt dezelfde zin terug.
    note: تشرفنا wordt vanzelfsprekend door beiden gezegd, niet maar door één persoon.
  ar.a1.unit02.lesson04.teach.line07:
    title: Naar herkomst vragen
    gloss: Yusuf vraagt waar ze vandaan komt.
    note: من أين أنت؟ brengt het gesprek op de herkomst.
  ar.a1.unit02.lesson04.teach.line08:
    title: Naar herkomst vragen, antwoord
    gloss: Layla antwoordt en vraagt het hem terug.
    note: Ze gebruikt weer وأنت؟, dezelfde afkorting als in regel 4.
  ar.a1.unit02.lesson04.teach.line09:
    title: Herkomst noemen
    gloss: Yusuf zegt dat hij uit Libanon komt.
    note: أنا من لبنان volgt hetzelfde patroon als in les 2.
  ar.a1.unit02.lesson04.teach.line10:
    title: Het gesprek afsluiten
    gloss: Layla zegt dat ze het fijn vond hem te ontmoeten.
    note: سعدت بلقائك laat merken dat het gesprek op zijn einde loopt.
  ar.a1.unit02.lesson04.teach.line11:
    title: Afscheid
    gloss: Yusuf zegt dat ze altijd welkom is en neemt afscheid.
    note: دائما (altijd) maakt van مرحبا بك een open uitnodiging, vóór het afscheid مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Afscheid, antwoord
    gloss: Layla zegt gedag.
    note: مع السلامة sluit het gesprek af, geleerd in a1_unit01.
