    title: Sara's plan
    gloss: 'Sara: Ik ga liever zwemmen, maar ik kom ook naar het park.'
    note: أفضل (ufaḍḍil) betekent ik geef de voorkeur aan. لكنني (lākinnanī) betekent maar ik, en سآتي (sa-ātī) betekent ik zal komen.
