    title: Karim ziet het bericht
    gloss: 'Karim: Ik zie het bericht. Tot zaterdag!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + een dag
    gloss: 'Je kent إلى اللقاء (ilā al-liqāʾ, tot ziens). Je kunt er een dag aan toevoegen: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Breidt het afscheidspatroon uit de begroetingsles uit naar een bepaalde dag.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Wie gebruikt wat?
    gloss: Layla belt Yusuf elke dag. Ze gebruikt haar telefoon, geen app. Yusuf heeft thuis geen computer, maar hij gebruikt internet op zijn telefoon. Karim zoekt elke ochtend de weersverwachting op. Daarna gaat hij hardlopen. Sara stuurt Layla vaak een bericht. Gebruik jij ook elke dag je telefoon?
    note: Vergelijkt hoe alle vier de personages hun apparaten gebruiken, net als de vergelijkende leestekst in de sportles.
