    title: Een werkwoord met عن
    gloss: 'Het werkwoord أبحث (abḥath) wordt gevolgd door عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). Maar أستخدم (astakhdim) heeft het lijdend voorwerp direct erachter: أستخدم هاتفي.'
    note: عن (ʿan) betekent over of naar. Elk Arabisch werkwoord heeft zijn eigen voorzetsel, dus leer ze samen.
