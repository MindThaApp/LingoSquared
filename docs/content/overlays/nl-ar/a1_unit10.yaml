teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: Rechts
    gloss: rechts (richting)
    note: يمين (yamīn) is de rechterkant; اليمين (al-yamīn) is 'het rechts'.
    example_gloss: Naar rechts.
  ar.a1.unit10.lesson01.teach.left:
    title: Links
    gloss: links (richting)
    note: يسار (yasār) is de linkerkant; اليسار (al-yasār) is 'de linkerkant' met lidwoord, oftewel 'links'.
    example_gloss: Naar links.
  ar.a1.unit10.lesson01.teach.forward:
    title: Rechtdoor
    gloss: rechtdoor
    note: إلى الأمام (ilā l-amām) betekent letterlijk 'naar voren'; zo zeg je gewoonlijk rechtdoor of vooruit.
    example_gloss: De bibliotheek is rechtdoor.
  ar.a1.unit10.lesson01.teach.to_right:
    title: Naar rechts
    gloss: naar rechts
    note: إلى (ilā) geeft een beweging naar een richting of plaats aan.
    example_gloss: De markt is rechts.
  ar.a1.unit10.lesson02.teach.walk:
    title: Loop
    gloss: lopen
    note: امش (imshi) is het bevel 'loop!' tegen een man; tegen een vrouw zeg je امشي (imshī). Het is het gebruikelijke werkwoord om de weg te wijzen.
    example_gloss: Loop rechtdoor.
  ar.a1.unit10.lesson02.teach.then:
    title: Dan
    gloss: dan
    note: ثم (thumma) verbindt twee stappen van een route in volgorde.
    example_gloss: Loop rechtdoor en dan naar rechts.
  ar.a1.unit10.lesson02.teach.route:
    title: Twee stappen van de route
    gloss: Loop rechtdoor en dan naar rechts
    note: Eerste stap + ثم + tweede stap. Het werkwoord wordt na ثم niet herhaald.
    example_gloss: 'Layla zei: Loop rechtdoor en dan naar rechts.'
  ar.a1.unit10.lesson02.teach.line01:
    title: Vraag naar de bibliotheek
    gloss: Yusuf vraagt waar de bibliotheek is.
    note: أين المكتبة؟ is al eerder gebruikt bij de plaatsen.
    example_gloss: 'Yusuf zei: Waar is de bibliotheek?'
  ar.a1.unit10.lesson02.teach.line02:
    title: De weg wijzen
    gloss: Layla geeft twee eenvoudige stappen van de route.
    note: Layla zegt امش omdat ze tegen een man praat; tegen een vrouw zou ze امشي zeggen.
    example_gloss: 'Layla zei: Loop rechtdoor en dan naar rechts.'
  ar.a1.unit10.lesson02.teach.line03:
    title: Iemand bedanken
    gloss: Yusuf zegt dank je wel.
    note: شكرا sluit het hulpgesprek beleefd af.
    example_gloss: 'Yusuf zei: Dank je wel.'
  ar.a1.unit10.lesson02.teach.line04:
    title: De plaats bevestigen
    gloss: Layla zegt dat de bibliotheek bij de markt is.
    note: 'Hier komt قرب uit de eenheid over plaatsen terug: de bibliotheek is vlak bij de markt.'
    example_gloss: 'Layla zei: De bibliotheek is vlak bij de markt.'
