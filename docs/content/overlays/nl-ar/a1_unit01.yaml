teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: Arabisch loopt van rechts naar links
    gloss: Arabisch wordt van rechts naar links geschreven.
    note: Lees Arabisch vanaf de rechterkant naar links.
  ar.a1.unit01.lesson01.teach.mim:
    title: De letter م
    gloss: m
    note: م staat voor een m-klank en verandert van vorm afhankelijk van zijn plek in een woord.
  ar.a1.unit01.lesson01.teach.ra:
    title: De letter ر
    gloss: r
    note: ر staat voor een gerolde r-klank en verbindt niet met de letter erna.
  ar.a1.unit01.lesson01.teach.ha:
    title: De letter ح
    gloss: ḥ
    note: ح is een geademde h-klank diep uit de keel, anders dan de gewone Nederlandse h.
  ar.a1.unit01.lesson01.teach.ba:
    title: De letter ب
    gloss: b
    note: ب staat voor een b-klank en verbindt met de letters eromheen.
  ar.a1.unit01.lesson01.teach.alef:
    title: De letter ا
    gloss: ā / a
    note: ا geeft een lange ā-klank aan en verbindt niet met de volgende letter.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Bouw مرحبا
    gloss: hallo
    note: مرحبا lees je als marḥaban. Korte klinkers worden in het Arabisch meestal niet geschreven.
    example_gloss: Hallo! Ik ben Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Hallo
    gloss: hallo
    note: مرحبا is een warme begroeting voor alle gelegenheden, geschikt in bijna elke situatie.
    example_gloss: Hoi, hoe gaat het?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Goedemorgen
    gloss: goedemorgen
    note: صباح الخير lees je als ṣabāḥ al-khayr, letterlijk 'ochtend van het goede'.
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Goedemiddag of goedenavond
    gloss: goedemiddag / goedenavond
    note: مساء الخير lees je als masāʾ al-khayr en gebruik je vanaf de late middag tot in de avond.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Tot ziens
    gloss: tot ziens
    note: مع السلامة lees je als maʿa as-salāma, letterlijk 'met veiligheid' – het gebruikelijke algemene afscheid.
    example_gloss: Bedankt, tot ziens!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Dank je
    gloss: dank je
    note: شكرا lees je als shukran en kun je in elk register gebruiken.
    example_gloss: Hartelijk bedankt.
  ar.a1.unit01.lesson02.teach.afwan:
    title: Graag gedaan
    gloss: graag gedaan
    note: عفوا (ʿafwan) is het gebruikelijke antwoord op شكرا; in een andere context kan het ook 'pardon' betekenen.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Welterusten
    gloss: goedenacht
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) zeg je bij het afscheid voor de nacht of voor het slapengaan, niet als openingsgroet. تصبح is de vorm voor een man; tegen een vrouw zeg je تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Welkom
    gloss: welkom
    note: أهلا وسهلا (ahlan wa sahlan) gebruik je om een gast welkom te heten of iemand hartelijk te begroeten bij aankomst.
    example_gloss: Welkom! Welkom bij ons.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: Tot ziens
    gloss: tot ziens / tot we elkaar weer zien
    note: إلى اللقاء (ilā al-liqāʾ) is een verzorgd, neutraal afscheid.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Goedemorgen, antwoord
    gloss: goedemorgen [antwoord]
    note: صباح النور (ṣabāḥ an-nūr, 'ochtend van het licht') is het gebruikelijke antwoord op صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Goedenavond, antwoord
    gloss: goedenavond [antwoord]
    note: مساء النور (masāʾ an-nūr) is het gebruikelijke antwoord op مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Een fijne dag
    gloss: een fijne dag
    note: يوما سعيدا (yawman saʿīdan) is een warme afscheidswens.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Hoe gaat het met je?
    gloss: Hoe gaat het met u?
    note: كيف حالك؟ (kayfa ḥāluk) is de standaardmanier om te vragen hoe het met iemand gaat; zonder klinkertekens is de geschreven vorm geschikt voor elke luisteraar.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: Mannelijk en vrouwelijk 'jij'
    gloss: jij (m.) / jij (v.)
    note: Gesproken Arabisch maakt onderscheid tussen أنتَ (anta, tegen een man) en أنتِ (anti, tegen een vrouw) – en op dezelfde manier tussen حالَك en حالِك. Zonder de hier getoonde klinkertekens zijn de geschreven vormen in deze cursus voor beide gelijk.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Goed / prima
    gloss: goed / prima
    note: بخير (bikhayr) is het gebruikelijke positieve antwoord op كيف حالك؟
    example_gloss: Het gaat vandaag goed met me.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Gode zij dank
    gloss: Gode zij dank / geprezen zij God
    note: الحمد لله (al-ḥamdu lillāh) volgt heel vaak op بخير in een antwoord, ongeacht de eigen religieuze praktijk van de spreker – het werkt als een gewone afsluiter in een gesprek, ongeveer zoals 'gelukkig' of 'goddank' in het Nederlands.
    example_gloss: Goed, Gode zij dank.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: En jij?
    gloss: En u?
    note: وأنت؟ (wa anta tegen een man, wa anti tegen een vrouw) kaatst de vraag terug; zonder klinkertekens is de schrijfwijze voor beide gelijk.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Uitstekend
    gloss: uitstekend / geweldig
    note: ممتاز (mumtāz) is een enthousiastere variant van بخير.
    example_gloss: Het gaat vandaag geweldig met me!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Niet slecht
    gloss: niet slecht
    note: لا بأس (lā baʾs) is een natuurlijk, gematigd antwoord en geen klacht.
