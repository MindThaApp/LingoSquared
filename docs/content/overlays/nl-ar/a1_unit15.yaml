teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Dan
    gloss: dan
    note: من (min) is hetzelfde woord als uit (أنا من لبنان); na een vergelijkend woord betekent het dan.
    example_gloss: De markt is groter dan het café.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Groter
    gloss: groter
    note: أكبر (akbar) komt van كبير (kabīr, groot). Vergelijkende woorden als أكبر, أصغر, أقرب en أرخص beginnen allemaal met أ en hebben dezelfde vorm bij mannelijke en vrouwelijke zelfstandige naamwoorden.
    example_gloss: De markt is groter dan het café.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Kleiner
    gloss: kleiner
    note: أصغر (aṣghar), kleiner, heeft hetzelfde أ-patroon als أكبر.
    example_gloss: Het café is kleiner dan de markt.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Dichterbij
    gloss: dichterbij
    note: 'أقرب (aqrab) vergelijkt afstand: dichterbij, nabijer.'
    example_gloss: Het café is dichterbij dan de markt.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: De markt is groter
    gloss: De markt is groter dan het café
    note: Het Arabisch heeft in deze vergelijking geen apart woord voor 'is' nodig.
    example_gloss: 'Yusuf zei: De markt is groter dan het café.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Dichterbij
