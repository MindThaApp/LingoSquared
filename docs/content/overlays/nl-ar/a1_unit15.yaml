  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: Het café is dichterbij
    gloss: Het café is dichterbij dan de markt
    note: Houd من vóór het tweede onderdeel van de vergelijking.
    example_gloss: 'Yusuf zei: Het café is dichterbij dan de markt.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Naar een voorkeur vragen
    gloss: Layla vraagt wat Yusuf liever heeft.
    note: 'Layla zegt تفضل (tufaḍḍil) omdat ze het aan een man vraagt; aan een vrouw: ماذا تفضلين؟'
    example_gloss: 'Layla zei: Wat heb je liever?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Voorkeur voor het café
    gloss: Yusuf zegt dat hij het café liever heeft.
    note: Na أفضل kan een plaats volgen als de gekozen voorkeur.
    example_gloss: 'Yusuf zei: Ik heb het café liever.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Afstand vergelijken
    gloss: Yusuf zegt dat het café dichterbij is dan de markt.
    note: أقرب من geeft de reden.
    example_gloss: 'Yusuf zei: Het café is dichterbij dan de markt.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Grootte vergelijken
    gloss: Nour voegt toe dat de markt groter is dan het café.
    note: 'والسوق (was-sūq) is و (en) vastgeschreven aan السوق: en de markt.'
    example_gloss: 'Nour zei: En de markt is groter dan het café.'
