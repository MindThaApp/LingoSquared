teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: حيوان (ḥayawān) betekent dier en حيوان أليف (ḥayawān alīf) betekent huisdier. أليف (alīf) is een adjectief met de betekenis 'tam' en staat dus na het zelfstandig naamwoord.
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Layla heeft een hond.
    - Karim heeft een kat.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nour heeft een vogel.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: 'هل لديك (hal ladayka) betekent ''heb je''. Tegen een vrouw schrijf je het hetzelfde, maar de laatste klinker is i: ladayki. هل (hal) leidt een ja/nee-vraag in.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: 'ليس لدي (laysa ladayya) betekent ''ik heb geen'': ليس (laysa) ontkent en لدي (ladayya) betekent ''ik heb''.'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Niet hebben: ليس لدي'
    gloss: 'Om te zeggen dat je iets niet hebt, gebruik je ليس لدي (laysa ladayya): ليس لدي وقت (ik heb geen tijd), ليس لدي حيوان أليف (ik heb geen huisdier).'
    note: ليس لدي werkt met elk zelfstandig naamwoord en verandert niet naar geslacht. Voor 'hij' en 'zij' zeg je ليس لديه (laysa ladayhi) en ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) betekent letterlijk 'het dier mee op uitstap nemen'. Het werkwoord is أخذ, nemen.
    example_gloss: Ik laat de hond elke dag uit.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Het werkwoord verandert met de persoon
    gloss: 'Het werkwoord verandert met de persoon: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), ik neem de hond mee uit wandelen; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), Karim neemt zijn hond mee uit wandelen.'
    note: De beginletter أ (a-) staat voor 'ik' en ي (ya-) voor 'hij'. نزهة (nuzha) is een wandeling of een kort uitstapje.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Spelen met
    gloss: spelen met
    example_gloss: Karim speelt met zijn kat.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: 'كل يوم (kull yawm) betekent elke dag: كل + een enkelvoudig zelfstandig naamwoord zonder ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: أطعم (uṭʿim) betekent 'ik geef te eten'. القطة (al-qiṭṭa) is vrouwelijk, en het lidwoord ال is aan het zelfstandig naamwoord vastgeschreven.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Meervouden: كلب → كلاب'
    gloss: 'Veel meervouden zijn onregelmatig, dus leer ze samen met het zelfstandig naamwoord: كلب (kalb) wordt كلاب (kilāb), قطة (qiṭṭa) wordt قطط (qiṭaṭ) en طائر (ṭāʾir) wordt طيور (ṭuyūr).'
    note: Arabische meervouden zijn meestal gebroken meervouden, dus leer elk meervoud samen met zijn enkelvoud; bij het meervoud van dieren hoort een vrouwelijk enkelvoudig adjectief.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Yusuf houdt van honden.
    - Sara houdt van katten.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) betekent 'ik houd van dieren'. Het meervoud eindigt op ات en het lidwoord ال wordt eraan vastgeschreven.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara houdt van katten, maar heeft geen huisdier
    gloss: Sara houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf vraagt naar een huisdier
    gloss: 'Yusuf: Heb je een huisdier, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla heeft een hond
    gloss: 'Layla: Ja, ik heb een hond.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf vraagt hoe hij eruitziet
    gloss: 'Yusuf: Hoe ziet hij eruit?'
    note: 'كيف يبدو؟ (kayfa yabdū?) betekent: hoe ziet hij eruit? يبدو (yabdū) is mannelijk, omdat كلب, hond, een mannelijk woord is.'
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla beschrijft haar hond
    gloss: 'Layla: Hij heeft bruin haar en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Voornaamwoorden voor dieren
    gloss: 'Elk dierenwoord is mannelijk of vrouwelijk: de hond is هو (huwa, hij) en de kat is هي (hiya, zij). Het einde ه in أطعمه (uṭʿimuhu) betekent ''hem'' of ''het''.'
    note: Een mannelijk dierenwoord zoals كلب krijgt mannelijke voornaamwoorden en bijvoeglijke naamwoorden; een vrouwelijk woord zoals قطة krijgt vrouwelijke.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf vraagt naar wandelingen
    gloss: 'Yusuf: Ga je elke dag met hem wandelen?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla vertelt over haar dagelijkse routine
    gloss: 'Layla: Ja, ik ga elke dag met hem wandelen en ik geef hem te eten.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara en Karim over dieren
    gloss: 'Yusuf en Sara houden allebei van dieren, maar geen van beiden heeft een huisdier. Yusuf houdt van honden en Sara houdt van katten. Karim heeft wel een huisdier: een kat. Hij speelt veel met zijn kat en geeft de kat elke dag eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      يحبان: houden van
      كلاهما: beide
      الحيوانات: dieren
      منهما: van hen (geen van beiden)
      أليف: 'huisdier (letterlijk: tam)'
      الكلاب: honden
      القطط: katten
      قطة: kat
      يلعب: speelt
      ويعطي: geeft
      كل: elke
      طعاما: voer
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim speelt veel met zijn kat
    gloss: Karim speelt veel met zijn kat.
    note: 'قطته (qiṭṭatuhu) betekent ''zijn kat'': het einde ه (hu) betekent ''zijn'', en de ة van قطة wordt ت ervoor.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla vraagt het aan Nour
    gloss: 'Layla: Nour, heb jij ook een huisdier?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour heeft een vogel die Pico heet
    gloss: 'Nour: Ja, ik heb een vogel. Hij heet Pico.'
    note: اسمه (ismuhu) betekent 'zijn naam'; de ه aan het einde betekent 'zijn'. بيكو (bīkū) is de naam van de vogel.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Yusuf reageert
    gloss: 'Yusuf: Wat leuk! Wat doe je elke dag met hem?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour geeft hem elke dag eten
    gloss: 'Nour: Ik geef hem elke dag te eten.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Yusuf houdt ook van vogels
    gloss: 'Yusuf: Ik houd ook van vogels.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla sluit het gesprek af
    gloss: 'Layla: Fijn dat wij met z''n drieën van dieren houden!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
