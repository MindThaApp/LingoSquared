course:
  title: Arabisch in het Nederlands A1
  description: 'Arabisch voor beginners over huisdieren en veelvoorkomende dieren: ze benoemen, basiszorg (uitlaten, voeren, spelen), zeggen van welke dieren je houdt ook als je er geen hebt, en veelvoorkomende meervoudsvormen.'
