  ar.a1.unit35.lesson05.teach.and_lyla_trd:
    title: Layla stuurt een pakket
    gloss: Layla heeft een pakket voor haar opa en oma in Beiroet. Ze koopt een postzegel op het postkantoor. Ze schrijft het adres op het pakket. Het pakket komt morgen bij hen aan. De brief doet er drie dagen over.
    note: 'Een korte tekst over het pakket. Een werkwoord komt overeen met zijn onderwerp: الطرد يصل (aṭ-ṭard yaṣil) bij een mannelijk zelfstandig naamwoord, maar ليلى تشتري (Layla tashtarī) bij een vrouw.'
    glosses:
      طرد: pakket
      لجدها: voor haar opa
      وجدتها: en haar oma
      تشتري: koopt
      طابعا: postzegel
      البريد: postkantoor (de post)
      تكتب: schrijft
      العنوان: adres
      يصل: komt aan (mannelijke werkwoordsvorm)
      غدا: morgen
      إليهما: bij hen (allebei); het werkwoord plus dit woord betekent 'komt bij hen aan'
      الرسالة: brief
      تستغرق: duurt (een tijdsduur)
      ثلاثة: drie
      أيام: dagen
