    title: Wil je brood?
    gloss: Wil je brood?
    note: 'تريدين (turīdīna) is: je wilt, tegen een vrouw gezegd, hier Layla; tegen een man is het تريد (turīdu).'
    example_gloss: 'De ober zei: Wilt u brood?'
