    gloss: alstublieft (bij het aanreiken)
    note: تفضلي (tafaḍḍalī) zeg je tegen een vrouw als je iets aanreikt; tegen een man is het تفضل (tafaḍḍal).
    example_gloss: 'De ober zei: Alstublieft.'
  ar.a1.unit07.lesson02.teach.line01:
    title: Een bestelling plaatsen
    gloss: Layla bestelt beleefd water en koffie.
    note: Het verzoek bestaat uit أريد plus de bestelde dingen.
    example_gloss: 'Layla zei: Hallo. Ik wil graag water en koffie.'
  ar.a1.unit07.lesson02.teach.line02:
    title: Een vervolgvraag stellen
    gloss: De ober vraagt of ze brood wil.
    note: هل opent een ja-neevraag.
    example_gloss: 'De ober zei: Wilt u brood?'
  ar.a1.unit07.lesson02.teach.line03:
    title: Op de vervolgvraag antwoorden
    gloss: Layla zegt ja en vraagt om één stuk brood.
    note: نعم geeft het antwoord ja.
    example_gloss: 'Layla zei: Ja, ik wil één stuk brood.'
  ar.a1.unit07.lesson02.teach.line04:
