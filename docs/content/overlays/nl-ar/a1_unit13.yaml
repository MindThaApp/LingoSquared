teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Gisteren
    gloss: gisteren
    note: أمس (ams) betekent gisteren. Het staat bij een werkwoord in de verleden tijd, zoals ذهبت, en kan aan het eind of aan het begin van de zin staan.
    example_gloss: Ik ben gisteren naar de markt gegaan.
  ar.a1.unit13.lesson01.teach.went:
    title: Ik ben gegaan
    gloss: ik ben gegaan
    note: 'ذهبت (dhahabtu) betekent ik ging / ik ben gegaan: de uitgang -tu van de verleden tijd geeft "ik" aan. Zonder klinkertekens kunnen dezelfde letters ook gelezen worden als dhahabta / dhahabti (jij ging, tegen een man / tegen een vrouw) of dhahabat (zij ging); de context vertelt je welke.'
    example_gloss: Ik ben naar de markt gegaan.
  ar.a1.unit13.lesson01.teach.bought:
    title: Ik heb gekocht
    gloss: ik heb gekocht
    note: اشتريت (ishtaraytu) betekent ik kocht / ik heb gekocht; net als ذهبت eindigt het op -tu voor "ik".
    example_gloss: Ik heb appels gekocht.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Appels
    gloss: appels
    note: تفاحا (tuffāḥan) is تفاح (appels, uit de eenheid over winkelen) als lijdend voorwerp van het werkwoord; de extra ا schrijft de uitgang -an.
    example_gloss: Ik heb appels gekocht.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Wat heb je gisteren gedaan?
    gloss: Wat hebt u gisteren gedaan?
    note: 'ماذا (mādhā) vraagt wat; فعلت betekent hier jij deed: faʿalta tegen een man, faʿalti tegen een vrouw (het geschreven woord is hetzelfde). Yusuf vraagt het aan Layla, dus hij zegt faʿalti.'
    example_gloss: 'Yusuf zei: Wat heb je gisteren gedaan?'
  ar.a1.unit13.lesson02.teach.drank:
    title: Ik dronk / ik heb gedronken
    gloss: Ik dronk
    note: شربت (sharibtu) betekent ik dronk; het heeft dezelfde uitgang -tu (ik) als ذهبت en اشتريت.
    example_gloss: Ik heb koffie gedronken.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Een reeks recente gebeurtenissen
    gloss: Ik ben naar de markt gegaan. Ik heb appels gekocht. Ik heb koffie gedronken.
    note: Met een paar korte zinnen in de verleden tijd achter elkaar vertel je wat je hebt gedaan. Elk werkwoord eindigt op -tu voor "ik".
    example_gloss: Gisteren ben ik naar de markt gegaan. Ik heb appels gekocht. Ik heb koffie gedronken.
  ar.a1.unit13.lesson02.teach.line01:
    title: Vragen naar gisteren
    gloss: Yusuf vraagt wat Layla gisteren heeft gedaan.
    note: Yusuf vraagt het aan Layla, een vrouw, dus فعلت lees je hier als faʿalti; tegen een man is het faʿalta.
    example_gloss: 'Yusuf zei: Wat heb je gisteren gedaan?'
  ar.a1.unit13.lesson02.teach.line02:
    title: Naar de markt gegaan
    gloss: Layla zegt dat ze naar de markt is gegaan.
    note: ذهبت geeft een afgeronde beweging aan.
    example_gloss: 'Layla zei: Ik ben naar de markt gegaan.'
  ar.a1.unit13.lesson02.teach.line03:
    title: Appels gekocht
    gloss: Layla zegt dat ze appels heeft gekocht.
    note: Dit voegt een tweede afgeronde handeling toe.
    example_gloss: 'Layla zei: Ik heb appels gekocht.'
  ar.a1.unit13.lesson02.teach.line04:
    title: Koffie gedronken
    gloss: Layla zegt dat ze koffie heeft gedronken.
    note: Hiermee is het korte verslag compleet.
    example_gloss: 'Layla zei: Ik heb koffie gedronken.'
