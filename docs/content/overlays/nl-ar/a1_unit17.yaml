  ar.a1.unit17.lesson01.teach.pain:
    title: Pijn
    gloss: pijn
    note: ألم (alam) betekent pijn; عندي ألم (ʿindī alam) is ik heb pijn.
    example_gloss: Ik heb pijn.
  ar.a1.unit17.lesson01.teach.head:
    title: Hoofd
    gloss: het hoofd
    note: 'الرأس (ar-raʾs) is het hoofd. In het Arabisch zeg je عندي ألم في الرأس, letterlijk een pijn in het hoofd, waar je in het Nederlands meestal zegt: ik heb hoofdpijn.'
    example_gloss: Ik heb pijn in mijn hoofd.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Maag
    gloss: de buik
    note: البطن (al-baṭn) is de buik of het maaggebied.
    example_gloss: Ik heb pijn in mijn buik.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Pijn in het hoofd
    gloss: Ik heb hoofdpijn
    note: عندي ألم, letterlijk bij mij (is) pijn, is hoe je in het Arabisch zegt dat je pijn hebt; في + het lichaamsdeel geeft aan waar.
    example_gloss: 'Layla zei: Ik heb hoofdpijn.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: Wat is het probleem?
    gloss: Wat is er aan de hand?
    note: ما (mā) betekent wat; المشكلة (al-mushkila) betekent het probleem.
    example_gloss: Wat is er aan de hand, Layla?
  ar.a1.unit17.lesson02.teach.drink:
    title: Water drinken
    gloss: drink water
    note: اشربي (ishrabī) is het bevel drink! tegen een vrouw, hier Layla; tegen een man is het اشرب (ishrab).
    example_gloss: 'Yusuf zei: Drink water.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Rust
    gloss: rust uit
    note: استريحي (istarīḥī) is het bevel rust uit! tegen een vrouw; tegen een man is het استرح (istariḥ).
    example_gloss: Rust vandaag uit.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Ik heb hulp nodig
    gloss: Ik heb hulp nodig
    note: أحتاج (aḥtāj) betekent ik heb nodig en مساعدة (musāʿada) betekent hulp. Je komt ook أحتاج إلى مساعدة tegen, met إلى; beide zijn correct.
    example_gloss: Ik heb pijn. Ik heb hulp nodig.
  ar.a1.unit17.lesson02.teach.line01:
    title: Naar het probleem vragen
    gloss: Yusuf vraagt Layla wat er aan de hand is.
    note: يا ليلى spreekt Layla bij haar naam aan.
    example_gloss: 'Yusuf zei: Wat is er aan de hand, Layla?'
  ar.a1.unit17.lesson02.teach.line02:
    title: De klacht noemen
    gloss: Layla zegt dat ze hoofdpijn heeft.
    note: De klacht wordt direct genoemd.
    example_gloss: 'Layla zei: Ik heb hoofdpijn.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Eenvoudig advies
    gloss: Yusuf zegt tegen Layla dat ze water moet drinken en moet rusten.
    note: 'Beide bevelen zijn vrouwelijk, omdat Yusuf tegen Layla praat; و (wa, en) wordt aan het volgende woord vastgeschreven: واستريحي.'
    example_gloss: 'Yusuf zei: Drink water en rust uit.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Bedankt
    gloss: Layla zegt bedankt.
    note: شكرا sluit het korte gesprek af.
    example_gloss: 'Layla zei: Bedankt.'
