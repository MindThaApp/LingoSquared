    title: Wie doet wat voor het feest?
    gloss: Zaterdag is Sara's verjaardag. We vieren het met een feestje. Yusuf nodigt Karim en Layla uit voor het feest. Karim viert graag feest met vrienden. Layla komt ook naar het feest. Iedereen is blij voor Sara.
