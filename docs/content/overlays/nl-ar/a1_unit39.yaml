    title: Een gesprek over jaargetijden
    gloss: 'Het is nu lente. De rozen zijn mooi. Nour vraagt: Welk seizoen vind je mooi? Yusuf zegt: Ik hou van de zomer. In de zomer gaan we zwemmen. Layla zegt: Ik hou van de winter. In de winter gaan we schaatsen.'
