  ar.a1.unit08.lesson01.teach.dirhams:
    title: Dirham
    gloss: dirham
    note: دراهم (darāhim) is het meervoud van درهم (dirham), de munteenheid van Marokko en de VAE; na de getallen 3 tot en met 10 gebruik je het meervoud.
    example_gloss: Ik heb tien dirham.
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: Hoeveel kosten de appels?
    gloss: Hoeveel kosten de appels?
    note: 'كم سعر التفاح؟ (kam siʿr at-tuffāḥ) vraagt letterlijk: ''hoeveel is de prijs van de appels?''. ما سعر التفاح؟ (''wat is de prijs van de appels?'') en بكم التفاح؟ (''voor hoeveel zijn de appels?'') zijn ook gangbaar.'
    example_gloss: 'Layla zei: Hoeveel kosten de appels?'
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: Voor tien dirham
    gloss: voor tien dirham
    note: 'Het voorvoegsel بـ (bi-) geeft de prijs aan: بعشرة (bi-ʿashara), ''voor tien''.'
    example_gloss: De appels kosten tien dirham.
  ar.a1.unit08.lesson02.teach.two_apples:
    title: Twee appels
    gloss: twee appels
    note: تفاحتين (tuffāḥatayn) is de tweevoud (dualis) van تفاحة ('een appel'), in de vorm voor het lijdend voorwerp die na أريد staat.
    example_gloss: Twee appels.
  ar.a1.unit08.lesson02.teach.want_two:
    title: Ik wil twee appels
    gloss: Ik wil twee appels
    note: Zet أريد vóór datgene wat je wilt hebben.
    example_gloss: Ik wil twee appels.
  ar.a1.unit08.lesson02.teach.line01:
    title: Naar de prijs vragen
    gloss: Layla vraagt naar de prijs van de appels.
    note: Dit is hetzelfde patroon voor een prijsvraag.
    example_gloss: 'Layla zei: Hoeveel kosten de appels?'
  ar.a1.unit08.lesson02.teach.line02:
    title: De prijs noemen
    gloss: De verkoper zegt dat de appels tien dirham kosten.
    note: Bij بعشرة zit het prijsvoorvoegsel vast aan عشرة.
    example_gloss: 'De verkoper zei: De appels kosten tien dirham.'
  ar.a1.unit08.lesson02.teach.line03:
    title: Om een hoeveelheid vragen
    gloss: Layla vraagt beleefd om twee appels.
    note: من فضلك maakt het verzoek beleefd.
    example_gloss: 'Layla zei: Ik wil twee appels, alsjeblieft.'
  ar.a1.unit08.lesson02.teach.line04:
    title: Iets overhandigen
    gloss: 'De verkoper zegt: alsjeblieft, hier.'
    note: 'تفضلي kwam al voor in de eenheid over eten; je zegt het tegen een vrouw (tegen een man: تفضل).'
    example_gloss: 'De verkoper zei: Alsjeblieft, hier.'
