    title: Hoeveel kost dit?
    gloss: Hoeveel kost dit?
    note: كم هذا؟ (kam hādhā) is een eenvoudige manier om naar een prijs te vragen; بكم هذا؟ (bi-kam hādhā, 'voor hoeveel is dit?') is ook heel gebruikelijk.
  ar.a1.unit03.lesson03.teach.raqam:
    title: Nummer
    gloss: nummer
    note: رقم (raqam) is het algemene woord voor een getal of nummer, bijvoorbeeld een telefoonnummer.
    example_gloss: Mijn nummer is één.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Naar de prijs vragen
    gloss: Yusuf vraagt wat iets kost.
    note: كم هذا؟ opent het gesprek.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: De prijs noemen
    gloss: Layla zegt dat het vijf kost.
    note: بخمسة plakt het voorzetsel بـ (voor/tegen) direct vast aan het getal.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Vraag naar iets anders
    gloss: Yusuf wijst naar iets anders.
    note: وهذا؟ maakt de vraag korter door de vorige context te hergebruiken.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: De tweede prijs noemen
    gloss: Layla zegt dat het tien kost.
    note: بعشرة volgt hetzelfde patroon als بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Bedanken
    gloss: Yusuf bedankt haar.
    note: شكرا, uit de eenheid over begroetingen, sluit het gesprek af.
