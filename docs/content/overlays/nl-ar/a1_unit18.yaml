teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: Werk
    gloss: werk
    note: 'عمل (ʿamal) betekent werk. ما عملك؟ vraagt naar iemands werk; de uitgang ـك betekent je/jouw: ʿamaluka tegen een man, ʿamaluki tegen een vrouw, op dezelfde manier geschreven.'
    example_gloss: Wat voor werk doe je?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Ingenieur
    gloss: ingenieur
    note: مهندس (muhandis) is de mannelijke vorm, gebruikt voor Yusuf; een vrouw zegt أنا مهندسة (anā muhandisa).
    example_gloss: Ik ben ingenieur.
  ar.a1.unit18.lesson01.teach.office:
    title: Kantoor
    gloss: kantoor
    note: مكتب (maktab) is een kantoor; في مكتب betekent op een kantoor.
    example_gloss: Ik werk op een kantoor.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Ik werk op een kantoor
    gloss: Ik werk op een kantoor
    note: أعمل (aʿmal) betekent ik werk; het heeft dezelfde wortel als عمل (werk), en de أ aan het begin geeft ik aan.
    example_gloss: 'Yusuf zei: Ik werk op een kantoor.'
  ar.a1.unit18.lesson02.teach.write:
    title: Ik schrijf
    gloss: ik schrijf
    note: أكتب (aktub) betekent ik schrijf.
    example_gloss: Ik schrijf op mijn werk.
  ar.a1.unit18.lesson02.teach.read:
    title: Ik lees
    gloss: ik lees
    note: أقرأ (aqraʾ) betekent ik lees.
    example_gloss: Ik lees op mijn werk.
  ar.a1.unit18.lesson02.teach.at_work:
    title: Op het werk
    gloss: op het werk
    note: العمل (al-ʿamal) is het werk; في العمل betekent op het werk.
    example_gloss: Ik schrijf en lees op mijn werk.
  ar.a1.unit18.lesson02.teach.line01:
    title: Naar het werk vragen
    gloss: Layla vraagt Yusuf naar zijn werk.
    note: يا يوسف spreekt Yusuf bij zijn naam aan.
    example_gloss: 'Layla zei: Wat voor werk doe je, Yusuf?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Het beroep noemen
    gloss: Yusuf zegt dat hij ingenieur is.
    note: Een apart woord voor "ben" is niet nodig.
    example_gloss: 'Yusuf zei: Ik ben ingenieur.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Je werkplek noemen
    gloss: Yusuf zegt dat hij op een kantoor werkt.
    note: أعمل في geeft aan waar je werkt.
    example_gloss: 'Yusuf zei: Ik werk op een kantoor.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Naar een activiteit vragen
    gloss: Layla vraagt Yusuf wat hij elke dag doet.
    note: 'Dit is dezelfde vraag over je dagelijkse routine; تفعل zeg je tegen een man. Tegen een vrouw: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla zei: Wat doe je elke dag?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Een activiteit noemen
    gloss: Yusuf zegt dat hij op zijn werk schrijft en leest.
    note: 'و (wa, en) verbindt de twee activiteiten en wordt aan het volgende woord vastgeschreven: وأقرأ.'
    example_gloss: 'Yusuf zei: Ik schrijf en lees op mijn werk.'
