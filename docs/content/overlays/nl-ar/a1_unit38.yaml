    title: Nour en Layla kopen rozen
    gloss: Nour en Layla gaan op zaterdag naar de bloemenmarkt. Welke kleur wil Layla? Layla wil graag rood. Welke kleur wil Nour? Nour wil graag geel. Ze kopen vijf rozen. Het kost tien dirham. De rozen zijn heel mooi!
