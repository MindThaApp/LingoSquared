      status: correct
    feedback: 'Nour zegt: نريد تذكرتين لمدينة الملاهي من فضلك (nurīdu tadhkaratayn li-madīnat al-malāhī min faḍlik). تذكرتين (tadhkaratayn) is de dualis: twee kaartjes. Het Arabisch heeft dus geen apart woord voor twee nodig.'
