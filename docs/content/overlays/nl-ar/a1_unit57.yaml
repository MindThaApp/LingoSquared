  ar.a1.unit57.lesson05.exercise01.listen_nryd_tdhkrtyn_lmdyna:
    instruction: Luister naar de dialoog en kies wat Nour zegt.
    correct_option: We willen graag twee kaartjes voor het pretpark kopen.
    distractors:
    - We willen graag in de achtbaan.
