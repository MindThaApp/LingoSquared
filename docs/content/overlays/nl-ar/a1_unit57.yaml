    feedback: 'De medewerker zegt: بالطبع. المبلغ أربعون درهما (bi-ṭ-ṭabʿ. al-mablagh arbaʿūn dirhaman). أربعون (arbaʿūn) betekent veertig, en het zelfstandig naamwoord erna staat in het enkelvoud: درهما.'
    prompt_blocks:
    - Hoeveel kosten twee kaartjes?
