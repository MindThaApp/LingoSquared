teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: Kleding
    gloss: kleren
    note: ملابس (malābis) is een meervoudig zelfstandig naamwoord en betekent kleren.
    example_gloss: Ik wil kleren.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Overhemd
    gloss: overhemd
    note: 'قميص (qamīṣ) betekent shirt; na أريد krijgt het de lijdend-voorwerpuitgang -an: قميصا (qamīṣan).'
    example_gloss: Ik wil een shirt.
  ar.a1.unit21.lesson01.teach.blue:
    title: Blauw
    gloss: blauw
    note: 'أزرق (azraq) is de mannelijke vorm, passend bij قميص; bij een vrouwelijk zelfstandig naamwoord wordt het زرقاء (zarqāʾ). Na أريد krijgt أزرق geen extra alif: قميصا أزرق.'
    example_gloss: Ik wil een blauw shirt.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Een blauw overhemd
    gloss: een blauw shirt
    note: 'In het Arabisch komt de kleur na het voorwerp: قميصا أزرق (qamīṣan azraq).'
    example_gloss: Ik wil een blauw shirt.
  ar.a1.unit21.lesson02.teach.size:
    title: Maat
    gloss: de maat
    note: مقاس (maqās) betekent maat; ما المقاس؟ (mā l-maqās) vraagt naar de maat.
    example_gloss: Welke maat?
  ar.a1.unit21.lesson02.teach.medium:
    title: Maat medium
    gloss: maat medium
    note: 'متوسط (mutawassiṭ) betekent medium; met بـ (bi-, in) hecht het zich aan een voorwerp: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), een shirt in maat medium.'
    example_gloss: Ik wil een shirt in maat medium.
  ar.a1.unit21.lesson02.teach.price:
    title: Tien dirham
    gloss: tien dirham
    note: 'بعشرة (bi-ʿashara) betekent voor tien: het voorvoegsel بـ geeft de prijs aan, zoals in de winkelles.'
    example_gloss: Het shirt kost tien dirham.
  ar.a1.unit21.lesson02.teach.line01:
    title: Iets vragen
    gloss: Layla vraagt om een blauw shirt.
    note: من فضلك houdt het verzoek beleefd.
    example_gloss: 'Layla zei: Ik wil graag een blauw shirt.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Naar de maat vragen
    gloss: De verkoper vraagt welke maat.
    note: 'De verkoper vraagt naar de maat: ما المقاس؟'
    example_gloss: 'De verkoper zei: Welke maat?'
  ar.a1.unit21.lesson02.teach.line03:
    title: De maat zeggen
    gloss: Layla zegt maat medium.
    note: Dit beantwoordt direct de vraag naar de maat.
    example_gloss: 'Layla zei: Maat medium.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Het artikel geven en de prijs noemen
    gloss: De verkoper geeft het shirt en noemt de prijs.
    note: 'تفضلي (tafaḍḍalī) zeg je tegen een vrouw als je iets overhandigt; tegen een man: تفضل (tafaḍḍal).'
    example_gloss: 'De verkoper zei: Alsjeblieft. Het shirt kost tien dirham.'
