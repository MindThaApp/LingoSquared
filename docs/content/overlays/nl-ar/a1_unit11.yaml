  ar.a1.unit11.lesson01.teach.every_day:
    title: Elke dag
    gloss: elke dag
    note: كل يوم (kull yawm) staat vaak na het werkwoord (أدرس كل يوم), maar kan ook aan het begin van de zin staan (كل يوم أدرس).
    example_gloss: Ik studeer elke dag.
  ar.a1.unit11.lesson01.teach.wake:
    title: Ik word wakker
    gloss: ik word wakker
    note: أستيقظ (astayqiẓ) betekent 'ik word wakker'; de أ aan het begin geeft 'ik' aan bij werkwoorden in de tegenwoordige tijd. السابعة (as-sābiʿa) is zeven bij kloktijden.
    example_gloss: Ik word om zeven uur wakker.
  ar.a1.unit11.lesson01.teach.study:
    title: Ik studeer
    gloss: ik studeer
    note: أدرس (adrus) betekent 'ik studeer'; het heeft dezelfde wortel als درس (les). التاسعة (at-tāsiʿa) is negen bij kloktijden.
    example_gloss: Ik studeer om negen uur.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Ik slaap
    gloss: ik slaap / ik ga slapen
    note: أنام (anām) betekent 'ik slaap'; met een tijdstip betekent het 'ik ga naar bed'. العاشرة (al-ʿāshira) is tien bij kloktijden.
    example_gloss: Ik ga om tien uur slapen.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Wat doe je elke dag?
    gloss: Wat doe je elke dag?
    note: ماذا (mādhā) vraagt 'wat', en تفعل (tafʿal) betekent 'je doet', tegen een man; tegen een vrouw is het تفعلين (tafʿalīn).
    example_gloss: 'Layla zei: Wat doe je elke dag?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Drie zinnen over je dagelijkse routine
    gloss: Ik word om zeven uur wakker. Ik studeer om negen uur. Ik ga om tien uur slapen.
    note: Elke zin bestaat uit een werkwoord + في الساعة + het uur; samen beschrijven ze een hele dag.
    example_gloss: Elke dag word ik om zeven uur wakker. Om negen uur studeer ik. Om tien uur ga ik slapen.
  ar.a1.unit11.lesson02.teach.line01:
    title: Vragen naar een dagelijkse routine
    gloss: Layla vraagt wat Yusuf elke dag doet.
    note: 'Layla zegt تفعل, omdat ze het aan een man vraagt. Tegen een vrouw zeg je: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla zei: Wat doe je elke dag?'
  ar.a1.unit11.lesson02.teach.line02:
    title: Tijd van opstaan
    gloss: Yusuf zegt dat hij om zeven uur wakker wordt.
    note: Gebruik في الساعة voor de tijd.
    example_gloss: 'Yusuf zei: Ik word om zeven uur wakker.'
  ar.a1.unit11.lesson02.teach.line03:
    title: Tijd van studeren
    gloss: Yusuf zegt dat hij om negen uur studeert.
    note: Hetzelfde patroon voor de tijd werkt ook met أدرس.
    example_gloss: 'Yusuf zei: Ik studeer om negen uur.'
  ar.a1.unit11.lesson02.teach.line04:
    title: Tijd van slapen
    gloss: Yusuf zegt dat hij om tien uur naar bed gaat.
    note: De laatste activiteit van zijn dag gebruikt hetzelfde patroon voor de tijd, met أنام.
    example_gloss: 'Yusuf zei: Ik ga om tien uur slapen.'
