teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Plaats
    gloss: plaats
    note: مكان (makān) is het algemene woord voor een plaats. هذا (dit) kwam eerder aan bod bij de getallen.
    example_gloss: Dit is een plaats.
  ar.a1.unit09.lesson01.teach.library:
    title: Bibliotheek
    gloss: bibliotheek
    note: مكتبة (maktaba) kan bibliotheek of boekhandel betekenen; hier is het een bibliotheek. المكتبة (al-maktaba) is 'de bibliotheek'.
    example_gloss: De bibliotheek is hier.
  ar.a1.unit09.lesson01.teach.market:
    title: Markt
    gloss: markt
    note: سوق (sūq) betekent markt; السوق (as-sūq) is 'de markt'.
    example_gloss: De markt is hier.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Café
    gloss: café
    note: مقهى (maqhā) betekent café; het is verwant aan قهوة (koffie). المقهى (al-maqhā) is 'het café'.
    example_gloss: Het café is hier.
  ar.a1.unit09.lesson01.teach.here:
    title: Hier
    gloss: hier
    note: 'هنا (hunā) staat meestal na de plaats: المقهى هنا, het café is hier. In deze zin heeft het Arabisch geen woord voor ''is'' nodig.'
    example_gloss: Het café is hier.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Waar is de bibliotheek?
    gloss: Waar is de bibliotheek?
    note: أين (ayna) betekent 'waar'; je kent het al van من أين أنت؟ (waar kom je vandaan?).
    example_gloss: 'Yusuf zei: Waar is de bibliotheek?'
  ar.a1.unit09.lesson02.teach.near:
    title: Dichtbij
    gloss: vlak bij
    note: 'قرب (qurba) betekent ''vlak bij'' en staat voor de plaats waar het naar verwijst: قرب المكتبة, vlak bij de bibliotheek. بالقرب من (bi-l-qurbi min) betekent hetzelfde.'
    example_gloss: Het café is vlak bij de bibliotheek.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: De bibliotheek is vlak bij de markt
    gloss: De bibliotheek is vlak bij de markt
    note: Het Arabisch heeft hier geen apart woord voor 'is' nodig.
    example_gloss: 'Layla zei: De bibliotheek is vlak bij de markt.'
  ar.a1.unit09.lesson02.teach.line01:
    title: Vragen waar iets is
    gloss: Yusuf vraagt waar de bibliotheek is.
    note: أين opent de vraag naar een plaats.
    example_gloss: 'Yusuf zei: Waar is de bibliotheek?'
  ar.a1.unit09.lesson02.teach.line02:
    title: De bibliotheek aanwijzen
    gloss: Layla zegt dat de bibliotheek hier vlak bij de markt is.
    note: 'هنا en قرب kunnen samen voorkomen: hier, vlak bij de markt.'
    example_gloss: 'Layla zei: De bibliotheek is hier vlak bij de markt.'
  ar.a1.unit09.lesson02.teach.line03:
    title: Vragen naar het café
    gloss: Yusuf vraagt waar het café is.
    note: 'و (wa, en) wordt vastgeschreven aan het volgende woord: وأين (wa-ayna), en waar.'
    example_gloss: 'Yusuf zei: En waar is het café?'
  ar.a1.unit09.lesson02.teach.line04:
    title: Het café aanwijzen
    gloss: Layla zegt dat het café vlak bij de bibliotheek is.
    note: 'Plaats + قرب + tweede plaats: المقهى قرب المكتبة, het café is vlak bij de bibliotheek.'
    example_gloss: 'Layla zei: Het café is vlak bij de bibliotheek.'
