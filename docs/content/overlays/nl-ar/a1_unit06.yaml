teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: Familie
    gloss: familie
    note: عائلة (ʿāʾila) is het algemene woord voor familie. In het voorbeeld is هذه de vrouwelijke vorm van هذا (dit/deze), omdat عائلة vrouwelijk is.
    example_gloss: Dit is een familie.
  ar.a1.unit06.lesson01.teach.father:
    title: Vader
    gloss: vader
    note: أب (ab) betekent vader.
    example_gloss: Ik heb een vader.
  ar.a1.unit06.lesson01.teach.mother:
    title: Moeder
    gloss: moeder
    note: أم (umm) betekent moeder.
    example_gloss: Ik heb een moeder.
  ar.a1.unit06.lesson01.teach.brother:
    title: Broer
    gloss: broer
    note: أخ (akh) betekent broer.
    example_gloss: Ik heb een broer.
  ar.a1.unit06.lesson01.teach.sister:
    title: Zus
    gloss: zus
    note: أخت (ukht) betekent zus.
    example_gloss: Ik heb een broer en een zus.
  ar.a1.unit06.lesson01.teach.i_have:
    title: Ik heb
    gloss: ik heb
    note: عندي (ʿindī, letterlijk 'bij mij') is de eenvoudige manier op A1-niveau om te zeggen dat je iets hebt; لدي (ladayya) is een formelere variant.
    example_gloss: Ik heb een zus.
  ar.a1.unit06.lesson02.teach.in_family:
    title: In jouw familie
    gloss: in jouw familie
    note: 'Hier is من man, ''wie'', en niet min, ''uit'', zoals in من أين أنت؟ – ze worden hetzelfde geschreven. عائلتك betekent jouw familie: ʿāʾilatuka tegen een man, ʿāʾilatuki tegen een vrouw.'
    example_gloss: Wie zit er in jouw familie?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Haar naam is Nour
    gloss: haar naam is Nour
    note: اسمها betekent haar naam.
    example_gloss: 'Yusuf zei: Haar naam is Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Vraag naar de familie
    gloss: Layla vraagt wie er in de familie van Yusuf zit.
    note: من (man) betekent hier wie. يا يوسف spreekt Yusuf aan met zijn naam.
    example_gloss: 'Layla zei: Wie zit er in jouw familie, Yusuf?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Beschrijf je familie
    gloss: Yusuf zegt dat hij een vader, een moeder en een zus heeft.
    note: و verbindt de familieleden.
    example_gloss: 'Yusuf zei: Ik heb een vader, een moeder en een zus.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Vraag naar de naam van de zus
    gloss: Layla vraagt hoe zijn zus heet.
    note: 'أختك betekent jouw zus: ukhtuka tegen een man, ukhtuki tegen een vrouw. Hier vraagt Layla het aan Yusuf, dus ukhtuka.'
    example_gloss: 'Layla zei: Hoe heet je zus?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Noem haar naam
    gloss: Yusuf zegt dat ze Nour heet.
    note: 'De uitgang ـها betekent haar: اسمها (ismuhā), haar naam.'
    example_gloss: 'Yusuf zei: Haar naam is Nour.'
