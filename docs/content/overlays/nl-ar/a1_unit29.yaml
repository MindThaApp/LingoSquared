  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Wie reist hoe?
    gloss: Layla reist elke dag met de trein naar haar werk. Yusuf fietst meestal, maar als het regent neemt hij ook de trein. Karim rijdt liever auto. Sara woont dichtbij en loopt naar haar werk. Hoe ga jij naar je werk?
    note: De werkwoorden van de vrouwen (تسافر, تسكن, تمشي) beginnen met ت (ta-), en de werkwoorden van de mannen (يركب, يذهب, يقود, يفضل) beginnen met ي (ya-).
    glosses:
      تسافر: reist
      كل: elke
      يوم: dag
      بالقطار: met de trein
      عملها: werk
      يركب: fietst
      غالبا: meestal
      أمطرت: regent
      يذهب: neemt
      يقود: rijdt
      يفضل: heeft liever
      السيارة: auto
      تسكن: woont
      قريبا: dichtbij
      وتمشي: loopt
      تذهب: reis
