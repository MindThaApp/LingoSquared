teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Telefoon
    gloss: telefoon
    note: هاتف (hātif) betekent 'telefoon'.
    example_gloss: Dit is een telefoon.
  ar.a1.unit23.lesson01.teach.hear:
    title: Ik hoor je
    gloss: ik hoor je
    note: أسمعك (asmaʿuka tegen een man, asmaʿuki tegen een vrouw) betekent 'ik hoor je'; لا أسمعك (lā asmaʿuk) betekent 'ik hoor je niet'.
    example_gloss: Ik hoor je niet.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Herhalen
    gloss: herhaal
    note: 'أعد (aʿid) zeg je tegen een man; tegen een vrouw: أعيدي (aʿīdī). أعد من فضلك is een beleefd verzoek om te herhalen.'
    example_gloss: Ik hoor je niet. Herhaal het alsjeblieft.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Langzaam praten
    gloss: praat langzaam
    note: 'تكلم ببطء (takallam bi-buṭʾ) zeg je tegen een man; tegen een vrouw: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Praat alsjeblieft langzaam.
  ar.a1.unit23.lesson02.teach.message:
    title: Bericht
    gloss: bericht
    note: رسالة (risāla) is een bericht; het kan ook een brief betekenen.
    example_gloss: Dit is een bericht.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Afspraak
    gloss: de afspraak
    note: موعد (mawʿid) betekent afspraak; الموعد (al-mawʿid) is de afspraak.
    example_gloss: De afspraak is om vijf uur.
  ar.a1.unit23.lesson02.teach.line01:
    title: De telefoon opnemen
    gloss: Yusuf begroet Layla aan de telefoon en noemt zijn naam.
    note: Aan de telefoon zegt أنا يوسف (anā Yūsuf) wie er belt.
    example_gloss: 'Yusuf zei: Hallo, ik ben Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Niet kunnen horen
    gloss: Layla zegt dat ze Yusuf niet kan horen.
    note: Dit leidt het verzoek om opheldering in.
    example_gloss: 'Layla zei: Hallo Yusuf, ik kan je niet horen.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Vragen om langzamer te praten
    gloss: Layla vraagt Yusuf om langzaam te praten.
    note: من فضلك maakt het verzoek beleefd; Layla zegt تكلم omdat ze tegen een man praat.
    example_gloss: 'Layla zei: Praat alsjeblieft langzaam.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Belangrijk detail
    gloss: Yusuf zegt dat de afspraak om vijf uur is.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) betekent om vijf uur.
    example_gloss: 'Yusuf zei: De afspraak is om vijf uur.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Vragen om te herhalen
    gloss: Layla vraagt Yusuf om te herhalen.
    note: أعد من فضلك is het verzoek om te herhalen.
    example_gloss: 'Layla zei: Herhaal alsjeblieft.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Detail herhalen
    gloss: Yusuf herhaalt het tijdstip van de afspraak.
    note: De herhaalde zin bevestigt het tijdstip.
    example_gloss: 'Yusuf zei: De afspraak is om vijf uur.'
