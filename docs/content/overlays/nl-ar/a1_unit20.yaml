teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: Weer
    gloss: het weer
    note: الجو (al-jaww) is het gewone woord voor het weer; الطقس (aṭ-ṭaqs), in de titel van de les, betekent ook weer.
    example_gloss: Hoe is het weer vandaag?
  ar.a1.unit20.lesson01.teach.sunny:
    title: Zonnig
    gloss: zonnig
    note: مشمس (mushmis) betekent zonnig; het is mannelijk, in overeenstemming met الجو.
    example_gloss: Het is vandaag zonnig.
  ar.a1.unit20.lesson01.teach.cold:
    title: Koud
    gloss: koud
    note: بارد (bārid) betekent koud.
    example_gloss: Het is vandaag koud.
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: Vandaag zonnig
    gloss: Het is vandaag zonnig
    note: In het Arabisch heb je geen apart woord voor 'is' nodig.
    example_gloss: 'Yusuf zei: Het is vandaag zonnig.'
  ar.a1.unit20.lesson02.teach.hot:
    title: Heet
    gloss: heet
    note: حار (ḥārr) betekent heet.
    example_gloss: Het is heet.
  ar.a1.unit20.lesson02.teach.weather_question:
    title: Hoe is het weer?
    gloss: Hoe is het weer vandaag?
    note: كيف (kayfa) betekent 'hoe', zoals in كيف حالك؟
    example_gloss: 'Layla zei: Hoe is het weer vandaag?'
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: Laten we water drinken
    gloss: laten we water drinken
    note: هيا (hayyā) + een werkwoord in de wij-vorm betekent 'laten we'; نشرب (nashrab) betekent 'wij drinken'.
    example_gloss: Het is heet. Laten we water drinken.
  ar.a1.unit20.lesson02.teach.line01:
    title: Naar het weer vragen
    gloss: Layla vraagt hoe het weer vandaag is.
    note: اليوم betekent 'vandaag'.
    example_gloss: 'Layla zei: Hoe is het weer vandaag?'
  ar.a1.unit20.lesson02.teach.line02:
    title: Zonnig en heet
    gloss: Yusuf zegt dat het zonnig en heet is.
    note: 'و (wa, ''en'') verbindt de twee weerwoorden en wordt aan het volgende woord vastgeschreven: وحار.'
    example_gloss: 'Yusuf zei: Het is zonnig en heet.'
  ar.a1.unit20.lesson02.teach.line03:
    title: Het café voorstellen
    gloss: Layla stelt voor om naar het café te gaan.
    note: هل نذهب betekent 'zullen we gaan?'
    example_gloss: 'Layla zei: Zullen we naar het café gaan?'
  ar.a1.unit20.lesson02.teach.line04:
    title: 'Het plan: water'
    gloss: Yusuf zegt ja en stelt voor om water te drinken.
    note: هيا نشرب betekent 'laten we drinken'.
    example_gloss: 'Yusuf zei: Ja, laten we water drinken.'
