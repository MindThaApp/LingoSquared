teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: القراءة (al-qirāʾa) is lezen, ممارسة الرياضة (mumārasat ar-riyāḍa) is sporten en الطبخ (aṭ-ṭabkh) is koken. Elk is een zelfstandig naamwoord, dus het lidwoord ال zit eraan vast.
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Vrije tijd
    gloss: vrije tijd
    note: وقت الفراغ (waqt al-farāgh) is letterlijk 'de tijd van de lege ruimte'. Het eerste woord heeft geen ال; alleen het tweede woord krijgt het.
    example_gloss: In mijn vrije tijd lees ik graag.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: أحب (uḥibb) betekent ik hou van / ik vind leuk en is hetzelfde voor een man en een vrouw. De ي aan het eind van فراغي (farāghī) betekent mijn.
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) is naar muziek luisteren, الرسم (ar-rasm) is tekenen en لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) is videogames spelen.
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: 'Na الاستماع (al-istimāʿ) komt إلى (ilā, naar) voor datgene waarnaar je luistert: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: 'مع (maʿa) betekent met: مع الأصدقاء (maʿa al-aṣdiqāʾ). Het lidwoord ال blijft aan الأصدقاء vastzitten.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) en أبدا (abadan) zijn bijwoorden, dus ze veranderen nooit naar geslacht. De laatste ا (alif) schrijf je zonder tekens.
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: كل أسبوع (kull usbūʿ) en كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) gebruiken allebei كل (kull, elke); zie de volgende kaart.
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Elke: كل'
    gloss: 'Na كل (kull, elke) staat het zelfstandig naamwoord in het enkelvoud en zonder ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) verandert nooit: hetzelfde woord staat voor een mannelijk zelfstandig naamwoord zoals أسبوع en voor een vrouwelijk zoals عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla begint over hobby's
    gloss: 'Layla: We wandelen vaak samen. Maar wat doe je nog meer in je vrije tijd, Yusuf?'
    note: De beginletter ن (na-) van نتمشى (natamashshā) betekent wij, dus in het Arabisch is geen apart woord voor wij nodig. معا (maʿan) betekent samen.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Yusufs hobby's
    gloss: 'Yusuf: Ik kook graag, ook thuis. En ik sport veel.'
    note: في البيت أيضا (fī al-bayt ayḍan) voegt 'ook thuis' toe. وأمارس (wa-umāris) voegt و (en) aan het werkwoord toe en wordt als één woord geschreven.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla is verrast
    gloss: 'Layla: Kook je thuis ook? Je kookt al de hele dag op je werk!'
    note: تطبخ (taṭbukh) is de je-vorm van het werkwoord voor een man; tegen een vrouw zeg je تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) betekent de hele dag door.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf legt uit
    gloss: 'Yusuf: Ja, maar ik vind koken ontspannend. En jij, wat doe jij graag?'
    note: 'أجد (ajid) betekent ik vind en مريحا (murīḥan) betekent ontspannend. وأنت (wa-anta) voegt و aan أنت toe: en jij.'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Laylas hobby's
    gloss: 'Layla: Ik lees graag en ik luister veel naar muziek.'
    note: 'و verbindt de twee hobby''s: أحب القراءة (uḥibb al-qirāʾa) en وأستمع (wa-astamiʿ, en ik luister). Het wordt vastgeschreven aan het volgende woord.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf vraagt naar gamen
    gloss: 'Yusuf: Game jij ook?'
    note: تلعبين (talʿabīn) is de je-vorm voor een vrouw, omdat Yusuf het aan Layla vraagt; voor een man is het تلعب (talʿab). هل (hal) begint een ja/nee-vraag.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Layla antwoordt
    gloss: 'Layla: Nee, ik game nooit. Maar ik teken soms wel!'
    note: 'أبدا (abadan) betekent nooit en أحيانا (aḥyānan) soms. Het werkwoord ontken je met لا (lā): لا ألعب (lā alʿab) betekent ik speel niet.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Hobby's vergelijken
    gloss: Yusuf en ik wandelen vaak samen. Maar we hebben ook andere hobby's. Yusuf kookt graag, ook thuis, en sport veel. Ik lees graag en luister veel naar muziek. Soms teken ik, maar ik gamep nooit. Wat doe jij graag in je vrije tijd?
    note: Layla's bericht vat feiten uit eerdere lessen samen en eindigt met de kernvraag van deze unit aan de lezer.
    glosses:
      نتمشى: wandelen
      كثيرا: vaak
      معا: samen
      أخرى: andere
      يطبخ: kookt
      يحب: graag
      البيت: het huis (thuis)
      ويمارس: sport
      أقرأ: lees
      وأستمع: luister
      الموسيقى: muziek
      أرسم: teken
      أحيانا: soms
      ألعب: spelen (videogames)
      أبدا: nooit
      فراغك: je vrije (tijd)
      وقت: tijd
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf vraagt naar het weekend
    gloss: 'Yusuf: Wat ga je dit weekend doen?'
    note: 'ستفعلين (sa-tafʿalīn) is de toekomende tijd: de beginletter س (sa-) geeft dat aan en de uitgang ين is voor een vrouw. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) is het weekend.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla heeft nog geen plan
    gloss: 'Layla: Ik weet het nog niet. Ik lees graag, maar ik wil ook graag naar buiten.'
    note: 'لا أعرف بعد (lā aʿrif baʿd) betekent: ik weet het nog niet. أن أخرج (an akhruj) betekent: uitgaan, naar buiten gaan.'
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf doet een voorstel
    gloss: 'Yusuf: Zullen we samen gaan wandelen? Daarna kook ik voor ons.'
    note: 'هل نتمشى (hal natamashshā) is de gebruikelijke manier om iets samen voor te stellen: هل + een wij-werkwoord. لنا (lanā) is ل (voor) + نا (ons), samen als één woord geschreven.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla stemt in
    gloss: 'Layla: Goed idee! Ik houd van zowel wandelen als koken.'
    note: 'كليهما (kilayhimā) betekent allebei en staat aan het eind, verwijzend naar de twee dingen: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf bevestigt
    gloss: 'Yusuf: Prima. Dan zie ik je zaterdag!'
    note: يوم السبت (yawm as-sabt) betekent op zaterdag. De ل van ال wordt niet uitgesproken voor س, een zonletter, dus we schrijven as-sabt.
