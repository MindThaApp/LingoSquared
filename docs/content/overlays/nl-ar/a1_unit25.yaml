course:
  title: Arabisch in het Nederlands A1
  description: 'Arabisch voor beginners om vrijetijdsbesteding te beschrijven: hobbywoordenschat, uitdrukkingen voor frequentie, vragen en antwoorden wat iemand in zijn vrije tijd doet, en de hobby''s van twee mensen vergelijken.'
