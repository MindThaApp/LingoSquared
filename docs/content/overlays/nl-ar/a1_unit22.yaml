  ar.a1.unit22.lesson01.teach.happy:
    title: Blij
    gloss: blij
    note: سعيد (saʿīd) beschrijft een man; een vrouw zegt أنا سعيدة (anā saʿīda).
    example_gloss: Ik ben blij.
  ar.a1.unit22.lesson01.teach.sad:
    title: Verdrietig
    gloss: verdrietig
    note: حزين (ḥazīn) beschrijft een man; een vrouw zegt أنا حزينة (anā ḥazīna).
    example_gloss: Ik ben verdrietig.
  ar.a1.unit22.lesson01.teach.because:
    title: Omdat
    gloss: omdat
    note: لأن (li-anna) leidt een reden in.
    example_gloss: Ik ben blij omdat het weer zonnig is.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: Hoe voel je je?
    gloss: Hoe voelt u zich?
    note: 'كيف تشعر؟ (kayfa tashʿur) vraagt aan een man hoe hij zich voelt; aan een vrouw vraag je: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: Hoe voel je je, Yusuf?
  ar.a1.unit22.lesson02.teach.tired:
    title: Moe
    gloss: moe
    note: متعب (mutʿab) beschrijft een man; متعبة (mutʿaba) beschrijft een vrouw, dus Layla zegt أنا متعبة.
    example_gloss: Ik ben moe.
  ar.a1.unit22.lesson02.teach.okay:
    title: Goed
    gloss: goed
    note: بخير (bi-khayr) betekent 'goed, in orde', letterlijk 'in goede gezondheid'.
    example_gloss: Gaat het goed met je?
  ar.a1.unit22.lesson02.teach.line01:
    title: Naar een gevoel vragen
    gloss: Layla vraagt hoe Yusuf zich voelt.
    note: يا (yā) staat voor de naam van de persoon die je aanspreekt.
    example_gloss: 'Layla zei: Hoe voel je je, Yusuf?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Gevoel en reden
    gloss: Yusuf zegt dat hij blij is omdat het weer zonnig is.
    note: Deze zin geeft zowel het gevoel als de reden.
    example_gloss: 'Yusuf zei: Ik ben blij omdat het weer zonnig is.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Een ander gevoel
    gloss: Layla zegt dat ze moe is omdat ze werk heeft.
    note: متعبة past bij Layla, een vrouw.
    example_gloss: 'Layla zei: Ik ben moe omdat ik werk heb.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Vragen of het goed gaat
    gloss: Yusuf vraagt of het goed gaat met Layla.
    note: 'هل (hal) leidt een ja-nee-vraag in. Yusuf vraagt het aan Layla, dus أنت lees je hier als anti (tegen een man: anta).'
    example_gloss: 'Yusuf zei: Gaat het goed met je?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Ja zeggen
    gloss: Layla zegt ja en bedankt hem.
    note: نعم is het antwoord 'ja'.
    example_gloss: 'Layla zei: Ja, dank je.'
