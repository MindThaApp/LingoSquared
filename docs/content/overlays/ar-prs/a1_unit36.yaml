    title: الأرز
    gloss: أرز
    note: برنج هو الأرز غير المطبوخ (الحبوب)، ويختلف عن پلو، طبق الأرز المطبوخ الذي سيأتي في وحدة الطعام.
    example_gloss: أطبخ الأرز.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'مراجعة: أفعل، قطع'
    gloss: أفعل / مقطّع، مفروم
    note: می‌کنم للمراجعة، أما خرد فجديدة، وتأتي مع صيغ کردن بمعنى «قطّع» أو «فرم».
    target_text: می‌کنم (أفعل) / خرد (مقطّع)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: أقطّع البصلة
    gloss: أقطّع البصل.
