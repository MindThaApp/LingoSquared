    note: کمک می‌کنم؟ تعني حرفيًا «هل أساعد؟»، وهي طريقة طبيعية لعرض المساعدة.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'فريد: نعم، من فضلك قطّعوا البصل.'
    gloss: نعم، من فضلك قطّعوا البصل.
    note: کنین هي صيغة الأمر المحترمة، أي «افعلوا/قطّعوا!».
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'نادية: حاضر.'
    gloss: حاضر.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
