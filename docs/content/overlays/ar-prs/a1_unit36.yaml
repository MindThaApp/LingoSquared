    note: می‌ریزم (من ریختن، أي «سكب») هو الفعل الطبيعي لإضافة سائل، ويختلف عن می‌اندازم المستعمل للمكوّنات الصلبة.
    example_gloss: أسكب الماء.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
