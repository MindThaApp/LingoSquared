    gloss: مرحبًا / نعم / من فضلك / حاضر، بكل سرور / شكرًا / قورمة / لذيذ / يكون
    note: سلام وبلی ولطفاً وچشم وتشکر وقورمه وخوش‌مزه واست كلمات سبقت دراستها، وتُستعمل في حوار المطبخ.
    target_text: سلام (مرحبًا) / بلی (نعم) / لطفاً (من فضلك) / چشم (حاضر) / تشکر (شكرًا) / قورمه (يخنة) / خوش‌مزه (لذيذ) / است (هو)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'نادية: مرحبًا، ماذا تطبخون؟'
