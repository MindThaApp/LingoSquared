    example_gloss: البصل طازج.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: لحم
    gloss: لحم
    note: گوشت تعني اللحم.
    example_gloss: اللحم طازج.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'مراجعة: واحد، أريد، في، أنا'
    gloss: واحد / أريد / في / أنا (كائن)
    note: یک وmی‌خواهم ودر واستم صيغ سبقت دراستها، وتُستعمل في جمل الطبخ في هذه الوحدة.
    target_text: یک (واحد / أداة تنكير) / می‌خواهم (أريد) / در (في) / استم (أنا موجود)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: أطبخ الطعام
    gloss: أطبخ الطعام.
    note: می‌پزم هي صيغة المتكلم في المضارع من پختن، أي «طبخ».
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: أنا في المطبخ
    gloss: أنا في المطبخ.
    note: استم هي صيغة المتكلم من فعل الكينونة، وتُستعمل هنا مع در للدلالة على المكان.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: ملح
    gloss: ملح
    note: نمک تعني الملح.
    example_gloss: أريد ملحًا.
