  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: أطبخ اللحم
    gloss: أطبخ اللحم.
    note: استبدل گوشت بـ برنج لتسمّي طعامًا آخر يُطبخ.
  prs.a1.unit36.lesson03.teach.review_first_then:
