course:
  title: الدارية A1
  description: 'الدرية الأفغانية للمبتدئين: تسمية الأماكن الشائعة في المدينة، والسؤال عن مكان الأشياء، وإعطاء أجوبة بسيطة عن المواقع، واتباع اتجاهات أساسية للوصول إلى مكان.'
