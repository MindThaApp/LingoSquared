teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: السوق
    gloss: سوق / بازار
    note: بازار هي الكلمة اليومية لمنطقة السوق، وغالبًا ما تكون شارعًا كاملًا أو حيًّا كاملًا من المحلات.
    example_gloss: السوق قريب.
  prs.a1.unit05.lesson01.teach.bank:
    title: البنك
    gloss: مصرف
    note: بانک كلمة دخيلة مأخوذة كما هي، وهي قريبة من كلمة «بنك» في العربية.
    example_gloss: أين البنك؟
  prs.a1.unit05.lesson01.teach.mosque:
    title: مسجد
    gloss: مسجد
    note: مسجد هي الكلمة المعتادة للمسجد.
    example_gloss: المسجد كبير.
  prs.a1.unit05.lesson01.teach.hospital:
    title: مستشفى
    gloss: مستشفى
    note: شفاخانه هي الكلمة اليومية في الدرية الأفغانية للمستشفى، وتختلف عن بیمارستان في الفارسية الإيرانية، التي قد يفهمها المتحدثون بالدرية لكنهم لا يستخدمونها عادة.
    example_gloss: المستشفى بعيد.
  prs.a1.unit05.lesson01.teach.school:
    title: مدرسة
    gloss: مدرسة
    note: مکتب هي الكلمة اليومية في الدرية الأفغانية للمدرسة، وتختلف عن مدرسه في الفارسية الإيرانية، التي تدل في الدرية عادة على مدرسة دينية تحديدًا.
    example_gloss: المدرسة قريبة من البيت.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: الصيدلية
    gloss: صيدلية
    note: دواخانه هي الكلمة اليومية في الدرية الأفغانية للصيدلية (من دوا أي الدواء)، وتختلف عن داروخانه في الفارسية الإيرانية.
    example_gloss: أين الصيدلية؟
  prs.a1.unit05.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و هي أداة الربط المعتادة لعطف الأماكن في قائمة.
    target_text: و (حرف العطف)
  prs.a1.unit05.lesson02.teach.post_office:
    title: مكتب البريد
    gloss: مكتب البريد
    note: پوسته خانه تجمع پوسته (البريد) مع خانه (البيت/المبنى).
    example_gloss: مكتب البريد مغلق.
  prs.a1.unit05.lesson02.teach.embassy:
    title: سفارة
    gloss: سفارة
    note: سفارت هي الكلمة المعتادة للسفارة.
    example_gloss: السفارة في كابل.
  prs.a1.unit05.lesson02.teach.airport:
    title: المطار
    gloss: مطار
    note: میدان هوایی هو التعبير اليومي في الدرية الأفغانية للمطار (حرفيًا «ميدان الهواء»)، ويختلف عن فرودگاه في الفارسية الإيرانية.
    example_gloss: المطار بعيد.
  prs.a1.unit05.lesson02.teach.office_review:
    title: مكتب (مراجعة)
    gloss: مكتب
    note: سبق أن وردت كلمة دفتر في وحدة سابقة، وهي مذكورة هنا مع بقية الأماكن العامة.
    example_gloss: مكتبي قريب.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: اسأل أين السوق
    gloss: أين السوق؟
    note: بازار کجاست؟ هو النمط الأساسي للسؤال عن مكان أي مكان.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: اسأل عن مكان المستشفى
    gloss: أين المستشفى؟
    note: ينطبق نمط کجاست نفسه على أي اسم مكان.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: لفت انتباه شخص بلباقة
    gloss: عفوًا، أين الصيدلية؟
    note: ببخشین تفتتح بها سؤالًا لشخص غريب بلباقة، وتؤدي وظيفة «عفوًا» أو «من فضلك» في العربية.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: كيف تتكوّن کجاست
    gloss: کجاست هي کجا (أين) مضافًا إليها است (يكون/هو)، وقد اندمجتا معًا.
    note: معرفة هذا التحليل تساعد المتعلمين على فهم النمط بدل حفظ کجاست ككتلة واحدة غير محلَّلة.
  prs.a1.unit05.lesson04.teach.near:
    title: قريب
    gloss: قريب من
    note: نزدیک تصف شيئًا قريبًا.
    example_gloss: البنك قريب.
  prs.a1.unit05.lesson04.teach.far:
    title: بعيد
    gloss: بعيد
    note: دور تصف شيئًا يقع على مسافة بعيدة.
    example_gloss: المستشفى بعيد.
  prs.a1.unit05.lesson04.teach.here:
    title: هنا
    gloss: هنا
    note: این‌جا تشير إلى مكان المتكلم الحالي.
    example_gloss: البنك هنا.
  prs.a1.unit05.lesson04.teach.there:
    title: هناك
    gloss: هناك
    note: آن‌جا تشير إلى مكان بعيد عن المتكلم.
    example_gloss: الصيدلية هناك.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: قل إن السوق قريب
    gloss: السوق قريب.
    note: بازار نزدیک است تستعمل الرابط است نفسه الذي مرّ في هذه الدورة.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: قل إن المطار بعيد
    gloss: المطار بعيد.
    note: میدان هوایی دور است يتبع النمط نفسه مع دور بدل نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: بجانب
    gloss: بجانب
    note: در کنار تعني حرفيًا «إلى جانب».
  prs.a1.unit05.lesson05.teach.behind:
    title: خلف
    gloss: خلف
    note: پشت تدل على أن الشيء يقع خلف مكان آخر.
    example_gloss: الصيدلية خلف المدرسة.
  prs.a1.unit05.lesson05.teach.opposite:
    title: مقابل / قبالة
    gloss: مقابل / قبالة
    note: مقابل تدل على أن الشيء يقع قبالة مكان آخر مباشرة.
    example_gloss: البنك مقابل المسجد.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: حدّد موقع المستشفى بالنسبة إلى المسجد
    gloss: المستشفى بجانب المسجد.
    note: شفاخانه در کنار مسجد است يجمع بين اسم مكان وحرف الجر در کنار والرابط است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: شكرًا جزيلًا
    gloss: شكرًا جزيلًا.
    note: تشکر زیاد تقوّي تشکر اليومية التي سبق تعلمها.
  prs.a1.unit05.lesson06.teach.turn01:
    title: زرمينة تسأل عن الصيدلية
    gloss: زرمينة تسأل أحد المارة بلباقة عن مكان الصيدلية.
    note: ببخشین تفتتح السؤال باحترام، وهي مناسبة مع شخص غريب.
  prs.a1.unit05.lesson06.teach.turn02:
    title: المارّ يشرح الطريق
    gloss: يقول المارّ إن الصيدلية ليست بعيدة، وإن عليها أن تمضي مستقيمًا، وإنها بجانب المدرسة.
    note: 'يجمع هذا بين عدة أنماط من هذه الوحدة: دور نیست (نفي دور)، ومستقیم بروین، ودر کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: زرمينة تشكر المارّ
    gloss: زرمينة تشكره جزيل الشكر.
    note: تشکر زیاد تُنهي الحوار بلباقة.
  prs.a1.unit05.lesson06.teach.turn04:
    title: ردّ المارّ المتواضع
    gloss: لا شكر على واجب / لا شيء.
    note: قابلی نداره عبارة شائعة متواضعة في الدارية الأفغانية اليومية للرد على الشكر، وتشبه في وظيفتها خواهش می‌کنم لكنها أكثر عفوية. نداره هي الصيغة المحكية من ندارد؛ ستسمع نداره، بينما تُستعمل ندارد في الكتابة الدقيقة.
