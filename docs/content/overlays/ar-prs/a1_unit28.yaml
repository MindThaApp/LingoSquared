course:
  title: الدرية A1
  description: 'الدرية الكابلية للمبتدئين: مفردات الحيوانات والحيوانات الأليفة (كلب، قطة، طائر، سمكة)، والسؤال عن وجود حيوان أليف والإجابة عنه بـ حیوان خانگی دارین؟، ووصف حجم الحيوان الأليف ولونه، وحوار بين زرمينة وهمايون عن امتلاك قطة وإطعامها.'
units:
