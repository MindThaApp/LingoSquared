  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'زرمينه: نعم، أُطعمها كل يوم'
    gloss: 'زرمينه: نعم، أُطعمها كل يوم.'
    note: تُستعمل هر روز (كل يوم) مع می‌دهم (أُطعم، المتكلم).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: قراءة عن حيوان أليف
    gloss: عند زرمينه قطة. قطتها بيضاء وصغيرة. تُطعم زرمينه القطة كل يوم.
    note: نص قصير يلخّص مفردات الحيوانات الأليفة في الوحدة، ويقدّم دارد (عنده/عندها، الغائب، للمراجعة من الوحدتين 26/27) ومی‌دهد (يُعطي/يُطعم، الغائب، للمراجعة من الوحدة 18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: لكنّ
