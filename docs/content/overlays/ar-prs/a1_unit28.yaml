    note: سؤال غير رسمي بين صديقين، باستعمال صيغة داری غير الرسمية.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'زرمينه: نعم، عندي قطة'
    gloss: 'زرمينه: نعم، عندي قطة.'
    note: تجيب بـ بلی ثم یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'همايون: ما لون قطتك؟'
    gloss: 'همايون: ما لون قطتك؟'
    note: يستعمل چه رنگ (أي لون)، وهو النمط نفسه في سؤال التسوق في الوحدة 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'زرمينه: إنها بيضاء'
    gloss: 'زرمينه: إنها بيضاء.'
    note: 'جواب قصير: اللون فقط مع است. القطة معروفة من السؤال، فلا تُكرَّر پشک.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'همايون: هل تُطعمها كل يوم؟'
    gloss: 'همايون: هل تُطعمها كل يوم؟'
