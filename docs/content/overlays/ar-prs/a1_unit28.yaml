  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: حيوان أليف
    gloss: حيوان أليف
    note: حیوان خانگی تعني حرفيًا «حيوان البيت»، من حیوان (حيوان، للمراجعة) + خانگی (منزلي/أليف).
    example_gloss: الكلب حيواني الأليف.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: عندي / عندكم (بصيغة مهذّبة) / هو (فعل الكينونة)
    gloss: عندي / عندكم (للمخاطب بصيغة الاحترام) / هو (يكون)
    note: دارم (عندي) ودارین (عندك، بصيغة الاحترام) واست (هو/هي) كلها للمراجعة من دروس سابقة، وتُستعمل في هذه الوحدة للحديث عن الحيوانات الأليفة.
    target_text: دارم (لدي) / دارین (لديك، رسمي) / است (يكون)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: هل لديك حيوان أليف؟
    gloss: هل لديك حيوان أليف؟
    note: حیوان خانگی دارین؟ هي الطريقة المهذبة الرسمية لسؤال شخص عمّا إذا كان عنده حيوان أليف.
  prs.a1.unit28.lesson02.teach.yes_answer:
