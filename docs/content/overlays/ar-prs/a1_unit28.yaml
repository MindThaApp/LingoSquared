    gloss: نعم، لدي كلب.
    note: بلی (نعم، للمراجعة من الوحدة 3) مع عبارة هذه الوحدة سگ دارم.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: لا، ليس لدي حيوان أليف
    gloss: لا، ليس لدي حيوان أليف.
    note: نخیر («لا» الرسمية، للمراجعة من الوحدة 3) مع حیوان خانگی ندارم (ليس عندي حيوان أليف).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: نعم / لا / ليس عندي
    gloss: نعم / لا / ليس عندي
    note: بلی ونخیر وندارم كلها للمراجعة من حوار أفراد العائلة في الوحدة 3، وتُعاد هنا للحديث عن امتلاك الحيوانات الأليفة.
    target_text: بلی (نعم) / نخیر (لا) / ندارم (ليس لدي)
