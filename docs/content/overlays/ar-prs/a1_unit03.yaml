teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: الأم
    gloss: أم
    note: مادر هي الكلمة الدارية المحايدة لـ«الأم».
    example_gloss: أمي لطيفة.
  prs.a1.unit03.lesson01.teach.father:
    title: الأب
    gloss: أب
    note: پدر هي الكلمة الدارية المحايدة لـ«الأب».
    example_gloss: أبي طبيب.
  prs.a1.unit03.lesson01.teach.brother:
    title: الأخ
    gloss: أخ
    note: برادر تعني «أخ».
    example_gloss: عندي أخ واحد.
  prs.a1.unit03.lesson01.teach.sister:
    title: الأخت
    gloss: أخت
    note: خواهر تعني «أخت».
    example_gloss: أختي معلمة.
  prs.a1.unit03.lesson01.teach.parents:
    title: الوالدان
    gloss: الأب والأم؛ الوالدان
    note: يقول الداريون عادةً پدر و مادر للإشارة إلى والدَي الشخص.
    example_gloss: والداي يعيشان في كابل.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: عرّف بأمك
    gloss: هذه أمي.
    note: اللاحقة ـم في مادرم تعني «ـي» أي ملكية المتكلم.
  prs.a1.unit03.lesson02.teach.grandfather:
    title: الجد
    gloss: جد
    note: پدرکلان هو المصطلح الدارّي الأفغاني المعتاد؛ ومعناه الحرفي «الأب الكبير».
    example_gloss: جدي مسنّ.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: الجدة
    gloss: جدة
    note: مادرکلان هو المصطلح الدارّي الأفغاني المعتاد؛ ومعناه الحرفي «الأم الكبيرة».
    example_gloss: جدتي لطيفة.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: أخو الأب
    gloss: عم
    note: کاکا تدل تحديدًا على أخي والدك.
    example_gloss: عمي يعيش في هرات.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: أخت الأب
    gloss: عمة
    note: عمه تدل تحديدًا على أخت والدك.
    example_gloss: عمّتي معلّمة.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: أخو الأم
    gloss: خال
    note: ماما تدل تحديدًا في الدارية على أخي والدتك.
    example_gloss: خالي مهندس.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: أخت الأم
    gloss: خالة
    note: خاله تدل تحديدًا على أخت والدتك.
    example_gloss: خالتي تعيش في كابل.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: ميّز بين الجهتين
    gloss: العم والعمة من جهة الأب؛ والخال والخالة من جهة الأم.
    note: 'تميّز هذه الكلمات الدارية الأربع بين جهة الأب وجهة الأم، كما تفعل العربية: عم وعمة من جهة الأب، وخال وخالة من جهة الأم.'
  prs.a1.unit03.lesson03.teach.family:
    title: العائلة
    gloss: عائلة
    note: فامیل هي الكلمة الدارية الأفغانية المعتادة لـ«العائلة».
    example_gloss: عائلتي كبيرة.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: اسأل عن عدد أفراد العائلة بأدب
    gloss: كم عدد أفراد أسرتكم؟
    note: ـتان علامة «ـكم» المهذبة؛ ونفر هو العدّاد الخاص بالأشخاص.
  prs.a1.unit03.lesson03.teach.five_people:
    title: اذكر عدد أفراد العائلة
    gloss: عائلتنا مكوّنة من خمسة أشخاص.
    note: تذكر الدارية حجم العائلة بعدد الأشخاص مع نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: عُدّ إخوتك
    gloss: لدي أخ واحد وأختان.
    note: دارم تعني «لدي». ويبقى الاسم مفردًا بعد العدد.
  prs.a1.unit03.lesson03.teach.only_child:
    title: الابن الوحيد
    gloss: أنا ابن وحيد.
    note: استم صيغة المتكلم في دارية كابل التي يعتمدها هذا المقرر.
  prs.a1.unit03.lesson03.teach.possession:
    title: صيغ الفعل «يملك / لدى»
    gloss: لدي؛ لدينا؛ لديك (لديكم)
    note: دارین صيغة احترام أو جمع لـ«لديكم» في دارية كابل المحكية المثقفة.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: السؤال عن الإخوة
    gloss: هل لديكم إخوة وأخوات؟
    note: دارین تجعل الجملة مهذبة أو موجّهة إلى جمع.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: السؤال عن عدد الإخوة
    gloss: كم أخًا وأختًا لديكم؟
    note: چند تسأل عن العدد.
  prs.a1.unit03.lesson04.teach.parents_well:
    title: اسأل عن والدَي شخص ما
    gloss: هل والداكم بخير؟
    note: جور استند طريقة أفغانية مألوفة للقول «هم بخير».
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: إجابة بالإيجاب
    gloss: نعم، لدي أخ واحد.
    note: بلی هي كلمة «نعم» المهذبة المعيارية في أفغانستان.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: إجابة بالنفي
    gloss: لا، ليست لدي أخت.
    note: نخیر هي «لا» المهذبة؛ وندارم تعني «ليس لدي».
  prs.a1.unit03.lesson04.teach.polite_your:
    title: «ـكم» المهذبة
    gloss: عائلتكم؛ والدتكم؛ والدكم
    note: لاحقة الملكية ـتان للاحترام أو للجمع. ويصلها هذا المقرر بالكلمة بواسطة نصف مسافة (ZWNJ).
  prs.a1.unit03.lesson05.teach.married:
    title: متزوج
    gloss: متزوّج
    note: متأهل مصطلح محايد للحالة الاجتماعية.
    example_gloss: هو متزوّج / هي متزوّجة.
  prs.a1.unit03.lesson05.teach.single:
    title: الأعزب
    gloss: أعزب؛ غير متزوج
    note: مجرد تعني «غير متزوج» في هذا السياق.
    example_gloss: أنا أعزب / أنا عزباء.
  prs.a1.unit03.lesson05.teach.husband:
    title: الزوج
    gloss: زوج
    note: شوهر هي الكلمة المعتادة لـ«الزوج».
    example_gloss: زوجي مهندس.
  prs.a1.unit03.lesson05.teach.wife:
    title: الزوجة
    gloss: زوجة
    note: خانم قد تعني «الزوجة» أو سيدة تُخاطَب بأدب؛ ويحدد السياق المقصود.
    example_gloss: زوجتي معلّمة.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: اسأل عن الزواج بأدب
    gloss: هل أنتم متزوج؟
    note: 'معناها الحرفي: «هل تزوجتم؟». واللاحقة ـین هي صيغة الاحترام في دارية كابل.'
  prs.a1.unit03.lesson05.teach.married_answer:
    title: اذكر أنك متزوج
    gloss: نعم، أنا متزوج.
    note: استم هي رابطة المتكلم في الدارية الأفغانية المستعملة هنا.
  prs.a1.unit03.lesson05.teach.children:
    title: اسأل عن الأولاد
    gloss: هل لديك أولاد؟
    note: اولاد كلمة جامعة شائعة تدل على الابن أو الأبناء.
  prs.a1.unit03.lesson06.teach.turn01:
    title: مريم تسأل عن عدد أفراد العائلة
    gloss: كم عدد أفراد أسرتكم؟
    note: تستخدم مريم ـتان المهذبة.
  prs.a1.unit03.lesson06.teach.turn02:
    title: فرشته تصف إخوتها
    gloss: نحن خمسة أشخاص. لدي أخ واحد وأخت واحدة.
    note: يُعَدّ أفراد العائلة بالعدّاد نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: مريم تسأل عن الزواج
    gloss: هل أنتِ متزوجة؟
    note: السؤال مهذب ومحايد في صيغته.
  prs.a1.unit03.lesson06.teach.turn04:
    title: فرشته تصف زوجها
    gloss: نعم، أنا متزوجة. زوجي طالب جامعي.
    note: محصل، وليس الكلمة الإيرانية دانشجو، هي الكلمة الدارية الأفغانية الراسخة المستعملة هنا لـ«الطالب».
  prs.a1.unit03.lesson06.teach.turn05:
    title: مريم تسأل عن الأولاد
    gloss: هل لديك أولاد؟
    note: دارین تحافظ على المخاطبة المهذبة.
  prs.a1.unit03.lesson06.teach.turn06:
    title: فرشته تجيب
    gloss: لا، ليس لدينا أولاد بعد.
    note: نخیر تعني «لا» بأدب؛ ونداریم تعني «ليس لدينا».
exercises:
  prs.a1.unit03.lesson01.exercise01.recognize_mother:
    instruction: اختر معنى مادر.
    correct_option: أم
    distractors:
    - أب
    - أخ
    - أخت
    accepted_answers:
    - value: أم
      status: correct
    feedback: مادر تعني أمًّا.
  prs.a1.unit03.lesson01.exercise02.recognize_siblings:
    instruction: أي زوج من الكلمات يعني الأخ والأخت؟
    correct_option: برادر و خواهر
    distractors:
    - پدر و مادر
    - کاکا و عمه
    - ماما و خاله
    accepted_answers:
    - value: برادر و خواهر
      status: correct
    feedback: برادر وخواهر تعنيان الأخ والأخت.
  prs.a1.unit03.lesson01.exercise03.match_immediate:
    instruction: طابق كل كلمة من كلمات الأسرة القريبة مع معناها.
    accepted_answers:
    - value:
        مادر: الأم
        پدر: الأب
        برادر: الأخ
        خواهر: الأخت
      status: correct
    feedback: هذه هي كلمات الأسرة القريبة الأربع المقدَّمة هنا.
    pairs:
    - left: مادر
      right: الأم
    - left: پدر
      right: الأب
    - left: برادر
      right: الأخ
    - left: خواهر
      right: الأخت
  prs.a1.unit03.lesson01.exercise04.order_parents:
    instruction: رتّب العبارة الدارية التي تعني الوالدين.
    accepted_answers:
    - value:
      - پدر
      - و
      - مادر
      status: correct
    feedback: 'پدر و مادر تعني حرفيًا: الأب والأم.'
  prs.a1.unit03.lesson01.exercise05.translate_this_is_mother:
    instruction: 'ترجم إلى الدارية: هذه أمي.'
    accepted_answers:
    - value: این مادرم است
      status: correct
    - value: این مادر من است
      status: correct
    feedback: 'این مادرم است تعني: هذه أمي.'
    prompt_blocks:
    - هذه أمي.
  prs.a1.unit03.lesson01.exercise06.translate_sister:
    instruction: 'ترجم إلى الدارية: هذه أختي.'
    accepted_answers:
    - value: این خواهرم است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: لاحقة الملكية في خواهرم تعني «ي» (أختي).
  prs.a1.unit03.lesson01.exercise07.speak_family_member:
    instruction: أشِر إلى أخ أو أخت في صورة وعرّف بالشخص بالدارية.
    accepted_answers:
    - value: این برادرم است
      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: استخدم این، ثم صلة القرابة مع ضمير الملكية «ي»، ثم است.
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: اختر معنى پدرکلان.
    correct_option: الجدّ
    distractors:
    - الجدّة
    - أب
    - العم (أخو الأب)
    accepted_answers:
    - value: الجدّ
      status: correct
    feedback: پدرکلان تعني الجد في الدارية الأفغانية.
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: أي صلة قرابة تدل عليها كلمة ماما؟
    correct_option: أخو الأم
    distractors:
    - أخو الأب
    - أخت الأم
    - أخت الأب
    accepted_answers:
    - value: أخو الأم
      status: correct
    feedback: ماما تعني تحديدًا الخال، أي أخا الأم.
  prs.a1.unit03.lesson02.exercise03.match_sides:
    instruction: طابق كل كلمة مع معناها.
    accepted_answers:
    - value:
        کاکا: عم (أخو الأب)
        عمه: عمة (أخت الأب)
        ماما: خال (أخو الأم)
        خاله: خالة (أخت الأم)
        مادر: الأم
        پدر: الأب
        برادر: الأخ
        خواهر: الأخت
      status: correct
    feedback: تميّز الدارية بين الأعمام والعمّات من جهة الأب والأخوال والخالات من جهة الأم؛ والكلمات الأربع الأخيرة مراجعة لكلمات الأسرة القريبة من الدرس الأول.
    pairs:
    - left: کاکا
      right: عم (أخو الأب)
    - left: عمه
      right: عمة (أخت الأب)
    - left: ماما
      right: خال (أخو الأم)
    - left: خاله
      right: خالة (أخت الأم)
    - left: مادر
      right: الأم
    - left: پدر
      right: الأب
    - left: برادر
      right: الأخ
    - left: خواهر
      right: الأخت
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: 'رتّب: هذه جدتي.'
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: 'مادرکلان من تعني: جدتي.'
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 'أكمل: أخو أمي هو خالي.'
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: 'مامایم تعني: خالي.'
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: 'ترجم إلى الدارية: هي عمّتي.'
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: يُقبل الفصل بمسافة عند الكتابة بلوحة المفاتيح؛ أما الإملاء المعتاد فيستخدم الفاصل غير الواصل (ZWNJ).
    - value: او عمهٔ من است
      status: correct
    feedback: عمه تعني أخت الأب.
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'اشرح صلة القرابة لا شخصًا بعينه: قل إن العم (کاکا) هو أخو أبيك، وإن الخال (ماما) هو أخو أمك.'
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا من جهة الأب، وماما من جهة الأم.
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: كم شخصًا في هذه العائلة؟
    correct_option: خمسة
    distractors:
    - أربعة
    - السادسة
    - سبعة
    accepted_answers:
    - value: خمسة
      status: correct
    feedback: پنج نفر تعني خمسة أشخاص.
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: اختر معنى من تک‌فرزند استم.
    correct_option: أنا ابن وحيد.
    distractors:
    - لدي طفل واحد.
    - لديّ أخ واحد.
    - نحن عائلة واحدة.
    accepted_answers:
    - value: أنا ابن وحيد.
      status: correct
    feedback: تک‌فرزند تعني الابن الوحيد (أو الابنة الوحيدة).
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: طابق كل كلمة أو عبارة مع معناها.
    accepted_answers:
    - value:
        دارم: لديّ
        داریم: لدينا
        دارین: لديكم (للمخاطب المحترم)
        فامیل: عائلة
        تک‌فرزند: الابن الوحيد
        یک برادر و دو خواهر دارم: لدي أخ واحد وأختان.
      status: correct
    feedback: تميّز اللواحق بين «أنا» و«نحن» و«أنتم» للاحترام أو الجمع؛ والكلمات الثلاث الأخيرة تعرض مفردات العائلة ودارم في جملة كاملة، وكلها من هذا الدرس.
    pairs:
    - left: دارم
      right: لديّ
    - left: داریم
      right: لدينا
    - left: دارین
      right: لديكم (للمخاطب المحترم)
    - left: فامیل
      right: عائلة
    - left: تک‌فرزند
      right: الابن الوحيد
    - left: یک برادر و دو خواهر دارم
      right: لدي أخ واحد وأختان.
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: 'رتّب: عائلتنا مكوّنة من ستة أشخاص.'
    accepted_answers:
    - value:
      - فامیل
      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: فامیل ما شش نفر است تذكر أن عدد أفراد العائلة ستة.
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 'أكمل: لدي أخ واحد.'
    accepted_answers:
    - value: دارم
      status: correct
