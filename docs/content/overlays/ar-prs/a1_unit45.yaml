teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'مراجعة: هذا، يكون، في'
    gloss: هذا / يكون / في
    note: الكلمات این وست ودر (المستخدمة في هذه الدورة كلها) كلمات للمراجعة نستخدمها للحديث عن الفنادق والغرف.
    target_text: این (هذا) / است (يكون) / در (في)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: فندق
    gloss: فندق
    note: هوتل هي الكلمة الأفغانية الدرية للفندق وتُكتب بالواو، وتختلف عن هتل في الفارسية الإيرانية.
    example_gloss: هذا فندق.
  prs.a1.unit45.lesson01.teach.room_word:
    title: غرفة
    gloss: غرفة
    note: اتاق كلمة شائعة في الدرية بمعنى «غرفة».
    example_gloss: الغرفة في الفندق.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: الغرفة في الفندق
    gloss: الغرفة في الفندق.
    note: اتاق در هوتل است جملة تجمع الكلمات التي تعلمناها سابقًا في هذا الدرس.
  prs.a1.unit45.lesson01.teach.key_word:
    title: مفتاح
    gloss: مفتاح
    note: کلید هي الكلمة الدرية المعيارية لـ«المفتاح».
    example_gloss: هذا مفتاح.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: مفتاح الغرفة
    gloss: مفتاح الغرفة
    note: کلید اتاق تجمع کلید (مفتاح) واتاق (غرفة).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: هذا مفتاح الغرفة
    gloss: هذا مفتاح الغرفة.
    note: تجمع جملة «این کلید اتاق است» الكلمات التي تعلّمتها سابقًا في هذا الدرس.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'مراجعة: عندي، عنده'
    gloss: عندي / عنده (فيه)
    note: «دارم» و«دارد» كلمتان للمراجعة، تُستخدمان للسؤال عن مرافق الغرفة.
    target_text: دارم (عندي) / دارد (فيه / عنده)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: الحمّام
    gloss: حمّام
    note: «تشناب» هي الكلمة الدارية اليومية للحمّام أو دورة المياه.
    example_gloss: في الغرفة حمّام.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: هل في الغرفة حمّام؟
    gloss: هل في الغرفة حمّام؟
    note: «اتاق تشناب دارد؟» سؤال يُجاب عنه بنعم أو لا، ويُكوَّن بنغمة صاعدة دون أداة استفهام مستقلة.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: نعم، فيها حمّام
    gloss: نعم، فيها حمّام.
    note: «بلی» كلمة للمراجعة، ومعناها «نعم».
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: حجز
    gloss: حجز
    note: «رزرو» كلمة دخيلة شائعة الاستخدام بمعنى الحجز.
    example_gloss: لدي حجز.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: لدي حجز
    gloss: لدي حجز.
    note: «رزرو دارم» تجمع بين «رزرو» (حجز) و«دارم» (لدي).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'مراجعة: كم/أيّ رقم، لـ، أريد'
    gloss: كم / أيّ رقم / لـ / أريد
    note: «چند» و«برای» و«می‌خواهم» كلمات للمراجعة، تُستخدم للسؤال عن الغرفة.
    target_text: چند (كم / ما العدد) / برای (لِـ) / می‌خواهم (أريد)
  prs.a1.unit45.lesson03.teach.number_word:
    title: عدد
    gloss: عدد
    note: «نمبر» كلمة دخيلة يومية في الداري الأفغانية بمعنى «رقم»، وتُستخدم لأرقام الغرف والهواتف ونحوها.
    example_gloss: رقم الغرفة
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: ما رقم الغرفة؟
    gloss: ما رقم الغرفة؟
    note: «نمبر اتاق چند است؟» سؤال عن رقم الغرفة باستخدام «چند».
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'مراجعة: ليلة، اثنان، ثلاثة'
    gloss: ليلة / اثنان / ثلاثة
    note: «شب» و«دو» و«سه» كلمات للمراجعة، تُستخدم للتعبير عن مدة الإقامة.
    target_text: شب (ليلة) / دو (اثنان) / سه (ثلاثة)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: أقيم
    gloss: أقيم
    note: «می‌مانم» من الفعل «ماندن» أي الإقامة أو البقاء.
    example_gloss: سأقيم ليلتين.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: سأقيم ليلتين
    gloss: سأقيم ليلتين.
    note: «دو شب می‌مانم» تجمع بين «دو شب» (ليلتان) و«می‌مانم» (أقيم).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: أريدها لمدة ليلتين
    gloss: أريدها لمدة ليلتين.
    note: «برای دو شب می‌خواهم» تستخدم «برای» (لـ) مع كلمة المراجعة «می‌خواهم».
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'مراجعة: تقيمون (للمخاطب بصيغة الاحترام)'
    gloss: تقيمون (للمخاطب بصيغة الاحترام)
    note: «می‌مانین» صيغة المخاطب المحترم من «می‌مانم»، وهي من عائلة النهاية «-ین» نفسها مثل «می‌خواهین» و«کنین» في مواضع أخرى من هذه الدورة.
    target_text: می‌مانین (تبقون، بصيغة الاحترام)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: كم ليلة ستقيمون؟
    gloss: كم ليلة ستقيمون؟
    note: «چند شب می‌مانین؟» هو السؤال الرسمي الذي يطرحه موظف الاستقبال في الفندق.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'مراجعة: أهلًا وسهلًا، ما اسمكم؟، أنا'
    gloss: أهلًا وسهلًا / ما اسمكم؟ / أنا
    note: «خوش آمدین» و«نام‌تان چیست؟» و«استم» كلمات وعبارات للمراجعة، تُستخدم عند تسجيل الوصول.
    target_text: خوش آمدین (أهلًا بكم) / نام‌تان چیست؟ (ما اسمكم؟) / استم (أنا)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'مراجعة: أيضًا، وماذا عن، تفضّل، شكرًا جزيلًا'
    gloss: أيضًا / وماذا عن / تفضّل / شكرًا جزيلًا
    note: «هم» و«چطور» و«بفرمایین» و«تشکر زیاد» (من وحدات سابقة) كلمات للمراجعة، تُستخدم لإنهاء الحوار.
    target_text: هم (أيضًا) / چطور (وماذا عن) / بفرمایین (تفضلوا) / تشکر زیاد (شكرًا جزيلًا)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: الإفطار
    gloss: الإفطار
    note: «چای صبح» تعني حرفيًا «شاي الصباح»، وهي الطريقة الدارية الأفغانية اليومية للتعبير عن الفطور، وتتكوّن من «چای» (شاي، الوحدة 8) و«صبح» (صباح، الوحدة 16).
  prs.a1.unit45.lesson04.teach.included_word:
    title: مشمول
    gloss: مشمول
    note: «شامل» تعني «مشمول»، وتُستخدم للقول إن الخدمة مشمولة مع الغرفة.
    example_gloss: الإفطار مشمول.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: الواي فاي
    gloss: الواي فاي
    note: «وای‌فای» هي الكلمة الدخيلة المعتادة لشبكة الواي فاي.
    example_gloss: فيها واي فاي أيضًا.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'همايون: مرحبًا. لدي حجز. سأقيم ليلتين.'
    gloss: مرحبًا. لدي حجز. سأقيم ليلتين.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'موظف الفندق: أهلًا وسهلًا. ما اسمكم؟'
    gloss: أهلًا وسهلًا. ما اسمكم؟
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'همايون: أنا همايون.'
    gloss: أنا همايون.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'موظف الفندق: حسنًا جدًا. في الغرفة حمّام، والفطور مشمول.'
    gloss: حسنًا جدًا. في الغرفة حمّام، والفطور مشمول.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'همايون: وماذا عن الواي فاي؟'
    gloss: وماذا عن الواي فاي؟
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'موظف الفندق: نعم، فيها واي فاي أيضًا. تفضّل المفتاح.'
    gloss: نعم، فيها واي فاي أيضًا. تفضّل المفتاح.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'مراجعة: حجز، رقم، خمسة، الاثنين، الثلاثاء، و'
    gloss: حجز / رقم / خمسة / الاثنين / الثلاثاء / و
    note: «رزرو» و«نمبر» (من هذه الوحدة) و«پنج» و«دوشنبه» و«سه‌شنبه» و«و» كلمات للمراجعة، تُستخدم في نص القراءة.
    target_text: رزرو (حجز) / نمبر (رقم) / پنج (خمسة) / دوشنبه (الإثنين) / سه‌شنبه (الثلاثاء) / و (و)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'مراجعة: يقيم (هو/هي)'
    gloss: يقيم (هو/هي)
    note: «می‌ماند» صيغة الغائب من عائلة «می‌مانم/می‌مانین» التي تعلّمتها سابقًا في هذه الوحدة.
    target_text: می‌ماند (يبقى / تبقى)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: قراءة عن حجز همايون
    gloss: 'هذا حجز همايون. الغرفة رقم خمسة. يقيم همايون ليلتين: الاثنين والثلاثاء. في الغرفة حمّام، والفطور مشمول.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'مراجعة: لكن، أنتم (للاحترام)، ساعة، وقت، سبعة، اثنا عشر'
    gloss: لكن / أنتم (للاحترام) / ساعة / وقت / سبعة / اثنا عشر
    note: «اما» و«شما» و«ساعت» و«وقت» (من وحدات سابقة) و«هفت/دوازده» كلمات للمراجعة، تُستخدم لذكر جدول المواعيد.
    target_text: اما (لكن) / شما (أنتم، بصيغة الاحترام) / ساعت (ساعة) / وقت (وقت) / هفت (سبعة) / دوازده (اثنا عشر)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: المغادرة / الخروج
    gloss: المغادرة / الخروج
    note: «خروج» تدل على موعد مغادرة الفندق، كما في «وقت خروج».
    example_gloss: موعد المغادرة
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: موعد المغادرة الساعة الثانية عشرة
    gloss: موعد المغادرة الساعة الثانية عشرة.
    note: «وقت خروج ساعت دوازده است» تذكر موعد مغادرة الفندق.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: الفطور الساعة السابعة، لكن المغادرة الساعة الثانية عشرة
    gloss: الفطور الساعة السابعة، لكن موعد المغادرة الساعة الثانية عشرة.
    note: «اما» تقابل بين موعد الفطور وموعد المغادرة.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: ما موعد مغادرتكم؟
    gloss: ما موعد مغادرتكم؟
    note: الصيغة الرسمية مع «شما» للسؤال عن موعد المغادرة.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (جيد جدًا) / چای (شاي) / صبح (صباح) / و (و)
