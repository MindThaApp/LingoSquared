    note: تتيح لك اول وبعد ترتيب عدة خطوات اتجاه في تعليمة واحدة.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: اسأل بلباقة عن طريقة الوصول إلى مكان
    gloss: هل يمكنك أن تخبرني كيف أصل إلى السوق؟
    note: می‌توانین بگویین...؟ طريقة مهذبة للسؤال «هل يمكنك أن تخبرني...؟» وتناسب سؤال شخص غريب عن الطريق. وبروم تعني «أذهب»، فالعبارة كلها تسأل كيف يمكنني الوصول إلى هناك.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: اسأل عن مكان ما (مراجعة)
    gloss: عفوًا، أين الصيدلية؟
    note: ببخشین، [المكان] کجاست؟ وردت في وحدة الأماكن؛ وهي افتتاحية مناسبة قبل طلب الاتجاهات.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: أكّد أنك فهمت
    gloss: شكرًا جزيلًا، فهمت.
    note: تشکر زیاد، فهمیدم تُنهي الحديث بلباقة وتؤكد أن الاتجاهات كانت واضحة.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: مكتب (مراجعة)
    gloss: مكتب
    note: وردت كلمة دفتر في وحدة سابقة؛ وتُستعمل هنا وجهةً لتدريب نمط السؤال المهذب عن الاتجاهات.
    example_gloss: المكتب قريب.
  prs.a1.unit06.lesson05.teach.after_word:
    title: بعد
    gloss: بعد
    note: بعد از تدل على معلم يأتي قبل الوجهة.
    example_gloss: بعد المسجد يوجد البنك.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: مقابل / قبالة
    gloss: مقابل / قبالة
    note: روبه‌رو مرادف جديد لـ مقابل التي وردت في وحدة الأماكن؛ وتُستعمل الكلمتان بمعنى «قبالة» في الداري اليومية.
    example_gloss: البنك قبالة المسجد.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: أعطِ اتجاهًا بالاعتماد على معلم
    gloss: بعد المسجد، البنك قبالتك.
    note: بعد از مسجد، بانک روبه‌روی شماست تجمع بين معلم (بعد از مسجد) وموقع نسبي (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: مدرسة (مراجعة)
    gloss: مدرسة
    note: وردت كلمة مکتب في وحدة الأماكن؛ وتُستعمل هنا معلمًا في جملة التدريب.
    example_gloss: المدرسة قريبة.
  prs.a1.unit06.lesson06.teach.turn01:
    title: سهيلة تسأل عن الطريق
    gloss: تسأل سهيلة صاحب متجر بلباقة كيف تصل إلى الصيدلية.
    note: ببخشین تفتتح السؤال باحترام، و می‌توانین بگویین؟ عبارة مهذبة لطلب الاتجاهات من الدرس الرابع.
  prs.a1.unit06.lesson06.teach.turn02:
    title: صاحب المتجر يعطي الخطوة الأولى
    gloss: يؤكد صاحب المتجر ويقول أن تسير مباشرةً أولًا.
    note: اول مستقیم بروین تبدأ سلسلة الاتجاهات.
  prs.a1.unit06.lesson06.teach.turn03:
    title: سهيلة تؤكد وتسأل عن التالي
    gloss: تكرر سهيلة «مباشرةً» للتأكيد، ثم تسأل عمّا يأتي بعد ذلك.
    note: بعد چطور؟ طريقة طبيعية ومختصرة لطلب الخطوة التالية.
  prs.a1.unit06.lesson06.teach.turn04:
    title: صاحب المتجر يعطي الخطوة الثانية والمعلم
    gloss: يقول صاحب المتجر أن تنعطف يسارًا، ثم يحدد موقع الصيدلية بالاعتماد على المسجد والبنك معلمين.
    note: تجمع هذه الجملة بين تعليمة الانعطاف من الدرس الثاني ونمط المعالم من الدرس الخامس.
  prs.a1.unit06.lesson06.teach.turn05:
    title: سهيلة تشكره وتؤكد أنها فهمت
    gloss: تشكره سهيلة جزيل الشكر وتقول إنها فهمت.
    note: تشکر زیاد، فهمیدم تُنهي الحديث، كما ورد في الدرس الرابع.
  prs.a1.unit06.lesson06.teach.turn06:
    title: رد صاحب المتجر المتواضع وتوديعه
    gloss: صاحب المحل يردّ على الشكر ويتمنى لها رحلة سعيدة.
    note: تم تقديم قابلی نداره في وحدة الأماكن؛ وسفر خوش (رحلة سعيدة / سلامة الوصول) عبارة وداع طبيعية لمن هو على وشك الذهاب إلى مكان ما مشيًا.
