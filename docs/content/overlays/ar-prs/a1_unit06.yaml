  description: 'الداري الأفغانية للمبتدئين: كلمات الاتجاهات الأساسية، وإعطاء تعليمات الانعطاف، وترتيب الاتجاهات المتعددة الخطوات، وطلب الاتجاهات بلباقة، والاتجاهات بالاعتماد على المعالم.'
