  prs.a1.unit23.lesson01.teach.kart:
    title: بطاقة
    gloss: بطاقة
    note: کارت تعني البطاقة (بطاقة الدفع).
    example_gloss: عندي بطاقة.
  prs.a1.unit23.lesson01.teach.dollar:
    title: الدولار
    gloss: دولار
    note: دالر تعني الدولار (الأمريكي)، وهو شائع الاستخدام ويُذكر سعره إلى جانب الأفغاني في الصرف اليومي في أفغانستان.
    example_gloss: عندي مئة دولار.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: عندي
    gloss: عندي
    note: دارم تعني «عندي» (سبق تقديمها في الوحدة 10 عن التسوق).
    example_gloss: لديّ مال.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: مئة
    gloss: مئة
    note: صد تعني مئة، وقد سبق تقديمها في أعداد الوحدة 4 واستُخدمت في تسوق الوحدة 10.
    example_gloss: عندي مئة دولار.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: أدفع
    gloss: أدفع
    note: می‌پردازم تعني «أدفع».
    example_gloss: أدفع نقدًا.
  prs.a1.unit23.lesson02.teach.ya:
    title: أو
    gloss: أو
    note: یا تعني «أو».
    example_gloss: أدفع نقدًا أو بالبطاقة.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: نقدًا أم بالبطاقة؟
    gloss: هل ستدفع نقدًا أم بالبطاقة؟
    note: سؤال شائع في المتجر أو عند شباك الصرف.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: أستطيع
    gloss: أستطيع
    note: می‌توانم تعني «أستطيع» (سبق تقديمها في الدورة).
    example_gloss: أستطيع أن أدفع نقدًا.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: أدفع
    gloss: أدفع
    note: بپردازم صيغة المضارع المنصوب من فعل «دفع»، وتُستخدم بعد می‌توانم (أستطيع)؛ فعبارة می‌توانم نقد بپردازم تعني «أستطيع أن أدفع نقدًا».
    example_gloss: أستطيع أن أدفع نقدًا.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: الصرّاف
    gloss: الصرّاف
    note: صرافی مؤسسة حقيقية وشائعة في أفغانستان لصرف العملات، وهي تختلف عن البنك الرسمي (بانک).
    example_gloss: أذهب إلى الصرّاف.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: يصرف العملة
    gloss: يصرف العملة
    note: تبدیل کردن تعني «صرف (العملة)».
    example_gloss: أصرف الدولارات إلى أفغانيات.
  prs.a1.unit23.lesson03.teach.narkh:
    title: سعر الصرف
    gloss: سعر الصرف
    note: نرخ تعني السعر / سعر الصرف.
    example_gloss: كم سعر الدولار اليوم؟
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: ما هو سعر الصرف اليوم؟
    gloss: ما سعر الدولار اليوم؟
    note: هذه هي الطريقة المعتادة للسؤال عن سعر الصرف.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: الأفغاني
    gloss: أفغاني (عملة أفغانستان)
    note: افغانی هو عملة أفغانستان (سبق أن ورد في وحدة التسوق العاشرة، مثل "صد افغانی").
    example_gloss: عندي مئة أفغاني.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'مراجعة: يكون، اليوم، كم'
    gloss: هو / اليوم / كم
    note: است وامروز وچند كلمات للمراجعة (سبق تقديمها في الدورة) وقد اجتمعت في سؤال السعر في هذا الدرس.
    example_gloss: ما سعر الدولار اليوم؟
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'مراجعة: إلى، علامة المفعول به، أفعل، افعل، أريد'
    gloss: إلى / علامة المفعول به / أفعل / افعل / أريد
    note: به ورا ومی‌کنم وکنم ومی‌خواهم كلمات للمراجعة (سبق تقديمها في الدورة) وقد اجتمعت في جمل الصرف في هذا الدرس.
    example_gloss: أريد تحويل الدولارات إلى أفغاني.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: أريد
    gloss: أريد
    note: می‌خواهم تعني "أريد" (سبق تقديمها في الوحدات السابقة).
    example_gloss: أريد صرف الدولارات.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: كم دولارًا لديك؟
    gloss: كم دولارًا لديكم؟
    note: دارین صيغة المخاطب المهذبة أو الجمع للفعل "يملك"، وتُستعمل هنا لمخاطبة الزبون.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: تفضّل
    gloss: تفضل
    note: بفرمایین عبارة مهذبة تُقال عند تسليم شيء لشخص.
    example_gloss: تفضل، سبعة آلاف أفغاني.
  prs.a1.unit23.lesson04.teach.hazar:
    title: ألف
    gloss: ألف
    note: هزار تعني ألفًا.
    example_gloss: سبعة آلاف أفغاني.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: زرمينه
    gloss: زرمينه
    note: زرمینه هي الشخصية المتكررة المعروفة في الدورة.
    example_gloss: تذهب زرمينه إلى الصرّاف.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: حسنًا جدًا
    gloss: حسنًا جدًا
    note: بسیار خوب عبارة سبق تقديمها، وتُستعمل هنا لقبول عرض.
    example_gloss: حسنًا جدًا، شكرًا.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'مراجعة: سبعون، شكرًا، فعل'
    gloss: سبعون / شكرًا / فعل (هو/هي)
    note: هفتاد وتشکر كلمتان للمراجعة؛ أما کرد فهو الماضي للغائب من کردن (يفعل)، وقد ورد في درس الماضي في الوحدة 20، وهو يجتمع هنا لتلخيص الحوار.
    example_gloss: صرفت زرمينه مئة دولار إلى أفغاني.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'زرمينه: مرحبًا، أريد تحويل الدولارات إلى أفغاني.'
    gloss: مرحبًا، أريد تحويل الدولارات إلى أفغاني.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'الصرّاف: كم دولارًا لديك؟'
    gloss: كم دولارًا لديكم؟
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'زرمينه: عندي مئة دولار. ما سعر الصرف اليوم؟'
    gloss: عندي مئة دولار. ما سعر الصرف اليوم؟
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'الصرّاف: اليوم الدولار الواحد بسبعين أفغانيًا.'
    gloss: اليوم الدولار الواحد بسبعين أفغانيًا.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'زرمينه: حسنًا جدًا، من فضلك حوّل المبلغ.'
    gloss: حسنًا جدًا، من فضلك حوّل المبلغ.
    note: تبدیل کنین هي صيغة الأمر المهذبة "من فضلكم حوّلوا / حوّل".
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'الصرّاف: تفضل، سبعة آلاف أفغاني.'
    gloss: تفضل، سبعة آلاف أفغاني.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'زرمينه: شكرًا.'
    gloss: شكرًا.
  prs.a1.unit23.lesson05.teach.rasid:
    title: الإيصال
    gloss: إيصال
    note: رسید تعني إيصالًا.
    example_gloss: آخذ إيصالًا.
  prs.a1.unit23.lesson05.teach.migiram:
    title: آخذ / أتسلّم
    gloss: آخذ / أتسلّم
    note: می‌گیرم تعني "آخذ / أتسلّم".
    example_gloss: آخذ المال.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: نص القراءة
    gloss: ذهبت زرمينه إلى الصرّاف. كان معها مئة دولار وأرادت تحويلها إلى أفغاني. كان سعر الصرف اليوم سبعين أفغانيًا. استلمت زرمينه سبعة آلاف أفغاني وأخذت إيصالًا.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: ذهب
    gloss: ذهب
    note: رفت هو الماضي بمعنى "ذهب / ذهبت" (للغائب أو الغائبة).
    example_gloss: ذهبت زرمينه إلى الصرّاف.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'مراجعة: سبعة، أخذ/استلم (هو/هي)، أخذتُ/استلمتُ'
    gloss: سبعة / أخذ، استلم (هو/هي) / أخذتُ، استلمتُ
    note: هفت رقم للمراجعة؛ وگرفت وگرفتم هما الماضي للغائب وللمتكلم من گرفتن (يأخذ/يستلم)، وقد وردا هنا للمبلغ الذي استلمته زرمينه.
    example_gloss: استلمت زرمينه سبعة آلاف أفغاني.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: ملخص ختامي
    gloss: 'عندي مال: نقد وبطاقة. أستطيع تحويل الدولارات إلى أفغاني عند الصرّاف. سعر اليوم سبعون أفغانيًا للدولار الواحد.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: لـ
    gloss: لـ
    note: برای تعني "لـ / مقابل".
    example_gloss: سبعون أفغانيًا مقابل دولار واحد.
  prs.a1.unit23.lesson06.teach.review_va:
    title: و
    gloss: و
    note: و تعني "و" (حرف العطف) وهي مألوفة من الوحدات السابقة.
    example_gloss: 'عندي مال: نقد وبطاقة.'
