    gloss: يأخذ / يحصل على
    note: بگیرم صيغة المضارع الالتزامي («أن آخذ»)، وهي الصيغة نفسها التي استخدمتها الوحدة 42 مع می‌خواهم لقول «أريد أن آخذ».
    example_gloss: أريد أن آخذ كتابًا.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: القرض
    gloss: قرض
    note: تعني «قرض» الاستدانة أو الشيء المُستعار، وتُستعمل «قرض گرفتن» (أخذ قرضًا) في الدرية اليومية بمعنى «استعار».
    example_gloss: هذا الكتاب مُستعار.
