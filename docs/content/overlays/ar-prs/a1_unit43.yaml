teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'مراجعة: كتاب، لدي، يكون، في'
    gloss: كتاب / لدي / يكون / في
    note: کتاب ودارم وهي كلمات مراجعة تُستخدم للحديث عن كتاب، وكذلك است و در.
    target_text: کتاب (كتاب) / دارم (لدي) / است (يكون) / در (في)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'مراجعة: أريد، واحد'
    gloss: أريد / واحد
    note: تجتمع می‌خواهم و یک للتعبير عمّا تريد.
    target_text: می‌خواهم (أريد) / یک (واحد)
  prs.a1.unit43.lesson01.teach.library_word:
    title: مكتبة
    gloss: مكتبة
    note: کتابخانه هي الكلمة الدرية المعتادة للمكتبة، وهي مركّبة من کتاب (كتاب) و خانه (بيت).
    example_gloss: الكتاب في المكتبة.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: أمين المكتبة
    gloss: أمين المكتبة
    note: کتابدار تعني حرفيًا «ممسك الكتب» (من يعتني بالكتب)، وتتشكل بالطريقة نفسها مثل دوکاندار («صاحب دكان»، الوحدة 8).
    example_gloss: أمين المكتبة في المكتبة.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: أريد كتابًا
    gloss: أريد كتابًا.
    note: یک کتاب می‌خواهم تجمع یک (واحد) وکتاب (كتاب) و می‌خواهم (أريد).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'مراجعة: من، علامة المفعول به'
    gloss: من / (علامة المفعول به)
    note: از (من) و را (تدل على المفعول به في الجملة، من الوحدة 14 والوحدة 26) كلمات مراجعة.
    target_text: از (من) / را (علامة المفعول به)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: أريد الكتاب من أمين المكتبة
    gloss: أريد الكتاب من أمين المكتبة.
    note: تُضاف از کتابدار (من أمين المكتبة) إلى کتاب را می‌خواهم.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: أريد كتابًا من أمين المكتبة
    gloss: أريد كتابًا من أمين المكتبة.
    note: تجمع یک (واحد) مع کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'مراجعة: تاريخ، يوم، الاثنين'
    gloss: تاريخ / يوم / الاثنين
    note: تاریخ وروز ودوشنبه (كلها من الوحدة 9) كلمات مراجعة تُستخدم للسؤال عن موعد الإرجاع.
    target_text: تاریخ (تاريخ) / روز (يوم) / دوشنبه (الاثنين)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'مراجعة: أي، يكون'
    gloss: أي / يكون
    note: کدام و است كلمتان للمراجعة تُستخدمان في طرح سؤال.
    target_text: کدام (أي) / است (يكون)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: الإرجاع / إعادة الشيء
    gloss: إرجاع / إعادة
    note: پس دادن تعني حرفيًا «أن يُعيد»؛ تجتمع پس (إلى الخلف) مع دادن (أن يعطي).
    example_gloss: موعد الإرجاع يوم الاثنين.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: في أي يوم موعد الإرجاع؟
    gloss: في أي يوم موعد إرجاع الكتاب؟
    note: تاریخ پس دادن کتاب کدام روز است؟ سؤال عن موعد إعادة الكتاب المستعار.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: موعد الإرجاع يوم الاثنين
    gloss: موعد الإرجاع يوم الاثنين.
    note: تاریخ پس دادن دوشنبه است جواب عن السؤال بتحديد يوم معيّن.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
