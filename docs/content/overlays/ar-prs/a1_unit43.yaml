course:
  title: الدرية A1
  description: 'الدرية الكابلية للمبتدئين: استعارة كتاب بسيط من المكتبة وإرجاعه، والسؤال عن موعد الإرجاع، وقراءة نص قصير عن كتاب مستعار — اسأل أي كتاب يريده الشخص، واعرض موعد الإرجاع وأكّده، وافهم تبادلًا بسيطًا في المكتبة.'
units:
  prs.a1.unit43.library:
    title: المكتبة
    description: اطلب كتابًا، واستعره وأرجعه، واسأل عن موعد الإرجاع وأكّده، واقرأ نصًا قصيرًا عن كتاب مستعار.
