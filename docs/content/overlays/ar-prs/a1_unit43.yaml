    title: يُعطي (يُعيد)
    gloss: أُعطي (أُعيد)
    note: «بدهم» صيغة الفعل «دادن» (أعطى) في المضارع الالتباسي؛ ومع «پس» (إلى الوراء) تعني «أُعيد / أُرجِع».
    example_gloss: أريد أن أُعيده.
