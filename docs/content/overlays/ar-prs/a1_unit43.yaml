    gloss: أريد / كتاب / واحد / هذا
    note: می‌خواهم وکتاب ویک وبیک وکلمات این كلمات مراجعة تُستخدم لطلب كتاب معيّن.
    target_text: می‌خواهم (أريد) / کتاب (كتاب) / یک (واحد) / این (هذا)
  prs.a1.unit43.lesson03.teach.get_word:
