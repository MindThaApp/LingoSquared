    note: دوست دارم (أحب) ووقت (وقت) وندارم (ليس عندي) كلها للمراجعة من الوحدات 11 و14 و26 و29 و30.
    target_text: دوست دارم (أحب) / وقت (وقت) / ندارم (ليس لدي)
