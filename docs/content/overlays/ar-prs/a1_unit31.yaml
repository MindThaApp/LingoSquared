teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: التعليم
    gloss: التعليم / الدراسة
    note: تحصیل تعني التعليم أو الدراسة بوجه عام، وهي الكلمة الرئيسة لموضوع هذه الوحدة.
    example_gloss: التعليم جيد.
  prs.a1.unit31.lesson01.teach.university_word:
    title: الجامعة
    gloss: جامعة
    note: پوهنتون تعني الجامعة، وهي الكلمة الأفغانية المعتمدة (كما في اسم جامعة كابل)، وتختلف عن دانشگاه المستعملة في إيران.
    example_gloss: الجامعة في كابل.
  prs.a1.unit31.lesson01.teach.school_word:
    title: مدرسة
    gloss: مدرسة
    note: مکتب تعني المدرسة.
    example_gloss: هذه المدرسة جيدة.
  prs.a1.unit31.lesson01.teach.field_word:
    title: التخصص
    gloss: التخصص الدراسي
    note: رشته تعني مجال الدراسة أو التخصص الجامعي، وهي كلمة معيارية مشتركة بين الفارسية والدارية.
    example_gloss: تخصصي هو الطب.
  prs.a1.unit31.lesson01.teach.student_word:
    title: الطالب الجامعي
    gloss: طالب جامعي
    note: محصل تعني طالب الجامعة، وهي الكلمة الدارية الأفغانية المعتمدة، وتختلف عن دانشجو المستعملة في إيران.
    example_gloss: هو / هي طالب / طالبة.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: الدرس
    gloss: درس
    note: درس تعني الدرس، وتُستعمل مع خواندن (القراءة) لتكوين العبارة الفعلية التي تعني «يدرس».
    example_gloss: أدرس كل يوم.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: يدرس
    gloss: درس + قراءة ← أدرس
    note: تتحد درس (الدرس) مع خواندن (القراءة) لتكوين درس می‌خوانم (أدرس) — وحرفيًا «أقرأ درسًا»، وهو نمط جديد فعلًا من الأفعال المركبة في هذه الدورة.
    target_text: درس («lesson») + خواندن (to read) = درس می‌خوانم (I study)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: أدرس في الجامعة
    gloss: أدرس في الجامعة.
    note: تجمع بين من (أنا، مراجعة) و در (في، مراجعة) و پوهنتون و درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: الدواء
    gloss: دواء
    note: طب تعني الطب بوصفه مجال دراسة، وهي كلمة معيارية مشتركة بين الفارسية والدارية.
    example_gloss: الطب صعب.
  prs.a1.unit31.lesson02.teach.law_word:
    title: الحقوق
    gloss: القانون (الحقوق)
    note: تعني حقوق القانون بوصفه مجالًا دراسيًا، وهي كلمة فارسية/دَرية مشتركة قياسية.
    example_gloss: الحقوق مجال ممتع.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: الاقتصاد
    gloss: الاقتصاد
    note: تعني اقتصاد علم الاقتصاد بوصفه مجالًا دراسيًا، وهي كلمة فارسية/دَرية مشتركة قياسية.
    example_gloss: الاقتصاد صعب أيضًا.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: الأدب
    gloss: الأدب
    note: تعني ادبیات الأدب بوصفه مجالًا دراسيًا، وهي كلمة فارسية/دَرية مشتركة قياسية.
    example_gloss: أحب الأدب.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: تخصصي الطب
    gloss: تخصصي الطب.
    note: تجمع بين رشته من (تخصصي، للمراجعة) و است (يكون/هو)، وهي كلمة جديدة هنا.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: أدرس الطب
    gloss: أدرس الطب.
    note: تطبّق من ... می‌خوانم (أدرس) مباشرة على اسم تخصص، مثل طب.
  prs.a1.unit31.lesson03.teach.review_koja:
