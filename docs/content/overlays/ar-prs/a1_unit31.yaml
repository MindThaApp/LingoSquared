  description: 'الدارية الكابلية للمبتدئين: مفردات التعليم والدراسة (الجامعة، المدرسة، التخصص، الطالب، الدرس)، وذكر التخصص (الطب، القانون، الاقتصاد، الأدب)، والسؤال عن مكان الدراسة والإجابة عنه، وحوار بين كريم وبروين عن الدراسة وشعورهما تجاهها.'
