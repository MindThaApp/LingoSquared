    gloss: أنتم تدرسون (للمخاطب بصيغة رسمية)
    note: درس می‌خوانین هي صيغة «تدرسون» الرسمية، وتوافق نمط الأفعال الرسمي المعتاد بالنهاية -ین (مثل استفاده می‌کنین من الوحدة 30).
    target_text: درس می‌خوانین (أنتم تدرسون، بصيغة المخاطب الرسمية)
  prs.a1.unit31.lesson03.teach.question_where:
