    note: تجمع بين من در ... درس می‌خوانم (أدرس في ...، للمراجعة) وپوهنتون کابل (جامعة كابل).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: يدرس / تدرس
    gloss: هو/هي يدرس
    note: درس می‌خواند هي صيغة الغائب، وتوافق نمط أفعال الغائب المعتاد بالنهاية -د (مثل استفاده می‌کند من الوحدة 30).
    target_text: درس می‌خواند (he/she studies, 3rd person)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: أنتَ (بصيغة غير رسمية) / تدرس (بصيغة غير رسمية)
    gloss: أنت (للمخاطب بصيغة غير رسمية) / تدرس (غير رسمي)
    note: تو و می‌خوانی هما الصيغة غير الرسمية المستعملة بين كريم وپروین.
    target_text: تو (أنتَ، بصيغة غير رسمية) / می‌خوانی (أنتَ تدرس، بصيغة غير رسمية)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'كريم: پروین، أين تدرسين؟'
    gloss: پروین، أين تدرسين؟
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'پروین: أدرس في جامعة كابل. تخصصي الطب.'
    gloss: أدرس في جامعة كابل. تخصصي الطب.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'كريم: هل الطب صعب؟'
    gloss: هل الطب صعب؟
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'پروین: نعم، هو صعب لكنه ممتع. وأنت؟'
    gloss: نعم، هو صعب لكنه ممتع. وأنت؟
