course:
  title: الدارية A1
  description: 'الدرية الأفغانية للمبتدئين: العدّ من واحد إلى مئة، والسؤال عن العمر والإخبار به، وتبادل أرقام الهاتف.'
units:
  prs.a1.unit04.numbers:
    title: العدّ والأرقام
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: العدّ من واحد إلى عشرة
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: العدّ من أحد عشر إلى عشرين
  prs.a1.unit04.lesson03.tens:
    title: العقود حتى المئة
  prs.a1.unit04.lesson04.asking_age:
    title: السؤال عن عمر شخص والإخبار به
  prs.a1.unit04.lesson05.phone_numbers:
    title: تبادل أرقام الهاتف
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: صديقان يقارنان العمر ورقم الهاتف
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: واحد، اثنان، ثلاثة
    gloss: 1, 2, 3
    note: «یک، دو، سه» هي الأعداد الفارسية الأساسية المشتركة بين الدرية والفارسية الإيرانية.
    example_gloss:
    - عندي أخ واحد.
    - عندي كتابان.
    - عندي ثلاث أخوات.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: أربعة، خمسة، ستة
    gloss: 4, 5, 6
    note: «چهار» هو الشكل المكتوب المعياري، وبعض المتكلمين يختصرونه في الكلام العادي إلى «چار»، لكن هذه الدورة تعتمد الإملاء المعياري.
    example_gloss:
    - عندي أربعة كتب.
    - انتظروا خمس دقائق.
    - عنده/عندها ستة كتب.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: سبعة، ثمانية
    gloss: 7, 8
    note: «هفت، هشت» تكملان تسلسل الأعداد.
    example_gloss:
    - في الأسبوع سبعة أيام.
    - سآتي في الساعة الثامنة.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: تسعة، عشرة
    gloss: 9, 10
    note: «نه، ده» تُتمّان الأعداد من واحد إلى عشرة.
    example_gloss:
    - يوجد تسعة أشخاص في الصف.
    - لدي عشرة أصابع.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: أحد عشر، اثنا عشر، ثلاثة عشر
    gloss: 11, 12, 13
    note: «یازده، دوازده، سیزده» كلمات قائمة بذاتها، وليست مركّبة ببساطة من أسماء الآحاد.
    example_gloss:
    - عندي حصة في الساعة الحادية عشرة.
    - في السنة اثنا عشر شهرًا.
    - عمره ثلاث عشرة سنة.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: أربعة عشر، خمسة عشر، ستة عشر
    gloss: 14, 15, 16
    note: «چهارده، پانزده، شانزده» تكمل أعداد العشرات الأولى (11–19).
    example_gloss:
    - سآتي بعد أربعة عشر يومًا.
    - عنده خمسة عشر كتابًا.
    - عمره ست عشرة سنة.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: سبعة عشر، ثمانية عشر، تسعة عشر
    gloss: 17, 18, 19
    note: «هفده، هجده، نوزده» تُتمّ الأعداد من 11 إلى 19.
    example_gloss:
    - عنده/عندها سبعة عشر كتابًا.
    - عمره ثماني عشرة سنة.
    - بقي تسعة عشر يومًا.
  prs.a1.unit04.lesson02.teach.twenty:
    title: عشرون
    gloss: '20'
    note: «بیست» أول العقود، وسيأتي شرحها كاملًا في الدرس التالي.
    example_gloss: عندي عشرون كتابًا.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: عشرون، ثلاثون، أربعون
    gloss: 20, 30, 40
    note: «بیست، سی، چهل» كلمات العقود، ولكل منها صيغة مستقلة وليست على نمط يمكن توقّعه.
    example_gloss:
    - عمري عشرون عامًا.
    - هذا الشهر ثلاثون يومًا.
    - عمره أربعون سنة.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: خمسون، ستون
    gloss: 50, 60
    note: «پنجاه، شصت» تكملان العقود.
    example_gloss:
    - عنده/عندها خمسون كتابًا.
    - ستون دقيقة تساوي ساعة واحدة.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: سبعون، ثمانون
    gloss: 70, 80
    note: «هفتاد، هشتاد» تكملان العقود.
    example_gloss:
    - هذا الكتاب فيه سبعون صفحة.
    - عنده ثمانون كتابًا.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: تسعون، مئة
    gloss: 90, 100
    note: «نود، صد» تُتمّان التسلسل حتى المئة.
    example_gloss:
    - عمره تسعون سنة.
    - عنده/عندها مئة كتاب.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: الجمع بين العقود والآحاد
    gloss: العدد 25 يعني حرفيًا «عشرون وخمسة».
    note: يُربط اسم العقد باسم الآحاد بالحرف «و» (واو العطف)، وهو الرابط نفسه المستخدم في مواضع أخرى من هذه الدورة، مثل «بیست و پنج» (25). وهذا يشبه ترتيب العربية في «خمسة وعشرون»، لكن في الدرية يأتي العقد أولًا.
  prs.a1.unit04.lesson04.teach.chand:
    title: كم / كم عددًا
    gloss: كم
    note: تُستخدم «چند» لطرح سؤال عن الكمية، ومنها العمر.
    example_gloss: كم عمرك؟
  prs.a1.unit04.lesson04.teach.sal_word:
    title: السنة
    gloss: سنة
    note: تُستخدم «سال» عند ذكر العمر، ومعناها حرفيًا «سنوات».
    example_gloss: عمري عشرون عامًا.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: السؤال عن عمر شخص بأدب
    gloss: كم عمرك؟
    note: «چند ساله استین؟» تعني حرفيًا «كم سنة عمرك؟»، وتُستخدم فيها صيغة «استین» المهذبة مع من لا تعرفه جيدًا.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: السؤال عن عمر صديق مقرّب
    gloss: كم عمرك؟
    note: «چند ساله استی؟» تستخدم صيغة «استی» غير الرسمية؛ فاحتفظ بها للصديق المقرّب أو لمن هو في مثل سنّك، وفق قاعدة مستوى الكلام نفسها في هذه الدورة.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: قل عمرك
    gloss: عمري ٢٥ سنة.
    note: «بیست و پنج ساله استم» تجمع بين العدد و«ساله» (ذو العمر) و«استم».
  prs.a1.unit04.lesson05.teach.number_word:
    title: عدد
    gloss: عدد
    note: «نمبر» كلمة يومية شائعة في أفغانستان بمعنى «رقم»، وبخاصة رقم الهاتف.
    example_gloss: هذا رقم هاتفي.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: الهاتف
    gloss: هاتف
    note: «تلفن» هي الكلمة المعتادة للهاتف.
    example_gloss: هاتفي معطّل.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: طلب رقم هاتف
    gloss: ما رقم هاتفك؟
    note: «نمبر تلفن‌تان چند است؟» تستخدم نمط «چند» نفسه الوارد في سؤال العمر، لكن مع رقم الهاتف.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: صفر
    gloss: صفر
    note: تلزم «صفر» لقراءة معظم أرقام الهاتف في أفغانستان.
    example_gloss: الصفر عدد.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: اذكر رقم هاتفك
    gloss: رقم هاتفي 079-345-678.
    note: تُقرأ أرقام الهاتف الأفغانية عادةً في مجموعات قصيرة لا رقمًا رقمًا، كما في هذا المثال.
  prs.a1.unit04.lesson06.teach.turn01:
    title: همايون يحيّي بشير
    gloss: همايون يسأل بشيرًا عن حاله بصيغة غير رسمية تناسب الصديق المقرّب.
    note: «جور استی؟» تدل على أن الاثنين صديقان مقرّبان، لذا تناسب الصيغة غير الرسمية في هذا الحوار كله.
  prs.a1.unit04.lesson06.teach.turn02:
    title: بشير يردّ ويسأل همايون عن عمره
    gloss: بشير يقول إنه بخير ويسأل همايون عن عمره.
    note: «چند ساله استی؟» تستخدم الصيغة غير الرسمية المناسبة لصداقتهما.
  prs.a1.unit04.lesson06.teach.turn03:
    title: همايون يجيب ويعيد السؤال
    gloss: همايون يقول إن عمره 28 سنة ويسأل بشيرًا السؤال نفسه.
    note: يُعاد استخدام نمط الإجابة عن العمر من الدرس الرابع كما هو.
  prs.a1.unit04.lesson06.teach.turn04:
    title: بشير يجيب
    gloss: بشير يقول إن عمره 26 سنة.
    note: بهذا يكتمل تبادل الحديث عن العمر.
  prs.a1.unit04.lesson06.teach.turn05:
    title: همايون يسأل عن رقم هاتف بشير
    gloss: همايون يسأل عن رقم هاتف بشير.
    note: «تلفنت» تحمل لاحقة الملكية غير الرسمية، بما يناسب مستوى الكلام في بقية هذا الحوار.
  prs.a1.unit04.lesson06.teach.turn06:
    title: بشير يذكر رقم هاتفه
    gloss: بشير يقرأ رقم هاتفه في مجموعات.
    note: يُقرأ الرقم بالطريقة الطبيعية نفسها في مجموعات، كما في مثال الدرس الخامس.
  prs.a1.unit04.lesson06.teach.turn07:
    title: همايون يؤكد أنه حفظ الرقم
    gloss: همايون يشكره ويقول إنه سيحفظ الرقم الآن.
    note: «سیف می‌کنم» (مأخوذة من الكلمة الإنجليزية «save») كلمة مستعارة تقنية شائعة في الكلام غير الرسمي في أفغانستان، وتناسب هذا الحديث العفوي بين صديقين.
