teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: التذكرة
    gloss: التذكرة
    note: تکت تعني «تذكرة». وهي الكلمة الدرية اليومية؛ أما بلیط (وتُكتب أيضًا بلیت، وهي الكلمة على الطريقة الإيرانية) فهي مفهومة ومقبولة، لكنّ تکت هي ما ستسمعه غالبًا.
    example_gloss: لديّ تذكرة.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: قطار
    gloss: القطار
    note: قطار تعني «قطار».
    example_gloss: القطار جيد.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: الحافلة
    gloss: حافلة
    note: بس تعني «حافلة»، وهو استعمال شائع في الدرية الأفغانية.
    example_gloss: الحافلة جيدة.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: المطار
    gloss: مطار
    note: میدان هوایی تعني «مطار» — وهو المصطلح الدري الأفغاني المعتمد في هذه الدورة (لا فرودگاه الإيراني)، تمامًا كما في الوحدة 5.
    example_gloss: المطار جيد.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: واحد
    gloss: واحد / أداة تنكير
    note: یک تعني «واحد»، وتُستعمل هنا للتنكير (تذكرة).
    target_text: یک (واحد/تذكرة واحدة)
  prs.a1.unit16.lesson01.teach.az_word:
    title: من
    gloss: من
    note: از تعني «من» وتدل على نقطة الانطلاق (وهي غير از المستعملة في المقارنة بمعنى «من» في «أكبر من»).
    target_text: از (من)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: اثنان
    gloss: اثنان
    note: دو تعني «اثنان».
    example_gloss: عندي تذكرتان.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: الرصيف الثاني
    gloss: الرصيف رقم اثنين
    note: سکوی دو تجمع سکو (رصيف) مع كسرة الإضافة -ی والعدد دو (اثنان).
    target_text: سکوی دو (الرصيف الثاني)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: هرات
    gloss: هرات
    note: مدينة كبيرة في غرب أفغانستان.
    example_gloss: أنا ذاهب إلى هرات.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: أريد
    gloss: أريد
    note: «می‌خواهم» هي الصيغة الكاملة غير المختصرة لـ «أريد»، بما يتوافق مع مستوى اللغة في هذه الدورة.
    target_text: می‌خواهم (أريد)
  prs.a1.unit16.lesson02.teach.be_word:
    title: إلى
    gloss: إلى
    note: تدل «به» على الوجهة؛ «به هرات» تعني «إلى هرات».
    target_text: به (إلى)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: أريد تذكرة إلى هرات
    gloss: أريد تذكرة إلى هرات
    note: تجمع «یک تکت به هرات می‌خواهم» مفردات هذا الدرس في الطريقة المعتادة لطلب تذكرة.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: الرصيف
    gloss: رصيف
    note: سکو تعني «رصيف» (في محطة القطار).
    example_gloss: يغادر القطار من الرصيف رقم اثنين.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: يغادر
    gloss: يغادر
    note: «حرکت می‌کند» هي الصيغة الكاملة غير المختصرة لـ «يغادر / ينطلق».
    target_text: حرکت می‌کند (يغادر)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: متى
    gloss: متى
    note: کی تعني «متى»، وتُستعمل للسؤال عن الوقت.
    target_text: کی (متى)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: الصباح
    gloss: صباح
    note: صبح تعني «صباح».
    example_gloss: ينطلق القطار في الثامنة صباحًا.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: نص جدول نموذجي
    gloss: ينطلق قطار هرات من الرصيف رقم اثنين في الثامنة صباحًا.
    note: إعلان قصير يجمع مفردات السفر في هذه الوحدة، وهذا النص المكتوب يقوم مقام إعلان صوتي في المحطة.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: غدًا
    gloss: غدًا
    note: فردا تعني «غدًا».
    example_gloss: سأذهب غدًا صباحًا.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: حسنًا جدًا / موافق
    gloss: حسنًا جدًا / موافق
    note: «بسیار خوب» هي الصيغة الكاملة الرسمية لقول «موافق / حسنًا جدًا»، بما يتوافق مع مستوى اللغة في هذه الدورة (وليست «باشه» العامية).
    example_gloss: القطار جيد جدًا.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: المسافر يقول
    gloss: أريد تذكرة إلى هرات.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: البائع يسأل
    gloss: متى تريد الذهاب؟
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: المسافر يجيب
    gloss: غدًا صباحًا.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: البائع يؤكد
    gloss: حسنًا جدًا، ينطلق القطار من الرصيف رقم اثنين في الثامنة صباحًا.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: شكرًا جزيلًا
    gloss: شكرًا جزيلًا
    note: «تشکر زیاد» طريقة مهذبة شائعة لقول «شكرًا جزيلًا»، وقد وردت سابقًا في الوحدتين 5 و6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: عفوًا
    gloss: عفوًا / على الرحب والسعة
    note: «قابلی نداره» هو الرد المهذب المعتاد على الشكر، وقد ورد سابقًا في الوحدتين 5 و6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: سفرًا سعيدًا
    gloss: سفرًا سعيدًا
    note: «سفر خوش» عبارة وداع شائعة لمن هو على وشك السفر، وقد وردت سابقًا في الوحدة 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: و
    gloss: و
    note: و تعني «و» وتربط بين جملتين أو عنصرين.
    target_text: و (و)
