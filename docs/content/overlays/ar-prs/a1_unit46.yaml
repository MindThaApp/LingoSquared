  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: هذه صيدلية
    gloss: هذه صيدلية.
    note: تجمع عبارة این دواخانه است الكلمات التي تعلمناها سابقًا في هذا الدرس.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: الصيدلي
    gloss: صيدلي
    note: معنى دواساز حرفيًا «صانع الدواء».
    example_gloss: الصيدلي في الصيدلية.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: الصيدلي في الصيدلية
    gloss: الصيدلي في الصيدلية.
    note: تجمع عبارة دواساز در دواخانه است بين دواساز (الصيدلي) ودواخانه (الصيدلية).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'مراجعة: دواء، أريد'
    gloss: دواء / أريد
    note: الكلمتان دوا ومی‌خواهم كلمتان للمراجعة نستخدمهما لطلب الدواء.
    target_text: دوا (دواء) / می‌خواهم (أريد)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: أريد دواءً
    gloss: أريد دواءً.
    note: تجمع عبارة دوا می‌خواهم بين دوا (دواء) ومی‌خواهم (أريد).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'مراجعة: صداع، ألم في المعدة، عندي، عندك'
    gloss: صداع / ألم في المعدة / عندي / عندك (للمخاطب المحترم)
    note: الكلمات سردرد ودل‌درد ودارم ودارین كلمات للمراجعة نستخدمها لوصف عَرَض.
    target_text: سردرد (صداع) / دل‌درد (ألم في المعدة) / دارم (عندي) / دارین (عندكم، بصيغة المخاطب المهذب)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'مراجعة: جدًا، نعم، لا'
    gloss: جدًا / نعم / لا
    note: الكلمات بسیار وبلی ونخیر (من وحدات سابقة) كلمات للمراجعة نستخدمها للإجابة عن سؤال حول عَرَض.
    target_text: بسیار (جدًا) / بلی (نعم) / نخیر (لا)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: ألم الأسنان
    gloss: ألم الأسنان
    note: تجمع كلمة دندان‌درد بين دندان (سن، الوحدة 42) ونمط -درد («ألم») نفسه الذي استخدمناه في سردرد ودل‌درد.
    example_gloss: عندي ألم في الأسنان.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: عندي ألم شديد في الأسنان
    gloss: عندي ألم شديد في الأسنان.
    note: تستخدم عبارة بسیار دندان‌درد دارم كلمة بسیار (جدًا) لتقوية وصف العَرَض.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: هل عندك صداع؟
    gloss: هل عندك صداع؟
    note: سردرد دارین؟ سؤال جوابه نعم أو لا، ويُكوَّن بنغمة صاعدة في الصوت دون أداة استفهام مستقلة.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: لا، عندي ألم في الأسنان
    gloss: لا، عندي ألم في الأسنان.
    note: تُجيب كلمة نخیر عن السؤال السابق، ثم تسمّي العَرَض الحقيقي.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'مراجعة: أريد، واحد'
    gloss: أريد / واحد
    note: الكلمتان می‌خواهم ویک (من وحدات سابقة) كلمتان للمراجعة نستخدمهما لطلب شكل من أشكال الدواء.
    target_text: می‌خواهم (أريد) / یک (واحد)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: القرص
    gloss: قرص / حبة
    note: قرص هي الكلمة الدرية الشائعة للقرص أو الحبة الدوائية.
    example_gloss: أريد قرصًا.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: أريد قرصًا
    gloss: أريد قرصًا.
    note: تجمع عبارة یک قرص می‌خواهم بين یک (واحد) وقرص (قرص دواء).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: الشراب
    gloss: شراب (دواء)
    note: شربت هي الكلمة الدرية الشائعة للدواء السائل أو الشراب.
    example_gloss: أريد شرابًا.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: أريد شرابًا
    gloss: أريد شرابًا.
    note: تجمع عبارة شربت می‌خواهم بين شربت (شراب) ومی‌خواهم (أريد).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'مراجعة: أي، دواء، تريد (للمخاطب المحترم)'
    gloss: أي / دواء / تريد (للمخاطب المحترم)
    note: الكلمات کدام ودوا ومی‌خواهین كلمات للمراجعة نستخدمها لسؤال الزبون عمّا يريد.
    target_text: کدام (أي) / دوا (دواء) / می‌خواهین (تريدون، بصيغة المخاطب المهذب)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: أي دواء تريد؟
    gloss: أي دواء تريد؟
    note: کدام دوا می‌خواهین؟ هو السؤال المهذب الذي يطرحه الصيدلي.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'مراجعة: مرحبًا، ألم في المعدة، عندي'
    gloss: مرحبًا / ألم في المعدة / عندي
    note: الكلمات سلام ودل‌درد ودارم (من وحدات سابقة) كلمات للمراجعة نستخدمها لبدء الحوار.
    target_text: سلام (مرحبًا) / دل‌درد (ألم في المعدة) / دارم (عندي)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'مراجعة: دواء، تريد (للمخاطب المحترم)، نعم'
    gloss: دواء / تريد (للمخاطب المحترم) / نعم
    note: الكلمات دوا ومی‌خواهین وبلی (من وحدات سابقة) كلمات للمراجعة نستخدمها في أسئلة الصيدلي.
    target_text: دوا (دواء) / می‌خواهین (تريدون، بصيغة المخاطب المهذب) / بلی (نعم)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'مراجعة: هذا، قرص، جيد، يكون (هو)'
    gloss: هذا / قرص / جيد / يكون (هو)
    note: الكلمات این وقرص وخوب واست (من وحدات سابقة ومن هذا الدرس) كلمات للمراجعة نستخدمها لوصف الدواء.
    target_text: این (هذا) / قرص (حبة دواء) / خوب (جيد) / است (يكون)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: الحبة
    gloss: حبة / جرعة
    note: دانه كلمة عدّ تدل على حبة أو جرعة، وتُستخدم مع الأقراص.
    example_gloss: ثلاث حبات.
  prs.a1.unit46.lesson04.teach.take_word:
    title: خُذ
    gloss: خُذ (للمخاطب المحترم)
    note: بگیرین هو فعل الأمر المهذب بمعنى «خُذ»، وهو من عائلة صيغة -ین نفسها مثل کنین/بنوشین في أماكن أخرى من هذه الدورة.
    example_gloss: خُذ ثلاث حبات في اليوم.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'مراجعة: يوم، ثلاثة، شكرًا جزيلًا، عفوًا'
    gloss: يوم / ثلاثة / شكرًا جزيلًا / عفوًا
    note: الكلمات روز وسه وتشکر زیاد وخواهش می‌کنم (من وحدات سابقة) كلمات للمراجعة نستخدمها لإنهاء الحوار.
    target_text: روز (يوم) / سه (ثلاثة) / تشکر زیاد (شكرًا جزيلًا) / خواهش می‌کنم (عفوًا)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'همايون: مرحبًا. عندي ألم في المعدة.'
    gloss: مرحبًا. عندي ألم في المعدة.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'الصيدلي: مرحبًا. هل تريد دواءً؟'
    gloss: مرحبًا. هل تريد دواءً؟
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'همايون: نعم، أريد قرصًا.'
    gloss: نعم، أريد قرصًا.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'الصيدلي: هذا القرص جيد. خُذ ثلاثة في اليوم.'
    gloss: هذا القرص جيد. خُذ ثلاثة في اليوم.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'همايون: شكرًا جزيلًا.'
    gloss: شكرًا جزيلًا.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'الصيدلي: عفوًا.'
    gloss: عفوًا.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'مراجعة: هذا، يكون (هو)، همايون، من'
    gloss: هذا / يكون (هو) / همايون / من
    note: 'الكلمات این واست وهمایون كلمات للمراجعة نستخدمها في نص القراءة. أما از (من وحدات سابقة، وتعني عادةً «من») فتُستخدم هنا مع است للدلالة على الملكية: عبارة این نسخه از همایون است تعني حرفيًا «هذه الوصفة من همايون» لكن معناها «هذه وصفة همايون»، وهو النمط نفسه في این کتاب از من است، أي «هذا الكتاب لي».'
    target_text: این (هذا) / است (يكون) / همایون / از (من)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'مراجعة: واحد، قرص، يوم، ثلاثة، حبة، خُذ'
    gloss: واحد / قرص / يوم / ثلاثة / حبة / خُذ
    note: الكلمات یک وقرص وروز وسه ودانه وبگیرین (من هذه الوحدة) كلمات للمراجعة نستخدمها في نص القراءة.
    target_text: یک (واحد) / قرص (حبة دواء) / روز (يوم) / سه (ثلاثة) / دانه (حبة) / بگیرین (خذ، بصيغة المخاطب المهذب)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: الوصفة الطبية
    gloss: وصفة طبية
    note: نسخه هي الكلمة الدرية الشائعة للوصفة الطبية أو لبطاقة الدواء.
    example_gloss: هذه وصفة طبية.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: قراءة وصفة طبية
    gloss: هذه وصفة همايون. إنها قرص واحد. خُذ ثلاث حبات في اليوم.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'مراجعة: لكن، أنتم (للمخاطب المحترم)، كم'
    gloss: لكن / أنتم (للمخاطب المحترم) / كم
    note: الكلمات اما وشما وچند (من وحدات سابقة) كلمات للمراجعة نستخدمها لذكر جدول الجرعات.
    target_text: اما (لكن) / شما (أنتم، للمخاطب المهذب) / چند (كم)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'مراجعة: صباح، ليل، اثنان، ثلاثة، حبة، يكون (هو)، وصفتكم الطبية'
    gloss: صباح / ليل / اثنان / ثلاثة / حبة / يكون (هو) / وصفتكم الطبية
    note: الكلمات صبح وشب ودو وسه ودانه واست (من الوحدات السابقة وهذه الوحدة) ونسخه‌تان (وصفتك الطبية، بنفس اللاحقة -تان في نام‌تان/تلفن‌تان في أماكن أخرى من هذه الدورة) كلمات مراجعة تختم بها الوحدة.
    target_text: صبح (صباح) / شب (ليل) / دو (اثنان) / سه (ثلاثة) / دانه (حبة) / است (يكون) / نسخه‌تان (وصفتكم الطبية)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: في الصباح حبتان، أما في الليل فثلاث حبات
    gloss: في الصباح حبتان، لكن في الليل ثلاث حبات.
    note: تُستعمل اما للمقابلة بين جرعة الصباح وجرعة الليل.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: كم حبة في وصفتك الطبية؟
    gloss: كم حبة في وصفتك الطبية؟
    note: صيغة مهذبة تستعمل ضمير شما مع اللاحقة -تان للسؤال عن جرعة الوصفة الطبية.
