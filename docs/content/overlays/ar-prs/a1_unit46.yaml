    note: الكلمات این وآست ودر (المستخدمة في هذه الدورة كلها) كلمات للمراجعة نستخدمها للحديث عن الصيدلية.
    target_text: این (هذا) / است (يكون) / در (في)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: الصيدلية
    gloss: صيدلية
    note: معنى دواخانه حرفيًا «بيت الدواء»، وهي مبنية بالطريقة نفسها مثل کتابخانه («بيت الكتب»، أي المكتبة، الوحدة 43).
