teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: اسأل عن اسم شخص بأدب
    gloss: ما اسمك؟
    note: نام‌تان چیست؟ هي الصيغة المحترمة لشخص بالغ تتعرف عليه حديثًا، وهي تتابع صيغة شما/استین التي تعلمتها في الوحدة 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: اذكر اسمك باستخدام است
    gloss: اسمي فريدون.
    note: نام من ... است هي الصيغة المكتوبة للتعريف بالاسم. وفي الحديث يقول الناس عادةً نامم ... است (نامم = نام + ‑م، أي اسمي). كلتا الصيغتين صحيحة.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: اذكر اسمك باستخدام استم
    gloss: أنا فريدون.
    note: تأتي استم مباشرةً بعد الاسم، وهي فعل الربط نفسه للمتكلم الذي مرّ في الوحدة 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: اسأل صديقًا مقربًا عن اسمه
    gloss: ما اسمك؟
    note: تستخدم صيغة الملكية غير الرسمية «-ت» في نامت چیست؟ مع الأقران أو الأصدقاء المقرّبين فقط، تمامًا مثل تو/استی في الوحدة 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: كلمة «الاسم»
    gloss: اسم
    note: نام اسم مستقل يُستخدم في السؤالين المهذّب وغير الرسمي أعلاه.
    example_gloss: ما اسمك؟
  prs.a1.unit02.lesson01.teach.register_note:
    title: ضمير الملكية المهذّب مقابل ضمير الصديق المقرّب
    gloss: «-تان» لمن تخاطبه باحترام؛ و«-ت» للصديق المقرّب.
    note: ينتقل التفريق نفسه بين مستويي الخطاب من الوحدة 1 (شما/تو) إلى لواحق الملكية المضافة إلى نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: اسأل من أين شخص ما
    gloss: من أين أنت؟
    note: شما از کجا استین؟ تحافظ على الثنائية المهذّبة شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: قل إنك من كابل
    gloss: أنا من كابل.
    note: من از کابل استم تتبع النمط «من از [مكان] استم» المستخدم مع أي مدينة.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: قل إنك من هرات
    gloss: أنا من هرات.
    note: هرات مدينة كبرى في غرب أفغانستان.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: قل إنك من مزار شريف
    gloss: أنا من مزار شريف.
    note: تُكتب مزار شریف في كلمتين، وهي مدينة كبرى في شمال أفغانستان.
  prs.a1.unit02.lesson02.teach.country:
    title: أفغانستان
    gloss: أفغانستان
    note: تُستخدم افغانستان بعد از بالطريقة نفسها التي يُستخدم بها اسم المدينة.
    example_gloss: أنا من أفغانستان.
  prs.a1.unit02.lesson02.teach.city_word:
    title: كلمة «المدينة»
    gloss: مدينة
    note: شهر تدل على المدينة بوجه عام، وتختلف عن اسم مدينة بعينها.
    example_gloss: كابل مدينة كبيرة.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: اسأل عن عمل شخص
    gloss: ما عملك؟
    note: کار شما چیست؟ تعني حرفيًا «ما عملك؟»، وهي الطريقة المعتادة للسؤال عن المهنة.
  prs.a1.unit02.lesson03.teach.doctor:
    title: الطبيب
    gloss: طبيب
    note: داکتر هي الكلمة الدارجة في الدرية للطبيب، وتُستخدم أيضًا بشكل غير رسمي لحامل شهادة الدكتوراه.
    example_gloss: هو/هي طبيب/طبيبة.
  prs.a1.unit02.lesson03.teach.teacher:
    title: معلّم
    gloss: معلم
    note: معلم كلمة عامة تدل على المعلّم في أي مرحلة دراسية.
    example_gloss: هو/هي معلّم/معلّمة.
  prs.a1.unit02.lesson03.teach.engineer:
    title: مهندس
    gloss: مهندس
    note: مهندس تشمل المهندسين عمومًا، دون تخصص هندسي بعينه.
    example_gloss: هو/هي مهندس/مهندسة.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: البائع
    gloss: البائع
    note: دوکاندار (من دوکان أي المحل) هي الكلمة اليومية في كابل؛ وتستخدم هذه الدورة الصيغة الدرية دوکان بدل مغازه الإيرانية.
    example_gloss: هو/هي صاحب/صاحبة محل.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: اذكر مهنتك
    gloss: أنا معلمة.
    note: من [مهنة] استم هو النمط المستخدم مع أي مهنة وردت في هذا الدرس.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: قدّم شخصًا بشكل رسمي
    gloss: اسمح لي أن أقدّم زميلي.
    note: اجازه بدهین همکارم را معرفی کنم عبارة محترمة لإدخال شخص ثالث في الحديث.
  prs.a1.unit02.lesson04.teach.this_is:
    title: اذكر اسم الشخص الذي تقدّمه
    gloss: هذه زميلتي آرزو.
    note: این [شخص] است تذكر مباشرةً من يجري تقديمه.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: قل إنك سعيد بلقاء شخص
    gloss: تشرفت بمعرفتك.
    note: از آشنایی با شما خوش شدم هي عبارة اللقاء الأول نفسها من الوحدة 1، وتُستخدم هنا بعد تقديم شخص ثالث.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: أجب بأنك سعيد أيضًا
    gloss: وأنا سعيد أيضًا.
    note: من هم خوش شدم هو الرد القصير الطبيعي.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: صديق
    gloss: صديق
    note: دوست كلمة عامة تعني الصديق دون تحديد درجة القرب.
    example_gloss: هو/هي صديقي.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: زميل
    gloss: زميل
    note: همکار تعني من يعمل معك، وقد مرّت في حوار مكان العمل في الوحدة 1.
    example_gloss: هو/هي زميلي.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: السيد / حضرة
    gloss: السيد / حضرة
    note: تسبق جناب اسم الرجل أو لقبه كصيغة خطاب محترمة، وهي شائعة في الاستخدام الحضري اليومي في أفغانستان.
    example_gloss: تفضّل يا سيدي.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: السيدة / الآنسة
    gloss: السيدة / الآنسة
    note: تسبق خانم اسم المرأة، وتُستخدم بغضّ النظر عن حالتها الاجتماعية.
    example_gloss: تفضّلي يا سيدتي.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: خاطب رجلًا باحترام
    gloss: السيد فريدون
    note: جناب مع الاسم الأول صيغة خطاب مهذّبة شائعة، ولا تستلزم اسم العائلة.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: خاطب امرأة باحترام
    gloss: السيدة آرزو
    note: خانم مع الاسم الأول تعمل بالطريقة نفسها التي يعمل بها جناب مع الرجل.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: متى نستخدم كل مستوى من الخطاب
    gloss: استخدم شما واستین مع من تعرّفت إليه للتو؛ واستخدم تو واستی مع الصديق المقرّب فقط.
    note: هذا تذكير مباشر بقاعدة مستويي الخطاب في الوحدة 1، في سياق التعارف.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: اطلب بأدب من شخص أن يكرر اسمه
    gloss: هل يمكنك أن تقول اسمك مرة أخرى؟
    note: می‌توانین نام‌تان را دوباره بگویین؟ طريقة مهذّبة وطبيعية لطلب الإعادة دون إحراج.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: حفلة / لقاء اجتماعي
    gloss: لقاء اجتماعي
    note: مهمانی تدل على لقاء اجتماعي غير رسمي، وهي مكان حوار هذا الدرس.
    example_gloss: اللقاء الاجتماعي جميل.
  prs.a1.unit02.lesson06.teach.turn01:
    title: ليلى تبدأ التعارف
    gloss: ليلى تحيّي فريدون وتسأله عن اسمه، وتخاطبه باحترام بكلمة جناب.
    note: ليلى وفريدون لم يلتقيا من قبل، لذلك تستخدم مستوى الخطاب المحترم منذ البداية.
  prs.a1.unit02.lesson06.teach.turn02:
    title: فريدون يذكر اسمه
    gloss: فريدون يردّ التحية ويذكر اسمه.
    note: سلام علیکم هي التحية الأكمل من الوحدة 1، وتناسب اللقاء الأول. وفي الحديث يقول فريدون نامم فریدون است (نامم = نام من أي اسمي)، وهي الصيغة المحكية اليومية.
  prs.a1.unit02.lesson06.teach.turn03:
    title: ليلى تسأل من أين هو
    gloss: ليلى تقول إنها سعيدة بلقائه وتسأله من أين هو.
    note: عبارة از آشنایی با شما خوش شدم نفسها انتقلت من حوار مكان العمل في الوحدة 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: فريدون يجيب ويعيد السؤال
    gloss: فريدون يقول إنه من هرات ويسأل ليلى السؤال نفسه.
    note: و شما؟ طريقة موجزة لإعادة السؤال، كما رأينا في الوحدة 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: ليلى تجيب وتسأل عن العمل
    gloss: ليلى تقول إنها من كابل وتسأل فريدون عن مهنته.
    note: ينتقل الحديث بشكل طبيعي من الأصل إلى المهنة.
  prs.a1.unit02.lesson06.teach.turn06:
    title: فريدون يجيب ويعيد السؤال
    gloss: فريدون يقول إنه مهندس ويسأل ليلى السؤال نفسه.
    note: شما چطور؟ طريقة قصيرة لإعادة سؤال مفهوم من السياق.
  prs.a1.unit02.lesson06.teach.turn07:
    title: ليلى تذكر مهنتها
    gloss: ليلى تقول إنها معلّمة.
    note: يكتمل تبادل المهن بالنمط الذي تعلمناه سابقًا في الوحدة.
  prs.a1.unit02.lesson06.teach.turn08:
    title: فريدون يقدّم شخصًا ثالثًا
    gloss: فريدون يقدّم زميلته آرزو.
    note: يُدخل هذا مشاركًا ثالثًا في الحديث بعبارة التقديم الرسمية من الدرس الرابع.
  prs.a1.unit02.lesson06.teach.turn09:
    title: ليلى ترحّب بآرزو
    gloss: ليلى ترحّب بآرزو وتخاطبها باحترام بكلمة خانم.
    note: خوش آمدین عبارة الترحيب من الوحدة 1، وتُوجَّه هنا إلى شخص جرى تقديمه للتو.
  prs.a1.unit02.lesson06.teach.turn10:
    title: آرزو تردّ
    gloss: آرزو تشكر ليلى وتقول إنها سعيدة برؤيتها.
    note: از دیدن شما خوشحال شدم صيغة طبيعية بديلة لعبارة «سررت بلقائك»، تستخدم دیدن (الرؤية) بدل آشنایی.
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: أي عبارة تسأل عن اسم شخص بأدب؟
    correct_option: ما اسمك؟ (بأدب)
    distractors:
    - ما اسمك؟ (بشكل غير رسمي)
    - ما عملك؟
    - من أين أنت؟
    accepted_answers:
    - value: ما اسمك؟ (بأدب)
      status: correct
    feedback: نام‌تان چیست؟ هي الصيغة المحترمة لمن تتعرّف إليه للتو.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: يناسب سؤال نامت چیست؟ أن تسأله...
    correct_option: صديقًا مقرّبًا
    distractors:
    - شخصًا غريبًا تعرّفت إليه للتو
    - شخصًا كبيرًا في السن في مناسبة رسمية
    - زبونًا في محلك
    accepted_answers:
    - value: صديقًا مقرّبًا
      status: correct
    feedback: لاحقة الملكية غير الرسمية «-ت» في نامت تناسب الصديق المقرّب أو القرين فقط، وهي القاعدة نفسها لـ تو/استی في الوحدة 1.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: ماذا يعني هذا السؤال؟
    correct_option: ما اسمك؟
    distractors:
    - ما هي مهنتك؟
    - من أين أنت؟
    - وأنت؟
    accepted_answers:
    - value: ما اسمك؟
      status: correct
    feedback: نام‌تان چیست؟ تسأل عن اسمك.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: طابق كل عبارة مع معناها.
    accepted_answers:
    - value:
        نام‌تان چیست؟: ما اسمك؟ (بصيغة مهذبة)
        نامت چیست؟: ما اسمك؟ (بصيغة غير رسمية)
        نام: اسم
      status: correct
    feedback: نام‌تان و نامت يختلفان في درجة الرسمية فقط، لا في المعنى.
    pairs:
    - left: نام‌تان چیست؟
      right: ما اسمك؟ (بصيغة مهذبة)
    - left: نامت چیست؟
      right: ما اسمك؟ (بصيغة غير رسمية)
    - left: نام
      right: اسم
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: 'رتّب الكلمات لتقول: اسمي فريدون.'
    accepted_answers:
    - value:
      - نام
      - من
      - فریدون
      - است
      status: correct
    feedback: نام من فریدون است تتبع نمط الاسم ثم است.
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
    instruction: 'ترجم إلى الدرية: اسمي فريدون.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: 'نام من فریدون است تعني: اسمي فريدون.'
  prs.a1.unit02.lesson01.exercise07.translate_own_name:
    instruction: 'ترجم إلى الدرية: اسمي فريدون.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: كلتا الجملتين نام من فریدون است و فریدون استم تذكران الاسم بشكل صحيح؛ والنمط نفسه يصلح لأي اسم.
  prs.a1.unit02.lesson01.exercise08.speak_name_exchange:
    instruction: أجب بصوت عالٍ عن نام‌تان چیست؟ قائلًا إن اسمك فريدون.
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: كِلا النمطين جواب صحيح عن السؤال؛ والنمط نفسه يصلح لأي اسم.
  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: أي عبارة تسأل عن مكان أصل الشخص؟
    correct_option: من أين أنت؟
    distractors:
    - ما هي مهنتك؟
    - ما اسمك؟
    - كيف حالك؟ (بصيغة مهذبة)
    accepted_answers:
    - value: من أين أنت؟
      status: correct
    feedback: شما از کجا استین؟ تسأل عن الأصل، باستخدام از (من) وکجا (أين).
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: أي مما يلي مدينة في أفغانستان؟
    correct_option: هرات
    distractors:
    - افغانستان
    - شهر
    - کار
    accepted_answers:
    - value: هرات
