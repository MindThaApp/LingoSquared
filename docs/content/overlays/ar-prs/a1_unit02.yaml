course:
  title: الدرية A1
  description: 'الدرية للمبتدئين: تبادل الأسماء، والتحدث عن مكان الأصل والمهنة، والتعريف بشخص ثالث، واستخدام ألقاب الاحترام ومستوى الخطاب الصحيح في لقاء أول.'
