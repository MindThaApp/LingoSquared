  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: استخدام
    gloss: استفاده + کردن ← أستخدم
    note: تتحد استفاده (استخدام) مع کردن (فعل، يفعل) لتكوين استفاده می‌کنم (أستخدم). وهذا نمط الفعل المركب نفسه الذي مرّ في هذه الدورة، مثل بازی می‌کنم (الوحدة 29) وورزش می‌کنم (الوحدة 29).
    target_text: استفاده (استخدام) + کردن (فعل «يفعل») = استفاده می‌کنم (أستخدم)
  prs.a1.unit30.lesson01.teach.combined_sentence:
