    example_gloss: لدي هاتف محمول.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: الحاسوب
    gloss: حاسوب
    note: کمپیوتر تعني الحاسوب، وهي كلمة دخيلة شائعة في الفارسية والدرية.
    example_gloss: الحاسوب في المكتب.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: الإنترنت
    gloss: إنترنت
    note: انترنت تعني الإنترنت، وهي كلمة دخيلة شائعة في الفارسية والدرية.
    example_gloss: الإنترنت بطيء.
  prs.a1.unit30.lesson01.teach.app_word:
