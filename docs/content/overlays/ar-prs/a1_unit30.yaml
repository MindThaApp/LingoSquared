course:
  title: الدارية A1
  description: 'الدرية الكابلية للمبتدئين: مفردات التكنولوجيا والأجهزة (الهاتف المحمول، الحاسوب، الإنترنت، التطبيق، الصورة)، وعبارات استخدام الهاتف (إرسال رسالة، الاتصال، التقاط صورة، تنزيل تطبيق)، والسؤال عن عدد مرات استخدام الهاتف المحمول في اليوم والإجابة عنه، وحوار بين زرمينه وهمايون عن استخدام الهاتف والحاسوب والإنترنت.'
