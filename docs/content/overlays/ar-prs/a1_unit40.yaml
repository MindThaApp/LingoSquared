teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'مراجعة: مساعدة، أريد'
    gloss: مساعدة / أريد
    note: كلمتا کمک و می‌خواهم للمراجعة، وتُستخدمان في هذه الوحدة لبيان نوع المساعدة المطلوبة.
    target_text: کمک (مساعدة) / می‌خواهم (أريد)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'مراجعة: هذا، يكون'
    gloss: هذا / يكون
    note: كلمتا این و است من الكلمات الأولى للمراجعة، وتُستخدمان للتعبير عن نوع الموقف.
    target_text: این (هذا) / است (يكون)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: طوارئ
    gloss: طوارئ
    note: اضطراری تعني طارئ/عاجل.
    example_gloss: هذه حالة طارئة.
  prs.a1.unit40.lesson01.teach.police_word:
    title: الشرطة
    gloss: الشرطة
    note: پولیس هي الكلمة الأفغانية الدارجة للشرطة، وهي مأخوذة من الكلمة الأجنبية «police».
    example_gloss: أحتاج إلى الشرطة.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: الإسعاف
    gloss: سيارة إسعاف
    note: امبولانس تعني سيارة إسعاف.
    example_gloss: أحتاج إلى سيارة إسعاف.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: حريق
    gloss: حريق
    note: آتش تعني نار/حريق.
    example_gloss: هناك حريق.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: الإطفاء
    gloss: الإطفاء
    note: اطفائیه هي الكلمة اليومية في كابل لإدارة الإطفاء.
    example_gloss: أحتاج إلى الإطفاء.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: هذه حالة طارئة! أحتاج إلى الشرطة!
    gloss: هذه حالة طارئة! أحتاج إلى الشرطة!
    note: این اضطراری است تجمع این (هذا) مع اضطراری (طارئ) و است (يكون).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'مراجعة: هل تستطيع، افعل (أمر مهذب)، إلى/لـ، بسرعة'
    gloss: هل تستطيع / افعل / إلى/لـ / بسرعة
    note: الكلمات می‌توانین وکنین وبه وزود (من وحدات سابقة) تتركب مع كلمات أخرى لتكوين طلبات وأوامر مهذبة.
    target_text: می‌توانین (هل تستطيع) / کنین (افعل -- أمر مهذب) / به (إلى/لـ) / زود (بسرعة)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: أنا (مفعول به)
    gloss: إياي
    note: 'مه ره صيغة محكية في دارية كابل تقابل مرا («إياي» أو «ني» مفعولًا به): مه صيغة محكية من من، و ره صيغة محكية من علامة المفعول به را. في الكتابة سترى غالبًا مرا، وهي مقبولة أيضًا.'
    example_gloss: هل يمكنك مساعدتي؟
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: هل تستطيع مساعدتي؟
    gloss: هل تستطيع مساعدتي؟
    note: عبارة دارية حقيقية شائعة الاستعمال لطلب المساعدة مباشرة.
  prs.a1.unit40.lesson02.teach.call_word:
    title: اتصل! (أمر)
    gloss: اتصل
    note: 'زنگ بزنین صيغة الأمر المهذبة من زنگ زدن (الاتصال/الرنّ)، وهي تبني على ما تعلمته سابقًا: زنگ می‌زنم (أتصل).'
    example_gloss: اتصلوا بالشرطة!
  prs.a1.unit40.lesson02.teach.come_word:
    title: تعال! (أمر)
    gloss: تعال
    note: بیایین صيغة الأمر المهذبة من آمدن (المجيء).
    example_gloss: تعالوا بسرعة!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: اتصلوا بالإسعاف!
    gloss: اتصلوا بالإسعاف!
    note: به (إلى/لـ) + امبولانس (سيارة إسعاف) + فعل الأمر زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'مراجعة: هو/هي، لديه/لديها'
    gloss: هو/هي / لديه/لديها
    note: او و دارد صيغتان للمراجعة تُستخدمان لوصف حال شخص آخر في حالة طارئة.
    target_text: او (هو/هي) / دارد (لديه/لديها)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: مصاب
    gloss: مصاب
    note: زخمی تعني مصاب/جريح.
    example_gloss: هو/هي مصاب/مصابة.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: نزيف
    gloss: نزيف
    note: خون‌ریزی تعني نزيف.
    example_gloss: هو/هي ينزف/تنزف.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: هو/هي مصاب/مصابة! أحتاج إلى سيارة إسعاف!
    gloss: هو/هي مصاب/مصابة! أحتاج إلى سيارة إسعاف!
    note: تجمع زخمی مع امبولانس می‌خواهم الذي سبق تعلّمه.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: هو/هي ينزف/تنزف! تعالوا بسرعة!
    gloss: هو/هي ينزف/تنزف! تعالوا بسرعة!
    note: تجمع هذه العبارة كلمة خون‌ریزی مع العبارة التي سبق تعلّمها زود بیایین.
