    note: الكلمات چه ومی‌آید وزنگ می‌زنم وتشکر زیاد كلمات للمراجعة تُستخدم في حوار الطوارئ.
    target_text: چه (ماذا) / می‌آید (يأتي/تأتي) / زنگ می‌زنم (أتصل) / تشکر زیاد (شكرًا جزيلًا)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'همايون: زرمينة، النجدة! النجدة!'
    gloss: زرمينة، النجدة! النجدة!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'زرمينة: ماذا؟'
    gloss: ماذا؟
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'همايون: إنه مصاب! إنه ينزف!'
    gloss: إنه مصاب! إنه ينزف!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'زرمينة: أريد سيارة إسعاف. سأتصل!'
    gloss: أريد سيارة إسعاف. سأتصل!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'همايون: شكرًا جزيلًا!'
    gloss: شكرًا جزيلًا!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'زرمينة: سيارة الإسعاف تأتي بسرعة.'
    gloss: سيارة الإسعاف تأتي بسرعة.
