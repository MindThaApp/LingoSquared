course:
  title: الدرية A1
  description: 'دارية كابل للمبتدئين: تعرّف حالة طارئة بسيطة، واطلب المساعدة، وحدّد إن كنت تحتاج إلى الشرطة أو الإسعاف أو الإطفاء، وصف إصابة، واقرأ نصًّا قصيرًا عن الطوارئ.'
units:
  prs.a1.unit40.emergencies:
