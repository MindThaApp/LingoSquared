    gloss: في المدينة شخص مصاب. إنه ينزف. همايون يساعده. تأتي سيارة إسعاف.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'مراجعة: هاتف، ليس عندي، لكن، أنتم (للاحترام)'
    gloss: هاتف / ليس عندي / لكن / أنتم (للاحترام)
    note: الكلمات تلفن وندارم واما وشما كلمات للمراجعة تُستخدم للمقابلة بين الحاجة والقيد، ولطرح سؤال بصيغة الاحترام.
    target_text: تلفن (هاتف) / ندارم (ليس لدي) / اما (لكن) / شما (أنت، للمخاطب باحترام)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: أحتاج إلى مساعدة، لكن ليس عندي هاتف
    gloss: أحتاج إلى مساعدة، لكن ليس عندي هاتف.
    note: تقابل اما بين الحاجة إلى المساعدة وعدم وجود هاتف للاتصال بطلبها.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: هل يمكنك المساعدة؟
    gloss: هل يمكنكم المساعدة؟
    note: صيغة الاحترام مع شما لطلب المساعدة، وهي مناسبة للطلب المباشر المهذّب.
