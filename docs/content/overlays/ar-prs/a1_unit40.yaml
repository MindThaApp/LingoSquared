    title: 'مراجعة: واحد، شخص، مدينة، يفعل، في'
    gloss: واحد / شخص / مدينة / يفعل / في
    note: الكلمات یک ونفر وشهر ومی‌کند ودر كلمات للمراجعة تُستخدم في نص القراءة هذا.
    target_text: یک (واحد) / نفر (شخص) / شهر (مدينة) / می‌کند (يفعل/تفعل) / در (في)
  prs.a1.unit40.lesson05.teach.reading_passage:
