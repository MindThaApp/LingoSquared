  prs.a1.unit24.lesson05.teach.reading_passage:
    title: قراءة عن التنقل
    gloss: تذهب زرمينه إلى المدينة كل يوم بسيارة أجرة. سيارة الأجرة سريعة لكنها ليست رخيصة. أما همايون فيذهب سيرًا على الأقدام لأن بيته قريب. وهو يدّخر المال لشراء سيارة.
    note: نص قراءة قصير يراجع مفردات الوحدة وأداة الربط «چون» (لأنّ).
