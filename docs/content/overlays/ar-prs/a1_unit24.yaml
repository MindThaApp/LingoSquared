  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'همايون: أذهب سيرًا، فهي قريبة'
    gloss: 'همايون: أذهب سيرًا على الأقدام فهي قريبة. وأنتِ، كيف تذهبين؟'
    note: نزدیک تعني قريب، وهي جديدة في هذا السطر.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'زرمينه: أذهب بسيارة أجرة، فهي مباشرة وسريعة'
    gloss: 'زرمينه: أذهب بسيارة أجرة، فهي مباشرة وسريعة.'
    note: تیز تعني سريع، وهي جديدة في هذا السطر.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'همايون: الحافلة جيدة أيضًا، فهي رخيصة'
