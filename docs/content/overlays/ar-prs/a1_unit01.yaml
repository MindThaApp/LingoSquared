course:
  title: الدارية A1
  description: دَرِي أفغاني للمبتدئين، يركّز على قراءة الخط الفارسي العربي، وفهم الكلام الأفغاني اليومي، وتبادل التحيات المطوّلة، والتعامل باحترام في أول لقاء داخل مكان عمل في كابل.
units:
  prs.a1.unit01.greetings:
    title: التحيات واللقاءات الأولى
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: اقرأ الحروف المستخدمة في هذه الوحدة
  prs.a1.unit01.lesson02.everyday_greetings:
    title: تبادل التحيات اليومية
  prs.a1.unit01.lesson03.time_and_farewells:
    title: حيِّ وودِّع في أوقات مختلفة من اليوم
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: استخدم الحديث القصير المهذب وغير الرسمي
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: اسأل عن الأسرة وأظهر الاحترام للضيوف
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: ابدأ يومك الأول في مكان عمل في كابل
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: الحروف ا، ب، ت و د
    gloss: ا (a/ā)، ب (b)، ت (t)، و د (d)
    note: تُكتب الدرية من اليمين إلى اليسار. الحرف د لا يتصل بما بعده من جهة اليسار.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: الحرفان ر و ز
    gloss: ر (r) و ز (z)
    note: لا يتصل أي من الحرفين بالحرف الذي يليه.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: الحروف س، ش و ص
    gloss: س (s)، ش (sh)، ص (s)
    note: يُنطق الحرفان س و ص كصوت السين في الدرية العادية، أما ش فتُنطق شينًا.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: الحروف ج، چ، ح و خ
    gloss: ج (j)، چ (ch)، ح (h)، خ (kh)
    note: الحرف چ يُنطق «تش» (ch). والحرف خ هو الصوت المكتوب عادةً بالحروف اللاتينية kh، أي كالخاء العربية.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: الحروف ع، غ، ف و ق
    gloss: ع (ʿ)، غ (gh)، ف (f)، ق (q)
    note: يختلف النطق الدقيق للحرفين غ و ق بين المتحدثين بالدرية؛ فحافظ على التمييز بينهما في الكتابة.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: الحروف ک، گ، ل و م
    gloss: ک (k)، گ (g)، ل (l)، م (m)
    note: الحرف ک هو الكاف الفارسية، وهو الشكل المستعمل للكاف في الدرية. والحرفان ل و م يتصلان بما قبلهما وما بعدهما.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: الحروف ن، و، ه و ی
    gloss: ن (n)، و (w/v/o/u)، ه (h)، ی (y/ī)
    note: الحرف ی هو الياء الفارسية، ويُستعمل للياء الساكنة وللحركة الطويلة ee. أما و فقد يكون حرفًا صامتًا (w/v) أو حركة طويلة (o/oo).
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: اقرأ كلمة متصلة الحروف
    gloss: مرحبًا
    note: تتصل الحروف لتكوّن كلمة سلام. وتُحذف الحركات القصيرة عادةً في الكتابة.
    example_gloss: مرحبًا! أنا كريم.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: تحية يومية محترمة
    gloss: السلام عليكم / مرحبًا
    note: عبارة سلام علیکم شائعة في أفغانستان، وتناسب اللقاءات المألوفة والمحترمة على السواء.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: ردّ التحية
    gloss: وعليكم السلام
    note: يُردّ بعبارة وعلیکم سلام على سلام علیکم عادةً. وتُقبل أيضًا الصيغ التي تتضمن السلام.
  prs.a1.unit01.lesson02.teach.salam:
    title: تحية قصيرة
    gloss: مرحبًا
    note: كلمة سلام تحية أقصر ومرنة الاستعمال.
    example_gloss: مرحبًا، كيف حالكم؟
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: أهلًا وسهلًا
    gloss: أهلًا وسهلًا
    note: عبارة خوش آمدین ترحيب منطوق محترم، يُقال لشخص واحد أو لعدة أشخاص.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: شكرًا
    gloss: شكرًا
    note: كلمة تشکر هي الصيغة الدرية الأفغانية المفضلة في هذه الدورة. أما ممنون وممنونم فصيغتان ثانويتان مفهومتان.
    example_gloss: شكرًا جزيلًا.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: ردّ رسمي على الشكر
    gloss: عفوًا / على الرحب والسعة
    note: عبارة خواهش می‌کنم ردّ مهذب مشترك بين اللهجات الفارسية. ولا تُقدَّم على أنها عامية أفغانية خاصة.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: الوداع
    gloss: مع السلامة
    note: عبارة خدا حافظ وداع أفغاني دري معتاد، وتُكتب غالبًا في كلمتين.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: تحية الصباح
    gloss: صباح الخير
    note: تُستعمل عبارة صبح بخیر في الصباح.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: تحية النهار
    gloss: نهارك سعيد
    note: عبارة روز بخیر تحية مهذبة في النهار.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: تحية آخر النهار
    gloss: مساء الخير
    note: تناسب عبارة عصر بخیر الجزء المتأخر من اليوم.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: عبارة خاصة بالليل
    gloss: تصبح على خير
    note: عبارة شب بخیر تُقال عادةً لإنهاء المساء، لا لبدء لقاء نهاري عادي.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: وداع مهذب في النهار
    gloss: أتمنى لك يومًا سعيدًا
    note: عبارة روز خوش وداع مهذب ورسمي نوعًا ما ومشترك بين اللهجات الفارسية، وليست صيغة عامية أفغانية خاصة.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: إلى اللقاء القادم
    gloss: إلى اللقاء
    note: عبارة به امید دیدار وداع دافئ ومحترم في آن واحد.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: اسأل بأدب عن حال شخص
    gloss: كيف حالك؟
    note: استین صيغة منطوقة مهذبة شائعة في الدرية الأفغانية تُستعمل مع شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: اسأل زميلًا أو صديقًا مقرّبًا
    gloss: كيف حالك؟
    note: تو و استی للمفرد غير الرسمي؛ فلا تستعمل هذا التركيب تلقائيًا مع شخص أكبر سنًا أو مع من تتعرّف إليه حديثًا.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: قل إنك بخير
    gloss: أنا بخير، شكرًا.
    note: استم تعني «أنا». وهذه الصيغة الدرية الأفغانية المنطوقة المستعملة في هذه الدورة كلها.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: قل إنك بصحة جيدة أو بخير
    gloss: أنا بخير.
    note: تحمل كلمة جور معنى العافية وحسن الحال، وهي كثيرة الاستعمال في التحيات الأفغانية.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: جواب متحفظ
    gloss: لا بأس بحالي.
    note: عبارة بد نیستم جواب محايد.
  prs.a1.unit01.lesson04.teach.and_you:
    title: أعِد السؤال
    gloss: وأنت؟
    note: عبارة و شما؟ تُبقي الحديث محترمًا وموجزًا.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: أطِل التحية
    gloss: هل الجميع بخير؟
    note: قد تستمر تحيات الأفغان بالسؤال عن أهل البيت قبل البدء بالعمل.
  prs.a1.unit01.lesson05.teach.family_well:
    title: اسأل عن أسرة الشخص
    gloss: هل أسرتكم بخير؟
    note: 'السؤال عن الأسرة جزء شائع من التحية الأفغانية المطوّلة. وتكتب الدورة صيغة الملكية هكذا: فامیل‌تان.'
  prs.a1.unit01.lesson05.teach.household_well:
    title: اسأل عن أهل البيت
    gloss: هل أهل البيت جميعًا بخير؟
    note: عبارة اهل خانه تشير إلى أفراد الأسرة في البيت جميعًا.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: أجب عن السؤال عن الأسرة
    gloss: الحمد لله، الجميع بخير.
    note: كلمة شکر هنا اختصار لعبارة شكر وحمد، وليست كلمة «السكر» بمعناها الغذائي.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: قدّم ردًّا دافئًا ومهذبًا
    gloss: عشتم طويلًا / شكرًا لكم.
    note: عبارة زنده باشین صيغة مجاملة أفغانية شائعة، تُقال غالبًا ردًّا على الشكر أو الكلام الطيب. وباشین هي الصيغة المنطوقة المحترمة للمخاطب.
  prs.a1.unit01.lesson05.teach.own_home:
    title: رحّب بالضيف بحرارة
    gloss: هذا بيتكم.
    note: عبارة خانهٔ خودتان است تطمئن الضيف بأنه مرحَّب به.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: اعرض المكان المُكرَّم
    gloss: تفضّلوا إلى صدر المجلس.
    note: في غرفة الضيوف، تدعو عبارة بالا بفرمایین الضيف إلى المكان الأكثر تكريمًا بعيدًا عن المدخل. ولا تعني بالضرورة الطابق العلوي.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: حيِّ الكبار أولًا
    gloss: نحيّي الكبار أولًا.
    note: تحية الكبار أولًا تعبّر عن الاحترام. أما التحية بالمصافحة أو اللمس فتتوقف على العلاقة والجنس وإشارات كل شخص؛ فلا ينبغي للمتعلم أن يفترض أن المصافحة مناسبة.
  prs.a1.unit01.lesson06.teach.daftar:
    title: مكتب
    gloss: مكتب
    note: كلمة دفتر تدل على مكتب أو مكان عمل.
    example_gloss: مكتبي في كابل.
  prs.a1.unit01.lesson06.teach.kabul:
    title: كابل
    gloss: كابل
    note: كابل هي عاصمة أفغانستان، وهي مكان أحداث هذا الحوار.
    example_gloss: أسكن في كابل.
  prs.a1.unit01.lesson06.teach.line01:
    title: حامد يعرّف بنفسه زميلًا جديدًا
    gloss: يقول حامد إنه الزميل الجديد.
    note: المتحدثان زميلان بالغان يلتقيان في مكتب في كابل.
  prs.a1.unit01.lesson06.teach.line02:
    title: نجيب يرحّب به ويسأله عن اسمه
    gloss: نجیب يرحّب به ويسأله عن اسمه.
    note: «خوش آمدین» عبارة ترحيب مهذّبة في الدارية المحكية، تصلح للتوجّه إلى شخص واحد أو إلى عدة أشخاص.
  prs.a1.unit01.lesson06.teach.line03:
    title: حامد يذكر اسمه
    gloss: حامد يذكر اسمه.
    note: «نامم حامد است» (اسمي حامد) هي الصيغة المحكية الشائعة؛ و«نامم» هي «نام» + «-م» (ياء المتكلم). وفي الكتابة سترى أيضًا «نام من حامد است». وكلتاهما صحيحة.
  prs.a1.unit01.lesson06.teach.line04:
    title: نجيب يعرّف بنفسه ويقول إنه سعيد بلقائه
    gloss: نجيب يعرّف بنفسه ويقول إنه سعيد بلقائه.
    note: عبارة «از آشنایی با شما خوش شدم» تشير صراحةً إلى التعارف، لذا تناسب اللقاء الأول.
  prs.a1.unit01.lesson06.teach.line05:
    title: حامد يبادله الشعور نفسه ويسأل نجيبًا عن حاله
    gloss: حامد يبادله الشعور نفسه ويسأل نجيبًا عن حاله.
    note: يحافظ الحوار على صيغة الاحترام «شما» و«استین» بين زميلين جديدين.
  prs.a1.unit01.lesson06.teach.line06:
    title: نجيب يجيب
    gloss: نجيب يقول إنه بخير، شكرًا.
    note: «جور استم، تشکر» جواب عن السؤال عن الحال، كما تعلّمنا سابقًا في هذه الوحدة.
  prs.a1.unit01.lesson06.teach.line07:
    title: نجيب يسأل عن أسرة حامد
    gloss: نجيب يسأل عن أسرة حامد.
    note: السؤال عن أهل البيت يطيل التحية قبل أن ينتقلا إلى العمل.
  prs.a1.unit01.lesson06.teach.line08:
    title: حامد يقول إن الجميع بخير
    gloss: حامد يقول إن الجميع بخير.
    note: «شکر، همه جور استند» جواب عن السؤال عن الأسرة، كما تعلّمنا سابقًا في هذه الوحدة.
  prs.a1.unit01.lesson06.teach.line09:
    title: نجيب يعرض أن يعرّفه بباقي الزملاء
    gloss: نجيب يعرض أن يعرّفه بباقي الزملاء.
    note: «بفرمایین» هنا تدعو حامدًا إلى مرافقته، لا إلى الجلوس أو تناول شيء.
  prs.a1.unit01.lesson06.teach.line10:
    title: حامد يوافق شاكرًا
    gloss: حامد يوافق شاكرًا.
    note: تظهر «بسیار خوب» هنا بوصفها جوابًا واضحًا بالموافقة.
  prs.a1.unit01.lesson06.teach.line11:
    title: نجيب يرد بودّ ويُري حامدًا مكتبه
    gloss: نجيب يرد بودّ ويُري حامدًا مكتبه.
    note: ينتهي الحوار ببدء يوم العمل، لا بتكرار عبارات وداع الزيارة المنزلية.
  prs.a1.unit01.lesson06.teach.line12:
    title: حامد يشكره
    gloss: حامد يشكره.
    note: «تشکر» تختم الحوار ببساطة.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: بأي حرف تبدأ كلمة سلام؟
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: تبدأ «سلام» بحرف س. يختبر هذا السؤال إملاء الكلمة التي تعلمناها، لا الحروف التي قد تمثّل صوت السين.
