teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: ألو (في الهاتف)
    gloss: ألو (على الهاتف)
    note: تُستخدم الو تحديداً للرد على المكالمة الهاتفية أو افتتاحها، وتختلف عن سلام التي تُقال عند اللقاء المباشر.
    example_gloss: ألو، معك كريم.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: دعوة المتصل إلى المتابعة
    gloss: نعم، تفضّل.
    note: بلی، بفرمایین هي الطريقة الطبيعية للرد بعد رفع السماعة، وتستخدم بفرمایین المهذبة («تفضّل») نفسها التي مرّت في هذه الدورة، وليست ترجمة حرفية لعبارة «أنا أستمع».
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: الهاتف (مراجعة)
    gloss: هاتف
    note: وردت كلمة تلفن في وحدة الأعداد، وهي هنا محور هذه الوحدة كلها.
    example_gloss: هاتفي معطّل.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: السؤال عن هوية المتصل
    gloss: عفواً، من المتحدث؟
    note: ببخشین، کی صحبت می‌کند؟ سؤال مهذب عن هوية المتصل.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: التعريف بنفسك
    gloss: معك فريد.
    note: من فرید استم تذكر مباشرة من المتصل، وتستخدم نمط استم نفسه الذي مرّ في الوحدات السابقة.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: بيان صلتك بالشخص المتصَل به
    gloss: أنا زميل همايون.
    note: همکار همایون استم يوضّح سبب اتصالك، وهو مفيد حين لا يعرفك من يردّ.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: طلب التكلّم ببطء
    gloss: تحدّث ببطء من فضلك.
    note: لطفاً آهسته صحبت کنین طلب مهذب وطبيعي عندما يكون الاتصال ضعيفاً أو عندما تكون متعلماً للغة.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: طلب الإعادة (مراجعة)
    gloss: هل يمكنك أن تعيد ما قلته؟
    note: مرّت عبارة می‌توانین دوباره بگویین؟ في وحدة التعارف، وتصلح للمكالمة الهاتفية بالطبيعية نفسها.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: الجمع بين الطلبين
    gloss: تكلّم ببطء من فضلك وأعد ما قلت.
    note: يربط الحرف و بين الطلبين في عبارة واحدة طبيعية.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: الرسالة
    gloss: رسالة
    note: پیام هي الكلمة العامة للرسالة، سواء كانت شفهية أو مكتوبة.
    example_gloss: لدي رسالة لك.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: قول إنك تريد ترك رسالة
    gloss: أريد أن أترك رسالة.
    note: می‌خواهم یک پیام بگذارم عبارة تقولها حين لا يكون الشخص الذي تتصل به متاحاً.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: قول إنك ستتصل لاحقاً
    gloss: سأتصل لاحقاً.
    note: بعد زنگ می‌زنم بديل بسيط عن ترك رسالة.
  prs.a1.unit07.lesson05.teach.short_message:
    title: رسالة نصية
    gloss: رسالة نصية (رسالة قصيرة)
    note: پیام کوتاه تعني حرفياً «رسالة قصيرة»، وهي التسمية اليومية للرسالة النصية.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: رسالة نموذجية
    gloss: غداً الاجتماع في الساعة التاسعة.
    note: فردا جلسه ساعت نه است معلومة كاملة وطبيعية يمكن نقلها في رسالة.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: تأكيد أنك ستوصل الرسالة
    gloss: سأوصلها.
    note: می‌رسانم تؤكد أن الرسالة ستصل إلى المرسَل إليه.
  prs.a1.unit07.lesson06.teach.turn01:
    title: ليما تردّ على الهاتف
    gloss: ترد ليما بتحية الهاتف.
    note: الو؟ هي الطريقة المعتادة للرد على مكالمة واردة.
  prs.a1.unit07.lesson06.teach.turn02:
    title: فريد يحييها ويتأكد من هويتها
    gloss: يحييها فريد ويسأل إن كانت ليما.
    note: الو، سلام تجمع بين تحية الهاتف والتحية اليومية.
  prs.a1.unit07.lesson06.teach.turn03:
    title: ليما تدعوه إلى المتابعة وتسأل من المتصل
    gloss: تدعوه ليما إلى المتابعة وتسأل من المتصل.
    note: العبارتان بلی، بفرمایین وکی صحبت می‌کند؟ مرّتا في الدرسين الأول والثاني.
  prs.a1.unit07.lesson06.teach.turn04:
    title: فريد يعرّف بنفسه
    gloss: يقول فريد إنه زميل همايون.
    note: يعيد هذا نمط ذكر الصلة الذي مرّ في الدرس الثاني، ويمنح ليما سبباً للثقة بالمكالمة.
  prs.a1.unit07.lesson06.teach.turn05:
    title: ليما تطلب منه التكلّم ببطء
    gloss: تحيي ليما فريداً وتطلب منه التكلّم ببطء.
    note: آهسته صحبت کنین، لطفاً تعيد الطلب الذي مرّ في الدرس الثالث.
  prs.a1.unit07.lesson06.teach.turn06:
    title: فريد يوافق ويطلب ترك رسالة
    gloss: يوافق فريد ويقول إنه يريد ترك رسالة لهمايون.
    note: يوسّع هذا نمط پیام في الدرس الرابع بذكر المستلم (برای همایون، أي «لهمايون»).
  prs.a1.unit07.lesson06.teach.turn07:
    title: ليما توافق على تدوينها
    gloss: تدعوه ليما إلى المتابعة وتقول إنها تكتب.
    note: بفرمایین هنا تدعو فريداً إلى متابعة الكلام.
  prs.a1.unit07.lesson06.teach.turn08:
    title: فريد يذكر مضمون الرسالة
    gloss: يطلب فريد منها أن تقول إن الاجتماع غداً في الساعة التاسعة.
    note: يعيد هذا مضمون الرسالة النموذجية من الدرس الخامس مباشرة.
  prs.a1.unit07.lesson06.teach.turn09:
    title: ليما تؤكد وتعد بإيصالها
    gloss: تؤكد ليما التفاصيل وتقول إنها ستوصل الرسالة.
    note: می‌رسانم تُنهي جزء تلقّي الرسالة من المكالمة، كما في الدرس الخامس.
  prs.a1.unit07.lesson06.teach.turn10:
    title: فريد يشكرها ويودّعها
    gloss: يشكرها فريد جزيل الشكر ويودّعها.
    note: تشکر زیاد وخدا حافظ كلتاهما من مفردات الوحدات السابقة.
  prs.a1.unit07.lesson06.teach.turn11:
    title: ليما تودّعه
    gloss: تودّعه ليما.
    note: خدا حافظ تُنهي المكالمة.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: قول إن أحداً ترك رسالة (الزمن الماضي)
    gloss: ترك فريد رسالة.
    note: گذاشت هو الماضي البسيط («ترك») من الفعل الذي ورد في می‌خواهم یک پیام بگذارم في الدرس الرابع، حيث تعني بگذارم «أترك». استخدمه لتلخيص ما حدث بعد المكالمة.
    target_text: فرید پیام گذاشت (ترك فريد رسالة)
