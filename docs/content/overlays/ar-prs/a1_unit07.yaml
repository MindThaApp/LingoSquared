course:
  title: الدرية A1
  description: 'دارية أفغانية للمبتدئين: الرد على الهاتف، والتعريف بنفسك في المكالمة، وطلب الإعادة أو التكلّم ببطء، وترك رسالة، والرسائل النصية الأساسية.'
