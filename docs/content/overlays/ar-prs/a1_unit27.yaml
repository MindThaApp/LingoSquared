    title: قراءة عن المظهر
    gloss: كريم طويل القامة. شعره أسود وعيناه بنيتان. ليس لديه لحية، لكن لديه نظارات.
    note: نص قراءة قصير يلخّص كلمات المظهر في الوحدة، ويقدّم اسم الشخصية کریم (كريم، وهي شخصية سبق ظهورها في وحدة المقارنات) و ندارد (ليس لديه، صيغة النفي للغائب من دارد).
