  description: 'دارية كابل للمبتدئين: مفردات المظهر الخارجي (طويل، قصير، شعر، عيون، لحية، نظارات)، والسؤال عن شكل شخص ما بعبارة قیافه‌اش چطور است؟، ولون الشعر والعينين (رنگ مو/رنگ چشم)، وحوار بين زرمينه وهمايون عن التعرّف على شخص من مظهره.'
