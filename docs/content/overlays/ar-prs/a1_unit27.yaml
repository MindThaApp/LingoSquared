    gloss: أخ / أخوك (بصيغة غير رسمية)
    note: برادر (أخ) مراجعة من الوحدة 3؛ وبرادرت تضيف لاحقة الملكية غير الرسمية ‌ت («ـك»)، بما يتوافق مع مستوى المخاطبة غير الرسمية تو الذي سبق تقديمه.
    target_text: برادر (أخ) / برادرت (أخوك، بصيغة غير رسمية)
