  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'همايون: زرمينه، كيف يبدو شكل أخيكِ؟'
    gloss: 'همايون: زرمينه، كيف يبدو شكل أخيكِ؟'
