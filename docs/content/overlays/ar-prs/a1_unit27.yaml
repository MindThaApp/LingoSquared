teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: طويل
    gloss: طويل
    note: قد بلند تعني حرفيًا «قامة طويلة» -- قد (قامة) + بلند (طويل).
    example_gloss: هو طويل القامة.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: قصير
    gloss: قصير
    note: قد کوتاه تعني حرفيًا «قامة قصيرة» -- قد (قامة، مراجعة) + کوتاه (قصير).
    example_gloss: هو قصير القامة.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: الشعر
    gloss: شعر
    note: مو تعني الشعر؛ أما موی فهي الكلمة نفسها في صيغة الإضافة، وتُستعمل قبل كلمة أخرى (مثل موی سیاه، «شعر أسود»).
    example_gloss: شعره أسود.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: عين
    gloss: عين
    note: چشم تعني العين (تُستعمل بصيغة المفرد عند وصف لون العينين، وهذا هو النمط الطبيعي في الاستعمال اليومي).
    example_gloss: عيناه سوداوان.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: اللحية
    gloss: لحية
    note: ریش تعني اللحية.
    example_gloss: لديه لحية.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: نظارة
    gloss: نظارة
    note: عینک تعني النظارات.
    example_gloss: لديه نظارات.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: هو / هي (فعل الكينونة) / عنده / عندها
    gloss: يكون / يملك (للغائب)
    note: است (يكون) و دارد (يملك، للغائب) كلتاهما مراجعة لما سبق في الدورة، وتُستعملان في هذه الوحدة لوصف مظهر شخص ما.
    target_text: است (يكون) / دارد (يملك، للغائب)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: المظهر / الهيئة
    gloss: المظهر / الهيئة
    note: قیافه تعني هيئة الشخص أو مظهره (مثل خوش قیافه، «حسن المظهر»).
    example_gloss: مظهره جيد.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: كيف
    gloss: كيف
    note: چطور تعني «كيف» (سبق تقديمها في الدورة، في تحيات مثل چطور استین؟).
    target_text: چطور (كيف)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: مظهره/مظهرها
    gloss: مظهره/مظهرها
    note: قیافه‌اش تجمع قیافه (مظهر) مع لاحقة الملكية ‌اش («ـه/ـها»).
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: كيف يبدو شكله (شكلها)؟
    gloss: كيف يبدو شكله؟
    note: قیافه‌اش چطور است؟ هي الطريقة الطبيعية للسؤال عن شكل شخص ما، وليس چطور است؟ وحدها، لأنها بمفردها تُفهم على أنها «كيف حاله؟» (تحية السؤال عن الصحة والأحوال).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: هو طويل القامة
    gloss: هو طويل القامة.
    note: تجمع او (هو/هي، مراجعة) مع قد بلند است من هذه الوحدة.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: لديه شعر أسود
    gloss: لديه شعر أسود.
    note: تجمع موی (شعر) مع سیاه (أسود) و دارد (يملك).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: لديه لحية
    gloss: لديه لحية.
    note: تستعمل ریش دارد، وهو نمط الملكية نفسه كما في الشعر الأسود أعلاه.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: لون
    gloss: لون
    note: رنگ تعني اللون (سبق تقديمها في الدورة، في الوحدة 21 عن الملابس).
    target_text: رنگ (لون)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: أزرق
    gloss: أزرق
    note: آبی تعني أزرق.
    example_gloss: عيناه زرقاوان.
  prs.a1.unit27.lesson03.teach.brown_word:
