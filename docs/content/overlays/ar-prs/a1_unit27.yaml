    title: لكنّ
    gloss: لكن
    note: اما تعني «لكن» (وردت سابقًا في هذه الوحدة، في نص القراءة من الدرس الخامس؛ وهي أيضًا مراجعة لوحدات سابقة).
    target_text: اما (لكن)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: أنا / عندي
    gloss: أنا / أملك
    note: استم (أنا) و دارم (أملك) كلتاهما مراجعة لما سبق في الدورة، وتُستعملان هنا لوصف مظهر المتكلم نفسه.
    target_text: استم (أنا) / دارم (أملك)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: أنا قصير القامة، لكن شعري أسود
    gloss: أنا قصير القامة، لكن شعري أسود.
    note: تجمع حقيقتين عن المظهر باستعمال اما.
