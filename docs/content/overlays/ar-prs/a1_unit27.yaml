    gloss: لون العين
    note: رنگ چشم تعني حرفيًا «لون عين» -- رنگ (لون) + چشم (عين).
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: لون الشعر
    gloss: لون الشعر
    note: رنگ مو تعني حرفيًا «لون شعر» -- رنگ (لون) + مو (شعر).
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
