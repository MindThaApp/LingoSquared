  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'زرمينه: هو طويل القامة وشعره أسود'
    gloss: 'زرمينه: هو طويل القامة وشعره أسود.'
    note: تجمع صفتين بحرف و (العطف).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'همايون: هل لديه لحية؟'
    gloss: 'همايون: هل لديه لحية؟'
    note: سؤال إجابته نعم أو لا يتكوّن ببساطة برفع نبرة الصوت عند ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'زرمينه: نعم، لديه لحية ولديه نظارات أيضًا'
    gloss: 'زرمينه: نعم، لديه لحية ولديه نظارات أيضًا.'
    note: تطبّق هم (أيضًا) على صفة ثانية.
