teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: خبز
    gloss: خبز
    note: الخبز عنصر أساسي في كل وجبة أفغانية.
    example_gloss: الخبز طازج.
  prs.a1.unit08.lesson01.teach.palaw:
    title: أرز بلو
    gloss: أرز بلو
    note: «پلو» طبق الأرز الأفغاني، له توابل مميزة ويُطبخ غالبًا مع اللحم أو الجزر أو الزبيب، وليس مجرد أرز عادي.
    example_gloss: الأرز بلو لذيذ.
  prs.a1.unit08.lesson01.teach.qorma:
    title: يخنة اللحم والخضار
    gloss: يخنة اللحم والخضار
    note: «قورمه» اسم عام لطبق يخنة اللحم والخضار المطبوخ، ويُقدَّم عادة مع «پلو».
    example_gloss: آكل اليخنة مع أرز بلو.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: الشاي (مراجعة)
    gloss: شاي
    note: الشاي هو المشروب الذي يُقدَّم عادة في أي مكان تقريبًا في أفغانستان.
    example_gloss: شايًا واحدًا، من فضلك.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: الماء
    gloss: ماء
    note: آب هي الكلمة المعتادة للماء.
    example_gloss: كأس ماء، من فضلك.
  prs.a1.unit08.lesson01.teach.va_word:
    title: و
    gloss: و
    note: «و» أداة الربط الشائعة التي تُستخدم للعطف بين أسماء الأطعمة في القائمة.
    target_text: و (حرف العطف)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: اطلب شايًا بأدب
    gloss: أودّ شايًا.
    note: «یک چای می‌خواهم» طريقة مهذبة ومحايدة للطلب، تستخدم «می‌خواهم» (أريد) مباشرةً بدل صيغة أكثر التفافًا.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: من فضلك
    gloss: من فضلك
    note: يمكن إضافة لطفاً لتلطيف أي طلب تقريبًا.
    example_gloss: ساعدونا من فضلكم.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: اطلب خبزًا بأدب
    gloss: أريد رغيف خبز.
    note: ينطبق النمط نفسه «یک [الشيء] می‌خواهم» على أي اسم طعام أو شراب.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: اسأل عمّا هو متوفر
    gloss: ماذا لديكم؟
    note: «چی دارین؟» هي الطريقة الطبيعية لسؤال صاحب المحل أو النادل عن الأطعمة المتوفرة.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: أجب بما هو متوفر
    gloss: لدينا أرز بلو وقورمة.
    note: تستخدم «پلو و قورمه داریم» الفعل «داریم» (لدينا)، وهو صيغة المتكلمين من «دارم». يتكلم صاحب المحل بصيغة الجمع نيابةً عن المحل كله.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: طازج
    gloss: طازج
    note: تصف «تازه» الطعام المُحضَّر حديثًا.
    example_gloss: هذا الخبز طازج.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: طبق من الأرز بلو
    gloss: طبق من الأرز بلو
    note: بشقاب (طبق) هي كلمة العدّ للطعام الذي يُقدَّم في طبق.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: رغيفا خبز
    gloss: رغيفا خبز
    note: «تا» كلمة عدّ عامة توضع بعد العدد مع معظم الأشياء المعدودة، وتعني هنا قطعتين من الخبز.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: اجمع طلبًا كاملًا
    gloss: طبق أرز بلو ورغيفا خبز، من فضلك.
    note: يمكن ربط عدة عبارات للكمّيات بـ و (and) في طلب واحد.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: الفاتورة
    gloss: الفاتورة / الحساب
    note: «بل» هي الكلمة اليومية الشائعة في أفغانستان لفاتورة المطعم.
    example_gloss: الحساب من فضلك.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: اسأل عن مبلغ الفاتورة
    gloss: كم الحساب؟
    note: «بل چند می‌شه؟» تعني حرفيًا «الفاتورة تصبح كم؟»، وهي الطريقة اليومية الطبيعية للسؤال عن المجموع. «می‌شه» هي الصيغة المحكية من «می‌شود»؛ وهي ما ستسمعه في المحلات، بينما تُكتب «می‌شود» في الكتابة.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: قل إن الطعام كان لذيذًا
    gloss: كان لذيذًا جدًا.
    note: «خیلی خوش‌مزه بود» مجاملة طبيعية تُقال بعد الوجبة.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: المقهى الشعبي
    gloss: مقهى شاي / مطعم بسيط
    note: «چایخانه» نوع شائع ويومي من المطاعم البسيطة في أفغانستان، خاصةً في كابل، يقدم الشاي ووجبات بسيطة.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: أهلًا وسهلًا (مراجعة)
    gloss: أهلًا وسهلًا
    note: سبق تقديم «خوش آمدین» في وحدة التحيات، وتُستخدم هنا كتحية من صاحب المحل.
  prs.a1.unit08.lesson06.teach.turn01:
    title: البائع يرحّب بالزبون
    gloss: يرحب صاحب المحل بالزبون ويسأله عمّا يرغب به.
    note: «چی میل دارین؟» سؤال افتتاحي مهذب، يشبه «چی دارین؟» في وظيفته لكنه ينطلق من رغبة الزبون.
  prs.a1.unit08.lesson06.teach.turn02:
    title: الزبون يسأل عمّا هو متوفر
    gloss: يُحيّي الزبون صاحب المحل ويسأله عمّا هو متوفر.
    note: «چی دارین؟» تفتتح حوار الطلب، من الدرس الثالث.
  prs.a1.unit08.lesson06.teach.turn03:
    title: صاحب المحل يعدّد المتوفر
    gloss: يقول صاحب المحل إن لديهم أرز بلو وقورمة، وكلاهما طازج.
    note: «هردو» (كلاهما) تؤكد طزاجة الطبقين المذكورين.
  prs.a1.unit08.lesson06.teach.turn04:
    title: الزبون يقدّم طلبًا كاملًا
    gloss: يوافق الزبون ويطلب طبق أرز بلو مع القورمة، إضافةً إلى شاي.
    note: يجمع هذا بين نمط الكمية من الدرس الرابع ومفردات الطعام من الدرس الأول.
  prs.a1.unit08.lesson06.teach.turn05:
    title: صاحب المحل يؤكد الطلب
    gloss: يقول صاحب المحل إنه سيحضر الطلب حالًا.
    note: «چشم» تعني حرفيًا «على عيني»، وهي طريقة محترمة للقول «حاضر». «می‌آرم» هي الصيغة المحكية من «می‌آورم» (أحضر)، و«همین حالا» تعني «الآن حالًا».
  prs.a1.unit08.lesson06.teach.turn06:
    title: الزبون يمدح الطعام ويطلب الفاتورة
    gloss: الزبون يقول إن الطعام كان لذيذًا ويطلب الفاتورة.
    note: كلتا العبارتين تعيدان مباشرةً استخدام مفردات الدرس 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: صاحب المحل يذكر المبلغ الإجمالي
    gloss: يشكرهم صاحب المحل ويقول إن الحساب مئتا أفغاني.
    note: «افغانی» هو عملة أفغانستان؛ وتُركَّب «دوصد» (مئتان) مع اسم العملة للتعبير عن السعر.
