    gloss: أحبّ اللون الأحمر، لكنني لا أحبّ اللون الأسود.
    note: تُستخدم «اما» للمقابلة بين حبّ لون وعدم حبّ لون آخر، مع «دوست دارم» و«دوست ندارم» معًا.
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: أيّ لون تُحبّون؟
    gloss: أيّ لون تُحبّون؟
    note: تُضاف «شما» (أنتم، للمخاطب المحترم) إلى السؤال نفسه الذي ورد في الدرسين 3 و4، ويوجَّه الآن مباشرة إلى المتعلّم.
