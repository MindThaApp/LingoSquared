teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: السبت والأحد
    gloss: السبت، الأحد
    note: شنبه (السبت) هو أول أيام الأسبوع في أفغانستان، ويليه یکشنبه (الأحد).
    example_gloss:
    - اليوم هو السبت.
    - غدًا الأحد.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: الاثنين والثلاثاء
    gloss: الاثنين، الثلاثاء
    note: دوشنبه وسه‌شنبه تعنيان حرفيًا «اليوم الثاني» و«اليوم الثالث» بعد شنبه.
    example_gloss:
    - عندي درس يوم الاثنين.
    - عندي موعد يوم الثلاثاء.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: الأربعاء والخميس
    gloss: الأربعاء، الخميس
    note: 'چهارشنبه وپنجشنبه تتبعان النمط نفسه: «اليوم الرابع» و«اليوم الخامس».'
    example_gloss:
    - أعمل يوم الأربعاء.
    - سأراك يوم الخميس.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: الجمعة
    gloss: الجمعة
    note: جمعه هو العطلة الأسبوعية في أفغانستان.
    example_gloss: الجمعة عطلة.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: التاريخ
    gloss: تاريخ
    note: تاریخ هي الكلمة العامة للتاريخ (تاريخ اليوم في التقويم).
    example_gloss: ما هو تاريخ اليوم؟
  prs.a1.unit09.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و هي أداة الربط الشائعة المستخدمة في هذه الوحدة.
    target_text: و (حرف العطف)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: العطلة الأسبوعية
    gloss: الجمعة هي يوم العطلة الأسبوعية.
    note: العطلة الأسبوعية الرئيسة في أفغانستان هي يوم *جمعه* (الجمعة)، وغالبًا ما يكون يوم الخميس نصف يوم عمل.
  prs.a1.unit09.lesson02.teach.hamal:
    title: حمل (الشهر الأول)
    gloss: حمل، الشهر الأول في التقويم الهجري الشمسي (نحو أواخر مارس – أبريل)
    note: حمل يبدأ به العام الشمسي الأفغاني، ويتزامن مع عيد النوروز.
    example_gloss: حمل هو الشهر الأول من السنة.
  prs.a1.unit09.lesson02.teach.sawr:
    title: ثور (الشهر الثاني)
    gloss: ثور، الشهر الثاني (نحو أبريل – مايو)
    note: ثور يأتي بعد حمل.
    example_gloss: الطقس جميل في ثور.
  prs.a1.unit09.lesson02.teach.jawza:
    title: جوزا (الشهر الثالث)
    gloss: جوزا، الشهر الثالث (نحو مايو – يونيو)
    note: جوزا يأتي بعد ثور.
    example_gloss: وُلدت في جوزا.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: تقويم أفغانستان
    gloss: تستخدم أفغانستان التقويم الهجري الشمسي.
    note: هذا هو نظام التقويم الشمسي نفسه المستخدم في إيران، وهو يختلف عن التقويم الميلادي وعن التقويم الهجري القمري.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: اسأل عن اليوم
    gloss: أيّ يوم اليوم؟
    note: امروز چند شنبه است؟ تعني حرفيًا «اليوم كم شنبه؟»، وهي الطريقة الطبيعية للسؤال عن يوم الأسبوع.
  prs.a1.unit09.lesson03.teach.today_word:
    title: اليوم
    gloss: اليوم
    note: امروز تدل على اليوم الحالي.
    example_gloss: ما تاريخ اليوم؟
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: قول تاريخ كامل
    gloss: اليوم الخميس، الخامس عشر من حمل.
    note: امروز پنجشنبه، پانزدهم حمل است تجمع بين يوم الأسبوع ورقم اليوم من الشهر واسم الشهر.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: اسأل في أي يوم يقع حدث ما
    gloss: في أيّ يوم الاجتماع؟
    note: جلسه کدام روز است؟ تستخدم کدام (أي) للسؤال عن يوم حدث ما.
  prs.a1.unit09.lesson05.teach.which_date:
    title: اسأل عن تاريخ محدد
    gloss: ما تاريخ يوم الاثنين من شهر حمل؟
    note: دوشنبه چندم حمل است؟ سؤال عن رقم اليوم من الشهر الذي يقع فيه يوم الاثنين.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: التاسع عشر
    gloss: التاسع عشر
    note: '*نوزدهم* صيغة الترتيب للعدد تسعة عشر، وتتبع نمط الترتيب نفسه في *پانزدهم* (الخامس عشر).'
    example_gloss: اليوم هو التاسع عشر.
  prs.a1.unit09.lesson06.teach.turn01:
    title: همايون يسأل عن يوم الاجتماع
    gloss: 'همايون يسأل بشير: في أي يوم الاجتماع؟'
    note: جلسه کدام روز است؟ من الدرس الخامس.
  prs.a1.unit09.lesson06.teach.turn02:
    title: بشير يجيب
    gloss: بشير يقول إنه يظن أنه يوم الاثنين.
    note: فکر می‌کنم (أظن) تخفف الجواب لأنه غير متأكد تمامًا.
  prs.a1.unit09.lesson06.teach.turn03:
    title: همايون يسأل عن التاريخ بالضبط
    gloss: 'همايون يسأل: ما تاريخ يوم الاثنين من شهر حمل؟'
    note: دوشنبه چندم حمل است؟ من الدرس الخامس.
  prs.a1.unit09.lesson06.teach.turn04:
    title: بشير يذكر التاريخ بدقة
    gloss: يقول بشير إن يوم الاثنين هو التاسع عشر من الحمل.
    note: '*دوشنبه نوزدهم حمل است* تجمع اليوم والتاريخ الترتيبي والشهر، وفق النمط الذي ورد في الدرس الرابع.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: همايون يسأل عن يوم الجمعة
    gloss: يوافق همايون ويسأل بشيرًا إن كان متفرغًا يوم الجمعة.
    note: وقت داری؟ (هل لديك وقت؟) طريقة طبيعية للسؤال عن التفرغ.
  prs.a1.unit09.lesson06.teach.turn06:
    title: بشير يقول إنه مشغول
    gloss: يقول بشير لا، إنه مشغول يوم الجمعة.
    note: مصروف استم (أنا مشغول) تشرح سبب عدم مناسبة يوم الجمعة.
  prs.a1.unit09.lesson06.teach.turn07:
    title: همايون يؤكد يوم الاثنين
    gloss: يقول همايون إنه لا مشكلة، وسيرى بشيرًا يوم الاثنين.
    note: مشکل نیست (لا مشكلة) تخفف من أثر تعارض المواعيد قبل تأكيد الموعد الأصلي يوم الاثنين.
