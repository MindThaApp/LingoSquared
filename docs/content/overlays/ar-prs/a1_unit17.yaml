    gloss: كثيرًا
    note: زیاد تعني «كثيرًا» أو «كثير».
    example_gloss: اشرب كثيرًا من الماء.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: اشربوا (بصيغة مهذّبة)
    gloss: اشرب (أمر مهذب)
    note: بنوشین هي صيغة الأمر المهذبة من الفعل نوشیدن (شرب).
    target_text: بنوشین (اشرب — أمر مهذب)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: ملاحظة صحية
    gloss: استرح. اشرب كثيرًا من الماء.
    note: ملاحظة قصيرة تتضمن نصيحتين صحيتين أساسيتين.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: مرحبًا
    gloss: مرحبًا
    note: سلام تعني «مرحبًا».
    example_gloss: مرحبًا. أنا مريض.
  prs.a1.unit17.lesson05.teach.and_word:
    title: و
    gloss: و
    note: و تعني «و» وتربط بين عنصرين أو جملتين.
    target_text: و (و)
  prs.a1.unit17.lesson05.teach.message_text:
    title: رسالة صحية قصيرة
    gloss: مرحبًا. أنا مريض. عندي صداع وحمى.
    note: رسالة قصيرة بضمير المتكلم تصف عرضين.
  prs.a1.unit17.lesson06.teach.names:
    title: بشير والطبيب
    gloss: بشير، الطبيب
    note: بشير شخصية متكررة في هذه الدورة؛ ويُخاطَب الطبيب بلقب الاحترام صاحب.
    example_gloss:
    - أنا بشير.
    - أنا الطبيب.
  prs.a1.unit17.lesson06.teach.how_word:
