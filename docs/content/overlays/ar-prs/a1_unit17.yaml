    target_text: استین (أنت — بصيغة مهذبة)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: شكرًا
    gloss: شكرًا
    note: تشکر تعني «شكرًا».
    example_gloss: شكرًا يا دكتور.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: سيدي
    gloss: سيدي
    note: صاحب لقب احترام يأتي بعد الاسم أو اللقب؛ فـ داکتر صاحب تعني «يا دكتور» على سبيل الاحترام، وهو استخدام أفغاني أصيل.
    example_gloss: شكرًا يا دكتور.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: الطبيب يحيّي بشير
    gloss: مرحبًا. كيف حالك؟
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: بشير يجيب
    gloss: مرحبًا. أنا مريض. عندي صداع وحمى.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: الطبيب ينصح
    gloss: استرح. اشرب كثيرًا من الماء.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: بشير يشكر الطبيب
    gloss: شكرًا يا دكتور.
