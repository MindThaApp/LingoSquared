    example_gloss: أعاني من صداع.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: الحمّى
    gloss: حمّى
    note: «تب» تعني حمّى.
    example_gloss: عندي حمّى.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: ألم المعدة
    gloss: ألم في البطن
    note: «دل‌درد» كلمة مركبة من «دل» (البطن / المعدة، في الاستعمال العامي) و«درد» (ألم).
    example_gloss: عندي ألم في البطن.
  prs.a1.unit17.lesson01.teach.have_word:
    title: عندي
    gloss: عندي
    note: «دارم» هي صيغة المتكلم في المضارع من «داشتن» (أملك / يوجد عندي).
    target_text: دارم (أملك / عندي)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: مريض
    gloss: مريض
    note: «مریض» تعني مريضًا.
    example_gloss: أنا مريض.
  prs.a1.unit17.lesson02.teach.am_word:
    title: أنا
    gloss: أنا (كائن/موجود)
    note: «استم» هي صيغة المتكلم المهذبة لفعل الكينونة، بما يتوافق مع استعمال «استم / استین» في هذه الدورة.
    target_text: استم (أنا)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: كيف أشعر
    gloss: كيف أشعر / حالتي
    note: «حالم» (حال + م) تعني حرفيًا «حالتي»؛ و«حالم خوب نیست» تعني «لا أشعر بخير».
    target_text: حالم (كيف أشعر / حالتي)
  prs.a1.unit17.lesson02.teach.good_word:
    title: جيد
    gloss: جيد
    note: «خوب» تعني جيدًا أو بخير.
    example_gloss: لا أشعر بخير.
  prs.a1.unit17.lesson02.teach.not_word:
    title: ليس
    gloss: ليس
    note: «نیست» هو فعل الكينونة المنفي؛ و«خوب نیست» تعني «ليس جيدًا / ليس بخير».
    target_text: نیست (ليس)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: الطبيب
    gloss: طبيب
    note: «داکتر» هي الكتابة والنطق الأفغانيان المعتمدان لكلمة «طبيب»، وتختلف عن «دکتر» في الفارسية الإيرانية.
    example_gloss: أريد طبيبًا.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: الدواء
    gloss: دواء
    note: «دوا» تعني دواءً.
    example_gloss: أريد دواءً.
  prs.a1.unit17.lesson03.teach.want_word:
    title: أريد
    gloss: أريد
    note: «می‌خواهم» تعني «أريد».
    target_text: می‌خواهم (أريد)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: راحة
    gloss: استرح
    note: «استراحت» اسم بمعنى الراحة؛ وعند جمعها مع «کنین» تُكوّن فعل الأمر «استريحوا!».
    example_gloss: استرح.
  prs.a1.unit17.lesson04.teach.do_word:
    title: افعلوا (بصيغة مهذّبة)
    gloss: افعل (أمر مهذب)
    note: «کنین» هي صيغة الأمر المهذبة من «کردن» (يفعل)؛ و«استراحت کنین» تعني حرفيًا «افعلوا راحة»، أي «استريحوا».
    target_text: کنین (افعل — أمر مهذب)
  prs.a1.unit17.lesson04.teach.water_word:
    title: الماء
    gloss: ماء
    note: «آب» تعني ماءً.
    example_gloss: اشرب كثيرًا من الماء.
  prs.a1.unit17.lesson04.teach.a_lot_word:
