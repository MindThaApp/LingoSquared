course:
  title: الدرية A1
  description: 'الدرية الكابلية للمبتدئين: الأعراض الأساسية (الصداع، الحمى، ألم المعدة)، والتعبير عن الشعور بالتعب، وطلب طبيب أو دواء، وقراءة ملاحظة قصيرة عن تعليمات صحية ورسالة قصيرة تصف الأعراض، وحوار مع الطبيب.'
units:
