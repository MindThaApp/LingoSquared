  ar.a1.unit37.lesson05.teach.nwr_hy_aljdyda:
    title: نور درباره‌ی همه می‌شنود
    gloss: نور تازه به کافه‌ی زبان آمده است. از یوسف می‌پرسد بقیه چه جور آدم‌هایی هستند. یوسف برایش تعریف می‌کند. لیلا مهربان و صبور است؛ پرستار است. کریم بامزه است و یک دوره‌ی زبان اسپانیایی می‌رود. سارا کنجکاو است؛ دوست دارد چیزهای تازه یاد بگیرد. خود یوسف آرام است.
    note: 'یک متن کوتاه درباره‌ی گروه. در عربی صفت‌ها با شخص مطابقت دارند: لطیفة (laṭīfa) برای یک زن و مضحك (muḍḥik) برای یک مرد.'
