    example_gloss: من پیش‌بینی هوا را جستجو می‌کنم.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: فعلی با عن
    gloss: 'بعد از فعل أبحث (abḥath) حرف عن (ʿan) می‌آید: أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). ولی أستخدم (astakhdim) مفعولش را مستقیم می‌گیرد: أستخدم هاتفي.'
    note: عن (ʿan) یعنی دربارهٔ یا برای. هر فعل عربی حرف اضافهٔ خودش را دارد، پس آن‌ها را با هم یاد بگیرید.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: کریم پیش‌بینی هوا را جست‌وجو می‌کند
    gloss: کریم پیش‌بینی هوا را جست‌وجو می‌کند.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: بعد می‌رود دویدن
    gloss: بعد می‌رود دویدن.
    note: 'ثم (thumma) یعنی «بعد» و یک کلمهٔ جداست، برخلاف و. يذهب للركض (yadhhab li-r-rakḍ) یعنی «می‌رود دویدن»: ل + الركض می‌شود للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: لیلا پیشنهاد می‌دهد
    gloss: 'لیلا: شنبه ساعت ده ورزش کنیم؟'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: یوسف موافقت می‌کند
    gloss: 'یوسف: فکر خوبیه! پیش‌بینی هوا را نگاه می‌کنم.'
    note: 'فكرة جيدة (fikra jayyida): صفت جيدة مثل اسم به ة ختم می‌شود، چون هر دو مؤنث‌اند. سأبحث (sa-abḥath) آینده است: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: یوسف هوا را نگاه می‌کند
    gloss: 'یوسف: شنبه هوا آفتابیه!'
    note: الجو مشمس (al-jaww mushmis) یعنی «هوا آفتابی است»، بدون فعل «است». مشمس مذکر است تا با الجو مطابقت کند.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: کریم پیام را می‌بیند
    gloss: 'کریم: پیام را دیدم. شنبه می‌بینمت!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + یک روز
    gloss: 'إلى اللقاء (ilā al-liqāʾ، خداحافظ) را بلدید. می‌توانید روز را هم اضافه کنید: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt)، إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: الگوی خداحافظی درس سلام و احوال‌پرسی را به یک روز مشخص گسترش می‌دهد.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: چه کسی از چه استفاده می‌کند؟
    gloss: لیلا هر روز به یوسف زنگ می‌زند. او از گوشی‌اش استفاده می‌کند، نه از اپلیکیشن. یوسف در خانه کامپیوتر ندارد، ولی از اینترنت گوشی‌اش استفاده می‌کند. کریم هر صبح پیش‌بینی هوا را نگاه می‌کند. بعد می‌رود دویدن. سارا زیاد برای لیلا پیام می‌فرستد. شما هم هر روز از گوشی‌تان استفاده می‌کنید؟
    note: عادت‌های استفاده از دستگاه را در هر چهار شخصیت مقایسه می‌کند، مثل متن مقایسه‌ای درس ورزش.
    glosses:
