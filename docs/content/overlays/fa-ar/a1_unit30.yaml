  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'پیام: فرستادن و خواندن'
    gloss: رسالة (risāla) یعنی پیامی که می‌فرستید (أرسل رسالة، ursil risāla) یا می‌خوانید (أقرأ رسالة، aqraʾ risāla).
    note: این کلمهٔ جدید را به متن پیش‌بینی هوا و پیام‌هایی که مردم می‌فرستند و می‌خوانند وصل می‌کند.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: لیلا از طریق برنامه پیام می‌فرستد
    gloss: لیلا از طریق برنامه پیام می‌فرستد.
    note: 'ترسل (tursil) یعنی او (مؤنث) می‌فرستد: حرف ت (ta-) در ابتدای فعل نشانهٔ «او» (مؤنث) است. عبر (ʿabra) یعنی از طریق.'
