  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: لیلا برنامه را تأیید می‌کند
    gloss: 'لیلا: پیام را دیدم. شنبه ساعت ده توی پارک ورزش کنیم؟'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: یوسف وضع هوا را تأیید می‌کند
    gloss: 'یوسف: آره، شنبه هوا هم آفتابیه!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: برنامهٔ کریم
    gloss: 'کریم: پس من می‌دوم. بعدش فوتبال هم بازی می‌کنم.'
    note: 'سأركض (sa-arkuḍ) یعنی «خواهم دوید»: س نشانهٔ آینده است. بعد ذلك (baʿda dhālik) یعنی «بعد از آن».'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: برنامهٔ سارا
    gloss: 'سارا: من شنا را ترجیح می‌دهم، ولی من هم به پارک می‌آیم.'
    note: أفضل (ufaḍḍil) یعنی «ترجیح می‌دهم». لكنني (lākinnanī) یعنی «ولی من» و سآتي (sa-ātī) یعنی «خواهم آمد».
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: لیلا گفت‌وگو را تمام می‌کند
    gloss: 'لیلا: عالی! شنبه توی پارک می‌بینمت!'
    note: در یک جمله، هم رشتهٔ پیام‌های این درس و هم برنامهٔ درس ورزش را به پایان می‌رساند.
