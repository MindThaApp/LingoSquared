teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: حيوان (ḥayawān) یعنی حیوان و حيوان أليف (ḥayawān alīf) یعنی حیوان خانگی. أليف (alīf) صفت است و یعنی اهلی و رام، برای همین بعد از اسم می‌آید.
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم هست.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: سگ و گربه
    gloss: سگ / گربه
    example_gloss:
    - لیلا یک سگ دارد.
    - کریم یک گربه دارد.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: ماهی و پرنده
    gloss: ماهی / پرنده
    example_gloss:
    - پدربزرگ یک ماهی دارد.
    - نور یک پرنده دارد.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: حیوان خانگی دارید؟
    gloss: حیوان خانگی داری؟
    note: 'هل لديك (hal ladayka) یعنی «آیا داری؟». برای خانم هم همین‌طور نوشته می‌شود، ولی حرکت آخر کسره است: ladayki. هل (hal) سؤال بله/خیر را شروع می‌کند.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: 'ليس لدي (laysa ladayya) یعنی «ندارم»: ليس (laysa) منفی می‌کند و لدي (ladayya) یعنی «دارم».'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'نداشتن: ليس لدي'
    gloss: 'برای گفتن اینکه چیزی ندارید، از ليس لدي (laysa ladayya) استفاده کنید: ليس لدي وقت (وقت ندارم)، ليس لدي حيوان أليف (حیوان خانگی ندارم).'
    note: ليس لدي با هر اسمی به کار می‌رود و با مذکر و مؤنث بودن اسم تغییر نمی‌کند. برای «او» (مرد) ليس لديه (laysa ladayhi) و برای «او» (زن) ليس لديها (laysa ladayhā) می‌گویند.
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: بردنِ حیوان به پیاده‌روی
    gloss: حیوان را به پیاده‌روی بردن
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) یعنی «بردن حیوان به پیاده‌روی». فعل آن أخذ است، یعنی «گرفتن/بردن».
    example_gloss: من هر روز سگ را به پیاده‌روی می‌برم.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: فعل با شخص تغییر می‌کند
    gloss: 'فعل با ضمیر تغییر می‌کند: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha)، یعنی سگ را به پیاده‌روی می‌برم؛ كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha)، یعنی کریم سگش را به پیاده‌روی می‌برد.'
    note: حرف اول أ (a-) نشانه‌ی «من» و ي (ya-) نشانه‌ی «او» (مرد) است. نزهة (nuzha) یعنی پیاده‌روی یا گردش کوتاه.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به گربه غذا می‌دهم.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: کریم با گربه‌اش بازی می‌کند.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: من هر روز سگ را به پیاده‌روی می‌برم
    gloss: من هر روز سگ را به پیاده‌روی می‌برم.
    note: 'كل يوم (kull yawm) یعنی «هر روز»: كل + اسم مفرد بدون ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: من هر روز به گربه غذا می‌دهم
    gloss: من هر روز به گربه غذا می‌دهم.
    note: أطعم (uṭʿim) یعنی «غذا می‌دهم». القطة (al-qiṭṭa) مؤنث است و ال به اسم چسبیده است.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'جمع‌ها: كلب → كلاب'
    gloss: 'بسیاری از جمع‌ها بی‌قاعده‌اند، پس آن‌ها را همراه اسم یاد بگیرید: كلب (kalb) می‌شود كلاب (kilāb)، قطة (qiṭṭa) می‌شود قطط (qiṭaṭ) و طائر (ṭāʾir) می‌شود طيور (ṭuyūr).'
    note: جمع‌های عربی بیشترشان مکسرند، برای همین هر جمع را باید همراه مفردش یاد گرفت؛ جمعِ حیوان‌ها صفت مفرد مؤنث می‌گیرد.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: سگ‌ها و گربه‌ها
    gloss: سگ‌ها / گربه‌ها
    example_gloss:
    - یوسف سگ‌ها را دوست دارد.
    - سارا گربه‌ها را دوست دارد.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - پدربزرگ پرنده‌ها را خیلی دوست دارد.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: من حیوان‌ها را خیلی دوست دارم
    gloss: من حیوان‌ها را خیلی دوست دارم.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) یعنی «حیوان‌ها را دوست دارم». جمع با ات تمام می‌شود و ال به آن می‌چسبد.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: سارا گربه‌ها را دوست دارد، ولی حیوان خانگی ندارد
    gloss: سارا گربه‌ها را دوست دارد، ولی حیوان خانگی ندارد.
    note: تضادی را نشان می‌دهد که متن خواندنی‌ی این درس بر پایه‌ی آن ساخته شده است.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: یوسف درباره‌ی حیوان خانگی می‌پرسد
    gloss: 'یوسف: لیلا، تو حیوان خانگی داری؟'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: لیلا یک سگ دارد
    gloss: 'لیلا: بله، یک سگ دارم.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: یوسف می‌پرسد ظاهرش چطور است
    gloss: 'یوسف: چه شکلی است؟'
    note: كيف يبدو؟ (kayfa yabdū?) یعنی «چه شکلی است؟». يبدو (yabdū) مذکر است، چون كلب (سگ) اسم مذکر است.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: لیلا سگش را توصیف می‌کند
    gloss: 'لیلا: موهای قهوه‌ای دارد و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: ضمیرها برای حیوان‌ها
    gloss: 'هر اسم حیوان یا مذکر است یا مؤنث: سگ هو (huwa، «او» مذکر) و گربه هي (hiya، «او» مؤنث) است. ه در آخر أطعمه (uṭʿimuhu) یعنی «او را / آن را».'
    note: اسم حیوانِ مذکر مثل كلب ضمیر و صفت مذکر می‌گیرد؛ اسم مؤنث مثل قطة ضمیر و صفت مؤنث می‌گیرد.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: یوسف درباره‌ی پیاده‌روی می‌پرسد
    gloss: 'یوسف: هر روز او را به پیاده‌روی می‌بری؟'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: لیلا برنامه‌ی روزانه‌اش را توضیح می‌دهد
    gloss: 'لیلا: بله، هر روز او را به پیاده‌روی می‌برم و بهش غذا می‌دهم.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: یوسف، سارا و کریم درباره‌ی حیوان‌ها
    gloss: 'یوسف و سارا هر دو حیوان‌ها را دوست دارند، ولی هیچ‌کدامشان حیوان خانگی ندارند. یوسف سگ‌ها را دوست دارد و سارا گربه‌ها را. اما کریم حیوان خانگی دارد: یک گربه. او زیاد با گربه‌اش بازی می‌کند و هر روز به گربه غذا می‌دهد. شما حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      يحبان: خیلی دوست دارد
      كلاهما: هر دو
      الحيوانات: حیوان‌ها
      منهما: از آن‌ها (هیچ‌کدامشان)
      أليف: 'حیوان خانگی (تحت‌اللفظی: اهلی)'
      الكلاب: سگ‌ها
      القطط: گربه‌ها
      قطة: گربه
      يلعب: بازی می‌کند
      ويعطي: می‌دهد
      كل: هر
      طعاما: غذا
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: کریم زیاد با گربه‌اش بازی می‌کند
    gloss: کریم زیاد با گربه‌اش بازی می‌کند.
    note: 'قطته (qiṭṭatuhu) یعنی «گربه‌اش»: پایانه‌ی ه (hu) یعنی «اش» و ة در قطة پیش از آن به ت تبدیل می‌شود.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    note: یک پاسخ نمونه‌ی دوجمله‌ای که برای تمرین نوشتاری این درس می‌توانید از آن استفاده کنید.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: لیلی از نور می‌پرسد
    gloss: 'لیلی: نور، تو هم حیوان خانگی داری؟'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: نور یک پرنده به اسم پیکو دارد
    gloss: 'نور: آره، یک پرنده دارم. اسمش پیکوئه.'
    note: اسمه (ismuhu) یعنی «اسمش»؛ ه آخرش یعنی «او/اش». بيكو (bīkū) اسم پرنده است.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: واکنش یوسف
    gloss: 'یوسف: چه قشنگ! هر روز با او چه کار می‌کنی؟'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: نور هر روز به او غذا می‌دهد
    gloss: 'نور: هر روز بهش غذا می‌دهم.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: یوسف هم پرنده‌ها را دوست دارد
    gloss: 'یوسف: من هم پرنده‌ها را دوست دارم.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: لیلی گفت‌وگو را تمام می‌کند
    gloss: 'لیلی: چه خوب که هر سه‌تایمان حیوان‌ها را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره‌ی حیوان‌ها در این درس را کنار هم جمع‌بندی می‌کند.
