teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: کار
    gloss: کار
    note: 'عمل (ʿamal) یعنی کار. ما عملك؟ دربارهٔ کار کسی می‌پرسد؛ پایانهٔ ـك یعنی «تو/شما»: ʿamaluka برای مرد و ʿamaluki برای زن، که یک‌جور نوشته می‌شوند.'
    example_gloss: کارتان چیست؟
  ar.a1.unit18.lesson01.teach.engineer:
    title: مهندس
    gloss: مهندس
    note: مهندس (muhandis) شکل مذکر است و برای یوسف به کار می‌رود؛ یک زن می‌گوید أنا مهندسة (anā muhandisa).
    example_gloss: من مهندس هستم.
  ar.a1.unit18.lesson01.teach.office:
    title: دفتر
    gloss: دفتر (محل کار)
    note: مكتب (maktab) یعنی دفتر؛ في مكتب یعنی «در یک دفتر».
    example_gloss: من در یک دفتر کار می‌کنم.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: در یک دفتر کار می‌کنم
    gloss: در یک دفتر کار می‌کنم
    note: أعمل (aʿmal) یعنی «کار می‌کنم»؛ هم‌ریشه با عمل (کار) است و أ در ابتدا نشانهٔ «من» است.
    example_gloss: 'یوسف گفت: در یک دفتر کار می‌کنم.'
  ar.a1.unit18.lesson02.teach.write:
    title: می‌نویسم
    gloss: می‌نویسم
    note: أكتب (aktub) یعنی «می‌نویسم».
    example_gloss: سر کار می‌نویسم.
  ar.a1.unit18.lesson02.teach.read:
    title: می‌خوانم
    gloss: می‌خوانم
    note: أقرأ (aqraʾ) یعنی «می‌خوانم».
    example_gloss: سر کار می‌خوانم.
  ar.a1.unit18.lesson02.teach.at_work:
    title: سر کار
    gloss: سر کار
    note: العمل (al-ʿamal) یعنی «کار»؛ في العمل یعنی «سر کار».
    example_gloss: سر کار می‌نویسم و می‌خوانم.
  ar.a1.unit18.lesson02.teach.line01:
    title: پرسیدن از کار
    gloss: لیلا از یوسف دربارهٔ کارش می‌پرسد.
    note: يا يوسف یعنی صدا زدن یوسف با نام.
    example_gloss: 'لیلا گفت: یوسف، کارت چیست؟'
  ar.a1.unit18.lesson02.teach.line02:
    title: گفتن شغل
    gloss: یوسف می‌گوید مهندس است.
    note: برای «هستم» کلمهٔ جداگانه لازم نیست.
    example_gloss: 'یوسف گفت: من مهندس هستم.'
  ar.a1.unit18.lesson02.teach.line03:
    title: گفتن محل کار
    gloss: یوسف می‌گوید در یک دفتر کار می‌کند.
    note: أعمل في محل کار را مشخص می‌کند.
    example_gloss: 'یوسف گفت: در یک دفتر کار می‌کنم.'
  ar.a1.unit18.lesson02.teach.line04:
    title: پرسیدن از فعالیت
    gloss: لیلا می‌پرسد یوسف هر روز چه کار می‌کند.
    note: 'این همان سؤال روزمرگی است؛ تفعل برای مرد است. برای زن: ماذا تفعلين كل يوم؟'
    example_gloss: 'لیلا گفت: هر روز چه کار می‌کنی؟'
  ar.a1.unit18.lesson02.teach.line05:
    title: گفتن فعالیت
    gloss: یوسف می‌گوید سر کار می‌نویسد و می‌خواند.
    note: '«و» (wa، یعنی «و») دو فعالیت را به هم وصل می‌کند و به کلمهٔ بعدی چسبیده نوشته می‌شود: وأقرأ.'
    example_gloss: 'یوسف گفت: سر کار می‌نویسم و می‌خوانم.'
