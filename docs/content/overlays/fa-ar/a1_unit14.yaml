teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: دوست دارم
    gloss: دوست دارم
    note: أحب (uḥibbu) یعنی «دوست دارم». عربی برای چیزها به‌طور کلی از ال (حرف تعریف) استفاده می‌کند؛ پس «قهوه دوست دارم» می‌شود أحب القهوة، یعنی تحت‌اللفظی «قهوه‌ی مشخص را دوست دارم».
    example_gloss: قهوه دوست دارم.
  ar.a1.unit14.lesson01.teach.tea:
    title: چای
    gloss: چای
    note: شاي (shāy) یعنی «چای»؛ الشاي (ash-shāy) با ال می‌آید، همان‌طور که عربی هنگام صحبت دربارهٔ چای به‌طور کلی این کار را می‌کند.
    example_gloss: چای دوست ندارم.
  ar.a1.unit14.lesson01.teach.dislike:
    title: دوست ندارم
    gloss: دوست ندارم
    note: در فارسی منفی‌کردن با پیشوند «نـ» روی فعل انجام می‌شود، اما در عربی کلمهٔ جداگانهٔ لا قبل از أحب می‌آید.
    example_gloss: چای دوست ندارم.
  ar.a1.unit14.lesson01.teach.water:
    title: آب
    gloss: آب
    note: الماء (al-māʾ) همان ماء (آب، از درس غذا) با ال است که برای آب به‌طور کلی به کار می‌رود.
    example_gloss: آب دوست دارم.
  ar.a1.unit14.lesson01.teach.and_not:
    title: و نه
    gloss: و نه
    note: 'ولا (wa-lā) از و («و») و لا («نه») ساخته شده است: بعد از چیزی که دوست دارید، چیزی را که دوست ندارید اضافه می‌کند.'
    example_gloss: قهوه دوست دارم و چای دوست ندارم.
  ar.a1.unit14.lesson02.teach.prefer:
    title: ترجیح می‌دهم
    gloss: ترجیح می‌دهم
    note: 'أفضل (ufaḍḍilu) یعنی «ترجیح می‌دهم»: یک گزینه را به گزینهٔ دیگر برمی‌گزینید.'
    example_gloss: قهوه را ترجیح می‌دهم.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: کدوم را ترجیح می‌دی؟
    gloss: کدوم را ترجیح می‌دی؟
    note: تفضل در اینجا tufaḍḍil است، یعنی «ترجیح می‌دهی»، خطاب به مرد؛ برای زن تفضلين (tufaḍḍilīn) می‌شود. این کلمه با تفضل (tafaḍḍal، یعنی «بفرمایید») در درس غذا فرق دارد، هرچند یکسان نوشته می‌شود.
    example_gloss: 'نور گفت: یوسف، چه چیزی را ترجیح می‌دهی؟'
  ar.a1.unit14.lesson02.teach.line01:
    title: نور می‌پرسد
    gloss: نور از یوسف می‌پرسد چه چیزی را ترجیح می‌دهد.
    note: 'نور خواهر یوسف است. او تفضل می‌گوید چون از یک مرد می‌پرسد؛ برای زن می‌شود: ماذا تفضلين؟'
    example_gloss: 'نور گفت: یوسف، چه چیزی را ترجیح می‌دهی؟'
  ar.a1.unit14.lesson02.teach.line02:
    title: یوسف قهوه را ترجیح می‌دهد
    gloss: یوسف می‌گوید قهوه را ترجیح می‌دهد.
    note: أفضل یک گزینه را بر بقیه ترجیح می‌دهد؛ أحب فقط می‌گوید چیزی را دوست دارید.
    example_gloss: 'یوسف گفت: قهوه را ترجیح می‌دهم.'
  ar.a1.unit14.lesson02.teach.line03:
    title: یوسف چای دوست ندارد
    gloss: یوسف می‌گوید چای دوست ندارد.
    note: لا أحب به‌سادگی دوست نداشتن را بیان می‌کند.
    example_gloss: 'یوسف گفت: چای دوست ندارم.'
  ar.a1.unit14.lesson02.teach.line04:
    title: نور آب دوست دارد
    gloss: نور می‌گوید آب دوست دارد.
    note: برای تأکید می‌شود أنا را هم آورد.
    example_gloss: 'نور گفت: من آب دوست دارم.'
