  ar.a1.unit34.lesson05.teach.ywsf_yskn_fy:
    title: چه کسی کیست؟ در محله
    gloss: یوسف در یک محلهٔ قشنگ در اسکندریه زندگی می‌کند، نزدیک سوپرمارکت. سامی همسایهٔ یوسف است و مریم هم همسایهٔ (خانم) یوسف. سامی خیلی خونگرم است و هر روز به یوسف سلام می‌کند. یوسف سامی و مریم را خوب می‌شناسد.
    note: 'یک متن کوتاه دربارهٔ همسایه‌ها. جار (jār) همسایهٔ مرد است و جارة (jāra) همسایهٔ زن: پایانهٔ ة نشانهٔ مؤنث است.'
    glosses:
