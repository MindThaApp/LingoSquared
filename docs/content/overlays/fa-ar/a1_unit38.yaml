    title: نور و لیلا گل رز می‌خرند
    gloss: نور و لیلا شنبه به بازار گل می‌روند. لیلا چه رنگی می‌خواهد؟ لیلا رنگ قرمز را می‌خواهد. نور چه رنگی می‌خواهد؟ نور رنگ زرد را می‌خواهد. آن‌ها پنج گل رز می‌خرند. قیمتش ده درهم است. گل‌های رز خیلی قشنگ‌اند!
    note: 'متنی کوتاه دربارهٔ سفر به بازار. رنگ با چیزی که توصیف می‌کند مطابقت دارد: الأحمر (al-aḥmar) خودِ رنگ است، ولی الورود حمراء (al-wurūd ḥamrāʾ) برای گل‌های رز مؤنث است.'
