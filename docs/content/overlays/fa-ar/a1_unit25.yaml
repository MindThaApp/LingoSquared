teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: القراءة (al-qirāʾa) یعنی مطالعه و کتاب‌خوانی، ممارسة الرياضة (mumārasat ar-riyāḍa) یعنی ورزش کردن و الطبخ (aṭ-ṭabkh) یعنی آشپزی. هر کدام اسم است، برای همین «ال» به آن می‌چسبد.
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: وقت الفراغ (waqt al-farāgh) در اصل یعنی «زمانِ فراغت». واژهٔ اول «ال» ندارد؛ فقط واژهٔ دوم «ال» می‌گیرد.
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: أحب (uḥibb) یعنی «دوست دارم» و برای مرد و زن یکسان است. ی در آخر فراغي (farāghī) یعنی «من/م»، یعنی «فراغتِ من».
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) یعنی گوش دادن به موسیقی، الرسم (ar-rasm) یعنی نقاشی و لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) یعنی بازی کردن بازی‌های ویدیویی.
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: 'الاستماع (al-istimāʿ) قبل از چیزی که به آن گوش می‌دهید، إلى (ilā، به) می‌خواهد: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: 'مع (maʿa) یعنی «با»: مع الأصدقاء (maʿa al-aṣdiqāʾ). «ال» به الأصدقاء چسبیده می‌ماند.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: دائما (dāʾiman)، كثيرا (kathīran)، أحيانا (aḥyānan) و أبدا (abadan) قید هستند، برای همین هیچ‌وقت با مذکر و مؤنث تغییر نمی‌کنند. الف آخر (ا) بدون هیچ علامتی نوشته می‌شود.
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: كل أسبوع (kull usbūʿ) و كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) هر دو از كل (kull، «هر») استفاده می‌کنند؛ کارت بعدی را ببینید.
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: '«هر»: كل'
    gloss: 'بعد از كل (kull، «هر») اسم مفرد می‌آید و «ال» ندارد: كل أسبوع (kull usbūʿ)، كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) تغییر نمی‌کند: همین واژه هم قبل از اسم مذکر مثل أسبوع می‌آید و هم قبل از اسم مؤنث مثل عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: لیلا بحث سرگرمی‌ها را پیش می‌کشد
    gloss: 'لیلا: ما اغلب با هم پیاده‌روی می‌کنیم. ولی یوسف، در وقت آزادت دیگر چه کار می‌کنی؟'
    note: حرف اول ن (na-) در نتمشى (natamashshā) یعنی «ما»، برای همین عربی برای «ما» واژهٔ جداگانه‌ای لازم ندارد. معا (maʿan) یعنی «با هم».
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: سرگرمی‌های یوسف
    gloss: 'یوسف: من آشپزی را دوست دارم، در خانه هم. و زیاد ورزش می‌کنم.'
    note: في البيت أيضا (fī al-bayt ayḍan) یعنی «در خانه هم». وأمارس (wa-umāris) یعنی و (و) به فعل چسبیده و یک کلمه نوشته می‌شود.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: لیلا تعجب می‌کند
    gloss: 'لیلا: در خانه هم آشپزی می‌کنی؟ تو که تمام روز سر کارت آشپزی می‌کنی!'
    note: تطبخ (taṭbukh) فعلِ «تو» برای مرد است؛ برای زن می‌گویید تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) یعنی «تمام روز».
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: یوسف توضیح می‌دهد
    gloss: 'یوسف: آره، ولی برای من آشپزی آرامش‌بخش است. تو چطور؟ تو دوست داری چه کار کنی؟'
    note: 'أجد (ajid) یعنی «می‌یابم/به نظرم می‌آید» و مريحا (murīḥan) یعنی آرامش‌بخش. وأنت (wa-anta) یعنی و به أنت چسبیده: «و تو».'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: سرگرمی‌های لیلا
    gloss: 'لیلا: من کتاب‌خوانی را دوست دارم و زیاد به موسیقی گوش می‌دهم.'
    note: 'و دو سرگرمی را به هم وصل می‌کند: أحب القراءة (uḥibb al-qirāʾa) و وأستمع (wa-astamiʿ، و گوش می‌دهم). و به کلمهٔ بعدی چسبیده نوشته می‌شود.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: یوسف دربارهٔ بازی ویدیویی می‌پرسد
    gloss: 'یوسف: تو بازی ویدیویی هم می‌کنی؟'
    note: تلعبين (talʿabīn) فعلِ «تو» برای زن است، چون یوسف از لیلا می‌پرسد؛ برای مرد تلعب (talʿab) است. هل (hal) پرسش بله/نه را شروع می‌کند.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: لیلا جواب می‌دهد
    gloss: 'لیلا: نه، من هرگز بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: 'أبدا (abadan) یعنی «هرگز» و أحيانا (aḥyānan) یعنی «گاهی». فعل با لا (lā) منفی می‌شود: لا ألعب (lā alʿab) یعنی «بازی نمی‌کنم».'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و یوسف اغلب با هم پیاده‌روی می‌کنیم. ولی سرگرمی‌های دیگری هم داریم. یوسف آشپزی را دوست دارد، در خانه هم، و زیاد ورزش می‌کند. من کتاب‌خوانی را دوست دارم و زیاد به موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هرگز بازی ویدیویی نمی‌کنم. تو در وقت آزادت دوست داری چه کار کنی؟
    note: پیام لیلا مطالب درس قبل را مرور می‌کند و با پرسشِ اصلیِ این واحد به خواننده تمام می‌شود.
    glosses:
      نتمشى: قدم می‌زنیم
      كثيرا: اغلب
      معا: با هم
      أخرى: دیگر
      يطبخ: آشپزی می‌کند
      يحب: دوست دارد
      البيت: خانه (در خانه)
      ويمارس: ورزش می‌کند
      أقرأ: بخوانم
      وأستمع: گوش می‌دهم
      الموسيقى: موسیقی
      أرسم: نقاشی می‌کشم
      أحيانا: گاهی
      ألعب: بازی کردن (بازی‌های ویدیویی)
      أبدا: هرگز
      فراغك: (وقت) آزادِ شما
      وقت: وقت
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: یوسف دربارهٔ آخر هفته می‌پرسد
    gloss: 'یوسف: این آخر هفته چه کار می‌کنی؟'
    note: 'ستفعلين (sa-tafʿalīn) آینده است: حرف اول س (sa-) آن را نشان می‌دهد و پایانهٔ ين برای زن است. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) یعنی آخر هفته.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: لیلا هنوز تصمیم نگرفته
    gloss: 'لیلا: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: لا أعرف بعد (lā aʿrif baʿd) یعنی «هنوز نمی‌دانم». أن أخرج (an akhruj) یعنی «بیرون بروم».
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: یوسف یک برنامه پیشنهاد می‌دهد
    gloss: 'یوسف: با هم پیاده‌روی کنیم؟ بعدش برای ما آشپزی می‌کنم.'
    note: 'هل نتمشى (hal natamashshā) راه معمول پیشنهاد دادنِ کاری با هم است: هل + فعلِ «ما». لنا (lanā) یعنی ل («برای») + نا («ما»)، که یک کلمه نوشته می‌شود.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: لیلا موافقت می‌کند
    gloss: 'لیلا: فکر خوبی است! هم پیاده‌روی را دوست دارم و هم آشپزی را.'
    note: 'كليهما (kilayhimā) یعنی «هر دو» و آخر جمله می‌آید و به آن دو چیز اشاره دارد: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: یوسف قرار را قطعی می‌کند
    gloss: 'یوسف: عالی. پس شنبه می‌بینمت!'
    note: يوم السبت (yawm as-sabt) یعنی «روز شنبه». ل در «ال» قبل از س، که حرف خورشیدی است، تلفظ نمی‌شود، برای همین as-sabt می‌نویسیم.
