  ar.a1.unit33.lesson05.teach.bad_alhfla_ams:
    title: کی چه کاری تو خونه انجام می‌ده؟
    gloss: یوسف بعد از مهمونیِ دیشب خسته‌ست. امروز داره کارهای خونه رو انجام می‌ده. لیلا به یوسف کمک می‌کنه. یوسف آشپزخونه رو مرتب می‌کنه و لیلا سالن رو جارو برقی می‌کشه. یوسف رخت‌ها رو هم می‌شوره. لیلا و یوسف خوب با هم کار می‌کنن.
    note: یک متن کوتاه درباره‌ی کارهای خونه. دقت کنید که فعل برای یوسف با ي شروع می‌شه و برای لیلا با ت.
