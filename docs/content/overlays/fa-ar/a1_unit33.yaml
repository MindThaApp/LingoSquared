  ar.a1.unit33.lesson01.teach.alfal_yrtb_ybda:
    title: فعل «من» با أ شروع می‌شود
    gloss: 'فعل يرتب (yurattib) وقتی خودِ «من» کاری را انجام می‌دهم، می‌شود أرتب (urattib): دارم آپارتمان را مرتب می‌کنم.'
    note: 'فعل حال با اولین حرفش نشان می‌دهد چه کسی کار را انجام می‌دهد: أ برای «من»، ي برای «او (مرد)»، ت برای «او (زن)». برای همین اینجا می‌گوییم أرتب (urattib).'
