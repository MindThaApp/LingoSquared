teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: خانه
    gloss: خونه
    note: بيت (bayt) یعنی خانه؛ پایان ـي یعنی «من/م»، پس بيتي (baytī) یعنی «خانه‌ی من».
    example_gloss: خانه‌ی من نزدیک کتابخانه است.
  ar.a1.unit19.lesson01.teach.room:
    title: اتاق
    gloss: اتاق
    note: غرفة (ghurfa) مؤنث است (به ة ختم می‌شود)، پس صفت مؤنث واحدة بعد از آن می‌آید.
    example_gloss: در خانه‌ی من یک اتاق هست.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: آشپزخانه
    gloss: آشپزخانه
    note: 'مطبخ (maṭbakh) یعنی آشپزخانه. عربی اینجا کلمه‌ای برای «هست» ندارد: شروع جمله با في بيتي (در خانه‌ی من) همین کار را می‌کند.'
    example_gloss: در خانه‌ی من آشپزخانه هست.
  ar.a1.unit19.lesson01.teach.one_room:
    title: یک اتاق
    gloss: یک اتاق
    note: 'عدد «یک» بعد از اسم می‌آید و با آن مطابقت می‌کند: غرفة واحدة (ghurfa wāḥida)؛ با اسم مذکر واحد می‌شود.'
    example_gloss: در خانه‌ی من یک اتاق هست.
  ar.a1.unit19.lesson02.teach.table:
    title: میز
    gloss: میز
    note: طاولة (ṭāwila) یعنی میز؛ مثل غرفة به ة ختم می‌شود و مؤنث است.
    example_gloss: در اتاق یک میز دارم.
  ar.a1.unit19.lesson02.teach.in_room:
    title: در اتاق
    gloss: در اتاق
    note: الغرفة (al-ghurfa) یعنی «اتاق» (معرفه).
    example_gloss: میز در اتاق است.
  ar.a1.unit19.lesson02.teach.near_library:
    title: نزدیک کتابخانه
    gloss: نزدیک کتابخانه
    note: قرب (qurb) یعنی نزدیک؛ المكتبة همان کتابخانه از درس مکان‌هاست.
    example_gloss: خانه‌ی من نزدیک کتابخانه است.
  ar.a1.unit19.lesson02.teach.line01:
    title: پرسیدن «کجا»
    gloss: لیلا می‌پرسد خانه‌ی یوسف کجاست.
    note: أين یعنی «کجا»؛ بيتك (baytuka) یعنی «خانه‌ی تو» خطاب به مرد؛ خطاب به زن baytuki می‌شود که یک‌جور نوشته می‌شود.
    example_gloss: 'لیلا گفت: یوسف، خانه‌ات کجاست؟'
  ar.a1.unit19.lesson02.teach.line02:
    title: جای خانه
    gloss: یوسف می‌گوید خانه‌اش نزدیک کتابخانه است.
    note: بيتي یعنی «خانه‌ی من».
    example_gloss: 'یوسف گفت: خانه‌ی من نزدیک کتابخانه است.'
  ar.a1.unit19.lesson02.teach.line03:
    title: اتاق‌ها
    gloss: یوسف می‌گوید خانه‌اش یک اتاق و یک آشپزخانه دارد.
    note: 'و (wa، یعنی «و») دو ویژگی خانه را به هم وصل می‌کند و به کلمه‌ی بعدی می‌چسبد: ومطبخ.'
    example_gloss: 'یوسف گفت: در خانه‌ی من یک اتاق و یک آشپزخانه هست.'
  ar.a1.unit19.lesson02.teach.line04:
    title: پرسیدن درباره‌ی یک چیز
    gloss: لیلا می‌پرسد یوسف میز دارد یا نه.
    note: هل سؤال بله/خیر را شروع می‌کند؛ عندك (ʿindaka) یعنی «تو داری» خطاب به مرد؛ خطاب به زن ʿindaki می‌شود که یک‌جور نوشته می‌شود.
    example_gloss: 'لیلا گفت: میز داری؟'
  ar.a1.unit19.lesson02.teach.line05:
    title: جای یک چیز
    gloss: یوسف می‌گوید در اتاق یک میز دارد.
    note: عندي مالکیت را بیان می‌کند.
    example_gloss: 'یوسف گفت: بله، در اتاق یک میز دارم.'
