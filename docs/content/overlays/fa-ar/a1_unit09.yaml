teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: مکان
    gloss: مکان
    note: مكان (makān) واژه‌ی کلی برای مکان است. هذا (این) همراه با عددها یاد گرفتید.
    example_gloss: این یک مکان است.
  ar.a1.unit09.lesson01.teach.library:
    title: کتابخانه
    gloss: کتابخانه
    note: مكتبة (maktaba) می‌تواند هم کتابخانه باشد هم کتاب‌فروشی؛ اینجا یعنی کتابخانه. المكتبة (al-maktaba) یعنی «کتابخانه‌ی مشخص».
    example_gloss: کتابخانه اینجاست.
  ar.a1.unit09.lesson01.teach.market:
    title: بازار
    gloss: بازار
    note: سوق (sūq) یعنی بازار؛ السوق (as-sūq) یعنی «بازار مشخص».
    example_gloss: بازار اینجاست.
  ar.a1.unit09.lesson01.teach.cafe:
    title: کافه
    gloss: کافه
    note: مقهى (maqhā) یعنی کافه؛ این کلمه به قهوة (قهوه) مربوط است. المقهى (al-maqhā) یعنی «کافه» (با «ال» معرفه).
    example_gloss: کافه اینجاست.
  ar.a1.unit09.lesson01.teach.here:
    title: اینجا
    gloss: اینجا
    note: 'هنا (hunā) معمولاً بعد از مکان می‌آید: المقهى هنا، یعنی کافه اینجاست. در عربی در این جمله به فعل «است» نیازی نیست.'
    example_gloss: کافه اینجاست.
  ar.a1.unit09.lesson02.teach.where_library:
    title: کتاب‌خانه کجاست؟
    gloss: کتاب‌خانه کجاست؟
    note: أين (ayna) برای پرسیدن «کجا» است؛ آن را در من أين أنت؟ (اهل کجایید؟) دیدید.
    example_gloss: 'یوسف گفت: کتاب‌خانه کجاست؟'
  ar.a1.unit09.lesson02.teach.near:
    title: نزدیک
    gloss: نزدیکِ
    note: 'قرب (qurba) یعنی نزدیکِ و قبل از مکانی می‌آید که به آن اشاره دارد: قرب المكتبة، نزدیک کتاب‌خانه. بالقرب من (bi-l-qurbi min) هم همین معنی را دارد.'
    example_gloss: کافه نزدیک کتاب‌خانه است.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: کتاب‌خانه نزدیک بازار است
    gloss: کتاب‌خانه نزدیک بازار است
    note: در عربی اینجا به کلمه‌ی جداگانه‌ای برای «است» نیازی نیست.
    example_gloss: 'لیلا گفت: کتاب‌خانه نزدیک بازار است.'
  ar.a1.unit09.lesson02.teach.line01:
    title: پرسیدن مکان
    gloss: یوسف می‌پرسد کتاب‌خانه کجاست.
    note: أين سؤال مکان را شروع می‌کند.
    example_gloss: 'یوسف گفت: کتاب‌خانه کجاست؟'
  ar.a1.unit09.lesson02.teach.line02:
    title: مکان کتاب‌خانه را گفتن
    gloss: لیلا می‌گوید کتاب‌خانه همین‌جا نزدیک بازار است.
    note: 'هنا و قرب می‌توانند با هم بیایند: اینجا، نزدیک بازار.'
    example_gloss: 'لیلا گفت: کتاب‌خانه همین‌جا نزدیک بازار است.'
  ar.a1.unit09.lesson02.teach.line03:
    title: پرسیدن درباره‌ی کافه
    gloss: یوسف می‌پرسد کافه کجاست.
    note: 'و (wa، یعنی «و») به کلمه‌ی بعدی چسبیده نوشته می‌شود: وأين (wa-ayna)، یعنی «و کجا».'
    example_gloss: 'یوسف گفت: و کافه کجاست؟'
  ar.a1.unit09.lesson02.teach.line04:
    title: مکان کافه را گفتن
    gloss: لیلا می‌گوید کافه نزدیک کتاب‌خانه است.
    note: 'مکان + قرب + مکان دوم: المقهى قرب المكتبة، کافه نزدیک کتاب‌خانه است.'
    example_gloss: 'لیلا گفت: کافه نزدیک کتاب‌خانه است.'
