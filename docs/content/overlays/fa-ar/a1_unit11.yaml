teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: هر روز
    gloss: هر روز
    note: كل يوم (kull yawm) معمولاً بعد از فعل می‌آید (أدرس كل يوم) ولی می‌تواند اول جمله هم بیاید (كل يوم أدرس).
    example_gloss: هر روز درس می‌خوانم.
  ar.a1.unit11.lesson01.teach.wake:
    title: بیدار می‌شوم
    gloss: بیدار می‌شوم
    note: أستيقظ (astayqiẓ) یعنی «بیدار می‌شوم»؛ أ در ابتدای فعل مضارع نشانهٔ «من» است. السابعة (as-sābiʿa) در ساعت یعنی هفت.
    example_gloss: من ساعت هفت بیدار می‌شوم.
  ar.a1.unit11.lesson01.teach.study:
    title: درس می‌خوانم
    gloss: درس می‌خوانم
    note: أدرس (adrus) یعنی «درس می‌خوانم»؛ با درس هم‌ریشه است. التاسعة (at-tāsiʿa) در ساعت یعنی نه.
    example_gloss: ساعت نه درس می‌خوانم.
  ar.a1.unit11.lesson01.teach.sleep:
    title: می‌خوابم
    gloss: می‌خوابم / به رختخواب می‌روم
    note: أنام (anām) یعنی «می‌خوابم»؛ با ذکر ساعت یعنی «به رختخواب می‌روم». العاشرة (al-ʿāshira) در ساعت یعنی ده.
    example_gloss: ساعت ده می‌خوابم.
  ar.a1.unit11.lesson02.teach.what_do:
    title: هر روز چه کار می‌کنید؟
    gloss: هر روز چه کار می‌کنی؟
    note: ماذا (mādhā) یعنی «چه چیز» و تفعل (tafʿal) یعنی «انجام می‌دهی»، برای یک مرد؛ برای یک زن تفعلين (tafʿalīn) می‌شود.
    example_gloss: 'لیلا گفت: هر روز چه کار می‌کنی؟'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: سه جملهٔ روزمره
    gloss: ساعت هفت بیدار می‌شوم. ساعت نه درس می‌خوانم. ساعت ده می‌خوابم.
    note: هر جمله فعل + في الساعة + ساعت است؛ این‌ها با هم یک روز کامل را توصیف می‌کنند.
    example_gloss: هر روز ساعت هفت بیدار می‌شوم. ساعت نه درس می‌خوانم. ساعت ده می‌خوابم.
  ar.a1.unit11.lesson02.teach.line01:
    title: پرسیدن دربارهٔ برنامهٔ روزانه
    gloss: لیلا می‌پرسد یوسف هر روز چه کار می‌کند.
    note: 'لیلا تفعل می‌گوید چون از یک مرد می‌پرسد؛ برای یک زن: ماذا تفعلين كل يوم؟'
    example_gloss: 'لیلا گفت: هر روز چه کار می‌کنی؟'
  ar.a1.unit11.lesson02.teach.line02:
    title: ساعت بیدار شدن
    gloss: یوسف می‌گوید ساعت هفت بیدار می‌شود.
    note: پیش از ساعت، في الساعة بگذارید.
    example_gloss: 'یوسف گفت: ساعت هفت بیدار می‌شوم.'
  ar.a1.unit11.lesson02.teach.line03:
    title: ساعت درس خواندن
    gloss: یوسف می‌گوید ساعت نه درس می‌خواند.
    note: همین الگوی ساعت با أدرس هم کار می‌کند.
    example_gloss: 'یوسف گفت: ساعت نه درس می‌خوانم.'
  ar.a1.unit11.lesson02.teach.line04:
    title: ساعت خواب
    gloss: یوسف می‌گوید ساعت ده به رختخواب می‌رود.
    note: آخرین کارِ روز او هم با أنام همین الگوی ساعت را دارد.
    example_gloss: 'یوسف گفت: ساعت ده می‌خوابم.'
