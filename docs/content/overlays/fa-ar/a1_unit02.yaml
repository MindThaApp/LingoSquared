teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: اسم شما چیست؟
    gloss: اسم شما چیه؟
    note: ما اسمك؟ (mā ismuk) روش استاندارد پرسیدن اسم است؛ بدون اعراب، شکل نوشتاری‌اش برای هر مخاطبی کار می‌کند.
  ar.a1.unit02.lesson01.teach.ismee:
    title: اسم من ... است
    gloss: اسم من [...] است
    note: اسمي (ismī) از اسم («نام») و پسوند مالکیت ـي («من») ساخته شده است.
    example_gloss: اسم من کریم است.
  ar.a1.unit02.lesson01.teach.ana:
    title: من
    gloss: من
    note: أنا (anā) ضمیر مستقل «من» است؛ فعل‌های عربی شخص را خودشان هم نشان می‌دهند، اما أنا برای تأکید و در جمله‌های اسمی ساده‌ای مثل این به کار می‌رود.
    example_gloss: من سارا هستم.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: از آشنایی خوشحالم
    gloss: از آشنایی خوشحالم
    note: تشرفنا (tasharrafnā) که تحت‌اللفظی یعنی «ما مفتخر شدیم»، پاسخ استاندارد دوطرفه هنگام آشنایی است؛ هر یک از دو نفر می‌تواند اول بگوید.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: اهل کجایید؟
    gloss: شما اهل کجایید؟
    note: من أين أنت؟ (min ayna anta برای مرد، min ayna anti برای زن) درباره‌ی اصالت و محل اهل بودن می‌پرسد؛ املای بدون اعراب برای هر دو یکی است.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: من اهل ... هستم
    gloss: من اهل
    note: بعد از أنا من (anā min) مستقیماً نام کشور یا شهر می‌آید.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: لبنان
    gloss: لبنان
    note: لبنان (lubnān) برخلاف بیشتر کشورهای دیگر این درس، «ال» تعریف نمی‌گیرد.
    example_gloss: من اهل لبنان هستم.
  ar.a1.unit02.lesson02.teach.misr:
    title: مصر
    gloss: مصر
    note: مصر (miṣr) هم «ال» تعریف نمی‌گیرد.
    example_gloss: من اهل مصر هستم.
  ar.a1.unit02.lesson02.teach.urdun:
    title: اردن
    gloss: اردن
    note: الأردن (al-ʾurdun) همیشه «الـ» تعریف را به‌عنوان بخشی از نامش دارد، مثل المغرب و العراق در این درس.
    example_gloss: من اهل اردن هستم.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: مراکش
    gloss: مراکش
    note: المغرب (al-maghrib) در اصل یعنی «غرب» ــ همان ریشه‌ای که در نام نماز مغرب، یعنی وقت غروب، هم هست.
    example_gloss: من اهل مراکش هستم.
  ar.a1.unit02.lesson02.teach.soorya:
    title: سوریه
    gloss: سوریه
    note: سوريا (sūryā) «ال» نمی‌گیرد.
    example_gloss: من اهل سوریه هستم.
  ar.a1.unit02.lesson02.teach.iraq:
    title: عراق
    gloss: عراق
    note: العراق (al-ʿirāq) با «ال» می‌آید.
    example_gloss: من اهل عراق هستم.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: آیا اهل ... هستید؟
    gloss: شما اهل مصر هستید؟
    note: هل (hal) نشانهٔ پرسش بله/خیر است و اول جمله می‌آید؛ خودش معنای مستقلی ندارد.
  ar.a1.unit02.lesson03.teach.naam:
    title: بله
    gloss: بله
    note: نعم (naʿam) پاسخ مثبت معمول است.
    example_gloss: بله، من اهل مصر هستم.
  ar.a1.unit02.lesson03.teach.laa:
    title: نه
    gloss: نه
    note: لا (lā) پاسخ منفی معمول است.
    example_gloss: نه، من اهل لبنان هستم.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: از آشنایی با شما خوشحال شدم
    gloss: از آشنایی با شما خوشحال شدم
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) از تشرفنا گرم‌تر است و معمولاً درست قبل از خداحافظی گفته می‌شود.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: خوش آمدید
    gloss: خوش آمدید / اینجا خوش آمدید
    note: 'مرحبا بك (marḥaban bik) یک «بك» اضافه دارد به معنی «برای شما»: حرف اضافهٔ بـ با ضمیر پسوندی ـك (شما) ــ همان «بك» در أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: سلام اول گفت‌وگو
    gloss: یوسف به لیلا سلام می‌کند.
    note: گفت‌وگو قبل از معرفی اسم‌ها با یک مرحبا ساده شروع می‌شود.
  ar.a1.unit02.lesson04.teach.line02:
    title: سلام اول گفت‌وگو، پاسخ
    gloss: لیلا جواب سلام او را می‌دهد.
    note: همان کلمهٔ مرحبا برای هر دو طرف سلام و احوال‌پرسی کار می‌کند.
  ar.a1.unit02.lesson04.teach.line03:
    title: پرسیدن اسم
    gloss: یوسف اسم او را می‌پرسد.
    note: ما اسمك؟ معرفی را شروع می‌کند.
  ar.a1.unit02.lesson04.teach.line04:
    title: پرسیدن اسم، پاسخ
    gloss: لیلا جواب می‌دهد و همین سؤال را از او می‌پرسد.
    note: وأنت؟ به جای تکرار کل جمله همان سؤال را دوباره می‌پرسد؛ یک میان‌بر رایج.
  ar.a1.unit02.lesson04.teach.line05:
    title: پاسخ و ابراز خوشحالی از آشنایی
    gloss: یوسف اسمش را می‌گوید و می‌گوید از آشنایی با او خوشحال است.
    note: تشرفنا رد و بدل کردن اسم‌ها را تمام می‌کند.
  ar.a1.unit02.lesson04.teach.line06:
    title: ابراز خوشحالی از آشنایی، پاسخ
    gloss: لیلا همین عبارت را جواب می‌دهد.
    note: تشرفنا را طبیعتاً هر دو نفر می‌گویند، نه فقط یک نفر.
  ar.a1.unit02.lesson04.teach.line07:
    title: پرسیدن اهل کجا بودن
    gloss: یوسف می‌پرسد او اهل کجاست.
    note: من أين أنت؟ گفت‌وگو را به موضوع اهل کجا بودن می‌برد.
  ar.a1.unit02.lesson04.teach.line08:
    title: پرسیدن اهل کجا بودن، پاسخ
    gloss: لیلا جواب می‌دهد و همین سؤال را از او می‌پرسد.
    note: او دوباره از وأنت؟ استفاده می‌کند؛ همان میان‌بر «line04».
  ar.a1.unit02.lesson04.teach.line09:
    title: گفتن اهل کجا بودن
    gloss: یوسف می‌گوید اهل لبنان است.
    note: أنا من لبنان همان الگویی است که در «lesson02» یاد گرفتید.
  ar.a1.unit02.lesson04.teach.line10:
    title: تمام کردن گفتگو
    gloss: لیلا می‌گوید از آشنایی با او خوشحال شده است.
    note: سعدت بلقائك نشان می‌دهد گفت‌وگو طبیعتاً دارد تمام می‌شود.
  ar.a1.unit02.lesson04.teach.line11:
    title: خداحافظی
    gloss: یوسف به او می‌گوید هر وقت بخواهد خوش آمده و خداحافظی می‌کند.
    note: دائما (همیشه / هر وقت) مرحبا بك را قبل از خداحافظیِ مع السلامة به یک دعوت همیشگی تبدیل می‌کند.
  ar.a1.unit02.lesson04.teach.line12:
    title: خداحافظی، پاسخ
    gloss: لیلا خداحافظی می‌کند.
    note: مع السلامة گفت‌وگو را تمام می‌کند؛ در a1_unit01 یاد گرفتید.
