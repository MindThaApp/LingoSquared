course:
  title: عربی ۱A
  description: 'عربی مقدماتی برای توصیف ظاهر یک آدم: قد و سن، رنگ مو و چشم، سؤال كيف تبدو؟ (kayfa tabdū?) و مقایسهٔ دو نفر با أطول من (aṭwal min).'
