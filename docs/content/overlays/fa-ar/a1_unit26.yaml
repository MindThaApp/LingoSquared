teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: 'طويل (ṭawīl) یعنی «قدبلند» و قصير (qaṣīr) یعنی «کوتاه‌قد». برای زن «ة» می‌گیرند: طويلة (ṭawīla)، قصيرة (qaṣīra).'
    example_gloss:
    - سارا قدبلند است.
    - کریم کوتاه‌قد است.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: مسن و جوان
    gloss: مسن / جوان
    note: كبير في السن (kabīr fī as-sinn) و صغير في السن (ṣaghīr fī as-sinn) برداشت کلی از سن را می‌رسانند، نه تعداد دقیق سال‌ها را.
    example_gloss:
    - پدربزرگ مسنه.
    - یوسف جوان است.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'سن: یک عدد یا یک برداشت کلی'
    gloss: كم عمرك؟ (kam ʿumruka?) تعداد سال‌ها را می‌پرسد، ولی كبير في السن (kabīr fī as-sinn) فقط یک توصیف کلی بدون عدد است، مثل الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: برای پرسیدن سن دقیق کسی از كم عمرك؟ استفاده کنید. كبير في السن در اینجا فقط می‌گوید کسی چقدر مسن به نظر می‌رسد.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: سارا قدبلند است و کریم کوتاه‌قد
    gloss: سارا قدبلند است و کریم کوتاه‌قد.
    note: 'و (wa-) دو جمله را به هم وصل می‌کند و به کلمهٔ بعدی چسبیده نوشته می‌شود: وكريم (wa-karīm). صفت‌ها با موصوف مطابقت دارند: سارة طويلة مؤنث است و كريم قصير مذکر.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: مو
    gloss: مو
    note: 'الشعر (ash-shaʿr) یعنی «مو». ش حرف شمسی است، پس ل در ال تلفظ نمی‌شود: ash-shaʿr.'
    example_gloss: یوسف موهای کوتاه مشکی دارد.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: 'أشقر (ashqar)، بني (bunnī) و رمادي (ramādī) برای توصیف مو به کار می‌روند و بعد از اسم می‌آیند: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - لیلا موهای بلوند دارد.
    - کریم موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: 'طويل (ṭawīl) و قصير (qaṣīr) برای مو هم به کار می‌روند: شعر طويل (shaʿr ṭawīl)، شعر قصير (shaʿr qaṣīr). این صفت‌ها بعد از شعر می‌آیند که مذکر است.'
    example_gloss:
    - سارا موهای بلند دارد.
    - کریم موهای کوتاه دارد.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: صفت بعد از اسم می‌آید
    gloss: 'در عربی صفت بعد از اسم می‌آید و با آن مطابقت می‌کند: شعر قصير (shaʿr qaṣīr)، شعر طويل (shaʿr ṭawīl)، شعر أشقر (shaʿr ashqar)، شعر بني (shaʿr bunnī)، شعر رمادي (shaʿr ramādī)، شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) مذکر است، پس صفت‌هایش هم مذکرند. وقتی اسم نکره است، هیچ‌کدام از دو کلمه ال نمی‌گیرند.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: مو و موی او
    gloss: شعر (shaʿr) یعنی «مو». ضمیر ها (hā، «او (زن)») را به آن اضافه کنید تا شعرها (shaʿruhā، «موی او») بشود.
    note: 'پایانهٔ ها صاحب چیز را نشان می‌دهد: شعرها («موی او»)، اسمها («اسم او»)، عيناها («چشم‌های او»). این پایانه به کلمه چسبیده نوشته می‌شود.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: یوسف موهای کوتاه مشکی دارد
    gloss: یوسف موهای کوتاه مشکی دارد.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) قبل از اسم یعنی «دارد» و به اسم چسبیده نوشته می‌شود.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: لیلا موهای بلند بلوند دارد
    gloss: لیلا موهای بلند بلوند دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: چشم‌ها
    gloss: چشم‌ها
    note: 'العينان (al-ʿaynān) یعنی «چشم‌ها». این یک اسم مثنی است: عربی برای «دقیقاً دو تا» پایانهٔ ویژهٔ ان دارد.'
    example_gloss: یوسف چشم‌های قهوه‌ای دارد.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: 'أزرق (azraq) آبی، بني (bunnī) قهوه‌ای و أخضر (akhḍar) سبز شکل‌های مذکر هستند. با عينان شکل‌های مثنی به کار می‌روند: زرقاوان (zarqāwān)، بنيتان (bunnīyatān)، خضراوان (khaḍrāwān).'
    example_gloss:
    - لیلا چشم‌های آبی دارد.
    - کریم چشم‌های قهوه‌ای دارد.
    - سارا چشم‌های سبز دارد.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: چشم‌های مثنی، صفت مثنی
    gloss: 'عينان (ʿaynān) مثنی است، برای همین صفتش هم مثنی می‌شود: عينان زرقاوان (ʿaynān zarqāwān)، عينان بنيتان (ʿaynān bunnīyatān)، عينان خضراوان (ʿaynān khaḍrāwān).'
    note: در مثنی، پایانهٔ ان هم به اسم اضافه می‌شود و هم به صفت. صفت مؤنث هم هست، چون عين اسم مؤنث است.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: لیلا چه شکلی است؟
    gloss: لیلا چه شکلی است؟
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) یعنی لیلا چه شکلی است. تبدو (tabdū) مؤنث است چون لیلا زن است؛ برای مرد يبدو (yabdū) می‌گوییم.
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: لیلا موهای بلند بور و چشم‌های آبی دارد
    gloss: لیلا موهای بلند بور و چشم‌های آبی دارد.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + اسم یعنی «دارد»، و و مو و چشم را به هم وصل می‌کند.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: لیلا نور را معرفی می‌کند
    gloss: 'لیلا: یک دختر تازه به کافهٔ زبان‌ها می‌آید. اسمش نور است.'
    note: 'ستأتي (sa-taʾtī) یعنی «خواهد آمد»: س (sa-) نشانهٔ آینده است و ت (ta-) یعنی «او (مؤنث)». اسمها (ismuhā) یعنی «اسمش».'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: یوسف می‌پرسد او چه شکلی است
    gloss: 'یوسف: باشه! چه شکلی است؟'
    note: 'كيف تبدو؟ (kayfa tabdū?) این بار اسمی ندارد: فعل تبدو خودش یعنی «او (مؤنث) به نظر می‌رسد».'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: لیلا قد و موی نور را توصیف می‌کند
    gloss: 'لیلا: کوتاه‌قد است و موهای کوتاه بور دارد.'
    note: قصيرة (qaṣīra) مؤنث است چون نور زن است، ولی شعر قصير أشقر مذکر می‌ماند چون شعر اسم مذکر است.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: یوسف دربارهٔ چشم‌های او می‌پرسد
    gloss: 'یوسف: چشم‌هایش چطور؟'
    note: 'وعيناها (wa-ʿaynāhā) یعنی «و چشم‌هایش»: و (wa-) به اسم چسبیده و ها (hā) در آخر یعنی «او (مؤنث)».'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: لیلا چشم‌های نور را توصیف می‌کند
    gloss: 'لیلا: چشم‌های سبز دارد.'
    note: 'لها (lahā) یعنی «او (مؤنث) دارد»: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) اسم مثنی با صفت مثنی است.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: یوسف او را می‌شناسد
    gloss: 'یوسف: ممنون! پس می‌شناسمش.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) یعنی «او را خواهم شناخت»: س (sa-) نشانهٔ آینده است و ها در عليها یعنی «او (مؤنث)».'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: مقایسهٔ کریم و سارا
    gloss: کریم و سارا خواهر و برادرند، ولی ظاهرشان فرق دارد. کریم کوتاه‌قد است و موهای کوتاه قهوه‌ای و چشم‌های قهوه‌ای دارد. سارا از کریم قدبلندتر است و موهای بلند قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      أخ: برادر
      أخت: خواهر
      تبدو: به نظر رسیدن
      مختلفان: متفاوت
      القامة: کوتاه‌قد
      قصير: کوتاه‌قد
      بني: قهوه‌ای
      شعر: مو
      بنيتان: قهوه‌ای
      وعينان: چشم‌ها
      أطول: قدبلندتر
      طويل: بلند
      خضراوان: سبز
      المظهر: ظاهر (قیافه و شکل کسی)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: مقایسه با أفعل
    gloss: 'برای مقایسه از شکل أفعل (afʿal) + من (min) استفاده می‌کنیم: سارة أطول من كريم (sāra aṭwal min karīm)، سارا از کریم قدبلندتر است.'
    note: طويل (ṭawīl) در حالت تفضیلی أطول (aṭwal) می‌شود و من (min) یعنی «از». این شکل برای زن تغییر نمی‌کند.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: موی سارا از موی کریم بلندتر است
    gloss: موی سارا از موی کریم بلندتر است.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول مذکر می‌ماند چون شعر اسم مذکر است.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: 'لدي (ladayya) یعنی «دارم»؛ عربی فعل «داشتن» ندارد. صفت‌ها بعد از اسم می‌آیند: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: یوسف نور را می‌بیند
    gloss: 'یوسف: نگاه کن، این نور است؟ موهای کوتاه بور و چشم‌های سبز دارد.'
    note: انظري (unẓurī) امر برای یک زن است، چون یوسف با لیلا حرف می‌زند؛ برای مرد انظر (unẓur) می‌گوییم. هذه (hādhihi) یعنی «این» برای اسم مؤنث.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: لیلا تأیید می‌کند
    gloss: 'لیلا: آره، این نور است!'
    note: یک تأیید کوتاه و طبیعی.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: نور به یوسف سلام می‌کند
    gloss: 'نور: سلام، شما یوسف هستید؟'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) سؤال بله/خیر است: هل (hal) + جمله‌ای بدون فعل «بودن».'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: یوسف هم به نور سلام می‌کند
    gloss: 'یوسف: بله! از آشنایی با شما خوشوقتم، نور.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) عبارت مؤدبانه برای اولین آشنایی است. ب (bi-) به معرفتك چسبیده و ك در آخر یعنی «شما».
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: نور جواب می‌دهد
    gloss: 'نور: من هم از آشنایی با شما خوشوقتم!'
    note: گفتگو تمام می‌شود -- یوسف نور را با توصیف قبلی لیلا درست شناخت.
