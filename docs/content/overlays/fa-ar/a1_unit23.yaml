teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: تلفن
    gloss: تلفن
    note: هاتف (hātif) یعنی تلفن.
    example_gloss: این یک تلفن است.
  ar.a1.unit23.lesson01.teach.hear:
    title: صدایت را می‌شنوم
    gloss: صدایت را می‌شنوم
    note: أسمعك (asmaʿuka به مرد، asmaʿuki به زن) یعنی «صدایت را می‌شنوم»؛ لا أسمعك (lā asmaʿuk) یعنی «صدایت را نمی‌شنوم».
    example_gloss: صدایت را نمی‌شنوم.
  ar.a1.unit23.lesson01.teach.repeat:
    title: تکرار کردن
    gloss: تکرار کن
    note: 'أعد (aʿid) به مرد گفته می‌شود؛ به زن: أعيدي (aʿīdī). أعد من فضلك مؤدبانه از کسی می‌خواهد تکرار کند.'
    example_gloss: صدایت را نمی‌شنوم. لطفاً تکرار کن.
  ar.a1.unit23.lesson01.teach.slowly:
    title: آهسته صحبت کن
    gloss: آهسته صحبت کن
    note: 'تكلم ببطء (takallam bi-buṭʾ) به مرد گفته می‌شود؛ به زن: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: لطفاً آهسته صحبت کن.
  ar.a1.unit23.lesson02.teach.message:
    title: پیام
    gloss: پیام
    note: رسالة (risāla) یعنی پیام؛ می‌تواند معنی نامه هم بدهد.
    example_gloss: این یک پیام است.
  ar.a1.unit23.lesson02.teach.appointment:
    title: قرار (وقت ملاقات)
    gloss: نوبت
    note: موعد (mawʿid) یعنی قرار یا وقت ملاقات؛ الموعد (al-mawʿid) یعنی «آن قرار».
    example_gloss: قرار ساعت پنج است.
  ar.a1.unit23.lesson02.teach.line01:
    title: جواب دادن به تلفن
    gloss: یوسف پشت تلفن به لیلا سلام می‌کند و اسمش را می‌گوید.
    note: پشت تلفن، أنا يوسف (anā Yūsuf) می‌گوید چه کسی زنگ زده است.
    example_gloss: 'یوسف گفت: سلام، من یوسفم.'
  ar.a1.unit23.lesson02.teach.line02:
    title: نمی‌شنوم
    gloss: لیلا می‌گوید صدای یوسف را نمی‌شنود.
    note: این جمله زمینه‌ی درخواست توضیح را فراهم می‌کند.
    example_gloss: 'لیلا گفت: سلام یوسف، صدایت را نمی‌شنوم.'
  ar.a1.unit23.lesson02.teach.line03:
    title: خواستن صحبت آهسته
    gloss: لیلا از یوسف می‌خواهد آهسته صحبت کند.
    note: من فضلك درخواست را مؤدبانه می‌کند؛ لیلا تكلم می‌گوید چون با یک مرد حرف می‌زند.
    example_gloss: 'لیلا گفت: لطفاً آهسته صحبت کن.'
  ar.a1.unit23.lesson02.teach.line04:
    title: جزئیات مهم
    gloss: یوسف می‌گوید قرار ساعت پنج است.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) یعنی «ساعت پنج».
    example_gloss: 'یوسف گفت: قرار ساعت پنج است.'
  ar.a1.unit23.lesson02.teach.line05:
    title: درخواست تکرار
    gloss: لیلا از یوسف می‌خواهد دوباره بگوید.
    note: أعد من فضلك جمله‌ی درخواست تکرار است.
    example_gloss: 'لیلا گفت: لطفاً تکرار کنید.'
  ar.a1.unit23.lesson02.teach.line06:
    title: تکرار جزئیات
    gloss: یوسف ساعت قرار را تکرار می‌کند.
    note: جمله‌ی تکرارشده ساعت را تأیید می‌کند.
    example_gloss: 'یوسف گفت: قرار ساعت پنج است.'
