  ar.a1.unit10.lesson02.teach.walk:
    title: برو
    gloss: راه برو
    note: امش (imshi) امر «برو!» برای مخاطب مرد است؛ برای زن امشي (imshī) می‌شود. این فعل رایج برای راهنمایی مسیر پیاده است.
    example_gloss: مستقیم بروید.
  ar.a1.unit10.lesson02.teach.then:
    title: بعد
    gloss: بعد / آن موقع
    note: ثم (thumma) دو مرحله‌ی مسیر را به‌ترتیب به هم وصل می‌کند.
    example_gloss: مستقیم بروید، بعد به راست.
  ar.a1.unit10.lesson02.teach.route:
    title: دو مرحله‌ی مسیر
    gloss: مستقیم بروید، بعد به راست
    note: مرحله‌ی اول + ثم + مرحله‌ی دوم. فعل بعد از ثم تکرار نمی‌شود.
    example_gloss: 'لیلا گفت: مستقیم برو جلو، بعد به راست.'
  ar.a1.unit10.lesson02.teach.line01:
    title: پرسیدن جای کتابخانه
    gloss: یوسف می‌پرسد کتابخانه کجاست.
    note: أين المكتبة؟ قبلاً برای مکان‌ها هم استفاده شده بود.
    example_gloss: 'یوسف گفت: کتابخانه کجاست؟'
  ar.a1.unit10.lesson02.teach.line02:
    title: راهنمایی دادن
    gloss: لیلا دو مرحلهٔ ساده از مسیر را می‌گوید.
    note: لیلا امش می‌گوید چون با یک مرد صحبت می‌کند؛ برای یک زن می‌گفت امشي.
    example_gloss: 'لیلا گفت: مستقیم برو جلو، بعد به راست.'
  ar.a1.unit10.lesson02.teach.line03:
    title: تشکر کردن
    gloss: یوسف تشکر می‌کند.
    note: شكرا گفت‌وگوی کمک گرفتن را مؤدبانه تمام می‌کند.
    example_gloss: تأیید کردن مکان
  ar.a1.unit10.lesson02.teach.line04:
    title: لیلا می‌گوید کتابخانه نزدیک بازار است.
    gloss: لیلا می‌گوید کتابخانه نزدیک بازار است.
    note: 'این جمله قرب را از درس مکان‌ها دوباره به کار می‌برد: کتابخانه نزدیک بازار است.'
    example_gloss: 'لیلا گفت: کتابخانه نزدیک بازار است.'
