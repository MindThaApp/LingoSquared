    note: هل أستطيع (hal astaṭīʿ) یعنی «می‌توانم آیا»؛ الدفع (ad-dafʿ) یعنی پرداخت.
    example_gloss: می‌شود نقد پرداخت کنم؟
  ar.a1.unit24.lesson02.teach.line01:
    title: پرسیدن مبلغ
    gloss: لیلا مبلغ را می‌پرسد.
    note: كم یعنی «چقدر» و برای پرسیدن مقدار یا قیمت است.
    example_gloss: 'لیلا گفت: مبلغ چقدر است؟'
  ar.a1.unit24.lesson02.teach.line02:
    title: گفتن مبلغ
    gloss: فروشنده می‌گوید مبلغ ده درهم است.
    note: دراهم (darāhim) واژه‌ی واحد پول از درس خرید است.
    example_gloss: 'فروشنده گفت: مبلغ ده درهم است.'
  ar.a1.unit24.lesson02.teach.line03:
    title: پرسیدن درباره‌ی پرداخت با کارت
    gloss: لیلا می‌پرسد می‌تواند با کارت پرداخت کند یا نه.
    note: این جمله دربارهٔ روش پرداختِ قابل قبول می‌پرسد.
    example_gloss: 'لیلا گفت: می‌شود با کارت پرداخت کنم؟'
  ar.a1.unit24.lesson02.teach.line04:
    title: پیشنهاد روش‌ها
    gloss: فروشنده می‌گوید هم کارت ممکن است هم نقد.
    note: أو (aw) یعنی «یا».
    example_gloss: 'فروشنده گفت: بله، یا نقد.'
  ar.a1.unit24.lesson02.teach.line05:
    title: انتخاب روش
    gloss: لیلا می‌گوید با کارت پرداخت می‌کند.
    note: این جمله انتخاب روش پرداخت را کامل می‌کند.
    example_gloss: 'لیلا گفت: با کارت پرداخت می‌کنم.'
