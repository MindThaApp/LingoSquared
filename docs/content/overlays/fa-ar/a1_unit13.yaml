teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: دیروز
    gloss: دیروز
    note: أمس (ams) یعنی دیروز. با فعل گذشته مثل ذهبت می‌آید و می‌تواند آخر یا اول جمله بیاید.
    example_gloss: دیروز رفتم بازار.
  ar.a1.unit13.lesson01.teach.went:
    title: رفتم
    gloss: رفتم
    note: 'ذهبت (dhahabtu) یعنی رفتم: پایانهٔ گذشتهٔ ‎-tu نشانهٔ «من» است. بدون اعراب، همین حروف را می‌شود dhahabta / dhahabti (رفتی، برای مرد / برای زن) یا dhahabat (او رفت، مؤنث) هم خواند؛ از متن می‌فهمید کدام است.'
    example_gloss: رفتم بازار.
  ar.a1.unit13.lesson01.teach.bought:
    title: خریدم
    gloss: خریدم
    note: اشتريت (ishtaraytu) یعنی خریدم؛ مثل ذهبت با ‎-tu برای «من» تمام می‌شود.
    example_gloss: سیب خریدم.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: سیب
    gloss: سیب
    note: تفاحا (tuffāḥan) همان تفاح (سیب، از درس خرید) است در نقش مفعولِ فعل؛ ا اضافه، پایانهٔ ‎-an را می‌نویسد.
    example_gloss: سیب خریدم.
  ar.a1.unit13.lesson02.teach.what_did:
    title: دیروز چیکار کردی؟
    gloss: دیروز چه کار کردید؟
    note: 'ماذا (mādhā) یعنی چه؛ فعلت اینجا یعنی کردی: faʿalta برای مرد، faʿalti برای زن (نوشتنشان یکی است). یوسف از لیلی می‌پرسد، پس faʿalti می‌گوید.'
    example_gloss: 'یوسف گفت: دیروز چه کار کردی؟'
  ar.a1.unit13.lesson02.teach.drank:
    title: نوشیدم
    gloss: خوردم
    note: شربت (sharibtu) یعنی نوشیدم؛ مثل ذهبت و اشتريت پایانهٔ ‎-tu (من) دارد.
    example_gloss: قهوه خوردم.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: روایت یک اتفاق اخیر
    gloss: رفتم بازار. سیب خریدم. قهوه خوردم.
    note: چند جملهٔ کوتاه گذشته پشت سر هم می‌گویند چه کار کرده‌اید. هر فعل با ‎-tu برای «من» تمام می‌شود.
    example_gloss: دیروز رفتم بازار. سیب خریدم. قهوه خوردم.
  ar.a1.unit13.lesson02.teach.line01:
    title: پرسیدن دربارهٔ دیروز
    gloss: یوسف می‌پرسد لیلی دیروز چه کار کرده.
    note: یوسف از لیلی، که یک زن است، می‌پرسد؛ پس فعلت اینجا faʿalti خوانده می‌شود؛ برای مرد faʿalta است.
    example_gloss: 'یوسف گفت: دیروز چه کار کردی؟'
  ar.a1.unit13.lesson02.teach.line02:
    title: رفتن به بازار
    gloss: لیلی می‌گوید به بازار رفته است.
    note: ذهبت حرکتِ انجام‌شده را نشان می‌دهد.
    example_gloss: 'لیلی گفت: رفتم بازار.'
  ar.a1.unit13.lesson02.teach.line03:
    title: سیب خریدن
    gloss: لیلی می‌گوید سیب خریده است.
    note: این، کار انجام‌شدهٔ دوم را اضافه می‌کند.
    example_gloss: 'لیلی گفت: سیب خریدم.'
  ar.a1.unit13.lesson02.teach.line04:
    title: قهوه خوردن
    gloss: لیلی می‌گوید قهوه خورده است.
    note: این جمله، گزارش کوتاه اتفاق را کامل می‌کند.
    example_gloss: 'لیلی گفت: قهوه خوردم.'
