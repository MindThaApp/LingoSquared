teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: عربی از راست به چپ نوشته می‌شود
    gloss: عربی از راست به چپ نوشته می‌شود.
    note: عربی را از لبهٔ راست به سمت چپ بخوانید.
  ar.a1.unit01.lesson01.teach.mim:
    title: حرف م
    gloss: m
    note: م صدای «م» را نشان می‌دهد و بسته به جایگاهش در کلمه، شکلش عوض می‌شود.
  ar.a1.unit01.lesson01.teach.ra:
    title: حرف ر
    gloss: r
    note: ر صدای «ر» لرزان را نشان می‌دهد و به حرف بعد از خودش نمی‌چسبد.
  ar.a1.unit01.lesson01.teach.ha:
    title: حرف ح
    gloss: ḥ
    note: ح صدای «ه» دمیده‌ای است که از ته گلو درمی‌آید؛ با «ه» ساده‌ای که در فارسی داریم فرق دارد و باید گلویی‌تر و نفس‌دارتر گفته شود.
  ar.a1.unit01.lesson01.teach.ba:
    title: حرف ب
    gloss: b
    note: ب صدای «ب» را نشان می‌دهد و به حرف‌های دور و برش می‌چسبد.
  ar.a1.unit01.lesson01.teach.alef:
    title: حرف ا
    gloss: ā / a
    note: ا نشانهٔ مصوت بلند «ā» است و به حرف بعدی نمی‌چسبد.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: ساختن مرحبا
    gloss: سلام
    note: مرحبا «marḥaban» خوانده می‌شود. مصوت‌های کوتاه معمولاً در نوشتار عربی نوشته نمی‌شوند.
    example_gloss: سلام! من سارا هستم.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: سلام
    gloss: سلام
    note: مرحبا یک سلام گرم و همه‌منظوره است که تقریباً در هر موقعیتی به کار می‌رود.
    example_gloss: سلام، حالت چطوره؟
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: صبح بخیر
    gloss: صبح بخیر
    note: صباح الخير «ṣabāḥ al-khayr» خوانده می‌شود، یعنی تحت‌اللفظی «صبحِ خوبی».
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: عصر بخیر یا شب بخیر (هنگام دیدار)
    gloss: عصر بخیر / شب بخیر (هنگام دیدار)
    note: مساء الخير «masāʾ al-khayr» خوانده می‌شود و از اواخر بعدازظهر تا شب به کار می‌رود.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: خداحافظی
    gloss: خداحافظ
    note: مع السلامة «maʿa as-salāma» خوانده می‌شود، یعنی تحت‌اللفظی «با سلامت»؛ خداحافظیِ استاندارد و عمومی است.
    example_gloss: ممنون، خداحافظ!
  ar.a1.unit01.lesson02.teach.shukran:
    title: متشکرم
    gloss: متشکرم
    note: شكرا «shukran» خوانده می‌شود و در هر موقعیتی به کار می‌رود.
    example_gloss: خیلی متشکرم.
  ar.a1.unit01.lesson02.teach.afwan:
    title: خواهش می‌کنم
    gloss: خواهش می‌کنم
    note: عفوا «ʿafwan» جواب رایج به شكرا است؛ در موقعیتی دیگر می‌تواند معنی «ببخشید» هم بدهد.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: شب بخیر
    gloss: شب بخیر
    note: تصبح على خير «tuṣbiḥ ʿalā khayr» موقع خداحافظی شبانه یا رفتن به رختخواب گفته می‌شود، نه برای شروع سلام و احوال‌پرسی. تصبح شکلی است که به مرد گفته می‌شود؛ به زن تصبحين على خير «tuṣbiḥīna ʿalā khayr» می‌گویند.
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: خوش آمدید
    gloss: خوش آمدید
    note: أهلا وسهلا «ahlan wa sahlan» برای خوشامدگویی به مهمان یا استقبال گرم از کسی هنگام ورود به کار می‌رود.
    example_gloss: خوش آمدید! خوش آمدید.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: به امید دیدار
    gloss: به امید دیدار / تا دیدار بعدی
    note: إلى اللقاء «ilā al-liqāʾ» یک خداحافظیِ مؤدبانه و خنثی است.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: صبح بخیر (جواب)
    gloss: صبح بخیر [جواب]
    note: صباح النور «ṣabāḥ an-nūr»، یعنی «صبحِ نور»، جواب رایج صباح الخير است.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: عصر بخیر (جواب)
    gloss: عصر بخیر / شب بخیر [جواب]
    note: مساء النور «masāʾ an-nūr» جواب رایج مساء الخير است.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: روز خوبی داشته باشید
    gloss: روز خوبی داشته باشید
    note: يوما سعيدا «yawman saʿīdan» یک آرزوی گرم پایان گفتگو است.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: حال شما چطور است؟
    gloss: حال شما چطوره؟
    note: كيف حالك؟ «kayfa ḥāluk» روش استاندارد پرسیدن حال کسی است؛ بدون اعراب، شکل نوشتاری‌اش برای هر مخاطبی کار می‌کند.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: «تو»ی مذکر و مؤنث
    gloss: تو (مذکر) / تو (مؤنث)
    note: در عربی گفتاری أنتَ «anta»، برای مرد، با أنتِ «anti»، برای زن، فرق دارد؛ حالَك و حالِك هم همین‌طور. بدون اعراب‌هایی که اینجا آمده، شکل‌های نوشتاری‌ای که در این دوره به کار می‌روند برای هر دو یکسان‌اند.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: خوب / خوبم
    gloss: خوب / خوبم
    note: بخير «bikhayr» جواب مثبت استاندارد به كيف حالك؟ است.
    example_gloss: امروز خوبم.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: خدا را شکر
    gloss: خدا را شکر / الحمدلله
    note: الحمد لله «al-ḥamdu lillāh» معمولاً بعد از بخير در جواب می‌آید، صرف‌نظر از میزان دینداری گوینده؛ مثل «خدا را شکر» در فارسی، یک عبارت پایانی عادی در گفتگوست.
    example_gloss: خوبم، خدا را شکر.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: و شما؟
    gloss: شما چطور؟
    note: وأنت؟ («wa anta» برای مرد، «wa anti» برای زن) سؤال را برمی‌گرداند؛ املای بدون اعراب برای هر دو یکسان است.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: عالی
    gloss: عالی / عالی‌ام
    note: ممتاز «mumtāz» یک ارتقای پرشور نسبت به بخير است.
    example_gloss: امروز عالی‌ام!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: بد نیست
    gloss: بد نیست
    note: لا بأس «lā baʾs» یک جواب متوسطِ طبیعی است، نه گلایه.
