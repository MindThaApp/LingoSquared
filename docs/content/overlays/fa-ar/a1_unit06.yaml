    title: خانواده
    gloss: خانواده
    note: عائلة (ʿāʾila) کلمه‌ی کلی برای «خانواده» است. در مثال، هذه شکل مؤنثِ هذا («این») است و چون عائلة مؤنث است، همین شکل آمده.
    example_gloss: این یک خانواده است.
  ar.a1.unit06.lesson01.teach.father:
    title: پدر
    gloss: پدر
    note: أب (ab) یعنی پدر.
    example_gloss: من یک پدر دارم.
  ar.a1.unit06.lesson01.teach.mother:
    title: مادر
    gloss: مادر
    note: أم (umm) یعنی مادر.
    example_gloss: من یک مادر دارم.
  ar.a1.unit06.lesson01.teach.brother:
    title: برادر
    gloss: برادر
    note: أخ (akh) یعنی برادر.
    example_gloss: من یک برادر دارم.
  ar.a1.unit06.lesson01.teach.sister:
    title: خواهر
    gloss: خواهر
    note: أخت (ukht) یعنی خواهر.
    example_gloss: من یک برادر و یک خواهر دارم.
  ar.a1.unit06.lesson01.teach.i_have:
    title: من دارم
    gloss: دارم
    note: عندي (ʿindī، در اصل «نزد من») ساده‌ترین روش در سطح A1 برای گفتن «دارم» است؛ لدي (ladayya) معادل رسمی‌تر آن است.
    example_gloss: من یک خواهر دارم.
  ar.a1.unit06.lesson02.teach.in_family:
    title: در خانواده‌ات
    gloss: در خانواده‌ات
    note: 'من در اینجا «man» و به معنی «چه کسی» است، نه «min» به معنی «از» مثل من أين أنت؟ — این دو یک‌جور نوشته می‌شوند. عائلتك یعنی «خانواده‌ی تو»: ʿāʾilatuka برای مرد و ʿāʾilatuki برای زن.'
    example_gloss: چه کسانی در خانواده‌ی شما هستند؟
  ar.a1.unit06.lesson02.teach.sister_name:
    title: اسمش نور است
    gloss: اسمش نور است
    note: اسمها یعنی «اسمِ او» (برای مؤنث).
    example_gloss: 'یوسف گفت: اسمش نور است.'
  ar.a1.unit06.lesson02.teach.line01:
    title: پرسیدن درباره‌ی خانواده
    gloss: لیلا می‌پرسد چه کسانی در خانواده‌ی یوسف هستند.
    note: من در اینجا یعنی «چه کسی». يا يوسف یعنی صدا زدن یوسف با اسم.
    example_gloss: 'لیلا گفت: یوسف، چه کسانی در خانواده‌ات هستند؟'
  ar.a1.unit06.lesson02.teach.line02:
    title: توصیف خانواده
    gloss: یوسف می‌گوید پدر و مادر و یک خواهر دارد.
    note: و اعضای خانواده را به هم وصل می‌کند.
    example_gloss: 'یوسف گفت: من پدر و مادر و یک خواهر دارم.'
  ar.a1.unit06.lesson02.teach.line03:
    title: پرسیدن اسم خواهر
    gloss: لیلا اسم خواهر یوسف را می‌پرسد.
    note: 'أختك یعنی «خواهرت»: ukhtuka برای مرد و ukhtuki برای زن. اینجا لیلا از یوسف می‌پرسد، پس ukhtuka است.'
    example_gloss: 'لیلا گفت: اسم خواهرت چیست؟'
  ar.a1.unit06.lesson02.teach.line04:
    title: گفتن اسم او
    gloss: یوسف می‌گوید اسمش نور است.
    note: 'پسوند ـها یعنی «او» (مؤنث): اسمها (ismuhā) یعنی «اسمِ او».'
    example_gloss: 'یوسف گفت: اسمش نور است.'
