    gloss: نور اضافه می‌کند که بازار از کافه بزرگ‌تر است.
    note: 'والسوق (was-sūq) یعنی «و» چسبیده به السوق: و بازار.'
    example_gloss: 'نور گفت: و بازار از کافه بزرگ‌تر است.'
