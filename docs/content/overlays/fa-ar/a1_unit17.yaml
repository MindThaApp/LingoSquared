teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: درد
    gloss: درد
    note: ألم (alam) یعنی «درد»؛ عندي ألم (ʿindī alam) یعنی «درد دارم».
    example_gloss: درد دارم.
  ar.a1.unit17.lesson01.teach.head:
    title: سر
    gloss: سر
    note: الرأس (ar-raʾs) یعنی «سر». عربی می‌گوید عندي ألم في الرأس، یعنی «دردی در سر دارم»، در حالی که در فارسی معمولاً می‌گوییم «سردرد دارم» یا «سرم درد می‌کند».
    example_gloss: سرم درد می‌کند.
  ar.a1.unit17.lesson01.teach.stomach:
    title: شکم
    gloss: شکم
    note: البطن (al-baṭn) یعنی «شکم» یا ناحیه‌ی معده.
    example_gloss: شکمم درد می‌کند.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: درد در سر
    gloss: سرم درد می‌کند
    note: عندي ألم که تحت‌اللفظی می‌شود «نزد من درد است»، شیوه‌ی عربی برای گفتن «درد دارم» است؛ في + عضو بدن جای درد را می‌گوید.
    example_gloss: 'لیلی گفت: سرم درد می‌کند.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: مشکل چیست؟
    gloss: مشکل چیه؟
    note: ما (mā) یعنی «چه»؛ المشكلة (al-mushkila) یعنی «مشکل».
    example_gloss: مشکل چیه، لیلی؟
  ar.a1.unit17.lesson02.teach.drink:
    title: آب بنوش
    gloss: آب بنوش
    note: اشربي (ishrabī) امر «بنوش!» برای مخاطب مؤنث است، اینجا لیلی؛ برای مرد می‌شود اشرب (ishrab).
    example_gloss: 'یوسف گفت: آب بنوش.'
  ar.a1.unit17.lesson02.teach.rest:
    title: استراحت
    gloss: استراحت کن
    note: استريحي (istarīḥī) امر «استراحت کن!» برای مخاطب مؤنث است؛ برای مرد می‌شود استرح (istariḥ).
    example_gloss: امروز استراحت کن.
  ar.a1.unit17.lesson02.teach.need_help:
    title: کمک لازم دارم
    gloss: کمک لازم دارم
    note: أحتاج (aḥtāj) یعنی «نیاز دارم» و مساعدة (musāʿada) یعنی «کمک». أحتاج إلى مساعدة را هم با إلى می‌بینید؛ هر دو درست است.
    example_gloss: درد دارم. کمک لازم دارم.
  ar.a1.unit17.lesson02.teach.line01:
    title: پرسیدن مشکل
    gloss: یوسف از لیلی می‌پرسد مشکل چیست.
    note: يا ليلى لیلی را با اسم صدا می‌زند.
    example_gloss: 'یوسف گفت: مشکل چیه، لیلی؟'
  ar.a1.unit17.lesson02.teach.line02:
    title: گفتن علامت
    gloss: لیلی می‌گوید سرش درد می‌کند.
    note: نشانهٔ بیماری مستقیم گفته شده است.
    example_gloss: 'لیلا گفت: سرم درد می‌کند.'
  ar.a1.unit17.lesson02.teach.line03:
    title: توصیهٔ ساده
    gloss: یوسف به لیلا می‌گوید آب بنوشد و استراحت کند.
    note: 'هر دو فعل امر مؤنث‌اند چون یوسف با لیلا حرف می‌زند؛ «و» (wa، یعنی «و») به کلمهٔ بعدی چسبیده نوشته می‌شود: واستريحي.'
    example_gloss: 'یوسف گفت: آب بنوش و استراحت کن.'
  ar.a1.unit17.lesson02.teach.line04:
    title: تشکر
    gloss: لیلا تشکر می‌کند.
    note: شكرا این گفت‌وگوی کوتاه را تمام می‌کند.
    example_gloss: 'لیلا گفت: ممنون.'
