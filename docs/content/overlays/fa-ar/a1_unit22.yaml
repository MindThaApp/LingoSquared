  ar.a1.unit22.lesson02.teach.how_feel:
    title: حالتان چطور است؟
    gloss: چه احساسی داری؟ / حالت چطوره؟
    note: 'كيف تشعر؟ (kayfa tashʿur) از یک مرد می‌پرسد چه احساسی دارد؛ از یک زن: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: یوسف، چه احساسی داری؟
  ar.a1.unit22.lesson02.teach.tired:
    title: خسته
    gloss: خسته
    note: متعب (mutʿab) برای مرد است؛ متعبة (mutʿaba) برای زن است، برای همین لیلا می‌گوید أنا متعبة.
    example_gloss: خسته‌ام.
  ar.a1.unit22.lesson02.teach.okay:
    title: خوب
    gloss: خوب
    note: بخير (bi-khayr) یعنی خوب، تحت‌اللفظی «در خیر (سلامت)».
    example_gloss: حالتان خوبه؟
  ar.a1.unit22.lesson02.teach.line01:
    title: پرسیدن حال
    gloss: لیلا می‌پرسد یوسف چه احساسی دارد.
    note: يا (yā) قبل از اسم کسی می‌آید که مخاطب قرار می‌گیرد.
    example_gloss: 'لیلا گفت: یوسف، چه احساسی داری؟'
  ar.a1.unit22.lesson02.teach.line02:
    title: احساس و دلیل
    gloss: یوسف می‌گوید خوشحال است چون هوا آفتابی است.
    note: این جمله هم احساس را می‌گوید و هم دلیلش را.
    example_gloss: 'یوسف گفت: من خوشحالم چون هوا آفتابی است.'
  ar.a1.unit22.lesson02.teach.line03:
    title: یک احساس دیگر
    gloss: لیلا می‌گوید خسته است چون کار دارد.
    note: متعبة با لیلا مطابقت دارد (مؤنث است).
    example_gloss: 'لیلا گفت: من خسته‌ام چون کار دارم.'
  ar.a1.unit22.lesson02.teach.line04:
    title: پرسیدن «خوبی؟»
    gloss: یوسف می‌پرسد لیلا خوب است یا نه.
    note: هل (hal) سؤال بله/خیر را شروع می‌کند. یوسف از لیلا می‌پرسد، پس أنت اینجا «اَنتِ» (anti) خوانده می‌شود؛ برای مخاطب مرد «اَنتَ» (anta) است.
    example_gloss: 'یوسف گفت: حالت خوبه؟'
  ar.a1.unit22.lesson02.teach.line05:
    title: گفتن «بله»
    gloss: لیلا می‌گوید بله و تشکر می‌کند.
    note: نعم یعنی «بله».
    example_gloss: 'لیلا گفت: بله، ممنون.'
