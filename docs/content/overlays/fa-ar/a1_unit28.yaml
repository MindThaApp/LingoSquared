  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'فعل‌های ورزش: أمارس و ألعب'
    gloss: 'برای بیشتر ورزش‌ها از أمارس (umāris، انجام می‌دهم) استفاده کنید: أمارس اليوغا (umāris al-yūghā)، أمارس الركض (umāris ar-rakḍ)، أمارس السباحة (umāris as-sibāḥa). برای بازی‌های توپی از ألعب (alʿab، بازی می‌کنم) استفاده کنید: ألعب كرة القدم.'
    note: أمارس (umāris) برای بیشتر ورزش‌ها به کار می‌رود، اما بازی‌های توپی با ألعب (alʿab) می‌آیند؛ پس فعل را همراه با ورزش یاد بگیرید.
