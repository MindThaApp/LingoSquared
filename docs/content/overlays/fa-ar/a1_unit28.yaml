    gloss: لیلا هفته‌ای دو بار یوگا می‌کند. دوست دارد آرام حرکت کند. سارا یوگا نمی‌کند، ولی شنا را دوست دارد. سارا زیاد شنا می‌کند، تقریباً هر هفته. شما چه ورزشی می‌کنید؟
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) و سارة تسبح (sāra tasbaḥ) فعل‌هایی دارند که با ت (ta-) شروع می‌شوند، چون هر دو زن‌اند. لا قبل از فعل آن را منفی می‌کند.
