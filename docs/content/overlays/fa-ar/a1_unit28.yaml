    gloss: 'برای پیشنهاد دادن یک کار دسته‌جمعی، هل (hal) را با فعلِ «ما» به کار ببرید: هل نتمشى؟ (hal natamashshā?) و هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: همان ساختار پیشنهاد برنامه از درس برنامه‌ها دوباره استفاده شده است.
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
