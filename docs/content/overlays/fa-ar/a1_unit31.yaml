      تلتحق: ثبت‌نام کرده است (برنامه‌ی درسی می‌گذراند)
      ببرنامج: دوره آموزشی
      الكلية: مؤسسه‌ی آموزش عالی کاربردی
      الرعاية: مراقبت (مراقبت‌های بهداشتی)
      كلاهما: هر دو
      يحب: خوشش می‌آید
