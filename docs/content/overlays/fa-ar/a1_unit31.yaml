    title: چه کسی چه می‌خواند؟
    gloss: کریم فقط کار نمی‌کند، درس هم می‌خواند. او در مرکز آموزش بزرگسالان یک دوره‌ی اسپانیایی می‌گذراند. هر هفته کلمه‌های جدید یاد می‌گیرد. سارا در کالج یک برنامه‌ی درسی را می‌گذراند. او آنجا مراقبت‌های بهداشتی می‌خواند. هر دو درس خواندن را دوست دارند. شما چه می‌خوانید، یا دوست دارید چه چیزی یاد بگیرید؟
    note: تحصیل کریم و سارا را با هم مقایسه می‌کند.
    glosses:
