  feedback_frame:
    text: Хорошо, спасибо Как дела? का मानक उत्तर है और इसका मतलब है कि सब ठीक है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
