templates:
- content_key: practice.hi-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सिरिलिक के कई अक्षर लैटिन अक्षरों जैसे दिखते हैं पर उनकी आवाज़ अलग होती है: р यानी "र", в यानी "व", у यानी "ऊ" (जैसे "फूल" में) और й यानी छोटी "इ" की आवाज़।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'सिरिलिक के कुछ अक्षर धोखा देते हैं: р देखने में P जैसा है पर "र" बोला जाता है, और е देखने में E जैसा है पर शब्द की शुरुआत में "ये" बोला जाता है; здравствуйте में दोनों हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: रूसी भाषा सिरिलिक लिपि में लिखी जाती है; पहला शब्द здравствуйте, जो आप सीखते हैं, उसमें з, д, р, а, в, с, т, у, й और е अक्षर हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: नमस्ते! (औपचारिक, एक शब्द)
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте अजनबियों और एक साथ कई लोगों के लिए औपचारिक नमस्ते है; पहला в नहीं बोला जाता, इसलिए यह "ज़्द्रास्त्वुइते" जैसा सुनाई देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रूसी अभिवादन दिन के समय के अनुसार होते हैं: доброе утро (सुबह), добрый день (दिन), добрый вечер (शाम)। Утро नपुंसक लिंग है, जबकि день और вечер पुल्लिंग हैं, इसलिए विशेषण का अंत बदल जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Привет दोस्तों और परिवार के लिए आम बोलचाल का "हाय" है; अजनबियों से здравствуйте या दिन के समय वाला अभिवादन इस्तेमाल करें।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Добрый पुल्लिंग संज्ञाओं जैसे день और вечер के साथ आता है, जबकि नपुंसक लिंग का утро доброе लेता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
