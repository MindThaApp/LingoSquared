      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Утро नपुंसक लिंग की संज्ञा है, इसलिए अभिवादन में доброе आता है, добрый नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
