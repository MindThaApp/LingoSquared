  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До का अर्थ है "तक", इसलिए До завтра! "कल मिलते हैं" कहने का रोज़मर्रा का तरीका है।
    language_code: hi
    direction: ltr
