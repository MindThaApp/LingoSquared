    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Привет आम बोलचाल का है, जबकि здравствуйте वह औपचारिक नमस्ते है जो अजनबियों के साथ इस्तेमाल होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как дела? रोज़ का सवाल है, जो आमतौर पर दोस्तों (ты) के बीच पूछा जाता है, जबकि Как поживаете? вы रूप में है और ज़्यादा औपचारिक लगता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Пока आम बोलचाल का "फिर मिलेंगे" है, जबकि до свидания सामान्य या औपचारिक अलविदा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дела? का शाब्दिक अर्थ है कि मामले कैसे चल रहे हैं; Привет के बाद यह दोस्तों के बीच का अनौपचारिक सवाल है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поживаете का अंत -ете में होता है, जो вы रूप है, इसलिए यह औपचारिक здравствуйте के साथ आता है।
    language_code: hi
    direction: ltr
