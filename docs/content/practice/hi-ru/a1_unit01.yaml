    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: रूसी में उपपद जैसे शब्द नहीं होते, इसलिए एक शब्द का उत्तर सिर्फ़ वही शब्द होता है, जैसे утро या завтра।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
