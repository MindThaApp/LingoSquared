templates:
- content_key: practice.hi-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '-ю वाले क्रियारूप я के साथ आते हैं (मैं उठता हूँ: я встаю), जबकि -ете вы के साथ आता है (вы встаёте)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: हर क्रिया -ю पर समाप्त होती है, क्योंकि कर्ता я है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Завтракаю "नाश्ता करना" क्रिया का я वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Встаёте -ёте पर समाप्त होता है, यह вы वाला रूप है; я वाला रूप встаю है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: मैं सात बजे उठता/उठती हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'घड़ी के समय के लिए रूसी में в और संख्या आती है: в семь часов, यानी सात बजे।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ये क्रियाएँ я वाले रूप हैं, इसलिए हर एक का अर्थ है "मैं कुछ करता/करती हूँ"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ложусь спать का शाब्दिक अर्थ है "मैं सोने के लिए लेटता/लेटती हूँ", और "मैं सोने जाता/जाती हूँ" कहने का यही सामान्य तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Спать "सोना" (क्रिया का मूल रूप) है, और ложусь एक अलग क्रिया का я वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Ложусь спать एक स्थिर जोड़ी है: क्रिया ложусь और उसके साथ спать।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: fill_in_blank
  frame:
    text: Я работаю с девяти до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: С और до के बाद संबंध कारक (संबंध कारक) आता है, इसलिए девять और пять बदलकर девяти और пяти हो जाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: मैं नौ से पाँच बजे तक काम करता/करती हूँ।
    language_code: hi
    direction: ltr
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С ... до ... का अर्थ है "... से ... तक", और इसमें दोनों संख्याएँ संबंध कारक (संबंध कारक) में आती हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: मैं ग्यारह बजे सोने जाता/जाती हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'संख्या одиннадцать के बाद संज्ञा बहुवचन संबंध कारक में आती है: часов।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Делаете और работаете -ете पर समाप्त होते हैं, ये вы वाले रूप हैं, इसलिए ये вы के साथ आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson03.order.002
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете? का अर्थ है "आप क्या करते हैं?"; утром का अर्थ है "सुबह"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А प्रश्न को पिछले प्रश्न से जोड़ता है, और работаете вы वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
    text: Что вы {item} вечером? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Делаете делать ("करना") का вы वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: आप सुबह क्या करते हैं? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете утром? में प्रश्नवाचक शब्द, вы वाला क्रियारूप और समय बताने वाला शब्द एक साथ आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Понятно का शाब्दिक अर्थ है "स्पष्ट है", और "समझ गया/गई" कहने का यही सामान्य तरीका है।
    language_code: hi
    direction: ltr
