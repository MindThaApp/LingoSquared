templates:
- content_key: practice.hi-ru.ru.a1.unit12.lesson01.choose.001
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давай दोस्त (ты) से कुछ करने का प्रस्ताव रखने का अनौपचारिक तरीका है; вы के साथ давайте कहा जाएगा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson01.order.002
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: word_order
  frame:
    text: Давай пойдём в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кино का रूप कभी नहीं बदलता, इसलिए в के बाद भी кино ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson01.fill.003
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: fill_in_blank
  frame:
    text: Давай {item} в кино. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Давай के साथ пойдём एक योजना सुझाता है: चलो चलें।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson01.translate.004
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: चलो कल फ़िल्म देखने चलते हैं। (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай {item} в кино завтра.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давай пойдём दोस्ताना (ты वाला) न्योता है: चलो चलें।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson01.translate.005
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: चलो शनिवार को फ़िल्म देखने चलते हैं। (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в кино в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'सप्ताह के दिन "को" कहने के लिए रूसी में в के साथ कर्म कारक (कर्म कारक) आता है: суббота बन जाता है субботу।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson01.translate.006
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кино नहीं बदलता, और давай अनौपचारिक "चलो" है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson02.choose.001
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Согласен व्यंजन पर खत्म होता है क्योंकि वक्ता पुरुष है; महिला согласна कहती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson02.fill.002
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: К {item}, я не могу. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: К сожалению "दुर्भाग्य से/अफ़सोस है कि" कहने का सामान्य तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson02.fill.003
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: Во сколько мы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Встретимся "हम" वाला रूप है, इसलिए यह мы के साथ आता है: мы встретимся।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson02.order.004
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: word_order
  frame:
    text: К сожалению, я не {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: К сожалению, я не {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не क्रिया को नकारता है, और могу "मैं (कर) सकता/सकती हूँ" वाला я रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson02.translate.005
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: ठीक है, मैं सहमत हूँ। (पुरुष द्वारा कहा गया)
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Согласен पुल्लिंग रूप है; महिला согласна कहेगी।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson02.translate.006
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: हम कितने बजे मिलेंगे?
    language_code: hi
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во сколько का शाब्दिक अर्थ है "कितने में", यानी "कितने बजे"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson03.listen.001
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रूसी नामों के छोटे, दोस्ताना रूप होते हैं, जैसे Настя और Дима, जिनका प्रयोग दोस्तों के बीच होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson03.order.002
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: word_order
  frame:
    text: Давай в семь часов, у {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'У का अर्थ है "के पास" और इसके बाद संबंध कारक (संबंध कारक) आता है: кинотеатр बन जाता है кинотеатра।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson03.fill.003
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: fill_in_blank
  frame:
    text: Отлично, до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До का अर्थ है "तक" और इसके बाद संबंध कारक (संबंध कारक) आता है, इसलिए суббота बन जाता है субботы।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson03.translate.004
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: बढ़िया, शनिवार को मिलते हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Отлично, до {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До субботы का शाब्दिक अर्थ है "शनिवार तक" और यह "फिर मिलते हैं" कहने का दोस्ताना तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson03.translate.005
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: चलो सात बजे रखते हैं, सिनेमाघर के पास। (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай в семь часов समय सुझाता है; у кинотеатра जगह बताता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit12.lesson03.translate.006
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отлично "बढ़िया" अर्थ वाला क्रियाविशेषण है और लिंग या वचन के अनुसार नहीं बदलता।
    language_code: hi
    direction: ltr
