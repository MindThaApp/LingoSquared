  frame:
    text: Зимой мы катаемся на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_коньках
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_коньках
  answer_derivation:
