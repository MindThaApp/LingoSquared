    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_считаешь
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое время года ты {item} красивым?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: तुम्हें कौन-सा मौसम सुंदर लगता है? считаешь का अर्थ है तुम मानते हो, तुम समझते हो (अनौपचारिक)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit39.lesson03.order.002
  lesson_content_key: ru.a1.unit39.lesson03.zanyatiya_v_kazhdoe_vremya
  type: word_order
  frame:
    text: Летом мы {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_плаваем
  answer_derivation:
    kind: render_frame
    frame:
      text: Летом мы {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: गर्मियों में हम तैरते हैं। плаваем का अर्थ है हम तैरते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit39.lesson03.fill.003
  lesson_content_key: ru.a1.unit39.lesson03.zanyatiya_v_kazhdoe_vremya
