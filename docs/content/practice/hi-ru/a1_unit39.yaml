  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: word_order
  frame:
    text: Какое сейчас время {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_года
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сейчас время {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: अभी कौन-सा मौसम है? года का अर्थ है साल (संबंध कारक), जैसे "ऋतु" यानी "साल का समय"।
    language_code: hi
    direction: ltr
