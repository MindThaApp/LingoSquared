  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: fill_in_blank
  frame:
    text: Мне нравится {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_лето
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_лето
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मुझे गर्मी का मौसम पसंद है। лето का अर्थ है गर्मी।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit39.lesson01.translate.005
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: translation
  frame:
    text: वसंत में धूप खिली होती है और गर्मियों में गर्मी होती है।
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_летом
  answer_derivation:
    kind: render_frame
    frame:
      text: Весной солнечно, а {item} тепло.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: वसंत में धूप खिली होती है और गर्मियों में गर्मी होती है। летом का अर्थ है गर्मियों में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit39.lesson02.order.002
  lesson_content_key: ru.a1.unit39.lesson02.osen_i_zima
  type: word_order
  frame:
