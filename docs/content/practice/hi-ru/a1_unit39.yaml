    slot: item
  feedback_frame:
    text: सर्दियों में हम आइस-स्केटिंग करते हैं। коньках का अर्थ है आइस-स्केट ("पर" के अर्थ वाले शब्द के बाद), जैसे "आइस-स्केटिंग करना" में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit39.lesson05.order.002
  lesson_content_key: ru.a1.unit39.lesson05.chitaem_tekst_o_vremenakh
  type: word_order
  frame:
    text: Разговор о {item} года приятный.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_временах
  answer_derivation:
    kind: render_frame
    frame:
      text: Разговор о {item} года приятный.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ऋतुओं के बारे में बातचीत मज़ेदार है। временах का अर्थ है समय, ऋतुएँ ("के बारे में" वाले शब्द के बाद), जैसे "ऋतुओं के बारे में"।
    language_code: hi
    direction: ltr
