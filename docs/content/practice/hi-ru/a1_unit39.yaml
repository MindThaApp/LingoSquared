    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: हर रूसी शब्द को उसके हिंदी अर्थ से मिलाइए; ये शब्द इस यूनिट के पाठों से हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit39.lesson06.choose.001
  lesson_content_key: ru.a1.unit39.lesson06.igor_prisoedinyaetsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
