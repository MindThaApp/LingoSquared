    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'शब्द и ऑर्डर में दो चीज़ों को जोड़ता है: борщ и салат।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson02.match.004
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
