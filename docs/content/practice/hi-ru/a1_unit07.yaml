templates:
- content_key: practice.hi-ru.ru.a1.unit07.lesson01.choose.001
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Официант वेटर है और официантка वेट्रेस; स्त्रीलिंग रूप में -ка जुड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson01.order.002
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: word_order
  frame:
    text: Этот {item} свободен?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Этот {item} свободен?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Этот पुल्लिंग "यह" है, इसलिए यह столик और стол जैसे पुल्लिंग संज्ञाओं के साथ आता है; свободен भी पुल्लिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson01.fill.003
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: fill_in_blank
  frame:
    text: Да, {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Садитесь का अंत -тесь है; यह вы के साथ आदरपूर्ण आज्ञा है, जो कर्मचारी मेहमानों से कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson01.match.004
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Свободен पुल्लिंग विशेषण है जो столик के अनुसार बदलता है; Этот столик свободен? पूछता है कि क्या यह मेज़ ख़ाली है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson01.translate.005
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: यह रहा मेन्यू।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вот {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меню का रूप कभी नहीं बदलता, और Вот का अर्थ है "यह रहा"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson01.translate.006
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: आप क्या ऑर्डर करेंगे? (आदरपूर्वक)
    language_code: hi
    direction: ltr
  slots:
    aux: *id005
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Что {aux} {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете заказывать? में вы वाला रूप будете और क्रिया का मूल रूप आता है; यह पूछता है कि मेहमान क्या ऑर्डर करेगा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson02.choose.001
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Я хочу के बाद संज्ञा लगाने से "मुझे ... चाहिए" बनता है, और रूसी में "एक" या "वह" जैसे शब्द नहीं लगते।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson02.order.002
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу का अर्थ है "मुझे चाहिए", और इसके बाद чай, кофе, борщ और салат का रूप वही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson02.fill.003
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
