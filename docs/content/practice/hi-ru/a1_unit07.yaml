  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Кофе पुल्लिंग संज्ञा है जिसका अंत कभी नहीं बदलता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson02.translate.005
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: मुझे चाय चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу सीधा कथन है, इसलिए रेस्तराँ में उसे नरम करने के लिए пожалуйста जोड़िए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: मुझे बोर्श और सलाद चाहिए।
    language_code: hi
    direction: ltr
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат संवाद वाला ऑर्डर है; रूसी में "एक" या "वह" जैसे शब्द नहीं लगते।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мороженое का अंत -ое है क्योंकि यह विशेषण से बना नपुंसकलिंग संज्ञा है, जैसे сладкое।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson03.order.002
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: На сладкое принесите {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое принесите {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое का अर्थ है "मिठाई में", और принесите вы के साथ आदरपूर्ण आज्ञा है जिसका अर्थ है "लाइए"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson03.order.003
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: Что будете {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Что будете {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Что будете пить? वेटर का प्रश्न है: будете और क्रिया का मूल रूप।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson03.fill.004
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: fill_in_blank
  frame:
    text: На сладкое {item} мороженое, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Принесите "लाइए" के लिए вы के साथ आदरपूर्ण आज्ञा है; ты के साथ принеси होगा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson03.translate.005
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: मिठाई में कृपया आइसक्रीम लाइए। (आदरपूर्वक)
    language_code: hi
    direction: ltr
  slots:
    a: *id016
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое {a} {b}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое принесите мороженое वेटर से मिठाई मँगवाने का स्वाभाविक तरीक़ा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit07.lesson03.translate.006
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сладкое विशेषण है जो संज्ञा की तरह प्रयुक्त होकर "मिठाई" का अर्थ देता है।
    language_code: hi
    direction: ltr
