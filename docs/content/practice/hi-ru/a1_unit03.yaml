    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 2-4 की संख्याओं के साथ संज्ञा एक तरह से बदलती है (брат से брата) और 5 व उससे ऊपर की संख्याओं के साथ दूसरी तरह से (книга से книг)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два, три और четыре, तीनों के साथ संज्ञा का एक ही रूप брата आता है, इसलिए यहाँ इनमें से कोई भी ठीक बैठता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'пять और उससे ऊपर की हर संख्या के बाद संज्ञा बहुवचन संबंध कारक में आती है: рублей, न कि рубль।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: मेरे दो भाई हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата का शाब्दिक अर्थ है "मेरे पास दो भाई हैं"; брата वह रूप है जो 2, 3 और 4 के बाद आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पहले गिनती के रूप सीखिए (один, два, три, четыре, пять); उनके बाद संज्ञा बदलती है, जैसे один рубль, два рубля, пять рублей।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
