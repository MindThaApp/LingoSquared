templates:
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रूसी में संख्याओं के बाद संज्ञा का रूप बदलता है: один рубль, два рубля, пять рублей।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 2, 3 और 4 के बाद संज्ञा एक विशेष रूप लेती है (два брата, три рубля), और 5 से आगे बहुवचन संबंध कारक आता है (пять рублей)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
