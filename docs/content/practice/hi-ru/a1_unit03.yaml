    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: रूसी में उम्र мне (शाब्दिक अर्थ "मुझे") से बताई जाती है, और 5 व उससे ऊपर की संख्या के बाद संज्ञा лет होती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पाँच से ऊपर की संख्याओं के बाद उम्र में बहुवचन संबंध कारक лет आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: मेरी उम्र दस साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: उम्र мне ("मुझे"), संख्या और лет से बताई जाती है; इसमें क्रिया नहीं होती।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: आपकी उम्र कितनी है? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? में आदरसूचक вам (शाब्दिक अर्थ "आपको") आया है; यह पूछता है कि आपको कितने साल हुए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रूसी में एक चीज़ के लिए Сколько стоит? और कई चीज़ों के लिए Сколько стоят? कहा जाता है, यानी क्रिया खरीदी जा रही चीज़ के अनुसार बदलती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? हर स्थिति में चलने वाला "कितने का" प्रश्न है; стоит एक चीज़ के लिए प्रयोग होने वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки बहुवचन है, इसलिए क्रिया стоят है; एक चीज़ (хлеб) के लिए стоит होता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: रोटी कितने की है?
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб एक ही चीज़ है, इसलिए क्रिया стоит है; बहुवचन яблоки के साथ стоят होता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: तीन रूबल।
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: три के बाद संज्ञा 2-4 वाला रूप рубля लेती है, जो 5 और उससे ऊपर के बाद आने वाले рублей से अलग है।
    language_code: hi
    direction: ltr
