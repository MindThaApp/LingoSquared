    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Помидоры, огурцы और апельсины बहुवचन हैं; картофель और капуста एकवचन शब्द हैं, जिनका अर्थ आलू और पत्ता गोभी है।
    language_code: hi
    direction: ltr
