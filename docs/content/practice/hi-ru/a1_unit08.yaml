  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...? किसी भी संज्ञा के साथ चलता है और विक्रेता से यह पूछने का सामान्य तरीका है कि उनके पास कोई चीज़ है या नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit08.lesson03.fill.003
