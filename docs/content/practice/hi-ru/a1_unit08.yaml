  frame:
    text: कृपया मुझे पाँच नग दीजिए। (आदरपूर्वक)
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: संख्या पाँच के बाद Штука बदलकर штук हो जाता है।
    language_code: hi
    direction: ltr
