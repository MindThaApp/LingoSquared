templates:
- content_key: practice.hi-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите आप वाला आदरसूचक आदेश है, जिसका अर्थ है "जाइए"; तुम के लिए иди कहा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'दिशाएँ потом (फिर) से जोड़ी जाती हैं: Идите прямо, потом направо.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До का अर्थ है "तक" और इसके बाद संबंधकारक (संबंध कारक) आता है, इसलिए музей का रूप музея हो जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прямо का अर्थ है "सीधे" और इसका अंत नहीं बदलता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: संग्रहालय तक कैसे पहुँचें?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? पैदल कहीं पहुँचने का रास्ता पूछता है; до के बाद स्थान संबंधकारक (संबंध कारक) में आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: सीधे जाइए, फिर दाएँ। (आदरपूर्वक)
    language_code: hi
    direction: ltr
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо छोटे से रास्ते-निर्देश का आम रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните आप वाला आदरसूचक आदेश है, जिसका अर्थ है "मुड़िए"; налево और направо बताते हैं किस ओर।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поверните के बाद налево और направо दोनों आ सकते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'За के साथ यहाँ करण कारक (करण कारक) आता है, इसलिए угол का रूप углом हो जाता है: за углом का अर्थ है "मोड़ के पास"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '2, 3 और 4 के बाद संज्ञा का विशेष रूप आता है: два квартала, पर пять кварталов.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: क्या यह यहाँ से दूर है?
    language_code: hi
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко का अर्थ है "दूर" और отсюда का "यहाँ से"; Это далеко отсюда? एक आम प्रश्न है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал शहर का ब्लॉक है, और далеко का अर्थ है "दूर"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите अजनबी का ध्यान खींचने का आदरपूर्ण (आप वाला) तरीका है, जैसे "माफ़ कीजिए"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто का अर्थ है "यह बहुत आसान है"; इसमें "है" के लिए क्रिया की ज़रूरत नहीं होती।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'пять के बाद संज्ञा बहुवचन संबंधकारक (संबंध कारक) में आती है: пять минут.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: यह बहुत आसान है।
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: это के बाद просто "आसान है" के अर्थ में विधेय बनकर आता है, इसलिए "है" के लिए क्रिया नहीं चाहिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: पैदल पाँच मिनट।
    language_code: hi
    direction: ltr
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком का अर्थ है "पैदल", और минут пять के बाद बहुवचन संबंधकारक (संबंध कारक) में आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий विशेषण से बना पुल्लिंग संज्ञा शब्द है, जिसका अर्थ है "राहगीर"।
    language_code: hi
    direction: ltr
