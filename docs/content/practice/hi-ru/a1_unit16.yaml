- content_key: practice.hi-ru.ru.a1.unit16.lesson02.translate.004
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: मुझे सर्दी-ज़ुकाम है।
    language_code: hi
    direction: ltr
