    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit16.lesson02.choose.001
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мне плохо का सामान्य अर्थ है "मेरी तबीयत ठीक नहीं है", जिसमें мне का अर्थ "मुझे" है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit16.lesson02.order.002
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
