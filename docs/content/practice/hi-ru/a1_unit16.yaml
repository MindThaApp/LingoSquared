templates:
- content_key: practice.hi-ru.ru.a1.unit16.lesson01.choose.001
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У меня болит के बाद शरीर का अंग बताने से पता चलता है कि वही अंग दुख रहा है; जो दुख रहा है, वही болит का कर्ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit16.lesson01.order.002
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: word_order
  frame:
    text: У меня болит {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: शरीर का अंग स्त्रीलिंग, पुल्लिंग या नपुंसकलिंग हो, болит वैसा ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit16.lesson01.fill.003
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: fill_in_blank
  frame:
    text: У меня болит {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: रूसी में कहते हैं "मेरे पास सिर दुखता है", यानी "मुझे सिरदर्द है" के लिए अलग ढंग से कहा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit16.lesson01.translate.004
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: मेरे पेट में दर्द है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот पुल्लिंग है, फिर भी болит नहीं बदलता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: मेरा गला दुख रहा है।
    language_code: hi
