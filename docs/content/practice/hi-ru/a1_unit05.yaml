templates:
- content_key: practice.hi-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? शाब्दिक रूप से "कौन-सा घंटा" पूछता है और Сейчас का अर्थ "अभी" है; दोनों मिलकर समय पूछने और बताने की मानक जोड़ी हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'संख्या के बाद संज्ञा का रूप संख्या पर निर्भर करता है: 1 के बाद час, 2-4 के बाद часа, 5 और उससे ऊपर के बाद часов।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 2, 3 और 4 के बाद संज्ञा का रूप часа होता है, जैसे два часа और три часа।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'पाँच से आगे संज्ञा बहुवचन संबंधकारक часов लेती है: пять часов, десять часов।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: क्या समय हुआ है?
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? का शाब्दिक अर्थ "कौन-सा घंटा" है; यह समय पूछने का मानक तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'रूसी में प्रश्न अक्सर पहले प्रश्नवाचक शब्द और फिर क्रिया से बनता है: Когда отходит поезд?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром, днём, вечером और ночью क्रियाविशेषण हैं, जो -ом, -ём या -ью पर समाप्त होते हैं और बिना पूर्वसर्ग के आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'रूसी में दिन के हिस्से क्रियाविशेषण होते हैं: утром, днём, вечером, ночью।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: घड़ी के समय के बाद дня का अर्थ दोपहर है, वैसे ही утра का अर्थ सुबह और вечера का अर्थ शाम है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? यह पूछता है कि कोई बात किस समय होती है, न कि अभी क्या समय है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: утром और вечером जैसे समय-शब्द बिना पूर्वसर्ग के अकेले आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: शाम सात बजे।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'घड़ी के समय के बाद दिन का हिस्सा संबंधकारक में आता है: семь часов вечера।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста अजनबी से प्रश्न शुरू करने का विनम्र तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите विनम्र вы-आज्ञार्थ रूप है, जिसका अर्थ "बताइए" है, और пожалуйста अनुरोध को नरम बनाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит क्रिया का वह/यह (एकवचन) रूप है, इसलिए यह एकवचन поезд के साथ मेल खाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: घड़ी के समय के बाद утра का अर्थ सुबह है, इसलिए восемь часов утра यानी सुबह आठ बजे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: ट्रेन कब छूटती है?
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда पूछता है "कब", और क्रिया отходит एकवचन поезд के साथ मेल खाती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: दोपहर के दो बजे।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: दोपहर के समय के लिए дня का प्रयोग होता है, जबकि सुबह और शाम के लिए утра और вечера का प्रयोग होता है।
    language_code: hi
    direction: ltr
