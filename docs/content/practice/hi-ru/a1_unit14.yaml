- content_key: practice.hi-ru.ru.a1.unit14.lesson01.choose.001
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Нравится पसंद बताने वाली क्रिया है: Мне нравится кофе का शाब्दिक अर्थ है "मुझे कॉफ़ी पसंद आती है"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне нравится кофе में जो चीज़ पसंद की जाती है वही व्याकरण में कर्ता है, और мне उस व्यक्ति को बताता है जिसे वह पसंद है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится के साथ мне ("मुझे") आता है, और इससे कहा जाता है कि आपको कोई चीज़ पसंद है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: मुझे कॉफ़ी पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: रूसी में "मैं कॉफ़ी को पसंद करता हूँ" की जगह "मुझे कॉफ़ी पसंद आती है" कहा जाता है, जैसे हिंदी में भी "मुझे पसंद है" कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: मुझे चाय पसंद नहीं है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: किसी चीज़ का पसंद न होना बताने के लिए нравится से पहले не लगाइए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу का अर्थ है "मुझे नहीं चाहिए"; не क्रिया के ठीक पहले आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу, я хочу ("मुझे चाहिए") का निषेध है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson02.order.003
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сок पुल्लिंग संज्ञा है और хочу के बाद इसका रूप नहीं बदलता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson02.fill.004
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хочу के बाद सीधे वह चीज़ आती है जो आप चाहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson02.translate.005
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: मुझे जूस चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу के साथ संज्ञा जोड़ने से सीधा और साफ़ अनुरोध बनता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson02.translate.006
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: मुझे कॉफ़ी नहीं चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не को хочу के पहले रखकर उसका निषेध किया जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson03.choose.001
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе अनौपचारिक ты का रूप है, जिसका अर्थ है "तुम्हें"; आदरपूर्वक вы का रूप вам है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson03.order.002
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе? अनौपचारिक ты के साथ सवाल सामने वाले की ओर लौटा देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson03.fill.003
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: fill_in_blank
  frame:
    text: А {item} нравится кофе? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тебе अनौपचारिक "तुम्हें" है, जो दोस्तों के साथ इस्तेमाल होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: हाँ, मुझे कॉफ़ी पसंद है। और तुम्हें? (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тебе अनौपचारिक "तुम्हें" है; अजनबी से आप вам कहेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit14.lesson03.translate.005
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'पसंद और चाहत बताने के ये मूल घटक हैं: нравится, не хочу, сок और тебе।'
    language_code: hi
    direction: ltr
