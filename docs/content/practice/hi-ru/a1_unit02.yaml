templates:
- content_key: practice.hi-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रूसी में "आप/तुम" के लिए दो शब्द हैं: ты दोस्तों, परिवार, बच्चों और हमउम्र लोगों के लिए, और вы अजनबियों, सम्मान के योग्य लोगों या कई लोगों के लिए।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как вас зовут? औपचारिक "आपका नाम क्या है?" है; शब्दशः यह पूछता है कि लोग आपको क्या कहकर बुलाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут का शब्दशः अर्थ है "लोग मुझे बुलाते हैं", इसलिए इसके बाद आने वाला नाम अपने मूल रूप में रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Зовут प्रश्न और उत्तर दोनों में आता है: Как вас зовут? और Меня зовут Виктор.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: रूसी लोग Меня зовут और पहला नाम कहकर अपना परिचय देते हैं; Ирина Петровна की तरह पितृनाम जोड़ना अधिक औपचारिक है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: आपका नाम क्या है? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: इस प्रश्न में вас, вы का औपचारिक रूप है; दोस्त से आप पूछते हैं Как тебя зовут?
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Откуда вы? पूछता है कि आप कहाँ से हैं, और उत्तर में из के साथ स्थान आता है: Я из Канады, Я из Москвы.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Можно на ты? शिष्टता से вы से ты पर आने की अनुमति माँगता है; रिवाज यह है कि बड़ा या ऊँचे पद वाला व्यक्ति यह प्रस्ताव रखता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ты उन लोगों के लिए है जिन्हें आप अच्छी तरह जानते हैं और вы औपचारिक संपर्क के लिए, इसलिए हर बातचीत में इनमें से एक चुनना पड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Из के बाद संबंध कारक (родительный падеж) आता है, इसलिए Канада से Канады और Москва से Москвы बन जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давайте перейдём на ты औपचारिकता छोड़ने का प्रस्ताव है; फिर भी प्रस्ताव давайте के साथ शिष्टता से ही रखा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меня, я का कर्म रूप है, इसीलिए नाम बताते समय Меня зовут कहा जाता है, शब्दशः "लोग मुझे बुलाते हैं"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: आप कहाँ से हैं? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Откуда का अर्थ है "कहाँ से"; औपचारिक प्रश्न में вы आता है और उत्तर में из के साथ स्थान।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Очень приятно का शब्दशः अर्थ है "बहुत सुखद" और किसी का नाम सुनने के बाद यही सामान्य उत्तर है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давайте के साथ क्रिया का हम-रूप शिष्ट सुझाव बनाता है: Давайте познакомимся का अर्थ है "चलिए परिचय करें"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давайте познакомимся उस व्यक्ति से परिचय शुरू करने का शिष्ट तरीका है जिसे आप вы कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: आपसे मिलकर खुशी हुई।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Очень приятно ты और вы दोनों के साथ चलता है, क्योंकि यह सीधे सामने वाले को संबोधित नहीं करता।
    language_code: hi
    direction: ltr
