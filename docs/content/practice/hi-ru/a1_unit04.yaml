  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число नपुंसकलिंग है, इसलिए प्रश्न में какое आता है, जबकि день पुल्लिंग है और उसके साथ какой आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: तारीखों में क्रमसूचक -ое या -ье पर समाप्त होते हैं, क्योंकि वे नपुंसकलिंग число से मेल खाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: आज की तारीख क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Какое сегодня число? का शाब्दिक अर्थ है: आज कौन सा अंक/तारीख है?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: आज 3 जनवरी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '"3 जनवरी" रूसी में третье января कहा जाता है, जिसमें महीना संबंध कारक में होता है।'
    language_code: hi
    direction: ltr
