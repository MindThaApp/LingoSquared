    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: रूसी में वारों के नाम बड़े अक्षरों से नहीं लिखे जाते।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: आज कौन-सा दिन है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? सप्ताह का दिन पूछता है; तारीख पूछने के लिए Какое сегодня число? कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'तारीख में नपुंसकलिंग क्रमसूचक और संबंध कारक में महीना आता है: десятое апреля यानी अप्रैल की दसवीं तारीख।'
    language_code: hi
    direction: ltr
