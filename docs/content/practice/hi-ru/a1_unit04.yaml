    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: रूसी में वर्तमान काल में "होना" क्रिया छोड़ दी जाती है, इसलिए Сегодня суббота में बस "आज" और वार होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой पुल्लिंग день से मेल खाता है; इसीलिए आगे तारीख वाले प्रश्न में नपुंसकलिंग число के साथ какое आता है।
    language_code: hi
    direction: ltr
