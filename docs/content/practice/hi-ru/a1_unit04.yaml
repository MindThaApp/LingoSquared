templates:
- content_key: practice.hi-ru.ru.a1.unit04.lesson01.choose.001
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रूसी में वारों के नाम छोटे अक्षर से लिखे जाते हैं, और वर्तमान काल में क्रिया की ज़रूरत नहीं होती: Сегодня суббота का अर्थ है "आज शनिवार है"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson01.listen.002
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Среда, пятница और суббота स्त्रीलिंग हैं, जबकि बाकी वार पुल्लिंग या नपुंसकलिंग हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson01.match.003
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
