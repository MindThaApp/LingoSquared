    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Встреча во вторник, девятого января में पहले वार और फिर तारीख आती है, और महीना संबंध कारक में होता है।
