  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: क्रमसूचक नपुंसकलिंग (первое, третье) होता है, क्योंकि वह अंतर्निहित शब्द число (तारीख) से मेल खाता है।
    language_code: hi
    direction: ltr
