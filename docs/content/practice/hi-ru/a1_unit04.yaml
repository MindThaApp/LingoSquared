    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'रूसी में वारों के नाम बड़े अक्षर से नहीं लिखे जाते: понедельник, вторник, среда।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
