templates:
- content_key: practice.hi-ru.ru.a1.unit06.lesson01.choose.001
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мой पुल्लिंग संज्ञाओं (мой отец) के साथ और моя स्त्रीलिंग संज्ञाओं (моя мать) के साथ आता है, इसलिए परिवार के शब्द के अनुसार अधिकारसूचक शब्द बदलता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson01.match.002
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: У меня есть का शाब्दिक अर्थ "मेरे पास है" है, और रूसी में "मेरे पास है" इसी तरह कहा जाता है; мой और моя दोनों का अर्थ "मेरा/मेरी" है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мать स्त्रीलिंग है, इसलिए इसके साथ моя आता है; पुल्लिंग отец के साथ мой आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня есть के बाद कोई संज्ञा लगाना "मेरे पास ... है" कहने का सामान्य तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: ये मेरे पिता हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отец पुल्लिंग है, इसलिए अधिकारवाचक शब्द мой आता है; स्त्रीलिंग мать के साथ моя आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'रूसी में रिश्तों के नामों का व्याकरणिक लिंग होता है: мать और сестра स्त्रीलिंग हैं, отец पुल्लिंग है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Дедушка अंत में -а होने से स्त्रीलिंग जैसा लगता है, पर यह पुल्लिंग है और इसके साथ мой आता है: мой дедушка।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это моя {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Бабушка, жена और дочь तीनों स्त्रीलिंग हैं, इसलिए हर एक के साथ моя आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson02.order.003
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это мой {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это мой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дедушка, муж और сын तीनों पुल्लिंग हैं, इसलिए हर एक के साथ мой आता है, भले ही дедушка के अंत में -а हो।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: fill_in_blank
  frame:
    text: У меня есть сын и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: संयोजक и दो संज्ञाओं को जोड़ता है, जैसे сын и дочь यानी बेटा और बेटी।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson02.translate.005
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: क्या आपके बच्चे हैं? (आदरपूर्वक)
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дети हमेशा बहुवचन में होता है; У вас есть ...? किसी से आदरपूर्वक पूछने का तरीका है कि उसके पास कुछ है या नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: रूसी में हर रिश्तेदार के लिए अलग शब्द है, और "एक" या "वह" जैसा कोई उपपद शब्द नहीं होता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Эта "यह" का स्त्रीलिंग रूप है, इसलिए यह девочка के साथ आता है; पुल्लिंग रूप этот है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Эта स्त्रीलिंग संज्ञा девочка के अनुसार आता है, जबकि Кто это? में लिंग-निरपेक्ष это आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
    text: Кто это на {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Фото का अंत कभी नहीं बदलता, इसलिए На фото में भी यह фото ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: फ़ोटो में यह कौन है?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кто это? पूछता है कि कोई कौन है; На фото का अर्थ है फ़ोटो में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: और यह लड़की कौन है?
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: प्रश्न की शुरुआत में А उसे अभी कही गई बात से जोड़ता है, जैसे हिंदी में "और"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: मेरा नाम ओल्गा है।
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут के बाद पहला नाम लगाकर रूसी लोग अपना परिचय देते हैं।
    language_code: hi
    direction: ltr
