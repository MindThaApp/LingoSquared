schema_version: '1.0'
pack_key: practice.hi-ru.a1.unit40
source_language: hi
target_language: ru
unit_content_key: ru.a1.unit40.emergencies
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Hindi). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_библиотеке
    - w_внимание
    - w_выход
    - w_выходу
    - w_запасной
    - w_запасному
    - w_звоню
    - w_иди
    - w_номер
    - w_номеру
    - w_пожар
    - w_пожарные
    - w_пожарным
    - w_позвони
    - w_полиция
    - w_помощь
    - w_скорая
    - w_скорую
    - w_случилось
    - w_экстренному
    - w_экстренный
templates:
- content_key: practice.hi-ru.ru.a1.unit40.lesson01.choose.001
  lesson_content_key: ru.a1.unit40.lesson01.pomoshch_i_pozhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_помощь
        - w_пожар
        - w_экстренный
        - w_номер
        - w_позвони
        - w_экстренному
        - w_номеру
        - w_запасной
        - w_выход
        - w_полиция
        - w_звоню
        - w_скорая
        - w_скорую
        - w_пожарные
        - w_пожарным
        - w_внимание
        - w_запасному
        - w_выходу
        - w_иди
        - w_библиотеке
        - w_случилось
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} इस यूनिट के शब्दों में से एक है, जो मदद और आग वाले पाठ से लिया गया है।'
    language_code: hi
    direction: ltr
