  lesson_content_key: ru.a1.unit40.lesson05.chitaem_tekst_o_pozhare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} इस यूनिट का एक शब्द है, जो आग के बारे में पाठ पढ़ने वाले पाठ से लिया गया है।'
