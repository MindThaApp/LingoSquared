  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} इस यूनिट के शब्दों में से एक है, जो आपातकालीन नंबर और आपातकालीन निकास वाले पाठ से लिया गया है।'
    language_code: hi
    direction: ltr
