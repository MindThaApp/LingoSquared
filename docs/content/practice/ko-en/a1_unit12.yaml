templates:
- content_key: practice.ko-en.en.a1.unit12.lesson01.choose.001
  lesson_content_key: en.a1.unit12.lesson01.clothing_items
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*pants*는 바지 한 벌이어도 항상 복수형이에요. 한 벌은 *a pair of pants*, 신발 한 켤레는 *a pair of shoes*라고 해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit12.lesson02.choose.002
  lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '색은 명사 앞에 오거나(*a blue shirt*), 색을 물을 때는 *in* 뒤에 와요: *in blue*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit12.lesson04.choose.003
  lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*I''ll*은 *I will*의 줄임말로 즉석에서 내린 결정을 나타내요: *I''ll take it*. *we*는 "우리"예요(*Yes, we do*).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit12.lesson03.choose.004
  lesson_content_key: en.a1.unit12.lesson03.reading_a_label
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*size*와 *color*는 라벨에 자주 적혀 있어요. 콜론 뒤에 값이 와요(예: *Size: Medium*).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit12.lesson01.order.005
  lesson_content_key: en.a1.unit12.lesson01.clothing_items
  type: word_order
  frame:
    text: I'll take the {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I'll take the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*the*로 지금 보고 있는 바로 그 옷을 가리켜요. *I''ll take ...*는 "~로 할게요"라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit12.lesson02.order.006
  lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
