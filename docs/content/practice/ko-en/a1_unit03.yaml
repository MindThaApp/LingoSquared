templates:
- content_key: practice.ko-en.en.a1.unit03.lesson01.choose.001
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0부터 10까지의 숫자로 나이, 가격, 전화번호를 말할 수 있어요. 전화번호는 숫자 하나하나 읽어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson01.listen.002
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 들을 때 음절 수에 주의하세요. seven과 zero는 두 음절이고, 10까지의 나머지 숫자는 한 음절이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson02.choose.003
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 13부터 19까지의 영어 단어는 -teen으로 끝나고, 십의 단위는 -ty로 끝나요. thirteen과 thirty를 비교해 보세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson02.listen.004
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fifteen과 fifty는 비슷하게 들리지만 강세가 달라요. fifteen은 두 번째 음절을, fifty는 첫 번째 음절을 강하게 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson03.choose.005
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How old are you?로 나이를, How much is this?로 가격을 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson04.choose.006
  lesson_content_key: en.a1.unit03.lesson04.market_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 시장 대화에서도 앞에서 배운 같은 질문 형태로 가격과 나이를 물어요. How much ...? 그리고 How old ...?
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson03.order.007
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: word_order
  frame:
    text: It's {item} dollars.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} dollars.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 가격을 말할 때는 숫자가 명사 dollars 앞에 오고, 명사는 복수형이에요. five dollars.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson03.order.008
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: word_order
  frame:
    text: I'm {item} years old.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item} years old.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 나이는 I'm + 숫자 + years old로 말해요. 한국어에서는 "저는 ... 살이에요"처럼 숫자 뒤에 "살"이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit03.lesson03.fill.009
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: fill_in_blank
  frame:
