      language_code: en
      direction: ltr
  feedback_frame:
    text: 의사가 써 주는 처방전은 prescription이라고 해요. 앞에는 a를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson02.choose.007
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
