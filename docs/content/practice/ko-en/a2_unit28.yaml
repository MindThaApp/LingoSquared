  feedback_frame:
    text: 예약 확인 안내문에는 confirmed(확정된), today(오늘), ten minutes early(10분 일찍) 같은 말이 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson03.order.015
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: word_order
  frame:
    text: Please bring your insurance card and arrive {item} minutes early.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
