      language_code: en
      direction: ltr
  feedback_frame:
    text: 숫자 뒤에서는 minutes가 복수형이에요. ten minutes처럼요. early는 그 뒤에 오고 '일찍'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson03.fill.016
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
