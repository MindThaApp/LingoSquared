    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson02.translate.012
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: 진료를 받으려고 예약을 하고 싶어요. (I'd를 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_doctor
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 예약을 하다는 make an appointment라고 해요. I'd like to는 공손하게 원하는 것을 말하는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: 사흘째 머리와 목이 아프고, 점점 심해지고 있어요. (줄임형을 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: For는 기간('사흘 동안')을 나타내요. 현재완료 I've had와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson03.choose.014
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
