      text: Your appointment is confirmed for 3pm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '''오늘''은 today이고 문장 끝에 와요. 오후 3시는 영어로 3pm이라고 써요.'
    language_code: ko
    direction: ltr
