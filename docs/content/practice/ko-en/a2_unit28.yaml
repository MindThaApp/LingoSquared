    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_had
    hint:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_had
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I've had로 지금까지 계속되고 있는 증상을 말해요. for three days와 함께 쓰는 현재완료예요.
    language_code: ko
    direction: ltr
