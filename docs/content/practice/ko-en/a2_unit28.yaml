      agreement_tags:
        semantic:
        - w_see
        - w_doctor
        - w_had
        - w_three
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: To see a doctor는 '진료를 받으러 가다'라는 뜻이에요. see는 여기서 '만나다, 찾아가다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson02.listen.008
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
