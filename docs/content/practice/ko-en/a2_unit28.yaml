    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit28.lesson03.translate.018
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: translation
  frame:
    text: 예약이 오늘 오후 3시로 확정되었어요. (시간은 "3pm"으로 쓰세요)
