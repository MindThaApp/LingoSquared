schema_version: '1.0'
pack_key: practice.ko-en.a1.unit62
source_language: ko
target_language: en
unit_content_key: en.a1.unit62.phone_calls
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_asked
    - w_back
    - w_call
    - w_called
    - w_leave
    - w_message
    - w_phone
    - w_repeat
    - w_said
    - w_slowly
    - w_voicemail
    - w_wrote
templates:
- content_key: practice.ko-en.en.a1.unit62.lesson01.choose.001
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_voicemail
        - w_message
        - w_phone
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Phone, call, message, voicemail은 전화 통화의 핵심 단어예요. call은 명사도 되고 동사도 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson04.choose.002
  lesson_content_key: en.a1.unit62.lesson04.phone_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic:
        - w_called
        - w_asked
        - w_said
        - w_wrote
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Called, asked, said, wrote는 과거형이에요. said와 wrote는 불규칙 동사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson02.order.003
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please {item} that.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeat
  answer_derivation:
    kind: render_frame
    frame:
      text: Please {item} that.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Please repeat that은 다시 말해 달라는 공손한 부탁이에요. please 뒤에는 어미 없는 동사가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson02.order.004
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please speak {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_slowly
  answer_derivation:
    kind: render_frame
    frame:
      text: Please speak {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Slowly는 동사 speak 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson01.fill.005
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: fill_in_blank
  frame:
    text: Please leave a {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_message
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Leave a message는 '메시지를 남기다'라는 뜻의 굳어진 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson02.fill.006
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: fill_in_blank
  frame:
    text: I will call {item} later. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_back
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Call back은 '다시 전화하다'라는 뜻이에요. back은 동사 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson02.translate.007
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: translation
  frame:
    text: 천천히 말해 주세요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_slowly
  answer_derivation:
    kind: render_frame
    frame:
      text: Please speak {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 영어에서는 이 부탁에 한국어 같은 높임말이 따로 없어요. please speak slowly면 충분해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson04.translate.008
  lesson_content_key: en.a1.unit62.lesson04.phone_message
  type: translation
  frame:
    text: 미아가 3시에 전화했어요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_called
  answer_derivation:
    kind: render_frame
    frame:
      text: Mia {item} at 3:00.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Called는 call의 과거형이고, at은 시각 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit62.lesson01.match.009
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_leave
        - w_voicemail
        - w_message
        - w_repeat
        - w_slowly
        - w_back
        - w_asked
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 이 단어들은 전화 통화와 관련 있어요. 전화하다, 남기다, 메시지, 되풀이하다, 천천히, 다시(back)예요.
    language_code: ko
    direction: ltr
