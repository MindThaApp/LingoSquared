    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*almost*는 "거의"라는 뜻이에요. *almost over*는 곧 끝난다는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson03.fill.011
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
