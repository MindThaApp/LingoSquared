    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*because*는 이유를 이끌어요. 영어에서는 주절과 같은 어순을 그대로 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson02.fill.010
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: fill_in_blank
  frame:
    text: The class is {item} over. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
