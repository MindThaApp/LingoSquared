templates:
- content_key: practice.ko-en.en.a1.unit13.lesson01.choose.001
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*I''m* 뒤에는 기분을 나타내는 형용사가 와요: *I''m happy*, *I''m tired*. 한국어 "기뻐요"처럼 형용사만으로 말할 수 있어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson02.choose.002
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*because*는 이유를 이끌어요. 영어에서는 보통 어순 그대로 써요: *I''m happy because the class is almost over*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson03.choose.003
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 여기서 *last*는 "마지막의"라는 뜻이에요. *it's the last one this year*는 올해의 마지막 시험이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson04.choose.004
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*Oh, I understand*는 이해했고 공감한다는 뜻을 전해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson01.order.005
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: word_order
  frame:
    text: I'm {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*I''m* 뒤에는 관사 없이 형용사가 와요: *I''m happy*, *I''m sad*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson03.order.006
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: word_order
  frame:
    text: The {item} is worried and excited.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is worried and excited.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*the writer*는 메시지를 쓴 사람이에요. 요약할 때는 3인칭으로 *is*를 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson04.order.007
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: word_order
  frame:
    text: Oh, I {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*I understand*는 "알겠어요"라는 뜻이에요. *understand*는 진행형으로 쓰지 않아요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson01.fill.008
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: fill_in_blank
  frame:
    text: I'm {item}. I have a big test tomorrow. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*worried*는 "걱정되는"이라는 뜻이에요. 이유는 다음 문장이나 *because* 뒤에 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson02.fill.009
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: fill_in_blank
  frame:
