    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 여기서 *last*는 "마지막의"라는 뜻이에요. *the last one this year*는 올해의 마지막 시험이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson01.match.012
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '*happy*, *sad*, *tired*, *excited*, *worried*는 감정이고, *test*, *class*, *year*는 예문 속 이유와 관련된 말이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson01.translate.013
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*I''m* 뒤에 감정이 형용사로 와요. 예: *I''m tired*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson02.translate.014
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*test*는 시험, *class*는 수업이에요. *almost*는 "거의"라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson03.translate.015
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*writer*는 글을 쓰는 사람이에요. 예문에서는 메시지를 보낸 사람이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson01.translate.016
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: translation
  frame:
    text: 저는 피곤해요. (줄임말을 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*I''m*은 *I am*의 줄임말이고, *tired*는 상태를 나타내요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson02.translate.017
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: translation
  frame:
    text: 저는 조금 걱정돼요. (줄임말을 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm a {item} worried.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '형용사 앞의 *a little*은 감정의 정도를 약하게 해요: *a little worried*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit13.lesson04.translate.018
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: translation
  frame:
    text: 아, 알겠어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 문장 앞의 *Oh*는 이해나 놀람을 나타내요. *I* 뒤에서 *understand*에는 -s가 붙지 않아요.
    language_code: ko
    direction: ltr
