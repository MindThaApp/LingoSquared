templates:
- content_key: practice.ko-en.en.a1.unit14.lesson01.choose.001
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 여기서 *free*는 "시간이 비어 있는"이라는 뜻이에요. *Are you free tonight?*는 시간이 있는지 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson02.choose.002
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*Sorry, can you repeat that?*은 다시 말해 달라는 공손한 부탁이에요. *sorry*로 시작해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson03.choose.003
  lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*meeting*은 "만남"이나 "회의"라는 뜻이고, *place*는 만나는 장소예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson04.choose.004
  lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*How about ...?*은 제안하는 말이에요. 뒤에 시간이나 장소가 와요: *How about 6pm?*'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson01.order.005
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: word_order
  frame:
    text: Are you {item} tonight?
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Are you {item} tonight?
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*Are you free?*는 상대방이 시간이 있는지 묻는 기본 질문이에요. *tonight*은 문장 끝에 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson02.order.006
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: word_order
  frame:
    text: Can you speak more {item}, please?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Can you speak more {item}, please?
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*more slowly*는 "더 천천히"라는 뜻이에요. 부사는 *more* 뒤에 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson03.order.007
  lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
  type: word_order
  frame:
    text: This message is to {item} a meeting time and place.
    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: This message is to {item} a meeting time and place.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*to suggest*는 "제안하다"라는 뜻이에요. 요약에서 메시지의 목적을 말해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson04.order.008
  lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
  type: word_order
  frame:
    text: How {item} 6pm at the cafe?
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: How {item} 6pm at the cafe?
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*How about ...?*은 제안을 해요. 뒤에 시간이나 장소가 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson01.fill.009
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: fill_in_blank
  frame:
    text: Are you free {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*tonight*은 "오늘 저녁"이라는 뜻이에요. 영어에서는 앞에 전치사를 붙이지 않아요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson02.fill.010
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: fill_in_blank
  frame:
