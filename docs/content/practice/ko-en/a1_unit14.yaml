    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*repeat that*은 "그걸 다시 말하다"라는 뜻이에요. *can you ...?*로 공손한 부탁이 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson02.fill.011
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: fill_in_blank
  frame:
    text: I can't hear you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*well*은 *good*의 부사형이에요. *I can''t hear you well*은 연결이 안 좋아서 잘 안 들린다는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit14.lesson01.match.012
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '*sorry*, *repeat*, *speak*, *slowly*, *hear*는 전화에서 도움이 되는 말이고, *message*, *suggest*, *meeting*은 약속 잡기와 관련된 말이에요.'
    language_code: ko
    direction: ltr
