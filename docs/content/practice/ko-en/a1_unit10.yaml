templates:
- content_key: practice.ko-en.en.a1.unit10.lesson01.choose.001
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*Turn left*와 *Turn right*는 *you* 없이 쓰는 명령문이에요. 한국어 "왼쪽으로 도세요"처럼 주어를 말하지 않아도 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson02.choose.002
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*can''t*는 *cannot*의 줄임말이에요. *You can''t miss it*은 목적지를 놓칠 수가 없다는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson03.choose.003
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*first*와 *second*는 순서를 나타내는 말이에요. 명사 앞에 *the*와 함께 써요: *the first street*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson01.order.004
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: word_order
  frame:
    text: Turn {item} at the corner.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item} at the corner.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*Turn* 뒤의 *left*와 *right*에는 관사가 없어요. 반면 *on the left*처럼 *on the*가 앞에 오면 위치하는 쪽을 나타내요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson02.order.005
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: word_order
  frame:
    text: It's just two {item} from here.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's just two {item} from here.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*minutes*는 *minute*의 복수형이에요. *two* 같은 숫자 뒤에는 복수형을 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson03.order.006
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: word_order
  frame:
    text: Take the {item} street on the left.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the {item} street on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*first*, *second* 같은 순서를 나타내는 말은 명사 앞에 *the*와 함께 써요: *the first street*, *the second street*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson01.fill.007
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: fill_in_blank
  frame:
    text: Turn left at the {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*at the corner*는 "모퉁이에서"라는 뜻이에요. *at*으로 방향을 바꾸는 지점을 말해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson02.fill.008
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: You can't {item} it. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 여기서 *miss*는 "놓치다"라는 뜻이에요. *You can't miss it*은 목적지가 눈에 잘 띌 때 자주 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson02.fill.009
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: How do I {item} to the bank? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*get to*는 "~에 도착하다, 가다"라는 뜻이에요. *How do I get to ...?*는 길을 물을 때 쓰는 흔한 질문이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson03.fill.010
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: fill_in_blank
  frame:
    text: Take the first {item} on the left. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*street*은 길이에요. 어느 쪽인지 말하므로 문장에서는 *on the left*처럼 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson01.match.011
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 이 게임의 단어들은 길 안내를 나타내요. *turn*, *left*, *right*, *straight*, *stop*은 안내이고, *corner*와 *street*은 장소예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson01.translate.012
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*left*와 *right*는 *turn* 뒤에 와요: *Turn left*, *Turn right*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson02.translate.013
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 여기서 *get*은 "도착하다"라는 뜻이고, *minutes*는 *minute*의 복수형이며, *miss*는 "놓치다"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson03.translate.014
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*Take the first street*는 "첫 번째 길로 가세요"라는 뜻이에요. 영어에서 *directions*는 복수형으로 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson01.translate.015
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: 왼쪽으로 도세요.
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*Turn left*는 짧은 명령문이에요. *you*나 관사는 필요 없어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson02.translate.016
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: 쉽게 찾으실 거예요. (줄임말을 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: You can't {item} it.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*can''t*는 *cannot*의 줄임말이고, 여기서 *miss*는 "놓치다"라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit10.lesson03.translate.017
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: 왼쪽 첫 번째 길로 가세요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the first {item} on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '영어에서 *on the left*는 명사 뒤에 와요: *the first street on the left*. 한국어는 "왼쪽 첫 번째 길"처럼 꾸미는 말이 명사 앞에 와요.'
    language_code: ko
    direction: ltr
