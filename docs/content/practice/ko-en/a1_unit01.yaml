templates:
- content_key: practice.ko-en.en.a1.unit01.lesson01.choose.001
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 영어에는 하루 종일 쓸 수 있는 "안녕하세요" 같은 인사가 없어요. 시간대에 따라 good morning, good afternoon, good evening 중에서 골라 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson01.listen.002
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hello는 중립적인 인사예요. good morning, good afternoon, good evening은 시간대에 따라 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.choose.003
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How are you?는 안부를 묻는 일반적인 질문이에요. 친구에게나 낯선 사람에게나 똑같이 쓰고, 존댓말과 반말의 구분이 따로 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.listen.004
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I'm fine, thanks. 다음에는 되묻는 And you?가 자주 따라와요. not bad는 편하고 소탈한 대답이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson05.choose.005
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nice to meet you는 처음 만났을 때 하는 말이고, 이에 대한 대답은 Nice to meet you too예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson05.listen.006
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: See you later는 같은 날 그 사람을 다시 만날 때 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson01.order.007
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: word_order
  frame:
    text: Good {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Good {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 인사는 시간대에 따라 달라져요. morning은 정오쯤까지, afternoon은 그 이후, evening은 저녁에 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson01.match.008
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Thanks는 "고마워요"의 편한 줄임 표현이에요. fine과 bad는 어떻게 지내는지를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.fill.009
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: How are {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 영어의 you는 존댓말과 반말 구분 없이 쓰여요. 그래서 How are you?는 어떤 상황에서도 똑같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.fill.010
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: Not {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Not bad는 직역하면 "나쁘지 않아요"예요. 안부 질문에 겸손하게 답할 때 즐겨 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.order.011
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: word_order
  frame:
    text: I'm {item}, thanks.
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm은 I am의 줄임말이에요. How are you?에는 fine이나 good으로 대답해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson05.order.012
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: word_order
  frame:
    text: See you {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you later를 직역하면 "나중에 봐요"이고, "이따 봐요"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson05.fill.013
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: fill_in_blank
  frame:
    text: Nice to meet you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Too는 문장 끝에 오고 "~도"라는 뜻이에요. Nice to meet you라는 인사에 이렇게 같은 말로 답해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson01.translate.014
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 영어에서 인사와 작별은 시간대에 따라 달라져요. Goodbye는 중립적인 작별 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.translate.015
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: not은 뒤에 오는 말을 부정해요. not bad는 "나쁘지 않아요"이고, thanks는 "고마워요"의 편한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson03.translate.016
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: 어떻게 지내? (편하게)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: How are {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 영어에는 존댓말과 반말에 해당하는 you가 따로 없고 하나뿐이에요. 그래서 이 문장은 어떤 상황에서도 쓸 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson05.translate.017
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: 이따 봐요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you에 "나중에"라는 뜻의 단어를 붙이면 "이따 봐요"라는 작별 인사가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit01.lesson05.translate.018
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 동사 meet은 "만나다"라는 뜻이에요. have a good day는 다정한 작별 인사예요.
    language_code: ko
    direction: ltr
