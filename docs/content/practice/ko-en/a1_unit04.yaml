templates:
- content_key: practice.ko-en.en.a1.unit04.lesson01.choose.001
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 영어에서는 요일 이름을 항상 대문자로 써요. Monday, Tuesday, Wednesday. 한글에는 대소문자 구분이 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson01.listen.002
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 모든 요일은 -day로 끝나요. Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson02.choose.003
  lesson_content_key: en.a1.unit04.lesson02.months
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 영어에서는 달 이름도 대문자로 써요. January, March, July.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 영어 달 이름은 강세가 오는 위치에 주의해서 들어야 해요. 어느 음절이 강하게 들리는지 잘 들어 보세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 날짜에는 July 7th처럼 서수를 써요. when's로는 언제 일어나는지 물어요. 예를 들어 When's your birthday?
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson04.choose.006
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Open은 "열다" 또는 "열려 있다"를 뜻할 수 있어요. When's the library open again?처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson02.order.007
  lesson_content_key: en.a1.unit04.lesson02.months
  type: word_order
  frame:
    text: Which {item} is it?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Which {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Which는 한정된 것들 중에서 고르는 질문에 써요. 여기서는 열두 달 중에서 고르는 질문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit04.lesson03.order.008
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: word_order
  frame:
    text: My birthday is {item} 3rd.
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: My birthday is {item} 3rd.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 영어에서는 날짜를 월, 일 순서로 말해요. March 3rd. 한국어의 "3월 3일"과 같은 순서예요.
    language_code: ko
    direction: ltr
