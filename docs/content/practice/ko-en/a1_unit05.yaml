templates:
- content_key: practice.ko-en.en.a1.unit05.lesson01.choose.001
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 정각에는 It's three o'clock이라고 말해요. 30분일 때는 half past를 쓰고, 직역하면 "~시 지나서 반"이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit05.lesson01.listen.002
