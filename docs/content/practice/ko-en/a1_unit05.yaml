    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Half past three는 3:30이에요. 한국어의 "3시 반"과 같은 방식으로, 마지막 정각에서부터 세요.
    language_code: ko
    direction: ltr
