templates:
- content_key: practice.ko-en.en.a1.unit11.lesson01.choose.001
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '영어에서는 *it*으로 날씨를 말해요: *It''s sunny*, *It''s cold*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.choose.002
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*raining*은 진행형이고 지금 일어나고 있는 일을 나타내요: *It''s raining*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson03.choose.003
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*will*로 미래를 나타내요. *will* 뒤에는 동사 원형이 와요: *It will rain*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson04.choose.004
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*but*은 서로 반대되는 두 말을 이어 주고, *so*는 결과를 이끌어요: *It''s going to rain, so let''s go today*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson01.order.005
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: word_order
  frame:
    text: It's {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 날씨는 *It's*와 형용사로 말하고, *today*는 문장 끝에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.order.006
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: word_order
  frame:
    text: You should take an {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: You should take an {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*should*는 조언을 나타내고 *take*는 동사 원형이에요. 모음 앞에서는 *a* 대신 *an*을 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson03.order.007
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: word_order
  frame:
    text: It will {item} on Saturday.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} on Saturday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*will* 뒤에는 -s가 붙지 않는 동사 원형이 와요: *It will rain*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.fill.008
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: It's {item} and warm. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*sunny*는 "화창한"이라는 뜻으로, *sun*(해)에서 나온 말이에요. *sunny and warm*은 자주 쓰는 조합이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.fill.009
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: What's the {item} like today? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*What''s the weather like?*는 날씨를 묻는 말이에요. *what''s*는 *what is*의 줄임말이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson03.fill.010
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: fill_in_blank
  frame:
    text: It {item} rain on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*will*은 미래를 나타내요. *It will rain*이라고 하고, *It will rains*라고 하지 않아요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson04.fill.011
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: fill_in_blank
  frame:
    text: It's going to rain on Saturday, {item} let's go today. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*so*는 결과를 이끌어요: 토요일에 비가 오니까 오늘 가요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson01.match.012
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '*sunny*, *rainy*, *cloudy*, *windy*, *cold*, *hot*, *warm*은 날씨를 나타내는 형용사이고, *umbrella*는 우산이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson01.translate.013
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '날씨 형용사는 *It''s* 뒤에 와요: *It''s hot*, *It''s cold*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.translate.014
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*weather*는 날씨, *umbrella*는 우산이에요. *should*로 조언해요: *You should take an umbrella*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson04.translate.015
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '*but*은 "그런데", *so*는 "그래서", *idea*는 "생각"이라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.translate.016
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: 지금 비가 와요. (줄임말을 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*It''s raining*은 지금 일어나는 일을 말해요. 예보에는 *will*을 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson02.translate.017
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: 오늘 날씨 어때요? (줄임말과 *like*를 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: What's the {item} like today?
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*What''s the weather like?*는 날씨를 물어요. 여기서 *like*는 "어떤"이라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit11.lesson03.translate.018
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: translation
  frame:
    text: 내일 비가 올 거예요. (*will*을 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} tomorrow.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*will* + 동사 원형으로 미래를 나타내요: *It will rain tomorrow*.'
    language_code: ko
    direction: ltr
