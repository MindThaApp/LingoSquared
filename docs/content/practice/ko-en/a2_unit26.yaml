    text: On the other hand는 '다른 한편으로는'에 해당해요. 글자 그대로는 '다른 쪽 손에서는'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson01.translate.005
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
