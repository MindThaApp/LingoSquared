        - w_space
        - w_run
        - w_idea
        - w_good
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 모음에 귀를 기울이세요. dog는 짧은 모음이고 park는 긴 모음이며, park에서는 r 소리가 또렷하게 들려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.order.009
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: word_order
  frame:
    text: What do you think {item} the new dog park?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_about
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think {item} the new dog park?
      language_code: en
      direction: ltr
  feedback_frame:
    text: think 뒤에 about으로 대상을 말해요. What do you think about …?는 '~에 대해 어떻게 생각해요?'에 해당해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.fill.010
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: fill_in_blank
  frame:
    text: I think it's a {item} idea because dogs need space to run. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
    hint:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A good idea에서는 명사 앞에 a를 써요. good의 비교급은 gooder가 아니라 better예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.translate.011
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
