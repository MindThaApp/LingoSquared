      text: On the other hand, it's {item} close to the playground.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Very는 close의 뜻을 강하게 해요. '아주 가까이'와 같은 순서로 very close라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson03.translate.016
