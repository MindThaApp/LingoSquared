    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_playground
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's very close to the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Close to the playground는 '놀이터 가까이'라는 뜻이에요. 영어에서는 close 뒤에 to를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson04.choose.018
