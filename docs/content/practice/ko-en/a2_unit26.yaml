    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.translate.012
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: 새 개 공원에 대해 어떻게 생각하세요? (think를 사용하세요)
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_park
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think about the new dog {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: '''~에 대해 어떻게 생각하세요?''는 영어로 What do you think about …?예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: 개들이 뛸 공간이 필요하니까 좋은 생각이라고 생각해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
    frame:
      text: I think it's a good {item} because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '''~라고 생각해요'' 대신 I think라고 하고, 이유는 because로 이어 붙여요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson03.choose.014
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
