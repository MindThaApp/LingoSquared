      - adjective
      agreement_tags:
        semantic:
        - w_think
        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: opinion은 가운데에 n이 하나만 들어가고 -ion으로 끝나요. agree는 e가 두 개예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: 내 의견으로는 새 개 공원은 개들이 뛸 공간이 필요하니까 좋은 생각이에요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion은 문장 맨 앞에 오고, 나머지 문장과는 쉼표로 구분해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.choose.007
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - preposition
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_idea
        - w_space
        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 개 공원에 대한 대화에는 dog, park, space, 그리고 동사 run이 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson02.listen.008
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: listen_select
