  feedback_frame:
    text: Playground는 play와 ground가 합쳐진 말이에요. 한국어 '놀이터'가 '놀이'와 '터'로 이뤄진 것과 비슷해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a2.unit26.lesson03.translate.017
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
