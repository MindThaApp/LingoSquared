    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: comparative_adj
  superlative_adj: &id002
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: superlative_adj
  color: &id003
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: color
