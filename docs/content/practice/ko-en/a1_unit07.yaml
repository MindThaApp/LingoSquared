templates:
- content_key: practice.ko-en.en.a1.unit07.lesson01.choose.001
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Water와 bread는 셀 수 없는 물질 이름이에요. 영어로는 some water라고 하지만, 한 잔이나 하나를 주문할 때는 a coffee, a sandwich라고 해요. 한국어에는 이런 관사가 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit07.lesson01.listen.002
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 영어에서는 coffee와 tea를 주문할 때 a를 붙여서 말하는 경우가 많아요. I'd like a coffee, please.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit07.lesson02.choose.003
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anything else?는 주문 후에 카페에서 흔히 듣는 질문이에요. No, that's all.처럼 대답할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit07.lesson02.listen.004
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Please는 부탁을 공손하게 만들고, 문장 끝에 자주 와요. I'd like a coffee, please.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit07.lesson04.choose.005
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: multiple_choice
