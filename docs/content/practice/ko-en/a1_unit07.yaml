  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 여기서 Sure는 "그럼요"라는 뜻이에요. Sure. Anything else?라고 하면 점원이 친절하게 주문을 확인하고 더 필요한 게 있는지 물어요.
    language_code: ko
    direction: ltr
