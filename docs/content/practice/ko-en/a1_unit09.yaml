templates:
- content_key: practice.ko-en.en.a1.unit09.lesson01.choose.001
  lesson_content_key: en.a1.unit09.lesson01.common_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*hospital*, *pharmacy*, *restaurant*는 명사예요. 영어에서는 앞에 *the*나 *a*를 붙여요: *the hospital*, *a restaurant*.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit09.lesson02.choose.002
  lesson_content_key: en.a1.unit09.lesson02.location_prepositions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*across from*은 "맞은편에", *next to*는 "옆에"라는 뜻이에요. 둘 다 기준이 되는 장소 앞에 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit09.lesson03.choose.003
  lesson_content_key: en.a1.unit09.lesson03.asking_where
