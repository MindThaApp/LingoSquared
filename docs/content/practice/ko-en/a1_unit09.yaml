  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*where*는 장소를 물어요: *Where is the bank?* 동사 *is*는 *where* 뒤에 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit09.lesson04.choose.004
