  lesson_content_key: en.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: The {item} is next to the pharmacy.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is next to the pharmacy.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*next to*는 "옆에"라는 뜻이에요. 이 단원의 지도에서는 *bank*와 *park*가 둘 다 *pharmacy* 옆에 있어요.'
    language_code: ko
    direction: ltr
