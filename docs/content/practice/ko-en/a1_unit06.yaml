templates:
- content_key: practice.ko-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parents와 siblings는 영어에서 복수형이에요. 일상에서는 단수형 sibling 대신 보통 brother나 sister라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: mother, father, brother에는 th 소리가 있어요. 혀끝을 윗니와 아랫니 사이에 살짝 내밀고 소리 내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother와 grandfather는 grand-에 mother나 father가 붙은 말이에요. grand-는 한 세대 위를 나타내는 앞부분이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child는 단수형이고 복수형은 children이에요. brothers는 brother의 복수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson04.choose.005
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Who는 사람을 묻는 말이에요. Who is this? 사물에는 what을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: His는 남자에게, her는 여자에게 써요. his sister는 남자의 자매이고, her sister는 여자의 자매예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: word_order
  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 영어에서는 two 뒤에 복수형을 써요. two brothers, two brother는 틀려요. 한국어는 "두 명"처럼 명사 모양이 변하지 않지만 영어는 달라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson04.order.008
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: word_order
  frame:
