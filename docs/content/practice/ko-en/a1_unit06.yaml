    frame:
      text: Is this your {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Your는 명사 앞에 와요. Is this your family?처럼 예/아니요 질문에서는 is가 this 앞에 와요.
    language_code: ko
    direction: ltr
