    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: His는 남자를 가리켜요. 여기서는 대니얼이에요. 여자라면 her를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-en.en.a1.unit06.lesson03.fill.010
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: fill_in_blank
  frame:
    text: Do you have {item} siblings? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 질문과 부정문에서는 any를 쓰고, 긍정문에서는 some을 써요. Do you have any siblings? 한국어에는 이런 구분이 없어요.
    language_code: ko
    direction: ltr
