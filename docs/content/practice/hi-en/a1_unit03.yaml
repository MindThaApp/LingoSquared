templates:
- content_key: practice.hi-en.en.a1.unit03.lesson01.choose.001
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शून्य से दस तक की संख्याओं से आप उम्र, दाम और फ़ोन नंबर बताते हैं; फ़ोन नंबर एक-एक अंक करके बोला जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit03.lesson01.listen.002
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सुनते समय अक्षरों की गिनती पर ध्यान दीजिए: seven और zero में दो अक्षर (syllable) हैं, दस तक की बाक़ी संख्याओं में सिर्फ़ एक।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit03.lesson02.choose.003
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'तेरह से उन्नीस तक की संख्याएँ अंग्रेज़ी में -teen पर ख़त्म होती हैं और दहाइयाँ -ty पर: thirteen और thirty.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit03.lesson02.listen.004
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fifteen और fifty सुनने में मिलते-जुलते हैं, पर ज़ोर अलग जगह पड़ता है: fifteen में दूसरे हिस्से पर, fifty में पहले पर।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit03.lesson03.choose.005
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: multiple_choice
