  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How old are you? से आप उम्र पूछते हैं, और How much is this? से दाम।
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit03.lesson04.choose.006
  lesson_content_key: en.a1.unit03.lesson04.market_dialogue
