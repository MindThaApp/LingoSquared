    slot: item
  feedback_frame:
    text: 'अंग्रेज़ी में "नमस्ते" की तरह पूरे दिन चलने वाला एक रूप नहीं है: समय के हिसाब से आप good morning, good afternoon या good evening चुनते हैं।'
    language_code: hi
    direction: ltr
