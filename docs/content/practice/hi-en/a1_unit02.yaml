templates:
- content_key: practice.hi-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
