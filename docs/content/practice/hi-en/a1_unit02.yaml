  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'What''s, what is का छोटा रूप है और नाम पूछने वाले सवाल की शुरुआत करता है: What''s your name?'
    language_code: hi
    direction: ltr
