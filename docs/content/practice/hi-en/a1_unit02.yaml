  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Your और my अधिकार बताने वाले शब्द हैं: my name यानी मेरा नाम, your name यानी आपका या तुम्हारा नाम, क्योंकि अंग्रेज़ी में "आप" और "तुम" का फ़र्क़ नहीं होता।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
