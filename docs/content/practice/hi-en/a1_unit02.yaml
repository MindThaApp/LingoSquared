    slot: item
  feedback_frame:
    text: 'अंग्रेज़ी में पेशे से पहले आमतौर पर a या an लगता है: a student, a teacher, पर an engineer, क्योंकि अगला शब्द स्वर से शुरू होता है।'
    language_code: hi
    direction: ltr
