  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother और grandfather, grand- और mother या father से बने हैं; हिंदी में यह दादी/नानी और दादा/नाना जैसा रिश्ता है, यानी एक पीढ़ी ऊपर।
    language_code: hi
    direction: ltr
