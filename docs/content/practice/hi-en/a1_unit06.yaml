    slot: item
  feedback_frame:
    text: अंग्रेज़ी में parents और siblings बहुवचन रूप हैं; रोज़ की बातचीत में sibling की जगह आम तौर पर brother या sister कहा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit06.lesson01.listen.002
