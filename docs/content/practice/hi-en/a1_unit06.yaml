    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: mother, father और brother में th की आवाज़ है, जिसे बोलते समय जीभ की नोक दाँतों के बीच रखी जाती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit06.lesson02.choose.003
