  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अंग्रेज़ी में दिनों के नाम हमेशा बड़े अक्षर से शुरू होते हैं: Monday, Tuesday, Wednesday.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit04.lesson01.listen.002
