    slot: item
  feedback_frame:
    text: 'सभी दिनों के नाम -day पर ख़त्म होते हैं: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday और Sunday.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit04.lesson02.choose.003
