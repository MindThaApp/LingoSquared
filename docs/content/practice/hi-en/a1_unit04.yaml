    slot: item
  feedback_frame:
    text: 'महीनों के नाम भी अंग्रेज़ी में बड़े अक्षर से शुरू होते हैं: January, March, July.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कई अंग्रेज़ी महीनों के नाम हिंदी में बोले जाने वाले नामों से मिलते-जुलते हैं, पर ज़ोर अक्सर अलग अक्षर पर पड़ता है; ज़ोर वाले अक्षर पर ध्यान से कान दीजिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'तारीख़ में अंग्रेज़ी में क्रमसूचक संख्याएँ आती हैं: July 7th. When''s से आप पूछते हैं कि कोई चीज़ कब होती है, जैसे When''s your birthday?'
    language_code: hi
    direction: ltr
