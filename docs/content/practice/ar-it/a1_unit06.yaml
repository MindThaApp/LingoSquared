    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'جمع sorella هو sorelle: تتحول النهاية -a إلى -e.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: لدي أخ واحد وأخت واحدة.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho تعني «لدي»؛ استعمل un قبل الاسم المذكر وuna قبل الاسم المؤنث.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: هل لديك إخوة أو أخوات؟ (غير رسمي، tu)
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai هي صيغة المخاطب غير الرسمية tu من فعل «يملك»، لذا هذا السؤال يُوجَّه إلى صديق أو زميل.
    language_code: ar
    direction: rtl
