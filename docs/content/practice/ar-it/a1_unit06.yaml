templates:
- content_key: practice.ar-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'مع صفة الملكية تُحذف أداة التعريف قبل أسماء العائلة المفردة: mio padre, mia madre.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تنتهي padre وmadre كلتاهما بـ -e لكنهما مختلفتان في الجنس، لذا احفظ كل كلمة مع جنسها؛ أما nonno وnonna فتنتهيان بـ -o وبـ -a.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo وmio للمذكر، لذلك تأتيان مع اسم مذكر: questo è mio padre.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa وmia للمؤنث وتتفقان مع madre: هذه أمي.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: هذه أمي.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: استعمل questa وmia مع الاسم المؤنث، وquesto وmio مع الاسم المذكر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Madre وpadre، وfratello وsorella، وnonno وnonna هي أزواج من كلمات العائلة بين المذكر والمؤنث.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli هي جمع fratello، ويمكن أن تعني أيضًا الإخوة والأخوات.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito وmoglie تعنيان الزوج والزوجة؛ وتنتهي moglie بـ -e لكنها مؤنثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'يأتي Un مع الاسم المذكر وUna مع الاسم المؤنث: un fratello, una sorella.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
