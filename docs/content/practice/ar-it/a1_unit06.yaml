  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli تعني الأبناء بوجه عام؛ أما figlio وfiglia فتدلان على ابن أو ابنة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تُستعمل Maschio وfemmina للدلالة على ولد وبنت في العائلة.
    language_code: ar
    direction: rtl
