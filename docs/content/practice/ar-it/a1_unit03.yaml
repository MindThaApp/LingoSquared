    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hai هي صيغة المخاطَب tu من avere؛ ومع Lei يكون السؤال Quanti anni ha?
    language_code: ar
    direction: rtl
