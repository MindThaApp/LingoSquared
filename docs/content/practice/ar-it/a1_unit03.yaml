      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Costa مفرد، لذا تناسب غرضًا واحدًا: Quanto costa un cornetto? ومع عدة أغراض تقول costano.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson02.fill.004
