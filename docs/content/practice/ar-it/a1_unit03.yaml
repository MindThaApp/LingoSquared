  feedback_frame:
    text: 'لا يحتاج Quanto costa? إلى فعل مساعد: quanto تعني «كم» وcosta تعني «يكلّف».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson03.choose.001
