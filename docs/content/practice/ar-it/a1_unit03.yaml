  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في Caffè يقع النبر على المقطع الأخير، وتدلّ عليه علامة النبر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson02.order.003
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
