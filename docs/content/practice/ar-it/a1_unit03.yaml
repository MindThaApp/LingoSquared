    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في sette وotto حرف t مضاعف؛ أطِل نطقه قليلًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson01.order.003
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: word_order
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'تعبّر الإيطالية عن العمر بالفعل avere أي «يملك»: ho cinque anni تعني حرفيًا «عندي خمس سنوات».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson01.fill.004
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
