    slot: item
  feedback_frame:
    text: Cinquanta تعني خمسين؛ وعقود الإيطالية تنتهي بـ -anta ابتداءً من الأربعين.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson02.translate.006
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
