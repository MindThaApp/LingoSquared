    text: الأعداد من صفر إلى عشرة هي اللبنات الأساسية؛ وتُبنى منها لاحقًا الأعداد من 11 إلى 19 والعقود.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson01.translate.006
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: translation
  frame:
    text: عمري {age} سنة.
    language_code: ar
    direction: rtl
    slot_rendering:
      age: english_gloss
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'لا تستعمل sono للتعبير عن العمر: Ho dieci anni وليس Sono dieci anni.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson02.choose.001
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
