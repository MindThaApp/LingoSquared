    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ne تعني «منه» أو «منها» أو «منهم»: Ne vorrei tre تعني «أودّ ثلاثة منها».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit03.lesson02.listen.002
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
