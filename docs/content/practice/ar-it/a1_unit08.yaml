  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele هي جمع mela: الأسماء المؤنثة المنتهية بـ -a تكوّن جمعها بـ -e.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson01.listen.002
