    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: سعرها ثلاثة يورو للكيلوغرام.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'بعد العدد تبقى كلمة euro على حالها في الإيطالية: tre euro.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: أودّ كيلوغرامًا من التفاح، من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'تربط Di الكمية بالشيء المقصود: un chilo di mele.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson01.translate.010
