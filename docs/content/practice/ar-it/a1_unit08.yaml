    slot: item
  feedback_frame:
    text: Lo prendo تعني «سآخذه»؛ ويشير lo إلى غرض مذكر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson03.listen.003
