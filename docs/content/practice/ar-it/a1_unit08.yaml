  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele وbanane وpomodori وpatate كلها بصيغة الجمع هنا، لأن المتسوقين يشترونها بالكيلوغرام.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson03.choose.002
