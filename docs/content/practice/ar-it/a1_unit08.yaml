    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo تعني «ه» (ضمير المفعول به) وتأتي قبل الفعل: lo prendo.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
