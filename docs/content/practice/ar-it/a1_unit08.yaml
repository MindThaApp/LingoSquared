    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: تُستعمل Le مع الأسماء المؤنثة الجمع، وcostano هو فعل الجمع لأن عدة أشياء لها سعر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
