      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo هي صيغة المتكلم من prendere، أي «يأخذ»، وتُستعمل لقبول السعر.
    language_code: ar
    direction: rtl
