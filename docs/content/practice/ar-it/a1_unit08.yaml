    slot: item
  feedback_frame:
    text: Mele وbanane وpatate مؤنثة جمع وتأخذ le؛ أما pomodori فمذكر جمع ويأخذ i.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
