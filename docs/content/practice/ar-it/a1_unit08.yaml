  type: translation
  frame:
    text: حسنًا، سآخذه.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo هي العبارة المعتادة لإتمام عملية الشراء.
    language_code: ar
    direction: rtl
