    slot: item
  feedback_frame:
    text: 'يتغير il أو la بحسب الجنس، لكن تُستخدم l'' قبل حرف العلة: l''ufficio.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
