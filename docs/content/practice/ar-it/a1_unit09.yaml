    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi فعل أمر بصيغة المجاملة، ويناسب مخاطبة شخص غريب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit09.lesson01.translate.007
