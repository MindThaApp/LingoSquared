- content_key: practice.ar-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia وla banca وla stazione كلمات مؤنثة؛ أما l'ufficio postale فمذكر وأداة التعريف فيه محذوفة الحرف الأخير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قد تعني Via شارعًا أو طريقًا، وتُستخدم في أسماء مثل Via Roma.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: يُسأل بـ Dov'è la مع اسم مؤنث عن مكان ما؛ وscusi هي «المعذرة» بصيغة المجاملة.
    language_code: ar
    direction: rtl
