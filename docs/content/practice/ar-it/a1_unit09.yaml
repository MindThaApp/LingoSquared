    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Qui vicino «قريب، هنا بالقرب».
    language_code: ar
    direction: rtl
