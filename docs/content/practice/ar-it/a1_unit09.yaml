    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تعني Ce n''è una «يوجد واحدة»: وتقوم ne مقام «منها».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
