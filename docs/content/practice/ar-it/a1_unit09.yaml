  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تسأل C'è عن وجود شيء أو تقرره؛ وتُجيب ce n'è بذكر واحد منه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
