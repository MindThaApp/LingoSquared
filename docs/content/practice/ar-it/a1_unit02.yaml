    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تدل النهاية على الجنس: -o للرجل (americano) و-a للمرأة (americana).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'لا تُكتب الجنسيات واللغات في الإيطالية بحرف كبير: italiano, inglese.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: من أين أنت؟ (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? سؤال بصيغة tu؛ والصيغة الرسمية المهذبة هي Di dov'è, Lei?
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تدل نهاية الفعل على من يقوم بالفعل: parlo تعني أتحدث، وparli تعني تتحدث (غير رسمي)، وparla تعني تتحدث (رسمي) أو يتحدث/تتحدث.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تتشابه parli وparla في النطق: حرف العلة الأخير يخبرك هل هي tu (-i) أم Lei (-a).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'بعد parlare لا تحتاج اللغة عادةً إلى أداة تعريف: parlo inglese, parlo italiano.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? تسأل منذ متى تدرس؛ تستخدم الإيطالية المضارع مع da أي «منذ».
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: هل تتحدث الإنجليزية؟ (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Parli صيغة tu؛ ومع شخص غريب تستخدم صيغة Lei: Parla inglese?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai وfa كلتاهما من fare: fai لـ tu، وfa لـ Lei أو هو/هي.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تقع النبرة في Ingegnere على المقطع قبل الأخير: in-ge-GNE-re.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? تسأل حرفيًا «أي عمل تعمل؟»؛ والصيغة المهذبة هي Che lavoro fa, Lei?
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai صيغة tu من fare؛ ومع Lei تصبح fa.
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.match.005
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Che كلمة مرنة: تعني هنا «أي/ماذا» في Che lavoro fai? وتعني أيضًا «ما أجمل» في Che bello!'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.translate.006
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Per تعني «لـ»: per lavoro أي للعمل، وper due anni أي لمدة سنتين.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-it.it.a1.unit02.lesson03.translate.007
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: أنا هنا للعمل.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono qui per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'تستخدم الإيطالية per هنا دون أداة تعريف: per lavoro، أي للعمل.'
    language_code: ar
    direction: rtl
