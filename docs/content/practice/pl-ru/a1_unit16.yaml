templates:
- content_key: practice.pl-ru.ru.a1.unit16.lesson01.choose.001
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У меня болит oraz nazwa części ciała oznacza, że ta część boli; to, co boli, jest podmiotem czasownika болит.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson01.order.002
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: word_order
  frame:
    text: У меня болит {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Болит się nie zmienia, niezależnie od tego, czy część ciała jest rodzaju żeńskiego, męskiego czy nijakiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson01.fill.003
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: fill_in_blank
  frame:
    text: У меня болит {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po rosyjsku mówi się dosłownie „u mnie boli głowa”, a nie „mam ból głowy”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson01.translate.004
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: Boli mnie brzuch.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот jest rodzaju męskiego, ale болит się nie zmienia.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: Boli mnie gardło.
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня oraz болит to codzienny sposób opisywania objawów.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.choose.001
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мне плохо to ogólne „źle się czuję”, gdzie мне znaczy „mi”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.order.002
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: word_order
  frame:
    text: Мне {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо mówi, jak się czujesz, używając formy „mi” zamiast „ja”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.fill.003
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: fill_in_blank
  frame:
    text: У меня {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня oraz температура znaczy „mam gorączkę”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.translate.004
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: Mam przeziębienie.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня oraz rzeczownik sprawdza się też przy chorobach, np. У меня простуда.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.translate.005
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: Źle się czuję. (dwa słowa)
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо opisuje ogólne samopoczucie, a nie konkretny ból.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.translate.006
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Температура może oznaczać temperaturę albo gorączkę, zależnie od kontekstu.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson02.match.007
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Болит to czasownik oznaczający „boli”; części ciała голова, живот i горло to to, co boli.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson03.choose.001
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Много воды zawiera воды, formę słowa вода po много, co znaczy „dużo wody”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson03.order.002
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: word_order
  frame:
    text: Вам нужно {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам нужно oraz bezokolicznik mówi, że trzeba coś zrobić; вам to grzecznościowe „Pan/Pani”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson03.fill.003
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Да, и {item} температура. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ещё dodaje coś jeszcze do tego, co zostało powiedziane wcześniej.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson03.fill.004
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Вам {item} отдыхать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вам нужно oraz bezokolicznik, czyli „musi Pan/Pani”, to uprzejma rada lekarza.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson03.translate.005
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: Musi Pan/Pani odpoczywać. (formalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам {item} отдыхать.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам to grzecznościowe „Pan/Pani”, którego lekarz używa wobec pacjenta.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit16.lesson03.translate.006
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: Musi Pan/Pani pić dużo wody. (formalnie)
    language_code: pl
    direction: ltr
  slots:
    a: *id016
    b: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно пить {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Po много rzeczownik przyjmuje formę воды: „dużo wody”.'
    language_code: pl
    direction: ltr
