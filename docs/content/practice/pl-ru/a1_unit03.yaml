    slot: item
  feedback_frame:
    text: Po 2, 3 i 4 rzeczownik przyjmuje specjalną formę (два брата, три рубля), a od 5 wzwyż stoi w dopełniaczu liczby mnogiej (пять рублей).
    language_code: pl
    direction: ltr
