    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Liczebniki 2–4 wymagają jednej formy rzeczownika (брат zmienia się w брата), a 5 i więcej – innej (книга zmienia się w книг).
    language_code: pl
    direction: ltr
