schema_version: '1.0'
pack_key: practice.pl-ru.a1.unit53
source_language: pl
target_language: ru
unit_content_key: ru.a1.unit53.gym
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Polish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_абонемент
    - w_беговая
    - w_гантели
    - w_гантелями
    - w_десяти
    - w_дорожка
    - w_дорожке
    - w_занятие
    - w_инструктор
    - w_конечно
    - w_пляж
    - w_поднимаю
    - w_разовый
    - w_расписание
    - w_спортзал
    - w_хожу
    - w_хотим
    - w_человека
templates:
- content_key: practice.pl-ru.ru.a1.unit53.lesson01.choose.001
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спортзал
        - w_хожу
        - w_абонемент
        - w_беговая
        - w_дорожка
        - w_дорожке
        - w_гантели
        - w_поднимаю
        - w_гантелями
        - w_занятие
        - w_инструктор
        - w_расписание
        - w_десяти
        - w_разовый
        - w_хотим
        - w_конечно
        - w_человека
        - w_пляж
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z tematu „Idziemy na siłownię?”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson02.listen.001
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z tematu „Sprzęt na siłowni”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson03.translate.001
  lesson_content_key: ru.a1.unit53.lesson03.zanyatie_yogoy
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z tematu „Zajęcia jogi”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson04.match.001
  lesson_content_key: ru.a1.unit53.lesson04.raspisanie_na_stoyke_registratsii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Dopasuj każde rosyjskie słowo do jego polskiego znaczenia; słowa pochodzą z lekcji tego działu.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson05.choose.001
  lesson_content_key: ru.a1.unit53.lesson05.na_stoyke_registratsii_sportzala
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek z tej lekcji, z części o recepcji na siłowni.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson06.translate.001
  lesson_content_key: ru.a1.unit53.lesson06.dima_i_nina_posle
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów tej lekcji, z tematu: Dima i Nina po siłowni.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson01.order.002
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: word_order
  frame:
    text: Рынок был хороший, а теперь я хочу пойти в {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортзал
  answer_derivation:
    kind: render_frame
    frame:
      text: Рынок был хороший, а теперь я хочу пойти в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Targ był fajny, a teraz chcę iść na siłownię. спортзал znaczy „siłownia”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson01.fill.003
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: fill_in_blank
  frame:
    text: Я {item} в спортзал. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_хожу
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_хожу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Chodzę na siłownię. хожу znaczy „chodzę” (regularnie, pieszo).
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit53.lesson01.translate.004
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: translation
  frame:
    text: Mam karnet na siłownię.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_абонемент
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} в спортзал.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Mam karnet na siłownię. абонемент znaczy „karnet, abonament”.
    language_code: pl
    direction: ltr
