templates:
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.choose.001
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Rosyjskie nazwy dni tygodnia pisze się małą literą, a w czasie teraźniejszym nie potrzeba czasownika: Сегодня суббота znaczy „Dziś jest sobota”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.listen.002
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Среда, пятница i суббота są rodzaju żeńskiego, a pozostałe dni tygodnia – męskiego lub nijakiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.match.003
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Dni tygodnia po rosyjsku pisze się małą literą: понедельник, вторник, среда.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
    text: Сегодня {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Po rosyjsku w czasie teraźniejszym pomija się czasownik „być”, więc Сегодня суббота to po prostu „dziś” plus dzień.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой zgadza się z rzeczownikiem męskim день, dlatego w pytaniu o datę później pojawia się какое z rzeczownikiem nijakim число.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.translate.006
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rosyjskie nazwy dni tygodnia nie przyjmują wielkiej litery.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: Jaki dziś dzień tygodnia?
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Какой сегодня день? pyta o dzień tygodnia; o datę pytasz: Какое сегодня число?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Daty tworzy się z liczebnika porządkowego rodzaju nijakiego i miesiąca w dopełniaczu: десятое апреля znaczy „dziesiąty kwietnia”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.order.002
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Liczebnik porządkowy jest rodzaju nijakiego (первое, третье), bo zgadza się z domyślnym słowem число, czyli datą.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.order.003
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня десятое {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня десятое {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Po liczebniku miesiąc przyjmuje dopełniacz: десятое января, десятое апреля, десятое октября.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.fill.004
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: fill_in_blank
  frame:
    text: Какое сегодня {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число jest rodzaju nijakiego, więc w pytaniu stoi какое, a день jest rodzaju męskiego i wymaga какой.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Liczebniki porządkowe w datach kończą się na -ое lub -ье, bo zgadzają się z rzeczownikiem nijakim число.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Którego dziś mamy?
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Какое сегодня число? dosłownie pyta: „Jaka jest dziś liczba?”'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Dziś jest trzeci stycznia.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Datę „trzeci stycznia” mówi się: третье января – z miesiącem w dopełniaczu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson03.fill.001
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: fill_in_blank
  frame:
    text: Встреча {item} вторник. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przed вторник przyimek przyjmuje formę во (во вторник); przed większością innych dni tygodnia jest po prostu в.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Встреча во вторник, девятого января: najpierw dzień tygodnia, potem data z miesiącem w dopełniaczu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson03.order.003
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: word_order
  frame:
    text: Встреча во вторник, {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча во вторник, {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'W dacie liczebnik девятого też stoi w dopełniaczu: девятого января znaczy „dziewiątego stycznia”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit04.lesson03.translate.004
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: translation
  frame:
    text: Spotkanie jest we wtorek.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник znaczy „we wtorek”; во to wydłużona forma przyimka в użyta w tym miejscu.
    language_code: pl
    direction: ltr
