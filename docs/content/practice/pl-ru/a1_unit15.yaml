templates:
- content_key: practice.pl-ru.ru.a1.unit15.lesson01.choose.001
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Лучше znaczy „lepiej / lepszy”, a хуже „gorzej / gorszy”; чем znaczy „niż / od” i stoi po przecinku za stopniem wyższym.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson01.order.002
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: word_order
  frame:
    text: Кофе {item}, чем чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: W porównaniu przed чем („niż”) stawia się w rosyjskim przecinek.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson01.fill.003
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: fill_in_blank
  frame:
    text: Чай {item}, чем кофе. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хуже jest przeciwieństwem лучше; чем wprowadza to, z czym porównujemy.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson01.translate.004
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Kawa jest lepsza od herbaty.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Po rosyjsku pomija się czasownik „być”: Кофе лучше po prostu zestawia dwie rzeczy.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson01.translate.005
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Herbata jest gorsza od kawy.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Чай {item}, чем кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Чем zawsze stoi po stopniu wyższym i przecinku.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson01.translate.006
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Te trzy słowa tworzą każde proste porównanie: лучше, хуже i чем.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.choose.001
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: То to „tamto” w rodzaju nijakim, pasuje do кафе, a тот to „tamten” w rodzaju męskim, pasuje do дом.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.match.002
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Больше znaczy „większy” lub „więcej”, a меньше „mniejszy” lub „mniej”; то и тот znaczą „tamto / tamten”, ale pasują do różnych rodzajów.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.order.003
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Это кафе {item}, чем то.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кафе jest nijakie i się nie odmienia, więc łączy się z это и то.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.order.004
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Тот дом {item}, чем этот.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дом jest rodzaju męskiego, więc pasuje do тот и этот.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.fill.005
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: То кафе {item}, чем это. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меньше jest przeciwieństwem больше.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.fill.006
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: Этот дом больше, чем {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тот to „tamten” w rodzaju męskim i pasuje do дом; nijakie то pasowałoby do кафе.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.translate.007
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Ta kawiarnia jest większa od tamtej.
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Больше może znaczyć „większy” lub „więcej”, zależnie od kontekstu.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.translate.008
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Tamten dom jest mniejszy od tego.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тот и этот są rodzaju męskiego i pasują do дом.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.translate.009
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кафе jest nijakie i się nie odmienia; дом jest rodzaju męskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit15.lesson02.listen.010
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Больше и меньше są przeciwieństwami i oba mogą też znaczyć „więcej” lub „mniej”.
    language_code: pl
    direction: ltr
