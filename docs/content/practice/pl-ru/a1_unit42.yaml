schema_version: '1.0'
pack_key: practice.pl-ru.a1.unit42
source_language: pl
target_language: ru
unit_content_key: ru.a1.unit42.appointment
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Polish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_записаться
    - w_запись
    - w_мая
    - w_напомню
    - w_подтверждена
    - w_подтверждение
    - w_подходит
    - w_свободно
    - w_среду
templates:
- content_key: practice.pl-ru.ru.a1.unit42.lesson01.choose.001
  lesson_content_key: ru.a1.unit42.lesson01.zapisatsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_запись
        - w_записаться
        - w_свободно
        - w_среду
        - w_подходит
        - w_подтверждена
        - w_подтверждение
        - w_мая
        - w_напомню
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z lekcji o umawianiu się na wizytę.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit42.lesson02.listen.001
  lesson_content_key: ru.a1.unit42.lesson02.vremya_svobodno
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek z tej lekcji, z tematu wolnego terminu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit42.lesson05.translate.001
  lesson_content_key: ru.a1.unit42.lesson05.chitaem_podtverzhdenie
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek z tej lekcji, z tematu czytania potwierdzenia.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit42.lesson06.match.001
  lesson_content_key: ru.a1.unit42.lesson06.dima_napominaet_nine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Dopasuj każde rosyjskie słowo do jego polskiego znaczenia; słowa pochodzą z lekcji tego działu.
    language_code: pl
    direction: ltr
