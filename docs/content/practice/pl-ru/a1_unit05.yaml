templates:
- content_key: practice.pl-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? dosłownie pyta „która godzina”, a Сейчас znaczy „teraz”; razem tworzą standardową parę pytanie–odpowiedź o godzinę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Od liczby zależy forma rzeczownika: час po 1, часа po 2–4, часов od 5 wzwyż.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Po 2, 3 i 4 rzeczownik przyjmuje formę часа, jak w два часа i три часа.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Od pięciu wzwyż rzeczownik przyjmuje formę dopełniacza liczby mnogiej часов: пять часов, десять часов.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: Która jest godzina?
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? dosłownie znaczy „która godzina”; to standardowy sposób pytania o godzinę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Po rosyjsku pytanie często zaczyna się od zaimka pytającego, a dopiero potem następuje czasownik: Когда отходит поезд?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром, днём, вечером i ночью to przysłówki z końcówkami -ом, -ём lub -ью, używane bez przyimka.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Pory dnia po rosyjsku są przysłówkami: утром, днём, вечером, ночью.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Po godzinie na zegarze дня oznacza „po południu”, tak jak утра oznacza „rano” (a.m.), а вечера – „wieczorem”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? to pytanie o to, o której godzinie coś się dzieje, a nie o to, która jest teraz godzina.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rosyjskie określenia czasu, takie jak утром i вечером, występują samodzielnie, bez przyimka.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: O siódmej wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Po godzinie na zegarze pora dnia stoi w dopełniaczu: семь часов вечера.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста to grzeczny sposób rozpoczęcia pytania do nieznajomej osoby.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите to grzeczny tryb rozkazujący w formie вы, oznaczający „proszę mi powiedzieć”, а пожалуйста łagodzi prośbę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит to forma 3. osoby liczby pojedynczej (on/ona/ono), więc zgadza się z rzeczownikiem w liczbie pojedynczej поезд.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po godzinie na zegarze утра oznacza „rano” (a.m.), więc восемь часов утра to ósma rano.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: Kiedy odjeżdża pociąg?
    language_code: pl
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда pyta „kiedy”, а czasownik отходит zgadza się z rzeczownikiem w liczbie pojedynczej поезд.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: O drugiej po południu.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дня stosuje się przy godzinach popołudniowych, а утра i вечера przy godzinach porannych i wieczornych.
    language_code: pl
    direction: ltr
