  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_волна
    - w_дюны
    - w_зонт
    - w_зонты
    - w_зоопарк
    - w_красивое
    - w_море
    - w_песок
    - w_плаваю
    - w_пляжный
    - w_поплаваем
    - w_сижу
    - w_тёплый
templates:
- content_key: practice.pl-ru.ru.a1.unit54.lesson01.choose.001
  lesson_content_key: ru.a1.unit54.lesson01.poydyom_na_plyazh
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_море
        - w_песок
        - w_тёплый
        - w_волна
        - w_пляжный
        - w_зонт
        - w_плаваю
        - w_сижу
        - w_дюны
        - w_зонты
        - w_красивое
        - w_поплаваем
        - w_зоопарк
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z tematu „Idziemy na plażę?”.'
    language_code: pl
    direction: ltr
