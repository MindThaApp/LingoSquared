  type: translation
  frame:
    text: Na mojej ulicy jest bank.
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть służy do wyrażania posiadania; gdy coś znajduje się na ulicy, po rosyjsku mówi się На моей улице есть.
    language_code: pl
    direction: ltr
