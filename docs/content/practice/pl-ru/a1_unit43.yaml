  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek z tej lekcji: czy śniadanie jest wliczone w cenę?'
    language_code: pl
    direction: ltr
