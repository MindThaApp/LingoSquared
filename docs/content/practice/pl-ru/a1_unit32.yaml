    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek tej lekcji, z części o tym, kto co robi na przyjęciu.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit32.lesson06.translate.001
