  feedback_frame:
    text: 'Urodziny Leny są w sobotę, osiemnastego kwietnia. Лены to dopełniacz od Лена i wyraża przynależność: день рождения Лены, bez osobnego słowa na „czyj”.'
    language_code: pl
    direction: ltr
