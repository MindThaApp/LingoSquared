  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słówek tej lekcji, z części o przyjęciu w kawiarni językowej.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
