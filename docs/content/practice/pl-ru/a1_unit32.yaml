      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Moje urodziny są osiemnastego kwietnia. рождения znaczy „narodzin” (dopełniacz, jak w „dzień urodzin”).
    language_code: pl
    direction: ltr
