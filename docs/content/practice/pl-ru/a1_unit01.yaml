templates:
- content_key: practice.pl-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Litery cyrylicy często wyglądają jak łacińskie, ale brzmią inaczej: р to R, в to W, у to u, a й to krótkie j.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Niektóre litery cyrylicy to fałszywi przyjaciele: р wygląda jak P, ale oznacza R, a е wygląda jak E, ale na początku wyrazu czyta się je jak je; здравствуйте zawiera obie.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rosyjski zapisuje się cyrylicą; pierwsze słowo, którego się uczysz, здравствуйте, składa się z liter з, д, р, а, в, с, т, у, й i е.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: Dzień dobry! (oficjalnie, jedno słowo)
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте to oficjalne powitanie wobec nieznajomych i wielu osób naraz; pierwsze в jest nieme, więc brzmi to jak zdrAstwujte.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Rosyjskie powitania zależą od pory dnia: доброе утро (rano), добрый день (w ciągu dnia), добрый вечер (wieczorem). Утро jest rodzaju nijakiego, a день i вечер męskiego, dlatego zmienia się końcówka przymiotnika.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Привет to swobodne „cześć” wobec przyjaciół i rodziny; wobec nieznajomych używaj здравствуйте lub powitania zależnego od pory dnia.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Добрый łączy się z rzeczownikami rodzaju męskiego, takimi jak день i вечер, a nijakie утро wymaga formy доброе.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
    text: Доброе {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Утро jest rzeczownikiem rodzaju nijakiego, więc w powitaniu używamy доброе, a nie добрый.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W rosyjskim nie ma przedimków, więc odpowiedź jednowyrazowa to po prostu samo słowo, np. утро lub завтра.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Привет jest swobodne, a здравствуйте to oficjalne powitanie wobec nieznajomych.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как дела? to codzienne pytanie, typowe wśród przyjaciół (ты), a Как поживаете? kończy się formą вы i brzmi oficjalniej.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Пока to swobodne „na razie”, a до свидания to neutralne lub oficjalne pożegnanie.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дела? dosłownie pyta, jak idą sprawy; po Привет to swobodne pytanie między przyjaciółmi.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поживаете kończy się na -ете, czyli jest formą вы, więc pasuje do oficjalnego здравствуйте.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.fill.005
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: Хорошо, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хорошо, спасибо to standardowa odpowiedź na Как дела? i znaczy, że wszystko w porządku.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До znaczy „do”, więc До завтра! to codzienny sposób, by powiedzieć „do jutra”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.translate.007
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: Dobrze, dziękuję.
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хорошо, спасибо to uprzejma, utarta odpowiedź na Как дела? i pasuje zarówno do ты, jak i do вы.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit01.lesson03.translate.008
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: Do jutra.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: До {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До завтра! składa się z до („do”) i завтра („jutro”).
    language_code: pl
    direction: ltr
