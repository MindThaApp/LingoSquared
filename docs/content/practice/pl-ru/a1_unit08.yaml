      direction: ltr
  feedback_frame:
    text: Стоит zgadza się z jedną rzeczą, молоко; przy kilku rzeczach rosyjski używa стоят.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
