      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дайте полкило, пожалуйста to grzeczny sposób, by poprosić sprzedawcę o pół kilo.
    language_code: pl
    direction: ltr
