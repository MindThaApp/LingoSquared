    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Килограмм i полкило oznaczają ilość towaru i stoją bezpośrednio po дайте.
    language_code: pl
    direction: ltr
