    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Штука po liczebniku пять zmienia się w штук.
    language_code: pl
    direction: ltr
