    slot: item
  feedback_frame:
    text: Помидоры, огурцы i апельсины są w liczbie mnogiej; картофель i капуста to słowa w liczbie pojedynczej, które znaczą „ziemniaki” i „kapusta”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...? pasuje do każdego rzeczownika i jest zwykłym sposobem, by zapytać sprzedawcę, czy ma dany towar.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po słowie oznaczającym ilość, takim jak кило, towar stoi w dopełniaczu liczby mnogiej, więc яблоки zmienia się w яблок.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Poproszę kilogram pomidorów. (formalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Po килограмм towar stoi w dopełniaczu liczby mnogiej: помидоры zmienia się w помидоров.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Czy jest kapusta? (formalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Капуста jest w rosyjskim w liczbie pojedynczej i nie potrzebuje żadnego dodatkowego słowa.
    language_code: pl
    direction: ltr
