templates:
- content_key: practice.nl-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi telwoorden zijn onregelmatig en moet je een voor een leren; छह is bijvoorbeeld zes en सात is zeven.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi telwoorden van elf tot en met negenennegentig zijn onregelmatig, dus elk woord, zoals पंद्रह (vijftien) of पचास (vijftig), moet je apart leren.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hindi zelfstandige naamwoorden zoals नंबर, फ़ोन en कीमत staan zonder lidwoord; de context bepaalt of het om een prijs of de prijs gaat.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी betekent zijn/haar/ervan en komt overeen met het vrouwelijke woord कीमत, daarom eindigt het op -ी en niet op -ा.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'In het Hindi staat het getal vóór wat er geteld wordt, en het werkwoord है staat aan het eind: इसकी कीमत पचास रुपये है.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Wat is de prijs ervan?
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Een vraag heeft in het Hindi dezelfde woordvolgorde als een bewering: इसकी कीमत पचास रुपये है is het antwoord op इसकी कीमत क्या है?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Bezittelijke voornaamwoorden passen zich aan het bezit aan: आपका फ़ोन नंबर heeft het mannelijke आपका, maar आपकी उम्र heeft het vrouwelijke आपकी.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Leeftijd geef je aan met een aantal साल (jaren) plus है: letterlijk Mijn leeftijd is dertig jaar.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका is het beleefde "uw", hier mannelijk omdat नंबर mannelijk is; bij तुम zeg je तुम्हारा.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (jaar) verandert na een getal niet in het meervoud: तीस साल is dertig jaar.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Ik ben {n} jaar oud.
    language_code: nl
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र is een vrouwelijk woord, dus het bezittelijk voornaamwoord is मेरी, niet मेरा.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Wat is uw telefoonnummer? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Een telefoonnummer wordt in het Hindi cijfer voor cijfer gelezen, bijvoorbeeld छह दो आठ तीन पाँच.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na een getal boven één wordt geld geteld met het meervoud रुपये; het enkelvoud is रुपया.
    language_code: nl
    direction: ltr
