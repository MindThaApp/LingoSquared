templates:
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पसंद है betekent letterlijk ''is aangenaam'': मुझे चाय पसंद है is ''ik hou van thee'', gebouwd met मुझे in plaats van मैं.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'है hoort bij één ding en हैं bij meer dan één: किताब पसंद है, किताबें पसंद हैं.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi heeft geen woord voor 'een' of 'de/het', en datgene wat je leuk vindt staat tussen मुझे en पसंद.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Het werkwoord is hier हैं omdat किताबें meervoud is: पसंद है wordt पसंद हैं.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद is in het Hindi geen werkwoord, maar een woord dat met है wordt gebruikt. De zin is dus opgebouwd als 'thee is mij aangenaam'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bij iets in het meervoud dat je leuk vindt, staat na पसंद het woord हैं.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Ik hou van muziek.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Degene die iets leuk vindt, staat op de plek van मुझे, en de muziek is datgene wat aangenaam is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Ik hou van boeken.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें is meervoud, dus het werkwoord is हैं, niet है.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Enkelvoud किताब en meervoud किताबें verschillen alleen in de uitgang -ें, die bij dit vrouwelijke zelfstandig naamwoord het meervoud aangeeft.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल betekent zowel sport als spel, en ज़्यादा betekent meer: मुझे चाय ज़्यादा पसंद है is ''ik hou meer van thee''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह (dit) staat direct voor het zelfstandig naamwoord waarnaar het verwijst, zoals in यह खेल.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा staat voor पसंद om aan te geven wat van twee dingen je liever mag.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Ik hou van deze sport.
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है congrueert met datgene wat je leuk vindt (één sport), niet met de persoon die het leuk vindt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Ik hou meer van thee.
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi zegt letterlijk 'thee is mij meer aangenaam', met ज़्यादा vlak voor पसंद.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल (sport of spel) is een mannelijk zelfstandig naamwoord, terwijl ज़्यादा (meer) nooit van vorm verandert.
    language_code: nl
    direction: ltr
