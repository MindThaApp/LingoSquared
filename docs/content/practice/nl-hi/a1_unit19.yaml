      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het Hindi benoemt het weer met een zelfstandig naamwoord: धूप is zonneschijn, बारिश is regen en हवा is wind.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
