      direction: ltr
  feedback_frame:
    text: मौसम is mannelijk, dus ठंडा en बुरा krijgen de -ा-vorm, en गर्म verandert nooit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson02.order.004
