    slot: item
  feedback_frame:
    text: 'गर्म blijft bij elk zelfstandig naamwoord hetzelfde, maar ठंडा verandert: ठंडा voor mannelijk, ठंडी voor vrouwelijk.'
    language_code: nl
    direction: ltr
