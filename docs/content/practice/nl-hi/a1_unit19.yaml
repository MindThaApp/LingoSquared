templates:
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम is een mannelijk zelfstandig naamwoord, dus de vraag is आज मौसम कैसा है?, met कैसा en niet कैसी.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Weerwoorden zoals धूप, बारिश en हवा krijgen direct है: आज धूप है betekent: het is vandaag zonnig.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'In het Hindi noem je het weer en voeg je है toe, zonder los woord voor ''het'': आज धूप है.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा congrueert met het mannelijke woord मौसम.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: धूप is vrouwelijk, maar है blijft hetzelfde bij één ding.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: Het is vandaag zonnig.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Het Hindi gebruikt het zelfstandig naamwoord धूप met है in plaats van een bijvoeglijk naamwoord voor 'zonnig'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
