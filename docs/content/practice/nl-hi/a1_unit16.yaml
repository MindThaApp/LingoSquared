    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Datgene wat je nodig hebt staat tussen मुझे en चाहिए.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson02.fill.006
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: आराम {item}! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: करो is de informele gebiedende wijs van करना, en आराम करो betekent rust.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson02.translate.007
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: Ik heb medicijnen nodig.
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए gebruik je voor nodig hebben en voor graag willen, wie er ook spreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson02.translate.008
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: Ik moet naar de dokter gaan.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के पास staat na de dokter en betekent naar de dokter toe.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson02.translate.009
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
