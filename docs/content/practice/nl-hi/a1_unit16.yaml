    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आराम करो is het informele bevel rust!, gevormd uit het zelfstandig naamwoord आराम plus करो.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson02.order.002
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
