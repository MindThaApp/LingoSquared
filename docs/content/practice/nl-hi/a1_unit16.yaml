    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Het Hindi heeft hier geen werkwoord voor hebben; मुझे en है zijn genoeg.
    language_code: nl
    direction: ltr
