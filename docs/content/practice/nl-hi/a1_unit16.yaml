  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: 'Ik heb hoofdpijn. (letterlijk: aan mij is hoofdpijn)'
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Het Hindi gebruikt hier geen lidwoord: सिर दर्द is een samenstelling die zonder lidwoord wordt gebruikt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson02.choose.001
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: multiple_choice
