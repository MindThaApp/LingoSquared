templates:
- content_key: practice.nl-hi.hi.a1.unit16.lesson01.choose.001
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दर्द is een mannelijk zelfstandig naamwoord voor pijn, en मुझे सिर दर्द है is de gebruikelijke manier om te zeggen dat je hoofdpijn hebt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson01.listen.002
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In het Hindi zeg je letterlijk: voor mij is koorts: मुझे बुखार है, met है en niet met een werkwoord als hebben.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson01.order.003
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे {item} दर्द है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} दर्द है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: In het Hindi zeg je hoofdpijn als hoofd-pijn, met सिर vóór दर्द.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit16.lesson01.order.004
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
