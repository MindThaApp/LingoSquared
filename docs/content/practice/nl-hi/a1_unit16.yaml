  frame:
    text: Rust! (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item}!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Het informele bevel eindigt op -ो, de klank die bij तुम hoort.
    language_code: nl
    direction: ltr
