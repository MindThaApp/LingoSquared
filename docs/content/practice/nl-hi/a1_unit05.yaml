templates:
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माता-पिata (ouders) combineert माता, een formeel woord voor moeder, met पिता (vader), net zoals दादा-दादी beide grootouders samenneemt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Het Hindi maakt onderscheid tussen grootouders van vaderskant (दादा, दादी) en van moederskant (नाना, नानी); in het Nederlands zeg je voor beide gewoon opa en oma.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'बड़ा en छोटा horen bij mannelijke zelfstandige naamwoorden en बड़ी en छोटी bij vrouwelijke, en ze geven ook leeftijd aan: ouder of jonger.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Hindi familiewoorden zijn paarsgewijs mannelijk of vrouwelijk: भाई en बहन, दादा en दादी, नाना en नानी.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई is mannelijk, dus het krijgt मेरा; een vrouwelijk woord als बहन krijgt मेरी.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन is vrouwelijk, dus het bezittelijk voornaamwoord is मेरी, niet मेरा.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Uit respect voor een oudere wordt मेरा tot मेरे en है tot हैं, zelfs bij één persoon.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में na een stad betekent 'in', en het werkwoord bij een respectvol meervoudig onderwerp is रहते हैं.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बड़ा en छोटा congrueren met het mannelijke woord भाई, en एक betekent hier 'een' in plaats van 'één'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: परिवार wordt behandeld als enkelvoud en mannelijk, dus het werkwoord is रहता है.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bij grootouders, die respect krijgen en meervoud zijn, is het werkwoord रहते हैं in plaats van रहता है.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: छोटी is de vrouwelijke vorm omdat बहन vrouwelijk is; bij een broer zou het छोटा zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: Mijn ouders wonen in {city}.
    language_code: nl
    direction: ltr
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Ouders zijn oudere personen die respect verdienen, dus gebruik je मेरे en het meervoudige werkwoord रहते हैं.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: Waar woont je familie? (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Met het formele आप zou je zeggen: आपका परिवार कहाँ रहता है?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: Dit is mijn vader. (met respect gezegd)
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Respect zie je twee keer: मेरे in plaats van मेरा en हैं in plaats van है.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hindi heeft twee woorden voor opa en twee voor oma, afhankelijk van of ze van vaders- of moederskant zijn.
    language_code: nl
    direction: ltr
