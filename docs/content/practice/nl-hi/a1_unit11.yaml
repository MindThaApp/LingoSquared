templates:
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'चलो plus een -ते werkwoord en हैं is een voorstel om samen iets te doen: चलो, फ़िल्म देखते हैं!'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'साथ betekent samen of met, en een voorstel bevat het vaak: चलो, साथ चाय पीते हैं!'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म is vrouwelijk, maar de voorstelvorm -ते हैं verandert daardoor niet.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: De voorstelvorm is het -ते werkwoord met हैं, in de betekenis van 'laten we ...'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अच्छा विचार है is een gangbare manier om op een voorstel in te gaan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: देखते is de -ते vorm; met हैं betekent die 'wij kijken' en na चलो 'laten we kijken'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: Laten we thee drinken!
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '''Laten we'' is in het Hindi चलो plus de -ते हैं vorm van het werkwoord.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 'Goed idee! (een volledige zin: ''goed idee is'')'
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार is mannelijk, daarom staat het bijvoeglijk naamwoord als अच्छा.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माफ़ करना is de informele manier om sorry of pardon te zeggen, tegen mensen die je met तुम aanspreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hindi woorden voor beleefd afslaan zijn onder meer माफ़ करना voor sorry en व्यस्त voor druk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na माफ़ करना noem je je situatie, bijvoorbeeld dat je druk bent.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: Sorry, ik ben druk. (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना is de informele manier om je te verontschuldigen; व्यस्त blijft hetzelfde voor een man of een vrouw.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: Dus wanneer spreken we af?
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हम krijgt de meervoudsvorm -ते हैं: हम मिलते हैं, wij spreken af.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'संदेश is een bericht, bijvoorbeeld een sms waarin je een plan maakt: प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Beginnen met de naam is een directe aanspreking, en को na शनिवार betekent 'op zaterdag'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'सुझाव is een suggestie die je aan iemand doet, terwijl विचार een idee of gedachte is: अच्छा विचार है! betekent ''goed idee!''.'
    language_code: nl
    direction: ltr
