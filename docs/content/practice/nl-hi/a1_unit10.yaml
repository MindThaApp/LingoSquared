templates:
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Gewoonteww. eindigen op -ता voor een man en -ती voor een vrouw: मैं उठता हूँ, मैं उठती हूँ.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह betekent 'hij' of 'zij'; aan de uitgang van het werkwoord hoor je welke van de twee. वे betekent 'zij' (meervoud).
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'De uitgang van het werkwoord volgt het geslacht van de spreker: उठता voor een man en उठती voor een vrouw, en हूँ hoort bij मैं.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना, naar je werk gaan, heeft पर nodig, maar de uitgang van het werkwoord volgt nog steeds het geslacht van de spreker.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Veel Hindi-handelingen bestaan uit zelfstandig naamwoord plus करना: नाश्ता करना betekent ontbijten.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Elke dag ga ik naar mijn werk. (gezegd door een vrouw)
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Een vrouw gebruikt de uitgang -ती: जाती हूँ; een man zegt जाता हूँ.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Elke dag ontbijt ik. (gezegd door een man)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: In het Hindi zeg je नाश्ता करना, letterlijk 'ontbijt doen', terwijl je in het Nederlands 'ontbijten' zegt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Bij तुम eindigt het werkwoord op -ते voor een man en op -ती voor een vrouw, en komt er हो bij: तुम उठते हो, तुम उठती हो.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Elk gewoontewerkwoord heeft een mannelijke vorm op -ता en een vrouwelijke vorm op -ती, en de vorm volgt de spreker.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Bij तुम is het werkwoord -ते हो als je een man iets vraagt, en de uitgang volgt de persoon die je aanspreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De spreker is hier een vrouw, dus het werkwoord krijgt -ती; de uitgang volgt degene die slaapt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Wanneer ga jij slapen? (informeel, aan een man gevraagd)
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Bij तुम volgt de uitgang de persoon die je iets vraagt, niet degene die vraagt: सोते voor een man, सोती voor een vrouw.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Wanneer sta jij op? (informeel, aan een vrouw gevraagd)
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Als je een vrouw iets vraagt, eindigt het werkwoord op -ती: तुम उठती हो.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते in तुम कब वापस आते हो? is de -ते-vorm die je bij तुम gebruikt als je een man iets vraagt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता is de mannelijke vorm, dus er spreekt een man; een vrouw zou आती zeggen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Ik kom 's avonds terug. (gezegd door een man)
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को na शाम betekent 's avonds, en वापस आना betekent terugkomen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Ik eet het avondeten. (gezegd door een vrouw)
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना, letterlijk 'de maaltijd van de nacht', betekent avondeten; de uitgang -ती laat zien dat er een vrouw spreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस betekent ''terug'' en combineert met werkwoorden zoals आना: वापस आता हूँ, ik kom terug.'
    language_code: nl
    direction: ltr
