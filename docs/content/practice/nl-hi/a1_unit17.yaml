    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते in तुम रोज़ दफ़्तर जाते हो is de -ते-vorm die bij तुम wordt gebruikt als je tegen een man praat.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Bij तुम eindigt het werkwoord op -ते, gevolgd door हो, als je tegen een man praat.
    language_code: nl
    direction: ltr
