    slot: item
  feedback_frame:
    text: दफ़्तर is een mannelijk zelfstandig naamwoord voor kantoor, en में erachter betekent in het kantoor.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
