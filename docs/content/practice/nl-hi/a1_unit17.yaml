templates:
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक is een mannelijke leraar en शिक्षिका een vrouwelijke leraar; इंजीनियर wordt voor beiden gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sommige Hindi-beroepsnamen hebben een aparte vrouwelijke vorm, zoals शिक्षक en शिक्षिका, terwijl leenwoorden zoals इंजीनियर die niet hebben.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Het woord voor leraar volgt het geslacht van de spreker: शिक्षक voor een man, शिक्षिका voor een vrouw.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया is een vrouw, dus ze is een शिक्षिका.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
