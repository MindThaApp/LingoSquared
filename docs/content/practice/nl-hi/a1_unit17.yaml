  feedback_frame:
    text: शिक्षिका vormt het vrouwelijk met -इका, een patroon dat je in meerdere woorden uit het Sanskriet tegenkomt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.fill.006
