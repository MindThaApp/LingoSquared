  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर verandert niet naar geslacht, en in het Hindi bestaat er geen woord voor een.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
