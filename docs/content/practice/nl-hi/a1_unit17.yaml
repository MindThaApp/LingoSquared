- content_key: practice.nl-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Ik ben lerares. (gezegd door een vrouw)
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Een vrouw zegt शिक्षिका; een man zou शिक्षक zeggen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
