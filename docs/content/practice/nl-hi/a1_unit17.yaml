    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में achter de plaats betekent in, en de plaats staat vóór het werkwoord.
    language_code: nl
    direction: ltr
