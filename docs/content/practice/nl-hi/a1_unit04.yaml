templates:
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.choose.001
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बजे (uur) staat na het getal; alleen als je de tijd zegt bij één uur, zeg je एक बजा है, terwijl "om één uur" gewoon एक बजे blijft.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson02.listen.001
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi verdeelt de dag in सुबह, दोपहर, शाम en रात; er is geen aparte uitdrukking voor a.m. of p.m.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson03.choose.001
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कल betekent zowel morgen als gisteren; de werkwoordstijd laat zien welke van de twee bedoeld is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson02.match.002
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Delen van de dag zijn zelfstandige naamwoorden zonder lidwoord; सुबह, शाम en रात zijn allemaal vrouwelijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.order.002
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी पाँच {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी पाँच {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Bij het zeggen van de tijd krijgt elk uur behalve één बजे met het werkwoord in het meervoud: पाँच बजे हैं, maar एक बजा है.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.order.003
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Alleen één uur krijgt het enkelvoud बजा en het enkelvoudige है: एक बजा है.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson02.order.003
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: word_order
  frame:
    text: क्लास {item} सात बजे है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: क्लास {item} सात बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Het deel van de dag staat direct voor het uur, zonder woord ertussen: सुबह सात बजे.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.fill.004
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: क्लास {item} बजे है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितने बजे है? is de gewone manier om te vragen hoe laat iets gebeurt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.fill.005
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: अभी पाँच {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '"Het is ... uur" gebruikt बजे हैं voor elk uur van twee tot en met twaalf; बजे betekent ook "om ... uur", zoals in सुबह सात बजे.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson03.fill.002
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: fill_in_blank
  frame:
    text: ठीक है, {item} मिलते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ठीक है, कल मिलते हैं betekent letterlijk "oké, morgen ontmoeten we elkaar"; de tegenwoordige tijd verwijst vaak naar de nabije toekomst.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.translate.006
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: Hoe laat is het?
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} बजे हैं?'
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Om de tijd te zeggen zet je het getal voor बजे: अभी पाँच बजे हैं.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson02.translate.004
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: De volgende les is om vijf uur 's middags.
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: अगली क्लास {item} पाँच बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अगली past bij het vrouwelijke zelfstandige naamwoord क्लास, dus het eindigt op -ी, niet op -ा.
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson01.translate.007
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: Het is nu één uur.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Één uur is het enige uur met een werkwoord in het enkelvoud: एक बजा है, maar दो बजे हैं.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-hi.hi.a1.unit04.lesson02.translate.005
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Hindi heeft geen apart woord voor het middaguur: दोपहर dekt zowel het midden van de dag als de middag.'
    language_code: nl
    direction: ltr
