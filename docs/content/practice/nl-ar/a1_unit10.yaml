  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ثم betekent 'dan' en staat tussen de twee richtingen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson02.fill.005
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
  frame:
