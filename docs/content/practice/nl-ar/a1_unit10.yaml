schema_version: '1.0'
pack_key: practice.nl-ar.a1.unit10
source_language: nl
target_language: ar
unit_content_key: ar.a1.unit10.directions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_يمين
    - w_الأمام
    - w_اليسار
    - w_امش
    - w_ثم
    - w_يسار
    - w_اليمين
slot_presets:
  mc: &id001
    language_code: ar
    part_of_speech:
    - noun
    - verb
    - particle
    agreement_tags:
      semantic:
      - w_يمين
      - w_الأمام
      - w_اليسار
      - w_امش
      - w_ثم
  mcb: &id002
    language_code: ar
    part_of_speech:
    - noun
    - verb
    - particle
    agreement_tags:
      semantic:
      - w_يسار
      - w_الأمام
      - w_اليمين
      - w_امش
      - w_ثم
  dirs: &id003
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_الأمام
      - w_اليمين
      - w_اليسار
  sides: &id006
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_اليمين
      - w_اليسار
  amam: &id004
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_الأمام
  yamin: &id005
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_اليمين
  yasar: &id009
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_اليسار
  imshi: &id008
    language_code: ar
    part_of_speech: verb
    agreement_tags:
      semantic: w_امش
  thumma: &id007
    language_code: ar
    part_of_speech: particle
