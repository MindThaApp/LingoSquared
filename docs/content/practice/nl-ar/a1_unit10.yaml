templates:
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين is het zelfstandig naamwoord 'rechts' en اليسار is 'links' met ال eraan vast; het lidwoord ال maakt er 'de linkerkant' van.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.listen.002
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام betekent 'de voorkant', en إلى الأمام is rechtdoor.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
    text: امش إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'إلى (naar) staat voor de richting, die ال krijgt: الأمام, اليمين of اليسار.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.fill.004
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: امش إلى {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: إلى الأمام is de gebruikelijke manier om rechtdoor te zeggen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.translate.005
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يمين is rechts (de richting), het tegenovergestelde van يسار.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.translate.006
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: Loop rechtdoor. (tegen een man)
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: امش is een bevel aan een man; إلى الأمام betekent vooruit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson01.translate.007
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: Loop naar rechts. (tegen een man)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'De richting na إلى krijgt ال: اليمين is de rechterkant.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit10.lesson02.choose.001
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: امش is het bevel 'loop', tegen een man; ثم betekent 'dan'.
    language_code: nl
    direction: ltr
