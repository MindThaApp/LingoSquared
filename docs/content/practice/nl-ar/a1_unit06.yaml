templates:
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.choose.001
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'أب is vader en أم is moeder; عندي is één woord en betekent: ik heb.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.listen.002
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة betekent gezin of familie; hetzelfde woord met een bezitsuitgang, عائلتك, komt in de volgende les.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.match.003
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'عندي drukt in één woord uit: ik heb; de familiewoorden zijn أب, أم, أخ en أخت.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.order.004
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي plus een zelfstandig naamwoord betekent: ik heb. عندي أخت is: ik heb een zus.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.fill.005
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: fill_in_blank
  frame:
    text: عندي {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أخت is zus; het mannelijke woord is أخ.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.translate.006
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Deze familiewoorden zijn zelfstandige naamwoorden; أب is vader en أم is moeder.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Ik heb een zus.
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het Arabisch heeft geen woord voor ''een'': عندي أخت is letterlijk gewoon: ik heb zus.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.translate.008
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Ik heb een broer.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أخ (broer) en أخت (zus) verschillen alleen door de eind-ت.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson01.order.009
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item} وأم.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item} وأم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het voegwoord و (en) wordt aan het volgende woord vastgeschreven: وأم is en moeder.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.listen.001
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: De uitgang ـك in عائلتك betekent jouw, dus عائلتك is jouw gezin.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.choose.002
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يا staat voor een naam als je iemand aanspreekt of roept, zoals in يا يوسف.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.match.003
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'De uitgang ـك betekent jouw: عائلتك is jouw gezin en أختك is jouw zus.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ vraagt wie er in jouw gezin zit; يا يوسف spreekt Yusuf aan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم betekent naam; ما اسم أختك؟ vraagt: hoe heet jouw zus?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و (en) wordt vastgeschreven aan het volgende woord, dus en moeder is وأم.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسمها is اسم plus ـها, en betekent dus: haar naam.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'Layla vraagt aan Yusuf: Hoe heet je zus?'
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك schrijf je hetzelfde voor een man of een vrouw; hier wordt Yusuf aangesproken.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: Haar naam is Nour.
    language_code: nl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها is naam plus ـها (haar), dus een apart woord voor 'is' is niet nodig.
    language_code: nl
    direction: ltr
