    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Het pakket is mannelijk, dus zeggen we يصل (yaṣil). De brief is vrouwelijk, dus zeggen we تصل (taṣil). Een werkwoord in de tegenwoordige tijd begint met ي bij een mannelijk onderwerp en met ت bij een vrouwelijk onderwerp, zoals in الطرد يصل (aṭ-ṭard yaṣil) en الرسالة تصل.
    language_code: nl
    direction: ltr
