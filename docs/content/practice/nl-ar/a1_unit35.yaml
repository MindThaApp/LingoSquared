  frame:
    text: Het pakket komt morgen aan en de brief doet er drie dagen over.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
