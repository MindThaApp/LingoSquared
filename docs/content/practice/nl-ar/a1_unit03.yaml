    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عشرة is tien; zoals elk telwoord van drie tot tien eindigt het op ة.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson02.translate.004
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ستة (zes) en سبعة (zeven) beginnen allebei met س; aan de eindletters zie je het verschil.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson03.choose.001
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كم vraagt hoeveel, en هذا wijst naar iets dat dicht bij je is.
    language_code: nl
    direction: ltr
