templates:
- content_key: practice.nl-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Elk telwoord lees je van rechts naar links; ثلاثة begint met ث, die klinkt als de th in het Engelse think.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ثلاثة (drie) en ثمانية (acht) beginnen allebei met ث, de th-klank; aan de rest van het woord herken je het verschil.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Het woord voor drie, ثلاثة, eindigt op ة, net als veel andere Arabische zelfstandige naamwoorden.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Het Arabisch heeft een speciale tweevoudsuitgang ـان voor twee van iets; اثنان is zelf het woord voor twee.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De getallen drie tot en met tien eindigen bij het tellen op ة, zoals in ثلاثة en خمسة.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'سبعة (zeven) en تسعة (negen) eindigen op dezelfde letters عة, dus luister naar de eerste klank: s of t.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: word_order
  frame:
    text: رقمي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'رقمي betekent mijn nummer: رقم is nummer en de uitgang ـي betekent mijn.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: fill_in_blank
