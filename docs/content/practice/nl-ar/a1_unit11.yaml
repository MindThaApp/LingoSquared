  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dit zijn werkwoorden en vrouwelijke rangtelwoorden voor uren; de werkwoorden staan allemaal in de eerste persoon.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.translate.009
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Ik word om zeven uur wakker. (geen apart woord voor ik)
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Het uur is een vrouwelijk rangtelwoord, omdat الساعة vrouwelijk is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.translate.010
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Ik studeer om negen uur. (geen apart woord voor ik)
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Werkwoorden in de eerste persoon hebben geen voornaamwoord nodig: أدرس alleen betekent al ik studeer.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.translate.011
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Ik ga om tien uur slapen. (geen apart woord voor ik)
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: أنام في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: العاشرة is de tiende en eindigt op ة, net als de andere vrouwelijke uren.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson02.listen.001
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ماذا is het vraagwoord wat; ماذا تفعل؟ betekent: wat doe je?'
    language_code: nl
    direction: ltr
