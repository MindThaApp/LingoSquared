    - fifth
    - sixth
  feedback_frame:
    text: 'De uren zijn vrouwelijke rangtelwoorden die congrueren met الساعة: السابعة is de zevende.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.order.005
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أنا {item} كل يوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} كل يوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'De werkwoorden in dit onderdeel staan in de eerste persoon: أستيقظ, أدرس en أنام; أنا (ik) is niet verplicht.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.order.006
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أستيقظ في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het uur volgt op الساعة en is vrouwelijk: الساعة السابعة.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.fill.007
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: fill_in_blank
  frame:
    text: أدرس في الساعة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: التاسعة is de negende, vrouwelijk om overeen te komen met الساعة.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.translate.008
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
