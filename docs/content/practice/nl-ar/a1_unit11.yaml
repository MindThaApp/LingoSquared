    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفعل is de mannelijke je-vorm van doen; ماذا تفعل كل يوم؟ vraagt aan een man wat hij elke dag doet.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson02.order.003
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: word_order
  frame:
    text: ماذا {item} كل يوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} كل يوم؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het werkwoord volgt direct op ماذا: ماذا تفعل؟ betekent: wat doe je?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson02.fill.004
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: fill_in_blank
  frame:
    text: ماذا تفعل كل {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كل يوم betekent elke dag, met يوم (dag) na كل (elk).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson02.translate.005
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تفعل is de mannelijke je-vorm: jij doet. ماذا is wat.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit11.lesson02.translate.006
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: Wat doe je elke dag? (tegen een man)
    language_code: nl
    direction: ltr
  slots:
    a: *id013
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b} كل يوم'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Eerst komt het vraagwoord, dan het werkwoord: ماذا تفعل.'
    language_code: nl
    direction: ltr
