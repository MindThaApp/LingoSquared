templates:
- content_key: practice.nl-ar.ar.a1.unit11.lesson01.choose.001
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'أستيقظ, أدرس en أنام zijn allemaal werkwoorden in de eerste persoon van de tegenwoordige tijd: ik word wakker, ik studeer, ik slaap.'
    language_code: nl
    direction: ltr
