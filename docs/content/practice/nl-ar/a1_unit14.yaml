      - w_أحب
      - w_القهوة
      - w_شاي
      - w_الماء
      - w_ولا
      - w_أفضل
  l02: &id008
    language_code: ar
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - w_أفضل
      - w_تفضل
      - w_القهوة
      - w_الشاي
  drinks: &id003
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_القهوة
      - w_الشاي
      - w_الماء
  qahwa:
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_القهوة
  shay: &id007
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_شاي
  shayd:
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_الشاي
  maa: &id006
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_الماء
  uhibb: &id005
    language_code: ar
    part_of_speech: verb
    agreement_tags:
      semantic: w_أحب
  wala: &id004
    language_code: ar
    part_of_speech: particle
    agreement_tags:
      semantic: w_ولا
  ufaddil: &id010
    language_code: ar
    part_of_speech: verb
    agreement_tags:
