  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب وأقرأ في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في العمل betekent op het werk; ال is een deel van العمل.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson02.fill.005
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: fill_in_blank
