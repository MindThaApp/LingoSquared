    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson01.translate.010
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: Ik werk op een kantoor. (geen apart woord voor ik)
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعمل betekent al ik werk, dus أنا is niet nodig.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson02.choose.001
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكتب is ik schrijf en أقرأ is ik lees; beide zijn werkwoorden in de eerste persoon.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson02.listen.002
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: listen_select
