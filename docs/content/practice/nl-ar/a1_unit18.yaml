    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عمل is het zelfstandig naamwoord werk, terwijl أعمل het werkwoord ik werk is; أكتب en أقرأ zijn ook werkwoorden in de eerste persoon.
    language_code: nl
    direction: ltr
