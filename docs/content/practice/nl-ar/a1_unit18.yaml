    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De و zit vast aan het werkwoord: وأقرأ betekent en ik lees.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson02.translate.006
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أكتب en أقرأ zijn werkwoorden in de eerste persoon; العمل is het werk met ال.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson02.translate.007
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
