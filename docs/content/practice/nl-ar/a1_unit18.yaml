    kind: render_frame
    frame:
      text: أنا {item} في العمل.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أنا (ik) is bij deze werkwoorden optioneel, omdat ze al ik schrijf en ik lees betekenen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit18.lesson02.order.004
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
