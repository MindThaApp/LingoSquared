    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: العمل heeft ال, dus het betekent het werk; في العمل is op het werk.
    language_code: nl
    direction: ltr
