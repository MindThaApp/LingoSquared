  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: Ik lees op mijn werk. (geen apart woord voor ik)
    language_code: nl
    direction: ltr
  slots:
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أقرأ في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Eerst komt het werkwoord, dan في en de plaats.
    language_code: nl
    direction: ltr
