templates:
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.choose.001
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الساعة is ال (de/het) plus ساعة (uur); het betekent zowel het uur als de tijd op de klok.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.match.002
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uurgetallen zijn vrouwelijk, passend bij الساعة: الثالثة en الخامسة eindigen op ة, anders dan de mannelijke rangtelwoorden die bij datums horen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.order.003
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het uur volgt direct op الساعة en komt ermee overeen, dus beide zijn vrouwelijk: الساعة الثالثة.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.fill.004
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم الساعة؟ is letterlijk 'hoeveel het uur', de gebruikelijke manier om te vragen hoe laat het is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.translate.005
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: صباحا betekent 's ochtends en staat na de tijd; voor de avond gebruikt deze unit مساء.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.translate.006
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: Het is drie uur.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Het rangtelwoord الثالثة is vrouwelijk, passend bij الساعة.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.translate.007
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: Het is vijf uur 's ochtends.
    language_code: nl
    direction: ltr
  slots:
    a: *id006
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het dagdeel staat aan het eind: الساعة الخامسة صباحا.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.order.008
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة الخامسة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة الخامسة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Voeg صباحا (ochtend) toe na de tijd, of مساء voor de middag en avond.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson02.listen.001
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: متى is het vraagwoord wanneer; het vraagt naar tijd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson02.match.002
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'ومتى is و (en) vastgemaakt aan متى (wanneer): en wanneer. Zo ga je door naar een tweede vraag.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson02.order.003
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: word_order
  frame:
    text: الدرس في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة vóór een getal geeft het tijdstip van een gebeurtenis aan: om drie uur.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson02.fill.004
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: fill_in_blank
  frame:
    text: كم الساعة؟ الساعة الثالثة. {item} الدرس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De و in ومتى koppelt de vraag aan wat net gezegd is, zoals 'en' in het Nederlands.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson02.translate.005
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متى vraagt wanneer en ومتى vraagt en wanneer; alleen de tweede zet een eerdere vraag voort.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson02.translate.006
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: De les is om vijf uur.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة plus het uur betekent om dat uur: الدرس في الساعة الخامسة.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit05.lesson01.listen.009
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: De gedeelde uitgang ة laat zien dat الثالثة en الخامسة vrouwelijke rangtelwoorden zijn.
    language_code: nl
    direction: ltr
