templates:
- content_key: practice.nl-ar.ar.a1.unit04.lesson01.choose.001
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اليوم betekent letterlijk 'de dag', met het lidwoord ال vastgeschreven aan het begin; zo zegt het Arabisch 'vandaag'.
    language_code: nl
    direction: ltr
