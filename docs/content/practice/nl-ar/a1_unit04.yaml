    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: في betekent 'in' of 'op' en wordt als apart woord geschreven, anders dan ب, dat aan het volgende woord vastzit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.order.003
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: اليوم {item} من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {item} من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Rangtelwoorden krijgen ال: الخامس is de vijfde en السادس is de zesde.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.fill.004
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: fill_in_blank
  frame:
    text: اليوم الخامس من {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
