    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: De maandnamen مايو en يونيو volgen de internationale namen mei en juni.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson01.order.003
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: word_order
  frame:
    text: اليوم الخامس من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم الخامس من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Datums lees je in het Arabisch met eerst de dag, dan من (van) en de maand.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson01.fill.004
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: fill_in_blank
  frame:
    text: ما {item} اليوم؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟ is de gebruikelijke manier om naar de datum van vandaag te vragen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson01.translate.005
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Maandnamen schrijf je als één woord: مايو voor mei en يونيو voor juni.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson01.translate.006
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: Welke datum is het vandaag?
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: De vraag naar de datum gebruikt ما (wat) met تاريخ (datum) en اليوم (vandaag).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rangtelwoorden zoals الخامس (de vijfde) krijgen ال en zijn hier mannelijk, omdat ze verwijzen naar يوم (dag), een mannelijk woord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.match.002
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
