  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De maand volgt na من, dus اليوم الخامس من يونيو betekent: vandaag is het 5 juni.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.order.005
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: الدرس {item} الخامس من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {item} الخامس من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في voor een datum betekent ''op'' die dag: في الخامس من مايو.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.translate.006
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Woorden na في werken zoals elk zelfstandig naamwoord: في الدرس betekent ''in de les'', waarbij ال voor ''de'' zorgt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.translate.007
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Vandaag is het 5 mei.
    language_code: nl
    direction: ltr
  slots:
    a: *id009
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: De vijfde is الخامس en de zesde is السادس; beide zijn mannelijk, omdat ze verwijzen naar يوم (dag).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.translate.008
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Vandaag is het 6 juni.
    language_code: nl
    direction: ltr
  slots:
    a: *id011
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: De zesde is السادس; dit woord is net als de andere rangtelwoorden gevormd met ال vooraan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson01.listen.007
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Maanden hebben hun eigen namen, maar dag en maand worden verbonden door من (van): الخامس من مايو.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.choose.009
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في voor een datum betekent 'op' die dag, en ال geeft een rangtelwoord aan, zoals de vijfde of de zesde.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit04.lesson02.translate.010
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: De les is op 5 mei.
    language_code: nl
    direction: ltr
  slots:
    f: *id008
    d: *id009
    m: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {f} {d} من {m}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Bij de datum van de les staat في (op) voor het rangtelwoord: الدرس في الخامس من مايو.'
    language_code: nl
    direction: ltr
