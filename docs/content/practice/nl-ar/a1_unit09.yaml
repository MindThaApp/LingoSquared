    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هنا betekent hier; سوق is een markt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.match.003
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: قرب (vlak bij) is een voorzetsel, en هنا (hier) is een bijwoord; de andere vier zijn zelfstandige naamwoorden.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.order.004
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: أين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أين betekent waar; het zelfstandig naamwoord van de plaats heeft ال: de bibliotheek, de markt of het café.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.fill.005
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: fill_in_blank
  frame:
    text: المكتبة {item} السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب (vlak bij) staat voor de plaats waar iets vlak bij is, hier de markt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.translate.006
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مكتبة (bibliotheek), سوق (markt) en مقهى (café) zijn plaatsen; مكان is het algemene woord voor plaats.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.translate.007
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: Waar is de bibliotheek?
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال is het Arabische 'de/het'; het wordt vooraan aan het zelfstandig naamwoord vastgeschreven.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.translate.008
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: Waar is de markt?
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het Arabisch heeft geen woord voor ''is'' nodig: أين السوق؟ is letterlijk ''waar de markt''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson01.order.009
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: المكتبة {item} قرب السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هنا (hier) kan voor قرب staan: de bibliotheek is hier, vlak bij de markt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.choose.001
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قرب betekent vlak bij; direct erna komt het zelfstandig naamwoord van de plaats.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.listen.002
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'وأين is و (en) vastgeschreven aan أين (waar): en waar.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.order.003
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: المقهى قرب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'قرب heeft geen extra woord nodig: المقهى قرب المكتبة is het café is vlak bij de bibliotheek.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.order.004
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: وأين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: وأين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'وأين المقهى؟ zet het gesprek voort: en waar is het café?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.fill.005
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} المقهى؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De و in وأين verbindt de nieuwe vraag met de vorige.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.translate.006
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين is en waar, een vervolgvraag; قرب is vlak bij.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.translate.007
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: De bibliotheek is vlak bij de markt.
    language_code: nl
    direction: ltr
  slots:
    a: *id004
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Zelfstandige naamwoorden van een plaats behouden na قرب het lidwoord: قرب السوق is vlak bij de markt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit09.lesson02.translate.008
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: Het café is vlak bij de bibliotheek.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: In de dialoog van deze les is dit precies het antwoord op وأين المقهى؟
    language_code: nl
    direction: ltr
