templates:
- content_key: practice.nl-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر, أصغر en أقرب zijn vergrotende trappen; op elk daarvan volgt من (dan).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De vergrotende trap heeft één vorm voor de vergelijking, gevolgd door من: أقرب من is dichterbij dan.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: De vergrotende trap staat tussen de twee vergeleken zaken, met من (dan) vóór de tweede.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Het Arabisch heeft geen woord voor is nodig: المقهى أصغر من السوق is letterlijk het café kleiner dan de markt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ar.ar.a1.unit15.lesson01.fill.005
