templates:
- content_key: practice.zh-en.en.a1.unit14.lesson01.choose.001
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Free 在这里的意思是“有空”：Are you free tonight? 询问你有没有时间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson02.choose.002
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sorry, can you repeat that? 是礼貌地请对方重复的说法；sorry 用来引出这个请求。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson03.choose.003
  lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Meeting 的意思是“见面、会议”；place 是见面的“地点”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson04.choose.004
  lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How about ...? 用来提出建议；后面接时间或地点：How about 6pm?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson01.order.005
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: word_order
  frame:
    text: Are you {item} tonight?
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Are you {item} tonight?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Are you free? 是询问对方有没有空的标准问句；tonight 放在句末。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson02.order.006
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: word_order
  frame:
    text: Can you speak more {item}, please?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Can you speak more {item}, please?
      language_code: en
      direction: ltr
  feedback_frame:
    text: More slowly 的意思是“更慢地”；副词放在 more 之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson03.order.007
  lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
  type: word_order
  frame:
    text: This message is to {item} a meeting time and place.
    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: This message is to {item} a meeting time and place.
      language_code: en
      direction: ltr
  feedback_frame:
    text: To suggest 的意思是“提议”；概括时用它说明这条信息的目的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson04.order.008
  lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
  type: word_order
  frame:
    text: How {item} 6pm at the cafe?
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: How {item} 6pm at the cafe?
      language_code: en
      direction: ltr
  feedback_frame:
    text: How about ...? 用来提出建议；后面接时间或地点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson01.fill.009
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: fill_in_blank
  frame:
    text: Are you free {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tonight 的意思是“今晚”；在英语中，它前面不加介词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson02.fill.010
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: fill_in_blank
  frame:
    text: Can you {item} that, please? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Repeat that 的意思是“重复一下”；can you ...? 让请求更礼貌。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson02.fill.011
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: fill_in_blank
  frame:
    text: I can't hear you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Well 在这里是 good 的副词形式；I can't hear you well 表示信号不好，听不清楚。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson01.match.012
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sorry、repeat、speak、slowly 和 hear 在电话中很有用；message、suggest 和 meeting 与约见面有关。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson01.translate.013
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Free 在这里的意思是“有空”；tonight 的意思是“今晚”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson02.translate.014
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sorry、repeat、speak、slowly 和 hear 是请对方重复时会用到的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson03.translate.015
  lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Message 是“信息”，meeting 是“见面”，place 是“地点”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson01.translate.016
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: translation
  frame:
    text: 你今晚有空吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Are you {item} tonight?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Are you free? 用来询问对方有没有空；tonight 放在句末。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson02.translate.017
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: translation
  frame:
    text: 请你再说一遍好吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Can you {item} that, please?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Can you ...? 是礼貌的请求；can 后面接动词原形 repeat。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit14.lesson04.translate.018
  lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
  type: translation
  frame:
    text: 下午六点在咖啡馆怎么样？（时间写成 6pm）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: How {item} 6pm at the cafe?
      language_code: en
      direction: ltr
  feedback_frame:
    text: How about ...? 用来提出建议；在英语中，这里的时间写成 6pm。
    language_code: zh
    direction: ltr
