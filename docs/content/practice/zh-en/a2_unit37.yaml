  lesson_content_key: en.a2.unit37.lesson04.video_calls_dialogue
  type: word_order
  frame:
    text: Always, but I mute my microphone when I {item} not speaking.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_am
  answer_derivation:
    kind: render_frame
    frame:
      text: Always, but I mute my microphone when I {item} not speaking.
