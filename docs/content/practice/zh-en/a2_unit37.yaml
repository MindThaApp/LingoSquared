      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语中动词 mute 直接放在宾语前面：I mute my microphone。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit37.lesson01.translate.007
  lesson_content_key: en.a2.unit37.lesson01.video_call_vocabulary
  type: translation
  frame:
    text: 视频通话比上门拜访更快。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_faster
  answer_derivation:
