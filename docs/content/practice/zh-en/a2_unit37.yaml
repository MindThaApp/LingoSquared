- content_key: practice.zh-en.en.a2.unit37.lesson01.translate.006
  lesson_content_key: en.a2.unit37.lesson01.video_call_vocabulary
  type: translation
  frame:
    text: 我不说话时会把麦克风静音。（用一般现在时）
