- content_key: practice.zh-en.en.a2.unit27.lesson01.translate.006
  lesson_content_key: en.a2.unit27.lesson01.banking_vocabulary
  type: translation
  frame:
    text: 我想开一个支票账户。（使用缩写 I'd）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_checking
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to open a {item} account.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 在美国，日常使用的账户叫 checking account；I'd like to 是礼貌地表达愿望的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit27.lesson01.translate.007
  lesson_content_key: en.a2.unit27.lesson01.banking_vocabulary
  type: translation
  frame:
    text: 这个账户不收月费。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_fee
  answer_derivation:
    kind: render_frame
    frame:
      text: There is no monthly {item} on this account.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Fee 是定期支付的费用；“在这个账户上”说 on this account。
    language_code: zh
    direction: ltr
