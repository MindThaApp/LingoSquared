    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_throat
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} hurts.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语里身体部位直接做主语：My throat hurts。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit66.lesson01.fill.005
  lesson_content_key: en.a1.unit66.lesson01.symptom_words
  type: fill_in_blank
  frame:
    text: Take this {item} with water. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_medicine
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: medicine 是不可数名词；前面可以用 this，但不能用 a。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit66.lesson02.fill.006
  lesson_content_key: en.a1.unit66.lesson02.symptom_phrases
  type: fill_in_blank
  frame:
    text: Please {item} a doctor. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_ask
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Please ask a doctor 是礼貌的建议；please 后面的动词不加词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit66.lesson01.translate.007
  lesson_content_key: en.a1.unit66.lesson01.symptom_words
  type: translation
  frame:
    text: 我头痛。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_headache
  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语里 headache 用单数并带 a；汉语的“头痛”没有冠词，要注意补上。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit66.lesson02.translate.008
  lesson_content_key: en.a1.unit66.lesson02.symptom_phrases
  type: translation
  frame:
