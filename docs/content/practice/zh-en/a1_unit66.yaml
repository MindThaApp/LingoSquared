- content_key: practice.zh-en.en.a1.unit66.lesson01.order.003
  lesson_content_key: en.a1.unit66.lesson01.symptom_words
  type: word_order
  frame:
    text: I have a {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_cough
        - w_headache
        - w_fever
  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 说明不适时，英语要用 a：I have a cough、I have a headache、I have a fever。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit66.lesson02.order.004
  lesson_content_key: en.a1.unit66.lesson02.symptom_phrases
  type: word_order
  frame:
