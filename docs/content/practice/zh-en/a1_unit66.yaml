    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_throat
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} hurts.
      language_code: en
      direction: ltr
  feedback_frame:
