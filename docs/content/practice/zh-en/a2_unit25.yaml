        - w_if
        - w_have
        - w_your
        - w_one
        - w_you
        - w_will
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ID 是 identification 的缩写；指带照片的身份证件时，英语说 photo ID。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson03.translate.020
  lesson_content_key: en.a2.unit25.lesson03.reading_a_registration_notice
  type: translation
  frame:
    text: 我会带一份带照片的身份证件。（不要使用缩写）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_will
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} bring a photo ID.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 表示打算做某事的将来时，用 will 加动词原形：I will bring，bring 前面不加 to。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson03.translate.021
  lesson_content_key: en.a2.unit25.lesson03.reading_a_registration_notice
  type: translation
  frame:
    text: 如果您没有水电费账单，可以带您的租赁合同。（不要使用缩写）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_lease
  answer_derivation:
    kind: render_frame
    frame:
      text: If you do not have a utility bill, you can bring your {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Do not 在这里写成完整形式；“租赁合同”要用 lease，而不是 contract。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson04.choose.022
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - adjective
      - preposition
      - particle
      - pronoun
      - adverb
      agreement_tags:
        semantic:
        - w_tell
        - w_long
        - w_lived
        - w_since
        - w_yes
        - w_works
        - w_what
        - w_how
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 用 How long have you lived … 询问持续了多长时间；如果回答的是起点，就以 since 开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson04.listen.023
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - preposition
      - adverb
      - particle
      agreement_tags:
        semantic:
