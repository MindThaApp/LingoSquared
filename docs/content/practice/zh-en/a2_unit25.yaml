- content_key: practice.zh-en.en.a2.unit25.lesson04.order.025
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: word_order
  frame:
    text: How long have you {item} at the new address?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_lived
  answer_derivation:
    kind: render_frame
    frame:
      text: How long have you {item} at the new address?
      language_code: en
      direction: ltr
  feedback_frame:
    text: “你在那里住了多久了？”英语要用 have you lived，也就是现在完成时，不能用一般现在时。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson04.fill.026
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: fill_in_blank
  frame:
    text: '{item} last month. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_since
    hint:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_since
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Since 指起点（“从上个月起”），for 则指时间长度，例如 for two months。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson04.translate.027
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: translation
  frame:
