        - w_lived
        - w_since
        - w_works
        - w_how
        - w_yes
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 请仔细听：lived 以 d 音结尾，works 以 s 音结尾。
    language_code: zh
    direction: ltr
