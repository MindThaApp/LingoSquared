        - w_what
        - w_how
        - w_me
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 对话里会遇到 what、how 这样的疑问词，以及表示“合适、可行”的 works。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson04.translate.028
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: translation
  frame:
    text: 您能告诉我需要带什么吗？（礼貌说法，用“您能……吗”）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: pronoun
      agreement_tags:
        semantic: w_what
  answer_derivation:
    kind: render_frame
    frame:
      text: Could you tell me {item} I need to bring?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 在间接问句里，语序保持陈述句语序：what I need to bring，不需要倒装，也不用 do。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson04.translate.029
  lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
  type: translation
  frame:
    text: 回答“您在新地址住了多久了？”：从上个月开始。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_since
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} last month.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: 回答 How long … 时，可以简短地用 Since 加起点时间来回答。
    language_code: zh
    direction: ltr
