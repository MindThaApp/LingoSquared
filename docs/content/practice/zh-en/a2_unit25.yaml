- content_key: practice.zh-en.en.a2.unit25.lesson01.translate.006
  lesson_content_key: en.a2.unit25.lesson01.registration_vocabulary
  type: translation
  frame:
    text: 我星期五在车辆管理局有个预约。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_appointment
  answer_derivation:
    kind: render_frame
    frame:
      text: I have an {item} at the DMV on Friday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: “有一个预约”说 I have an appointment；冠词用 an，因为 appointment 以元音开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson02.choose.007
