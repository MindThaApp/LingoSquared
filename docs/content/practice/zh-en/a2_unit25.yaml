- content_key: practice.zh-en.en.a2.unit25.lesson02.translate.013
  lesson_content_key: en.a2.unit25.lesson02.making_a_formal_appointment
  type: translation
  frame:
    text: 我需要更新我的地址，因为我上个月搬家了。（不要使用缩写）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: particle
      agreement_tags:
        semantic: w_because
  answer_derivation:
    kind: render_frame
    frame:
      text: I need to update my address {item} I moved last month.
      language_code: en
      direction: ltr
  feedback_frame:
    text: “因为”用 because；英语从句的语序保持不变：because I moved。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit25.lesson02.translate.014
  lesson_content_key: en.a2.unit25.lesson02.making_a_formal_appointment
  type: translation
  frame:
    text: 我想问一下，能不能预约。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: particle
      agreement_tags:
        semantic: w_whether
  answer_derivation:
    kind: render_frame
    frame:
      text: I was wondering {item} I could make an appointment.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 表示“是否”的从句用 whether；make an appointment 的意思是“预约”。
    language_code: zh
    direction: ltr
