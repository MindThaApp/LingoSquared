schema_version: '1.0'
pack_key: practice.zh-en.a1.unit17
source_language: zh
target_language: en
unit_content_key: en.a1.unit17.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_another
    - w_busy
    - w_love
    - w_lunch
    - w_maybe
    - w_movie
    - w_walk
    - w_weekend
    - w_works
templates:
- content_key: practice.zh-en.en.a1.unit17.lesson01.choose.001
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_movie
        - w_weekend
        - w_walk
        - w_lunch
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: movie、weekend、walk 和 lunch 常和 a 或 this 搭配：see a movie、this weekend、go for a walk。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson02.choose.002
  lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - verb
      agreement_tags:
        semantic:
        - w_busy
        - w_maybe
        - w_another
        - w_love
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: busy 表示你没有时间；maybe 和 another time 能让拒绝显得更委婉。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson01.order.003
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: word_order
  frame:
    text: Do you want to see a {item} this weekend?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_movie
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you want to see a {item} this weekend?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Do you want to 后面接动词原形：Do you want to see ...?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson01.order.004
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: word_order
  frame:
    text: Would you like to go for a {item}?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_walk
  answer_derivation:
    kind: render_frame
    frame:
      text: Would you like to go for a {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: go for a walk 是表示“散步”的固定说法，前面要有 a。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson03.fill.005
  lesson_content_key: en.a1.unit17.lesson03.reading_an_invitation
  type: fill_in_blank
  frame:
    text: Do you want to have {item} on Friday? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_lunch
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: have lunch：三餐前不加冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson02.fill.006
  lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
  type: fill_in_blank
  frame:
    text: Sorry, I can't. I'm {item} on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_busy
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I'm busy on Saturday 是拒绝时常用的理由。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson02.translate.007
  lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
  type: translation
  frame:
    text: 改天再约好吗？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_maybe
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} another time?'
      language_code: en
      direction: ltr
  feedback_frame:
    text: Maybe another time? 能让拒绝显得礼貌，并且给对方留有余地。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson04.translate.008
  lesson_content_key: en.a1.unit17.lesson04.negotiating_a_plan_dialogue
  type: translation
  frame:
    text: 周日我可以。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_works
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunday {item} for me.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Works for me 的意思是“我可以”；works 带 -s，是因为 Sunday 是第三人称单数主语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit17.lesson01.match.009
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_movie
        - w_weekend
        - w_walk
        - w_lunch
        - w_busy
        - w_maybe
        - w_another
        - w_love
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 这些词都与邀请和拒绝有关：活动（movie、walk、lunch）和回应（busy、maybe、love）。
    language_code: zh
    direction: ltr
