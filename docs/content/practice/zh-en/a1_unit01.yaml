templates:
- content_key: practice.zh-en.en.a1.unit01.lesson01.choose.001
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英语里没有像中文“你好”那样全天通用的问候语：要根据时间段选择 good morning、good afternoon 或 good evening。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson01.listen.002
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hello 是中性的问候语；good morning、good afternoon 和 good evening 则要看一天中的时间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.choose.003
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How are you? 是询问近况的常用说法；对朋友和对陌生人说法相同，不像中文要区分“你”和“您”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.listen.004
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I'm fine, thanks. 后面常接 And you? 把问题回问给对方；not bad 是一种随意、谦逊的回答。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson05.choose.005
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 初次见面时说 Nice to meet you，对方的回应是 Nice to meet you too。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson05.listen.006
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 当你当天还会再见到对方时，说 See you later。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson01.order.007
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: word_order
  frame:
    text: Good {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Good {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 问候语要看时间段：morning 用到中午前后，afternoon 在其后，evening 用于晚上。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson01.match.008
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Thanks 是“谢谢”的随意简略说法；fine 和 bad 用来描述一个人的状况。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.fill.009
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: How are {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 英语里 you 既可以指“你”也可以指“您”，所以 How are you? 这个问句在任何场合都不用改。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.fill.010
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: Not {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Not bad 字面意思是“不坏”，是回答近况时一种常见而谦逊的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.order.011
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: word_order
  frame:
    text: I'm {item}, thanks.
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm 是 I am 的缩写；回答 How are you? 时可以用 fine 或 good。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson05.order.012
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: word_order
  frame:
    text: See you {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you later 字面意思是“稍后见”，表示“回头见”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson05.fill.013
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: fill_in_blank
  frame:
    text: Nice to meet you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Too 放在句末，表示“也”；用它来回应 Nice to meet you。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson01.translate.014
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 英语里问候和道别要看时间段；Goodbye 是中性的道别语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.translate.015
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 单词 not 表示否定后面的内容：not bad 的意思是“不坏”，thanks 是“谢谢”的随意说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson03.translate.016
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: 你好吗？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: How are {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语里只有一个 you，既指“你”也指“您”，所以这个句子在两种场合都可以使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson05.translate.017
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: 回头见。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 有了 See you，表示“稍后”的词就变成了道别语“回头见”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit01.lesson05.translate.018
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 动词 meet 的意思是“认识”或“见面”；have a good day 是一种友好的道别祝愿。
    language_code: zh
    direction: ltr
