- content_key: practice.zh-en.en.a2.unit26.lesson01.order.004
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: word_order
  frame:
    text: On the other {item}, it's very close to the playground.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_hand
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other {item}, it's very close to the playground.
      language_code: en
      direction: ltr
  feedback_frame:
    text: On the other hand 字面意思是“在另一只手上”，相当于汉语的“另一方面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson01.translate.005
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - noun
      - adjective
      agreement_tags:
        semantic:
        - w_think
        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Opinion 中间只有一个 n，以 -ion 结尾；agree 有两个 e。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: 在我看来，新的狗公园是个好主意，因为狗需要有地方跑。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion 放在句首，用逗号与后面的内容隔开。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.choose.007
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - preposition
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_idea
        - w_space
        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在谈论狗公园的对话里，你会遇到 dog、park、space 和动词 run。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.listen.008
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_space
        - w_run
        - w_idea
        - w_good
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 请听元音：dog 的元音短，park 的元音长，而且 r 能清楚地听到。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.order.009
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: word_order
  frame:
    text: What do you think {item} the new dog park?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_about
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think {item} the new dog park?
      language_code: en
      direction: ltr
  feedback_frame:
    text: think 之后用 about 引出话题：What do you think about …? 意思是“你对……有什么看法？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.fill.010
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: fill_in_blank
  frame:
    text: I think it's a {item} idea because dogs need space to run. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
    hint:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A good idea 中，名词前面要加冠词 a；good 的比较级是 better，不是 gooder。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.translate.011
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - preposition
      agreement_tags:
        semantic:
        - w_dog
        - w_dogs
        - w_park
        - w_idea
        - w_space
        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 复数 dogs 只需加 -s；space 在这里的意思是“空间、场地”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.translate.012
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: 你觉得新的狗公园怎么样？（用 think 来表达）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_park
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think about the new dog {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 汉语的“你对……有什么看法”，英语说 What do you think about …?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: 我觉得这是个好主意，因为狗需要有地方跑。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
    frame:
      text: I think it's a good {item} because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: “我觉得”用 I think；理由用 because 接在后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson03.choose.014
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adverb
      - verb
      - noun
      agreement_tags:
        semantic:
        - w_very
        - w_close
        - w_playground
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Very 放在形容词或副词之前，这里在 close 前：very close 的意思是“很近”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson03.order.015
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: word_order
  frame:
    text: On the other hand, it's {item} close to the playground.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_very
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's {item} close to the playground.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Very 加强 close 的程度；very close 的意思是“很近”，语序和汉语相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson03.translate.016
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - adverb
      - verb
      - noun
      agreement_tags:
        semantic:
        - w_very
        - w_close
        - w_playground
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Playground 由 play 和 ground 组成，是复合词，意思是“游乐场”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson03.translate.017
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: 另一方面，它离游乐场很近。（使用缩写 it's）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_playground
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's very close to the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Close to the playground 的意思是“靠近游乐场”；close 后面接 to。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson04.choose.018
  lesson_content_key: en.a2.unit26.lesson04.opinion_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
