    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_fair
    hint:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_fair
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fair point 表示承认对方的论点有道理，即使你不完全同意；字面意思是“公平的一点”。
    language_code: zh
