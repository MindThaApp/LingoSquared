  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - noun
      - adjective
      agreement_tags:
        semantic:
        - w_think
        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 表达自己的看法时说 I think 或 in my opinion；“同意”是 to agree。
    language_code: zh
    direction: ltr
