    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson04.order.022
  lesson_content_key: en.a2.unit26.lesson04.opinion_dialogue
  type: word_order
  frame:
    text: Yes, I think that would be {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_better
  answer_derivation:
    kind: render_frame
    frame:
      text: Yes, I think that would be {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Better 是 good 的比较级；它放在 would be 之后，意思是“会更好”。
    language_code: zh
    direction: ltr
