        - w_move
        - w_better
        - w_away
        - w_but
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 用 That's a fair point 表示认可对方的论点；maybe 的意思是“也许”，but 的意思是“但是”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit26.lesson04.listen.019
  lesson_content_key: en.a2.unit26.lesson04.opinion_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adverb
      - verb
      - adjective
      agreement_tags:
        semantic:
        - w_maybe
        - w_should
        - w_better
        - w_farther
        - w_little
        - w_fair
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 请注意重音：maybe 的重音在第一个音节，better 也是。
    language_code: zh
    direction: ltr
