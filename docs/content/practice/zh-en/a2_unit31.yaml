- content_key: practice.zh-en.en.a2.unit31.lesson02.translate.010
  lesson_content_key: en.a2.unit31.lesson02.asking_about_alternatives
  type: translation
  frame:
    text: 我想知道火车为什么晚点了。（用 “I was wondering” 表示礼貌）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_delayed
  answer_derivation:
    kind: render_frame
    frame:
      text: I was wondering why the train is {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 这里的 Delayed 是形容词：The train is delayed。用 I was wondering 来问会显得更礼貌。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit31.lesson03.choose.011
