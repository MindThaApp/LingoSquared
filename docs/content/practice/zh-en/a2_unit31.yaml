        - w_delayed
        - w_another
        - w_way
        - w_tonight
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 用 I was wondering why 礼貌地询问原因。Delayed 表示火车晚到了。
    language_code: zh
    direction: ltr
