- content_key: practice.zh-en.en.a2.unit31.lesson01.translate.005
  lesson_content_key: en.a2.unit31.lesson01.disruption_vocabulary
  type: translation
  frame:
    text: 我在车站看到了一则关于晚点的通知。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_notice
  answer_derivation:
    kind: render_frame
    frame:
      text: I read a {item} about the delay at the station.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 这里的 Notice 指告示或通知。Read 的过去式拼写与原形相同，但读作“red”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit31.lesson02.choose.006
  lesson_content_key: en.a2.unit31.lesson02.asking_about_alternatives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - adjective
      agreement_tags:
