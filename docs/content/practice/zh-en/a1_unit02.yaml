templates:
- content_key: practice.zh-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Your 和 my 是表示所属的词：my name 是“我的名字”，your name 是“你的名字”或“您的名字”，因为英语不区分“你”和“您”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: What's 是 what is 的缩写，用来引出询问名字的问句：What's your name?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在英语中，职业名称前通常要加冠词：a student、a teacher，但是 an engineer，因为后面的词以元音开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: He 指男性，she 指女性；两者都和 is 连用：he is、she is。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson03.choose.005
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在图书馆你会听到 Welcome to the library；the 是定冠词，使用时不受名词类别影响。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson03.listen.006
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Thank you 是表示“谢谢”的礼貌标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson01.order.007
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My {item} is Leila.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} is Leila.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语字面上说的是“My name is ……”；动词 is 位于 name 和名字之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.order.008
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: word_order
  frame:
    text: I am a {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: I am a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 在职业或身份前，英语要加冠词 a：I am a student，这和中文“我是学生”不同，中文不需要冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson01.fill.009
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: fill_in_blank
  frame:
    text: What's {item} name? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Your 对应 you，既可指“你的”也可指“您的”；表示“我的”要用 my。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.fill.010
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: She is {item} engineer. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在元音音素之前用 an 而不是 a：an engineer，但是 a teacher。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.fill.011
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: '{item} is a teacher. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: He 是男性形式；指女性用 she，指多人则用 they。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.match.012
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Yes 和 no 用来回答问题，就像中文的“是”和“不是”；student 和 teacher 是身份名称，前面需要冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson03.fill.013
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: fill_in_blank
  frame:
    text: Welcome to {item} library. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 定冠词 the 的形式不变，不论后面的名词是什么。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson01.translate.014
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: 你叫什么名字？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: What's {item} name?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语字面上问的是“你的名字是什么？”；这个问句对朋友和陌生人说法相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson01.translate.015
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: 我的名字是 Leila。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} name is Leila.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: My 是表示“我的”的词；在句中放在名词 name 之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.translate.016
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 像 student 或 teacher 这样的身份名称，男女用同一个形式；没有单独的女性词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson02.translate.017
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: 她是工程师。（完整写出，不用缩写）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item} engineer.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 许多英语职业名称没有单独的女性形式：男工程师和女工程师都叫 engineer。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit02.lesson03.translate.018
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Welcome 用作进门时的问候；thank 属于 thank you。
    language_code: zh
    direction: ltr
