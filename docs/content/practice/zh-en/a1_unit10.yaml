templates:
- content_key: practice.zh-en.en.a1.unit10.lesson01.choose.001
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Turn left 和 turn right 是不带 you 的祈使句；中文也常省略主语，说“向左转”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson02.choose.002
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Can't 是 cannot 的缩写；You can't miss it 的意思是你根本不可能错过目的地。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson03.choose.003
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: First 和 second 是序数词；它们和 the 一起放在名词前面：the first street。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson01.order.004
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: word_order
  frame:
    text: Turn {item} at the corner.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item} at the corner.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Left 和 right 跟在 Turn 之后，前面不用冠词；而要说在某一侧时则要用 on the：on the left。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson02.order.005
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: word_order
  frame:
    text: It's just two {item} from here.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's just two {item} from here.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Minutes 是 minute 的复数；数字 two 之后用复数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson03.order.006
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: word_order
  frame:
    text: Take the {item} street on the left.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the {item} street on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 像 first 和 second 这样的序数词要和 the 一起放在名词前面：the first street，the second street。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson01.fill.007
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: fill_in_blank
  frame:
    text: Turn left at the {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: At the corner 的意思是“在拐角处”；用 at 说明转弯的地点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson02.fill.008
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: You can't {item} it. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Miss 在这里的意思是“错过”或“没看到”；You can't miss it 是目的地很显眼时常说的话。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson02.fill.009
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: How do I {item} to the bank? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get to 的意思是“到达”；How do I get to ...? 是询问路线的常用问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson03.fill.010
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: fill_in_blank
  frame:
    text: Take the first {item} on the left. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Street 是街道；句中用 on the left，因为说明的是在哪一侧。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson01.match.011
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 这个游戏中的词语描述路线：turn、left、right、straight 和 stop 是指示，corner 和 street 是地点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson01.translate.012
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Left 和 right 作副词放在 turn 之后：Turn left，Turn right。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson02.translate.013
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get 在这里的意思是“到达”；minutes 是 minute 的复数；miss 的意思是“错过”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson03.translate.014
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Take the first street 的意思是“走第一条街”；directions 在英语中用复数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson01.translate.015
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: 向左转。
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Turn left 是简短的命令；不需要 you，也不需要冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson02.translate.016
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: 你不会错过的。（用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: You can't {item} it.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Can't 是 cannot 的缩写；miss 在这里的意思是“错过”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit10.lesson03.translate.017
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: 走左边的第一条街。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the first {item} on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: On the left 在英语中放在名词后面：the first street on the left；中文则是修饰语在前：“左边的第一条街”。
    language_code: zh
    direction: ltr
