      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I'll 是 I will 的缩写；I'll take it 的意思是“我买了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson01.match.012
  lesson_content_key: en.a1.unit12.lesson01.clothing_items
