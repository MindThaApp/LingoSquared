  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Shirt 是“衬衫”；this 指你手里拿着的那一件。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson02.fill.009
  lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
  type: fill_in_blank
  frame:
    text: Do you have it in {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 说颜色时，in 后面不加冠词：in blue, in black。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson03.fill.010
  lesson_content_key: en.a1.unit12.lesson03.reading_a_label
