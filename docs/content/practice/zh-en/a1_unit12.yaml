  answer_derivation:
    kind: render_frame
    frame:
      text: Yes, {item} do.
      language_code: en
      direction: ltr
  feedback_frame:
    text: We do 是对 Do you have ...? 的简短回答，只重复 do，而不重复整个句子。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson01.fill.008
