    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Small、medium 和 large 是尺码；blue 和 black 是颜色。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson03.translate.015
  lesson_content_key: en.a1.unit12.lesson03.reading_a_label
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Size 是“尺码”，color 是“颜色”；dress 是“连衣裙”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson01.translate.016
  lesson_content_key: en.a1.unit12.lesson01.clothing_items
  type: translation
  frame:
    text: 这件衬衫是蓝色的。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is blue.
      language_code: en
      direction: ltr
  feedback_frame:
    text: is 后面直接接形容词 blue，不加冠词；shirt 是“衬衫”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson02.translate.017
  lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
  type: translation
  frame:
    text: 这个有蓝色的吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have it in {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 Do you have it in ...? 询问有没有别的颜色或尺码。
    language_code: zh
    direction: ltr
