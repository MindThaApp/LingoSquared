  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 颜色词放在名词前面（a blue shirt），询问颜色时则用 in 加颜色：in blue。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson04.choose.003
  lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I'll 是 I will 的缩写，用来表示临时做出的决定：I'll take it。We 的意思是“我们”，如 Yes, we do。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson03.choose.004
  lesson_content_key: en.a1.unit12.lesson03.reading_a_label
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Size 和 color 常见于标签上；冒号后面是具体内容，例如 Size: Medium。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson01.order.005
  lesson_content_key: en.a1.unit12.lesson01.clothing_items
  type: word_order
  frame:
    text: I'll take the {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I'll take the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 the 指你正在看的那件衣服；I'll take ... 的意思是“我要买……”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson02.order.006
  lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
  type: word_order
  frame:
    text: Do you have it in {item}?
    language_code: en
    direction: ltr
  slots:
