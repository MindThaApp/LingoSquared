    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Size 的意思是“尺码”；用 What size ...? 询问尺码，标签上会写 Size: Medium 这样的内容。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson04.fill.011
  lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
