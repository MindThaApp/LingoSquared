    text: 好的，我买了，谢谢。（用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: OK, {item} take it, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'll 是 I will 的缩写，表示说话时当场做出的决定。
    language_code: zh
    direction: ltr
