templates:
- content_key: practice.zh-en.en.a1.unit12.lesson01.choose.001
  lesson_content_key: en.a1.unit12.lesson01.clothing_items
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pants 总是用复数，即使只指一条裤子；一条可以说 a pair of pants，一双鞋可以说 a pair of shoes。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson02.choose.002
  lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
