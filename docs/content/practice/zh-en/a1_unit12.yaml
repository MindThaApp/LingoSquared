  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have it in {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 in 说出想要的颜色：Do you have it in blue?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit12.lesson04.order.007
  lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
  type: word_order
  frame:
    text: Yes, {item} do.
    language_code: en
    direction: ltr
  slots:
