- content_key: practice.zh-en.en.a2.unit30.lesson02.translate.010
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: 我有两年社交媒体营销方面的经验。（数字请用单词拼写）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_two
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} years of experience in social media marketing.
      language_code: en
      direction: ltr
  feedback_frame:
    text: two 后面的 years 要用复数。用 of experience in 引出所在的领域。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit30.lesson02.translate.011
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: 我的优势之一是做事有条理。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_being
  answer_derivation:
    kind: render_frame
    frame:
      text: One of my strengths is {item} organized.
      language_code: en
      direction: ltr
  feedback_frame:
    text: is 后面用 being，因为这里把“做到有条理”当作一种状态来说：One of my strengths is being organized。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit30.lesson03.choose.012
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
