- content_key: practice.zh-en.en.a2.unit30.lesson03.translate.016
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Bright Path Marketing 正在招聘一名市场协调专员。（用进行时）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_looking
  answer_derivation:
    kind: render_frame
    frame:
      text: Bright Path Marketing is {item} for a marketing coordinator.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 进行时 is looking for 表示“正在招聘”。其中的 for 与 look for 固定搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit30.lesson03.translate.017
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: 我会按时完成任务，也善于团队合作。（请不要使用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_well
  answer_derivation:
    kind: render_frame
    frame:
      text: I meet deadlines, and I work {item} in a team.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Well 是 good 对应的副词：I work well。work 后面不用形容词。
    language_code: zh
    direction: ltr
