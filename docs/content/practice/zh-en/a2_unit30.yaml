        - w_skills
        - w_strong
        - w_interview
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 你的 resume 是简历，是你带去参加 interview 的材料。Skills 是技能，requirements 是职位的要求。
    language_code: zh
    direction: ltr
