- content_key: practice.zh-en.en.a2.unit30.lesson01.translate.005
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: translation
  frame:
    text: 面试官问了我什么时候可以到岗。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_availability
  answer_derivation:
    kind: render_frame
    frame:
      text: The interviewer asked about my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Availability 是“可到岗时间”：你可以开始工作或上班的时间段。Asked about 表示“询问了……”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit30.lesson02.choose.006
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic:
        - w_years
        - w_strengths
        - w_organized
        - w_available
        - w_next
        - w_monday
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 用 I'm available to start 来说明你的开始日期。Next Monday 是“下周一”。
    language_code: zh
    direction: ltr
