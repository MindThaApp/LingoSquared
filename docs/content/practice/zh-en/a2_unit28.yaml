    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson01.translate.006
  lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
  type: translation
  frame:
    text: 医生给我开了这种药的处方。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_prescription
  answer_derivation:
    kind: render_frame
    frame:
      text: The doctor wrote me a {item} for the medicine.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 医生开的“处方”是 prescription；前面用冠词 a。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.choose.007
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - noun
      agreement_tags:
        semantic:
        - w_see
        - w_doctor
        - w_had
        - w_three
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: To see a doctor 的意思是“去看医生”；see 在这里指“就诊”，不是“看见”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.listen.008
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_doctor
        - w_three
        - w_see
        - w_had
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 请注意 three 的发音：th 要把舌头放在上下牙之间，不是 s 的发音。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.order.009
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: word_order
  frame:
    text: I'd like to make an appointment to {item} a doctor, please.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_see
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to {item} a doctor, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 to see a doctor 表示你想去看医生；please 让请求更礼貌。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.fill.010
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: fill_in_blank
  frame:
    text: I've {item} a headache and a sore throat for three days. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_had
    hint:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_had
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 用 I've had 描述持续到现在的症状：现在完成时加 for three days。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.translate.011
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - noun
      - preposition
      agreement_tags:
        semantic:
        - w_see
        - w_doctor
        - w_had
        - w_three
        - w_for
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Doctor 只有在作为头衔时才不加冠词；其他时候要说 a doctor 或 the doctor。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.translate.012
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: 请预约看医生。（使用缩写 I'd）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_doctor
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: “预约”是 make an appointment；I'd like to 是礼貌地表达愿望的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: 我头痛和喉咙痛已经三天了，而且越来越严重。（使用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: For 说明持续的时间（“三天”）；搭配现在完成时：I've had。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson03.choose.014
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - adverb
      - verb
      agreement_tags:
        semantic:
        - w_ten
        - w_minutes
        - w_early
        - w_confirmed
        - w_today
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在预约确认信息中，你会读到 confirmed（已确认）、today（今天）以及表示时间的 ten minutes early。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson03.order.015
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: word_order
  frame:
    text: Please bring your insurance card and arrive {item} minutes early.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_ten
  answer_derivation:
    kind: render_frame
    frame:
      text: Please bring your insurance card and arrive {item} minutes early.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 数字后面的 minutes 用复数：ten minutes；early 放在后面，意思是“提前”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson03.fill.016
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: fill_in_blank
  frame:
    text: Your appointment is confirmed for 3pm {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_today
    hint:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_today
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Today 的意思是“今天”；在英语中它放在时间之后，如 3pm today。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson03.translate.017
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - adverb
      - verb
      agreement_tags:
        semantic:
        - w_ten
        - w_minutes
        - w_early
        - w_confirmed
        - w_today
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Confirmed 是 confirm 的过去分词，放在 is 之后：Your appointment is confirmed。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit28.lesson03.translate.018
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: translation
  frame:
    text: 您的预约已确认为今天下午三点。（时间写成 “3pm”）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_today
  answer_derivation:
    kind: render_frame
    frame:
      text: Your appointment is confirmed for 3pm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 表示“今天”的 today 放在句末；下午三点在英语中写成 3pm。
    language_code: zh
    direction: ltr
