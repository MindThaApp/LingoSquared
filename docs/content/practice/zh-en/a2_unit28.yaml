- content_key: practice.zh-en.en.a2.unit28.lesson01.order.004
  lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
  type: word_order
  frame:
    text: The doctor gave me some {item} for my headache.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
