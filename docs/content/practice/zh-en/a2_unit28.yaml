  answer_derivation:
    kind: render_frame
    frame:
      text: The doctor gave me some {item} for my headache.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Medicine 是不可数名词：说 some medicine，不能说 a medicine 或 medicines。
    language_code: zh
    direction: ltr
