    frame:
      text: 'Apples: two dollars {item} pound.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: Per pound 的意思是“每磅”，用在价签上；口语里说 a pound。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson01.fill.008
  lesson_content_key: en.a1.unit08.lesson01.quantities
