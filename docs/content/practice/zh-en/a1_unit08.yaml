templates:
- content_key: practice.zh-en.en.a1.unit08.lesson01.choose.001
  lesson_content_key: en.a1.unit08.lesson01.quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pound、kilo、bottle 和 bag 是数量单位，用 of 与物品相连：a bag of rice；只有 dozen 之后通常没有 of：a dozen eggs。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson01.listen.002
  lesson_content_key: en.a1.unit08.lesson01.quantities
