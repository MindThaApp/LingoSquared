    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Eggs 和 tomatoes 是复数名词；rice 是不可数名词，没有复数形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson02.translate.013
  lesson_content_key: en.a1.unit08.lesson02.asking_prices
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pounds 是 pound 的复数；bottle 是瓶，bag 是袋。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson03.translate.014
  lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per 的意思是“每”；of 把数量单位和商品连接起来。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson01.translate.015
  lesson_content_key: en.a1.unit08.lesson01.quantities
  type: translation
  frame:
    text: 一瓶水。
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} of water.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 在 bottle 这样的数量单位之后要用 of；water 保持单数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson02.translate.016
  lesson_content_key: en.a1.unit08.lesson02.asking_prices
  type: translation
  frame:
    text: 它新鲜吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Is it {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 Is it ...? 询问某个单一事物的特点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson02.translate.017
  lesson_content_key: en.a1.unit08.lesson02.asking_prices
  type: translation
  frame:
    text: 请问可以给我两磅吗？（用 Can I have）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Can I have two {item}, please?
      language_code: en
      direction: ltr
  feedback_frame:
    text: two 之后用复数 pounds；Can I have ...? 是礼貌的请求。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson01.translate.018
  lesson_content_key: en.a1.unit08.lesson01.quantities
  type: translation
  frame:
    text: 一打鸡蛋。
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: A dozen {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Dozen 在 a 之后保持单数；eggs 直接以复数形式跟在后面，中间没有 of。
    language_code: zh
    direction: ltr
