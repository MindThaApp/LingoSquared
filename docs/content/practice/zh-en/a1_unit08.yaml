      direction: ltr
  feedback_frame:
    text: 数量单位之后接 of：a pound of apples，a bag of apples。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson02.order.006
  lesson_content_key: en.a1.unit08.lesson02.asking_prices
