    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tomatoes 是 tomato 的复数；a kilo of 之后的名词用复数，或者用不可数名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson02.fill.009
  lesson_content_key: en.a1.unit08.lesson02.asking_prices
