  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fresh 的意思是“新鲜的”；买水果、蔬菜或鸡蛋时可以问 Is it fresh?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson03.choose.004
