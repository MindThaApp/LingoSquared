    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fresh 是形容词，放在 is 之后，形式不变：Is it fresh?——它新鲜吗？
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson03.fill.010
  lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
  type: fill_in_blank
  frame:
    text: A bag {item} rice, please. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 a bag 这样的数量单位之后要用 of：a bag of rice。
    language_code: zh
    direction: ltr
