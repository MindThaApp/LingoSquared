  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eggs 和 tomatoes 用复数；rice 则保持单数，因为它是不可数名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit08.lesson02.choose.003
