schema_version: '1.0'
pack_key: practice.zh-en.a1.unit62
source_language: zh
target_language: en
unit_content_key: en.a1.unit62.phone_calls
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_asked
    - w_back
    - w_call
    - w_called
    - w_leave
    - w_message
    - w_phone
    - w_repeat
    - w_said
    - w_slowly
    - w_voicemail
    - w_wrote
templates:
- content_key: practice.zh-en.en.a1.unit62.lesson01.choose.001
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_voicemail
        - w_message
        - w_phone
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: phone、call、message 和 voicemail 是电话相关的核心词；call 既是名词也是动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson04.choose.002
  lesson_content_key: en.a1.unit62.lesson04.phone_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic:
        - w_called
        - w_asked
        - w_said
        - w_wrote
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: called、asked、said 和 wrote 是过去式；said 和 wrote 是不规则变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson02.order.003
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please {item} that.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeat
  answer_derivation:
    kind: render_frame
    frame:
      text: Please {item} that.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Please repeat that 是礼貌地请对方重复；please 后面的动词不加词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson02.order.004
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please speak {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_slowly
  answer_derivation:
    kind: render_frame
    frame:
      text: Please speak {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: slowly 放在动词 speak 的后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson01.fill.005
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: fill_in_blank
  frame:
    text: Please leave a {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_message
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Leave a message 是“留言”的固定说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson02.fill.006
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: fill_in_blank
  frame:
    text: I will call {item} later. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_back
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Call back 的意思是“回电话”；back 放在动词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson02.translate.007
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: translation
  frame:
    text: 请说慢一点。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_slowly
  answer_derivation:
    kind: render_frame
    frame:
      text: Please speak {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 这句请求里不用“您”，英语只要说 please speak slowly 就够了。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson04.translate.008
  lesson_content_key: en.a1.unit62.lesson04.phone_message
  type: translation
  frame:
    text: Mia在3:00打来了电话。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_called
  answer_derivation:
    kind: render_frame
    frame:
      text: Mia {item} at 3:00.
      language_code: en
      direction: ltr
  feedback_frame:
    text: called 是 call 的过去式；at 放在钟点前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit62.lesson01.match.009
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_leave
        - w_voicemail
        - w_message
        - w_repeat
        - w_slowly
        - w_back
        - w_asked
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 这些词与打电话有关：打电话、留下、留言、重复、慢、回。
    language_code: zh
    direction: ltr
