templates:
- content_key: practice.zh-en.en.a1.unit05.lesson01.choose.001
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 整点用 It's three o'clock 来说；半点用 half past，字面意思是“过了……之后的半小时”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson01.listen.002
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Half past three 的意思是 3:30，也就是中文的“三点半”；英语是从刚过去的整点开始数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson03.choose.003
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在具体时刻前用 at，在时段前用 in：at nine，in the morning。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson03.listen.004
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 说夜间时用 at night，而不是 in the night；而 morning、afternoon 和 evening 则用 in the。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson04.choose.005
  lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 询问营业时间的问句要用 does：What time does the library open?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson01.order.006
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: word_order
  frame:
    text: It's {item} past three.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} past three.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Half past three 是 3:30，也就是“三点半”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson02.order.007
  lesson_content_key: en.a1.unit05.lesson02.quarter_times
  type: word_order
  frame:
    text: It's a {item} past three.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's a {item} past three.
      language_code: en
      direction: ltr
  feedback_frame:
    text: A quarter past three 是 3:15，也就是“三点一刻”；quarter 前要加冠词 a。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson01.fill.008
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: fill_in_blank
  frame:
    text: It's three {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: O'clock 只用于整点：It's three o'clock，3:30 不能这样说。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson03.fill.009
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: fill_in_blank
  frame:
    text: The store opens {item} nine in the morning. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在确切的时刻前，英语用 at：at nine，at six。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson03.fill.010
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: fill_in_blank
  frame:
    text: The store opens at nine {item} the morning. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在时段前用 in the：in the morning，in the afternoon，in the evening。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson04.order.011
  lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
  type: word_order
  frame:
    text: What time {item} the library open?
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: What time {item} the library open?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 在问句中由 does 承担动词形式的变化；主要动词 open 因此不加 -s。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson03.match.012
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id010
    second: *id010
    third: *id010
    fourth: *id010
    fifth: *id010
    sixth: *id010
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Time 和 quarter 与时间有关；store 是商店，night 是夜间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson04.fill.013
  lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
  type: fill_in_blank
  frame:
    text: And what time does it {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: does 之后动词不加 -s：does it close?，但肯定句是 it closes。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson01.translate.014
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: O'clock 只用于整点，past 用于整点之后的分钟。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson01.translate.015
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: translation
  frame:
    text: 现在几点？
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: What {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 what time 询问时刻；time 也可以泛指“时间”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson02.translate.016
  lesson_content_key: en.a1.unit05.lesson02.quarter_times
  type: translation
  frame:
    text: 现在三点一刻。（用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's a {item} past three.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Past 的意思是“过了”：a quarter past three 是 3:15。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson03.translate.017
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Store 是美式英语中表示“商店”的常用词；closes 是用于 he、she 或 it 的动词形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit05.lesson04.translate.018
  lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
  type: translation
  frame:
    text: 图书馆几点开门？
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: What time {item} the library open?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 在问句中由 does 承担动词词尾的变化：does the library open，但肯定句是 it opens。
    language_code: zh
    direction: ltr
