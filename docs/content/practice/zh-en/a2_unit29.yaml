    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_been
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} leaking since this morning.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 表示持续到现在的状态，英语用 has/have been 加 -ing 形式：It's been leaking。Since 说明开始的时间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit29.lesson03.choose.011
  lesson_content_key: en.a2.unit29.lesson03.reading_a_repair_notice
