- content_key: practice.zh-en.en.a2.unit29.lesson01.translate.005
  lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
  type: translation
  frame:
    text: 我得为漏水的事给物业管理员打电话。（用 need to）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_manager
  answer_derivation:
    kind: render_frame
    frame:
      text: I need to call the building {item} about the leak.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Building manager 指物业管理员。need to 后面直接接动词原形：I need to call。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit29.lesson02.choose.006
  lesson_content_key: en.a2.unit29.lesson02.calling_to_report_a_problem
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
