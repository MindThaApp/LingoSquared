    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit29.lesson03.translate.016
  lesson_content_key: en.a2.unit29.lesson03.reading_a_repair_notice
  type: translation
  frame:
    text: 明天下午两点到四点之间会有一名水管工上门。（用 will；时间写成 2pm 和 4pm）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_tomorrow
  answer_derivation:
