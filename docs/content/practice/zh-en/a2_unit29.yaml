        - w_morning
        - w_someone
        - w_fix
        - w_can
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 用 I'd like to report a problem 礼貌地报告问题。Someone 的意思是“某人”，fix 的意思是“修理”。
    language_code: zh
    direction: ltr
