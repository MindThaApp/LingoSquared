    frame:
      text: A plumber will come {item} between 2pm and 4pm.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Tomorrow 在这里放在时间段之前。对已经安排好的事用 will：A plumber will come。
    language_code: zh
    direction: ltr
