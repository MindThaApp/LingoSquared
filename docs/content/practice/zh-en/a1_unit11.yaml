templates:
- content_key: practice.zh-en.en.a1.unit11.lesson01.choose.001
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英语描述天气要用 it 作主语：It's sunny, It's cold。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.choose.002
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Raining 是进行时形式，表示此刻正在发生的事：It's raining。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson03.choose.003
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 用 will 构成将来时，will 后面接动词原形：It will rain。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson04.choose.004
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: But 连接两个相反的意思；so 引出结果：It's going to rain, so let's go today。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson01.order.005
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: word_order
  frame:
    text: It's {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 描述天气用 It's 加形容词；today 放在句末。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.order.006
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: word_order
  frame:
    text: You should take an {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: You should take an {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Should 表示建议；take 是动词原形。元音前用 an 而不是 a。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson03.order.007
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: word_order
  frame:
    text: It will {item} on Saturday.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} on Saturday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: will 后面接不带 -s 的动词原形：It will rain。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.fill.008
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: It's {item} and warm. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sunny 的意思是“晴朗的”，来自 sun（太阳）；sunny and warm 是常见搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.fill.009
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: What's the {item} like today? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: What's the weather like? 用来询问天气；what's 是 what is 的缩写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson03.fill.010
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: fill_in_blank
  frame:
    text: It {item} rain on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Will 构成将来时；要说 It will rain，而不是 It will rains。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson04.fill.011
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: fill_in_blank
  frame:
    text: It's going to rain on Saturday, {item} let's go today. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: So 引出结果：星期六会下雨，所以我们今天去。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson01.match.012
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 形容词 sunny、rainy、cloudy、windy、cold、hot 和 warm 都可以描述天气；umbrella 是“伞”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson01.translate.013
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 天气形容词放在 It's 之后：It's hot, It's cold。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.translate.014
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Weather 是“天气”，umbrella 是“伞”；用 should 提出建议：You should take an umbrella。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson04.translate.015
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: But 的意思是“但是”，so 的意思是“所以”，idea 的意思是“主意”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.translate.016
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: 正在下雨。（用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: It's raining 描述现在正在发生的事；要做预报则用 will。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson02.translate.017
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: 今天天气怎么样？（用缩写形式并使用 like）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: What's the {item} like today?
      language_code: en
      direction: ltr
  feedback_frame:
    text: What's the weather like? 用来询问天气；like 在这里的意思是“像……一样”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit11.lesson03.translate.018
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: translation
  frame:
    text: 明天会下雨。（用 will）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} tomorrow.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 will + 动词原形构成将来时：It will rain tomorrow。
    language_code: zh
    direction: ltr
