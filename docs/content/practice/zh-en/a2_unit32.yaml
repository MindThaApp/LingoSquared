    frame:
      text: I know it's {item} much screen time.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Too much 的意思是“太多”。带两个 o 的 too 表示“太、过于”，只有一个 o 的 to 是介词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit32.lesson03.translate.017
  lesson_content_key: en.a2.unit32.lesson03.reading_about_online_habits
  type: translation
  frame:
    text: 我一天要看好几次通知。（使用 “many”）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_times
  answer_derivation:
    kind: render_frame
    frame:
      text: I check my notifications many {item} a day.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Time 是“时间”，复数 times 表示“次”：many times a day 的意思是“一天好多次”。
    language_code: zh
    direction: ltr
