- content_key: practice.zh-en.en.a2.unit32.lesson01.translate.005
  lesson_content_key: en.a2.unit32.lesson01.online_habits_vocabulary
  type: translation
  frame:
    text: 你能帮我下载那个烹饪应用吗？（使用 “that”）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_download
  answer_derivation:
    kind: render_frame
    frame:
      text: Can you {item} that cooking app for me?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 这里的 Download 是动词。can you 后面接不带 to 的动词原形。
    language_code: zh
    direction: ltr
