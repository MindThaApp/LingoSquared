  lesson_content_key: en.a2.unit32.lesson03.reading_about_online_habits
  type: translation
  frame:
    text: 我知道这样屏幕时间太长了。（使用缩写 “it's”）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_too
  answer_derivation:
