- content_key: practice.zh-en.en.a2.unit32.lesson02.translate.010
  lesson_content_key: en.a2.unit32.lesson02.describing_your_own_habits
  type: translation
  frame:
    text: 我几乎每天都用一个烹饪应用。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_every
  answer_derivation:
    kind: render_frame
    frame:
      text: I use a cooking app almost {item} day.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Every 放在名词前面：every day。它的意思是“每天”，前面不加冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a2.unit32.lesson02.translate.011
  lesson_content_key: en.a2.unit32.lesson02.describing_your_own_habits
  type: translation
  frame:
    text: 它会浪费很多时间。（使用 “a lot of”）
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_lot
  answer_derivation:
    kind: render_frame
    frame:
      text: It can waste a {item} of time.
      language_code: en
      direction: ltr
  feedback_frame:
    text: A lot of 的意思是“很多”。它放在名词前面，在这个短语中形式不变。
    language_code: zh
    direction: ltr
