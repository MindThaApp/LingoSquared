  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_carry
    - w_course
    - w_door
    - w_heavy
    - w_help
    - w_helpful
    - w_neighbor
    - w_note
    - w_open
    - w_put
    - w_shelf
    - w_thanked
templates:
- content_key: practice.zh-en.en.a1.unit63.lesson01.choose.001
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_carry
        - w_heavy
        - w_shelf
        - w_put
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: carry、heavy、shelf 和 put 说明了如何帮忙搬一个重包。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson04.choose.002
  lesson_content_key: en.a1.unit63.lesson04.a_helpful_neighbor
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_neighbor
        - w_note
        - w_helpful
        - w_thanked
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: neighbor、note、helpful 和 thanked 来自“乐于助人的邻居”这个故事。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson01.order.003
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: word_order
  frame:
    text: This bag is {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_heavy
  answer_derivation:
    kind: render_frame
    frame:
      text: This bag is {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: is 后面的形容词前面不加冠词：This bag is heavy。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson02.order.004
  lesson_content_key: en.a1.unit63.lesson02.help_phrases
  type: word_order
  frame:
    text: Could you {item} the door?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_open
  answer_derivation:
    kind: render_frame
    frame:
      text: Could you {item} the door?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Could you 后面接动词原形，不加 to：Could you open ...?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson01.fill.005
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: fill_in_blank
  frame:
    text: Put it on the {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_shelf
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Put it on the shelf：这里的 put 既表示“放”，也表示“摆”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson03.fill.006
  lesson_content_key: en.a1.unit63.lesson03.dialogue_helping_with_a_bag
  type: fill_in_blank
  frame:
    text: Of {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_course
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Of course 的意思是“当然”，是固定说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson01.translate.007
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: translation
  frame:
    text: 这个包很重。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_heavy
  answer_derivation:
    kind: render_frame
    frame:
      text: This bag is {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英语里 heavy 前面不加冠词；this bag 是主语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson02.translate.008
  lesson_content_key: en.a1.unit63.lesson02.help_phrases
  type: translation
  frame:
    text: 你能把门打开吗？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_open
  answer_derivation:
    kind: render_frame
    frame:
      text: Could you {item} the door?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Could you ...? 相当于汉语委婉的“能不能麻烦你……”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit63.lesson01.match.009
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adjective
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_carry
        - w_heavy
        - w_shelf
        - w_put
        - w_help
        - w_door
        - w_note
        - w_neighbor
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 这些词与日常生活中的帮助有关：提、重、架子、放、帮助、门、便条、邻居。
    language_code: zh
    direction: ltr
