templates:
- content_key: practice.zh-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parents 和 siblings 在英语中用复数；单数的 sibling 日常里不常用，通常直接说 brother 或 sister。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: mother、father 和 brother 这几个词都含有 th 的音，发音时舌尖要放在上下齿之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother 和 grandfather 由 grand- 加 mother 或 father 构成，grand- 表示高一辈。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child 是单数，复数是 children；brothers 是 brother 的复数。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson04.choose.005
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Who 用来问人：Who is this? 问事物则用 what。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: His 指男性所有者，her 指女性所有者：his sister 是某位男性的姐妹，her sister 是某位女性的姐妹。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: word_order
  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 数字 two 之后用复数：two brothers，而不是 two brother。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson04.order.008
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: word_order
  frame:
    text: Is this your {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Is this your {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Your 放在名词之前；在一般疑问句 Is this your family? 中，is 放在 this 之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson02.fill.009
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: fill_in_blank
  frame:
    text: Daniel has one sister. This is {item} sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: His 指男性，这里指 Daniel；如果指女性，就要用 her。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson03.fill.010
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: fill_in_blank
  frame:
    text: Do you have {item} siblings? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: any 用于疑问句和否定句，some 用于肯定句：Do you have any siblings?
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson04.fill.011
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: fill_in_blank
  frame:
    text: I {item} have one sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Just 放在实义动词之前：I just have one sister 表示只有这一个姐妹。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson02.match.012
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 像 mother 和 grandmother 这样的亲属称呼表示亲缘关系；grand- 表示高一辈。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson01.translate.013
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这里的 parents（父母）和 siblings（兄弟姐妹）都是复数；单数是 parent 和 sibling。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson02.translate.014
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aunt 和 uncle 指父母的兄弟姐妹；cousin 既可指男孩也可指女孩。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson04.translate.015
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Who 用来问人；photo 是 photograph 的缩写，日常中几乎总是用 photo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson02.translate.016
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: 这是我姐姐或妹妹。（用 This）
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: This is my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 用 This is 来介绍你指给别人看的人；my 放在名词之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson03.translate.017
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: 我有两个兄弟。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 数字 two 之后，名词用复数：two brothers。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit06.lesson03.translate.018
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: 你有兄弟姐妹吗？（用 any）
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have any {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 疑问句中用 any：Do you have any siblings? 回答是 I have two brothers 或 No, I don't。
    language_code: zh
    direction: ltr
