templates:
- content_key: practice.zh-en.en.a1.unit07.lesson01.choose.001
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Water 和 bread 是不可数名词：英语说 some water；而按份点的 coffee 或 sandwich 则说 a coffee、a sandwich。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson01.listen.002
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 点餐时，coffee 和 tea 在英语中常和 a 连用：I'd like a coffee, please.
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson02.choose.003
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anything else? 是点完餐后咖啡馆里常见的问题；你可以回答 No, that's all。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson02.listen.004
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Please 使请求更有礼貌，常放在句末：I'd like a coffee, please.
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson04.choose.005
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sure 在这里的意思是“好的”；服务员用 Sure. Anything else? 友好地确认点餐，并询问是否还要点别的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson03.choose.006
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Menu 在英语里指菜单，而不是一道套餐；菜单上的价格叫 price。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson02.order.007
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: word_order
  frame:
    text: Anything {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Anything {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Else 的意思是“另外”；Anything else? 询问你是否还有别的需要。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson04.order.008
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: word_order
  frame:
    text: For {item} or to go?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: For {item} or to go?
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here or to go? 询问你是在咖啡馆里吃还是把食物带走；here 的意思是“这里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson01.fill.009
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: fill_in_blank
  frame:
    text: I'd like a {item}, please. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sandwich 是夹馅的面包；前面加 a，表示点一个三明治。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson03.fill.010
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: fill_in_blank
  frame:
    text: The {item} says the coffee is three dollars. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Menu 在英语里指菜单；动词 says 指菜单上写的内容。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson02.fill.011
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: fill_in_blank
  frame:
    text: No, that's {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: That's all 表示你不想再点别的了；That's 是 That is 的缩写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson04.fill.012
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: fill_in_blank
  frame:
    text: For here, {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 句末的 Please 使回答更有礼貌：For here, please.
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson01.match.013
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Coffee、tea、soup 和 salad 是咖啡馆里的食物或饮品；bread 和 sandwich 属于食物，water 属于饮品。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson01.translate.014
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 点餐时，一份要说 a coffee 或 a sandwich。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson02.translate.015
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Anything else? 询问是否还有别的需要；that's all 表示点餐结束。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson03.translate.016
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Menu 指菜单，而不是一道套餐；price 是价格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson02.translate.017
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: translation
  frame:
    text: 请给我一杯咖啡。（用缩写形式）
    language_code: zh
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'd like 比 I want 更礼貌；句末的 please 让请求更完整。
    language_code: zh
    direction: ltr
- content_key: practice.zh-en.en.a1.unit07.lesson04.translate.018
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: translation
  frame:
    text: 在这里吃。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: For {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here 表示你在咖啡馆里吃；与之相对的是 to go，即带走。
    language_code: zh
    direction: ltr
