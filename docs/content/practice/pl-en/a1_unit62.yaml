- content_key: practice.pl-en.en.a1.unit62.lesson02.order.003
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please {item} that.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeat
  answer_derivation:
    kind: render_frame
    frame:
      text: Please {item} that.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Please repeat that to grzeczna prośba o powtórzenie; po please czasownik stoi bez końcówki.
    language_code: pl
    direction: ltr
