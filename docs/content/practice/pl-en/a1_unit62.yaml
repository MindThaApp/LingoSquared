    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_leave
        - w_voicemail
        - w_message
        - w_repeat
        - w_slowly
        - w_back
        - w_asked
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
