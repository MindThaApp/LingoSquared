    frame:
      text: It's {item} dollars.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Przy cenach liczba stoi przed rzeczownikiem dollars, a rzeczownik jest w liczbie mnogiej: five dollars.'
    language_code: pl
    direction: ltr
