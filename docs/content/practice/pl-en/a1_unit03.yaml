templates:
- content_key: practice.pl-en.en.a1.unit03.lesson01.choose.001
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Liczbami od zera do dziesięciu podajesz wiek, ceny i numery telefonów; numery telefonów podajesz cyfra po cyfrze.
    language_code: pl
    direction: ltr
- content_key: practice.pl-en.en.a1.unit03.lesson01.listen.002
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Podczas słuchania zwracaj uwagę na liczbę sylab: seven i zero mają dwie sylaby, pozostałe liczby do dziesięciu tylko jedną.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-en.en.a1.unit03.lesson02.choose.003
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'W liczbach od trzynastu do dziewiętnastu angielskie słowo kończy się na -teen, a w dziesiątkach na -ty: thirteen i thirty.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-en.en.a1.unit03.lesson02.listen.004
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fifteen i fifty brzmią podobnie, ale różnią się akcentem: w fifteen akcentowana jest druga sylaba, w fifty pierwsza.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-en.en.a1.unit03.lesson03.choose.005
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pytaniem How old are you? pytasz o wiek, a pytaniem How much is this? o cenę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-en.en.a1.unit03.lesson04.choose.006
  lesson_content_key: en.a1.unit03.lesson04.market_dialogue
