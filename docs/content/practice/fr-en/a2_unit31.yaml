- content_key: practice.fr-en.en.a2.unit31.lesson01.translate.005
  lesson_content_key: en.a2.unit31.lesson01.disruption_vocabulary
  type: translation
  frame:
    text: J’ai lu en gare un avis concernant le retard.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_notice
  answer_derivation:
    kind: render_frame
    frame:
      text: I read a {item} about the delay at the station.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Notice désigne ici l’affiche ou l’avis. Read s’écrit de la même façon au passé et à l’infinitif, mais se prononce « red » au passé.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit31.lesson02.choose.006
  lesson_content_key: en.a2.unit31.lesson02.asking_about_alternatives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - adjective
      agreement_tags:
