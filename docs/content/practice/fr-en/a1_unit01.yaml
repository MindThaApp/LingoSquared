templates:
- content_key: practice.fr-en.en.a1.unit01.lesson01.choose.001
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En anglais, il n’existe pas de formule comme « bonjour » qui convienne à toute la journée : tu choisis good morning, good afternoon ou good evening selon le moment de la journée.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson01.listen.002
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hello est la salutation neutre ; good morning, good afternoon et good evening dépendent du moment de la journée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.choose.003
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How are you? est la question habituelle pour prendre des nouvelles ; elle sonne pareil avec des amis et avec des inconnus, car il n’y a pas de choix à faire entre tu et vous.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.listen.004
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I’m fine, thanks. est souvent suivi de And you? pour renvoyer la question ; not bad est une réponse décontractée et réservée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson05.choose.005
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu dis Nice to meet you à la première rencontre, et la réponse est Nice to meet you too.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson05.listen.006
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu dis See you later quand tu vas revoir la personne le jour même.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson01.order.007
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: word_order
  frame:
    text: Good {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Good {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'La salutation dépend du moment de la journée : morning jusqu’à midi environ, afternoon ensuite, evening le soir.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson01.match.008
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Thanks est la forme courte et décontractée de « merci » ; fine et bad décrivent comment on va.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.fill.009
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: How are {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En anglais, you correspond à la fois à tu et à vous, donc la question How are you? reste la même dans toutes les situations.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.fill.010
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: Not {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Not bad signifie littéralement « pas mal » et c’est une réponse modeste très courante quand on prend des nouvelles.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.order.011
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: word_order
  frame:
    text: I'm {item}, thanks.
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I’m est la forme contractée de I am ; tu réponds à How are you? avec fine ou good.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson05.order.012
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: word_order
  frame:
    text: See you {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you later signifie littéralement « on se voit plus tard » et veut dire à tout à l’heure.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson05.fill.013
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: fill_in_blank
  frame:
    text: Nice to meet you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Too se place en fin de phrase et signifie « aussi » ; c’est ainsi que tu réponds à Nice to meet you.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson01.translate.014
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Les salutations et les au revoir dépendent en anglais du moment de la journée ; Goodbye est la formule d’adieu neutre.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.translate.015
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le mot not met en négation ce qui suit : not bad veut dire « pas mal », et thanks est la forme décontractée de « merci ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson03.translate.016
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: Comment vas-tu ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: How are {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: En anglais, il n’y a qu’un seul you pour tu et vous, donc la phrase peut s’employer dans les deux registres.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson05.translate.017
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: À tout à l’heure.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Avec See you, le mot pour « plus tard » devient la formule d’au revoir « à tout à l’heure ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit01.lesson05.translate.018
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le verbe meet signifie rencontrer ; have a good day est un aimable souhait d’au revoir.
    language_code: fr
    direction: ltr
