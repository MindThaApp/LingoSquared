    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sorry, can you repeat that? est la demande polie de répéter quelque chose ; sorry l’introduit.
    language_code: fr
    direction: ltr
