templates:
- content_key: practice.fr-en.en.a1.unit14.lesson01.choose.001
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Free signifie ici disponible, c’est-à-dire avoir du temps : Are you free tonight? demande si tu as du temps.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit14.lesson02.choose.002
