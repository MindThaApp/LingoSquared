templates:
- content_key: practice.fr-en.en.a1.unit11.lesson01.choose.001
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pour décrire le temps, on utilise it en anglais : It’s sunny, It’s cold.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.choose.002
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Raining est la forme progressive (-ing) et décrit ce qui se passe en ce moment : It’s raining.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson03.choose.003
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Avec will, on forme le futur ; will est suivi de la base verbale : It will rain.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson04.choose.004
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'But relie deux idées opposées ; so introduit la conséquence : It’s going to rain, so let’s go today.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson01.order.005
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: word_order
  frame:
    text: It's {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Pour décrire le temps, on utilise It’s et un adjectif ; today se met en fin de phrase.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.order.006
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: word_order
  frame:
    text: You should take an {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: You should take an {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Should donne un conseil ; take est la base verbale. Devant une voyelle, on met an au lieu de a.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson03.order.007
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: word_order
  frame:
    text: It will {item} on Saturday.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} on Saturday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Après will vient la base verbale sans -s : It will rain.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.fill.008
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: It's {item} and warm. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sunny signifie ensoleillé et vient de sun, le soleil ; sunny and warm est une combinaison fréquente.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.fill.009
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: What's the {item} like today? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: What’s the weather like? demande le temps qu’il fait ; what’s est la forme contractée de what is.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson03.fill.010
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: fill_in_blank
  frame:
    text: It {item} rain on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Will forme le futur ; on dit It will rain, et non It will rains.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson04.fill.011
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: fill_in_blank
  frame:
    text: It's going to rain on Saturday, {item} let's go today. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'So introduit la conséquence : il pleut samedi, donc on y va aujourd’hui.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson01.match.012
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Les adjectifs sunny, rainy, cloudy, windy, cold, hot et warm décrivent le temps ; umbrella est le parapluie.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson01.translate.013
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les adjectifs de météo se placent après It’s : It’s hot, It’s cold.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.translate.014
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Weather est la météo, le temps, et umbrella le parapluie ; avec should, on donne un conseil : You should take an umbrella.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson04.translate.015
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: But veut dire mais, so veut dire donc, et idea veut dire idée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.translate.016
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: Il pleut en ce moment. (avec la forme contractée)
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: It’s raining décrit ce qui se passe maintenant ; pour une prévision, utilise will.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson02.translate.017
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: Quel temps fait-il aujourd’hui ? (avec la forme contractée et like)
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: What's the {item} like today?
      language_code: en
      direction: ltr
  feedback_frame:
    text: What’s the weather like? demande le temps qu’il fait ; like signifie ici comment.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit11.lesson03.translate.018
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: translation
  frame:
    text: Demain, il pleuvra. (avec will)
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} tomorrow.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Avec will + base verbale, on forme le futur : It will rain tomorrow.'
    language_code: fr
    direction: ltr
