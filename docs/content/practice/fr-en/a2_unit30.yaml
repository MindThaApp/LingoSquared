- content_key: practice.fr-en.en.a2.unit30.lesson02.translate.010
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: J’ai deux ans d’expérience dans le marketing des réseaux sociaux. (Écris le nombre en toutes lettres.)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_two
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} years of experience in social media marketing.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Après two, years se met au pluriel. Avec of experience in, vous indiquez le domaine.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit30.lesson02.translate.011
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: L’un de mes points forts, c’est d’être bien organisé(e).
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_being
  answer_derivation:
    kind: render_frame
    frame:
      text: One of my strengths is {item} organized.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Après is, on emploie ici being, car « être » désigne une manière d’agir : One of my strengths is being organized.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit30.lesson03.choose.012
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
