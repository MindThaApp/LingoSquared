- content_key: practice.fr-en.en.a2.unit30.lesson03.translate.016
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Bright Path Marketing recherche un coordinateur marketing. (Forme progressive.)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_looking
  answer_derivation:
    kind: render_frame
    frame:
      text: Bright Path Marketing is {item} for a marketing coordinator.
      language_code: en
      direction: ltr
  feedback_frame:
    text: La forme progressive is looking for correspond au présent français « recherche ». Le for fait partie de look for.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit30.lesson03.translate.017
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Je respecte les délais et je travaille bien en équipe. (N’utilise pas de forme contractée.)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_well
  answer_derivation:
    kind: render_frame
    frame:
      text: I meet deadlines, and I work {item} in a team.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Well est l’adverbe de good : I work well. Après work, on n’emploie pas d’adjectif.'
    language_code: fr
    direction: ltr
