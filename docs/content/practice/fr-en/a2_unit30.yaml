- content_key: practice.fr-en.en.a2.unit30.lesson01.translate.005
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: translation
  frame:
    text: L’intervieweur m’a interrogé sur ma disponibilité.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_availability
  answer_derivation:
    kind: render_frame
    frame:
      text: The interviewer asked about my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Availability signifie « disponibilité » : la période pendant laquelle vous pouvez commencer ou travailler. Asked about correspond à « a interrogé sur ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit30.lesson02.choose.006
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
