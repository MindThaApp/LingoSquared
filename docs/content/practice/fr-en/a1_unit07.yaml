templates:
- content_key: practice.fr-en.en.a1.unit07.lesson01.choose.001
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Water et bread désignent une matière, sans quantité précise : en anglais, tu dis some water, mais a coffee ou a sandwich pour une portion.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson01.listen.002
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
