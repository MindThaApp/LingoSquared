  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: translation
  frame:
    text: Je voudrais un café, s’il vous plaît. (avec la forme contractée)
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
