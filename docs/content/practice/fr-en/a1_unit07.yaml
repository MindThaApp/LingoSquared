  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Coffee et tea s’emploient souvent avec a quand on commande : I’d like a coffee, please.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson02.choose.003
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anything else? est la question habituelle au café une fois que tu as commandé ; tu peux répondre par exemple No, that’s all.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson02.listen.004
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Please rend une demande polie et se place souvent en fin de phrase : I’d like a coffee, please.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson04.choose.005
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sure veut dire ici « bien sûr » ou « avec plaisir » ; avec Sure. Anything else?, le serveur confirme aimablement la commande et demande si tu veux autre chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson03.choose.006
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Menu désigne en anglais la carte, et non le « menu » comme formule à prix fixe ; le prix indiqué sur la carte se dit price.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson02.order.007
