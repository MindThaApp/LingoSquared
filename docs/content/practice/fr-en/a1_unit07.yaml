    kind: render_frame
    frame:
      text: For {item} or to go?
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here or to go? demande si tu manges au café ou si tu emportes ta commande ; here veut dire ici.
    language_code: fr
    direction: ltr
