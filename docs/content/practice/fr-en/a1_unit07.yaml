    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Anything {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Else veut dire d’autre ; Anything else? demande si tu as encore un souhait.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit07.lesson04.order.008
