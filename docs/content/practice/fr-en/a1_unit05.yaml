templates:
- content_key: practice.fr-en.en.a1.unit05.lesson01.choose.001
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pour l’heure pleine, on dit en anglais It’s three o’clock ; pour la demie, on emploie half past, littéralement « la moitié passée ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit05.lesson01.listen.002
