  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Half past three signifie 3 h 30, comme « trois heures et demie » en français ; l’anglais compte à partir de la dernière heure pleine.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit05.lesson03.choose.003
