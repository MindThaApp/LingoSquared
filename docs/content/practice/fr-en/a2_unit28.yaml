- content_key: practice.fr-en.en.a2.unit28.lesson02.translate.012
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: Je voudrais prendre rendez-vous pour voir un médecin, s'il vous plaît. (utilise la forme contractée I'd)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_doctor
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Prendre rendez-vous se dit make an appointment ; I'd like to est la formule polie pour exprimer un souhait.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: J'ai mal à la tête et à la gorge depuis trois jours, et ça empire. (utilise les formes contractées)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'For indique la durée (« depuis trois jours ») ; il se construit avec le present perfect : I''ve had.'
    language_code: fr
    direction: ltr
