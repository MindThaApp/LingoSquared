templates:
- content_key: practice.fr-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Your et my sont des possessifs : my name veut dire mon nom, your name veut dire ton ou votre nom, car l’anglais ne distingue pas entre tu et vous.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'What’s est la forme contractée de what is et introduit la question sur le nom : What’s your name?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En anglais, un nom de métier est généralement précédé d’un article : a student, a teacher, mais an engineer, parce que le mot suivant commence par une voyelle.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'He désigne un homme et she une femme ; tu les emploies tous deux avec is : he is, she is.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson03.choose.005
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À la bibliothèque, tu entends Welcome to the library ; the est l’article défini et correspond à le, la, l’ et les.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson03.listen.006
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Thank you est la formule polie standard pour dire « merci ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson01.order.007
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My {item} is Leila.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} is Leila.
      language_code: en
      direction: ltr
  feedback_frame:
    text: En anglais, tu dis littéralement « Mon nom est … » ; le verbe is se place entre name et le nom propre.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.order.008
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: word_order
  frame:
    text: I am a {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: I am a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Devant un métier ou un rôle, l’anglais met l’article a : I am a student, alors qu’en français l’article disparaît.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson01.fill.009
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: fill_in_blank
  frame:
    text: What's {item} name? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Your correspond à you, donc à ton, ta, tes, votre et vos ; pour « mon », « ma » et « mes », tu emploies my.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.fill.010
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: She is {item} engineer. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Devant un son voyelle, tu emploies an au lieu de a : an engineer, mais a teacher.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.fill.011
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: '{item} is a teacher. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: He est la forme masculine ; pour une femme, tu emploies she, et pour plusieurs personnes, they.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.match.012
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Yes et no répondent à une question, comme oui et non en français ; student et teacher sont des rôles qui demandent un article.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson03.fill.013
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: fill_in_blank
  frame:
    text: Welcome to {item} library. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L’article défini the reste identique, que le nom soit masculin, féminin ou pluriel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson01.translate.014
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Comment tu t’appelles ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: What's {item} name?
      language_code: en
      direction: ltr
  feedback_frame:
    text: En anglais, tu demandes littéralement « Quel est ton nom ? » ; la question sonne pareil avec des amis et avec des inconnus.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson01.translate.015
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Je m’appelle Leila.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} name is Leila.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: My est le possessif pour « mon », « ma » et « mes » ; dans la phrase, il se place devant le nom name.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.translate.016
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Les rôles comme student ou teacher ont la même forme pour les femmes et pour les hommes en anglais ; il n’y a pas de terminaison féminine propre.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson02.translate.017
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: Elle est ingénieure. (en toutes lettres, sans forme contractée)
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item} engineer.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Beaucoup de noms de métiers anglais n’ont pas de forme féminine propre : ingénieur et ingénieure se disent tous deux engineer.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit02.lesson03.translate.018
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Welcome s’emploie comme salutation quand on entre ; thank fait partie de thank you.
    language_code: fr
    direction: ltr
