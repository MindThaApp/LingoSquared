      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: His se rapporte à un homme, ici Daniel ; pour une femme, tu dirais her.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson03.fill.010
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: fill_in_blank
  frame:
    text: Do you have {item} siblings? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dans les questions et les négations, on emploie any ; dans les affirmations, some : Do you have any siblings?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson04.fill.011
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: fill_in_blank
  frame:
