    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Les mots mother, father et brother contiennent le son th, que tu prononces avec le bout de la langue entre les dents.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother et grandfather se composent de grand- et de mother ou father, comme grand-mère et grand-père en français.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child est le singulier, le pluriel est children ; brothers est le pluriel de brother.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson04.choose.005
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Who s’emploie pour demander qui est une personne : Who is this? Pour les choses, on emploie what.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'His se rapporte à un homme et her à une femme : his sister est la sœur d’un homme, her sister celle d’une femme.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: word_order
  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Après le nombre two, l’anglais met le pluriel : two brothers, et non two brother.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson04.order.008
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: word_order
  frame:
