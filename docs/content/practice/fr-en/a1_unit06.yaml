  answer_derivation:
    kind: render_frame
    frame:
      text: Is this your {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Your se place devant le nom ; dans la question fermée Is this your family?, is se place avant this.
    language_code: fr
    direction: ltr
