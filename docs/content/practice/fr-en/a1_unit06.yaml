  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aunt et uncle désignent la sœur et le frère des parents ; cousin vaut pour les garçons comme pour les filles.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson04.translate.015
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: translation
  frame:
