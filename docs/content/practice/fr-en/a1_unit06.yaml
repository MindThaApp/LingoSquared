    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Who s’emploie pour demander qui est une personne ; photo est la forme abrégée de photograph et s’emploie presque toujours dans la vie courante.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson02.translate.016
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: C’est ma sœur. (avec This)
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: This is my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Avec This is, tu présentes quelqu’un que tu montres ou que tu présentes à une autre personne ; my se place devant le nom.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson03.translate.017
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: J’ai deux frères.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Après le nombre two, le nom est au pluriel : two brothers.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson03.translate.018
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: As-tu des frères et sœurs ? (avec any)
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have any {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Dans les questions, on emploie any : Do you have any siblings? La réponse est I have two brothers ou No, I don’t.'
    language_code: fr
    direction: ltr
