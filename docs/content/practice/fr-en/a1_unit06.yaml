templates:
- content_key: practice.fr-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En anglais, parents et siblings sont au pluriel ; au lieu du singulier sibling, on dit plutôt brother ou sister dans la vie courante.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
