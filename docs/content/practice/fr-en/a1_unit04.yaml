  answer_derivation:
    kind: render_frame
    frame:
      text: Which {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Which demande de choisir parmi un ensemble limité, ici les douze mois.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson03.order.008
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: word_order
  frame:
    text: My birthday is {item} 3rd.
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: My birthday is {item} 3rd.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Pour la date, l’anglais place d’abord le mois, puis le jour : March 3rd, alors qu’en français on dit « 3 mars ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson01.fill.009
  lesson_content_key: en.a1.unit04.lesson01.weekdays
