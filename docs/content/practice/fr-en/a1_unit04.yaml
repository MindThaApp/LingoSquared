    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Avec what day, tu demandes le jour de la semaine ; avec what’s today’s date, la date.
    language_code: fr
    direction: ltr
