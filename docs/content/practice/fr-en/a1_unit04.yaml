templates:
- content_key: practice.fr-en.en.a1.unit04.lesson01.choose.001
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En anglais, les jours de la semaine s’écrivent toujours avec une majuscule, contrairement au français : Monday, Tuesday, Wednesday.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson01.listen.002
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tous les jours de la semaine se terminent par -day : Monday, Tuesday, Wednesday, Thursday, Friday, Saturday et Sunday.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson02.choose.003
  lesson_content_key: en.a1.unit04.lesson02.months
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les noms de mois prennent eux aussi une majuscule en anglais : January, March, July.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Beaucoup de noms de mois anglais ressemblent aux noms français, mais l’accent tombe souvent ailleurs ; écoute bien la syllabe accentuée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pour la date, l’anglais utilise des nombres ordinaux : July 7th (en français, on dit « le 7 juillet »). Avec when’s, tu demandes quand quelque chose a lieu, par exemple When’s your birthday?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson04.choose.006
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Open peut signifier « ouvrir » ou « être ouvert », comme dans When’s the library open again?
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit04.lesson02.order.007
  lesson_content_key: en.a1.unit04.lesson02.months
  type: word_order
  frame:
    text: Which {item} is it?
    language_code: en
    direction: ltr
  slots:
