    slot: item
  feedback_frame:
    text: Playground est un mot composé de play et ground, comme « terrain de jeu ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson03.translate.017
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: En revanche, il est tout près de l'aire de jeux. (utilise la forme contractée it's)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_playground
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's very close to the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Close to the playground signifie « près de l'aire de jeux » ; en anglais, close est suivi de to, là où le français emploie « de ».
    language_code: fr
    direction: ltr
