    text: I think it's a {item} idea because dogs need space to run. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
    hint:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A good idea s'emploie avec l'article a devant le nom ; good devient better, et non gooder.
    language_code: fr
    direction: ltr
