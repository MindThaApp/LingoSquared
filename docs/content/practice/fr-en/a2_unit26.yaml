        - w_playground
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Very se place devant un adjectif ou un adverbe, ici devant close : very close signifie « très près ».'
    language_code: fr
    direction: ltr
