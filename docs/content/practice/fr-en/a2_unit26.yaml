    text: Le pluriel dogs se forme simplement avec -s ; space signifie ici « place », au sens d'espace.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson02.translate.012
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: Que penses-tu du nouveau parc canin ? (avec « think »)
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_park
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think about the new dog {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: « Que penses-tu de … ? » se dit What do you think about …? en anglais.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: Je trouve que c'est une bonne idée, parce que les chiens ont besoin d'espace pour courir.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
    frame:
      text: I think it's a good {item} because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Au lieu de « Je trouve », tu dis I think ; tu ajoutes la raison avec because.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson03.choose.014
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
