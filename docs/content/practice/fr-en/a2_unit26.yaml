      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_hand
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other {item}, it's very close to the playground.
      language_code: en
      direction: ltr
  feedback_frame:
    text: On the other hand correspond à « d'un autre côté » ; mot à mot, on lit « de l'autre main ».
    language_code: fr
    direction: ltr
