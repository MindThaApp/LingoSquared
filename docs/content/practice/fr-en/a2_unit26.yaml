        - w_think
        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pour donner ton opinion, tu dis I think ou in my opinion ; être d'accord se dit to agree.
    language_code: fr
    direction: ltr
