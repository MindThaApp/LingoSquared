        - w_park
        - w_space
        - w_run
        - w_idea
        - w_good
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Écoute les voyelles : dog a une voyelle courte, park une voyelle longue, et le r s''y entend nettement.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson02.order.009
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: word_order
  frame:
    text: What do you think {item} the new dog park?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_about
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think {item} the new dog park?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Après think, tu introduis le sujet avec about : What do you think about …? correspond à « Que penses-tu de … ? »'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson02.fill.010
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: fill_in_blank
