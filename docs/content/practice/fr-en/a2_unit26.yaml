        - w_think
        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En anglais, opinion n'a qu'un seul n au milieu et se termine par -ion ; agree s'écrit avec deux e.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: À mon avis, le nouveau parc canin est une bonne idée, parce que les chiens ont besoin d'espace pour courir.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion se place en début de phrase et se sépare du reste par une virgule.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson02.choose.007
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - preposition
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_idea
        - w_space
        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dans la conversation sur le parc canin, tu rencontres dog, park, space et le verbe run.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a2.unit26.lesson02.listen.008
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
