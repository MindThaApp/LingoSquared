  frame:
    text: The class is {item} over. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Almost signifie presque ; almost over veut dire que quelque chose va bientôt se terminer.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson03.fill.011
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
