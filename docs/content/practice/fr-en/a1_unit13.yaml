      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Because introduit la raison ; en anglais, l’ordre des mots reste celui d’une phrase principale.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson02.fill.010
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
