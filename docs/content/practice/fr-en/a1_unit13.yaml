    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Last signifie ici dernier ; the last one this year est le dernier examen de cette année.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson01.match.012
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Happy, sad, tired, excited et worried sont des sentiments ; test, class et year font partie des raisons dans les exemples.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson01.translate.013
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Après I’m, les sentiments sont des adjectifs, par exemple I’m tired.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson02.translate.014
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Test et class désignent l’examen et le cours ; almost signifie presque.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson03.translate.015
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Writer est la personne qui écrit ; dans l’exemple, c’est l’expéditeur ou l’expéditrice du message.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson01.translate.016
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: translation
  frame:
    text: Je suis fatigué. (avec la forme contractée)
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I’m est la forme contractée de I am ; tired décrit l’état.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson02.translate.017
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: translation
  frame:
    text: Je suis un peu inquiet. (avec la forme contractée)
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm a {item} worried.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'A little devant un adjectif atténue le sentiment : a little worried.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson04.translate.018
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: translation
  frame:
    text: Ah, je comprends.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Oh en début de phrase exprime la compréhension ou la surprise ; understand ne prend pas de -s après I.
    language_code: fr
    direction: ltr
