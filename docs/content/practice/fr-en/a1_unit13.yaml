    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Worried signifie inquiet ; la cause vient dans la phrase suivante ou après because.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson02.fill.009
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
