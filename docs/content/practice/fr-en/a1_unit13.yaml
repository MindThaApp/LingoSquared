    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Last signifie ici dernier ; dans it’s the last one this year, il s’agit du dernier examen de l’année.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson04.choose.004
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: multiple_choice
  frame:
