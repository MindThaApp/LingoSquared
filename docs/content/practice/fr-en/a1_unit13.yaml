  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I understand signifie je comprends ; understand n’a pas de forme progressive.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson01.fill.008
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
