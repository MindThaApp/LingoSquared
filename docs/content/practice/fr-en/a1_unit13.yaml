    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oh, I understand montre que tu as compris et que tu compatis.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson01.order.005
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: word_order
  frame:
    text: I'm {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Après I’m, l’adjectif se place sans article : I’m happy, I’m sad.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson03.order.006
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: word_order
  frame:
    text: The {item} is worried and excited.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is worried and excited.
      language_code: en
      direction: ltr
  feedback_frame:
    text: The writer est la personne qui a écrit le message ; le résumé est à la troisième personne, avec is.
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson04.order.007
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
