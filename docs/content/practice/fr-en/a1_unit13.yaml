templates:
- content_key: practice.fr-en.en.a1.unit13.lesson01.choose.001
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Après I’m, le sentiment s’exprime avec un adjectif : I’m happy, I’m tired ; tu n’as pas besoin d’un verbe à part comme « se réjouir ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson02.choose.002
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Because introduit une raison et suit l’ordre normal des mots en anglais : I’m happy because the class is almost over.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-en.en.a1.unit13.lesson03.choose.003
