schema_version: '1.0'
pack_key: practice.ro-ru.a1.unit53
source_language: ro
target_language: ru
unit_content_key: ru.a1.unit53.gym
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Romanian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_абонемент
    - w_беговая
    - w_гантели
    - w_гантелями
    - w_десяти
    - w_дорожка
    - w_дорожке
    - w_занятие
    - w_инструктор
    - w_конечно
    - w_пляж
    - w_поднимаю
    - w_разовый
    - w_расписание
    - w_спортзал
    - w_хожу
    - w_хотим
    - w_человека
templates:
- content_key: practice.ro-ru.ru.a1.unit53.lesson01.choose.001
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спортзал
        - w_хожу
        - w_абонемент
        - w_беговая
        - w_дорожка
        - w_дорожке
        - w_гантели
        - w_поднимаю
        - w_гантелями
        - w_занятие
        - w_инструктор
        - w_расписание
        - w_десяти
        - w_разовый
        - w_хотим
        - w_конечно
        - w_человека
        - w_пляж
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția „Mergem la sala de sport?”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit53.lesson02.listen.001
