  lesson_content_key: ru.a1.unit53.lesson04.raspisanie_na_stoyke_registratsii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Potrivește fiecare cuvânt rus cu sensul lui în română; cuvintele provin din lecțiile acestei unități.
    language_code: ro
    direction: ltr
