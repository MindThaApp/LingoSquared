    frame:
      text: Я хочу пойти на концерт {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Aș vrea să merg la concertul trupei, vă rog. группы înseamnă „al trupei”.
    language_code: ro
    direction: ltr
