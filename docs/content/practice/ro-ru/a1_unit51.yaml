  frame:
    text: Концерт {item} два часа.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_длится
  answer_derivation:
    kind: render_frame
    frame:
      text: Концерт {item} два часа.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Concertul durează două ore. длится înseamnă „durează”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit51.lesson04.order.002
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: word_order
  frame:
    text: Да, мне нужен билет на {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группу
