  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: word_order
  frame:
    text: Я хочу пойти на концерт {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группы
  answer_derivation:
