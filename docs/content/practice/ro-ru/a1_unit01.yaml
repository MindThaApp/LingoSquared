templates:
- content_key: practice.ro-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Literele chirilice seamănă adesea cu cele latine, dar se pronunță diferit: р este R, в este V, у este ca „u” din „lup” și й este un „i” scurt.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Unele litere chirilice sunt „false prietene”: р seamănă cu P, dar este R, iar е seamănă cu E, dar la început de cuvânt se pronunță „ie”; здравствуйте le conține pe amândouă.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rusa se scrie cu alfabetul chirilic; primul cuvânt pe care îl înveți, здравствуйте, folosește literele з, д, р, а, в, с, т, у, й și е.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: Bună ziua! (formal, un singur cuvânt)
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте este salutul formal pentru persoane necunoscute și pentru mai multe persoane deodată; primul в nu se pronunță, deci sună zdrÁstvuite.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Salutările rusești depind de momentul zilei: доброе утро (dimineața), добрый день (ziua), добрый вечер (seara). Утро este neutru, iar день și вечер sunt masculine, deci se schimbă terminația adjectivului.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Привет este salutul familiar pentru prieteni și familie; cu persoane necunoscute folosește здравствуйте sau un salut după momentul zilei.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Добрый se folosește cu substantive masculine precum день și вечер, în timp ce neutrul утро cere доброе.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
    text: Доброе {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Утро este un substantiv neutru, deci salutul folosește доброе, nu добрый.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: În rusă nu există articole, așa că un răspuns dintr-un singur cuvânt este doar cuvântul simplu, precum утро sau завтра.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Привет este familiar, iar здравствуйте este salutul formal pe care îl folosești cu persoane necunoscute.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как дела? este întrebarea obișnuită, tipică între prieteni (ты), în timp ce Как поживаете? se termină cu forma de вы și sună mai formal.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Пока este un „pa” familiar, în timp ce до свидания este formula neutră sau formală de rămas-bun.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дела? întreabă literal cum merg treburile; după Привет, este întrebarea familiară dintre prieteni.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поживаете se termină în -ете, forma de вы, deci se potrivește cu formalul здравствуйте.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.fill.005
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: Хорошо, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хорошо, спасибо este răspunsul obișnuit la Как дела? și înseamnă că lucrurile merg bine.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До înseamnă „până la”, deci До завтра! este modul obișnuit de a spune „ne vedem mâine”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.translate.007
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: Bine, mulțumesc.
    language_code: ro
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хорошо, спасибо este răspunsul politicos standard la Как дела? și merge atât cu ты, cât și cu вы.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit01.lesson03.translate.008
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: Ne vedem mâine.
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: До {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До завтра! folosește до, „până la”, cu завтра, „mâine”.
    language_code: ro
    direction: ltr
