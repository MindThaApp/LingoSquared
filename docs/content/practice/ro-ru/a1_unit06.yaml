templates:
- content_key: practice.ro-ru.ru.a1.unit06.lesson01.choose.001
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мой se folosește cu substantive masculine (мой отец), iar моя cu substantive feminine (моя мать), deci posesivul se schimbă după cuvântul pentru rudă.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson01.match.002
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: У меня есть spune literal „la mine este”, adică felul rusesc de a spune „am”; мой și моя înseamnă amândouă „al meu / a mea”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мать este feminin, deci cere моя; masculinul отец cere мой.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня есть urmat de un substantiv este modul obișnuit de a spune că ai ceva.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: Acesta este tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отец este masculin, deci posesivul este мой; cu substantivul feminin мать ar fi моя.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Substantivele rusești pentru rude au gen gramatical: мать și сестра sunt feminine, отец este masculin.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Дедушка pare feminin din cauza terminației -а, dar este masculin și cere мой: мой дедушка.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это моя {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Бабушка, жена și дочь sunt toate feminine, deci fiecare cere моя.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson02.order.003
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это мой {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это мой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дедушка, муж și сын sunt toate masculine, deci fiecare cere мой, deși дедушка se termină în -а.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: fill_in_blank
  frame:
    text: У меня есть сын и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Conjuncția и leagă două substantive, ca în сын и дочь, „fiu și fiică”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson02.translate.005
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: Aveți copii? (formal)
    language_code: ro
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дети este mereu la plural; У вас есть ...? este modul formal de a întreba dacă cineva are ceva.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rusa are cuvinte separate pentru fiecare rudă și nu are articole.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Эта este forma feminină a lui „această”, deci se potrivește cu девочка; forma masculină este этот.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Эта se acordă cu substantivul feminin девочка, în timp ce Кто это? folosește neutrul это.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
    text: Кто это на {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Фото nu își schimbă niciodată terminația, deci rămâne фото în На фото.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Cine este aceasta în fotografie?
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кто это? întreabă cine este cineva; На фото înseamnă „în fotografie”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Și cine este fetița aceasta?
    language_code: ro
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А la începutul unei întrebări o leagă de ce s-a spus înainte, ca „și” în română.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Mă numesc Olga.
    language_code: ro
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут urmat de un prenume este modul în care se prezintă rușii.
    language_code: ro
    direction: ltr
