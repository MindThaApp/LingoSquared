  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Potrivește fiecare cuvânt rus cu sensul lui în română; cuvintele provin din lecțiile acestei unități.
    language_code: ro
    direction: ltr
