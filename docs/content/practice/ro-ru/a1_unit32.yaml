  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_рождения
        - w_восемнадцатого
        - w_отмечать
        - w_отмечаем
        - w_вечеринка
        - w_приглашать
        - w_приглашаю
        - w_приглашают
        - w_придёшь
        - w_удовольствием
        - w_отметим
        - w_устраиваем
        - w_пригласишь
        - w_приглашу
        - w_приглашает
        - w_рады
        - w_поздравляю
        - w_подарок
        - w_мило
        - w_начнём
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre ziua de naștere.'
    language_code: ro
    direction: ltr
