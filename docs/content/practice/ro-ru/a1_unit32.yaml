schema_version: '1.0'
pack_key: practice.ro-ru.a1.unit32
source_language: ro
target_language: ru
unit_content_key: ru.a1.unit32.birthday
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Romanian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вечеринка
    - w_восемнадцатого
    - w_мило
    - w_начнём
    - w_отметим
    - w_отмечаем
    - w_отмечать
    - w_подарок
    - w_поздравляю
    - w_пригласишь
    - w_приглашает
    - w_приглашать
    - w_приглашаю
    - w_приглашают
    - w_приглашу
    - w_придёшь
    - w_рады
    - w_рождения
    - w_удовольствием
    - w_устраиваем
templates:
- content_key: practice.ro-ru.ru.a1.unit32.lesson01.choose.001
