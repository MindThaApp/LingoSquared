  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число este neutru, deci întrebarea folosește какое, în timp ce день este masculin și folosește какой.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
