    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Кофе este un substantiv masculin care nu își schimbă niciodată terminația.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson02.translate.005
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: Vreau ceai.
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу este o afirmație directă, așa că la restaurant adaugă пожалуйста pentru a o îndulci.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: Vreau borș și salată.
    language_code: ro
    direction: ltr
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат este comanda din dialog; rusa nu folosește niciun cuvânt pentru articol.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мороженое se termină în -ое pentru că este un substantiv neutru format dintr-un adjectiv, ca și сладкое.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson03.order.002
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: На сладкое принесите {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое принесите {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое înseamnă „la desert”, iar принесите este imperativul de politețe pentru вы, cu sensul „aduceți”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson03.order.003
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: Что будете {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Что будете {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Что будете пить? este întrebarea ospătarului: будете plus un infinitiv.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson03.fill.004
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: fill_in_blank
  frame:
    text: На сладкое {item} мороженое, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Принесите este imperativul de politețe pentru вы al lui „a aduce”; cu ты ar fi принеси.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson03.translate.005
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: La desert, vă rog, aduceți înghețată. (formal)
    language_code: ro
    direction: ltr
  slots:
    a: *id016
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое {a} {b}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое принесите мороженое este o formulă firească pentru a comanda desertul de la ospătar.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit07.lesson03.translate.006
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сладкое este un adjectiv folosit ca substantiv, cu sensul „desert”.
    language_code: ro
    direction: ltr
