    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aceste denumiri de locuri sunt substantive, iar în Где находится банк? nu este nevoie de articol.
    language_code: ro
    direction: ltr
