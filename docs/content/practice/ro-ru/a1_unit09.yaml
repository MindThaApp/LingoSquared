    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиница este un substantiv feminin care înseamnă „hotel”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.choose.001
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Вашей și моей sunt formele feminine ale lui ваш și мой folosite după на: на вашей улице, на моей улице.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.order.002
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: word_order
  frame:
    text: Что есть на {item} улице?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вашей se acordă cu substantivul feminin улице; aceasta este întrebarea de politețe, cu вы.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.fill.003
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: На {item} улице есть банк. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Моей este forma lui моя folosită după на, deoarece улица este feminin și se află la cazul prepozițional.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.fill.004
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: Спасибо {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо большое este o modalitate călduroasă de a spune „mulțumesc mult”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.translate.005
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: Ce este pe strada dumneavoastră? (formal)
    language_code: ro
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что есть на вашей улице? întreabă ce există pe stradă; forma вашей, de la вы, păstrează politețea.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: Mulțumesc mult.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Большое se acordă cu spasibo, de gen neutru, de aceea se termină în -ое.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit09.lesson03.translate.007
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: Pe strada mea este o bancă.
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть se folosește pentru posesie; pentru ceva aflat pe o stradă, rusa folosește На моей улице есть.
    language_code: ro
    direction: ltr
