  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_администратор
    - w_бронь
    - w_были
    - w_включён
    - w_вкусный
    - w_выезд
    - w_двенадцать
    - w_забронирован
