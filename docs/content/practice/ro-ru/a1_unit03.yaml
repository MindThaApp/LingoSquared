  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Rușii spun vârsta cu мне, literal „mie”, iar după 5 și mai mult substantivul este лет.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
