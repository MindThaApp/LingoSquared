    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Am zece ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Vârsta se exprimă cu мне, „mie”, plus numărul și лет; nu există verb.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Câți ani aveți? (formal)
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? folosește forma de politețe вам, literal „vouă/dumneavoastră”; întreabă, de fapt, „câți ani vă sunt?”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rusa spune Сколько стоит? pentru un singur produs și Сколько стоят? pentru mai multe, deci verbul se acordă cu ceea ce se cumpără.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? este întrebarea universală pentru preț; стоит este forma pentru un singur lucru.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки este la plural, deci verbul este стоят; pentru un singur produs (хлеб) ar fi стоит.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Cât costă pâinea?
    language_code: ro
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб este un singur produs, deci verbul este стоит; cu pluralul яблоки ar fi стоят.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Trei ruble.
    language_code: ro
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: După три substantivul ia forma pentru 2–4, рубля, diferită de рублей de după 5 și mai mult.
    language_code: ro
    direction: ltr
