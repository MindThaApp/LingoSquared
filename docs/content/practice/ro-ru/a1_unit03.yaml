      direction: ltr
  feedback_frame:
    text: După numerele 5–10 substantivul este la genitiv plural, deci книга devine книг.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
