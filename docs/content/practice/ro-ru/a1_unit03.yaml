  feedback_frame:
    text: 'Numerele de la 5 la 10 cer toate substantivul la genitiv plural: пять книг, девять книг, десять книг.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit03.lesson02.order.002
