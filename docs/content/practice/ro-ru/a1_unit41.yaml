      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_пропал
        - w_нашёлся
        - w_рюкзак
        - w_стойки
        - w_кошелёк
        - w_стойка
        - w_стойке
        - w_подойди
        - w_потерян
        - w_посмотри
        - w_куртке
        - w_хватает
        - w_волнений
