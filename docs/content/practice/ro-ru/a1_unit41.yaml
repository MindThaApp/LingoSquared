    - w_кошелёк
    - w_куртке
    - w_нашёлся
    - w_подойди
    - w_посмотри
    - w_потерян
    - w_пропал
    - w_рюкзак
    - w_стойка
    - w_стойке
    - w_стойки
    - w_хватает
