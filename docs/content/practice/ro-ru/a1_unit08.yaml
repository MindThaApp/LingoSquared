  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько стоит? întreabă prețul unui singur produs; молоко este un substantiv la singular.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'După сто, ca după orice număr de la cinci în sus, substantivul este la genitiv plural: рублей.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson01.match.004
