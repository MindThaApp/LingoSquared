    - fifth
    - sixth
  feedback_frame:
    text: Полкило înseamnă jumătate de kilogram și se scrie într-un singur cuvânt.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson01.translate.005
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: Cât costă laptele?
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Стоит se acordă cu un singur produs, молоко; pentru mai multe produse rusa folosește стоят.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: Pâinea costă o sută de ruble.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сто nu are nevoie de niciun cuvânt pentru „o”; substantivul de după el este рублей.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дайте este imperativul politicos cu вы, însemnând „dați-mi”; cu ты ar fi дай.
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson02.order.002
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: word_order
  frame:
