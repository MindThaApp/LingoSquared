templates:
- content_key: practice.ro-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто și двести sunt numerele 100 și 200; substantivul de după ele este la genitiv plural: сто рублей, двести рублей.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-ru.ru.a1.unit08.lesson01.order.002
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
