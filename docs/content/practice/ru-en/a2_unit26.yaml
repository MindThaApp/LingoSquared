- content_key: practice.ru-en.en.a2.unit26.lesson01.order.004
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: word_order
  frame:
    text: On the other {item}, it's very close to the playground.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_hand
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other {item}, it's very close to the playground.
      language_code: en
      direction: ltr
  feedback_frame:
    text: On the other hand соответствует русскому «с другой стороны»; буквально это «с другой руки».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson01.translate.005
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - noun
      - adjective
      agreement_tags:
        semantic:
        - w_think
        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В opinion после i стоит только одна n, и слово оканчивается на -ion; agree пишется с двумя e.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: По-моему, новый парк для собак — хорошая идея, потому что собакам нужно место, чтобы бегать.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion стоит в начале предложения и отделяется запятой от остального.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.choose.007
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - preposition
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_idea
        - w_space
        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В разговоре о парке для собак тебе встретятся dog, park, space и глагол run.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.listen.008
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
