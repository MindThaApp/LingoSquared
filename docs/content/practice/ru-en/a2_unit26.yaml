      part_of_speech: adverb
      agreement_tags:
        semantic: w_very
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's {item} close to the playground.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Very усиливает close; по-русски «очень близко» стоит в том же порядке.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson03.translate.016
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
