      part_of_speech:
      - adverb
      - verb
      - noun
      agreement_tags:
        semantic:
        - w_very
        - w_close
        - w_playground
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Very стоит перед прилагательным или наречием, здесь перед close: very close значит «очень близко».'
    language_code: ru
    direction: ltr
