    slot: item
  feedback_frame:
    text: Playground — сложное слово из play и ground, как русское «детская площадка» складывается из «детская» и «площадка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson03.translate.017
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: С другой стороны, он очень близко к детской площадке. (используй сокращение it's)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_playground
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's very close to the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Close to the playground значит «близко к детской площадке»; to стоит после close.
    language_code: ru
    direction: ltr
