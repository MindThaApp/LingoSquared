        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Множественное число dogs образуется просто с -s; space здесь значит «место» в смысле пространства.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.translate.012
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: Что ты думаешь о новом парке для собак? (передай с think)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_park
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think about the new dog {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Русское «Что ты думаешь о …?» по-английски звучит What do you think about …?
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: Я считаю, что это хорошая идея, потому что собакам нужно место, чтобы бегать.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
    frame:
      text: I think it's a good {item} because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Вместо «Я считаю» говорят I think; причину присоединяют с помощью because.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson03.choose.014
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
