        - w_opinion
        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Чтобы высказать мнение, говорят I think или in my opinion; согласиться — to agree.
    language_code: ru
    direction: ltr
