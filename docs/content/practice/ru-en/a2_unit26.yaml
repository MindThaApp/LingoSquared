      - verb
      - adjective
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_space
        - w_run
        - w_idea
        - w_good
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Прислушайся к гласным: в dog гласный краткий, в park — долгий, и там отчётливо слышно r.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.order.009
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: word_order
  frame:
    text: What do you think {item} the new dog park?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_about
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think {item} the new dog park?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'После think тему называют с about: What do you think about …? Это соответствует русскому «Что ты думаешь о …?»'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.fill.010
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: fill_in_blank
  frame:
    text: I think it's a {item} idea because dogs need space to run. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
    hint:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A good idea стоит с артиклем a перед существительным; good превращается в better, а не в gooder.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit26.lesson02.translate.011
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
