  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Coffee и tea при заказе в английском часто употребляют с a: I''d like a coffee, please.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson02.choose.003
