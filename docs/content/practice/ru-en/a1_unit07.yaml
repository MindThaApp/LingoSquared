    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anything else? — обычный вопрос в кафе после заказа; на него отвечают, например, No, that's all.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson02.listen.004
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
