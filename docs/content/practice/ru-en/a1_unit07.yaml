    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Anything {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Else значит «ещё»; Anything else? спрашивает, нет ли у тебя других пожеланий.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson04.order.008
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: word_order
  frame:
    text: For {item} or to go?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: For {item} or to go?
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here or to go? спрашивает, поешь ли ты в кафе или возьмёшь еду с собой; here значит «здесь».
    language_code: ru
    direction: ltr
