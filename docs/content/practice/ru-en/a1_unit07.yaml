    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Menu в английском — это перечень блюд в кафе, а цена блюда в нём называется price.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson02.order.007
