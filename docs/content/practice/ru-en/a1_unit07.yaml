    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Please делает просьбу вежливой и часто стоит в конце предложения: I''d like a coffee, please.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson04.choose.005
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sure здесь значит «конечно» или «с удовольствием»; с Sure. Anything else? официант дружелюбно подтверждает заказ и спрашивает о других пожеланиях.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson03.choose.006
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: multiple_choice
  frame:
