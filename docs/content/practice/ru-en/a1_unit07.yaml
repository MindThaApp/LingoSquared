templates:
- content_key: practice.ru-en.en.a1.unit07.lesson01.choose.001
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Water и bread — неисчисляемые существительные: по-английски говорят some water, но a coffee или a sandwich, когда имеют в виду порцию.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit07.lesson01.listen.002
