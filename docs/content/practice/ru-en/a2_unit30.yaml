- content_key: practice.ru-en.en.a2.unit30.lesson01.translate.005
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: translation
  frame:
    text: Интервьюер спросил меня, когда я смогу начать.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_availability
  answer_derivation:
    kind: render_frame
    frame:
      text: The interviewer asked about my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Availability — «готовность приступить к работе»: период, когда вы можете начать или работать. Asked about значит «спросил о».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit30.lesson02.choose.006
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: multiple_choice
