- content_key: practice.ru-en.en.a2.unit30.lesson03.translate.016
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Компания Bright Path Marketing ищет координатора по маркетингу. (длительная форма)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_looking
  answer_derivation:
    kind: render_frame
    frame:
      text: Bright Path Marketing is {item} for a marketing coordinator.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Длительная форма is looking for соответствует русскому «ищет». Предлог for неотделим от look for.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit30.lesson03.translate.017
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Я укладываюсь в сроки и хорошо работаю в команде. (без сокращений)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_well
  answer_derivation:
    kind: render_frame
    frame:
      text: I meet deadlines, and I work {item} in a team.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Well — наречие от good: I work well. После work прилагательное не ставится.'
    language_code: ru
    direction: ltr
