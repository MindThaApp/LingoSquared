- content_key: practice.ru-en.en.a2.unit30.lesson02.translate.010
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: У меня два года опыта работы в маркетинге в социальных сетях. (запиши число словом)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_two
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} years of experience in social media marketing.
      language_code: en
      direction: ltr
  feedback_frame:
    text: После two слово years стоит во множественном числе. С of experience in называют область.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit30.lesson02.translate.011
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: Одна из моих сильных сторон — умение хорошо организовывать себя.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_being
  answer_derivation:
    kind: render_frame
    frame:
      text: One of my strengths is {item} organized.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'После is здесь стоит being, потому что «быть» понимается как состояние: One of my strengths is being organized.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit30.lesson03.choose.012
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
