  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: Я хотел бы записаться на приём к врачу, пожалуйста. (используй сокращение I'd)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_doctor
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Записаться на приём — make an appointment; I'd like to — вежливая форма желания.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: У меня три дня болят голова и горло, и становится хуже. (используй сокращения)
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'For называет продолжительность («три дня»); с ним стоит Present Perfect: I''ve had.'
    language_code: ru
    direction: ltr
