templates:
- content_key: practice.ru-en.en.a1.unit11.lesson01.choose.001
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Погоду в английском описывают с помощью it: It''s sunny, It''s cold.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.choose.002
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Raining — длительная форма; она описывает то, что происходит сейчас: It''s raining.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson03.choose.003
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'С will образуют будущее время; после will стоит начальная форма глагола: It will rain.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson04.choose.004
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'But соединяет два противоположных утверждения; so называет следствие: It''s going to rain, so let''s go today.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson01.order.005
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: word_order
  frame:
    text: It's {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Погоду описывают с помощью It's и прилагательного; today стоит в конце предложения.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.order.006
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: word_order
  frame:
    text: You should take an {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: You should take an {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Should даёт совет; take — начальная форма. Перед гласным вместо a стоит an.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson03.order.007
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: word_order
  frame:
    text: It will {item} on Saturday.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} on Saturday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'После will стоит начальная форма глагола без -s: It will rain.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.fill.008
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: It's {item} and warm. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sunny значит «солнечный» и происходит от sun — «солнце»; sunny and warm — частое сочетание.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.fill.009
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: What's the {item} like today? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: What's the weather like? спрашивает о погоде; what's — краткая форма от what is.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson03.fill.010
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: fill_in_blank
  frame:
    text: It {item} rain on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Will образует будущее время; говорят It will rain, а не It will rains.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson04.fill.011
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: fill_in_blank
  frame:
    text: It's going to rain on Saturday, {item} let's go today. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'So вводит следствие: в субботу будет дождь, поэтому мы идём сегодня.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson01.match.012
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Прилагательные sunny, rainy, cloudy, windy, cold, hot и warm описывают погоду; umbrella — зонт.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson01.translate.013
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Прилагательные о погоде стоят после It''s: It''s hot, It''s cold.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.translate.014
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Weather — погода, umbrella — зонт; с should даётся совет: You should take an umbrella.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson04.translate.015
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: But значит «но», so — «поэтому», а idea — «идея».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.translate.016
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: Сейчас идёт дождь. (с сокращением)
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: It's raining описывает то, что происходит сейчас; для прогноза используют will.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson02.translate.017
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: Какая сегодня погода? (с сокращением и like)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: What's the {item} like today?
      language_code: en
      direction: ltr
  feedback_frame:
    text: What's the weather like? спрашивает о погоде; like здесь значит «какой».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit11.lesson03.translate.018
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: translation
  frame:
    text: Завтра пойдёт дождь. (с will)
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} tomorrow.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'С will + начальная форма глагола образуют будущее время: It will rain tomorrow.'
    language_code: ru
    direction: ltr
