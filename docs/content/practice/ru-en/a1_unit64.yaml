schema_version: '1.0'
pack_key: practice.ru-en.a1.unit64
source_language: ru
target_language: en
unit_content_key: en.a1.unit64.compliments
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived 2026-11-15 from practice.nl-en a1 unit64 by remapping the nl-en unit semantic tags to
    the ru-en lexeme tags (en_a1_u64, en_a1_u64_lNN) and translating the Russian frame/feedback strings.
    Slot pools, templates and answer derivations unchanged (a Dutch-grammar verb-conjugation frame was
    dropped). Needs native Russian review of the feedback strings.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_a1_u64
    - en_a1_u64_l01
    - en_a1_u64_l02
    - en_a1_u64_l04
templates:
- content_key: practice.ru-en.en.a1.unit64.lesson01.choose.001
  lesson_content_key: en.a1.unit64.lesson01.compliment_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &id001
      - adjective
      - adverb
      - noun
      - verb
      agreement_tags: &id002
        semantic: en_a1_u64
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit64.lesson04.listen.001
  lesson_content_key: en.a1.unit64.lesson04.a_kind_message
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
