    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Дни недели и месяцы в английском пишутся с заглавной буквы, в отличие от русского.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson04.fill.013
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: fill_in_blank
  frame:
    text: Great, see you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Then значит «тогда»; See you then относится к моменту, который собеседники уже назвали.
    language_code: ru
    direction: ltr
