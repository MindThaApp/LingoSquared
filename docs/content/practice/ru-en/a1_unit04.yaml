templates:
- content_key: practice.ru-en.en.a1.unit04.lesson01.choose.001
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Дни недели в английском всегда пишутся с заглавной буквы: Monday, Tuesday, Wednesday.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson01.listen.002
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Все дни недели оканчиваются на -day: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday и Sunday.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson02.choose.003
  lesson_content_key: en.a1.unit04.lesson02.months
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Названия месяцев в английском тоже пишутся с заглавной буквы: January, March, July.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Многие английские названия месяцев похожи на русские, но ударение часто стоит иначе; внимательно слушай ударный слог.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В дате в английском используют порядковые числительные: July 7th. С when''s спрашивают, когда что-то происходит, например When''s your birthday?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson04.choose.006
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Open может значить «открывать» или «быть открытым», как в When's the library open again?
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson02.order.007
  lesson_content_key: en.a1.unit04.lesson02.months
  type: word_order
  frame:
    text: Which {item} is it?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Which {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Which спрашивает о выборе из ограниченного набора, здесь — из двенадцати месяцев.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson03.order.008
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: word_order
  frame:
    text: My birthday is {item} 3rd.
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: My birthday is {item} 3rd.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'В английской дате сначала идёт месяц, потом число: March 3rd, а в русском — «3 марта».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson01.fill.009
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: fill_in_blank
  frame:
    text: What day is it {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: С what day спрашивают о дне недели, с what's today's date — о числе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson03.fill.010
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: fill_in_blank
  frame:
    text: When's your {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: When's — краткая форма от When is; с ней спрашивают о времени.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson04.order.011
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: word_order
  frame:
    text: It opens on {item}, July 9th.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It opens on {item}, July 9th.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Перед днём недели или датой стоит on: on Thursday, on July 9th.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit04.lesson01.match.012
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
