templates:
- content_key: practice.ru-en.en.a1.unit13.lesson01.choose.001
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'После I''m чувство стоит в виде прилагательного: I''m happy, I''m tired; отдельный глагол вроде русского «радоваться» не нужен.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit13.lesson02.choose.002
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
