  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Because вводит причину и стоит в обычном порядке слов: I''m happy because the class is almost over.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit13.lesson03.choose.003
