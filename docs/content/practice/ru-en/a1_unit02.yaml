templates:
- content_key: practice.ru-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Your и my — притяжательные слова: my name — «моё имя», your name — «твоё» или «ваше имя», потому что в английском нет разницы между «ты» и «вы».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'What''s — краткая форма от what is; с неё начинается вопрос об имени: What''s your name?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В английском перед профессией обычно стоит артикль: a student, a teacher, но an engineer, потому что следующее слово начинается с гласного звука.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'He говорят о мужчине, she — о женщине; оба употребляются с is: he is, she is.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson03.choose.005
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В библиотеке ты услышишь Welcome to the library; the — определённый артикль, он подходит к словам любого рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson03.listen.006
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Thank you — вежливая стандартная форма слова «спасибо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson01.order.007
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My {item} is Leila.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} is Leila.
      language_code: en
      direction: ltr
  feedback_frame:
    text: В английском говорят буквально «Моё имя есть …»; глагол is стоит между name и самим именем.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.order.008
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: word_order
  frame:
    text: I am a {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: I am a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Перед профессией или ролью в английском стоит артикль a: I am a student; в русском артикля здесь нет.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson01.fill.009
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: fill_in_blank
  frame:
    text: What's {item} name? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Your соответствует you, то есть и «ты», и «вы»; для «мой» используй my.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.fill.010
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: She is {item} engineer. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Перед гласным звуком вместо a ставится an: an engineer, но a teacher.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.fill.011
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: '{item} is a teacher. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: He — мужской род; о женщине говорят she, а о нескольких людях — they.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.match.012
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Yes и no отвечают на вопрос, как «да» и «нет» в русском; student и teacher — роли, которым нужен артикль.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson03.fill.013
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: fill_in_blank
  frame:
    text: Welcome to {item} library. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Определённый артикль the не меняется, какого бы рода ни было существительное.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson01.translate.014
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Как тебя зовут? (неформально)
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: What's {item} name?
      language_code: en
      direction: ltr
  feedback_frame:
    text: В английском спрашивают буквально «Что есть твоё имя?»; вопрос звучит одинаково и с друзьями, и с незнакомцами.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson01.translate.015
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Меня зовут Лейла.
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} name is Leila.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: My — притяжательное слово «мой»; в предложении оно стоит перед существительным name.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.translate.016
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Слова вроде student или teacher в английском одинаковы для женщин и мужчин; отдельного женского окончания нет.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson02.translate.017
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: Она инженер. (полная форма, без сокращения)
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item} engineer.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'У многих английских названий профессий нет отдельной женской формы: и инженер-мужчина, и инженер-женщина — это engineer.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit02.lesson03.translate.018
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Welcome используют как приветствие при входе; thank входит в состав thank you.
    language_code: ru
    direction: ltr
