templates:
- content_key: practice.ru-en.en.a1.unit10.lesson01.choose.001
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Turn left и turn right — повелительные формы без you; по-русски это «Поверните налево» и «Поверните направо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson02.choose.002
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Can't — краткая форма от cannot; You can't miss it значит, что цель невозможно не заметить.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson03.choose.003
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'First и second — порядковые числительные; они стоят с the перед существительным: the first street.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson01.order.004
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: word_order
  frame:
    text: Turn {item} at the corner.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item} at the corner.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Left и right после Turn стоят без артикля, а с on the вы описываете сторону: on the left.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson02.order.005
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: word_order
  frame:
    text: It's just two {item} from here.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's just two {item} from here.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Minutes — множественное число от minute; после числа two существительное стоит во множественном числе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson03.order.006
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: word_order
  frame:
    text: Take the {item} street on the left.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the {item} street on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Порядковые числительные first и second стоят с the перед существительным: the first street, the second street.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson01.fill.007
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: fill_in_blank
  frame:
    text: Turn left at the {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: At the corner значит «на углу»; с at называют точку, где нужно свернуть.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson02.fill.008
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: You can't {item} it. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Miss здесь значит «пропустить, не заметить»; You can't miss it — частое выражение, когда цель хорошо заметна.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson02.fill.009
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: How do I {item} to the bank? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get to значит «добраться до»; How do I get to ...? — обычный вопрос о дороге.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson03.fill.010
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: fill_in_blank
  frame:
    text: Take the first {item} on the left. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Street — улица; в предложении стоит on the left, потому что указывается сторона.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson01.match.011
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Слова этой игры описывают путь: turn, left, right, straight и stop — указания, corner и street — места.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson01.translate.012
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Left и right стоят как наречия после turn: Turn left, Turn right.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson02.translate.013
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get здесь значит «добраться»; minutes — множественное число от minute; miss значит «пропустить, не заметить».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson03.translate.014
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Take the first street значит «Сверните на первую улицу»; directions в английском стоит во множественном числе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson01.translate.015
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: Поверните налево.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Turn left — короткая команда; you и артикль не нужны.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson02.translate.016
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: Вы его не пропустите. (с сокращением)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: You can't {item} it.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Can't — краткая форма от cannot; miss здесь значит «пропустить, не заметить».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit10.lesson03.translate.017
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: Первая улица слева.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the first {item} on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'On the left в английском стоит после существительного: the first street on the left; в русском тоже «первая улица слева».'
    language_code: ru
    direction: ltr
