templates:
- content_key: practice.ru-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parents и siblings в английском стоят во множественном числе; вместо единственного числа sibling в повседневной речи обычно говорят brother или sister.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В словах mother, father и brother есть звук th, который произносится с кончиком языка между зубами.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother и grandfather состоят из grand- и mother или father; по-русски для этого есть отдельные слова «бабушка» и «дедушка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child — единственное число, множественное — children; brothers — множественное число от brother.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson04.choose.005
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Who спрашивает о человеке: Who is this? О предметах спрашивают с what.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'His относится к мужчине, а her — к женщине: his sister — сестра мужчины, her sister — сестра женщины.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: word_order
  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'После числа two в английском стоит множественное число: two brothers, а не two brother.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson04.order.008
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: word_order
  frame:
    text: Is this your {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Is this your {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Your стоит перед существительным; в общем вопросе Is this your family? is стоит перед this.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson02.fill.009
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: fill_in_blank
  frame:
    text: Daniel has one sister. This is {item} sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: His относится к мужчине, здесь — к Дэниелу; о женщине сказали бы her.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson03.fill.010
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: fill_in_blank
  frame:
    text: Do you have {item} siblings? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'В вопросах и отрицаниях употребляют any, а в утверждениях — some: Do you have any siblings?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson04.fill.011
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: fill_in_blank
  frame:
    text: I {item} have one sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Just стоит перед основным глаголом: I just have one sister значит, что есть только одна сестра.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson02.match.012
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Слова о семье, такие как mother и grandmother, показывают родство; grand- означает поколение выше.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson01.translate.013
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Parents («родители») и siblings («братья и сёстры») здесь стоят во множественном числе; единственное число — parent и sibling.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson02.translate.014
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aunt и uncle обозначают братьев и сестёр родителей; cousin подходит и для мальчиков, и для девочек.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson04.translate.015
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Who спрашивает о людях; photo — краткая форма от photograph, в повседневной речи почти всегда используется именно она.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson02.translate.016
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: Это моя сестра. (с This)
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: This is my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: С This is представляют человека, на которого показывают или которого называют; my стоит перед существительным.
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson03.translate.017
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: У меня два брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'После числа two существительное стоит во множественном числе: two brothers.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-en.en.a1.unit06.lesson03.translate.018
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: У тебя есть братья или сёстры? (с any)
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have any {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'В вопросах стоит any: Do you have any siblings? Ответ звучит I have two brothers или No, I don''t.'
    language_code: ru
    direction: ltr
