templates:
- content_key: practice.fa-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marché و prix مذکرند (le marché, le prix) ولی boulangerie مؤنث است (la boulangerie)؛ هر اسم را همراه حرف تعریفش یاد بگیرید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
