      direction: ltr
  feedback_frame:
    text: Chers مذکر جمع است، چون légumes و fruits اسم‌های مذکر جمع هستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
