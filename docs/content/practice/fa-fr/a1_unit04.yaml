    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'بسیاری از واژه‌های بازار اسم‌های خوراکی هستند که بعد از مقدار با de می‌آیند: un kilo de tomates, un litre de lait.'
    language_code: fa
    direction: rtl
