templates:
- content_key: practice.fa-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant یعنی «قبل از»؛ d'abord یعنی «اول»، در آغاز یک ترتیب.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'S''habiller انعکاسی است: je m''habille، tu t''habilles؛ با je، ضمیر se به m'' تبدیل می‌شود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: چند فعل برنامهٔ روزانه انعکاسی هستند (se réveiller، s'habiller)؛ بقیه، مثل prendre و quitter، انعکاسی نیستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison یعنی از خانه بیرون رفتن؛ با je فعل به شکل quitte درمی‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche روش معمول برای گفتن «دوش گرفتن» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: من قبل از صبحانه لباس می‌پوشم.
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: در Je m'habille ضمیر انعکاسی پیش از صدای مصوت به شکل m' می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard یعنی «دیر»؛ puis یعنی «بعد» و برای وصل کردن مرحله‌های یک برنامهٔ روزانه به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois یعنی ۲۳؛ در فرانسوی ساعت را می‌شود بر پایهٔ ۲۴ ساعته گفت، پس vingt-trois heures یعنی ساعت ۱۱ شب.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer، dîner و coucher مصدر هستند؛ شکل‌های je و nous پایانهٔ فعل را تغییر می‌دهند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre شکل je است؛ rentrer یعنی به خانه برگشتن.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: ما شنبه‌شب‌ها با هم شام می‌خوریم. (از nous استفاده کنید)
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons صورت «ما» (nous) است؛ ensemble یعنی «با هم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: من حدود ساعت ۱۱ شب (۲۳:۰۰) می‌خوابم.
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers زمان تقریبی را نشان می‌دهد؛ vingt-trois heures از ساعت ۲۴ ساعته استفاده می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ? شکل محاوره‌ای پرسیدن «چه کار می‌کنی؟» است؛ quoi بعد از فعل جای que را می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose یعنی «استراحت می‌کنم»؛ repose صورت «من» (je) فعل se reposer است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais صورت «من» (je) فعل aller است؛ au از ترکیب à و le ساخته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer فعل انعکاسی است، برای همین با je از me استفاده می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'شنبه‌ها قبل از کارگاه چه کار می‌کنی؟ (صمیمی: با Tu fais شروع کنید)'
    language_code: fa
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ? شکل صمیمی پرسیدن «چه کار می‌کنی؟» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'ساعت چند به خانه برمی‌گردی؟ (صمیمی: با Tu شروع کنید)'
    language_code: fa
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres صورت «تو» (tu) است؛ à quelle heure برای پرسیدن ساعت به کار می‌رود.
    language_code: fa
    direction: rtl
