templates:
- content_key: practice.fa-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frères et sœurs با هم یعنی خواهر و برادرها: فرانسوی برای «خواهر و برادرها» یک واژه‌ی رایج و یگانه ندارد.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Frère و frères هم‌صدا هستند، sœur و sœurs هم همین‌طور؛ پس فقط حرف تعریف یا بافت جمله مفرد یا جمع بودن را نشان می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'وقتی جنسیت واژه‌های خانوادگی فرانسوی را بدانید، جفت کردنشان آسان است: mère و père، tante و oncle، cousine و cousin.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frère و sœur نشانه‌ی جمع -s می‌گیرند (frères، sœurs)؛ پس هر جا در فارسی جمع باشد، در فرانسوی هم باید جمع بیاید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ma با اسم‌های مؤنث می‌آید (ma mère)، mon با اسم‌های مذکر (mon père) و mes با همه‌ی جمع‌ها (mes parents).
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ma با اسم مؤنث مفرد می‌آید؛ صفت petite هم -e مؤنث می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Famille مؤنث است، پس ma می‌گیرد؛ اسم مذکر mon می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: خانوادهٔ من کوچیکه.
    language_code: fa
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Petite مؤنث است چون famille مؤنث است؛ اسم مذکر petit می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cousin مذکر و cousine مؤنث است: -e نشان می‌دهد که فرد دختر است و باعث می‌شود n پایانی شنیده شود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Mon پیش از اسم‌های مذکر مفرد می‌آید: mon père، mon oncle.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: پایان‌های فعل حال habite/habites/habitent یکسان تلفظ می‌شوند، پس ضمیر نشان می‌دهد منظور چه کسی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: J’habite avec mes {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes شکل جمع «من/م» است، هم برای اسم‌های مذکر و هم مؤنث.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson04.fill.003
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Tu habites {item} de tes parents ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Près de یعنی نزدیکِ: près de tes parents، près d’ici.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson04.translate.004
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'پایان فعل از فاعل پیروی می‌کند: habite برای il/elle، habitent برای ils/elles و habites برای tu.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson04.translate.005
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: من با پدربزرگ و مادربزرگم زندگی می‌کنم.
    language_code: fa
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes شکل جمع «من/م» است، پس mes grands-parents یعنی پدربزرگ و مادربزرگ من.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson05.fill.001
  lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Ma petite sœur {item} Camille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'S’appelle شکل il/elle از s’appeler است: ma sœur s’appelle...، je m’appelle...'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson06.listen.001
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque semaine یعنی هر هفته: chaque هیچ‌وقت تغییر نمی‌کند و بعد از آن اسم مفرد می‌آید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit03.lesson06.match.002
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id018
    second: *id018
    third: *id018
    fourth: *id018
    fifth: *id018
    sixth: *id018
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mais واژه‌ی تضاد (اما) است و plus مقایسه می‌سازد، مثل Ma famille est plus petite.
    language_code: fa
    direction: rtl
