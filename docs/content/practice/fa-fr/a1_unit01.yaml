templates:
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.choose.001
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'فرانسوی برای «شما/تو» دو کلمه دارد: tu با دوستان، خانواده و هم‌سن‌وسالان، و vous با غریبه‌ها، در موقعیت‌های رسمی و برای بیش از یک نفر.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.listen.002
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bonjour در هر ساعت از روز و با هر کسی به کار می‌رود؛ salut فقط برای کسانی است که به آن‌ها tu می‌گویید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.match.003
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tu و vous هر دو یعنی «تو/شما»: tu برای یک دوست، فامیل یا هم‌سن‌وسال است؛ vous برای غریبه، موقعیت رسمی یا بیش از یک نفر.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.order.004
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: word_order
  frame:
    text: Comment {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'هر دو راهی برای پرسیدن «حال شما چطور است؟» هستند: allez-vous رسمی و vas-tu خودمانی است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.translate.005
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bonjour، merci، oui و non هیچ‌وقت شکلشان عوض نمی‌شود، اما صفت‌ها عوض می‌شوند: fatigué برای مرد، fatiguée برای زن.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.translate.006
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: حال شما چطوره؟ (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Allez-vous پرسش رسمی است؛ با دوست می‌پرسید comment vas-tu ?
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson01.translate.007
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: حالت چطوره؟ (خودمانی)
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vas-tu پرسش خودمانی برای دوستان و خانواده است؛ با غریبه می‌پرسید comment allez-vous ?
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson02.choose.001
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Enchanté را مرد می‌گوید و enchantée را زن؛ moi c’est + اسم راهی خودمانی برای معرفی خود است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson02.order.002
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Bonjour, je m’appelle {name}.
    language_code: fr
    direction: ltr
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonjour, je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle در اصل یعنی «خودم را ... صدا می‌زنم»؛ راه رایج و روزمره برای گفتن اسم است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson02.translate.003
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: اسم من {name} است.
    language_code: fa
    direction: rtl
    slot_rendering:
      name: token
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle برای معرفی خودتان است؛ برای پرسیدن اسم دیگری می‌گویید tu t’appelles comment? یا comment vous appelez-vous?
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson03.choose.001
  lesson_content_key: fr.a1.unit01.lesson03.reading_aloud
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je پیش از واکه به j’ کوتاه می‌شود (j’habite)، و êtes شکل vous از فعل être یعنی «بودن» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson04.choose.001
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: به Ça va? با très bien یا pas mal جواب می‌دهند؛ افزودن un peu حالت را ملایم‌تر می‌کند، مثل un peu fatigué.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson04.match.002
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Fatigué مذکر و fatiguée مؤنث است: صفت با کسی که توصیف می‌کند مطابقت می‌کند.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson04.fill.003
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: fill_in_blank
  frame:
    text: Je suis un peu {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مرد fatigué می‌گوید و زن fatiguée؛ این دو نوشتارشان فرق دارد، اما تلفظشان یکی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson05.listen.001
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quartier یک محلهٔ کامل است و rue فقط یک خیابان؛ atelier یعنی کارگاه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson05.order.002
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: Je suis de {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis de {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Être de + مکان می‌گوید اهل کجایید؛ habiter à + مکان می‌گوید کجا زندگی می‌کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson05.order.003
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: J’habite à {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite à {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'پیش از نام شهر از à استفاده کنید: j’habite à Montreuil، j’habite à Saint-Ouen.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit01.lesson05.fill.004
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: fill_in_blank
  frame:
    text: Vous {item} dans le quartier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'با vous فعل به -ez ختم می‌شود: vous habitez؛ با tu می‌شود tu habites.'
    language_code: fa
    direction: rtl
