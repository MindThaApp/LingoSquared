      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اگر باران بیاید، توی خانه می‌مانیم. S''il pleut (اگر باران بیاید): si + il می‌شود s''il؛ بعد on reste à l''intérieur می‌گوید چه کار می‌کنید.'
    language_code: fa
    direction: rtl
