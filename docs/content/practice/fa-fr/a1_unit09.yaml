    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Droit در tout droit یعنی «مستقیم»، و gauche و droite یعنی «چپ» و «راست».
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit09.lesson01.order.004
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: برای پیچیدن به چپ یا راست، در à gauche و à droite از à استفاده می‌شود، نه en.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: fill_in_blank
