templates:
- content_key: practice.fa-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche و à droite یعنی «سمت چپ» و «سمت راست» یا «به چپ» و «به راست»؛ اسم‌های gauche و droite مؤنث‌اند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Au carrefour از ترکیب à و le به شکل au ساخته شده است: سر چهارراه.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit09.lesson01.match.003
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
