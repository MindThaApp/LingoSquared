    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au ترکیب à و le است، پس au carrefour یعنی «سر چهارراه».
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit09.lesson01.translate.006
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: translation
  frame:
    text: مغازه سر پیچ خیابان، سمت راست است.
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La boutique est au {item} de la rue, à droite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au coin de la rue یعنی «سر پیچ خیابان».
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit09.lesson02.choose.001
