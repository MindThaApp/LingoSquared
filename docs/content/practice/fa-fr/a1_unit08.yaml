templates:
- content_key: practice.fa-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در فرانسوی lundi، samedi و dimanche با حرف بزرگ نوشته نمی‌شوند و le قبل از نام روز یعنی هر هفته: le samedi.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson01.listen.002
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Demain و hier قیدهای «فردا» و «دیروز» هستند و هیچ‌کدام حرف اضافه نمی‌گیرند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson01.match.003
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
