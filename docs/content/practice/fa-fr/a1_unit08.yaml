    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: روزهای هفته در فرانسوی مذکرند و با حرف کوچک نوشته می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson01.order.004
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: word_order
  frame:
    text: La pharmacie ouvre {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La pharmacie ouvre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Demain یعنی «فردا» و بعد از فعل می‌آید، بدون حرف اضافه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson01.fill.005
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: fill_in_blank
  frame:
    text: La boulangerie est fermée le {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le dimanche یعنی «یکشنبه‌ها» به‌عنوان یک عادت همیشگی.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson01.translate.007
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: translation
  frame:
    text: کارگاه شنبه‌ها برگزار می‌شه.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'atelier a lieu le samedi یعنی کارگاه شنبه‌ها برگزار می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier عدد ترتیبی است و فقط برای روز اول ماه به کار می‌رود؛ بقیهٔ تاریخ‌ها عدد اصلی دارند: le premier mars، le quinze mars.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars نام یک ماه است؛ ماه‌ها در فرانسوی مثل روزها با حرف کوچک نوشته می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson02.order.003
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: word_order
  frame:
    text: Nous sommes le quinze {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous sommes le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'تاریخ از الگوی le + عدد + نام ماه پیروی می‌کند: le quinze mars.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson02.fill.004
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: fill_in_blank
  frame:
    text: L'atelier se {item} le vingt-deux mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se termine شکل انعکاسی فعل است و یعنی «تموم می‌شه».
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson02.translate.005
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: تاریخ امروز چنده؟
    language_code: fa
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} aujourd'hui ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle est la date aujourd'hui روش استاندارد پرسیدن تاریخ تقویمی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson02.translate.006
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: پانزدهم مارسه. (با c'est شروع کنید)
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: در فرانسوی برای تاریخ عدد اصلی به کار می‌رود، پس «پانزدهم» می‌شود quinze.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson03.choose.001
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quand یعنی «کِی»؛ donc یعنی «پس» و نتیجه را به حرف قبلی وصل می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson03.listen.002
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Séance یعنی «جلسه»، مثلاً جلسهٔ کارگاه یا سانس فیلم.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson03.match.003
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '*Séance*، *idée* و *occasion* اسم‌های مؤنث‌اند؛ *temps* مذکر است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson03.order.004
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: word_order
  frame:
    text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'بعد از avoir le temps de فعل به شکل مصدر می‌ماند: préparer.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson03.fill.005
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: fill_in_blank
  frame:
    text: C'est {item}, la dernière séance de l'atelier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'est quand ... ? راه غیررسمی پرسیدن زمان یک اتفاق است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-fr.fr.a1.unit08.lesson03.translate.006
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: translation
  frame:
    text: فکر خوبیه!
    language_code: fa
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonne {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Idée مؤنث است، برای همین صفت bonne می‌شود، نه bon.
    language_code: fa
    direction: rtl
