schema_version: "1.0"
pack_key: practice.en-ru.a1.unit21
source_language: en
target_language: ru
unit_content_key: ru.a1.unit21.clothing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_куртка", "w_нужна", "w_платье", "w_размер", "w_рубашка", "w_синяя", "w_средний"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adjective", "noun"], agreement_tags: {semantic: ["w_нужна", "w_куртка", "w_рубашка", "w_платье"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_нужна"}}
  p3: &p3 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_куртка", "w_рубашка"]}}
  p4: &p4 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_платье"}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_рубашка"}}
  p6: &p6 {language_code: "ru", part_of_speech: ["adjective", "noun"], agreement_tags: {semantic: ["w_размер", "w_средний", "w_синяя"]}}
  p7: &p7 {language_code: "ru", part_of_speech: ["adjective", "noun"], agreement_tags: {semantic: ["w_нужна", "w_куртка", "w_рубашка", "w_платье", "w_размер", "w_синяя"]}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_размер"}}
  p9: &p9 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_синяя"}}
  p10: &p10 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_куртка", "w_рубашка", "w_платье", "w_размер"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.choose.001
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Нужна is the feminine needed and agrees with feminine items like куртка.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.order.002
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: word_order
    frame: {text: "Мне {item} куртка.", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item} куртка.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Мне нужна plus a feminine noun says I need it; the noun is the subject.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.order.003
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: word_order
    frame: {text: "Мне нужна {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне нужна {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Куртка and рубашка are feminine, so both go with нужна.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.fill.004
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: fill_in_blank
    frame: {text: "Мне {item} куртка. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Нужна agrees with the feminine noun, and мне is the person who needs.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.fill.005
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: fill_in_blank
    frame: {text: "Это {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Платье is neuter and never changes its ending.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.translate.006
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: translation
    frame: {text: "I need a jacket.", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item} куртка.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Russian says to me a jacket is needed rather than I need a jacket.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.translate.007
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: translation
    frame: {text: "I need a shirt.", language_code: "en", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне нужна {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Рубашка is feminine, matching нужна.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.translate.008
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: translation
    frame: {text: "This is a dress.", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Это {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Это introduces a thing and needs no word for a.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.choose.001
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Размер is masculine, so it takes средний; синяя is feminine and goes with рубашка.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.match.002
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p7, second: *p7, third: *p7, fourth: *p7, fifth: *p7, sixth: *p7}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Adjectives like синяя and нужна change their ending to match the gender of the noun.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.order.003
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: word_order
    frame: {text: "Какой {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Какой {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Какой is masculine and agrees with размер.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.order.004
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: word_order
    frame: {text: "У вас есть {item} рубашка?", language_code: "ru", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "render_frame", frame: {text: "У вас есть {item} рубашка?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Синяя ends in -ая to match feminine рубашка.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.fill.005
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: fill_in_blank
    frame: {text: "Какой {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Какой, masculine, agrees with размер.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.fill.006
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: fill_in_blank
    frame: {text: "У вас есть {item} рубашка? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Рубашка is feminine, so the adjective ends in -ая.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.translate.007
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: translation
    frame: {text: "Medium size, please.", language_code: "en", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Средний {item}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Средний is masculine and matches размер.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.translate.008
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: translation
    frame: {text: "Do you have a blue shirt? (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "render_frame", frame: {text: "У вас есть {item} рубашка?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "У вас есть is the polite way to ask a shop assistant.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson02.translate.009
    lesson_content_key: ru.a1.unit21.lesson02.razmer_i_tsvet
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Adjectives show gender: средний is masculine, синяя is feminine.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit21.lesson01.listen.009
    lesson_content_key: ru.a1.unit21.lesson01.mne_nuzhna_kurtka
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Куртка and рубашка are feminine, платье is neuter and размер is masculine.", language_code: "en", direction: "ltr"}
