schema_version: "1.0"
pack_key: practice.en-ru.a1.unit15
source_language: en
target_language: ru
unit_content_key: ru.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_больше", "w_дом", "w_кафе", "w_лучше", "w_меньше", "w_то", "w_тот", "w_хуже", "w_чем"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adverb", "particle"], agreement_tags: {semantic: ["w_лучше", "w_хуже", "w_чем"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_лучше"}}
  p3: &p3 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_хуже"}}
  p4: &p4 {language_code: "ru", part_of_speech: ["adverb", "noun", "pronoun"], agreement_tags: {semantic: ["w_больше", "w_меньше", "w_кафе", "w_дом", "w_то", "w_тот"]}}
  p5: &p5 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_больше"}}
  p6: &p6 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_меньше"}}
  p7: &p7 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_тот"}}
  p8: &p8 {language_code: "ru", part_of_speech: ["adverb", "noun"], agreement_tags: {semantic: ["w_кафе", "w_дом", "w_больше", "w_меньше"]}}
  p9: &p9 {language_code: "ru", part_of_speech: ["adverb", "noun"], agreement_tags: {semantic: ["w_больше", "w_меньше", "w_кафе", "w_дом"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit15.lesson01.choose.001
    lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Лучше is better and хуже is worse; чем means than and follows the comparative after a comma.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson01.order.002
    lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
    type: word_order
    frame: {text: "Кофе {item}, чем чай.", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Кофе {item}, чем чай.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Russian puts a comma before чем, than, in a comparison.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson01.fill.003
    lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
    type: fill_in_blank
    frame: {text: "Чай {item}, чем кофе. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Хуже is the opposite of лучше; чем then introduces the thing compared.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson01.translate.004
    lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
    type: translation
    frame: {text: "Coffee is better than tea.", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Кофе {item}, чем чай.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Russian leaves out is: Кофе лучше simply sets the two things side by side.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson01.translate.005
    lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
    type: translation
    frame: {text: "Tea is worse than coffee.", language_code: "en", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "Чай {item}, чем кофе.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Чем always follows the comparative word and a comma.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson01.translate.006
    lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "These three words build every simple comparison: лучше, хуже and чем.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.choose.001
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "То is the neuter that, matching кафе, and тот is the masculine that, matching дом.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.match.002
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p4, second: *p4, third: *p4, fourth: *p4, fifth: *p4, sixth: *p4}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Больше means bigger or more and меньше means smaller or less; то and тот both mean that but agree with different genders.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.order.003
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: word_order
    frame: {text: "Это кафе {item}, чем то.", language_code: "ru", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Это кафе {item}, чем то.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Кафе is neuter and never changes, so it takes это and то.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.order.004
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: word_order
    frame: {text: "Тот дом {item}, чем этот.", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "render_frame", frame: {text: "Тот дом {item}, чем этот.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Дом is masculine, so it goes with тот and этот.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.fill.005
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: fill_in_blank
    frame: {text: "То кафе {item}, чем это. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Меньше is the opposite of больше.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.fill.006
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: fill_in_blank
    frame: {text: "Этот дом больше, чем {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Тот is the masculine that and matches дом; the neuter то would match кафе.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.translate.007
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: translation
    frame: {text: "This cafe is bigger than that one.", language_code: "en", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Это кафе {item}, чем то.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Больше can mean bigger or more depending on context.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.translate.008
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: translation
    frame: {text: "That house is smaller than this one.", language_code: "en", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "render_frame", frame: {text: "Тот дом {item}, чем этот.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Тот and этот are masculine, agreeing with дом.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.translate.009
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Кафе is neuter and does not change; дом is masculine.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit15.lesson02.listen.010
    lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Больше and меньше are opposites, and both can also mean more or less.", language_code: "en", direction: "ltr"}
