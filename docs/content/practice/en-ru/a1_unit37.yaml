schema_version: '1.0'
pack_key: practice.en-ru.a1.unit37
source_language: en
target_language: ru
unit_content_key: ru.a1.unit37.personality
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u37 / w_<token>). 15 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_вещи, w_добрая, w_знаете, w_курсы, w_любопытный, w_медсестрой, w_немного, w_новенькая, w_разные, w_рассказывает, w_смешной, w_спокойный, w_спрашивает, w_стеснительный, w_терпеливый]
templates:
- content_key: practice.en-ru.ru.a1.unit37.lesson01.choose.001
  lesson_content_key: ru.a1.unit37.lesson01.dobryy_i_smeshnoy
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_добрая, w_смешной, w_спокойный, w_терпеливый, w_любопытный, w_стеснительный, w_немного, w_знаете, w_медсестрой, w_курсы, w_новенькая, w_спрашивает, w_рассказывает, w_вещи, w_разные]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on kind and funny.', language_code: en, direction: ltr}
