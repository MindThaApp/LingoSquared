schema_version: "1.0"
pack_key: practice.en-ru.a1.unit12
source_language: en
target_language: ru
unit_content_key: ru.a1.unit12.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items so no bare-word prompt has two defensible answers. English prompts name ты/вы and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the ты/вы labels in the English prompts and the case notes in feedback. No character facts are asserted (character names appear only as bare vocabulary items).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Дима", "w_Настя", "w_встретимся", "w_давай", "w_кино", "w_кинотеатра", "w_могу", "w_мы", "w_не", "w_отлично", "w_пойдём", "w_согласен", "w_сожалению", "w_субботу", "w_субботы"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adverb", "noun", "verb"], agreement_tags: {semantic: ["w_давай", "w_пойдём", "w_кино", "w_субботу", "w_отлично"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_кино"}}
  p3: &p3 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_пойдём"}}
  p4: &p4 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_субботу"}}
  p5: &p5 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_давай", "w_пойдём", "w_кино"]}}
  p6: &p6 {language_code: "ru", part_of_speech: ["adjective", "particle", "pronoun", "verb"], agreement_tags: {semantic: ["w_согласен", "w_могу", "w_мы", "w_встретимся", "w_не"]}}
  p7: &p7 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_сожалению"}}
  p8: &p8 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_встретимся"}}
  p9: &p9 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_могу"}}
  p10: &p10 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_согласен"}}
  p11: &p11 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_мы"}}
  p12: &p12 {language_code: "ru", part_of_speech: ["adverb", "noun", "proper_noun"], agreement_tags: {semantic: ["w_Настя", "w_Дима", "w_кино", "w_субботу", "w_отлично"]}}
  p13: &p13 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_кинотеатра"}}
  p14: &p14 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_субботы"}}
  p15: &p15 {language_code: "ru", part_of_speech: ["adverb", "proper_noun"], agreement_tags: {semantic: ["w_Настя", "w_Дима", "w_отлично"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit12.lesson01.choose.001
    lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Давай is the informal ты way to suggest an activity; with вы it would be давайте.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson01.order.002
    lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
    type: word_order
    frame: {text: "Давай пойдём в {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Давай пойдём в {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Кино never changes its ending, so it stays кино after в.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson01.fill.003
    lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
    type: fill_in_blank
    frame: {text: "Давай {item} в кино. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Давай plus пойдём suggests a plan: Let's go.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson01.translate.004
    lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
    type: translation
    frame: {text: "Let's go to the movies tomorrow. (informal)", language_code: "en", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "Давай {item} в кино завтра.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Давай пойдём is the friendly ты invitation, Let's go.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson01.translate.005
    lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
    type: translation
    frame: {text: "Let's go to the movies on Saturday. (informal)", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Давай пойдём в кино в {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "For on with a weekday Russian uses в plus the accusative: суббота becomes субботу.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson01.translate.006
    lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p5}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Кино never changes, and давай is the informal let's.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson02.choose.001
    lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Согласен ends in a consonant because the speaker is a man; a woman says согласна.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson02.fill.002
    lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
    type: fill_in_blank
    frame: {text: "К {item}, я не могу. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "К сожалению is the standard unfortunately.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson02.fill.003
    lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
    type: fill_in_blank
    frame: {text: "Во сколько мы {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Встретимся is the we form, so it goes with мы: мы встретимся.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson02.order.004
    lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
    type: word_order
    frame: {text: "К сожалению, я не {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "render_frame", frame: {text: "К сожалению, я не {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Не negates the verb, and могу is the я form meaning I can.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson02.translate.005
    lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
    type: translation
    frame: {text: "Okay, I agree. (said by a man)", language_code: "en", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "Хорошо, я {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Согласен is the masculine form; a woman would say согласна.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson02.translate.006
    lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
    type: translation
    frame: {text: "What time will we meet?", language_code: "en", direction: "ltr"}
    slots: {a: *p11, b: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Во сколько {a} {b}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Во сколько literally asks at how much, meaning at what time.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson03.listen.001
    lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Russian first names have short, friendly forms such as Настя and Дима, used between friends.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson03.order.002
    lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
    type: word_order
    frame: {text: "Давай в семь часов, у {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "Давай в семь часов, у {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "У means at or near and takes the genitive: кинотеатр becomes кинотеатра.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson03.fill.003
    lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
    type: fill_in_blank
    frame: {text: "Отлично, до {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "До means until and takes the genitive, so суббота becomes субботы.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson03.translate.004
    lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
    type: translation
    frame: {text: "Great, see you on Saturday.", language_code: "en", direction: "ltr"}
    slots: {item: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "Отлично, до {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "До субботы literally means until Saturday and is the friendly way to say see you then.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson03.translate.005
    lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
    type: translation
    frame: {text: "Let's say seven o'clock, at the movie theater. (informal)", language_code: "en", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "Давай в семь часов, у {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Давай в семь часов proposes a time; у кинотеатра adds the place.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit12.lesson03.translate.006
    lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p15}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Отлично is an adverb meaning great and does not change for gender or number.", language_code: "en", direction: "ltr"}
