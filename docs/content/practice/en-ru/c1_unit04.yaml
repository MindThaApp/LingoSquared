  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on presenting the counterargument.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson04.match.001
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson04.vzveshivayu_soobrazheniya
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson05.choose.001
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson05.chitayu_vzveshennyj_argument
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a balanced argument.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson06.translate.001
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson06.polnyj_kontrargument
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the complete counterargument.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson01.order.002
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson01.priznayu_silnuyu_storonu
  type: word_order
  frame: {text: 'Признаю, что {item} свою школу рискованно.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_открыть}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Признаю, что {item} свою школу рискованно.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I admit that opening my own school is risky. Признаю, что (''I admit that'') concedes the other side''s strongest valid point before arguing back. Открыть свою школу = ''to open my own school''; рискованно = ''risky''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson01.fill.003
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson01.priznayu_silnuyu_storonu
  type: fill_in_blank
  frame:
    text: Тем не менее оставаться на месте тоже {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_рискованно}
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_рискованно}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Nevertheless, staying in place is also risky. Тем не менее (''nevertheless'') pivots from concession to counterargument. Оставаться на месте = ''to stay in place''; тоже = ''also''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson01.translate.004
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson01.priznayu_silnuyu_storonu
  type: translation
  frame: {text: 'Indeed, this decision has its drawbacks.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_решения}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Действительно, у этого {item} есть минусы.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Indeed, this decision has its drawbacks. Действительно (''indeed'') strengthens a concession — it signals that the speaker genuinely accepts the point. Минусы = ''drawbacks''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson02.order.002
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson02.ogranichivayu_obyom
  type: word_order
  frame: {text: 'Однако {item} оправдан, когда есть чёткий план.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_риск}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Однако {item} оправдан, когда есть чёткий план.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'However, the risk is justified when there is a clear plan. Однако (''however'') introduces a qualification that narrows the conceded point. Риск оправдан = ''the risk is justified''; чёткий план = ''a clear plan''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson02.fill.003
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson02.ogranichivayu_obyom
  type: fill_in_blank
  frame:
    text: Это {item} лишь одного случая. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_касается}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_касается}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: This concerns only one case. Касается лишь ('concerns only') limits the scope of a conceded point. Лишь narrows it further., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson02.translate.004
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson02.ogranichivayu_obyom
  type: translation
  frame: {text: 'At the same time, this does not cancel my arguments.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_отменяет}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Вместе с тем, это не {item} моих доводов.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'At the same time, this does not cancel my arguments. Вместе с тем (''at the same time'') qualifies without rejecting — it adds a limit to a point the speaker has partly granted. Доводы = ''arguments''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson03.order.002
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson03.privozhu_kontrargument
  type: word_order
  frame: {text: 'Тем не {item} оставаться на месте тоже рискованно.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_менее}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Тем не {item} оставаться на месте тоже рискованно.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Nevertheless, staying in place is also risky. Тем не менее (''nevertheless'') pivots from concession to counterargument. Оставаться на месте = ''to stay in place''; тоже = ''also''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson03.fill.003
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson03.privozhu_kontrargument
  type: fill_in_blank
  frame:
    text: Несмотря на это, решение {item} в силе. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_остаётся}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_остаётся}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Despite this, the decision still stands. Несмотря на это (''despite this'') concedes a point and immediately moves past it. Остаётся в силе = ''still stands''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson03.translate.004
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson03.privozhu_kontrargument
  type: translation
  frame: {text: 'On the other hand, freedom matters more.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_другой}
  answer_derivation:
    kind: render_frame
    frame: {text: 'С {item} стороны, свобода важнее.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'On the other hand, freedom matters more. С другой стороны (''on the other hand'') introduces the competing consideration. Важнее = ''matters more''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson04.order.002
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson04.vzveshivayu_soobrazheniya
  type: word_order
  frame: {text: 'С {item} стороны, стабильность важна.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_одной}
  answer_derivation:
    kind: render_frame
    frame: {text: 'С {item} стороны, стабильность важна.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'On the one hand, stability matters. С одной стороны (''on the one hand'') opens the weighing of competing considerations. Стабильность = ''stability''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson04.fill.003
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson04.vzveshivayu_soobrazheniya
  type: fill_in_blank
  frame:
    text: Свобода перевешивает {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_стабильность}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_стабильность}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Freedom outweighs stability. Перевешивает ('outweighs') states which consideration wins after weighing. Свобода = 'freedom'., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson04.translate.004
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson04.vzveshivayu_soobrazheniya
  type: translation
  frame: {text: 'In the end, if you weigh all the pros and cons, freedom outweighs stability.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_перевешивает}
  answer_derivation:
    kind: render_frame
    frame: {text: 'В итоге, если взвесить все за и против, свобода {item} стабильность.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'In the end, if you weigh all the pros and cons, freedom outweighs stability. В итоге (''in the end'') introduces the conclusion of the weighing. Если = ''if''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson05.order.002
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson05.chitayu_vzveshennyj_argument
  type: word_order
  frame: {text: 'Это {item} аргумент, а не эмоция.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_взвешенный}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это {item} аргумент, а не эмоция.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'This is a balanced argument, not emotion. взвешенный means balanced; well-considered (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit04.lesson06.order.002
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson06.polnyj_kontrargument
  type: word_order
  frame: {text: 'Это не возражение, а {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_контраргумент}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это не возражение, а {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: This is not an objection but a counterargument. контраргумент means counterargument., language_code: en, direction: ltr}
