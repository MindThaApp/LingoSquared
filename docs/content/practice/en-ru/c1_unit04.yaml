review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u4 / w_<token>). 36 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_аргумент, w_важна, w_важнее, w_взвесить, w_взвешенный, w_вместе, w_действительно, w_доводов, w_другой, w_замечание, w_касается, w_когда, w_контраргумент, w_менее, w_месте, w_минусы, w_одной, w_оправдан, w_оставаться, w_остаётся, w_открыть, w_отменяет, w_перевешивает, w_план, w_признаю, w_решения, w_риск, w_рискованно, w_свобода, w_силе, w_случая, w_справедливое, w_стабильность, w_стороны, w_чёткий, w_школу]
templates:
- content_key: practice.en-ru.ru.c1.unit04.lesson01.choose.001
  lesson_content_key: ru.c1.unit04.ustupka_i_kontrargument.lesson01.priznayu_silnuyu_storonu
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_признаю, w_открыть, w_школу, w_рискованно, w_действительно, w_решения, w_минусы, w_справедливое, w_замечание, w_риск, w_оправдан, w_когда, w_чёткий, w_план, w_касается, w_случая, w_вместе, w_отменяет, w_доводов, w_менее, w_оставаться, w_месте, w_остаётся, w_силе, w_другой, w_стороны, w_свобода, w_важнее, w_одной, w_стабильность, w_важна, w_перевешивает, w_взвесить, w_взвешенный, w_аргумент, w_контраргумент]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on conceding the strong point.', language_code: en, direction: ltr}
