schema_version: '1.0'
pack_key: practice.en-ru.a1.unit52
source_language: en
target_language: ru
unit_content_key: ru.a1.unit52.park
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u52 / w_<token>). 19 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_воде, w_дерево, w_зелёная, w_пикник, w_плавают, w_поводке, w_прогулка, w_рынке, w_скамейка, w_собаки, w_солнечный, w_сядем, w_табличка, w_трава, w_устроим, w_утка, w_утки, w_фрукты, w_холодная]
templates:
- content_key: practice.en-ru.ru.a1.unit52.lesson01.choose.001
  lesson_content_key: ru.a1.unit52.lesson01.poydyom_v_park
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_прогулка, w_дерево, w_трава, w_зелёная, w_утка, w_воде, w_холодная, w_утки, w_плавают, w_табличка, w_солнечный, w_собаки, w_поводке, w_устроим, w_пикник, w_фрукты, w_сядем, w_скамейка, w_рынке]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the park?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson02.listen.001
  lesson_content_key: ru.a1.unit52.lesson02.derevya_i_trava
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the trees and the grass.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson03.translate.001
  lesson_content_key: ru.a1.unit52.lesson03.utki_u_vody
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the ducks by the water.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson04.match.001
  lesson_content_key: ru.a1.unit52.lesson04.tablichka_u_vkhoda
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson05.choose.001
  lesson_content_key: ru.a1.unit52.lesson05.piknik_v_parke
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a picnic in the park.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson06.translate.001
  lesson_content_key: ru.a1.unit52.lesson06.dima_nina_i_nastya
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on dima, nina, and nastya after the park.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson02.order.002
  lesson_content_key: ru.a1.unit52.lesson02.derevya_i_trava
  type: word_order
  frame: {text: 'Я вижу большое {item} и зелёную траву.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_дерево}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я вижу большое {item} и зелёную траву.', language_code: ru, direction: ltr}
  feedback_frame: {text: I see a big tree and green grass. дерево means tree., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson03.order.002
  lesson_content_key: ru.a1.unit52.lesson03.utki_u_vody
  type: word_order
  frame: {text: 'Утка плавает в {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_воде}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Утка плавает в {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: The duck swims in the water. воде means water (after the word for 'in')., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson03.fill.003
  lesson_content_key: ru.a1.unit52.lesson03.utki_u_vody
  type: fill_in_blank
  frame:
    text: Смотри, {item} плавают в воде! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_утки}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_утки}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Look, the ducks are swimming in the water! утки means ducks.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson05.order.002
  lesson_content_key: ru.a1.unit52.lesson05.piknik_v_parke
  type: word_order
  frame: {text: 'Я покупаю {item} на рынке.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_фрукты}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я покупаю {item} на рынке.', language_code: ru, direction: ltr}
  feedback_frame: {text: I buy fruit at the market. фрукты means fruit., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson05.fill.003
  lesson_content_key: ru.a1.unit52.lesson05.piknik_v_parke
  type: fill_in_blank
  frame:
    text: Вон {item}, под деревом. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_скамейка}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_скамейка}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'There''s a bench, under the tree. скамейка means bench.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit52.lesson06.order.002
  lesson_content_key: ru.a1.unit52.lesson06.dima_nina_i_nastya
  type: word_order
  frame: {text: 'Я покупаю фрукты на {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_рынке}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я покупаю фрукты на {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I buy fruit at the market. рынке means market, after the word for ''at'' or ''on''.', language_code: en, direction: ltr}
