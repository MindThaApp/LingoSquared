schema_version: "1.0"
pack_key: practice.en-ru.b1.unit47
source_language: en
target_language: ru
unit_content_key: ru.b1.unit47.sozhalenija
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-ru B1 set) from scripts/backfill_lexemes_en_ru.py (en-ru-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Topic: regrets about the past. Sentence translations accept free word order, dropped subject pronouns where natural, aspect or synonym pairs, the feminine speaker forms, and the е spelling of ё. Reviewer: confirm the variants with 'нужно было' for 'надо было' and the feminine forms (взяла, промокла).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_взял", "w_зонт", "w_теперь", "w_весь", "w_мокрый", "w_надо", "w_взять", "w_сожаление", "w_промок"]
slot_presets:
  p1: &p1 {language_code: ru, part_of_speech: ["noun", "pronoun", "verb", "adjective", "adverb"], agreement_tags: {semantic: ["w_взял", "w_зонт", "w_теперь", "w_весь", "w_мокрый", "w_надо", "w_взять", "w_сожаление", "w_промок"]}}
  p2: &p2 {language_code: ru, part_of_speech: ["noun", "pronoun", "verb", "adjective", "adverb"], agreement_tags: {semantic: ["w_взял", "w_зонт", "w_теперь", "w_весь", "w_мокрый", "w_надо", "w_взять", "w_сожаление"]}}
  p3: &p3 {language_code: ru, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_мокрый"]}}
  p4: &p4 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_взять"]}}
  p5: &p5 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_взял"]}}
  p6: &p6 {language_code: ru, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_надо"]}}
  p7: &p7 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_промок"]}}
  p8: &p8 {language_code: ru, part_of_speech: ["pronoun"], agreement_tags: {semantic: ["w_весь"]}}
  p9: &p9 {language_code: ru, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_теперь"]}}
  p10: &p10 {language_code: ru, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_зонт"]}}
templates:
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.choose.001
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on regrets about the past.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.listen.001
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: listen_select
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.translate.001
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.choose.002
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from lesson 1 of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.translate.002
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words from lesson 1.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.match.001
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ru, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the words of the unit on regrets about the past.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.match.002
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ru, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the words of lesson 1.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.translate.003
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: translation
    frame: {text: "I didn't take an umbrella, and now I'm all wet.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Я не взял зонт, и теперь я весь {item}.", language_code: ru, direction: ltr}, accepted_variants: ["Я не взял зонт, и теперь я {item} весь.", "Я не взял зонт, и теперь весь {item}.", "Я не взяла зонт, и теперь я вся мокрая.", "Я не взяла зонт, и теперь я вся {item}.", "Я не взяла зонт, и теперь я {item} вся.", "Я не взяла зонт, и теперь вся {item}."]}
    feedback_frame: {text: "Мокрый is masculine; a woman says мокрая.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.translate.004
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: translation
    frame: {text: "I should have taken an umbrella.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Мне надо было {item} зонт.", language_code: ru, direction: ltr}, accepted_variants: ["Мне нужно было {item} зонт."]}
    feedback_frame: {text: "Надо было plus an infinitive expresses regret.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.fill.001
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: fill_in_blank
    frame: {text: "Я не {item} зонт, и теперь я весь мокрый. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item, accepted_variants: ["взяла"]}
    feedback_frame: {text: "Взял is the perfective past, a completed event.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.order.001
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: word_order
    frame: {text: "Мне {item} было взять зонт.", language_code: ru, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Мне {item} было взять зонт.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Надо было plus an infinitive expresses regret.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson02.translate.001
    lesson_content_key: ru.b1.unit47.lesson02.zhal_chto_ne
    type: translation
    frame: {text: "Yes, it's a pity you didn't take an umbrella.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Да, жаль, что ты не {item} зонт.", language_code: ru, direction: ltr}, accepted_variants: ["Да, жаль, что ты зонт не {item}.", "Да, жаль, что ты не взяла зонт.", "Да, жаль, что ты зонт не взяла."]}
    feedback_frame: {text: "Жаль, что plus a negated past verb expresses regret.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson02.translate.002
    lesson_content_key: ru.b1.unit47.lesson02.zhal_chto_ne
    type: translation
    frame: {text: "If you had taken an umbrella, you wouldn't have gotten wet.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Если бы ты взял зонт, ты бы не {item}.", language_code: ru, direction: ltr}, accepted_variants: ["Если бы ты взял зонт, ты не {item} бы.", "Ты бы не {item}, если бы взял зонт.", "Если бы ты взяла зонт, ты бы не промокла."]}
    feedback_frame: {text: "Бы plus the past tense gives an unreal past condition.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson03.fill.001
    lesson_content_key: ru.b1.unit47.lesson03.mokryi_dima
    type: fill_in_blank
    frame: {text: "Дима, ты {item} мокрый! ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Весь agrees with the masculine ты here.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.fill.002
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: fill_in_blank
    frame: {text: "Я не взял зонт, и {item} я весь мокрый. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Теперь means now.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit47.lesson01.order.002
    lesson_content_key: ru.b1.unit47.lesson01.nado_bylo
    type: word_order
    frame: {text: "Мне надо было взять {item}.", language_code: ru, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Мне надо было взять {item}.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Зонт is the object of взять.", language_code: en, direction: ltr}
