schema_version: '1.0'
pack_key: practice.en-ru.a1.unit55
source_language: en
target_language: ru
unit_content_key: ru.a1.unit55.zoo
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u55 / w_<token>). 15 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_билета, w_вольера, w_животные, w_жираф, w_зоопарке, w_катере, w_кормление, w_лев, w_львов, w_маленькая, w_обезьяна, w_покатаемся, w_прогулки, w_слон, w_тяжёлый]
templates:
- content_key: practice.en-ru.ru.a1.unit55.lesson01.choose.001
  lesson_content_key: ru.a1.unit55.lesson01.poydyom_v_zoopark
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_животные, w_лев, w_слон, w_тяжёлый, w_обезьяна, w_маленькая, w_жираф, w_кормление, w_львов, w_билета, w_вольера, w_катере, w_прогулки, w_зоопарке, w_покатаемся]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the zoo?.', language_code: en, direction: ltr}
