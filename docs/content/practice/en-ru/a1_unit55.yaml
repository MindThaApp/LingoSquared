  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the monkey and the giraffe.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit55.lesson04.match.001
  lesson_content_key: ru.a1.unit55.lesson04.tablichka_v_zooparke
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
