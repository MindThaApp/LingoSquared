schema_version: "1.0"
pack_key: practice.en-ru.b1.unit37
source_language: en
target_language: ru
unit_content_key: ru.b1.unit37.gipotezy
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-ru B1 set) from scripts/backfill_lexemes_en_ru.py (en-ru-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Topic: real and unreal conditions with if. Sentence translations accept free word order, dropped subject pronouns where natural, aspect or synonym pairs, the feminine speaker forms, and the е spelling of ё. Reviewer: confirm the 'буду делать' aspect variant for 'What will you do' and the clause-order variants of the conditional sentences; женские формы (проверила, попросила) are accepted as variants.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_будет", "w_проверю", "w_отправлю", "w_сделаешь", "w_проверил", "w_времени", "w_попросил", "w_и", "w_тебя"]
slot_presets:
  p1: &p1 {language_code: ru, part_of_speech: ["noun", "pronoun", "verb", "particle"], agreement_tags: {semantic: ["w_будет", "w_проверю", "w_отправлю", "w_сделаешь", "w_проверил", "w_времени", "w_попросил", "w_и", "w_тебя"]}}
  p2: &p2 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_будет", "w_проверю", "w_отправлю", "w_сделаешь"]}}
  p3: &p3 {language_code: ru, part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_проверил", "w_времени", "w_попросил"]}}
  p4: &p4 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_будет"]}}
  p5: &p5 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_проверю"]}}
  p6: &p6 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_отправлю"]}}
  p7: &p7 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_сделаешь"]}}
  p8: &p8 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_проверил"]}}
  p9: &p9 {language_code: ru, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_времени"]}}
  p10: &p10 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_попросил"]}}
  p11: &p11 {language_code: ru, part_of_speech: ["pronoun"], agreement_tags: {semantic: ["w_тебя"]}}
templates:
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.choose.001
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on real and unreal conditions with if.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.listen.001
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: listen_select
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.translate.001
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.choose.002
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from lesson 1 of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.translate.002
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words from lesson 1.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson02.choose.001
    lesson_content_key: ru.b1.unit37.lesson02.esli_by
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from lesson 2 of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson02.listen.001
    lesson_content_key: ru.b1.unit37.lesson02.esli_by
    type: listen_select
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from lesson 2 of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson02.translate.001
    lesson_content_key: ru.b1.unit37.lesson02.esli_by
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words from lesson 2.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.match.001
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ru, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the words of the unit on real and unreal conditions with if.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.translate.003
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: translation
    frame: {text: "If there is time, I will check the address.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Если {item} время, я проверю адрес.", language_code: ru, direction: ltr}, accepted_variants: ["Если время {item}, я проверю адрес.", "Я проверю адрес, если {item} время."]}
    feedback_frame: {text: "Если будет uses the future after if.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.fill.001
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: fill_in_blank
    frame: {text: "Если будет время, я {item} адрес. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Проверю is the future of проверить, I will check.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.order.001
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: word_order
    frame: {text: "Если будет время, я {item} форму.", language_code: ru, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Если будет время, я {item} форму.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Отправлю is the future, I will send.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson01.translate.004
    lesson_content_key: ru.b1.unit37.lesson01.esli_budet
    type: translation
    frame: {text: "What will you do if there is time?", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Что ты {item}, если будет время?", language_code: ru, direction: ltr}, accepted_variants: ["Что ты будешь делать, если будет время?", "Если будет время, что ты {item}?"]}
    feedback_frame: {text: "Сделаешь is the future you will do.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson02.translate.002
    lesson_content_key: ru.b1.unit37.lesson02.esli_by
    type: translation
    frame: {text: "If there were time, I would check the address.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Если бы было время, я {item} бы адрес.", language_code: ru, direction: ltr}, accepted_variants: ["Если бы было время, я бы {item} адрес.", "Я {item} бы адрес, если бы было время.", "Если бы было время, я проверила бы адрес.", "Если бы было время, я бы проверила адрес.", "Я проверила бы адрес, если бы было время."]}
    feedback_frame: {text: "Бы plus the past form makes the verb hypothetical.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson02.fill.001
    lesson_content_key: ru.b1.unit37.lesson02.esli_by
    type: fill_in_blank
    frame: {text: "Если бы {item} не было, я попросил бы Настю. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "После не было the noun is in the genitive: времени.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson02.order.001
    lesson_content_key: ru.b1.unit37.lesson02.esli_by
    type: word_order
    frame: {text: "Если бы времени не было, я {item} бы Настю.", language_code: ru, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Если бы времени не было, я {item} бы Настю.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Попросил бы means I would ask.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit37.lesson03.translate.001
    lesson_content_key: ru.b1.unit37.lesson03.dialogue_conditions
    type: translation
    frame: {text: "If there were no time, I would ask you to check the address.", language_code: en, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Если бы времени не было, я попросил бы {item} проверить адрес.", language_code: ru, direction: ltr}, accepted_variants: ["Если бы времени не было, я бы попросил {item} проверить адрес.", "Если бы не было времени, я попросил бы {item} проверить адрес.", "Если бы времени не было, я попросила бы {item} проверить адрес.", "Если бы времени не было, я бы попросила {item} проверить адрес.", "Если бы не было времени, я попросила бы {item} проверить адрес."]}
    feedback_frame: {text: "Просить takes the accusative of the person: тебя.", language_code: en, direction: ltr}
