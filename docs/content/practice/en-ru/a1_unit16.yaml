schema_version: "1.0"
pack_key: practice.en-ru.a1.unit16
source_language: en
target_language: ru
unit_content_key: ru.a1.unit16.health
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_болит", "w_воды", "w_голова", "w_горло", "w_ещё", "w_живот", "w_много", "w_нужно", "w_отдыхать", "w_плохо", "w_простуда", "w_температура"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_болит", "w_голова", "w_живот", "w_горло"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_голова", "w_живот", "w_горло"]}}
  p3: &p3 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_голова"}}
  p4: &p4 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_живот"}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_горло"}}
  p6: &p6 {language_code: "ru", part_of_speech: ["adjective", "noun"], agreement_tags: {semantic: ["w_температура", "w_простуда", "w_плохо"]}}
  p7: &p7 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_плохо"}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_температура"}}
  p9: &p9 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_простуда"}}
  p10: &p10 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_температура", "w_простуда"]}}
  p11: &p11 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_болит", "w_голова", "w_живот", "w_горло", "w_температура", "w_простуда"]}}
  p12: &p12 {language_code: "ru", part_of_speech: ["adjective", "adverb", "noun", "verb"], agreement_tags: {semantic: ["w_ещё", "w_нужно", "w_отдыхать", "w_много", "w_воды"]}}
  p13: &p13 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_отдыхать"}}
  p14: &p14 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_ещё"}}
  p15: &p15 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_нужно"}}
  p16: &p16 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_много"}}
  p17: &p17 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_воды"}}
templates:
  - content_key: practice.en-ru.ru.a1.unit16.lesson01.choose.001
    lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "У меня болит plus a body part says that part hurts; the thing that hurts is the subject of болит.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson01.order.002
    lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
    type: word_order
    frame: {text: "У меня болит {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня болит {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Болит stays the same whether the body part is feminine, masculine or neuter.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson01.fill.003
    lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
    type: fill_in_blank
    frame: {text: "У меня болит {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Russian says at me hurts head rather than I have a headache.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson01.translate.004
    lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
    type: translation
    frame: {text: "My stomach hurts.", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня болит {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Живот is masculine, but болит does not change.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson01.translate.005
    lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
    type: translation
    frame: {text: "My throat hurts.", language_code: "en", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня болит {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "У меня plus болит is the everyday way to describe a symptom.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.choose.001
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Мне плохо is a general I feel unwell, with мне meaning to me.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.order.002
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: word_order
    frame: {text: "Мне {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Мне плохо says how you feel, using to me instead of I.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.fill.003
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: fill_in_blank
    frame: {text: "У меня {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "У меня plus температура means I have a fever.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.translate.004
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: translation
    frame: {text: "I have a cold.", language_code: "en", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "У меня plus a noun also works for illnesses, as in У меня простуда.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.translate.005
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: translation
    frame: {text: "I feel unwell. (use мне)", language_code: "en", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Мне плохо describes how you feel, not a specific pain.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.translate.006
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p10}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Температура can mean temperature or fever, depending on the context.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson02.match.007
    lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p11, second: *p11, third: *p11, fourth: *p11, fifth: *p11, sixth: *p11}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Болит is a verb meaning it hurts; the body parts голова, живот and горло are the things that hurt.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson03.choose.001
    lesson_content_key: ru.a1.unit16.lesson03.u_vracha
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Много воды uses воды, a form of вода after много, meaning a lot of water.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson03.order.002
    lesson_content_key: ru.a1.unit16.lesson03.u_vracha
    type: word_order
    frame: {text: "Вам нужно {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "Вам нужно {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Вам нужно plus an infinitive says you need to do something; вам is the formal you.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson03.fill.003
    lesson_content_key: ru.a1.unit16.lesson03.u_vracha
    type: fill_in_blank
    frame: {text: "Да, и {item} температура. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Ещё adds something extra to what was said before.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson03.fill.004
    lesson_content_key: ru.a1.unit16.lesson03.u_vracha
    type: fill_in_blank
    frame: {text: "Вам {item} отдыхать. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Вам нужно plus an infinitive, you need to, is polite advice from a doctor.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson03.translate.005
    lesson_content_key: ru.a1.unit16.lesson03.u_vracha
    type: translation
    frame: {text: "You need to rest. (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p15}
    answer_derivation: {kind: "render_frame", frame: {text: "Вам {item} отдыхать.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Вам is the formal you, used by a doctor with a patient.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit16.lesson03.translate.006
    lesson_content_key: ru.a1.unit16.lesson03.u_vracha
    type: translation
    frame: {text: "You need to drink a lot of water. (formal)", language_code: "en", direction: "ltr"}
    slots: {a: *p16, b: *p17}
    answer_derivation: {kind: "render_frame", frame: {text: "Вам нужно пить {a} {b}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "After много the noun takes the form воды, a lot of water.", language_code: "en", direction: "ltr"}
