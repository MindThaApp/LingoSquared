schema_version: '1.0'
pack_key: practice.en-ru.c1.unit01
source_language: en
target_language: ru
unit_content_key: ru.c1.unit01.struktura_diskursa
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u1 / w_<token>). 27 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ближе, w_важны, w_вернёмся, w_главному, w_гораздо, w_итоге, w_квартира, w_кстати, w_немного, w_новая, w_объясню, w_отвлекусь, w_переехать, w_почему, w_поэтому, w_правильное, w_причины, w_работе, w_решение, w_решили, w_сейчас, w_смущала, w_сначала, w_структура, w_там, w_тише, w_цена]
templates:
- content_key: practice.en-ru.ru.c1.unit01.lesson01.choose.001
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson01.obyavlyayu_napravlenie
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_сейчас, w_объясню, w_почему, w_решили, w_переехать, w_новая, w_квартира, w_ближе, w_работе, w_там, w_гораздо, w_тише, w_кстати, w_цена, w_сначала, w_смущала, w_немного, w_отвлекусь, w_вернёмся, w_главному, w_причины, w_важны, w_поэтому, w_итоге, w_правильное, w_решение, w_структура]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on announcing your direction.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson02.listen.001
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson02.razvivayu_mysl
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on developing your points.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson03.translate.001
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson03.otstuplenie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the digression.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson04.match.001
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson04.vozvrat_i_vyvod
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson06.choose.001
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson06.vsya_struktura
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the whole contribution.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson01.translate.002
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson01.obyavlyayu_napravlenie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on announcing your direction.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson01.order.003
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson01.obyavlyayu_napravlenie
  type: word_order
  frame: {text: 'Сейчас я {item}, почему мы решили переехать.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_объясню}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Сейчас я {item}, почему мы решили переехать.', language_code: ru, direction: ltr}
  feedback_frame: {text: Now I'll explain why we decided to move. Сейчас я объясню ('now I'll explain') opens a longer contribution by announcing its direction. Почему мы решили переехать = 'why we decided to move'., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson02.order.002
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson02.razvivayu_mysl
  type: word_order
  frame: {text: 'Во-первых, {item} квартира ближе к работе.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_новая}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Во-первых, {item} квартира ближе к работе.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'First, the new apartment is closer to work. Ближе (''closer'') is the comparative of близко. Ближе к работе = ''closer to work''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson02.fill.003
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson02.razvivayu_mysl
  type: fill_in_blank
  frame:
    text: Во-вторых, {item} гораздо тише. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_там}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_там}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Second, it''s much quieter there. Тише (''quieter'') is the comparative of тихо. Гораздо (''much'') strengthens it.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson03.order.002
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson03.otstuplenie
  type: word_order
  frame: {text: 'Кстати, {item} сначала меня смущала.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_цена}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Кстати, {item} сначала меня смущала.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'By the way, the price bothered me at first. Кстати (''by the way'') opens a controlled digression — a relevant side remark the speaker will later step away from. Цена ... меня смущала = ''the price bothered me''; the verb agrees with.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson03.fill.003
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson03.otstuplenie
  type: fill_in_blank
  frame:
    text: Я {item} отвлекусь. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_немного}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_немного}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I will digress a little. Я немного отвлекусь ('I'll digress a little') explicitly announces a digression before stepping off the main line., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson04.order.002
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson04.vozvrat_i_vyvod
  type: word_order
  frame: {text: 'Но {item} к главному.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_вернёмся}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Но {item} к главному.', language_code: ru, direction: ltr}
  feedback_frame: {text: But let's return to the main point. Но вернёмся к главному ('but let's return to the main point') is the explicit return signal that closes the digression., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson04.fill.003
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson04.vozvrat_i_vyvod
  type: fill_in_blank
  frame:
    text: Обе {item} важны, поэтому в итоге это правильное решение. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_причины}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_причины}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Both reasons matter, so in the end this is the right decision. Обе причины важны (''both reasons matter'') pulls the strands together; поэтому в итоге (''so in the end'') introduces the conclusion. Это правильное решение = ''this is.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit01.lesson06.order.002
  lesson_content_key: ru.c1.unit01.struktura_diskursa.lesson06.vsya_struktura
  type: word_order
  frame: {text: 'У моего выступления есть чёткая {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_структура}
  answer_derivation:
    kind: render_frame
    frame: {text: 'У моего выступления есть чёткая {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: My talk has a clear structure. структура means structure., language_code: en, direction: ltr}
