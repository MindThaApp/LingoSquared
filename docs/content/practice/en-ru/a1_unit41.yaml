  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_кошелёк}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_кошелёк}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: My wallet is not missing. кошелёк means wallet., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson04.order.002
  lesson_content_key: ru.a1.unit41.lesson04.nina_sprashivaet_u_stoyki
  type: word_order
  frame: {text: 'Пойдём к {item}.', language_code: ru, direction: ltr}
  slots:
