    kind: render_frame
    frame: {text: 'Мой {item} у стойки.', language_code: ru, direction: ltr}
  feedback_frame: {text: My backpack is at the desk. рюкзак means backpack., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson02.fill.003
  lesson_content_key: ru.a1.unit41.lesson02.telefon_ryukzak_i_koshelyok
  type: fill_in_blank
  frame:
    text: Мой {item} не пропал. ({hint})
    language_code: ru
    direction: ltr
