schema_version: '1.0'
pack_key: practice.en-ru.a1.unit41
source_language: en
target_language: ru
unit_content_key: ru.a1.unit41.lost_property
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u41 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_волнений, w_кошелёк, w_куртке, w_нашёлся, w_подойди, w_посмотри, w_потерян, w_пропал, w_рюкзак, w_стойка, w_стойке, w_стойки, w_хватает]
templates:
- content_key: practice.en-ru.ru.a1.unit41.lesson01.choose.001
  lesson_content_key: ru.a1.unit41.lesson01.propalo_i_nashlos
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_пропал, w_нашёлся, w_рюкзак, w_стойки, w_кошелёк, w_стойка, w_стойке, w_подойди, w_потерян, w_посмотри, w_куртке, w_хватает, w_волнений]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on missing and found.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson02.listen.001
  lesson_content_key: ru.a1.unit41.lesson02.telefon_ryukzak_i_koshelyok
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on phone, backpack, and wallet.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson03.translate.001
  lesson_content_key: ru.a1.unit41.lesson03.u_stoyki
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on at the desk.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson04.match.001
  lesson_content_key: ru.a1.unit41.lesson04.nina_sprashivaet_u_stoyki
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson05.choose.001
  lesson_content_key: ru.a1.unit41.lesson05.soobshchenie_o_naydennom_telefone
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a message about a found phone.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson06.translate.001
  lesson_content_key: ru.a1.unit41.lesson06.igor_proveryaet_svoy_koshelyok
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on igor checks his wallet.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson01.order.002
  lesson_content_key: ru.a1.unit41.lesson01.propalo_i_nashlos
  type: word_order
  frame: {text: 'Мой телефон {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_пропал}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мой телефон {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'My phone is missing. пропал means missing, lost (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson01.fill.003
  lesson_content_key: ru.a1.unit41.lesson01.propalo_i_nashlos
  type: fill_in_blank
  frame:
    text: Мой телефон {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_нашёлся}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_нашёлся}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Has my phone been found? нашёлся means was found, turned up (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson02.order.002
  lesson_content_key: ru.a1.unit41.lesson02.telefon_ryukzak_i_koshelyok
  type: word_order
  frame: {text: 'Мой {item} у стойки.', language_code: ru, direction: ltr}
