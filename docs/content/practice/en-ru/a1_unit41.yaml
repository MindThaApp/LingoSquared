    kind: render_frame
    frame: {text: 'Пойдём к {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Come on, we are going to the desk. стойке means to the desk, after the word for ''to''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson05.order.002
  lesson_content_key: ru.a1.unit41.lesson05.soobshchenie_o_naydennom_telefone
  type: word_order
  frame: {text: 'Телефон больше не {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_потерян}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Телефон больше не {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'The phone is no longer missing. потерян means lost, missing (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit41.lesson06.order.002
  lesson_content_key: ru.a1.unit41.lesson06.igor_proveryaet_svoy_koshelyok
  type: word_order
  frame: {text: 'Посмотри в {item}, Игорь.', language_code: ru, direction: ltr}
