schema_version: "1.0"
pack_key: practice.en-ru.a1.unit22
source_language: en
target_language: ru
unit_content_key: ru.a1.unit22.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_выходной", "w_грустно", "w_потому", "w_работы", "w_рад", "w_рада", "w_себя", "w_устал", "w_устала", "w_чувствуешь"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: ["w_рад", "w_рада", "w_грустно"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_рада"}}
  p3: &p3 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_грустно"}}
  p4: &p4 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_рад"}}
  p5: &p5 {language_code: "ru", part_of_speech: ["adjective", "noun", "particle"], agreement_tags: {semantic: ["w_устал", "w_устала", "w_потому", "w_работы"]}}
  p6: &p6 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_устала"}}
  p7: &p7 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_устал"}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_работы"}}
  p9: &p9 {language_code: "ru", part_of_speech: ["noun", "pronoun", "verb"], agreement_tags: {semantic: ["w_себя", "w_чувствуешь", "w_выходной"]}}
  p10: &p10 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_себя"}}
  p11: &p11 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_чувствуешь"}}
  p12: &p12 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_выходной"}}
  p13: &p13 {language_code: "ru", part_of_speech: ["adjective", "noun"], agreement_tags: {semantic: ["w_рад", "w_рада", "w_грустно", "w_устал", "w_устала", "w_выходной"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit22.lesson01.choose.001
    lesson_content_key: ru.a1.unit22.lesson01.ya_rad
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Рад is said by a man and рада by a woman; грустно is impersonal and uses мне.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson01.order.002
    lesson_content_key: ru.a1.unit22.lesson01.ya_rad
    type: word_order
    frame: {text: "Сегодня я {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Сегодня я {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Рада ends in -а because the speaker is a woman.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson01.fill.003
    lesson_content_key: ru.a1.unit22.lesson01.ya_rad
    type: fill_in_blank
    frame: {text: "Мне {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Мне грустно uses мне, to me, and no subject, much like it feels sad to me.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson01.translate.004
    lesson_content_key: ru.a1.unit22.lesson01.ya_rad
    type: translation
    frame: {text: "I am glad. (said by a man)", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "A man says рад with no ending.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson01.translate.005
    lesson_content_key: ru.a1.unit22.lesson01.ya_rad
    type: translation
    frame: {text: "I am glad. (said by a woman)", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "A woman adds -а: рада.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson01.translate.006
    lesson_content_key: ru.a1.unit22.lesson01.ya_rad
    type: translation
    frame: {text: "I feel sad.", language_code: "en", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Мне грустно is the usual way to say you feel sad.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson02.choose.001
    lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Устал is said by a man and устала by a woman; потому что means because.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson02.order.002
    lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
    type: word_order
    frame: {text: "Я {item}, потому что много работы.", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {item}, потому что много работы.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Устала ends in -а for a woman; потому что introduces the reason.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson02.fill.003
    lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
    type: fill_in_blank
    frame: {text: "Я {item}, потому что много работы. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "A man says устал with no ending.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson02.translate.004
    lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
    type: translation
    frame: {text: "I am tired. (said by a man)", language_code: "en", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Устал is the masculine past form of устать.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson02.translate.005
    lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
    type: translation
    frame: {text: "I am tired because there is a lot of work. (said by a woman)", language_code: "en", direction: "ltr"}
    slots: {a: *p6, b: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {a}, потому что много {b}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Много takes the form работы, a lot of work.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.choose.001
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Как ты себя чувствуешь? asks how you feel; себя is the reflexive yourself.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.order.002
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: word_order
    frame: {text: "Как ты {item} чувствуешь?", language_code: "ru", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "Как ты {item} чувствуешь?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Себя is a reflexive pronoun that stays the same for every person.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.fill.003
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: fill_in_blank
    frame: {text: "Как ты себя {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Чувствуешь is the informal ты form of чувствовать.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.fill.004
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: fill_in_blank
    frame: {text: "Я рад, потому что завтра {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Выходной is a day off; завтра, tomorrow, comes before it.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.translate.005
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: translation
    frame: {text: "How do you feel? (informal)", language_code: "en", direction: "ltr"}
    slots: {a: *p10, b: *p11}
    answer_derivation: {kind: "render_frame", frame: {text: "Как ты {a} {b}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Как ты себя чувствуешь? is the informal way to ask how someone feels.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.translate.006
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: translation
    frame: {text: "Tomorrow is a day off.", language_code: "en", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "render_frame", frame: {text: "Завтра {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "No word for is is needed: Завтра выходной.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit22.lesson03.match.007
    lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p13, second: *p13, third: *p13, fourth: *p13, fifth: *p13, sixth: *p13}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Рад and устал are masculine, while рада and устала are the feminine forms.", language_code: "en", direction: "ltr"}
