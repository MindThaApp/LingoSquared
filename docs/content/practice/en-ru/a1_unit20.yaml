schema_version: "1.0"
pack_key: practice.en-ru.a1.unit20
source_language: en
target_language: ru
unit_content_key: ru.a1.unit20.weather
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card. Opus pass 2026-10-24: lesson03.translate.007 prompt marked (informal) so давай, not давайте, is the one answer. NATIVE FLAG: Сегодня солнце (fill.004) stands as previously flagged (солнечно is more usual).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_ветер", "w_дождь", "w_идёт", "w_какая", "w_останемся", "w_погода", "w_солнце", "w_тепло", "w_тогда", "w_холодно"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adjective", "noun"], agreement_tags: {semantic: ["w_холодно", "w_тепло", "w_погода"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_холодно"}}
  p3: &p3 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_тепло"}}
  p4: &p4 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_идёт", "w_дождь", "w_солнце", "w_ветер"]}}
  p5: &p5 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_идёт"}}
  p6: &p6 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_дождь"}}
  p7: &p7 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_солнце"}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_ветер"}}
  p9: &p9 {language_code: "ru", part_of_speech: ["adverb", "pronoun", "verb"], agreement_tags: {semantic: ["w_какая", "w_тогда", "w_останемся"]}}
  p10: &p10 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_какая"}}
  p11: &p11 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_останемся"}}
  p12: &p12 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_тогда"}}
  p13: &p13 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_погода"}}
templates:
  - content_key: practice.en-ru.ru.a1.unit20.lesson01.choose.001
    lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Холодно and тепло describe the weather with no word for it is.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson01.order.002
    lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
    type: word_order
    frame: {text: "Сегодня {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Сегодня {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Russian weather statements use an adverb with no subject: Сегодня холодно.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson01.fill.003
    lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
    type: fill_in_blank
    frame: {text: "Дома {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Тепло is the opposite of холодно.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson01.translate.004
    lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
    type: translation
    frame: {text: "It is cold today.", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Сегодня {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "There is no word for it is: Сегодня холодно.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson01.translate.005
    lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
    type: translation
    frame: {text: "It is warm at home.", language_code: "en", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "Дома {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Дома, at home, is a fixed adverb.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson02.choose.001
    lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Идёт literally means goes, and Идёт дождь means it is raining.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson02.order.002
    lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
    type: word_order
    frame: {text: "Сегодня {item} дождь.", language_code: "ru", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Сегодня {item} дождь.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Идёт is used with weather that falls, such as rain.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson02.fill.003
    lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
    type: fill_in_blank
    frame: {text: "Сегодня идёт {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Идёт дождь literally says rain goes.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson02.fill.004
    lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
    type: fill_in_blank
    frame: {text: "Сегодня {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Russian just names the weather: Сегодня солнце.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson02.translate.005
    lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
    type: translation
    frame: {text: "It is raining today.", language_code: "en", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Сегодня {item} дождь.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Russian uses идёт, goes, for rain.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson02.translate.006
    lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
    type: translation
    frame: {text: "It is windy outside.", language_code: "en", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "На улице {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "На улице means outside, literally on the street.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.choose.001
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Какая is the feminine which, matching the feminine noun погода.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.order.002
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: word_order
    frame: {text: "А {item} сегодня погода?", language_code: "ru", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "А {item} сегодня погода?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Какая agrees with the feminine noun погода.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.order.003
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: word_order
    frame: {text: "Тогда давай {item} дома.", language_code: "ru", direction: "ltr"}
    slots: {item: *p11}
    answer_derivation: {kind: "render_frame", frame: {text: "Тогда давай {item} дома.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Давай plus a we form suggests doing something together.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.fill.004
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: fill_in_blank
    frame: {text: "Хорошо, {item} давай останемся дома. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Тогда links a plan to what was just said.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.fill.005
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: fill_in_blank
    frame: {text: "А {item} сегодня погода? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Какая is feminine and agrees with погода.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.translate.006
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: translation
    frame: {text: "What is the weather like today?", language_code: "en", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "Какая сегодня {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Какая agrees with the feminine noun погода.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit20.lesson03.translate.007
    lesson_content_key: ru.a1.unit20.lesson03.pogoda_i_plan
    type: translation
    frame: {text: "Then let's stay at home. (informal)", language_code: "en", direction: "ltr"}
    slots: {item: *p11}
    answer_derivation: {kind: "render_frame", frame: {text: "Тогда давай {item} дома.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Давай plus a we form is the usual way to suggest a plan.", language_code: "en", direction: "ltr"}
