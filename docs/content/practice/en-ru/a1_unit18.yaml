schema_version: "1.0"
pack_key: practice.en-ru.a1.unit18
source_language: en
target_language: ru
unit_content_key: ru.a1.unit18.housing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card. Opus pass 2026-10-24: lesson01.translate.007 ("In the kitchen there is a table.") now expects На кухне есть стол., the natural rendering of there is (the bare На кухне стол. stays as a word_order item, as in the dialogue), with feedback no longer claiming Russian drops there is; choose.001 feedback ending list fixed.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_ванная", "w_гостиная", "w_гостиной", "w_две", "w_диван", "w_живу", "w_живёшь", "w_квартира", "w_квартире", "w_комнаты", "w_кровать", "w_кухне", "w_кухня", "w_спальне", "w_спальня"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_квартира", "w_кухня", "w_спальня", "w_кровать"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_квартира", "w_кухня", "w_спальня", "w_кровать", "w_диван", "w_ванная"]}}
  p3: &p3 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_кухне"}}
  p4: &p4 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_квартира"}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_спальне"}}
  p6: &p6 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_диван", "w_гостиная", "w_ванная", "w_квартира"]}}
  p7: &p7 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_гостиной"}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_ванная"}}
  p9: &p9 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_живёшь", "w_живу", "w_две", "w_квартира"]}}
  p10: &p10 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_живу"}}
  p11: &p11 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_квартире"}}
  p12: &p12 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_живёшь"}}
  p13: &p13 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_две"}}
  p14: &p14 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_комнаты"}}
templates:
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.choose.001
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Квартира, кухня and спальня are feminine nouns ending in -а or -я; кровать is feminine too.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.match.002
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Rooms and furniture are named with plain nouns, with no word for a or the.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.order.003
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: word_order
    frame: {text: "На {item} стол.", language_code: "ru", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "На {item} стол.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "На plus the prepositional ending -е says where something is: на кухне, in the kitchen.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.fill.004
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: fill_in_blank
    frame: {text: "Это моя {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Квартира is feminine, so it takes моя.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.fill.005
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: fill_in_blank
    frame: {text: "В {item} кровать. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After в the noun takes the prepositional ending -е.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.translate.006
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: translation
    frame: {text: "This is my apartment.", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Это моя {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Моя matches the feminine noun квартира.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson01.translate.007
    lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
    type: translation
    frame: {text: "In the kitchen there is a table.", language_code: "en", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "На {item} есть стол.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "There is ... is есть, and Russian puts the place first and the new thing last; кухня takes на, not в: на кухне.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson02.choose.001
    lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Гостиная and ванная are feminine adjectives used as nouns, so they end in -ая.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson02.order.002
    lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
    type: word_order
    frame: {text: "Диван в {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Диван в {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Гостиная becomes гостиной after в, in the living room.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson02.fill.003
    lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
    type: fill_in_blank
    frame: {text: "Это {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Ванная is a feminine adjective used as a noun, so in the plain form it ends in -ая.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson02.translate.004
    lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
    type: translation
    frame: {text: "The sofa is in the living room.", language_code: "en", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Диван в {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "В plus гостиной says in the living room.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson02.translate.005
    lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
    type: translation
    frame: {text: "This is the bathroom.", language_code: "en", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Это {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Это introduces a thing: Это ванная.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson03.choose.001
    lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Живу is the я form and живёшь is the ты form of жить, to live.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson03.order.002
    lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
    type: word_order
    frame: {text: "Я {item} в квартире.", language_code: "ru", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {item} в квартире.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Живу is the I form of жить.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson03.fill.003
    lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
    type: fill_in_blank
    frame: {text: "Сколько комнат в {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After в, квартира becomes квартире.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson03.translate.004
    lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
    type: translation
    frame: {text: "Where do you live? (informal)", language_code: "en", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "render_frame", frame: {text: "Где ты {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Ты shows an informal question.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson03.translate.005
    lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
    type: translation
    frame: {text: "I live in an apartment.", language_code: "en", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "Я {item} в квартире.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Я живу is the I form of жить.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit18.lesson03.translate.006
    lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
    type: translation
    frame: {text: "I have two rooms.", language_code: "en", direction: "ltr"}
    slots: {a: *p13, b: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня {a} {b}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "After две, two, the noun takes the form комнаты.", language_code: "en", direction: "ltr"}
