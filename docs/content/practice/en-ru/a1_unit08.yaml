schema_version: "1.0"
pack_key: practice.en-ru.a1.unit08
source_language: en
target_language: ru
unit_content_key: ru.a1.unit08.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items so no bare-word prompt has two defensible answers. English prompts name ты/вы and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the ты/вы labels in the English prompts and the case notes in feedback. No character facts are asserted (character names appear only as bare vocabulary items).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_апельсины", "w_дайте", "w_двести", "w_капуста", "w_картофель", "w_килограмм", "w_магазин", "w_молоко", "w_огурцы", "w_полкило", "w_помидоров", "w_помидоры", "w_сто", "w_штук", "w_штука", "w_штуку", "w_яблок"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_магазин", "w_сто", "w_молоко", "w_двести", "w_килограмм", "w_полкило"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_молоко"}}
  p3: &p3 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_сто"}}
  p4: &p4 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_дайте", "w_килограмм", "w_полкило", "w_штука"]}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_килограмм", "w_полкило"]}}
  p6: &p6 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_штуку"}}
  p7: &p7 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_штук"}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_полкило"}}
  p9: &p9 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_килограмм", "w_полкило", "w_штука", "w_дайте"]}}
  p10: &p10 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_помидоры", "w_огурцы", "w_картофель", "w_капуста", "w_апельсины"]}}
  p11: &p11 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_яблок"}}
  p12: &p12 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_помидоров"}}
  p13: &p13 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_капуста"}}
templates:
  - content_key: practice.en-ru.ru.a1.unit08.lesson01.choose.001
    lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Сто and двести are the numbers 100 and 200; the noun after them is in the plural genitive: сто рублей, двести рублей.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson01.order.002
    lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
    type: word_order
    frame: {text: "Сколько стоит {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Сколько стоит {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Сколько стоит? asks the price of one item; молоко is a singular noun.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson01.fill.003
    lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
    type: fill_in_blank
    frame: {text: "Хлеб стоит {item} рублей. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After сто, as after every number from five up, the noun is in the plural genitive: рублей.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson01.match.004
    lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Полкило is half a kilo, written as one word.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson01.translate.005
    lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
    type: translation
    frame: {text: "How much does milk cost?", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Сколько стоит {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Стоит agrees with the single item, молоко; for several items Russian uses стоят.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson01.translate.006
    lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
    type: translation
    frame: {text: "The bread costs a hundred rubles.", language_code: "en", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "render_frame", frame: {text: "Хлеб стоит {item} рублей.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Сто needs no word for a; the noun after it is рублей.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.choose.001
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Дайте is the polite вы command meaning give me; with ты it would be дай.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.order.002
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: word_order
    frame: {text: "Дайте {item}, пожалуйста.", language_code: "ru", direction: "ltr"}
    slots: {item: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Дайте {item}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Килограмм and полкило both name a quantity of goods and follow дайте directly.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.fill.003
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: fill_in_blank
    frame: {text: "Дайте одну {item}, пожалуйста. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After дайте the feminine штука becomes штуку, the form for the thing being asked for.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.fill.004
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: fill_in_blank
    frame: {text: "Дайте пять {item}, пожалуйста. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After пять and higher numbers the noun is in the plural genitive: пять штук.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.translate.005
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: translation
    frame: {text: "Give me half a kilo, please. (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Дайте {item}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Дайте полкило, пожалуйста is a polite way to ask a seller for half a kilo.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.translate.006
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: translation
    frame: {text: "Give me five pieces, please. (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Дайте пять {item}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Штука changes to штук after the number five.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson02.translate.007
    lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Штука counts items one by one, while килограмм and полкило count by weight.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson03.listen.001
    lesson_content_key: ru.a1.unit08.lesson03.na_rynke
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Помидоры, огурцы and апельсины are plural; картофель and капуста are singular words that mean potatoes and cabbage.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson03.order.002
    lesson_content_key: ru.a1.unit08.lesson03.na_rynke
    type: word_order
    frame: {text: "У вас есть {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "У вас есть {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "У вас есть ...? works with any noun and is the usual way to ask a seller whether they have something.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson03.fill.003
    lesson_content_key: ru.a1.unit08.lesson03.na_rynke
    type: fill_in_blank
    frame: {text: "Сколько стоит кило {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After a quantity word such as кило the item is in the plural genitive, so яблоки becomes яблок.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson03.translate.004
    lesson_content_key: ru.a1.unit08.lesson03.na_rynke
    type: translation
    frame: {text: "Give me a kilogram of tomatoes, please. (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "render_frame", frame: {text: "Дайте килограмм {item}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "After килограмм the item is in the plural genitive: помидоры becomes помидоров.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit08.lesson03.translate.005
    lesson_content_key: ru.a1.unit08.lesson03.na_rynke
    type: translation
    frame: {text: "Do you have cabbage? (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "У вас есть {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Капуста is singular in Russian and takes no word for the or a.", language_code: "en", direction: "ltr"}
