schema_version: '1.0'
pack_key: practice.en-ru.b2.unit05
source_language: en
target_language: ru
unit_content_key: ru.b2.unit05.registr
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_b2_u5 / w_<token>). 31 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_администрация, w_будьте, w_встреча, w_добры, w_могли, w_могу, w_можем, w_можешь, w_мочь, w_неделе, w_нужно, w_перенести, w_писать, w_пишешь, w_пишу, w_поликлиника, w_помогите, w_помочь, w_понедельник, w_приём, w_проблем, w_сделай, w_сделать, w_следующей, w_сможешь, w_сожалению, w_тогда, w_туда, w_уважаемая, w_уважением, w_удобно]
templates:
- content_key: practice.en-ru.ru.b2.unit05.lesson01.choose.001
  lesson_content_key: ru.b2.unit05.lesson01.ty_ili_vy
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_писать, w_пишу, w_можешь, w_мочь, w_помочь, w_уважаемая, w_администрация, w_уважением, w_сделай, w_сделать, w_могли, w_будьте, w_добры, w_помогите, w_встреча, w_приём, w_поликлиника, w_перенести, w_понедельник, w_могу, w_сожалению, w_можем, w_удобно, w_следующей, w_неделе, w_проблем, w_сможешь, w_тогда, w_нужно, w_туда, w_пишешь]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on you (ты) or you (вы)?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson02.listen.001
  lesson_content_key: ru.b2.unit05.lesson02.privetstvija_i_proshchanija
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on greetings and farewells.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson03.translate.001
  lesson_content_key: ru.b2.unit05.lesson03.pryamota
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on direct or polite?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson04.match.001
  lesson_content_key: ru.b2.unit05.lesson04.perenesti_vstrechu
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson05.choose.001
  lesson_content_key: ru.b2.unit05.lesson05.dva_soobshchenija
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two messages, two readers.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson06.translate.001
  lesson_content_key: ru.b2.unit05.lesson06.vybrat_registr
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on choosing the right register.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson01.order.002
  lesson_content_key: ru.b2.unit05.lesson01.ty_ili_vy
  type: word_order
  frame: {text: 'Я {item} тебе сообщение.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_пишу}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я {item} тебе сообщение.', language_code: ru, direction: ltr}
  feedback_frame: {text: I'm writing you a message. пишу means I write., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson03.order.002
  lesson_content_key: ru.b2.unit05.lesson03.pryamota
  type: word_order
  frame: {text: 'Не могли бы Вы это {item}?', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_сделать}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Не могли бы Вы это {item}?', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Would you be able to do this? Formal and indirect. Where English can stay direct and still sound polite (''Can you...?''), formal Russian often prefers an indirect question: Не могли бы Вы это сделать? (''would you be able to do.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson03.fill.003
  lesson_content_key: ru.b2.unit05.lesson03.pryamota
  type: fill_in_blank
  frame:
    text: Не {item} бы Вы перенести мой приём? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_могли}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_могли}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Would you be able to reschedule my appointment? The SAME request in formal form, to the clinic: Не могли бы Вы перенести мой приём? Indirect and polite. Мой = ''my''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson03.translate.004
  lesson_content_key: ru.b2.unit05.lesson03.pryamota
  type: translation
  frame: {text: Be so kind as to help., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_добры}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Будьте {item}, помогите.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Be so kind as to help. The very polite formal opener Будьте добры, (''be so kind'') can front an imperative and still stay formal. Будьте is the Вы-form, so it goes with anyone you address as Вы -- a stranger, a shop assistant, an.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson04.order.002
  lesson_content_key: ru.b2.unit05.lesson04.perenesti_vstrechu
  type: word_order
  frame: {text: 'У меня сегодня {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_встреча}
  answer_derivation:
    kind: render_frame
    frame: {text: 'У меня сегодня {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: I have a meetup today. встреча means meeting., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson04.fill.003
  lesson_content_key: ru.b2.unit05.lesson04.perenesti_vstrechu
  type: fill_in_blank
  frame:
    text: Хочу перенести {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_приём}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_приём}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I want to reschedule the appointment. приём means appointment., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson04.translate.004
  lesson_content_key: ru.b2.unit05.lesson04.perenesti_vstrechu
  type: translation
  frame: {text: I want to reschedule the meetup., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_перенести}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Хочу {item} встречу.', language_code: ru, direction: ltr}
  feedback_frame: {text: I want to reschedule the meetup. перенести means to move; to postpone., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson05.order.002
  lesson_content_key: ru.b2.unit05.lesson05.dva_soobshchenija
  type: word_order
  frame: {text: 'Вам {item} на следующей неделе?', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_удобно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Вам {item} на следующей неделе?', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Is next week convenient for you? удобно means convenient; comfortable.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson06.order.002
  lesson_content_key: ru.b2.unit05.lesson06.vybrat_registr
  type: word_order
  frame: {text: 'И мне ещё {item} написать в поликлинику.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_нужно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'И мне ещё {item} написать в поликлинику.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'And I still need to write to the clinic. И мне ещё нужно написать в поликлинику = ''and I still need to write to the clinic''. Ещё = ''still / also'', нужно = ''need to'', написать = ''to write''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson06.fill.003
  lesson_content_key: ru.b2.unit05.lesson06.vybrat_registr
  type: fill_in_blank
  frame:
    text: Да, {item}, конечно, ты пишешь по-другому. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_туда}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_туда}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Dima: Yeah, to them, of course, you write differently. туда means there (direction).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit05.lesson06.translate.004
  lesson_content_key: ru.b2.unit05.lesson06.vybrat_registr
  type: translation
  frame: {text: 'There, of course, you write differently.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_пишешь}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Туда, конечно, ты {item} по-другому.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'There, of course, you write differently. Туда, конечно, ты пишешь по-другому = ''there [to the clinic], of course, you write differently'' -- exactly the skill of this unit. Туда = ''there (to)'', по-другому = ''differently''.', language_code: en, direction: ltr}
