  notes: >-
    Authored 2026-10-25 (session 12, en-ru B1 set) from scripts/backfill_lexemes_en_ru.py (en-ru-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Topic: duties and what is not allowed. Sentence translations accept free word order, dropped subject pronouns where natural, aspect or synonym pairs, the feminine speaker forms, and the е spelling of ё. Reviewer: nelzya is glossed as 'must not' (prohibition); confirm the variant using нужно was for the translation of 'I should have checked'. The feminine успела is accepted as a variant.
