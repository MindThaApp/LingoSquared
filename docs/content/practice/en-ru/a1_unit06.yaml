schema_version: "1.0"
pack_key: practice.en-ru.a1.unit06
source_language: en
target_language: ru
unit_content_key: ru.a1.unit06.family
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items so no bare-word prompt has two defensible answers. English prompts name ты/вы and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the ты/вы labels in the English prompts and the case notes in feedback. No character facts are asserted (character names appear only as bare vocabulary items).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Ольга", "w_бабушка", "w_вот", "w_девочка", "w_дедушка", "w_дети", "w_дочь", "w_есть", "w_её", "w_жена", "w_кто", "w_мать", "w_мой", "w_моя", "w_муж", "w_отец", "w_семья", "w_сестра", "w_сын", "w_фото", "w_эта"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["noun", "pronoun", "verb"], agreement_tags: {semantic: ["w_мать", "w_отец", "w_сестра", "w_мой", "w_моя", "w_есть"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_моя"}}
  p3: &p3 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_есть"}}
  p4: &p4 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_мой"}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_мать", "w_отец", "w_сестра"]}}
  p6: &p6 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_бабушка", "w_дедушка", "w_муж", "w_жена", "w_сын", "w_дочь", "w_дети"]}}
  p7: &p7 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_бабушка", "w_жена", "w_дочь"]}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_дедушка", "w_муж", "w_сын"]}}
  p9: &p9 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_дочь"}}
  p10: &p10 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_дети"}}
  p11: &p11 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_бабушка", "w_дедушка", "w_муж", "w_жена", "w_сын", "w_дочь"]}}
  p12: &p12 {language_code: "ru", part_of_speech: ["noun", "particle", "pronoun"], agreement_tags: {semantic: ["w_кто", "w_её", "w_фото", "w_семья", "w_вот", "w_эта", "w_девочка"]}}
  p13: &p13 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_эта"}}
  p14: &p14 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_фото"}}
  p15: &p15 {language_code: "ru", part_of_speech: "proper_noun", agreement_tags: {semantic: "w_Ольга"}}
templates:
  - content_key: practice.en-ru.ru.a1.unit06.lesson01.choose.001
    lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Мой goes with masculine nouns (мой отец) and моя with feminine nouns (моя мать), so the possessive changes with the family word.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson01.match.002
    lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "У меня есть literally says at me there is, which is how Russian says I have; мой and моя both mean my.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson01.fill.003
    lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
    type: fill_in_blank
    frame: {text: "Это {item} мать. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Мать is feminine, so it takes моя; the masculine отец takes мой.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson01.fill.004
    lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
    type: fill_in_blank
    frame: {text: "У меня {item} сестра. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "У меня есть plus a noun is the standard way to say I have something.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson01.translate.005
    lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
    type: translation
    frame: {text: "This is my father.", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Это {item} отец.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Отец is masculine, so the possessive is мой; with feminine мать it would be моя.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson01.translate.006
    lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p5}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Russian family nouns have a grammatical gender: мать and сестра are feminine, отец is masculine.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson02.choose.001
    lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Дедушка looks feminine because of the -а ending, but it is masculine and takes мой: мой дедушка.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson02.order.002
    lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
    type: word_order
    frame: {text: "Это моя {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Это моя {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Бабушка, жена and дочь are all feminine, so each takes моя.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson02.order.003
    lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
    type: word_order
    frame: {text: "Это мой {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Это мой {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Дедушка, муж and сын are all masculine, so each takes мой, even though дедушка ends in -а.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson02.fill.004
    lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
    type: fill_in_blank
    frame: {text: "У меня есть сын и {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "The conjunction и joins two nouns, as in сын и дочь, son and daughter.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson02.translate.005
    lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
    type: translation
    frame: {text: "Do you have children? (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "У вас есть {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Дети is always plural; У вас есть ...? is the formal way to ask whether someone has something.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson02.translate.006
    lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p11}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Russian has separate words for each relative, with no word for a or the.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson03.choose.001
    lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Эта is the feminine this, so it goes with девочка; the masculine form is этот.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson03.order.002
    lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
    type: word_order
    frame: {text: "А кто {item} девочка?", language_code: "ru", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "А кто {item} девочка?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Эта agrees with the feminine noun девочка, while Кто это? uses the neutral это.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson03.fill.003
    lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
    type: fill_in_blank
    frame: {text: "Кто это на {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Фото never changes its ending, so it stays фото in На фото.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson03.translate.004
    lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
    type: translation
    frame: {text: "Who is this in the photo?", language_code: "en", direction: "ltr"}
    slots: {item: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "Кто это на {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Кто это? asks who someone is; На фото means in the photo.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson03.translate.005
    lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
    type: translation
    frame: {text: "And who is this girl?", language_code: "en", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "А кто {item} девочка?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "А at the start of a question links it to what was just said, like and in English.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit06.lesson03.translate.006
    lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
    type: translation
    frame: {text: "My name is Olga.", language_code: "en", direction: "ltr"}
    slots: {item: *p15}
    answer_derivation: {kind: "render_frame", frame: {text: "Меня зовут {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Меня зовут plus a first name is how Russians introduce themselves.", language_code: "en", direction: "ltr"}
