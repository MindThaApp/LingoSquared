schema_version: '1.0'
pack_key: practice.en-ru.b2.unit06
source_language: en
target_language: ru
unit_content_key: ru.b2.unit06.abstrakcija
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_b2_u6 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_большой, w_важна, w_важнее, w_думаю, w_зависеть, w_зависит, w_идея, w_командная, w_легко, w_минус, w_мысль, w_общество, w_обязательно, w_ответственность, w_офис, w_плохо, w_плюс, w_повышает, w_подходит, w_подходить, w_понимать, w_понимаю, w_работать, w_свободы, w_сложно, w_согласна, w_степени, w_стоит, w_стоить, w_страдает, w_страдать, w_считать, w_убеждён, w_удалённая, w_удалённо, w_хорошо, w_хотеть, w_хотят, w_целом, w_эффективность]
templates:
- content_key: practice.en-ru.ru.b2.unit06.lesson01.choose.001
  lesson_content_key: ru.b2.unit06.lesson01.chto_ty_dumaesh
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_хотят, w_хотеть, w_работать, w_удалённо, w_удалённая, w_хорошо, w_считать, w_идея, w_важна, w_убеждён, w_командная, w_важнее, w_степени, w_целом, w_обязательно, w_плохо, w_зависит, w_зависеть, w_ответственность, w_сложно, w_понимаю, w_понимать, w_мысль, w_думаю, w_согласна, w_плюс, w_минус, w_большой, w_общество, w_эффективность, w_повышает, w_подходит, w_подходить, w_легко, w_стоит, w_стоить, w_страдает, w_страдать, w_свободы, w_офис]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what do you think?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson02.listen.001
  lesson_content_key: ru.b2.unit06.lesson02.vzveshennoe_mnenie
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a qualified opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson03.translate.001
  lesson_content_key: ru.b2.unit06.lesson03.otvet_na_vozrazhenie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on responding to a counter-argument.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson04.match.001
  lesson_content_key: ru.b2.unit06.lesson04.za_i_protiv
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson05.choose.001
  lesson_content_key: ru.b2.unit06.lesson05.chtenie_mneniya
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading someone else''s opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson06.translate.001
  lesson_content_key: ru.b2.unit06.lesson06.v_razgovore
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on in conversation: a qualified opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson01.order.002
  lesson_content_key: ru.b2.unit06.lesson01.chto_ty_dumaesh
  type: word_order
  frame: {text: 'Многие {item} работать удалённо.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_хотят}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Многие {item} работать удалённо.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Many people want to work remotely. This unit debates one abstract question: should everyone be allowed to work remotely (удалённо)? Многие = ''many people''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson01.fill.003
  lesson_content_key: ru.b2.unit06.lesson01.chto_ty_dumaesh
  type: fill_in_blank
  frame:
    text: Удалённо {item} иногда сложно. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_работать}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_работать}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Working remotely is sometimes difficult. работать means to work., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson01.translate.004
  lesson_content_key: ru.b2.unit06.lesson01.chto_ty_dumaesh
  type: translation
  frame: {text: That is good for society., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_хорошо}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это {item} для общества.', language_code: ru, direction: ltr}
  feedback_frame: {text: That is good for society. хорошо means well; fine., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson02.order.002
  lesson_content_key: ru.b2.unit06.lesson02.vzveshennoe_mnenie
  type: word_order
  frame: {text: 'Это не {item} плохо.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_обязательно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это не {item} плохо.', language_code: ru, direction: ltr}
  feedback_frame: {text: That's not necessarily bad. обязательно means necessarily., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson02.fill.003
  lesson_content_key: ru.b2.unit06.lesson02.vzveshennoe_mnenie
  type: fill_in_blank
  frame:
    text: У каждого есть {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_ответственность}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_ответственность}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Everyone has a responsibility. ответственность means responsibility., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson03.order.002
  lesson_content_key: ru.b2.unit06.lesson03.otvet_na_vozrazhenie
  type: word_order
  frame: {text: 'Удалённо работать иногда {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_сложно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Удалённо работать иногда {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: Working remotely is sometimes difficult. сложно means difficult., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson03.fill.003
  lesson_content_key: ru.b2.unit06.lesson03.otvet_na_vozrazhenie
  type: fill_in_blank
  frame:
    text: Я {item} твою мысль, но всё же это лучше для многих. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_понимаю}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_понимаю}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Nastya: I understand your point, still it''s better for many people. понимаю means I understand.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson03.translate.004
  lesson_content_key: ru.b2.unit06.lesson03.otvet_na_vozrazhenie
  type: translation
  frame: {text: 'Yes, I agree. (female speaker)', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_согласна}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Да, я {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Yes, I agree. (female speaker) согласна means agreed (said by a woman).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson04.order.002
  lesson_content_key: ru.b2.unit06.lesson04.za_i_protiv
  type: word_order
  frame: {text: 'Свобода — это {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_плюс}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Свобода — это {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: Freedom is an advantage. плюс means advantage; plus., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson04.fill.003
  lesson_content_key: ru.b2.unit06.lesson04.za_i_protiv
  type: fill_in_blank
  frame:
    text: Это большой {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_минус}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_минус}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: That's a big disadvantage. минус means disadvantage; minus., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson04.translate.004
  lesson_content_key: ru.b2.unit06.lesson04.za_i_protiv
  type: translation
  frame: {text: That raises efficiency., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_эффективность}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это повышает {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: That raises efficiency. эффективность means efficiency., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson05.order.002
  lesson_content_key: ru.b2.unit06.lesson05.chtenie_mneniya
  type: word_order
  frame: {text: 'Это правда, но не всем это {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_подходит}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это правда, но не всем это {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Dima: That''s true, but it doesn''t suit everyone. подходит means suits, works for.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit06.lesson05.fill.003
  lesson_content_key: ru.b2.unit06.lesson05.chtenie_mneniya
  type: fill_in_blank
  frame:
    text: Я убеждена, что это того {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_стоит}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_стоит}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Nastya: I''m convinced that it''s worth it. стоит means costs (one thing).', language_code: en, direction: ltr}
