  type: word_order
  frame: {text: 'Мой день {item} восемнадцатого апреля.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_рождения}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мой день {item} восемнадцатого апреля.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'My birthday is on the eighteenth of April. рождения means birth (genitive case, in ''birthday'').', language_code: en, direction: ltr}
