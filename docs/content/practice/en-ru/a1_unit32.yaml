  frame:
    text: День рождения Лены в субботу, {item} апреля. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_восемнадцатого}
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_восемнадцатого}
