  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: fill_in_blank
  frame:
    text: Мне нравится {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_лето}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_лето}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I like summer. лето means summer., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit39.lesson01.translate.005
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: translation
  frame: {text: In spring it is sunny and in summer it is warm., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_летом}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Весной солнечно, а {item} тепло.', language_code: ru, direction: ltr}
  feedback_frame: {text: In spring it is sunny and in summer it is warm. летом means in summer., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit39.lesson02.order.002
  lesson_content_key: ru.a1.unit39.lesson02.osen_i_zima
  type: word_order
  frame: {text: 'Какое время года ты {item} красивым?', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_считаешь}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Какое время года ты {item} красивым?', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Which season do you find beautiful? считаешь means you find, you consider (informal).', language_code: en, direction: ltr}
