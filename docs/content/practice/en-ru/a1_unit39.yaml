  lesson_content_key: ru.a1.unit39.lesson03.zanyatiya_v_kazhdoe_vremya
  type: fill_in_blank
  frame:
    text: Зимой мы катаемся на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_коньках}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_коньках}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'In winter we skate. коньках means ice skates (after the word for ''on''), as in ''to ice-skate''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit39.lesson05.order.002
  lesson_content_key: ru.a1.unit39.lesson05.chitaem_tekst_o_vremenakh
  type: word_order
  frame: {text: 'Разговор о {item} года приятный.', language_code: ru, direction: ltr}
