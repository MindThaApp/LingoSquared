schema_version: '1.0'
pack_key: practice.en-ru.c1.unit08
source_language: en
target_language: ru
unit_content_key: ru.c1.unit08.persuaziya_ritorika
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u8 / w_<token>). 30 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_асфальт, w_готовы, w_гуляют, w_действию, w_дети, w_дышит, w_единственное, w_здесь, w_зелёный, w_именно, w_место, w_можем, w_молчать, w_осталось, w_останется, w_отдыхают, w_параллелизм, w_петицию, w_поддержите, w_подпишите, w_призыв, w_променять, w_протест, w_район, w_риторический, w_родители, w_сегодня, w_сквер, w_убеждение, w_эмфаза]
templates:
- content_key: practice.en-ru.ru.c1.unit08.lesson01.choose.001
  lesson_content_key: ru.c1.unit08.persuaziya_ritorika.lesson01.ritoricheskij_vopros
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_готовы, w_променять, w_зелёный, w_сквер, w_асфальт, w_можем, w_молчать, w_риторический, w_здесь, w_гуляют, w_дети, w_отдыхают, w_родители, w_дышит, w_район, w_параллелизм, w_именно, w_единственное, w_место, w_осталось, w_эмфаза, w_поддержите, w_протест, w_подпишите, w_петицию, w_сегодня, w_останется, w_призыв, w_действию, w_убеждение]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the rhetorical question.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit08.lesson02.listen.001
  lesson_content_key: ru.c1.unit08.persuaziya_ritorika.lesson02.parallelizm
  type: listen_select
