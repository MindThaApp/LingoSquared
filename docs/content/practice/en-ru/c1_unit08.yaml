  type: fill_in_blank
  frame:
    text: Именно этот {item} — единственное зелёное место, которое у нас осталось. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_сквер}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_сквер}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Precisely this park is the only green place that we have left. Именно ... единственное ... pins the park as unique — the emphasis this appeal builds toward., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit08.lesson01.translate.005
  lesson_content_key: ru.c1.unit08.persuaziya_ritorika.lesson01.ritoricheskij_vopros
  type: translation
  frame: {text: 'Can we really stay silent?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_можем}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Разве мы {item} молчать?', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Can we really stay silent? Разве...? is a second rhetorical-question opener. Молчать = ''to stay silent''.', language_code: en, direction: ltr}
