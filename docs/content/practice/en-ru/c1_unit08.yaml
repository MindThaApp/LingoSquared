  lesson_content_key: ru.c1.unit08.persuaziya_ritorika.lesson01.ritoricheskij_vopros
  type: word_order
  frame: {text: 'Неужели мы {item} променять зелёный сквер на асфальт?', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_готовы}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Неужели мы {item} променять зелёный сквер на асфальт?', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Are we really ready to trade the green park for asphalt? Неужели...? opens a rhetorical question — asked for effect, not for an answer. Променять ... на ... = ''to trade ... for ...''.', language_code: en, direction: ltr}
