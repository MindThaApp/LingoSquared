schema_version: '1.0'
pack_key: practice.en-ru.a1.unit35
source_language: en
target_language: ru
unit_content_key: ru.a1.unit35.post
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u35 / w_<token>). 16 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_адрес, w_бабушке, w_дедушке, w_домой, w_идти, w_марка, w_отправляю, w_писать, w_письмо, w_пишет, w_пишу, w_покупает, w_посылка, w_почте, w_прийти, w_сотрудник]
templates:
- content_key: practice.en-ru.ru.a1.unit35.lesson01.choose.001
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_письмо, w_посылка, w_отправляю, w_дедушке, w_бабушке, w_марка, w_адрес, w_писать, w_пишу, w_прийти, w_идти, w_сотрудник, w_покупает, w_почте, w_пишет, w_домой]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the letter and the package.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson02.listen.001
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the stamp, the address, and writing.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson03.translate.001
  lesson_content_key: ru.a1.unit35.lesson03.priyti_i_idti
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on arriving and taking time.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson04.match.001
  lesson_content_key: ru.a1.unit35.lesson04.na_pochte
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson05.choose.001
  lesson_content_key: ru.a1.unit35.lesson05.nastya_otpravlyaet_posylku
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nastya sends a package.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson06.translate.001
  lesson_content_key: ru.a1.unit35.lesson06.domoy
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on heading home.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson01.order.002
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: word_order
  frame: {text: 'У меня есть {item} для дедушки.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_письмо}
  answer_derivation:
    kind: render_frame
    frame: {text: 'У меня есть {item} для дедушки.', language_code: ru, direction: ltr}
  feedback_frame: {text: I have a letter for my grandpa. письмо means letter; email., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson01.fill.003
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: fill_in_blank
  frame:
    text: Я {item} посылку в Самару. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_отправляю}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_отправляю}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I send a package to Samara. отправляю means I send., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson01.translate.004
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: translation
  frame: {text: I send a letter and a package to my grandpa and grandma in Samara., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_дедушке}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я отправляю письмо и посылку в Самару, {item} и бабушке.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I send a letter and a package to my grandpa and grandma in Samara. дедушке means grandfather (dative, as in ''to grandpa'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson02.order.002
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: word_order
  frame: {text: 'Я пишу {item} на посылке.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_адрес}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я пишу {item} на посылке.', language_code: ru, direction: ltr}
  feedback_frame: {text: I write the address on the package. адрес means address., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit35.lesson02.fill.003
  lesson_content_key: ru.a1.unit35.lesson02.marka_adres_i_pisat
  type: fill_in_blank
  frame:
    text: Я покупаю марку и {item} адрес на посылке. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_пишу}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_пишу}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I buy a stamp and I write the address on the package. пишу means I write., language_code: en, direction: ltr}
