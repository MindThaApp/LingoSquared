schema_version: "1.0"
pack_key: practice.en-ru.a1.unit10
source_language: en
target_language: ru
unit_content_key: ru.a1.unit10.directions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items so no bare-word prompt has two defensible answers. English prompts name ты/вы and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the ты/вы labels in the English prompts and the case notes in feedback. No character facts are asserted (character names appear only as bare vocabulary items). Opus pass 2026-10-24: lesson03.translate.004 feedback no longer calls predicative просто an adverb.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_далеко", "w_дойти", "w_за", "w_идите", "w_квартал", "w_квартала", "w_минут", "w_музей", "w_музея", "w_налево", "w_направо", "w_отсюда", "w_пешком", "w_поверните", "w_потом", "w_простите", "w_просто", "w_прохожий", "w_прямо", "w_углом"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adverb", "noun", "verb"], agreement_tags: {semantic: ["w_дойти", "w_музей", "w_прямо", "w_идите", "w_направо", "w_потом"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_музея"}}
  p3: &p3 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_прямо"}}
  p4: &p4 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_потом"}}
  p5: &p5 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_направо"}}
  p6: &p6 {language_code: "ru", part_of_speech: ["adverb", "noun", "preposition", "verb"], agreement_tags: {semantic: ["w_налево", "w_поверните", "w_квартал", "w_далеко", "w_отсюда", "w_за"]}}
  p7: &p7 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: ["w_налево", "w_направо"]}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_углом"}}
  p9: &p9 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_квартала"}}
  p10: &p10 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_далеко"}}
  p11: &p11 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_отсюда"}}
  p12: &p12 {language_code: "ru", part_of_speech: ["adverb", "noun", "verb"], agreement_tags: {semantic: ["w_налево", "w_поверните", "w_квартал", "w_далеко", "w_отсюда"]}}
  p13: &p13 {language_code: "ru", part_of_speech: ["adverb", "noun", "verb"], agreement_tags: {semantic: ["w_простите", "w_прохожий", "w_просто", "w_пешком", "w_далеко"]}}
  p14: &p14 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_просто"}}
  p15: &p15 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_минут"}}
  p16: &p16 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_пешком"}}
  p17: &p17 {language_code: "ru", part_of_speech: ["adverb", "noun", "verb"], agreement_tags: {semantic: ["w_простите", "w_прохожий", "w_просто", "w_пешком"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit10.lesson01.choose.001
    lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Идите is the polite вы command meaning go; ты would use иди.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson01.listen.002
    lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Directions are strung together with потом, then: Идите прямо, потом направо.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson01.order.003
    lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
    type: word_order
    frame: {text: "Как дойти до {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Как дойти до {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "До means as far as and takes the genitive, so музей becomes музея.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson01.fill.004
    lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
    type: fill_in_blank
    frame: {text: "Идите {item}, потом направо. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Прямо means straight ahead and does not change its ending.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson01.translate.005
    lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
    type: translation
    frame: {text: "How do I get to the museum?", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Как дойти до {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Как дойти до ...? asks how to get somewhere on foot; the place after до goes in the genitive.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson01.translate.006
    lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
    type: translation
    frame: {text: "Go straight, then to the right. (formal)", language_code: "en", direction: "ltr"}
    slots: {a: *p3, b: *p4, c: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Идите {a}, {b} {c}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Идите прямо, потом направо is the typical shape of a short set of directions.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson02.choose.001
    lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Поверните is the polite вы command meaning turn; налево and направо say which way.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson02.order.002
    lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
    type: word_order
    frame: {text: "Поверните {item} за углом.", language_code: "ru", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Поверните {item} за углом.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Налево and направо both fit after поверните.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson02.fill.003
    lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
    type: fill_in_blank
    frame: {text: "Поверните налево за {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "За takes the instrumental case here, so угол becomes углом: за углом means around the corner.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson02.fill.004
    lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
    type: fill_in_blank
    frame: {text: "Идите два {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After 2, 3 and 4 the noun takes a special form: два квартала, but пять кварталов.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson02.translate.005
    lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
    type: translation
    frame: {text: "Is it far from here?", language_code: "en", direction: "ltr"}
    slots: {a: *p10, b: *p11}
    answer_derivation: {kind: "render_frame", frame: {text: "Это {a} {b}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Далеко is far, and отсюда is from here; Это далеко отсюда? is a common question.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson02.translate.006
    lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p12}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Квартал is the city block, and далеко means far.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson03.choose.001
    lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Простите is the polite вы way to get a stranger's attention, like excuse me.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson03.order.002
    lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
    type: word_order
    frame: {text: "Это очень {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "Это очень {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Это очень просто means it is very simple; no verb to be is needed.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson03.fill.003
    lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
    type: fill_in_blank
    frame: {text: "Нет, пять {item} пешком. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After пять the noun is in the plural genitive: пять минут.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson03.translate.004
    lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
    type: translation
    frame: {text: "It is very simple.", language_code: "en", direction: "ltr"}
    slots: {item: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "Это очень {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "After это, просто works as the predicate it is simple, so no verb to be is needed.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson03.translate.005
    lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
    type: translation
    frame: {text: "Five minutes on foot.", language_code: "en", direction: "ltr"}
    slots: {a: *p15, b: *p16}
    answer_derivation: {kind: "render_frame", frame: {text: "Пять {a} {b}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Пешком means on foot, and минут follows пять in the plural genitive.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit10.lesson03.translate.006
    lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p17}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Прохожий is a masculine noun that comes from an adjective and means passerby.", language_code: "en", direction: "ltr"}
