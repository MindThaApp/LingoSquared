  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-ru A2 practice pack) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py (curated w_<token> pools of this unit's own tokens). Sentence frames use single anchors or small unions in which every member is grammatical; case forms are glossed with their case, and English prompts name ты/вы or the speaker's gender where the Russian form depends on it. Reviewer: confirm по новому адресу, к десяти and the formal приходите/скажите register at a registration office.
