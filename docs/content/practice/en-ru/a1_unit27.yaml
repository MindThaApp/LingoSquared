schema_version: '1.0'
pack_key: practice.en-ru.a1.unit27
source_language: en
target_language: ru
unit_content_key: ru.a1.unit27.animals
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u27 / w_<token>). 34 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_винительном, w_времени, w_гуляешь, w_гуляю, w_даёт, w_домашнего, w_домашнее, w_животное, w_животных, w_здорово, w_играет, w_каждый, w_коричневая, w_корм, w_кормить, w_кормлю, w_кошек, w_кошка, w_любим, w_любить, w_любят, w_маленький, w_одушевлённых, w_птиц, w_птица, w_рыба, w_своей, w_сказать, w_слово, w_собак, w_собака, w_творительном, w_человеке, w_шерсть]
templates:
- content_key: practice.en-ru.ru.a1.unit27.lesson01.choose.001
  lesson_content_key: ru.a1.unit27.lesson01.sobaka_koshka_ryba_i
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_животное, w_домашнее, w_собака, w_кошка, w_рыба, w_птица, w_домашнего, w_слово, w_времени, w_каждый, w_гуляю, w_творительном, w_кормить, w_кормлю, w_играет, w_своей, w_любить, w_винительном, w_одушевлённых, w_собак, w_кошек, w_птиц, w_животных, w_коричневая, w_шерсть, w_маленький, w_сказать, w_человеке, w_гуляешь, w_любят, w_даёт, w_корм, w_здорово, w_любим]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on dog, cat, fish, and bird.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit27.lesson02.listen.001
  lesson_content_key: ru.a1.unit27.lesson02.zabotimsya_o_domashnem_zhivotnom
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on caring for a pet.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit27.lesson03.translate.001
  lesson_content_key: ru.a1.unit27.lesson03.lyubit_zhivotnykh
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on loving animals.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit27.lesson04.match.001
  lesson_content_key: ru.a1.unit27.lesson04.dima_sprashivaet_o_sobake
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit27.lesson05.choose.001
