schema_version: "1.0"
pack_key: practice.en-ru.a1.unit03
source_language: en
target_language: ru
unit_content_key: ru.a1.unit03.numbers
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job A) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number) are tested only through single-anchor fill-in or fixed-sentence items so no bare-word prompt has two defensible answers. Feedback lines carry a usage or grammar point.
    Reviewer: check the ты/вы register labels in the English prompts and the case/number notes in feedback (genitive after из, 2-4 vs 5+ noun forms, genitive of clock-time parts of day). No character facts are asserted.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_брат", "w_вам", "w_восемь", "w_два", "w_девять", "w_десять", "w_книга", "w_лет", "w_один", "w_покупатель", "w_продавец", "w_пять", "w_рублей", "w_рубль", "w_рубля", "w_семь", "w_стоит", "w_стоят", "w_три", "w_хлеб", "w_четыре", "w_шесть", "w_это", "w_яблоки"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_один", "w_два", "w_три", "w_четыре", "w_пять", "w_брат", "w_книга", "w_рубль"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_один", "w_два", "w_три", "w_четыре", "w_пять"]}}
  p3: &p3 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_один", "w_два", "w_три", "w_четыре", "w_пять", "w_шесть", "w_семь", "w_восемь", "w_девять", "w_десять"]}}
  p4: &p4 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_два", "w_три", "w_четыре"]}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_рублей"}}
  p6: &p6 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_два"}}
  p7: &p7 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_один", "w_два", "w_три", "w_четыре", "w_пять", "w_шесть", "w_семь", "w_восемь", "w_девять", "w_десять", "w_брат", "w_книга", "w_рубль"]}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_пять", "w_шесть", "w_семь", "w_восемь", "w_девять", "w_десять"]}}
  p9: &p9 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_лет"}}
  p10: &p10 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_десять"}}
  p11: &p11 {language_code: "ru", part_of_speech: "pronoun", agreement_tags: {semantic: "w_вам"}}
  p12: &p12 {language_code: "ru", part_of_speech: ["noun", "pronoun", "verb"], agreement_tags: {semantic: ["w_это", "w_стоит", "w_стоят", "w_яблоки", "w_покупатель", "w_продавец", "w_хлеб"]}}
  p13: &p13 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_стоит"}}
  p14: &p14 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_стоят"}}
  p15: &p15 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_хлеб"}}
  p16: &p16 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_рубля"}}
templates:
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.choose.001
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "A Russian noun changes after numbers: один рубль, два рубля, пять рублей.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.listen.002
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "After 2, 3 and 4 the noun takes a special form (два брата, три рубля), and from 5 up it takes the plural genitive (пять рублей).", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.match.003
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p3, second: *p3, third: *p3, fourth: *p3, fifth: *p3, sixth: *p3}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Numbers 2-4 make the noun change one way (брат becomes брата) and numbers 5 and up another (книга becomes книг).", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.order.004
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: word_order
    frame: {text: "У меня {item} брата.", language_code: "ru", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня {item} брата.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Два, три and четыре all take the same noun form, брата, so any of them fits here.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.fill.005
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: fill_in_blank
    frame: {text: "Пять {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After пять and every number above it the noun is in the plural genitive: рублей, not рубль.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.translate.006
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: translation
    frame: {text: "I have two brothers.", language_code: "en", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня {item} брата.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "У меня два брата literally says at me there are two brothers; брата is the form used after 2, 3 and 4.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson01.translate.007
    lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Learn the counting forms first (один, два, три, четыре, пять); the noun after them then changes, as in один рубль, два рубля, пять рублей.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson02.listen.001
    lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p3}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Numbers from 5 to 10 all take the plural genitive noun: пять книг, девять книг, десять книг.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson02.order.002
    lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
    type: word_order
    frame: {text: "У меня {item} книг.", language_code: "ru", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "У меня {item} книг.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "After the numbers 5-10 the noun is in the plural genitive, so книга becomes книг.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson02.order.003
    lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
    type: word_order
    frame: {text: "Мне {item} лет.", language_code: "ru", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item} лет.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Russians say their age with мне, literally to me, and after 5 and up the noun is лет.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson02.fill.004
    lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
    type: fill_in_blank
    frame: {text: "Мне десять {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "After numbers from five up, age uses лет in the plural genitive.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson02.translate.005
    lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
    type: translation
    frame: {text: "I am ten years old.", language_code: "en", direction: "ltr"}
    slots: {item: *p10}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {item} лет.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Age is expressed with мне, to me, plus the number and лет; there is no verb.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson02.translate.006
    lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
    type: translation
    frame: {text: "How old are you? (formal)", language_code: "en", direction: "ltr"}
    slots: {item: *p11}
    answer_derivation: {kind: "render_frame", frame: {text: "Сколько {item} лет?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Сколько вам лет? uses the formal вам, literally to you; it asks how many years to you.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson03.choose.001
    lesson_content_key: ru.a1.unit03.lesson03.na_rynke
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Russian says Сколько стоит? for one item and Сколько стоят? for several, so the verb agrees with what is being bought.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson03.order.002
    lesson_content_key: ru.a1.unit03.lesson03.na_rynke
    type: word_order
    frame: {text: "Сколько это {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "render_frame", frame: {text: "Сколько это {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Сколько это стоит? is the all-purpose how-much question; стоит is the form for one thing.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson03.fill.003
    lesson_content_key: ru.a1.unit03.lesson03.na_rynke
    type: fill_in_blank
    frame: {text: "Сколько {item} яблоки? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Яблоки is plural, so the verb is стоят; for one item (хлеб) it would be стоит.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson03.translate.004
    lesson_content_key: ru.a1.unit03.lesson03.na_rynke
    type: translation
    frame: {text: "How much does the bread cost?", language_code: "en", direction: "ltr"}
    slots: {item: *p15}
    answer_derivation: {kind: "render_frame", frame: {text: "Сколько стоит {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Хлеб is a single item, so the verb is стоит; with plural яблоки it would be стоят.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit03.lesson03.translate.005
    lesson_content_key: ru.a1.unit03.lesson03.na_rynke
    type: translation
    frame: {text: "Three rubles.", language_code: "en", direction: "ltr"}
    slots: {item: *p16}
    answer_derivation: {kind: "render_frame", frame: {text: "Три {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "After три the noun takes its 2-4 form рубля, different from рублей after 5 and up.", language_code: "en", direction: "ltr"}
