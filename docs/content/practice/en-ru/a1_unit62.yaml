  lesson_content_key: ru.a1.unit62.lesson02.buket_i_tsvet
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the bouquet and the color.', language_code: en, direction: ltr}
