schema_version: '1.0'
pack_key: practice.en-ru.a1.unit62
source_language: en
target_language: ru
unit_content_key: ru.a1.unit62.florist
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u62 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_букет, w_классное, w_книжный, w_красивыми, w_красная, w_лента, w_лентой, w_роз, w_роза, w_розу, w_розы, w_тюльпан, w_цветок, w_цветы]
templates:
- content_key: practice.en-ru.ru.a1.unit62.lesson01.choose.001
  lesson_content_key: ru.a1.unit62.lesson01.davay_skhodim_v_tsvetochnyy
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_классное, w_цветок, w_букет, w_роза, w_красная, w_розу, w_тюльпан, w_цветы, w_роз, w_лента, w_лентой, w_розы, w_красивыми, w_книжный]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the flower shop?.', language_code: en, direction: ltr}
