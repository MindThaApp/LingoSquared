  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'We started to work very diligently. A literal, plain phrasing. The idiomatic rewrite uses засучили рукава.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson06.order.002
  lesson_content_key: ru.c1.unit06.idiomy.lesson06.polnyj_obraznyj_otvet
  type: word_order
  frame: {text: '«Как снег на голову» — это {item}.', language_code: ru, direction: ltr}
  slots:
    item:
