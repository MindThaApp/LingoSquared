schema_version: '1.0'
pack_key: practice.en-ru.c1.unit06
source_language: en
target_language: ru
unit_content_key: ru.c1.unit06.idiomy
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u6 / w_<token>). 26 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_голову, w_горем, w_двух, w_дело, w_засучили, w_золотые, w_идиома, w_кота, w_начали, w_неожиданно, w_новость, w_очень, w_покладая, w_пополам, w_появилась, w_пришла, w_работали, w_работать, w_рук, w_рукава, w_словах, w_снег, w_спустя, w_усердно, w_хвост, w_шляпе]
templates:
- content_key: practice.en-ru.ru.c1.unit06.lesson01.choose.001
  lesson_content_key: ru.c1.unit06.idiomy.lesson01.obrazno_ili_bukvalno
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_двух, w_словах, w_снег, w_голову, w_новость, w_пришла, w_засучили, w_рукава, w_работали, w_покладая, w_рук, w_спустя, w_дело, w_шляпе, w_кота, w_хвост, w_горем, w_пополам, w_золотые, w_появилась, w_неожиданно, w_начали, w_работать, w_очень, w_усердно, w_идиома]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on figurative or literal.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson02.listen.001
  lesson_content_key: ru.c1.unit06.idiomy.lesson02.rabotat_zasuchiv_rukava
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on working with your sleeves rolled up.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson03.translate.001
  lesson_content_key: ru.c1.unit06.idiomy.lesson03.delo_v_shlyape
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on it''s in the bag.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson04.match.001
  lesson_content_key: ru.c1.unit06.idiomy.lesson04.chitayu_obraznyj_tekst
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson05.choose.001
  lesson_content_key: ru.c1.unit06.idiomy.lesson05.perepisyvayu_bukvalno
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on from literal to idiomatic.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson06.translate.001
  lesson_content_key: ru.c1.unit06.idiomy.lesson06.polnyj_obraznyj_otvet
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the complete idiomatic response.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson01.order.002
  lesson_content_key: ru.c1.unit06.idiomy.lesson01.obrazno_ili_bukvalno
  type: word_order
  frame: {text: 'Новость пришла как {item} на голову.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_снег}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Новость пришла как {item} на голову.', language_code: ru, direction: ltr}
  feedback_frame: {text: The news came out of the blue. Новость пришла как снег на голову is the natural idiomatic version of the literal sentence above., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson01.fill.003
  lesson_content_key: ru.c1.unit06.idiomy.lesson01.obrazno_ili_bukvalno
  type: fill_in_blank
  frame:
    text: «Как снег на {item}» — это идиома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_голову}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_голову}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: «Like snow on the head» is an idiom. голову means head (object form)., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson02.order.002
  lesson_content_key: ru.c1.unit06.idiomy.lesson02.rabotat_zasuchiv_rukava
  type: word_order
  frame: {text: 'Мы {item} рукава и работали не покладая рук.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_засучили}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мы {item} рукава и работали не покладая рук.', language_code: ru, direction: ltr}
  feedback_frame: {text: We rolled up our sleeves and worked tirelessly. Pairs the effort idiom засучили рукава with не покладая рук., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson02.fill.003
  lesson_content_key: ru.c1.unit06.idiomy.lesson02.rabotat_zasuchiv_rukava
  type: fill_in_blank
  frame:
    text: Мы засучили {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_рукава}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_рукава}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: We rolled up our sleeves. Мы засучили рукава is the natural idiomatic rewrite., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson03.order.002
  lesson_content_key: ru.c1.unit06.idiomy.lesson03.delo_v_shlyape
  type: word_order
  frame: {text: 'В итоге {item} в шляпе.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_дело}
  answer_derivation:
    kind: render_frame
    frame: {text: 'В итоге {item} в шляпе.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'In the end, it''s in the bag. В итоге (''in the end'') introduces the closing idiom дело в шляпе.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson05.order.002
  lesson_content_key: ru.c1.unit06.idiomy.lesson05.perepisyvayu_bukvalno
  type: word_order
  frame: {text: 'Новость {item} неожиданно.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_появилась}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Новость {item} неожиданно.', language_code: ru, direction: ltr}
  feedback_frame: {text: The news appeared unexpectedly. This literal sentence states the fact plainly. The idiomatic rewrite replaces it with как снег на голову., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit06.lesson05.fill.003
  lesson_content_key: ru.c1.unit06.idiomy.lesson05.perepisyvayu_bukvalno
