  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on see you saturday in the park!.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson01.order.002
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: word_order
  frame: {text: 'Я {item} телефоном.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_пользуюсь}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я {item} телефоном.', language_code: ru, direction: ltr}
  feedback_frame: {text: I use my phone. пользуюсь means I use., language_code: en, direction: ltr}
