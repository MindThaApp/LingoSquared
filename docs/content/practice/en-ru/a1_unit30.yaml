  feedback_frame: {text: I'll send a message through the app. отправлю means I will send., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson03.order.002
  lesson_content_key: ru.a1.unit30.lesson03.ishchem_chto_to
  type: word_order
