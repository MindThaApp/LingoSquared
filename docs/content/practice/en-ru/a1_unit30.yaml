  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_погоды}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_погоды}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I look up the weather forecast. погоды means weather (genitive case, in ''weather forecast'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson02.translate.004
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: translation
  frame: {text: I'll send a message through the app., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
