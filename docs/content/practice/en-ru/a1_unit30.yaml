  type: fill_in_blank
  frame:
    text: Я каждый день пользуюсь {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_телефоном}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_телефоном}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I use my phone every day. Каждый день (every day) is reused: Я каждый день пользуюсь телефоном. After пользоваться the thing is in the instrumental.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson01.translate.004
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: translation
  frame: {text: Nastya uses a computer., language_code: en, direction: ltr}
