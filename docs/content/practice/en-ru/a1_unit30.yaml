schema_version: '1.0'
pack_key: practice.en-ru.a1.unit30
source_language: en
target_language: ru
unit_content_key: ru.a1.unit30.technology
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u30 / w_<token>). 31 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_вижу, w_звонит, w_знаешь, w_интернет, w_искать, w_ищет, w_ищу, w_каждое, w_компьютер, w_компьютером, w_назвать, w_отправлю, w_отправляет, w_отправлять, w_парк, w_побегаю, w_погоды, w_поиграю, w_поищу, w_пользоваться, w_пользуется, w_пользуешься, w_пользуюсь, w_поплаваю, w_приду, w_приложение, w_прогноза, w_солнечно, w_телефоном, w_уже, w_читает]
templates:
- content_key: practice.en-ru.ru.a1.unit30.lesson01.choose.001
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_пользоваться, w_пользуюсь, w_телефоном, w_компьютер, w_пользуется, w_компьютером, w_интернет, w_приложение, w_прогноза, w_погоды, w_отправлю, w_отправлять, w_отправляет, w_читает, w_искать, w_ищу, w_ищет, w_поищу, w_солнечно, w_вижу, w_уже, w_знаешь, w_назвать, w_звонит, w_каждое, w_пользуешься, w_побегаю, w_поиграю, w_поплаваю, w_приду, w_парк]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on phone, computer, and internet.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson02.listen.001
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the app and sending a message.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson03.translate.001
  lesson_content_key: ru.a1.unit30.lesson03.ishchem_chto_to
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on looking something up.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson04.match.001
  lesson_content_key: ru.a1.unit30.lesson04.nastya_otpravlyaet_soobshchenie
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit30.lesson05.choose.001
  lesson_content_key: ru.a1.unit30.lesson05.kto_chem_polzuetsya
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who uses what?.', language_code: en, direction: ltr}
