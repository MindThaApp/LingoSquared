    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_здороваться}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_здороваться}
