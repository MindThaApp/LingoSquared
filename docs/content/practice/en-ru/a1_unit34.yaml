schema_version: '1.0'
pack_key: practice.en-ru.a1.unit34
source_language: en
target_language: ru
unit_content_key: ru.a1.unit34.neighbourhood
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u34 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_давно, w_дружелюбный, w_здоровается, w_здороваться, w_здороваюсь, w_знает, w_знать, w_знают, w_район, w_сосед, w_соседа, w_супермаркет, w_хорошем]
templates:
- content_key: practice.en-ru.ru.a1.unit34.lesson01.choose.001
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_район, w_хорошем, w_супермаркет, w_сосед, w_соседа, w_знать, w_дружелюбный, w_здороваться, w_здороваюсь, w_давно, w_здоровается, w_знает, w_знают]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the neighborhood.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson02.listen.001
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on my male and female neighbor.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson03.translate.001
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on friendly and greeting.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson04.match.001
  lesson_content_key: ru.a1.unit34.lesson04.nastya_znakomitsya_s_pavlom
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson05.choose.001
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who''s who in the neighborhood?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson01.translate.002
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the neighborhood.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson01.order.003
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: word_order
  frame: {text: 'Мой {item} рядом с супермаркетом.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_район}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мой {item} рядом с супермаркетом.', language_code: ru, direction: ltr}
  feedback_frame: {text: My neighborhood is near the supermarket. район means neighborhood., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson01.fill.004
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: fill_in_blank
  frame:
    text: Я живу в {item} районе в Казани. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_хорошем}
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_хорошем}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I live in a nice neighborhood in Kazan. хорошем means good, nice (masc., after the word for ''in'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson02.order.002
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: word_order
  frame: {text: 'Павел {item} Димы.', language_code: ru, direction: ltr}
