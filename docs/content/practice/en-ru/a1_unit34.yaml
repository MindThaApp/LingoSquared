      agreement_tags: {semantic: w_соседа}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'My neighbor is called Pavel. соседа means neighbor (masc., accusative), as in ''my neighbor is called''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson03.order.002
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: word_order
