  feedback_frame: {text: Pavel is friendly and he likes to greet me. здороваться means to greet., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit34.lesson03.translate.004
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
