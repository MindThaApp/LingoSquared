schema_version: '1.0'
pack_key: practice.en-ru.c1.unit05
source_language: en
target_language: ru
unit_content_key: ru.c1.unit05.kontrfaktualy
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u5 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_анализ, w_было, w_выглядело, w_деле, w_долго, w_изменилось, w_иначе, w_контрфактуальный, w_могло, w_надо, w_пошло, w_предложили, w_работу, w_раньше, w_решать, w_решением, w_решительности, w_сложилось, w_сложиться, w_согласиться, w_сомнения, w_тогда, w_тянуть, w_хватило]
templates:
- content_key: practice.en-ru.ru.c1.unit05.lesson01.choose.001
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson01.nado_bylo
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_надо, w_было, w_тогда, w_согласиться, w_сложилось, w_иначе, w_могло, w_сложиться, w_предложили, w_работу, w_пошло, w_сомнения, w_выглядело, w_долго, w_тянуть, w_решением, w_решать, w_раньше, w_хватило, w_решительности, w_деле, w_изменилось, w_контрфактуальный, w_анализ]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on should have.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson02.listen.001
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson02.tretiy_tip
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the third type: если бы.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson03.translate.001
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson03.smeshannyj_tip
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the mixed conditional.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson04.match.001
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson04.sozhalenie
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson05.choose.001
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson05.cep_kontrfaktualov
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the counterfactual chain.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson06.translate.001
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson06.polnyj_analiz
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the complete analysis.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson01.order.002
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson01.nado_bylo
  type: word_order
  frame: {text: 'Не {item} было так долго тянуть с решением.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_надо}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Не {item} было так долго тянуть с решением.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I should not have dragged out the decision so long. This sentence regrets the delay — the regret is about the timing of the decision, not about the decision itself, and no hypothetical result is stated.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson01.fill.003
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson01.nado_bylo
  type: fill_in_blank
  frame:
    text: Надо {item} тогда согласиться. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_было}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_было}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I should have agreed back then. Надо было (''should have'' — literally ''it was necessary'') plus an infinitive expresses a past obligation that was not met. Тогда = ''back then''. The whole phrase is gender-neutral, so any speaker can.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson01.translate.004
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson01.nado_bylo
  type: translation
  frame: {text: 'I should have agreed back then, and everything would have turned out differently.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_тогда}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Надо было {item} согласиться, и всё сложилось бы иначе.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I should have agreed back then, and everything would have turned out differently. This is a past counterfactual: an unmet past obligation (надо было согласиться) is linked by и (and) to a past hypothetical result (всё сложилось.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson02.order.002
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson02.tretiy_tip
  type: word_order
  frame: {text: 'Если бы мне тогда {item} эту работу, всё сложилось бы иначе.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_предложили}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Если бы мне тогда {item} эту работу, всё сложилось бы иначе.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'If I had been offered this job back then, everything would have turned out differently. This third-type conditional pairs an unreal past condition (если бы ... предложили) with a past hypothetical result (всё сложилось бы иначе)..', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson03.order.002
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson03.smeshannyj_tip
  type: word_order
  frame: {text: 'Если бы не мои {item}, сейчас всё было бы иначе.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_сомнения}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Если бы не мои {item}, сейчас всё было бы иначе.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'If not for my doubts, now everything would be different. A mixed conditional links a past unreal condition (если бы не мои сомнения) to a present consequence (сейчас всё было бы иначе). The condition is past, the consequence is.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson04.order.002
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson04.sozhalenie
  type: word_order
  frame: {text: 'Не надо было так {item} тянуть с решением.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_долго}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Не надо было так {item} тянуть с решением.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I should not have dragged out the decision so long. This sentence regrets the delay — the regret is about the timing of the decision, not about the decision itself, and no hypothetical result is stated.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit05.lesson06.order.002
  lesson_content_key: ru.c1.unit05.kontrfaktualy.lesson06.polnyj_analiz
  type: word_order
  frame: {text: 'Это {item} анализ.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_контрфактуальный}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это {item} анализ.', language_code: ru, direction: ltr}
  feedback_frame: {text: This is a counterfactual analysis. контрфактуальный means counterfactual (masc.)., language_code: en, direction: ltr}
