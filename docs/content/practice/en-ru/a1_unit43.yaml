- content_key: practice.en-ru.ru.a1.unit43.lesson04.match.001
  lesson_content_key: ru.a1.unit43.lesson04.zaselenie_u_stoyki
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
