schema_version: "1.0"
pack_key: practice.en-ru.a1.unit24
source_language: en
target_language: ru
unit_content_key: ru.a1.unit24.money
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job C) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items, and inflected variants of a noun are kept out of bare-word pools so no prompt has two defensible answers. English prompts name informal/formal address and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the informal/formal labels in the English prompts and the case notes in feedback. No character facts are asserted and no speaker names are baked into any card.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_карта", "w_картой", "w_наличными", "w_нужен", "w_нужны", "w_рубли", "w_только", "w_триста", "w_чек"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adjective", "adverb", "noun"], agreement_tags: {semantic: ["w_карта", "w_наличными", "w_рубли", "w_нужны"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_картой"}}
  p3: &p3 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_нужны"}}
  p4: &p4 {language_code: "ru", part_of_speech: "adverb", agreement_tags: {semantic: "w_наличными"}}
  p5: &p5 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_рубли"}}
  p6: &p6 {language_code: "ru", part_of_speech: ["adjective", "noun", "particle"], agreement_tags: {semantic: ["w_чек", "w_нужен", "w_триста", "w_только"]}}
  p7: &p7 {language_code: "ru", part_of_speech: "adjective", agreement_tags: {semantic: "w_нужен"}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_триста"}}
  p9: &p9 {language_code: "ru", part_of_speech: "particle", agreement_tags: {semantic: "w_только"}}
  p10: &p10 {language_code: "ru", part_of_speech: ["noun", "particle"], agreement_tags: {semantic: ["w_чек", "w_триста", "w_только"]}}
  p11: &p11 {language_code: "ru", part_of_speech: ["adjective", "adverb", "noun"], agreement_tags: {semantic: ["w_карта", "w_наличными", "w_рубли", "w_нужны", "w_чек", "w_триста"]}}
  p12: &p12 {language_code: "ru", part_of_speech: ["adverb", "noun"], agreement_tags: {semantic: ["w_карта", "w_наличными", "w_рубли", "w_чек"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.choose.001
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Наличными means in cash and картой means by card; both use the instrumental case.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.order.002
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: word_order
    frame: {text: "Можно {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Можно {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Можно plus the instrumental form asks whether you can pay that way.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.fill.003
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: fill_in_blank
    frame: {text: "Можно {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Карта becomes картой, by card, after можно.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.fill.004
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: fill_in_blank
    frame: {text: "Мне {item} рубли. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Нужны agrees with the plural noun рубли.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.translate.005
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: translation
    frame: {text: "Can I pay by card?", language_code: "en", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Можно {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Можно plus картой asks whether paying by card is possible.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.translate.006
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: translation
    frame: {text: "You can pay in cash.", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Можно {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Можно means it is possible.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.translate.007
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: translation
    frame: {text: "I need rubles.", language_code: "en", direction: "ltr"}
    slots: {a: *p3, b: *p5}
    answer_derivation: {kind: "render_frame", frame: {text: "Мне {a} {b}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Нужны agrees with the plural рубли.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.choose.001
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p6}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Чек is masculine, so it takes нужен; with plural things it would be нужны.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.order.002
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: word_order
    frame: {text: "Чек {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Чек {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Нужен agrees with the masculine noun чек.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.fill.003
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: fill_in_blank
    frame: {text: "С вас {item} рублей. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Триста, three hundred, is followed by the plural рублей.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.fill.004
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: fill_in_blank
    frame: {text: "Сегодня {item} наличными. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Только limits what follows, like only.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.fill.005
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: fill_in_blank
    frame: {text: "Чек {item}? ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Нужен is masculine and agrees with чек.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.translate.006
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: translation
    frame: {text: "Is a receipt needed?", language_code: "en", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "render_frame", frame: {text: "Чек {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Нужен is masculine to match чек.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.translate.007
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: translation
    frame: {text: "That will be three hundred rubles.", language_code: "en", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "С вас {item} рублей.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "С вас literally means from you, the cashier's polite way to state a price.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.translate.008
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: translation
    frame: {text: "Cash only today.", language_code: "en", direction: "ltr"}
    slots: {item: *p9}
    answer_derivation: {kind: "render_frame", frame: {text: "Сегодня {item} наличными.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Только goes before what it limits.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.translate.009
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p10}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "These are everyday words at a cash desk.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson02.match.010
    lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p11, second: *p11, third: *p11, fourth: *p11, fifth: *p11, sixth: *p11}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Нужны is used with plural things and нужен with a masculine singular thing.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit24.lesson01.listen.008
    lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p12}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Наличными means in cash; карта, рубли and чек are the plain nouns of payment.", language_code: "en", direction: "ltr"}
