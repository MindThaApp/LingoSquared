schema_version: '1.0'
pack_key: practice.en-ru.b2.unit07
source_language: en
target_language: ru
unit_content_key: ru.b2.unit07.peregovory
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_b2_u7 / w_<token>). 51 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_буду, w_вместе, w_давай, w_делать, w_день, w_договорились, w_договориться, w_должен, w_завтра, w_испекла, w_испеку, w_испечь, w_испечёшь, w_купим, w_купить, w_купишь, w_куплю, w_надо, w_некогда, w_поговорим, w_поговорить, w_поделим, w_поделить, w_полностью, w_получится, w_получиться, w_поровну, w_праздника, w_предлагать, w_предлагаю, w_предложение, w_прийти, w_пришли, w_разделим, w_разделить, w_расходы, w_рождения, w_согласиться, w_соглашению, w_счёт, w_торт, w_уберёшь, w_убирать, w_украшения, w_условии, w_устраиваем, w_устраивать, w_устроим, w_устроить, w_хочешь, w_хочу]
templates:
- content_key: practice.en-ru.ru.b2.unit07.lesson01.choose.001
  lesson_content_key: ru.b2.unit07.lesson01.predlozhenie
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_вместе, w_устраиваем, w_устраивать, w_день, w_рождения, w_торт, w_испечь, w_испеку, w_украшения, w_купить, w_куплю, w_купишь, w_предлагаю, w_предлагать, w_испекла, w_давай, w_устроим, w_устроить, w_разделим, w_разделить, w_расходы, w_предложение, w_испечёшь, w_получится, w_получиться, w_согласиться, w_надо, w_убирать, w_должен, w_праздника, w_делать, w_уберёшь, w_хочу, w_условии, w_договорились, w_договориться, w_полностью, w_счёт, w_поделим, w_поделить, w_поровну, w_пришли, w_прийти, w_соглашению, w_купим, w_буду, w_некогда, w_поговорим, w_поговорить, w_завтра, w_хочешь]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on making a proposal.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson02.listen.001
  lesson_content_key: ru.b2.unit07.lesson02.vezhlivyj_otkaz
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on declining politely.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson03.translate.001
  lesson_content_key: ru.b2.unit07.lesson03.uslovie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on attaching a condition.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson04.match.001
  lesson_content_key: ru.b2.unit07.lesson04.dogovorilis
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson05.choose.001
  lesson_content_key: ru.b2.unit07.lesson05.chitat_soglashenie
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what was agreed?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson06.translate.001
  lesson_content_key: ru.b2.unit07.lesson06.peregovory_v_razgovore
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on negotiating in conversation.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson01.order.002
  lesson_content_key: ru.b2.unit07.lesson01.predlozhenie
  type: word_order
  frame: {text: 'Мы {item} устраиваем день рождения.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_вместе}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мы {item} устраиваем день рождения.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'We''re organizing a birthday party together. The situation this whole unit negotiates: you and Дима are organizing a birthday party for a friend and have to divide the work. День рождения = ''birthday''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson01.fill.003
  lesson_content_key: ru.b2.unit07.lesson01.predlozhenie
  type: fill_in_blank
  frame:
    text: Давай устроим {item} рождения? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_день}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_день}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Shall we organize a birthday party? день means day.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson01.translate.004
  lesson_content_key: ru.b2.unit07.lesson01.predlozhenie
  type: translation
  frame: {text: 'Nastya: Shall we organize a birthday party together?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_рождения}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Давай вместе устроим день {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Nastya: Shall we organize a birthday party together? рождения means birth (genitive case, in ''birthday'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson02.order.002
  lesson_content_key: ru.b2.unit07.lesson02.vezhlivyj_otkaz
  type: word_order
  frame: {text: 'К сожалению, это не {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_получится}
  answer_derivation:
    kind: render_frame
    frame: {text: 'К сожалению, это не {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Unfortunately, that won''t work out. К сожалению, это не получится is the everyday polite decline -- literally ''unfortunately, this won''t come out / succeed''. К сожалению keeps it soft rather than blunt.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson02.fill.003
  lesson_content_key: ru.b2.unit07.lesson02.vezhlivyj_otkaz
  type: fill_in_blank
  frame:
    text: Я не могу с этим {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_согласиться}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_согласиться}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I can''t agree to that. Я не могу с этим согласиться = ''I can''t agree to that'' -- a firmer, still-polite refusal of a proposed term. Согласиться = ''to agree'' (perfective infinitive).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson02.translate.004
  lesson_content_key: ru.b2.unit07.lesson02.vezhlivyj_otkaz
  type: translation
  frame: {text: It's better not to do that., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_надо}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это лучше не {item} делать.', language_code: ru, direction: ltr}
  feedback_frame: {text: It's better not to do that. надо means necessary; must., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson03.order.002
  lesson_content_key: ru.b2.unit07.lesson03.uslovie
  type: word_order
  frame: {text: 'Если ты {item}, то я испеку торт.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_уберёшь}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Если ты {item}, то я испеку торт.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'If you clean up, then I''ll bake the cake. уберёшь means you will clean up (informal).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson03.fill.003
  lesson_content_key: ru.b2.unit07.lesson03.uslovie
  type: fill_in_blank
  frame:
    text: Я не {item} убирать сегодня. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_хочу}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_хочу}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I don't want to clean up today. хочу means I want., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson03.translate.004
  lesson_content_key: ru.b2.unit07.lesson03.uslovie
  type: translation
  frame: {text: 'I''ll buy the decorations, on condition that you bake the cake.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_условии}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я куплю украшения, при {item}, что ты испечёшь торт.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'I''ll buy the decorations, on condition that you bake the cake. условии means condition (after ''on'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson04.order.002
  lesson_content_key: ru.b2.unit07.lesson04.dogovorilis
  type: word_order
  frame: {text: 'Мы делим {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_счёт}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мы делим {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: We're splitting the bill. счёт means bank account., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson04.fill.003
  lesson_content_key: ru.b2.unit07.lesson04.dogovorilis
  type: fill_in_blank
  frame:
    text: Давай {item} счёт поровну. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_поделим}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_поделим}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Shall we split the bill equally? Давай поделим счёт поровну = ''shall we split the bill equally?''. Поделить = ''to split / divide''; поровну = ''equally / evenly''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson04.translate.004
  lesson_content_key: ru.b2.unit07.lesson04.dogovorilis
  type: translation
  frame: {text: We reached an agreement., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_пришли}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мы {item} к соглашению.', language_code: ru, direction: ltr}
  feedback_frame: {text: We reached an agreement. Прийти к соглашению = 'to reach an agreement / come to terms'. Мы пришли к соглашению = 'we reached an agreement' -- the goal of the whole exchange., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit07.lesson06.order.002
  lesson_content_key: ru.b2.unit07.lesson06.peregovory_v_razgovore
  type: word_order
  frame: {text: 'Разве что ты сам {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_хочешь}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Разве что ты сам {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Unless you want to (do it) yourself. Сам = ''(your)self'' (said to a male; to a female: сама). Хочешь = ''you want''.', language_code: en, direction: ltr}
