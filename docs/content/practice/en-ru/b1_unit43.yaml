    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from lesson 2 of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.translate.002
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words from lesson 2.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.match.001
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ru, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the words of the unit on reporting what someone said or asked.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson01.translate.002
    lesson_content_key: ru.b1.unit43.lesson01.chto_skazal_dima
    type: translation
    frame: {text: "Dima said that he will come to the office.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Дима сказал, что он {item} в офис.", language_code: ru, direction: ltr}, accepted_variants: ["Дима сказал, что {item} в офис.", "Дима сказал, что он придет в офис.", "Дима сказал, что придет в офис."]}
    feedback_frame: {text: "In reported speech the future stays in the future.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson01.translate.003
    lesson_content_key: ru.b1.unit43.lesson01.chto_skazal_dima
    type: translation
    frame: {text: "Nastya said that Dima will come later.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Настя сказала, что Дима {item} позже.", language_code: ru, direction: ltr}, accepted_variants: ["Настя сказала, что позже Дима {item}.", "Настя сказала, что Дима придет позже.", "Настя сказала, что позже Дима придет."]}
    feedback_frame: {text: "The reported clause keeps the tense it had when it was said.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson01.fill.001
    lesson_content_key: ru.b1.unit43.lesson01.chto_skazal_dima
    type: fill_in_blank
    frame: {text: "Дима сказал, что он {item} в офис. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item, accepted_variants: ["придет"]}
    feedback_frame: {text: "Придёт means he will come.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.translate.003
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: translation
    frame: {text: "Nastya asked whether he would come.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Настя {item}, придёт ли он.", language_code: ru, direction: ltr}, accepted_variants: ["{item} Настя, придёт ли он.", "Настя {item}, придет ли он.", "{item} Настя, придет ли он."]}
    feedback_frame: {text: "Спросила is feminine, to agree with Настя.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.fill.001
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: fill_in_blank
    frame: {text: "Настя спросила, придёт {item} он. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ли follows the verb in an indirect yes-or-no question.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.order.001
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: word_order
    frame: {text: "Она спросила, что он {item}.", language_code: ru, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Она спросила, что он {item}.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Делает stays in the present in reported speech.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson03.order.001
    lesson_content_key: ru.b1.unit43.lesson03.chto_skazal_dima_dialog
    type: word_order
    frame: {text: "Да, я спросила, {item} ли он сегодня.", language_code: ru, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Да, я спросила, {item} ли он сегодня.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Придёт comes right before ли.", language_code: en, direction: ltr}
