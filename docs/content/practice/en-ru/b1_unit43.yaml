schema_version: "1.0"
pack_key: practice.en-ru.b1.unit43
source_language: en
target_language: ru
unit_content_key: ru.b1.unit43.kosvennaja_rech
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-ru B1 set) from scripts/backfill_lexemes_en_ru.py (en-ru-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Topic: reporting what someone said or asked. Sentence translations accept free word order, dropped subject pronouns where natural, aspect or synonym pairs, the feminine speaker forms, and the е spelling of ё. Reviewer: confirm the tense in reported speech (придёт stays future), and that 'стоит' carries two senses (stands; it is worth) because the grammar note uses it first.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_придёт", "w_без", "w_изменения", "w_спросила", "w_ли", "w_делает", "w_глагола"]
slot_presets:
  p1: &p1 {language_code: ru, part_of_speech: ["noun", "verb", "preposition", "particle"], agreement_tags: {semantic: ["w_придёт", "w_без", "w_изменения", "w_спросила", "w_ли", "w_делает", "w_глагола"]}}
  p2: &p2 {language_code: ru, part_of_speech: ["noun", "verb", "preposition"], agreement_tags: {semantic: ["w_придёт", "w_без", "w_изменения"]}}
  p3: &p3 {language_code: ru, part_of_speech: ["noun", "verb", "particle"], agreement_tags: {semantic: ["w_спросила", "w_ли", "w_делает", "w_глагола"]}}
  p4: &p4 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_придёт"]}}
  p5: &p5 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_спросила"]}}
  p6: &p6 {language_code: ru, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_ли"]}}
  p7: &p7 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_делает"]}}
templates:
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.choose.001
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on reporting what someone said or asked.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.listen.001
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: listen_select
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit43.lesson02.translate.001
    lesson_content_key: ru.b1.unit43.lesson02.nastya_sprosila
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words of the unit.", language_code: en, direction: ltr}
