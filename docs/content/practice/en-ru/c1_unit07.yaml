  lesson_content_key: ru.c1.unit07.mediaciya.lesson01.dva_istochnika
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_источник, w_первый, w_утверждает, w_домашние, w_задания, w_закрепляют, w_материал, w_второй, w_считает, w_чрезмерные, w_вызывают, w_стресс, w_сходятся, w_практика, w_полезна, w_расходятся, w_мнениях, w_количестве, w_словам, w_польза, w_доказана, w_суть, w_спорен, w_лишние, w_детали, w_можно, w_опустить, w_разногласие, w_источниками, w_сохранить, w_простыми, w_изложу, w_доступным, w_языком, w_термин, w_самостоятельность, w_заменю, w_словом, w_учат, w_детей, w_усиливают, w_неравенство, w_младших, w_классов, w_вопрос, w_нерешённым, w_целевая, w_аудитория, w_медиация]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two sources.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit07.lesson02.listen.001
  lesson_content_key: ru.c1.unit07.mediaciya.lesson02.raznoglasie
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
