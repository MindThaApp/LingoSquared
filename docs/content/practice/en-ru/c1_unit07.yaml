schema_version: '1.0'
pack_key: practice.en-ru.c1.unit07
source_language: en
target_language: ru
unit_content_key: ru.c1.unit07.mediaciya
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u7 / w_<token>). 49 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_аудитория, w_вопрос, w_второй, w_вызывают, w_детали, w_детей, w_доказана, w_домашние, w_доступным, w_задания, w_закрепляют, w_заменю, w_изложу, w_источник, w_источниками, w_классов, w_количестве, w_лишние, w_материал, w_медиация, w_младших, w_мнениях, w_можно, w_неравенство, w_нерешённым, w_опустить, w_первый, w_полезна, w_польза, w_практика, w_простыми, w_разногласие, w_расходятся, w_самостоятельность, w_словам, w_словом, w_сохранить, w_спорен, w_стресс, w_суть, w_сходятся, w_считает, w_термин, w_усиливают, w_утверждает, w_учат, w_целевая, w_чрезмерные, w_языком]
