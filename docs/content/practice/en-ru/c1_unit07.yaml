  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the disagreement.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit07.lesson03.translate.001
  lesson_content_key: ru.c1.unit07.mediaciya.lesson03.otbor
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what to keep, what to omit.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit07.lesson04.match.001
  lesson_content_key: ru.c1.unit07.mediaciya.lesson04.dostupnyj_yazyk
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
