  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The roads are very busy today. дороги means roads., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson03.order.002
  lesson_content_key: ru.b2.unit02.lesson03.dogadka_ili_dedukcija
  type: word_order
  frame: {text: 'Это просто {item}, а не факт.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_догадка}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это просто {item}, а не факт.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'That''s just a guess, not a fact. догадка means guess.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson03.fill.003
  lesson_content_key: ru.b2.unit02.lesson03.dogadka_ili_dedukcija
  type: fill_in_blank
  frame:
    text: Оля {item} пишет заранее, если опаздывает. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_всегда}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_всегда}
