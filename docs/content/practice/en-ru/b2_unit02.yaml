  feedback_frame: {text: Olya always texts ahead of time if she's running late. всегда means always., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson03.translate.004
  lesson_content_key: ru.b2.unit02.lesson03.dogadka_ili_dedukcija
  type: translation
  frame: {text: 'Nastya: Maybe, or maybe something happened.', language_code: en, direction: ltr}
  slots:
    item:
