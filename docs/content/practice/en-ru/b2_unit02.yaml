  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_сегодня}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_сегодня}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It seems she overslept today. сегодня means today., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson05.translate.004
  lesson_content_key: ru.b2.unit02.lesson05.fakt_ili_predpolozhenie
  type: translation
  frame: {text: 'Look, she texted!', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_написала}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Смотри, она {item}!', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Look, she texted! Смотри is the informal imperative ''look'' -- a natural way to interrupt with new information.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson06.order.002
  lesson_content_key: ru.b2.unit02.lesson06.predpolozhenija_v_razgovore
  type: word_order
  frame: {text: 'Прости, опаздываю, {item}!', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_бегу}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Прости, опаздываю, {item}!', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Sorry, I''m running late, I''m on my way! бегу means I''m running; I''m on my way.', language_code: en, direction: ltr}
