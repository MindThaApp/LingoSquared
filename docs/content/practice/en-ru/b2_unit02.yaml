      part_of_speech: verb
      agreement_tags: {semantic: w_забыла}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Olya forgot her umbrella at home. забыла means forgot (fem., past).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson04.translate.004
  lesson_content_key: ru.b2.unit02.lesson04.predpolozhenija_o_proshlom
  type: translation
  frame: {text: She couldn't have forgotten., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_могла}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Она не {item} забыть.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'She couldn''t have forgotten. Не могла забыть = ''couldn''t have forgotten'' -- ruling out a past cause, the past-tense counterpart of не может быть, что.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson05.order.002
  lesson_content_key: ru.b2.unit02.lesson05.fakt_ili_predpolozhenie
  type: word_order
