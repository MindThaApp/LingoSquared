  answer_derivation:
    kind: render_frame
    frame: {text: 'Может быть, а может быть, что-то {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Nastya: Maybe, or maybe something happened. случилось means happened.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson04.order.002
  lesson_content_key: ru.b2.unit02.lesson04.predpolozhenija_o_proshlom
  type: word_order
  frame: {text: 'Кажется, она сегодня {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_проспала}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Кажется, она сегодня {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'It seems she overslept today. проспала means overslept (fem., past).', language_code: en, direction: ltr}
