schema_version: '1.0'
pack_key: practice.en-ru.b2.unit02
source_language: en
target_language: ru
unit_content_key: ru.b2.unit02.predpolozhenija
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_b2_u2 / w_<token>). 47 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_бегу, w_быть, w_вовремя, w_возможно, w_всегда, w_встрече, w_дедукция, w_делает, w_догадка, w_дороги, w_ещё, w_забыла, w_забыть, w_загружены, w_заранее, w_застряла, w_знаем, w_машина, w_могла, w_может, w_наверное, w_написала, w_обычно, w_опаздывает, w_основанная, w_очень, w_пишет, w_предположения, w_приходит, w_пробке, w_проспала, w_просто, w_редко, w_сегодня, w_серьёзное, w_сильнее, w_слабая, w_слова, w_сломалась, w_случилось, w_смотри, w_судя, w_точно, w_уверен, w_улик, w_утрам, w_центре]
templates:
- content_key: practice.en-ru.ru.b2.unit02.lesson01.choose.001
  lesson_content_key: ru.b2.unit02.lesson01.shkala_uverennosti
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_может, w_быть, w_возможно, w_наверное, w_застряла, w_пробке, w_ещё, w_судя, w_опаздывает, w_дороги, w_очень, w_загружены, w_догадка, w_дедукция, w_уверен, w_всегда, w_пишет, w_заранее, w_случилось, w_просто, w_улик, w_проспала, w_забыла, w_могла, w_встрече, w_забыть, w_обычно, w_приходит, w_вовремя, w_сегодня, w_центре, w_утрам, w_редко, w_делает, w_написала, w_слова, w_серьёзное, w_сломалась, w_машина, w_знаем, w_точно, w_предположения, w_смотри, w_бегу, w_слабая, w_сильнее, w_основанная]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how certain are you?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson02.listen.001
  lesson_content_key: ru.b2.unit02.lesson02.dedukcija_iz_ulik
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on deduction: drawing a conclusion from evidence.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson03.translate.001
  lesson_content_key: ru.b2.unit02.lesson03.dogadka_ili_dedukcija
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a guess or a deduction?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson04.match.001
  lesson_content_key: ru.b2.unit02.lesson04.predpolozhenija_o_proshlom
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson05.choose.001
  lesson_content_key: ru.b2.unit02.lesson05.fakt_ili_predpolozhenie
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fact or speculation?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson06.translate.001
  lesson_content_key: ru.b2.unit02.lesson06.predpolozhenija_v_razgovore
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speculating in a conversation.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson01.order.002
  lesson_content_key: ru.b2.unit02.lesson01.shkala_uverennosti
  type: word_order
  frame: {text: 'Может быть, а {item} быть, что-то случилось.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_может}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Может быть, а {item} быть, что-то случилось.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Nastya: Maybe, or maybe something happened. может means can; may (he, she or it).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson01.fill.003
  lesson_content_key: ru.b2.unit02.lesson01.shkala_uverennosti
  type: fill_in_blank
  frame:
    text: Может {item}, она опаздывает. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_быть}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_быть}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Maybe she's running late. быть means to be (also in the phrase for 'maybe')., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson01.translate.004
  lesson_content_key: ru.b2.unit02.lesson01.shkala_uverennosti
  type: translation
  frame: {text: Olya isn't here yet., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_ещё}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Оли {item} нет.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Olya isn''t here yet. Оли ещё нет -- Russian negates existence with the genitive: Оли нет = ''there is no Olya (here)''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson02.order.002
  lesson_content_key: ru.b2.unit02.lesson02.dedukcija_iz_ulik
  type: word_order
  frame: {text: 'Должно быть, она {item}, потому что дорога загружена.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_опаздывает}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Должно быть, она {item}, потому что дорога загружена.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'She must be late, because the road is busy. опаздывает means is running late.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit02.lesson02.fill.003
  lesson_content_key: ru.b2.unit02.lesson02.dedukcija_iz_ulik
