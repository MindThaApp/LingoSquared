schema_version: "1.0"
pack_key: practice.en-ru.b1.unit50
source_language: en
target_language: ru
unit_content_key: ru.b1.unit50.soveshchanija
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-ru B1 set) from scripts/backfill_lexemes_en_ru.py (en-ru-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Topic: polite suggestions and requests at work. Sentence translations accept free word order, dropped subject pronouns where natural, aspect or synonym pairs, the feminine speaker forms, and the е spelling of ё. Reviewer: confirm the formal register (вы) in 'Не могли бы вы' and the reordering variants of the date phrase.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_предложил", "w_перенести", "w_встречу", "w_пятницу", "w_порекомендовал", "w_формальное", "w_смягчённое", "w_предложение", "w_нет", "w_всех", "w_данных", "w_для", "w_отчёта", "w_до", "w_почему", "w_среды", "w_пятницы"]
slot_presets:
  p1: &p1 {language_code: ru, part_of_speech: ["noun", "pronoun", "verb", "adjective", "adverb", "preposition", "particle"], agreement_tags: {semantic: ["w_предложил", "w_перенести", "w_встречу", "w_пятницу", "w_порекомендовал", "w_формальное", "w_смягчённое", "w_предложение", "w_нет", "w_всех", "w_данных", "w_для", "w_отчёта", "w_до", "w_почему", "w_среды"]}}
  p2: &p2 {language_code: ru, part_of_speech: ["noun", "pronoun", "verb", "adjective", "preposition", "particle"], agreement_tags: {semantic: ["w_предложил", "w_перенести", "w_встречу", "w_пятницу", "w_порекомендовал", "w_формальное", "w_смягчённое", "w_предложение", "w_нет", "w_всех", "w_данных", "w_для", "w_отчёта"]}}
  p3: &p3 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_предложил"]}}
  p4: &p4 {language_code: ru, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_перенести"]}}
  p5: &p5 {language_code: ru, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_встречу"]}}
  p6: &p6 {language_code: ru, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_нет"]}}
  p7: &p7 {language_code: ru, part_of_speech: ["pronoun"], agreement_tags: {semantic: ["w_всех"]}}
  p8: &p8 {language_code: ru, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_отчёта"]}}
  p9: &p9 {language_code: ru, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_пятницы"]}}
  p10: &p10 {language_code: ru, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_почему"]}}
  p11: &p11 {language_code: ru, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_среды"]}}
templates:
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.choose.001
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on polite suggestions and requests at work.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.listen.001
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: listen_select
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.translate.001
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.choose.002
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: multiple_choice
    frame: {text: "{item}", language_code: ru, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from lesson 1 of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.translate.002
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are key words from lesson 1.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.match.001
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ru, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the words of the unit on polite suggestions and requests at work.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.match.002
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ru, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the words of lesson 1.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.translate.003
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: translation
    frame: {text: "I would suggest moving the meeting to Friday.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Я бы {item} перенести встречу на пятницу.", language_code: ru, direction: ltr}, accepted_variants: ["Я {item} бы перенести встречу на пятницу.", "Я бы {item} перенести на пятницу встречу.", "Я бы предложила перенести встречу на пятницу."]}
    feedback_frame: {text: "Я бы предложил is a softened suggestion.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.fill.001
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: fill_in_blank
    frame: {text: "Я бы предложил {item} встречу на пятницу. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Перенести means to move or postpone.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.order.001
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: word_order
    frame: {text: "Я бы предложил перенести {item} на пятницу.", language_code: ru, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Я бы предложил перенести {item} на пятницу.", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Встречу is the accusative of встреча.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.translate.004
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: translation
    frame: {text: "I don't have all the data for the report yet.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "У меня ещё {item} всех данных для отчёта.", language_code: ru, direction: ltr}, accepted_variants: ["У меня {item} ещё всех данных для отчёта.", "Для отчёта у меня ещё {item} всех данных.", "У меня еще {item} всех данных для отчета.", "У меня {item} еще всех данных для отчета.", "Для отчета у меня еще {item} всех данных."]}
    feedback_frame: {text: "Нет takes the genitive: нет данных.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.fill.002
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: fill_in_blank
    frame: {text: "У меня ещё нет {item} данных для отчёта. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "После нет the genitive plural is used: всех данных.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson01.fill.003
    lesson_content_key: ru.b1.unit50.lesson01.ja_by_predlozhil
    type: fill_in_blank
    frame: {text: "У меня ещё нет всех данных для {item}. ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item, accepted_variants: ["отчета"]}
    feedback_frame: {text: "Для takes the genitive: для отчёта.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson02.translate.001
    lesson_content_key: ru.b1.unit50.lesson02.ne_mogli_by_vy
    type: translation
    frame: {text: "Could you please send the report by Friday?", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Не могли бы вы отправить отчёт до {item}?", language_code: ru, direction: ltr}, accepted_variants: ["Вы не могли бы отправить отчёт до {item}?", "Не могли бы вы до {item} отправить отчёт?", "Не могли бы вы отправить отчет до {item}?", "Вы не могли бы отправить отчет до {item}?", "Не могли бы вы до {item} отправить отчет?"]}
    feedback_frame: {text: "До takes the genitive: до пятницы.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson03.order.001
    lesson_content_key: ru.b1.unit50.lesson03.soveshchanie_perenos
    type: word_order
    frame: {text: "Хорошо, а {item}?", language_code: ru, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Хорошо, а {item}?", language_code: ru, direction: ltr}}
    feedback_frame: {text: "Почему means why.", language_code: en, direction: ltr}
  - content_key: practice.en-ru.ru.b1.unit50.lesson03.fill.001
    lesson_content_key: ru.b1.unit50.lesson03.soveshchanie_perenos
    type: fill_in_blank
    frame: {text: "Не могли бы вы отправить мне таблицу до {item}? ({hint})", language_code: ru, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "До takes the genitive: до среды.", language_code: en, direction: ltr}
