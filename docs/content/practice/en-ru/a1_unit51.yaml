  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading the program.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit51.lesson06.translate.001
