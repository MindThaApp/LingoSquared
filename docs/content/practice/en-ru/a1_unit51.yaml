schema_version: '1.0'
pack_key: practice.en-ru.a1.unit51
source_language: en
target_language: ru
unit_content_key: ru.a1.unit51.concert
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u51 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_большая, w_группа, w_группу, w_группы, w_длится, w_длиться, w_довольна, w_место, w_начало, w_потрясающий, w_публика, w_странники, w_сцена, w_хорошее]
templates:
- content_key: practice.en-ru.ru.a1.unit51.lesson01.choose.001
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_группа, w_группы, w_место, w_хорошее, w_длиться, w_длится, w_группу, w_сцена, w_большая, w_публика, w_довольна, w_странники, w_начало, w_потрясающий]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to go to the concert.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit51.lesson02.listen.001
  lesson_content_key: ru.a1.unit51.lesson02.ya_khochu_kupit_bilet
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to buy a ticket.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit51.lesson03.translate.001
  lesson_content_key: ru.a1.unit51.lesson03.vo_skolko_nachinaetsya_kontsert
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what time does the concert start?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit51.lesson04.match.001
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit51.lesson05.choose.001
