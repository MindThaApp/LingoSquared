  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson03.ironichny_ton
  type: translation
  frame: {text: 'As always, everything at the last moment.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_всегда}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Как {item}, всё в последний момент.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'As always, everything at the last moment. Как всегда (''as always'') and в последний момент (''at the last moment'') turn a statement into an ironic aside about a recurring problem.', language_code: en, direction: ltr}
