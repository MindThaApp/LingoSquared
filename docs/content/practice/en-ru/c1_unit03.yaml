    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_понимание}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_понимание}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I hope for your understanding. Надеюсь на ваше понимание ('I hope for your understanding') is a diplomatic appeal; на ваше понимание uses formal ваше., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit03.lesson02.translate.004
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson02.diplomatichny_ton
  type: translation
  frame: {text: We will need a bit more time., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_потребуется}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Нам {item} ещё немного времени.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'We will need a bit more time. Нам потребуется ещё немного времени (''we will need a bit more time'') is a softened way to ask for a delay, avoiding a blunt ''I am late''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit03.lesson03.order.002
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson03.ironichny_ton
  type: word_order
  frame: {text: 'Ну конечно, отчёт будет готов ещё {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_вчера}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ну конечно, отчёт будет готов ещё {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Oh sure, the report will be ready already yesterday. Ну конечно (''oh sure'') pretends to agree while the rest of the sentence reveals the opposite — the report cannot be ready ещё вчера (''already yesterday'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit03.lesson03.fill.003
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson03.ironichny_ton
  type: fill_in_blank
  frame:
    text: Ну конечно, отчёт будет готов ещё вчера, {item} всегда. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_как}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_как}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Oh sure, the report will be ready yesterday, as always. Irony pretends to agree (ну конечно) while ещё вчера and как всегда expose the opposite meaning.', language_code: en, direction: ltr}
