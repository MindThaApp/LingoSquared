- content_key: practice.en-ru.ru.c1.unit03.lesson01.order.002
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson01.oficialny_ton
  type: word_order
  frame: {text: 'Нам потребуется {item} немного времени.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_ещё}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Нам потребуется {item} немного времени.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'We will need a bit more time. Нам потребуется ещё немного времени (''we will need a bit more time'') is a softened way to ask for a delay, avoiding a blunt ''I am late''.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit03.lesson01.fill.003
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson01.oficialny_ton
  type: fill_in_blank
  frame:
    text: Мне просто необходимо ещё {item} дня. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_два}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_два}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I simply need two more days. Просто необходимо ('simply necessary') intensifies the need — stronger than plain нужно., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit03.lesson01.translate.004
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson01.oficialny_ton
  type: translation
  frame: {text: 'Dear Ivan Petrovich, I inform you that the report will be ready a bit later.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_сообщаю}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Уважаемый Иван Петрович, {item} вам, что отчёт будет готов немного позже.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Dear Ivan Petrovich, I inform you that the report will be ready a bit later. The formal message pairs the salutation Уважаемый Иван Петрович with the formal verb сообщаю and formal вам.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit03.lesson02.order.002
  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson02.diplomatichny_ton
  type: word_order
  frame: {text: 'К {item}, отчёт будет готов немного позже.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_сожалению}
  answer_derivation:
    kind: render_frame
    frame: {text: 'К {item}, отчёт будет готов немного позже.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Unfortunately, the report will be ready a bit later. К сожалению (''unfortunately'') softens bad news — it acknowledges regret before stating the delay.', language_code: en, direction: ltr}
