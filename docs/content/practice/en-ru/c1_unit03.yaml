  lesson_content_key: ru.c1.unit03.ton_i_registr.lesson04.emfatichesky_ton
  type: translation
  frame: {text: The report will definitely be ready tomorrow., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_обязательно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Отчёт {item} будет готов завтра.', language_code: ru, direction: ltr}
  feedback_frame: {text: The report will definitely be ready tomorrow. Обязательно ('definitely') expresses firm commitment., language_code: en, direction: ltr}
