schema_version: '1.0'
pack_key: practice.en-ru.c1.unit03
source_language: en
target_language: ru
unit_content_key: ru.c1.unit03.ton_i_registr
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u3 / w_<token>). 26 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_будет, w_времени, w_всегда, w_вчера, w_готов, w_два, w_дня, w_ещё, w_задерживается, w_как, w_момент, w_надеюсь, w_нужно, w_обязательно, w_позже, w_понимание, w_последний, w_потребуется, w_почти, w_просто, w_регистр, w_сожалению, w_сообщаю, w_тон, w_уважаемый, w_честно]
templates:
