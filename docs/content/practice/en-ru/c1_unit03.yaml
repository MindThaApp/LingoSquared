  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_задерживается, w_нужно, w_ещё, w_два, w_дня, w_уважаемый, w_сообщаю, w_будет, w_готов, w_позже, w_сожалению, w_надеюсь, w_понимание, w_потребуется, w_времени, w_вчера, w_как, w_всегда, w_последний, w_момент, w_честно, w_почти, w_просто, w_обязательно, w_тон, w_регистр]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the formal tone.', language_code: en, direction: ltr}
