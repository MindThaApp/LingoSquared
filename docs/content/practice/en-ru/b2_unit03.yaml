schema_version: '1.0'
pack_key: practice.en-ru.b2.unit03
source_language: en
target_language: ru
unit_content_key: ru.b2.unit03.njuansy
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_b2_u3 / w_<token>). 44 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_безусловно, w_виду, w_вчера, w_года, w_действительно, w_длинный, w_довольно, w_затянутый, w_именно, w_имею, w_кажется, w_как, w_концовка, w_лучший, w_медленный, w_мнение, w_музыка, w_мягко, w_немного, w_неплохой, w_одно, w_особенным, w_осторожнее, w_понравился, w_посмотрели, w_потрясающая, w_предсказуема, w_проблема, w_разная, w_середине, w_сила, w_сильно, w_словом, w_смысле, w_смягчают, w_совершенно, w_согласен, w_ставит, w_сюжет, w_усиливают, w_фильм, w_фокус, w_формулируют, w_хорошим]
templates:
- content_key: practice.en-ru.ru.b2.unit03.lesson01.choose.001
  lesson_content_key: ru.b2.unit03.lesson01.smyagchit_mnenie
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_фильм, w_кажется, w_довольно, w_немного, w_неплохой, w_длинный, w_смысле, w_как, w_медленный, w_затянутый, w_концовка, w_предсказуема, w_музыка, w_формулируют, w_осторожнее, w_действительно, w_совершенно, w_безусловно, w_потрясающая, w_лучший, w_усиливают, w_мнение, w_смягчают, w_именно, w_хорошим, w_понравился, w_имею, w_виду, w_проблема, w_словом, w_ставит, w_фокус, w_вчера, w_посмотрели, w_особенным, w_сюжет, w_середине, w_года, w_согласен, w_мягко, w_сильно, w_одно, w_разная, w_сила]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on softening an opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson02.listen.001
  lesson_content_key: ru.b2.unit03.lesson02.ostorozhnye_formulirovki
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on more tentative framing.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson03.translate.001
  lesson_content_key: ru.b2.unit03.lesson03.usilenie_i_akcent
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on emphasis and degree.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson04.match.001
  lesson_content_key: ru.b2.unit03.lesson04.fokus_imenno
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson05.choose.001
  lesson_content_key: ru.b2.unit03.lesson05.retsenzija
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a review.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson06.translate.001
  lesson_content_key: ru.b2.unit03.lesson06.mnenija_v_razgovore
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on opinions in a conversation.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson01.order.002
  lesson_content_key: ru.b2.unit03.lesson01.smyagchit_mnenie
  type: word_order
  frame: {text: 'Мы посмотрели новый {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_фильм}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мы посмотрели новый {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: We watched a new film. фильм means film., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson01.fill.003
  lesson_content_key: ru.b2.unit03.lesson01.smyagchit_mnenie
  type: fill_in_blank
  frame:
    text: Мне {item}, что фильм довольно неплохой. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_кажется}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_кажется}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It seems to me that the film is quite good. кажется means seems., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson01.translate.004
  lesson_content_key: ru.b2.unit03.lesson01.smyagchit_mnenie
  type: translation
  frame: {text: That's quite interesting., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_довольно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это {item} интересно.', language_code: ru, direction: ltr}
  feedback_frame: {text: That's quite interesting. довольно means quite; rather., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson02.order.002
  lesson_content_key: ru.b2.unit03.lesson02.ostorozhnye_formulirovki
  type: word_order
  frame: {text: 'Концовка, {item} мне кажется, немного предсказуема.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_как}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Концовка, {item} мне кажется, немного предсказуема.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'The ending, as it seems to me, is a bit predictable. как means how.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson02.fill.003
  lesson_content_key: ru.b2.unit03.lesson02.ostorozhnye_formulirovki
  type: fill_in_blank
  frame:
    text: В начале фильм довольно {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_медленный}
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_медленный}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: At the start the film is quite slow. медленный means slow (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson02.translate.004
  lesson_content_key: ru.b2.unit03.lesson02.ostorozhnye_formulirovki
  type: translation
  frame: {text: The film is a bit dragged out., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_затянутый}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Фильм немного {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: The film is a bit dragged out. затянутый means dragged out; overlong (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson03.order.002
  lesson_content_key: ru.b2.unit03.lesson03.usilenie_i_akcent
  type: word_order
  frame: {text: 'Он {item} занят.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_действительно}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Он {item} занят.', language_code: ru, direction: ltr}
  feedback_frame: {text: He's really busy. действительно means really; indeed., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson03.fill.003
  lesson_content_key: ru.b2.unit03.lesson03.usilenie_i_akcent
  type: fill_in_blank
  frame:
    text: Эта музыка просто {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_потрясающая}
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_потрясающая}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: This music is simply amazing. потрясающая means amazing; stunning (fem.)., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson03.translate.004
  lesson_content_key: ru.b2.unit03.lesson03.usilenie_i_akcent
  type: translation
  frame: {text: 'Absolutely, this is the best option.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_лучший}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Совершенно точно, это {item} вариант.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Absolutely, this is the best option. лучший means best (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson04.order.002
  lesson_content_key: ru.b2.unit03.lesson04.fokus_imenno
  type: word_order
  frame: {text: 'Именно музыка делает фильм {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_хорошим}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Именно музыка делает фильм {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: It's the music that makes the film good. Именно музыка... -- fronting именно + the focused noun is how Russian expresses an English it-cleft ('it's X that...') without needing a separate clause structure., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson04.fill.003
  lesson_content_key: ru.b2.unit03.lesson04.fokus_imenno
  type: fill_in_blank
  frame:
    text: Именно из-за концовки фильм всем {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_понравился}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_понравился}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'It''s because of the ending that everyone liked the film. понравился means was liked; appealed (masc., past).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson04.translate.004
  lesson_content_key: ru.b2.unit03.lesson04.fokus_imenno
  type: translation
  frame: {text: That's what I mean., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_имею}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Вот что я {item} в виду.', language_code: ru, direction: ltr}
  feedback_frame: {text: That's what I mean. имею means I have., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit03.lesson05.order.002
  lesson_content_key: ru.b2.unit03.lesson05.retsenzija
  type: word_order
  frame: {text: 'Мы {item} новый фильм.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_посмотрели}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мы {item} новый фильм.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'We watched a new film. посмотрели means watched (plural, past).', language_code: en, direction: ltr}
