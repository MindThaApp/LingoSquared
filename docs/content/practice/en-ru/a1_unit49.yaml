  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_смотреть, w_посмотреть, w_сеанс, w_начинаться, w_скоро, w_новый, w_попкорн, w_детский, w_захватывающий]
