schema_version: '1.0'
pack_key: practice.en-ru.a1.unit26
source_language: en
target_language: ru
unit_content_key: ru.a1.unit26.appearance
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u26 / w_<token>). 35 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_волосы, w_выглядит, w_выглядишь, w_выглядят, w_высокий, w_выше, w_глаза, w_голубые, w_девушка, w_дедушки, w_длиннее, w_длинные, w_зелёные, w_имя, w_карие, w_каштановые, w_короткие, w_меняется, w_молодой, w_невысокий, w_новая, w_падеже, w_познакомиться, w_придёт, w_прилагательное, w_родительном, w_родительный, w_роду, w_светлые, w_седые, w_смотри, w_старый, w_узнаю, w_чёрные, w_языковое]
templates:
- content_key: practice.en-ru.ru.a1.unit26.lesson01.choose.001
  lesson_content_key: ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_высокий, w_невысокий, w_старый, w_молодой, w_прилагательное, w_меняется, w_роду, w_волосы, w_короткие, w_чёрные, w_светлые, w_каштановые, w_седые, w_дедушки, w_длинные, w_имя, w_родительном, w_падеже, w_глаза, w_карие, w_голубые, w_зелёные, w_выглядит, w_языковое, w_придёт, w_новая, w_девушка, w_узнаю, w_выглядят, w_выше, w_выглядишь, w_родительный, w_длиннее, w_смотри, w_познакомиться]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on tall, short, old, and young.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit26.lesson02.listen.001
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on describing hair.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit26.lesson03.translate.001
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on eyes and what does someone look like?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit26.lesson04.match.001
  lesson_content_key: ru.a1.unit26.lesson04.nastya_opisyvaet_ninu
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit26.lesson05.choose.001
  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on comparing igor and lena.', language_code: en, direction: ltr}
