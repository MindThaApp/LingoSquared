  lesson_content_key: ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i
  type: word_order
  frame: {text: 'Лена высокая, а Игорь {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_невысокий}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Лена высокая, а Игорь {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Lena is tall and Igor is short. Two statements are set side by side with а (while, and): Лена высокая, а Игорь невысокий.', language_code: en, direction: ltr}
