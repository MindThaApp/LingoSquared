schema_version: '1.0'
pack_key: practice.en-ru.c1.unit02
source_language: en
target_language: ru
unit_content_key: ru.c1.unit02.implicit_ironiya
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_c1_u2 / w_<token>). 29 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_виду, w_гениальная, w_говоря, w_есть, w_завтра, w_идея, w_иметь, w_ирония, w_коллега, w_конечно, w_мягко, w_намекать, w_неявный, w_опять, w_отчёт, w_подтекст, w_прекрасно, w_преуменьшение, w_прислал, w_пришлёт, w_пунктуальный, w_сделал, w_скажем, w_сказал, w_смысл, w_совсем, w_строк, w_человек, w_читать]
templates:
- content_key: practice.en-ru.ru.c1.unit02.lesson01.choose.001
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson01.ironiya
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_ирония, w_конечно, w_прекрасно, w_гениальная, w_идея, w_есть, w_опять, w_сделал, w_иметь, w_виду, w_намекать, w_мягко, w_говоря, w_совсем, w_скажем, w_преуменьшение, w_пунктуальный, w_человек, w_коллега, w_прислал, w_отчёт, w_сказал, w_пришлёт, w_завтра, w_подтекст, w_читать, w_строк, w_неявный, w_смысл]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on irony: saying the opposite.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson02.listen.001
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson02.namyok
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on implication and subtext.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson03.translate.001
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson03.nedomolvka
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on understatement: to put it mildly.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson04.match.001
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson04.chitayu_mezhdu_strok
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson06.choose.001
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson06.govoryu_i_pishu
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speaking and writing with subtext.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson01.translate.002
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson01.ironiya
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on irony: saying the opposite.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson01.order.003
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson01.ironiya
  type: word_order
  frame: {text: 'Это была {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_ирония}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Это была {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: That was irony. ирония means irony., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson01.fill.004
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson01.ironiya
  type: fill_in_blank
  frame:
    text: Ну да, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_конечно}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_конечно}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'oh sure, of course (I don''t believe it) Ну да, конечно literally agrees (''well yes, of course'') but, said ironically, means the speaker does NOT believe it.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson02.order.002
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson02.namyok
  type: word_order
  frame: {text: 'То {item} он опять ничего не сделал.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_есть}
  answer_derivation:
    kind: render_frame
    frame: {text: 'То {item} он опять ничего не сделал.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'That is, he again did nothing. То есть converts an implication into a plain statement.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson02.fill.003
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson02.namyok
  type: fill_in_blank
  frame:
    text: Мой коллега {item} не прислал отчёт. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_опять}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_опять}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: My colleague again did not send the report. Мой коллега опять не прислал отчёт sets the context — the fact the judgement is about., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson03.order.002
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson03.nedomolvka
  type: word_order
  frame: {text: 'Мягко {item}, он не самый пунктуальный человек.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_говоря}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мягко {item}, он не самый пунктуальный человек.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'To put it mildly, he is not the most punctual person. Мягко говоря, он не самый пунктуальный человек says he is unreliable by understatement: ''not the most punctual'' implies quite unpunctual.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson03.fill.003
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson03.nedomolvka
  type: fill_in_blank
  frame:
    text: Это было явное {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_преуменьшение}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_преуменьшение}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: That was a clear understatement. преуменьшение means understatement., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson04.order.002
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson04.chitayu_mezhdu_strok
  type: word_order
  frame: {text: 'Мой {item} опять не прислал отчёт.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_коллега}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мой {item} опять не прислал отчёт.', language_code: ru, direction: ltr}
  feedback_frame: {text: My colleague again did not send the report. Мой коллега опять не прислал отчёт sets the context — the fact the judgement is about., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson04.fill.003
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson04.chitayu_mezhdu_strok
  type: fill_in_blank
  frame:
    text: Он {item}, что пришлёт его завтра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_сказал}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_сказал}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'He said he would send it tomorrow. Он сказал, что пришлёт его завтра is the colleague''s own literal claim — the words, not the reality.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson04.translate.004
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson04.chitayu_mezhdu_strok
  type: translation
  frame: {text: The letter has a hidden subtext., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_подтекст}
  answer_derivation:
    kind: render_frame
    frame: {text: 'В письме есть скрытый {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: The letter has a hidden subtext. подтекст means subtext., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.c1.unit02.lesson06.order.002
  lesson_content_key: ru.c1.unit02.implicit_ironiya.lesson06.govoryu_i_pishu
  type: word_order
  frame: {text: 'В его словах есть {item} смысл.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags: {semantic: w_неявный}
  answer_derivation:
    kind: render_frame
    frame: {text: 'В его словах есть {item} смысл.', language_code: ru, direction: ltr}
  feedback_frame: {text: His words carry an implicit meaning. неявный means implicit (masc.)., language_code: en, direction: ltr}
