schema_version: '1.0'
pack_key: practice.en-ru.a1.unit54
source_language: en
target_language: ru
unit_content_key: ru.a1.unit54.beach
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_a1_u54 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_волна, w_дюны, w_зонт, w_зонты, w_зоопарк, w_красивое, w_море, w_песок, w_плаваю, w_пляжный, w_поплаваем, w_сижу, w_тёплый]
templates:
- content_key: practice.en-ru.ru.a1.unit54.lesson01.choose.001
  lesson_content_key: ru.a1.unit54.lesson01.poydyom_na_plyazh
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_море, w_песок, w_тёплый, w_волна, w_пляжный, w_зонт, w_плаваю, w_сижу, w_дюны, w_зонты, w_красивое, w_поплаваем, w_зоопарк]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the beach?.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit54.lesson02.listen.001
  lesson_content_key: ru.a1.unit54.lesson02.pesok_i_volny
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the sand and the waves.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit54.lesson03.translate.001
  lesson_content_key: ru.a1.unit54.lesson03.plavaem_v_more
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on swimming in the sea.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit54.lesson04.match.001
  lesson_content_key: ru.a1.unit54.lesson04.tablichka_na_plyazhe
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit54.lesson05.choose.001
  lesson_content_key: ru.a1.unit54.lesson05.dnyom_na_plyazhe
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on an afternoon at the beach.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit54.lesson06.translate.001
  lesson_content_key: ru.a1.unit54.lesson06.dima_i_nastya_posle
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on dima and nastya after the beach.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.a1.unit54.lesson01.order.002
  lesson_content_key: ru.a1.unit54.lesson01.poydyom_na_plyazh
  type: word_order
  frame: {text: 'Я люблю плавать в {item}.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_море}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я люблю плавать в {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: I like swimming in the sea. море means sea., language_code: en, direction: ltr}
