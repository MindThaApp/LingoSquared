schema_version: "1.0"
pack_key: practice.en-ru.a1.unit07
source_language: en
target_language: ru
unit_content_key: ru.a1.unit07.food
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ru A1 practice pack, job B) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_ru.py. Pools are curated w_<token> unions of this unit's own tokens; sentence frames use single anchors or curated unions in which every member is grammatical (checked at course scope). Inflected forms (case/number/gender) are tested only through single-anchor fill-in or fixed-sentence items so no bare-word prompt has two defensible answers. English prompts name ты/вы and the speaker's gender where the Russian form depends on them. Feedback lines carry a usage or grammar point.
    Reviewer: check the ты/вы labels in the English prompts and the case notes in feedback. No character facts are asserted (character names appear only as bare vocabulary items).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_борщ", "w_будете", "w_заказывать", "w_кофе", "w_меню", "w_мороженое", "w_официант", "w_официантка", "w_пить", "w_принесите", "w_садитесь", "w_салат", "w_свободен", "w_сладкое", "w_стол", "w_столик", "w_турист", "w_хочу", "w_чай"]
slot_presets:
  p1: &p1 {language_code: "ru", part_of_speech: ["adjective", "noun", "verb"], agreement_tags: {semantic: ["w_меню", "w_официант", "w_официантка", "w_столик", "w_свободен", "w_садитесь", "w_заказывать"]}}
  p2: &p2 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_столик", "w_стол"]}}
  p3: &p3 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_садитесь"}}
  p4: &p4 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_меню"}}
  p5: &p5 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_будете"}}
  p6: &p6 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_заказывать"}}
  p7: &p7 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_хочу", "w_чай", "w_кофе", "w_борщ", "w_салат"]}}
  p8: &p8 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: ["w_чай", "w_кофе", "w_борщ", "w_салат"]}}
  p9: &p9 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_салат"}}
  p10: &p10 {language_code: "ru", part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_хочу", "w_чай", "w_кофе", "w_борщ", "w_салат", "w_мороженое"]}}
  p11: &p11 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_чай"}}
  p12: &p12 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_борщ"}}
  p13: &p13 {language_code: "ru", part_of_speech: ["adjective", "noun", "verb"], agreement_tags: {semantic: ["w_мороженое", "w_принесите", "w_турист", "w_пить", "w_сладкое"]}}
  p14: &p14 {language_code: "ru", part_of_speech: "noun", agreement_tags: {semantic: "w_мороженое"}}
  p15: &p15 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_пить"}}
  p16: &p16 {language_code: "ru", part_of_speech: "verb", agreement_tags: {semantic: "w_принесите"}}
  p17: &p17 {language_code: "ru", part_of_speech: ["adjective", "noun", "verb"], agreement_tags: {semantic: ["w_мороженое", "w_турист", "w_пить", "w_сладкое"]}}
templates:
  - content_key: practice.en-ru.ru.a1.unit07.lesson01.choose.001
    lesson_content_key: ru.a1.unit07.lesson01.v_restorane
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p1}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Официант is the waiter and официантка the waitress; the feminine form adds -ка.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson01.order.002
    lesson_content_key: ru.a1.unit07.lesson01.v_restorane
    type: word_order
    frame: {text: "Этот {item} свободен?", language_code: "ru", direction: "ltr"}
    slots: {item: *p2}
    answer_derivation: {kind: "render_frame", frame: {text: "Этот {item} свободен?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Этот is the masculine this, so it goes with masculine nouns such as столик and стол; свободен is also masculine.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson01.fill.003
    lesson_content_key: ru.a1.unit07.lesson01.v_restorane
    type: fill_in_blank
    frame: {text: "Да, {item}, пожалуйста. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Садитесь ends in -тесь, the polite вы command, used by staff speaking to guests.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson01.match.004
    lesson_content_key: ru.a1.unit07.lesson01.v_restorane
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Свободен is a masculine adjective that agrees with столик; Этот столик свободен? asks whether a table is free.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson01.translate.005
    lesson_content_key: ru.a1.unit07.lesson01.v_restorane
    type: translation
    frame: {text: "Here is the menu.", language_code: "en", direction: "ltr"}
    slots: {item: *p4}
    answer_derivation: {kind: "render_frame", frame: {text: "Вот {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Меню never changes its ending, and Вот means here is.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson01.translate.006
    lesson_content_key: ru.a1.unit07.lesson01.v_restorane
    type: translation
    frame: {text: "What will you be ordering? (formal)", language_code: "en", direction: "ltr"}
    slots: {aux: *p5, item: *p6}
    answer_derivation: {kind: "render_frame", frame: {text: "Что {aux} {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Что будете заказывать? uses the вы form будете plus an infinitive to ask what a guest will order.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson02.choose.001
    lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
    type: multiple_choice
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p7}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Я хочу plus a noun says I want it, and Russian uses no word for a or the.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson02.order.002
    lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
    type: word_order
    frame: {text: "Я хочу {item}.", language_code: "ru", direction: "ltr"}
    slots: {item: *p8}
    answer_derivation: {kind: "render_frame", frame: {text: "Я хочу {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Я хочу means I want, and чай, кофе, борщ and салат keep the same form after it.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson02.fill.003
    lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
    type: fill_in_blank
    frame: {text: "Я хочу борщ и {item}. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "The word и joins two items in an order: борщ и салат.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson02.match.004
    lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: "ru", direction: "ltr"}
    slots: {first: *p10, second: *p10, third: *p10, fourth: *p10, fifth: *p10, sixth: *p10}
    slot_relations: [{kind: "distinct", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {kind: "matching_pairs", slots: ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {text: "Кофе is a masculine noun that never changes its ending.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson02.translate.005
    lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
    type: translation
    frame: {text: "I want tea.", language_code: "en", direction: "ltr"}
    slots: {item: *p11}
    answer_derivation: {kind: "render_frame", frame: {text: "Я хочу {item}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Я хочу is a direct statement, so in a restaurant add пожалуйста to soften it.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson02.translate.006
    lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
    type: translation
    frame: {text: "I want borscht and salad.", language_code: "en", direction: "ltr"}
    slots: {a: *p12, b: *p9}
    answer_derivation: {kind: "render_frame", frame: {text: "Я хочу {a} и {b}.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Я хочу борщ и салат is the order from the dialogue; Russian uses no word for a or the.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson03.listen.001
    lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
    type: listen_select
    frame: {text: "{item}", language_code: "ru", direction: "ltr"}
    slots: {item: *p13}
    answer_derivation: {kind: "slot_gloss", slot: "item"}
    feedback_frame: {text: "Мороженое ends in -ое because it is a neuter noun made from an adjective, like сладкое.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson03.order.002
    lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
    type: word_order
    frame: {text: "На сладкое принесите {item}, пожалуйста.", language_code: "ru", direction: "ltr"}
    slots: {item: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "На сладкое принесите {item}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "На сладкое means for dessert, and принесите is the polite вы command meaning bring.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson03.order.003
    lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
    type: word_order
    frame: {text: "Что будете {item}?", language_code: "ru", direction: "ltr"}
    slots: {item: *p15}
    answer_derivation: {kind: "render_frame", frame: {text: "Что будете {item}?", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "Что будете пить? is the waiter's question: будете plus an infinitive.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson03.fill.004
    lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
    type: fill_in_blank
    frame: {text: "На сладкое {item} мороженое, пожалуйста. ({hint})", language_code: "ru", direction: "ltr", slot_rendering: {hint: "english_gloss"}}
    slots: {item: *p16, hint: *p16}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Принесите is the polite вы command for bring; with ты it would be принеси.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson03.translate.005
    lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
    type: translation
    frame: {text: "For dessert, please bring ice cream. (formal)", language_code: "en", direction: "ltr"}
    slots: {a: *p16, b: *p14}
    answer_derivation: {kind: "render_frame", frame: {text: "На сладкое {a} {b}, пожалуйста.", language_code: "ru", direction: "ltr"}}
    feedback_frame: {text: "На сладкое принесите мороженое is a natural way to order dessert from a waiter.", language_code: "en", direction: "ltr"}
  - content_key: practice.en-ru.ru.a1.unit07.lesson03.translate.006
    lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
    type: translation
    frame: {text: "{item}", language_code: "en", direction: "ltr", slot_rendering: {item: "english_gloss"}}
    slots: {item: *p17}
    answer_derivation: {kind: "slot_text", slot: "item"}
    feedback_frame: {text: "Сладкое is an adjective used as a noun meaning dessert.", language_code: "en", direction: "ltr"}
