schema_version: '1.0'
pack_key: practice.en-ru.b2.unit01
source_language: en
target_language: ru
unit_content_key: ru.b2.unit01.argumentacija
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ru backfill lexemes (tags ru_b2_u1 / w_<token>). 52 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_более, w_больше, w_видеосвязи, w_время, w_говоря, w_говорят, w_дома, w_дорогу, w_другой, w_думаешь, w_есть, w_зрения, w_имеет, w_иногда, w_исследования, w_коллеги, w_конечно, w_короче, w_лучше, w_людей, w_менее, w_меняет, w_минусы, w_много, w_можно, w_например, w_общения, w_одной, w_офисе, w_перевешивает, w_перевешивают, w_плюсы, w_показывают, w_почему, w_правда, w_продуктивнее, w_продуктивны, w_работа, w_работают, w_свобода, w_созваниваться, w_стороны, w_считаю, w_считают, w_точка, w_удобна, w_хватает, w_хорошее, w_часто, w_экономить, w_экономишь, w_явление]
templates:
- content_key: practice.en-ru.ru.b2.unit01.lesson01.choose.001
  lesson_content_key: ru.b2.unit01.lesson01.tochka_zreniya
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: &id001
      language_code: ru
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_работа, w_дома, w_офисе, w_точка, w_зрения, w_считаю, w_лучше, w_экономить, w_экономишь, w_время, w_много, w_например, w_дорогу, w_исследования, w_показывают, w_продуктивнее, w_одной, w_стороны, w_другой, w_конечно, w_правда, w_считают, w_коллеги, w_хватает, w_общения, w_иногда, w_удобна, w_менее, w_меняет, w_короче, w_говоря, w_плюсы, w_минусы, w_перевешивают, w_перевешивает, w_свобода, w_имеет, w_больше, w_людей, w_работают, w_хорошее, w_явление, w_часто, w_более, w_продуктивны, w_говорят, w_можно, w_созваниваться, w_видеосвязи, w_почему, w_думаешь, w_есть]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on taking a position.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson02.listen.001
  lesson_content_key: ru.b2.unit01.lesson02.dovody_i_fakty
  type: listen_select
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on giving reasons and evidence.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson03.translate.001
  lesson_content_key: ru.b2.unit01.lesson03.drugaya_storona
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on acknowledging the other side.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson04.match.001
  lesson_content_key: ru.b2.unit01.lesson04.vozrazhenie
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ru, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Russian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson05.choose.001
  lesson_content_key: ru.b2.unit01.lesson05.chtenie_argumenta
  type: multiple_choice
  frame: {text: '{item}', language_code: ru, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading an argument.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson06.translate.001
  lesson_content_key: ru.b2.unit01.lesson06.zashchita_pozitsii
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on defending a position.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson01.order.002
  lesson_content_key: ru.b2.unit01.lesson01.tochka_zreniya
  type: word_order
  frame: {text: 'Работа из дома лучше, чем {item} в офисе.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_работа}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Работа из дома лучше, чем {item} в офисе.', language_code: ru, direction: ltr}
  feedback_frame: {text: Working from home is better than working at the office. работа means work., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson01.fill.003
  lesson_content_key: ru.b2.unit01.lesson01.tochka_zreniya
  type: fill_in_blank
  frame:
    text: Работа из {item} экономит время. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_дома}
    hint:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_дома}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Working from home saves time. дома means at home., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson01.translate.004
  lesson_content_key: ru.b2.unit01.lesson01.tochka_zreniya
  type: translation
  frame: {text: I think that working from home is better than working at the office., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_офисе}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Я считаю, что работа из дома лучше, чем работа в {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: I think that working from home is better than working at the office. The model claim for this unit., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson02.order.002
  lesson_content_key: ru.b2.unit01.lesson02.dovody_i_fakty
  type: word_order
  frame: {text: 'Работа из дома помогает {item} время.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_экономить}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Работа из дома помогает {item} время.', language_code: ru, direction: ltr}
  feedback_frame: {text: Working from home helps you save time. экономить means to save., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson02.fill.003
  lesson_content_key: ru.b2.unit01.lesson02.dovody_i_fakty
  type: fill_in_blank
  frame:
    text: Ты {item} много времени. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_экономишь}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_экономишь}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: You save a lot of time. экономишь means you save (informal)., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson02.translate.004
  lesson_content_key: ru.b2.unit01.lesson02.dovody_i_fakty
  type: translation
  frame: {text: 'Firstly, you save commute time.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_время}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Во-первых, ты экономишь {item} на дорогу.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Firstly, you save commute time. время means time.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson03.order.002
  lesson_content_key: ru.b2.unit01.lesson03.drugaya_storona
  type: word_order
  frame: {text: 'С другой {item}, мне не хватает общения с коллегами.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_стороны}
  answer_derivation:
    kind: render_frame
    frame: {text: 'С другой {item}, мне не хватает общения с коллегами.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Dima: On the other hand, I miss the contact with colleagues. стороны means side (genitive).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson03.fill.003
  lesson_content_key: ru.b2.unit01.lesson03.drugaya_storona
  type: fill_in_blank
  frame:
    text: Конечно, это {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_правда}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_правда}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Of course, that''s true. правда means truth (also ''right?'' as a tag question).', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson03.translate.004
  lesson_content_key: ru.b2.unit01.lesson03.drugaya_storona
  type: translation
  frame: {text: My colleagues are friendly., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_коллеги}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Мои {item} дружелюбны.', language_code: ru, direction: ltr}
  feedback_frame: {text: My colleagues are friendly. коллеги means colleagues., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson04.order.002
  lesson_content_key: ru.b2.unit01.lesson04.vozrazhenie
  type: word_order
  frame: {text: 'Короче {item}, работа из дома лучше.', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags: {semantic: w_говоря}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Короче {item}, работа из дома лучше.', language_code: ru, direction: ltr}
  feedback_frame: {text: 'In short, working from home is better. говоря means saying (as in the phrase for ''in short'').', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson04.fill.003
  lesson_content_key: ru.b2.unit01.lesson04.vozrazhenie
  type: fill_in_blank
  frame:
    text: У этого решения есть явные {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_плюсы}
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_плюсы}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: This solution has clear advantages. плюсы means advantages; pros., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson04.translate.004
  lesson_content_key: ru.b2.unit01.lesson04.vozrazhenie
  type: translation
  frame: {text: This idea also has disadvantages., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags: {semantic: w_минусы}
  answer_derivation:
    kind: render_frame
    frame: {text: 'У этой идеи есть и {item}.', language_code: ru, direction: ltr}
  feedback_frame: {text: This idea also has disadvantages. минусы means disadvantages; cons., language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson06.order.002
  lesson_content_key: ru.b2.unit01.lesson06.zashchita_pozitsii
  type: word_order
  frame: {text: 'Почему ты так {item}?', language_code: ru, direction: ltr}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_думаешь}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Почему ты так {item}?', language_code: ru, direction: ltr}
  feedback_frame: {text: 'Why do you think that? Почему ты так думаешь? asks a debating partner to support their claim -- the cue to give your reasons and evidence.', language_code: en, direction: ltr}
- content_key: practice.en-ru.ru.b2.unit01.lesson06.fill.003
  lesson_content_key: ru.b2.unit01.lesson06.zashchita_pozitsii
  type: fill_in_blank
  frame:
    text: В этом что-то {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_есть}
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags: {semantic: w_есть}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: There's something to that. / You have a point. В этом что-то есть concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion., language_code: en, direction: ltr}
