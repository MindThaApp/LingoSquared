templates:
- content_key: practice.it-hi.hi.a1.unit18.lesson01.choose.001
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमरा indica una stanza e कमरे più di una; बाथरूम e बेडरूम sono prestiti dall'inglese, mentre रसोई è la parola hindi per «cucina».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit18.lesson01.listen.002
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Un nome maschile che finisce in -ा al plurale prende -े: कमरा, कमरे.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit18.lesson01.order.003
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: word_order
  frame:
    text: घर में एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: घर में एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'एक è il numero uno e fa anche da articolo indeterminativo («un», «una»): घर में एक रसोई है.'
    language_code: it
    direction: ltr
