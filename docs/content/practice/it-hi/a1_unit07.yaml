templates:
- content_key: practice.it-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकानदार è formato da दुकान (negozio) più -दार, una desinenza comune per indicare chi tiene o possiede qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमीज़ e टोपी sono nomi femminili, mentre बैग è maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'यह (questo) sta subito prima del nome a cui si riferisce: मुझे यह कमीज़ चाहिए.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं è un no cortese; सिर्फ़ limita la richiesta soltanto a questo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'In hindi non ci sono articoli: per questo बाज़ार può significare «un mercato» o «il mercato».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: Vorrei questa camicia.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए resta uguale per ogni parlante, e यह indica il nome che lo segue subito.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In un negozio hindi chi vende è il दुकानदार e il luogo è la दुकान; il mercato vero e proprio è il बाज़ार.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सस्ता e महंगा cambiano come मेरा e मेरी: i nomi femminili vogliono सस्ती e महंगी.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'टोपी è femminile, quindi l''aggettivo termina in -ी: सस्ती o महंगी.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ è femminile, quindi l'aggettivo è महंगी e non महंगा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग è maschile, quindi l'aggettivo è सस्ता e non सस्ती.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Quanto costa questa camicia? (alla lettera: questa camicia è di quanto?)'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Il का o की in una domanda sul prezzo concorda con la cosa di cui si chiede il prezzo, non con कितने: कमीज़ è femminile, quindi की.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Quanto costa questa borsa? (alla lettera: questa borsa è di quanto?)'
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Il का o की in una domanda sul prezzo concorda con la cosa di cui si chiede il prezzo: बैग è maschile, quindi का.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खरीदते हैं dopo चलो fa una proposta, mentre खरीदना è la forma del dizionario per «comprare».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: या unisce le due scelte, e la domanda è data solo dal tono ascendente e dal punto interrogativo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते con हैं dopo चलो significa «compriamo»; la forma in -ते non dipende dal genere del gruppo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In यह टोपी पाँच सौ रुपये की है, की concorda con il nome femminile टोपी.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: Compriamo qualcosa!
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो più un verbo plurale in -ते con हैं è il modo abituale per fare una proposta.
    language_code: it
    direction: ltr
