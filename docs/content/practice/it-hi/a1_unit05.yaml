templates:
- content_key: practice.it-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माता-पिata (genitori) unisce माता, parola formale per «madre», e पिता (padre), proprio come दादा-दादी unisce entrambi i nonni.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: L'hindi distingue i nonni paterni (दादा, दादी) da quelli materni (नाना, नानी); l'italiano usa le stesse parole per entrambi.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'बड़ा e छोटा si usano con i nomi maschili, बड़ी e छोटी con quelli femminili; indicano anche l''età: maggiore o minore.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'I termini di parentela hindi sono maschili o femminili a coppie: भाई e बहन, दादा e दादी, नाना e नानी.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई è maschile, quindi vuole मेरा; una parola femminile come बहन vuole मेरी.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन è femminile, quindi il possessivo è मेरी, non मेरा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Per rispetto verso una persona anziana, मेरा diventa मेरे e है diventa हैं, anche se si tratta di una sola persona.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में dopo il nome di una città significa «a» o «in», e il verbo con un soggetto plurale di rispetto è रहते हैं.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बड़ा e छोटा concordano con il nome maschile भाई, e qui एक significa «un» e non «uno solo».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: परिवार è trattato come singolare e maschile, quindi il verbo è रहता है.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con i nonni, che sono rispettati e quindi al plurale, il verbo è रहते हैं e non रहता है.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: छोटी è la forma femminile perché बहन è femminile; per un fratello sarebbe छोटा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: I miei genitori vivono a {city}.
    language_code: it
    direction: ltr
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: I genitori sono persone anziane da rispettare, quindi si usano मेरे e il verbo plurale रहते हैं.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: Dove vive la tua famiglia? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con il formale आप si direbbe आपका परिवार कहाँ रहता है?
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: Questo è mio padre. (detto con rispetto)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Il rispetto si mostra due volte: मेरे al posto di मेरा e हैं al posto di है.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'hindi ha due parole per «nonno» e due per «nonna», a seconda che siano dalla parte del padre o della madre.
    language_code: it
    direction: ltr
