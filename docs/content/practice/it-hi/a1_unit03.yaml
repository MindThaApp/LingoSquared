templates:
- content_key: practice.it-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I giorni della settimana in hindi terminano in -वार (giorno della settimana), quindi सोमवार, मंगलवार e रविवार hanno la stessa terminazione.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I nomi dei mesi derivano dall'inglese, per questo जनवरी, मार्च e दिसंबर sono facili da riconoscere.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अगली significa prossima e concorda con un nome femminile: अगली क्लास è la prossima lezione, mentre con un nome maschile si usa अगला.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: आज (oggi) non richiede parole aggiuntive, ma un giorno della settimana vuole को (सोमवार को, di lunedì) e un mese vuole में (जनवरी में, a gennaio).
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Il giorno della settimana è il soggetto della frase, quindi आज सोमवार है significa letteralmente «Oggi lunedì è».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'को dopo un giorno della settimana indica il momento: सोमवार को significa «di lunedì».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी concorda con il nome femminile तारीख़, perciò termina in -ी.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'में dopo un mese significa «a/in»: जनवरी में è «a gennaio».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कब significa quando e si trova dove andrebbe la risposta: अगली क्लास मंगलवार को है.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं è la risposta di ogni giorno a un ringraziamento o a una scusa, come «non c'è problema».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: Che giorno è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा significa «quale»; in आज कौन सा दिन है? chiede quale giorno della settimana è.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: Il mio compleanno è a {month}.
    language_code: it
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: I mesi vogliono में, mentre i giorni della settimana vogliono को.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: La lezione di yoga è {day}.
    language_code: it
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: I giorni della settimana sono nomi maschili, e को indica il giorno in cui accade qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: Quando è il tuo compleanno? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con il formale आप si dice आपका जन्मदिन कब है?
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In devanagari i nomi dei giorni e dei mesi si scrivono senza maiuscole, perché questa scrittura non ha le lettere maiuscole.
    language_code: it
    direction: ltr
