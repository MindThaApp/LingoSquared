templates:
- content_key: practice.it-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम è un nome maschile, quindi la domanda è आज मौसम कैसा है?, con कैसा e non कैसी.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le parole del tempo come धूप, बारिश e हवा si usano direttamente con है: आज धूप है significa «oggi c''è il sole».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'In hindi si nomina il fenomeno atmosferico e si aggiunge है, senza un verbo impersonale: आज धूप है.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा concorda con il nome maschile मौसम.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: धूप è femminile, ma है resta invariato per una cosa sola.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: Oggi c'è il sole.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: In hindi, per dire «soleggiato» si usa il sostantivo धूप con है, non un aggettivo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'In hindi il tempo atmosferico si esprime con dei sostantivi: धूप è il sole, बारिश è la pioggia e हवा è il vento.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'गर्म resta invariato con ogni sostantivo, mentre ठंडा cambia: ठंडा al maschile, ठंडी al femminile.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.match.002
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Aggettivi del tempo: गर्म non cambia al variare del genere, mentre ठंडा e ठंडी sì.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.order.003
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज मौसम बहुत {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मौसम è maschile, quindi ठंडा e बुरा prendono la forma in -ा, mentre गर्म non cambia mai.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.order.004
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज हवा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आज हवा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हवा (vento) è femminile, quindi l''aggettivo termina in -ी: ठंडी हवा.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.fill.005
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: fill_in_blank
  frame:
    text: आज मौसम {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मौसम è maschile, quindi l'aggettivo termina in -ा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.translate.006
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Oggi fa caldo.
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: गर्म resta invariato, qualunque sia il sostantivo a cui si riferisce.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.translate.007
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Oggi ci sono nuvole.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Qui बादल è usato al plurale, quindi il verbo è हैं.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson02.translate.008
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Oggi fa molto freddo.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहुत sta prima dell'aggettivo, e ठंडा concorda con मौसम.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson03.choose.001
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाहर significa «fuori», e चलो, बाहर जाते हैं! è un invito ad andare fuori.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson03.fill.002
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: fill_in_blank
  frame:
    text: चलो, {item} जाते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बाहर è un avverbio, quindi non cambia mai per genere o numero.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit19.lesson03.translate.003
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: translation
  frame:
    text: Andiamo fuori!
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} जाते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो seguito da un verbo in -ते con हैं è il modo abituale per proporre di fare qualcosa insieme.
    language_code: it
    direction: ltr
