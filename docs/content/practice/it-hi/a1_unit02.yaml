templates:
- content_key: practice.it-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I numeri hindi sono irregolari e vanno imparati uno per uno; per esempio छह è sei e सात è sette.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I numeri hindi da undici a novantanove sono irregolari, quindi ciascuno, come पंद्रह (quindici) o पचास (cinquanta), va imparato separatamente.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'I nomi hindi come नंबर, फ़ोन e कीमत si usano senza articolo: è il contesto a far capire se significa «un prezzo» o «il prezzo».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी significa «suo/sua» e concorda con il sostantivo femminile कीमत, per questo termina in -ी e non in -ा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'In hindi il numero precede ciò che si conta e il verbo है resta alla fine: इसकी कीमत पचास रुपये है.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Qual è il suo prezzo?
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'L''hindi mantiene nelle domande lo stesso ordine delle parole dell''affermazione: इसकी कीमत पचास रुपये है risponde a इसकी कीमत क्या है?'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'I possessivi concordano con la cosa posseduta: आपका फ़ोन नंबर usa il maschile आपका, mentre आपकी उम्र usa il femminile आपकी.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'L''età si esprime con un numero di साल (anni) più है: letteralmente «La mia età è trenta anni».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका è il «tuo» di cortesia (Lei), qui maschile perché नंबर è maschile; con तुम si direbbe तुम्हारा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (anno) non cambia al plurale dopo un numero: तीस साल significa «trent''anni».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Ho {n} anni.
    language_code: it
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र è un sostantivo femminile, quindi il possessivo è मेरी e non मेरा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Qual è il suo numero di telefono? (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: In hindi il numero di telefono si legge cifra per cifra, per esempio छह दो आठ तीन पाँच.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dopo un numero superiore a uno, il denaro si conta con il plurale रुपये; il singolare è रुपया.
    language_code: it
    direction: ltr
