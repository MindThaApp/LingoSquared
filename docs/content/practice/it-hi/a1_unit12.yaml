templates:
- content_key: practice.it-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Al passato, था e थी prendono il posto di है e concordano con il soggetto: दिन अच्छा था, फ़िल्म अच्छी थी.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा concorda con il sostantivo maschile दिन; con un sostantivo femminile sarebbe कैसी.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी è femminile perché दुकान è femminile, e anche थी concorda con essa.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी è il passato femminile di «essere» e concorda con il sostantivo femminile फ़िल्म.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Il film era bello.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म è femminile, quindi sia l'aggettivo sia il passato di «essere» prendono la forma femminile.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Il negozio di tè era molto bello.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की collega चाय al sostantivo femminile दुकान, e अच्छी e थी concordano con esso.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Il passato di जाना e di मिलना termina in -आ per un uomo e in -ई per una donna: गया o गई, मिला o मिली.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से qui significa «con»: प्रिया से मिला è «ho incontrato Priya», e la desinenza segue chi parla.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La desinenza -ई indica che chi parla è una donna.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il passato di मिलना concorda con chi parla, quindi una donna dice मिली.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Sono andata a casa. (detto da una donna)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Una donna usa गई; un uomo direbbe गया.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Ho incontrato Priya. (detto da una donna)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से dopo la persona incontrata significa «con»; la desinenza del verbo segue chi parla.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il passato di un verbo concorda con chi compie l''azione: un uomo dice मिला e una donna dice मिली.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले si usa con हम, तुम e वे: हम मिले, «ci siamo incontrati».'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con हम la forma del passato termina in -ए, come il plurale maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: Ci siamo incontrati.
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम richiede la forma plurale मिले, chiunque faccia parte del gruppo.
    language_code: it
    direction: ltr
