templates:
- content_key: practice.it-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''hindi ha due parole per dire «tu/Lei»: आप è formale e rispettoso, mentre तुम è informale e si usa con amici e persone della tua età o più giovani.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il verbo «essere» cambia con il soggetto: हूँ va con मैं, हो con तुम e हैं con आप.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'La parola interrogativa concorda con la persona a cui ci si rivolge: कैसे per un uomo e कैसी per una donna, mentre आप vuole sempre हैं.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Come stai? (informale, a un uomo)
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Con तुम il verbo è हो; se ti rivolgi a una donna, कैसे diventa कैसी: तुम कैसी हो?'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Come sta? (formale, a una donna)
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Il formale आप vuole हैं, che ha forma plurale, anche per una sola persona; कैसी è la forma femminile di «come».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा è un vero e proprio addio; nel parlato quotidiano नमस्ते vale sia come saluto iniziale sia come saluto di congedo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे trasforma la frase in un augurio (che resti bene), e आपका indica che si parla con il formale आप; con तुम si direbbe तुम्हारा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'L''hindi non ha articoli: नाम può significare «nome», «un nome» o «il nome» a seconda della frase.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le domande in hindi mantengono l''ordine della frase affermativa: la parola interrogativa कहाँ prende il posto della risposta (आप कहाँ से हैं? e मैं भारत से हूँ).'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: L'hindi mette il verbo alla fine, quindi मेरा नाम ... है è letteralmente «Il mio nome ... è».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से segue il luogo e significa «da»; è una posposizione, non una preposizione.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: È il «Piacere di conoscerti» formale, letteralmente «la gioia è avvenuta incontrandoLa»; la versione informale è तुमसे मिलकर अच्छा लगा.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Mi chiamo {name}.
    language_code: it
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम è un sostantivo maschile, quindi tutti, uomini e donne, dicono मेरा नाम.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Vengo da {place}.
    language_code: it
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Anche una donna dice मैं भारत से हूँ: il verbo हूँ non cambia in base al genere di chi parla.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Di dove sei? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Per fare la stessa domanda in modo formale si usa आप con हैं: आप कहाँ से हैं?'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'I sostantivi hindi sono maschili o femminili: दिन, नाम e योग sono maschili, खुशी è femminile.'
    language_code: it
    direction: ltr
