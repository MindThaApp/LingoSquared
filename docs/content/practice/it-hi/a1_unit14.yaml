    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: लंबा e लंबी sono la forma maschile e quella femminile dello stesso aggettivo, come बड़ा e बड़ी.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit14.lesson01.listen.002
