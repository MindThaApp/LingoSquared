  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''aggettivo segue la persona a cui si riferisce: मेरा भाई लंबा है, मेरी बहन लंबी है.'
    language_code: it
    direction: ltr
