templates:
- content_key: practice.it-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक è l'insegnante uomo e शिक्षिका l'insegnante donna; इंजीनियर vale per entrambi.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alcuni nomi di professione hindi hanno una forma femminile distinta, come शिक्षक e शिक्षिका, mentre i prestiti come इंजीनियर no.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'La parola per «insegnante» segue il genere di chi parla: शिक्षक per un uomo, शिक्षिका per una donna.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया è una donna, quindi è una शिक्षिका.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शिक्षिका forma il femminile con -इका, uno schema presente in diverse parole di origine sanscrita.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.fill.006
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: अर्जुन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इंजीनियर è la stessa parola per un uomo e per una donna.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Sono un'insegnante. (detto da una donna)
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Una donna dice शिक्षिका; un uomo direbbe शिक्षक.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Sono insegnante. (detto da un uomo)
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Un uomo dice शिक्षक; una donna direbbe शिक्षिका.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson01.translate.009
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Sono un ingegnere.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर non cambia al femminile e in hindi non esiste l'articolo indeterminativo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दफ़्तर è un nome maschile che significa «ufficio», e में dopo di esso significa «in ufficio».
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में dopo il luogo significa «in», e il luogo va prima del verbo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson02.fill.003
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: fill_in_blank
  frame:
    text: अर्जुन {item} में काम करता है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: काम करना significa «lavorare», e il luogo di lavoro vuole में.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson02.translate.004
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Lavoro in un ufficio. (detto da un uomo)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: In hindi non esiste l'articolo indeterminativo, e il luogo va prima di काम करता हूँ.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson02.translate.005
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Arjun lavora in un ufficio.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con un nome il verbo termina in है, non in हूँ, e -ता indica che Arjun è un uomo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते in तुम रोज़ दफ़्तर जाते हो è la forma in -ते usata con तुम quando ci si rivolge a un uomo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con तुम il verbo termina in -ते ed è seguito da हो, quando ci si rivolge a un uomo.
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson03.fill.003
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: fill_in_blank
  frame:
    text: तुम रोज़ दफ़्तर {item} हो? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Una domanda sì/no può iniziare con क्या, che però è facoltativo: basta l''intonazione ascendente.'
    language_code: it
    direction: ltr
- content_key: practice.it-hi.hi.a1.unit17.lesson03.translate.004
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: translation
  frame:
    text: Vai in ufficio ogni giorno. (informale, rivolto a un uomo)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con तुम il verbo termina in -ते ed è seguito da हो, per un uomo.
    language_code: it
    direction: ltr
