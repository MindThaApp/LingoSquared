templates:
- content_key: practice.ru-es.es.a1.unit10.lesson01.choose.001
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tiempo значит и «погода», и «время»: ¿Qué tiempo hace? — вопрос о погоде.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson01.listen.002
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lluvia — существительное «дождь», а llueve — глагол «идёт дождь».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson02.order.001
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: En julio hace {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Погода в испанском выражается глаголом hacer с существительным: hace calor — буквально «делает жару».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson02.translate.002
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: translation
  frame:
    text: В декабре холодно.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: En diciembre hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Frío здесь существительное после hace; «очень холодно» — hace mucho frío, а не muy frío.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson02.fill.003
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: fill_in_blank
  frame:
    text: Hoy {item} y hace frío. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Глаголу llover подлежащее не нужно: llueve значит просто «идёт дождь».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson02.order.004
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: Hoy está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Сегодня облачно. Nublado — прилагательное, поэтому оно употребляется с está, а не с hace.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson04.fill.001
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: fill_in_blank
  frame:
    text: Necesitamos agua {item} hace calor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Porque — одно слово без ударения — значит «потому что»; ¿por qué? — два слова с ударением — значит «почему?».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson04.translate.002
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: translation
  frame:
    text: В июле слишком жарко.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item} calor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Demasiado значит «слишком много» и стоит перед существительным: demasiado calor.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson05.match.001
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Es importante + инфинитив — это совет: es importante llevar agua.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson05.translate.002
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Слова о погоде: sol, lluvia, viento и nube — существительные, а nublado — прилагательное.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson06.choose.001
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Prefiero образовано от preferir: e меняется на ie — prefiero, prefieres.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson06.translate.002
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: translation
  frame:
    text: Ты прав.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Tienes {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'В испанском говорят не «быть правым», а «иметь разум»: tener razón.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit10.lesson06.order.003
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: word_order
  frame:
    text: Hay una {item} cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay una {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Здесь рядом есть магазин. Tienda — женского рода, поэтому с ним употребляется una.
    language_code: ru
    direction: ltr
