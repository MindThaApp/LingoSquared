templates:
- content_key: practice.ru-es.es.a1.unit06.lesson01.choose.001
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Agua — слово женского рода, но в единственном числе оно употребляется с el, потому что начинается с ударного a: el agua fría.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson01.listen.002
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У слов café, menú и sándwich на письме есть знак ударения; он показывает ударный слог.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un употребляется с существительными мужского рода (un café); перед существительными женского рода ставится una (una ensalada).
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: 'Мне, пожалуйста: {item}.'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Другой распространённый способ заказать — para mí + блюдо: para mí, un café.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Глагол querer меняет корень: quiero, quieres, quiere, но queremos.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson03.order.001
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: word_order
  frame:
    text: ¿Podemos ver el {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Можно нам посмотреть меню? ¿Podemos + infinitive? — вежливый способ о чём-то попросить.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: Приятного аппетита!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho говорят людям, которые собираются есть, даже незнакомым за соседним столиком.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson04.fill.001
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: fill_in_blank
  frame:
    text: La {item}, por favor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В Испании официант обычно ждёт, пока ты сам попросишь счёт.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson04.translate.002
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: translation
  frame:
    text: На десерт я хочу торт.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: De postre quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De postre значит «на десерт»; артикль перед pastel здесь не нужен.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson05.match.001
  lesson_content_key: es.a1.unit06.lesson05.leer_el_menu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Menú del día в Испании — это комплексный обед: закуска, основное блюдо, postre, а обычно ещё хлеб и напиток — всё за одну цену.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson06.translate.001
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comida значит и «еда», и «обед» — главный приём пищи в течение дня в Испании, который приходится на середину дня.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson06.choose.002
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Официант говорит ¿Qué quieren comer?, потому что quieren обращено к вам обоим.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit06.lesson06.match.003
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Quiero, quieres и quieren — всё это формы глагола querer, «хотеть».
    language_code: ru
    direction: ltr
