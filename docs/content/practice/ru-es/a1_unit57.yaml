  lesson_content_key: es.a1.unit57.lesson01.estudiar_y_una_formacion
  type: word_order
  frame:
    text: A los dos les gusta {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_estudiar
  answer_derivation:
