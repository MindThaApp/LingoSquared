schema_version: '1.0'
pack_key: practice.ru-es.a1.unit15
source_language: ru
target_language: es
unit_content_key: es.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u15
    - w_viejo
    - w_equipo
    - w_espacio
    - w_mudarme
    - w_cocinas
    - w_sentido
slot_presets:
  content: &id002
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u15
  viejo: &id001
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_viejo
  equipo: &id003
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_equipo
  espacio: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_espacio
  mudarme: &id005
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_mudarme
  cocinas: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cocinas
  sentido: &id007
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_sentido
templates:
- content_key: practice.ru-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Новая квартира больше старой. Конструкция más + прилагательное + que сравнивает два предмета.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сравнение в испанском: más ... que (больше, чем), menos ... que (меньше, чем) и tan ... como (так же ... как).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: Мы хорошая команда.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Bueno сокращается до buen перед существительным мужского рода в единственном числе: un buen equipo.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tan bien como значит «так же хорошо, как»: cocinas tan bien como yo.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más перед существительным значит «больше чего-то»: más espacio — больше места.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mudarse — переезжать на другую квартиру. Матео говорит quiero mudarme, потому что переезжает он сам.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Старая меньше. Поэтому я хочу переехать. Por eso значит «поэтому».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viejo — «старый» о вещах и людях; nuevo — его противоположность.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tan + наречие + como сравнивает двух людей, которые что-то делают одинаково хорошо.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: В этом большой смысл.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'По-испански говорят «имеет много смысла»: tiene mucho sentido.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Exacto! — быстрый способ согласиться: «точно!»'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Espacio — место или простор; más espacio para cocinar — больше места для готовки.
    language_code: ru
    direction: ltr
