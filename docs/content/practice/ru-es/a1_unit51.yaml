schema_version: '1.0'
pack_key: practice.ru-es.a1.unit51
source_language: ru
target_language: es
unit_content_key: es.a1.unit51.travel
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ahí
    - w_allá
    - w_andén
    - w_atención
    - w_billete
    - w_cuarenta
    - w_entrada
    - w_espera
    - w_ida
    - w_justo
    - w_llega
    - w_llegada
    - w_lleva
    - w_lugar
    - w_panel
    - w_precio
    - w_problema
    - w_quisiera
    - w_recto
    - w_retraso
    - w_sale
    - w_salida
    - w_suben
    - w_taquilla
    - w_tren
    - w_vuelta
templates:
- content_key: practice.ru-es.es.a1.unit51.lesson01.choose.001
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_billete
        - w_quisiera
        - w_ida
        - w_vuelta
        - w_taquilla
        - w_andén
        - w_sale
        - w_tren
        - w_llega
        - w_retraso
        - w_atención
        - w_lleva
        - w_lugar
        - w_entrada
        - w_salida
        - w_espera
        - w_recto
        - w_llegada
        - w_precio
        - w_cuarenta
        - w_ahí
        - w_panel
        - w_problema
        - w_justo
        - w_suben
        - w_allá
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о покупке билета.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson02.listen.001
