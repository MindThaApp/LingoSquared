- content_key: practice.ru-es.es.a1.unit51.lesson01.order.002
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: word_order
  frame:
    text: Quisiera un {item} a Toledo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_billete
  answer_derivation:
    kind: render_frame
    frame:
      text: Quisiera un {item} a Toledo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Я хотел бы билет до Толедо. billete значит «билет».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson01.fill.003
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: fill_in_blank
  frame:
    text: ¿Quiere un billete de ida o de ida y {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вам билет в один конец или туда и обратно? Quiere — вежливая форма usted глагола querer, здесь её используют с незнакомым сотрудником вокзала.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson01.translate.004
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: translation
  frame:
    text: У кассы обычно используют вежливую форму usted.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_taquilla
  answer_derivation:
    kind: render_frame
    frame:
      text: En la {item} se suele usar la forma de cortesía usted.
      language_code: es
      direction: ltr
  feedback_frame:
    text: У кассы обычно используют вежливую форму usted. К незнакомым людям, которые вас обслуживают, обращаются на usted, а не на tú.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson02.order.002
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: word_order
  frame:
    text: ¿De qué {item} sale el tren a Toledo?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_andén
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿De qué {item} sale el tren a Toledo?
      language_code: es
      direction: ltr
  feedback_frame:
    text: С какой платформы отправляется поезд до Толедо? andén значит «платформа».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson02.fill.003
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: fill_in_blank
  frame:
    text: El tren {item} a las diez menos cuarto del andén cinco. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Поезд отправляется без четверти десять с пятой платформы. Las diez menos cuarto использует ту же модель «без четверти», что и в уроке о времени.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson02.translate.004
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: translation
  frame:
    text: Во сколько прибывает поезд?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tren
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿A qué hora llega el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Во сколько прибывает поезд? ¿A qué hora llega ...? спрашивает о времени прибытия; llegar — правильный глагол, перед временем ставится a las.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson03.order.002
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: word_order
  frame:
    text: Atención, el tren a Toledo lleva {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_retraso
  answer_derivation:
    kind: render_frame
    frame:
      text: Atención, el tren a Toledo lleva {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Внимание: поезд до Толедо опаздывает. retraso значит «задержка».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson03.fill.003
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: fill_in_blank
  frame:
    text: El tren {item} diez minutos de retraso. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Поезд опаздывает на десять минут. Lleva retraso (буквально «несёт задержку») — естественный способ сказать, что что-то задерживается.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson03.translate.004
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: Поезд отправляется с третьей платформы вместо пятой.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_lugar
  answer_derivation:
    kind: render_frame
    frame:
      text: El tren sale del andén tres en {item} del andén cinco.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Поезд отправляется с третьей платформы вместо пятой. En lugar de значит «вместо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit51.lesson04.order.002
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
