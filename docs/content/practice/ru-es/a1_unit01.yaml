    language_code: es
    part_of_speech:
    - noun
    - adjective
    - adverb
    - phrase
    - verb
    agreement_tags:
      semantic: es_a1_u01_l02
  name_m: &id007
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_Carlos
      - w_Diego
  name_f: &id008
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_Ana
      - w_Lucía
  name: &id006
    language_code: es
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - w_Carlos
      - w_Diego
      - w_Ana
      - w_Lucía
  country: &id010
