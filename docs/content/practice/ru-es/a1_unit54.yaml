  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_allí
    - w_calma
    - w_corre
    - w_correr
    - w_corro
    - w_encanta
    - w_fútbol
    - w_moverse
    - w_nadar
    - w_semanas
    - w_yoga
templates:
