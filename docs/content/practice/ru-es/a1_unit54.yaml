  lesson_content_key: es.a1.unit54.lesson01.futbol_yoga_correr_y
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fútbol
        - w_yoga
        - w_correr
        - w_nadar
        - w_corre
        - w_encanta
        - w_corro
        - w_allí
        - w_moverse
        - w_calma
        - w_semanas
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о футболе, йоге, беге и плавании.'
    language_code: ru
    direction: ltr
